company:
  name: Cart.com
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Cart.com is a Houston-headquartered, 2020-founded private company combining
    commerce software and managed services with a physical fulfillment network.
    Its $180 million March 2026 growth-equity round is corroborated, but cumulative
    funding totals conflict and audited financial, customer, workforce, and
    transaction-term evidence remains unavailable in the assigned public record.
sections:
  - id: identity-and-business-model
    title: Identity and operating model
    body: >-
      Cart.com presents itself as a unified commerce and logistics provider rather
      than a pure software vendor or conventional third-party logistics operator.
      Its offer combines fulfillment infrastructure with order, inventory, and
      warehouse-management technology, plus marketplace, marketing, and customer
      engagement services. Tracxn dates the company to 2020, while both Tracxn and
      the March 2026 company release place headquarters in Houston. The integrated
      proposition is strategically coherent because software can coordinate demand,
      inventory, and routing across a physical network, but most detail about the
      resulting economics and service quality is company-issued. The evidence
      therefore establishes scope and identity more strongly than differentiated
      performance.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: capital-and-governance
    title: Capital formation and governance
    body: >-
      The clearest current financing fact is the $180 million growth-equity
      investment announced in March 2026 and led by Springcoast Partners, with
      PayPal Ventures, Arsenal Growth Equity, Mercury Fund, and Oak HC/FT also
      identified as investors. The transaction added Springcoast executive
      Russell Klein to the board. Historical funding evidence is less clean:
      Tracxn reports $735 million over twelve rounds, whereas Houston Innovation
      Map reports $872 million before the latest financing and more than $1
      billion afterward. Those totals should not be merged because they may use
      different definitions for equity, debt, and acquisition financing. Tracxn
      separately records $105 million of BlackRock venture debt in July 2024,
      underscoring the need for a security-level capitalization schedule.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: scale-and-milestones
    title: Scale indicators and development path
    body: >-
      Public scale indicators show a capital-intensive expansion path but are not
      consistently current. FreightWaves reported that the network reached ten
      fulfillment centers across seven markets in August 2022, with two-day
      delivery coverage for 95% of the United States and nearly 6,000 brand
      partners. An undated Fulfill.com profile now lists fourteen fulfillment and
      distribution centers and warehouse locations in eight states, but that
      supplier listing is not independent verification. The financing chronology
      and Tracxn's 2023 unicorn designation show repeated access to capital.
      However, stale customer counts and undated footprint data should not be used
      as current cover metrics without management confirmation, facility records,
      and customer-level reconciliation.
    claimRefs: [CO006, CO009, CO011, CO012, CO013, CO015]
    figureRefs: [FO001]
  - id: evidence-quality-and-open-diligence
    title: Evidence quality and unresolved diligence
    body: >-
      The available record is strongest on product breadth, named investors, and
      dated financing events; it is weakest on audited operating performance and
      present-day organizational scale. Built In's expressly AI-generated candidate
      FAQ flags undisclosed audited revenue and profitability and integration risk
      from acquisition-led expansion, but its disclaimer makes this a low-confidence
      adverse signal rather than verified proof. No precise current revenue,
      margin, EBITDA, cash-flow, customer, or headcount figure is supported by the
      assigned sources. Likewise, the full executive roster, voting control,
      liquidation preferences, debt covenants, and board rights remain private.
      Investment diligence should treat these as material evidence requests, not
      infer favorable answers from the absence of public disclosures or incidents.
    claimRefs: [CO007, CO008, CO014, CO016]
