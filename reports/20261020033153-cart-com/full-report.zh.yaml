      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可观察的客户边界是拥有多渠道销售或履约复杂度的 B2C 与 B2B 品牌和零售商。不同模块的用户不同：供应链和仓储团队使用履约与路由能力；电商和商品团队管理跨渠道库存与商品列表；客服团队修改和重新路由订单；CMO
              或增长负责人使用托管营销服务。因此，合同所有权可能根据切入产品落在运营、供应链、数字商业或营销部门，但来源未披露实际预算归属、合同结构、定价或交叉销售顺序。当商户的渠道、库存或配送复杂度足以让一个运营层胜过多个点供应商时，采用最为合理；公司声称可接入超过
              2,000 个渠道，其路由自动化投入也支持这一机制，但没有量化转化率或 ROI。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素包括全渠道复杂度、加快配送的压力、跨地点协调库存的需求，以及用自动化缩短运输时间和降低履约成本的需求。2026 年 3 月融资让 Cart.com
              有更多能力投资实体网络、预测分析、工作流自动化和智能体库存路由，但融资是投入，不是客户需求或优良单位经济的证明。主要约束在于要在宽广技术和服务栈上稳定执行：Built In 的 AI
              生成摘要将整合质量、运营效率、并购吸收和网络扩张列为关键韧性测试，而公开来源没有经审计的定价、留存、合同期限、利润率或客户集中度数据。因此，估值应建立在已核实的软件收入占比、贡献利润率、设施利用率、留存率和实施回本周期上，而不是宽泛的履约市场预测上。
            claimRefs:
              - CM011
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 品类增长不等于公司能获取市场
            body: 保留的来源没有量化 Cart.com 的 SAM、SOM、定价、软件收入占比、市场份额、利用率或客户经济性。应将宽泛的履约市场预测仅作背景，并在赋予市场增长溢价前要求运营数据。
            calloutType: risk
            claimRefs:
              - CM011
