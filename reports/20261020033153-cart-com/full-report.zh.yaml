        title: 风险姿态与优先级
        blocks:
          - type: paragraph
            body: >-
              最大的剩余风险来自 Cart.com 视为自身优势的同一套整合。公司称，每增加一个商业渠道都可能带来系统、供应商、复杂度和成本；其企业模式则用一个库存池和共享设施网络服务
              DTC、零售和批发。公司还称网络每年处理数千万个订单。这种广度使网络执行、系统安全和库存完整性成为高影响敞口，尽管指定证据没有量化失败频率。因此，热力图使用方向性而非概率评级。资本风险同样较高，因为最新披露的增长资本用于进一步扩张物流和产品，而早期融资包含债务。否决标准应包括发生重大安全或履约事件却未及时补救、限制运营的契约压力，或失去一名暴露出客户集中度超出投资判断上限的大客户。
