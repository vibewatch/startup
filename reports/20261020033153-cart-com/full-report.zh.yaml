      - number: '8.4'
        title: 退出准备度、尽调要求与投资逻辑破坏
        blocks:
          - type: paragraph
            body: >-
              退出准备度喜忧参半。规模化网络、企业客户参考、可观交易量和具备 IPO
              经验的新任董事都是积极前提，但不能替代经审计的分部经济性、持久留存或干净的资本结构表。在判断退出前，尽调应取得按软件、履约和托管服务划分的月度客户队列收入与毛利率；设施利用率和贡献利润率；客户集中度与
              NRR/GRR；现金烧钱速度和债务安排；以及每一项优先股和增长股权条款。投资逻辑破坏包括在盈利进展无法量化时再次大额融资、客户集中度恶化、整合进度落后，或优先股堆叠导致普通股投资者即使实现经营退出，也无法取得所需回报。
