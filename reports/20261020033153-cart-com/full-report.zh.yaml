      - number: '7.4'
        title: 资本、合作伙伴与集中度依赖
        blocks:
          - type: paragraph
            body: >-
              Springcoast 将 Cart.com 描述为覆盖软件、自动化和实体基础设施的单一平台，这种组合使其依赖融资、承运商、技术集成、设施和企业客户。InnovationMap 报道 Springcoast 于
              2026 年 3 月提供 $180 million 增长资本，并称资金将支持网络规模、AI 和工作流自动化。更早的公开历史还显示，2022
              年融资包含风险债务。这些事实说明外部资本推动了扩张，却没有揭示可用现金、烧钱速度、债务优先级、契约、清算优先权或再融资需求。保留的来源也没有披露客户集中度、续约率、承运商集中度、云依赖或合同救济。投资判断应要求股权结构表、债务安排、现金桥、头部客户队列、供应商图谱和经过测试的迁移方案，之后才能认为合作伙伴或流动性敞口已得到缓解。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
