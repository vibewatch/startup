      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 证据质量是眼下的闸门风险
            body: 不要把指定证据池中缺少事件、诉讼、集中度或契约记录解读为不存在；投资判断仍应以私有控制、法律、客户和融资证据为条件。
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: 可监测的投资逻辑破坏触发器
            body: 若尽调发现未补救的重大安全或履约事件、限制性契约压力、设施级认证失败、重大服务水平恶化，或客户集中度超过投资委员会上限，应升级处理或停止投资。
            calloutType: recommendation
            claimRefs:
              - CR013
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，投资判断风险高。Cart.com 再次吸引了 $180 million
              增长股权，并有可信证据显示实体和软件规模，但公开证据无法说明投资者按今天的价格能获得什么。审阅池中最近一次明确估值，是 2025 年 5 月一笔 $50 million 融资对应的 $1.6 billion
              投后估值。2026 年 3
              月公告没有更新估值，也没有披露工具优先级、清算优先权、稀释、债务或完全摊薄后的持股。因而，入场纪律应表达为条件而非点估值：按旧基准或更高价格进行投资判断，需要经审计的增长、利润率、留存、现金流和资本结构证据，而这些目前不公开。
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV014
              - CV016
