        blocks:
          - type: paragraph
            body: >-
              Cart.com 于 2026 年 3 月宣布获得 Springcoast Partners 领投的 $180 million 增长股权投资。公司与 Digital Commerce 360
              将资金用途描述为软件和 AI 开发、自动化、运营改善及扩大美国履约基础设施。InnovationMap 报道称，自 2020 年以来累计融资超过 $1 billion，并引用新一轮融资前约 $1.6
              billion
              的估值，但累计融资不等于手头现金。融资公告称该投资将强化资产负债表，却没有提供现金余额、烧钱速度、债务安排、契约条款、现金跑道或下一轮触发条件。财务尽调因此应将资本充足性、盈利能力和稀释列为未决投资判断事项。
