chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Cart.com 将自己定位为一体化商业与物流服务商，而不是纯软件厂商或传统第三方物流运营商。其方案把履约基础设施与订单、库存和仓库管理技术结合起来，并提供市场、营销和客户互动服务。Tracxn
              将公司成立时间标为 2020 年，Tracxn 与 2026 年 3 月公司公告都称总部位于
              Houston。软件可以在实体网络中协调需求、库存和路由，因此这一体化方案在战略上自洽；但有关其经济结果和服务质量的大部分细节仍来自公司自身。现有证据对业务范围和身份的支持强于对差异化表现的支持。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
