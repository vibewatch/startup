      - number: '3.2'
        title: 广度具有差异化，但相对表现没有基准
        blocks:
          - type: paragraph
            body: >-
              Cart.com 的公开差异化在于把履约运营、自有订单管理能力和商业服务结合起来，而不是提供单一的点产品。其解决方案页面描述了订单路由、库存分配、B2B 履约、市场运营、营销和客户互动；独立评审则描述了一套整合的
              OMS、WMS 和 TMS。这对企业买方而言是有意义的一体化方案，但不能证明 Cart.com
              在成本、准确率、正常运行时间或实施速度上胜过具名同行。因此，在指定证据池缺少直接材料时，矩阵将同行单元标为未知。定位图使用与已记录的商业模式广度和基础设施控制力相关的方向性序数分数，并非市场份额排名或独立测量的性能基准。
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP013
              - CP014
          - type: figure
