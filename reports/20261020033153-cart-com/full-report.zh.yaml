          detail: 假设其属于高控制力类别；在获得点名服务商证据前，广度留在中点。
        - label: 轻资产网络型 3PL
          x: 2
          'y': 1
          detail: 根据保留审阅中合作仓库的区别，归为较低基础设施控制力的典型。
        - label: 软件优先的履约服务商
          x: 2
          'y': 1
          detail: 面向较小商户的替代方案，属于更窄的软件主导型典型。
        - label: 内部多服务商组合
          x: 4
          'y': 3
          detail: 商户可以拼出广泛能力，但控制力取决于所选服务商和设施。
    approximationNotes: X 轴是分析师评分的解决方案广度，Y 轴是分析师评分的基础设施控制力，均采用 1 至 5 的序数尺度。分数是根据保留来源描述得出的方向性分类，不代表实测表现、市场份额或客户偏好；中点值表示点名同行的证据尚未解决。
    claimRefs:
      - CP011
      - CP015
      - CP016
  - id: FI001
    title: 从收入到毛利的证据桥
    type: flow
    summary: 公开来源展示了运营链条，但没有披露任何阶段的计费条款、收入结构、直接成本或毛利。
    data:
      nodes:
        - id: demand
          label: DTC 和 B2B 渠道的客户需求
          detail: 公开材料描述了全渠道客户活动，但没有披露合同业务量或集中度。
        - id: orchestration
          label: 订单与库存编排
          detail: Cart.com 软件跨渠道、跨地点路由和管理订单与库存。
        - id: network
          label: 仓储与履约网络
          detail: 公司称其拥有超过 850 万平方英尺的设施，并且每年处理数千万订单。
        - id: delivery
          label: 拣货、打包、运输和增值服务
          detail: 多种实体和托管服务带来人工、设施、自动化及承运商成本敞口。
        - id: billing
          label: 按未披露条款向客户计费
          detail: Fulfill.com 表示，具体费率取决于业务量、仓储和服务；未找到公开价目表。
        - id: gross-profit
          label: 收入减直接交付成本
          detail: 收入结构、确认方式、毛利率和贡献利润率仍不可得。
    approximationNotes: 仅为概念性运营链条；节点顺序不代表已披露的转化率、收入金额、利润率或量化瀑布。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI013
      - CI015
  - id: FE001
    title: 产品与运营架构图
    type: stack
    summary: 有证据支持的层级将客户工作流、编排、基础设施、实体执行和控制措施分开，不把路线图项目视为已部署。
    data:
      layers:
        - label: 客户与渠道界面
          detail: B2B 门户、平台、店面和客户服务工作流
          items:
            - B2B 与企业内部商务
            - 平台与电商管理
        - label: 商务运营
          detail: 目录、商品运营、CRO、定价、数据 feed 和重新定价工作流
          items:
            - 产品 feed 与库存同步
            - 转化优化与商品运营
        - label: 订单与库存编排
          detail: Constellation OMS 的路由、分配、修改和履约选择
          items:
            - 订单生命周期管理
            - 库存路由与分配
        - label: 数据与应用基础设施
          detail: 历史披露的 Google Cloud 事件系统、数据库、容器和分析
          items:
            - Pub/Sub、Cloud SQL、Spanner 和 GKE
            - BigQuery、Dataflow 和 Container Registry
        - label: 实体执行
          detail: 仓储、运输、退货和增值服务运营
          items:
            - 专有仓储技术
            - 履约与分销网络
        - label: 控制措施与路线图
          detail: 商户记录方控制，加上已宣布的 AI 和工作流自动化投资
          items:
            - 支付、税务、对账和异常控制
            - AI 能力与工作流自动化路线图
    approximationNotes: 逻辑层级由分析师根据引用的公开证据整理；它们不能证明当前生产边界、数据流或部署状态。
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 公开证据描述了从特定渠道需求走向更广泛托管服务的路径，但实际留存和扩张情况仍未披露。
    data:
      nodes:
        - label: 渠道需求
          detail: 品牌或机构需要履约、商务、平台或政府物流支持。
          touchpoints:
            - DTC
            - retail
            - wholesale
            - marketplace
            - public sector
        - label: 初始部署
          detail: 客户采用履约、OMS、WMS、TMS 或商务服务。
          touchpoints:
            - Operations team
            - commerce team
            - implementation
        - label: 运营可见性
          detail: 客户可见的仓库报告，以及统一的订单和库存视图，支持持续管理。
          touchpoints:
            - Reporting
            - inventory visibility
            - shipment status
        - label: 绩效复盘
          detail: 服务水平、准确率、成本和客户业务复盘都是明确的运营重点。
          touchpoints:
            - SLA review
            - accuracy
            - parcel cost
        - label: 交叉销售
          detail: 相邻的软件、物流、平台、营销或互动服务可以拓宽客户关系。
          touchpoints:
            - Software
            - logistics
            - managed services
        - label: 更广泛的商务关系
          detail: Cart.com 将履约、平台、营销以及客户获取和留存呈现为相互连接的增长与运营界面。
          touchpoints:
            - Fulfillment
            - marketplaces
            - marketing
            - customer acquisition and retention
    approximationNotes: 该顺序是对公开描述服务的分析图，不是实测漏斗；公开信息没有转化率、留存率或扩张率。
    claimRefs:
      - CU010
      - CU011
      - CU013
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 影响、可能性、缓释成熟度和剩余严重度均为基于分配证据的方向性判断，不是实测事件概率。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 网络执行
          values:
            - 中
            - 高
            - 部分
            - 高
        - label: 系统与安全
          values:
            - Unknown
            - 高
            - 未验证
            - 高
        - label: 并购整合
          values:
            - 中
            - 高
            - 部分
            - 中高
        - label: 资本与债务
          values:
            - 中
            - 高
            - 未验证
            - 高
        - label: 平台与承运商依赖
          values:
            - 中
            - 高
            - 部分
            - 中高
        - label: 客户集中度
          values:
            - Unknown
            - 高
            - 未验证
            - 高
    approximationNotes: 仅为分析师的方向性评级；保留来源没有提供事件频率、损失分布、客户集中度或概率估算。
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据链从融资和运营证明出发，经由定价缺口与资本密集度，最终得出继续研究的建议。
    data:
      nodes:
        - id: financing
          label: $180M 成长股权
          detail: 2026 年 3 月的融资确认其能够获得机构资本。
        - id: scale
          label: 运营规模
          detail: 网络、客户和订单量披露证明其具备商业实质。
        - id: hybrid
          label: 混合模式
          detail: 软件、服务、设施和并购需要综合评估。
        - id: price-gap
          label: 当前价格未知
          detail: 最新披露的估值仍是 2025 年 5 月 $1.6B 的投后估值标记。
        - id: terms-gap
          label: 经济性不可得
          detail: 财务指标、持股结构、摊薄和优先权条款没有公开。
        - id: recommendation
          label: 继续研究
          detail: 只有在数据室证据支持价格和回报后，才设定进入纪律。
    approximationNotes: 该有序流程是分析性的而非时间性的；其中不含隐含转化率、概率或按价值比例计算的规模。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
      - CV016
