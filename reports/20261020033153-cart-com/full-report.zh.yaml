  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场窄于全部电商支出，却宽于传统第三方物流类别。Cart.com
              提供全渠道履约与运输、订单和库存编排、商业软件、增长营销、市场赋能及客户互动的组合层。因此，最接近的经济边界是品牌和零售商支付给外包商业运营以及协调这些运营的软件的支出，而不是商户经手的商品交易总额。除非
              Cart.com 直接从中取得收入，否则库存采购、制造、承运商自营干线运输、通用 ERP 和媒体库存不应纳入核心边界。现状替代方案包括内部运营、分别采购 3PL
              和软件，以及更窄的点解决方案；公司自身也将渠道增加描述为系统、供应商和成本复杂度上升的来源。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定证据中唯一明确的外部市场规模序列来自 TAMradar：其估计电商履约服务市场 2024 年为 $123.68 billion，2030 年可能达到 $272.14 billion，复合年增长率为
              14%。抓取文本未披露地域、方法、样本，也未说明是否包含软件和托管商业服务，因此这些数字只能作为宽泛背景区间，不能当作 Cart.com
              的总可用市场。公司网络指标提供了另一种观察角度，但不能转换为收入或市场份额：FreightWaves 报道 2022 年有 7 个市场的 10 个履约中心，UpMarket 截至 2025 年 5 月报道有 18
              个设施、超过 10 million 平方英尺，TAMradar 则在 2026 年描述 14 个仓库和 8.5 million 平方英尺。不同定义和时间点无法从公开证据中调和。
