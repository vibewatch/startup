      - number: '4.3'
        title: 实体网络敞口主导投资判断问题
        blocks:
          - type: paragraph
            body: >-
              该模式把软件编排与仓库、劳动力、自动化、运输和库存路由运营绑在一起。这一组合可能改善客户结果，但也带来设施、劳动力、承运商和自动化成本，纯软件基准会忽略这些成本。公司宣称将把新增资本投入全国网络、工作流自动化、预测分析和
              AI，也凸显了这些运营依赖。一份相邻行业分析进一步警告，软件驱动的路由需要更紧密的网络编排，并要为配送中心和自动化投入资本。审阅来源没有量化毛利率、每单贡献利润率、利用率、每单劳动力成本、CAC、回本周期、留存率或客户集中度，因此不能依据公开证据判断利润率路径。
