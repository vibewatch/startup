      - number: '8.3'
        title: 情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持条件性情景，而非精确概率或回报倍数。乐观情景需要核实企业留存、有盈利的软件增长、改善中的履约贡献利润率、有纪律的并购整合以及不惩罚股东的新一轮条款；只有这样，才能评估相对 2025
              年基准的溢价。基准情景仅把 $1.6 billion
              当作过时参考，在标准化财务和持股条款可得之前不提供估值区间。悲观情景假设反复融资需求反映现金转换率低或整合拖累，因此历史估值应大幅折价。没有入场价、稀释、优先股堆叠、持有期和可信退出收入，任何情景都无法得出目标回报。
