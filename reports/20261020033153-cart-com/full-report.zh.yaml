      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比方法适配
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是 Cart.com 将企业商业软件、全国履约网络、具名品牌关系和可观订单吞吐结合起来。新资本可用于自动化、预测分析、智能体 AI 和网络投资；Russell Klein 既有的 IPO
              和盈利经验也提供了相关治理信号。反向逻辑同样重要：自有物流、并购和持续的设施扩张带来整合与资本密集度风险，软件倍数会掩盖这些风险。纯 3PL
              比较也会忽略软件和托管服务价值。因此，适当方法是分部加总或混合运营模型，但执行所需的分部收入、利润率、留存和现金流输入均缺失。
