  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 必要假设
      - 估值与回报逻辑
      - 概率信号与下行触发条件
    rows:
      - - 乐观
        - 企业留存强劲，软件和履约利润率改善，自动化落地成功，融资条款不过度惩罚现有股东。
        - 只有在掌握经审计的分部经济性和持股结构后，才能检验相对于 $1.6B 历史估值的溢价是否合理。
        - 无法依据公开信息赋予概率；留存疲弱、利润率改善停滞或整合失误都会使该情景失效。
      - - 基准
        - 运营规模得以维持，但分部经济性和 2026 年 3 月融资的证券条款仍不透明。
        - 仅把 $1.6B 作为历史参考，暂不设定数值化回报区间。
        - 当前证据支持继续研究；若再次进行不透明融资且仍无盈利证明，投资判断会进一步转差。
      - - 悲观
        - 资本密集度、并购整合或客户集中度导致反复融资和现金转化疲弱。
        - 要求相对 $1.6B 有实质折价，并附带下行保护；确切价值仍无证据支持。
        - 利用率下降、客户流失、契约压力或优先权悬置都会触发该情景。
    notes: 由于缺少当前估值、收入、利润率、现金流、净债务、摊薄、优先权、持有期和退出倍数输入，情景区间有意保持定性。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV013
      - CV014
      - CV016
