      - number: '3.3'
        title: 打包可制造切换摩擦，商业不透明则削弱可比性
        blocks:
          - type: paragraph
            body: >-
              Cart.com
              面向企业客户销售组合服务，按定制报价，独立评审称没有公开价目表，也未披露最低交易量。把履约、软件、市场运营和托管服务放在同一关系下，可能减少供应商协调并加深工作流整合；但同一设计也可能提高切换成本，因为库存配置、路由规则、集成和外包流程需要一起迁移。这是基于机制的推断，不是已实现留存的证据：指定来源没有披露合同期限、流失率、NRR、SLA
              积分、实际折扣或实施成本。资本和自有网络可能支持全国配送，但在把打包服务视为经济上更优之前，买方仍需设施级服务数据和可比的完整报价。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
