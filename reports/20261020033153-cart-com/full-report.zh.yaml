  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构宽广，但经济性不透明
        blocks:
          - type: paragraph
            body: >-
              Cart.com
              公开展示的组合方案涵盖订单管理软件、商业服务、履约、运输及相关仓储运营。这样的广度创造了多个可能的变现面，但审阅材料未说明收入中有多少来自软件、托管服务、仓储、处理、运输或增值工作，也未披露合同期限、最低承诺、用量分层、收入确认政策或经常性与交易性收入的比例。Fulfill.com
              表示，潜在客户只有在适配沟通后才会收到准确报价，费率取决于订单量、仓储需求和服务内容。因此，可投资结论是收入质量未经核实的多元化运营模式，而不是已经证明的 SaaS 式收入结构。
