            body: >-
              Cart.com 的运营模式把实体履约与订单、库存、仓库、店面和渠道软件结合起来。FreightWaves 报道公司在 2022 年新增 1.6 million 平方英尺并达到 7 个市场的 10
              个中心；Fulfill.com 目前列出分布于 8 个州的仓库地点和广泛的处理服务。该平台还通过多次并购组装而成：Wikipedia 记录截至 2022 年 3 月在软件、营销和物流领域的 6
              宗具名交易，Grokipedia 则称截至 2024 年底有 10
              宗并购。这些事实支持整合风险结论，却不等于控制已经失败。尽调应测试库存准确率、按时发货、损耗与损坏、退货、正常运行时间、灾难恢复、被收购系统迁移和设施级质量指标。持续的服务水平违约或未核对的库存差异应触发对投资逻辑的复核。
