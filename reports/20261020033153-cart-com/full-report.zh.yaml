      - number: '1.3'
        title: 规模指标与发展路径
        blocks:
          - type: paragraph
            body: >-
              公开规模指标显示出资本密集型扩张路径，但时效并不一致。FreightWaves 报道称，截至 2022 年 8 月，网络已覆盖 7 个市场的 10 个履约中心，为美国 95% 的地区提供两日配送，并拥有近
              6,000 个品牌合作伙伴。一份未注明日期的 Fulfill.com 资料目前列出 14 个履约与配送中心，仓库分布在 8 个州，但该供应商名录并非独立核验。融资时间线和 Tracxn 在 2023
              年将其列为独角兽，都显示公司曾多次获得资本支持。不过，在管理层确认、核实设施记录并逐一核对客户后，不应把过时的客户数和无日期的网络数据当作当前封面指标。
