        title: 资本形成与治理
        blocks:
          - type: paragraph
            body: >-
              当前最明确的融资事实是 2026 年 3 月宣布、由 Springcoast Partners 领投的 $180 million 增长股权投资；公告还列出 PayPal Ventures、Arsenal
              Growth Equity、Mercury Fund 和 Oak HC/FT 为投资方。交易后，Springcoast 高管 Russell Klein 加入董事会。历史融资证据则不够整齐：Tracxn 报告
              12 轮累计 $735 million，Houston Innovation Map 称最新融资前为 $872 million、融资后超过 $1
              billion。两组数字不应直接合并，因为它们对股权、债务和并购融资的定义可能不同。Tracxn 另记录 2024 年 7 月 BlackRock 提供的 $105 million
              风险债务，进一步说明有必要取得逐证券的资本结构表。
