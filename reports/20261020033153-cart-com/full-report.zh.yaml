  - id: TV002
    title: 正方与反方论点
    columns:
      - 视角
      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 正方论点
        - 新增成长资本可以支持软件、自动化、AI 和网络投资。
        - 经验证的部署里程碑，加上改善中的分部利润率，会强化这一论点。
      - - 正方论点
        - 已点名的企业品牌和每年数千万订单，说明业务具有运营价值。
        - 客户集中度、留存率和合同期限数据将决定这种价值能否持续。
      - - 反方论点
        - 设施、并购和扩张让执行与现金转化比纯软件模式更复杂。
        - 持续为正的贡献利润率和明确的整合目标会降低这一担忧。
      - - 反方论点
        - 公司关于 2025 年累计融资的披露早于一轮未披露当前估值和证券经济条款的 2026 年融资。
        - 经核对的股权结构表和完整融资文件可以消除定价悬念。
    notes: 这是一组有边界的论点，而非完整风险登记表；客户和运营相关说法包含公司发布的证据，需要通过数据室核验。
