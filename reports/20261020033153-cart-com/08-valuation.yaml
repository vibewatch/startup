  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure-gap
      missingEvidence: >-
        Audited revenue, gross margin, EBITDA, cash flow, retention, customer concentration, and
        segment economics for software, fulfillment, and managed services.
      whyItMatters: >-
        These inputs are required to select comparable multiples, assess cash conversion, define a
        valuation range, and calculate a target return.
      diligencePath: >-
        Obtain audited statements, monthly management accounts, cohort retention schedules, facility
        contribution margins, and a revenue-quality bridge through the data room.
      relatedQuestionRefs: [QV006]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: financing-terms-gap
      missingEvidence: >-
        The March 2026 purchase price, security type, fully diluted capitalization, liquidation
        preferences, participation rights, anti-dilution terms, debt balances, and seniority.
      whyItMatters: >-
        Enterprise value alone cannot determine investor proceeds when dilution, debt, and preferred
        claims are unknown.
      diligencePath: >-
        Review the signed financing documents, amended charter, investor-rights agreements, debt
        schedule, option ledger, and fully diluted waterfall before setting entry terms.
      relatedQuestionRefs: [QV009]
      relatedTableRefs: [TV001, TV002, TV003]
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: >-
        A reconciled sources-and-uses schedule explaining the difference between the $475 million
        company total disclosed in May 2025 and the later $872 million venture-capital estimate.
      whyItMatters: >-
        The difference may reflect debt, acquisition financing, or inconsistent capital definitions
        and prevents reliable dilution and capital-efficiency analysis.
      diligencePath: >-
        Reconcile every equity, debt, and acquisition-financing instrument from inception against
        the general ledger and fully diluted capitalization table.
      relatedQuestionRefs: [QV004]
      relatedTableRefs: [TV002, TV003]
