schemaVersion: "report-v2"
artifact: valuation
slug: cart-com
runDate: 2026-10-20
company:
  name: Cart.com
chapter:
  number: 8
  title: Valuation
  summary: >-
    Cart.com's $180 million March 2026 growth-equity financing validates continued investor
    support, but the reviewed disclosures omit the round valuation, security terms, operating
    metrics, and a reconcilable capitalization history. The appropriate stance is research-more:
    the May 2025 $1.6 billion post-money mark is a historical reference, not a defensible current
    entry price.
sections:
  - id: decision-and-price-discipline
    title: Decision and price discipline
    body: >-
      The recommendation is research-more, with medium confidence and high underwriting risk.
      Cart.com has attracted another $180 million of growth equity and has credible evidence of
      physical and software scale, but public evidence does not establish what an investor receives
      at today's price. The last explicit valuation in the reviewed pool is the $1.6 billion
      post-money mark attached to a $50 million financing in May 2025. The March 2026 announcement
      does not update that valuation or disclose instrument seniority, liquidation preferences,
      dilution, debt, or fully diluted ownership. Entry discipline should therefore be expressed
      as a condition, not a point estimate: underwriting at or above the old benchmark requires
      audited growth, margin, retention, cash-flow, and capitalization evidence that is not public.
    claimRefs: [CV001, CV004, CV007, CV014, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and comparable-method fit
    body: >-
      The thesis is that Cart.com combines enterprise commerce software with a nationwide
      fulfillment footprint, named brand relationships, and material order throughput. Fresh
      capital can fund automation, predictive analytics, agentic AI, and network investment, while
      Russell Klein's prior IPO and profitability experience adds a relevant governance signal.
      The anti-thesis is equally material: owned logistics, acquisitions, and continuing facility
      expansion create integration and capital-intensity risk that a software multiple would
      obscure. A pure 3PL comparison would likewise ignore software and managed-services value.
      The appropriate method is therefore a sum-of-parts or blended operating model, but the
      segment revenue, margin, retention, and cash-flow inputs required to execute it are absent.
    claimRefs: [CV002, CV003, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-return-logic
    title: Scenario and return logic
    body: >-
      Public evidence supports conditional scenarios rather than precise probabilities or return
      multiples. A bull case requires verified enterprise retention, profitable software growth,
      improving fulfillment contribution margins, disciplined acquisition integration, and
      non-punitive round terms; only then could a premium to the 2025 benchmark be evaluated. The
      base case treats $1.6 billion solely as a stale reference and withholds a valuation range
      until normalized financials and ownership terms are available. The bear case assumes that
      repeated capital needs reflect low cash conversion or integration drag, warranting a
      material discount to the historical mark. No scenario can produce a target return without
      entry price, dilution, preference stack, holding period, and credible exit proceeds.
    claimRefs: [CV004, CV005, CV007, CV009, CV010, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      Exit readiness is mixed. A scaled network, enterprise customer references, substantial
      transaction volume, and an added director with IPO experience are positive prerequisites,
      but they do not substitute for audited segment economics, durable retention, or a clean
      capitalization table. Before underwriting an exit, diligence should obtain monthly cohort
      revenue and gross margin by software, fulfillment, and managed services; facility utilization
      and contribution margin; customer concentration and NRR/GRR; cash burn and debt schedules;
      and every preferred-stock and growth-equity term. Thesis breaks include another large raise
      without measurable profitability progress, worsening customer concentration, integration
      slippage, or a preference stack that prevents common-equity investors from achieving the
      required return even at an operating exit.
    claimRefs: [CV001, CV008, CV009, CV012, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
