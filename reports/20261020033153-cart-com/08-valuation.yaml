        - "Do not underwrite an entry until financial and capitalization evidence is available."
      - - Confidence
        - Medium
        - "Financing and operating-footprint claims are documented; valuation inputs are not."
        - "Confidence applies to the need for more diligence, not to a company value."
      - - Risk rating
        - High
        - "The model combines software with owned logistics and acquisition integration."
        - "Require downside protection and proof of segment-level cash economics."
      - - Valuation stance
        - "Unknown; stretched at or above $1.6B without new proof"
        - "$1.6B is a May 2025 post-money reference, not a disclosed March 2026 valuation."
        - "Treat the historical mark as a negotiation ceiling pending audited evidence."
    notes: >-
      Assessments use only the reviewed public sources; no current share price, fully diluted
      capitalization, preference stack, audited financials, or target-return inputs were available.
    claimRefs: [CV001, CV004, CV007, CV013, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-backed argument
      - What would change the view
    rows:
      - - Thesis
        - "Fresh growth capital can support software, automation, AI, and network investment."
        - "Verified deployment milestones plus improving segment margins would strengthen the thesis."
      - - Thesis
        - "Named enterprise brands and tens of millions of annual orders indicate operating relevance."
        - "Customer concentration, retention, and contract-duration data would determine durability."
      - - Anti-thesis
        - "Facilities, acquisitions, and expansion make execution and cash conversion more complex than a pure software model."
        - "Sustained positive contribution margin and integration targets would reduce this concern."
      - - Anti-thesis
        - "The company's 2025 cumulative-funding disclosure predates a 2026 round that omitted current valuation and security economics."
        - "A reconciled cap table and complete financing documents could remove the pricing overhang."
    notes: >-
      This is a bounded thesis set rather than an exhaustive risk register; customer and operating
      claims include company-issued evidence and require data-room verification.
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV008, CV009, CV010, CV012, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Required assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - "Strong enterprise retention, improving software and fulfillment margins, successful automation, and non-punitive financing terms."
        - "A premium to the $1.6B historical mark is testable only after audited segment economics and ownership are known."
        - "Unassignable publicly; invalidated by weak retention, stalled margin progress, or integration misses."
      - - Base
        - "Operating scale persists, but segment economics and the March 2026 security terms remain opaque."
        - "Use $1.6B only as a historical reference and defer a numeric return range."
        - "Current evidence supports research-more; another opaque raise without profitability proof shifts the case down."
      - - Bear
        - "Capital intensity, acquisition integration, or customer concentration drives repeated financing and weak cash conversion."
        - "Require a material discount to $1.6B plus downside protection; exact value remains unsupported."
        - "Triggered by declining utilization, customer losses, covenant pressure, or preference overhang."
    notes: >-
      Scenario ranges are deliberately qualitative because current valuation, revenue, margin,
      cash flow, net debt, dilution, preference, holding-period, and exit-multiple inputs are absent.
    claimRefs: [CV004, CV005, CV007, CV009, CV010, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The evidence chain moves from financing and operating proof through pricing gaps and capital
      intensity to a research-more recommendation.
    data:
      nodes:
        - id: financing
          label: "$180M growth equity"
          detail: "March 2026 financing confirms access to institutional capital."
        - id: scale
          label: "Operating scale"
          detail: "Network, customer, and order-volume disclosures establish commercial substance."
        - id: hybrid
          label: "Hybrid model"
          detail: "Software, services, facilities, and acquisitions require blended underwriting."
        - id: price-gap
          label: "Current price unknown"
          detail: "The latest disclosed valuation remains the May 2025 $1.6B post-money mark."
        - id: terms-gap
          label: "Economics unavailable"
          detail: "Financial metrics, ownership, dilution, and preference terms are not public."
        - id: recommendation
          label: "Research more"
          detail: "Set entry discipline only after data-room evidence supports price and return."
    approximationNotes: >-
      The ordered flow is analytical rather than temporal; it contains no implied conversion rates,
      probabilities, or value-proportional sizing.
    claimRefs: [CV001, CV008, CV009, CV012, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the gating variable
    body: >-
      The company may be operationally substantial, but the reviewed evidence cannot support a buy
      decision without the March 2026 round price, preference stack, audited segment economics, and
      a fully diluted ownership schedule.
    claimRefs: [CV007, CV013, CV014, CV016]
