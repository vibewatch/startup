- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Apache Airflow
    - Core workflow engine and execution semantics
    - Apache Airflow open-source project
    - Ecosystem dependency; product fit weaker for users who reject workflows-as-code
  - - Astro Runtime
    - Astronomer-packaged Airflow distribution
    - Runtime image lifecycle, provider compatibility, backports
    - Version drift or provider conflicts can slow upgrades
  - - Clusters / Deployments / namespaces
    - Isolation and tenancy model
    - Kubernetes and cloud networking
    - Isolation complexity and CIDR/network planning matter for scale
  - - Remote Execution agents
    - Local task execution with Astro orchestration
    - Kubernetes, Helm, secrets backend, XCom/state backends
    - Customer setup burden and operational complexity
  - - Observe lineage and SLA layer
    - Cross-pipeline health, lineage, and RCA
    - OpenLineage, asset metadata, monitor configuration
    - Observability value depends on lineage completeness and signal quality
  - - Otto context engine
    - Agentic build/debug/upgrade workflows
    - Public docs, Astronomer KB, customer memory
    - Trust depends on correctness, permissions, and adoption
  - - Cosmos / dbt bridge
    - Renders dbt as Airflow DAGs
    - dbt project compatibility and Airflow task graph generation
    - Couples transformation workflow to orchestration assumptions
  notes: Architecture risk is concentrated in third-party ecosystem dependencies and in the extra setup burden of enterprise-grade isolation features.
