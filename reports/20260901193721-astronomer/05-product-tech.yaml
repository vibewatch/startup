tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Astro managed platform
    - Data/platform engineering teams
    - Core / mature
    - Managed Airflow with multi-cloud deployment, runtime packaging, and enterprise operations
    - Need deployment counts, upgrade cadence, and SLA attainment by segment
  - - Astro Observe
    - Platform and analytics reliability teams
    - Generally available, with some preview capabilities
    - Pipeline-aware observability, lineage, data products, SLAs, and RCA in the orchestration layer
    - Need attach rate and evidence of standalone willingness to pay
  - - Otto
    - Data engineers and platform operators
    - Newer but strategically important
    - Airflow-native agent with operational context, memory, and upgrade/debug workflows
    - Need real customer adoption, retention, and productivity proof beyond case studies
  - - Remote Execution
    - Regulated or hybrid platform teams
    - Emerging enterprise differentiator
    - Decouples orchestration from execution with outbound-only agents
    - Need operational complexity, performance, and support burden at scale
  - - Private Cloud
    - Security-sensitive enterprises
    - Enterprise / bespoke
    - Air-gapped and customer-managed deployment option
    - Need implementation time, services mix, and referenceability
  - - Astro CLI
    - Developers and DevOps
    - Mature open-source companion
    - Local run/test/deploy workflow linked to Astro
    - Need active-install and weekly-use metrics
  - - Cosmos
    - Analytics engineers using dbt
    - Growing ecosystem asset
    - Turns dbt projects into Airflow DAGs and task groups
    - Need contribution pattern and monetization linkage
  notes: The asset map blends commercial modules and enabling open-source assets because buyers evaluate the full operational stack together.
