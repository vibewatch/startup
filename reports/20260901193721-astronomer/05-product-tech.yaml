- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification
  - Status
  - Scope
  - Gap
  rows:
  - - SOC 2-aligned security controls
    - Described on security page
    - Policies and procedures based on AICPA SOC 2 controls
    - Public page is descriptive; certificate/report not included here
  - - TLS 1.2 and mTLS encryption
    - Enabled by default per security page
    - Service-to-service, client-service, and inter-cluster traffic
    - Need key-management detail and penetration-test evidence
  - - Shared responsibility model
    - Explicit
    - Astronomer secures platform; customers secure code, keys, roles, and networks
    - Customer misconfiguration risk remains material
  - - Private Cloud / no direct staff access
    - Explicitly called out
    - Customer-managed private-cloud environments
    - Need incident-support process detail and audit trail samples
  - - Enterprise controls
    - Published on pricing comparison
    - SSO, CI/CD enforcement, audit logging, SCIM, custom RBAC, IP allowlists, DR
    - Need adoption by tier and support burden
  - - Remote Execution security boundary
    - Explicit in docs
    - Outbound-only agents and local retention of code, secrets, logs, data
    - Need external validation of real-world compliance acceptance
  notes: This is a product-control inventory, not a substitute for diligence artifacts such as audit reports or security questionnaires.
