- id: TE002
  title: Workflow use-case table
  columns:
  - User job
  - Current workflow problem
  - Astronomer solution
  - Measurable benefit
  - Limitation
  rows:
  - - Run production Airflow reliably
    - Teams self-manage Airflow and spend time on infra upgrades and failures
    - Managed Astro runtime plus dedicated clusters / private cloud
    - Removes much of the platform-ops burden and centralizes deployments
    - Still assumes Airflow and Kubernetes-compatible operating model
  - - Debug incidents faster
    - Logs, lineage, and blast radius are fragmented across tools
    - Astro Observe plus Otto investigation flows
    - Quicker root cause visibility and AI-assisted triage
    - Value depends on broad instrumentation and adoption
  - - Keep sensitive execution local
    - Compliance or network rules block full SaaS execution
    - Remote Execution agents keep tasks, code, secrets, and logs in customer infra
    - Lets regulated teams use managed orchestration without moving data
    - Adds Kubernetes, secrets, and object-store setup requirements
  - - Bring dbt into orchestration
    - dbt runs separately from orchestration logic
    - Cosmos renders dbt models as Airflow tasks with testing
    - Unifies transformation and pipeline control
    - Still depends on dbt project quality and compatibility
  - - Onboard new data engineers
    - Institutional knowledge sits in docs and senior engineers’ heads
    - Otto memory and CLI workflows bring conventions into the tool itself
    - Reduces onboarding friction and repeated debugging work
    - Early feature maturity raises proof-of-value questions
  - - Operate multi-team platform environments
    - Many teams need isolated dev/prod environments on one control plane
    - Workspaces, Deployments, RBAC, audit, and dashboards
    - Standardizes shared-platform operations
    - Public documentation does not quantify governance overhead
  notes: Benefits are supported by official docs and case-study narratives rather than by benchmarked head-to-head tests.
