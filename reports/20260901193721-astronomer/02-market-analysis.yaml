tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to Astronomer
  rows:
  - - Broad workflow orchestration
    - Software and services coordinating business-process automation, IT/DevOps, data and analytics workflows, and application integration across cloud/on-prem/hybrid
    - Pure model training cost, standalone BI tools, database storage spend, generic professional-services transformation budgets
    - Enterprise IT, platform, operations, and transformation budgets
    - Useful outer TAM ceiling but substantially broader than Astronomer’s actual product wedge
  - - Data and analytics workflow orchestration
    - Pipeline scheduling, dependency management, monitoring, backfills, lineage-adjacent control planes, shared data-platform reliability tooling
    - Raw warehousing spend, BI seats, point ETL connectors without orchestration, one-off scripts
    - Data-platform leadership, platform engineering, analytics engineering
    - Core Astronomer category because Astro commercializes Airflow for production data workflows
  - - Managed Apache Airflow services
    - Hosted Airflow control planes, security/governance layers, scaling, observability, managed upgrades, support services
    - Free self-managed Airflow, unrelated BPM suites, low-code workflow builders
    - Data engineering and platform teams with CIO/CDO sponsorship
    - Direct market boundary where Astronomer competes most clearly with hyperscaler managed services
  - - AI workflow orchestration
    - LLM/agent workflow management, model lifecycle coordination, AI governance, AI pipeline orchestration, multi-agent workflow support
    - Foundation-model training spend, vector databases by themselves, standalone copilots without orchestration
    - AI/ML platform teams and enterprise AI programs
    - Fastest-growing adjacency because Airflow is increasingly used to operationalize AI and agentic workloads
  - - Generic low-code business workflow automation
    - Departmental app triggers, forms, approvals, marketing automation, citizen-developer automations
    - Shared data-platform infrastructure, DAG authoring, Kubernetes-based execution environments
    - Line-of-business operations managers and departmental budgets
    - Adjacent but not core; Astronomer’s Airflow-first, code-oriented posture makes this a weak fit
  notes: Market boundaries are intentionally layered because published workflow-orchestration reports use materially different perimeters.
