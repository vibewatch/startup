chapter:
  number: 2
  title: Market Analysis
  summary: 'Astronomer sells into a broad workflow-orchestration market that analysts size anywhere from roughly $8.5 billion to $21.9 billion today, plus a faster-growing AI workflow orchestration adjacency that one 2026 study sizes at $6.25 billion. The practical buying center is much narrower than those top-down TAMs: enterprise data, platform, and AI teams already living in or near Apache Airflow, where adoption is being pulled by AI productionization, hybrid-cloud complexity, and compliance but constrained by free open-source substitutes and hyperscaler-managed alternatives.'
sections:
- id: market-boundary-and-category-definition
  title: Market boundary and category definition
  body: 'Astronomer does not compete across the full software automation universe. The most useful outer boundary is the broader workflow-orchestration market, where analysts include software and services used to coordinate business-process automation, IT/DevOps workflows, data and analytics pipelines, and application integration across cloud, on-premises, and hybrid environments. That definition is materially broader than Astronomer’s actual wedge. Astronomer is specifically selling enterprise orchestration around Apache Airflow, which means its most relevant spend sits inside the data-and-analytics workflow slice plus the emerging AI-orchestration layer that grows out of those same pipelines. This is why top-down market reports produce numbers that are directionally helpful but strategically noisy: some include generic BPM or customer-experience orchestration, while others focus on AI orchestration, managed services, or platform segments. For diligence, the right framing is that Astronomer
    participates in a large and expanding control-plane category, but its realistic SAM is the subset of technically capable enterprises that need production-grade orchestration for data, ML, and agentic workflows rather than generic no-code process automation.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM005
