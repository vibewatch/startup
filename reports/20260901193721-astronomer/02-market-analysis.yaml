- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Digital transformation and process automation
    - Growth driver
    - Structural / ongoing
    - Expands broad workflow-orchestration spend across enterprises
    - Confirm whether Astronomer wins budgets from new projects or replaces existing scheduler/tooling spend
  - - AI and agentic workflows moving into production
    - Growth driver
    - Near term / active
    - Increases demand for orchestration, observability, and governance around ML and GenAI workloads
    - Verify what share of new Astronomer ARR is tied to AI/ML use cases versus conventional data engineering
  - - Hybrid and multi-cloud complexity
    - Growth driver
    - Current through medium term
    - Favors control planes that can orchestrate across public cloud, remote execution, and private infrastructure
    - Quantify how often deployment flexibility is the deciding factor in competitive evaluations
  - - Compliance and security requirements
    - Growth driver for enterprise-grade offerings
    - Current and rising
    - Benefits vendors that support VPC isolation, private cloud, and auditable execution
    - Request evidence on regulated-customer concentration and implementation burden
  - - Open-source Airflow as a free substitute
    - Constraint
    - Always-on
    - Keeps buyer power high and caps pricing for teams that can self-manage
    - Measure migration rate from self-managed Airflow to paid Astro tiers
  - - Hyperscaler managed-Airflow alternatives
    - Constraint
    - Current
    - MWAA and Cloud Composer satisfy many baseline managed-service needs
    - Request competitive win/loss data against MWAA, Composer, and adjacent Azure workflows
  - - Category-boundary ambiguity
    - Constraint
    - Current
    - Broad workflow TAMs can overstate near-term reachable spend for Astronomer
    - Build bottoms-up SAM using actual Airflow enterprise personas instead of generic workflow TAMs
  - - Governance and AI correctness gaps
    - Constraint
    - Current and rising with AI adoption
    - Orchestration alone does not guarantee model quality, lineage completeness, or safe agent behavior
    - Assess how much extra product or services spend customers need beyond orchestration
