      - number: '5.2'
        title: Architecture, execution, and developer workflow
        blocks:
          - type: paragraph
            body: >-
              The technical architecture combines open-source Airflow primitives with Astronomer-managed packaging and
              control. Airflow itself remains Python-defined workflows as code, with schedulers, tasks, dependencies,
              and a debugging UI. Astronomer organizes this into Workspaces, Deployments, and clusters. Standard
              clusters are multi-tenant but isolate Deployments into their own namespaces, while dedicated clusters give
              a single-tenant environment with more networking and region controls. Remote Execution extends this model
              further by splitting the product into an Astro-managed orchestration plane and a customer-managed
              execution plane where agents run tasks locally via outbound-only connections. This is important for
              regulated or latency-sensitive workloads because code, secrets, logs, and data can stay in the customer
              environment. On the developer side, Astro Runtime standardizes the Airflow distribution, the Astro CLI
              lets teams run and test Airflow locally and deploy to Astro, and Otto increasingly acts as a workflow
              copilot that can author, debug, investigate, and plan upgrades using operational context gathered from the
              platform itself.
