companyProfile:
  summary: >-
    Astronomer is a private enterprise infrastructure company built around Apache Airflow. Public sources place the
    company’s founding in 2018 and show an evolution from Airflow stewardship into a broader orchestration control plane
    spanning Astro managed Airflow, Observe, Otto, Remote Execution, Private Cloud, and Cosmos. The company now appears
    headquartered in New York, with deep historical roots in Cincinnati, where an early SEC Form D listed Astronomer,
    Inc. as a Delaware corporation operating from Cincinnati. Astronomer sells primarily to technical enterprise buyers
    that need reliable orchestration for data engineering, analytics, and AI/ML workflows, and it monetizes via a hybrid
    usage-based model across deployments, workers, and higher-value enterprise controls. Public evidence supports strong
    growth, high NRR, and 900+ enterprise customers, but disclosure on current ARR, concentration, margins, and
    financing terms remains incomplete.
  foundedDate: '2018-01-01'
  founders:
    - name: Pete DeJoy
      role: CEO & Co-founder
