      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Three forces are expanding demand. First, digital transformation and application sprawl create more
              cross-system work that must be scheduled, observed, and governed. Second, AI is moving from prototype
              notebooks into production workflows; Astronomer’s own 2026 survey evidence says 32% of Airflow users
              already have GenAI or MLOps use cases in production and that rate is materially higher among Astro
              customers. Third, hybrid-cloud and security requirements favor platforms that can keep orchestration logic
              consistent while letting execution live in managed, remote, or private environments. But those same forces
              also create adoption constraints. Open-source Airflow is a credible free substitute for teams willing to
              self-manage. AWS and Google both offer managed Airflow, while Azure occupies an adjacent data-integration
              position that can satisfy some buyer needs without an Airflow-first purchase. Category boundaries are also
              blurry: broad workflow TAMs overstate Astronomer’s reachable market, while AI-orchestration narratives can
              encourage premature revenue assumptions before governance, observability, and model-risk controls are in
              place. The net effect is a structurally attractive market with real growth, but not one where every
              orchestration dollar is realistically available to Astronomer.
