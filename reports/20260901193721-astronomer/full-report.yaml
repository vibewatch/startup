  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s product is best understood as a layered Airflow platform rather than a single application. At
              the center is Astro, the managed orchestration service that packages Apache Airflow for enterprise use.
              Around it, Astronomer has added multiple modules that solve adjacent operational jobs: Astro Observe for
              orchestration-native observability and lineage, Otto for AI-assisted data engineering work, Astro CLI for
              local development and deployment management, Private Cloud for customer-managed sensitive environments,
              Remote Execution for separating orchestration from task execution, and Cosmos for running dbt projects as
              Airflow DAGs. This module map matters because enterprises rarely buy “workflow scheduling” in the
              abstract. They buy a reliable way to build, deploy, monitor, secure, and evolve data and AI pipelines
              without turning their own platform team into full-time Airflow operators. The product definition is
              therefore a workflow control plane spanning authoring, runtime, deployment, operations, observability, and
              assisted remediation.
