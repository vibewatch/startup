  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              Astronomer does not compete across the full software automation universe. The most useful outer boundary
              is the broader workflow-orchestration market, where analysts include software and services used to
              coordinate business-process automation, IT/DevOps workflows, data and analytics pipelines, and application
              integration across cloud, on-premises, and hybrid environments. That definition is materially broader than
              Astronomer’s actual wedge. Astronomer is specifically selling enterprise orchestration around Apache
              Airflow, which means its most relevant spend sits inside the data-and-analytics workflow slice plus the
              emerging AI-orchestration layer that grows out of those same pipelines. This is why top-down market
              reports produce numbers that are directionally helpful but strategically noisy: some include generic BPM
              or customer-experience orchestration, while others focus on AI orchestration, managed services, or
              platform segments. For diligence, the right framing is that Astronomer participates in a large and
              expanding control-plane category, but its realistic SAM is the subset of technically capable enterprises
              that need production-grade orchestration for data, ML, and agentic workflows rather than generic no-code
              process automation.
            claimRefs:
