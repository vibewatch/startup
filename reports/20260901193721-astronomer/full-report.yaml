  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Astronomer typically lands on orchestration pain, proves reliability, then expands into more teams and modules.
    data:
      items:
        - label: Pain discovery
          detail: >-
            Prospects hit limits with self-managed Airflow, Composer, MWAA, Oozie, GitHub Actions, Domo, or fragmented
            internal tooling.
          tone: risk
        - label: Proof-of-value / migration
          detail: Astronomer or partners help migrate workflows, set up CI/CD, and stabilize the first production environment.
          tone: neutral
        - label: Production standardization
          detail: Teams run managed Airflow with better logging, observability, upgrades, and support.
          tone: positive
        - label: Cross-team expansion
          detail: More groups, deployments, dashboards, dbt jobs, and AI workloads move onto the platform.
          tone: positive
        - label: Module expansion
          detail: Accounts add Cosmos, Observe, Otto, or other platform capabilities as needs mature.
          tone: positive
    approximationNotes: >-
      Stages synthesize recurring patterns across public case studies rather than a disclosed funnel from Astronomer CRM
      data.
    claimRefs:
      - CU007
      - CU008
      - CU010
      - CU016
      - CU026
      - CU027
