  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis balance
        blocks:
          - type: paragraph
            body: >-
              Astronomer deserves to be taken seriously as an investment candidate because the non-price evidence is
              strong. The company appears to lead the managed-Airflow category, has expanded from orchestration into
              adjacent operating modules, and shows unusually robust public customer proof for a private infrastructure
              vendor. Growth and retention disclosures from 2025–2026 add to that positive case. The problem is that
              price discovery is much weaker than product discovery. Public sources do not disclose the Series D
              valuation in the company announcement, Crunchbase explicitly notes the round came without a public
              valuation, and accessible private-market aggregators acknowledge that pricing signals are sparse. That
              combination argues against a blind “buy the company” conclusion. Instead, the right stance is
              price-sensitive conditional interest: pursue if entry terms are anchored near the last evidenced valuation
              band or if downside protection offsets the opacity, but avoid paying a top-tier infrastructure premium on
              incomplete cap-table, concentration, and margin data. The investment committee should treat this as a
              potentially excellent company with only moderately trustworthy public valuation support.
            claimRefs:
