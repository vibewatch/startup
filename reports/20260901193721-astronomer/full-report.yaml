      - number: '1.3'
        title: Funding, scale, and commercial signals
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s financing path is one of the strongest public parts of the record. In March 2022 the company
              announced a $213 million Series C led by Insight Partners and paired it with the Datakin acquisition. In
              May 2025 it announced a $93 million Series D led by Bain Capital Ventures, with Salesforce Ventures and
              existing investors returning and Bosch Ventures identified as seeking to participate. Public commercial
              signals improved again in 2026: the company said it had just delivered its two most successful quarters,
              reported 55% year-over-year growth, 120%+ NRR, and 122% ARR growth in EMEA, and repeated the claim that
              more than 700 enterprises trust Astro. These are still company-authored metrics rather than audited
              financial disclosures, but they are directionally important because they suggest the company translated
              open-source relevance into enterprise monetization. What remains missing are audited revenue, gross
              margin, burn, cash runway, and a directly reviewed post-money valuation for the Series D round.
