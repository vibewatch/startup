      - number: '8.3'
        title: Bull, base, and bear underwriting
        blocks:
          - type: paragraph
            body: >-
              Scenario thinking is more reliable than point-estimate valuation for Astronomer. In the bull case, the
              company keeps compounding enterprise adoption, attaches modules such as Cosmos, Observe, and Otto broadly
              across its base, and preserves strong retention while Airflow and AI workflow demand keep expanding. That
              scenario can support a multi-billion-dollar outcome over time even if today’s public mark evidence is
              incomplete. In the base case, Astronomer remains a high-quality control-plane company but grows more like
              a strong, competitive infrastructure vendor than a category-escaping monopoly; retention stays healthy,
              pricing power exists but is not unlimited, and cloud-bundling pressure caps the multiple. In the bear
              case, one or more hidden issues—concentration, margin pressure from high-touch delivery, governance
              relapse, or a closing of the feature gap by bundled vendors—compress both growth and valuation
              simultaneously. Because public evidence on exact ARR and preference terms is incomplete, these scenarios
              should be read as entry-discipline frameworks rather than as tradable targets.
            claimRefs:
