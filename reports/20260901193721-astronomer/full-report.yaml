    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Astronomer should likely be valued against a premium infrastructure band, but public evidence does not justify
      using the most aggressive public-market multiples.
    data:
      items:
        - label: Lower-band mature infra reference
          value: 8
          unit: x revenue
        - label: Disciplined premium infra entry
          value: 10
          unit: x revenue
        - label: Base premium band
          value: 12
          unit: x revenue
        - label: Strong upper band
          value: 15
          unit: x revenue
        - label: Stretch best-in-class premium
          value: 20
          unit: x revenue
    approximationNotes: >-
      Bars are underwriting multiple bands synthesized from public comp ranges and private-mark uncertainty, not direct
      quotes for Astronomer stock.
    claimRefs:
