      - number: '2.2'
        title: Market sizing and estimate divergence
        blocks:
          - type: paragraph
            body: >-
              Published estimates diverge sharply, and the divergence itself is informative. The Business Research
              Company places workflow orchestration at $19.36 billion in 2025 and $21.93 billion in 2026, growing to
              $36.45 billion by 2030. Verified Market Reports publishes a much smaller workflow-orchestration snapshot
              of $8.45 billion in 2025 and $16.21 billion by 2033. SNS Insider, by contrast, isolates AI workflow
              orchestration at $4.63 billion in 2025 and $6.25 billion in 2026E but projects a far faster 35.3% CAGR
              through 2035. The safest interpretation is not to pick one “correct” TAM but to separate layers. Broad
              workflow orchestration captures a large automation control-plane budget. AI workflow orchestration is a
              smaller but much faster adjacency. Astronomer sits between them because Airflow is already a data-and-ML
              execution layer, and official Astronomer evidence shows Airflow increasingly being used for production AI
              workloads. That makes a broad-$20B ceiling too generous for near-term underwriting and the AI-only
              subsegment too narrow for the installed-base opportunity. A realistic investment frame is to treat the
              workflow-orchestration estimates as outer bounds, the AI-orchestration estimate as growth signal, and
              Airflow adoption metrics as the closest observable demand proxy.
