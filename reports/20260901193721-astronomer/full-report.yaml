      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s differentiation is real, but it is layered on top of dependencies the company does not wholly
              control. Its advantage comes from being the commercial steward of Airflow, shipping a managed runtime,
              adding enterprise controls, and then extending that base with observability, lineage, remote execution,
              private-cloud deployment, and AI-native tooling. Trust and compliance features reinforce the pitch:
              security documentation describes a multi-tenant control plane with customer-specific data planes, TLS and
              mTLS, time-limited staff access, shared-responsibility boundaries, and higher-tier controls such as SSO,
              audit logging, custom RBAC, SCIM, disaster recovery, and IP allowlists. The trade-off is that Astronomer
              remains deeply exposed to the health and direction of the Airflow ecosystem, to Kubernetes operating
              assumptions, and to customer willingness to adopt workflows-as-code rather than a more click-configured
              product. Its technology moat is therefore operational depth and integration quality, not hard protocol
              lock-in. That moat can widen if Otto and Observe compound proprietary operational context, but it can
              narrow if Airflow itself becomes easier to operate or if competing managed services replicate enough of
              the control-plane experience.
