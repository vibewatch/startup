        - CO007
    - name: Ry Walker
      role: Former Co-founder
      claimRefs:
        - CO041
  foundingLocation: Cincinnati, OH, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Astronomer sells Astro, a managed Apache Airflow platform for building, deploying, scheduling, and monitoring data
    pipelines, plus adjacent modules including Observe, Otto, Astro CLI, Private Cloud, Remote Execution, and Cosmos.
    The product is best understood as an enterprise operating layer around Airflow rather than a replacement
    orchestration language.
  customerFocus: >-
    Enterprise and upper-mid-market technical teams in data engineering, analytics engineering, platform, and
    quantitative environments that run production data, analytics, and AI workflows.
  businessModel: >-
    Hybrid usage-based software model: base monetization comes from deployments, clusters, workers, and related
    consumption, while enterprise governance, support, security controls, and deployment flexibility expand contract
    value. Business and enterprise tiers also rely on direct sales and professional-services-assisted adoption.
  stage: Series D
  fundingStatus: >-
