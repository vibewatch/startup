      - number: '3.3'
        title: Switching cost, distribution, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this market are meaningful but rarely absolute. Python DAGs, SQL models, and
              containerized jobs are portable enough that buyers can multi-home across tools, but the operational
              context built around them is sticky: metadata, lineage conventions, runtime assumptions, deployment
              wrappers, monitoring playbooks, security reviews, support relationships, and internal engineering habits
              all create friction. This is why cloud-distribution power matters. MWAA, Composer, Step Functions, and
              Databricks ride existing procurement rails and broader platform commitments, letting buyers solve
              orchestration inside a larger cloud or lakehouse contract. Astronomer’s counter is interoperability: it
              can accept the buyer’s existing Airflow investment while promising better enterprise operations and more
              flexible deployment. Prefect and Dagster make a similar argument from different architectures, while Argo
              and dbt often coexist rather than displace one another outright. The result is a market where multi-homing
              is normal, rip-and-replace is selective, and winning often means owning the control plane for a particular
              workload class rather than every workflow in the enterprise.
