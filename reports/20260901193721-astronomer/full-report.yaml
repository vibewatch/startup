  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s competitive set only makes sense when grouped by buyer job. Direct peers are platforms that
              sell orchestration itself as the core product for data and AI workloads: Prefect and Dagster sit closest
              here, with Mage pressing from the AI-data-pipeline side. Managed Airflow incumbents such as AWS MWAA and
              Google Cloud Composer compete when the buyer mainly wants hosted Airflow with fewer operational burdens,
              even if they do not match Astronomer on cross-cloud positioning or enterprise support depth. Argo
              Workflows, AWS Step Functions, Databricks Lakeflow Jobs, and dbt are better framed as adjacent substitutes
              than like-for-like rivals. Argo is Kubernetes-native batch and ML orchestration, Step Functions is
              AWS-native application and agentic workflow orchestration, Databricks is a broader data-and-AI platform
              with native workflow management, and dbt is primarily transformation plus data-development workflow. The
              most persistent substitute remains internal build on open-source Airflow itself. That means Astronomer is
              competing against both commercial vendors and the proposition that a sufficiently skilled team should
              simply run Airflow on its own.
