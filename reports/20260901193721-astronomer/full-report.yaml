  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s monetization is now much more legible than it was in earlier chapters because the company
              publishes an explicit Astro pricing construct. The core engine is usage-based: customers pay for
              deployments, workers, and dedicated clusters, with billing measured hourly and accrued to the second. That
              means the business mixes classic enterprise-software subscription characteristics with infrastructure
              consumption economics. Developer and Team plans advertise starting prices, while Business, Enterprise, and
              Private Cloud push the buyer into negotiated contracts. The pricing stack suggests two revenue layers.
              First is recurring platform consumption linked to Airflow environments and workload intensity. Second is
              monetization of governance, support, reliability, and deployment controls such as high availability,
              remote execution, private cloud, and enterprise security. Professional services appear to be a third
              supporting stream, especially where migration, architecture, and optimization work accelerate time to
              value. The result is not a pure seat-based SaaS model or a pure cloud pass-through model; it is a hybrid
              monetization structure where compute-backed usage drives the base and enterprise packaging expands average
              contract value.
