      - number: '8.2'
        title: Valuation context and public price support
        blocks:
          - type: paragraph
            body: >-
              The accessible valuation record is thin but still informative. Astronomer’s official Series D release
              confirms a $93 million round in May 2025, while independent coverage says no valuation was announced.
              Private Market View lists a $775.0 million last-known valuation and explicitly states that too few pricing
              signals exist to publish a composite mark; PM Insights offers only a preview and keeps the detailed
              institutional dataset behind a paywall. Tracxn provides additional directional context—roughly $376
              million raised over eight rounds and 29 institutional investors—but obfuscates most valuation fields in
              the public view. The result is a narrow public base from which to infer price. Comparable public
              infrastructure names trade across a wide band, from single-digit sales multiples for more mature software
              infrastructure to 20x-plus and even premium-AI-networking territory for faster or more favored assets.
              Astronomer deserves some premium for category leadership, customer proof, and AI/DataOps tailwind
              exposure, but the absence of clean public gross-margin, ARR, and concentration data argues for using the
              lower-to-middle portion of premium infrastructure bands unless management opens the books.
