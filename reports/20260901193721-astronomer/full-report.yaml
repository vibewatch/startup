  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s risk stack is best understood as a transmission problem: a control-plane company that sits in
              the middle of data and AI workflows inherits risk from customer data obligations, from Apache Airflow’s
              roadmap, from cloud infrastructure partners, and from enterprise procurement expectations. The company has
              several genuine mitigants—security architecture, private and dedicated deployment options, data-processing
              commitments, subprocessor notice terms, and visible customer adoption—but the residual exposure is still
              meaningful because many customers use Astro for revenue-impacting or operationally sensitive processes.
              The strongest public customer stories all point in the same direction: this software runs important jobs.
              That is good for stickiness and bad for incident tolerance. Investors should therefore underwrite
              Astronomer less like a light developer utility and more like a workflow control-plane vendor whose
              failures can cascade into customer operations, renewals, and valuation quickly. The highest-priority
              diligence items are privacy/compliance execution, platform dependency, concentration opacity, and
              leadership/execution discipline after the 2025 governance event.
            claimRefs:
              - CR001
