      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is not a generic automation manager. Astronomer’s practical users are data engineers, platform
              teams, ML engineers, and analytics infrastructure operators who already understand DAGs, Python, and
              shared execution environments. Customer stories from Booking.com, Together AI, and Janus Henderson all
              point to technically sophisticated teams that were already depending on Airflow-like orchestration or had
              reached the limits of fragmented alternatives. The signing buyer is typically a broader data-platform or
              IT leader, because the purchase covers infrastructure reliability, security posture, deployment model, and
              shared engineering productivity rather than a single app workflow. The payer therefore tends to be a
              centralized data, platform, or CIO-sponsored transformation budget. Adoption usually starts with
              self-managed Airflow, MWAA, Cloud Composer, or a fragmented combination of schedulers and pipeline tools;
              commercial conversion happens when organizations need higher uptime, governance, observability, AI
              workload support, multi-team standardization, or deployment options such as remote execution or private
              cloud. This is a technically opinionated market where the community and open-source installed base create
              the top of funnel, but enterprise budget unlocks only when the platform proves it can reduce operational
              burden without forcing a rewrite of how teams author pipelines.
