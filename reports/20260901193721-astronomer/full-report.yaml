            body: >-
              Public traction signals are unusually strong for a private infrastructure company, but they are still
              partial. Astronomer’s 2025 financing announcement cited 150%+ year-over-year Astro ARR growth, 130% net
              revenue retention, 90%+ product utilization, and an internal two-year path to profitability. The 2026 CFO
              and field-operations announcements stepped down the top-line growth figure to 55% year over year while
              still showing 120%+ NRR and triple-digit EMEA expansion. Read together, these disclosures imply a business
              that is still expanding quickly but is moving from hypergrowth toward more measured scale. Revenue quality
              appears better than raw growth alone would suggest because the public customer stories show
              production-critical workloads, not casual experimentation: Booking.com, Together AI, and Janus Henderson
              describe broad operational dependence on Astro. That matters because usage-linked infrastructure revenue
              is more durable when workloads are embedded into core analytics, AI, and financial processes. The
              counterpoint is that Astronomer still discloses no absolute revenue base, no gross retention, no churn,
