      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              Capabilities are differentiating faster than category labels. Astronomer’s thesis is Airflow compatibility
              plus enterprise control-plane features such as observability, remote execution, and private-cloud
              deployment. Prefect’s pitch is Python-first workflow execution with serverless and hybrid options plus an
              increasingly agent-centric story. Dagster’s pitch is asset-centric orchestration, lineage, and
              observability, and its own homepage explicitly contrasts that model with task-centric Airflow. Mage
              combines notebooks, modular code, observability, and hosted/private-cloud options for AI data pipelines.
              Argo leads when Kubernetes-native parallel compute is the center of gravity. dbt becomes part of the
              buying conversation because it packages scheduling, CI/CD, monitoring, and AI-assisted development around
              transformation, even though it is not a full Airflow replacement. Pricing transparency is uneven: Dagster
              publishes starter and usage rates, dbt publishes a $100-per-user starter plan, Mage discloses a
              $100-per-month starting point plus usage, and Databricks discloses trial constructs while keeping
              steady-state economics more consumption oriented. Prefect and Astronomer provide far less immediately
              comparable public price detail, which itself is a diligence signal for enterprise buyers.
