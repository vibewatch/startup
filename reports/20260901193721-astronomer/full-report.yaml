      - number: '7.2'
        title: Legal, regulatory, and contractual risk
        blocks:
          - type: paragraph
            body: >-
              The reviewed legal documents show a company that is enterprise-aware but still operating in a nontrivial
              compliance zone. The privacy policy and DPA acknowledge GDPR-style personal-data handling, international
              transfers, subprocessor governance, and audit rights; the AI Addendum adds a newer risk surface by
              defining provider dependencies, output disclaimers, and EU AI Act-related use restrictions. The MSA also
              matters because it narrows Astronomer’s exposure in customer disputes: uptime is not guaranteed to be
              uninterrupted or error-free, liability is capped, suspension rights are broad in security or payment
              disputes, and renewals are structured around one-year terms unless notice is given. None of that is
              unusual for infrastructure SaaS, but it means customers with sensitive use cases may negotiate hard or
              demand custom controls. The open-source layer adds a second legal vector. Astronomer’s value proposition
              depends on Apache Airflow’s brand and ecosystem, yet Apache trademark and license rules make clear that
              commercial vendors cannot imply ASF sponsorship or misuse project marks. There is no reviewed evidence of
              active enforcement against Astronomer, but the legal perimeter is real and should be diligence-tested.
            claimRefs:
              - CR001
