    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and company scope
        blocks:
          - type: paragraph
            body: >-
              Astronomer’s current public identity is clearer than the generic “Airflow vendor” label often attached to
              it. The homepage and about page frame the company as the infrastructure and orchestration layer for the
              agentic era, while the current product page shows a broader platform that bundles core workflow execution,
              observability, governance, remote execution, and private-cloud deployment. That positioning matters for
              later diligence because Astronomer is not selling only managed scheduling; it is trying to become the
              control plane that enterprise data teams use to move analytics, ML, and AI workflows from prototype into
              production. Otto extends that thesis further by packaging Astronomer’s operational Airflow knowledge into
              an agent that can build Dags, investigate failures, and plan upgrades with environment context. The
              important analytical boundary is that many public scale numbers refer to the Airflow ecosystem rather than
              Astronomer’s own revenue base, so later chapters must separate platform stewardship from direct company
              traction.
