      - number: '7.3'
        title: Operational, security, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the product architecture is both the moat and the risk. Astro reduces the burden of running
              Airflow, but that promise depends on Astronomer’s ability to operate a secure control plane, keep runtimes
              current, and isolate customers from outages or upgrade pain. The security page describes a multi-tenant
              control plane with a single-tenant data plane, VPC separation, and encrypted transport, which is a
              meaningful mitigation. Remote Execution, dedicated clusters, and private-cloud options further help with
              sensitive environments. Yet the product documentation also reveals where complexity can re-enter:
              Kubernetes agents, network design, XCom and secrets behavior, multiple deployment models, and major
              Airflow 3 changes all create room for implementation mistakes and support burden. The status page confirms
              that upstream cloud incidents can still affect the service, while review evidence highlights pricing
              complaints, missing logs, setup/debug complexity, and requests for stronger visibility into advanced
              features. On top of that, AWS and Google both market managed-Airflow alternatives with broad ecosystem
              integration, so Astronomer must keep proving superior enterprise operations rather than relying on Airflow
