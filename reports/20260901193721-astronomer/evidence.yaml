evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-d-valuation
    missingEvidence: Direct cap-table or board materials showing the Series D post-money valuation and any secondary component.
    whyItMatters: The round amount is public, but valuation drives the valuation chapter and ownership dilution analysis.
    diligencePath: Request the financing documents, board consent package, and cap table tied to the May 2025 Series D.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, and major investor control provisions.
    whyItMatters: Governance concentration and refresh risk cannot be judged from press releases alone.
    diligencePath: Obtain the board roster, investor rights agreement, and most recent governance committee materials.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, burn, cash runway, and current headcount.
    whyItMatters: Public growth snippets are not sufficient for underwriting efficiency or downside risk.
    diligencePath: >-
      Request audited or board-reviewed financial statements, KPI bridge, cohort retention tables, and payroll/headcount
      summaries.
    relatedQuestionRefs:
      - QO019
      - QO027
  - type: data-gap
    severity: material
    topic: sam-sizing
    missingEvidence: A bottom-up independent TAM/SAM/SOM model for enterprise managed Airflow and Airflow-centric control planes.
    whyItMatters: Generic workflow-orchestration TAMs overstate reachable spend and can distort valuation assumptions.
    diligencePath: >-
      Build a bottoms-up model from enterprise Airflow adoption counts, deployment archetypes, and target ACVs gathered
      from channel checks and customer references.
    relatedQuestionRefs:
      - QM007
      - QM025
  - type: data-gap
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      Public budget benchmarks for what large enterprises actually spend on orchestration control planes versus adjacent
      cloud services.
    whyItMatters: Budget ownership and ACV potential drive sales efficiency and valuation.
    diligencePath: Request customer cohort ACVs, pipeline segmentation, and private win/loss data by buyer type and deployment mode.
    relatedQuestionRefs:
      - QM024
  - type: data-gap
    severity: minor
    topic: competitive-conversion
    missingEvidence: Public data on conversion from self-managed or hyperscaler-managed Airflow into Astronomer contracts.
    whyItMatters: This determines how much of the 80,000-organization Airflow installed base is actually monetizable.
    diligencePath: Obtain migration cohorts, source-of-win data, and time-to-conversion metrics from sales operations.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Competitive win/loss rates against Prefect, Dagster, MWAA, Composer, and Databricks by segment.
    whyItMatters: Public surfaces show positioning, not whether Astronomer actually wins the highest-value deals.
    diligencePath: Request sales-ops competitive intelligence, lost-deal notes, and churn reasons by competitor.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Real enterprise contract pricing, discounts, and attach rates for Astronomer and peers.
    whyItMatters: Starter-plan prices are not enough to judge margin structure or pricing power.
    diligencePath: Request redacted MSAs, price books, and average ACVs by deployment model.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: minor
    topic: bundle-pressure
    missingEvidence: Independent third-party data on actual orchestration usage share across hyperscaler and lakehouse bundles.
    whyItMatters: Vendor-authored positioning can overstate readiness and adoption.
    diligencePath: >-
      Use customer interviews and procurement channel checks to test how often orchestration is bought as a bundle
      versus as a best-of-breed platform.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: absolute-financials
    missingEvidence: Absolute revenue / ARR, gross margin, burn, cash balance, and runway.
    whyItMatters: >-
      Growth percentages and public pricing do not reveal whether Astronomer is large enough, efficient enough, or
      capitalized enough to justify a late-stage valuation.
    diligencePath: Request board metrics package, audited or reviewed management financials, and monthly operating dashboard.
    relatedQuestionRefs:
      - QI018
      - QI023
      - QI025
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, magic number, rep productivity, and pricing realization by tier.
    whyItMatters: >-
      Field-operations expansion and enterprise packaging could create either strong leverage or expensive growth
      depending on productivity.
    diligencePath: >-
      Request sales-ops funnel data, quota attainment, rep ramp curve, and realized discount analysis from signed
      contracts.
    relatedQuestionRefs:
      - QI013
      - QI025
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: Series D valuation, liquidation preferences, and any debt or structured-financing terms.
    whyItMatters: >-
      Without the price and preference stack, the public record cannot support a clean assessment of dilution, downside
      protection, or next-round pressure.
    diligencePath: Obtain cap table, term sheets, and investor rights documents for the latest round.
    relatedQuestionRefs:
      - QI019
      - QI024
  - type: private-evidence-only
    severity: material
    topic: product-adoption
    missingEvidence: >-
      Attach rates, active-user counts, deployment counts, and retained usage for Observe, Otto, Remote Execution, and
      Private Cloud.
    whyItMatters: Public materials show capability breadth, but not which modules are truly adopted and monetized at scale.
    diligencePath: Request module-level product analytics, attach-rate dashboards, and customer reference lists by feature.
    relatedQuestionRefs:
      - QE020
      - QE024
  - type: private-evidence-only
    severity: material
    topic: reliability-benchmarks
    missingEvidence: Measured uptime, RCA accuracy, mean-time-to-recovery, and upgrade success rates across customer cohorts.
    whyItMatters: The operating moat depends on reliability claims that are plausible but not benchmarked publicly.
    diligencePath: >-
      Request SLO / SLA dashboards, incident postmortems, and upgrade telemetry across representative enterprise
      accounts.
    relatedQuestionRefs:
      - QE015
      - QE024
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Third-party audit artifacts, customer security reviews, and independent proof of compliance acceptance for Remote
      Execution and Private Cloud.
    whyItMatters: Public control descriptions are helpful but do not fully validate enterprise trust claims.
    diligencePath: Review SOC reports, penetration-test summaries, questionnaire responses, and customer security sign-off examples.
    relatedQuestionRefs:
      - QE018
      - QE019
      - QE024
