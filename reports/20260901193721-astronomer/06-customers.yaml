  - - Together AI
    - AI-native cloud platform
    - Consolidated 9 MWAA environments and 17 Argo workflows; 12 dbt projects and 700+ models
    - Production
    - Trial-to-production speed, weeks-to-hours development gain, board metrics flow
    - Official case study only; no renewal history
  - - Janus Henderson
    - Asset management / regulated
    - 27 production deployments and automated failure triage via Otto / Lighthouse
    - Production
    - 230k+ monthly task successes, minutes-not-hours diagnosis
    - Official case study only; no pricing data
  - - AAA Life
    - Insurance / analytics engineering
    - Dozens of production DAGs and dbt jobs for daily policyholder and executive workflows
    - Production
    - 80% recovery-time reduction, better freshness SLAs
    - Official case study only; no contract size
  - - WeWork
    - Real estate / global enterprise
    - Lean-team orchestration across analytics and reporting
    - Production
    - 95% upgrade-cycle reduction, 60% troubleshooting reduction, single-engineer operations
    - Official case study only; no user-count denominator
  - - LIQID
    - Wealthtech / fintech
    - Composer-to-Astronomer migration for reporting and analytics
    - Production
    - 63% orchestration-cost reduction, 98% faster runtimes, 2× throughput
    - Official case study only; no long-term retention proof
  - - WesTrac
    - Industrial / mining services
    - Cross-platform orchestration for Snowflake, dbt, Power BI, Azure links
    - Production
    - 30%+ faster recovery, 36% annual savings, 25% infra time saved
    - Official case study only; no expansion history
  - - Autodesk / Foursquare / Campspot / Atmosphere / VTEX / Black Crow AI
    - Software, location analytics, hospitality, media, commerce, ecommerce AI
    - Multiple migrations and operational expansions
    - Production
    - Strong breadth across industries and workflow styles
    - Many outcomes are single-study snapshots rather than longitudinal cohorts
