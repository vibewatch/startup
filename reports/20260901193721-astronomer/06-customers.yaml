- id: adoption-trajectory-and-scale
  title: Adoption trajectory and scale
  body: 'The adoption trajectory is positive at both the company and ecosystem layers. Astronomer’s own disclosures moved from “more than 700 enterprises” in 2025 to “more than 900 enterprises” in early 2026, while the State of Airflow 2026 report adds a broader top-of-funnel context: more than 5,800 practitioners across 122 countries, 89% of Airflow users expecting more revenue-generating or external use cases, and markedly higher GenAI/MLOps production usage among Astro customers than the Airflow base. Customer stories reinforce that this is not a shallow logo set. Booking.com runs thousands of DAGs and hundreds of AI data pipelines on Astro; Together AI consolidated multiple MWAA and Argo environments in under 30 days; Janus Henderson reports 27 production deployments and 230,000-plus monthly task successes; Autodesk migrated 536 Oozie DAGs across 25 teams. These are adoption signals with operational weight. Still, they remain curated snapshots. Public materials show upward motion, but
    they do not reveal what share of the 900-plus enterprises are deeply active, how many remain on lower tiers, or whether the long tail of customers resembles the reference accounts.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
