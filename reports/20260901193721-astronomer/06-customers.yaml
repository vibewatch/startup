chapter:
  number: 6
  title: Customers
  summary: 'Astronomer’s customer evidence is unusually rich for a private infrastructure company: public materials show named enterprises, measurable outcomes, and expanding AI/DataOps workloads across travel, insurance, finance, retail, industrial, and software verticals. The strongest conclusion is that Astro is embedded in production-critical workflows and supports land-and-expand behavior, but public diligence still cannot resolve customer concentration, gross retention, or how representative the reference set is versus the full installed base.'
sections:
- id: customer-base-segmentation
  title: Customer base segmentation
  body: 'Astronomer’s customer base appears skewed toward technically sophisticated mid-market and enterprise organizations that treat data orchestration as a critical operational layer rather than a side tool. The public record spans travel marketplaces, asset managers, insurers, wealthtechs, industrial businesses, software vendors, retailers, and digital media companies. On the buyer side, the pattern repeats: platform teams, data engineering leaders, analytics engineering groups, quantitative development teams, and infrastructure-oriented operators are the visible champions. On the user side, the actual surface is broader: analysts, ML teams, business reporting groups, finance operations, customer-support functions, and product organizations all consume the outputs. The payer is typically the enterprise data or platform budget, but the value case is sold to multiple stakeholders—reliability, data freshness, lower infrastructure burden, faster upgrades, and more trustworthy downstream
    business processes. This is important because it suggests Astronomer is not just selling into greenfield AI labs; it is landing inside the connective tissue of mature data organizations and then expanding across adjacent teams.'
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU017
  - CU021
  - CU022
  - CU026
  - CU029
  - CU030
  tableRefs:
