- id: retention-expansion-and-concentration-risk
  title: Retention, expansion, and concentration risk
  body: 'The public retention and expansion picture is encouraging but incomplete. Astronomer’s financing and executive-hire announcements reported net revenue retention of 130% in 2025 and 120%+ in 2026, which strongly suggests expansion inside the installed base. The mechanism for that expansion is visible across customer stories: migrations from legacy schedulers or managed-Airflow incumbents, additional deployments, broader workflow ownership, adoption of Cosmos for dbt, use of Observe for SLAs and lineage, and emerging interest in Otto or AI workflow support. This looks like a classic land-and-expand infrastructure motion. However, concentration risk remains opaque. The visible logos skew large and sophisticated, which is good for enterprise fit but raises unanswered questions about top-customer ARR share, renewal exposure, and how much of the installed base depends on high-touch services. Public reference coverage also cannot confirm whether positive case studies are representative
    of the median customer. The defensible verdict is that retention and expansion are likely strong, satisfaction seems directionally positive, and concentration remains a real diligence blocker until the company opens its customer ledger.'
