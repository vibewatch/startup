tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale / strategic value
  - Gap
  rows:
  - - Large enterprise platform teams
    - 'Buyer: platform/data engineering leadership; User: engineers, analytics teams; Payer: platform budget'
    - Managed orchestration, upgrades, observability, governance
    - High ACV, high stickiness, multi-team expansion potential
    - Unknown average contract value and top-account concentration
  - - AI-native / hypergrowth data teams
    - 'Buyer: head of data / data engineering; User: engineering + ML teams; Payer: engineering or data budget'
    - Fast pipeline authoring, CI/CD, observability, agent workflows
    - Strong expansion potential as AI workloads move to production
    - Unknown churn among smaller, faster-moving accounts
  - - Lean analytics engineering groups
    - 'Buyer: analytics engineering or BI leaders; User: analysts and data engineers; Payer: analytics/data budget'
    - dbt orchestration, SLA reliability, reduced infra burden
    - Good fit for self-service expansion and Cosmos attach
    - Unknown conversion from lower-tier or trial plans
  - - Regulated / financial-services teams
    - 'Buyer: quant, risk, or platform leads; User: quant developers / data ops; Payer: enterprise data budget'
    - Sensitive workflows, overnight reliability, compliance-driven operations
    - High strategic value if security and uptime prove durable
    - Need proof of compliance close rates and long-term renewals
  - - Industrial / field operations data stacks
    - 'Buyer: IT/data leaders; User: ops analytics teams; Payer: enterprise IT/data budget'
    - Cross-system orchestration and reporting freshness
    - Useful proof that category is broader than SaaS/web
    - Need more examples beyond selected references
  notes: Segments are inferred from named customer proofs and public product positioning rather than from a disclosed customer census.
