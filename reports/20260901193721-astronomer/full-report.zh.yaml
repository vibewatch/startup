        title: 牵引力、销售效率与收入质量
        blocks:
          - type: paragraph
            body: >-
              对一家私营基础设施公司来说，公开牵引力信号异常强，但仍然不完整。Astronomer 的 2025 年融资公告提到 Astro ARR 同比增长 150%+、净留存率 130%、产品利用率
              90%+，以及内部两年内走向盈利的路径。2026 年 CFO 和现场运营任命公告把收入增长数字降至同比 55%，但仍显示 120%+ NRR 和 EMEA
              三位数扩张。合起来看，这些披露意味着公司仍在快速扩张，但正从超高速增长转向更克制的规模化。收入质量看起来好于单看原始增长，因为公开客户故事展示的是生产关键工作负载，而非随意实验：Booking.com、Together
              AI 和 Janus Henderson 都描述了对 Astro 的广泛运营依赖。这一点重要，因为当工作负载嵌入核心分析、AI 和金融流程时，用量挂钩的基础设施收入更持久。反面是 Astronomer
              仍未披露绝对收入基础、总留存率、流失率和客户集中度数据，所以公开观察者能看到扩张动能，却看不到背后的完整耐久性画像。公开披露仍是有意不完整的。
