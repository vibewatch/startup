      - number: '5.2'
        title: 架构、执行与开发者工作流
        blocks:
          - type: paragraph
            body: >-
              技术架构把开源 Airflow 原语与 Astronomer 托管打包和控制结合起来。Airflow 本身仍把工作流定义为 Python 代码，配套调度器、任务、依赖关系和调试 UI。Astronomer
              将其组织为 Workspaces、Deployments 和集群。标准集群是多租户的，但会把 Deployments 隔离到各自
              namespace；专用集群则提供单租户环境，并带来更多网络和区域控制。Remote Execution 进一步延展这一模型，把产品拆成 Astro
              托管的编排平面和客户管理的执行平面，代理通过仅出站连接在本地运行任务。这对受监管或延迟敏感工作负载很重要，因为代码、密钥、日志和数据可以留在客户环境。开发者侧，Astro Runtime 标准化 Airflow
              发行版，Astro CLI 让团队在本地运行和测试 Airflow 并部署到 Astro；Otto 则越来越像工作流助手，可以利用平台自身收集的运营上下文来编写、调试、排查并规划升级。
