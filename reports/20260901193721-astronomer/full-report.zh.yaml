  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 限制
    rows:
      - - Astronomer
        - 直接同行 / Airflow 控制平面
        - 宣称 700+ 家企业；Airflow 生态中有 80,000+ 个组织的背景
        - 企业数据、平台和 AI 团队
        - 托管 Airflow，加上可观测性、远程执行、私有云和企业支持
        - 公开定价不透明；取决于 Airflow 继续处于核心位置
      - - Prefect
        - 直接同行
        - 开源核心；Prefect Cloud 称每月自动化 200M+ 项数据任务
        - 数据、ML 和智能体工作流团队
        - Python 优先执行、无服务器和混合部署、智能体 / MCP 叙事
        - 公开定价细节稀少；不如 Astronomer 那样 Airflow 原生
      - - Dagster
        - 直接同行
        - 开源核心，提供托管 Dagster+ 层级
        - 现代数据平台和数据资产团队
        - 资产中心模型、血缘、可观测性、治理型智能体叙事
        - 与 Airflow 抽象不同，可能提高迁移摩擦
      - - Mage
        - 相邻同行
        - 开源，并提供托管 / 私有云选项
        - AI 数据管道和分析工程团队
        - 从交互式笔记本到生产的工作流、混合框架、AI 友好定位
        - 企业级证明更少，定价标准化程度较低
      - - AWS MWAA / Google Composer
        - 托管 Airflow 存量玩家
        - 嵌入超大规模云厂商云内
        - 希望在现有云关系内使用托管 Airflow 的团队
        - 具备云原生安全 / 扩展的基础托管 Airflow
        - 云特定范围，独立控制平面身份较弱
      - - Argo Workflows
        - 开源替代
        - 热门 Kubernetes 工作流引擎
        - Kubernetes 原生 ML、数据处理、CI/CD 团队
        - 容器原生并行任务，在 Kubernetes 上云无关
        - 需要 Kubernetes 运维成熟度，且缺少 Airflow 兼容性
      - - AWS Step Functions
        - 相邻替代
        - 捆绑在 AWS 应用栈内
        - 应用、集成、事件响应和智能体工作流构建者
        - 无服务器编排，支持人在回路和智能体模式
        - AWS 原生模型，不是数据工程 Airflow 的直接替代
      - - Databricks Lakeflow Jobs
        - 平台捆绑替代
        - Databricks 称获数千家组织信任
        - 以 Lakehouse 为核心的数据和 AI 团队
        - 更广泛数据 + AI 平台内的原生托管编排
        - 更适合 Databricks 中心化环境，而不是异构 Airflow 用户
      - - dbt 平台 / dbt Core
        - 相邻工作流替代
        - dbt 文档引用 100,000+ 成员社区
        - 分析工程和转换工作流
        - 强转换语境、调度、CI/CD 和治理
        - 不是完整通用编排控制平面
      - - 自管 Airflow / 内部自研
        - 现状替代
        - 庞大 OSS 装机基础
        - 成本敏感或能力强的平台团队
        - 没有供应商利润；最大化定制和控制
        - 运维负担最高，企业支持 / 升级更慢
    notes: 表中同时列直接同行和替代方案，因为买方常用多种路径比较如何解决同一个 编排控制问题。
