      - number: '5.4'
        title: 差异化、信任与技术风险
        blocks:
          - type: paragraph
            body: >-
              Astronomer 的差异化是真实的，但叠在公司无法完全控制的依赖之上。优势来自作为 Airflow 商业维护者、交付托管运行时、增加企业控制能力，并在此基础上延展可观测性、血缘、远程执行、私有云部署和 AI
              原生工具。信任和合规能力强化了销售主张：安全文档描述了多租户控制平面与客户专属数据平面、TLS 和 mTLS、限时员工访问、共享责任边界，以及 SSO、审计日志、自定义 RBAC、SCIM、灾备和 IP
              allowlist 等高阶控制。代价是 Astronomer 仍深度暴露于 Airflow 生态的健康和方向、Kubernetes
              运营假设，以及客户是否愿意采用以代码定义工作流，而非更偏点击配置产品。技术护城河因此是运营深度和集成质量，而不是硬协议锁定。若 Otto 和 Observe 复利化出专有运营上下文，护城河可以变宽；但如果
              Airflow 本身更易运营，或竞争性托管服务复制足够多的控制平面体验，护城河也会收窄。
