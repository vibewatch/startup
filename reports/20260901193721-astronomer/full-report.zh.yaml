  productSummary: >-
    Astronomer 销售 Astro，这是一个托管 Apache Airflow 平台，用于构建、部署、调度和监控数据管道；相邻模块包括 Observe、Otto、Astro CLI、Private Cloud、Remote
    Execution 和 Cosmos。更准确的理解是，它是围绕 Airflow 的企业运营层，而不是替代性的编排语言。
  customerFocus: 面向数据工程、分析工程、平台和量化环境中的企业及中高端中型市场技术团队；这些团队运行生产级数据、分析和 AI 工作流。
  businessModel: 混合用量型软件模式：基础变现来自部署、集群、worker 及相关消耗；企业治理、支持、安全控制和部署弹性则扩大合同价值。Business 和 Enterprise 档位也依赖直销和专业服务辅助落地。
  stage: Series D
  fundingStatus: >-
    Astronomer 在 2022 年完成 $213M Series C 轮后，又于 2025 年 5 月完成 $93M Series D 轮。可访问的私募市场来源显示，公司累计融资约 $375M-$376M，但 Series D
    轮估值和当前优先股堆叠未公开披露；一家第三方私募市场聚合器列出的最后已知估值约为 $775M。
