        title: 身份、产品与公司边界
        blocks:
          - type: paragraph
            body: >-
              Astronomer 当前公开身份比常被贴上的泛化「Airflow 厂商」标签更清楚。官网首页和 About
              页面把公司定位为智能体时代的基础设施与编排层；当前产品页则展示了一个更宽的平台，把核心工作流执行、可观测性、治理、远程执行和私有云部署打包在一起。这一定位会影响后续尽调：Astronomer
              卖的不是单纯托管调度，而是试图成为企业数据团队的控制平面，帮助分析、ML 和 AI 工作流从原型进入生产。Otto 进一步延展了这一逻辑：它把 Astronomer 的 Airflow
              运维知识封装成智能体，可结合环境上下文构建 DAG、排查故障、规划升级。关键分析边界在于，很多公开规模数字指向 Airflow 生态，而不是 Astronomer
              自身收入基础；后续章节必须把平台维护者地位和公司直接牵引力分开看。
