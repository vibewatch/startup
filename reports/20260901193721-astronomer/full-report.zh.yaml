  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑平衡
        blocks:
          - type: paragraph
            body: >-
              非价格证据足够强，Astronomer 应该被认真纳入投资候选。公司看起来在托管 Airflow 品类领先，已经从编排扩到相邻运营模块；作为私营基础设施供应商，其公开客户证据异常扎实。2025–2026
              年披露的增长和留存进一步支撑正面判断。问题在于，价格发现远弱于产品发现。公开来源没有在公司公告中披露 Series D 估值，Crunchbase
              明确称该轮没有公开估值，可访问的私募市场聚合器也承认定价信号稀疏。几项证据合在一起，不支持盲目得出“买入公司”的结论。更合适的立场是对价格敏感的有条件兴趣：如果入场条款锚定在上一轮有证据支撑的估值区间附近，或下行保护足以抵消不透明，就推进；但在股权结构表、客户集中度和利润率数据不完整时，不应支付顶级基础设施溢价。投资委员会应把
              Astronomer 视为一家可能非常优秀、但公开估值支撑可信度中等的公司。
