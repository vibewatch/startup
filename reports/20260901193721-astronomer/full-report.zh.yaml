  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险图景
        blocks:
          - type: paragraph
            body: >-
              Astronomer 的风险栈最好理解为传导问题：一家控制平面公司位于数据和 AI 工作流中间，会继承客户数据义务、Apache Airflow
              路线图、云基础设施伙伴和企业采购预期带来的风险。公司有若干真实缓释项——安全架构、私有和专用部署选项、数据处理承诺、子处理方通知条款，以及可见客户采用——但剩余暴露仍有分量，因为许多客户用 Astro
              承载影响收入或运营敏感的流程。最强的公开客户故事都指向同一件事：这套软件在跑重要任务。这利好黏性，也降低了事故容忍度。因此，投资人应少把 Astronomer
              当作轻量开发者工具，而更像工作流控制平面厂商来测算；其故障会迅速级联到客户运营、续约和估值。最高优先级尽调项是隐私 / 合规执行、平台依赖、集中度不透明，以及 2025 年治理事件后的领导层 / 执行纪律。
