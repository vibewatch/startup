  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图
        blocks:
          - type: paragraph
            body: >-
              Astronomer 的产品更适合被理解为分层 Airflow 平台，而不是单一应用。中心是 Astro，即把 Apache Airflow 打包给企业使用的托管编排服务。围绕 Astro，Astronomer
              增加了多个模块来解决相邻运营任务：Astro Observe 面向编排原生的可观测性和血缘，Otto 面向 AI 辅助数据工程工作，Astro CLI 面向本地开发和部署管理，Private Cloud
              面向客户管理的敏感环境，Remote Execution 将编排与任务执行分离，Cosmos 则把 dbt 项目作为 Airflow DAG
              运行。这个模块图很重要，因为企业很少抽象地购买「工作流调度」。它们要的是一套可靠方式，用来构建、部署、监控、保护并演进数据和 AI 管道，同时不把自己的平台团队变成全职 Airflow
              运维团队。因此，产品定义是横跨编写、运行时、部署、运维、可观测性和辅助修复的工作流控制平面。
