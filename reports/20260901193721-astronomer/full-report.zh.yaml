  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              Astronomer 并不在整个软件自动化宇宙里竞争。更有用的外层边界是更广义的工作流编排市场：分析机构通常把用于协调业务流程自动化、IT/DevOps
              工作流、数据与分析管道，以及跨云、本地和混合环境的应用集成的软件与服务都纳入其中。这个定义比 Astronomer 的实际切入点宽得多。Astronomer 具体销售的是围绕 Apache Airflow
              的企业级编排，这意味着最相关的支出位于数据与分析工作流切片，以及从同类管道长出来的新兴 AI 编排层。因此，自上而下的市场报告给出的数字方向上有用，战略上却噪音很大：有的纳入通用 BPM
              或客户体验编排，有的则聚焦 AI 编排、托管服务或平台分段。尽调中更合适的框架是：Astronomer 参与的是一个巨大且扩张中的控制平面品类，但其现实 SAM 只是其中一部分——具备技术能力、需要为数据、ML
              和智能体工作流做生产级编排的企业，而不是通用无代码流程自动化。
