        - 企业买方很可能进入定制商务流程
      - - Prefect
        - 保留了定价页，但所审文本中没有可用公开价目表
        - 存在 Prefect Cloud 打包
        - 保留抓取的公开页未显示可比数字
        - 价格透明度弱于 Dagster 或 dbt
      - - Dagster
        - Solo 每月 $10 + 每 credit $0.040；Starter 每月 $100 + 每 credit $0.035；无服务器计算每分钟 $0.010
        - 托管 Dagster+ 层级，无服务器或混合选项
        - Enterprise 计划为定制
        - 小团队价格透明度强
      - - dbt
        - Starter 每用户每月 $100；Enterprise 和 Enterprise+ 层级
        - 调度、CI/CD、文档、监控、告警、模型限制、Wizard 额度
        - 以转换为中心的经济模型无法与编排一一对应
        - 分析团队容易比较，但不是完整 Astronomer 替代
      - - Mage
        - 每月 $100 + 用量
        - 托管工作流环境加基础设施用量定价
        - 私有云经济模型定制；用量可能大幅波动
        - 入门价看起来低，但总成本对工作负载敏感
      - - Databricks
        - 免费试用，加云资源费用和可能的额度
        - 访问更广泛的 Data + AI 平台
        - 稳定状态工作流定价偏消费型，难以单独拆出
        - Databricks 能把编排捆进更大的平台支出
      - - MWAA / Composer / Step Functions
        - 基于用量的云服务经济模型
        - 云厂商内部托管或无服务器编排
        - 跨服务费用和云消费让同口径定价很难
        - 采购便利往往比标示单价更重要
    notes: 未知或定制定价保留明示，不作猜测。
