  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Astronomer
              的客户基础似乎偏向技术成熟的中型市场和企业组织；这些组织把数据编排视为关键运营层，而不是边缘工具。公开记录覆盖旅游市场、资产管理公司、保险公司、财富科技、工业企业、软件厂商、零售商和数字媒体公司。买方侧模式反复出现：平台团队、数据工程负责人、分析工程组、量化开发团队，以及偏基础设施的运营者，是可见内部推动者。用户侧实际接触面更宽：分析师、ML
              团队、业务报表组、财务运营、客户支持职能和产品组织都会消费输出。付款方通常是企业数据或平台预算，但价值主张要卖给多个利益相关方——可靠性、数据新鲜度、更低基础设施负担、更快升级，以及更可信的下游业务流程。这一点重要，因为它说明
              Astronomer 不只是卖进全新 AI 实验室，而是落在成熟数据组织的连接组织里，再向相邻团队扩张。
