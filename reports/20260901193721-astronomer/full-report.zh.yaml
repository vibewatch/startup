        - 观察 / 有条件推进
        - 中
        - 只有价格纪律或交易结构到位才推进
      - - 置信度
        - 中
        - 中
        - 公司质量证据不错，价格证据不完整
      - - 风险评级
        - 中高
        - 中
        - 集中度、治理和依赖风险仍然重要
      - - 估值立场
        - 只有接近最后有证据支撑的估值带，或带下行保护时才有吸引力
        - 中低
        - 披露不足时，避免为私有市场溢价标记买单
    notes: 建议明确对价格敏感，而不是泛泛认可公司质量。
