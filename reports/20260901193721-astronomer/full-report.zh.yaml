  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调要求
    rows:
      - - 数字化转型和流程自动化
        - 增长驱动因素
