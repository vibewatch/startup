      - number: '3.4'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              反向证据是真实存在的。Prefect 在 2026 年收购 Dagster Labs，说明这个领域正围绕更宽的自动化栈整合，而不是停留在狭窄点产品。Dagster 公开攻击 Airflow
              以任务为中心的模型，并把资产、血缘和受治理智能体定位为更好的运营抽象。超大规模云厂商也没有停下：AWS Step Functions 现在营销智能体工作流和人在回路控制，Databricks
              则把任意工作负载的原生托管编排作为更大数据与 AI 平台的一部分来卖。这些动作压缩了「编排厂商」与「平台套件」之间的距离。因此，Astronomer 不能把编排当作通用功能护城河。它更持久的优势可能在于
              Airflow 维护者可信度、企业专属运营经验，以及跨托管、远程和私有环境的部署弹性。即便如此，这些优势也可被挑战：如果开源 Airflow
              变得更易运行，如果超大规模云厂商补齐功能缺口，或如果整合让对手把执行、资产智能和智能体治理组合成更宽标准，护城河就会收窄。护城河是真的，但有条件，不是永久的。
