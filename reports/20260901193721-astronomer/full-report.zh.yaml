      - number: '7.2'
        title: 法律、监管与合同风险
        blocks:
          - type: paragraph
            body: >-
              已审阅法律文件显示，公司具备企业客户意识，但仍处在不轻的合规区间。隐私政策和 DPA 承认类似 GDPR 的个人数据处理、国际传输、子处理方治理和审计权；AI Addendum 通过定义提供商依赖、输出免责声明和
              EU AI Act 相关使用限制，增加了新的风险面。MSA 同样重要，因为它收窄了 Astronomer
              在客户纠纷中的暴露：正常运行时间不保证不中断或无错误，责任有上限，安全或付款纠纷中的暂停权较宽，续约围绕一年期条款设计，除非提前通知。这对基础设施 SaaS
              并不罕见，但意味着敏感用例客户可能强硬谈判或要求定制控制。开源层增加第二条法律向量。Astronomer 的价值主张依赖 Apache Airflow 品牌和生态，但 Apache
              商标和许可规则明确规定，商业厂商不得暗示 ASF 赞助或滥用项目标识。审阅资料没有发现针对 Astronomer 的主动执法证据，但法律边界真实存在，必须在尽调中测试。
