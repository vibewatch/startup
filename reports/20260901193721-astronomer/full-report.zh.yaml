      - number: '5.3'
        title: 可靠性、集成与客户运营
        blocks:
          - type: paragraph
            body: >-
              Astronomer 最强的产品故事是运营性的，而不是纯概念性的。公司反复展示其平台被用于整合碎片化编排资产、降低升级痛苦，并暴露用户过去没有的管道可见性。Booking.com 用 Astro 支撑数千个
              DAG 和数百条 AI 数据管道；Together AI 用 Astro 在不到 30 天内整合 9 个 MWAA 环境和 17 条 Argo 工作流，并在其上接入智能体驱动的管道开发；Janus
              Henderson 在开盘前用 Otto 和 Astro 对生产部署故障做分诊。这些案例也揭示了集成模式：Astro 位于现代数据栈中间，连接数仓、云服务、dbt
              项目、告警系统、对象存储和密钥后端。关键可靠性价值不在于 Airflow 能运行任务——开源版已经能做到——而在于 Astronomer 让大规模、多团队、任务关键型 Airflow
              运营更标准化、更可观测，故障发生时也更容易恢复。这才是公司真正销售的客户工作流。
