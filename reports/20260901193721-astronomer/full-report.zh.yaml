      - CR019
      - CR021
      - CR026
      - CR027
      - CR038
      - CR039
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Astronomer 依赖上游开源、云基础设施和相邻数据栈标准，同时试图掌控其上的运营层。
    data:
      nodes:
        - id: astro
          label: Astronomer Astro
        - id: airflow
          label: Apache Airflow
        - id: aws
          label: AWS
        - id: gcp
          label: Google Cloud
        - id: k8s
          label: Kubernetes / 客户基础设施
        - id: dbt
          label: dbt 生态
        - id: ol
          label: OpenLineage
        - id: enterprise
          label: 企业客户
      edges:
        - from: airflow
          to: astro
          label: 核心引擎
        - from: aws
          to: astro
          label: 托管 / 竞争方
        - from: gcp
          to: astro
          label: 托管 / 竞争方
        - from: k8s
          to: astro
          label: 代理 / 部署复杂度
        - from: dbt
          to: astro
          label: 扩张工作流
        - from: ol
          to: astro
          label: 血缘标准
        - from: astro
          to: enterprise
          label: 控制平面
        - from: enterprise
          to: astro
          label: ARR / 可背书性
    claimRefs:
      - CR017
      - CR021
      - CR022
      - CR023
      - CR029
      - CR030
      - CR037
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公司质量证据偏正面，但价格支撑和下行情景透明度滞后；合理结论是有条件跟进，而不是激进下注。
    data:
      nodes:
        - id: market
          label: 大型编排 / AI 工作流顺风
        - id: proof
          label: 强客户验证 + 留存信号
        - id: moat
          label: Airflow 主导权 + 运营层护城河
        - id: opacity
          label: 估值 / 条款 / 集中度不透明
        - id: risk
          label: 治理 + 依赖风险
        - id: call
          label: 观察 / 有条件推进
      edges:
        - from: market
          to: call
          label: 支撑
        - from: proof
          to: call
          label: 支撑
        - from: moat
          to: call
          label: 支撑
        - from: opacity
          to: call
          label: 约束
        - from: risk
          to: call
          label: 约束
    claimRefs:
      - CV001
      - CV009
      - CV020
      - CV021
      - CV023
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Astronomer 大概率应按高端基础设施区间估值，但公开证据不足以支撑使用公开市场最激进的倍数。
    data:
      items:
        - label: 成熟基础设施低端参照
          value: 8
          unit: x revenue
        - label: 克制的高端基础设施入场区间
          value: 10
          unit: x revenue
        - label: 高端基准区间
          value: 12
          unit: x revenue
        - label: 强劲上沿区间
          value: 15
          unit: x revenue
        - label: 顶级高端拉伸区间
          value: 20
          unit: x revenue
    approximationNotes: 柱形是根据公开可比公司区间和私人市场不确定性综合得出的承销倍数区间，并非 Astronomer 股票的直接报价。
    claimRefs:
      - CV011
      - CV012
      - CV016
      - CV031
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在现有公开证据基础下，用情景区间比点估计更站得住脚。
    data:
      items:
        - label: 悲观情景
          low: 0.45
          mid: 0.575
          high: 0.7
          unit: USD billions
        - label: 基准情景
          low: 0.9
          mid: 1.1
          high: 1.3
          unit: USD billions
        - label: 乐观情景
          low: 1.5
          mid: 1.85
          high: 2.2
          unit: USD billions
    approximationNotes: 区间是基于明确增长、留存和倍数假设的情景输出，不应误读为已观察到的市场估值标记。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV023
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Astronomer 在市场顺风和客户验证上得分较高，护城河够用，估值支撑和证据完整性最弱。
    data:
      items:
        - label: 市场顺风
          value: 8
          unit: /10
        - label: 客户验证
          value: 8
          unit: /10
        - label: 产品 / 护城河
          value: 7
          unit: /10
        - label: 经济性可见度
          value: 5
          unit: /10
        - label: 风险画像
          value: 5
          unit: /10
        - label: 估值支撑
          value: 4
          unit: /10
    approximationNotes: 评分是投委会使用的启发式判断，依据公开证据质量得出，并非管理层披露的内部 KPI。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV021
      - CV022
      - CV040
