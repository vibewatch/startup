        - from: platform
          to: revenue
          label: 竞争压力
        - from: concentration
          to: revenue
          label: 标杆客户风险
        - from: concentration
          to: valuation
          label: 倍数折价
        - from: revenue
          to: valuation
          label: 增长韧性
        - from: margin
          to: valuation
          label: 现金效率
        - from: financing
          to: valuation
          label: 条款压力
    claimRefs:
