companyProfile:
  summary: >-
    Astronomer 是一家围绕 Apache Airflow 建起来的私营企业基础设施公司。公开资料显示，公司 2018 年成立，并从 Airflow 生态维护者演进为更宽的编排控制平面，覆盖 Astro 托管
    Airflow、Observe、Otto、Remote Execution、Private Cloud 和 Cosmos。公司目前似乎总部位于 New York，同时与 Cincinnati 有很深的历史渊源；早期一份 SEC
    Form D 曾把 Astronomer, Inc. 列为一家在 Cincinnati 运营的 Delaware 公司。Astronomer 主要卖给企业里的技术买家：这些团队需要可靠编排数据工程、分析和 AI/ML
    工作流；公司靠混合用量模式变现，计费基础横跨部署、worker 和更高价值的企业控制能力。公开证据支持其增长强劲、NRR 高、企业客户 900+ 家，但当前 ARR、客户集中度、利润率和融资条款披露仍不完整。
  foundedDate: '2018-01-01'
  founders:
    - name: Pete DeJoy
      role: CEO 兼联合创始人
      claimRefs:
        - CO007
    - name: Ry Walker
      role: 前联合创始人
