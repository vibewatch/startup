      - number: '8.4'
        title: 退出准备度与最后尽调要求
        blocks:
          - type: paragraph
            body: >-
              Astronomer 比许多基础设施创业公司更具退出可能性：它已经卖进成熟企业，握有可见的开源控制点，如今也像在搭建后期软件公司需要的高管班子。CFO 加入、现场领导力增强，都是报告能力和 GTM
              成熟度的正面信号。战略买方可能包括云、数据或开发者平台公司，它们需要更强的编排层；如果公司能证明增长、留存、事故纪律和治理稳定性足够持久，公开市场路径也会更现实。尽管如此，最后的尽调清单不能省。投资人需要客户台账、模块级
              ARR、毛利率桥、服务收入结构、续约日历、股权结构表与优先股堆叠，以及坦诚的事故 / 治理历史，然后才能把公司当作溢价轮候选。在此之前，正确结论不是“永远不投”，而是“不要为公开记录尚未证明的东西支付过高价格”。
