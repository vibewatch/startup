        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              能力分化的速度快过品类标签。Astronomer 的逻辑是 Airflow 兼容性，加上可观测性、远程执行、私有云部署等企业控制平面能力。Prefect 的主张是 Python
              优先的工作流执行，配合无服务器和混合选项，以及越来越偏智能体的叙事。Dagster 的主张是以资产为中心的编排、血缘和可观测性，其官网也明确把这一模型与以任务为中心的 Airflow 作对比。Mage 将
              notebook、模块化代码、可观测性以及托管 / 私有云选项组合起来，服务 AI 数据管道。当 Kubernetes 原生并行计算是重心时，Argo 领先。dbt
              会进入采购对话，因为它把围绕转换的调度、CI/CD、监控和 AI 辅助开发打包起来，尽管它并不是完整的 Airflow 替代品。定价透明度参差不齐：Dagster 公布入门档和用量费率，dbt 公布
