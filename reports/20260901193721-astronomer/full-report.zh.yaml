        - 扩张可见度
        - 独立验证
      rows:
        - label: Booking.com
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
        - label: Together AI
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中高
              tone: positive
            - label: 低
              tone: warning
        - label: Janus Henderson
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
        - label: AAA Life / WeWork / LIQID / WesTrac 客户
          values:
            - label: 高
              tone: positive
            - label: 中高
              tone: positive
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
        - label: 评论聚合平台
          values:
            - label: 中
              tone: neutral
            - label: 中
              tone: neutral
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
    approximationNotes: 公开评价页面不少设有访问门槛，或信息并不完整，独立验证仍是最薄弱一环。
    claimRefs:
      - CU018
      - CU021
      - CU024
      - CU033
      - CU035
  - id: FU004
    title: 选定客户成效对比
    type: bar
    layout: standard
    summary: 公开案例反复强调运行时间、恢复、升级和成本都有改善，但这些指标只对应各自案例，并未标准化。
    data:
      items:
        - label: AAA Life 恢复时间改善
          value: 80
          unit: percent
        - label: WeWork 升级周期缩短
          value: 95
          unit: percent
        - label: LIQID 编排成本降低
          value: 63
          unit: percent
        - label: WesTrac 年度节省提升
          value: 36
          unit: percent
        - label: Campspot 夜间作业运行时间缩短
          value: 98
          unit: percent
    approximationNotes: 柱形对比的是选定案例中口径不同的成效指标，应读作“已有可见收益”的证明，而不是典型客户 ROI 的基准。
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余严重度最高的风险集中在隐私 / 合规落地、平台依赖、集中度不透明，以及领导层 / 治理信任。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 隐私 / 数据处理落地
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 中高
              tone: neutral
            - label: 高
              tone: negative
        - label: 云 / 平台依赖
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中
              tone: neutral
            - label: 高
              tone: negative
        - label: 客户集中度不透明
          values:
            - label: 未知-中
              tone: warning
            - label: 高
              tone: negative
            - label: 低
              tone: warning
            - label: 高
              tone: negative
        - label: 领导层 / 治理
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 运营复杂度 / 支持负担
          values:
            - label: 中高
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
    approximationNotes: 矩阵评级综合公开文件得出，并非来自管理层提供的事故或客户集中度数据。
    claimRefs:
      - CR001
      - CR012
      - CR019
      - CR025
      - CR026
      - CR031
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 少数核心风险可能迅速传导到续约、利润率、融资和估值。
    data:
      nodes:
        - id: governance
          label: 治理冲击
        - id: privacy
          label: 隐私 / 安全失误
        - id: platform
          label: 平台依赖
        - id: concentration
          label: 客户集中度
        - id: revenue
          label: 续约 / 增长
        - id: margin
          label: 支持 / 毛利率
        - id: financing
          label: 融资信心
        - id: valuation
          label: 估值 / 条款
      edges:
        - from: governance
          to: financing
          label: 信任
        - from: governance
          to: revenue
          label: 企业客户观感
        - from: privacy
          to: revenue
          label: 续约风险
        - from: privacy
          to: financing
          label: 风险溢价
        - from: platform
          to: margin
