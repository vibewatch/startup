      - number: '7.3'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，产品架构既是护城河，也是风险。Astro 降低运行 Airflow 的负担，但这一承诺取决于 Astronomer
              能否运营安全控制平面、保持运行时更新，并让客户免受故障或升级痛苦影响。安全页描述了多租户控制平面、单租户数据平面、VPC 隔离和加密传输，这是有意义的缓释。Remote
              Execution、专用集群和私有云选项进一步帮助敏感环境。但产品文档也揭示复杂性会重新进入的地方：Kubernetes 代理、网络设计、XCom 与密钥行为、多种部署模型，以及 Airflow 3
              大版本变化，都为实施错误和支持负担留下空间。状态页确认上游云事故仍会影响服务；评价证据则突出定价抱怨、日志缺失、设置 / 调试复杂，以及对高级功能更强可见性的要求。叠加 AWS 和 Google
              都在营销具备广泛生态集成的托管 Airflow 替代方案，Astronomer 必须持续证明自己的企业运营更强，而不能只靠 Airflow 熟悉度。
