      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              三股力量在拉动需求。第一，数字化转型和应用蔓延制造了更多跨系统工作，需要被调度、观测和治理。第二，AI 正从原型 notebook 进入生产工作流；Astronomer 自己的 2026 年调研证据称，32% 的
              Airflow 用户已经在生产中使用 GenAI 或 MLOps 场景，Astro
              客户中的比例明显更高。第三，混合云和安全要求利好这类平台：编排逻辑保持一致，执行则可以落在托管、远程或私有环境中。但同样的力量也带来采用约束。愿意自管的团队可以把开源 Airflow 当成可信免费替代品。AWS
              和 Google 都提供托管 Airflow，Azure 则占据相邻的数据集成位置，可以在无需以 Airflow 为先采购的情况下满足部分买方需求。品类边界也很模糊：广义工作流 TAM 会夸大
              Astronomer 可触达市场，而 AI 编排叙事可能在治理、可观测性和模型风险控制到位前，诱导过早的收入假设。净效果是：市场结构有吸引力且真实增长，但并非每一美元编排支出都现实可归 Astronomer。
