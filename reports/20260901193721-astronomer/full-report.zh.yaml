  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑
      - 什么会改变判断
    rows:
      - - 托管 Airflow 与企业编排运营的品类领导者
        - 产品线宽、持续维护开源项目，客户证据也强
        - 若赢单 / 输单数据显示超大规模云替代方案持续击败 Astro，投资逻辑会削弱
      - - 客户证据指向持久的产品市场匹配
        - 具名标杆显示生产关键使用、迁移和可量化成果
        - 若台账显示 GRR 差，或客户脆弱性来自集中度，投资逻辑会削弱
      - - 增长和 NRR 支撑相对商品化基础设施厂商的溢价
        - 官方发布提到强劲增长和 120%+ 至 130% NRR
        - 净留存放慢、附加率疲软或利润率压缩的证据会降低溢价
      - - 相比公司质量，估值支撑偏弱
        - 官方和独立来源都未清楚披露当前估值或条款
        - 经过核验的股权结构表、董事会材料和经审计 KPI 材料会提高信心
      - - 治理是折价因素，但不一定否决交易
        - 2025 年领导层冲击确实存在，但后续高管招聘改善了态势
        - 再次被迫过渡或隐藏法律问题会把折价变成红旗
      - - 价格不对时，捆绑竞争会封顶上行空间
        - MWAA 和 Google Managed Service for Apache Airflow 让这个品类可被挑战
        - 持续更高胜率叠加附加扩张，可能支撑更高估值带
    notes: 估值驱动了反向逻辑的一部分，并非纯粹来自产品；用于后期私有软件轮次，这种框架合理。
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV032
      - CV033
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 40%+ 持续增长、120%+ NRR、广泛模块附加、治理稳定、强 AI 工作流顺风
        - 支撑溢价基础设施倍数和随时间达到数十亿美元级结果；若 2026 年入场价接近最后已知标记，上行空间可能很强
        - 云捆绑竞争、隐藏集中度，或服务拖累利润率
        - 有可能，但需要管理层数据确认扩张广度
      - - 基准
        - 30–40% 增长，NRR 高于 100%，增量在十几个点的中段，模块附加健康但未全面铺开，报告纪律逐步成熟
        - 支撑中等溢价的软件基础设施估值带；若入场有纪律，回报不错但不惊艳
        - 倍数压缩、增购放慢，或相对托管 Airflow 替代方案的价格压力
        - 与公开证据最一致的情景
      - - 悲观
        - 增长跌破约 25%，NRR 向 100% 出头滑落，集中度或事故问题浮现，治理溢价消失
        - 估值压缩到成熟基础设施估值带，或低于最后有证据支撑的私有标记
        - 云捆绑压力、支持负担，或客户台账意外
        - 若未披露风险大于公开证据显示，下行会很大
    notes: 这些情景是承销框架，不是管理层指引或市场报价。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV023
      - CV034
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Elastic
        - 当前市销率（TTM）
        - ~7.70x
        - 成熟数据 / 搜索平台的公开基础设施倍数下界
        - 业务比 Astronomer 更宽、更成熟
      - - MongoDB
        - 当前市销率（TTM）
        - ~12.0x
        - 具平台属性的开发者 / 基础设施软件的中段可比参考
        - 不是工作流编排公司；规模大得多
      - - Datadog
        - 当前市销率（TTM）
        - ~20.2x
        - 具控制平面和用量计费属性的基础设施软件的上沿可比参考
        - 可观测性不是编排，且 Datadog 公开市场流动性和规模更强
      - - Cloudflare
        - 当前市销率（TTM）
        - ~66.6x
        - 拉伸上界，显示市场愿为受追捧的基础设施 / AI 叙事支付什么价格
        - 直接可比性远低于其他公司，承销 Astronomer 时可能过于昂贵
      - - Astronomer 私有市场锚点
        - 最后已知私有估值
        - Private Market View 显示约 $775M；官方 Series D 估值未披露
        - 当前公开证据能支撑的直接入场锚点
        - 价格信号稀疏、优先股堆叠不清，也没有公司清楚确认的当前标记
    notes: 仅用于方向性分带；公开可比倍数和私有市场标记聚合器，不能替代完整的董事会级估值材料。
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV015
      - CV016
      - CV031
    enumerationScope:
      coverage: sample
      basis: >-
        The table samples a small set of public infrastructure reference multiples plus one private anchor because no
        single comparable set fully matches Astronomer's scale, business model, and disclosure level.
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 净收入留存恶化
        - NRR 低于约 110%，或队列质量显著走弱
        - 削弱先落地再扩张逻辑和溢价倍数支撑
        - 重新定到更低倍数区间，或暂停交易
      - - 客户集中度意外
        - Top-10 ARR 占比很高或快速上升
        - 把客户证据变成集中暴露风险
        - 要求更强交易结构或更低入场价
      - - 可靠性或安全冲击
        - 重大事件、多次 sev-1 模式，或审计失败
        - 损害企业信任、续约和估值
        - 视为近期投资逻辑破裂
      - - 治理复发
        - 再次被迫更换领导层，或出现隐藏争议
        - 拿掉信心折价缓冲，并压制退出准备度
        - 转入观察名单 / 不推进
      - - 云捆绑压缩
        - 相对 MWAA / Google 替代方案的胜率和扩张恶化
        - 封顶溢价叙事并压缩增长假设
        - 下调回报预期和持仓规模
    notes: 阈值刻意保持简单，便于投委会在尽调后或交割后监控。
    claimRefs:
      - CV018
      - CV019
      - CV022
      - CV033
      - CV036
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权
        - Series D 估值、清算优先权、按比例认购权和老股交易历史
        - 决定真实入场经济性和下行保护
        - 法务 + 财务尽调，与公司律师核对
      - - 客户台账
        - 按客户、细分市场、地域和模块划分的 ARR，以及头部账户集中度
        - 验证耐久性和经集中度调整后的估值
        - 收入运营 + 财务资料室请求
      - - 经济性质量
        - 毛利率桥、服务组合、基础设施成本负担和支持强度
        - 判断高溢价增长能否转成高溢价现金效率
        - 财务尽调和队列 / 单位经济性审查
      - - 留存质量
        - GRR、客户流失、续约时间表、队列 NRR 和扩张附加率
        - 确认公开 NRR 是广泛存在，还是由标杆账户驱动
        - 客户成功 + FP&A 尽调
      - - 事故与治理历史
        - Sev-1 日志、审计例外、董事会材料和 2025 年治理整改
        - 检验风险折价应收窄还是扩大
        - 安全尽调 + 董事会 / 治理审查
      - - 模块采用 / AI 暴露
        - Observe、Cosmos、Otto、Remote Execution 和 Private Cloud 附加率
        - 理清 Astronomer 正在变成更宽的平台，还是停留在托管 Airflow 单点解决方案
        - 产品分析 + 客户标杆访谈
    notes: 这些要求是最低资料包；拿到后，才能把有条件兴趣转成定价投资决定。
    claimRefs:
      - CV014
      - CV025
      - CV028
      - CV030
      - CV035
      - CV038
