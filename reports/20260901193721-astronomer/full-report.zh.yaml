      - number: '8.2'
        title: 估值背景与公开价格支撑
        blocks:
          - type: paragraph
            body: >-
              可访问的估值记录很薄，但仍有信息量。Astronomer 官方 Series D 新闻稿确认 2025 年 5 月融资 $93 million，独立报道称公司未公布估值。Private Market View
              列出 $775.0 million 的最后已知估值，并明确表示定价信号太少，无法发布综合估值；PM Insights 只给预览，详细机构数据集留在付费墙后。Tracxn 提供更多方向性背景——8 轮累计融资约
              $376 million、29
              家机构投资人——但公开视图遮蔽了大多数估值字段。因此，公开基础很窄，难以据此推断价格。可比上市基础设施公司交易区间很宽：成熟软件基础设施多为个位数销售倍数，增长更快或更受追捧的资产可到 20x
              以上，甚至进入高溢价 AI networking 区域。Astronomer 凭品类领导力、客户证据以及 AI/DataOps 顺风，理应有一定溢价；但如果管理层不开账本，公开毛利率、ARR
              和集中度数据缺失，估值应落在高溢价基础设施区间的中低段。
            claimRefs:
