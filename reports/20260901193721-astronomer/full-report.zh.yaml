      - - AI 与智能体工作流进入生产
        - 增长驱动
        - 近期 / 活跃
        - ML 和 GenAI 负载增加，带动编排、可观测性和治理需求
        - 验证新增 Astronomer ARR 中，AI/ML 用例相对传统数据工程占比多少
      - - 混合云和多云复杂度
        - 增长驱动
        - 当前至中期
        - 利好能够跨公有云、远程执行和私有基础设施编排的控制平面
        - 量化部署灵活性在竞争评估中成为决定因素的频率
      - - 合规与安全要求
        - 企业级产品增长驱动
        - 当前且上升
        - 利好支持 VPC 隔离、私有云和可审计执行的供应商
        - 索取受监管客户集中度和实施负担的证据
      - - 开源 Airflow 作为免费替代
        - 约束
        - 长期存在
        - 买方议价力保持高位，也压住能自管团队的定价上限
        - 衡量自管 Airflow 向付费 Astro 层级迁移的比例
      - - 超大规模云厂商的托管 Airflow 替代方案
        - 约束
        - 当前
        - MWAA 和 Cloud Composer 能满足许多基础托管服务需求
        - 索取对 MWAA、Composer 及相邻 Azure 工作流的竞争赢 / 输数据
      - - 品类边界模糊
        - 约束
        - 当前
        - 广义工作流 TAM 可能高估 Astronomer 近期可触达支出
        - 用真实 Airflow 企业用户画像自下而上测算 SAM，而不是泛工作流 TAM
      - - 治理与 AI 正确性缺口
        - 约束
        - 当前存在，且随 AI 采用上升而加剧
        - 单靠编排无法保证模型质量、血缘完整或智能体行为安全
        - 评估客户在编排之外还需要多少额外产品或服务支出
