      - number: '3.3'
        title: 切换成本、分发与多栖使用
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本有意义，但很少是绝对的。Python DAG、SQL
              模型和容器化任务具备足够可移植性，买方可以跨工具多栖；但围绕它们建立的运营上下文很黏：元数据、血缘约定、运行时假设、部署封装、监控手册、安全评审、支持关系和内部工程习惯都会制造摩擦。因此，云分发能力很重要。MWAA、Composer、Step
              Functions 和 Databricks 借助既有采购轨道和更宽的平台承诺，让买方在更大的云或 lakehouse 合同内解决编排。Astronomer 的反击点是互操作性：它可以承接买方既有 Airflow
              投资，同时承诺更好的企业运营和更灵活的部署。Prefect 和 Dagster 从不同架构出发提出类似论点；Argo 和 dbt
              则常常共存，而不是彻底替代彼此。结果是：多栖使用很常见，推倒重来式替换有选择地发生，赢单往往意味着拥有某一类工作负载的控制平面，而不是拿下企业里的每一个工作流。
