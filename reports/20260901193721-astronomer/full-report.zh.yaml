  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Astronomer 的变现方式现在比前文更清晰，因为公司公开了明确的 Astro 定价结构。核心引擎是用量计费：客户为部署、worker
              和专用集群付费，计费按小时衡量，并精确累计到秒。因此，这门生意混合了经典企业软件订阅特征和基础设施消耗经济性。Developer 和 Team 计划公布起价；Business、Enterprise 和
              Private Cloud 则把买方推向议价合同。定价栈暗示两层收入。第一层是与 Airflow
              环境和工作负载强度挂钩的经常性平台消耗。第二层是治理、支持、可靠性和部署控制的变现，例如高可用、远程执行、私有云和企业安全。专业服务似乎是第三条辅助收入流，尤其在迁移、架构和优化工作能加速价值实现的场景中。结果不是纯席位制
              SaaS，也不是纯云转售模式；它是一种混合变现结构，带计算支撑的用量驱动底盘，企业级打包扩大平均合同价值。
