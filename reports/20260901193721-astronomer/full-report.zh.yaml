      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方不是泛化的自动化经理。Astronomer 的实际用户是数据工程师、平台团队、ML 工程师和分析基础设施运营者；他们已经理解 DAG、Python 和共享执行环境。Booking.com、Together
              AI 和 Janus Henderson 的客户故事都指向技术成熟团队：这些团队已经依赖类似 Airflow 的编排，或已触及碎片化替代方案的上限。签约买方通常是更宽的数据平台或 IT
              负责人，因为采购覆盖基础设施可靠性、安全姿态、部署模型和共享工程效率，而不是单个应用工作流。因此，付款方往往是集中式数据、平台或 CIO 赞助的转型预算。采用通常始于自管 Airflow、MWAA、Cloud
              Composer，或调度器与管道工具的碎片化组合；当组织需要更高可用性、治理、可观测性、AI
              工作负载支持、多团队标准化，或远程执行、私有云等部署选项时，商业转化才会发生。这是一个技术取向很强的市场，社区和开源装机基础创造漏斗顶部；但只有当平台证明能降低运维负担、且不强迫团队重写管道编写方式时，企业预算才会真正打开。
