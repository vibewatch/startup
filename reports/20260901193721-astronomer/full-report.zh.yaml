  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              只有按买方任务分组，Astronomer 的竞争集才讲得通。直接同业是把编排本身作为数据和 AI 工作负载核心产品来销售的平台：Prefect 和 Dagster 最接近，Mage 则从 AI
              数据管道侧推进。AWS MWAA 和 Google Cloud Composer 等既有托管 Airflow 厂商，在买方主要想要托管
              Airflow、降低运维负担时形成竞争，即便它们在跨云定位或企业支持深度上未必追上 Astronomer。Argo Workflows、AWS Step Functions、Databricks Lakeflow
              Jobs 和 dbt 更适合被看作相邻替代品，而不是一对一对手。Argo 是 Kubernetes 原生的批处理和 ML 编排；Step Functions 是 AWS
              原生的应用与智能体工作流编排；Databricks 是更宽的数据与 AI 平台，带有原生工作流管理；dbt 主要是转换加数据开发工作流。最持久的替代方案仍是基于开源 Airflow 的内部自建。这意味着
              Astronomer 同时在和商业厂商竞争，也在和一个命题竞争：足够熟练的团队完全可以自己运行 Airflow。
