      - number: '2.2'
        title: 市场规模与估算分歧
        blocks:
          - type: paragraph
            body: >-
              已发布估算分歧很大，而分歧本身就有信息量。The Business Research Company 将工作流编排市场估为 2025 年 $19.36 billion、2026 年 $21.93
              billion，并在 2030 年增至 $36.45 billion。Verified Market Reports 给出的工作流编排快照小得多：2025 年 $8.45 billion，2033 年
              $16.21 billion。相比之下，SNS Insider 单独划出 AI 工作流编排，2025 年 $4.63 billion、2026E 年 $6.25 billion，但预计到 2035 年 CAGR
              高达 35.3%。最稳妥的解读不是挑一个「正确」TAM，而是分层看。广义工作流编排捕捉的是大型自动化控制平面预算。AI 工作流编排规模更小，但增速快得多。Astronomer 夹在两者之间，因为 Airflow
              已经是数据与 ML 执行层，Astronomer 官方证据也显示 Airflow 越来越多用于生产级 AI 工作负载。这使得广义 $20B 上限对近期投资测算过于宽松，而仅 AI
              子赛道又低估了存量基础机会。更现实的投资框架，是把工作流编排估算当作外层边界，把 AI 编排估算当作增长信号，把 Airflow 采用指标当作最接近可观察需求的代理。
