              公开留存与扩张图景令人鼓舞，但不完整。Astronomer 的融资和高管任命公告披露，2025 年净留存率为 130%，2026 年为
              120%+，这强烈暗示存量客户内部仍在扩张。扩张机制在客户故事里可见：从遗留调度器或既有托管 Airflow 厂商迁移，增加部署，接管更宽工作流，采用 Cosmos 支持 dbt，使用 Observe 管理
              SLA 和血缘，并开始关注 Otto 或 AI 工作流支持。这看起来像典型的先落地再扩张基础设施动议。但集中度风险仍不透明。可见 logo 偏大且成熟，这有利于企业适配，却提出未解问题：头部客户 ARR
