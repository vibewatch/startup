      - number: '8.3'
        title: 乐观、基准、悲观情景承销
        blocks:
          - type: paragraph
            body: >-
              Astronomer 的估值更适合用情景框架，而不是点估值。乐观情景下，公司继续复合式扩大企业采用，在客户基础中广泛叠加 Cosmos、Observe、Otto 等模块；Airflow 和 AI
              工作流需求持续扩张，同时强留存守住。即使今天的公开估值证据不完整，该情景仍可在长期支撑数十亿美元级结果。基准情景下，Astronomer
              仍是高质量控制平面公司，但增长更像一家强劲、有竞争力的基础设施供应商，而不是跳出品类约束的垄断者；留存健康，定价权存在但有限，云厂商打包压力压住估值倍数。悲观情景下，一个或多个隐藏问题——客户集中、重交付带来的利润率压力、治理反复，或打包厂商补齐功能差距——会同时压缩增长和估值。由于公开证据未完整覆盖准确
              ARR 和优先权条款，这些情景应作为入场纪律框架阅读，而不是可交易目标。
