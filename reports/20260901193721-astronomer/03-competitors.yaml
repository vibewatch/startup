- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Astronomer
    - Direct peer / Airflow control plane
    - 700+ enterprises claimed; 80,000+ org Airflow ecosystem backdrop
    - Enterprise data, platform, and AI teams
    - Managed Airflow plus observability, remote execution, private cloud, enterprise support
    - Public pricing opaque; depends on Airflow remaining central
  - - Prefect
    - Direct peer
    - Open-source core; Prefect Cloud says it automates 200M+ data tasks monthly
    - Data, ML, and agent workflow teams
    - Python-first execution, serverless and hybrid deployment, agent/MCP story
    - Public pricing details sparse; less Airflow-native than Astronomer
  - - Dagster
    - Direct peer
    - Open-source core with managed Dagster+ tiers
    - Modern data platforms and data-asset teams
    - Asset-centric model, lineage, observability, governed agent narrative
    - Different abstraction from Airflow can raise migration friction
  - - Mage
    - Adjacent peer
    - Open-source and managed / private cloud options
    - AI data pipeline and analytics engineering teams
    - Notebook-to-production workflow, hybrid framework, AI-friendly posture
    - Smaller enterprise proof and pricing less standardized
  - - AWS MWAA / Google Composer
    - Managed-Airflow incumbents
    - Embedded in hyperscaler clouds
    - Teams wanting hosted Airflow inside existing cloud relationship
    - Baseline managed Airflow with cloud-native security/scaling
    - Cloud-specific scope and less independent control-plane identity
  - - Argo Workflows
    - Open-source substitute
    - Popular Kubernetes workflow engine
    - Kubernetes-native ML, data processing, CI/CD teams
    - Container-native parallel jobs, cloud agnostic on Kubernetes
    - Requires Kubernetes operating sophistication and lacks Airflow compatibility
  - - AWS Step Functions
    - Adjacent substitute
    - Bundled inside AWS application stack
    - App, integration, incident-response, and agentic workflow builders
    - Serverless orchestration with human-in-the-loop and agentic patterns
    - AWS-native model and not a data-engineering Airflow drop-in
  - - Databricks Lakeflow Jobs
    - Platform-bundle substitute
    - Trusted by thousands of organizations per Databricks
    - Lakehouse-centric data and AI teams
    - Native managed orchestration within broader data+AI platform
    - Best fit skews to Databricks-centric estates rather than heterogeneous Airflow shops
  - - dbt platform / dbt Core
    - Adjacent workflow substitute
    - 100,000+ member community cited by dbt docs
    - Analytics engineering and transformation workflows
    - Strong transformation context, scheduling, CI/CD, and governance
    - Not a full general-purpose orchestration control plane
  - - Self-managed Airflow / internal build
    - Status quo substitute
    - Massive OSS installed base
    - Cost-sensitive or highly capable platform teams
    - No vendor margin; maximal customization and control
    - Highest operational burden and slower enterprise support / upgrades
  notes: The table mixes direct peers and substitutes because buyers often compare multiple ways to solve the same orchestration-control problem.
