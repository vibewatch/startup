- id: moat-durability-and-adverse-evidence
  title: Moat durability and adverse evidence
  body: 'The adverse evidence is real. Prefect’s 2026 acquisition of Dagster Labs shows the field is consolidating around broader automation stacks rather than staying as narrow point products. Dagster openly attacks Airflow’s task-centric model and positions assets, lineage, and governed agents as a better operating abstraction. Hyperscalers are not standing still either: AWS Step Functions now markets agentic workflows and human-in-the-loop controls, while Databricks sells natively managed orchestration for any workload as part of a larger data-and-AI platform. These moves compress the distance between “orchestration vendor” and “platform bundle.” Astronomer therefore cannot rely on orchestration as a generic feature moat. Its more durable advantages are likely Airflow stewardship credibility, enterprise-specific operating expertise, and deployment flexibility across managed, remote, and private environments. Even those are contestable if open-source Airflow becomes easier to run, if hyperscalers
    close feature gaps, or if consolidation lets rivals combine execution, asset intelligence, and agent governance into a broader standard. The moat is real, but it is conditional rather than permanent.'
  claimRefs:
