- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public price / model
  - Included capabilities
  - Unknowns or caveats
  - Implication
  rows:
  - - Astronomer
    - No simple public list price retained
    - Enterprise Airflow platform, observability, deployment options
    - Steady-state pricing and discount structure not public
    - Enterprise buyers likely face custom commercial process
  - - Prefect
    - Pricing page retained but no usable public schedule in reviewed text
    - Prefect Cloud packaging exists
    - Public page did not expose comparable numbers in retained fetch
    - Price transparency is weaker than Dagster or dbt
  - - Dagster
    - Solo $10/month + $0.040/credit; Starter $100/month + $0.035/credit; serverless compute $0.010/minute
    - Managed Dagster+ tiers, serverless or hybrid options
    - Enterprise plan is custom
    - Strong pricing transparency for smaller teams
  - - dbt
    - Starter $100 per user/month; Enterprise and Enterprise+ tiers
    - Scheduling, CI/CD, docs, monitoring, alerting, model limits, Wizard credits
    - Transformation-centric economics do not map one-to-one to orchestration
    - Easy to compare for analytics teams but not a full Astronomer substitute
  - - Mage
    - $100/month + usage
    - Managed workflow environment plus infrastructure usage pricing
    - Private-cloud economics customized; usage can vary materially
    - Entry price looks accessible but total cost is workload-sensitive
  - - Databricks
    - Free trial plus cloud-resource charges and possible credits
    - Access to broader Data + AI platform
    - Steady-state workflow pricing is consumption oriented and not simple to isolate
    - Databricks can bundle orchestration inside larger platform spend
  - - MWAA / Composer / Step Functions
    - Usage-based cloud service economics
    - Managed or serverless orchestration inside cloud vendor
    - Cross-service charges and cloud consumption make apples-to-apples pricing hard
    - Procurement convenience is often more important than headline unit price
