tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public signal
  - Revenue quality
  - Diligence ask
  rows:
  - - Astro platform usage
    - Metered charges for clusters, deployments, and workers
    - Pricing pages disclose hourly list rates and per-second billing
    - High if workloads are production-critical and sticky
    - Request cohort usage curves and gross margins by workload tier
  - - Enterprise packaging
    - Business / Enterprise / Private Cloud negotiated contracts
    - Upper tiers add security, support, governance, remote execution, and private-cloud features
    - Potentially high ACV and better contribution margin if attach rates are strong
    - Request average ACV, contract length, and support burden by tier
  - - AI-assisted development features
    - Token-priced Astro AI usage plus bundled plan value
    - Public list price shows included monthly credits and per-million-token pricing
    - Early but monetizable if AI authoring becomes habitual
    - Request adoption, token gross margin, and cross-sell rate into paid plans
  - - Professional services
    - Migration, architecture, optimization, and installation assistance
    - Pricing and case studies reference migration help and professional services
    - Useful sales accelerator but could be lower-margin
    - Request services gross margin and ratio of services to software bookings
  - - Marketplace procurement
    - AWS, Azure, and GCP marketplace purchasing
    - Pricing page says existing marketplace commitments can apply
    - Supports channel convenience and faster procurement
    - Request take-rate impact and marketplace-influenced win rates
  notes: Astronomer appears to combine software subscription, infrastructure consumption, and services economics rather than relying on a single monetization model.
