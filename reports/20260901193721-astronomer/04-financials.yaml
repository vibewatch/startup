- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Net revenue retention
    - 130% in 2025 release; 120%+ in 2026 releases
    - Medium-high
    - Shows expansion and upsell strength
    - Request NRR by cohort, segment, and plan
  - - Top-line growth
    - 150%+ Astro ARR growth in 2025 release; 55% YoY growth in 2026 releases
    - Medium
    - Shows growth remains strong but has decelerated
    - Request absolute ARR / revenue bridge and booked-to-billed conversion
  - - Product utilization
    - 90%+ in 2025 Series D release
    - Medium
    - Suggests active deployment and low shelfware risk
    - Request metric definition and distribution across accounts
  - - Profitability path
    - Two-year path to profitability claimed in 2025
    - Medium
    - Important for runway and financing need
    - Request budget, burn multiple, and board plan
  - - Gross retention / churn
    - Undisclosed
    - High that it is missing
    - Critical for durability underwriting
    - Request GRR, logo churn, and revenue churn
  - - CAC payback / sales efficiency
    - Undisclosed
    - High that it is missing
    - Needed to judge GTM quality and payback on field expansion
    - Request CAC payback, magic number, quota attainment
  - - Gross margin
    - Undisclosed
    - High that it is missing
    - Core determinant of software quality and valuation multiple
    - Request gross margin by product and support burden
  - - Customer concentration
    - Undisclosed
    - High that it is missing
    - Large-enterprise skew may hide top-account dependence
    - Request top-10 customer ARR share and renewal schedule
  notes: Public signals are strong enough to indicate healthy expansion, but not enough to complete a real SaaS-quality underwriting model.
