- id: TI004
  title: Capital adequacy table
  columns:
  - Capital factor
  - Public status
  - Implication
  - Unknowns
  - Diligence ask
  rows:
  - - Series C financing
    - Astronomer raised $213M in March 2022
    - Funded Datakin acquisition, engineering, customer success, and GTM scaling
    - Cash remaining from round by 2025 not disclosed
    - Request historical cash balance bridge
  - - Series D financing
    - Astronomer raised $93M in May 2025
    - Provided fresh capital for R&D and international expansion
    - Valuation and terms not publicly disclosed by company
    - Request post-money, liquidation stack, and investor rights
  - - Early exempt offering
    - 2017 SEC Form D shows Astronomer, Inc. in Cincinnati filing an exempt securities offering
    - Supports long-duration venture-backed financing history
    - Public filing predates mainstream company narrative and does not map directly to later cap table
    - Request full financing chronology and cap table
  - - Finance leadership build-out
    - Astronomer hired IPO-experienced CFO in 2026
    - Suggests readiness for tighter operating discipline and optionality
    - Could indicate preparation for scale rather than imminent IPO
    - Request 24-month finance roadmap and audit readiness
  - - Field expansion
    - Astronomer hired Red Hat veteran to scale field operations in 2026
    - Signals continued GTM investment despite decelerating growth
    - Could raise burn if sales productivity lags
    - Request hiring plan, ramp assumptions, and sales productivity by rep cohort
  - - Cash / burn / runway
    - Undisclosed
    - Largest blocker to financing-dependency assessment
    - Cannot judge next-round timing from public sources
    - Request cash on hand, net burn, runway months, and covenant exposure
  notes: Historical round chronology lives in Company Overview; this table only mints local Financials claims needed for underwriting the balance-sheet question.
