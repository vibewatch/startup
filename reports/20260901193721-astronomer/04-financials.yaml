- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why public evidence is insufficient
  - Exact diligence path
  rows:
  - - Absolute ARR / revenue base
    - High
    - Growth percentages without a base cannot support valuation or burn analysis
    - Obtain monthly revenue bridge, ARR definition, and board-package KPIs
  - - Gross margin by product / deployment type
    - High
    - Usage businesses can look attractive while hiding infra-heavy service costs
    - Break out gross margin for managed, private-cloud, services, and AI usage
  - - Burn multiple / runway
    - High
    - No public cash or burn disclosure exists
    - Request cash balance, monthly burn, budget variance, and runway case
  - - Sales efficiency
    - High
    - Leadership hires imply GTM investment but not productivity
    - Request CAC, payback, magic number, rep ramp, and pipeline conversion
  - - Retention structure
    - Medium-high
    - NRR alone hides downgrade and logo churn dynamics
    - Request GRR, churn reasons, and renewal waterfall
  - - Contracting economics
    - Medium-high
    - Custom upper tiers obscure realized discounts and support load
    - Review sample MSAs, order forms, and support SLAs against pricing tiers
  notes: This chapter is intentionally explicit about what cannot be concluded from public data alone.
  claimRefs:
