  topStrengths:
    - >-
      Strong product-market fit around enterprise Airflow operations, supported by 900+ enterprise customers and
      production-critical customer proofs.
    - >-
      Hybrid control-plane strategy extends beyond managed Airflow into observability, private deployment, Remote
      Execution, and AI-assisted operations.
    - Public growth and retention signals remain strong, with 55% growth and 120%+ NRR disclosed in 2026 releases.
    - Open-source stewardship of Apache Airflow gives Astronomer category credibility and a broad ecosystem funnel.
  topRisks:
    - >-
      Current valuation and term support are weak in public sources; the company did not publicly disclose the Series D
      valuation or current preference stack.
    - >-
      Customer concentration, GRR, gross margin, and module attach rates remain undisclosed, limiting underwriting
      confidence.
    - Cloud-bundled managed-Airflow alternatives and dependence on Apache Airflow cap premium valuation upside.
    - >-
      Governance credibility was dented by the 2025 CEO disruption and still deserves diligence despite subsequent
      executive hires.
    - >-
      Mission-critical customer usage means any reliability, security, or support-quality lapse could transmit quickly
      into renewals and valuation.
  unresolvedGaps:
    - Exact current valuation, liquidation preferences, and any secondary pricing or employee-liquidity terms.
    - Current ARR, gross margin, and free-cash-flow profile by core platform versus services.
    - Top-customer concentration, GRR, renewal schedule, and expansion attach rates by module and cohort.
    - Full incident history, audit exceptions, and governance remediation details following the 2025 leadership event.
    - Evidence of whether premium customer references are representative of the median account base.
