company:
  name: Astronomer
chapter:
  number: 7
  title: Risks
  summary: Astronomer’s top residual risks are not that the product lacks relevance; they are that the company operates a mission-critical orchestration layer atop external platforms, sells into demanding enterprise privacy/security environments, and still discloses too little about concentration, incidents, and unit economics. The public record also shows a real governance scar from the 2025 CEO disruption, plus contractual and AI-feature caveats that make diligence discipline essential even if the category tailwind remains attractive.
sections:
- id: risk-ranking-and-investment-implication
  title: Severity-ranked risk picture
  body: 'Astronomer’s risk stack is best understood as a transmission problem: a control-plane company that sits in the middle of data and AI workflows inherits risk from customer data obligations, from Apache Airflow’s roadmap, from cloud infrastructure partners, and from enterprise procurement expectations. The company has several genuine mitigants—security architecture, private and dedicated deployment options, data-processing commitments, subprocessor notice terms, and visible customer adoption—but the residual exposure is still meaningful because many customers use Astro for revenue-impacting or operationally sensitive processes. The strongest public customer stories all point in the same direction: this software runs important jobs. That is good for stickiness and bad for incident tolerance. Investors should therefore underwrite Astronomer less like a light developer utility and more like a workflow control-plane vendor whose failures can cascade into customer operations, renewals,
    and valuation quickly. The highest-priority diligence items are privacy/compliance execution, platform dependency, concentration opacity, and leadership/execution discipline after the 2025 governance event.'
  claimRefs:
  - CR001
  - CR012
  - CR014
  - CR020
  - CR021
  - CR022
  - CR025
  - CR040
  figureRefs:
  - FR001
- id: legal-regulatory-and-contractual-risk
  title: Legal, regulatory, and contractual risk
  body: 'The reviewed legal documents show a company that is enterprise-aware but still operating in a nontrivial compliance zone. The privacy policy and DPA acknowledge GDPR-style personal-data handling, international transfers, subprocessor governance, and audit rights; the AI Addendum adds a newer risk surface by defining provider dependencies, output disclaimers, and EU AI Act-related use restrictions. The MSA also matters because it narrows Astronomer’s exposure in customer disputes: uptime is not guaranteed to be uninterrupted or error-free, liability is capped, suspension rights are broad in security or payment disputes, and renewals are structured around one-year terms unless notice is given. None of that is unusual for infrastructure SaaS, but it means customers with sensitive use cases may negotiate hard or demand custom controls. The open-source layer adds a second legal vector. Astronomer’s value proposition depends on Apache Airflow’s brand and ecosystem, yet Apache trademark
    and license rules make clear that commercial vendors cannot imply ASF sponsorship or misuse project marks. There is no reviewed evidence of active enforcement against Astronomer, but the legal perimeter is real and should be diligence-tested.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR009
  - CR010
