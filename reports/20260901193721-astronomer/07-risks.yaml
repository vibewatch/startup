- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Customer concentration opacity
    - Top-10 ARR share revealed as very high or rising
    - Top-10 customers exceed ~40% ARR or one logo exceeds ~10% ARR
    - Reprice risk, tighten ownership size, or pause investment
  - - Operational reliability
    - Incident rate or MTTR worsens on production workloads
    - Repeated sev-1 events, meaningful SLA credits, or flagship-logo churn after outages
    - Pause underwriting until reliability data improves
  - - Cloud / bundle competition
    - Win rates versus MWAA / Composer or expansion attach rates deteriorate
    - Bundled alternatives consistently beat Astronomer on TCO or renewals flatten
    - Lower terminal-multiple assumptions and growth outlook
  - - Legal / privacy execution
    - Security incident, regulator inquiry, or DPA exception volume spikes
    - Material incident affecting customer data or unresolved regulator/customer audit findings
    - Treat as thesis-break unless root cause and remediation are unusually strong
  - - Leadership credibility
    - Further executive instability or board controversy emerges
    - Another forced leadership change or meaningful enterprise-customer concern tied to governance
    - Move to watchlist / no-go posture regardless of product strength
  notes: Thresholds are underwriting heuristics and should be refined once management shares internal operating data.
