    severity: material
    topic: TR001 public legal register coverage
    missingEvidence: Court-record searches, private claim histories, customer contract exception logs, and formal counsel memo covering litigation, IP disputes, and regulatory inquiries.
    whyItMatters: Public policies and news do not reveal hidden disputes, negotiated exceptions, or near-miss compliance events.
    diligencePath: Run counsel-led legal diligence, request litigation schedule, and review top-customer redlines and audit requests.
