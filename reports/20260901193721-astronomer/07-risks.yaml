- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case / obligation
  - Jurisdiction
  - Public status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Data privacy, cross-border transfer, and subprocessor compliance
    - US / EEA / UK
    - Privacy Policy + DPA + SCC / UK transfer language are public
    - Medium-high
    - High
    - DPA, subprocessor notice rights, audit rights, customer controls, single-tenant data plane
    - Execution risk remains if customer data handling or subprocessor governance fails in practice
    - Request redlined DPA stats, audit packages, subprocessor history, and security incident history
  - - AI feature misuse, output correctness, and AI-law compliance
    - US / EU
    - AI Addendum is public and references EU AI Act Article 5 prohibitions
    - Medium
    - High
    - Human-oversight framing, output ownership assignment, AI-provider notice duties, non-training commitment without consent
    - Outputs are still provided as-is and customer misuse or provider changes can create legal/reputational issues
    - Request AI governance logs, model/provider inventory, and AI incident review process
  - - Open-source IP, license, and Apache trademark use
    - Global
    - Apache licensing and trademark policies are public; Astronomer depends on Airflow branding and stewardship
    - Medium
    - Medium-high
    - Apache 2.0 licensing framework, nominative-use rules, commercial differentiation around operations rather than code ownership
    - Any brand confusion, OSS governance conflict, or community trust erosion can weaken commercial positioning
    - Request OSS contribution policy, trademark review process, and inbound/outbound IP controls
  - - Contractual uptime, suspension, indemnity, and liability limitations
    - Customer contract jurisdictions; MSA governed by New York law
    - MSA and SLA are public
    - High
    - Medium-high
    - Support obligations, security addendum references, service-level addendum, contractual cure periods
    - Liability caps and SLA exclusions may leave customers dissatisfied after incidents and can trigger procurement friction
    - Review enterprise paper churn, redline frequency, and top contract exceptions
  - - Export controls and country restrictions
    - US and customer-access geographies
    - MSA explicitly references export/import law compliance and legality of continued operation by country
    - Low-medium
    - Medium
    - Contractual compliance language and right to terminate if operation becomes illegal
    - Geographic expansion can still be limited by regulatory change or sanctions regimes
    - Request geo-revenue map, denied-region controls, and sanctions screening procedures
  notes: Ordered by residual severity using only public evidence; this is a sample of the most visible legal and regulatory risks rather than a full counsel review.
