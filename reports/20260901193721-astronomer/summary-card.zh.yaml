  topStrengths:
    - 围绕企业级 Airflow 运维的产品市场匹配很强，900+ 家企业客户和生产关键客户案例支撑了这一点。
    - 混合控制平面策略不止托管 Airflow，还延伸到可观测性、私有部署、Remote Execution 和 AI 辅助运维。
    - 公开的增长和留存信号仍强，2026 年发布材料披露 55% 增长和 120%+ 净留存率（NRR）。
    - 维护 Apache Airflow 开源项目让 Astronomer 拿到品类可信度，也打开了更宽的生态漏斗。
  topRisks:
    - 公开来源对当前估值和条款的支撑偏弱；公司未公开披露 Series D 估值或当前优先股堆叠。
    - 客户集中度、总留存率（GRR）、毛利率和模块附加率仍未披露，压低了承销信心。
    - 云厂商打包的托管 Airflow 替代方案，以及对 Apache Airflow 的依赖，限制了溢价估值的上行空间。
    - 2025 年 CEO 风波削弱了治理可信度；虽然后续补强了高管团队，仍值得继续尽调。
    - 客户把它用在关键生产环节，任何可靠性、安全或支持质量失误，都可能迅速传导到续约和估值。
  unresolvedGaps:
    - 当前确切估值、清算优先权，以及任何老股定价或员工流动性条款。
    - 当前年经常性收入（ARR）、毛利率，以及核心平台与服务分别对应的自由现金流情况。
    - 头部客户集中度、总留存率（GRR）、续约节奏，以及按模块和队列拆分的扩张附加率。
    - 2025 年领导层事件后的完整事故历史、审计例外和治理整改细节。
    - 高端客户背书能否代表中位数客户群的证据。
