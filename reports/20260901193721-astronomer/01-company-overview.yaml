- id: milestones-dependencies-and-open-items
  title: Milestones, dependencies, and open items
  body: The milestone record shows Astronomer broadening from commercial Airflow support into a more complete enterprise orchestration platform. Product expansion moved from the 2022 Astro launch into observability, private-cloud deployment, and the Otto agent by 2025–2026, while case studies from Booking.com, Together AI, and Janus Henderson show the company attaching itself to demanding production data and AI workflows. At the same time, later diligence should inherit several boundaries from this overview. Astronomer’s thesis depends on continued Airflow centrality, customer willingness to standardize on an orchestration control plane, and management execution after the 2025 CEO disruption. It also depends on converting ecosystem momentum—80,000+ organizations using Airflow and 324 million 2024 downloads—into durable company-level economics. Those dependencies do not undermine the business, but they do explain why board rights, actual net retention cohorts, large-customer concentration,
    and direct evidence for valuation need to be treated as mandatory follow-up items in later chapters.
  claimRefs:
  - CO031
  - CO032
