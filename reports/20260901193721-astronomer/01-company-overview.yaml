  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-d-valuation
    missingEvidence: Direct cap-table or board materials showing the Series D post-money valuation and any secondary component.
    whyItMatters: The round amount is public, but valuation drives the valuation chapter and ownership dilution analysis.
    diligencePath: Request the financing documents, board consent package, and cap table tied to the May 2025 Series D.
    relatedQuestionRefs:
    - QO014
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, and major investor control provisions.
    whyItMatters: Governance concentration and refresh risk cannot be judged from press releases alone.
    diligencePath: Obtain the board roster, investor rights agreement, and most recent governance committee materials.
    relatedQuestionRefs:
    - QO008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, burn, cash runway, and current headcount.
    whyItMatters: Public growth snippets are not sufficient for underwriting efficiency or downside risk.
    diligencePath: Request audited or board-reviewed financial statements, KPI bridge, cohort retention tables, and payroll/headcount summaries.
    relatedQuestionRefs:
    - QO019
    - QO027
