company:
  name: Astronomer
chapter:
  number: 1
  title: Company Overview
  summary: Astronomer is the commercial steward behind Astro, an enterprise Apache Airflow platform that now spans orchestration, observability, private-cloud deployment, and an Airflow-specific AI agent called Otto. The best-corroborated public facts are the 2018 founding, the $213 million Series C in 2022, the $93 million Series D in May 2025, more than 700 enterprise customers, and 120%+ net revenue retention claims in 2026; exact current valuation, audited revenue, board composition, and current headcount remain public-evidence gaps.
sections:
- id: identity-product-and-scope
  title: Identity, product, and company scope
  body: Astronomer’s current public identity is clearer than the generic “Airflow vendor” label often attached to it. The homepage and about page frame the company as the infrastructure and orchestration layer for the agentic era, while the current product page shows a broader platform that bundles core workflow execution, observability, governance, remote execution, and private-cloud deployment. That positioning matters for later diligence because Astronomer is not selling only managed scheduling; it is trying to become the control plane that enterprise data teams use to move analytics, ML, and AI workflows from prototype into production. Otto extends that thesis further by packaging Astronomer’s operational Airflow knowledge into an agent that can build Dags, investigate failures, and plan upgrades with environment context. The important analytical boundary is that many public scale numbers refer to the Airflow ecosystem rather than Astronomer’s own revenue base, so later chapters must
    separate platform stewardship from direct company traction.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO029
  - CO042
  - CO044
  - CO045
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: founding-leadership-and-location
  title: Founding, leadership, and location
  body: Public materials establish Astronomer as a 2018-founded company, but they also show how the leadership story evolved over time. Historical releases describe a remote-first company with hubs in Cincinnati, New York, San Francisco, and San Jose, while more recent press releases and current site metadata point to New York as the operational headquarters. The leadership bench visible in retained sources includes Pete DeJoy as CEO and co-founder, Chris Lynch as CFO, Matt Simontacchi as president of field operations, Mike Haas as CRO, and Leo Zheng as CMO. Ry Walker’s own biography provides an additional founding signal, but public board composition and control rights are still missing from reviewed sources. The other important point is that Astronomer suffered a non-product leadership disruption in mid-2025 when then-CEO Andy Byron resigned after a viral incident, forcing a CEO transition that investors should treat as a governance and reputational diligence item rather than a proof of
    product weakness.
  claimRefs:
  - CO004
  - CO005
