companyProfile:
  summary: >-
    Astronomer is a private enterprise infrastructure company built around Apache Airflow. Public sources
    place the company’s founding in 2018 and show an evolution from Airflow stewardship into a broader
    orchestration control plane spanning Astro managed Airflow, Observe, Otto, Remote Execution, Private
    Cloud, and Cosmos. The company now appears headquartered in New York, with deep historical roots in
    Cincinnati, where an early SEC Form D listed Astronomer, Inc. as a Delaware corporation operating from
    Cincinnati. Astronomer sells primarily to technical enterprise buyers that need reliable orchestration
    for data engineering, analytics, and AI/ML workflows, and it monetizes via a hybrid usage-based model
    across deployments, workers, and higher-value enterprise controls. Public evidence supports strong
    growth, high NRR, and 900+ enterprise customers, but disclosure on current ARR, concentration, margins,
    and financing terms remains incomplete.
  foundedDate: '2018-01-01'
  founders:
    - name: Pete DeJoy
      role: CEO & Co-founder
      claimRefs: [CO007]
    - name: Ry Walker
      role: Former Co-founder
      claimRefs: [CO041]
  foundingLocation: Cincinnati, OH, USA
  headquarters: New York, NY, USA
  productSummary: >-
    Astronomer sells Astro, a managed Apache Airflow platform for building, deploying, scheduling, and
    monitoring data pipelines, plus adjacent modules including Observe, Otto, Astro CLI, Private Cloud,
    Remote Execution, and Cosmos. The product is best understood as an enterprise operating layer around
    Airflow rather than a replacement orchestration language.
  customerFocus: >-
    Enterprise and upper-mid-market technical teams in data engineering, analytics engineering, platform,
    and quantitative environments that run production data, analytics, and AI workflows.
  businessModel: >-
    Hybrid usage-based software model: base monetization comes from deployments, clusters, workers, and
    related consumption, while enterprise governance, support, security controls, and deployment
    flexibility expand contract value. Business and enterprise tiers also rely on direct sales and
    professional-services-assisted adoption.
  stage: Series D
  fundingStatus: >-
    Astronomer raised a $93M Series D in May 2025 after a $213M Series C in 2022. Accessible private-
    market sources indicate roughly $375M-$376M raised cumulatively, but the Series D valuation and current
    preference stack are not publicly disclosed; a third-party private-market aggregator lists a last-known
    valuation around $775M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO006, CO007, CI017, CE001, CE002, CI024, CI013, CV004, CV006, CV007, CU001]

summary:
  headline: >-
    Astronomer appears to be a real category leader in enterprise Airflow and DataOps, but the public
    record supports a track decision rather than a clean buy because valuation, concentration, and margin
    transparency lag the strength of the product and customer evidence.
  overallScore: 6.9
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: unknown
