- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Elastic
    - Current price-to-sales ratio (TTM)
    - ~7.70x
    - Lower-bound public infrastructure multiple for a mature data/search platform
    - Broader and more mature business than Astronomer
  - - MongoDB
    - Current price-to-sales ratio (TTM)
    - ~12.0x
    - Useful mid-band comp for developer/infrastructure software with platform characteristics
    - Not a workflow-orchestration company; materially larger scale
  - - Datadog
    - Current price-to-sales ratio (TTM)
    - ~20.2x
    - Upper-band comp for infrastructure software with control-plane and usage-based qualities
    - Observability is not orchestration and Datadog has stronger public-market liquidity and scale
  - - Cloudflare
    - Current price-to-sales ratio (TTM)
    - ~66.6x
    - Stretch upper bound showing what the market pays for favored infrastructure/AI narratives
    - Far less directly comparable than the other names and likely too rich for underwriting Astronomer
  - - Astronomer private-market anchor
    - Last-known private valuation
    - ~$775M per Private Market View; official Series D valuation undisclosed
    - Direct entry anchor for what public evidence currently supports
    - Sparse pricing signals, unclear preference stack, and no clean company-confirmed current mark
  notes: Use as directional banding only; public comp multiples and private-mark aggregators are not substitutes for a full board-quality valuation package.
