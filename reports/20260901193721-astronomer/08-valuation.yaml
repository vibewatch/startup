- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Net revenue retention deterioration
    - NRR falls below ~110% or cohort quality weakens materially
    - Undermines land-and-expand logic and premium multiple support
    - Re-rate to lower multiple band or pause deal
  - - Customer concentration surprise
    - Top-10 ARR share very high or rising rapidly
    - Turns customer proof into concentrated exposure risk
    - Demand stronger structure or lower entry price
  - - Reliability or security shock
    - Material incident, repeated sev-1 pattern, or audit failure
    - Damages enterprise trust, renewals, and valuation
    - Treat as near-term thesis break
  - - Governance relapse
    - Another forced leadership event or hidden dispute appears
    - Removes confidence discount buffer and pressures exit readiness
    - Move to watchlist / no-go
  - - Cloud bundle compression
    - Win rates and expansion versus MWAA / Google alternatives deteriorate
    - Caps premium narrative and compresses growth assumptions
    - Lower return expectations and ownership size
  notes: Thresholds are intentionally simple so the IC can monitor them after diligence or post-close.
  claimRefs:
  - CV018
  - CV019
  - CV022
  - CV033
  - CV036
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Series D valuation, liquidation preferences, pro rata rights, and secondary history
    - Determines true entry economics and downside protection
    - Legal + finance diligence with company counsel
  - - Customer ledger
    - ARR by customer, segment, geography, and module plus top-account concentration
    - Validates durability and concentration-adjusted valuation
    - Revenue operations + finance data room request
  - - Economics quality
    - Gross margin bridge, services mix, infrastructure cost burden, and support intensity
    - Determines whether premium growth converts into premium cash efficiency
    - Finance diligence and cohort/unit-economics review
  - - Retention quality
    - GRR, logo churn, renewal schedule, cohort NRR, and expansion attach rates
    - Confirms whether public NRR is broad or reference-account-driven
    - Customer success + FP&A diligence
  - - Incident and governance history
    - Sev-1 log, audit exceptions, board materials, and 2025 governance remediation
    - Tests whether risk discount should shrink or widen
    - Security diligence + board/governance review
  - - Module adoption / AI exposure
    - Observe, Cosmos, Otto, Remote Execution, and Private Cloud attach rates
    - Clarifies whether Astronomer is becoming a broader platform or staying a managed-Airflow point solution
    - Product analytics + customer reference calls
  notes: These asks are the minimum package needed before converting conditional interest into a priced investment decision.
