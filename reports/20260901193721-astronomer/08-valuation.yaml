- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - What would change the view
  rows:
  - - Astronomer is the category leader around managed Airflow and enterprise orchestration operations
    - Product breadth, open-source stewardship, and strong customer proof support this
    - Win/loss data showing hyperscaler alternatives consistently beat Astro would weaken the thesis
  - - Customer proof suggests durable product-market fit
    - Named references show production-critical use, migrations, and measurable outcomes
    - Ledger data showing poor GRR or concentration-driven logo fragility would weaken the thesis
  - - Growth and NRR justify a premium to commodity infrastructure vendors
    - Official releases cite strong growth and 120%+ to 130% NRR
    - Evidence of slowing net retention, attach-rate weakness, or margin compression would reduce the premium
  - - Valuation support is weak relative to company quality
    - Official and independent sources do not cleanly disclose current valuation or terms
    - A verified cap table, board package, and audited KPI deck would improve confidence
  - - Governance is a discount factor, not necessarily a deal-killer
    - 2025 leadership shock is real but later executive hires improve posture
    - Another forced transition or hidden legal issues would turn discount into red flag
  - - Bundled competition caps upside at the wrong price
    - MWAA and Google Managed Service for Apache Airflow make the category contestable
    - Sustained superior win rates plus attach expansion could justify a higher band
  notes: The anti-thesis is partly valuation-driven rather than purely product-driven, which is appropriate for a late-stage private software round.
