- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 40%+ sustained growth, 120%+ NRR, broad module attach, governance stability, strong AI workflow tailwind
    - Supports a premium infrastructure multiple and multi-billion-dollar outcome over time; a 2026 entry near the last-known mark could produce strong upside
    - Bundled cloud competition, hidden concentration, or margin drag from services
    - Possible, but requires management data to confirm breadth of expansion
  - - Base
    - 30–40% growth, NRR in the mid-teens above 100, healthy but not universal module attach, gradual reporting maturity
    - Supports a mid-premium software-infrastructure band and decent but not extraordinary return profile from a disciplined entry
    - Multiple compression, slower upsell, or pricing pressure versus managed-Airflow alternatives
    - Most evidence-consistent public case
  - - Bear
    - Growth falls below ~25%, NRR trends toward low 100s, concentration or incident issues emerge, governance premium disappears
    - Valuation compresses toward mature infrastructure bands or below the last-evidenced private mark
    - Cloud bundle pressure, support burden, or customer-ledger surprise
    - Material downside if undisclosed risks are larger than public proof suggests
  notes: These scenarios are underwriting frames, not management guidance or market quotes.
