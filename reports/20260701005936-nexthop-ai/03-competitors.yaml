- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why the threat is credible
  - Mitigation / diligence ask
  rows:
  - - Open-NOS credibility
    - SONiC / FBOSS / internal build are already mainstream enough that openness alone is not unique
    - High
    - SONiC, FBOSS, Meta DSF, and ESUN all reinforce openness as a category standard
    - Test whether customers are buying Nexthop support and validation rather than just the same open stack
  - - Custom co-design for hyperscalers
    - Arista, Cisco, HPE-Juniper, and NVIDIA already pursue the same top accounts
    - High
    - Incumbents now market AI-specific Ethernet programs and have broader GTM muscle
    - Request current design-win funnel, account-level references, and reasons for incumbent displacement
  - - Raw 51.2T / 102.4T performance
    - Comparable speeds are already available via Arista, Juniper, Celestica, and Edgecore
    - High
    - Merchant-silicon ODMs and incumbents both publish overlapping hardware envelopes
    - Require proof that Nexthop wins on deployment speed, telemetry, or optics reliability rather than ports alone
  - - Supplier access
    - Broadcom and optics dependencies can constrain availability and margin
    - High
    - Tomahawk and Jericho class silicon sit underneath multiple open-switch alternatives
    - Diligence LTAs, allocation priority, inventory buffers, and optics qualification plans
  - - NeoCloud turnkey opportunity
    - Cisco, NVIDIA, and HPE all target AI factories, sovereign cloud, or NeoCloud builds
    - Medium-high
    - Official launches now address the same rapid-deployment buyer segment
    - Map current NeoCloud wins, service coverage, and support staffing by account tier
  - - Ethernet displacement of InfiniBand
    - InfiniBand remains defensible in top-end training workloads
    - Medium-high
    - NVIDIA still anchors the closed-fabric substitute with performance and in-network-computing claims
    - Segment workloads where Ethernet still loses on job completion time or software maturity
  - - Distribution and trust gap
    - Incumbent channels and support programs can compress newcomer sales cycles
    - High
    - Arista cites channel leverage, Cisco sells broader bundles, and HPE says Juniper now benefits from larger GTM scale
    - Request field-support ratios, customer-success staffing, and partner strategy by geography and account type
  notes: Severity ranks underwriting impact on win rate, pricing power, or deployment certainty; it does not imply that every threat is already materializing in equal measure.
