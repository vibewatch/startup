callouts:
- calloutType: strength
  title: Open-NOS credibility is real, but only valuable if it wins support-heavy accounts
  body: 'Public evidence gives Nexthop a real claim to open-networking credibility: it says customers can run SONiC or FBOSS, it references three products already in the community SONiC repository, and it claims top-10 contributor plus governing-board status. That is more concrete than a generic “open” slogan. The constraint is that openness is already becoming table stakes for hyperscaler-style buyers, so Nexthop still has to prove that customers pay for its validation, deployment speed, and support—not just for access to the same open stack.'
  claimRefs:
  - CP003
  - CP004
  - CP048
  - CP055
- calloutType: risk
  title: Merchant silicon is compressing hardware uniqueness fast
  body: The strongest adverse evidence in this chapter is how quickly comparable hardware is becoming available. Arista, Juniper, Celestica, and Edgecore all publish 800G or 1.6T-era systems, and the Broadcom layer sits underneath much of that field. That does not make Nexthop irrelevant; it does mean that switch speed alone is not a moat. The investment question shifts toward software polish, co-design depth, optics qualification, and customer support execution.
  claimRefs:
  - CP031
  - CP032
  - CP033
  - CP046
  - CP047
  - CP050
- calloutType: risk
  title: Incumbent response and trust can outpace a feature-only wedge
  body: Cisco’s AI-order momentum, HPE’s expanded Juniper go-to-market, and NVIDIA’s networking revenue scale all show that the field is not standing still. Even if Ethernet keeps gaining, buyers still have strong incumbent choices and a live InfiniBand alternative for top-end training workloads. Nexthop therefore needs to win on account-specific customization and time-to-deploy before incumbents can bundle similar capabilities into broader trusted relationships.
  claimRefs:
  - CP015
  - CP022
  - CP027
  - CP044
  - CP049
  - CP054
