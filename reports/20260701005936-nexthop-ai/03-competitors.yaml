- id: durability-and-adverse-evidence
  title: Differentiation Durability and Adverse Evidence
  body: 'The adverse evidence does not say Nexthop lacks a wedge; it says the wedge is narrower and more execution-dependent than a simple bandwidth chart implies. Arista, Cisco, Juniper-HPE, and NVIDIA have all accelerated public AI networking programs, which means the buyer can increasingly shop for similar topologies, congestion features, and 800G or 1.6T transitions from incumbents with much larger installed bases. Merchant-silicon ODMs make the commoditization problem sharper by placing comparable raw hardware into the channel before Nexthop can rely on scale or distribution to defend itself. Fierce Network’s reporting adds a useful second constraint: Ethernet may be gaining, but InfiniBand still retains a training-workload franchise, so the substitute set is not collapsing to one standard. The consequence is that Nexthop’s moat argument should rest on account-level customization, open-NOS credibility, optics and validation work, and unusually fast customer co-development—not on proprietary
    lock-in or headline port counts. Public evidence still leaves material gaps on realized pricing, named production-customer conversion, and migration economics, so moat durability is plausible but not yet proven.'
