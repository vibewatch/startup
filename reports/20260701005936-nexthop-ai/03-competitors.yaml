company:
  name: Nexthop AI
chapter:
  number: 3
  title: Competitors
  summary: 'Nexthop AI is entering a market where every major alternative is already visible: Arista, Cisco, Juniper-HPE, and NVIDIA all market AI-specific Ethernet or InfiniBand fabrics; Broadcom-based ODM ecosystems make comparable 800G and 1.6T hardware available; and SONiC, FBOSS, and OCP standards preserve internal build as a live substitute. The company’s most credible wedge is therefore not raw switch speed but open-NOS alignment, custom system design, and account-level co-development for hyperscalers and NeoClouds—advantages that still have to outrun incumbent trust, supplier leverage, and rapid hardware commoditization.'
sections:
- id: landscape-and-direct-rivals
  title: Landscape and Direct Rival Classes
  body: 'Nexthop is not competing in an empty whitespace. The direct named peers already in public view are Arista, Cisco, Juniper-HPE, and NVIDIA, each of which now markets AI-specific network fabrics or software around the same buyer problem. Arista’s Etherlink family, Cisco’s Nexus and AI POD stack, Juniper’s QFX plus Apstra automation, and NVIDIA’s Spectrum-X Ethernet all address the same core requirement: moving AI traffic across 800G and 1.6T-era clusters with high radix, congestion control, and deployment tooling. The substitute field is broader still. Broadcom’s merchant-silicon layer powers many of the open-switch alternatives below the branded OEM tier, while Celestica and Edgecore already publish 51.2T and 102.4T systems that overlap Nexthop’s public spec envelope. Internal build is also not theoretical. SONiC, FBOSS, OCP-SAI, and ESUN show that large operators can combine multiple hardware vendors and open NOS stacks rather than standardize on one proprietary fabric. As a result,
    the chapter’s competitive lens must include direct public peers, incumbents, merchant-silicon ecosystems, ODM and JDM alternatives, and customer-built status-quo paths at the same time.'
