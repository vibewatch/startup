  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Per-port pricing, support attach, discount ladders, and realized gross-margin by customer tier across Nexthop and its closest rivals.
    whyItMatters: Without realized pricing and margin evidence, the chapter can compare packaging and list-price opacity but cannot underwrite competitive economics.
    diligencePath: Request current quotes, sample MSAs or SOWs, renewal terms, and gross-margin walk-throughs for at least one hyperscaler-style and one NeoCloud-style deployment.
    relatedQuestionRefs:
    - QP015
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: migration-economics
    missingEvidence: Publicly named win-loss examples showing the labor, NOS adaptation, and support-transition cost of moving from an incumbent or internal-build baseline to Nexthop.
    whyItMatters: The moat debate turns on whether buyers view Nexthop as an easy overlay on their current stack or as a fresh qualification burden with hidden migration cost.
    diligencePath: Request customer case studies with pilot-to-production timelines, ops-tool changes, retraining effort, and incident-response ownership before and after deployment.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: supplier-allocation
    missingEvidence: Allocation priority, long-term supply agreements, optics qualification timelines, and secondary-sourcing flexibility for Broadcom-class silicon and related optics.
    whyItMatters: If supplier access is the real bottleneck, merchant-silicon openness can still leave Nexthop at a scale disadvantage versus larger OEMs and cloud buyers.
    diligencePath: Request supplier concentration by major component, allocation terms, lead-time history, and evidence of qualified alternates at 800G and 1.6T.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named production customers, deployment volume, design-win conversion rates, and retention evidence that show Nexthop is winning against specific incumbent or internal-build baselines.
    whyItMatters: Public openness and product specs are not enough to prove durable competitive share; named customer proof is the bridge from compelling story to repeatable moat.
    diligencePath: Request an account list, shipped port counts, top-customer revenue mix, and at least two reference calls that explain why the buyer chose Nexthop over Arista, Cisco, NVIDIA, or internal build.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
    - TP004
