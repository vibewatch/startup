    - Internal capex plus engineering budgets rather than vendor fundraising
    - Largest cloud and AI-cluster operators
    - Multi-vendor NOS, disaggregated fabrics, public standards workstreams
    - Highest engineering burden, but lowest vendor lock-in if the operator has the software bench
