tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Buyer / user
  - Current public maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - 4000 family / NH-4010
    - Hyperscaler and NeoCloud fabric teams
    - Visible and documented
    - 51.2T 800G platform with ONIE, AI congestion features, and multiple NOS paths
    - Independent proof of the “lowest power” claim and named production wins is missing
  - - 4200 family / NH-4220
    - Cluster designers planning 1.6T rollouts
    - New but well specified
    - 102.4T air-cooled 2RU system positioned for rapid migration without rack or fiber changes
    - Public quick-start or safety guides for this family were not visible in the reviewed surface
  - - 5000 family / NH-5010
    - Scale-across and DCI architects
    - Visible and documented
    - Deep-buffer VOQ design with line-rate MACsec and long-reach interconnect support
    - Economics of the Disaggregated Spine architecture remain company-claimed
  - - Community SONiC / customer-selected NOS path
    - Hyperscaler software and operations teams
    - Core to the value proposition
    - Lets customers keep an open NOS and existing operational pipeline on Nexthop hardware
    - Exact version-by-platform support matrix is not public
  - - Nexthop NOS
    - NeoCloud operators wanting a turnkey stack
    - Current and company-positioned
    - SONiC-powered distribution with Nexthop-built SAI and support wrapper
    - Public release notes and security-change history are gated or thin
  - - BYoNOS / BYoSAI
    - Customers with internal NOS or ASIC-abstraction layers
    - Publicly described but operational details are opaque
    - Reduces forced OS lock-in and frames Nexthop as an integration partner instead of only a box vendor
    - No public package documentation or example integrations were reviewed
  - - Optics and cables portfolio
    - Layer-1 validation and deployment teams
    - Current complementary surface
    - Pre-validated optics, cables, and qualification work are used to argue faster and stabler deployment
    - Supplier list, qualification methodology, and economics are not public
  - - Support, release, and advisory surface
    - SRE and fleet-operations teams
    - Operationally real but partly gated
    - Support portal, API, replacement service, and lifecycle notices imply post-sale discipline
    - Benchmark reports and release notes are not openly inspectable from reviewed links
  notes: Rows summarize the public product surface and adjacent operational assets; they are not a full internal SKU, supplier, or software-support matrix.
