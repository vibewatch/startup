- id: trust-controls-compliance-and-technical-risks
  title: Trust controls, compliance, and technical risks
  body: The reviewed trust surface is strongest at the hardware level and weakest at the enterprise-software level. Public datasheets show TPM 2.0 on the three visible switch platforms, the NH-5010 explicitly documents line-rate 802.1AE MACsec on its high-speed ports, and the safety or compliance guides plus datasheets publish Class A and regional regulatory notices. The support hub also advertises advisories and lifecycle notices, which is better than having no public quality signal at all. But those positives do not add up to a comprehensive security posture. The April 2026 privacy policy is a website data-handling notice, not a product-security attestation. The reviewed sources do not provide a public SOC 2 or ISO 27001 scope statement, a secure-boot or attestation chain narrative, an SBOM, a CVE or incident ledger, or named manufacturing and supply-chain disclosures. Even the most interesting benchmark and release artifacts are login-gated. As a result, the right diligence stance is
    to accept concrete hardware and workflow claims where they are directly documented, but to discount unsupported power, deployment, and architecture-economics assertions until management provides private evidence. Nexthop’s biggest product risks are therefore not whether a switch exists, but whether the company can sustain release quality, supplier resilience, and enterprise trust as the portfolio expands.
