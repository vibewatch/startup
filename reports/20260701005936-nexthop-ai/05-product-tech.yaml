  name: Nexthop AI
chapter:
  number: 5
  title: Product & Technology
  summary: 'Nexthop has a real and unusually visible product surface for a young AI-networking company: three public switch families, open-NOS options, public install and safety guides, an optics-validation layer, and a support hub that together describe a hyperscaler-oriented deployment workflow rather than a sealed appliance. The architecture is technically plausible because it fits ONIE, SONiC, FBOSS, and Broadcom merchant-silicon ecosystems, but the hardest diligence questions still sit behind gated benchmark and release artifacts, missing public security attestations, and undisclosed supply-chain details.'
sections:
- id: product-definition-and-customer-workflow
  title: Product definition and customer workflow
  body: 'Nexthop is not presenting a single switch SKU as the product. The reviewed public surface describes a co-developed AI-data-center networking system for hyperscalers and NeoClouds: hardware platforms by fabric role, multiple NOS paths, pre-qualified optics and cables, and an operations surface for releases and support. In customer workflow terms, the job is to let a cloud buyer choose the right scale-out, front-end, or scale-across form factor, keep its preferred network software stack, qualify optics faster, and then integrate the result into the operator’s existing deployment pipeline rather than adopt a closed appliance model. That framing matters because it explains why Nexthop emphasizes SONiC, FBOSS compatibility, BYoNOS, and BYoSAI almost as much as raw throughput. The strongest product proof is around visible module packaging: 4000- and 4200-series systems for AI fabrics, the 5000-series for deep-buffer scale-across or DCI roles, software options from community SONiC to Nexthop
    NOS, and a complementary optics-and-cables layer focused on Layer-1 validation. The weakest part of the workflow story is that the company still withholds named hyperscaler customers, detailed support matrices, and independently auditable proof that the claimed deployment-speed and power benefits hold outside its own collateral.'
