- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Key dependency
  - Main risk
  rows:
  - - Bare-metal switch hardware plus ONIE
    - Provides the install and boot layer for multiple NOS choices
    - ONIE ecosystem and standard provisioning flow
    - If ONIE integration is immature, the open-stack story breaks at first boot
  - - 'Merchant silicon: Tomahawk 5, Tomahawk 6, Qumran3D'
    - Supplies forwarding, buffering, SerDes, and encryption resources
    - Broadcom roadmap, availability, and software enablement
    - Much of the hardware differentiation can be competed away by other Broadcom-based vendors
  - - NOS / SAI layer
    - Runs Community SONiC, Nexthop NOS, or customer-selected software
    - SONiC architecture, SAI support, and Nexthop integration work
    - Exact compatibility boundaries and support windows are not public
  - - FBOSS / custom-NOS path
    - Supports hyperscalers that keep internal control software
    - Customer engineering cooperation and ASIC adaptation
    - Public production proof for FBOSS compatibility is still company-claimed
  - - AI-network feature layer
    - Implements telemetry, QoS, congestion control, ECMP, and related tuning
    - Silicon features and software maturity
    - Public evidence does not expose tuning guidance or real-world counters
  - - Optics, cables, and Layer-1 validation
    - Stabilizes physical links and shortens qualification loops
    - Third-party optics supply and validation discipline
    - Supplier concentration and test methodology are not public
  - - Support, release, and case-management surface
    - Handles software images, issues, replacements, and advisories
    - Support portal, lifecycle governance, and release packaging
    - Critical artifacts exist but are partly gated
  - - Open-standards and community ecosystem
    - Keeps the stack interoperable across customers and vendors
    - SONiC governance, ONIE, and Ethernet standards bodies
    - The same openness that helps adoption also lowers moat and raises comparison pressure
  notes: This architecture is reconstructed from company datasheets, software pages, and external SONiC, FBOSS, ONIE, and Broadcom references rather than from a single vendor-published block diagram.
