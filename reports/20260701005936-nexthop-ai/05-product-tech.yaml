- id: architecture-open-networking-and-dependencies
  title: Architecture, open networking, and external dependencies
  body: 'The public architecture is credible but notably disaggregated. The hardware layers are merchant-silicon systems from Broadcom Tomahawk 5, Tomahawk 6, and Qumran3D families; the software layers are customer-selected SONiC or FBOSS variants, a Nexthop NOS distribution powered by SONiC, and packaging for BYoNOS and BYoSAI integration; and the boot or provisioning layer is ONIE rather than a sealed proprietary install path. External technical sources help explain why Nexthop keeps leaning on this stack. Microsoft’s SONiC architecture write-up describes containerized switching software, SWSS, and SAI abstraction across vendor hardware, while Meta’s FBOSS materials describe an agent-based, disaggregated switch-control approach. Those references do not validate Nexthop’s own implementation quality, but they do make the claimed operating model technically plausible. The upside is flexibility: a hyperscaler can preserve internal software and automation while buying hardware and integration
    help. The downside is also clear: Nexthop’s moat sits above the silicon and above the open NOS substrate, so supply, release quality, and integration execution matter more than any secret ASIC. The Disaggregated Spine concept fits that logic, but its cost and power deltas remain company-claimed rather than independently benchmarked.'
