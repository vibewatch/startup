callouts:
- calloutType: strength
  title: The strongest product signal is openness tied to concrete hardware
  body: Nexthop’s most credible strength is not a slogan about AI networking. It is the visible combination of real hardware surfaces, open-NOS positioning, ONIE-based provisioning, and optics-validation support that maps directly to hyperscaler operating preferences.
  claimRefs:
  - CE002
  - CE011
  - CE013
  - CE015
  - CE023
  - CE027
- calloutType: risk
  title: Differentiation sits above components the rest of the market can also buy
  body: Broadcom merchant silicon, SONiC, ONIE, and open Ethernet standards all help Nexthop sell into hyperscalers, but they also mean the moat depends on integration quality, release discipline, and support execution more than on proprietary silicon or closed software.
  claimRefs:
  - CE021
  - CE042
  - CE043
  - CE044
  - CE045
  - CE049
- calloutType: recommendation
  title: Management diligence should focus on the gated and private surfaces
  body: The next diligence step is not asking whether a switch exists. It is demanding accessible release notes, benchmark methodology, named deployment references, enterprise-security attestations, and a supply-chain map that turns the visible public surface into underwritable operating evidence.
  claimRefs:
  - CE039
  - CE048
  - CE049
  - CE052
