- id: TE002
  title: Workflow / use-case table
  columns:
  - Customer job
  - Current workflow problem
  - Nexthop deliverable
  - Public benefit signal
  - Limitation
  rows:
  - - Choose the right AI-fabric role
    - Operators need different leaf, spine, front-end, and DCI behaviors
    - 4000, 4200, and 5000 families plus Disaggregated Spine framing
    - Public materials consistently map products to scale-out, front-end, and scale-across jobs
    - Role definitions are visible, but multi-cluster design guidance is still marketing-level
  - - Preserve the preferred NOS and toolchain
    - Closed switch stacks force retraining and integration work
    - Community SONiC, Nexthop NOS, BYoNOS, BYoSAI, and SONiC/FBOSS support claims
    - Software-portfolio page explicitly sells “deploy your choice of NOS” and pipeline acceleration
    - Exact interoperability boundaries and supported releases are not public
  - - Qualify optics and Layer-1 behavior faster
    - 800G and 1.6T deployments can spend months on optics qualification
    - Complementary optics and cables with Layer-1 validation
    - Company materials say pre-validated optics reduce outages and deployment delays
    - Validation methods and supplier diversity are not disclosed
  - - Rack, cable, and bring up systems
    - Bare-metal hardware still needs predictable field procedures
    - Quick-start guides, ONIE preinstall, console and management bring-up steps
    - Public install guides show FRUs, rails, power, management, and verification tasks
    - Zero-touch automation examples are not public
  - - Operate and support the fleet
    - Large operators need ticketing, replacements, and lifecycle signals
    - Phone, email, portal, API case management, NBD replacement, and lifecycle notices
    - Support hub reads like a real support surface instead of a generic contact page
    - Public SLAs, response targets, and entitlement details are incomplete
  - - Upgrade software and verify maturity
    - Software quality is hard to underwrite without changelogs and benchmark data
    - Software-releases page and dated download artifacts
    - Sitemaps show recurring 2026 release artifacts across silicon branches
    - Direct release-note and benchmark links are login-gated
  notes: 'The workflow is framed from the buyer or operator perspective: select role, preserve software choices, validate optics, deploy hardware, then support and upgrade it.'
