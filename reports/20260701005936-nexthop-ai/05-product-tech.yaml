  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: performance-benchmark-proof
    missingEvidence: Independent benchmark methodology and raw test conditions for the 15-20% power-savings claim and the 30% lower cost/power Disaggregated Spine claim.
    whyItMatters: Those claims are central to the economic differentiation story but remain company-authored in the reviewed public record.
    diligencePath: Request the benchmark report, test harness, comparison baseline, and customer reference calls that can validate power, deployment time, and TCO under like-for-like conditions.
    relatedQuestionRefs:
    - QE020
    - QE021
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: material
    topic: gated-release-artifacts
    missingEvidence: Open access to the benchmark report and detailed software release notes linked from public Nexthop surfaces.
    whyItMatters: Without readable benchmark and changelog artifacts, outside buyers cannot audit performance methodology or release discipline from the public surface.
    diligencePath: Obtain credentialed access or a management data-room export for benchmark collateral, release notes, and historical image support matrices.
    relatedQuestionRefs:
    - QE013
    - QE021
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: enterprise-security-proof
    missingEvidence: Public or privately shareable evidence of SOC 2 or ISO scope, vulnerability management, incident history, SBOM practice, and secure-boot or attestation design.
    whyItMatters: Hardware TPM and MACsec disclosures do not by themselves establish software-release trust or enterprise control maturity.
    diligencePath: Request certification letters, control mappings, incident response procedures, and product-security architecture documents during management diligence.
    relatedQuestionRefs:
    - QE018
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
