evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, run-rate, gross margin, and any board-reported KPI pack.
    whyItMatters: >-
      Without operating metrics, stage and valuation must be judged primarily from funding, product, and ecosystem
      signals.
    diligencePath: Request the latest board deck, monthly KPI package, or audited management accounts.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-disclosure
    missingEvidence: Named customer roster, number of active hyperscaler and NeoCloud accounts, and concentration by top account.
    whyItMatters: >-
      The business model appears concentrated in a small number of very large programs, so customer proof is critical to
      diligence.
    diligencePath: Request customer list, pipeline by stage, and revenue concentration by top five accounts.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: Current employee count plus functional split across engineering, sales, support, and operations.
    whyItMatters: >-
      The only public headcount datapoint found was around 100 employees in March 2025, which is too stale for current
      scale or burn analysis.
    diligencePath: Request current org chart, HRIS export, or latest internal headcount dashboard.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: Fully diluted cap table, board rights, liquidation preferences, debt facilities, and any secondary transactions.
    whyItMatters: Public financing headlines identify names and round sizes but not ownership, control, or hidden leverage.
    diligencePath: Request financing docs, cap table, investor rights agreements, and any lender or secondary-sale schedule.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: leadership-governance
    missingEvidence: Complete board composition, dated executive-hire and departure chronology, and committee structure.
    whyItMatters: >-
      Public materials show a functional bench but do not fully resolve key-person dependence or organizational
      stability.
    diligencePath: Request board roster, executive-change log, and latest leadership org chart.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: qualification-cycles
    missingEvidence: >-
      Public data on hyperscaler or NeoCloud switch qualification timelines, pilot lengths, and acceptance criteria for
      a new AI Ethernet vendor.
    whyItMatters: >-
      Qualification latency is one of the biggest reasons SOM can be much smaller than SAM even when the technical wedge
      is real.
    diligencePath: >-
      Request customer references, pilot-to-production timelines, and current design-win funnel stages from management
      and reference accounts.
    relatedQuestionRefs:
      - QM021
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Per-port pricing, gross-margin ranges, support attach rates, and contract structure for custom versus turnkey AI
      switching programs.
    whyItMatters: >-
      Without price and margin visibility, public TAM rows cannot be translated into investable revenue or contribution
      economics.
    diligencePath: >-
      Request current pricing sheets, sample MSAs/SOWs, and blended gross-margin walk-throughs by product family and
      buyer segment.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: captive-internal-share
    missingEvidence: >-
      A quantified split between merchant-vendor purchases, captive internal platforms, and InfiniBand-led deployments
      inside AI back-end networks.
    whyItMatters: >-
      Internal-build and incumbent lock-in are the main reasons a broad Ethernet market can still produce a narrow
      serviceable slice for Nexthop.
    diligencePath: >-
      Triangulate customer-by-customer deployment maps using OCP disclosures, supply-chain checks, and management’s
      active-account pipeline.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som-precision
    missingEvidence: >-
      Named production customers, shipped port volumes, current backlog, and support-capacity constraints that would
      anchor a bottom-up SOM.
    whyItMatters: >-
      The public record supports only a rough range; valuation work will need a bottom-up view of actual deployments
      rather than headline market narratives.
    diligencePath: >-
      Request shipped-system counts, top-customer revenue mix, backlog conversion assumptions, and support headcount by
      account tier.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Per-port pricing, support attach, discount ladders, and realized gross-margin by customer tier across Nexthop and
      its closest rivals.
    whyItMatters: >-
      Without realized pricing and margin evidence, the chapter can compare packaging and list-price opacity but cannot
      underwrite competitive economics.
    diligencePath: >-
      Request current quotes, sample MSAs or SOWs, renewal terms, and gross-margin walk-throughs for at least one
      hyperscaler-style and one NeoCloud-style deployment.
    relatedQuestionRefs:
      - QP015
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: migration-economics
    missingEvidence: >-
      Publicly named win-loss examples showing the labor, NOS adaptation, and support-transition cost of moving from an
      incumbent or internal-build baseline to Nexthop.
    whyItMatters: >-
      The moat debate turns on whether buyers view Nexthop as an easy overlay on their current stack or as a fresh
      qualification burden with hidden migration cost.
    diligencePath: >-
      Request customer case studies with pilot-to-production timelines, ops-tool changes, retraining effort, and
      incident-response ownership before and after deployment.
    relatedQuestionRefs:
      - QP018
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: supplier-allocation
    missingEvidence: >-
      Allocation priority, long-term supply agreements, optics qualification timelines, and secondary-sourcing
      flexibility for Broadcom-class silicon and related optics.
    whyItMatters: >-
      If supplier access is the real bottleneck, merchant-silicon openness can still leave Nexthop at a scale
      disadvantage versus larger OEMs and cloud buyers.
    diligencePath: >-
      Request supplier concentration by major component, allocation terms, lead-time history, and evidence of qualified
      alternates at 800G and 1.6T.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named production customers, deployment volume, design-win conversion rates, and retention evidence that show
      Nexthop is winning against specific incumbent or internal-build baselines.
    whyItMatters: >-
      Public openness and product specs are not enough to prove durable competitive share; named customer proof is the
      bridge from compelling story to repeatable moat.
    diligencePath: >-
      Request an account list, shipped port counts, top-customer revenue mix, and at least two reference calls that
      explain why the buyer chose Nexthop over Arista, Cisco, NVIDIA, or internal build.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: Current revenue, ARR, and product-family revenue mix.
    whyItMatters: Revenue quality and valuation support cannot be assessed without actual conversion data.
    diligencePath: Request a monthly revenue bridge, ARR walk, and top-customer revenue split.
