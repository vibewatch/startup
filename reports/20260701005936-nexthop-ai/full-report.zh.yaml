  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 Nexthop AI 市场的最清晰方式，不是把它放进所有交换机市场，甚至也不是所有 AI 基础设施。Nexthop 的公开产品和发布材料把它放在 AI
              数据中心网络里的一个切片：买家需要用于横向扩展、跨域扩展和前端 fabric 的以太网交换系统，通常还想要开放 NOS 灵活性和一定程度的定制。这个边界很重要，因为市面上流通的宽口径 AI
              网络数字往往把以太网交换机、InfiniBand fabric 和光学器件打包在一起；一些乐观叙事还进一步模糊到更宽的 AI 云基础设施故事。现状替代方案也很强。买家可以继续从
              Arista、Cisco、NVIDIA 生态厂商和基于 Broadcom 的平台采购既有以太网系统，也可以通过 OCP 式硬件、FBOSS、SONiC，以及白盒或 JDM
              流程推进内部自建。换句话说，Nexthop 的真实市场，是 AI 集群以太网需求、开放或解耦运营偏好，以及买家愿意验证新供应商而非默认选择在位厂商或内部路径之间的交集。
