  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的公开细分从设计上就很窄。公司并不面向通用企业交换机买家做营销；自家首页、发布材料和投资人帖子反复把可触达客户基础框定为运行大型 AI 和云数据中心 fabric 的超大规模云厂商与
              NeoCloud 运营商。在这个细分里，付款账户通常是基础设施或平台预算负责人，运营买家是网络架构或云工程团队，日常用户则是关心部署速度、能效、开放 NOS 支持和生命周期可管理性的网络 SRE、集群运营和 AI
              基础设施团队。客户类型之间的公开差异也有意义。超大规模云账户被描述为定制、共同开发的 JDM 互动，允许买家指定硬件，并保留偏好的 SONiC 或 FBOSS 衍生软件路径；NeoCloud
              则被描述为更交钥匙的买家，可以采用硬化的 Nexthop NOS。外部市场背景支持这种细分：Cisco 和 AFL 都把 NeoCloud
              描述为不同于超大规模云厂商的独立买家类别，经济和运营约束也不同。仍然缺失的是按地域、账户数和收入带划分的基础披露，因此公开细分在买家工作流上强，在组合广度上弱。
