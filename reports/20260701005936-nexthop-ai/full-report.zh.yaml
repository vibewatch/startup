  - id: TU001
    title: 客户分群表
    columns:
      - 细分市场
      - 买方 / 用户 / 付款方
      - 主要用例
      - 规模 / 战略价值
      - 公开证据
      - 关键缺口
    rows:
      - - Hyperscaler 定制 JDM 账户
        - 买方 = 网络 / 平台负责人；用户 = 网络架构、SRE、AI 集群团队；付款方 = 中央基础设施资本开支
        - 为 scale-out、scale-across 和 front-end AI 集群构建定制以太网网络结构，同时保留买方选择的 NOS
        - 账户少，ACV 很高，有战略性设计导入潜力
        - 官方发布和隐身期发布材料反复描述面向 Hyperscaler 的定制解决方案
        - 没有公开具名 Hyperscaler 列表、地域组合或头部客户收入占比
      - - NeoCloud 交钥匙运营方
        - 买方 = 云平台 / 基础设施负责人；用户 = 运维团队；付款方 = AI 云建设预算
        - 交钥匙交换机 + 加固版 Nexthop NOS，面向希望更快部署并获得支持的运营方
        - 单体规模小于 Hyperscaler，但目标群体增长快
        - 2026 年 3 月产品发布和 Series B 新闻稿明确把 NeoCloud 方案与 Hyperscaler 定制动作区分开
        - 未获取到具名 NeoCloud 客户背书或生产案例
      - - 专用 AI IaaS / 保证容量 NeoCloud
        - 买方 = 云基础设施所有者；用户 = GPU 机群和服务交付团队；付款方 = 已签约 AI 云 capex/opex 预算
        - 固定期限或专用 AI 基础设施，提供保证容量
        - 如果拿下设计导入，可能带来多机架或园区级网络需求
        - Cisco 的 NeoCloud 分群把专用 AI IaaS 列为独立服务模式
        - 没有公开证据显示 Nexthop 已把该细分转化为披露客户
      - - 公有 AI 云 / 突发容量提供商
        - 买方 = 产品 / 运营负责人；用户 = 面向租户的平台团队；付款方 = 用量驱动的平台预算
        - 共享 GPU 池和弹性 AI 云服务，部署速度和供给很关键
        - GPU 池扩张时可带来重复硬件需求
        - Cisco 和 AFL 都把快速交付、高利用率 AI 云运营方描述为增长中的买方类别
        - 需求存在，但 Nexthop 的具体胜率和扩张数据仍属私有
      - - 电力优势或存量基础设施改造型 AI 运营方
        - 买方 = 园区或基础设施开发商；用户 = 数据中心和网络运营团队；付款方 = 项目融资 + 基础设施预算
        - 以电力为牵引的 AI 园区，需要有韧性的 DCI、光纤和模块化 scale-out 设计
        - 与 scale-across/DCI 产品相邻，但运营风险更高
        - AFL 和 Flexential 强调电力、光纤和选址约束是主要决策驱动因素
        - 没有证据公开把 Nexthop 与任何具体运营方、园区或地域绑定
    notes: 各行区分公开目标账户原型与已披露客户证据；战略价值指可能的合同重要性，不是已验证收入。
