      - number: '4.4'
        title: 公开牵引力缺口与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的公开财务叙事主要由融资事实和仍然缺失的信息构成。公司已披露发布时的 $110 million 和按 $4.2 billion 估值完成的 $500 million B 轮，因此披露股权资本合计
              $610 million。B
              轮新闻稿还称，资金将围绕产品组合扩展研发和基础设施能力。除此之外，能见度急剧下降。已审阅官方披露没有提供当前收入、ARR、客户数、员工数、预订量、积压订单、账上现金、烧钱速度、毛利率、CAC、回本周期或
              NRR，也未识别出公开债务或项目融资层。这意味着只能方向性讨论资本充足性。$610 million 对创业公司来说是一大笔资金，但当模式包含硬件资格验证、NBD
              备件池、长账户周期，以及对受限光学和商用硅市场的可能库存承诺时，它并不会自动变成过剩资本。一个简单情景带显示，如果月度烧钱速度最终约为 $10 million 到 $25
              million，仅披露股权就意味着营运资本冲击前约两到五年的现金跑道。由于实际烧钱速度是私有信息，这个区间是观察镜头，不是结论。
