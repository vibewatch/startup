        - 提供 Nexthop 各部门 opex 拆分和预期稳态经营模型
      - - 硅片层价值捕获参照
        - Broadcom 指引 non-GAAP 经营利润率 67%，NVIDIA FY26 GAAP 毛利率 71.1%
        - 中
        - 说明有多少价值可能留在上游硅片供应商，而不是系统厂商手里
        - 提供主要 BOM 类别、硅片采购条款和目标毛利率走廊
      - - 营运资本代理指标
        - Arista 持有约 $1.83B 库存，其中包括 $422.1M 评估库存
        - 中
        - 说明试用和验收会在确认收入前占住现金
        - 按产品族提供库存、产成品天数，以及任何寄售或评估库存
      - - 递延收入代理指标
        - Arista 2024 年末递延收入为 $2.79B，RPO 为 $3.4B
        - 中
        - 说明支持附着和验收条款可以改善收款时点，但会推迟 GAAP 收入确认
        - 提供支持合同期限、递延收入余额和剩余履约义务
      - - 已发布的交换机功耗包络
        - 在已审阅的 NH-4010 和 NH-5010 测试条件下，公布的典型到最大范围为 0.584kW 至 2.170kW，NH-4220 使用 5.2kW PSU
        - 中
        - 功耗、散热和备件同时塑造买方 TCO 和厂商支持负担
        - 提供系统级现场功耗数据、光模块假设和保修事件率
      - - 当前烧钱 / CAC / 回本周期 / NRR
        - 'null'
        - 中
        - 这些是评估可持续性和增长质量所需的核心单位经济性字段
        - 提供月度烧钱、按获客路径计算的全成本 CAC、logo 到爬坡时间、回本周期和净留存
    notes: null 表示未公开披露，不是零；代理指标行标注为公开可比项，避免本章把 Nexthop 数值与同行基准混同。
