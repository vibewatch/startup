      - number: '8.2'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Nexthop 的融资背景有支撑，但不能自证价值。一家创业公司从 2025 年 $110M 的启动轮，到 2026 年 $500M 的 Series
              B，显然已经获得强烈投资人信心；官方叙事也把这种信心与面向超大规模云厂商的产品、开放 NOS 灵活性和深度客户共同开发绑定在一起。但同样的融资事实也抬高了门槛。对一家收入未披露的年轻硬件厂商给出 $4.2B
              估值，举证责任就从“市场是否真实？”转为“公司是否已经以配得上这个溢价的规模在商业化？”公开证据回答不了这个问题。最接近的公开 Ethernet 可比公司 Arista 展示了好状态：规模、64.1%
              毛利率，以及已披露的递延收入和集中度动态。更广泛的可比组则说明，当一个网络故事更像多元化基础设施，而不是稀缺 AI
              杠杆时，低倍数结果很常见。因此入场纪律必须明确。在当前估值下，新投资人应该要求更低价格、优先股栈中的强下行保护，或一份能够足够快补上收入、利润率和集中度缺口的私下尽调包，避免这一轮沦为纯叙事估值。
