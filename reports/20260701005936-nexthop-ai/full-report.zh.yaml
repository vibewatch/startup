      - number: '3.2'
        title: 能力、打包与市场进入对比
        blocks:
          - type: paragraph
            body: >-
              从能力看，仅凭公开证据，Nexthop 可信但并非独一无二。它的公开组合覆盖 51.2T、102.4T 和深缓冲跨域扩展角色，并通过 SONiC、FBOSS 及自家基于 SONiC 的发行版强力押注开放 NOS
              支持。开放性很重要，因为部分竞争对手仍然更垂直、更有预设立场。NVIDIA 的价值主张集成度最高，把 Ethernet、InfiniBand、DPU 和纵向扩展互连放进同一栈；Cisco 和 Arista
              则围绕交换机销售更宽的 fabric 软件、遥测和经验证设计包装。Juniper 值得注意，因为 Apstra 明确支持 Juniper、Cisco、Arista 和 SONiC
              环境；不过，最强的多供应商功能位于高级许可证之后，而不是完全开放的软件姿态。在打包和定价上，整个品类的公开透明度都很薄。Juniper
              对软件层级说得最清楚，其他大多数厂商展示的是方案包、联系销售流程，或按报价推进的企业销售，而不是公开的每端口经济性。这意味着市场进入和支持信任几乎与硬件同样重要。Cisco 可以打包 AI POD
              和融资关系，Arista 带来长期云端可信度，HPE 则可通过更大的全球现场销售动作放大 Juniper。
