      - number: '2.3'
        title: 买家、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              买家图谱集中且多层。在超大规模云厂商项目里，技术评估方通常是网络架构、NOS 和 AI 基础设施团队，他们关心拓扑、缓冲、拥塞控制、NOS 兼容性、光学验证和部署速度。日常运营方则是实际运行 fabric 的网络
              SRE、平台或 AI 集群团队。经济付款方通常是中央基础设施资本开支负责人，而不是单个应用团队。NeoCloud 买家略有不同：创始人 CEO、CTO
              和基础设施负责人常常直接发起决策，项目融资或锚定客户合同会影响时点。Alphabet、Meta、CoreWeave、Lambda 和 Crusoe 的公开文件与官方发布说明了这件事为何重要：AI
              基础设施预算巨大，合同多年期，客户集中度高。这意味着 Nexthop 不需要数千个小客户也能变得重要，但也意味着每个设计定点都带有沉重的集中风险和漫长的验证后果。
