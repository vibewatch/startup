      - number: '3.4'
        title: 差异化持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是说 Nexthop 没有切入口；它说明这个切入口比一张简单带宽图暗示的更窄，也更依赖执行。Arista、Cisco、Juniper-HPE 和 NVIDIA 都已加速公开 AI
              网络项目，意味着买家越来越能从拥有更大装机基础的在位厂商那里买到相似拓扑、拥塞特性，以及 800G 或 1.6T 迁移路径。商用硅 ODM 把可比原始硬件更早放进渠道，也让商品化问题更尖锐，使 Nexthop
              很难仅靠规模或分销防守。Fierce Network 的报道又增加了第二项约束：以太网或许在增长，但 InfiniBand 在训练工作负载上仍保有阵地，因此替代集合并没有坍缩成一个标准。结果是，Nexthop
              的护城河论证应放在账户级定制、开放 NOS
              可信度、光学和验证工作，以及异常快速的客户共同开发上，而不是专有锁定或标题端口数。公开证据在实际定价、具名生产客户转化和迁移经济性上仍有重大缺口，所以护城河持久性可以成立，但尚未被证明。
