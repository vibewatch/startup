    Nexthop AI 是一家位于 Santa Clara、由创始人主导的私营 B 轮公司，为超大规模云厂商和 NeoCloud AI 数据中心打造开放式以太网交换系统。公司的公开产品组合把客户定制硬件、客户自选 NOS
