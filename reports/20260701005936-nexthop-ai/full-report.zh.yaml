        - 收入可能波动，部署数量也可能滞后于设计赢单
        - 可用来近似判断 Nexthop 可能面对的销售打法
        - Arista 10-K 风险因素
    notes: 这些是买方摩擦指标和可比周期代理，不是 Nexthop 特定运营指标； 它们说明客户漏斗可能卡在哪里。
