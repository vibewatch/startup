      - number: '7.4'
        title: 执行缓释措施与否决标准
        blocks:
          - type: paragraph
            body: >-
              公开缓释措施存在，但大多只能部分缓释，还不足以清除投资论点。Nexthop 已融资到足以配置关键职能，发布了支持和合规材料，并且在 SONiC
              治理中可见参与。这些都是真正的正面因素。问题在于，它们更多缓释运营可信度，而不是解决披露风险。投资案例仍取决于管理层能否证明出口和制裁控制已经落地，开源合规足够有纪律，发布和安全流程成熟到能满足风险敏感买方，以及狭窄的超大规模云厂商或
              NeoCloud 客户群能否转化为可重复收入，而不是被单一账户主导结果。实际应对方式是提前定义否决标准。如果出口规则收紧而公司无法拿出稳健的筛查流程，如果 Broadcom
              或光模块问题让某一代平台延误，如果公开或私下客户证明不能拓宽，如果支持和发布证据持续单薄，或者如果下一轮融资在没有相应证明跃升的情况下从 2026
              年估值重置条款，就应把投资论点视为受损。这些都是可监控条件，不是模糊担忧，因此既能用于初始尽调，也能用于未来刷新。
