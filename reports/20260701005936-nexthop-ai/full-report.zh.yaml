      - number: '6.4'
        title: 集中度、采购与反向信号
        blocks:
          - type: paragraph
            body: >-
              最大客户风险不是 Nexthop 缺少清晰目标细分，而是目标细分很小、要求高且有周期性。可比公开文件显示，这组买家的集中度可能走到极端：Arista 披露 Microsoft 和 Meta 分别贡献 2024
              年收入的 20% 和 15%，并警示订单时点取决于漫长评估、资格验证、验收和支出周期，同时大账户折扣会压迫利润率。这一点重要，因为 Nexthop
              正在追逐同类账户结构，但多元化程度更低。外部反向来源进一步强化采购摩擦。Flexential 的 2026 年调查称，网络问题、光纤稀缺、关税压力和政策不确定性正在延迟 AI 基础设施决策；AFL
              则指出，NeoCloud 运营商往往采购量更小，经济缓冲更紧，供应商依赖更高。Sequoia 的 AI 资本开支批评又加入二阶客户风险：如果 AI
              基础设施建设超过已实现终端用户需求，一些买家可能推迟网络采购，或要求更严苛的经济性。换句话说，少数大单可能改写 Nexthop 轨迹，但同样的集中度也会让收入时点、折扣和客户质量尽调成为投资案例的核心。
