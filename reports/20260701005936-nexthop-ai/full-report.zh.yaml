  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              Nexthop 公开商业图景足以识别收入模式，但还不足以衡量收入质量。官方材料显示，公司把硬件、软件和支持栈卖给数量很少的大型 AI 基础设施账户。公司称其构建客户专属系统，配备硬化 NOS
              支持和预先测试的互连方案；2026 年 3 月发布又补充，组合既包括现货产品，也包括高度定制的 JDM 项目。这个组合指向至少四条变现路径：标准交换平台、定制硬件设计定点、软件和 NOS
              启用，以及付费支持或更换服务。缺失的部分恰恰是投资人真正需要核验的内容：公开标价、实际 ASP、支持附加率、折扣政策、收入结构和具体会计政策。Arista
              的文件是有用参照，因为它展示了相似硬件厂商如何把已确认产品收入与按期确认的支持收入拆开，并在存在验收期或试用时递延收入。Nexthop 的支持 SKU
              和定制部署说明，这里也可能存在类似确认复杂性，尽管公司尚未公布政策。
