  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型 / 状态
      - 估值或最新 P/S 快照
      - 相关性
      - 主要限制
    rows:
      - - Arista Networks
        - 上市以太网 AI 网络厂商
        - ~$213.9B 市值；近期 P/S 约 16.45x-18.56x
        - 最接近的上市以太网组网可比对象，且真正暴露于 AI 网络
        - 规模大得多、已盈利且充分披露；风险画像不像初创硬件公司
      - - Cisco
        - 上市多元化网络平台
        - ~$463.0B 市值；最新公开 P/S 快照约 5.11x
        - 展示当叙事变成多元化基础设施后，低倍数结果会是什么样
        - 软件、安全和服务组合让它不太像年轻硬件厂商的可比对象
      - - HPE
        - 上市混合云和网络厂商
        - ~$59.7B 市值；最新公开 P/S 快照约 0.86x
        - 说明传统基础设施公司可能以低收入倍数交易
        - 网络只是更广企业组合中的一部分
      - - Broadcom
        - 上市 AI 和网络芯片平台
        - ~$1.797T 市值；最新公开 P/S 快照约 22.92x
        - 显示稀缺性位于芯片层时，AI 溢价倍数会落在哪里
        - 不是系统厂商可比对象，经济性结构上更厚
      - - NVIDIA
        - 上市计算和 AI 网络平台
        - ~$4.84T 市值；最新公开 P/S 快照约 20.77x
        - 展示全栈 AI 平台如何支撑极端市场价值
        - 远宽于网络业务，不能作为干净的硬件交换机参照
      - - Groq
        - 私有 AI 基础设施融资轮
        - 2025 年融资轮投后 $6.9B
        - 使用证明更强时，基础设施叙事如何定价的私募市场参照
        - 推理计算公司，不是直接网络硬件同行
    notes: 使用市值和最新可用公开 P/S 快照，而不是统一口径的 EV/NTM 倍数；这张表是方向锚，不是精确估值模型。
