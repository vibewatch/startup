      - number: '2.2'
        title: 规模测算视角与受约束的 TAM / SAM / SOM
        blocks:
          - type: paragraph
            body: >-
              公开规模证据只有在先说明边界时才有用。650 Group 最宽的视角指向 2025 年约 $20B 的 AI 网络市场，覆盖以太网、InfiniBand 和光学器件。同一家公司也拆出 AI 子层，称 2025
              年横向扩展网络应超过 $8B（不含光学），AI 前端网络应超过 $5B。Dell’Oro 给出另一种不同但高度相关的视角，认为仅以太网 AI 后端交换机就可能在五年内贡献近 $80B
              累计销售额。这些数字在增长方向上一致，但不能直接比较，因为它们采用不同层级、时间跨度和纳入规则。Nexthop 实际可服务市场还应更窄：它的产品集聚焦以太网交换系统，不是仅光学收入，不是仅 InfiniBand
              集群，也不是超大规模云厂商能自行构建的所有内部平台。结果是一套可用的尽调框架，而不是单一精确的 TAM 故事：广义 AI 网络市场很大且在增长，但 Nexthop
              可投资的切入口应建模为一个受约束、年规模数十亿美元的切片，短期 SOM 则小得多。
