      - number: '8.3'
        title: 情景视角与可比区间
        blocks:
          - type: paragraph
            body: >-
              情景框架应保持方向性，因为缺少收入和利润率数据时，虚假精确比有用更危险。牛市情景下，Nexthop 证明今天的产品和客户信号只是更大业务的前沿：已披露收入足以支撑溢价倍数，客户广度扩展到极少数旗舰账户之外，而且
              AI 网络需求按 650 Group、IDC 和 Dell’Oro 的预期继续扩宽。在那个世界里，当前估值可能显得早。基准情景没那么戏剧化，也更符合仅凭公开证据得到的判断：需求仍健康，但 Nexthop
              仍需要时间证明客户广度、利润率和可重复性，估值留在上一轮附近或略低。熊市情景则是典型的倍数压缩故事。如果 AI CapEx
              建设跑在变现之前，一两个大型部署滑期，或下一轮附带更硬的投资人保护，当前估值可能很快重置。可比公司表也应带着同样的克制阅读。Arista 是最干净的网络可比，Cisco 和 HPE
              展示低倍数多元化底部，Broadcom 和 NVIDIA 展示上游能容纳多少溢价，Groq 则说明当实时商业证明更强时，私营 AI 基础设施资本仍能接受高价。
