  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与直接竞争类别
        blocks:
          - type: paragraph
            body: >-
              Nexthop 并不是在空白市场竞争。公开视野中的直接具名同行已经包括 Arista、Cisco、Juniper-HPE 和 NVIDIA；它们现在都围绕同一个买家问题营销 AI 专用网络 fabric
              或软件。Arista 的 Etherlink 系列、Cisco 的 Nexus 和 AI POD 栈、Juniper 的 QFX 加 Apstra 自动化，以及 NVIDIA 的 Spectrum-X
              Ethernet，都在解决同一个核心需求：在 800G 和 1.6T 时代的集群中，以高 radix、拥塞控制和部署工具搬运 AI 流量。替代方案范围更宽。Broadcom 的商用硅层支撑了品牌 OEM
              层级以下许多开放交换替代方案，Celestica 和 Edgecore 已经发布与 Nexthop 公开规格范围重叠的 51.2T 和 102.4T
              系统。内部自建也不是理论。SONiC、FBOSS、OCP-SAI 和 ESUN 说明，大型运营商可以把多个硬件供应商和开放 NOS 栈组合起来，而不是标准化到一套专有
              fabric。因此，本章的竞争视角必须同时纳入直接公开同行、在位厂商、商用硅生态、ODM 与 JDM 替代方案，以及客户自建的现状路径。
