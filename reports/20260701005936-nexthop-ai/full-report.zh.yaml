        - Nexthop 的 DCI / scale-across 叙事切中真实买方痛点
        - Flexential 2026 调研
      - - 关税 / 政策压力
        - 40% 推迟或缩减 AI 基础设施采购；94% 称政策不确定性影响规划
        - 即便长期 AI 需求强劲，订单也可能顺延
        - 任何押注 AI 基础设施浪潮的创业公司都会面临时点风险
