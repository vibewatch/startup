        title: 融资、阶段与规模信号
        blocks:
          - type: paragraph
            body: >-
              融资进展是 Nexthop 公开记录里最清晰、可从外部验证的规模信号。公司 2025 年 3 月以 Lightspeed 领投的 $110 million 融资走出隐身模式；一年后又完成超额认购的 $500
              million B 轮，估值 $4.2 billion，仍由 Lightspeed 领投，Andreessen Horowitz 成为主要新投资人，Altimeter
              与既有投资人一同参与。这意味着公司约一年内至少披露了 $610 million 融资，足以在收入能见度出现前先支撑大规模工程和供应链建设。产品发布材料还称，截至 2026 年 3
              月，公司已向领先超大规模云厂商发货。这一点在方向上重要，因为它暗示项目已经越过单纯设计阶段。缺口在经营透明度：已审阅公开来源没有披露当前收入、年经常性收入（ARR）、毛利率、客户数、当前员工数、债务额度或任何老股交易。因此，更合适的解读是：Nexthop
              当前资金充足，商业推进中，但披露仍很轻。
