  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险敞口
        blocks:
          - type: paragraph
            body: >-
              关键法律风险不在于 Nexthop
              今天已经背上公开执法污点，而在于公司正进入一个监管很重的市场，却没有展示出多少公开控制基础设施。官网现在更新了隐私和条款页面，这比没有法律披露面要好；但这些页面讲的是网站使用和个人数据处理，不是出口合规、产品安全治理、保修结构或买方级合同承诺。外部监管也是真实存在且仍在变化。2025
              年 1 月的 BIS AI 扩散框架，以及 2025 年 5 月撤销并转向指导的变化都说明，AI 相关硬件出口商即便在规则文本演进时，也背着现实合规负担。OFAC
              自有工具进一步强化了制裁筛查负担；贸易法评论也显示，即使硬件没有直接发往明显受限市场，客户所在地和控制权问题仍可能重要。Nexthop 对 SONiC 的依赖又叠加了一层法律问题。基金会治理、Apache 许可和
              Linux 衍生组件让开源尽调成为真实义务，尤其在公司分发修改后的软件镜像时更是如此。审阅来源中没有发现针对公司的 SEC、CFTC
              或联邦公开案卷行动，但这种缺席反映的是私营公司不透明和运营历史短，并不能证明合规面低风险。
