  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与判断框架
        blocks:
          - type: paragraph
            body: >-
              估值问题的重点不是 Nexthop 是否处在有吸引力的品类，而是 2026 年 3 月的价格是否已经贴现了过多成功。公开证据让机会变得可理解：公司有真实产品面，瞄准仍在重金投入 AI 网络的超大规模云厂商和
              NeoCloud，并以 $4.2B 的头条估值拿到蓝筹 Series B
              财团支持。这些都是有分量的正面因素。可是，它们不能解决核心投资判断问题。公司仍不披露当前收入、毛利率、客户数或留存指标，因此公开记录无法说明这一轮定价对应的是快速扩张的业务，还是仍高度集中的硬件项目。公开可比公司有助于划定纪律。Arista
              享有高溢价倍数，但前提是公开规模和可见毛利率。Cisco 和 HPE 说明，多元化基础设施很快会以较低收入倍数交易；Broadcom 和 NVIDIA 则说明，最丰厚的 AI
              基础设施溢价往往沉淀在上游。实际结论是跟踪而不是买入：保持接触，但在拿到更好的 KPI 证明或更好的下行结构之前，不要承接上一轮估值。
