      - number: '3.3'
        title: 切换成本、供应权力与替代路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本，不只是物理端口替换，更在于交换机周边的运营栈。已经运行 Juniper 加 Apstra、Cisco 加 NX-OS 或 Nexus Dashboard，或 NVIDIA 加
              InfiniBand 的买家，拥有既定工作流、遥测和支持模式，会形成惯性。开放侧也一样：超大规模云厂商越是在 SONiC、FBOSS 或基于 OCP-SAI
              的内部工具上投入，封闭运营模式就越缺乏吸引力。这正是内部自建路径成为真实替代方案的原因。Meta 的 DSF 披露展示了使用 FBOSS 和 OCP-SAI 的解耦开放 fabric，SONiC
              也把自己定位为可跨多个供应商和 ASIC 投产的系统。供应商杠杆是另一项结构性成本驱动。Broadcom 的交换产品组合，以及 Celestica 和 Edgecore 基于 Broadcom
              的设计说明，商用硅是开放以太网领域大部分版图下方的真实基底。这会降低任何单一新进入者的硬件独特性，并把尽调重心从裸交换机吞吐量转向供应分配、光学验证、软件硬化和账户专属支持。
