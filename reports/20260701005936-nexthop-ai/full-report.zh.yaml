      - number: '6.3'
        title: 持久性、重复使用与扩张
        blocks:
          - type: paragraph
            body: >-
              公开的持久性证据远弱于公开定位证据。Nexthop 没有披露客户数、NRR、GRR、logo
              留存、续约率、合同期限、流失、支持满意度，或任何重复订单队列视图。已抓取材料中唯一正面的重复使用代理指标是定性的：管理层和投资人都强调深度客户伙伴关系、长期客户工程互动，以及一套横跨定制硬件、偏好 NOS
              支持、光学资格验证和交钥匙 NeoCloud
              软件的产品组合。这个组合让先落地再扩张的故事具备合理性，因为客户一旦完成平台资格验证，前端、横向扩展和跨域扩展网络等相邻角色就可能扩大钱包份额。但合理性不是证明。没有公开续约或装机基础数据时，正确尽调姿态是把持久性字段留空，并把扩张视为建立在产品广度和互动深度上的假设，而不是经队列验证的事实。公开来源能给出的最好结论是：Nexthop
              的动作关系密集，如果赢下一个设计定点，可能具有粘性；但证据今天仍太稀疏，无法支撑对重复使用质量或满意度的判断。
