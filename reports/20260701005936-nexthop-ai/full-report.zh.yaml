      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              驱动因素是真实的。AI 集群正快速转向 800G 和 1.6T fabric；以太网在 AI 后端网络中份额上升；超大规模云厂商和 NeoCloud 继续投入大额预算；SONiC、UEC 等开放 NOS
              标准降低了解耦多供应商交换的概念门槛。这些条件能为 Nexthop 这样的公司创造真实的设计定点窗口，尤其是在客户需要定制系统、开放软件灵活性或交钥匙 NeoCloud 路径时。但约束对估值同样重要。在以
              NVIDIA 为中心的集群中，InfiniBand 仍有意义；最大运营商的内部自建路径仍然强；能源系统可能落后数据中心建设数年。Uptime 和 IEA 都把电力指向硬时点约束，McKinsey 则强调 800G
              和 1.6T 光学短缺会在预算获批后仍拖慢建设。Sequoia 对 AI 资本开支的怀疑提供最后一层提醒：市场可以继续很大，但如果利用率和终端用户变现不及预期，买家可能突然放缓订单。可投资结论是，Nexthop
              受益于强结构性市场，但其实际收入路径会被验证周期、供应准备度，以及买家是否更偏好其切入口而非内部或在位厂商替代方案所卡住。
