    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nexthop AI 把自己定义为一家位于 Santa Clara 的网络硬件和系统公司，专门服务 AI
              数据中心建设周期。公司在发布材料、产品页面和投资人帖子中一贯强调：为全球最大云厂商定制以太网交换系统，同时配合这些买家原本偏好的网络操作系统。这一定位很关键，因为 Nexthop
              并不是先卖通用企业交换机组合、再事后改造给 AI 用；它要争取的是硬件设计、光学验证、拥塞控制和操作系统集成都按超大规模云厂商要求定制的项目。到 2026 年 3 月，公开产品栈已包括三条交换机系列、对
              SONiC 和 FBOSS 的支持，以及面向 NeoCloud 买家的 Nexthop NOS
              支持版。公开网站也从基础发布页面扩展到支持、文档和软件发布入口。即便当前收入、当前客户数和当前员工数仍未披露，这仍是有用的运营信号。
