  - id: TV002
    title: 正方 / 反方投资逻辑表
    columns:
      - 框架
      - 支撑证据
      - 重要性
      - 什么会改变判断
    rows:
      - - 正方逻辑
        - AI 网络需求仍在超大规模云厂商和 NeoCloud 中扩张
        - 如果 Nexthop 能把设计定点转成量产规模，品类顺风还能支撑下一段增长
        - 需要证明需求正转化为 Nexthop 自身收入，而不只是行业热度
      - - 正向论点
        - Nexthop 有可信的产品和客户共创叙事
        - 产品已经有可见形态，降低了估值建立在纯概念上的概率
        - 需要披露已交付系统、收入和装机基础证据
      - - 反向论点
        - 公开收入、毛利率或留存数据都还不能验证当前估值
        - 没有运营 KPI，这一轮可能只是叙事溢价，而不是可承销的估值
        - 一套财务 KPI 包能很快补上大部分缺口
      - - 反向论点
        - 即使需求真实，客户集中度也可能很高
        - 一两个账户就能主导 AI 网络结果，并制造时间节奏上的剧烈波动
        - 需要客户数量、头部账户和续约数据
      - - 反向论点
        - 公开市场的溢价捕获可能更上游，落在芯片和平台层
        - Broadcom 和 NVIDIA 显示稀缺性经济会在哪里累积，系统厂商可能只剩下更低的结构性利润率
        - 需要证明 Nexthop 拿到的溢价不只是商用芯片组装
      - - 反向论点
        - AI 资本开支加速仍可能先带来估值倍数压缩，变现追不上
        - 如果板块降估，信息不透明的私募估值会很快重置
        - 需要证明 Nexthop 自身 KPI 跑赢宏观质疑
    notes: 成对列出最强正反论点，让建议同时反映品类上行空间和证据质量拖累。
