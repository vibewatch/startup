      - number: '6.2'
        title: 采用轨迹与证明质量
        blocks:
          - type: paragraph
            body: >-
              从 2025 年 3 月发布到 2026 年 3 月产品和融资公告，Nexthop
              的公开采用故事明显改善，但仍达不到传统具名客户名单标准。最强的类生产表述，是公司明确称新发布的平台和软件已经向领先超大规模云厂商发货。最强的协作信号，是披露 Disaggregated Spine
              由一家大型超大规模云厂商共同开发。最强的具名引用，是 Azure Networking 的 Dave Maltz 在发布引语中称赞 Nexthop 的开放网络工作和客户成功；Microsoft 自身简介则确认
              Maltz 负责 Azure Networking 工程和 SONiC 固件开发。这些信号有意义，因为它们暗示公司与严肃运营商存在真实互动；但它们并不等同于 Microsoft
              或任何其他超大规模云厂商公开声明自己是付费生产客户。因此，本章核心判断是：Nexthop
              已经越过纯概念门槛，进入可信客户互动和至少部分发货活动阶段；但公开证明仍集中在一位具名技术引用、一次未具名大型超大规模云厂商协作，以及一项泛化发货主张上。没有抓取到的来源提供由客户撰写的部署文章、采购记录、公开合同，或针对具名生产账户且结果丰富的案例研究。
