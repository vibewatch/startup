    rows:
      - - 收入质量
        - 当前收入、ARR、积压订单，以及出货到收入的桥接
        - 用来检验 $4.2B 估值是否建立在真实商业规模上
        - CFO 数据包 + 客户清单审阅
        - 展示与溢价硬件倍数匹配的收入基数和增长率
      - - 毛利率和支持经济性
        - 产品线毛利、保修计提、支持服务附着和服务负担
        - 决定 Nexthop 拿到软件式溢价，还是落入大宗硬件经济性
        - 财务 + 运营审阅
        - 扣除支持和库存成本后，证明溢价经济性可持续
      - - 客户广度
        - 客户数量、头部账户组合、生产与试点拆分，以及胜单转化
        - 区分可扩展业务和少数集中项目
        - 收入分析 + 客户访谈
        - 证明客户广度正走出极小旗舰客户集合
      - - 留存与扩张
        - 续约 cohort、扩张 ARR 和支持续约行为
        - 用来支撑可复制价值和后续估值支撑
        - 客户成功 + 财务审阅
        - 提供 cohort 证据，说明客户首部署后继续增长而不是流失
      - - 股权结构与条款
        - 清算优先权、参与权、反稀释棘轮，以及任何二级或赎回权
        - 名义轮次价格未必等于可转让入场价值
        - 律师主导的股权结构审阅
        - 确认下行情景结构没有明显差于名义估值暗示
      - - 退出准备度
        - 审计级 KPI 报告、董事会指标和披露包
        - 用来判断未来融资或退出能否扩大价格发现
        - 董事会材料 + IPO 准备度审阅
        - 展示能让跨市场或公开市场投资者信服的运营数据集
    notes: 这些问题按对承销质量影响的直接程度排序，而不是按管理层提供难度排序。
    claimRefs:
      - CV004
      - CV033
      - CV038
      - CV042
      - CV043
      - CV050
