      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开的领导层叙事几乎都围绕创始人兼 CEO Anshul Sadana 展开；公司、投资人和媒体资料都提到他曾任 Arista Networks
              COO。创始人与市场的匹配度确实存在：公司的产品定位、超大规模云厂商共同开发模式，以及投资人热情，都借力 Sadana 在云网络领域的声誉。但公开组织架构也显示，Nexthop
              并不只是一个人的故事。领导层页面列出硬件、软件、产品、客户工程、财务和供应链等职能高管；董事会和顾问层又通过 Ita Brennan、Sureel Choksi、Guru Chahal 和 Dave Maltz
              增加外部可信度。Ryan Torres 代表 Nexthop 加入 SONiC Governing
              Board，也进一步强化了治理可信度。尽调限制在于，私营公司披露有选择性：已审阅公开来源没有披露持股比例、完整董事会构成细节，也没有任何带日期的内部领导层变动记录。因此，外部证据支持公司具备职能深度，但仍指向围绕
              Sadana 的显著关键人集中。
