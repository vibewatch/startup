  - id: TU005
    title: 扩张和集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 重要性
      - 当前公开信号
      - 尽调路径
    rows:
      - - Hyperscaler 定制 JDM 设计导入
        - 少数账户可能主导收入和路线图优先级
        - 巨大 ACV 能加速规模化，但也会造成预算周期依赖
        - 公司材料强调最大运营方和定制动作；可比供应商显示极端集中
        - 索取前 5 大客户收入占比、按阶段拆分的管线，以及按账户拆分的设计导入集中度
      - - 交钥匙 NeoCloud 方案
        - 该细分在增长，但财务韧性弱于 Hyperscaler
        - 能扩大客户基数，但利用率冲击或融资压力会打击采购
        - Cisco 和 AFL 在描述 NeoCloud 增长的同时，也提到经济性收紧和供应商依赖
        - 按 NeoCloud 子类型、融资状态和已承诺容量拆分管线
      - - 开放 NOS / 偏好 NOS 支持
        - 定制工作量会拖慢客户认证、挤压利润率
        - 技术灵活性有助拿下客户，但可能抬高服务负担
        - 发布材料和投资人都强调可兼容买方自选的 SONiC / FBOSS
        - 给出定制项目与交钥匙项目的毛利率和工程投入拆分
      - - 平台覆盖前端、scale-out 和 scale-across 场景
        - 交叉销售逻辑可能成立，但公开证据还撑不住
        - 若能证明，首个产品通过认证后，单个客户的钱包份额可能明显上升
        - 产品宽度看得见，复购证据看不见
        - 按客户给出分组数据：首个 SKU、第二个 SKU，以及光模块 / 支持服务的挂载情况
      - - 高触达直销打法
        - 采购周期长、折扣让利可能推迟收入确认
        - 少数项目延期就可能扭曲增长和现金需求
        - Lightspeed 和 Arista 都提到认证与验收周期漫长且复杂
        - 按细分市场给出设计赢单转化率、平均周期和折扣区间
    notes: 聚焦 Nexthop 客户模型的战略取舍：潜在客户体量很大，但数量少， 认证周期也长。
