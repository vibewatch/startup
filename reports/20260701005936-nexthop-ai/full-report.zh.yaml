      - number: '5.4'
        title: 信任控制、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              已审阅的信任材料在硬件层最强，在企业软件层最弱。公开数据表显示三款可见交换平台均有 TPM 2.0；NH-5010 明确记录其高速端口支持线速 802.1AE MACsec；安全或合规指南加数据表发布了
              Class A 和地区监管通知。支持中心还宣传安全公告和生命周期通知，这好过完全没有公开质量信号。但这些正面信息加在一起，也不构成完整安全姿态。2026 年 4
              月隐私政策是网站数据处理通知，不是产品安全认证。已审阅来源没有提供公开 SOC 2 或 ISO 27001 范围声明、安全启动或证明链叙事、SBOM、CVE
              或事故台账，也没有具名制造和供应链披露。最有意思的基准和发布工件甚至也被登录门槛挡住。因此，正确尽调姿态是：凡有直接文档支撑的具体硬件和工作流主张可以接受；但对未被支持的功耗、部署和架构经济性断言，在管理层提供私下证据前应打折。Nexthop
              最大的产品风险，不在于交换机是否存在，而在于随着产品组合扩张，公司能否维持发布质量、供应商韧性和企业信任。
