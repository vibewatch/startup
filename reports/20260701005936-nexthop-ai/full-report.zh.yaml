      - number: '7.3'
        title: 商业、财务与客户风险
        blocks:
          - type: paragraph
            body: >-
              Nexthop 仍是一家年轻私营公司，面向极少数巨型账户销售，却已经背着 $4.2B 估值，因此商业下行风险异常集中。公开需求信号是支持性的：超大规模云厂商 AI 资本开支仍然庞大，Nexthop
              的发布也明确瞄准真正大规模花钱的买方。但这不会抵消集中度风险，反而会放大它。Arista 的 10-K 说明，即使是一家规模更大、更多元的网络公司，也可能有 35%
              收入来自两个超大规模云客户，并承受漫长的认证和验收周期。Nexthop 披露的公开分母数据比 Arista
              更少。公司不披露客户数、头部账户占比、留存指标或收入；最强证明仍来自出货表述、技术引用和目标账户框架，而不是广泛的具名生产客户名单。这个证明缺口很重要，因为当前私募估值已经假设了相当程度的执行成功。Sequoia
              对 AI 支出的批评，以及更广泛的电力或部署瓶颈都说明，如果终端需求落后于资本开支建设，行业热情可以很快变成更艰难的采购节奏或融资账。简言之，品类可以继续有吸引力，但 Nexthop
              自身回报曲线仍会被一个账户滑期、一个站点延迟或一轮更苛刻融资击中。
