      - number: '5.3'
        title: 部署、支持与成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Nexthop 做的不只是发布产品文案。硬件文档页面展示了 4000 和 5000 家族的快速入门与安全指南；快速入门覆盖 FRU 安装、导轨套件、管理和控制台连接；支持中心则宣传电话、邮件、门户和基于 API
              的工单处理，并配套下一工作日更换和软件生命周期支持。这些都是有意义的成熟度信号，因为它们暗示真实售后运营，而不是纯原型营销。发布图景则更混合。Nexthop 的页面站点地图显示，软件发布和硬件文档页面一直更新到
              2026 年 6 月下旬；下载站点地图显示，XGS 和 DNX 构建中有多个 2026
              年软件镜像和发布说明工件。这说明持续维护工作存在，也至少有部分针对硅的分支。不过，最与尽调相关的工件不能公开检查：已审阅页面中的直接基准报告和发布说明链接返回需要登录的错误页，公开软件发布页本身也很薄。成熟度结论因此是：“已经发货、运营真实，但仍有选择性不透明。”
