      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              可支持投资判断的结论很窄，但清楚。公开证据支持这样一个事实：Nexthop 可能拥有一套面向超大规模云厂商和 NeoCloud 买家的硬件加软件加支持收入引擎；也支持 Nexthop
              作为年轻私营厂商，融资充裕程度异常高。公开证据不支持判断当前收入质量、当前销售效率、当前毛利率或实际现金消耗速度。反向背景强化了谨慎，而不是推翻机会。Sequoia 对 $600 billion AI
              基础设施的批评，以及 Flexential 2026 年调查，都认为 AI 基础设施需求真实但经济性嘈杂，ROI
              审查、网络瓶颈和采购延迟仍在发挥作用。与此同时，在位厂商正足够快地扩展开放以太网产品，使定价压力持续存在。因此，正确结论不是“资金不足”，而是“尚不足以支撑投资判断”。若要从战略逻辑走向投资级财务视图，尽调需要当前收入、按
              SKU 或项目类型拆分的实际定价、支持附加率、按产品家族拆分的毛利率、库存和应收账款水平、按职能拆分的当前员工数，以及当前现金和烧钱速度桥。
