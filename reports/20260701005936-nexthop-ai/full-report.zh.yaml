        title: 市场进入动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              现有市场进入证据指向典型的高接触基础设施销售动作，而不是可扩展的自助服务或宽渠道模式。Nexthop 的语言面向超大规模云厂商、NeoCloud
              和大型运营商，这通常意味着账户少、评估周期长、合同价值大，并且售前工程投入重。已审阅官方页面没有展示公开定价、在线配置与下单路径，也没有公开的合作伙伴融资名单。相反，它们展示的是支持门户、联系人驱动的互动和硬件文档，更贴合企业采购，而不是网页转化。这对销售效率很重要，因为获客成本（CAC）、回本周期和新客户速度随之由账户级设计定点和资格验证成功决定，而不是需求生成量。公开可比公司也强化了这项负担。Cisco
              将 AI 参考架构与 NVIDIA 和全球合作伙伴生态一起营销，HPE 和 Juniper 现在则带来数十亿美元级网络收入和成熟现场覆盖。Nexthop 仍可能靠定制和开放 NOS
              灵活性取胜，但公开证据指向一种劳动密集型销售动作，效率指标为私有且未披露。
