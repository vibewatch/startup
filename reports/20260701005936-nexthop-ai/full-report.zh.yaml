      - number: '4.3'
        title: 成本结构、利润率驱动与营运资本
        blocks:
          - type: paragraph
            body: >-
              公开证据在成本驱动上远强于实际经济性。Nexthop
              三份数据表和支持中心显示，公司承担着不小的硬件和服务复杂度：多千瓦功耗包络、更换物流、软件生命周期支持和企业级工单管理。成熟可比公司解释了这件事为何重要。Arista 的 10-K
              表明，产品成本涉及合同制造商、商用硅供应商、货运、库存管理和供应链运营；它也展示了客户试用、验收期和支持合同如何同时推高库存和递延收入。对 Nexthop
              这样的创业公司来说，这些并不是抽象会计问题。McKinsey 的光学供应研究显示，800G 和 1.6T
              组件会在多年内持续供给受限，这提高了提前采购、安全库存和资格验证库存的概率。供应商权力是另一项毛利率约束。Broadcom 和 NVIDIA 显示，AI 时代的价值捕获可以在半导体层非常靠上游；HPE 和
              Arista 的公开业绩则显示，系统厂商能赚到更健康、但明显更低的经济性。净含义是，Nexthop 最终毛利率对谈判能力、支持附加率和库存纪律的依赖，至少不低于对技术差异化的依赖。
