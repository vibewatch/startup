      - number: '7.2'
        title: 运营、安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Nexthop 已经真实到值得认真对待，但透明度还不足以排除执行风险。支持中心、硬件文档页、安全指南和 2026
              年站点地图活动都显示，公司已不只是概念稿。同时，最高价值的尽调材料仍然稀薄或被门控。公开发布页面没有呈现丰富的安全或变更历史，审阅到的公司页面也没有暴露漏洞披露计划、SBOM 或第三方保证范围；公开文档集对
              4000 和 5000 系统明显更完整，对新发布的 4200 系列则薄得多。依赖栈同样关键。Broadcom 的 Tomahawk 5 和 6 路线图支撑了可见性能边界，SONiC、ONIE
              和外部光模块认证也都不在 Nexthop 单方控制之内。这种架构对超大规模云厂商买方有商业合理性，因为它保留了开放 NOS 的可迁移性；但它也意味着 Nexthop 的差异化要靠执行、验证和支持质量，而不是专有
              ASIC 或封闭操作系统。最后，客户现场准备度也是运营依赖：电力、光纤和关税摩擦都可能拖慢部署，即便产品和设计中标在技术上已经就绪。
