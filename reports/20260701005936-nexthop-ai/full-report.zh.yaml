      - number: '8.4'
        title: 退出准备度、否决触发项与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度结论很直接：Nexthop 可能正在走向一个大结果，但按 IPO 式标准，目前还无法用公开信息承销。战略逻辑存在，因为 HPE 收购 Juniper 显示，规模化网络资产对既有厂商很重要；AI
              网络栈对上市厂商和私募投资人也仍是优先市场。即便如此，最终退出倍数仍取决于今天缺失的证据。最可执行的应对，是现在就定义投资论点破裂触发项和尽调要求，而不是等下一次融资后再做。如果下一轮融资低于 2026
              年估值且没有相应 KPI
              跃升补偿，如果客户集中度仍极端，如果扣除支持和库存成本后利润率质量平庸，或管理层拿不出退出级指标，投资论点就应从“好公司但价格拉伸”切换为“故事跑在证明前面”。这也是最终尽调要求表聚焦收入、利润率、客户结构、留存、支持负担和融资条款的原因。这些不是可有可无的细节；它们决定当前估值只是暂时的证明缺口，还是结构性高估风险。
