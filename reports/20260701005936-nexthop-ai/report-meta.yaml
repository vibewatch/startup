  topStrengths:
    - Credible product surface across 4000, 4200, and 5000 switch families with open-NOS options and visible support operations.
    - Strong category tailwinds from expanding Ethernet AI-network demand across hyperscalers and NeoClouds.
    - High-quality investor syndicate and large disclosed capital base give the company time to scale product and support capabilities.
  topRisks:
    - No public revenue, ARR, gross margin, retention, or current customer-count disclosure supports the March 2026 valuation.
    - Likely concentration in a few hyperscaler or NeoCloud accounts can create timing, pricing, and acceptance-cycle volatility.
    - Merchant-silicon, optics, and open-NOS dependencies limit moat durability and raise supply-chain and execution risk.
    - The $4.2 billion mark already prices in significant execution success before public KPI proof is available.
  unresolvedGaps:
    - Current revenue, ARR, and gross-margin bridge by product family and support attach.
    - Named customer roster, shipment volumes, production-versus-pilot split, and top-account concentration.
    - Current headcount, burn, cash balance, inventory obligations, and support-capacity metrics.
    - Full preferred-equity stack, side-letter terms, and whether the next financing clears above or below the 2026 mark.
