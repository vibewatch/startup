companyProfile:
  summary: Nexthop AI is a Santa Clara-based, founder-led private Series B company building open-Ethernet switching systems for hyperscaler and NeoCloud AI data centers. Its public offer combines customer-specific hardware, customer-choice NOS support, validated interconnects, and a supported SONiC-based Nexthop NOS, positioning the company as a co-development networking supplier rather than a closed appliance vendor. Public disclosures confirm rapid capital formation from a $110 million launch round in March 2025 to a $500 million Series B at a $4.2 billion valuation in March 2026, while leaving current operating metrics largely opaque.
  founders:
    - name: Anshul Sadana
      role: Founder & CEO
      background: Former Arista COO with hyperscale networking operating experience.
      claimRefs: [CO005, CO006]
  foundingLocation: null
  headquarters: Santa Clara, California
  productSummary: Nexthop sells AI data-center switching platforms across its 4000, 4200, and 5000 families, plus open-NOS deployment options including SONiC, FBOSS, BYoNOS/BYoSAI, validated optics and interconnects, and support operations.
  customerFocus: Hyperscalers and NeoCloud operators deploying AI data-center fabrics.
  businessModel: Hardware-plus-software-plus-support sales centered on custom JDM programs for hyperscalers and more turnkey SONiC-powered offers for NeoClouds.
  stage: Private Series B (unicorn-valued)
  fundingStatus: $610 million total disclosed funding, including a $500 million Series B at a $4.2 billion valuation in March 2026.
