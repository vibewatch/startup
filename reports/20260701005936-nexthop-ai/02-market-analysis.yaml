- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - AI cluster scale and 800G/1.6T migration
    - Driver
    - Current to 2030
    - Pushes switch refresh, radix growth, and more demanding topology choices
    - Verify Nexthop product readiness, software maturity, and deployment references at 800G and 1.6T
  - - Ethernet share gains in AI back-end networks
    - Driver
    - 2025 onward
    - Expands the portion of AI networking where an Ethernet specialist can compete
    - Test how much of the Ethernet share shift is open to non-NVIDIA or non-incumbent vendors
  - - Open NOS and vendor-diversification demand
    - Driver
    - Current
    - Creates room for SONiC or FBOSS-compatible disaggregated systems
    - Ask whether target accounts insist on open NOS, internal control, or software optionality
  - - NeoCloud expansion and financed AI factories
    - Driver
    - Current to 2028
    - Adds buyers beyond the largest hyperscalers and can accelerate turnkey demand
    - Map which NeoClouds buy direct switching versus bundled platforms
  - - Incumbent and internal-build substitutes
    - Constraint
    - Current
    - Shrinks the vendor-addressable wedge even when the market grows
    - Benchmark against Arista, Cisco, NVIDIA ecosystems, and internal OCP or FBOSS paths
  - - Qualification cycles and support burden
    - Constraint
    - Current
    - Turns a large theoretical market into a much smaller served market
    - Request pilot-to-production timelines, support staffing ratios, and failure-remediation obligations
  - - Power availability and grid lead times
    - Constraint
    - 2026-2030
    - Can delay cluster deployment even after budgets are approved
    - Tie pipeline assumptions to power-ready sites and customer interconnection status
  - - Optics and component bottlenecks
    - Constraint
    - 2026-2029
    - Can slow 800G and 1.6T deployments and stretch topology plans
    - Inspect supplier allocations, optical strategy, and fallback design assumptions
  - - AI ROI skepticism and customer concentration
    - Constraint
    - Current
    - Can trigger abrupt pauses if utilization, monetization, or top-account spending weakens
    - Stress-test revenue concentration and require proof of production utilization and renewal behavior
  notes: 'The same factor can be both a driver and a brake: AI urgency creates demand for better fabrics, but power, optics, and ROI constraints determine when that demand converts into shipped systems.'
