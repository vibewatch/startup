  evidenceGaps:
  - type: missing-source
    severity: material
    topic: qualification-cycles
    missingEvidence: Public data on hyperscaler or NeoCloud switch qualification timelines, pilot lengths, and acceptance criteria for a new AI Ethernet vendor.
    whyItMatters: Qualification latency is one of the biggest reasons SOM can be much smaller than SAM even when the technical wedge is real.
    diligencePath: Request customer references, pilot-to-production timelines, and current design-win funnel stages from management and reference accounts.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM003
    - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Per-port pricing, gross-margin ranges, support attach rates, and contract structure for custom versus turnkey AI switching programs.
    whyItMatters: Without price and margin visibility, public TAM rows cannot be translated into investable revenue or contribution economics.
    diligencePath: Request current pricing sheets, sample MSAs/SOWs, and blended gross-margin walk-throughs by product family and buyer segment.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: material
    topic: captive-internal-share
    missingEvidence: A quantified split between merchant-vendor purchases, captive internal platforms, and InfiniBand-led deployments inside AI back-end networks.
    whyItMatters: Internal-build and incumbent lock-in are the main reasons a broad Ethernet market can still produce a narrow serviceable slice for Nexthop.
    diligencePath: Triangulate customer-by-customer deployment maps using OCP disclosures, supply-chain checks, and management’s active-account pipeline.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM001
    - TM002
  - type: private-evidence-only
    severity: material
    topic: som-precision
    missingEvidence: Named production customers, shipped port volumes, current backlog, and support-capacity constraints that would anchor a bottom-up SOM.
    whyItMatters: The public record supports only a rough range; valuation work will need a bottom-up view of actual deployments rather than headline market narratives.
    diligencePath: Request shipped-system counts, top-customer revenue mix, backlog conversion assumptions, and support headcount by account tier.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
