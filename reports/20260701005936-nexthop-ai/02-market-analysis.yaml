callouts:
- calloutType: insight
  title: The real wedge is the open or custom slice of AI Ethernet switching
  body: Nexthop does not need the whole AI networking market to be attractive. It needs the subset of hyperscaler and NeoCloud programs where buyers want Ethernet fabrics, value open NOS flexibility, and are willing to qualify something other than an incumbent or an internal design.
  claimRefs:
  - CM003
  - CM004
  - CM020
  - CM021
  - CM053
- calloutType: risk
  title: Market growth does not remove deployment bottlenecks
  body: Power constraints, optical shortages, and AI monetization doubts can all delay orders even in a structurally expanding market. That makes timing, concentration, and supply readiness as important as the headline TAM.
  claimRefs:
  - CM047
  - CM049
  - CM050
  - CM051
  - CM052
  - CM054
