  title: Market Definition Table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Primary Buyer / Payer
  - Nexthop Relevance
  rows:
  - - Broad AI data-center networking
    - AI back-end switches, front-end fabrics, InfiniBand, Ethernet, and related optics for AI clusters
    - GPUs, servers, power generation, buildings, and colocation leases
    - Hyperscaler and NeoCloud infrastructure capex owners
    - Useful outer TAM lens only
  - - AI back-end Ethernet switching
    - Scale-out and scale-across Ethernet switches, NOS integration, telemetry, and Ethernet fabric validation
    - InfiniBand fabrics, NVLink or UALink scale-up, and optics-only revenue
    - Network architecture plus AI infrastructure teams
    - Closest public switching lens
  - - Open-NOS / custom Ethernet switching
    - SONiC or FBOSS-capable fixed systems, JDM-like customization, and platform validation
    - Fully captive internal platforms and proprietary chassis software assumptions
    - Hyperscaler network platform teams
    - Core Nexthop SAM
  - - NeoCloud turnkey Ethernet fabrics
    - Turnkey systems, hardened NOS, deployment support, and rapid-cluster bring-up
    - Bare GPU rental economics and generic cloud-compute spend
    - CTO, platform lead, and project-finance sponsor
    - Important serviceable buyer segment
  - - Incumbent AI Ethernet systems
    - Arista, Cisco, NVIDIA-ecosystem, and other incumbent Ethernet switching options
    - Generic enterprise campus switching
    - Central networking or infrastructure buyer
    - Primary status-quo substitute
  - - Internal build / open hardware
    - OCP-style designs, FBOSS, SONiC, white-box, and direct ODM or JDM flows
    - Commercial vendor support attach and branded platform margins
    - Hyperscaler engineering and procurement
    - Strong substitute that limits SOM
  notes: The boundary intentionally narrows from all AI networking to the open or custom Ethernet switching slice where Nexthop’s public products and go-to-market claims are actually relevant.
