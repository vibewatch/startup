chapter:
  number: 2
  title: Market Analysis
  summary: Nexthop AI sells into a layered market that spans broad AI data-center networking, a narrower AI back-end Ethernet switch opportunity, and an even narrower open-NOS or custom-switch wedge concentrated among hyperscalers and NeoClouds. Public sources agree demand is growing fast—650 Group put broad AI networking near $20B in 2025 and Dell’Oro said Ethernet AI back-end switches could drive nearly $80B over five years—but the company’s true serviceable market is smaller because internal builds, incumbent alternatives, power availability, optics shortages, and ROI skepticism all constrain adoption.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Substitutes
  body: The cleanest way to define Nexthop AI’s market is not as all switching and not even as all AI infrastructure. Nexthop’s public product and launch materials put it in the slice of AI data-center networking where buyers want Ethernet switching systems for scale-out, scale-across, and front-end fabrics, often with open NOS flexibility and some degree of customization. That boundary matters because the broad AI networking numbers in circulation often bundle Ethernet switches, InfiniBand fabrics, and optics, while some bullish narratives blur further into a wider AI-cloud infrastructure story. Status-quo substitutes are also strong. Buyers can keep buying incumbent Ethernet systems from Arista, Cisco, NVIDIA-ecosystem vendors, and Broadcom-based platforms, or they can pursue internal builds through OCP-style hardware, FBOSS, SONiC, and white-box or JDM flows. In other words, Nexthop’s real market is the intersection of AI-cluster Ethernet demand, open or disaggregated operations preferences,
    and a buyer willingness to qualify a new vendor rather than default to incumbent or internal paths.
