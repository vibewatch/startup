  evidenceGaps:
  - type: missing-source
    severity: material
    topic: export-classification
    missingEvidence: Product-by-product ECCN classifications, counsel memos, denied-party screening workflow, and any internal export-compliance controls for hyperscaler and NeoCloud deals.
    whyItMatters: The public record proves the regime is live but does not show whether Nexthop has operationalized it, so a preventable compliance error could stop shipments or create customer friction.
    diligencePath: Request export-control classifications, screening SOPs, and sample order-approval records from counsel or operations leadership.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR004
    - QR028
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: open-source-compliance
    missingEvidence: SBOMs, kernel and SAI modification policy, Apache and GPL notice handling, and any published source-availability commitments for distributed software images.
    whyItMatters: Open-source license and security obligations can become legal, customer, and incident-response liabilities if distribution practice is sloppy.
    diligencePath: Request SBOMs, OSS review memos, license-scanning outputs, and source-release procedures for every shipping software image.
    relatedQuestionRefs:
    - QR007
    - QR011
    - QR028
    relatedTableRefs:
    - TR001
    - TR003
  - type: access-blocked
    severity: material
    topic: release-transparency
    missingEvidence: Open access to detailed release notes, benchmark methodology, public CVE or advisory history, and evidence of support-response quality by product family.
    whyItMatters: The public surface shows activity but not enough transparency to underwrite software quality, patch discipline, or operational resilience at hyperscaler scale.
    diligencePath: Request private portal access, historical release notes, benchmark methods, customer support metrics, and security-incident history.
    relatedQuestionRefs:
    - QR010
    - QR012
    - QR025
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named production customers, top-account share, customer-count trend, retention metrics, renewal history, and pipeline conversion by hyperscaler vs NeoCloud cohort.
    whyItMatters: Customer concentration is one of the largest residual risks, and public sources do not provide the basic denominators needed to size downside.
    diligencePath: Request cohort tables, top-10 customer exposure, design-win status, retention KPIs, and account-level deployment timing.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
    - QR028
    relatedTableRefs:
    - TR004
    - TR005
  - type: missing-source
    severity: minor
    topic: doc-completeness
    missingEvidence: Equivalent public quick-start, safety, or install surfaces for the launched 4200 family plus a clean mapping from launch claims to maintained operational docs.
    whyItMatters: Documentation gaps are not thesis-breaking alone, but they weaken the credibility of mature operations claims for a fast-scaling hardware vendor.
    diligencePath: Request current 4200 install, safety, and support artifacts and verify they match what customers receive post-sale.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
