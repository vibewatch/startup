- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export / sanctions compliance
    - Regulatory tightening or failed screening
    - New BIS rule materially narrows allowable counterparties, or any shipment is delayed for compliance reasons
    - Pause underwriting until controls, classifications, and impacted pipeline are reviewed
  - - Merchant-silicon dependence
    - Upstream supply or roadmap disruption
    - Broadcom allocation issue, roadmap slip, or missing feature for announced platform generation
    - Haircut delivery timeline and gross-margin assumptions
  - - Customer concentration and proof
    - Named production proof fails to broaden
    - No expansion beyond sparse named proof, or one account dominates qualified revenue pipeline
    - Reduce conviction and require top-account exposure data before sizing position
  - - Security and release transparency
    - Trust surface fails to mature
    - No SBOM, VDP, incident history, or detailed release evidence emerges during diligence
    - Treat enterprise go-to-market risk as structurally high and lower value multiple
  - - Power and site-readiness friction
    - Customer programs slip for external infrastructure reasons
    - Major design wins are delayed because power, fiber, or tariff issues defer deployment windows
    - Push out revenue timing and re-test financing needs
  - - Valuation discipline
    - Financing or market terms worsen from 2026 baseline
    - Next financing implies flat or down economics relative to the $4.2B mark without matching proof gains
    - Re-underwrite return math and ownership strategy
  - - Execution scaling
    - Support and release load outpaces org capacity
    - Escalation backlog, support churn, or repeated release quality misses emerge in private diligence
    - Require hiring plan, support metrics, and release-governance remediation before proceeding
  notes: Kill criteria are intentionally monitorable so they can be revisited in board reporting and refresh work, not just during initial diligence.
