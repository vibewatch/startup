- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation range
  - Return vs $4.2B mark
  - Probability signal
  - Key downside / trigger
  rows:
  - - Bull
    - Revenue proof, broader customer base, and premium AI-networking multiples all improve together
    - $6.0B-$8.5B
    - Meaningful upside from current mark
    - Possible, but requires evidence not yet public
    - Fails if breadth or margin proof does not emerge
  - - Base
    - Demand remains healthy but proof gaps persist and no cap-structure surprise appears
    - $3.0B-$4.5B
    - Roughly flat to modest downside/upside
    - Most consistent with today's public evidence
    - Stalls if the company cannot close KPI gaps before the next round
  - - Bear
    - Capex digestion, delayed deployments, or financing reset compress the story
    - $1.5B-$2.5B
    - Clear down-round territory
    - Cannot be dismissed given opacity and macro skepticism
    - Triggered by one-account weakness, weak margins, or harder financing terms
  notes: Ranges are analyst estimates based on public evidence only and are not preference-stack adjusted; they show scenario direction more than precise price targets.
