- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Threshold for comfort
  rows:
  - - Revenue quality
    - Current revenue, ARR, backlog, and shipment-to-revenue bridge
    - Needed to test whether the $4.2B mark sits on real commercial scale
    - CFO packet plus customer schedule review
    - Show a revenue base and growth rate consistent with a premium hardware multiple
  - - Gross margin and support economics
    - Product-family margin, warranty accruals, support attach, and service burden
    - Determines whether Nexthop earns software-like premium or commodity hardware economics
    - Finance + operations review
    - Demonstrate durable premium economics after support and inventory costs
  - - Customer breadth
    - Customer count, top-account mix, production vs pilot split, and win conversion
    - Separates a scalable franchise from a few concentrated programs
    - Revenue analytics plus customer references
    - Show expanding breadth beyond a tiny flagship set
  - - Retention and expansion
    - Renewal cohorts, expansion ARR, and support-renewal behavior
    - Needed to justify repeatable value and follow-on valuation support
    - Customer success and finance review
    - Provide cohort evidence that accounts grow rather than churn after first deployment
  - - Cap table and terms
    - Liquidation preference, participation, ratchets, and any secondary or redemption rights
    - The headline round price may not equal transferable entry value
    - Counsel-led cap-table review
    - Confirm downside structure is not materially worse than the headline valuation suggests
  - - Exit readiness
    - Audit-grade KPI reporting, board metrics, and disclosure package
    - Needed to know whether future financing or exit can broaden price discovery
    - Board materials and IPO-readiness review
    - Show an operating dataset credible to crossover or public investors
  notes: These asks are ordered by what most directly changes underwriting quality rather than by what is easiest for management to provide.
