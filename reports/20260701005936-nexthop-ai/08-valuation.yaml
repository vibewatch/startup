- id: exit-readiness-kill-triggers-and-final-asks
  title: Exit readiness, kill triggers, and final asks
  body: 'The exit-readiness verdict is straightforward: Nexthop may be building toward a large outcome, but it is not yet publicly underwriteable on an IPO-style standard. Strategic logic exists because scaled networking assets matter to incumbents, as HPE’s Juniper transaction shows, and because the AI-networking stack remains a priority market for both public vendors and private investors. Even so, an eventual exit multiple will depend on evidence that is still missing today. The most actionable response is to define thesis-break triggers and diligence asks now rather than after another financing event. If the next financing happens below the 2026 mark without a compensating KPI step-up, if customer concentration remains extreme, if margin quality proves mediocre after support and inventory costs, or if management cannot produce exit-grade metrics, the thesis should shift from “strong company at a stretched price” to “story outran proof.” That is why the final diligence ask table focuses
    on revenue, margins, customer mix, retention, support burden, and financing terms. Those are not nice-to-have details; they are the evidence that decides whether the current valuation is a temporary proof gap or a structural overpricing risk.'
