  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, bookings, and backlog bridge by quarter and by customer cohort.
    whyItMatters: The round valuation cannot be underwritten or compared to public multiples without a current commercial scale baseline.
    diligencePath: Request a finance-room KPI packet plus signed customer schedule and shipment-to-revenue reconciliation.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: material
    topic: margin-disclosure
    missingEvidence: Current gross margin, warranty accrual, support attach, and BOM mix by product family.
    whyItMatters: Premium AI-networking valuations only hold if hardware economics and support obligations are materially better than commodity switching.
    diligencePath: Review product-family P&L, support contract terms, and inventory reserve policy with finance and operations leadership.
    relatedQuestionRefs:
    - QV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-retention
    missingEvidence: Active customer count, top-account mix, renewal cohorts, expansion rates, and design-win conversion by segment.
    whyItMatters: Without customer breadth and retention, the current mark may be resting on one or two hyperscaler programs rather than a scalable franchise.
    diligencePath: Request customer cohort tables, churn and expansion analyses, and at least two reference calls outside the founding design partners.
    relatedQuestionRefs:
    - QV010
  - type: private-evidence-only
    severity: blocking
    topic: series-b-terms
    missingEvidence: Liquidation preference, participation, ratchet, pay-to-play, pro rata, and any secondary or redemption features in the Series B stack.
    whyItMatters: Entry discipline depends on downside structure, dilution overhang, and how much of the headline valuation is transferable to a new investor.
    diligencePath: Review executed financing documents and cap table waterfall with counsel and the company CFO.
    relatedQuestionRefs:
    - QV011
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Direct disclosed valuations for the closest private AI-networking hardware peers and cleaner enterprise-value adjustments for public comps.
    whyItMatters: The comparable table is directionally useful, but private-market opacity and mix differences limit precise fair-value claims.
    diligencePath: Extend the comp set with bank books, private-market term sheets, and management commentary on the most comparable recent rounds.
    relatedQuestionRefs:
    - QV019
    - QV020
    - QV025
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Audited KPI package, board reporting cadence, and disclosure-quality operating metrics suitable for public or crossover investors.
    whyItMatters: Even if the business is strong, absent exit-grade disclosure the next mark can still depend more on insider conviction than on broad price discovery.
    diligencePath: Request board materials, audit readiness workstreams, and the company's planned disclosure package for future fundraising or IPO prep.
    relatedQuestionRefs:
    - QV027
