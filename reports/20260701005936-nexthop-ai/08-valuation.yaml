tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Evidence anchor
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Real market + real product + strong syndicate, but no public revenue or margin proof
    - Do not treat the March 2026 mark as a default buy
  - - Confidence
    - Medium
    - Directional market and product evidence are solid; underwriting data are thin
    - Stay engaged, but reserve conviction for private KPI diligence
  - - Risk rating
    - High
    - Customer concentration, capex-cycle compression, and hardware economics remain under-disclosed
    - Require downside protection or a lower entry
  - - Valuation stance
    - Stretched
    - Public comps and adverse capex work do not yet validate $4.2B on disclosed fundamentals
    - Underwrite with discount discipline, not momentum
  - - Hold / exit lens
    - Milestone-driven
    - A future up-round or strategic exit needs revenue, breadth, and margin proof
    - Use milestones instead of narrative drift to justify follow-ons
  - - Immediate action
    - Monitor, diligence, and price selectively
    - The opportunity is not broken; the proof set is incomplete
    - Track rather than chase
  notes: Uses public evidence only; recommendation is intentionally price-sensitive because current revenue, margins, and cap-table terms are undisclosed.
