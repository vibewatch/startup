- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type / status
  - Valuation or latest P/S snapshot
  - Why relevant
  - Key limitation
  rows:
  - - Arista Networks
    - Public Ethernet AI-networking vendor
    - ~$213.9B market cap; ~16.45x-18.56x recent P/S
    - Closest public Ethernet fabric comp with real AI-networking exposure
    - Much larger, profitable, and fully disclosed; not a startup hardware risk profile
  - - Cisco
    - Public diversified networking platform
    - ~$463.0B market cap; ~5.11x latest public P/S snapshot
    - Shows the lower-multiple outcome once the story looks like diversified infrastructure
    - Software, security, and services mix make it less comparable to a young hardware vendor
  - - HPE
    - Public hybrid-cloud and networking vendor
    - ~$59.7B market cap; ~0.86x latest public P/S snapshot
    - Illustrates how traditional infrastructure names can trade at low revenue multiples
    - Networking is only one part of a broader enterprise portfolio
  - - Broadcom
    - Public AI and networking silicon platform
    - ~$1.797T market cap; ~22.92x latest public P/S snapshot
    - Shows where premium AI multiples live when scarcity sits in silicon
    - Not a systems-vendor comp and economics are structurally richer
  - - NVIDIA
    - Public compute and AI networking platform
    - ~$4.84T market cap; ~20.77x latest public P/S snapshot
    - Shows how a full-stack AI platform can sustain extreme market-value support
    - Far broader than networking and not a clean hardware-switch reference
  - - Groq
    - Private AI-infrastructure round
    - 2025 round at $6.9B post-money
    - Useful private-market reference for how infrastructure narratives can price when usage proof is stronger
    - Inference-compute company, not a direct networking-hardware peer
  notes: Uses market-cap and latest available public P/S snapshots rather than harmonized EV/NTM multiples; the table is a directional anchor, not a precise valuation model.
  enumerationScope:
    coverage: partial
    basis: Rows cover the closest fetched public and private AI-infrastructure references available by 2026-07-01, but not every undisclosed private networking round or enterprise-value adjustment.
