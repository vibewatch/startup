- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No revenue proof
    - Next financing still lacks a credible revenue and bookings bridge
    - Current valuation remains narrative-led rather than evidence-led
    - Do not add capital at or above the prior mark
  - - Extreme customer concentration
    - One or two accounts dominate economics without broadening evidence
    - The company may be a program supplier, not a scalable franchise
    - Apply a concentration discount or stop
  - - Weak hardware economics
    - Gross margin and support burden fail to show premium economics
    - The system layer may not deserve a high-growth AI multiple
    - Reset fair value lower or avoid
  - - Macro multiple compression
    - AI infrastructure comps de-rate materially while Nexthop proof stays thin
    - The last round loses public anchor support quickly
    - Treat the story as stretched until repriced
  - - Harder financing terms
    - A flat or down round arrives with onerous preferences or punitive protections
    - The headline 2026 mark was ahead of proof
    - Assume transfer value to new money is lower than the headline price
  notes: Triggers are diligence thresholds rather than public facts; they are designed to make a private-company story monitorable between rounds.
