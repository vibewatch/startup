  title: Recommendation logic
  type: flow
  layout: standard
  summary: The recommendation stays at track because real market and product signals are offset by valuation premium, KPI opacity, and macro compression risk.
  approximationNotes: This flow is qualitative rather than probabilistic and maps the decision chain implied by retained public evidence as of 2026-07-01.
  data:
    nodes:
    - id: market
      label: 'Demand: AI networking still expanding'
      detail: 650 Group, IDC, Dell’Oro, Cisco, and HPE all support ongoing AI-network investment
      type: input
    - id: proof
      label: 'Proof: product surface + strong syndicate'
      detail: Nexthop has real launches, hyperscaler-focused positioning, and a blue-chip Series B
      type: input
    - id: gaps
      label: 'Gap: no public revenue, margin, breadth, or retention data'
      detail: The current mark cannot be conventionally underwritten from the public record
      type: process
    - id: comps
      label: 'Comp reality: closest comps are either much larger or structurally different'
      detail: Arista is closest; Cisco/HPE are lower-multiple floors; Broadcom/NVIDIA capture richer upstream economics
      type: process
    - id: macro
