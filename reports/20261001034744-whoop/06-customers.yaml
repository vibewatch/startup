callouts:
  - calloutType: "risk"
    title: "Channel Concentration and Retailer Vulnerability"
    body: "Independent market analytics from Grips Intelligence reveal that 99.2% of WHOOP's tracked in-store e-commerce revenue between January and August 2026 was concentrated in a single channel: Amazon. While WHOOP maintains an active direct-to-consumer web presence, heavy reliance on Amazon for retail volume exposes the business to platform algorithm changes, margin pressure from marketplace take-rates, and limited control over direct subscriber relationships."
    claimRefs:
      - "CU015"
  - calloutType: "insight"
    title: "Subscriber Trust Vulnerability in Hardware-as-a-Service"
    body: "The customer backlash triggered by WHOOP's May 2025 decision to restrict previously promoted free hardware upgrades demonstrates that subscription wearable economics carry unique brand risks. When customers pay annual recurring fees under the expectation that hardware refreshes are complimentary, policy changes risk breaking implicit consumer contracts and driving spikes in churn."
    claimRefs:
      - "CU014"
