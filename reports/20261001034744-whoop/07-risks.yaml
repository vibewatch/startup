callouts:
  - calloutType: risk
    title: Regulatory Boundary Fragility in Algorithmic Healthcare
    body: Although WHOOP successfully obtained FDA closeout for its Blood Pressure Insights feature in June 2026 by modifying its user interface and labeling to align with the revised General Wellness guidance, this regulatory accommodation remains narrow. Future algorithmic features that introduce disease-specific diagnostic alerts, clinical thresholds, or prescriptive medical advice will remain vulnerable to immediate FDA medical device enforcement actions.
    claimRefs:
      - CR001
      - CR002
      - CR003
