callouts:
  - calloutType: "risk"
    title: "Downside Exposure from Liquidity Preference and Valuation Multiples"
    body: "WHOOP's $10.1 billion post-money valuation establishes a demanding benchmark. While the $575 million Series G provides substantial operating runway, it injects a significant liquidation preference overhang ahead of earlier investors and employee common shareholders. In the event of market multiple compression or decelerating member growth, an exit below $10 billion would result in severe returns dilution."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV011"
      - "CV015"
  - calloutType: "recommendation"
    title: "Prudent Entry Discipline Warranted Ahead of IPO Filings"
    body: "Prospective investors should resist chasing secondary shares at or above the Series G price of $11.23 per share without audited disclosures regarding GAAP revenue, gross margin by subscription tier, and cohort retention. A disciplined 'track' stance allows investors to observe whether international expansion and medical integrations justify the 9.2x bookings multiple."
    claimRefs:
      - "CV004"
      - "CV010"
      - "CV014"
      - "CV016"
