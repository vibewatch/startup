callouts:
  - calloutType: "insight"
    title: "Subscription Unit Economics Outpace Broad Hardware Volumes"
    body: "While Oura leads in total consumer reach with ~5.0M subscribers generating ~$1.0B in revenue, WHOOP extracts comparable top-line bookings ($1.1B run-rate) from half the subscriber base (2.5M members). This demonstrates superior ARPU through tiered annual memberships ($199–$359) and validates that prosumers will pay a premium for coaching algorithms over passive tracking [CM002, CM006, CM007]."
    claimRefs:
      - "CM002"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Medical-Adjacent Boundary Traps Regulatory Clearance Friction"
    body: "WHOOP's strategy to move up the value chain from athletic recovery into clinical diagnostics introduces regulatory vulnerability. The unresolved FDA warning regarding Blood Pressure Insights, alongside consumer false-advertising litigation, illustrates that marketing clinical-adjacent capabilities without formal medical device clearance risks regulatory enforcement and brand erosion [CM002, CM003, CM008]."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM008"
