          - type: callout
            title: IPO 申报前须保持审慎入场纪律
            body: >-
              在缺乏关于 GAAP 收入、按订阅层级划分的毛利率及队列留存率的经审计披露前，潜在投资者不应急于在等于或高于 G 轮每股 $11.23
              的价格追逐二级市场老股。保持严谨的「观察」（track）立场，有助于投资者评估海外扩张与医疗整合能否支撑 9.2x 的预订额估值倍数。
            calloutType: recommendation
            claimRefs:
