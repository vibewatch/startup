  - id: FV001
    title: 投资建议与估值决策逻辑
    type: flow
    summary: 将运营规模与融资背景串联至最终投资建议的分析逻辑链。
    data:
      nodes:
        - id: scale
          label: 规模与增长：预订额年化跑率 $1.1B（+103% YoY）
        - id: cashflow
          label: 现金流动态：2025 年经营现金流为正
        - id: valuation-mark
          label: 定价锚点：$575M Series G 轮融资，估值 $10.1B
        - id: multiple-risk
          label: 估值倍数风险：收紧市场环境下 ~9.2x 预订额倍数
        - id: gaps
          label: 披露缺口：未经审计确认 ARR 与留存率
        - id: recommendation
          label: 最终结论：维持观察评级与偏高估值判断
      edges:
        - from: scale
          to: cashflow
        - from: cashflow
          to: valuation-mark
        - from: valuation-mark
          to: multiple-risk
        - from: multiple-risk
          to: gaps
        - from: gaps
          to: recommendation
    approximationNotes: 节点代表从披露运营数据推导至投资评级的各个离散分析综合阶段。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV008
      - CV014
