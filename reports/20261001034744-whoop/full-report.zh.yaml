      - number: '5.2'
        title: 算法评分引擎、移动端呈现与 AI 动能
        blocks:
          - type: paragraph
            body: >-
              WHOOP 会员的核心分析价值由三大底层算法支柱构成：Strain（负荷）、Recovery（恢复）与 Sleep（睡眠）。Strain
              衡量人体全天及各项离散运动中的心血管与肌肉负荷。该指标基于博格主观疲劳量表（Borg Scale），在 0 至 21 的非线性区间内连续计算，体现累进的生理成本——从 16 分升至 17
              分所需的心血管消耗远高于从 4 分升至 5 分。每日 Recovery 计算次日的生理就绪状态，输出 0% 至 100%
              的百分比评分，划分为绿色（67-100%）、黄色（34-66%）与红色（0-33%）三档。与实时累加的 Strain 不同，Recovery
              锚定清晨基准，综合考量心率变异性（HRV）、静息心率（RHR）、呼吸率、睡眠时长与结构、皮肤温度及血氧饱和度。Sleep 追踪将夜间睡眠拆解为浅睡、REM
              与慢波（深睡）阶段，并结合睡眠负债及近期身体负荷生成个性化睡眠需求预测（Sleep Need）。上述洞察通过 Android 与 iOS 原生 App 呈现。在 Android 研发体系中，AI Momentum
              等专属团队采用 Kotlin、协程、Jetpack 库及 MVVM 模块化架构，实现自动化个性推荐、情境化建议与 AI Coach 对话式交互。然而，官方社群中的会员反馈暴露出若干现实稳定性瓶颈，包括 AI
              建议偏离（drift）、低功耗蓝牙偶发配对故障以及订阅权益同步延迟。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
