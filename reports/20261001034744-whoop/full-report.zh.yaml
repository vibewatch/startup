              WHOOP 的客群基础已从最初由顶级职业运动员与生物黑客构成的封闭圈层，演变为高净值大众健康社群与稳步扩张的 B2B 机构客户群。核心消费者群体为 25–44 岁具备健身素养的成年人，约占活跃用户的 60%；逾
              70% 的美国会员家庭年收入超过 $100,000。针对女性荷尔蒙洞察与月经周期指导进行定向产品投入后，女性订阅用户在 2023 至 2025 年间增长约 40%，整体性别比例调整至约 55% 男性与 45%
              女性。在大众健身之外，涵盖 MLB 与 NFLPA 职业运动队、精锐军方特种战术分队以及 WHOOP Unite 旗下企福计划在内的机构客户，现贡献近 20%
              的年度经常性收入（ARR）。企业级买方采用去识别化的恢复与负荷数据看板，管理外科医生、民航飞行员及企业员工的职业倦怠、疲劳度及出勤就绪状态。
