  - id: FU001
    title: WHOOP 会员生命周期与互动旅程
    type: journey-map
    summary: 会员从获客播种、互动闭环到临床拓展全流程的可视化演进图谱。
    data:
      items:
        - label: 获客与社交播种
          touchpoints:
            - 顶尖运动员背书曝光
            - 附赠硬件的 DTC 30 天试用
            - 口碑裂变转介绍奖励
        - label: 入门引导与习惯养成
          touchpoints:
            - 5 分钟极速配置与基线校准
            - 开启 24/7 全天候持续佩戴传感器
            - 生成首次恢复与压力负荷评分
        - label: 日常互动闭环
          touchpoints:
            - 日均移动应用启动 8 次以上
            - 早晨查看恢复状态与睡眠指导
            - 通过 WHOOP 日志跟踪日常行为
        - label: 社交与社区拓展
          touchpoints:
            - 社区战队与同伴排行榜
            - 社交化运动表现数据分享（类似 Spotify 年度盘点风格）
            - 与 WHOOP 专属 AI 教练进行对话问答
        - label: 年度续费与增购拓展
          touchpoints:
            - 年度续费承诺（$199–$359/年）
            - 升级至 WHOOP Life 会员档位（含心电图及实验室检测）
            - 增购配件与智能服饰
        - label: 临床与企业端融合
          touchpoints:
            - CMS ACCESS 慢性病追踪
            - 医生远程患者监测数据共享
            - 长期健康档案沉淀累积
    approximationNotes: 阶段与触点综合了企业官方披露及市场案例研究中体现的会员行为模式。
    claimRefs:
      - CU012
      - CU013
      - CU014
