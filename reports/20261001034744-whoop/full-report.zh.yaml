  - id: FE001
    title: WHOOP 端到端产品与技术架构体系
    type: stack
    summary: 从可穿戴传感器硬件、移动端呈现、API 网关到云端分析湖仓的 WHOOP 技术结构拆解。
    data:
      layers:
        - label: 第 1 层：可穿戴传感器硬件与嵌入式固件
          detail: 光电容积脉搏波（PPG）光学传感器、皮肤温度传感器、加速度计及嵌入式低功耗蓝牙（BLE）固件。
        - label: 第 2 层：移动客户端应用（Android 与 iOS）
          detail: 原生 Kotlin MVVM 移动应用、蓝牙设备同步以及 AI Momentum 推荐引擎。
        - label: 第 3 层：开发者平台与 API 网关服务
          detail: 独立的外部网关服务，将内部微服务与稳定公开的 REST 及 Webhook 端点解耦。
        - label: 第 4 层：云端后端服务与存储
          detail: 负责身份认证、会员遥测数据摄取及事务型 PostgreSQL 数据库的分布式 AWS 微服务。
        - label: 第 5 层：分析湖仓与机器学习核心
          detail: 通过 Debezium CDC 流式复制写入 Apache Iceberg 表，驱动长期生物特征算法与生理学模型。
        - label: 第 6 层：安全、合规与治理框架
          detail: SOC 2、ISO 27001、GDPR 隐私控制、HIPAA 对齐以及 NIST 800-53 / MCP 人工智能治理。
