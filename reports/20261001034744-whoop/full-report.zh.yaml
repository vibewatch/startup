companyProfile:
  summary: >-
    WHOOP 是一家总部位于波士顿、创始人主导的订阅制可穿戴设备公司，销售无屏幕生物识别手环，并捆绑提供涵盖运动表现、恢复、睡眠及新兴临床场景的 App 指导与附加诊断服务。公司 2025 年末实现 $1.1 billion
    预订额年化运行率，预订额同比增长 103%，经营性现金流为正；随后于 2026 年 3 月按 $10.1 billion 估值完成 $575 million Series G 轮融资。
