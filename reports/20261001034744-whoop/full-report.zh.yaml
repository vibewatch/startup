        - CAGR 达 40%+，已确认收入突破 $2.0B，医疗体系整合实现规模化
        - $15.0B - $18.0B 估值（约 7.5 - 9.0 倍市销率）
        - 生物特征诊断面临监管阻碍，竞品价格战压低利润率
        - 25%（需要医疗合作伙伴落地执行毫无瑕疵）
      - - 基准情景
        - CAGR 为 20%-25%，已确认收入达到 $1.5B，经营性现金流稳健
        - $9.5B - $11.5B 估值（约 6.3 - 7.6 倍市销率）
        - 获客成本（CAC）攀升，国际市场增速放缓
        - 55%（符合消费级订阅硬件走向成熟的发展规律）
      - - 悲观情景
