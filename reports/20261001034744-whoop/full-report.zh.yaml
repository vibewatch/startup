      - number: '8.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 清算优先权与估值倍数带来的下行风险敞口
            body: >-
              WHOOP 的 $10.1 billion 投后估值树立了苛刻的业绩标杆。尽管 $575 million G
              轮融资提供了充裕的运营跑道，但也让早期投资者与员工普通股股东承受显著的清算优先权压力。一旦市场估值倍数压缩或会员增长放缓，低于 $10 billion 的退出将导致回报遭受严重稀释。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV011
