      - number: '7.2'
        title: 运营可靠性、遥测数据完整性与传感器安全性
        blocks:
          - type: paragraph
            body: >-
              技术落地与硬件稳定性为 WHOOP 订阅平台带来持续的运营脆弱性。开发者遥测基准测试表明，iOS
              系统上未经监控的蓝牙断连需要依赖状态恢复监视器（supervisor）来填补数秒级的数据缺口，而后台静默故障需由心率持续订阅看门狗机制予以缓解。硬件直接接触皮肤时，FDA MAUDE
              上市后监测数据库记录了因长时间接触传感器涂层与表带材质而引发的用户接触性皮炎及皮肤过敏炎症。此外，对可穿戴设备临床试验的系统性综述表明，尽管光电容积描记术（PPG）在二阶段睡眠与静息心率指标上保持了可接受的准确度，但在四阶段睡眠分类与慢波深睡心率变异性上仍存在显著偏差，偏差幅度可能超出可靠生理就绪指导所需的最小实质变化阈值（SWC）。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
