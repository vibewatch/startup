            body: >-
              截至 2026 年，WHOOP 全球活跃会员已突破 2.5 million 人，业务模式由 2012 年售价 $500 的买断制追踪器演进为订阅优先模型，据报道 2025 年末预订额年化运行率达
              $1.1B，预订额同比增长 103%。从地域分布看，美国仍是核心收入引擎，贡献约 65% 的总销售额，在洛杉矶、纽约和奥斯汀等大都市区渗透率极高。然而，随着公司将商业版图拓展至 56 个国家及 20
              个新市场（包括卡塔尔、沙特阿拉伯、阿联酋、澳大利亚、中国香港与韩国），海外收入在 2024 至 2025 年间同比增长约
