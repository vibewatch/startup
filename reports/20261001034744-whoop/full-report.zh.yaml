chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              WHOOP 由 Will Ahmed、John Capodilupo 与 Aurelian Nicolae 于 2012
              年创立，总部位于波士顿。公司销售无屏幕可穿戴会员服务，而非传统智能手表：会员获得硬件及涵盖睡眠、负荷、恢复与健康的 App 端指导。独立报道显示其年费订阅起售价为 $199，WHOOP
              当前官网则强调连续监测与个性化指导。该模式的关键在于将硬件成本打包进经常性会员经济，但现有公开证据未披露经审计的收入、留存率或单位经济模型。披露规模亦需谨慎定性：WHOOP 在 2026 年 3 月称拥有超过
              2.5 million 名会员，而 CNBC 在 6 月报道其拥有超过 2.7 million 名用户。这些数据或反映出业务增长，但统计口径与时间节点不一致，无法做严谨的同口径对齐。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
