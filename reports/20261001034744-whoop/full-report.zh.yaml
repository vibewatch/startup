  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管与法律风险：医疗器械边界与隐私诉讼
        blocks:
          - type: paragraph
            body: >-
              随着业务由运动表现追踪向临床医疗领域渗透，WHOOP 面临显著的监管审查。2025 年 7 月，美国食品药品监督管理局（FDA）发出正式警告信，认定该公司的 Blood Pressure Insights
              功能属于未经批准的医疗器械，因其自带高血压与低血压管理的诊断属性。尽管在 WHOOP 依据修订后的《常规健康产品政策》（General Wellness）对界面视觉与产品标签调整后，FDA 于 2026 年 6
              月结案，但随着公司推出进阶生物标志物分析及按需临床医生咨询，边界风险依然存在。与此同时，公司正在加州北区联邦地区法院应对拟议的集体诉讼，该诉讼指控其违反《录像隐私保护法》（VPPA）及《加州医疗信息法案》（CMIA），在未经同意的情况下向第三方追踪工具
              Segment 共享敏感生物特征与视频观看数据，带来实质性的法定赔偿金风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
