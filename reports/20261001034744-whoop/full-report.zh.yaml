      - number: '7.4'
        title: 综合风险全景、尽调路径与逻辑破局触发点
        blocks:
          - type: paragraph
            body: >-
              对 WHOOP 风险画像的综合评估显示，监管重新定性与消费者隐私诉讼构成了其 $10.1 billion 一级市场估值倍数的核心威胁。若 FDA 改变监管立场，将未来的 AI
              诊断功能归类为需要全面上市前审批（PMA）的 Class II 或 Class III 医疗器械，其商业化落地或将面临数年的延宕与高昂的临床试验支出。在隐私诉讼中，法院若对 CMIA
              作出不利司法裁定，可能引致超出其现金储备的法定赔偿判决，或迫使其重构高成本的遥测运维底层架构。明确的投资人一票否决指标（kill criteria）包括：FDA 针对核心 AI
              算法下达正式警告信、全美消费者隐私集体诉讼获法院认证成立，或移动操作系统出台导致后台持续生物特征同步彻底中断且无法弥补的政策变动。
