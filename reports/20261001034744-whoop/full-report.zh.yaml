      - number: '8.3'
        title: 情景分析、退出准备度与尽调要点
        blocks:
          - type: paragraph
            body: >-
              评估 WHOOP 在乐观、基准与悲观情景下的风险调整后回报，可见其对 IPO 窗口期、估值倍数均值回归及医疗商业化落地极度敏感。在乐观情景（估值 $15.0 billion 至 $18.0
              billion）下，WHOOP 加速与 Abbott 的医疗整合，预订额增速维持在 50% 以上，海外市场占新增销售比重提升至 60% 以上，并实现高溢价公开发行。在基准情景（估值 $9.5 billion 至
              $11.0 billion）下，增速放缓至 25% 至 30%，续约率趋于稳定，交易估值大约贴合其 G 轮投后估值水准。在悲观情景（估值 $4.5 billion 至 $6.0
              billion）下，硬件流失加速，医疗收入合作遭遇漫长监管阻力，估值倍数压缩倒逼折价融资或折价 IPO。鉴于 WHOOP 尚未公开提交 S-1
              招股说明书，亦未披露经审计财务报表，投资者宜维持「观察」（track）立场、高风险评级及偏高估值研判。当前尽调核心诉求包括核实 GAAP
              确认的订阅收入、队列总留存曲线，以及管理层针对订阅硬件单体毛利率设定的止损淘汰标准（kill criteria）。
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
