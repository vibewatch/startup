  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、硬件子系统与传感器架构
        blocks:
          - type: paragraph
            body: >-
              WHOOP 推出无屏幕、全天候 24/7 连续生物体征监测可穿戴设备，旨在实现昼夜无感佩戴，覆盖运动表现、生理恢复、睡眠分期与慢病健康管理。不同于聚焦腕上通知与触控交互的智能手表，WHOOP
              刻意摒弃显示屏，以最大化提升不间断佩戴率、消除通知打扰并优化电池续航。核心硬件架构源于其与剑桥咨询（Cambridge
              Consultants）的深度工程合作，攻克了腕式连续光电容积描记术（PPG）难题。技术层面上，光学传感引擎通过多波长光线测量皮下层随动脉脉搏容积变化引起的微弱肤色波动。定制的多波长光学传感器配合专有信号处理与机器学习降噪模型，能从剧烈运动伪影中精准剥离真实的生物心率信号，突破了以往运动员在高强度训练中必须佩戴笨重胸带的历史局限。其硬件系统工程体系贯穿电气、机械、嵌入式固件、信号处理及大规模量产公差控制，形态覆盖标准手腕带、肱二头肌带及集成传感器的
              Whoop Body 智能服饰。在官方传播中，WHOOP 重点强调长达 14 天的电池续航，以及扩展的体征功能组合，包括获 FDA 批准用于心律评估的心电图（ECG）、Healthspan
              寿命监测、血压趋势洞察以及 Advanced Labs 血液标志物整合。
