      - number: '2.4'
        title: 增长驱动、结构性约束与尽调风险
        blocks:
          - type: paragraph
            body: >-
              WHOOP 的持续扩张受宏观结构性红利推动，但亦受到严峻的运营、定价与监管制约。宏观层面上，消费者需求正由浅层步数记录转向纵向生物识别监测与前瞻性临床 AI，2025 年底 FDA
              发布的指导原则认可可穿戴传感器真实世界数据在监管流程中的应用，为此提供了有力背书 [CM006,
              CM007]。然而，严重的普及壁垒依然存在。公司的强制订阅模式遭遇用户抵制，因生物识别数据被设置经常性软件付费墙引发不满，尤其是 Garmin 和三星等硬件竞品在推销功能完备的追踪设备时完全不收取经常性订阅费
              [CM002, CM005]。此外，WHOOP 大举进军医疗相邻诊断领域引发了监管摩擦：FDA 曾针对 Blood Pressure Insights
              作为未经批准的医疗器械运营发出警告，引发持续争议及围绕医疗级营销声称的消费者集体诉讼 [CM002, CM003, CM008]。最后，私募二级市场数据显示出估值承压风险，Forge Data
              估计其参考交易估值为 $7.57 billion，显著低于 $10.1 billion Series G 一级市场定价，凸显出投资人对增长持续性与 IPO 流动性时间表的高度敏感 [CM005, CM009]。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 订阅制单位经济效益超越泛硬件出货量
            body: >-
              尽管 Oura 拥有约 5.0M 订阅者创造约 $1.0B 收入，在消费者规模上保持领先，但 WHOOP 仅凭一半订阅群体（2.5M 名会员）便实现了相当规模的顶线预订额（$1.1B
              运行率）。这体现出分层年度会员（$199–$359）驱动的更高 ARPU，并印证专业消费者愿为指导算法支付远超被动追踪硬件的溢价 [CM002, CM006, CM007]。
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
              - CM007
          - type: callout
            title: 医疗相邻边界遭遇监管准入阻力
            body: >-
              WHOOP 沿价值链自运动恢复向临床诊断延伸的战略引入了监管脆弱性。针对 Blood Pressure Insights 的未决 FDA
              警告以及消费者虚假宣传诉讼表明，在未获得正式医疗器械准入前推销临床相邻功能，面临监管执法处置及品牌信誉受损风险 [CM002, CM003, CM008]。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM008
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与威胁路径
        blocks:
          - type: paragraph
            body: >-
              围绕 WHOOP 的竞争格局涵盖无屏幕恢复手环直接竞品、传统综合运动腕表巨头、智能戒指厂商、平价硬件新进入者及软件整合平台。虽然 WHOOP
              开创了无屏幕恢复追踪品类，并借由顶级运动员代言树立了品牌壁垒，但其护城河正面临猛烈冲击。竞争对手在复刻其核心物理形态（尤其是无屏幕织物手腕带及肱二头肌带）的同时，彻底取消了后续会员费用。Garmin 推出售价
              $199.99 且无经常性费用的 CIRQA 手环，直接对标 WHOOP 硬件方案，提供 10 天续航、Body Battery（身体电量）、压力与睡眠指标，消除了持续付费门槛 [CP003,
              CP004]。与此同时，Google 推出入门起售价仅 $99.99 的 Fitbit Air，首年费用较 WHOOP 基础年费腰斩 50%，且基础追踪无需强制订阅 [CP003,
