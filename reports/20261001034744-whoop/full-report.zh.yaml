  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分赛道与结构性相邻领域
        blocks:
          - type: paragraph
            body: >-
              界定 WHOOP 的目标市场需要明确硬件、软件订阅与临床服务之间的清晰边界。虽然宏观行业分析通常将 WHOOP 宽泛归类为消费电子或智能可穿戴设备——该类别在 2026 年全球市场规模达 $238
              billion——但 WHOOP 的运营与商业化边界更为聚焦且具差异化 [CM001, CM006]。公司主要深耕订阅优先的连续健康追踪与运动表现细分市场，主动避开独立 GPS
              运动硬件销售、多功能智能手表屏幕及单次买断式传感器设备 [CM002, CM005]。相反，WHOOP 将硬件以零首付形式打包至 $199 至 $359 的年度会员中，将全天候 24/7
              被动生理监测与云端负荷、睡眠及恢复智能算法深度结合 [CM001, CM003]。近期，WHOOP 进一步由竞技运动表现拓展至临床相邻医疗基础设施，推出 Advanced Labs
              血液生物标志物检测组合、临床医生审核的健康寿命指导以及安全的外部化验结果上传服务 [CM003, CM007]。这一举措将 WHOOP
              的相邻市场延伸至临床诊断、远程患者监测（RPM）及商业医保可报销的预防性医疗领域，但同时也使业务直面更严苛的监管审查与医疗器械分类限制 [CM003, CM008]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
      - number: '2.2'
        title: 市场规模测算维度：TAM、SAM 与基于证据约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 WHOOP 的潜在市场空间需采用严谨的多层级测算，而非盲信无边界的宏观总额。在最外层边界上，全球可穿戴技术市场在 2026 年总体规模为 $238 billion，行业机构预测其将在 2035 年以
              16.35% 的复合年均增长率增至 $931 billion [CM006]。然而，这一宽泛 TAM 包含智能手表、AR/VR 头显、智能服饰以及基础活动追踪器，主要由苹果和三星等老牌巨头主导，两者合计占据
              27.4% 全球市场份额 [CM006]。更为严谨的可服务市场（SAM）视角仅聚焦专属健康、健身与恢复订阅平台，估计在高端消费者与专业消费者（prosumer）群体中约为 $14 billion 至 $18
              billion [CM005, CM006, CM011]。在此背景下，WHOOP 披露的 2025 年底逾 2.5 million 活跃会员对应的 $1.1 billion
              预订额年化运行率，直接印证了其可获得市场（SOM）[CM001, CM002, CM007]。与最直接竞争对手 Oura 的对标显示（Oura 2025 年约 5.0 million 订阅者创造约 $1.0
              billion 收入），WHOOP 实现了显著更高的单活跃用户平均预订额，即使在专属健康订阅者中渗透率仍低于 10%，依然展现出强劲的专业消费者定价权 [CM002, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 买方细分、工作流整合与预算归属
        blocks:
          - type: paragraph
            body: >-
              WHOOP 的客群渗透覆盖三类特征鲜明的画像，各自具备不同的经济诉求、采购流程及预算来源。第一类核心原生客群为重度运动专业消费者及健身爱好者，受运动目标进阶与习惯优化驱动，通过个人可支配支出或税收优惠的
              HSA/FSA 账户支付会员费 [CM004, CM005, CM010]。这类会员活跃度极高，日均打开 WHOOP 移动端应用超过 8 次，查看睡眠、负荷及恢复评分 [CM001, CM002,
              CM007]。第二类新兴客群为高管健康与前瞻抗衰老长寿消费群体，主要采用 WHOOP 5.0、MG 医疗级硬件及 Advanced Labs 生物标志物检测（单轮检测
              $199–$599），用于监测慢病生物标志物与健康寿命指标 [CM003, CM004, CM006]。最后一类为拓展中的机构类 B2B
              采购方，涵盖顶级职业体育俱乐部（如法拉利车队与巴黎圣日耳曼）、军事部门（如美国海军）及企业员工健康计划，采购支出由机构训练与人员效能预算承担 [CM002, CM005, CM012]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
