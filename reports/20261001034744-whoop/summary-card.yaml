  topStrengths:
    - Subscription model has scaled to a $1.1B bookings run rate with 103% YoY growth.
    - Positive operating cash flow and a large March 2026 Series G provide substantial balance-sheet support.
    - Brand position and strategic healthcare adjacencies broaden the addressable use cases beyond consumer fitness.
  topRisks:
    - Regulatory boundary risk remains elevated as WHOOP pushes into diagnostics and clinician-facing features.
    - Audited revenue, NRR, cohort retention, CAC payback, and other core unit-economics metrics remain undisclosed.
    - >-
      Valuation already prices in strong execution, leaving limited cushion if growth slows or hardware economics
      weaken.
  unresolvedGaps:
    - Audited GAAP revenue, gross margin breakdowns, NRR, gross retention, and CAC payback remain unverified.
    - Current cap-table rights, voting control, and full governance terms are not public.
    - The regulatory path for blood-pressure-related and other diagnostic-adjacent features remains sensitive.
    - >-
      Public evidence still does not reconcile bookings, revenue, and membership terminology into a single audited
      disclosure set.
