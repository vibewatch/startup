company:
  name: "WHOOP"
chapter:
  number: 1
  title: "Company Overview"
  summary: "WHOOP is a Boston-based, founder-led wearable membership company that reported more than 2.5 million members, 103% bookings growth, a $1.1 billion bookings run rate, and positive operating cash flow for 2025. Its March 2026 Series G raised $575 million at a $10.1 billion valuation, but private-company disclosure leaves audited financials, current governance rights, and a fully reconciled cap table unavailable."
sections:
  - id: "identity-and-business-model"
    title: "Identity, product, and business model"
    body: >-
      WHOOP was founded in 2012 by Will Ahmed, John Capodilupo, and Aurelian Nicolae and is headquartered in Boston. The company sells a screen-free wearable membership rather than a conventional smartwatch: members receive hardware and app-based guidance spanning sleep, strain, recovery, and health. Independent reporting describes an annual subscription that starts at $199, while WHOOP's current homepage emphasizes continuous monitoring and personalized coaching. The model matters because hardware is bundled into recurring membership economics, but the assigned public evidence does not disclose audited revenue, retention, or unit economics. Scale disclosures also require careful labels: WHOOP reported more than 2.5 million members in March 2026, while CNBC reported more than 2.7 million users in June. Those figures may indicate growth, but the different terms and dates prevent a clean like-for-like reconciliation.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "capital-and-scale"
    title: "Capitalization, operating scale, and stakeholder alignment"
    body: >-
      On March 31, 2026, WHOOP announced a $575 million Series G at a $10.1 billion valuation. The company said Collaborative Fund led the round, with QIA, Mubadala, Abbott, Mayo Clinic, financial investors, and prominent athletes participating. QIA and independent reporting corroborated the transaction's headline size and valuation. WHOOP separately said it had raised more than $900 million in venture capital; Tracxn reports $979 million across eleven rounds. These are measures of cumulative funding raised, not cash currently available. Operating disclosures are similarly specific but limited: WHOOP said 2025 bookings grew 103% year over year, exited the year at a $1.1 billion run rate, and that the company operated cash-flow positive. A bookings run rate is neither recognized revenue nor ARR, and operating cash-flow positivity is not evidence of accounting profitability.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: "leadership-and-governance"
    title: "Founder-market fit, leadership, and governance gaps"
    body: >-
      Founder and CEO Will Ahmed traces WHOOP's origin to his experience with overtraining as a Harvard athlete, giving the company unusually direct founder-market fit around recovery measurement. CNBC reports that Ahmed developed the business with fellow Harvard students John Capodilupo and Aurelian Nicolae; Tracxn identifies Nicolae as co-founder and chief hardware engineer and lists Capodilupo as an independent board member. The same history demonstrates key-person dependence: the strategy, fundraising narrative, and product thesis remain closely associated with Ahmed. Public assigned sources do not provide a company-issued current executive roster, a definitive board roster, voting rights, investor protective provisions, or founder ownership. The leadership table is therefore deliberately partial and should not be read as an exhaustive current management or governance record.
    claimRefs: [CO001, CO011, CO012]
    tableRefs: [TO002]
  - id: "milestones-and-diligence-signals"
    title: "Milestones, resilience, and adverse signals"
    body: >-
      WHOOP's chronology shows both persistence and execution risk. CNBC reports a first commercial product in September 2015, followed by a 2017 point when the company was one week from bankruptcy because prominent athlete adoption had not produced a sustainable business. The 2018 shift to an annual membership established the current recurring model. Capital and scale accelerated thereafter, culminating in the 2026 Series G. The record is not uniformly positive: Wikipedia's sourced chronology reports 2025 customer backlash after upgrade fees and subscription-extension requirements conflicted with earlier free-upgrade messaging. Sacra also flags regulatory exposure around Blood Pressure Insights, although the assigned pool does not contain the underlying FDA record and this chapter does not elevate that secondary account into a standalone verified regulatory claim. These events make customer-policy consistency, regulatory correspondence, and governance materials priority diligence requests.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
