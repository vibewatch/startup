callouts:
  - calloutType: "risk"
    title: "Erosion of the Screenless Subscription Moat"
    body: "WHOOP's historic pricing power is exposed to significant compression as Garmin CIRQA ($199.99 perpetual) and Google Fitbit Air ($99.99 perpetual) validate that consumers can obtain screenless, 7-to-10-day battery recovery hardware without ongoing subscription fees. At $597 to $1,077 over 3 years, WHOOP must continuously prove that its coaching intelligence and proprietary community features justify a 3x to 5x pricing premium over commodity hardware alternatives [CP003, CP004, CP005, CP010]."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP010"
  - calloutType: "strength"
    title: "Brand Authority and Longitudinal Algorithmic Depth"
    body: "Despite rising hardware competition, WHOOP retains formidable differentiation in athletic brand prestige and multi-year algorithmic data modeling. Backed by 24+ billion physiological hours, partnerships with elite sports leagues, and global athlete investors like Cristiano Ronaldo, WHOOP's daily member engagement remains nearly three times higher than typical screenless wearables [CP013]."
    claimRefs:
      - "CP013"
