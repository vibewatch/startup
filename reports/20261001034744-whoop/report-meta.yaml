companyProfile:
  summary: >-
    WHOOP is a Boston-based, founder-led subscription wearable company that sells a screen-free biometric band, bundled
    app coaching, and add-on diagnostics for performance, recovery, sleep, and emerging clinical use cases. The business
    exited 2025 with a $1.1 billion bookings run rate, 103% bookings growth, and positive operating cash flow, then
    raised a $575 million Series G in March 2026 at a $10.1 billion valuation.
