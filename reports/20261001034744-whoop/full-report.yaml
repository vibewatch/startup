            title: Regulatory Friction on Advanced Diagnostic Features
            body: >-
              FDA scrutiny regarding blood pressure monitoring marketing without clearance creates regulatory and
              financial risk, as aggressive expansion into medical-grade capabilities could invite enforcement actions
              or require costly clinical trial validation.
