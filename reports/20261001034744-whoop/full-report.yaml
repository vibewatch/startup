      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel Concentration and Retailer Vulnerability
            body: >-
              Independent market analytics from Grips Intelligence reveal that 99.2% of WHOOP's tracked in-store
              e-commerce revenue between January and August 2026 was concentrated in a single channel: Amazon. While
              WHOOP maintains an active direct-to-consumer web presence, heavy reliance on Amazon for retail volume
              exposes the business to platform algorithm changes, margin pressure from marketplace take-rates, and
              limited control over direct subscriber relationships.
            calloutType: risk
            claimRefs:
              - CU015
          - type: callout
            title: Subscriber Trust Vulnerability in Hardware-as-a-Service
            body: >-
              The customer backlash triggered by WHOOP's May 2025 decision to restrict previously promoted free hardware
              upgrades demonstrates that subscription wearable economics carry unique brand risks. When customers pay
              annual recurring fees under the expectation that hardware refreshes are complimentary, policy changes risk
              breaking implicit consumer contracts and driving spikes in churn.
            calloutType: insight
            claimRefs:
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Exposure: Medical Device Boundaries and Privacy Litigation'
        blocks:
          - type: paragraph
            body: >-
              WHOOP operates under significant regulatory scrutiny as it transitions from athletic performance tracking
              into clinical health domains. In July 2025, the U.S. Food and Drug Administration issued a formal warning
              letter concluding that the company's Blood Pressure Insights feature functioned as an unapproved medical
              device with inherent diagnostic associations tied to hypertension and hypotension management. While the
              FDA closed out the matter in June 2026 following visual and labeling adjustments under its revised General
              Wellness policy, WHOOP continues to face boundary risks as it introduces advanced biomarker analysis and
              clinician-on-demand services. Concurrently, the company is defending against putative class action
              litigation in the Northern District of California alleging unconsented sharing of sensitive biometric and
              video consumption data with third-party tracker Segment under the Video Privacy Protection Act and
              California Medical Information Act, creating material statutory damages exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
