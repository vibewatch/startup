  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Hardware Subsystems, and Sensor Architecture
        blocks:
          - type: paragraph
            body: >-
              WHOOP delivers a screenless, continuous 24/7 biometric monitoring wearable designed for unencumbered
              day-and-night tracking across sports performance, physiological recovery, sleep staging, and chronic
              health optimization. Unlike smartwatch devices that optimize for on-wrist notifications and touch
              displays, WHOOP intentionally eliminates the visual display to maximize continuous wearability, eliminate
              notification distractions, and optimize battery performance. The core hardware architecture originated
              through deep engineering collaboration with Cambridge Consultants to solve continuous wrist-based
              photoplethysmography (PPG). Technically, the optical sensing engine measures minute fluctuations in skin
              color associated with arterial pulse volume beneath the cutaneous layer across distinct light wavelengths.
              Specialized multi-wavelength optical sensors combined with customized signal processing and
              machine-learning noise-reduction models isolate authentic cardiac signals from intense athletic movement
              artifacts, overcoming the historical limitation that previously required athletes to wear bulky chest
              straps during strenuous exercise. The hardware systems engineering discipline coordinates electrical,
              mechanical, embedded firmware, signal processing, and high-volume manufacturing tolerances across its
              physical form factors, spanning the standard wristband, bicep bands, and sensor-integrated Whoop Body
              garments. In official communications, WHOOP emphasizes up to 14 days of battery life alongside expanded
              physiological feature sets including an FDA-cleared electrocardiogram (ECG) for rhythm assessment,
              Healthspan longevity tracking, blood pressure trend insights, and Advanced Labs blood biomarker
              integration.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
