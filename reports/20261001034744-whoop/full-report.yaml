      - number: '6.2'
        title: Adoption Trajectory and Geographic Revenue Distribution
        blocks:
          - type: paragraph
            body: >-
              WHOOP reached over 2.5 million active members worldwide by 2026, scaling from a $500 upfront tracker in
              2012 to a subscription-first model that reached a reported $1.1B bookings run rate exiting 2025 with 103%
              year-over-year bookings growth. Geographically, the United States remains WHOOP's primary revenue engine,
              accounting for approximately 65% of total sales, with dense member penetration across metropolitan hubs
              such as Los Angeles, New York, and Austin. However, international revenue grew approximately 40%
              year-over-year between 2024 and 2025 as the company expanded commercial availability across 56 countries
              and 20 new markets, including Qatar, Saudi Arabia, the UAE, Australia, Hong Kong, and South Korea. Europe
              represents the second-largest geographic block, led by strong adoption in the United Kingdom and Germany
              supported by regional football partnerships. To overcome cultural and workplace dress-code resistance to
              wrist wearables in the Middle East and Asia-Pacific, WHOOP introduced WHOOP Body smart apparel, allowing
              sensor placement in athletic wear and undergarments.
            claimRefs:
              - CU007
              - CU008
