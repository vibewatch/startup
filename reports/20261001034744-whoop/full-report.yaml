  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Segmentation, and Structural Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Defining WHOOP's addressable market requires establishing explicit boundaries across hardware, software
              subscriptions, and clinical services. While high-level industry analyses group WHOOP broadly into consumer
              electronics or smart wearables—a category valued at $238 billion globally in 2026—WHOOP's operational and
              monetization boundary is substantially narrower and differentiated [CM001, CM006]. The company operates
              primarily within the subscription-first continuous health tracking and performance segment, intentionally
              excluding standalone GPS sports hardware sales, multi-purpose smartwatch displays, and transactional
              sensor devices [CM002, CM005]. Instead, WHOOP bundles zero-upfront hardware into annual memberships
              ranging from $199 to $359, combining 24/7 passive physiological monitoring with cloud-delivered
              algorithmic strain, sleep, and recovery intelligence [CM001, CM003]. In recent cycles, WHOOP has pushed
              beyond athletic performance into clinical-adjacent healthcare infrastructure by launching Advanced Labs
              blood biomarker panels, clinician-reviewed healthspan guidance, and secure outside lab result uploads
              [CM003, CM007]. This expands WHOOP's market adjacency into clinical diagnostics, remote patient
              monitoring, and payer-reimbursed preventative care, while also exposing the business to heightened
              regulatory oversight and medical-device classification constraints [CM003, CM008].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Evidence-Constrained SOM'
        blocks:
          - type: paragraph
            body: >-
              Evaluating WHOOP's total addressable market demands disciplined multi-lens sizing rather than relying on
              an unconstrained headline aggregate. At the outermost boundary, the global wearable technology market
              represents a $238 billion gross volume in 2026, projected by industry researchers to expand to $931
              billion by 2035 at a 16.35% compound annual growth rate [CM006]. However, this broad TAM includes
              smartwatches, AR/VR headsets, smart apparel, and basic activity trackers dominated by incumbents Apple and
              Samsung, who command a combined 27.4% global market share [CM006]. A more rigorous serviceable addressable
              market (SAM) lens isolates dedicated health, fitness, and recovery subscription platforms, estimated at
              approximately $14 billion to $18 billion across premium consumer and prosumer cohorts [CM005, CM006,
              CM011]. Within this context, WHOOP's serviceable obtainable market (SOM) is demonstrated by its disclosed
              $1.1 billion bookings run-rate at year-end 2025 across more than 2.5 million active members [CM001, CM002,
              CM007]. Comparative benchmarking against its closest peer, Oura—which reached roughly $1.0 billion in 2025
              revenue across approximately 5.0 million subscribers—indicates that WHOOP achieves substantially higher
              average bookings per active user, capturing prosumer pricing power even as market penetration remains
              under 10% of dedicated health subscribers [CM002, CM006].
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
