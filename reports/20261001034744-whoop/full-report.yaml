            title: Operating Cash Flow Positive at $1.1B Run Rate
            body: >-
              WHOOP's reported transition to cash flow positive operations alongside 103% bookings growth to a $1.1B run
              rate validates its Wearable-as-a-Service model, proving consumer willingness to commit to recurring annual
              hardware-software subscriptions.
            calloutType: strength
            claimRefs:
