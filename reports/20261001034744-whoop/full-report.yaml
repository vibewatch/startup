              - CR006
              - CR008
              - CR012
      - number: '7.4'
        title: Comprehensive Risk Heatmap, Diligence Paths, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              A consolidated evaluation of WHOOP risk profile indicates that regulatory reclassification and consumer
              privacy litigation represent the primary threats to its $10.1 billion private valuation multiple. If the
              FDA reverses course by classifying future AI diagnostic insights as Class II or Class III medical devices
              requiring full Premarket Approval, commercial rollout could face multi-year delays and capital-intensive
              clinical trials. In privacy litigation, adverse judicial interpretations under CMIA could trigger
              statutory damages exceeding cash reserves or force costly operational telemetry overhauls. Concrete
              investor kill criteria include any formal FDA Warning Letter targeting core AI algorithms, judicial
              certification of a nationwide consumer privacy class, or an unmitigated mobile operating system policy
              change that terminates persistent background biometric syncing.
            claimRefs:
              - CR001
