  - id: TV003
    title: Three-Year Valuation Scenarios (2026-2029)
    columns:
      - Scenario
      - Growth & Margin Assumptions
      - Valuation & Multiple Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - 40%+ CAGR, recognized revenue surpasses $2.0B, healthcare integrations scale
        - $15.0B - $18.0B valuation (~7.5x - 9.0x revenue multiple)
        - Regulatory roadblocks in biometric diagnostics, competitor margin wars
        - 25% (requires flawless medical partnership execution)
      - - Base Case
        - 20%-25% CAGR, recognized revenue reaches $1.5B, stable operating cash flow
        - $9.5B - $11.5B valuation (~6.3x - 7.6x revenue multiple)
        - Subscriber acquisition cost inflation, deceleration in international markets
        - 55% (consistent with maturing consumer subscription hardware)
      - - Bear Case
        - Growth slows under 10%, member churn increases, consumer spending retrenches
        - $4.5B - $6.0B valuation (~3.5x - 4.5x multiple compression)
        - Liquidity preference triggers common stock impairment, down-round IPO
        - 20% (driven by macro multiple contraction and hardware churn)
    notes: >-
      Scenario analysis estimates enterprise value ranges across potential three-year forward exit windows.
      Probabilities are qualitative analytical signals.
