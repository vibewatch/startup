evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A company-issued current executive and board roster, founder ownership, voting rights, investor protective
      provisions, and succession plan.
    whyItMatters: >-
      Founder dependence and a large late-stage financing make control, oversight, and succession material to investment
      risk.
    diligencePath: >-
      Request the charter, bylaws, voting agreements, board minutes, current organization chart, and fully diluted
      capitalization table.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, ARR, gross margin, operating profit, free cash flow, retention, and a reconciliation from
      bookings to recognized revenue.
    whyItMatters: >-
      Public bookings and operating-cash-flow statements cannot establish earnings quality, recurring revenue, or unit
      economics.
    diligencePath: >-
      Obtain audited financial statements, monthly management accounts, cohort retention, and the bookings-to-revenue
      reconciliation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: member-scale
    missingEvidence: >-
      A definition and dated reconciliation of members, users, active subscribers, paid accounts, and household
      accounts.
    whyItMatters: >-
      The March member figure and June user figure use different denominators and cannot be treated as a verified growth
      series.
    diligencePath: Request monthly paid-subscriber cohorts and management's definitions for every publicly used customer metric.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      The fully diluted cap table, participant allocations, liquidation preferences, debt or credit facilities,
      secondaries, and remaining cash.
    whyItMatters: >-
      Funding raised does not equal cash available, and headline valuation does not show ownership or preference-stack
      economics.
    diligencePath: Review financing documents, debt schedules, secondary-sale records, treasury balances, and investor side letters.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements confirming GAAP revenue, COGS, gross margins, customer acquisition cost (CAC), and
      net revenue retention (NRR).
    whyItMatters: >-
      Without audited gross margin and cohort retention disclosures, validating whether WHOOP operates at software-like
      economics or hardware-diluted margins remains an underwriting risk.
    diligencePath: Review confidential S-1 registration statement or audited institutional data room prior to public listing.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      Reconciliation of wearable technology TAM definitions across disparate research houses (Grand View Research $229B
      by 2033 vs broader $931B by 2035 projections).
    whyItMatters: >-
      Broad TAM projections aggregate smartwatches and enterprise devices, obscuring the true addressable market for
      screenless subscription health wearables.
    diligencePath: >-
      Cross-reference IDC, Gartner, and Counterpoint Research wearable segment reports isolating screenless and
      biometric-only device categories.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-unit-sales
    missingEvidence: Exact annualized unit sales, revenue breakdown, and subscriber churn rates for Garmin CIRQA and Google Fitbit Air.
    whyItMatters: >-
      Direct volume data would confirm the precise commercial impact and customer cannibalization rate of
      zero-subscription screenless bands against WHOOP's subscriber additions.
    diligencePath: >-
      Review Garmin quarterly segment reports (Fitness segment revenue) and Alphabet hardware disclosures during
      upcoming 2026 10-Q earnings filings.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited GAAP income statements disclosing subscription gross margins, hardware manufacturing COGS, and fully
      burdened customer acquisition costs.
    whyItMatters: >-
      Without audited cost of goods sold and marketing spend, true gross margin and contribution margin cannot be
      independently corroborated for institutional underwriting.
    diligencePath: >-
      Request audited financial statements from company management or review confidential S-1 registration drafts under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention
    missingEvidence: >-
      Cohort-level annual retention curves, gross churn percentages, and net revenue retention (NRR) benchmarks across
      WHOOP One, Peak, and Life subscribers.
    whyItMatters: >-
      Long-term valuation defensibility hinges on whether the hardware-bundled subscription achieves enterprise-grade
      retention or experiences typical consumer wearable drop-off after month twelve.
    diligencePath: Require management cohort retention schedules segmented by tier, hardware generation, and geographic market.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: cgm-integration
    missingEvidence: >-
      Commercial launch schedule, technical data-exchange latency, and revenue-sharing terms for the continuous glucose
      monitoring integration with Abbott.
    whyItMatters: >-
      Direct integration with continuous glucose hardware represents a primary expansion vector into metabolic health,
      but technical specifications and partner terms remain undisclosed.
    diligencePath: >-
      Request confidential partnership master service agreements and technical API documentation during technical
      diligence review.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited cohort-based net revenue retention (NRR), gross retention, and annual subscriber churn percentages across
      12-month and 24-month consumer cohorts.
    whyItMatters: >-
      Without audited cohort retention, it is impossible to independently verify whether the Hardware-as-a-Service model
      sustains long-term customer lifetime value or relies on high acquisition replacement.
    diligencePath: >-
      Request private SaaS and subscription cohort retention ledgers, monthly churn breakdown, and gross margin per
      cohort under NDA prior to an IPO filing.
    relatedQuestionRefs:
      - QU007
  - type: conflicting-data
    severity: material
    topic: channel-mix
    missingEvidence: >-
      Comprehensive revenue reconciliation between direct-to-consumer website subscriptions and third-party retail
      channels (Amazon and physical sporting retailers).
    whyItMatters: >-
      Grips Intelligence measures 99.2% channel concentration on Amazon within tracked in-store e-commerce, but overall
      blended DTC website share remains unquantified.
    diligencePath: >-
      Request management reporting on gross merchandise value (GMV) by channel, including DTC web, in-app renewals,
      Amazon, and enterprise distributor agreements.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: enterprise-customers
    missingEvidence: >-
