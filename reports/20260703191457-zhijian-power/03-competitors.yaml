    - Vendor-authored production and deployment claims need customer-level corroboration
  - - Unitree
    - Direct robot hardware peer
    - Public product catalog and shop prices; TrendForce projects leadership with AgiBot
    - Developers, education, consumer, industrial inspection, humanoid experimentation
    - Visible low entry prices and broad quadruped/humanoid hardware portfolio
    - Lower-priced hardware can commoditize bodies, but enterprise task software depth is less visible
  - - UBTECH Robotics
    - Public robotics incumbent
    - HK-listed/public-company disclosure surface and humanoid/service robot portfolio
    - Education, service, industrial humanoids, logistics, healthcare
    - Public-company status, Walker family, and broader robotics history
