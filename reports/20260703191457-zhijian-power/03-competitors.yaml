  - - Momenta / DeepRoute.ai / AV AI startups
    - Adjacent physical-AI stack
    - Autonomous-driving software companies with fleet and model know-how
    - Automotive OEMs and assisted/autonomous driving programs
    - Road-world perception, planning, data infrastructure, safety engineering
    - Not direct humanoid products in reviewed evidence
  - - Horizon / Baidu Apollo / Mobileye
    - Incumbent AV/ADAS platforms
    - Public-company or large-platform scale, OEM channels, chips/ADAS/robotaxi ecosystems
    - OEMs, smart-driving vehicles, robotaxi/ADAS deployments
    - Distribution, regulatory posture, mass-production supply chains, edge-compute credibility
    - Compete for physical-AI stack control more than robot-body sales
  - - Pony.ai / WeRide / AutoX
    - Robotaxi and autonomous-driving operators
    - Pony and WeRide have public IR disclosure; AutoX official fetch returned unusable 404 page
    - Robotaxi, robotruck, autonomous mobility/logistics
    - Fleet operations, permits, safety cases, geographies, customer contracts
    - Business model still early; AutoX current public proof was not retrievable from provided URL
