- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Unified VLA/world-model plus on-device training can create task-learning advantage
    - AgiBot, Galbot, and AV-stack firms also claim embodied or world-model assets
    - High
    - Simplexity claims the architecture, but AgiBot/Galbot/Pony sources show comparable physical-AI language and stronger scale
    - Demand side-by-side task-learning benchmarks and edge-training logs
  - - Reliable robot hardware can differentiate if paired to model-defined body
    - Unitree prices robot bodies aggressively and publishes accessible hardware SKUs
    - High
    - G1 from $13.5K and Go2 from $1.6K create visible hardware price anchors
    - Separate Simplexity hardware BOM, uptime, payload, dexterity, and service costs
  - - Data-loop efficiency can compound with deployment volume
    - AgiBot and Galbot already claim thousands of units/orders or 15,000 off-line milestones
    - High
    - AgiBot PR and TrendForce show scale leadership; Galbot PR claims thousands of orders
    - Verify Simplexity data acquisition plan, proprietary task corpus, and customer exclusivity
  - - China embodied-AI demand growth can lift all vendors
    - Output growth can also commoditize features and force price competition
    - Medium
    - TrendForce expects 94% China output growth in 2026 and Unitree/AgiBot near 80% share
    - Model downside scenarios with faster ASP compression and follower disadvantage
  - - Founder/auto-stack background improves credibility
    - Auto executives are flooding the same sector, reducing uniqueness of the pedigree
    - Medium
    - Gasgoo reports multiple AV/auto executives entering embodied intelligence, including Zhijian Power
    - Check recruiting pipeline, non-competes, and access to Li Auto-grade data/assets
  - - Early-stage opacity preserves strategic optionality
    - Opaque pricing and customer evidence weakens buyer trust versus public peers
    - Medium
    - Most direct peers lack public price, but Unitree and public-company/filing peers provide more external proof
    - Require pilot contracts, LOIs, reference calls, warranty terms, and post-sale support SLAs
  notes: Severity reflects pressure on Simplexity’s ability to win pilots, sustain price, and build proprietary data lock-in, not whether the whole embodied-robotics market grows.
