  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Simplexity pilot pricing, list price, robot BOM, service fees, and warranty/support terms.
    whyItMatters: Pricing determines whether Simplexity can sustain a premium over visible low-cost Unitree hardware and subsidized startup deployments.
    diligencePath: Request executed LOIs, pilot contracts, quotes, support SLAs, and gross-margin bridge from management.
    relatedQuestionRefs:
    - QP006
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named Simplexity customers, deployed robot counts, uptime, task-completion benchmarks, and renewal or expansion proof.
    whyItMatters: Direct peers already claim production milestones or orders, so customer proof is needed to distinguish a model thesis from commercialization.
    diligencePath: Conduct customer calls and request deployment logs, acceptance criteria, and before/after productivity data.
    relatedQuestionRefs:
    - QP018
    - QP024
    - QP019
    relatedTableRefs:
    - TP005
  - type: conflicting-data
    severity: minor
    topic: unitree-pricing
    missingEvidence: Direct quote or official confirmation resolving Unitree H1 contact-us versus numeric shop-context price signals.
    whyItMatters: H1 is a relevant humanoid comparator, but unsupported pricing would distort the pricing matrix.
    diligencePath: Ask Unitree sales or authorized distributor for current H1 quote, configuration, lead time, and support package.
