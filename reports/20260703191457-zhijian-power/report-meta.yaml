  customerFocus: Enterprise buyers in controlled environments, especially factory workshops, supermarkets, and logistics or warehouse scenarios; public sources do not yet name paying customers.
  businessModel: Expected B2B robotics platform model combining robot hardware, embodied-AI software, deployment, and ongoing learning/iteration, but public sources do not disclose pricing, contract form, or revenue mix.
  stage: Private unicorn; precise round nomenclature not fully disclosed publicly
