  topStrengths:
    - Founding bench combines Li Auto autonomous-driving, system-integration, and mass-production experience.
    - Publicly reported capital access is exceptional for a 2025-founded company, with roughly RMB2.0 billion raised across five rounds.
    - Official and technical sources support a coherent world-model/VLA, on-device-learning, and data-loop product thesis rather than pure marketing copy.
    - Initial go-to-market focus on factories, supermarkets, and logistics is more plausible than immediate open-environment consumer deployment.
    - China policy and industrial tailwinds support continued demand for embodied-AI and industrial robotics experimentation.
  topRisks:
    - No public source names paying customers, discloses customer count, or proves production deployment conversion beyond PoC and unnamed cooperation.
    - Revenue, margins, burn, runway, and round terms are undisclosed, making the current valuation impossible to underwrite with standard operating metrics.
    - Legal, safety, privacy, and product-liability exposure for embodied AI remains material, while public evidence of certifications and reliability metrics is absent.
    - Compute, chip, and ecosystem dependencies could tighten under export controls or partner concentration.
    - Sector-level bubble warnings and crowded Chinese humanoid/embodied-robotics competition increase down-round and commoditization risk.
  unresolvedGaps:
    - Named paying customers, deployment sites, paid-vs-free pilot status, and repeat-order or renewal evidence.
    - Revenue ledger, gross-margin path, bill-of-materials or service-cost structure, and cash-burn/runway detail.
    - Cap-table terms, liquidation preferences, board control, and exact ownership after the reported financing rounds.
    - Safety, uptime, incident, and maintenance metrics needed to underwrite real factory or logistics deployments.
    - Headcount, senior manufacturing depth, and independent compliance/safety ownership beyond the core founders.
