companyProfile:
  summary: Zhijian Power / 至简动力 / Simplexity Robotics is a Hangzhou-registered embodied-AI robotics startup formed on 2025-07-31 by former Li Auto intelligent-driving leaders including Jia Peng, Wang Kai, and Wang Jiajia. Public materials consistently describe a full-stack software/hardware program that applies autonomous-driving-style world-model and VLA thinking to general robot bodies, initially targeting factories, supermarkets, and logistics. The company has attracted exceptional early capital — about RMB2.0 billion across five reported rounds within roughly six months and a reported valuation above US$1.0 billion — but the public record still lacks named paying customers, revenue, margin, or cap-table evidence.
