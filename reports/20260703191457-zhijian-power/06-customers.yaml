- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Closed-scene task repeatability
    - A small number of pilots could dominate roadmap priorities
    - High if no broad paid base exists
    - Review customer list, pilot stage, and revenue by account
  - - Suzhou industrial ecosystem and Leaderdrive partnership
    - Partner proof may be mistaken for customer proof
    - 'Medium: helps supply chain but not demand validation'
    - Separate supplier/partner contracts from customer orders
  - - Strategic investors Tencent and Alibaba
    - Strategic investors may not become customers or channels
    - 'Medium: possible distribution upside remains unproven'
    - Ask whether either investor has signed deployment or channel agreements
  - - Safety and integration acceptance
    - Failed safety acceptance can stall conversion from PoC to production
    - High for physical robots in human workspaces
    - Review safety cases, incident logs, ISO/OSHA compliance mapping
  - - Industry capital boom
    - Bubble/overcapacity can pressure pricing and customer trust
    - Medium to high in a crowded China market
    - Compare win rates, backlog quality, and customer-paid utilization
  notes: Risks are derived from public evidence gaps and sector adverse sources rather than internal customer data.
