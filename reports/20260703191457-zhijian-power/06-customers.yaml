chapter:
  number: 6
  title: Customers
  summary: Zhijian Power shows credible partner and PoC momentum, but public sources do not name paying customers or production
    deployments. The chapter therefore treats factories, supermarkets, and logistics as intended or unnamed pilot/cooperation
    segments; Leaderdrive as partner proof; and retention, outcomes, expansion, and concentration as material diligence gaps
    rather than inferred positives.
sections:
- id: segmentation-and-intended-demand
  title: Customer Segmentation and Intended Demand
  body: 'The public customer file points to intended B-end closed-environment buyers rather than a proven roster of paying
    users. Zhijian Power''s own site frames the company as building high-user-value embodied-intelligence products from real
    scenarios, while Chinese coverage repeatedly narrows the first commercial targets to factory workshops, supermarket or
    retail shelf operations, and logistics or warehouse sorting. The likely economic buyer is therefore an operations, automation,
    manufacturing-engineering, or innovation leader who controls site productivity budgets; the day-to-day user would be a
    line, warehouse, or store operations team; and the payer would be the enterprise operating the site. Geography is also
    China-centered in the public record: Beijing, Shanghai, and Suzhou are cited as strategic locations, with the Suzhou global
    innovation center positioned as the physical bridge between R&D, manufacturing, and applications. This segmentation is
    useful, but it is not the same as customer proof. No reviewed company, media, or partner source discloses a named paying
    customer, active site count, installed robot count, price, or revenue contribution by segment.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU006
  - CU014
  - CU015
  - CU036
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-proof
  title: Adoption Trajectory and Named Customer Proof
  body: 'The adoption trajectory is visible only up to PoC and unnamed cooperation. Sohu and related Chinese coverage report
    two generations of B-end and C-end robot bodies, small-batch rollout, and PoC verification. The Suzhou/Leaderdrive article
    adds a concrete partner event: a global innovation center signing, strategic cooperation with a harmonic-drive supplier,
    and a first industrial dual-arm robot in sample testing and productization. Sina goes one step further by saying Zhijian
    had reached cooperation with multiple manufacturing, supermarket, and logistics enterprises by March 2026. However, the
    core customer diligence answer is negative: those enterprises are not named, production status is not disclosed, and no
    outcomes are given. Leaderdrive is a valuable named ecosystem partner, not a customer reference. The chapter therefore
    treats customer proof as a gap, not as a hidden positive. Public evidence supports a funnel of technical credibility to
    PoC and unnamed cooperation; it does not yet support paid production adoption, repeat usage, or customer ROI.'
  claimRefs:
  - CU005
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU019
  - CU034
  - CU039
