  - FU003
- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: 'Retention is entirely undisclosed in the public file. No reviewed source reports NRR, GRR, churn, renewal rate, repeat
    purchase, contract length, satisfaction, customer count, active deployment count, or account-level expansion. That does
    not mean early customers are absent; it means the public file cannot distinguish free demos, paid pilots, strategic co-development,
    and production deployments. The land-and-expand logic is plausible because closed industrial sites often start with a
    constrained task, then expand across workstations or facilities after safety acceptance and utilization proof. Yet it
    remains a hypothesis for Zhijian rather than observed behavior. Concentration risk is also unbounded: if the company has
    only a few pilots, any single strategic account or partner could dominate learning data, roadmap priorities, or future
    revenue. Benchmark sources show what stronger proof looks like: JD Logistics describes operational use during Singles
    Day; Boots/Locus ties robots to peak-volume handling; and UBTECH discloses named automotive counterparties, humanoid revenue,
    and unit volume. Zhijian has not yet matched that evidence standard.'
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU020
  - CU021
  - CU022
  - CU023
