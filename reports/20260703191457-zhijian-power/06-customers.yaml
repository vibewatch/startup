- id: procurement-friction-and-adverse-context
  title: Procurement Friction and Adverse Context
  body: 'The adverse case is not that Zhijian lacks ambition; it is that commercialization claims in humanoid and embodied
    robotics are easy to overstate before customers sign, deploy, and renew. OSHA notes that robot accidents often occur during
    programming, maintenance, testing, setup, or adjustment, and ISO 10218-1:2025 underscores the need for machine-level safety
    requirements. Those constraints matter for factories, supermarkets, and logistics sites because the buyer must validate
    human-robot interaction, integration with existing workflows, data collection permissions, service response, and liability
    before moving beyond PoC. Broader China market commentary adds caution: France 24 and The Business Times report official
    warnings about bubble risk, immaturity in technology and commercialization, and more than 150 humanoid robot makers. In
    that context, unnamed cooperation should be underwritten conservatively. The next diligence step is a customer evidence
    pack: signed customers, paid-vs-free status, deployment locations, uptime and safety acceptance, utilization, pilot conversion,
    repeat purchase, and revenue concentration.'
  claimRefs:
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU035
  - CU040
tables:
- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Likely buyer / payer / user
  - Use case
  - Public scale evidence
  - Strategic value
  - Gap
  rows:
  - - Factory workshops
    - Operations / manufacturing engineering budget; line teams use robots
    - Handling, sorting, inspection, closed-workstation tasks
    - Target segment named; no customer count or site count
    - Highest near-term fit because environments are controlled
    - Need named factories and paid deployment status
  - - Supermarkets / retail shelves
    - Retail operations or innovation budget; store associates interact
    - Shelf-tidying or replenishment in semi-structured aisles
    - Target segment named only in secondary coverage
    - Tests transition from closed to semi-open public environments
    - Need store names, safety acceptance, and labor KPI
  - - Logistics / warehouse sorting
    - Warehouse automation payer; pick/pack/sort teams use robots
    - Sorting, material movement, warehouse assistance
    - Unnamed cooperation reported; no named logistics account
    - Large automation budgets and measurable throughput KPIs
    - Need customer, SKU/task scope, and production status
  - - Suzhou industrial ecosystem
    - Partner and industrialization channel rather than customer payer
    - R&D, manufacturing, application bridge through innovation center
    - Leaderdrive partnership and Suzhou center are named
    - Improves supply-chain credibility and local deployment access
    - Need evidence of end customers sourced via ecosystem
  - - Future C-end or open scenes
    - Consumer payer not yet evidenced
    - Potential home/service uses after closed-scene maturity
    - Only broad B/C body language, no C-end customer proof
    - Long-term optionality
    - Do not underwrite until safety and support model are proven
  notes: Rows separate intended segments from observed customer proof; null scale means no public denominator as of runDate.
