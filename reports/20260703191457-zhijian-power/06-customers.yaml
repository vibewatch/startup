  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: A named customer list that separates paid production deployments from pilots, demos, and ecosystem partners.
    whyItMatters: Without names and paid status, public adoption claims cannot be converted into revenue quality or retention
      evidence.
    diligencePath: Request customer contracts, pilot SOWs, deployment acceptance forms, and permission for at least three
      customer reference calls.
    relatedQuestionRefs:
    - QU008
    - QU009
    - QU010
    - QU011
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: NRR, GRR, churn, renewal, repeat purchase, site expansion, and cohort conversion from PoC to production.
    whyItMatters: Durability and concentration risk are unbounded without account-level retention and expansion data.
    diligencePath: Ask for a cohort table by month with pilots started, pilots converted, robots deployed, ARR or contract
      value, churned pilots, and renewal status.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU017
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: customer-outcomes
    missingEvidence: Customer-level productivity, safety, utilization, uptime, or labor-savings outcomes for factory, supermarket,
      and logistics deployments.
    whyItMatters: Embodied robot value depends on measurable site economics; without outcomes, PoC activity may not imply
      willingness to pay.
    diligencePath: Collect before/after KPIs for each pilot, including task cycle time, human interventions, safety events,
      acceptance tests, and support tickets.
    relatedQuestionRefs:
    - QU014
    - QU018
    - QU025
    relatedTableRefs:
    - TU002
    - TU003
  - type: enumeration-incomplete
    severity: material
    topic: customer-enumeration
    missingEvidence: A complete enumeration of customer or pilot counterparties by vertical, deployment phase, and paid status.
    whyItMatters: The public source set names only a partner and category-level cooperation, so segment mix and concentration
      cannot be measured.
    diligencePath: Reconcile management-provided CRM/export data with signed contracts and invoices; sample each vertical
      for independent reference checks.
    relatedQuestionRefs:
    - QU001
    - QU004
    - QU012
    - QU013
    relatedTableRefs:
