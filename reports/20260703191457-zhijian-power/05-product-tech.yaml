  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: trust-gap
    missingEvidence: Safety certifications, cybersecurity architecture, privacy controls, update governance, incident response, and field safety case for robots in human environments.
    whyItMatters: A physical robot cannot be underwritten on model architecture alone when it may operate around workers, shoppers, or logistics staff.
    diligencePath: Request certification roadmap, test-lab reports, hazard analysis, security design review, update-signing evidence, and incident-response runbooks.
    relatedQuestionRefs:
    - QE015
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: blocking
    topic: deployment-gap
    missingEvidence: Named PoC customers, task definitions, acceptance criteria, uptime, intervention rates, throughput, error taxonomy, and deployment SOPs.
    whyItMatters: Media-reported PoC starts do not prove repeatable commercial deployment or customer ROI.
    diligencePath: Interview named PoC customers, review task-level logs, compare human baseline throughput, and inspect go/no-go acceptance criteria.
    relatedQuestionRefs:
    - QE016
    - QE017
    - QE025
    relatedTableRefs:
    - TE002
    - TE004
  - type: missing-source
    severity: material
    topic: hardware-gap
    missingEvidence: Robot hardware specifications including form factor, sensors, actuators, payload, reach, mobility, endurance, compute, battery, cost, and serviceability.
    whyItMatters: Product claims cannot be priced, benchmarked, or safety-reviewed without knowing what the robot body can physically do.
    diligencePath: Request product datasheets, engineering validation test results, bill-of-materials ranges, and service manuals under NDA.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: research-to-product-gap
    missingEvidence: Evidence that LaST0, ManualVLA, and TwinRL are integrated into the same production robot stack with measured field benefits.
    whyItMatters: Research results can be real while still not being deployed, robust, or economically useful in commercial workflows.
    diligencePath: Request architecture diagrams, model lineage, ablation results on company robots, fleet telemetry, and deployment version history.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: developer-gap
    missingEvidence: Public or private SDK/API documentation, release cadence, customer developer forum, issue tracker, package usage data, and integration partner evidence.
    whyItMatters: Developer-signal evidence is currently a proxy from research repositories, not a commercial integration ecosystem.
    diligencePath: Request SDK/API roadmap, partner integration list, customer technical-support tickets, and release-management process.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
