- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / quality area
  - Public status
  - Scope shown
  - Why it matters
  - Gap to close
  rows:
  - - Robot safety certification
    - Not publicly disclosed in reviewed sources.
    - No certification names, test labs, or standard mappings found.
    - Physical robots in factories, retail, and logistics carry human-safety risk.
    - Request safety case, standards mapping, test reports, and incident process.
  - - Cybersecurity and privacy controls
    - Not publicly disclosed in reviewed sources.
    - Official materials discuss data loops but not data governance controls.
    - On-device learning and fleet data collection can create privacy/security exposure.
    - Request security architecture, update-signing, data-retention, and access-control evidence.
  - - Reliability / uptime metrics
    - Not publicly disclosed in reviewed sources.
    - PoC and small-batch status are reported, but uptime is not.
    - Customer ROI depends on sustained autonomous operation.
    - Request MTBF, intervention rate, recovery procedures, and field logs.
  - - Manufacturing quality system
    - Not publicly disclosed in reviewed sources.
    - Media reports mention small-batch production and two body generations.
    - Scaling robots requires repeatable component quality and serviceability.
    - Request supplier list, quality gates, yield data, warranty process, and service plan.
  - - Developer/community evidence
    - Partial public signal exists through GitHub/project pages for TwinRL and curation lists.
    - Research code/data and practitioner repositories show technical awareness.
    - Developer signal supports credibility but not enterprise support readiness.
    - Request roadmap for SDK/API, release cadence, documentation, and support channels.
  notes: The table intentionally records missing controls because public materials do not substantiate certifications, reliability, security, or production quality claims.
