- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role in stack
  - Public evidence
  - Dependency
  - Product risk
  rows:
  - - Unified Transformer model
    - Jointly model language, vision, 3D space, and robot state.
    - Official site states world-model and VLA integration through a unified Transformer.
    - Training data breadth, compute, and robot-state instrumentation.
    - Public sources do not disclose scale, latency, or safety behavior.
  - - Fast/slow reasoning
    - Separate low-frequency reasoning from high-frequency actions.
    - LaST0 paper/project describe a dual-system MoT with latent spatio-temporal CoT.
    - MoT coordination, heterogeneous operation frequencies, and robust action conditioning.
    - Research benchmark gains may not survive real customer edge cases.
  - - Planning/manual expert
    - Transform goal states into multimodal manuals and subgoals.
    - ManualVLA paper describes planning expert, ManualCoT, and action expert.
    - Digital-twin manual data, VLM fine-tuning, and downstream task trajectories.
    - No public production orchestration around error recovery or user correction.
  - - Digital twin post-training
    - Expand exploration and guide real-world RL.
    - TwinRL paper, project page, GitHub repo, and dataset guide.
    - Accurate reconstruction, physics/geometry fidelity, human-in-the-loop rollout safety.
    - Sim-to-real gap and physical safety need independent validation.
  - - On-device inference/training
    - Enable low-latency adaptation and data collection at the robot edge.
    - Official site describes on-device deployment and real-time inference/training.
    - Edge compute, thermal budget, update governance, and data rights.
    - Hardware and cybersecurity implementation are undisclosed.
  - - General robot body
    - Improve data universality and reuse by narrowing body variation.
    - Official site states model-defined body and one general body.
    - Mechanical design, actuators, sensors, manufacturing quality.
    - No public bill of materials, reliability, or maintainability metrics.
  - - Systematized automotive execution
    - Transfer engineering, data-loop, and mass-production methods from Li Auto.
    - 36Kr EU, Gasgoo, and QQ/Auto-First describe founders' autonomous-driving backgrounds.
    - Talent continuity, supply chain execution, verification discipline.
    - Automotive methods may not map cleanly to dexterous robot deployment.
  notes: This architecture table separates directly disclosed components from inferred operating dependencies; dependencies are diligence asks, not confirmed implementation details.
