- id: workflow-deployment-and-data-loop
  title: Workflow, Deployment, and Data Loop
  body: |
    The intended customer workflow is a progressive robot deployment loop in controlled physical environments. Yicai says the company plans to start in closed scenarios including factory workshops, supermarkets, and logistics, then move from closed to semi-open and fully open settings. 36Kr EU gives a more technical explanation: the company is portrayed as trying to move a "shadow mode" pattern from intelligent driving to robots by deploying extra edge compute so robots can collect, train, test, and verify on the body. The official site's "on device," "body," and "hour" language is consistent with that framing: on-device deployment, real-time inference/training, a model-defined general body, reusable data, and rapid online learning. The diligence issue is that these are architecture intentions and early PoC signals. Public sources do not disclose edge-compute bill of materials, latency budgets, fleet telemetry, failure taxonomy, remote-ops tooling, service process, customer acceptance criteria, or the proportion of robot learning that happens safely on-device versus offline.
