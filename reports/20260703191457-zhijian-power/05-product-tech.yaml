- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - Workflow / use case
  - Current workflow problem
  - Company solution signal
  - Measurable benefit claimed or implied
  - Limitation
  rows:
  - - Factory workshop closed scenario
    - Structured but variable physical tasks need stable manipulation and uptime.
    - Yicai and 36Kr EU both name factory workshops as an early target.
    - PoC path could validate repetitive tasks before open environments.
    - No named factory customer, task list, SLA, or acceptance metric is public.
  - - Supermarket / commercial environment
    - Semi-structured retail spaces require item handling, navigation, and human proximity controls.
    - Media reports name supermarkets as an initial closed-scenario target.
    - Retail scenarios could generate diverse manipulation data.
    - Safety, perception edge cases, and customer labor ROI are not disclosed.
  - - Logistics workflow
    - Warehousing/logistics tasks need handling speed and robustness under object variety.
    - Media sources name logistics among early deployment directions.
    - Closed environments fit a staged deployment strategy.
    - No throughput, error rate, or integration evidence with WMS/warehouse systems.
  - - Long-horizon goal-state manipulation
    - Robots struggle to convert a final goal state into an executable procedure.
    - ManualVLA generates multimodal manuals and feeds them into an action expert.
    - Paper reports a 32% higher average success rate than a hierarchical baseline.
    - Evidence is research-task performance, not customer deployment.
  - - Digital-twin guided RL adaptation
    - Physical RL exploration is costly, slow, and safety constrained.
    - TwinRL reconstructs smartphone-captured digital twins and uses twin rollouts to guide real-world RL.
    - Paper reports near-100% success and over 30% faster convergence across four tasks.
    - Transfer beyond four paper tasks and into commercial robots remains unverified.
  notes: Use cases mix company-stated target scenarios with research-task workflows; none should be read as verified revenue-generating deployments.
