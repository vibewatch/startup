  name: Zhijian Power / 至简动力 / Simplexity Robotics
chapter:
  number: 5
  title: Product & Technology
  summary: Zhijian Power's public technical story is an autonomous-driving-to-robotics transfer thesis, not a disclosed finished SKU catalog. The supported stack is a full-stack embodied-intelligence robot program around a world-model-plus-VLA foundation model, on-device learning/data loops, a general robot body, and research artifacts such as LaST0, ManualVLA, and TwinRL. Public proof is strongest at the model/paper/prototype/PoC layer and weakest at productized hardware specifications, safety certification, deployment reliability, and customer verification.
sections:
- id: product-definition-and-maturity
  title: Product Definition and Maturity
  body: |
    Zhijian Power should be read as an embodied-intelligence robot company trying to convert autonomous-driving methods into robots for physical work. The official site says the company was founded in late July 2025 and is building products from real scenarios by combining a high-ceiling unified model, an efficient data closed loop, and reliable robot hardware; it markets the product surface as "full-scenario embodied robots" rather than a named commercial SKU. Third-party coverage adds the maturity boundary: Yicai reported that the first-generation robot had been produced in small batches and that proof-of-concept testing had started, while 36Kr EU said two generations of bodies for B-end and C-end users had been developed, small-batch production had been achieved, and PoC verification had fully launched. That is meaningful prototype evidence, but it is not the same as certified, repeatable, customer-accepted deployment. The safest formulation is therefore product-in-development with PoC activity in closed environments, not scaled commercial product-market fit.
