- id: autonomous-driving-vla-architecture
  title: Autonomous-Driving/VLA Architecture
  body: |
    The company's technical stack is explicitly framed through an autonomous-driving and VLA worldview. The official site describes one self-developed embodied foundation model that integrates a world model and VLA through a unified Transformer, jointly modeling language logic, visual semantics, 3D spatial structure, and robot state for understanding, generation, and prediction. Media accounts connect that to the founding team's Li Auto background: Jia Peng is described as having led Li Auto intelligent-driving R&D and worked through BEV perception, AD Max 3.0, and VLA-model iteration, while Wang Jiajia is described as bringing mass-production delivery experience from end-to-end driving models. The research artifacts fit this worldview. LaST0 addresses fast-slow robot reasoning through latent spatio-temporal chain-of-thought and a Mixture-of-Transformers dual-system design; ManualVLA separates planning/manual generation from action execution for long-horizon manipulation; TwinRL uses digital twins and real-world RL to expand exploration and guide on-robot learning. These papers support the architecture vocabulary, but they do not by themselves prove that the company has fused them into a customer-ready robot system.
