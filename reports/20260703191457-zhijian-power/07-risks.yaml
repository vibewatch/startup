    - BOM or cloud review identifies controlled component without alternative
    - No tested fallback architecture
    - Treat as thesis-break for scale plan
  - - Regulatory AI/data compliance
    - Counsel memo finds filing, PIPL, data-export, or important-data gap
    - Launch requires redesign or unresolved filing
    - Delay closing until remediation plan
  - - Burn and valuation
    - Monthly burn vs proof milestones
    - Runway compresses before customer conversion
    - Reprice, tranched financing, or avoid
  - - Partner concentration
    - Strategic investor or customer terms restrict market access
    - Exclusive or conflict-heavy terms
    - Require waiver or downside protection
  - - Founder/key-person risk
    - Founder departure or unresolved succession
    - Any key founder exits before production proof
    - Re-underwrite management case
  - - Manufacturing reliability
    - Field MTBF, defect, and service metrics unavailable
    - No production-quality dashboard
    - Do not underwrite mass deployment
  - - Legal clearance
    - Credit, court, regulatory or IP records unresolved
    - Material penalty, dispute, or missing clearance
    - Escalate to legal diligence before term sheet
