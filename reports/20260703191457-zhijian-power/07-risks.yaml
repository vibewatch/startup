company:
  name: Zhijian Power / 至简动力 / Simplexity Robotics
chapter:
  number: 7
  title: Risks
  summary: Simplexity’s main residual risks are legal/safety exposure for embodied AI in China, thin public customer proof,
    chip/export-control dependence, and burn/valuation pressure after rapid financing. The risk view is medium confidence
    because many gating mitigations are private-evidence-only.
sections:
- id: risk-ranking
  title: Severity-ranked risk view
  body: 'The risk stack is dominated by the gap between a large 2026 financing narrative and proof that robots can operate
    safely, reliably, and commercially in real customer sites. Public sources support that Simplexity is technically ambitious,
    recently formed, well-funded, and led by former Li Auto autonomous-driving executives, but they do not yet establish named
    production customers, retention, safety certifications, incident history, or unit economics. That creates a high-residual
    commercialization and burn risk: the company may have enough capital to pursue model, body, and data-loop development,
    yet still need conversion evidence before the valuation is investable. The top legal and operating risks should therefore
    be monitored together rather than as separate silos: safety incidents can trigger product-liability claims; data collection
    can trigger privacy or cybersecurity obligations; compute controls can slow model iteration; and missing customer proof
    can transmit directly into down-round or bridge-risk pressure.'
  claimRefs:
  - CR001
  - CR003
  - CR005
  - CR007
  - CR008
  - CR021
  - CR036
  tableRefs:
  - TR005
  figureRefs:
  - FR001
- id: regulatory-legal
  title: Regulatory and legal exposure
  body: China does not yet have a single embodied-AI robot statute that cleanly answers all deployment questions. Instead,
    Simplexity must navigate overlapping obligations from generative-AI, deep-synthesis, algorithm, personal-information,
    data-security, cybersecurity-review, product-quality, tort, and export-control regimes. The highest-confidence obligations
    attach if the company exposes public generative-AI services, handles personal data from cameras or microphones, processes
    important operational data, or deploys networked robots in sensitive environments. Even where a rule is not yet directly
    triggered, it should shape the diligence package because a robot is both a physical product and an AI/data system. The
    legal risk is not merely fines; it is launch delay, forced model or data-process redesign, customer procurement friction,
    safety shutdowns, and restricted access to critical components.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR041
  tableRefs:
  - TR001
- id: operational-safety
  title: Operational, manufacturing, and safety risk
  body: 'The operating thesis relies on developing hardware, embedded systems, perception, controls, model optimization, data
    operations, and on-device learning in parallel. That is powerful if execution is coordinated, but it is a failure-amplifier
    if product maturity lags fundraising expectations. Small-batch bodies and PoC validation do not by themselves prove factory-grade
    reliability, maintainability, or safe human-robot interaction. Workplace robotics guidance and product-liability principles
    make the required diligence concrete: investors should ask for hazard analyses, site acceptance tests, emergency-stop
    design, maintenance procedures, incident logs, cyber-hardening evidence, and insurance. The strongest current mitigation
    is a team with autonomous-driving scaling experience; the residual risk is that autonomous-driving data loops are not
    automatically transferable to warehouses, factories, supermarkets, or homes, where manipulation and human proximity are
    less structured.'
  claimRefs:
  - CR002
  - CR006
  - CR008
  - CR015
  - CR018
  - CR019
  - CR022
  - CR031
  - CR032
  - CR042
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependencies
  title: Chip, partner, and customer dependencies
  body: 'The dependency map has four critical nodes: frontier or edge compute, strategic investors and ecosystem partners,
    deployment customers, and regulators. Simplexity’s on-device training and VLA/world-model approach makes compute and hardware
    supply especially important, while U.S. export-control and connected-vehicle supply-chain actions show that autonomous-system
    hardware and software can become policy targets. Strategic investors can reduce go-to-market and infrastructure friction,
    but undisclosed commercial terms can also create concentration or conflict risk. Customer dependence is currently a different
    problem: public evidence is too thin to know whether there are named production deployments at all. The diligence objective
    should be to separate demos, PoCs, paid pilots, repeat orders, and production rollouts, then map which partner, supplier,
    or regulator could block each stage.'
  claimRefs:
  - CR017
  - CR024
  - CR029
  - CR030
  - CR033
  - CR038
  - CR039
  - CR043
  - CR044
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-execution
  title: Founder and execution concentration
  body: Founder quality is a strength and a risk. Public reporting consistently ties the investment case to former Li Auto
    leaders and the transfer of autonomous-driving methods into robots. That supports credibility on system integration and
    data loops, but it also concentrates the thesis around a small number of individuals and a still-unproven analogy between
    cars and general-purpose robots. The company’s own recruiting surface confirms that the buildout spans many scarce functions,
    from industrial design and mechanical engineering to VLA algorithms, SLAM, data operations, and embedded systems. Diligence
    should therefore require succession planning, role clarity, independent safety ownership, manufacturing leadership depth,
    and evidence that decisions are not bottlenecked around a few founders. Founder departure or inability to recruit senior
    production and safety leaders should be treated as a thesis-break event.
  claimRefs:
  - CR009
  - CR027
  - CR032
  - CR040
  - CR045
  tableRefs:
  - TR004
- id: diligence-triggers
  title: Monitoring plan and kill criteria
  body: The monitoring plan should convert uncertainty into explicit triggers. Regulatory diligence should confirm whether
    any product surface creates a public generative-AI service, algorithm-filing duty, personal-information processing, important-data
    issue, export-control issue, or safety certification requirement. Commercial diligence should demand a customer pipeline
    with names, contract status, deployment stage, revenue, safety sign-off, renewal intent, and concentration by counterparty.
    Operational diligence should require BOM, compute redundancy, supplier qualification, quality escapes, incident response,
    and field reliability metrics. Financial diligence should link burn to milestone evidence rather than to headline capital
    raised. If the company cannot provide credible data in these areas, the right action is to mark the opportunity research-more
    or track, not to underwrite a valuation built on private capital momentum alone.
  claimRefs:
  - CR034
  - CR035
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
  - CR043
  - CR044
