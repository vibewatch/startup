- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Safety / product liability
    - Robot injury, near miss, customer shutdown, or missing safety case
