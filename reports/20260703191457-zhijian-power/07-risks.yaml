  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-clearance-gap
    missingEvidence: Complete PRC litigation, administrative penalty, abnormal-operation, credit, IP dispute, and court-enforcement
      clearance package for Hangzhou Zhijian Power and affiliates.
    whyItMatters: Public portals and secondary profiles do not provide sufficient negative assurance; hidden legal records
      could materially change legal risk.
    diligencePath: Pull GSXT, Credit China, China Judgments Online, court enforcement, trademark/patent, local market-regulator
      and counsel searches with Chinese entity names.
    relatedQuestionRefs:
    - QR014
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: customer-proof-gap
    missingEvidence: Named customer list with deployment stage, contract value, production vs PoC status, safety acceptance,
      repeat order, retention, and concentration.
    whyItMatters: The current public record supports PoCs but not recurring production revenue, making commercialization and
      valuation risk hard to underwrite.
    diligencePath: Request customer contracts, invoices, site references, deployment logs, renewal intent, and permissioned
      customer calls.
    relatedQuestionRefs:
    - QR007
    - QR024
    - QR030
  - type: missing-source
    severity: blocking
    topic: safety-gap
    missingEvidence: Safety case, hazard analysis, certification roadmap, incident log, recall plan, maintenance SOPs, insurance
      coverage, and cyber audit results for robot deployments.
    whyItMatters: Robots can injure people or damage property, and public sources do not establish a mature safety-management
      system.
    diligencePath: Review engineering safety file, FMEA, test reports, incident register, insurance, pen-test evidence, and
      customer site acceptance documents.
    relatedQuestionRefs:
    - QR018
    - QR023
    - QR030
  - type: private-evidence-only
    severity: material
    topic: burn-risk
    missingEvidence: Current cash, monthly burn, headcount plan, capex commitments, compute budget, supplier prepayments,
      runway, and milestone-based financing plan.
    whyItMatters: Large 2026 funding lowers near-term insolvency risk but can mask rapid cash burn and valuation pressure
      if deployments lag.
    diligencePath: Request management accounts, board budget, hiring plan, cloud/compute contracts, capex plan, and next-round
      scenario analysis.
    relatedQuestionRefs:
    - QR008
    - QR025
  - type: missing-source
    severity: material
    topic: chip-dependence
    missingEvidence: Bill of materials, GPU/accelerator roadmap, cloud provider contracts, export-control classification,
      entity-list screening, and tested fallback architecture.
    whyItMatters: Export controls and supply-chain policy can constrain model iteration, edge inference, costs, and overseas
      customer acceptance.
    diligencePath: Conduct export-control counsel review and technical benchmark of compliant alternatives before underwriting
      scale plan.
    relatedQuestionRefs:
    - QR006
    - QR028
  - type: private-evidence-only
    severity: material
    topic: governance-key-person
    missingEvidence: Founder vesting, voting/control rights, board composition, succession plan, executive retention, independent
      safety owner, and decision rights after incidents.
    whyItMatters: The thesis is concentrated around a small group of former Li Auto leaders and undisclosed governance arrangements.
    diligencePath: Review cap table, shareholders agreement, employment/vesting terms, board minutes, org chart, and safety
      governance charter.
    relatedQuestionRefs:
    - QR012
    - QR029
