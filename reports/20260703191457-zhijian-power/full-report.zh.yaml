  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 融资和市场证据先经过披露和反向风险门槛过滤，最后才导出 research-more 建议。
    data:
      nodes:
        - id: n1
          label: RMB2B 融资 / >US$1B 估值
        - id: n2
          label: 顶级投资人和市场顺风
        - id: n3
          label: 缺少收入、客户、毛利率、条款
        - id: n4
          label: 泡沫风险和拥挤市场预警
        - id: n5
          label: 公开可比标的要求披露
        - id: n6
          label: 输出：research-more / 价格高 / 风险高
      edges:
        - from: n1
          to: n3
          label: 必须经由检验
        - from: n2
          to: n6
          label: 留在漏斗
        - from: n3
          to: n6
          label: 挡住买入
        - from: n4
          to: n6
          label: 抬高下行风险
        - from: n5
          to: n6
          label: 设定证据门槛
    approximationNotes: 流程代表决策逻辑，不是定量加权模型。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
      - CV028
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 方向性敏感性显示，哪些尽调结果最会改变估值立场。
    data:
      items:
        - label: 已验证具名付费客户
          value: 2
        - label: 已披露收入和在手订单
          value: 2
        - label: 毛利率路径可信
          value: 1
        - label: 投资条款干净
          value: 1
        - label: 只有市场数据顺风
          value: 0
        - label: 拥挤市场预警
          value: -1
        - label: 没有付费转化证明
          value: -2
      yAxis:
        label: 对估值立场的方向性影响（-2 to +2）
    approximationNotes: 数值是 IC 敏感性分数，不是估值金额或回报预测。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV011
      - CV014
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 只有私有证据改善后，报道价格才会从缺少支撑转为有条件可支撑。
    data:
      items:
        - label: 悲观：公开证明不成立
          low: 1
          mid: 2
          high: 3
        - label: 基准：仅有公开证据
          low: 3
          mid: 4
          high: 5
        - label: 乐观：私有指标已验证
          low: 6
          mid: 7
          high: 8
    approximationNotes: 区间使用 1–10 的证据支撑分数，因为公开来源未披露收入、利润率、稀释或退出输入。
    claimRefs:
      - CV010
      - CV032
      - CV033
      - CV042
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC KPI 分数在品类和投资人支持上最强，在估值证据和经济性透明度上最弱。
