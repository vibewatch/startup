      - number: '4.4'
        title: 公开牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              公开牵引故事可信但不完整。报道称公司很快完成小批量机器人本体推出和 PoC
              验证，并描述其在杭州、北京、上海和苏州的布局。这些是重要运营信号，因为它们显示公司不只是纸面融资载体。可是，保留来源没有任何一个点名付费客户、披露已部署机器人数量、区分试用与付费合同、发布使用率，或展示来自
              PoC 的已确认收入。这意味着数据无法支持活跃客户数、收入 run rate、ARR、NRR、毛利率或销售效率判断。


              尽调姿态应当明确：公开牵引可以支持继续研究，但承销必须等私有证据。下一个 data room 应包括月度管理账、按产品和客户拆分的已确认收入、递延收入、签署订单积压、部署 cohort、机器人级
              COGS、服务工单、质保准备金政策、算力和数据采集支出，以及所有类债务义务。在这些材料可用之前，财务模型中的每个收入、利润率、烧钱和跑道单元都应留为空值，而不是用行业平均数填充。
