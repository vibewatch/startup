companyProfile:
  summary: >-
    Zhijian Power / 至简动力 / Simplexity Robotics 是一家注册在杭州的具身 AI 机器人创业公司，由包括贾鹏、王凯、王佳佳在内的 Li Auto 前智能驾驶负责人于 2025-07-31
    创立。公开资料一致将其描述为软硬件全栈项目：把自动驾驶式世界模型和 VLA 思路用于通用机器人本体，初期瞄准工厂、超市和物流场景。公司早期资本吸引力异常强——约六个月内完成 5 轮、合计约 RMB2.0 billion
    融资，据报估值超过 US$1.0 billion——但公开记录仍缺少具名付费客户、收入、利润率或股权结构证据。
