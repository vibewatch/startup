      - number: '7.2'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              中国目前还没有一部单一的具身 AI 机器人法规，能一次性回答所有部署问题。Simplexity 需要在生成式
              AI、深度合成、算法、个人信息、数据安全、网络安全审查、产品质量、侵权和出口管制等制度之间穿行。只要公司面向公众提供生成式 AI
              服务、通过摄像头或麦克风处理个人数据、处理重要运营数据，或把联网机器人部署到敏感环境，最确定的义务就会落下。即使某条规则尚未被直接触发，它也应进入尽调包；机器人既是实体产品，也是 AI /
              数据系统。法律风险不只是罚款，还包括发布延期、被迫重做模型或数据流程、客户采购阻力、安全停机，以及关键部件获取受限。
