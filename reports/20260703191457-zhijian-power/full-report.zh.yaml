  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 工作流 / 用例
      - 当前工作流问题
      - 公司解决方案信号
      - 已声明或暗示的可衡量收益
      - 局限
    rows:
      - - 工厂车间封闭场景
        - 结构化但会变化的物理任务，需要稳定操作和正常运行时间。
        - Yicai 和 36Kr EU 都把工厂车间列为早期目标。
        - PoC 路径可以先在开放环境前验证重复性任务。
        - 没有公开具名工厂客户、任务清单、SLA 或验收指标。
      - - 超市 / 商业环境
        - 半结构化零售空间需要物品处理、导航和人与机器人近距离安全控制。
        - 媒体报道把超市列为初始封闭场景目标之一。
        - 零售场景可以生成多样化操作数据。
        - 安全、感知边界案例和客户劳动力 ROI 未披露。
      - - 物流工作流
        - 仓储 / 物流任务要在物体种类多的情况下保持处理速度和鲁棒性。
        - 媒体来源把物流列为早期部署方向之一。
        - 封闭环境适合分阶段部署策略。
        - 没有与 WMS / 仓储系统打通的吞吐量、错误率或集成证据。
      - - 长时程目标状态操作
        - 机器人很难把最终目标状态转成可执行流程。
        - ManualVLA 生成多模态手册，并把手册输入动作专家。
        - 论文报告平均成功率比分层基线高 32%。
        - 证据来自研究任务表现，不是客户部署。
      - - 数字孪生引导的 RL 适应
        - 物理 RL 探索成本高、速度慢，还受安全约束。
        - TwinRL 重建由智能手机拍摄的数字孪生，并用孪生环境试跑指导真实世界 RL。
        - 论文报告四项任务接近 100% 成功率，收敛速度快 30% 以上。
        - 四项论文任务之外的迁移，以及进入商业机器人后的表现仍未验证。
    notes: 用例混合了公司声称的目标场景和研究任务工作流；不能把任何一项解读为已验证的创收部署。
