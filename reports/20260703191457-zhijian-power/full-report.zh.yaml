  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Simplexity 的公开财务档案支持一个混合型企业机器人收入论点，而不是一个已经成型的收入模式。公司官网说明其是一家新成立的具身智能公司，正在建设模型、数据闭环和机器人硬件能力；Preqin
              是保留来源中唯一明确描述收入来自向企业客户直接销售机器人硬件、配套软件模型和自动驾驶系统解决方案的来源。对一家全栈机器人公司来说，这个方向合理，但不等于公司披露的收入结构。已审阅官方页面没有发布 SKU、机器人
              ASP、软件许可费、服务费率、试点转付费转化、折扣或合同期限。


              财务含义是，所有价格和收入质量分析都必须保持条件式。据报封闭场景目标包括工厂、超市和物流，指向 B2B 部署而不是消费硬件规模；早期 PoC
              验证是有用的牵引信号。但如果没有签署合同金额、付费部署、使用率、续约权和实施成本，PoC 仍不能计入经常性收入。因此，本章把硬件、软件和解决方案交付视为有支撑的收入流，但对
              ARR、当前收入、已实现定价、毛利率、CAC 和回本期留为空值。
