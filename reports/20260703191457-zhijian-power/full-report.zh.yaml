              投资委员会应把当前估值当作一个尽调假设。从继续研究转向买入，需要同时具备商业和财务证据：按产品或部署拆分的收入、付费客户证明、订单积压和续约条款、BOM
              与服务成本轨迹、安全和可靠性指标、部署利用率、股权结构表中的优先权，以及融资后资金跑道。投资逻辑破裂触发器很具体：没有具名付费客户、试点卡在未付费 PoC
              状态、毛利率轨迹为负、轮次结构让新投资人排在更高级优先权之后，或板块融资压缩。若管理层无法在 NDA
              下提供这些数据，合适动作是放弃或等待更低价格。若能够提供，下一版备忘录应基于已验证里程碑重估公司，而不是泛泛的具身 AI 热情。
