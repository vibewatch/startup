  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：面向受控作业的具身智能机器人
        blocks:
          - type: paragraph
            body: >-
              Simplexity Robotics 不应按泛 AI 公司、EV
              自动驾驶供应商或广义消费级人形机器人来估算。证据指向一家使用自动驾驶技术栈方法的具身智能机器人公司，初始部署围绕封闭或半封闭的工厂、超市和物流工作流。因此，纳入的支出应覆盖机器人本体、操作或移动模块、车队编排、机器人技能
              / 数据迭代、部署集成、维护，以及面向受控工位和场内物流路径的结果挂钩服务模式。排除的支出包括消费聊天机器人 AI、通用云端模型训练、广义 EV 软件、独立 WMS
              许可证，以及不具备移动或操作自主性的商品化自动化。现状替代也很宽：人工、输送线、AGV、固定自动化、叉车、外包 3PL
              流程和内部自动化团队已经解决了部分工作。这个边界解释了用户背景为何提到智能驾驶：公开报道把创始团队与 Li Auto 自动驾驶和 VLA 工作相连，但可投资市场是实体运营中的机器人部署，不是汽车。
