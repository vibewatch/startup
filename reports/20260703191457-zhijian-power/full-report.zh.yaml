        title: 单位经济性、成本结构与可比公司申报
        blocks:
          - type: paragraph
            body: >-
              Simplexity 没有披露通常支撑财务模型的单位经济性输入：机器人
              BOM、制造良率、软件附加率、现场服务人力、质保率、支持强度、毛利率或回本期。因此，最好的公开证据只能是间接的。据报资金用途集中在基础模型训练、机器人本体研发与迭代、数据采集和核心算法，这指向一套横跨算力、机器人工程、数据运营、原型制造和现场验证的成本基础。这个画像与纯软件公司根本不同，不适合套用没有支撑的
              SaaS 利润率假设。


              可比自动驾驶和人形机器人公司的公开申报说明了为什么必须谨慎。WeRide 2025 年收入为 RMB684.6 million，但毛利只有 RMB4.9 million，净亏损 RMB1.25
              billion。UBTECH 2024 年收入超过 RMB1.3 billion，但仍处亏损。Horizon 2024 年收入超过 RMB2.38 billion，并录得大额 non-IFRS 净亏损。Pony
              AI 2025 年收入扩至 US$90 million，但申报记录仍显示，从技术商业化到持久盈利还有很长路径。这些申报不是 Simplexity
              的事实；它们是护栏，说明机器人收入可以与重度亏损、客户集中和营运资金压力并存。
