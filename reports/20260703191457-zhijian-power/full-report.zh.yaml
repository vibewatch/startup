      - number: '2.2'
        title: TAM/SAM/SOM 视角，以及为什么数字不能压成一个 TAM
        blocks:
          - type: paragraph
            body: >-
              公开数据支持分层测算。全球物流机器人口径是最宽的天花板，Global Market Insights 估算该市场 2026 年为 USD 20.7 billion，2035 年达到 USD 91.4
              billion。更窄的仓储机器人口径规模更小，但更接近初始买家：Fortune Business Insights 估算全球仓储机器人 2026 年为 USD 7.35 billion，中国仓储机器人 2026
              年为 USD 2.94 billion。MarkNtel 的中国仓储自动化估计相邻但并不完全相同，不过其 2025 年 USD 3.02 billion 基数和 2032 年 USD 9.17 billion
              预测，可作为中国自动化 SAM 代理。Simplexity 的公开 SOM
              无法计算，因为没有披露付费部署、定价、客户数量、收入或毛利率。正确的尽调姿态，是把中国工业物流机器人视为具身智能里的第一根楔子，再要求管理层证明 PoC 能转化为可重复的付费部署。
