            body: >-
              依赖图有四个关键节点：前沿或边缘算力、战略投资人与生态伙伴、部署客户、监管方。Simplexity 走端侧训练和 VLA /
              世界模型路线，算力和硬件供应因此格外重要；美国出口管制与智能网联汽车供应链措施也说明，自动系统的硬件和软件都可能成为政策目标。战略投资人能降低商业落地和基础设施摩擦，但未披露的商业条款也会带来集中度或利益冲突风险。客户依赖眼下是另一类问题：公开证据太薄，无法判断公司究竟有没有具名量产部署。尽调目标应当是把演示、PoC、付费试点、复购和量产铺开分开，再映射出每个阶段可能被哪类伙伴、供应商或监管方卡住。
