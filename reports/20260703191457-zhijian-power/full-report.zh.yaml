      - number: '8.2'
        title: 投资逻辑与反论
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，Simplexity
              在一个长期需求可信的赛道里，早期背书异常强。公司似乎已经融到足够资本，可在更广泛的消费者或开放环境使用前，先训练基础模型、开发硬件和算法，并推进可控的企业部署。市场数据也支持中国出货预期上行、商业化加速。反论同样有力：公开材料没有量化收入、客户集中度、已签部署、利润率、烧钱速度或轮次条款；负面报道还指出，人形机器人市场拥挤，容易过热。综合看，证据支持把公司留在尽调池里，而不是接受当前价格。若管理层拿出已签客户证据、付费部署转化、毛利率轨迹，以及可执行的投资人条款，解释为什么它相较披露更充分的上市可比公司应享有溢价，观点才会改变。
