        title: 领导层、创始人-市场匹配与治理信号
        blocks:
          - type: paragraph
            body: >-
              领导层叙事异常集中。多篇独立报道都将贾鹏列为 CEO、王凯列为董事长、王佳佳列为 COO，三人均来自 Li Auto 智能驾驶组织。公开报道把贾鹏与 Li Auto 智能驾驶研发、IBM 高性能计算和
              Nvidia 自动驾驶架构经历相连；把王凯与 Li Auto CTO 职责和更早的 Visteon
              自动驾驶架构经验相连；把王佳佳与智能驾驶量产职责相连。该机器人栈从自动驾驶借用感知、VLA、数据闭环和量产纪律，因此创始人-市场匹配可信。它也带来关键人与治理尽调负担：AiQicha 列出更宽的董事 /
              高管名单，Baidu Baike 和第三方工商库披露创始人与机构股东信号，但已审阅来源没有提供签署版股权结构文件、董事会观察员权利、否决权或雇佣锁定条款。后续章节应把 Li Auto
              校友论点同时视为优势和依赖项，而不是可持续组织厚度的证明。
