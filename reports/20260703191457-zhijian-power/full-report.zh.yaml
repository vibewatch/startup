        title: 格局：直接具身机器人同业与 AV 技术栈邻近竞争者
        blocks:
          - type: paragraph
            body: >-
              最清晰的竞争框架，是把直接具身机器人同业与自动驾驶技术栈在位者和邻近公司分开。直接同业包括 AgiBot、Unitree、UBTECH、Galbot，以及中国人形和具身 AI
              创业公司的长尾，因为它们销售或正在商业化实体机器人、机器人本体、机器人开发者平台，或面向工厂、零售、物流、教育和服务场景的任务机器人。Simplexity
              处在同一类广义待完成任务中，因为官网将其描述为围绕一个基础模型、数据闭环效率和可靠机器人硬件打造的全场景具身机器人公司。Momenta、DeepRoute.ai、Horizon Robotics、Baidu
              Apollo、Pony.ai、WeRide、Mobileye 和 AutoX 等邻近竞争者不同：它们主要是自动驾驶软件、芯片、robotaxi 或 ADAS 技术栈。它们不会一对一替代一款人形机器人
              SKU，但会争夺人才、资本、训练数据、OEM 信任、安全案例和世界模型可信度。这个区分很重要：Simplexity 可能把直接机器人订单输给价格更低或部署更多的人形机器人，也可能在 AV 技术栈玩家把车队规模实体
              AI 资产转成机器人平台时失去战略重要性。
