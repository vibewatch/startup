  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 结论：价格昂贵，继续研究
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑这是一家严肃公司，但不足以把媒体报道的投后估值超过 US$1 billion 视为可以买入的入场价。正面事实是真实的：多家独立报道称，Zhijian Power / Simplexity
              Robotics 在大约六个月内完成五轮融资，合计 RMB2.0 billion，吸引顶级财务和战略投资人，并瞄准具备企业场景的具身 AI
              机器人。卡住交易的不是叙事质量，而是公开收入、具名客户、单位成本、毛利率、股权结构表和优先权证据缺失。因此本章建议为继续研究，置信度为中低，风险评级为高，估值立场为昂贵。买方不应编造
              ARR、回报或客户经济性来合理化媒体标出的估值；它应要求私下证据，或调整价格和交易结构。
            claimRefs:
