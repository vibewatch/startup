  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              风险结构的核心，是 2026 年大额融资叙事与机器人能否在真实客户现场安全、稳定、可商业化运行之间的证据缺口。公开资料能支撑 Simplexity 技术野心大、成立时间短、资金充足，并由前 Li Auto
              自动驾驶高管带队；但还不能证明公司已有具名量产客户、留存、安全认证、事故记录或单位经济模型。残余商业化和烧钱风险因此很高：公司或许有足够资本推进模型、本体和数据闭环开发，但估值要可投，仍需要转化证据。最重要的法律和运营风险也不能分仓看待，而应联动监控：安全事故会引发产品责任索赔；数据采集会触发隐私或网络安全义务；算力管制会拖慢模型迭代；客户证据缺失则会直接传导为下轮降价融资或过桥融资压力。
