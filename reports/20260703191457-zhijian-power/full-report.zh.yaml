      - number: '5.2'
        title: 自动驾驶 / VLA 架构
        blocks:
          - type: paragraph
            body: >
              公司的技术栈明确以自动驾驶和 VLA 世界观来框定。官网称其自研一个具身基础模型，用统一 Transformer 融合世界模型与 VLA，联合建模语言逻辑、视觉语义、3D
              空间结构和机器人状态，用于理解、生成和预测。媒体报道把这与创始团队的 Li Auto 背景相连：贾鹏被描述为曾负责 Li Auto 智能驾驶研发，并经历 BEV 感知、AD Max 3.0 和 VLA
              模型迭代；王佳佳则被描述为带来端到端驾驶模型的量产交付经验。研究成果也契合这个世界观。LaST0 用 latent spatio-temporal chain-of-thought 和
              Mixture-of-Transformers 双系统设计处理机器人快慢思考；ManualVLA 把长程操作中的规划 / 手册生成与动作执行拆开；TwinRL 用数字孪生和真实世界 RL
              扩大探索并指导机器人本体学习。这些论文支撑了架构词汇，但本身不能证明公司已把它们融合成客户可用的机器人系统。
