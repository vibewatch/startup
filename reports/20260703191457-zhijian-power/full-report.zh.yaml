      - number: '7.5'
        title: 创始人与执行集中度
        blocks:
          - type: paragraph
            body: >-
              创始人质量既是强项，也是风险。公开报道反复把投资逻辑押在前 Li Auto
              领导层，以及自动驾驶方法迁移到机器人这件事上。这支撑了系统集成和数据闭环的可信度，但也让论证集中在少数个人身上，并押注“汽车到通用机器人”这一仍未验证的类比。公司招聘页面也确认，建设范围横跨大量稀缺职能，从工业设计、机械工程，到
              VLA
              算法、SLAM、数据运营和嵌入式系统。尽调因此应要求继任计划、角色边界、独立安全负责人、制造领导层深度，以及决策没有卡在少数创始人手里的证据。创始人离开，或无法招到资深生产和安全负责人，都应视为投资逻辑破裂事件。
