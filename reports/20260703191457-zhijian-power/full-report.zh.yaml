      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图更偏运营，而不是纯技术。在电商履约和 3PL 中，经济买家是物流或仓储运营
              VP，日常用户是拣选员、主管和自动化工程师，付款方是物流业务单元或资本开支委员会。在制造业场内物流中，工厂运营和工业工程团队推动采购，IT 与自动化团队则把机器人接入
              MES、WMS、安全和设施控制。零售与超市场景增加门店运营和损耗防控干系人；服务场景增加设施或网点运营。JD 的 Zhilang 证据说明买家为什么在意：公开主张包括拣选效率提升超过 3x、存储密度提升
              2.5x、回本周期缩短，以及北京一个园区内近 100 台机器人。Geekplus 证据给出在位者标杆：大型 AMR 供应商卖给电商、3PL、服装、医疗、商超、汽车、冷链等高吞吐环境。Simplexity
              要么在柔性操作和泛化上胜出，要么找到在位者能力不足的工作流。
