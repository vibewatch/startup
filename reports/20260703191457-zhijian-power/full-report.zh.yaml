        title: 资本充足性、跑道与下一轮风险
        blocks:
          - type: paragraph
            body: >-
              最强的已披露财务事实是融资，不是经营表现。独立来源一致称累计融资约 CNY2.0 billion、估值超过 USD1.0 billion，投资财团包括
              Tencent、Alibaba、HongShan、Legend、CAS Star、Gaorong、BlueRun/Lanchi 等。对一家 2025 年 7 月成立的公司来说，这笔资金异常庞大，也给
              Simplexity 在模型训练、机器人迭代、数据获取和早期部署上留下有意义的资本垫。可是，它没有揭示账上现金，也没有说明公司消耗资本的速度。


              因此，资本充足性仍是开放尽调问题。没有公开来源披露月度烧钱、跑道月数、债务、租赁、客户预付款、项目融资义务或下一轮融资触发条件。可能的触发条件不是标准 SaaS ARR
              里程碑；对这家公司来说，更可能是证明软硬件系统能从 PoC 走向可重复部署，同时保持可接受的毛利率和服务负载。负面背景也重要，因为独立媒体报道了中国官方对人形机器人泡沫风险的担忧。如果市场情绪在
              Simplexity 拿出收入质量和单位经济性的私有证据之前收紧，其据报独角兽估值可能更难守住。
