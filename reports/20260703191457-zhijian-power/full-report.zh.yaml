  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 用户或运营方问题
      - 公开状态 / 成熟度
      - 差异化信号
      - 尽调缺口
    rows:
      - - 全场景具身机器人本体
        - 买方需要能进入真实物理流程的机器人，而不只是演示样机。
        - 官方宣布即将推出；媒体报道称，第一代机器人已开始小批量产出和 PoC。
        - 公开论点是模型定义通用本体，并做软硬件协同设计。
        - 没有公开载荷、移动能力、执行器、续航、传感器、安全或成本规格。
      - - 世界模型 + VLA 基座模型
        - 机器人执行任务时，需要理解语言、视觉、空间和状态。
        - 官方称为自研，并通过一个 Transformer 统一。
        - 单一架构旨在减少手工设计模块，并提升扩展性。
        - 没有公开生产基准、模型规模、数据规模、延迟或安全边界。
      - - 端侧学习 / 数据闭环
        - 新场景需要适应能力，不能依赖缓慢的集中式再训练周期。
        - 官方描述为端侧部署、实时推理 / 训练和高效在线学习。
        - 自动驾驶影子模式类比，指向车队数据闭环纪律。
        - 没有公开证据证明在线更新安全、可回滚、隐私控制或边缘算力上限。
      - - LaST0 基座模型研究
        - VLA 操作既需要快速反应，也需要较慢的物理推理。
        - arXiv / 项目页证据；共同署名机构包括 Simplexity Robotics。
        - 潜在时空 CoT 与快 / 慢 MoT 专家，用来应对延迟和动态变化。
        - 论文实验与商业机器人技术栈之间的关系未披露。
      - - ManualVLA 长时程任务模型
        - 长时程装配 / 重排需要程序化规划和精确控制。
        - arXiv / PDF / 项目证据；论文中 Peng Jia 隶属于 Simplexity Robotics。
        - 规划专家生成多模态手册，再用这些手册约束动作执行。
        - 没有公开客户工作流显示 ManualVLA 已进入 Zhijian 机器人。
      - - TwinRL 后训练框架
        - 真实世界机器人 RL 慢、成本高，还受安全约束。
        - arXiv / PDF / GitHub 证据，且有公开仓库和数据集指南。
        - 数字孪生扩大探索范围，并指导人类在环的真实机器人试运行。
        - 公开代码 / 数据只能提供信号，不能证明生产部署或车队可靠性。
    notes: 模块状态只基于已审阅的公开来源；硬件规格和认证声明未披露，因此刻意留作缺口。
