            body: >-
              采用约束很实质。公开市场估算方向积极，但边界互不兼容；分析师来源混用了仓储自动化、仓储机器人、物流机器人，有时还混入更广义的服务机器人。在位者已经有部署车队、客户证明和专用工作流，因此 Simplexity
              不能假设具身 AI 叙事会自动转化为 SOM。技术风险仍在：公开报道强调训练难度高、算力消耗大、数据需求强，以及机器人作业相较驾驶面对更难的随机性。监管和地缘政治约束也重要，因为具身 AI
              模型触及数据治理和先进计算供应。最关键的是，已审阅公开来源没有披露 Simplexity 的付费客户数量、价格、回本期、管线转化、在线率、毛利率或支持成本。市场有吸引力，但投资问题在于：Simplexity
              能否在在位者吸收柔性自动化用例之前，把政策推动的试点转成可重复付费部署。
