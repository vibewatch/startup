    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与叙事定位
        blocks:
          - type: paragraph
            body: >-
              本章分析的可投资主体是杭州至简动力科技有限公司，公开也以至简动力、Zhijian Power 和 Simplexity Robotics 出现。官网以「Simplexity
              Robotics」介绍这家公司，称其成立于 2025 年 7 月下旬，专注用统一模型、数据闭环和机器人硬件打造全场景具身机器人。工商口径把叙事压实为一组法律事实：AiQicha 显示公司成立于
              2025-07-31，位于杭州市余杭区，贾鹏任法定代表人，经营范围覆盖 AI 软件、智能机器人研发与销售、工业 / 服务机器人制造，以及数据处理和系统集成等服务。因此，当前更适合按机器人 / 具身 AI
              来看。细节很关键：团队可信度来自 Li Auto 的智能驾驶和自动驾驶系统经验，但公开文章描述的是把 VLA、世界模型和自动驾驶能力迁移到机器人，而不是出售智能驾驶平台。
