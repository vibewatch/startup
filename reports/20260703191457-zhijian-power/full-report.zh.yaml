    rows:
      - - 统一 Transformer 模型
        - 联合建模语言、视觉、3D 空间和机器人状态。
        - 官网称世界模型和 VLA 通过统一 Transformer 集成。
        - 训练数据广度、算力和机器人状态采集。
        - 公开来源未披露规模、延迟或安全行为。
      - - 快 / 慢推理
        - 把低频推理和高频动作拆开。
        - LaST0 论文 / 项目描述了一个带潜在时空 CoT 的双系统 MoT。
        - MoT 协同、异构运行频率和稳健动作条件化。
        - 研究基准提升未必能扛住真实客户边界案例。
      - - 规划 / 手册专家
        - 把目标状态转成多模态手册和子目标。
        - ManualVLA 论文描述了规划专家、ManualCoT 和动作专家。
        - 数字孪生手册数据、VLM 微调和下游任务轨迹。
        - 没有公开生产编排证据显示如何处理错误恢复或用户纠正。
      - - 数字孪生后训练
        - 扩大探索范围，并指导真实世界 RL。
        - TwinRL 论文、项目页、GitHub 仓库和数据集指南。
        - 精准重建、物理 / 几何保真度、人类在环试运行安全。
        - 仿真到现实的差距和物理安全需要独立验证。
      - - 端侧推理 / 训练
        - 让机器人边缘端具备低延迟适应和数据采集能力。
        - 官网描述端侧部署和实时推理 / 训练。
        - 边缘算力、热预算、更新治理和数据权利。
        - 硬件和网络安全实现未披露。
      - - 通用机器人本体
        - 通过收窄本体差异，提升数据通用性和复用。
        - 官网称模型定义本体，并采用一个通用本体。
        - 机械设计、执行器、传感器、制造质量。
        - 没有公开 BOM、可靠性或可维护性指标。
      - - 系统化汽车执行
        - 把 Li Auto 的工程、数据闭环和量产方法迁移过来。
        - 36Kr EU、Gasgoo 和 QQ/Auto-First 描述了创始人的自动驾驶背景。
        - 人才连续性、供应链执行和验证纪律。
        - 汽车方法未必能顺滑映射到灵巧机器人部署。
    notes: 这张架构表把直接披露的组件，与推断出的运营依赖拆开；依赖项是尽调问题，不是已确认的实施细节。
