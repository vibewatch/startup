            body: >-
              可比公司证据要求纪律。UBTECH、Baidu、Pony AI、WeRide 和 Mobileye
              都不是完美匹配，但它们各自说明，可投的公开证据长什么样：审计或交易所备案财务、明确收入或运营指标、风险因素和持续披露。UBTECH 表明，人形机器人上市可比公司即便有 RMB1.3 billion
              收入，一年也可能亏损超过 RMB1.1 billion。Baidu 和 Mobileye 显示真实运营规模和收入，同时提醒投资人，预期变化时估值标记会重置。Pony AI 和 WeRide 的备案文件显示，AV
