        title: 采购摩擦与负面背景
        blocks:
          - type: paragraph
            body: >-
              负面情形不是 Zhijian 缺少雄心，而是在人形和具身机器人领域，商业化主张很容易在客户签约、部署和续约前被夸大。OSHA 指出，机器人事故常发生在编程、维护、测试、安装或调整期间；ISO
              10218-1:2025 也强调机器级安全要求的必要性。这些约束对工厂、超市和物流场地很重要，因为买方必须验证人机交互、与既有工作流集成、数据采集授权、服务响应和责任承担，才会越过
              PoC。更广的中国市场评论也给出警示：France 24 和 The Business Times 报道了官方对泡沫风险、技术和商业化不成熟，以及超过 150
              家人形机器人制造商的警告。在这种背景下，未具名合作应保守承销。下一步尽调是客户证据包：签约客户、付费与免费状态、部署地点、在线率与安全验收、使用率、试点转化、复购和收入集中度。
