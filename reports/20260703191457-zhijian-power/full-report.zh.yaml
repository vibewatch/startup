  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心风险通过安全、客户、融资和估值传导。
    data:
      nodes:
        - id: compute
          label: 芯片 / 算力获取
        - id: model
          label: 模型迭代和端侧学习
        - id: robot
