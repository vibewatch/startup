      - number: '7.6'
        title: 监控计划与终止标准
        blocks:
          - type: paragraph
            body: >-
              监控计划应把不确定性转成明确触发器。监管尽调需确认是否有任何产品界面构成面向公众的生成式 AI
              服务、算法备案义务、个人信息处理、重要数据问题、出口管制问题或安全认证要求。商业尽调应要求客户管线列明名称、合同状态、部署阶段、收入、安全签核、续约意向，以及按交易对手划分的集中度。运营尽调应要求
              BOM、算力冗余、供应商认证、质量逃逸、事故响应和现场可靠性指标。财务尽调应把烧钱速度与里程碑证据绑定，而不是与头条融资额绑定。如果公司拿不出这些领域的可信数据，正确动作是把项目标记为继续研究或跟踪，而不是仅靠私人资本动能去承销估值。
