        - 另一项公开 AV 技术栈披露基准
        - 具体财务数据需在本章之外审阅申报文件
      - - Mobileye
        - 2026 Q1 收入 US$558M、指引更新、商誉减值
        - 说明公开市场奖励收入，也会重置估值预期
        - ADAS / AV 芯片模式不同于具身机器人 OEM
      - - IFR World Robotics
        - 机器人统计与趋势来源
        - 独立机器人市场基线
        - 不是公司特定估值证据
      - - Morgan Stanley 经 CNBC
        - 上调中国人形机器人出货观点
        - 支撑市场时点的牛市论点
        - 市场增长不能证明 Simplexity 经济性
      - - TrendForce / Axis / Robozaps
        - 2026 年出货、融资、定价和公司跟踪信号
        - 提供市场数据交叉验证
        - 数据来源方法不同，可能夹杂炒作周期噪音
    notes: 枚举为部分可比对象集合，围绕人形机器人、具身 AI 和 AV 技术栈公开披露的估值相关性筛选。
