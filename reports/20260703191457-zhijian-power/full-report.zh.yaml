        - label: 商业证明
          value: 3
          unit: /10
        - label: 经济性透明度
          value: 2
          unit: /10
        - label: 反向风险韧性
          value: 4
          unit: /10
        - label: 入场价格支撑
          value: 2
          unit: /10
    approximationNotes: 分数是对有来源证据的判断性总结，并刻意避免编造私有指标。
    claimRefs:
      - CV003
      - CV004
      - CV007
