      - number: '4.5'
        title: 财务结论与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              财务结论是继续研究。Simplexity 拥有异常强的融资动能、据报顶级投资人阵容，以及契合 2026 年具身 AI
              需求的产品叙事。这些都是真正的正面因素。但公司太年轻、太私有，公开财务模型难以可靠。干净的尽调备忘录必须把已披露 CNY2.0 billion 融资和 USD1.0 billion-plus
              估值，与没有支撑的收入、ARR、毛利率、烧钱、跑道或单位经济性主张分开。


              承销风险不是公司没有财务价值，而是公开证据尚不能衡量收入质量或资本效率。可比申报显示，机器人和自动驾驶企业可以在收入增长的同时持续大额亏损、承受客户集中，并为重研发和部署成本融资。因此，下一轮尽调应优先拿到 5
              类证据包：管理层财务；合同和管线明细；BOM 与制造良率历史；部署服务成本 cohort；以及董事会批准的、覆盖至下一次融资事件的资本计划。没有这些，估值立场应保持未知，而不是有吸引力或昂贵。
