      - number: '7.3'
        title: 运营、制造与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营假设要求公司并行推进硬件、嵌入式系统、感知、控制、模型优化、数据运营和端侧学习。执行协同，这很有力；一旦产品成熟度落后于融资预期，它也会放大失败。小批量本体和 PoC
              验证本身无法证明工厂级可靠性、可维护性或安全人机交互。职场机器人指南和产品责任原则把尽调问题落到具体清单：投资人应索取危害分析、现场验收测试、急停设计、维护流程、事故日志、网络加固证据和保险。当前最强缓释项，是团队有自动驾驶规模化经验；残余风险在于，自动驾驶数据闭环不能自动迁移到仓库、工厂、超市或家庭，后者的操作任务和人机近距接触都更不结构化。
