  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与成熟度
        blocks:
          - type: paragraph
            body: >
              Zhijian Power 应被视为一家具身智能机器人公司，试图把自动驾驶方法转化为面向实体作业的机器人。官网称公司成立于 2025 年 7
              月下旬，正从真实场景出发，把高上限统一模型、高效数据闭环和可靠机器人硬件结合起来打造产品；它对外呈现为「全场景具身机器人」，而不是一款具名商业 SKU。第三方报道补上了成熟度边界：Yicai
              报道称第一代机器人已小批量生产，概念验证测试已经启动；36Kr EU 称面向 B 端和 C 端用户的两代本体已经开发完成，已实现小批量生产，PoC
              验证已全面启动。这是有意义的原型证据，但不等于已认证、可重复、被客户接受的部署。因此，最稳妥的表述是：产品仍在开发中，并在封闭环境里开展 PoC 活动，而不是已经规模化的商业 product-market
              fit。
