        blocks:
          - type: paragraph
            body: >-
              情景分析看显性证据条件，不编造收入或回报测算。牛市情形下，私下尽调证明企业试点已转为经常性付费部署，制造良率在改善，数据和模型优势守得住，股权结构表条款没有把过多下行风险转嫁给新增普通股敞口。基准情形下，公开记录仍是证据集：它证明融资势能和赛道热度，但无法支撑价格。熊市情形下，监管顾虑、供给拥挤、产品同质化或
              PoC 转化失败，在收入质量可见之前，就把公司推向降价融资、内部过桥或战略出售。这个区间因此不是预测回报区间，而是“可支撑性”区间，显示媒体报道的估值要被视为公允，还需要多少私下证据。
