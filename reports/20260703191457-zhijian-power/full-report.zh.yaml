      - number: '2.4'
        title: 增长驱动、中国政府支持与自动驾驶技术栈迁移
        blocks:
          - type: paragraph
            body: >-
              增长由政策、劳动力、电商、物流复杂度，以及把 AI 转化为实体生产力的诉求共同拉动。中国 2026 年 MIIT/SASAC
              行动尤其明确：推动真实场景训练、创新联合体、技能包、验证、常态化部署、融资支持，甚至租赁或 robot-as-a-service 模式。更广的 Robot+ 政策和新的人形 / 具身 AI
              标准体系增加合法性，也帮助打开国企和地方场景。市场数据同样支持需求：物流机器人驱动因素包括电商增长、劳动力短缺、AI 导航进步、RaaS、效率和韧性。自动驾驶迁移重要，是因为相同的 VLA /
              世界模型、感知、导航、计算、电力和量产纪律可以缩短机器人迭代周期。可是，相比道路，机器人还需要在更不标准化的环境里处理操作、平衡、人机交互和异常场景鲁棒性；汽车技术栈可信度是起跑优势，不是采用证明。
