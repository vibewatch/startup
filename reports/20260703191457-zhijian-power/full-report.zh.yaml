  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 没有付费客户证明
        - 管理层无法在 NDA 下提供具名付费客户背书
        - 商业证明停留在叙事或 PoC 层面
        - 放弃或等待
      - - 收入不透明持续
        - 没有按产品、部署或客户群组拆分的收入
        - 估值无法锚定变现
        - 不要为 >US$1B 背书
      - - 毛利为负或未知
        - 没有 BOM、服务成本或良率证据
        - 规模化可能吃掉现金，而不是创造价值
        - 要求里程碑分期
      - - 拥挤市场重估
        - 可比轮次或公开可比公司估值下修
        - 下轮降价融资风险上升
        - 要求更低进入价格
      - - 部署转化弱
        - PoC 无法转成重复付费订单
        - 企业采用的牛市论点破裂
        - 除非价格重置，否则停止
      - - 不利优先权
        - 新资金排在沉重清算优先权之后
        - 媒体口径估值误导普通股经济性
        - 重谈条款
      - - 安全 / 可靠性缺口
        - 机器人达不到企业正常运行时间或事故阈值
        - 客户扩张和监管接受度停滞
        - 等待现场数据后再推进
    notes: 触发项是尽调阈值和监控标准，不是事件已经发生的主张。
    claimRefs:
      - CV009
      - CV011
      - CV012
      - CV025
      - CV033
      - CV039
      - CV040
      - CV045
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 收入质量
        - 按产品、付费部署、经常性 / 项目制组合拆分的收入
        - 从叙事估值切到倍数或里程碑估值时需要
        - CFO 数据室和银行流水
      - - 客户证明
        - 具名客户、合同条款、续约或扩张数据
        - 验证试点之外的企业需求
        - 客户访谈和合同审阅
      - - 部署漏斗
        - PoC 到付费转化、部署数量、利用率
        - 检验商业化主张能否规模化
        - 销售运营导出数据和现场走访
      - - 毛利率
        - BOM、服务人工、质保、良率和制造成本曲线
        - 决定规模化能否盈利
        - 销货成本模型和供应商发票
      - - 股权结构和优先权
        - 持股、清算优先权、反稀释、老股转让所得
        - 媒体口径投后估值可能不等于普通股价值
        - 由律师主导审阅融资文件
      - - 技术防御性
        - 模型 / 数据护城河、硬件可靠性、安全事故、正常运行时间
        - 需要用来解释为何能在拥挤赛道拿溢价
        - 架构审阅和现场日志
      - - 现金可支撑期和烧钱
        - 月度烧钱、已承诺资本开支、下一轮计划
        - 防止融资速度叙事掩盖融资风险
        - 董事会材料和现金预测
      - - 监管 / 安全
        - 认证、产品责任、事故响应
        - 影响客户采用和下行风险
        - 安全档案和保险审阅
      - - 可比对象桥接
        - 为什么 Simplexity 相比 UBTECH、Pony、WeRide、Mobileye 代理对象值得溢价
        - 倒逼明确估值逻辑
        - 用已验证指标搭建投委会可比模型
      - - 退出准备度
        - 审计准备度、治理、汇报节奏
        - 决定 IPO 或战略出售可选性
        - 审计师、法律和董事会流程审阅
    notes: 每一项都关系到价格、风险或退出；不能只因本轮超募就豁免。
    claimRefs:
      - CV028
      - CV039
      - CV040
      - CV041
      - CV045
