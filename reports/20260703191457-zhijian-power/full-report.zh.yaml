      - number: '1.4'
        title: 里程碑、负面背景与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              公开时间线被压得很紧，也带有较强宣传属性：2025 年 7 月完成法律设立；数周内据报推进原型 / 产品；2026 年 3 月宣布融资；随后英文报道将其包装为高速成长的具身 AI 独角兽；2026 年 4
              月在浙江 / 杭州生态中获得认可。已审阅页面里最重要的负面证据不是公司特定制裁或诉讼，而是行业层面对具身智能估值、商业化和真实需求风险的怀疑。NBD 称该行业仍处早期，缺少类似 ChatGPT
              的已验证范式，并暴露在 FOMO 驱动的估值之下；NetEase 也指出更广泛人形 / 具身机器人热潮中的技术瓶颈、伪需求和盈利担忧。监管尽调在公开检索中也不完整：已审阅国家级和 CreditChina
              门户，但静态抓取输出未捕捉到直接面向该公司的官方结果。因此，本章可以核验身份、团队、融资和据报产品阶段里程碑，同时保留经审计财务、签约客户、员工基础、股权结构和官方负面记录检索等缺口。
