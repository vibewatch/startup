- id: TI006
  title: Public Financial Gaps Table
  columns:
  - Missing metric
  - Current public status
  - Impact
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Not disclosed
    - Cannot size traction or valuation multiple
    - Request monthly recognized revenue, ARR bridge if applicable, and revenue by customer/product
  - - Pricing and contract terms
    - Not disclosed
    - Cannot assess revenue quality or discounting
    - Review master service agreements, quotes, POs, and revenue-recognition memo
  - - Gross margin and COGS
    - Not disclosed
    - Cannot determine scalability
    - Request product-line P&L, BOM, labor, warranty, compute, and support cost
  - - Burn and runway
    - Not disclosed
    - Cannot judge capital adequacy despite large funding
    - Review latest cash, 13-week cash flow, budget, and board plan
  - - Paid customer count and concentration
    - Not disclosed
    - Cannot assess GTM quality or counterparty risk
    - Request customer list, signed ARR/order backlog, cohort conversion, and top-10 concentration
  - - Debt-like obligations
    - Not disclosed
    - Cannot identify downside claims on cash or assets
    - Review debt, leases, supplier financing, customer advances, grants, and guarantees
  notes: Every gap maps to a public null that should remain null in the model until management provides private evidence.
