  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue and ARR
    missingEvidence: Monthly recognized revenue, ARR bridge if applicable, customer-by-customer contract values, and deferred revenue.
    whyItMatters: Without revenue denominators, the reported unicorn valuation cannot be converted into a defensible multiple.
    diligencePath: Request management accounts, contract schedules, revenue-recognition policy, and latest board KPI pack.
    relatedQuestionRefs:
    - QI008
    - QI024
    relatedTableRefs:
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: unit economics and gross margin
    missingEvidence: Robot BOM, manufacturing yield, service cost, warranty reserve, software attach, compute cost, and gross margin by product.
    whyItMatters: Robotics comps show revenue can coexist with losses; Simplexity needs company-specific margin proof.
    diligencePath: Review product-line P&Ls, build records, supplier contracts, service logs, and deployment cohort economics.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: cash burn and runway
    missingEvidence: Cash balance, monthly burn, capex, inventory purchases, debt, leases, and board-approved runway plan.
    whyItMatters: CNY2B of reported funding is not equivalent to runway without cash consumption and obligations.
    diligencePath: Request 13-week cash flow, latest cash reconciliation, budget-to-actuals, and all financing agreements.
    relatedQuestionRefs:
    - QI012
    - QI021
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer concentration and paid conversion
    missingEvidence: Named customers, paid PoC conversion, order backlog, utilization, top-customer concentration, renewal terms, and churn.
    whyItMatters: Comparable filings show customer concentration can be material, while Simplexity does not disclose its customer base.
    diligencePath: Review CRM export, signed POs/MSAs, deployment logs, and top-10 customer revenue concentration.
    relatedQuestionRefs:
    - QI014
    - QI022
    relatedTableRefs:
    - TI006
  - type: conflicting-data
    severity: minor
    topic: reported investor and funding details
    missingEvidence: Primary cap table, exact round dates, primary versus secondary split, liquidation preferences, and whether all reported financing was received in cash.
    whyItMatters: News sources agree on headline funding but not enough detail to model dilution, cash receipts, or investor protections.
    diligencePath: Request closing binders, cap table, shareholder register, SAFE/convertible instruments, and side-letter summary.
    relatedQuestionRefs:
    - QI005
    - QI007
    relatedTableRefs:
    - TI004
