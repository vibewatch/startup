- id: TI004
  title: Capital Adequacy Table
  columns:
  - Capital item
  - Public value/status
  - Source basis
  - Underwriting read
  - Diligence ask
  rows:
  - - Total reported financing
    - ~CNY2.0B / ~USD289M
    - Independent funding reports
    - Large headline cushion for a 2025-founded company
    - Confirm primary vs secondary, cash received, and post-money cap table
  - - Reported valuation
    - '>USD1.0B'
    - Independent funding reports
    - Unicorn status but no public revenue denominator
    - Provide valuation terms, liquidation preferences, and latest share price
  - - Cash on hand
    - 'null'
    - No public disclosure
    - Cannot calculate runway
    - Provide latest cash, restricted cash, and monthly close package
  - - Monthly burn
    - 'null'
    - No public disclosure
    - Cannot test capital sufficiency
    - Provide operating burn, capex, compute spend, and inventory purchases
  - - Runway months
    - 'null'
    - No public disclosure
    - Financing amount alone is not runway
    - Provide base/downside runway and board-approved spending plan
  - - Debt / project finance
    - No public obligation identified
    - Retained public sources
    - Absence of evidence is not proof of no debt
    - Provide bank debt, leases, supplier credit, customer prepayments, and guarantees
  - - Next-round trigger
    - Likely deployment and margin proof
    - Inferred from use of funds and robotics comps
    - More hardware/R&D weighted than SaaS ARR
    - Define milestones needed before next financing
  notes: Capital adequacy separates reported financing facts from unsupported cash, burn, runway, and obligation assumptions.
