- id: TI005
  title: Comparable Public Financials Table
  columns:
  - Comparable
  - Relevant disclosed metric
  - Why included
  - Simplexity read-through
  - Limit
  rows:
  - - Pony AI
    - 2025 revenue US$90.0M, up 20.0% YoY
    - Autonomous-driving commercialization filing comp
    - Shows technical autonomy revenue can scale gradually
    - Different product, public-company stage, and fleet mix
  - - WeRide
    - 2025 revenue RMB684.6M, gross profit RMB4.9M, net loss RMB1.25B
    - Robotaxi/robobus/autonomy filing comp
    - Shows revenue can coexist with near-zero gross profit and large losses
    - Not a humanoid robot company
  - - Mobileye
    - 2025 China shipment destination share 23%; net loss US$392M
    - Automotive autonomy supplier comp
    - Shows geography and OEM concentration can matter
    - Mature public supplier, not a startup
  - - UBTECH
    - 2024 revenue about RMB1.305B and net loss about RMB1.160B
    - Public humanoid/robotics comp
    - Shows humanoid robotics revenue does not guarantee profit
    - Different product mix and public stage
  - - Horizon Robotics
    - 2024 revenue RMB2.384B; non-IFRS net loss RMB1.681B; largest customer 31.5%
    - China AI/autonomy chip/software comp
    - Frames customer concentration and R&D loss risk
    - Chip/platform mix differs from Simplexity
  - - TrendForce Unitree benchmark
    - Unitree/Agibot expected high output share; Unitree gross margin cited near 60%
    - Positive sector benchmark
    - Shows margin-positive robotics is possible for leaders
    - Not evidence Simplexity has similar margin
  notes: These are filing or analyst comparables only; none is used as a Simplexity revenue, margin, or burn fact.
