  rows:
  - - Robot hardware sales
    - Self-developed robot bodies for enterprise deployments
    - Robot / fleet / deployment
    - Preqin describes direct hardware sales; no company revenue disclosed
    - Medium
    - Provide robot ASP, shipped units, recognized revenue, COGS, warranty, and return policy
  - - Supporting software models
    - LaST/ManualVLA-style model capability attached to robot deployments
    - License, subscription, or bundled software
    - Official technology surface exists; packaging and pricing unknown
    - Low
    - Disclose whether software is separately priced, usage based, bundled, or service-led
  - - Autonomous-driving system solutions
    - Enterprise solutions tied to autonomy expertise and robotic systems
    - Project / solution contract
    - Preqin describes this stream; no customer contracts public
    - Low
    - Provide signed contracts, milestones, revenue recognition policy, and gross margin
  - - PoC / pilot services
    - Closed-scenario validation in factories, supermarkets, logistics
    - Pilot fee or unpaid validation
    - PoCs reported, paid status unknown
    - Low
    - Separate paid pilots from unpaid trials and disclose conversion rate
  - - Data and model improvement loop
    - Human/robot data collection used to improve embodied models
    - Internal capability, possible service component
    - Use of funds includes data collection; monetization not disclosed
    - Low
    - Quantify data-collection cost per task and whether customers pay for customization
  - - After-sales support and integration
    - Deployment, maintenance, safety support, and site integration
    - Service fee / warranty / bundled support
    - No support pricing disclosed
    - Low
    - Provide service attach, field-labor hours, SLA terms, and warranty reserve
