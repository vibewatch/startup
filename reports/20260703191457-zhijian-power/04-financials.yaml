- id: unit-economics-cost-structure-and-comparable-filings
  title: Unit Economics, Cost Structure, and Comparable Filings
  body: 'Simplexity does not disclose the unit-economics inputs that would normally anchor a financial model: robot bill of materials, manufacturing yield, software attach, field-service labor, warranty rates, support intensity, gross margin, or payback. The best public evidence is therefore indirect. Reported use of funds is concentrated in foundation-model training, robot body R&D and iteration, data collection, and core algorithms, which points to a cost base that spans compute, robotics engineering, data operations, prototype manufacturing, and field validation. That profile is fundamentally different from a pure software company and makes unsupported SaaS margin assumptions inappropriate.


    Public filings of comparable autonomy and humanoid-robotics companies show why caution is necessary. WeRide reported 2025 revenue of RMB684.6 million but only RMB4.9 million of gross profit and a RMB1.25 billion net loss. UBTECH reported more than RMB1.3 billion of 2024 revenue but remained loss-making. Horizon reported more than RMB2.38 billion of 2024 revenue and a large non-IFRS net loss. Pony AI scaled 2025 revenue to US$90 million, but its filing record still reflects the long path from technical commercialization to durable profitability. These filings are not Simplexity facts; they are guardrails showing that robotics revenue can coexist with heavy losses, customer concentration, and working-capital pressure.'
