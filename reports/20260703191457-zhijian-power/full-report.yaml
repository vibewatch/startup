      - number: '7.3'
        title: Operational, manufacturing, and safety risk
        blocks:
          - type: paragraph
            body: >-
              The operating thesis relies on developing hardware, embedded systems, perception, controls, model
              optimization, data operations, and on-device learning in parallel. That is powerful if execution is
              coordinated, but it is a failure-amplifier if product maturity lags fundraising expectations. Small-batch
              bodies and PoC validation do not by themselves prove factory-grade reliability, maintainability, or safe
              human-robot interaction. Workplace robotics guidance and product-liability principles make the required
              diligence concrete: investors should ask for hazard analyses, site acceptance tests, emergency-stop
              design, maintenance procedures, incident logs, cyber-hardening evidence, and insurance. The strongest
              current mitigation is a team with autonomous-driving scaling experience; the residual risk is that
              autonomous-driving data loops are not automatically transferable to warehouses, factories, supermarkets,
              or homes, where manipulation and human proximity are less structured.
