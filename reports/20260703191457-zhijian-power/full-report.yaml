      - number: '6.4'
        title: Procurement Friction and Adverse Context
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Zhijian lacks ambition; it is that commercialization claims in humanoid and
              embodied robotics are easy to overstate before customers sign, deploy, and renew. OSHA notes that robot
              accidents often occur during programming, maintenance, testing, setup, or adjustment, and ISO 10218-1:2025
              underscores the need for machine-level safety requirements. Those constraints matter for factories,
              supermarkets, and logistics sites because the buyer must validate human-robot interaction, integration
              with existing workflows, data collection permissions, service response, and liability before moving beyond
              PoC. Broader China market commentary adds caution: France 24 and The Business Times report official
              warnings about bubble risk, immaturity in technology and commercialization, and more than 150 humanoid
              robot makers. In that context, unnamed cooperation should be underwritten conservatively. The next
              diligence step is a customer evidence pack: signed customers, paid-vs-free status, deployment locations,
              uptime and safety acceptance, utilization, pilot conversion, repeat purchase, and revenue concentration.
