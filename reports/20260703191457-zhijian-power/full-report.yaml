      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is operational rather than purely technical. In e-commerce fulfillment and 3PL, the economic
              buyer is the VP of logistics or warehouse operations, the day-to-day users are pickers, supervisors, and
              automation engineers, and the payer is the logistics business unit or capex committee. In manufacturing
              intralogistics, plant operations and industrial-engineering teams drive the purchase, while IT and
              automation teams integrate robots into MES, WMS, safety, and facility controls. Retail and supermarket
              workflows add store operations and loss-prevention stakeholders; service scenarios add facilities or
              branch operations. JD’s Zhilang evidence shows why buyers care: published claims include more than 3x
              picking efficiency, 2.5x storage density, a shorter payback period, and nearly 100 robots in one Beijing
              park. Geekplus evidence shows the incumbent benchmark: large AMR providers sell to e-commerce, 3PL,
              apparel, healthcare, groceries, automotive, cold chain, and other high-throughput environments. Simplexity
              must either outperform on flexible manipulation and generalization or find workflows where incumbents lack
              capability.
