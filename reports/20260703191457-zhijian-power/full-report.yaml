        title: Customer Segmentation and Intended Demand
        blocks:
          - type: paragraph
            body: >-
              The public customer file points to intended B-end closed-environment buyers rather than a proven roster of
              paying users. Zhijian Power's own site frames the company as building high-user-value
              embodied-intelligence products from real scenarios, while Chinese coverage repeatedly narrows the first
              commercial targets to factory workshops, supermarket or retail shelf operations, and logistics or
              warehouse sorting. The likely economic buyer is therefore an operations, automation,
              manufacturing-engineering, or innovation leader who controls site productivity budgets; the day-to-day
              user would be a line, warehouse, or store operations team; and the payer would be the enterprise operating
              the site. Geography is also China-centered in the public record: Beijing, Shanghai, and Suzhou are cited
              as strategic locations, with the Suzhou global innovation center positioned as the physical bridge between
              R&D, manufacturing, and applications. This segmentation is useful, but it is not the same as customer
              proof. No reviewed company, media, or partner source discloses a named paying customer, active site count,
