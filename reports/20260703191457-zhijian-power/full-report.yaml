        title: Founder and execution concentration
        blocks:
          - type: paragraph
            body: >-
              Founder quality is a strength and a risk. Public reporting consistently ties the investment case to former
              Li Auto leaders and the transfer of autonomous-driving methods into robots. That supports credibility on
              system integration and data loops, but it also concentrates the thesis around a small number of
              individuals and a still-unproven analogy between cars and general-purpose robots. The company’s own
              recruiting surface confirms that the buildout spans many scarce functions, from industrial design and
              mechanical engineering to VLA algorithms, SLAM, data operations, and embedded systems. Diligence should
              therefore require succession planning, role clarity, independent safety ownership, manufacturing
              leadership depth, and evidence that decisions are not bottlenecked around a few founders. Founder
              departure or inability to recruit senior production and safety leaders should be treated as a thesis-break
              event.
