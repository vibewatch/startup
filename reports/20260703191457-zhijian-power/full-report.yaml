  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Embodied-Intelligence Robots for Controlled Work'
        blocks:
          - type: paragraph
            body: >-
              Simplexity Robotics should not be sized as a generic AI company, an EV autonomy vendor, or a broad
              consumer humanoid option. The evidence points to an embodied-intelligence robot company using
              autonomous-driving stack methods, with initial deployment framed around closed or semi-closed factory,
              supermarket, and logistics workflows. Included spend therefore covers robot bodies, manipulation or
              mobility modules, fleet orchestration, robot skill/data iteration, deployment integration, maintenance,
              and outcome-linked service models for controlled work cells and intralogistics paths. Excluded spend
              includes consumer chatbot AI, generic cloud model training, broad EV software, standalone WMS licenses,
              and commodity automation that does not embody mobile or manipulative autonomy. The status quo is also
              broad: manual labor, conveyors, AGVs, fixed automation, forklifts, outsourced 3PL processes, and internal
              automation teams already solve parts of the job. This boundary explains why the user background mentions
              intelligent driving: public reporting links the founding team to Li Auto autonomous-driving and VLA work,
              but the investable market is robot deployment in physical operations, not cars.
            claimRefs:
