  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      The supported workflow is a staged closed-scenario PoC loop with data collection, model adaptation, and
      verification gates.
    data:
      nodes:
        - id: scenario-select
          label: Select closed scenario
        - id: body-deploy
          label: Deploy robot body / PoC
        - id: collect
          label: Collect real-task data
        - id: train-test
          label: Train, test, and verify on or near the body
        - id: human-loop
          label: Human guidance for difficult/failure cases
        - id: iterate
          label: Iterate model and body
        - id: expand
          label: Move toward semi-open / open scenarios
      edges:
        - from: scenario-select
