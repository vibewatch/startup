    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and framing
        blocks:
          - type: paragraph
            body: >-
              The investable entity for this chapter is 杭州至简动力科技有限公司, which also appears publicly as 至简动力, Zhijian
              Power, and Simplexity Robotics. Its official website describes the business as “Simplexity Robotics,”
              founded in late July 2025, and focused on full-scenario embodied robots built from a unified model, data
              loop, and robot hardware. Registry-oriented sources sharpen that into a legal fact set: AiQicha lists the
              company as established on 2025-07-31, located in Yuhang District, Hangzhou, with Jia Peng as legal
              representative and an operating scope that spans AI software, intelligent robot R&D and sales,
              industrial/service robot manufacturing, and related data-processing and system-integration services. That
              supports a robotics/embodied-AI framing today. The nuance is important: the team’s credibility comes from
              intelligent-driving and autonomous-systems experience at Li Auto, but public articles frame the current
              company as applying VLA/world-model/autonomous-driving capabilities into robots, not as selling an
              intelligent-driving platform.
