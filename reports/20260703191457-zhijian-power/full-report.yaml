        title: 'Comparable evidence: market upside, but tougher disclosure standard'
        blocks:
          - type: paragraph
            body: >-
              The comp set argues for discipline. UBTECH, Baidu, Pony AI, WeRide, and Mobileye are not perfect matches,
              but each demonstrates what investable public evidence looks like: audited or exchange-filed financials,
              explicit revenue or operating metrics, risk factors, and ongoing disclosure. UBTECH shows that a humanoid
              robotics public comp can have RMB1.3 billion of revenue and still lose more than RMB1.1 billion in a year.
              Baidu and Mobileye show real operational scale and revenue but also remind investors that valuation marks
              reset when expectations change. Pony AI and WeRide filings show how AV-stack companies disclose risks
              before public-market access. Compared with those references, Simplexity’s reported US$1 billion-plus price
              is a private-market narrative mark unless private diligence fills the missing economics.
