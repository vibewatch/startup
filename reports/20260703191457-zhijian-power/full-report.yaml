            body: >-
              The public traction story is credible but incomplete. Reports say the company reached small-batch
              robot-body rollout and PoC validation quickly, and they describe a footprint across Hangzhou, Beijing,
              Shanghai, and Suzhou. These are important operating signals because they show more than a paper financing
              vehicle. However, none of the retained sources names paying customers, discloses the number of deployed
              robots, separates trials from paid contracts, publishes utilization, or shows revenue recognized from
              PoCs. That means the data cannot support claims about active customer count, revenue run rate, ARR, NRR,
              gross margin, or sales efficiency.


              The diligence posture should be explicit: public traction can justify continued research, but underwriting
              must wait for private evidence. The next data room should include monthly management accounts, recognized
              revenue by product and customer, deferred revenue, signed order backlog, deployment cohorts, robot-level
              COGS, service tickets, warranty reserve policy, compute and data-collection spend, and all debt-like
              obligations. Until those items are available, every revenue, margin, burn, and runway cell in a financial
              model should remain null rather than filled with sector averages.
