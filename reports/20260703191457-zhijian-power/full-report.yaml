      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              China does not yet have a single embodied-AI robot statute that cleanly answers all deployment questions.
              Instead, Simplexity must navigate overlapping obligations from generative-AI, deep-synthesis, algorithm,
              personal-information, data-security, cybersecurity-review, product-quality, tort, and export-control
              regimes. The highest-confidence obligations attach if the company exposes public generative-AI services,
              handles personal data from cameras or microphones, processes important operational data, or deploys
              networked robots in sensitive environments. Even where a rule is not yet directly triggered, it should
              shape the diligence package because a robot is both a physical product and an AI/data system. The legal
              risk is not merely fines; it is launch delay, forced model or data-process redesign, customer procurement
              friction, safety shutdowns, and restricted access to critical components.
            claimRefs:
