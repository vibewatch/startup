  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The risk stack is dominated by the gap between a large 2026 financing narrative and proof that robots can
              operate safely, reliably, and commercially in real customer sites. Public sources support that Simplexity
              is technically ambitious, recently formed, well-funded, and led by former Li Auto autonomous-driving
              executives, but they do not yet establish named production customers, retention, safety certifications,
              incident history, or unit economics. That creates a high-residual commercialization and burn risk: the
              company may have enough capital to pursue model, body, and data-loop development, yet still need
              conversion evidence before the valuation is investable. The top legal and operating risks should therefore
              be monitored together rather than as separate silos: safety incidents can trigger product-liability
              claims; data collection can trigger privacy or cybersecurity obligations; compute controls can slow model
              iteration; and missing customer proof can transmit directly into down-round or bridge-risk pressure.
            claimRefs:
