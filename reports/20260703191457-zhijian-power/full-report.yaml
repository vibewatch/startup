        title: Product Definition and Maturity
        blocks:
          - type: paragraph
            body: >
              Zhijian Power should be read as an embodied-intelligence robot company trying to convert
              autonomous-driving methods into robots for physical work. The official site says the company was founded
              in late July 2025 and is building products from real scenarios by combining a high-ceiling unified model,
              an efficient data closed loop, and reliable robot hardware; it markets the product surface as
              "full-scenario embodied robots" rather than a named commercial SKU. Third-party coverage adds the maturity
              boundary: Yicai reported that the first-generation robot had been produced in small batches and that
              proof-of-concept testing had started, while 36Kr EU said two generations of bodies for B-end and C-end
              users had been developed, small-batch production had been achieved, and PoC verification had fully
              launched. That is meaningful prototype evidence, but it is not the same as certified, repeatable,
              customer-accepted deployment. The safest formulation is therefore product-in-development with PoC activity
