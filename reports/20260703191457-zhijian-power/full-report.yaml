      - number: '1.2'
        title: Leadership, founder-market fit, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The leadership narrative is unusually concentrated. Multiple independent reports identify Jia Peng as CEO,
              Wang Kai as chairman, and Wang Jiajia as COO, all coming from Li Auto’s intelligent-driving organization.
              Public reporting credits Jia with Li Auto intelligent-driving R&D, IBM high-performance computing, and
              Nvidia autonomous-driving architecture exposure; Wang Kai with Li Auto CTO responsibilities and earlier
              Visteon autonomous-driving architecture experience; and Wang Jiajia with intelligent-driving
              mass-production responsibilities. This gives the company credible founder-market fit for a robotics stack
              that borrows perception, VLA, data-loop, and production discipline from autonomous driving. It also
              creates a key-person and governance diligence burden: AiQicha lists a broader board/director roster, while
              Baidu Baike and third-party registries report founder and institutional shareholder signals, but reviewed
              sources do not provide signed cap-table documents, board observer rights, veto rights, or employment
              lockups. Later chapters should treat the Li Auto alumni thesis as a strength and a dependency, not as
              proof of durable organization depth.
