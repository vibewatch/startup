      - number: '3.4'
        title: Moat Durability, Pricing Pressure, Lock-In, and Commoditization Risk
        blocks:
          - type: paragraph
            body: >-
              The biggest adverse signal is that the Chinese humanoid market is already moving from demonstration toward
              production scale and price segmentation. TrendForce expects China humanoid output to grow sharply in 2026
              and projects Unitree plus AgiBot at nearly 80% of shipments, while DirectIndustry cautions that many
              public robot videos are demos rather than durable production proof and still reports only thousands of
              units for 2025 leaders. That combination is dangerous for Simplexity: high-end model claims may matter,
              but hardware price floors, supply-chain capacity, and deployment references can commoditize early features
              before a late entrant builds buyer lock-in. Public pricing is also asymmetric. Unitree publishes concrete
              entry prices, while Simplexity, AgiBot, Galbot, and UBTECH’s enterprise humanoid economics remain mostly
              unknown or sales-led. Unknown pricing should stay unknown rather than be inferred. Simplexity’s
              defensibility therefore depends on proving that its unified VLA/world-model, on-device training, and
              hardware architecture produce measurable task learning, uptime, and data-loop advantages that outweigh
              cheaper robot bodies, larger peer fleets, or AV-stack distribution power.
