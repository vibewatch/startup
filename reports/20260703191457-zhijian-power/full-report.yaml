      - number: '3.3'
        title: 'Adjacent AV-Stack Pressure: Data, Safety, OEM Channels, and Physical-AI Talent'
        blocks:
          - type: paragraph
            body: >-
              The autonomous-driving stack companies should not be mislabeled as direct humanoid competitors, but they
              are still strategically important. Horizon has public filings and official pages showing mass-production
              design wins, Journey-series shipments, OEM relationships, and 2024 revenue, which are assets that
              embodied-robotics startups would like to borrow: safety engineering, edge inference, perception stacks,
              and automotive-grade supply chains. Pony.ai and WeRide have public investor materials around robotaxi,
              robotruck, licensing, multi-country operations, and permits; those are not humanoid deployments, but they
              demonstrate fleet operations, regulatory navigation, and physical-world AI commercialization. Baidu Apollo
              and Mobileye add platform and ADAS distribution depth. Gasgoo’s reporting on auto executives moving into
              embodied intelligence is especially relevant because it shows the talent and capital bridge between AV and
              robotics, including Simplexity’s own Li Auto founder lineage. In underwriting terms, AV incumbents are a
              second-order competitive threat: they may not beat Simplexity to a robot prototype, but they can shape
              standards, absorb talent, and partner with OEMs or factories before a young robot startup proves lock-in.
