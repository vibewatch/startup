        title: Milestones, adverse context, and open diligence
        blocks:
          - type: paragraph
            body: >-
              The public chronology is compressed and publicity-heavy: legal formation in July 2025; reported
              prototype/product progress within weeks; a March 2026 financing announcement; follow-on English-language
              coverage framing the company as a fast embodied-AI unicorn; and April 2026 ecosystem recognition in
