      - number: '2.5'
        title: Constraints, Contradictions, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The adoption constraint set is material. Public market estimates are directionally positive but use
              incompatible boundaries; analyst sources mix warehouse automation, warehouse robotics, logistics robots,
              and sometimes broader service robotics. Incumbents already have deployed fleets, customer proof, and
              specialized workflows, so Simplexity cannot assume that an embodied-AI narrative automatically converts to
              SOM. Technical risks remain: public reporting highlights high training difficulty, compute consumption,
              data demand, and the harder randomness of robot work compared with driving. Regulatory and geopolitical
              constraints also matter because embodied-AI models touch data governance and advanced-computing supply.
              Most importantly, no public source reviewed discloses Simplexity’s paid customer count, price, payback,
              pipeline conversion, uptime, gross margin, or support cost. The market is attractive, but the investable
              question is whether Simplexity can turn policy-enabled pilots into repeatable paid deployments before
              incumbents absorb the flexible-automation use cases.
