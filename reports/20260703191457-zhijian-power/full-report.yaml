    title: Product Module / Asset Matrix
    columns:
      - Module / asset
      - User or operator problem
      - Public status / maturity
      - Differentiation signal
      - Diligence gap
    rows:
      - - Full-scenario embodied robot body
        - Buyers need robots that can operate in physical workflows, not only demos.
        - >-
          Officially announced as forthcoming; media reports say first-generation robot small-batch output and PoC
          started.
        - Model-defined general body and software/hardware co-design are the stated thesis.
        - No public payload, mobility, actuator, endurance, sensor, safety, or cost specifications.
      - - World-model + VLA foundation model
        - Robots need language, vision, spatial, and state understanding for task execution.
        - Officially claimed as self-developed and unified through a Transformer.
        - Single architecture is intended to reduce hand-designed modules and improve scaling.
        - No public production benchmark, model size, data scale, latency, or safety envelope.
      - - On-device learning/data loop
        - New scenes require adaptation without slow centralized retraining cycles.
        - Officially described as on-device deployment, real-time inference/training, and efficient online learning.
        - Autonomous-driving shadow-mode analogy suggests fleet data-loop discipline.
        - No public proof of safe online updates, rollback, privacy controls, or edge-compute limits.
      - - LaST0 base-model research
        - VLA manipulation needs fast reaction plus slower physical reasoning.
        - arXiv/project-page evidence; co-affiliation includes Simplexity Robotics.
        - Latent spatio-temporal CoT and fast/slow MoT experts address latency and dynamics.
        - Relationship between paper experiments and commercial robot stack is not disclosed.
      - - ManualVLA long-horizon task model
        - Long-horizon assembly/rearrangement needs procedural planning and precise control.
        - arXiv/PDF/project evidence; Peng Jia is affiliated with Simplexity Robotics in the paper.
        - Planning expert generates multimodal manuals that condition action execution.
        - No public customer workflow showing ManualVLA inside Zhijian robots.
      - - TwinRL post-training framework
        - Real-world robot RL is slow, costly, and safety-constrained.
        - arXiv/PDF/GitHub evidence with public repository and dataset guide.
        - Digital twins expand exploration and guide human-in-the-loop real robot rollouts.
        - Public code/data signal does not prove production deployment or fleet reliability.
