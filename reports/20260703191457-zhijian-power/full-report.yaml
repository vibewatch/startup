  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Embodied-Robotics Peers Versus AV-Stack Adjacent Competitors'
        blocks:
          - type: paragraph
            body: >-
              The cleanest competitor framing separates direct embodied-robotics peers from autonomous-driving-stack
              incumbents and adjacencies. Direct peers include AgiBot, Unitree, UBTECH, Galbot, and the long tail of
              Chinese humanoid and embodied-AI startups because they sell or are commercializing physical robots, robot
              bodies, robot developer platforms, or task robots for factories, retail, logistics, education, and service
              settings. Simplexity is in the same broad job-to-be-done because its official page describes a
              full-scenario embodied robot company built around one foundation model, data-loop efficiency, and reliable
              robot hardware. Adjacent competitors such as Momenta, DeepRoute.ai, Horizon Robotics, Baidu Apollo,
              Pony.ai, WeRide, Mobileye, and AutoX are different: they are primarily autonomous-driving software, chip,
              robotaxi, or ADAS stacks. They do not replace a humanoid robot SKU one-for-one, but they compete for
              talent, capital, training data, OEM trust, safety cases, and world-model credibility. That distinction
              matters because Simplexity can lose a direct robot sale to a lower-priced or more deployed humanoid, while
              it can also lose strategic relevance if AV-stack players convert fleet-scale physical-AI assets into robot
              platforms.
