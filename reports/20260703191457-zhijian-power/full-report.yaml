      - number: '7.6'
        title: Monitoring plan and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The monitoring plan should convert uncertainty into explicit triggers. Regulatory diligence should confirm
              whether any product surface creates a public generative-AI service, algorithm-filing duty,
              personal-information processing, important-data issue, export-control issue, or safety certification
              requirement. Commercial diligence should demand a customer pipeline with names, contract status,
              deployment stage, revenue, safety sign-off, renewal intent, and concentration by counterparty. Operational
              diligence should require BOM, compute redundancy, supplier qualification, quality escapes, incident
              response, and field reliability metrics. Financial diligence should link burn to milestone evidence rather
              than to headline capital raised. If the company cannot provide credible data in these areas, the right
              action is to mark the opportunity research-more or track, not to underwrite a valuation built on private
              capital momentum alone.
