        title: Revenue Model and Pricing Visibility
        blocks:
          - type: paragraph
            body: >-
              Simplexity's public financial file supports a hybrid enterprise-robotics revenue thesis, not a finished
              revenue model. The company website establishes a newly founded embodied-intelligence company building
              model, data-loop, and robot-hardware capabilities, while Preqin is the only retained source that
              explicitly describes revenue coming from direct sales of robotic hardware, supporting software models, and
              autonomous-driving-system solutions to enterprise clients. That is directionally plausible for a
              full-stack robotics company, but it is not the same as company-disclosed revenue mix. No reviewed official
              page publishes SKUs, robot ASP, software license fees, service rates, pilots-to-paid conversion,
              discounts, or contract duration.


              The financial implication is that all price and revenue-quality analysis must remain conditional. Reported
              closed-scenario targets such as factories, supermarkets, and logistics suggest B2B deployment rather than
              consumer hardware scale, and early PoC validation is a useful traction marker. It still cannot be counted
              as recurring revenue without signed contract values, paid deployments, utilization, renewal rights, and
              implementation cost. The chapter therefore treats hardware, software, and solution delivery as supportable
              revenue streams, but uses nulls for ARR, current revenue, realized pricing, gross margin, CAC, and
              payback.
