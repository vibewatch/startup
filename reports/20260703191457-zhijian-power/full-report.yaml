      - number: '8.3'
        title: Bull, base, and bear cases without invented private metrics
        blocks:
          - type: paragraph
            body: >-
              The scenario analysis uses explicit evidence conditions rather than fabricated revenue or return math. In
              the bull case, private diligence proves that enterprise pilots have converted into recurring paid
              deployments, manufacturing yield is improving, data and model advantages are defensible, and cap-table
              terms do not transfer too much downside to new common-equity exposure. In the base case, the public record
              remains the evidence set: it proves funding momentum and category heat but leaves the price unsupported.
              In the bear case, regulatory concern, crowded supply, homogeneous products, or failed PoC conversion push
              the company into a down-round, insider bridge, or strategic-sale process before revenue quality is
              visible. The range is therefore not a forecasted return range; it is a supportability range showing how
              much private evidence must arrive before the reported valuation can be treated as fair.
