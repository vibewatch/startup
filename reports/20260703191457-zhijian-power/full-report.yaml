      - number: '7.4'
        title: Chip, partner, and customer dependencies
        blocks:
          - type: paragraph
            body: >-
              The dependency map has four critical nodes: frontier or edge compute, strategic investors and ecosystem
              partners, deployment customers, and regulators. Simplexity’s on-device training and VLA/world-model
              approach makes compute and hardware supply especially important, while U.S. export-control and
              connected-vehicle supply-chain actions show that autonomous-system hardware and software can become policy
              targets. Strategic investors can reduce go-to-market and infrastructure friction, but undisclosed
              commercial terms can also create concentration or conflict risk. Customer dependence is currently a
              different problem: public evidence is too thin to know whether there are named production deployments at
              all. The diligence objective should be to separate demos, PoCs, paid pilots, repeat orders, and production
              rollouts, then map which partner, supplier, or regulator could block each stage.
