  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Verdict: research more at an expensive price'
        blocks:
          - type: paragraph
            body: >-
              The public record supports a serious company, but it does not support underwriting the reported post-money
              valuation above US$1 billion as a buyable entry price. The positive facts are real: multiple independent
              reports say Zhijian Power / Simplexity Robotics raised RMB2.0 billion in five rounds within roughly six
              months, attracted elite financial and strategic investors, and is targeting embodied-AI robotics with
              enterprise use cases. The blocking problem is not narrative quality; it is the lack of public revenue,
              named-customer, unit-cost, gross-margin, cap-table, and preference evidence. Therefore the chapter
              recommendation is research-more, confidence is medium-low, risk rating is high, and valuation stance is
              expensive. A buyer should not invent ARR, returns, or customer economics to rationalize the headline mark;
              it should demand private evidence or change price and structure.
            claimRefs:
