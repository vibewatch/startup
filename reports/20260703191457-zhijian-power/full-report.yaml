      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Simplexity has unusually strong early sponsorship in a category with credible long-term
              demand. The company appears to have raised enough capital to train foundation models, develop hardware and
              algorithms, and pursue controlled enterprise deployments before broader consumer or open-environment use.
              Market-data sources also support rising shipment expectations and faster commercialization in China. The
              anti-thesis is equally forceful: public materials do not quantify revenue, customer concentration, signed
              deployments, margins, burn, or round terms, while adverse reporting says the humanoid-robotics market is
              crowded and vulnerable to overheating. On balance, the evidence supports keeping the company in diligence,
              not accepting the price. The view would change if management produced signed customer evidence, paid
              deployment conversion, gross-margin trajectory, and enforceable investor terms that explain why this
              company deserves a premium to better-disclosed public comps.
