        title: TAM/SAM/SOM Lenses and Why the Numbers Do Not Collapse to One TAM
        blocks:
          - type: paragraph
            body: >-
              The public data supports a layered sizing view. A global logistics-robots lens is the broadest ceiling,
              with Global Market Insights putting that market at USD 20.7 billion in 2026 and USD 91.4 billion by 2035.
              A narrower warehouse-robotics lens is smaller but closer to the initial buyer: Fortune Business Insights
              puts global warehouse robotics at USD 7.35 billion in 2026 and China warehouse robotics at USD 2.94
              billion in 2026. MarkNtel’s China warehouse automation estimate is adjacent rather than identical, but its
              USD 3.02 billion 2025 base and USD 9.17 billion 2032 forecast offer a China automation SAM proxy.
              Simplexity’s public SOM cannot be calculated because no paid deployments, pricing, customer count,
              revenue, or gross margin are disclosed. The right diligence posture is to treat China industrial-logistics
              robotics as the first wedge inside embodied intelligence, then require management to prove conversion from
              PoC to paid repeat deployments.
