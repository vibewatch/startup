company:
  name: Zhijian Power / 至简动力 / Simplexity Robotics
chapter:
  number: 1
  title: "Company Overview"
  summary: "至简动力（Simplexity Robotics） is best framed as an embodied-AI robotics startup: public sources repeatedly connect its Li Auto autonomous-driving/VLA pedigree to general robot products rather than a standalone intelligent-driving platform. The strongest verified facts are a July 31, 2025 Hangzhou registration, Jia Peng as legal representative/CEO, a former Li Auto leadership bench, five reported financing rounds totaling RMB 2 billion, and public gaps around revenue, customers, headcount, and formal regulatory search results."
sections:
  - id: "identity-and-framing"
    title: "Identity, legal footprint, and framing"
    body: |-
      The investable entity for this chapter is 杭州至简动力科技有限公司, which also appears publicly as 至简动力, Zhijian Power, and Simplexity Robotics. Its official website describes the business as “Simplexity Robotics,” founded in late July 2025, and focused on full-scenario embodied robots built from a unified model, data loop, and robot hardware. Registry-oriented sources sharpen that into a legal fact set: AiQicha lists the company as established on 2025-07-31, located in Yuhang District, Hangzhou, with Jia Peng as legal representative and an operating scope that spans AI software, intelligent robot R&D and sales, industrial/service robot manufacturing, and related data-processing and system-integration services. That supports a robotics/embodied-AI framing today. The nuance is important: the team’s credibility comes from intelligent-driving and autonomous-systems experience at Li Auto, but public articles frame the current company as applying VLA/world-model/autonomous-driving capabilities into robots, not as selling an intelligent-driving platform.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO046]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: "team-and-governance"
    title: "Leadership, founder-market fit, and governance signals"
    body: |-
      The leadership narrative is unusually concentrated. Multiple independent reports identify Jia Peng as CEO, Wang Kai as chairman, and Wang Jiajia as COO, all coming from Li Auto’s intelligent-driving organization. Public reporting credits Jia with Li Auto intelligent-driving R&D, IBM high-performance computing, and Nvidia autonomous-driving architecture exposure; Wang Kai with Li Auto CTO responsibilities and earlier Visteon autonomous-driving architecture experience; and Wang Jiajia with intelligent-driving mass-production responsibilities. This gives the company credible founder-market fit for a robotics stack that borrows perception, VLA, data-loop, and production discipline from autonomous driving. It also creates a key-person and governance diligence burden: AiQicha lists a broader board/director roster, while Baidu Baike and third-party registries report founder and institutional shareholder signals, but reviewed sources do not provide signed cap-table documents, board observer rights, veto rights, or employment lockups. Later chapters should treat the Li Auto alumni thesis as a strength and a dependency, not as proof of durable organization depth.
    claimRefs: [CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO002]
  - id: "funding-stage-and-scale"
    title: "Funding, stage, locations, and disclosed scale"
    body: |-
      Funding is the most consistently reported scale signal. Sina, Tencent News, 36Kr, Yicai Global, Gasgoo, Pandaily, Taibo, Pedaily, and other outlets report that 至简动力 announced five financing rounds in less than roughly six months, totaling RMB 2 billion. Investor lists recur across sources: Yuanjing/Vision Capital, Lanchi/BlueRun, Sequoia China/HongShan, Legend Capital, CAS Star, Gaorong, Tencent, and Alibaba. Yicai translates the raise to USD 289.3 million; 36Kr and Baidu Baike report valuation crossing USD 1 billion, making the company a private unicorn. Product-stage facts are less mature but directionally consistent: reports cite first-generation hardware in under 45 days, two generations of robot bodies, small-batch offline production, and PoC verification for factories, supermarkets, logistics, and other B-end closed scenarios. Beijing, Shanghai, and Suzhou appear as strategic locations beyond Hangzhou, with Suzhou described as a global innovation center. No reviewed public source discloses revenue, customer count, or headcount; these remain explicit cover-metric gaps rather than zeroes.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO036, CO037, CO038]
    tableRefs: [TO003, TO004]
    figureRefs: [FO001, FO003]
  - id: "milestones-risk-and-open-diligence"
    title: "Milestones, adverse context, and open diligence"
    body: |-
      The public chronology is compressed and publicity-heavy: legal formation in July 2025; reported prototype/product progress within weeks; a March 2026 financing announcement; follow-on English-language coverage framing the company as a fast embodied-AI unicorn; and April 2026 ecosystem recognition in Zhejiang/Hangzhou. The most material adverse evidence is not a company-specific sanction or lawsuit in the reviewed pages; it is industry-level skepticism around embodied-intelligence valuation, commercialization, and real-demand risk. NBD describes the sector as early, lacking a ChatGPT-like validated paradigm, and exposed to FOMO-driven valuation; NetEase similarly flags technical bottlenecks, pseudo-demand, and profitability concerns in the broader humanoid/embodied-robotics boom. Regulatory diligence is also incomplete from public retrieval: national and CreditChina portals were reviewed, but the direct company-specific official result was not captured in static fetch output. Therefore, the chapter can verify identity, team, financing, and reported product-stage milestones, while carrying open gaps for audited financials, signed customers, employee base, cap table, and official negative-record searches.
    claimRefs: [CO039, CO040, CO041, CO042, CO043, CO044, CO045, CO047, CO048]
    tableRefs: [TO005]
