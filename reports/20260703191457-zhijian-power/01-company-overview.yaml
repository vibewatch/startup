  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-gap
      missingEvidence: "Audited or management-verified revenue, ARR, revenue run-rate, gross margin, and order backlog."
      whyItMatters: "The current valuation narrative is funding-led; revenue evidence is required to separate customer traction from investor option value."
      diligencePath: "Request monthly revenue cohort by product and customer, contracts, invoices, bank receipts, tax filings, and recognition policy."
      relatedQuestionRefs: [QO015, QO025]
      relatedTableRefs: [TO001, TO005]
    - type: missing-source
      severity: material
      topic: customer-gap
      missingEvidence: "Named paid customers, signed PoCs, deployment logs, renewal/expansion terms, and referenceable buyers."
      whyItMatters: "Factory, supermarket, and logistics target scenes do not prove product-market fit without paying deployments."
      diligencePath: "Obtain customer contract schedule, site list, SOWs, acceptance reports, and at least five reference calls."
      relatedQuestionRefs: [QO016, QO025]
      relatedTableRefs: [TO001, TO005]
    - type: missing-source
      severity: material
      topic: headcount-gap
      missingEvidence: "Employee count, contractor count, hiring plan, attrition, compensation burn, and functional org chart."
      whyItMatters: "Execution claims rely on a very young organization; team scale and retention determine delivery risk."
      diligencePath: "Request payroll roster, social-insurance filings, offer pipeline, attrition since founding, and founder time allocation."
      relatedQuestionRefs: [QO017, QO025]
      relatedTableRefs: [TO001, TO005]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Signed capitalization table, shareholder agreements, articles, option plan, side letters, board minutes, and veto rights."
      whyItMatters: "Public investor names do not reveal control, liquidation preferences, dilution, or conflict rights."
      diligencePath: "Run legal diligence on financing documents and reconcile against registry shareholder snapshots."
      relatedQuestionRefs: [QO007, QO011, QO025]
      relatedTableRefs: [TO002, TO003, TO005]
    - type: access-blocked
      severity: material
      topic: regulatory-gap
      missingEvidence: "Company-specific official results from GSXT, CreditChina, court, tax, sanctions, and administrative-penalty databases."
      whyItMatters: "A clean adverse-record conclusion cannot rely on generic portals or third-party summaries alone."
      diligencePath: "Run live Chinese-name and unified-social-credit-code searches with screenshots and exportable records before investment close."
      relatedQuestionRefs: [QO024, QO025]
      relatedTableRefs: [TO004, TO005]
    - type: missing-source
      severity: minor
      topic: technical-validation
      missingEvidence: "Independent benchmark results, product specifications, field reliability data, safety evidence, and customer acceptance criteria for robot bodies."
      whyItMatters: "Official and media claims establish direction but not repeatable field performance or unit economics."
      diligencePath: "Request demos on customer sites, benchmark protocols, failure logs, BOM/costed design files, and third-party safety review."
      relatedQuestionRefs: [QO013, QO020, QO023]
