  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: round-terms
    missingEvidence: Cap table, liquidation preferences, anti-dilution, secondary-sale mix, and fully diluted ownership by
      class.
    whyItMatters: Headline post-money valuation may materially overstate common-equity economics.
    diligencePath: Review signed financing documents and counsel summary under NDA.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Revenue by product, paid deployment, backlog, renewal, and customer concentration data.
    whyItMatters: Without revenue quality, the valuation cannot be tested against comps or milestone value.
    diligencePath: Request CFO data room, bank-supported revenue schedule, and customer contracts.
    relatedQuestionRefs:
    - QV004
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Bill of materials, manufacturing yield, field-service cost, warranty reserve, and unit gross margin.
    whyItMatters: Embodied robotics scale can consume cash if hardware and service economics are weak.
    diligencePath: Run manufacturing diligence with supplier invoices, pilot-site service logs, and yield reports.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references, paid PoC conversion rates, deployment utilization, and repeat orders.
    whyItMatters: The public record describes enterprise sectors but not adoption depth or payment quality.
    diligencePath: Conduct reference calls and site visits tied to signed contracts.
    relatedQuestionRefs:
    - QV005
    - QV030
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: market-risk
    missingEvidence: Company-specific evidence that Simplexity is insulated from China humanoid overinvestment and product
      homogeneity.
    whyItMatters: Adverse sector warnings directly affect valuation durability and next-round financing risk.
    diligencePath: Benchmark technical differentiation and customer conversion against Unitree, AgiBot, UBTECH, and AV-stack
      comps.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV015
    relatedTableRefs:
    - TV004
    - TV005
  - type: missing-source
    severity: minor
    topic: exit-readiness
    missingEvidence: Audit-readiness, governance cadence, and strategic acquirer or IPO readiness materials.
    whyItMatters: Exit route affects whether a high private valuation can convert into liquid returns.
    diligencePath: Review auditor engagement, board materials, and strategic-buyer mapping.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV006
