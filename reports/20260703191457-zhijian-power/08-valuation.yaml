- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - No paid customer proof
    - Management cannot provide named paying references under NDA
    - Commercial proof stays at narrative or PoC level
    - Pass or wait
  - - Revenue opacity persists
    - No revenue by product, deployment, or cohort
    - Valuation cannot be tied to monetization
    - Do not underwrite >US$1B
  - - Negative or unknown gross margin
    - No BOM, service-cost, or yield evidence
    - Scale could destroy cash rather than create value
    - Require milestone tranche
  - - Crowded-market repricing
    - Comparable rounds or public comps reset lower
    - Down-round risk rises before next financing
    - Demand lower entry price
  - - Weak deployment conversion
    - PoCs fail to become repeat paid orders
    - Bull case around enterprise adoption breaks
    - Stop unless price resets
  - - Unfavorable preferences
    - New money sits behind heavy liquidation stack
    - Headline valuation misstates common-equity economics
    - Renegotiate terms
  - - Safety / reliability gaps
    - Robots cannot meet enterprise uptime or incident thresholds
    - Customer expansion and regulatory acceptance stall
    - Hold pending field data
  notes: Triggers are diligence thresholds and monitoring criteria, not claims that events have occurred.
  claimRefs:
  - CV009
  - CV011
  - CV012
  - CV025
  - CV033
  - CV039
  - CV040
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Revenue quality
    - Revenue by product, paid deployment, recurring vs project mix
    - Needed to move from narrative valuation to multiple or milestone valuation
    - CFO data room and bank statements
  - - Customer proof
    - Named customers, contract terms, renewal or expansion data
    - Validates enterprise demand beyond pilots
    - Reference calls and contract review
  - - Deployment funnel
    - PoC-to-paid conversion, deployment count, utilization
    - Tests whether commercial claims scale
    - Sales ops export and site visits
  - - Gross margin
    - BOM, service labor, warranty, yield, and manufacturing cost curve
    - Determines whether scale can be profitable
    - COGS model and supplier invoices
  - - Cap table and preferences
    - Ownership, liquidation preferences, anti-dilution, secondary proceeds
    - Headline post-money may not equal common-equity value
    - Counsel-led financing document review
  - - Technical defensibility
    - Model/data moat, hardware reliability, safety incidents, uptime
    - Needed to justify premium in crowded field
    - Architecture review and field logs
  - - Runway and burn
    - Monthly burn, committed capex, next-round plan
    - Prevents funding-speed story from masking financing risk
    - Board deck and cash forecast
  - - Regulatory / safety
    - Certifications, product liability, incident response
    - Affects customer adoption and downside risk
    - Safety files and insurance review
  - - Comparable bridge
    - Why Simplexity deserves premium versus UBTECH, Pony, WeRide, Mobileye proxies
    - Forces explicit valuation logic
    - IC comp model using verified metrics
  - - Exit readiness
    - Audit readiness, governance, reporting cadence
    - Determines IPO or strategic-sale optionality
    - Auditor, legal, and board-process review
  notes: Every ask is material to price, risk, or exit; none should be waived merely because the financing was oversubscribed.
  claimRefs:
