- id: diligence-asks
  title: Decision conditions and diligence asks
  body: 'The investment committee should treat the current valuation as a diligence hypothesis. A move from research-more
    to buy requires evidence that is both commercial and financial: revenue by product or deployment, paid-customer references,
    backlog and renewal terms, bill-of-materials and service-cost trajectory, safety and reliability metrics, deployment utilization,
    cap-table preferences, and financing runway. The thesis-break triggers are concrete: no named paying customers, pilots
    stuck in unpaid PoC status, negative gross-margin trajectory, a round structure that leaves new investors behind senior
    preferences, or sector financing compression. If management cannot provide those data under NDA, the appropriate action
    is to pass or wait for a lower price. If it can, the next memo should re-price the company against verified milestones
    rather than generic embodied-AI enthusiasm.'
