tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Chapter conclusion
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more, not buy
    - Financing momentum is verified, but revenue, customers, margins, and terms are not public
    - Proceed only to private diligence or structured price reset
  - - Confidence
    - Medium-low
    - Multiple independent sources corroborate funding; decisive operating metrics are absent
    - Do not let confidence in the category substitute for company economics
  - - Risk rating
    - High
    - Crowded-sector warnings, early commercialization, opaque unit economics, and headline unicorn price
    - Require kill triggers and downside terms
  - - Valuation stance
    - Expensive / unsupported by public evidence
    - Reported post-money valuation exceeds US$1B while public revenue and customer proof are missing
    - Treat the mark as a claim to test, not a clearing price
  - - Decision implication
    - Hold for evidence
    - Strong investors and market tailwinds keep the name worth tracking
    - No price-independent buy recommendation
  notes: Judgment table combines corroborated public facts with IC interpretation; no private returns or revenue estimates
    are inserted.
