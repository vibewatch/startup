company:
  name: Zhijian Power / 至简动力 / Simplexity Robotics
chapter:
  number: 8
  title: Valuation
  summary: Public evidence confirms unusually rapid financing and a reported US$1B-plus post-money valuation, but it does
    not disclose revenue, customers, margins, or round terms. The valuation stance is expensive and the recommendation is
    research-more until private diligence proves paid deployment scale and economics.
sections:
- id: verdict
  title: 'Verdict: research more at an expensive price'
  body: 'The public record supports a serious company, but it does not support underwriting the reported post-money valuation
    above US$1 billion as a buyable entry price. The positive facts are real: multiple independent reports say Zhijian Power
    / Simplexity Robotics raised RMB2.0 billion in five rounds within roughly six months, attracted elite financial and strategic
    investors, and is targeting embodied-AI robotics with enterprise use cases. The blocking problem is not narrative quality;
    it is the lack of public revenue, named-customer, unit-cost, gross-margin, cap-table, and preference evidence. Therefore
    the chapter recommendation is research-more, confidence is medium-low, risk rating is high, and valuation stance is expensive.
    A buyer should not invent ARR, returns, or customer economics to rationalize the headline mark; it should demand private
    evidence or change price and structure.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV007
  - CV008
  - CV031
  - CV034
  - CV035
  - CV036
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-anti-thesis
  title: Thesis and anti-thesis
  body: 'The thesis is that Simplexity has unusually strong early sponsorship in a category with credible long-term demand.
    The company appears to have raised enough capital to train foundation models, develop hardware and algorithms, and pursue
    controlled enterprise deployments before broader consumer or open-environment use. Market-data sources also support rising
    shipment expectations and faster commercialization in China. The anti-thesis is equally forceful: public materials do
    not quantify revenue, customer concentration, signed deployments, margins, burn, or round terms, while adverse reporting
    says the humanoid-robotics market is crowded and vulnerable to overheating. On balance, the evidence supports keeping
    the company in diligence, not accepting the price. The view would change if management produced signed customer evidence,
    paid deployment conversion, gross-margin trajectory, and enforceable investor terms that explain why this company deserves
    a premium to better-disclosed public comps.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV006
  - CV011
  - CV012
  - CV014
  - CV015
  - CV037
  - CV038
  - CV039
  tableRefs:
  - TV002
  figureRefs:
  - FV002
- id: scenarios
  title: Bull, base, and bear cases without invented private metrics
  body: 'The scenario analysis uses explicit evidence conditions rather than fabricated revenue or return math. In the bull
    case, private diligence proves that enterprise pilots have converted into recurring paid deployments, manufacturing yield
    is improving, data and model advantages are defensible, and cap-table terms do not transfer too much downside to new common-equity
    exposure. In the base case, the public record remains the evidence set: it proves funding momentum and category heat but
    leaves the price unsupported. In the bear case, regulatory concern, crowded supply, homogeneous products, or failed PoC
    conversion push the company into a down-round, insider bridge, or strategic-sale process before revenue quality is visible.
    The range is therefore not a forecasted return range; it is a supportability range showing how much private evidence must
    arrive before the reported valuation can be treated as fair.'
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
  - CV032
  - CV033
  - CV042
  - CV044
  tableRefs:
  - TV003
