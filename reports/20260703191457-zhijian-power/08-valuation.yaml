- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence that supports it
  - What would change the view
  rows:
  - - Elite sponsorship
    - Named investor set includes strategic and financial investors across multiple reports
    - Confirm round documents, ownership, and investor rights
  - - Category timing
    - Analyst-market-data sources point to rapid China humanoid commercialization and output growth
    - Verify that Simplexity participates in paid deployments, not just demos
  - - Team credibility
    - Founders are reported as former Li Auto executives
    - Confirm retained senior technical and manufacturing leadership
  - - Use-of-proceeds fit
    - Funding is reportedly for models, algorithms, data, and application scale-up
    - Review R&D roadmap, burn, and milestone budget
  - - Disclosure gap
    - No retained source quantifies revenue or customer count
    - Receive revenue ledger and customer references under NDA
  - - Overheating risk
    - NDRC/bubble-risk coverage warns of crowded, homogeneous entrants
    - Show differentiated data, hardware reliability, and proprietary deployment loops
  - - Price discipline
    - Public comps disclose revenue/losses while Simplexity does not
    - Reprice or tranche investment around verified milestones
  notes: Rows pair thesis and anti-thesis evidence; several cells are diligence conditions rather than established facts.
