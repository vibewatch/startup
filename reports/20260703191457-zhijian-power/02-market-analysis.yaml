- id: growth-drivers-and-policy-support
  title: Growth Drivers, Chinese Government Support, and Autonomous-Driving Stack Migration
  body: 'Growth is pulled by policy, labor, e-commerce, logistics complexity, and the desire to convert AI into physical productivity.
    China’s 2026 MIIT/SASAC action is unusually explicit: it pushes real-scene training, innovation consortia, skill packs,
    verification, normal deployment, financing support, and even leasing or robot-as-a-service models. The broader Robot+
    policy and the new humanoid/embodied-AI standard system add legitimacy and help open state-owned and provincial scenarios.
    Market data also supports demand: logistics-robot drivers include e-commerce growth, labor shortages, AI navigation advances,
    RaaS, efficiency, and resilience. The autonomous-driving migration matters because the same VLA/world-model, perception,
    navigation, compute, power, and mass-production disciplines can shorten robot iteration cycles. However, robots require
    manipulation, balance, human interaction, and abnormal-scenario robustness in less standardized environments than roads;
    auto-stack credibility is a starting advantage, not proof of adoption.'
