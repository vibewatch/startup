company:
  name: Zhijian Power / 至简动力 / Simplexity Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: Zhijian Power / Simplexity Robotics is best sized as an embodied-intelligence robotics company pursuing controlled
    industrial, logistics, retail, and service workflows in China, with autonomous-driving-stack talent as a go-to-market
    accelerator rather than the market itself. Public evidence supports a large, policy-backed China industrial-logistics
    robotics opportunity, but public sources do not yet disclose paid customer count, pricing, unit economics, or repeat deployments,
    so TAM/SAM can be bounded while SOM remains unresolved.
sections:
- id: market-boundary
  title: 'Market Boundary: Embodied-Intelligence Robots for Controlled Work'
  body: 'Simplexity Robotics should not be sized as a generic AI company, an EV autonomy vendor, or a broad consumer humanoid
    option. The evidence points to an embodied-intelligence robot company using autonomous-driving stack methods, with initial
    deployment framed around closed or semi-closed factory, supermarket, and logistics workflows. Included spend therefore
    covers robot bodies, manipulation or mobility modules, fleet orchestration, robot skill/data iteration, deployment integration,
    maintenance, and outcome-linked service models for controlled work cells and intralogistics paths. Excluded spend includes
    consumer chatbot AI, generic cloud model training, broad EV software, standalone WMS licenses, and commodity automation
    that does not embody mobile or manipulative autonomy. The status quo is also broad: manual labor, conveyors, AGVs, fixed
    automation, forklifts, outsourced 3PL processes, and internal automation teams already solve parts of the job. This boundary
    explains why the user background mentions intelligent driving: public reporting links the founding team to Li Auto autonomous-driving
    and VLA work, but the investable market is robot deployment in physical operations, not cars.'
