  - - Compute and data rights
    - Affects model iteration cost and compliance
    - BIS and CAC constraints identified
    - Legal / infrastructure
    - Audit compute suppliers, training data rights, privacy controls
  notes: These gaps explain why market direction can be attractive while company-specific share capture remains unresolved.
