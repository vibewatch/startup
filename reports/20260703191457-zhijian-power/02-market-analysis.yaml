    - Turns TAM into revenue and valuation support
    - No price or margin found
    - Management finance
    - Collect price book, BOM, support cost, discounting
  - - Pilot-to-production conversion
    - Separates demos from repeatable adoption
    - Public PoC/small-batch evidence only
    - Sales / customer references
    - Review pilot pipeline, conversion rate, churn, uptime
  - - Task-level ROI versus incumbents
    - Buyers compare payback to AMR, AGV, fixed automation, and labor
    - JD and Geekplus benchmarks exist; Simplexity benchmark absent
    - Product / customer engineering
