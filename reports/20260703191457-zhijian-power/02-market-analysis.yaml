  - - Retail and supermarket service operations
    - Shelf, backroom, replenishment, inventory, customer-assist pilots
    - Consumer home robots and general retail software
    - Retail operations / store automation
    - Named Simplexity initial scenario but less publicly quantified
  - - Broad humanoid and service robots
    - Only industrial/service scenarios with clear economic workflow
