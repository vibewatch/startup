  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Simplexity customer traction
    missingEvidence: Paid customer count, signed deployment contracts, pipeline conversion rate, and referenceable users by
      segment.
    whyItMatters: Without paid adoption evidence, SOM and near-term revenue capture cannot be estimated from public data.
    diligencePath: Request management pipeline exports, signed contracts, customer calls, pilot-to-production conversion by
      month, and churn/support logs.
    relatedQuestionRefs:
    - QM025
    - QM026
    relatedTableRefs:
    - TM006
  - type: missing-source
    severity: material
    topic: Simplexity pricing and ROI
    missingEvidence: Robot ASP, service fee, RaaS pricing, gross margin, utilization, uptime, payback period, and support
      cost by workflow.
    whyItMatters: Buyers compare robots against labor, incumbents, fixed automation, and internal build on payback.
    diligencePath: Collect price book, BOM, unit-economics model, installation costs, warranty terms, and side-by-side ROI
      case studies.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM006
  - type: conflicting-data
    severity: minor
    topic: market sizing boundary
    missingEvidence: A single source that isolates China embodied-intelligence industrial-logistics robotics rather than broader
      warehouse automation or logistics robots.
    whyItMatters: Different market definitions produce different TAM/SAM values and can overstate addressability.
    diligencePath: Commission or build bottom-up facility/task model from warehouses, factories, labor hours, robot density,
      and deployable task inventory.
    relatedQuestionRefs:
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: naming normalization
    missingEvidence: Company legal entity confirmation tying Zhijian Power, Zhijian Dynamics, 至简动力, and Simplexity Robotics
      labels together.
    whyItMatters: Translation and naming ambiguity can contaminate financing, founder, and product evidence.
    diligencePath: Verify PRC registry filings, investor announcements, company domains, and management confirmation before
      final investment memo.
    relatedQuestionRefs:
    - QM023
