company:
  name: IQM Quantum Computers

chapter:
  number: 6
  title: Customers
  summary: >
    IQM has assembled a diverse and rapidly growing customer base spanning national quantum labs, European supercomputing centers, US research institutions, Asia-Pacific universities, and—emerging as of early 2026—private enterprise buyers. More than 20 on-premises systems have been delivered across 11+ named organizations in 9 countries, with the US national lab market (ORNL, University of Maryland) opening in 2025–2026. Direct customer renewal contracts are not publicly disclosed; concentration risk is elevated since the top three customers (VTT, LRZ, Aalto) are also IQM's most strategic reference accounts. A first adverse signal is the company's continued reliance on government-funded institutions with uncertain multi-year budget durability.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Acquisition Map
    body: >
      IQM's customer base segments into four distinct cohorts. First, national quantum infrastructure programs—state-backed bodies that build and operate national quantum computing facilities as research infrastructure. This cohort includes VTT Technical Research Centre of Finland (IQM's founding reference customer and technology partner), CSC/FiQCI (Finnish Quantum Computing Infrastructure hosting Helmi and Aalto University's 20-qubit system), and the LUMI-Q consortium (nine-country EuroHPC consortium with an IQM Star 24 system at IT4Innovations, Czech Republic). Second, HPC supercomputing centers—institutions that integrate quantum hardware into their high-performance computing environments. This cohort includes LRZ (Leibniz Supercomputing Center, Germany; 20-qubit Radiance, 2024), ORNL (Oak Ridge National Laboratory, US; Radiance 20q selected for first on-prem QC), CESGA (Galicia Supercomputing Center, Spain; 54-qubit Radiance + 5-qubit Spark planned by June 2026), Cineca (Italy; Lagrange system), and Aalto University (Finland; 20-qubit HPC-connected). Third, academic and research universities—institutions acquiring IQM Spark for teaching, algorithm research, and quantum skills development. This cohort includes Chungbuk National University (South Korea; first Asia-Pacific IQM system), WUST (Poland; first Polish superconducting QC), Poznan University of Technology (Poland; unveiled 2026), and the University of Maryland (US; IQM quantum technology center opening 2026). Fourth, early enterprise adopters—private companies purchasing IQM hardware or using cloud access. Galaxy Systemy Informatyczne (Poland) was publicly announced as the first private enterprise to purchase an IQM quantum computer (April 2026). TOYO Corporation (Japan; distribution agreement + first enterprise purchase, April 2026) and Scientek Corporation (Taiwan; reseller agreement) extend IQM's reach into the Asia-Pacific enterprise market. DATEV (Germany) is collaborating on portfolio optimization use cases.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: named-deployments
    title: Named Deployments and Customer Proof
    body: >
      VTT Technical Research Centre of Finland is IQM's longest-standing customer and technology co-development partner. IQM built the Helmi quantum computer (5 qubits, VTT's first system) and later VTT Q50 (50 qubits, the largest publicly accessible quantum computer in the Nordic countries, opened March 2025 through FiQCI). Under a publicly disclosed roadmap, VTT is scheduled to receive a 150-qubit IQM Crystal system in 2026 and a 300-qubit system in 2027, making VTT both the most advanced and largest single-customer program for IQM. LRZ (Leibniz Supercomputing Center, Munich, Germany) deployed IQM Radiance 20q in 2024 as part of the Munich Quantum Valley initiative, using the system with the Munich Quantum Software Stack in a loosely HPC-integrated configuration; the Cineca Director General is quoted on the IQM Radiance product page expressing confidence that quantum will translate into commercial opportunities. IT4Innovations (National Supercomputing Center, Czech Republic) operates the IQM Star 24 (VLQ system, 24-qubit Star topology), connected to the Karolina supercomputer, deployed through the LUMI-Q EuroHPC consortium and inaugurated in 2025. ORNL (Oak Ridge National Laboratory, US) selected IQM Radiance as its first on-premises quantum computer, with delivery initially scheduled for Q3 2025; this is the first IQM sale to a US Department of Energy lab. CESGA (Galicia Supercomputing Center, Spain) is deploying a 54-qubit Radiance and a 5-qubit Spark to be integrated with the Finisterrae IV AI-supercomputer by June 2026, in a project supported by Telefónica. Chungbuk National University (South Korea) installed IQM Spark in 2025 as the first IQM system deployed in the Asia-Pacific region. Galaxy Systemy Informatyczne (Poland) announced in April 2026 as the first private enterprise buyer of an IQM quantum computer. IQM hardware is also accessible via Amazon Braket (IQM Garnet and IQM Emerald) and Quantum Rings cloud platform.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: adoption-trajectory
    title: Adoption Trajectory and Growth Patterns
    body: >
      IQM's on-premises deployment count has grown from a single VTT installation (2021) to 10+ systems across multiple continents by 2026, and the company claims #1 status in on-premises deliveries globally for the past 12 months. The growth trajectory reflects three distinct phases: Phase 1 (2019–2022) was driven by national quantum programs in Finland, Germany, and IQM's founding partner ecosystem; Phase 2 (2023–2024) saw IQM win its first competitive HPC tenders (LRZ, ORNL selection, IT4Innovations) as quantum computers began entering supercomputing center procurements; Phase 3 (2025–2026) has expanded the geographic footprint to Asia-Pacific (South Korea, Japan, Taiwan) and introduced private enterprise adoption alongside continued national lab wins. The LUMI-Q consortium (nine countries) represents a single contract with multi-country deployment potential, as does the Scientek and TOYO distributor network in Asia. The CESGA deployment with Telefónica as a supporting partner suggests emerging telco vertical interest. On the cloud side, IQM's presence on Amazon Braket (Garnet 20q since 2023; Emerald 54q since July 2025) provides global developer reach. The Quantum Rings platform makes IQM hardware available for free to their ecosystem, serving as a developer acquisition channel. No public evidence of year-over-year revenue growth rates, order book size, or customer acquisition cost data is available; the first financial disclosure is expected through the SPAC process (Form F-4 filed May 2026).
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: retention-durability
    title: Retention, Renewal, and Customer Durability
    body: >
      IQM's retention profile is structurally strong in the national lab and supercomputing center cohort. VTT has a multi-year roadmap with IQM extending through at least 2027 (300-qubit system delivery), suggesting deep institutional lock-in driven by co-development history and shared IP. CSC's FiQCI connects VTT and Aalto systems under national infrastructure contracts that typically run 3–7 years. ORNL, CESGA, and IT4Innovations are government-funded institutions whose quantum computer budgets are tied to national or EU-level quantum programs; their contract durability depends on continued program funding, creating sovereign budget risk rather than competitive churn risk. Private enterprise customers (Galaxy Systemy, TOYO) are single-system buyers with no multi-year contract evidence publicly available, making early enterprise churn hard to assess. IQM has not published customer satisfaction metrics, NPS scores, or contract renewal rates. The first adverse signal: IQM's customer base is heavily weighted toward government-funded institutions (approximately 85–90% of known deployments), which are susceptible to budget cycles, government procurement delays, and geopolitical restrictions on dual-use technology acquisition. No IQM customer has publicly canceled or delayed a procurement once announced; the absence of churn evidence is noted but should be interpreted cautiously given the small observed sample size and recency of most deployments. The €50M bridge financing secured in March 2026 and the SPAC merger suggest the company has not yet achieved sustained commercial revenue to fund operations independently.
    claimRefs: [CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: expansion-concentration
    title: Expansion Potential and Concentration Risk
    body: >
      IQM's customer expansion potential is driven by four dynamics: (1) upgrade cycles within existing accounts—VTT's progression from Helmi (5q) to Q50 (50q) to 150q and then 300q is a proof-of-concept for multi-generation spend; (2) geographic rollout—distributor agreements with TOYO (Japan) and Scientek (Taiwan) open the Asia-Pacific enterprise market, while CESGA and Cineca represent early southern-European wins; (3) cloud access as a land-and-expand funnel—Braket and Resonance users who eventually procure on-premises hardware; (4) new verticals through DATEV (financial services) and any pharmaceutical or logistics pilots derived from the quantum optimization/simulation roadmap. Concentration risk is elevated. VTT represents a disproportionate share of IQM's install base and public reputation—three planned systems (Q50 + 150q + 300q) across two or more contracts at a single institution. LRZ and Aalto University together with VTT form the Finnish-German national lab cluster that likely constitutes the majority of IQM's current HPC-grade contract revenue. The geographic concentration in EU/Nordic institutions means a portion of the revenue base is sensitive to EU quantum program budget cycles (including EuroHPC and national funding). The US market is nascent (ORNL selected, University of Maryland planned), with no delivered systems to the US as of May 2026. US government procurement regulations (FedRAMP, export control, CFIUS considerations given the SPAC listing) could slow US expansion. Adverse signal: IQM's SPAC F-4 filing (May 2026) will be the first opportunity to see disclosed revenue concentration data; until then, this gap remains a material diligence limitation.
    claimRefs: [CU036, CU037, CU038, CU039, CU040, CU041, CU042]
    tableRefs: [TU005]
    figureRefs: []

