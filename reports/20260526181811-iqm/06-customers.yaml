callouts:
  - calloutType: strength
    title: Verified Multi-Country Customer Roster with HPC Integration Evidence
    body: >
      IQM has delivered quantum computers to named customers in at least 9 countries across 4 continents, with multiple verified HPC integrations (LRZ, IT4Innovations/Karolina, Aalto/LUMI). The VTT upgrade roadmap (5q→50q→150q→300q) demonstrates a multi-generation customer relationship that is genuinely rare in the quantum computing industry. The winning of the ORNL tender and the Galaxy first private-enterprise sale are meaningful proof points for market broadening.
    claimRefs: [CU001, CU011, CU013, CU022, CU023, CU024]

  - calloutType: risk
    title: Revenue Concentration and Government Dependence Are Material Risks
    body: >
      Approximately 85–90% of IQM's known customer deployments are government or academically funded institutions, predominantly in the EU and Finland. VTT and the Finnish national quantum ecosystem (FiQCI, CSC, Aalto) represent what may be the single largest customer cluster by revenue. No revenue, contract value, or renewal rate data has been publicly disclosed. Until the SPAC F-4 prospectus is finalized, the financial magnitude of this concentration remains opaque. Government budget cycles and EU quantum program continuity are the primary churn vectors, not competition.
    claimRefs: [CU036, CU037, CU038, CU039, CU040]

  - calloutType: risk
    title: No Public Customer Satisfaction Metrics or NPS Data
    body: >
      IQM has published no NPS scores, customer satisfaction surveys, or churn rate data. The Director General of Cineca is the only named executive quoted on IQM's product pages, and the quote is forward-looking rather than a proof of delivered value. This absence is a diligence gap: it prevents independent assessment of whether customers are receiving expected value from their quantum investments.
    claimRefs: [CU033, CU034, CU035, CU041]

