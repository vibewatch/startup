figures:
  - id: FU001
    title: IQM Customer Journey Map
    type: journey-map
    layout: wide
    summary: How IQM customers move from awareness through deployment to expansion, with key touchpoints and potential drop-off moments.
    data:
      items:
        - label: "Awareness"
          detail: "Conference (IEEE Quantum Week, QIP); Amazon Braket free access; IQM Resonance free tier; academic co-authorship opportunities"
        - label: "Evaluation"
          detail: "IQM sales engagement; technical demo on Resonance; benchmark data review (Braket specs); competitor comparison (IBM, Rigetti, Oxford)"
        - label: "Procurement"
          detail: "IQM proposal and quote; government/HPC tender process (6–18 months); contract negotiation; delivery schedule (under 6 months)"
        - label: "Onboarding"
          detail: "On-site installation by IQM team; calibration and acceptance testing; SDK setup; HPC integration; user training on Qrisp/Qiskit"
        - label: "Active Use"
          detail: "Daily quantum jobs via HPC scheduler; regular calibration; IQM software updates (iqm-client); research publications"
        - label: "Expansion"
          detail: "Upgrade to larger qubit system; Spark plus Radiance pairing; consortium program extension; enterprise referral"
    approximationNotes: Journey stages are synthesized from observed deployment patterns and public case studies. Drop-off risk is highest at Evaluation and Procurement stages due to long government tender timelines.
    claimRefs: [CU001, CU002, CU003, CU021, CU022, CU023, CU029]

