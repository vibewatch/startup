company:
  name: IQM Quantum Computers

chapter:
  number: 5
  title: Product & Technology
  summary: >
    IQM delivers a vertically integrated, full-stack portfolio of superconducting quantum computers—Spark (5-qubit), Radiance (20/54/150-qubit), Halocene (QEC research), and Resonance (cloud)—built on transmon qubits with tunable couplers in proprietary Crystal and Star topologies. The company claims #1 status in on-premises deliveries globally over the past year, with demonstrated CZ-gate fidelity of 99.9% in production systems and 99.95% on test chips in 2025. Near-term technology gaps include scaling QLDPC code implementations, dependency on NVIDIA NVQLink for real-time QEC, and the absence of publicly verified third-party security audits.

sections:
  - id: product-portfolio
    title: Product Portfolio and SKU Map
    body: >
      IQM's commercial product lineup spans four distinct product lines that address different market segments from education to HPC-scale research. IQM Spark is a 5-qubit on-premises system priced for universities and research centers; it uses the IQM Crystal topology with tunable couplers and was chosen for Cineca's Lagrange installation in Italy and Chungbuk National University in South Korea. IQM Radiance targets high-performance computing centers with configurations at 20, 54, and 150 qubits (Crystal 20, Crystal 54, Crystal 150), all featuring full square-lattice connectivity, tunable couplers between all nearest-neighbor qubit pairs, and a software stack for HPC integration. Radiance 20 is deployed at LRZ (Leibniz Supercomputing Center), ORNL, and Aalto University; Radiance 54 is planned for CESGA; Crystal 150 is the flagship for VTT. IQM Halocene is the newest product line, announced November 2025, targeting the quantum error correction research era with a modular open-platform architecture supporting up to 5 high-quality logical qubits, a modular decoder architecture, and NVIDIA NVQLink compatibility, with commercial availability targeted by end of 2026. IQM Resonance is the company's cloud platform at resonance.iqm.tech, providing access to IQM Star 24 (24-qubit, high-connectivity Star topology) and Crystal 54 hardware, with Qrisp as the default SDK, alongside support for Qiskit, Cirq, and CUDA Quantum. Additionally, IQM hardware is available via Amazon Braket (IQM Garnet: 20-qubit Crystal and IQM Emerald: 54-qubit Crystal 54). The company states it manufactures 20 on-premises quantum computers annually from its Espoo, Finland, facility.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE001]
    figureRefs: []

  - id: hardware-architecture
    title: Hardware Architecture and QPU Design
    body: >
      IQM's quantum processing units are based on superconducting transmon qubits—a well-established qubit technology derived from Josephson junction circuits that provides high reproducibility and compatibility with standard microwave control electronics. Two proprietary topologies differentiate IQM's hardware. The IQM Crystal topology arranges qubits in a 2D square lattice with tunable couplers between each nearest-neighbor pair; this enables fast (20–40 ns) parallel two-qubit gates and minimizes crosstalk by fully idling coupler interactions during non-gate intervals. The IQM Star topology introduces a central computational resonator hub that connects a large number of qubits, providing effective near-all-to-all connectivity while reducing the number of SWAP operations required for connectivity-intensive algorithms; the IQM Star 24 (24-qubit) is the first commercial Star system and is accessible through the Resonance cloud platform. A third topology, IQM Constellation—combining Crystal and Star elements—is planned as the scalable architecture for quantum error correction, forming the basis for the QLDPC roadmap. The hardware stack comprises the QPU, a dilution refrigerator maintaining temperatures near 15 mK, wiring and filtering subsystems, and proprietary control electronics that send microwave, RF, and DC signals. Key performance benchmarks for the Crystal 20 production system include: minimum 1-qubit gate fidelity ≥99.7%, typical ≥99.9%; minimum 2-qubit CZ gate fidelity ≥98.0%, typical ≥99.0%; readout fidelity ≥97% typical; quantum volume 32; CLOPS 2600; Q-score 11. In 2025 IQM achieved 99.95% peak CZ fidelity on a two-qubit test chip. The company fabricates QPUs in an in-house clean room at its Espoo facility, using cryogenic chip testing to identify functional units before production.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE018]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: software-cloud
    title: Software Stack, Cloud Platform, and HPC Integration
    body: >
      IQM's full-stack software offering encompasses quantum programming frameworks, compilation tools, automated calibration, and HPC integration middleware. The IQM SDK (open-source, Apache 2.0 license, on PyPI as iqm-client and in the GitHub repository iqm-finland/sdk) provides the client-side interface for IQM quantum computers. The default frontend framework on IQM Resonance is Qrisp, an open-source high-level quantum programming language, while Qiskit, Cirq, CUDA Quantum, and TKET are also supported. Quantum compilers translate high-level circuits to native IQM gates (X/Y rotations and CZ); automated calibration software maintains optimal parameter values. Pulse-level access is available to both on-premises customers and Resonance cloud users, enabling research-grade experimental control. The IQM Resonance platform at resonance.iqm.tech offers multi-framework support, group and user management, job scheduling, and transparent execution without hidden circuit modifications. A QAOA open-source library was released by IQM for quantum optimization algorithm research. For HPC integration, IQM delivers a specialized SDK enabling scheduling of quantum jobs directly from supercomputer job schedulers (as demonstrated at LRZ with the Munich Quantum Software Stack). IQM distinguishes "loose HPC integration" (quantum and classical scheduled independently but co-located, as at LRZ) from planned "tight HPC integration" (optimized data movement and latency). An HPC Integration Guidebook was published to assist HPC centers. In May 2026, IQM launched an HPC Integration Service product. On April 14, 2026, IQM announced AI-driven agentic calibration using NVIDIA Ising models, enabling parallel qubit calibration to reduce dependence on on-site quantum engineering expertise. IQM also collaborates with Zurich Instruments and NVIDIA on NVQLink for real-time QEC GPU-QPU interconnect (announced March 2026).
    claimRefs: [CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE027]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: technology-roadmap
    title: Technology Roadmap and Development Milestones
    body: >
      IQM's published development roadmap defines three phases on the path to fault-tolerant quantum computing. Phase 1 (NISQ, 2025–2026): target >99.94% two-qubit gate fidelities in large systems; deploy advanced error suppression and mitigation techniques; deliver NISQ solutions for simulation and optimization use cases with research partners. Phase 2 (QEC Demonstrators, 2027–2028): build large systems combining QEC and error reduction; target logical error rates in the range 10⁻⁵ to 10⁻⁶; implement QLDPC codes offering 2–10× efficiency over surface codes; support universal quantum computation including non-Clifford gates. Phase 3 (Fault Tolerance, 2030+): realize fully QEC-enabled systems with hundreds of high-precision logical qubits; target logical error rate 10⁻⁹; scale to 1 million physical qubits. Specific technology milestones include: Crystal 150 as the current production flagship; IQM Star 24 as the first Star-topology system; IQM Constellation (combining Crystal and Star) as the planned QEC-era QPU architecture; IQM Halocene as the QEC research platform (150 qubits, commercial by end 2026). In 2025 IQM achieved the industry milestone of 99.95% CZ fidelity on a test chip. The roadmap identifies three high-value application areas: simulation (€28B market by 2035), optimization (€18B), and quantum machine learning (€26B), totaling over €72B. The company also disclosed in May 2026 delivery schedules for 150-qubit and 300-qubit machines to VTT. Manufacturing is supported by an Espoo production facility producing 20 QCs per year, with plans for significant expansion announced in November 2025 (€40M investment).
    claimRefs: [CE028, CE029, CE030, CE031, CE032, CE033, CE034, CE035, CE036]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: trust-compliance
    title: Trust, Safety, Compliance, and Technology Risk
    body: >
      IQM's quality assurance rests on in-house manufacturing in a controlled cleanroom environment, module-level electronics testing, a dedicated system build area for full validation, and an automated testing suite. Cryogenic chip testing identifies functional QPU units before production, and the calibration team tunes each system on site post-installation. Delivery-to-installation typically under 6 months. IQM does not publicly disclose cybersecurity certifications, penetration test results, or third-party security audit reports for the Resonance cloud platform or the on-premises control systems—a gap relevant for government and defense customers. The Resonance platform is a js-only web application with limited visible API documentation. As a Finnish private company (as of May 2026, mid-SPAC process), IQM is not subject to a US national security review (CFIUS) for its European deliveries but its planned US listing and US deployments (ORNL, University of Maryland) may attract regulatory scrutiny. Export control exposure: superconducting quantum computers are considered dual-use technology in EU and US export classification frameworks; no public IQM-specific export compliance guidance is published. The SPAC merger registration statement (Form F-4, filed May 14, 2026, SEC Accession 0001193125-26-222654) is the first public financial disclosure. Key technology risk: dependency on NVIDIA NVQLink GPU-QPU interconnect for real-time QEC; if NVIDIA changes access terms or pricing, IQM's QEC roadmap could face delays. Additionally, the QLDPC code implementation timeline has no independently verifiable milestone publication.
    claimRefs: [CE037, CE038, CE039, CE040, CE041, CE042]
    tableRefs: [TE004]
    figureRefs: [FE004]

