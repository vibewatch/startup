callouts:
  - calloutType: strength
    title: Vertically Integrated, Full-Stack Delivery at Scale
    body: >
      IQM's claim to be #1 in on-premises quantum computer deliveries globally over the past year, combined with an in-house cleanroom, proprietary control electronics, and a full-stack software offering, positions it as one of the few vendors capable of deploying production-grade quantum computers end-to-end. The 6-month delivery-to-installation promise and 10+ installed customer base are credible differentiators in a market dominated by cloud-first alternatives.
    claimRefs: [CE001, CE006, CE007, CE015, CE016]

  - calloutType: risk
    title: QLDPC and Fault-Tolerant Roadmap Carry High Execution Risk
    body: >
      IQM's long-term valuation thesis depends on executing a QLDPC code QEC roadmap through IQM Constellation—a topology that does not yet exist commercially. The intermediate milestones (QEC demonstrators by 2027–2028, logical error rate 10⁻⁵) have no independently verifiable publication record, and the NVIDIA NVQLink dependency introduces a single point of external hardware risk in the QEC pipeline.
    claimRefs: [CE030, CE031, CE032, CE033, CE034, CE041]

  - calloutType: risk
    title: Cybersecurity and Compliance Gaps for Government Customers
    body: >
      IQM does not publicly disclose cybersecurity certifications, penetration test results, or third-party security audit reports for either the Resonance cloud platform or on-premises control systems. For the national labs and government customers that represent a growing share of IQM's order book (ORNL, University of Maryland), the absence of documented FedRAMP, ISO 27001, or equivalent compliance documentation is a material due-diligence gap.
    claimRefs: [CE038, CE039, CE040, CE042]

