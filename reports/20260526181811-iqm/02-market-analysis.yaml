  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som sizing
    missingEvidence: A bottoms-up map of installed-base opportunity by buyer type, deployment mode, and budget owner is required to isolate a credible SAM or SOM for IQM.
    whyItMatters: Top-down TAM ranges are too wide to underwrite revenue potential or valuation sensitivity for IQM’s specific wedge.
    diligencePath: Build a bottoms-up model from named HPC centers, universities, national labs, enterprise pilots, system price bands, and expected service attach rates.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: buyer mix transparency
    missingEvidence: Public/private-sector revenue split, number of enterprise customers, and share of bookings from sovereign or grant-backed buyers would close the buyer-mix gap.
    whyItMatters: The mix of public versus enterprise demand changes cycle length, repeatability, and margin expectations.
    diligencePath: Request a pipeline and installed-base breakdown by buyer class plus 2025-2026 bookings by public versus enterprise channel.
    relatedQuestionRefs:
    - QM024
  - type: access-blocked
    severity: minor
    topic: premium market research access
    missingEvidence: Readable access to high-signal premium or blocked sources such as McKinsey or member-only QCR content would improve triangulation on commercialization timing and market composition.
    whyItMatters: Some of the most authoritative market sources are not fully open, which limits how precisely open-source diligence can reconcile category definitions.
    diligencePath: Use a subscribed research account or obtain the cited reports directly from the publisher during diligence.
    relatedQuestionRefs:
    - QM022
  - type: stale
    severity: minor
    topic: enterprise adoption timing
    missingEvidence: More recent public data on pilot-to-production conversion and paid enterprise renewals would sharpen timing estimates.
    whyItMatters: Forecasts of useful applications are still broad, and the gap between technical readiness and procurement readiness remains a core valuation uncertainty.
    diligencePath: Interview reference customers and compare current 2026 renewal or expansion behavior against 2024-2025 pilot cohorts.
    relatedQuestionRefs:
    - QM025
