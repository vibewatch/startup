company:
  name: IQM Quantum Computers
chapter:
  number: 2
  title: Market Analysis
  summary: IQM participates in a quantum computing market that is simultaneously large in headline forecasts and still structurally immature in commercialization terms. Public estimates range from roughly $1.4 billion to $3.5 billion for the mid-2020s baseline and from about $4 billion to more than $22 billion for outer-year forecasts, largely because publishers define the category differently and weigh cloud, systems, services, and adjacent use cases in different ways. The actionable conclusion for IQM is that buyer demand is real across HPC centers, universities, national labs, and selected enterprises, but adoption still depends on talent availability, integration into classical compute environments, error-correction progress, and the ability to translate experimentation into owned production infrastructure.
sections:
- id: market-boundary-and-scope
  title: Market Boundary and Scope
  body: 'The right market frame for IQM is narrower than “all quantum technology” and more specific than a generic quantum-computing TAM. IQM’s public materials point to superconducting quantum systems, cloud access, control electronics, integration software, and HPC-operating workflows as the relevant commercial surface. That means the company sits in the quantum-computing market, but not in all quantum spending: sensing, networking, and post-quantum cybersecurity matter strategically yet are not the same budget pool as full-stack superconducting computing systems. The deployment model also matters. Public market reports disagree on whether cloud or on-premises is the more important near-term commercial form, but they agree that both exist and that deployment choice changes adoption barriers. IQM’s own positioning leans hard toward owned, on-premise infrastructure with cloud as an access layer, which makes its true addressable market more akin to quantum infrastructure plus integration
    than a broad “software only” category.'
