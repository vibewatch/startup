      - number: '4.2'
        title: 市场进入动作与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              IQM 的主要市场进入方式是直接销售给政府量子计划和机构买家。公司在 13+ 个国家设有办公室，声称拥有 15+ 次本地部署客户交付，因此自称按过去 12 个月交付量计算，是 #1
              本地部署量子计算机供应商。本地部署量子硬件销售周期很长，通常 12 到 24 个月，涉及场地资格、政府采购流程、概念验证试验和合同交付里程碑。这类合同的获客成本（CAC）很高，但未公开量化。IQM
              的云渠道（AWS Braket）支持自助发现和低摩擦访问，但单客收入低于硬件合同；它也充当开发者和 PoC 漏斗，导向未来本地部署增购。截至报告日期，公司没有 Microsoft Azure Quantum 或
              Google Cloud Marketplace 上架，限制了通过 Microsoft 和 Google 伙伴网络触达企业的能力——IonQ 和 Quantinuum 都拥有三平台云存在，并利用了这一缺口。IQM
              的地理扩张优先覆盖欧洲主权量子计划（德国、芬兰、西班牙、法国）、亚太（日本、韩国），以及通过 Nasdaq IPO 公告进入美国。系统集成商或量子应用服务商分发尚未得到公开确认；IQM
              的本地部署合同似乎采用纯直接销售的市场进入方式。
            claimRefs: []
      - number: '4.3'
        title: 成本结构、资本强度与毛利率驱动
        blocks:
          - type: paragraph
            body: >-
              IQM 的纵向一体化模式——内部芯片制造、低温系统集成、控制软件和现场交付调试——使其产品销售成本（COGS）高于 IonQ 等无晶圆厂同行。€35M EIB loan（2022）资助了 IQM 的 Espoo
              制造设施，这是欧洲第一座量子专用洁净室 fab。自有制造提供供应链主权，避免依赖外部半导体代工厂，但也要求持续 资本开支，用于设备更新、工艺开发和产能扩张。来自 IonQ（依赖外部代工厂）和 Rigetti（拥有
              Fremont, California 的 Fab-1）的公开可比数据表明，现阶段量子硬件毛利率很薄，甚至为负：Rigetti FY2024 收入 $10.8M，经营亏损 $69M；IonQ FY2025 收入
              $130M，净亏损 $510M。两者都不披露硬件专项毛利率，因为多数收入嵌在多元素合同中。IQM 在 13+ 个国家拥有 300+ 名员工，意味着固定人员成本很重。按量子行业全口径年成本约 $150K–$250K
              per employee（薪酬加雇主缴款）估算，仅薪资就意味着 $45–75M 年人员成本，还未计入 R&D 材料、fab 运营成本和 SG&A。这与估计 $60–100M 年烧钱速度相符，尽管没有公开数据确认。
