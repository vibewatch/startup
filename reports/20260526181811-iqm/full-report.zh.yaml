      - number: '6.5'
        title: 扩张潜力与集中度风险
        blocks:
          - type: paragraph
            body: >
              IQM 的客户扩张潜力来自四股力量：（1）现有账户内升级周期——VTT 从 Helmi（5q）到 Q50（50q）、再到 150q 和 300q 的推进，为多代支出提供概念验证；（2）地理拓展——与
              TOYO（日本）和 Scientek（台湾）的分销协议打开亚太企业市场，CESGA 和 Cineca 则是南欧早期胜利；（3）云访问作为先落地再扩张漏斗——Braket 和 Resonance
              用户最终采购本地部署硬件；（4）通过 DATEV（金融服务）以及来自量子优化 / 模拟路线图的任何制药或物流试点进入新垂直。集中度风险偏高。VTT 在 IQM
              的安装基数和公众声誉中占比过大——单一机构跨两份或更多合同规划三套系统（Q50 + 150q + 300q）。LRZ 和 Aalto University 与 VTT 共同构成芬兰-德国国家实验室集群，很可能贡献
              IQM 当前 HPC 级合同收入的大部分。收入地理集中在欧盟 / 北欧机构，意味着部分收入基础对欧盟量子项目预算周期敏感（包括 EuroHPC 和国家资金）。美国市场仍处早期（ORNL
              已入选、University of Maryland 已规划），截至 2026 年 5 月尚无交付到美国的系统。美国政府采购规定（FedRAMP、出口管制、考虑 SPAC 上市后的 CFIUS
              因素）可能拖慢美国扩张。反向信号：IQM 的 SPAC F-4 文件（2026 年 5 月）将是首次看到收入集中度披露的机会；在此之前，这个缺口仍是重大尽调限制。
