  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              IQM 的正确市场框架，比“所有量子技术”更窄，也比泛泛的量子计算 TAM 更具体。IQM 的公开材料显示，相关商业表面包括超导量子系统、云访问、控制电子、集成软件和 HPC
              运营工作流。也就是说，公司处在量子计算市场，但不覆盖所有量子支出：传感、网络和后量子网络安全有战略意义，却不是全栈超导计算系统同一预算池。部署模式同样关键。公开市场报告对于云还是本地部署更重要的近期商业形态意见不一，但都承认两者存在，且部署选择会改变采用门槛。IQM
              自身定位强烈偏向客户拥有的本地基础设施，云只是访问层；因此它的真实可服务市场更接近“量子基础设施 + 集成”，而不是宽泛的“仅软件”类别。
