  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：门模型巨头、离子阱挑战者、纯云玩家和量子退火替代方案
        blocks:
          - type: paragraph
            body: >-
              IQM 在几个不同竞争类别中竞争，各类玩家用不同技术路径和市场姿态追求量子优势。截至 2026 年 5 月，竞争格局可分为四类。


              第一，**超大规模云厂商支持的门模型既有巨头**：IBM Quantum 运营 30+ 台各自超过 100 qubits 的量子计算机，可用量子比特超过 2,300 个，每年运行 3.9 trillion
              条线路，并声称 97% uptime。IBM 的规模以及通过 IBM Quantum System Two 打通的纵向整合，使其成为全球大型 HPC 中心的默认参考平台。Google Quantum AI 在
              2024–2025 年推出 Willow 芯片，借助 Quantum Echoes 算法实现了面向真实世界应用的首个可验证量子优势，并继续以内部研究和合作伙伴组织的形态运作，而不是商业硬件供应商。


              第二，**离子阱专家公司**：IonQ 和 Quantinuum 主要在保真度上竞争。IonQ 声称 two-qubit gate fidelity 达到 99.99% —— 这是行业公开发布的最高 基准指标
              —— 并通过 AWS、Azure 和 Google Cloud 分发访问。Quantinuum 的 Helios 处理器采用 QCCD（quantum charge-coupled
              device）架构，具备全连接和 mid-circuit measurement 能力，支撑了史上首次实时量子纠错演示。


              第三，**纯云超导同行**：Rigetti Computing 于 2026 年 4 月部署 Cepheus-1-108Q（107 个物理量子比特），单量子比特门保真度中位数为 99.84%，CZ 门保真度为
              98.84%。Rigetti 仅通过 Quantum Cloud Services（QCS）云端运营，不销售本地部署系统，因此与 IQM 形成直接定位差异。


              第四，**量子退火替代方案和多元化玩家**：D-Wave 采用双平台打法，把成熟的 Advantage2 退火系统与通过收购 Quantum Circuits Inc. 获得的门模型能力结合。D-Wave
              是唯一在服务层面实现商业盈利的量子供应商，不过其退火技术覆盖的问题类别比门模型计算机更窄。


              IQM 的独特位置在于面向国家 HPC 中心、研究实验室和政府机构的本地部署超导硬件。公司声称，按过去十二个月交付数量计算，它是本地部署量子计算机第一大提供商，客户交付 15+ 套，累计制造 30+
              台机器。AWS Braket 集成（IQM Garnet 20-qubit 和 Emerald 54-qubit）提供了云端存在感，但本地部署板块才是 IQM 相对云主导竞争对手的核心商业差异点。
