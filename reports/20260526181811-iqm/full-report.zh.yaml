      - number: '1.2'
        title: 领导层、治理与组织成熟度
        blocks:
          - type: paragraph
            body: >-
              公开证据在创始人经营层最强，在完整董事会和控制权栈上较薄。公司公告显示，Jan Goetz 于 2026 年 1 月从 co-CEO 结构转为唯一 CEO；Søren Hein 被任命为 COO 和副 CEO，前
              co-CEO Mikko Välimäki 转任顾问至 2026 年 3 月。同一批公告和公开市场材料还显示，Sierk Poetting 担任董事长，Ten Eleven Ventures 的 Alex
              Doll 在 2025 年 Series B 后加入董事会。合在一起看，IQM
              正从创始人主导的建设阶段，转向更正式的成长期治理模式。但公开证据仍没有给出完整现任董事会名单、委员会架构或投资人权利图谱。尽调视角下，IQM
              已足够成熟，可以支撑大型机构部署和上市流程；但它仍保留私营公司的一面，真正的治理权力在核心新闻稿和交易文件之外仍有部分不透明。
