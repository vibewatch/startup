      - number: '7.4'
        title: 人才、竞争与客户集中度风险
        blocks:
          - type: paragraph
            body: >
              人才稀缺是品类层面的风险。IQM 自己与分析公司 Omdia 联合撰写的 State of Quantum 报告（2025 年 6
              月）把量子人才短缺列为“行业继续增长的两大系统性风险”之一，另一项是美国以外的资金缺口。IQM 员工 300+，来自 50+ 个国籍，包括 120+ 名量子 PhD。PhD 级量子工程师需要 5–7
              年培养；全球每年量子 PhD 产出估计只有低几千人。IQM 在 2026 年 1 月完成联席 CEO 交接（Mikael Silverstolpe 离任后，Jan Goetz 成为唯一 CEO），在关键 SPAC
              交割期进入单一领导架构，形成关键人物执行风险。

              客户集中是结构性问题。F-4 称，“我们收入的很大一部分目前依赖公共部门合同。”在仅披露 13 个客户的情况下，单一合同流失很可能代表总收入的 ≥7 %。多数客户是政府资助机构（大学、国家实验室、HPC
              中心），采购周期为 12–36 个月，并受预算约束。全球前 10 大超算中心中有 4 家是 IQM 客户，这代表高声誉集中，而不是分散化。

              竞争风险正在加剧。IBM 继续推进其超导路线图（1,000+-qubit 系统）；IonQ（截至运行日市值约 $23.6 B）聚焦云优先商业化路径 的离子阱系统；Quantinuum（Honeywell
              分拆）以高保真离子阱硬件追逐企业和制药客户。IQM 的本地部署模式在主权和所有权上形成差异化，但要求客户承担资本开支——购买摩擦高于云访问。
