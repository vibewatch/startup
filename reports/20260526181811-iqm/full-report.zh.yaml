  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与 SKU 地图
        blocks:
          - type: paragraph
            body: >
              IQM 的商业产品线横跨四类产品，覆盖从教育到 HPC 级研究的不同市场板块。IQM Spark 是面向大学和研究中心定价的 5-qubit 本地部署系统；它采用 IQM Crystal
              拓扑和可调耦合器，已被意大利 Cineca 的 Lagrange 安装以及韩国 Chungbuk National University 选用。IQM Radiance 面向高性能计算中心，配置包括 20、54
              和 150 qubits（Crystal 20、Crystal 54、Crystal 150），都具备完整方格晶格连接、所有相邻量子比特对之间的可调耦合器，以及用于 HPC 集成的软件栈。Radiance 20
              已部署在 LRZ（Leibniz Supercomputing Center）、ORNL 和 Aalto University；Radiance 54 计划用于 CESGA；Crystal 150 是 VTT
              旗舰。IQM Halocene 是最新产品线，2025 年 11 月发布，面向量子纠错研究时代，采用模块化开放平台架构，支持最多 5 个高质量逻辑量子比特、模块化解码器架构和 NVIDIA NVQLink
              兼容，目标在 2026 年底前商业可用。IQM Resonance 是公司位于 resonance.iqm.tech 的云平台，提供 IQM Star 24（24-qubit、高连接度 Star 拓扑）和
              Crystal 54 硬件访问，以 Qrisp 作为默认 SDK，同时支持 Qiskit、Cirq 和 CUDA Quantum。IQM 硬件还可通过 Amazon Braket 获取（IQM
              Garnet：20-qubit Crystal；IQM Emerald：54-qubit Crystal 54）。公司称其 Espoo, Finland 设施每年制造 20 台本地部署量子计算机。
