      - number: '8.2'
        title: 投资建议与估值背景
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月 26 日，投资建议为「继续研究（research-more）」。主要门槛是 SPAC 执行风险（二元结果）以及对未经审计 FY2025 财务指标的依赖。在确认 SPAC
              交割并发布经审计 FY2025 财务数据前，任何入场价格都无法做出足够精确的风险调整。如果两个门槛都正向清除，「买入（buy）」的估值逻辑会变得有吸引力：IQM 约 51x
              的隐含收入倍数是所有已上市纯量子公司中最低的，仅完成上市就能提供结构性重估催化剂。

              融资背景支撑乐观逻辑：IQM 2025 年 9 月 Series B（$320M，投后约 $1.0B）之后六个月，SPAC 交易前估值达到 $1.8B——80% 抬升反映商业动能改善。SPAC 后预计现金
              >$450M（包括 $175M 信托、$134M PIPE 和现有现金），按当前烧钱速度（年亏损约 €54M）足以支撑运营至 FY2028。2026 年 3 月提取的 €50M
              债务工具提供额外流动性。订单积压超过 $100M，给高于 FY2025 ≥$35M 基数的收入提供可见性。对该建议的置信度为中，反映底层数据质量。风险评级为高：SPAC
              执行风险、未经审计财务、行业倍数波动和尚未盈利阶段，都能独立支撑高风险判断。
