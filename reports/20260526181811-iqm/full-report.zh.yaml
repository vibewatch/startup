      - number: '5.4'
        title: 技术路线图与开发里程碑
        blocks:
          - type: paragraph
            body: >
              IQM 已发布的开发路线图把通往容错量子计算的路径拆成三个阶段。第一阶段（NISQ，2025–2026）：在大型系统中把双量子比特门保真度目标定在
              >99.94%；部署更先进的错误抑制与错误缓解技术；与研究伙伴交付面向模拟和优化场景的 NISQ 方案。第二阶段（QEC 验证机，2027–2028）：构建结合 QEC 和错误降低的大型系统；目标逻辑错误率落在
              10⁻⁵ 到 10⁻⁶；落地 QLDPC 码，相比表面码效率提升 2–10×；支持包含非 Clifford 门 的通用量子计算。第三阶段（容错，2030+）：实现全面启用 QEC
              的系统，拥有数百个高精度逻辑量子比特；目标逻辑错误率 10⁻⁹；扩展到 100 万个物理量子比特。具体技术里程碑包括：Crystal 150 是当前量产旗舰；IQM Star 24 是首个 Star 拓扑
              系统；IQM Constellation（结合 Crystal 和 Star）是计划中的 QEC 时代 QPU 架构；IQM Halocene 是 QEC 研究平台（150 个量子比特，2026
              年底商业化）。2025 年，IQM 在测试芯片上实现 99.95% CZ 保真度，达到行业里程碑。路线图列出三个高价值应用领域：模拟（到 2035 年 €28B
              市场）、优化（€18B）和量子机器学习（€26B），合计超过 €72B。公司还在 2026 年 5 月披露了向 VTT 交付 150 量子比特和 300 量子比特机器的时间表。制造端由 Espoo
              生产设施支撑，每年生产 20 台量子计算机；公司在 2025 年 11 月宣布了重大扩建计划（€40M 投资）。
