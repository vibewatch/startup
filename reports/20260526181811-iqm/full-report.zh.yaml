  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers 把自己定位为全栈超导量子计算公司，而不是零部件供应商或纯云 API 层。官方介绍页、产品页和投资人材料指向同一个核心身份：IQM
              制造本地部署量子计算机，提供云访问，并强调客户应能直接拥有和运营自己的系统。关键不只在于公司卖量子比特；IQM
              卖的是一套围绕主权、本地生态建设和高性能计算环境集成搭起来的运营模式。当前产品族覆盖入门级教育硬件、高端研究和 HPC 系统、面向容错的 Halocene 系列，以及 Resonance
              云环境。这种宽度说明，IQM 试图覆盖从人才培养、实验探索到机构级生产部署的完整成熟路径，因此公司概况不同于单一产品创业公司故事。
