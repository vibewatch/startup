      - number: '5.5'
        title: 信任、安全、合规与技术风险
        blocks:
          - type: paragraph
            body: >
              IQM 的质量保证靠几层内部能力支撑：受控洁净室里的自有制造、模块级电子测试、用于完整验证的专用系统组装区，以及自动化测试套件。低温芯片测试会在量产前筛出可用的 QPU
              单元；安装后，校准团队再到现场调校每套系统。从交付到安装通常少于 6 个月。IQM 没有公开 Resonance
              云平台或本地部署控制系统的网络安全认证、渗透测试结果或第三方安全审计报告——政府和国防客户会把这个缺口纳入审查。Resonance 平台是纯 JS Web 应用，可见 API 文档有限。作为一家芬兰私营公司（截至
              2026 年 5 月，处于 SPAC 流程中），IQM 的欧洲交付不受美国国家安全审查（CFIUS）约束，但计划中的美国上市以及美国部署（ORNL、University of
              Maryland）可能引来监管审查。出口管制敞口：在欧盟和美国出口分类框架下，超导量子计算机被视为两用技术；IQM 未发布公开的公司专项出口合规指引。SPAC 合并注册声明（Form F-4，2026 年 5 月
              14 日提交，SEC Accession 0001193125-26-222654）是首次公开财务披露。关键技术风险在于 IQM 依赖 NVIDIA NVQLink GPU-QPU 互连来做实时 QEC；如果
              NVIDIA 调整准入条款或定价，IQM 的 QEC 路线图可能延迟。另外，QLDPC 码落地时间表没有独立可验证的里程碑发布。
