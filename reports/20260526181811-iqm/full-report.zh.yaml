  - id: TV006
    title: 最终尽调追问表
    description: >
      Open diligence questions that must be resolved before converting "research-more" to "buy." Each topic identifies
      missing evidence, its materiality to the thesis, and the recommended diligence path.
    notes: |
      第 1–3 项是给出「买入」建议的阻断项；第 4–6 项虽重要但不阻断，前提是能通过二级来源拿到令人满意的替代证据。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入确认方法
        - FY2025 ≥$35M 究竟是 GAAP 确认收入，还是合同总额 / 订单额
        - 决定真实年化收入运行率，也决定倍数计算是否可靠
        - SEC 宣布生效后审阅完整经审计 F-4 文件；上市后要求投资者关系团队澄清
      - - 毛利率与销货成本（COGS）
        - 硬件毛利率（F-4 摘要当前未披露）
        - 硬件公司若毛利率 <20%，不持续稀释就无法自筹增长资金
        - SPAC 交割后的经审计财报；若延迟，用同业硬件系统作可比替代
      - - RAAC 赎回敞口
        - 交割时提交赎回的 RAAC 公众股东人数和比例
        - 最高赎回情景会把信托收益压到接近零；IQM 必须启动替代流动性
        - 交割前数周跟踪 RAAC Form S-4/A 更新和代理投票沟通
      - - 锁定期与业绩奖励结构
        - IQM 创始人、管理层和 Series B 投资者的 IPO 后锁定期
        - 锁定期一结束，内部人大量抛售会给新公众投资者带来压顶风险
        - F-4 注册声明生效后审阅完整锁定条款
      - - 客户收入集中度
        - FY2025 收入中前三大客户贡献比例
        - 流失任何一个大型机构客户，都可能明显压低收入
        - 在 SPAC 后年度报告或投资者日披露；财报电话会上直接追问
      - - 上市后分析师初始覆盖
        - 截至 2026 年 5 月，没有卖方分析师覆盖
        - 上市后的初始覆盖会给出公开目标价，并成为重估催化剂
        - 上市后 90 天内跟踪一线美国券商的初始覆盖
