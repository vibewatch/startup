      - number: '1.3'
        title: 融资历史、资本结构与投资人基础
        blocks:
          - type: paragraph
            body: >-
              IQM 的融资轨迹现在已成为公司身份的核心。历史材料显示，公司从种子轮和 €39 million Series A1，走到 €128 million A2 阶段融资，再到 2025 年 $320
              million（€275 million）的 Series B，累计融资超过 $600 million。到 2026 年，公司又叠加了一笔由 BlackRock 管理的 €50 million 融资包，并宣布按约
              $1.8 billion pre-money 估值进入公开市场交易。投资人组合值得注意：传统 VC、主权和养老金资本、企业战略资金、公开市场 PIPE 资本都在其中。这让 IQM
              比典型深科技硬件创业公司拥有更多融资来源，但也抬高了执行证明门槛：一旦 2025
              年收入、订单和预期交割后现金披露，承销逻辑就会从单纯技术承诺，转向商业化可信度。剩下的最大盲点是所有权集中度、清算优先权，以及公开市场流程前是否发生过老股交易。
