      - number: '6.3'
        title: 采用轨迹与增长模式
        blocks:
          - type: paragraph
            body: >
              IQM 的本地部署数量从 2021 年单个 VTT 安装点，增长到 2026 年横跨多个大陆的 10+ 套系统；公司称过去 12 个月全球本地部署交付排名
              #1。增长轨迹分三段：第一阶段（2019–2022）由芬兰、德国国家量子项目和 IQM 创始伙伴生态驱动；第二阶段（2023–2024），量子计算机开始进入超算中心采购，IQM 拿下首批竞争性 HPC
              标案（LRZ、ORNL 入选、IT4Innovations）；第三阶段（2025–2026）把地理足迹扩到亚太（韩国、日本、台湾），并在继续赢得国家实验室项目的同时引入私营企业采用。LUMI-Q
              联盟（九国）代表一份具有多国部署潜力的单一合同，亚洲的 Scientek 和 TOYO 分销网络也类似。CESGA 部署由 Telefónica 作为支持伙伴，显示电信垂直行业兴趣开始出现。云端方面，IQM 登陆
              Amazon Braket（2023 年起 Garnet 20q；2025 年 7 月起 Emerald 54q），带来全球开发者触达。Quantum Rings 平台向其生态免费开放 IQM
              硬件，承担开发者获取渠道。公开资料没有披露同比收入增长率、订单簿规模或获客成本数据；首份财务披露预计通过 SPAC 流程出现（Form F-4 已于 2026 年 5 月提交）。
