            body: >-
              相比 IQM 早期融资阶段画像，最重要的变化是公开可见的部署证据明显增加。2026 年 3 月和 4 月公告显示，Aalto University 在芬兰部署了第四套系统，TOYO
              完成日本首笔企业量子计算机采购，波兰的 Galaxy Systemy Informatyczne 完成首个私营企业采购。更多 2025-2026 年公告记录了与 Oak Ridge National
              Laboratory、EuroHPC 相关 LUMI-Q 基础设施的部署或集成工作，以及台湾渠道扩张。这些公告不能证明经常性软件经济性，但能说明 IQM
              不再只是在销售未来路线图。版图也已超出早期欧洲中心叙事：Oulu 强化芬兰 R&D，Maryland 锚定美国生态策略，APAC 渠道和企业活动支撑了 IQM
              争夺本地基础设施位置、而不是停留为单一实验室供应商的说法。开放问题不是部署是否存在，而是这些部署能否重复、经济性是否耐久。
