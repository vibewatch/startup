      - number: '6.4'
        title: 留存、续约与客户耐久性
        blocks:
          - type: paragraph
            body: >
              在国家实验室和超算中心客群中，IQM 的留存结构较强。VTT 与 IQM 的多年路线图至少延续到 2027 年（交付 300 量子比特 系统），说明共同开发历史和共享 IP 带来了深层机构锁定。CSC 的
              FiQCI 把 VTT 与 Aalto 系统连接在国家基础设施合同之下，这类合同通常持续 3–7 年。ORNL、CESGA 和 IT4Innovations
              都是政府资助机构，量子计算机预算绑定国家或欧盟级量子项目；合同耐久性取决于项目继续获得资金，因此主要风险是主权预算，而不是竞争性流失。私营企业客户（Galaxy
              Systemy、TOYO）是单系统买家，公开资料没有多年合同证据，早期企业流失很难判断。IQM 没有发布客户满意度指标、NPS 分数或续约率。第一条反向信号是：IQM 的客户群高度偏向政府资助机构（已知部署约
              85–90%），容易受到预算周期、政府采购延迟和两用技术采购地缘限制影响。没有 IQM 客户在公开宣布后取消或延迟采购；但鉴于可观察样本小、且大多数部署时间较近，缺少流失证据只能谨慎解读。2026 年 3
              月获得的 €50M 桥接融资和 SPAC 合并表明，公司尚未形成足以独立支撑运营的持续商业收入。
