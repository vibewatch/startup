companyProfile:
  summary: >-
    IQM Quantum Computers 是一家总部位于 Espoo 的芬兰量子硬件公司，2018 年从 Aalto University 和 VTT 体系孵化。它销售超导本地部署量子计算机，通过 Resonance
    提供云访问，也为国家实验室、超算中心、大学和部分企业买家提供集成服务。截至 2026 年 5 月，公开材料显示，IQM 累计融资超过 $600 million，已售出 23 套系统、交付 15 套，制造超过 30
    台量子计算机，并有一笔待完成的 RAAQ SPAC 交易，按约 $1.8 billion 的 pre-money 估值给公司定价。因此，IQM 同时具备真实部署证明和融资能力，但经审计的财务质量、治理细节和客户集中度仍有实质缺口。
