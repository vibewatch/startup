      - number: '7.5'
        title: 缓释措施、监控指标与放弃标准
        blocks:
          - type: paragraph
            body: >
              IQM 已采取多项风险缓释措施。出口管制方面：公司维护两用合规项目，且没有披露任何许可证违规。芬兰总部提供欧盟监管清晰度。供应链方面：Espoo 晶圆厂扩建（>€40 M
              资本开支）和自有芯片制造降低第三方制造风险；靠近 Bluefors 也带来地理供应链韧性。人才方面：IQM 的芬兰基地能接入 Aalto University 和 VTT Technical Research
              Centre 人才管线。客户集中度方面：美国量子技术中心（Maryland，2026 年 4 月）以及日本（Toyo
              Corporation）、台湾（Scientek）和波兰（Galaxy）的协议，释放客户群地理分散信号。SPAC 执行方面：$134 M PIPE 以 $10/share
              锁定（受惯常条件约束），即便在高赎回情景下，也为交割后现金提供下限。竞争方面：IQM 的本地部署模式创造切换成本，并已通过 ORNL（美国 DOE 实验室）采用得到验证。

              会打破投资逻辑的放弃标准：（1）SPAC 合并未能交割，且 12 个月内没有替代资本事件落地；（2）出口许可证被拒，导致无法向 ≥2 个已签约客户交付；（3）主要竞争对手（IBM、Google）在 2028
              年前交付容错验证系统，压缩 IQM 技术路线图的时间窗口；（4）FY2026 收入低于 $35 M（较 FY2025 无增长），显示商业化停滞；（5）Jan Goetz 在成为唯一 CEO 后 24 个月内离任。
