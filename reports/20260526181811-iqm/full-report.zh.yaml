  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              IQM 的核心乐观逻辑建立在四根支柱上。第一，IQM 已经建立起纯量子硬件公司中最大的已披露收入基础（FY2025 $35M+），向欧洲、亚洲和美国的 13 个机构客户售出 21 套系统——这个获客速度在 IPO
              前验证了商业就绪度。第二，IQM 的 SPAC 交易前估值 $1.8B 仅对应约 51x FY2025 收入，较 IonQ 的 ~365x、Rigetti 的 ~1,866x 和 D-Wave 的 ~3,551x
              倍数折价 86%。如果 IQM 上市后即便只重估到 IonQ 倍数的一半，也意味着企业价值超过 $6B——相对当前隐含定价有 3x+ 回报。第三，SPAC 后预计 $450M+
              现金余额可支撑运营和研发穿过关键容错概念验证窗口，近期无需稀释性融资。第四，IQM 的科学基础设施——VTT、Aalto University、ORNL、LRZ 伙伴关系和 Nature
              论文——为超导架构差异化提供可信支撑。

              反向逻辑同样有说服力。SPAC 结构引入二元执行风险：RAAC 股东可能选择全额赎回，导致信托资金塌缩，并迫使 IQM 以更差条款融资。F-4 明确承认 IQM
              历史上产生净运营亏损，且无法预测何时盈利；累计亏损已达 €232.2M。FY2025 ≥$35M 收入被描述为“未经审计”——审计后数字可能下修，或揭示收入确认细节（TCV vs.
              已确认收入）。毛利率未公开披露。更大的行业风险是倍数压缩：2025 年量子计算估值上行部分由情绪驱动，行业内任何一次商业里程碑落空，都可能把倍数拉回科技板块中位数。IQM
              还要面对资金雄厚的美国既有厂商和正在崛起的中国国家量子项目。
