      - number: '2.4'
        title: 增长驱动、约束与开放问题
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动很容易识别：对更高性能计算的需求上升，政府资金持续加码，公私合营基础设施项目增加，云访问扩大实验人群，行业也越来越相信优化、仿真和部分化学或药物工作负载可能早于通用容错产生价值。但同一批来源也说明商业化为什么难。人才稀缺，供应链专门化，低温和控制基础设施昂贵，量子比特
              错误率仍然关键，与经典系统集成并不简单，出口管制或国家安全顾虑会影响系统跨境流动。即便是乐观的行业组织，也仍然说有用应用还需要几年，而不是已经全面到来。对 IQM
              而言，市场逻辑既不是“只有炒作”，也不是“已经成熟”。这是一个真实但受瓶颈约束的基础设施市场，执行质量、生态建设和运营简化，决定大预测能否转化为真实装机经济性。
