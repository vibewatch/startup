  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入架构与变现模式
        blocks:
          - type: paragraph
            body: >-
              IQM 的收入来自四条不同流。第一，本地部署硬件销售是公司最高客单价渠道：机构买家（国家实验室、HPC 中心、大学）购买完整量子计算栈——稀释制冷机、QPU、控制电子设备和软件——并由 IQM
              现场交付和调试。合同规模未公开披露，但 €70M VTT 多年项目提供了一个数据点：这份由芬兰政府资助的合同，要在 2026 年中交付 150-qubit 系统、2027 年末交付 300-qubit
              系统，意味着项目周期内 平均年合同价值约 €10–20M per year。第二，IQM Resonance 提供自助云平台，Starter tier 免费（每月最多 30 credits），按量付费 tier
              按 $0.30 per second QPU 访问时间计费。第三，IQM 的 QPU（Garnet 20-qubit 和 Emerald 54-qubit）在 AWS Braket 上可用，定价为每个量子线路任务
              $0.30，另加每次 shot 费用，在无需 IQM 直接销售介入的情况下触达企业和学术用户。第四，按里程碑发放的政府资助——包括 €20.7M 芬兰国家资助（2020）和用于制造基础设施的 EIB €35M
              风险债贷款（2022）——提供非收入资本，支撑 R&D 和制造。硬件合同收入确认可能按完工百分比或里程碑验收标准走，因此 IPO 后披露收入可能呈现波动。截至报告日期，IQM 未披露任何收入、ARR、毛利率或
              EBITDA；所有收入指标仍是私营公司机密。
