      - number: '3.2'
        title: 画像：各竞争对手的规模、策略、目标客群与定价姿态
        blocks:
          - type: paragraph
            body: >-
              **IBM Quantum** 是全球规模最大、部署最广的量子计算平台。IBM 的量子计算机可通过 IBM Cloud 访问，也可在学术和研究场景直接本地安装。IBM Quantum System Two
              是其模块化、数据中心级架构，把多个 QPU 与经典计算结合。IBM 使用 300mm 半导体制造工艺生产超导 transmon 量子比特，并通过半自动化工具把处理器制造时间至少缩短一半。IBM
              不公布本地部署系统的单价；云访问按量子线路执行时间收费。IBM 的主要目标客户是大型企业和国家实验室，它们需要经过验证的经典 HPC 基础设施集成。IBM 的战略方向是借助模块化互连（l-couplers）和低温
              CMOS 控制电子开发，走向以量子为中心的超级计算并降低复杂度。


              **Google Quantum AI** 以研究组织而不是商业硬件供应商方式运作。它不向外部客户销售量子计算机；而是与精选合作伙伴协作，并通过 Google Cloud 提供 Willow 访问（私有 beta
              / 合作模式）。Google 对 IQM 的竞争威胁主要在前沿研究层面：Google 的可验证量子优势声明抬高了国家研究计划需要采购的技术标尺。


              **IonQ** 是上市公司（IONQ on NYSE），通过 AWS、Azure 和 Google Cloud 销售其离子阱系统的云访问。IonQ
              正从量子计算扩展到量子网络、量子安全（QKD）、量子传感和太空基础设施。IonQ 的离子阱路线相较 IQM 的超导 Radiance（99.5% 典型值），提供更高双量子比特保真度（声称
              99.99%），但门速度更慢，扩展到数千个物理量子比特的技术难度更高。IonQ 路线图最终指向 2 million 个物理量子比特，但从离子阱演示设备走到这一规模的路径尚未被证明。


              **Quantinuum**（Honeywell Quantum Solutions + Cambridge Quantum）运营 Helios 及其 H-series 离子阱处理器。QCCD
              架构支持全连接，大幅降低相较超导方格 lattice 设计的 SWAP 开销。Quantinuum 通过 Microsoft Azure 和直接订阅分发。Quantinuum
              的战略重点是面向化学、材料仿真和网络安全的容错量子计算。Quantinuum 的保真度声明在离子阱领域最强，直接与 IonQ 竞争；其 Microsoft Azure 销售路径让它相较 IQM
              拥有更强的企业分发。


              **Rigetti Computing**（RGTI on NASDAQ）是 IQM 最直接的技术模态同行 —— 两者都使用带可调耦合器的超导 transmon 量子比特。Rigetti 的
              Cepheus-1-108Q（107 个量子比特，2026 年 4 月部署）在量子比特数量上略高于 IQM Radiance 当前标准 20-qubit 配置，但只在云端提供。Rigetti FY2024
              10-K 文件显示，公司持续亏损（FY2024 净亏损 $201M，FY2023 为 $75.1M），且高度依赖美国政府合同（FY2024 收入的 89.4%）。这给 IQM
              自身财务提供了警示模型：没有本地部署硬件收入，纯云量子服务在当前阶段仍处于商业化前期。


              **D-Wave** 聚焦组合优化的量子退火，覆盖物流、排班和金融等工业应用。D-Wave 收购 Quantum Circuits Inc. 后获得门模型能力，但它对 IQM 的主要竞争威胁在优化场景，NISQ
              超导计算机也在争夺这些应用。D-Wave 明确用三条标准对标 量子竞争对手，并围绕 "deflating the hype" 组织大量营销，隐含主张 NISQ 门模型供应商，包括 IQM
              这类公司，仍未证明足够商业价值。
