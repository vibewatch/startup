  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与出口管制风险
        blocks:
          - type: paragraph
            body: >
              IQM 处在量子物理与地缘政治的交叉点。根据欧盟 Regulation (EU) 2021/821（EU Dual-Use Regulation）以及芬兰《两用品出口管制法》（Laki
              500/2024），量子计算机被归类为两用物项。两个制度都要求：向受限终端用户出货超过阈值量子比特数或性能基准的系统前，必须取得出口许可证或国家安全批准。IQM
              多个客户所在司法辖区——日本、台湾、沙特阿拉伯、波兰——出口管制分类仍在变化。IQM 于 2026 年 5 月 14 日向 SEC 提交的 F-4
              注册声明明确把出口管制收紧列为重大风险因素，并指出欧盟成员国和美国对量子计算的“出口管制正在快速演变并收紧”。Wassenaar Arrangement 参与国正在主动复核 Category 3
              electronics 下的量子技术分类。另外，IQM 的 F-4 披露，SPAC
              完成后，任何美国注册实体及其子公司都必须遵守美国制裁（OFAC）。公开资料没有披露出口许可证违规或执法行动；但监管不确定性已经成为 IQM 国际订单簿的结构性逆风。

              法律风险也来自 F-4 注册流程本身：SEC 必须宣布注册声明生效，SPAC 才能交割；SEC 任何重大意见函都可能把合并拖过 IQM 的现金跑道窗口。F-4 还显示，IQM
              技术受欧盟资助研究中的政府资助机构权利约束，可能限制 IP 商业化。截至提交日期，未披露任何未决或受威胁诉讼。
