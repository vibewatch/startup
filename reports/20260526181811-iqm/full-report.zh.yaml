      - number: '5.3'
        title: 软件栈、云平台与 HPC 集成
        blocks:
          - type: paragraph
            body: >
              IQM 的全栈软件覆盖量子编程框架、编译工具、自动校准和 HPC 集成中间件。IQM SDK（开源，Apache 2.0 许可证，PyPI 上为 iqm-client，GitHub 仓库为
              iqm-finland/sdk）提供 IQM 量子计算机的客户端接口。IQM Resonance 默认前端框架是 Qrisp，这是一门开源高阶量子编程语言；同时支持 Qiskit、Cirq、CUDA
              Quantum 和 TKET。量子编译器将高阶线路翻译为原生 IQM gates（X/Y rotations 和 CZ）；自动校准软件维持最优参数值。本地部署客户和 Resonance
              云用户都可获得脉冲级访问，支持研究级实验控制。resonance.iqm.tech 上的 IQM Resonance 平台提供多框架支持、群组和用户管理、任务调度，以及不做隐藏线路修改的透明执行。IQM
              发布了一个 QAOA 开源库，用于量子优化算法研究。HPC 集成方面，IQM 交付专门 SDK，让量子任务可直接从超算任务调度器调度（LRZ 的 Munich Quantum Software Stack
              已演示）。IQM 区分 "loose HPC integration"（量子与经典独立调度但共址部署，如 LRZ）和计划中的 "tight HPC integration"（优化数据移动和延迟）。公司发布了
              HPC Integration Guidebook，帮助 HPC 中心。2026 年 5 月，IQM 推出 HPC Integration Service 产品。2026 年 4 月 14 日，IQM 宣布使用
              NVIDIA Ising models 的 AI 驱动智能体校准，可并行校准量子比特，减少对现场量子工程专业能力的依赖。IQM 还与 Zurich Instruments 和 NVIDIA 合作开发
              NVQLink，用于实时 QEC GPU-QPU 互连（2026 年 3 月宣布）。
