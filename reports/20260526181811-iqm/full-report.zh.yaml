  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与获客地图
        blocks:
          - type: paragraph
            body: >
              IQM 的客户群可以分成四个清晰客群。第一类是国家量子基础设施项目——由国家支持、建设并运营国家量子计算设施作为研究基础设施的机构。这个客群包括 VTT Technical Research Centre of
              Finland（IQM 的创始参考客户和技术伙伴）、CSC/FiQCI（Finnish Quantum Computing Infrastructure，托管 Helmi 和 Aalto University 的
              20 量子比特系统），以及 LUMI-Q 联盟（九国 EuroHPC 联盟，在捷克共和国 IT4Innovations 部署 IQM Star 24 系统）。第二类是 HPC
              超算中心——把量子硬件接入高性能计算环境的机构。这个客群包括 LRZ（Leibniz Supercomputing Center，德国；2024 年 20 量子比特 Radiance）、ORNL（Oak
              Ridge National Laboratory，美国；Radiance 20q 被选为首台本地部署量子计算机）、CESGA（Galicia Supercomputing Center，西班牙；计划到 2026
              年 6 月部署 54 量子比特 Radiance + 5 量子比特 Spark）、Cineca（意大利；Lagrange 系统），以及 Aalto University（芬兰；20 量子比特 HPC
              连接系统）。第三类是学术与研究型大学——采购 IQM Spark 用于教学、算法研究和量子技能培养的机构。这个客群包括 Chungbuk National University（韩国；首个亚太 IQM
              系统）、WUST（波兰；首个波兰超导量子计算机）、Poznan University of Technology（波兰；2026 年亮相），以及 University of Maryland（美国；IQM
              量子技术中心 2026 年开业）。第四类是早期企业采用者——购买 IQM 硬件或使用云访问的私营公司。Galaxy Systemy Informatyczne（波兰）在 2026 年 4 月公开宣布成为首家购买
              IQM 量子计算机的私营企业。TOYO Corporation（日本；分销协议 + 首个企业采购，2026 年 4 月）和 Scientek Corporation（台湾；经销协议）把 IQM
              的触达延伸到亚太企业市场。DATEV（德国）正在合作探索组合优化场景。
