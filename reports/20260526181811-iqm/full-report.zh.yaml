      - number: '5.2'
        title: 硬件架构与 QPU 设计
        blocks:
          - type: paragraph
            body: >
              IQM 的 QPU 基于超导 transmon 量子比特——这是一种成熟量子比特技术，源自 Josephson 结电路，具备高可重复性，并兼容标准微波控制电子设备。两种自研拓扑区分了 IQM 硬件。IQM
              Crystal 拓扑将量子比特排成 2D 方格晶格，每对相邻量子比特之间都有可调耦合器；这让系统可以跑快速（20–40
              ns）的并行双量子比特门，并在非门操作间隔让耦合器相互作用完全处于空闲状态，把串扰降到最低。IQM Star 拓扑引入中央计算谐振器枢纽，连接大量量子比特，在减少高连接需求算法所需 SWAP
              操作的同时，提供接近全连接的有效连接度；IQM Star 24（24-qubit）是首个商业 Star 系统，可通过 Resonance 云平台访问。第三种拓扑是 IQM Constellation，结合
              Crystal 和 Star 元件，计划作为量子纠错的可扩展架构，构成 QLDPC 路线图基础。硬件栈包括 QPU、将温度维持在约 15 mK 的稀释制冷机、布线和滤波子系统，以及发送 microwave、RF
              和 DC 信号的自研控制电子设备。Crystal 20 生产系统关键性能指标包括：1-qubit gate fidelity 最低 ≥99.7%、典型值 ≥99.9%；2-qubit CZ gate
              fidelity 最低 ≥98.0%、典型值 ≥99.0%；readout fidelity 典型值 ≥97%；quantum volume 32；CLOPS 2600；Q-score 11。2025 年，IQM
              在 two-qubit test chip 上实现 99.95% peak CZ fidelity。公司在 Espoo 设施内部洁净室制造 QPU，并靠低温芯片测试在生产前识别可用单元。
