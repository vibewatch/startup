  - id: TV005
    title: 投资逻辑破裂与终止触发表
    description: >
      Events or data points that would require immediate reclassification of the IQM recommendation from "research-more"
      to "sell" or "avoid."
    notes: |
      终止触发项需持续监控。任何单一一级触发项都足以立即卖出 / 回避，不应等待下一次正式复盘周期。
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - SPAC 交易失败
        - 宣布终止交易或撤回 F-4 注册
        - 所有美国上市催化剂以二元方式消失；IQM 必须以可能更差的条款私下融资；估值重新锚定到 Series B（投后 $1.0B）
        - 立即卖出 / 回避；老股交易下行至 Series B 水平或更低
      - - 经审计收入不及预期
        - 经审计 FY2025 收入 <$28M（较未经审计 ≥$35M 估计低 >20%）
        - 摧毁核心估值逻辑；下调收入倍数参考点；暴露执行问题
        - 立即降级为卖出；按经审计实际值重新评估
      - - 板块倍数塌缩
        - IonQ 市值跌破 $9B（较约 $23.6B 压缩 >60%）
        - 指向全板块估值下修；IQM 倍数同比例压缩；EV 重新锚定在接近悲观情景（$875M）
        - 减仓 / 退出仓位；若板块在 90 天内企稳，再重新评估
      - - 重大未披露负债
        - 发现 F-4 风险因素未披露的监管、法律或财务负债（敞口 >$50M）
        - 治理 / 披露质量打穿投资逻辑；SPAC 投资者撤回 PIPE
        - 立即卖出 / 回避，等待完整调查
      - - 赎回超预期
        - RAAC 股东赎回信托资金 >80%；IQM 到账净现金 <$90M
        - 若不新融资，资金不足以支撑超过 18 个月的烧钱速度（€54M/年）；很可能触发稀释性紧急融资
        - 交割时重新评估；只有 IQM 已确认过桥融资承诺时才接受
