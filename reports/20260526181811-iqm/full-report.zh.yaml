      - number: '3.4'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              IQM 最可防守的竞争位置，是三件事叠在一起：（1）欧洲内部芯片制造（Espoo, Finland），（2）面向国家量子计划的主权本地交付，（3）由多年维护和云平台合同巩固的机构关系。VTT 合同（2026 年中
              150-qubit 系统，2027 年末 300-qubit）是最清晰锚点：一旦 VTT 运行 IQM 硬件，并让研究人员在 IQM 软件栈上训练，迁移到竞争平台就会带来显著成本和迁移风险。


              但几个替代风险是真实的。IBM 的规模和全球分发能力，让它有能力用有吸引力的价格或合作方案回应欧洲国家量子计划；美国 National Quantum Initiative 和 EU Quantum
              Flagship 都涉及 IBM。Google 的 Willow 芯片展示了随量子比特数量增加的指数级错误降低，如果可扩展，最终可能直接越过超导 NISQ 平台。IonQ 和 Quantinuum
              的离子阱路线如果更早实现容错纠错，可能改变容错工作负载的首选平台。


              IQM 本地部署客户的中期切换成本很高。大学或国家实验室一旦购买、安装并训练使用 IQM 系统，就已经投入校准流程、自定义脉冲级代码、本地 HPC
              基础设施集成和人员专长。迁往不同硬件平台，需要重写算法、重新训练操作人员，还可能要更换低温基础设施——这是一个重大的多年承诺。云端切换成本更低：IQM Resonance 与 IonQ Cloud、IBM
              Quantum Cloud 竞争于同一商品化层，客户可通过框架适配器（Qiskit、PennyLane、CUDA-Q）轻松多平台并用。


              本地部署可以缓解多平台并用风险，但云端风险很尖锐。IQM 发展云业务（IQM Resonance）的能力，受限于目前只集成 AWS Braket；它缺少 IonQ 和 Quantinuum 已经拿到的 Azure
              和 Google Cloud Marketplace 直接入口。如果企业买家把云量子作为默认采购方式并绕过本地部署板块，这个渠道缺口就是实质风险。


              IQM 的 300+ 项专利申请构成技术护城河，但量子计算专利版图已经挤满 IBM、Google 和学术机构申请，交叉授权或设计绕行风险不低。最持久的竞争优势可能不是技术
              IP，而是运营能力——比任何对手更快地在多个大洲交付并维护 30+ 套可运行系统。
