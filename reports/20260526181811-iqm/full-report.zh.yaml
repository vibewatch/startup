  - id: FV001
    title: 推荐逻辑
    type: flow
    insight: >
      “research-more” 建议来自三类风险同时收敛：SPAC 执行非成即败、财务指标未经审计、板块倍数波动。三者无论单独看还是合起来，都不足以支持明确的 “buy” 入场。升级到 “buy” 需要两个顺序确认事件：SPAC
      完成交割，以及审计后收入得到验证。若 SPAC 交易失败或收入重大不及预期，终止路径立即触发。
    data:
      nodes:
        - id: n1
          label: 商业牵引（正面）
          description: 已售出 21 套系统、13 个客户、$100M+ 预订、FY2025 收入 ≥$35M
        - id: n2
          label: 估值折价（正面）
          description: 收入倍数约 51x，而美国上市同业约 365–3,551x；较同业平均折价 86%
        - id: n3
          label: SPAC 执行风险（高）
          description: SPAC 交割非成即败；RAAC 赎回风险可能把信托收益压到近零
        - id: n4
          label: 未审计财务数据（谨慎）
          description: FY2025 收入 ≥$35M 未经审计；毛利率未披露；审计可能修正数字
        - id: n5
          label: 板块倍数波动（风险）
          description: 2025 年量子板块重估可能逆转；IonQ 带动的压缩会拉低 IQM 倍数
        - id: n6
          label: 继续研究建议
          description: 观望；SPAC 完成交割且审计收入确认后再启动；避免在交割前入场
      edges:
        - from: n1
          to: n6
          label: 支撑升级路径
        - from: n2
          to: n6
          label: 上市成功则有重估上行
        - from: n3
          to: n6
          label: 交割确认前阻断买入
        - from: n4
          to: n6
          label: 审计完成前阻断买入
        - from: n5
          to: n6
          label: 限制目标倍数区间
    sourceRefs:
      - SV009
      - SV011
      - SV001
  - id: FV002
    title: 估值敏感性
    type: bar
    insight: >
      IQM 估值对所采用的收入倍数高度敏感。按当前隐含约 51x，IQM 较所有上市同业都有大幅折价。即便保守重估至 75x（基准情形），企业价值也升至约 $2.6B，高于 SPAC
      交易前估值。关键敏感性不在收入增长，而在倍数扩张；后者更多取决于板块情绪和上市后机构需求，而不是近期基本面。
    data:
      items:
        - label: 熊市情形：25x FY2025 收入（$35M）
          value: 875
          unit: $M EV
        - label: SPAC 交易前估值（$1.8B，隐含约 51x）
          value: 1800
          unit: $M EV
        - label: 基准：75x FY2025 收入（$35M）
          value: 2625
          unit: $M EV
        - label: 乐观：150x FY2025 收入（$35M）
          value: 5250
          unit: $M EV
        - label: IonQ 对标：365x FY2025 收入（$35M）
          value: 12775
          unit: $M EV
    sourceRefs:
      - SV009
      - SV001
      - SV002
  - id: FV003
    title: 估值 / 回报区间
    type: range
    insight: >
      从 SPAC 交易隐含的 $1.8B 投前价格出发，悲观、基准、乐观三种情景下的企业价值区间为 $875M 至 $5.25B。悲观情景相对当前隐含价格约亏损 51%；基准情景仅有 46%
      溢价。区间拉得很开，根源在三点不确定性：（1）SPAC 能否完成交割，（2）审计后财务数据与未经审计估算相差多大，（3）上市后板块倍数会落在哪里。
    data:
      items:
        - label: 悲观情景企业价值
          low: 700
          high: 1050
          mid: 875
          unit: $M
        - label: 基准情景企业价值
          low: 2200
          high: 3000
          mid: 2625
          unit: $M
        - label: 乐观情景企业价值
          low: 4500
          high: 6000
          mid: 5250
          unit: $M
        - label: SPAC 投前参考值
          low: 1800
          high: 1800
          mid: 1800
          unit: $M
    sourceRefs:
      - SV009
      - SV002
      - SV001
  - id: FV004
    title: 投资 KPI
    type: kpi
    insight: >
      IQM 的投资 KPI 呈现两组相反信号：商业牵引强（收入规模、订单、客户数），但财务风险高（尚未盈利、指标未经审计、依赖 SPAC）。收入倍数折价是最突出的正面 KPI，但只有 SPAC
      完成交易、审计后指标证实商业叙事，它才会转化为 alpha。
    data:
      items:
        - label: 隐含收入倍数
          value: ~51x
          status: confirmed
          note: $1.8B 投前估值 / ≥$35M FY2025 收入；较同业平均（约 714x）折价 86%
        - label: FY2025 收入（未经审计）
          value: ≥$35M
          status: estimated
          note: F-4 显示未经审计；审计状态需等 SPAC 交割确认
        - label: 订单积压总额
          value: '>$100M'
          status: confirmed
          note: 据 F-4 文件；相当于 FY2025 收入的 >2.9x
        - label: 客户数
          value: 13
          status: confirmed
          note: 向 13 家机构客户售出 21 套系统；已交付 15 套
        - label: SPAC 后预计现金
          value: '>$450M'
          status: estimated
          note: 需视赎回情况而定；$175M 信托 + $134M PIPE + 现有现金
        - label: 毛利率
          value: Undisclosed
          status: missing
          note: SPAC 前材料未披露；评估单位经济性时这是关键指标
        - label: Series B 轮投后估值（2025 年 9 月）
          value: ~$1.0B
          status: confirmed
          note: Ten Eleven Ventures 领投；到 2026 年 2 月 SPAC 投前估值 $1.8B，估值抬升 80%
        - label: FY2025 净亏损
          value: ~€54.4M
          status: confirmed
          note: 与 FY2024（€54.1M）几乎持平；累计亏损 €232.2M
    sourceRefs:
      - SV009
      - SV001
      - SV012
      - SV016
