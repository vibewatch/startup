      - number: '3.3'
        title: 能力、定价和 GTM 对比：本地部署 vs 云优先、保真度基准与分发触达
        blocks:
          - type: paragraph
            body: >-
              机构量子计算客户——国家实验室、HPC 中心、大学或深科技企业——的关键购买标准包括量子比特数量、门保真度、硬件控制访问（脉冲级 vs 门级）、部署模式（本地部署 vs 云）、地理数据主权、与经典 HPC
              的集成，以及总拥有成本。


              **量子比特数量和保真度**：IBM 在原始量子比特数量上领先（可用 2,300+），但 IQM 的 Emerald 54-qubit 芯片达到 99.93% 单量子比特保真度中位数和 99.5% CZ
              保真度中位数 —— 足以与最好的超导系统竞争。IQM Spark 在其 5-qubit 大学系统上实现 ≥99.9% 典型单量子比特保真度。Rigetti 的 Cepheus-1-108Q 给出 99.84%
              单量子比特和 98.84% CZ 保真度。离子阱系统（IonQ、Quantinuum）实现更高的单门保真度（IonQ 为 99.99%），但量子比特数量更低、门速度更慢。


              **硬件访问**：IQM 提供完整脉冲级硬件访问——IBM cloud 默认不提供这个功能——这对需要自定义量子比特控制、给 error channels
              做基准测试、开发硬件特定算法的研究实验室很关键。这是欧洲和亚洲研究实验室客群的真实差异化点。


              **部署模式**：IQM 是唯一拥有专门本地部署产品线的主要供应商，覆盖 5 qubits（Spark）、20/54 qubits（Radiance）和 24-qubit 星型拓扑设备（Star
              24），同时提供云服务（IQM Resonance）。IBM 也销售本地部署系统（IBM Quantum System Two），但主要面向 HPC 和数据中心级部署。Rigetti、IonQ 和
              Quantinuum 以云优先（Quantinuum 更准确说 Microsoft-Azure-first）为主。D-Wave 通过本地和云两种方式提供 Advantage2。


              **定价**：IQM Resonance 云定价从免费（Starter tier，每月 30 credits）到按量付费 QPU 访问
              $0.30/second。本地部署硬件价格未公开列示；基于政府合同披露，HPC 集成系统的估计合同价值在数百万欧元区间。IBM、Quantinuum 和 IonQ
              都采用定制企业定价，本地部署或大规模云用量没有公开标价。


              **GTM 和分发**：IBM 和 Google 依托既有云和企业销售渠道分发，拥有深厚存量关系。IonQ 和 Quantinuum 通过主流云市场集成（AWS、Azure、Google Cloud）扩张，IQM
              尚未完全匹配。IQM 与 Garnet、Emerald 接入 AWS Braket 是起点，但 IQM 核心销售路径
              依赖直接机构销售、政府合作，以及欧洲（芬兰、德国）、APAC（日本、韩国）和美国的国家量子计划。
