      - number: '7.3'
        title: 技术、供应链与制造风险
        blocks:
          - type: paragraph
            body: >
              IQM 的技术路线图指向 2027–2028 年量子纠错验证机，以及 2030+ 的容错系统。这要求从当前 Radiance 系统（最高 150
              个量子比特）扩展到数百万量子比特架构——没有竞争对手做到过。2025 年 11 月为纠错推出的 Halocene 产品线仍处于部署前开发。IQM 的 F-4
              风险因素明确列出“开发我们超导技术路径中的技术挑战”和“制造能力限制”等业务风险。超导量子比特的物理错误（退相干、门保真度不足）必须降低约 4–5 个数量级才能达到容错。公司的芯片制造目前集中在芬兰 Espoo
              洁净室（7,250 sqm 企业、研发和制造空间，另有 Espoo 生产空间）以及由 >€40 M 支持的计划扩建。

              供应链集中度很高。稀释制冷机是把量子比特冷却到接近绝对零度的关键设备，主要由 Bluefors 供应；Bluefors 是从 Aalto University 分拆出的芬兰公司。IQM 的 Espoo
              运营地点靠近 Bluefors，但全球稀释制冷机市场是寡头格局（Bluefors、Oxford Instruments、Leiden Cryogenics），交期 12–18 个月。控制电子设备依赖 Zurich
              Instruments 系统（IQM 与 ZI 和 NVIDIA NVQLink 有联合 QEC 验证机）。任何单一供应商失效、美国对低温组件的贸易限制、或生产良率下降，都会直接推迟客户交付。截至运行日，IQM
              已交付 15 套系统、建成 30+ 套，并向 13 个客户售出 21 套系统——这是一个小但在增长的管线，每一次交付延迟都会对收入产生放大影响。
