            body: >-
              截至报告日期，IQM 仍是 pre-IPO 公司，不受公开披露要求约束。对 SEC EDGAR 数据库的搜索确认，截至 2026 年 5 月 26 日，没有以 "IQM" 名义提交的 S-1、F-1
              或注册声明——IPO 公告于 2026 年 2 月 23 日发布，但招股书文件
              还未提交。仍未披露的关键财务指标包括：年度收入、ARR、已确认合同积压、毛利率、EBITDA、经营现金流、现金及等价物、总债务和客户集中度指标。唯一确认的资本事件是各轮融资（Seed 至 Series B）和
              EIB loan，加上 VTT 合同这个部分收入锚点。重大尽调阻塞项包括缺少：（1）多年收入趋势，（2）用于评估定价权的硬件毛利率，（3）烧钱速度和 Series B
              后现金跑道，（4）客户合同集中度数据。可比同行路径（IonQ：2021 年 10 月按 $2B SPAC 估值 IPO，FY2025 收入 $130M 但仍亏损；Rigetti：2022 年 3 月按 $1.5B
              SPAC 估值 IPO，FY2024 收入 $10.8M，仍亏损）说明，IPO 后 IQM 将必须发布季度业绩，但短期盈利不太可能。投资人在招股书前推进，实质是在有限财务能见度下承销商业化前量子硬件风险。
