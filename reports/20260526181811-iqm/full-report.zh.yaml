            body: >-
              可获得的市场估算大体都认同增长，但对机会规模分歧很大。Precedence Research 估计市场 2025 年为 $1.44 billion，2035 年达到 $19.44 billion；Grand
              View 估计 2024 年为 $1.42 billion，2030 年达到 $4.24 billion；MarketsandMarkets 认为 2025 年为 $3.52 billion，2030 年升至
              $20.20 billion；QED-C 称 2025 年整体量子市场为 $1.9 billion，其中计算超过 $1.4 billion，到 2028 年将超过 $3 billion；IQM / Omdia
              则认为到 2032 年将超过 $22 billion。这些差异不小，说明类别边界不稳定，一些报告纳入了更宽的服务或相邻量子层，也说明任何单一 TAM
              标题都太脆弱，不能单独支撑承销。市场当然有意义，但更好的尽调习惯是同时使用多个口径，并把它们落到具体买方路径、部署模式和应用场景 就绪度，而不是押注一张乐观预测图。
