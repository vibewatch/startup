      - number: '1.5'
        title: 里程碑、风险信号与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              IQM 的里程碑密度在仍属私营的量子硬件公司里并不常见：2018 年成立，早期机构部署，2025 年创欧洲纪录的 Series B，设施扩张，领导层重组，经 SPAC
              进入公开市场的路径，以及覆盖芬兰、波兰、日本、德国和捷克的客户里程碑。这条序列支持一种投资逻辑：公司正从生态建设走向商业基础设施。但公司自己的法律和融资披露也提醒，量子计算仍是新兴技术，技术挑战重大，经营历史有限，历史上亏损，依赖持续融资，并暴露于政府或国家资助客户。这些不是边缘
              限定条件，而是直接决定 IQM 应如何被评估的核心变量。公开材料足以确立公司身份、资本获取能力和真实部署，但还不足以精确回答股权结构控制、客户集中度或经常性收入质量。
