      - number: '8.3'
        title: 乐观、基准与悲观估值情景
        blocks:
          - type: paragraph
            body: >
              以 IQM FY2025 ≥$35M 收入作为共同基础指标，并以同行收入倍数为锚，构建三个情景。每个情景都是离散的，并明确绑定 SPAC 执行、收入确认和行业倍数走势假设。

              乐观情景采用 150x 收入倍数——约为 IonQ 当前 ~365x 的 41%，且远低于 Rigetti 的 ~1,866x——对应企业价值约 $5.25B。该情景假设 SPAC 成功交割、经审计收入确认
              ≥$35M、上市后指引暗示 50%+ YoY 增长，且行业倍数维持在当前水平或更高。概率信号：低（≤20%），取决于多个条件同时对齐。

              基准情景采用 75x 收入倍数，对应企业价值约 $2.625B，与 $450M 现金注入后约 ~$2.25B 的 SPAC 投后估值大体一致。该情景要求 SPAC
              交割、经审计收入与未经审计估计一致、行业倍数保持在当前水平附近。考虑量子计算板块估值当前轨迹，这是最可能结果。概率信号：中（40–50%）。

              悲观情景采用 25x 收入倍数——甚至低于 IQM 自身 SPAC 定价隐含的行业底部——对应企业价值约 $875M，较 $1.8B 交易前估值折价约 ~51%。该情景覆盖 SPAC
              失败或行业整体严重降估值（例如 70%+ 倍数压缩、领先量子公司出现重大商业挫折，或风险偏好长期收缩的宏观环境）。概率信号：低至中（25–35%），因二元 SPAC 风险而高于典型 IPO 前情形。
