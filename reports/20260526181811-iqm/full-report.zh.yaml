      - number: '6.2'
        title: 已具名部署与客户证明
        blocks:
          - type: paragraph
            body: >
              VTT Technical Research Centre of Finland 是 IQM 合作时间最长的客户兼技术共同开发伙伴。IQM 先为 VTT 建成 Helmi 量子计算机（5 个量子比特，VTT
              首套系统），之后又建成 VTT Q50（50 个量子比特，北欧最大公开可访问量子计算机，2025 年 3 月通过 FiQCI 开放）。根据公开路线图，VTT 计划在 2026 年接收 150 量子比特 IQM
              Crystal 系统、2027 年接收 300 量子比特 系统；VTT 因此既是 IQM 最先进、也是单一客户规模最大的项目。LRZ（Leibniz Supercomputing Center，德国
              Munich）在 2024 年部署 IQM Radiance 20q，作为 Munich Quantum Valley 计划的一部分，并以松耦合 HPC 集成配置搭配 Munich Quantum
              Software Stack 使用；IQM Radiance 产品页引用了 Cineca 总干事的话，称其相信量子会转化为商业机会。IT4Innovations（National Supercomputing
              Center，捷克共和国）运营 IQM Star 24（VLQ 系统，24-qubit Star 拓扑），连接 Karolina 超级计算机，通过 LUMI-Q EuroHPC 联盟部署，并于 2025
              年启用。ORNL（Oak Ridge National Laboratory，美国）选择 IQM Radiance 作为其首台本地部署量子计算机，最初计划 2025 年 Q3 交付；这是 IQM 首次向美国能源部
              实验室销售。CESGA（Galicia Supercomputing Center，西班牙）正在部署 54 量子比特 Radiance 和 5 量子比特 Spark，计划到 2026 年 6 月接入
              Finisterrae IV AI 超级计算机，项目由 Telefónica 支持。Chungbuk National University（韩国）在 2025 年安装 IQM Spark，是 IQM
              在亚太地区部署的首套系统。Galaxy Systemy Informatyczne（波兰）于 2026 年 4 月宣布成为首家购买 IQM 量子计算机的私营企业。IQM 硬件也可通过 Amazon
              Braket（IQM Garnet 和 IQM Emerald）以及 Quantum Rings 云平台访问。
