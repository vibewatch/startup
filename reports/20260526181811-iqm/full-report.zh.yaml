      - number: '8.5'
        title: 退出触发条件与最终尽调
        blocks:
          - type: paragraph
            body: >
              「继续研究（research-more）」只有在以下条件满足后才会转为「买入（buy）」：（1）确认 SPAC 交割（RAAC 股东投票通过、赎回低于最高阈值），（2）经审计 FY2025 收入
              ≥$35M，且收入确认方法明确（合同 vs. 已确认），（3）毛利率披露确认单位经济可接受（目标：该阶段硬件公司毛利率
              ≥30%），以及（4）上市后管理层指引展示经营杠杆——要么收入不变时亏损收窄，要么收入增长加速且成本不同比例增加。

              「卖出（sell）」触发条件包括：SPAC 交易破裂，或宣布以更低估值重组交易；经审计收入显著低于 $35M（低于预期 >20%）；行业整体倍数压缩超过 60%（IonQ 市值跌破 $9B）；或 F-4
              审查流程暴露重大未披露负债。Series B 到 SPAC 的当前 80% 抬升（2025 年 9 月至 2026 年 2 月）必须由商业牵引验证，不能只靠情绪。

              最终尽调优先事项包括：（1）F-4 全文公开后，审阅经审计财务和收入确认政策；（2）取得毛利率和 COGS 数据；（3）理解 IQM 创始人和早期投资者的锁定结构与 earn-out 条款；（4）量化 RAAC
              股东赎回敞口；（5）评估 IQM 政府部门收入集中度是否会在上市后报告环境中带来合同续约风险。截至 2026 年 5 月，没有独立分析师覆盖；上市后卖方启动覆盖将是关键估值信息催化剂。
