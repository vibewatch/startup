      - number: '7.2'
        title: 财务、烧钱与 SPAC 执行风险
        blocks:
          - type: paragraph
            body: >
              IQM FY2025 净亏损 €54.4 M，FY2024 净亏损 €54.1 M，截至 2025 年 12 月 31 日累计亏损 €232.2 M。FY2025 收入报告为 ≥$35
              M（未经审计，EUR/USD 1.174），对应约 $1.8 B 的 SPAC 交易前股权估值约 51× 收入。公司累计融资 $635 M+（股权、债务和公共补助），包括 Ten Eleven Ventures
              于 2025 年 9 月领投的 $320 M Series B，以及 2026 年 3 月提取的 €50 M 债务融资工具。SPAC 后目标现金为 >$450 M：$175 M 信托 + $134 M PIPE
              + $24 M 认股权证行权所得 + $172 M 现有现金（均截至 2025 年末）。关键财务风险在于 SPAC 执行：RAAQ
              公众股东可能在交割前赎回股份，侵蚀信托账户。按最高合同赎回情景，合并后公司现金会显著低于 >$450 M 的名义目标。F-4 披露，如果剩余收益 ≤$100 M，所有保荐人私募认股权证
              都将被没收——这说明治理结构对赎回水平敏感。IQM 的 F-4 也承认尚未建立可规模化商业模式，并称公司“预计每年将继续产生运营亏损和净亏损，直到我们产生重大收入”。2025 年 11 月作出的 €40 M
              芬兰晶圆厂扩建资本开支承诺，进一步增加现金消耗压力。

              烧钱风险的放弃标准：如果 SPAC 未能交割，且 IQM 无法在 12 个月内获得替代桥接融资，公司将需要裁员并推迟客户交付，削弱估值逻辑所依赖的商业动能。
