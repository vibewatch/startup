      - number: '2.3'
        title: 买方分层、部署模式与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一垂直行业更宽，但又窄于“所有企业”。结合市场报告和 IQM 自己的部署证据，当前最强的买方群体是超算中心、大学、国家实验室、公共部门生态项目，以及仍很小但已经可见的企业客群。报告持续指向
              BFSI、药物发现、材料科学、优化和机器学习等有吸引力的应用领域，但这些应用场景 不会走同一条采购路径。实践中，云访问降低了实验门槛；机构一旦越过基础实验，本地拥有权就会因为主权控制、IP 保留、安全和紧密
              HPC 集成而变得重要。IQM 进入 AWS
              Braket，说明它不能忽视云渠道；但它最差异化的商业逻辑仍是：客户最终会希望拥有系统，并把系统放进经典计算基础设施内运营。因此，采用路径是从探索，到混合集成，再到自有生产环境，而不是从纯 SaaS
              试用直接跳到大规模企业推广。
