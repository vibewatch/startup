      - number: '4.5'
        title: 资本充足性、融资历史与 IPO 背景
        blocks:
          - type: paragraph
            body: >-
              IQM 自 2018 年成立以来累计融资超过 €600M，跻身全球资本最充足的私营量子硬件公司。2025 年 9 月 €275M（$320M）Series B 由 Ten Eleven Ventures
              领投——这是 IQM 首个美国机构投资人——创下欧洲史上最大量子融资轮，也成为芬兰成长型公司迄今第四大融资轮。共同投资人包括 Elo Mutual Pension Insurance、Varma Mutual
              Pension Insurance、Companies of Schwarz Group、Winbond Electronics、European Innovation Council（EIC）和 Bayern
              Kapital。2026 年 2 月 23 日，IQM 宣布计划以约 $1.8B 初始估值在 Nasdaq 上市。截至报告日期，尚未提交 S-1 或 F-1。Series B 后资本位置看起来强：按估计
              $60–100M 年烧钱速度，单是 €275M Series B 就提供约 2.5–4 年现金跑道，说明 IQM 近期可在没有困境融资需求的情况下推进 IPO。募资用途可能包括：完成 VTT 300-qubit
              交付（2027 年末）、为新增商业本地部署订单扩产制造、发展 Resonance 平台、纠错 R&D，以及进入美国市场。$1.8B 初始估值比 Rigetti SPAC 估值（2022 年 $1.5B）高
              3×，但相较 IonQ 当前 $6.57B 总资产并不激进。美国 CHIPS and Science Act 中 $2.013B 量子意向书（美国商务部 2026 年 5
              月签署）释放出强劲的美国政府需求信号，偏向国内和盟友量子能力；这可能支撑 IQM 上市后的美国商业扩张。
