      - number: '8.4'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              可比样本由三家美国上市、纯量子计算公司组成，且都公开披露量子收入：IonQ（IONQ）、Rigetti Computing（RGTI）和 D-Wave Quantum（QBTS）。IBM 和 Google
              的量子项目嵌在多元化业务中，缺少独立量子收入，因此排除。Quantinuum 和 PsiQuantum
              是私营公司，没有公开财务指标，也被排除。该可比样本明确是代表性样本，并不穷尽；这反映了当前量子硬件公开市场格局仍然稀疏。

              可比分析最突出的发现，是 IQM 倍数折价的幅度。IonQ 是市值最大的纯量子公司（$23.6B），披露 TTM 收入最高（$64.7M），交易倍数约 365x
              收入——相较成熟科技公司倍数本身已偏高。Rigetti 和 D-Wave 的 TTM 收入明显更低（分别为 $4.4M 和 $2.86M），却分别交易在 1,866x 和
              3,551x——这些比率更多反映投机性配置，而不是近期盈利能力。IQM 在超过 $35M 收入基础上的 51x
              隐含倍数，是唯一接近尚未盈利硬件公司可辩护成长倍数的可比项。这同时创造了乐观逻辑（重估催化剂）和结构性风险（行业降估值拖累所有标的）。

              IQM 的模式——向机构买家交付本地部署的全系统——不同于 IonQ 的云优先模式，也不同于 D-Wave 的退火机架构。直接倍数比较并不完美，但仍有参考价值：IQM
              的收入来自硬件销售和服务收入，其毛利率特征不同于云访问费。直接毛利率比较需要等待 SPAC 后经审计披露。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV018
              - CV020
              - CV038
