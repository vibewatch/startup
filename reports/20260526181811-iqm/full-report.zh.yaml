              IQM 没有公开 Resonance 云平台或本地部署控制系统的网络安全认证、渗透测试结果、第三方安全审计报告。ORNL、University of Maryland 等国家实验室和政府客户在 IQM
              订单中的占比正在上升；缺少 FedRAMP、ISO 27001 或同等合规文件，是重大尽调缺口。
