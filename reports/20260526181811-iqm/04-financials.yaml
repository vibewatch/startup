  title: Financials
  summary: IQM is a pre-IPO, privately held quantum hardware company with over €600M in total financing and an announced February
    2026 Nasdaq listing at a $1.8B initial valuation. No S-1 or F-1 has been filed with the SEC as of the run date. Revenue
    is undisclosed; the company earns from on-premises hardware sales (government-anchored), IQM Resonance cloud subscriptions,
    AWS Braket marketplace access fees, and milestone-gated government grants. The €70M VTT programme is the largest confirmed
    revenue anchor. Compared to public-market peers, IQM's burn structure mirrors IonQ and Rigetti — both persistently loss-making
    with government-heavy revenue. Capital adequacy is strong post-Series B (€275M, Sep 2025), but material diligence blockers
    persist until the prospectus is filed.
