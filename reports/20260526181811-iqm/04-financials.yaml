sections:
- id: S1
  title: Revenue Architecture and Monetisation Model
  body: 'IQM generates revenue across four distinct streams. First, on-premises hardware sales represent the company''s highest-value
    channel: institutional buyers (national laboratories, HPC centres, universities) purchase complete quantum computing stacks
    — dilution refrigerator, QPU, control electronics, and software — delivered and commissioned on-site. Contract sizes are
    not publicly disclosed, but the €70M multi-year VTT programme provides a datapoint: the Finnish government-funded contract
    to supply a 150-qubit system by mid-2026 and a 300-qubit system by late-2027 implies an average annual contract value
    in the range of €10–20M per year over the project lifetime. Second, IQM Resonance provides a self-service cloud platform
    with a free Starter tier (up to 30 credits per month) and a pay-as-you-go tier at $0.30 per second of QPU access time.
    Third, IQM''s QPUs (Garnet 20-qubit and Emerald 54-qubit) are available on AWS Braket at $0.30 per circuit task plus a
    per-shot fee, reaching enterprise and academic users without direct IQM sales engagement. Fourth, milestone-gated government
    grants — including a €20.7M Finnish state grant (2020) and the EIB venture-debt loan of €35M (2022) for fabrication infrastructure
    — provide non-revenue capital that supports R&D and manufacturing. Revenue recognition for hardware contracts likely follows
    percentage-of- completion or milestone acceptance criteria, creating potential lumpiness in reported revenue upon IPO.
    IQM has not disclosed any revenue, ARR, gross margin, or EBITDA figures as of the run date; all income metrics are private-company
    confidential.'
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
  calloutRefs:
  - KF1
- id: S2
  title: Go-to-Market Motion and Channel Economics
  body: 'IQM''s primary go-to-market is direct sales to government quantum programmes and institutional buyers. The company
    has offices in over 13 countries and claims more than 15 on-premises customer deliveries, making it the self-described
    #1 on-premises quantum computer vendor by delivery count over the last 12 months. The sales cycle for on-premises quantum
    hardware is long — typically 12 to 24 months — involving site qualification, government procurement processes, proof-of-concept
    trials, and contractual delivery milestones. Customer acquisition cost for such contracts is high, though not publicly
    quantified. IQM''s cloud channel (AWS Braket) enables self-serve discovery and low-friction access, but generates lower
    revenue per customer than hardware contracts; it also serves as a developer and proof-of-concept funnel toward future
    on-premises upsell. The company lacks a Microsoft Azure Quantum or Google Cloud Marketplace listing as of the run date,
    limiting enterprise reach through Microsoft and Google partner networks — a gap exploited by competitors IonQ and Quantinuum,
    both of which maintain three-platform cloud presence. IQM''s geographic expansion has prioritised European sovereign quantum
    programs (Germany, Finland, Spain, France), Asia-Pacific (Japan, South Korea), and the US via the Nasdaq IPO announcement.
    Distribution through systems integrators or quantum application service providers is not publicly confirmed; IQM appears
    to use direct-sales-only go-to-market for on-premises contracts.'
  tableRefs: []
  figureRefs: []
  calloutRefs: []
- id: S3
  title: Cost Structure, Capital Intensity, and Gross Margin Drivers
  body: 'IQM''s vertically integrated model — in-house chip fabrication, cryogenic system integration, control software, and
    field commissioning — generates higher cost-of-goods than fabless peers such as IonQ. The €35M EIB loan (2022) funded
    IQM''s Espoo fabrication facility, the first quantum-dedicated clean-room fab in Europe. Owning fabrication provides supply-chain
    sovereignty and avoids dependence on external semiconductor foundries but requires continuous capex for equipment refresh,
    process development, and capacity expansion. Public comparable data from IonQ (which relies on external foundries) and
    Rigetti (which owns its Fab-1 facility in Fremont, California) suggest gross margins in quantum hardware are thin to negative
    at this stage: Rigetti reported $10.8M FY2024 revenue against $69M operating losses; IonQ reported $130M FY2025 revenue
    against $510M net losses. Neither publishes hardware-specific gross margin, as most revenue is embedded in multi-element
    contracts. IQM''s headcount of 300+ employees across 13+ countries implies significant fixed personnel cost. At a quantum-sector
    blended loaded annual cost of approximately $150K–$250K per employee (salary plus employer contributions), the payroll
    alone implies a $45–75M annual personnel cost before R&D materials, fab operating costs, and SG&A. This is consistent
    with an estimated total annual burn in the $60–100M range, though no data has been confirmed publicly.'
  tableRefs:
  - TI004
  figureRefs:
  - FI003
  calloutRefs:
  - KF2
- id: S4
  title: Financial Metric Gaps and Transparency Assessment
  body: 'IQM is pre-IPO and subject to no public disclosure requirements as of the run date. A search of the SEC''s EDGAR
    database confirms that no S-1, F-1, or registration statement has been filed under "IQM" as of May 26, 2026 — the IPO
    announcement was made on February 23, 2026, but the prospectus filing had not yet been submitted. Key financial metrics
    that remain undisclosed include: annual revenue, ARR, recognised contract backlog, gross margin, EBITDA, operating cash
    flow, cash and equivalents, total debt, and customer concentration metrics. The only confirmed capital events are the
    individual funding rounds (Seed through Series B) and the EIB loan, plus the VTT contract which provides a partial revenue
    anchor. Material diligence blockers include the absence of (1) multi-year revenue trend, (2) hardware gross margin to
    assess pricing power, (3) burn rate and cash runway post-Series B, and (4) customer contract concentration data. The analogous
    peer trajectory (IonQ: IPO at $2B SPAC valuation Oct 2021, revenue $130M by FY2025 but still loss-making; Rigetti: IPO
    at $1.5B SPAC valuation Mar 2022, revenue $10.8M in FY2024, still loss-making) suggests that post-IPO, IQM will be required
    to publish quarterly earnings but that near-term profitability is unlikely. Investors proceeding ahead of the prospectus
    are effectively underwriting pre-commercial quantum hardware risk with limited financial visibility.'
  tableRefs:
  - TI005
  figureRefs: []
  calloutRefs:
  - KF3
- id: S5
  title: Capital Adequacy, Financing History, and IPO Context
  body: 'IQM has raised over €600M in aggregate financing since its 2018 founding, placing it among the best-capitalised private
    quantum hardware companies globally. The September 2025 Series B of €275M ($320M), led by Ten Eleven Ventures — IQM''s
    first US institutional investor — marked the largest quantum funding round in European history and the fourth largest
    funding round for a Finnish growth company to date. Co-investors included Elo Mutual Pension Insurance, Varma Mutual Pension
    Insurance, Companies of Schwarz Group, Winbond Electronics, European Innovation Council (EIC), and Bayern Kapital. On
    February 23, 2026, IQM announced plans to list on the Nasdaq at an initial valuation of approximately $1.8B. No S-1 or
    F-1 has been filed as of the run date. Post-Series B capital position appears strong: at an estimated $60–100M annual
    burn, the €275M Series B alone provides approximately 2.5–4 years of runway, suggesting IQM can execute the IPO without
    a distressed financing need in the near term. Planned use of proceeds likely includes: completion of the VTT 300-qubit
    delivery (late 2027), manufacturing scale-up for additional commercial on-premises orders, Resonance platform development,
    error-correction R&D, and US market entry. The $1.8B initial valuation is a 3× premium to Rigetti''s SPAC valuation ($1.5B
    in 2022) but modest relative to IonQ''s current $6.57B total assets. The US CHIPS and Science Act''s $2.013B in quantum
    letters of intent (signed May 2026 by the US Department of Commerce) signals robust US government demand for domestic
    and allied quantum capabilities — a backdrop that could support IQM''s US commercial expansion post-listing.'
  tableRefs:
  - TI003
  figureRefs:
  - FI002
  - FI004
  calloutRefs: []
