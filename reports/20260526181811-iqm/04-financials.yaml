callouts:
- calloutType: insight
  title: No Revenue Disclosure; VTT Contract is the Only Confirmed Anchor
  body: IQM has disclosed no revenue, ARR, or gross margin. The VTT €70M multi-year government programme (150q by mid-2026,
    300q by late-2027) is the only confirmed revenue anchor. All other revenue is inferred from product listing, cloud pricing,
    and customer announcements. Due diligence ahead of the IPO is severely limited.
  claimRefs:
  - CI001
  - CI003
  - CI005
- calloutType: insight
  title: Vertically Integrated Model Creates Capital Intensity Vs Fabless Peers
  body: IQM's in-house Espoo fabrication facility differentiates it from IonQ (fabless) but increases fixed-cost intensity.
    At 300+ employees in 13+ countries, estimated personnel cost alone approaches €45–75M annually before fab operating costs.
    Hardware gross margins are likely thin; cloud margins are structurally higher but currently small in scale.
  claimRefs:
  - CI015
  - CI016
  - CI019
- calloutType: risk
  title: 'Quantum Hardware IPO Risk: Public Peers Are Persistently Loss-Making'
  body: IonQ (NYSE) and Rigetti (Nasdaq) — the two closest public comparable companies — remain loss-making years after their
    IPOs. IonQ reported $510M net loss in FY2025 despite $130M in revenue; Rigetti reported $201M net loss on only $10.8M
    in revenue in FY2024. These precedents imply IQM's $1.8B target IPO valuation must be justified on a forward technology/market
    thesis, not on near-term profitability.
  claimRefs:
  - CI017
  - CI028
  - CI029
