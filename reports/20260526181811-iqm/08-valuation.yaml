- id: recommendation-valuation-context
  title: Recommendation and Valuation Context
  body: 'The investment recommendation as of 26 May 2026 is "research-more." The primary gating factors are SPAC execution
    risk (binary outcome) and reliance on unaudited FY2025 financial metrics. Until SPAC close is confirmed and audited FY2025
    financials are published, no entry price can be risk-adjusted with sufficient precision. If both gating conditions are
    cleared positively, the valuation case for a "buy" becomes compelling: IQM''s ~51x implied revenue multiple is the lowest
    among all listed pure-play quantum companies, providing a structural re-rating catalyst simply from achieving listing.

    The financing context supports the bull thesis: IQM''s September 2025 Series B ($320M at approximately $1.0B post-money)
    was followed six months later by a SPAC pre-money of $1.8B — an 80% step-up reflecting improved commercial momentum. Post-SPAC
    expected cash of >$450M (including $175M trust, $134M PIPE, and existing cash) is sufficient to fund operations through
    FY2028 at current burn rates (~€54M annual loss). The €50M debt facility drawn in March 2026 provides additional liquidity.
    The bookings backlog exceeds $100M, providing revenue visibility above the FY2025 base of ≥$35M. Confidence in this recommendation
    is medium, reflecting the quality of the underlying data. The risk rating is high: SPAC execution risk, unaudited financials,
    sector multiple volatility, and pre-profitability stage each independently justify a high-risk designation.

    '
