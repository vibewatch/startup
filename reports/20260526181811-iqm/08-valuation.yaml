- id: comparable-analysis
  title: Comparable Company Analysis
  body: 'The comparable set comprises the three US-listed pure-play quantum computing companies with publicly disclosed quantum
    revenue: IonQ (IONQ), Rigetti Computing (RGTI), and D-Wave Quantum (QBTS). IBM and Google are excluded as their quantum
    programs are embedded within diversified businesses with no standalone quantum revenue. Quantinuum and PsiQuantum are
    excluded as they are private companies without publicly available financial metrics. The comp set is explicitly representative,
    not exhaustive, reflecting the current sparse public-market landscape for quantum hardware.

    The most striking finding from the comp analysis is the magnitude of IQM''s multiple discount. IonQ, as the largest pure-play
    quantum company by market cap ($23.6B) and highest disclosed TTM revenue ($64.7M), trades at approximately 365x revenue
    — itself considered elevated versus mature tech multiples. Rigetti and D-Wave, with materially lower TTM revenues ($4.4M
    and $2.86M respectively), trade at 1,866x and 3,551x — ratios that largely reflect speculative positioning rather than
    near-term earnings power. IQM''s implied 51x multiple, at more than $35M revenue, is the only comp that approaches a justifiable
    growth multiple for a hardware company in pre-profitability stage. This creates both the bull thesis (re-rating catalyst)
    and a structural risk (sector de-rating pulling all names lower).

    IQM''s model — on-premises full-system deployment to institutional buyers — differs from IonQ''s cloud-first model and
    D-Wave''s annealer architecture. This makes direct multiple comparison imperfect but instructive: IQM''s revenue reflects
    hardware sale and service revenue, which has different gross margin characteristics than cloud access fees. Direct gross
    margin comparison awaits post-SPAC audited disclosure.

    '
