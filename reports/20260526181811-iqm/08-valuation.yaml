- id: TV005
  title: Thesis-break and kill triggers table
  description: 'Events or data points that would require immediate reclassification of the IQM recommendation from "research-more"
    to "sell" or "avoid."

    '
  notes: 'Kill triggers are monitored on an ongoing basis. Any single tier-1 trigger warrants immediate sell/avoid without
    waiting for the next formal review cycle.

    '
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - SPAC deal collapse
    - Announcement of deal termination or withdrawal of F-4 registration
    - Binary loss of all US listing catalysts; IQM must raise privately on potentially worse terms; valuation re-anchors to
      Series B ($1.0B post-money)
    - Immediate sell/avoid; downside to Series B level or below in secondary
  - - Audited revenue miss
    - Audited FY2025 revenue <$28M (>20% below unaudited ≥$35M estimate)
    - Destroys core valuation thesis; reduces revenue multiple reference point; signals execution problems
    - Immediate downgrade to sell; reassess at audited actuals
  - - Sector multiple collapse
    - IonQ market cap falls below $9B (>60% compression from ~$23.6B)
    - Signals sector-wide de-rating; IQM multiple compresses proportionally; EV re-anchors near bear case ($875M)
    - Reduce/exit position; reassess if sector stabilises within 90 days
  - - Material undisclosed liability
    - Discovery of regulatory, legal, or financial liability not in F-4 risk factors (>$50M exposure)
    - Thesis breaks on governance / disclosure quality; SPAC investors withdraw PIPE
    - Immediate sell/avoid pending full investigation
  - - Redemption overrun
    - RAAC shareholders redeem >80% of trust; net cash to IQM <$90M
    - Insufficient funding to sustain burn rate (€54M/yr) beyond 18 months without new raise; dilutive emergency financing
      likely
    - Re-evaluate at closing; accept only if IQM has confirmed bridge financing commitments
