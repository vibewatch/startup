chapter:
  number: 8
  title: Valuation
  summary: 'IQM''s SPAC combination with RAAC implies a $1.8 billion pre-money valuation against at least $35 million in unaudited
    FY2025 revenue — a ~51x revenue multiple that represents an approximately 86% discount to the unweighted average of US-listed
    pure-play quantum peers (IonQ ~365x, Rigetti ~1,866x, D-Wave ~3,551x). This deep discount reflects IQM''s pre-listing
    status, European jurisdiction, unaudited financials, and SPAC execution risk rather than any fundamental technology or
    commercial inferiority. The bull case — IQM rerating toward IonQ-level multiples post-listing — implies enterprise value
    above $5B; the bear case — multiple compression or SPAC failure — implies sub-$1B. The base case (75x FY2025 revenue)
    is broadly consistent with the SPAC post-money valuation (~$2.25B). The recommendation is "research-more" — IQM carries
    binary SPAC execution risk and relies on unaudited revenue disclosure. A re-rating to "buy" requires SPAC close confirmation,
    audited revenue ≥$35M, and post-listing guidance demonstrating positive operating leverage. No independent sell-side analyst
    coverage existed as of May 2026.

    '
sections:
- id: thesis-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The core bull thesis for IQM rests on four pillars. First, IQM has built the largest disclosed revenue base ($35M+
    FY2025) among pure-play quantum hardware companies, sold 21 systems to 13 institutional customers across Europe, Asia,
    and the United States — a customer acquisition rate that validates commercial readiness ahead of the IPO. Second, IQM''s
    SPAC pre-money valuation of $1.8B implies only ~51x FY2025 revenue, an 86% discount to IonQ''s ~365x, Rigetti''s ~1,866x,
    and D-Wave''s ~3,551x multiples. If IQM re-rates to even half of IonQ''s multiple post-listing, it would imply an enterprise
    value exceeding $6B — a 3x-plus return from current implied pricing. Third, the $450M+ expected post-SPAC cash balance
    funds operations and R&D through the critical fault-tolerant proof-of-concept window without near-term dilutive financing.
    Fourth, IQM''s scientific infrastructure — VTT, Aalto University, ORNL, LRZ partnerships, Nature publications — provides
    credible technology differentiation in superconducting architecture.

    The anti-thesis is equally compelling. The SPAC structure introduces binary execution risk: RAAC shareholders may elect
    full redemption, collapsing trust proceeds and forcing IQM to raise on worse terms. The F-4 explicitly acknowledges that
    IQM has historically incurred net operating losses and cannot predict when profitability will be achieved; accumulated
    deficit has reached €232.2M. FY2025 revenue of ≥$35M is described as "unaudited" — audited figures may revise downward
    or reveal revenue-recognition nuances (TCV vs. recognized revenue). Gross margin is not publicly disclosed. The broader
    sector risk is multiple compression: the 2025 quantum computing valuation surge was in part sentiment-driven, and a single
    missed commercial milestone industry-wide could revert multiples toward technology-sector medians. IQM is also competing
    against well-capitalised US incumbents and emerging Chinese national quantum programs.

    '
