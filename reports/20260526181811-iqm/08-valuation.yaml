- id: exit-diligence
  title: Exit Triggers and Final Diligence
  body: 'The "research-more" recommendation will convert to "buy" only if: (1) SPAC close is confirmed (RAAC shareholder vote
    passes, redemptions stay below maximum threshold), (2) audited FY2025 revenue is ≥$35M and revenue recognition methodology
    is clarified (contract vs. recognized), (3) gross margin disclosure confirms acceptable unit economics (target: ≥30% gross
    margin for a hardware company at this stage), and (4) post-listing management guidance demonstrates operating leverage
    — either narrowing losses at constant revenue or accelerating revenue growth without proportional cost increase.

    The "sell" triggers are: SPAC deal collapse or announcement of deal restructuring at a lower valuation; audited revenue
    materially below $35M (>20% miss); sector-wide multiple compression exceeding 60% (IonQ market cap falling below $9B);
    or emergence of a material undisclosed liability from the F-4 review process. The current 80% step-up from Series B to
    SPAC (Sep 2025 to Feb 2026) must be validated by commercial traction, not just sentiment.

    Final diligence priorities include: (1) reviewing the full F-4 once public for audited financials and revenue recognition
    policy, (2) obtaining gross margin and COGS data, (3) understanding lock-up structure and earn-out provisions for IQM
    founders and early investors, (4) quantifying RAAC shareholder redemption exposure, and (5) assessing whether IQM''s government-sector
    revenue concentration creates contract renewal risk in the post-listing reporting environment. No independent analyst
    coverage existed as of May 2026; sell-side initiation post-listing will be a key valuation information catalyst.

    '
