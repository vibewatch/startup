  evidenceGaps:
  - id: EGV001
    type: private-evidence-only
    severity: blocking
    topic: Revenue recognition methodology — recognized vs. contract value
    description: 'IQM''s F-4 states FY2025 revenue of at least $35 million but does not clearly distinguish between GAAP-recognized
      revenue and total contract value or total bookings. Hardware companies often have significant deferred revenue components
      on multi-year contracts. This distinction materially affects the revenue multiple calculation and the implied run-rate
      for FY2026 forecasting. Full audited financials post-SPAC close are required to resolve this gap.

      '
    relatedQuestionRefs:
    - QV021
    sourceRefs:
    - SV009
  - id: EGV002
    type: private-evidence-only
    severity: blocking
    topic: Gross margin and unit economics
    description: 'IQM has not disclosed gross margin, cost of goods sold, or per-system economics in any pre-SPAC public filing.
      This is a critical gap for hardware company valuation: a company with negative gross margins cannot self-fund scale
      without continuous external financing, fundamentally altering the bull case. Audited post-SPAC financial statements
      are the primary resolution path.

      '
    relatedQuestionRefs:
    - QV022
    sourceRefs:
    - SV009
  - id: EGV003
    type: missing-source
    severity: material
    topic: Independent analyst coverage and price targets
    description: 'No sell-side analyst coverage of IQM existed as of May 2026 because IQM is pre-listing. The absence of independent
      analyst estimates means the only public valuation reference is the SPAC-implied price and peer multiples. Post-listing
      analyst initiation will be a significant information catalyst. This gap limits confidence in the base-case target price.

      '
