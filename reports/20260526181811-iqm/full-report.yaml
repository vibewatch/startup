chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              IQM Quantum Computers presents itself as a full-stack superconducting quantum computing company rather
              than a component supplier or pure cloud API layer. The official about, products, and investor materials
              converge on the same core identity: IQM builds on-premise quantum computers, offers cloud access, and
              emphasizes that customers should be able to own and operate their systems directly. That matters because
              the company is not only selling qubits; it is selling an operating model built around sovereignty, local
              ecosystem development, and integration with high-performance computing environments. The current product
              family spans entry-level education hardware, higher-end research and HPC systems, a
              fault-tolerance-oriented Halocene line, and the Resonance cloud environment. This breadth suggests IQM is
              trying to cover the full maturation path from workforce development and experimentation to institutional
              production deployments, which makes the company overview materially different from a single-product
              startup story.
