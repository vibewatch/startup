  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              The right market frame for IQM is narrower than “all quantum technology” and more specific than a generic
              quantum-computing TAM. IQM’s public materials point to superconducting quantum systems, cloud access,
              control electronics, integration software, and HPC-operating workflows as the relevant commercial surface.
              That means the company sits in the quantum-computing market, but not in all quantum spending: sensing,
              networking, and post-quantum cybersecurity matter strategically yet are not the same budget pool as
              full-stack superconducting computing systems. The deployment model also matters. Public market reports
              disagree on whether cloud or on-premises is the more important near-term commercial form, but they agree
              that both exist and that deployment choice changes adoption barriers. IQM’s own positioning leans hard
              toward owned, on-premise infrastructure with cloud as an access layer, which makes its true addressable
              market more akin to quantum infrastructure plus integration than a broad “software only” category.
