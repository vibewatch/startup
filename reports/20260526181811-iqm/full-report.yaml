      - number: '5.5'
        title: Trust, Safety, Compliance, and Technology Risk
        blocks:
          - type: paragraph
            body: >
              IQM's quality assurance rests on in-house manufacturing in a controlled cleanroom environment,
              module-level electronics testing, a dedicated system build area for full validation, and an automated
              testing suite. Cryogenic chip testing identifies functional QPU units before production, and the
              calibration team tunes each system on site post-installation. Delivery-to-installation typically under 6
              months. IQM does not publicly disclose cybersecurity certifications, penetration test results, or
              third-party security audit reports for the Resonance cloud platform or the on-premises control systems—a
              gap relevant for government and defense customers. The Resonance platform is a js-only web application
              with limited visible API documentation. As a Finnish private company (as of May 2026, mid-SPAC process),
              IQM is not subject to a US national security review (CFIUS) for its European deliveries but its planned US
              listing and US deployments (ORNL, University of Maryland) may attract regulatory scrutiny. Export control
              exposure: superconducting quantum computers are considered dual-use technology in EU and US export
              classification frameworks; no public IQM-specific export compliance guidance is published. The SPAC merger
              registration statement (Form F-4, filed May 14, 2026, SEC Accession 0001193125-26-222654) is the first
              public financial disclosure. Key technology risk: dependency on NVIDIA NVQLink GPU-QPU interconnect for
              real-time QEC; if NVIDIA changes access terms or pricing, IQM's QEC roadmap could face delays.
