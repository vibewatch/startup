companyProfile:
  summary: >-
    IQM Quantum Computers is an Espoo-based Finnish quantum hardware company founded in 2018 from Aalto University and
    VTT roots. It sells superconducting on-prem quantum computers, cloud access through Resonance, and related
    integration services for national labs, supercomputing centers, universities, and selected enterprise buyers. By May
    2026, public materials indicated over $600 million raised, 23 systems sold, 15 delivered, more than 30 computers
    built, and a pending RAAQ SPAC transaction valuing the company at about $1.8 billion pre-money. IQM therefore
    combines real deployment proof and capital access with still-material gaps around audited financial quality,
    governance detail, and customer concentration.
