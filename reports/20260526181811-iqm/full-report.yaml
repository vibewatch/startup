      - number: '7.3'
        title: Technical, Supply-Chain, and Manufacturing Risk
        blocks:
          - type: paragraph
            body: >
              IQM's technology roadmap targets 2027–2028 quantum error-correction demonstrators and fault-tolerant
              systems at 2030+. This requires scaling from current Radiance systems (up to 150 qubits) to architectures
              of millions of qubits — a challenge no competitor has achieved. The Halocene product line, launched in
              November 2025 for error correction, is still in pre-deployment development. IQM's F-4 risk factors
              explicitly identify "technological challenges in the development of our superconducting modality" and
              "limitations in manufacturing capacity" as business risks. Physical errors in superconducting qubits
              (decoherence, gate infidelity) must decrease by ~4–5 orders of magnitude to reach fault tolerance. The
              company's chip fabrication is currently concentrated at the Espoo, Finland cleanroom (7,250 sqm of
              corporate, R&D and fabrication space plus additional Espoo production space) and a planned expansion
              funded by >€40 M.

              Supply-chain concentration is acute. Dilution refrigerators — essential to cool qubits to near absolute
              zero — are primarily supplied by Bluefors, a Finnish company spun out of Aalto University. IQM's Espoo
              operations have geographic proximity to Bluefors but the global dilution-refrigerator market is an
              oligopoly (Bluefors, Oxford Instruments, Leiden Cryogenics) with lead times of 12–18 months. Control
              electronics depend on Zurich Instruments systems (IQM has a joint QEC demonstrator with ZI and NVIDIA
              NVQLink). Any single-supplier failure, US trade restriction on cryogenic components, or production yield
              decline would directly delay customer deliveries. As of run date, IQM has delivered 15 systems with 30+
              built, and has 21 systems sold to 13 customers — a small but growing pipeline where each delivery delay
              has outsized revenue impact.
