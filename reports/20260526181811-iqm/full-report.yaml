      - number: '2.3'
        title: Buyer Segments, Deployment Models, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than one vertical and narrower than “all enterprises.” Across market reports and
              IQM’s own deployment evidence, the strongest current buyer groups are supercomputing centers,
              universities, national laboratories, public-sector ecosystem programs, and a still-small but visible
              enterprise cohort. Reports consistently point to BFSI, drug discovery, materials science, optimization,
              and machine learning as attractive application areas, but those use cases do not all translate into the
              same procurement route. In practice, cloud access lowers the barrier to experimentation, while on-premise
              ownership matters for sovereign control, IP retention, security, and tight HPC integration once
              institutions move beyond basic experimentation. IQM’s AWS Braket presence shows it cannot ignore cloud
              channels, yet its most differentiated commercial thesis remains the idea that customers eventually want to
              own systems and operate them inside classical infrastructure. The adoption path therefore runs from
              exploration, to hybrid integration, to owned production environments, not from pure SaaS trial straight to
              mass enterprise rollout.
