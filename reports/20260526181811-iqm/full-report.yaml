      - number: '4.3'
        title: Cost Structure, Capital Intensity, and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              IQM's vertically integrated model — in-house chip fabrication, cryogenic system integration, control
              software, and field commissioning — generates higher cost-of-goods than fabless peers such as IonQ. The
              €35M EIB loan (2022) funded IQM's Espoo fabrication facility, the first quantum-dedicated clean-room fab
              in Europe. Owning fabrication provides supply-chain sovereignty and avoids dependence on external
              semiconductor foundries but requires continuous capex for equipment refresh, process development, and
              capacity expansion. Public comparable data from IonQ (which relies on external foundries) and Rigetti
              (which owns its Fab-1 facility in Fremont, California) suggest gross margins in quantum hardware are thin
