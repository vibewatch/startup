      - number: '1.5'
        title: Milestones, Risk Signals, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              IQM’s milestone record is unusually dense for a still-private quantum hardware company: foundation in
              2018, early institutional deployments, a record European Series B in 2025, facility expansion, leadership
              restructuring, a SPAC route to public markets, and customer milestones across Finland, Poland, Japan,
              Germany, and the Czech Republic. That sequence supports a thesis of a company moving from ecosystem
              building to commercial infrastructure. At the same time, the company’s own legal and financing disclosures
              warn that quantum computing remains an emerging technology with significant technical challenges, limited
              operating history, historical losses, dependence on continued financing, and exposure to government or
              state-funded customers. Those are not edge-case caveats; they go directly to how IQM should be
              underwritten. The public materials are strong enough to establish identity, capital access, and real
              deployments, but not yet strong enough to answer cap-table control, customer concentration, or
              recurring-revenue quality with precision.
