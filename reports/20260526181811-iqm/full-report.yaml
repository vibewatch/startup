      - number: '5.4'
        title: Technology Roadmap and Development Milestones
        blocks:
          - type: paragraph
            body: >
              IQM's published development roadmap defines three phases on the path to fault-tolerant quantum computing.
              Phase 1 (NISQ, 2025–2026): target >99.94% two-qubit gate fidelities in large systems; deploy advanced
              error suppression and mitigation techniques; deliver NISQ solutions for simulation and optimization use
              cases with research partners. Phase 2 (QEC Demonstrators, 2027–2028): build large systems combining QEC
              and error reduction; target logical error rates in the range 10⁻⁵ to 10⁻⁶; implement QLDPC codes offering
              2–10× efficiency over surface codes; support universal quantum computation including non-Clifford gates.
              Phase 3 (Fault Tolerance, 2030+): realize fully QEC-enabled systems with hundreds of high-precision
              logical qubits; target logical error rate 10⁻⁹; scale to 1 million physical qubits. Specific technology
              milestones include: Crystal 150 as the current production flagship; IQM Star 24 as the first Star-topology
              system; IQM Constellation (combining Crystal and Star) as the planned QEC-era QPU architecture; IQM
              Halocene as the QEC research platform (150 qubits, commercial by end 2026). In 2025 IQM achieved the
              industry milestone of 99.95% CZ fidelity on a test chip. The roadmap identifies three high-value
              application areas: simulation (€28B market by 2035), optimization (€18B), and quantum machine learning
              (€26B), totaling over €72B. The company also disclosed in May 2026 delivery schedules for 150-qubit and
              300-qubit machines to VTT. Manufacturing is supported by an Espoo production facility producing 20 QCs per
              year, with plans for significant expansion announced in November 2025 (€40M investment).
