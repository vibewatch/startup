              complete export-licence inventory before committing.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: SPAC Execution — Binary Risk Event Before Liquidity
            body: >
              The RAAQ-IQM business combination had not yet closed as of 26 May 2026. If the SEC does not declare the
              F-4 effective in time for the RAAQ shareholders' meeting, or if redemptions exceed the contractual
              maximum, IQM's post-close cash could fall substantially below the $450 M+ target. PIPE investors must also
              close concurrently. Any one of these conditions represents a binary risk event for the near-term capital
              plan.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: callout
            title: Talent Risk Is Structural, Not IQM-Specific
            body: >
              IQM's own co-authored State of Quantum Report (with Omdia, June 2025) identifies talent shortage as a
              top-two systemic industry risk. With 300+ employees and 120+ quantum PhDs, IQM is one of the largest
              quantum-native employers globally — but competes for the same pool as IBM, Google, Quantinuum, IonQ, and
              government labs. Retention programmes and compensation benchmarking against US peers are critical
              diligence areas.
            calloutType: insight
            claimRefs:
              - CR021
              - CR022
          - type: callout
            title: Government Concentration — Majority of Revenue from Sovereign Clients
            body: >
              The F-4 explicitly flags that "A significant portion of our revenue currently depends on contracts with
              the public sector." With 13 customers and 21 systems sold, most buyers are universities, national labs,
              and HPC centres funded by governments. Budget cycles of 12–36 months, procurement rules, and austerity
              sensitivity all create revenue lumpiness and concentration risk that private or enterprise buyers would
              diversify.
            calloutType: risk
            claimRefs:
              - CR024
              - CR025
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The core bull thesis for IQM rests on four pillars. First, IQM has built the largest disclosed revenue
              base ($35M+ FY2025) among pure-play quantum hardware companies, sold 21 systems to 13 institutional
              customers across Europe, Asia, and the United States — a customer acquisition rate that validates
              commercial readiness ahead of the IPO. Second, IQM's SPAC pre-money valuation of $1.8B implies only ~51x
              FY2025 revenue, an 86% discount to IonQ's ~365x, Rigetti's ~1,866x, and D-Wave's ~3,551x multiples. If IQM
              re-rates to even half of IonQ's multiple post-listing, it would imply an enterprise value exceeding $6B —
              a 3x-plus return from current implied pricing. Third, the $450M+ expected post-SPAC cash balance funds
              operations and R&D through the critical fault-tolerant proof-of-concept window without near-term dilutive
              financing. Fourth, IQM's scientific infrastructure — VTT, Aalto University, ORNL, LRZ partnerships, Nature
              publications — provides credible technology differentiation in superconducting architecture.

              The anti-thesis is equally compelling. The SPAC structure introduces binary execution risk: RAAC
              shareholders may elect full redemption, collapsing trust proceeds and forcing IQM to raise on worse terms.
              The F-4 explicitly acknowledges that IQM has historically incurred net operating losses and cannot predict
              when profitability will be achieved; accumulated deficit has reached €232.2M. FY2025 revenue of ≥$35M is
              described as "unaudited" — audited figures may revise downward or reveal revenue-recognition nuances (TCV
              vs. recognized revenue). Gross margin is not publicly disclosed. The broader sector risk is multiple
              compression: the 2025 quantum computing valuation surge was in part sentiment-driven, and a single missed
              commercial milestone industry-wide could revert multiples toward technology-sector medians. IQM is also
              competing against well-capitalised US incumbents and emerging Chinese national quantum programs.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
              - CV019
              - CV020
              - CV021
              - CV022
              - CV025
              - CV034
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
              - CV018
              - CV020
              - CV022
              - CV024
              - CV025
          - type: figure
            figureRef: FV001
            claimRefs: []
      - number: '8.2'
        title: Recommendation and Valuation Context
        blocks:
          - type: paragraph
            body: >
              The investment recommendation as of 26 May 2026 is "research-more." The primary gating factors are SPAC
              execution risk (binary outcome) and reliance on unaudited FY2025 financial metrics. Until SPAC close is
              confirmed and audited FY2025 financials are published, no entry price can be risk-adjusted with sufficient
              precision. If both gating conditions are cleared positively, the valuation case for a "buy" becomes
              compelling: IQM's ~51x implied revenue multiple is the lowest among all listed pure-play quantum
              companies, providing a structural re-rating catalyst simply from achieving listing.

              The financing context supports the bull thesis: IQM's September 2025 Series B ($320M at approximately
              $1.0B post-money) was followed six months later by a SPAC pre-money of $1.8B — an 80% step-up reflecting
              improved commercial momentum. Post-SPAC expected cash of >$450M (including $175M trust, $134M PIPE, and
              existing cash) is sufficient to fund operations through FY2028 at current burn rates (~€54M annual loss).
              The €50M debt facility drawn in March 2026 provides additional liquidity. The bookings backlog exceeds
              $100M, providing revenue visibility above the FY2025 base of ≥$35M. Confidence in this recommendation is
              medium, reflecting the quality of the underlying data. The risk rating is high: SPAC execution risk,
              unaudited financials, sector multiple volatility, and pre-profitability stage each independently justify a
              high-risk designation.
            claimRefs:
              - CV015
              - CV017
              - CV018
              - CV023
              - CV024
              - CV026
