      - number: '5.2'
        title: Hardware Architecture and QPU Design
        blocks:
          - type: paragraph
            body: >
              IQM's quantum processing units are based on superconducting transmon qubits—a well-established qubit
              technology derived from Josephson junction circuits that provides high reproducibility and compatibility
              with standard microwave control electronics. Two proprietary topologies differentiate IQM's hardware. The
              IQM Crystal topology arranges qubits in a 2D square lattice with tunable couplers between each
              nearest-neighbor pair; this enables fast (20–40 ns) parallel two-qubit gates and minimizes crosstalk by
              fully idling coupler interactions during non-gate intervals. The IQM Star topology introduces a central
              computational resonator hub that connects a large number of qubits, providing effective near-all-to-all
              connectivity while reducing the number of SWAP operations required for connectivity-intensive algorithms;
              the IQM Star 24 (24-qubit) is the first commercial Star system and is accessible through the Resonance
              cloud platform. A third topology, IQM Constellation—combining Crystal and Star elements—is planned as the
              scalable architecture for quantum error correction, forming the basis for the QLDPC roadmap. The hardware
              stack comprises the QPU, a dilution refrigerator maintaining temperatures near 15 mK, wiring and filtering
              subsystems, and proprietary control electronics that send microwave, RF, and DC signals. Key performance
              benchmarks for the Crystal 20 production system include: minimum 1-qubit gate fidelity ≥99.7%, typical
              ≥99.9%; minimum 2-qubit CZ gate fidelity ≥98.0%, typical ≥99.0%; readout fidelity ≥97% typical; quantum
              volume 32; CLOPS 2600; Q-score 11. In 2025 IQM achieved 99.95% peak CZ fidelity on a two-qubit test chip.
              The company fabricates QPUs in an in-house clean room at its Espoo facility, using cryogenic chip testing
              to identify functional units before production.
