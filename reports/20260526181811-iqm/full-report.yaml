      - number: '5.3'
        title: Software Stack, Cloud Platform, and HPC Integration
        blocks:
          - type: paragraph
            body: >
              IQM's full-stack software offering encompasses quantum programming frameworks, compilation tools,
              automated calibration, and HPC integration middleware. The IQM SDK (open-source, Apache 2.0 license, on
              PyPI as iqm-client and in the GitHub repository iqm-finland/sdk) provides the client-side interface for
              IQM quantum computers. The default frontend framework on IQM Resonance is Qrisp, an open-source high-level
              quantum programming language, while Qiskit, Cirq, CUDA Quantum, and TKET are also supported. Quantum
              compilers translate high-level circuits to native IQM gates (X/Y rotations and CZ); automated calibration
              software maintains optimal parameter values. Pulse-level access is available to both on-premises customers
              and Resonance cloud users, enabling research-grade experimental control. The IQM Resonance platform at
              resonance.iqm.tech offers multi-framework support, group and user management, job scheduling, and
              transparent execution without hidden circuit modifications. A QAOA open-source library was released by IQM
              for quantum optimization algorithm research. For HPC integration, IQM delivers a specialized SDK enabling
              scheduling of quantum jobs directly from supercomputer job schedulers (as demonstrated at LRZ with the
              Munich Quantum Software Stack). IQM distinguishes "loose HPC integration" (quantum and classical scheduled
              independently but co-located, as at LRZ) from planned "tight HPC integration" (optimized data movement and
              latency). An HPC Integration Guidebook was published to assist HPC centers. In May 2026, IQM launched an
              HPC Integration Service product. On April 14, 2026, IQM announced AI-driven agentic calibration using
              NVIDIA Ising models, enabling parallel qubit calibration to reduce dependence on on-site quantum
              engineering expertise. IQM also collaborates with Zurich Instruments and NVIDIA on NVQLink for real-time
              QEC GPU-QPU interconnect (announced March 2026).
