      - number: '1.2'
        title: Leadership, Governance, and Organizational Maturity
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is strongest on the founder-operator layer and thinner on the full board and control
              stack. Public company releases show Jan Goetz moved from a co-CEO structure to sole CEO in January 2026,
              with Søren Hein appointed chief operating officer and deputy CEO and former co-CEO Mikko Välimäki
              transitioning to an advisory role through March 2026. The same releases and public-market materials also
              show that Sierk Poetting served as board chair and that Alex Doll of Ten Eleven Ventures joined the board
              after the 2025 Series B. Together these facts indicate a company moving from founder-led buildout toward a
              more formal scale-up governance model. But the public evidence still does not provide a complete current
              board roster, committee structure, or investor-rights map. For diligence purposes, IQM looks mature enough
              to support large institutional deployments and a listing process, yet still private enough that real
              governance power remains partially opaque outside core press releases and transaction documents.
