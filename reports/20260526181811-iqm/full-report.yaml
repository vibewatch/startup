  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Acquisition Map
        blocks:
          - type: paragraph
            body: >
              IQM's customer base segments into four distinct cohorts. First, national quantum infrastructure
              programs—state-backed bodies that build and operate national quantum computing facilities as research
              infrastructure. This cohort includes VTT Technical Research Centre of Finland (IQM's founding reference
              customer and technology partner), CSC/FiQCI (Finnish Quantum Computing Infrastructure hosting Helmi and
              Aalto University's 20-qubit system), and the LUMI-Q consortium (nine-country EuroHPC consortium with an
              IQM Star 24 system at IT4Innovations, Czech Republic). Second, HPC supercomputing centers—institutions
              that integrate quantum hardware into their high-performance computing environments. This cohort includes
              LRZ (Leibniz Supercomputing Center, Germany; 20-qubit Radiance, 2024), ORNL (Oak Ridge National
              Laboratory, US; Radiance 20q selected for first on-prem QC), CESGA (Galicia Supercomputing Center, Spain;
              54-qubit Radiance + 5-qubit Spark planned by June 2026), Cineca (Italy; Lagrange system), and Aalto
              University (Finland; 20-qubit HPC-connected). Third, academic and research universities—institutions
              acquiring IQM Spark for teaching, algorithm research, and quantum skills development. This cohort includes
              Chungbuk National University (South Korea; first Asia-Pacific IQM system), WUST (Poland; first Polish
              superconducting QC), Poznan University of Technology (Poland; unveiled 2026), and the University of
              Maryland (US; IQM quantum technology center opening 2026). Fourth, early enterprise adopters—private
              companies purchasing IQM hardware or using cloud access. Galaxy Systemy Informatyczne (Poland) was
              publicly announced as the first private enterprise to purchase an IQM quantum computer (April 2026). TOYO
              Corporation (Japan; distribution agreement + first enterprise purchase, April 2026) and Scientek
              Corporation (Taiwan; reseller agreement) extend IQM's reach into the Asia-Pacific enterprise market. DATEV
              (Germany) is collaborating on portfolio optimization use cases.
