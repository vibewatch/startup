  - id: TE003
    title: Technology and Operating Architecture Layers
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Risk
    rows:
      - - QPU — Crystal topology
        - 2D square lattice; fast parallel CZ gates
        - In-house fabrication (Espoo cleanroom)
        - Yield and coherence time scaling at 150+ qubits
      - - QPU — Star topology
        - High-connectivity resonator hub; fewer SWAP operations
        - In-house fabrication; resonator design IP
        - Scalability of resonator hub beyond ~24 qubits unproven
      - - QPU — Constellation (planned)
        - Combined Crystal/Star for QEC scalability
        - Requires both topologies to mature
        - R&D-stage; no commercial deployment timeline
      - - Tunable couplers
        - Enable fast (20–40 ns) gates; eliminate crosstalk at idle
        - Transmon coupler qubits (proprietary design)
        - Overhead in qubit count; scaling challenge
      - - Dilution refrigerator / cryogenic system
        - Maintain QPU at ~15 mK
        - Third-party suppliers (e.g., Bluefors typical for this sector)
        - Supply chain risk; long lead times for DR units
      - - Control electronics
        - Microwave, RF, DC signal generation to qubits
        - Proprietary IQM control hardware
        - Hardware upgrade cycles required as qubit count scales
      - - Automated calibration software
        - Maintain optimal gate parameters; minimize downtime
        - AI-driven calibration (NVIDIA Ising, April 2026)
        - Dependency on NVIDIA Ising models; early-stage deployment
      - - IQM SDK / iqm-client (PyPI)
        - Client-side interface to IQM hardware
        - Open-source; Apache 2.0; GitHub iqm-finland/sdk
        - Version compatibility with Resonance cloud may lag
      - - HPC integration SDK
        - Enable job scheduling from HPC schedulers
        - 'Loose: job scheduler integration; tight: TBD'
        - Tight integration not yet commercially deployed
      - - NVQLink (NVIDIA co-developed)
        - Real-time GPU-QPU QEC interconnect
        - NVIDIA NVQLink hardware and CUDA-Q software
        - Dependency on NVIDIA access terms; hardware not standalone
    notes: >
      Architecture information derived from IQM tech-stack page, roadmap page, and QCR/TQI news. Dilution refrigerator
      supplier not explicitly named by IQM; typical for sector. Dependency classification reflects publicly stated
