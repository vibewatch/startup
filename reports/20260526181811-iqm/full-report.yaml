  - id: FV001
    title: Recommendation logic
    type: flow
    insight: >
      The "research-more" recommendation flows from three converging risk factors — binary SPAC execution risk,
      unaudited financial metrics, and sector multiple volatility — that individually and collectively prevent a
      definitive "buy" entry. The upgrade path to "buy" requires two sequential confirmation events: SPAC close and
      audited revenue validation. The kill path terminates immediately on SPAC deal collapse or material revenue miss.
    data:
      nodes:
        - id: n1
          label: Commercial Traction (Positive)
          description: 21 systems sold, 13 customers, $100M+ bookings, ≥$35M FY2025 revenue
        - id: n2
          label: Valuation Discount (Positive)
          description: ~51x revenue multiple vs. ~365–3,551x for US-listed peers; 86% discount to peer average
        - id: n3
          label: SPAC Execution Risk (High)
          description: Binary close/fail outcome; RAAC redemption risk could reduce trust proceeds to near zero
        - id: n4
          label: Unaudited Financials (Caution)
          description: FY2025 ≥$35M revenue unaudited; gross margin undisclosed; audit may revise figures
        - id: n5
          label: Sector Multiple Volatility (Risk)
          description: 2025 quantum re-rating could reverse; IonQ-driven compression would pull IQM multiples down
        - id: n6
          label: Research-More Recommendation
          description: Watch; initiate post-SPAC close and audited revenue confirmation; avoid pre-close entry
      edges:
        - from: n1
          to: n6
          label: Supports upgrade path
        - from: n2
          to: n6
          label: Re-rating upside if listing succeeds
        - from: n3
          to: n6
          label: Blocks buy until close confirmed
        - from: n4
          to: n6
          label: Blocks buy until audited
        - from: n5
          to: n6
          label: Limits multiple target range
    sourceRefs:
      - SV009
      - SV011
      - SV001
  - id: FV002
    title: Valuation sensitivity
    type: bar
    insight: >
      IQM's valuation is highly sensitive to the revenue multiple applied. At the current implied ~51x, IQM sits at a
      deep discount to all listed peers. Even at a conservative re-rating to 75x (base case), the enterprise value rises
      to ~$2.6B — above the SPAC pre-money. The key sensitivity lever is not revenue growth but multiple expansion,
      which depends on sector sentiment and post-listing institutional demand more than near-term fundamentals.
    data:
      items:
        - label: 'Bear: 25x FY2025 revenue ($35M)'
          value: 875
          unit: $M EV
        - label: SPAC Pre-Money ($1.8B implied ~51x)
          value: 1800
          unit: $M EV
        - label: 'Base: 75x FY2025 revenue ($35M)'
          value: 2625
          unit: $M EV
        - label: 'Bull: 150x FY2025 revenue ($35M)'
          value: 5250
          unit: $M EV
        - label: 'IonQ parity: 365x FY2025 revenue ($35M)'
          value: 12775
          unit: $M EV
    sourceRefs:
      - SV009
      - SV001
      - SV002
  - id: FV003
    title: Valuation / return range
    type: range
    insight: >
      The valuation range across bear, base, and bull scenarios spans $875M to $5.25B enterprise value from the SPAC
      pre-money implied price of $1.8B. The bear case implies a ~51% loss from current implied pricing; the base case
      implies a modest 46% premium. The wide range reflects fundamental uncertainty about: (1) whether the SPAC closes,
      (2) how audited financials compare to unaudited estimates, and (3) where sector multiples settle post-listing.
    data:
      items:
        - label: Bear Case Enterprise Value
          low: 700
          high: 1050
          mid: 875
          unit: $M
        - label: Base Case Enterprise Value
          low: 2200
          high: 3000
          mid: 2625
          unit: $M
        - label: Bull Case Enterprise Value
          low: 4500
          high: 6000
          mid: 5250
          unit: $M
        - label: SPAC Pre-Money Reference
          low: 1800
          high: 1800
          mid: 1800
          unit: $M
    sourceRefs:
      - SV009
      - SV002
      - SV001
  - id: FV004
    title: Investment KPIs
    type: kpi
    insight: >
      IQM's investment KPI profile is dominated by two contrasting signals: strong commercial traction (revenue scale,
      bookings, customer count) versus significant financial risk (pre-profitability, unaudited metrics, SPAC
      dependency). The revenue multiple discount is the standout positive KPI, but it only converts to alpha if the SPAC
      closes and audited metrics confirm the commercial narrative.
    data:
      items:
        - label: Implied Revenue Multiple
          value: ~51x
          status: confirmed
          note: $1.8B pre-money / ≥$35M FY2025 revenue; 86% discount to peer average (~714x)
        - label: FY2025 Revenue (Unaudited)
          value: ≥$35M
          status: estimated
          note: Unaudited per F-4; audit status pending SPAC close
        - label: Total Bookings Backlog
          value: '>$100M'
          status: confirmed
          note: Per F-4 filing; >2.9x coverage of FY2025 revenue
        - label: Customer Count
          value: 13
          status: confirmed
          note: 21 systems sold to 13 institutional customers; 15 delivered
        - label: Post-SPAC Expected Cash
          value: '>$450M'
          status: estimated
          note: Subject to redemption; $175M trust + $134M PIPE + existing cash
        - label: Gross Margin
          value: Undisclosed
          status: missing
          note: Not disclosed in pre-SPAC materials; critical for unit economics assessment
        - label: Series B Post-Money (Sep 2025)
          value: ~$1.0B
          status: confirmed
          note: Led by Ten Eleven Ventures; 80% step-up to $1.8B SPAC pre-money in Feb 2026
        - label: FY2025 Net Loss
          value: ~€54.4M
          status: confirmed
          note: Nearly flat with FY2024 (€54.1M); accumulated deficit €232.2M
    sourceRefs:
      - SV009
      - SV001
      - SV012
      - SV016
