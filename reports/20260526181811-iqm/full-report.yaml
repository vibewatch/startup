      - number: '6.4'
        title: Retention, Renewal, and Customer Durability
        blocks:
          - type: paragraph
            body: >
              IQM's retention profile is structurally strong in the national lab and supercomputing center cohort. VTT
              has a multi-year roadmap with IQM extending through at least 2027 (300-qubit system delivery), suggesting
              deep institutional lock-in driven by co-development history and shared IP. CSC's FiQCI connects VTT and
              Aalto systems under national infrastructure contracts that typically run 3–7 years. ORNL, CESGA, and
              IT4Innovations are government-funded institutions whose quantum computer budgets are tied to national or
              EU-level quantum programs; their contract durability depends on continued program funding, creating
              sovereign budget risk rather than competitive churn risk. Private enterprise customers (Galaxy Systemy,
              TOYO) are single-system buyers with no multi-year contract evidence publicly available, making early
              enterprise churn hard to assess. IQM has not published customer satisfaction metrics, NPS scores, or
              contract renewal rates. The first adverse signal: IQM's customer base is heavily weighted toward
              government-funded institutions (approximately 85–90% of known deployments), which are susceptible to
              budget cycles, government procurement delays, and geopolitical restrictions on dual-use technology
              acquisition. No IQM customer has publicly canceled or delayed a procurement once announced; the absence of
              churn evidence is noted but should be interpreted cautiously given the small observed sample size and
              recency of most deployments. The €50M bridge financing secured in March 2026 and the SPAC merger suggest
              the company has not yet achieved sustained commercial revenue to fund operations independently.
