      - number: '2.2'
        title: Sizing Lenses and Estimate Dispersion
        blocks:
          - type: paragraph
            body: >-
              Accessible market estimates broadly agree on growth but not on the exact size of the opportunity.
              Precedence Research puts the market at $1.44 billion in 2025 and $19.44 billion by 2035, Grand View
              estimates $1.42 billion in 2024 and $4.24 billion by 2030, MarketsandMarkets sees $3.52 billion in 2025
              rising to $20.20 billion by 2030, QED-C says the overall 2025 quantum market is $1.9 billion with
              computing above $1.4 billion and heading beyond $3 billion by 2028, and IQM/Omdia argues for more than $22
              billion by 2032. Those are not small differences. They imply that the category boundary is unstable, that
              some reports include broader services or adjacent quantum layers, and that any single TAM headline is too
              fragile to anchor underwriting alone. The market is certainly meaningful, but the better diligence habit
              is to use multiple lenses and translate them into concrete buyer pathways, deployment models, and use-case
              readiness rather than rely on one optimistic forecast chart.
