      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              IQM has implemented several risk mitigations. On export controls: the company maintains dual-use
              compliance programmes and has not disclosed any licence violations. The Finland headquarters provides EU
              regulatory clarity. On supply-chain: the Espoo fab expansion (>€40 M capex) and in-house chip
              manufacturing reduce third-party fabrication risk; the Bluefors proximity provides geographic supply-chain
              resilience. On talent: IQM's Finland base provides access to Aalto University and VTT Technical Research
              Centre talent pipelines. On customer concentration: the US quantum technology centre (Maryland, April
              2026) and agreements in Japan (Toyo Corporation), Taiwan (Scientek) and Poland (Galaxy) signal geographic
              diversification of the customer base. On SPAC execution: a $134 M PIPE at $10/share is locked in (subject
              to customary conditions) providing a floor on post-close cash even under high-redemption scenarios. On
              competition: IQM's on-premises model creates switching costs and has been validated by ORNL (US DOE lab)
              adoption.

              Kill criteria that would break the investment thesis: (1) SPAC merger fails to close and no alternative
              capital event materialises within 12 months; (2) export-licence denials preventing delivery to ≥2
              contracted customers; (3) a major competitor (IBM, Google) delivers a fault-tolerant demonstration system
              before 2028, compressing IQM's technology-roadmap runway; (4) FY2026 revenue falls below $35 M (no growth
              vs. FY2025), signalling commercial stall; (5) departure of CEO Jan Goetz within 24 months of sole-CEO
              appointment.
