              - CV034
          - type: figure
            figureRef: FV002
            claimRefs: []
          - type: figure
            figureRef: FV003
            claimRefs: []
      - number: '8.4'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >
              The comparable set comprises the three US-listed pure-play quantum computing companies with publicly
              disclosed quantum revenue: IonQ (IONQ), Rigetti Computing (RGTI), and D-Wave Quantum (QBTS). IBM and
              Google are excluded as their quantum programs are embedded within diversified businesses with no
              standalone quantum revenue. Quantinuum and PsiQuantum are excluded as they are private companies without
              publicly available financial metrics. The comp set is explicitly representative, not exhaustive,
              reflecting the current sparse public-market landscape for quantum hardware.

              The most striking finding from the comp analysis is the magnitude of IQM's multiple discount. IonQ, as the
              largest pure-play quantum company by market cap ($23.6B) and highest disclosed TTM revenue ($64.7M),
              trades at approximately 365x revenue — itself considered elevated versus mature tech multiples. Rigetti
              and D-Wave, with materially lower TTM revenues ($4.4M and $2.86M respectively), trade at 1,866x and 3,551x
              — ratios that largely reflect speculative positioning rather than near-term earnings power. IQM's implied
              51x multiple, at more than $35M revenue, is the only comp that approaches a justifiable growth multiple
              for a hardware company in pre-profitability stage. This creates both the bull thesis (re-rating catalyst)
              and a structural risk (sector de-rating pulling all names lower).

              IQM's model — on-premises full-system deployment to institutional buyers — differs from IonQ's cloud-first
              model and D-Wave's annealer architecture. This makes direct multiple comparison imperfect but instructive:
              IQM's revenue reflects hardware sale and service revenue, which has different gross margin characteristics
              than cloud access fees. Direct gross margin comparison awaits post-SPAC audited disclosure.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV018
              - CV020
              - CV038
          - type: table
            tableRef: TV004
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.5'
        title: Exit Triggers and Final Diligence
        blocks:
          - type: paragraph
            body: >
              The "research-more" recommendation will convert to "buy" only if: (1) SPAC close is confirmed (RAAC
              shareholder vote passes, redemptions stay below maximum threshold), (2) audited FY2025 revenue is ≥$35M
              and revenue recognition methodology is clarified (contract vs. recognized), (3) gross margin disclosure
              confirms acceptable unit economics (target: ≥30% gross margin for a hardware company at this stage), and
              (4) post-listing management guidance demonstrates operating leverage — either narrowing losses at constant
              revenue or accelerating revenue growth without proportional cost increase.

              The "sell" triggers are: SPAC deal collapse or announcement of deal restructuring at a lower valuation;
              audited revenue materially below $35M (>20% miss); sector-wide multiple compression exceeding 60% (IonQ
              market cap falling below $9B); or emergence of a material undisclosed liability from the F-4 review
              process. The current 80% step-up from Series B to SPAC (Sep 2025 to Feb 2026) must be validated by
              commercial traction, not just sentiment.

              Final diligence priorities include: (1) reviewing the full F-4 once public for audited financials and
              revenue recognition policy, (2) obtaining gross margin and COGS data, (3) understanding lock-up structure
              and earn-out provisions for IQM founders and early investors, (4) quantifying RAAC shareholder redemption
              exposure, and (5) assessing whether IQM's government-sector revenue concentration creates contract renewal
              risk in the post-listing reporting environment. No independent analyst coverage existed as of May 2026;
              sell-side initiation post-listing will be a key valuation information catalyst.
            claimRefs:
              - CV009
              - CV011
              - CV019
              - CV036
