              (Q50 + 150q + 300q) across two or more contracts at a single institution. LRZ and Aalto University
              together with VTT form the Finnish-German national lab cluster that likely constitutes the majority of
              IQM's current HPC-grade contract revenue. The geographic concentration in EU/Nordic institutions means a
