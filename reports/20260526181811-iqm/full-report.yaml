      - number: '1.3'
        title: Funding History, Capitalization, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              IQM’s financing trajectory is now central to its identity. Historical materials show the company moving
              from seed funding and a €39 million Series A1 to a €128 million A2-era raise, then to a 2025 Series B
              worth $320 million (€275 million) that brought total capital raised above $600 million. By 2026, the
              company layered a €50 million BlackRock-managed financing package on top of that history and announced a
              public-market transaction valuing the business at roughly $1.8 billion pre-money. The investor mix is
              notable because it blends traditional venture capital, sovereign and pension capital, corporate strategic
              money, and public-market PIPE capital. That gives IQM more financing diversity than a typical deep-tech
              hardware startup, but it also raises the burden of proof on execution: once 2025 revenue, bookings, and
              expected post-close cash are disclosed, underwriting shifts from technical promise alone toward
              commercialization credibility. The biggest remaining blind spots are ownership concentration, liquidation
              preferences, and whether any secondary liquidity occurred before the public-market process.
