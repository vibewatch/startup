              from education to HPC-scale research. IQM Spark is a 5-qubit on-premises system priced for universities
              and research centers; it uses the IQM Crystal topology with tunable couplers and was chosen for Cineca's
              Lagrange installation in Italy and Chungbuk National University in South Korea. IQM Radiance targets
              high-performance computing centers with configurations at 20, 54, and 150 qubits (Crystal 20, Crystal 54,
              Crystal 150), all featuring full square-lattice connectivity, tunable couplers between all
              nearest-neighbor qubit pairs, and a software stack for HPC integration. Radiance 20 is deployed at LRZ
              (Leibniz Supercomputing Center), ORNL, and Aalto University; Radiance 54 is planned for CESGA; Crystal 150
              is the flagship for VTT. IQM Halocene is the newest product line, announced November 2025, targeting the
              quantum error correction research era with a modular open-platform architecture supporting up to 5
              high-quality logical qubits, a modular decoder architecture, and NVIDIA NVQLink compatibility, with
              commercial availability targeted by end of 2026. IQM Resonance is the company's cloud platform at
              resonance.iqm.tech, providing access to IQM Star 24 (24-qubit, high-connectivity Star topology) and
              Crystal 54 hardware, with Qrisp as the default SDK, alongside support for Qiskit, Cirq, and CUDA Quantum.
              Additionally, IQM hardware is available via Amazon Braket (IQM Garnet: 20-qubit Crystal and IQM Emerald:
              54-qubit Crystal 54). The company states it manufactures 20 on-premises quantum computers annually from
