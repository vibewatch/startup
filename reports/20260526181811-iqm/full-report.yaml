              - CV035
          - type: figure
            figureRef: FV004
            claimRefs: []
      - number: '8.3'
        title: Bull, Base, and Bear Valuation Scenarios
        blocks:
          - type: paragraph
            body: >
              Three scenarios are constructed on IQM's FY2025 revenue of ≥$35M as the common base metric, using
              peer-derived revenue multiples as anchors. Each scenario is discrete and conditioned on explicit
              assumptions about SPAC execution, revenue recognition, and sector multiple trajectory.

              The bull case applies a 150x revenue multiple — approximately 41% of IonQ's current ~365x and far below
              Rigetti's ~1,866x — implying an enterprise value of approximately $5.25B. This scenario assumes SPAC
              closes successfully, audited revenue confirms ≥$35M, post-listing guidance implies 50%+ YoY growth, and
              sector multiples remain at or above current levels. Probability signal: low (≤20%), contingent on multiple
              conditions aligning simultaneously.

              The base case applies a 75x revenue multiple, implying an enterprise value of approximately $2.625B,
              broadly consistent with the SPAC post-money valuation of ~$2.25B after the $450M cash infusion. This
              scenario requires SPAC close, audited revenue in-line with unaudited estimates, and sector multiples
              holding near current levels. It represents the most likely outcome given the current trajectory of quantum
              computing sector valuations. Probability signal: medium (40–50%).

              The bear case applies a 25x revenue multiple — below even the sector floor implied by IQM's own SPAC
              pricing — implying an enterprise value of approximately $875M, a ~51% discount to the $1.8B pre-money.
              This scenario captures SPAC failure or a severe sector-wide de-rating (e.g., 70%+ multiple compression, a
              major commercial setback at a leading quantum company, or sustained risk-off macro environment).
              Probability signal: low-to-medium (25–35%), elevated relative to typical pre-IPO situations due to binary
              SPAC risk.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV034
              - CV036
              - CV037
              - CV042
          - type: table
            tableRef: TV003
            claimRefs:
