      - number: '7.4'
        title: Talent, Competition, and Customer-Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Talent scarcity is a category-level risk. IQM's own State of Quantum report (co-authored with analyst firm
              Omdia, June 2025) identifies quantum talent shortages as "the two biggest systemic risks to the industry's
              continued growth" alongside funding gaps outside the US. IQM employs 300+ people across 50+ nationalities
              including 120+ quantum PhDs. PhD-level quantum engineers take 5–7 years to train; the global annual output
              of quantum PhDs is estimated in the low thousands. IQM's January 2026 co-CEO transition (Jan Goetz
              appointed sole CEO after Mikael Silverstolpe departed) represents a key-person execution risk with a newly
              singular leadership structure entering a critical SPAC-close period.

              Customer concentration is structural. The F-4 states that "A significant portion of our revenue currently
              depends on contracts with the public sector." With only 13 disclosed customers, a single lost contract
              likely represents ≥7 % of total revenue. Most customers are government-funded institutions (universities,
              national labs, HPC centres) that follow procurement cycles of 12–36 months and are subject to budget
              constraints. Four of the top 10 supercomputing centres globally are IQM customers, which represents
              high-prestige concentration rather than diversification.

              Competition risk is intensifying. IBM continues to advance its superconducting roadmap (1,000+-qubit
              systems); IonQ (market cap ~$23.6 B as of run date) focuses on trapped-ion systems with cloud-first
              go-to-market; Quantinuum (Honeywell spin-out) is pursuing enterprise and pharmaceutical customers with
              high-fidelity trapped-ion hardware. IQM's on-premises model differentiates on sovereignty and ownership,
              but requires customers to bear capex — a higher friction purchase than cloud access.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
