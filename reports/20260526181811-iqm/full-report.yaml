      - number: '1.4'
        title: Commercial Scale, Geographic Footprint, and Deployment Proof
        blocks:
          - type: paragraph
            body: >-
              The most important update versus IQM’s earlier financing-era profile is the amount of deployment evidence
              now in public view. March and April 2026 releases showed a fourth deployed system in Finland at Aalto
              University, Japan’s first enterprise quantum computer purchase via TOYO, and the first private-enterprise
              purchase through Poland’s Galaxy Systemy Informatyczne. Additional 2025-2026 releases document deployments
              or integration work with Oak Ridge National Laboratory, EuroHPC-linked LUMI-Q infrastructure, and channel
              expansion in Taiwan. These announcements do not prove recurring software economics, but they do show that
              IQM is no longer selling only a future roadmap. The footprint also now extends beyond the earlier
              Europe-centric narrative: Oulu strengthens Finland R&D, Maryland anchors the U.S. ecosystem strategy, and
              APAC channel and enterprise activity support the claim that IQM is trying to win local infrastructure
              positions rather than remain a single-site lab supplier. The open question is not whether deployments
              exist, but how repeatable and economically durable they are.
