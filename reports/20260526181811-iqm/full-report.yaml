      - number: '3.3'
        title: >-
          Capability, pricing, and GTM comparison: on-premises vs cloud-first, fidelity benchmarks, and distribution
          reach
        blocks:
          - type: paragraph
            body: >-
              The key buying criteria for an institutional quantum computing customer — national lab, HPC centre,
              university, or deep-tech enterprise — include qubit count, gate fidelity, hardware control access
              (pulse-level vs gate-level), deployment model (on-premises vs cloud), geographic data sovereignty,
              integration with classical HPC, and total cost of ownership.


              **Qubit count and fidelity**: IBM leads on raw qubit count (2,300+ available), but IQM's Emerald 54-qubit
              chip achieves 99.93% median single-qubit fidelity and 99.5% median CZ fidelity — competitive with the best
              superconducting systems. IQM Spark achieves ≥99.9% single-qubit fidelity typical for its 5-qubit
              university system. Rigetti's Cepheus-1-108Q posts 99.84% single-qubit and 98.84% CZ fidelity. Trapped-ion
              systems (IonQ, Quantinuum) achieve higher per-gate fidelity (99.99% for IonQ) but operate at lower qubit
              counts and slower gate speeds.


              **Hardware access**: IQM provides full pulse-level access to its hardware — a feature that IBM cloud does
              not offer by default — which is critical for research labs that need to customise qubit control, benchmark
              error channels, and develop hardware-specific algorithms. This is a genuine differentiator for the
              European and Asian research-lab segment.


              **Deployment model**: IQM is the only major vendor with a dedicated on-premises product line spanning 5
              qubits (Spark), 20/54 qubits (Radiance), and a 24-qubit star-topology device (Star 24), alongside a cloud
              service (IQM Resonance). IBM also sells on-premises (IBM Quantum System Two), but primarily targets HPC
              and data-centre scale deployments. Rigetti, IonQ, and Quantinuum are cloud-first (or Microsoft-Azure-first
              in Quantinuum's case). D-Wave offers Advantage2 both on-premises and via cloud.


              **Pricing**: IQM Resonance cloud pricing ranges from free (30 credits/month, Starter tier) to $0.30/second
              for pay-as-you-go QPU access. On-premises hardware pricing is not publicly listed; estimated contract
              values for HPC-integrated systems are in the multi-million euro range based on government contract
              disclosures. IBM, Quantinuum, and IonQ all use custom enterprise pricing with no public list price for
              on-premises or large-volume cloud.


              **GTM and distribution**: IBM and Google distribute through existing cloud and enterprise sales channels
              with deep incumbent relationships. IonQ and Quantinuum have expanded through major cloud marketplace
              integrations (AWS, Azure, Google Cloud) that IQM does not yet fully match. IQM's AWS Braket integration
              with Garnet and Emerald is a start, but IQM's core go-to-market relies on direct institutional sales,
              government partnerships, and national quantum programmes in Europe (Finland, Germany), APAC (Japan, South
              Korea), and the US.
