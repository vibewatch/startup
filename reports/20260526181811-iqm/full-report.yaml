      - number: '2.4'
        title: Growth Drivers, Constraints, and Open Questions
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are easy to identify: rising demand for higher-performance computation, heavy
              government funding, public-private infrastructure programs, cloud-based access that broadens
              experimentation, and a growing belief that optimization, simulation, and selected chemistry or drug
              workloads may be valuable earlier than generalized fault tolerance. But the same sources also make clear
              why commercialization remains hard. Talent is scarce, the supply chain is specialized, cryogenic and
              control infrastructure are expensive, qubit error rates still matter, integration into classical systems
              is non-trivial, and export-control or national-security concerns can shape how systems move across
              borders. Even bullish industry groups continue to say useful applications are a few years away rather than
              fully present now. For IQM, that means the market thesis is neither “hype only” nor “already mature.” It
              is a real but bottlenecked infrastructure market where execution quality, ecosystem building, and
              operational simplicity determine whether large forecasts convert into actual installed-base economics.
