  - id: financial-burn-spac
    title: Financial, Burn, and SPAC Execution Risk
    body: >
      IQM incurred net losses of €54.4 M in FY2025 and €54.1 M in FY2024, with an accumulated
      deficit of €232.2 M as of 31 December 2025. Revenue for FY2025 is reported at ≥$35 M
      (unaudited, EUR/USD 1.174) — approximately 51× the pre-money SPAC equity valuation of
      approximately $1.8 B. The company has raised $635 M+ in total funding (equity, debt, and
      public grants), including a $320 M Series B led by Ten Eleven Ventures in September 2025,
      and a €50 M debt financing facility drawn in March 2026. Post-SPAC cash is targeted at
      >$450 M: $175 M trust + $134 M PIPE + $24 M warrant exercise proceeds + $172 M existing cash
      (all as of year-end 2025). The key financial risk is SPAC execution: RAAQ public shareholders
      may redeem shares before close, eroding the trust account. Under the maximum contractual
      redemption scenario, the combined company would have materially less cash than the headline
      >$450 M target. The F-4 discloses that if remaining proceeds are ≤$100 M, all Sponsor
      Private Placement Warrants are forfeited — signalling a governance structure sensitive to
      redemption levels. IQM's F-4 also acknowledges no scalable business model has been
      established and that the company "expects to continue to incur operating and net losses
      annually until we generate significant revenue." A €40 M Finland fab-expansion capex
      commitment made in November 2025 adds further cash-consumption pressure.

      The burn risk kill criterion: if SPAC does not close and IQM cannot secure alternative
      bridge financing within 12 months, the company would need to reduce headcount and defer
      customer deliveries, undermining the commercial momentum critical to the valuation thesis.
