callouts:
  - calloutType: risk
    title: Export Control — Material and Accelerating Risk
    body: >
      Quantum computers are now classified as dual-use items under the Wassenaar Arrangement and
      EU Regulation 2021/821. IQM's customer base spans Japan, Taiwan, Saudi Arabia, Poland, Spain,
      Czech Republic, Germany, and Finland — a geographically diverse set where export-control
      licensing requirements are evolving rapidly. IQM's F-4 states controls are "quickly evolving
      and tightening." Investors should request a complete export-licence inventory before committing.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: SPAC Execution — Binary Risk Event Before Liquidity
    body: >
      The RAAQ-IQM business combination had not yet closed as of 26 May 2026. If the SEC does not
      declare the F-4 effective in time for the RAAQ shareholders' meeting, or if redemptions
      exceed the contractual maximum, IQM's post-close cash could fall substantially below the
      $450 M+ target. PIPE investors must also close concurrently. Any one of these conditions
      represents a binary risk event for the near-term capital plan.
    claimRefs:
      - CR010
      - CR011
      - CR012

  - calloutType: insight
    title: Talent Risk Is Structural, Not IQM-Specific
    body: >
      IQM's own co-authored State of Quantum Report (with Omdia, June 2025) identifies talent
      shortage as a top-two systemic industry risk. With 300+ employees and 120+ quantum PhDs,
      IQM is one of the largest quantum-native employers globally — but competes for the same pool
      as IBM, Google, Quantinuum, IonQ, and government labs. Retention programmes and compensation
      benchmarking against US peers are critical diligence areas.
    claimRefs:
      - CR021
      - CR022

  - calloutType: risk
    title: Government Concentration — Majority of Revenue from Sovereign Clients
    body: >
      The F-4 explicitly flags that "A significant portion of our revenue currently depends on
      contracts with the public sector." With 13 customers and 21 systems sold, most buyers are
      universities, national labs, and HPC centres funded by governments. Budget cycles of 12–36
      months, procurement rules, and austerity sensitivity all create revenue lumpiness and
      concentration risk that private or enterprise buyers would diversify.
    claimRefs:
      - CR024
      - CR025

