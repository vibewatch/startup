company:
  name: IQM Quantum Computers

chapter:
  number: 7
  title: Risks
  summary: >
    IQM faces seven principal risk clusters: (1) export-control tightening under EU Regulation 2021/821 and
    evolving quantum-specific dual-use rules that could restrict deliveries to Japan, Taiwan, Saudi Arabia and
    other current customers; (2) a heavy capital-intensity and burn profile — €54.4 M net losses in FY2025
    against ≥$35 M unaudited revenue — requiring the pending SPAC transaction to close on schedule;
    (3) government-sector revenue concentration where sovereign and publicly-funded institutions represent
    the large majority of the 13-customer base; (4) execution risk on a demanding technology roadmap from
    150-qubit NISQ systems to fault-tolerant 1 M-qubit targets; (5) supply-chain concentration in
    specialised dilution refrigerators and cryogenic electronics; (6) acute quantum-PhD talent scarcity
    globally; and (7) SPAC-specific redemption and dilution risks with the RAAQ merger pending SEC
    effectiveness as of run date. Kill criteria centre on SPAC failure, revenue-growth stall, and
    export-licence denial for key markets.

sections:
  - id: regulatory-export-control
    title: Regulatory and Export-Control Risk
    body: >
      IQM operates at the intersection of quantum physics and geopolitics. Quantum computers are
      classified as dual-use items under EU Regulation (EU) 2021/821 (the EU Dual-Use Regulation)
      and the Finnish Act on the Export Control of Dual-Use Items (Laki 500/2024). Both regimes
      require export licences or national-security approvals before shipment of systems above
      threshold qubit counts or performance benchmarks to restricted end-users. Multiple IQM
      customers sit in jurisdictions — Japan, Taiwan, Saudi Arabia, Poland — where export-control
      designations are evolving. IQM's F-4 registration statement filed with the SEC on 14 May 2026
      explicitly flags export-control tightening as a material risk factor, noting that "export
      controls on quantum computing are quickly evolving and tightening" across EU member states
      and the United States. The Wassenaar Arrangement participants are actively reviewing quantum
      technology classifications for Category 3 electronics. Additionally, IQM's F-4 discloses
      that IQM must comply with US sanctions (OFAC) for any US-incorporated entity and its
      subsidiaries following the SPAC close. No export-licence violation or enforcement action has
      been publicly disclosed; however, regulatory uncertainty represents a structural headwind
      for IQM's international order book.

      Legal risk is also present through the F-4 registration process itself: the SEC must declare
      the registration statement effective before the SPAC can close, and any material comment
      letter from the SEC could delay the merger beyond IQM's cash runway window. The F-4 also
      reveals that IQM's technology is subject to government-funding body rights in EU-funded
      research, potentially constraining IP commercialisation. No litigation is disclosed as pending
      or threatened as of the filing date.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
