callouts:
- calloutType: strength
  title: On-premises delivery leadership is a durable near-term differentiator
  body: 'IQM''s claimed #1 position in on-premises quantum computer deliveries over the last twelve months, supported by 15+
    customer deliveries and 30+ systems manufactured, gives it a concrete lead in the sovereign HPC and national-lab segment
    that cloud-only rivals (IonQ, Rigetti, Quantinuum) structurally cannot match without major strategic pivots.'
  claimRefs:
  - CP006
  - CP010
  - CP027
- calloutType: risk
  title: Multi-cloud distribution gap threatens cloud segment competitiveness
  body: IQM Resonance cloud is currently integrated only with AWS Braket. IonQ and Quantinuum are available across AWS, Azure,
    and Google Cloud. As enterprise quantum procurement shifts toward cloud-first procurement through existing hyperscaler
    contracts, IQM's single-cloud presence is a structural handicap that could limit its addressable market in the commercial
    segment.
  claimRefs:
  - CP030
  - CP031
  - CP032
- calloutType: insight
  title: Rigetti's 10-K financials provide a warning model for cloud-only quantum economics
  body: Rigetti's publicly filed FY2024 10-K shows $201M net loss on modest revenue with 89.4% government concentration, validating
    the thesis that cloud-only quantum services at current scale are not commercially self-sustaining without institutional
    grants. IQM's on-premises model with contract-based revenue is structurally superior to a pure cloud-revenue model at
    this stage of the market.
  claimRefs:
  - CP013
  - CP014
  - CP036
