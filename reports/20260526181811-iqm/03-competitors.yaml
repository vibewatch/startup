- id: competitor-profiles
  title: 'Profiles: scale, strategy, target segment, and pricing posture by competitor'
  body: '**IBM Quantum** is the largest and most widely deployed quantum computing platform globally. IBM''s quantum computers
    are accessible through the IBM Cloud and through direct on-premises installations in academic and research settings. IBM
    Quantum System Two is its modular, data-center-grade architecture combining multiple QPUs with classical compute. IBM
    uses 300mm semiconductor fabrication to manufacture superconducting transmon qubits and has cut processor build times
    by at least half through semi-automated tooling. IBM does not publish unit pricing for on-premises systems; cloud access
    is priced by circuit execution time. IBM''s primary target is large enterprise and national-lab customers seeking validated
    integration with classical HPC infrastructure. IBM''s strategic direction is toward quantum-centric supercomputing through
    modular interconnect (l-couplers) and the development of cryogenic CMOS control electronics to reduce complexity.


    **Google Quantum AI** operates as a research organisation rather than a commercial hardware vendor. It does not sell quantum
    computers to external customers; instead it collaborates with select partners and offers access to Willow via Google Cloud
    (via a private beta/partnership model). Google''s competitive threat to IQM is primarily at the frontier-research level,
    where Google''s verifiable quantum advantage claims raise the bar for what national research programmes need to acquire.


    **IonQ** is a publicly traded company (IONQ on NYSE) that sells cloud-based access to its trapped-ion systems through
    AWS, Azure, and Google Cloud. IonQ is expanding beyond quantum computing into quantum networking, quantum security (QKD),
    quantum sensing, and space infrastructure. IonQ''s trapped-ion approach offers higher two-qubit fidelity (99.99% claimed)
    versus IQM''s superconducting Radiance (99.5% typical), but gates are slower and scale-up to thousands of physical qubits
    is technically harder. IonQ''s roadmap calls for 2 million physical qubits eventually, but the path from trapped-ion demonstration
    devices to that scale is unproven.


    **Quantinuum** (Honeywell Quantum Solutions + Cambridge Quantum) operates Helios and its H-series trapped-ion processors.
    The QCCD architecture enables all-to-all connectivity, drastically reducing SWAP overhead versus superconducting square-lattice
    designs. Quantinuum distributes through Microsoft Azure and through direct subscriptions. Quantinuum''s strategic focus
    is on fault-tolerant quantum computing for chemistry, materials simulation, and cybersecurity. Quantinuum''s fidelity
    claims are the strongest in the trapped-ion space and compete directly with IonQ; its Microsoft Azure go-to-market gives
    it superior enterprise distribution versus IQM.


    **Rigetti Computing** (RGTI on NASDAQ) is IQM''s most direct modality peer — both use superconducting transmon qubits
    with tunable couplers. Rigetti''s Cepheus-1-108Q (107 qubits, deployed April 2026) slightly exceeds IQM Radiance''s current
    standard 20-qubit configuration in qubit count but is available cloud-only. Rigetti''s FY2024 10-K filings reveal persistent
    losses ($201M net loss FY2024, $75.1M in FY2023) and heavy reliance on US government contracts (89.4% of revenue in FY2024).
    This makes Rigetti a warning model for IQM''s own financials: without on-premises hardware revenue, cloud-only quantum
    services remain pre-commercial.


    **D-Wave** focuses on quantum annealing for combinatorial optimisation, a problem class with industrial applications in
    logistics, scheduling, and finance. D-Wave''s acquisition of Quantum Circuits Inc. brings gate-model capability, but its
    primary competitive threat to IQM is in the optimisation segment where NISQ superconducting computers also seek applications.
    D-Wave explicitly benchmarks rival quantum vendors using three criteria and frames much of its marketing around "deflating
    the hype," implicitly arguing that NISQ gate-model vendors, including IQM-class companies, have not yet demonstrated sufficient
    commercial value.'
