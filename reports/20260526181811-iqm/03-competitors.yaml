- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - IQM claims
    - IBM Quantum and other large players can escalate on-premises institutional sales; IQM's delivery lead is recent and
      may not be durable at scale
    - high
    - Verify on-premises contract pipeline, win/loss vs IBM, and whether Radiance 150q roadmap maintains delivery leadership
      into 2027
  - - In-house Finnish fab provides supply-chain sovereignty and custom processor design
    - IBM and Google have larger and more advanced fabrication with 300mm tooling; IQM fab limited by scale and capital
    - medium
    - Assess IQM fab yield rates, capacity for 150/300-qubit production, and whether EIB and VTT funding is sufficient to
      expand without dilutive equity
  - - Pulse-level hardware access differentiates IQM for research customers
    - Commodity gate-level access is sufficient for most early commercial use cases; pulse-level advantage may erode as error
      mitigation matures
    - low
    - Track whether research lab procurement decisions cite pulse-level access as a primary criterion vs. qubit count and
      uptime
  - - AWS Braket integration provides cloud reach without competing directly on cloud-first GTM
    - Quantinuum and IonQ have Azure, AWS, and Google Cloud presence; IQM lacks Azure and Google Cloud Marketplace integration
    - high
    - Assess IQM's roadmap for Azure/Google Cloud integration and whether lack of multi-cloud presence is causing losses in
      cloud-first enterprise deals
  - - Multi-year institutional contracts (VTT, German HPC) create revenue visibility and lock-in
    - Customer concentration in government/national-lab segment creates revenue fragility if one anchor programme is cancelled
      or delayed
    - medium
    - Audit contract terms, renewal mechanisms, and geographic diversification of on-premises backlog outside Finland and
      Germany
  - - 300+ patent portfolio and European quantum leadership narrative
    - IBM, Google, and academic institutions have larger quantum patent portfolios; cross-licensing and design-around risk
      is real
    - low
    - Review patent depth in key superconducting fabrication areas; assess whether IQM's IP position is defensive or offensive
      in the relevant technology areas
  notes: Severity assessments are evidence-backed judgments based on public market evidence. "High" means a credible, near-term
    risk to IQM's competitive position; "medium" means a medium-term risk requiring monitoring; "low" means real but not near-term.
