  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: IQM on-premises delivery count verification
    missingEvidence: 'Independent verification of IQM''s claimed #1 on-premises delivery count; no third-party industry report
      or analyst ranking corroborates this claim.'
    whyItMatters: The delivery leadership claim is IQM's primary competitive differentiator; if it is inaccurate or overstated
      relative to IBM on-premises sales, the moat assessment changes.
    diligencePath: Request from IQM a named list of delivered systems, customer references, and the exact scope of "on-premises
      deliveries" (whether it includes VTT co-development units or only commercial sales); cross-check against industry reports
      from IDC or McKinsey.
    relatedQuestionRefs:
    - QP016
  - type: missing-source
    severity: material
    topic: IQM hardware pricing and contract economics
    missingEvidence: No public pricing data exists for IQM Radiance, IQM Star 24, or institutional on-premises contracts;
      contract values are only partially inferrable from government grant disclosures.
    whyItMatters: Without on-premises contract pricing, the financial model for IQM hardware revenue is opaque to investors
      and buyers; unit economics and gross margin cannot be calculated.
    diligencePath: Request IQM contract summaries for representative on-premises deployments; use VTT €70M contract as a lower-bound
      anchor; compare to IBM Quantum System Two pricing if available through procurement enquiries.
    relatedQuestionRefs:
    - QP004
  - type: missing-source
    severity: minor
    topic: IQM competitive displacement evidence
    missingEvidence: No public evidence of a competitive bid where IQM was displaced by IBM, Google, or another vendor in
      a national quantum programme tender.
    whyItMatters: Understanding win/loss dynamics would clarify whether IQM's on-premises leadership is sustainable or whether
      larger vendors are beginning to compete more aggressively.
    diligencePath: Review European quantum programme tender documents; survey quantum programme managers in Germany, Finland,
      France, and Spain; request win/loss summary from IQM sales.
    relatedQuestionRefs:
    - QP020
    - QP015
  - type: missing-source
    severity: minor
    topic: IQM distribution channels and partner ecosystem
    missingEvidence: No public information on whether IQM uses resellers, systems integrators, or channel partners for its
      on-premises hardware sales outside of Finland and Germany.
    whyItMatters: Partner-led distribution is standard in enterprise hardware; if IQM relies entirely on direct sales, it
      will face geographic scalability constraints as it expands to APAC and the US.
    diligencePath: Review IQM's partner page (not publicly detailed); request channel strategy from IQM; check LinkedIn for
      IQM channel or systems-integration job postings.
    relatedQuestionRefs:
    - QP021
    - QP026
  - type: missing-source
    severity: minor
    topic: IQM gate speed benchmarks (T1/T2 lifetimes) versus Rigetti
    missingEvidence: IQM Radiance T1 and T2 qubit lifetime specifications are not prominently published; Rigetti's Cepheus-1
      listing shows T1/T2 values, enabling a direct gate-speed comparison.
    whyItMatters: Gate speed (measured by T1/T2 coherence lifetimes) determines algorithm depth and throughput; a material
      gap here would affect IQM's competitiveness on deep circuits.
    diligencePath: Review IQM Radiance technical datasheet or device benchmarking page on AWS Braket; compare T1 (25–26 µs
      typical for Rigetti) to IQM published specs.
    relatedQuestionRefs:
    - QP023
