  title: Competitors
  summary: IQM competes in a fragmented quantum-computing hardware market dominated by IBM Quantum on scale, Google Quantum
    AI and IonQ/Quantinuum on fidelity benchmarks, and Rigetti on the same superconducting modality. IQM's differentiation
    rests on sovereign European on-premises delivery, full hardware transparency, in-house fabrication, and an AWS Braket
    cloud presence. Moat durability depends on translating on-premises delivery leadership into long-term institutional lock-in
    before IBM or Google can extend cloud-first strategies into the on-premises government and HPC channel.
sections:
- id: quantum-landscape
  title: 'Landscape: gate-model giants, trapped-ion challengers, cloud-only players, and annealing alternatives'
  body: 'IQM competes across several distinct competitor classes, each pursuing quantum advantage through different technical
    strategies and market postures. The landscape as of May 2026 can be divided into four categories.


    First, **hyperscaler-backed gate-model incumbents**: IBM Quantum operates more than 2,300 available qubits across 30+
    quantum computers with over 100 qubits each, runs 3.9 trillion circuits per year, and claims 97% uptime. IBM''s scale
    and vertical integration through IBM Quantum System Two positions it as the default reference platform for large HPC centres
    worldwide. Google Quantum AI introduced its Willow chip in 2024–2025, achieving the first verifiable quantum advantage
    toward real-world applications via the Quantum Echoes algorithm, and continues to operate as an internal research-and-partnerships
    organisation rather than a commercial hardware vendor.


    Second, **trapped-ion specialists**: IonQ and Quantinuum compete primarily on fidelity. IonQ claims a 99.99% two-qubit
    gate fidelity benchmark — the highest publicly published in the industry — and is distributing access through AWS, Azure,
    and Google Cloud. Quantinuum''s Helios processor uses a QCCD (quantum charge-coupled device) architecture with all-to-all
    connectivity and mid-circuit measurement capability, enabling the first-ever real-time quantum error correction demonstrations.


    Third, **cloud-only superconducting peers**: Rigetti Computing deployed its Cepheus-1-108Q (107 physical qubits) in April
    2026, with 99.84% median single-qubit gate fidelity and 98.84% CZ gate fidelity. Rigetti operates cloud-only through its
    Quantum Cloud Services (QCS) and does not sell on-premises systems, which creates a direct positioning gap versus IQM.


    Fourth, **quantum annealing alternatives and diversified players**: D-Wave offers a dual-platform approach combining its
    established Advantage2 annealing system with gate-model capability gained through the acquisition of Quantum Circuits
    Inc. D-Wave is the only commercially profitable quantum vendor on a service basis, though its annealing technology addresses
    a narrower problem class than gate-model computers.


    IQM''s unique position is on-premises superconducting hardware for national HPC centres, research labs, and government
    institutions. The company claims to be the number-one provider of on-premises quantum computers by delivery count over
    the last twelve months, with 15+ customer deliveries and 30+ machines manufactured total. The AWS Braket integration (IQM
    Garnet 20-qubit and Emerald 54-qubit) provides a cloud presence, but the on-premises segment is IQM''s primary commercial
    differentiator versus cloud-dominant rivals.'
