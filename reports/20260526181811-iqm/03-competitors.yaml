- id: moat-switching-costs
  title: Moat durability, switching costs, and displacement risk
  body: 'IQM''s most defensible competitive position is the combination of (1) in-house European chip fabrication (Espoo,
    Finland), (2) sovereign on-premises delivery to national quantum programmes, and (3) growing institutional relationships
    cemented by multi-year maintenance and cloud-platform contracts. The VTT contract (150-qubit system mid-2026, 300-qubit
    late-2027) is the most visible anchor of this strategy: once VTT operates IQM hardware and trains its researchers on IQM''s
    software stack, migration to a competing platform has substantial cost and transition risk.


    However, several displacement risks are real. IBM''s scale and global distribution give it the ability to respond to European
    national quantum programmes with attractive pricing or partnership deals; the US National Quantum Initiative and EU Quantum
    Flagship initiatives both involve IBM. Google''s Willow chip demonstrated exponential error reduction with qubit count,
    which — if scalable — could eventually leapfrog superconducting NISQ platforms entirely. IonQ and Quantinuum''s trapped-ion
    approach, if it achieves fault-tolerant error correction earlier than superconducting systems, could shift the preferred
    platform for fault-tolerant workloads.


    Switching costs for IQM''s on-premises customers are high in the medium term. A university or national lab that purchases,
    installs, and trains on an IQM system has invested in calibration routines, custom pulse-level code, integration with
    local HPC infrastructure, and staff expertise. Migrating to a different hardware platform requires re-engineering algorithms,
    retraining operators, and likely replacing cryogenic infrastructure — a significant multi-year commitment. Cloud switching
    costs are lower: IQM Resonance competes on the same commodity layer as IonQ Cloud and IBM Quantum Cloud, where multi-homing
    is straightforward through framework adapters (Qiskit, PennyLane, CUDA-Q).


    The multi-homing risk is mitigated in on-premises but acute in cloud. IQM''s ability to grow the cloud business (IQM Resonance)
    is limited by its current integration in only the AWS Braket ecosystem; it lacks direct Azure and Google Cloud Marketplace
    presence that IonQ and Quantinuum have already secured. This channel gap is a material risk if enterprise buyers adopt
    cloud quantum as the default and bypass the on-premises segment.


    IQM''s 300+ patent applications represent a technical moat, but the quantum computing patent landscape is crowded with
    IBM, Google, and academic institution filings, and cross-licensing or design-around risk is non-trivial. The most durable
    competitive advantage may be operational — the ability to deliver and maintain 30+ working systems across multiple continents
    faster than any rival — rather than technology IP.'
