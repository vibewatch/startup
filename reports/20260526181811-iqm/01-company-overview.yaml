  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table
    missingEvidence: A full current board roster, committee map, and voting-rights summary would close the governance gap.
    whyItMatters: Without complete board and control detail it is difficult to judge investor influence, founder control, and listing-readiness governance maturity.
    diligencePath: Request board materials, governance documents, and the latest cap table from management or the transaction data room.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map
    missingEvidence: Current ownership percentages, preference stack, and any secondary sale history would close the investor-map gap.
    whyItMatters: Capital structure changes downside protection, dilution risk, and board incentives in a way headline funding totals do not show.
    diligencePath: Review the detailed cap table, financing documents, and any secondary transaction schedules in counsel-managed diligence.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: A full chronology of any undisclosed adverse events, exact early-round close dates, and intermediate governance changes would complete the milestone record.
    whyItMatters: Milestone compression can hide setbacks, delayed launches, or governance resets that matter for underwriting execution quality.
    diligencePath: Request an internal company timeline and reconcile it against financing documents, board minutes, and customer deployment logs.
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: revenue concentration
    missingEvidence: A customer-by-customer revenue mix or at least a public/private-sector split is needed to assess concentration.
    whyItMatters: A business dominated by state-funded institutions can face longer cycles, policy dependence, and lower commercial repeatability than headline system counts imply.
    diligencePath: Request a 2024-2026 revenue bridge by customer class plus the top ten customer list and renewal status.
