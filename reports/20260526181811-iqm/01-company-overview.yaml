- id: leadership-and-governance
  title: Leadership, Governance, and Organizational Maturity
  body: Leadership evidence is strongest on the founder-operator layer and thinner on the full board and control stack. Public company releases show Jan Goetz moved from a co-CEO structure to sole CEO in January 2026, with Søren Hein appointed chief operating officer and deputy CEO and former co-CEO Mikko Välimäki transitioning to an advisory role through March 2026. The same releases and public-market materials also show that Sierk Poetting served as board chair and that Alex Doll of Ten Eleven Ventures joined the board after the 2025 Series B. Together these facts indicate a company moving from founder-led buildout toward a more formal scale-up governance model. But the public evidence still does not provide a complete current board roster, committee structure, or investor-rights map. For diligence purposes, IQM looks mature enough to support large institutional deployments and a listing process, yet still private enough that real governance power remains partially opaque outside core
    press releases and transaction documents.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO022
  - CO036
  - CO037
  - CO038
  tableRefs:
  - TO002
- id: capitalization-and-investor-base
  title: Funding History, Capitalization, and Investor Base
  body: 'IQM’s financing trajectory is now central to its identity. Historical materials show the company moving from seed funding and a €39 million Series A1 to a €128 million A2-era raise, then to a 2025 Series B worth $320 million (€275 million) that brought total capital raised above $600 million. By 2026, the company layered a €50 million BlackRock-managed financing package on top of that history and announced a public-market transaction valuing the business at roughly $1.8 billion pre-money. The investor mix is notable because it blends traditional venture capital, sovereign and pension capital, corporate strategic money, and public-market PIPE capital. That gives IQM more financing diversity than a typical deep-tech hardware startup, but it also raises the burden of proof on execution: once 2025 revenue, bookings, and expected post-close cash are disclosed, underwriting shifts from technical promise alone toward commercialization credibility. The biggest remaining blind spots are
    ownership concentration, liquidation preferences, and whether any secondary liquidity occurred before the public-market process.'
  claimRefs:
