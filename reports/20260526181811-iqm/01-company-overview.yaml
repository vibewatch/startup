company:
  name: IQM Quantum Computers
chapter:
  number: 1
  title: Company Overview
  summary: IQM Quantum Computers has evolved from a 2018 Finnish university-and-lab spinout into one of Europe’s best-capitalized quantum hardware companies, combining on-premise superconducting systems, a cloud platform, and a public-market financing path. As of May 2026, public materials describe over $600 million raised, 23 systems sold, 15 delivered systems, 30-plus computers built, and an active expansion program spanning Finland, Germany, the U.S., Japan, Poland, and wider EuroHPC deployments. The strongest evidence supports product depth, deployment traction, and capital access, while ownership concentration, customer concentration, and full governance detail remain private.
sections:
- id: identity-and-business-model
  title: Identity, Product Scope, and Operating Model
  body: 'IQM Quantum Computers presents itself as a full-stack superconducting quantum computing company rather than a component supplier or pure cloud API layer. The official about, products, and investor materials converge on the same core identity: IQM builds on-premise quantum computers, offers cloud access, and emphasizes that customers should be able to own and operate their systems directly. That matters because the company is not only selling qubits; it is selling an operating model built around sovereignty, local ecosystem development, and integration with high-performance computing environments. The current product family spans entry-level education hardware, higher-end research and HPC systems, a fault-tolerance-oriented Halocene line, and the Resonance cloud environment. This breadth suggests IQM is trying to cover the full maturation path from workforce development and experimentation to institutional production deployments, which makes the company overview materially different
    from a single-product startup story.'
  claimRefs:
