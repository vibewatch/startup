  topStrengths:
    - >-
      IQM has real on-prem deployment traction across Finland, Central Europe, Japan, and the U.S. national-lab
      ecosystem rather than only lab-stage claims.
    - >-
      The company has exceptional capital access for a European quantum startup, combining a record 2025 Series B, 2026
      bridge financing, and a public-market path.
    - >-
      Product breadth spans entry systems, flagship on-prem hardware, an error-correction line, and Resonance cloud
      access tied to HPC integration.
    - >-
      Sovereign and HPC positioning gives IQM a differentiated route to budgets that many cloud-first quantum peers
      still struggle to access.
  topRisks:
    - The pending RAAQ SPAC and first audited financial disclosure create a binary near-term underwriting event.
    - >-
      Government-funded and sovereign customers dominate the visible installed base, creating concentration and
      procurement-cycle risk.
    - >-
      Export-control tightening and dual-use restrictions could slow or block deliveries into current and target
      geographies.
    - >-
      The roadmap from current superconducting systems to fault-tolerant scale remains technically difficult and capital
      intensive.
  unresolvedGaps:
    - Audited FY2025 revenue, gross margin, burn, and revenue-recognition policy are not yet fully public.
    - >-
      Exact cap-table control, liquidation preferences, PIPE lock-ups, and redemption sensitivity remain unclear ahead
      of close.
    - Public evidence does not quantify customer concentration by revenue, renewal rates, or Resonance cloud retention.
    - Security/compliance certifications, uptime/SLA disclosure, and export-license history remain under-documented.
