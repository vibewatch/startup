summary:
  headline: |
    Bitsight 是定义品类的网络风险情报平台，已经有真实规模和战略相关性，上一轮公开 $2.4B 估值也能提供大致锚点；但审计后经营数据、当前融资条款和清晰优先权瀑布仍缺位，因此更适合继续研究，而不是直接买入。
