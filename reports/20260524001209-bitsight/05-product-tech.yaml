- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Bitsight workflow
  - Measurable benefit / evidence
  - Known limitation
  rows:
  - - Board and program reporting
    - Teams struggle to convert technical findings into defensible, comparable cyber-performance metrics
    - Ratings plus Advanced Analytics benchmark peers, track controls, forecast scenarios, and generate remediation plans
    - Daily ratings, peer analytics, six-month control history, and forecast tools are all public
    - Public evidence is stronger on analytics surface than on independent customer outcome proof
  - - Vendor onboarding and reassessment
    - Questionnaires and spreadsheets are slow, subjective, and hard to scale across large vendor estates
    - VRM builds inventory, reviews evidence, analyzes posture, and monitors changes continuously
    - Bitsight claims 72K+ vendor profiles, 90% vendor acceptance, and 75%+ assessment time reduction
    - ROI figures are company-claimed and need independent validation
  - - Zero-day third-party response
    - When critical CVEs hit, teams need to find exposed vendors quickly and coordinate outreach at scale
    - Vulnerability Detection & Response surfaces impacted vendors, supports bulk questionnaires, and tracks remediation status
    - Public page names 9000+ scanned vulnerabilities and 150+ CISA KEVs
    - Connector and downstream ticketing detail remain light in public docs
  - - Customer-assurance workflow
    - Security teams become bottlenecks for SIGs, certifications, and repeated security questionnaires
    - Trust Management Hub centralizes documents, versioning, sharing, and access controls
    - Bitsight markets 85% efficiency gain and 25% workload reduction
    - Need customer evidence on real sales-cycle lift and attach rate
  - - Exposure prioritization and attack-surface management
    - Teams drown in assets and CVEs without business context or exploitability ranking
    - ASI plus Vulnerability Intelligence map assets, correlate threat context, and prioritize with DVE and MITRE mappings
    - Public evidence shows 250M+ mapped assets and workflow integrations with leading VM tools
    - Native remediation boundaries versus partner systems are still not deeply documented
  - - Threat-intel operations
    - Analysts need context, not just raw IOCs or headlines
    - CTI, Pulse, Ransomware, Brand, Identity, and Adversary modules enrich underground signals into curated, role-specific workflows
    - Bitsight cites >7M items curated daily, 1000+ forums crawled, and <1 minute enrichment paths
    - Public docs say far more about coverage scale than about day-two analyst workflow metrics
  notes: Quantitative benefits are vendor-claimed unless the row explicitly cites third-party review or analyst material.
