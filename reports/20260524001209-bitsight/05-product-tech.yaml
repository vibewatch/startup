- id: integrations-developer-surface-and-roadmap
  title: Integrations, developer surface, and 2026 roadmap visibility
  body: |
    Bitsight's developer and integration story is real but more workflow-oriented than platform-engineering heavy. Vendor Risk Management explicitly says VRM data can sync through open API, TPRM Integrations claims 10 integrations across data feeds, VRM, and GRC tools, Vulnerability Intelligence names Tenable, Qualys, and Rapid7, Identity Intelligence says remediation can happen through IdP integration, and the Slack connector shows rating-change workflows moving into collaboration channels. That is enough to prove the platform is built to plug into other systems, not just to operate as an isolated console. The dated 2026 roadmap surface is narrower. RAU26 is the clearest timed product change, with preview and go-live dates plus concrete methodology edits. By contrast, many AI-heavy modules — Pulse, Brand Intelligence, Adversary Intelligence, and parts of the threat-intelligence suite — look current and commercially important, but the retained public source set is much better at describing features than at showing launch cadence, deprecation policy, or version history.
