- id: product-technology-verdict
  title: Product & technology verdict
  body: |
    Bitsight's product story is strongest when read as a shared-data platform rather than as a grab bag of cyber tools. The retained sources support a credible architecture in which externally observed telemetry, attribution, threat-intelligence enrichment, and governance processes are reused across ratings, remediation planning, vendor workflows, exposure discovery, zero-day response, and dark-web-informed threat modules. That architecture should make cross-sell and workflow expansion more believable than if each SKU stood on its own.

    The underwriting caveat is documentation depth. Public evidence is deep on what the modules promise and unusually clear on ratings governance, but thinner on deployment architecture, SLA boundaries, native-versus-partner action boundaries, and release chronology for the newer AI-heavy modules. Verdict: the product appears differentiated by data depth, attribution, and governance discipline, but diligence should still force management to show actual module attach, implementation effort, connector usage, and customer evidence that the broad platform story works in day-two operations rather than only in marketing.
