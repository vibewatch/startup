- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Public status
  - Scope
  - What it supports
  - Gap or concern
  rows:
  - - Trust Center
    - Live public hub
    - Privacy, security statements, AI-use policy, trusted-ratings materials, vulnerability disclosure
    - Centralizes trust and governance artifacts in one public surface
    - Does not by itself answer detailed control implementation, uptime, or cloud-region questions
  - - Privacy and cross-border privacy frameworks
    - Public privacy policy updated 2025-08-29
    - DPF participation plus APEC CBPR and PRP programs; CTI data collection disclosure
    - Shows Bitsight treats privacy and cross-border handling as part of the product story
    - Privacy policy is broad and legalistic, not a substitute for product-specific data-flow diagrams
  - - Trusted Ratings dispute process
    - Publicly described
    - Asset, finding, and methodology disputes; published average resolution times
    - Important confidence signal for a rating product whose value depends on attribution quality
    - Still relies on Bitsight's own governance process rather than fully independent adjudication
  - - Policy Review Board
    - Publicly announced governance body
    - Algorithm changes, dispute-resolution oversight, publication of critical decisions
    - Signals commercial independence and formal model-governance intent
    - Governance structure is dated 2020, so current operating cadence should be verified with management
  - - Outside-in methodology disclosures
    - Publicly documented in ratings pages and guide
    - Data sources, probing boundaries, vector weights, and annual RAU process
    - More methodological transparency than many cyber vendors offer publicly
    - Public docs still cannot eliminate the blind spot that external signals do not fully capture internal controls
  - - Review and competitor signal
    - Mixed but current
    - G2 review sentiment and UpGuard's external monitoring of Bitsight itself
    - Confirms real market adoption and that the category is externally testable
    - Also shows differentiation must exceed basic external scoring and dashboards
  notes: This table focuses on publicly readable trust and quality signals rather than private audits, SOC reports, or customer-only attestations.
