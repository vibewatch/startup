company:
  name: Bitsight
chapter:
  number: 5
  title: Product & Technology
  summary: |
    Bitsight's current product surface is broader than a security-ratings point solution: public materials show a shared cyber-risk intelligence backbone spanning security ratings and posture analytics, vendor-risk workflows, external attack-surface and vulnerability intelligence, and a growing threat-intelligence suite. The strongest product read is that one outside-in telemetry and attribution layer is being reused across board reporting, vendor monitoring, zero-day response, exposure management, and customer-assurance workflows. The main product risk is not lack of scope but uneven public documentation: the marketing surface is rich, the governance around ratings is unusually explicit, but deployment architecture, native-versus-partner workflow boundaries, and release chronology for several AI-heavy modules remain thinner than the breadth story.
sections:
- id: platform-definition-and-module-map
  title: Platform definition and module map
  body: |
    Bitsight now presents itself less as a single ratings vendor and more as a cyber risk intelligence platform with two visible operating planes. The governance-and-risk plane includes Security Ratings, Security Posture Management and Advanced Analytics, plus the third-party workflow stack of Vendor Risk Management, Continuous Monitoring, Vulnerability Detection & Response, and Trust Management Hub. The security-operations plane includes Cyber Threat Intelligence, Identity Intelligence, Attack Surface Intelligence, Vulnerability Intelligence, Pulse, Ransomware Intelligence, Brand Intelligence, and Adversary Intelligence. The good news is that this is not a random product menu: the retained pages repeatedly tie the modules back to common outside-in telemetry, attribution, and threat context. The caution is packaging clarity. Public messaging uses overlapping terms such as security ratings, security posture management, advanced analytics, attack surface intelligence, and exposure management, so SKU boundaries are less crisp than the breadth narrative itself.
