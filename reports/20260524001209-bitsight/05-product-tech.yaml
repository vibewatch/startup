  evidenceGaps:
  - type: missing-source
    severity: material
    topic: release-chronology-for-ai-heavy-modules
    missingEvidence: Dated release notes or launch pages for Pulse, Brand Intelligence, Ransomware Intelligence, Identity Intelligence, and Adversary Intelligence beyond current marketing pages.
    whyItMatters: Product maturity is easier to underwrite when feature chronology, general-availability timing, and deprecation history are explicit rather than inferred from current web copy.
    diligencePath: Request product release notes, launch decks, and a module timeline showing first release date, current GA status, and major 2025-2026 upgrades for the intelligence suite.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: deployment-architecture-and-sla-boundary
    missingEvidence: A current architecture brief covering cloud-provider choice, region topology, uptime commitments, logging boundaries, and any customer-selectable deployment options.
    whyItMatters: Deployment architecture, resilience boundaries, and tenancy options materially affect implementation risk, data-sovereignty fit, and incident-impact analysis for enterprise buyers.
    diligencePath: Request the latest architecture diagram, trust annex, uptime/SLA language, and security whitepaper used in late-stage enterprise diligence, then reconcile them to the public trust center and API-doc surface.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
