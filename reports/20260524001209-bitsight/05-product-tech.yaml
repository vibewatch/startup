- id: workflow-and-operating-model
  title: Product workflow and operating model
  body: |
    The public workflow story is strongest in the ratings, analytics, and vendor-risk surfaces. Bitsight's ratings guide describes an outside-in engine that collects internet-scale observations, attributes them to organizations, scores them across risk vectors, and refreshes ratings daily. Advanced Analytics then turns that stream into peer benchmarking, control tracking, remediation planning, enterprise heatmaps, and forecasting. On the third-party side, Vendor Risk Management makes the workflow explicit: build inventory, review evidence, analyze posture, and continuously monitor changes, with Continuous Monitoring and Vulnerability Detection & Response extending the loop into fourth-party visibility and zero-day outreach. Trust Management Hub closes a separate but commercially important workflow by helping vendors answer security reviews and share evidence with customers. Operationally, that means Bitsight's value is not just scoring but keeping multiple assurance and response loops on the same data foundation.
