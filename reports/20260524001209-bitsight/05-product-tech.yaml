- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Key dependency
  - Technical risk
  rows:
  - - Internet-scale collection layer
    - Passive sensors plus active probing gather externally observable signals on assets, services, and behavior
    - Sensor quality, active-scan coverage, and continued access to public and underground sources
    - Outside-in visibility cannot prove every internal control and may still surface false positives
  - - Attribution and entity-mapping layer
    - Continuously maps IPs, domains, certificates, and other artifacts to the right organization or vendor
    - Accurate ownership resolution, cloud-change detection, and historical mapping quality
    - Attribution mistakes directly weaken ratings trust and downstream workflow usefulness
  - - Ratings and analytics engine
    - Normalizes findings into risk vectors, benchmarks peers, and outputs remediation and forecast views
    - Model governance, empirical weighting, and annual algorithm updates
    - Public logic is readable at a policy level, but customers still need management evidence on precision and backtesting
  - - Workflow applications layer
    - Turns the data backbone into VRM, monitoring, zero-day response, trust-center, and assurance workflows
    - Usable UX, customer process adoption, and evidence lifecycle hygiene
    - Strong workflow claims exist, but implementation effort and module attach can vary by customer environment
  - - Threat-intelligence and exposure layer
    - Enriches assets and CVEs with underground, identity, ransomware, brand, and adversary context
    - Continuous dark-web collection, AI triage quality, and integration into operator workflows
    - AI-heavy modules are broad publicly, but technical boundary docs and release history are thinner
  - - Integration layer
    - Moves data and actions into APIs, GRC/VRM tools, chat systems, IdPs, and vulnerability-management systems
    - Open APIs, named connectors, and third-party system reliability
    - High-value automation is connector-dependent rather than obviously native end-to-end
  notes: This architecture map is synthesized from public product and methodology pages; it is not a literal internal service diagram.
