- id: architecture-data-and-deployment
  title: Architecture, data model, and deployment surface
  body: |
    The clearest public technical differentiator is Bitsight's shared outside-in data model. Security Ratings explains the mechanics: passive sensors and active probing observe externally visible assets, continuous network mapping attributes those observations to organizations, and the rating engine normalizes them into comparable scores. Attack Surface Intelligence extends that same approach from rating to asset discovery, claiming 250M+ attributed assets, multi-tenant visibility for parents and subsidiaries, and prioritization using business criticality plus live threat context. Cyber Threat Intelligence, Identity Intelligence, Vulnerability Intelligence, and Pulse all reuse the same internet, clear-web, deep-web, and dark-web collection model to move from posture measurement into faster detection and prioritization. The strength is obvious reuse of one data backbone across many workflows. The weakness is equally clear: public materials say much less about cloud-provider choice, region layout, uptime boundaries, or whether large buyers can choose materially different deployment patterns beyond the general SaaS-style surface.
