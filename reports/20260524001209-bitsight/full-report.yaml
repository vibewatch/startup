              larger workflows: the Interos collaboration shows federal supply-chain use cases, while the Belgium case
              and the current national-cybersecurity page show that government adoption remains a real part of the story
              rather than a one-off marketing example.


              The main adverse item surfaced in this chapter is the patent dispute with NormShield/Black Kite. PatSnap
              reports that BitSight filed the case in September 2023 and that it ended in February 2025 with a
              stipulated dismissal and each side paying its own costs. That outcome removes the overhang of an active
              federal IP fight, but the public summary does not reveal settlement terms or any continuing license
              commitments. Combined with the still-incomplete current board roster and the inconsistent public funding
              and customer totals, the litigation record reinforces the same diligence lesson: Bitsight's operating
              momentum is easier to verify than its full governance and ownership picture.
