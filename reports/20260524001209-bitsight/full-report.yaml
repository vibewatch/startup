              favorable: once a customer lands on the core dataset, Bitsight can upsell adjacent workflows that reuse
              the same telemetry backbone.


              What remains opaque is commercial structure. The reviewed official pages consistently push prospects
              toward demos and sales engagement instead of publishing public list pricing, standard contract terms, or
              module-level rate cards. That likely means realized price depends on enterprise scope, number of monitored
              entities, additional modules, and negotiated services. The absence of public pricing does not invalidate
