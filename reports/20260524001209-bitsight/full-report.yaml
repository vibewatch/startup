        - Downgrade confidence in the core moat and require customer-level retention proof before underwriting upside.
      - - Public-sector dependence
        - Federal or national-cybersecurity workflow evidence
        - >-
          No expansion beyond reference use cases, loss of visible government references, or inability to produce award
          details in diligence
        - Treat public-sector narrative as marketing rather than a moat and haircut strategic premium.
      - - Moody’s distribution thesis
        - Embedded workflow proof in capital-markets or executive-risk products
        - Little product or revenue evidence that Moody’s is increasing Bitsight distribution or stickiness
        - Reduce partnership value in the thesis and reframe Moody’s mostly as passive capital support.
      - - Workflow expansion
        - Trust-center, onboarding, and collaboration adoption
        - No measurable proof that trust workflows or integrations move usage, retention, or win rates
        - Assume score-only economics and compress terminal multiple assumptions.
      - - Market fit versus buyer expectations
        - Data-quality and ERM-integration proof from customers
        - Customers continue to report patchwork integrations or weak AI usefulness despite growing budgets
        - Treat market growth as non-transferable to Bitsight and prioritize product-embedment diligence.
      - - Leadership continuity
        - Succession and governance visibility
        - CEO or other key leader departure without a visible bench or formal succession package
        - Pause the investment until governance, operating continuity, and customer-trust controls are re-underwritten.
    notes: >-
      Kill criteria are designed to be monitored quarterly and tie directly to commercial trust, workflow embedment, and
      governance continuity rather than to generic market volatility.
