          detail: Onboarding workflow integration.
        - id: d7
          label: Slack
          detail: Collaboration and rating-change workflow integration.
        - id: d8
          label: Customers / insurers / boards
          detail: Stakeholders who monetize or rely on rating credibility.
      edges:
