      - number: '2.4'
        title: Diligence Gaps and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The category is investable, but the market work should stay disciplined. First, the TAM is
              definition-sensitive: published market reports disagree materially, and KPMG’s spend mix suggests that
              only part of headline TPRM spend is directly relevant to cyber-data platforms like Bitsight. Second, the
              market clearly wants automation and continuous monitoring, but the strongest ROI numbers in the public
              source pack are still vendor-reported. Third, public evidence does not isolate how much of Bitsight’s
              revenue comes from ratings, workflow, public-sector, or adjacent threat-intelligence products, which means
              SOM precision is still missing. For valuation, the right conclusion is not that the market is small; it is
              that the market is large enough, fast-growing enough, and pain-driven enough to matter, while share
              assumptions must remain bounded by evidence on workflow fit, budget ownership, and proof that objective
              cyber data wins against questionnaire-led and workflow-led incumbents in actual buying cycles.
            claimRefs:
              - CM014
              - CM015
              - CM017
              - CM035
              - CM043
              - CM044
              - CM045
              - CM050
