      - number: '3.2'
        title: Capability breadth, packaging gaps, and buyer friction
        blocks:
          - type: paragraph
            body: >-
              On paper, Bitsight has more breadth than a pure ratings vendor. The retained Bitsight pages show a layered
              stack: ratings, vendor-network workflows, continuous monitoring, customer-facing trust management, threat
              intelligence, asset discovery, and vulnerability prioritization. That breadth is important because most
              direct peers are converging toward the same destination from different starting points. SecurityScorecard
              pushes threat-informed TPRM and a trial-led motion. UpGuard blends vendor risk, attack surface management,
              trust pages, and automation. Panorays leans hard into nth-party visibility, questionnaires, and
              remediation collaboration. ProcessUnity is strongest where the buying center values orchestration and
              standardized workflow over a branded external score. Recorded Future and Qualys sit farther away, but each
              covers adjacent jobs that can siphon budget from Bitsight depending on the initiating problem.


              Packaging is where the reviewed sources look weakest across the category. Most vendors expose demos, value
              calculators, or free assessments rather than contract prices, seat counts, vendor-volume tiers, or
              attach-rate economics. SecurityScorecard's 14-day free trial and UpGuard's free instant score are the
              clearest public self-service entry points in the retained set; most others, including Bitsight, remain
              demo-led. That matters because public entry friction affects early shortlist velocity even in enterprise
              software. It also makes it harder to prove that Bitsight's broader platform commands a durable commercial
              premium over vendors selling a simpler ratings, workflow, or exposure-led wedge. G2's review excerpts
              reinforce that the differentiation story is not purely about features: integrations, customizable
