  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, workflow incumbents, and adjacent substitutes
        blocks:
          - type: paragraph
            body: >-
              Bitsight no longer competes in a neat one-product category. The retained sources show three overlapping
              competitor groups. First are direct cyber-ratings and TPRM peers such as SecurityScorecard, RiskRecon,
              UpGuard, Panorays, and Black Kite. They all promise some combination of continuous external monitoring,
              supplier risk scoring, and AI-assisted assessment workflows. Second are workflow incumbents such as
              ProcessUnity and Archer, plus lower-end manual questionnaire programs, which can substitute for parts of
              the buyer job when the customer mainly needs vendor intake, evidence collection, and periodic governance
              rather than a canonical external rating. Third are adjacent cyber-risk suites such as Recorded Future and
              Qualys, which attack neighboring budgets from threat intelligence and exposure-management angles.


              That matters because Bitsight itself has expanded beyond a ratings product into a broader cyber risk
              intelligence platform. Its own pages now pitch third-party risk management, continuous monitoring, trust
              management, cyber threat intelligence, attack surface intelligence, and vulnerability intelligence.
              Independent shortlist sources reinforce that the market sees BitSight alternatives not just as “other
              ratings vendors,” but as a blended field of ratings-first peers, workflow-heavy TPRM platforms, and
              broader cyber-risk tools. In practice, the shortlist a buyer sees will depend on whether procurement
              starts from vendor-risk operations, board reporting, cyber insurance, exposure management, or threat
              intelligence. Bitsight therefore competes against both direct like-for-like peers and partial substitutes
              that solve only one slice of the same risk-management workflow.
