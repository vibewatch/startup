  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Transmission map showing how trust, workflow embedment, and market expectations cascade into revenue quality and
      valuation. The central node is rating credibility rather than any one technical control.
    data:
      nodes:
        - id: n1
          label: Algorithm changes / stale findings
          detail: RAU26 changes and review-platform complaints raise explainability pressure.
        - id: n2
          label: Rating credibility
          detail: Whether customers, insurers, boards, and investors still trust the score.
        - id: n3
          label: Workflow embedment
          detail: Trust center, onboarding, and collaboration usage beyond a point score.
        - id: n4
          label: Renewals and pricing power
          detail: Commercial durability of the core product set.
        - id: n5
          label: ARR / free cash flow
          detail: Growth and cash generation visible in public milestones.
        - id: n6
          label: Valuation support
          detail: Ability to defend premium positioning versus broader TPRM workflows.
        - id: n7
          label: Market expectations
          detail: Budgets rise, but buyers want integrated data quality and ERM linkage.
        - id: n8
          label: Partner leverage
          detail: Moody’s and public-sector workflows amplify both upside and dependency.
      edges:
        - from: n1
          to: n2
          label: too much change erodes trust
        - from: n2
          to: n4
          label: credibility shapes renewals
        - from: n3
          to: n4
          label: workflow stickiness supports pricing
        - from: n4
          to: n5
          label: commercial durability drives growth
        - from: n5
          to: n6
          label: growth and cash flow anchor value
        - from: n7
          to: n6
          label: market sets proof threshold
        - from: n7
          to: n3
          label: buyers reward integrated workflows
        - from: n8
          to: n3
          label: partners help embed usage
        - from: n8
          to: n6
          label: partners influence strategic premium
        - from: n2
          to: n6
          label: trust loss compresses value
    approximationNotes: This is a synthesized causal map, not a company-disclosed operating model.
    claimRefs:
      - CR026
      - CR034
      - CR048
      - CR051
      - CR053
      - CR055
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Dependency map of the counterparties and workflow surfaces that matter most to Bitsight’s risk profile. The key
      nodes are Moody’s, public-sector references, and integrations that move Bitsight closer to operational workflows.
    data:
      nodes:
        - id: d1
          label: Bitsight platform
          detail: Security ratings, trust workflows, and exposure data.
        - id: d2
          label: Moody’s
