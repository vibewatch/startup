            body: >-
              Bitsight's revenue model now looks like a bundled cyber-risk intelligence platform rather than a single
              security-ratings SKU. Official product pages show monetizable modules across security ratings and
              security-performance management, vendor risk management, trust management, attack-surface intelligence,
              cyber threat intelligence, and cyber-risk quantification. That breadth matters financially because the
              2025 ARR announcement tied growth to multiproduct adoption, exposure-management attach, and expansion from
