  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Logic
        blocks:
          - type: paragraph
            body: >-
              Bitsight should be sized inside cyber-focused third-party risk management, not inside all procurement,
              governance, or generic GRC software. The relevant spend is the set of products and workflows that
              identify, assess, score, monitor, and remediate supplier cyber risk across the digital supply chain. The
              company’s own product surface supports that narrower boundary: vendor risk management, continuous
              monitoring, security ratings, vulnerability response, trust management, and integrations that connect
              cyber evidence into customer and GRC workflows. That definition matters because public TAM estimates are
              highly sensitive to methodology. The Business Research Company sizes the overall market at USD 6.82
              billion in 2025, USD 8.09 billion in 2026, and USD 15.45 billion by 2030, while Next Move Strategy gives a
              higher near-term baseline and 2030 forecast. Diligence should therefore use a layered lens: total
              published TPRM market as the ceiling, cyber-tool spend as the practical SAM, and Bitsight’s externally
              observable data-and-workflow wedge as the near-term SOM frame.
