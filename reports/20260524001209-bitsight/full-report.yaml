  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and platform logic
        blocks:
          - type: paragraph
            body: >-
              Bitsight is a Boston cyber risk intelligence company founded in 2011 and associated in public records with
              Bitsight Technologies, Inc. Its current public address is 111 Huntington Ave, Floor 4 in Boston, a
              headquarters footprint that reflects the 2018 move from Cambridge into a larger Back Bay office. The
              company's core identity is still anchored in Security Ratings: an outside-in scoring system on a
              250-to-900 scale that Bitsight says is refreshed daily and built from externally observable evidence
              rather than questionnaires or self-reporting.


              That ratings engine now feeds a much broader platform. Product pages split the business across
              governance-and-risk workflows such as vendor risk management, trust management hub, advanced analytics,
              and national cybersecurity, and security-operations workflows such as attack surface intelligence, cyber
              threat intelligence, and identity intelligence. UpGuard's independent profile describes the same
              combination as a unified cyber risk intelligence platform spanning TPRM, exposure management, and threat
              intelligence. The expansion is strategically coherent: KPMG's 2026 survey says compliance and cyber risk
              are the top TPRM drivers, while Marsh reports that 70% of organizations suffered at least one material
              third-party cyber incident in the past year, which helps explain why Bitsight keeps extending beyond
              ratings into broader exposure and supply-chain workflows.
