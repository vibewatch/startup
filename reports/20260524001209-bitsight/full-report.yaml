      - number: '1.4'
        title: Scale, customer footprint, and public proof points
        blocks:
          - type: paragraph
            body: >-
              Public scale evidence is strongest on revenue momentum and mixed on everything else. Bitsight announced
              that it crossed $100 million in ARR in 2021 and more than $200 million ARR with positive free cash flow in
              April 2025. The 2025 release also provides useful commercial texture: enterprise contracts above six
              figures contribute nearly half of ARR, half of new revenue came from customer expansion, 70% of new 2024
              deals included exposure-management solutions, 40% of early cyber-threat-intelligence adopters after the
              Cybersixgill acquisition were existing customers, and 30% of new customers in 2024 were headquartered
              outside North America. Those metrics collectively suggest a company that is no longer just
              category-defining, but already operating like a scaled multi-product platform.


              Customer-count disclosure is less tidy. One 2025 company statement says 3,300 customers and 65,000
              organizations active on the platform, while a current Bitsight ratings guide says more than 3,500
              customers and the same 65,000-organization platform footprint. The prudent read is low-3,000s customers
              and roughly 65,000 monitored organizations, with exact current paying-customer count left open. Headcount
              is similarly soft: GetLatka estimates roughly 743 employees as of 2026, while the only official workforce
              signal in this evidence set is that Bitsight operates remote-work first. Public proof points do, however,
              show broad deployment. Bitsight said in 2020 that 38 countries used its solutions for national
              cybersecurity, its current product page says 120+ government institutions rely on the platform, and
              customer stories from Belgium, EPAM, Coventry, Schneider Electric, and DATAMARK point to measurable
              operating value across government, software, financial services, manufacturing, and outsourcing.
