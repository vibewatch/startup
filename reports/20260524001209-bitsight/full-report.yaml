  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Bitsight screens as a strong company but not yet as a clean investment call. The public case for quality
              is real: the company disclosed a move from more than $100 million of ARR in 2021 to more than $200 million
              in 2025, claimed positive free cash flow, and tied nearly half of ARR to six-figure contracts plus
              expansion-led growth from the installed base. Moody's also put a hard strategic marker on the business
              with a $250 million investment at a $2.4 billion valuation in 2021. Those facts make the stale disclosed
              mark look directionally plausible rather than obviously excessive.


              The problem is that valuation is now more opaque than the operating story. Public sources still do not
              disclose current share-class terms, liquidation preferences, NRR, audited margins, cash, debt, or a
              current financing ask. That means the same $2.4 billion headline can be fair for one investor and
              unattractive for another depending on the hidden waterfall and whether 2025 free cash flow is durable.
              Recommendation: research-more. If the entry price is at or below the last disclosed $2.4 billion anchor
              and diligence confirms clean preferences plus durable expansion economics, the stance can move toward
              track or buy. If management seeks a material premium without those proofs, the risk-adjusted answer
              becomes no.
