      - CV056
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
      - Recommendation impact
    rows:
      - - Audited financials and ARR bridge
        - Audited 2024-2025 statements plus ARR / revenue reconciliation
        - Determines whether the company deserves a premium software multiple at all
        - CFO / finance team to provide data room pack
        - Single largest upgrade trigger
      - - Retention and cohorts
        - NRR, GRR, logo retention, and cohort expansion bridges
        - Separates durable expansion economics from one good selling year
        - Revenue operations and FP&A review
        - Upgrades confidence if retention is elite
      - - Cap table and preference stack
        - Share classes, prefs, ratchets, option pool, and board rights
        - Controls real investor returns in base and bear exits
        - Finance plus counsel to provide waterfall model
        - Can move fair to unattractive instantly
      - - Cash, debt, and runway
        - Current cash, debt schedule, covenants, and financing plan
        - Clarifies whether positive FCF means self-funding or just temporary relief
        - Treasury and finance diligence
        - Determines urgency of any next round
      - - Customer quality and concentration
        - Top-customer mix, vertical concentration, renewal history, and insurer / government expansion detail
        - Shows whether the marquee customer story is broad and repeatable
        - Sales and customer-success diligence
        - Affects both exit readiness and downside risk
      - - Current market check
        - Whether management is actually seeking capital, at what price, and on what terms
        - Recommendation cannot be fully price-sensitive without a live entry reference
        - CEO / CFO financing process discussion
        - Directly determines go / no-go
    notes: >-
      These asks are ordered by decision impact rather than by convenience. Without the first three, the chapter should
      stay at research-more.
