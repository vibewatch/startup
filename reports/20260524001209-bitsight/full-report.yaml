      - number: '1.2'
        title: Leadership, founder continuity, and governance
        blocks:
          - type: paragraph
            body: >-
              The modern operating era is clearly tied to Stephen Harvey, who became CEO in January 2020 after serving
              as COO at Institutional Shareholder Services. That transition matters because it marked a handoff from Tom
              Turner, the earlier scaling CEO who led the company through category formation, the 2018 headquarters
              move, and the Series D raise. Harvey's background in data, analytics, and operational scaling is
              consistent with Bitsight's subsequent push into adjacent markets, larger enterprise contracts, and the
              Moody's transaction.


              Governance widened around the same time. Bob Brennan became board chairman in June 2020, bringing
              experience from Veracode, CA Technologies, and Iron Mountain, while Shelley B. Leibowitz joined the board
              in April 2021 with enterprise-risk and financial-services credentials. Founder continuity is most visible
              through co-founder and CTO Stephen Boyer, who is still publicly linked to the company's ratings
              methodology and Policy Review Board. That board matters because Bitsight explicitly uses it to govern
              algorithm changes and appeals. The unresolved caveat is that accessible official pages do not publish a
              fresh full board roster, so current committee composition, director independence, and any board turnover
              after the Moody's transaction still require direct diligence confirmation.
