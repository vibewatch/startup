  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from market demand and commercial proof through financing opacity and competitive
      pressure to a research-more call rather than an outright buy or avoid.
    data:
      nodes:
        - id: n1
          label: Category demand
          detail: TPRM demand is expanding as third-party incidents and cyber budgets rise
        - id: n2
          label: Commercial proof
          detail: ARR crossed >$200M with expansion-led and six-figure-contract signals
        - id: n3
          label: Strategic validation
          detail: Moody's invested $250M at a $2.4B mark and stayed a minority owner
        - id: n4
          label: Competitive pressure
          detail: Trial-led and workflow-heavy peers limit scarcity value
        - id: n5
          label: Capital-structure opacity
          detail: Preferences, cash, NRR, and audited margins remain private
        - id: n6
          label: Range not point
          detail: Public evidence supports a fair range, not a precise current price
        - id: n7
          label: research-more
          detail: Proceed only with valuation discipline and hard diligence asks
      edges:
        - from: n1
          to: n2
          label: Demand supports growth
        - from: n2
          to: n3
          label: Proof supports strategic interest
        - from: n3
          to: n6
          label: Anchor exists
        - from: n4
          to: n6
          label: Premium capped
        - from: n5
          to: n6
          label: Precision blocked
        - from: n6
          to: n7
          label: Stay conditional
    approximationNotes: >-
      Qualitative decision chain only. It summarizes how the public evidence should influence the call rather than
      claiming deterministic weights.
