      - CV005
      - CV043
      - CV044
      - CV045
      - CV055
      - CV056
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-ready scoring of the investment dimensions that matter most for Bitsight at the current evidence quality level.
    data:
      items:
        - label: Market demand
          score: 8
          note: Third-party cyber incidents and budget growth support category demand.
        - label: Commercial proof
          score: 7
          note: ARR scale and expansion signals are good, but still largely company-claimed.
        - label: Moat durability
          score: 7
          note: Customer footprint and platform breadth help, yet peer convergence is real.
        - label: Economics evidence
          score: 5
          note: Positive FCF is encouraging but unaudited and un-sized.
        - label: Financing clarity
          score: 3
          note: Current cap table, prefs, and live pricing are not public.
        - label: Valuation support
          score: 6
          note: The stale 2021 anchor is fair-ish, not obviously cheap.
        - label: Risk load
          score: 4
          note: Hidden preferences and competitive compression make downside real.
        - label: Evidence quality
          score: 5
          note: Enough to set discipline, not enough for high-confidence conviction.
    approximationNotes: >-
      Scores are ordinal judgments from the retained evidence set and should be read as underwriting triage, not a
      benchmarked market index.
