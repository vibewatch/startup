      - CV051
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Illustrative enterprise-value sensitivity to different ARR and multiple combinations, anchored on public ARR
      signals rather than management guidance.
    data:
      items:
        - label: 'Bear: 6x × $190M'
          value: 1.1
          note: Assumes slower growth, weaker proof, and no premium for opacity
        - label: 'Bear-base: 8x × $200M'
          value: 1.6
          note: Assumes the 2025 ARR milestone is real but quality still discounts sharply
        - label: 'Base-low: 10x × $220M'
          value: 2.2
          note: Requires modest ARR growth plus decent retention and FCF confirmation
        - label: 'Base-high: 12x × $230M'
          value: 2.8
          note: Roughly consistent with a fair outcome around the stale public mark
        - label: 'Bull: 14x × $250M'
          value: 3.5
          note: Needs sustained expansion and evidence that margins can scale like software
        - label: 'Full bull: 16x × $260M'
          value: 4.2
          note: Requires premium-software quality and cleaner public-comp support than exists today
    approximationNotes: >-
      Values are in USD billions. Multiples are analyst assumptions based on the retained reference set, not live market
      quotes.
    claimRefs:
      - CV005
      - CV013
      - CV029
      - CV043
      - CV044
      - CV049
      - CV050
      - CV056
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Low/base/high valuation ranges for bear, base, and bull cases, with the last disclosed $2.4B mark shown as the
      public reference point.
    data:
      items:
        - label: Bear-case EV (2027-2028)
          low: 1100
          base: 1400
          high: 1700
          unit: USD M
          note: Growth slows, premium fades, and opacity remains unresolved
        - label: Base-case EV (2027-2028)
          low: 2200
          base: 2550
          high: 2900
          unit: USD M
          note: Modest ARR growth and decent efficiency keep value around the stale public anchor
        - label: Bull-case EV (2027-2028)
          low: 3400
          base: 3800
          high: 4200
          unit: USD M
          note: Requires strong retention, durable FCF, and a cleaner software-quality narrative
        - label: Last disclosed valuation anchor (2021)
          low: 2400
          base: 2400
          high: 2400
          unit: USD M
          note: Moody's strategic investment reference point
        - label: 2x gross-return threshold versus $2.4B anchor
          low: 4800
          base: 4800
          high: 4800
          unit: USD M
          note: Helpful hurdle for new-money discipline before dilution
    approximationNotes: >-
      Illustrative only. Real investor returns depend materially on the undisclosed preference stack and any new
      financing between entry and exit.
