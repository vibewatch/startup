        title: Milestones, partnerships, and open risks
        blocks:
          - type: paragraph
            body: >-
              Bitsight's chronology shows a company that kept broadening the use cases around its ratings core. The
              foundational milestones are 2011 founding, the 2018 HQ move and Series D, the 2020 CEO and chairman
              appointments, the 2020 launch of the Policy Review Board, the August 2021 ARR crossing above $100 million,
