      - number: '7.4'
        title: Financial and Model Risks
        blocks:
          - type: paragraph
            body: >-
              The financial risk is not that Bitsight lacks a market. Public evidence points the other way: the company
              disclosed more than $200 million of ARR and positive free cash flow in 2025, while KPMG and Marsh show
              that third-party cyber incidents remain common and that budgets are still rising. The problem is model
              fit. KPMG’s 2026 survey says buyers increasingly care about regulatory compliance, ERM integration,
              reliable data, and usable AI-enabled workflows; only a small minority report fully integrated programs or
              very effective AI. That matters because a standalone score can be commoditized faster than a workflow
              system that owns remediation, reporting, or procurement action. Bitsight’s mitigation is to expand into
              trust centers, response workflows, and executive risk packaging, but the same market data implies
              customers will punish weak data quality or poor integration quickly. In other words, the market tailwind
              exists, yet it raises the bar for proof. If Bitsight’s workflow expansion does not keep pace with buyer
              expectations, the company can still face valuation and renewal pressure even in an expanding spend
              environment.
