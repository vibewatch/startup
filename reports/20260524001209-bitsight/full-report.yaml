      - number: '8.3'
        title: Comparable set and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The comparable set is more useful for boundaries than for exact pricing. On the upside, Qualys shows that
              scaled cybersecurity software can produce strong public-market profitability, while Bitsight's own
              customer footprint across banks, insurers, government agencies, and Fortune 500 buyers supports a
              strategic-quality revenue base. On the downside, direct and adjacent substitutes have become more
              credible. SecurityScorecard markets a 14-day free trial, UpGuard leans into AI workflows, Panorays
              emphasizes nth-party visibility and onboarding speed, ProcessUnity advertises deep workflow coverage, and
              Recorded Future competes for adjacent threat-intelligence budgets. The competitive story is no longer just
              "Bitsight versus another ratings company."


              That matters because it shapes exit readiness. A strategic exit to a larger information-services, ratings,
              or risk-data buyer looks more plausible than a clean stand-alone IPO today. Moody's already validated the
              strategic logic, and Bitsight's customer list plus embedded workflow integrations with Venminder and Slack
              suggest real distribution value inside larger platforms. But IPO readiness remains weaker than strategic
              relevance because the public disclosure surface still lacks audited financials, retention data, and a
              clean filing trail. In other words, Bitsight looks acquisition-worthy before it looks
              public-company-ready.
