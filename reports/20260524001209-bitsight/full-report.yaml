  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Bitsight’s legal and regulatory risk is less about classic product liability and more about whether a
              company that monetizes external cyber judgments can keep its privacy, fairness, and disclosure norms
              credible as the market scales. The privacy policy is explicit that Bitsight’s CTI workflows may handle
              clear-web, dark-web, and deep-web data, including compromised and sensitive personal information, and that
              the company may act as a joint controller with customers and partners. That creates multi-jurisdiction
              exposure around data transfers, retention, and legal basis, partially mitigated by the company’s published
              DPF and APEC certifications and its trust-center controls. A second risk cluster is ratings governance:
              Bitsight has formalized a Policy Review Board, dispute rights, and published resolution expectations, but
              those same commitments raise the cost of getting model changes wrong. The NormShield patent dispute did
              not end existentially, yet it reminds investors that ratings and exposure-management workflows sit inside
              a real IP battleground. The remaining blocker is transparency: without full PACER materials and direct
              federal award detail, residual legal and public-sector compliance exposure cannot be fully cleared.
