      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fair only near the stale public anchor
            body: >-
              Bitsight looks too strong to dismiss but too opaque to chase. Around the 2021 $2.4B anchor, the public
              case is fair; materially above it, diligence has to do all the work.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV044
              - CV047
          - type: callout
            title: Preference terms can erase apparent fairness
            body: >-
              The single most dangerous hidden variable is the capital structure. A clean-looking enterprise value does
              not guarantee an attractive common-equity outcome once preferences and dilution are modeled.
            calloutType: risk
            claimRefs:
              - CV045
              - CV054
          - type: callout
            title: The base case assumes 2025 free cash flow is durable enough to matter
            body: >-
              If the positive-free-cash-flow milestone proves temporary or working-capital-driven, the valuation range
              should shift toward the bear case quickly.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV056
