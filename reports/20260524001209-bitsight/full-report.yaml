            body: >-
              The biggest unresolved customer risk is concentration opacity. Bitsight discloses a high-value enterprise
              mix, government reach, and cross-sell momentum, but it does not disclose top-customer share, top-vertical
              share, public-sector mix, or direct-versus-partner channel mix. The Interos federal supply-chain
              announcement is important because it shows at least one government route that is partner-mediated. That is
              not inherently negative, but it means some public-sector growth may come with channel dependence and less
              direct control over margin or renewal motion. Likewise, the 38% Fortune 500 figure is impressive, but it
              says nothing about whether a handful of very large customers dominate ARR.


              Proof quality is the other key caution. Phil Venables’ critique is the right adverse frame: security
              ratings can be useful, especially as negative signals, but they are not accurate enough to replace deeper
              supplier assessment or direct evidence. That matters in procurement. A customer may love the ability to
              benchmark vendors quickly, yet still reject over-reliance on a rating if the underlying methodology is
              disputed or if integration and reporting depth are weak. The current G2 review set hints at that tension
              by praising visibility and automation while still asking for stronger integrations and customizable
              reporting. Net: Bitsight’s customer base appears broad and strategically valuable, but the public record
              is still not good enough to clear concentration or durability risk without management disclosure.
