      - number: '4.3'
        title: Cost structure and margin drivers
        blocks:
          - type: paragraph
            body: >-
              Bitsight's cost structure should be thought of as software-like on the revenue line but data-heavy beneath
              the surface. Official materials describe continuous monitoring of 40M+ companies, attribution of 250M+
              digital assets, and more than 7M threat-intelligence items curated daily. That combination implies
              significant fixed expense in telemetry collection, AI attribution, researcher labor, storage, compute, and
              product engineering. Those costs likely sit across cost of service, R&D, and customer-facing operations
              rather than in a lightweight SaaS shell. They also explain why Bitsight keeps expanding workflow products:
              reusing one dataset across multiple modules is the clearest path to margin leverage.


              The best public profitability anchor is therefore not a Bitsight figure but a comparable benchmark. Qualys
              reported a 47% adjusted EBITDA margin in Q1 FY26, showing what a mature cyber-software platform can look
              like at scale. Bitsight may or may not be near that level; the public record cannot tell us. Competition
              also matters for margin path. SecurityScorecard, RiskRecon, Panorays, and ProcessUnity all market
              continuous monitoring, AI automation, and vendor workflows, which means Bitsight must keep spending on
              data quality, integrations, and product breadth to preserve pricing power. The margin story is plausible,
              but still not disclosed.
