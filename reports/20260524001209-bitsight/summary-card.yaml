  topStrengths:
    - >-
      Bitsight created the security-ratings category and now sells a broader cyber risk platform across ratings, TPRM,
      exposure management, and threat intelligence.
    - >-
      Public evidence supports meaningful commercial scale with more than $200M ARR, positive free cash flow, six-figure
      enterprise contracts, and visible cross-sell into exposure-management products.
    - >-
      Strategic relevance is reinforced by Moody's $250M investment, strong penetration in banks, insurers, Fortune 500
      companies, and a meaningful government footprint.
  topRisks:
    - >-
      Current cap-table terms, liquidation preferences, and any live pricing process are not public, so return math can
      diverge materially from the headline enterprise value.
    - >-
      Competitive convergence from SecurityScorecard, UpGuard, RiskRecon, Panorays, and workflow-led TPRM vendors can
      compress scarcity value and valuation multiples.
    - >-
      Public evidence still lacks audited financials, NRR, gross margin, cash, debt, and a reliable current filing
      trail, limiting conviction on economics quality.
    - >-
      Public datasets conflict on lifetime funding, customer count, and headcount, reducing confidence in some scale
      metrics until management reconciles them.
  unresolvedGaps:
    - >-
      Fully diluted cap table, liquidation preferences, protective provisions, and any new-round or secondary pricing
      process.
    - >-
      Audited 2024-2025 financial statements, NRR / GRR, gross margin by product, cash balance, debt schedule, and
      cash-flow bridge.
    - Exact current paying-customer count, top-customer concentration, and verified headcount/geographic mix.
    - Current board roster, committee assignments, and any governance changes since the Moody's transaction.
