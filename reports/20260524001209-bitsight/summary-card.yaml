summary:
  headline: >
    Bitsight is a category-defining cyber risk intelligence platform with real scale, strategic relevance, and a
    plausible valuation anchor around the last public $2.4B mark, but the lack of audited economics, current financing
    terms, and clear preference-waterfall disclosure supports a research-more recommendation rather than a clean buy
    call.
