        - 试用公开；完整企业合同经济性未披露
        - TITAN Watch、Assess、Secure、AI 智能体、持续监控
        - 合同底价、受监控供应商分层、附加模块定价
        - 保留来源中摩擦最低的直接同业入口
      - - RiskRecon
        - 一次性报告 / 持续监控话术
        - 未保留公开标价
        - 外向内态势检查、持续监控、RFP 差异化支持
        - 投资组合定价、监控单元、高级工作流模块
        - 适合分层监控，但商业上仍由销售主导
      - - UpGuard
        - 免费即时安全评分和免费试用
        - 自助入口公开；企业套餐定价未公开
        - 供应商风险、攻击面管理、用户风险、信任管理、自动化
        - 按供应商计费、高级工作流经济性、部署限制
        - 快速初评路径能更早抢到入围名单的关注
      - - Panorays
        - 演示 / 报告驱动
        - 留存公开资料没有价格细节
        - 动态风险评级、问卷、N 方发现、整改协作
        - 供应商分层定价、功能打包、服务成分
        - 工作流更重的替代方案，但商业价值要靠销售讲透，不能靠试用自然显现
      - - Black Kite
        - 报告驱动
        - 留存公开资料没有价格细节
        - 评级、勒索软件风险、第三方生态分析、财务影响视角
        - 单位经济、模块打包
        - 威胁优先的包装即便缺少公开价格细节，也能打动风险量化买家
      - - ProcessUnity
        - 演示和 ROI 计算器
        - 留存公开资料没有标价
        - 端到端 TPRM 工作流、全球风险交易所、威胁响应、网络风险管理
        - 软件与服务拆分、供应商数量分层、交易所定价
        - 编排叙事很强，但外部买家仍看不清价格
      - - Recorded Future
        - 演示和价值计算器
        - 留存公开资料没有标价
        - 威胁情报、自主威胁运营、研究和情报服务
        - 席位 / API 定价、情报套餐分层、供应商风险附加项
        - 预算竞争更多来自情报团队，而不是采购团队
      - - Qualys
        - 留存来源集中在报价
        - 留存来源披露规模指标，不披露 TPRM 套餐价格
        - 20+ 个安全与合规应用
        - TPRM 专项模块、供应商风险打包、合同下限
        - 只有暴露面 / 合规预算负责人主导采购时，才可能替代 Bitsight
      - - Rapid7
        - 留存来源摘录无法判断
        - 留存的投资者关系页没有披露可用价格或产品套餐细节
        - 除投资者关系页面的表层信息外，留存本地来源无法支撑更多判断
        - 产品打包、客户分层、公开入门动作
        - 这是证据缺口，不是有把握的公开价格对比
    notes: 这是一张公开信号下的包装表，不是实际成交价表。留存来源绝大多数披露的是试用、演示、免费报告或价值计算器，而不是签约 ACV、供应商数量分层或折扣。
