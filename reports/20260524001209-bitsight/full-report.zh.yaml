      - number: '1.3'
        title: 资本结构、投资方和利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Bitsight 已披露的资本历史有一个干净锚点，也有一个混乱锚点。干净锚点是 2018 年 6 月的 Series D：Warburg Pincus 领投 $60 million，使官方累计融资达到 $155
              million，并让 Warburg 董事总经理 Cary Davis 获得董事席位。混乱锚点是 2021 年 9 月的 Moody's 交易：它把对 Bitsight 的 $250 million 投资与
              VisibleRisk 收购合并在一起，并按 $2.4 billion 给 Bitsight 定价。Bitsight 还表示 Moody's 将成为其最大股东，但仍是少数股东，这意味着其治理位置是战略性但非控股。


              尽调难点在于累计融资口径。Tracxn 把 2021 年交易视为 Series E，并报告八轮合计 $398 million；GetLatka 则仍只报告五轮合计 $150.6 million，并把 2018
              年视为最后一次融资。最稳妥的解读是，在看到 2021 年交易文件前，不强行给出单一累计融资数字。概览层面，经得住的事实是：Warburg 承销了 2018 年后期轮，Moody's 于 2021
              年重置了股东地图，而 Bitsight 如今处在一个少见位置——既是规模化私有网络安全平台，又同时带有财务赞助方和战略股东动态。
