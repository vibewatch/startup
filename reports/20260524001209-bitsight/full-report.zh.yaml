      - number: '1.4'
        title: 规模、客户足迹和公开证明点
        blocks:
          - type: paragraph
            body: >-
              公开规模证据在收入动能上最强，其他维度则更混杂。Bitsight 宣布其 2021 年 ARR 突破 $100 million，并在 2025 年 4 月超过 $200 million ARR
              且自由现金流为正。2025 年公告还给出了有用的商业纹理：六位数以上企业合同贡献近半 ARR，新增收入一半来自客户扩张，2024 年 70% 的新交易包含暴露面管理方案，收购 Cybersixgill
              后早期网络威胁情报采用者中 40% 是存量客户，2024 年 30% 的新客户总部位于 North America 之外。这些指标合在一起说明，公司不再只是定义品类，而是在按规模化多产品平台运转。


              客户数披露没那么整齐。一份 2025 年公司声明称有 3,300 个客户、65,000 个组织在平台上活跃；当前 Bitsight 评级指南则称客户超过 3,500 个，同时仍给出 65,000
              个组织的平台足迹。审慎读法是低 3,000 段客户、约 65,000 个被监测组织，准确的当前付费客户数仍留待确认。员工数同样偏软：GetLatka 估计 2026 年约 743
              名员工，而本证据集中唯一的官方劳动力信号是 Bitsight 采取远程优先。公开证明点仍显示部署面很广。Bitsight 2020 年称 38 个国家用其方案做国家网络安全，当前产品页称 120+
              政府机构依赖该平台，Belgium、EPAM、Coventry、Schneider Electric 和 DATAMARK 的客户案例则指向政府、软件、金融服务、制造和外包场景中的可衡量运营价值。
