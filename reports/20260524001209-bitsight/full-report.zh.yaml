      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              从外部能看到的有限维度看，Bitsight 像一家财务前景不错的私有网络数据公司：官方材料支撑超过 $200M ARR、扩张驱动增长、模块宽度广、客户规模稳步上台阶，并且 2025
              年声称自由现金流为正。平台共享数据集和工作流扩张，也为软件化收入质量和长期增量利润率改善拼出了一条自洽叙事。


              问题不是没有好信号，而是缺少可承销细节。公开记录仍没有经审计财务、收入确认细节、毛利率、经营利润率、NRR、现金、现金跑道、股权结构精度和债务披露。二级数据库在融资和员工数等基础事实上分歧，Qualys
              等公开市场可比公司只能提供利润率背景，不能提供公司特定证明。结论：Bitsight 的商业模式看起来可信且越来越耐久，但任何投资或信用决策仍取决于对利润率、留存、定价实现和流动性的私有尽调。
