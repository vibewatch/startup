            body: >-
              Bitsight 的依赖图谱异常商业化，而不是基础设施化。最显眼的节点是 Moody’s：2021 年交易带来 $250 million 资本、$2.4 billion
              估值标尺，并打开通往整合式风险工作流的分销路径。这是优势，也让公司依赖一个强势少数股东持续把网络安全数据转成金融工作流。政府和公共部门引用是第二个节点。Interos/DoD 公告、38 国里程碑和
              Belgium 案例研究都显示真实采用，但也意味着持续交付、合规和关系管理负担；公开披露没有清楚量化。第三个节点是工作流嵌入。Venminder 和 Slack 集成显示 Bitsight
              正从静态评分走向运营工作流，这应当提高粘性，但每个集成都增加 API、平台优先级和合作伙伴路线图风险。关键尽调问题是集中度：今天的公开记录证明 Bitsight
              已嵌入重要生态，但没有揭示每个生态控制了多少收入或续约韧性。
