  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义和模块地图
        blocks:
          - type: paragraph
            body: >
              Bitsight 现在更像网络风险情报平台，而不是单一评级供应商，并呈现出两个清晰运营平面。治理与风险平面包括 Security Ratings、Security Posture
              Management、Advanced Analytics，以及由 Vendor Risk Management、Continuous Monitoring、Vulnerability Detection &
              Response 和 Trust Management Hub 组成的第三方流程栈。安全运营平面包括 Cyber Threat Intelligence、Identity Intelligence、Attack
              Surface Intelligence、Vulnerability Intelligence、Pulse、Ransomware Intelligence、Brand Intelligence 和
              Adversary Intelligence。好消息是，这不是随机产品菜单：保留页面反复把这些模块接回共同的由外而内遥测、归因和威胁上下文。需要警惕的是包装清晰度。公开信息使用 security
              ratings、security posture management、advanced analytics、attack surface intelligence 和 exposure management
              等彼此重叠的术语，因此 SKU 边界没有“产品宽度”叙事本身那么清楚。
