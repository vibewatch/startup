    rows:
      - - 增长放缓
        - 退出年份 ARR 看起来更接近 $180M-$200M，而非 $220M-$240M
        - 下行情景开始主导，溢价软件倍数不再站得住
        - 不要高于过时的 2021 年锚点出价；重置为悲观情景估值
      - - 优先权冲击
        - 股权结构显示沉重的高级清算优先权或棘轮条款
        - 新资金回报测算变差，名义价格是否公允不再重要
        - 暂停，直到完整重建并重定价瀑布模型
      - - 自由现金流反转
        - 增长投入或营运资本正常化后，2025 年正 FCF 被证明不可重复
        - 基准与乐观情景失去效率前提
        - 下调估值区间，并将融资依赖视为即时问题
      - - 竞争压缩
        - 新评估中，同行在自助服务、工作流宽度或定价上明显胜出
        - 即使品类需求仍健康，Bitsight 的稀缺溢价也会被侵蚀
        - 要求更低进入倍数或更强留存证据
      - - 新的法律 / 声誉问题
        - 新的重大争议、方法论反弹或信任事件，会重新打开可防御性担忧
        - 风险权重从公允价值争论转向下行保护
        - 暂停流程，直到弄清对流失、定价和退出路径的影响
    notes: 这些是投资触发项，不是运营 KPI。每一项都用于迫使重切估值区间，而不是陷入叙事争论。
