        - 申诉积压，或评论平台出现评分准确性投诉
        - 未解决申诉明显增加，算法摩擦投诉反复出现，或有证据显示过期发现正在影响续约
        - 下调对核心护城河的信心；在承保上行空间前，要求客户层面的留存证据。
      - - 公共部门依赖
        - 联邦或国家网络安全工作流证据
        - 没有超出参考用例的扩张、失去可见政府背书，或尽调中拿不出授标细节
        - 把公共部门叙事视为营销而非护城河，并削减战略溢价。
      - - Moody's 分销论点
        - 资本市场或高管风险产品中的嵌入式工作流证据
        - 几乎没有产品或收入证据表明 Moody's 正在提升 Bitsight 分销或粘性
        - 降低投资论点中的合作价值，将 Moody's 主要改写为被动资本支持。
      - - 工作流扩张
