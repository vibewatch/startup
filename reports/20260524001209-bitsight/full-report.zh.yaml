        - 可作为盈利能力与规模的上界参考
        - 产品组合不同，也不是直接的评级 / TPRM 可比公司
      - - 直接评级 / TPRM 同行组
        - SecurityScorecard、UpGuard、Panorays 和 ProcessUnity 强调 AI 工作流、评级、问卷和入驻
        - 保留样本多为私有公司或估值未披露
        - 最适合用于约束倍数的直接替代组
        - 可比定价和私有估值标记在此不公开
      - - Recorded Future 邻近参考
        - 使用 1M+ 信源的威胁情报平台
        - 保留样本中为私有 / 未披露
        - Bitsight 现在销售 CTI 和更广泛网络风险工作流，因此该参考相关
        - 威胁情报定位比纯 TPRM 更宽
