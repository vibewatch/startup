        - id: friction
          label: 采购疑虑
          detail: 安全评级可能有用，但仍需要更深的直接评估。
      edges:
        - from: land
          to: stakeholders
          label: 工作流扩展
        - from: stakeholders
          to: crosssell
          label: 用例拓宽
        - from: crosssell
          to: government
          label: 新渠道
        - from: crosssell
          to: proofgap
          label: 经济性不透明
        - from: government
          to: proofgap
          label: 集中度问题
        - from: proofgap
          to: friction
          label: 尽调追问
    approximationNotes: 流程展示扩张路径与尽调风险之间的关系；并不意味着每个账户都有固定顺序。
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU029
      - CU032
      - CU041
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 热力图按可能性、影响、缓释成熟度和剩余严重度，梳理 Bitsight 的主要风险簇。评级可信度和伙伴集中度是最危险的剩余暴露，因为它们会快速传导到续约、定价和估值支撑。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 评级可信度 / 算法信任
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 隐私与 CTI 数据治理
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 专利与法律挑战复发
          values:
            - 中
            - 中高
            - 中低
            - 中
        - label: 公共部门合规依赖
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: Moody’s 与工作流伙伴依赖
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 领导层与继任不透明
          values:
            - 中
            - 中高
            - 中低
            - 中高
    approximationNotes: 可能性和影响是基于保留公开证据的定性综合判断，并非公司披露的评分模型。
    claimRefs:
      - CR017
      - CR025
      - CR030
      - CR039
      - CR051
      - CR054
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 传导图展示信任、工作流嵌入和市场预期如何层层传到收入质量与估值。中心节点是评级可信度，而不是某个技术控制项。
    data:
      nodes:
        - id: n1
          label: 算法变更 / 陈旧发现
          detail: RAU26 变更和评价平台投诉抬高了可解释性压力。
        - id: n2
          label: 评级可信度
          detail: 客户、保险方、董事会和投资者是否仍信任评分。
        - id: n3
          label: 工作流嵌入
          detail: 信任中心、准入和协作使用，把价值从单点评分拉宽。
        - id: n4
          label: 续约与定价权
          detail: 核心产品集的商业耐久性。
        - id: n5
          label: ARR / 自由现金流
          detail: 公开里程碑可见的增长和现金生成。
        - id: n6
          label: 估值支撑
          detail: 面对更宽的 TPRM 工作流时，能否守住溢价定位。
        - id: n7
          label: 市场预期
          detail: 预算在增加，但买方想要一体化数据质量和 ERM 连接。
        - id: n8
          label: 伙伴杠杆
          detail: Moody’s 和公共部门工作流同时放大上行空间与依赖。
      edges:
        - from: n1
          to: n2
          label: 变更过多侵蚀信任
        - from: n2
          to: n4
          label: 可信度塑造续约
        - from: n3
          to: n4
          label: 工作流黏性支撑定价
        - from: n4
          to: n5
          label: 商业耐久性驱动增长
        - from: n5
          to: n6
          label: 增长和现金流锚定价值
        - from: n7
          to: n6
          label: 市场设定证明门槛
        - from: n7
          to: n3
          label: 买方奖励一体化工作流
        - from: n8
          to: n3
          label: 伙伴帮助嵌入使用
        - from: n8
          to: n6
          label: 伙伴影响战略溢价
        - from: n2
          to: n6
          label: 信任流失压缩价值
    approximationNotes: 综合因果图，并非公司披露的运营模型。
    claimRefs:
      - CR026
      - CR034
      - CR048
      - CR051
      - CR053
      - CR055
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 依赖图梳理最影响 Bitsight 风险画像的合作方和工作流界面。关键节点是 Moody’s、公共部门背书，以及把 Bitsight 推向运营工作流的集成。
    data:
      nodes:
        - id: d1
          label: Bitsight 平台
          detail: 安全评级、信任工作流和暴露面数据。
        - id: d2
          label: Moody’s
          detail: 资本、分发，以及与高管风险工作流的邻近性。
        - id: d3
          label: Interos / DoD 用例
          detail: 联邦供应链工作流和 Section 889 关联性。
        - id: d4
          label: 国家级网络安全项目
          detail: 国家层面和公共部门监测背书。
        - id: d5
          label: 比利时 Centre for Cybersecurity
          detail: 可见的政府客户，且有扩张计划。
        - id: d6
          label: Venminder
          detail: 准入工作流集成。
        - id: d7
          label: Slack
          detail: 协作和评级变更工作流集成。
        - id: d8
          label: 客户 / 保险方 / 董事会
          detail: 将评级可信度变现或依赖评级可信度的利益相关方。
      edges:
        - from: d2
          to: d1
          label: 资本与分发
        - from: d3
          to: d1
          label: 联邦用例
        - from: d4
          to: d1
          label: 公共部门可信度
        - from: d5
          to: d4
          label: 背书部署
        - from: d6
          to: d1
          label: 供应商准入工作流
        - from: d7
          to: d1
          label: 协作工作流
        - from: d1
          to: d8
          label: 评级与信任输出
        - from: d2
          to: d8
          label: 金融风险包装
        - from: d4
          to: d8
          label: 政府验证信号
    approximationNotes: 保留来源没有显示单一主导基础设施供应商，因此图中突出商业和工作流依赖。
    claimRefs:
      - CR028
      - CR030
      - CR032
      - CR033
      - CR052
      - CR054
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从市场需求和商业证明出发，穿过融资不透明与竞争压力，落到“继续研究”，而不是直接买入或回避。
    data:
      nodes:
        - id: n1
          label: 类别需求
          detail: 第三方事件增加、网络安全预算上行，TPRM 需求在扩张
        - id: n2
          label: 商业证明
          detail: ARR 达到 >$200M，且有扩张驱动和六位数合同信号
        - id: n3
          label: 战略验证
          detail: Moody's 按 $2.4B 估值标记投入 $250M，并继续持有少数股权
        - id: n4
          label: 竞争压力
          detail: 试用驱动、重工作流的同行压住稀缺性价值
        - id: n5
          label: 资本结构不透明
          detail: 优先权、现金、NRR 和经审计利润率仍未公开
        - id: n6
          label: 区间而非点估值
          detail: 公开证据只能支撑合理区间，不能给出精确现价
        - id: n7
          label: 继续研究
          detail: 只有守住估值纪律，并拿到硬尽调问题答案，才继续推进
      edges:
        - from: n1
          to: n2
          label: 需求支撑增长
        - from: n2
          to: n3
          label: 证明支撑战略兴趣
        - from: n3
          to: n6
          label: 锚点存在
        - from: n4
          to: n6
          label: 溢价受限
        - from: n5
          to: n6
          label: 精确定价被卡住
        - from: n6
          to: n7
          label: 保持条件性
    approximationNotes: 该链条只是定性决策链。它总结公开证据应如何影响判断，并不声称存在确定性权重。
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV008
      - CV021
      - CV022
      - CV045
      - CV047
      - CV050
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 企业价值敏感性仅作示意，展示不同 ARR 与倍数组合；锚点是公开 ARR 信号，而不是管理层指引。
    data:
      items:
        - label: 悲观：6x × $190M
          value: 1.1
          note: 假设增长更慢、证明更弱，且不因不透明获得溢价
        - label: 悲观-基准：8x × $200M
          value: 1.6
          note: 假设 2025 ARR 里程碑真实，但质量仍被大幅折价
        - label: 基准低位：10x × $220M
          value: 2.2
          note: 需要 ARR 温和增长，并确认留存不错、FCF 站得住
        - label: 基准高位：12x × $230M
          value: 2.8
          note: 大致对应已过时公开估值标记附近的合理结果
        - label: 乐观：14x × $250M
          value: 3.5
          note: 需要持续扩张，并证明利润率能像软件公司一样放大
        - label: 完全乐观：16x × $260M
          value: 4.2
          note: 需要高端软件级质量，也需要上市可比公司的支撑比目前更清晰
    approximationNotes: 数值以 USD billions 计。倍数是分析师基于保留参考组作出的假设，不是实时市场报价。
    claimRefs:
      - CV005
      - CV013
      - CV029
      - CV043
      - CV044
      - CV049
      - CV050
      - CV056
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 列示熊市、基准、牛市情境下的低 / 基准 / 高估值区间，并把最后披露的 $2.4B 估值作为公开参考锚点。
    data:
      items:
        - label: 熊市情境 EV (2027-2028)
          low: 1100
          base: 1400
          high: 1700
          unit: USD M
          note: 增长放缓、溢价消退，透明度问题仍未解决
        - label: 基准情境 EV (2027-2028)
          low: 2200
          base: 2550
          high: 2900
          unit: USD M
          note: ARR 温和增长，效率尚可，把估值维持在过时的公开锚点附近
        - label: 牛市情境 EV (2027-2028)
          low: 3400
          base: 3800
          high: 4200
          unit: USD M
          note: 需要强留存、可持续 FCF，以及更干净的软件质量叙事
        - label: 最后披露的估值锚点 (2021)
          low: 2400
          base: 2400
          high: 2400
          unit: USD M
          note: Moody's 战略投资参考点
        - label: 相对 $2.4B 锚点的 2x 总回报门槛
          low: 4800
          base: 4800
          high: 4800
          unit: USD M
          note: 新资金在稀释前先看这道门槛，有助于守住投资纪律
    approximationNotes: 仅作示意。真实投资者回报很大程度取决于未披露的优先权结构，以及入场到退出之间的任何新融资。
    claimRefs:
      - CV002
      - CV005
      - CV043
      - CV044
      - CV045
      - CV055
      - CV056
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 在当前证据质量下，对 Bitsight 最关键的投资维度做出可供 IC 审阅的评分。
    data:
      items:
        - label: 市场需求
          score: 8
          note: 第三方网络事件和预算增长支撑品类需求。
        - label: 商业验证
          score: 7
          note: ARR 规模和扩张信号不错，但大多仍来自公司口径。
        - label: 护城河耐久度
          score: 7
          note: 客户覆盖和平台广度有帮助，但同业收敛是真问题。
        - label: 经济性证据
          score: 5
          note: FCF 为正令人鼓舞，但未经审计，规模也未披露。
        - label: 融资清晰度
          score: 3
          note: 当前股权结构、优先权条款和实时定价均未公开。
        - label: 估值支撑
          score: 6
          note: 2021 年这个过时锚点大致公允，但谈不上明显便宜。
        - label: 风险压力
          score: 4
          note: 隐性优先权和竞争挤压让下行风险真实存在。
        - label: 证据质量
          score: 5
          note: 足以设定投资纪律，不足以形成高确信度判断。
    approximationNotes: 分数是基于保留证据集的序数判断，应按投资审查分流来读，而不是拿它当经基准校验的市场指数。
    claimRefs:
      - CV005
      - CV006
      - CV021
      - CV022
      - CV029
      - CV045
      - CV046
      - CV047
      - CV050
      - CV051
