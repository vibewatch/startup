        - 外部视角看不全每个内部控制，仍可能报出误报
      - - 归属和实体映射层
        - 持续把 IP、域名、证书和其他工件映射到正确组织或供应商
        - 准确的所有权解析、云变化检测和历史映射质量
        - 归属错误会直接削弱评级可信度和下游工作流效用
      - - 评级和分析引擎
        - 将发现规范化为风险向量，对标同业，并输出修复和预测视图
        - 模型治理、经验权重和年度算法更新
        - 公开逻辑在政策层面可读，但客户仍需管理层拿出精度和回测证据
      - - 工作流应用层
        - 把数据骨干转成 VRM、监控、零日响应、信任中心和保证工作流
        - 好用的 UX、客户流程采纳和证据生命周期管理
        - 工作流主张很强，但实施投入和模块附加购买会随客户环境变化
      - - 威胁情报和暴露层
        - 用地下、身份、勒索、品牌和攻击者上下文富化资产与 CVE
        - 持续暗网采集、AI 分诊质量，以及与运营者工作流的集成
        - AI 比重高的模块公开覆盖面很广，但技术边界文档和发布历史较薄
      - - 集成层
        - 将数据和操作送入 API、GRC/VRM 工具、聊天系统、IdP 和漏洞管理系统
        - 开放 API、具名连接器和第三方系统可靠性
        - 高价值自动化依赖连接器，而不是显然原生端到端
    notes: 该架构图由公开产品和方法论页面综合而来，不是字面意义上的内部服务图。
