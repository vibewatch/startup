            body: >
              Bitsight 的开发者和集成故事是真实的，但更偏工作流，而不是重平台工程。Vendor Risk Management 明确表示 VRM 数据可通过 open API 同步；TPRM Integrations
              声称在数据馈送、VRM 和 GRC 工具上有 10 个集成；Vulnerability Intelligence 点名 Tenable、Qualys 和 Rapid7；Identity Intelligence
              称可通过 IdP 集成执行修复；Slack 连接器则显示评级变化流程进入协作渠道。这足以证明平台设计上会接入其他系统，而不是只作为孤立控制台运转。带日期的 2026 年路线图表面更窄。RAU26
              是最清晰的定时产品变化，带有预览和上线日期，以及具体方法论编辑。相比之下，许多 AI-heavy 模块——Pulse、Brand Intelligence、Adversary
              Intelligence，以及威胁情报套件的部分能力——看起来当前且商业上重要，但保留的公开来源集更擅长描述功能，而不是展示发布节奏、弃用政策或版本历史。
