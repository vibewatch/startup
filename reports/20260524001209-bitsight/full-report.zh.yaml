  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Bitsight 工作流
      - 可衡量收益 / 证据
      - 已知限制
    rows:
      - - 董事会和项目报告
        - 团队很难把技术发现转成站得住、可比较的网络绩效指标
        - 评级与 Advanced Analytics 用来做同业基准、跟踪控制项、预测场景并生成修复计划
        - 每日评级、同业分析、六个月控制历史和预测工具均有公开信息
        - 公开证据对分析能力界面支撑更强，对独立客户成效的证明较弱
      - - 供应商入驻和复评
        - 问卷和电子表格速度慢、主观性强，难以在大规模供应商体系里扩展
        - VRM 建库存、审证据、分析姿态，并持续监控变化
        - Bitsight 声称拥有 72K+ 供应商档案、90% 供应商接受率，评估时间减少 75%+
        - ROI 数据来自公司主张，需要独立验证
      - - 零日第三方响应
        - 关键 CVE 爆发后，团队需要快速找出暴露供应商，并规模化协调外联
        - Vulnerability Detection & Response 找出受影响供应商，支持批量问卷，并跟踪修复状态
        - 公开页面列出 9000+ 个扫描漏洞和 150+ 个 CISA KEV
        - 公开文档里，连接器和下游工单细节仍偏少
      - - 客户保证工作流
        - SIG、认证和反复安全问卷会把安全团队变成瓶颈
        - Trust Management Hub 集中文档、版本、共享和访问控制
        - Bitsight 宣传效率提升 85%、工作量减少 25%
        - 需要客户证据证明真实销售周期提升和附加购买率
      - - 暴露优先级排序和攻击面管理
        - 缺少业务上下文或可利用性排序时，资产和 CVE 会淹没团队
        - ASI 加 Vulnerability Intelligence 映射资产、关联威胁上下文，并用 DVE 和 MITRE 映射排序
        - 公开证据显示 250M+ 已映射资产，并与主流 VM 工具打通工作流
        - 原生修复边界与合作伙伴系统的分工，公开文档仍不够深入
      - - 威胁情报运营
        - 分析师需要上下文，而不只是原始 IOC 或标题
        - CTI、Pulse、Ransomware、Brand、Identity 和 Adversary 模块把地下信号整理成按角色定制的工作流
        - Bitsight 称每日整理 >7M 条项目，爬取 1000+ 个论坛，富化路径 <1 分钟
        - 公开文档更多谈覆盖规模，较少谈后续分析师工作流指标
    notes: 除非该行明确引用第三方评论或分析师材料，量化收益均来自供应商主张。
