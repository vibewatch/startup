  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁 / 竞争对手反应
      - 严重程度
      - 缓释措施 / 尽调问题
    rows:
      - - 已建立的外部评级品牌
        - Bitsight 称，其评级被安全负责人、保险公司、监管机构和董事会使用，Moody's 也投资押注这一业务资产
        - 直接同业已能讲类似的评分驱动叙事，并围绕评分打包报告或工作流
        - 高
        - 索取评级驱动交易的当前赢单 / 输单数据，并对比 SecurityScorecard、RiskRecon 和 UpGuard
      - - 大规模映射供应商和资产数据集
        - 72K 个供应商画像、65K 个活跃组织、监控 40M+ 家公司、归因 250M+ 项资产
        - 同业越来越强调 N 方发现、供应链可视性或更广的资产发现
        - 高
        - 不要只比原始对象数量，要比较误报率、归因精度和后续整改结果
      - - 评级之外的交叉销售宽度
        - 2024 年 70% 新签交易包含暴露面管理；Bitsight 现在营销 TPRM、信任、CTI、ASI 和 VI
        - Recorded Future、Qualys 和 UpGuard 等相邻套件不用购买专门评级厂商，也能覆盖发起采购的用例
        - 高
        - 按模块索取附加率耐久性，并确认多产品客户续约率是否显著更高
      - - 金融市场可信度与渠道杠杆
        - Moody's $250M 投资与资本市场背书
        - 合作可信度本身不能解决采购阻力或工作流竞争
        - 中
        - 量化 Moody's 在企业和保险渠道带来的销售线索、附加销售和产品影响
      - - 嵌入既有系统的工作流
        - Bitsight-Archer 集成把每日评分变动和证据直接带进供应商审查工作流
        - 工作流既有厂商可以掌握更多日常用户体验，并把数据层推向价格竞争
        - 中
        - 评估集成是在增加粘性，还是只是把数据流标准化、让替换更容易
      - - 评级透明度与用户信任
        - Bitsight 宣传评级公平准确、算法每年更新，但 G2 评论者把报告缺口和频繁算法变更列为痛点
        - 以试用切入的对手可以把 Bitsight 描绘成边际上更复杂、可预测性更低
        - 高
        - 索取与算法变更和报告限制有关的客户投诉、流失原因和支持负担
    notes: 这张清单混合产品主张、独立需求信号和已观察到的商业摩擦，用来拆分护城河中哪些部分看起来更结构性，哪些更容易被复制或绕开。
