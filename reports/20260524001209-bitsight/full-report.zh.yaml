      - number: '1.2'
        title: 管理层、创始人延续和治理
        blocks:
          - type: paragraph
            body: >-
              现代经营阶段显然与 Stephen Harvey 绑定。他曾任 Institutional Shareholder Services 的 COO，2020 年 1 月出任 CEO。这次交接重要，因为它标志着
              Tom Turner 之后的换挡：Turner 是更早期的规模化 CEO，带公司完成品类形成、2018 年总部迁移和 Series D 融资。Harvey 在数据、分析和运营规模化上的背景，与 Bitsight
              随后推进相邻市场、更大企业合同以及 Moody's 交易相吻合。


              同一时期，治理结构也变宽。Bob Brennan 于 2020 年 6 月出任董事会主席，带来 Veracode、CA Technologies 和 Iron Mountain 经验；Shelley B.
              Leibowitz 于 2021 年 4 月加入董事会，具备企业风险和金融服务资历。创始人延续最明显体现在联合创始人兼 CTO Stephen Boyer 身上：公开材料仍把他同公司的评级方法和 Policy
              Review Board 联系在一起。该委员会重要，因为 Bitsight 明确用它治理算法变更和申诉。未解决的保留项是，可访问的官方页面没有发布最新完整董事名单；因此，当前委员会构成、董事独立性，以及
              Moody's 交易后的任何董事会变动仍需要直接尽调确认。
