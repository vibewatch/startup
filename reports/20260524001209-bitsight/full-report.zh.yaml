        - 按单纯评分业务建模，并压缩终值倍数假设。
      - - 市场契合度 vs. 买方预期
        - 来自客户的数据质量与 ERM 集成证据
        - 预算增长下，客户仍持续反馈集成拼凑、AI 实用性偏弱
        - 视为市场增长无法转化给 Bitsight，并优先尽调产品嵌入度。
