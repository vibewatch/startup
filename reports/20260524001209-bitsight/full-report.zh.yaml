  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户、付费方、地域和垂直行业拆分客户
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的公开客户表面指向企业优先的客户基础，围绕安全、风险和合规流程组织，而不是广泛自助采用。可见买方通常是
              CISO、安全负责人或第三方风险负责人；一旦评级成为共享决策工具，用户会扩展到采购团队、董事会、监管机构、保险公司和供应商经理。付费方也偏企业中心：公开案例持续暗示，预算坐在中央安全、GRC
              或国家网络项目里，而不是单个业务线工具预算里。


              垂直行业组合很宽，但集中在受监管或风险敏感环境。公开案例覆盖工业软件和制造（AVEVA、Cornerstone、Schneider
              Electric）、咨询和商业服务（BearingPoint、DATAMARK、EPAM）、零售和酒店（Cabela’s、Revel）、教育（Fordham）、政府和国家安全使用场景（Centre for
              Cybersecurity Belgium），以及 SaaS 信任流程（Jedox）。官网还补充了 38% Fortune 500 渗透、前 5 大投资银行中 4 家，以及 180+
              政府机构。地域同样偏向大客户市场：具名参考横跨 North America 和 Europe，而 Bitsight 称 2024 年 30% 的新客户总部位于 North America
              之外。共同线索是，买方需要一个外部可见信号，能在内部和外部利益相关方之间流转。
