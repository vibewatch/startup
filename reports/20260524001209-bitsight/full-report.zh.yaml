      - 反论点
      - 改变判断的条件
    rows:
      - - 收入质量
        - 六位数合同、由扩张带来的新增收入和多产品挂载，指向粘性企业级经济性
        - 公开证据还未覆盖 NRR、队列耐久性和经审计利润率披露
        - 证明 NRR 高于 110%、流失率低，且经审计毛利率持续改善
      - - 战略相关性
        - Moody's 持股叠加金融敞口分析，让 Bitsight 对大型风险数据买家具备战略相关性
        - 若优先权或定价预期对投资人不友好，战略相关性也不能保证回报干净
        - 提供治理权、转让限制和所有商业附函
      - - 市场需求
        - 事件高发和网络安全预算持续增长支撑 TPRM 需求
        - 差异化被压缩后，高增长品类仍会下调估值
        - 证明 Bitsight 在溢价定价下，仍能赢过试用驱动和工作流更重的同行
      - - 平台宽度
        - Bitsight 现在覆盖治理 / 风险和安全运营工作流，不再只是一个评级 SKU
        - SecurityScorecard、UpGuard、Panorays、ProcessUnity 和 Recorded Future 等更宽同行集合削弱稀缺价值
        - 证明产品宽度带来可量化扩张，而不只是目录变厚
      - - 估值锚点
        - 若名义估值未变，过时的 $2.4B 标记会从 2021 年 ARR 的 ~24x 压缩到 2025 年 ARR 的 ~12x
        - 若自由现金流不耐久，或股权结构优先权很重，这条桥仍可能误导
        - 在高于旧锚点出价前，先核对 ARR、现金生成和完全稀释瀑布模型
    notes: 论点与反论点都有证据支撑，并刻意以价格和尽调质量为前提。
