  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Bitsight 看起来是强公司，但还不是干净的投资结论。公开质量证据真实：公司披露 ARR 从 2021 年超过 $100 million 增至 2025 年超过 $200
              million，声称自由现金流为正，并把近一半 ARR 归因于六位数合同，以及来自存量客户的扩张驱动增长。Moody's 还在 2021 年以 $2.4 billion 估值投资 $250
              million，为业务打下硬战略标尺。上述事实让陈旧的披露估值看起来方向上合理，而不是明显过高。


              问题在于，估值现在比经营故事更不透明。公开来源仍未披露当前股权类别条款、清算优先权、NRR、经审计利润率、现金、债务或当前融资要价。这意味着同一个 $2.4 billion
              标题估值，对一个投资人可能合理，对另一个投资人可能没有吸引力，取决于隐藏的清算瀑布，以及 2025 年自由现金流是否可持续。建议：继续研究。如果入场价格不高于上一轮披露的 $2.4 billion
              锚点，且尽调确认优先权干净、扩张经济性持久，立场可以转向观察或买入。如果管理层在没有这些证据的情况下寻求显著溢价，经风险调整后的答案就是否。
