chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与平台逻辑
        blocks:
          - type: paragraph
            body: >-
              Bitsight 是一家位于 Boston 的网络风险情报公司，成立于 2011 年，公开记录中与 Bitsight Technologies, Inc. 相关联。当前公开地址为 Boston 的 111
              Huntington Ave, Floor 4；这处总部足迹反映了公司 2018 年从 Cambridge 迁入更大 Back Bay 办公室的动作。公司的核心身份仍锚定在 Security
              Ratings：一个由外而内的评分系统，分值区间为 250 到 900。Bitsight 称该系统每日刷新，依据外部可观察证据构建，而不是问卷或自报。


              这套评级引擎现在供给的是一个宽得多的平台。产品页面把业务拆成两类：治理与风险流程，包括供应商风险管理、信任管理中心、高级分析和国家网络安全；安全运营流程，包括攻击面情报、网络威胁情报和身份情报。UpGuard
              的独立简介也把同一组合描述为统一的网络风险情报平台，横跨 TPRM、暴露面管理和威胁情报。扩张逻辑在战略上自洽：KPMG 的 2026 年调研称，合规和网络风险是 TPRM 的首要驱动因素；Marsh
              则报告，70% 的组织在过去一年至少遭遇一次实质性第三方网络事件。这也解释了为什么 Bitsight 持续从评级延伸到更宽的暴露面和供应链流程。
