      - number: '1.5'
        title: 里程碑、合作关系和开放风险
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的时间线显示，公司一直围绕评级核心拓宽使用场景。基础里程碑包括：2011 年成立；2018 年总部迁移和 Series D；2020 年 CEO 与董事会主席任命；2020 年推出 Policy
              Review Board；2021 年 8 月 ARR 超过 $100 million；2021 年 9 月 Moody's / VisibleRisk 交易；以及 2025 年 4 月 ARR 超过 $200
              million 且自由现金流为正。合作关系也重要，因为它们揭示 Bitsight 如何进入更大的流程：与 Interos 的合作显示联邦供应链使用场景，Belgium
              案例和当前国家网络安全页面则说明，政府采用仍是故事中的真实部分，而不是一次性的营销样例。


              本章浮现的主要反向事项是与 NormShield / Black Kite 的专利纠纷。PatSnap 报告称，BitSight 于 2023 年 9 月提起该案，并在 2025 年 2
              月以约定撤诉告终，双方各自承担费用。这个结果移除了活跃联邦 IP
              诉讼的悬念，但公开摘要没有披露和解条款或任何持续许可承诺。叠加仍不完整的当前董事会名单，以及互相矛盾的公开融资和客户总数，诉讼记录强化了同一条尽调结论：Bitsight
              的经营动能比其完整治理和所有权图景更容易验证。
