      - number: '4.3'
        title: 成本结构和利润率驱动
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的成本结构应理解为收入线上像软件，但底层很重数据。官方材料描述了对 40M+ 公司的持续监控、250M+ 数字资产归因，以及每日整理超过 7M 条威胁情报项。这个组合意味着遥测采集、AI
              归因、研究人员、存储、计算和产品工程上的固定支出很大。这些成本可能分布在服务成本、R&D 和面向客户的运营中，而不是一个轻量 SaaS 外壳里。它们也解释了为什么 Bitsight
              持续扩展工作流产品：让一个数据集复用于多个模块，是获得利润率杠杆的最清晰路径。


              因此，最好的公开盈利能力锚点不是 Bitsight 自身数字，而是可比基准。Qualys 报告 Q1 FY26 调整后 EBITDA 利润率为
              47%，展示了成熟网络软件平台在规模化后可能长什么样。Bitsight
              可能接近这个水平，也可能并非如此；公开记录无法判断。竞争也会影响利润率路径。SecurityScorecard、RiskRecon、Panorays 和 ProcessUnity 都在营销持续监控、AI
              自动化和供应商流程，这意味着 Bitsight 必须持续投入数据质量、集成和产品宽度，才能守住定价权。利润率故事可信，但仍未披露。
