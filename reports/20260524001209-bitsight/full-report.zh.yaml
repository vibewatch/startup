      - number: '8.2'
        title: 估值背景与情景区间
        blocks:
          - type: paragraph
            body: >-
              估值最好的公开锚点仍是 2021 年 Moody's 交易。按同年 ARR 超过 $100 million 的里程碑计算，该估值约等于 24x ARR。相比之下，如果 Bitsight 在 2025 年跨过
              ARR 超过 $200 million 后标题估值没有变化，隐含倍数会压缩到约 12x。倍数桥接解释了为什么旧估值看起来合理而非明显昂贵：Bitsight 显然已经长进了其中一大块。


              但合理的历史锚点不等于可承销的 2026
              年入场价。乐观路径需要管理层证明，六位数合同组合、扩张驱动的新收入和自由现金流为正的里程碑，代表的是持久经济性，而不只是好年份。基准情景因此把估值维持在接近陈旧估值的位置，并假设两到三年维度只有温和上行。悲观情景同时反映增长压缩，以及隐藏优先权或新一轮法律
              / 竞争压力可能把退出价值拉到明显低于 2021 年标题锚点的可能性。因此，情景测算应读成估值纪律，而非精确预测：Bitsight 好到值得给出区间，但透明度还不足以给出很窄的区间。
            claimRefs:
