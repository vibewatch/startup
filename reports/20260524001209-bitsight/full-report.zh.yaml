  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、工作流存量厂商和相邻替代品
        blocks:
          - type: paragraph
            body: >-
              Bitsight 已经不再只竞争于一个整齐的单产品品类。保留来源显示出三组重叠竞争者。第一组是直接网络评级和 TPRM 同业，例如
              SecurityScorecard、RiskRecon、UpGuard、Panorays 和 Black Kite。它们都承诺某种组合：持续外部监控、供应商风险评分和 AI 辅助评估流程。第二组是
              ProcessUnity 和 Archer 等工作流存量厂商，再加上低端人工问卷项目；当客户主要需要供应商准入、证据收集和周期性治理，而不是权威外部评级时，这些方案可以替代部分买方任务。第三组是 Recorded
              Future 和 Qualys 等相邻网络风险套件，它们从威胁情报和暴露面管理角度切入相邻预算。


              这点重要，因为 Bitsight
              自身已经从评级产品扩展为更宽的网络风险情报平台。它自己的页面如今推介第三方风险管理、持续监控、信任管理、网络威胁情报、攻击面情报和漏洞情报。独立候选清单来源也强化了这一点：市场看待 BitSight
              替代品，不只是“其他评级供应商”，而是一个混合场域，里面有评级优先同业、工作流很重的 TPRM
              平台和更宽的网络风险工具。实践中，买方看到的候选清单取决于采购从哪里启动：供应商风险运营、董事会报告、网络保险、暴露面管理，还是威胁情报。因此，Bitsight
              既与直接同类对手竞争，也与只解决同一风险管理流程中某一片段的部分替代品竞争。
