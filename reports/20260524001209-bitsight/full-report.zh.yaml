      - number: '8.4'
        title: 尽调要求与投资逻辑击穿项
        blocks:
          - type: paragraph
            body: >-
              本章缺失的证据不是表面问题。它们正是决定一个看似合理的标题估值能否转化成良好投资回报的信息。第一道阻碍是资本结构：没有完全摊薄股权结构表和清算瀑布，就无法知道高级持有人已经拥有多少下行保护。第二道阻碍是运营质量：投资人仍需要经审计收入、留存、利润率和现金流桥接，才能判断
              Bitsight 值不值得给高级软件倍数，还是只配一个合理的战略估值。第三道阻碍是当前流程背景：如果新一轮融资在高于陈旧 $2.4 billion 锚点的水平营销，举证责任就会急剧上升。


              因此，投资逻辑击穿触发器很具体。如果公司在证明自由现金流持久之前增速放缓到十几个百分点中段，如果市场开始把评级和工作流工具视为越来越可替代，或者如果新的法律 /
              声誉事件重新引发关于防御性的疑问，下行区间就会比上行故事更重要。反过来，如果管理层能把 ARR、现金生成和股权结构表对齐，并为新资金保留上行，投资逻辑会快速增强。在此之前，优势来自尽调，而不是叙事。
