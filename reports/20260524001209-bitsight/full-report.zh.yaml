  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和定价表面
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的收入模式现在更像一个打包的网络风险情报平台，而不是单一安全评级
              SKU。官方产品页显示，可变现模块横跨安全评级和安全绩效管理、供应商风险管理、信任管理、攻击面情报、网络威胁情报和网络风险量化。这个宽度在财务上重要，因为 2025 年 ARR
              公告把增长绑定到多产品采用、暴露面管理附着和存量客户扩张，而不只是一次性的品类创建。因此，收入质量读数偏正面：客户一旦落到核心数据集上，Bitsight 就能向复用同一遥测骨干的相邻流程增购。


              仍然不透明的是商业结构。已审阅的官方页面持续把潜在客户导向 demo
              和销售接洽，而不是发布公开价目表、标准合同条款或模块级费率卡。这很可能意味着实际价格取决于企业范围、被监测实体数量、附加模块和谈判服务。没有公开定价并不否定模式，但它阻止外部清晰判断
              ARPU、折扣纪律、合同期限或收入确认机制。
