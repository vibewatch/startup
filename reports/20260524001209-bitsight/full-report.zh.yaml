  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 对建议的影响
    rows:
      - - 审计财务与 ARR 桥
        - 经审计 2024-2025 年报表，加 ARR / 收入勾稽
        - 决定公司是否配得上溢价软件倍数
        - CFO / 财务团队提供数据室材料包
        - 最大的单一上调触发项
      - - 留存与队列
        - NRR、GRR、logo 留存和队列扩张桥
        - 区分耐久扩张经济性与单一年份销售表现好
        - 收入运营与 FP&A 复核
        - 若留存顶尖，则上调信心
      - - 股权结构与优先权堆栈
        - 股份类别、优先权、棘轮条款、期权池和董事会权利
        - 控制基准和悲观退出下的真实投资人回报
        - 财务团队与法律顾问提供瀑布模型
        - 可让「公允」瞬间变成「无吸引力」
      - - 现金、债务与跑道
        - 当前现金、债务期限表、契约和融资计划
        - 厘清正 FCF 代表自我供血，还是只是临时缓解
        - 资金管理与财务尽调
        - 决定下一轮融资紧迫性
      - - 客户质量与集中度
        - 头部客户组合、垂直行业集中度、续约历史，以及保险公司 / 政府扩张细节
        - 检验标杆客户故事是否足够广、可复制
        - 销售与客户成功尽调
        - 同时影响退出就绪度和下行风险
      - - 当前市场检查
        - 管理层是否真的在融资、价格多少、条款如何
        - 没有实时进入价格参考，建议无法真正做到价格敏感
        - CEO / CFO 融资流程讨论
        - 直接决定推进 / 放弃
    notes: 这些要求按决策影响排序，而非按便利程度排序。缺少前三项，本章应保持「继续研究」。
