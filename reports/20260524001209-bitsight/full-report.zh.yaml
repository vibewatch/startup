            body: >-
              目前最好的规模披露来自 Bitsight 2025 年 4 月的 ARR 公告：平台有 3,300 家客户、65,000
              个活跃组织。该体量足以支撑真实存量客户，而不是仍在成形的品类叙事。同一公告也给出最干净的采用动能信号：2024 年新客户中 30% 来自北美以外，近一半 ARR 来自六位数合同，新增收入一半来自扩张，2024
              年新签交易中 70% 包含暴露面管理产品，早期 CTI 采用者中 40% 是现有客户。合起来看，上述信号指向存量客户内的采用深度，而不是简单收集 logo。


              公开记录没有把这些宏观披露映射成透明的客户阶梯。评价和背书层很快收窄：FeaturedCustomers 列出 43 条证言、39 个案例研究和 12 个视频，G2 有 44
              条评论。这能证明客户群不只是纸面数字，但占已披露客户基数的比例仍很小。用 39 个公开案例研究对比 3,300 家客户，意味着有姓名的公开证据只覆盖约 1.2%
