        - 需要干净优先权、强留存，且没有新的法律或声誉冲击
      - - 基准
        - ARR 约达 $220M-$240M，增速放缓至十几个点高段；经济性不错，但还不到 IPO 溢价所需的干净程度
        - 10x-12x ARR 支撑约 $2.2B-$2.9B EV；相对过时公开锚点，意味着持平到小幅上行
        - 当前证据最能支撑
        - 若优先权很重，或 2025 年自由现金流无法重复，上行空间消失
      - - 悲观
        - 增长放缓至 15% 左右或更低，溢价定价被压缩，公司仍缺乏干净融资透明度
        - 6x-8x ARR 支撑约 $1.1B-$1.7B EV，显著低于 2021 年披露标记
