        - 卡住 ARPU 和收入确认分析
        - 商业页面以预约演示为入口，条款由企业客户谈判
        - 要求提供价格手册、标准 MSA、折扣政策，以及按客群划分的 ACV 分布
    notes: 尽管商业牵引信号偏积极，这些证据缺口仍让本章结论保持谨慎。
