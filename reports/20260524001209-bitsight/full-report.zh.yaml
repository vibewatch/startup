      - number: '4.2'
        title: GTM 动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据显示，Bitsight 采用典型企业级先落地、再扩张动作，并由客户保障流程支撑。Bitsight 称，近半 ARR 来自六位数合同，一半新增收入来自客户扩张，2024 年 70%
              的新交易包含暴露面管理产品。这些是强销售效率代理指标，因为它们意味着更高 ACV 集中度、初始落地后的模块扩张，以及来自装机基础的一定商业杠杆。Trust Management Hub
              强化了这个解读：Bitsight 明确把它营销为一种方式，帮助安全团队更快回答销售审查、完成交易，同时不堵塞收入周期。


              也有方向性的地域和行业信号。Bitsight 称，2024 年新客户中 30% 位于 North America 之外；2022 年 ARR 里程碑则强调公共部门同比增长
              42%，以及网络保险公司的广泛采用。供应商风险页面上的官方 ROI 主张——六个月 3x ROI、90% 供应商接受率和 75%+ 时间缩短——是公司营销，而非经审计单位经济，但仍能说明 Bitsight
              认为哪些话术能打动买方。投资人通常想要的硬指标——CAC、回本周期、配额产能、胜率、实际合同期限和 NRR——仍是私有信息。
