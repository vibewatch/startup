            - label: 中
              tone: neutral
              detail: 输出要真正有价值，仍要下游项目采用并配套治理。
            - label: 低
              tone: positive
              detail: 该产品层最成熟，公开波动也最低。
        - label: 供应商风险工作流套件
          values:
            - label: 高
              tone: positive
              detail: 构建、审核、分析、监测的包装很明确，也围绕工作流展开。
            - label: 高
              tone: positive
              detail: VRM、Continuous Monitoring 和 VDR 拼出一条连贯生命周期。
            - label: 中
              tone: positive
              detail: 差异化来自数据质量叠加工作流规模，而不是单靠工作流。
            - label: 高
              tone: warning
              detail: 开放 API、集成和外部工具，是跑出完整运营价值的核心。
            - label: 中
              tone: neutral
              detail: 套件已经成型，但仍随 AI 和零日重点继续演进。
        - label: 暴露面与漏洞情报
          values:
            - label: 高
              tone: positive
              detail: ASI 和 Vulnerability Intelligence 包装清楚，数字也很充分。
            - label: 中
              tone: neutral
              detail: 优先级排序界面可信，但补救边界在公开材料里没那么清楚。
            - label: 高
              tone: positive
              detail: 资产归因叠加 DVE 和 MITRE 映射，是有差异的数据主张。
            - label: 中
              tone: neutral
              detail: 高价值自动化往往要接到外部漏洞管理系统里。
            - label: 中
              tone: warning
              detail: 对外叙事和更宽泛的暴露面管理话术重叠。
        - label: 威胁情报套件
          values:
            - label: 中
              tone: positive
              detail: 产品页面很多，功能也密，但时间顺序不够明确。
            - label: 中
              tone: neutral
              detail: 运营人员工作流说得通，但独立验证少于评级核心。
            - label: 高
              tone: positive
              detail: 地下渠道采集规模和实体图谱主张，是强差异点。
            - label: 中
              tone: neutral
              detail: 身份、品牌和补救用例会接到其他系统和团队。
            - label: 高
              tone: warning
              detail: 在产品界面中，威胁情报套件最重 AI，版本也最不清楚。
        - label: 信任与治理层
          values:
            - label: 高
              tone: positive
              detail: 信任中心、隐私、争议权利和 PRB 材料都已公开。
            - label: 中
              tone: positive
              detail: 治理流程有文档，但上线后的运营节奏不太可见。
            - label: 中
              tone: neutral
              detail: 差异化来自透明度和流程，而不是某个独特技术组件。
            - label: 低
              tone: positive
              detail: 信任与治理层相对自成一体，对伙伴执行依赖较低。
            - label: 低
              tone: positive
              detail: 治理变更看起来更克制，不像快速迭代。
