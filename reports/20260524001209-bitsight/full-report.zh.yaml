        - 可能让外部报告显得商品化，而不是具备可防守的独特性
      - - Panorays
        - 强情境化 TPRM 同业
        - 99.8% 风险评级准确率宣称；入驻和回复率改善宣称
        - 正在现代化人工 TPRM 项目的企业
