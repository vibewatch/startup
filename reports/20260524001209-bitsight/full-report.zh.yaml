      - number: '7.2'
        title: 运营、安全与产品可信度风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Bitsight 出售的是客户对外部可观测网络安全信号的信心。因此核心产品风险不只是泄露或宕机；如果客户认为评分变得嘈杂、滞后或对战略无用，信任会被侵蚀。运营问题的规模很大：Bitsight
              称每天摄入超过 4000 亿个事件，监控超过 4000 万个组织，并映射 100 万个实体。规模是护城河的一部分，也放大了归因、时效和误报风险。RAU26 凸显了这种张力。Bitsight 将在 2026 年 7
              月重新加权邮件控制，并用关键漏洞管理取代补丁节奏，这可能提高保真度，但任何可见的分数变动也会制造客户摩擦。G2 评论已经点名算法变更、重新扫描慢、告警陈旧和评分解释性弱。UpGuard
              报告又给出一个不舒服但健康的提醒：BitSight 自身也会被他人持续监控。缓释手段存在——申诉、方法论发布、与 CISA
              挂钩的漏洞披露、专门响应产品——但残余暴露仍高，因为一家评级公司一旦可信度滑坡，经济杠杆流失会快过任何单一孤立软件 bug。
