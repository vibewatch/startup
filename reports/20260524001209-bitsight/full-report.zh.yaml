      - number: '2.4'
        title: 尽调缺口和估值相关性
        blocks:
          - type: paragraph
            body: >-
              这个品类值得投资，但市场工作必须保持克制。第一，TAM 对定义敏感：公开市场报告分歧很大，KPMG 的支出组合也暗示，标题口径下的 TPRM 支出只有一部分直接关联 Bitsight
              这类网络数据平台。第二，市场明确想要自动化和持续监控，但公开来源包里最强的 ROI 数字仍来自供应商自报。第三，公开证据无法拆出 Bitsight 有多少收入来自评级、工作流、公共部门或相邻威胁情报产品，因此
              SOM
              精度仍缺失。估值上的正确结论不是市场太小；而是市场足够大、增长足够快、痛点足够强，已经重要。但份额假设必须被证据约束：流程适配度、预算归属，以及客观网络数据在真实采购周期中战胜问卷导向和工作流导向存量厂商的证明。
