      - number: '2.2'
        title: 买方、用户、付费方和采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场里的用户、买方和付费方有关联，但并不相同。日常用户坐在 TPRM 运营、采购、GRC、安全团队里；有时也在公共部门网络机构或类似国家 CERT
              的职能中。买方通常出现在合规和网络风险责任交叉处，因为主要触发点是监管暴露、供应商事件、董事会报告，以及用过多人工审查处理过多供应商的成本。这意味着采购或风险团队可能先启动流程，但项目成熟后，预算权往往集中到安全、合规或企业风险部门。竞争定位也取决于采用路径。团队需要提高入驻吞吐和证据收集时，工作流导向平台先赢；客观外部信号、第四方可视性和向领导层汇报变得更重要时，数据原生平台先赢。实践中，采用通常从评估和盘点开始；供应商基数或监管负担上升后，再扩展到持续监控、第四方发现、漏洞响应和董事会级报告。
