      - number: '6.3'
        title: 在风险敏感账户的生产部署里，实名客户证据最强
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的实名客户证据，在任务关键、外部会审视、且容易用商业语言讲清的工作流里最强。AVEVA 描述了关键基础设施安全中的生产使用，包括 4 到 5
              个月内从基础态势升至高级态势，以及获得保险人或监管支持。Cabela’s 称供应商评估从数周压缩到数小时。Centre for Cybersecurity Belgium 描述其监控 144
              个组织、让一家医院提升 150 多分，并帮助一家提供商关闭 74% 暴露的 RDP 泄漏。DATAMARK、Fordham 和 Revel 都把产品与保险结果挂钩；Schneider Electric 将
              Bitsight 纳入约 52,000 家供应商的风险管理。这些案例不是门面 logo，更像绑定真实工作流的生产部署。


              即便如此，证据集仍有重要边界。公开故事是经过筛选的样本，不是完整客户名册。它们很少披露合同金额、席位数、续约历史，或部署是否先小范围落地后再扩张。EPAM 报告不到一年提升 200
              多分，因此能证明生产价值，但本轮未能找到 Bitsight 自撰案例之外的公开佐证。Coventry
              的证据比案例研究更短。整体看，实名引用足以说明产品在生产环境中真实使用，但不足以把留存或经济性外推到整个客户基数。
