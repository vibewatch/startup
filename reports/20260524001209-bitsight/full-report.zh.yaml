  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              Bitsight 应该放在以网络安全为核心的第三方风险管理中测算，而不是放进所有采购、治理或通用 GRC
              软件里。相关支出是这样一组产品和流程：识别、评估、评分、监控并修复数字供应链里的供应商网络风险。公司自身产品面也支持这个更窄边界：供应商风险管理、持续监控、安全评级、漏洞响应、信任管理，以及把网络证据接入客户和
              GRC 流程的集成。这个定义重要，因为公开 TAM 估计对方法极为敏感。The Business Research Company 将整体市场规模测算为 2025 年 USD 6.82 billion、2026
              年 USD 8.09 billion、到 2030 年 USD 15.45 billion；Next Move Strategy 则给出更高的近期基线和 2030 年预测。因此，尽调应采用分层视角：公开 TPRM
              总市场作为上限，网络工具支出作为实际 SAM，Bitsight 外部可观察的数据与流程切口作为近期 SOM 框架。
