  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的法律和监管风险，与其说是传统产品责任，不如说是一个将外部网络安全判断变现的公司，在市场扩大后能否守住隐私、公平和披露规范的可信度。隐私政策明确写明，Bitsight 的 CTI
              工作流可能处理明网、暗网和深网数据，包括已泄露和敏感个人信息；公司也可能与客户和合作伙伴共同担任控制者。这带来围绕数据传输、保留和法律依据的多司法辖区暴露，部分由公司已发布的 DPF、APEC
              认证和信任中心控制缓释。第二组风险是评级治理：Bitsight 已经正式设立 Policy Review Board、争议权利和公开的解决预期，但上述承诺也抬高了模型变更出错的成本。NormShield
              专利争议没有演变成生死问题，却提醒投资人：评级和暴露面管理工作流处在真实的 IP 战场里。剩下的拦路项是透明度：没有完整 PACER 材料和直接联邦合同细节，残余法律和公共部门合规暴露无法完全排除。
