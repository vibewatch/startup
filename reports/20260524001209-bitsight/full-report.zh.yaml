      - number: '2.3'
        title: 增长驱动和约束
        blocks:
          - type: paragraph
            body: >-
              真实事件经验、扩张的第三方生态和监管升级，正在把需求前置。第三方引发的事件已经不是边缘案例：C-Risk 引用 RiskRecon 数据称，2024 年 24% 的组织遭遇第三方导致的事件；Marsh 称，70%
              的受访者在过去一年至少经历一次实质性第三方网络事件。预算动能随痛点而来，Marsh 报告 66% 计划在 2026 年增加网络安全支出，KPMG 发现 83%
              预期合作伙伴网络将继续扩张。监管压力进一步叠加；Gartner 将全球监管波动描述为网络韧性支出的驱动因素，KPMG 则发现合规是 TPRM 战略的最大单一驱动。逆风同样重要。KPMG 显示，只有 17%
              报告数据质量达到顶级，TPRM 与 ERM 之间的集成仍不完整，多数公司仍在碎片化系统上运行 TPRM。即便托管服务很常见，也很少有组织外包完整生命周期，因为它们担心控制权、数据共享和运营适配。
