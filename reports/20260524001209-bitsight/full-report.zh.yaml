      - number: '4.5'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              完整融资时间线归公司概况章；这里真正的财务问题是，公开记录是否足以承销当前流动性。已被扎实交叉印证的事实是：Bitsight 2018 年融资 $60M，Moody's 2021 年以 $2.4B 估值投资
              $250M，Moody's 成为最大少数股东。仅这两起事件就给出至少 $310M 的官方披露资本下限，而 Tracxn 将累计融资放在 $398M。Bitsight 还在 2025 年 ARR
              公告中声称自由现金流为正；与纯烧钱故事相比，这在方向上降低了即时融资压力概率。


              但资本充足性从公开证据看仍大多不可观察。没有已审阅来源披露当前现金、月度烧钱、现金跑道、债务额度、契约包，或租赁和营运资本义务。抓取到的 Moody's IR 和 SEC 页面增加的是备案基础设施背景，而不是
              Bitsight
              自身更新后的经营数据。因此，正确读法应保持谨慎：战略支持和据称自由现金流为正的里程碑是正面因素，但不能替代现金桥或债务时间表。贷款方或成长股权投资人仍需要管理层材料，才能承销流动性或下一轮融资时点。
