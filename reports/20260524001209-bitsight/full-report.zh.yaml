      - number: '6.5'
        title: 扩张可见，但集中度、采购和证据质量风险仍未关闭
        blocks:
          - type: paragraph
            body: >-
              最大的未解客户风险是集中度不透明。Bitsight 披露了高价值企业组合、政府触达和交叉销售动能，但没有披露头部客户占比、头部垂直行业占比、公共部门占比，或直销与合作伙伴渠道的组合。Interos
              的联邦供应链公告很重要，因为它至少显示一条由合作伙伴中介的政府路线。合作伙伴中介本身不是负面，但意味着部分公共部门增长可能带有渠道依赖，对利润率或续约动作的直接控制更弱。同样，38% Fortune 500
              这个数字很亮眼，但无法说明是否由少数超大客户主导 ARR。


              证据质量是另一个关键谨慎点。Phil Venables
              的批评提供了正确的反向框架：安全评级可能有用，尤其可作为负面信号，但准确性不足以替代更深的供应商评估或直接证据。采购环节尤其关键。客户可能喜欢快速给供应商做基准，但如果底层方法论有争议，或集成和报告深度偏弱，仍会拒绝过度依赖评分。当前
              G2 评论集也暗示了这种张力：用户称赞可见性和自动化，同时仍要求更强集成和可定制报告。净结论：Bitsight 的客户基数看起来广且有战略价值，但没有管理层披露，公开记录仍不足以排除集中度或持久性风险。
