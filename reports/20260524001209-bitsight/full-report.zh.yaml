      - number: '3.2'
        title: 能力宽度、包装缺口和买方摩擦
        blocks:
          - type: paragraph
            body: >-
              纸面上，Bitsight 比纯评级供应商更宽。保留的 Bitsight
              页面显示出分层栈：评级、供应商网络流程、持续监控、面向客户的信任管理、威胁情报、资产发现和漏洞优先级排序。这个宽度重要，因为多数直接同业正从不同起点收敛到同一目的地。SecurityScorecard
              推动威胁知情的 TPRM 和试用驱动动作。UpGuard 混合供应商风险、攻击面管理、信任页面和自动化。Panorays 强押 nth-party 可视性、问卷和修复协作。ProcessUnity
              在购买中心更看重编排和标准化工作流而非品牌化外部评分时最强。Recorded Future 和 Qualys 距离更远，但各自覆盖相邻任务；根据初始问题不同，它们都可能从 Bitsight 手中抽走预算。


              包装是已审阅来源中整个品类看起来最弱的地方。多数供应商展示 demo、价值计算器或免费评估，而不是合同价格、席位数、供应商数量分层或附着率经济性。在保留样本中，SecurityScorecard 的 14
              天免费试用和 UpGuard 的免费即时评分，是最清晰的公开自助入口；包括 Bitsight 在内的大多数其他供应商仍由 demo
              驱动。这很重要，因为即便在企业软件中，公开入口摩擦也会影响早期候选清单速度。它也让外部更难证明，Bitsight 更宽的平台能相对出售更简单评级、工作流或暴露面切口的供应商，获得持久商业溢价。G2
              的评论摘录进一步说明，差异化故事并不只关乎功能：集成、可定制报告和算法变更摩擦，都会影响买方把平台体验为不可或缺还是仅仅够用。
