      - number: '4.4'
        title: 公开牵引力与不透明指标
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的牵引力表面足够宽，能说明品类相关性；但还不够干净，无法有信心建模。官方客户数从 2018 年的 1,200+ 增至 2020 年的 2,100+、2021 年的 2,300+，再到 2025
              年的 3,300。官方产品页还描述了 72K+ 供应商档案、监测 40M+ 公司和大规模情报语料，这些都支撑其规模化平台属性。二级来源在收入量级上大致对齐：GetLatka 估计 2024 年收入为
              $168M、2025 年收入为 $200M，与 Bitsight 自身超过 $200M ARR 的里程碑大体一致。


              但缺失指标主导了承销读法。没有任何已审阅公开来源披露经审计 GAAP
              收入、分部组合、毛利率、经营利润率、营运资本、NRR、CAC、回本周期、实际折扣或标准合同期限。即便是二级数据库，也在基础事实上冲突：Tracxn 显示八轮融资 $398M，而 GetLatka 显示五轮
              $150.6M；员工数代理指标从一家美国法律实体的 385 人，到更广义公司估计约 743 人不等。本缓存中的备案型来源是 Moody's 或通用 SEC 工具页，而不是 BitSight
              发行人备案。这足以描述不透明，但不足以清除不透明。
