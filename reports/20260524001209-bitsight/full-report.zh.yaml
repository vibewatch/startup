        - 到 2027-2028 年退出窗口，ARR 约达 $250M-$260M；扩张仍强，自由现金流被证明可持续
        - 14x-16x ARR 支撑约 $3.4B-$4.2B EV；摊薄前，相对 $2.4B 参照约为 1.4x-1.8x 总回报
