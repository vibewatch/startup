      - number: '6.4'
        title: 持久性代理信号偏正面，但没有正式留存披露
        blocks:
          - type: paragraph
            body: >-
              已审阅的客户记录没有公开净留存率（NRR）、总留存率（GRR）、流失率、续约率或合同期限，所以不能直接靠公开来源承销持久性。记录能提供的是一组复用和扩张代理信号。新增收入一半来自扩张、2024 年新签交易中
              70% 包含暴露面管理产品、早期 CTI 采用者中 40% 来自现有客户，三项信号都正向指向平台在首单落地后继续扩张。客户故事也强化了这一判断。Jedox 在公开信任页面和季度董事会 KPI 中使用
              Bitsight。DATAMARK 称很多潜在客户已经在用 Bitsight，让产品成为自身销售动作的一部分。Fordham、AVEVA 和 Revel 描述了与保险挂钩的工作流，保单续期时很可能重复发生。


              独立满意度代理指标也支持这一点，但仍不完整。G2 在 44 条评论上的 4.6/5 评分，以及 FeaturedCustomers
              的大量证据库存，说明有活跃用户群愿意公开发声。但这些信号不能替代留存数学；供应商主导的客户引用项目可能拉偏样本，满意客户也更愿意写评论。因此尽调立场应当建设性但谨慎：公开证据支持扩张和嵌入式工作流价值，但正式留存经济性仍只属于管理层数据室。
