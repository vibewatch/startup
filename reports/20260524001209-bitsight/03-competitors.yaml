- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat / competitor response
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Established external rating brand
    - Bitsight says its ratings are used by security leaders, insurers, regulators, and boards, and Moody's invested behind the franchise
    - Direct peers now offer similar score-led narratives and can package reports or workflows around them
    - High
    - Request current win-loss data for ratings-led deals versus SecurityScorecard, RiskRecon, and UpGuard
  - - Large mapped supplier and asset dataset
    - 72K vendor profiles, 65K active organizations, 40M+ companies monitored, 250M+ assets attributed
    - Peers increasingly market nth-party discovery, supply-chain visibility, or broader asset discovery
    - High
    - Compare false-positive rates, attribution precision, and downstream remediation outcomes rather than raw object counts
  - - Cross-sell breadth beyond ratings
    - 70% of new deals in 2024 included exposure management and Bitsight now markets TPRM, trust, CTI, ASI, and VI
    - Adjacent suites from Recorded Future, Qualys, and UpGuard can meet the initiating use case without buying a dedicated rating vendor
    - High
    - Ask for attach-rate durability by module and whether multiproduct customers renew at materially higher rates
  - - Financial-market credibility and channel leverage
    - Moody's $250M investment and capital-markets validation
    - Partnership credibility does not by itself solve procurement friction or workflow competition
    - Medium
    - Quantify Moody's-sourced pipeline, attach, and product influence in enterprise and insurance channels
  - - Workflow embed inside incumbent systems
    - Bitsight-Archer integration brings daily score changes and evidence directly into vendor-review workflows
    - Workflow incumbents can own more of the day-to-day UX and push the data layer toward price competition
    - Medium
    - Assess whether integrations increase stickiness or simply make replacement easier by normalizing the data feed
  - - Ratings transparency and user trust
    - Bitsight promotes fair-and-accurate ratings and annual algorithm updates, but G2 reviewers cite reporting gaps and frequent algorithm changes as pain points
    - Trial-led rivals can frame Bitsight as more complex or less predictable at the margin
    - High
    - Ask for customer complaints, churn reasons, and support burden tied to algorithm changes and reporting limitations
  notes: This register mixes product claims, independent demand signals, and observed commercial friction to isolate which parts of the moat appear structural versus more easily copied or routed around.
