  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Contracted ACV, vendor-count tiers, module-level pricing, and discounting for BitSight and most direct peers.
    whyItMatters: Without realized pricing or packaging economics, it is hard to know whether BitSight’s broader platform truly commands a commercial premium or just a marketing premium.
    diligencePath: Request current pricing decks, a recent quote for a representative 1,000-vendor program, and module attach assumptions for BitSight, SecurityScorecard, UpGuard, Panorays, and ProcessUnity.
    relatedQuestionRefs:
    - QP024
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-economics
    missingEvidence: Public win rates, renewal rates, displacement stories, and module attach or churn data versus direct peers are missing.
    whyItMatters: Moat durability depends on whether BitSight wins and retains business because of structural differentiation, not just category age or brand recognition.
    diligencePath: Request management win-loss data by segment, competitor-coded churn reasons, and cohort renewal or module-attach analysis for multiproduct customers.
    relatedQuestionRefs:
    - QP022
    - QP023
    - QP027
    relatedTableRefs:
    - TP004
  - type: access-blocked
    severity: minor
    topic: rapid7-substitute-detail
    missingEvidence: The retained Rapid7 source did not expose usable product, packaging, or customer-segmentation detail for fair substitute comparison.
    whyItMatters: Rapid7 is a plausible adjacent budget competitor, but the local evidence is too thin to score it confidently against BitSight, Qualys, or Recorded Future.
    diligencePath: Add retained Rapid7 product pages or filing sections covering exposure management, vulnerability management, or vendor-risk positioning before the next refresh.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-landscape
    missingEvidence: Regional specialists, smaller entrants, and workflow vendors that did not recur across the retained shortlist sources are not fully enumerated.
    whyItMatters: The competitive map is strongest on the obvious shortlist and weaker on long-tail entrants that could matter in specific verticals, geographies, or channel-led deals.
    diligencePath: Expand the source set with region-specific TPRM and cyber-ratings vendor lists, then refresh the competitor profile and capability matrix with any recurring names.
    relatedQuestionRefs:
    - QP001
    - QP014
    relatedTableRefs:
    - TP001
    - TP002
