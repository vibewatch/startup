  - - RiskRecon
    - Direct peer / contextual ratings
    - Mastercard-owned; outside-in vendor monitoring orientation
    - Regulated buyers, RFP triage, vendor segmentation
    - Materiality-focused external hygiene analysis and continuous monitoring logic
    - Public evidence in retained set is workflow philosophy rather than detailed packaging or pricing
  - - UpGuard
    - Blended ratings + ASM + trust management peer
    - Free instant security score and free-trial signals on public pages
    - Mid-market to enterprise teams wanting fast setup and evidence sharing
    - Single platform spanning vendor risk, attack surface, trust sharing, and automation
    - Can make external reporting feel commoditized rather than defensibly unique
  - - Panorays
    - Context-heavy TPRM peer
    - 99.8% risk-rating-accuracy claim; onboarding and response-rate improvement claims
    - Enterprises modernizing manual TPRM programs
    - Nth-party visibility, tailored questionnaires, business-impact context, remediation collaboration
    - Still largely demo-led publicly; commercial terms are undisclosed
  - - Black Kite
    - Threat-driven ratings adjacent
    - Ransomware-focused third-party ecosystem research
    - Finance, critical infrastructure, and risk-quantification buyers
    - Threat-driven and financial-impact lens for supplier risk
    - Retained public source set is thinner on workflow depth than for Bitsight, UpGuard, or Panorays
  - - ProcessUnity
    - Workflow incumbent / substitute
    - 18,000 completed assessments; 370,000 curated vendor risk profiles
    - Mature enterprise TPRM programs
    - Deep lifecycle orchestration, exchange data, onboarding and due-diligence automation
    - Looks more like workflow infrastructure than a standalone market-standard external rating
  - - Recorded Future
    - Threat intelligence adjacent incumbent
    - Leader in 2026 Gartner MQ for cyberthreat intelligence; 1M+ sources cited
    - Security operations, intelligence, and high-context risk teams
    - Deep threat intelligence, autonomous operations framing, strong research brand
    - Less natively oriented around vendor onboarding and canonical ratings workflows
  - - Qualys
    - Exposure-management substitute
    - 10,000+ subscription customers; 20+ cloud apps; strong profitability
    - Security and compliance teams starting from internal exposure and vulnerability workflows
    - Broad security/compliance platform with major installed base
    - Vendor-rating and questionnaire-led TPRM are not the core public story in retained sources
