- id: growth-drivers-and-constraints
  title: Growth Drivers and Constraints
  body: 'Demand is being pulled forward by real incident experience, expanding third-party ecosystems, and regulatory escalation. Third-party-originated incidents are no longer edge cases: C-Risk cites RiskRecon data showing 24% of organizations suffered third-party-caused incidents in 2024, while Marsh says 70% of respondents experienced at least one material third-party cyber incident in the past year. Budget momentum follows that pain, with Marsh reporting that 66% plan to increase cybersecurity spending in 2026 and KPMG finding that 83% expect partner networks to keep expanding. Regulatory pressure compounds the issue; Gartner describes global regulatory volatility as a driver of cyber-resilience spending and KPMG finds compliance is the single biggest TPRM strategy driver. The headwinds are equally important. KPMG shows only 17% report top-tier data quality, integration across TPRM and ERM is incomplete, and most firms still run TPRM across fragmented systems. Even where managed services
    are common, few organizations outsource the full lifecycle because they worry about control, data sharing, and operating fit.'
