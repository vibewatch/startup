company:
  name: Bitsight
chapter:
  number: 2
  title: Market Analysis
  summary: Bitsight operates in a real and growing third-party risk management market, but the most important diligence fact is that the relevant market is narrower than generic procurement or GRC software and more definition-sensitive than a single headline TAM suggests. Public sources support a fast-growing category shaped by supplier incidents, regulatory pressure, partner-network expansion, and demand for continuous monitoring, while KPMG’s spend data and Bitsight’s own product surface indicate the practical SAM is the cyber-focused tool and data layer inside that broader TPRM spend. The bullish read is that objective external data, fourth-party visibility, and automation are becoming more valuable; the caution is that public evidence still does not isolate Bitsight’s exact product mix or independently validate every ROI claim strongly enough to underwrite a precise SOM from public data alone.
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Sizing Logic
  body: 'Bitsight should be sized inside cyber-focused third-party risk management, not inside all procurement, governance, or generic GRC software. The relevant spend is the set of products and workflows that identify, assess, score, monitor, and remediate supplier cyber risk across the digital supply chain. The company’s own product surface supports that narrower boundary: vendor risk management, continuous monitoring, security ratings, vulnerability response, trust management, and integrations that connect cyber evidence into customer and GRC workflows. That definition matters because public TAM estimates are highly sensitive to methodology. The Business Research Company sizes the overall market at USD 6.82 billion in 2025, USD 8.09 billion in 2026, and USD 15.45 billion by 2030, while Next Move Strategy gives a higher near-term baseline and 2030 forecast. Diligence should therefore use a layered lens: total published TPRM market as the ceiling, cyber-tool spend as the practical SAM,
    and Bitsight’s externally observable data-and-workflow wedge as the near-term SOM frame.'
