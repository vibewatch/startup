  - - Workflow automation layer
    - Inventory collection, evidence review, remediation routing, attestations, framework mapping
    - Pure document storage with no cyber-risk logic
    - TPRM operations and procurement
    - Important because workflow-native vendors compete here
  - - Objective external data layer
    - Outside-in ratings, risk vectors, vendor benchmarking, fourth-party visibility, threat-informed prioritization
