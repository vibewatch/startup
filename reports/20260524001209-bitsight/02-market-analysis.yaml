    - Adjacent buyer segment already served by Bitsight
  - - Status quo and substitute motion
    - Annual questionnaires, spreadsheets, email workflows, one-time reports, workflow-first platforms
    - N/A
    - Incumbent process owners
    - Explains why market conversion is gradual rather than automatic
