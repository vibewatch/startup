  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bitsight-roi-verification
    missingEvidence: Independent case studies or insurer/credit-agency validation that reproduces the public 70% onboarding and 75% breach-probability claims with clear baselines and sample design.
    whyItMatters: These ROI numbers are the strongest public proof points for Bitsight’s market fit, but they are not independently broken out in the reviewed source set.
    diligencePath: Ask management for customer cohorts, methodology, and third-party validation studies underlying the public ROI metrics.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: bitsight-sam-som-isolation
    missingEvidence: Product-line revenue mix or customer-by-use-case data separating security ratings, TPRM workflow, national cybersecurity, and adjacent threat-intelligence or exposure-management products.
    whyItMatters: Without product-mix disclosure, a precise Bitsight SAM or SOM cannot be derived from public data even though the category TAM is observable.
    diligencePath: Request management revenue segmentation, pipeline mix by module, and customer counts by product family before anchoring market-share assumptions.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
