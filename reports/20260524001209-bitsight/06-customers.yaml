  type: flow
  layout: wide
  summary: This flow focuses on how Bitsight moves from a security-team tool into board, insurer, and public-sector workflows, then collides with diligence questions about proof depth and channel opacity.
  data:
    nodes:
    - id: land
      label: Initial ratings / TPRM land
      detail: Security leader buys an objective external signal for posture or vendor review.
    - id: stakeholders
      label: Board / insurer / regulator use
      detail: Outputs begin to matter outside the core security team.
    - id: crosssell
      label: Cross-sell into exposure management and CTI
      detail: Company claims new-module attach and existing-customer CTI adoption.
    - id: government
      label: Government and federal channel
      detail: Public-sector motion adds large strategic accounts and partner involvement.
    - id: proofgap
      label: Proof and retention gap
      detail: Public references are curated and do not disclose NRR, GRR, or concentration.
    - id: friction
      label: Procurement skepticism
      detail: Security ratings can be useful but still need deeper direct assessment.
    edges:
    - from: land
      to: stakeholders
      label: Workflow expands
    - from: stakeholders
      to: crosssell
      label: Broader use cases
    - from: crosssell
      to: government
      label: New channels
    - from: crosssell
      to: proofgap
      label: Opaque economics
    - from: government
      to: proofgap
      label: Concentration questions
    - from: proofgap
      to: friction
      label: Diligence pushback
  approximationNotes: Flow shows relationship between expansion vectors and diligence risks; it does not imply a fixed sequence for every account.
  claimRefs:
  - CU003
  - CU004
  - CU009
  - CU010
  - CU029
  - CU032
  - CU041
callouts:
- calloutType: strength
  title: Expansion evidence is real
  body: 'Public company disclosures and customer stories align on a land-and-expand pattern: existing customers buy additional products and use the platform in adjacent workflows such as insurance, board reporting, and supplier remediation.'
  claimRefs:
  - CU003
  - CU004
  - CU037
  - CU038
- calloutType: risk
  title: Proof depth is much shallower than customer scale
  body: Bitsight’s 3,300-customer disclosure is credible, but only a tiny fraction of that base is visible through named public proof, and there is still no public retention or concentration disclosure.
  claimRefs:
  - CU001
  - CU030
  - CU033
  - CU040
