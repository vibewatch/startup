- id: durability-and-expansion
  title: Durability proxies are favorable, but formal retention disclosure is absent
  body: |-
    There is no public NRR, GRR, churn, renewal-rate, or contract-length disclosure in the reviewed customer record, so durability cannot be underwritten directly from public sources. What the record does offer is a set of repeat-use and expansion proxies. Half of new revenue coming from expansion, 70% of new 2024 deals including exposure-management products, and 40% of early CTI adopters coming from existing customers are all positive signals that the platform expands after the first land. Customer stories reinforce that interpretation. Jedox uses Bitsight on a public trust page and in quarterly board KPIs. DATAMARK says many prospects already use Bitsight, making the product part of its own sales motion. Fordham, AVEVA, and Revel describe insurer-linked workflows that likely recur as policies renew.

    Independent satisfaction proxies are supportive but still incomplete. G2’s 4.6/5 score on 44 reviews and FeaturedCustomers’ large proof inventory suggest there is an active user base willing to speak publicly. But those signals are not substitutes for retention math; they can be skewed by vendor-led reference programs or by the simple fact that satisfied customers are more willing to review. The right diligence stance is therefore constructive but cautious: public evidence supports expansion and embedded workflow value, yet formal retention economics remain a management-only data room item.
