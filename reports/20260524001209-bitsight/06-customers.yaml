- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction signal
  - Likely impact
  - Diligence path
  rows:
  - - Large-account enterprise motion
    - Nearly half of ARR is from six-figure contracts, but customer-count concentration by account is undisclosed
    - A few very large accounts could matter more than logo count suggests
    - Request top-10 customers by ARR and renewal date
  - - Multiproduct cross-sell
    - Exposure-management and CTI attach rates are public, but module-by-module retention is not
    - Expansion looks strong but may not persist evenly by module
    - Request attach, renewal, and churn by module family
  - - Government adoption
    - 180+ agencies and 38 countries are strong proof points, but public-sector ARR mix is undisclosed
    - Public-sector exposure could create procurement-cycle volatility
    - Request direct vs indirect public-sector ARR and renewal cadence
  - - Federal partner channel
    - Interos-led DoD supply-chain deal shows at least one partner-mediated route
    - Partner dependence can compress margin or slow control over renewals
    - 'Request federal bookings split: direct, partner, reseller'
  - - Insurance-linked buying
    - Insurer and broker workflows help land budgets, but could be cyclical with insurance-market conditions
    - Economic buyer may weaken if insurance market softens
    - Request retention for insurance-motivated cohorts
  - - Reference-library bias
    - 39 public case studies versus 3,300 customers implies shallow public proof coverage
    - Marketing sample bias can overstate average customer value or satisfaction
    - Request active reference program by segment, ARR band, and tenure
  - - Ratings-model skepticism
    - Phil Venables argues ratings are useful but insufficient alone for supplier decisions
    - Some buyers may resist over-reliance on ratings in procurement
    - Request win/loss notes where rating skepticism affected deals
  - - Integrations / reporting gaps
    - A current G2 reviewer praised visibility but wanted stronger integrations and customizable reporting
    - Weak integration depth can slow expansion into broader workflows
    - Request gross churn and downsell by integration depth or seat count
  notes: This table mixes visible expansion vectors with public proof limitations and procurement risks. It is a risk map, not a disclosed concentration table.
