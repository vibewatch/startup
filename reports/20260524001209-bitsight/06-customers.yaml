  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-disclosure-gap
    missingEvidence: NRR, GRR, logo churn, contract length, renewal cadence, and cohort retention by product family.
    whyItMatters: Without retention data, public customer stories can only show anecdotal value, not durable economics.
    diligencePath: Request cohort retention tables and renewal schedules segmented by enterprise, public-sector, and module cohorts.
    relatedQuestionRefs:
    - QU017
    - QU024
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR, top-vertical ARR mix, and public-sector share of revenue.
    whyItMatters: A concentrated large-account base can materially change downside risk even if overall customer count looks broad.
    diligencePath: Request customer concentration schedules by ARR, vertical, geography, and renewal date.
    relatedQuestionRefs:
    - QU021
    - QU024
  - type: missing-source
    severity: minor
    topic: channel-disclosure-gap
    missingEvidence: Direct versus partner-led bookings and renewals for government and federal accounts.
    whyItMatters: Partner dependence can affect margin quality, procurement control, and renewal predictability.
    diligencePath: Request bookings and ARR split by direct sales, partners, and resellers, with special focus on public-sector motion.
    relatedQuestionRefs:
    - QU020
    - QU022
    - QU024
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A fuller named-reference list by segment, tenure, and product mix plus a pilot-versus-production breakdown.
    whyItMatters: The public named-customer sample is informative but too small and curated to represent the whole base.
    diligencePath: Request an internal reference roster showing active public references, deployment stage, tenure, and modules purchased.
    relatedQuestionRefs:
    - QU013
    - QU023
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: proof-limitations
    missingEvidence: Internal win-loss notes, procurement objections, and methodology pushback from customers that did not buy or expand.
    whyItMatters: Ratings skepticism and integration objections may be a hidden brake on expansion that public case studies will not surface.
    diligencePath: Review churn interviews, competitive win-loss analysis, and product roadmap evidence for integrations and reporting.
    relatedQuestionRefs:
    - QU025
    - QU026
