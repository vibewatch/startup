  - - Government / national cybersecurity
    - 'Buyer: national cyber authority or agency lead; users: analysts, prime-minister briefings, public institutions; payer: public cybersecurity program'
    - CCB, 180+ agencies, 38 countries using Bitsight
    - Europe + multi-country
    - Strategic credibility and critical-infrastructure workflows
    - Likely durable where tied to policy, alerts, and national benchmarking
    - Direct vs partner-led public-sector bookings not disclosed
  - - Industrial / manufacturing / energy
    - 'Buyer: CISO or cyber strategy lead; users: operations security, M&A, supplier-risk teams; payer: central cyber / operations budget'
    - AVEVA, Cornerstone, Schneider Electric
    - UK/EU + North America + global
    - High-value regulated assets and supplier ecosystems
    - Durability supported by regulatory, insurer, and M&A use cases
    - Vertical revenue share undisclosed
  - - Retail / hospitality / POS
    - 'Buyer: vendor-risk or IT-security lead; users: procurement and store IT; payer: corporate security / IT budget'
    - Cabela’s, Revel Systems
    - North America
    - Shows relevance in distributed-location environments
    - Useful where procurement speed or insurance approval matters
    - No disclosed logo-churn or same-store expansion data
  - - Business services / BPO / consulting
    - 'Buyer: head of security; users: supplier-risk, sales assurance, client-facing teams; payer: corporate security budget'
    - BearingPoint, DATAMARK, EPAM
    - Global
    - Trust and client-assurance use cases reinforce network effects
    - Durability proxy is repeated use in RFP and client conversations
    - No disclosed revenue concentration from this segment
  - - Education
    - 'Buyer: university CISO; users: board, insurance broker, TPRM team; payer: central IT/security budget'
    - Fordham University
    - United States
    - Demonstrates use in open-network, high-PII environments
    - Board reporting and insurance negotiation suggest durable use
    - Higher-education penetration breadth not disclosed
  - - SaaS / application providers
    - 'Buyer: CTO or engineering/security lead; users: cloud ops, board; payer: product-security budget'
    - Jedox
    - Europe / global
    - Strong fit where customers demand trust-page transparency
    - Public badge and board KPI use suggest embedded workflow
    - Only one named SaaS reference in reviewed set
  - - Insurer / broker adjacent economic stakeholder
    - 'Buyer: insurer or broker not directly named as customer; users: underwriting and negotiation teams; payer: adjacent to customer budget'
    - Fordham, Revel, DATAMARK, AVEVA plus $5B premium claim
    - Global / mixed
    - Creates expansion leverage beyond pure cyber team use
    - Insurance-driven buying can reinforce renewals if premiums depend on scores
    - Direct insurer customer count is not disclosed
  notes: Rows summarize publicly visible segments. Durability read is a proxy from workflow embedding, not a disclosed renewal metric.
