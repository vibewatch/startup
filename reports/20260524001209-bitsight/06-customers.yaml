  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Bitsight usually lands through a security or TPRM pain point, then expands into board, insurer, or supplier workflows once the initial posture signal is trusted.
  data:
    items:
    - label: Trigger event
      value: 1
      note: A CISO, TPRM lead, or insurer asks for an outside-in view of security posture or vendor risk.
    - label: Evaluation
      value: 2
      note: Buyer compares Bitsight with internal scans, questionnaires, or another security-ratings product to test whether it adds a usable external signal.
    - label: Initial land
      value: 3
      note: First purchase commonly centers on Security Ratings, SPM, or TPRM for a concrete workflow such as vendor onboarding, benchmarking, or policy reporting.
    - label: Operational embedding
      value: 4
      note: Users begin sharing outputs with boards, procurement teams, regulators, or insurers and incorporate alerts into routine reviews.
    - label: Cross-workflow expansion
      value: 5
      note: Customers add exposure management, CTI, remediation support, or trust-workflow use cases as the platform becomes part of broader cyber-risk operations.
    - label: Reference and renewal
      value: 6
      note: A small subset of customers becomes public references, while the broader base remains mostly opaque on retention, contract size, and proof depth.
