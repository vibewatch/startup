- id: named-customer-proof
  title: Named customer proof is strongest for production deployments in risk-sensitive accounts
  body: |-
    Bitsight’s named customer evidence is strongest where the workflow is mission-critical, externally scrutinized, and easy to narrate in business language. AVEVA describes production use in critical-infrastructure security, including a move from basic to advanced posture in four to five months and insurer or regulator support. Cabela’s describes vendor assessments collapsing from weeks to hours. The Centre for Cybersecurity Belgium describes monitoring 144 organizations, improving a hospital by more than 150 points, and helping close 74% of exposed RDP leaks for one provider. DATAMARK, Fordham, and Revel all tie the product to insurance outcomes; Schneider Electric frames Bitsight as part of managing risk across roughly 52,000 suppliers. These are not vanity logos; they read as active deployments tied to real workflows.

    Even so, the proof set has important limits. The public stories are a curated sample, not an exhaustive customer roster. They rarely disclose contract value, seat count, renewal history, or whether the deployment started small and later expanded. EPAM is useful proof of production value because it reported a 200+ point improvement in under a year, but public corroboration beyond the Bitsight-authored story was blocked in this run. Coventry’s proof is shorter-form than the case studies. Across the set, the named references are enough to show real use in production environments, but not enough to generalize retention or economics across the full base.
