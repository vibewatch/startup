- id: adoption-trajectory
  title: Adoption trajectory and breadth of public proof
  body: |-
    The best current scale disclosure is Bitsight’s April 2025 ARR announcement: 3,300 customers and 65,000 organizations active on the platform. That is large enough to support a real installed base rather than a still-forming category claim. The same release also gives the cleanest adoption-momentum signals: 30% of new 2024 customers were outside North America, nearly half of ARR came from six-figure contracts, half of new revenue came from expansion, 70% of new 2024 deals included exposure-management products, and 40% of early CTI adopters were existing customers. Put together, those signals imply adoption depth inside the base rather than simple logo harvesting.

    What the public record does not do is map those high-level disclosures to a transparent customer ladder. The review and reference layer narrows quickly: FeaturedCustomers shows 43 testimonials, 39 case studies, and 12 videos, while G2 shows 44 reviews. That is useful proof that the customer set is not purely notional, but it is still a tiny share of the disclosed base. Using 39 public case studies against 3,300 customers implies only about 1.2% of the installed base is represented in named public proof. The right read is therefore two-sided: scale looks real, but the public proof set is curated and should not be mistaken for a statistically representative customer cohort.
