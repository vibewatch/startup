  title: Customers
  summary: Bitsight’s public customer evidence supports a real enterprise and public-sector installed base with 3,300 customers, strong large-account penetration, and visible land-and-expand motion into adjacent workflows such as insurance, board reporting, and supplier remediation. Named proof is strongest in regulated, risk-sensitive accounts, but public retention, concentration, and channel economics remain largely undisclosed, so customer quality still relies on proxies rather than formal cohort data.
sections:
- id: customer-segmentation
  title: Customer segmentation by buyer, user, payer, geography, and vertical
  body: |-
    Bitsight’s public customer surface points to an enterprise-first customer base organized around security, risk, and compliance workflows rather than broad self-serve adoption. The visible buyers are usually CISOs, heads of security, or third-party-risk leaders, while users expand to procurement teams, boards, regulators, insurers, and supplier managers once the rating becomes a shared decision tool. Payers also look enterprise-centric: public stories consistently imply that budget sits in central security, GRC, or national cyber programs, not in an individual line-of-business tool budget.

    The vertical mix is broad, but it clusters around regulated or risk-sensitive environments. Public stories cover industrial software and manufacturing (AVEVA, Cornerstone, Schneider Electric), consulting and business services (BearingPoint, DATAMARK, EPAM), retail and hospitality (Cabela’s, Revel), education (Fordham), government and national-security use cases (Centre for Cybersecurity Belgium), and SaaS trust workflows (Jedox). The homepage adds 38% Fortune 500 penetration, 4 of the top 5 investment banks, and 180+ government agencies. Geography is similarly skewed toward large-account markets: named references span North America and Europe, while Bitsight said 30% of new 2024 customers were headquartered outside North America. The common thread is a buyer who needs an externally visible signal that can travel across internal and external stakeholders.
