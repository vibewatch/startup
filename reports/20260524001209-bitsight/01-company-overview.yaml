- id: milestones-partnerships-and-open-risks
  title: Milestones, partnerships, and open risks
  body: 'Bitsight''s chronology shows a company that kept broadening the use cases around its ratings core. The foundational milestones are 2011 founding, the 2018 HQ move and Series D, the 2020 CEO and chairman appointments, the 2020 launch of the Policy Review Board, the August 2021 ARR crossing above $100 million, the September 2021 Moody''s/VisibleRisk transaction, and the April 2025 ARR milestone above $200 million with positive free cash flow. Partnerships also matter because they reveal where Bitsight travels inside larger workflows: the Interos collaboration shows federal supply-chain use cases, while the Belgium case and the current national-cybersecurity page show that government adoption remains a real part of the story rather than a one-off marketing example.


    The main adverse item surfaced in this chapter is the patent dispute with NormShield/Black Kite. PatSnap reports that BitSight filed the case in September 2023 and that it ended in February 2025 with a stipulated dismissal and each side paying its own costs. That outcome removes the overhang of an active federal IP fight, but the public summary does not reveal settlement terms or any continuing license commitments. Combined with the still-incomplete current board roster and the inconsistent public funding and customer totals, the litigation record reinforces the same diligence lesson: Bitsight''s operating momentum is easier to verify than its full governance and ownership picture.'
