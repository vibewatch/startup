  evidenceGaps:
  - type: missing-source
    severity: material
    topic: founder-and-board-roster
    missingEvidence: A current official board roster, committee assignments, and a complete founder list tied to present ownership and roles.
    whyItMatters: Governance quality, founder continuity, and board independence shape key-person risk and shareholder control analysis.
    diligencePath: Request the latest board deck, D&O questionnaire, and cap-table support schedule, then reconcile them against public bios and investor rights documents.
    relatedQuestionRefs:
    - QO005
    - QO025
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: total-disclosed-capital
    missingEvidence: An authoritative reconciliation of whether the 2021 Moody's minority investment should count inside lifetime capital raised and whether any secondaries were included.
    whyItMatters: Funding totals drive dilution, capital-efficiency, and valuation-comps analysis, so the chapter should not overstate certainty.
    diligencePath: Obtain the 2021 transaction documents and cap-table roll-forward, then reconcile official disclosures with Tracxn and GetLatka treatment.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: Board-approved current paying-customer count, employee count, and geographic split as of the 2026 run date.
    whyItMatters: These are front-page diligence metrics that anchor growth quality, operating leverage, and valuation benchmarking.
    diligencePath: Request the latest board KPI pack and HRIS snapshot, then reconcile the 3,300 versus 3,500+ customer claims and the third-party 743 headcount estimate.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO024
    relatedTableRefs:
    - TO001
  - type: access-blocked
    severity: minor
    topic: patent-litigation-docket
    missingEvidence: Underlying pleadings, settlement terms, and dismissal filings for BitSight v. NormShield beyond summary commentary.
    whyItMatters: Direct docket review would clarify litigation spend, any continuing license or covenant terms, and residual IP constraints.
    diligencePath: Pull the PACER docket and key filings for Case 1:23-cv-12055 to confirm whether the dismissal carried any confidential commercial commitments.
