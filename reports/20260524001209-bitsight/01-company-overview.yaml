- id: capitalization-and-stakeholders
  title: Capitalization, investors, and stakeholder map
  body: 'Bitsight''s disclosed capital history has one clean anchor and one messy one. The clean anchor is the June 2018 Series D: $60 million led by Warburg Pincus, taking official cumulative funding to $155 million and giving Warburg managing director Cary Davis a board seat. The messy anchor is the September 2021 Moody''s transaction, which combined a $250 million investment in Bitsight with the acquisition of VisibleRisk and valued Bitsight at $2.4 billion. Bitsight also said Moody''s would become its largest shareholder while still remaining a minority owner, which implies a strategic-but-not-controlling governance position.


    Where diligence gets tricky is cumulative funding math. Tracxn treats the 2021 deal as a Series E and reports $398 million across eight rounds, while GetLatka still reports only $150.6 million across five rounds and treats 2018 as the last funding event. The safest interpretation is not to force a single lifetime-funding number without seeing the 2021 transaction documents. For overview purposes, the durable facts are that Warburg underwrote the late-stage 2018 round, Moody''s reset the shareholder map in 2021, and Bitsight now sits in the unusual position of being a scaled private cyber platform with both sponsor and strategic-owner dynamics.'
