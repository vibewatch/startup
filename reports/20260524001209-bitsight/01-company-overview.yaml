company:
  name: Bitsight
chapter:
  number: 1
  title: Company Overview
  summary: Bitsight is a Boston-based cyber risk intelligence company that created the security-ratings category and has broadened into third-party risk management, exposure management, and threat intelligence. Public evidence shows a $60 million Series D in 2018, a $250 million Moody's investment at a $2.4 billion valuation in 2021, and ARR growth from $100 million in 2021 to more than $200 million with positive free cash flow in 2025. The main diligence caveats are inconsistent public funding/customer/headcount figures and an incomplete current board roster in accessible materials.
sections:
- id: identity-and-platform
  title: Identity, positioning, and platform logic
  body: 'Bitsight is a Boston cyber risk intelligence company founded in 2011 and associated in public records with Bitsight Technologies, Inc. Its current public address is 111 Huntington Ave, Floor 4 in Boston, a headquarters footprint that reflects the 2018 move from Cambridge into a larger Back Bay office. The company''s core identity is still anchored in Security Ratings: an outside-in scoring system on a 250-to-900 scale that Bitsight says is refreshed daily and built from externally observable evidence rather than questionnaires or self-reporting.


    That ratings engine now feeds a much broader platform. Product pages split the business across governance-and-risk workflows such as vendor risk management, trust management hub, advanced analytics, and national cybersecurity, and security-operations workflows such as attack surface intelligence, cyber threat intelligence, and identity intelligence. UpGuard''s independent profile describes the same combination as a unified cyber risk intelligence platform spanning TPRM, exposure management, and threat intelligence. The expansion is strategically coherent: KPMG''s 2026 survey says compliance and cyber risk are the top TPRM drivers, while Marsh reports that 70% of organizations suffered at least one material third-party cyber incident in the past year, which helps explain why Bitsight keeps extending beyond ratings into broader exposure and supply-chain workflows.'
