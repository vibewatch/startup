- id: valuation-context-and-scenario-ranges
  title: Valuation context and scenario ranges
  body: 'The best public anchor for valuation remains the 2021 Moody''s transaction. On the same year''s >$100 million ARR milestone, that mark implied roughly 24x ARR. By contrast, if the headline valuation had not moved while Bitsight crossed >$200 million ARR in 2025, the implied multiple would have compressed to about 12x. That simple bridge is why the old mark reads fair rather than obviously rich: Bitsight has apparently grown into a meaningful portion of it.


    But a fair historical anchor is not the same as an underwriteable 2026 entry. The bullish path needs management to prove that six-figure contract mix, expansion-led new revenue, and the positive-free-cash-flow milestone represent durable economics, not just a good year. The base case therefore keeps valuation close to the stale mark and assumes only modest upside over a two- to three-year horizon. The bear case reflects both growth compression and the possibility that hidden preferences or renewed legal / competitive pressure could pull exit value well below the headline 2021 anchor. The scenario work should therefore be read as valuation discipline, not precision: Bitsight is good enough to deserve a range, but not yet transparent enough to deserve a tight one.'
