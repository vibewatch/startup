- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Growth slowdown
    - Exit-year ARR looks closer to $180M-$200M than $220M-$240M
    - The downside range starts to dominate and a premium software multiple no longer holds
    - Do not pay above the stale 2021 anchor; reset to bear-case valuation
  - - Preference shock
    - Cap table reveals heavy senior liquidation preferences or ratchets
    - Headline fairness stops mattering because new-money return math degrades
    - Pause until the waterfall is fully rebuilt and repriced
  - - Free-cash-flow reversal
    - 2025 positive FCF proves non-recurring once growth spend or working capital normalizes
    - Base and bull cases lose their efficiency premise
    - Downgrade the valuation range and treat financing dependence as immediate
  - - Competitive compression
    - Peers win materially on self-service, workflow breadth, or pricing in new evaluations
    - Bitsight's scarcity premium erodes even if category demand stays healthy
    - Require a lower entry multiple or stronger retention proof
  - - Fresh legal / reputational issue
    - A new material dispute, methodology backlash, or trust event reopens defensibility concerns
    - Risk weighting shifts from fair-value debate to downside protection
    - Stop process until impact on churn, pricing, and exit paths is understood
  notes: These are investment triggers, not operational KPIs. Each one is meant to force a re-cut of the valuation range rather than a narrative debate.
  claimRefs:
