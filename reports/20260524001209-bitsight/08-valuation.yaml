- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Revenue quality
    - Six-figure contracts, expansion-led new revenue, and multi-product attach imply sticky enterprise economics
    - Public proof stops short of NRR, cohort durability, and audited margin disclosure
    - Show NRR above 110%, low churn, and audited gross-margin progression
  - - Strategic relevance
    - Moody's ownership plus financial-exposure analytics make Bitsight strategically relevant to larger risk-data buyers
    - Strategic relevance does not guarantee a clean return if preferences or pricing expectations are investor-unfriendly
    - Provide governance rights, transfer restrictions, and any commercial side letters
  - - Market demand
    - TPRM demand is supported by strong incident prevalence and sustained cyber-budget growth
    - Fast-growing categories still re-rate downward when differentiation compresses
    - Show that Bitsight continues to win against trial-led and workflow-heavy peers at premium pricing
  - - Platform breadth
    - Bitsight now spans governance/risk and security-operations workflows rather than one ratings SKU
    - Broader peer sets from SecurityScorecard, UpGuard, Panorays, ProcessUnity, and Recorded Future reduce scarcity value
    - Demonstrate that breadth drives measurable expansion and not just a wider product catalog
  - - Valuation anchor
    - The stale $2.4B mark compresses from ~24x 2021 ARR to ~12x on 2025 ARR if the headline has not moved
    - That bridge can still be misleading if free cash flow is non-durable or the cap table is preference-heavy
    - Reconcile ARR, cash generation, and the fully diluted waterfall before paying above the old anchor
  notes: Thesis and anti-thesis are both evidence-backed and intentionally conditional on price and diligence quality.
