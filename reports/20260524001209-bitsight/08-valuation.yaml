- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - ARR reaches roughly $250M-$260M by a 2027-2028 exit window, expansion remains strong, and free cash flow proves durable
    - 14x-16x ARR supports roughly $3.4B-$4.2B EV, or about 1.4x-1.8x gross against a $2.4B reference before dilution
    - Possible but diligence-dependent
    - Requires clean preferences, strong retention, and no fresh legal or reputational shock
  - - Base
    - ARR reaches roughly $220M-$240M, growth slows into the high teens, and economics look good but not IPO-premium clean
    - 10x-12x ARR supports roughly $2.2B-$2.9B EV, implying flat-to-modest upside versus the stale public anchor
    - Most supportable from current evidence
    - Upside disappears if preferences are heavy or if 2025 free cash flow does not repeat
  - - Bear
    - Growth slows toward the mid-teens or below, premium pricing compresses, and the company still lacks clean financing transparency
    - 6x-8x ARR supports roughly $1.1B-$1.7B EV, materially below the 2021 disclosed mark
    - Always available if diligence disappoints
    - Competitive substitution, non-durable FCF, or a new legal / reputational issue can push the case here quickly
  notes: Return logic is illustrative and does not include preference-stack math; that omission is a material diligence gap, not a rounding issue.
