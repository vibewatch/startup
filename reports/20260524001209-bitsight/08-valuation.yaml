  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preference-overhang
    missingEvidence: A fully diluted cap table with share classes, option pool, liquidation preferences, protective provisions, and any side letters tied to the Moody's transaction or later financings.
    whyItMatters: The valuation can look fair on headline ARR but still produce weak common-equity returns if senior preferences, ratchets, or hidden dilution absorb downside and moderate upside.
    diligencePath: Request the current cap table from finance and counsel, then rebuild the waterfall for the 1.0x, 1.5x, and 2.0x exit cases in TV003 and FV003.
    relatedQuestionRefs:
    - QV007
    - QV029
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Current cash balance, monthly burn or cash generation, debt facilities, covenant package, and board-approved financing plan.
    whyItMatters: The 2025 positive-free-cash-flow claim is directionally encouraging, but it does not reveal whether Bitsight can self-fund growth or still needs a round before an IPO or strategic exit window opens.
    diligencePath: Request the last 18 months of cash-flow statements, debt schedules, and management's 24-month liquidity model.
    relatedQuestionRefs:
    - QV008
  - type: access-blocked
    severity: material
    topic: public-comp-multiples
    missingEvidence: A directly usable public-comp pack with current EV/revenue, growth, and margin data from filing-grade or market-data sources for cyber platforms closest to Bitsight.
    whyItMatters: The retained Qualys and Rapid7 materials are directionally useful, but they are not enough to set a tight market-clearing multiple range without wide analyst assumptions.
    diligencePath: Refresh Qualys, Rapid7, and additional public cyber comps from accessible SEC/IR sources or an approved market-data terminal before final IC sign-off.
    relatedQuestionRefs:
    - QV011
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 financial statements, NRR / GRR, cohort bridges, gross margin by major product family, and a current ARR bridge.
    whyItMatters: Those data would determine whether Bitsight deserves a premium software multiple or merely a fair strategic mark around the stale 2021 valuation anchor.
    diligencePath: Open a management data room or request a CFO deck that reconciles ARR, revenue, margin, cash flow, and retention for the last eight quarters.
    relatedQuestionRefs:
    - QV005
    - QV025
    - QV026
