- id: diligence-asks-and-thesis-breakers
  title: Diligence asks and thesis-breakers
  body: 'The chapter''s missing evidence is not cosmetic. It is exactly the information that determines whether a fair-looking headline valuation translates into good investor returns. The first blocker is the capital structure: without the fully diluted cap table and liquidation waterfall, it is impossible to know how much downside protection senior holders already own. The second blocker is operating quality: investors still need audited revenue, retention, margin, and cash-flow bridges to determine whether Bitsight deserves a premium software multiple or merely a fair strategic mark. The third blocker is current process context: if a new round is being marketed above the stale $2.4 billion anchor, then the burden of proof rises sharply.


    The thesis-break triggers are therefore concrete. If growth slows into the mid-teens before the company proves durable free cash flow, if the market starts treating ratings and workflow tooling as increasingly interchangeable, or if a new legal / reputational issue reopens questions about defensibility, the downside range becomes more important than the upside story. Conversely, the thesis strengthens quickly if management can reconcile ARR, cash generation, and the cap table in a way that preserves upside for new money. Until then, diligence—not narrative—is the edge.'
