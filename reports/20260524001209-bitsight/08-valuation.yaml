tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence quality
  - What changes the view
  rows:
  - - Overall recommendation
    - research-more
    - Medium — operating proof is decent but pricing, cap-table, and audited-financial context are incomplete
    - Upgrade if management provides audited operating data and a clean waterfall at or below the 2021 valuation anchor
  - - Confidence
    - medium
    - Medium — multiple durable signals exist, but several investor-critical facts remain private
    - Moves to high only with audited financials, NRR, and financing-process clarity
  - - Risk rating
    - high
    - High — hidden preferences, competitive convergence, and unresolved valuation precision create real downside risk
    - Reduces if cap-table terms are simple and growth / FCF durability are independently confirmed
  - - Valuation stance
    - fair
    - Medium — the stale $2.4B mark is not obviously wrong against >$200M ARR, but it is not cheap without more proof
    - Becomes attractive below the anchor with clean prefs; becomes stretched above it without new proof
  - - Financing context
    - No public 2026 round surfaced
    - Low-Medium — only the 2021 Moody's transaction is a hard public valuation anchor
    - A current price sheet or market-check process would materially sharpen the call
  - - Decision implication
    - Proceed only with diligence leverage
    - Medium — this is a company-quality yes but a price-quality maybe
    - If management insists on a premium to the stale mark without data, walk away
  notes: Assessment is intentionally price-sensitive. Fair means around the last disclosed 2021 valuation anchor with clean terms, not fair at any price.
