- id: financial-verdict
  title: Financial verdict
  body: "Bitsight looks financially promising in the limited ways a private cyber-data company can look promising from the outside: official materials support >$200M ARR, expansion-led growth, broad module breadth, strong customer-scale progression, and a 2025 claim of positive free cash flow. The platform's shared dataset and workflow expansion also create a coherent narrative for software-like revenue quality and improving incremental margins over time.\n\nThe problem is not absence of good signals; it is absence of underwriteable detail. The public record still lacks audited financials, revenue recognition detail, gross margin, operating margin, NRR, cash, runway, cap-table precision, and debt disclosure. Secondary databases disagree on basic funding and headcount facts, while public market analogs such as Qualys can only provide margin context, not company-specific proof. Verdict: Bitsight's business model appears credible and increasingly durable, but any investment or credit decision\
    \ still depends on private diligence for margins, retention, pricing realization, and liquidity."
