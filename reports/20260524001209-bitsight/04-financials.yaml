- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: "Company Overview owns the full funding chronology; the relevant financial question here is whether the public record is strong enough to underwrite present liquidity. The solidly corroborated facts are that Bitsight raised $60M in 2018, Moody's invested $250M in 2021 at a $2.4B valuation, and Moody's became the largest minority shareholder. That gives an official disclosed capital floor of at least $310M from those two events alone, while Tracxn places cumulative funding at $398M. Bitsight also claimed positive free cash flow in its 2025 ARR announcement, which directionally lowers the probability of immediate financing stress versus a pure burn story.\n\nStill, capital adequacy remains mostly unobservable from public evidence. No reviewed source disclosed current cash, monthly burn, runway, debt facilities, covenant package, or lease and working-capital obligations. The fetched Moody's IR and SEC pages add filing infrastructure context but no newer operating data on Bitsight itself.\
    \ The right reading is therefore cautious: strategic backing and a claimed free-cash-flow milestone are positives, but they do not substitute for a cash bridge or debt schedule. A lender or growth-equity investor would still need management materials before underwriting liquidity or next-round timing."
