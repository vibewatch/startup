company:
  name: Bitsight
chapter:
  number: 4
  title: Financials
  summary: Bitsight's public financial picture is directionally encouraging but still incomplete for underwriting. Official materials support a >$200M ARR, expansion-led, multi-product cyber-risk platform that also claimed positive free cash flow in 2025, while Moody's remains a strategic minority shareholder after its 2021 $250M investment. But public sources still do not disclose audited financials, realized pricing, margins, NRR, cash, or runway, and secondary databases conflict on total funding and headcount.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing surface
  body: "Bitsight's revenue model now looks like a bundled cyber-risk intelligence platform rather than a single security-ratings SKU. Official product pages show monetizable modules across security ratings and security-performance management, vendor risk management, trust management, attack-surface intelligence, cyber threat intelligence, and cyber-risk quantification. That breadth matters financially because the 2025 ARR announcement tied growth to multiproduct adoption, exposure-management attach, and expansion from existing customers rather than to one-time category creation alone. The revenue-quality read is therefore favorable: once a customer lands on the core dataset, Bitsight can upsell adjacent workflows that reuse the same telemetry backbone.\n\nWhat remains opaque is commercial structure. The reviewed official pages consistently push prospects toward demos and sales engagement instead of publishing public list pricing, standard contract terms, or module-level rate cards. That\
    \ likely means realized price depends on enterprise scope, number of monitored entities, additional modules, and negotiated services. The absence of public pricing does not invalidate the model, but it prevents any clean public read on ARPU, discounting discipline, contract duration, or revenue recognition mechanics."
  claimRefs:
