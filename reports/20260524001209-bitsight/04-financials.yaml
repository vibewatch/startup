  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements with revenue recognition, deferred revenue, and segment or product-family disclosure.
    whyItMatters: Without audited statements, ARR and revenue quality cannot be reconciled to GAAP and margin analysis remains speculative.
    diligencePath: Request the last three years of audited financials, monthly management accounts, deferred-revenue roll-forward, and revenue-recognition memo.
    relatedQuestionRefs:
    - QI012
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A current cap table with share classes, liquidation preferences, option pool, and all primary or secondary financings after 2018.
    whyItMatters: Secondary databases conflict on total funding and latest-round history, so dilution and preference overhang cannot be modeled publicly.
    diligencePath: Request the signed capitalization table, financing documents, board consents, and any shareholder side letters with Moody's or other investors.
    relatedQuestionRefs:
    - QI017
    - QI021
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margins
    missingEvidence: Actual gross margin, contribution margin, and hosting or data cost allocations by product family.
    whyItMatters: Comparator margins are not a substitute for company economics, especially for a business with heavy telemetry, AI, and workflow costs.
    diligencePath: Request product-level P&L reporting, infrastructure spend by module, support load, and a gross-margin bridge from 2023 through 2026 YTD.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Net revenue retention, gross revenue retention, logo retention, and cohort expansion curves.
    whyItMatters: Expansion claims are strong, but recurring-revenue durability cannot be underwritten without retention and cohort data.
    diligencePath: Request quarterly NRR and GRR, customer-cohort waterfalls, upsell by module, and churn reasons by ACV tier.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, committed facilities, and runway under base and downside cases.
    whyItMatters: Positive free cash flow in one period does not answer whether the company can self-fund growth or withstand a slowdown.
    diligencePath: Request treasury reports, 13-week cash forecast, monthly cash bridge, debt availability, and 12-to-24-month runway scenarios.
    relatedQuestionRefs:
    - QI019
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt schedule, lease commitments, covenant package, liens, and any project-finance or vendor-financing obligations.
    whyItMatters: Public silence is not proof of absence; hidden leverage or covenant constraints could change the risk profile materially.
    diligencePath: Request debt and lease schedules, UCC or lien searches, covenant calculations, and any vendor-financing agreements tied to infrastructure or services.
    relatedQuestionRefs:
    - QI013
    - QI022
    relatedTableRefs:
    - TI004
    - TI005
