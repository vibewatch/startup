- id: public-traction-versus-opaque-metrics
  title: Public traction versus opaque metrics
  body: "Bitsight's traction surface is broad enough to show category relevance but not clean enough to model with confidence. Official customer counts moved from 1,200+ in 2018 to 2,100+ in 2020, 2,300+ in 2021, and 3,300 in 2025. Official product pages also describe 72K+ vendor profiles, 40M+ companies monitored, and a large intelligence corpus, all of which support a scaled platform. Secondary sources roughly line up on top-line magnitude: GetLatka estimated 2024 revenue at $168M and 2025 revenue at $200M, broadly consistent with Bitsight's own >$200M ARR milestone.\n\nBut the missing metrics dominate the underwriting read. No reviewed public source disclosed audited GAAP revenue, segment mix, gross margin, operating margin, working capital, NRR, CAC, payback, realized discounting, or standard contract duration. Even secondary databases conflict on foundational facts: Tracxn shows $398M raised across eight rounds, whereas GetLatka shows $150.6M across five rounds; headcount proxies range\
    \ from 385 for a U.S. legal entity to roughly 743 for the broader company estimate. Filing-type sources in this cache are Moody's or generic SEC utility pages rather than BitSight issuer filings. That is enough to describe opacity, but not enough to clear it."
