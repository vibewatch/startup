- id: gtm-and-sales-efficiency-proxies
  title: GTM motion and sales-efficiency proxies
  body: "Public GTM evidence suggests a classic enterprise land-and-expand motion supported by customer-assurance workflows. Bitsight said nearly half of ARR now comes from six-figure contracts, half of new revenue comes from customer expansion, and 70% of 2024 new deals included exposure-management products. Those are strong efficiency proxies because they imply higher ACV concentration, module expansion after initial land, and some commercial leverage from the installed base. Trust Management Hub reinforces that interpretation: Bitsight explicitly markets it as a way for security teams to help sales answer reviews faster and close deals without bottlenecking the revenue cycle.\n\nThere are also directional geographic and sector signals. Bitsight said 30% of new 2024 customers were outside North America, while the 2022 ARR milestone highlighted 42% YoY public-sector growth and broad adoption by cyber insurers. Official ROI claims from vendor-risk pages — 3x ROI in six months, 90% vendor\
    \ acceptance, and 75%+ time reduction — are company marketing rather than audited unit economics, but they are still useful as evidence of what Bitsight believes resonates with buyers. The hard metrics investors usually want — CAC, payback, quota capacity, win rate, realized contract duration, and NRR — remain private."
