- id: TI005
  title: Public financial gaps table
  columns:
  - Missing item
  - Current public status
  - Impact on underwriting
  - Why unresolved
  - Exact diligence path
  rows:
  - - Audited financials and revenue recognition
    - Not publicly available in reviewed sources
    - Blocks clean revenue, margin, and working-capital analysis
    - Bitsight is private and filing-type sources in this cache are not issuer statements
    - Request audited financial statements, billings bridge, deferred-revenue roll-forward, and revenue-recognition memo
  - - Cap table and share classes
    - Public databases conflict materially
    - Blocks dilution, preference stack, and ownership analysis
    - Secondary sources disagree on total funding and latest round count
    - Request full cap table, financing documents, option pool schedule, and SAFEs / notes if any
  - - Gross margin by product family
    - Not publicly disclosed
    - Blocks valuation and cash-generation modeling
    - Official materials discuss products and data scale but not costs
    - Request gross margin by module plus hosting, data, and support cost allocations
  - - NRR / GRR and cohort data
    - Not publicly disclosed
    - Blocks recurring-revenue quality analysis
    - Expansion claims are strong, but retention figures are absent
    - Request NRR, GRR, logo retention, cohort bridges, and expansion by cohort
  - - Cash, burn, and runway
    - Not publicly disclosed
    - Blocks liquidity and financing-dependency analysis
    - Positive free cash flow was claimed without balance-sheet context
    - Request monthly cash bridge, current cash, revolver availability, and runway scenarios
  - - Debt, leases, and covenants
    - No public debt package found in reviewed sources
    - Blocks downside and covenant-risk analysis
    - Public silence is insufficient evidence for absence
    - Request debt schedule, lease commitments, liens, and covenant package
  - - Realized pricing, discounts, and contract terms
    - No public list pricing or standard terms found
    - Blocks ARPU and revenue-recognition analysis
    - Commercial pages are demo-led and enterprise-negotiated
    - Request price book, standard MSA, discount policy, and ACV distribution by cohort
  notes: These are the evidence gaps that keep the chapter verdict cautious even though commercial traction signals are encouraging.
