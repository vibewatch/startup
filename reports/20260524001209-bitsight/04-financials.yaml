    - Shareholder quality affects rescue-financing probability
    - Provide board rights, protective provisions, and any commercial side letters
  - - Cash on hand
    - null
    - Low
    - Current liquidity not public
    - Cash balance determines runway and covenant headroom
    - Provide current cash and cash-equivalent balance
