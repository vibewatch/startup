- id: people-execution-and-thesis-breakers
  title: People, Execution, Mitigations, and Thesis-Break Indicators
  body: 'People and execution risk remain concentrated around trust-bearing roles. Stephen Harvey has led the company since 2020, while the board has added experienced operators such as Bob Brennan and Shelley Leibowitz. That is helpful, but the public record still does not show a current committee map or formal succession plan, which keeps key-person risk meaningful. The remote-first model broadens hiring reach, yet the careers page’s warning about impersonation and fraudulent recruiting attempts is a reminder that brand trust, security, and talent operations intersect directly for a cybersecurity vendor. The mitigation side of the story is credible: Bitsight publishes trust-center material, exposes security and AI-use policies, and claims measurable efficiency gains in trust workflows. Even so, the kill criteria are clear. The thesis weakens materially if appeal volumes rise faster than dispute-resolution capacity, if public-sector or Moody’s-linked workflow expansion fails to convert
    into durable embedded usage, if growth lags despite favorable market budgets, or if leadership continuity becomes uncertain before governance disclosure improves.'
