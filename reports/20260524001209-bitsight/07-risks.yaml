  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: normshield-docket-terms
    missingEvidence: The underlying PACER docket, stipulation text, and any related settlement or license terms for Case 1:23-cv-12055.
    whyItMatters: The dismissal itself is public, but the commercial consequences matter more than the headline because they determine whether BitSight retained clean freedom to operate or accepted private constraints.
    diligencePath: Pull the full PACER docket and dismissal papers for BitSight Technologies, Inc. v. NormShield, Inc., then review any sealed references with counsel.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: material
    topic: federal-award-detail
    missingEvidence: A contract-level government award record showing the exact federal customer, award value, period of performance, and whether the Interos relationship scaled beyond the disclosed use case.
    whyItMatters: Public-sector dependence can be either a moat or a concentration trap; without award detail, the investor cannot size revenue concentration or renewal dependence.
    diligencePath: Query SAM.gov, USAspending, and internal bookings data for the Interos/DoD workstream, then reconcile against public-sector ARR and pipeline exposure.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: succession-and-board-structure
    missingEvidence: A current board roster with committee assignments plus a formal CEO and CTO succession plan.
    whyItMatters: Bitsight’s value proposition is tied to trust in data, regulation-facing judgment, and partner credibility, so leadership continuity and board independence are core execution controls.
    diligencePath: Request the latest board materials, committee charters, and executive succession documentation and compare them with public bios and role announcements.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: partner-and-revenue-concentration
    missingEvidence: Revenue mix by Moody’s-linked channels, government programs, top integrations, and any insurer or board workflow cohort that materially drives bookings.
    whyItMatters: The public sources show where Bitsight is embedded, but not how much money each route controls, which is the difference between a diversified workflow layer and a concentration risk.
    diligencePath: Request bookings, ARR, and renewal concentration by channel, partner, and top ten customers or programs.
    relatedQuestionRefs:
    - QR011
    - QR014
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: appeals-and-churn-metrics
    missingEvidence: The share of customers affected by algorithm appeals, average escalation volume, and any churn or downgrade correlation after ratings disputes.
    whyItMatters: If trust in score accuracy is the core residual risk, the leading indicators must come from operating data rather than anecdotes alone.
    diligencePath: Request 2024-2026 appeal volumes, resolution SLA performance, NPS by affected cohort, and any churn analysis linked to score disputes.
    relatedQuestionRefs:
    - QR027
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
