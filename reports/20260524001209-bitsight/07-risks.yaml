company:
  name: Bitsight
chapter:
  number: 7
  title: Risks
  summary: 'Bitsight’s highest residual risk is not a single lawsuit or breach but trust erosion: if algorithm changes, stale findings, or weak explainability make customers question whether the company’s ratings still map to real-world risk, commercial leverage can fall quickly. Regulatory/privacy exposure, public-sector and Moody’s dependency, and incomplete disclosure on government revenue and succession planning are the next most important concerns. Mitigations are real—published privacy frameworks, a formal Policy Review Board, trust-center controls, and workflow products—but the thesis breaks if Bitsight cannot convert that governance into durable embedded usage and growth.'
sections:
- id: regulatory-and-legal-risks
  title: Regulatory and Legal Risks
  body: 'Bitsight’s legal and regulatory risk is less about classic product liability and more about whether a company that monetizes external cyber judgments can keep its privacy, fairness, and disclosure norms credible as the market scales. The privacy policy is explicit that Bitsight’s CTI workflows may handle clear-web, dark-web, and deep-web data, including compromised and sensitive personal information, and that the company may act as a joint controller with customers and partners. That creates multi-jurisdiction exposure around data transfers, retention, and legal basis, partially mitigated by the company’s published DPF and APEC certifications and its trust-center controls. A second risk cluster is ratings governance: Bitsight has formalized a Policy Review Board, dispute rights, and published resolution expectations, but those same commitments raise the cost of getting model changes wrong. The NormShield patent dispute did not end existentially, yet it reminds investors that ratings
    and exposure-management workflows sit inside a real IP battleground. The remaining blocker is transparency: without full PACER materials and direct federal award detail, residual legal and public-sector compliance exposure cannot be fully cleared.'
