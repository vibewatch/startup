- id: partner-and-dependency-risks
  title: Partner, Government, and Workflow Dependency Risks
  body: 'Bitsight’s dependency map is unusually commercial rather than infrastructural. The most obvious node is Moody’s: the 2021 transaction brought $250 million of capital, a $2.4 billion valuation marker, and a distribution path into integrated risk workflows. That is a strength, but it also creates dependency on one powerful minority shareholder to keep turning cyber data into financial workflows. Government and public-sector references are the second node. The Interos/DoD announcement, the 38-country milestone, and the Belgium case study all show real adoption, but they also imply ongoing delivery, compliance, and relationship-management burden that public disclosures do not size cleanly. The third node is workflow embedment. Venminder and Slack integrations show Bitsight moving beyond a static score toward operational workflows, which should improve stickiness, yet every integration also adds API, platform-priority, and partner-roadmap risk. The key diligence question is concentration:
    today’s public record proves Bitsight is embedded in important ecosystems, but it does not reveal how much revenue or renewal durability each ecosystem controls.'
