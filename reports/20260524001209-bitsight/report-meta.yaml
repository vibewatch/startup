companyProfile:
  summary: >
    Bitsight was founded in 2011 and is headquartered in Boston, Massachusetts. The company created the
    cybersecurity ratings category and now sells a broader cyber risk intelligence platform spanning security
    ratings, third-party risk management, vendor workflows, exposure management, and threat intelligence.
    Public evidence supports a strategically relevant business with more than $200M ARR, a large enterprise and
    public-sector footprint, and a landmark 2021 Moody's transaction that valued the company at $2.4B; however,
    the current public record still lacks audited operating data, clean cap-table detail, and a fully current
    governance roster.
  foundedDate: "2011-01-01"
  founders:
    - name: Stephen Boyer
      role: Co-founder & CTO
      background: >
        Publicly identified co-founder and CTO who remains linked to Bitsight's ratings methodology and Policy
        Review Board, making him the clearest founder-continuity signal in current public materials.
      claimRefs: [CO014]
  foundingLocation: Cambridge, Massachusetts, USA
  headquarters: Boston, Massachusetts, USA
  productSummary: >
    Bitsight combines security ratings, vendor risk management, trust-management workflows, exposure and attack
    surface intelligence, vulnerability intelligence, identity and credential intelligence, and cyber threat
    intelligence into a cyber risk platform used by governance/risk teams and security operations teams.
  customerFocus: >
    Large enterprises, financial institutions, insurers, governments, critical-infrastructure operators, and
    organizations with material third-party or supply-chain exposure.
  businessModel: >
    Subscription software and workflow-driven cyber risk intelligence sold across multiple modules, with visible
    land-and-expand dynamics through enterprise six-figure contracts, customer expansion, and cross-sell into
    exposure management and threat-intelligence products.
  stage: Series E (private, Moody's strategic minority investor)
  fundingStatus: >
    Publicly disclosed funding includes a $60M Series D in 2018 and a 2021 Moody's-led strategic transaction
    involving a $250M investment and the VisibleRisk acquisition. Third-party databases disagree on total raised,
    with Tracxn showing roughly $398M across eight rounds while GetLatka shows a lower historical total that
    excludes the 2021 strategic deal.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO014, CO019, CO021, CO022, CO024, CO026, CO028, CU001]
summary:
  headline: >
    Bitsight is a category-defining cyber risk intelligence platform with real scale, strategic relevance, and a
    plausible valuation anchor around the last public $2.4B mark, but the lack of audited economics, current
    financing terms, and clear preference-waterfall disclosure supports a research-more recommendation rather than
    a clean buy call.
