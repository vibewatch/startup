- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk / caveat
  rows:
  - - REST and WebSocket APIs
    - Programmatic trading, account, and market-data access
    - Official docs, endpoints, rate limits, auth stack
    - API misuse or outages can affect trading workflows
  - - Permissioned API keys + IP binding
    - Operational security for automated clients
    - User-managed keys and network hygiene
    - Key management remains customer responsibility
  - - Demo trading environment
    - Testing and simulation for strategies
    - Separate simulated accounts and headers
    - Public docs do not fully quantify sandbox parity
  - - Wallet extension / mobile apps
    - Client-side key storage and dApp access
    - App stores, browsers, mobile OSes
    - Phishing, device compromise, and UX complexity
  - - DEX routing / bridges
    - Find liquidity and support cross-chain execution
    - Third-party pools, bridges, and networks
    - Liquidity fragmentation and bridge risk
  - - Embedded and custodial partner rails
    - Support partner front ends and off-exchange custody
    - Custodian partners, O/EMS integrations, regional licenses
    - Dependency on third parties can widen failure surface
  notes: 'Architecture is visibly modular and dependency-heavy: more extensible than a pure exchange, but also more exposed to partner and infrastructure failure.'
