  rows:
  - - Proof of Reserves
    - Live monthly program; 46th report visible in Aug 2026
    - Exchange reserves and user-balance verification
    - Snapshot transparency is not the same as full audited financials
  - - OKX Protect
    - Explicit security and self-custody trust layer
    - Exchange, wallet, and real-time defense positioning
    - Marketing packaging does not by itself prove incident handling quality
  - - Web3 risk-control telemetry
    - Detailed H1 2026 interception metrics published
    - Wallet, DEX, websites, and risk-address detection
    - Public metrics do not reveal false-positive rates or support burden
  - - Security report / method parsing
    - 50K+ methods parsed; signing-risk protection published
    - Wallet transaction readability and warnings
    - Independent verification of every metric is limited
  - - Third-party audits
    - Hacken lists 22 audits; reviews cite SlowMist/Certik
    - Selected products and security surfaces
    - Audit scope and recency vary by module
  - - Customer feedback
    - Mixed to adverse on Trustpilot, mixed in reviews
    - Support, UI, dispute handling, novice UX
    - Review quality is noisy and skewed toward edge cases
  - - Compliance controls
    - KYC, sanctions screening, suspicious-activity monitoring, region gating
    - Global exchange and wallet-linked access surfaces
    - Compliance can also create account friction and geography-based inconsistency
  notes: Trust evidence is materially stronger than at many crypto venues, but customer-service friction remains visible in third-party reviews.
