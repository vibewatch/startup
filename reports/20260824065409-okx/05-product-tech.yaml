  evidenceGaps:
  - type: adoption-gap
    severity: high
    topic: module-level usage and retention
    missingEvidence: OKX does not publicly break out MAUs, DAUs, retention, or revenue by wallet, exchange, earn, institutional, and frontier modules.
    whyItMatters: Without module-level usage, it is impossible to know whether frontier products are meaningful drivers or just feature surface area.
    diligencePath: Request product analytics dashboards with MAU, DAU, retention, conversion, and cross-sell by module and region.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: roadmap-gap
    severity: medium
    topic: frontier product roadmap confidence
    missingEvidence: Public materials describe Onchain OS, Outcomes, and RWA discovery, but not shipped-user counts, retention, or milestone slippage.
    whyItMatters: Roadmap claims matter only if these modules are sticky and scalable.
    diligencePath: Request roadmap documents, launch KPIs, post-launch reviews, and product-level revenue or engagement targets.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedFigureRefs:
    - FE004
  - type: support-gap
    severity: medium
    topic: support and incident handling quality
    missingEvidence: Third-party complaints are visible, but OKX does not publish support SLAs, incident rates, or resolution-time distributions by product.
    whyItMatters: Support quality becomes strategically important when products span custodial exchange, self-custody wallet, and institutional workflows.
    diligencePath: Request support SLA dashboards, escalation metrics, and incident postmortems segmented by product surface and geography.
    relatedQuestionRefs:
    - QE017
    - QE025
    relatedTableRefs:
    - TE004
  - type: dependency-gap
    severity: medium
    topic: partner and infrastructure concentration
    missingEvidence: Embedded customers, custody partners, bridge dependencies, and key vendor concentration are not publicly disclosed.
    whyItMatters: The stack may be stronger than a pure exchange, but it may also be more brittle if a few partners are critical.
    diligencePath: Request partner concentration, vendor criticality mapping, and business continuity plans for major technical dependencies.
