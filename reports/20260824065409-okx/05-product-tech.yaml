tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / surface
  - Primary customer job
  - Current status / scope
  - Differentiation
  - Main limitation / diligence gap
  rows:
  - - Centralized exchange
    - Trade spot and derivatives with deep liquidity
    - Mature global core with spot, futures, options, bots, copy, earn
    - Breadth under one brand and institutional-grade tooling
    - Regional product availability is fragmented
  - - Institutional venue / RFQ
    - Execute large or custom strategies with minimal market impact
    - Live via Institutional page and Liquid Marketplace
    - RFQ, multi-leg support, low-latency infrastructure
    - Public client concentration and SLA metrics absent
  - - OKX Wallet
    - Self-custody, dApps, NFTs, staking, swaps
    - Live on mobile and extension; supports 60+ to 130+ chains across pages
    - Combines wallet, DEX routing, data, and DeFi in one surface
    - Exact chain count and novice suitability vary by page/source
  - - Onchain execution / DEX layer
    - Trade onchain tokens with routing and bridges
    - Live and deeply integrated into wallet workflows
    - Best-price routing across many pools and cross-chain flows
    - Actual monetization and usage by module are undisclosed
  - - Embedded / partner infrastructure
    - Let partners offer crypto trading in their own UX
    - Live via Rubix and institutional APIs
    - Front-end white-labelling with OKX back-end liquidity
    - Customer roster and contracted economics are not public
  - - 'Emerging modules: Onchain OS, Outcomes, RWA discovery'
    - Expand from exchange to crypto operating system
    - Visible in 2026 official materials; maturity still behind core exchange
    - Control-first design for new categories
    - Adoption, retention, and monetization remain unproven publicly
  notes: The matrix separates mature execution surfaces from frontier modules because diligence quality differs sharply between them.
