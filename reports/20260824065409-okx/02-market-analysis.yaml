  evidenceGaps:
  - type: segmentation-gap
    severity: medium
    topic: exchange versus wallet user overlap
    missingEvidence: A disclosed split of OKX users, activity, and revenue by exchange, wallet, institutional, and API cohorts.
    whyItMatters: Without overlap data, investors cannot tell whether OKX has many distinct monetizable users or the same users counted across multiple product surfaces.
    diligencePath: Request cohort-level MAU, trading-volume, wallet-activity, and revenue contribution by product line over the last 8 quarters.
    relatedQuestionRefs:
    - QM025
  - type: market-sizing-gap
    severity: medium
    topic: U.S. serviceable market after phased relaunch
    missingEvidence: State-by-state product availability, customer migration counts from OKCoin, and expected timing for nationwide feature parity.
    whyItMatters: The U.S. can materially change long-run SAM, but only if the launched product set and licensing map are large enough.
    diligencePath: Obtain internal launch roadmap, regulatory approvals, and migration funnel metrics for the U.S. entity.
    relatedQuestionRefs:
    - QM022
  - type: market-sizing-gap
    severity: minor
    topic: off-exchange institutional flow
    missingEvidence: How much institutional crypto trading volume clears through OTC desks, prime brokers, or custodian-linked workflows instead of visible exchange order books.
    whyItMatters: Visible exchange market-share data may understate or misclassify the most profitable institutional segment.
    diligencePath: Request institutional volume split between lit order book, RFQ/block, and off-exchange collateral or custody-linked arrangements.
  - type: regulatory-gap
    severity: medium
    topic: jurisdiction-level exclusions and caps
    missingEvidence: A current matrix of where OKX can offer spot, derivatives, wallet, staking, and leverage, including limits such as EU leverage caps.
    whyItMatters: Serviceable market is constrained by product-level permissions, not just by whether a brand is “available” in a country.
    diligencePath: Ask for a jurisdiction-product matrix maintained by legal/compliance and reconcile it to public terms and local licenses.
  - type: revenue-gap
    severity: medium
    topic: derivatives monetization and take-rate durability
    missingEvidence: Segmented take rates for spot, perps, futures, options, staking, wallet routing, and institutional businesses.
    whyItMatters: Volume concentration is only attractive if the take rate and cost structure remain durable during risk-off quarters.
    diligencePath: Request quarterly product-line revenue, volume, direct costs, and churn/retention by high-value customer cohort.
