- id: sizing-the-market-through-multiple-lenses
  title: Sizing the market through multiple lenses
  body: |-
    The cleanest public sizing lens for OKX is gross exchange trading volume, but that lens needs qualification. TokenInsight put Q1 2026 exchange volume at $17.9 trillion while CoinGlass put it at $20.57 trillion. Both imply an annualized run-rate above $70 trillion, but they differ because exchange coverage, ranking cohorts, and measurement methods differ. CoinGecko’s 2025 spot-only study adds a useful lower-bound check: top-10 spot volume alone reached $18.7 trillion in 2025, yet spot is a minority of the market most relevant to OKX because derivatives represented about 82% of Q1 2026 activity and roughly 93% of OKX’s own volume mix in TokenInsight’s view.

    A second lens is the monetization pool rather than notional turnover. Business of Apps estimated crypto-exchange app revenue at $56 billion in 2024, which is far smaller than gross trading notional would suggest and therefore a better reminder of the economic ceiling for transaction-fee businesses. This is why the report preserves separate TAM frames: one for transaction volume, one for revenue, and a narrower serviceable lens based on where OKX is strongest—global derivatives, institutional execution, and wallet-connected users in jurisdictions where it can legally serve demand.
  claimRefs:
