tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to OKX
  rows:
  - - Centralized spot trading
    - Maker/taker fees on spot pairs; conversion and listing-related activity
    - Pure onchain swaps executed entirely outside OKX; hardware-wallet storage
    - Retail traders, market makers, treasury desks
    - Important but not the main economic engine for OKX
  - - Centralized derivatives
    - Perpetuals, futures, options, margin, liquidation and funding-linked activity
    - OTC bilateral derivatives not routed through the venue
    - Active traders, prop desks, hedgers, VIPs
    - Highest-value core market for OKX
  - - Wallet / Web3 routing
    - Swap spreads, staking participation, wallet engagement, partner distribution
    - Protocol-native activity that never touches OKX surfaces
    - Self-custody users, DeFi users, builders
    - Expands TAM beyond exchange-only users
  - - Institutional execution and collateral
    - RFQ, block trading, prime-style workflows, collateral mobility
    - Pure custody with no OKX execution or connectivity
    - Funds, corporates, HNWI/VIP, treasuries
    - High-value SAM with regulatory sensitivity
  - - Fiat on/off-ramp and regulated regional access
    - Deposits, withdrawals, regulated exchange use in served jurisdictions
    - Countries where OKX is restricted or unavailable
    - Mass retail, compliance-sensitive users
    - Key gating factor for serviceable market
  - - Onchain substitutes
    - User trading and collateral activity migrating to DEXs or protocols like Hyperliquid
    - Traditional brokerage volumes unrelated to digital assets
    - Crypto-native traders and builders
    - Substitute pressure on OKX, especially in derivatives
  notes: Boundary deliberately includes adjacent wallet and institutional workflows because OKX publicly markets them as part of one platform stack. Excluded spend captures activity that may grow crypto adoption overall without necessarily flowing through OKX economics.
