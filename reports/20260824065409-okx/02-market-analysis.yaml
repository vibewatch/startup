chapter:
  number: 2
  title: Market Analysis
  summary: OKX operates in a crypto-market stack where derivatives, stablecoins, regulation, and institutional custody matter more than broad “crypto adoption” headlines alone. The central sizing fact is that the exchange market is enormous in gross volume terms but far smaller in monetizable revenue terms, so volume and revenue lenses must be kept separate. Current market structure favors scaled venues with deep derivatives liquidity and growing regulated beachheads, which helps OKX in Europe and global institutional workflows. The main disrupters are still Binance at the top end and onchain derivatives venues such as Hyperliquid at the substitution edge.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: |-
    The relevant market for OKX is broader than a conventional retail-crypto-exchange definition. Official OKX surfaces and exchange databases show one product family spanning spot trading, perpetuals, futures, options, lending and earn products, institutional RFQ and block workflows, APIs, and a self-custody wallet that routes onchain activity across DEXs and liquidity pools. That means the company participates in both centralized exchange monetization and broader crypto-market infrastructure usage. A buyer can arrive through retail trading, but the same platform wants to retain that user for staking, wallet-based swaps, institutional execution, and treasury or collateral workflows.

    The practical substitutes are also broader than direct peer exchanges. Binance and Bybit compete head-on for globally active derivatives traders; Coinbase and Kraken capture trust-sensitive, fiat-linked, or domestically regulated flows; OTC desks and custodians disintermediate some institutional execution; and Hyperliquid demonstrates that onchain derivatives can now absorb meaningful flow that once had to clear on centralized venues. The important diligence conclusion is that OKX is not merely fighting for spot commissions. It is fighting for a share of a multi-product crypto operating stack whose status-quo alternatives range from broker apps to self-custody and DEX-native trading.
  claimRefs:
  - CM001
  - CM002
  - CM003
