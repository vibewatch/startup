- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - MiCA passporting
    - positive
    - near-term
    - Expands regulated EU/EEA serviceable market and reduces offshore-only discount
    - Quantify active EU user conversion under the Malta entity
  - - Institutionalization of large transfers
    - positive
    - near-term
    - Supports premium workflows in custody, collateral, and execution
    - Request institutional revenue mix by product
  - - Stablecoin-centered market structure
    - positive
    - ongoing
    - Keeps offshore exchange liquidity dense and portable
    - Measure how much OKX volume depends on USDT/USDC corridors
  - - Wallet + exchange convergence
    - positive
    - ongoing
    - Lets OKX cross-sell between custodial and self-custody experiences
    - Request overlap and conversion metrics between wallet and exchange
  - - U.S. phased re-entry
    - mixed
    - near-term
    - Opens future SAM but with narrower immediate feature set
    - Clarify state coverage, product scope, and user migration pace
  - - Compliance cost and jurisdictional exclusions
    - negative
    - ongoing
    - Raises fixed cost and shrinks serviceable market in restricted countries
    - Model compliance opex and country-level exclusions
  - - Leverage cyclicality
    - negative
    - cyclical
    - Because derivatives dominate, revenue and volumes can fall sharply in risk-off markets
    - Stress-test earnings under lower derivatives turnover
  - - DEX / onchain substitution
    - negative
    - medium-term
    - Hyperliquid and similar venues can siphon high-value derivatives flow
    - Track share loss or retention by advanced-trader cohort
  notes: 'Timing matters: some factors expand long-run TAM but have smaller immediate effect on monetization. Constraints are not reasons to reject the market; they are the terms on which volume becomes reliable revenue.'
