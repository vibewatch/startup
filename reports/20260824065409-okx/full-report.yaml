              OKX does not sell to one customer archetype. The public record shows at least five meaningful groups:
              retail spot buyers and sellers, high-frequency or derivatives-heavy active traders, institutional and VIP
              desks, self-custody wallet users, and partner-distributed or co-branded audiences reached through sports
              and embedded channels. In some surfaces the buyer, user, and payer are the same person; in
              others—especially institutional or embedded infrastructure—they split across treasury, trader, operations,
              and end-user roles.


              The geography is similarly segmented. Consumer pages market a global service footprint, while the U.S.,
              EEA, and Dubai launches show that actual customer access is increasingly packaged through region-specific
              entities and feature sets. This suggests OKX’s customer base is not just large but operationally
              heterogeneous, which helps scale but makes clean customer metrics harder to interpret.


              Another implication is that customer metrics are structurally messy. A regulated exchange account, a
              self-custody wallet install, a migrated OKCoin user, and an institution routing RFQs through a dedicated
              workflow can all be counted as “customers” in ordinary language while behaving very differently in
