  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and the jobs OKX tries to solve
        blocks:
          - type: paragraph
            body: >-
              OKX is best understood as a bundle of coordinated surfaces rather than a monolithic exchange. The
              centralized side covers spot, futures, options, RFQ, copy, bots, and yield products; the wallet side
              covers self-custody, DEX routing, staking, NFT and dApp access; the institutional side extends further
              into post-trade settlement, embedded exchange infrastructure, and API-driven execution. This matters
              because the product strategy is to keep users inside one brand even as they move between retail trading,
              professional execution, and onchain activity.


              That breadth is a real differentiator, but it also raises the usability bar. Several external reviews
              argue that OKX is most coherent when used by active traders, power users, or institutions that will
              actually exploit the workflow depth. Casual users still see a lot of surfaces, modes, and regional caveats
              to parse.


              A second implication is that OKX is trying to monetize customer progression, not only customer
              acquisition. A user can start with simple buy, move into advanced exchange workflows, then migrate into
              wallet-based swaps or staking without leaving the brand. That is strategically attractive because each
              handoff creates another chance to deepen retention, collect more trading activity, or shift the user
              toward higher-value surfaces like institutional tools and embedded rails.
