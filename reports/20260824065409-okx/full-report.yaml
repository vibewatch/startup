  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for OKX is unusually strong for a private crypto company. It appears to operate at
              genuine scale, with public estimates of roughly $1.5-1.9 billion of 2024 revenue, a top-tier derivatives
              position, meaningful wallet and institutional adjacencies, and active re-entry into the United States plus
              regulated packaging in Europe. Those are the ingredients of a global, multi-surface crypto platform rather
              than a cyclical niche exchange.


              The anti-thesis is equally clear. The company has a major legal scar, incomplete public financial
              disclosure, uncertain customer concentration, and a business model whose most attractive frontier modules
              are less proven than the core exchange. That means OKX may deserve a strategic premium to simple spot-only
              venues, but it also deserves a material opacity and legal-risk discount to the cleanest public-market
              multiples.


              A second way to say this is that OKX has already crossed the threshold where valuation arguments are
              mostly about quality and discount rate, not existence. Investors are no longer asking whether there is a
              business; they are asking how much of that business is durable, clean, and transferable across
              jurisdictions.
