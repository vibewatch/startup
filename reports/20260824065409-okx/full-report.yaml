      - number: '1.4'
        title: Brand scale, partnerships, and the unresolved facts that still matter
        blocks:
          - type: paragraph
            body: >-
              OKX's brand strategy suggests management wants the platform to be perceived as a mainstream global
              financial brand rather than only a crypto-native derivatives venue. The Manchester City and McLaren
              partnerships reach well beyond trading professionals, and both partner pages describe OKX as among the
              world's largest exchanges by trading volume. The U.S. News reprint of Reuters on the BlackRock-Standard
              Chartered collateral framework also shows OKX trying to move up-market institutionally by supporting
              tokenized Treasury collateral under third-party custody rather than forcing all assets onto the exchange.


              Operational trust signals exist, but they are mixed. CoinGecko and CoinMarketCap both show deep listings,
              large reserves, and strong daily volume. McLaren and OKX both emphasize monthly proof-of-reserves
              publication, and Hacken lists repeated OKX audit work. Yet Trustpilot captures persistent retail service
              friction, with a poor rating snapshot in early 2026 driven by complaints around support, account reviews,
              and withdrawal or dispute handling. CryptoSlate's 2026 review makes the same point in more measured form:
              globally, OKX looks strongest as a full trading venue, while domestically in the U.S. it remains a
              narrower regulated spot-and-wallet proposition.


              The remaining unknowns are exactly the ones later diligence should push hardest on: audited revenue, exact
              legal-entity map, board composition, the reconciliation among competing user and employee metrics, and the
              true economics of the regulated onshore entities relative to the offshore core. Chapter one can
              confidently establish that OKX is scaled, diversified, and increasingly regulated. It cannot yet prove
              that the group is simple, transparent, or easily underwritten like a public exchange operator.
            claimRefs:
