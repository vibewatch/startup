      - number: '6.3'
        title: Retention, satisfaction, and expansion risk
        blocks:
          - type: paragraph
            body: >-
              The public record is much weaker on durability than on acquisition. OKX does not disclose NRR, GRR, churn,
              renewal rates, or customer concentration, and that gap matters because the company serves very different
              cohorts with very different expected retention dynamics. Active derivatives traders and institutions may
              be sticky if execution quality is strong; casual retail users may be far more event-driven and
              price-sensitive; wallet users may stay only if OKX remains useful as an orchestration layer rather than
              just a bridge to external protocols.


              Third-party reviews point to the same split. Power users often praise breadth, liquidity, and advanced
              tooling, while complaints focus on support lag, compliance-driven freezes, and the cognitive overload of
              too many surfaces. The retention verdict is therefore mixed: OKX likely has strong repeat behavior in some
              cohorts, but public evidence is too thin to prove customer durability across the full stack.


              The best way to read the evidence is therefore asymmetrically. Assume customer reach is real because too
              many independent signals point in the same direction. Assume durability is only partly proven because the
              strongest public proofs come from advanced-user fit and brand traction, not from disclosed cohorts. And
              assume concentration could be either fine or problematic because the public record is effectively silent
              on heavy-user dependence.


              For diligence purposes, that means the right question is not whether OKX has customers. It clearly does.
              The harder question is which customer classes are durable enough to justify premium valuation assumptions,
              and which are simply transient traffic responding to market cycles, promotions, or event-driven
              speculation.
