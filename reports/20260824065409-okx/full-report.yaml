  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal overhang
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk at OKX remains regulatory and legal, not because the company is obviously
              non-compliant today, but because the public record proves it was materially non-compliant in the recent
              past. The DOJ plea and $505 million resolution establish a hard precedent: if OKX mismanages
              jurisdictional controls again, the downside is not hypothetical. The same lesson extends to Europe and
              Asia, where remediation, fines, licensing, and local product restrictions show the business is still
              operating under an unusually high regulatory burden for a private fintech.


              The good news is that OKX has shifted toward regional packaging, explicit restricted-jurisdiction rules,
              and public compliance language. The bad news is that these mitigations themselves create complexity,
              customer friction, and ongoing supervisory exposure. The legal risk is therefore reduced from crisis mode,
              but it is not retired.


              A useful way to frame this risk is path dependency. OKX no longer needs to be proven guilty of the exact
              same offense to suffer legal damage; it only needs to create a new fact pattern suggesting that regional
              controls, entity separation, or screening are not working as advertised. That threshold is much lower
              after a guilty plea than it is for a company with a clean record.
            claimRefs:
