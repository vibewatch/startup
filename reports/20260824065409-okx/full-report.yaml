  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, substitutes, and status quo'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is not one flat list. Direct peers are the venues that most resemble OKX’s own
              value proposition: Binance as the scale leader, Bybit as the closest global derivatives-and-Web3 rival,
              and Bitget as an increasingly broad offshore-style competitor. Coinbase and Kraken are better understood
              as incumbents for trust-sensitive or domestically regulated users because they optimize for a different
              job: compliant access, fiat convenience, and mainstream brand comfort. Robinhood is adjacent rather than
              direct, but it matters because a growing slice of casual U.S. investors may prefer a multi-asset retail
              account over a specialist exchange. Hyperliquid is the clearest substitute because it attacks one of OKX’s
              most valuable segments—advanced derivatives traders—without asking them to cede custody.


              Status quo and internal-build alternatives also matter. Institutions can split execution, custody,
              collateral, and treasury across multiple providers instead of choosing one exchange stack. Sophisticated
              traders can multi-home across several venues and route to whichever one offers the best liquidity or
              funding conditions in the moment. That means OKX does not compete only by being “better”; it competes by
              being valuable enough to consolidate behavior that the market has already learned how to fragment.
