companyProfile:
  summary: >
    OKX was founded in 2017 as OKEx and rebranded to OKX in 2022. It now operates as a multi-surface crypto platform
    spanning centralized spot and derivatives trading, institutional RFQ and embedded exchange infrastructure, a
    self-custody wallet with onchain routing and dApp access, staking and earn workflows, and region-specific regulated
    entities in the EEA, Dubai, and the United States. Public evidence suggests a very large private business with
    strong derivatives positioning, meaningful wallet and institutional optionality, and unusually detailed trust
    tooling such as proof of reserves and Web3 security telemetry — but also a major legal scar from the 2025 DOJ
    resolution and persistent opacity around capital, concentration, and product-line economics.
