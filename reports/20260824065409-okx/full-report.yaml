      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map splits into at least five meaningful groups. First are retail accumulators and casual
              traders who compare OKX against Coinbase, Kraken, or local exchanges based on trust, fiat convenience, and
              basic UX. Second are globally active derivatives traders—the highest-frequency cohort—who care most about
              liquidity, leverage, instrument breadth, fees, and execution quality, and who compare OKX directly with
              Binance, Bybit, Gate, Bitget, and increasingly Hyperliquid. Third are institutional and VIP clients using
              RFQ, block trading, prime-style execution, collateral mobility, and custody-sensitive workflows. Fourth
              are self-custody and Web3 users who may monetize indirectly through swaps, staking, and wallet engagement
              rather than centralized exchange fees. Fifth are developers, merchants, or embedded-finance builders that
              may touch OKX through wallet rails or APIs rather than through the exchange UI itself.


              These segments do not share the same budget owner or adoption trigger. Retail spend is fragmented across
              individuals. Institutional spend is budgeted by treasury, trading, or digital-asset teams. Wallet usage
              often begins with convenience or multichain access and only later becomes a revenue source. As a result,
              OKX’s market is best thought of as a layered funnel where only a subset of the global crypto owner base
              becomes high-value, regulated, and repeatable revenue for the full platform.
