      - number: '8.2'
        title: Valuation context, comparables, and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              The best public comp set is imperfect but usable. Coinbase is the cleanest directly relevant public
              comparable because it is a crypto-native exchange with large retail and institutional surfaces. Robinhood
              is less directly comparable because it is a broader retail brokerage with equity-market exposure, but its
              valuation is still helpful as an upper-bound signal for multi-product consumer-fintech optionality. The
              resulting multiples are wide: Coinbase’s August 2026 market cap versus TTM revenue implies a
              high-single-digit revenue multiple, while Robinhood trades far richer. Applying those multiples
              mechanically would be wrong; using them to frame a discounted private range is appropriate.


              My scenario logic therefore starts with public revenue proxies for OKX, then layers on risk discounts. The
              bear case assumes revenue is nearer the lower end of public estimates, legal-risk discount stays heavy,
              and frontier products do not earn much premium. The bull case assumes higher-quality institutional and
              wallet monetization plus evidence that the U.S. and EEA packaging improve durability rather than just
              cost. The base case sits between those poles and values OKX as a strong but opaque private platform.


              This is why scenario thinking matters more than point-estimate bravado. With a company like OKX, small
              changes in revenue-quality assumptions or risk discount can move fair value by many billions of dollars.
              The range is wide not because the business is imaginary, but because the information rights available to
              public observers are limited.
