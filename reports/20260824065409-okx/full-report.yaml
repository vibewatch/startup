      - number: '1.3'
        title: Regulatory turning points and onshore expansion
        blocks:
          - type: paragraph
            body: >-
              The most important company-overview fact is that OKX crossed from permissive offshore growth into forced
              regulatory normalization. The DOJ plea says U.S. users conducted more than $1 trillion of transactions on
              OKX between 2018 and early 2024, generating hundreds of millions of dollars of fees, while the platform
              failed to register as a money services business and let suspicious and illicit proceeds flow through the
              venue. The financial consequence was severe but survivable: more than $504 million in total penalties,
              comprised of roughly $420.3 million in forfeiture and $84.4 million in criminal fine. OKX's own response
              frames the matter as legacy compliance gaps, notes that no employee was charged, and says an external
              compliance consultant will remain through February 2027.


              That enforcement event did not end expansion; it reorganized it. On the same timeline, OKX has been
              building a regulated hub structure: a MiCA authorization in Malta for OKX Europe Limited, a VARA-licensed
              Dubai entity able to serve institutional, qualified, and retail investors, and a revived U.S. footprint
              with San Jose headquarters and a phased migration of OKCoin customers onto OKX. The Malta record is doubly
              important because it combines positive and negative evidence: OKX won authorization, but the company also
              disclosed a €1.054 million FIAU fine tied to historical AML/CFT shortcomings identified in a 2023 review.


              Not all jurisdictions have moved in OKX's favor. Thailand's SEC filed a criminal complaint in March 2025
              alleging OKX operated an unlicensed exchange and promoted Thai-language services while charging 0.1%
              trading fees. That means the broad regulatory narrative is not “problem solved,” but “partial onshore
              legitimation with ongoing country risk.” Investors can credibly say OKX now has meaningful regulated
              beachheads in Europe, Dubai, and the United States, yet must also accept that the platform still carries
              jurisdiction-by-jurisdiction enforcement exposure.
