  - TI002
  figureRefs:
  - FI001
- id: traction-and-unit-economics-proxies
  title: Public traction and unit-economics proxies
  body: |-
    The strongest public revenue read comes from Business of Apps, which estimated $1.9 billion of 2024 revenue, $6 trillion of 2024 transaction volume, and 2.5 million active users. Those are not audited company disclosures, but they are useful enough to derive a first-pass unit-economics frame. On that lens, the implied revenue yield on transacted volume is roughly 3.2 basis points, revenue per active user is about $760, and annual transaction volume per active user is about $2.4 million. Those numbers fit the intuition that exchange economics are a high-volume, low-take-rate business where a relatively small set of active users can drive large notional throughput.

    The DOJ record is an additional triangulation point. It states that U.S. customers executed more than $1 trillion on OKX between 2018 and early 2024 and that related forfeiture was about $421 million. That does not solve current revenue, but it does show the economic scale of even one disputed segment of the business. The public record is therefore good enough to support rough take-rate and activity proxies, while still falling well short of product-line revenue, gross margin, or retention disclosure.
  claimRefs:
