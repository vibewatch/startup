  evidenceGaps:
  - type: capital-gap
    severity: high
    topic: cash debt and runway
    missingEvidence: Current cash balance, debt, undrawn facilities, and monthly liquidity forecast by entity.
    whyItMatters: Without these numbers, capital adequacy cannot be underwritten like a public company.
    diligencePath: Request audited balance sheets, treasury dashboards, and debt schedules for the parent and regulated subsidiaries.
    relatedQuestionRefs:
    - QI023
  - type: mix-gap
    severity: high
    topic: product-line revenue mix
    missingEvidence: Revenue split among spot, derivatives, wallet, institutional, embedded, earn, and lending lines.
    whyItMatters: Revenue quality depends on which lines are durable, cyclical, or service-heavy.
    diligencePath: Request product-line revenue bridge for 2023-2026 with gross margin by line.
    relatedQuestionRefs:
    - QI024
  - type: unit-economics-gap
    severity: high
    topic: gross margin and payback
    missingEvidence: Gross margin, CAC, payback, cohort retention, and sales efficiency by segment.
    whyItMatters: These are core underwriting metrics for judging whether OKX deserves premium valuation multiples.
    diligencePath: Request cohort and margin dashboards used by management or the board.
    relatedQuestionRefs:
    - QI025
  - type: regulatory-gap
    severity: medium
    topic: trapped capital and reserve requirements
    missingEvidence: Entity-level capital rules, reserve requirements, and restrictions on moving funds across jurisdictions.
    whyItMatters: A global exchange can look cash-rich at the consolidated level while still facing local capital constraints.
    diligencePath: Request regulatory-capital memos and local operating-company balance sheets.
