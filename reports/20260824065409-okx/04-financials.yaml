    - OKX fee materials plus third-party memos
    - Derivatives likely drive revenue but net monetization is uncertain
  - - EU leverage up to 10x under MiCA entity
    - Regional monetization differs from global venue
    - Local caps and product availability vary by entity
    - CASP Tracker and OKX MiCA page
    - Regional regulation can lower volume but improve quality
  - - Institutional RFQ / Liquid Marketplace
    - Negotiated relationship economics
    - No public realized pricing
    - Official institutional pages
    - Could raise quality without obvious dashboard visibility
  - - Rubix embedded trading
    - Contract or platform-style economics implied
    - No public ACV or fee schedule
    - Official Rubix page
    - May be one of the cleaner non-retail monetization lines
  - - Wallet / onchain products
    - Likely usage, routing, or spread-based
    - No public line-item pricing or monetization split
    - Wallet page / Google Play / market narratives
    - Strategic value is clear; direct revenue still opaque
  notes: List pricing is not the same as realized pricing, and entity-level regulation changes the economic profile by region.
