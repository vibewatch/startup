company:
  name: OKX
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence supports OKX as a real, large, fee-generating exchange business, but not as a fully modelable one. The most supportable public 2024 revenue estimate is around $1.9 billion from Business of Apps, with low-confidence alternative estimates around the low-$1 billions and clear evidence that derivatives dominate volume and likely economics. Revenue quality looks better than that of a pure one-product exchange because OKX also monetizes institutional and wallet-adjacent workflows, yet underwriting still breaks on missing mix, margin, cash, debt, and entity-level balance-sheet disclosure. The financial verdict is therefore “credible but opaque”: enough scale to take seriously, not enough transparency to underwrite cleanly.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model, product mix, and pricing mechanics
  body: |-
    OKX is not a single-line revenue business. Official pages and exchange summaries show at least six monetizable layers: spot trading, perpetuals and futures, options, institutional RFQ and block workflows, wallet or DEX-linked activity, and embedded or partner-facing infrastructure such as Rubix. The institutional stack matters because it points to revenue sources with different quality than ordinary retail commissions: post-trade settlement, off-exchange custody partnerships, collateral-enabled trading, and embedded trading rails can create sticky business even when public dashboards only highlight trading volume. The wallet matters for a similar reason. Even if public sources do not isolate wallet revenue, OKX is clearly trying to capture more of the customer journey than matching-engine fees alone.

    Pricing, however, is easier to see than realized economics. OKX markets tiered maker/taker pricing and low baseline fees, but the public record does not reveal what percentage of volume clears on VIP terms, how rebates alter net monetization, or how regulated entities change pricing and leverage economics. The result is a familiar exchange paradox: the revenue engine is easy to describe conceptually and hard to quantify precisely.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI015
  - CI016
  - CI031
  - CI032
