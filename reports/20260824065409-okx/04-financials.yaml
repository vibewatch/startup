- id: cost-structure-and-capital-adequacy
  title: Cost structure, capital adequacy, and legal overhang
  body: |-
    Cost visibility is much weaker than demand visibility. Public evidence clearly points to meaningful expense buckets: compliance teams, security reviews, institutional support, local-market hiring, and legal or licensing overhead. The company’s own post-DOJ statement highlighted a 150+ person financial-crime and blockchain-intelligence team, while third-party headcount estimates imply a far larger global operating footprint. That combination suggests an exchange business that is not capital-light in the simplistic software sense; rather, it likely combines good gross economics on flow with large fixed-cost obligations in compliance, risk, and support.

    Capital adequacy is the hardest area to underwrite. CoinGecko reserves and CoinGlass user-asset data tell us the platform holds or intermediates large customer balances, but those figures are not the same as free cash, equity capital, or runway. The DOJ penalty was significant yet evidently survivable, and onshore expansion in Europe and the United States continued. Still, none of the retained public sources disclose OKX cash, debt, regulatory reserve obligations, or intercompany transfers. That means the company may be financially strong, but the public record cannot prove it with balance-sheet precision.
