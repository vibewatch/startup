- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue split by product and entity
    - Cannot tell how much economics come from perps versus wallet or embedded lines
    - Request audited revenue bridge by product, region, and legal entity
  - - Gross margin by line
    - Cannot distinguish software-like economics from service-heavy or compliance-heavy delivery
    - Request gross margin by product family and support burden
  - - Cash, debt, and runway
    - Cannot assess solvency or shock absorption directly
    - Request current balance sheet, debt schedule, and monthly liquidity forecast
  - - Regulatory capital obligations
    - Cannot model entity-level trapped capital or reserve requirements
    - Request regulated-entity capital and reserve framework by jurisdiction
  - - Customer concentration
    - Institutional quality could mask concentration risk
    - Request top-10 customer / venue / partner contribution to revenue
  - - Retention and cohort monetization
    - Cannot validate stickiness or payback
    - Request cohort retention, reactivation, and share-of-wallet data
  - - Wallet and non-trading revenue
    - Cannot tell whether OKX is diversifying successfully beyond exchange fees
    - Request wallet, staking, lending, and embedded-revenue line items
  - - Working capital and capex
    - Cannot model cash conversion or infrastructure intensity
    - Request capex, custody/treasury, and infrastructure spend history
  notes: These are the exact items that prevent OKX from being modeled like a public exchange operator today.
