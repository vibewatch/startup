- id: verdict-and-diligence-blockers
  title: Financial verdict and the limits of the public record
  body: |-
    My financial verdict is that OKX looks like a large, credible, and probably self-sustaining private exchange operator, but one whose true margin quality and capital structure are still opaque. The company almost certainly has real scale: public estimates place revenue in at least the low billions, and both market-share reports and the DOJ record support substantial throughput. It also likely has better revenue quality than a pure spot venue because institutional, embedded, and wallet-linked workflows can deepen monetization beyond retail commissions.

    The underwriting blockers are specific. Public sources do not break out revenue by line. They do not provide audited gross margin or cash flow. They do not disclose cash, debt, or runway. And they do not let analysts distinguish customer reserves from corporate liquidity. As a result, later valuation work can use public ranges and comp logic, but any real investment-grade view would require a data room with product-line revenue, take rates, gross margins, entity-level balance sheets, debt terms, and regulatory capital obligations.
  claimRefs:
  - CI025
  - CI026
  - CI027
