tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Spot trading fees
    - Maker/taker commissions on spot pairs
    - bps on notional
    - Public fee schedule visible; realized mix unknown
    - Recurring but lower-value than derivatives
    - Provide volume and net take rate by customer tier
  - - Perpetuals / futures / options
    - Commissions, spreads, funding-linked activity, leverage workflows
    - bps on notional / contract activity
    - Likely dominant revenue pool given derivatives-heavy volume mix
    - High-volume and potentially high-quality, but cyclical
    - Provide revenue split and direct margin by derivative product
  - - Institutional RFQ / block / OTC-like workflows
    - RFQ execution, post-trade settlement, collateral-linked activity
    - Per trade / workflow / relationship economics
    - Clearly marketed, not separately disclosed
    - Potentially sticky and higher-value than retail spot
    - Break out institutional revenue and client concentration
  - - Embedded trading and partner infrastructure
    - Rubix / APIs / branded front-end enablement
    - Contract / platform fee / usage fee
    - Publicly marketed as new revenue stream
    - Could improve quality if contracted
    - Disclose signed customers, ACV, and support burden
  - - Wallet / DEX / staking adjacency
    - Routing, swaps, staking, wallet-linked monetization
    - Usage-based / spread / incentive economics
    - Public capability clear, revenue opaque
    - Strategically important but financially under-disclosed
    - Provide wallet revenue, swap margins, and conversion metrics
  - - Earn / lending / margin products
    - Interest spread or program fees
    - APR / spread / borrow usage
    - Product category visible, economics undisclosed
    - Can diversify revenue but may add balance-sheet risk
    - Provide balances, net interest spread, and loss experience
  notes: Rows separate transaction-fee engines from institutional and wallet-adjacent lines because revenue quality likely differs materially across them.
