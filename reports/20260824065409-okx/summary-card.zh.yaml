  topStrengths:
    - 市场份额来源、强势衍生品根基，以及覆盖交易所、钱包和机构 rails 的多面产品栈，支撑 OKX 的全球一线加密 franchise 地位。
    - 受监管的 U.S./EEA 扩张、自托管钱包宽度、机构 RFQ 和嵌入式基础设施，以及以储备证明为核心的信任工具，带来有分量的战略可选性。
    - 运营证据强于许多私有加密公司：真实用户规模、大体量平台资产、月度储备报告、审计，以及罕见细致的 H1 2026 Web3 安全 / 风险遥测。
  topRisks:
    - 2025 年 DOJ 认罪与和解仍是核心法律伤疤，足以支持 OKX 相对最干净上市可比公司的长期折价。
    - 公开财务仍严重不透明：没有经审计公司财务、没有实体层面现金 / 债务披露、看不到产品线利润率，也没有客户集中度披露。
    - 即便整体交易量仍大，地区碎片化、合规摩擦和支持质量也可能侵蚀客户持久性或压缩利润率。
  unresolvedGaps:
    - 全球架构下实体层面的资本、受限现金、债务和储备义务。
    - 现货、衍生品、钱包、机构和嵌入式业务线的收入结构、毛利率和变现质量。
    - 客户集中度、入金账户留存，以及钱包到交易所交叉销售的持久性。
    - 2025 年 DOJ 解决之后的当前监管沟通、监督人状态，以及任何未解决的本地司法辖区行动。
    - 钱包、Earn 和嵌入式基础设施等前沿模块究竟能否支撑溢价倍数，还是主要增加复杂度。
