  topStrengths:
    - "Top-tier global crypto franchise position supported by market-share sources, strong derivatives footing, and a multi-surface product stack spanning exchange, wallet, and institutional rails."
    - "Meaningful strategic optionality from regulated U.S./EEA expansion, self-custody wallet breadth, institutional RFQ and embedded infrastructure, and proof-of-reserves-led trust tooling."
    - "Operational evidence is stronger than for many private crypto companies: real user scale, large platform assets, monthly reserve reporting, audits, and unusually detailed H1 2026 Web3 security/risk telemetry."
  topRisks:
    - "2025 DOJ plea and settlement remain the central legal scar and justify a durable discount versus the cleanest public comparables."
    - "Public financial opacity is still severe: no audited company financials, no entity-level cash/debt disclosure, no product-line margin visibility, and no customer concentration disclosure."
    - "Regional fragmentation, compliance friction, and support quality could erode customer durability or compress margins even if overall volume remains large."
  unresolvedGaps:
    - "Entity-level capital, trapped cash, debt, and reserve obligations across the global structure."
    - "Revenue mix, gross margin, and monetization quality across spot, derivatives, wallet, institutional, and embedded lines."
    - "Customer concentration, funded-account retention, and wallet-to-exchange cross-sell durability."
    - "Current regulator dialogue, monitor status, and any unresolved local-jurisdiction actions after the 2025 DOJ resolution."
    - "Whether frontier modules like wallet, earn, and embedded infrastructure justify a premium multiple or mainly add complexity."
