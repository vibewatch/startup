companyProfile:
  summary: >
    OKX was founded in 2017 as OKEx and rebranded to OKX in 2022. It now
    operates as a multi-surface crypto platform spanning centralized spot and
    derivatives trading, institutional RFQ and embedded exchange
    infrastructure, a self-custody wallet with onchain routing and dApp access,
    staking and earn workflows, and region-specific regulated entities in the
    EEA, Dubai, and the United States. Public evidence suggests a very large
    private business with strong derivatives positioning, meaningful wallet and
    institutional optionality, and unusually detailed trust tooling such as
    proof of reserves and Web3 security telemetry — but also a major legal scar
    from the 2025 DOJ resolution and persistent opacity around capital,
    concentration, and product-line economics.
  foundedDate: "2017-01-01"
  founders:
    - name: Star Xu
      role: Founder
      background: >
        Chinese entrepreneur who founded OKEx in 2017 and remained the central
        public founder figure through the OKX rebrand and global expansion.
      claimRefs: [CO001, CO011]
  foundingLocation: China / Hong Kong ecosystem origins
  headquarters: Seychelles
  productSummary: >
    OKX sells access to crypto market infrastructure: spot trading,
    perpetuals/futures/options, institutional RFQ and post-trade workflows,
    self-custody wallet and DEX routing, staking and earn products, and partner
    infrastructure such as Rubix and Liquid Marketplace.
  customerFocus: >
    Global retail traders, advanced derivatives users, institutions and VIPs,
    self-custody wallet users, and partner-distributed end users in approved
    jurisdictions.
  businessModel: >
    Primarily transaction and spread economics from spot and derivatives trading,
    supplemented by institutional workflows, wallet-adjacent monetization, earn
    products, and embedded infrastructure. Exact product-line mix is not
    publicly disclosed.
  stage: Late-Stage Private / pre-liquidity
  fundingStatus: >
    No traditional VC-round history was central to the company narrative;
    current valuation framing is inferred from revenue scale, public comp logic,
    regulatory durability, and strategic optionality rather than a clean recent
    priced round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO035, CI001, CI005, CE001, CE014, CU001, CV002]
summary:
  headline: >
    OKX is a scaled and strategically important private crypto platform whose
    operational breadth justifies serious attention, but whose legal history and
    financial opacity still argue for price discipline and deeper diligence
    before paying a premium valuation.
