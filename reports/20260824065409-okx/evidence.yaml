evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current public or company-provided board roster and governance map across OKX group entities.
    whyItMatters: >-
      Board composition, control rights, and committee structure determine whether compliance expansion is matched by
      governance discipline.
    diligencePath: >-
      Request board lists, committee charters, and entity-level director rosters for Aux Cayes, OKX Europe, Dubai, and
      U.S. entities.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-certified current employee count with regional split and compliance-headcount share.
    whyItMatters: >-
      Public headcount estimates diverge by thousands of employees, which affects operating-cost and execution-capacity
      analysis.
    diligencePath: >-
      Request current org chart, total FTE count, and regional employment split, including the exact compliance
      organization size.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Audited 2024 and 2025 revenue, fee take rate, and segment mix across spot, derivatives, wallet, and institutional
      products.
    whyItMatters: >-
      Third-party revenue estimates vary widely and directly affect valuation, profitability, and legal-overhang
      analysis.
    diligencePath: >-
      Request audited financial statements, management accounts, and a segment bridge tying volumes to recognized
      revenue.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Current primary or secondary transaction data that supports a precise private valuation for the corporate group
      rather than only the OKB token or rough exchange multiples.
    whyItMatters: Without recent transaction evidence, valuation claims risk being narrative-driven instead of underwritten.
    diligencePath: >-
      Request cap table, recent share transfers, any financing documents, and banker materials used for internal
      valuation work.
    relatedQuestionRefs:
      - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone coverage
    missingEvidence: >-
      A complete dated chronology for all licensing, partnership, product, and governance events across every OKX entity
      and region.
    whyItMatters: >-
      The public record is good enough for major milestones but still incomplete for a definitive chronology of every
      operational expansion and legal event.
    diligencePath: >-
      Request an internal corporate timeline by entity and geography, then reconcile it to public announcements and
      regulatory filings.
    relatedTableRefs:
      - TO004
  - type: segmentation-gap
    severity: medium
    topic: exchange versus wallet user overlap
    missingEvidence: A disclosed split of OKX users, activity, and revenue by exchange, wallet, institutional, and API cohorts.
    whyItMatters: >-
      Without overlap data, investors cannot tell whether OKX has many distinct monetizable users or the same users
      counted across multiple product surfaces.
    diligencePath: >-
      Request cohort-level MAU, trading-volume, wallet-activity, and revenue contribution by product line over the last
      8 quarters.
    relatedQuestionRefs:
      - QM025
  - type: market-sizing-gap
    severity: medium
    topic: U.S. serviceable market after phased relaunch
    missingEvidence: >-
      State-by-state product availability, customer migration counts from OKCoin, and expected timing for nationwide
      feature parity.
    whyItMatters: >-
      The U.S. can materially change long-run SAM, but only if the launched product set and licensing map are large
      enough.
    diligencePath: Obtain internal launch roadmap, regulatory approvals, and migration funnel metrics for the U.S. entity.
    relatedQuestionRefs:
      - QM022
  - type: market-sizing-gap
    severity: minor
    topic: off-exchange institutional flow
    missingEvidence: >-
      How much institutional crypto trading volume clears through OTC desks, prime brokers, or custodian-linked
      workflows instead of visible exchange order books.
    whyItMatters: Visible exchange market-share data may understate or misclassify the most profitable institutional segment.
    diligencePath: >-
      Request institutional volume split between lit order book, RFQ/block, and off-exchange collateral or
      custody-linked arrangements.
  - type: regulatory-gap
    severity: medium
    topic: jurisdiction-level exclusions and caps
    missingEvidence: >-
      A current matrix of where OKX can offer spot, derivatives, wallet, staking, and leverage, including limits such as
      EU leverage caps.
    whyItMatters: >-
      Serviceable market is constrained by product-level permissions, not just by whether a brand is “available” in a
      country.
    diligencePath: >-
      Ask for a jurisdiction-product matrix maintained by legal/compliance and reconcile it to public terms and local
      licenses.
  - type: revenue-gap
    severity: medium
    topic: derivatives monetization and take-rate durability
