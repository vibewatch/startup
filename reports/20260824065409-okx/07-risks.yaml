  evidenceGaps:
  - type: capital-gap
    severity: high
    topic: entity-level capital and liquidity
    missingEvidence: No public disclosure of cash, debt, trapped capital, or intercompany transfer flexibility by regulated entity.
    whyItMatters: A global platform can look healthy in aggregate while local entities remain constrained.
    diligencePath: Request entity-level balance sheets, capital policies, and regulatory reserve obligations.
    relatedQuestionRefs:
    - QR019
    - QR022
    - QR029
    - QR030
    relatedTableRefs:
    - TR005
  - type: concentration-gap
    severity: high
    topic: customer concentration and heavy-trader exposure
    missingEvidence: No public top-customer share of volume, revenue, or institutional dependence.
    whyItMatters: Concentration can make revenue quality much worse than top-line volume suggests.
    diligencePath: Request top-10 / top-50 exposure by volume, revenue, and deposits.
    relatedQuestionRefs:
    - QR021
    - QR029
    - QR030
    relatedFigureRefs:
    - FR002
  - type: operations-gap
    severity: medium
    topic: support and false-positive rates
    missingEvidence: No published SLA, backlog, false-positive, or freeze-duration metrics for support and compliance review operations.
    whyItMatters: Customer trust depends on how often controls accidentally harm legitimate users.
    diligencePath: Request support and compliance operations dashboards plus incident postmortems.
    relatedQuestionRefs:
    - QR011
    - QR017
    - QR018
    - QR029
    relatedTableRefs:
    - TR002
    - TR004
  - type: product-gap
    severity: medium
    topic: frontier module control readiness
    missingEvidence: No consistent public metrics show how ready wallet, DEX, Outcomes, or other frontier modules are before scale-up.
    whyItMatters: Fast product expansion can outrun control systems.
    diligencePath: Request launch review templates, control checklists, and go/no-go governance artifacts for new modules.
    relatedQuestionRefs:
    - QR008
    - QR026
    - QR030
    relatedTableRefs:
    - TR002
  - type: regulatory-enumeration-gap
    severity: medium
    topic: Regulatory / legal risk register coverage
    missingEvidence: The public record likely omits additional local investigations, licensing conditions, or jurisdiction-specific restrictions beyond the highest-severity cases listed in TR001.
    whyItMatters: A severity-ranked legal register is decision-useful, but it is not exhaustive and may hide tail-risk jurisdictions.
    diligencePath: Request a full legal and regulatory inventory by entity, market, regulator, and product surface.
