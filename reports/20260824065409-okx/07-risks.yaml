chapter:
  number: 7
  title: Risks
  summary: 'OKX’s risk profile is investable but dense. The company has already absorbed one of the most serious enforcement events in crypto exchange history, continues to operate under rising multi-jurisdiction regulation, and runs a product stack exposed to cyber threats, support failures, partner dependencies, and opaque customer concentration. At the same time, the public record shows unusually strong mitigation effort—monthly proof of reserves, formal compliance disclosures, regional packaging, audits, and detailed H1 2026 wallet-risk telemetry. The risk verdict is therefore not “too risky to touch,” but “too complex to underwrite lazily”: any investment thesis must watch for renewed enforcement, product shutdowns, capital-fragmentation surprises, or evidence that support and compliance friction are harming trust faster than OKX can control it.'
sections:
- id: regulatory-and-legal-overhang
  title: Regulatory and legal overhang
  body: |-
    The highest-severity risk at OKX remains regulatory and legal, not because the company is obviously non-compliant today, but because the public record proves it was materially non-compliant in the recent past. The DOJ plea and $505 million resolution establish a hard precedent: if OKX mismanages jurisdictional controls again, the downside is not hypothetical. The same lesson extends to Europe and Asia, where remediation, fines, licensing, and local product restrictions show the business is still operating under an unusually high regulatory burden for a private fintech.

    The good news is that OKX has shifted toward regional packaging, explicit restricted-jurisdiction rules, and public compliance language. The bad news is that these mitigations themselves create complexity, customer friction, and ongoing supervisory exposure. The legal risk is therefore reduced from crisis mode, but it is not retired.

    A useful way to frame this risk is path dependency. OKX no longer needs to be proven guilty of the exact same offense to suffer legal damage; it only needs to create a new fact pattern suggesting that regional controls, entity separation, or screening are not working as advertised. That threshold is much lower after a guilty plea than it is for a company with a clean record.
