- id: model-risk-mitigations-and-kill-criteria
  title: Model risk, mitigations, and kill criteria
  body: |-
    The hardest risks to model are the ones the public record does not quantify. OKX does not disclose top-customer concentration, audited cash and debt, entity-level capital constraints, support SLA distributions, or wallet-to-exchange cohort retention. That means the residual risk is not only what is visible, but also what remains unmeasured. For a business this large, hidden concentration or trapped-capital dynamics could matter more than incremental headline share shifts.

    Mitigations are still meaningful. Proof of reserves, Protect, KYC and sanctions screening, risk telemetry, audits, and region-specific legal entities all suggest a company actively reducing fragility. But an investor should only give these controls full credit if monitorable triggers keep improving. The right posture is conditional confidence: hold the thesis while compliance, uptime, reserve credibility, and customer trust remain intact; cut the thesis quickly if one of those pillars breaks.

    That conditional mindset matters because crypto exchanges often fail at the seams between categories: legal rules meet product decisions, customer support meets fraud controls, or capital structure meets local regulation. OKX has enough scale and enough mitigation infrastructure to stay credible, but not enough public disclosure to justify blind trust. That gap between visible controls and invisible outcomes is the central underwriting problem.
