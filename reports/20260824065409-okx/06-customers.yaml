- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Retail spot / convert users
    - Usually same person
    - Buy, sell, convert, simple portfolio use
    - Mass consumer app distribution and user-count claims
    - Large top-of-funnel; fee-bearing but price-sensitive
    - No segment revenue split
  - - Advanced traders / derivatives users
    - Usually same person or small trading team
    - Order-book trading, leverage, bots, copy, advanced tools
    - Exchange review and institutional positioning
    - Potentially high activity and sticky workflow depth
    - No retention or take-rate disclosure by cohort
  - - Institutional / VIP desks
    - Treasury, trader, ops, risk, payer may differ
    - RFQ, block execution, custody-linked workflows
    - Dedicated institutional product surface
    - Likely higher LTV and lower churn if integrated
    - No customer logos, concentration, or contract metrics
  - - Self-custody wallet users
    - Usually same person
    - Store, swap, stake, bridge, dApp access
    - Wallet guides and Web3 homepage
    - Strategic cross-sell and brand moat beyond custodial exchange
    - Unknown conversion from wallet to monetized surfaces
  - - Partner / co-branded audiences
    - Partner brand, partner user, OKX backend or sponsor
    - Awareness, activation, embedded or co-marketed flows
    - Manchester City and McLaren proofs
    - Can expand reach and trust at scale
    - Revenue linkage is weak publicly
  - - Regulated regional cohorts
    - Users filtered by jurisdiction and entity
    - Use region-specific licensed product subset
    - US, EEA, Dubai packaging
    - Can unlock regulated demand and trust
    - Feature set differs by region, muddying apples-to-apples metrics
  notes: 'The segment map separates surface area from monetization clarity: OKX has broad reach, but public revenue visibility by customer type is thin.'
