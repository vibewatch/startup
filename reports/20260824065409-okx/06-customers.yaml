- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Exchange to wallet cross-sell
    - Unknown share of users who ever activate wallet or earn
    - Could deepen retention and monetization if real
    - Request funnel from funded exchange account to wallet, earn, API, and partner products
  - - Regional regulated expansion
    - Feature fragmentation and compliance cost by geography
    - Can slow conversion or create apples-to-oranges metrics
    - Request user counts, ARPU, and activation by region and licensed entity
  - - Institutional growth
    - Unknown dependence on a small number of high-volume traders
    - High if a few desks drive large revenue share
    - Request top-10 customer share of volume and revenue
  - - Sports and brand partnerships
    - Awareness may not translate into funded trading activity
    - Can overstate real customer traction
    - Request attributable signups, funded accounts, and CAC by partnership
  - - Support and compliance operations
    - Freezes, reviews, and slow support may increase churn
    - Can damage trust in sensitive cohorts
    - Request support SLAs, freeze reasons, and complaint-resolution metrics
  notes: The biggest customer risks are not demand absence but missing visibility into which cohorts stick, expand, and generate most of the economics.
