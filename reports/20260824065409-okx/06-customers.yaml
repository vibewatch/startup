  - type: concentration-gap
    severity: high
    topic: customer concentration
    missingEvidence: No disclosure of top-customer share of trading volume, revenue, or institutional dependence.
    whyItMatters: A large exchange can still be economically concentrated if a small number of heavy traders drive activity.
    diligencePath: Request top-10 and top-50 customer concentration by revenue, volume, and deposits.
