chapter:
  number: 6
  title: Customers
  summary: 'OKX appears to have one of the broadest customer surfaces in private fintech: retail spot buyers, power derivatives traders, self-custody wallet users, institutional desks, and partner-distributed end users all sit inside the same brand orbit. Public adoption evidence is strong at the top of the funnel—tens of millions of users, large app distribution, and visible global partnerships—but weak at the bottom of the funnel, where retention, customer concentration, and module-level monetization are largely undisclosed. The customer story is therefore wide and credible, but not deeply underwritten: OKX clearly acquires global attention and active usage, yet the durability economics by segment remain mostly opaque.'
sections:
- id: segment-mix-and-global-footprint
  title: Customer segments and global footprint
  body: |-
    OKX does not sell to one customer archetype. The public record shows at least five meaningful groups: retail spot buyers and sellers, high-frequency or derivatives-heavy active traders, institutional and VIP desks, self-custody wallet users, and partner-distributed or co-branded audiences reached through sports and embedded channels. In some surfaces the buyer, user, and payer are the same person; in others—especially institutional or embedded infrastructure—they split across treasury, trader, operations, and end-user roles.

    The geography is similarly segmented. Consumer pages market a global service footprint, while the U.S., EEA, and Dubai launches show that actual customer access is increasingly packaged through region-specific entities and feature sets. This suggests OKX’s customer base is not just large but operationally heterogeneous, which helps scale but makes clean customer metrics harder to interpret.

    Another implication is that customer metrics are structurally messy. A regulated exchange account, a self-custody wallet install, a migrated OKCoin user, and an institution routing RFQs through a dedicated workflow can all be counted as “customers” in ordinary language while behaving very differently in economics and retention. That ambiguity does not negate the scale story, but it does make headline user numbers less decision-useful than they first appear.
