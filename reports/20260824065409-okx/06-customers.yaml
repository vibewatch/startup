    severity: high
    topic: customer durability metrics
    missingEvidence: No public NRR, GRR, churn, cohort retention, contract duration, or renewal metrics by segment.
    whyItMatters: Without durability metrics, customer quality cannot be separated from gross acquisition scale.
    diligencePath: Request cohort dashboards by segment, geography, and product surface including funded-account retention and wallet activity.
