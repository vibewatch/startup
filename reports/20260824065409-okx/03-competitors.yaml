- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / unit / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - OKX
    - Spot starts around 0.08% maker / 0.10% taker
    - Spot, perps, futures, options, wallet, RFQ, DEX balance routing
    - Realized pricing by VIP tier not public here
    - Competitive pricing helps acquire traders but does not itself differentiate
  - - Bybit
    - Spot 0.10%; derivatives 0.06% taker / 0.01% maker for non-VIP
    - Spot, derivatives, options, Web3-adjacent stack
    - VIP tiers tighten further
    - Near-parity with OKX limits fee-based moat
  - - Coinbase
    - Maker 0.00%-0.40%; taker 0.05%-0.60% depending on 30-day volume
    - Retail app, advanced trade, stocks and institutional surfaces
    - Higher trust-oriented packaging; tier complexity
    - Charges a premium for trust, domestic comfort, and broader consumer bundle
  - - Kraken
    - Maker 0.00%-0.16%; taker 0.10%-0.26% on Kraken Pro
    - Spot, staking, margin, futures, support-heavy retail tools
    - Different product-specific fee schedules exist
    - Not the cheapest venue, but price is part of a broader trust-and-support package
  - - Bitget
    - Packaging emphasizes one account across crypto and non-crypto assets
    - Crypto, stocks, gold CFDs, forex, AI assistant framing
    - Precise comparable fee grid not retained here
    - Broader packaging can matter more than a few bps for casual users
  - - Hyperliquid
    - Different economics tied to onchain venue design rather than classic CEX maker/taker narrative
    - Non-custodial trading across crypto and other markets
    - Direct fee comparability is imperfect on retained evidence
    - Architecture can differentiate even when classical fee tables do not
  notes: List pricing and marketing packaging are easier to observe than realized net pricing. The table focuses on what public buyers can actually compare before negotiating VIP terms.
