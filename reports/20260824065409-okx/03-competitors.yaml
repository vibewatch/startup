  - Limitation
  rows:
  - - Binance
    - Direct peer / scale leader
    - 280M+ users; 39.2% 2025 spot share; 32.77% Q1 2026 total share
    - Global active traders, mass retail, institutions
    - Deepest scale, broad ecosystem, low-fee packaging
    - Regulatory baggage; still a large share gap others must explain
  - - Bybit
    - Direct peer
    - 60M+ users; major derivatives venue
    - Global active traders and Web3-aware users
    - Very close product adjacency to OKX; strong derivatives and options surface
    - Less public-regulatory comfort than Coinbase/Kraken
  - - Bitget
    - Direct peer / adjacent broadener
    - Top-5 Q1 2026 share; multi-asset UEX narrative
    - Retail traders seeking broader account scope
    - Crypto + stocks + gold + forex framing; reserve marketing
    - Weaker proof of institutional breadth than OKX or Binance
  - - Coinbase
    - Incumbent regulated competitor
    - $49.2B market cap; $6.56B TTM revenue
    - Mainstream retail, institutions, U.S.-centric users
    - Trust, public-company disclosure, stocks, broad domestic familiarity
    - Higher pricing; narrower high-leverage offshore-style offer
  - - Kraken
    - Incumbent regulated competitor
    - 13M+ users; 7 fiat currencies
    - Security- and support-sensitive retail / semi-pro users
    - Support, security posture, fiat breadth, staking
    - Less scale and consumer distribution than Coinbase/Binance
  - - Hyperliquid
    - Substitute / onchain entrant
    - Top-10 derivatives venue by volume and OI
    - Advanced onchain derivatives traders
    - Non-custodial execution, fast chain, transparent onchain structure
    - Different UX and trust model may not fit mainstream retail
  - - Robinhood
    - Adjacent substitute
    - $97.21B market cap; $4.61B TTM revenue
    - U.S. casual investors and multi-asset retail users
    - Large consumer distribution and simple unified account
    - Not a like-for-like global crypto-derivatives platform
  notes: Table separates direct peers from incumbents, substitutes, and adjacents because buyers do not evaluate them through the same lens.
