- id: capability-pricing-and-switching-costs
  title: Capability breadth, pricing, and switching-cost reality
  body: |-
    Capability breadth does not map cleanly to pricing power. OKX has credible breadth across derivatives, options, wallet, DEX routing, RFQ, APIs, and regulated expansion, but most direct peers now offer enough surface area that buyers can multi-home without losing core functionality. Fees make this clearer. OKX’s headline 0.08%/0.10% spot pricing is attractive, yet Bybit’s schedule is close enough that price alone is not a moat. Coinbase and Kraken charge more, but they are selling trust, fiat convenience, support, and domestic confidence rather than just best-execution pricing. Bitget and Robinhood are broadening the battleground further by wrapping crypto inside larger accounts that aim to keep consumers from opening a second specialist relationship at all.

    The practical switching-cost conclusion is that power-user lock-in is moderate. Capital can move, APIs can be rebuilt, and traders routinely maintain several exchange accounts. Still, retention friction is real in VIP tiers, sub-accounts, wallet habits, and institutional workflow integration. In other words, OKX can defend users once embedded, but it cannot assume proprietary captivity the way some software companies can.
