company:
  name: OKX
chapter:
  number: 1
  title: Company Overview
  summary: 'OKX is a globally scaled crypto exchange and Web3 platform whose public record is strongest on product breadth, derivatives scale, and 2025-2026 compliance milestones rather than on audited financial disclosure. The core identity facts are clear: Star Xu founded the OKCoin/OKEx lineage, the exchange brand launched in 2017 and rebranded to OKX in 2022, and the operating footprint now spans Seychelles legal entities with onshore hubs in Malta, Dubai, Singapore, and San Jose. The biggest diligence carry-forwards are inconsistent third-party user and headcount counts, legal-entity sprawl, and a regulatory history that is now partly a moat and partly an unresolved risk.'
sections:
- id: identity-and-platform-scope
  title: Identity, platform scope, and operating footprint
  body: "OKX should be understood as a branded group rather than a single neatly disclosed operating company. The February 2025 DOJ plea identifies Aux Cayes FinTech Co. Ltd., a Seychelles-based entity, as the operator of OKX and its predecessor OKEx, while CoinMarketCap and OKX's own current surfaces describe a broader operating footprint spanning exchange, wallet, institutional, and Web3 services. The exchange lineage runs from Star Xu's 2013 OKCoin foundation to the 2017 launch of OKEx and the 2022 rebrand to OKX, giving the platform a longer operating history than many post-2020 crypto upstarts.\n\nProduct breadth is unusually broad even by large-exchange standards. OKX's about page, institutional surface, wallet homepage, and API documentation together show a stack that spans spot trading, perpetuals, futures, options, DeFi routing, staking and earn products, OTC and RFQ workflows, programmatic trading, and a non-custodial wallet. The Web3 side is not merely a marketing adjunct: OKX\
    \ Wallet markets 130+ native chains, 1,000 sub-accounts, DEX routing across 100+ liquidity pools, and an onchain analytics layer, while the institutional surface markets 700+ pairs, 900+ instruments, and $40T+ total traded. In practice that means OKX is selling both a high-frequency exchange and a broader crypto operating environment.\n\nGeographically, the public record supports a hybrid model of offshore legal entities plus increasingly onshore regional hubs. OKX's public about page says it serves millions of users in over 100 countries, the institutional page markets 71M+ users worldwide, and the Google Play listing goes further to market 100M+ users in 160+ countries. These are not directly comparable definitions, but they collectively support a conclusion of very large global reach. The 2025 U.S. launch announcement adds a regional headquarters in San Jose, while MiCA and VARA materials show regulated operational centers in Malta and Dubai. This combination makes OKX less like a\
    \ single-country exchange and more like a distributed crypto network coordinated around multiple jurisdictions."
