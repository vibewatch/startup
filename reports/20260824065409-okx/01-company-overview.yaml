callouts:
- calloutType: strength
  title: Scale plus product breadth is the core strategic asset
  body: Very few private crypto platforms can credibly show both derivatives scale and a multi-surface stack spanning institutional trading, Web3 walleting, APIs, RFQ/OTC, and regulated regional hubs. That breadth gives OKX more routes to monetization and retention than a single-product exchange.
  claimRefs:
  - CO005
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
- calloutType: risk
  title: Regulatory normalization is real, but not finished
  body: The 2025 DOJ plea, Thailand complaint, and Malta AML/CFT fine show that OKX's legal and compliance history remains a live underwriting issue even as MiCA, VARA, and U.S. expansion create regulated footholds.
  claimRefs:
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO031
- calloutType: insight
  title: Public opacity is now concentrated in economics and governance, not in existence or scale
  body: The public corpus is good enough to establish that OKX is large, global, and strategically important. It is much weaker on audited revenue, exact user definitions, board structure, and legal-entity economics, which means the next diligence step should be document requests rather than more internet archaeology.
  claimRefs:
