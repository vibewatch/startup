- id: founders-leadership-and-governance
  title: Founders, visible leadership, and governance opacity
  body: "The clearest founder fact is that Mingxing “Star” Xu sits at the center of the OKX story. OKX's own founder explainer and CoinMarketCap both trace the group back to Xu's 2013 founding of OKCoin and 2017 expansion into OKEx, now OKX. That continuity matters because it explains both the company's product DNA and its regulatory baggage: OKX was not built as a post-MiCA, post-ETF exchange, but as a derivatives-heavy offshore venue that later had to retrofit global compliance and onshore licensing.\n\nPublic leadership disclosure is much thinner than product disclosure. OKX's own pages readily surface Roshan Robert as U.S. CEO and Haider Rafique as a public-facing marketing executive through partner pages, while the founder explainer names Hong Fang and former CEO Jay Hao. But the company does not provide a detailed public board roster, committee structure, or control-rights map comparable to a public exchange. Third-party databases try to fill that gap, but they disagree materially\
    \ on employee count and other basic facts. That gap does not mean the company lacks governance; it means outside investors would still need a data room to verify who actually controls which entities and compliance functions.\n\nThe best-documented internal build-out is on compliance rather than classic corporate governance. In the company's post-DOJ statement, OKX says it has built a 150+ person financial-crime and blockchain-intelligence team and invested heavily in KYC, customer risk rating, geo-blocking, AML monitoring, and market surveillance. CoinLaw and Tracxn both suggest a much larger total workforce, but their figures do not align. The diligence takeaway is straightforward: founder continuity is clear, selected operating executives are visible, and compliance staffing has scaled sharply, but the governance surface remains materially more opaque than what public-market investors would expect."
