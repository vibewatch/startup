- id: recommendation-kill-triggers-and-diligence
  title: Recommendation, kill triggers, and final diligence asks
  body: |-
    Because OKX is private and opaque, the recommendation has to be price-sensitive. I would not anchor on the most optimistic media-style $25 billion framing as if it were already validated. On current public evidence, I would treat $12-16 billion as the fair-value zone, low-teens pricing as potentially attractive, high-teens as watchlist territory, and $20 billion-plus as needing unusually strong private corroboration to justify entry.

    That recommendation changes quickly if diligence closes the key gaps. Verified revenue mix, audited entity-level capital, customer concentration data, and clean regulator dialogue could all justify a tighter discount. Conversely, renewed enforcement, reserve credibility issues, large support backlogs, or evidence that heavy-trader concentration is extreme would compress the range sharply. The conclusion is not that OKX lacks quality; it is that public evidence alone is insufficient to pay an unqualified strategic premium.

    In practice, that means the investment committee should debate price more than narrative. Most late-stage mistakes on opaque companies come from paying strategic-premium prices before the evidence justifies them. OKX may deserve that premium eventually, but the burden of proof sits with management and the diligence process, not with optimistic extrapolation. today.
