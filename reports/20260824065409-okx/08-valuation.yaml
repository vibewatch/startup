- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Renewed major enforcement
    - New severe U.S. or EU action
    - Raises legal discount and challenges control narrative
    - Pause or exit thesis
  - - Reserve / segregation credibility issue
    - Any credible mismatch or misuse evidence
    - Breaks trust pillar behind exchange safety story
    - Immediate downside reassessment
  - - Extreme concentration surprise
    - Diligence reveals outsized dependence on few traders
    - Weakens durability and valuation quality
    - Cut valuation range materially
  - - Entity-level capital weakness
    - Diligence shows trapped capital or debt stress
    - Compresses equity value and exit readiness
    - Reduce or avoid exposure
  - - Major support / product reliability deterioration
    - Sustained outages or severe backlog escalation
    - Damages customer quality and conversion assumptions
    - Lower multiple and revise customer thesis
  notes: These kill triggers are designed to be observable and investment-relevant, not merely operationally interesting.
