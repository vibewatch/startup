  evidenceGaps:
  - type: capital-gap
    severity: high
    topic: entity-level capital and debt
    missingEvidence: No public audited disclosure of cash, debt, trapped capital, or regulatory reserve obligations by entity.
    whyItMatters: These data determine whether OKX deserves a mild or severe private-market discount.
    diligencePath: Request audited entity-level balance sheets, debt schedules, and capital-transfer policies.
    relatedQuestionRefs:
    - QV023
    - QV027
    - QV030
    relatedTableRefs:
    - TV006
  - type: concentration-gap
    severity: high
    topic: customer concentration and revenue quality
    missingEvidence: No public top-customer, top-desk, or product-line revenue concentration disclosure.
    whyItMatters: The best late-stage outcomes require durable, diversified economics, not just gross activity scale.
    diligencePath: Request concentration analysis by revenue, trading volume, deposits, and geography.
    relatedQuestionRefs:
    - QV026
    - QV030
    relatedTableRefs:
    - TV006
  - type: valuation-enumeration-gap
    severity: medium
    topic: Comparable valuation table coverage
    missingEvidence: The public peer set for a private global crypto exchange is inherently incomplete; TR004 is decision-useful but not exhaustive.
    whyItMatters: Peer choice can materially change perceived fair value.
    diligencePath: Request internal comp decks, private transaction comps, and secondary-market indications.
    relatedQuestionRefs:
    - QV009
    - QV030
    relatedTableRefs:
    - TV004
  - type: frontier-gap
    severity: medium
    topic: wallet and institutional optionality monetization
    missingEvidence: No public revenue or retention bridge proves how much wallet, earn, embedded, or institutional lines add to equity value.
    whyItMatters: Optionality is the main argument for paying more than a plain exchange multiple.
    diligencePath: Request product-line monetization, retention, and client-concentration data for optionality modules.
    relatedQuestionRefs:
    - QV015
    - QV030
    relatedTableRefs:
    - TV003
    - TV006
