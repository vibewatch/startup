company:
  name: OKX
chapter:
  number: 8
  title: Valuation
  summary: 'OKX is one of the rare private fintechs that looks both enormous and under-disclosed. The operating evidence—market share, derivatives strength, wallet breadth, user scale, and multi-billion-dollar revenue proxies—supports a serious franchise. The legal history, regional fragmentation, and lack of audited financial detail, however, argue for a material private-market discount to the cleanest public comparables. My base-case valuation stance is therefore constructive but disciplined: OKX looks plausibly worth about $12-16 billion on current public evidence, with a broad plausible range of roughly $7-25 billion depending on revenue quality, legal-risk discount, and how much weight one gives to strategic optionality in wallet, institutional, and U.S./EU expansion. That leads to a conditional recommendation rather than a simple yes/no: attractive if entry is in the low-to-mid teens with strong diligence rights; difficult to underwrite above about $20 billion unless investors receive
    unusually strong private evidence on revenue quality, capital, and regulatory durability.'
sections:
- id: thesis-vs-anti-thesis
  title: Investment thesis versus anti-thesis
  body: |-
    The positive case for OKX is unusually strong for a private crypto company. It appears to operate at genuine scale, with public estimates of roughly $1.5-1.9 billion of 2024 revenue, a top-tier derivatives position, meaningful wallet and institutional adjacencies, and active re-entry into the United States plus regulated packaging in Europe. Those are the ingredients of a global, multi-surface crypto platform rather than a cyclical niche exchange.

    The anti-thesis is equally clear. The company has a major legal scar, incomplete public financial disclosure, uncertain customer concentration, and a business model whose most attractive frontier modules are less proven than the core exchange. That means OKX may deserve a strategic premium to simple spot-only venues, but it also deserves a material opacity and legal-risk discount to the cleanest public-market multiples.

    A second way to say this is that OKX has already crossed the threshold where valuation arguments are mostly about quality and discount rate, not existence. Investors are no longer asking whether there is a business; they are asking how much of that business is durable, clean, and transferable across jurisdictions.
