- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue mix
    - Product-line revenue and gross margin by spot, derivatives, wallet, institutional, embedded
    - Determines whether premium multiple is deserved
    - Request CFO pack / management presentation
  - - Capital and liquidity
    - Cash, debt, regulatory reserves, trapped capital by entity
    - Determines solvency-like discount and exit readiness
    - Request audited entity-level statements
  - - Customer concentration
    - Top-customer / top-desk share of volume and revenue
    - Determines durability and downside to churn
    - Request top-10 / top-50 concentration analysis
  - - Regulatory durability
    - Current monitor status, regulator dialogue, unresolved local actions
    - Determines legal discount trajectory
    - Request legal counsel memo and monitor reports
  - - Support and compliance friction
    - Backlogs, freeze rates, complaint resolution times
    - Determines customer quality and hidden churn
    - Request operations dashboards
  - - Frontier module economics
    - Wallet, earn, and embedded monetization plus user retention
    - Determines optionality premium credibility
    - Request product analytics and revenue bridges
  notes: If these asks come back clean, OKX could justify a materially tighter discount than the public record alone supports today.
