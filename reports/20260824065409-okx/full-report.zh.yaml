      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图至少可以拆成五个有意义的群体。第一类是零售囤币者和轻量交易者，他们会根据信任、法币便利性和基础 UX，在 OKX 与 Coinbase、Kraken
              或本地交易所之间比较。第二类是全球活跃衍生品交易者——频率最高的一群——他们最在意流动性、杠杆、工具宽度、费用和执行质量，会把 OKX 直接拿来和 Binance、Bybit、Gate、Bitget
              以及越来越多的 Hyperliquid 比。第三类是使用 RFQ、大宗交易、类主经纪执行、抵押流动性和重视托管流程的机构与 VIP 客户。第四类是自托管和 Web3
              用户，他们可能并不通过中心化交易所费用，而是通过兑换、质押和钱包参与来间接变现。第五类是开发者、商户或嵌入式金融建设者，他们可能通过钱包通道或 API 接触 OKX，而不是通过交易所 UI 本身。


              这些分层没有同一个预算主人，也没有同一个采用触发点。零售支出分散在个人手中。机构支出由资金管理、交易或数字资产团队编制预算。钱包使用往往先从便利性或多链访问开始，之后才变成收入来源。因此，OKX
              的市场更适合被理解为一个分层漏斗：全球加密持有人基数里，只有一部分会变成全平台高价值、受监管、可重复的收入。
