  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与替代品
        blocks:
          - type: paragraph
            body: >-
              OKX 的相关市场比传统零售加密交易所定义更宽。OKX 官方界面和交易所数据库显示，一个产品族覆盖现货交易、永续合约、期货、期权、借贷和 Earn 产品、机构 RFQ
              与大宗流程、API，以及一个能把链上活动路由到 DEX
              和流动性池的自托管钱包。这意味着公司同时参与中心化交易所变现和更宽的加密市场基础设施使用。买方可以从零售交易进入，但同一平台希望把这个用户继续留在质押、钱包内兑换、机构执行、资金管理 或抵押流程里。


              实际替代品也比直接同业交易所更宽。Binance 和 Bybit 正面争夺全球活跃衍生品交易者；Coinbase 和 Kraken 吸收重视信任、连接法币或本土受监管的流量；OTC
              柜台和托管商会去中介化一部分机构执行；Hyperliquid 则证明，链上衍生品现在已经能吸收过去必须在中心化场所清算的有意义流量。关键尽调结论是，OKX
              不只是在争夺现货佣金。它争的是多产品加密操作堆栈的一份额，而现状替代方案从券商应用、自托管到 DEX 原生交易都有。
