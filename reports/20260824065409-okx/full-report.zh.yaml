      - number: '2.2'
        title: 用多重视角测算市场规模
        blocks:
          - type: paragraph
            body: >-
              对 OKX 来说，最干净的公开规模视角是交易所总交易量，但这个视角需要加限定。TokenInsight 把 2026 年 Q1 交易所交易量放在 $17.9 trillion，CoinGlass 则放在
              $20.57 trillion。两者都指向超过 $70 trillion 的年化运行率，但由于交易所覆盖、排名样本和测量方法不同，数字并不一致。CoinGecko 的 2025
              年纯现货研究给了一个有用的下限校验：仅前 10 名现货交易量就在 2025 年达到 $18.7 trillion；但现货只是与 OKX 最相关市场中的少数，因为在 TokenInsight 看来，衍生品约占
              2026 年 Q1 活动的 82%，也约占 OKX 自身交易量组合的 93%。


              第二个视角不是名义成交额，而是可变现池。Business of Apps 估计，2024 年加密交易所应用收入为 $56
              billion，远低于总交易名义额暗示的规模，因此更能提醒我们交易费业务的经济天花板。这也是本报告保留不同 TAM 框架的原因：一个看交易量，一个看收入，还有一个更窄的可服务视角，基于 OKX
              最强的位置——全球衍生品、机构执行，以及在可合法服务需求的司法辖区内连接钱包的用户。
