            - 高
            - 中
            - 中高
        - label: 财务 / 模式不透明
          values:
            - 中
            - 高
            - 低
            - 高
    claimRefs:
      - CR001
      - CR005
      - CR013
      - CR019
      - CR023
      - CR029
      - CR030
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 一次控制失败如何传导至客户、收入、利润率、运营和估值。
    data:
      nodes:
        - id: enforcement
          label: 执法或合规失误
          detail: 类 DOJ 行动，或地方辖区执法
        - id: product
          label: 产品限制 / 关停
          detail: DEX 暂停、区域限制、功能上限
        - id: customers
          label: 客户信任与流失
          detail: 支持摩擦、账户冻结、声誉受损
        - id: economics
          label: 收入与利润率压力
          detail: 交易量流失、合规成本、功能碎片化
        - id: valuation
          label: 估值压缩
          detail: 倍数更低、风险溢价更高
      edges:
        - from: enforcement
          to: product
          label: 迫使
        - from: product
          to: customers
          label: 伤害
        - from: customers
          to: economics
          label: 拉低
        - from: economics
          to: valuation
          label: 压缩
        - from: enforcement
          to: economics
          label: 推高成本
    claimRefs:
      - CR004
      - CR009
      - CR024
      - CR032
      - CR034
      - CR035
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 可能扩大 OKX 失效面的关键外部依赖。
    data:
      nodes:
        - id: okx
          label: OKX 技术栈
          detail: 交易所 + 钱包 + 机构通道
        - id: reg
          label: 监管机构 / 牌照
          detail: 美国、欧盟、泰国、迪拜及其他司法辖区
        - id: custody
          label: 托管 / 结算伙伴
          detail: 场外托管与交易后通道
        - id: liquidity
          label: 流动性 / 协议
          detail: DEX 池、跨链桥、做市商
        - id: platforms
          label: 平台 / 应用商店 / 浏览器
          detail: 分发渠道与客户端环境
        - id: users
          label: 支持 / 审核运营
          detail: 一线摩擦处理
      edges:
        - from: okx
          to: reg
          label: 依赖
        - from: okx
          to: custody
          label: 集成
        - from: okx
          to: liquidity
          label: 经由
        - from: okx
          to: platforms
          label: 通过分发
        - from: okx
          to: users
          label: 由……服务
    claimRefs:
      - CR016
      - CR023
      - CR024
      - CR025
      - CR028
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 规模、战略宽度、法律伤痕与估值纪律如何共同推导最终建议。
    data:
      nodes:
        - id: scale
          label: 规模与市场验证
          detail: 收入代理指标、份额、衍生品实力
        - id: breadth
          label: 战略宽度
          detail: 钱包、机构业务、受监管扩张
        - id: risk
          label: 法律与不透明折价
          detail: DOJ 伤痕、资本未知项、集中度风险
        - id: range
          label: 公允价值区间
          detail: ~$7B-$25B，重心在 $10B 出头至 $15B 左右
        - id: rec
          label: 建议
          detail: 仅在价格纪律下有条件投资
      edges:
        - from: scale
          to: range
          label: 支撑
        - from: breadth
          to: range
          label: 增加上行
        - from: risk
          to: range
          label: 折价
        - from: range
          to: rec
          label: 推导
    claimRefs:
      - CV007
      - CV009
      - CV010
      - CV026
      - CV027
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 将简单可比倍数应用于示意性的 $1.6B OKX 收入基数。
    data:
      items:
        - label: 5x 收入
          value: 8
          unit: USD billions
          note: 深度折价 / 悲观倍数
        - label: 7.5x 收入（Coinbase 类代理）
          value: 12
          unit: USD billions
          note: 主要公开可比锚点
        - label: 10x 收入
          value: 16
          unit: USD billions
          note: 私有战略价值更强的情景
        - label: 15x 收入
          value: 24
          unit: USD billions
          note: 接近公开口径上限的激进乐观倍数
    claimRefs:
      - CV015
      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于公开证据，对 OKX 当前估值结果给出的情景区间。
    data:
      items:
        - label: 悲观情景
          low: 7
          base: 8
          high: 9
          unit: USD billions
          note: 低收入估计叠加高折价
        - label: 基准情景
          low: 12
          base: 14
          high: 16
          unit: USD billions
          note: 目前最贴合公开证据
        - label: 乐观情景
          low: 20
          base: 22
          high: 25
          unit: USD billions
          note: 需要强有力的非公开证据印证
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 按 IC 视角概览 OKX 的核心投资判断维度。
    data:
      items:
        - label: 市场地位
          value: 8
          scaleMax: 10
          note: 顶级交易所证据扎实
        - label: 战略宽度 / 护城河
          value: 8
          scaleMax: 10
          note: 钱包 + 机构业务 + 受监管扩张
        - label: 经济性可见度
          value: 4
          scaleMax: 10
          note: 收入存在；结构和利润率不透明
        - label: 风险画像
          value: 3
          scaleMax: 10
          note: 法律伤痕和集中度不确定性较重
        - label: 估值吸引力
          value: 6
          scaleMax: 10
          note: 只有守住入场纪律才有吸引力
        - label: 证据质量
          value: 5
          scaleMax: 10
          note: 运营证据强于财务证据
    claimRefs:
      - CV012
      - CV038
