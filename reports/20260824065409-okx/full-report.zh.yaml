  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 收入接近公开区间低端，法律折价重，钱包 / 机构溢价有限
        - 质量偏弱，用折价后的低倍数推得 ~$7B-$9B
        - 执法再起、集中度、受困资本
        - 若不透明度以负面方式澄清，则可能发生
      - - 基准
        - 收入位于公开区间中段，份额稳定，中等战略溢价叠加法律折价
        - 按折价后的 Coinbase 类逻辑推得 ~$12B-$16B
        - 不透明度延续，但没有新的重大冲击
        - 当前公开证据最支持
      - - 乐观
        - 收入结构质量更高，美国 / 欧盟耐久性强，钱包 / 机构变现拿到溢价
        - 质量改善、风险折价下降时为 ~$20B-$25B
        - 需要强私下证据和干净执行
        - 有可能，但仅凭公开记录不能作为默认情景
    notes: 情景边界刻意放宽，因为公开记录没有提供经审计的公司财务报表。
