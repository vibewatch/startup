      - number: '1.3'
        title: 监管转折点与在岸扩张
        blocks:
          - type: paragraph
            body: >-
              公司概况里最重要的事实，是 OKX 已从宽松离岸增长跨入被迫监管正常化。DOJ 认罪协议称，2018 年至 2024 年初，美国用户在 OKX 上进行了超过 $1 trillion
              的交易，产生数亿美元费用；与此同时，平台未注册为货币服务业务，并让可疑和非法资金流经场所。财务后果严厉但可承受：总罚没和罚款超过 $504 million，包括约 $420.3 million 的没收和
              $84.4 million 的刑事罚金。OKX 自己把此事解释为历史合规缺口，指出没有员工被起诉，并称外部合规顾问将留任至 2027 年 2 月。


              这次执法没有终结扩张，而是重塑了扩张路径。同一时间线上，OKX 一直在搭建受监管枢纽结构：OKX Europe Limited 在马耳他获得 MiCA 授权，一个拿到 VARA
              牌照的迪拜实体可以服务机构、合格和零售投资者，美国业务则以圣何塞总部重启，并分阶段把 OKCoin 客户迁移到 OKX。马耳他记录尤其重要，因为它同时包含正反两类证据：OKX 获得授权，但公司也披露了与 2023
              年审查发现的历史 AML/CFT 缺陷有关的 €1.054 million FIAU 罚款。


              并非所有司法辖区都朝着有利于 OKX 的方向发展。泰国 SEC 2025 年 3 月提起刑事投诉，指控 OKX 经营无牌交易所、推广泰语服务并收取 0.1%
              交易费。因此，宽泛的监管叙事不是「问题已解决」，而是「部分在岸合法化，但国家级风险仍在」。投资者可以有把握地说，OKX
              现在在欧洲、迪拜和美国拥有有意义的受监管滩头堡；但也必须接受，平台仍背着逐个司法辖区爆发执法风险的敞口。
