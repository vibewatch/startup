      - number: '8.3'
        title: 投资建议、否决触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              OKX 未上市且不透明，投资建议必须对价格敏感。我不会把最乐观、媒体式的 $25 billion 估值框架当成已经验证的锚。基于当前公开证据，我会把 $12-16 billion 视为公允价值区间；低十几
              billion 的定价可能有吸引力，高十几 billion 进入观察名单，$20 billion 以上则需要异常强的私下佐证才能支持入场。


              如果尽调补上关键缺口，建议会很快变化。经验证的收入结构、经审计的实体层面资本、客户集中度数据，以及干净的监管沟通，都可能支撑更窄的折价。反过来，新的执法行动、储备可信度问题、大量支持工单积压，或重度交易者集中度极高的证据，都会迅速压缩估值区间。结论不是
              OKX 缺乏质量，而是仅靠公开证据，还不足以支付无条件的战略溢价。


              实操上，投资委员会更该争论价格，而不是叙事。不透明公司的后期投资错误，大多来自证据尚未支撑时就付了战略溢价。OKX 最终也许配得上这笔溢价，但证明责任在管理层和尽调流程，而不是乐观外推——至少今天如此。
