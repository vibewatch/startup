  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              以一家未上市加密公司衡量，OKX 的正向逻辑少见地强。它看起来已经跑出真实规模：公开估计的 2024 年收入约 $1.5-1.9
              billion，衍生品站位一线，钱包和机构业务也有分量，同时正积极重返美国，并在欧洲用受监管包装落地。这些要素拼出的不是周期性小众交易所，而是一个全球化、多触点的加密平台。


              反向逻辑同样清楚。公司背着一道重大法律伤口，公开财务披露不完整，客户集中度不确定；商业模式里最有想象力的前沿模块，也没有核心交易所那么经验证。也就是说，相比单纯做现货的场所，OKX
              或许应拿到战略溢价；但相对最干净的公开市场倍数，它也必须承受不透明和法律风险带来的实质折价。


              换句话说，OKX 已经越过“这是不是一门生意”的门槛。估值争论主要落在业务质量和折现率，而不是存在性。投资人不再问有没有业务，而是在问这门业务有多少足够耐久、干净，并能跨司法辖区复制。
