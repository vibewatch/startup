  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与全球足迹
        blocks:
          - type: paragraph
            body: >-
              OKX 卖给的不是单一客户原型。公开记录至少显示五个有意义的群体：零售现货买卖者、高频或衍生品很重的活跃交易者、机构和 VIP
              台、自托管钱包用户，以及通过体育和嵌入式渠道触达的合作伙伴分发或联名受众。在某些界面里，买方、用户和付款方是同一个人；在另一些界面里——尤其是机构或嵌入式基础设施——这些角色会拆分到
              资金管理、交易员、运营和终端用户身上。


              地理分层也类似。消费者页面宣传全球服务足迹，而美国、EEA 和迪拜上线显示，真实客户访问越来越通过区域特定实体和功能集打包。这说明 OKX
              的客户群不只是大，而且运营上异质性很强；这有助于扩规模，却让干净客户指标更难解读。


              另一个含义是，客户指标在结构上就混杂。受监管交易所账户、自托管钱包安装、迁移来的 OKCoin 用户，以及通过专门工作流路由 RFQ
              的机构，在日常语言里都可以被称为「客户」，但经济性和留存表现完全不同。这种模糊性并不否定规模故事，却让头部用户数字不像表面看起来那么有决策价值。
