      - number: '5.2'
        title: 架构、集成通道与开发者设计
        blocks:
          - type: paragraph
            body: >-
              公开架构是分层的。用户可以留在托管交易所流程里，也可以进入自托管，或通过 API、钱包连接和嵌入式基础设施接入第三方应用。API 堆栈本身不是营销附属品：OKX 发布了 REST 和 WebSocket
              文档、带权限的 API 密钥、IP 绑定、模拟交易支持和运营限频规则。再叠加活跃的社区封装库生态，程序化使用显然是产品核心，而不是边缘能力。


              机构侧也出现同样模式。Liquid Marketplace 和 Rubix 都指向一个作为执行和基础设施提供商的 OKX，而不只是目的地应用。嵌入式交易、交易所外托管、RFQ
              和交易后结算会拓宽护城河，但也增加了围绕流动性伙伴、托管商、开发者和监管者的依赖风险。


              这种架构也意味着，公司在一定程度上像基础设施。前端应用重要，但路由质量、API 易用性、合作伙伴集成和开发者可靠性也同样重要。这些特征更难被纯消费者交易所快速复制，也是 OKX
              似乎正在瞄准加密市场底层管线中更大角色的原因之一。
