    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与 OKX 想解决的任务
        blocks:
          - type: paragraph
            body: >-
              最适合把 OKX 理解为一组协同界面，而不是一个单体交易所。中心化一侧覆盖现货、期货、期权、RFQ、跟单、交易机器人和收益产品；钱包一侧覆盖自托管、DEX 路由、质押、NFT 和 dApp
              访问；机构一侧进一步延伸到交易后结算、嵌入式交易所基础设施和 API 驱动执行。这一点重要，因为产品策略是把用户留在同一个品牌里，即便他们在零售交易、专业执行和链上活动之间移动。


              这个宽度是真实差异化，但也抬高了可用性门槛。几份外部评测认为，OKX 最连贯的使用场景，是活跃交易者、高阶用户或真正会吃下工作流深度的机构。轻量用户仍要理解大量界面、模式和区域限制。


              第二个含义是，OKX
              想变现的是客户递进，而不只是获客。用户可以从简单买入开始，进入高阶交易所流程，再迁移到钱包内兑换或质押，而不用离开品牌。这在战略上有吸引力，因为每一次接力都创造了加深留存、收集更多交易活动，或把用户推向机构工具和嵌入式通道等更高价值界面的机会。
