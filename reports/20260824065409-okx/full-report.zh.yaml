      - number: '6.2'
        title: 采用信号与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              漏斗顶部采用看起来是真实的。公开来源提到庞大用户群、大规模移动端分发、强交易所可见度，以及从 OKCoin 分阶段迁移到 OKX
              的美国路径。公开记录没有提供的是一个单一权威分母。各来源用户数不同，但方向一致：相对于大多数私营金融科技公司，OKX 正在服务非常庞大的受众。


              具名客户证据最强的地方，不是传统企业案例研究，而是合作伙伴和品牌驱动分发。Manchester City 和 McLaren 提供了新鲜且反复出现的证据，说明 OKX
              能拿下大型全球合作伙伴，并在多轮活动中激活它们。这些证据对认知度和信任很重要，但本身不能回答这些关系带来多少收入或产品使用。


              这个区分重要，因为 OKX 最强的公开背书不是带量化结果的经典 SaaS
              标识，而是客户相邻证明：俱乐部、赛车队、应用商店触达和迁移队列。这些信号仍有价值，尤其对消费者金融科技品牌如此；但它们更多说明触达和获客能力，而不是合同耐久性或队列经济性。
