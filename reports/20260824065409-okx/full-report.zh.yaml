  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入结构
        - 按现货、衍生品、钱包、机构、嵌入式拆分的产品线收入和毛利率
        - 决定溢价倍数是否合理
        - 索取 CFO 材料包 / 管理层演示
      - - 资本与流动性
        - 按实体拆分现金、债务、监管储备和受困资本
        - 决定类偿付能力折价和退出准备度
        - 索取经审计的实体层面报表
      - - 客户集中度
        - 头部客户 / 头部交易台在成交量和收入中的占比
        - 决定耐久性和流失下行
        - 索取前 10 / 前 50 集中度分析
      - - 监管耐久性
        - 当前监察状态、监管沟通、未解决本地行动
        - 决定法律折价轨迹
        - 索取法律顾问备忘录和监察报告
      - - 支持与合规摩擦
        - 积压、冻结率、投诉解决时长
        - 决定客户质量和隐性流失
        - 索取运营仪表盘
      - - 前沿模块经济性
        - 钱包、Earn 和嵌入式变现，以及用户留存
        - 决定可选性溢价是否可信
        - 索取产品分析和收入桥接
    notes: 若这些问题返回干净，OKX 可以证明其折价应比仅凭当前公开记录支持的水平明显更窄。
