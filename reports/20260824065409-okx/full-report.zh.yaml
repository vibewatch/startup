companyProfile:
  summary: >
    OKX 2017 年以 OKEx 名义成立，2022 年更名为 OKX。如今它是一家多界面的加密平台，覆盖中心化现货和衍生品交易、机构 RFQ 与嵌入式交易所基础设施、带链上路由和 dApp 访问的自托管钱包、质押和 Earn
    流程，以及 EEA、迪拜、美国等地区的特定受监管实体。公开证据显示，这是一家规模很大的私营公司，衍生品地位强，钱包和机构业务有可观选择权，也有储备证明、Web3 安全遥测等异常细的信任工具；但 2025 年 DOJ
    和解留下重大法律伤疤，资本、集中度和产品线经济性也持续不透明。
