      - number: '1.2'
        title: 创始人、可见领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              最清晰的创始人事实，是 Mingxing “Star” Xu 位于 OKX 故事中心。OKX 自己的创始人说明和 CoinMarketCap 都把集团追溯到 Xu 2013 年创办 OKCoin、2017
              年扩张至 OKEx（也就是今天的 OKX）。这种连续性很重要，因为它解释了公司的产品基因和监管包袱：OKX 不是按后 MiCA、后 ETF
              时代要求从头搭出的交易所，而是一家衍生品很重的离岸场所，后来不得不补上全球合规和在岸牌照。


              公开领导层披露远薄于产品披露。OKX 自己的页面很容易看到美国 CEO Roshan Robert，也能通过合作伙伴页面看到面向公众的营销高管 Haider Rafique；创始人说明还提到 Hong Fang
              和前 CEO Jay
              Hao。但公司没有给出类似公开交易所的详细董事名单、委员会结构或控制权图谱。第三方数据库试图填补空白，却在员工数等基础事实上的差异很大。这个缺口不意味着公司没有治理，而是说明外部投资者仍需要数据室来验证谁实际控制哪些实体和合规职能。


              内部建设记录最完整的部分不是传统公司治理，而是合规。OKX 在 DOJ 事件后的声明中称，公司已建立 150+ 人的金融犯罪和区块链情报团队，并在 KYC、客户风险评级、地理封锁、AML
              监控和市场监控上投入很大。CoinLaw 和 Tracxn
              都指向更大的总员工规模，但两者数字并不一致。尽调结论很直接：创始人连续性清楚，部分运营高管可见，合规人员已经大幅扩张；但治理表面仍比公开市场投资者期待的水平不透明得多。
