  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 改变判断的证据
    rows:
      - - 全球业务已有规模，衍生品、钱包和机构业务宽度真实
        - 若公开或非公开证据显示收入规模被高估，或客户结构偏弱
      - - 美国和 EEA 的受监管扩张可提升战略耐久性
        - 若扩张主要增加成本，几乎不带来可持续收入质量
      - - 钱包和机构业务的可选性支撑相对简单交易所的部分溢价
        - 若前沿模块无法变现，或仍容易触发合规问题
      - - 法律和披露不透明需要折价
        - 若尽调证明资本、集中度和监管沟通明显好于担忧
      - - 公开证据支持百亿美元中段的估值中枢
        - 若非公开证据支持显著降低风险折价，或显著下调收入质量假设
    notes: 反向逻辑不是 OKX 没有规模，而是这一规模的私下价值可能低于最宽口径头条所暗示的水平。
