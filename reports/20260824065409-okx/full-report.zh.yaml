chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              应把 OKX 理解为一个品牌化集团，而不是一家披露得整整齐齐的单一运营公司。2025 年 2 月 DOJ 认罪协议把 Aux Cayes FinTech Co. Ltd. 这家塞舌尔实体列为 OKX 及其前身
              OKEx 的运营方，而 CoinMarketCap 和 OKX 现有公开页面描述的运营版图更宽，覆盖交易所、钱包、机构和 Web3 服务。交易所脉络从 Star Xu 2013 年创办 OKCoin，到 2017
              年推出 OKEx，再到 2022 年更名 OKX；因此，相比许多 2020 年后冒出的加密新贵，OKX 的运营历史更长。


              即便按大型交易所标准，OKX 的产品宽度也偏大。OKX 的关于页面、机构界面、钱包主页和 API 文档合在一起，呈现出一个覆盖现货交易、永续合约、期货、期权、DeFi 路由、质押和 Earn 产品、OTC 与
              RFQ 流程、程序化交易和非托管钱包的堆栈。Web3 不是营销附属品：OKX Wallet 对外宣传 130+ 原生链、1,000 个子账户、跨 100+ 流动性池的 DEX
              路由和一层链上分析能力；机构界面则宣传 700+ 交易对、900+ 工具和 $40T+ 累计交易额。落到业务上，OKX 卖的不只是高频交易所，还有一套更宽的加密操作环境。


              从地域看，公开记录支持一种离岸法律实体叠加越来越多在岸区域枢纽的混合模型。OKX 公开关于页面称其服务 100 多个国家的数百万用户，机构页面宣传全球 71M+ 用户，Google Play 页面进一步宣传在
              160+ 个国家拥有 100M+ 用户。这些口径不能直接互比，但合在一起足以支持「全球触达很大」的结论。2025 年美国上线公告增加了圣何塞区域总部，MiCA 和 VARA
              材料则显示马耳他和迪拜的受监管运营中心。这个组合让 OKX 不像单一国家交易所，更像围绕多个司法辖区协调起来的分布式加密网络。
