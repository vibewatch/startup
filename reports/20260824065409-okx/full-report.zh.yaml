  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、产品组合与定价机制
        blocks:
          - type: paragraph
            body: >-
              OKX 不是单线收入业务。官方页面和交易所摘要至少显示六个可变现层：现货交易、永续合约和期货、期权、机构 RFQ 与大宗流程、钱包或 DEX 相关活动，以及 Rubix
              等嵌入式或面向合作伙伴的基础设施。机构堆栈很重要，因为它指向的收入来源质量不同于普通零售佣金：交易后结算、交易所外托管合作、抵押驱动交易和嵌入式交易通道，即便公共仪表盘只突出交易量，也能形成粘性业务。钱包的重要性也类似。即便公开来源没有单独拆出钱包收入，OKX
              显然也在试图捕捉比撮合引擎费用更长的客户旅程。


              定价比实际经济性更容易看见。OKX 宣传分层挂单 / 吃单定价和低基础费率，但公开记录没有披露多少交易量按 VIP
              条款清算、返佣如何改变净变现，或受监管实体如何改变定价和杠杆经济性。结果就是一个熟悉的交易所悖论：收入引擎在概念上容易描述，精确量化却很难。
