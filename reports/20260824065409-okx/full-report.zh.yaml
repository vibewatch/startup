      basis: >-
        Most decision-useful public comparables and strategic reference points retained for the valuation chapter, not a
        complete peer list.
    notes: 可比组有意保持窄口径并给出解释；没有完美上市同业能对应 OKX 这种私有全球加密交易所的精确组合。
