        title: 公开牵引力与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开收入读数来自 Business of Apps。它估计 OKX 2024 年收入为 $1.9 billion、2024 年交易量为 $6 trillion、活跃用户为 2.5
              million。这些不是经审计的公司披露，但已经足够推导第一版单位经济性框架。按这个视角，交易量隐含收入收益率约 3.2 个基点，单活跃用户收入约 $760，单活跃用户年交易量约 $2.4
              million。这些数字符合直觉：交易所经济性是高交易量、低抽成的业务，一小部分相对活跃的用户就能驱动很大的名义吞吐量。


              DOJ 记录提供了另一个三角验证点。它写明，美国客户在 2018 年至 2024 年初在 OKX 上执行了超过 $1 trillion 的交易，相关没收额约 $421
              million。这不能解决当前收入问题，但它显示了即便一个有争议业务分部也有多大经济规模。因此，公开记录足以支持粗略抽成率和活动代理指标，但距离产品线收入、毛利率或留存披露仍差很远。
