      - number: '4.4'
        title: 财务结论与公开记录的边界
        blocks:
          - type: paragraph
            body: >-
              我的财务结论是，OKX 看起来是一家大型、可信、很可能能自我维持的私营交易所运营商，但真实利润质量和资本结构仍不透明。公司几乎肯定有真实规模：公开估计把收入至少放在十亿美元低个位数，市场份额报告和 DOJ
              记录也支持大量吞吐量。它的收入质量也可能好于纯现货场所，因为机构、嵌入式和钱包相关工作流可以把变现推进到零售佣金之外。


              承销阻碍很具体。公开来源不按业务线拆分收入，不提供经审计毛利率或现金流，不披露现金、债务或现金跑道，也无法让分析师区分客户储备和公司流动性。因此，后续估值工作可以使用公开区间和可比公司逻辑，但任何真正投资级判断都需要数据室，拿到产品线收入、抽成率、毛利率、实体层面资产负债表、债务条款和监管资本义务。
