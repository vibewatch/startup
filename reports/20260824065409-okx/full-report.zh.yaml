      - number: '6.3'
        title: 留存、满意度与扩张风险
        blocks:
          - type: paragraph
            body: >-
              公开记录在耐久性上远弱于获客。OKX 不披露
              NRR、GRR、流失、续约率或客户集中度，这个缺口很重要，因为公司服务的不同队列预期留存动态差异很大。只要执行质量强，活跃衍生品交易者和机构可能有粘性；轻量零售用户可能更受事件驱动、更价格敏感；钱包用户只有在
              OKX 继续作为编排层有用，而不只是通往外部协议的桥时，才可能留下。


              第三方评测也指向同一种分裂。高阶用户常赞赏宽度、流动性和高级工具，而投诉集中在支持滞后、合规驱动冻结，以及界面太多带来的认知负担。因此，留存结论是混合的：OKX
              在某些队列里很可能有强重复行为，但公开证据太薄，无法证明全堆栈客户耐久性。


              因此，解读证据最好采取非对称方式。由于太多独立信号指向同一方向，可以假定客户触达真实。由于最强公开证据来自高阶用户适配和品牌牵引，而不是披露的队列，可以假定耐久性只被部分证明。并且，由于公开记录对重度用户依赖基本沉默，可以假定集中度既可能没问题，也可能很麻烦。


              从尽调角度看，正确问题不是 OKX 有没有客户。显然有。更难的问题是，哪些客户类别足够耐久，可以支撑溢价估值假设；哪些只是随市场周期、促销或事件驱动投机而来的短暂流量。
