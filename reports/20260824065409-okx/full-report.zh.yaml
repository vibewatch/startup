  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律悬置风险
        blocks:
          - type: paragraph
            body: >-
              OKX 最高严重度风险仍是监管和法律风险。原因不是公司今天显然不合规，而是公开记录已经证明它在不久前曾实质性不合规。DOJ 认罪和 $505 million 和解建立了一个硬先例：如果 OKX
              再次管不好司法辖区控制，下行不是假设。欧洲和亚洲也是同一教训，整改、罚款、牌照和本地产品限制说明，对一家私营金融科技公司来说，这门业务仍背着异常高的监管负担。


              好消息是，OKX 已转向区域化包装、明确的受限司法辖区规则和公开合规语言。坏消息是，这些缓释措施本身也制造复杂度、客户摩擦和持续监管敞口。因此，法律风险已经从危机模式下降，但并未出清。


              可以用路径依赖来框定这个风险。OKX
              不再需要因完全相同的违法事实再次被定罪，才会遭受法律伤害；只要出现新的事实模式，让人认为区域控制、实体隔离或筛查没有按宣传那样运行，就足够造成损害。已经认罪的公司面对的门槛，比记录干净的公司低得多。
