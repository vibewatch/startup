  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 传导至投资逻辑
      - 行动含义
    rows:
      - - 重大执法再起
        - 美国或欧盟出现新的严重行动
        - 推高法律折价，并挑战控制叙事
        - 暂停或退出投资逻辑
      - - 储备 / 隔离可信度问题
        - 任何错配或挪用的可信证据
        - 打破交易所安全故事背后的信任支柱
        - 立即重估下行
      - - 极端集中度意外
        - 尽调显示对少数交易者过度依赖
        - 削弱耐久性和估值质量
        - 大幅下调估值区间
      - - 实体层面资本薄弱
        - 尽调显示资本受困或债务压力
        - 压缩股权价值和退出准备度
        - 降低或避免敞口
      - - 重大支持 / 产品可靠性恶化
        - 持续宕机或严重积压升级
        - 伤害客户质量和转化假设
        - 下调倍数并修订客户逻辑
    notes: 这些终止触发项追求可观察且与投资相关，而不只是运营上有趣。
    claimRefs:
      - CV031
      - CV032
      - CV037
