        - ~7.5x 简单市值 / 收入代理倍数
        - 最接近的上市加密交易所直接参照，覆盖零售、高级和机构产品面
        - 上市公司，披露更干净，法律历史不同
      - - Robinhood
        - 2026 年 8 月市值 / TTM 收入代理指标
        - ~21x 简单市值 / 收入代理倍数
        - 可作为多产品消费金融科技可选性的上限信号
        - 经纪和股票市场敞口更宽，直接作为基准同业偏贵
      - - Coinbase 产品宽度
        - Advanced、Prime、International 产品面
        - 战略宽度已在公开市场得到验证
        - 说明多产品面交易所为何能比单一现货场所拿到更高估值
        - 仍是上市公司基准，不是私募市场答案
      - - OKX 战略可比框架
        - MiCA 实体 + 美国重启 + 钱包 / 机构业务宽度
        - 支撑相对简单私有交易所的溢价
        - 比纯零售券商可比对象更贴合 OKX 的战略故事
        - 仍受法律历史和不透明财务拖累
    enumerationScope:
