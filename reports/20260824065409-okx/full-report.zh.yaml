      - number: '3.3'
        title: 能力宽度、定价与切换成本现实
        blocks:
          - type: paragraph
            body: >-
              能力越宽，不一定能顺利转化为定价权。OKX 在衍生品、期权、钱包、DEX 路由、RFQ、API
              和受监管扩张上都有可信宽度，但多数直接同业现在也给出足够多的功能面，让买方可以多平台开户而不失去核心功能。费用让这一点更清楚。OKX 标称 0.08%/0.10% 的现货费率有吸引力，但 Bybit
              的费率表已经足够接近，单靠价格不是护城河。Coinbase 和 Kraken 收费更高，但它们卖的是信任、法币便利、支持和本土信心，而不只是最佳执行价格。Bitget 和 Robinhood
              又把战场拉得更宽：它们把加密包进更大的账户里，目标是让消费者根本不再开第二个专业关系。


              实际切换成本结论是，高阶用户锁定效应中等。资金可以迁移，API 可以重建，交易者也经常维护多个交易所账户。尽管如此，VIP 等级、子账户、钱包习惯和机构工作流集成里的留存摩擦是真实存在的。换句话说，OKX
              一旦嵌进去可以守住用户，但不能像某些软件公司那样假定自己拥有专有俘获力。
