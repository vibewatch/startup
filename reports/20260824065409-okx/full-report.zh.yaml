      - number: '8.2'
        title: 估值语境、可比公司与情景区间
        blocks:
          - type: paragraph
            body: >-
              最好的公开可比公司组合并不完美，但可以用。Coinbase 是最干净、最直接的公开可比公司，因为它是加密原生交易所，同时覆盖大规模零售和机构业务面。Robinhood
              的可比性弱一些，它是覆盖股票市场的综合零售券商；但它的估值仍能给多产品消费者金融科技的期权价值提供上限信号。由此得到的倍数很宽：以 2026 年 8 月市值对 TTM 收入计算，Coinbase
              隐含高个位数收入倍数，Robinhood 则贵得多。机械套用这些倍数是错的；用它们框定一个打折后的未上市公司区间才合适。


              因此，情景逻辑应先从 OKX
              的公开收入代理指标出发，再逐层加入风险折价。悲观情景假设收入更接近公开估计下沿，法律风险折价仍然很重，前沿产品也拿不到太多溢价。乐观情景假设机构和钱包变现质量更高，并且有证据表明美国与 EEA
              包装提升的是耐久性，而不只是成本。基准情景位于两端之间，把 OKX 估为一个强劲但不透明的未上市平台。


              这也是为什么情景思维比点估值的胆量更重要。像 OKX 这样的公司，收入质量假设或风险折价稍微一动，公允价值就可能差出数十亿美元。区间之所以宽，并不是因为业务是虚的，而是公开观察者能拿到的信息权利有限。
