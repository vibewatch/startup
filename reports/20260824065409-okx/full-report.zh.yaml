      - number: '1.4'
        title: 品牌规模、合作伙伴与仍需解决的关键事实
        blocks:
          - type: paragraph
            body: >-
              OKX 的品牌策略显示，管理层希望平台被视为主流全球金融品牌，而不只是加密原生的衍生品场所。Manchester City 和 McLaren 合作伙伴关系触达范围远超交易专业人士，两家合作伙伴页面也都把 OKX
              描述为按交易量计算的全球最大交易所之一。U.S. News 转载的 Reuters 关于 BlackRock–Standard Chartered 抵押框架的报道，也显示 OKX
              正在向更高端机构市场上探：它支持第三方托管下的代币化美国国债抵押，而不是要求所有资产都进入交易所。


              运营信任信号存在，但并不单一。CoinGecko 和 CoinMarketCap 都显示丰富的上市资产、大额储备和强日成交量。McLaren 和 OKX 都强调每月发布储备证明，Hacken 列出多次 OKX
              审计工作。但 Trustpilot 捕捉到持续的零售服务摩擦：2026 年初的低评分快照主要来自客服、账户审核、提现或争议处理投诉。CryptoSlate 2026
              年评测用更克制的方式表达了同一点：放在全球，OKX 最强的是完整交易场；放在美国本土，它仍是范围更窄的受监管现货加钱包方案。


              剩下的未知项，正是后续尽调最该追打的地方：经审计收入、准确法律实体图、董事会构成、相互冲突的用户和员工指标如何对账，以及受监管在岸实体相对于离岸核心的真实经济性。第一章可以有把握地确认 OKX
              规模大、多元化、监管化程度正在提高；但还不能证明这个集团简单、透明，或者能像公开交易所运营商那样容易承销。
