      - number: '7.3'
        title: 模型风险、缓释措施与叫停标准
        blocks:
          - type: paragraph
            body: >-
              最难建模的是公开记录没有量化的风险。OKX 不披露头部客户集中度、经审计现金和债务、实体层面资本约束、支持 SLA
              分布，或钱包到交易所队列留存。这意味着残余风险不只是可见的东西，还包括未被测量的东西。对这么大的业务来说，隐藏集中度或资本受困动态，可能比边际头部份额变化更重要。


              缓释仍有意义。储备证明、Protect、KYC
              和制裁筛查、风险遥测、审计，以及区域特定法律实体，都显示公司正在主动降低脆弱性。但只有在可监控触发指标持续改善时，投资者才应给这些控制充分信用。正确姿态是有条件的信心：只要合规、正常运行时间、储备可信度和客户信任保持完整，就维持投资逻辑；一旦其中一个支柱断裂，就迅速砍掉投资逻辑。


              这种条件化心态很重要，因为加密交易所往往死在类别接缝处：法律规则碰上产品决策，客户支持碰上欺诈控制，或资本结构碰上本地监管。OKX
              有足够规模和缓释基础设施保持可信，但公开披露还不足以支撑盲目信任。可见控制与不可见结果之间的缺口，就是核心承销问题。
