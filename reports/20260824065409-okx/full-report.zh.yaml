      - number: '4.3'
        title: 成本结构、资本充足性与法律悬置
        blocks:
          - type: paragraph
            body: >-
              成本可见度远弱于需求可见度。公开证据清楚指向几个有意义的费用桶：合规团队、安全评审、机构支持、本地市场招聘，以及法律或牌照开销。公司自己的 DOJ 事后声明强调了一个 150+
              人的金融犯罪和区块链情报团队，而第三方员工数估计暗示了大得多的全球运营足迹。这个组合说明，交易所业务并不是简单软件意义上的轻资产；更可能是流量上有不错毛经济性，同时在合规、风险和支持上背着大额固定成本义务。


              资本充足性最难承销。CoinGecko 储备和 CoinGlass 用户资产数据告诉我们，平台持有或中介了大量客户余额，但这些数字不等同于自由现金、权益资本或现金跑道。DOJ
              罚金金额很大，但显然可承受，欧洲和美国的在岸扩张也继续推进。尽管如此，留存的公开来源都没有披露 OKX 现金、债务、监管储备义务或关联公司间转移。因此，公司可能财务强劲，但公开记录无法用资产负债表精度证明这一点。
