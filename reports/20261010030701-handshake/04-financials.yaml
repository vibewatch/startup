callouts:
  - calloutType: "risk"
    title: "Margin Compression and Revenue Quality in AI Data Labeling"
    body: "While third-party reports project Handshake AI gross billings exceeding $1 billion in 2026, the underlying economics diverge sharply from pure SaaS. Expert contributors command significant hourly payouts, meaning net revenue and cash contribution represent only a fraction of top-line volume. Underwriters must separate high-multiple software ARR from lower-multiple marketplace services."
    claimRefs:
      - "CI007"
      - "CI008"
  - calloutType: "insight"
    title: "Structural Squeeze on Basic Employer Utility Drives Paid Upgrades"
    body: "Handshake's July 2025 policy updates deliberately degraded the utility of free Basic employer accounts by shortening posting windows to 30 days and eliminating cross-team collaboration. By forcing growing employers into paid Premium tiers to access basic workflows, Handshake protects core SaaS monetization against recruitment budget pullbacks."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
