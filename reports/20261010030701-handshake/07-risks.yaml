chapter:
  number: 7
  title: "Risks"
  summary: "The clearest public risk signal is labor-model exposure: two independent articles describe a July 2026 proposed misclassification action, while separate reporting documents contractor suspensions, withheld-pay allegations, and prior individual wage disputes. The assigned evidence does not quantify burn, client concentration, loss exposure, or the current procedural posture, so those remain material diligence gaps rather than scored facts."
sections:
  - id: "labor-classification-and-legal-exposure"
    title: "Labor classification is the leading evidenced legal risk"
    body: >-
      Two independent specialist publications report that Boggs v. Stryder Corp. d/b/a
      Handshake et al. was filed in the Northern District of California on July 20,
      2026. The articles describe claims under the Fair Labor Standards Act and
      California labor law and allegations that Handshake set rates, required use of
      its platform, capped billable hours, and did not compensate some onboarding or
      meeting time. Those are allegations, not adjudicated facts; one article
      explicitly says Handshake had not yet responded when it was published. The
      economic exposure therefore cannot be quantified from the assigned sources.
      Nevertheless, California's reported ABC framework makes control, ordinary-course
      work, and independent-business status central diligence questions. The immediate
      diligence path is to obtain the complaint and subsequent docket, management's
      classification analysis, worker agreements, time records, and reserves. A thesis
      break would be class certification, denial of a motion to compel arbitration, or
      evidence that disputed practices affect a broad share of the annotator base.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
    tableRefs:
      - "TR001"
  - id: "contractor-pay-and-platform-operations"
    title: "Pay disputes create operating, reputation, and delivery risk"
    body: >-
      B17 News reports that five contractors on various OpenAI projects described abrupt
      suspensions, with four saying they were not paid; correspondence reviewed by the
      publication said at least one decision was final and offered no appeal. Breaking
      Even separately describes August 2026 worker reports of deposits below expected
      amounts, missing dashboard information, and unresolved disputes, while carefully
      declining to infer a single mechanism. These accounts do not prove a systemic
      outage or unlawful withholding, but they identify a control risk at the junction
      of task measurement, rule enforcement, support escalation, and payout
      reconciliation. A prior reported $6,475 unpaid-wage ruling raises the cost of
      treating these accounts as isolated anecdotes. Management should reconcile
      accepted task time to gross contractor liabilities and cash disbursements by
      project, disclose dispute volumes and aging, and show an independent appeal path.
      Repeated material reconciliation breaks or elevated specialist attrition would
      undermine both delivery reliability and the labor-supply advantage.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "dependencies-and-financial-model-unknowns"
    title: "Dependencies are visible, but their concentration and economics are not"
    body: >-
      Handshake's own site claims more than one million companies ready to hire and
      advertises more than 100 AI specialist roles; a live employer job page confirms
      that the marketplace continues to carry third-party postings. B17 News also ties
      the contractor disputes it investigated to several OpenAI projects. These facts
      establish multiple operating surfaces, but not their revenue mix, customer
      concentration, contractual durability, or margin contribution. The assigned
      sources disclose no audited revenue, burn, runway, gross-to-net AI-services
      economics, counterparty concentration, payout-funding mechanics, or security
      incident record. Accordingly, client loss, working-capital strain, and margin
      compression should remain unquantified diligence risks rather than assigned
      probabilities. The decisive evidence is a segment bridge between recruiting
      software and AI services, top-client exposure, project cancellation rights,
      contractor payable aging, and cash runway. A thesis break would be dependence on
      one client or project for a material share of gross profit without committed
      volume or replacement capacity.
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "evidence-quality-and-monitoring"
    title: "Monitoring must distinguish company evidence from keyword collisions"
    body: >-
      Three successful results allocated to this chapter concern unrelated uses of the
      word “handshake”: an AXI4 hardware protocol repository, an individual dependency
      framework, and a confidential-computing troubleshooting guide. They are valid
      documents but provide no evidence about Stryder Corp. or Handshake AI. Their
      presence demonstrates why domain and issuer verification must precede risk
      scoring; they are retained only to preserve the assigned search provenance and
      are not used to infer company technical controls. Monitoring should instead track
      the Boggs docket, arbitration motions, contractor dispute counts, payout
      reconciliation exceptions, attrition, client concentration, and segment cash
      consumption. No conclusion about the absence of breaches, outages, enforcement,
      or other incidents is supportable from this pool. The risk process should mark
      those categories as unverified and require primary legal records, company control
      evidence, and customer or counterparty documentation before investment approval.
    claimRefs:
      - "CR015"
