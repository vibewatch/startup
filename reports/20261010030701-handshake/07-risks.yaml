  - calloutType: "recommendation"
    title: "Monitorable kill criteria"
    body: "Pause underwriting if the action advances toward a broad class, payment exceptions recur without reconciled ledgers, one AI client represents a material share of gross profit without commitments, or runway cannot absorb a labor-model reset."
