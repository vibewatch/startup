    title: "Do not underwrite a legal outcome from secondary reporting"
    body: "The filed action and reported worker accounts justify elevated diligence, but the assigned pool contains neither the complaint nor Handshake's response. Investment approval should require primary docket review and a quantified exposure analysis."
    claimRefs:
      - "CR001"
      - "CR002"
