callouts:
  - calloutType: "insight"
    title: "Technical Decoupling via LLM Orca"
    body: "By isolating LLM execution within the stateless Orca microservice and enforcing structured outputs, Handshake insulated its core Ruby and Go application backends from rapid shifts in underlying foundational model APIs."
    claimRefs:
      - "CE005"
      - "CE006"
  - calloutType: "risk"
    title: "Operational and Legal Exposure in Data Delivery"
    body: "While Handshake AI reports rapid top-line expansion, active class action litigation alleging contractor misclassification and recurring payment disbursement disputes introduce meaningful operational vulnerability to its expert data supply chain."
    claimRefs:
      - "CE013"
      - "CE014"

