company:
  name: "Handshake"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Handshake has expanded from a multi-sided university career network built on a Ruby on Rails monolith and Go microservices into a major provider of AI model evaluation infrastructure and enterprise workflow automation. The platform utilizes a specialized LLM Orca microservice with Arize AX observability to route generative AI features, alongside a proprietary data annotation platform and reinforcement learning simulation environments, while managing active legal and operational disputes regarding annotator labor classification and payment reliability."
sections:
  - id: "core-network-architecture"
    title: "Multi-Sided Platform Architecture and Core Engineering Foundation"
    body: "Handshake operates a three-sided digital career marketplace connecting more than 25 million students and alumni across 1,600 educational institutions with over one million employers. The company's digital infrastructure is anchored on a legacy Ruby on Rails web monolith operating in tandem with focused Go microservices for high-throughput search, candidate feeds, and real-time applicant indexing. Data persistence relies on PostgreSQL relational databases, Redis caching layers, and cloud-native hosting across both Google Cloud and Amazon Web Services environments. Engineering teams deploy containerized execution infrastructure to manage student candidate profiles, university administrative tools, and high-volume recruiter outreach pipelines."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE011"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"

  - id: "generative-ai-orchestration"
    title: "Generative AI Orchestration and the LLM Orca Service"
    body: "To accelerate generative AI feature delivery without destabilizing core platform services, Handshake engineered LLM Orca, a dedicated internal orchestration microservice. Orca serves as a single sanctioned entry point for stateless LLM calls with structured outputs, hydrating prompts with Handshake entity IDs and routing queries across Google Vertex AI, Anthropic models, and the OpenAI Platform, with Anyscale supporting managed Ray clusters. To guarantee reliability and monitor unit costs, every call through LLM Orca is traced end-to-end to Arize AX and Datadog. This architecture supports features including AI-generated recruiter first-contact messaging, job and skill taxonomy tagging, and candidate search assistants evaluated against curated golden test datasets."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE002"

  - id: "expert-validation-infrastructure"
    title: "Handshake AI and Expert Human Validation Infrastructure"
    body: "Expanding beyond traditional campus recruiting, Handshake launched Handshake AI to supply human model validation data, expert evaluations, and benchmark testing directly to frontier artificial intelligence laboratories. The service leverages Handshake's academic network of over 500,000 PhDs and graduate scholars across nearly 200 disciplines to generate domain-specific prompts and grade model outputs. Workloads are executed on an in-house proprietary data annotation platform, while dedicated Handshake AI Enterprise teams deploy directly into client environments to build custom agent workflows. Concurrently, Handshake is developing Reinforcement Learning Environments in Bengaluru to simulate complex real-world workflows with realistic tools and programmatic feedback loops, driving claimed explosive business growth."
    claimRefs:
      - "CE003"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE012"
    tableRefs:
      - "TE003"

  - id: "governance-and-operational-risks"
    title: "Technical Governance, Labor Classification, and Payment Reliability"
    body: "The rapid scaling of Handshake AI has introduced substantial operational and legal friction into the platform's service delivery architecture. A proposed federal class and collective action filed in July 2026 alleges that Handshake misclassified thousands of AI annotators as independent contractors while exercising direct control over assignments, working methods, and compensation. Furthermore, expert contributors reported widespread payment delivery failures and dashboard discrepancies across partner payment processors during summer 2026. These vulnerabilities highlight technical and governance debt across Handshake's contractor management, time-tracking, and payout distribution infrastructure as model training demands surge."
    claimRefs:
      - "CE013"
      - "CE014"

