      - ["Handshake Plus", "Flexible daily or monthly billing", "200 messages monthly, as reported by ZoomInfo", "Price amount and realized discounts not disclosed", "Monetizes higher outreach intensity"]
      - ["Handshake Talent Engagement Suite", "Annual quote based on hiring volume", "Unlimited messaging and advanced features, as reported by ZoomInfo", "Exact enterprise price and contract terms not published", "Supports enterprise segmentation but prevents public TCO comparison"]
      - ["Prentus", "Flat institutional fee", "AI advising, mock interviews, and outcomes collection are vendor-claimed", "Price amount, contract length, and discounts not disclosed", "Competes for institution budget without necessarily replacing Handshake"]
      - ["Company website plus Google Jobs", "No platform price stated", "Direct posting can appear in Google Jobs", "Internal implementation, traffic acquisition, and screening costs unknown", "Low-cash-cost substitute for employers with sufficient brand reach"]
      - ["General job boards and social networks", "Some free posting options", "Broad or local reach depending on channel", "Applicant quality, visibility, and screening burden are unquantified", "Creates price pressure at the basic job-posting layer"]
