chapter:
  number: 3
  title: "Competitors"
  summary: "Handshake's clearest defensible position is employer distribution across a company-reported network of 20M+ verified students and alumni, 1,500+ colleges and universities, and 1M+ employers. The assigned evidence also shows credible pressure from career-outcomes point solutions and material trust risk in Handshake AI, while leaving competitor pricing, retention, and independently measured outcomes unresolved."
sections:
  - id: "landscape"
    title: "The competitive set spans systems, networks, point solutions, and internal workflows"
    body: >
      Handshake is not competing against one homogeneous category. Its own materials frame the service as a large early-career network, while a competitor-authored comparison separates employer-recruiting operations from student engagement, advising, outcomes collection, reporting, and content distribution. That framing places Symplicity and 12twenty near the career-center system-of-record layer; Prentus, Suitable, and uConnect around narrower engagement or outcomes jobs; LinkedIn Recruiter around broad professional recruiting; and internal websites, Google Jobs, general job boards, and social media as status-quo substitutes. The pool does not contain primary materials from most named vendors, so their profiles below are directional, not an exhaustive or independently verified market census.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP007"
      - "CP011"
      - "CP013"
    tableRefs:
      - "TP001"
  - id: "capability-and-distribution"
    title: "Distribution is the anchor; engagement and outcomes are the wedge"
    body: >
      Handshake's company-issued evidence emphasizes reach, matching, messaging, and employer access: it reports 20M+ verified students and alumni, 1,500+ colleges and universities, and 1M+ employers, and says more than 40% of applications in the prior year went to small businesses. A live public job page confirms that job distribution remains an observable product surface, but it does not prove applicant quality or placement outcomes. Prentus attacks a different bottleneck, marketing always-on advising, mock interviews, and outcomes collection while explicitly allowing schools to keep Handshake for job flow. This makes multi-homing a central competitive pattern: point solutions can win budget and engagement without first displacing Handshake's network.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP006"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP015"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-and-switching"
    title: "Published packaging lowers entry friction, but realized economics are opaque"
    body: >
      The available comparison material describes a freemium ladder for employers: a free Basic plan, a message-limited Plus plan, and an annually priced enterprise suite whose exact price is not published. Prentus describes a flat institutional fee but does not publish the amount in the retained page. Status-quo channels may offer free posting, yet their internal labor, screening burden, and conversion performance are not quantified. This evidence supports a distribution-versus-workflow trade-off, not a total-cost winner. Switching costs appear concentrated in employer-network continuity, integrations, accumulated workflows, and change management; the strongest available competitor source itself recommends coexistence rather than assuming a clean replacement.
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP012"
      - "CP014"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "durability-and-risk"
    title: "The moat is structural, but not sufficient by itself"
    body: >
      The evidence supports a qualified moat thesis. A three-sided marketplace can reinforce employer supply, student demand, and career-center workflow adoption, and a competitor describes loss of the employer network as the principal switching risk. However, the same source argues that institutions can layer AI advising and outcomes tools on top of Handshake, which limits feature-level lock-in and creates a path for budget fragmentation. Trust also matters as Handshake expands into AI work: Business Insider and a specialist worker publication both describe a court order requiring payment of $6,475 to one contractor in an unpaid-wages dispute. That event does not establish broad platform misconduct, but it is adverse evidence that execution and worker-governance risk can weaken the AI expansion narrative.
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP015"
      - "CP016"
