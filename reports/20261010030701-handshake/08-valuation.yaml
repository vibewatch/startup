callouts:
  - calloutType: "recommendation"
    title: "Diligence Requirement: Distinguishing Gross AI Flow from Net Revenue"
    body: "Institutional investors evaluating Handshake must not conflate the $15 million in weekly trainer payouts distributed via Stripe Global Payouts with Handshake's net recurring revenue. While annualized gross disbursements exceed $780 million, data labeling platforms frequently operate on thin transactional spreads (15-25%) or pass-through contractor reimbursement models. Diligence teams must demand audited income statements separating legacy recruiting SaaS ARR from gross AI billings and net retained margins."
    claimRefs:
      - "CV003"
      - "CV007"
      - "CV016"
  - calloutType: "risk"
    title: "Class Action and ABC Test Threat to Unit Economics"
    body: "The federal collective action Boggs v. Stryder Corp. poses an existential threat to the gross margins of Handshake AI. If California courts enforce the rigid ABC test against Handshake AI Solutions LLC, the company could face mandatory payroll taxes, overtime liabilities, and back wages for thousands of annotators. Investors should treat the January 2022 $3.5 billion valuation as an upper bound subject to severe repricing if contractor reclassification is mandated."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV015"
