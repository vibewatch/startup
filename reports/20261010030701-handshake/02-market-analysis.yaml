    title: "Market Size Is Not Yet Underwritable"
    body: "The assigned evidence supports network and activity signals, not a current dollar market or obtainable share. Investment underwriting needs management-provided segment revenue, pricing, paid-customer counts, renewal cohorts, and a reconciled boundary between recruiting products and paid AI work."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
  - calloutType: "risk"
    title: "AI Labor Exposure Requires Primary Legal Review"
    body: "A current independent blog reports a proposed class and collective action over AI annotator classification, but its author had not read the complaint. The signal warrants docket and contract review; it does not establish liability, class scope, or likely financial impact."
