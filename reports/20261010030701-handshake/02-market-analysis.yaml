company:
  name: "Handshake"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Handshake spans an early-career network for employers, job seekers, and career centers plus a paid AI-work offering, but the assigned evidence supports only operational scale proxies rather than a defensible dollar TAM. The market case therefore rests on multi-sided adoption and current activity signals, with buyer budgets, conversion economics, and labor-model exposure still requiring primary diligence."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Exclusions"
    body: "The evidence supports a bounded market definition rather than a broad HR-technology label. Handshake's current site separates employers, job seekers, career centers, and Handshake AI, while its research collection describes a path from college to career across students, universities, and recruiters. The included market is therefore early-career discovery and recruiting, career-center participation, and paid remote AI work offered through the same network. General HRIS, payroll, broad mid-career recruiting, model infrastructure, and unrelated freelance marketplaces are adjacencies, not demonstrated Handshake markets. One allocated search result concerns a separate 2015 Hong Kong high-school network and is explicitly excluded from sizing the current company."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM005"
      - "CM016"
    tableRefs:
      - "TM001"
  - id: "evidence-constrained-sizing"
    title: "Evidence-Constrained Sizing"
    body: "No retained source provides a current dollar TAM, SAM, or SOM with disclosed methodology for Handshake's present business. The available numbers are differently scoped operating proxies: Handshake claims more than one million companies ready to hire and more than one hundred AI specialist roles, while its UK market-content index advertises studies involving 10,000 students, 400,000 student rankings, 1.6 million applications, and 250 campus events. These values indicate network activity and research reach, not revenue opportunity, market share, or mutually nested populations. They should not be added, divided, or converted into valuation inputs until management supplies product-level revenue, contract counts, geography, and monetization assumptions."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, Users, and Adoption Path"
    body: "The platform is multi-sided, but the public pages identify participants more clearly than payers. Employers and career centers are visible organizational audiences; job seekers use matching, advice, events, and job listings; Handshake AI offers paid remote work. A live American Portwell Technology entry-level listing confirms employer-posted inventory on the marketplace, but one listing cannot establish liquidity or conversion. Gainsight's supplier-issued case study says Handshake uses Gainsight CS and Skilljar for onboarding, segmentation, and customer education through in-app, email, human, and course touchpoints. That operating model implies adoption requires continued enablement after purchase, while contract owners, price points, procurement cycles, and retention remain undisclosed."
    claimRefs:
      - "CM001"
      - "CM011"
      - "CM012"
      - "CM013"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-gaps"
    title: "Demand Drivers, Constraints, and Diligence Gaps"
    body: "AI is simultaneously a demand driver and a constraint. Wesleyan's career-center page, drawing on Handshake data, describes the Class of 2026 as adapting to a changing early-career market while institutions are still working through the transition; Handshake's own UK index highlights application volume and skills-first hiring. The evidence does not quantify whether those shifts increase paid employer demand or merely platform activity. An independent blog reports a July 2026 proposed class and collective action involving AI annotator classification, yet the author expressly had not read the complaint. That makes labor-model exposure a diligence question, not a proven liability. Primary market sizing, budget ownership, monetization, retention, and the litigation record remain material gaps."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM009"
      - "CM014"
      - "CM015"
