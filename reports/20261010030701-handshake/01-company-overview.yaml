chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2014 by Michigan Technological University alumni, Handshake operates a three-sided early-career network connecting 25 million knowledge workers, 1,600+ universities, and over 1 million employers. Valued at $3.5 billion in its January 2022 Series F financing, the company is pivoting aggressively toward enterprise AI training workflows while facing acute contractor misclassification litigation under California labor laws."
sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Founding History, and Mission"
    body: "Handshake is the commercial brand and primary operating service of Stryder Corp., an enterprise technology company incorporated in Delaware in January 2014 and headquartered at 225 Bush Street in San Francisco, California. The business originated at Michigan Technological University in Houghton, Michigan, where undergraduate students Garrett Lord, Ben Christensen, and Scott Ringwelski identified severe structural friction in collegiate recruiting. Recognizing that traditional campus career services and on-campus career fairs favored a narrow band of elite universities and geographically concentrated employers, the founders built Handshake to establish an open digital career network for emerging talent. Over twelve years of continuous operational scaling, Handshake expanded from its initial Midwestern university pilot into an international employment network maintaining corporate offices across San Francisco, New York, London, Denver, and Bangalore. The company now positions its core product infrastructure as the career network for the artificial intelligence economy, supporting early-career internships, professional full-time placement, and distributed AI training work."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
  - id: "executive-leadership-and-governance"
    title: "Founders, Executive Leadership, and Board Governance"
    body: "Executive leadership at Handshake remains anchored by co-founder and Chief Executive Officer Garrett Lord, who has served as the company's chief strategic architect and public spokesperson since its founding. Lord is supported by an established operational and functional executive suite including President and Chief Operating Officer Jonathan Stull, Chief Financial Officer Jesse Hulsing, Chief Technical Officer Matt Greenberg, and Chief Product Officer Vee Sahgal. Co-founders Ben Christensen and Scott Ringwelski played foundational roles in building the platform's initial database architecture and university integrations before transitioning executive operational responsibilities; Christensen remains an active member of Handshake's board of directors. Corporate governance is reinforced by institutional venture capital directors representing tier-one investment firms, including Mamoon Hamid of Kleiner Perkins, Will Reed of Spark Capital, Toni Schneider of True Ventures, and Alastair Mitchell of EQT Ventures, alongside independent directors such as former Niantic COO Megan Quinn and Montai Therapeutics CEO Margo Georgiadis. In corporate filings, primary domestic operating entity Stryder Corp. documented 536 full-time employees at year-end 2024, supported by specialized subsidiary entities."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO014"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-scale-metrics"
    title: "Capitalization History, Valuation Marks, and Network Scale"
    body: "Handshake's corporate balance sheet has been financed through approximately $434 million in cumulative institutional equity funding across seven funding rounds. The company achieved unicorn status in May 2021 following an $80 million Series E financing round at a $1.5 billion post-money valuation, before raising an additional $200 million Series F financing round in January 2022 led by Coatue Management. The Series F round established a post-money valuation benchmark of $3.5 billion, with broad participation from prominent institutional investors including Lightspeed Venture Partners, Spark Capital, Kleiner Perkins, True Ventures, Notable Capital, EQT, and the Chan Zuckerberg Initiative. Handshake's valuation was underwritten on the strength of its massive three-sided network distribution, which officially encompasses more than 25 million registered knowledge workers, 1,600 higher education institutions, and 1 million employer accounts across the United States and international markets. The platform reports institutional coverage across 92 percent of top-ranked U.S. colleges, all eight Ivy League universities, and 100 percent of the Fortune 500. However, public valuation price discovery has remained entirely frozen since early 2022, and Handshake treats current GAAP revenue, software gross margin, operating cash burn, and net revenue retention as strictly confidential private metrics."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO010"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO001"
      - "TO003"
    figureRefs: []
  - id: "ai-workforce-pivot-and-legal-disputes"
    title: "Strategic AI Workforce Pivot and Labor Classification Scrutiny"
    body: "In response to generative artificial intelligence developments and shifting corporate hiring budgets, Handshake initiated a material platform expansion in 2025 and 2026 under the Handshake AI umbrella, transforming its student talent pool into a distributed workforce for frontier model evaluation and reinforcement learning from human feedback. While chief executive Garrett Lord highlighted premium hourly rates between $100 and $125 for specialized technical annotation, this rapid operational pivot has exposed Handshake to acute regulatory and labor liability. On July 20, 2026, worker Sean Boggs filed a proposed federal class and collective action, Boggs v. Stryder Corp. d/b/a Handshake et al. (Case No. 3:26-cv-07498), in the U.S. District Court for the Northern District of California. The complaint alleges that Handshake and its subsidiary Handshake AI Solutions, LLC willfully misclassified thousands of AI data workers as independent contractors under the Fair Labor Standards Act and California Labor Code § 2775. The lawsuit targets Handshake's unilateral pay rate adjustments, mandatory proprietary task software, weekly billable hour caps, and uncompensated onboarding sessions, compounded by widespread worker complaints regarding arbitrary payout withholdings. Defending against California's rigid ABC employment test presents a substantial structural risk to the unit economics and operating margins of Handshake's AI talent marketplace."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs: []
    figureRefs: []
