      classification exposure and possible damages.
    whyItMatters: >-
      A secondary blog signal cannot establish liability, class scope, enforceability, or financial impact for the paid
      AI-work segment.
    diligencePath: >-
      Retrieve and review the primary court record and worker agreements, then obtain labor counsel's
      jurisdiction-specific exposure assessment.
    relatedQuestionRefs:
