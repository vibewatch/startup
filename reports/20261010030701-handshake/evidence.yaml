evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements confirming current GAAP net revenue, gross margin percentage, operating cash burn
      rate, and cash runway.
    whyItMatters: >-
      As a privately held Series F startup valued at $3.5 billion in 2022, Handshake's underlying unit economics, cash
      burn, and software margin profile cannot be validated from unverified network claims.
    diligencePath: >-
      Request audited fiscal 2024-2025 financial disclosures, gross margin breakdowns across software SaaS vs. AI
      contractor services, and cash runway statements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Detailed share class capitalization table and voting rights agreements for Stryder Corp.
    whyItMatters: >-
      Exact founder equity retention, liquidation preferences for Series F investors, and board voting control
      mechanisms cannot be confirmed from public filings alone.
    diligencePath: >-
      Review full capitalization schedule, certificate of incorporation amendments, and investor rights agreements in
      the confidential data room.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, methodologically disclosed TAM, SAM, or SOM tied to Handshake's actual products, geographies, buyer
      counts, pricing, and obtainable share.
    whyItMatters: >-
      Network activity proxies cannot establish revenue opportunity, penetration, or the market assumptions appropriate
      for valuation.
    diligencePath: >-
      Request management's bottom-up market model and reconcile each population, contract value, adoption rate,
      geography, and product boundary to primary operating data.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract payer, budget owner, pricing, procurement cycle, renewal, and retention data by employer, career-center,
      and Handshake AI segment.
    whyItMatters: >-
      The public evidence identifies participants and workflows but does not show who pays, how durable budgets are, or
      whether activity converts into recurring revenue.
    diligencePath: >-
      Review customer contracts, price books, renewal cohorts, pipeline conversion, and segment-level revenue with
      management and a representative set of customers.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
