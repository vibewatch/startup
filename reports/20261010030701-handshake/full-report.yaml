      - Key Risks & Downside Triggers
      - Probability Weight
    rows:
      - - Bull Case
        - >-
          Enterprise recruiting growth rebounds to 20%+; Handshake AI net margins expand above 25%; Boggs lawsuit
          settles favorably
        - $4.5B - $5.5B
        - 1.3x - 1.6x
        - Broader tech hiring freeze; regulatory restrictions on autonomous model training data
