  - id: FE001
    title: Product architecture map
    type: stack
    summary: Layered view of Handshake's core digital network, LLM orchestration, and AI evaluation infrastructure.
    data:
      layers:
        - label: Client Applications & Portals
          detail: Multi-sided web and mobile interfaces serving students, recruiters, and career center administrators.
          modules:
            - Student Web & Mobile Experience (React, TypeScript)
            - Employer Talent Sourcing & Campaign Portal
            - Higher Education Career Services Workspace
        - label: Application & Domain Services
          detail: Core recruitment business logic, applicant tracking, and candidate discovery feeds.
          modules:
            - Ruby on Rails Core Monolith
            - Go Microservices for Search & Candidate Feeds
            - PostgreSQL Relational Storage & Redis Caching
        - label: LLM Orchestration Layer (Orca)
          detail: Scoped microservice handling stateless LLM execution, entity hydration, and structured schema outputs.
          modules:
            - Entity Context Hydration Engine
            - Provider Routing Gateway (Vertex AI & OpenAI)
            - Structured Output Validation & Schema Enforcement
        - label: Observability, Tracing & Evaluation
          detail: Continuous evaluation telemetry and cost tracking across all generative AI touchpoints.
          modules:
            - Arize AX Distributed Tracing & Cost Monitoring
            - Datadog Operational Metrics & Alerting
            - LLM-as-a-Judge Golden Dataset Evaluation Loops
        - label: Expert Data & Annotation Infrastructure
          detail: Proprietary task distribution platform for expert academic contributors and frontier model training.
          modules:
            - In-House Data Annotation Workspace
            - Credential Verification & Academic Domain Routing
            - Partner Payment Distribution Infrastructure
        - label: Reinforcement Learning Environments (RLE)
          detail: Interactive simulation environments generating multi-step agent interaction data.
          modules:
            - End-to-End Tool & Constraint Simulators
            - Dynamic Feedback Loop Collectors
            - Containerized Execution Environments on AWS & GCP
    approximationNotes: >-
