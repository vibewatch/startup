        title: Exhibits
        blocks:
          - type: callout
            title: Feature competition can fragment spend without displacing the network
            body: >-
              The retained competitor evidence explicitly supports coexistence: institutions can keep Handshake for
              employer distribution while adding a separate engagement and outcomes layer.
            calloutType: risk
