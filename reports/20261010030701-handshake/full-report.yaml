      - number: '1.3'
        title: Capitalization History, Valuation Marks, and Network Scale
        blocks:
          - type: paragraph
            body: >-
              Handshake's corporate balance sheet has been financed through approximately $434 million in cumulative
              institutional equity funding across seven funding rounds. The company achieved unicorn status in May 2021
              following an $80 million Series E financing round at a $1.5 billion post-money valuation, before raising
              an additional $200 million Series F financing round in January 2022 led by Coatue Management. The Series F
              round established a post-money valuation benchmark of $3.5 billion, with broad participation from
              prominent institutional investors including Lightspeed Venture Partners, Spark Capital, Kleiner Perkins,
              True Ventures, Notable Capital, EQT, and the Chan Zuckerberg Initiative. Handshake's valuation was
              underwritten on the strength of its massive three-sided network distribution, which officially encompasses
              more than 25 million registered knowledge workers, 1,600 higher education institutions, and 1 million
              employer accounts across the United States and international markets. The platform reports institutional
              coverage across 92 percent of top-ranked U.S. colleges, all eight Ivy League universities, and 100 percent
              of the Fortune 500. However, public valuation price discovery has remained entirely frozen since early
              2022, and Handshake treats current GAAP revenue, software gross margin, operating cash burn, and net
              revenue retention as strictly confidential private metrics.
