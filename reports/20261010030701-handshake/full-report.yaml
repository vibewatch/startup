              - CP011
              - CP013
      - number: '3.2'
        title: Distribution is the anchor; engagement and outcomes are the wedge
        blocks:
          - type: paragraph
            body: >
              Handshake's company-issued evidence emphasizes reach, matching, messaging, and employer access: it reports
              20M+ verified students and alumni, 1,500+ colleges and universities, and 1M+ employers, and says more than
              40% of applications in the prior year went to small businesses. A live public job page confirms that job
              distribution remains an observable product surface, but it does not prove applicant quality or placement
              outcomes. Prentus attacks a different bottleneck, marketing always-on advising, mock interviews, and
              outcomes collection while explicitly allowing schools to keep Handshake for job flow. This makes
              multi-homing a central competitive pattern: point solutions can win budget and engagement without first
              displacing Handshake's network.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
