  - id: FI001
    title: Revenue Model Bridge
    type: flow
    summary: >-
      Conversion mechanism from student network engagement to high-margin SaaS subscriptions and high-volume AI
      data-labeling revenue.
    data:
      nodes:
        - id: campus-network
          label: University Network & Student Base
          detail: >-
            25M+ students across 1,500+ university career centers supply proprietary early-career talent without
            consumer acquisition costs.
        - id: basic-employer
          label: Basic Employer Accounts
          detail: >-
            Over 1M registered employers utilize free postings subject to a 30-day window and restricted candidate
            visibility.
        - id: premium-saas
          label: Premium Employer Subscriptions
          detail: >-
            Employers upgrade to annual subscriptions ($150M–$200M ARR) for advanced filters, proactive outreach, and
            event tools.
        - id: ai-expert-pool
          label: Handshake AI Expert Community
          detail: >-
            Network of PhDs, postdocs, and technical graduates mobilized for high-skill LLM evaluation and
            domain-specific RLHF.
        - id: enterprise-ai-contracts
          label: Enterprise AI Model Training
          detail: Frontier AI lab contracts generating high-volume gross billings ($1.1B Sacra estimate in 2026).
        - id: margin-realization
          label: Divergent Margin Realization
          detail: >-
