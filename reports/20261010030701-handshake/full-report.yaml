      - number: '1.2'
        title: Founders, Executive Leadership, and Board Governance
        blocks:
          - type: paragraph
            body: >-
              Executive leadership at Handshake remains anchored by co-founder and Chief Executive Officer Garrett Lord,
              who has served as the company's chief strategic architect and public spokesperson since its founding. Lord
              is supported by an established operational and functional executive suite including President and Chief
              Operating Officer Jonathan Stull, Chief Financial Officer Jesse Hulsing, Chief Technical Officer Matt
              Greenberg, and Chief Product Officer Vee Sahgal. Co-founders Ben Christensen and Scott Ringwelski played
              foundational roles in building the platform's initial database architecture and university integrations
              before transitioning executive operational responsibilities; Christensen remains an active member of
              Handshake's board of directors. Corporate governance is reinforced by institutional venture capital
              directors representing tier-one investment firms, including Mamoon Hamid of Kleiner Perkins, Will Reed of
              Spark Capital, Toni Schneider of True Ventures, and Alastair Mitchell of EQT Ventures, alongside
              independent directors such as former Niantic COO Megan Quinn and Montai Therapeutics CEO Margo Georgiadis.
              In corporate filings, primary domestic operating entity Stryder Corp. documented 536 full-time employees
              at year-end 2024, supported by specialized subsidiary entities.
            claimRefs:
