      - number: '5.3'
        title: Handshake AI and Expert Human Validation Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Expanding beyond traditional campus recruiting, Handshake launched Handshake AI to supply human model
              validation data, expert evaluations, and benchmark testing directly to frontier artificial intelligence
              laboratories. The service leverages Handshake's academic network of over 500,000 PhDs and graduate
              scholars across nearly 200 disciplines to generate domain-specific prompts and grade model outputs.
              Workloads are executed on an in-house proprietary data annotation platform, while dedicated Handshake AI
              Enterprise teams deploy directly into client environments to build custom agent workflows. Concurrently,
              Handshake is developing Reinforcement Learning Environments in Bengaluru to simulate complex real-world
              workflows with realistic tools and programmatic feedback loops, driving claimed explosive business growth.
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
