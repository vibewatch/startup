      - number: '6.2'
        title: Adoption Trajectory, Scale Metrics, and Disclosed Growth
        blocks:
          - type: paragraph
            body: >-
              Handshake's adoption footprint reflects over a decade of campus network aggregation, achieving coverage
              across more than 92% of US universities and reaching 77% of the total US collegiate student population.
              Across this academic distribution footprint, the platform connects 18 million knowledge workers and alumni
              with over 1 million registered employers. While legacy university adoption grew through campus-by-campus
              integration, recent commercial velocity has been driven by the launch of Handshake AI in late 2024.
              Industry reporting indicates Handshake AI achieved $100 million in annualized revenue within eight months
              of launch, expanding the company's total revenue run-rate toward $200 million. However, public disclosures
              do not disaggregate active student monthly users from passive directory entries, and enterprise employer
              counts do not distinguish paying recruiting software subscribers from free basic job posters.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
