  - id: TV001
    title: Recommendation and Diligence Decision Framework
    notes: >-
      Recommendation synthesized from stale January 2022 Series F primary marks, unverified directory estimates, and
      active federal class action litigation.
    columns:
      - Decision Dimension
      - Assigned Stance
      - Underlying Evidence Base
      - Investment and Decision Implication
    rows:
      - - Recommendation
        - research-more
        - >-
          Stale 2022 valuation mark ($3.5B) combined with high-volume Handshake AI disbursements and unresolved federal
          wage litigation
        - Withhold new primary capital commitments; require private data room access to verify unit economics
      - - Confidence Level
        - medium
        - Strong documentation of historical rounds and legal dockets; absent audited GAAP gross margins and retention
        - Discount unverified third-party revenue directories; focus diligence on contract take rates
      - - Risk Rating
        - high
        - >-
          Federal FLSA collective action and California AB 5 misclassification claims threatening AI contractor labor
          model
        - Model downside indemnity scenarios and payroll tax liabilities under complete worker reclassification
      - - Valuation Stance
        - stretched
        - January 2022 $3.5B post-money valuation reflects peak software multiples; no primary repricing in 56 months
        - Target secondary purchase discounts of 35-50% below headline Series F preferred share prices
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV016
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis Analytical Matrix
    notes: Core arguments evaluated against primary source evidence and external legal docket milestones.
    columns:
      - Thesis Dimension
      - Bullish Thesis Argument
      - Bearish Anti-Thesis Vulnerability
      - What Would Change the View
    rows:
      - - Market Network Moat
        - >-
          Dominant three-sided platform across 1,200 institutions and 550K employers creates insurmountable distribution
          barrier
        - >-
          Campus recruiting faces corporate headcount tightening and persistent student complaints regarding unmoderated
          listings
        - Multi-year enterprise contract renewal data showing net revenue retention above 115%
      - - AI Data Expansion
        - >-
          Scales rapidly to over $15M weekly payouts, establishing Handshake as a tier-one human data partner for
          frontier labs
        - >-
          Gross flow disbursement obscures true net revenue; contractor dissatisfaction and sudden payment freezes risk
          churn
        - Disclosure of net retained take rates and multi-year master service agreements with foundational AI labs
      - - Labor and Regulatory Risk
        - Specialist annotators command $100-$125/hr rates with binding arbitration agreements limiting class liability
        - >-
          Boggs class action challenges contractor status under California ABC test; potential exposure to unpaid wages
          and penalties
        - Judicial enforcement of binding arbitration waivers or favorable class decertification rulings
      - - Capital Structure & Valuation
        - >-
          Top-tier syndicate (Coatue, Lightspeed, Spark, Kleiner Perkins) capable of bridging liquidity to public
          markets
        - >-
          Stale 56-month-old $3.5B mark implies significant multiple compression relative to public recruiting tech
          peers
        - >-
          Execution of an arm's-length secondary transaction or new primary financing setting clear market clearing
          prices
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV013
