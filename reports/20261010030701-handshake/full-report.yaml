      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure / unresolved gap
    rows:
      - - Account suspension followed by disputed nonpayment
        - Five interviewed contractors reported suspensions; four reported nonpayment
        - Observed in a small reported sample
        - High if repeated at scale
        - Weak in reviewed correspondence; one decision described as final
        - Population rate, false-positive rate, and total payable value are unknown
      - - Task-time and payout reconciliation mismatch
        - August worker reports described logged-time and deposit discrepancies
        - Reported, not independently measured
        - High for worker trust and control integrity
        - Dispute forms exist; resolution performance is not audited
        - No project-level ledger or exception aging was available
      - - Rule enforcement without effective appeal
        - Support correspondence cited credentials, task-duration, and location rules
        - Reported in multiple interviews
        - Medium to high
        - No independent appeal control evidenced
        - Risk of erroneous removals, talent loss, and payment disputes
      - - Security, privacy, or service incident
        - No relevant primary incident source was allocated
        - Unknown
        - Potentially high, but unsupported
        - Not assessable
        - Absence of evidence is not evidence of absence; obtain incident and control records
    notes: >-
      Rows preserve the small-sample and allegation limitations in the underlying reporting; no incident frequency or
      affected-population denominator is available.
