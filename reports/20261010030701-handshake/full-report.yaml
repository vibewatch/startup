      - number: '2.3'
        title: Buyers, Users, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The platform is multi-sided, but the public pages identify participants more clearly than payers.
              Employers and career centers are visible organizational audiences; job seekers use matching, advice,
              events, and job listings; Handshake AI offers paid remote work. A live American Portwell Technology
              entry-level listing confirms employer-posted inventory on the marketplace, but one listing cannot
              establish liquidity or conversion. Gainsight's supplier-issued case study says Handshake uses Gainsight CS
              and Skilljar for onboarding, segmentation, and customer education through in-app, email, human, and course
              touchpoints. That operating model implies adoption requires continued enablement after purchase, while
              contract owners, price points, procurement cycles, and retention remain undisclosed.
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
