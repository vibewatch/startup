  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans systems, networks, point solutions, and internal workflows
        blocks:
          - type: paragraph
            body: >
              Handshake is not competing against one homogeneous category. Its own materials frame the service as a
              large early-career network, while a competitor-authored comparison separates employer-recruiting
              operations from student engagement, advising, outcomes collection, reporting, and content distribution.
              That framing places Symplicity and 12twenty near the career-center system-of-record layer; Prentus,
              Suitable, and uConnect around narrower engagement or outcomes jobs; LinkedIn Recruiter around broad
              professional recruiting; and internal websites, Google Jobs, general job boards, and social media as
              status-quo substitutes. The pool does not contain primary materials from most named vendors, so their
              profiles below are directional, not an exhaustive or independently verified market census.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP011
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
