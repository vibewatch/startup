      - number: '6.4'
        title: Durability, Retention Gaps, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite strong top-line scale and extensive institutional reach, Handshake's commercial durability faces
              material transparency gaps and emerging legal counterparty risks. Management does not publicly disclose
              audited net revenue retention (NRR), gross revenue retention (GRR), or university contract renewal cohort
              figures, obscuring whether core recruiting SaaS spend is expanding net of corporate hiring contractions.
              Operationally, customer success engineers must actively manage integration friction across university
              single sign-on protocols and enterprise applicant tracking systems like Workday and Greenhouse to protect
              renewal baselines. Furthermore, the rapid expansion of Handshake AI has introduced legal friction: a
              proposed class action lawsuit filed in July 2026 (Boggs v. Stryder Corp.) alleges that the company
              misclassified thousands of AI training annotators as independent contractors. While Handshake enforces
              mandatory individual arbitration clauses, payment disputes and labor scrutiny threaten counterparty trust
              and workforce supply stability across high-value AI research lab engagements.
            claimRefs:
              - CU006
              - CU008
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Campus Career Center Lock-In Provides Zero-CAC Network Distribution
            body: >-
              Handshake's single sign-on integration across 1,500 higher education institutions gives it near-total
              penetration of graduating classes at zero student acquisition cost, creating a defensible multi-sided moat
              that feeds both corporate recruiting and AI expert data services.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU005
          - type: callout
            title: Absence of Disclosed Net Retention and Litigation Over Worker Classification
            body: >-
              While Handshake's monetization has expanded into enterprise recruiting suites and AI data evaluation,
              management provides no audited NRR or school churn figures, and class action litigation alleging worker
              misclassification presents emerging legal and counterparty risks.
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Labor classification is the leading evidenced legal risk
        blocks:
          - type: paragraph
            body: >-
              Two independent specialist publications report that Boggs v. Stryder Corp. d/b/a Handshake et al. was
              filed in the Northern District of California on July 20, 2026. The articles describe claims under the Fair
              Labor Standards Act and California labor law and allegations that Handshake set rates, required use of its
              platform, capped billable hours, and did not compensate some onboarding or meeting time. Those are
              allegations, not adjudicated facts; one article explicitly says Handshake had not yet responded when it
              was published. The economic exposure therefore cannot be quantified from the assigned sources.
              Nevertheless, California's reported ABC framework makes control, ordinary-course work, and
              independent-business status central diligence questions. The immediate diligence path is to obtain the
              complaint and subsequent docket, management's classification analysis, worker agreements, time records,
              and reserves. A thesis break would be class certification, denial of a motion to compel arbitration, or
              evidence that disputed practices affect a broad share of the annotator base.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
      - number: '7.2'
        title: Pay disputes create operating, reputation, and delivery risk
        blocks:
          - type: paragraph
            body: >-
              B17 News reports that five contractors on various OpenAI projects described abrupt suspensions, with four
              saying they were not paid; correspondence reviewed by the publication said at least one decision was final
              and offered no appeal. Breaking Even separately describes August 2026 worker reports of deposits below
              expected amounts, missing dashboard information, and unresolved disputes, while carefully declining to
              infer a single mechanism. These accounts do not prove a systemic outage or unlawful withholding, but they
              identify a control risk at the junction of task measurement, rule enforcement, support escalation, and
              payout reconciliation. A prior reported $6,475 unpaid-wage ruling raises the cost of treating these
              accounts as isolated anecdotes. Management should reconcile accepted task time to gross contractor
              liabilities and cash disbursements by project, disclose dispute volumes and aging, and show an independent
              appeal path. Repeated material reconciliation breaks or elevated specialist attrition would undermine both
              delivery reliability and the labor-supply advantage.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
