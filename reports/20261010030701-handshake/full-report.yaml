          - type: callout
            title: Underwrite the moat with retention and outcome data
            body: >-
              Require institution and employer cohort retention, attach rates by paid package, independently measured
              placement outcomes, and win-loss data against both full-suite and point-solution vendors.
            calloutType: recommendation
            claimRefs:
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Handshake monetizes its two-sided collegiate recruiting network through a dual-engine commercial
              architecture spanning enterprise software subscriptions and transactional AI services. Historically, the
              business was built on SaaS contracts sold to employers seeking programmatic access to college students
              across more than 1,500 partner universities. Handshake provides a free Basic tier for small organizations
              but progressively gates essential recruiting features to drive conversion into annual Premium partner
              contracts. Basic accounts are constrained to 30-day listing windows, lack candidate discovery tools like
              Talent Lists, and cannot share hiring notes or candidate activity across internal team members.


              In contrast, Premium Employer Partners pay custom negotiated annual licensing fees that grant
              sophisticated candidate segmentation, direct messaging capabilities, and priority visibility at approved
              educational institutions. Beyond recruiting SaaS, Handshake expanded aggressively into AI model training
              by launching Handshake AI. This newer business line monetizes enterprise data-labeling and reinforcement
              learning from human feedback (RLHF) contracts with frontier AI research laboratories. By leveraging its
              vast collegiate user base of graduate students, postdocs, and technical degree holders, Handshake connects
              enterprise AI buyers with verified subject matter experts, creating a high-volume services revenue stream
              alongside core recruiting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
