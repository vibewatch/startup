      - number: '5.4'
        title: Technical Governance, Labor Classification, and Payment Reliability
        blocks:
          - type: paragraph
            body: >-
              The rapid scaling of Handshake AI has introduced substantial operational and legal friction into the
              platform's service delivery architecture. A proposed federal class and collective action filed in July
              2026 alleges that Handshake misclassified thousands of AI annotators as independent contractors while
              exercising direct control over assignments, working methods, and compensation. Furthermore, expert
              contributors reported widespread payment delivery failures and dashboard discrepancies across partner
              payment processors during summer 2026. These vulnerabilities highlight technical and governance debt
              across Handshake's contractor management, time-tracking, and payout distribution infrastructure as model
              training demands surge.
            claimRefs:
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical Decoupling via LLM Orca
            body: >-
              By isolating LLM execution within the stateless Orca microservice and enforcing structured outputs,
              Handshake insulated its core Ruby and Go application backends from rapid shifts in underlying foundational
              model APIs.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Operational and Legal Exposure in Data Delivery
            body: >-
              While Handshake AI reports rapid top-line expansion, active class action litigation alleging contractor
              misclassification and recurring payment disbursement disputes introduce meaningful operational
              vulnerability to its expert data supply chain.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Three-Sided Customer Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Handshake operates a three-sided network structure where higher education career centers, corporate
              recruiting teams, and college students interact under distinct commercial and operational incentives.
              University career services act as the primary distribution anchor and institutional supply aggregator,
              embedding Handshake as their central career services management system across 1,500 partner institutions.
              For enterprise employers, Handshake functions as an active candidate discovery channel, transitioning
              basic corporate users into paying subscribers of the Talent Engagement Suite at approximately $12,000
              annually per contract. College students and graduate scholars participate as non-paying career seekers who
              create verified academic profiles through campus single sign-on integrations, which Handshake subsequently
              leverages as a qualified expert talent pool for its AI model evaluation operations. Commercial value is
              heavily skewed toward large enterprise recruiters seeking diversity hiring tools and frontier AI research
              labs purchasing structured academic validation workflows.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
