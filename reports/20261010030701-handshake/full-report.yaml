      - number: '2.4'
        title: Demand Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              AI is simultaneously a demand driver and a constraint. Wesleyan's career-center page, drawing on Handshake
              data, describes the Class of 2026 as adapting to a changing early-career market while institutions are
              still working through the transition; Handshake's own UK index highlights application volume and
              skills-first hiring. The evidence does not quantify whether those shifts increase paid employer demand or
              merely platform activity. An independent blog reports a July 2026 proposed class and collective action
              involving AI annotator classification, yet the author expressly had not read the complaint. That makes
              labor-model exposure a diligence question, not a proven liability. Primary market sizing, budget
              ownership, monetization, retention, and the litigation record remain material gaps.
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM014
