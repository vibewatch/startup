chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Mission
        blocks:
          - type: paragraph
            body: >-
              Handshake is the commercial brand and primary operating service of Stryder Corp., an enterprise technology
              company incorporated in Delaware in January 2014 and headquartered at 225 Bush Street in San Francisco,
              California. The business originated at Michigan Technological University in Houghton, Michigan, where
              undergraduate students Garrett Lord, Ben Christensen, and Scott Ringwelski identified severe structural
              friction in collegiate recruiting. Recognizing that traditional campus career services and on-campus
              career fairs favored a narrow band of elite universities and geographically concentrated employers, the
              founders built Handshake to establish an open digital career network for emerging talent. Over twelve
              years of continuous operational scaling, Handshake expanded from its initial Midwestern university pilot
              into an international employment network maintaining corporate offices across San Francisco, New York,
              London, Denver, and Bangalore. The company now positions its core product infrastructure as the career
              network for the artificial intelligence economy, supporting early-career internships, professional
              full-time placement, and distributed AI training work.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO015
