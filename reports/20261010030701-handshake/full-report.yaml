      - number: '3.3'
        title: Published packaging lowers entry friction, but realized economics are opaque
        blocks:
          - type: paragraph
            body: >
              The available comparison material describes a freemium ladder for employers: a free Basic plan, a
              message-limited Plus plan, and an annually priced enterprise suite whose exact price is not published.
              Prentus describes a flat institutional fee but does not publish the amount in the retained page.
              Status-quo channels may offer free posting, yet their internal labor, screening burden, and conversion
              performance are not quantified. This evidence supports a distribution-versus-workflow trade-off, not a
              total-cost winner. Switching costs appear concentrated in employer-network continuity, integrations,
              accumulated workflows, and change management; the strongest available competitor source itself recommends
              coexistence rather than assuming a clean replacement.
            claimRefs:
              - CP007
              - CP008
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP012
              - CP014
      - number: '3.4'
        title: The moat is structural, but not sufficient by itself
        blocks:
          - type: paragraph
            body: >
              The evidence supports a qualified moat thesis. A three-sided marketplace can reinforce employer supply,
              student demand, and career-center workflow adoption, and a competitor describes loss of the employer
              network as the principal switching risk. However, the same source argues that institutions can layer AI
              advising and outcomes tools on top of Handshake, which limits feature-level lock-in and creates a path for
              budget fragmentation. Trust also matters as Handshake expands into AI work: Business Insider and a
              specialist worker publication both describe a court order requiring payment of $6,475 to one contractor in
              an unpaid-wages dispute. That event does not establish broad platform misconduct, but it is adverse
              evidence that execution and worker-governance risk can weaken the AI expansion narrative.
            claimRefs:
              - CP009
              - CP010
              - CP015
              - CP016
