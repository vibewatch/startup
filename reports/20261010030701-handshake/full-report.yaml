              - CR008
              - CR013
              - CR014
      - number: '7.3'
        title: Dependencies are visible, but their concentration and economics are not
        blocks:
          - type: paragraph
            body: >-
              Handshake's own site claims more than one million companies ready to hire and advertises more than 100 AI
              specialist roles; a live employer job page confirms that the marketplace continues to carry third-party
              postings. B17 News also ties the contractor disputes it investigated to several OpenAI projects. These
              facts establish multiple operating surfaces, but not their revenue mix, customer concentration,
              contractual durability, or margin contribution. The assigned sources disclose no audited revenue, burn,
              runway, gross-to-net AI-services economics, counterparty concentration, payout-funding mechanics, or
              security incident record. Accordingly, client loss, working-capital strain, and margin compression should
              remain unquantified diligence risks rather than assigned probabilities. The decisive evidence is a segment
              bridge between recruiting software and AI services, top-client exposure, project cancellation rights,
              contractor payable aging, and cash runway. A thesis break would be dependence on one client or project for
              a material share of gross profit without committed volume or replacement capacity.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Monitoring must distinguish company evidence from keyword collisions
        blocks:
          - type: paragraph
            body: >-
              Three successful results allocated to this chapter concern unrelated uses of the word “handshake”: an AXI4
              hardware protocol repository, an individual dependency framework, and a confidential-computing
              troubleshooting guide. They are valid documents but provide no evidence about Stryder Corp. or Handshake
              AI. Their presence demonstrates why domain and issuer verification must precede risk scoring; they are
              retained only to preserve the assigned search provenance and are not used to infer company technical
              controls. Monitoring should instead track the Boggs docket, arbitration motions, contractor dispute
              counts, payout reconciliation exceptions, attrition, client concentration, and segment cash consumption.
              No conclusion about the absence of breaches, outages, enforcement, or other incidents is supportable from
              this pool. The risk process should mark those categories as unverified and require primary legal records,
              company control evidence, and customer or counterparty documentation before investment approval.
            claimRefs:
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite a legal outcome from secondary reporting
            body: >-
              The filed action and reported worker accounts justify elevated diligence, but the assigned pool contains
              neither the complaint nor Handshake's response. Investment approval should require primary docket review
              and a quantified exposure analysis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: Monitorable kill criteria
            body: >-
              Pause underwriting if the action advances toward a broad class, payment exceptions recur without
              reconciled ledgers, one AI client represents a material share of gross profit without commitments, or
              runway cannot absorb a labor-model reset.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR005
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Structural Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Evaluating Handshake as an institutional growth investment requires balancing category leadership across
              higher education recruiting with emerging execution risks in frontier AI training services. The core
              investment thesis rests on Handshake's entrenched, defensible three-sided marketplace, which spans 1,200
              educational institutions, over 18 million students and alumni, and more than 550,000 employers including
              100% of the Fortune 500. This proprietary network provides an irreproducible, low-cost acquisition
              flywheel for verified student and graduate talent. Furthermore, Handshake AI leverages this university
              relationship base to supply credentialed, domain-specialist data trainers for reinforcement learning from
              human feedback (RLHF), scaling rapidly to distribute over $15 million in weekly payouts across frontier
              model developers like OpenAI. Conversely, the investment anti-thesis identifies three structural
              vulnerabilities: first, Handshake's baseline recruitment software faces enterprise software multiple
              compression and corporate hiring headwinds relative to 2021-2022 peak levels; second, Handshake AI's rapid
              growth introduces acute misclassification and wage-and-hour liability under federal and California labor
              law; and third, unverified retail tech financing announcements from unrelated entities highlight ongoing
              secondary marketplace opacity.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
      - number: '8.2'
        title: Financing History, Capitalization Context, and Valuation Marks
        blocks:
          - type: paragraph
            body: >-
              Handshake's corporate financing history reflects steady venture capitalization culminating in peak private
              market valuation expansion in January 2022. The company has raised $434 million across 7 documented
              funding rounds since its founding in 2014, progressing through a $3.5 million Seed round in 2015, a $10.5
              million Series A in 2016, a $20 million Series B in 2016, a $40 million Series C at a $275 million
              valuation in 2018, an $80 million Series D in 2020, an $80 million Series E at a $1.5 billion valuation in
              May 2021, and a $200 million Series F at a $3.5 billion post-money valuation led by Coatue in January
              2022. Key institutional backers across these rounds include Coatue Management, Lightspeed Venture
              Partners, Spark Capital, Kleiner Perkins, and True Ventures. However, no primary equity valuation
              repricing has occurred in the subsequent 56 months. Third-party research directory Compworth models
              Handshake's annual revenue at $209.6 million across a workforce exceeding 1,000 employees, implying an
              unverified valuation-to-revenue multiple of 16.7x on stale 2022 headline marks. In addition, automated
              startup databases and news aggregators have conflated Handshake (Stryder Corp.) with a separate
              London-based retail software startup named Handshake Solutions Ltd, which raised a $3.2 million Seed round
              in June 2026. Institutional underwriters must segregate this entity confusion and focus on primary share
              capital structures.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Contractor Litigation, Operational Friction, and Valuation Impairment
        blocks:
          - type: paragraph
            body: >-
              The primary emerging threat to Handshake's operating margin profile and valuation multiples is labor
              litigation surrounding its data labeling division. On July 20, 2026, a proposed class and collective
              action titled Boggs v. Stryder Corp. d/b/a Handshake et al. (Case No. 3:26-cv-07498) was filed in the U.S.
              District Court for the Northern District of California, alleging minimum wage violations under 29 U.S.C. §
              206 of the Fair Labor Standards Act and California Labor Code § 2775 (AB 5). The lawsuit asserts that
              Handshake misclassified thousands of AI annotators as independent contractors while exercising rigorous
              operational control via unilateral hourly rate setting, mandatory proprietary software tooling, unpaid
              training sessions, and strict weekly billing caps. This federal action builds upon earlier legal disputes,
              including an August 2025 contractor lawsuit regarding ChatGPT policy enforcement that settled for $6,475
              in October 2025, and a November 2025 small-claims suit seeking $9,600. Independent reporting confirms
              contractors suffered abrupt account suspensions and unpaid compensation across late 2025 and early 2026.
              Furthermore, Better Business Bureau consumer dispute records reveal 58 total complaints over the past
              three years, with 49 filed in the trailing 12 months alone, illustrating heightened friction across user
              dispute resolution.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Scenario Analysis, Return Hurdle, and Investment Recommendation
        blocks:
          - type: paragraph
            body: >-
              Synthesizing market positioning, growth velocity, and legal overhang results in a balanced three-scenario
              distribution and a decisive 'research-more' recommendation. Under the Bull Case, Handshake AI sustains its
              expansion while maintaining high take rates on trainer disbursements, legal exposure under the Boggs
              action is settled with modest programmatic indemnification or restructuring, and enterprise recruiting
              rebounds, driving a 2028-2029 public market listing at $4.5 billion to $5.5 billion (1.3x to 1.6x 2022
              entry basis). Under the Base Case, recruitment SaaS revenue grows at a modest 10-15% annual pace, AI
              annotation revenue transitions toward specialized, lower-margin agency models under tighter contractor
              compliance, and the company achieves an exit or financing at $2.8 billion to $3.5 billion (0.8x to 1.0x
              multiple). Under the Bear Case, California court enforcement of the ABC test forces retroactive wage and
              payroll tax reclassification, reputational damage impairs university partnership moats, and valuation
              compresses to $1.2 billion to $1.8 billion in a structured down-round or consolidation sale. With
              valuation stance categorized as 'stretched' and risk rating classified as 'high', capital deployment
              should be withheld pending audited disclosure of Handshake AI gross margins and initial class
              certification rulings.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Requirement: Distinguishing Gross AI Flow from Net Revenue'
            body: >-
              Institutional investors evaluating Handshake must not conflate the $15 million in weekly trainer payouts
              distributed via Stripe Global Payouts with Handshake's net recurring revenue. While annualized gross
              disbursements exceed $780 million, data labeling platforms frequently operate on thin transactional
              spreads (15-25%) or pass-through contractor reimbursement models. Diligence teams must demand audited
              income statements separating legacy recruiting SaaS ARR from gross AI billings and net retained margins.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV016
          - type: callout
            title: Class Action and ABC Test Threat to Unit Economics
            body: >-
              The federal collective action Boggs v. Stryder Corp. poses an existential threat to the gross margins of
              Handshake AI. If California courts enforce the rigid ABC test against Handshake AI Solutions LLC, the
              company could face mandatory payroll taxes, overtime liabilities, and back wages for thousands of
              annotators. Investors should treat the January 2022 $3.5 billion valuation as an upper bound subject to
              severe repricing if contractor reclassification is mandated.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV015
