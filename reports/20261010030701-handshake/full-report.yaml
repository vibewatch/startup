        title: Market Boundary and Exclusions
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a bounded market definition rather than a broad HR-technology label. Handshake's
              current site separates employers, job seekers, career centers, and Handshake AI, while its research
              collection describes a path from college to career across students, universities, and recruiters. The
              included market is therefore early-career discovery and recruiting, career-center participation, and paid
              remote AI work offered through the same network. General HRIS, payroll, broad mid-career recruiting, model
              infrastructure, and unrelated freelance marketplaces are adjacencies, not demonstrated Handshake markets.
              One allocated search result concerns a separate 2015 Hong Kong high-school network and is explicitly
              excluded from sizing the current company.
