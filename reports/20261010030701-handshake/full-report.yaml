      - number: '5.2'
        title: Generative AI Orchestration and the LLM Orca Service
        blocks:
          - type: paragraph
            body: >-
              To accelerate generative AI feature delivery without destabilizing core platform services, Handshake
              engineered LLM Orca, a dedicated internal orchestration microservice. Orca serves as a single sanctioned
              entry point for stateless LLM calls with structured outputs, hydrating prompts with Handshake entity IDs
              and routing queries across Google Vertex AI, Anthropic models, and the OpenAI Platform, with Anyscale
              supporting managed Ray clusters. To guarantee reliability and monitor unit costs, every call through LLM
              Orca is traced end-to-end to Arize AX and Datadog. This architecture supports features including
              AI-generated recruiter first-contact messaging, job and skill taxonomy tagging, and candidate search
              assistants evaluated against curated golden test datasets.
            claimRefs:
              - CE004
              - CE005
              - CE006
