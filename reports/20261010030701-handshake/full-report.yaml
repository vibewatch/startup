      - number: '1.4'
        title: Strategic AI Workforce Pivot and Labor Classification Scrutiny
        blocks:
          - type: paragraph
            body: >-
              In response to generative artificial intelligence developments and shifting corporate hiring budgets,
              Handshake initiated a material platform expansion in 2025 and 2026 under the Handshake AI umbrella,
              transforming its student talent pool into a distributed workforce for frontier model evaluation and
              reinforcement learning from human feedback. While chief executive Garrett Lord highlighted premium hourly
              rates between $100 and $125 for specialized technical annotation, this rapid operational pivot has exposed
              Handshake to acute regulatory and labor liability. On July 20, 2026, worker Sean Boggs filed a proposed
              federal class and collective action, Boggs v. Stryder Corp. d/b/a Handshake et al. (Case No.
              3:26-cv-07498), in the U.S. District Court for the Northern District of California. The complaint alleges
              that Handshake and its subsidiary Handshake AI Solutions, LLC willfully misclassified thousands of AI data
              workers as independent contractors under the Fair Labor Standards Act and California Labor Code § 2775.
              The lawsuit targets Handshake's unilateral pay rate adjustments, mandatory proprietary task software,
              weekly billable hour caps, and uncompensated onboarding sessions, compounded by widespread worker
              complaints regarding arbitrary payout withholdings. Defending against California's rigid ABC employment
              test presents a substantial structural risk to the unit economics and operating margins of Handshake's AI
              talent marketplace.
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO013
