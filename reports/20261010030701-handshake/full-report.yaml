      - number: '6.3'
        title: Named Enterprise Deployments, Production Deployments, and Outcomes
        blocks:
          - type: paragraph
            body: >-
              Verified customer evidence confirms widespread production adoption among premier enterprise employers and
              top-tier academic institutions. All 100 Fortune 100 corporations, including American Express, Nike, and
              McDonald's, maintain active recruiting accounts on the network to source collegiate and early-career
              candidates. In the higher education sector, institutions such as The Johns Hopkins University have
              expanded beyond traditional career placement into the Handshake MOVE forum, enabling graduate scholars in
              STEM and humanities disciplines to evaluate frontier generative AI models for commercial compensation. To
              support enterprise onboarding and prevent account churn across mid-market and strategic customers,
              Handshake utilizes Gainsight CS and Skilljar to automate customer education and health monitoring.
              Diligence searches also identified an unrelated UK-based retail software startup operating under the
              Handshake brand with enterprise customers like Gopuff, demonstrating trademark coexistence that requires
              disambiguation in commercial B2B procurement analyses.
            claimRefs:
              - CU001
              - CU003
