      - number: '4.2'
        title: 成本结构、单位经济与利润率兑现
        blocks:
          - type: paragraph
            body: >
              Handshake 的经济画像体现出两种截然不同的毛利率模式。核心大学招聘平台遵循典型 B2B 软件经济性，新增收入除了云托管、客户支持和销售 薪酬外，交付成本很低。然而，Handshake AI
              引入了高成本服务交付模式：专家贡献者从事专业标注和评估工作，报酬可达每小时数百美元。 因此，行业观察人士预计 Handshake AI 超过一半的毛开票额会直接支付给贡献者。


              这种模式使收入确认变得模糊。如果 Handshake 按总额确认 Handshake AI，收入顶部数字会大幅高估公司留存的经济价值和软件运营杠杆。 由于 Handshake 尚未公开发布经审计的 GAAP
              财务报表，合并实体的毛利率无法确认。尽调必须查清贡献者成本是计入销售成本， 还是作为市场支付处理，并确认核心招聘 SaaS 的留存是否足以吸收公司管理费用。
