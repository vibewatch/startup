    title: 产品架构图
    type: stack
    summary: Handshake 核心数字网络、LLM 编排与 AI 评估基础设施的分层视图。
    data:
      layers:
        - label: 客户应用与门户
          detail: 为学生、招聘人员与职业中心管理员提供多边 Web 和移动界面。
          modules:
            - 学生 Web 与移动体验（React、TypeScript）
            - 雇主人才寻找与活动门户
            - 高等教育职业服务工作区
        - label: 应用与领域服务
          detail: 核心招聘业务逻辑、申请人跟踪与候选人发现信息流。
          modules:
            - Ruby on Rails 核心单体应用
            - 用于搜索与候选人信息流的 Go 微服务
            - PostgreSQL 关系存储与 Redis 缓存
        - label: LLM 编排层（Orca）
          detail: 处理无状态 LLM 执行、实体填充与结构化模式输出的范围受限微服务。
          modules:
            - 实体上下文填充引擎
            - 供应商路由网关（Vertex AI 与 OpenAI）
            - 结构化输出校验与模式强制执行
        - label: 可观测性、追踪与评估
          detail: 持续评估生成式 AI 各触点的遥测数据与成本。
          modules:
            - Arize AX 分布式追踪与成本监控
            - Datadog 运营指标与告警
            - LLM 评审器黄金数据集评估循环
        - label: 专家数据与标注基础设施
          detail: 面向学术专家贡献者与前沿模型训练的专有任务分发平台。
          modules:
            - 内部数据标注工作区
            - 资质核验与学术领域路由
            - 合作伙伴付款分发基础设施
        - label: 强化学习环境（RLE）
          detail: 生成多步智能体交互数据的交互式模拟环境。
          modules:
            - 端到端工具与约束模拟器
            - 动态反馈循环收集器
            - 运行于 AWS 与 GCP 的容器化执行环境
