      - number: '3.3'
        title: 公开包装降低进入门槛，但实际经济性不透明
        blocks:
          - type: paragraph
            body: >
              可用比较材料将雇主产品描述为免费增值阶梯：免费的 Basic 计划、消息数量受限的 Plus 计划，以及按年收费但未公开确切价格的企业套件。 Prentus
              描述固定机构费用，但留存页面没有公布金额。现状渠道可能提供免费发布，但其内部人工、筛选负担和转化表现没有量化。
              这些证据支持的是分发与工作流之间的取舍，而不是总成本赢家。转换成本似乎集中在雇主网络连续性、集成、积累的工作流和变更管理上； 最强的竞争来源本身也建议共存，而不是假定能够彻底替换。
