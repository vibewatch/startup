            body: >
              Handshake 通过双引擎商业架构变现其双边大学招聘网络，覆盖企业软件订阅和交易型 AI 服务。公司早期依靠 SaaS 合同发展， 向雇主销售程序化接触 1,500 多所合作大学学生的能力。Handshake
              为小型组织提供免费 Basic 层，但逐步限制关键招聘功能， 促使客户转向年度 Premium 合作伙伴合同。Basic 账户的职位发布窗口限于 30 天，缺少 Talent Lists
              等候选人发现工具，也无法在内部团队成员之间 共享招聘备注或候选人活动。


              相比之下，Premium Employer Partners 支付协商确定的年度许可费，可获得精细的候选人分层、直接消息功能，以及在获批教育机构中的优先曝光。 除招聘 SaaS 外，Handshake 还通过推出
              Handshake AI，大举进入 AI 模型训练。这个新业务线为前沿 AI 研究实验室提供企业数据标注和人类反馈 强化学习（RLHF）合同并从中变现。Handshake
