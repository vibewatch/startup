      - number: '1.2'
        title: 创始人、管理层与董事会治理
        blocks:
          - type: paragraph
            body: >-
              Handshake 的管理层仍由联合创始人兼首席执行官 Garrett Lord 主导；自公司创立以来，他一直担任首席战略设计者和公开发言人。 Lord 身边是一支成熟的运营与职能管理团队，包括总裁兼首席运营官
              Jonathan Stull、首席财务官 Jesse Hulsing、首席技术官 Matt Greenberg 和首席产品官 Vee Sahgal。联合创始人 Ben Christensen 和 Scott
              Ringwelski 早期负责搭建平台数据库架构及大学集成， 后来退出日常管理；Christensen 仍是 Handshake 董事会的活跃成员。公司治理还得到一线投资机构的机构风投董事支持，包括
              Kleiner Perkins 的 Mamoon Hamid、Spark Capital 的 Will Reed、True Ventures 的 Toni Schneider 和 EQT Ventures 的
              Alastair Mitchell；独立董事则包括前 Niantic COO Megan Quinn 及 Montai Therapeutics CEO Margo Georgiadis。公司申报文件显示，
              主要美国运营实体 Stryder Corp. 在 2024 年末有 536 名全职员工，另有专业化子公司提供支持。
