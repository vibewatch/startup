            body: 虽然 Handshake 已将变现扩展至企业招聘套件和 AI 数据评估，管理层没有提供经审计的 NRR 或学校流失数据；指称工人分类错误的集体诉讼 正带来新出现的法律和交易对手风险。
            calloutType: risk
            claimRefs:
              - CU008
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 劳工分类是目前证据最充分的主要法律风险
        blocks:
          - type: paragraph
            body: >-
              两家独立专业出版物报道，Boggs v. Stryder Corp. d/b/a Handshake et al. 于 2026 年 7 月 20 日在加州北区提起。
              文章描述了《公平劳动标准法》和加州劳动法下的主张，以及 Handshake 设定费率、要求使用其平台、限制可计费工时、未补偿部分入职或会议时间的指控。 这些是指控，不是已经裁判的事实；其中一篇文章明确表示，刊发时
              Handshake 尚未回应。因此，依据分配来源无法量化经济风险。 不过，加州报道中的 ABC 框架使控制程度、日常业务性质和独立经营者身份成为核心尽调问题。当前尽调路径是取得起诉书及后续案卷、管理层分类分析、
              工人协议、工时记录和准备金。若集体获认证、强制仲裁动议被驳回，或证据显示争议做法影响大部分标注工群体，投资论点就会被打破。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
      - number: '7.2'
        title: 支付争议带来运营、声誉与交付风险
        blocks:
          - type: paragraph
            body: >-
              B17 News 报道，参与多个 OpenAI 项目的五名承包商描述了突然停工，其中四人称没有收到报酬；该出版物查阅的通信显示，至少一项决定是最终决定且 不提供申诉。Breaking Even 另行描述了
              2026 年 8 月工人关于到账金额低于预期、仪表板信息缺失和争议未解决的报告，同时谨慎地没有推断单一机制。
              这些叙述不能证明系统性中断或违法扣款，但确实暴露出任务计量、规则执行、支持升级和付款核对交界处的控制风险。此前据报道的 $6,475 欠薪裁决，
              提高了将这些情况视为孤立轶闻的代价。管理层应按项目把已接受的任务工时与承包商总负债及现金支付核对，披露争议数量和账龄，并展示独立申诉路径。
              反复出现重大核对断裂或专业人员流失率升高，都会削弱交付可靠性和劳动力供给优势。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
