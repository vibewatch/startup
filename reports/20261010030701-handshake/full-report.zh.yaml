      - number: '4.4'
        title: 资本充足性、现金消耗画像与投资判断
        blocks:
          - type: paragraph
            body: >
              Handshake 未来的资本充足性取决于核心企业招聘业务能否产生正自由现金流，还是仍依赖外部股权融资。公司自 2014 年成立以来累计募集 $434 million 股权资金，最近一次主要注资发生在 2022
              年 1 月，由 Coatue 和 Valiant 领投 $200 million Series F，对应 $3.5 billion 估值。
              这次一级融资之后已过去四年，期间没有新的股权轮，说明公司可能已实现运营自给，也可能依赖 Handshake AI 快速扩张产生的运营现金流。


              但估值基准带来显著投资判断风险。QuantLogix 发布的二级市场估算给出最高 $7.3 billion 的理论标记，同时明确提醒，单笔二级交易反映的是
              不同股份类别，而非全公司估值上调。从投资判断角度看，在管理层提供经审计的分部财务数据、拆分软件 ARR 与代收代付 AI 标注开票额之前， 不能按历史独角兽倍数把 Handshake 当作纯 SaaS 公司定价。
