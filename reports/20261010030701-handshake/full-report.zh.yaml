      - number: '3.2'
        title: 分发是锚点，参与和成果是切入口
        blocks:
          - type: paragraph
            body: >
              Handshake 发布的公司证据强调触达、匹配、消息和雇主访问：公司报告有 20M+ 名经验证学生和校友、1,500+ 所高校及 1M+ 个雇主， 并称上一年度超过 40%
              的申请投向小企业。一条实时公开职位页面确认职位分发仍是可观察的产品触点，但不能证明申请人质量或就业成果。 Prentus 针对的是另一处瓶颈，通过持续咨询、模拟面试和成果收集做营销，同时明确允许学校继续使用
              Handshake 传递职位。 因此，多平台并用是核心竞争模式：点解决方案无需先取代 Handshake 的网络，就能赢得预算和参与度。
