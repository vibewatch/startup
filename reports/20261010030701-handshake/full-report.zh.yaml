      - number: '4.3'
        title: 商业牵引力与私有指标披露
        blocks:
          - type: paragraph
            body: >
              Handshake 的公开商业指标显示收入已具规模，但第三方估算分歧很大。据 TechCrunch 等行业媒体报道，公司年度经常性收入从 2022 年披露的 $100 million 增至 2026 年超过
              $300 million。与此同时，行业分析师 Josh Bersin 估计，核心职位发布和招聘服务收入为 $150 million 至 $200 million；Sacra 则估计 Handshake AI
              的年化毛开票额已达到 $1.1 billion。Compworth 另按超过 1,000 名员工的规模，估算公司收入约为 $209.6 million。


              这些相互冲突的估算凸显出经核验私有指标的全面缺失。净收入留存率（NRR）、客户获取成本（CAC）回收期、毛流失率和雇主客户队列扩张等关键投资判断变量完全未披露。平台拥有超过 1 million
              个注册雇主，Fortune 500 企业也全部参与，足以证明其漏斗顶部触达；但收入究竟来自企业合同还是交易型职位推广，仍是重大尽调缺口。
