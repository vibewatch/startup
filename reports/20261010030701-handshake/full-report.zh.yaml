      - number: '3.4'
        title: 护城河具有结构性，但单靠它还不够
        blocks:
          - type: paragraph
            body: >
              证据支持一个有条件的护城河判断。三边市场可以强化雇主供给、学生需求和职业中心工作流采用；一位竞争对手也把失去雇主网络描述为主要切换成本。但同一来源称，机构可以在 Handshake 之上叠加 AI
              咨询和成果工具，这限制了功能层面的锁定，也为预算分散打开空间。 随着 Handshake 扩张到 AI 工作，信任同样重要：Business Insider 和一家专业工人出版物都报道，法院曾命令
              Handshake 在一宗欠薪争议中向一名承包商支付 $6,475。该事件不能证明平台存在广泛不当行为，但它构成反向证据，说明执行和工人治理风险可能削弱 AI 扩张叙事。
