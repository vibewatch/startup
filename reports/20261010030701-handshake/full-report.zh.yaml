              - CR013
              - CR014
      - number: '7.3'
        title: 依赖关系可见，但集中度与经济性尚不清楚
        blocks:
          - type: paragraph
            body: >-
              Handshake 自己的网站声称有超过一百万家准备招聘的公司，并宣传超过 100 个 AI 专家岗位；一条实时雇主职位页面确认市场仍在承载第三方职位。B17 News 还将其调查的承包商争议与多个 OpenAI
              项目联系起来。这些事实说明平台有多个运营触点，但不能说明收入组合、 客户集中度、合同持久性或利润贡献。分配来源没有披露经审计收入、现金消耗、现金跑道、AI
              服务总额到净额的经济性、交易对手集中度、付款资金机制或安全事件记录。因此，客户流失、营运资金压力和利润率压缩应继续作为未量化的尽调风险，而不是赋予概率。关键证据是招聘软件与 AI
              服务之间的分部桥接、头部客户暴露、项目取消权、承包商应付款账龄和现金跑道。若某一客户或项目在没有承诺量或替代产能的情况下贡献毛利的重大部分，投资论点就会被打破。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 监测必须区分公司证据与关键词碰撞
        blocks:
          - type: paragraph
            body: >-
              分配到本章的三个成功结果涉及“handshake”一词的无关用法：AXI4 硬件协议代码库、个人依赖框架和机密计算故障排查指南。 它们是有效文件，但不提供关于 Stryder Corp. 或 Handshake
              AI 的证据。它们的出现说明风险评分前必须核验领域和发行方；这些文件仅为保留 分配的搜索来源而留存，不能用来推断公司的技术控制。监测应转而跟踪 Boggs 案卷、仲裁动议、承包商争议数量、付款核对例外、人员流失、
              客户集中度和分部现金消耗。仅凭这组材料，无法对违规、宕机、执法或其他事件不存在得出结论。风险流程应将这些类别标记为未核验， 并在投资批准前要求一级法律记录、公司控制证据以及客户或交易对手文件。
            claimRefs:
              - CR015
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 不要依据二手报道判断法律结果
            body: 已提起的诉讼和报道中的工人叙述足以提高尽调优先级，但分配材料既没有起诉书，也没有 Handshake 的回应。投资批准应要求一级案卷审查 和量化的风险敞口分析。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 可监测的否决条件
            body: 如果诉讼向广泛集体推进、付款例外反复出现且没有对账账簿、某一 AI 客户在没有承诺的情况下占毛利重大部分，或现金跑道无法承受劳工模式重置， 就应暂停投资判断。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR005
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与结构性反论点
        blocks:
          - type: paragraph
            body: >-
              将 Handshake 评估为机构成长型投资，需要在其高等教育招聘领域的品类领导地位与前沿 AI 训练服务中的新出现执行风险之间取得平衡。 核心投资论点建立在 Handshake
              根深蒂固且可防守的三边市场上：覆盖 1,200 所教育机构、超过 18 million 名学生和校友，以及超过 550,000 个雇主，其中包括 100% 的 Fortune
              500。这个专有网络为经核验的学生和毕业生人才提供了难以复制、低成本的获客飞轮。 此外，Handshake AI 利用大学关系基础，为人类反馈强化学习（RLHF）提供有资质的领域专家数据训练者，并快速扩张到每周向
              OpenAI 等前沿模型开发者发放超过 $15 million。反论点则指出三项结构性脆弱点：第一，相较 2021-2022 年高峰，基础招聘软件面临企业软件倍数 压缩和企业招聘逆风；第二，Handshake
              AI 的快速增长在联邦及加州劳动法下引入严重的错误分类和工时工资责任；第三，无关实体未经核验的 零售科技融资公告，凸显二级市场持续不透明。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV013
      - number: '8.2'
        title: 融资历程、资本化背景与估值标记
        blocks:
          - type: paragraph
            body: >-
              Handshake 的公司融资历程体现出稳步的风险资本化，并在 2022 年 1 月达到私募市场估值扩张高峰。自 2014 年创立以来，公司已完成 7 轮有记录融资，累计 $434 million：2015 年
              $3.5 million Seed 轮、2016 年 $10.5 million Series A、2016 年 $20 million Series B、2018 年 $40 million Series
              C（估值 $275 million）、2020 年 $80 million Series D、2021 年 5 月 $80 million Series E（估值 $1.5 billion），以及 2022 年
              1 月由 Coatue 领投的 $200 million Series F（投后估值 $3.5 billion）。 各轮主要机构支持者包括 Coatue Management、Lightspeed Venture
              Partners、Spark Capital、Kleiner Perkins 和 True Ventures。 但在随后 56 个月中，没有发生一级股权估值重定价。第三方研究目录 Compworth 按超过
              1,000 名员工的规模估算 Handshake 年收入为 $209.6 million，相当于以过时的 2022 年公开估值计算、未经核验的 16.7x 估值收入倍数。此外，自动化初创公司数据库和新闻聚合器 将
              Handshake（Stryder Corp.）与另一家名为 Handshake Solutions Ltd、位于伦敦的零售软件初创公司混淆；后者于 2026 年 6 月 筹集了 $3.2 million
              Seed 轮。机构投资判断必须分离这类实体混淆，聚焦一级股份资本结构。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 承包商诉讼、运营摩擦与估值减损
        blocks:
          - type: paragraph
            body: >-
              当前最先浮现、并可能侵蚀 Handshake 经营利润率和估值倍数的威胁，是围绕其数据标注业务的劳工诉讼。2026 年 7 月 20 日，一宗拟议的集体及共同诉讼 Boggs v. Stryder Corp.
              d/b/a Handshake et al.（案件编号 3:26-cv-07498）向美国加利福尼亚州北区联邦地区法院提起，指控违反《公平劳动标准法》29 U.S.C. § 206 及《加州劳动法》§
              2775（AB 5）规定的最低工资要求。诉讼称，Handshake 将数千名 AI
              标注员错误归类为独立承包商，却通过单方面设定时薪、强制使用专有软件工具、安排无薪培训，以及设置严格的周度计费上限，对他们实施严密的运营控制。这宗联邦诉讼延续了此前的法律纠纷，包括一宗涉及 ChatGPT
              政策执行的承包商诉讼（2025 年 8 月提起、2025 年 10 月以 $6,475 和解），以及一宗于 2025 年 11 月提起、索赔 $9,600 的小额索赔诉讼。独立报道证实，承包商在 2025 年末至
              2026 年初遭遇账户突然暂停和报酬拖欠。此外，Better Business Bureau 的消费者纠纷记录显示，过去三年共收到 58 起投诉，其中仅最近 12 个月就有 49
              起，说明用户争议解决环节的摩擦明显加剧。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: 情景分析、回报门槛与投资建议
        blocks:
          - type: paragraph
            body: >-
              综合市场定位、增长速度和法律拖累后，结论是三种情景分布较为均衡，建议明确为“继续研究”。在乐观情景下，Handshake AI 延续扩张，同时保持较高的培训师付款抽成率；Boggs
              案项下的法律风险通过有限的项目化赔偿或重组得到解决；企业招聘业务回暖，推动公司在 2028-2029 年以 $4.5 billion 至 $5.5 billion 上市（相当于 2022 年进入基准的 1.3x
              至 1.6x）。在基准情景下，招聘 SaaS 收入以每年 10-15% 的温和速度增长；在更严格的承包商合规要求下，AI 标注收入转向专业化、低利润率的代理模式；公司以 $2.8 billion 至 $3.5
              billion 完成退出或融资（0.8x 至 1.0x 倍数）。在悲观情景下，加州法院执行 ABC 测试，迫使公司追溯重分类工资和薪资税；声誉受损削弱其大学合作壁垒；估值在结构化下轮融资或整合出售中压缩至
              $1.2 billion 至 $1.8 billion。鉴于估值判断为“偏高”、风险评级为“高”，在 Handshake AI 披露经审计的毛利率并公布初步集体认证裁定前，应暂缓投入资本。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV016
