      - number: '2.4'
        title: 需求驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              AI 同时是需求驱动因素和约束。Wesleyan 的职业中心页面引用 Handshake 数据，称 2026 届学生正在适应不断变化的早期职业市场， 而各院校仍在摸索转型；Handshake
              自己的英国索引则强调申请量和技能优先招聘。现有证据没有量化这些变化究竟会增加雇主付费需求， 还是只会增加平台活动。一篇独立博客报道了 2026 年 7 月涉及 AI
              标注工分类的拟议集体及共同诉讼，但作者明确表示没有读过起诉书。 因此，劳工模式暴露是尽调问题，而不是已被证明的责任。一级市场规模、预算归属、变现、留存和诉讼记录仍是重大缺口。
