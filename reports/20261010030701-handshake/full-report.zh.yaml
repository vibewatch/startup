  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与排除项
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一个有边界的市场定义，而不是宽泛的 HR 科技标签。Handshake 当前网站将雇主、求职者、职业中心和 Handshake AI
              分开呈现；其研究合集则描述从大学到职业、连接学生、大学和招聘者的路径。因此，纳入范围是早期职业发现与招聘、职业中心参与， 以及通过同一网络提供的付费远程 AI 工作。通用
              HRIS、薪资系统、广义中期职业招聘、模型基础设施和无关自由职业市场属于相邻领域， 不是已获证明的 Handshake 市场。一次被分配的搜索结果涉及另一个 2015
              年香港高中网络，已明确排除在当前公司的市场规模测算之外。
            claimRefs:
              - CM001
