  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合横跨系统、网络、点解决方案和内部工作流
        blocks:
          - type: paragraph
            body: >
              Handshake 面对的不是一个同质化类别。公司材料将服务定位为大型早期职业网络，而竞争对手撰写的比较则把雇主招聘运营与学生参与、 咨询、成果收集、报告和内容分发分开。按这一框架，Symplicity 和
              12twenty 接近职业中心的记录系统层；Prentus、Suitable 和 uConnect 聚焦更窄的参与或成果任务；LinkedIn Recruiter 覆盖广泛的专业招聘；内部网站、Google
              Jobs、通用招聘网站和社交媒体则是现状替代方案。 现有材料没有大多数点名供应商的一级资料，所以下述画像是方向性的，并非完整或独立核验的市场普查。
