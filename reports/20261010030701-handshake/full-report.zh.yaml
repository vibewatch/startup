      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 尽调要求：区分 AI 总流水与净收入
            body: >-
              评估 Handshake 的机构投资者不得把经由 Stripe Global Payouts 发放的每周 $15 million 培训师付款，与 Handshake
              的净经常性收入混为一谈。按年化计算，毛额付款超过 $780 million；但数据标注平台往往只有 15-25% 的薄交易价差，或采用代承包商报销的过账模式。尽调团队必须索取经审计的损益表，将传统招聘 SaaS
              ARR 与 AI 总开票额及净留存利润率分开列示。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV016
          - type: callout
            title: 集体诉讼与 ABC 测试对单位经济模型的威胁
            body: >-
              联邦共同诉讼 Boggs v. Stryder Corp. 对 Handshake AI 的毛利率构成生死攸关的威胁。如果加州法院对 Handshake AI Solutions LLC 执行严格的 ABC
              测试，公司可能需要为数千名标注员承担强制性薪资税、加班责任和欠付工资。若承包商重分类成为强制要求，投资者应把 2022 年 1 月的 $3.5 billion 估值视为上限，并预期估值大幅重定价。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV015
