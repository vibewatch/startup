        - 在劳动者全部重新分类的情况下，对下行赔偿与工资税负债进行建模
      - - 估值立场
        - 拉伸
        - 2022 年 1 月 $3.5B 投后估值反映软件估值倍数高峰；56 个月来没有主要重新定价
        - 目标是以低于 Series F 优先股标价 35%–50% 的折价购买二级股份
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV016
  - id: TV002
    title: 投资论点与反论点分析矩阵
    notes: 依据主要来源证据与外部法律案卷里程碑，评估核心论点。
    columns:
      - 论点维度
      - 看多论点
      - 看空反论点的脆弱点
      - 哪些事实会改变判断
    rows:
      - - 市场网络壁垒
        - 覆盖 1,200 家机构与 55 万家雇主的三边平台占据主导地位，构成难以逾越的分发壁垒
        - 校园招聘面临企业招聘人数收紧，学生也持续投诉未经审核的职位信息
        - 多年期企业合同续约数据表明净收入留存率高于 115%
      - - AI 数据扩张
        - 规模迅速扩大至每周超过 $15M 的支付额，确立 Handshake 作为前沿实验室一级人工数据合作伙伴的地位
        - 总支付流量掩盖真实净收入；承包商不满与突然冻结付款会带来流失风险
        - 披露净留存抽成率及与基础模型 AI 实验室签订的多年期主服务协议
      - - 劳动与监管风险
        - 专业标注员的时薪达到 $100–$125，且具有约束力的仲裁协议限制集体责任
        - Boggs 集体诉讼依据加州 ABC 测试挑战承包商身份；可能面临未付工资与罚金
        - 法院执行有约束力的仲裁弃权，或作出有利的集体诉讼去认证裁定
      - - 资本结构与估值
        - 一线银团（Coatue、Lightspeed、Spark、Kleiner Perkins）有能力将流动性桥接至公开市场
        - 过时 56 个月的 $3.5B 估值意味着，相比公开招聘科技同业，倍数已明显压缩
        - 执行公平交易的二级交易，或开展新的主要融资，形成清晰的市场出清价格
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV013
  - id: TV003
    title: 看多、基准与看空情景估值模型
    notes: 估值区间基于宏观招聘环境、AI 训练利润率稳定性及诉讼结果进行估算。
    columns:
      - 情景
      - 关键运营假设
      - 隐含估值区间
      - 目标回报倍数
      - 关键风险与下行触发条件
      - 概率权重
    rows:
      - - 乐观情景
        - 企业招聘增长反弹至 20% 以上；Handshake AI 净利润率扩大至 25% 以上；Boggs 诉讼以有利结果和解
        - $4.5B - $5.5B
        - 1.3x - 1.6x
        - 更广泛的科技招聘冻结；对自主模型训练数据的监管限制
        - 25%
      - - 基准情景
        - 校园招聘 SaaS 增长 10%–12%；AI 训练维持业务量，但以 15% 代理商利润率运营；诉讼成本较小
        - $2.8B - $3.5B
        - 0.8x - 1.0x
        - HR 科技行业整体倍数压缩；工资与工时合规开支增加运营费用
        - 50%
      - - 悲观情景
        - 企业招聘合同收缩；联邦法院依据加州 ABC 测试批准集体认证；声誉受损
        - $1.2B - $1.8B
        - 0.3x - 0.5x
        - 强制重新分类为雇员、巨额拖欠工资税，以及失去主要大学职业网络的排他性
        - 25%
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV016
