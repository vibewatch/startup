      - number: '1.4'
        title: AI 劳动力战略转向与劳工分类审查
        blocks:
          - type: paragraph
            body: >-
              面对生成式人工智能发展和企业招聘预算变化，Handshake 在 2025 和 2026 年以 Handshake AI 为旗号大幅扩展平台，把学生人才池
              转化为服务前沿模型评估和人类反馈强化学习的分布式劳动力。首席执行官 Garrett Lord 曾强调，专业技术标注的时薪可达 $100 至 $125，但这次快速转向也让 Handshake
              暴露于尖锐的监管和劳工责任风险。2026 年 7 月 20 日，工人 Sean Boggs 在加州北区 美国联邦地区法院提起拟议中的联邦集体及共同诉讼 Boggs v. Stryder Corp. d/b/a
              Handshake et al.（案号 3:26-cv-07498）。 起诉书指称，Handshake 及其子公司 Handshake AI Solutions, LLC 依据《公平劳动标准法》和《加州劳动法》第
              2775 条，故意将数千名 AI 数据工人错误归类为独立承包商。诉讼针对 Handshake 单方面调整薪酬、强制使用专有任务软件、设置每周可计费工时上限以及未支付
              入职培训费用等做法；工人还普遍投诉任意扣留报酬。面对加州严格的 ABC 雇佣测试，Handshake 的辩护将给 AI 人才市场的单位经济和 运营利润率带来重大结构性风险。
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO013
