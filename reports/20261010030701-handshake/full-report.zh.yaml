      - number: '1.3'
        title: 资本化历程、估值标记与网络规模
        blocks:
          - type: paragraph
            body: >-
              Handshake 累计完成七轮机构股权融资，约 $434 million。2021 年 5 月，公司完成 $80 million Series E，投后估值达到 $1.5 billion，
              由此跻身独角兽；2022 年 1 月又完成 Coatue Management 领投的 $200 million Series F。该轮投后估值升至 $3.5 billion，Lightspeed Venture
              Partners、Spark Capital、Kleiner Perkins、True Ventures、Notable Capital、EQT 和 Chan Zuckerberg Initiative
              等知名机构均有参与。支撑这一估值的是 Handshake 庞大的三边网络。公司官方口径显示，网络覆盖超过 25 million 名注册知识工作者、1,600 所高等教育机构，以及美国和海外市场的 1
              million 个雇主账户。平台称，其覆盖美国排名最高院校中的 92 percent、全部八所常春藤大学，以及 Fortune 500 企业的 100 percent。不过，自 2022
              年初以来，公开市场再无新的估值价格发现；Handshake 仍将当前 GAAP 收入、软件毛利率、运营现金消耗和净收入留存率列为严格保密的私有指标。
