chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历程与使命
        blocks:
          - type: paragraph
            body: >-
              Handshake 是 Stryder Corp. 的商业品牌和主要运营服务。Stryder Corp. 是一家企业科技公司，2014 年 1 月在特拉华州注册， 总部位于加利福尼亚州旧金山 225 Bush
              Street。公司起源于密歇根州 Houghton 的 Michigan Technological University； 本科生 Garrett Lord、Ben Christensen 和 Scott
              Ringwelski 发现了大学招聘中严重的结构性摩擦。传统校园就业服务和校园招聘会 偏向少数精英大学及地理上集中的雇主，三位创始人因此打造 Handshake，试图为新兴人才建立开放的数字职业网络。
              经过超过十二年的持续运营扩张，Handshake 已从最初的中西部大学试点，发展为在旧金山、纽约、伦敦、丹佛和班加罗尔设有
              公司办公室的国际就业网络。如今，公司将核心产品基础设施定位为人工智能经济的职业网络，覆盖早期职业实习、专业全职安置 以及分布式 AI 训练工作。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
              - CO009
              - CO015
