      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              这是一个多边平台，但公开页面比付费方更清楚地识别了参与者。雇主和职业中心是可见的组织受众；求职者使用匹配、建议、活动和 职位列表；Handshake AI 提供付费远程工作。American Portwell
              Technology 的一条实时入门级职位信息确认市场上存在雇主发布的职位供给， 但单条职位不能证明流动性或转化。Gainsight 发布的供应商案例研究称，Handshake 使用 Gainsight CS 和
              Skilljar，通过应用内、电子邮件、 人工及课程触点完成入职、分层和客户教育。这种运营模式意味着客户购买后仍需持续启用，但合同负责人、价格、采购周期和留存仍未披露。
