      - ['Grand View Research', '2026', 'Global', '$25.6B carbon black market estimate', '5.0% (2026-2033)', 'Forward analyst estimate for the same category', 'medium', 'Forecasted broad market estimate only']
      - ['Grand View Research', '2033', 'Global', '$36.1B carbon black market forecast', '5.0% (2026-2033)', 'Long-range carbon black forecast', 'medium', 'Long-dated projection rather than near-term company demand']
      - ['Grand View Research', '2025', 'Global', '68.8% tire application share', null, 'Application mix within carbon black demand', 'medium', 'Share of carbon-black demand, not Monolith''s share']
      - ['Nebraska Examiner', '2022', 'United States', '$8B federal clean-hydrogen hub program', null, 'Policy-capital lens tied to four national hubs', 'medium', 'Infrastructure-capital context, not product revenue']
      - ['MHI / Monolith press release', '2020', 'Nebraska plant proxy', '14,000 mt/year OC1 carbon black capacity', null, 'Commercial plant-capacity proxy rather than market estimate', 'high', 'Supply-side scale proxy, not SAM or SOM']
    notes: >-
      These are public sizing lenses rather than a clean TAM/SAM/SOM stack. Dollar markets, application
      share, policy capital, and plant-capacity proxies are intentionally shown together because no retained
      source isolates Monolith's own served market or expected share.
    claimRefs: [CM004, CM007, CM008, CM009, CM010]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ['Tire and industrial rubber carbon black', 'Tire and rubber manufacturers', 'Formulation, compounding, and plant teams', 'Industrial procurement', 'Material qualification into existing rubber supply chains', 'Materials procurement / plant operations', 'Spec parity, supply reliability, and lower-emission sourcing']
      - ['Specialty carbon black uses', 'Plastics, coatings, inks, battery, and electronics manufacturers', 'Product engineering and formulations teams', 'Industrial procurement', 'Additive and pigment selection in existing product lines', 'R&D plus materials procurement', 'Performance and sustainability value in higher-spec applications']
      - ['Ammonia / fertilizer path', 'Fertilizer producers, distributors, and offtake counterparties', 'Agricultural input channels and industrial ammonia users', 'Commodity purchasers / project counterparties', 'Plant output sold into fertilizer or industrial ammonia workflows', 'Commercial offtake and project finance', 'Hallam build completion plus competitive delivered economics']
      - ['Hydrogen infrastructure and industrial decarbonization', 'Regional industrial users and hydrogen-hub participants', 'Operations teams at industrial or power facilities', 'Project sponsors and public-private capital pools', 'Hub formation and project contracting', 'Corporate capex and program funding', 'Policy support, permits, and plant readiness']
    notes: >-
      Buyer map blends direct evidence with explicit workflow inference from the retained sources; Monolith's
      carbon-black route is nearer-term procurement demand, while ammonia and broader hydrogen adoption rely
      on project execution and counterparties rather than simple seat-based sales.
    claimRefs: [CM004, CM006, CM009, CM011, CM012, CM016]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports layered, non-additive lenses from broad carbon-black demand down to Monolith's
      plant-scale proxy rather than a clean published SAM/SOM.
    data:
      items:
        - label: Global carbon black TAM (2025)
          displayValue: $24.5B
          note: Broad market estimate from Grand View Research.
          claimRefs: [CM007]
        - label: Global carbon black TAM (2033)
          displayValue: $36.1B
          note: Forecast lens; not a near-term Monolith revenue forecast.
          claimRefs: [CM008]
        - label: Tire share of 2025 carbon black demand
          displayValue: 68.8%
          note: Largest application slice in Grand View's market view.
          claimRefs: [CM009]
        - label: U.S. hydrogen-hub program pool
          displayValue: $8B
          note: Federal infrastructure-capital lens across four hubs, not product revenue.
          claimRefs: [CM010]
        - label: Hallam ammonia expansion
          displayValue: $1B project
          note: Company project-scale proxy for ammonia upside.
          claimRefs: [CM011]
        - label: OC1 designed carbon black capacity (2020 source)
          displayValue: 14,000 mt/year
          note: Published designed-capacity proxy rather than a current production result.
          claimRefs: [CM004]
    approximationNotes: >-
      Layers are intentionally non-additive. They combine broad market size, application share, policy-capital,
      and plant-scale proxies because no retained source isolates a Monolith-specific SAM or SOM.
    claimRefs: [CM004, CM007, CM008, CM009, CM010, CM011]
callouts:
  - calloutType: insight
    title: Three industrial demand pools matter more than one generic hydrogen TAM
    body: >-
      The evidence supports Monolith's carbon-black route with hydrogen and ammonia adjacency,
      not as a catch-all clean-hydrogen platform. That boundary discipline keeps the TAM grounded in actual
      industrial outputs rather than unrelated climate or software spending.
    claimRefs: [CM001, CM002, CM003, CM005, CM006]
  - calloutType: risk
    title: The ammonia upside is the least de-risked leg of the market story
    body: >-
      Public reporting still ties the ammonia buildout to large capex, public-program support, and unresolved
      loan/financing risk. That makes the ammonia market opportunity real but materially less proven than the
      carbon-black route.
    claimRefs: [CM011, CM015, CM016]
  - calloutType: assumption
    title: Public evidence bounds the market, but does not isolate Monolith's served share
    body: >-
      The chapter can defend broad market and policy lenses plus plant-capacity proxies, but not a precise
      Monolith-specific SAM, SOM, or volume-share forecast. Any tighter sizing requires customer, pricing,
      and contracted offtake data outside the retained public pool.
    claimRefs: [CM007, CM008, CM009, CM010]
