    notes: >-
      Boundary table separates Monolith's evidenced industrial end-markets from adjacent narratives that
      would overstate the addressable market; rows are non-additive and mix current and planned demand pools.
    claimRefs: [CM001, CM002, CM003, CM005, CM006, CM010, CM012]
