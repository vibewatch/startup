      - ['Hydrogen infrastructure policy', 'Hydrogen-hub and decarbonization infrastructure capital linked to industrial hydrogen deployment', 'General climate grants with no hydrogen-production link', 'DOE, state partners, regional industrial users', 'Enablement lens for adoption timing, not direct product revenue']
