- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - current read
  - what would change the view
  rows:
  - - Commercial-scale process proof exists at Olive Creek 1.
    - Thesis
    - Independent 2025-2026 operating metrics from the plant would strengthen conviction beyond company-controlled evidence.
  - - Claimed process economics are directionally attractive versus conventional carbon black.
    - Thesis
    - Third-party validation of realized yields, uptime, and delivered cost would move this from narrative to underwriting input.
  - - Strategic investors and infrastructure partners indicate external belief in the platform.
    - Thesis
    - New disclosed offtake, project-finance, or follow-on equity terms from independent sources would improve price support.
  - - The last disclosed valuation anchor is a 2022 unicorn mark, not a current priced reference.
    - Anti-thesis
    - A new priced round, secondary mark, or M&A-style benchmark would materially improve comparability.
  - - DOE and project-financing uncertainty can impair scale timing and bargaining power.
    - Anti-thesis
    - Signed confirmation that DOE support survives or is replaced with committed capital would reduce downside financing risk.
  - - Public-comp evidence is thin and points to mature-materials multiples rather than venture scarcity pricing.
    - Anti-thesis
    - Evidence that Monolith already has superior growth, margins, and conversion economics versus mature peers would justify paying a richer multiple.
  notes: Rows separate company-quality evidence from price-support evidence; a strong technology story alone does not justify a private entry price.
