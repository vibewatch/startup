- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation/return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - DOE or replacement capital closes cleanly, Olive Creek 2 financing is secured, and Monolith converts commercial proof into multi-train scale-out.
    - A price at or above the old unicorn mark is defensible only if fresh operating and financing disclosures show scale economics improving faster than mature-material peers imply.
    - Construction slippage, customer concentration, and dilution from late-stage project capital.
    - Requires fresh independent evidence, not yet present, on revenue growth, cash sufficiency, and committed capital.
  - - Base
    - Technology remains differentiated, Olive Creek 1 continues to validate the process, but public financial disclosure stays thin and financing clarity remains incomplete.
    - Use milestone-based entry discipline; treat the current mark as unproven rather than obviously cheap or obviously impossible.
    - Execution drift, opaque cap-table terms, and overpaying before economics are disclosed.
    - Best fit with the current pool because core technical proof exists but price support does not.
  - - Bear
    - Loan support is canceled or delayed, reported cash pressure persists, and the next scale step requires expensive capital or a reset in expectations.
    - Expect a down round, structured capital, or a hold period too long for attractive risk-adjusted return at the old mark.
    - Loss of financing leverage, delayed commercialization, and valuation compression versus public-materials peers.
    - Adverse reporting already provides concrete downside signals even before full current financials are public.
  notes: No precise valuation range is stated because the assigned pool lacks current revenue, gross margin, EBITDA, cash, and ownership-term disclosures needed for defensible point estimates.
