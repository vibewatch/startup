- id: scenario-framing-and-valuation-discipline
  title: Scenario framing and valuation discipline
  body: 'A credible bull case requires more than technology differentiation; it needs evidence that Monolith can finance and commission the next phase without punitive dilution or long slippage. The base case therefore centers on milestone-based monitoring rather than a hard target multiple: the known unicorn mark can only be defended if the company produces updated operating and financing proof that is absent from public sources today. The bear case is easier to describe than to price precisely, because adverse reporting already points to cash strain, DOE loan uncertainty, and project-delay risk, each of which could force a down round, structured capital, or a much longer hold period than venture-style underwriting typically assumes.'
  claimRefs:
  - CV006
  - CV007
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  tableRefs:
  - TV003
- id: final-diligence-asks-and-thesis-breakers
  title: Final diligence asks and thesis-breakers
  body: 'Before underwriting price, investors need three things the public record does not currently provide: a current income-statement and cash-flow view, a current cap-table and preference map, and a signed financing-status update for DOE and Olive Creek 2. The core thesis breaks if commercial-scale proof remains confined to a single asset while the next asset loses funding, if current financial data shows the business cannot bridge to self-funding milestones without harsh terms, or if public-comp valuation support stays limited to mature commodity-materials multiples while Monolith still asks investors to pay through the 2022 unicorn mark. In that state, the right next action is diligence expansion rather than commitment.'
