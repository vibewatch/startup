- id: thesis-quality-versus-price-support
  title: Thesis quality versus price support
  body: 'The pro-thesis is real: Monolith presents a differentiated methane-pyrolysis process, claims materially better feedstock conversion than conventional carbon black production, and has strategic backers and infrastructure partners that would not exist around a pure concept company. The anti-thesis is just as real: most of the best commercialization evidence is company-controlled or investor-controlled, the last publicly cited valuation anchor is old, and the only clean public comp in this pool is Cabot, a mature listed carbon-materials business trading at modest revenue multiples. That means the investment question is no longer whether Monolith has an interesting technology, but whether new investors can buy into the next stage of scale-up at terms that compensate for execution, dilution, and financing risk.'
