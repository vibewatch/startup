evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-visibility
    missingEvidence: Current total raised, current valuation mark, latest priced-round terms, and live debt or loan draw status.
    whyItMatters: >-
      These numbers are required to underwrite dilution risk, capital sufficiency, and whether the historical unicorn
      round still anchors today's price.
    diligencePath: >-
      Request the latest board deck, cap table, debt summary, and any investor-update materials covering post-2022
      financing changes.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: Current revenue, gross margin, customer count, and a current employee count.
    whyItMatters: >-
      The company-overview chapter can identify Monolith and its sponsor set, but it cannot size commercial traction or
      operating leverage from the assigned public pool.
    diligencePath: >-
      Obtain a management KPI pack, HR headcount export, and customer concentration schedule tied to the current fiscal
      year.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: founders
    missingEvidence: Primary documentation confirming whether Bill Brady was a founder or later board participant only.
    whyItMatters: >-
      Founder attribution is not central to the underwriting call, but it affects biography accuracy and board-history
      interpretation.
    diligencePath: Check incorporation records, early financing documents, and the company's own historical bio materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table coverage
    missingEvidence: >-
      Full biographies, tenure dates, and role scopes for every current executive and board member listed on the
      official page.
    whyItMatters: >-
      Current public evidence is strong enough to identify named leaders, but not strong enough to assess succession
      depth or board-committee oversight.
    diligencePath: >-
      Request an org chart, board roster with committee assignments, and executive biographies used in financing or
      recruiting materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map coverage
    missingEvidence: Ownership percentages, board rights, DOE covenant detail, and customer concentration by account.
    whyItMatters: >-
      Public names alone do not reveal who can block financing decisions, how exposed Monolith is to one project
      counterparty, or how concentrated demand may be.
    diligencePath: Request the cap table, investor-rights summary, debt or guarantee agreements, and top-customer schedule.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      Monolith-specific demand segmentation, contracted offtake volumes, and a management-backed SAM/SOM bridge by end
      market.
    whyItMatters: >-
      A valuation case needs more than a broad carbon-black TAM and policy-capital context to support share or revenue
      expectations.
    diligencePath: >-
      Request plant-level output allocation, customer pipeline, contracted volumes, and pricing assumptions for carbon
      black and ammonia.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-concentration
    missingEvidence: >-
      Named customer mix, procurement concentration, and any committed buyer or offtaker split between carbon black and
      ammonia.
    whyItMatters: >-
      Buyer concentration and budget ownership determine adoption speed and downside risk more directly than broad
      industry TAM estimates.
    diligencePath: >-
      Ask management for top-customer exposure, qualification status, and any signed offtake or supply agreements by
      output line.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: ammonia-financing
    missingEvidence: Final DOE decision, current project-finance plan, and an updated construction schedule for the ammonia expansion.
    whyItMatters: The most expansive market leg in the thesis is also the one most exposed to financing and schedule slippage.
    diligencePath: Confirm DOE status, debt/equity replacement plans, and latest capex timeline directly with the company or lenders.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Customer contracts or quoted prices for Monolith carbon black, hydrogen, and ammonia, plus equivalent incumbent
      offers.
    whyItMatters: >-
      Public evidence supports differentiation claims, but without realized pricing and contract structure the team
      cannot judge whether the moat is margin-accretive or merely greener.
    diligencePath: >-
      Obtain current price sheets, contract tenors, rebate schedules, and at least two signed customer or distributor
      agreements for Monolith and incumbent alternatives.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-visibility
    missingEvidence: >-
      Current public documentation on named methane-pyrolysis or turquoise-hydrogen peers, likely entrants, and credible
      internal-build alternatives for Monolith's target buyers.
    whyItMatters: >-
      The assigned pool shows strong route-based competition but weak direct-peer visibility, which limits how
      confidently the report can benchmark Monolith's moat durability against emergent entrants.
    diligencePath: >-
      Build a current peer roster from industry conference agendas, trade coverage, vendor websites, and buyer RFPs,
      then collect like-for-like capability and customer evidence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: missing-private-metrics
    missingEvidence: >-
      Audited or management-provided revenue, customer concentration, realized pricing, and gross-margin disclosure by
      product stream.
    whyItMatters: >-
      Capacity and partnerships cannot be translated into revenue quality, payback, or margin durability without these
      figures.
    diligencePath: >-
      Request 2024-2026 monthly revenue bridge by carbon black, hydrogen, and ammonia, including top customers and
      realized ASPs.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Current cash balance, burn, debt service profile, covenant package, and runway under base and downside cases.
    whyItMatters: Capital adequacy and dilution risk cannot be underwritten from project descriptions alone.
    diligencePath: >-
      Obtain latest board package or lender materials showing unrestricted cash, monthly cash burn, and financing plan
      through OC2 milestones.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: doe-support
    missingEvidence: Primary documentation on the live status, conditions precedent, and timing of Monolith's DOE support.
    whyItMatters: >-
      The difference between closed, conditional, delayed, or canceled support materially changes capital adequacy and
      project completion risk.
    diligencePath: Request DOE term sheet, draw conditions, sponsor correspondence, and the latest financing-status memo.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Plant-level yield, feedstock cost, power cost, maintenance capex, and conversion-loss assumptions for carbon
      black, hydrogen, and ammonia.
    whyItMatters: Public capacity and partner evidence do not reveal whether the process can earn acceptable gross margins at scale.
    diligencePath: >-
      Request operating model outputs, engineering assumptions, and sensitivity analysis for commodity-price and
      utilization swings.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: plant-performance
    missingEvidence: Line-level uptime, conversion yield, energy intensity, maintenance, and product rejection data for Olive Creek 1.
    whyItMatters: >-
      Commercial-scale operation is more persuasive than a pilot, but underwriting technology maturity still requires
      operating KPIs rather than capacity headlines.
    diligencePath: >-
      Request monthly plant KPI packs, maintenance history, grade-level qualification results, and realized output split
      between hydrogen and carbon black.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public safety, cybersecurity, privacy, product-quality, and incident-control documentation for Monolith's
      operating plant and ammonia expansion.
    whyItMatters: >-
      Industrial scale-up risk depends on controls and quality systems as much as reactor design, and the assigned
      public pool cannot support a clean trust/compliance conclusion.
    diligencePath: >-
      Request HAZOP/process-safety materials, OT/cyber controls, ISO or equivalent quality certifications, and incident
      logs for Olive Creek operations.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A practitioner-community or engineering proxy showing control-software maturity, integration burden, or operator
      experience.
    whyItMatters: >-
      This chapter's evidence strategy called for developer-signal or a close proxy, but the assigned pool is dominated
      by financing and corporate narratives instead of practitioner evidence.
    diligencePath: >-
      Request automation architecture, integrator references, engineering talk/recruiting detail, and operator or
      customer technical references.
  - type: missing-source
    severity: material
    topic: customer-durability
    missingEvidence: >-
      Exact customer count, renewal rates, churn, NRR, GRR, contract length, and cohort disclosures for carbon black and
      hydrogen/ammonia buyers.
    whyItMatters: >-
      Without these metrics, the chapter cannot distinguish a small number of strategic pilots from a durable
      repeat-purchase customer base.
    diligencePath: >-
      Request a cohort bridge by product line, signed-customer count, top-customer share, renewal history, and current
      contracted volume by output.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Additional named customer case studies or contract disclosures beyond Goodyear and NPPD.
    whyItMatters: A thin named-reference set raises concentration risk and leaves expansion claims under-supported.
    diligencePath: >-
      Obtain customer-reference calls, executed offtake agreements, or at least three current named deployments split
      across carbon black, hydrogen, and ammonia channels.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: replacement-financing
    missingEvidence: >-
      Current cash balance, burn/runway, DOE closing status, and committed replacement financing if federal support
