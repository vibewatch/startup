      - Value / status
      - Date
      - Confidence
      - Gap / note
    rows:
      - ["Founded", "2012", "2012", "high", "Verified across official and third-party sources."]
      - ["Headquarters", "Lincoln, Nebraska, USA", "2026 access", "high", "Redwood City appears as the historical demo location rather than current HQ."]
      - ["Current stage", "Private / pre-IPO profile with limited market activity", "2026 access", "medium", "Forge tracks the company but shows no live matched-price visibility."]
      - ["Core output", "Carbon black plus hydrogen and steam; ammonia expansion remains part of the growth narrative", "2026 access", "high", "Official materials support the process description, not a finished OC2 operating state."]
      - ["Public investor set", "Azimuth, Cornell, Imperative, Warburg; later public rosters add MHI, SK, NextEra, TPG, Decarbonization Partners, Kiewit, Perry Creek", "2020-2026 public sources", "medium", "Ownership percentages, board rights, and preference terms are not disclosed in the assigned pool."]
      - ["Latest public valuation anchor", ">$1B valuation in July 2022", "2022-07", "medium", "Historical anchor only; assigned sources do not provide a current mark."]
      - ["Current public total raised", null, "2026 access", "low", "Forge's current page lists total funding as not available."]
      - ["Current public revenue / run-rate", null, "2026 access", "low", "No assigned source discloses revenue, ARR, or run-rate."]
      - ["Current public headcount", "200 employees (stale)", "2022", "low", "Only explicit headcount figure in the assigned pool is historical."]
      - ["Current public customer count", null, "2026 access", "low", "Official materials cite usage in millions of tires, not named customers or count."]
    notes: >-
      Null means the assigned public evidence pool does not support a current figure,
      not that the underlying metric is zero or immaterial.
    claimRefs: [CO001, CO002, CO003, CO010, CO011, CO012, CO013, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role / status
      - Public background / evidence
      - Founder-market fit or functional coverage
      - Key-person dependency / gap
    rows:
      - ["Robert Hanson", "Co-founder; CEO in 2020 company release", "Quoted as co-founder and CEO in Monolith's 2020 MHI announcement; also named in third-party founder coverage.", "Anchors the original methane-pyrolysis commercialization story and early external fundraising narrative.", "Current 2026 operating role is not confirmed in the assigned pool."]
      - ["Peter / Pete Johnson", "Co-founder in third-party profiles", "Forge names Peter Johnson as a founder; Monolith's Wikipedia page names Pete Johnson.", "Supports the technical and company-formation origin story.", "Assigned sources do not show a current executive or board role."]
      - ["Bill / William Brady", "Founder attribution conflict; current director", "Forge lists Bill Brady as a founder, while the official board page lists William Brady as a current director.", "Potential bridge between formation-era backing and current governance.", "Needs charter-level confirmation because founder attribution is inconsistent across public profiles."]
      - ["Russell Webb", "Chief Executive Officer", "Current official leadership page identifies Webb as CEO.", "Visible current executive owner for scale-up accountability and external representation.", "Current company narrative depends heavily on management-provided evidence for role scope."]
      - ["Chris Mesrobian", "Chief Strategy Officer", "Official bio says he is an early employee who led strategy, business development, startup planning, and financing diligence.", "Important operator linking technical scaling, commercial agreements, and financing support.", "Succession depth and formal authority beyond the public bio are not disclosed."]
    notes: >-
      Table emphasizes publicly visible founders and current leaders with enough
      evidence to explain continuity; it is not a full org chart or verified board
      history.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows prioritize founders and current executives/directors that have enough
        public evidence to explain operating continuity as of the 2026 refresh.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Evidence status
      - Diligence ask
    rows:
      - ["Warburg Pincus and earlier sponsor group", "Financial sponsor base", "Appears in the 2020 company release alongside Azimuth, Cornell, and Imperative as existing backers.", "Supportive but incomplete; no ownership percentages or board-right disclosures in assigned sources.", "Request cap table, board-rights summary, and liquidation-preference stack."]
      - ["Mitsubishi Heavy Industries", "Strategic investor", "Public 2020 investment linked to hydrogen scale-up and commercialization signaling.", "Evidence is company-issued; investment size and attached rights are undisclosed.", "Confirm check size, governance rights, and any commercial or technology agreements."]
      - ["SK Inc. / NextEra consortium", "Minority strategic and financial investors", "Wikipedia says SK led a consortium that also included NextEra in 2021.", "Historical secondary-source evidence; precise ownership and follow-on rights are not public here.", "Obtain ownership percentage, information rights, and any strategic supply or power commitments."]
      - ["TPG Rise Climate / Decarbonization Partners", "2022 growth-round investors", "Historical 2022 round is the main public unicorn-valuation anchor in the assigned pool.", "Useful valuation signal, but current price and preference stack remain undisclosed.", "Confirm whether 2022 pricing still governs the latest preferred stack and whether any secondary occurred."]
      - ["DOE Loan Programs Office", "Conditional financing counterparty", "May 2025 reporting ties Monolith Nebraska's expansion to a prior conditional DOE commitment now under possible cancellation review.", "Adverse but still incomplete because the assigned pool does not show final disposition.", "Request live loan status, conditions precedent, and any consequences of cancellation or de-obligation."]
      - ["Goodyear / tire-market demand signal", "Commercial demand indicator", "Official materials say Monolith carbon black is already in millions of tires; Wikipedia also cites a Goodyear supply agreement.", "Demand proof is directional rather than contract-complete.", "Ask for customer concentration, contract terms, qualification status, and annual volume by program."]
    notes: >-
      Map captures publicly named financing and commercial counterparties rather than
      the full cap table, debt stack, or customer ledger.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the publicly named financing and commercial counterparties that
        appear material to Monolith's current control and execution profile.
    claimRefs: [CO010, CO011, CO012, CO014, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Publicly visible milestones show real commercialization progress, but the
      latest assigned-pool update is an execution-risk watchpoint rather than a
      financing close.
    data:
      items:
        - date: "2012"
          label: Founded
          detail: Monolith was founded in 2012.
          tone: neutral
        - date: "2013-2015"
          label: Seaport demonstration project built
          detail: The official timeline says Monolith built its Seaport demonstration project in Redwood City, California, during 2013-2015.
          tone: positive
        - date: "2016-2018"
          label: Olive Creek 1 groundbreak
          detail: Monolith says it concluded its pilot program and broke ground on Olive Creek 1 in Hallam, Nebraska.
          tone: positive
        - date: "2018"
          label: Headquarters move to Nebraska
          detail: Monolith's Wikipedia entry says the company moved its headquarters from California to Nebraska in 2018.
          tone: neutral
        - date: "2019-2020"
          label: OC1 mechanical completion and commissioning
          detail: The official timeline says Olive Creek 1 reached mechanical completion and entered commissioning in 2019-2020.
          tone: positive
        - date: "2020-11-29"
          label: MHI strategic investment
          detail: Monolith announced Mitsubishi Heavy Industries investment as it scaled commercial clean hydrogen and carbon black production.
          tone: positive
        - date: "2021"
          label: Strategic investor expansion and Goodyear demand signal
          detail: Wikipedia says SK Inc. and NextEra invested in 2021 and also references a Goodyear carbon-black supply agreement.
          tone: positive
        - date: "2022-07"
          label: Historical unicorn round
          detail: Monolith's Wikipedia entry says a July 2022 funding round brought valuation above $1 billion.
          tone: positive
        - date: "2025-05"
          label: DOE cancellation risk enters the public record
          detail: Semafor and Reason both reported that Monolith Nebraska's prior DOE-linked conditional commitment was under possible cancellation review.
          tone: risk
        - date: "2026+"
          label: Planned advanced manufacturing campus
          detail: The official about page says Monolith is ready to expand its Nebraska site into a campus that could become one of the world's largest carbon black facilities.
          tone: neutral
    claimRefs: [CO001, CO002, CO005, CO010, CO012, CO014, CO015]
callouts:
  - calloutType: strength
    title: Commercialization is more concrete than the current financial disclosure set
    body: >-
      The assigned pool supports a real path from demo plant to first commercial
      facility and then to strategic-investor participation, which is stronger than a
      concept-stage climate startup profile. That said, the public evidence quality is
      much stronger on technology history and counterparties than on present-day
      financial visibility.
    claimRefs: [CO003, CO005, CO010, CO015]
  - calloutType: risk
    title: Execution risk now matters more than identity risk
    body: >-
      Identity, headquarters, product category, and plant chronology are adequately
      grounded, but financing visibility and project-risk visibility are still weak.
      The latest adverse evidence in the assigned pool is DOE cancellation-risk
      reporting rather than a definitive financing close, and current valuation,
      revenue, customer count, and headcount remain under-disclosed.
    claimRefs: [CO011, CO013, CO014, CO016]
