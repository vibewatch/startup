callouts:
  - calloutType: insight
    title: Public competition is process-first, not peer-list-first
    body: >-
      The assigned pool supports a clean story on incumbent route pressure but not a dense map of current methane-pyrolysis startups,
      so Monolith's public benchmark set is dominated by SMR, partial oxidation, and conventional carbon-black production.
    claimRefs: [CP004, CP005, CP007, CP015]
  - calloutType: risk
    title: The moat still depends on scale-up surviving financing shocks
    body: >-
      Strategic backing helps, but DOE-loan uncertainty and reported project delays mean Monolith can still lose time
      against incumbents that already own infrastructure and customer relationships.
    claimRefs: [CP009, CP010, CP011]
