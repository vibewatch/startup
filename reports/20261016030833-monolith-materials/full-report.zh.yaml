      - number: '8.4'
        title: 最终尽调问题与论点破坏条件
        blocks:
          - type: paragraph
            body: >-
              在判断价格之前，投资者需要公开记录目前无法提供的三样东西：当前损益表和现金流视图、当前股权结构和优先权图谱，以及 DOE 与 Olive Creek 2
              的已签署融资状态更新。如果商业规模证明始终局限于单一资产，而下一座资产失去资金；如果当前财务数据表明公司无法在不接受苛刻条款的情况下走到自我融资里程碑；或者如果公开可比估值支持仍局限于成熟大宗材料企业的倍数，而
              Monolith 仍要求投资者按 2022 年独角兽估值买入，那么核心论点就会失效。在这种情况下，正确的下一步是扩大尽调，而不是作出承诺。
