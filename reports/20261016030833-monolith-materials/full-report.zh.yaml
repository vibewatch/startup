  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持从工艺到现金流的路径，但从产能到实际定价和毛利的中间环节大多未披露。
    data:
      nodes:
        - label: 天然气 + 可再生电力
          detail: Monolith 甲烷热解工艺中反复被引用的投入。
          tone: positive
        - label: 甲烷热解
          detail: 公开描述称，该工艺将甲烷分解为碳和氢。
          tone: positive
        - label: 炭黑产出
          detail: OC1 正在运营，公开设计产能约为 14,000 吨 / 年。
          tone: positive
        - label: 清洁氢副产品
          detail: 与炭黑一同生成，但公开销售量和定价未披露。
          tone: warning
        - label: OC2 氨转化（规划中）
          detail: 公开材料称，规划中的氨设施年产能为 275,000 吨，取决于融资和执行。
          tone: warning
        - label: 现金实现
          detail: 收入质量仍取决于产能利用率、实际定价、客户集中度和 DOE 相关扩建资本。
          tone: risk
    approximationNotes: 该序列展示变现路径，而非完整工程工艺图；公开证据没有披露实际价格、转化损失或每一步对毛利的贡献。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI010
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，该架构从天然气和电力投入经过热解，延伸至炭黑、氢和规划中的氨变现，共六层；融资和场地许可仍嵌在这套架构中。
    data:
      layers:
        - label: 原料与电力
          detail: 天然气加可再生电力是已声明的物理投入。
          modules:
            - label: 常规 / 可再生天然气
            - label: 可再生电力
        - label: 专有甲烷热解核心
          detail: Monolith 将反应器环节定位为工艺护城河和商业规模突破口。
          modules:
            - label: 甲烷分解
            - label: 商业规模反应器运营
        - label: 碳流升级
          detail: 固体碳被升级为可销售的炭黑，而不是作为废物处理。
          outputs:
            - label: Carbon black
            - label: Tire / rubber / pigment applications
        - label: 氢流
          detail: 氢是直接产出，也是下游氨业务论点的原料。
          outputs:
            - label: Clean / turquoise hydrogen
        - label: 下游氨扩建
          detail: Olive Creek 2 是规划中的一层，用于将氢转化为无水氨。
          modules:
            - label: 氨转化循环
          outputs:
            - label: Anhydrous ammonia
        - label: 场地规模支撑层
          detail: 水资源许可、DOE 支持的资本和项目执行决定这套架构能否扩张。
          modules:
            - label: 水井与监测
            - label: DOE / 投资者融资路径
    approximationNotes: 这是结构层级图，不是吞吐量模型；公开来源没有披露每一层的收率、开工率或经济性。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE008
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Monolith 的客户路径从示范验证走向少数工业交易对手，但 OC2 扩建仍受融资和政策风险制约。
    data:
      items:
        - label: Redwood City 示范项目
          actor: Monolith 与 Zeton
          stage: 原型验证
          touchpoints:
            - 2014 年 6 月至 2018 年 10 月运营，用于展示性能和可靠性
        - label: 炭黑终端市场评估
          actor: 潜在工业买家
          stage: 资质评估
          touchpoints:
            - 示范工厂产出的炭黑接受了广泛终端市场的评估
        - label: Goodyear 炭黑验证
          actor: 轮胎制造商
          stage: 已点名的工业需求
          touchpoints:
            - 合作供应炭黑
            - AP 还报道称，Goodyear 是签署意向书的两家轮胎制造商之一
        - label: NPPD 氢承购概念
          actor: 公用事业交易对手
          stage: 副产品变现
          touchpoints:
            - NPPD 同意购买 Monolith 的氢副产品
        - label: OC1 商业化生产
          actor: 工厂运营与采购
          stage: 商业产出
          touchpoints:
            - OC1 的设计年产能约为 14,000 公吨炭黑，另有清洁氢
        - label: OC2 氨扩建
          actor: 化肥市场增长路径
          stage: 扩建循环
          touchpoints:
            - 未来需求情况取决于氨业务扩张
            - DOE 取消和现金延迟报道令下一步蒙上阴影
    approximationNotes: null
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU007
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据将融资、规模化执行和水资源 / 合规风险置于最高剩余风险档位；需求和战略支持事项虽已有缓解，但尚未消除。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 剩余暴露
      rows:
        - label: DOE / 融资风险
          values:
            - text: 高
              tone: high
            - text: 高
              tone: high
            - text: 中
              tone: medium
              note: 新的股权支持有所帮助，但缺少公开的替代融资证据。
            - text: 高
              tone: high
        - label: OC2 执行 / 延误风险
          values:
            - text: 高
              tone: high
            - text: 高
              tone: high
            - text: 中
              tone: medium
              note: OC1 证明了商业化，但当前 OC2 的预算 / 进度证据薄弱。
            - text: 高
              tone: high
        - label: 水资源 / 合规风险
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: high
            - text: 中
              tone: medium
              note: 已批准的水井和监测义务是真实的缓解措施，但并未完全消除风险。
            - text: 中高
              tone: high
        - label: 终端市场 / 合作伙伴集中度
          values:
            - text: 中
              tone: medium
            - text: 中高
              tone: high
            - text: 中低
              tone: neutral
              note: 品牌兴趣和投资者支持确实存在，但合同深度未披露。
            - text: 中高
              tone: high
        - label: 炭黑 EHS / 合规风险
          values:
            - text: 中
              tone: medium
            - text: 中
              tone: medium
            - text: 低
              tone: low
              note: 运营上风险可控，但 Monolith 控制措施的公开证据有限。
            - text: 中
              tone: medium
        - label: 客户 / 承购集中度风险
          values:
            - text: 中
              tone: medium
            - text: 中高
              tone: high
            - text: 中低
              tone: neutral
              note: 公开来源显示存在需求，但没有多元化签约量的证据。
            - text: 中高
              tone: high
    approximationNotes: 热力图等级根据所引用来源中各方据称的情况作定性判断，而非量化风险模型；“中高”单元格采用高风险色系，以保留谨慎语气。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR010
      - CR011
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从商业化验证和市场逻辑出发，经过融资风险，形成估值立场的决策链。
    data:
      nodes:
        - id: commercial-proof
          label: 商业规模资产已存在
          note: 公开描述称 Olive Creek 1 正以商业规模运营。
        - id: process-case
          label: 工艺经济性可能具备差异化
          note: 管理层称其转化效率更高，并具备替代原油的路径。
        - id: market-case
          label: 氢需求论点仍与政策挂钩
          note: 氢能部署仍取决于基础设施、政策和投资进展。
        - id: price-anchor
          label: 已知估值锚点已经过时
          note: 公开估值背景仍是 2022 年的独角兽估值，而非当前定价基准。
        - id: downside-signal
          label: 融资下行风险可见
          note: DOE 取消传闻，以及据报道的现金 / 项目延迟压力，为新资金带来下行选择性。
        - id: call
          label: 继续研究 / 估值过高
          note: 在评估入场前，等待更新后的财务数据、融资状态和条款。
      edges:
        - from: commercial-proof
          to: process-case
          label: 支持
        - from: process-case
          to: market-case
          label: 需要需求兑现
        - from: market-case
          to: price-anchor
          label: 仍需证明价格合理
        - from: price-anchor
          to: downside-signal
          label: 提高敏感度
        - from: downside-signal
          to: call
          label: 推动当前决策
    approximationNotes: 该流程总结有证据支持的决策逻辑，而非量化估值模型。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV014
