companyProfile:
  summary: >-
    Monolith Materials 是一家成立于 2012 年、总部位于 Nebraska 州 Lincoln
    的后期私营工业气候公司。公司将天然气转化为炭黑和清洁氢气的甲烷热解技术商业化，并把氨定位为下一步的价值变现环节。公开证据显示，公司拥有正在运营的 Olive Creek 1
    工厂、战略投资者和客户关系，但当前收入、现金和股权结构细节仍不透明。
  foundedDate: '2012-01-01'
  founders:
