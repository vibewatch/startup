      - number: '3.4'
        title: 融资和执行风险限制护城河的持久性
        blocks:
          - type: paragraph
            body: >-
              保留资料中最有力的反证，不是某个有更充分文件支持的创业公司竞争者，而是 Monolith 可能在融资或政策支持退坡前，未能扩张进入现有市场。Semafor 报道称，DOE
              计划取消七项大型清洁能源有条件承诺，其中包括 Monolith Nebraska 的低碳氨项目。Reason 另报道称，Monolith 拥有 $953 million 的有条件 LPO 担保，并援引 Wall
              Street Journal 报道称公司现金即将耗尽且项目面临延误。即使 DOE 发言人后来表示尚未作出最终决定，竞争层面的结论仍然清楚：Monolith
              的护城河高度取决于融资和执行，而现有企业已经拥有运营资产和成熟渠道。
            claimRefs:
