      - number: '8.2'
        title: 论点质量与价格支撑
        blocks:
          - type: paragraph
            body: >-
              看多论点确实存在：Monolith
              展示了差异化的甲烷热解工艺，声称原料转化优于传统炭黑生产，并拥有纯概念公司不可能具备的战略投资者和基础设施合作伙伴。看空论点同样真实：最好的商业化证据大多由公司或投资者控制，最近公开引用的估值锚点已经过时，而资料池中唯一干净的公开可比公司是
              Cabot——一家成熟的上市碳材料企业，收入倍数并不高。因此，投资问题已经不再是 Monolith 是否拥有有趣的技术，而是新投资者能否以足以补偿执行、稀释和融资风险的条款，买入下一阶段规模化。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
