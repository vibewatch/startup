      - number: '2.3'
        title: 买方、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱至少分成两种实质不同的流程。炭黑可以进入现有的轮胎、橡胶、塑料、涂料和电子采购体系，材料团队和工业采购负责人会同时关注性能、供应可靠性以及日益重要的可持续性。氨这条线不同：它取决于项目完工、商品经济性以及化肥或工业承购方，而不是简单的销售驱动式铺开。氢能中心和脱碳项目可以加快采用，但不能免除工厂规模执行的要求。实际上，Monolith
              证据更充分的采用路径是炭黑业务；氨则是更大、但更晚启动且更依赖资本开支的机会。
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: 采用约束与未决尽调
        blocks:
          - type: paragraph
            body: >-
              同一批证据既让市场论点成立，也解释了采用时点为何脆弱。炭黑经济性仍暴露于石油衍生原料价格波动和日益严格的环境合规成本；任何美国工业规模项目也都要受《清洁空气法》的许可和执法框架约束。Monolith
              面临的更具体风险在于氨扩产的项目融资：Semafor 报道称 DOE 计划取消低碳氨工厂的有条件承诺；Reason 则将这一威胁与 $953 million 的有条件贷款担保联系起来，并援引 Wall
              Street Journal 关于现金紧张和项目延误的报道。本章可以圈定需求池，但公开证据仍无法拆分已签约量、工厂经济性或可辩护的 Monolith 专属 SAM / SOM。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 三个工业需求池比一个泛化的氢能 TAM 更重要
            body: 证据支持 Monolith 以炭黑为主、向氢气和氨延伸的路线，而不是把它包装成包罗万象的清洁氢平台。守住这个边界，TAM 才能建立在实际工业产出上，而不是无关的气候或软件支出上。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: callout
            title: 氨的上行空间是市场故事中去风险最少的一环
            body: 公开报道仍将氨扩建与大额资本开支、公共项目支持以及未解决的贷款 / 融资风险联系在一起。因此，氨市场机会确实存在，但其证实程度明显低于炭黑路线。
            calloutType: risk
            claimRefs:
              - CM011
              - CM015
              - CM016
          - type: callout
            title: 公开证据圈定了市场，却无法拆出 Monolith 的服务份额
            body: 本章可以支持广泛的市场和政策视角，以及工厂产能代理指标，但无法给出精确的 Monolith 专属 SAM、SOM 或销量份额预测。更细的规模化判断需要现有公开资料池之外的客户、定价和已签约承购数据。
            calloutType: assumption
            claimRefs:
