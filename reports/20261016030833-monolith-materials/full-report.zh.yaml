      - number: '3.2'
        title: 差异化来自环境与战略，但规模仍在验证
        blocks:
          - type: paragraph
            body: >-
              Monolith 的公开定位主张双重护城河：今天把炭黑卖给轮胎和工业市场，同时把氢气转化为氨，打开第二个需求池。保留的公开来源称，当前 Hallam 资产的年产炭黑约为 14,000 公吨；扩产计划则约为
              194,000 至 200,000 公吨炭黑，另加 275,000 公吨氨。相同资料更能证明 Monolith 的环境差异化，而不是其装机规模：ARPA-E 演示文稿声称相较传统工艺可减排
              97%，但公开证据仍显示，现有氢气和炭黑路线拥有更广的基础设施和更透明的运营成熟度。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
              - CP015
      - number: '3.3'
        title: 渠道关系比公开价目表更能决定胜负
        blocks:
          - type: paragraph
            body: >-
              现有资料表明，Monolith 的商业竞争可能主要靠工业关系取胜，而不是靠公开发布的价格。CBC 报道了其与 Goodyear 达成清洁炭黑协议；Monolith 自己的公告则称 Mitsubishi Heavy
              Industries 投资是为了帮助技术规模化。这些信号说明，客户认证、供应保障和战略赞助与排放指标同样重要。同时，没有任何保留的公开来源披露 Monolith
              对炭黑、氨或氢气的目录价，因此相对于现有供应商的公开价格基准仍然薄弱。这个不透明性很重要，因为 Monolith 和现有的天然气制氢路线在价值链某个环节仍都依赖天然气经济性。
            claimRefs:
              - CP008
