              - CM012
      - number: '2.2'
        title: 公开规模化视角宽泛，尚未落到公司层面
        blocks:
          - type: paragraph
            body: >-
              现有资料中最干净的公开市场视角是炭黑，而不是 Monolith 专属的氢气或氨收入池。Grand View Research 估计全球炭黑需求在 2025 年为 $24.5 billion、2026 年为
              $25.6 billion，到 2033 年达到 $36.1 billion；轮胎占 2025 年市场收入的 68.8%。Nebraska 的氢能中心政策背景又提供了 $8 billion
              的联邦资本视角，但那是基础设施赋能，不是产品收入。Monolith 在 2020 年披露的 OC1 设计产能，因此比任何公开 SAM 或 SOM
              更适合作为已验证规模的代理指标。证据支持一个有边界的市场故事，但不足以给出精确的市场份额预测。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
