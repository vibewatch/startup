            body: >-
              关键财务结论是：Monolith 的资本需求清晰可见，但资本充足性无法判断。多个保留来源将 Olive Creek 扩建的 DOE 相关支持金额置于约 $953 million 至 $1.04
              billion，使优惠性项目融资成为前瞻计划的核心，而不是附带收益。已宣布或有条件的融资不能证明现金可用或资金已拨付。与此同时，公开记录显示融资存在不确定性：Semafor 于 2025 年 5 月报道 DOE
              计划取消包括 Monolith Nebraska 在内的有条件承诺；Reason 随后重复了有条件贷款的表述，并转述 Wall Street Journal
              称公司现金吃紧、项目延期。由于没有保留来源披露收入、利润率、现金、烧钱或现金跑道，投资者可以看到规模雄心和融资依赖，却仍无法评估稀释风险、债务承载能力或靠自身资金完成项目的可能性。
