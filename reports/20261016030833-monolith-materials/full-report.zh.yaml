      - number: '8.3'
        title: 情景框架与估值纪律
        blocks:
          - type: paragraph
            body: >-
              可信的乐观情景不只需要技术差异化，还需要证明 Monolith
              能在不遭受惩罚性稀释或长期延误的情况下，为下一阶段融资并完成投产。因此，基准情景应围绕里程碑监测，而不是设定一个硬性目标倍数：只有当公司拿出今天公开来源尚未提供的最新运营和融资证明，已知的独角兽估值才有可能守住。悲观情景比精确定价更容易描述，因为不利报道已经指向现金紧张、DOE
              贷款不确定性和项目延误风险；其中任何一项都可能迫使公司下调轮次融资、采用结构化资本，或承受远超风险投资式投资判断通常假设的持有期。
