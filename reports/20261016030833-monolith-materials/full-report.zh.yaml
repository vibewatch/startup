        blocks:
          - type: paragraph
            body: >-
              公开记录足以证明 Monolith 已从实验室层面的主张走到正在运营的商业化资产，但不足以支持在私营独角兽价格上做出新的买入判断。公司材料和 2020 年公司公告都将 Olive Creek 1
              描述为商业规模；第三方来源则显示，最近一次披露的估值在 2022 年超过 $1 billion，DOE
              有条件贷款也成为融资故事的一部分。与之相对，同一公开记录仍缺少当前收入、利润率、订单积压、现金、现金跑道和优先权结构细节；不利报道又增加了融资不确定性和潜在项目延误压力。这种组合支持“继续研究”的建议、对价格发现的低信心、高风险评级，以及在获得更新的财务和资本结构证据之前维持偏高的估值判断。
            claimRefs:
