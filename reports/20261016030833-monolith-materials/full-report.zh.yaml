  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与计入范围
        blocks:
          - type: paragraph
            body: >-
              Monolith 应被归入工业材料和脱碳生产商，而不是泛化的气候软件公司或宽泛的氢能平台公司。保留的来源始终描述同一种甲烷热解工艺：将天然气分解成氢气和固体碳，再把碳销售为炭黑；更大的 Hallam / OC2
              项目则计划把氢气转化为氨。因此，计入的支出应是工业炭黑需求、氨 /
              化肥承购潜力，以及清洁氢生产相关基础设施。与此无关的软件、碳信用或消费燃料叙事应排除，否则会夸大可服务市场。现状替代方案是现有炭黑供应和传统氨生产，而不是内部 IT 工具或抽象的气候预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
