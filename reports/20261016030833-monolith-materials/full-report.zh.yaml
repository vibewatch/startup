        title: 身份、业务足迹与运营模式
        blocks:
          - type: paragraph
            body: >-
              可以确认，Monolith 是一家 2012 年成立、总部位于 Nebraska 州 Lincoln 的私营公司；其运营历史始于 Redwood City，随后转向 Nebraska
              的商业化建设。官网和公司公告将其描述为热等离子体甲烷热解模式：把天然气转化为炭黑，同时产出氢气和蒸汽，并将氨扩产定位为下一步重要的价值变现环节。公开资料呈现出后期私营公司的状态，但财务透明度并不完整：Forge
              设有这家公司的 IPO 前页面，实时页面却没有当前融资轮次细节、成交价可见性或当前估值。
            claimRefs:
