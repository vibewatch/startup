  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 路线竞争比创业公司同业竞争更清晰
        blocks:
          - type: paragraph
            body: >-
              保留证据中最清晰的竞争图景是按路线划分，而不是按公司名单划分。DOE 表示，美国 95% 的氢气仍在大型集中式工厂中通过天然气重整生产，并称重整是已经依托现有管道基础设施的成熟路线。在炭黑领域，CBC
              表示现有工艺仍会燃烧石油澄清油或煤焦油。相比之下，现有资料在甲烷热解领域只呈现出一条直接的技术谱系比较：Monolith 自己的 ARPA-E 演示文稿称其收购了 Kvaerner 的技术，而 Kvaerner
              早期的商业设施曾在天然气价格高、石油价格低的时期停运。因此，公开市场更多拿 Monolith 与现状工艺类别比较，而不是与一份丰富、透明的当前创业公司同业名单比较。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP015
