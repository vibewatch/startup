        - 需要有关收入增长、现金充足度和已承诺资本的最新独立证据；目前尚未看到。
      - - 基准
        - 技术仍有差异化，Olive Creek 1 继续验证工艺，但公开财务披露依然稀薄，融资情况仍不清晰。
        - 采用里程碑驱动的入场纪律；将当前估值视为尚未证实，既不能说明显便宜，也不能说明显不可能。
        - 执行偏离、股权结构表条款不透明，以及经济性披露前支付过高价格。
        - 目前最符合资金池情况：核心技术已有验证，但价格支撑不足。
      - - 看跌
        - 贷款支持被取消或延迟，据报道的现金压力持续，下一步规模化需要昂贵资本或市场重新调整预期。
