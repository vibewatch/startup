        - Showed an early monetization path for the hydrogen stream
        - Later public evidence shifted emphasis toward ammonia instead of the Sheldon use case
      - - Ammonia / fertilizer channel
        - Agricultural fertilizer buyers
        - Conversion of clean hydrogen into anhydrous ammonia
        - Expansion narrative is visible, but named buyers are not
        - Could broaden monetization beyond carbon black if scaled
        - No named offtaker, contract terms, or recurring-customer proof
    notes: >-
      Mixes named counterparties with broader segment evidence; scale cells are qualitative
      because the assigned public pool does not disclose customer counts or contracted volumes.
