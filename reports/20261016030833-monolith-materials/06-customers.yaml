company:
  name: Monolith Materials
chapter:
  number: 6
  title: Customers
  summary: >-
    Monolith has real counterpart evidence, but the public customer story is still narrow.
    The assigned pool ties demand most clearly to Goodyear for carbon black and to Nebraska
    Public Power District for hydrogen, while 2025 financing and DOE-loan uncertainty make
    the ammonia expansion path harder to treat as durable customer proof.
sections:
  - id: industrial-customer-base
    title: Industrial buyer segments are visible, but the roster is concentrated
    body: |-
      The customer picture in the assigned public pool is industrial and concentrated rather
      than broad. Monolith's monetization path centers on selling carbon black and clean
      hydrogen, with the hydrogen stream increasingly framed as ammonia feedstock for
      fertilizer markets rather than a mass-market fuel product. The only clearly named
      product-offtake counterparties in this pool are Goodyear on the carbon-black side and
      Nebraska Public Power District on the hydrogen side. That is enough to show commercial
      relevance, but not enough to underwrite customer diversification, renewal durability, or
      multi-account expansion by itself.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU014
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-proof
    title: Adoption proof exists from the demo-to-plant path, but named production references are thin
    body: |-
      There is more than slideware here. Zeton's chronology shows Monolith ran a demonstration
      plant in Redwood City from 2014 through 2018 to prove performance and reliability, then
      used that work to support its first commercial buildout in Nebraska. Public evidence also
      shows Olive Creek 1 moved beyond the pilot phase: Monolith described the site as its
      first commercial-scale production facility, and independent sources point to Goodyear as a
      named carbon-black counterparty. Even so, the public proof remains shallow relative to a
      scaled industrial customer base because volumes, active-account counts, and renewal
      behavior are not disclosed in the assigned pool.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU013
    tableRefs:
      - TU002
      - TU003
  - id: durability-and-expansion-risk
    title: Durability and scale-up evidence remain under-documented
    body: |-
      The weakest part of the customer story is not whether Monolith has ever found buyers,
      but whether its current demand base is durable and broad enough to support the next
      expansion step. Hydrogen Council's 2023 market snapshot shows announced hydrogen demand
      far outrunning committed investment, which matters because Monolith's future growth case
      depends on scaling a low-carbon ammonia route beyond its initial plant. That expansion is
      also exposed to financing and policy risk: Semafor reported DOE planned to cancel the
      Monolith Nebraska ammonia-factory commitment, and Reason separately cited a large
      conditional DOE guarantee alongside reports of cash pressure and project delays. Until
      Monolith discloses customer counts, contract structure, or retention metrics, the chapter
      can support strategic relevance but not high confidence in customer durability.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU015
      - CU016
callouts:
  - calloutType: strength
    title: Named counterpart evidence is real, not just a logo wall
    body: >-
      Public sources tie Monolith to Goodyear for carbon black and to Nebraska Public Power
      District for hydrogen, while OC1 gives the company a commercial plant footprint rather
      than only a lab-scale pilot.
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU007
  - calloutType: risk
    title: The gap is durability, not basic market relevance
    body: >-
      The assigned public pool does not disclose customer-count or retention metrics, and the
      2025 DOE and financing headlines make the OC2 expansion path less bankable as evidence of
      future customer growth.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU016
