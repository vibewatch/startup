  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The most material public risks cluster around capital availability, project execution, and environmental
              or safety exposure rather than customer demand alone. Semafor reported that Monolith Nebraska's low-carbon
              ammonia project was on an internal DOE cancellation list, while Reason said Monolith's $953 million DOE
              conditional loan guarantee sat alongside Wall Street Journal reporting that the company was running short
              on cash and facing project delays. Those risks stack on top of a single-site operating footprint, a
              still-scaling OC2 ammonia buildout, and historic local concern about water draw for expansion.
              Company-issued materials still emphasize commercial-scale hydrogen leadership and recent investor backing,
              so the right read is not that Monolith is broken, but that the next leg of the thesis still depends on
              financing close, schedule discipline, and compliance execution that are not yet fully evidenced in public.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
