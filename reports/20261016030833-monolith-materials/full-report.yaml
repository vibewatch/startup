            body: >-
              Monolith's retained public evidence is strongest on what the plant does and who appears around it—carbon
              black, hydrogen, ammonia ambitions, Goodyear, MHI, and DOE—while the decisive underwriting metrics remain
              private.
            calloutType: insight
            claimRefs:
