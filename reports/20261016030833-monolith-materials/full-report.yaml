      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real plant proof is stronger than a slideware climate story
            body: >-
              Monolith's technology case is anchored by a named commercial-scale Nebraska asset with disclosed
              carbon-black design capacity and repeated partner validation, which is materially stronger proof than a
              pre-pilot clean-tech narrative.
            calloutType: strength
            claimRefs:
              - CE003
              - CE009
              - CE010
          - type: callout
            title: The full architecture still hinges on one site and one expansion program
            body: >-
              The hydrogen-to-ammonia stack depends on water approvals, project capital, and Olive Creek 2 execution,
              while public adverse reporting ties the same buildout to DOE uncertainty and project-delay risk.
            calloutType: risk
            claimRefs:
