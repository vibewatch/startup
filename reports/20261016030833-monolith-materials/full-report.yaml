      nodes:
        - id: commercial-proof
          label: Commercial-scale asset exists
          note: Olive Creek 1 is publicly described as operating at commercial scale.
        - id: process-case
          label: Process economics could be differentiated
          note: Management claims better conversion efficiency and a crude-oil substitution angle.
        - id: market-case
          label: Hydrogen demand thesis remains policy-linked
          note: Hydrogen deployment still depends on infrastructure, policy, and investment progress.
        - id: price-anchor
          label: Known valuation anchor is stale
          note: Public valuation context is still a 2022 unicorn mark rather than a current priced benchmark.
        - id: downside-signal
          label: Financing downside is visible
          note: DOE cancellation talk and reported cash/project-delay pressure create downside optionality for new money.
        - id: call
          label: Research-more / stretched
          note: Wait for refreshed financials, financing status, and terms before underwriting entry.
      edges:
        - from: commercial-proof
          to: process-case
          label: supports
        - from: process-case
          to: market-case
          label: needs demand realization
        - from: market-case
          to: price-anchor
          label: still must justify price
        - from: price-anchor
          to: downside-signal
          label: heightens sensitivity
        - from: downside-signal
          to: call
          label: drives current decision
    approximationNotes: Flow summarizes evidence-backed decision logic rather than a quantitative valuation model.
