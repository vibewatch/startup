      - number: '3.3'
        title: Distribution wins matter more than published price sheets
        blocks:
          - type: paragraph
            body: >-
              The assigned pool suggests Monolith's commercial battle is likely won through industrial relationships
              rather than publicly posted pricing. CBC reports a Goodyear agreement for cleaner carbon black, and
              Monolith's own release says Mitsubishi Heavy Industries invested to help scale the technology. Those
              signals imply customer qualification, supply assurance, and strategic sponsorship matter alongside
              headline emissions claims. At the same time, no retained public source discloses Monolith list pricing for
              carbon black, ammonia, or hydrogen, so public price benchmarking versus incumbents remains weak. That
              opacity matters because both Monolith and the incumbent gas-based hydrogen routes still depend on
              natural-gas economics at some point in the stack.
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
