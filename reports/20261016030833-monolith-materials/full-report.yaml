  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a coherent revenue mechanism but not a complete underwriting picture.
              Monolith's core process splits methane into carbon black and clean hydrogen, and public descriptions
              repeatedly position ammonia conversion as the next monetization layer rather than a separate business
              model. Operational proof is strongest at OC1: the retained sources corroborate an operating plant with
              roughly 14,000 metric tons of annual carbon-black design capacity, while GTM proof comes mainly from
              disclosed strategic relationships such as Goodyear and MHI. What is missing is the reader-critical bridge
              from installed capacity to realized revenue quality: no retained source discloses volumes sold,
              utilization, customer concentration, or realized pricing for carbon black, hydrogen, or planned ammonia
              output.
