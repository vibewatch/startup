      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map splits into at least two materially different workflows. Carbon black fits existing tire,
              rubber, plastics, coatings, and electronics procurement, where materials teams and industrial procurement
              owners care about performance, supply reliability, and increasingly sustainability. The ammonia leg is
              different: it depends on project completion, commodity economics, and fertilizer or industrial offtake
              counterparties rather than a simple sales-led rollout. Hydrogen-hub and decarbonization programs can
              accelerate adoption, but they do not remove the need for plant-scale execution. In practice, Monolith's
              better-evidenced adoption path is the carbon-black side of the business, while ammonia remains the bigger
              but later and more capex-sensitive opportunity.
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: Adoption constraints and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The same evidence that makes the market thesis plausible also shows why adoption timing is fragile. Carbon
              black economics remain exposed to petroleum-derived feedstock volatility and tightening environmental
              compliance costs, while any industrial-scale U.S. project still operates inside Clean Air Act permitting
              and enforcement frameworks. More specifically for Monolith, the ammonia expansion carries project-finance
              risk: Semafor reported DOE planned to cancel the conditional commitment for the low-carbon ammonia
              factory, and Reason separately tied the threat to a $953 million conditional loan guarantee while citing
              Wall Street Journal reporting about cash strain and project delays. The chapter can bound demand pools,
              but public evidence still does not isolate contracted volumes, plant economics, or a defendable
              Monolith-specific SAM/SOM.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
