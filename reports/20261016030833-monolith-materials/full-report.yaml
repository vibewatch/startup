              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations, monitors, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The best evidenced mitigations are fresh equity support, existing well approvals with monitoring
              requirements, and the fact that Monolith already operates a commercial OC1 asset rather than a lab-only
              process. Those mitigations are meaningful but incomplete: none of the public sources close the current
              questions on final DOE status, alternative project finance, present cash runway, or current water and
              safety performance at scale. The cleanest thesis-break triggers are monitorable: definitive cancellation
              or de-obligation of DOE support without replacement capital; a new slip to the OC2 path after the
              company's earlier 2026 target; public evidence of water, safety, or environmental non-compliance; or weak
              customer diversification beyond tire and ammonia channels. Diligence should therefore focus on current
              financing documents, permit compliance records, and signed commercial commitments rather than incremental
              narrative material.
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to show that Monolith has moved beyond laboratory claims into an
              operating commercial asset, but it is not strong enough to support a fresh buy call at a private unicorn
              price. Company materials and a 2020 company release both describe Olive Creek 1 as commercial-scale, while
              third-party sources show the last disclosed valuation cleared $1 billion in 2022 and the DOE conditional
              loan became part of the financing story. Against that, the same public record still lacks current revenue,
              margin, backlog, cash, runway, and preference-stack detail, and adverse reporting adds both financing
              uncertainty and possible project-delay pressure. That mix supports a research-more recommendation, low
              confidence in price discovery, a high risk rating, and a stretched valuation stance until updated
              financial and capital-structure evidence is available.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis quality versus price support
        blocks:
          - type: paragraph
            body: >-
              The pro-thesis is real: Monolith presents a differentiated methane-pyrolysis process, claims materially
              better feedstock conversion than conventional carbon black production, and has strategic backers and
              infrastructure partners that would not exist around a pure concept company. The anti-thesis is just as
              real: most of the best commercialization evidence is company-controlled or investor-controlled, the last
              publicly cited valuation anchor is old, and the only clean public comp in this pool is Cabot, a mature
              listed carbon-materials business trading at modest revenue multiples. That means the investment question
              is no longer whether Monolith has an interesting technology, but whether new investors can buy into the
              next stage of scale-up at terms that compensate for execution, dilution, and financing risk.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.3'
        title: Scenario framing and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              A credible bull case requires more than technology differentiation; it needs evidence that Monolith can
              finance and commission the next phase without punitive dilution or long slippage. The base case therefore
              centers on milestone-based monitoring rather than a hard target multiple: the known unicorn mark can only
              be defended if the company produces updated operating and financing proof that is absent from public
              sources today. The bear case is easier to describe than to price precisely, because adverse reporting
              already points to cash strain, DOE loan uncertainty, and project-delay risk, each of which could force a
              down round, structured capital, or a much longer hold period than venture-style underwriting typically
              assumes.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Before underwriting price, investors need three things the public record does not currently provide: a
              current income-statement and cash-flow view, a current cap-table and preference map, and a signed
              financing-status update for DOE and Olive Creek 2. The core thesis breaks if commercial-scale proof
              remains confined to a single asset while the next asset loses funding, if current financial data shows the
              business cannot bridge to self-funding milestones without harsh terms, or if public-comp valuation support
              stays limited to mature commodity-materials multiples while Monolith still asks investors to pay through
              the 2022 unicorn mark. In that state, the right next action is diligence expansion rather than commitment.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline matters more than technology admiration
            body: >-
              Monolith may deserve continued diligence, but the current public record does not support paying through
              the last disclosed unicorn mark with conviction.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
          - type: callout
            title: The next financing step is the swing factor
            body: >-
              If DOE support weakens or replacement capital comes on hard terms, the valuation debate can flip from
              scarcity to survival very quickly.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
