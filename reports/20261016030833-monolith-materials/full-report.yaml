            title: Named counterpart evidence is real, not just a logo wall
            body: >-
              Public sources tie Monolith to Goodyear for carbon black and to Nebraska Public Power District for
              hydrogen, while OC1 gives the company a commercial plant footprint rather than only a lab-scale pilot.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
          - type: callout
            title: The gap is durability, not basic market relevance
            body: >-
              The assigned public pool does not disclose customer-count or retention metrics, and the 2025 DOE and
              financing headlines make the OC2 expansion path less bankable as evidence of future customer growth.
            calloutType: risk
            claimRefs:
