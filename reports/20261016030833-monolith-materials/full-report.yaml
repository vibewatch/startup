              - CM005
              - CM006
              - CM010
              - CM012
      - number: '2.2'
        title: Public sizing lenses are broad, not company-specific
        blocks:
          - type: paragraph
            body: >-
              The cleanest published market lens in the assigned pool is carbon black, not a Monolith-specific hydrogen
              or ammonia revenue pool. Grand View Research sizes global carbon black demand at $24.5 billion in 2025,
              $25.6 billion in 2026, and $36.1 billion by 2033, with tires representing 68.8% of 2025 market revenue.
              Nebraska's hydrogen-hub policy context adds an $8 billion federal capital lens, but that is infrastructure
              enablement rather than product revenue.       Monolith's 2020 disclosed OC1 designed plant capacity is
              therefore a better public proxy for demonstrated scale than any published SAM or SOM. The evidence
              supports a bounded market story, but not a precise share-of-market forecast.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
