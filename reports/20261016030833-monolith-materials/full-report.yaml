            body: >-
              The evidence supports Monolith's carbon-black route with hydrogen and ammonia adjacency, not as a
              catch-all clean-hydrogen platform. That boundary discipline keeps the TAM grounded in actual industrial
              outputs rather than unrelated climate or software spending.
