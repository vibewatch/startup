      - number: '3.2'
        title: Differentiation is environmental and strategic, but scale is still being proven
        blocks:
          - type: paragraph
            body: >-
              Monolith's public positioning argues for a two-sided moat: sell carbon black into tire and industrial
              markets today while converting hydrogen into ammonia as a second demand pool. Retained public sources
              place the current Hallam asset at roughly 14,000 metric tons of carbon black annually, while expansion
              plans are described at roughly 194,000 to 200,000 tonnes of carbon black plus 275,000 tonnes of ammonia.
              The same assigned pool supports Monolith's environmental differentiation more than its installed-base
              scale: the ARPA-E deck claims a 97% emissions reduction versus conventional processes, but public evidence
              still shows incumbent hydrogen and carbon-black routes with wider existing infrastructure and more
              transparent operational maturity.
            claimRefs:
              - CP001
              - CP003
