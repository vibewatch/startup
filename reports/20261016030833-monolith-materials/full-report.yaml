      - number: '5.3'
        title: Differentiation and control gaps
        blocks:
          - type: paragraph
            body: >-
              Monolith's differentiator is not software workflow novelty but process and plant configuration: company
              and partner materials repeatedly position it as the first U.S. commercial-scale clean or turquoise
              hydrogen producer using methane pyrolysis, with a carbon-black coproduct that gives the system a second
              revenue stream and a claimed emissions advantage versus conventional production routes. Strategic
              investors such as SK reinforce that the process has real industrial interest, but the public moat evidence
              is still mostly narrative, financing, and partner validation rather than independently benchmarked yields,
              quality certifications, or module-level performance data. The sharpest technical risk is therefore
              execution concentration: Semafor and Reason tie the full hydrogen-to-ammonia architecture to conditional
              DOE support and project-timing pressure, while the assigned source set offers no direct disclosure of
              cybersecurity, privacy, or formal quality-control systems for the plant.
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE011
              - CE012
