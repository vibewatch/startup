      - number: '5.2'
        title: Architecture and scale dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is straightforward in concept and still concentrated in execution: natural gas
              and renewable electricity feed Monolith's proprietary methane-pyrolysis step, the carbon stream is
              upgraded into saleable carbon black, and the hydrogen stream is meant to be monetized directly or
              converted into ammonia at the second-phase buildout. The IEA's hydrogen review is a useful diligence frame
              here because it stresses that low-emissions hydrogen projects must be judged on infrastructure, policy,
              investment, and supply-chain emissions rather than nameplate output alone. On that standard, Monolith's
              public proof is meaningful but incomplete: single-site capacity is visible, water permitting is material,
              and expansion economics still depend on external capital and regulatory follow-through. Public sources do
              not provide the plant uptime, conversion yield, energy intensity, or product-specification detail needed
              to test whether the architecture scales competitively.
            claimRefs:
