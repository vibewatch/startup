      - number: '6.2'
        title: Adoption proof exists from the demo-to-plant path, but named production references are thin
        blocks:
          - type: paragraph
            body: |-
              There is more than slideware here. Zeton's chronology shows Monolith ran a demonstration
              plant in Redwood City from 2014 through 2018 to prove performance and reliability, then
              used that work to support its first commercial buildout in Nebraska. Public evidence also
              shows Olive Creek 1 moved beyond the pilot phase: Monolith described the site as its
              first commercial-scale production facility, and independent sources point to Goodyear as a
              named carbon-black counterparty. Even so, the public proof remains shallow relative to a
              scaled industrial customer base because volumes, active-account counts, and renewal
              behavior are not disclosed in the assigned pool.
            claimRefs:
              - CU004
              - CU005
              - CU006
