  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts
        blocks:
          - type: paragraph
            body: >-
              Monolith should be framed as an industrial materials and decarbonization producer, not as a generic
              climate-software or broad hydrogen-platform company. The retained sources consistently describe a
              methane-pyrolysis process that splits natural gas into hydrogen and solid carbon, with the carbon sold as
              carbon black and the larger Hallam/OC2 build intended to turn hydrogen into ammonia. That means the
              included spend is industrial carbon black demand, ammonia/fertilizer offtake potential, and the
              infrastructure around clean hydrogen production. It excludes unrelated software, carbon-credit, or
              consumer-fuel narratives that would overstate the addressable market. Status-quo substitutes are incumbent
              carbon black supply and conventional ammonia production, not internal IT tools or abstract climate
              budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
