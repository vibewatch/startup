      - number: '4.2'
        title: Cost structure, capital intensity, and benchmark economics
        blocks:
          - type: paragraph
            body: >-
              Public signals point to a capital-intensive operating model with limited visibility into near-term unit
              economics. Wikipedia's synthesis of prior reporting says OC1 cost $100 million, the larger expansion was
              expected to cost $1 billion, and projected annual water needs were later revised down to a still-material
              450 million to 800 million gallons; those are meaningful inputs for capex, utilities, and permitting risk
              even though plant-level opex is not disclosed. External market context does not make the economics easier
              by default: Mordor says industrial demand is a large hydrogen end-market, but also describes a
              fast-scaling, fragmented supply base. Yahoo Finance's public snapshot of carbon-black producer Orion
              underscores that downstream commodity materials can still trade on low multiples and weak margins even at
              scale.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI013
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The key financial verdict is that Monolith's capital need is legible but its capital adequacy is not.
              Multiple retained sources put DOE-linked support for Olive Creek expansion at roughly $953 million to
              $1.04 billion, making concessionary project finance a central part of the forward plan rather than a side
              benefit. Announced or conditional financing does not establish cash availability or disbursement. The
              public record simultaneously shows financing uncertainty: Semafor reported in May 2025 that DOE planned to
              cancel conditional commitments including Monolith Nebraska, and Reason later repeated both the
              conditional-loan framing and a Wall Street Journal characterization that the company had been running
              short on cash and facing project delays. Because no retained source discloses revenue, margins, cash,
              burn, or runway, investors can see the scale ambition and financing dependency but still cannot underwrite
              dilution risk, debt capacity, or self-funded completion.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
