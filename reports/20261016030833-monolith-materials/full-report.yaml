              - CP014
      - number: '3.4'
        title: Moat durability is constrained by financing and execution risk
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence in the retained pool is not a better-documented startup rival but the
              risk that Monolith may fail to scale into incumbent markets before financing or policy support slips.
              Semafor reported that DOE planned to cancel seven major conditional clean-energy commitments, including
              Monolith Nebraska's low-carbon ammonia project. Reason separately reported that Monolith had a $953
              million conditional LPO guarantee and cited a Wall Street Journal report that the company was running
              short on cash and facing project delays. Even if the DOE spokesperson later said no final decisions had
              been made, the competitive takeaway is clear: Monolith's moat is still highly contingent on financing and
              execution, while incumbents already have operating assets and established channels.
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public competition is process-first, not peer-list-first
            body: >-
              The assigned pool supports a clean story on incumbent route pressure but not a dense map of current
              methane-pyrolysis startups, so Monolith's public benchmark set is dominated by SMR, partial oxidation, and
              conventional carbon-black production.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP015
          - type: callout
            title: The moat still depends on scale-up surviving financing shocks
            body: >-
              Strategic backing helps, but DOE-loan uncertainty and reported project delays mean Monolith can still lose
              time against incumbents that already own infrastructure and customer relationships.
            calloutType: risk
            claimRefs:
