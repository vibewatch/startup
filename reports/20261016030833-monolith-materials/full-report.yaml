  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence shows a six-layer architecture from gas and power inputs through pyrolysis to carbon black,
      hydrogen, and planned ammonia monetization, with financing and site permits still embedded in the stack.
    data:
      layers:
        - label: Feedstocks and power
          detail: Natural gas plus renewable electricity are the declared physical inputs.
          modules:
            - label: Conventional / renewable natural gas
            - label: Renewable electricity
        - label: Proprietary methane-pyrolysis core
          detail: Monolith positions the reactor step as the process moat and commercial-scale breakthrough.
          modules:
            - label: Methane splitting
            - label: Commercial-scale reactor operation
        - label: Carbon stream upgrading
          detail: Solid carbon is upgraded into saleable carbon black rather than treated as waste.
          outputs:
            - label: Carbon black
            - label: Tire / rubber / pigment applications
        - label: Hydrogen stream
          detail: Hydrogen is a direct output and the feedstock for the downstream ammonia thesis.
          outputs:
            - label: Clean / turquoise hydrogen
        - label: Downstream ammonia buildout
          detail: Olive Creek 2 is the planned layer that converts hydrogen into anhydrous ammonia.
          modules:
            - label: Ammonia conversion loop
          outputs:
            - label: Anhydrous ammonia
        - label: Site-scale enabling layer
          detail: Water permits, DOE-backed capital, and project execution determine whether the architecture scales.
          modules:
            - label: Water wells and monitoring
            - label: DOE / investor funding path
    approximationNotes: >-
      This is a structural stack, not a throughput model; public sources do not disclose the yield, uptime, or economics
