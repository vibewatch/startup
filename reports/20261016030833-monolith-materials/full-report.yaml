              - CU007
              - CU013
              - CU014
      - number: '6.3'
        title: Durability and scale-up evidence remain under-documented
        blocks:
          - type: paragraph
            body: |-
              The weakest part of the customer story is not whether Monolith has ever found buyers,
              but whether its current demand base is durable and broad enough to support the next
              expansion step. Hydrogen Council's 2023 market snapshot shows announced hydrogen demand
              far outrunning committed investment, which matters because Monolith's future growth case
              depends on scaling a low-carbon ammonia route beyond its initial plant. That expansion is
              also exposed to financing and policy risk: Semafor reported DOE planned to cancel the
              Monolith Nebraska ammonia-factory commitment, and Reason separately cited a large
              conditional DOE guarantee alongside reports of cash pressure and project delays. Until
              Monolith discloses customer counts, contract structure, or retention metrics, the chapter
              can support strategic relevance but not high confidence in customer durability.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
