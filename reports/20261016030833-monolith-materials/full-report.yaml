  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Industrial buyer segments are visible, but the roster is concentrated
        blocks:
          - type: paragraph
            body: |-
              The customer picture in the assigned public pool is industrial and concentrated rather
              than broad. Monolith's monetization path centers on selling carbon black and clean
              hydrogen, with the hydrogen stream increasingly framed as ammonia feedstock for
              fertilizer markets rather than a mass-market fuel product. The only clearly named
              product-offtake counterparties in this pool are Goodyear on the carbon-black side and
              Nebraska Public Power District on the hydrogen side. That is enough to show commercial
              relevance, but not enough to underwrite customer diversification, renewal durability, or
              multi-account expansion by itself.
            claimRefs:
              - CU001
              - CU002
