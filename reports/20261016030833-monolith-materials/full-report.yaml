  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Commercial product footprint
        blocks:
          - type: paragraph
            body: >-
              Monolith publicly defines the product stack as methane-pyrolysis conversion of natural gas into hydrogen
              and solid carbon, with the carbon sold as carbon black and the hydrogen positioned for clean-ammonia
              conversion. Across Monolith's own releases and partner commentary, Olive Creek 1 in Hallam is described as
              the first commercial-scale site and a real operating asset rather than a lab-only demonstration, with
              designed output of roughly 14,000 metric tons of carbon black annually plus clean hydrogen. Public
              materials from 2020-2021 also positioned Olive Creek 2 as the next layer of the product map, converting
              hydrogen into ammonia, while Wikipedia's current profile adds that Monolith still maintains an R&D center
              focused on carbon-black properties. That is enough to map the asset stack, but not enough to judge current
              product mix, grade-level qualification, realized output split, or customer-specific performance by line.
            claimRefs:
