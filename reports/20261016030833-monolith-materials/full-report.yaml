              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
      - number: '7.2'
        title: Regulatory, financing, and compliance exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports treating federal financing and permitting as live diligence items, not completed
              milestones. Semafor's May 2025 report explicitly named Monolith Nebraska among projects slated for
              cancellation, even though DOE's spokesperson said no decisions had been made. Reason separately tied
              Monolith's DOE conditional loan to a broader effort to claw back Biden-era green-project support and cited
              a Wall Street Journal description of cash pressure and delay. On the compliance side, Monolith's archived
              Wikipedia profile summarizes earlier local concern that OC2 water demand could be very large, later
              revised downward, with monitoring tied to approved wells. Carbon black itself is not an automatic blocker,
              but IARC's Group 2B classification means any scaling story still carries EHS and customer-perception
              obligations that require closer operating proof than public sources currently provide.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational and dependency concentration
        blocks:
          - type: paragraph
            body: >-
              Monolith's disclosed production story still looks concentrated in one geography, one core process, and a
              narrow set of product/end-market vectors. Company-issued materials say Monolith is already operating the
              largest clean-hydrogen facility of its kind and that Olive Creek 1 is designed for about 14,000 metric
              tons of carbon black annually, while OC2 is the planned ammonia scale-up path. That concentration makes
              any plant delay, water constraint, feedstock or power issue, or slower-than-expected offtake
              disproportionately important to the investment case. The demand side is not absent—Pulse2 quoted an
              investor pointing to strong demand from top brands, and Monolith has publicly pointed to carbon black and
              ammonia commercialization—but those signals do not yet replace granular proof on contracted offtake,
              diversified customers, or alternative capacity if Olive Creek misses its plan.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
          - type: table
