  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Route competition is clearer than startup-peer competition
        blocks:
          - type: paragraph
            body: >-
              The clearest competitive picture in the retained evidence is route-based, not company-list-based. DOE says
              95% of U.S. hydrogen is still made by natural-gas reforming in large central plants, and DOE describes
              reforming as a mature path that already rides existing pipeline infrastructure. In carbon black, CBC says
              the incumbent process still burns decant oil or coal tar. By contrast, the assigned pool surfaces only one
              direct lineage comparison inside methane pyrolysis itself: Monolith's own ARPA-E deck says it acquired
              technology from Kvaerner, whose earlier commercial facility shut during a period of high natural-gas and
              low-oil prices. That means Monolith is publicly benchmarked more against status-quo process classes than
              against a rich, transparent list of current startup peers.
            claimRefs:
              - CP002
              - CP004
