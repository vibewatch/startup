    Monolith Materials is a late-stage private industrial climate company founded in 2012 and based in Lincoln,
    Nebraska. It commercializes methane-pyrolysis technology that converts natural gas into carbon black and clean
    hydrogen, with ammonia positioned as the next value-capture step. Public evidence shows an operating Olive Creek 1
    plant, strategic backers, and customer relationships, but current revenue, cash, and cap-table detail remain opaque.
