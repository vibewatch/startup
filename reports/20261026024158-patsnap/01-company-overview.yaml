company:
  name: PatSnap
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PatSnap is a Singapore-founded innovation-intelligence software company built around
    patent, scientific-literature, and R&D data. The evidence supports a scaled private
    business with institutional funding and continued AI expansion, while customer-count,
    ARR, profitability, governance, and IPO claims remain source-dependent and require
    reconciliation.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      PatSnap was founded in 2007 and is described by multiple sources as headquartered
      in Singapore. Its product combines patent search and monitoring, scientific and
      market intelligence, competitive analysis, and AI-assisted workflows for IP and
      R&D teams. The company is therefore best characterized as enterprise innovation
      intelligence rather than a general-purpose AI vendor. Product descriptions differ
      in breadth: a comparison source emphasizes semantic search, technology clusters,
      emerging-trend detection, and monitoring, while a company-partner announcement
      describes faster patentability, novelty, invalidity, and opposition searches.
      Those descriptions support the core platform identity, but they do not establish
      product performance, retention, or customer ROI.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-funding-and-scale
    title: Leadership, funding, and scale
    body: >-
      Jeffrey Tiong is consistently identified as founder and CEO, with a founding story
      tied to NUS biomedical engineering and an early patent-diligence problem. A separate
      Nikkei-republished account identifies Guan Dian as a co-founder who leads Asian
      businesses. The strongest funding chronology in the retained pool is the NUS
      account: seed support in 2007, Series A in 2014, Series B in 2015, Series C in
      2016, Series D in 2018, and a US$300 million Series E in 2021 led by SoftBank
      Vision Fund 2 and Tencent Investment. Scale claims are not uniform: sources cite
      more than 10,000, 12,000, 15,000, and 18,000 customers, and one source reports
      700-plus employees. These should be retained as dated or issuer-attributed lenses,
      not collapsed into a single current KPI.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence-gaps
    title: Milestones and diligence gaps
    body: >-
      The company progressed from a 2007 founding to a 2010 product launch, successive
      venture rounds, unicorn status after the 2021 Series E, and further generative-AI
      product development. A 2026 IPO article describes exploration of simultaneous Hong
      Kong and Singapore listings and a potential US$300 million to US$400 million raise,
      while Forge's July 2025 page listed price, post-money valuation, total funding,
      and the last funding round as unavailable and market activity as limited. Neither
      source is filing evidence: IPO exploration is not a completed filing, and a
      proposed raise is not cash available. The retained evidence also does not establish
      audited current financials, cash balance, debt, governance or board composition,
      employee count beyond one company description, or a reconciled customer
      denominator. The timeline and gaps below make those limits visible.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
