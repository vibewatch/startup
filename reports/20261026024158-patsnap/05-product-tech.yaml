  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Independent security certifications, privacy architecture, uptime and incident history, and model-governance documentation.
      whyItMatters: These controls determine whether patent and R&D information can be placed in a decision-critical enterprise workflow.
      diligencePath: Request current SOC 2 or ISO certificates, security questionnaire responses, uptime reports, incident records and model-risk documentation from PatSnap.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: performance
      missingEvidence: Independent precision, recall, latency, hallucination and alert-noise benchmarks by workflow.
      whyItMatters: Search and AI claims are only investment-relevant if users can rely on outputs at a measurable quality and operating cost.
      diligencePath: Run a controlled pilot using representative patentability, FTO and monitoring tasks with pre-agreed accuracy and latency thresholds.
      relatedQuestionRefs: [QE003, QE006]
    - type: missing-source
      severity: minor
      topic: integrations
      missingEvidence: A complete public inventory of APIs, enterprise integrations, deployment options and service-level commitments.
      whyItMatters: Integration friction can determine implementation cost and whether the platform becomes embedded in existing R&D processes.
      diligencePath: Obtain current technical documentation, integration references, deployment architecture and support SLA terms.
      relatedQuestionRefs: [QE003, QE007]
