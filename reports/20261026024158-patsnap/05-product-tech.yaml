callouts:
  - calloutType: strength
    title: Broad data-to-decision surface
    body: PatSnap's defensible product story is the combination of patent intelligence, adjacent technical data, AI-assisted analysis and repeatable IP/R&D workflows rather than a single disclosed feature.
    claimRefs: [CE001, CE005, CE009]
  - calloutType: risk
    title: Control evidence is incomplete
    body: Public sources do not establish security certifications, uptime, model-evaluation controls, data-governance boundaries or customer-level reliability, so technical diligence remains material before mission-critical adoption.
    claimRefs: [CE013, CE014]
