  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, PatSnap solution described publicly, Measurable benefit, Limitation or open question]
    rows:
      - ["Find relevant prior art", "Manual patent and literature searching", "Search and analyze global patent data with AI assistance", "Faster discovery is claimed", "No public precision/recall benchmark"]
      - ["Assess novelty or freedom to operate", "Multi-step specialist search and review", "Patentability, novelty, invalidity and FTO-oriented workflows", "Partner says searches can move from days to minutes", "Outcome quality and human review burden are unverified"]
      - ["Track competitor technology", "Periodic landscape and competitive research", "Monitoring and trend analysis across competitors", "Near-real-time decision support is described", "Alert freshness and signal-to-noise are not disclosed"]
      - ["Move R&D decisions toward commercialization", "Separate data, research and strategy workstreams", "Innovation intelligence combining data, analytics and workflow automation", "Decision support is the intended outcome", "Customer-level ROI and adoption depth are unavailable"]
    notes: >-
      Benefits are preserved as claims or partner-described outcomes rather than
      treated as measured results. “Days to minutes” is a partner announcement
      statement about the combined workflow, not an independently tested benchmark.
    claimRefs: [CE002, CE004, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or diligence ask]
    rows:
      - ["Data corpus", "Patent, scientific and technical information", "External data rights, coverage, and refresh cadence", null]
      - ["Retrieval and analytics", "Search, classification, clustering and monitoring", "Validate relevance, explainability, and benchmark performance", null]
      - ["Domain-specific AI", "Conversational answers and specialist interpretation", "Open-source foundation model plus PatSnap data", "Hallucination, grounding, privacy, and model-governance controls"]
      - ["Workflow and services", "Search projects, reports, alerts and decision support", "Human analysts, integrations and delivery operations", "Measure reliability, support SLAs and repeatability"]
    notes: >-
      This is an evidence-bounded operating model synthesized from described
      product functions and one partner integration; PatSnap has not publicly
      disclosed a full infrastructure diagram in the retained sources.
    claimRefs: [CE005, CE008, CE010, CE013]
