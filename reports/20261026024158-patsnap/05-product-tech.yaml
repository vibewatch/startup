chapter:
  number: 5
  title: Product & Technology
  summary: PatSnap is an innovation-intelligence platform that combines patent and scientific-literature data with semantic search, analytics, workflow automation, and domain-specific AI. Public evidence supports a broad product surface and meaningful customer use, but independent proof of architecture, reliability, security controls, and production outcomes remains limited.
sections:
  - id: product-surface
    title: Product surface and workflow
    body: >-
      PatSnap's customer workflow starts with R&D and IP teams searching and
      analyzing patent, scientific, and technical information, then moves toward
      monitoring competitors, assessing novelty or freedom-to-operate questions,
      and informing product or partnership decisions. Public descriptions consistently
      position the platform as more than a patent database: the 2021 product account
      describes market and patent intelligence for innovation teams, while the
      partner announcement describes patent and scientific-literature search and
      analysis for faster decision support. A job description provides a concrete
      service workflow around patentability, freedom-to-operate, state-of-the-art,
      validity, landscape, and competitive-research projects. This supports a
      broad workflow proposition, but does not independently establish conversion,
      accuracy, or customer ROI.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: modules-and-architecture
    title: Modules, data and operating architecture
    body: >-
      The observable architecture is a layered data-to-decision system. At the
      base are global patent records and adjacent scientific, technical, company,
      and market signals. Above that are full-text or semantic retrieval, analytics,
      monitoring, and domain-specific generative-AI interfaces. The output layer
      includes search reports, technology landscapes, competitor monitoring, and
      decision support for R&D and IP users. Evalueserve's partnership gives a
      specific integration example: Searchstream was described as combining with
      PatSnap's patent and scientific-literature information to accelerate
      patentability, novelty, invalidity, and opposition searches. These sources
      establish product components and one partner workflow, not a complete
      technical design, service-level architecture, or validated model-quality
      benchmark.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment
    title: Maturity, deployment and differentiation
    body: >-
      Maturity is strongest at the commercial-surface level: the 2021 Business
      Times report described more than 10,000 customers and more than 700 employees,
      while later coverage described more than 12,000 corporate clients and
      industry-specific generative-AI services. The job listing shows a repeatable
      professional-services delivery process with project timelines, quality
      review, vendor oversight, and success metrics such as repeat customers and
      request growth. Differentiation therefore appears to come from combining
      a large IP corpus, domain-specific search and AI, and an enterprise workflow
      rather than from a single disclosed model or proprietary hardware component.
      Public material does not prove deployment reliability, integration breadth,
      or retention, so those should remain diligence questions.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-and-technical-risks
    title: Trust, controls and technical risks
    body: >-
      The main technical risks are evidence gaps rather than confirmed incidents.
      A competitor comparison says PatSnap's AI-generated insights require human
      validation and that advanced features require higher tiers; that is useful
      market context but is not an independent benchmark of PatSnap's accuracy.
      The company and partner materials reviewed here do not disclose security
      certifications, privacy architecture, uptime history, incident response,
      model-evaluation methodology, data-licensing boundaries, or customer-level
      integration controls. The use of a specialist model built on an open-source
      foundation, as described in external coverage, may improve domain relevance
      but leaves governance, retrieval quality, hallucination controls, and
      update cadence unresolved. Buyers should require evidence of these controls
      before treating the platform as decision-critical infrastructure.
    claimRefs: [CE013, CE014]
    tableRefs: []
tables:
