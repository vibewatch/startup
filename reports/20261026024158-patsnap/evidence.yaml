evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customers
    missingEvidence: >-
      A dated customer-account definition and reconciliation for the reported 10,000-plus, 12,000-plus, 15,000-plus, and
      18,000-plus figures.
    whyItMatters: >-
      Customer scale affects operating credibility and valuation, but inconsistent denominators can materially change
      the interpretation.
    diligencePath: >-
      Obtain management's dated KPI schedule defining active accounts, enterprise customers, clients, and geographic
      scope.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: financials
    missingEvidence: Audited or board-approved ARR, revenue, profitability, cash, debt, and margin figures for 2025 and 2026.
    whyItMatters: >-
      US$100 million and more-than-US$140 million ARR claims use different dates and issuers and cannot support a
      precise current valuation view.
    diligencePath: >-
      Request audited financial statements, ARR bridge, revenue-recognition policy, cash-flow statement, and debt
      schedule under NDA.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board, executive roster, ownership, primary-versus-secondary financing split, and IPO filing evidence.
    whyItMatters: Governance and transaction structure determine key-person, control, dilution, and execution risk.
    diligencePath: >-
      Review the latest cap table, board materials, statutory filings, and any confidential or public prospectus when
      available.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Audited market segmentation, PatSnap segment revenue, realized contract values, renewal rates, and customer counts
      using one consistent denominator.
    whyItMatters: >-
      Without a common denominator, public filing volume, claimed platform reach, and directional prices cannot support
      a defensible SAM, SOM, or valuation multiple.
    diligencePath: >-
      Request management's market model, ARR by customer segment and geography, ACV distribution, renewal and expansion
      cohorts, and the assumptions used for any IPO equity story.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Segment-level budget ownership, implementation cost, sales cycle, and adoption/retention evidence for IP, R&D,
      strategy, and professional-services buyers.
    whyItMatters: >-
      The buyer map identifies plausible workflows but cannot yet establish which segment drives repeatable growth or
      how switching costs affect adoption timing.
    diligencePath: >-
      Obtain win/loss data, pipeline by buyer persona, implementation timelines, paid-seat or workspace activation,
      churn, and net expansion by segment.
    relatedQuestionRefs:
      - QM006
      - QM007
      - QM008
      - QM009
  - type: stale
    severity: minor
    topic: customer-reach
    missingEvidence: >-
      A current independently verified customer count and geographic/industry mix reconciled to the official site's
      18,000+ figure and earlier 10,000+ partner description.
    whyItMatters: The two public reach figures have different dates and issuers, so trend or penetration cannot be inferred safely.
    diligencePath: Request a dated customer cohort schedule, active-account definition, and industry/geography breakdown under NDA.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current PatSnap quotes, discounting, contract length, feature-tier limits, renewal rates, and customer-level
      switching data.
    whyItMatters: >-
      Directional vendor pricing cannot establish realized monetization, procurement power, or the economic durability
      of the competitive moat.
    diligencePath: >-
      Obtain comparable multi-year quotes and run a controlled buyer pilot measuring precision, alert noise,
      time-to-answer, adoption, and renewal conditions.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: output-quality
    missingEvidence: >-
      Independent benchmark or customer-controlled comparison of PatSnap, Orbit, Wicely, and free tools on
      representative patent and monitoring tasks.
    whyItMatters: >-
      Most capability claims are issuer- or vendor-authored, so positioning and ordinal figure coordinates remain
      provisional.
    diligencePath: >-
      Commission a blinded evaluation using the same corpus, queries, alert windows, and success criteria across
      shortlisted products.
    relatedQuestionRefs:
      - QP002
      - QP005
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current consolidated cash, monthly burn, debt, lease obligations, and runway under base and downside cases.
    whyItMatters: >-
      Reported break-even and historical funding do not establish liquidity or financing dependency for a private
      company.
    diligencePath: Request the latest management accounts, cash-flow statement, debt schedule, and 24-month runway model.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue bridge, ARR definition, retention, churn, customer concentration, contract length, and realized
      price.
    whyItMatters: ARR and management-reported mix do not show recognized revenue quality or cohort durability.
    diligencePath: Reconcile ARR to GAAP/IFRS revenue by product and provide cohort-level renewal and expansion schedules.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: traction
    missingEvidence: >-
      A single current customer and headcount definition reconciled across company, partner, registry, and database
      sources.
    whyItMatters: Retained sources report different customer and employee counts, limiting comparability and scale confidence.
    diligencePath: Obtain a dated customer-account census, employee count, and definition of enterprise customer.
    relatedQuestionRefs:
      - QI002
      - QI006
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: >-
      Independent security certifications, privacy architecture, uptime and incident history, and model-governance
      documentation.
    whyItMatters: >-
