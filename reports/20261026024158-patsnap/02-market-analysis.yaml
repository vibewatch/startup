callouts:
  - calloutType: insight
    title: The market is a workflow layer over a large information corpus
    body: PatSnap's opportunity is better framed as monetizing recurring decisions around patents, science, and technology than as owning a count of indexed documents. The corpus is large and growing, but public evidence does not establish what share becomes paid, retained workflow spend.
    claimRefs: [CM005, CM010, CM014]
  - calloutType: risk
    title: Public sizing cannot yet support a clean SAM or SOM
    body: Filing counts, company-claimed data points, customer counts, and directional software prices use different denominators. A valuation model should keep them separate until PatSnap discloses segment mix, pricing, retention, and budget capture.
    claimRefs: [CM007, CM008, CM009, CM014]
