    title: Market definition and substitute map
    columns: [Segment/category, Included spend or activity, Excluded or substitute activity, Buyer/payer, Relevance]
    rows:
      - ["Patent and literature search", "Subscription access to searchable patent, scientific, and technical corpora", "General web search and one-off manual research", "IP and R&D teams", "Core workflow"]
      - ["Innovation analytics", "Landscapes, technology trends, competitor monitoring", "Patent prosecution and outside counsel fees", "IP, strategy, and innovation leaders", "Core workflow"]
      - ["AI research workflow", "Search, tagging, summaries, invention disclosure, and analysis automation", "General-purpose AI without domain data", "R&D and technology scouts", "Expansion vector"]
      - ["Professional services", "Search and research project delivery", "Internal analyst labor and consulting bought outside the platform", "IP operations and commercial teams", "Services attach"]
    notes: "Boundary is an analytical classification based on PatSnap product descriptions and the Wicely comparison; included and excluded categories are not a disclosed company market-size calculation."
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Sizing and demand lenses
    columns: [Publisher or lens, Year, Geography, Value, CAGR or growth, Methodology, Confidence, Limitation]
    rows:
      - ["WIPO World Intellectual Property Indicators", "2024", "Worldwide", "3.7 million patent applications", "+4.9% versus 2023", "Statistics from about 150 national and regional IP offices", "high", "IP filings are a workload proxy, not software TAM or PatSnap revenue"]
      - ["WIPO published technology mix", "2023", "Worldwide", "Computer technology: 13.2% of published applications", "Not stated as a CAGR", "Share of published patent applications by technology field", "high", "Field share is not spend or software penetration"]
      - ["PatSnap official site", "2026", "Worldwide claim", "2 billion+ structured data points; 18,000+ innovators", "Not disclosed", "Company marketing disclosure", "medium", "Company-claimed and not independently audited in the source"]
      - ["Wicely comparison", "undated directional range", "Enterprise software", "$10,000-$40,000+ annual PatSnap range", "Not stated", "Typical mid-market deal range by tier and users", "low", "Approximate, negotiated pricing; not a market average"]
    notes: "The rows are separate sizing lenses with different units and denominators; they must not be summed or multiplied into a TAM, SAM, SOM, or revenue estimate."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - ["IP professionals", "Chief IP counsel or IP operations", "Patent searchers and analysts", "IP department", "Patentability, validity, FTO, and portfolio analysis", "Need for precise search and legal-status coverage"]
      - ["Corporate R&D", "R&D leadership", "Scientists and engineers", "R&D budget", "Technology discovery and white-space analysis", "Faster research and less duplicated work"]
      - ["Innovation and strategy", "Innovation leader or corporate strategy", "Technology scouts and strategists", "Strategy or innovation budget", "Competitor and market intelligence", "Need to identify emerging technologies and partners"]
      - ["Professional services", "Services or commercial operations leader", "Search and research specialists", "Services or project budget", "Client-facing search projects and repeat delivery", "Demand for capacity and measurable client satisfaction"]
    notes: "Buyer, user, and payer roles are analytical mappings inferred from the product use cases and job description; public sources do not disclose PatSnap's segment-level budget ownership or conversion rates."
    claimRefs: [CM001, CM002, CM010, CM014]
