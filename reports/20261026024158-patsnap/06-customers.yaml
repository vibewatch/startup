    title: Customer journey and expansion surfaces
    type: journey-map
    summary: The public workflow supports discovery, analysis, decision support, and services expansion, while outcome validation and renewal remain unverified stages.
    data:
      items:
        - label: Frame the question
          description: "R&D and IP teams define a technology, novelty, competitive, or portfolio question."
          touchpoints: ["R&D priorities", "IP strategy", "Technology opportunity"]
        - label: Discover evidence
          description: "Users search patent records, scientific literature, market information, and competitive data."
          touchpoints: ["Patent search", "Scientific literature", "Competitive intelligence"]
        - label: Analyze
          description: "AI-assisted search and analytics organize findings for technical and legal review."
          touchpoints: ["Novelty", "Invalidity", "Landscape analysis"]
        - label: Decide
          description: "Teams use the resulting intelligence to guide research, protection, and commercialization choices."
          touchpoints: ["R&D direction", "Portfolio action", "Commercialization"]
        - label: Expand
          description: "Partner search services and professional-services projects create routes to broader or repeated use."
          touchpoints: ["Expert search", "Repeat requests", "Services adoption"]
        - label: Validate durability
          description: "Reference calls, cohort data, renewal evidence, and measured outcomes are needed to prove durable adoption."
          touchpoints: ["Customer references", "Retention cohorts", "Outcome measurement"]
    approximationNotes: "Stages reflect described workflows and diligence requirements; they are not a measured funnel and imply no conversion rate."
    claimRefs: [CU011, CU012, CU013, CU015]
