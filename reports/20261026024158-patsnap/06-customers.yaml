    rows:
      - ["Tesla", "Automotive and technology", "Named in PatSnap's 2021 release and Nikkei Asia reporting", "Not disclosed", "No customer-specific outcome disclosed", "No current account, contract, deployment, or renewal detail"]
      - ["Siemens", "Industrial technology", "Named in PatSnap's 2021 release and Nikkei Asia reporting", "Not disclosed", "No customer-specific outcome disclosed", "No current account, contract, deployment, or renewal detail"]
      - ["Spotify", "Consumer technology", "Named in PatSnap's 2021 release and June 2026 Crypto Briefing coverage", "Not disclosed", "No customer-specific outcome disclosed", "No current account, contract, deployment, or renewal detail"]
    notes: "This is a partial corroborated sample, not a complete customer list; a named organization does not prove current production use, spend, retention, or outcome."
    claimRefs: [CU009, CU010]
figures:
