      - ["Clients", "Over 15,000 across more than 50 countries", "2026-06-15", "Crypto Briefing", "Medium; independent but unsupported by a disclosed denominator", "Provides a current-year independent count", "Definition of client and reconciliation to enterprise customers"]
      - ["Corporate clients", "More than 12,000", "Publication date unavailable in fetched page", "Nikkei Asia, republished by KrASIA", "Medium; independent interview reporting", "Confirms substantial corporate reach", "Definition, active status, and reporting period"]
    notes: "Values are source-attributed disclosures, not a comparable growth series; labels, vintages, and denominators differ, and unavailable dates remain explicitly unavailable."
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
