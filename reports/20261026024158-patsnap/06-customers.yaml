company:
  name: PatSnap
chapter:
  number: 6
  title: Customers
  summary: PatSnap has broad reported adoption across enterprise R&D and IP workflows, but the assigned public evidence gives inconsistent customer-count vintages and definitions. Named logos and workflow claims support commercial reach, while retention, production status, account-level outcomes, and top-customer concentration remain material diligence gaps.
sections:
  - id: customer-base
    title: Customer base and segmentation
    body: >
      PatSnap addresses a professional user base spanning R&D, IP, innovation, strategy, university, and research teams rather than a single vertical. Public descriptions place these users in life sciences, manufacturing, consumer goods, engineering, automotive, energy, aerospace, education, and other research-intensive sectors. Buyer and payer detail is much thinner: the sources identify teams and institutions, but do not disclose the mix of enterprise subscriptions, research institutions, professional-services engagements, geographies, company sizes, or revenue bands. A Nikkei Asia report republished by KrASIA adds an important concentration lens, attributing around 70% of revenue to US and Chinese clients, but no source in the assigned pool quantifies exposure to any individual customer.
    claimRefs: [CU004, CU008, CU011, CU016]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named proof
    body: >
      The public record repeatedly describes a large international customer base, yet it does not form a comparable adoption time series. PatSnap said it had more than 10,000 customers in 2021; later pages report more than 12,000, more than 15,000, and more than 18,000 using different labels such as customers, clients, corporate clients, and enterprise customers. Several pages have no publication date in the fetched text, so a growth rate would be unsupported. Named organizations improve proof quality only modestly. Tesla, Siemens, and Spotify appear across both company-issued and independent reporting, but none of the retained sources establishes current production status, contract value, renewal, usage, or a customer-specific outcome.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU009, CU010]
    tableRefs: [TU002, TU003]
  - id: workflows-and-expansion
    title: Workflow value and expansion surfaces
    body: >
      Evidence is strongest on the jobs customers are meant to perform. PatSnap and Evalueserve describe patentability, novelty, invalidity, and opposition searches for R&D, IP, and innovation professionals, while broader sources describe patent, scientific-literature, market, and competitive analysis. The partnership claims that combined searches can be completed in minutes rather than days, and PatSnap's 2021 release estimated a 12-fold acceleration in time to insight and a threefold increase in successful product launches over the preceding year. Those outcome figures are company estimates, not independent customer measurements. A current job repost nevertheless shows plausible expansion levers: repeat projects, professional-services adoption, service-request growth, and client satisfaction are internal success metrics.
    claimRefs: [CU011, CU012, CU013, CU015]
    figureRefs: [FU001]
  - id: durability-and-risk
    title: Durability, friction, and concentration risk
    body: >
      Durability remains the central missing proof point. The assigned evidence discloses no NRR, GRR, churn, renewal rate, contract-length distribution, cohort utilization, or customer-level expansion. Internal tracking of repeat customers is directionally useful but does not reveal the result. Competitor Wicely also identifies adoption friction: it characterizes PatSnap as broad and AI-assisted, while warning that AI output needs human validation, advanced capabilities require higher tiers, and the interface can be complex. Because this critique comes from a competitor, it is adverse evidence rather than an independent benchmark. The combination of unreported retention, opaque pricing tiers, and revenue concentration by country makes reference calls and cohort data essential before treating reported customer breadth as durable revenue quality.
    claimRefs: [CU007, CU014, CU015, CU016]
callouts:
  - calloutType: insight
    title: Breadth is better supported than durability
    body: Multiple sources describe a five-figure customer base across many countries and industries, but their differing dates and definitions do not establish active-account growth or retention.
    claimRefs: [CU001, CU004, CU005, CU007]
  - calloutType: risk
    title: Customer economics remain private
    body: Public sources do not disclose retention, renewal, contract duration, customer-level expansion, top-account concentration, or independently measured outcomes.
    claimRefs: [CU007, CU013, CU015, CU016]
