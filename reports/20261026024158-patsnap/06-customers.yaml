      topic: retention-and-expansion
      missingEvidence: "NRR, GRR, churn, renewal rates, contract lengths, cohort utilization, and expansion by customer segment."
      whyItMatters: "Reported customer breadth and internal success metrics do not establish durable recurring usage or revenue."
      diligencePath: "Request a three-year cohort bridge with beginning recurring revenue, renewals, churn, downsell, expansion, and ending recurring revenue."
      relatedQuestionRefs: [QU009]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: "Current, customer-attributed, independently measured outcomes with baseline, period, denominator, and deployment scope."
      whyItMatters: "Company estimates and generic outcome descriptions cannot establish realized return on investment for production customers."
      diligencePath: "Conduct reference calls and obtain before-and-after workflow metrics for at least three production customers across distinct segments."
      relatedQuestionRefs: [QU010]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: "A current representative customer sample with production status, contract value, renewal history, and quantified outcome."
      whyItMatters: "Publicly named organizations may be historical, pilot-stage, or immaterial accounts rather than durable production deployments."
      diligencePath: "Request a stratified reference set and verify deployment scope, current status, renewal, spend, and realized outcome directly with each customer."
      relatedQuestionRefs: [QU003, QU010]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: "Top-customer and top-10 customer revenue shares, renewal calendar, and partner- or channel-sourced revenue."
      whyItMatters: "A reported 70% revenue exposure to US and Chinese clients does not reveal single-account dependence or renewal-cliff risk."
      diligencePath: "Obtain anonymized account concentration bands, contract terms, renewal timing, and channel attribution from the customer ledger."
      relatedQuestionRefs: [QU007, QU009]
