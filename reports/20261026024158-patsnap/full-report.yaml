    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              PatSnap was founded in 2007 and is described by multiple sources as headquartered in Singapore. Its
              product combines patent search and monitoring, scientific and market intelligence, competitive analysis,
              and AI-assisted workflows for IP and R&D teams. The company is therefore best characterized as enterprise
              innovation intelligence rather than a general-purpose AI vendor. Product descriptions differ in breadth: a
              comparison source emphasizes semantic search, technology clusters, emerging-trend detection, and
              monitoring, while a company-partner announcement describes faster patentability, novelty, invalidity, and
              opposition searches. Those descriptions support the core platform identity, but they do not establish
              product performance, retention, or customer ROI.
