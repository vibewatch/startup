              - CU016
      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >
              The public record repeatedly describes a large international customer base, yet it does not form a
              comparable adoption time series. PatSnap said it had more than 10,000 customers in 2021; later pages
              report more than 12,000, more than 15,000, and more than 18,000 using different labels such as customers,
              clients, corporate clients, and enterprise customers. Several pages have no publication date in the
              fetched text, so a growth rate would be unsupported. Named organizations improve proof quality only
              modestly. Tesla, Siemens, and Spotify appear across both company-issued and independent reporting, but
              none of the retained sources establishes current production status, contract value, renewal, usage, or a
              customer-specific outcome.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
