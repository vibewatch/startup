artifact: financials
slug: patsnap
runDate: 2026-10-26
company:
  name: PatSnap
chapter:
  number: 4
  title: Financials
  summary: >
    PatSnap presents a recurring software business with a separate AI-native product
    layer, but public evidence remains a mixture of company statements, partner
    materials, and directional databases rather than audited financial disclosure.
    The strongest underwriting conclusion is that revenue quality may be attractive,
    while cash, retention, realized pricing, margins, and IPO proceeds remain open.
sections:
  - id: revenue-model
    title: Revenue model and traction
    body: >
      The available evidence supports a subscription-led innovation-intelligence
      model rather than a transactional marketplace. NUSX reports that the company
      broke even in 2024 and exceeded US$140 million of ARR in 2025, while also
      quoting management's split of 75% of revenue from its established SaaS product
      and 25% from an AI-native product. Those figures are important but are
      institutionally reported company statements, not audited accounts. Evalueserve
      describes access to patents, scientific literature, and industry information
      as the basis of the platform and says PatSnap serves tens of thousands of
      innovators. The wide customer and data-coverage figures differ across sources,
      so the analysis treats them as directional traction signals rather than a
      reconciled customer cohort.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: monetization-and-sales
    title: Monetization, sales motion, and delivery economics
    body: >
      PatSnap does not publish list prices in the retained evidence, so realized
      price, discounting, contract duration, renewal mechanics, and seat or usage
      expansion cannot be modeled. Wicely, a competitor, describes subscriptions
      differentiated by user count and feature tier and estimates annual pricing
      at US$10,000–40,000+, but explicitly labels market ranges as directional.
      A company job posting also describes professional-services search and
      research projects, client satisfaction, repeat customers, and growth in
      service requests as success metrics. A low-reputation case profile describes
      subscription pricing plus value-added services. Together, these sources
      identify likely monetization levers but do not establish realized ACV, gross
      margin, CAC, payback, or the cost of analyst and domain-expert delivery.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: cost-and-capital
    title: Cost structure and capital adequacy
    body: >
      NUSX reports that PatSnap broke even in 2024, but accounting break-even does
      not establish current cash generation or liquidity. The retained evidence
      does not disclose cash on hand, cash burn, debt, runway, working capital,
      capex, or gross margin. A UK Companies House record shows the UK subsidiary's
      last accounts were made up to 31 December 2025, but the fetched overview
      does not expose the statements or consolidated group economics. The reported
      dual-IPO target of US$300–400 million is a secondary-source financing
      intention, not cash raised, cash available, or a committed facility.
      Capital adequacy therefore remains a material diligence blocker despite
      the reported operating milestone.
    claimRefs: [CI010, CI011, CI012, CI014]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >
      The financial case is strongest on recurring-revenue architecture and weakest
      on verification. Management-linked evidence describes a meaningful SaaS base,
      an AI-native revenue layer, reported break-even, and ARR above US$140 million
      in 2025. Independent or registry evidence does not yet reconcile those figures
      to recognized revenue, cash conversion, retention, customer concentration, or
      unit economics. The adverse buyer evidence is also relevant: a 2026 comparison
      says PatSnap has tiered access restrictions and that its security and AI
      integration posture require buyer diligence. That is not a margin finding, but
      it raises the possibility that enterprise adoption and expansion depend on
      procurement, trust, and feature-tier friction. A financing decision should
      therefore remain research-more until audited statements, cohort data, price
      realization, and IPO use of proceeds are available.
    claimRefs: [CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or value, Evidence status, Underwriting implication]
    rows:
      - [Core SaaS, "Recurring innovation-intelligence software", "75% of revenue (management-reported)", "Company statement quoted by NUSX; not audited", "Potentially durable base, but retention and realized price are unknown"]
      - [AI-native product, "AI product architecture layered on the same core dataset", "25% of revenue (management-reported)", "Company statement quoted by NUSX; not audited", "Expansion vector; usage, gross margin, and cannibalization are unknown"]
      - [Professional services, "Patent and research search projects", "No public value", "Job posting describes the motion and success metrics", "May add services revenue and delivery cost; mix is undisclosed"]
      - [Value-added services, "Services alongside subscription software", "No public value", "Low-reputation third-party case profile describes the model", "Could diversify monetization; contribution margin is unreported"]
      - [Reported recurring traction, "Annual recurring revenue", "Over US$140M in 2025", "NUSX-reported management figure; not independently audited", "Material scale signal, but ARR is not recognized revenue"]
    notes: "Sources mix management-linked statements, a company job posting, and a third-party profile; percentages and ARR are not audited, and null values mean no public figure was found."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI009]
  - id: TI002
    title: Pricing and monetization
    columns: [Revenue component, Price or contract basis, List versus realized, Known qualification, Diligence ask]
    rows:
      - [Core platform, "Subscription; user and feature tier differentiated", "No vendor list price; competitor estimate only", "Wicely estimates US$10,000–40,000+ per year and labels ranges directional", "Obtain standard price card, contract terms, and realized ARR by cohort"]
      - [AI-native product, null, "Unknown", "Management reports a separate product architecture, not a price", "Obtain usage metric, credit or seat schedule, and expansion rate"]
      - [Professional services, null, "Unknown", "Job posting describes projects but not rates", "Obtain project pricing, utilization, subcontractor cost, and gross margin"]
      - [Enterprise contracts, null, "Unknown", "Customer count and contract distribution are not reconciled", "Request ACV bands, term length, renewal and concentration schedule"]
      - [Discounting and procurement, null, "Unknown", "No public discount or procurement data retained", "Test list-to-realized waterfall and approval concessions"]
    notes: "No retained source publishes PatSnap list pricing or realized pricing; nulls are evidence gaps, not zero prices."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, low, "Software and services mix may have different delivery costs", "Obtain audited gross margin by product and services"]
      - [CAC, null, low, "Global expansion and local sales hiring could be material", "Obtain fully loaded CAC by channel and cohort"]
      - [Payback period, null, low, "No contract, churn, or sales-efficiency data", "Obtain cohort payback with implementation costs"]
      - [Cash balance, null, low, "Reported break-even does not establish liquidity", "Obtain latest consolidated cash and restricted cash"]
      - [Burn and runway, null, low, "Current burn and obligations are not disclosed", "Obtain monthly cash flow, debt, leases, and runway case"]
      - [IPO proceeds, "US$300M–US$400M target", medium, "Secondary reports describe a proposed raise, not cash available", "Verify filing, primary/secondary split, and use of proceeds"]
    notes: "Unavailable values are deliberately null. Reported financing targets are not treated as cash on hand, and accounting break-even is not treated as cash-flow break-even."
    claimRefs: [CI010, CI011, CI012, CI014]

