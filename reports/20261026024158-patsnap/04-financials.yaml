callouts:
  - calloutType: strength
    title: Recurring base is the clearest positive signal
    body: "Management-linked evidence reports ARR above US$140 million in 2025 and a 75% SaaS revenue share, but both require primary financial verification."
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Liquidity cannot be inferred from fundraising or break-even
    body: "The retained evidence does not disclose cash, burn, runway, debt, or gross margin; a proposed IPO raise is not cash available."
    claimRefs: [CI010, CI011, CI012, CI014]
  - calloutType: recommendation
    title: Require cohort and cash schedules before underwriting
    body: "The next diligence step is a reconciled revenue bridge with retention, realized pricing, services cost, cash flow, debt, and IPO proceeds detail."
    claimRefs: [CI013, CI014, CI015, CI016]

