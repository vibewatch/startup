company:
  name: PatSnap
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a scaled, recurring-revenue innovation-intelligence business, but not a fully underwritten public-market valuation. The reported potential dual IPO and valuation above $2 billion create an attractive liquidity narrative while audited growth, margins, cash flow, retention, cap-table terms, and offering structure remain unverified, so the evidence-led stance is research-more rather than buy.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      PatSnap has credible operating proof: Tech in Asia reports that the company sells software to corporate R&D and IP teams, while its 2021 funding coverage records a US$300 million Series E at a valuation above US$1 billion and more than 10,000 customers and 700 employees at that time. The company’s own site describes a platform spanning patent, scientific-literature, and legal-data workflows, and Evalueserve describes a live partnership that gives PatSnap users expedited searches. These are useful indicators of product breadth and market adoption, but they are not a substitute for audited revenue, retention, gross margin, cash generation, or a filed prospectus. The current public evidence therefore supports a trackable asset with a credible IPO option, not a buy decision at an unconfirmed valuation.

      Tech in Asia reports a possible valuation above US$2 billion and a potential US$300–400 million raise, based on people familiar with the matter, while separately noting the last disclosed US$300 million round in 2021. That implies a large step-up from the last disclosed mark, but the article does not provide a priced term sheet, share count, primary/secondary split, investor demand, or financial denominator. A disciplined entry condition is a public filing or equivalent diligence pack that reconciles price, fully diluted shares, proceeds, use of proceeds, liquidation preferences, lock-ups, and audited revenue and cash-flow history. Until then, the reported valuation should be treated as a market rumor range, not a verified enterprise value or equity value.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and comparable context
    body: >-
      The investment thesis is that PatSnap has converted proprietary, structured IP and R&D data into a broad enterprise workflow. NUSX describes more than two billion structured data points, more than 18,000 enterprise customers across 60 countries, break-even in 2024, and more than US$140 million of ARR in 2025; those figures are founder/company-originated and need primary financial verification, but they describe a scale profile that could support a software-style multiple if retention and margins are strong. The competitive thesis is also credible: Wicely’s comparison says PatSnap combines patents, business data, and AI, while LexisNexis positions PatentSight+ as a competing AI-enabled patent-analytics platform built on more than 100 million harmonized patent families. PatSnap therefore has a marketable category, but it does not have an obvious monopoly.

      The anti-thesis is price and proof. A possible valuation above US$2 billion against a founder-reported ARR above US$140 million would be roughly 14x ARR, but that ratio is an analyst calculation from two non-audited public figures with different disclosure contexts, not a verified valuation multiple. It must not be used as a precise benchmark. Competitive offerings, opaque enterprise pricing, and the absence of public NRR, churn, gross margin, cash balance, and debt disclosure make it impossible to distinguish durable subscription economics from services, implementation, or one-time demand. The downside case is therefore not that the product lacks value; it is that the public price embeds a growth-and-margin outcome that the evidence cannot yet prove.
    claimRefs: [CV008, CV010, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      A bull case requires the IPO process to produce audited evidence that recurring SaaS revenue is the dominant stream, growth remains durable, retention is strong, margins are improving, and the proposed primary capital is sufficient to fund expansion without punitive dilution. A base case assumes the platform remains commercially useful and the IPO is delayed or priced below the reported ambition until disclosure improves; that outcome supports tracking rather than underwriting the rumor. A bear case is a failed or down-round process, a material gap between ARR and recognized revenue, weak renewal economics, or a public-market discount caused by governance, liquidity, preference, or concentration concerns. These scenarios are probability signals, not forecasts, because the assigned public sources do not provide a verified cap table, audited statements, or offering document.

      Exit readiness is signaled by confidential filings, but filing confidentially is not the same as approval, listing, pricing, or successful aftermarket liquidity. The key diligence asks are: obtain the prospectus or equivalent audited financial package; reconcile ARR to revenue and cash collections; inspect customer concentration, renewal cohorts, NRR, gross margin, services mix, debt, and cash runway; and review primary versus secondary shares, preferences, lock-ups, governance, and use of proceeds. Thesis-break triggers are a withdrawal or prolonged delay without a credible financing alternative, audited retention or margin materially below underwriting assumptions, a valuation that implies an unsupported premium to public information-services comparables, or evidence that AI features increase cost faster than monetization.
    claimRefs: [CV015, CV016, CV017, CV020, CV021]
    tableRefs: [TV003]
    figureRefs: [FV001]
