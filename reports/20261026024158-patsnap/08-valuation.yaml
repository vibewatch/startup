    notes: "The ~14x figure is an explicitly approximate analyst calculation from a reported valuation and founder/company-originated ARR; it is not a verified trading multiple or valuation conclusion."
    claimRefs: [CV008, CV010, CV011, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited recurring revenue confirms scale; growth, retention, and margins remain strong; IPO terms are clean.", "A premium software-information multiple could be supportable, but no public range is defensible yet.", "Execution, public-market volatility, dilution, and AI cost-to-serve.", "Upside is conditional on primary evidence; not a current probability estimate."]
      - [Base, "Business remains useful; IPO is delayed or priced below the reported ambition while disclosure improves.", "Track until price is anchored to audited revenue, cash flow, and dilution.", "Timing, liquidity, governance, and valuation compression.", "Most defensible current posture because disclosure is incomplete."]
      - [Bear, "IPO fails or down-rounds; retention/margins disappoint; cap-table or preference overhang impairs new holders.", "Avoid or wait for a materially lower, fully diluted price.", "Commercialization failure, customer concentration, cash needs, and public-market discount.", "Material downside cannot be quantified from assigned public evidence."]
      - [Diligence gate, "Prospectus and audited package reconcile ARR, revenue, cash, debt, customer cohorts, and share structure.", "Move from research-more only after a price-sensitive underwriting model is possible.", "Missing or inconsistent disclosures remain thesis-breaking.", "Binary evidence gate rather than a forecast."]
    notes: "Scenario values are qualitative because the assigned pool contains no audited PatSnap financial statements, prospectus, cap table, or verified public-company multiple set. Do not interpret the table as a precise return forecast."
    claimRefs: [CV015, CV016, CV017, CV020, CV021]
