  evidenceGaps:
  - type: private-evidence-only
    severity: moderate
    topic: Einride win rate vs. Daimler EaaS and OEM competitors in enterprise sales
    missingEvidence: No public data on Einride's head-to-head win rate against competing TaaS/EaaS programs in enterprise
      procurement situations.
    whyItMatters: Win rate determines whether the TaaS model actually beats OEM competition in practice, not just in theory.
    diligencePath: Request CRM data and competitive pipeline analysis in formal diligence.
    relatedQuestionRefs:
    - QP020
  - type: missing-source
    severity: moderate
    topic: Einride per-vehicle TaaS pricing vs. Daimler EaaS and market alternatives
    missingEvidence: Einride's TaaS pricing structure and per-vehicle monthly fees are not publicly disclosed; comparison
      to Daimler EaaS relies on industry estimates.
    whyItMatters: Pricing relative to alternatives determines gross margin sustainability and price premium durability.
    diligencePath: Request sample TaaS contract pricing and competitive bid analysis in formal diligence.
    relatedQuestionRefs:
    - QP017
  - type: missing-source
    severity: minor
    topic: Volvo Autonomous Solutions commercial timeline in EU — key variable for Nordic market durability
    missingEvidence: Volvo has not publicly disclosed a specific timeline for commercial-scale Level 4 autonomous freight
      in the Nordic/EU market.
    whyItMatters: Volvo EU AV commercialization is the key tail risk to Einride's Nordic first-mover advantage.
    diligencePath: Monitor Volvo Autonomous Solutions press releases and regulatory permit applications.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: minor
    topic: Fleet Portal network effects data — whether data from one customer improves outcomes for others
    missingEvidence: No public evidence quantifies whether Einride's Fleet Portal exhibits cross-customer network effects
      (e.g., route optimization improving for all customers as fleet grows).
    whyItMatters: Network effects would significantly strengthen the software moat and justify higher per-customer ARR multiples.
    diligencePath: Request Fleet Portal architecture documentation and route optimization improvement metrics in formal diligence.
    relatedQuestionRefs:
    - QP019
