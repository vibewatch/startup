summary:
  headline: Einride 是已获商业验证的自动货运 TaaS 公司，拥有蓝筹 CPG 客户背书和 500K+ 自动驾驶公里数；按 2024 年收入 39–42x 估值偏贵，若 SPAC 交割且信托净所得 >$100M，再以更高信心切入观察。
  overallScore: 6.2
