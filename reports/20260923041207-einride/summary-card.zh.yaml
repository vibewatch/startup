  topStrengths:
    - 蓝筹 CPG 客户验证（Heineken、PepsiCo、Carlsberg、GE Appliances）叠加多年主协议，是欧盟出身创业公司里最强的商业自动驾驶货运验证
    - 有安全员监督的自动驾驶运营累计 500,000+ 公里，且没有报告事故，降低了商业货运自动驾驶“能不能跑”的核心风险
    - CSRD Scope 3 物流合规需求为 FMP 碳模块带来监管护城河；500+ 货主数据网络带来可防守的定价差异
    - $65M 合同 ARR 叠加多年协议，证明软件切换成本、留存和经常性收入可预测性真实存在
    - Robert Falck 的汽车行业信誉（Volvo Cars）、EQT Growth / SoftBank Vision Fund 2 一线背书，以及物流领域专家作为 PIPE 战略投资人的验证
  topRisks:
    - 客户集中：公开点名账户只有 4 个；PepsiCo/Frito-Lay 估计贡献收入 20–30%；任何不续约都会实质损害 ARR 增长和 $1.8B 估值逻辑
    - SPAC 赎回风险：2024–2025 年市场趋势显示赎回概率 >50%；若信托净所得低于 $50M，车队扩张资本计划会被打断
    - 自动驾驶技术时间线：$1.8B 估值包含 $1.4-1.5B 尚未商业化兑现的无安全员 L4 期权；Aurora Innovation 先例显示，时间线滑坡会导致 SPAC 估值下修 60–80%
    - Luminar LiDAR 单一来源依赖：Luminar 财务不确定性给 Pod 项目带来供应连续性风险，且未披露替代供应商认证进展
    - 依赖 NHTSA FMVSS 豁免：美国 Pod 商业运营需要持续续期豁免；任何限制现有 ODD 的监管行动都是美国业务的生存级风险
  unresolvedGaps:
    - 客户 NRR、总留存率和合同续约历史——这是留存健康度的核心指标，所有公开披露都缺失
    - SPAC 信托赎回迹象和股东投票时间线——这是入场决策的关键门槛
    - FY2024 损益细节：分业务毛利率、EBITDA、现金头寸和烧钱速度——这些是建模盈利轨迹的必要输入
    - 总客户数和按账户划分的收入集中度——没有这些数据就无法量化客户集中风险
    - Luminar 替代 LiDAR 认证状态和供应合同条款——评估关键供应商风险必须拿到
