      - number: '2.2'
        title: Sizing lens and growth drivers
        blocks:
          - type: paragraph
            body: >-
              Einride frames the opportunity as a very large road-freight market and points to a $4.6 trillion
              addressable market in its public listing materials. The more useful diligence lens is narrower: what share
              of freight spend is actually reachable by a shipper-led FCaaS model, what share can be electrified before
              autonomy matters, and how quickly the customer base can convert pilot routes into recurring revenue. The
              latest public evidence suggests the answer is still small in absolute penetration terms, but clearly
              moving in the right direction. Contract duration, deployment depth, and the size of the long-term ARR
              pipeline are more important than raw headline TAM in assessing near-term traction.
