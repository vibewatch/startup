    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and model
        blocks:
          - type: paragraph
            body: >-
              Einride was founded in 2016 and is headquartered in Stockholm with a U.S. headquarters in Austin. The
              company now trades on Nasdaq under ENRD and describes itself as a technology leader for sustainable,
              cost-efficient autonomous and electric freight. Its operating model is a two-part stack:
              Freight-Capacity-as-a-Service for end-to-end freight operations and SaaS licensing for planning software
              and autonomous driving systems. That mix matters because it combines recurring software economics with
              asset-heavy freight execution, which makes growth visible but capital intensive.
