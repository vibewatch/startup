            body: >-
              The founder set still matters: Robert Falck remains the public face of the company as founder and
              executive chairman, while Roozbeh Charli runs the business as CEO and Henrik Green leads technology as
              CTO. The board has also been strengthened with outside directors such as Keith Alexander and Lynn
              Atchison, which is relevant because Einride is moving from venture-backed scaling into public-company
              governance. That shift reduces key-person risk relative to an earlier-stage startup, but the business
