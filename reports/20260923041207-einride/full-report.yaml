  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer map
        blocks:
          - type: paragraph
            body: >-
              Einride is not selling a pure OEM truck platform. It sells freight capacity, routing software, and
              autonomous operations into large shipper networks that already spend heavily on road freight. The
              practical market boundary is the subset of freight lanes where route density, charging access, emissions
              pressure, and predictable volumes can support an electric or autonomous service contract. That means
              buyers are usually enterprise shippers or logistics operators, while users are dispatch, fleet, and
              operations teams inside the customer organization. The market also remains geographically bounded because
              deployments depend on local permits, road design, and operational design domains.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM021
            claimRefs:
