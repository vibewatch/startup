companyProfile:
  summary: >-
    Einride is a Stockholm-based autonomous freight company founded in 2016 by CEO Robert Falck (former Volvo Cars). The
    company manufactures and operates electric freight trucks including the cabless, autonomous Einride Pod (supervised
    Level 4) and conventional EV models. The Freight Mobility Platform (FMP) is a proprietary SaaS layer providing fleet
    management, route optimization, carbon Scope 3 tracking, and AI logistics. Einride operates in 7 US states plus
    Sweden/EU with ~200 EVs in commercial service and 500,000+ cumulative autonomous km. In November 2025, Einride
    announced a SPAC merger with Legato Merger Corp. III at $1.8B enterprise value, with $113M PIPE closed February
    2026. Customers include Heineken, PepsiCo/Frito-Lay, Carlsberg Sweden, and GE Appliances. Total pre-SPAC funding
    exceeds $635M (EQT Growth Series C $500M, SoftBank Vision Fund 2 Series B $110M). Einride was the first AV on a
    European public road (with DB Schenker, 2019).
