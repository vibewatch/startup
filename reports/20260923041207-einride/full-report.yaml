      - number: '2.3'
        title: Adoption constraints and demand signals
        blocks:
          - type: paragraph
            body: >-
              The key friction points are familiar for autonomy-heavy industrial software: capex, route certification,
              safety validation, and customer willingness to sign multi-year contracts before every deployment is fully
              scaled. Einride does have genuine demand signals: 30+ enterprise customers, more than 200 electric trucks,
              live autonomous deployments, and a large ARR pipeline. But those signs should be read as early proof of
              category formation rather than evidence that the market is already won. The category still requires a lot
              of operational hand-holding, and the service model means Einride must repeatedly convert logistics proof
              into actual recurring freight volume.
