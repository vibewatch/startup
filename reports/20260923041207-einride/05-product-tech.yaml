    severity: minor
    topic: Pod cellular connectivity resilience in poor-coverage environments
    missingEvidence: Einride's approach to handling cellular dead zones for teleoperation (graceful degradation, pull-over
      protocol) is not publicly documented.
    whyItMatters: Connectivity failures during teleoperation create safety risk; understanding the failsafe is important for
      large-scale deployment.
    diligencePath: Request connectivity failsafe architecture and incident logs from Einride technical team.
    relatedQuestionRefs:
    - QE020
