    severity: moderate
    topic: No public API documentation or developer SDK for FMP integration
    missingEvidence: Einride does not publish a public API reference or developer SDK; FMP integration requires direct partnership
      and professional services engagement.
    whyItMatters: Limits third-party integration without Einride professional services; constrains platform ecosystem growth
      compared to open API competitors.
    diligencePath: Request API documentation, connector library, and integration case studies in formal diligence.
    relatedQuestionRefs:
