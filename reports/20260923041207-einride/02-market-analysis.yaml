chapter:
  number: 2
  title: Market Analysis
  summary: Einride sells into shipper-led road freight networks where electrification, autonomy, and software planning are
    adopted together rather than as separate products. The market is large, but the refresh shows a still-early category with
    long sales cycles, route-specific regulation, and buyer economics that depend on cost parity before autonomy scales.
sections:
- id: market-boundary
  title: Market boundary and buyer map
  body: Einride is not selling a pure OEM truck platform. It sells freight capacity, routing software, and autonomous operations
    into large shipper networks that already spend heavily on road freight. The practical market boundary is the subset of
    freight lanes where route density, charging access, emissions pressure, and predictable volumes can support an electric
    or autonomous service contract. That means buyers are usually enterprise shippers or logistics operators, while users
    are dispatch, fleet, and operations teams inside the customer organization. The market also remains geographically bounded
    because deployments depend on local permits, road design, and operational design domains.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM021
- id: sizing-lens
  title: Sizing lens and growth drivers
  body: 'Einride frames the opportunity as a very large road-freight market and points to a $4.6 trillion addressable market
    in its public listing materials. The more useful diligence lens is narrower: what share of freight spend is actually reachable
    by a shipper-led FCaaS model, what share can be electrified before autonomy matters, and how quickly the customer base
    can convert pilot routes into recurring revenue. The latest public evidence suggests the answer is still small in absolute
    penetration terms, but clearly moving in the right direction. Contract duration, deployment depth, and the size of the
    long-term ARR pipeline are more important than raw headline TAM in assessing near-term traction.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM008
  - CM011
  - CM012
  tableRefs:
  - TM022
  figureRefs:
  - FM001
- id: constraints-and-demand
  title: Adoption constraints and demand signals
  body: 'The key friction points are familiar for autonomy-heavy industrial software: capex, route certification, safety validation,
    and customer willingness to sign multi-year contracts before every deployment is fully scaled. Einride does have genuine
    demand signals: 30+ enterprise customers, more than 200 electric trucks, live autonomous deployments, and a large ARR
    pipeline. But those signs should be read as early proof of category formation rather than evidence that the market is
    already won. The category still requires a lot of operational hand-holding, and the service model means Einride must repeatedly
    convert logistics proof into actual recurring freight volume.'
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  tableRefs:
  - TM023
