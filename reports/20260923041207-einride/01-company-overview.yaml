company:
  name: Einride
chapter:
  number: 1
  title: Company Overview
  summary: Einride is now a public, Stockholm-founded freight technology company combining electric freight capacity, autonomous
    trucking, and software orchestration. The latest disclosures show a listed Nasdaq business with 30+ enterprise customers,
    ~200 electric trucks, early autonomous deployments, and a capital base that is large but still tied to a high-execution,
    high-capex scaling plan.
sections:
- id: identity-and-model
  title: Identity and model
  body: 'Einride was founded in 2016 and is headquartered in Stockholm with a U.S. headquarters in Austin. The company now
    trades on Nasdaq under ENRD and describes itself as a technology leader for sustainable, cost-efficient autonomous and
    electric freight. Its operating model is a two-part stack: Freight-Capacity-as-a-Service for end-to-end freight operations
    and SaaS licensing for planning software and autonomous driving systems. That mix matters because it combines recurring
    software economics with asset-heavy freight execution, which makes growth visible but capital intensive.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership and governance
  body: 'The founder set still matters: Robert Falck remains the public face of the company as founder and executive chairman,
    while Roozbeh Charli runs the business as CEO and Henrik Green leads technology as CTO. The board has also been strengthened
    with outside directors such as Keith Alexander and Lynn Atchison, which is relevant because Einride is moving from venture-backed
    scaling into public-company governance. That shift reduces key-person risk relative to an earlier-stage startup, but the
    business still depends heavily on its founders, safety case, and operational credibility.'
  claimRefs:
  - CO001
  - CO014
  - CO015
  - CO016
  tableRefs:
  - TO002
  - TO003
- id: scale-capital-and-milestones
  title: Scale, capital, and milestones
  body: The latest public evidence shows meaningful scale but not yet mature economics. Einride said it had more than 30 enterprise
    customers across seven countries, about 200 electric trucks, four autonomous vehicles in live operations, and more than
    $800 million of potential long-term ARR in joint business plans. Its H1 2026 revenue rose 26% year over year to $27 million
    on a constant-currency basis, and it finished the period with $77 million of cash. The listing path valued the company
    at $1.35 billion pre-money after an initial $1.8 billion headline SPAC figure, while the company also disclosed $113 million
    of PIPE capital and roughly $100 million of crossover financing.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  figureRefs:
  - FO001
- id: current-open-questions
  title: Current open questions
  body: 'The main diligence gaps are still classic for a capital-intensive logistics platform: exact customer concentration,
    retention metrics such as NRR or GRR, and the degree to which the fleet ramp can be financed without material dilution.
    Public disclosures are strong on growth, safety, and milestones, but weaker on the detail an underwriting memo would want
    for long-term margin modeling. That is why the refresh still treats Einride as a scaling company with strong proof points
    rather than a fully de-risked public asset.'
  claimRefs:
  - CO008
  - CO010
  - CO011
  - CO013
