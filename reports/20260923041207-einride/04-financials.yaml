  - FI002
- id: S3
  title: Funding History and SPAC Capital Structure
  body: "Einride's funding history reflects progressive institutional validation:\n\n**Series A (2019): ~$25M**, EQT Ventures\
    \ lead. Funded first commercial Pod \noperations and initial US market entry.\n\n**Series B (2021): ~$110M**, SoftBank\
    \ Vision Fund 2 and Northzone co-lead. \nFunded US expansion and conventional EV fleet buildout.\n\n**Series C (2022):\
    \ ~$500M**, EQT Growth, Storebrand, and others. The largest \nEuropean AV funding round at the time; funded full US/EU\
    \ commercial scale-up.\n\n**SPAC (Nov 2025):** Business combination with Legato Merger Corp. III at \n$1.8B enterprise\
    \ value; NYSE listing pending. The SPAC provides:\n- Access to public market capital without the volatility of IPO book-building\n\
    - Fixed $1.8B valuation ceiling vs. market-determined IPO price\n- PIPE co-investors ($113M) who provide capital surety\
    \ for the deal\n\n**PIPE (Feb 2026): $113M** from strategic logistics and energy investors.\n\n**Cap table complexity:**\
    \ Multiple financing rounds plus PIPE plus SPAC structure \ncreates significant cap table complexity. Warrant dilution\
    \ from the SPAC structure \ncould meaningfully dilute existing shareholders post-listing. Exact warrant \nterms and dilution\
    \ schedules are in the S-4 filing.\n"
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: S4
  title: Financial Risks and Capital Adequacy
  body: "**Key financial risks:**\n\n1. **SPAC execution risk.** If the SPAC does not close (e.g., shareholder vote \n   fails,\
    \ SEC review unresolvable, or Legato SPAC sponsor withdraws), Einride \n   loses its planned public market capital raise.\
    \ With ~$635M raised historically \n   and significant cash deployed in fleet assets, a SPAC failure would require \n\
    \   either a private bridge round or significant operational contraction.\n\n2. **Fleet capital intensity.** Each additional\
    \ EV requires $350,000-600,000 in \n   capital. At Einride's scale ambition (600+ EVs for $200M ARR), the capital \n \
    \  requirement is $160M-240M in vehicle CapEx alone — requiring either SPAC \n   proceeds or debt financing to execute.\n\
    \n3. **Revenue recognition lag.** The gap between contracted ARR ($65M) and \n   current revenue (~$43-47M) reflects the\
    \ time to commission vehicles and \n   ramp routes to full utilization. If contract execution is delayed (vehicle \n \
    \  delivery delays, permit issues), ARR may overstate near-term cash revenue.\n\n4. **Pre-profitability burn rate.** Without\
    \ disclosed financials, the burn rate \n   is unknown. At 500-600 employees and ~$400M in fleet assets, the annual \n\
    \   operating cost base likely exceeds $100M, creating material negative EBITDA \n   even at $65M ARR. The runway depends\
    \ entirely on SPAC/PIPE capital.\n\n5. **SPAC warrant dilution.** Post-SPAC, public warrants could dilute existing \n\
    \   equity holders by 15-30% depending on redemption rates. Founders and early \n   investors face complex lockup and\
    \ dilution dynamics.\n"
