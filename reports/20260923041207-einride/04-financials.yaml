  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Audited financials — gross margin, EBITDA, and cash position
    missingEvidence: Einride's 2024 revenue ($43-47M) is an analyst estimate; gross margin, EBITDA, and cash position are
      not publicly disclosed outside the SPAC S-4 filing.
    whyItMatters: Profitability trajectory and runway are the most critical financial metrics for pre-SPAC investment decisions.
    diligencePath: Obtain SPAC S-4 from SEC EDGAR; request management accounts and FY2024 P&L in formal diligence.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI018
  - type: private-evidence-only
    severity: moderate
    topic: Debt financing facilities for EV fleet
    missingEvidence: Einride may have vehicle-secured debt facilities to reduce equity CapEx burden, but no debt has been
      publicly disclosed.
    whyItMatters: Existing debt affects runway assessment and future capital structure for fleet expansion.
    diligencePath: Request debt facility summary and covenants in formal diligence; review S-4 balance sheet for debt items.
    relatedQuestionRefs:
    - QI020
  - type: private-evidence-only
    severity: moderate
    topic: Estimated financial runway — burn rate not disclosed
    missingEvidence: Burn rate is estimated but not confirmed; runway depends on SPAC closing timeline which is uncertain.
    whyItMatters: If SPAC extends further (H2 2026 or later), PIPE capital alone may not bridge to SPAC close.
    diligencePath: Request monthly P&L and cash flow statement for last 12 months in formal diligence.
    relatedQuestionRefs:
    - QI012
  - type: private-evidence-only
    severity: moderate
    topic: Customer acquisition cost and sales cycle details not disclosed
    missingEvidence: Einride's CAC, sales cycle length, and channel economics are not publicly disclosed; inference from comparable
      enterprise logistics TaaS providers is only a proxy.
    whyItMatters: GTM efficiency determines the capital needed to reach scale; high CAC or long sales cycles slow growth and
      increase funding requirements.
    diligencePath: Request CAC, payback period, pipeline conversion, and sales headcount data in formal diligence.
    relatedQuestionRefs:
    - QI026
