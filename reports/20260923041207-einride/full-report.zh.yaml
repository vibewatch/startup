      - number: '5.2'
        title: 技术堆栈与自动驾驶能力
        blocks:
          - type: paragraph
            body: |
              Pod 的自动驾驶系统建立在传感器融合架构之上，结合 LiDAR、雷达、摄像头和 GPS/IMU 输入。感知、规划和控制堆栈均为自研，在 Gothenburg
              和 San Francisco 开发。不同于 Waymo 或 Aurora，Einride 走的是窄 ODD 专精路线——针对一组明确的低速、地理围栏工业路线优化，而不是追求通用高速或城市自动驾驶。

              远程监督模式是核心技术差异点：Pod 操作员通过多车界面实时监督车队，无需等待完全无监督 Level 4 认证即可快速扩张。远程操作堆栈使用 4G/5G
              蜂窝连接传输视频和低延迟干预指令。软件侧，FMP 通过 API 与企业 TMS 系统集成，包括 SAP TM 和 Oracle TMS。关键技术依赖包括：
              Freightliner 和 Peterbilt（OEM 供应）、Luminar（LiDAR）、NVIDIA Orin（计算平台）、
              AWS（云）以及 Verizon/T-Mobile（连接）。Pod 的 AV 堆栈通过 ISO 26262 ASIL-D 功能安全标准认证。
