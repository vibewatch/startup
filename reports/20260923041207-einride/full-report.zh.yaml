      - number: '4.4'
        title: 财务风险与资本充足性
        blocks:
          - type: paragraph
            body: |
              **关键财务风险：**

              1. **SPAC 执行风险。** 如果 SPAC 未能完成（例如股东投票失败、SEC 审查无法解决，或 Legato SPAC
                 发起人退出），Einride 将失去计划中的公开市场融资。公司历史融资约 $635M，并已在车队资产上部署大量现金；一旦 SPAC
                 失败，公司要么进行私募过桥轮，要么显著收缩运营。

              2. **车队资本强度。** 每新增一辆 EV 需要 $350,000-600,000 资本。按 Einride 的规模目标（600+ EV
                 支撑 $200M ARR），仅车辆 CapEx 就需要 $160M-240M——执行上必须依赖 SPAC
                 所得资金或债务融资。

              3. **收入确认滞后。** 已签约 ARR（$65M）与当前收入（约 $43-47M）之间的缺口，反映了车辆投运和路线爬坡至满利用率所需时间。如果合同执行延迟（车辆交付延迟、许可问题），ARR
                 可能高估近期现金收入。

              4. **盈利前烧钱速度。** 公司未披露财务报表，烧钱速度未知。按 500-600 名员工和约 $400M
                 车队资产估计，年度运营成本基数很可能超过 $100M，即便 ARR 达 $65M 也会产生显著负 EBITDA。现金跑道完全取决于
                 SPAC/PIPE 资本。

              5. **SPAC 认股权证稀释。** SPAC 后，公开认股权证可能根据赎回率将现有股东稀释 15-30%。创始人和早期投资者将面对复杂的锁定和稀释动态。
