      - number: '5.4'
        title: 路线图、研发与竞争定位
        blocks:
          - type: paragraph
            body: |
              Einride 的 2025-2028 产品路线图围绕三个方向：（1）下一代 Pod——集成能力更强的传感器，并通过设计降本把单位成本从约 $300K
              降至低于 $150K；（2）FMP 企业扩张——承运人市场功能和多式联运协调；（3）自动驾驶放量——把 Pod 与操作员
              比例从 5-10:1 提高到 20:1+。

              到 2026-2027 从 200 辆扩到 600 辆 EV，仅车辆采购就估计需要 $160-240M——资本强度高，且依赖 SPAC
              完成。Einride 拥有约 38 个专利族，聚焦远程监督、无驾驶舱架构和货运移动算法。Morgan Stanley 将 Einride
              的窄 ODD 专精与聚焦高速的竞争者区分开来；无驾驶舱 Pod 在固定路线工业场景中把每英里人工成本降低约 40%，但无法覆盖高速或城市路线片段。批评者指出“最后 10% 问题”——
              施工、恶劣天气、应急车辆等边缘案例，使从有人监督走向无监督 Level 4 的路径非线性，时间表也不确定。
            claimRefs: []
