            title: Luminar LiDAR 财务困境造成关键单一来源传感器依赖
            body: >-
              Luminar Technologies 股价自 2023 年以来下跌 85%，公司在 2024-2025 年经历裁员和重组。作为 Einride 的主要 LiDAR 供应商，若 Luminar
              生产失败，Einride 需要 12-24 个月重新认证替代方案——这会 扰乱新车队部署，并要求重做 AV 技术栈工程。
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
          - type: callout
            title: 有监督 AV 模式既是 Einride 的长板，也是天花板——L4 仍是高风险大奖
            body: >-
              有监督 Pod 运营今天已经产生真实商业收入，也是一门可防守业务。但 Einride 的 $1.8B 估值押注的是未来 无监督 L4 经济性。“最后 10%”边缘案例问题让通往无监督 L4
              的路径非线性且不确定，当前有监督运营与支撑估值的 完全自动驾驶经济性之间还隔着很长一段距离。
            calloutType: insight
            claimRefs:
