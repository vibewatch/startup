              已签约 ARR 为 $65M，相比 $43-47M 运行率收入，意味着约 1.4-1.5x 的向前合同覆盖，这是正面的留存信号。不过，NRR
              数据缺失，使扩张表现与基础表现无法拆开评估——这是成长阶段承保的重大缺口。
