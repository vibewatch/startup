    Sweden、GE Appliances 是主要披露客户。
  businessModel: TaaS（车队运营按公里或按托盘计价）+ FMP SaaS 订阅费。收入分为车队运营（资本密集）和软件平台（毛利更高）；具体拆分未披露。CSRD 碳模块作为 FMP 的增购项销售，利润率更高。
