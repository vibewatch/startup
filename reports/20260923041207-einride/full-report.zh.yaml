        title: 市场边界与买方图谱
        blocks:
          - type: paragraph
            body: >-
              Einride 卖的不是纯 OEM
              卡车平台，而是向已经在公路货运上大量支出的企业货主网络出售货运运力、路线软件和自动驾驶运营。实际市场边界，是路线密度、充电可得性、减排压力和可预测货量足以支撑电动或自动驾驶服务合同的货运线路子集。这意味着买方通常是企业货主或物流运营商，使用者则是客户组织内部的调度、车队和运营团队。部署还受地理限制，因为落地取决于本地许可、道路设计和运营设计域。
