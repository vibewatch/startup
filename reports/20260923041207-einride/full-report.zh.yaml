  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              Einride 在自动驾驶 / 电动货运堆栈的三个不同层面面对竞争：

              **层 1：自动驾驶货运技术公司。** Aurora Innovation（NASDAQ: AUR）、
              Waymo Via（Google/Alphabet）、Gatik 和 Kodiak Robotics 都在开发 Level 4
              货运自动驾驶系统。Aurora 于 April 2024 完成 Dallas 至 Houston 之间首次完全商业化的 Level 4
              无人驾驶卡车运行，使其成为公共道路自动驾驶货运中运营最领先的竞争者。Aurora 采用授权 / 合作模式（Uber Freight、Werner Enterprises、Schneider），
              不自己持有车辆——这与 Einride 的 TaaS 模式不同。

              **层 2：电动卡车 OEM 与 EaaS 提供商。** Daimler Trucks（eCascadia）、
              Peterbilt（579EV）、Kenworth（T680E）和 Volvo Trucks 提供电动商用车，并正在推出 Electric-as-a-Service（EaaS）
              项目，把车辆 + 充电 + 维护打包，但缺少自动驾驶技术和数据软件平台。凭借 OEM 品牌信任和既有车队客户关系，这些 OEM
              项目是 Einride TaaS 模式最可规模化的竞争威胁。

              **层 3：EV 原生运营商和初创公司。** Xos Trucks、Nikola Motor（NASDAQ: NKLA）
              和 Hexagon Purus 为特定细分场景（最后一英里、垃圾清运、中型载重）运营电动商用车车队。Nikola 在 November 2024
              破产，暴露了 EV 卡车硬件制造的执行风险。Einride 与这些公司的差异在于 Freight Mobility Platform 软件和 Pod
              的自动驾驶能力。

              **层 4：拥有电动化项目的传统 3PL。** DHL（2030 年目标 60,000 辆 EV）、FedEx、UPS 和 Amazon Logistics
              正在建设自己的 EV 车队，并不是 TaaS 客户——它们直接竞争 Einride 想运营的企业货运路线。
