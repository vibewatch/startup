              Einride 公开披露账户只有 4 个，客户集中度高。如果任何单一客户（尤其是 PepsiCo，可能是最大的车队部署）在续约时终止合作，收入影响将是实质性的（估计 >20% 的运行率收入）。NRR
              和总留存率数据必不可少，但目前未公开。
            calloutType: insight
