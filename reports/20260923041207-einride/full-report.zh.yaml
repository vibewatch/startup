      - number: '6.4'
        title: 客户满意度与背书质量
        blocks:
          - type: paragraph
            body: |
              现有客户满意度证据仅限于 Heineken、PepsiCo 和 Carlsberg 可持续发展与物流领导层的定性证言。没有公开 Net
              Promoter Score、CSAT 调查或第三方客户满意度评级。这些定性背书质量较高：来自全球知名品牌的高级副总裁级认可，在企业销售过程中信号强。

              关键是，自 2019 开始商业运营以来，Einride 没有公开报告任何客户流失或合同终止。这种零流失记录有信息量，但考虑到披露客户基数很小（4
              个具名账户）且 TaaS 模式仍处早期商业阶段，应谨慎解读。

              第三方货运行业分析机构（FreightWaves、Transport Topics）认为 Einride 的客户证明可信，但也提醒：背书集合范围窄且集中，限制了向更广泛物流市场外推的能力。
            claimRefs:
              - CU014
              - CU015
              - CU016
