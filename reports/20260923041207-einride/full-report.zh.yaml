  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与当前财务位置
        blocks:
          - type: paragraph
            body: |
              Einride 通过 Transport-as-a-Service（TaaS）模式产生收入：
              与企业货主签多年合同，收取月度车队费用（按承诺车日计）外加可变里程费。收入模式有三个关键组成部分：

              1. **车队运营收入**——最大组成部分；由商业部署 EV 数量乘以单车月度 TaaS 费用驱动。
                 约 200 辆 EV 在运营、已签约 ARR 为 $65M，隐含单车年收入约为 $325,000/vehicle——
                 与 Class 8 电动卡车在 TaaS 溢价下的运营经济性大体一致。

              2. **软件 / 平台费用**——Freight Mobility Platform（Fleet Portal）
                 订阅费，以 TaaS 合同总额的一定比例计。公司未单独披露；参照可比 SaaS
                 物流平台，估计占总合同收入 5-15%。

              3. **里程可变部分**——超过承诺车日下限的按英里可变费用；在高利用率时期提供收入上行。

              估计财务位置（2024）：
              - 收入：$43-47M（分析师估计；未官方披露）
              - 已签约 ARR：约 $65M（SPAC 材料披露）
              - 净亏损：显著；未公开量化（符合类似阶段、SPAC 前深科技物流公司的特征）
              - 现金 / 流动性：由 PIPE（$113M）和 Series C 既有现金支持（2022 融资 $500M）；具体资产负债表未披露

              已签约 ARR（$65M）与收入（$43-47M）之间的缺口，说明从签约到按完整货量确认收入之间存在有意义的爬坡 / 计费周期滞后——
              对企业车队 TaaS 部署来说这很正常，因为车辆必须先采购、交付并投运，才能确认收入。
