            body: >-
              Einride 创立于 2016，总部在 Stockholm，美国总部设在 Austin。公司目前以 ENRD 在 Nasdaq
              交易，并将自己定位为可持续、低成本自动驾驶和电动货运的技术领导者。它的运营模式分为两层：面向端到端货运运营的货运运力即服务，以及面向规划软件和自动驾驶系统的 SaaS
              授权。这个组合重要在于，它把经常性软件经济性和重资产货运执行绑在一起，增长更可见，但资本消耗也更重。
