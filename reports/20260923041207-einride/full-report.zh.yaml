      - number: '4.3'
        title: 融资历史与 SPAC 资本结构
        blocks:
          - type: paragraph
            body: |
              Einride 的融资历史体现了逐步增强的机构背书：

              **Series A（2019）：约 $25M**，EQT Ventures 领投。资金用于首批商业 Pod
              运营和初步进入美国市场。

              **Series B（2021）：约 $110M**，SoftBank Vision Fund 2 与 Northzone 共同领投。
              资金用于美国扩张和传统 EV 车队建设。

              **Series C（2022）：约 $500M**，EQT Growth、Storebrand 等参与。该轮是当时欧洲最大 AV
              融资轮；资金用于美国 / 欧盟全商业化扩张。

              **SPAC（Nov 2025）：** 与 Legato Merger Corp. III 进行业务合并，对应 $1.8B
              企业价值；NYSE 上市待完成。SPAC 提供：
              - 无需承受 IPO 簿记建档波动即可进入公开市场融资
              - 固定 $1.8B 估值上限，而非由市场决定 IPO 定价
              - PIPE 共同投资者（$113M）为交易提供资金确定性

              **PIPE（Feb 2026）：$113M**，来自战略物流和能源投资者。

              **股权结构表复杂性：** 多轮融资叠加 PIPE 和 SPAC 结构，使股权结构明显复杂。SPAC 结构中的认股权证稀释可能在上市后显著稀释现有股东。具体认股权证条款和稀释时间表见
              S-4 文件。
