companyProfile:
  summary: >-
    Einride 是一家总部位于 Stockholm 的自动驾驶货运公司，2016 由 CEO Robert Falck（前 Volvo Cars）创立。公司制造并运营电动货运卡车，包括无驾驶舱、自动驾驶的 Einride
    Pod（有人监督 Level 4）以及传统 EV 车型。Freight Mobility Platform（FMP）是自研 SaaS 层，提供车队管理、路线优化、Scope 3 碳追踪和 AI 物流。Einride 在 7
    个美国州以及 Sweden/EU 运营，约有 200 辆 EV 投入商业服务，累计自动驾驶里程超过 500,000 公里。November 2025，Einride 宣布与 Legato Merger Corp. III 以
    $1.8B 企业价值合并 SPAC，$113M PIPE 于 February 2026 完成。客户包括 Heineken、PepsiCo/Frito-Lay、Carlsberg Sweden 和 GE
    Appliances。SPAC 前累计融资超过 $635M（EQT Growth Series C $500M、SoftBank Vision Fund 2 Series B $110M）。Einride 是欧洲公共道路上的首个
    AV（2019，与 DB Schenker 合作）。
