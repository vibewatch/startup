      - number: '7.4'
        title: 商业、竞争与人员风险
        blocks:
          - type: paragraph
            body: |
              商业风险集中在 4 家客户组合上。按车队规模估计，PepsiCo/Frito-Lay 是最大客户；若合同到期不续约，
              可能影响 20-35% 收入。OEM Electric as a Service（EaaS）项目（Daimler、Volvo、PACCAR）
              在续约时形成价格压力，提供更低成本替代方案——这些 OEM 项目提供电动车队，但没有专有软件差异化，
              定价可能比 Einride 的 TaaS 费率低 15-25%。

              来自 Aurora Innovation 的竞争风险真实存在，但 ODD 不同：Aurora 瞄准美国公共道路干线货运
              （2024 年在 Texas 启动无人驾驶商业卡车运输），Einride 则瞄准固定路线工业 ODD。不过，Aurora
              的技术轨迹显示，它可能在 2026-2028 年切入工业 ODD。若 Aurora 提供可比的窄 ODD AV 能力，
              Einride 的自动驾驶技术溢价就会承压。

              人员风险中等。CEO Robert Falck 是 Einride 的公众面孔和战略架构师；若其离职，将是重大事件。
              工程领导团队集中在 Gothenburg——EU 人才市场上，Volvo、NVIDIA 和大型 AV 实验室竞争激烈，
              带来留人压力。Einride 在 SPAC 后的股权流动性事件有助于留人，但 SPAC 延迟会让持股员工受挫。

              司机短缺顺风的风险在于：如果美国货运量在衰退中下降，或自动驾驶卡车监管提速、让传统司机以更低成本回流，
              Einride 的司机短缺价值主张会部分削弱。
            claimRefs:
              - CR016
