      - number: '3.4'
        title: 竞争定位与护城河耐久性
        blocks:
          - type: paragraph
            body: |
              Einride 的竞争定位有几项强点：
              - ESG 叙事和脱碳品牌（在 AV 货运公司中同类最佳）
              - Freight Mobility Platform 软件黏性（6-12 个月实施 = 高切换成本）
              - 首个在欧盟公共道路商业运营的 Pod（2019——在 EU 领先美国 AV 竞争者）
              - CPG 企业客户背书（Heineken、PepsiCo、Carlsberg——具名、可引用）

              Einride 的竞争定位也有几项短板：
              - 美国公共道路 Level 4 自动驾驶批准（落后 Aurora Innovation 2+ 年）
              - 相比 Aurora 的财务资源（Aurora 有 $820M+ IPO 资本 + Alphabet 对 Waymo 的支持）
              - Daimler、Volvo 等 OEM 支持的 EaaS 价格竞争（单车 TaaS 价格更低）

              竞争护城河在 EU / Nordic 市场最耐久，Einride 在那里拥有运营规模优势和监管先发地位。短期内，美国自动驾驶货运竞赛更像是 Aurora
              自己不能犯错；只有当（如果）Pod 的运营域获批在美国公共道路上进行 Level 4 自动驾驶，Einride 的 Pod 差异化才会更有价值。
