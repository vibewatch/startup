  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: |
              Einride 最重要的监管风险，是其 NHTSA FMVSS 豁免框架的脆弱性。Einride Pod
              通过 Federal Motor Vehicle Safety Standards 的有条件豁免进行商业运营，因为 Pod 的无驾驶舱设计不符合面向乘员保护的 FMVSS
              要求。这些豁免需要每年续期，并受 NHTSA 自由裁量影响——政府更替、引人注目的 AV 事故，或新的 FMVSS
              规则制定，都可能限制或撤销现有豁免。

              更广泛的美国联邦 AV 监管框架自 2017（AV 1.0 到 AV 4.0）以来一直在制定中，但尚未形成有约束力的规则。这个监管真空给所有商业 AV
              运营商带来运营不确定性。国会若推动要求所有公共道路车辆都遵守 FMVSS——包括 AV 专用设计——可能会消除 Einride 当前依赖的豁免路径。

              在欧洲，EU Regulation（EU）2019/2144 和演进中的 AI Act 给 AV 安全认证带来重叠监管义务。Einride 的 Sweden
              运营受 Swedish Transport Agency 许可覆盖，但多国 EU 扩张需要尚未正式化的监管互认。EU AI Act 将自动驾驶系统划为“高风险 AI”，要求在更多
              EU 市场商业部署前通过第三方合格评定。

              产品责任暴露显著：如果 Einride Pod 卷入造成财产损失或人身伤害的严重事故，无驾驶舱设计（没有司机可转移责任）与远程监督的组合，会带来新的产品责任问题。Einride
              的保险覆盖、TaaS 合同中的赔偿条款和诉讼准备金均未公开披露。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
