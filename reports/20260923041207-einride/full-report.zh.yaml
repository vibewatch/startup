          - type: callout
            title: 自动驾驶 Pod 是财务模型转型的关键
            body: |
              Einride 当前毛利率（估计 15-25%）是典型重资产物流水平，并不具备溢价。真正改变财务模型的事件，是自动驾驶 Pod
              规模化部署：每车取消 $75-90K/year 司机成本，可让每条 Pod 路线毛利率增加约 25-35 个百分点。这会把 Einride
              的财务模型从资本密集型物流公司，转向由技术赋能、具备 SaaS 式利润率扩张潜力的物流平台。
