      - number: '7.2'
        title: SPAC 执行与资本风险
        blocks:
          - type: paragraph
            body: |
              与 Legato Merger Corp. III 的 SPAC 合并（November 2025 公布，PIPE 于 February 2026
              完成）仍是 Einride 短期最关键风险。截至 May 2026，NYSE 上市仍待 SEC 和股东批准。2023-2026
              市场中 SPAC 赎回率一直在 70-90%+；如果 Legato 股东大规模赎回，净信托资金（原本 $200M+）可能接近为零，只剩
              $113M PIPE 作为新资本。

              单靠 $113M PIPE 不足以支付：（1）车队从 200 辆扩到 600 辆 EV（$160-240M 车辆资本），（2）下一代 Pod
              研发（估计 $50-100M），以及（3）当前烧钱速度下的运营亏损。SPAC 失败或信托资金很薄，会制造资本悬崖，迫使 Einride
              以可能不利条款筹集过桥融资、大幅缩减路线图，或寻找战略替代方案。

              SPAC 执行风险还包括时间线风险：NYSE 上市延期越久，管理层注意力被 SPAC 合规流程占用的时间越长，而不是投入商业执行。对于 Einride
              这种收入规模的公司，SPAC 相关法律和会计成本也很重。

              如果 SPAC 在拥有足够信托资金的情况下成功完成，NYSE 上市会带来一组新的上市公司风险：季度业绩压力、做空者审视，以及上市后 12-18
              个月内兑现指引的要求。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
