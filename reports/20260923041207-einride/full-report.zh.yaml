      - number: '3.2'
        title: 直接竞争对手画像
        blocks:
          - type: paragraph
            body: |
              **Aurora Innovation（AUR）**——运营最领先的自动驾驶货运竞争者。Aurora 的自动驾驶系统（Aurora Driver）
              于 April 2024 在 Texas 完成首次商业化、完全无人驾驶的 Level 4 卡车运行（Dallas
              至 Houston）。Aurora 与 Volvo Trucks 合作（OEM 集成），并通过网络运营商（Uber Freight、Werner、Schneider）运营，而不是自己持有卡车。
              Aurora 在 2021 IPO SPAC 中以 $13B 估值融资 $820M；到 2025，IPO 后市值降至约 $1.5-2B。Aurora
              相对 Einride 的优势：在公共高速公路上获得联邦批准的无人驾驶运营；劣势：没有 TaaS 车队，是纯技术授权模式，也没有直接货主关系。

              **Waymo Via**——Alphabet 的货运自动驾驶部门。它在 Phoenix AZ 运营 Waymo Trucking（Class 8），借助 Waymo
              无可匹敌的自动驾驶数据和技术护城河。Waymo Via 尚未公开披露商业收入；它是 Alphabet 内部资金充足的押注，没有 IPO
              路径。Waymo Via 的优势：AV 技术护城河最深；劣势：没有 TaaS 模式、没有直接货主关系，本质上是技术开发商。

              **Gatik**——封闭网络中的短途（中间里程）自动驾驶卡车。Gatik 在可重复的固定路线为 Walmart、Loblaw
              等客户运营 Level 4 AV，并已在 Arkansas 和 Texas 获批无人驾驶运营。Gatik 的模式最接近 Einride
              的固定路线运营思路，比 Aurora 或 Waymo Via 更直接竞争。Gatik 累计融资约 $85M；资本化程度显著低于 Einride（$635M+）。

              **Daimler Trucks EaaS**——短期内对 Einride TaaS 模式最危险的商业威胁。Daimler（eCascadia）
              现在提供打包的 EV-as-a-Service，包含卡车、维护和充电接入，且不要求客户出资本——直接争夺同一批企业 CPG
              和工业货主关系。Daimler 的优势：成熟 OEM 关系、品牌信任、服务网络。劣势：没有自动驾驶堆栈，也没有数据平台。
