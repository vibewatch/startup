  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与资产组合
        blocks:
          - type: paragraph
            body: |
              Einride 的产品组合是一套垂直整合的货运移动平台，把实体 EV 车队资产和自研软件层结合起来。旗舰硬件资产是 Einride Pod——
              一辆完全自动驾驶、无驾驶舱、相当于 Class 8 的电动车，面向固定路线、低速工业物流场景
              （港口到仓库、工厂到配送中心）。Pod 由人类操作员远程控制；操作员可同时监督多辆车，使一名操作员最多管理 10 辆 Pod，
              而传统卡车是 1:1 配比。

              传统电动车队（Freightliner eCascadia、Peterbilt 579EV、Scania PHEV）
              负责 Pod 尚未获认证的高速和可变路线任务。这些车辆也运行在同一 Freight Mobility Platform 中，提供统一的远程信息处理、任务规划和碳报告。

              Freight Mobility Platform（FMP）是 SaaS 骨架：一个云原生车队编排系统，处理路线优化、车辆调度、实时遥测、司机 / 操作员分配以及 Scope 1-3
              排放核算。FMP 是关键软件护城河——它汇聚跨车队运营数据，并产出可审计排放报告；在欧盟 CSRD 合规要求下，这类报告越来越能获得溢价定价。截至
              2024-2025，Pod 已累计行驶 500,000+ 公里，并在 7 个美国州和 Sweden 商业运营。
            claimRefs:
              - CE001
              - CE005
              - CE008
