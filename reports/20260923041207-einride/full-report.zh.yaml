      - number: '6.2'
        title: 客户证明与证据质量
        blocks:
          - type: paragraph
            body: |
              Einride 的客户证明真实但范围窄。Heineken 的合作自 2021 起活跃，并公开提及在 Sweden 进行零排放货运交付。PepsiCo
              在美国的 Frito-Lay 部署（Texas Irving 工厂）最具运营意义：一条基于自动驾驶 Pod 的工厂到配送中心路线自 2022
              起持续运行。Carlsberg Sweden 于 2023 签署多年零排放运输协议。GE Appliances 于 2024
              启动美国制造物流的 TaaS 试点合同。

              客户证言聚焦三类价值：减少碳排放、通过降低司机依赖节省运营成本，以及 CSRD/ESG 报告能力。没有客户公开披露具体成本节省数字或合同金额，这限制了财务证明质量。

              公开披露的 NRR、总留存率或流失数据缺失，是本章的主要证据缺口。多年合同结构显示留存设计上应当较高，但没有合同续约数据可用。
            claimRefs:
              - CU005
