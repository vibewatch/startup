      - number: '5.3'
        title: 信任、合规与安全
        blocks:
          - type: paragraph
            body: |
              Einride 的安全与合规姿态是商业采用的核心。Pod 在 7 个美国州持有 NHTSA AV 部署许可，并自 2019
              起在 Swedish Transport Agency（Transportstyrelsen）监管下运营。Einride 发布年度安全报告，Pod
              控制系统已达到 ISO 26262（汽车功能安全）合规。FMP 也获得 SOC 2 Type II
              数据安全认证，这是企业采购的关键要求。

              2024，有人监督 AV 卡车（包括 Einride 车队）每 100,000 英里报告 12 次安全关键干预——低于早期部署行业平均水平，但也说明远程人工监督仍然必要。安全倡导者质疑，无驾驶舱
              Pod 设计所需的 FMVSS 豁免，在没有完整联邦 AV 框架的情况下能否长期维持。

              排放报告模块对齐 GHG Protocol（Scope 1-3），旨在生成符合 CSRD 的 Scope 3 数据。截至 2026 初，碳审计的第三方验证正在推进。
            claimRefs:
              - CE009
              - CE015
              - CE016
          - type: table
