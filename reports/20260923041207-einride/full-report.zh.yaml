      展示关键增长杠杆。
    data:
      nodes:
        - id: current
          label: 当前：$65M 合同 ARR
          detail: 约 200 辆 EV × 每车约 $325K；包括车队运营、可变里程费和嵌入式软件费
          type: input
        - id: fleet_expand
          label: 车队扩至 600 辆 EV
          detail: +400 辆车 × $325K = +$130M ARR；需要约 $160M 车队 CapEx，由 SPAC 募资支持
          type: process
        - id: pod_premium
          label: 自动驾驶 Pod 线路
