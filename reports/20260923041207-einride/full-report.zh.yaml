      - number: '7.3'
        title: 技术与运营风险
        blocks:
          - type: paragraph
            body: |
              主要技术风险是自动驾驶的“最后 10% 问题”——非线性的边缘案例挑战，使有人监督 AV 运营难以扩展到完全无监督 Level 4。Einride
              2027-2028 无监督 L4 认证时间表高度不确定：它取决于 NHTSA 为完全自动驾驶商用车制定合适监管框架（尚未进入规则制定），也取决于 Einride
              的 AV 堆栈在所有相关 ODD 中把干预率降到足够低。

              更迫近的技术风险是 Luminar Technologies 的财务不稳定。Luminar 是 Einride 主要 LiDAR 供应商，2024-2025
              遭遇严重财务压力，包括股价下跌 85%、裁员和重组。如果 Luminar 失败或显著削减产能，Einride 需要重新认证替代 LiDAR
              供应商——这一过程需 12-24 个月，可能推迟车队部署，并要求 AV 堆栈重新工程化。

              运营风险包括 Pod 远程操作期间的连接故障。工业环境中 4G/5G 连接丢失会带来安全风险：Einride 必须维持故障安全流程（靠边至安全区域、冻结车辆状态），但这些流程未公开记录。
              任何导致事故的严重远程操作失败，都会触发监管审查，并可能暂停 NHTSA 豁免。

              网络安全风险也很重要：FMP SaaS 平台和 Pod 远程操作链路都是潜在攻击面。如果网络攻击使已部署 Pod 的远程监督失效，可能造成安全事故和声誉损害。SOC 2 Type II
              认证覆盖 FMP，但不覆盖 Pod 嵌入式系统。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
