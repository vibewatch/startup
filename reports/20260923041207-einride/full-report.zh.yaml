      - number: '6.3'
        title: 采用轨迹与扩张风险
        blocks:
          - type: paragraph
            body: |
              Einride 的采用轨迹，是先拿下大型企业账户，再在每个客户关系内扩大已部署车队。PepsiCo 是最先进的案例：最初的 Frito-Lay
              部署是一条单路线试点，之后扩展到多个 Pod 任务。公司 $65M 已签约 ARR（2025）相对 $43-47M 估计收入，说明现有协议中有向前合同覆盖和潜在车队扩张。

              扩张风险有意义：Einride 客户群在地理上集中（7 个美国州 + Sweden），在行业上也集中（CPG + 家电）。如果大型 CPG
              公司在下行周期冻结可持续发展投资，或续约时竞争对手价格压力上升，Einride 将面临明显流失风险。缺少公开 NRR
              指标，使留存无法量化评估。

              司机短缺顺风（截至 2024，美国短缺 80,000+ 人）支撑对自动驾驶 / 电动货运解决方案的持续需求，但这一宏观因素利好所有车队运营商——不只是
              Einride——也无法阻止客户切换到竞争 TaaS 提供商。
            claimRefs:
              - CU010
