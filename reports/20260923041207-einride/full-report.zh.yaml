      - number: '7.5'
        title: 证据要点
        blocks:
          - type: callout
            title: SPAC 赎回风险是近期最关键风险——可能抽干车队扩张资金
            body: >-
              若 SPAC 赎回率达到 70-90%+，信托净收益会接近于零，只剩 $113M PIPE 支撑 $160-240M 车队扩张计划。资本缺口会推迟车队增长、Pod R&D，以及支撑 Einride $1.8B
              估值的自动驾驶经济性。
            calloutType: insight
