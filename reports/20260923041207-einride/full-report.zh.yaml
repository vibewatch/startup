          type: process
        - id: sw_upsell
          label: 软件 / 平台加售
          detail: Fleet Portal 独立授权给非 TaaS 运营商；到 2028 年有机会新增 $10-20M ARR
          type: process
        - id: target
          label: 牛市目标：$200M+ ARR（2028）
