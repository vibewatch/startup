          - type: callout
            title: NVIDIA Orin 和 Luminar LiDAR 依赖造成单一供应商集中风险
            body: >-
              Einride 与 NVIDIA Orin SoC 深度集成，并依赖 Luminar LiDAR（该公司曾遭遇财务困境）；这些供应商一旦断供或调价，可能实质影响 Einride 大规模部署车辆或维持 AV
              系统功能的能力。
            calloutType: insight
            claimRefs:
              - CE012
          - type: callout
            title: FMP 软件平台是复利型护城河——数据网络效应会随时间增强
            body: Freight Mobility Platform 会积累跨车队运营数据，进而改善路线优化和 AV 训练数据集。这一数据飞轮会不断提高企业客户切换成本，并在不依赖 AV 技术轨迹的情况下持续提升产品质量。
            calloutType: insight
            claimRefs:
              - CE007
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与分层
        blocks:
          - type: paragraph
            body: >
              Einride 的商业客户群集中在两个行业：消费品（CPG）制造（Heineken、PepsiCo/Frito-Lay、Carlsberg Sweden）

              和耐用品制造（GE Appliances）。四家具名客户都是 Fortune 500 或 Fortune Global 500 等级企业，拥有大型内部物流运营和公开 ESG

              承诺，因此是 Einride TaaS 产品的主要目标画像。


              典型 Einride 企业客户通常是大型制造商或物流运营商，面临：（1）柴油成本上升和碳定价压力，（2）ESG

              报告义务要求 Scope 3 货运排放数据，（3）长期卡车司机短缺，提高了对具备自动化能力的车队运营商的依赖，以及（4）可持续发展挂钩融资或供应商承诺，会奖励可衡量的脱碳行动。


              客户合同结构为多年期（3-5 年），固定月度车队费外加可变里程部分。一旦客户把 FMP 接入自身 ERP/TMS
              工作流，切换成本就会升高。由于采购涉及多方利益相关者（物流、可持续发展和财务团队都参与），企业销售周期估计为

              6-12 个月。


              客户集中度是重大风险：公开具名账户只有 4 个，任何单一客户流失都会造成显著收入影响。
