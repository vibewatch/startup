  topStrengths:
    - AI-native full-stack carrier model captures underwriting margin vs. brokerage peers
    - 'Exceptional ARR growth: $1.2M mid-2024 to $40M+ by Dec 2025 in under 18 months'
    - 40,000+ active customers and claimed sub-1% churn signal strong product-market fit
    - TCV-led back-to-back rounds (B and B1) three weeks apart signals exceptional investor conviction
    - Proprietary AI liability product addresses a genuine, underserved coverage gap
  topRisks:
    - 'TRRG is an RRG: state insurance insolvency guaranty funds do not apply to policyholders'
    - Carrier license under 12 months old; adverse claims development is the key unproven risk
    - Valuation doubled in 22 days ($1.3B → $2.6B); multiple at 65x ARR is highly growth-dependent
    - All financial metrics are company-stated and unaudited; no public loss ratios or combined ratio
    - Startup customer base is inherently volatile; VC funding slowdown would compress TAM directly
  unresolvedGaps:
    - Audited financials, loss ratio, combined ratio, and actual claims experience not publicly available
    - CAC, payback period, and sales efficiency metrics undisclosed
    - TRRG capital adequacy and reinsurance structure not publicly disclosed
    - 'Trucking expansion underwriting performance: first announced vertical has no track record'
    - Breakdown of ARR by product line and retention cohort data
