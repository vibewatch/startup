callouts:
  - title: AI Liability product creates first-mover advantage in untested coverage category
    body: >-
      Corgi's AI Liability product is strategically important because it addresses a category of startup risk
      that many traditional E&O forms either exclude outright or cover ambiguously. By explicitly naming
      hallucinations, algorithmic bias, and training-data intellectual property disputes, Corgi positions
      itself as the carrier that understands AI-company risk at the product-language level. The upside is a
      genuine first-mover advantage; the downside is that this advantage sits in a category with little
      public claims history, meaning wording precision and pricing discipline will matter enormously.
    calloutType: strength
    claimRefs:
      - CE017
      - CE018
      - CE030
  - title: Carrier license under 12 months — AI underwriting models lack multi-year adverse development data
    body: >-
      The biggest technology risk is not whether Corgi can produce a fast quote today; it is whether its AI
      underwriting models can remain accurate after multiple claims-development cycles. TRRG only received its
      carrier license in July 2025, leaving less than a year of operating history by the run date. Without
      public model benchmarks, audit reports, or long-tail loss development by product line, investors cannot
      yet assess whether the underwriting engine is identifying risk correctly or simply growing faster than
      adverse selection has had time to surface.
    calloutType: risk
    claimRefs:
      - CE037
      - CE039
      - CE040
  - title: Full-stack model captures underwriting margin that broker competitors pass to external carriers
    body: >-
      The full-stack design changes both product experience and economics. Because Corgi underwrites on its
      own carrier structure instead of routing customers to an external paper provider, it can unify quote,
      bind, policy servicing, and claims under one operating model. That should allow a simpler customer
      workflow and creates the possibility of retaining underwriting margin that broker-led peers leave on the
      table. The strategic question is whether Corgi can convert this structural advantage into durable loss
      performance before incumbents or broker competitors replicate the customer experience layer.
    calloutType: insight
    claimRefs:
      - CE001
      - CE033
      - CE007
