  - id: sec-04
    title: Integrations, deployment, and developer signal
    body: >
      Publicly disclosed integrations are described more at the business-workflow level than the API
      specification level. Corgi says it integrates into cap table management platforms and cloud
      marketplace procurement channels so startups can acquire or update insurance when financing,
      vendor onboarding, or infrastructure purchasing events occur. That positioning suggests the product
      is intended to sit inside the operational systems founders already use, rather than behaving as a
      once-a-year insurance transaction. The self-service dashboard reinforces that framing by allowing
      ongoing policy management, certificate retrieval, and staged coverage expansion without a broker
      call.

      The stronger external signal comes from customer and developer-adjacent communities rather than
      from a traditional software ecosystem. Product Hunt commentary describes onboarding as fast,
      intuitive, and founder-friendly, which fits Corgi's message that buying insurance should feel more
      like setting up a modern software service than negotiating a brokerage process. Machineherald and
      GitHub references mainly reinforce financing and company identity rather than exposing technical
      depth. Importantly, no public code repositories, SDKs, public API references, or implementation
      guides were identified in the provided source set. That means the "developer-friendly" signal is
      more UX-centric than platform-centric today. For diligence, this distinction matters: product ease
      of use is visible, but technical extensibility remains largely undisclosed.
    claimRefs:
      - CE028
      - CE029
      - CE030
      - CE031
      - CE032
    tableRefs:
      - TE004
    figureRefs:
      - FE003
  - id: sec-05
    title: Differentiation, technical risks, and compliance
    body: >
      Corgi's clearest differentiator is structural rather than algorithmic: analysts and reviewers point
      to the full-stack carrier model as the main reason it can capture underwriting economics and shape
      product experience differently from broker-led insurtechs. The AI Liability product adds a second
      layer of differentiation by targeting an emerging category where traditional carriers often rely on
      exclusions, ambiguity, or manual review. That combination could create a meaningful moat if the
      company develops credible claims history and pricing data before larger incumbents respond.

      The core technical and regulatory risks are equally visible. Corgi has less than a year of carrier
      operating history from the July 2025 TRRG license to the January 2026 public launch, leaving very
      limited long-tail claims evidence. Independent review coverage highlights the lack of public claims
      data and the short track record as real concerns. Public technical transparency is also low: no
      model cards, benchmark results, API docs, or algorithmic audit reports have been released. That
      makes it difficult to assess whether the underwriting AI has enough data, controls, and monitoring
      to avoid adverse selection. The TRRG structure adds a compliance caveat as well, because RRGs do
      not provide state guaranty-fund protection and can face state-by-state operating constraints even
      when federally enabled under the LRRA.
    claimRefs:
      - CE033
      - CE034
      - CE035
      - CE036
