chapter:
  number: 5
  title: Product & Technology
  key: product-tech
  summary: >-
    Corgi Insurance presents a vertically integrated product stack that combines distribution,
    AI-assisted underwriting, policy administration, and in-house claims inside a full-stack carrier
    structure. The platform breadth is unusually wide for a 2024-founded insurer, spanning core
    startup lines, specialty products, and a differentiated AI Liability module. The product story is
    compelling, but public technical disclosure remains thin: no public API docs, model cards,
    benchmark data, or independent audits of the underwriting AI have been released as of the run date.
sections:
  - id: sec-01
    title: Full-stack carrier platform and product architecture
    body: >
      Corgi's product architecture starts with a structural decision that shapes every downstream
      technology choice: it is not merely a broker workflow layer placed on top of legacy insurance
      carriers, but a full-stack carrier that underwrites, issues, administers, and claims-manages
      startup insurance through its own operating structure. Public materials consistently position the
      company as an AI-native insurance carrier for technology companies, while the January 2026 launch
      release makes clear that Technology Risk Retention Group, Inc. (TRRG) is the underwriting carrier
      and Corgi Insurance Services, Inc. is the licensed producer and program administrator. That
      matters because the platform is vertically integrated from quote intake through claims.

      The product surface is correspondingly broad. Corgi markets modular commercial insurance lines,
      including the core startup bundle of CGL, D&O, Tech E&O, and Cyber, plus stage-expansion products
      such as EPLI, Media Liability, Fiduciary Liability, Workers Compensation, AI Liability, and other
      specialty lines. The homepage and products page describe a self-serve dashboard where founders can
      adjust coverage as their company matures, while direct carrier control enables certificates and
      standard-line quotes to be issued quickly without a separate broker or fronting-carrier handoff.
      Geographic breadth is already material: company disclosures state 45 producer-license
      jurisdictions and product availability across 49 states. The resulting architecture is best
      understood as insurance infrastructure, not a single-product app.
    claimRefs:
