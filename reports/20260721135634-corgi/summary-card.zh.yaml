  headline: |
    Corgi 是一个高确信度的 Series B1 保险科技项目，收入牵引力极强，全栈承保主体模式也有吸引力；但 $2.6B 估值偏紧、理赔历史有限、财务未经审计，继续加码前必须做纪律化尽调。
