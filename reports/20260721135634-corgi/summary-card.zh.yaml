  topStrengths:
    - AI 原生全栈承保主体模式能拿到承保利润率，而不是像经纪同行只赚分销。
    - ARR 增长异常快：不到 18 个月，从 2024 年中 $1.2M 增至 2025 年 12 月 $40M+。
    - 40,000+ 活跃客户和公司声称低于 1% 的流失率，指向很强的产品市场匹配。
    - TCV 领投的 B 轮和 B1 轮只隔三周连续完成，显示投资人确信度异常高。
    - 自研 AI 责任险产品切中真实且供给不足的保障缺口。
  topRisks:
    - TRRG 是一家 RRG：州保险破产保证基金不覆盖其保单持有人。
    - 承保主体牌照拿到还不到 12 个月；不利理赔发展是最关键的未证风险。
    - 估值 22 天内翻倍（$1.3B → $2.6B）；65x ARR 倍数高度依赖增长兑现。
    - 所有财务指标均由公司口径给出且未经审计；没有公开赔付率或综合成本率。
    - 初创企业客户基础天然波动；VC 融资放缓会直接压缩 TAM。
  unresolvedGaps:
    - 经审计财务、赔付率、综合成本率和真实理赔经验均未公开。
    - CAC、回本周期和销售效率指标未披露。
    - TRRG 资本充足性和再保险结构未公开披露。
    - 卡车运输扩张承保表现：首个公布的新垂直领域还没有历史记录。
    - 按产品线拆分的 ARR 与留存队列数据。
