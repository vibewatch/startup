evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited financial statements or an independent audit of ARR, customer count, and churn. All cover metrics are
      company-claimed from press releases.
    whyItMatters: >-
      The valuation trajectory is built on revenue growth claims that lack third-party verification. Unaudited ARR,
      customer, and churn figures should not be used as the sole basis for valuation analysis.
    diligencePath: >-
      Request audited or reviewed financial statements, management accounts, and a data-room definition of ARR (e.g.,
      whether annual policy premiums are recognized ratably or upfront).
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO019
  - type: missing-source
    severity: material
    topic: loss-ratios-claims-data
    missingEvidence: >-
      Public loss ratios, combined ratios, or claims payment frequency and severity data for TRRG since carrier
      activation in July 2025.
    whyItMatters: >-
      Insurance quality is ultimately measured by claims outcomes. Without loss ratio data, underwriting quality and
      sustainable pricing cannot be assessed.
    diligencePath: >-
      Request TRRG loss runs, combined ratio by line, and reinsurance structure from management. Check NAIC filings for
      TRRG once available.
    relatedQuestionRefs:
      - QO030
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: >-
      Complete cap table with equity stakes, liquidation preferences, governance rights, and any side-letter terms for
      the Seed through Series B1 rounds.
    whyItMatters: >-
      The rapid succession of three rounds in five months, each led by TCV, suggests governance and preference terms may
      be complex. The underlying round economics are not publicly available.
    diligencePath: >-
      Request cap table, financing closing memos, board composition, and investor-rights agreements from management or
      counsel.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: geographic-exclusions
    missingEvidence: >-
      A complete list of which states Corgi does NOT currently operate in and why (one state is excluded from the
      49-state footprint as of January 2026).
    whyItMatters: >-
      Understanding geographic limitations matters for customers and for assessing whether the excluded state represents
      a regulatory, legal, or strategic barrier.
    diligencePath: >-
      Request from management the full list of licensed jurisdictions and any state-level regulatory constraints on TRRG
      operations.
    relatedQuestionRefs:
      - QO028
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: seed-vs-series-a-split
    missingEvidence: >-
