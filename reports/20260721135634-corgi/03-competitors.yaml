company:
  name: Corgi
chapter:
  number: 3
  title: Competitors
  summary: 'Corgi competes in the US startup commercial insurance market against three distinct competitor classes: direct
    insurtech peers (Vouch, Embroker) that operate as digital brokers; specialist insurtechs targeting adjacent verticals
    (Coalition in cyber, Cover Whale in trucking, Pie Insurance in workers comp, Cowbell Cyber); and incumbent carriers (Chubb,
    Hartford, Progressive Commercial) that serve the broader commercial market. Corgi''s full-stack carrier structure, AI-native
    underwriting, and startup-stage-modular product design are primary differentiators. Its AI Liability product addresses
    an emerging risk category no competitor yet covers comprehensively. The most durable moat risk is AI-native underwriting,
    where competitors are rapidly adopting similar tooling.'
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: 'The startup commercial insurance market in 2026 is contested by three distinct competitor classes. First, direct
    insurtech peers—principally Vouch and Embroker—have built digital brokerage platforms purpose-built for startup buyers,
    offering streamlined quoting and startup-stage products but relying on external carriers for underwriting. Second, specialist
    insurtechs have carved out single-vertical or single-line positions: Coalition dominates cyber insurance with its Active
    Insurance model, Cover Whale applies AI to trucking fleet risk, Pie Insurance focuses on workers compensation, and Cowbell
    Cyber provides AI-driven cyber pricing for SMBs. Third, incumbent carriers—Chubb, The Hartford, and Progressive Commercial—control
    the broader commercial insurance market, hold full carrier licenses, and are expanding digital capabilities but do not
    segment specifically for venture-backed tech companies. Corgi sits at the intersection of full-stack carrier and insurtech:
    it owns its own underwriting entity (TRRG), generates margin as a carrier rather than a broker, and applies AI-native
    tooling across the entire policy lifecycle. No other player combines startup-stage modular coverage, instant bind, AI
    Liability, and full-stack carrier economics in a single platform as of mid-2026. The competitive map is evolving rapidly:
    Next Insurance was acquired by ERGO/Munich Re in 2025 for approximately $2.6 billion, signaling that large incumbent carriers
    are willing to pay for AI-forward distribution capabilities and scale in the SMB segment. Corgi''s dual advantage of carrier
    margin and insurtech speed will be tested as incumbents invest in digital transformation and as direct insurtechs mature
    their underwriting capabilities.'
  tableRefs: []
  figureRefs:
  - FP001
- id: direct-insurtech-peers
  title: Direct Insurtech Competitors — Vouch and Embroker
  body: 'Vouch Insurance is the closest direct competitor to Corgi, serving 6,000+ companies across technology, healthcare,
    and professional services verticals. Vouch operates as an insurance brokerage, placing policies with external carriers
    rather than underwriting risk on its own balance sheet. It raised $90 million in Series C funding in September 2023, bringing
    total funding to approximately $160 million. Vouch''s startup insurance platform covers CGL, D&O, Tech E&O, Cyber, EPLI,
    and other core lines with a digital-first interface and human advisors for complex coverage. Its "Ambition Insured" brand
    and YC-adjacent customer base closely mirror Corgi''s target segment. The key structural difference from Corgi is that
    Vouch relies on external carrier paper: when an external carrier exits a line or reprices, Vouch must renegotiate or find
    alternatives. Corgi''s in-house underwriting entity (TRRG) eliminates this dependency and allows tighter pricing control.
    Embroker is a digital brokerage serving 9,500+ businesses with 16,000+ policies across multiple industries. Founded more
    than a decade ago, Embroker raised approximately $100 million in Series C funding in 2021 and combines digital quoting
    with a human advisory layer. Embroker''s startup insurance offering covers similar lines to Corgi but does not offer startup-stage-modular
    packaging or the AI Liability product. Its broader industry focus (not exclusively startups/tech) dilutes the degree of
    product specialization. Both Vouch and Embroker have 4.5+ star advisor ratings and strong brand recognition among founders,
    representing meaningful competition for customer acquisition in the YC/accelerator ecosystem. Corgi''s Corgi vs. Vouch
    comparison page argues that the full-stack model provides faster binding, more flexible underwriting, and better economics
    for startup-specific risks.'
  tableRefs:
  - TP001
  figureRefs: []
- id: specialist-vertical-insurtechs
  title: Specialist and Vertical Insurtech Players
  body: Beyond direct startup-insurance peers, several insurtech companies hold strong positions in lines that intersect with
    Corgi's expansion roadmap. Coalition is the dominant cyber insurance specialist, raising $250 million in Series F funding
    at a $5 billion enterprise valuation in 2022. Coalition's "Active Insurance" model bundles cyber risk management tooling
    with insurance coverage; policyholders reportedly experience 73% fewer claims as a result of proactive threat detection.
    Coalition focuses exclusively on cyber risk across SMB and mid-market and does not offer the bundled startup-stage package
    that Corgi provides. As Corgi competes on cyber line, it must differentiate on startup specialization, carrier economics,
    and the integrated bundle rather than on cyber-specific risk management depth. Cover Whale, which raised $27.5 million
    in Series A funding in 2023, applies AI-driven underwriting to trucking and commercial fleet insurance. Its DriveSmart
    telematics engine averages 18-minute bind times. Cover Whale operates in the same trucking vertical that Corgi announced
    as its next market expansion, making it the most direct future competitor in that lane. Pie Insurance, having raised $315
    million in its Series D round in 2022, targets the workers compensation market for small businesses. Pie's vertical depth
    in workers comp exceeds Corgi's current offering in that line. Cowbell Cyber raised $100 million in Series B and $60 million
    in Series C funding to develop an AI-powered cyber insurance pricing and policy management platform targeting SMBs through
    broker channels. Cowbell operates through brokers, while Corgi goes direct-to-founder. Next Insurance, which was acquired
    by ERGO/Munich Re in 2025 for approximately $2.6 billion, now operates as ERGO NEXT, insuring 750,000+ businesses with
    instant online access across 1,300+ types. Its near-term direction under Munich Re's ownership is unclear, but its scale
    and parent company's resources make it a potential threat in the broader SMB digital insurance market.
  tableRefs: []
  figureRefs: []
- id: incumbent-carrier-alternatives
  title: Incumbent Carrier Alternatives
  body: Traditional carriers remain relevant alternatives for startup buyers, particularly as companies mature into Series
    B and beyond. Chubb, one of the world's largest commercial insurers, serves businesses of all sizes across 30+ specialized
    industry practices, including tech and professional liability. Chubb provides the depth of coverage that large, multinational
    tech companies require but typically routes buyers through broker intermediaries, adding friction and cost. For the early-stage
    startup segment, Chubb's underwriting processes, minimum premiums, and broker-required workflow are not competitive with
    Corgi's self-serve model. The Hartford has served small business insurance customers for 200+ years and has 1.3 million+
    small business customers as of 2026, holding the number-one digital small business insurer ranking by Keynova. Hartford's
    digital capabilities have advanced significantly, but its product design is generalist SMB rather than startup-specific.
    It does not offer startup-stage modular packaging, AI Liability, or direct integrations with VC infrastructure platforms.
    Progressive Commercial has 50+ years of experience and 30+ coverage types across commercial auto and small business insurance,
    with particular strength in commercial vehicle lines relevant to trucking fleets. As Corgi expands into trucking, Progressive
    Commercial becomes a more relevant incumbent competitor. Incumbent carriers collectively represent the underwriting capital
    and pricing depth that insurtechs must eventually match; their weakness is distribution friction and product rigidity
    for tech-native buyers who want API integrations, instant bind, and transparent pricing.
  tableRefs:
  - TP003
  figureRefs: []
- id: feature-capability-comparison
  title: Feature and Capability Comparison
  body: 'Comparing feature coverage across the competitor set reveals three tiers of capability. Corgi occupies a unique position
    as the only player that is simultaneously a full-stack carrier with AI-native underwriting AND offers startup-stage-modular
    coverage with instant bind AND includes an AI Liability product. Vouch and Embroker match on startup focus and instant
    quoting but operate as brokers without underwriting control. Coalition leads on cyber risk management depth but does not
    offer the startup bundle or D&O/EPLI. Next Insurance (ERGO NEXT) leads on raw customer volume but is generalist SMB and
    does not specialize for venture-backed tech. Incumbent carriers (Chubb, Hartford, Progressive) are full-stack carriers
    with deep coverage breadth but lack startup specialization and instant bind capabilities for the seed/early stage. The
    most consequential differentiators for Corgi''s core segment are: (1) the AI Liability product, which no competitor currently
    offers as a standalone policy with clear coverage of model errors, hallucinations, and bias claims; (2) startup-stage
    modular packaging that maps coverage to funding milestones—a product design no other insurer replicates; and (3) the full-stack
    carrier structure that allows Corgi to retain underwriting margin that brokers must give to external carriers. However,
    the feature set for standard lines (CGL, D&O, Tech E&O, Cyber) is broadly comparable across the digital insurtech peers.
    Corgi''s competitive advantage on standard lines increasingly depends on pricing and speed rather than product uniqueness,
    creating a risk of convergence as competitors mature underwriting capabilities with similar AI tooling.'
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: moat-competitive-risk-assessment
  title: Moat, Lock-in, and Competitive Risk Assessment
  body: 'Corgi''s competitive durability rests on several moat categories with varying resilience. The full-stack carrier
    structure is moderately durable: it took Corgi approximately $35 million to acquire a licensed carrier and secure TRRG
    authorization, creating a meaningful capital barrier for insurtechs without funding. However, incumbents (Chubb, Hartford)
    already have full carrier licenses and need only develop the distribution and AI tooling. Vouch or Embroker could theoretically
    acquire a carrier entity if they chose to replicate Corgi''s model. The AI-native underwriting moat is high-risk: as large
    language models become commoditized infrastructure, competitors can replicate AI-based underwriting without proprietary
    training data at comparable cost. Coalition and Cowbell already use AI for cyber pricing. The YC network distribution
    channel provided a strong early-mover advantage but is not exclusive—any insurer can partner with YC or cultivate a presence
    in the accelerator ecosystem. Corgi''s AI Liability product is the most defensible near-term moat: no competitor has a
    publicly available standalone AI Liability policy, and Corgi''s claims experience from AI-company policyholders will build
    actuarial data before competitors can enter. Customer switching costs in commercial insurance are moderate: policies are
    annual, certificates of insurance are transferable, and broker-of-record changes are standard. However, integrations with
    cap table platforms, law firm referrals, and cloud marketplace listings create embedded distribution that increases effective
    switching costs at the segment level. On the risk side, the most acute competitive threat in the near term is that established
    cyber insurers (Coalition, Chubb) will introduce AI riders to existing cyber policies, undermining the standalone value
    of Corgi''s AI Liability product before Corgi has achieved meaningful market penetration. The TRRG structure also means
    that Corgi does not have access to state guaranty funds, which may disadvantage it with risk-averse buyers who compare
    it to carrier-backed alternatives.'
