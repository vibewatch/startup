- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - competitive threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Full-stack carrier structure (TRRG license)
    - Vouch/Embroker could acquire carrier entity; incumbents already are carriers
    - Medium
    - Verify TRRG capital adequacy and renewal terms; assess whether Corgi's carrier economics hold at scale
  - - AI-native underwriting and LLM automation
    - Coalition, Cowbell, and Next Insurance already use AI pricing; LLMs are increasingly commoditized
    - High
    - Assess depth of proprietary training data vs. off-the-shelf models; quantify underwriting accuracy advantage
  - - YC network and founder distribution channel
    - Any well-capitalized insurer could cultivate YC partnerships; not exclusive
    - Medium
    - Evaluate depth and exclusivity of YC and accelerator partnerships; assess referral volume data
