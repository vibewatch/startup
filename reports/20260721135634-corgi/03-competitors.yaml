callouts:
- title: AI Liability — First-Mover Advantage in an Emerging Category
  body: Corgi's AI Liability product covers errors, hallucinations, and bias claims arising from AI model outputs. No direct
    competitor offers a standalone AI Liability policy as of mid-2026. With AI-native companies comprising a growing share
    of new venture formations, this product serves as both a differentiator for customer acquisition and a data-acquisition
    strategy for building actuarial models in a category where no historical loss data yet exists. The risk is that established
    cyber insurers (Coalition, Chubb) add AI riders to existing cyber policies before Corgi builds meaningful scale in AI-company
    policyholders.
  calloutType: insight
  claimRefs:
  - CP019
  - CP033
- title: Full-Stack Carrier Moat Is Capital-Intensive but Not Exclusive
  body: 'The approximately $35 million Corgi spent to acquire a licensed carrier entity and secure TRRG authorization creates
    a meaningful barrier for underfunded insurtechs. However, this moat is not exclusive: incumbents (Chubb, Hartford) already
    have full carrier licenses, and well-capitalized insurtechs with access to growth capital could replicate the carrier
    structure. Corgi''s carrier advantage is most durable when combined with the AI-native underwriting stack and startup-specific
    product design — the combination is harder to replicate than any individual element alone.'
  calloutType: risk
  claimRefs:
  - CP029
  - CP035
  - CP036
