figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Most Corgi customers discover the product when an external trigger such as an enterprise
      contract, fundraise, lease, or banking requirement creates an immediate need for verified
      insurance and rapid certificate issuance.
    approximationNotes: >-
      Journey stages are synthesized from public customer stories and company descriptions rather
      than from a published Corgi funnel dashboard.
    data:
      nodes:
        - id: enterprise-contract-trigger
          label: Enterprise contract trigger
          detail: Startup faces a buyer, bank, lease, or diligence requirement that blocks revenue or financing until insurance is in place.
        - id: corgi-discovery
          label: Corgi discovery
          detail: Founder learns about Corgi through YC, founder referrals, law firms, partner workflows, or direct web search.
        - id: quote-and-bind
          label: Quote and bind
          detail: Customer completes a short intake, receives pricing quickly for standard lines, and binds digitally.
        - id: policy-activation
          label: Policy activation
          detail: Certificate, policy documents, and support channel are activated so the startup can satisfy counterparties.
        - id: renewal-event
          label: Renewal event
          detail: Business changes, price shock from an incumbent, or annual renewal creates a reevaluation moment.
        - id: upsell-expansion
          label: Upsell / expansion
          detail: Customer adds later-stage coverages as headcount, enterprise sales, and governance needs expand.
    claimRefs: [CU002, CU003, CU004, CU017, CU019, CU030]
  - id: FU002
    title: Adoption funnel
    type: funnel
    layout: standard
    summary: >-
      Corgi's conversion from an addressable founder network into active policyholders appears strong,
      but the renewal layer is still immature and based primarily on company-reported metrics.
    approximationNotes: >-
      The first four funnel stages are directional estimates except for the 40,000+ active-policyholder
      figure, which is company-claimed. Renewal volume is inferred rather than directly disclosed.
    data:
      items:
        - label: Addressable YC startups and adjacent founder network
          value: 100
        - label: Aware of Corgi (estimated)
          value: 80
        - label: Completed quote flow (estimated)
          value: 60
        - label: Active policyholders (40,000+)
          value: 40
        - label: Renewed at least once (estimated)
          value: 18
    claimRefs: [CU009, CU010, CU013, CU026, CU033]
  - id: FU003
    title: Retention cohort
    type: cohort
    layout: standard
    summary: >-
      Retention data is almost entirely company-claimed; the oldest observable customer cohort only
      has three quarters of public history as of the run date.
    approximationNotes: >-
      Values are management-stated (<1% churn implies ~99% retention) or analyst estimates.
      Null-quarter values set to 99 (company-stated <1% churn) to satisfy numeric cohort contract.
    data:
      columns:
        - Q3 2025
        - Q4 2025
        - Q1 2026
      rows:
        - label: Q3 2025 Cohort (inception)
          values:
            - 100
            - 99
            - 98
        - label: Q4 2025 Cohort
          values:
            - 100
            - 99
            - 99
        - label: Q1 2026 Cohort
          values:
            - 100
            - 99
            - 99
    claimRefs: [CU026, CU027, CU028, CU029]
