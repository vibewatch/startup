schemaVersion: report-v2
artifact: customers
slug: corgi
runDate: '2026-07-21'
company:
  name: Corgi
chapter:
  number: 6
  title: Customers
  key: customers
  summary: >-
    Corgi has assembled unusually broad early customer traction for a newly licensed startup-focused
    carrier, with 40,000+ active customers, nationwide availability across 49 states, and multiple
    named references from venture-backed software and AI companies. The customer story is strongest
    in founder speed, enterprise-contract enablement, and stage-based expansion potential, but the
    evidence base remains heavily company-curated. Public third-party proof is thin, retention data
    is immature, and channel concentration around the YC ecosystem creates a meaningful acquisition
    dependency even if absolute customer-count concentration appears low.
sections:
  - id: sec-01
    title: Customer base segmentation and acquisition channels
    body: >
      Corgi's customer base is best understood as a venture-backed startup portfolio rather than a
      generic small-business book. The company's customer pages, homepage, and YC profile all point
      to a concentrated core segment: Seed and Series A technology companies that suddenly need
      enterprise-grade insurance because a buyer, bank, landlord, or investor requires it. Within
      that broad startup segment, the visible sub-clusters are AI-native software companies,
      enterprise SaaS vendors, and a smaller set of climate or hardware-adjacent startups whose
      risks do not fit cleanly into an off-the-shelf broker template. The named examples reinforce
      this pattern. Artisan needed coverage to sell to banks, Eragon needed to satisfy enterprise
      procurement checklists, and Sorcerer required coverage tailored to a more complex physical
      deployment profile.

      Acquisition channels appear similarly focused. Public disclosures consistently suggest that YC
      and the founder-referral loop are the primary distribution engine, with secondary contribution
      from law firms, cap table platforms, cloud marketplace workflows, and direct inbound demand.
      That mix matters because it explains both the speed of logo accumulation and the concentration
      risk: Corgi is selling into communities where trust, referenceability, and timing around
      fundraises or enterprise deals matter more than broad consumer-style brand awareness. The 49-
      state footprint widens the reachable US startup market, but the absence of non-US coverage
      excludes a meaningful share of globally distributed founders who still operate US-incorporated
      startups.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: sec-02
    title: Adoption trajectory and growth metrics
    body: >
      The headline adoption claim is striking: Corgi reported 40,000+ active customers and $40M+
      ARR in its January 2026 launch materials, only months after TRRG became an operating carrier.
      Taken at face value, that implies one of the fastest early customer ramps in startup-insurance
      history. The supporting math is at least directionally coherent. Dividing $40M ARR by 40,000
      customers yields an average revenue per customer of roughly $1,000 annually, which fits the
      company's positioning around early-stage startups purchasing baseline commercial insurance
      bundles rather than large, multi-million-dollar enterprise programs. Public reporting around
      the January raise and May follow-on financing also supports the narrative that Corgi scaled
      rapidly through 2025 rather than only at launch.

      That said, the evidence quality is still mixed. The customer count, ARR figure, and churn
      metric are all company-claimed and surfaced through press materials, not audited filings or a
      lender-quality data room. No public source independently verifies whether "customers" means
      unique businesses, unique bound policies, or a broader account definition that includes
      multiple policies per company. Similarly, there is no disclosed third-party audit of ARR,
      cohort retention, or bind conversion. The growth story is therefore plausible and internally
      consistent, but investors should treat it as management-reported traction rather than a fully
      verified operating dataset.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: sec-03
    title: Named customer proof and case studies
    body: >
      Corgi's strongest customer-proof assets are its named case studies, which repeatedly frame the
      product as a speed and fit solution for founders facing a blocking insurance requirement.
      Artisan is the clearest economic proof point: the company says it switched from a traditional
      broker, saved about 30%, and bound in two days so it could satisfy banking-related enterprise
      requirements. Eragon's case centers on procurement velocity, with the founder describing a
      shift from a multi-week insurance checklist problem to a days-long close. Sorcerer shows the
      other side of the thesis: not every startup fits generic software underwriting, and hardware-
      linked or climate-adjacent businesses may value a carrier willing to tailor coverage rather
      than force a standard template. Intryc and Imagine AI reinforce the onboarding-speed message,
      including near-instant quoting, digital documentation, and a founder-facing support experience.

      The limitation is not the absence of named logos, but the independence of the evidence. Nearly
      all primary customer proof comes from Corgi's own curated customer pages, where the company
      selects the quotes, the examples, and the framing. The only higher-independence named customer
      corroboration in the provided source set is TechCrunch's mention of Deel as a customer. That
      helps because Deel is a credible, recognizable enterprise software logo, but the article does
      not detail policy scope, premium volume, or renewal history. Overall, the case studies are
      directionally persuasive for product-market fit, yet they stop short of the independent,
      portfolio-level customer validation that later-stage diligence would ideally require.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025]
    tableRefs: [TU003]
    figureRefs: []
  - id: sec-04
    title: Retention, churn, and durability signals
    body: >
      Retention is where the customer story becomes materially less proven. Corgi states that annual
      customer churn is below 1%, which would be extraordinary for a portfolio centered on early-
      stage startups, a segment that naturally experiences company shutdowns, pivots, and financing
      volatility. Directionally, low churn is plausible if many customers buy insurance to satisfy
      recurring contractual needs and then keep renewing as long as they remain active businesses.
      But the public evidence is insufficient to treat the number as validated. No NRR, GRR,
      renewal-rate series, satisfaction scorecard, or cohort table has been disclosed. The oldest
      observable carrier cohort only dates to Q3 2025, leaving at most three to four quarters of
      public retention history by the run date.

      This immaturity cuts both ways. On the positive side, there is no public evidence in the
      reviewed source set of widespread cancellations, claims-handling blowups, or visible renewal
      disputes. Customer anecdotes such as Intryc's suggest a high-touch post-bind experience for at
      least some accounts, which can support renewals. On the negative side, the portfolio has not
      yet been tested through a long claims-development cycle, a broad startup-downturn wave, or a
      multiyear repricing environment. That means the sub-1% churn figure should be treated as an
      early signal rather than a seasoned insurance-book durability metric.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032]
    tableRefs: [TU004]
    figureRefs: [FU003]
  - id: sec-05
    title: Expansion dynamics and concentration risks
    body: >
      Corgi's expansion model is structurally attractive because it matches how startups mature.
      Early customers can start with a compact bundle such as general liability, Tech E&O, cyber,
      and D&O, then add EPLI, media liability, fiduciary, or other specialty lines as headcount,
      fundraising complexity, or enterprise procurement needs rise. If the company keeps customers
      through that stage progression, average revenue per account should expand even without large
      numbers of new logos. The absolute customer base also reduces classic single-logo revenue
      concentration risk: at roughly $1,000 average annual revenue per customer, it is unlikely that
      any one startup dominates ARR.

      The more material risks are channel and portfolio composition. Public evidence suggests heavy
      dependence on the YC ecosystem and adjacent founder networks, which is powerful while Corgi is
      the preferred insurance choice inside that community but could become a meaningful drag if
      reputation shifts or competitors copy the acquisition motion. The startup-heavy portfolio also
      carries cyclical fragility: a venture slowdown, lower company formation, or elevated startup
      failure rates would hit both new-logo generation and renewal volumes. Geographic limits add a
      second constraint, since US-only coverage can create friction for globally distributed teams or
      companies whose operating footprint outgrows a startup-centric domestic policy package.
    claimRefs: [CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU040]
    tableRefs: [TU005]
    figureRefs: [FU004]
