callouts:
  - title: 40,000 customers in under 12 months of carrier operations is exceptional traction
    body: >-
      If Corgi's reported figures are directionally accurate, the company has achieved unusually fast
      customer adoption for a newly licensed startup carrier. The combination of 40,000+ active
      customers, $40M+ ARR, and roughly $1,000 average annual revenue per customer suggests a highly
      efficient high-volume distribution engine aimed at startup compliance moments. The main caveat
      is that all three numbers remain management-reported rather than externally audited.
    calloutType: strength
    claimRefs: [CU009, CU010, CU013]
  - title: All customer evidence is company-curated; independent third-party proof is limited
    body: >-
      Corgi has assembled compelling customer stories, but the underlying evidence base is thinner
      than the headline logos imply. Most named proof comes from Corgi's own customer pages, while
      public independent validation of ARR, customer count, renewal behavior, and outcome claims is
      limited. That does not invalidate the traction story, but it means diligence should rely on
      direct customer calls and internal operating data rather than marketing pages alone.
    calloutType: risk
    claimRefs: [CU034, CU012, CU027]
  - title: YC network channel concentration creates acquisition dependency and switching risk
    body: >-
      The YC distribution flywheel is a powerful early advantage because it compresses trust,
      referrals, and founder word-of-mouth into a repeatable acquisition channel. It is also a real
      dependency. If YC founders begin favoring another startup insurer, or if founder sentiment
      shifts because of service quality, pricing, or reputation concerns, Corgi's customer growth
      could decelerate sharply even if the broader startup-insurance market remains intact.
    calloutType: risk
    claimRefs: [CU033, CU002, CU036]
