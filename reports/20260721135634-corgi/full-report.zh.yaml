      - number: '6.5'
        title: 扩张动力与集中度风险
        blocks:
          - type: paragraph
            body: >
              Corgi 的扩张模型在结构上有吸引力，因为它贴合初创公司成熟路径。早期客户可以先购买一般责任险、Tech E&O、Cyber 和 D&O 等紧凑组合，等员工数、融资复杂度或企业采购需求上升后，再加入
              EPLI、媒体责任险、受托责任险或其他专门险种。只要公司能留住客户穿过这些阶段，哪怕没有大量新客户标识，每账户平均收入也应扩张。绝对客户基数也降低了经典单一客户收入集中风险：按每客户年均收入约 $1,000
              计算，任何一家初创公司都不太可能主导 ARR。

              更实质的风险在渠道和组合构成。公开证据显示，Corgi 高度依赖 YC 生态和邻近创始人网络；当 Corgi
              是该社区的首选保险时，这是强力优势，但如果声誉变化或竞争对手复制获客动作，就可能成为有意义拖累。初创公司占比高的组合也有周期脆弱性：创投放缓、公司成立减少或初创公司失败率上升，都会同时打击新客户生成和续保量。地域限制增加第二道约束，因为只覆盖美国会给全球分布团队，或运营足迹已经超出初创公司中心国内保单组合的公司，带来摩擦。
