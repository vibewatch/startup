      - number: '5.2'
        title: AI 原生承保引擎与客户流程
        blocks:
          - type: paragraph
            body: >
              Corgi 的产品承诺，取决于能否把过去高度人工的保险流程压缩成软件中介流程，让创始人在一次操作中完成标准险种。公开系统描述称，公司用大语言模型阅读申请材料、评估风险、生成报价、管理保单并支持理赔处理。Nubia
              的评测把这一系统称为“监管裸金属”栈，意思是 Corgi 将 AI
              直接用于受监管的保险任务，而不只是围绕传统承保机构后端包一层经纪体验。落到实操，公司似乎会收集公司阶段、收入、员工数、行业、产品画像和司法辖区等结构化输入，再用这些信息为标准产品快速生成定价报价。

              流程围绕速度和连续性设计。Corgi 称核心初创公司险种可在 10-15 分钟内报价，专门产品需要 1 到 14
              个工作日，证书可在出单后数分钟内数字化交付。理赔也是全栈承诺的一部分：同一家公司承保保单并处理理赔，减少经纪商主导结构中常见的交接。仪表盘被定位为 24/7
              运营界面，可添加或移除保障、下载证书并管理续保。仍不透明的是技术底座：Corgi 没有披露基础模型供应商、模型架构、准确率基准或人工介入阈值。
