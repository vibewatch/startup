      - number: '5.5'
        title: 差异化、技术风险与合规
        blocks:
          - type: paragraph
            body: >
              Corgi 最清晰的差异化不是算法，而是结构。分析师和评测者都把全栈承保机构模型视为核心原因：它能捕获承保经济性，并以不同于经纪商主导保险科技公司的方式塑造产品体验。AI Liability
              产品增加第二层差异化，切入一个新兴类别；传统承保机构在这里往往依赖排除条款、模糊措辞或人工审核。如果 Corgi 能在大型在位者回应前积累可信的理赔历史和定价数据，这种组合可能形成有意义的护城河。

              核心技术和监管风险同样清晰可见。从 2025 年 7 月 TRRG 牌照到 2026 年 1 月公开发布，Corgi
              的承保机构运营历史不到一年，长尾赔案证据非常有限。独立评测也把缺少公开赔案数据和履历太短列为真实担忧。公开技术透明度同样低：没有模型卡、基准结果、API 文档或算法审计报告。这让外部很难判断承保 AI
              是否拥有足够数据、控制和监控，能够避免逆向选择。TRRG 结构还带来合规提醒，因为 RRG 不提供州担保基金保护，即便在 LRRA 下获得联邦层面授权，也可能面对各州运营限制。
