        - label: AI Liability（先发）
          values:
            - 中
            - 公开理赔历史很有限
            - AI 初创公司需求快速增长
            - 若条款措辞和定价撑得住，则为高
        - label: 卡车运输险（萌芽）
          values:
            - 低 / 未知
            - 未公开披露
            - 潜在规模大的相邻市场
            - 当前低；护城河未验证
    claimRefs:
      - CE017
      - CE027
      - CE033
      - CE037
      - CE039
      - CE040
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Corgi 多数客户是在外部触发下发现产品：企业合同、融资、租约或银行要求， 立刻带来可验证保险和快速签发凭证的需求。
    approximationNotes: 旅程阶段综合自公开客户故事和公司描述，而非 Corgi 已发布的漏斗仪表盘。
    data:
      nodes:
        - id: enterprise-contract-trigger
          label: 企业合同触发
          detail: 初创公司面临买方、银行、租约或尽调要求；在保险到位前，收入或融资被卡住。
        - id: corgi-discovery
          label: 发现 Corgi
          detail: 创始人通过 YC、创始人转介、律所、合作伙伴流程或直接网页搜索了解 Corgi。
        - id: quote-and-bind
          label: 报价并生效
          detail: 客户完成简短录入，标准险种快速拿到定价，并在线生效。
        - id: policy-activation
          label: 保单激活
          detail: 激活凭证、保单文件和支持渠道，让初创公司满足交易对手要求。
        - id: renewal-event
          label: 续保事件
          detail: 业务变化、原承保方价格冲击或年度续保，触发重新评估。
        - id: upsell-expansion
          label: 增购 / 扩张
          detail: 员工数、企业销售和治理需求扩大后，客户增加后期阶段保障。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU017
      - CU019
      - CU030
  - id: FU002
    title: 采用漏斗
    type: funnel
    layout: standard
    summary: Corgi 将可触达创始人网络转化为活跃投保人的能力看起来强劲，但续保层仍不成熟， 主要依赖公司披露指标。
    approximationNotes: 除 40,000+ 活跃投保人数字为公司说法外，前四个漏斗阶段均为方向性估计。 续保量来自推断，而非直接披露。
    data:
      items:
        - label: 可触达的 YC 初创公司及相邻创始人网络
          value: 100
        - label: 知晓 Corgi（估计）
          value: 80
        - label: 完成报价流程（估计）
          value: 60
        - label: 活跃投保人（40,000+）
          value: 40
        - label: 至少续保一次（估计）
          value: 18
    claimRefs:
      - CU009
      - CU010
      - CU013
      - CU026
      - CU033
  - id: FU003
    title: 留存队列
    type: cohort
    layout: standard
    summary: 留存数据几乎全部来自公司说法；截至运行日期，最早可观察客户队列只有三个季度的公开历史。
    approximationNotes: 数值来自管理层披露（<1% 流失意味着约 99% 留存）或分析师估计。 空季度值设为 99（公司称 <1% 流失），以满足数值型队列合同。
    data:
      columns:
        - Q3 2025
        - Q4 2025
        - Q1 2026
      rows:
