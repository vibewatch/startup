chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、运营模式与承保结构
        blocks:
          - type: paragraph
            body: >
              Corgi Insurance 是一家全栈保险承保商，总部位于 California 州 San Francisco 的 9 Claude Lane。公司面向 VC
              支持的初创公司和科技公司直接销售商业保险产品，同时担任承保方和项目管理方，不依赖经纪中介或前置承保商。相比 Vouch、Embroker 等以经纪模式为主的保险科技 竞争者，这种全栈模式是最重要的结构性差异。


              Corgi 的法律和监管结构把责任拆在两个实体上。保单由 Technology Risk Retention Group, Inc.（TRRG）承保；TRRG 是依据 Liability Risk
              Retention Act（15 U.S.C. §3901 et seq.）设立的风险自留集团，也是实际承担风险的主体。Corgi Insurance Services, Inc.
              是单独持牌的保险销售主体（California License #6012791），担任项目管理方并负责分销。销售实体在美国 45 个司法辖区持有牌照，产品可在 49 个州销售。


              TRRG 结构带来一个关键监管提示：作为风险自留集团，TRRG 不受全部州保险法律和监管约束；风险自留集团签发的保单也明确不能获得州保险破产担保基金保护。Corgi
              自己的免责声明页面披露了这一点。潜在投保人评估承保商稳健性、投资人评估全栈承保模式时，这一点都很重要。


              公司把使命表述为从底层重建 $1T+ 全球保险业，并把自己定位为未来百年的金融基础设施，而不是在既有经纪主导分销上做小幅改良。Corgi 维护一个直接数字平台，创始人可在 15
              分钟内为核心险种拿到已出单保单，把传统经纪通常需要数天到数周的流程压缩到分钟级。
