  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              2026 年，初创商业保险市场由三类竞争者争夺。第一类是直接保险科技同行，主要是 Vouch 和
              Embroker；它们为初创买方打造数字经纪平台，提供顺滑报价和面向初创阶段的产品，但承保依赖外部承保商。第二类是专业或垂直保险科技公司：Coalition 以 Active Insurance
              模式主导网络保险，Cover Whale 把 AI 用于卡车车队风险，Pie Insurance 专注工伤赔偿险，Cowbell Cyber 为 SMB 提供 AI
              驱动的网络险定价。第三类是在位承保商——Chubb、The Hartford 和 Progressive Commercial——控制更广的商业保险市场，持有完整承保牌照，也在扩展数字能力，但并不专门面向 VC
              支持的科技公司分层。Corgi 位于全栈承保商和保险科技公司的交叉点：它拥有自己的承保实体（TRRG），以承保商而非经纪商身份产生利润，并把 AI 原生工具用于整个保单生命周期。截至 2026
              年中，还没有其他玩家在同一平台上同时具备初创阶段模块化保障、即时出单、AI 责任险和全栈承保商经济性。竞争版图变化很快：Next Insurance 于 2025 年被 ERGO/Munich Re 以约
              $2.6 billion 收购，说明大型在位承保商愿意为 AI 前倾的分销能力和 SMB 规模付费。随着在位者投资数字化转型、直接保险科技公司提升承保能力，Corgi
              的承保利润和保险科技式速度双重优势会被持续检验。
