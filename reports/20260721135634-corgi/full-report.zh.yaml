              - CV004
              - CV017
              - CV033
              - CV040
      - number: '8.4'
        title: 情景分析：乐观、基准与悲观情形
        blocks:
          - type: paragraph
            body: >-
              面对 Corgi 这种明显拉伸的估值，情景分析是最克制的解读方式。乐观情形下，Corgi 从 $40M ARR 复合增长到 2028 年约 $350M，守住 AI
              驱动的分发优势，证明承保主体模式能在理赔表现可接受的情况下扩展，并以仍有溢价的 20x 倍数退出；这会产生约 $7.0B 价值，相对 Series B1 入场价约 2.7x。基准情形下，Corgi
              仍然增长不错——到 2028 年约 $200M ARR——但随着公司成熟、投资人要求看到承保利润而不是叙事，市场倍数回归到 12x；结果约 $2.4B，略低于当前入场价值。悲观情形下，增长放缓到约 $80M
              ARR，市场按专业经纪商或受挫保险科技公司的 5x ARR 给公司定价，结果约
              $400M，资本损失严重。真正打破投资逻辑的情形——准备金承压、监管不利行动，或承保主体模式失败——可能接近归零。按既定概率计算，概率加权价值约 $2.57B，基本等同 Series B1
              价格。本章的核心洞见是：上行确实存在，但期望值已经大多提前拉进今天的入场估值。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV024
              - CV031
