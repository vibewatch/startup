      - number: '4.2'
        title: 定价与商业化结构
        blocks:
          - type: paragraph
            body: >-
              Corgi 采用直接承保机构定价：保费由自有承保团队设定，没有经纪佣金层。已发布的初创公司保险成本指南显示，pre-seed 保障（CGL + Tech E&O 基线）约从每年 $500–$2,000
              起，seed 阶段组合在 $2,000–$4,000，Series A 方案（加入 D&O 和 EPLI）在 $10,000–$25,000，growth 阶段项目每年超过
              $30,000。这些是标价；实际保费会随风险画像、所选限额、行业和理赔历史变化。根据 Artisan 的客户证言（Corgi 自有案例研究），Corgi
              的全栈承保机构地位让它在部分场景下相较经纪商竞争对手可节省最高 30% 成本。定价模型包括标准险种的即时报价自助路径（10–15 分钟报价、当天出单），也包括需要 1–14
              天承保的专门险种人工经纪渠道。公司没有公开披露批量折扣或企业定价表。合同条款为年度保单，遵循标准商业保险续保周期。Workers Compensation 和部分专门险种可能按工资额调整计费。商业化模型不包含订阅
              SaaS 收入；公开表述显示，收入 100% 由保险保费驱动。因此，收入与保费规模和赔付表现相关，而不是合同化经常性 SaaS 收入，带来纯 SaaS 模型没有的波动风险。
