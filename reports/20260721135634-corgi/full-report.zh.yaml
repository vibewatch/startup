            title: AI Liability 产品在未验证保障类别中建立先发优势
            body: >-
              Corgi 的 AI Liability 产品具有战略重要性，因为它处理的是一类初创公司风险，许多传统 E&O 条款要么直接排除，要么覆盖模糊。Corgi
              明确点名幻觉、算法偏见和训练数据知识产权争议，把自己定位成在产品条款层面理解 AI 公司风险的承保机构。上行是实质性的先发优势；下行是这一优势落在公开理赔历史很少的类别里，条款精度和定价纪律会极其关键。
