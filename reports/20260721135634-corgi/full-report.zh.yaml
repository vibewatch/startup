      - number: '4.5'
        title: 公开牵引力、收入质量与估算
        blocks:
          - type: paragraph
            body: >-
              Corgi 公开披露的财务指标只能拼出局部图景。$40M+ ARR 是公司口径，随 2026 年 1 月 Series A 新闻稿发布，而非正式经审计披露。2024 年中提到的 $1.2M
              收入来自二级分析师来源。保险公司的 ARR 指标需要特别解释：保险 ARR（年化保费运行率）不同于 SaaS ARR，因为保费要承担赔款、再保险成本和精算发展。综合成本率 100%（盈亏平衡）的 $40M ARR
              承保机构没有净收入；综合成本率 90% 产生 $4M 净收入；综合成本率 80% 产生 $8M。CEO 关于 2026 年 4 月盈利的说法若理解为综合成本率低于 100%，对一家完整承保运营仅约 10
              个月（2025 年 7 月获牌）的承保机构是有意义的里程碑。具名客户部分证明了客户质量：Artisan（AI BDR 初创公司）、Eragon（企业 SaaS）、Sorcerer（气象气球 /
              气候数据）、Intryc（数据安全 / Deel 客户）和 Imagine AI（内容自动化）。五个客户案例都来自 YC 相关公司，符合 YC 网络获客策略，也带来集中度风险：YC
              项目流或品牌感知一旦变化，可能对 Corgi 的客户管线产生不成比例影响。$40M+ ARR 对应 40,000+ 名客户，意味着客户基础高量、低 ARPC，且以小型 seed 阶段公司为主。这些公司成长到
              Series A 及以后，自然增购应会扩大 ARPC、改善收入质量。不过，公司没有披露 ARPC 轨迹或队列扩张收入数据。
