      - number: '7.4'
        title: 合作方、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Corgi 的获客和运营模型依赖少数关键关系；即使客户需求不变，这些关系也可能改变经济性或可行性。最明显的是 TRRG
              牌照本身：承保实体支撑整个产品栈，任何针对该载体的监管行动都会几乎同时影响所有险种。再保险是第二个同等重要但公开透明度更低的依赖。若交易对手降低承保能力、收紧条款或激进重新定价，Corgi
              可能面临更低限额、更差利润率或更高自留风险，同时还必须服务期待速度和低保费的初创公司客户。分销集中再加一层风险。公开证据显示 YC 是主要客户获取引擎；社区信任仍在时，这是重大优势，但若 YC
              创始人情绪转向或竞争保险公司成为首选伙伴，就会变成实质弱点。公司似乎还依赖未披露的云和 AI 基础设施提供商、股权结构和工作流
              API，以及以创始人为中心的运营核心。对年轻保险科技公司而言，这些依赖单独看并不罕见，但组合在一起就很重要。Corgi
              已经搭出一个可见产品覆盖很宽、但若干不可见承重关系很窄的平台，因此尽调应把交易对手和渠道韧性视为一阶承保变量，而不是背景运营细节。
