            body: >-
              全栈设计同时改变产品体验和经济性。Corgi
              借自己的承保机构结构承保，而不是把客户导向外部承保牌照提供方，因此能把报价、出单、保单服务和理赔统一到一个运营模型下。这应当让客户流程更简单，也创造了保留承保利润的可能，而经纪商主导的同行会把这部分留给外部承保机构。战略问题在于，在在位者或经纪商竞争对手复制客户体验层之前，Corgi
