      - number: '7.5'
        title: 风险缓释、监控信号与投资逻辑击穿触发点
        blocks:
          - type: paragraph
            body: >-
              Corgi
              的好消息是，主要风险虽然还无法从公开信息中充分量化，但可以监控。公司广泛推进牌照、融资强劲、增长很快，且在初创公司保险中显示出产品市场契合度，这些证据足以支持继续尽调，而不是立即否定。问题在于，决定性问题正是公开材料没有回答的部分：TRRG
              盈余充足性、按险种拆分的赔付率、准备金方法、再保险结构、对 YC
              来源需求的依赖，以及创始人密集文化的可持续性。因此，正确姿态不是假定投资逻辑已经失效，而是设定一旦越线就会迅速击穿逻辑的明确触发点。最重要的触发点包括针对 TRRG 的监管行动、AI Liability 或
              Cyber 持续出现不利发展、失去 YC 分销飞轮、创始人离职，或出现 ARR / 客户指标被夸大的证据。监控应聚焦 NAIC
              申报（可取得后）、牌照状态变化、再保险披露、领导层更新，以及初创公司融资环境弱化到足以打击核心客户基础的迹象。在积极承保这门生意前，投资者应要求管理账、精算准备金备忘录、再保险安排、赔案清单和渠道组合数据。
