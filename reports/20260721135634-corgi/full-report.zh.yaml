      - CU027
      - CU028
      - CU029
  - id: FU004
    title: 客户证据质量矩阵
    type: matrix
    layout: wide
    summary: 可见客户证据几乎都来自公司筛选；在给定来源集中，只有 Deel 有实质性第三方佐证。
    approximationNotes: 矩阵基于来源出处和客户故事具体程度，对独立性和业务影响作定性评分。
    data:
      columns:
        - 证据类型
        - 来源独立性
        - 新鲜度
        - 业务影响
        - 尽调需求
      rows:
        - label: Artisan（AI BDR）
          values:
            - 具名案例研究
            - 公司筛选
            - 当前
            - 合同成交（企业银行）
            - 独立验证
        - label: Eragon（企业 SaaS）
          values:
            - 具名案例研究
            - 公司筛选
            - 当前
            - 合同成交（数天 vs 数周）
            - 独立验证
        - label: Sorcerer（气候科技）
          values:
            - 具名案例研究
            - 公司筛选
            - 当前
            - 续保时定制保障
            - 需要损失率数据
        - label: Intryc（软件开发）
          values:
            - 具名案例研究（CEO 引言）
            - 公司筛选
            - 当前
            - 即时生效和创始人互动
            - 独立验证
        - label: Deel（AI 薪资）
          values:
            - 第三方提及
            - TechCrunch（独立）
            - 当前
            - 高知名度具名客户
            - 确认保障范围
    claimRefs:
      - CU007
      - CU008
      - CU011
      - CU015
      - CU038
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 热力图按预期发生概率和影响排列 Corgi 最重要风险。最高优先级象限是 AI 模型误定价 与监管合规复杂性的组合；长期运营历史形成前，二者最可能伤到承保公司模型。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高概率
          values:
            - YC 集中度
            - 运营烧钱 / 文化
            - 监管合规复杂性
            - AI 模型误定价（逆向选择）
        - label: 中等概率
          values:
            - VC 融资放缓
            - API 依赖失效
            - 理赔争议激增
            - AI Liability 不利发展
        - label: 低概率
          values:
            - 股权结构表 API 撤销
            - SOC 2 违规事件
            - TRRG 牌照挑战
            - 再保险容量撤回
        - label: 极低概率
          values:
            - 创始人离职
            - 灾难性 AI 责任索赔
            - 联邦禁用 RRG 模式
            - ARR 完全重述
    claimRefs:
      - CR001
      - CR008
      - CR013
      - CR021
      - CR029
      - CR032
      - CR038
      - CR042
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    summary: Corgi 的核心传导路径从 AI 承保错误进入损失率压力，随后是准备金不足、 监管或资本行动，最终击穿承保公司逻辑。
    data:
      nodes:
        - id: ai-mispricing
          label: AI 模型误定价
          detail: AI 驱动承保系统性低估 AI Liability 或网络险的风险。
        - id: loss-ratio-deterioration
          label: 损失率恶化
          detail: 赔付超过保费预期，综合成本率突破可持续水平。
        - id: reserve-inadequacy
          label: 准备金不足
          detail: TRRG 持有的准备金不足以在赔案成熟时支付未决赔款。
        - id: regulatory-action
          label: 监管行动
          detail: NAIC 或州监管机构对 TRRG 采取纠正措施。
        - id: capital-shortfall
          label: 资本缺口
          detail: TRRG 需要额外股权以维持盈余充足。
        - id: thesis-break
          label: 逻辑破裂
          detail: 承保公司模式可行性受损，估值基础被压缩。
      edges:
        - from: ai-mispricing
          to: loss-ratio-deterioration
        - from: loss-ratio-deterioration
          to: reserve-inadequacy
        - from: reserve-inadequacy
          to: regulatory-action
        - from: reserve-inadequacy
          to: capital-shortfall
        - from: regulatory-action
          to: thesis-break
        - from: capital-shortfall
          to: thesis-break
    claimRefs:
      - CR020
      - CR022
      - CR028
      - CR037
      - CR038
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    summary: Corgi 的平台依赖六类关键外部或集中关系；TRRG 承保公司身份和创始人是最清晰的单点故障， YC 和再保险则是最重要的扩张依赖。
    data:
      nodes:
        - id: corgi-platform
          label: Corgi 平台
          detail: 中央 AI 原生保险平台和市场拓展引擎。
        - id: trrg
          label: TRRG 承保公司牌照
          detail: Technology Risk Retention Group, Inc.，承保载体。
        - id: reinsurance
          label: 再保险计划
          detail: 未披露的再保险人提供风险转移容量。
        - id: yc-network
          label: YC 网络
          detail: 主要获客渠道。
        - id: ai-infra
          label: 云端 AI 基础设施
          detail: 未披露的云服务商支撑承保技术栈。
        - id: founders
          label: 创始人（Laqua/Yuan）
          detail: 战略和运营集中在两人身上。
        - id: regulators
          label: 州/联邦监管机构
          detail: 45+ 个司法辖区，需要持续合规和维护牌照。
      edges:
        - from: corgi-platform
          to: trrg
        - from: corgi-platform
          to: reinsurance
        - from: corgi-platform
          to: yc-network
        - from: corgi-platform
          to: ai-infra
        - from: corgi-platform
          to: founders
        - from: corgi-platform
          to: regulators
    claimRefs:
      - CR029
      - CR031
      - CR032
      - CR033
      - CR034
      - CR036
  - id: FV001
    title: ARR 增长轨迹
    type: bar
    summary: Corgi 的 ARR 似乎从 2024 年中约 $1.2 million，到 2025 年 12 月增至 $40 million。2026 年估算只是分析师给出的方向性预测， 并非公司披露数字。
    data:
      items:
        - label: 2024 年中
          value: 1.2
          unit: $M ARR
          detail: 公司披露的上线初期 ARR；种子轮阶段。
          tone: positive
        - label: 2025 年 12 月
          value: 40
          unit: $M ARR
          detail: 公司披露 ARR；18 个月约增长 33x。
          tone: positive
        - label: 2026 年（分析师估算）
          value: 80
          unit: $M ARR
          detail: 分析师基于已披露增长轨迹作出的预测；并非公司披露。
          tone: neutral
    claimRefs:
      - CV006
      - CV024
      - CV031
  - id: FV002
    title: 可比估值倍数
    type: bar
    summary: Corgi 的 Series B1 轮 ARR 倍数达 65x，远高于可比样本。即便收入口径不同，与成熟或只能部分对标的保险科技交易相比，差距仍然极大。
    data:
      items:
        - label: Corgi（Series B1）
          value: 65
          unit: x ARR multiple
          detail: Series B1 轮投后估值 $2.6B / ARR $40M。
          tone: warning
        - label: Corgi（Series B）
          value: 32.5
          unit: x ARR multiple
          detail: Series B 轮投后估值 $1.3B / ARR $40M。
          tone: neutral
        - label: Coalition（2022）
          value: 10
          unit: x GWP multiple
          detail: Coalition Series F 轮估值 $5B / GWP 约 $500M。
          tone: neutral
        - label: Next Insurance（2025）
          value: 8.7
          unit: x GWP multiple
          detail: ERGO 收购价约 $2.6B / GWP 约 $300M。
          tone: neutral
        - label: Vouch/Embroker（估算）
          value: 3
          unit: x ARR/revenue (est)
          detail: MGA 模式保险科技公司的估算收入倍数。
          tone: neutral
    claimRefs:
      - CV001
      - CV002
      - CV011
      - CV012
      - CV036
      - CV041
  - id: FV003
    title: 情景价值区间
    type: range
    summary: 情景区间显示，当前进入价已接近概率加权中点。上行空间仍在，但中位数回报大多已经计入价格。
    data:
      items:
        - label: 乐观（25%）
          low: 5
          mid: 7
          high: 9
          unit: $B enterprise value
          detail: $350M ARR × 20x 终局倍数。
          tone: positive
        - label: 基准（50%）
          low: 1.8
          mid: 2.4
          high: 3
          unit: $B enterprise value
          detail: $200M ARR × 12x 重估倍数。
          tone: neutral
        - label: 悲观（20%）
          low: 0.1
          mid: 0.4
          high: 0.7
          unit: $B enterprise value
          detail: $80M ARR × 5x 经纪商级倍数。
          tone: negative
        - label: 论点破裂（5%）
          low: 0
          mid: 0
          high: 0.1
          unit: $B enterprise value
          detail: TRRG 遭遇监管行动或准备金不足；股权价值接近零。
          tone: negative
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: FV004
    title: 投资决策逻辑
    type: flow
    summary: 估值决策先看当下偏高的进入价，再看价值创造驱动因素和风险因素，最后落到各情景结果；结论是有条件推荐，而不是无条件买入。
    data:
      nodes:
        - id: entry
          label: 进入价 $2.6B（65x ARR）
          detail: Series B1 轮投后估值；价格已经预设执行到位。
        - id: drivers
          label: 价值创造驱动因素
          detail: ARR 增长（3x+）、承保方经济性、AI 差异化、市场扩张。
        - id: risks
          label: 风险清单
          detail: RRG 监管风险、AI 损失发展、YC 集中度、关键人物风险。
        - id: scenarios
          label: 情景结果
          detail: 乐观 $7B / 基准 $2.4B / 悲观 $0.4B / 论点破裂 $0。
        - id: recommendation
          label: 有条件看多逻辑
          detail: 只有 ARR 维持 3x+ 增长、且 TRRG 年度报表确认准备金充足时，投资确信才站得住。
      edges:
        - from: entry
          to: drivers
        - from: entry
          to: risks
        - from: drivers
          to: scenarios
        - from: risks
          to: scenarios
        - from: scenarios
          to: recommendation
    claimRefs:
      - CV022
      - CV024
      - CV028
      - CV037
  - id: FV005
    title: 关键绩效指标
    type: kpi
    summary: 五个公开 KPI 概括 Corgi 的增长和估值状态。它们有方向性参考价值，但大多来自管理层披露，并未经过独立审计。
    data:
      items:
        - label: ARR（2025 年 12 月）
          value: $40M
          tone: positive
          detail: 公司披露；较 2024 年中约增长 33x。未经独立审计。
        - label: 客户数量（2026 年 1 月）
          value: 40,000+
          tone: positive
          detail: 公司披露；对应每位客户年均保费约 $1,000。
        - label: 流失率（公司披露）
          value: <1%
          tone: neutral
          detail: 管理层声称；缺乏独立验证。若属实，表现很强。
        - label: Series B1 轮估值
          value: $2.6B
          tone: positive
          detail: 2026 年 5 月 28 日投后估值。ARR 倍数 65x。22 天内较 Series B 翻倍。
        - label: 累计融资
          value: $378M
          tone: neutral
          detail: 截至最新一轮的累计融资。承保载体的资本要求仍然可观。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV035
