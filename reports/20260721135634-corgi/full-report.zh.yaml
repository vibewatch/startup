      - number: '6.4'
        title: 留存、流失与耐久性信号
        blocks:
          - type: paragraph
            body: >
              留存是客户故事中明显更缺乏证明的一环。Corgi 称年客户流失率低于
              1%；若客户组合以早期初创公司为中心，这一数字会非常罕见，因为该群体天然经历公司关闭、转向和融资波动。方向上，若许多客户买保险是为了满足反复出现的合同需求，并且只要仍在经营就继续续保，低流失率是可能的。但公开证据不足以把这个数字视为已验证。公司没有披露
              NRR、GRR、续保率序列、满意度评分卡或队列表。最早可观察的承保机构队列只追溯到 2025 年 Q3，截至报告日期最多有三到四个季度的公开留存历史。

              这种不成熟两面都有影响。积极一面是，所审阅来源集中没有公开证据显示大规模取消、理赔处理事故或可见续保纠纷。Intryc
              等客户轶事显示，至少部分账户在出单后获得高接触服务，这可以支撑续保。消极一面是，组合还没有经历长理赔发展周期、广泛初创公司下行潮或多年重新定价环境的测试。因此，低于 1%
              的流失率应被视为早期信号，而不是成熟保险账簿的耐久性指标。
