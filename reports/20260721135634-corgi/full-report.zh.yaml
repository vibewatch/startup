companyProfile:
  summary: >
    Corgi Insurance 是一家总部位于 San Francisco 的 AI 原生全栈保险承保商，由 Nico Laqua（CEO/CTO）和 Emily Yuan（COO）于 2024 年创立。公司出自 Y
    Combinator 2024 年夏季批次，并在以约 $35 million 收购一家持牌保险实体后，于 2025 年 7 月取得完整承保商监管批准。Corgi 用大语言模型和 AI
    智能体驱动，从承保、出单到理赔端到端设计并管理保险，面向美国 49 个州的 VC 支持初创公司直接销售模块化商业保险。上线后不到 12 个月，公司增长到 $40M+ ARR、40,000+ 活跃客户，并完成 3 轮融资、累计
    $378M，到 2026 年 5 月下旬估值达到 $2.6B。
