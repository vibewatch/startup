      - number: '4.4'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Corgi 累计融资 $378 million，主要包括三轮：$108 million 的 Seed 和 Series A 合并轮（2026 年 1 月宣布）、估值 $1.3
              billion 的 $160 million Series B（2026 年 5 月 6 日），以及估值 $2.6 billion 的 $106 million Series B1（2026 年 5 月 28
              日），均由 TCV 领投。$106 million Series B1 在 $160 million Series B 后三周完成——22 天内估值翻倍，融资节奏异常压缩。CEO Nico Laqua 在
              2026 年 5 月 Forbes 采访中表示，公司在 2026 年 4 月（Series B1 交割前一个月）已经盈利，因此这次融资更像增长导向，而不是生存驱动。作为全栈承保机构，Corgi
              的资本要求高于保险科技经纪商：在风险留存集团监管下，TRRG 必须相对于净签单保费维持足够盈余（资本储备）。以约 $35 million
              收购承保实体属于沉没成本；持续资本充足性取决于保费账簿相对盈余的增长速度。在 $40M+ ARR
              和高速增长下，资本分配流向承保机构盈余而非运营费用，可能解释了融资金额之大。公司没有披露账面现金、月度烧钱速度或现金跑道。考虑到 CEO 关于 2026 年 4
              月盈利的说法，运营口径烧钱速度可能接近零或为正，但承保机构盈余要求仍可能单独消耗资本。Series B1 条款中“由 TCV 领投”且有 15+
              名共同投资者，说明本轮可能部分由当前增长轨迹下的强劲投资人需求推动，而非急迫资本需求。
