  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与获客渠道
        blocks:
          - type: paragraph
            body: >
              Corgi 的客户基础更应被理解为风投支持的初创公司组合，而不是泛化小企业账簿。公司的客户页、首页和 YC Profile 都指向一个集中的核心客群：Seed 和 Series A
              科技公司，因为买方、银行、房东或投资人要求，突然需要企业级保险。在这个宽泛初创公司群体内，可见子集包括 AI 原生软件公司、企业 SaaS
              厂商，以及少量气候或硬件邻近初创公司；它们的风险很难干净套入现成经纪商模板。具名案例强化了这一模式。Artisan 需要保险才能卖给银行，Eragon 需要满足企业采购清单，Sorcerer
              则需要为更复杂的物理部署画像定制保障。

              获客渠道看起来同样聚焦。公开披露持续显示，YC
              和创始人推荐循环是主要分销引擎，律师事务所、股权结构平台、云市场工作流和直接入站需求提供次级贡献。这一组合很重要，因为它同时解释了客户标识积累速度和集中度风险：Corgi
              卖进的是信任、可背书性、融资或企业交易节点比广泛消费者式品牌认知更重要的社区。49 州覆盖扩大了可触达的美国初创公司市场，但缺少美国以外保障，排除了相当一部分仍以美国公司形态运营、但团队全球分布的创始人。
