    模块化商业保险组合（商业一般责任险 CGL、董事及高管责任险 D&O、技术差错与遗漏险 Tech E&O、网络险 Cyber、雇佣实践责任险 EPLI、受托责任险 Fiduciary、雇用及非自有汽车险 HNOA、媒体责任险
    Media Liability、陈述与保证险 R&W 和 AI 责任险 AI Liability），按初创公司的融资阶段（Pre-Seed、Series A、Growth）分层。核心产品借助 AI 承保在 10–15
