      - number: '3.5'
        title: 功能与能力对比
        blocks:
          - type: paragraph
            body: >-
              横向比较竞争者的功能覆盖，可以看到三档能力。Corgi 处在一个独特位置：它是唯一同时具备全栈承保商身份、AI 原生承保、初创阶段模块化保障、即时出单，并包含 AI 责任险产品的玩家。Vouch 和
              Embroker 在初创聚焦和即时报价上匹配，但以经纪商运营，没有承保控制权。Coalition 在网络风险管理深度上领先，但不提供初创组合包或 D&O/EPLI。Next Insurance（ERGO
              NEXT）在原始客户量上领先，但属于通用 SMB，不专门服务 VC 支持的科技公司。在位承保商（Chubb、Hartford、Progressive）是全栈承保商，保障广度很深，但缺少种子 /
              早期阶段的初创专业化和即时出单能力。对 Corgi 核心细分最关键的差异点是：（1）AI
              责任险，目前没有竞争者以独立保单清晰覆盖模型错误、幻觉和偏见理赔；（2）把保障映射到融资里程碑的初创阶段模块化打包，这是其他保险公司没有复制的产品设计；（3）全栈承保商结构，让 Corgi
              能保留经纪商必须让给外部承保商的承保利润。不过，标准险种（CGL、D&O、Tech E&O、Cyber）的功能在数字保险科技 同行之间大体可比。Corgi
              在标准险种上的竞争优势越来越依赖定价和速度，而不是产品独特性；随着竞争者用类似 AI 工具提升承保能力，趋同风险随之上升。
