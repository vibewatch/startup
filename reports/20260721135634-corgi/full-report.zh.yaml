      - number: '2.5'
        title: 采用约束与市场逆风
        blocks:
          - type: paragraph
            body: >
              尽管驱动因素有利，几项结构性约束限制了 Corgi 市场渗透的速度和天花板。


              TRRG 结构是最重要的监管约束。风险自留集团可豁免许多州保险法律，也没有州担保基金保护。这会限制 Corgi 服务某些买方：这些买方的采购要求会强制保单来自准入承保商（admitted carrier）或 AM
              Best 标尺上的 A 级承保商。大型企业买方和受监管行业（银行、医疗、政府合同）常在供应商保险要求中指定准入承保商（admitted carrier） 身份，而 Corgi 的 TRRG
              结构无法提供这一点。这是真实存在的企业市场天花板。


              Cyber 费率下行是一把双刃剑。较低费率让 Corgi 更具竞争力，但也压缩单张保单保费，需要更高销量才能维持 ARR 增长。Beinsure/Marsh 综合费率数据显示，Cyber 费率在 2025 年
              Q4 下降 5%；这既是获客顺风，也是 Cyber 险种承保利润率的逆风。


              地理集中在美国，限制了总可用市场。Corgi 不适用于国际运营；大量在 Delaware 注册但有国际业务的公司（尤其是在美国注册的非洲、欧洲和亚太初创公司）无法把 Corgi 保障完整用于非美国运营。


              商业保险的切换成本低于其他金融服务产品：多数保单按年签，依靠经纪的竞争者可以在没有 IT 集成成本的情况下替换。这意味着留存高度依赖理赔服务质量和定价，而不是技术锁定。Corgi 声称流失率低于
              1%，这是重要的反向信号，但该说法来自公司自述，未经独立验证。


              保险业理赔周期很长，优越的承保经济性可能要 3–5 年才会被市场看见。Corgi 的承保牌照始于 2025 年 7 月；赔付率最早也要到 2027 年才具备有意义的可解释性。
