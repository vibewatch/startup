  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、定义与背景
        blocks:
          - type: paragraph
            body: >
              Corgi 的相关市场有三层嵌套。最宽口径是全球财产与意外险（P&C）行业；按总保费计，这是一个 $1T+ 市场，Corgi 自己的关于页面引用了这一点，Federal Insurance
              Office（FIO）2025 Annual Report 也从侧面印证，美国 P&C 板块是全球最大市场之一。这个头部数字适合做叙事框架，但不能作为 Corgi 近期经营的有效市场规模约束。


              中间口径下，Corgi 竞争的是美国中小企业商业保险市场，尤其是科技初创公司和 VC 支持公司细分。这是 Corgi 产品组合最直接适用的领域：企业合同和投资条款清单通常要求 CGL、D&O、Tech
              E&O、Cyber 和 EPLI 等险种到位，资金才会流动。FIO 2025 Annual Report 确认了美国 P&C 行业保费基数；NAIC 行业快照数据提供法定报表基线，用来锚定承保商层面的市场规模。


              最可触达口径下，Corgi 竞争的是保险科技细分——面向高增长企业的数字优先商业保险。Startupsunion 估计，2026 年更广义的保险科技 市场约 $50
              billion。这个估计覆盖所有商业险种中的数字分销和承保平台，并不只包括面向初创公司的保障。Corgi 当前覆盖面——截至 2026 年 1 月，40,000 名初创客户、平均年保费约
              $1,000——只是这个空间中狭窄但快速增长的一片。


              市场边界直接影响估值。Corgi 宣称要从底层重建 $1T+ 全球保险业，但其当前产品组合和承保牌照，把近期渗透限制在美国商业险种之内，而且是通过风险自留集团结构、覆盖 49 个州。国际业务和个人险种明确不属于
              Corgi 当前市场。
