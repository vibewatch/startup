            title: 承保运营不足 12 个月即有 40,000 名客户，牵引力异常
            body: >-
              若 Corgi 报告的数字方向准确，公司作为新持牌初创承保机构，已经实现了异常快速的客户采用。40,000+ 名活跃客户、$40M+ ARR 和每客户年均收入约 $1,000
              的组合，指向一个面向初创公司合规节点、效率很高的高量分销引擎。主要提醒是，这三个数字仍由管理层披露，而非外部审计。
