  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与保费流
        blocks:
          - type: paragraph
            body: >-
              Corgi 的收入模型与保险科技经纪商有结构性差异：Corgi 是全栈承保机构，承保利润留在自己体系内。客户支付保费后，保费进入 Technology Risk Retention Group, Inc.
              (TRRG)，即 Corgi 的承保实体。扣除赔款、再保险成本和运营费用后，净承保结果归 Corgi 集团，而不是外部承保机构。这种承保机构经济模型意味着，只要综合成本率处于盈利区间，Corgi
              就能在已赚保费与已发生赔款加运营费用之间留下价差，经纪商无法复制。主要收入流来自保险保费，覆盖组合包括 CGL、D&O、Tech E&O、Cyber、EPLI、AI
              Liability、Fiduciary、Workers Compensation、BOP、Commercial Umbrella，以及 Real Estate E&O、Lawyer E&O、Non-Profit
              D&O 等专门险种。产品按年度保单定价，出单时根据 AI 原生承保评估确定保费，风险因素包括公司阶段、收入、员工数、产品类型和司法辖区。Corgi 面向初创阶段的模块化打包天然带来增购路径：一家 pre-seed
              公司每年花 $500–$2,000 购买 CGL 和 Tech E&O，完成 Series A 后可能升级为 $10,000–$25,000 的 D&O 加全套组合客户。公司披露截至 2025 年 12 月
              ARR 超过 $40M、活跃客户超过 40,000 名，隐含客户平均收入（ARPC）约每年 $1,000。承保机构模型下的毛利率高度取决于赔付率和费用率（合称综合成本率），Corgi 尚未公开披露。公司从
              2024 年中约 $1.2M 收入增长到 15 个月后的 $40M+ ARR，约增长 33 倍——这一轨迹符合其在 YC 生态里快速渗透市场。
