      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Corgi 要求市场信任一家非常年轻的承保机构，用高度依赖 AI
              的流程承保并服务复杂责任险产品，而公开理赔历史很少。小而干净的早期队列里，这种组合可管理；一旦保单量、产品宽度和赔付复杂度上升，难度就会加大。公司没有公开披露赔付率、综合成本率、理赔争议指标、正常运行时间、安全认证或事故历史，投资者和保单持有人只能从增长推断成熟度，而不是依赖保险中通常更重要的运营指标。D&O
              和 Cyber 等长尾险种风险尤其尖锐，因为理赔可能在承保决定多年后才出现；AI Liability 的底层风险集合足够新，也没有持久精算历史。人员风险进一步放大运营问题。相对于 40,000+ 名客户和 15+
              个产品足迹，Corgi 约 70 名员工显得精简；创始人集中度也极端，因为 Nico Laqua 同时承担 CEO 和 CTO
              职责，两名创始人团队似乎同时扛着战略、产品、融资和文化。公开评价中提到一周七天工作和住在办公室的强度，这本身并不致命，但确实带来可信的留才和倦怠担忧。运营层面的结论是，Corgi
              可能很高效，但效率和韧性还不是一回事。
