      - number: '4.3'
        title: 单位经济模型与效率指标
        blocks:
          - type: paragraph
            body: >-
              Corgi 公开披露的单位经济模型只限于三项公司口径指标：客户平均收入约每年 $1,000（由 $40M+ ARR / 40,000 名客户推算）、年客户流失率低于 1%（公司声称，未经审计），以及 CEO 在
              2026 年 4 月关于盈利的表述。公司没有公开披露 CAC、回本周期、毛利率、综合成本率或赔付率。若准确，低于 1% 的年流失率在商业保险中非常罕见，意味着相对于 CAC 的 LTV 极高——假设收入不变，1%
              流失率隐含 LTV 为 ARPC 的 100 倍，按当前 ARPC 约为每客户 $100,000。不过，商业保险组合早期通常会低估流失率，因为多数投保人还没有经历续保事件；真实留存率只有在组合成熟 24–36
              个月后才可验证。YC 网络作为主要分销渠道，暗示 CAC 可能较低（合作伙伴推荐而非付费获客），但公司尚未用数字确认。AI 原生理赔处理的覆盖成本可能低于传统承保机构成本结构，但 Corgi
              没有披露每份保单员工数、自动化率或赔案频率 / 严重度数据。全栈承保机构模型意味着 Corgi 承担完整保险风险；与经纪商不同，其经济模型包含赔付发展中的精算不确定性，尤其是 D&O 和 Cyber
              等有多年发展尾部的险种。若赔付率恶化（例如出现一波 AI Liability 赔案），在没有外部承保牌照缓冲时，盈利能力可能被显著削弱。
