      - number: '2.4'
        title: 增长驱动因素与市场顺风
        blocks:
          - type: paragraph
            body: >
              未来 2–5 年，五个结构性驱动支撑 Corgi 的市场机会。第一，VC 支持初创公司的扩张，持续扩大了需要初创保险组合的买方基数。仅 YC 每个批次就资助数百家公司，YC 校友网络覆盖数十万家公司，是
              Corgi 的主要渠道。机构投资者已把保险要求标准化写进投资条款清单，创立后 24 个月内需要 D&O 保障的公司数量也随之增加。


              第二，网络风险是主要增长驱动。尽管费率下降（按 Beinsure/Marsh 数据，2025 年 Q4 下降 5%），网络理赔量仍高——Beinsure 指出，在所审视期间网络理赔超过 2,000 起——而 AI
              驱动的攻击面还在扩张。NAIC 保险行业快照确认，Cyber 仍是快速增长的保障线。相比缺少初创公司特定攻击面数据的传统承保商，Corgi 的 AI 承保栈更适合为科技初创公司的网络风险精确定价。


              第三，AI 责任险是竞争有限的新产品品类。LLM 驱动产品扩散后，传统保险公司正在主动把 AI 错误从 E&O 保单中剔除。用 AI 智能体替代人工工作流的公司面临保障缺口，Corgi 明确填补了这个缺口。FIO
              2025 Annual Report 指出，新兴技术风险正在金融和专业险种中创造新的保障需求。


              第四，市场稳定给新进入者创造了有利条件。Lockton 2026 季度市场更新称，美国商业保险市场正进入「更稳定阶段」，对可理解、可控制的风险给出有竞争力的费率。价格波动降低后，大型在位承保商的优势被削弱，也给
              AI 原生承保商留出空间，让它们靠速度、准确性和体验竞争，而不是只拼再保险容量。


              第五，B2B SaaS 和 API 型商业模式加速采用，扩大了 Tech E&O 与 Cyber 的风险暴露基数。更多构建 AI 产品的初创公司需要为软件故障和数据泄露获得明确保障，这一细分增长方向上利好具备
              AI 专门承保能力的专业承保商。
