      - number: '5.3'
        title: 产品线组合与按阶段打包
        blocks:
          - type: paragraph
            body: >
              作为早期保险公司，Corgi 的产品组合刻意做得很宽，因为公司卖的不是单一保单类型，而是一套初创公司生命周期保险系统。产品页和首页合起来显示的菜单超过 15 条险种；按公开提及，具名产品接近 19
              个。核心险种包括 Cyber、D&O、Tech E&O 和 General Liability，邻近险种包括 EPLI、Fiduciary、Media Liability、Workers
              Compensation、HNOA、Commercial Umbrella、R&W 和 AI Liability。Lawyer E&O、Real Estate E&O、Non-Profit
              D&O、K&R、Medical Malpractice、Crime 和 BOP 等专门扩展进一步拓宽保障地图。

              打包方式围绕初创公司里程碑，而不是传统保险分类法。Pre-Seed 组合以 CGL、D&O、Tech E&O 和 Cyber 支撑首个合同与首份租约所需保障。企业尽调、招聘和公开传播风险上升后，Series A
              加入 Media Liability 和 EPLI。员工福利计划出现后，Growth 增加 Fiduciary Liability。Custom 路径为风险画像特殊的公司保留模块化。AI Liability
              是最突出的战略产品，因为它明确针对幻觉、偏见和训练数据争议等传统条款常常排除或语义模糊的风险。与 Series B 同时宣布的卡车运输扩张也显示 Corgi
              在软件初创公司之外测试邻近领域，不过这一垂直的成熟度和验证度似乎都早于核心初创公司组合。
