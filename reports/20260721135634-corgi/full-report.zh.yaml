      - number: '2.6'
        title: AI 责任险作为新兴市场品类
        blocks:
          - type: paragraph
            body: >
              截至运行日期，AI 责任险是一个实质上全新的保险产品品类，还没有成熟的市场规模或损失成本数据。传统 Tech E&O 保单正越来越多地把 AI
              特定风险排除在外，包括大语言模型幻觉、自主智能体行为和算法偏见导致的错误；保险公司仍难以为 AI 生成输出中的尾部风险定价。


              Corgi 的 AI 责任险目前是少数明确覆盖 AI 模型错误、幻觉和偏见造成财务损失的商业保险产品之一。按 Corgi 的 AI 行业页面描述，该产品面向正在规模化 AI
              产品的公司；当模型输出给客户或第三方造成下游财务损害时，这些公司会面对责任暴露。


              AI 责任险市场由监管不确定性（EU AI Act、美国联邦层面对 AI 责任的讨论）和企业买方要求共同驱动：受监管买方的采购团队开始在与 AI 原生供应商签约前要求 AI 特定保障。FIO 2025
              Annual Report 承认，新兴技术风险正在创造新保障需求，而传统保险分类体系原本并不是为这类需求设计的。


              从规模角度看，AI 责任险细分太早，还无法用公开数据做自下而上测算。不过可用代理指标估算：如果 Corgi 当前 40,000 名客户中哪怕只有 10% 主要是 AI 公司，并为 AI 责任险支付
              $5,000–$15,000 保费，当前细分贡献的潜在保费就是 $20–60M——接近 Corgi 目前总 ARR。考虑到企业软件中 AI
              采用速度，长期市场潜力可能很大；但早期市场的损失经验将决定当前保费率是否足够。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
