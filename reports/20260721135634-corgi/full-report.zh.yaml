      - number: '3.6'
        title: 护城河、锁定效应与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              Corgi 的竞争耐久性来自几类护城河，但韧性不一。全栈承保商结构具备中等耐久性：Corgi 花约 $35 million 收购持牌承保实体并取得 TRRG
              授权，对缺少资金的保险科技公司形成有意义的资本门槛。不过，这条护城河并不排他：在位者（Chubb、Hartford）已经拥有完整承保牌照，只需发展分销和 AI 工具；Vouch 或 Embroker 如果选择复制
              Corgi 模式，理论上也可以收购承保商实体。AI 原生承保护城河风险较高：大语言模型逐渐变成商品化基础设施后，竞争者无需自有训练数据，也能以可比成本复制基于 AI 的承保。Coalition 和 Cowbell
              已经把 AI 用于网络险定价。YC 网络分销渠道带来强早发优势，但并不独占——任何保险公司都可以与 YC 合作，或在加速器生态中培养存在感。Corgi 的 AI
              责任险是近期最可防守的护城河：没有竞争者公开提供独立 AI 责任险保单，而 Corgi 从 AI
              公司投保人中积累的理赔经验，会在竞争者进入前形成精算数据。商业保险中的客户切换成本中等：保单按年，保险凭证可转移，经纪记录变更也是标准流程。不过，与股权结构表平台、律师事务所转介和云市场上架的整合，形成嵌入式分销，提高了细分层面的有效切换成本。风险侧，近期最尖锐的竞争威胁是成熟网络保险公司（Coalition、Chubb）在既有
              Cyber 保单中加入 AI 附加条款，在 Corgi 实现有意义的 AI 公司投保人规模前削弱其独立 AI 责任险价值。TRRG 结构还意味着 Corgi
              无法获得州担保基金支持；风险厌恶买方把它与承保商背书的替代方案比较时，这一点可能成为劣势。
