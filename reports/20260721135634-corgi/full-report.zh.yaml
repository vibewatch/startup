      - number: '1.5'
        title: 市场进入、里程碑与反向信号
        blocks:
          - type: paragraph
            body: >
              Corgi 的主要获客渠道是 YC 网络。创业公司在关闭融资轮或签署企业合同时，保险需求最强，YC 网络让 Corgi 能直接触达这个时点的初创生态。公司还借助律师事务所、股权结构表管理平台和云市场合作，并通过
              API 集成扩大触达。复杂保障需求可以选择人工经纪人，给需要指导而不是纯自助的创始人保留选择权。


              最显眼的市场进入动作是 Corgi Café：这家 24 小时咖啡馆于 2026 年 2 月开在 San Francisco 金融区 9 Claude
              Lane，位于公司办公室楼下的一层。Startupsunion 将其类比为 Capital One Café——一个实体品牌社区触点，让创始人在低压力场景里接触 Corgi 品牌。2026 年 3 月，Corgi
              收购 corgi.com 域名，整合线上存在，并释放长期品牌投入信号。


              需要带入后续尽调的关键反向信号：（1）TRRG 结构意味着投保人没有州担保基金保护。（2）承保牌照到 2025 年 7 月才获批，理赔解决记录非常有限。（3）公司未披露公开赔付率。（4）Nubia
              Magazine 独立记录了文化担忧——七天工作制、办公室居住。（5）22 天内估值从 $1.3B 跳到 $2.6B，即便放在 2026 年 AI 融资公告中也是离群值，需要更深入分析倍数扩张。（6）ARR
              和客户数来自公司自述，未经审计。
