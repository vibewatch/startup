      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Corgi
              的核心买方，是负责完成融资、签署企业合同或满足房东要求的创始人或早期员工——这些时点上，保险不再是可选采购，而是会卡住交易的约束。这个购买触发点很重要：它制造紧迫性，也降低价格弹性，因为延迟的机会成本（一笔交易被挡住、一轮融资受威胁）比保费高出几个数量级。


              Corgi 发布的初创保险成本指南按融资阶段划分了三个买方群体，各自保障要求和预算结构不同。Pre-Seed 和 Seed 阶段买方通常每年花 $2,000–$4,000 购买核心 CGL + Tech E&O
              + Cyber 组合。Series A 买方的年支出升至 $10,000–$25,000+，因为 D&O 和 EPLI 对董事会构成和企业签约变成刚需。Growth 阶段买方（Series B+）每年支出
              $30,000–$100,000+，需要受托责任险、更高限额伞式保障和专业险种。


              付款方通常是公司，而不是创始人个人。早期阶段预算负责人是 CEO 或
              CFO；增长阶段则会出现采购或风险管理角色。渠道合作伙伴——VC、律师事务所、股权结构表平台——在采用路径中作用很大，因为它们会在最紧迫的时点引入保险要求：签署 term
              sheet、董事加入或企业合同谈判。Corgi 与 YC 生态整合，因此获得结构性优势。


              AI 公司子领域是一类正在出现、需求不同的买方。构建 AI 产品的公司会面对模型错误、幻觉和偏见带来的独特责任风险，而传统 Tech E&O 保单正越来越多地排除这类风险。Corgi 的 AI
              责任险直接瞄准这类买方。inszone 的卡车运输市场数据和 amwins 运输展望也确认，卡车运输是 Corgi 正在主动进入的第二个买方细分。
