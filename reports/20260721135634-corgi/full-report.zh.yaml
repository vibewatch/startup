      - number: '6.3'
        title: 具名客户证明与案例研究
        blocks:
          - type: paragraph
            body: >
              Corgi 最强的客户证明资产是具名案例研究，这些案例反复把产品塑造成创始人在遇到保险硬性要求时的速度和适配解决方案。Artisan 是最清晰的经济证明点：公司称它从传统经纪商切换过来，节省约
              30%，并在两天内出单，从而满足银行相关企业要求。Eragon 的案例聚焦采购速度，创始人描述了从数周保险清单难题到数日成交的变化。Sorcerer
              展示了投资逻辑的另一面：并非每家初创公司都适合通用软件承保，硬件相关或气候邻近业务可能更看重愿意定制保障、而不是强套标准模板的承保机构。Intryc 和 Imagine AI
              进一步强化接入速度，包括近乎即时的报价、数字化文件和面向创始人的支持体验。

              限制不在于缺少具名客户标识，而在于证据独立性。几乎所有一手客户证明都来自 Corgi 自己筛选的客户页面，公司选择引语、案例和叙事框架。所给来源集中，唯一独立性更高的具名客户旁证是 TechCrunch 提到
              Deel 是客户。这有帮助，因为 Deel
              是可信且可识别的企业软件客户标识，但文章没有说明保单范围、保费规模或续保历史。总体看，案例研究对产品市场契合度有方向性说服力，但还达不到后期尽调理想需要的独立、组合级客户验证。
