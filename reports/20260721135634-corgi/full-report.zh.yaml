      - number: '3.2'
        title: 直接保险科技竞争者——Vouch 与 Embroker
        blocks:
          - type: paragraph
            body: >-
              Vouch Insurance 是 Corgi 最接近的直接竞争者，服务 6,000+ 家科技、医疗和专业服务公司。Vouch 以保险经纪商身份运营，把保单放到外部承保商，而不是在自有资产负债表上承保风险。它在
              2023 年 9 月完成 $90 million Series C，累计融资约 $160 million。Vouch 的初创保险平台覆盖 CGL、D&O、Tech E&O、Cyber、EPLI
              和其他核心险种，提供数字优先界面，并为复杂保障配人工顾问。其「Ambition Insured」品牌和贴近 YC 的客户基础，与 Corgi 目标细分高度相似。与 Corgi 的关键结构差异在于，Vouch
              依赖外部承保载体：当外部承保商退出某个险种或重新定价，Vouch 必须重新谈判或寻找替代。Corgi 的内部承保实体（TRRG）消除了这项依赖，也让定价控制更紧。Embroker 是一家数字经纪商，服务
              9,500+ 家企业，跨多个行业管理 16,000+ 张保单。Embroker 创立已超过十年，于 2021 年完成约 $100 million Series C，组合数字报价和人工顾问层。Embroker
              的初创保险产品覆盖与 Corgi 相似的险种，但不提供按初创阶段模块化打包，也没有 AI 责任险。它行业覆盖更宽（并非只服务初创 / 科技），削弱了产品专业化程度。Vouch 和 Embroker 都有 4.5+
              星顾问评分，并在创始人群体中有强品牌认知，对 YC / 加速器生态中的获客构成有意义竞争。Corgi 的 Corgi vs. Vouch
              对比页面主张，全栈模式能提供更快出单、更灵活承保，以及更适合初创特定风险的经济性。
