      - number: '4.6'
        title: 财务缺口与尽调结论
        blocks:
          - type: paragraph
            body: >-
              对投资级尽调而言，Corgi 的财务图景明显不完整。最关键缺失指标包括：赔付率和综合成本率（承保机构基本健康度指标）、毛利率（对保险公司而言，是再保险后赔付率的反面）、按产品线拆分的赔案频率和严重度、D&O 和
              Cyber 准备金充足性（考虑多年发展尾部）、经审计财报或任何 GAAP / 法定财务报表、现金状况和烧钱速度，以及 CAC 和回本周期。若进入完整尽调数据室，其中几项可能只有在 NDA 下才能取得。积极指标包括
              ARR 快速增长（约 15 个月从 $1.2M 到 $40M+）、CEO 的 2026 年 4 月盈利说法、低于 1% 的流失率（公司口径）、2025 年 7 月取得完整承保牌照、机构投资者累计提供 $378M
              融资，以及三轮连续融资确认的估值（市场验证）。风险指标包括：估值倍数快速扩张（约 5 个月从 $630M 到 $2.6B）、未经审计的财务说法、客户获取集中在 YC 生态、缺少任何公开赔付经验数据，以及 TRRG
              结构在风险厌恶买方群体中相对标准持牌承保机构的潜在劣势。总体财务结论是：Corgi 展现出异常强的收入增长和有前景的牵引力，但在形成高置信度财务投资逻辑前，仍需完整数据室审查法定财报、准备金充足性、赔付发展三角和
              CAC 数据。
            claimRefs: []
