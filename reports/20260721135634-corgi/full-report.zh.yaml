      - number: '8.5'
        title: 风险调整后回报、价值创造杠杆与建议
        blocks:
          - type: paragraph
            body: >-
              投资建议的关键，不在于 Corgi 是否优秀——它显然优秀——而在于新投资人是否因承保主体模式仍未解决的风险获得足够补偿。最重要的价值驱动因素已经清楚：ARR 快速增长、与初创市场高度契合、看起来有效的 YC
              获客飞轮、广泛的牌照进展，以及围绕 AI 承保和 AI Liability
              的产品叙事，投资人认为它能定义品类。故事里有几部分已经部分去风险，尤其是品牌、投资人质量和真实需求的存在。尚未去风险的是承保引擎本身。没有公开的综合成本率、准备金方法、再保险安排或精算发展数据，市场等于被要求用软件倍数接受保险风险。这个下注可以成立，但前提是投资人能在尽调材料中验证下行保护，并且仓位大小反映不对称性。在
              $2.6B 估值下，风险调整后回报不支持重仓；更合适的是基于信念的选择性入场，仓位按可承受亏损设计，并用 ARR
              增长、法定盈余、分险种赔付率，以及任何渠道集中或理赔恶化迹象设定清晰监控触发器。正确立场是有条件看多：如果私下尽调证实承保经济性，可以作为受监控仓位进入；但仅凭公开证据，它不是有宽安全边际的投资。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV037
              - CV041
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV037
              - CV044
          - type: figure
            figureRef: FV005
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV035
      - number: '8.6'
        title: 图表附录
        blocks:
          - type: callout
            title: 65x ARR 下，Corgi 必须零失误执行，Series B1 入场才能回本
            body: >-
              2026 年 5 月 Series B1 的价格几乎不容许普通执行失误。按公司自称 ARR 约 65x 计算，投资人承销的不只是持续增长，还包括 Corgi
              快速证明其全栈承保主体模式能在扩展到新产品和新地区时维持有吸引力的赔付率。概率加权情景模型几乎正好落在 $2.6B
              入场价值上，意味着下行情景不只是压低上行，而是会迅速吃掉本金。因此，最新一轮应被理解为高信念、低安全边际的入场，而不是明显便宜的增长资产。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV022
          - type: callout
            title: Next Insurance 可比样本有启发，也容易误导——Corgi 的定价对应的是 Next 在同等成熟度时未达到的未来
            body: >-
              最吸睛的可比样本是 ERGO 以约 $2.6B 收购 Next Insurance，因为这个价格与 Corgi 当前名义 估值相同。但这个比较更多抬高了 Corgi，而不是验证了它。Next
              达到该价格时经营记录更长、保费基数明显更大；Coalition 和更广泛行业基准仍指向远低于 Corgi 65x ARR 框架的估值倍数。结论不是 Corgi
              定价天然错误，而是投资人今天在为一种未来状态付费：规模、承保质量和退出可选性，而这些是同行花更长时间才挣来的。
            calloutType: insight
            claimRefs:
              - CV011
              - CV012
              - CV036
          - type: callout
            title: 有条件看多的投资逻辑可以成立：承保经济性在结构上有吸引力，但需要 2 年以上综合成本率证据验证
            body: >-
              Corgi 在入场倍数拉伸的情况下仍具备可投性，原因是结构而不是证据：如果一家 AI 原生全栈承保主体确实能低成本获客、承保做得好、准备金提得保守，它就可能比经纪渠道驱动的保险科技
              同行更值钱。投资人目前缺的是证明。纪律严明的买方应把投资逻辑视为有条件成立：需要法定报表、再保险安排，以及至少多年、分险种的理赔记录，证明综合成本率低于
              100%，且准备金发展充足。在这些证据出现之前，当前估值是一笔面向未来的押注，不是已坐实的事实。
            calloutType: insight
            claimRefs:
              - CV037
              - CV044
              - CV028
