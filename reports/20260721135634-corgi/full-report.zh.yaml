      - number: '1.3'
        title: 融资历史与估值演进
        blocks:
          - type: paragraph
            body: >
              Corgi 的资本轨迹是近年保险科技领域最快的一批。公司在 2026 年 1 月至 5 月约五个月窗口内完成三轮独立融资，每轮估值都显著上台阶。


              2026 年 1 月，Corgi 宣布合并 Seed 与 Series A，共融资 $108 million，估值 $630 million。该轮由 Kindred Ventures 领投，Y
              Combinator、Contrary、Oliver Jung、Glade Brook Capital Partners、Seven Stars、Leblon Capital、Phosphor
              Capital、Fellows Fund、Alumni Ventures、Quadri Ventures、Vocal Ventures 和 SV Angel
              参投。公告与公司获批作为全栈承保商运营同步发布，也是公司首次公开披露；Nubia Magazine 称，此前经历了 18 个月监管流程，并以约 $35M 收购了一家有数十年历史的持牌承保商。


              2026 年 5 月 6 日，Corgi 完成 $160 million Series B，估值 $1.3 billion，由 TCV 领投，Oliver Jung、Leblon Capital、Kindred
              Ventures、Repeat VC、Zone 2 Ventures、Audeo Ventures、Quadri Ventures、First Order Fund、Vocal Ventures、Maiora
              Ventures、Nordstar、Seven Stars Ventures、Hexa Capital、Alpha Square Group、GSBackers、OurCrowd、Alumni Ventures
              和 Global Growth Fund 参投。累计融资由此超过 $268 million。


              仅 22 天后，2026 年 5 月 28 日，Corgi 又宣布 $106 million Series B1，估值 $2.6 billion，仍由 TCV 领投，Prime Capital、Zone 2
              Ventures、Oliver Jung、Leblon Capital、Kindred Ventures、Quadri Ventures、First Order Fund、Vocal
              Ventures、Nordstar、GSBackers、Repeat Ventures 和 8188 Capital 参投。累计融资达到 $378 million。CEO Nico Laqua 称，公司在
              2026 年 4 月（也就是前一个月）已实现盈利。估值三周内从 $1.3B 翻倍到 $2.6B，是一个异常数据点；后续章节需要从可持续性和可比市场倍数角度检验。
