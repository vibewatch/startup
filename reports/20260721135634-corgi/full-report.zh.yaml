      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              Corgi 最宽相关宇宙——全球 P&C 商业保险——对应的总可用市场（TAM）每年超过 $1 trillion。不过，这个数字包含个人汽车险、房主险、工伤赔偿险和大型企业特殊险种；Corgi
              当前既不瞄准这些市场，也不能通过风险自留集团结构给它们定价。若用这个口径锚定估值倍数，会显著高估近期机会。


              更可辩护的可服务市场（SAM）是美国中小企业商业保险市场，尤其是科技和初创公司子领域。FIO 2025 Annual Report 显示，按 2024 年行业数据，美国 P&C 直接承保保费总额约 $1.1
              trillion。商业险种约占其中 40–50%，对应美国商业险 TAM 约 $440–550B 每年。在商业险内部，中小型科技初创公司细分明显更小。Beinsure 对美国保险费率数据的分析（来源于 Marsh
              综合费率指数）显示，金融和专业险种（包括 D&O、E&O 和 Cyber）只是商业保费的一部分，其中 Cyber 在 2025 年 Q4 下降 5%，D&O 下降 5%。


              对 Corgi 可服务市场做保守自下而上估算，可以锚定需要商业保险的 VC 支持初创公司：任一时点美国约有 50,000–80,000 家活跃 VC 支持公司（由 PitchBook 和 NVCA
              生态数据推断），按融资阶段不同，平均年保费 $3,000–$10,000，对应仅初创公司商业保险 SAM 约 $150M 到 $800M。不过，Corgi 宣称要扩张到卡车运输、小企业和其他商业细分，这会显著拓宽
              SAM：仅美国商业汽车险市场（包括卡车运输）就是整体商业险中的重要部分，Lockton 2026 季度更新称商业保险市场正进入更稳定阶段，管理良好的风险可获得有竞争力的费率。


              2026 年可获取市场（SOM）最好用 Corgi 自己公开披露的牵引来近似：$40M ARR 和 40,000 名客户。这意味着当前对最宽美国商业险市场的渗透约为
              0.1%；如果保守规模估算正确，则对目标初创保险 SAM 的渗透约为 50–80%。初创公司 SAM 的规模缺口，是估值章节最重要的证据缺口。
