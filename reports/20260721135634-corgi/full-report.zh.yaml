      - number: '1.2'
        title: 创始人、领导层与组织文化
        blocks:
          - type: paragraph
            body: >
              Corgi 由 Nico Laqua 和 Emily Yuan 于 2024 年创立。两位创始人都完成了 Y Combinator 2024 年夏季批次，公司因此很早就接入了全球最密集的 VC
              支持初创公司网络之一——这也是它的主要获客渠道。


              Nico Laqua 担任 CEO 和 CTO。他是连续创业者：创办 Corgi 之前，他打造了游戏发行商 Basket，月活用户超过 200 million。Laqua 将自己对保险的兴趣追溯到父亲在 USAA
              做律师的经历；ChatGPT 3.5 发布后，他把保险识别为最适合 LLM 改造的行业之一，并称其为「世界上最大的以文字为核心的行业」。他同时担任 CEO 和
              CTO，强化了公司的工程优先身份，也形成了有意义的关键人集中风险。


              Emily Yuan 担任 COO 和联合创始人。她在 Stanford 大三退学，并入选 2024 年 Forbes 30 Under 30。The Next Web 称，她在联合创办 Corgi 前曾任
              OpenAI 产品经理；这段背景很可能影响了公司 AI 优先的产品架构。Yuan 是 Corgi 合作伙伴和品牌项目的公开代表，包括 Corgi Café。


              按 YC 页面，公司团队约 70 人。创始人公开确认实行高强度七天工作制；据 Nubia Magazine 评测报道，多名员工据称住在公司位于 9 Claude Lane
              的办公室，办公室所在地带有住宅分区属性。Nubia
              采访的创始人反应不一：有些人觉得这种文化有吸引力，另一些人则认为，把自身风险栈中的关键部分交给这家供应商时，这会成为实质担忧。这样的文化强度符合超高速增长初创公司的常态，但如果公司员工数大幅扩张，仍需持续跟踪。
