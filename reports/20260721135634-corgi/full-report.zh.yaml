      - number: '8.2'
        title: 可比公司与先例交易
        blocks:
          - type: paragraph
            body: >-
              可比分析显示 Corgi 当前价格有多特殊。最干净的直接锚点就是 Corgi 自己：2026 年 5 月 6 日的 Series B，在公司自称 $40M ARR 基础上给出 $1.3B 估值；2026 年 5
              月 28 日的 Series B1 给到 $2.6B，隐含倍数在 22 天内从 32.5x 翻到 65.0x。即使在偏好增长的融资市场，这也不正常。看 Corgi 之外，最接近的战略交易是 ERGO 2025
              年以约 $2.6B 收购 Next Insurance。Next 成熟度明显更高，保费基数大得多，承保记录也更长；所以同样的 名义估值有参考意义，但按风险调整后并不支持 Corgi 的入场价格。Coalition
              在约 $500M GWP 上拿到 $5.0B 私募估值，Cowbell、Pie、Vouch、Embroker 的融资历史也说明，投资人愿意为全栈或差异化保险科技承保主体支付较高溢价，但行业基准倍数仍明显低于
              Corgi 当前以 ARR 讲故事的框架。换句话说，可比公司能解释为什么高倍数可能存在，不能解释为什么 65x 就算保守。先例证据支持这样一种看法：市场把 Corgi 当作 AI
              原生品类领导者，并把最好年份放在未来；但仅凭当前公开指标，还不能证明最新一轮价格合理。
            claimRefs:
              - CV001
