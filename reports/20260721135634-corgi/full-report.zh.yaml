      - number: '6.2'
        title: 采用轨迹与增长指标
        blocks:
          - type: paragraph
            body: >
              头部采用数据很醒目：Corgi 在 2026 年 1 月发布材料中报告 40,000+ 名活跃客户和 $40M+ ARR，当时距离 TRRG
              成为运营中承保机构只有数月。若按字面理解，这意味着它完成了初创公司保险史上最快的早期客户爬坡之一。支撑性算术至少方向一致。用 $40M ARR 除以 40,000 名客户，得到每客户年均收入约
              $1,000，符合公司围绕早期初创公司购买基础商业保险组合的定位，而不是大型、数百万美元级企业项目。围绕 1 月融资和 5 月追加融资的公开报道，也支持 Corgi 在 2025
              年快速扩张、而非只在发布时放量的叙事。

              不过，证据质量仍然混杂。客户数、ARR
              和流失率都来自公司口径，并通过新闻材料出现，不是经审计文件或贷款级数据室。没有公开来源独立核实“客户”是指独立企业、已出单保单，还是包含每家公司多份保单的更宽账户定义。同样，ARR、队列留存或出单转化都没有披露第三方审计。增长故事因此可信且内部一致，但投资者应把它视为管理层披露的牵引力，而非完全验证的运营数据集。
