            title: 估值 22 天内从 $1.3B 升至 $2.6B——扩张极快
            body: >-
              Corgi 的估值在 22 天内从 $1.3B（Series B，2026 年 5 月 6 日）翻倍至 $2.6B（Series B1，2026 年 5 月 28
              日）。即使对高增长保险科技公司而言，这一速度也不寻常，反映出投资人对当前增长轨迹需求强劲。风险在于，这种倍数扩张嵌入了增长延续、利润率改善和市场扩张假设，而这些假设可能无法兑现。若 ARR
              增长放缓、赔付率恶化，或 AI Liability 产品遭遇反向赔案，估值倍数可能快速压缩。尽调应建模下行情景：增长只有当前轨迹的 50%，综合成本率为 105%，而不是低于 100%。
