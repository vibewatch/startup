  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Corgi 最重要的法律和监管风险来自承保实体本身：它是在 Liability Risk Retention Act
              框架下运营的风险留存集团，而不是传统核准承保机构结构。这种结构有利于速度和全国触达，因为它允许跨州承保责任险，减少逐州摩擦；但它也把一部分风险实质转移给客户。TRRG
              的保单持有人拿不到标准核准承保机构通常提供的破产州担保基金保护，因此承保机构信用风险远比品牌包装或获客速度重要。Corgi 的 California
              生产者牌照、广泛辖区覆盖和未见已知执法行动都是建设性信号，但它们不能改变承保牌照直到 2025 年 7 月才生效、公开运营历史不足一年的事实。公司的 AI 原生定位进一步抬高监管风险。AI 承保和 AI
              Liability 保障处在演进中的法律边界内，受 FTC 隐私预期、联邦层面对自动化决策系统的更广泛关切，以及监管机构未来可能要求更多可解释性、反向结果监控或模型治理披露的影响。因此，公开证据支持 Corgi
              今天在法律上可以运营，但剩余敞口仍高：法律结构有意给保单持有人更少兜底，未来规则制定也可能迫使控制升级或产品范围收窄。
