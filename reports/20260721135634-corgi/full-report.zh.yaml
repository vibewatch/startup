      - number: '1.4'
        title: 收入牵引、客户规模与产品组合
        blocks:
          - type: paragraph
            body: >
              Corgi 的收入轨迹，是少数能从公开信息侧面支撑估值叙事的数据点之一。公司报告 2024 年中收入为 $1.2 million——这与承保商牌照和监管批准前阶段相符；取得完整承保牌照（2025 年 7
              月）后，到 2025 年 12 月宣布 ARR 超过 $40 million。约 18 个月内收入增长约 33 倍，Startupsunion
              形容这是「悬崖面，不是增长曲线」。两组数据均为公司自述，未经独立审计。


              支撑该 ARR 的客户规模：截至 2026 年 1 月公告，公司在 49 个州拥有超过 40,000 名活跃客户。公司报告流失率低于 1%；Startupsunion 估计，平均每客户年收入约
              $1,000。这套计算与已披露 ARR 方向一致：40,000 × $1,000 = $40M。客户队列集中在与 YC 相关的早期初创公司，具名客户包括
              Artisan、Eragon、Sorcerer、Intryc 和 Deel。


              产品组合模块化设计，跟随初创公司的融资阶段变化。Pre-Seed 和 Seed 套餐包括商业一般责任险（CGL）、董事及高管责任险（D&O）、技术差错与遗漏险（Tech
              E&O）和网络险（Cyber）。Series A 套餐增加媒体责任险（Media Liability）和雇佣实践责任险（EPLI）。Growth
              阶段增加受托责任险。特殊险种包括雇用及非自有汽车险（HNOA）、陈述与保证险（R&W）、AI 责任险、工伤赔偿险、企业主保险（BOP）、承包商专业责任险、房地产 E&O、律师 E&O、非营利组织
              D&O、绑架与赎金险（K&R）和医疗事故责任险。


              AI 责任险是一个值得注意的差异点：它明确覆盖 AI 模型错误、幻觉和偏见造成的财务损失——传统保险公司正在把这类风险从 E&O 保单中剔除，而不是承保。多个独立客户证言和分析评测都印证了 Corgi 能在
              10–15 分钟内给出报价，并在同日出单。
