      - number: '8.3'
        title: 投资人隐含估值与融资轮次背景
        blocks:
          - type: paragraph
            body: >-
              投资人行为是估值故事的关键，因为最新价格不只是抽象分析师估算，而是成熟投资人在 2026 年真实愿意出资的价格。Corgi 早期融资路径似乎从 Kindred Ventures 和 Y Combinator
              开始，这与公司面向初创公司的分发和产品取向相吻合。随后业务进入成长阶段，由 TCV 领投 Series B 和 Series B1。公开来源显示，Corgi 累计融资约 $378M，其中 Series B
              单轮贡献 $160M，Series B1 对应 $2.6B 投后估值。按公司自称 $40M ARR 计算，业务被定价为 65x ARR；更早的 $1.3B Series B 对应 32.5x
              ARR。升值速度太快，融资顺序本身就成了尽调问题。它可能反映了投资人对 AI 原生全栈承保主体的异常强需求、对 Corgi
              像软件公司一样扩张同时掌握承保经济性的信心，或围绕稀缺资产的竞争性轮次动态；也可能意味着，在准备金、再保险和分险种盈利数据尚未可得之前，后续投资人已经为动量和叙事付费。估值上，融资历史同时告诉投资人两件事：第一，高质量资本已经验证了公司；第二，这种验证已经被写进入场价格，留给执行失误的空间很小。因此，TVPI
              和 DPI 还很早、也主要停留在账面：基金管理人可以按这个价格快速上调账面价值，但最终实现价值要看后续 IPO 或 M&A 能否支撑同样的乐观。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
              - CV033
              - CV040
              - CV042
          - type: table
            tableRef: TV003
