      - number: '4.7'
        title: 证据
        blocks:
          - type: callout
            title: CEO 2026 年 4 月盈利声明——积极但未经审计
            body: >-
              CEO Nico Laqua 在 Forbes 采访中表示，Corgi 于 2026 年 4 月实现盈利，即 $106M Series B1 交割前一个月。若理解为运营口径综合成本率低于 100%，这对一家直到
              2025 年 7 月才拿到完整牌照的承保机构是重要里程碑。不过，这一说法是口头且未经审计；保险承保机构的法定会计与 GAAP 盈利可能差异很大，月度经营利润也不能反映准备金充足性。尽调应核实这一说法是否与
              TRRG 的法定申报一致。
