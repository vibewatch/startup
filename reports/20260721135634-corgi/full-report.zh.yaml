      - number: '5.4'
        title: 集成、部署与开发者信号
        blocks:
          - type: paragraph
            body: >
              公开披露的集成更多停留在业务流程层，而非 API 规范层。Corgi
              称它接入股权结构管理平台和云市场采购渠道，使初创公司在融资、供应商接入或基础设施采购事件发生时即可购买或更新保险。这一定位说明，产品意图嵌入创始人已经使用的运营系统，而不是只作为一年一次的保险交易。自助仪表盘也强化了这一框架：无需经纪商电话，客户就能持续管理保单、取回证书并按阶段扩展保障。

              更强的外部信号来自客户和开发者邻近社区，而不是传统软件生态。Product Hunt 评论将上手流程描述为快速、直观、对创始人友好，这符合 Corgi
              的叙事：买保险应当更像配置现代软件服务，而不是谈判经纪流程。Machineherald 和 GitHub 引用主要强化融资和公司身份，没有揭示技术深度。重要的是，在所给来源集中没有发现公开代码仓库、SDK、公开
              API 参考或实施指南。因此，今天的“开发者友好”信号更偏 UX，而非平台能力。尽调时，这一区分很重要：产品易用性可见，技术可扩展性仍基本未披露。
