      - number: '7.3'
        title: 财务与精算模型风险
        blocks:
          - type: paragraph
            body: >-
              Corgi
              的财务风险是结构性的：一旦选择全栈承保机构模型，公司就接受了经纪商主导初创公司无需承担的准备金、盈余和风险转移义务。承保奏效时，这很有吸引力，因为经济性和产品控制力都会改善；但若赔付发展出意外、再保险人收缩，或保费增长快过法定资本，这一模型就很无情。公开来源没有披露
              TRRG 的准备金方法、盈余 /
              保费比、综合成本率或再保险起赔点，因此外部观察者无法验证资本充足性是保守、仅够用还是偏薄。公司已经融入大量股权资本，管理层也声称盈利；但这些说法的财务质量以及当前估值的耐久性，都取决于公开资料中仍未经审计的数字。最新产品线增加了更多不确定性。AI
              Liability
              实质上是先发精算实验，卡车运输扩张则引入与软件中心初创公司责任险非常不同的赔案严重度和频率画像。若任一领域出现不利发展，风险会快速传导：赔付率恶化挤压准备金，准备金压力引来监管审查，两者又可能迫使追加融资或估值大幅重置。因此，公开记录支持对需求乐观，但还不足以相信承保机构模型已经经受经济压力测试。
