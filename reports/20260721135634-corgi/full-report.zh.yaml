  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全栈承保平台与产品架构
        blocks:
          - type: paragraph
            body: >
              Corgi
              的产品架构始于一个决定所有下游技术选择的结构性取舍：它不只是叠在传统保险承保机构之上的经纪流程层，而是一个全栈承保机构，借自己的运营结构承保、出单、管理并处理初创公司保险索赔。公开材料一致把公司定位为面向科技公司的
              AI 原生保险承保机构；2026 年 1 月发布稿明确 Technology Risk Retention Group, Inc. (TRRG) 是承保机构，Corgi Insurance Services,
              Inc. 是持牌生产者和项目管理员。这一点关键，因为平台从报价接入到理赔全链条纵向一体化。

              产品界面也相应很宽。Corgi 销售模块化商业保险险种，包括 CGL、D&O、Tech E&O 和 Cyber 组成的核心初创公司组合，以及 EPLI、Media Liability、Fiduciary
              Liability、Workers Compensation、AI Liability 等阶段扩展产品和其他专门险种。首页和产品页描述了一个自助仪表盘，创始人可随公司成熟调整保障；直接控制承保机构也让 Corgi
              无需单独经纪商或前置承保机构交接，就能快速签发证书和标准险种报价。地域覆盖已经有实质规模：公司披露拥有 45 个生产者牌照辖区，产品覆盖 49 个州。由此形成的架构更应被理解为保险基础设施，而不是单一产品应用。
