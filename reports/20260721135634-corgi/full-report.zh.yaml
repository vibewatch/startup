      - number: '3.3'
        title: 专业与垂直保险科技玩家
        blocks:
          - type: paragraph
            body: >-
              除直接初创保险同行外，几家保险科技公司在与 Corgi 扩张路线相交的险种上占据强位置。Coalition 是主导性的网络保险专业公司，2022 年以 $5 billion 企业估值完成 $250 million
              Series F。Coalition 的「Active Insurance」模式把网络风险管理工具和保险保障捆绑；据称，主动威胁检测让投保人理赔减少 73%。Coalition 专注 SMB
              和中端市场网络风险，不提供 Corgi 那样的初创阶段组合包。Corgi 竞争 Cyber 险种时，必须靠初创专业化、承保商经济性和一体化组合包拉开差异，而不是靠网络特定风险管理深度。Cover Whale 于
              2023 年完成 $27.5 million Series A，把 AI 驱动承保用于卡车和商用车队保险。其 DriveSmart 车联网引擎平均出单时间 18 分钟。Cover Whale
              所在卡车运输垂直，正是 Corgi 宣布的下一个市场扩张方向，因此它是该赛道最直接的未来竞争者。Pie Insurance 在 2022 年 Series D 融资 $315
              million，瞄准小企业工伤赔偿险市场。Pie 在工伤赔偿险上的垂直深度超过 Corgi 当前该险种能力。Cowbell Cyber 完成 $100 million Series B 和 $60 million
              Series C，开发面向 SMB、通过经纪渠道销售的 AI 驱动网络保险定价和保单管理平台。Cowbell 通过经纪商运营，而 Corgi 直接触达创始人。Next Insurance 于 2025 年被
              ERGO/Munich Re 以约 $2.6 billion 收购，现作为 ERGO NEXT 运营，覆盖 750,000+ 家企业，并为 1,300+ 种类型提供即时线上入口。它在 Munich Re
              旗下的近期方向仍不清晰，但规模和母公司资源让它在更广泛 SMB 数字保险市场中构成潜在威胁。
            claimRefs: []
      - number: '3.4'
        title: 在位承保商替代方案
        blocks:
          - type: paragraph
            body: >-
              对初创买方而言，传统承保商仍是相关替代，尤其当公司成熟到 Series B 及以后。Chubb 是全球最大的商业保险公司之一，服务各种规模企业，覆盖 30+ 个专业行业实践，包括科技和专业责任。Chubb
              能提供大型跨国科技公司需要的保障深度，但通常通过经纪中介触达买方，增加摩擦和成本。对早期初创细分而言，Chubb 的承保流程、最低保费和必须经纪参与的工作流，无法与 Corgi 的自助模式竞争。The
              Hartford 已服务小企业保险客户 200+ 年，截至 2026 年拥有 1.3 million+ 小企业客户，并被 Keynova 评为排名第一的数字小企业保险商。Hartford
              数字能力进步很大，但产品设计是通用 SMB，而不是初创专用。它不提供初创阶段模块化打包、AI 责任险，也不直接接入 VC 基础设施平台。Progressive Commercial 有 50+
              年经验，覆盖商用汽车和小企业保险的 30+ 个险种，尤其强在与卡车车队相关的商用车辆险。随着 Corgi 扩张到卡车运输，Progressive Commercial
              会成为更相关的在位竞争者。在位承保商整体代表了保险科技公司 最终必须匹配的承保资本和定价深度；它们的弱点是面向技术原生买方的分销摩擦和产品僵硬，而这些买方想要 API 集成、即时出单和透明定价。
