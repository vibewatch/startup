        blocks:
          - type: callout
            title: TRRG 排除州担保基金保护，是投保人最关键的风险披露
            body: >-
              Corgi 的核心法律事实不是它没有牌照或明显不合规，而是 TRRG
              结构改变了承保机构受损时最终由谁承担信用风险。保单持有人得不到核准承保机构通常对应的州担保基金兜底，因此尽调必须聚焦盈余、准备金和再保险，而不是只看增长。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: AI Liability 产品是没有精算历史的先发押注——不利赔付发展无法量化
            body: >-
              Corgi 的 AI Liability 险种可能证明自己有差异化，但它开始承保时，行业尚未为 LLM
              幻觉、模型偏见和训练数据争议积累可信的赔案频率、严重度、排除条款表现或赔付发展模式数据库。这使得准备金充足性和定价纪律很难凭公开证据评估。
            calloutType: risk
            claimRefs:
              - CR013
              - CR020
              - CR028
          - type: callout
            title: 监管与资本风险目前可管理，但保费账簿增长后必须持续监控
            body: >-
              所审阅来源集中没有任何内容证明 Corgi 当前陷入困境，公司也已经筹集足够资本，使这门生意值得认真承保。但一旦保费规模扩张，风险可能快速变化。正确的尽调姿态是持续监控 NAIC
              申报、盈余充足性、按险种拆分的赔付发展，以及监管机构是否开始对 TRRG 结构提出更严厉问题的任何信号。
            calloutType: insight
            claimRefs:
              - CR039
              - CR040
              - CR037
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 单位经济模型与盈利路径
        blocks:
          - type: paragraph
            body: >-
              Corgi 的估值判断，首先要看单位经济能看见什么、看不见什么。公开层面，公司披露的信息足以证明收入端高速放大，但还不足以证明承保主体能持续盈利。Corgi 称 ARR 在 2025 年 12 月达到
              $40M，平台到 2026 年 1 月服务 40,000+ 客户，折算每位客户年保费约 $1,000。考虑到产品组合以 CGL、Tech E&O、Cyber、D&O
              为核心，这个数字放在早期初创公司的商业保险里大体可信。更难判断的是这笔收入的质量。Corgi 没有公开披露赔付率、综合成本率、CAC、回本周期，或按 队列拆分的留存机制。管理层声称公司已盈利、流失率低于
              1%，YC 网络也可能让获客成本低于依赖经纪人或重外勤销售的同行，但公开记录无法独立审计这些说法。原因很简单：保险公司的现金流质量不是由 ARR
              单独定义，而是看保费经过理赔、再保险和运营费用之后，长期还能留下多少。只要承保扎实，全栈承保主体会比经纪公司值钱得多，因为它能拿到承保利润和浮存金投资收益；但如果准备金偏薄，或长尾责任险种在增长被庆祝之后恶化，它也可能明显不如经纪公司值钱。因此，当前估值更像是在为未来单位经济的证明付钱，而不是为已经完整呈现的当期盈利流付钱。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV023
              - CV035
          - type: table
            tableRef: TV001
