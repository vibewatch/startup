      - 对分析的影响
      - 具体尽调路径
    rows:
      - - 经审计或法定财务报表
        - 没有审计数据，无法核实 ARR、赔付率或盈利说法
        - 向数据室索取经审计 GAAP 财务报表或 TRRG 的 NAIC 法定报表
      - - 按险种划分的赔付率和综合成本率
        - 无法评估承保质量、定价准确性或准备金充足性
        - 索取 TRRG Schedule P（赔款发展三角）和当前综合成本率
      - - 客户获取成本（CAC）和回本周期
        - 无法评估增长资本效率或 YC 渠道优势耐久性
        - 向销售 / 财务团队索取按渠道拆分的 CAC；与人员数据交叉核对
      - - 毛利率
        - 无法建模盈利路径，或与 SaaS / 保险科技基准对比
        - 可由综合成本率 + 费用率披露推导；索取法定 P&L
      - - 再保险条款和交易对手
        - 无法评估灾难性损失敞口或承保主体资本要求
        - 索取再保险合约条款、自留水平和交易对手名称
      - - D&O 和网络险准备金充足性
        - 长尾险种可能掩盖发展中的损失；准备金不足会抬高盈利表现
        - 索取最近季度 D&O 和网络险的精算准备金认证
      - - 净收入留存（NRR）和客户队列扩张
        - 无法评估加购轨迹或 ARPC 是否增长
        - 索取按客户队列年份拆分的 NRR，以及 2024 vs 2025 客户队列的 ARPC 扩张数据
    notes: 上述项目都是保险承保机构的标准机构尽调请求。许多指标对私营风险自留团体没有公开披露要求，但投资级数据室通常会提供。 缺少公开披露符合预期，本身不是负面信号。
