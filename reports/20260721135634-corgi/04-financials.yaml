callouts:
- title: CEO April 2026 Profitability Statement — Encouraging but Unaudited
  body: CEO Nico Laqua stated in a Forbes interview that Corgi was profitable in April 2026, the month preceding the $106M
    Series B1 close. If interpreted as combined ratio below 100% on an operating basis, this would represent a significant
    milestone for a carrier that received its full license only in July 2025. However, the statement is verbal and unaudited;
    statutory accounting for insurance carriers can differ significantly from GAAP profitability, and reserve adequacy is
    not captured in monthly operating profit. Diligence should verify whether this claim is consistent with TRRG's statutory
    filings.
  calloutType: insight
  claimRefs:
  - CI024
  - CI025
  - CI026
- title: Rapid Valuation Expansion — $1.3B to $2.6B in 22 Days
  body: Corgi's valuation doubled from $1.3B (Series B, May 6 2026) to $2.6B (Series B1, May 28 2026) in 22 days. This pace
    is unusual even for high-growth insurtechs and reflects strong investor demand at the current growth trajectory. The risk
    is that this multiple expansion embeds assumptions about growth continuation, margin improvement, and market expansion
    that may not materialize. If ARR growth decelerates, loss ratios deteriorate, or the AI Liability product faces adverse
    claims, the valuation multiple could compress sharply. Diligence should model downside scenarios where growth is 50% of
    current trajectory and combined ratios are 105% rather than sub-100%.
  calloutType: risk
  claimRefs:
  - CI033
  - CI034
  - CI040
