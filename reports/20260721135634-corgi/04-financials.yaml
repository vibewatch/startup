company:
  name: Corgi
chapter:
  number: 4
  title: Financials
  summary: Corgi Insurance has grown from $1.2M in revenue in mid-2024 to $40M+ ARR by December 2025, serving 40,000+ active
    customers across 49 states. The company operates a full-stack carrier model in which it retains underwriting margin rather
    than passing it to external carriers. CEO Nico Laqua stated the company was profitable in April 2026, the month preceding
    the Series B1 close. Total capital raised is $378M (as of May 2026), with a $2.6B valuation. Key financial unknowns include
    audited loss ratios, gross margin, burn rate, and cash position — all of which are unavailable for a private carrier.
    The pace of valuation expansion ($630M to $2.6B in approximately five months) merits close scrutiny in diligence.
sections:
- id: revenue-model-and-streams
  title: Revenue Model and Premium Streams
  body: 'Corgi''s revenue model is structurally different from insurtech brokers because Corgi retains the underwriting margin
    as a full-stack carrier. When a customer pays a premium, that premium flows to Technology Risk Retention Group, Inc. (TRRG),
    Corgi''s underwriting entity. After paying claims, reinsurance costs, and operating expenses, the net underwriting result
    accrues to the Corgi group rather than to an external carrier. This carrier economics model means that, at a profitable
    combined ratio, Corgi generates a spread between earned premiums and incurred losses plus operating expenses that brokers
    cannot replicate. The primary revenue stream is insurance premium income across a portfolio that spans CGL, D&O, Tech
    E&O, Cyber, EPLI, AI Liability, Fiduciary, Workers Compensation, BOP, Commercial Umbrella, and specialized lines including
    Real Estate E&O, Lawyer E&O, and Non-Profit D&O. Products are priced on annual policy terms with premiums determined at
    binding based on AI-native underwriting assessment of risk factors including company stage, revenue, employee count, product
    type, and jurisdiction. Corgi''s startup-stage modular packaging creates natural upsell paths: a pre-seed company buying
    CGL and Tech E&O for $500–$2,000 annually may expand to a $10,000–$25,000 D&O and full-bundle customer after raising a
    Series A. The company disclosed $40M+ ARR as of December 2025 with 40,000+ active customers, implying average revenue
    per customer (ARPC) of approximately $1,000 per year. Gross margin in the carrier model depends critically on the loss
    ratio and expense ratio (the combined ratio), which Corgi has not publicly disclosed. The company growing from approximately
    $1.2M revenue in mid-2024 to $40M+ ARR fifteen months later represents approximately 33x growth — a trajectory consistent
    with rapid market penetration in the YC ecosystem.'
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-monetization
  title: Pricing and Monetization Structure
  body: 'Corgi uses a direct carrier pricing model: premiums are set by its own underwriting team without broker commission
    layers. Published startup insurance cost guides indicate that pre-seed coverage (CGL + Tech E&O baseline) starts at approximately
    $500–$2,000 per year, with seed-stage bundles in the $2,000–$4,000 range, Series A packages (adding D&O and EPLI) in the
    $10,000–$25,000 range, and growth-stage programs exceeding $30,000 annually. These are list prices; actual premiums vary
    by risk profile, limits selected, industry, and claims history. The company''s full-stack carrier position enables Corgi
    to offer up to 30% cost savings versus broker competitors in some cases, according to a customer testimonial from Artisan
    (Corgi''s own case study). The pricing model includes an instant-bind self-serve path for standard lines (quote in 10–15
    minutes, bind same day) and a human broker channel for specialized lines requiring 1–14 days of underwriting. There is
    no publicly disclosed volume discount or enterprise pricing schedule. Contract terms are annual policies with standard
    commercial insurance renewal cycles. Workers comp and some specialty lines may be billed on payroll-adjusted basis. The
    monetization model does not include subscription SaaS revenue; revenue is 100% insurance premium-driven as disclosed in
    public statements. This means revenue is correlated to premium volume and loss experience rather than contracted recurring
    SaaS revenue, creating volatility risk that pure SaaS models do not have.'
  tableRefs:
  - TI002
  figureRefs: []
- id: unit-economics
  title: Unit Economics and Efficiency Metrics
  body: 'Corgi''s publicly disclosed unit economics are limited to three company-stated metrics: average revenue per customer
    of approximately $1,000 per year (derived from $40M+ ARR / 40,000 customers), customer churn below 1% annually (company-claimed,
    unaudited), and a CEO statement of profitability in April 2026. No CAC, payback period, gross margin, combined ratio,
    or loss ratio has been publicly disclosed. The sub-1% annual churn rate, if accurate, is exceptional for commercial insurance
    and implies very high LTV relative to CAC — the implied LTV at 1% churn is 100x ARPC (assuming constant revenue), or approximately
    $100,000 per customer at current ARPC. However, commercial insurance churn is generally understated in the early stages
    of a portfolio because the majority of policyholders have not yet had a renewal event; the true retention rate will only
    be verifiable after 24–36 months of portfolio seasoning. The YC network as primary distribution channel implies a potentially
    low CAC (partner referral rather than paid acquisition), but this has not been confirmed with numbers. Coverage costs
    for AI-native claims processing may be lower than traditional carrier cost structures, but Corgi has not disclosed headcount
    per policy, automation rate, or claims frequency/severity data. The full-stack carrier model means Corgi bears the full
    insurance risk — unlike brokers, its economics include the actuarial uncertainty of loss development, especially for D&O
    and Cyber lines with multi-year development tails. Adverse scenarios where loss ratios deteriorate (e.g., a wave of AI
    Liability claims) could significantly impair profitability without the buffer of external carrier paper.'
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy
  title: Funding History and Capital Adequacy
  body: 'Corgi has raised $378 million in total as of May 2026, with three primary rounds: an $108 million combined Seed and
    Series A (announced January 2026), a $160 million Series B at a $1.3 billion valuation (May 6, 2026), and a $106 million
    Series B1 at a $2.6 billion valuation (May 28, 2026), all led by TCV. The $106 million Series B1 closed three weeks after
    the $160 million Series B — an unusually compressed financing cycle that doubled the valuation in 22 days. CEO Nico Laqua
    stated in a May 2026 Forbes interview that the company was profitable in April 2026 (the month preceding the Series B1
    close), making the capital raise more growth-oriented than survival-driven. As a full-stack carrier, Corgi has capital
    requirements beyond those of an insurtech broker: TRRG must maintain adequate surplus (capital reserve) relative to its
    net written premiums under risk retention group regulations. The approximately $35 million paid to acquire the carrier
    entity is a sunk cost; ongoing capital adequacy depends on the growth rate of the premium book relative to surplus. At
    $40M+ ARR and rapid growth, capital allocation to carrier surplus rather than operating expenses may explain the large
    fundraise amounts. The company has not disclosed cash on hand, monthly burn rate, or runway. Given the CEO''s April 2026
    profitability statement, burn may be near zero or positive on an operating basis, though carrier surplus requirements
    could consume capital separately. The Series B1 term "led by TCV" with 15+ co-investors suggests the round was partially
    supply-driven by strong investor demand at the current growth trajectory rather than by an acute capital need.'
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: public-traction-and-metrics
  title: Public Traction, Revenue Quality, and Estimates
  body: 'Corgi''s publicly disclosed financial metrics create a partial picture. The $40M+ ARR figure is company-stated and
    was announced as part of the January 2026 Series A press release rather than a formal audited disclosure. The $1.2M revenue
    mentioned in mid-2024 is from secondary analyst sources. The ARR metric for an insurance company deserves interpretation:
    insurance ARR (annualized premium run rate) differs from SaaS ARR in that premiums are subject to claims, reinsurance
    costs, and actuarial development. A $40M ARR carrier with a 100% combined ratio (breakeven) generates no net income; a
    90% combined ratio generates $4M net income; an 80% combined ratio generates $8M. The CEO''s April 2026 profitability
    statement, if interpreted as combined ratio below 100%, is a meaningful milestone for a carrier with only ~10 months of
    full-carrier operation (license received July 2025). Customer quality is partially evidenced by named customers: Artisan
    (AI BDR startup), Eragon (enterprise SaaS), Sorcerer (weather balloon / climate data), Intryc (data security / Deel customer),
    and Imagine AI (content automation). All five customer case studies are from YC-affiliated companies, which is consistent
    with the YC-network acquisition strategy and also creates concentration risk: a shift in YC deal flow or brand perception
    could disproportionately impact Corgi''s customer pipeline. The 40,000+ customer count at $40M+ ARR implies a high-volume,
    low-ARPC customer base dominated by small seed-stage companies. As these companies grow to Series A and beyond, natural
    upsell should expand ARPC, improving revenue quality. However, there is no disclosed data on ARPC trajectory or cohort
    expansion revenue.'
  tableRefs: []
  figureRefs:
  - FI003
- id: financial-gaps-and-verdict
  title: Financial Gaps and Diligence Verdict
  body: 'The financial picture for Corgi is materially incomplete for investment-grade diligence. The most critical missing
    metrics are: loss ratio and combined ratio (the fundamental health measures for a carrier), gross margin (which for an
    insurer is the inverse of the loss ratio after reinsurance), claims frequency and severity data by product line, D&O and
    Cyber reserve adequacy (given multi-year development tails), audited financials or any GAAP/statutory financial statements,
    cash position and burn rate, and CAC and payback period. Several of these metrics may only be available under an NDA in
    a full diligence data room. The positive indicators are the rapid ARR growth (from $1.2M to $40M+ in approximately 15
    months), the CEO''s April 2026 profitability claim, sub-1% churn (company-stated), the full-carrier license received July
    2025, $378M total funding from institutional investors, and a valuation confirmed by three successive rounds (market validation).
    The risk indicators are: rapid valuation multiple expansion ($630M to $2.6B in ~5 months), unaudited financial claims,
    concentrated customer acquisition (YC ecosystem), absence of any public loss experience data, and the TRRG structure''s
    potential disadvantage vs. standard licensed carriers in risk-averse buyer segments. The overall financial verdict is
    that Corgi shows exceptional revenue growth and promising traction but requires a full data room review of statutory financials,
    reserve adequacy, loss development triangles, and CAC data before any financial thesis can be formed with high confidence.'
