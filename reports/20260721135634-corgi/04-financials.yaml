- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - impact on analysis
  - exact diligence path
  rows:
  - - Audited or statutory financial statements
    - Cannot verify ARR, loss ratio, or profitability claim without audited data
    - Request audited GAAP financials or NAIC statutory statements for TRRG from data room
  - - Loss ratio and combined ratio by line
    - Cannot assess underwriting quality, pricing accuracy, or reserve adequacy
    - Request TRRG Schedule P (loss development triangles) and current combined ratio
  - - Customer Acquisition Cost (CAC) and payback period
    - Cannot assess capital efficiency of growth or durability of YC-channel advantage
    - Request CAC by channel from sales/finance team; cross-check with headcount data
  - - Gross margin
    - Cannot model profitability path or compare to SaaS/insurtech benchmarks
    - Derivable from combined ratio + expense ratio disclosure; request statutory P&L
  - - Reinsurance terms and counterparty
    - Cannot assess catastrophic loss exposure or carrier capital requirements
    - Request reinsurance treaty terms, retention levels, and counterparty names
  - - D&O and Cyber reserve adequacy
    - Long-tail lines can mask developing losses; inadequate reserves inflate profitability
    - Request actuarial reserve certification for D&O and Cyber as of most recent quarter
  - - Net Revenue Retention (NRR) and cohort expansion
    - Cannot assess upsell trajectory or whether ARPC is growing
    - Request NRR by cohort year and ARPC expansion data for 2024 vs 2025 cohorts
  notes: All items above represent standard institutional diligence requests for an insurance carrier. Many of these metrics
    are not publicly required for private risk retention groups, but are standard in investment-grade data rooms. Absence
