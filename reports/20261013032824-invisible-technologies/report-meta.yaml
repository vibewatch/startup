  topStrengths:
    - Broad modular platform with documented traction across frontier model labs and enterprise workflow buyers.
    - Strong historical revenue growth and a disclosed $144M capital base supporting continued expansion.
    - Forward-deployed delivery model and named customer deployments indicate production-level adoption.
  topRisks:
    - The business mix still appears hybrid, so software-like margins and retention remain unproven.
    - The implied >$2B valuation already prices in sustained hypergrowth and operating leverage.
    - Customer concentration, legacy integration friction, and undisclosed contract terms keep durability uncertain.
  unresolvedGaps:
    - 2025 actuals, 2026 revenue run-rate, and a gross-margin bridge separating software subscriptions from services.
    - Customer concentration, NRR/GRR, and renewal cohorts by major product family.
    - Full growth-round term sheet, preference stack, board rights, and secondary-liquidity history.
    - Clear evidence that workflow software, not legacy labeling or RLHF labor, is now the dominant growth engine.
