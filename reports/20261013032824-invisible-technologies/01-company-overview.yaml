callouts:
  - calloutType: insight
    title: Services-to-Software Delivery Model Drives Rapid Deployment
    body: Invisible Technologies pairs forward-deployed engineers directly with customer operations teams rather than conducting multi-month discovery engagements. By embedding engineers to map existing workflows into its modular software stack (Neuron, Atomic, and Axon), the company bridges messy enterprise legacy systems with frontier AI models while retaining customer data inside corporate boundaries.
    claimRefs:
      - CO002
      - CO003
  - calloutType: risk
    title: Valuation Multiple Compression Risk Amid Legacy Enterprise Friction
    body: The September 2025 growth round post-money valuation exceeding $2 billion prices Invisible Technologies at approximately 15 times its 2024 revenue ($134 million). While supported by historical profitability and top-tier foundation model training contracts, sustaining this multiple requires converting human-in-the-loop expert services into recurring software subscriptions in a market where 70% of enterprise systems remain legacy environments.
    claimRefs:
      - CO005
      - CO007
      - CO009
