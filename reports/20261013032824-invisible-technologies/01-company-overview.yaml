  evidenceGaps:
    - type: missing-source
      severity: material
      topic: 2025-financial-actuals-and-gross-margin
      missingEvidence: Audited calendar year 2025 financial actuals, forward 2026 revenue run-rate, and a gross margin bridge separating software platform subscriptions from forward-deployed services.
      whyItMatters: A $2B+ valuation multiple (~15x on 2024 revenue) requires proof of software-like margin expansion rather than labor-intensive services economics.
      diligencePath: Request management representation on 2025 audited income statements, revenue breakdown by SKU, and gross margin profiles for FDE engagements.
      relatedQuestionRefs:
        - QO009
    - type: private-evidence-only
      severity: material
      topic: growth-round-term-sheet-and-preference-stack
      missingEvidence: Complete Series B / Growth round term sheet for the September 2025 Vanara Capital financing, including liquidation preferences, board governance rights, and secondary sales.
      whyItMatters: Senior liquidation preferences or non-participating terms materially alter common shareholder returns and effective pre-money equity value.
      diligencePath: Obtain Certificate of Incorporation amendments and investor rights agreements filed following the September 2025 funding round.
      relatedQuestionRefs:
        - QO010
