callouts:
  - calloutType: "insight"
    title: "The Services-to-Software Multiple Tension"
    body: "Invisible Technologies' reported valuation multiple of roughly 15x trailing sales reflects investor enthusiasm for its rapid revenue growth and agentic AI narrative. However, sustaining a top-quartile software multiple requires underwriting proof that high-margin platform subscriptions and automated Axon execution are outpacing human-delivered annotation services in the revenue mix."
    claimRefs:
      - "CI004"
      - "CI005"
  - calloutType: "risk"
    title: "Legacy Infrastructure Integration Friction"
    body: "While frontier model training generates substantial near-term revenue, enterprise workflow automation depends on integrating with legacy IT estates where 70% of software predates modern AI. Elongated implementation cycles and bespoke forward-deployed engineering requirements could compress operating margins and slow corporate payback periods."
    claimRefs:
      - "CI012"
      - "CI013"
