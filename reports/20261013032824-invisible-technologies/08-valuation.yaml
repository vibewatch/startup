callouts:
  - calloutType: recommendation
    title: 'Recommendation Stance: Research-More on Stretched Growth Multiples'
    body: |-
      While Invisible Technologies displays impressive headline velocity reaching $134M in revenue and closing a $100M round led by Vanara Capital, the >$2B valuation prices in software-like margins that remain unproven publicly. Prospective investors should maintain entry discipline and await verified segment financials.
    claimRefs:
      - CV001
      - CV004
      - CV011
  - calloutType: risk
    title: Downside Valuation Sensitivity to Enterprise Deployment Drag
    body: |-
      Because up to 70% of enterprise software remains legacy infrastructure, agentic automation implementation risks high delivery friction. If forward gross margins mirror outsourced services rather than software platforms, fair enterprise value compresses sharply toward median IT services multiples.
