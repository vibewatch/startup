    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Assessment / Rating
      - Empirical Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - 14.9x trailing multiple discounts strong execution but lacks margin verification
        - Do not invest at $2B mark until software-vs-services gross margin is confirmed
      - - Confidence Level
        - medium
        - Public revenue and valuation marks verified via funding filings and independent databases
        - Sufficient certainty on headline scale; diligence needed on unit economics
      - - Risk Rating
        - high
        - Legacy customer integration hurdles and high human-in-the-loop cost structure
        - Require downside protection and senior liquidation preferences in round terms
      - - Valuation Stance
        - stretched
        - Implied 14.9x multiple on $134M 2024 revenue vs public automation medians of 6x-8x
        - Price entry disciplined; demand 20-30% discount to latest mark for fresh capital
      - - Target Return / Horizon
        - 3.0x net return target over 4-5 year holding period
        - Contingent on enterprise workflow ARR scaling to >$350M with 65%+ gross margins
        - Track 2025-2026 revenue run-rate and enterprise contract renewals before commitment
    notes: Valuation assessment based on September 2025 $100M growth round data and comparative market multiples.
    claimRefs:
      - CV001
      - CV004
      - CV011
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Core Dimension
      - Investment Thesis
      - Investment Anti-Thesis
      - Thesis-Break / View-Change Trigger
    rows:
      - - Enterprise Workflow Transition
        - Platform evolution into Neuron, Atomic, and Axon unlocks scalable agentic workflow software ARR
        - Revenue remains predominantly hourly expert labeling and RLHF services with linear headcount scaling
        - Public verification of >60% pure software ARR and sustained software gross margins
      - - Market Positioning & Moat
        - Proprietary training data institutional knowledge across 80% of top frontier AI labs creates moat
        - Foundation model labs internalize data operations or consolidate vendors to Scale AI and Surge AI
        - Loss of key lab contracts or stagnation in Fortune 500 enterprise account growth
      - - Valuation & Entry Pricing
        - Hypergrowth (48x over four years) and profitability justify premium 14.9x trailing multiple
        - Multiple multiple-compression risk if growth moderates below 50% YoY or multiple derates to median
        - Gross margin disclosure confirming <50% margin profile or YoY growth dipping below 40%
      - - Legacy Integration Execution
        - Forward-deployed engineering embed model surmounts enterprise legacy systems to deliver ROI
        - Enterprise deployment cycles drag due to legacy software integration hurdles and high delivery cost
        - Customer contract expansion rates (NRR) falling below 110% across enterprise cohorts
    notes: Framework synthesizes verified operating capabilities against diligence risks and market realities.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Implied Valuation Range
      - Valuation / Return Logic
      - Key Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - Revenue scales to $280M+ with 65% gross margin; agentic software ARR exceeds 60% of mix
        - $3.5B - $4.0B
        - 12x - 14x forward multiple justified by market leadership in enterprise AI operations
        - Failure to transition RLHF contracts into sticky enterprise software subscriptions
      - - Base Case
        - 50%
        - Revenue grows to $200M - $220M with 50-55% blended margin; balanced software and service mix
        - $2.0B - $2.4B
        - 9x - 11x forward multiple reflecting hybrid software/services model matching current valuation
        - Enterprise spending pause or customer concentration losses in frontier lab cohort
      - - Bear Case
        - 25%
        - Growth slows below 30% YoY; services dominate (>70% of mix) with margins under 45%
        - $0.8B - $1.1B
        - 5x - 6x multiple compressed to IT services and outsourced BPO median benchmarks
        - Commoditization of data labeling and frontier lab vendor consolidation
    notes: Scenario models assume trailing $134M 2024 revenue base and evaluate multi-year exit outcomes.
    claimRefs:
      - CV004
      - CV010
      - CV013
