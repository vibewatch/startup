  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Industry Boundaries
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies operates at the convergence of enterprise automation software, data infrastructure,
              and specialized expert labor services. Historically, the software automation market was strictly divided
              between robotic process automation (RPA) platforms that executed rigid rules-based scripts and outsourced
              business process outsourcing (BPO) agencies that relied entirely on manual offshore headcount. As frontier
              foundation models matured, enterprise organizations discovered that off-the-shelf generative AI models
              could not be deployed directly into production environments without substantial preparatory data
              engineering, human-in-the-loop evaluation, and specialized integration. Invisible defines its commercial
              boundaries around this operational gap, delivering a modular platform that pairs advanced workflow mapping
              with an elastic network of domain specialists.


              The addressable spend included within Invisible's market perimeter encompasses high-value data curation,
              reinforcement learning from human feedback (RLHF), safety red-teaming, and agentic process automation for
              mission-critical operations. Conversely, the company explicitly excludes commodity mechanical
              crowdsourcing, uncurated bulk data scraping, and raw cloud computing infrastructure, positioning itself
              higher up the value chain where domain expertise dictates output accuracy. In contrast to legacy RPA
              vendors that require stable user interfaces and predictable workflows, Invisible targets semi-structured,
              complex enterprise knowledge tasks where automated agents and human specialists collaborate dynamically.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing Lenses and Empirical Growth Baselines
        blocks:
          - type: paragraph
            body: >-
              Estimating the total addressable market for Invisible Technologies requires multiple distinct analytical
              lenses rather than a single speculative projection. Independent industry coverage values the broad
              enterprise AI infrastructure market at over $50 billion in 2025, with consensus expectations projecting
              expansion toward $200 billion by 2030 as autonomous agentic architectures proliferate across Fortune 500
              IT stacks. However, this macro figure aggregates specialized hardware, cloud hyperscaler compute, and base
              model API subscriptions. To establish an empirical baseline for software-driven workflow orchestration,
              publicly traded peers provide valuable benchmarks: UiPath reported $1.938 billion in annualized renewal
              run-rate (ARR) growing 12% year over year as of mid-2026, demonstrating substantial enterprise willingness
              to pay for mission-critical process automation platforms.


              Within this broader landscape, Invisible's Serviceable Addressable Market (SAM) is concentrated in the
              high-growth intersection of post-training foundation model services and custom enterprise agentic
              workflows, estimated between $5 billion and $10 billion. Invisible's commercial execution has captured
              meaningful market share within this corridor, with independent reviews documenting 2024 revenue of
              approximately $134 million—representing greater than 100% year-over-year growth following rapid multi-year
              scaling. While these figures confirm robust demand across both foundation model creators and enterprise
              adopters, diligence must account for the mixed composition of this revenue, which bundles recurring
              software subscriptions with variable expert labor fees.
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
