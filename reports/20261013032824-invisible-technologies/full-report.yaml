      - number: '5.3'
        title: Operating Architecture, Deployment Mechanisms, and Technical Dependencies
        blocks:
          - type: paragraph
            body: >-
              From an architectural and infrastructure perspective, Invisible functions as a hybrid
              software-and-services system delivered primarily via Amazon Web Services (AWS) Software-as-a-Service
              (SaaS) and private cloud integrations. The commercial model on AWS Marketplace decouples fixed software
              platform access fees from metered hourly AI training fees, reflecting the platform's dual nature as an
              orchestration runtime and an elastic expert workforce. Technical execution relies on robust data pipelines
              where Neuron normalizes messy enterprise records before handing tasks to Atomic's visual execution graph.
              Tasks requiring subjective human reasoning, edge-case disambiguation, or adversarial safety testing are
              programmatically dispatched to Meridial's specialist network. Once workflows stabilize, repetitive logic
              is delegated to Axon's autonomous agents. However, this architecture entails notable external
              dependencies, including hyperscaler cloud availability, third-party foundation model inference APIs, and
              continuous recruitment pipelines for specialized domain labor.
            claimRefs:
              - CE001
              - CE002
