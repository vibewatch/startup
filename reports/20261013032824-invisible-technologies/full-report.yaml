          - type: callout
            title: Hyperscaler Concentration and Lack of Audited Retention Metrics
            body: >-
              While marquee relationships with Microsoft and Cohere validate Invisible's technical capabilities,
              customer concentration among foundation labs and the lack of disclosed net revenue retention (NRR) cohorts
              cloud long-term revenue visibility.
            calloutType: risk
            claimRefs:
