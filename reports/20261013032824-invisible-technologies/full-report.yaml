        title: Exhibits
        blocks:
          - type: callout
            title: Shift from Data Labeling to Enterprise Operations-as-a-Service
            body: >-
              Invisible differentiates from traditional annotation vendors by packaging human domain specialists with
              workflow automation and data ontology tooling, enabling enterprise customers to automate live business
              processes rather than merely purchasing static training datasets.
            calloutType: insight
            claimRefs:
              - CU005
