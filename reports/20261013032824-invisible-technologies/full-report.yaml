      - number: '6.2'
        title: Adoption Trajectory and Historical Commercial Milestones
        blocks:
          - type: paragraph
            body: >-
              Invisible's commercial trajectory accelerated significantly following the post-2022 generative AI boom.
              Third-party research by Sacra and QuantLogix estimates that the company generated $134 million in revenue
              in 2024, representing an impressive 123% year-over-year increase from $60 million in 2023. This
              performance follows an earlier operational breakthrough during the 2020 pandemic when Invisible helped
              DoorDash onboard restaurant menu data during global outsourcing disruptions. By 2024, the business
              achieved approximately $15 million in EBITDA, demonstrating operational profitability alongside rapid
              top-line growth. To support this expanding customer volume, Invisible mobilized a selective distributed
              workforce exceeding 3,000 operators across 35 countries, coordinated through software bots and proprietary
              task routing engines. Third-party vendor platforms such as FeaturedCustomers track 25 customer references
              and case studies across model evaluation and workflow automation, underscoring measurable adoption among
              leading commercial enterprises.
            claimRefs:
              - CU001
              - CU002
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
