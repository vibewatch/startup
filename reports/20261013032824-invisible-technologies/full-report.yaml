      - number: '6.3'
        title: Named Customer Deployments and Case Proof
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer deployments demonstrate production-grade execution across diverse operational
              environments. In foundation model evaluations, Cohere's data leadership publicly highlighted Invisible's
              high talent bar and continuous observability, noting that the platform's rigorous questioning pushed their
              internal teams to generate superior training data. In enterprise applications, a global retail brand
              doubled its demand forecasting accuracy after deploying Invisible's forward-deployed engineering
              workflows, while a financial services client expanded contact center intelligence coverage to 100% of
              customer calls. Similarly, government contractor SAIC integrated Invisible's data pipelines for complex
              naval simulations, and Swiss Gear eliminated manual back-office friction by automating multi-step supply
              chain workflows. While these named deployments validate that Invisible operates well beyond preliminary
              pilot stages, the absence of public contract values or committed annual recurring revenue figures means
              individual account scale remains unquantified.
            claimRefs:
              - CU003
              - CU004
