      - number: '3.3'
        title: Capability Comparison and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Evaluating enterprise alternatives requires dissecting how capability breadth maps into procurement
              packaging and commercial contract terms. Unlike conventional SaaS providers that bill per user seat, or
              traditional BPO vendors that bill hourly labor rates, Invisible employs a hybrid commercial model
              reflected in its AWS Marketplace contract architecture. Customer billings divide into two distinct,
              unbundled components: a recurring platform license fee for platform access and workflow orchestration,
              alongside a metered hourly AI training fee reflecting expert labor utilization. For executive operational
              support, minimum commitments start at $2,000 per month, while multi-year enterprise contracts command
              customized annual terms. This hybrid contract architecture creates procurement complexity, as enterprise
              buyers must balance technology software budgets against external professional services expenditure, but
              simultaneously delivers cost transparency relative to unpredictable bespoke systems integration
              consulting.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
