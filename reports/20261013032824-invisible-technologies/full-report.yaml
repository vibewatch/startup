      - number: '6.4'
        title: Retention Durability, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite rapid top-line expansion, Invisible's customer model faces critical structural durability and
              concentration risks. A significant portion of 2023-2024 revenue growth was driven by massive data curation
              contracts from foundation model providers like Microsoft. Because hyperscalers and frontier labs can shift
              training volume rapidly between vendors or insource annotation pipelines, customer concentration poses a
              major downside vulnerability. Operational scaling introduces compounding quality control risks: as the
              global agent base surpasses 3,000 workers, maintaining uniform precision across specialized tasks becomes
              increasingly challenging, and high-profile defects could prompt anchor clients to cancel contracts.
              Furthermore, Invisible's reliance on emerging-market labor paid $5 to $10 per hour creates persistent
              worker classification and public perception vulnerabilities. Crucially, Invisible does not publicly
              disclose net revenue retention (NRR), gross retention, or annual logo renewal cohorts, leaving the
              long-term durability of its enterprise software transition unverified.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
