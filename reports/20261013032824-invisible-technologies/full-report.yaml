      - number: '5.4'
        title: Governance, Data Integrity, and Architectural Risk Factors
        blocks:
          - type: paragraph
            body: >-
              Deploying autonomous AI agents and human-in-the-loop workflows across regulated enterprise environments
              introduces specific trust, security, and integration challenges. Axon addresses operational risk by
              enforcing per-customer data isolation, full cryptographic audit trails, and granular execution versioning,
              preventing data contamination across client boundaries. In model evaluations, Synapse replaces generic
              third-party benchmarks with custom evaluation suites grounded in actual business logic and side-by-side
              model scoring. Despite these controls, critical diligence risks remain. First, approximately 70 percent of
              target enterprise software environments remain trapped in legacy on-premise systems lacking modern APIs,
              creating implementation drag and extending forward-deployed engineering cycles. Second, public
              documentation discloses few details regarding formal certifications such as SOC 2 Type II, ISO 27001, or
              HIPAA compliance for air-gapped on-premise deployments. Finally, market data confusion with unrelated
              namesake hardware startups creates external ambiguity regarding the platform's proprietary software
              boundaries.
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Services-to-Software Hybrid Architecture
            body: >-
              Invisible's strategic positioning departs from pure self-service SaaS and commodity data labeling by
              deeply coupling proprietary software modules (Neuron, Atomic, Axon) with embedded forward-deployed
              engineering and an elite expert network. This approach allows the platform to capture complex, high-value
              enterprise processes that pure-play software cannot automate without human intervention.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE007
          - type: callout
            title: Legacy Infrastructure Integration Friction
            body: >-
              With an estimated 70 percent of corporate software remaining trapped in legacy architectures, Invisible's
              production expansion faces friction from undocumented client data schemas and fragmented legacy databases,
              necessitating substantial manual configuration before autonomous agents can operate reliably.
            calloutType: risk
            claimRefs:
              - CE008
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Personas
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies segments its commercial customer base across two primary archetypes: frontier AI
              laboratories requiring high-precision human feedback, and traditional enterprises modernizing operational
              workflows. In the frontier AI segment, customers such as Microsoft and Cohere procure advanced data
              curation, reinforcement learning from human feedback (RLHF), and continuous model evaluation to accelerate
              foundation model training. These accounts require rigorous domain expertise and granular observability
              rather than generic mechanical labeling. Concurrently, enterprise clients across financial services,
              defense, retail, and commercial goods deploy Invisible's modular platform to automate complex,
              unstructured business processes. For instance, Swiss Gear automates supply chain tracking, SAIC leverages
              specialized data pipelines for defense applications, and the Charlotte Hornets deployed computer vision
              models to evaluate NBA draft prospects. Invisible bridges these customer needs by offering both direct
              software subscriptions and cloud marketplace channels, notably via AWS Marketplace, where buyers can
              procure platform access alongside metered training hours.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
