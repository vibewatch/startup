      - number: '3.4'
        title: Switching Costs, Lock-in Dynamics, and Network Defensibility
        blocks:
          - type: paragraph
            body: >-
              Invisibles switching costs derive from deep operational entanglement rather than proprietary model
              weights. Once an enterprise integrates Neuron to map disparate corporate databases into unified ontologies
              and relies on Atomic to formalize institutional exception logic, displacing the platform requires
              restructuring the underlying business process. Furthermore, embedding forward-deployed engineers directly
              inside customer operating units establishes significant organizational familiarity and operational trust.
              Multi-homing across foundation model laboratories—including verified work for Microsoft, AWS, and
              Cohere—further solidifies Invisibles positioning by generating valuable institutional heuristics regarding
              where commercial LLMs fail in production. This cross-laboratory perspective functions as a defensible moat
              against single-ecosystem software tools, providing Invisible with structural insight into frontier model
              alignment that single-vendor integrators cannot match.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: Commoditization Risks and Adverse Competitive Pressures
        blocks:
          - type: paragraph
            body: >-
              Despite robust enterprise traction, Invisible faces meaningful adverse risks tied to the inherent labor
              intensity of its delivery model. While pure-play software platforms scale with near-zero marginal cost,
              Invisibles hybrid model requires continuously sourcing, evaluating, and managing distributed human experts
              alongside costly forward-deployed engineers. Historical company disclosures acknowledge that early
              operations suffered severe delivery cost overruns before process standardization was achieved. Moreover,
              public contractor reviews surface persistent operational friction regarding management communication,
              variable assignment pacing, and contractor compensation predictability. As foundation model developers
              expand native agentic reasoning capabilities and incumbent RPA providers incorporate generative models,
              Invisible faces constant pressure to prove that its human-in-the-loop assembly line delivers durable ROI
              that cannot be commoditized by standardized autonomous agent software.
            claimRefs:
              - CP001
              - CP012
              - CP013
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The Enterprise AI Delivery Dichotomy
            body: >-
              While point solutions like Scale AI dominate upstream dataset annotation and RPA vendors automate
              deterministic desktop routines, Invisible core competitive thesis addresses the messy intermediate layer:
              unifying enterprise data ontologies, training models with specialized domain experts, and operating
              supervised agentic pipelines.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP004
          - type: callout
            title: Labor Scaling Friction vs Software Economics
            body: >-
              Because Invisible embeds forward-deployed engineers and domain experts into customer deployments, its
              operating model faces scaling friction and gross margin pressure that pure software platforms avoid. If
              competitors build standardized connectors or enterprises internalize orchestration, Invisible
              human-in-the-loop advantage could become an operational cost burden.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
