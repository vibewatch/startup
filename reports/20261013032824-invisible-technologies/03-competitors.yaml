  - id: TP002
    title: Feature / capability matrix
    columns:
      - Capability Dimension
      - Invisible Technologies
      - Scale AI / Surge AI
      - Hyperscience / IDP
      - Traditional BPO Services
    rows:
      - - Data Ingestion & Ontology Structuring
        - Neuron engine unifies multi-source data and builds relational ontologies
        - API-driven annotation pipelines focused on pre-training and fine-tuning datasets
        - Proprietary document ingestion tuned for unstructured forms and PDFs
        - Manual data entry and client-directed spreadsheet transformation
      - - Workflow Mapping & Automation Architecture
        - Atomic documents manual processes and converts them into digital sequences
        - Limited to labeling workflow configuration within data platform
        - Pre-built document workflow templates with rule-based routing
        - Custom process documentation delivered via static consulting artifacts
      - - Human-in-the-Loop Expert Quality
        - Meridial marketplace recruits specialized domain professionals on demand
        - Managed crowd workforce for broad annotation and rating tasks
        - Internal exception queues staffed by generic customer document clerks
        - Large distributed offshore labor pools managed on hourly service rates
      - - Production Agent Deployment & Governance
        - Axon runs versioned, governed agents with human supervision loops
        - API export of labeled datasets into client-managed inference infrastructure
        - Automated document processing outputs integrated into ERP/CRM queues
        - Manual operational handoffs without native autonomous agent software
    notes: Capability comparisons reflect published product architecture and service documentation; unverified vendor claims regarding third-party model performance are omitted.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider / Category
      - Pricing & Contract Model
      - Included Capabilities
      - Discounting & Unknown Realized Terms
      - Enterprise Procurement Implication
    rows:
      - - Invisible Technologies
        - 'Dual-charge structure: annual platform access fee plus hourly expert training fee'
        - Full platform access (Neuron, Atomic, Axon) plus dedicated forward-deployed engineers
        - Enterprise contract discounts negotiated privately; individual support starts at $2,000/mo
        - Requires cross-budget approval bridging IT software licensing and professional services spend
      - - Scale AI / Data Platforms
        - Volume-based unit pricing per labeled unit or annotation task plus enterprise platform license
        - Access to automated labeling tools, quality assurance metrics, and data delivery APIs
        - Volume discounts tied to committed dataset sizes; custom pricing for enterprise generative AI
        - Treated primarily as machine learning infrastructure and engineering operational expenditure
      - - Hyperscience / IDP Vendors
        - Core software license or usage-based pricing per processed page/document
        - Document extraction models, system connectors, and administrative management console
        - Tiered volume discounts based on annual page processing volume commitments
        - Procured as departmental back-office software or shared services automation technology
      - - Traditional BPO / Consulting
        - Time-and-materials hourly billing or fixed monthly full-time equivalent (FTE) staffing rates
        - Dedicated outsourced workforce, operational management, and periodic performance reviews
        - Hourly rate discounting tied to headcount scale and offshore delivery location
        - Procured as outsourced operational labor rather than technology infrastructure investment
    notes: Pricing structures reflect published AWS Marketplace contract mechanics, public reviews, and commercial listings; realized enterprise net discount terms remain confidential.
    claimRefs:
      - CP004
      - CP006
      - CP007
