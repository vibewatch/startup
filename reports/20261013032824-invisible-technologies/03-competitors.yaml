callouts:
  - calloutType: insight
    title: The Enterprise AI Delivery Dichotomy
    body: 'While point solutions like Scale AI dominate upstream dataset annotation and RPA vendors automate deterministic desktop routines, Invisible core competitive thesis addresses the messy intermediate layer: unifying enterprise data ontologies, training models with specialized domain experts, and operating supervised agentic pipelines.'
    claimRefs:
      - CP001
      - CP003
      - CP004
  - calloutType: risk
    title: Labor Scaling Friction vs Software Economics
    body: Because Invisible embeds forward-deployed engineers and domain experts into customer deployments, its operating model faces scaling friction and gross margin pressure that pure software platforms avoid. If competitors build standardized connectors or enterprises internalize orchestration, Invisible human-in-the-loop advantage could become an operational cost burden.
    claimRefs:
      - CP012
      - CP013
