  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与行业边界
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies
              处在企业自动化软件、数据基础设施和专业专家服务的交汇处。过去，软件自动化市场泾渭分明：一边是执行僵化规则脚本的机器人流程自动化（RPA）平台，另一边是完全依靠人工离岸人力的业务流程外包（BPO）机构。随着前沿基础模型成熟，企业发现，现成生成式
              AI 模型若没有大量前置数据工程、人工参与评估和专业集成，无法直接进入生产环境。Invisible 围绕这一运营缺口界定商业边界，以模块化平台将先进工作流映射与弹性领域专家网络结合起来。


              Invisible
              市场边界内的可服务支出包括高价值数据整理、基于人类反馈的强化学习（RLHF）、安全红队测试，以及关键任务运营的智能体流程自动化。相反，公司明确排除商品化机械众包、未经整理的批量数据抓取和原始云计算基础设施，将自身定位在价值链更上游、由领域专长决定输出准确性的环节。不同于要求用户界面稳定、工作流可预测的传统
              RPA 厂商，Invisible 瞄准半结构化、复杂的企业知识任务，让自动化智能体与人工专家动态协作。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角与实证增长基线
        blocks:
          - type: paragraph
            body: >-
              估算 Invisible Technologies 的总可寻址市场，需要多个彼此独立的分析视角，而不是一项投机性预测。独立行业报道将广义企业 AI 基础设施市场估值定在 2025 年超过 $50
              billion，并预计到 2030 年扩张至 $200 billion，原因是自主智能体架构将在《财富》500 强 IT 栈中普及。但这一宏观数字混合了专业硬件、云超大规模厂商算力和基础模型 API
              订阅。为了建立软件驱动工作流编排的实证基线，上市同业提供了有价值的参照：截至 2026 年年中，UiPath 报告年化续约运行率（ARR）为 $1.938 billion，同比增长
              12%，显示企业愿意为关键任务流程自动化平台支付可观费用。


              在更大的市场中，Invisible 的可服务可寻址市场（SAM）集中在快速增长的基础模型后训练服务与定制企业智能体工作流交叉地带，估计规模为 $5 billion 至 $10 billion。Invisible
              的商业执行已在这一走廊占据有意义的市场份额：独立评测记录显示，2024 年收入约为 $134 million，快速多年扩张后同比增长超过
              100%。这些数字确认基础模型创作者和企业采用者都有强劲需求，但尽调必须考虑收入构成混合这一点：其中既有经常性软件订阅，也有可变专家人力费用。
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM006
      - number: '2.3'
        title: 买方细分与企业采购动态
        blocks:
          - type: paragraph
            body: >-
              企业对 Invisible 平台的需求来自两个主要客户群，其采购速度和预算归属各不相同。第一类是前沿基础模型开发商和 AI 研究实验室，包括 Cohere、Microsoft 和 AWS。这些客户的采购决策由
              AI 研究副总裁和基础模型负责人主导，使用专门的研发创新预算。该细分市场的采用动力来自快速的模型开发周期：要校准领先模型权重，必须具备编程、医学、金融和法律推理等领域的专业知识。


              第二类是快速扩大的传统企业，覆盖金融服务、医疗和全球零售。在这些客户中，预算归属转向首席运营官、首席技术官和业务线运营负责人。采购路径与实验室销售明显不同：企业越来越多通过 AWS Marketplace
              等企业云市场交易，利用预先承诺的云支出合同加速采购审批并满足公司治理标准。该细分市场的合同聚焦高量异常处理、监管文件提取和客服升级；量化的运营效率与错误减少足以支撑数百万美元的承诺。
            claimRefs:
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、实施瓶颈与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Invisible 市场机会的首要增长动力，是企业高管迫切需要从生成式 AI 投资中提取可验证的投资回报。尽管商业 LLM 初次发布后企业热情高涨，行业调查和公司高管表述显示，多达 95% 的企业 AI
              试点无法进入生产部署。造成这一阻力的核心结构性约束是传统技术债：公司管理层指出，全球约 70% 的企业软件应用已有超过 20 年历史，给直接 API 集成和自主执行制造严重架构障碍。


              与此同时，严重的市场和宏观经济风险笼罩着该领域。风投分析师指出，在宏观经济收紧、企业买方无法快速实现可审计成本节省时，企业 AI 基础设施估值倍数面临 20% 至 30%
              的显著收缩风险。此外，公司高度依赖超大规模云厂商提供算力分发和基础模型合作，带来结构性杠杆风险。外部登记信息的混淆进一步增加尽调难度：公开数据库将 Invisible Technologies 与
              Invisible AI 等无关的早期视觉智能初创公司混为一谈，凸显严格核验公司实体身份和财务披露的必要性。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 企业 AI 的生产鸿沟
            body: 企业采用受生产鸿沟限制：70% 的公司软件仍是传统架构，导致最多 95% 的实验性 AI 项目在运营部署前停滞。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: 宏观倍数压缩与超大规模云厂商暴露
            body: 企业 ROI 实现放缓，威胁企业 AI 基础设施出现 20% 至 30% 的估值倍数压缩；对超大规模云生态的高度依赖则让厂商暴露于平台方的杠杆之下。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 市场格局与替代品类别
        blocks:
          - type: paragraph
            body: >-
              企业人工智能部署很少在前沿模型选择阶段失败；生产失败通常源于企业数据无序、业务流程交接含糊，以及缺少受治理的异常工作流。因此，Invisible Technologies 处在四类供应商市场的交汇点。第一类是
              Scale AI 和 Surge AI 等专业训练数据及 RLHF 服务商，擅长为基础模型开发商生成海量高吞吐标注数据，但几乎不提供持续工作流编排。第二类是流程智能和机器人流程自动化厂商，包括
              Mimica、Hypatos 和 UiPath，它们能捕捉桌面任务，却缺少嵌入式顶尖专家队伍。第三类是 Hyperscience
              等智能文档处理专家，能高精度提取文档，但仍局限于结构化表单处理。最后，Accenture 和 TaskUs 等全球 IT 咨询公司及 BPO
              服务商能提供人力容量，却没有自有工作流软件平台。商业情报记录还显示，市场偶尔会把公司与 Invisible AI 等无关的机器视觉初创公司混淆，凸显严格边界尽调的必要性。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP014
