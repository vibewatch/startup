        - 企业 AI 运营的市场领导地位足以支撑 12x - 14x 远期倍数
        - 未能将 RLHF 合同转成粘性企业软件订阅
      - - 基准情景
        - 50%
        - 收入增至 $200M - $220M，综合利润率 50-55%；软件与服务结构均衡
        - $2.0B - $2.4B
        - 9x - 11x 远期倍数反映混合软件 / 服务模式，与当前估值相当
        - 企业支出暂停，或前沿实验室客户群出现集中度流失
      - - 悲观情景
        - 25%
        - 增长放缓至低于 30% YoY；服务占主导（占比 >70%），利润率低于 45%
        - $0.8B - $1.1B
        - 5x - 6x 倍数压缩至 IT 服务与外包 BPO 的中位数基准
        - 数据标注商品化，前沿实验室供应商整合
    notes: 情景模型以 2024 年 $134M 追踪收入为基础，评估多年退出结果。
    claimRefs:
      - CV004
      - CV010
      - CV013
