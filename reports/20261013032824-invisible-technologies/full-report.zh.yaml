      - number: '1.2'
        title: 管理层与运营治理
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 在 2025 年 1 月经历了重要的高管交接，任命 Matthew Fitzpatrick 为 CEO，接替早期创始人管理层。Fitzpatrick 此前是
              McKinsey & Company QuantumBlack AI 业务的高级负责人，擅长推动企业 AI 转型落地，并为《财富》500
              强部署建立可量化的投资回报基准。公司的组织治理高度依赖前置部署工程团队：他们驻场并深入企业客户系统，把原始业务需求转成可执行的机器工作流。Invisible 还与 Cohere
              等知名基础模型开发商紧密合作，直接与研究负责人协作，围绕包括 Microsoft、AWS、SAIC 和 American Family Insurance
              在内的商业客户账户持续开展模型可观测性和复杂评测基准工作。
            claimRefs:
              - CO003
              - CO004
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO012
      - number: '1.3'
        title: 资本结构、融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              2025 年 9 月，Invisible Technologies 完成一轮标志性的 $100 million 增长融资，投后估值超过 $2 billion，累计融资升至 $144 million。成长股权公司
              Vanara Capital 领投，这是其从私募股权巨头 TPG 分拆后的首笔平台投资；Princeville Capital、HOF Capital、Freestyle VC 和 Tallwoods
              Capital 共同参投。Greycroft、Deepwater Asset Management 和 Acrew Capital 等原有机构投资者也再次参投。引入这笔大额成长股权资金前，Invisible
              已连续五年多实现盈利；2024 年年收入增至 $134 million，较 2020 年增长 48 倍。二手聚合平台有时会把公司与计算机视觉初创公司 Invisible AI 混淆，因而报出 $200
              million 的总融资额；但融资轮次的一手披露确认，累计机构融资实际为 $144 million。
