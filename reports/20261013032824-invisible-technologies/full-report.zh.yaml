chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 2015
              年成立之初是一家技术赋能的运营支持服务商，后来有意转型为总部位于旧金山的企业人工智能基础设施和工作流自动化平台。公司没有销售单点式数据标注或投机性的咨询服务，而是将五部分模块化软件架构商业化：Neuron
              负责数据本体，Atomic 负责流程文档，Meridial 负责按需专家网络，Synapse 负责模型评估，Axon 负责受治理的自主智能体。为解决传统软件架构阻碍纯 SaaS
              落地这一常见企业采用难题，Invisible 将模块化平台与前置部署工程师结合，直接接入客户数据库和工作流，在数周内交付可衡量的生产部署，而不是经历拖延数个季度的发现周期。在 AWS Marketplace
              上，Invisible 将商业报价拆成两部分：固定的软件平台访问权，以及按小时计费的训练和运营专家服务。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
