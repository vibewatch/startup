          description: 专业智能文档处理软件，为结构化后台记录提供高精度提取。
          tone: neutral
        - label: UiPath / 传统 RPA
          x: 3.6
          'y': 1.4
          description: 确定性流程自动化软件，缺少原生领域专家市场与 LLM 评测能力。
          tone: risk
        - label: 传统 BPO 服务商（TaskUs / Appen）
          x: 1.5
          'y': 2.1
          description: 大规模外包劳动力与基础标注团队运营，但没有专有代理编排软件。
          tone: risk
        - label: 管理咨询公司（Accenture / McKinsey）
          x: 3.9
          'y': 3.2
          description: 提供战略转型与定制系统集成，但人工成本高、软件复用性有限。
          tone: neutral
