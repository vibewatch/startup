      - number: '1.4'
        title: 运营里程碑与不利风险因素
        blocks:
          - type: paragraph
            body: >-
              Invisible Technologies 的公司发展轨迹清晰：2015 年从精品后台运营支持起步，2021 至 2024 年转向基础模型后训练，最终在 2025 和 2026
              年进入全栈智能体企业自动化。不过，独立市场评论指出估值阻力显著：超过 $2 billion 的定价对应 2024 年收入（$134 million）约 15 倍的隐含倍数。在私募市场支撑这一溢价倍数，要求
              Invisible 证明自己能实现可规模化且毛利率较高的软件业务，而不是依赖劳动密集型服务收入。此外，行业观察人士强调部署阻力很大：据估计，70%
              的企业软件仍深陷传统架构，自动化智能体接入会遭遇严重的数据碎片化和组织惯性。对此，Invisible 通过强调深度领域专长、生产工作流集成和持续后训练评估，与高产量标注老牌厂商 Scale AI 拉开差异。
            claimRefs:
