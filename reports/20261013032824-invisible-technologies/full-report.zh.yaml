      - CM002
      - CM004
      - CM006
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按工作流编排深度与人类专家专业化程度，对企业 AI 运营、训练数据平台与自动化替代方案进行定位。
    xAxis: 工作流编排与代理式执行深度
    yAxis: 人类专家专业化与领域 RLHF
    data:
      points:
        - label: Invisible Technologies
          x: 4.2
          'y': 4.1
          description: 将多模块工作流平台与专业专家市场、前置部署工程结合。
          tone: positive
        - label: Scale AI
          x: 2.8
          'y': 3.8
          description: 领先的训练数据平台，为前沿模型提供大规模合成数据集与人工标注数据集。
          tone: neutral
        - label: Surge AI
          x: 2.2
          'y': 3.9
          description: 专注于基础模型 RLHF 对齐与提示词评分，但不提供广泛的工作流编排。
          tone: neutral
        - label: Hyperscience
          x: 3.2
