      - number: '3.4'
        title: 切换成本、锁定效应与网络防御力
        blocks:
          - type: paragraph
            body: >-
              Invisible 的切换成本来自深度运营嵌入，而不是专有模型权重。企业一旦用 Neuron 将分散的公司数据库映射为统一本体，再依靠 Atomic
              固化机构异常逻辑，要替换平台就必须重构底层业务流程。此外，前置部署工程师直接嵌入客户运营部门，会形成很强的组织熟悉度和运营信任。在多个基础模型实验室之间实现多重合作——包括已核实的 Microsoft、AWS 和
              Cohere 项目——进一步巩固 Invisible 的定位，因为这会积累商业 LLM 在生产中失效位置的宝贵机构经验。这种跨实验室视角构成了对单一生态软件工具的可防御壁垒，为 Invisible
              带来单一供应商集成商无法匹敌的前沿模型对齐洞察。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.5'
        title: 商品化风险与不利竞争压力
        blocks:
          - type: paragraph
            body: >-
              尽管企业业务势头强劲，Invisible 仍面临与交付模式固有劳动密集度相关的重大不利风险。纯软件平台的边际成本接近于零，而 Invisible
              的混合模式需要持续招募、评估和管理分散的人工专家，还要承担昂贵的前置部署工程师成本。公司早期披露承认，在流程标准化前，早期运营曾严重超支交付成本。此外，公开承包商评价持续暴露运营摩擦，包括管理沟通、任务分配节奏不稳定和承包商薪酬缺乏可预测性。随着基础模型开发商增强原生智能体推理能力、传统
              RPA 厂商纳入生成式模型，Invisible 持续承受压力，必须证明其人工参与流水线能够提供不会被标准化自主智能体软件商品化的持久 ROI。
