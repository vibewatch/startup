  - id: FM001
    title: 市场规模分层与可触达支出
    type: pyramid
    summary: 将宏观企业 AI 基础设施支出逐层拆解至 Invisible 已获取的商业收入基线。
    data:
      items:
        - label: 全球企业 IT 与软件现代化
          value: $1T+ Total Enterprise IT Spend
          detail: 面向数字化转型、遗留应用现代化与运营流程再造的全球企业 IT 预算池。
          tone: neutral
        - label: 企业 AI 基础设施 TAM
          value: $50B+ in 2025 expanding to $200B by 2030
          detail: 包括云计算、数据工程、模型开发与企业代理式平台在内的 AI 基础设施宏观市场。
          tone: neutral
        - label: 定制工作流自动化与流程现代化
          value: $15B - $25B Enterprise Addressable Market
          detail: 用于替代人工知识工作与脆弱遗留自动化系统的可触达企业预算。
          tone: positive
        - label: 企业代理式流程编排 SAM
          value: $5B - $10B Serviceable Addressable Market
          detail: 需要软件工作流映射与弹性专家人在回路验证结合的核心可触达细分市场。
          tone: positive
        - label: 前沿模型对齐与专项后训练
          value: $3.5B - $5B Foundation Model Alignment Spend
          detail: 头部模型构建者用于领域专家 RLHF、多模态数据集整理与生产环境红队测试的专项支出。
          tone: positive
        - label: 已获取商业收入运行率（SOM 基线）
          value: $134M 2024 Revenue ($2B+ Valuation Round)
          detail: 已披露收入基线，体现其从头部前沿实验室与《财富》500 强企业客户中持续获取商业收入。
          tone: positive
    approximationNotes: 市场 TAM 估计引用 Tech Company News（$50B+，到 2030 年增至 $200B）；SAM 反映可触达的流程自动化支出；SOM 基线代表公司披露的 2024 年 $134M 收入。
