      - number: '3.3'
        title: 能力对比与定价架构
        blocks:
          - type: paragraph
            body: >-
              评估企业替代方案，必须拆解能力广度如何映射到采购包装和商业合同条款。不同于按用户席位收费的传统 SaaS 厂商，也不同于按小时人工费收费的传统 BPO 厂商，Invisible 采用 AWS
              Marketplace 合同架构所体现的混合商业模式。客户账单拆成两个彼此独立的部分：用于平台访问和工作流编排的经常性平台许可费，以及反映专家人力使用量、按小时计量的 AI
              训练费用。对于高管运营支持，最低承诺从每月 $2,000 起；多年期企业合同则采用定制年度条款。这种混合合同架构增加了采购复杂度，同时仍能相较不可预测的定制系统集成咨询提供成本透明度。
