  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示客户工作流需求如何经由模块化平台与专家层，转化为商业账单与毛利率。
    data:
      nodes:
        - id: n1
          label: 客户接入
          description: 企业识别人工密集、例外繁多的业务流程或数据标注工作负载
        - id: n2
          label: 数据结构化（Neuron）
          description: Neuron 平台接入并转换非结构化、多来源企业数据，生成机器可用格式
        - id: n3
          label: 流程映射（Atomic）
          description: Atomic 以可视化方式映射机构业务逻辑，将员工执行步骤编码
        - id: n4
          label: 专家执行（Meridial）
          description: 全球专家网络按需提供 RLHF、领域标注与人工监督
        - id: n5
          label: 模型评测（Synapse）
          description: Synapse 执行自动化测试与人工验证，评估质量、安全性与基准准确度
        - id: n6
          label: 代理式自动化（Axon）
          description: Axon 编排受治理的自主代理，让其在企业系统中执行生产任务
        - id: n7
          label: 混合收入实现
          description: 变现来自固定的平台访问订阅，并叠加按量计费的训练与执行时长
    approximationNotes: 平台工作流顺序基于 AWS Marketplace 定价机制与模块化产品架构；各项成本占比与利润贡献反映未经验证的私人估计。
    claimRefs:
      - CI006
      - CI007
      - CI009
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Invisible Platform 的模块化架构栈，覆盖数据准备、工作流编排、专家监督、评测与受治理的代理部署。
    data:
      layers:
        - label: 第 1 层：企业数据准备（Neuron）
          detail: 接入、清理并结构化碎片化的多来源企业数据，形成受治理的 AI 本体
        - label: 第 2 层：流程映射与编排（Atomic）
          detail: 可视化流程构建器映射运营工作流，在 AI 模型与专家之间路由任务
        - label: 第 3 层：人在回路专家网络（Meridial）
          detail: 按需调度 24,000+ 名经过审核的领域专家，用于 RLHF、数据标注与边缘案例处理
        - label: 第 4 层：持续模型评测（Synapse）
          detail: 按质量、安全性与运营标准进行自动化基准测试和并列评分
        - label: 第 5 层：受治理的代理部署（Axon）
          detail: 自主代理执行多步任务，并提供客户隔离、版本控制与完整审计轨迹
        - label: 第 6 层：交付与集成接口（FDE 与云 SaaS）
          detail: 前置部署工程与 AWS Marketplace SaaS 订阅部署结合
    approximationNotes: 基于已发布产品文档与 AWS Marketplace 架构清单，对 Invisible Technologies 模块化平台栈的概念呈现。
