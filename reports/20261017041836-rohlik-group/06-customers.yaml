company:
  name: Rohlik Group
chapter:
  number: 6
  title: Customers
  summary: >-
    Rohlik has credible public proof of real consumer adoption across five grocery
    markets, with official and independent sources showing customer and order
    volume at production scale rather than pilot scale. The weak point is not
    demand existence but durability visibility: public sources still do not give
    diligence-grade churn, cohort, concentration, or named external Veloq
    customer proof.
sections:
  - id: segment-footprint
    title: Consumer households remain the core customer base
    body: >-
      The public evidence still points to Rohlik as a direct-to-consumer grocery
      operator first and a B2B platform story second. Its published country
      contact structure separates customer and partner/company routes by market,
      while the named operating brands stay consumer-facing: Rohlik.cz in
      Czechia, Kifli.hu in Hungary, Gurkerl.at in Austria, Knuspr.de in Germany,
      and Sezamo.ro in Romania. Expansion materials for Sezamo show how Rohlik
      enters new cities by launching a full-basket household proposition rather
      than by layering onto another retailer's customer base. Veloq adds an
      adjacent retailer-technology segment, but the assigned sources still frame
      it as commercialization of internally proven demand rather than a disclosed
      book of external customers.
    claimRefs: [CU001, CU002, CU011, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Public adoption proof is real, but period definitions move around
    body: >-
      Adoption signals are directionally strong across the assigned sources even
      though the disclosed units are not perfectly comparable. Rohlik said it had
      already crossed 1 million active customers and almost 10 million orders by
      April 2022, while ESM later reported more than 800,000 customers and 11.5
      million orders for FY2023. The newer Veloq sources refresh the scale story
      through platform throughput rather than consumer cohorts, citing more than
      1.3 million monthly orders in 2025 and 2.1 million monthly orders in 2026.
      That is enough to show ongoing production demand, but not enough to build a
      clean same-population funnel from households to repeat orders to retention.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-production-proof
    title: Named proof is mostly market-level production evidence, not logo-only references
    body: >-
      Because Rohlik is a B2C grocery company, the best public "named customer"
      evidence is usually a named operating market or brand rather than a
      corporate account reference. That is weaker than a SaaS-style customer case
      study, but it still distinguishes production deployment from generic logo
      use. Rohlik.cz, Kifli.hu, Knuspr.de, and the Sezamo launches are all tied
      to live delivery operations, and Germany has enough disclosed traction to
      look post-pilot rather than experimental. The B2B exception is Veloq:
      public sources show an operating platform and financing momentum, but they
      still stop short of naming external grocery customers already live on it.
    claimRefs: [CU001, CU011, CU013, CU015, CU016]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability looks plausible, but concentration and retention are still under-disclosed
    body: >-
      The durability story is more suggestive than auditable. Rohlik's own 2022
      update claimed NPS above 70 across all markets and cited strong retention,
      while Čupr's 2023 interview tied loyalty to localized assortment and
      one-stop-shop convenience. Sacra extends that logic by describing Rohlik
      Xtra as a frequency and basket-size flywheel. Even so, the assigned sources
      never publish NRR, GRR, churn, contract length, or market-level cohort
      curves, and they do not quantify top-customer or channel concentration.
      That means the customer thesis depends on scale economics and market
      execution more than on independently verified retention disclosures.
    claimRefs: [CU008, CU009, CU010, CU012, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Mature household markets (Czechia and Hungary)
        - Urban households; the same customer usually buys, receives, and consumes the basket
        - Recurring full-basket weekly grocery shop
        - ">1m active customers disclosed at group level by Apr-2022; Czechia profitable since 2018 and Hungary since 2021"
        - Core proof that Rohlik can convert repeat household demand into profitable operations
        - No market-level active-customer split, reorder cohorts, or retention by acquisition channel
      - - Scaling western markets (Germany and Austria)
        - Urban households buying same-day grocery delivery
        - Large-basket online supermarket with tight delivery windows
        - Germany and Austria are included in group order/customer disclosures; Munich later reported profitable by FY2023
        - Strategic expansion markets that test whether the model scales outside the home market
        - No current market-specific customer count, churn, or CAC-to-LTV disclosure
      - - New-market launch households (Sezamo in Italy and Romania)
        - New city households targeted at first-service availability
        - Household grocery replacement at launch with localized assortment
        - Close to 2.5m households in Milan and Bucharest were targeted at launch in 2022
        - Expansion wedge for future customer acquisition and wallet-share growth
        - Launch-era evidence is stale and does not prove present-day active usage
      - - B2B grocery-platform prospects (Veloq)
        - Retailers or grocers that would license fulfillment, last-mile, and e-commerce software
        - External commercialization of Rohlik's internal operating stack
        - Public proof focuses on internal five-country scale and financing rather than named live retailers
        - Could create higher-margin customer expansion beyond Rohlik's own grocery operations
        - No named external customer, contracted ARR, or reference deployment disclosed
    notes: >-
      Mixes current and historical public evidence; group-level customer metrics
      are not broken out by market or segment, and null-like gaps reflect missing
      public disclosure rather than zero demand.
    claimRefs: [CU001, CU002, CU011, CU013, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Active customers
        - Over 1 million
        - 2022-04
        - Rohlik Group official update
        - High
        - Confirms production-scale consumer base before Sezamo rollouts
        - No by-market split or repeat-order distribution
      - - Orders delivered
        - Almost 10 million over the prior 12 months
        - 2022-04
        - Rohlik Group official update
        - High
        - Indicates frequent repeat behavior, not only one-off trials
        - No orders-per-customer or retained-customer cohort
      - - Customers and orders
        - More than 800,000 customers and 11.5 million orders
        - FY2023
        - ESM citing Rohlik performance
        - Medium
        - Shows demand remained large after the pandemic period
        - FY2023 definition is not directly bridged to the 2022 active-customer metric
      - - Internal network throughput
        - Over 1.3 million monthly orders across five countries
        - 2025-06
        - Rohlik Veloq launch
        - Medium
        - Refreshes current operating scale with a live platform metric
        - No disclosed bridge from orders to active households or retention
      - - Internal network throughput
        - 2.1 million orders a month across five markets
        - 2026-06
        - RTIH citing Veloq / LinkedIn
        - Medium
        - Suggests continued scale growth into 2026
        - No audited reconciliation to consumer customer counts
      - - Active customers (estimate)
        - Over 1.2 million across five markets
        - 2025
        - Sacra estimate
        - Medium
        - Supports continued household adoption after the 2022-2024 disclosures
        - Estimated, not company-audited
      - - Order frequency (estimate)
        - 14-15 orders annually per customer
        - 2025
        - Sacra estimate
        - Medium
        - Implies habitual use rather than pure emergency top-up
        - No cohort spread, churn, or subscription-retention detail
    notes: >-
      Public metrics come from different periods and definitions; treat the row
      set as directional adoption evidence, not a single normalized funnel.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Rohlik.cz households
        - Mature B2C market
        - Full-basket weekly grocery delivery in Czechia
        - Production
        - Included in the >1m group customer base and part of the profitable home market
        - No standalone customer count, NRR, or cohort retention published
      - - Kifli.hu households
        - Mature B2C market
        - Same-day online supermarket for Hungarian households
        - Production
        - Hungary was already profitable by 2021 and part of the high-NPS group footprint
        - No disclosed renewal, churn, or market-specific order cadence
      - - Knuspr.de households (Munich / Frankfurt)
        - Scaling B2C market
        - Full-basket grocery delivery with automated fulfillment support
        - Production
        - Munich hit 1,000 orders/day in 2021 and was later reported profitable by FY2023
        - Current Germany customer count and cohort durability remain undisclosed
      - - Sezamo households in Milan and Bucharest
        - Expansion B2C market
        - New-city launch of household grocery delivery
        - Production launch / early rollout
        - Close to 2.5m households were targeted at launch with 8,000 items from day one
        - Launch evidence is historical and not proof of today's scale
      - - External grocer prospects for Veloq
        - Emerging B2B platform segment
        - Licensing of fulfillment, last-mile, and e-commerce operating stack
        - Commercialization stage; named live customer not disclosed
        - Platform is proven internally at scale and backed by dedicated financing
        - No named retailer reference, go-live date, or contract value is public
    notes: >-
      Partial enumeration limited to named market/brand proofs and Veloq
      references explicitly present in the assigned prefetched sources for this
      run; B2C grocery rarely exposes individual household references publicly.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to named consumer brands and platform references explicitly
        present in the assigned prefetched sources for this run.
    claimRefs: [CU001, CU011, CU013, CU015, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Rohlik's loop starts with city-level availability and a full-basket trial,
      then expands through convenience and loyalty mechanics, while Veloq remains
      a separate commercialization branch with thinner named customer proof.
    data:
      items:
        - label: City availability and brand entry
          actor: Urban household buyer
          phase: Acquisition
          touchpoints:
            - Market-specific brand such as Rohlik.cz, Kifli.hu, Knuspr.de, or Sezamo
            - Same-day grocery promise only matters where warehouse coverage exists
        - label: First full-basket trial
          actor: Household buyer and user
          phase: First order
          touchpoints:
            - Large assortment positioned as a one-stop weekly shop
            - 60-90 minute delivery or tight same-day windows
        - label: Repeat convenience habit
          actor: Returning household
          phase: Repeat usage
          touchpoints:
            - Localized assortment reduces the need to visit multiple stores
            - Reported order volumes imply repeated use rather than one-off sampling
        - label: Loyalty and wallet-share expansion
          actor: Higher-frequency household
          phase: Expansion
          touchpoints:
            - Xtra subscription, private-label discounts, and bigger basket behavior
            - Public evidence suggests expansion logic, but not audited cohort curves
        - label: Market-by-market scaling
          actor: New-city household cohorts
          phase: Geographic rollout
          touchpoints:
            - Sezamo launch template in Milan and Bucharest
            - Germany shows traction moving beyond pilot conditions
        - label: B2B platform externalization via Veloq
          actor: Retailer prospect
          phase: Adjacent segment
          touchpoints:
            - Fulfillment, last-mile, and e-commerce stack proven inside Rohlik
            - Named external customer proof is still missing
    claimRefs: [CU002, CU009, CU010, CU013, CU016]
callouts:
  - calloutType: strength
    title: Production demand is proven
    body: >-
      Public sources support real consumer adoption rather than logo theater:
      Rohlik disclosed more than 1 million active customers and almost 10
      million orders by Apr-2022, ESM later cited 11.5 million FY2023 orders,
      and Veloq materials still anchor on live monthly order flow in 2025-2026.
    claimRefs: [CU003, CU004, CU005, CU006]
  - calloutType: risk
    title: Durability is less auditable than demand
    body: >-
      Retention, churn, concentration, and named external Veloq customers remain
      under-disclosed, so the customer story is directionally strong but not yet
      diligence-grade on cohort durability.
    claimRefs: [CU008, CU012, CU013, CU014]
