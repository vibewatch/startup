  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer households remain the core customer base
        blocks:
          - type: paragraph
            body: >-
              The public evidence still points to Rohlik as a direct-to-consumer grocery operator first and a B2B
              platform story second. Its published country contact structure separates customer and partner/company
              routes by market, while the named operating brands stay consumer-facing: Rohlik.cz in Czechia, Kifli.hu in
              Hungary, Gurkerl.at in Austria, Knuspr.de in Germany, and Sezamo.ro in Romania. Expansion materials for
              Sezamo show how Rohlik enters new cities by launching a full-basket household proposition rather than by
              layering onto another retailer's customer base. Veloq adds an adjacent retailer-technology segment, but
              the assigned sources still frame it as commercialization of internally proven demand rather than a
              disclosed book of external customers.
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU011
              - CU013
              - CU016
      - number: '6.2'
        title: Public adoption proof is real, but period definitions move around
        blocks:
          - type: paragraph
            body: >-
              Adoption signals are directionally strong across the assigned sources even though the disclosed units are
              not perfectly comparable. Rohlik said it had already crossed 1 million active customers and almost 10
              million orders by April 2022, while ESM later reported more than 800,000 customers and 11.5 million orders
              for FY2023. The newer Veloq sources refresh the scale story through platform throughput rather than
              consumer cohorts, citing more than 1.3 million monthly orders in 2025 and 2.1 million monthly orders in
              2026. That is enough to show ongoing production demand, but not enough to build a clean same-population
              funnel from households to repeat orders to retention.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU013
              - CU016
      - number: '6.3'
        title: Named proof is mostly market-level production evidence, not logo-only references
        blocks:
          - type: paragraph
            body: >-
              Because Rohlik is a B2C grocery company, the best public "named customer" evidence is usually a named
              operating market or brand rather than a corporate account reference. That is weaker than a SaaS-style
              customer case study, but it still distinguishes production deployment from generic logo use. Rohlik.cz,
              Kifli.hu, Knuspr.de, and the Sezamo launches are all tied to live delivery operations, and Germany has
              enough disclosed traction to look post-pilot rather than experimental. The B2B exception is Veloq: public
              sources show an operating platform and financing momentum, but they still stop short of naming external
              grocery customers already live on it.
            claimRefs:
              - CU001
              - CU011
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU011
              - CU013
              - CU015
              - CU016
      - number: '6.4'
        title: Durability looks plausible, but concentration and retention are still under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The durability story is more suggestive than auditable. Rohlik's own 2022 update claimed NPS above 70
              across all markets and cited strong retention, while Čupr's 2023 interview tied loyalty to localized
              assortment and one-stop-shop convenience. Sacra extends that logic by describing Rohlik Xtra as a
              frequency and basket-size flywheel. Even so, the assigned sources never publish NRR, GRR, churn, contract
              length, or market-level cohort curves, and they do not quantify top-customer or channel concentration.
              That means the customer thesis depends on scale economics and market execution more than on independently
              verified retention disclosures.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU012
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Production demand is proven
            body: >-
              Public sources support real consumer adoption rather than logo theater: Rohlik disclosed more than 1
              million active customers and almost 10 million orders by Apr-2022, ESM later cited 11.5 million FY2023
              orders, and Veloq materials still anchor on live monthly order flow in 2025-2026.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Durability is less auditable than demand
            body: >-
              Retention, churn, concentration, and named external Veloq customers remain under-disclosed, so the
              customer story is directionally strong but not yet diligence-grade on cohort durability.
            calloutType: risk
            claimRefs:
              - CU008
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital intensity and platform commercialization sit at the top of the stack
        blocks:
          - type: paragraph
            body: >-
              The clearest residual risk in the public evidence is that Rohlik is still funding a scale-and-automation
              strategy that depends on outside capital staying available. Management's 2022 Series D messaging tied the
              raise directly to automation, electric mobility, and continued expansion, and the 2026 EIB top-up shows
              that lender-backed scale-up financing remains part of the playbook. That would be less concerning if
              Rohlik were only maintaining a stable domestic grocery business, but the same 2026 evidence set also shows
              Veloq being commercialized to third-party grocers in Europe and the United States. The risk is therefore
              not just balance-sheet dependence; it is that Rohlik is simultaneously carrying grocery execution,
              automation deployment, and external platform go-to-market risk.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR011
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Automation is both the mitigation and the execution bottleneck
        blocks:
          - type: paragraph
            body: >-
              Rohlik has real scale, which raises the blast radius of any execution miss. The company said it had more
              than 1 million active customers and almost 10 million orders in the 12 months to April 2022, while
              independent coverage later reported €700 million of 2023 revenue and 11.5 million orders across five
              markets. At the same time, the company's own update said fulfilment-centre automation in Munich, Hamburg,
              and Prague would cost €45 million in 2022 alone, with hundreds of millions more planned later. Independent
              reporting that Munich became profitable after automation is a genuine positive signal, but it also means
              rollouts, commissioning delays, or weaker-than-expected warehouse economics can still hit service levels,
              margin progression, and expansion confidence.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
      - number: '7.3'
        title: The compliance surface is broad, but public disclosure is thin
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows Rohlik operating through named entities in the Czech Republic, Austria,
              Hungary, Germany, and Romania, and management is explicit that it wants to be a pan-European retailer.
              That footprint implies food-safety, labour, privacy, consumer-protection, and logistics obligations across
              several jurisdictions. What the public pool does not provide is the companion evidence an investor would
              need to downgrade the risk: market-specific licences, inspection histories, privacy or cyber control
              artefacts, disclosed litigation schedules, or clear incident reporting. The right reading is not that a
              problem exists, but that public silence cannot be treated as clearance, especially when the company is now
              also pushing its platform into third-party grocer environments.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations exist, but the thesis still needs hard monitoring triggers
        blocks:
          - type: paragraph
            body: >-
              There are credible mitigation signals in the record: repeated investor support, EIB willingness to extend
              venture debt, proof that automation can improve market economics, and a service proposition that appears
              to resonate with customers at scale. Those positives keep the risk picture investable rather than
              disqualifying. But they do not eliminate the need for explicit kill criteria. The thesis should
              deteriorate if Rohlik needs incremental financing before current automation and Veloq programs translate
              into durable unit economics, if Veloq fails to convert internal proof into external customers, or if
              diligence uncovers unresolved compliance incidents that the public evidence set does not currently
              surface.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding access is still a live dependency
            body: >-
              The 2026 EIB top-up is positive, but it also confirms that Rohlik is still pairing grocery execution with
              an externally financed automation roadmap. If capital markets tighten before Veloq or automation programs
              convert into stable cash generation, the downside can show up as slower rollout, weaker bargaining power,
              or deferred growth.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: callout
            title: 'Best public mitigation signal: automation appears to improve economics'
            body: >-
              Independent reporting that Munich became profitable after automated solutions were introduced is the
              strongest publicly visible mitigation signal in this chapter. It does not eliminate risk, but it suggests
              that Rohlik's automation thesis can work operationally when execution lands on time.
            calloutType: insight
            claimRefs:
              - CR003
              - CR009
          - type: callout
            title: Kill criteria for the investment case
            body: >-
              Escalate to a no-go if diligence shows unresolved market-specific compliance issues, if Veloq fails to
              convert internal proof into external customers, or if additional financing is required before current
              automation programs improve market-level unit economics.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context is fresher than valuation context
        blocks:
          - type: paragraph
            body: >-
              The assigned 2026 refresh pool is materially better at describing financing support than at proving a
              current equity value. The cleanest fresh signal is the European Investment Bank's additional EUR30 million
              venture-debt-style financing for Veloq, which lifts disclosed EIB support to EUR120 million and is
              explicitly tied to commercializing Rohlik's automation stack outside the captive grocery business. That is
              strategically helpful because it shows institutional confidence in the platform and gives Veloq runway for
              expansion, but it is not the same thing as a new priced equity round. The last directly disclosed equity
              valuation marker in the assigned public pool remains the 2022 Series D and a later trade-press reference
              to a mid-2022 EUR1.3 billion valuation, so current entry discipline has to start from incomplete price
              discovery rather than from a fresh market-clearing equity mark.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: The thesis is improving proof; the anti-thesis is disclosure and monetization risk
        blocks:
          - type: paragraph
            body: >-
              The bullish side of the case is that Rohlik still looks like one of the few European full-basket e-grocers
              with scale, repeatable service quality, and a credible technology narrative. Independent trade coverage
              says 2023 revenue reached EUR700 million with 25% year-on-year growth, while the 2026 EIB and Retail
              Technology Innovation Hub items describe roughly USD2 billion of revenue, around 30% growth, 2.1 million
              monthly orders, and 97% on-time delivery. An undated company-controlled LinkedIn profile separately states
              EUR750 million of annual revenue, which is useful only as a historical or unknown-vintage reference and
              should not be reconciled into the fresher 2026 metric. Those indicators support the idea that Rohlik has
              grown beyond a fragile concept. The anti-thesis is that management- and partner-controlled sources still
              do more work than hard public financial disclosure: the pool does not show audited group EBITDA,
              country-level P&Ls, current cash and covenant headroom, or external proof that Veloq already has enough
              third-party commercial traction to deserve software-like valuation treatment.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing supports tracking the company, not underwriting a precise price today
        blocks:
          - type: paragraph
            body: >-
              Scenario design is still possible, but precision is not. In the bull case, Rohlik converts its current
              grocery scale into a higher-quality blended story by proving that Veloq can sell beyond Rohlik's own
              network while preserving service metrics and profitability discipline. In the base case, the company keeps
              compounding revenues and operational quality but remains hard to price because public evidence still mixes
              old equity marks with new debt funding and platform-commercialization claims. In the bear case, investors
              discover that Germany and other expansion markets still absorb too much capital, or that Veloq's external
              adoption is slower than the narrative implies, which would leave the 2022-era valuation references looking
              rich rather than conservative. None of the retained sources provides a public-company multiple, M&A
              transaction benchmark, private secondary mark, or exit timetable, so a numerical valuation range or target
              return would be false precision. That combination supports tracking the business with strict entry
              discipline rather than endorsing a buy call on incomplete public evidence.
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Final call and thesis breakers
        blocks:
          - type: paragraph
            body: >-
              The right valuation stance is therefore fair-to-unclear rather than cheap. Rohlik has enough proof of
              scale and operating quality to stay on the investable list, but not enough public disclosure to justify
              paying up on faith. The last step from "strong company" to "investable at this price" is evidence, not
              storytelling: investors need the current capitalization table, preference terms, latest audited
              profitability bridge, market-by-market cash burn, Veloq customer pipeline, and evidence that
              commercialization outside Rohlik itself is not merely an internal platform rebrand. If diligence shows
              real third-party Veloq contracts, durable group profitability, and a price that does not assume software
              multiples for an unproven external platform, the recommendation can upgrade. If those diligence asks fail,
              the thesis should break before capital is committed.
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports tracking, not paying up blindly
            body: >-
              Rohlik's latest public package proves scale and offers a credible Veloq upside option, but it still does
              not reveal the live equity valuation or the terms that determine investor returns. The right stance is to
              keep Rohlik in the funnel, insist on disciplined pricing, and upgrade only after the missing diligence
              package closes.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
