chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating scale
        blocks:
          - type: paragraph
            body: >
              Rohlik Group presents itself as a technology-led full-basket online grocer founded in Prague in 2014, and
              the FY2025 annual report shows the company has now concentrated that model in five operating countries
              rather than the broader launch pipeline described in 2022 materials. Across the Czech Republic, Hungary,
              Austria, Germany, and Romania, the group says it serves roughly nine major agglomerations under Rohlik.cz,
              Kifli.hu, Gurkerl.at, Knuspr.de, and Sezamo.ro. The public contact footprint remains Prague-centered,
              while the annual report frames the business as a Czech-domiciled group with online retail as its principal
              activity. Scale is now material enough that later chapters can treat Rohlik as a late-stage private
              operator rather than an early market-entry story: FY2025 revenue reached €1,479.7 million, active
              customers reached 1.4 million, and December 2025 monthly order volume exceeded 2 million. The operating
              story is therefore less about proving category demand and more about translating dense urban grocery
              operations into sustained group profitability and a repeatable technology platform.
