  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest boundary in this source pack is full-basket online grocery: Rohlik and its investor materials
              repeatedly frame the service as broad, scheduled household shopping rather than the instant-delivery,
              small-basket model that dominated parts of the sector narrative in 2021-2022. The included spend is weekly
              food and household-goods budget, supported by broad assortment, private label, and local-farmer supply.
              The excluded or adjacent categories are pure rapid-delivery top-ups, general courier spend without the
              grocery basket, and any unquantified upside from retail media. A second, newer boundary now matters for
              valuation: Veloq turns Rohlik's internal fulfilment stack into a sellable operating system for other
              grocers, which makes grocery-automation software an adjacency rather than proof that the consumer grocery
              TAM itself has been independently sized.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM015
          - type: table
            tableRef: TM001
