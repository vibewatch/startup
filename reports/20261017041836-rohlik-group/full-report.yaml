      - number: '1.2'
        title: Leadership, governance surface, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              Publicly disclosed leadership is concentrated around founder-CEO Tomáš Čupr and a compact management board
              spanning retail operations, finance, people, and technology. That gives investors a clear executive
              operating map, but the public evidence here is noticeably richer on management than on formal governance:
              retained sources identify management board members and country leads, yet do not disclose a full board
              composition, voting rights, or an updated post-refresh cap table. Founder dependence remains material
              because Čupr is still the primary external voice for strategy, financing, and long-term ambition, while
              the group is simultaneously commercializing Veloq and managing uneven market maturity across countries. In
              practice, diligence should treat succession depth, delegated decision rights, and the economics of the
              Veloq relationship as unresolved governance items rather than assume the current operating bench fully
              de-risks founder concentration.
            claimRefs:
