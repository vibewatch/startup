      - number: '1.3'
        title: Funding history, financial inflection, and milestone chronology
        blocks:
          - type: paragraph
            body: >
              The refresh evidence shows a business that has moved from financing-led scale-up to a more mixed story of
              operating inflection plus continued balance-sheet support. Historical company releases show Rohlik raised
              €100 million in Series C in 2021 and €220 million in Series D in 2022, with Sofina leading the latter and
              existing investors including Index Ventures and the founder participating. FY2025 then became the key
              transition year: adjusted EBITDA turned positive from December 2025, operating cash flow finished the year
              at +€12.7 million, and Veloq was launched as a standalone subsidiary in June 2025. But the annual report
              is explicit that profitability is still incomplete work, citing a €66.1 million net loss and Germany's
              need to reach stable cash generation. Post-year-end, shareholders added €50 million of new equity and the
              European Investment Bank committed another €30 million for Veloq, taking total EIB support to €120
              million. That combination makes the current stage best read as operationally improved but still
              financing-reliant, with valuation and capital structure still needing a dedicated refresh in later
              chapters.
            claimRefs:
