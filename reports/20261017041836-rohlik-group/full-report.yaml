      - number: '5.2'
        title: Operating architecture and Veloq platformization
        blocks:
          - type: paragraph
            body: >-
              The underlying architecture is explicitly full-stack and operator-owned. Rohlik states that it owns
              end-to-end operations and keeps technology in-house; public sources then describe the automation layers
              that sit behind that claim. At the operating level, the model links local sourcing, fulfilment-centre
              automation, warehouse execution, route planning, and customer support into one service chain. At the
              platform level, EIB and Rohlik now describe that same internal stack as Veloq: an AI-powered same-day
              grocery fulfilment platform with automated picking, warehouse execution, predictive inventory, e-commerce
              fulfilment, last-mile routing, and an orchestration layer for labour and dispatch. The key technology bet
              is that Rohlik can export a proven internal operating system to other grocers instead of remaining only a
              retailer.
            claimRefs:
              - CE003
              - CE005
              - CE006
