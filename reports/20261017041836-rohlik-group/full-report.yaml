      - number: '3.2'
        title: Rohlik's differentiation is full-basket convenience, not speed alone
        blocks:
          - type: paragraph
            body: >-
              Rohlik's own materials consistently frame the offer as competitive prices plus differentiated assortment,
              and the partner and independent sources broadly reinforce that lens. The company pairs 17,000-plus item
              breadth, local sourcing, and narrow delivery windows with a value message that claims price parity with
              brick-and-mortar competitors, while Sacra adds a subscription and private-label flywheel through Xtra.
              That makes Rohlik's closest benchmark the weekly family shop rather than a one-off urgent basket. Picnic
              and Košík are more comparable on full-basket intent, but Picnic gives up micro-time-slot precision and
              Košík is strongest in Czechia. Rewe and Billa can defend with incumbent store networks, yet the retained
              evidence does not show them matching Rohlik's cited freshness, local-sourcing, and slot-precision
