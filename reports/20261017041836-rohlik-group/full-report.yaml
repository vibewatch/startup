  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Veloq commercializes outside Rohlik while core grocery keeps compounding at strong service levels.
        - A higher multiple could be justified only if software-style revenue becomes externally evidenced.
        - External customer adoption still unproven; cap-table terms unknown.
        - Supported by fresh EIB funding and strong 2026 operating metrics.
      - - Base
        - Grocery scale stays solid and Veloq remains promising but not yet independently underwritable.
        - Investor should wait for price discipline because public evidence does not reveal a current equity mark.
        - Missing audited profit bridge and fresh valuation data.
        - Most consistent with the assigned public pool.
      - - Bear
        - Growth moderates, commercialization slips, or expansion markets consume more capital than expected.
        - Old 2022 valuation references could prove rich if no fresh equity sponsor resets the price.
        - Down-round risk, multiple compression, and financing-overhang risk.
        - Triggered if diligence cannot close the current disclosure gaps.
    notes: >-
      These scenarios are directional because the assigned pool does not expose a current equity valuation, exact net
      debt, or preference terms.
    claimRefs:
      - CV005
      - CV007
      - CV008
