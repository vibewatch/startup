            title: Rohlik's edge is the weekly-shop bundle, not just fast last mile
            body: >-
              The retained evidence repeatedly pairs broad assortment, local sourcing, and narrow delivery windows,
              which is a harder combination for both store-picking incumbents and quick-commerce apps to match
              simultaneously.
