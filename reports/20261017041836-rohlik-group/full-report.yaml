  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Rohlik's revenue model is anchored in full-basket online grocery retail under local country banners rather
              than a single cross-border storefront, with official contact pages listing operating entities in the Czech
              Republic, Austria, Hungary, Germany, and Romania. Public traction metrics show real scale but are
              disclosed in uneven snapshots: the company said it reached €490 million of net revenue, more than 1
              million active customers, and almost 10 million orders for the 12 months to April 2022, while ESM later
              reported €700 million of FY2023 revenue and 11.5 million orders from more than 800,000 customers. More
              recent EIB and RTIH materials move the discussion from historical retail traction to roughly $2 billion of
              revenue and about 2.1 million monthly orders, suggesting continued scaling but still not a clean, audited
              bridge across periods or business lines. Pricing disclosure remains directional rather than underwritable:
              official materials emphasize competitive prices in line with brick-and-mortar retail and a high-value
              assortment, yet public sources do not disclose current delivery fee cards, realized basket pricing,
              promotion intensity, or revenue-recognition policy by market.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI011
