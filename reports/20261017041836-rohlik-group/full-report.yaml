  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Rohlik sits closest to the high-convenience, high-basket-breadth corner, with Košík as the nearest direct peer in
      Czechia, incumbents lower on convenience, and quick commerce narrower on basket breadth.
    data:
      xAxis: Broader weekly-shop relevance / basket breadth →
      yAxis: Higher delivery convenience / slot precision →
      points:
        - name: Rohlik
          label: Rohlik
          x: 5
          'y': 4
          note: >-
            17,000+ items, 15-minute windows, 90-minute delivery in some markets, and company-claimed price parity with
            brick-and-mortar.
        - name: Košík.cz
          label: Košík.cz
          x: 4
          'y': 4
          note: Primary Czech competitor with 30-minute slots and loyalty/private-label discounts.
        - name: Picnic
          label: Picnic
          x: 4
          'y': 3
          note: Full-basket route-planned offer with free delivery over €45, but no micro-time slots in retained evidence.
        - name: Rewe Online
          label: Rewe Online
          x: 4
          'y': 2
          note: Largest incumbent threat by revenue in Sacra, with store-picking and broad urban footprint.
        - name: Billa Online
          label: Billa Online
          x: 3
          'y': 2
          note: Austria incumbent with next-day delivery, but weaker cited assortment/freshness differentiation.
        - name: Flink / Wolt
          label: Flink / Wolt
          x: 2
          'y': 5
          note: Fastest top-up convenience in retained evidence, but narrower shopping mission and smaller baskets.
    approximationNotes: >-
      Ordinal 1-5 positioning is an evidence-backed judgment, not a third-party benchmark: the x axis reflects
      weekly-shop relevance and assortment breadth, and the y axis reflects delivery convenience and slot precision.
