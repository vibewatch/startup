      - number: '5.3'
        title: Maturity, rollout, and external tech signal
        blocks:
          - type: paragraph
            body: >-
              Product maturity is best evidenced through operational rollout rather than open technical documentation.
              Official and independent coverage both tie automation investment to real deployment: Rohlik earmarked €45
              million for fulfilment-centre automation in Munich, Hamburg, and Prague in 2022, and independent reporting
              later said Munich turned profitable after automated solutions were introduced, with similar rollout
              planned for Berlin and Vienna. The 2026 EIB release goes further by framing Veloq as a commercial scale-up
              opportunity for other grocers, while Rohlik's public LinkedIn surface shows continuing tech-community
              activity across AI, data, DevOps, and product meetups. That is a useful practitioner proxy, but it is not
              the same as public APIs, open-source repos, or named third-party platform customers.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Quality controls and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Publicly evidenced controls skew toward service quality and freshness rather than enterprise assurance.
              Rohlik describes high slot and product availability, low replacements and incompleteness, instant
              self-service refunds, and rapid replenishment from farmers and producers as differentiators; LinkedIn
              posts also highlight sustainability operations such as an upcycling category across five markets. Those
              signals support customer-experience discipline, but the assigned evidence pool does not document security
              certifications, privacy controls, public uptime reporting, or integration documentation for Veloq. The two
              net-new startup-data sources are only weakly useful for technical diligence: Parsers.vc mostly aggregates
              financing headlines, while the Linqto page contains obvious placeholder fields. For this chapter, the
              technical moat is more credible than the external documentation package around it.
            claimRefs:
