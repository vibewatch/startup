      - number: '2.2'
        title: Observed sizing lenses, not a clean TAM
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence is good enough to show a large and still-scaling operating envelope, but not good
              enough to defend a single headline TAM number. Index Ventures described more than EUR 300 million of 2020
              revenue and 750,000 customers across three markets; Rohlik's 2022 release pushed that to EUR 490 million
              of net revenue, over 1 million active customers, and almost 10 million orders; ESM later reported EUR 700
              million of 2023 revenue and 11.5 million orders across five countries. By 2026, the EIB and Retail
              Technology Innovation Hub were describing roughly 2.1 million monthly orders and around USD 2 billion of
              revenue. Those are strong lower-bound sizing lenses for category proof and expansion capacity, but they
              still mix company definitions, years, and units rather than yielding a neutral TAM/SAM/SOM. Sifted's 2021
              profile of Rohlik as a startup "massively ramping up its expansion plans across continental Europe" adds
              independent support for the scale narrative, but still stops short of a market-sizing benchmark.
