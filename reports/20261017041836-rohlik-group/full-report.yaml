      - number: '3.3'
        title: The moat is real but partial because cost structure and shopping mission can split
        blocks:
          - type: paragraph
            body: >-
              The best evidence for moat durability is that Rohlik's model combines operating density, automation, and
              software in one stack rather than depending on store labor alone. Public sources show the model maturing
              from Czech profitability to later reported profitability in Munich after automation, and Veloq suggests
              that Rohlik may be able to export its operating system beyond its own banners. Even so, the moat is
              partial rather than absolute. Store-based incumbents can defend with lower fulfillment-center capex, and
              quick-commerce apps can still win the urgent top-up mission even if they do not replace the weekly shop.
              The biggest remaining diligence gaps are not theoretical but practical: there is no independent
              basket-level price benchmark against Rewe, Picnic, or Košík in the assigned evidence, and there is no
              public multi-homing or churn data to show how sticky Rohlik really is.
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP011
              - CP014
              - CP015
