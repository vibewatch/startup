  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - 2023 revenue growth and 2026 operating metrics imply genuine scale rather than a fragile pilot.
        - Upgrade if audited profit conversion and market-by-market durability are supplied.
      - - Thesis
        - Veloq now has explicit EIB-backed commercialization funding, which supports a platform option value.
        - Upgrade if third-party customer wins and contracted software economics become public.
      - - Anti-thesis
        - >-
          Public valuation evidence is stale because the latest fresh signal is venture debt rather than a new priced
          equity round.
        - Improve if management shares current valuation, preferences, and dilution terms.
      - - Anti-thesis
        - The pool still lacks audited group EBITDA, country P&Ls, and external proof of Veloq monetization.
        - Downgrade if diligence shows losses or slow platform adoption are larger than implied.
      - - Anti-thesis
        - >-
          No retained source supplies a comparable-company multiple, M&A benchmark, private secondary mark, or exit
          timetable.
        - Set a range only after current transaction evidence and an exit path can be underwritten.
    notes: >-
      The table separates operating quality from entry price; a good company can still be a bad deal if the current
      valuation or preference stack is unknown.
