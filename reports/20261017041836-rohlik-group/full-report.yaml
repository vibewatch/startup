  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Rohlik's loop starts with city-level availability and a full-basket trial, then expands through convenience and
      loyalty mechanics, while Veloq remains a separate commercialization branch with thinner named customer proof.
    data:
      items:
        - label: City availability and brand entry
          actor: Urban household buyer
          phase: Acquisition
          touchpoints:
            - Market-specific brand such as Rohlik.cz, Kifli.hu, Knuspr.de, or Sezamo
            - Same-day grocery promise only matters where warehouse coverage exists
        - label: First full-basket trial
          actor: Household buyer and user
          phase: First order
          touchpoints:
            - Large assortment positioned as a one-stop weekly shop
            - 60-90 minute delivery or tight same-day windows
        - label: Repeat convenience habit
          actor: Returning household
          phase: Repeat usage
          touchpoints:
            - Localized assortment reduces the need to visit multiple stores
            - Reported order volumes imply repeated use rather than one-off sampling
        - label: Loyalty and wallet-share expansion
          actor: Higher-frequency household
          phase: Expansion
          touchpoints:
            - Xtra subscription, private-label discounts, and bigger basket behavior
            - Public evidence suggests expansion logic, but not audited cohort curves
        - label: Market-by-market scaling
          actor: New-city household cohorts
          phase: Geographic rollout
          touchpoints:
            - Sezamo launch template in Milan and Bucharest
            - Germany shows traction moving beyond pilot conditions
        - label: B2B platform externalization via Veloq
          actor: Retailer prospect
          phase: Adjacent segment
          touchpoints:
            - Fulfillment, last-mile, and e-commerce stack proven inside Rohlik
            - Named external customer proof is still missing
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU013
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Capital-provider dependence and automation-plus-platform execution remain the most severe residual exposures in
      the public evidence set.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-24 months.
        - label: Impact
          detail: Potential damage to growth, margin, or investability.
        - label: Mitigation maturity
          detail: How much real evidence of mitigation is already visible.
        - label: Residual exposure
          detail: Remaining risk after visible mitigations.
      rows:
        - label: Capital intensity / financing dependency
          values:
            - High
            - High
            - Medium
            - High
          note: Repeated equity and venture-debt funding support expansion but keep funding access strategic.
        - label: Automation and Veloq execution
          values:
            - Medium
            - High
            - Medium
            - High
          note: Munich profitability is a positive sign, but new rollouts and external commercialization add execution load.
        - label: Compliance / disclosure opacity
          values:
            - Medium
            - High
            - Low
            - Medium-high
          note: Public silence on incidents or licences is a diligence gap, not proof of absence.
        - label: Service reliability at scale
          values:
            - Medium
            - High
            - Medium
            - High
          note: Same-day delivery promises create immediate customer-visible downside if operations slip.
        - label: Multi-country operating complexity
          values:
            - Medium
            - Medium-high
            - Medium
            - Medium-high
          note: Five-country operations expand labour, supplier, and local execution surfaces.
        - label: External Veloq customer adoption
          values:
            - Medium
            - High
            - Low
            - Medium-high
          note: Third-party customer proof remains less visible than Rohlik's internal operating proof.
    claimRefs:
      - CR004
      - CR005
      - CR009
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong operating proof is offset by incomplete price discovery and unresolved diligence gaps.
    data:
      nodes:
        - label: 2023 growth proof
          detail: EUR700 million revenue and 25% year-on-year growth in 2023.
        - label: 2026 operating proof
          detail: Around USD2 billion revenue, roughly 30% growth, 2.1 million monthly orders, and 97% on-time delivery.
        - label: Financing support
          detail: EIB top-up adds EUR30 million and brings disclosed EIB support to EUR120 million.
        - label: Strategy ambition
          detail: Management still frames Rohlik as a pan-European retailer plus technology platform.
        - label: Price opacity
          detail: No current public equity valuation, cap-table terms, or audited profit bridge in the assigned pool.
        - label: Recommendation
          detail: Track with strict entry discipline until fresh price and profitability evidence exist.
