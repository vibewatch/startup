        - year: '2021'
          label: Series C and Czech unicorn milestone
          detail: Company said it raised €100 million in Series C in July 2021 and became the first Czech unicorn.
          tone: positive
          claimRefs:
            - CO012
        - date: '2022-04-27'
          label: Scale passes 1 million active customers
          detail: >-
            Company said it ended the fiscal year with over 1 million active customers, almost 10 million orders, and
            €490 million in net revenues.
          tone: positive
          claimRefs:
