  - id: FI001
    title: Revenue model bridge from customer baskets to capital needs
    type: flow
    summary: >-
      Rohlik's public story is a bridge from dense grocery demand to automation-driven profitability, with undisclosed
      cash and Veloq contract economics still sitting at the end of the chain.
    data:
      nodes:
        - id: baskets
          label: Customer baskets and order frequency
          valueNote: >-
            Public snapshots moved from more than 1 million active customers and almost 10 million orders in Apr-2022 to
            11.5 million orders in FY2023.
        - id: retail-revenue
          label: Core grocery revenue
          valueNote: >-
            Revenue disclosure stepped from €490m net revenue in Apr-2022 to €700m in FY2023 and around $2bn in 2026
            lender/company materials.
        - id: pricing
          label: Basket pricing and service monetization
          valueNote: >-
            Official evidence supports value pricing and fast delivery windows, but not current fee cards or realized
            price realization.
        - id: fulfillment
          label: Fulfillment automation and last-mile cost
          valueNote: Automation is the primary public margin lever; Brightpick says targeted labor needs fell by more than 80%.
        - id: market-profit
          label: Market-level profitability
          valueNote: >-
            Public evidence points to profitability in the Czech Republic, Hungary, and Munich, not a fully disclosed
            group margin.
        - id: capital
          label: Group cash needs and Veloq scale-up
          valueNote: >-
            EIB support reached €120m, while public cash, burn, covenants, ARR, and software contribution margin remain
            undisclosed.
      edges:
        - from: baskets
          to: retail-revenue
          label: Basket size and frequency convert into retail sales.
        - from: retail-revenue
          to: pricing
          label: Realized prices, promotions, and slot monetization determine revenue quality.
        - from: pricing
          to: fulfillment
          label: Delivery promise and assortment breadth drive cost to serve.
        - from: fulfillment
          to: market-profit
          label: Automation, waste control, and density determine contribution margin.
        - from: market-profit
          to: capital
          label: Expansion pace and software rollout determine external financing need.
    approximationNotes: >-
      This flow is qualitative because the assigned public pool does not disclose a full numerical bridge from revenue
      to gross profit, EBITDA, and cash burn.
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI008
      - CI010
      - CI011
      - CI014
