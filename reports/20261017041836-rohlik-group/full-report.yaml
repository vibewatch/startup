      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The consumer layer is relatively simple: the same household is usually the buyer, user, and payer, because
              Rohlik is trying to replace recurring grocery trips with a one-stop online basket that remains
              price-competitive with stores. The harder segmentation question is on the Veloq side, where the end user
              is an operations organisation and the buyer is more likely a retail COO, supply-chain leader, or
              technology owner trying to automate picking, inventory, and routing. That matters because the adoption
              path is not just consumer preference for convenience; it also depends on whether grocers believe same-day
              fulfilment can be run profitably enough to justify automation budgets and a platform transition.
            claimRefs:
              - CM004
              - CM010
