      - number: '4.2'
        title: Cost structure, automation, and market-level profitability
        blocks:
          - type: paragraph
            body: >-
              The public margin narrative is coherent, but it remains driven mostly by company and partner-adjacent
              sources rather than audited statements. Brightpick's case study is the clearest outside articulation of
              Rohlik's operating logic: manual picking is described as an expensive sector burden, while Rohlik says
              warehouse robots have cut labor needs by more than 80% across targeted processes, and that careful
              city-by-city rollout helps reduce upfront losses. Official statements align with that framing by pointing
              to €45 million of automation capex in 2022 and continued investment in Berlin and Vienna in 2024. The
              company has repeatedly framed profitability as market-specific rather than groupwide, with the Czech
              business profitable since 2018, Hungary since 2021, and Munich profitable by the 2023 reporting cycle.
              That is constructive for gross-margin path and contribution economics, but it does not substitute for
              disclosed consolidated EBITDA, gross margin, fulfillment cost per order, CAC, payback, or working-capital
              intensity.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI010
              - CI011
      - number: '4.3'
        title: Capital needs, financing dependency, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Capital intensity remains a live issue even though public materials now emphasize profitability in
              selected markets. The most decision-useful 2026 evidence is not an equity round but lender documentation:
              the EIB says its €30 million top-up brought total support to Rohlik to €120 million, explicitly as
              scale-up venture debt tied to Veloq's commercial rollout. Tracxn also records a January 2025 $92 million
              venture debt round and a $1.6 billion current valuation, but those database metrics are not reconciled to
              audited filings and should be treated as directional rather than definitive. Public employee-count proxies
              are similarly noisy, with Tracxn and LinkedIn offering different views of labor scale. The forward case is
              therefore intelligible but not fully underwritable: Veloq likely creates a second monetization path beyond
              grocery retail, yet public materials stop short of ARR, customer count, contribution margin, or
              signed-contract disclosure, and no public source in the assigned pool closes the gap on group cash, burn,
              runway, debt covenants, or market-by- market profitability.
            claimRefs:
              - CI010
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer proposition
        blocks:
          - type: paragraph
            body: >-
              Rohlik sells a full-basket online grocery experience rather than a narrow instant-delivery SKU set. Across
              Rohlik.cz, Kifli.hu, Gurkerl.at, Knuspr.de, and Sezamo.ro, the customer proposition is broad weekly-shop
              coverage, fast delivery windows, and a curated mix of supermarket staples, local produce, and private
              label. Company-issued sources are directionally consistent on the core offer: 17,000-plus to 25,000-plus
              SKUs depending on the cited surface, 15-minute same-day windows, and delivery as soon as 60 to 90 minutes
              in some markets. That makes the product definition more operational than app-centric: assortment breadth,
              inventory freshness, slot availability, and order completion quality matter as much as the front-end
              storefront.
            claimRefs:
              - CE001
              - CE002
              - CE003
