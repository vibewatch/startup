  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is fragmented by mission, geography, and operating model
        blocks:
          - type: paragraph
            body: >-
              Rohlik's competitive set is broader than "online grocery" as a single category. The cited sources place it
              against store-picking incumbents such as Rewe Online and Billa Online, against full-basket online
              supermarkets such as Košík.cz and Picnic, against quick-commerce specialists such as Flink and Wolt, and
              increasingly against technology alternatives such as grocery operators licensing software rather than
              copying Rohlik's operating stack. That matters because Rohlik does not enter markets under one
              pan-European banner: the official materials show separate local brands and entities across Czech Republic,
              Hungary, Austria, Germany, and Romania, so the closest direct rival changes by market. The strongest
              direct peer pressure appears to come from companies that can credibly serve the weekly shop, while
              quick-commerce apps remain a flank on urgent top-up use cases.
            claimRefs:
