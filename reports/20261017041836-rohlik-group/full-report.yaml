      - number: '2.4'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers in the source pack are convenience without basket shrinkage, broad assortment,
              same-day reliability, price parity with brick-and-mortar alternatives, and automation that can widen
              margin headroom as order density increases. The main constraints are just as visible: Rohlik disclosed EUR
              45 million of automation capex for 2022, said it would continue investing substantially in automation in
              2024, and still used EIB scale-up financing in 2026 to commercialise Veloq. In parallel, customer counts
              are not disclosed in a perfectly comparable way across years, and the assigned pool lacks an independent,
              methodologically clear TAM/SAM/SOM split for full-basket e-grocery in Rohlik's live markets. That keeps
              the market thesis credible but not clean enough for a single oversized valuation slide.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM013
              - CM014
