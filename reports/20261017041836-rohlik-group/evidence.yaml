evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, voting rights, observer rights, and a current cap table after the post-year-end equity
      injection.
    whyItMatters: Founder concentration and financing control cannot be assessed cleanly from management names alone.
    diligencePath: >-
      Request the latest board list, shareholder register, financing term summaries, and any investor-rights side
      letters.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-metrics
    missingEvidence: >-
      A precise current headcount, market-by-market employee split, and a fresh public valuation or marked financing
      round.
    whyItMatters: Cover metrics drive stage assessment, operating leverage analysis, and valuation triangulation in later chapters.
    diligencePath: Request monthly headcount by market and function, plus the latest board-approved valuation or financing deck.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Independent, methodologically explicit market-size estimates for full-basket e-grocery in Rohlik's live
      geographies, ideally split from instant delivery and general retail e-commerce.
    whyItMatters: >-
      Without a neutral TAM/SAM/SOM, valuation framing relies on operating-scale proxies instead of a clearly bounded
      category model.
    diligencePath: >-
      Obtain analyst, trade-association, or government category data for Czechia, Hungary, Austria, Germany, and Romania
      and reconcile it against Rohlik's market definition.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-metric-definitions
    missingEvidence: A consistent company definition for active customers, customers, and households across the 2022-2026 disclosures.
    whyItMatters: Customer-count inconsistency makes penetration, repeat-frequency, and market-share inference unreliable.
    diligencePath: >-
      Ask management or obtain audited KPI definitions that bridge the 2022 active-customer disclosure to the later 2023
      and 2026 operating updates.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: veloq-commercialisation
    missingEvidence: >-
      Contracted external Veloq customers, ARR, implementation timelines, and margin contribution outside Rohlik's own
