      - ["Delivery precision", "15-minute windows and as fast as 90 minutes / within 3 hours in cited sources", "Click-and-collect, home delivery, or next-day windows in retained sources", "Picnic route planning without micro-slots; Košík has 30-minute slots in cited Czech comparison", "30-60 minute promises in retained sources"]
      - ["Value proposition", "Company says prices are in line with brick-and-mortar and Xtra/private label deepen value", "Exact online basket parity not established in retained sources", "Picnic's free delivery threshold and Košík's loyalty discounts are visible competitive levers", "Convenience-led rather than full-basket value in retained sources"]
      - ["Fresh / local sourcing", "Official and partner sources emphasize direct sourcing and local producers", "Retained evidence does not show equivalent freshness differentiation", "Not clearly established in retained sources", "Not clearly established in retained sources"]
      - ["Automation / proprietary tech", "Own end-to-end stack plus Veloq commercialization", "Store-picking lowers capex but retained sources do not show comparable standalone software moat", "Not clearly established in retained sources", "Not clearly established in retained sources"]
      - ["Trust / regulatory posture", "Not established in assigned public sources beyond company service-quality claims", "Not established in assigned public sources", "Not established in assigned public sources", "Not established in assigned public sources"]
    notes: >-
      Cells marked "not established" or similar are deliberate unknowns where the assigned pool did
      not provide corroborated comparative proof; they should not be read as negative judgments.
