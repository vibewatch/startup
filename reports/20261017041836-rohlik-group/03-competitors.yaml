    summary: >-
      Rohlik sits closest to the high-convenience, high-basket-breadth corner, with Košík as the
      nearest direct peer in Czechia, incumbents lower on convenience, and quick commerce narrower
      on basket breadth.
    data:
      xAxis: "Broader weekly-shop relevance / basket breadth →"
      yAxis: "Higher delivery convenience / slot precision →"
      points:
        - name: Rohlik
          label: Rohlik
          x: 5
          y: 4
          note: "17,000+ items, 15-minute windows, 90-minute delivery in some markets, and company-claimed price parity with brick-and-mortar."
        - name: "Košík.cz"
          label: "Košík.cz"
          x: 4
