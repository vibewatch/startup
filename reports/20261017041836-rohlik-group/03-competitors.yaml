      - [Picnic, "Free delivery over €45; exact relative basket pricing vs Rohlik unknown", "Route-planned delivery without micro-time slots", "Delivery threshold is explicit in retained evidence", "Appeals to planned shopping where slot precision matters less"]
      - ["Košík.cz", "Exact public basket pricing unavailable in retained evidence", "30-minute slots", "Free loyalty program centered on private-label discounts", "Closest Czech comparison on loyalty and convenience rather than disclosed price leadership"]
      - ["Rewe / Billa", "Exact online basket pricing unavailable in retained evidence", "Store-picking, home delivery, click-and-collect, or next-day windows depending on banner", "No comparable membership economics established in retained evidence", "Can defend with lower-capex fulfillment model even without Rohlik-like precision"]
      - ["Flink / Wolt", "Exact basket pricing unavailable in retained evidence", "30-60 minute delivery", "No full-basket loyalty program established in retained evidence", "Best fit for urgent top-up trips rather than the family weekly shop"]
    notes: >-
      This table compares public packaging and value signals, not audited realized pricing; the
      biggest unresolved gap is an independent basket-level benchmark by market.
    claimRefs: [CP006, CP007, CP008, CP009, CP012, CP013, CP015]
