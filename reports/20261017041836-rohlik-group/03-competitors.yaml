company:
  name: Rohlik Group
chapter:
  number: 3
  title: Competitors
  summary: >-
    Rohlik competes in a wider arena than instant-delivery apps alone: the strongest public
    evidence points to store-picking incumbents such as Rewe and Billa, direct full-basket peers
    such as Košík and Picnic, and quick-commerce specialists such as Flink and Wolt. The retained
    sources support a differentiated position around full-basket assortment, tight delivery windows,
    local sourcing, and proprietary automation, but they do not prove sustained basket-level price
    superiority or low multi-homing.
sections:
  - id: competitive-landscape
    title: Competitive landscape is fragmented by mission, geography, and operating model
    body: >-
      Rohlik's competitive set is broader than "online grocery" as a single category. The cited
      sources place it against store-picking incumbents such as Rewe Online and Billa Online,
      against full-basket online supermarkets such as Košík.cz and Picnic, against quick-commerce
      specialists such as Flink and Wolt, and increasingly against technology alternatives such as
      grocery operators licensing software rather than copying Rohlik's operating stack. That
      matters because Rohlik does not enter markets under one pan-European banner: the official
      materials show separate local brands and entities across Czech Republic, Hungary, Austria,
      Germany, and Romania, so the closest direct rival changes by market. The strongest direct
      peer pressure appears to come from companies that can credibly serve the weekly shop, while
      quick-commerce apps remain a flank on urgent top-up use cases.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP007, CP008, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: positioning-and-capabilities
    title: Rohlik's differentiation is full-basket convenience, not speed alone
    body: >-
      Rohlik's own materials consistently frame the offer as competitive prices plus differentiated
      assortment, and the partner and independent sources broadly reinforce that lens. The company
      pairs 17,000-plus item breadth, local sourcing, and narrow delivery windows with a value
      message that claims price parity with brick-and-mortar competitors, while Sacra adds a
      subscription and private-label flywheel through Xtra. That makes Rohlik's closest benchmark
      the weekly family shop rather than a one-off urgent basket. Picnic and Košík are more
      comparable on full-basket intent, but Picnic gives up micro-time-slot precision and Košík is
      strongest in Czechia. Rewe and Billa can defend with incumbent store networks, yet the
      retained evidence does not show them matching Rohlik's cited freshness, local-sourcing, and
      slot-precision combination.
    claimRefs: [CP002, CP006, CP007, CP009, CP012, CP013]
    tableRefs: [TP002, TP003]
  - id: durability-and-displacement-risk
    title: The moat is real but partial because cost structure and shopping mission can split
    body: >-
      The best evidence for moat durability is that Rohlik's model combines operating density,
      automation, and software in one stack rather than depending on store labor alone. Public
      sources show the model maturing from Czech profitability to later reported profitability in
      Munich after automation, and Veloq suggests that Rohlik may be able to export its operating
      system beyond its own banners. Even so, the moat is partial rather than absolute. Store-based
      incumbents can defend with lower fulfillment-center capex, and quick-commerce apps can still
      win the urgent top-up mission even if they do not replace the weekly shop. The biggest
      remaining diligence gaps are not theoretical but practical: there is no independent
      basket-level price benchmark against Rewe, Picnic, or Košík in the assigned evidence, and
      there is no public multi-homing or churn data to show how sticky Rohlik really is.
    claimRefs: [CP004, CP008, CP010, CP011, CP014, CP015]
