        - name: Rewe Online
          label: Rewe Online
          x: 4
          y: 2
          note: "Largest incumbent threat by revenue in Sacra, with store-picking and broad urban footprint."
        - name: Billa Online
          label: Billa Online
          x: 3
          y: 2
          note: "Austria incumbent with next-day delivery, but weaker cited assortment/freshness differentiation."
        - name: "Flink / Wolt"
          label: "Flink / Wolt"
          x: 2
          y: 5
          note: "Fastest top-up convenience in retained evidence, but narrower shopping mission and smaller baskets."
    approximationNotes: >-
      Ordinal 1-5 positioning is an evidence-backed judgment, not a third-party benchmark: the x
      axis reflects weekly-shop relevance and assortment breadth, and the y axis reflects delivery
      convenience and slot precision.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009, CP015]
callouts:
  - calloutType: strength
    title: Rohlik's edge is the weekly-shop bundle, not just fast last mile
    body: >-
      The retained evidence repeatedly pairs broad assortment, local sourcing, and narrow delivery
      windows, which is a harder combination for both store-picking incumbents and quick-commerce
      apps to match simultaneously.
    claimRefs: [CP002, CP009, CP013]
  - calloutType: risk
    title: Public evidence does not prove that Rohlik can win every wallet segment
    body: >-
      Incumbents can defend with lower-capex store networks, quick-commerce apps can own urgent
      top-up missions, and the assigned sources do not provide an independent basket-level price
      comparison or multi-homing data.
    claimRefs: [CP004, CP008, CP015]
