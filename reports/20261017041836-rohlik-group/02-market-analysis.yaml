company:
  name: Rohlik Group
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Rohlik's proven market is full-basket online grocery for household food spend,
    not instant top-up delivery, and the assigned evidence shows that proposition
    scaling from three countries and more than EUR 300 million of 2020 revenue to
    a five-market footprint that third parties described at around USD 2 billion of
    revenue in 2026. A 2021 Sifted profile also described Rohlik as a Czech online
    grocery startup massively ramping up expansion plans across continental Europe,
    which reinforces the growth narrative without turning it into a clean TAM study.
    The same source pack also expands the boundary into B2B grocery fulfilment
    software via Veloq, but it does not provide a neutral third-party TAM/SAM/SOM
    for full-basket e-grocery across Rohlik's geographies.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The cleanest boundary in this source pack is full-basket online grocery:
      Rohlik and its investor materials repeatedly frame the service as broad,
      scheduled household shopping rather than the instant-delivery, small-basket
      model that dominated parts of the sector narrative in 2021-2022. The
      included spend is weekly food and household-goods budget, supported by broad
      assortment, private label, and local-farmer supply. The excluded or adjacent
      categories are pure rapid-delivery top-ups, general courier spend without the
      grocery basket, and any unquantified upside from retail media. A second,
      newer boundary now matters for valuation: Veloq turns Rohlik's internal
      fulfilment stack into a sellable operating system for other grocers, which
      makes grocery-automation software an adjacency rather than proof that the
      consumer grocery TAM itself has been independently sized.
    claimRefs: [CM001, CM002, CM003, CM004, CM011, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Observed sizing lenses, not a clean TAM
    body: >-
      The assigned evidence is good enough to show a large and still-scaling
      operating envelope, but not good enough to defend a single headline TAM
      number. Index Ventures described more than EUR 300 million of 2020 revenue
      and 750,000 customers across three markets; Rohlik's 2022 release pushed that
      to EUR 490 million of net revenue, over 1 million active customers, and
      almost 10 million orders; ESM later reported EUR 700 million of 2023 revenue
      and 11.5 million orders across five countries. By 2026, the EIB and Retail
      Technology Innovation Hub were describing roughly 2.1 million monthly orders
      and around USD 2 billion of revenue. Those are strong lower-bound sizing
      lenses for category proof and expansion capacity, but they still mix company
      definitions, years, and units rather than yielding a neutral TAM/SAM/SOM.
      Sifted's 2021 profile of Rohlik as a startup "massively ramping up its
      expansion plans across continental Europe" adds independent support for the
      scale narrative, but still stops short of a market-sizing benchmark.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM013, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-budget-map
    title: Buyer, user, and payer segmentation
    body: >-
      The consumer layer is relatively simple: the same household is usually the
      buyer, user, and payer, because Rohlik is trying to replace recurring grocery
      trips with a one-stop online basket that remains price-competitive with
      stores. The harder segmentation question is on the Veloq side, where the end
      user is an operations organisation and the buyer is more likely a retail COO,
      supply-chain leader, or technology owner trying to automate picking,
      inventory, and routing. That matters because the adoption path is not just
      consumer preference for convenience; it also depends on whether grocers
      believe same-day fulfilment can be run profitably enough to justify
      automation budgets and a platform transition.
    claimRefs: [CM004, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and diligence gaps
    body: >-
      The main adoption drivers in the source pack are convenience without basket
      shrinkage, broad assortment, same-day reliability, price parity with
      brick-and-mortar alternatives, and automation that can widen margin headroom
      as order density increases. The main constraints are just as visible: Rohlik
      disclosed EUR 45 million of automation capex for 2022, said it would
      continue investing substantially in automation in 2024, and still used EIB
      scale-up financing in 2026 to commercialise Veloq. In parallel, customer
      counts are not disclosed in a perfectly comparable way across years, and the
      assigned pool lacks an independent, methodologically clear TAM/SAM/SOM split
      for full-basket e-grocery in Rohlik's live markets. That keeps the market
      thesis credible but not clean enough for a single oversized valuation slide.
    claimRefs: [CM002, CM009, CM010, CM013, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment/category
      - Included spend
      - Excluded spend
      - Buyer/payer
      - Relevance
    rows:
      - - Core full-basket e-grocery
        - Weekly household grocery baskets spanning fresh, ambient, local, and private-label products
        - Small-basket instant-delivery missions without the weekly basket
        - Household shopper / household food budget
        - This is the directly proven revenue base and the cleanest comparison set.
      - - Service-level convenience layer
        - Spend won by same-day delivery and tight delivery windows attached to the full basket
        - Generic courier spend without a differentiated assortment
        - Household shopper / household food budget
        - Speed matters, but the source pack says it works because breadth and reliability travel with it.
      - - Grocery-tech adjacency (Veloq)
        - Same-day fulfilment software, picking, inventory, and routing spend by grocers
        - General-purpose retail SaaS outside grocery operations
        - Retail operator / operations or automation budget
        - Important valuation upside, but separate from the core consumer basket market.
      - - Retail-media adjacency
        - Advertising or trade-marketing spend sold against Rohlik traffic
        - Core grocery basket revenue
        - CPG brand / trade-marketing budget
        - Mentioned as a pillar, but not yet quantified in the assigned evidence.
    notes: >-
      Sources define the core market directly; adjacencies are included only when
      the source pack explicitly mentions them, and unquantified adjacencies should
      not be folded into grocery TAM.
    claimRefs: [CM001, CM003, CM004, CM011, CM012, CM015]
  - id: TM002
    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Index Ventures
        - 2021 release on 2020 base
        - Czechia, Hungary, Austria
        - EUR 300m+ revenue; 750k customers; 3 markets
        - n/a
        - Investor announcement summarising observed operating scale
        - Medium
        - Historical operating print, not a neutral market-size study.
      - - Rohlik Group
        - 2022 fiscal-year release
        - Four live markets plus announced launches
        - EUR 490m net revenue; 1m+ active customers; almost 10m orders
        - 53% YoY
        - Company operating snapshot for the fiscal year ending April 2022
        - Medium
        - Company-defined active-customer metric and expansion-stage footprint.
      - - ESM Magazine
        - 2023
        - Five countries
        - EUR 700m revenue; 800k+ customers; 11.5m orders
        - 25% YoY revenue; 76% CAGR since 2015
        - Trade-press recap of reported company results
        - Medium
        - Customer definition appears narrower than the 2022 company disclosure.
      - - EIB / Retail Technology Innovation Hub
        - 2026
        - Five markets plus external-grocer adjacency
        - USD ~2bn revenue; 2.1m monthly orders
        - ~30% YoY
        - Latest operating-envelope lens anchored on Veloq throughput and scale-up
        - Medium
        - Mixed grocery and platform lens; still not a standalone TAM/SAM/SOM.
    notes: >-
      This table intentionally mixes observed company scale and platform-throughput
      lenses because the assigned pool lacks an independent category TAM for
      full-basket e-grocery across Rohlik's markets.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Weekly family grocery basket
        - Household shopper
        - Household or caregiver
        - Same household
        - Replace the planned supermarket trip with one online basket
        - Household grocery budget
        - Broad assortment, price parity, and reliable same-day slots
      - - Time-sensitive urban grocery mission
        - Household shopper
        - Household needing urgent or fresh delivery
        - Same household
        - Compress store travel and waiting into a short delivery window
        - Household grocery plus convenience budget
        - Speed without sacrificing full-basket breadth
      - - External grocers adopting Veloq
        - Retail operations or technology leader
        - Fulfilment, inventory, and last-mile teams
        - Grocer or retailer
        - Automate same-day grocery fulfilment and routing
        - Operations / automation / technology budget
        - Proof that same-day e-grocery can run profitably at scale
    notes: >-
      Consumer rows are inferred from the company's stated proposition; the Veloq
      row reflects a B2B adjacency with a different buyer and budget owner.
    claimRefs: [CM001, CM002, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Because the assigned evidence lacks a neutral TAM/SAM/SOM, the chapter uses
      six observed operating lenses to show the proven market envelope instead.
    data:
      items:
        - label: Five-country consumer footprint
          value: 5
          unit: markets
          detail: Live grocery brands in Czechia, Hungary, Austria, Germany, and Romania
          claimRefs: [CM003]
        - label: Historical proof point (2020)
          value: 300000000
          unit: EUR revenue+
          detail: 750k customers across 3 markets
          claimRefs: [CM005]
        - label: Scaled operating base (FY ended Apr 2022)
          value: 490000000
          unit: EUR revenue
          detail: 1m+ active customers and almost 10m orders
          claimRefs: [CM006]
        - label: Five-country delivery scale (2023)
          value: 700000000
          unit: EUR revenue
          detail: 800k+ customers and 11.5m orders
          claimRefs: [CM007, CM008]
        - label: Platform throughput lens (2026)
          value: 2100000
          unit: orders/month
          detail: Veloq running across 5 markets
          claimRefs: [CM010]
        - label: Latest operating envelope (2026)
          value: 2000000000
          unit: USD revenue
          detail: Around 30% YoY growth with external-grocer Veloq expansion
          claimRefs: [CM009, CM010]
    approximationNotes: >-
      The layers use mixed units by design: they are observed operating checkpoints,
      not an additive TAM/SAM/SOM waterfall, because the assigned pool does not
      provide a neutral third-party category sizing study.
    claimRefs: [CM003, CM005, CM006, CM007, CM008, CM009, CM010, CM013]
callouts:
  - calloutType: insight
    title: Two linked markets matter more than one generic TAM
    body: >-
      The evidence says Rohlik should be analysed as a consumer full-basket
      e-grocer plus an adjacent grocery-operating-system vendor through Veloq.
      That supports upside, but only the grocery layer is evidenced as a mature
      revenue base in this source pack.
    claimRefs: [CM004, CM010, CM012]
  - calloutType: risk
    title: The market story is credible but not yet cleanly benchmarked
    body: >-
      Rohlik's scale trajectory is well evidenced, yet the chapter still lacks an
      independent, methodologically explicit TAM/SAM/SOM and uses customer metrics
      that are not perfectly comparable across years, which limits precision in
      valuation framing.
    claimRefs: [CM006, CM008, CM014]
