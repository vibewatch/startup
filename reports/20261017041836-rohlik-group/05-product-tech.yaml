schemaVersion: report-v2
artifact: product-tech
slug: rohlik-group
runDate: 2026-10-17
company:
  name: Rohlik Group
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Rohlik's product is a full-basket online grocery service run through owned fulfilment, routing, and customer-service workflows,
    with a parallel push to externalize that operating stack as Veloq. The strongest current evidence supports fulfilment automation,
    AI-assisted orchestration, and cross-market operating maturity; the weakest public evidence is around security, privacy,
    integration, and external customer proof for the Veloq platform.
sections:
  - id: product-scope
    title: Product scope and customer proposition
    body: >-
      Rohlik sells a full-basket online grocery experience rather than a narrow instant-delivery SKU set. Across Rohlik.cz, Kifli.hu,
      Gurkerl.at, Knuspr.de, and Sezamo.ro, the customer proposition is broad weekly-shop coverage, fast delivery windows, and a
      curated mix of supermarket staples, local produce, and private label. Company-issued sources are directionally consistent on the
      core offer: 17,000-plus to 25,000-plus SKUs depending on the cited surface, 15-minute same-day windows, and delivery as soon as
      60 to 90 minutes in some markets. That makes the product definition more operational than app-centric: assortment breadth,
      inventory freshness, slot availability, and order completion quality matter as much as the front-end storefront.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and Veloq platformization
    body: >-
      The underlying architecture is explicitly full-stack and operator-owned. Rohlik states that it owns end-to-end operations and
      keeps technology in-house; public sources then describe the automation layers that sit behind that claim. At the operating level,
      the model links local sourcing, fulfilment-centre automation, warehouse execution, route planning, and customer support into one
      service chain. At the platform level, EIB and Rohlik now describe that same internal stack as Veloq: an AI-powered same-day
      grocery fulfilment platform with automated picking, warehouse execution, predictive inventory, e-commerce fulfilment, last-mile
      routing, and an orchestration layer for labour and dispatch. The key technology bet is that Rohlik can export a proven internal
      operating system to other grocers instead of remaining only a retailer.
    claimRefs: [CE003, CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-rollout
    title: Maturity, rollout, and external tech signal
    body: >-
      Product maturity is best evidenced through operational rollout rather than open technical documentation. Official and independent
      coverage both tie automation investment to real deployment: Rohlik earmarked €45 million for fulfilment-centre automation in
      Munich, Hamburg, and Prague in 2022, and independent reporting later said Munich turned profitable after automated solutions were
      introduced, with similar rollout planned for Berlin and Vienna. The 2026 EIB release goes further by framing Veloq as a
      commercial scale-up opportunity for other grocers, while Rohlik's public LinkedIn surface shows continuing tech-community
      activity across AI, data, DevOps, and product meetups. That is a useful practitioner proxy, but it is not the same as public
      APIs, open-source repos, or named third-party platform customers.
    claimRefs: [CE005, CE006, CE007, CE009, CE011, CE012, CE013]
  - id: controls-gaps
    title: Quality controls and diligence gaps
    body: >-
      Publicly evidenced controls skew toward service quality and freshness rather than enterprise assurance. Rohlik describes high
      slot and product availability, low replacements and incompleteness, instant self-service refunds, and rapid replenishment from
      farmers and producers as differentiators; LinkedIn posts also highlight sustainability operations such as an upcycling category
      across five markets. Those signals support customer-experience discipline, but the assigned evidence pool does not document
      security certifications, privacy controls, public uptime reporting, or integration documentation for Veloq. The two net-new
      startup-data sources are only weakly useful for technical diligence: Parsers.vc mostly aggregates financing headlines, while the
      Linqto page contains obvious placeholder fields. For this chapter, the technical moat is more credible than the external
      documentation package around it.
    claimRefs: [CE004, CE010, CE012, CE014]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Full-basket online grocery storefront, Household shopper, "Scaled in five markets", "Broad weekly-shop range plus fast delivery windows", "Need current per-market SKU counts and attach-rate mix"]
      - [Country brands (Rohlik/Kifli/Gurkerl/Knuspr/Sezamo), Local operating teams and customers, "Operating across CZ/HU/AT/DE/RO", "Localized go-to-market under shared group model", "Need current city-by-city coverage and launch economics"]
      - [Owned fulfilment and sourcing workflow, Operations and supplier network, "Core operating backbone", "End-to-end control over assortment, freshness, and refunds", "Need current fulfilment-centre count, automation depth, and supplier SLAs"]
      - [Veloq AI-native fulfilment platform, Internal ops today and third-party grocers next, "Commercial scale-up phase", "Operator-built grocery OS rather than single-point robotics tool", "Need named external customers, deployment references, and contract model"]
      - [Retail media pillar, Brand advertisers and group commercial team, "Mentioned publicly but underdocumented in pool", "Potential second software-like revenue stream alongside Veloq", "Need product specs, monetization model, and operating metrics"]
    notes: >-
      Status reflects what the assigned pool evidences publicly as of 2026-10-17; several rows combine official claims with only light
      independent corroboration, so missing deployment and monetization detail is treated as a diligence gap rather than filled in.
    claimRefs: [CE001, CE002, CE003, CE007, CE012]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Complete a full weekly grocery shop online", "Household splits basket across physical stores or narrow instant-delivery apps", "Single digital basket spanning supermarket goods, local produce, and private label", "17,000+ to 25,000+ SKUs and same-day delivery windows", "Current public evidence does not show category-level margin mix or substitution rates"]
      - ["Receive groceries on a predictable schedule", "Customer accepts broad half-day windows or store visit", "15-minute windows and delivery as soon as 60-90 minutes in some markets", "97% on-time delivery in Veloq-backed operations", "No public market-by-market SLA or failure-rate disclosure in pool"]
      - ["Buy fresher local products without separate specialty shopping", "Visit multiple local stores or markets", "Direct sourcing to fulfilment centres from farmers and producers", "Some goods delivered to fulfilment centres within 6 hours from harvesting or production", "Need verified spoilage/waste and supplier concentration data"]
      - ["Operate same-day e-grocery at scale", "Manual picking and fragmented tools across warehouse and last mile", "Automation plus in-house software orchestrating fulfilment, inventory, and routing", "2.1 million orders a month across five markets on Veloq-backed stack", "Independent technical validation is limited to press coverage and lender statements"]
      - ["External grocer wants modern same-day fulfilment stack", "Patchwork of hardware vendors and point solutions", "Veloq as externalized AI-native grocery fulfilment platform", "EIB financing explicitly targets commercial scale-up in Europe and the US", "No assigned source lists external customers, integration path, or implementation timeline"]
    notes: >-
      Benefits preserve source wording and ranges; where public materials stop at operator narrative or lender framing, the limitation
      column records the missing denominator instead of inferring performance.
    claimRefs: [CE002, CE004, CE007, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Customer promise layer", "Digital storefront with broad assortment and time-slot promise", "Accurate catalog, pricing, and slot logic", "Weak public evidence on API/integration design despite strong marketing claims"]
      - ["Supply and assortment layer", "Combines private label, supermarket goods, and local producers", "Supplier onboarding and replenishment discipline", "Fresh-food complexity raises spoilage and availability risk if forecasting slips"]
      - ["Fulfilment automation layer", "Automated picking and warehouse execution inside fulfilment centres", "Capex, robotics/process tuning, site rollout", "Rollout delays or underperforming sites can impair service and margins"]
      - ["AI orchestration layer", "Coordinates labour, dispatch, inventory, and execution decisions", "Reliable data capture across warehouse and last mile", "Black-box claims are hard to diligence without model governance or KPI documentation"]
      - ["Last-mile routing layer", "Turns picking output into same-day delivery windows", "Courier capacity and route optimization", "No public reliability dashboard or incident/postmortem evidence in assigned pool"]
      - ["Platformization layer (Veloq)", "Packages internal operating stack for other grocers", "External customer success, integration, support, and commercial model", "Public evidence does not yet show named reference customers or implementation case studies"]
    notes: >-
      This table separates observed operating layers from inferred technical interfaces; public evidence is strongest on fulfilment and
      routing functions and weakest on software assurance, integration, and governance artifacts.
    claimRefs: [CE003, CE005, CE007, CE008, CE013]
