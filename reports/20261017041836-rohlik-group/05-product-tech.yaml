callouts:
  - calloutType: strength
    title: Operator-built platform is the core product thesis
    body: >-
      Rohlik is no longer presenting technology as a support function only; Veloq packages the fulfilment, inventory, routing, and
      orchestration layers that were proven inside the grocery business and is now being financed for external scale-up.
    claimRefs: [CE007, CE008, CE009]
  - calloutType: risk
    title: Public evidence is strong on operating outcomes but thin on assurance artifacts
    body: >-
      The assigned pool substantiates automation rollout, delivery performance, and service-quality controls better than it
      substantiates security, privacy, uptime reporting, or external implementation references for Veloq.
    claimRefs: [CE005, CE010, CE014]
  - calloutType: insight
    title: Tech-community signal exists, but not open technical transparency
    body: >-
      RohlikTech meetups, hiring, and LinkedIn activity show an active tech organization, yet they remain a proxy signal because the
      pool lacks public repos, APIs, or deep engineering documentation.
    claimRefs: [CE012, CE014]
