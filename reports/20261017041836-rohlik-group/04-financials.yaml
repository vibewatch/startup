schemaVersion: "report-v2"
artifact: financials
slug: rohlik-group
runDate: "2026-10-17"
company:
  name: Rohlik Group
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a scaled full-basket grocery engine that moved from €490 million of
    net revenue in the 12 months to April 2022 to €700 million in FY2023 and around $2 billion
    of revenue in 2026 lender/company materials, but the underwriting file is still incomplete.
    Rohlik's margin story depends on automation, market-by-market profitability, and a new Veloq
    software monetization layer, while cash, burn, covenants, realized pricing, and country-level
    P&L remain undisclosed.
sections:
  - id: revenue-model
    title: Revenue model and public traction
    body: >-
      Rohlik's revenue model is anchored in full-basket online grocery retail under local country
      banners rather than a single cross-border storefront, with official contact pages listing
      operating entities in the Czech Republic, Austria, Hungary, Germany, and Romania. Public
      traction metrics show real scale but are disclosed in uneven snapshots: the company said it
      reached €490 million of net revenue, more than 1 million active customers, and almost
      10 million orders for the 12 months to April 2022, while ESM later reported €700 million of
      FY2023 revenue and 11.5 million orders from more than 800,000 customers. More recent EIB
      and RTIH materials move the discussion from historical retail traction to roughly $2 billion
      of revenue and about 2.1 million monthly orders, suggesting continued scaling but still not
      a clean, audited bridge across periods or business lines. Pricing disclosure remains
      directional rather than underwritable: official materials emphasize competitive prices in
      line with brick-and-mortar retail and a high-value assortment, yet public sources do not
      disclose current delivery fee cards, realized basket pricing, promotion intensity, or
      revenue-recognition policy by market.
    claimRefs: [CI001, CI002, CI003, CI004, CI011, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Cost structure, automation, and market-level profitability
    body: >-
      The public margin narrative is coherent, but it remains driven mostly by company and
      partner-adjacent sources rather than audited statements. Brightpick's case study is the
      clearest outside articulation of Rohlik's operating logic: manual picking is described as an
      expensive sector burden, while Rohlik says warehouse robots have cut labor needs by more
      than 80% across targeted processes, and that careful city-by-city rollout helps reduce
      upfront losses. Official statements align with that framing by pointing to €45 million of
      automation capex in 2022 and continued investment in Berlin and Vienna in 2024. The company
      has repeatedly framed profitability as market-specific rather than groupwide, with the Czech
      business profitable since 2018, Hungary since 2021, and Munich profitable by the 2023
      reporting cycle. That is constructive for gross-margin path and contribution economics, but
      it does not substitute for disclosed consolidated EBITDA, gross margin, fulfillment cost per
      order, CAC, payback, or working-capital intensity.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital needs, financing dependency, and underwriting gaps
    body: >-
      Capital intensity remains a live issue even though public materials now emphasize
      profitability in selected markets. The most decision-useful 2026 evidence is not an equity
      round but lender documentation: the EIB says its €30 million top-up brought total support to
      Rohlik to €120 million, explicitly as scale-up venture debt tied to Veloq's commercial
      rollout. Tracxn also records a January 2025 $92 million venture debt round and a $1.6
      billion current valuation, but those database metrics are not reconciled to audited filings
      and should be treated as directional rather than definitive. Public employee-count proxies
      are similarly noisy, with Tracxn and LinkedIn offering different views of labor scale. The
      forward case is therefore intelligible but not fully underwritable: Veloq likely creates a
      second monetization path beyond grocery retail, yet public materials stop short of ARR,
      customer count, contribution margin, or signed-contract disclosure, and no public source in
      the assigned pool closes the gap on group cash, burn, runway, debt covenants, or market-by-
      market profitability.
    claimRefs: [CI010, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current value/status
      - Revenue quality
      - Diligence ask
    rows:
      - - Core grocery baskets
        - Full-basket online grocery sales through Rohlik.cz, Kifli.hu, Gurkerl.at, Knuspr.de, and Sezamo.ro.
        - €490m net revenue for the 12 months to Apr-2022; €700m FY2023 revenue; around $2bn revenue in 2026 lender/company materials.
        - Largest and best-evidenced stream, but no audited group bridge by market, category, or recognition policy.
        - Audited revenue bridge by market, category mix, refunds, and recognition timing.
      - - Delivery and service monetization
        - Delivery windows, slot convenience, and service charges layered onto basket economics.
        - Public sources disclose speed promises and delivery windows, but not current fee cards, attach rates, or realized take rate.
        - Likely meaningful to unit economics, yet unusable for underwriting without fee disclosure and order-mix data.
        - Current fee schedule by market, fee-waiver logic, and percentage of orders paying for delivery or service.
      - - Fresh and private-label mix
        - Margin contribution from proprietary assortment, fresh categories, and local sourcing.
        - Official materials say fresh produce represented about 40% of sales in 2022; current private-label share is undisclosed.
        - Mix could support basket differentiation and margin, but perishables also raise shrink and working-capital risk.
        - Current category gross margin, waste by category, and private-label share of sales.
      - - Veloq B2B platform
        - Commercialization of Rohlik's fulfillment software, automation, and routing stack to other grocers.
        - EIB/RTIH confirm scale-up intent and operating proof points, but no ARR, pricing model, contract term, or customer count is public.
        - Strategically important, but revenue quality is currently untestable from public evidence.
        - Signed customers, pricing basis, implementation services mix, renewal profile, and contribution margin.
    notes: >-
      Public sources mix official claims, lender disclosures, and third-party summaries; rows mark
      undisclosed revenue mechanics explicitly instead of estimating them.
    claimRefs: [CI001, CI002, CI003, CI004, CI011, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Item
      - Public pricing evidence
      - List vs realized pricing
      - Unknowns / caveat
      - Source
    rows:
      - - Basket price position
        - Official materials say Rohlik's prices are in line with brick-and-mortar competition and built around great value.
        - List-price posture only; no realized basket margin, promotional cadence, or net price realization is disclosed.
        - Without current price cards or realized basket data, public evidence cannot distinguish value positioning from margin sacrifice.
        - 2022 Series D release; Business Fundamentals page
      - - Average order value
        - Rohlik said AOV topped 85 EUR in Western European markets in 2022.
        - Historical realized-value proxy, not current pricing disclosure.
        - No market-by-market AOV update, order-frequency mix, or inflation bridge is public in the assigned pool.
        - 2022 customers/orders release
      - - Delivery promise and slot economics
        - Official materials highlight 85% of orders within 90 minutes or 15-minute same-day windows.
        - Service promise disclosed; fee monetization undisclosed.
        - Fast windows may aid conversion, but the economics of subsidized delivery remain opaque.
        - 2022 Series D release
      - - Veloq monetization
        - EIB and RTIH show Veloq moving into commercial scale-up for grocers across Europe and the US.
        - No public price per site, per order, subscription tier, or services attachment.
        - Public evidence confirms product intent, not repeatable software revenue quality.
        - EIB 2026 press release; RTIH 2026 article
    notes: >-
      This is a pricing-evidence table, not a realized-price table; public materials emphasize
      value and delivery promises far more than they disclose actual monetization terms.
    claimRefs: [CI004, CI005, CI011, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - AOV proxy
        - AOV topped 85 EUR in Western European markets in 2022.
        - Medium
        - Basket size is a core indicator of order density, contribution margin, and delivery efficiency.
        - Current AOV by market, order frequency, and mix shift since 2022.
      - - Fulfillment labor leverage
        - Brightpick says manual picking averages 8% of revenue in the sector and Rohlik says robots cut targeted labor needs by more than 80%.
        - Medium
        - Fulfillment labor is one of the largest controllable costs in online grocery.
        - Labor cost per order before and after automation by site.
      - - Food waste
        - Brightpick quotes market-leading food waste of 0.4%.
        - Medium
        - Shrink control is critical when fresh produce is a large share of sales.
        - Waste by category, accounting treatment, and verification source outside partner/company channels.
      - - Market-level profitability
        - Czech profitable since 2018, Hungary since 2021, and Munich profitable by the 2023 reporting cycle.
        - High
        - Confirms the model can work in selected cities, but not that the whole group is sustainably profitable.
        - Market P&L by city/country, including Germany outside Munich.
      - - Throughput and service quality
        - Around 2.1 million orders a month and 97% on-time delivery in 2026 Veloq materials.
        - High
        - Scale and reliability are prerequisites for fixed-cost absorption and software commercialization.
        - Orders, on-time rate, and contribution margin by market and fulfillment-center cohort.
      - - Group cash / burn / covenants
        - null
        - Low
        - These inputs determine runway and next-round timing even if selected markets are profitable.
        - Cash on hand, burn, net debt, debt covenants, and committed capex by market.
    notes: >-
      Null means the assigned public pool did not disclose the metric in a way suitable for
      underwriting; historical or company-quoted proxies are kept separate from missing private
      evidence.
    claimRefs: [CI005, CI006, CI008, CI010, CI011]
figures:
  - id: FI001
    title: Revenue model bridge from customer baskets to capital needs
    type: flow
    summary: >-
      Rohlik's public story is a bridge from dense grocery demand to automation-driven
      profitability, with undisclosed cash and Veloq contract economics still sitting at the end
      of the chain.
    data:
      nodes:
        - id: baskets
          label: Customer baskets and order frequency
          valueNote: >-
            Public snapshots moved from more than 1 million active customers and almost 10 million
            orders in Apr-2022 to 11.5 million orders in FY2023.
        - id: retail-revenue
          label: Core grocery revenue
          valueNote: >-
            Revenue disclosure stepped from €490m net revenue in Apr-2022 to €700m in FY2023 and
            around $2bn in 2026 lender/company materials.
        - id: pricing
          label: Basket pricing and service monetization
          valueNote: >-
            Official evidence supports value pricing and fast delivery windows, but not current fee
            cards or realized price realization.
        - id: fulfillment
          label: Fulfillment automation and last-mile cost
          valueNote: >-
            Automation is the primary public margin lever; Brightpick says targeted labor needs fell
            by more than 80%.
        - id: market-profit
          label: Market-level profitability
          valueNote: >-
            Public evidence points to profitability in the Czech Republic, Hungary, and Munich, not
            a fully disclosed group margin.
        - id: capital
          label: Group cash needs and Veloq scale-up
          valueNote: >-
            EIB support reached €120m, while public cash, burn, covenants, ARR, and software
            contribution margin remain undisclosed.
      edges:
        - from: baskets
          to: retail-revenue
          label: Basket size and frequency convert into retail sales.
        - from: retail-revenue
          to: pricing
          label: Realized prices, promotions, and slot monetization determine revenue quality.
        - from: pricing
          to: fulfillment
          label: Delivery promise and assortment breadth drive cost to serve.
        - from: fulfillment
          to: market-profit
          label: Automation, waste control, and density determine contribution margin.
        - from: market-profit
          to: capital
          label: Expansion pace and software rollout determine external financing need.
    approximationNotes: >-
      This flow is qualitative because the assigned public pool does not disclose a full numerical
      bridge from revenue to gross profit, EBITDA, and cash burn.
    claimRefs: [CI003, CI005, CI006, CI008, CI010, CI011, CI014]
