artifact: valuation
slug: rohlik-group
runDate: 2026-10-17
company:
  name: Rohlik Group
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rohlik's assigned 2026 evidence shows a scaled, still-growing operator with
    improving proof points around profitability and a potentially valuable Veloq
    software layer, but it does not reveal a current equity price, preference
    stack, or audited profit bridge. The evidence therefore supports a
    price-sensitive track stance rather than a conviction buy.
sections:
  - id: financing-and-price-discovery
    title: Financing context is fresher than valuation context
    body: >-
      The assigned 2026 refresh pool is materially better at describing financing
      support than at proving a current equity value. The cleanest fresh signal is
      the European Investment Bank's additional EUR30 million venture-debt-style
      financing for Veloq, which lifts disclosed EIB support to EUR120 million and
      is explicitly tied to commercializing Rohlik's automation stack outside the
      captive grocery business. That is strategically helpful because it shows
      institutional confidence in the platform and gives Veloq runway for
      expansion, but it is not the same thing as a new priced equity round. The
      last directly disclosed equity valuation marker in the assigned public pool
      remains the 2022 Series D and a later trade-press reference to a mid-2022
      EUR1.3 billion valuation, so current entry discipline has to start from
      incomplete price discovery rather than from a fresh market-clearing equity
      mark.
    claimRefs: [CV001, CV002, CV005, CV006, CV008, CV009, CV014]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: The thesis is improving proof; the anti-thesis is disclosure and monetization risk
    body: >-
      The bullish side of the case is that Rohlik still looks like one of the few
      European full-basket e-grocers with scale, repeatable service quality, and a
      credible technology narrative. Independent trade coverage says 2023 revenue
      reached EUR700 million with 25% year-on-year growth, while the 2026 EIB and
      Retail Technology Innovation Hub items describe roughly USD2 billion of
      revenue, around 30% growth, 2.1 million monthly orders, and 97% on-time
      delivery. An undated company-controlled LinkedIn profile separately states
      EUR750 million of annual revenue, which is useful only as a historical or
      unknown-vintage reference and should not be reconciled into the fresher
      2026 metric. Those indicators support the idea that Rohlik has grown beyond
      a fragile concept. The anti-thesis is that management- and partner-controlled
      sources still do more work than hard public financial disclosure: the pool
      does not show audited group EBITDA, country-level P&Ls, current cash and
      covenant headroom, or external proof that Veloq already has enough
      third-party commercial traction to deserve software-like valuation
      treatment.
    claimRefs: [CV003, CV004, CV007, CV010, CV011, CV012, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-entry-discipline
    title: Scenario framing supports tracking the company, not underwriting a precise price today
    body: >-
      Scenario design is still possible, but precision is not. In the bull case,
      Rohlik converts its current grocery scale into a higher-quality blended story
      by proving that Veloq can sell beyond Rohlik's own network while preserving
      service metrics and profitability discipline. In the base case, the company
      keeps compounding revenues and operational quality but remains hard to price
      because public evidence still mixes old equity marks with new debt funding
      and platform-commercialization claims. In the bear case, investors discover
      that Germany and other expansion markets still absorb too much capital, or
      that Veloq's external adoption is slower than the narrative implies, which
      would leave the 2022-era valuation references looking rich rather than
      conservative. None of the retained sources provides a public-company
      multiple, M&A transaction benchmark, private secondary mark, or exit
      timetable, so a numerical valuation range or target return would be false
      precision. That combination supports tracking the business with strict entry
      discipline rather than endorsing a buy call on incomplete public evidence.
    claimRefs: [CV003, CV005, CV007, CV008, CV009, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: final-diligence-asks
    title: Final call and thesis breakers
    body: >-
      The right valuation stance is therefore fair-to-unclear rather than cheap.
      Rohlik has enough proof of scale and operating quality to stay on the
      investable list, but not enough public disclosure to justify paying up on
      faith. The last step from "strong company" to "investable at this price" is
      evidence, not storytelling: investors need the current capitalization table,
      preference terms, latest audited profitability bridge, market-by-market cash
      burn, Veloq customer pipeline, and evidence that commercialization outside
      Rohlik itself is not merely an internal platform rebrand. If diligence shows
      real third-party Veloq contracts, durable group profitability, and a price
      that does not assume software multiples for an unproven external platform,
      the recommendation can upgrade. If those diligence asks fail, the thesis
      should break before capital is committed.
    claimRefs: [CV008, CV013, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Metric, Assessment, Decision implication]
    rows:
      - ["Recommendation", "Track", "Strong business quality but incomplete public price discovery."]
      - ["Confidence", "Medium", "Evidence is directionally positive but current valuation terms are not public."]
      - ["Risk rating", "High", "Expansion, platform commercialization, and financing structure still matter."]
      - ["Valuation stance", "Fair to unclear", "Fresh debt support exists; fresh priced equity evidence does not."]
      - ["Upgrade trigger", "Fresh audited disclosure plus current price", "Upgrade only if diligence proves profitability quality and acceptable terms."]
    notes: >-
      Assessment uses only the assigned prefetched valuation pool; public debt,
      stale equity references, and missing cap-table terms are not interchangeable.
    claimRefs: [CV005, CV008, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Thesis", "2023 revenue growth and 2026 operating metrics imply genuine scale rather than a fragile pilot.", "Upgrade if audited profit conversion and market-by-market durability are supplied."]
      - ["Thesis", "Veloq now has explicit EIB-backed commercialization funding, which supports a platform option value.", "Upgrade if third-party customer wins and contracted software economics become public."]
      - ["Anti-thesis", "Public valuation evidence is stale because the latest fresh signal is venture debt rather than a new priced equity round.", "Improve if management shares current valuation, preferences, and dilution terms."]
      - ["Anti-thesis", "The pool still lacks audited group EBITDA, country P&Ls, and external proof of Veloq monetization.", "Downgrade if diligence shows losses or slow platform adoption are larger than implied."]
      - ["Anti-thesis", "No retained source supplies a comparable-company multiple, M&A benchmark, private secondary mark, or exit timetable.", "Set a range only after current transaction evidence and an exit path can be underwritten."]
    notes: >-
      The table separates operating quality from entry price; a good company can
      still be a bad deal if the current valuation or preference stack is unknown.
    claimRefs: [CV003, CV005, CV007, CV008, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Veloq commercializes outside Rohlik while core grocery keeps compounding at strong service levels.", "A higher multiple could be justified only if software-style revenue becomes externally evidenced.", "External customer adoption still unproven; cap-table terms unknown.", "Supported by fresh EIB funding and strong 2026 operating metrics."]
      - ["Base", "Grocery scale stays solid and Veloq remains promising but not yet independently underwritable.", "Investor should wait for price discipline because public evidence does not reveal a current equity mark.", "Missing audited profit bridge and fresh valuation data.", "Most consistent with the assigned public pool."]
      - ["Bear", "Growth moderates, commercialization slips, or expansion markets consume more capital than expected.", "Old 2022 valuation references could prove rich if no fresh equity sponsor resets the price.", "Down-round risk, multiple compression, and financing-overhang risk.", "Triggered if diligence cannot close the current disclosure gaps."]
    notes: >-
      These scenarios are directional because the assigned pool does not expose a
      current equity valuation, exact net debt, or preference terms.
    claimRefs: [CV005, CV007, CV008, CV009, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong operating proof is offset by incomplete price discovery and unresolved diligence gaps.
    data:
      nodes:
        - label: 2023 growth proof
          detail: EUR700 million revenue and 25% year-on-year growth in 2023.
        - label: 2026 operating proof
          detail: Around USD2 billion revenue, roughly 30% growth, 2.1 million monthly orders, and 97% on-time delivery.
        - label: Financing support
          detail: EIB top-up adds EUR30 million and brings disclosed EIB support to EUR120 million.
        - label: Strategy ambition
          detail: Management still frames Rohlik as a pan-European retailer plus technology platform.
        - label: Price opacity
          detail: No current public equity valuation, cap-table terms, or audited profit bridge in the assigned pool.
        - label: Recommendation
          detail: Track with strict entry discipline until fresh price and profitability evidence exist.
      edges:
        - from: 2023 growth proof
          to: 2026 operating proof
          label: scale proof compounds
        - from: 2026 operating proof
          to: Financing support
          label: supports lender confidence
        - from: Financing support
          to: Strategy ambition
          label: funds commercialization
        - from: Strategy ambition
          to: Price opacity
          label: ambition exceeds disclosure
        - from: Price opacity
          to: Recommendation
          label: hold for diligence
    approximationNotes: null
    claimRefs: [CV005, CV007, CV011, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Public evidence supports tracking, not paying up blindly
    body: >-
      Rohlik's latest public package proves scale and offers a credible Veloq
      upside option, but it still does not reveal the live equity valuation or the
      terms that determine investor returns. The right stance is to keep Rohlik in
      the funnel, insist on disciplined pricing, and upgrade only after the
      missing diligence package closes.
    claimRefs: [CV007, CV008, CV013, CV014]
