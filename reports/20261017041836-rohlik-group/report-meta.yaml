  customerFocus: Consumers in Rohlik's five operating markets, plus grocers for Veloq
  businessModel: >-
    Online grocery retail supported by delivery economics, private-label mix, retail media, and emerging
    technology/licensing revenue from Veloq.
  stage: late-stage private / pre-IPO
  fundingStatus: >-
