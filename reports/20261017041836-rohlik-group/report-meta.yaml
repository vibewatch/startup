companyProfile:
  summary: >-
    Rohlik Group operates a full-basket online grocery business across Central and Western Europe and has layered on
    automation, retail-media, and Veloq technology commercialization to widen its strategic moat. The company still
    reads as a late-stage private business with meaningful scale and improving operating proof, but the public record
    does not disclose a current equity price, cap table, or audited group-level profit bridge.
  foundingLocation: Prague, Czech Republic
  headquarters: Prague, Czech Republic
  productSummary: >-
