  topStrengths:
    - Demonstrated scale in a category that is still hard to execute profitably.
    - Automation and Veloq give Rohlik a credible technology and efficiency story.
    - Core-market profitability evidence supports the durability of the model.
  topRisks:
    - Expansion and automation still absorb significant capital.
    - Germany and other newer markets can pressure margins and payback.
    - Public disclosure remains incomplete on current valuation, cash, and debt.
    - Veloq commercialization is promising but not yet fully underwritten.
  unresolvedGaps:
    - Audited group-level EBITDA and net income; country-by-country P&L breakdown.
