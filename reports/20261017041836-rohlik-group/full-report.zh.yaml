companyProfile:
  summary: >-
    Rohlik Group 在中欧和西欧经营全篮子在线杂货业务，并叠加自动化、零售媒体和 Veloq
    技术商业化，以扩大自身战略护城河。公司仍像一家已进入后期、规模可观且经营验证正在改善的私营企业，但公开记录没有披露当前股价、股权结构表或经审计的集团层面利润桥接。
  foundingLocation: Prague, Czech Republic
  headquarters: Prague, Czech Republic
