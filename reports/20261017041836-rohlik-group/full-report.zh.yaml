      - number: '2.2'
        title: 已观察到的规模化视角，而非干净的 TAM
        blocks:
          - type: paragraph
            body: >-
              现有证据足以证明运营盘子很大且仍在扩张，却不足以支撑一个单一的 headline TAM 数字。Index Ventures 描述过 2020 年收入超过 EUR 300 million、覆盖三个市场的
              750,000 名客户；Rohlik 2022 年公告把数字推至 EUR 490 million 净收入、超过 1 million 活跃客户和接近 10 million 订单；ESM 随后报告 FY2023 收入
              EUR 700 million、五国 11.5 million 订单。到 2026 年，EIB 和 Retail Technology Innovation Hub 描述的规模约为每月 2.1 million
              订单、约 USD 2 billion 收入。这些数据能为品类验证和扩张能力提供有力的下限视角，但混用了公司定义、年份和单位，并未形成中性的 TAM/SAM/SOM。Sifted 2021 年把 Rohlik
              描述为“massively ramping up its expansion plans across continental Europe”的创业公司，为规模故事提供独立支持，却仍没有给出市场规模基准。
