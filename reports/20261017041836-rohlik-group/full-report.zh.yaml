            body: >-
              这次 2026 年刷新对融资支持的说明明显更扎实，却不足以证明当前股权价值。最新、最清晰的信号是欧洲投资银行为 Veloq 追加 EUR30 million 的 venture-debt-style
              融资，使已披露 EIB 支持达到 EUR120 million，并明确用于把 Rohlik 的自动化技术栈商业化到自有杂货业务之外。这在战略上有帮助，因为它显示机构对平台有信心，也为 Veloq
              扩张提供跑道，但不等于新一轮定价股权融资。现有公开来源中最后一个直接披露的股权估值标记仍是 2022 年 Series D，以及贸易媒体后来提到的 2022 年中 EUR1.3 billion
              估值；因此当前进入纪律必须从价格发现不完整出发，而不是从新的市场出清股权标记出发。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.2'
        title: 正论点是验证改善；反论点是披露与变现风险
        blocks:
          - type: paragraph
            body: >-
              看多的一面是，Rohlik 仍像少数具备规模、可复制服务质量和可信技术叙事的欧洲全篮子电商杂货商之一。独立行业报道称 2023 年收入达到 EUR700 million，同比增长 25%；2026 年 EIB 和
              Retail Technology Innovation Hub 材料则描述约 USD2 billion 收入、约 30% 增长、2.1 million 月订单和 97% 准时配送。一份无日期的公司控制
              LinkedIn 资料另称年收入 EUR750 million，这只能作为历史或年份未知的参考，不应与更新的 2026 年指标强行对齐。这些指标支持 Rohlik
              已走出脆弱概念阶段。反论点是，管理层和合作方控制的来源仍比硬公开财务披露承担更多叙事工作：来源池没有审计集团 EBITDA、各国损益表、当前现金与契约余量，也没有外部证据证明 Veloq 已经拥有足够第三方商业
              traction、值得采用软件式估值。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架适合跟踪公司，不足以今天精确做价
        blocks:
          - type: paragraph
            body: >-
              仍可以设计情景，但不能追求精确。在乐观情景下，Rohlik 通过证明 Veloq
              能在自有网络之外销售，同时保持服务指标和盈利纪律，把当前杂货规模转化为质量更高的混合故事。在基准情景下，公司继续复合增长收入和运营质量，但由于公开证据仍混合旧股权估值、新债务融资与平台商业化主张，定价依然困难。在悲观情景下，投资人发现德国及其他扩张市场仍吸收过多资本，或
              Veloq 外部采用速度低于叙事暗示，2022
              年前后的估值参考就会显得昂贵而非保守。留存来源没有提供上市公司倍数、并购交易基准、私人二级市场标记或退出时间表，因此给出数值估值区间或目标回报会制造虚假精确。这种组合支持以严格进入纪律跟踪业务，而不是基于不完整公开证据给出买入意见。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 最终判断与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              因此，正确的估值判断是合理但不清晰，而不是便宜。Rohlik
              已有足够规模和运营质量证据，可以留在可投资名单中，但公开披露不足以让投资人凭信念支付溢价。从“好公司”走到“这个价格值得投”，靠的是证据而不是故事：投资人需要当前股权结构表、优先权条款、最新经审计的盈利桥接、逐市场烧钱、Veloq
              客户管线，以及商业化到 Rohlik 之外并非内部平台改名的证据。如果尽调显示 Veloq
              有真实第三方合同、集团盈利持久，且价格没有把未经验证的外部平台按软件倍数估值，建议可以上调。如果这些尽调要求无法满足，资金投入前投资论点就应破裂。
            claimRefs:
              - CV008
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据支持跟踪，不支持盲目追价
            body: >-
              Rohlik 最新公开材料证明了规模，也提供了可信的 Veloq 上行选项，但仍没有披露实时股权估值或决定投资人回报的条款。正确做法是把 Rohlik
              留在筛选漏斗中，坚持纪律化定价，只有在缺失的尽调材料补齐后才上调判断。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
