      - number: '3.3'
        title: 护城河真实但不完整，因为成本结构与购物任务会分裂
        blocks:
          - type: paragraph
            body: >-
              护城河耐久性的最佳证据，是 Rohlik 把运营密度、自动化和软件放在同一技术栈中，而不是只依赖门店劳动力。公开来源显示，模式从捷克盈利发展到自动化后在慕尼黑实现后续盈利，Veloq 也暗示 Rohlik
              可能把操作系统输出到自有品牌之外。但护城河是局部的，不是绝对的。门店型 incumbents 可以用较低履约中心资本开支防守，快速商务应用即使不替代每周采购，也能赢下紧急补货任务。剩余缺口很实际：现有证据没有
              Rewe、Picnic 或 Košík 的独立篮子级价格基准，也没有公开多平台使用或流失数据来证明 Rohlik 到底有多黏。
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP011
              - CP014
              - CP015
