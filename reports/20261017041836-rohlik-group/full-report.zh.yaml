              Rohlik 销售的是全篮子在线杂货体验，而不是狭窄的即时配送 SKU 集合。在 Rohlik.cz、Kifli.hu、Gurkerl.at、Knuspr.de 和 Sezamo.ro
              上，客户主张都是覆盖广泛的每周采购、快速配送时段，以及超市基础品、本地农产品和自有品牌的精选组合。公司来源对核心产品的说法大体一致：根据引用页面不同，品类为 17,000-plus 至 25,000-plus 个
