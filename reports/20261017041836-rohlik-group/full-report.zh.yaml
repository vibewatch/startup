chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营规模
        blocks:
          - type: paragraph
            body: >-
              Rohlik Group 将自己定位为一家技术驱动的全篮子在线杂货商，2014 年在布拉格成立。FY2025 年报显示，公司如今已把这一模式集中在五个运营国家，而不是 2022
              年材料所描述的更广泛启动管线。集团称，自己在捷克、匈牙利、奥地利、德国和罗马尼亚，依托 Rohlik.cz、Kifli.hu、Gurkerl.at、Knuspr.de 和 Sezamo.ro
              服务约九个主要城市群。公开联系信息仍以布拉格为中心，年报则将其描述为一家注册于捷克、以在线零售为主业的集团。公司规模已经足以让后续章节把 Rohlik 当作后期私营运营商，而非早期市场进入故事：FY2025
              收入达到 €1,479.7 million，活跃客户达到 1.4 million，2025 年 12 月月订单量超过 2
              million。接下来真正要看的，不再是品类需求是否存在，而是能否把高密度城市杂货运营转化为持续的集团盈利和可复制的技术平台。
