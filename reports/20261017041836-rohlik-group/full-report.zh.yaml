      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              来源中最主要的采用驱动包括不缩小购物篮的便利性、丰富品类、当日配送可靠性、与实体门店替代方案的价格平价，以及订单密度上升后能拓宽利润空间的自动化。约束同样清楚：Rohlik 披露 2022 年自动化资本开支为
              EUR 45 million，称 2024 年仍会继续大笔投入自动化，2026 年又使用 EIB 扩张融资来商业化 Veloq。同时，各年份的客户数披露并不完全可比，现有来源也缺少针对 Rohlik
              实际市场、方法清晰且独立的全篮子电商 TAM/SAM/SOM 拆分。因此市场论点可信，却还不够干净，无法支撑一页过度放大的估值幻灯片。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 两个相连的市场比一个泛化 TAM 更重要
            body: 证据表明，Rohlik 应被分析为面向消费者的全篮子电商杂货商，加上通过 Veloq 延伸的杂货运营系统供应商。这支持上行空间，但本组来源只有杂货零售层已经成为成熟收入基础。
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
              - CM012
          - type: callout
            title: 市场故事可信，但还没有清晰基准
            body: Rohlik 的规模轨迹证据充分，但本章仍缺少独立且方法明确的 TAM/SAM/SOM；客户指标跨年份也不完全可比，限制了估值框架的精确度。
            calloutType: risk
            claimRefs:
              - CM006
