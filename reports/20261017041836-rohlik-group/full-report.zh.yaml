            body: >-
              底层架构明确是全栈且由运营方掌握。Rohlik
              表示自己拥有端到端运营，并将技术留在内部；公开来源则描述了支撑这一说法的自动化层。运营环节把本地采购、履约中心自动化、仓库执行、路线规划和客户支持串成一条服务链。平台端，EIB 和 Rohlik
              如今把同一内部技术栈称为 Veloq：一个 AI 驱动的当日杂货履约平台，包含自动拣货、仓库执行、预测性库存、电商履约、最后一公里路径规划，以及劳动力和调度编排层。核心技术下注是，Rohlik
