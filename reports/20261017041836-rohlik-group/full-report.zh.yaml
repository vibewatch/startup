  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开经营 traction
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的收入模式建立在各国本地品牌下的全篮子在线杂货零售上，而不是单一跨境门店；官方联系页面列出捷克、奥地利、匈牙利、德国和罗马尼亚的运营实体。公开 traction
              指标显示规模真实，但披露像快照一样不均匀：公司称截至 2022 年 4 月的 12 个月净收入达到 €490 million，活跃客户超过 1 million，订单接近 10 million；ESM 随后报告
              FY2023 收入 €700 million、11.5 million 订单，客户超过 800,000。较新的 EIB 和 RTIH 材料把讨论从历史零售 traction 推向约 $2 billion 收入和约
              2.1 million
              月订单，说明仍在扩张，但跨期间或业务线仍没有干净、经审计的桥接。价格披露仍偏方向性而非可用于投资判断：官方材料强调与实体零售相当的竞争性价格和高价值品类，但公开来源没有披露当前配送费卡、实际篮子价格、促销强度或各市场收入确认政策。
