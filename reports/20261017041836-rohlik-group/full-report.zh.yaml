      - number: '3.2'
        title: Rohlik 的差异化是全篮子便利，而不只是速度
        blocks:
          - type: paragraph
            body: >-
              Rohlik 自己的材料始终把产品定位为有竞争力的价格加差异化品类，合作方和独立来源大体也支持这一视角。公司把 17,000-plus
              的品类宽度、本地采购和窄时段配送，与宣称价格可和实体零售竞争的价值主张结合起来；Sacra 还补充了通过 Xtra 形成的订阅和自有品牌飞轮。因此 Rohlik
              最接近的基准是每周家庭采购，而不是一次性紧急小篮子。Picnic 和 Košík 在全篮子意图上更可比，但 Picnic 放弃了精细的微时段配送，Košík 则在捷克最强。Rewe 和 Billa
              可以靠既有门店网络防守，但留存证据没有显示它们能同时匹配 Rohlik 所称的新鲜度、本地采购和时段精准度。
