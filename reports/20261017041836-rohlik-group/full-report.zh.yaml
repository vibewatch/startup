  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Rohlik 的闭环从城市级可得性和全篮子试用开始，再借助便利度和忠诚度机制扩张；Veloq 则是独立的商业化分支，具名客户证据更少。
    data:
      items:
        - label: 城市可得性与品牌进入
          actor: 城市家庭买家
          phase: 获客
          touchpoints:
            - 具体市场的品牌，如 Rohlik.cz、Kifli.hu、Knuspr.de 或 Sezamo
            - 当日杂货配送承诺只有在仓库覆盖的地区才有意义
        - label: 首次全篮子试用
          actor: 家庭买家和用户
          phase: 首单
          touchpoints:
            - 以丰富品类定位为一站式每周采购
            - 60-90 分钟配送或紧凑的当日时间窗
        - label: 重复使用便利习惯
          actor: 回购家庭
          phase: 重复使用
          touchpoints:
            - 本地化品类减少了光顾多家门店的需要
            - 已报告的订单量意味着重复使用，而非一次性尝试
        - label: 忠诚度与钱包份额扩张
          actor: 高频家庭
          phase: 扩张
          touchpoints:
            - Xtra 订阅、自有品牌折扣和更大的购物篮行为
            - 公开证据显示了扩张逻辑，但没有经审计的客户群曲线
        - label: 逐市场规模化
          actor: 新城市家庭客户群
          phase: 地域扩张
          touchpoints:
            - Sezamo 在米兰和布加勒斯特的上线模板
            - 德国显示出超越试点条件的进展
        - label: 通过 Veloq 对外输出 B2B 平台
          actor: 零售商潜在客户
          phase: 相邻领域
          touchpoints:
            - 履约、最后一公里和电商技术栈已在 Rohlik 内部验证
            - 具名外部客户证据仍然缺失
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU013
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在公开证据集中，对资本提供方的依赖以及自动化加平台执行仍是最严重的剩余风险敞口。
    data:
      columns:
        - label: 可能性
          detail: 未来 12-24 个月内发生的概率。
        - label: 影响
          detail: 对增长、利润率或可投资性的潜在损害。
        - label: 缓释成熟度
          detail: 已经可见多少真实的缓释证据。
        - label: 剩余敞口
          detail: 可见缓释措施之后的剩余风险。
      rows:
        - label: 资本密集度 / 融资依赖
          values:
            - 高
            - 高
            - 中
            - 高
          note: 反复的股权和风险债务融资支持扩张，但也让融资渠道保持战略重要性。
        - label: 自动化和 Veloq 执行
          values:
            - 中
            - 高
            - 中
            - 高
          note: 慕尼黑实现盈利是积极信号，但新部署和对外商业化增加了执行负担。
        - label: 合规 / 披露不透明
          values:
            - 中
            - 高
            - 低
            - 中高
          note: 公开资料对事件或许可证保持沉默是尽调缺口，不是不存在的证明。
        - label: 规模化服务可靠性
          values:
            - 中
            - 高
            - 中
            - 高
          note: 如果运营掉链子，当日配送承诺会立即造成客户可见的下行影响。
        - label: 多国运营复杂度
          values:
            - 中
            - 中高
            - 中
            - 中高
          note: 五国运营扩大了用工、供应商和本地执行面。
        - label: 外部 Veloq 客户采用
          values:
            - 中
            - 高
            - 低
            - 中高
          note: 第三方客户证据仍不如 Rohlik 的内部运营证据清晰。
    claimRefs:
      - CR004
      - CR005
      - CR009
      - CR013
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据很强，但价格发现不完整，尽调缺口也未解决，二者抵消了这项优势。
    data:
      nodes:
        - label: 2023 年增长证据
          detail: 2023 年收入 EUR700 million，同比增长 25%。
        - label: 2026 年运营证据
          detail: 收入约 USD2 billion，增长约 30%，月订单 2.1 million，准时配送率 97%。
        - label: 融资支持
          detail: EIB 增资增加 EUR30 million，使已披露的 EIB 支持达到 EUR120 million。
        - label: 战略雄心
          detail: 管理层仍将 Rohlik 定位为泛欧洲零售商加技术平台。
        - label: 价格不透明
          detail: 指定资料池没有当前公开股权估值、资本表条款或经审计的利润桥接。
        - label: 建议
          detail: 在出现最新价格和盈利证据前，以严格的入场纪律保持跟踪。
      edges:
        - from: 2023 growth proof
          to: 2026 operating proof
          label: 规模证据累积
        - from: 2026 operating proof
          to: Financing support
          label: 支撑贷款人信心
        - from: Financing support
          to: Strategy ambition
          label: 资助商业化
        - from: Strategy ambition
          to: Price opacity
          label: 雄心超出披露
        - from: Price opacity
          to: Recommendation
          label: 等待尽调
    approximationNotes: null
    claimRefs:
