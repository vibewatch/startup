  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              本组来源最清晰的市场边界是全篮子在线杂货。Rohlik 及其投资人材料反复强调，这是覆盖广、按时段配送的家庭采购，而非 2021—2022
              年行业叙事中占据一席之地的即时配送、小篮子模式。纳入的支出是每周食品和家庭用品预算，靠丰富品类、自有品牌和本地农户供货支撑。排除或相邻的类别包括纯粹的快速配送补货、不含杂货篮子的通用快递支出，以及零售媒体尚未量化的上行空间。估值还要看一个更新的边界：Veloq
              把 Rohlik 内部的履约技术栈变成可出售给其他杂货商的操作系统，因此杂货自动化软件是相邻业务，不能证明消费者杂货 TAM 已经被独立测算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
