      - number: '4.3'
        title: 资本需求、融资依赖与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              即便公开材料开始强调部分市场盈利，资本密集度仍是现实问题。2026 年最有决策价值的证据不是股权轮，而是贷款方文件：EIB 称其 €30 million 增量融资让对 Rohlik 的累计支持达到 €120
              million，明确属于与 Veloq 商业化推进挂钩的扩张期 venture debt。Tracxn 还记录了 2025 年 1 月的 $92 million venture debt 轮和 $1.6
              billion 当前估值，但这些数据库指标没有与经审计申报核对，只能视为方向性而非定论。公开员工数代理指标同样嘈杂，Tracxn 和 LinkedIn
              对人员规模的判断不同。因此未来故事能理解，却还不能完全用于投资判断：Veloq 可能在杂货零售之外开辟第二条变现路径，但公开材料没有给出
              ARR、客户数、贡献利润率或已签合同披露；现有来源也没有补上集团现金、烧钱、跑道、债务契约或各市场盈利的缺口。
            claimRefs:
              - CI010
              - CI012
              - CI013
              - CI014
