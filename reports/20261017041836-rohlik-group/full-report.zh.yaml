      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              消费者层相对简单：同一家庭通常既是买方、用户也是付款方，因为 Rohlik 想用一个价格仍能与门店竞争的在线全篮子，替代反复去杂货店采购。Veloq 一侧的分层更难：终端用户是运营组织，买方更可能是零售
              COO、供应链负责人或技术负责人，他们要自动化拣货、库存和路径规划。关键在于，采用路径不只取决于消费者是否偏好便利，还取决于杂货商是否相信当天履约能盈利到足以支撑自动化预算和平台迁移。
            claimRefs:
