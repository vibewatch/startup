  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: Rohlik 最接近高便利度、高购物篮广度的象限；Košík 是捷克最接近的直接同行，传统企业便利度较低，而即时零售的购物篮广度更窄。
    data:
      xAxis: 每周采购相关性 / 购物篮广度更高 →
      yAxis: 配送便利度 / 时间段精确度更高 →
      points:
        - name: Rohlik
          label: Rohlik
          x: 5
          'y': 4
          note: 17,000+ 件商品、15 分钟时间窗，部分市场可在 90 分钟内配送；公司称价格与实体店持平。
        - name: Košík.cz
          label: Košík.cz（捷克竞争者）
          x: 4
          'y': 4
          note: 主要捷克竞争者，提供 30 分钟时间段以及会员 / 自有品牌折扣。
        - name: Picnic
          label: Picnic
          x: 4
          'y': 3
          note: 按完整购物篮规划路线，满 €45 免配送费，但保留证据中没有微时间窗。
        - name: Rewe Online
          label: Rewe Online
          x: 4
          'y': 2
          note: 按 Sacra 的收入计算，是最大的传统企业威胁，拥有门店拣货和广泛的城市覆盖。
        - name: Billa Online
          label: Billa Online
          x: 3
          'y': 2
          note: 奥地利传统企业，提供次日配送，但被引用的品类和新鲜度差异化较弱。
        - name: Flink / Wolt
          label: Flink / Wolt
          x: 2
          'y': 5
          note: 保留证据中补货便利度最快，但购物场景更窄、购物篮更小。
    approximationNotes: 1-5 的序数定位是有证据支持的判断，不是第三方基准：x 轴反映每周采购的相关性和品类广度，y 轴反映配送便利度和时间段精确度。
