      - number: '1.3'
        title: 融资历史、财务拐点与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              刷新后的证据显示，公司已从融资驱动的扩张，走向经营拐点与持续资产负债表支持并存的阶段。历史公司公告显示，Rohlik 于 2021 年完成 €100 million 的 Series C、2022 年完成
              €220 million 的 Series D，后者由 Sofina 领投，Index Ventures 等老股东和创始人参与。FY2025 成为关键转折年：调整后 EBITDA 从 2025 年 12
              月起转正，全年经营现金流为 +€12.7 million，Veloq 则于 2025 年 6 月作为独立子公司成立。但年报明确表示，盈利仍未完成，列出 €66.1 million
              净亏损，并指出德国仍需达到稳定现金生成。年末之后，股东新增 €50 million 股权，欧洲投资银行又为 Veloq 承诺 €30 million，使 EIB 累计支持达到 €120
              million。综合来看，公司经营明显改善，但仍依赖融资；估值和资本结构仍需在后续章节单独刷新。
