  - id: FI001
    title: 从客户购物篮到资本需求的收入模式桥接
    type: flow
    summary: Rohlik 的公开叙事是一座从密集的杂货需求通向自动化驱动盈利能力的桥梁，但未披露的现金状况和 Veloq 合同经济性仍位于链条末端。
    data:
      nodes:
        - id: baskets
          label: 客户购物篮和下单频率
          valueNote: >-
            Public snapshots moved from more than 1 million active customers and almost 10 million orders in Apr-2022 to
            11.5 million orders in FY2023.
        - id: retail-revenue
          label: 核心杂货收入
          valueNote: >-
            Revenue disclosure stepped from €490m net revenue in Apr-2022 to €700m in FY2023 and around $2bn in 2026
            lender/company materials.
        - id: pricing
          label: 购物篮定价和服务变现
          valueNote: >-
            Official evidence supports value pricing and fast delivery windows, but not current fee cards or realized
            price realization.
        - id: fulfillment
          label: 履约自动化和最后一公里成本
          valueNote: Automation is the primary public margin lever; Brightpick says targeted labor needs fell by more than 80%.
        - id: market-profit
          label: 市场层面的盈利能力
          valueNote: >-
            Public evidence points to profitability in the Czech Republic, Hungary, and Munich, not a fully disclosed
            group margin.
        - id: capital
          label: 集团现金需求和 Veloq 扩张
          valueNote: >-
            EIB support reached €120m, while public cash, burn, covenants, ARR, and software contribution margin remain
            undisclosed.
      edges:
        - from: baskets
          to: retail-revenue
          label: 购物篮规模和频率转化为零售销售额。
        - from: retail-revenue
          to: pricing
          label: 实际成交价格、促销和时间段变现决定收入质量。
        - from: pricing
          to: fulfillment
          label: 配送承诺和品类广度决定服务成本。
        - from: fulfillment
          to: market-profit
          label: 自动化、损耗控制和密度决定贡献利润率。
        - from: market-profit
          to: capital
          label: 扩张速度和软件部署决定外部融资需求。
    approximationNotes: 该流程是定性的，因为指定公开资料池没有披露从收入到毛利、EBITDA 和现金消耗的完整数字桥接。
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI008
      - CI010
      - CI011
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Rohlik 的运营栈从消费者承诺延伸到自营执行，再向外延伸至 Veloq 商业化。
    data:
      layers:
        - label: 客户主张
          detail: 品类广、配送时间窗快的全篮子线上杂货
          modules:
            - label: 品类
              value: 17k-25k+ SKUs
            - label: 配送承诺
              value: 15-min windows / 60-90 min
          outputs:
            - label: Weekly-shop convenience
        - label: 自有采购与履约
          detail: 覆盖生产商、FC 和客户服务的端到端杂货运营流程
          modules:
            - label: 本地供应
              value: Fresh goods to FCs in as little as 6 hours
            - label: 自动化部署
              value: Munich / Hamburg / Prague; Berlin / Vienna next
          outputs:
            - label: Higher availability and lower replacements
        - label: 执行软件
          detail: 内部系统协调履约中心运营和电商执行
          modules:
            - label: 仓库执行
            - label: 电商履约
          outputs:
            - label: Same-day order flow
        - label: AI 编排
          detail: AI 辅助的用工、库存、调度和预测性执行层
          modules:
            - label: 预测性库存
            - label: 用工与调度编排
          outputs:
            - label: 97% on-time delivery
        - label: 服务补救与质量控制
          detail: 面向客户的质量闭环覆盖可得性、替换和退款
          modules:
            - label: 低替换率 / 低缺货率
            - label: 即时自助退款
          outputs:
            - label: High-NPS service recovery
        - label: 对外平台
          detail: Veloq 面向欧洲和美国的其他杂货商实现内部技术栈商业化
          modules:
            - label: 自动拣货
            - label: 最后一公里路由
          outputs:
            - label: Third-party grocer deployments not yet named publicly
    approximationNotes: 层级边界综合自贷款人、公司和行业媒体的描述；公开来源点出了各项功能，但没有提供接口级图示或数据流架构。
    claimRefs:
