      - number: '4.2'
        title: 成本结构、自动化与市场层面盈利
        blocks:
          - type: paragraph
            body: >-
              公开利润率叙事是一致的，但主要仍由公司及相邻合作方来源推动，而不是经审计报表。Brightpick 案例是外部描述 Rohlik 运营逻辑最清晰的材料：手工拣货被描述为行业高成本负担，Rohlik
              称仓库机器人已让目标流程的劳动力需求下降超过 80%，并称逐城谨慎铺开有助于降低前期亏损。官方声明也指向同一逻辑，提到 2022 年自动化资本开支 €45 million，以及 2024
              年继续投资柏林和维也纳。公司反复把盈利定义为市场层面而非集团层面：捷克业务自 2018 年盈利，匈牙利自 2021 年盈利，慕尼黑在 2023
              年报告周期前已盈利。这有利于毛利率路径和贡献经济性，但不能替代披露的合并 EBITDA、毛利率、每单履约成本、CAC、回收期或营运资本强度。
            claimRefs:
