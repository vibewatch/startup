      - number: '1.2'
        title: 管理层、治理面与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开披露的领导层集中在创始人兼 CEO Tomáš
              Čupr，以及覆盖零售运营、财务、人力和技术的精干管理委员会。这让投资人能清楚看见执行层地图，但目前公开证据对管理层的覆盖明显多于正式治理：留存来源确认了管理委员会成员和各国负责人，却没有披露完整董事会构成、投票权或刷新后的股权结构表。Čupr
              仍是战略、融资和长期愿景的主要对外声音，集团又同时在商业化 Veloq、应对各国市场成熟度不均，因此创始人依赖仍然显著。尽调时，应把继任梯队、授权决策权和 Veloq
              关系的经济安排视为尚未解决的治理事项，而不能假定现有运营团队已经充分分散了创始人集中度风险。
