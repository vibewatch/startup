  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局按任务、地域和运营模式分散
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的竞争集合比单一的“在线杂货”更广。引用来源把它与 Rewe Online、Billa Online 等门店拣货型既有运营商，全篮子在线超市 Košík.cz、Picnic，快速商务专家
              Flink、Wolt，以及越来越多的技术替代方案放在一起比较；后者是杂货运营商许可软件，而不是复制 Rohlik 的运营技术栈。Rohlik
              并不是用一个泛欧洲品牌进入市场：官方材料显示，捷克、匈牙利、奥地利、德国和罗马尼亚各有本地品牌和实体，所以最接近的直接竞争对手会随市场变化。直接同业压力最可能来自能可靠承接每周采购的公司；快速商务应用即使不能替代每周采购，仍会在紧急补货场景形成侧翼竞争。
