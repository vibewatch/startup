artifact: company-overview
slug: rohlik-group
runDate: 2026-10-17
company:
  name: Rohlik Group
chapter:
  number: 1
  title: Company Overview
  summary: >
    Rohlik Group is a Prague-founded, five-market online grocery operator whose FY2025 results
    show clear scale and operating improvement, including positive adjusted EBITDA from December
    2025 and positive operating cash flow for the year. The refresh evidence also shows continued
    external financing support for the Veloq technology spin-out, but the group still reported a
    €66.1 million net loss, Germany has not yet reached stable cash generation, and public
    disclosure remains incomplete on current valuation, cap table, and precise headcount.
sections:
  - id: identity-and-scale
    title: Identity, footprint, and operating scale
    body: >
      Rohlik Group presents itself as a technology-led full-basket online grocer founded in Prague
      in 2014, and the FY2025 annual report shows the company has now concentrated that model in
      five operating countries rather than the broader launch pipeline described in 2022 materials.
      Across the Czech Republic, Hungary, Austria, Germany, and Romania, the group says it serves
      roughly nine major agglomerations under Rohlik.cz, Kifli.hu, Gurkerl.at, Knuspr.de, and
      Sezamo.ro. The public contact footprint remains Prague-centered, while the annual report
      frames the business as a Czech-domiciled group with online retail as its principal activity.
      Scale is now material enough that later chapters can treat Rohlik as a late-stage private
      operator rather than an early market-entry story: FY2025 revenue reached €1,479.7 million,
      active customers reached 1.4 million, and December 2025 monthly order volume exceeded
      2 million. The operating story is therefore less about proving category demand and more
      about translating dense urban grocery operations into sustained group profitability and a
      repeatable technology platform.
    claimRefs: [CO001, CO002, CO003, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance surface, and key-person dependence
    body: >
      Publicly disclosed leadership is concentrated around founder-CEO Tomáš Čupr and a compact
      management board spanning retail operations, finance, people, and technology. That gives
      investors a clear executive operating map, but the public evidence here is noticeably richer
      on management than on formal governance: retained sources identify management board members
      and country leads, yet do not disclose a full board composition, voting rights, or an
      updated post-refresh cap table. Founder dependence remains material because Čupr is still
      the primary external voice for strategy, financing, and long-term ambition, while the group
      is simultaneously commercializing Veloq and managing uneven market maturity across countries.
      In practice, diligence should treat succession depth, delegated decision rights, and the
      economics of the Veloq relationship as unresolved governance items rather than assume the
      current operating bench fully de-risks founder concentration.
    claimRefs: [CO003, CO004, CO009, CO010]
    tableRefs: [TO002, TO003]
  - id: funding-history-financial-inflection-and-milestones
    title: Funding history, financial inflection, and milestone chronology
    body: >
      The refresh evidence shows a business that has moved from financing-led scale-up to a more
      mixed story of operating inflection plus continued balance-sheet support. Historical company
      releases show Rohlik raised €100 million in Series C in 2021 and €220 million in Series D
      in 2022, with Sofina leading the latter and existing investors including Index Ventures and
      the founder participating. FY2025 then became the key transition year: adjusted EBITDA
      turned positive from December 2025, operating cash flow finished the year at +€12.7 million,
      and Veloq was launched as a standalone subsidiary in June 2025. But the annual report is
      explicit that profitability is still incomplete work, citing a €66.1 million net loss and
      Germany's need to reach stable cash generation. Post-year-end, shareholders added €50
      million of new equity and the European Investment Bank committed another €30 million for
      Veloq, taking total EIB support to €120 million. That combination makes the current stage
      best read as operationally improved but still financing-reliant, with valuation and capital
      structure still needing a dedicated refresh in later chapters.
    claimRefs: [CO006, CO007, CO008, CO011, CO012, CO013]
    figureRefs: [FO001]
