company:
  name: Rohlik Group
chapter:
  number: 7
  title: Risks
  summary: >-
    Rohlik's risk profile is led by capital intensity and execution complexity rather
    than a single visible legal event. The evidence set shows repeated reliance on
    large external financings to fund automation and expansion, while 2026 Veloq
    commercialization adds partner and operating-model risk on top of a five-country
    grocery footprint. Public compliance visibility remains comparatively thin, so
    regulatory comfort is still a diligence item rather than a cleared risk.
sections:
  - id: ranked-risk-posture
    title: Capital intensity and platform commercialization sit at the top of the stack
    body: >-
      The clearest residual risk in the public evidence is that Rohlik is still funding
      a scale-and-automation strategy that depends on outside capital staying available.
      Management's 2022 Series D messaging tied the raise directly to automation,
      electric mobility, and continued expansion, and the 2026 EIB top-up shows that
      lender-backed scale-up financing remains part of the playbook. That would be less
      concerning if Rohlik were only maintaining a stable domestic grocery business, but
      the same 2026 evidence set also shows Veloq being commercialized to third-party
      grocers in Europe and the United States. The risk is therefore not just balance-sheet
      dependence; it is that Rohlik is simultaneously carrying grocery execution,
      automation deployment, and external platform go-to-market risk.
    claimRefs: [CR001, CR002, CR004, CR005, CR006, CR011, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: operational-reliability
    title: Automation is both the mitigation and the execution bottleneck
    body: >-
      Rohlik has real scale, which raises the blast radius of any execution miss. The
      company said it had more than 1 million active customers and almost 10 million
      orders in the 12 months to April 2022, while independent coverage later reported
      €700 million of 2023 revenue and 11.5 million orders across five markets. At the
      same time, the company's own update said fulfilment-centre automation in Munich,
      Hamburg, and Prague would cost €45 million in 2022 alone, with hundreds of
      millions more planned later. Independent reporting that Munich became profitable
      after automation is a genuine positive signal, but it also means rollouts,
      commissioning delays, or weaker-than-expected warehouse economics can still hit
      service levels, margin progression, and expansion confidence.
    claimRefs: [CR003, CR007, CR008, CR009, CR015, CR016]
    tableRefs: [TR002]
  - id: regulatory-visibility
    title: The compliance surface is broad, but public disclosure is thin
    body: >-
      The assigned evidence shows Rohlik operating through named entities in the Czech
      Republic, Austria, Hungary, Germany, and Romania, and management is explicit that
      it wants to be a pan-European retailer. That footprint implies food-safety,
      labour, privacy, consumer-protection, and logistics obligations across several
      jurisdictions. What the public pool does not provide is the companion evidence an
      investor would need to downgrade the risk: market-specific licences, inspection
      histories, privacy or cyber control artefacts, disclosed litigation schedules, or
      clear incident reporting. The right reading is not that a problem exists, but that
      public silence cannot be treated as clearance, especially when the company is now
      also pushing its platform into third-party grocer environments.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: monitorable-triggers
    title: Mitigations exist, but the thesis still needs hard monitoring triggers
    body: >-
      There are credible mitigation signals in the record: repeated investor support,
      EIB willingness to extend venture debt, proof that automation can improve market
      economics, and a service proposition that appears to resonate with customers at
      scale. Those positives keep the risk picture investable rather than disqualifying.
      But they do not eliminate the need for explicit kill criteria. The thesis should
      deteriorate if Rohlik needs incremental financing before current automation and
      Veloq programs translate into durable unit economics, if Veloq fails to convert
      internal proof into external customers, or if diligence uncovers unresolved
      compliance incidents that the public evidence set does not currently surface.
    claimRefs: [CR004, CR005, CR006, CR009, CR013, CR014]
