figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Capital-provider dependence and automation-plus-platform execution remain the most
      severe residual exposures in the public evidence set.
    data:
      columns:
        - label: Likelihood
          detail: Probability over the next 12-24 months.
        - label: Impact
          detail: Potential damage to growth, margin, or investability.
        - label: Mitigation maturity
          detail: How much real evidence of mitigation is already visible.
        - label: Residual exposure
          detail: Remaining risk after visible mitigations.
      rows:
        - label: Capital intensity / financing dependency
          values: [High, High, Medium, High]
          note: Repeated equity and venture-debt funding support expansion but keep funding access strategic.
        - label: Automation and Veloq execution
          values: [Medium, High, Medium, High]
          note: Munich profitability is a positive sign, but new rollouts and external commercialization add execution load.
        - label: Compliance / disclosure opacity
          values: [Medium, High, Low, Medium-high]
          note: Public silence on incidents or licences is a diligence gap, not proof of absence.
        - label: Service reliability at scale
          values: [Medium, High, Medium, High]
          note: Same-day delivery promises create immediate customer-visible downside if operations slip.
        - label: Multi-country operating complexity
          values: [Medium, Medium-high, Medium, Medium-high]
          note: Five-country operations expand labour, supplier, and local execution surfaces.
        - label: External Veloq customer adoption
          values: [Medium, High, Low, Medium-high]
          note: Third-party customer proof remains less visible than Rohlik's internal operating proof.
    claimRefs: [CR004, CR005, CR009, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Funding access is still a live dependency
    body: >-
      The 2026 EIB top-up is positive, but it also confirms that Rohlik is still pairing
      grocery execution with an externally financed automation roadmap. If capital markets
      tighten before Veloq or automation programs convert into stable cash generation, the
      downside can show up as slower rollout, weaker bargaining power, or deferred growth.
    claimRefs: [CR001, CR002, CR004, CR005]
  - calloutType: insight
    title: "Best public mitigation signal: automation appears to improve economics"
    body: >-
      Independent reporting that Munich became profitable after automated solutions were
      introduced is the strongest publicly visible mitigation signal in this chapter. It
      does not eliminate risk, but it suggests that Rohlik's automation thesis can work
      operationally when execution lands on time.
    claimRefs: [CR003, CR009]
  - calloutType: recommendation
    title: Kill criteria for the investment case
    body: >-
      Escalate to a no-go if diligence shows unresolved market-specific compliance issues,
      if Veloq fails to convert internal proof into external customers, or if additional
      financing is required before current automation programs improve market-level unit
      economics.
    claimRefs: [CR004, CR005, CR009, CR013, CR014]
