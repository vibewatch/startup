- id: adoption-trajectory-and-proof-of-deployment
  title: Adoption Trajectory and Proof of Deployment
  body: |-
    The public adoption story is strong on both aggregate scale and named deployments. Official and mirrored sources cite more than 17,000 customers, more than 150,000 open-source projects, and more than 2 million code reviews each week by August 2026. That top-line breadth is supported by more granular community evidence: a 2026 research dataset found traces of CodeRabbit adoption across 481 GitHub repositories and more than 99,000 unique pull requests, while the OSS program page positions CodeRabbit as installed on the most open-source repositories and highlights distribution grants to projects such as TanStack and Vue. Those are different kinds of evidence, but they point in the same direction: CodeRabbit has moved well beyond isolated pilots.

    Named deployments are even more useful because they show the shape of adoption. Swiggy ran a formal one-and-a-half-month POC across three tools and chose CodeRabbit for context-aware reviews. EarnIn uses it across hundreds of engineers and repositories in a regulated environment. Prokeep began with a small GitLab rollout and expanded after confidence improved. Briya uses CodeRabbit as the review layer above multiple coding agents. Abnormal AI frames it as procurement-grade and high signal. SalesRabbit says it moved from a limited test to full adoption quickly. Together, those proofs support a real customer motion: discover, pilot, standardize, then broaden.
