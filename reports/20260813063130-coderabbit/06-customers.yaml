chapter:
  number: 6
  title: Customers
  summary: 'CodeRabbit has unusually strong public customer proof for a private developer-tools startup: 17,000+ claimed customers, 150,000+ OSS projects, marquee enterprise references, and a fresh set of 2026 case studies with specific operators and quantified workflow impact. The weak spot is durability: public materials show adoption breadth and expansion logic far better than retention, contract economics, or concentration.'
sections:
- id: customer-segments-and-buyer-map
  title: Customer Segments and Buyer/User/Payer Map
  body: |-
    CodeRabbit’s customer base is best understood as a layered pyramid rather than one homogeneous SaaS audience. At the bottom are open-source maintainers, solo developers, and small teams attracted by free OSS usage, fast setup, and contextual PR help. In the middle are startups and mid-market engineering teams that want higher review consistency without building internal tooling. At the top are larger organizations and regulated teams—financial services, healthcare, cybersecurity, and automotive—where platform engineering, developer-experience leaders, or security-conscious buyers care about governance as much as speed. Public evidence supports all of those layers: official pages emphasize OSS, self-serve, and enterprise controls; review aggregators skew heavily toward smaller teams; and named proofs now include EarnIn, Swiggy, Briya, Abnormal AI, BMW, Prokeep, and SalesRabbit.

    The buyer, user, and payer are not always the same person. Users are developers and reviewers in pull-request workflows. Champions often appear to be platform-engineering leaders, CTOs, or security-minded engineering managers who want a standard first-pass review layer across many repositories. Payers are likely engineering org budgets or enterprise platform owners rather than individual reviewers. That structure is favorable for land-and-expand because a few enthusiastic users can prove value quickly, but the full account often depends on centralizing standards, governance, and rollout policy above the individual repo.
  claimRefs:
