  rows:
  - - Open-source maintainers and communities
    - Maintainer / contributor / usually no direct payer
    - Filter spammy or low-quality PRs, catch bugs, keep review standards consistent
    - 150,000+ OSS projects claimed; OSS-focused program page and community resources
    - Top-of-funnel, developer credibility, and ecosystem reach
    - Paid conversion from OSS to enterprise is not public
  - - Solo developers and small teams
    - Founder or engineer / author-reviewer / small engineering budget
    - Fast AI PR feedback with minimal setup
    - Review aggregators skew toward small businesses and maintainers
    - Efficient self-serve acquisition and usage density
    - SMB churn and upsell rates unknown
  - - Mid-market engineering teams
    - Eng lead or CTO / developers + reviewers / central engineering budget
    - Standardize reviews, catch issues early, reduce reviewer load
    - Techreviewer and case studies show mid-market presence
    - Likely strong PLG-to-sales conversion band
    - No ACV or segment-mix data
  - - Large enterprises
    - Platform engineering / large developer base / enterprise platform budget
    - Consistent first-pass review across many repos and teams
    - BMW 1,000+ developers; Swiggy 1,000+ developers; EarnIn hundreds of engineers/repos
    - Important logo quality and expansion potential
    - Contract size, length, and paid-seat density unknown
  - - Regulated / compliance-sensitive teams
    - Platform, security, or compliance-aware engineering leader / governed dev teams / enterprise budget
    - Human-in-the-loop controls, documented standards, procurement posture
    - EarnIn, Briya, and Abnormal AI case studies
    - Supports premium positioning and lower-replaceability narrative
    - No independent renewal or audit evidence
  - - Cross-platform Git / DevOps users
    - Platform team / engineering org / centralized tooling budget
    - GitHub, GitLab, Azure DevOps, Bitbucket review coverage
    - Prokeep GitLab proof and broader host-support claims
    - Broader TAM and less single-host dependence
    - Host-level customer mix unknown
  notes: Customer evidence supports a wide pyramid from OSS to regulated enterprise, but the paid-revenue mix across those segments is not public.
