- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Open-source to paid team conversion
    - OSS usage may be broad but lightly monetized
    - Large top-of-funnel may not translate into revenue quality
    - Request OSS-to-paid conversion by repo and maintainer cohort
  - - Repo-level to org-wide rollout
    - A few champions may not generalize across all teams
    - Expansion may stall if noise or pricing friction appears
    - Request account-level expansion timelines and seat growth curves
  - - Cross-repo / multi-agent governance
    - Value can deepen significantly in AI-heavy orgs
    - Could skew revenue toward a small number of highly sophisticated buyers
    - Request product attach and ARR concentration among top AI-native accounts
  - - Security / automation / collaboration upsell
    - Broader platform can increase wallet share
    - Broader scope can also increase support and procurement burden
    - Request attach rates and renewal behavior by module
  - - Marquee enterprise logos
    - Top customers may represent outsized revenue share
    - Logo quality can mask concentration risk
    - Request top-10 customer revenue share and sector concentration
  - - Multi-host platform coverage
    - Broader host support expands TAM
    - Support burden may grow faster than revenue in lower-volume hosts
    - Request customer count and ARR share by Git host
  notes: Expansion logic is visible; concentration economics are not.
