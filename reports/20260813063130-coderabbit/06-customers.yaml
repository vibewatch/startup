- id: repeat-usage-and-satisfaction-signals
  title: Repeat Usage, Satisfaction, and Durability Signals
  body: |-
    Repeat-usage evidence exists, but it is proxy evidence rather than proper retention disclosure. The strongest signals are operational: Briya has already run more than 1,000 Linear MCP checks since starting its trial in May 2026; Abnormal AI reports more than 100 hours of reviewer time saved in the last 30 days and 65% acceptance for critical findings; a G2 reviewer says their company uses CodeRabbit on almost every pull request; and Swiggy’s public story describes thousands of comments flagged within a few months. These signals imply that CodeRabbit is not a novelty app that gets turned on once and forgotten. Teams appear to weave it into the daily review loop.

    Still, none of that equals durable SaaS-quality retention proof. Public materials do not show net retention, gross retention, renewal rate, contract length, seat expansion by cohort, or logo churn. Review-site evidence helps, but it has clear limits: samples are smaller, some reviews are older, and reviewer populations skew toward smaller teams. The correct reading is therefore nuanced. Satisfaction and repeat-use signals are directionally positive, especially where operators describe CodeRabbit as high-signal and low-noise. But the public record remains insufficient to conclude how sticky those accounts are over multi-year cycles or how consistently the product expands after first deployment.
  claimRefs:
