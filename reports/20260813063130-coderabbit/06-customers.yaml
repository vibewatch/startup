- id: TU006
  title: Customer feedback / complaint table
  columns:
  - Theme
  - Positive signal
  - Negative signal
  - What it likely means
  rows:
  - - Review quality
    - Case studies and G2 reviewers say CodeRabbit catches bugs and improves summaries
    - Some reviewers still report incorrect or over-eager suggestions
    - Signal quality is good enough to drive adoption but not perfect
  - - Large-team suitability
    - Swiggy, BMW, and EarnIn prove large-scale relevance
    - Reviewers say feedback can become noisy for larger teams
    - Enterprise fit depends on tuning, governance, and workload shape
  - - Reliability on big changes
    - Standard-sized PRs are viewed favorably in reviews
    - Techreviewer cites freezes and incomplete reviews on large PRs or high-volume commits
    - Heavy workloads may be the most important edge-case risk
  - - Pricing / budgeting
    - Free OSS tier and perceived value are strong positives
    - Active-contributor pricing and opaque fair-use limits frustrate some buyers
    - Procurement friction can slow expansion
  - - Admin / control surfaces
    - Platform teams like standards and configuration
    - Reviewers ask for stronger repo-level or admin controls in some cases
    - Larger organizations may need more governance depth
  - - Support / UX
    - Many users rarely need the web app for daily use
    - Some review data flags laggy web app pages and messy support experiences
    - Non-core surfaces may trail the core PR-review experience
  notes: Adverse customer evidence is meaningful because it clusters around scale, pricing clarity, and governance—not around basic value proposition.
