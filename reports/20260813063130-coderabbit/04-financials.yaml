- id: gtm-motion-and-traction-proxies
  title: GTM Motion, Expansion, and Traction Proxies
  body: |-
    The visible go-to-market motion looks like product-led adoption that can graduate into structured enterprise sales. Free trials, open-source access, self-serve plans, and GitHub-native distribution create low-friction entry points. The enterprise page then adds the classic higher-ACV controls—SSO, self-hosting, auditability, reports, and security/compliance positioning. Customer stories show the expansion logic more concretely. Swiggy ran a one-and-a-half-month proof of concept against competing tools. EarnIn explicitly examined whether to build an internal AI review layer and chose to buy CodeRabbit instead. Prokeep started with a smaller GitLab rollout and expanded as trust grew. Those are not just testimonials; they are clues about how the company converts developer interest into platform-engineering sponsorship and, eventually, budget.

    Public traction proxies are also strong, though mostly company-reported. The Series C announcement and mirrored coverage cite more than 17,000 customers, more than 150,000 open-source projects, and over 2 million code reviews each week. BMW’s investment and reference to 1,000+ BMW developers provide a marquee enterprise signal, while the enterprise page and case studies position NVIDIA, EarnIn, Swiggy, Prokeep, and Mastra as referenceable accounts or use cases. This is enough to support a credible revenue story, but it still stops short of the investor questions that matter most: paid-seat conversion, ACV distribution, net retention, expansion timing, and pipeline efficiency.
