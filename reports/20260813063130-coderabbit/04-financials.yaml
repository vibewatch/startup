- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: |-
    On financing, CodeRabbit’s pace is clearly venture-scale. Public company disclosures show a $16 million Series A in August 2024, a $60 million Series B at a $550 million valuation in September 2025, and a $143 million Series C at a $1.5 billion valuation in August 2026. SEC Form D filings add useful precision to the earlier rounds: the March 2024 filing disclosed a roughly $4.0 million offering with $3.6 million sold at filing time, while the September 2025 filing disclosed an offering up to $68.4 million with nine investors. The official Series C announcement says the new capital will fund international expansion, research and product development, and more than $10 million of support for open-source projects and maintainers over the next year.

    Those facts suggest capital adequacy is strong in the near term, but still impossible to underwrite rigorously from public sources alone. There is no public cash balance, monthly burn, debt schedule, or runway disclosure. Expansion into London, the broader EU footprint, and Japan implies a rising opex base; deeper security and agentic products imply continuing model and infrastructure spend. The business is far less capital-intensive than hardware, biotech, or logistics, but it is not capital-light in the way a simple seat SaaS company might be. The likely story is adequate growth capital after the Series C, coupled with continued dependence on external financing if the company chooses to prioritize market capture, product breadth, and open-source subsidy over near-term margin maximization.
