- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Why missing
  - Exact diligence path
  rows:
  - - ARR and revenue mix
    - Cannot translate traction into valuation quality
    - Private company does not disclose audited software revenue
    - Request ARR by core review, security, and usage products
  - - Gross margin by product
    - Cannot separate premium SaaS from compute-heavy AI services
    - Security and agent products likely have different cost curves
    - Request product-level gross margin and infrastructure allocation method
  - - Burn and runway
    - Cannot judge next-round dependency
    - No public cash balance or monthly burn disclosed
    - Request monthly burn, cash on hand, and 12/24-month operating plan
  - - Net retention / expansion
    - Cannot test land-and-expand durability
    - Case studies show adoption depth but not cohort economics
    - Request NRR, logo retention, and seat expansion by segment
  - - CAC / sales efficiency
    - Cannot tell whether PLG offsets enterprise-sales expense
    - No public funnel or conversion metrics disclosed
    - Request free-to-paid conversion, CAC, payback, and pipeline-to-close data
  - - Customer concentration
    - Cannot judge whether marquee logos dominate revenue
    - Named customers are reference logos, not revenue disclosures
    - Request top-10 customer revenue share and sector concentration
  notes: 'This table is the underwriting bottleneck: public materials are strong enough to support interest but not to close a serious investment memo without management data.'
