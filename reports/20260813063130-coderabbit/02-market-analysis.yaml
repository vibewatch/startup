- id: sizing-lenses-and-adoption-signals
  title: Sizing Lenses and Adoption Signals
  body: |-
    Public market-size estimates for this category vary widely because vendors and analysts define the problem differently. QY Research estimates the dedicated AI code review tool segment at roughly $2.08 billion in 2026. Global Growth Insights places the broader code review market around $8.47 billion in 2026. GII Research and related 2026 code-tools reports place the larger AI code tools market around $9.46 billion in 2026 with a roughly 23.7% growth rate. These figures should not be collapsed into a single “true TAM.” Instead they bracket a sensible range: a narrow review-only wedge, a broader code-review workflow category, and an even broader AI coding-tools universe.

    Adoption data supports the view that demand is real even if exact sizing is noisy. Stack Overflow’s 2026 analysis of 2025 survey results found AI-tool usage at 84% while trust fell to 29%, and a 2026 summary of JetBrains AI Pulse reported 90% workplace AI-tool usage. That combination—high usage, incomplete trust—is precisely the setup in which review and governance layers gain strategic relevance. Code creation is scaling faster than confidence in outputs, so the category does not need universal trust in generation tools to grow; it benefits from the absence of that trust.
  claimRefs:
  - CM007
  - CM008
  - CM009
