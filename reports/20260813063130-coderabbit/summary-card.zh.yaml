  topStrengths:
    - 品类时机好：AI 生成代码推高了审查和治理需求，CodeRabbit 把自己放在控制层，而不只是评论机器人。
    - 产品宽度已经看得见，覆盖 PR 审查、变更理解、安全、分诊和协作界面，具备先落地再扩张的空间。
    - 客户证据不只停在匿名创业公司背书，BMW、EarnIn、Swiggy、Briya 和 Abnormal AI 都提供了更有分量的验证。
    - 免费 OSS 使用和自助套餐带来很大的分发漏斗，可为付费转化和企业扩张埋下种子。
    - 新一轮融资势头和可信的投资人组合，降低了近期资本充足性风险。
  topRisks:
    - 估值透明度不足：ARR、NRR、毛利率、烧钱速度和客户集中度均未披露，外部很难承销 $1.5B 这个价格。
    - 平台原生和代码库感知型竞争对手会带来压力，可能压缩定价，也可能削弱工作流护城河叙事。
    - 隐私、采购和跨境数据处理要求，可能拖慢受监管行业或跨国企业扩张。
    - 大型或复杂 pull request 上的产品信号质量，仍是独立评测和基准评论反复提到的风险。
    - 这个价格要求公司跑出品类领导者级别的执行力；表现只是不错，可能守不住回报。
  unresolvedGaps:
    - 当前 ARR 或等价经常性收入，以及席位、用量、Security 和其他附加模块之间的拆分。
    - NRR、客户 logo 留存和头部客户集中度，这些数据决定乐观情景和基准情景能否分开。
    - 核心审查产品与新智能体产品各自的毛利率、支持负担和推理成本曲线。
    - Series C 中新股 / 老股比例、清算优先权和期权池稀释。
    - Security、Change Stack 和核心 PR 审查之外其他平台模块的附加率与续约证据。
