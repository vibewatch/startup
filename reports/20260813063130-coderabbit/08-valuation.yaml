- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Recurring revenue or ARR-equivalent is below ~$100M, multiple compresses toward ~5-6x public mid-tier developer-tools levels, and expansion into largest accounts slows.
    - $0.45B-$0.70B valuation band; current mark proves materially too rich.
    - Noise, privacy friction, and competitive pressure cap enterprise expansion.
    - Meaningful if ARR denominator is materially below investor expectations.
  - - Base
    - Recurring revenue lands around ~$120M-$160M, growth remains strong but not category-defining, and the market supports ~8-10x for a high-quality private AI developer-tools leader.
    - $1.0B-$1.6B valuation band; current mark is roughly full but not absurd.
    - Requires premium retention and acceptable margin path to hold.
    - Most consistent with public evidence, because strong quality signals exist but economics remain unproven.
  - - Bull
    - Revenue scales beyond ~$200M with durable enterprise retention, Security/agent products deepen wallet share, and CodeRabbit sustains a premium 11-13x style multiple as a category leader.
    - $2.2B-$3.0B+ valuation band; today’s round grows into an attractive entry.
    - Requires category-leader execution and limited competitive degradation.
    - Possible, but public evidence alone does not yet justify underwriting it as the default.
  notes: Scenarios are reverse-underwriting frames based on implied revenue thresholds, not management guidance.
