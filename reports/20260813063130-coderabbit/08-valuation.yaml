- id: recommendation-and-entry-discipline
  title: Recommendation and Entry Discipline
  body: 'The right recommendation on public evidence is track, not buy. CodeRabbit looks like a company worth following closely: strong market pull, credible product breadth, meaningful customer proof, real financing momentum, and a category that can still compound as AI-generated code increases review load. Yet almost every valuation-moving metric that would convert admiration into conviction remains private. Today’s price is therefore investable only for an investor already comfortable paying ahead of disclosure on the belief that CodeRabbit is building the control layer for AI software delivery.


    For most disciplined investors, that is too thin. Public comps do not prove that $1.5 billion is wrong; they prove that the current mark already assumes a strong revenue base and strong continuation. Without ARR, NRR, gross margin, and top-customer concentration, upside is harder to size than downside. Entry discipline therefore matters more than company quality. A lower price—roughly closer to the high hundreds of millions to low $1 billions—or new evidence that confirms low-hundreds-of-millions recurring revenue with strong retention could justify a more constructive stance. Until then, the correct posture is to track the company, not chase the round.'
