- id: final-diligence-asks-and-thesis-breakers
  title: Final Diligence Asks and Thesis-Breakers
  body: 'The diligence path from track to buy is clear. First, investors need the revenue denominator: ARR, usage mix, gross margin, NRR, logo retention, top-customer concentration, and expansion by cohort. Second, they need product proof that translates into economics: adoption of Security Agent, Change Stack, Slack/Discord automation, and enterprise attach rates rather than just core PR review. Third, they need a realistic read on risk transmission—how privacy/procurement friction, large-PR noise, or host-platform dependency affects close rates and renewals. If management can show premium retention and controlled margin despite those risks, the current mark could be defensible.


    The thesis breaks if growth decelerates sharply before those economics are proven, if noisy review limits expansion into the largest accounts, if privacy or procurement posture blocks regulated or multinational deployments, or if platform-native rivals make CodeRabbit’s breadth advantage feel less differentiated. At $1.5 billion, investors do not need catastrophe to lose money; they only need the company to become merely good instead of category-defining. That asymmetry is why the valuation stance is stretched rather than attractive. The company may still deserve its reputation. The open question is whether public evidence is strong enough to deserve today’s price.'
