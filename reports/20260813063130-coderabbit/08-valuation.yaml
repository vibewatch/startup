- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue denominator disappoints
    - ARR/revenue equivalent is materially below what a ~$1.5B mark needs at reasonable multiples
    - Entry discipline breaks first, then return math
    - Move from track to avoid at current price absent a repricing
  - - Enterprise durability weakens
    - NRR, renewal, or top-account stability underwhelms once disclosed
    - Bull case premium multiple no longer defendable
    - Re-rate to lower public comp band
  - - Noise / large-PR complaints escalate in strategic accounts
    - Repeated adoption or expansion stalls tied to product signal quality
    - Workflow-control thesis weakens directly
    - Lower growth and margin assumptions
  - - Privacy / procurement friction blocks regulated or multinational rollouts
    - Material lost deals or slowed security reviews
    - Enterprise TAM and premium positioning compress
    - Lower comparable multiple and scenario weights
  - - Platform-native or codebase-aware rivals close the gap
    - Win rates or pricing power deteriorate
    - Moat narrative weakens before scale economics are proven
    - Reduce upside case and premium multiple
  - - Usage-based economics prove unattractive
    - Large customers require too much support/overage complexity
    - Margin path weakens even if growth stays strong
    - Shift to stretched/avoid unless price falls
  notes: These triggers are designed for post-investment monitoring or pre-investment confirmatory diligence.
  claimRefs:
