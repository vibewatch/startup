    - EV/Sales on ~US$3.97B TTM revenue
    - ~20.9x EV/Sales; ~US$86.5B market cap; ~US$82.8B enterprise value
    - Upper-bound public software multiple for a category-leading observability/security platform
    - Far larger, more profitable, and less comparable on product scope
  - - CodeRabbit Series C
    - Private post-money mark
    - US$1.5B post-money after US$143M Series C
    - Actual entry point investors are evaluating
