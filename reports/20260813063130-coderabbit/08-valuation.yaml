- id: public-comparables-and-scenario-frame
  title: Public Comparables and Scenario Frame
  body: 'The public comp set is imperfect but still useful. GitLab trades at roughly 5.5x EV/Sales on about $1.0 billion of TTM revenue, JFrog at about 16.3x EV/Sales on roughly $0.56-0.60 billion of revenue, and Datadog at about 20.9x EV/Sales on nearly $4.0 billion of revenue. These are not direct peers: GitLab is a broader DevSecOps suite, JFrog is a software supply-chain platform, and Datadog is a much larger observability/security leader with different economics and scale. But the set does show the valuation band public markets place on high-quality developer tooling and infrastructure franchises in 2026.


    If CodeRabbit’s $1.5 billion valuation were marked against those public EV/Sales bands, the implied recurring revenue requirement ranges from roughly $72 million at Datadog-like multiples, to $92 million at JFrog-like multiples, to $273 million at GitLab-like multiples. That is a very wide range, and the width matters. The higher multiple bands are earned by companies with much deeper disclosure, cash-flow evidence, and enterprise penetration than CodeRabbit has publicly shown. That is why the base-case valuation should sit below the current mark unless investors are prepared to underwrite a leader-premium on faith. The bull case exists, but it requires not only continued growth—also proof that CodeRabbit’s installed base converts into sticky enterprise economics.'
