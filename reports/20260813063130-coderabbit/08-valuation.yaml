  - CV033
  - CV036
  - CV037
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - ARR and revenue mix
    - Current ARR, recurring vs usage mix, and paid-seat conversion
    - Without ARR the comp framework is reverse-engineered and fragile
    - Management data room / CFO diligence
  - - Retention quality
    - NRR, churn, renewal terms, and contraction/expansion cohorts
    - Premium multiple only holds if retention is strong
    - Finance + revops diligence
  - - Gross margin / support burden
    - Margin by core review, Security Agent, and over-limit review workflows
    - Determines whether premium SaaS multiple is justified
    - Finance + product ops diligence
  - - Customer concentration
    - Top-10 customer ARR share and revenue by segment/host
    - Named logos can mask concentration risk
    - Revops / board reporting
  - - Preference and dilution structure
    - Primary vs secondary split, liquidation preference stack, pro-rata dynamics
    - Return math depends on more than post-money headline valuation
    - Legal + term sheet review
  - - Module adoption
    - Attach rates for Security, Change Stack, Slack/Discord, and enterprise controls
    - Broader platform thesis matters only if modules are actually used
    - Product analytics / growth diligence
  notes: These asks are what separate a high-interest watchlist company from an investable underwritten position.
