        - Moat narrative weakens before scale economics are proven
        - Reduce upside case and premium multiple
      - - Usage-based economics prove unattractive
        - Large customers require too much support/overage complexity
        - Margin path weakens even if growth stays strong
        - Shift to stretched/avoid unless price falls
