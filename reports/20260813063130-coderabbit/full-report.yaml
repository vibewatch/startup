  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Product Positioning
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit is a young but unusually fast-scaling AI developer-tools company built around a simple thesis:
              code generation is becoming abundant, but trustworthy review remains scarce. The company’s own materials
              describe the mission as making every software change trustworthy and building an independent control layer
              for software created by people and agents. In product terms, CodeRabbit reviews pull requests for quality,
              security, and reliability, and it increasingly frames the product not as a chatbot assistant but as a
              decision layer around what should ship.


              The company was founded in 2023, and official press assets identify Harjot Gill and Guritfaq Singh as
              founders. Public location references are less clean. BMW’s financing announcement uses a Mountain View
              dateline, the body text of the same announcement describes CodeRabbit as headquartered in San Francisco,
              and CB Insights lists Walnut Creek. The right takeaway is not a precise street address but that CodeRabbit
              is a San Francisco Bay Area company with a growing global footprint. Product distribution is broad for
              such a young company: the homepage claims 6 million repositories and describes CodeRabbit as the most
              installed AI app on GitHub and GitLab, while the public GitHub organization shows a meaningful open-source
              and tooling presence of its own.
