            body: >-
              The visible go-to-market motion looks like product-led adoption that can graduate into structured
              enterprise sales. Free trials, open-source access, self-serve plans, and GitHub-native distribution create
              low-friction entry points. The enterprise page then adds the classic higher-ACV controls—SSO,
              self-hosting, auditability, reports, and security/compliance positioning. Customer stories show the
              expansion logic more concretely. Swiggy ran a one-and-a-half-month proof of concept against competing
