      - number: '7.4'
        title: Financial and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is high because CodeRabbit is trying to broaden from a PR-review bot into a larger agentic
              software-change platform while still supporting multiple code hosts and enterprise controls. The changelog
              and product surface show ambitious shipping velocity—Security Agent, Change Stack, automations, Slack and
              Discord agents, cross-host features, usage-based overages, and enterprise controls—all within a short
              period. That velocity is a strength if quality scales with it, but it is also a source of sprawl risk.
              Every new module adds support, compute, QA, documentation, and go-to-market complexity. Review-rate
              limits, fair-usage spacing, and usage-based credits are evidence that heavy AI review has real economic
              and operational constraints, not just software-like marginal cost curves.


              Financially, the residual risk is that aggressive growth and broad platform ambition can hide margin
              compression or support burden until later. Usage-based credits help preserve service continuity, but they
              can also create budget unpredictability for customers and cost unpredictability for CodeRabbit if tuning
              is weak. In parallel, the market itself is moving fast: GitHub, Copilot, Greptile, Qodo, and others are
              all pushing deeper review or codebase reasoning. CodeRabbit’s current differentiation is breadth,
              configurability, and workflow fit. If native platform competitors close that gap faster than CodeRabbit
              deepens quality, the risk would show up first in noise tolerance, customer expansion, and eventual pricing
              power.
