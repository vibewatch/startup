      - number: '4.3'
        title: Cost Structure and Unit-Economics Constraints
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit should have the structural advantages of a software company, but not the simplicity of a
              traditional low-compute SaaS business. Every review, repository scan, code-graph analysis, Slack agent
              session, and security investigation consumes inference, retrieval, sandboxing, and engineering-support
              capacity. The company’s own marketing reinforces this by distinguishing standard PR reviews from deeper
              security scans and agent workflows, which implies meaningful variation in underlying cost-to-serve.
              Security and continuous monitoring are especially important: they are higher-value products, but they also
              likely require more expensive reasoning, more verification, and more repository-wide processing than a
              standard pull-request summary.


              That means gross-margin quality is plausible but unresolved. Seat pricing suggests attractive software
              economics if usage is well-governed, especially because only PR-opening developers count as billable
              seats. But usage-based add-ons can push costs and revenues upward together, making realized margin quality
              dependent on metering discipline, customer behavior, and feature mix. Customer stories do provide ROI
              proxies—review time down around 30%, hundreds of repositories supported, independent first-pass coverage
              across large teams—but they do not solve the core underwriting gap. There is still no public CAC, payback,
              churn, NRR, gross margin, or customer-support burden data. Financially, CodeRabbit looks more like a
              promising but unproven AI-infrastructure SaaS than a fully transparent subscription machine.
