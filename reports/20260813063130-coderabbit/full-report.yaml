              CodeRabbit’s public product surface has expanded materially beyond its original PR-review identity. The
              docs homepage, main site, and Series C launch materials all present the company as an Agentic Change
              Management platform that combines AI code reviews, Triage, Change Stack, Security, Slack/Discord agents,
              IDE reviews, CLI reviews, and planning or issue-management tools. That framing matters because it moves
              CodeRabbit from a point feature inside the pull-request screen toward a broader control layer for
              AI-authored software changes. In practical workflow terms, the product now serves multiple users inside
              the same engineering organization: authors who want rapid feedback, reviewers who need summarized context,
              platform teams that want policy and automation, and security teams that want repository-wide scanning.


              The module map is also commercially important because it explains why the product can expand beyond a
              single review comment experience. CodeRabbit is building adjacent surfaces around understanding large
              changes, routing review attention, validating linked issues, generating fixes, and connecting work across
              Slack, Git platforms, and issue trackers. The platform narrative is credible because it is reflected
              repeatedly across official documentation and the changelog, not just in a single funding press release.
              The main technical caveat is that public documentation explains the workflow well but remains sparse on
