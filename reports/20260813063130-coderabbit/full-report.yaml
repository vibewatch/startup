      - number: '2.5'
        title: Strategic Implication for CodeRabbit
        blocks:
          - type: paragraph
            body: >-
              For CodeRabbit specifically, the market conclusion is attractive but not unconstrained. The category is
              large enough to matter, expanding quickly enough to support venture-scale outcomes, and still fragmented
              enough that a specialist can win if it goes deeper than bundled platform features. CodeRabbit’s best
              argument is not that every organization will buy a stand-alone reviewer forever; it is that
              code-generation growth creates a new governance layer that large platforms and generic AI assistants have
              not yet fully owned. That is why the company keeps widening from PR review into change triage,
              explanation, and security monitoring.


              At the same time, honest SAM discipline is essential. The company should not be underwritten against the
              entire AI developer-tools market. A more realistic opportunity is the subset of repositories, teams, and
              enterprises that both produce enough code change to feel review pain and care enough about governance,
              compliance, or release quality to pay for an independent validation layer. On that basis, the market is
              compelling: narrower than generic AI coding, but better monetized and more durable when trust and
              oversight matter.
            claimRefs:
              - CM019
              - CM030
              - CM031
              - CM032
              - CM035
              - CM036
              - CM038
