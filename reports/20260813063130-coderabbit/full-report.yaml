      - number: '6.4'
        title: Expansion Loops and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The expansion logic is clear even though the economics are not. CodeRabbit can land through open source, a
              single repo, a team pilot, or an engineering leader solving review fatigue. It can then expand across more
              repositories, more developers, more code hosts, and more workflows such as security, automations,
              Slack/Discord agents, and multi-repo governance. The case studies support that pattern directly. Briya
              moved to a cross-agent governance layer. Prokeep started small and expanded. SalesRabbit broadened from a
              small test to rapid internal demand. Swiggy’s POC emphasized architecture-aware feedback at
              1,000-plus-developer scale. EarnIn integrated standards, severity signals, AST-grep rules, and analytics
              into a larger review system. In other words, the product seems designed to grow horizontally within
              engineering orgs after it wins one workflow.


              The risk is that expansion and concentration remain mostly invisible in public data. Marquee logos are
              valuable, but investors do not know whether a handful of reference customers account for a large share of
              paid revenue. Reviewers also surface friction that could slow expansion in some segments:
              active-contributor pricing can feel misaligned when only a few people review; fair-use limits are
              described as opaque; large PRs can freeze or return incomplete analysis; and some users want stronger
              admin or repo-level controls. None of those complaints disproves product-market fit, but they do show that
              customer love is not universal and that scaling from enthusiast adoption to enterprise-wide
              standardization can still be operationally messy.
