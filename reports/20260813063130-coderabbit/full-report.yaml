      - number: '3.4'
        title: Moat Durability and Threat Verdict
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit’s moat is real, but it is narrower than a generic “best AI reviewer” narrative suggests. The
              durable elements are specialist focus, cross-host support, a workflow built around pull-request review
              rather than generic code generation, and a growing control-plane story around triage, change
              understanding, and security. Those matter because review is becoming the bottleneck as AI coding agents
              generate more changes than humans can comfortably absorb. A specialist that can sit across GitHub, GitLab,
              Azure DevOps, and Bitbucket still has a clearer reason to exist than a GitHub-only feature.


              The erosion vectors are equally concrete. GitHub can bundle review, agent handoff, and policy inside the
              repository workflow many developers already use. Greptile can win on depth when cross-file reasoning
              matters more than comment noise. Sonar, Semgrep, Snyk, Codacy, DeepSource, and Qodana can win when the
              buyer wants auditable quality or security gates rather than a reviewer persona. Independent review sources
              also warn that benchmark marketing is noisy, public scorecards are often vendor-shaped, and CodeRabbit
              itself can become verbose or incomplete on large, architecture-heavy pull requests. The balanced verdict
              is favorable but not complacent: CodeRabbit looks well positioned for polyglot, multi-host teams that want
              a specialist first-pass reviewer, but its long-run moat depends on owning a broader review-and-governance
              layer before bundled platforms and deeper suites commoditize the core comment stream.
