      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase
            body: >-
              CodeRabbit is credible enough to stay on the list, but public evidence is not strong enough to justify
              paying a full $1.5B mark without management data.
            calloutType: recommendation
            claimRefs:
              - CV016
