          - type: callout
            title: The valuation argument is really an ARR argument
            body: >-
              Public comps do not tell you what CodeRabbit is worth unless you know whether the company is closer to
              ~$80M, ~$150M, or ~$250M recurring revenue.
            calloutType: insight
            claimRefs:
              - CV003
