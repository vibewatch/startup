            body: >-
              At the workflow level, CodeRabbit is best understood as a context-ingestion and review-orchestration
              system wrapped around modern code-change processes. Pull requests remain the anchor surface, but the docs
              show multiple layers around that anchor: PR summaries, walkthroughs, linked-issue validation, code
              guidelines, learnings, path instructions, pre-merge checks, post-merge actions, and the newer Change Stack
              interface. Change Stack is especially notable because it treats a pull request as a structured set of
              logical cohorts and layers rather than a flat file list. That is a product decision aimed directly at the
              core pain of AI-generated code: the diffs are larger, more diffuse, and harder to review linearly.


              The public Security Agent documentation is the strongest mechanism-level source in the product set. It
              details a repository-wide process of mapping, investigating, and verifying code and infrastructure
              findings; it distinguishes PR Findings from AI Deep Scan results; and it explains reachability,
              exploitability, partial coverage, excluded paths, custom path instructions, and recurring schedules. That
              specificity suggests real workflow engineering rather than a shallow wrapper on generic LLM calls. Still,
              there is no comparable public depth for the non-security orchestration engine, so investors should treat
              security workflow documentation as a strong proof point for technical seriousness, not as complete
              transparency into the entire platform.
