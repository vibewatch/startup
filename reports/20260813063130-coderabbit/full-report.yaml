      - number: '3.3'
        title: Capability Breadth, Pricing, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Public pricing makes the category look comparable at first glance, but the billing units are diverging.
              CodeRabbit sells seat-based specialist review at $24 per user per month annually for Pro and $48 for Pro
              Plus, with separate pricing for Security and usage-based Slack agents. GitHub Copilot looks cheaper at $10
              for Pro and $19 for Business, but code review also consumes AI credits and, on private repositories,
              GitHub Actions minutes. Greptile mixes seat pricing with review credits and overages. Sonar now presents
              both its traditional code-verification plans and Gitar’s AI review tiers. Semgrep charges per contributor
              with separate modules. Amazon Q Developer layers free and pro tiers on top of request and transformation
              limits. For enterprise buyers, “entry price” therefore says less than the meter and expansion path.


              That complexity reinforces multi-homing. A realistic enterprise stack can use CodeRabbit or Copilot for
              reviewer UX, SonarQube or Codacy for quality governance, Semgrep or Snyk for security depth, and Greptile
              for especially complex codebase-wide investigations. Public review sources repeatedly describe CodeRabbit
              as faster and lower-noise than some rivals, but also as shallower on architectural completeness than
              deeper context tools. That pattern is consistent with the product’s lane: it is strongest as a
              high-frequency first-pass reviewer, not as the only quality, security, or architecture gate in the stack.
