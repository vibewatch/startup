      - number: '7.5'
        title: Mitigations, Thesis-Breakers, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit is not a fragile thesis, but it is a thesis that depends on disciplined deployment. The
              mitigations visible in public sources are credible: human approval remains the final gate, enterprise
              buyers can seek self-hosting and custom security reviews, repository controls and path instructions allow
              tuning, and the company openly documents review limits and security caveats instead of pretending the
              system is infallible. The customer stories also show a healthy usage pattern in better-fit accounts:
              CodeRabbit is used to absorb first-pass noise, while humans keep architecture, compliance, and
              business-logic judgment.


              The thesis breaks if that governance pattern stops working. If large customers repeatedly see noisy or
              incomplete review on important diffs, if procurement friction around privacy or contracting blocks
              expansion, if fair-usage throttling becomes a recurring complaint in AI-heavy engineering orgs, or if a
              public security/privacy incident undermines trust, then the platform-control thesis weakens quickly. The
              investment implication is therefore straightforward: treat risk as monitorable, not theoretical. The
              company can survive ordinary product iteration, but it should not be granted the benefit of the doubt on
              retention, enterprise durability, or margin quality until management-level data proves that the control
              layer is scaling as cleanly as the marketing narrative says it is.
