        - id: pilot
          label: Pilot or POC
          description: Teams validate contextual quality against real PRs, often in side-by-side tests.
        - id: repo
          label: Repo or team standardization
          description: CodeRabbit becomes the default first-pass reviewer on selected repositories or teams.
        - id: org
          label: Org-wide governance layer
          description: Platform teams add learnings, policies, human gates, and multi-repo coverage.
        - id: expand
          label: Workflow expansion
          description: Security, collaboration agents, or broader host coverage deepen usage and wallet share.
