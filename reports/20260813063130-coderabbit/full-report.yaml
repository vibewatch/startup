      - number: '7.2'
        title: Product Quality, Security, and False-Confidence Risk
        blocks:
          - type: paragraph
            body: >-
              The product risk that matters most is not whether CodeRabbit can ever catch useful bugs; public evidence
              says it clearly can. The risk is whether teams tune their trust to its real strengths and limits. Official
              security documentation is candid: Security Agent does not prove a repository is vulnerability-free,
              completed scans can still be partial, and high-risk findings still need evidence and human interpretation.
              Independent reviews and benchmarks sharpen the concern. CuratorBits, G2, Techreviewer, and Pegotec all
              describe noise or false positives as the most consistent downside, especially on large pull requests.
              Pegotec goes further by positioning CodeRabbit as fast first-pass linting rather than a substitute for
              architectural review, while Baeseokjae’s comparison says the tool trades lower bug-catch rate for lower
              noise and broader platform support.


              This is not a trivial UX complaint. In a code-review tool, noise and overconfidence can compound into
              operational risk. If developers learn to ignore the bot, the tool loses value. If they trust it too much,
              genuine business-logic or authorization errors can slip through. The best mitigation is the one CodeRabbit
              itself and several case studies already reflect: preserve human approvals, keep PRs small, tune controls,
              and treat AI review as a first-pass or mid-pass layer rather than a final security or architecture
              decision.
            claimRefs:
