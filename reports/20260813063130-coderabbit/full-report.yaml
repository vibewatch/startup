      - number: '5.4'
        title: Trust, Security, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Trust and control mechanisms are central to CodeRabbit’s value proposition because the product is inserted
              into code-review and security decisions rather than low-stakes chat. Public sources give reasonably good
              evidence here. The enterprise and marketplace surfaces emphasize self-hosting, audit logs, vendor review,
              and privacy controls, including opt-out from data storage. The security docs add concrete operational
              controls: permissions, recurring schedules, excluded paths, repository context, verification states,
              severity adjustments via reachability and exploitability, and a hard warning that Security Agent does not
              prove a repository is vulnerability-free. InfoWorld’s independent coverage reinforces another important
              point: CodeRabbit is not positioned as the final merge authority; CODEOWNERS, required checks, branch
              protections, and approvals remain the gate.


              That separation between assistance and authority is a technical plus. It lowers the risk that adoption
              depends on fully trusting an AI system to replace human governance. At the same time, public trust
              evidence is still incomplete. There is no robust public uptime history, false-positive benchmarking,
              bug-detection recall, or independent red-team style evaluation across the core review engine. The result
              is a sensible but partial trust posture: the controls look real, yet the public record is still stronger
              on documented mechanisms than on audited operating outcomes.
