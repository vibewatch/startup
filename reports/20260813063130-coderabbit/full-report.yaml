  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Privacy, and Procurement Risk
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit’s legal and privacy posture is a real diligence topic because the product requires read access
              to source code and often touches sensitive proprietary logic. The strongest official evidence is mixed
              rather than purely reassuring. The privacy policy says CodeRabbit does not use personal information
              collected as part of private code review to train its own or third-party models, but it explicitly carves
              out open-source projects, stating that OSS is used to train its systems. The policy also says servers are
              located in the United States, that residual information may persist even after deletion requests, and that
              data transfers are governed by the company’s policy framework rather than by any publicly surfaced
              customer-specific agreement. For regulated or multinational buyers, these are manageable issues, but they
              are still procurement and compliance issues.


              There is also a plan-tier gating risk. The knowledge-base article on contract redlines says formal vendor
              security reviews and custom contracts are offered to Enterprise customers, while other plans are directed
              to self-serve documents through the Trust Center. That is reasonable operationally, but it means some
              customers can discover security or contracting friction only after initial adoption. The external
              regulatory backdrop matters too: California privacy rights and GDPR transfer obligations create a
              compliance floor that becomes more consequential as CodeRabbit touches more enterprise and cross-border
              repositories.
