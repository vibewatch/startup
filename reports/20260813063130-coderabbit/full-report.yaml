            body: >-
              CodeRabbit’s public revenue model is unusually legible for a private infrastructure-style startup. The
              core monetization surface is recurring SaaS subscription revenue tied to developers who open pull
              requests: Pro at $24 per user per month annually, Pro Plus at $48, and enterprise contracts sold through a
              contact-sales motion. That core seat model is no longer the whole story. The pricing page also exposes
              CodeRabbit Security at $40 per user per month plus usage-based repository scans, unrestricted review
              credits sold separately, and a Slack agent priced at $0.50 per agent minute. The docs and homepage widen
              the monetization frame further by showing a broader Agentic Change Management stack spanning review,
              triage, change understanding, CLI, IDE, and collaboration workflows.


              That matters financially because CodeRabbit is evolving from one recurring seat product into a layered
              pricing architecture. The seat model should support predictable base revenue if adoption is steady, but
              usage-based security scans and agent minutes introduce a more compute-sensitive expansion path. Free
              open-source usage and 14-day trials act as distribution, not just generosity: they reduce sales friction,
              generate developer habit, and create an upgrade path into team or enterprise plans. The result is
              promising revenue breadth, but also a more complex blend of recurring and usage-linked monetization than a
