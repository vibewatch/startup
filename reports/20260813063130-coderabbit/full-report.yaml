              security scans, IDE/CLI parity, and Slack or Discord agents all point to a thesis that AI-generated code
              creates a change-management problem, not just a static-analysis problem. The summer 2026 changelog
              supports that reading because it shows rapid expansion across Change Stack, Security Agent, cross-platform
              delivery, Bitbucket and Azure features, IDE resilience, and automation infrastructure. Technically, that
