      - number: '3.2'
        title: Platform Bundles Versus Specialists
        blocks:
          - type: paragraph
            body: >-
              The most important competitive fault line is not model brand but distribution. GitHub can treat code
              review as a native repository feature, bill it through Copilot AI credits, and route follow-up work to its
              cloud agent. AWS is making a similar move by de-emphasizing new CodeGuru Reviewer associations and
              steering buyers toward Amazon Q Developer’s broader agentic workflow. Those platform players reduce
              procurement friction because the review surface is packaged with tooling buyers may already use for source
              control, CI, or cloud development. If a team is all-in on GitHub, a “good enough” native reviewer can
              block a stand-alone vendor from even entering the conversation.


              Specialists survive by going deeper or wider than the bundle. CodeRabbit’s defensible wedge is wider host
              coverage than GitHub-only Copilot, plus a workflow specialized around PR walkthroughs, learnings,
              configurable checks, IDE and CLI reviews, and enterprise review controls. Greptile tries to go deeper by
