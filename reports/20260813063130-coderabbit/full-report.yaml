      - number: '2.2'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The user is usually still the engineer in the pull-request workflow, but the buyer and payer increasingly
              widen as deployments mature. Early usage can start with a single repository or a few reviewers who want
              faster feedback. Once the tool becomes embedded in pre-merge checks, post-merge actions, CI/CD analysis,
              issue-tracker context, or self-hosted enterprise deployments, ownership shifts toward platform
              engineering, AppSec, developer productivity teams, and procurement. The pricing page itself hints at this
              ladder: individual and team plans emphasize PR reviews and agentic feedback, while enterprise packaging
              adds RBAC, SSO, audit logging, API access, self-hosting, EU SaaS deployment, and vendor security review.


              That segmentation matters for market sizing. A tool sold only to individual developers is bounded by seat
              budgets and point-tool fatigue. A tool sold into governance, security, and release-control workflows can
              pull budget from broader engineering effectiveness and risk-reduction pools. In practice, the most
              attractive buyers are organizations with high PR volume, meaningful compliance needs, or multiple teams
              generating AI-assisted code at once. The economic logic is especially strong where review bottlenecks
              create direct release friction or where security leadership wants an independent validation layer before
              code ships.
