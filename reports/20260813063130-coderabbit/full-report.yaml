  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit does not fit neatly inside one legacy software category. The narrowest view is “AI code
              review,” meaning automated comments and suggestions on pull requests. The more realistic market boundary
              is broader: review, prioritization, explanation, and security validation for changes generated by humans
              and coding agents. That boundary sits at the overlap of code-quality tooling, AppSec workflow, CI/CD
              governance, and collaboration software. It is still much narrower than “all AI developer tools,” because
              CodeRabbit does not try to be a full IDE, a generic autocomplete assistant, or a full incident-management
              platform.


              This boundary matters because the real substitutes are not just rival AI review bots. Teams can attempt to
              solve the problem with manual PR review, CODEOWNERS and branch policies, linters and SAST tools, CI gates,
              or issue-tracker routing. Those substitutes work tolerably when code volume is human-scale, but they break
              down as AI systems create larger and more numerous pull requests. CodeRabbit’s own repositioning toward
              Agentic Change Management is effectively an argument that the market is no longer just about comment
              generation; it is about creating a trustworthy operating layer around software change.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM019
              - CM033
              - CM035
