  - type: private-evidence-only
    severity: material
    topic: Operational quality telemetry
    missingEvidence: No public acceptance-rate distribution by PR size, false-positive trend line, latency percentiles, or scan recall benchmarks.
    whyItMatters: The core operational risk—noise versus value—cannot be properly ranked without internal telemetry.
    diligencePath: Request product analytics segmented by PR size, language, host, customer tier, and module.
