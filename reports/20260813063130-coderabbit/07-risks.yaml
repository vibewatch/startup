  claims:
  - id: CR001
    statement: CodeRabbit’s privacy risk is material because the product requires source-code access and processes sensitive repository context, not just public metadata.
    type: observed
    topic: privacy-risk
    sourceRefs:
    - SR001
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR002
    statement: The privacy policy explicitly says private code-review data is not used to train CodeRabbit’s or third-party models, but OSS data is used to train its systems.
    type: observed
    topic: privacy-risk
    sourceRefs:
    - SR001
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR003
  - id: CR003
    statement: US-server processing and cross-border transfer mechanics create procurement friction for multinational or regulated customers even if the company can satisfy many of them contractually.
    type: inferred
    topic: privacy-risk
    sourceRefs:
    - SR001
    - SR029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR004
  - id: CR004
    statement: Deletion and privacy-right requests are supported in policy, but the policy also says residual information may persist for legal, archival, or operational reasons.
    type: observed
    topic: privacy-risk
    sourceRefs:
    - SR001
    - SR028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR004
  - id: CR005
    statement: California privacy rights and GDPR obligations raise the regulatory floor for any company processing code-adjacent personal information from those jurisdictions.
    type: observed
    topic: regulatory-risk
    sourceRefs:
    - SR028
    - SR029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
    - QR005
  - id: CR006
    statement: CodeRabbit’s official privacy stance is more explicit than many startup AI tools, but explicit policy language does not remove customer-specific compliance diligence.
    type: inferred
    topic: privacy-risk
    sourceRefs:
    - SR001
    - SR018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR006
  - id: CR007
    statement: Formal vendor security reviews, redlines, and custom contracts are enterprise-plan capabilities, which can make contracting risk more salient as teams move upmarket.
    type: observed
    topic: legal-risk
    sourceRefs:
    - SR004
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR007
  - id: CR008
    statement: The published ToS and KB guidance confirm a standard SaaS legal framework exists, but negotiated indemnities and security terms remain private diligence items.
    type: observed
    topic: legal-risk
    sourceRefs:
    - SR002
    - SR003
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR007
  - id: CR009
    statement: The public Trust Center and enterprise controls are real mitigations, but public trust evidence is still thinner than a full enterprise security package.
    type: inferred
    topic: legal-risk
    sourceRefs:
    - SR005
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
    - QR007
  - id: CR010
    statement: CodeRabbit’s own security docs warn that scans do not prove the absence of vulnerabilities, so any customer using the tool as a certification layer would be misusing it.
    type: observed
    topic: quality-risk
    sourceRefs:
    - SR008
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR009
  - id: CR011
    statement: Independent reviews converge that the most common operational complaint is nitpick noise or false positives, especially on larger pull requests.
    type: observed
    topic: quality-risk
    sourceRefs:
    - SR021
    - SR022
    - SR023
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR010
  - id: CR012
    statement: Large pull requests can also trigger latency or incomplete analysis, which matters most when hotfixes or complex diffs need fast review.
    type: observed
    topic: quality-risk
    sourceRefs:
    - SR007
    - SR022
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
