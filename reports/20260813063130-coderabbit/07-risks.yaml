- id: partner-platform-and-customer-risk
  title: Partner, Platform, and Customer Risk
  body: |-
    CodeRabbit depends on a stack of external platforms that are strategic assets and risk channels at the same time. Git hosts, issue trackers, collaboration tools, payment and subscription processors, and upstream model providers all shape the product experience. The privacy policy explicitly names GitHub, Jira, Linear, OpenAI, and Anthropic. Product docs show strong support across GitHub, GitLab, Bitbucket, and Azure DevOps, but they also reveal uneven behavior by platform: some large-PR usage-pricing actions are GitHub-only, recurring schedules have provider-specific constraints, and the commercial value proposition partly rests on being broader-platform than some rivals. That is useful differentiation, but it also increases support burden and multiplies the number of places where a dependency change can break customer value.

    Customer risk is intertwined with platform risk. Independent reviews skew toward smaller teams and maintainers, while public enterprise proofs are stronger on named logos than on renewals or concentration. If a few sophisticated, AI-heavy reference customers drive a large share of ARR, then any procurement setback, security event, or host-specific limitation could transmit quickly into revenue quality. The good news is that the customer base appears diversified across OSS, SMB, and enterprise. The bad news is that public evidence is still too thin to quantify that diversification with confidence.
  claimRefs:
  - CR020
  - CR021
