    - QR011
  - id: CR013
    statement: Multiple independent sources characterize CodeRabbit as a fast first-pass reviewer rather than a replacement for deep architectural or authorization review.
    type: observed
    topic: quality-risk
    sourceRefs:
    - SR024
    - SR025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
    - QR012
  - id: CR014
    statement: 'The highest product risk is false confidence: either developers over-trust CodeRabbit and skip necessary human scrutiny, or they under-trust it and ignore useful findings.'
