- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Noise overwhelms value
    - Accepted-comment rate falls or dismissals spike on large PRs
    - Sustained acceptance deterioration or repeated customer complaints from top accounts
    - Re-rate product-quality assumptions and expansion confidence downward
  - - Procurement / privacy friction
    - Enterprise security reviews stall or DPA / regional data questions block deals
    - Multiple delayed or lost enterprise deals tied to privacy or hosting posture
    - Cut enterprise-expansion confidence and demand evidence of resolved controls
  - - Fair-usage / overage friction
    - Heavy users repeatedly hit throttles or usage-based complaints
    - Pattern of over-limit incidents among strategic accounts
    - Treat model economics and customer fit as weaker than marketed
  - - Platform dependency break
    - A major Git host or integration change degrades review quality or automation
    - Provider-specific incident or long-lived feature asymmetry
    - Increase dependency discount and revise cross-host moat assumptions
  - - Security trust break
    - Public breach, material privacy incident, or high-profile missed vulnerability
    - One material trust event with customer fallout
    - Move to avoid / thesis-broken pending remediation evidence
  - - Concentration surprise
    - Top-customer ARR share or logo dependence is much higher than expected
    - A few accounts dominate ARR or roadmap dependence
    - Re-price customer-risk premium and require stronger diversification evidence
  notes: The kill criteria are designed to be monitorable through diligence or board-level reporting, not just intuitive fears.
