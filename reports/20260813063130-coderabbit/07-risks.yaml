  - type: missing-source
    severity: material
    topic: TR001 legal audit completeness
    missingEvidence: No public DPA, subprocessor list, incident history, negotiated indemnity samples, or regulator correspondence was found.
    whyItMatters: The public legal picture is sufficient for screening but not for underwriting enterprise trust or compliance resilience.
    diligencePath: Request DPA, subprocessor inventory, privacy counsel memo, incident log, and sample enterprise security / legal redlines.
