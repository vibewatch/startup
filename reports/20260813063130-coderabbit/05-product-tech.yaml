    - id: review
      label: AI review output
      description: Summaries, line comments, walkthroughs, and suggested issues or fixes are generated.
    - id: route
      label: Routing and understanding
      description: Triage and Change Stack help the team prioritize and inspect the change logically.
    - id: secure
      label: Security / quality checks
      description: Pre-merge checks or repository-wide scans add deeper quality and vulnerability analysis.
    - id: act
      label: Action and handoff
      description: Humans approve, skip, fix, or hand work to Autofix, IDE, CLI, or Slack/Discord agent workflows.
