- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - CodeRabbit solution
  - Measurable benefit signal
  - Limitation
  rows:
  - - Understand a large AI-authored PR
    - Flat file lists obscure logic and blast radius
    - PR summaries, walkthroughs, and Change Stack cohorts/layers
    - Customers and docs emphasize faster understanding and review focus
    - No public benchmark on review-time reduction by feature
  - - Catch code or logic issues before merge
    - Human reviewers miss edge cases and become overloaded
    - Line-by-line review plus pre-merge checks and linked-issue validation
    - Marketplace and docs show actionable comments and issue checks
    - Independent error-detection recall not public
  - - Review local changes before opening a PR
    - Problems surface late if review starts only on remote PRs
    - CLI reviews local committed, staged, and tracked edits
    - CLI docs show same review engine applied pre-PR
    - Local review throughput and false-positive profile not public
  - - Investigate or plan work in collaboration tools
    - Context is fragmented across Slack, issues, and repos
    - Slack/Discord agent can investigate, plan, and open PRs
    - Automation docs show recurring, event-driven, and webhook workflows
    - Permissioning and ops complexity rises with each connection
  - - Scan full repositories for security issues
    - Diff-only review misses latent vulnerabilities and secrets
    - Security Agent performs recurring repo-wide analysis, dependencies, SBOM, secrets, and AI Deep Scan
    - Mechanism detail is strong in docs
    - Security Agent explicitly does not prove the repository is secure
  - - Coordinate policy and team learnings
    - Review quality varies across teams and code paths
    - Code guidelines, learnings, path instructions, and custom checks encode team context
    - Docs describe reusable instructions and config
    - No public evidence on long-term learning quality or drift
  notes: Use cases map cleanly to real engineering workflows, but public benefit proof is still qualitative rather than benchmarked.
