  - type: missing-source
    severity: material
    topic: Model orchestration internals
    missingEvidence: No public architecture deep dive on model routing, provider mix, evaluation pipeline, or cost controls outside workflow descriptions.
    whyItMatters: Investors cannot tell whether differentiation comes from proprietary orchestration, prompt engineering, data flywheels, or vendor aggregation.
    diligencePath: Request technical architecture review covering model stack, retrieval/context pipeline, evaluation loop, and guardrail infrastructure.
