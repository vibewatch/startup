        - 噪声、隐私摩擦和竞争压力封顶企业扩张。
        - 如果 ARR 分母显著低于投资人预期，该情景就有意义。
      - - 基准
        - 经常性收入落在 ~$120M-$160M 左右，增长仍强但不足以定义品类；市场愿意给高质量私有 AI 开发者工具龙头 ~8-10x。
        - $1.0B-$1.6B 估值区间；当前标记价格大致打满，但并不荒谬。
        - 需要高端留存和可接受的利润率路径来支撑。
        - 与公开证据最一致：质量信号很强，但经济性仍未证实。
      - - 乐观
        - 收入扩至 ~$200M 以上，企业留存持久，Security / 智能体产品加深钱包份额；CodeRabbit 作为品类龙头维持类似 11-13x 的溢价倍数。
        - $2.2B-$3.0B+ 估值区间；今天这一轮最终会长成有吸引力的入场点。
        - 需要品类龙头级执行，且竞争侵蚀有限。
        - 有可能，但仅靠公开证据还不足以把它作为默认承销情景。
    notes: 情景是基于隐含收入门槛的反向承销框架，不是管理层指引。
