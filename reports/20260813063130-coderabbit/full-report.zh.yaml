      - number: '4.3'
        title: 成本结构与单位经济约束
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 应该具备软件公司的结构性优势，但没有传统低算力 SaaS 那么简单。每一次审查、仓库扫描、代码图分析、Slack agent
              会话和安全调查，都会消耗推理、检索、沙箱和工程支持能力。公司自身营销也通过区分标准 PR 审查、更深的安全扫描和智能体工作流强化了这一点，说明底层服务成本差异很大。Security
              和连续监控尤其重要：它们价值更高，但相比标准 PR 摘要，也很可能需要更昂贵的推理、更多验证和更大范围的仓库处理。


              因此，毛利率质量有可能不错，但仍未解决。席位定价暗示，如果用量控制得好，软件经济性会有吸引力，尤其是只有发起 PR
              的开发者计为可计费席位。但按量计费附加模块可能让成本和收入一起上升，使实际毛利质量取决于计量纪律、客户行为和功能组合。客户故事确实提供了 ROI 代理指标——审查时间下降约
              30%、支持数百个仓库、覆盖大型团队的独立第一遍审查——但不能填上核心投资判断缺口。公开材料仍没有 CAC、回本周期、流失、NRR、毛利率或客户支持负担数据。财务上，CodeRabbit
              更像一家前景不错但尚未被充分证明的 AI 基础设施 SaaS，而不是一台完全透明的订阅机器。
