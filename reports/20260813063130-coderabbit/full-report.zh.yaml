      - number: '4.2'
        title: GTM 动作、扩张与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              可见的 GTM 动作像是产品驱动采用，并能升级为结构化企业销售。免费试用、开源访问、自助计划和 GitHub 原生分发创造低摩擦入口。企业页面再加入典型的高 ACV
              控制项——SSO、自托管、可审计性、报告以及安全 / 合规定位。客户故事更具体地展示了扩张逻辑。Swiggy 针对竞品做了一个半月概念验证（PoC）。EarnIn 明确评估过是否自建内部 AI
              审查层，最终选择购买 CodeRabbit。Prokeep 从较小的 GitLab 推出开始，随着信任增长而扩张。这些不只是客户背书；它们提示公司如何把开发者兴趣转化为平台工程赞助，并最终转化为预算。


              公开牵引力代理指标也很强，尽管多数来自公司自报。Series C 公告及镜像报道提到超过 17,000 家客户、超过 150,000 个开源项目，以及每周超过 200 万次代码审查。BMW 的投资和 1,000+
              名 BMW 开发者背书提供了标杆企业信号；企业页面和案例研究则把 NVIDIA、EarnIn、Swiggy、Prokeep 和 Mastra
              塑造成可引用账户或使用场景。这足以支撑可信的收入故事，但还没有回答投资人最关心的问题：付费席位转化、ACV 分布、净留存、扩张节奏和管道效率。
