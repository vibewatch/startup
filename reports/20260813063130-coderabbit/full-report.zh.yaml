      - number: '6.3'
        title: 重复使用、满意度与耐久性信号
        blocks:
          - type: paragraph
            body: >-
              重复使用有证据，但这些证据是代理指标，不是真正的留存披露。最强信号来自运营数据：Briya 自 2026 年 5 月开始试用以来，已经跑了 1,000 多次 Linear MCP 检查；Abnormal AI
              报告过去 30 天节省了 100 多小时评审时间，关键发现接受率为 65%；一位 G2 评审者称其公司几乎在每个 PR 上都使用 CodeRabbit；Swiggy
              的公开故事提到几个月内标记了数千条评论。这些信号说明 CodeRabbit 不是打开一次就被忘掉的新奇应用。团队似乎已经把它织进日常评审循环。


              但这些都不等同于耐久的 SaaS 级留存证明。公开材料没有披露净留存、总留存、续约率、合同期限、按同期群的席位扩张，或 logo
              流失。评论网站证据有帮助，但边界很清楚：样本更小，一些评论较旧，评审者群体偏向小团队。因此，正确读法应当更细。满意度和重复使用信号方向上是正面的，尤其当运营者把 CodeRabbit
              描述为高信号、低噪声时更是如此。但公开记录仍不足以判断这些账户在多年周期里有多粘，或产品在首次部署后能多稳定地扩张。
