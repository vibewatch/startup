      - number: '2.3'
        title: 规模测算视角与采用信号
        blocks:
          - type: paragraph
            body: >-
              这个品类的公开市场规模估计差异很大，因为供应商和分析师对问题的定义不同。QY Research 估计，专门的 AI 代码审查工具细分市场 2026 年约为 $2.08B。Global Growth
              Insights 将更宽的代码审查市场放在 2026 年约 $8.47B。GII Research 及其 2026 年代码工具报告把更大的 AI 代码工具市场放在 2026 年约 $9.46B，增速约
              23.7%。这些数字不应被压成一个“真实 TAM”。它们更适合用来框定一个合理区间：窄的审查专用切口、更宽的代码审查工作流品类，以及更宽的 AI 编码工具宇宙。


              采用数据支持需求真实这一判断，即便精确规模噪声很大。Stack Overflow 对 2025 年调查结果的 2026 年分析发现，AI 工具使用率达到 84%，信任度却降至 29%；JetBrains AI
              Pulse 的 2026 年摘要则报告职场 AI 工具使用率为
              90%。高使用、低信任，正是审查和治理层获得战略意义的土壤。代码创建扩张速度快于输出可信度，因此这个品类不需要生成工具被普遍信任才能增长；信任缺口本身就是利好。
