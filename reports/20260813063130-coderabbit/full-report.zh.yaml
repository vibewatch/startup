      - number: '1.5'
        title: 负面信号、质量问题与未解事项
        blocks:
          - type: paragraph
            body: >-
              概况很强，但并非没有摩擦。最严重的公开负面事项是 Kudelski Security 在 2025 年 8 月披露的 CodeRabbit 利用链：攻击从恶意 PR 开始，走向远程代码执行，并可能获得超过 100
              万个仓库的写入权限。Kudelski 也报告称，CodeRabbit 通过禁用存在漏洞的执行路径、轮换凭据、强化沙箱完成修复。即便已经修复，这一事件仍然重要，因为它正好打在 CodeRabbit
              正在销售的信任边界上：客户把有特权的审查操作外包给 AI 原生服务。


              第二个担忧更偏商业，而非技术。2026
              年的独立评测总体认可设置速度、开发者体验和低噪声输出，但也有人提醒，更深的企业架构推理仍落后于最强替代品；随着部署扩大，按席位定价会变成取舍。最后，公司财务仍然不透明。公开证据能证明增长和融资事实，却不能证明经审计收入、ARR、利润率、净留存率、准确员工数或完整治理栈。结果是：增长叙事有吸引力，也有真实外部佐证，但仍给投资人留下明确的财务、风险和估值尽调问题。
