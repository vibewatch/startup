              进入董事会。投资人名单如今横跨早期机构、成长投资人、战略软件运营者和 BMW
              的企业风险投资部门。这是正面信号：股权结构表并未被某个单一平台巨头主导，后者的利益可能收窄分发。代价是不透明。公开材料没有披露董事会规模、创始人持股、清算优先权或任何保护性条款，后期治理质量只能留给数据室，而不是公开事实。
