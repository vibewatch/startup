  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局图与竞争分段
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 的竞争集合远宽于“其他会在 PR 上评论的机器人”。买家可以用 AI 原生审查专家 Greptile、仓库原生捆绑产品 GitHub Copilot 和 Amazon Q
              Developer、确定性质量平台 SonarQube、Codacy、DeepSource、Qodana、安全优先扫描器 Snyk Code 和 Semgrep，或由人工审查者加 CI 关口与 linter
              组成的现状栈来完成同一任务。这些类别有重叠，但并不可互换。PR 原生审查器优化审查速度和上下文。确定性平台优化可重复性、可审计性和策略执行。安全平台优化漏洞检测和修复。实际含义是，CodeRabbit
              很少是在替代“空白”；它通常在对抗一组既有控制，或一个已经掌握仓库工作流的平台合同。


              直接同行是那些承诺在 PR 循环内完成第一遍审查的工具。GitHub Copilot 是最危险的捆绑式既有平台，因为它位于主导性的 GitHub 工作流内，并能把发现交给云端智能体。Greptile 是最明显的
              AI 原生深度威胁，因为它销售全代码库推理、自定义规则和自主测试编写，而不只是 diff 评论。与此同时，DeepSource、Codacy、SonarQube、Qodana、Semgrep 和 Snyk
              把购买讨论拉向代码质量、治理和安全广度。于是竞争框架不再是某个基准测试赢家，而是买家想先标准化哪一层。
