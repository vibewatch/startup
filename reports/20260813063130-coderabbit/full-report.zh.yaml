      - number: '6.5'
        title: 客户结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              只看客户证据，CodeRabbit 已经领先许多私人 AI 开发者工具同行。具名证据异常丰富，其中包括大型和受监管环境；2026 年这一批案例研究也比创业公司材料里常见的通用 logo
              墙更新、更具体。最好的证据不是原始客户数，而是多位工程负责人独立描述了同一组收益：带上下文的首轮评审、更少遗漏问题、更一致的标准、更好的摘要，以及机器与人类之间更清晰的分工。这种主题一致性提高了信心，说明产品确实在解决真实痛点。


              缺失的，正是公开营销几乎从不提供的内容。没有公开来源披露按同期群的留存、按客户细分的扩张 ARR、头部客户集中度、续约行为，或 OSS
              与自助式漏斗的付费转化。独立评论也暗示，非常大型或噪声很高的工作负载可能存在上限。平衡后的结论是正面但不完整：CodeRabbit
              有可信、新鲜的采用证据，也有清晰扩张路径；但耐久性和集中度仍是只有管理层能回答的问题，在把客户动能视为已充分承保的经常性收入质量之前，必须先问清楚。
