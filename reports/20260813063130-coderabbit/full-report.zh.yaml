      - number: '8.3'
        title: 公开可比公司与情景框架
        blocks:
          - type: paragraph
            body: >-
              公开可比公司组合并不完美，但仍有用。GitLab 的 EV/Sales 约 5.5x，对应约 $1.0B TTM 收入；JFrog 的 EV/Sales 约 16.3x，对应约 $0.56-0.60B
              收入；Datadog 的 EV/Sales 约 20.9x，对应接近 $4.0B 收入。这些都不是直接可比公司：GitLab 是更宽的 DevSecOps 套件，JFrog 是软件供应链平台，Datadog
              则是规模更大、经济模型和体量不同的可观测性 / 安全领导者。但这组公司显示了 2026 年公开市场给高质量开发者工具和基础设施龙头资产的估值区间。


              如果用这些公开 EV/Sales 区间标记 CodeRabbit 的 $1.5B 估值，隐含经常性收入要求大致从 Datadog 式倍数下的 $72M，到 JFrog 式倍数下的 $92M，再到 GitLab
              式倍数下的 $273M。区间非常宽，而宽度本身很重要。更高倍数区间属于披露、现金流证据和企业渗透都远深于 CodeRabbit
              公开展示水平的公司。因此，除非投资者准备凭信念承保领导者溢价，否则基准情景估值应低于当前标价。多头情景存在，但它不仅要求继续增长，还要求证明 CodeRabbit 的安装基础能转化为粘性的企业经济性。
