      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从融资看，CodeRabbit 的节奏明显是风险投资级。公司公开披露显示，2024 年 8 月完成 $16M Series A，2025 年 9 月以 $550M 估值完成 $60M Series B，并于
              2026 年 8 月以 $1.5B 估值完成 $143M Series C。SEC Form D 文件给早期轮次补充了有用精度：2024 年 3 月文件披露约 $4.0M 的募资额度，提交时已售出
              $3.6M；2025 年 9 月文件披露最高 $68.4M 的发行额度，涉及 9 名投资人。官方 Series C 公告称，新资本将用于国际扩张、研究和产品开发，以及未来一年对开源项目和维护者提供超过 $10M
              支持。


              这些事实说明，短期资本充足性较强，但单靠公开来源仍无法严谨承销。没有公开现金余额、月度烧钱速度、债务安排或现金跑道披露。扩张到 London、更大 EU 足迹和 Japan，意味着 opex
              基础上升；更深的安全和智能体产品，意味着模型与基础设施开支会持续。相比硬件、生物技术或物流，业务资本强度低得多；但它也不像简单席位 SaaS 公司那样轻资本。更可能的故事是：Series C
              后增长资本充足，但如果公司选择优先市场占领、产品广度和开源补贴，而不是近期利润率最大化，仍会继续依赖外部融资。
