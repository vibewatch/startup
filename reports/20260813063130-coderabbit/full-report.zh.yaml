  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现界面
        blocks:
          - type: paragraph
            body: >-
              对一家私有基础设施风格创业公司来说，CodeRabbit 的公开收入模型异常清晰。核心变现界面是与发起 PR 的开发者绑定的经常性 SaaS 订阅收入：Pro 年付价为每用户每月 $24，Pro Plus 为
              $48，企业合同则通过联系销售完成。这个核心席位模型已经不是全部。定价页还展示了每用户每月 $40 的 CodeRabbit Security、按量计费的仓库扫描、单独销售的无限制审查额度，以及每个智能体分钟
              $0.50 的 Slack agent。文档和首页又把变现框架进一步扩大，展示了覆盖审查、分诊、变更理解、CLI、IDE 和协作工作流的 Agentic Change Management 栈。


              这对财务很重要，因为 CodeRabbit 正从单一经常性席位产品演进为分层定价架构。如果采用稳定，席位模型应能支撑可预测的基础收入；但按量计费的安全扫描和智能体分钟会引入更受算力影响的扩张路径。免费开源使用和
              14 天试用既是分发，不只是慷慨：它们降低销售摩擦，培养开发者习惯，并创造升级到团队或企业计划的路径。结果是收入面有希望变宽，但相比简单按席位计费的审查机器人，经常性与用量挂钩变现的组合也更复杂。
