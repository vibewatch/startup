      - number: '5.2'
        title: 工作流与运行架构
        blocks:
          - type: paragraph
            body: >-
              在工作流层面，CodeRabbit 最适合理解为一个围绕现代代码变更流程搭建的上下文摄取与审查编排系统。PR 仍是锚点界面，但文档显示锚点周围有多层能力：PR 摘要、导览、关联 issue
              验证、代码指南、学习项、路径指令、合并前检查、合并后动作，以及较新的 Change Stack 界面。Change Stack 尤其值得注意，因为它把 PR
              当成结构化的逻辑组和层级，而不是扁平文件列表。这一产品决策直指 AI 生成代码的核心痛点：diff 更大、更分散，也更难线性审查。


              公开 Security Agent 文档，是产品资料里最强的机制层证据。它详细说明了覆盖仓库的代码与基础设施发现项映射、调查和验证流程；区分 PR Findings 和 AI Deep Scan
              结果；并解释可达性、可利用性、部分覆盖、排除路径、自定义路径指令和定期计划。这样的具体性说明，产品有真实工作流工程，而不是套在通用 LLM
              调用上的浅层包装。话虽如此，非安全编排引擎没有同等深度的公开资料，因此投资人应把安全工作流文档视为技术严肃性的强佐证，而不是对整个平台的完整透明披露。
