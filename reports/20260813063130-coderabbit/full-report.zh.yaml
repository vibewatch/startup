      - number: '3.3'
        title: 能力广度、定价与多工具并存
        blocks:
          - type: paragraph
            body: >-
              公开定价乍看让这个品类好像可比，但计费单位正在分化。CodeRabbit 以席位销售专业审查，Pro 年付价为每用户每月 $24，Pro Plus 为 $48；Security 和按量计费 Slack
              agents 单独定价。GitHub Copilot 表面更便宜，Pro 为 $10、Business 为 $19，但代码审查也会消耗 AI credits，并且在私有仓库上消耗 GitHub Actions
              minutes。Greptile 混合席位定价、审查额度和超额费用。Sonar 现在同时展示传统代码验证计划和 Gitar 的 AI 审查层级。Semgrep 按贡献者收费，并设置独立模块。Amazon Q
              Developer 在免费和 Pro 层之上叠加请求与转换限制。对企业买家来说，“入门价”因此不如计量器和扩张路径重要。


              这种复杂性强化了多工具并存。现实的企业栈可以用 CodeRabbit 或 Copilot 做审查者 UX，用 SonarQube 或 Codacy 做质量治理，用 Semgrep 或 Snyk 做安全深度，用
              Greptile 处理特别复杂的全代码库调查。公开评测来源反复描述 CodeRabbit
              比一些对手更快、噪声更低，但在架构完整性上浅于更深的上下文工具。这一模式符合产品所处位置：它最强的是高频第一遍审查者，而不是栈中唯一的质量、安全或架构关口。
