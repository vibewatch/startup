      - number: '8.4'
        title: 建议与进入纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确建议是跟踪，而不是买入。CodeRabbit 看起来值得密切关注：市场拉力强，产品广度可信，客户证据有分量，融资动能真实，而且随着 AI
              生成代码提高评审负载，这个品类仍可能继续复利。但几乎所有能推动估值、能把欣赏变成确信的指标仍是私有信息。因此，今天的价格只适合已经愿意在披露之前提前付价、并相信 CodeRabbit 正在搭建 AI
              软件交付控制层的投资者。


              对大多数有纪律的投资者来说，证据太薄。公开可比公司不能证明 $1.5B 是错的；它们证明当前标价已经假设了强收入基础和强延续性。没有
              ARR、NRR、毛利率和头部客户集中度，上行比下行更难测算。因此，进入纪律比公司质量更重要。更低价格——大致更接近数亿美元高段到 $1B
              出头——或者新的证据能确认低数亿美元经常性收入且留存强，才可能支撑更建设性的立场。在那之前，正确姿态是跟踪公司，而不是追逐本轮。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV026
              - CV027
              - CV028
              - CV029
              - CV031
              - CV033
