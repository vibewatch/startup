      - number: '2.2'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              用户通常仍是 PR 工作流中的工程师，但随着部署成熟，买方和付款方会逐渐扩大。早期使用可以从单个仓库或少数想要更快反馈的审查者开始。一旦工具嵌入合并前检查、合并后动作、CI/CD 分析、issue
              跟踪器上下文或自托管企业部署，所有权就会转向平台工程、AppSec、开发者生产力团队和采购。定价页本身也暗示了这个阶梯：个人和团队计划强调 PR 审查与智能体式反馈，企业包装则加入
              RBAC、SSO、审计日志、API 访问、自托管、EU SaaS 部署和供应商安全审查。


              这种分层影响市场规模判断。只卖给个人开发者的工具会受席位预算和单点工具疲劳约束。卖进治理、安全和发布控制工作流的工具，则能从更大的工程效率和降风险预算池里拿钱。实际最有吸引力的买家，是 PR
              量大、合规需求明确，或多个团队同时生成 AI 辅助代码的组织。审查瓶颈直接拖慢发布，或安全负责人希望代码发版前有独立验证层时，经济逻辑尤其强。
