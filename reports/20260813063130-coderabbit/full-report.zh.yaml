            title: 估值争论本质上是 ARR 争论
            body: 如果不知道 CodeRabbit 更接近 ~$80M、~$150M 还是 ~$250M 经常性收入，公开可比公司并不能告诉你它值多少钱。
            calloutType: insight
            claimRefs:
