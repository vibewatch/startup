      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              多头论点很直接。CodeRabbit 所在市场有真实紧迫性，产品广度可见，具名客户证据强，OSS 漏斗宽，变现界面清晰，并且在 AI 生成代码正在抬高人类评审成本的时候，刚刚拿到 $143M
              增长轮。公开证据显示，产品可以成为软件变更的控制层，而不只是代码评论引擎。如果公司能把安装基础和标杆证据转化为耐久的企业留存，那么 $1.5B 价格最终可能显得合理，甚至保守。


              反向论点同样重要。公开可比公司和独立评论表明，CodeRabbit 的胜利更多来自工作流贴合和低噪声的平台广度，而不是无可争议的技术优越性。基准文章认为，具备代码库感知能力的竞争对手能抓到更多跨文件
              bug；风险章节也显示，隐私、采购、使用限制和大型 PR 噪声问题都可能拖慢扩张。最关键的是，投资者仍看不到 ARR、NRR、毛利率或客户集中度。当分母未知时，高估值就变成信仰行为。正确结论不是公司弱，而是在
              $1.5B 进入点上，举证责任应当急剧提高。
            claimRefs:
              - CV008
