  - id: TU003
    title: 具名客户证据表
    columns:
      - 客户
      - 分层
      - 部署 / 使用场景
      - 生产 vs 试点
      - 结果
      - 限制
    rows:
      - - EarnIn
        - 受监管金融科技企业
        - 为数百名工程师和数百个仓库提供一致的一审
        - 生产
        - 选择购买而非自建；集成标准、AST-grep 规则、严重性信号和分析
        - 缺少合同期限或量化续约数据
      - - Swiggy
        - 大型工程组织
        - 多工具 POC 后，引入理解上下文的 PR 评审和标准执行
        - 从试点到生产
        - 正式 POC 持续一个半月；发现此前工具漏掉的密钥；摘要更快，评审更规范
        - 指标偏方向性，且由供应商撰写
      - - Prokeep
        - 中端市场 / GitLab 用户
        - GitLab 原生上线，在人工批准前提供独立一审
        - 分阶段上线
        - 信任提升后，从少量仓库扩展出去
        - 未披露规模和商业深度
      - - Briya
        - 医疗健康 / 合规敏感创业公司
        - 在多个编码智能体之上叠加独立评审层，并统一多仓库标准
        - 试用后进入生产
        - 自 May 2026 以来，建议采纳率约 ~60%，完成 1,000+ 次 Linear MCP 检查
        - 仍只是一个具名参考，不是广泛队列数据
      - - Abnormal AI
        - 网络安全公司
        - 在 AI 密集工程工作流中提供高信号评审层
        - 生产
        - 关键发现采纳率 65%，30 天节省 100+ 小时
        - 案例研究由供应商撰写，并附客户引述
      - - SalesRabbit
        - 旧代码库 + 现代代码库团队
        - 工程团队变动期间，从测试快速推进到全面采用
        - 生产
        - 全面采用叙事，体现抓 bug 和统一风格的收益
        - 缺少 bug 率或速度变化的硬分母
      - - Mastra
        - 开源 / 开发者工具
        - 免费 OSS 使用带来信任，并推动持续使用
        - 生产 OSS 使用
        - 信任叙事显示 OSS 漏斗有意义
        - 缺少付费转化洞察
    notes: 对一家私营创业公司而言，证据质量异常强：多篇 2026 年案例研究包含具名工程负责人、具体工作流描述和部分量化结果。
