  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私与采购风险
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 的法律与隐私姿态是真正需要尽调的话题，因为产品需要读取源代码，而且常常接触敏感的专有逻辑。最强的官方证据是混合的，而不是纯粹令人放心。隐私政策称，CodeRabbit
              不会使用作为私有代码评审一部分收集的个人信息来训练自有或第三方模型，但它明确把开源项目排除在外，并说明 OSS
              会用于训练其系统。政策还称服务器位于美国，删除请求之后残留信息仍可能保留，数据传输由公司的政策框架管理，而不是由任何公开展示的客户专属协议管理。对受监管或跨国买方来说，这些问题可管理，但仍然是采购和合规问题。


              还存在计划层级门槛风险。关于合同红线的知识库文章称，正式供应商安全评审和定制合同面向 Enterprise 客户提供，其他计划则被引导通过 Trust Center
              使用自助式文档。运营上这合理，但也意味着一些客户可能在初始采用之后才发现安全或合同摩擦。外部监管背景同样重要：加州隐私权和 GDPR 转移义务设定了合规底线；随着 CodeRabbit
              触达更多企业和跨境代码仓库，这条底线会变得更有影响。
