              公开采用故事在总体规模和具名部署上都很强。到 2026 年 8 月，官方和镜像来源称客户超过 17,000 家、开源项目超过 150,000 个、每周代码评审超过 200
              万次。更细颗粒度的社区证据也支撑这组头部数据：一份 2026 年研究数据集在 481 个 GitHub 代码仓库和超过 99,000 个唯一 PR 中找到了 CodeRabbit 采用痕迹；OSS 项目页则把
              CodeRabbit 定位为安装在最多开源代码仓库上的工具，并强调向 TanStack、Vue 等项目发放分发资助。这些证据类型不同，但指向同一方向：CodeRabbit 已经远远走出孤立试点。


              具名部署更有用，因为它们展示了采用形态。Swiggy 在三款工具之间跑了一个为期一个半月的正式 POC，最后因为 CodeRabbit 能做上下文感知评审而选择它。EarnIn
              在受监管环境里把它用于数百名工程师和代码仓库。Prokeep 从小规模 GitLab rollout 起步，信心提升后继续扩张。Briya 把 CodeRabbit
              用作多个编码智能体之上的评审层。Abnormal AI 把它描述为达到采购级、信号强。SalesRabbit
              称自己很快从有限测试转向全面采用。这些证据合在一起，支撑了一条真实的客户路径：发现、试点、标准化，然后扩大。
