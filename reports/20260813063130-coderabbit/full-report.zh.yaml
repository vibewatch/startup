      - number: '7.2'
        title: 产品质量、安全与虚假信心风险
        blocks:
          - type: paragraph
            body: >-
              最关键的产品风险，不是 CodeRabbit 是否能抓到有用 bug；公开证据清楚说明它能。风险在于，团队是否会把信任调到与真实优势和边界匹配的位置。官方安全文档相当坦诚：Security Agent
              不能证明一个代码仓库没有漏洞，已完成的扫描仍可能是部分扫描，高风险发现仍需要证据和人类解释。独立评论和基准进一步加深了担忧。CuratorBits、G2、Techreviewer 和 Pegotec
              都把噪声或误报描述为最一致的短板，尤其是在大型 PR 上。Pegotec 更进一步，把 CodeRabbit 定位为快速首轮 lint，而不是架构评审的替代品；Baeseokjae 的对比则称，该工具以较低
              bug 捕获率换取较低噪声和更广平台支持。


              这不是一个小 UX 抱怨。在代码评审工具里，噪声和过度信任会叠加成运营风险。如果开发者学会忽略机器人，工具就会失去价值。如果他们过度信任它，真正的业务逻辑或授权错误就可能漏过去。最好的缓解方式，正是
              CodeRabbit 自身和多项案例研究已经体现的做法：保留人类审批，保持 PR 小，调优控制项，并把 AI 评审视为首轮或中段层，而不是最终的安全或架构决策。
