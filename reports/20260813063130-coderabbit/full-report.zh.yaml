      - number: '5.4'
        title: 信任、安全与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任和控制机制是 CodeRabbit
              价值主张的核心，因为产品被插入代码审查和安全决策，而不是低风险聊天。公开来源在这里给出了相当不错的证据。企业和市场页面强调自托管、审计日志、供应商审查和隐私控制，包括退出数据存储。安全文档又给出具体运营控制：权限、定期计划、排除路径、仓库上下文、验证状态、通过可达性和可利用性调整严重度，以及
              Security Agent 不能证明仓库没有漏洞的明确警告。InfoWorld 的独立报道还强化了另一个重点：CodeRabbit
              并不被定位为最终合并权威；CODEOWNERS、必需检查、分支保护和审批仍然是关口。


              辅助和权威分离，是技术上的加分项。它降低了采用必须完全信任 AI 系统来替代人工治理的风险。与此同时，公开信任证据仍不完整。核心审查引擎没有强健的公开可用性历史、误报基准、bug
              检测召回率，或独立红队式评估。结果是一种合理但不完整的信任姿态：控制机制看起来真实，但公开记录对文档化机制的证明，仍强于对经审计运行结果的证明。
