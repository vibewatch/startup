companyProfile:
  summary: >-
    CodeRabbit 是一家湾区 AI 开发者工具创业公司，由 Harjot Gill 和 Guritfaq Singh 于 2023 年创立。公司从自动化 PR 审查切入，如今对外销售更宽的 Agentic Change
    Management 平台，覆盖 GitHub、GitLab、Bitbucket、Azure DevOps、IDE、CLI、Slack、Discord 等界面上的审查、分诊、变更理解、安全分析和协作工作流。公司的 GTM
    把免费开源分发、自助付费方案和面向安全、治理、采购流程较重账户的企业增购结合起来。到 2026 年 8 月，CodeRabbit 公开宣称拥有 17,000+ 客户、150,000+ 开源项目、每周 2M+ 次审查；外部佐证包括
    BMW 的 1,000+ 名开发者以及多个具名软件买家。
