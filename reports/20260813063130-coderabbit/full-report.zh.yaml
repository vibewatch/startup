      - number: '4.5'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit
              财务画像中可投资的部分很容易看见。公司有公开标价、明确的企业增购杠杆、强劲的公开增长主张、有分量的客户引用质量，以及符合品类领导野心的融资动能。最难的地方在于，真正承销所需的几乎每个指标仍是私有信息。公开来源没有披露
              ARR、净留存、付费席位转化、分产品毛利率、用量毛利、CAC、销售周期长度、烧钱速度或现金跑道。即便客户数和开发者足迹信号，也主要来自公司自报，而不是独立审计。


              因此，正确结论是混合但偏正面。核心产品是经常性收入，扩张界面也多，收入质量看起来可能较强。毛利质量更模糊，因为 AI 审查、仓库推理和连续安全监控都消耗真实算力。Series C
              后资本强度看似可控，但并非小事。用尽调语言说，这个故事不是 CodeRabbit
              是否完全无法变现——公开记录说明它可以。真正的问题是，它能多高效地把免费或试点采用转化为耐久企业收入，这些收入有多少能穿过基础设施成本留存下来，以及 Series C
              后的组织能否在国际化增长时，不让烧钱速度跑赢投资人刚用 $1.5B 估值支持的控制层逻辑。
