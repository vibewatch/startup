  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 很难被整齐放进某个传统软件品类。最窄的看法是“AI 代码审查”，也就是在 PR
              上自动给出评论和建议。更现实的市场边界更宽：为人和编码智能体生成的变更提供审查、优先级排序、解释和安全验证。这个边界位于代码质量工具、AppSec 工作流、CI/CD 治理和协作软件的交叉处。它仍远窄于“所有
              AI 开发者工具”，因为 CodeRabbit 并不试图成为完整 IDE、通用自动补全助手或完整事故管理平台。


              这个边界重要，是因为真正的替代品不只是竞品 AI 审查机器人。团队也可以靠人工 PR 审查、CODEOWNERS 和分支策略、linter 与 SAST 工具、CI 关口或 issue
              路由来解决问题。代码量处在人类规模时，这些替代方案尚可运转；AI 系统创建更大、更多 PR 后，它们就会失效。CodeRabbit 自身转向 Agentic Change
              Management，实际上是在论证：市场不再只是生成评论，而是围绕软件变更创建可信操作层。
            claimRefs:
              - CM001
