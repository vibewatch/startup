      - number: '7.4'
        title: 财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              执行风险很高，因为 CodeRabbit 正试图从 PR 评审机器人扩展成更大的智能体式软件变更平台，同时还要支持多个代码托管平台和企业控制。更新日志和产品界面显示出雄心很强的发货速度——Security
              Agent、Change Stack、自动化、Slack 和 Discord
              智能体、跨托管平台功能、按使用量计费的超额用量、企业控制——都在短时间内出现。如果质量能跟上，这种速度是优势；但它也是蔓延风险的来源。每个新模块都会增加支持、计算、QA、文档和商业化复杂度。评审速率限制、公平使用间隔和按用量计费额度说明，重度
              AI 评审存在真实的经济和运营约束，而不只是软件式边际成本曲线。


              财务上，剩余风险在于，激进增长和宽平台雄心可能把利润率挤压或支持负担隐藏到更晚才暴露。基于用量的额度有助于维持服务连续性，但如果调优薄弱，也会给客户带来预算不可预测性，并给 CodeRabbit
              带来成本不可预测性。与此同时，市场本身变化很快：GitHub、Copilot、Greptile、Qodo 等都在向更深的评审或代码库推理推进。CodeRabbit
              目前的差异化在于广度、可配置性和工作流贴合度。如果原生平台竞争者弥合差距的速度快过 CodeRabbit 加深质量的速度，风险会先体现在噪声容忍度、客户扩张和最终定价权上。
