      - number: '6.4'
        title: 扩张循环与集中风险
        blocks:
          - type: paragraph
            body: >-
              扩张逻辑很清楚，哪怕经济性还不透明。CodeRabbit
              可以从开源、单个代码仓库、团队试点，或工程负责人解决评审疲劳切入。随后，它可以扩到更多代码仓库、更多开发者、更多代码托管平台，以及安全、自动化、Slack/Discord
              智能体、多仓治理等更多工作流。案例研究直接支持这种模式。Briya 走向跨智能体治理层。Prokeep 从小规模开始后扩张。SalesRabbit 从小测试扩到快速内部需求。Swiggy 的 POC 强调在
              1,000 多名开发者规模下提供架构感知反馈。EarnIn 把标准、严重性信号、AST-grep 规则和分析能力整合进更大的评审系统。换句话说，产品似乎被设计成：拿下一个工作流后，在工程组织内部横向生长。


              风险在于，扩张和集中度在公开数据里大多不可见。标杆 logo
              有价值，但投资者不知道少数参考客户是否贡献了付费收入的大头。评审者也暴露出可能拖慢某些细分市场扩张的摩擦：活跃贡献者定价在只有少数人评审时可能显得不匹配；公平使用限制被描述为不透明；大型 PR
              可能卡住或返回不完整分析；一些用户希望有更强的管理员或代码仓库级控制。这些抱怨都不能推翻产品市场匹配，但它们说明客户喜爱并不普遍，从爱好者采用扩到企业全域标准化仍可能在运营上很乱。
