chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与产品定位
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 是一家年轻但扩张速度异乎寻常的 AI
              开发者工具公司，核心判断很简单：代码生成正在变得充裕，可信审查仍然稀缺。公司材料把使命表述为让每一次软件变更都可信，并为人和智能体创建的软件搭建独立控制层。落到产品上，CodeRabbit
              围绕质量、安全和可靠性审查 PR，并且越来越少把产品包装成聊天助手，而是把它定位为决定什么代码该发布的决策层。


              公司成立于 2023 年，官方新闻素材将 Harjot Gill 和 Guritfaq Singh 列为创始人。公开地点口径并不干净。BMW 的融资公告使用 Mountain View 日期栏，同一公告正文又称
              CodeRabbit 总部位于 San Francisco，CB Insights 则列出 Walnut Creek。正确结论不是精确街道地址，而是 CodeRabbit
              是一家旧金山湾区公司，全球足迹正在扩大。以如此年轻的公司看，产品分发已经很宽：首页宣称覆盖 600 万个仓库，并称 CodeRabbit 是 GitHub 和 GitLab 上安装量最高的 AI 应用；其公开
              GitHub 组织本身也显示出可观的开源和工具存在感。
