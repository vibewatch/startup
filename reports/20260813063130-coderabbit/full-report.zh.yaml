      - number: '3.2'
        title: 平台捆绑与专业厂商
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争断层不是模型品牌，而是分发。GitHub 可以把代码审查当作原生仓库功能，通过 Copilot AI credits 计费，并把后续工作路由给云端智能体。AWS 也在做类似动作：淡化新的
              CodeGuru Reviewer 关联，把买家引向 Amazon Q Developer 更宽的智能体式工作流。这些平台方降低了采购摩擦，因为审查界面已经和买家可能用于源码管理、CI
              或云开发的工具打包在一起。如果一个团队全面押注 GitHub，一个“够用”的原生审查器就能阻止独立厂商进入对话。


              专业厂商要活下来，必须比捆绑产品更深或更宽。CodeRabbit 可防守的切口，是比 GitHub-only Copilot 更宽的代码托管覆盖，再加上围绕 PR 导览、学习项、可配置检查、IDE 与 CLI
              审查、企业审查控制而专门设计的工作流。Greptile 试图通过索引整个代码库并从过去审查评论中学习来做得更深。SonarQube、Semgrep、Snyk、Codacy、DeepSource 和 Qodana
              则从另一个角度防守：它们带来确定性策略、安全或质量信号，纯审查机器人无法完全替代。换句话说，专业厂商市场仍然可行，但只在它明显胜过平台便利性，或补足既有质量与安全关口，而不是简单复制它们时成立。
