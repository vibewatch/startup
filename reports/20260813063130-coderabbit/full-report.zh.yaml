      - number: '1.3'
        title: 融资历史、规模与动能
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 的融资节奏是材料里最强的信号之一。公司公开披露，2024 年 8 月完成 $16M Series A，2025 年以 $550M 估值完成 $60M Series B，并于 2026 年 8
              月 12 日以 $1.5B 估值完成 $143M Series C。三轮合计，已披露资本基础大约 $219M。不到一年内从 $550M 的 Series B 跳到 $1.5B 的 Series
              C，说明投资人按不止于功能级 PR 机器人的逻辑承销 CodeRabbit；他们买的是围绕 AI 生成软件变更的控制平面叙事。


              融资同时披露的运营指标强化了这一故事，尽管几乎都来自公司自报。到 2026 年 8 月，公开材料口径集中在每周超过 200 万次审查、超过 17,000 家客户、超过 150,000
              个开源项目，以及同比超过五倍的收入增长。新闻素材还增加了一个累计质量信号：发现 7,500 万+ 个 issue。这些数字不能替代经审计 ARR 或净留存率，但足以说明，CodeRabbit 对一家 2023
              年才成立的公司来说，分发广度真实，采用速度也异常快。
