    type: flow
    layout: wide
    summary: CodeRabbit 的运营流从代码变更起步，如今已经延伸到理解、路由、安全加固和修复变更。
    data:
      nodes:
        - id: change
          label: 生成代码变更
          description: 开发者或编码智能体产出本地 diff 或 PR。
        - id: ingest
          label: 摄取上下文
          description: CodeRabbit 读取仓库状态、议题链接、指令、指南和历史。
        - id: review
          label: AI 审查输出
          description: 生成摘要、行评论、变更导览，以及建议的议题或修复。
        - id: route
          label: 路由与理解
          description: Triage 和 Change Stack 帮团队排序，并按逻辑检查变更。
        - id: secure
          label: 安全 / 质量检查
          description: 合并前检查或全仓库扫描加入更深的质量和漏洞分析。
        - id: act
          label: 动作与交接
          description: 人类批准、跳过、修复，或把工作交给 Autofix、IDE、CLI、Slack/Discord 智能体工作流。
      edges:
        - from: change
          to: ingest
          label: 提交 / 检测
        - from: ingest
          to: review
          label: 锚定分析
        - from: review
          to: route
          label: 理解 / 排序
        - from: route
          to: secure
          label: 深度检查
        - from: secure
          to: act
          label: 合并 / 修复 / 规划
