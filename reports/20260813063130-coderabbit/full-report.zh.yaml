      - number: '7.3'
        title: 伙伴、平台与客户风险
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 依赖一组外部平台；这些平台既是战略资产，也是风险通道。Git 托管、issue tracker、协作工具、支付和订阅处理器、上游模型提供商，都会塑造产品体验。隐私政策明确点名
              GitHub、Jira、Linear、OpenAI 和 Anthropic。产品文档显示它对 GitHub、GitLab、Bitbucket 和 Azure DevOps
              都有强支持，但也暴露出平台之间行为不均：部分大型 PR 使用定价动作仅限
              GitHub，周期性计划有服务商特定约束，商业价值主张也部分建立在比某些竞争对手覆盖更广平台之上。这是有用的差异化，但也增加了支持负担，并把可能破坏客户价值的依赖变化点成倍放大。


              客户风险和平台风险交织在一起。独立评论偏向小团队和维护者，而公开企业证据在具名 logo 上更强，在续约或集中度上更弱。如果少数复杂、AI 使用很重的参考客户贡献了 ARR
              的大头，那么任何采购挫折、安全事件或特定托管平台限制，都可能很快传导到收入质量。好消息是，客户群看起来横跨 OSS、SMB 和企业，具备一定多元性。坏消息是，公开证据仍太薄，无法有把握地量化这种多元性。
