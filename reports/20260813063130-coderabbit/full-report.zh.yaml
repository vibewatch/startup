      - number: '8.5'
        title: 最终尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              从跟踪转向买入的尽调路径很清楚。第一，投资者需要收入分母：ARR、使用结构、毛利率、NRR、logo 留存、头部客户集中度和按同期群的扩张。第二，他们需要能转化为经济性的产品证据：Security
              Agent、Change Stack、Slack/Discord 自动化和企业版附加率的采用情况，而不只是核心 PR 评审。第三，他们需要现实评估风险如何传导——隐私 / 采购摩擦、大型 PR
              噪声或托管平台依赖会如何影响成交率和续约。如果管理层能证明即使存在这些风险，公司仍有高质量留存和受控利润率，当前标价才可能站得住。


              如果在经济性被证明之前增长急剧放缓，如果噪声评审限制了向最大客户扩张，如果隐私或采购姿态挡住受监管或跨国部署，或者如果平台原生竞争对手让 CodeRabbit 的广度优势显得不再差异化，论点就会破裂。在
              $1.5B
              估值上，投资者不需要灾难就会亏钱；只要公司从定义品类变成仅仅不错，就足够了。这种不对称性说明估值姿态是偏紧，而不是有吸引力。公司或许仍配得上它的声誉。悬而未决的问题是，公开证据是否强到配得上今天的价格。
