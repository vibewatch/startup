        title: 证据要点
        blocks:
          - type: callout
            title: 跟踪，不要追逐
            body: CodeRabbit 可信到足以留在名单上，但公开证据还不足以支撑在没有管理层数据的情况下支付完整 $1.5B 标价。
            calloutType: recommendation
            claimRefs:
              - CV016
