  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方 / 用户 / 付款方地图
        blocks:
          - type: paragraph
            body: >-
              CodeRabbit 的客户群更像一座分层金字塔，而不是单一 SaaS 受众。底层是开源维护者、独立开发者和小团队，吸引他们的是免费 OSS 使用、快速接入和带上下文的 PR
              帮助。中层是创业公司和中型市场工程团队，它们想提高评审一致性，但不想自建内部工具。顶层是更大的组织和受监管团队——金融服务、医疗、网络安全、汽车——平台工程、开发者体验负责人或重视安全的买方不仅看速度，也看治理。公开证据支撑这些层级：官方页面强调
              OSS、自助式接入和企业控制；评论聚合网站明显偏向小团队；具名案例已经包括 EarnIn、Swiggy、Briya、Abnormal AI、BMW、Prokeep 和 SalesRabbit。


              买方、用户和付款方并不总是同一个人。用户是 PR
              工作流里的开发者和评审者。推动者通常像是平台工程负责人、CTO，或重视安全的工程经理，他们想在大量代码仓库上铺一层标准化的首轮评审。付款方更可能是工程组织预算或企业平台负责人，而不是单个评审者。这种结构有利于先落地再扩张，因为少数热情用户能很快证明价值；但完整账户往往取决于是否能在单个代码仓库之上集中标准、治理和推广政策。
