  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与模块地图
        blocks:
          - type: paragraph
            body: >-
              相比最初的 PR 审查身份，CodeRabbit 的公开产品面已经大幅扩展。文档首页、主站和 Series C 发布材料都把公司呈现为 Agentic Change Management 平台，组合了 AI
              代码审查、Triage、Change Stack、Security、Slack/Discord agents、IDE 审查、CLI 审查，以及规划或 issue 管理工具。这个框架重要，因为它把
              CodeRabbit 从 PR 页面里的单点功能，推向更宽的 AI
              编写软件变更控制层。放在实际工作流里，产品现在服务同一个工程组织中的多类用户：作者需要快速反馈，审查者需要摘要上下文，平台团队需要策略和自动化，安全团队需要仓库级扫描。


              模块地图在商业上也重要，因为它解释了产品为什么能超出单一审查评论体验。CodeRabbit 正围绕理解大型变更、路由审查注意力、验证关联 issue、生成修复，并连接 Slack、Git 平台和 issue
              跟踪器，搭建相邻界面。平台叙事可信，是因为官方文档和变更日志反复呈现它，而不只是某一篇融资新闻稿里的口号。主要技术保留意见在于，公开文档把工作流讲得很清楚，但对底层模型栈、编排内部机制和各模块质量指标仍着墨不多。
