  topStrengths:
    - >-
      Strong category timing: AI-generated code increases review and governance demand, and CodeRabbit is positioned as
      the control layer rather than just a comment bot.
    - >-
      Visible product breadth across PR review, change understanding, security, triage, and collaboration surfaces
      supports land-and-expand potential.
    - >-
      Meaningful customer proof includes BMW, EarnIn, Swiggy, Briya, and Abnormal AI rather than only anonymous startup
      testimonials.
    - >-
      Large distribution funnel from free OSS usage and self-serve plans can seed paid conversion and enterprise
      expansion.
    - Fresh financing momentum and a credible investor syndicate reduce near-term capital-adequacy risk.
  topRisks:
    - >-
      Valuation opacity: ARR, NRR, gross margin, burn, and concentration are undisclosed, making the $1.5B mark hard to
      underwrite externally.
    - >-
      Competitive pressure from platform-native and codebase-aware rivals can compress pricing or weaken the
      workflow-moat narrative.
    - >-
      Privacy, procurement, and cross-border data-processing requirements can slow regulated or multinational enterprise
      expansion.
    - >-
      Product-signal quality on large or complex pull requests remains a known risk in independent reviews and benchmark
      commentary.
    - At this price, investors need category-leader execution; merely good performance may not protect returns.
  unresolvedGaps:
    - Current ARR or recurring-revenue equivalent and the split between seats, usage, Security, and other add-ons.
    - NRR, logo retention, and top-customer concentration needed to distinguish the bull and base cases.
    - Gross margin, support burden, and inference-cost profile by core review versus newer agent products.
    - Primary/secondary split, liquidation preferences, and option-pool dilution from the Series C.
    - Attach-rate and renewal evidence for Security, Change Stack, and other platform modules beyond core PR review.
