  evidenceGaps:
  - type: missing-source
    severity: material
    topic: true win-loss segmentation
    missingEvidence: Segmented win/loss data showing where CodeRabbit beats GitHub Copilot, Greptile, or quality/security suites by host, repo size, and buyer type.
    whyItMatters: The moat story changes materially if CodeRabbit mostly wins outside GitHub-only environments or mostly loses once security owns the purchase.
    diligencePath: Request recent competitive bake-off summaries, deal reviews, and renewal notes split by host, segment, and primary displacer.
    relatedQuestionRefs:
    - QP005
    - QP018
    - QP024
  - type: private-evidence-only
    severity: material
    topic: review quality consistency
    missingEvidence: Customer-level false-positive, missed-issue, and adoption data by PR size, monorepo complexity, and regulated workflow.
    whyItMatters: Public reviews agree on the broad trade-off between speed and completeness, but underwriting requires knowing how those trade-offs behave in the actual target customer mix.
    diligencePath: Ask management for reviewer precision/recall cohorts, suppression rates, and usage retention on large-PR or enterprise accounts.
    relatedQuestionRefs:
    - QP017
    - QP025
  - type: missing-source
    severity: minor
    topic: realized pricing and discounting
    missingEvidence: Public sources expose list pricing for some products but not realized enterprise discounts, multi-product bundles, or contract minimums across the competitive set.
    whyItMatters: Pricing power is central to moat durability, and public self-serve cards understate how often review is sold as part of a wider platform contract.
    diligencePath: Collect anonymized quotes, marketplace terms, and renewal data from customers or channel partners.
    relatedQuestionRefs:
    - QP010
    - QP011
    - QP012
  - type: conflicting-data
    severity: minor
    topic: benchmark comparability
    missingEvidence: A single neutral benchmark that measures reviewer depth, false positives, speed, and fix accuracy across identical real-world PR sets.
    whyItMatters: Without a common benchmark, public claims can overstate differentiation and hide scenario-specific weaknesses.
    diligencePath: Run a controlled internal bake-off on the company’s own repos or obtain third-party benchmark methodology and raw results.
    relatedQuestionRefs:
    - QP016
    - QP025
