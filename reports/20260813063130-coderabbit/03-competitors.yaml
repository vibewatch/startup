- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public entry price / plan
  - Billing unit
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - CodeRabbit
    - $24/user/mo Pro annual; $48/user/mo Pro Plus annual; Security $40/user/mo
    - Per active PR-opening developer plus separate usage products
    - PR reviews, 1-click fixes, learnings, integrations, enterprise controls on higher tiers
    - Enterprise pricing and self-hosting negotiated; Slack agent billed by minute
    - Specialist review pricing is clear, but expansion economics depend on adjacent add-ons
  - - GitHub Copilot
    - $10 Pro; $19 Business; $39 Enterprise / Pro+
    - Seat + GitHub AI credits + Actions minutes for private-repo code review
    - Code review bundled with broader coding assistant, cloud agent, CLI, and GitHub workflows
    - Total review cost rises with premium usage and metered overages
    - Low entry price masks platform-style variable usage economics
  - - Greptile
    - Free Starter for 1 active developer; $30/seat/mo Pro
    - Seat with 50 included credits, then $1 per extra credit
    - AI code review, custom rules, external app connections, self-hosted enterprise options
    - Annual and multi-year discounts not public
    - Depth-first buyers pay partially by review volume rather than only headcount
  - - SonarQube / Gitar
    - Sonar Team starts at $34 monthly; Gitar Core $20/user/mo, Pro $40/user/mo
    - Instance / LOC for SonarQube and per-user for Gitar
    - Deterministic verification, AI code fixes, AI review, CI analysis, self-hosted enterprise controls
    - Enterprise Sonar and Gitar pricing is custom
    - Incumbent can bundle legacy quality gates with newer AI review motions
  - - Semgrep
    - Free up to 10 contributors; Teams starts at $30/contributor/mo
    - Per contributor, by module and plan
    - SAST, SCA, secrets, multimodal AI detection, remediation guidance
    - Enterprise volume pricing and module mix custom
    - Security-first pricing makes Semgrep more comparable to AppSec budgets than review budgets
  - - Amazon Q Developer
    - Free tier; Pro $19/user/mo
    - Per user with request/usage limits and pooled transformation allowances
    - Agentic coding, code review, IDE/CLI assistance, AWS integration
    - Higher-usage economics depend on limits and overages rather than a simple review seat
    - Platform bundle competes on convenience and adjacent AWS workflow value more than pure review depth
  notes: Unsupported realized pricing, private discounts, and procurement bundle concessions are intentionally preserved as unknown rather than normalized away.
