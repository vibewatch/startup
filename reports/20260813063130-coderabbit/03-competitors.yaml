- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Cross-host support keeps CodeRabbit relevant outside GitHub-only shops
    - GitHub bundling removes a second-vendor decision for teams standardized on GitHub
    - high
    - Measure win/loss by host, especially GitHub-only versus mixed-host accounts
  - - Review-specialist UX differentiates from generic coding assistants
    - If Copilot and Amazon Q become good enough, review can be subsumed into broader coding subscriptions
    - high
    - Ask for attach rates where teams keep CodeRabbit after buying a broader coding suite
  - - Growing governance scope expands wallet share
    - Quality/security incumbents can argue they already own policy, compliance, and deterministic enforcement
    - medium-high
    - Inspect whether new modules convert into higher ACV or just defend existing seats
  - - Lower-noise first-pass reviews improve developer adoption
    - Large PR verbosity or shallow architectural depth can erode trust on complex codebases
    - medium-high
    - Request false-positive and missed-issue data by PR size, repo size, and regulated use case
  - - Multi-homing compatibility helps CodeRabbit coexist with existing scanners
    - Coexistence can cap pricing power if the buyer sees review as a lightweight overlay, not a control plane
    - medium
    - Test willingness to pay when Sonar, Semgrep, or Snyk already own budget
  - - Specialist brand in AI code review gives category mindshare
    - Benchmark fragmentation and vendor-authored scorecards can commoditize claims of superiority
    - medium
    - Demand customer-verified win stories, retention cohorts, and benchmark methodology transparency
  notes: The register focuses on moat durability questions that can change underwriting assumptions, not on feature-gap trivia.
