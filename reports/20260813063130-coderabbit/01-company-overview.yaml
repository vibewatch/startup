company:
  name: CodeRabbit
chapter:
  number: 1
  title: Company Overview
  summary: CodeRabbit is a 2023-founded AI code-review startup that has rapidly expanded from pull-request review into a broader “Agentic Change Management” control layer. Public evidence supports unusual traction for the age of the company—17K+ customers, 150K+ open-source projects, 2M+ weekly reviews, and a 2026 Series C at a $1.5B valuation—but also surfaces meaningful diligence questions around security history, precise headquarters, and financial disclosure depth.
sections:
- id: identity-and-positioning
  title: Identity, Founding, and Product Positioning
  body: |-
    CodeRabbit is a young but unusually fast-scaling AI developer-tools company built around a simple thesis: code generation is becoming abundant, but trustworthy review remains scarce. The company’s own materials describe the mission as making every software change trustworthy and building an independent control layer for software created by people and agents. In product terms, CodeRabbit reviews pull requests for quality, security, and reliability, and it increasingly frames the product not as a chatbot assistant but as a decision layer around what should ship.

    The company was founded in 2023, and official press assets identify Harjot Gill and Guritfaq Singh as founders. Public location references are less clean. BMW’s financing announcement uses a Mountain View dateline, the body text of the same announcement describes CodeRabbit as headquartered in San Francisco, and CB Insights lists Walnut Creek. The right takeaway is not a precise street address but that CodeRabbit is a San Francisco Bay Area company with a growing global footprint. Product distribution is broad for such a young company: the homepage claims 6 million repositories and describes CodeRabbit as the most installed AI app on GitHub and GitLab, while the public GitHub organization shows a meaningful open-source and tooling presence of its own.
  claimRefs:
  - CO001
  - CO002
