- id: adverse-signals-and-disclosure-gaps
  title: Adverse Signals, Quality Questions, and Remaining Unknowns
  body: |-
    The overview is strong, but it is not frictionless. The most serious public adverse item is Kudelski Security’s August 2025 disclosure of a CodeRabbit exploit chain that moved from a malicious pull request to remote code execution and potential write access across more than one million repositories. Kudelski also reported that CodeRabbit remediated the issue by disabling the vulnerable execution path, rotating credentials, and strengthening sandboxing. Even with remediation, the episode matters because it tested exactly the trust boundary CodeRabbit is selling into: customers are outsourcing privileged review operations to an AI-native service.

    A second concern is more commercial than technical. Independent reviews in 2026 generally like the setup speed, developer experience, and low-noise output, but some warn that deeper enterprise architectural reasoning still trails the strongest alternatives and that per-seat pricing can become a trade-off as deployments widen. Finally, the company remains financially opaque. Public evidence establishes growth and funding facts, but not audited revenue, ARR, margins, net retention, exact headcount, or the full governance stack. The result is a compelling growth narrative with real external proof points, but still a chapter that leaves investors with explicit diligence asks for the financials, risks, and valuation chapters that follow.
  claimRefs:
  - CO034
  - CO035
  - CO036
  - CO037
  - CO038
  - CO040
