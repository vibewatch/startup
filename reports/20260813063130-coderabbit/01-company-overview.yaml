- id: funding-and-scale
  title: Funding History, Scale, and Momentum
  body: |-
    CodeRabbit’s financing cadence is one of the strongest signals in the file. The company publicly disclosed a $16 million Series A in August 2024, a $60 million Series B at a $550 million valuation in 2025, and a $143 million Series C at a $1.5 billion valuation on August 12, 2026. Across those three rounds, the disclosed capital base is roughly $219 million. The jump from a $550 million Series B mark to a $1.5 billion Series C in under a year indicates investors are underwriting CodeRabbit as more than a feature-level PR bot; they are paying for a control-plane narrative around AI-generated software change.

    The operating metrics shown alongside the raise reinforce that story, although almost all of them are company-reported. By August 2026 public materials converged around more than 2 million weekly reviews, more than 17,000 customers, more than 150,000 open-source projects, and more than fivefold year-over-year revenue growth. The press kit adds a cumulative-quality signal of 75 million-plus issues found. None of this substitutes for audited ARR or net retention, but it does establish real distribution breadth and unusually fast adoption for a company founded only in 2023.
  claimRefs:
