- id: leadership-and-governance
  title: Leadership, Governance, and Cap-Table Signaling
  body: |-
    Leadership visibility is still founder-centric. Harjot Gill is the clear public face of the business as co-founder and CEO, while Guritfaq Singh remains featured in the press kit as co-founder. The public-management bench is beginning to professionalize around go-to-market, evidenced by the 2026 appointment of enterprise-sales veteran Matthew Mulqueen as chief revenue officer. That matters because CodeRabbit is trying to graduate from a viral developer tool into enterprise software with procurement, compliance, and international expansion requirements.

    Governance clues mostly come from financing coverage rather than formal disclosures. The 2026 Series C introduced Atomico and Smash Capital as co-leads and reportedly added Atomico partner Luca Eisenstecken to the board. The investor roster now spans early-stage firms, growth investors, strategic software operators, and BMW’s corporate venture arm. That is a constructive signal: the cap table is not dominated by a single platform incumbent whose interests might narrow distribution. The trade-off is opacity. Public materials do not disclose board size, founder ownership, liquidation preferences, or any protective provisions, leaving later-stage governance quality as a data-room item rather than a public fact.
  claimRefs:
