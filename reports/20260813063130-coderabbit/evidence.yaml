    diligencePath: Review full term sheet, cap table, side letters, and preference stack.
    relatedQuestionRefs:
      - QV013
      - QV027
      - QV030
  - type: private-evidence-only
    severity: material
    topic: Module adoption and enterprise quality
    missingEvidence: >-
      Attach rates, renewal performance, and usage intensity for Security, Change Stack, collaboration agents, and
      enterprise controls.
    whyItMatters: >-
      The premium thesis assumes CodeRabbit is becoming a broader workflow platform, not remaining a single-SKU
