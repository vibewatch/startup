evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters ambiguity
    missingEvidence: A single current corporate headquarters statement or legal-entity filing with address.
    whyItMatters: >-
      The company is young and rapidly expanding, but current public references conflict on city-level headquarters
      location.
    diligencePath: >-
      Request the current legal-entity registration, principal office address, and any regional-office list from
      management.
  - type: private-evidence-only
    severity: material
    topic: board and preference stack
    missingEvidence: Current board composition, ownership, liquidation preferences, and reserved matters.
    whyItMatters: Late-stage governance quality materially affects downside protection and investor control at a $1.5B mark.
    diligencePath: Obtain the latest cap table, financing documents, board observer rights, and voting agreements.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: blocking
    topic: audited revenue and retention
    missingEvidence: Audited revenue, ARR, NRR, gross margin, and burn-rate disclosures.
    whyItMatters: >-
      The company’s growth narrative is strong, but valuation underwriting cannot rely only on company-reported scale
      metrics.
    diligencePath: Request audited financial statements, cohort retention tables, and board-approved operating plans.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: minor
    topic: leadership bench depth
    missingEvidence: Full executive roster and functional ownership across product, engineering, security, finance, and legal.
    whyItMatters: Founder-led companies can scale well, but enterprise execution risk depends on who owns the supporting functions.
    diligencePath: Request an org chart and executive bios in the management presentation.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table
    missingEvidence: A complete executive-team and board roster.
    whyItMatters: >-
      Public materials identify the founders, CEO, and CRO, but not the full leadership surface an investor would
      diligence.
    diligencePath: Ask management for the current leadership list and board committee structure.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map
    missingEvidence: Ownership percentages and any secondary transactions associated with the A, B, and C rounds.
    whyItMatters: Knowing who really controls the company matters more than a public investor name list.
    diligencePath: Review signed financing documents and the post-Series-C capitalization table.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table
    missingEvidence: >-
      A complete internal operating timeline covering hiring, launches, and any smaller strategic events omitted from
      public summaries.
    whyItMatters: >-
      Public chronology captures financing and flagship events but not every internal milestone relevant to underwriting
      execution speed.
    diligencePath: Request management’s fundraising and product-launch timeline deck.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: budget-owner segmentation
    missingEvidence: Public procurement or budget data showing who signs the contract by company size.
    whyItMatters: >-
      The user can be a developer while the payer is a platform or security org, and that distinction changes SAM
      quality materially.
    diligencePath: Collect customer interviews or procurement disclosures from regulated and mid-market buyers.
    relatedQuestionRefs:
      - QM004
  - type: conflicting-data
    severity: material
    topic: market-size definitions
    missingEvidence: Methodology-level reconciliation across AI code review, code review, and AI code tools reports.
    whyItMatters: Without methodology reconciliation, single-number TAM claims can overstate addressable spend.
    diligencePath: Obtain full paid reports or analyst notes and map their inclusion/exclusion logic.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: minor
    topic: coderabbit sam conversion data
    missingEvidence: Pipeline, win-rate, and paid-conversion data by segment.
    whyItMatters: Public materials prove demand, but not how efficiently free or viral adoption converts to enterprise revenue.
    diligencePath: Request cohort conversion, land-and-expand, and ACV data in management diligence.
  - type: missing-source
    severity: material
    topic: true win-loss segmentation
    missingEvidence: >-
      Segmented win/loss data showing where CodeRabbit beats GitHub Copilot, Greptile, or quality/security suites by
      host, repo size, and buyer type.
    whyItMatters: >-
      The moat story changes materially if CodeRabbit mostly wins outside GitHub-only environments or mostly loses once
      security owns the purchase.
    diligencePath: >-
      Request recent competitive bake-off summaries, deal reviews, and renewal notes split by host, segment, and primary
      displacer.
    relatedQuestionRefs:
      - QP005
      - QP018
      - QP024
  - type: private-evidence-only
    severity: material
    topic: review quality consistency
    missingEvidence: >-
      Customer-level false-positive, missed-issue, and adoption data by PR size, monorepo complexity, and regulated
      workflow.
    whyItMatters: >-
      Public reviews agree on the broad trade-off between speed and completeness, but underwriting requires knowing how
      those trade-offs behave in the actual target customer mix.
    diligencePath: >-
      Ask management for reviewer precision/recall cohorts, suppression rates, and usage retention on large-PR or
      enterprise accounts.
    relatedQuestionRefs:
      - QP017
      - QP025
  - type: missing-source
    severity: minor
    topic: realized pricing and discounting
    missingEvidence: >-
      Public sources expose list pricing for some products but not realized enterprise discounts, multi-product bundles,
      or contract minimums across the competitive set.
    whyItMatters: >-
      Pricing power is central to moat durability, and public self-serve cards understate how often review is sold as
      part of a wider platform contract.
    diligencePath: Collect anonymized quotes, marketplace terms, and renewal data from customers or channel partners.
    relatedQuestionRefs:
      - QP010
      - QP011
      - QP012
  - type: conflicting-data
    severity: minor
    topic: benchmark comparability
    missingEvidence: >-
      A single neutral benchmark that measures reviewer depth, false positives, speed, and fix accuracy across identical
      real-world PR sets.
    whyItMatters: Without a common benchmark, public claims can overstate differentiation and hide scenario-specific weaknesses.
    diligencePath: >-
      Run a controlled internal bake-off on the company’s own repos or obtain third-party benchmark methodology and raw
      results.
    relatedQuestionRefs:
      - QP016
      - QP025
  - type: private-evidence-only
    severity: material
    topic: ARR and revenue mix
    missingEvidence: Current ARR, recurring versus usage revenue mix, and paid-seat conversion by segment.
    whyItMatters: Without ARR and mix, public traction claims cannot be converted into durable revenue quality or valuation support.
    diligencePath: Request audited or board-level ARR, usage revenue share, and conversion cohorts from free or OSS accounts.
    relatedQuestionRefs:
      - QI001
      - QI017
      - QI025
  - type: private-evidence-only
    severity: material
    topic: gross margin and burn
    missingEvidence: Product-level gross margin, infrastructure cost allocation, monthly burn, and cash balance.
    whyItMatters: >-
      CodeRabbit’s best products are likely compute-sensitive, so margin quality and runway cannot be inferred from
      software pricing alone.
    diligencePath: >-
      Request monthly P&L detail, gross margin by product family, and a 24-month operating plan with base and downside
      burn scenarios.
    relatedQuestionRefs:
      - QI013
      - QI022
      - QI025
  - type: missing-source
    severity: material
    topic: sales efficiency and retention
    missingEvidence: CAC, payback, win rates, NRR, and customer concentration.
    whyItMatters: Customer logos and case studies prove demand, but not whether growth is efficient or durable.
    diligencePath: Obtain cohort-level retention, CAC/payback, ACV distribution, and top-customer concentration data.
    relatedQuestionRefs:
      - QI008
      - QI017
      - QI025
  - type: conflicting-data
    severity: minor
    topic: private-company dataset lag
    missingEvidence: A reconciled timeline across third-party databases and official company financing disclosures.
    whyItMatters: Lagging outside datasets can distort naive analyses of stage, capital raised, or growth.
    diligencePath: Cross-check official round announcements, SEC notices, and management cap-table summaries.
    relatedQuestionRefs:
      - QI016
      - QI024
  - type: missing-source
    severity: material
    topic: Model orchestration internals
    missingEvidence: >-
      No public architecture deep dive on model routing, provider mix, evaluation pipeline, or cost controls outside
      workflow descriptions.
    whyItMatters: >-
      Investors cannot tell whether differentiation comes from proprietary orchestration, prompt engineering, data
      flywheels, or vendor aggregation.
    diligencePath: >-
      Request technical architecture review covering model stack, retrieval/context pipeline, evaluation loop, and
      guardrail infrastructure.
    relatedQuestionRefs:
      - QE003
      - QE024
      - QE025
  - type: missing-source
    severity: material
    topic: Reliability and quality metrics
    missingEvidence: No public uptime record, SLOs, comment acceptance rate, detection precision/recall, or false-positive trend data.
    whyItMatters: Feature breadth is easier to market than durable review quality; absent metrics make maturity hard to underwrite.
    diligencePath: >-
      Request product analytics on latency, uptime, finding acceptance, bug catch rates, and security-scan outcome
      quality.
    relatedQuestionRefs:
      - QE014
      - QE021
      - QE024
  - type: private-evidence-only
    severity: medium
    topic: Module-level adoption
    missingEvidence: >-
      No public breakout of how many customers actively use Change Stack, Security Agent, Slack/Discord agents, or
      CLI/IDE surfaces.
    whyItMatters: Roadmap breadth only matters if the newer modules achieve real adoption and retention.
    diligencePath: Request MAU/WAU and paid attach rates by module, segmented by SMB, mid-market, and enterprise.
    relatedQuestionRefs:
      - QE010
      - QE011
      - QE021
  - type: private-evidence-only
    severity: medium
    topic: Cross-platform support burden
    missingEvidence: No public data on engineering/support cost of maintaining GitHub, GitLab, Azure DevOps, and Bitbucket parity.
    whyItMatters: Cross-platform ambition can be a moat or a distraction depending on support overhead and customer mix.
    diligencePath: Request host-level customer mix, usage share, and incremental engineering burden by provider.
    relatedQuestionRefs:
      - QE016
      - QE019
      - QE024
  - type: private-evidence-only
    severity: material
    topic: Retention and renewal
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and expansion by customer cohort are not public.
    whyItMatters: Customer adoption breadth does not equal durable recurring revenue without retention data.
    diligencePath: >-
      Request cohort retention, renewal, contraction, and expansion data by SMB, enterprise, regulated, and
      OSS-converted accounts.
    relatedQuestionRefs:
      - QU013
      - QU016
      - QU025
  - type: private-evidence-only
    severity: material
    topic: Customer concentration
    missingEvidence: Top-customer revenue share, top-10 concentration, and vertical concentration are not public.
    whyItMatters: Marquee reference customers could account for a disproportionate share of ARR.
    diligencePath: Request customer concentration, logo concentration, and ARR mix by top customers and sectors.
    relatedQuestionRefs:
      - QU017
      - QU021
      - QU025
  - type: missing-source
    severity: medium
    topic: Independent enterprise references
    missingEvidence: >-
      Fresh independent customer talks, conference sessions, or procurement records confirming large-scale production
      use.
    whyItMatters: Most strong public proofs are still vendor-authored case studies.
    diligencePath: >-
