companyProfile:
  summary: CodeRabbit is a Bay Area AI developer-tools startup founded in 2023 by Harjot Gill and Guritfaq Singh. The company started with automated pull-request review and now markets a broader Agentic Change Management platform spanning review, triage, change understanding, security analysis, and collaboration workflows across GitHub, GitLab, Bitbucket, Azure DevOps, IDE, CLI, Slack, and Discord surfaces. Its go-to-market motion combines free open-source distribution and self-serve paid plans with enterprise upsell into security, governance, and procurement-heavy accounts. By August 2026, CodeRabbit publicly claimed 17,000+ customers, 150,000+ open-source projects, and 2M+ weekly reviews, while outside proof included BMW’s 1,000+ developers and multiple named software buyers.
