    claimRefs: [CE001, CE002, CE007, CE008, CE009]
callouts:
  - calloutType: strength
    title: Human care and software form one product
    body: >-
      Nourish's customer journey ties insurance administration and longitudinal software
      engagement to recurring registered-dietitian care, creating a broader service surface
      than an appointment marketplace alone.
    claimRefs: [CE001, CE002, CE003, CE004]
  - calloutType: risk
    title: Public technical proof remains thin
    body: >-
      The assigned evidence describes product functions but does not independently establish
      architecture, security certification, uptime, integration quality, AI accuracy, or
      roadmap delivery.
    claimRefs: [CE009, CE014, CE015, CE016]
