        - label: Clinical care
          detail: Virtual assessment, personalized plan, and recurring registered-dietitian counseling
        - label: Patient engagement
          detail: Messaging, meal and macro tracking, recipes, goals, and progress
        - label: Health data
          detail: Lab results and company-claimed lab and wearable integrations
        - label: Dietitian assistance
          detail: AI copilot for note-taking and clinical insights
        - label: Control boundary
