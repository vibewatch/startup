  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A target-company engineering artifact or practitioner source covering the product stack, integrations, deployment practices, or technical operations.
      whyItMatters: The assigned developer-signal candidates concern unrelated products and cannot validate implementation maturity or team execution.
      diligencePath: Request architecture documentation and engineering references, then verify a target-company repository, technical talk, integration guide, or practitioner discussion.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: security-and-reliability
      missingEvidence: Current security certifications, privacy audit results, penetration-test summary, uptime history, incident log, recovery objectives, and vendor inventory.
      whyItMatters: Account and AI disclaimers describe obligations and limits but do not prove control design or operating effectiveness.
      diligencePath: Review the security data room, independent audit reports, status history, incident register, business-continuity tests, and subprocessors.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: ai-safety
      missingEvidence: Model cards, evaluation datasets, accuracy and hallucination rates, clinician override rates, monitoring thresholds, and post-deployment safety reviews.
      whyItMatters: The product claim depends partly on AI assistance while the terms expressly warn that outputs may be inaccurate.
      diligencePath: Conduct a model-risk review with product, clinical, security, and compliance owners using production evaluation results.
      relatedQuestionRefs: [QE008]
    - type: conflicting-data
      severity: minor
      topic: provider-network
      missingEvidence: A dated reconciliation of the current active-provider count and the definitions of provider, dietitian, and employed W-2 dietitian.
      whyItMatters: The current homepage uses 9,000+ and over 10,000, weakening precision around network scale and product capacity.
      diligencePath: Obtain a monthly active-provider rollforward segmented by employment status, licensure, state, specialty, and patient availability.
