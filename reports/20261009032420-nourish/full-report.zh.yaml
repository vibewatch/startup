chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、护理模式与创立里程碑
        blocks:
          - type: paragraph
            body: >-
              Nourish 是一家 AI 原生的虚拟代谢与慢性病诊所，在网络内健康保险覆盖下，将患者直接连接至持证注册营养师 [CO001]。公司由首席执行官 Aidan Dewar、总裁兼首席运营官 Sam Perkins
              以及 Stephanie Liu 于 2021 年创立，旨在通过临床生活方式干预应对糖尿病、糖尿病前期和肥胖等营养相关慢性病 [CO003, CO005]。Nourish
              没有把营养护理当作辅助建议，而是将饮食护理定位为一线医疗学科，接入商业保险、Medicare 和 Medicaid 健康计划 [CO001, CO004]。平台提供虚拟问诊、持续的 App
              内聊天、宏量营养素与症状追踪，以及由医生协同的实验室检测 [CO001, CO004]。              Nourish 将营养师咨询与自有人工智能工具结合，试图持续改变患者行为，压低医疗成本曲线
              [CO001, CO002]。公司总部位于纽约州纽约市，服务覆盖全美 50 个州 [CO001, CO004]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
