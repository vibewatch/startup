      - number: '4.2'
        title: 单位经济性、交付成本结构与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              不同于软件毛利率超过 75% 的纯数字健康软件平台，Nourish 采用劳动密集型的混合护理模式，使用受雇的 W-2 注册营养师（RDN）。公司临床员工从 2025 年 4 月的 3,000 多名 W-2 RDN
              扩张到 2026 年 5 月的 10,000 多名提供者，形成固定及半可变工资、医疗福利和雇主工资税义务，并随患者就诊量同步变化。交付成本还包括专业收入周期管理（RCM）团队、覆盖 50
              个州的临床资质认证、提供者入职和远程医疗基础设施。运营评论指出，尽管 Nourish 部署 AI
              副驾驶以自动记录临床笔记、消除行政制表工作，营养师的直接人工仍是主要销货成本。因此，贡献利润率高度敏感于临床人员预约利用率、患者爽约率、账单拒付率和医疗记录审计开销。在没有披露毛利率的情况下，可比的提供者密集型数字诊所模式显示毛利率大致在
              35% 至 55% 之间。
