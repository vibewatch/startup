  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、支付方组合与报销机制
        blocks:
          - type: paragraph
            body: >-
              Nourish 通过商业健康计划、Medicare 和 Medicaid 变现初级保健及慢性病营养咨询，而不是依靠消费者现金订阅或软件许可费。公司称已与覆盖全美 50
              个州、数亿商业及政府成员的全国性和区域性健康计划合作，使 94% 的活跃患者能够零自付获得护理。在这种第三方报销机制下，收入实现直接取决于医疗理赔裁决、按服务收费编码（主要是医疗营养治疗 CPT
              代码）以及网络参与协议。Multiples.vc 记录的估算年度收入从 2025 年 4 月 Series B 前后的 $23M 增至 2026 年 5 月 Series C 时的 $160M；Latka
              则另行估计 2024 年收入为 $111.9M。但 Nourish 没有公布经审计财报、净收款比例或支付方集中度。此外，公司仲裁条款和服务条款规定患者负责未支付的医疗余额，但非覆盖临床服务的消费者收款率仍未披露。
