      - number: '3.3'
        title: 以报销为核心的定价与商业包装
        blocks:
          - type: paragraph
            body: >-
              Nourish 的市场进入架构以网络内健康计划报销为中心，消除了消费者的自付财务障碍 [CP003]。通过与覆盖全美 50 个州的数百家商业保险承运商直接签约，Nourish 让 94%
              的活跃患者能够零自付获得虚拟营养咨询 [CP003]。因此，Nourish 不公布标准商业价目表或消费者订阅费率，这使其区别于自费健康应用和直接面向消费者的软件工具
              [CP008]。为降低对商业按服务收费报销的依赖，Nourish 正通过医疗系统和雇主福利扩大机构分发 [CP007, CP014]。它与印第安纳州的 Community Health Network
              合作，把虚拟注册营养师接入多专科临床工作流，包括初级保健、心脏病学和内分泌科，以较低的结构性边际获客成本获得机构转诊流量 [CP007, CP014]。              这项企业扩张让 Nourish
              可以在传统支付方索赔主张结算之外，争取按 PEPM 计费的雇主合约 [CP007, CP008]。
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP014
