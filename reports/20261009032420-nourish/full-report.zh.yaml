  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与支付方结构
        blocks:
          - type: paragraph
            body: >
              最清晰的公开细分是使用虚拟营养师护理的美国个人患者。Nourish 称其通过超过 9,000 名营养师的网络覆盖全美 50 个州，且其条款把服务使用限制为居住在美国或其属地的成年人 [CU001, CU002,
              CU014]。费用通常由保险中介支付：Nourish 称 94% 的患者无需自付，Fierce Healthcare 则报道截至 2025 年 4 月，公司服务的商业保险、Medicare 和 Medicaid
              支付方覆盖 150 million 人 [CU003, CU004]。覆盖人数是资格覆盖范围，不是活跃客户数；两份来源都没有披露支付方组合或实际报销额。

              Fierce Healthcare 还报道 Nourish 面向医疗系统和雇主提供企业服务，但当时高管尚未公开合作方名称
              [CU009]。因此，公开证据支持的是三种角色，而不是一个简单的客户数：患者是用户，保险公司可以为护理提供资金，医疗系统或雇主可能是组织买方或渠道。指定证据没有说明收入如何在这些群体间分配，任何企业关系是试点还是生产部署，也没有说明少数支付方或渠道伙伴是否贡献了大量收款。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU014
