      - number: '1.2'
        title: 领导层、治理与人员架构
        blocks:
          - type: paragraph
            body: >-
              Nourish 的管理层由联合创始人兼首席执行官 Aidan Dewar，以及联合创始人、总裁兼首席运营官 Sam Perkins 主导 [CO003, CO005]。2026 年 5 月 Series C
              融资后，机构投资方在治理层的代表性增强：Menlo Ventures 合伙人 J.P. Sanday 正式加入 Nourish 董事会 [CO001]。此前的机构治理支持还包括 J.P. Morgan
              Private Capital 旗下 Growth Equity Partners 的参与，该机构由联合管理合伙人 Paris Heymann 负责 [CO005]。运营层面，Nourish 采用 W-2
              雇佣模式聘用注册营养师，以维持临床标准、医生留任和护理协同 [CO004, CO005]。Revelio Labs 的外部劳动力数据记录显示，截至 2026 年 3 月，公司全球员工总数约为 4,082
              人；公司披露的关联临床服务提供者网络则超过 10,000 人 [CO001, CO008]。这一数字差异说明，直接雇佣的 W-2 公司员工、W-2 临床员工和广泛的网络关联方之间存在重要结构区别 [CO008]。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
