              - CU012
      - number: '6.3'
        title: 留存、集中度与信任缺口
        blocks:
          - type: paragraph
            body: >
              Nourish 描述了一种灵活的护理频率：大多数患者起初每周或每两周见一次营养师，之后可能改为每月复诊，且没有最低互动要求或承诺 [CU006,
              CU007]。这种灵活性可能降低采用阻力，但指定证据没有披露毛收入或净收入留存、患者流失、续约、平均完成就诊次数、队列持续时间、重新激活或合同期限。因此，可观察到的是护理路径，而不是其持久性和经济性。没有起始队列和完成分母，12
              个月患者的公司报告结果不能证明留存。

              集中度同样没有解决。150-million 覆盖人数说明分发广度，却无法说明有多少成员使用 Nourish，也无法说明收款如何在支付方之间分布 [CU004]。客户信任也值得尽调：一份 2026 年 7
              月的商业法律分析报告称，Podraza v. Nourish 中的联邦《窃听法》和《加州入侵隐私法》诉求在 2026 年 4 月的驳回动议中存续，同时指出其他诉求已被驳回
              [CU015]。这是指控阶段的诉讼信号，不是责任证明，也不是已记录的客户流失事件。分配到的三个全新搜索结果涉及使用“Nourish”一词的无关组织，说明证据池本身无法填补这些客户数据缺口 [CU016]。
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU015
              - CU016
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 覆盖广度不等于活跃采用
            body: |
              150 million 覆盖人数代表潜在保险触达，而“数十万”代表截至 2025 年 4 月的服务患者数。两项指标都没有提供当前活跃用户分母、重复就诊率或支付方集中度。
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: callout
            title: 隐私诉讼是信任信号，不是责任认定
            body: |
              一份商业法律分析称，核心联邦窃听和 CIPA 诉求在 2026 年 4 月通过了诉状阶段。指定资料池不含案卷，也没有由此导致流失的证据，因此应直接核实当前案件状态及任何客户影响。
            calloutType: risk
            claimRefs:
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法定责任与追踪像素诉讼风险
        blocks:
          - type: paragraph
            body: >-
              Nourish 面临源自数字医疗隐私执法的重要法律与合规风险。在 Podraza v. Nourish, Inc.（Case No. 3:25-cv-50356, N.D. Ill.）中，代表估计超过
              10,000 名患者的原告指称，Nourish 未取得明确同意，便通过嵌入式网页追踪像素将敏感健康信息传输给包括 Google 在内的第三方广告平台，构成违法。2026 年 4 月 20 日，联邦法院驳回
              Nourish 对主要诉求的驳回动议，允许联邦《电子通信隐私法》（《窃听法》）和《加州入侵隐私法》（CIPA 第 631 条）诉求进入取证阶段。法院认为，Nourish 被动的 browsewrap
              披露不足以满足加州对健康数据传输的全体同意标准。尽管 Nourish 的消费者条款要求具有约束力的 JAMS 仲裁并放弃集体诉讼，司法界对 browsewrap
              同意和窃听法律定额损害赔偿的怀疑，仍带来尚未确定金额的责任，可能迫使公司承担高昂和解成本或改造用户获客漏斗。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营治理、W-2 临床人员开销与临床范围边界
        blocks:
          - type: paragraph
            body: >-
              Nourish 的雇佣模式以超过 3,000 名在全美 50 个州工作的 W-2
              注册营养师为核心。管理层采用这一模式是为了确保护理质量、患者留存和保险方匹配，但它也带来大量固定人工开销和雇主福利承诺。如果预约利用率下降或支付方报销表被压低，固定的 W-2 工资承诺可能相较 1099
              合同工市场迅速推高运营现金消耗。此外，Nourish 依赖内部人工智能工具，包括总结问诊音频的自动临床记录员，以及移动应用中的宏量营养素记录功能。尽管 Nourish 使用条款明确排除医疗责任，并说明 AI
              输出不构成专业医疗诊断，未受监控的算法错误或错误分类的饮食计划仍可能引发患者不满，并招致各州营养学委员会的执照审查。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 支付方依赖、报销持续性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Nourish 的商业模式根本上依赖第三方商业健康计划报销。公司声称，由于与包括 Blue Cross Blue Shield、UnitedHealthcare、Aetna 和 Cigna
              在内的主要商业保险公司签约，约 94% 的网络内患者无需自付。然而，高度依赖支付方使平台暴露于突然的费率重新谈判、利用管理审计和追溯性账单追回。在政府项目中，Nourish 的报销覆盖仍受限制：Medicare
              仅接受确诊糖尿病或慢性肾病患者，不包括糖尿病前期和一般营养咨询。更关键的是，截至 2026 年 Nourish 不接受 Medicaid
              覆盖，这与早期宣传公告出现执行偏差，也限制了服务不足患者群体的可服务规模。无保险患者每次需支付 $145，并承担 $75 的取消费，限制了自费转化。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 财务模式韧性、宏观逆风与尽调行动项
        blocks:
          - type: paragraph
            body: >-
              随着临床网络扩张，Nourish 的资本需求也在增加；完成风险融资后，估算员工人数在 1,001 至 5,000
              人之间。除内部运营开销外，宏观经济逆风也威胁长期患者临床结果：进口食品商品关税和新鲜农产品价格持续通胀推高已入组患者的杂货支出，无论远程医疗就诊补贴如何，都可能削弱其遵守规定营养方案的程度。Nourish
              通过法律免责声明说明临床服务不包括开具 GLP-1 药物，重点是生活方式支持。确认性尽调必须评估准确的支付方毛利率、历史审计损失准备，以及未决窃听诉讼中集体和解谈判的进展。
            claimRefs:
              - CR007
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 窃听集体诉讼态势威胁网页转化架构
            body: >-
              Podraza v. Nourish 中，法院驳回 Nourish 的动议，表明其面临《联邦窃听法》和 CIPA 的现实风险。将 browsewrap 改成严格的 clickwrap
              可能压低漏斗顶部的转化率，而集体诉讼损害赔偿仍未清算。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Nourish 是一家原生 AI 的医疗基础设施平台，正在 50 个州扩大注册营养师的服务可及性，做多逻辑颇具吸引力。Menlo Ventures、Thrive Capital
              等一线风投为其背书；平台把预防性生活方式咨询与代谢疾病医疗结合起来，并与覆盖超过 2 亿人的全国性保险机构合作，触达 250 多个转诊医疗系统。更关键的是，公司称其在 2025
              年实现盈利，同时将注册营养师网络扩展到 10,000 名以上。反方逻辑则集中在估值倍数过高和数据不透明：私募二级市场估值与融资记录显示，公司完成 $100M 的 Series C 后投后估值达到
              $1.75B，但经核实的收入年化规模、单位毛利率和客户留存指标仍未披露。此外，尚未终结的窃听与 CIPA 跟踪诉讼，凸显出可能阻碍企业医疗系统采用的合规和声誉风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 资本结构、融资历史与定价纪律
        blocks:
          - type: paragraph
            body: >-
              Nourish 的融资轨迹显示，四轮机构融资带来了大幅估值跃升，累计募资超过 $214M。Forge Global 的二级市场和 IPO 前融资资料显示，Series C 于 2026 年 5 月 19
              日完成，发行价为每股 $12.47，对应投后估值 $1.75B。此前，$70M 的 Series B 于 2025 年 4 月完成，发行价为每股 $7.77（投后估值 $1.0B）；$35M 的 Series A
              于 2024 年 3 月完成，发行价为每股 $2.39（估值 $334.16M）。值得注意的是，Series C 优先股共 8,018,925 股，清算优先顺位为 1，采用标准 1.0x
              非参与型清算优先权倍数，不设累计分红义务。由于不存在激进的清算优先权负担，普通股不会承受严重的优先权拖累；但在未披露经审计 ARR 的情况下，以 $1.75B 的名义估值入场，仍要求严格执行估值纪律。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景分析、下行触发因素与尽调路径
        blocks:
          - type: paragraph
            body: >-
              按乐观、基准和悲观情景评估 Nourish，可见其在当前入场估值下承受不对称的下行风险。乐观情景中，医生协作、GLP-1 配套项目和自动化 AI 健康代理能让 Nourish
              叠加高毛利的虚拟医疗服务，从而支撑高溢价数字医疗倍数。基准情景中，付款方合同持续续约、临床人员成本限制利润率温和扩张，$1.75B 估值可能相对上市远程医疗可比公司出现倍数压缩。悲观情景中，CIPA
              窃听诉讼（Podraza v. Nourish, Inc.）的不利裁决，加上付款方追索或更严格的 GLP-1
              事前授权门槛，会带来定价下行压力。因此，在明确核实年化收入、单位毛利率和诉讼和解准备金之前，尽调结论仍为“跟踪”，置信度中等、风险评级高。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 投资立场：跟踪
            body: Nourish 的全国服务商覆盖和付款方覆盖带来了出色的商业分发能力，但在缺乏经核实的收入年化规模和利润率透明度时，以 $1.75B 投后估值入场，仍应保持跟踪，直到经审计的经营数据出现。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
          - type: callout
            title: 活跃诉讼与监管阻力
            body: >-
              2026 年 4 月 20 日，Podraza v. Nourish, Inc. 联邦法院拒绝驳回有关向 Google 传输跟踪像素数据的《窃听法》和 CIPA
              法律主张，引入无上限法定损害赔偿风险，并招致隐私治理审查。
            calloutType: risk
            claimRefs:
              - CV007
