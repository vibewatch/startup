      - number: '4.3'
        title: 资本充足性、未来 runway 与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Nourish 获得由 Menlo Ventures 领投的 $100M 新增主要增长股权融资，使累计股权融资达到 $213M 至
              $215M，分布于五轮定价融资。这笔大额现金注入为公司扩张营养师网络、建立 Nourish Labs 诊断合作并试点医生主导的代谢医疗服务提供了近期资本充足性和资金 runway。然而，独立财务评论指出，将
              Nourish 定价在 $1.75B 至 $1.8B、相当于估算 $160M 收入的 10.9x 倍数，意味着必须把 Nourish 视为高毛利、可规模化的代谢基础设施，而不是标准护理交付诊所。Omada
              Health、Teladoc 和 LifeStance 等上市可比公司按收入的 0.5x 至 3.7x
              倍数交易，反映市场对劳动密集型护理模式的疑虑。机构投资者的关键投资判断阻碍包括未经确认的月度现金消耗、直接消费者与健康系统转诊漏斗各自的获客成本（CAC）回本期，以及 Podraza v. Nourish
              窃听诉讼等可能带来结构性合规开销的未决诉讼责任。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 展示项
        blocks:
          - type: callout
            title: 相对上市护理交付同业的估值倍数溢价
            body: >-
              按估算 $160M 年化收入计算，Nourish 在 $1.75B 至 $1.8B 投后估值下对应的收入倍数约为 10.9x。相比之下，提供人工护理的上市数字健康平台（如 Omada Health
              3.7x、LifeStance 2.0x、Teladoc 0.5x）因人工约束和利润率拖累而大幅折价交易。要支撑这一估值，必须证明软件式运营杠杆，而公开数据尚未验证这一点。
