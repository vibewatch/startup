      - number: '5.3'
        title: 成熟度与差异化
        blocks:
          - type: paragraph
            body: >-
              护理交付界面看起来已经商业化部署，而非停留在概念阶段：Nourish 称其覆盖全美 50 个州，2025 年 4 月公告则报告当时已有数十万患者和 3,000 多名 W-2 营养师。一份信誉较低的第三方简介称
              Nourish Labs 于 2026 年 1 月开始提供融入护理的免费心脏代谢实验室检测；在据此做投资判断前，应直接核实。资料池中最可信的产品差异化，是支付方管理、大型临床人员网络、长期 App
              互动、实验室和可穿戴设备，以及面向临床人员的 AI
              的组合。然而，保留来源都没有提供实施速度、临床人员生产率、患者互动、准确性、正常运行时间或整合质量的独立基准。因此，规模说法证明的是商业覆盖广度，不是技术优越性。
            claimRefs:
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: 信任、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              在指定资料池中，Nourish 的条款提供了最清晰的控制与限制。用户必须保护包括多因素认证在内的凭据，并向公司报告疑似未经授权的访问。同一条款警告 AI
              输出可能不完整、过时或不准确，不能取代持证临床判断；条款还说明远程医疗的限制，并不保证服务不中断或无错误。这些披露恰当地限定了产品承诺，但不是控制有效性的证据。资料池没有目标公司的安全认证、隐私审计、状态历史、事件记录、模型评估或开发者产物。三个全新职位来源涉及无关的英国公司
              Nourish Care，另一份“Nourish”设计案例涉及 Scale Social 的食物分享原型。它们只能用于识别来源污染，无法填补目标公司的开发者信号缺口。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
