      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >
              患者是用户和护理接受者，但通常不是经济支付方。公司称会核验保险并提交理赔，而 Fierce Healthcare 报道其与商业保险计划、Medicare 和 Medicaid 建立了关系 [CM004,
              CM005]。Forbes 将其创立洞察归因于长期存在但因可及性和认知不足而使用率偏低的医疗营养治疗保障；即使福利存在，服务发现、转诊、福利核验和提供者可用性仍可能成为采用瓶颈 [CM008]。同一报道描述了
              Nourish 直接向保险收费的模式，使购买路径偏离传统消费者订阅 [CM007]。

              企业路径则更不透明。Fierce Healthcare 报道称，2025 年 4 月 Nourish 面向医疗系统和雇主提供服务，但合作方身份尚未公布
              [CM009]。公开资料没有披露这些买方究竟按符合条件的成员、已注册成员、就诊次数、理赔，还是其他合同形式付费。临床人员也是关键市场参与者：Nourish 高管称，W2
              雇佣模式有利于福利、质量管理、结果和成本控制 [CM011]。这套结构可能改善临床治理，但现有证据无法量化其劳动力经济性及对毛利率的影响。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
              - CM016
      - number: '2.4'
        title: 增长驱动、采用约束与尽调含义
        blocks:
          - type: paragraph
            body: >
              两项有证据支持的需求信号是报销可及性和 GLP-1 相关护理需求。Forbes 报道，医疗营养治疗保障自 2000 年代初就已存在，但因可及性和认知不足而未广泛使用 [CM008]。Fierce
              Healthcare 报道 Nourish 于 2024 年进行的一项逾 3,700 人调查：五分之一是当前 GLP-1 用户，9% 曾使用过该类药物，且从未使用者中有三分之一有兴趣尝试
              [CM010]。这是贸易媒体报道的公司调查，不是全国市场的独立估计，但支持把 GLP-1 营养支持视为值得验证的需求假设。

              约束同样重要。Nourish 条款将服务限制为居住在美国或其属地的成年人，而官网又称营养师服务儿童；在计入儿科需求前，必须澄清资格和签约规则 [CM012]。一家商业同意管理供应商报告称，Podraza v.
              Nourish 中的联邦《窃听法》和加州 CIPA 诉求在 2026 年 4 月的驳回动议裁定中存续，其他诉求则被驳回；这只是对未决诉讼的不利二手描述，不是最终责任认定
              [CM013]。买方预算、报销持续性、隐私控制、提供者利用率，以及从覆盖人数转化为完成长期护理的比例，仍是最可能改变采用时点和估值的变量 [CM016]。
            claimRefs:
              - CM008
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 覆盖人数代表分发能力，不是市场收入
            body: >-
              报告中的 150 million 覆盖人数说明支付方触达，而 94% 无需自付的说法表明患者支付阻力有限。两项指标都无法说明资格、利用率、报销、就诊频率、留存或收入，因此不应被呈现为 TAM、SAM、SOM 或
              ARR。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: callout
            title: 证据池不足以支持美元市场规模
            body: 保留的资料没有独立的市场支出序列、理赔量数据集、与 Nourish 业务组合相匹配的报销表或已披露的单位经济性。同名的食品和补充剂结果无法填补这一缺口；估值依赖市场规模算术前，必须取得管理层数据和支付方证据。
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代护理模式
        blocks:
          - type: paragraph
            body: >-
              Nourish 所处的竞争格局涵盖专业远程营养服务商、慢性病管理供应商、传统初级保健诊所以及健康计划内部护理项目 [CP001]。Foodsmart 和 Oviva
              等数字健康同业专注远程饮食咨询，但地域集中度、支付方匹配和临床整合差异显著 [CP001]。Foodsmart 已深耕 Medicaid 和食物即药物项目，而 Oviva 主要在欧洲法定医疗体系中运营
              [CP001]。Velora Health 等专业初创公司面向消费者营养和雇主健康，但其商业网络内覆盖范围比 Nourish 的 50 州覆盖更窄
              [CP009]。与此同时，依赖医院门诊中心或独立初级保健转诊的传统现状护理，受到营养师长期短缺、预约积压和地域碎片化的影响 [CP001]。此外，LeadIQ 估计 Nourish 组织员工数在 1,001 至
              5,000 人之间，说明其临床提供者网络之外也具备较大运营规模 [CP010, CP011]。尽调还需将商业远程医疗实体 Nourish 与同名公共健康项目区分开，例如澳大利亚 Nourish
              Network，它们是学术和零售集合体，不提供临床护理 [CP012]。
