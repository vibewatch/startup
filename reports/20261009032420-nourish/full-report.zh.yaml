      - number: '6.2'
        title: 采用信号与客户证明
        blocks:
          - type: paragraph
            body: >
              公开规模信号有意义，但不能直接比较。Fierce Healthcare 报道 2025 年 4 月有“数十万”患者和 150 million 覆盖人数；当前官网则称服务覆盖全国，并拥有超过 9,000 名营养师
              [CU001, CU002, CU004, CU005]。前者是模糊的患者量描述，第二个是支付方资格上限，第三个是提供者容量。没有任何一项提供当前活跃患者分母、就诊量、复用率或同比增长计算。官网另称不使用
              GLP-1 的患者 12 个月后平均减重 8%，但指定文本没有提供队列规模、流失率、对照组或独立复现 [CU013]。

              有名有姓的证明仅限于公司挑选的患者评价。Bianca G. 称一年后减重 40 磅且血红蛋白 A1c 恢复正常；Emily G. 描述了个性化方案的好处；Brandon M.
              称咨询帮助他为胃肠健康和痛风问题建立了可执行的饮食方案 [CU010, CU011,
              CU012]。这些案例展示了合理的使用场景和持续互动，但不是经独立验证的客户参考。没有指定来源提供完整姓名、医疗记录、支付方确认、企业部署状态，或正负面结果的代表性分母。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
              - CU013
