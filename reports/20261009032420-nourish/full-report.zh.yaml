      - number: '3.2'
        title: 诊断实验室整合、结果与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Nourish 通过整合诊断实验室和以结果为导向的代谢护理，形成临床模式差异化 [CP002]。2026 年 1 月，公司推出 Nourish Labs，把包括
              A1C、血脂检测和甲状腺筛查在内的常规心脏代谢检测，通过 Quest Diagnostics、LabCorp 和 BioReference 直接嵌入虚拟营养师问诊 [CP002,
              CP015]。打通诊断反馈闭环后，Nourish 让营养师获得客观生物标志物数据，而不必完全依赖患者自报的饮食记录 [CP002, CP015]。就用药依从性而言，已发表的第三方评论称，接受 GLP-1 治疗的
              Nourish 患者中有 68% 在 6 个月时仍在治疗，高于记录中的 46% 行业基准 [CP005]。这项依从性数据为希望控制高昂 GLP-1 药物支出的健康计划和自保雇主提供了关键采购切入点
              [CP005]。但技术执行也暴露出明确弱点：独立测试者和消费者评论持续指出 Nourish 移动应用的 AI 饮食记录准确性不足，这可能成为相对于专业数字竞争者的留存阻力 [CP006]。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP015
