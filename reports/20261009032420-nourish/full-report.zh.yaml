      - CV001
      - CV002
      - CV004
      - CV005
  - id: TV002
    title: 投资正论与反论核心矩阵
    columns:
      - 维度
      - 乐观论据
      - 反论权重
      - 证据与尽调核验
    rows:
      - - 临床与支付方规模
        - 覆盖 50 个州，拥有 10,000+ 名营养师及 200M 保障人口
        - 主要支付方合同集中风险；94% 的就诊自付额为 $0
        - 主要保险账单安排及网络内保障条款
      - - 技术与 AI 交付
        - 配备自动笔记和临床副驾工具的 24/7 AI 健康代理
        - 平台基础设施扩容障碍及工程管理团队扩张
        - Platform Engineering 与 LLM/RAG 系统加固岗位的招聘要求
      - - 财务画像与倍数
        - 管理层宣布 2025 年实现运营盈利
        - 绝对收入、每次咨询毛利率及现金余额仍未公开
        - 经审计的 GAAP / 现金流财务报表及经核实的 2026 年运行率
      - - 监管与法律态势
        - 临床服务进入既有医疗系统网络
        - 联邦 Wiretap Act 与 CIPA §631 诉讼经驳回动议审查后继续
        - Podraza v. Nourish, Inc. 伊利诺伊州联邦法院案卷（3:25-cv-50356）
    notes: 将临床扩张信号与私有披露不透明度及法律暴露进行对照的定性综合。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观、基准与悲观估值情景分析
    columns:
      - 情景
      - 运营与财务假设
      - 隐含估值逻辑
      - 概率权重
      - 主要论点风险与终止触发条件
    rows:
      - - 乐观情景
        - 医生服务模式加速、GLP-1 配套服务占据主导、EBITDA 利润率 >40%
        - 通过公开 IPO 或战略性支付方收购实现 $2.5B - $3.5B 退出
        - 25%
        - 支付方反对营养师服务捆绑；GLP-1 保障政策收紧
      - - 基准情景
        - RDN 网络利用率稳定、医生采用温和、运营现金流盈亏平衡
        - 保持 $1.2B - $1.75B 私募估值；回报持平至温和增长
        - 50%
        - 数字医疗同业估值倍数压缩；收入增长触顶
      - - 悲观情景
        - 支付方费率压缩、依据 CIPA / wiretap 法规承担高额集体诉讼责任
        - $400M - $700M 结构化下轮融资或困境整合
        - 25%
        - 集体诉讼不利判决；失去主要全国支付方网络内资格
    notes: 情景区间反映参考数字医疗同业及缺乏已披露 GAAP 财务数据情况下，对私募市场倍数的估计调整。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Nourish 创立、主要融资轮次、网络扩张及临床项目启动的时间顺序。
    data:
      items:
        - date: '2021-01-01'
          label: 公司创立
          detail: Aidan Dewar、Sam Perkins 与 Stephanie Liu 创立 Nourish，提供保险覆盖的营养咨询。
          tone: positive
        - date: '2023-06-30'
          label: 临床网络扩张
          detail: 全国支付方合同开始接入，团队规模扩大到 400 人以上。
          tone: neutral
        - date: '2024-03-15'
          label: $70M B 轮融资
          detail: J.P. Morgan Growth Equity Partners 联合 Index Ventures 与 Thrive Capital 领投 $70M 轮融资，用于扩展 AI 基础设施。
          tone: positive
        - date: '2024-11-01'
          label: GLP-1 专项护理项目
          detail: Nourish 推出定向临床路径，支持开始或停止 GLP-1 治疗的患者。
          tone: positive
        - date: '2025-12-29'
          label: 公司使用条款更新
          detail: 依据 JAMS 规则设立强制个人仲裁，并正式加入 AI 功能免责声明条款。
          tone: warning
        - date: '2026-01-15'
          label: Nourish Labs 上线
          detail: 将免费的综合心脏代谢实验室检测纳入持续的营养师远程护理。
          tone: positive
        - date: '2026-03-31'
          label: 全球员工数里程碑
          detail: Revelio Labs 记录显示，公司企业与临床职能的全球员工数超过 4,000 人。
          tone: neutral
        - date: '2026-05-19'
          label: $100M C 轮融资
          detail: Menlo Ventures 领投 $100M C 轮，使累计融资达到 $215M；J.P. Sanday 加入董事会。
          tone: positive
        - date: '2026-05-24'
          label: 临床结果白皮书
          detail: 发布证据显示，高风险患者参加 6+ 次预约后，减重效果高出 2.3x。
          tone: positive
    approximationNotes: 时间线事件来自公司主要公告、投资者报告及法律条款；早期里程碑的具体日期根据公告月份估算。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO008
      - CO009
      - CO010
      - CO012
  - id: FM001
    title: 公共触达指标，不是 TAM/SAM/SOM
    type: pyramid
    summary: 六项计量方式不同的公开指标展示分销与运营触达，不代表转化漏斗或市场价值。
    data:
      items:
        - label: 合同支付方触达
