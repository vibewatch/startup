companyProfile:
  summary: >-
    Nourish 是一家由 AI 赋能的虚拟代谢健康诊所，把注册营养师与覆盖保险的远程医疗服务连接起来，覆盖全美 50 个州。公司称大多数患者无需自付费用，并将这套接入支付方的交付模式与 App 互动、实验室检测和 AI
    辅助工作流结合。2026 年 5 月，Nourish 宣布由 Menlo Ventures 领投、规模为 $100 million 的 Series C，使已披露融资总额达到 $215
    million，但仍未披露收入、毛利率或准确的股权结构条款。
