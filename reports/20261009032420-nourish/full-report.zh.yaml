      - number: '3.4'
        title: 护城河持久性、切换壁垒与竞争脆弱性
        blocks:
          - type: paragraph
            body: >-
              Nourish 的竞争护城河依靠提供者网络规模、嵌入电子健康记录工作流和诊断数据积累，但也面临明显战略逆风 [CP004, CP014, CP015]。超过 6,000
              名关联注册营养师在集中治理和标准化仲裁条款下运营，使 Nourish 保有早期进入者难以复制的容量缓冲 [CP004, CP014]。把长期实验室趋势和临床记录接入医生转诊闭环，也提高了健康系统的切换壁垒
              [CP014, CP015]。不过，Nourish 存在多项竞争脆弱性 [CP006, CP013]。F6S 等第三方软件聚合商设置自动机器人筛查关卡，说明外部对消费者替代服务分发情况的可见性有限
              [CP013]。更关键的是，现有电子健康记录厂商和综合远程医疗整合商可能把虚拟营养师服务打包进医院现有许可，削弱独立服务的转诊速度 [CP006,
              CP014]。如果竞争性远程营养平台拿到相同的全州网络内收费表，差异化最终将取决于临床结果验证和 AI 可靠性，而不只是网络覆盖 [CP006, CP015]。
            claimRefs:
              - CP004
              - CP006
              - CP013
              - CP014
              - CP015
