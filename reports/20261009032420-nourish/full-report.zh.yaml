        - label: 地理可用性
          value: 50
          unit: U.S. states
          detail: 当前公司口径；没有州级利用率分母。
        - label: 零自付占比
          value: 94
          unit: percent of patients
          detail: 当前公司口径；测量期间及报销金额未披露。
        - label: 营养师网络
