  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Nourish 提供的是一套护理项目，而非独立软件工具：患者核验保险、选择注册营养师、参加虚拟评估，随后接受定期咨询和 App 内支持。当前官网称，问诊通常从每周或每两周一次开始，每次持续 50-60
              分钟；习惯稳定后可能改为每月一次。两次就诊之间，患者可以给营养师发消息、记录饮食、追踪进度，并使用食谱和教育资源。这种组合让软件成为人工临床交付周围的互动和管理层，而不是自主营养产品。这些工作流细节由公司提供，说明了预期体验的广度，但不能证明利用率、完成率、留存或相对疗效。提供者口径也需要核对：同一当前页面同时使用了“超过
              10,000 名提供者”和“9,000+ 名营养师”。
