              - CO003
              - CO005
      - number: '1.3'
        title: 资本化历史、规模指标与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Nourish 通过多轮机构融资累计获得 $215 million 风险资本 [CO001]。公司先由 J.P. Morgan Private Capital 的 Growth Equity Partners
              领投 $70 million Series B，Thrive Capital、Index Ventures 和 Y Combinator 共同参与；随后于 2026 年 5 月完成由 Menlo Ventures
              领投的 $100 million Series C，Maverick Ventures、BoxGroup、Atomico、Daybreak 和 Operator Partners 追加支持 [CO001,
              CO005]。尽管市场传闻和此前的追踪评论给出 $1.75 billion 的私人估值，Nourish 尚未公布 Series C 资本化的正式投后估值或优先权结构 [CO006,
              CO007]。规模指标显示患者量可观：Nourish 宣布覆盖超过 200 million 人，并通过网络内提供者协议让 94% 的患者无需自付 [CO001,
              CO004]。但年度经常性收入、每次咨询的实际报销额和单位毛利率等基础财务指标仍是未披露的私有数据，需要专门尽调 [CO006, CO007]。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO004
              - CO005
      - number: '1.4'
        title: 临床风险边界、支付方敞口与法律保障
        blocks:
          - type: paragraph
            body: >-
              作为由保险报销的虚拟服务提供者，Nourish 受联邦及州层面的严格监管框架约束，涵盖远程医疗、临床执照和企业行医规范
              [CO012]。公司明确将注册营养师服务限定在法定专业边界内的营养咨询，并说明远程医疗服务不取代主治医生诊断或急救医疗 [CO012]。此外，Nourish 要求服务用户依据 JAMS
              规则进行强制个人争议仲裁，并纳入集体诉讼放弃条款和 30 天退出期，以降低集体诉讼敞口 [CO012]。在代谢护理中，Nourish 将药物管理与行为咨询结合，以应对 GLP-1 受体激动剂的临床波动性
              [CO001, CO009]。Nourish 报告的数据显示，完成至少六次预约的患者，减重幅度达到仅参加一至两次者的二点三倍 [CO009]。外部搜索还出现了同名但无关的实体，例如印度植物基品牌 Nourish
              You，这进一步说明严格核验实体身份十分必要 [CO011]。
            claimRefs:
              - CO001
              - CO009
              - CO011
              - CO012
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本化与支付方接入优势
            body: >-
              Nourish 已通过拿下覆盖超过 200 million 人的主要商业及政府健康计划网络内合约，建立了明显的竞争差异化 [CO001, CO004]。凭借 $215 million 总股本以及 Menlo
              Ventures 和 J.P. Morgan 的领投支持，Nourish 拥有多年资本储备，可扩展自有 AI 临床副驾驶，并维持 W-2 临床雇佣模式，而竞争者仍依赖分散的合同工网络 [CO001,
              CO005]。
            calloutType: strength
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: callout
            title: 估值推测与私人财务不透明
            body: >-
              尽管市场传闻和此前投资者摘要提到 $1.75 billion 的投后估值，Nourish 官方 Series C 公告并未确认估值或清算优先权 [CO006,
              CO007]。由于年度收入、每次就诊实际报销额或临床毛利率均完全没有经审计披露，投资者必须把标题估值倍数视为未经验证的假设，直到财务文件确认 [CO006, CO007]。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
          - type: callout
            title: 临床范围边界与监管防御
            body: >-
              Nourish 在持证营养师营养咨询与医生医疗实践之间设定了明确的合同边界，明确排除急救医疗，并要求强制个人争议仲裁 [CO012]。这套结构将企业运营与医疗诊断相关的临床责任风险隔离开，同时把行为营养与第三方
              GLP-1 药物疗法结合起来 [CO001, CO012]。
            calloutType: insight
            claimRefs:
              - CO001
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Nourish 将自身服务定义为远程医疗平台，把患者连接至覆盖全美 50 个州的注册营养师（RDN）。当前官网介绍了保险核验、虚拟预约、定期咨询、App 消息、饮食记录和进度追踪；一份独立的 2025
              年简介也描述了类似模式：雇佣持证营养师、通过线上连接患者，并直接向保险公司收费 [CM001,
              CM007]。这些证据支持一个狭窄的市场边界：远程提供的临床营养咨询，以及让这类护理能够报销所需的软件和行政服务。它们不足以支持把蛋白质补充剂、包装食品、泛健康内容、处方药支出或食品营销服务纳入 Nourish
              的可服务市场。

              这一界定很重要，因为指定搜索池中有同名误报。两条保留结果涉及总部位于多伦多的 Nourish Food Marketing 及其食品、饮料和农业趋势报告，而不是美国远程医疗提供商 Nourish, Inc.
              [CM014]。另一家第三方目录正确将目标公司归类为提供保险覆盖虚拟营养护理的医院与医疗保健公司 [CM015]。现有证据没有量化患者选择 Nourish 而非医院门诊营养师、独立营养诊所、自费辅导或自助 App
              的频率。这些替代方案仍是重要尽调缺口，不能据此臆造市场份额 [CM016]。
            claimRefs:
              - CM001
              - CM007
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >
              最强的公开规模证据描述的是可及性和供给，而不是市场价值。Fierce Healthcare 报道称，截至 2025 年 4 月，Nourish 服务商业保险、Medicare 和 Medicaid 支付方，覆盖
              150 million 人，并在全美 50 个州服务数十万患者 [CM005, CM006]。Nourish 当前官网称 94% 的患者无需自付，报告拥有 9,000+ 名营养师的网络，并另行显示超过
              10,000 名服务提供者 [CM002, CM003, CM004]。这些数字说明分布广泛、患者支付阻力低，但覆盖人数不是注册用户，服务患者数不是活跃患者，提供者列表不是就诊容量，而这些指标都不是收入。

              要建立可辩护的自下而上模型，还需要符合条件的成员患病率、福利设计、转诊和预约率、每位患者完成的就诊次数、每次就诊的实际报销额、临床人员利用率和留存率。没有保留来源提供这些分母或可比的已披露收入基数
              [CM016]。因此，本章不把 150 million 覆盖人数换算成美元 TAM，也不把报告中的患者基数标为 SAM 或
              SOM。图表和规模表保留每项指标的期间、分母和限制；未解决的缺口则指出，要建立可用于投资的市场模型，还需要管理层数据。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: figure
            figureRef: FM001
