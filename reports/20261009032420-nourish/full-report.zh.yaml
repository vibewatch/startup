  - id: FI001
    title: 患者护理旅程与收入转化流程
    type: flow
    summary: 从患者保险核验、临床咨询到报销裁决，再到毛利率兑现的顺序流程。
    data:
      nodes:
        - id: patient-onboarding
          label: 保险核验与接入
          value: 94% $0 copay
          detail: 患者核验商业、Medicare 或 Medicaid 计划下的资格
        - id: clinical-encounter
          label: 远程医疗咨询
          value: 50-60 min visit
          detail: 由雇佣的 W-2 注册营养师通过 Zoom 提供
        - id: claim-generation
          label: AI 记录助手与理赔提交
          value: CPT Coding
          detail: AI 副驾生成临床文档并提交保险索赔主张
        - id: payer-adjudication
          label: 支付方裁决与 RCM
          value: Fee Schedule
          detail: 健康计划依据合同费率表处理保险索赔主张
        - id: reimbursement-collection
          label: 理赔收款与对账
          value: Net Cash
          detail: 收入周期团队核对保险付款并处理拒付
        - id: cash-realization
          label: 净利润获取
          value: COGS Deduction
          detail: 扣除 W-2 临床劳动力和平台管理费用后的净现金实现
      edges:
        - from: patient-onboarding
          to: clinical-encounter
        - from: clinical-encounter
          to: claim-generation
        - from: claim-generation
          to: payer-adjudication
        - from: payer-adjudication
          to: reimbursement-collection
        - from: reimbursement-collection
          to: cash-realization
    approximationNotes: 流程依据公司披露展示运营报销周期；未包括收款时点及拒付回流环节。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
  - id: FE001
    title: 有公开证据支持的护理交付栈
    type: stack
    summary: 证据支持分层护理工作流，但实施细节与控制有效性仍未经核实。
    data:
      layers:
        - label: 接入
          detail: 保险核验、寻找提供者、预约及保险索赔主张提交
        - label: 临床护理
          detail: 虚拟评估、个性化方案及持续的注册营养师咨询
        - label: 患者参与
          detail: 消息、饮食与宏量营养素跟踪、食谱、目标及进度
        - label: 健康数据
          detail: 实验室结果及公司声称的实验室与可穿戴设备整合
        - label: 营养师辅助
          detail: 用于记录和提供临床洞察的 AI 副驾
        - label: 控制边界
          detail: 仍需人工临床判断，因为 AI 输出可能不准确
    approximationNotes: 根据公开描述整理的概念性功能栈；不代表特定基础设施、供应商或数据流。
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 公开描述的患者旅程
    type: journey-map
    summary: 可观察旅程从保险核验延伸至灵活复诊和应用内支持；留存率与扩张率仍未披露。
    data:
      nodes:
        - label: 1. 核验保险
        - label: 2. 浏览并选择营养师
        - label: 3. 完成初次评估
        - label: 4. 初期每周或每两周会面
        - label: 5. 使用消息、饮食记录及进度跟踪
        - label: 6. 适当时转为每月复诊
    approximationNotes: 按 Nourish 首页所述步骤整理；不估算转化率、留存率、报销率或临床成功率。
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU008
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 综合风险矩阵，按影响与可能性维度映射法律、运营、支付方、临床及财务暴露。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 灾难性影响
          values:
            - Medicare/Medicaid 监管排除
            - 联邦 Wiretap 集体赔偿
            - 支付方大规模取消资质
        - label: 关键影响
          values:
            - 各州 CPOM 公司执法
            - W-2 利润反转
            - 主要支付方合同取消
        - label: 重大影响
          values:
            - AI 营养幻觉索赔
            - 第三方云基础设施中断
            - 营养师流失激增
        - label: 中等影响
          values:
            - 患者爽约造成的收入损失
            - Medicaid 扩张延期
            - 自付患者流失
        - label: 次要影响
          values:
            - 各州执照延误
            - 应用宏量营养素跟踪漏洞
            - 食品价格关税压力
        - label: 可忽略影响
          values:
            - 常规商标挑战
            - 轻微表单提交错误
            - 普通健康服务竞争
    approximationNotes: 风险位置反映作者对待决诉讼态势、已发布保障排除条款及 W-2 劳动力管理费用的综合判断。
    claimRefs:
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 投资立场决策逻辑
    type: flow
    summary: 将临床规模与估值拉伸连接至跟踪建议的决策链。
    data:
      nodes:
        - id: node-1
          label: 临床与网络规模：覆盖 50 个州、拥有 10,000+ 名 RDN，保障人口 200M
        - id: node-2
          label: 资本结构：$100M C 轮以 $1.75B 估值（$12.47/股）交割
        - id: node-3
          label: 数据缺口：缺乏已披露收入、ARR、毛利率及烧钱指标
        - id: node-4
          label: 法律暴露：联邦 Wiretap 与 CIPA 集体诉讼继续（Podraza v. Nourish）
        - id: node-5
          label: 估值立场：相对于已披露基本面，入场倍数偏高
        - id: node-6
          label: 最终建议：在收入证据与诉讼明确前保持跟踪
      edges:
        - from: node-1
          to: node-2
        - from: node-2
          to: node-3
        - from: node-3
          to: node-4
        - from: node-4
          to: node-5
        - from: node-5
          to: node-6
    approximationNotes: 将运营优势与治理风险映射至最终立场的示意性综合框架。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV012
      - CV013
