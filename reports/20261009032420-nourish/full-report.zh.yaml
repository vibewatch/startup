              雇用超过 10,000 名 W-2 注册营养师会带来大量固定及半可变工资负债。若要让毛利率接近软件式水平，Nourish 必须证明其自有 AI
              临床副驾驶和自动临床笔记能够在不损害临床质量或触发保险审计的情况下，显著提高每名营养师 FTE 的可计费就诊容量。
