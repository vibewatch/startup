      - number: '5.2'
        title: 运营与技术架构
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个三层运营模式。接入层负责保险核验、提供者发现、预约和保险索赔主张提交；临床层把患者连接至受雇注册营养师，支持评估、护理计划和随访；互动与数据层增加饮食和宏量营养素追踪、消息、食谱、进度视图、实验室检测和可穿戴设备整合。Nourish
              还描述了一个为营养师服务的 AI 副驾驶，可自动记录笔记并提示临床洞察。这是从客户工作流推断出的功能架构，而非经验证的软件栈图：指定资料池没有目标公司的 API
              文档、工程出版物、代码库、依赖清单或整合规范。因此，互操作深度、模型边界、数据血缘和运营控制仍是尽调事项，不能视为已确立的差异化。
