evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-unit-economics
    missingEvidence: >-
      Official post-money valuation, share price, liquidation preference terms, and cap table breakdown for the May 2026
      Series C round.
    whyItMatters: >-
      Without official equity terms, the reported $1.75 billion headline valuation cannot be confirmed against preferred
      liquidation overhang or capital structure risk.
    diligencePath: >-
      Request the Series C stock purchase agreement, cap table summary, and certificate of incorporation amendments from
      management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - id: gap-enumeration-leadership
    type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Comprehensive listing of all independent board directors, advisory committee members, and functional vice
      presidents.
    whyItMatters: Partial governance disclosure limits visibility into audit committee independence and clinical advisory oversight.
    diligencePath: >-
      Request full board of directors roster, board observer list, and executive leadership organization chart during
      management diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - id: gap-enumeration-stakeholders
    type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Comprehensive list of early-stage angel investors, debt/credit facility providers, and individual health plan
      contract agreements.
    whyItMatters: >-
      A partial stakeholder map leaves commercial concentration risks among specific payers and non-equity debt
      covenants unverified.
    diligencePath: Review master service agreements with top five health plan partners and request debt/credit facility schedules.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing-inputs
    missingEvidence: >-
      Eligible-member prevalence, benefit design, referral and booking conversion, completed visits, realized
      reimbursement, retention, and clinician utilization by payer segment.
    whyItMatters: >-
      Without these denominators, covered lives and cumulative patients cannot be converted into TAM, SAM, SOM, revenue,
      or market share.
    diligencePath: >-
      Request payer-segment cohorts and claims extracts, then reconcile eligible lives through completed visits and
      recognized revenue.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: provider-count
    missingEvidence: >-
      A dated reconciliation of 9,000-plus dietitians, 10,000-plus displayed providers, and the 3,000-plus
      employed-dietitian figure reported in April 2025.
    whyItMatters: >-
      Different definitions could materially change the interpretation of clinician supply, capacity, and operating
      leverage.
    diligencePath: >-
      Obtain a workforce bridge separating employed active RDNs, contracted clinicians, directory profiles, open
      profiles, and full-time equivalents.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-budget-and-contracting
    missingEvidence: >-
      Primary payer or employer contracts showing pricing unit, reimbursement schedule, covered diagnoses, authorization
      rules, and renewal terms.
    whyItMatters: >-
      The economic buyer is identifiable, but the budget mechanism and reimbursement durability determine adoption and
      market value.
    diligencePath: >-
      Review representative contracts and interview payer medical directors, benefits buyers, and revenue-cycle
      leadership.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: age-eligibility
    missingEvidence: >-
      A documented explanation of how the terms' adult-only eligibility language relates to the homepage's statement
      that Nourish dietitians work with children.
    whyItMatters: >-
      Pediatric users should not be included in an addressable population until consent, contracting, and service
      eligibility are clear.
    diligencePath: Request the pediatric service policy, guardian-consent flow, payer eligibility rules, and applicable entity terms.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-realization
    missingEvidence: >-
      Audited fee schedules, realized per-visit reimbursement rates, and employer PEPM pricing across competing virtual
      nutrition networks.
    whyItMatters: >-
      Without realized unit reimbursement and employer PEPM rates, comparative margin quality between Nourish and
      competitors like Foodsmart cannot be independently verified.
    diligencePath: Request anonymized health plan fee schedules and employer contract rate cards during management diligence.
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: provider-network-headcount
    missingEvidence: >-
      Reconciliation between LeadIQ's 1,001-5,000 corporate employee bracket, Toarn's 6,000+ W-2 registered dietitian
      estimate, and Nourish's marketing claim of 10,000+ providers.
    whyItMatters: >-
      Distinguishing internal corporate staff, dedicated W-2 clinicians, and 1099 contracted dietitians is critical for
      evaluating fixed labor overhead and gross margin durability versus asset-light digital platforms.
    diligencePath: Audit detailed payroll records and provider network credentialing rosters by employment classification.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: >-
      Audited gross margin percentage breaking out W-2 clinician payroll and telehealth delivery COGS from top-line
      reimbursement revenue.
    whyItMatters: >-
      Essential to determine whether Nourish achieves software-like unit economics or remains capped at low
      service-delivery gross margins.
    diligencePath: >-
      Request confidential historical income statements and clinician gross margin schedules under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current monthly operating cash burn, net operating loss, and cash balance following the $100M May 2026 Series C.
    whyItMatters: >-
      Directly impacts forward capital adequacy, runway length, and whether additional equity dilution will be required
      before break-even.
    diligencePath: Obtain quarterly cash flow statements, current cash balances, and budget forecasts from management.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: minor
    topic: claim-denial-rates
    missingEvidence: >-
      First-pass claim denial rate, final denial rate, and average days in accounts receivable (AR) across commercial
      and Medicare plans.
    whyItMatters: Revenue cycle management efficiency governs working capital requirements and bad-debt collection risk.
    diligencePath: Review billing audit reports, RCM aging buckets, and payer dispute logs during operational due diligence.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A target-company engineering artifact or practitioner source covering the product stack, integrations, deployment
      practices, or technical operations.
    whyItMatters: >-
      The assigned developer-signal candidates concern unrelated products and cannot validate implementation maturity or
      team execution.
    diligencePath: >-
      Request architecture documentation and engineering references, then verify a target-company repository, technical
      talk, integration guide, or practitioner discussion.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability
    missingEvidence: >-
      Current security certifications, privacy audit results, penetration-test summary, uptime history, incident log,
