company:
  name: "Nourish"
chapter:
  number: 4
  title: "Financials"
  summary: "Nourish operates an insurance-reimbursed telenutrition model where 94% of patients pay $0 out of pocket, driving rapid top-line growth to an estimated $160M run-rate alongside its $100M May 2026 Series C at a $1.75B–$1.8B valuation. However, because care delivery relies on thousands of W-2 registered dietitians and ongoing revenue cycle management overhead, gross margins remain constrained relative to software peers, and private metrics covering cash burn, net collections, and realized contribution margins remain critical underwriting gaps."
sections:
  - id: "revenue-model-and-payer-reimbursement"
    title: "Revenue Model, Payer Mix, and Reimbursement Dynamics"
    body: "Nourish monetizes primary care and chronic disease nutrition counseling through commercial health plans, Medicare, and Medicaid rather than consumer cash subscriptions or software license fees. The company reports partnering with national and regional health plans covering hundreds of millions of commercial and government lives across all 50 states, allowing 94% of active patients to access care with zero out-of-pocket costs. Under this third-party reimbursement mechanism, revenue realization depends directly on medical claim adjudication, fee-for-service coding (predominantly Medical Nutrition Therapy CPT codes), and network participation agreements. While Multiples.vc records estimated annual run-rate revenue expanding from $23M around the April 2025 Series B to $160M at the May 2026 Series C, and Latka separately estimated 2024 revenue at $111.9M, Nourish does not publish audited financial statements, net collection percentages, or payer concentration figures. Furthermore, the company's arbitration and terms of service designate patient responsibility for unpaid medical balances, yet consumer collection rates for non-covered clinical services remain undisclosed."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Delivery Cost Structure, and Margin Drivers"
    body: "Unlike pure digital health software platforms that exhibit software gross margins exceeding 75%, Nourish operates a labor-intensive hybrid care model utilizing employed W-2 Registered Dietitian Nutritionists (RDNs). The company expanded its clinical workforce from over 3,000 W-2 RDNs in April 2025 to over 10,000 providers by May 2026, creating fixed and semi-variable payroll commitments, healthcare benefits, and employer payroll tax obligations that scale alongside patient visit volumes. Delivery costs also encompass specialized revenue cycle management (RCM) teams, clinical credentialing across 50 state jurisdictions, provider onboarding, and telehealth infrastructure. Operating commentary highlights that while Nourish deploys an AI copilot to automate clinical note-taking and eliminate administrative chart work, dietitian direct labor remains the primary cost of goods sold. Consequently, contribution margins are highly sensitive to clinician appointment utilization, patient no-show rates, billing denial rates, and medical chart auditing overhead. In the absence of disclosed gross margins, comparable provider-heavy digital clinic models suggest gross margins hover between 35% and 55%."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy, Forward Runway, and Diligence Underwriting Blockers"
    body: "With $100M in fresh primary growth equity secured in May 2026 led by Menlo Ventures, Nourish's cumulative equity capital raised reached $213M to $215M across five priced rounds. This substantial cash infusion provides near-term capital adequacy and funding runway to expand its dietitian network, establish Nourish Labs diagnostic partnerships, and pilot physician-led metabolic medical services. However, independent financial commentary notes that pricing Nourish at $1.75B to $1.8B—implying a 10.9x multiple on estimated $160M revenue—requires treating Nourish as high-margin scalable metabolic infrastructure rather than a standard care-delivery clinic. Publicly traded comps such as Omada Health, Teladoc, and LifeStance trade at multiples between 0.5x and 3.7x revenue, reflecting market skepticism regarding labor-heavy care models. Key underwriting blockers for institutional investors include unconfirmed monthly cash burn, customer acquisition cost (CAC) payback across direct consumer versus health-system referral funnels, and pending litigation liabilities such as the Podraza v. Nourish wiretapping lawsuit that could enforce structural compliance overhead."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
