callouts:
  - calloutType: "risk"
    title: "Valuation Multiple Premium Versus Public Care Delivery Peers"
    body: "At a $1.75B to $1.8B post-money valuation on estimated $160M run-rate revenue, Nourish commands an implied revenue multiple of roughly 10.9x. In contrast, public digital health platforms with human care delivery (such as Omada Health at 3.7x revenue, LifeStance at 2.0x, and Teladoc at 0.5x) trade at substantial discounts due to labor constraints and margin drag. Underwriting this valuation requires evidence of software-like operating leverage that is not yet verified in public data."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
  - calloutType: "insight"
    title: "Operating Leverage Dependent on AI Clinician Productivity"
    body: "Employing over 10,000 W-2 registered dietitians creates significant fixed and semi-variable payroll liabilities. To expand gross margins toward software-like levels, Nourish must prove that its proprietary AI clinical copilot and automated administrative note-taking materially increase billable encounter capacity per dietitian FTE without deteriorating clinical quality or triggering insurance audit scrutiny."
    claimRefs:
      - "CI007"
      - "CI009"
      - "CI010"
