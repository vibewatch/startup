companyProfile:
  summary: >-
    Nourish is an AI-enabled virtual metabolic-health clinic that pairs registered dietitians with insurance-covered
    telehealth care across all 50 states. The company says most patients pay nothing out of pocket, and it pairs that
    payer-integrated delivery model with app-based engagement, labs, and AI-assisted workflows. In May 2026 Nourish
    announced a $100 million Series C led by Menlo Ventures, bringing total disclosed funding to $215 million, but it
    still does not disclose revenue, gross margin, or exact cap-table terms.
