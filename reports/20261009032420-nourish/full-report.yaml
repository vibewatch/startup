      - number: '6.3'
        title: Retention, concentration, and trust gaps
        blocks:
          - type: paragraph
            body: >
              Nourish describes a flexible care cadence: most patients initially meet a dietitian weekly or biweekly and
              may later move to monthly check-ins, with no minimum engagement or commitment [CU006, CU007]. That
              flexibility may reduce adoption friction, but the assigned evidence does not disclose gross or net revenue
              retention, patient churn, renewals, average completed visits, cohort duration, reactivation, or contract
              length. The journey is therefore observable, while its durability and economics are not. Company-reported
              outcomes among patients reaching 12 months cannot establish retention without the starting cohort and
              completion denominator.


              Concentration is similarly unresolved. A 150-million-covered-life footprint indicates distribution
              breadth, but it does not show how many members use Nourish or how collections are distributed across
              payers [CU004]. Customer trust also warrants diligence: a July 2026 commercial legal analysis reported
              that federal Wiretap Act and California Invasion of Privacy Act claims in Podraza v. Nourish survived an
              April 2026 motion to dismiss, while noting that other claims were dismissed [CU015]. This is an
              allegation-stage litigation signal, not proof of liability or a recorded customer-loss event. Three
              allocated net-new search results concerned unrelated organizations using the word "Nourish," underscoring
              that the evidence pool itself cannot fill these customer-data gaps [CU016].
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Coverage breadth is not active adoption
            body: >
              The 150 million covered-lives figure describes potential insurance reach, while "hundreds of thousands"
              describes patients served as of April 2025. Neither metric supplies a current active-user denominator,
              repeat-visit rate, or payer concentration.
            calloutType: insight
            claimRefs:
              - CU003
