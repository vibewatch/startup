      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              The care-delivery surface appears commercially deployed rather than conceptual: Nourish says it operates
              in all 50 states, and its April 2025 announcement reported hundreds of thousands of patients and more than
              3,000 W-2 dietitians at that time. A low-reputation third-party profile reports that Nourish Labs began
              offering free cardiometabolic lab testing integrated into care in January 2026; this should be verified
              directly before underwriting. The most credible product differentiation in the pool is the combination of
              payer administration, a large clinician network, longitudinal app engagement, labs and wearables, and
              clinician-facing AI. However, none of the retained sources provides an independent benchmark for
              implementation speed, clinician productivity, patient engagement, accuracy, uptime, or integration
              quality. Scale claims therefore evidence commercial breadth, not technical superiority.
            claimRefs:
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: Trust, reliability, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Nourish's terms provide the clearest controls and limitations in the assigned pool. Users must safeguard
              credentials, including multi-factor authentication, and notify the company of suspected unauthorized
              access. The same terms warn that AI outputs may be incomplete, outdated, or inaccurate and must not
              replace licensed clinical judgment; they also describe telehealth limitations and disclaim uninterrupted
              or error-free service. These disclosures appropriately bound the product promise, but they are not
              evidence of control effectiveness. The pool supplies no target-company security certification, privacy
              audit, status history, incident record, model evaluation, or developer artifact. Three net-new job sources
              concern the unrelated UK company Nourish Care, while another "Nourish" design case concerns a Scale Social
              food-sharing prototype. They are useful only for identifying source contamination and cannot close the
              target company's developer-signal gap.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
