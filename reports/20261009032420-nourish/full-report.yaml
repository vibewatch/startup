chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Care Model, and Founding Milestones
        blocks:
          - type: paragraph
            body: >-
              Nourish operates as an AI-native virtual metabolic and chronic disease clinic connecting patients directly
              with licensed registered dietitians under in-network health insurance coverage [CO001]. Founded in 2021 by
              Chief Executive Officer Aidan Dewar, President and Chief Operating Officer Sam Perkins, and Stephanie Liu,
              the company was established to address nutrition-related chronic illness—such as diabetes, prediabetes,
              and obesity—through clinical lifestyle intervention [CO003, CO005]. Rather than treating nutrition as an
              adjunctive recommendation, Nourish structures dietary care as a frontline medical discipline integrated
              into commercial, Medicare, and Medicaid health plans [CO001, CO004]. The platform provides virtual
              consultations, continuous in-app chat, macro and symptom tracking, and physician-coordinated lab testing
              [CO001, CO004]. By combining dietitian consultations with proprietary artificial intelligence tools,
              Nourish aims to bend the healthcare cost curve through sustained patient behavior modification [CO001,
              CO002]. Operating from headquarters in New York, NY, Nourish delivers services nationwide across all 50
              states [CO001, CO004].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
