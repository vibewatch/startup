  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Nourish presents a care program rather than a standalone software tool: patients verify insurance, select
              a registered dietitian, attend a virtual assessment, and continue with recurring counseling plus in-app
              support. The current homepage says sessions usually begin weekly or biweekly, last 50-60 minutes, and may
              become monthly as habits stabilize. Between visits, patients can message their dietitian, log meals, track
              progress, and use recipes and educational resources. That combination makes the software an engagement and
              administration layer around human clinical delivery, not an autonomous nutrition product. These workflow
              details are company-issued and show breadth of the intended experience, but they do not establish
              utilization, completion, retention, or comparative efficacy. The provider surface also needs
              reconciliation: the same current page uses both "over 10,000 providers" and "9,000+ dietitians."
            claimRefs:
