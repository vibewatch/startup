        title: Exhibits
        blocks:
          - type: callout
            title: Human care and software form one product
            body: >-
              Nourish's customer journey ties insurance administration and longitudinal software engagement to recurring
              registered-dietitian care, creating a broader service surface than an appointment marketplace alone.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Public technical proof remains thin
            body: >-
              The assigned evidence describes product functions but does not independently establish architecture,
              security certification, uptime, integration quality, AI accuracy, or roadmap delivery.
            calloutType: risk
            claimRefs:
              - CE009
