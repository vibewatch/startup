      - number: '6.2'
        title: Adoption signals and customer proof
        blocks:
          - type: paragraph
            body: >
              Public scale signals are meaningful but not directly comparable. Fierce Healthcare reported "hundreds of
              thousands" of patients and 150 million covered lives in April 2025, while the current homepage states
              nationwide availability and more than 9,000 dietitians [CU001, CU002, CU004, CU005]. The first is an
              imprecise patient-volume description, the second is a payer eligibility ceiling, and the third is provider
              capacity. None supplies a current active-patient denominator, visit volume, repeat-use rate, or
              year-over-year growth calculation. The homepage separately claims 8% average weight loss after 12 months
              for patients not taking GLP-1s, but provides no cohort size, attrition rate, comparator, or independent
              replication in the assigned text [CU013].


              Named proof is limited to company-selected patient testimonials. Bianca G. reports a 40-pound loss and a
              return to a normal hemoglobin A1c level after a year; Emily G. describes the benefit of individualized
              solutions; and Brandon M. says the counseling helped him build a practical diet for gastrointestinal
              health and gout concerns [CU010, CU011, CU012]. These examples show plausible use cases and sustained
              engagement, but they are not independently verified customer references. No assigned source provides full
              names, medical records, payer confirmation, enterprise deployment status, or a representative denominator
              for positive and negative outcomes.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU010
              - CU011
              - CU012
              - CU013
