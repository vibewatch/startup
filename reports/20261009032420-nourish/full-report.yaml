              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
      - number: '4.2'
        title: Unit Economics, Delivery Cost Structure, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Unlike pure digital health software platforms that exhibit software gross margins exceeding 75%, Nourish
              operates a labor-intensive hybrid care model utilizing employed W-2 Registered Dietitian Nutritionists
              (RDNs). The company expanded its clinical workforce from over 3,000 W-2 RDNs in April 2025 to over 10,000
              providers by May 2026, creating fixed and semi-variable payroll commitments, healthcare benefits, and
              employer payroll tax obligations that scale alongside patient visit volumes. Delivery costs also encompass
              specialized revenue cycle management (RCM) teams, clinical credentialing across 50 state jurisdictions,
              provider onboarding, and telehealth infrastructure. Operating commentary highlights that while Nourish
              deploys an AI copilot to automate clinical note-taking and eliminate administrative chart work, dietitian
              direct labor remains the primary cost of goods sold. Consequently, contribution margins are highly
              sensitive to clinician appointment utilization, patient no-show rates, billing denial rates, and medical
              chart auditing overhead. In the absence of disclosed gross margins, comparable provider-heavy digital
              clinic models suggest gross margins hover between 35% and 55%.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
