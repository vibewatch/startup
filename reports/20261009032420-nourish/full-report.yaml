      - number: '4.3'
        title: Capital Adequacy, Forward Runway, and Diligence Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              With $100M in fresh primary growth equity secured in May 2026 led by Menlo Ventures, Nourish's cumulative
              equity capital raised reached $213M to $215M across five priced rounds. This substantial cash infusion
              provides near-term capital adequacy and funding runway to expand its dietitian network, establish Nourish
              Labs diagnostic partnerships, and pilot physician-led metabolic medical services. However, independent
              financial commentary notes that pricing Nourish at $1.75B to $1.8B—implying a 10.9x multiple on estimated
              $160M revenue—requires treating Nourish as high-margin scalable metabolic infrastructure rather than a
              standard care-delivery clinic. Publicly traded comps such as Omada Health, Teladoc, and LifeStance trade
              at multiples between 0.5x and 3.7x revenue, reflecting market skepticism regarding labor-heavy care
              models. Key underwriting blockers for institutional investors include unconfirmed monthly cash burn,
              customer acquisition cost (CAC) payback across direct consumer versus health-system referral funnels, and
              pending litigation liabilities such as the Podraza v. Nourish wiretapping lawsuit that could enforce
              structural compliance overhead.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Multiple Premium Versus Public Care Delivery Peers
            body: >-
              At a $1.75B to $1.8B post-money valuation on estimated $160M run-rate revenue, Nourish commands an implied
              revenue multiple of roughly 10.9x. In contrast, public digital health platforms with human care delivery
              (such as Omada Health at 3.7x revenue, LifeStance at 2.0x, and Teladoc at 0.5x) trade at substantial
              discounts due to labor constraints and margin drag. Underwriting this valuation requires evidence of
              software-like operating leverage that is not yet verified in public data.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Operating Leverage Dependent on AI Clinician Productivity
            body: >-
              Employing over 10,000 W-2 registered dietitians creates significant fixed and semi-variable payroll
              liabilities. To expand gross margins toward software-like levels, Nourish must prove that its proprietary
              AI clinical copilot and automated administrative note-taking materially increase billable encounter
              capacity per dietitian FTE without deteriorating clinical quality or triggering insurance audit scrutiny.
            calloutType: insight
            claimRefs:
              - CI007
              - CI009
