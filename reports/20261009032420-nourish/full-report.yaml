      - number: '5.2'
        title: Operating and technology architecture
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a three-layer operating model. An access layer handles insurance verification,
              provider discovery, booking, and claim submission. A clinical layer connects patients with employed
              registered dietitians and supports assessment, care planning, and follow-up. An engagement and data layer
              adds meal and macro tracking, messaging, recipes, progress views, labs, and wearable integrations. Nourish
              also describes an AI copilot for dietitians that automates note-taking and surfaces clinical insights.
              This is a functional architecture inferred from the customer workflow, not a verified software-stack
              diagram: the assigned pool contains no target-company API documentation, engineering publication,
              repository, dependency inventory, or integration specification. Consequently, interoperability depth,
              model boundaries, data lineage, and operational controls remain diligence items rather than established
              differentiation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
