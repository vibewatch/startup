          value: 150
          unit: million covered lives
          detail: Reported in April 2025 across commercial, Medicare, and Medicaid payers; not active patients.
        - label: Geographic availability
          value: 50
          unit: U.S. states
          detail: Current company claim; no state-level utilization denominator.
        - label: Zero out-of-pocket share
          value: 94
          unit: percent of patients
