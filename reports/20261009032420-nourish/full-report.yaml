figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of Nourish founding, major financing rounds, network scaling, and clinical program
      launches.
    data:
      items:
        - date: '2021-01-01'
          label: Company Founding
          detail: >-
            Aidan Dewar, Sam Perkins, and Stephanie Liu launch Nourish to provide insurance-covered nutrition
            counseling.
          tone: positive
        - date: '2023-06-30'
          label: Clinical Network Expansion
          detail: Workforce scales to over 400 personnel as nationwide payer contracts begin onboarding.
          tone: neutral
        - date: '2024-03-15'
          label: $70M Series B Financing
          detail: >-
            J.P. Morgan Growth Equity Partners leads $70M round with Index Ventures and Thrive Capital to expand AI
            infrastructure.
          tone: positive
        - date: '2024-11-01'
          label: GLP-1 Specialized Care Program
          detail: Nourish launches targeted clinical pathways to support patients initiating or discontinuing GLP-1 therapy.
          tone: positive
        - date: '2025-12-29'
          label: Corporate Terms of Use Update
          detail: Establishes mandatory individual arbitration under JAMS rules and formal AI feature disclaimer terms.
          tone: warning
        - date: '2026-01-15'
          label: Nourish Labs Launch
          detail: Introduces free integrated cardiometabolic lab testing into ongoing dietitian virtual care.
          tone: positive
        - date: '2026-03-31'
          label: Global Headcount Milestone
          detail: Revelio Labs records global workforce surpassing 4,000 personnel across corporate and clinical functions.
          tone: neutral
        - date: '2026-05-19'
          label: $100M Series C Financing
          detail: Menlo Ventures leads $100M Series C bringing total capital raised to $215M; J.P. Sanday joins board.
          tone: positive
        - date: '2026-05-24'
          label: Clinical Outcomes Whitepaper
          detail: Releases evidence demonstrating 2.3x greater weight loss for high-acuity patients attending 6+ appointments.
          tone: positive
