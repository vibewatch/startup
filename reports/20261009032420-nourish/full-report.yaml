  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and payer structure
        blocks:
          - type: paragraph
            body: >
              The clearest public segment is the individual U.S. patient who uses virtual dietitian care. Nourish says
              it is available in all 50 states through a network of more than 9,000 dietitians, and its terms limit use
              of the services to adults residing in the United States or its territories [CU001, CU002, CU014]. Payment
              is frequently intermediated by insurance: Nourish says 94% of patients pay nothing out of pocket, while
              Fierce Healthcare reported in April 2025 that the company worked with commercial, Medicare, and Medicaid
              payers covering 150 million lives [CU003, CU004]. Covered lives are an eligibility footprint, not an
              active-customer count, and neither source discloses payer mix or realized reimbursement.


              Fierce Healthcare also reported an enterprise offering for health systems and employers, but executives
              had not publicly named partners at that time [CU009]. Public evidence therefore supports three roles
              rather than a simple customer count: patients are users, insurers can fund care, and health systems or
              employers may be organizational buyers or channels. The assigned evidence does not establish how revenue
              divides among these groups, whether any enterprise relationship is a pilot or production deployment, or
              whether a small number of payers or channel partners account for a material share of collections.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
