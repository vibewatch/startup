      severity: material
      topic: market-sizing-inputs
      missingEvidence: "Eligible-member prevalence, benefit design, referral and booking conversion, completed visits, realized reimbursement, retention, and clinician utilization by payer segment."
      whyItMatters: "Without these denominators, covered lives and cumulative patients cannot be converted into TAM, SAM, SOM, revenue, or market share."
      diligencePath: "Request payer-segment cohorts and claims extracts, then reconcile eligible lives through completed visits and recognized revenue."
      relatedQuestionRefs:
        - QM002
        - QM008
      relatedTableRefs:
        - TM002
    - type: conflicting-data
      severity: material
      topic: provider-count
      missingEvidence: "A dated reconciliation of 9,000-plus dietitians, 10,000-plus displayed providers, and the 3,000-plus employed-dietitian figure reported in April 2025."
      whyItMatters: "Different definitions could materially change the interpretation of clinician supply, capacity, and operating leverage."
      diligencePath: "Obtain a workforce bridge separating employed active RDNs, contracted clinicians, directory profiles, open profiles, and full-time equivalents."
      relatedQuestionRefs:
        - QM007
        - QM008
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: buyer-budget-and-contracting
      missingEvidence: "Primary payer or employer contracts showing pricing unit, reimbursement schedule, covered diagnoses, authorization rules, and renewal terms."
      whyItMatters: "The economic buyer is identifiable, but the budget mechanism and reimbursement durability determine adoption and market value."
      diligencePath: "Review representative contracts and interview payer medical directors, benefits buyers, and revenue-cycle leadership."
      relatedQuestionRefs:
        - QM003
        - QM004
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: minor
      topic: age-eligibility
      missingEvidence: "A documented explanation of how the terms' adult-only eligibility language relates to the homepage's statement that Nourish dietitians work with children."
      whyItMatters: "Pediatric users should not be included in an addressable population until consent, contracting, and service eligibility are clear."
      diligencePath: "Request the pediatric service policy, guardian-consent flow, payer eligibility rules, and applicable entity terms."
      relatedQuestionRefs:
        - QM006
