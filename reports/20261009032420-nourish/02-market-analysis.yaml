company:
  name: Nourish
chapter:
  number: 2
  title: Market Analysis
  summary: Nourish's evidence-supported market is U.S. insurance-covered virtual nutrition counseling delivered by registered dietitians, not the much broader consumer nutrition, food, or supplement market. Public sources establish national reach and payer access, but they do not disclose utilization, reimbursement, retention, or revenue inputs sufficient for a defensible TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market Boundary and Status-Quo Alternatives
    body: |
      Nourish defines its service as a telehealth platform connecting patients with Registered Dietitian Nutritionists (RDNs) in all 50 states. Its current homepage describes insurance verification, virtual appointments, recurring counseling, app-based messaging, meal logging, and progress tracking; an independent 2025 profile similarly describes a model that hires licensed dietitians, connects them to patients virtually, and bills insurers directly [CM001, CM007]. That evidence supports a narrow market boundary: remotely delivered clinical nutrition counseling and the software and administrative services needed to make that care reimbursable. It does not support including protein supplements, packaged food, generic wellness content, prescription drug spend, or food-marketing services in Nourish's addressable market.

      This distinction matters because the assigned search pool contains same-name false positives. Two retained results concern Toronto-based Nourish Food Marketing and its food, beverage, and agriculture trend report, not Nourish, Inc., the U.S. telehealth provider [CM014]. Another third-party directory correctly classifies the target as a hospitals-and-health-care company offering insurance-covered virtual nutrition care [CM015]. The evidence does not quantify how often patients choose Nourish instead of hospital outpatient dietitians, independent dietetic practices, cash-pay coaching, or self-directed apps. Those alternatives remain a material diligence gap rather than a basis for invented market shares [CM016].
    claimRefs:
      - CM001
      - CM007
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM001
  - id: evidence-constrained-sizing
    title: Evidence-Constrained Sizing
    body: |
      The strongest public sizing evidence describes access and supply, not market value. Fierce Healthcare reported in April 2025 that Nourish worked with commercial, Medicare, and Medicaid payers covering 150 million lives and served hundreds of thousands of patients across all 50 states [CM005, CM006]. Nourish's current homepage says 94% of patients pay nothing out of pocket, reports a network of 9,000-plus dietitians, and separately displays more than 10,000 providers [CM002, CM003, CM004]. These figures indicate broad distribution and low patient payment friction, but covered lives are not enrolled users, patients served are not active patients, provider listings are not visit capacity, and none of these measures is revenue.

      A defensible bottom-up model would require eligible-member prevalence, benefit design, referral and booking rates, completed visits per patient, realized reimbursement per visit, clinician utilization, and retention. No retained source provides those denominators or a comparable disclosed revenue base [CM016]. Accordingly, this chapter does not convert 150 million covered lives into a dollar TAM or label the reported patient base as SAM or SOM. The figure and sizing table preserve each metric's period, denominator, and limitation, while the unresolved gap identifies the management data required to produce an investable market model.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM016
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-user-payer
    title: Buyer, User, Payer, and Adoption Path
    body: |
      The patient is the user and care recipient, but frequently not the economic payer. The company says it verifies insurance and submits claims, while Fierce Healthcare reports relationships with commercial plans, Medicare, and Medicaid [CM004, CM005]. Forbes attributes the founding insight to long-standing medical nutrition therapy coverage that remained underused because of access and awareness, suggesting that discovery, referral, benefit verification, and provider availability are adoption bottlenecks even where a benefit exists [CM008]. The same reporting describes Nourish's direct-insurance-billing model, which shifts the purchase path away from a conventional consumer subscription [CM007].

      The enterprise route is less transparent. Fierce Healthcare reported an offering for health systems and employers in April 2025, but said partner identities had not yet been announced [CM009]. The public pool does not disclose whether those buyers pay per eligible member, per enrolled member, per visit, through claims, or through another contract form. Clinicians are another essential market participant: Nourish's executive described a W2 employment model as useful for benefits, quality management, outcomes, and cost control [CM011]. This structure may improve clinical governance, but its labor economics and effect on gross margin cannot be quantified from the retained evidence.
    claimRefs:
      - CM004
      - CM005
      - CM007
      - CM008
      - CM009
      - CM011
    tableRefs:
      - TM003
  - id: drivers-and-constraints
    title: Growth Drivers, Adoption Constraints, and Diligence Implications
    body: |
      Two evidence-backed demand signals are reimbursement access and GLP-1-related care needs. Forbes reported that medical nutrition therapy coverage has existed since the early 2000s but was not widely used because of access and awareness [CM008]. Fierce Healthcare reported a 2024 Nourish survey of more than 3,700 people: one-fifth were current GLP-1 users, 9% had used the drugs previously, and one-third of never-users were interested in trying them [CM010]. This is a company survey reported by trade media, not an independent estimate of the national market, but it supports GLP-1 nutrition support as a demand hypothesis worth testing.

      Constraints are equally material. Nourish's terms limit the services to adults residing in the United States or its territories, while its homepage also says its dietitians work with children; eligibility and contracting rules therefore need clarification before pediatric demand is counted [CM012]. A commercial consent vendor reports that federal Wiretap Act and California CIPA claims in Podraza v. Nourish survived an April 2026 motion-to-dismiss ruling, while other claims were dismissed; this is an adverse secondary account of pending litigation, not a final liability finding [CM013]. Buyer budgets, reimbursement durability, privacy controls, provider utilization, and conversion from covered lives to completed longitudinal care remain the variables most likely to change adoption timing and valuation [CM016].
    claimRefs:
      - CM008
      - CM010
      - CM012
      - CM013
      - CM016
