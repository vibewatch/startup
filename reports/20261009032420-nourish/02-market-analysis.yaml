  - id: FM001
    title: Public Reach Indicators, Not TAM/SAM/SOM
    type: pyramid
    summary: Six differently denominated public indicators show distribution and operating reach without implying a conversion funnel or market value.
    data:
      items:
        - label: Contracted payer reach
          value: 150
          unit: million covered lives
          detail: "Reported in April 2025 across commercial, Medicare, and Medicaid payers; not active patients."
        - label: Geographic availability
          value: 50
          unit: U.S. states
          detail: "Current company claim; no state-level utilization denominator."
        - label: Zero out-of-pocket share
          value: 94
          unit: percent of patients
          detail: "Current company claim; measurement period and reimbursement value are not disclosed."
        - label: Dietitian network
          value: 9000
          unit: dietitians, lower bound
          detail: "Current FAQ states 9,000+; this is not an employed-FTE or capacity measure."
        - label: Provider directory
          value: 10000
          unit: providers, lower bound
          detail: "The same current page displays 10,000+ providers, creating a definition or timing conflict."
        - label: Employed RDN base
          value: 3000
          unit: dietitians, lower bound
          detail: "Reported by Fierce Healthcare in April 2025; not necessarily comparable with current directory counts."
    approximationNotes: "Plus signs are represented as stated lower bounds. The six metrics use different populations, vintages, and units and must not be multiplied, added, or treated as funnel stages."
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
callouts:
  - calloutType: insight
    title: Covered Lives Are Distribution, Not Market Revenue
    body: The reported 150 million covered lives establish payer reach, while the 94% zero-out-of-pocket claim suggests limited patient payment friction. Neither metric reveals eligibility, utilization, reimbursement, visit cadence, retention, or revenue, so neither should be presented as TAM, SAM, SOM, or ARR.
    claimRefs:
      - CM004
      - CM005
      - CM016
  - calloutType: risk
    title: Evidence Pool Cannot Support a Dollar Market Size
    body: The retained pool has no independent market-spend series, claims-volume dataset, reimbursement schedule tied to Nourish's mix, or disclosed unit economics. Same-name food and supplement results cannot fill that gap; management data and payer evidence are required before valuation should rely on market-size arithmetic.
    claimRefs:
      - CM014
      - CM016
