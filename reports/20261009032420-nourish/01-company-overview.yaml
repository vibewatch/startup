chapter:
  number: 1
  title: "Company Overview"
  summary: "Nourish is an AI-enabled virtual metabolic health clinic pairing registered dietitians with insurance-covered telehealth care. In May 2026, the company announced a $100 million Series C led by Menlo Ventures, bringing total disclosed funding to $215 million, while key valuation terms and gross margins remain undisclosed."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Care Model, and Founding Milestones"
    body: "Nourish operates as an AI-native virtual metabolic and chronic disease clinic connecting patients directly with licensed registered dietitians under in-network health insurance coverage [CO001]. Founded in 2021 by Chief Executive Officer Aidan Dewar, President and Chief Operating Officer Sam Perkins, and Stephanie Liu, the company was established to address nutrition-related chronic illness—such as diabetes, prediabetes, and obesity—through clinical lifestyle intervention [CO003, CO005]. Rather than treating nutrition as an adjunctive recommendation, Nourish structures dietary care as a frontline medical discipline integrated into commercial, Medicare, and Medicaid health plans [CO001, CO004]. The platform provides virtual consultations, continuous in-app chat, macro and symptom tracking, and physician-coordinated lab testing [CO001, CO004]. By combining dietitian consultations with proprietary artificial intelligence tools, Nourish aims to bend the healthcare cost curve through sustained patient behavior modification [CO001, CO002]. Operating from headquarters in New York, NY, Nourish delivers services nationwide across all 50 states [CO001, CO004]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-governance-and-talent"
    title: "Leadership Structure, Governance, and Workforce Architecture"
    body: "Executive leadership at Nourish is anchored by Co-Founder and Chief Executive Officer Aidan Dewar alongside Co-Founder, President, and Chief Operating Officer Sam Perkins [CO003, CO005]. In governance, institutional representation expanded following the May 2026 Series C financing round, when Menlo Ventures Partner J.P. Sanday formally joined Nourish’s board of directors [CO001]. Previous institutional governance backing includes participation from Growth Equity Partners at J.P. Morgan Private Capital, led by Co-Managing Partner Paris Heymann [CO005]. On the operational front, Nourish employs registered dietitians through a W-2 employment model to maintain clinical standards, provider retention, and care coordination [CO004, CO005]. External workforce intelligence from Revelio Labs recorded approximately 4,082 total global employees as of March 2026, while company disclosures cite a clinical network exceeding 10,000 affiliated providers [CO001, CO008]. This numerical divergence highlights key structural distinctions between direct W-2 corporate staff, W-2 clinical staff, and broad network affiliations [CO008]."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale-metrics"
    title: "Capitalization History, Scale Metrics, and Evidence Gaps"
    body: "Nourish has accumulated $215 million in cumulative venture capital financing across multiple institutional rounds [CO001]. The company raised a $70 million Series B round led by J.P. Morgan Private Capital’s Growth Equity Partners, alongside Thrive Capital, Index Ventures, and Y Combinator, followed by a $100 million Series C round in May 2026 led by Menlo Ventures with additional backing from Maverick Ventures, BoxGroup, Atomico, Daybreak, and Operator Partners [CO001, CO005]. Despite market speculation and prior tracking commentary indicating a $1.75 billion private valuation, Nourish has not published an official post-money valuation or preference structure for its Series C capitalization [CO006, CO007]. Scale indicators demonstrate significant patient volume, with Nourish announcing coverage access across more than 200 million lives and maintaining in-network provider agreements enabling 94% of patients to pay zero dollars out-of-pocket [CO001, CO004]. Nevertheless, foundational financial metrics including annual recurring revenue, realized reimbursement per consultation, and unit gross margin remain undisclosed private data points requiring dedicated diligence review [CO006, CO007]."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO003"
  - id: "risk-governance-and-regulatory-posture"
    title: "Clinical Risk Boundaries, Payer Exposure, and Legal Safeguards"
    body: "As an insurance-reimbursed virtual provider, Nourish operates under strict federal and state regulatory frameworks governing telehealth, clinical licensure, and corporate practice of medicine [CO012]. The company explicitly scopes its registered dietitian services to nutritional counseling within statutory professional boundaries, establishing that telehealth services do not replace primary physician diagnosis or emergency medical care [CO012]. Furthermore, Nourish binds service users to mandatory individual dispute arbitration under JAMS rules, incorporating a class action waiver and thirty-day opt-out provision to mitigate collective litigation exposure [CO012]. In metabolic care, Nourish addresses the clinical volatility of GLP-1 receptor agonists by pairing pharmaceutical management with behavioral counseling [CO001, CO009]. Nourish reported data indicating that patients completing six or more appointments achieved 2.3 times greater weight loss than those attending only one to two sessions [CO009]. External search signals also return profiles for unrelated homonymous entities, such as Indian plant-based brand Nourish You, reinforcing the necessity of strict entity verification [CO011]."
    claimRefs:
      - "CO001"
      - "CO009"
      - "CO011"
      - "CO012"
