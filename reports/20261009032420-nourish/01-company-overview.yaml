callouts:
  - calloutType: "strength"
    title: "Capitalization and Payer Integration Advantage"
    body: "Nourish has established substantial competitive differentiation by securing in-network contracts across major commercial and government health plans covering over 200 million lives [CO001, CO004]. With $215 million in total equity capital and lead backing from Menlo Ventures and J.P. Morgan, Nourish possesses multi-year capital depth to expand its proprietary AI clinical copilot and maintain a W-2 clinical employment model while competitors rely on fragmented contractor networks [CO001, CO005]."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Valuation Speculation and Private Financial Opacity"
    body: "While market chatter and prior investor summaries cited a $1.75 billion post-money valuation, Nourish’s official Series C announcements provide no confirmation of valuation or liquidation preferences [CO006, CO007]. Given the total lack of audited disclosure regarding annual revenue, realized reimbursement per visit, or clinical gross margin, investors must treat headline valuation multiples as unverified hypotheses until confirmed by financial documentation [CO006, CO007]."
    claimRefs:
      - "CO006"
      - "CO007"
  - calloutType: "insight"
    title: "Clinical Scope Boundaries and Regulatory Defense"
    body: "Nourish enforces precise contractual boundaries between licensed dietitian nutrition counseling and physician medical practice, explicitly disclaiming emergency medical treatment and requiring mandatory individual dispute arbitration [CO012]. This structure insulates corporate operations from clinical liability risks associated with medical diagnoses, while pairing behavioral nutrition with third-party pharmaceutical GLP-1 therapies [CO001, CO012]."
    claimRefs:
      - "CO001"
      - "CO012"
