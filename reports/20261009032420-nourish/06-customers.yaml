chapter:
  number: 6
  title: "Customers"
  summary: "Nourish's public customer case rests on broad insurance access and a large virtual-care footprint: the company says 94% of patients pay $0 out of pocket, while April 2025 reporting cited 150 million covered lives and hundreds of thousands of patients. The evidence does not disclose current active-patient counts, retention, payer concentration, named enterprise customers, or independently verified outcomes."
sections:
  - id: "customer-segmentation-and-payer-architecture"
    title: "Customer segments and payer structure"
    body: |
      The clearest public segment is the individual U.S. patient who uses virtual dietitian care. Nourish says it is available in all 50 states through a network of more than 9,000 dietitians, and its terms limit use of the services to adults residing in the United States or its territories [CU001, CU002, CU014]. Payment is frequently intermediated by insurance: Nourish says 94% of patients pay nothing out of pocket, while Fierce Healthcare reported in April 2025 that the company worked with commercial, Medicare, and Medicaid payers covering 150 million lives [CU003, CU004]. Covered lives are an eligibility footprint, not an active-customer count, and neither source discloses payer mix or realized reimbursement.

      Fierce Healthcare also reported an enterprise offering for health systems and employers, but executives had not publicly named partners at that time [CU009]. Public evidence therefore supports three roles rather than a simple customer count: patients are users, insurers can fund care, and health systems or employers may be organizational buyers or channels. The assigned evidence does not establish how revenue divides among these groups, whether any enterprise relationship is a pilot or production deployment, or whether a small number of payers or channel partners account for a material share of collections.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-clinical-proof"
    title: "Adoption signals and customer proof"
    body: |
      Public scale signals are meaningful but not directly comparable. Fierce Healthcare reported "hundreds of thousands" of patients and 150 million covered lives in April 2025, while the current homepage states nationwide availability and more than 9,000 dietitians [CU001, CU002, CU004, CU005]. The first is an imprecise patient-volume description, the second is a payer eligibility ceiling, and the third is provider capacity. None supplies a current active-patient denominator, visit volume, repeat-use rate, or year-over-year growth calculation. The homepage separately claims 8% average weight loss after 12 months for patients not taking GLP-1s, but provides no cohort size, attrition rate, comparator, or independent replication in the assigned text [CU013].

      Named proof is limited to company-selected patient testimonials. Bianca G. reports a 40-pound loss and a return to a normal hemoglobin A1c level after a year; Emily G. describes the benefit of individualized solutions; and Brandon M. says the counseling helped him build a practical diet for gastrointestinal health and gout concerns [CU010, CU011, CU012]. These examples show plausible use cases and sustained engagement, but they are not independently verified customer references. No assigned source provides full names, medical records, payer confirmation, enterprise deployment status, or a representative denominator for positive and negative outcomes.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-concentration-and-governance-risks"
    title: "Retention, concentration, and trust gaps"
    body: |
      Nourish describes a flexible care cadence: most patients initially meet a dietitian weekly or biweekly and may later move to monthly check-ins, with no minimum engagement or commitment [CU006, CU007]. That flexibility may reduce adoption friction, but the assigned evidence does not disclose gross or net revenue retention, patient churn, renewals, average completed visits, cohort duration, reactivation, or contract length. The journey is therefore observable, while its durability and economics are not. Company-reported outcomes among patients reaching 12 months cannot establish retention without the starting cohort and completion denominator.

      Concentration is similarly unresolved. A 150-million-covered-life footprint indicates distribution breadth, but it does not show how many members use Nourish or how collections are distributed across payers [CU004]. Customer trust also warrants diligence: a July 2026 commercial legal analysis reported that federal Wiretap Act and California Invasion of Privacy Act claims in Podraza v. Nourish survived an April 2026 motion to dismiss, while noting that other claims were dismissed [CU015]. This is an allegation-stage litigation signal, not proof of liability or a recorded customer-loss event. Three allocated net-new search results concerned unrelated organizations using the word "Nourish," underscoring that the evidence pool itself cannot fill these customer-data gaps [CU016].
    claimRefs:
      - "CU004"
      - "CU006"
      - "CU007"
      - "CU015"
      - "CU016"
