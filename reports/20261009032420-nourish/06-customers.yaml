callouts:
  - calloutType: "insight"
    title: "Coverage breadth is not active adoption"
    body: |
      The 150 million covered-lives figure describes potential insurance reach, while "hundreds of thousands" describes patients served as of April 2025. Neither metric supplies a current active-user denominator, repeat-visit rate, or payer concentration.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
  - calloutType: "risk"
    title: "Privacy litigation is a trust signal, not a finding of liability"
    body: |
      A commercial legal analysis says core federal wiretap and CIPA claims survived the pleading stage in April 2026. The assigned pool does not include the docket or evidence of resulting churn, so diligence should verify current case status and any customer impact directly.
    claimRefs:
      - "CU015"
