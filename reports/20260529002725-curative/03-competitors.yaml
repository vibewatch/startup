tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor or class
  - Category
  - Scale or funding signal
  - Target segment
  - Differentiation
  - Main limitation versus Curative
  rows:
  - - Curative
    - Carrier challenger
    - Private employer-plan challenger; public pages emphasize member simplicity more than company scale
    - Employers wanting lower day-to-day member cost friction
    - Zero-out-of-pocket framing, multiple plan options, telehealth, national-network story
    - Less public scale and realized-outcome disclosure than some rivals
  - - Centivo
    - Direct peer / self-funded replacement
    - More than 160 employers, about 100k covered lives target, $225M raised
    - Mid-market and large self-funded employers willing to redesign around PCP steering
    - Primary-care-centered model with local health-system contracts and explicit replacement of traditional carriers
    - Selective geography and heavier change-management burden
  - - Surest / UnitedHealthcare
    - Direct peer with incumbent backing
    - Carrier-backed plan with national network and published member retention metrics
    - Employers wanting low-friction adoption inside familiar carrier relationships
    - Copay-only design, pre-care shopping, broad UHC distribution
    - Less differentiated if employer already has a similar incumbent product mix
  - - Gravie Comfort
    - Direct peer / SMB-midmarket challenger
    - Level-funded product oriented to brokers and smaller employers
    - Small and midsize employers seeking zero-cost routine-care experience
    - Zero-cost coverage on most common care without classic deductible logic
    - Not every service is zero-cost and enterprise-scale proof is thinner
  - - Sana Benefits
    - Direct peer / SMB challenger
    - Modern small-business plan and admin platform with nationwide network claims
    - Small businesses prioritizing no-cost care and simple administration
    - No-cost care routes, no out-of-network fees, integrated Sana Care
    - Public evidence is strongest in SMB motion, not large self-funded competition
  - - Oscar Health
    - Adjacent digital carrier
    - Public company with 3.2M members and $11.7B of 2025 revenue
    - Buyers interested in tech-enabled insurance and ICHRA-style alternatives
    - Technology-forward carrier brand with public operating disclosure
    - Public business mix is more adjacent to Curative than a clean self-funded replacement
  - - Collective Health / Accolade-Transcarent
    - Adjacent substitute
    - Independent TPA and navigation platforms; Accolade-Transcarent says 1,400+ clients
    - Employers that want administration, navigation, or virtual-care upgrades without changing the carrier
    - Can solve benefits pain without asking the employer to replace core medical risk
    - Does not replicate Curative’s full medical-plan design
  - - BCBS / Aetna / Cigna traditional products
    - Incumbent and status quo
    - Massive provider and consultant reach, broad product bundles, and national trust
    - Buyers prioritizing breadth, familiarity, and low-switch risk
    - Broad PPO, narrow-network, high-performance, analytics, and integrated carrier programs
    - Employee affordability often still resembles the deductible-heavy status quo
  notes: Rows are grouped by solution shape where employers often compare classes rather than a single logo. Public scale or funding signals are directional because private-company disclosure is uneven.
