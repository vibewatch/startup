  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-pricing-transparency
    missingEvidence: Comparable broker quote decks or anonymized employer proposals showing PMPM, admin fees, stop-loss assumptions and implementation fees across Curative, Centivo, Surest, Gravie and Sana.
    whyItMatters: Public sources make package design visible but not the real commercial economics, so the pricing table is directional rather than underwriteable.
    diligencePath: Request broker rate sheets or anonymized finalist proposals for each vendor and normalize on employer size, geography and funding mode.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-metrics
    missingEvidence: Cohort-level data on implementation timelines, Baseline Visit completion, re-enrollment, migration lift and avoided attrition after employers adopt Curative or direct peers.
    whyItMatters: Moat durability depends on whether the plans stick after launch, not just on how attractive the public product story sounds.
    diligencePath: Ask management and brokers for launch dashboards, retention cohorts, and post-implementation utilization comparisons versus prior carrier designs.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: head-to-head-win-loss-data
    missingEvidence: Named finalist processes, broker post-mortems or win-loss summaries comparing Curative directly against Surest, Centivo, Gravie or incumbent carrier alternatives.
    whyItMatters: The public record supports competitor categories, but it does not show where Curative is consistently winning or losing in live procurement.
    diligencePath: Review ten recent late-stage employer evaluations with broker notes, finalist scorecards and the specific reason Curative won or lost.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: eligibility-and-geography
    missingEvidence: A clean matrix of current employer-size floors, state availability and funding-mode boundaries for Curative, Centivo, Surest, Gravie and Sana.
    whyItMatters: Official surfaces are uneven and sometimes inconsistent, which can distort which vendors truly compete for the same employer buyer at a given size and geography.
    diligencePath: Confirm active market maps and minimum-group rules with current broker or sales-rep emails and update the profile table with exact boundaries.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
