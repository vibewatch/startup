- id: capability-packaging-and-distribution
  title: Capability, packaging, and distribution
  body: Curative’s cleanest wedge is a member-facing promise of very low everyday cost sharing, national-network access and telehealth, but that wedge is not unique. Centivo pushes the most structurally disruptive counter-model by replacing traditional carriers with a primary-care-centered, self-funded design that claims materially lower employer cost and member out-of-pocket exposure. Surest is the closest incumbent-backed analogue because it combines copay-only plan design, pre-care price shopping and UnitedHealthcare distribution, making it easier to install beside a familiar carrier relationship. Gravie Comfort and Sana matter most in SMB and mid-market buying motions where level-funded or small-business simplicity matters more than national enterprise distribution. Public list pricing is sparse across nearly all vendors, so procurement is driven less by posted PMPM rates than by plan architecture, network trust, navigation promises, and whether the employer wants a full carrier replacement
    or just a lower-friction option. In practice, Curative is strongest when the employer views rich everyday affordability as the main decision criterion and is comfortable changing plan behavior. It is weaker when the buyer wants to preserve an incumbent carrier relationship, sees navigation as the core pain point, or prefers an overlay that leaves the existing network and funding stack intact.
