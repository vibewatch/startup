chapter:
  number: 3
  title: Competitors
  summary: Curative’s main competitive challenge is not a single rival but a stack of alternatives. Surest is the closest incumbent-backed analog on member-facing simplicity, Centivo is the strongest structurally disruptive direct peer, Gravie and Sana matter in SMB and mid-market segments, and Collective Health or Accolade can solve parts of the employer pain without a carrier replacement. Because PPO and HDHP status quo products still dominate enrollment and carrier distribution remains powerful, the public record supports a moderate rather than dominant moat for Curative.
sections:
- id: landscape-and-buyer-alternatives
  title: 'Landscape: direct peers, incumbents, adjacents, and status quo'
  body: 'Curative does not face one clean one-for-one rival. The direct replacement set includes Centivo, Surest, Gravie Comfort and Sana, each of which promises lower everyday friction or lower out-of-pocket burden than traditional employer coverage. Oscar is more adjacent than direct in this buyer motion because its public investor framing centers on Individual & Family plans, ICHRA and technology services rather than a self-funded employer replacement thesis. Collective Health and Accolade/Transcarent widen the field further by letting employers fix administration, navigation or virtual-care pain without changing the underlying carrier. Incumbents remain the final layer: BCBS, Aetna, Cigna and UnitedHealthcare can answer the same affordability brief with narrower or high-performance networks, value-based products, and consultant-friendly renewals. That means Curative is competing against direct peers, incumbent bundles, adjacent overlays and the employer instinct to avoid disruption altogether.
    The status quo is therefore not just another carrier quote; it also includes keeping the current carrier and adding a TPA, navigation layer or internal-benefits-process cleanup rather than replacing the medical plan. For diligence purposes, that broader frame matters because Curative only wins when an employer decides the pain is significant enough to justify plan-level change.'
