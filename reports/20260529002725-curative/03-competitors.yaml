- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Why it matters
  - Threat source
  - Severity
  - Diligence ask
  rows:
  - - Curative’s employee-affordability wedge is real
    - High deductibles make a simpler everyday plan feel valuable to employees and employers
    - Surest, Gravie and Sana each copy parts of the low-cost-sharing experience
    - Medium-High
    - Compare member activation and re-enrollment against direct peers
  - - National network and multiple plan options increase buyability
    - Employers fear disruption and provider loss during a switch
    - BCBS, UHC, Aetna and Cigna still own deeper network and consultant trust
    - High
    - Quantify carrier-displacement win rates and broker objections
  - - Behavior-change economics depend on member engagement
    - Savings logic is stronger if members actually use primary care and preventive pathways
    - Baseline Visit completion, PCP steering, or shopping behavior may lag marketing claims
    - Medium
    - Request cohort data on activation, preventive use and emergency-room substitution
  - - Adjacent admin and navigation substitutes are credible
    - An employer can fix benefits pain without replacing the carrier or changing medical risk
    - Collective Health and Accolade-Transcarent can win budget without a plan switch
    - High
    - Measure how often Curative loses to overlay or navigation-first alternatives
  - - Public proof burden is rising
    - Employers are pruning vendors and demanding outcome evidence in 2026
    - Business Group on Health and Mercer both point to stronger accountability expectations
    - High
    - Obtain customer-level savings, retention and utilization proof that survives diligence
  - - Status-quo inertia remains powerful
    - PPO, HDHP and self-funded products still dominate enrollment
    - Employers may prefer familiar renewals even when premiums and deductibles are high
    - High
    - Map consultant influence, renewal-stage objections and reasons not to switch
  notes: Severity reflects likely impact on Curative’s ability to win and keep employer buyers, not a quantified loss estimate.
