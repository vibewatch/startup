- id: switching-costs-and-moat-durability
  title: Switching costs, substitutes, and moat durability
  body: 'Curative’s moat looks moderate rather than locked-in. The strongest defense is that high-deductible status quo coverage remains painful: KFF shows PPOs and HDHPs still dominate enrollment, deductibles remain high, and self-funded or level-funded formats are common, which keeps employers looking for alternatives. But the same data also show why incumbents remain dangerous: most employers already buy familiar carrier or consultant-led products, and alternative plans must prove that disruption is worth it. Business Group on Health and Mercer both suggest employers are tightening outcome expectations, steering employees to higher-value care, and pruning vendors that cannot prove results. That dynamic helps Curative if it can show better affordability and utilization, but it also helps Surest, Centivo and high-performance incumbent products. Meanwhile, Collective Health and Accolade/Transcarent create a substitute route by solving navigation and administration problems without forcing
    a full plan switch. The practical read is that Curative can win, but it has to beat both rival products and employer inertia. The missing public evidence is on exactly how often employers accept that trade-off, how quickly members complete the required activation steps, and whether consultants view Curative as a core finalist or a niche option. Until those proof points are public, the safest judgment is that Curative has a differentiated pitch but not yet a visibly durable moat.'
