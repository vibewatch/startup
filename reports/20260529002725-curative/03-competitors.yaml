  title: Pricing / packaging comparison
  columns:
  - Competitor or class
  - Funding or contract model
  - Member cost-sharing signal
  - Public pricing visibility
  - Competitive implication
  rows:
  - - Curative
    - Employer plan with multiple plan options; pricing negotiated
    - $0 out-of-pocket framing after Baseline Visit
    - Low
    - Strong employee-affordability story, but public procurement proof is thin
  - - Centivo
    - Self-funded replacement with stop-loss and direct provider contracting
    - $0 primary care, low-cost generics, predictable copays, 15-30% employer savings claim
    - Low
    - Most disruptive if the employer is willing to redesign around primary care
  - - Surest
    - Copay-only plan sold self-funded, fully insured, or level funded through UHC
    - No deductible or coinsurance; UHC cites lower employer and member cost
    - Low to medium
    - Easiest challenger to slot beside familiar carrier options
  - - Gravie Comfort
    - Level-funded plan sold through brokers and employer channels
    - Zero-cost common care, but ER, hospital and some drugs still vary in price
    - Low
    - Attractive SMB or mid-market alternative with caveats on non-routine care
  - - Sana
    - Small-business plan priced on projected claims
    - Many no-cost care paths and no out-of-network fees
    - Low
    - Competes on simplicity more than large-employer procurement scale
  - - Collective Health / Accolade
    - Administration, navigation, advocacy, and virtual-care platform contracts
    - Usually overlays existing coverage rather than replaces it
    - Low
    - Can absorb budget that might otherwise fund a carrier switch
  - - BCBS / Aetna / Cigna
    - Negotiated carrier premiums across broad, narrow, and high-performance options
    - Often still deductible and coinsurance based, even when richer designs exist
    - Low
    - Incumbents sell familiarity, breadth, and low disruption more than radical simplicity
