- id: capital-adequacy-and-insurance-underwriting-readiness
  title: Capital adequacy, ratings, and insurance-operating readiness
  body: 'Curative has more external capital-readiness evidence than it has true public financial statements. AM Best assigned the insurer an A- financial strength rating and stable outlook in January 2023, explicitly saying it expected Curative to maintain BCAR capitalization at the strongest level and that parent capital contributions were more than sufficient for the business plan. Curative’s current employer-facing page adds fresher but still company-controlled evidence: the company says it has achieved a third consecutive A- affirmation for 2025 and that Curative Inc. infused $100 million into Curative Insurance Company to reinforce the subsidiary. The December 2025 Series B adds another layer of capital support, with management saying the proceeds will fund Mid-Atlantic expansion, AI-enabled operations, and network/payment infrastructure, while also bolstering reserves required for new-state growth. Corporate filing evidence is thin but useful: Florida’s Sunbiz registry shows Curative
    Insurance Company is active and filed a 2026 annual report on March 10, 2026. What the public record still does not provide is the core underwriting stack—statutory surplus, RBC ratio, current cash, burn, debt, or claims development by state or product.'
