tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Quality of evidence
  - Diligence ask
  rows:
  - - Fully-insured employer premium
    - Curative underwrites employer coverage and collects one monthly premium for plan access
    - PMPM premium
    - Confirmed product; realized PMPM undisclosed
    - High for existence, low for realized rate
    - Obtain quoted and realized PMPM by state, employer size, industry, and plan design
  - - Level-funded employer contribution
    - Employer pays a fixed monthly amount while Curative administers claims and stop-loss
    - PEPM/PMPM funding amount
    - Confirmed product; realized funding rates undisclosed
    - High for structure, low for realized rate
    - Request contribution schedules, stop-loss attachment points, and expected claims corridor
  - - Unused-claims rebate on level-funded product
    - Curative says 50% of remaining claims funds are rebated to the employer
    - Percent of unused claims funds
    - Publicly disclosed as 50%
    - High
    - Request actual rebate incidence and average rebate size by cohort
  - - Plan-design mix across EPO / PPO / PPO Max / EPO Value
    - Different plan variants change network breadth and potential premium level
    - Share of employer groups by SKU
    - SKUs disclosed; mix undisclosed
    - Medium
    - Request enrollment and revenue mix by plan type
  - - Ancillary administrative or service-fee revenue
    - Potential admin, navigation, payment, or network economics beyond pure insurance premium
    - Fee schedule
    - Not publicly broken out
    - Low
    - Request ASO/admin fee splits, vendor pass-throughs, and any Cash Card monetization
  notes: Public evidence proves the product architecture but not realized pricing. Curative discloses the existence of fully-insured and level-funded funding types, one monthly premium framing, and a 50% unused-claims rebate for the level-funded product; it does not disclose PMPM realization, product mix, or non-premium revenue contribution.
