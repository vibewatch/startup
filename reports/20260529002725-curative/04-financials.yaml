- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Employer clients
    - '>1,200'
    - Medium
    - Top-line proof that the product is past pilot stage
    - Request active versus cumulative clients and client-count by renewal cohort
  - - Members
    - '>165,000'
    - Medium
    - Membership scale affects administrative leverage and reserve needs
    - Request members by state, product, and employer size bucket
  - - Implied average members per employer client
    - ~138 (165,000 / 1,200)
    - Medium
    - Rough proxy for average account size and target segment
    - Request exact group-size distribution and concentration by top 10 employers
  - - Baseline completion rate
    - 98% of members within 120 days (CEO interview)
    - Medium
    - If true, the model’s cost-out thesis has unusually strong engagement compliance
    - Request audited completion rate by renewal year and by employer cohort
  - - Primary care engagement change
    - +20% (company-claimed)
    - Medium
    - Early primary care use is central to claims-cost prevention thesis
    - Request pre/post utilization study with denominator and control cohort
  - - Hospitalization change
    - -30% (company-claimed)
    - Medium
    - Key downstream claims-cost lever
    - Request inpatient admits per 1,000 before and after joining Curative
  - - Drug cost change
    - Up to -40% within a year (company-claimed)
    - Medium
    - Pharmacy is a major employer cost driver
    - Request PMPM pharmacy trend and generic / specialty mix
  - - Public employer premium benchmark
    - $25,572 average family premium in 2024 employer market
    - High
    - Frames the employer spend Curative is trying to redirect
    - Show Curative premium versus incumbent renewals on matched groups
  - - Self-funded market relevance
    - 63% of covered workers are already in self-funded plans; 79% at large firms
    - High
    - Explains why Curative offers both underwritten and level-funded structures
    - Break out Curative sales mix by fully-insured versus level-funded
  - - Medical loss ratio / claims PMPM
    - null
    - Low
    - Core underwriting metric for an insurer is missing
    - Provide MLR, claims PMPM, and trend by state and product
  - - Gross margin / contribution margin
    - null
    - Low
    - Needed to evaluate whether the $0 cost-sharing model is economically durable
    - Provide insurance margin after medical claims plus administrative contribution margin
  - - CAC payback
    - null
    - Low
    - Broker-led employer acquisition can be expensive even when renewals are sticky
    - Provide CAC, payback, and broker commission economics by channel
  - - Profitability
    - Company says profitable by Dec 2025; no margin disclosed
    - Medium
    - Profitability without margin detail is directionally positive but not underwritable
    - Provide EBITDA, statutory underwriting result, and operating cash flow
  notes: Rows intentionally mix disclosed facts, company-reported outcome proxies, and explicit nulls. Curative has enough public evidence to show scale and a claimed cost-out mechanism, but not enough to calculate true insurance unit economics.
