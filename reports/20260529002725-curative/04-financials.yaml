company:
  name: Curative
chapter:
  number: 4
  title: Financials
  summary: 'Curative’s public financial story is a mix of unusually simple benefit design and unusually incomplete underwriting disclosure. The company clearly monetizes employer health coverage through fully-insured and level-funded products with a single monthly premium, zero in-network cost sharing after the annual Baseline Visit, and a disclosed 50% rebate of unused claims funds in the level-funded product. Public scale signals are meaningful: Curative says it serves more than 1,200 employer clients and 165,000 members, raised more than $150 million at a $1.275 billion valuation in December 2025, and achieved profitability. Capital adequacy also has some third-party support—AM Best assigned an A- rating in 2023 and said Curative targeted strongest BCAR capitalization, while Curative’s 2025 employer materials say Curative Inc. infused another $100 million into the insurance subsidiary and that the A- rating was affirmed again. What remains missing is what investors actually need to underwrite:
    realized PMPM pricing, claims ratios or MLR, statutory surplus and RBC, cash, burn, runway, renewal behavior, and cohort-level unit economics. The result is a business model that is conceptually understandable and potentially compelling, but still not fully underwritable from public evidence alone.'
sections:
- id: revenue-model-and-public-pricing
  title: Revenue model and public pricing architecture
  body: 'Curative’s monetization model is clearer than its disclosed financial statements. The company sells employer health coverage through two funding formats—fully-insured and level-funded—rather than through a usage-based fee stack. Public pages repeatedly frame the product around one monthly premium and zero in-network out-of-pocket cost after the annual Baseline Visit. That is financially important because the economic bet is not that members will pay at the point of service; it is that premium sufficiency plus better engagement can keep aggregate claims below what the employer or insurer would otherwise expect. The level-funded design makes that explicit: Curative administers the plan, arranges stop-loss, and offers employers a 50% rebate of unused claims funds. Public plan architecture also shows how Curative segments the offer: EPO, PPO, PPO Max, and a lower-premium EPO Value option, all with very different member steering and out-of-network economics. What Curative does not disclose
    is the realized PMPM by employer size, industry, geography, or plan type, so list-plan structure is visible but actual revenue realization is not.'
