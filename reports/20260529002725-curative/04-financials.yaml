  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: Realized employer PMPM, PEPM, and renewal pricing by fully-insured versus level-funded cohort and by plan SKU.
    whyItMatters: List-plan architecture is visible, but actual pricing quality and revenue concentration are not.
    diligencePath: Request sold-case census, broker quote sheets, renewal files, and employer-level premium history.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Current cash balance, monthly burn, debt facilities, and 12- to 18-month liquidity forecast.
    whyItMatters: Without liquidity data, investors cannot tell whether recent capital raises created durable runway or only temporary reserve support.
    diligencePath: Request latest balance sheet, debt schedule, board runway pack, and management operating forecast.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: claims-ratio-and-medical-loss
    missingEvidence: Claims PMPM, MLR, IBNR methodology, and trend by state, funding type, and cohort.
    whyItMatters: These are the core underwriting metrics needed to test whether zero-cost-sharing plans are economically durable.
    diligencePath: Request actuarial reserve memo, monthly claims triangles, MLR bridge, and rate-development files.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohort-maturity
    missingEvidence: Employer renewal rates, member retention, net growth by cohort, and concentration of members across large accounts.
    whyItMatters: A health-plan thesis depends on proving first-year onboarding results persist into mature cohorts.
    diligencePath: Request retention dashboard, renewal pricing file, and concentration report by top employer group.
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pharmacy-and-specialty-exposure
    missingEvidence: Pharmacy PMPM, specialty-drug mix, rebate structure, and GLP-1 exposure by employer cohort.
    whyItMatters: External employer surveys show pharmacy has become a major cost driver, so Curative’s drug-cost claims need hard numbers.
    diligencePath: Request Rx claims trend deck, specialty-drug utilization, and PBM economics.
    relatedTableRefs:
    - TI003
    - TI005
