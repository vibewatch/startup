- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public status
  - Exact diligence path
  rows:
  - - Realized employer PMPM by product and cohort
    - Without realized pricing, public list-plan structure cannot be converted into revenue quality
    - Not disclosed
    - Request sold-case census, quoted PMPM, realized PMPM, and renewal PMPM by state and product
  - - Claims PMPM and medical loss ratio by state / funding type
    - Core insurance profitability depends on claims cost, not marketing engagement alone
    - Not disclosed
    - Request monthly claims triangles, MLR, IBNR treatment, and trend by state / product
  - - Statutory surplus and RBC ratio
    - Needed to evaluate solvency headroom and expansion capacity
    - Not disclosed in reviewed public materials
    - Request statutory balance sheet, RBC filing, and AM Best capital bridge
  - - Cash on hand, burn, and runway
    - Needed to separate growth investment from financing dependency
    - Not disclosed
    - Request latest balance sheet, monthly burn, and 18-month liquidity forecast
  - - Fully-insured versus level-funded sales mix
    - Funding mix changes margin profile, reserve needs, and claims volatility
    - Not disclosed
    - Request revenue and membership split by funding type
  - - Retention, renewal, and cohort maturity
    - A health-plan thesis needs proof that early cohorts persist after first-year onboarding
    - Not disclosed
    - Request employer logo retention, member retention, and premium change at renewal
  - - Broker economics and CAC payback
    - Employer acquisition costs can erase underwriting gains if sales motion is expensive
    - Not disclosed
    - Request commission schedules, CAC by channel, and payback by cohort
  - - Pharmacy trend and specialty-drug exposure
    - External market data show pharmacy has become a major cost driver
    - Not disclosed
    - Request Rx PMPM, specialty share, rebate structure, and GLP-1 utilization
  - - Public rate-review and actuarial filing trail
    - Public rate-review filings can corroborate premium adequacy, geography, and actuarial support for regulated insurance products.
    - CMS publishes the portal, but no Curative-specific rate-review filing appears in the reviewed chapter evidence.
    - Search CMS Rate Review and state forms/rates portals by issuer and state; pull the consumer justification and actuarial memorandum if filings exist.
  notes: These are not theoretical wish-list metrics; they are the minimum data required to underwrite a fast-scaling private health insurer selling zero-cost-sharing plans. Public evidence remains insufficient on every item in this table.
