- id: verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'Curative’s financial story is stronger on operating logic than on disclosure depth. The model is differentiated in a market where employers face rising premium inflation, broad dissatisfaction with traditional cost shifting, and growing interest in alternative designs, advanced primary care, and high-performance networks. The company’s combination of rating support, fresh capital, expanding geography, and claimed profitability suggests it is not a fragile pilot. But it is also not yet underwritable from public materials: there is no disclosed PMPM by product, no public MLR or claims PMPM, no statutory capital ratio, no cash or runway disclosure, and no cohort-level renewal or retention data. The adverse evidence is not thesis-breaking, but it is real—BBB shows a small but nonzero complaint record, and Curative’s own grievance page explicitly routes unresolved premium and claim disputes to the Texas Department of Insurance. The prudent financial stance is therefore conditional: Curative
    appears to have built a credible employer-plan wedge, but diligence should now move immediately from marketing outcomes to audited insurance economics.'
