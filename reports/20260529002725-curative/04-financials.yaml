- id: TI002
  title: Pricing / monetization table
  columns:
  - Package
  - Public pricing signal
  - Member cost-sharing design
  - Eligibility / availability
  - What is still undisclosed
  rows:
  - - Fully-insured
    - One monthly premium; exact PMPM not public
    - $0 in-network after Baseline; employer pays premium
    - 51+ employees; employers based in Texas, Florida, and Georgia; employees nationwide
    - Quoted premium, renewal rate, broker commission, and realized claims margin
  - - Level-funded
    - One monthly funding amount; exact PEPM/PMPM not public
    - $0 in-network after Baseline; employer receives 50% of unused claims funds
    - 20+ employees headquartered in Texas, Florida, and Georgia; employees nationwide
    - Attachment points, corridor, rebate frequency, and admin fee split
  - - EPO
    - No public dollar premium; positioned as standard guided network product
    - $0 in-network with Baseline; $5,000 individual / $10,000 family in-network deductible without Baseline; no out-of-network coverage
    - Public plan option in 2025 materials
    - Premium differential versus PPO options and selection by employer size
  - - PPO
    - No public dollar premium
    - $0 in-network with Baseline; $5,000 / $10,000 in-network deductible without Baseline; out-of-network deductible and OOP maximum apply
    - Public plan option in 2025 materials
    - Incremental premium for out-of-network access and claims impact of broader network
  - - PPO Max
    - No public dollar premium
    - $0 in-network with Baseline; same in-network deductible fallback; $0 out-of-network deductible and broader pharmacy access
    - Public plan option in 2025 materials
    - Whether richer out-of-network economics raise PMPM materially
  - - EPO Value
    - Explicitly described as lower-premium / cost-conscious option; no dollar premium disclosed
    - $0 out-of-pocket through Curative Pass high-value providers plus Curative hallmark benefits
    - Publicly marketed as a separate option
    - Actual premium delta, provider steerage rules, and utilization outcomes
  notes: This table separates plan architecture from realized pricing. Curative publishes benefit design, availability, and fallback deductibles, but not the employer PMPM or PEPM actually charged for any package.
