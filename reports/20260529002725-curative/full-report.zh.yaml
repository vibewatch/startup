            title: 即便不把整个 ESI 市场算进去，self-funded 空白也真实存在
            body: >-
              DOL 大型计划 filing 数据意味着一个大约 71.3 million 参与者的 self- 或 mixed-funded 核心，而 Curative 在 March 2026 据报道拥有
              165,000-plus 名成员。即使 Curative 永远拿不下整个雇主赞助市场，当前规模与已经承担风险的雇主基础之间仍有巨大差距。
