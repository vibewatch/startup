            body: >-
              Curative 最干净的切入点，是面向成员承诺非常低的日常 cost sharing、全国网络可及性和 telehealth，但这个切入点并不独特。Centivo 推出结构上最具扰动性的反向模型，用
              primary-care-centered、self-funded 设计替代传统保险公司，并声称显著降低雇主成本和成员自付暴露。Surest 是最接近的在位者支持类比，因为它结合了只用 copay
              的计划设计、护理前价格比较和 UnitedHealthcare 分销，更容易安装在熟悉的保险公司关系旁边。Gravie Comfort 和 Sana 在 SMB 与中端市场购买动作中最重要，因为
              level-funded 或小企业简单性比全国企业分销更重要。几乎所有供应商的公开标价都很稀疏，所以采购不是由公开 PMPM
              费率驱动，而是由计划架构、网络信任、导航承诺，以及雇主究竟想要完整替代保险公司还是只要一个低摩擦选项来决定。实操中，当雇主把丰富的日常可负担性视为主要决策标准，并接受改变计划行为时，Curative
