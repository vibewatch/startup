            body: >-
              Curative 公开的工作流表面足以显示产品在运营上真实存在。成员侧，member portal 支持 ID-card 访问、Baseline Visit 排期、权益查看、处方管理和 24/7 帮助；app
              增加数字卡、Curative Cash Card 管理、服务方搜索、护理导航和 Curative AI。雇主侧，Curative 的 portal
