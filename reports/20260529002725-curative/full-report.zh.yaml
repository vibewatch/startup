  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚与公开证据
        blocks:
          - type: paragraph
            body: >-
              Curative 当前估值锚并非传闻级别：2025 年 12 月的 Series B 同时有公司和独立来源覆盖，且这些来源都指向投后估值 $1.275 billion、新资金超过 $150
              million、雇主客户超过 1,200 家、会员超过 165,000
              人，并声称公司已经盈利。这足以把当前价格视为真实市场信号，而不是无法验证的数据库耳语。一旦分析从融资光环转向承保经济性，证据质量就变薄。Curative 的公开材料给投资者提供了产品简化和评级支撑——以
              Baseline 为门槛的 $0 自付设计、完全保险和定额资金型选项，以及 AM Best A- / a-
              路径——但仍没有披露真正决定价格的保险公司指标：收入、医疗赔付率、法定盈余、按州划分的准备金充足性、雇主续约行为，或优先股堆叠条款。换句话说，融资真实，运营切口有合理性，评级重要；但价格支撑仍依赖公开记录尚未给出的证据。
