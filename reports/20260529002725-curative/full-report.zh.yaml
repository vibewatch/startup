        title: 耐久性、扩张与集中度缺口
        blocks:
          - type: paragraph
            body: >-
              耐久性和集中度是客户章节保持不完整的地方。公开材料强烈暗示一个可运转的 land-and-expand 故事——新地域、经纪人赋能、可复用雇主指南、portal 工作流、服务方提名和成员参与工具——但没有披露
              NRR、GRR、续约率、平均合同期限或头部账户集中度。这个缺口重要，因为保险公司经济性在成员数上可能看起来分散，同时仍高度依赖少数经纪人、少数大型雇主集团或狭窄州级覆盖。Curative 当前雇主足迹仍集中在
              Texas、Florida 和 Georgia；Mid-Atlantic
              扩张已有讨论，但还没有广到足以消除州集中风险。公开参考集相对于声称客户基础也经过筛选，即使最强参考仍主要由公司管理或福利指南驱动，而不是独立续约队列。投资者因此应把 Curative
              的客户故事理解为：入组设计和存在性证明很强，但续约可见度和集中度透明度只是中等。
