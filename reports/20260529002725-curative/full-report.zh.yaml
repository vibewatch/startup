      - number: '3.3'
        title: 切换成本、替代方案与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Curative 的护城河看起来是中等，而不是锁死。最强防线在于，高 deductible 的现状覆盖仍然痛苦：KFF 显示 PPO 和 HDHP 仍主导参保，deductibles 仍高，self-funded
              或 level-funded 形式也很常见，这让雇主持续寻找替代方案。但同一组数据也说明在位者为何危险：多数雇主已经购买熟悉的保险公司或顾问主导产品，替代计划必须证明扰动值得。Business Group on
              Health 和 Mercer 都表明，雇主在收紧结果预期，把员工导向更高价值护理，并剔除无法证明结果的供应商。Curative 如果能显示更好的可负担性和使用效果，就会受益；但 Surest、Centivo
              和高绩效在位产品也会受益。与此同时，Collective Health 和 Accolade/Transcarent 通过解决导航和管理问题开辟一条替代路径，不强迫完整换计划。实际读法是，Curative
              可以赢，但必须同时击败竞品和雇主惯性。公开证据缺口恰好在几个关键问题上：雇主多常接受这种取舍、成员多快完成必需激活步骤、顾问是否把 Curative 视为核心入围者还是小众选项。在这些证明点公开前，最稳妥的判断是
              Curative 有差异化推介，但还没有可见的耐久护城河。
