      - number: '8.3'
        title: 情景框架与建议
        blocks:
          - type: paragraph
            body: >-
              当前轮次对应每名已披露会员约 $7,700，远高于 Oscar 的公开会员口径，但仍低于 Alignment，也明显低于 Clover 的加元会员口径。这是不要把 Curative 在 $1.275
              billion 估值下简单判定为荒谬的核心原因；但同样也是不能称其便宜的原因。公开证据能支撑很宽的区间，而不是精确目标。悲观结果约 $0.35 billion 到 $0.7
              billion，对应一种情形：Curative 缺失的承保披露最终更接近较低倍数的上市公司或邻近结果，或准备金需求、续约、法律复杂事项迫使估值重置。基准区间约 $0.8 billion 到 $1.2
              billion，承认需求、简化设计、评级支撑和真实雇主牵引力，同时仍因经济性缺失打折。乐观情景约 $1.4 billion 到 $2.2 billion，但只有在私下尽调证明其具备类似 Alignment
              的承保纪律、可持续增长和资本充足性时才成立。因此，今天更合适的判断是以低到中等确信度观察，而不是买入：公司可能不错，但价格仍要求投资者相信太多看不见的保险数学。
