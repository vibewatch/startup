  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 业务 / 状态
      - 当前估值锚点
      - 规模锚点
      - 相关性
      - 局限
    rows:
      - - Oscar Health
        - 公开科技赋能保险公司
        - $6.73B 市值
        - ~3.4M 名会员
        - 可作为会员口径框架下，有规模公开保险公司的底部参照。
        - ACA 交易所模型不同于 Curative 的雇主焦点。
      - - Alignment Healthcare
        - 公开 Medicare Advantage 保险公司
        - $3.27B 市值
        - 236,300 名会员；$3.95B FY2025 收入
        - 在高披露、强增长保险公司可比项中，公开证明集最佳。
        - 面向老年人的 MA 经济性不同于雇主商业险风险。
      - - Clover Health
        - 公开 Medicare Advantage 保险公司
        - C$3.03B 市值
        - 155,773 名 Q1 2026 会员；$2.81B-$2.92B FY2026 指引
        - 展示了科技赋能保险公司在证明盈利能力时，会员口径可以给出更高估值。
        - 币种不一致和 MA 组合限制直接可比性。
      - - eHealth
        - 公开在线保险市场
        - $50.46M 市值
        - 分销 / 导航相邻业务
        - 对分销权重高的公开模式，是有用的下行提醒。
        - 不是全风险承保方。
      - - GoodRx
        - 公开药房和导航平台
        - $1.00B 市值
        - 消费者分销相邻业务
        - 说明即便有品牌认知，公开数字健康估值也会压缩。
        - 不是保险公司，也不聚焦雇主计划。
      - - Accolade sale
        - 导航业务私有化交易
        - $621M 交易价值（约 1.5x FY2024 收入）
        - $414M FY2024 收入
        - 为相邻福利资产提供相关下行交易背景。
        - 导航模式，不是保险资产负债表。
      - - Sidecar Health
        - 私有雇主重大医疗险公司
        - 此前为独角兽，之后完成 $165M Series D
        - 在 OH/GA/FL 扩张雇主业务
        - 最接近雇主计划颠覆叙事的私有可比项。
        - 当前投后估值未公开披露。
      - - Devoted Health
        - 私有规模化保险公司
        - $13B Aug 2024 估值；$366M 2026 融资
        - 466,000 名会员；Sacra 估计 2024 收入 $3.27B
        - 显示投资者愿意为更大规模、已披露的保险公司证明支付什么价格。
        - 聚焦 Medicare Advantage，披露规模也大得多。
    notes: 这是一个局部但可用于决策的可比集合，覆盖公开保险公司、相邻公开资产、一个交易可比项和私募轮次。 各行在币种、会员组合和披露质量上差异很大，因此不应把任何单一行当作完美套用可比项。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative 2024-2026 set of public insurers, adjacent public assets, transaction evidence, and private
        employer-insurance peers available in fetchable public sources as of runDate.
