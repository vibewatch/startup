  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - 私下尽调显示 MLR 或准备金质量平平；续约不及预期；法律或评级压力加重；后续融资变得可能。
        - $0.35B-$0.70B 区间，锚定 Oscar 式公开会员结果和相邻可比项的严厉压缩。
        - 轮次重设、结构化融资或 AM Best 压力。
        - 若未公开保险公司指标偏弱，风险不小。
      - - 基准
        - Curative 守住评级支持，谨慎增长，尽调显示保险公司经济性体面但未到顶尖。
        - $0.80B-$1.20B 区间，认可雇主牵引力和需求，同时继续折价不透明度。
        - 当前轮次仍高于该区间；投资者在为尚未公开的证明付费。
        - 以目前公开证据看，最可辩护的区间。
      - - 乐观
        - 私下尽调显示准备金强、赔付率控制有吸引力，续约质量足以支撑 Alignment 式保险公司视角。
        - $1.40B-$2.20B 区间；只有 Curative 用已披露证明赢得优质保险公司倍数，才有上行。
        - 单凭公开证据，目前还支撑不了这个情景。
        - 可能存在，但取决于尚未公开的数据。
    notes: 区间是 USD 股权价值区间，不是精确目标。它们基于会员口径的公开视角、相邻公开 / 交易参照， 以及目前仍应适用的信息披露折价程度。
    claimRefs:
