      - number: '2.3'
        title: 买家、付款方与分销机制
        blocks:
          - type: paragraph
            body: >-
              买家路径由多方共同推动，而不是单线决策。预算权通常在 CFO、财务或 HR 领导层手里，但候选名单很大程度由经纪人和顾问塑造。Deloitte
              仍看到雇主优先考虑价格和网络稳定性，同时又要求更灵活的覆盖；Acrisure 也明确描述，续约越来越难后，经纪人关系正在出现更多变动。这意味着 Curative
              不仅要赢得雇主，还要赢得那个定义选择集、解释迁移风险的顾问。


              付款方和使用者也分离。传统团体覆盖中，雇主设定缴费策略，员工接受由此形成的网络和权益设计。ICHRA 中，雇主提供固定补贴，员工在 ACA 选项中选择。Curative
              介于两者之间：它保留雇主赞助框架，但护理导航、Baseline 入组和网内 $0 逻辑要求成员更像主动参与者，而不是被动参保人。Zorro 的 ICHRA 数据和 Curative
              自己的推荐语都表明，引导式选择很重要：员工看重理解计划的帮助，经纪人关心网络扰动是否可控，以及员工是否真的参与。
