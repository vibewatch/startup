      - number: '7.3'
        title: 隐私、投诉与信任风险暴露面
        blocks:
          - type: paragraph
            body: >-
              Curative 在公开层面有一套说得通的缓释安排，但隐私和服务信任的暴露面仍然很宽。HIPAA 通知在 2026 年 2 月 9 日更新，明确给会员两条投诉路径：向 Curative 投诉，也可以向 HHS
              OCR 投诉；OCR 自身门户也写明，隐私、安全、违规通知以及 Part 2 保密问题，都可能进入联邦执法。该通知覆盖的关联方范围很大，经济上说得通，但也把 PHI
              处理、供应商监督和违规报告的内部控制边界拉宽。公司的 HITRUST 表述是正面信号，因为它说明第三方控制工作已经做过；但当理赔、事先授权、药房和会员服务量放大后，认证不能替代干净的执行。消费者侧，
              Curative 的申诉页面和 BBB 投诉页面说明，公司已经同时面对正式和非正式投诉入口。这些公开入口不能证明投诉量异常，因为保留下来的公开来源没有披露 Curative
              专属投诉指数；但它说明，服务或理赔摩擦已经真实到会生成公开争议渠道。Curative 卖的是激进简化；营销承诺和真实就医体验哪怕只是小幅错位，也会放大声誉风险。
