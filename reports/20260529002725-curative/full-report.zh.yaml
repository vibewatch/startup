companyProfile:
  summary: >-
    Curative 成立于 2020 年，总部在 Austin，是一家雇主健康险公司，从公司的 COVID 检测基础设施转向以预防护理优先的团体健康计划模式。它给公众的产品承诺很简单：成员只要在规定入组窗口内完成年度 Baseline
    Visit，就可以使用网内护理，且无需 copays、deductibles 或 coinsurance。公开证据还支持一个创始人色彩很重的运营模式：CEO Fred Turner、CTO Isaac
    Turner、President/CFO Tami Wilson-Ciranna 领军，并在 2025-2026 年声称规模超过 1,200 家雇主客户、超过 165,000 名成员。
