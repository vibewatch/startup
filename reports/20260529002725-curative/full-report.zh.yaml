  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 为什么重要
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 雇主痛点真实
        - KFF、BGH、Aon 和 McKinsey 都显示，市场在寻找成本更低、体验更简单的替代方案。
        - 如果医疗成本趋势明显降温，或雇主停止比价采购，Curative 的需求溢价应收窄。
      - - 投资逻辑
        - Curative 确有牵引力
        - 现有记录支撑了一次真实融资、1,200+ 家雇主、165,000+ 名会员和 A- AM Best 路径。
        - 如果规模停滞或评级转弱，市场就不应再为叙事支付溢价。
      - - 投资逻辑
        - 从会员视角看，当前估值并不离谱
        - 按会员口径，Curative 高于 Oscar，但低于 Alignment/Clover。
        - 只有私下承保质量显著强于公开材料暗示时，这个视角才站得住。
      - - 反向逻辑
        - 公开承保证据缺失
        - 收入、MLR、准备金、续约队列和优先权条款是关键定价数据，目前仍未公开。
        - 一旦披露经审计经济性，这项反对意见会迅速减弱。
      - - 反向逻辑
        - 相邻公开公司和交易可比项便宜得多
        - eHealth、GoodRx 和 Accolade 显示，一旦持久护城河或盈利能力不清楚，数字健康估值可以跌得多深。
        - Curative 需要保险公司级证明，不能靠导航类估值逻辑摆脱那组折价。
      - - 反向逻辑
        - 法律和资产负债表意外仍可能出现
        - 持续诉讼和保险资本敏感性意味着下行不是纯理论。
        - 诉讼干净解决且评级支持持续，会收窄折价，但不会消除披露缺口。
    notes: 投资逻辑行解释为什么 Curative 值得认真看；反向逻辑行解释为什么这种关注仍要对价格敏感、靠尽调推进。
