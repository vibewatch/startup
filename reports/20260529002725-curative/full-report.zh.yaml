      - number: '2.5'
        title: 未解决的规模问题与尽调含义
        blocks:
          - type: paragraph
            body: >-
              两个尽调缺口比又一张泛化 TAM 图更重要。第一，Curative
              没有公开拆分新销售或续约中多少来自经纪人、多少来自直接雇主销售，尽管经纪人在相邻市场显然是门槛。第二，公开来源仍没有提供独立审计的前后理赔分析，证明 Curative 相比在位保险公司或 TPA 替代方案的
              PMPM 节省。公开证据方向上积极——成员会使用导航、经纪人报告相邻 ICHRA 市场有节省，管理层也在为全国扩张融资——但这仍不同于经审计的队列经济性。


              因此，相互矛盾的市场规模估计应保持可见，而不是被压成一个整齐数字。正确结论不是 Curative 可以确定服务一个 154 million、165.6 million 或 170 million
              生命数的市场；而是多个口径都识别出一个非常庞大的雇主覆盖基础，较近的可争夺核心则是其中 self-funded、level-funded 和寻求创新的切片。投资者应按这个更近切片承保 Curative，并要求证明
              Baseline 加导航模型能把续约痛点转化为持久切换，而不只是标题热度。
            claimRefs:
              - CM024
              - CM029
              - CM051
              - CM053
              - CM055
