      - number: '8.2'
        title: 可比边界与市场背景
        blocks:
          - type: paragraph
            body: >-
              推断 Curative 最干净的公开方法，不是假装我们有 ARR 倍数，而是把雇主市场需求背景与保险公司及邻近可比公司的估值视角合在一起。雇主成本仍承压：KFF 的 2025 年调查显示家庭保费为
              $26,993，Business Group on Health 预计 2026 年缓释前成本上涨 9%，Aon 指向人均超过 $17,000 后再上涨 9.5%，McKinsey 则认为许多雇主愿意为了 10%
              以上的节省更换承保方。成本背景解释了 Curative 的承诺为什么有共鸣。但公开可比公司并不都宽容。Oscar 的市值绝对值很大，但按会员口径偏轻；Alignment 和 Clover
              因为披露了更多运营证据，享有更高的保险公司式会员口径。邻近的分销和导航公司更严苛：eHealth 和 GoodRx 的公开市值都低于 $1.1 billion，Accolade 出售价格也只有约 1.5
              倍往绩收入。Sidecar、Devoted 等私募轮次显示，投资者愿意为差异化健康险叙事付费，但这些公司要么披露了更多经济性，要么会员规模比 Curative 公开规模大得多。
