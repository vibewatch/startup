  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任人或尽调路径
    rows:
      - - 经审计收入和 PMPM
        - 按州、产品和雇主队列拆分的 2025 年及 2026 年迄今收入
        - 没有这些数据，就撑不起可靠的收入或留存倍数。
        - 向财务索取董事会材料 / 经审计管理账。
      - - 医疗赔付率和准备金
        - 按州拆分的 MLR、理赔趋势、法定盈余、资本注入和准备金充足性
        - 这些指标决定 A- 叙事能否真正支撑本轮价格。
        - 审查监管申报、精算准备金备忘录和 AM Best 材料。
      - - 雇主续约
        - 按客户分群拆分的雇主总留存 / 净留存、队列续约率和会员增长
        - 只有会员数、缺少续约质量，会高估真实业务价值。
        - 索取队列文件和经纪渠道续约仪表盘。
      - - 股权结构表和优先权
        - Series B 持股、清算优先权、参与权、附函以及任何老股交易条款
        - 入场经济性不只看公开的投后估值。
        - 审查完整融资文件和股权结构表模型。
      - - 扩张经济性
        - 各州准备金需求、网络建设成本，以及 Mid-Atlantic 上线节奏
        - 扩张可能创造价值；如果新州定价偏低，也可能只会吃掉资本。
        - 索取上线模型、准备金分析和监管审批跟踪表。
      - - 法务和治理清理
        - 历史 JV 诉讼的进展、风险敞口和保险覆盖，以及当前董事会权利
        - 即便经营指标好看，治理意外也会让投资人要求更大的折价。
        - 获取诉讼备忘录、外部律师摘要和治理材料。
    notes: 这些尽调事项是把 Curative 从一轮有意思的融资，推进到可承销保险公司投资所需的最低材料包。
    claimRefs:
      - CV040
      - CV041
      - CV055
      - CV056
      - CV057
      - CV058
