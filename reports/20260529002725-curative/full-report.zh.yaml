  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 计划设计是核心产品层
        blocks:
          - type: paragraph
            body: >-
              Curative 当前的公开表面描述的是一个有引导的雇主健康计划，而不是独立软件产品。首页和雇主页面把 Curative 定位为围绕可负担性、参与度和简单性搭建的雇主赞助健康险；Texas、Florida 和
              Georgia 页面又把这个承诺包装成具体的州级报价。计划选项页面说明 Curative 并不只卖一个 SKU：它在 fully-insured 或 level-funded 资金轨道上暴露 EPO、PPO 和
              PPO Max 选项，再加入保费更低、以 Curative Pass 为锚的 guided-care 变体 EPO Value。这个组合重要，因为它揭示了 Curative 如何在公开层面差异化。切入点不是公开
              API 或深层理赔处理披露，而是低摩擦计划经济性、精选服务方导流和更简单的成员运营模式。Table TE001 映射可见产品模块，Figure FE001 展示商业设计层如何直接馈入成员、护理导航和运营层。
