              Curative 拥有的外部资本准备度证据多于真正公开的财务报表。AM Best 在 January 2023 给保险公司 A- financial strength rating 和 stable
              outlook，并明确表示预期 Curative 将把 BCAR 资本化维持在 strongest level，母公司资本注入对商业计划绰绰有余。Curative
              当前面向雇主的页面加入了更新但仍由公司控制的证据：公司称已在 2025 年连续第三次获得 A- 确认，且 Curative Inc. 向 Curative Insurance Company 注入 $100
              million 以强化子公司。December 2025 的 Series B 又增加了一层资本支持，管理层称融资将用于 Mid-Atlantic 扩张、AI-enabled 运营、网络 /
