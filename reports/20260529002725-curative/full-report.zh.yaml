  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与保险模式风险
        blocks:
          - type: paragraph
            body: >-
              Curative 已不再只是权益导航 startup；它运营的是一个类似保险公司的承诺，经济性和合规义务紧密相连。公开来源显示，计划架构包含以完成 Baseline Visit 为条件的网内 $0
              自付、正式申诉和投诉路径，以及 January 2026 同时触及可及性、服务方关系和成员沟通的网络迁移。最重要的监管风险，不是今天已知的执法行动，而是公司在从 Texas、Florida 和 Georgia 向
              Maryland 与 Washington, DC 扩张时，同时面对 MLR 规则、州级费率和 filing 义务、准备金需求的组合。CMS 和联邦规则文本明确，医疗支出低于最低标准时，发行方可能需要返还
              rebates；Texas 也仍要求及时提交 rate filings，并为受监管卡片保留投诉升级渠道。公开 AM Best 材料显示，Curative 从扎实的资产负债表和 ERM
              基础起步，但近期融资报道也称，新市场增长需要更多准备金，以满足监管机构并维持评级可信度。遗留 COVID
              合资诉讼本身并非生死问题，却提醒投资者，前一项业务的执行伤痕仍可能在案件恶化或糟糕和解时制造法律分心、discovery 负担和创始人可信度风险。
