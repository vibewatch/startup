        - Curative 叙事的外层边界，但太宽，不适合精确承保
      - - 大型雇主自保和混合资金计划
        - 由理赔资金支付的医疗支出、止损保险、ASO/TPA、网络准入、导航、照护管理
        - 没有风险承担要素的纯完全保险小团体续约
        - 雇主赞助方 / 雇主赞助方
        - 最接近的大型团体竞争场域，因为雇主已经接受定制化资金结构
      - - SMB 和中端市场完全保险或定额资金型团体计划
        - 固定保费、定额资金型理赔资金池、止损保险、经纪人佣金、会员支持
        - 没有雇主赞助的纯个人市场交易所购买
        - 雇主赞助方 / 雇主赞助方
        - 重要，因为 Curative 提供完全保险 PPO 和定额资金型选项
      - - ICHRA 和 QSEHRA 邻近市场
        - 雇主为 ACA 合规个人计划提供的津贴资金，加上管理和决策支持
        - 雇主保留的传统团体计划理赔风险
        - 雇主赞助方设定补贴 / 员工选择计划
        - 增长很快的邻近市场，正在训练雇主和经纪人重新审视传统团体计划默认选项
      - - 福利导航和倡导覆盖层
        - 与医疗福利绑定的照护导航、会员支持、透明度和决策支持服务
        - 不影响福利设计的独立健康管理应用
        - 雇主赞助方购买 / 员工使用
        - Curative 将导航打包进计划，而不是作为独立点解决方案销售
      - - 初级保健优先的计划设计
        - 预防性入门、PCP 参与、照护协调、低或零网内会员分摊成本
        - 没有照护模式改变、只做参照式成本转嫁
        - 雇主赞助方购买 / 员工使用
        - 这是 Curative 押注能降低下游成本并改善体验的具体设计
    notes: 边界逻辑把广义雇主保险与 Curative 今天真正能替代的更窄资金和计划设计选择分开。
