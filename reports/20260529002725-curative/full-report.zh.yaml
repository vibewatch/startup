  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开定价架构
        blocks:
          - type: paragraph
            body: >-
              Curative 的商业化模式比披露的财务报表更清楚。公司通过两种资金形式——fully-insured 和 level-funded——销售雇主健康覆盖，而不是靠 usage-based
              费用栈。公开页面反复把产品包装成一笔月度保费，以及年度 Baseline Visit 后网内 $0
              自付。这在财务上很重要，因为经济赌注不是成员会在服务点付费；而是保费充足性加上更好参与，可以让总理赔低于雇主或保险公司原本预期。level-funded 设计把这点说得很明确：Curative 管理计划、安排
              stop-loss，并把未使用理赔资金的 50% 返还给雇主。公开计划架构也显示 Curative 如何切分报价：EPO、PPO、PPO Max，以及保费更低的 EPO Value
              选项，成员导流和网外经济性差异很大。Curative 没有披露的是按雇主规模、行业、地域或计划类型划分的真实 PMPM，因此清楚可见的是表层计划结构，而不是真实收入兑现。
