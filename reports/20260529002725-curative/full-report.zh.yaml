      - number: '7.4'
        title: COVID 检测转型带来的执行风险与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Curative 的增长故事亮眼，但也把执行风险抬高。公司现在向市场传递的信息包括：雇主客户超过 1,200 家、会员超过 165,000 人、AM Best A- 评级路径，以及为继续全国扩张提供资金的
              2025 年 Series B。与此同时，公开访谈和报道仍把这家公司描述为一家 COVID 检测公司，只是在 2022 年秋季才转向保险公司运营。也就是说，Curative
              要在相对健康险公司标准很短的时间内，证明承保纪律、网络纪律和监管韧性。围绕 KorvaLabs 合资公司的公开法律记录说明，旧业务模式仍可能通过诉讼、管理层注意力和披露风险挤入新业务。关于初级保健参与度高
              20%、住院率低 30%
              以及药品成本更低的公开说法，方向上是利好，但来源是公司关联材料，而不是发行人层面的法定申报。投资者不应否定这个模式，而应把淘汰标准写清楚：持续的网络中断、遗留诉讼恶化、准备金薄弱或评级承压的证据，或者实际 MLR
              和投诉结果无法匹配营销逻辑，都应迅速改变承保判断。
