            body: >-
              Curative
              的财务故事在运营逻辑上强于披露深度。雇主面对保费通胀上行、对传统成本转嫁广泛不满，以及对替代设计、高级初级护理和高绩效网络兴趣升温；在这个市场里，该模式有差异化。公司的评级支持、新资本、扩张地域和声称盈利结合在一起，说明它不是脆弱试点。但仅靠公开材料仍无法承保：没有按产品披露的
              PMPM，没有公开 MLR 或 claims PMPM，没有法定资本比率，没有现金或 runway 披露，也没有队列级续约或留存数据。反向证据不至于打碎投资逻辑，但真实存在——BBB
              显示投诉记录小但非零，Curative 自己的 grievance 页面明确把未解决的保费和理赔争议导向 Texas Department of
              Insurance。因此，审慎的财务立场应是有条件的：Curative 似乎已经搭建了可信的雇主计划切入点，但尽调现在应立即从营销结果转向经审计的保险经济性。
