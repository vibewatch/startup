      - number: '2.2'
        title: 规模测算口径与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              最宽的公开口径仍是雇主赞助覆盖本身：KFF 将 2024 ESI 覆盖放在 154 million 名非老年人，Peterson-KFF 的 March 2025 时间点追踪器显示有 165.6 million
              人，即非老年人口的 60%，拥有 ESI。McKinsey 又给出更宽的商业市场口径，引用大约 170 million
              成员的商业市场。这些数字不应被压成一个虚假的精确估计；它们使用不同日期和分母，但合在一起定义了 Curative 讲增长故事时可以引用的市场外边界。


              更有决策价值的口径，是已经接受风险承担结构的雇主子集。DOL filing 数据显示，2023 年大型计划有 87.7 million 名参与者，其中 81.3% 已在 self-insured 或
              mixed-funded 安排中。这意味着大约 71.3 million 名参与者的核心市场，雇主已经在选择更定制化的资金模型。ICHRA 当前只有 450,000 到 one million
              人，具体取决于来源，但增长很快；它重要，因为它训练经纪人和雇主重新思考团体计划默认值。相对于任何一个外层口径，Curative 的 165,000-plus
              名成员仍很小，这也是为什么即便不假设英雄式市场份额，公司仍有显著空白可攻。
