    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品模式与覆盖范围
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Curative 应被描述为一家总部在 Austin 的雇主健康险公司。它的核心报价说起来异常简单，承保起来却更难：成员在前 120 days 内完成年度 Baseline Visit
              后，网内护理没有 copays、deductibles 或 coinsurance。公开记录更清楚地证明了这套机制，而不是它的经济性。官方
              Baseline、雇主和计划选项页面显示，公司把产品围绕雇主买家、成员入组和预防护理参与来搭建，而不是只做一个狭窄的权益导航功能。最强的转型证据也来自 Curative
              自己的过渡材料和后续采访，材料明确称公司已经从 COVID 检测转向雇主型健康计划。公开地域比公开收入更清晰：雇主材料指向当下的 Texas、Florida 和 Georgia，并把 Maryland 和
              Washington, DC 作为下一个显然的扩张目标；同时，公开计划文件显示员工可以在全国范围内获得覆盖。
