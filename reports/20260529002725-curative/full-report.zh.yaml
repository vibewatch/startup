            title: 经纪人与续约摩擦拖慢采用的力量，可能大于成员需求
            body: 雇主可能想要节省和更好体验，但候选名单权力仍主要在经纪人和顾问手里。这意味着 Curative 必须克服迁移风险、员工困惑和顾问惯性，而不只是纸面证明成本逻辑。
            calloutType: risk
