  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Curative 并不是在争夺全部美国医疗支出；它竞争的是雇主赞助覆盖这个场景。买家要决定，是继续使用高 deductible 或传统 fully insured 设计，转向 level-funded 或
              self-funded 替代方案，还是把覆盖与更主动的导航和预防参与结合。Curative 自己的材料把报价定义为雇主团体健康计划：完成必需的 Baseline visit 后，网内护理 $0，并配套护理导航和
              telehealth 支持。这使公司更接近创新型雇主计划设计，而不是纯权益导航软件或纯 ACA 个人市场分销。


              最重要的替代方案，是由在位保险公司和 TPA 管理的现状 PPO 续约，通常通过经纪人在年度续约周期中采购。较小雇主方面，ICHRA 和 QSEHRA
              是增长最快的相邻替代方案，因为它们让雇主控制支出上限，同时把计划选择外包给员工。较大雇主方面，更相关的比较集是 self-funded 或 mixed-funded
              团体覆盖，计划赞助方希望看到理赔可见度和更低趋势，同时不破坏员工可及性。因此，Curative 的挑战不是说服雇主购买健康险，而是说服他们用
              primary-care-first、导航很重的设计替换熟悉的续约机制。
