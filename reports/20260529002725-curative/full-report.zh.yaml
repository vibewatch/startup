      - number: '8.4'
        title: 承销本轮前的尽调关口
        blocks:
          - type: paragraph
            body: >-
              缺失的工作异常清楚。在以接近当前估值承销 Curative 之前，投资者应拿到经审计的 2025 年和 2026 年年初至今收入、医疗赔付率、法定盈余和 RBC 式资本指标、雇主续约队列、按产品和州划分的
              PMPM，以及 2025 年 Series B 附带的实际股权结构表条款。这些问题不是学术细节；它们决定 Curative 应享有溢价保险公司口径，还是因不透明而打折。下行监控也是同理。评级可信度是
              Curative 雇主健康计划叙事的核心，任何 AM Best
              降级、资本支持摇摆或准备金意外，都会立刻削弱估值支撑。同样，如果续约或医疗成本控制弱于当前营销叙事，合适估值锚会迅速下移，逼近公开可比公司底部。遗留诉讼本身不会击穿投资逻辑，但强化了更大的判断：这不是追求伪精确的案例。公司应进入高优先级观察名单；之后每一步都应由价格纪律和证据纪律主导。
