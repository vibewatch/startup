      - number: '7.2'
        title: 网络、合作伙伴与服务交付集中度
        blocks:
          - type: paragraph
            body: >-
              2026 年公开记录中最清晰的运营风险，是 Curative 更换了支撑可及性承诺的底盘。截至 January 1, 2026，服务方被告知公司不再通过 Aetna/First Health wrap
              network 签约，而是使用 Cigna Healthcare PPO Network 或 Curative Wrap Solution with HealthSmart
              Preferred。这可能是理性的升级，但也制造了一个可见集中点：成员满意度、服务方理赔流和经纪人信心，现在都依赖 Curative、Cigna 和 HealthSmart 之间多方交接成功。Curative
              自己的页面显示，公司也在推动 EPO Value 这样的精选网络产品，这可以改善经济性，但保留了一个剩余风险：当品牌承诺是「no copay, no
              deductible」时，目录准确性、转诊摩擦和窄可及性可能放大不满。公开合作伙伴页面进一步说明，这不是一个垂直闭合栈。Cigna 的服务方和经纪人 portals，以及 HealthSmart 的服务方
              onboarding 页面，都暗示公司实质依赖外部网络基础设施和分销表面。如果执行干净，这种依赖可管理；但一旦网络切换导致理赔拒付、医生缺失或扩张期间经纪人迟疑，严重性会迅速升高。
