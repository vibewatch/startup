  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、在位者、相邻玩家与现状
        blocks:
          - type: paragraph
            body: >-
              Curative 面前没有一个清晰的一对一对手。直接替代集包括 Centivo、Surest、Gravie Comfort 和 Sana，它们都承诺比传统雇主覆盖拥有更低日常摩擦或更低自付负担。Oscar
              在这个买家动作里更偏相邻而非直接竞争，因为其公开投资者口径聚焦 Individual & Family plans、ICHRA 和技术服务，而不是 self-funded 雇主替代逻辑。Collective
              Health 和 Accolade/Transcarent 进一步拓宽战场，让雇主可以在不更换底层保险公司的情况下修复管理、导航或虚拟护理痛点。在位者是最后一层：BCBS、Aetna、Cigna 和
              UnitedHealthcare 可以用窄网络或高绩效网络、value-based 产品和顾问友好的续约来回应同一份可负担性简报。这意味着 Curative
              同时在和直接同业、在位组合、相邻叠加层，以及雇主避免整体扰动的本能竞争。因此，现状不只是另一份保险公司报价；它还包括保留当前保险公司，叠加
              TPA、导航层或内部福利流程清理，而不是替换医疗计划。尽调时需要这个更宽框架，因为 Curative 只有在雇主认定痛点大到足以支撑计划级变化时才会赢。
