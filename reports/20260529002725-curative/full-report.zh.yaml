      - number: '2.4'
        title: 驱动因素、初级护理经济性与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              市场顺风并不隐晦。公开的 2026 雇主健康成本趋势估计从低端 6.7% 到高端大约 10%，同时药房和灾难性理赔压力也在恶化。Mercer、Business Group on Health、McKinsey 和
              UnitedHealthcare 即便具体数字不同，也都指向同一方向：雇主又要面对一年异常成本增长，不能只靠把成本转嫁给员工。这也是为什么超过 one-third 的大型雇主已经采用替代医疗计划，以及为什么
              two-thirds 的 McKinsey 受访者说愿意在 four years or less 内更换保险公司。


              初级护理是通胀背景下的战略差异点。Aon 认为，初级护理是雇主医疗中最未充分使用的杠杆，尽管超过 100 million 美国人缺乏可靠可及性，直接流向初级护理的支出低于 5%。CMS 的 Primary
              Care First 模型重要，因为它显示付款方、Medicare Advantage
              计划和商业保险公司愿意围绕上游预防和更低的下游使用来对齐支付。然而摩擦真实存在：雇主仍担心迁移复杂度、经纪人教育、员工困惑，以及 primary-care-first 承诺到底会不会转化为更低 PMPM
              趋势，而不只是改变使用时间点。
            claimRefs:
