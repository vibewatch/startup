        - 保险公司背书的方案，拥有全国网络并披露会员留存指标
        - 希望在熟悉保险公司关系内低摩擦采用的雇主
        - 仅定额自付设计、就医前比价、广泛的 UHC 分销
        - 如果雇主已有类似传统保险公司产品组合，差异化会降低
      - - Gravie Comfort
        - 直接同业 / SMB-中端市场挑战者
        - 面向经纪人和较小雇主的平准筹资产品
        - 寻求零成本常规照护体验的中小型雇主
        - 多数常见照护零成本覆盖，不采用传统免赔额逻辑
        - 并非所有服务都是零成本，企业级规模证明也更薄
      - - Sana Benefits
        - 直接同业 / SMB 挑战者
        - 现代小企业方案和管理平台，声称拥有全国网络
        - 优先考虑无成本照护和简单管理的小企业
        - 无成本照护路径、无网络外费用、集成 Sana Care
        - 公开证据最强的是 SMB 获客路径，而不是大型自筹资竞争
      - - Oscar Health
        - 相邻数字保险公司
        - 上市公司，拥有 3.2M 会员和 $11.7B 的 2025 年收入
        - 关注科技驱动保险和 ICHRA 式替代方案的买方
        - 技术前置的保险公司品牌，并有公开经营披露
        - 公开业务组合更像 Curative 的相邻业务，而不是清晰的自筹资替代方案
      - - Collective Health / Accolade-Transcarent
        - 相邻替代品
        - 独立 TPA 和导航平台；Accolade-Transcarent 称有 1,400+ 客户
        - 希望升级管理、导航或虚拟照护，但不更换保险公司的雇主
        - 不用要求雇主替换核心医疗风险，也能缓解福利痛点
        - 无法复制 Curative 的完整医疗方案设计
      - - BCBS / Aetna / Cigna 传统产品
        - 传统在位者与现状方案
        - 庞大的医疗服务方和顾问覆盖、宽产品包、全国信任基础
        - 优先考虑广度、熟悉度和低切换风险的买方
        - 广泛 PPO、窄网络、高绩效网络、分析工具和集成保险公司项目
        - 员工可负担性往往仍接近免赔额沉重的现状
    notes: 这些行按解决方案形态分组，因为雇主常比较类别，而不是单一品牌。公开规模或融资信号只代表方向，因为私营公司披露不均衡。
