        title: 单位经济代理指标、规模与降本逻辑
        blocks:
          - type: paragraph
            body: >-
              Curative 的单位经济性案例围绕成本预防，而不是消费者 cost sharing。公司材料和后续报道都重复同一条因果链：要求 Baseline
              Visit、提高初级护理参与、更早干预，并降低下游住院和药品支出。管理层公开数字方向上很强——根据一篇 2026 年采访，初级护理参与提升 20%，住院下降 30%，药品成本最多降低 40%，Baseline
              完成率 98%——但这些都是公司发起或管理层报告的数字，不是独立审计的赔付率披露。规模已经真实到值得关注：Curative 称拥有超过 1,200 家雇主客户和超过 165,000
              名成员，意味着每家雇主客户平均大约 138 名成员，尽管分布可能很宽。外部市场数据说明雇主为什么愿意测试替代模型：KFF 的 2024 雇主调查显示，单人覆盖平均年保费为 $8,951，家庭覆盖为
              $25,572；McKinsey 和 Business Group on Health 都指向 2026 年趋势压力接近 high-single 到 low-double digits。这个背景支持
              Curative 承诺的需求，但公开证据仍没有揭示 CAC、医疗赔付率、毛利率或真实留存。
