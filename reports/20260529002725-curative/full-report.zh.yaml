  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 向投资逻辑传导
      - 行动含义
    rows:
      - - AM Best 恶化
        - 下调评级、展望转负，或有证据显示母公司支持不再充足
        - Curative 失去支撑保险公司可信度的少数独立锚点之一。
        - 按悲观区间重新定价，停止任何激进入场。
      - - 准备金或法定资本落空
        - 私下尽调显示盈余偏弱、RBC 式缓冲薄，或扩张资本需求过大
        - 当前估值不再像增长溢价，而像准备金不足风险。
        - 没有大幅价格重设，就不要跟投该轮。
      - - 续约或增长放缓
        - 雇主续约转弱，或会员增长显著低于计划
        - 会员口径上行情景破裂，因为固定保险基础设施的杠杆降低。
        - 将估值拉近 Oscar 式底部。
      - - 后续融资压力
        - 承保证明出现前，需要桥接融资、结构化资本或平轮 / 下轮
        - 当前轮次作为最佳市场出清信号的可信度下降。
        - 视为硬性不利标记，重审股权结构稀释。
      - - 法务 / 治理升级
        - 历史诉讼扩大、以高成本和解，或暴露治理问题
        - 任何治理打击都会放大故事里已有的披露折价。
        - 在事项关闭前，维持或加深估值折价。
    notes: 这些是投资逻辑破裂触发项，不是泛化运营风险；每一项都会直接改变估值视角， 而不只是给执行增添背景信息。
    claimRefs:
