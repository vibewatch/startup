        - 经审计的承保证明，或更低价格
        - MLR、法定资本、雇主留存和干净的股权条款仍缺失
        - 只有尽调补上这些缺口，或价格降至约 $0.8B-$0.9B，才转为建设性看法。
    notes: 本表刻意面向投资决策，而不是做描述性汇总；判断取决于价格支撑、披露质量和保险公司经济性， 不只是公司质量。
