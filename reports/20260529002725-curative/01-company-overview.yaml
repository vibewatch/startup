      "title": "Curative has a coherent, unusually legible insurer thesis",
      "body": "The public story hangs together: Curative is not merely promising cheaper health insurance, it is explicitly betting that removing cost friction and forcing an early Baseline Visit will change member behavior enough to lower downstream acuity. That logic is consistent across the employer page, the Baseline materials, and 2025-2026 interviews, which is unusually crisp for a young insurer.",
