    {
      "id": "capital-base-and-stakeholders",
      "title": "Funding history, valuation, and stakeholder map",
      "body": "Curative’s public financing picture is now strong enough to anchor the rest of the report, but it remains incomplete in exactly the places an investor would care about most. The retained record supports a total funding figure of roughly $162 million from Tracxn and a clearly documented 2025 Series B of more than $150 million at a $1.275 billion valuation. Multiple sources converge on the latest investor stack: Upside Vision Fund led, Justin Mateen and JAM Fund contributed heavily, and the disclosed backer list also includes Galaxy Digital, Duquesne Family Office, DCVC, and Martin Varsavsky. That is useful because it means the current unicorn narrative is not resting on a single reposted press release. At the same time, the public evidence does not close the loop on board rights, liquidation preferences, ownership concentration, or the rumored involvement of General Atlantic, Tao Capital, or Dorilton Ventures. Those names are better treated as diligence asks than as facts. Economically, the clearest non-capital stakeholders are employer clients, members, and AM Best, because member counts and rating credibility are the most reusable public signals for later chapters.",
