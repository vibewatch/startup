  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Curative is a 2020-founded, Austin-based employer health insurer that pivoted out of COVID testing and now markets a Baseline-gated $0 out-of-pocket in-network plan. Public evidence strongly supports the 2025 Series B at a $1.275 billion valuation, more than 1,200 employer clients, and a visible AM Best rating path, but current headcount, revenue, board rights, and some rumored investor attributions remain under-disclosed. The main adverse signal is legacy COVID-joint-venture litigation plus the normal complaint and appeals surfaces that come with operating as a real insurer."
  },
  "sections": [
    {
      "id": "identity-product-and-footprint",
      "title": "Identity, product model, and footprint",
      "body": "Curative should be described in 2026 as an Austin-based employer health insurer whose core offer is unusually simple to state but harder to underwrite: in-network care with no copays, deductibles, or coinsurance if the member completes an annual Baseline Visit within the first 120 days. The public record supports the mechanism more clearly than it supports the economics. Official Baseline, employer, and plan-options pages show that the company has built the product around employer buyers, member onboarding, and preventive-care engagement rather than around a narrow benefits-navigation feature. The strongest retained pivot evidence also comes from Curative’s own transition materials and later interviews, which explicitly say the company has moved on from COVID testing to an employer-based health plan. Public geography is clearer than public revenue: employer materials point to Texas, Florida, and Georgia today, with Maryland and Washington, DC as the next obvious expansion targets, while employees can be nationwide under the public plan documents.",
