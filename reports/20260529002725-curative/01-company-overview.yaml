    {
      "id": "milestones-and-adverse-context",
      "title": "Milestones, rating path, and adverse context",
      "body": "The milestone trail shows a company that moved quickly from pandemic infrastructure into insurer status and then into large-scale fundraising. The key dated anchors are the 2020 founding year, rapid COVID-era operational scale, the September 2022 employer-plan launch in the Austin area, AM Best’s initial January 2023 rating assignment, and the December 2025 unicorn round. The same chronology also shows why chapter 1 cannot be purely celebratory. The retained UniCourt record demonstrates that Curative’s COVID-test history still throws off legal heat through the KorvaLabs / Jonathan Martin dispute, including allegations around fraudulent inducement and contract obligations. BBB and Curative’s own appeal materials add a softer but still relevant operational signal: this is a real insurer with dispute intake, provider appeals, and public complaint surfaces, not just a clean software brand. The net is that Curative’s top-line company story is credible and well capitalized, but the diligence stance should remain disciplined because the public narrative relies heavily on company-claimed operating outcomes and because some of the hardest risk questions sit behind private files.",
