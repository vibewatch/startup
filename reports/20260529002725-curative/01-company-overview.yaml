    {
      "calloutType": "risk",
      "title": "The public record is stronger on narrative and financing than on core private operating metrics",
      "body": "The chapter can support valuation, round size, member count, and rating path, but not exact current headcount, revenue, ARR, renewal quality, or cap-table rights. That matters because a prevention-first insurer can look compelling on top-line membership while still hiding reserve pressure, loss-ratio volatility, or concentrated customer exposure.",
      "claimRefs": [
        "CO018",
        "CO019",
        "CO021",
        "CO026",
        "CO027",
        "CO029"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Legacy COVID-era litigation belongs in company-overview, not just legal diligence",
      "body": "The UniCourt record shows that Curative’s pandemic operating history still throws legal shadows into the current story. The case does not prove company-wide misconduct, but it is material because it involves Fred Turner, a 2020 testing-related joint venture, and allegations around economic alignment and promised equity — precisely the kind of founder-history issue that can resurface in a later financing or control dispute.",
