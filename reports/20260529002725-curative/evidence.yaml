evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: >-
      Current board roster, committee structure, voting rights, and investor governance terms for the post-Series-B
      company.
    whyItMatters: >-
      Leadership concentration is visible, but governance rights determine how much control the founding team still
      holds and how financing risk is allocated.
    diligencePath: >-
      Request the current board list, investor-rights summary, charter documents, and the latest cap-table / option-pool
      schedule from management.
    relatedQuestionRefs:
      - QO009
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: private-operating-metrics
    missingEvidence: Exact current headcount, revenue, ARR, medical loss ratio, and cohort renewal / retention metrics as of runDate.
    whyItMatters: >-
      Public member counts and valuation are not enough to judge insurer economics, reserve adequacy, or whether the
      prevention thesis is working commercially.
    diligencePath: >-
      Obtain the latest board pack or KPI dashboard with membership by cohort, headcount, revenue / ARR, loss ratios,
      and renewal data.
    relatedQuestionRefs:
      - QO020
      - QO021
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: investor-rumor
    missingEvidence: >-
      Authoritative cap-table evidence confirming or disproving rumored involvement by General Atlantic, Tao Capital, or
      Dorilton Ventures.
    whyItMatters: >-
      The public sources retained for this chapter name a different investor set, so repeating the rumor without
      cap-table evidence would overstate financing support.
    diligencePath: >-
      Ask management for the post-Series-B cap table or signed investor list and reconcile it against Tracxn plus the
      company’s own round materials.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: complaint-disposition
    missingEvidence: >-
      Normalized complaint-volume data, regulator complaint outcomes, and final case disposition for the retained
      litigation items.
    whyItMatters: >-
      Chapter 1 can show that legal and complaint surfaces exist, but not whether they are isolated noise or a
      persistent operational pattern.
    diligencePath: >-
      Pull state insurance complaint logs, internal grievance-rate reporting, and outside counsel summaries of the
      KorvaLabs / Martin-Toutov matters.
    relatedQuestionRefs:
      - QO025
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: broker-channel-mix
    missingEvidence: >-
      Curative does not publicly disclose how much 2026 new business or renewals come through brokers versus direct
      employer selling.
    whyItMatters: >-
      Broker control is a gating variable in this market, so missing channel-mix data makes it hard to forecast scalable
      distribution efficiency or concentration risk.
    diligencePath: >-
      Request new-logo wins, renewal wins, and premium volume by broker, consultant, and direct channel for 2025-2026,
      including top-producer concentration and retention.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: audited-savings
    missingEvidence: >-
      Public materials do not provide an independent, cohort-level PMPM savings study comparing Curative customers with
      incumbent carrier or TPA alternatives.
    whyItMatters: >-
      Without audited savings evidence, it is difficult to separate compelling product narrative from durable
      underwriting and utilization economics.
    diligencePath: >-
      Request a third-party validated before-and-after claims analysis covering at least 12-24 months of pre/post
      migration experience, including high-cost claimant cohorts and retention outcomes.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: market-size-denominator
    missingEvidence: >-
      No public source reconciles the 154.0M, 165.6M, 170.0M, and 71.3M covered-life lenses into one Curative-eligible
      denominator.
    whyItMatters: >-
      The broad market is clearly large, but valuation work should anchor on a denominator that matches Curative's
      actual funding model, employer size focus, and geography.
    diligencePath: >-
      Build a custom denominator by employer size, funding model, and geography using underwriting-eligible covered
      lives rather than generic employer-sponsored coverage counts.
    relatedQuestionRefs:
      - QM001
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: public-pricing-transparency
    missingEvidence: >-
      Comparable broker quote decks or anonymized employer proposals showing PMPM, admin fees, stop-loss assumptions and
      implementation fees across Curative, Centivo, Surest, Gravie and Sana.
    whyItMatters: >-
      Public sources make package design visible but not the real commercial economics, so the pricing table is
      directional rather than underwriteable.
    diligencePath: >-
      Request broker rate sheets or anonymized finalist proposals for each vendor and normalize on employer size,
      geography and funding mode.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost-metrics
    missingEvidence: >-
      Cohort-level data on implementation timelines, Baseline Visit completion, re-enrollment, migration lift and
      avoided attrition after employers adopt Curative or direct peers.
    whyItMatters: >-
      Moat durability depends on whether the plans stick after launch, not just on how attractive the public product
      story sounds.
    diligencePath: >-
      Ask management and brokers for launch dashboards, retention cohorts, and post-implementation utilization
      comparisons versus prior carrier designs.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: head-to-head-win-loss-data
    missingEvidence: >-
      Named finalist processes, broker post-mortems or win-loss summaries comparing Curative directly against Surest,
      Centivo, Gravie or incumbent carrier alternatives.
    whyItMatters: >-
      The public record supports competitor categories, but it does not show where Curative is consistently winning or
      losing in live procurement.
    diligencePath: >-
      Review ten recent late-stage employer evaluations with broker notes, finalist scorecards and the specific reason
      Curative won or lost.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: eligibility-and-geography
    missingEvidence: >-
      A clean matrix of current employer-size floors, state availability and funding-mode boundaries for Curative,
      Centivo, Surest, Gravie and Sana.
    whyItMatters: >-
      Official surfaces are uneven and sometimes inconsistent, which can distort which vendors truly compete for the
      same employer buyer at a given size and geography.
    diligencePath: >-
      Confirm active market maps and minimum-group rules with current broker or sales-rep emails and update the profile
      table with exact boundaries.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: realized-pricing
    missingEvidence: Realized employer PMPM, PEPM, and renewal pricing by fully-insured versus level-funded cohort and by plan SKU.
    whyItMatters: List-plan architecture is visible, but actual pricing quality and revenue concentration are not.
    diligencePath: Request sold-case census, broker quote sheets, renewal files, and employer-level premium history.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Current cash balance, monthly burn, debt facilities, and 12- to 18-month liquidity forecast.
    whyItMatters: >-
      Without liquidity data, investors cannot tell whether recent capital raises created durable runway or only
      temporary reserve support.
    diligencePath: Request latest balance sheet, debt schedule, board runway pack, and management operating forecast.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: claims-ratio-and-medical-loss
    missingEvidence: Claims PMPM, MLR, IBNR methodology, and trend by state, funding type, and cohort.
    whyItMatters: These are the core underwriting metrics needed to test whether zero-cost-sharing plans are economically durable.
    diligencePath: Request actuarial reserve memo, monthly claims triangles, MLR bridge, and rate-development files.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-cohort-maturity
    missingEvidence: >-
      Employer renewal rates, member retention, net growth by cohort, and concentration of members across large
      accounts.
    whyItMatters: A health-plan thesis depends on proving first-year onboarding results persist into mature cohorts.
    diligencePath: Request retention dashboard, renewal pricing file, and concentration report by top employer group.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: pharmacy-and-specialty-exposure
    missingEvidence: Pharmacy PMPM, specialty-drug mix, rebate structure, and GLP-1 exposure by employer cohort.
    whyItMatters: >-
      External employer surveys show pharmacy has become a major cost driver, so Curative’s drug-cost claims need hard
      numbers.
    diligencePath: Request Rx claims trend deck, specialty-drug utilization, and PBM economics.
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: developer-surface-gap
    missingEvidence: >-
      Public API references, engineering docs, repository links, release notes, or architecture diagrams that explain
      Curative’s software stack and interfaces.
    whyItMatters: >-
      Without a true developer or architecture surface, diligence can map workflows and dependencies but cannot validate
      implementation depth, change control, or platform extensibility.
    diligencePath: >-
      Request private architecture docs, interface inventories, release-management materials, and any external
      integration specs used by providers, employers, or telehealth partners.
    relatedQuestionRefs:
      - QE019
      - QE020
      - QE025
  - type: access-blocked
    severity: minor
    topic: android-gap
    missingEvidence: >-
      A live public Google Play listing for the Curative member app that matches the public app page’s consumer
      distribution story.
    whyItMatters: >-
      The public app surface clearly supports iOS, but Android parity is not inspectable from the run, which weakens
      confidence in cross-platform member distribution.
    diligencePath: >-
      Ask Curative for the current Android package name or managed distribution path and verify whether Android access
      is public, private-MDM, or simply not shipped.
    relatedQuestionRefs:
      - QE018
  - type: missing-source
    severity: material
    topic: public-reliability-history
    missingEvidence: >-
      A publicly accessible status page, incident archive, uptime history, or trust center that reveals reliability
      performance over time.
    whyItMatters: >-
      Operational tooling is visible, but without public reliability history an outside reviewer cannot distinguish a
      polished workflow surface from a well-instrumented service operation.
    diligencePath: >-
      Request uptime reports, incident postmortems, support SLAs, and trust-center materials; if a status page exists
      privately, ask for historical exports.
    relatedQuestionRefs:
      - QE015
      - QE025
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Portfolio-level NRR, GRR, logo churn, renewal rate, and retention cohorts by employer size, state, and broker
      channel.
    whyItMatters: >-
      Curative has strong onboarding proof, but without renewal cohorts there is no public way to tell whether the book
      is sticky or simply fast-growing.
    diligencePath: >-
      Request quarterly retention cohorts, renewal calendars, and member or employer churn data segmented by market and
      channel.
    relatedQuestionRefs:
      - QU015
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
