  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Curative's highest residual risks are network and partner concentration after the January 1, 2026 cutover away from Aetna/First Health, underwriting and medical-loss-ratio exposure on a $0 out-of-pocket plan, privacy and complaint escalation across a multi-affiliate PHI stack, and lingering litigation from the COVID-testing era. The mitigants are real—AM Best support, formal grievance and HIPAA processes, HITRUST certification, and fresh capital—but public evidence still does not disclose Curative's actual 2025-2026 MLR, rebate history, issuer-specific complaint index, partner concentration by broker or network vendor, or final resolution economics for the KorvaLabs dispute."
  },
  "sections": [
    {
      "title": "Regulatory, legal, and insurance-model risk",
      "body": "Curative is no longer just a benefits-navigation startup; it is operating an insurer-like promise whose economics and compliance obligations are tightly linked. Public sources show a plan architecture with $0 out-of-pocket in-network care conditioned on Baseline Visit completion, formal appeal and complaint pathways, and a January 2026 network transition that touches access, provider relations, and member communications at the same time. The most important regulatory risk is not a known enforcement action today but the combination of MLR rules, state rate and filing obligations, and reserve needs while the company expands beyond Texas, Florida, and Georgia toward Maryland and Washington, DC. CMS and federal rule text make clear that issuers can owe rebates when medical spending falls below minimum standards, while Texas still expects timely rate filings and maintains complaint escalation channels for regulated cards. Public AM Best materials show Curative started from a solid balance-sheet and ERM base, but recent funding coverage also says new-market growth requires more reserves to satisfy regulators and preserve rating credibility. The legacy COVID-joint-venture lawsuit is not existential on its own, yet it is a reminder that execution scars from the prior business can still generate legal distraction, discovery burden, and founder-credibility risk if the case worsens or settles badly.",
