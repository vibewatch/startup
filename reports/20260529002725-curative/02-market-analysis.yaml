- id: SM003
  title: Buyer, payer, and distribution mechanics
  body: |-
    The buyer path is multi-actor rather than single-threaded. Budget authority usually sits with CFO, finance, or HR leadership, but shortlist formation is heavily broker- and consultant-mediated. Deloitte still sees employers prioritizing price and network stability even while demanding more flexible coverage, and Acrisure explicitly describes more movement in broker relationships as renewals get harder. That means Curative must win not only an employer but also the advisor who frames the choice set and explains migration risk.

    The payer and user also split. In traditional group coverage, the employer sets the contribution strategy and the employee lives with the resulting network and benefit design. In ICHRA, the employer contributes a fixed stipend while the employee chooses among ACA options. Curative sits between those models: it keeps the employer-sponsored frame, but its care-navigation, Baseline onboarding, and $0 in-network logic ask members to behave more like active participants than passive enrollees. Zorro's ICHRA data and Curative's own testimonials both suggest guided choice matters: workers value help understanding plans, and brokers care about whether the network disruption is manageable and whether employees actually engage.
  claimRefs:
  - CM025
  - CM028
  - CM041
  - CM046
  - CM049
  - CM050
