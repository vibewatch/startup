callouts:
- calloutType: strength
  title: Self-funded whitespace is real even before counting the whole ESI market
  body: |-
    DOL's large-plan filing data implies a roughly 71.3 million participant self- or mixed-funded core, while Curative was reported at 165,000-plus members in March 2026. Even if Curative never wins the entire employer-sponsored market, the gap between current scale and the already risk-bearing employer base is still enormous.
  claimRefs:
  - CM008
  - CM017
  - CM018
  - CM052
- calloutType: risk
  title: Broker and renewal friction can slow adoption more than member demand
  body: |-
    Employers may want savings and better experience, but shortlist power still sits heavily with brokers and consultants. That means Curative must overcome migration risk, employee confusion, and advisor inertia—not just prove its cost thesis on paper.
  claimRefs:
  - CM025
  - CM032
  - CM046
  - CM050
- calloutType: insight
  title: Curative is selling a financing-plus-navigation bundle, not only a cheaper plan
  body: |-
    The market structure matters because Curative's design is inseparable from the Baseline visit, care navigation, and primary-care engagement. In a market where pharmacy trend, catastrophic claims, and chronic disease are driving costs, that bundled model is the differentiator investors should test.
  claimRefs:
  - CM003
  - CM005
  - CM036
  - CM038
  - CM044
