tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Employer-sponsored group coverage (broad ESI)
    - Employer-paid and employee-paid premiums or claims funding for job-based medical coverage
    - Medicare, Medicaid, ACA individual coverage bought without employer funding
    - Employer sponsor / employer plus worker contribution
    - Outer boundary for Curative's narrative, but too broad for precise underwriting
  - - Large-employer self-insured and mixed-funded plans
    - Claims-funded medical spend, stop-loss, ASO/TPA, network access, navigation, care management
    - Purely fully insured small-group renewals with no risk-bearing element
    - Employer sponsor / employer sponsor
    - Closest large-group competitive arena because employers already accept customized funding structures
  - - SMB and mid-market fully insured or level-funded group plans
    - Fixed premiums, level-funded claims buckets, stop-loss, broker commissions, member support
    - Pure individual-market exchange purchasing without employer sponsorship
    - Employer sponsor / employer sponsor
    - Important because Curative offers fully insured PPO and level-funded options
  - - ICHRA and QSEHRA adjacency
    - Employer stipend funding for ACA-compliant individual plans plus administration and decision support
    - Traditional group-plan claims risk retained by employer
    - Employer sponsor sets allowance / employee chooses plan
    - Fast-growing adjacency that trains employers and brokers to revisit legacy group-plan defaults
  - - Benefits navigation and advocacy overlay
    - Care-navigation, member-support, transparency, and decision-support services tied to medical benefits
    - Standalone wellness apps with no benefit-design implications
    - Employer sponsor buys / employee uses
    - Curative bundles navigation into the plan rather than selling it as a separate point solution
  - - Primary-care-first plan design
    - Preventive onboarding, PCP engagement, care coordination, low or zero in-network member cost share
    - Reference-only cost shifting with no care-model change
    - Employer sponsor buys / employee uses
    - This is the specific design Curative is betting can lower downstream cost and improve experience
  notes: Boundary logic separates broad employer coverage from the narrower funding and plan-design choices
    Curative can actually displace today.
