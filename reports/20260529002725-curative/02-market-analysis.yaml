company:
  name: Curative
chapter:
  number: 2
  title: Market Analysis
  summary: |-
    Curative sits inside the U.S. employer-sponsored coverage market but should not be underwritten against the entire category. The broad public lenses range from 154.0 million to 170.0 million covered lives, while the more decision-useful core is the roughly 71.3 million participants already in self-insured or mixed-funded large plans. Market pressure is real: public 2026 employer-health cost-trend estimates span 6.7% to 10.0%, brokers are actively evaluating alternatives, and primary care plus navigation are becoming product features rather than optional overlays. The main diligence question is not whether the market is large, but whether Curative can convert renewal pain into broker-supported switching with audited savings evidence.
sections:
- id: SM001
  title: Market boundary and substitutes
  body: |-
    Curative is not competing for all U.S. healthcare spending; it is competing inside employer-sponsored coverage where the buyer is deciding whether to keep a high-deductible or traditional fully insured design, shift into a level-funded or self-funded alternative, or pair coverage with more active navigation and preventive engagement. Curative's own materials frame the offer as a group health plan for employers with $0 in-network care after a required Baseline visit, plus care navigation and telehealth support. That places the company closer to innovative employer-plan design than to pure benefits-navigation software or pure ACA individual-market distribution.

    The most important substitutes are status-quo PPO renewals administered by incumbent carriers and TPAs, usually purchased through brokers on annual renewal cycles. For smaller employers, ICHRA and QSEHRA are the fastest-moving adjacent alternatives because they let employers cap spend while outsourcing plan choice to employees. For larger employers, the more relevant comparison set is self-funded or mixed-funded group coverage, where plan sponsors want claims visibility and lower trend without breaking employee access. Curative's challenge is therefore less about convincing employers to buy health insurance at all and more about convincing them to replace familiar renewal mechanics with a primary-care-first, navigation-heavy design.
  claimRefs:
  - CM002
  - CM003
  - CM005
  - CM006
  - CM009
  - CM028
  - CM051
  tableRefs:
  - TM001
- id: SM002
  title: Sizing lenses and contradictory estimates
  body: |-
    The broadest public lens is still employer-sponsored coverage itself: KFF puts 2024 ESI at 154 million nonelderly people, while Peterson-KFF's March 2025 point-in-time tracker shows 165.6 million people, or 60% of the nonelderly population, with ESI. McKinsey adds an even broader commercial-market lens by referencing a roughly 170 million member commercial market. Those numbers should not be collapsed into one fake precision estimate; they use different dates and denominators, but together they define the outer boundary of the market Curative can reference when telling a growth story.

    The more decision-useful lens is the subset of employers already comfortable with risk-bearing structures. DOL filing data shows 87.7 million participants in large plans in 2023, with 81.3% already in self-insured or mixed-funded arrangements. That implies a roughly 71.3 million participant core where employers are already choosing more customized funding models. ICHRA is much smaller at a current 450,000 to one million people depending on the source, but it is growing quickly and matters because it conditions brokers and employers to rethink group-plan defaults. Curative's 165,000-plus members remain tiny relative to any of these outer lenses, which is why the company still has significant whitespace even without assuming heroic market-share outcomes.
  claimRefs:
  - CM008
  - CM010
  - CM011
  - CM017
  - CM018
  - CM022
