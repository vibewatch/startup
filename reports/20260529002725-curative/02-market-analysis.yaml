- id: SM005
  title: Unresolved sizing and diligence implications
  body: |-
    Two diligence gaps matter more than another generic TAM graphic. First, Curative does not publicly break out how much of new sales or renewals arrive through brokers versus direct employer selling, even though brokers are clearly a gate in adjacent markets. Second, public sources still do not provide an independently audited before-and-after claims analysis showing Curative's PMPM savings versus incumbent carrier or TPA alternatives. The public evidence is directionally positive—members engage with navigation, brokers report savings in adjacent ICHRA markets, and management is funding national expansion—but it is still not the same as audited cohort economics.

    The contradictory market-size estimates should therefore remain visible rather than being collapsed into a neat number. The right takeaway is not that Curative serves a $154 million-, $165.6 million-, or $170 million-life market with certainty; it is that multiple lenses identify a very large employer-coverage base, while the nearer contestable core is the self-funded, level-funded, and innovation-seeking slice inside it. Investors should underwrite Curative against that nearer slice and require proof that the Baseline plus navigation model can convert renewal pain into durable switching, not just headline attention.
