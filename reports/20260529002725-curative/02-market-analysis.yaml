  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: broker-channel-mix
    missingEvidence: Curative does not publicly disclose how much 2026 new business or renewals come through
      brokers versus direct employer selling.
    whyItMatters: Broker control is a gating variable in this market, so missing channel-mix data makes
      it hard to forecast scalable distribution efficiency or concentration risk.
    diligencePath: Request new-logo wins, renewal wins, and premium volume by broker, consultant, and
      direct channel for 2025-2026, including top-producer concentration and retention.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: audited-savings
    missingEvidence: Public materials do not provide an independent, cohort-level PMPM savings study comparing
      Curative customers with incumbent carrier or TPA alternatives.
    whyItMatters: Without audited savings evidence, it is difficult to separate compelling product narrative
      from durable underwriting and utilization economics.
    diligencePath: Request a third-party validated before-and-after claims analysis covering at least
      12-24 months of pre/post migration experience, including high-cost claimant cohorts and retention
      outcomes.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
  - type: conflicting-data
    severity: minor
    topic: market-size-denominator
    missingEvidence: No public source reconciles the 154.0M, 165.6M, 170.0M, and 71.3M covered-life lenses
      into one Curative-eligible denominator.
    whyItMatters: The broad market is clearly large, but valuation work should anchor on a denominator
      that matches Curative's actual funding model, employer size focus, and geography.
    diligencePath: Build a custom denominator by employer size, funding model, and geography using underwriting-eligible
      covered lives rather than generic employer-sponsored coverage counts.
    relatedQuestionRefs:
    - QM001
    - QM002
    relatedTableRefs:
    - TM002
