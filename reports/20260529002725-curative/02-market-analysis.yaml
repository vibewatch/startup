- id: SM004
  title: Drivers, primary care economics, and switching frictions
  body: |-
    The market tailwind is not subtle. Public 2026 employer-health cost-trend estimates run from 6.7% at the low end to roughly 10% at the high end, while pharmacy and catastrophic-claim pressure are worsening at the same time. Mercer, Business Group on Health, McKinsey, and UnitedHealthcare all point in the same direction even when their exact numbers differ: employers are facing another year of abnormal cost growth and cannot rely only on employee cost shifting. That is why more than one-third of large employers have already implemented alternative medical plans and why two-thirds of McKinsey respondents say they are willing to switch carriers within four years or less.

    Primary care is the strategic differentiator inside that inflationary backdrop. Aon argues that primary care is the most underused lever in employer healthcare, even as more than 100 million Americans lack reliable access and less than 5% of spending flows directly to primary care. CMS's Primary Care First model matters because it shows payers, Medicare Advantage plans, and commercial insurers are willing to align payment around upstream prevention and lower downstream utilization. The friction, however, is real: employers still worry about migration complexity, broker education, employee confusion, and whether a primary-care-first promise actually translates into lower PMPM trend rather than just different utilization timing.
  claimRefs:
  - CM031
  - CM033
  - CM036
  - CM038
  - CM039
  - CM040
  - CM043
