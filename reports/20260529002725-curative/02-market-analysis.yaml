- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Employer health-cost inflation remains elevated
    - Driver
    - Current through 2026
    - Creates urgency for employers to consider alternatives rather than absorb another renewal cycle
    - Verify Curative win rates when renewal increases exceed high-single digits
  - - Pharmacy and catastrophic claims pressure
    - Driver
    - Current
    - Makes preventive engagement, specialty management, and cost transparency more valuable
    - Request PMPM claims decomposition before and after Curative migration
  - - Primary care is underfunded despite chronic-disease burden
    - Driver
    - Structural
    - Supports Curative's thesis that upstream engagement can lower downstream costs
    - Request independent outcomes data on utilization and avoidable admissions
  - - Self-funded and level-funded adoption is widening by employer size
    - Driver
    - Current
    - Expands the portion of employers willing to consider customized funding and design
    - Test which segments Curative wins most often by case size and funding history
  - - Broker-led renewals slow change
    - Constraint
    - Current
    - Distribution remains consultative, so product merit alone does not close sales
    - Request broker productivity and top-producer concentration data
  - - Employee confusion during plan change
    - Constraint
    - Current
    - Switching creates member-experience risk if onboarding and navigation are weak
    - Review Baseline completion, activation, and complaint rates by cohort
  - - ICHRA growth expands alternative-funding awareness
    - Driver and substitute
    - Current
    - Validates employer appetite for alternatives but also offers a different route to fixed spend
    - Assess whether Curative loses small groups to ICHRA rather than to incumbent PPOs
  - - Lack of audited public savings studies
    - Constraint
    - Persistent until disclosed
    - Limits how aggressively investors can underwrite trend reduction claims
    - Demand independently validated savings, retention, and satisfaction cohorts
  notes: Driver and constraint labels reflect market direction, not certainty; each row is framed around
    whether it accelerates or slows adoption of Curative-like alternatives.
