      - Member
      - Provider
      - Employer sponsor
      touchpoints:
      - Provider search
      - Telehealth
      - Cash Card
      - Renewal decision
      emotion: Convenience can improve stickiness, but public renewal proof remains thin.
      label: Use and renew
