- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Mid-Atlantic expansion beyond TX/FL/GA
    - Employer book is still geographically concentrated in a small set of states
    - Network, regulatory, and sales execution risk remain locally concentrated
    - Request employer, member, and revenue mix by state plus launch cohorts for new markets
  - - Broker-led distribution
    - Growth may depend on broker enablement and human channel management rather than purely product-led demand
    - Channel concentration could hide inside broker relationships even if logo count looks broad
    - Request broker productivity, win rates, and revenue share by top producers
  - - Cash Card and provider nomination model
    - Operational complexity and provider education burden may rise with scale even if the model improves member convenience
    - Support costs or provider confusion could slow broader rollout
    - Request Cash Card utilization, dispute rates, and provider acceptance by market
  - - Thin public reference set versus 1,200+ client claim
    - Curated named proof may overstate representativeness of the broader book
    - A few strong references do not rule out hidden concentration or weak retention elsewhere
    - Request top-20 customer schedule, tenure, lives covered, and a fuller reference pack
  notes: This table combines disclosed expansion signals with unresolved concentration and operating-friction questions that public materials do not fully answer.
