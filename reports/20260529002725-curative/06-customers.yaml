- id: durability-and-concentration-gaps
  title: Durability, expansion, and concentration gaps
  body: Durability and concentration are where the customer chapter stays incomplete. Public materials strongly suggest a workable land-and-expand story—new geographies, broker enablement, reusable employer guides, portal workflows, provider nomination, and member engagement tools—but they do not disclose NRR, GRR, renewal rates, average contract term, or top-account concentration. That gap matters because insurer economics can look diversified in member count while still relying heavily on a few brokers, a few large employer groups, or a narrow state footprint. Curative's current employer footprint is still concentrated in Texas, Florida, and Georgia, with Mid-Atlantic expansion discussed but not yet broad enough to remove state concentration risk. The public reference set is also curated relative to the claimed client base, and even the strongest references remain mostly company-managed or benefits-guide driven rather than independently renewed cohorts. Investors should therefore read Curative's customer story as strong on onboarding design and existence proof, but only moderate on renewal visibility and concentration
    transparency.
  claimRefs:
  - CU014
  - CU015
  - CU024
  - CU035
  - CU036
