    - SBC proves deployment, not health outcomes or retention
  - - ECS Holdings
    - Employer testimonial
    - Official employer testimonial focused on network continuity and service support
    - Production testimonial
    - President says Curative preserved previous doctors and specialists and helped provider offices file paperwork correctly
    - Company-curated testimonial with no contract value, renewal term, or covered-life count
  notes: Rows include the deepest named proofs retained during this run; public proof is real but much narrower than the reported 1,200+ employer base.
