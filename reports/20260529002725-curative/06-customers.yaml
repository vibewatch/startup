- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: Curative’s adoption path is not just quote-to-card issuance; it includes employer setup, Baseline completion, and ongoing care-tool usage.
  data:
    nodes:
    - id: interest
      label: Broker or employer interest
      detail: A broker or employer sponsor evaluates state availability, size thresholds, and plan design.
    - id: setup
      label: Employer setup
      detail: Employer admins and brokers configure enrollment, guides, and card distribution.
    - id: onboard
      label: Member onboarding
      detail: Members receive guides, cards, portal access, and app entry points.
    - id: baseline
      label: Baseline completion
      detail: Members meet a Care Navigator and clinician within 120 days to preserve the flagship economics.
    - id: care
      label: Live care usage
      detail: Provider search, telehealth, pharmacy, and Cash Card workflows drive day-to-day usage.
    - id: renew
      label: Renew / expand
      detail: Renewal, state expansion, and broader account rollout depend on support quality and measurable outcomes.
    edges:
    - from: interest
      to: setup
      label: Employer selects Curative through broker or direct sales motion
    - from: setup
      to: onboard
      label: Cards, guides, and portal access are distributed
    - from: onboard
      to: baseline
      label: Members must activate the economics of the plan
    - from: baseline
      to: care
      label: Members use providers, telehealth, pharmacy, and Cash Card flows
    - from: care
      to: renew
      label: Satisfaction and support quality influence renewal or expansion
