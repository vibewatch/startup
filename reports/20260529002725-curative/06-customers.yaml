- id: named-customer-proof
  title: Named customer proof and deployment maturity
  body: 'Named customer proof is real, but it is mostly embedded in employer enrollment documents and curated testimonials rather than in a wide library of independent case studies. TEAM, Inc.''s 2026 guide, Hill County''s 2025-2026 booklet, and Allied Stone''s employer-specific SBC all show Curative in production enrollment materials, not in hypothetical pilots. Those documents prove different things. TEAM shows an industrial employer with a dedicated Curative URL and integrated pharmacy and telemedicine workflows. Hill County shows annual Baseline renewal behavior and portal-based member management in a public-sector setting. Allied Stone shows Curative issuing employer-specific plan terms for a named company. Curative''s own testimonial surfaces add softer but still relevant proof. ECS Holdings describes network continuity and hands-on service, while a leading Texas benefits broker says a large group''s employees became unusually engaged. The issue is representativeness: these are credible
    proofs of use, but still a tiny window into a 1,200+ employer claim.'
  claimRefs:
