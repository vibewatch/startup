company:
  name: Curative
chapter:
  number: 6
  title: Customers
  summary: 'Curative has real public customer proof for an employer-sponsored insurer, but the proof is much stronger on adoption mechanics than on durability economics. Employer guides from TEAM, Hill County, and Allied Stone plus curated ECS Holdings and broker testimonials show live deployments, while Curative’s own materials and outside coverage support 1,200+ employer clients and 165,000+ members. The underwriting gap is retention and concentration: public materials still do not disclose NRR, GRR, renewal rates, or top-account concentration, so durability rests on Baseline completion, member-tool usage, and mixed review signals rather than published cohorts.'
sections:
- id: segment-mix-and-buyer-journey
  title: Segment mix, buyer roles, and go-to-market surfaces
  body: Curative's public customer map is easier to understand through the employer, broker, and member workflow than through any clean customer cohort table. The company is clearly selling an employer-sponsored group plan, usually with broker involvement, to headquartered employers in Texas, Florida, and Georgia with 51+ employees, while promising that employees can still be covered nationwide and that Maryland and Washington, DC are next. The buyer and payer are the employer sponsor and its benefits function, sometimes with a broker shaping the decision; the daily user is the employee or dependent who has to complete Baseline, use the member portal or app, search providers, and navigate care. That matters because Curative is not marketing only a low-premium card. It is selling a service-and-engagement model built around Baseline activation, digital cards, Care Navigators, telehealth, provider search, and Cash Card workflows. Public plan pages also show multiple funding and network configurations
    rather than one narrow SKU.
  claimRefs:
