- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / evidence
  - Limitation
  rows:
  - - TEAM, Inc.
    - Industrial services employer
    - Curative medical option inside 2026 employee benefits guide with dedicated provider and pharmacy workflow
    - Production
    - Public guide names Curative, gives a TEAM-specific provider URL, and embeds Baseline, telemedicine, and pharmacy flows
    - No disclosed covered lives, premium spend, or renewal KPI
  - - Hill County
    - Public-sector county employer
    - County benefits guide with Curative medical coverage, member portal access, and annual Baseline process
    - Production
    - Public booklet shows Baseline renewal, Curative programs, and member support surfaces inside county enrollment materials
    - No public employee take-rate, claims trend, or satisfaction data
  - - Allied Stone, Inc.
    - Smaller employer / manufacturing-adjacent
    - Employer-specific PPO Max summary of benefits and coverage
    - Production
