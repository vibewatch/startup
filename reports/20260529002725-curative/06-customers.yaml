  layout: standard
  summary: Curative creates value only when a broker or employer sponsor, an employer administrator, and the member all adopt connected onboarding and care workflows.
  data:
    items:
    - stage: Broker + employer evaluation
      actors:
      - Broker
      - HR / benefits lead
      - Finance sponsor
      touchpoints:
      - Broker page
      - Employer page
      - Plan-options page
      - FAQ
      emotion: Interest is driven by predictability, simplicity, and network breadth.
      label: Evaluate fit
    - stage: Employer setup
      actors:
      - Employer admin
      - Broker
      - Curative account team
      touchpoints:
      - Employer portal
      - Benefits guide
      - Enrollment file setup
