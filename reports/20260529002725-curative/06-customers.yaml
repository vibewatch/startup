  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public proof
  - Scale / availability
  - Gap
  rows:
  - - Headquartered large employers in core states
    - 'Buyer/Payer: employer sponsor and benefits team; User: employees and dependents'
    - Employer page, employer FAQ, broker FAQ
    - Texas, Florida, and Georgia headquarters; 51+ employees; Maryland/DC coming soon
    - No public split by fully-insured versus level-funded customer count
  - - Broker-led employer accounts
    - 'Buyer: broker plus employer; User: employer admins and members; Payer: employer sponsor'
    - Broker page, broker FAQ, broker testimonial
    - Producer sign-up flow and broker-specific FAQ are public
    - No disclosed commission schedule, close rate, or broker concentration
  - - Industrial and field-services employers
    - 'Buyer/Payer: employer HR or benefits lead; User: employees and dependents'
    - TEAM guide and Allied Stone SBC
    - Named proof across industrial services and a smaller employer SBC
    - No spend, lives covered, or renewal terms disclosed
  - - Public-sector county employer
    - 'Buyer/Payer: county administration; User: county employees and dependents'
    - Hill County benefits guide
    - Annual enrollment and renewal workflow visible in public booklet
    - Only one public-sector named proof was retained in this run
  - - Member-side digital users
    - 'Buyer: employer at sale; User: members in app and portal; Payer: employer plus employee premiums'
    - Members page, app page, member guide
    - Digital cards, provider search, Cash Card, telehealth, wellness programs
    - No MAU, app retention, or portal engagement metrics disclosed
  notes: Segment mapping combines Curative surfaces with named employer documents; public evidence is good on buyer workflow and geography but weak on revenue mix by segment.
