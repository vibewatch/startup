- id: member-adoption-and-satisfaction-proxies
  title: Adoption trajectory and member experience proxies
  body: Adoption proxies are better than durability metrics. Curative's late-2025 fundraising materials said the insurer served more than 1,200 employer clients and 165,000 members, and Healthcare Brew later repeated the 165,000+ member figure while adding a striking 98% Baseline-completion claim. Member-use surfaces are also tangible. Curative's app and member guide show digital ID cards, real-time benefits, provider search, telehealth, Care Navigation, pharmacy tools, and the two-card Member ID plus Cash Card model. That is stronger than a generic insurer brochure because it implies real post-enrollment behavior after the sale. Yet the public satisfaction picture is mixed. Apple's App Store rating is positive but based on a very small sample, while BBB reviews are sharply negative and complaints cover medication denials, balances, and service issues. The result is a customer base that appears real and operationally engaged, but still under-disclosed on institutional-quality satisfaction
    and renewal metrics.
  claimRefs:
