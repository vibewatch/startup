summary:
  headline: >-
    Curative has a credible employer-plan wedge, real 2025 financing validation, and enough public member scale to stay
    on the watchlist, but the current $1.275 billion mark still looks stretched because audited underwriting, reserve,
    and renewal data remain private.
  overallScore: 5.8
