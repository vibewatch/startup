    "title": "Valuation",
    "summary": "Curative's December 2025 $1.275 billion Series B is real and well supported, and the public record also supports 1,200+ employer clients, 165,000+ members, and an A- AM Best rating path. But public evidence still omits the underwriting data that actually prices an insurer, so the current mark looks stretched versus a cautious $0.8 billion to $1.2 billion base band; recommendation: track, confidence low, risk high."
  },
  "sections": [
    {
      "id": "current-mark-and-public-proof",
      "title": "Current mark and public proof",
      "body": "Curative's current valuation anchor is not rumor-level: the December 2025 Series B is well covered by company and independent sources, and those sources converge on a $1.275 billion post-money mark, more than $150 million of new capital, more than 1,200 employer clients, more than 165,000 members, and a claim of profitability. That is enough to treat the current price as a real market signal rather than as an unverifiable database whisper. The quality of support becomes thinner as soon as the analysis shifts from fundraising optics to underwriting economics. Curative's public file gives investors product simplicity and rating support—the Baseline-gated $0 out-of-pocket design, fully insured and level-funded options, and an A- / a- AM Best path—but it still does not disclose the actual insurer metrics that should drive price: revenue, medical loss ratio, statutory surplus, reserve adequacy by state, employer renewal behavior, or preference-stack terms. In other words, the financing is real, the operating wedge is plausible, and the rating matters, but price support still depends on evidence the public record does not yet provide.",
