companyProfile:
  summary: >-
    Curative is a 2020-founded, Austin-based employer health insurer that pivoted out of
    the company's COVID-testing infrastructure into a preventive-care-first group health
    plan model. Its public product promise is simple: members can use in-network care with
    no copays, deductibles, or coinsurance if they complete an annual Baseline Visit in
    the required onboarding window. Public evidence also supports a founder-heavy operating
    model led by CEO Fred Turner, CTO Isaac Turner, and President/CFO Tami Wilson-Ciranna,
    plus 2025-2026 scale claims of more than 1,200 employer clients and more than 165,000
    members.
  foundedDate: '2020-01-01'
  founders:
    - name: Fred Turner
      role: Co-founder & Chief Executive Officer
      background: >-
        Public biographies and interviews position Turner as the main strategist and public
        narrator of Curative's pivot from COVID testing to employer health insurance.
      claimRefs:
        - CO012
    - name: Isaac Turner, PhD
      role: Co-founder & Chief Technology Officer
      background: >-
        Curative's leadership materials describe Isaac Turner as the architect of the
        insurer stack and Curative Cash Card tooling.
      claimRefs:
        - CO013
    - name: Tami Wilson-Ciranna
      role: Co-founder, President & Chief Financial Officer
      background: >-
        Public leadership materials assign Wilson-Ciranna responsibility for finance,
        legal, claims, network, and pharmacy operations.
      claimRefs:
        - CO014
  foundingLocation: Austin, Texas, United States
  headquarters: Austin, Texas, United States
  productSummary: >-
    Employer health insurance plans sold in fully insured and level-funded formats, built
    around a Baseline Visit requirement that unlocks $0 in-network copays, deductibles, and
    coinsurance, plus member onboarding, provider-network, and care-navigation workflows.
  customerFocus: >-
    Employer buyers and brokers seeking lower-cost, simpler group health coverage for
    employees and dependents; the public scale narrative centers on 1,200+ employer clients
    and 165,000+ covered members.
  businessModel: >-
    Curative earns premium revenue from employer-sponsored health plans and competes on a
    simplified benefit design that aims to steer members into preventive care early. Public
    materials show fully insured and level-funded options, but the core underwriting metrics
    that would prove profitability remain private.
  stage: Late-stage private (Series B, December 2025)
  fundingStatus: >-
    Public sources strongly support a December 2025 Series B of more than $150 million at a
    $1.275 billion valuation. Tracxn separately lists roughly $162 million across three
    public rounds, but earlier-round detail, ownership concentration, and preference terms
    remain incomplete in the public record.
