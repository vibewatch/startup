summary:
  headline: >-
    Curative has a credible employer-plan wedge, real 2025 financing validation, and enough
    public member scale to stay on the watchlist, but the current $1.275 billion mark still
    looks stretched because audited underwriting, reserve, and renewal data remain private.
  overallScore: 5.8
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1275
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 162
    customerCount: 165000
    headcount: null
  topStrengths:
    - >-
      Clear product wedge: Curative's Baseline-gated $0 in-network out-of-pocket design is a
      distinctive employer-plan message versus traditional carrier complexity.
    - >-
      Real financing validation: multiple sources support the December 2025 Series B of more
      than $150 million at a $1.275 billion valuation.
    - >-
      Visible public scale: the retained public record supports more than 1,200 employer
      clients and more than 165,000 members.
    - >-
      Rating credibility: AM Best assigned Curative Insurance Company an A- financial strength
      rating and a- issuer rating, which matters for brokers, employers, and regulators.
  topRisks:
    - >-
      Public insurer economics are still missing: audited revenue, medical loss ratio,
      reserve adequacy, statutory capital detail, and renewal cohorts are not disclosed.
    - >-
      Valuation looks stretched relative to the public evidence base; the current mark asks
      investors to underwrite unseen insurer math.
    - >-
      Key-person and governance risk remain meaningful because public disclosure is founder-
      heavy and does not provide a current board or rights map.
    - >-
      Legacy COVID-era legal overhang and ongoing complaint or appeal surfaces show Curative
      is not a frictionless software story.
    - >-
      Multi-state expansion still depends on network adequacy, regulatory execution, and the
      company's ability to control medical costs without public proof yet available.
  unresolvedGaps:
    - >-
      Audited 2025 and year-to-date 2026 revenue, medical loss ratio, reserve, and capital
      adequacy data are not public.
    - >-
      Employer renewal cohorts, member retention, and product-mix economics by state remain
      undisclosed.
    - >-
      The public record does not show the current board roster, investor rights, or
      liquidation preferences tied to the 2025 Series B.
    - >-
      Public sources do not support a verified current headcount or precise unit-economics
      bridge.
    - >-
      Earlier funding history and total capital raised remain only partially visible through
      third-party databases rather than complete primary documentation.
