  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Curative is not competing for all U.S. healthcare spending; it is competing inside employer-sponsored
              coverage where the buyer is deciding whether to keep a high-deductible or traditional fully insured
              design, shift into a level-funded or self-funded alternative, or pair coverage with more active navigation
              and preventive engagement. Curative's own materials frame the offer as a group health plan for employers
              with $0 in-network care after a required Baseline visit, plus care navigation and telehealth support. That
              places the company closer to innovative employer-plan design than to pure benefits-navigation software or
              pure ACA individual-market distribution.


              The most important substitutes are status-quo PPO renewals administered by incumbent carriers and TPAs,
              usually purchased through brokers on annual renewal cycles. For smaller employers, ICHRA and QSEHRA are
              the fastest-moving adjacent alternatives because they let employers cap spend while outsourcing plan
              choice to employees. For larger employers, the more relevant comparison set is self-funded or mixed-funded
              group coverage, where plan sponsors want claims visibility and lower trend without breaking employee
              access. Curative's challenge is therefore less about convincing employers to buy health insurance at all
              and more about convincing them to replace familiar renewal mechanics with a primary-care-first,
              navigation-heavy design.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM009
              - CM028
              - CM051
          - type: table
            tableRef: TM001
