      - number: '4.2'
        title: Unit economics proxies, scale, and cost-out thesis
        blocks:
          - type: paragraph
            body: >-
              Curative’s unit-economics case is built around cost prevention rather than consumer cost sharing. Company
              materials and later coverage all repeat the same causal chain: require the Baseline Visit, increase
              primary-care engagement, intervene earlier, and lower downstream hospitalization and drug spend.
              Management’s public numbers are directionally strong—a 20% increase in primary-care engagement, a 30%
              reduction in hospitalizations, up to 40% lower drug costs, and a 98% Baseline completion rate according to
              a 2026 interview—but all of these are company-originated or management-reported, not independently audited
              loss-ratio disclosures. Scale is real enough to matter: Curative says it has more than 1,200 employer
              clients and more than 165,000 members, implying an average of roughly 138 members per employer client,
              though the distribution could be very wide. External market data show why employers are willing to test
              alternative models: KFF’s 2024 employer survey put average annual premiums at $8,951 for single coverage
              and $25,572 for family coverage, while McKinsey and Business Group on Health both point to 2026 trend
              pressure near the high-single to low-double digits. That backdrop supports demand for Curative’s promise,
              but public evidence still stops short of revealing CAC, medical loss ratio, gross margin, or realized
              retention.
