      - number: '2.5'
        title: Unresolved sizing and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Two diligence gaps matter more than another generic TAM graphic. First, Curative does not publicly break
              out how much of new sales or renewals arrive through brokers versus direct employer selling, even though
              brokers are clearly a gate in adjacent markets. Second, public sources still do not provide an
              independently audited before-and-after claims analysis showing Curative's PMPM savings versus incumbent
              carrier or TPA alternatives. The public evidence is directionally positive—members engage with navigation,
              brokers report savings in adjacent ICHRA markets, and management is funding national expansion—but it is
              still not the same as audited cohort economics.


              The contradictory market-size estimates should therefore remain visible rather than being collapsed into a
              neat number. The right takeaway is not that Curative serves a $154 million-, $165.6 million-, or $170
              million-life market with certainty; it is that multiple lenses identify a very large employer-coverage
              base, while the nearer contestable core is the self-funded, level-funded, and innovation-seeking slice
              inside it. Investors should underwrite Curative against that nearer slice and require proof that the
              Baseline plus navigation model can convert renewal pain into durable switching, not just headline
              attention.
            claimRefs:
              - CM024
              - CM029
              - CM051
              - CM053
              - CM055
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Self-funded whitespace is real even before counting the whole ESI market
            body: >-
              DOL's large-plan filing data implies a roughly 71.3 million participant self- or mixed-funded core, while
              Curative was reported at 165,000-plus members in March 2026. Even if Curative never wins the entire
              employer-sponsored market, the gap between current scale and the already risk-bearing employer base is
              still enormous.
            calloutType: strength
            claimRefs:
              - CM008
              - CM017
              - CM018
              - CM052
          - type: callout
            title: Broker and renewal friction can slow adoption more than member demand
            body: >-
              Employers may want savings and better experience, but shortlist power still sits heavily with brokers and
              consultants. That means Curative must overcome migration risk, employee confusion, and advisor inertia—not
              just prove its cost thesis on paper.
            calloutType: risk
            claimRefs:
              - CM025
              - CM032
              - CM046
              - CM050
          - type: callout
            title: Curative is selling a financing-plus-navigation bundle, not only a cheaper plan
            body: >-
              The market structure matters because Curative's design is inseparable from the Baseline visit, care
              navigation, and primary-care engagement. In a market where pharmacy trend, catastrophic claims, and
              chronic disease are driving costs, that bundled model is the differentiator investors should test.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM036
              - CM038
              - CM044
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and status quo'
        blocks:
          - type: paragraph
            body: >-
              Curative does not face one clean one-for-one rival. The direct replacement set includes Centivo, Surest,
              Gravie Comfort and Sana, each of which promises lower everyday friction or lower out-of-pocket burden than
              traditional employer coverage. Oscar is more adjacent than direct in this buyer motion because its public
              investor framing centers on Individual & Family plans, ICHRA and technology services rather than a
              self-funded employer replacement thesis. Collective Health and Accolade/Transcarent widen the field
              further by letting employers fix administration, navigation or virtual-care pain without changing the
              underlying carrier. Incumbents remain the final layer: BCBS, Aetna, Cigna and UnitedHealthcare can answer
              the same affordability brief with narrower or high-performance networks, value-based products, and
              consultant-friendly renewals. That means Curative is competing against direct peers, incumbent bundles,
              adjacent overlays and the employer instinct to avoid disruption altogether. The status quo is therefore
              not just another carrier quote; it also includes keeping the current carrier and adding a TPA, navigation
              layer or internal-benefits-process cleanup rather than replacing the medical plan. For diligence purposes,
              that broader frame matters because Curative only wins when an employer decides the pain is significant
              enough to justify plan-level change.
