      - number: '8.3'
        title: Scenario framing and recommendation
        blocks:
          - type: paragraph
            body: >-
              The current round implies about $7,700 per disclosed member, which is much richer than Oscar's
              public-member lens but still below Alignment's and well below Clover's Canadian-dollar member lens. That
              positioning is the core reason not to call Curative obviously absurd at $1.275 billion—but it is also the
              reason not to call it cheap. The public evidence can justify a wide range, not a precise target. A bear
              outcome around $0.35 billion to $0.7 billion fits a world where Curative's missing underwriting
              disclosures eventually look closer to lower-multiple public or adjacent outcomes, or where reserve needs,
              renewals, or legal complications force a reset. A base band around $0.8 billion to $1.2 billion gives
              credit for demand, simplicity, ratings support, and real employer traction while still applying a discount
              for missing economics. A bull case of roughly $1.4 billion to $2.2 billion exists, but only if private
              diligence shows Alignment-like underwriting discipline, durable growth, and capital adequacy. That is why
              the right call today is track with low-to-medium conviction rather than buy: the company may be good, but
              the price still asks investors to trust too much unseen insurer math.
