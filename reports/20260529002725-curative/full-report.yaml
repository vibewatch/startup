            body: >-
              Curative's public customer map is easier to understand through the employer, broker, and member workflow
              than through any clean customer cohort table. The company is clearly selling an employer-sponsored group
              plan, usually with broker involvement, to headquartered employers in Texas, Florida, and Georgia with 51+
              employees, while promising that employees can still be covered nationwide and that Maryland and
              Washington, DC are next. The buyer and payer are the employer sponsor and its benefits function, sometimes
              with a broker shaping the decision; the daily user is the employee or dependent who has to complete
              Baseline, use the member portal or app, search providers, and navigate care. That matters because Curative
              is not marketing only a low-premium card. It is selling a service-and-engagement model built around
              Baseline activation, digital cards, Care Navigators, telehealth, provider search, and Cash Card workflows.
