  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Curative’s monetization model is clearer than its disclosed financial statements. The company sells
              employer health coverage through two funding formats—fully-insured and level-funded—rather than through a
              usage-based fee stack. Public pages repeatedly frame the product around one monthly premium and zero
              in-network out-of-pocket cost after the annual Baseline Visit. That is financially important because the
              economic bet is not that members will pay at the point of service; it is that premium sufficiency plus
              better engagement can keep aggregate claims below what the employer or insurer would otherwise expect. The
              level-funded design makes that explicit: Curative administers the plan, arranges stop-loss, and offers
              employers a 50% rebate of unused claims funds. Public plan architecture also shows how Curative segments
              the offer: EPO, PPO, PPO Max, and a lower-premium EPO Value option, all with very different member
              steering and out-of-network economics. What Curative does not disclose is the realized PMPM by employer
              size, industry, geography, or plan type, so list-plan structure is visible but actual revenue realization
              is not.
