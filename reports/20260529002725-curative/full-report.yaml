              detail: Filing delays or state approval slippage
            - label: Medium Likelihood
              tone: neutral
              detail: Complaint backlog erodes trust without formal enforcement
            - label: Low-Medium Likelihood
              tone: neutral
              detail: Founder-centric scaling stretches operating bench depth
        - label: Lower Impact
          values:
            - label: Low Likelihood
              tone: positive
              detail: Provider tools absorb the cutover cleanly
            - label: Low Likelihood
              tone: positive
              detail: AM Best support and capital cushion reduce near-term solvency concern
            - label: Low Likelihood
              tone: positive
              detail: HITRUST and NPP updates prevent visible incident escalation
            - label: Low Likelihood
              tone: positive
              detail: Legacy litigation stays contained and non-strategic
    caption: >-
      Residual risk is concentrated in the intersection of a live network cutover, insurer-economics uncertainty, and
      visible legal and privacy escalation paths.
