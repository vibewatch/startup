      - number: '7.4'
        title: Execution risk from the COVID-testing pivot and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Curative's growth story is impressive, but it also sharpens execution risk. The company now tells the
              market it has more than 1,200 employer clients, over 165,000 members, an A- AM Best rating path, and a
              2025 Series B that funds further national growth. At the same time, public interviews and coverage still
              frame the business as a COVID-testing company that pivoted into insurer operations only in fall 2022. That
              means the business is trying to prove underwriting discipline, network discipline, and regulatory
              durability on a timeline that is short by health-plan standards. The public legal record around the
              KorvaLabs joint venture shows the old business model can still intrude on the new one through litigation,
              management attention, and disclosure risk. Public claims about 20% higher primary-care engagement, 30%
              lower hospitalizations, and lower drug costs are directionally encouraging, but they come from
              company-linked sources rather than issuer-level statutory filings. For investors, the right posture is not
              to dismiss the model but to make the kill criteria explicit: sustained network disruption, an ugly turn in
              the legacy litigation, evidence of weak reserves or rating pressure, or proof that actual MLR and
              complaint outcomes do not match the marketing thesis should all change the underwriting case quickly.
