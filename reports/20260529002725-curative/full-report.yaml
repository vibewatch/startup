      - number: '1.1'
        title: Identity, product model, and footprint
        blocks:
          - type: paragraph
            body: >-
              Curative should be described in 2026 as an Austin-based employer health insurer whose core offer is
              unusually simple to state but harder to underwrite: in-network care with no copays, deductibles, or
              coinsurance if the member completes an annual Baseline Visit within the first 120 days. The public record
              supports the mechanism more clearly than it supports the economics. Official Baseline, employer, and
              plan-options pages show that the company has built the product around employer buyers, member onboarding,
              and preventive-care engagement rather than around a narrow benefits-navigation feature. The strongest
              retained pivot evidence also comes from Curative’s own transition materials and later interviews, which
              explicitly say the company has moved on from COVID testing to an employer-based health plan. Public
              geography is clearer than public revenue: employer materials point to Texas, Florida, and Georgia today,
              with Maryland and Washington, DC as the next obvious expansion targets, while employees can be nationwide
              under the public plan documents.
