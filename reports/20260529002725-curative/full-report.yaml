  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited revenue and PMPM
        - 2025 and YTD 2026 revenue by state, product, and employer cohort
        - Without it, no reliable revenue or retention multiple can be defended.
        - Request board deck / audited management accounts from finance.
      - - Medical loss ratio and reserves
        - MLR, claims trend, statutory surplus, capital contributions, and reserve adequacy by state
        - These metrics determine whether the A- story really supports the round price.
        - Review statutory filings, actuarial reserve memos, and AM Best package.
      - - Employer renewals
        - Gross and net employer retention, cohort renewal rates, and member growth by client segment
        - A member count without renewal quality can overstate true franchise value.
        - Request cohort file and broker-channel renewal dashboard.
      - - Cap table and preferences
        - Series B ownership, liquidation preferences, participation rights, side letters, and any secondary-sale terms
        - Entry economics depend on more than headline post-money valuation.
        - Review full financing docs and cap-table model.
      - - Expansion economics
        - State-by-state reserve needs, network build cost, and timing for Mid-Atlantic launch
        - Expansion can create value or simply consume capital if new states are underpriced.
        - Request launch models, reserve analysis, and regulatory approval tracker.
      - - Legal and governance cleanup
        - Status, exposure, and insurance coverage for legacy JV litigation plus current board rights
        - Governance surprises can tighten the discount even if operating metrics look good.
        - Get litigation memo, outside-counsel summary, and governance package.
    notes: >-
      These asks are the minimum package needed to turn Curative from an interesting round into an underwritten insurer
      investment.
    claimRefs:
      - CV040
      - CV041
      - CV055
      - CV056
