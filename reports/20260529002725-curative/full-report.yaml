        - KFF, BGH, Aon, and McKinsey all show a market looking for lower-cost and simpler alternatives.
        - If medical-cost trend cools sharply or employers stop shopping, Curative's demand premium should narrow.
      - - Thesis
        - Curative has real traction
        - >-
          The current record supports a real financing event, 1,200+ employers, 165,000+ members, and an A- AM Best
          path.
        - If scale stalls or the rating weakens, the market should stop paying a premium for the narrative.
      - - Thesis
        - Current mark is not insane on a member lens
        - Curative sits above Oscar but below Alignment/Clover on member-based framing.
        - This lens only holds if private underwriting quality is materially stronger than the public file suggests.
      - - Anti-thesis
        - Public underwriting evidence is missing
        - >-
          Revenue, MLR, reserves, renewal cohorts, and preference terms are the key price-setting data and they are
          still private.
        - Disclose audited economics and this objection weakens quickly.
      - - Anti-thesis
        - Adjacent public and transaction comps are much cheaper
        - >-
          eHealth, GoodRx, and Accolade show how far digital-health valuations can fall when durable moat or
          profitability is unclear.
        - Curative needs insurer-grade proof, not navigation-style valuation logic, to escape that discount set.
      - - Anti-thesis
