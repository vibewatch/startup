      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              The broadest public lens is still employer-sponsored coverage itself: KFF puts 2024 ESI at 154 million
              nonelderly people, while Peterson-KFF's March 2025 point-in-time tracker shows 165.6 million people, or
              60% of the nonelderly population, with ESI. McKinsey adds an even broader commercial-market lens by
              referencing a roughly 170 million member commercial market. Those numbers should not be collapsed into one
              fake precision estimate; they use different dates and denominators, but together they define the outer
              boundary of the market Curative can reference when telling a growth story.


              The more decision-useful lens is the subset of employers already comfortable with risk-bearing structures.
              DOL filing data shows 87.7 million participants in large plans in 2023, with 81.3% already in self-insured
              or mixed-funded arrangements. That implies a roughly 71.3 million participant core where employers are
              already choosing more customized funding models. ICHRA is much smaller at a current 450,000 to one million
              people depending on the source, but it is growing quickly and matters because it conditions brokers and
              employers to rethink group-plan defaults. Curative's 165,000-plus members remain tiny relative to any of
              these outer lenses, which is why the company still has significant whitespace even without assuming heroic
              market-share outcomes.
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM017
              - CM018
