      - number: '8.2'
        title: Comparable boundaries and market backdrop
        blocks:
          - type: paragraph
            body: >-
              The cleanest public way to triangulate Curative is not to pretend we have an ARR multiple when we do not;
              it is to combine employer-market demand context with insurer and adjacent-comp valuation lenses. Employer
              costs remain under pressure: KFF's 2025 survey showed family premiums at $26,993, Business Group on Health
              expects a 9% cost increase for 2026 before mitigation, Aon points to a 9.5% rise above $17,000 per
              employee, and McKinsey argues many employers are willing to switch carriers for savings above 10%. That
              backdrop explains why Curative's promise resonates. The public comp set, however, is not uniformly
              forgiving. Oscar's market cap is large in absolute dollars but light on a per-member basis, while
              Alignment and Clover command richer insurer-style member lenses because they disclose far more operating
              proof. The adjacent distribution and navigation set is harsher still: eHealth and GoodRx are sub-$1.1
              billion public market caps, while Accolade sold at only about 1.5 times trailing revenue. Private rounds
              such as Sidecar and Devoted show that investors will pay for differentiated health-plan narratives, but
              those companies either disclose more economics or operate at a much larger membership base than Curative
              has made public.
