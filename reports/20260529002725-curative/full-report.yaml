  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current mark and public proof
        blocks:
          - type: paragraph
            body: >-
              Curative's current valuation anchor is not rumor-level: the December 2025 Series B is well covered by
              company and independent sources, and those sources converge on a $1.275 billion post-money mark, more than
              $150 million of new capital, more than 1,200 employer clients, more than 165,000 members, and a claim of
              profitability. That is enough to treat the current price as a real market signal rather than as an
              unverifiable database whisper. The quality of support becomes thinner as soon as the analysis shifts from
              fundraising optics to underwriting economics. Curative's public file gives investors product simplicity
              and rating support—the Baseline-gated $0 out-of-pocket design, fully insured and level-funded options, and
              an A- / a- AM Best path—but it still does not disclose the actual insurer metrics that should drive price:
              revenue, medical loss ratio, statutory surplus, reserve adequacy by state, employer renewal behavior, or
              preference-stack terms. In other words, the financing is real, the operating wedge is plausible, and the
              rating matters, but price support still depends on evidence the public record does not yet provide.
