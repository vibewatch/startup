  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - AM Best deterioration
        - Downgrade, negative outlook, or evidence that parent support is no longer ample
        - Curative loses one of the few independent anchors supporting insurer credibility.
        - Reprice toward the bear band and halt any aggressive entry.
      - - Reserve or statutory-capital miss
        - Private diligence shows weak surplus, thin RBC-style cushion, or outsized capital needs for expansion
        - The current mark stops looking like a growth premium and starts looking like under-reserved risk.
        - Do not follow the round without a substantial price reset.
      - - Renewal or growth slowdown
        - Employer renewals weaken or member growth materially undershoots plan
        - The member-based upside case breaks because fixed insurer infrastructure gets less leveraged.
        - Move valuation closer to the Oscar-like floor.
      - - Follow-on financing stress
        - Bridge, structured capital, or flat/down round needed before underwriting proof arrives
        - Current round loses credibility as the best market-clearing signal.
        - Treat as a hard adverse mark and revisit cap-table dilution.
      - - Legal / governance escalation
        - Legacy litigation expands, settles expensively, or surfaces governance issues
        - Any governance hit compounds the disclosure discount already embedded in the story.
        - Maintain or deepen the valuation discount until the issue is closed.
    notes: >-
      These are thesis-break triggers, not generic operating risks; each one directly changes the valuation lens rather
      than merely adding color around execution.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV040
      - CV041
      - CV050
