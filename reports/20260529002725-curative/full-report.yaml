      - number: '7.2'
        title: Network, partner, and service-delivery concentration
        blocks:
          - type: paragraph
            body: >-
              The clearest operating risk in the 2026 public record is that Curative changed the chassis underneath its
              access promise. As of January 1, 2026, providers are told the company no longer contracts through the
              Aetna/First Health wrap network and instead uses the Cigna Healthcare PPO Network or the Curative Wrap
              Solution with HealthSmart Preferred. That may be a rational upgrade, but it creates a visible
              concentration point: member satisfaction, provider claims flow, and broker confidence all now depend on a
              successful multi-party handoff across Curative, Cigna, and HealthSmart. Curative's own pages show that the
              company is also pushing curated-network products like EPO Value, which can improve economics but raises
              the residual risk that directory accuracy, referral friction, and narrow access create outsized
              dissatisfaction when the brand promise is 'no copay, no deductible.' The public partner pages reinforce
              that this is not a vertically closed stack. Cigna's provider and broker portals, and HealthSmart's
              provider onboarding pages, all suggest material dependence on outside network infrastructure and
              distribution surfaces. That dependency is manageable if execution is clean, but it becomes high severity
              quickly if a network cutover produces claim denials, missing doctors, or broker hesitation during
              expansion.
