          - type: paragraph
            body: >-
              The current public leadership picture is founder-heavy and operationally coherent. Fred Turner is the
              external face of Curative’s strategy, financing, and anti-BUCA narrative; Isaac Turner is presented as the
              technical architect of the insurer stack and Curative Cash Card; and Tami Wilson-Ciranna appears to be the
              operator who holds together finance, legal, claims, network, and pharmacy functions. That trio matters
              because Curative is not a lightweight benefits app — it is trying to be a real insurer with rating-agency
              scrutiny, reserve needs, and complex provider/payment operations. Public materials also identify Brandon
              Charles and Sean Maguire as important functional leaders, which helps show a broader bench than the
              founders alone. What is still thin is governance disclosure. Retained public sources readily provide
              executive bios and funding headlines, but they do not provide a current board roster, committee map, or
              clear description of investor rights. That makes key-person dependence a real diligence issue rather than
              a stylistic caution.
