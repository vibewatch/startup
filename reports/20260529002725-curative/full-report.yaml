      - number: '8.4'
        title: Diligence gates before underwriting the round
        blocks:
          - type: paragraph
            body: >-
              The missing work is unusually clear. Before underwriting Curative at anything near the current mark, an
              investor should get audited 2025 and year-to-date 2026 revenue, medical loss ratio, statutory surplus and
              RBC-style capital metrics, employer renewal cohorts, PMPM by product and state, and the actual cap-table
              terms attached to the 2025 Series B. Those asks are not academic details; they determine whether Curative
              deserves a premium insurer lens or a discount for opacity. The same goes for downside monitoring. Because
              rating credibility is central to Curative's employer-plan story, any AM Best downgrade, capital-support
              wobble, or reserve surprise would immediately weaken valuation support. Likewise, if renewals or
              medical-cost control are weaker than the current marketing narrative suggests, the appropriate valuation
              anchor moves down quickly toward the public-comp floor. The legacy litigation does not by itself break the
              thesis, but it reinforces the broader point: this is not a case for false precision. The company belongs
              on a high-priority watchlist, yet price discipline and evidence discipline should govern every next step.
            claimRefs:
