companyProfile:
  summary: >-
    Curative is a 2020-founded, Austin-based employer health insurer that pivoted out of the company's COVID-testing
    infrastructure into a preventive-care-first group health plan model. Its public product promise is simple: members
    can use in-network care with no copays, deductibles, or coinsurance if they complete an annual Baseline Visit in the
    required onboarding window. Public evidence also supports a founder-heavy operating model led by CEO Fred Turner,
    CTO Isaac Turner, and President/CFO Tami Wilson-Ciranna, plus 2025-2026 scale claims of more than 1,200 employer
    clients and more than 165,000 members.
