        - label: A- / a- AM Best path provides insurer credibility
        - label: Employer cost inflation creates real demand for alternatives
        - label: Public file still lacks revenue, MLR, reserves, and cap-table terms
        - label: Public comps span weak distribution marks to richer disclosed insurer marks
