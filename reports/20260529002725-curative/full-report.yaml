    title: Investment KPIs
    type: kpi
    layout: wide
    summary: Curative scores well on demand and traction, but poorly on disclosure quality and current entry price support.
    data:
      items:
        - label: Demand environment
          note: 'Strong: employer cost inflation and carrier-switching interest support the category.'
        - label: Scale proof
          note: 'Good: the current record supports 1,200+ employers and 165,000+ members.'
        - label: Capital / ratings signal
          note: 'Mixed-positive: A- / a- ratings help, but capital sufficiency still needs private diligence.'
        - label: Disclosure quality
          note: 'Weak: no public revenue, MLR, statutory surplus, or preference detail.'
        - label: Comparable support
          note: >-
            Mixed: Curative sits between Oscar and Alignment/Clover on member lenses, but adjacent public comps are much
            cheaper.
        - label: Entry price
          note: 'Weak at current mark: the public-evidence base band still sits below $1.275B.'
