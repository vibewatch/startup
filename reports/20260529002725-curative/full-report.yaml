      - - Benefits navigation and advocacy overlay
        - Care-navigation, member-support, transparency, and decision-support services tied to medical benefits
        - Standalone wellness apps with no benefit-design implications
        - Employer sponsor buys / employee uses
        - Curative bundles navigation into the plan rather than selling it as a separate point solution
      - - Primary-care-first plan design
        - Preventive onboarding, PCP engagement, care coordination, low or zero in-network member cost share
        - Reference-only cost shifting with no care-model change
        - Employer sponsor buys / employee uses
        - This is the specific design Curative is betting can lower downstream cost and improve experience
