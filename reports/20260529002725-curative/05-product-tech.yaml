company:
  name: Curative
chapter:
  number: 5
  title: Product & Technology
  summary: 'Curative’s public product is best understood as a guided group-health-plan stack rather than an open software
    platform: state-specific plan design, Baseline Visit-driven navigation, member app + portal self-service, telehealth and
    network orchestration, and provider/employer admin tooling are all visible. Public evidence is strong enough to map workflows
    and operational dependencies, but it remains shallow on developer-facing materials, public reliability history, and inspectable
    architecture.'
sections:
- id: product-definition-and-plan-design
  title: Plan design is the core product layer
  body: |-
    Curative’s current public surface describes a guided employer health plan, not a standalone software product. The homepage and employer pages position Curative as employer-sponsored health insurance built around affordability, engagement, and simplicity, while the Texas, Florida, and Georgia pages package that promise into concrete state-level offers. The plan-options page clarifies that Curative is not selling just one SKU: it exposes EPO, PPO, and PPO Max options on fully-insured or level-funded funding rails, then adds EPO Value as a lower-premium, guided-care variant anchored on the Curative Pass. That combination matters because it reveals how Curative differentiates publicly. The wedge is not a public API or deep claims-processing disclosure; it is low-friction plan economics, curated provider steering, and a simpler member operating model. Table TE001 maps the visible product modules, while Figure FE001 shows how the commercial design layer feeds directly into the member, care-navigation, and operations layers.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE032
  - CE033
  - CE034
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: member-provider-and-employer-workflows
  title: Member, provider, and employer workflows are visibly software-mediated
  body: |-
    Curative publishes enough workflow surface to show that the product is operationally real. On the member side, the member portal supports ID-card access, Baseline Visit scheduling, benefits review, prescription management, and 24/7 help, while the app adds digital cards, Curative Cash Card management, provider search, care navigation, and Curative AI. On the employer side, Curative’s portal explicitly supports editing employee enrollment information, printing member cards, and enrolling policyholders. On the provider side, the provider-resources page and reference guide expose prior authorization, eligibility, claims, appeals, and credentialing workflows rather than just marketing copy. The combined picture is important for diligence: Curative’s visible technology is narrow but highly workflow-specific. It appears built around the recurring administrative loops of a health plan rather than generalized developer tooling or configurable platform modules. Table TE002 lays out those user jobs, and Figure FE002 turns them into a front-to-back operating flow.
  claimRefs:
