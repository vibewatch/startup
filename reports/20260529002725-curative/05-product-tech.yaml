- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Primary risk
  rows:
  - - Commercial configuration layer
    - Defines state offer, funding type, and plan variant
    - Curative plan pages and pricing/benefit content ops
    - Public plan structure is visible, but realized pricing and underwriting rules are not
  - - Member experience layer
    - Runs card, benefits, provider search, AI assistant, and portal self-service
    - Curative app, member portal, and Apple distribution
    - Cross-platform inconsistency or weak mobile distribution would erode convenience claims
  - - Navigation and delivery layer
    - Routes members through Baseline Visit, primary care, telehealth, and provider search
    - Primary care page, telehealth partners, Curative Pass/Cash Card logic
    - Curative does not publish care-routing conversion or quality metrics
  - - Network and payer operations layer
    - Executes eligibility, prior auth, claims, and provider communications
    - Cigna PPO / HealthSmart, Availity Essentials, provider guide assets, payer ID CURTV
    - Multiple external rails create integration and change-management risk
  - - Employer administration layer
    - Handles enrollment and employer account tasks
    - Employer portal and support operations
    - Public evidence is shallow on permissions, exports, and admin controls
  - - Compliance and support layer
    - Publishes legal notices and handles role-specific service issues
    - HIPAA/privacy/terms pages and 24/7 member support line
    - Public policies exist, but no deeper public security architecture or incident history is available
  notes: This architecture is an operating-model view derived from public surfaces, not an internal system diagram.
