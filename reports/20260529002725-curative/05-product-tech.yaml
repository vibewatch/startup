- id: care-navigation-and-operational-dependencies
  title: Care navigation depends on external networks, partner rails, and provider ops tooling
  body: |-
    Curative’s care model is publicly structured around a few linked mechanisms: complete a Baseline Visit early, keep in-network care at $0, use telehealth or provider search for immediate access, and route provider operations through a separate support stack. The telehealth page adds important partner evidence by naming NormanMD and Teladoc and by promising 24/7/365 urgent care with fast phone-or-video access. The provider-network page adds a second dependency layer: a nationwide network footprint, Curative Pass handling when a provider cannot take the member ID card, and a 2026 transition to Cigna PPO or Curative’s own wrap solution with HealthSmart. Provider operations add still more dependencies, including Availity Essentials, hosted PDF manuals, and explicit claims-routing data such as payer ID CURTV. The result is a product whose simplicity for members rests on a fairly dense operational stack. Table TE003 itemizes those components, and Figure FE003 shows the external dependency graph that sits behind the member-facing promise.
  claimRefs:
