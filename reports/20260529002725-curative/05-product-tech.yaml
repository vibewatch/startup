- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Curative surface
  - Measurable benefit
  - Limitation
  rows:
  - - Activate benefits and stay eligible for $0 care
    - Log in, review benefits, schedule Baseline Visit within 120 days, then keep using the plan
    - Member portal + for-members page
    - Concrete onboarding path tied to the product’s core economic promise
    - Public evidence does not show completion rates or churn if the Baseline Visit is missed
  - - Manage daily member tasks
    - Access digital card, benefits, prescriptions, support, and provider search in one place
    - App + member portal
    - Reduces fragmentation across common member jobs
    - No public evidence on Android parity or mobile adoption
  - - Get care now
    - Use telehealth, provider search, or Curative Pass / Cash Card support at point of care
    - Telehealth + network + app
    - Makes virtual urgent care and routing highly visible
    - Public evidence does not disclose network-accuracy metrics or response-time distributions beyond marketing claims
  - - Run provider admin tasks
    - Check eligibility, submit prior auth, route claims, view payer identifiers, and contact provider relations
    - Provider resources + provider guide PDF
    - Shows payer operations are software-supported and documented
    - No public API or EDI implementation detail beyond surface references
  - - Administer an employer group
    - Edit enrollment, print cards, enroll policyholders, and manage employer-facing administration
    - Employer portal + for-employers page
    - Confirms a distinct employer workflow, not just a broker or member view
    - Public feature depth and permissions model are not disclosed
  notes: Benefits and workflow gains are described qualitatively because Curative does not publish conversion, throughput,
    or usage metrics for these flows.
