- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Evidence-backed differentiation
  - Diligence gap
  rows:
  - - State plan pages (Texas / Florida / Georgia)
    - Employers and members
    - Live public commercial surface
    - Packages low-cost plan economics with support and guided care messaging rather than generic carrier language
    - No public utilization, retention, or medical-cost outcomes by state
  - - Funding + plan configuration (fully-insured, level-funded, EPO, PPO, PPO Max)
    - Employers and brokers
    - Live public configuration layer
    - Shows Curative can vary funding and network posture without changing the core member promise
    - No public pricing grid, claims corridor, or realized PMPM disclosure
  - - EPO Value + Curative Pass
    - Cost-conscious employers and members
    - Live guided-care variant
    - Uses curated providers and Curative Pass to trade lower premiums for more steerage
    - No public take-rate or savings data for the guided variant
  - - Member app + member portal
    - Members
    - Live consumer workflow
    - Combines cards, benefits, provider search, prescriptions, cash card, care navigation, and AI assistance
    - No public web/API architecture or feature-adoption telemetry
  - - Baseline Visit + primary care + telehealth
    - Members and care teams
    - Live care-navigation stack
    - Makes preventive engagement and early-routing part of the product design, not just support copy
    - No public conversion, completion, or outcomes data by cohort
  - - Provider + employer admin surfaces
    - Providers and employer admins
    - Live operational tooling
    - Shows Curative has separate workflows for eligibility, PA, claims, enrollment, and card administration
    - Public detail is strong on tasks but weak on underlying systems and integrations
  notes: Rows reflect only publicly inspectable modules on 2026-05-29; private underwriting, adjudication, and internal engineering
    systems remain outside public view.
