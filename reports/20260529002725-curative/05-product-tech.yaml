  - FE004
- id: roadmap-signals-and-diligence-view
  title: Roadmap signals point to rollout and operations, not an open platform strategy
  body: |-
    The clearest dated roadmap signals are operational. BusinessWire shows the Florida rollout as an app-linked, member-support-heavy extension of the same core plan design. The provider-resources page makes a second major change explicit as of January 1, 2026: the network stack moves off Aetna/First Health and onto Cigna PPO or Curative’s wrap solution with HealthSmart. The App Store listing adds a third signal by showing an April 2026 mobile release with bug fixes and security improvements, while the legal pages show fresh policy maintenance into 2026. Put together, those updates suggest Curative is actively iterating on distribution, network configuration, consumer experience, and compliance maintenance. They do not suggest that Curative is opening a public platform, publishing APIs, or cultivating an external developer ecosystem. Table TE005 sequences those signals and highlights the remaining diligence blockers: public reliability history, deeper architecture documentation, and stronger evidence for Android or broader developer distribution.
  claimRefs:
  - CE028
  - CE030
