- id: trust-compliance-and-public-technical-surface
  title: Trust and compliance artifacts are visible, but public technical depth is thin
  body: |-
    Curative does publish a real trust surface: a 2026 HIPAA notice, a privacy policy covering websites, mobile apps, and chatbot services, website terms, role-specific support contacts, and consumer-facing app release notes that mention stability and security improvements. HHS supplies the external baseline that makes those pages meaningful by clarifying that health plans handling ePHI must maintain administrative, physical, and technical safeguards. What is missing is equally important. The public sitemap exposes product, provider, legal, and careers pages, but not API, developer, or documentation endpoints. The careers page therefore becomes the strongest available developer-signal proxy, and even that signal is recruiting-oriented rather than technical. For diligence, the practical conclusion is that Curative’s public posture is strong enough to assess workflows and policy surfaces, but not strong enough to inspect architecture, release engineering, or a broader ecosystem. Table TE004 captures the visible trust layer, while Figure FE004 scores which capabilities are mature publicly versus where evidence bottoms out.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
