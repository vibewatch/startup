  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: credit-risk
      missingEvidence: Cohort-level delinquency, charge-off, recovery, reserve, advance-rate, and vintage performance by product and FIDC.
      whyItMatters: Funding scale and reported profitability do not show whether credit growth is producing sustainable risk-adjusted returns.
      diligencePath: Request audited credit-performance vintages, reserve methodology, waterfall terms, stress cases, and investor reporting for each material receivables fund.
      relatedQuestionRefs: [QR002, QR006]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Customer, partner, card-network, issuer, and funding-provider concentration metrics.
      whyItMatters: A single counterparty or merchant segment could transmit operational or liquidity stress across payments and credit.
      diligencePath: Obtain top-10 concentration, renewal, volume, funding, and settlement-counterparty schedules with contractual limits.
      relatedQuestionRefs: [QR007]
    - type: missing-source
      severity: material
      topic: AI-controls
      missingEvidence: Independent security assurance, model validation, privacy impact assessments, incident history, and complaint/remediation metrics.
      whyItMatters: AI-mediated credit, fraud, support, and pricing decisions can amplify errors and regulatory exposure at scale.
      diligencePath: Review SOC or equivalent reports, penetration tests, model cards, bias and drift monitoring, consent evidence, and regulator correspondence.
      relatedQuestionRefs: [QR003, QR005]
    - type: enumeration-incomplete
      severity: minor
      topic: TR001
      missingEvidence: Complete litigation, enforcement, license, and consumer-complaint records across every relevant CloudWalk entity and jurisdiction.
      whyItMatters: Public search coverage cannot establish the absence of adverse legal events.
      diligencePath: Run counsel-led searches across Brazilian regulator, court, consumer-protection, and US records using legal-entity names.
      relatedQuestionRefs: [QR001, QR003]
      relatedTableRefs: [TR001]
