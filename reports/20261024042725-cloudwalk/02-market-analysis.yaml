          valueNote: "Broad opportunity; no assigned source provides a defensible total"
          tone: neutral
        - label: Open Finance ecosystem
          value: 91000000
          unit: active authorizations
          valueNote: "System-wide figure cited by CloudWalk from a Bip report as of June 2025"
          tone: neutral
        - label: InfinitePay disclosed user reach
          value: 6000000
          unit: users
          valueNote: "Over 6 million in 2025; user definition is not equivalent to active merchants"
          tone: positive
        - label: Disclosed 2023 active merchants
          value: 1100000
          unit: merchants
          valueNote: "Over 1.1 million at 2023 year-end; historical company disclosure"
          tone: neutral
        - label: Disclosed 2021 merchant base
          value: 70000
          unit: merchants
          valueNote: "Approximately 70,000 merchants in 2021; historical company disclosure"
          tone: neutral
        - label: Disclosed 2025 active sellers
          value: 6300000
          unit: sellers
          valueNote: "Over 6.3 million active sellers in 2025; definition differs from users"
          tone: positive
    approximationNotes: >-
      Ordered evidence layers are illustrative, not value-proportional: populations, units, and
      denominators differ, so no conversion rate or market share is inferred.
    claimRefs: [CM007, CM008, CM009]
