      - [CloudWalk / Business Wire, "2025", Brazil, ">6M InfinitePay users", Company disclosure, Medium, "Users are not equivalent to active payment merchants"]
      - [CloudWalk newsroom, "2025", Brazil, "91M active Open Finance authorizations system-wide", Company citing Bip, Medium, "System authorization count is not CloudWalk SAM"]
