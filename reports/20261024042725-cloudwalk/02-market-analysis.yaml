    notes: >-
      Values retain publisher, period, unit, and denominator distinctions. No CAGR or SAM/SOM is
      computed because the observations use different populations and definitions.
    claimRefs: [CM005, CM007, CM008, CM009]
  - id: TM003
    title: Segment and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Micro merchant, Owner, Owner and staff, Business cash flow, Accept and settle payments, Operating budget, Tap to Pay and fast funds]
      - [Small merchant, Owner / finance lead, Staff and owner, Business cash flow, Payments plus account and invoices, Operating budget, Bundled workflows]
      - [Digitally native seller, Owner, Owner, Business cash flow, "Links, app and AI assistance", Growth budget, Low-friction onboarding]
      - [Credit-seeking merchant, Owner / finance lead, Owner, Business cash flow, Working-capital offer, Finance budget, Data-based eligibility]
    notes: >-
      Segments are analytical archetypes based on disclosed product workflows; no assigned source
      provides independent segment counts or conversion rates.
    claimRefs: [CM010, CM011, CM012, CM013]
