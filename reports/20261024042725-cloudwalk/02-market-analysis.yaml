  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A consistent Brazil SME payment-spend denominator and CloudWalk serviceable-share bridge by segment and geography.
      whyItMatters: Without a common denominator, disclosed merchant counts and ecosystem authorizations cannot support a valuation-grade SAM or SOM.
      diligencePath: Request management's market-sizing workbook and reconcile it to Banco Central payment-system data and independent acquiring statistics.
      relatedQuestionRefs: [QM007]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: customer-definition
      missingEvidence: A definition and cohort bridge between InfinitePay users, active clients, active merchants, and active sellers.
      whyItMatters: Customer population and retention determine whether distribution scale translates into recurring payment and credit revenue.
      diligencePath: Obtain monthly active merchant cohorts, gross retention, net retention, and product attach rates by acquisition vintage.
      relatedQuestionRefs: [QM002, QM008]
    - type: access-blocked
      severity: minor
      topic: Pix
      missingEvidence: A machine-readable Pix transaction and value series from the central-bank statistics portal.
      whyItMatters: Pix is a major substitute and adoption driver, but the assigned fetch did not expose the underlying observations.
      diligencePath: Download the Central Bank's underlying Pix time series or request the relevant public data export.
      relatedQuestionRefs: [QM005]
