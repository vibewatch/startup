    title: Recommendation logic
    type: flow
    summary: Operating proof is strong, but stale price evidence and unresolved financing metrics lead to a research-more recommendation.
    data:
      nodes:
        - id: scale
          label: "Scale"
          detail: "$990M 2025 revenue; $1.3B annualized run rate in Dec 2025"
        - id: profit
          label: "Profitability"
          detail: "$110M 2025 net income reported by CloudWalk"
        - id: finance
          label: "Funding engine"
          detail: "FIDCs and credit activity support receivables financing"
        - id: regulatory
          label: "Regulatory scope"
          detail: "Credit institution authorization reported in June 2025"
        - id: price
          label: "Price evidence"
          detail: "$2.15B last disclosed equity mark was November 2021"
        - id: call
          label: "Recommendation"
          detail: "Research-more pending current price and capital-structure diligence"
      edges:
        - [scale, profit]
        - [profit, finance]
        - [finance, regulatory]
        - [regulatory, price]
        - [price, call]
    claimRefs: [CV001, CV003, CV005, CV007, CV009]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: "Research-more is the appropriate current stance: CloudWalk's operating trajectory is compelling, but a current equity price, preference stack, dilution schedule, and cash-flow bridge are not retained."
    claimRefs: [CV001, CV005, CV012]
  - calloutType: risk
    title: Financing and revenue-quality risk
    body: FIDC scale can expand merchant credit access while increasing dependence on receivables performance, funding appetite, and transparent disclosure of losses and cash conversion.
    claimRefs: [CV007, CV008, CV013]
  - calloutType: insight
    title: Diligence threshold
    body: The investment case becomes actionable only when current price discovery and normalized operating metrics can be reconciled to the financing structure.
    claimRefs: [CV005, CV012, CV014]
