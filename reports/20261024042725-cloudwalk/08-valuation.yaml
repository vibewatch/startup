company:
  name: CloudWalk
chapter:
  number: 8
  title: Valuation
  summary: CloudWalk has unusually strong disclosed growth and profitability, but the only cited equity valuation is a November 2021 $2.15 billion mark. Current public evidence supports a high-quality operating thesis, not a price-specific buy call, so entry discipline and fresh price discovery remain decisive.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: "CloudWalk's operating evidence is attractive: a company release reports $990 million of 2025 revenue, $110 million of net income, and a $1.3 billion annualized revenue run rate in December 2025, while an earlier release reports $320.5 million of 2023 revenue and $22.3 million of net income. Those figures are company-issued and should not be treated as audited public-company filings. The strongest positive signal is the combination of scale, profitability, and a credit institution license; the strongest limitation is that the latest disclosed equity valuation remains the $2.15 billion November 2021 Series C mark. At that stale mark, the implied value-to-2025-revenue relationship would be about 2.2x, but that is an analyst calculation using non-comparable periods and should not substitute for a current transaction price. Recommendation: research-more, with a preference for a structured secondary or primary entry only after updated capitalization, preference, dilution, and cash-flow evidence is obtained."
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis versus anti-thesis
    body: "The thesis is a compounding merchant-finance loop: independent analysis describes payment distribution feeding receivables, transaction data, working-capital underwriting, and repeat product revenue. Company disclosures support the scale of that loop through FIDC issuance, credit activity, and merchant growth, but they do not provide a complete TPV, take-rate, credit-loss, reserve, or funding-cost bridge. The anti-thesis is therefore not that CloudWalk lacks traction; it is that financing intensity and opaque revenue quality can make a high growth headline less durable than it appears. The new credit license may lower funding costs and diversify capital sources, but it also raises the importance of regulatory, capital, and asset-quality diligence."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and diligence asks
    body: "A conventional multiple-based valuation is not reliable without a current equity price and a normalized revenue definition. StoneCo's independently published price-to-sales page shows a 0.9934 TTM ratio as of October 2026 and a 1.02 year-end 2026 ratio, which is a useful public-market reference but not a direct peer valuation for a private, credit-enabled platform. Scenario analysis should therefore use explicit evidence gates rather than false precision: a bull case requires durable profitable growth and transparent credit performance; the base case requires price discovery and verified revenue quality; the bear case is triggered by funding stress, deterioration in receivables, regulatory constraints, or multiple compression. The next diligence step is to obtain a current cap table and term sheet, then reconcile revenue, TPV, credit losses, FIDC liabilities, cash generation, and preference overhang."
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a price-specific buy without current price discovery."]
      - [Confidence, "Medium", "Operating evidence is substantial, but equity-price evidence is stale."]
      - [Risk rating, "Medium", "Funding, credit, regulatory, and disclosure risks remain material."]
      - [Valuation stance, "Unknown", "The last disclosed mark is from November 2021."]
    notes: Company-reported operating figures and third-party market data are not equivalent to audited financial statements or a current financing price.
    claimRefs: [CV001, CV003, CV005, CV011]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Profitable scale can compound, "2025 revenue of $990M and net income of $110M were reported by CloudWalk.", "Audited or independently verified revenue and cash-flow reconciliation."]
      - [Merchant distribution can feed finance, "Sacra describes payment volume, receivables, transaction data, and working-capital lending as a compounding loop.", "Cohort-level TPV, take rate, retention, and credit-loss disclosure."]
      - [Funding access is a capability, "CloudWalk reported R$1.6B across four 2024 FIDCs; NeoFeed reports a later R$5.5B issuance.", "Maturity ladder, advance rates, reserves, and all-in funding cost."]
      - [Regulatory scope is expanding, "CloudWalk reported Central Bank authorization as a credit institution.", "Independent confirmation of license scope, capital requirements, and supervisory status."]
      - [Price may not reflect current scale, "The last disclosed equity mark was $2.15B in November 2021.", "A current arm's-length round, secondary price, or credible cap-table mark."]
    notes: The table separates company-issued evidence from independent analysis and identifies the evidence that would falsify or strengthen each argument.
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario framework
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "2025 profitability persists; growth remains strong; credit losses and funding costs are controlled.", "Potentially supports a premium to public payments references, but no defensible range without a current price and normalized revenue.", "Evidence-supported direction, not a probability estimate.", "Profitability or credit performance weakens."]
      - [Base, "Operating growth is real but revenue quality, TPV, take rate, and cash conversion remain partly undisclosed.", "Hold or research-more until a current equity price and capital-structure data are available.", "Most defensible pending diligence; not a quantified probability.", "No satisfactory reconciliation of revenue, receivables, and cash."]
      - [Bear, "Funding tightens, receivables performance deteriorates, regulation constrains products, or public-market multiples compress.", "Downside cannot be quantified from retained evidence; entry should require a material risk-adjusted discount.", "Material risk case, not a quantified probability.", "FIDC stress, adverse supervisory action, or sustained loss of profitability."]
    notes: Scenario ranges are intentionally not numeric because the retained evidence does not establish a current equity price, normalized revenue basis, or probability distribution.
    claimRefs: [CV003, CV005, CV008, CV009, CV012, CV013, CV014]
figures:
