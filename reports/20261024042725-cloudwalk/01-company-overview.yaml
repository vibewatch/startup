company:
  name: CloudWalk
chapter:
  number: 1
  title: Company Overview
  summary: CloudWalk is a private Brazilian fintech whose InfinitePay merchant platform has expanded from payments into banking, credit, and AI-enabled business operations, while JIM.com extends the model into the United States. The company reports rapid, profitable scale, but its private-company disclosure leaves important questions around revenue quality, funding concentration, governance depth, and current valuation.
sections:
  - id: identity-and-platform
    title: Identity, product, and operating model
    body: >-
      CloudWalk was founded in 2013 by Luis Silva and is headquartered in São Paulo, Brazil.
      Its operating model centers on InfinitePay, a financial-services platform for Brazilian
      micro and small businesses, and JIM.com, a U.S. product for solo and small sellers.
      The official company site describes InfinitePay as supporting Brazilian sellers with
      payments, credit, storefronts, and daily decisions, while JIM is positioned as an agent
      that accepts payments and puts money in a seller's account quickly. The company's own
      product releases describe a progression from payment infrastructure into AI agents,
      including JIM's ability to create marketing campaigns, adjust prices, manage sales and
      receivables, and provide strategic support. Third-party analysis describes the resulting
      model as a software-led acquisition funnel in which payment activity can support deposits,
      lending, and settlement products. The core identity is therefore a private, vertically
      integrated payments and financial-services platform, not a pure software subscription
      company.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance-and-scale
    title: Leadership, governance, and scale
    body: >-
      Luis Silva remains the named founder and chief executive, while the reviewed sources
      identify functional leaders in growth, product, financial services, and treasury. Pulse2's
      interview identifies Ricardo Cici as chief growth officer responsible for global expansion,
      go-to-market, and revenue growth, and says he joined through the acquisition of a payments
      reconciliation company he founded. CloudWalk's jobs page shows active recruiting across
      treasury, funding, risk, compliance, regulatory reporting, audit, privacy, engineering,
      and AI go-to-market. That hiring footprint suggests a widening control and operating
      surface, but the assigned sources do not provide a board roster, ownership table,
      independent-director information, or a complete succession plan. Founder dependence is
      material because the public narrative, strategic direction, and major performance claims
      remain closely associated with Silva.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: funding-and-milestones
    title: Funding, financing, and milestones
    body: >-
      CloudWalk's disclosed equity history is concentrated in 2021: Sacra reports a $190
      million Series B followed by a $150 million Series C, both led by Coatue, for
      approximately $365 million of lifetime equity funding. The same source records $1.3
      billion of annualized revenue in 2025, while company announcements report $990 million
      of 2025 revenue, $110 million of net income, and a $1.3 billion annualized run rate in
      December. A later company release dated May 2026 reports approximately $1.7 billion of
      current annualized revenue run rate and $322 million of annualized pre-tax profit as of
      March 2026; those are run-rate and pre-tax measures, not interchangeable with reported
      revenue or net income. Separately, Valor and NeoFeed describe FIDC receivables financing
      used to fund advances to merchants. This is an important financing dependency: FIDC
      proceeds are not equity capital or cash available for general corporate use, and the
      reviewed sources do not provide a complete current bridge from payment volume to revenue,
      credit losses, funding cost, and cash generation.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: []
  - id: diligence-judgment
    title: Ground truth and unresolved diligence
    body: >-
      The strongest evidence supports a company with real product breadth, meaningful merchant
      reach, and reported profitability rather than a venture business dependent only on future
      monetization. At the same time, the evidence base is weighted toward company releases,
      syndicated announcements, and analyst synthesis; it does not establish an independently
      audited current valuation, a full cap table, board governance, customer retention,
      transaction-volume economics, or the durability of FIDC investor demand. The current
      company overview should therefore be reused as a factual identity layer with explicit
      qualifications: reported scale and profitability are credible company disclosures,
      historical equity valuation is not a current price, and financing-market capacity is
      not equivalent to unrestricted liquidity. A refresh should prioritize primary financial
      statements, regulatory records, governance documents, and a current financing and
      valuation bridge.
    claimRefs: [CO010, CO012, CO013, CO015]

