          label: "Reported $1.7B run rate"
          details: "A May 2026 company release says current annualized revenue run rate was approximately $1.7 billion as of March, with $322 million annualized pre-tax profit."
          tone: positive
          claimRefs: [CO013]
    approximationNotes: "The timeline preserves the sources' differing measures and dates; annualized figures are not converted into reported-period revenue."
    claimRefs: [CO001, CO002, CO004, CO010, CO011, CO012, CO013]

callouts:
  - calloutType: strength
    title: Reported operating leverage
    body: "CloudWalk reports rapid revenue growth alongside positive net income and a lean workforce, but these are company-reported metrics that require primary financial verification."
    claimRefs: [CO012, CO013]
  - calloutType: risk
    title: Financing and disclosure dependency
    body: "The merchant-advance model depends on continued receivables financing, while the assigned evidence does not establish current valuation, governance depth, or a full revenue-quality bridge."
    claimRefs: [CO014, CO015]

