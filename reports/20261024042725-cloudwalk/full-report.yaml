      - number: '5.3'
        title: Deployment, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              Mobile acceptance reduces terminal friction but introduces platform and payment-service-provider
              dependencies. Apple's Tap to Pay documentation requires a supported PSP, an Apple entitlement, API
              integration, design compliance, and application review; it also states that payment data is encrypted and
              processed through the Secure Element. CloudWalk's own deployment claims are substantial: its materials
              describe dozens of internal agents, more than 50,000 monthly conversations for sales agent Bela, and
              automated resolution of more than 90% of InfinitePay support requests by Claudio Walker. These are
              company-issued operating metrics, not independent benchmarks. The retained evidence does not disclose
              uptime, authorization rates, latency distributions, rollback behavior, or support escalation outcomes.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's differentiation is less a single proprietary component than the coupling of merchant
              distribution, transaction data, receivables, credit, and software automation. Sacra characterizes the
              app-first model as a compounding loop in which each merchant can add payment volume, underwriting history,
              and financeable receivables. That thesis is plausible, but the evidence is analytical rather than an
              independently audited architecture or unit-economics proof. Trust is also only partly evidenced: Apple
              documents security properties for its acceptance layer, while CloudWalk describes product guardrails and
              automated decisioning. No retained source provides a current independent penetration test, control
              attestation, incident history, model-error distribution, fairness review, or appeal workflow for
              CloudWalk's own systems.
            claimRefs:
              - CE010
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product breadth reinforces the merchant workflow
            body: >-
              Payments, receivables, credit, and business automation share the same transaction context, creating a
              credible path to deeper engagement than a standalone acquiring product.
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE010
              - CE016
          - type: callout
            title: Capability claims exceed public assurance evidence
            body: >-
              CloudWalk discloses product and automation breadth, but public evidence does not quantify reliability,
              control effectiveness, model errors, or customer redress across the stack.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              CloudWalk primarily serves Brazilian micro and small entrepreneurs whose jobs include accepting cards and
              Pix, receiving proceeds quickly, issuing invoices, managing inventory, and accessing working capital.
              Sacra describes the initial target as hairdressers, street vendors, delivery drivers, and other
              micro-entrepreneurs earning roughly $500-$1,000 per month, while the InfinitePay listing also names
              shopkeepers, entrepreneurs, and merchants. The buyer, user, and payer are often the same owner-operator,
              but Team Mode and multiple phone installations introduce staff and delivery workers as additional users.
              The platform also reaches U.S. micro-merchants through JIM.com, although public evidence does not disclose
              U.S. revenue or retention by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: Adoption and usage trajectory
        blocks:
          - type: paragraph
            body: >-
              Publicly available evidence supports rapid top-of-funnel growth, but not a complete retention funnel.
              Company and investor materials report InfinitePay growth from 3 million to more than 6.3 million active
              sellers in 2025, while an August 2025 company release reported more than 5 million active clients and
              19.5% of Brazilian business Open Finance data-sharing consents. Sacra independently describes a rise from
              70,000 merchants to more than 6 million and identifies payment links, digital accounts, and
              AI-underwritten working-capital loans as products layered onto the payments relationship. These figures
              use different dates and labels, so they should not be added together or treated as a deduplicated customer
              count.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU013
      - number: '6.3'
        title: Named proof, durability, and expansion
        blocks:
          - type: paragraph
            body: >-
              Named proof is more developed for product availability and reported customer outcomes than for contractual
              durability. CloudWalk's JIM announcement says the assistant was available to more than 4 million
              InfinitePay customers in April 2025 and that thousands of entrepreneurs were already interacting with it
              after its mid-March introduction. The Open Finance release links customer consent to stated benefits such
              as access to credit and better rates, and reports fee savings and increased credit issuance. However,
              these are company-issued or investor-adjacent disclosures: they do not establish renewal, gross or net
              retention, customer-level revenue, or production deployment for each named merchant. The customer thesis
              therefore depends on validating cohorts, repeat usage, and cross-sell conversion in diligence.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Expansion and concentration risks
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's expansion logic is attractive because a merchant relationship can extend from acquiring into
              instant settlement, payment links, accounts, credit, and business management. Sacra characterizes each
              merchant as adding transaction history and receivables that can support additional financial products,
              while the app listing shows the breadth of the cross-sell surface. The same model creates diligence risks:
              the public record does not disclose customer concentration, revenue by product, cohort retention, credit
              adoption by cohort, or the share of activity from the largest merchants. Availability is also conditional:
              the app listing states that not all services are available to all customers and requires identity
              verification and a first transaction for benefits. This limitation is a concrete reason to test
              eligibility, activation, and realized product breadth rather than infer it from the feature catalog.
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's move from payments into lending and investment products expands both its addressable market
              and its regulated perimeter. The company says it received Central Bank authorization to operate as a
              credit institution, while third-party reporting describes greater autonomy over credit issuance and
              funding. That authorization is a mitigation for reliance on intermediaries, not proof that conduct,
              capital, consumer-protection, privacy, or model-risk obligations are satisfied. Open Finance participation
              also makes consent, data minimization, security, and explainability operationally material. A
              regulator-facing diligence package should verify the exact license entity, permitted products, capital and
              liquidity requirements, complaint history, remediation controls, and whether AI underwriting uses data
              that customers can contest. The absence of a public enforcement record in this pool is not evidence that
              no incident occurred.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
      - number: '7.2'
        title: Funding, credit, and operational resilience
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's growth model links payments distribution to receivables financing and merchant credit.
              Independent reporting describes the CloudWalk Pi FIDC as a record issuance and notes subordinated exposure
              to chargebacks, failed settlements, and card-issuer defaults; another account describes repeated FIDC
              issuance as the funding engine for receivables advances. This creates a liquidity and asset-quality
              feedback loop: weaker merchant volume, higher losses, investor redemptions, or tighter Brazilian funding
              conditions could raise costs or constrain origination. The company reports strong growth and
              profitability, but the retained material does not provide a full vintage-level delinquency, loss, reserve,
              advance-rate, duration, warehouse, or stress-test bridge. Operationally, the internal Stratus repository
              claims months-long node uptime and less than five seconds of leader maintenance downtime, but those are
              engineering claims rather than independent production assurance.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
      - number: '7.3'
        title: Partner, data, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              CloudWalk depends on card networks, issuer settlement, Brazilian payment and credit regulation,
              institutional FIDC investors, Open Finance interfaces, and the continued performance of its AI systems.
              Its official materials describe millions of merchants, automated credit and fee decisions, and expansion
              into the United States through JIM.com. Those claims indicate distribution and automation strengths, but
              they also widen the failure surface: a model error, privacy event, fraud-control miss, API disruption, or
              US-market underperformance could affect trust and unit economics simultaneously. The evidence does not
              establish customer concentration, partner concentration, service-level performance, or the share of
              revenue exposed to any one product. Monitoring should therefore focus on measurable leading indicators
              rather than the absence of disclosed incidents.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR013
      - number: '7.4'
        title: Residual exposure and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are the coupled credit-funding cycle, regulatory and data-control
              complexity, and execution risk from scaling AI-mediated financial decisions across Brazil and the United
              States. CloudWalk's disclosed profitability may provide a buffer, but it does not substitute for
              asset-quality and liquidity evidence because accounting profit, annualized revenue, FIDC capital raised,
              and cash available are different quantities. A prudent underwriting posture is to treat the thesis as
              conditional on receiving cohort-level credit performance, funding and reserve terms, regulator
              correspondence, incident metrics, model governance evidence, and product-level economics. The risk heatmap
              below expresses relative diligence priority, not a statistically estimated probability or a benchmark
              score.
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR006
              - CR007
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The key risk is a coupled funding-and-credit loop
            body: >-
              FIDC funding supports receivables and credit growth, while losses, chargebacks, defaults, or funding
              repricing could impair both liquidity and merchant economics. The decisive missing evidence is a
              cohort-level asset-quality and reserve bridge.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Profitability is not a substitute for risk transparency
            body: >-
              Reported revenue and net income are company-reported operating metrics; they do not disclose cash
              availability, credit losses, reserve coverage, funding costs, or concentration. The investment case should
              remain conditional until those quantities are reconciled.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's operating evidence is attractive: a company release reports $990 million of 2025 revenue, $110
              million of net income, and a $1.3 billion annualized revenue run rate in December 2025, while an earlier
              release reports $320.5 million of 2023 revenue and $22.3 million of net income. Those figures are
              company-issued and should not be treated as audited public-company filings. The strongest positive signal
              is the combination of scale, profitability, and a credit institution license; the strongest limitation is
              that the latest disclosed equity valuation remains the $2.15 billion November 2021 Series C mark. At that
              stale mark, the implied value-to-2025-revenue relationship would be about 2.2x, but that is an analyst
              calculation using non-comparable periods and should not substitute for a current transaction price.
              Recommendation: research-more, with a preference for a structured secondary or primary entry only after
              updated capitalization, preference, dilution, and cash-flow evidence is obtained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a compounding merchant-finance loop: independent analysis describes payment distribution
              feeding receivables, transaction data, working-capital underwriting, and repeat product revenue. Company
              disclosures support the scale of that loop through FIDC issuance, credit activity, and merchant growth,
              but they do not provide a complete TPV, take-rate, credit-loss, reserve, or funding-cost bridge. The
              anti-thesis is therefore not that CloudWalk lacks traction; it is that financing intensity and opaque
              revenue quality can make a high growth headline less durable than it appears. The new credit license may
              lower funding costs and diversify capital sources, but it also raises the importance of regulatory,
              capital, and asset-quality diligence.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A conventional multiple-based valuation is not reliable without a current equity price and a normalized
              revenue definition. StoneCo's independently published price-to-sales page shows a 0.9934 TTM ratio as of
              October 2026 and a 1.02 year-end 2026 ratio, which is a useful public-market reference but not a direct
              peer valuation for a private, credit-enabled platform. Scenario analysis should therefore use explicit
              evidence gates rather than false precision: a bull case requires durable profitable growth and transparent
              credit performance; the base case requires price discovery and verified revenue quality; the bear case is
              triggered by funding stress, deterioration in receivables, regulatory constraints, or multiple
              compression. The next diligence step is to obtain a current cap table and term sheet, then reconcile
              revenue, TPV, credit losses, FIDC liabilities, cash generation, and preference overhang.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more is the appropriate current stance: CloudWalk's operating trajectory is compelling, but a
              current equity price, preference stack, dilution schedule, and cash-flow bridge are not retained.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
          - type: callout
            title: Financing and revenue-quality risk
            body: >-
              FIDC scale can expand merchant credit access while increasing dependence on receivables performance,
              funding appetite, and transparent disclosure of losses and cash conversion.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV013
          - type: callout
            title: Diligence threshold
            body: >-
              The investment case becomes actionable only when current price discovery and normalized operating metrics
              can be reconciled to the financing structure.
            calloutType: insight
            claimRefs:
              - CV005
              - CV012
              - CV014
