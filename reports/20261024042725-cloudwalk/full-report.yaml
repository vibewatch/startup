chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              CloudWalk was founded in 2013 by Luis Silva and is headquartered in São Paulo, Brazil. Its operating model
              centers on InfinitePay, a financial-services platform for Brazilian micro and small businesses, and
              JIM.com, a U.S. product for solo and small sellers. The official company site describes InfinitePay as
              supporting Brazilian sellers with payments, credit, storefronts, and daily decisions, while JIM is
              positioned as an agent that accepts payments and puts money in a seller's account quickly. The company's
              own product releases describe a progression from payment infrastructure into AI agents, including JIM's
              ability to create marketing campaigns, adjust prices, manage sales and receivables, and provide strategic
              support. Third-party analysis describes the resulting model as a software-led acquisition funnel in which
              payment activity can support deposits, lending, and settlement products. The core identity is therefore a
              private, vertically integrated payments and financial-services platform, not a pure software subscription
              company.
