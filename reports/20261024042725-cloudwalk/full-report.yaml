  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and structural demand
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the recurring financial workflow of Brazilian micro and small merchants: accepting
              card and Pix payments, receiving funds, managing an account, and accessing working capital. Hardware-only
              acquiring is an excluded narrow view because CloudWalk's disclosed products combine payment acceptance
              with digital account, instant settlement, credit, invoice, sales and inventory tools. The status quo
              includes cash, bank transfers, incumbent acquirers, rented terminals, and manual bookkeeping. A 2023
              company release said InfinitePay expanded its platform with credit, invoice management, sales and
              inventory management, and instant payment, while Tap to Pay removed the need for a POS machine. This is an
              adoption opportunity, not proof of a market total. Brazil's Central Bank is the relevant institutional
              backdrop, but the assigned Pix statistics page exposes navigation rather than a usable transaction series,
              so Pix volume is retained as a diligence gap rather than estimated. The market boundary therefore supports
              a multi-product thesis but not a single comparable TAM number.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The strongest sizing lens is constrained bottom-up distribution: CloudWalk reported about 70,000 Brazilian
              merchants and more than US$1 billion in annual transactions in 2021, over 1.1 million active merchants at
              2023 year-end, and over 6 million InfinitePay users in 2025. These figures describe company reach at
              different dates and definitions; they are not interchangeable market denominators. A second lens is
              revenue adjacency: Sacra describes each merchant as adding transaction history, receivables, deposits and
              lending opportunities, while CloudWalk's 2026 company release describes payments, credit and settlement as
              parts of a broader autonomous-finance model. A third lens is regulatory and ecosystem scale: the company's
              August 2025 release cited 91 million active authorizations in Brazil's Open Finance system, but that is a
              system-wide authorization count, not CloudWalk's serviceable market. The evidence supports a large and
              expanding opportunity set, but no assigned source provides a consistent Brazil SME payment-spend
              denominator, segment share, take-rate bridge, or geography-adjusted SAM/SOM. Those missing inputs prevent
              a precise valuation-grade market forecast.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer segmentation, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is the owner or operator of a micro or small merchant; the user is the same operator and
              frontline staff; the payer is usually the business cash flow. Adoption triggers are lower acceptance
              friction, faster access to funds, transparent fees, and bundled working-capital or business-management
              tools. CloudWalk's 2025 product release says InfinitePay became Brazil's most downloaded finance app on
              the App Store and links adoption to Tap to Pay, JIM, a digital account, Pix, payment links and instant
              access to funds. Sacra's analysis identifies app-based onboarding and next-day settlement as distribution
              advantages versus field sales and rented terminals. Constraints are equally material: merchants must trust
              a financial platform, switching can disrupt settlement, credit expansion depends on underwriting and
              funding, and the company has not publicly disclosed a comparable merchant retention cohort. Regulatory
              obligations also matter: the Central Bank's role in maintaining a sound and efficient financial system
              means licensing and supervision are structural adoption conditions, not optional features. The market case
              is therefore strongest where product bundling reduces workflow friction, and weakest where credit losses,
              funding costs, or trust failures offset payment-led acquisition.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution compounds only if monetization follows
            body: >-
              Payments can lower acquisition cost and create data for credit and account products, but public evidence
              does not yet establish the conversion, retention, or risk-adjusted yield needed to underwrite a durable
              SOM.
            calloutType: insight
            claimRefs:
              - CM006
              - CM013
          - type: callout
            title: Market-size precision is not yet supportable
            body: >-
              The assigned evidence contains company reach and ecosystem indicators, but no consistent external
              denominator for Brazilian SME payment spend or CloudWalk's serviceable share.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's relevant competitive set spans traditional Brazilian acquirers, digital financial platforms,
              commerce ecosystems and the status quo of cash, bank transfers or internal operational work. Its own
              website positions InfinitePay, JIM and Pierre as three brands, while independent and company-issued
              material describes InfinitePay as an app-based platform for small merchants and JIM as an AI-enabled US
              expansion. The competitive distinction is therefore not a single payment feature; it is the attempt to
              combine acceptance, settlement, credit, account data and merchant software in one relationship. That broad
              scope creates more cross-sell surface than a terminal-only proposition, but it also exposes CloudWalk to
              well-capitalized ecosystems such as MercadoLibre/MercadoPago and to incumbent acquirers with established
              distribution. The evidence does not establish that CloudWalk wins every segment or that its software-only
              model has lower realized acquisition cost at scale.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
