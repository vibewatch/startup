              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Monetization and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The monetization model appears to stack several products on the same small-merchant relationship.
              InfinitePay accepts card and Pix payments, provides digital-account and settlement functionality, and
              extends credit; independent analysis describes payment activity as creating transaction history for
              working-capital underwriting and future receivables to finance. A third-party rate table updated in August
              2026 reports headline minimum rates of 0.75% for debit, 1.62% for one-time credit, 2.25% for
              12-installment credit, and zero for Pix, while warning that rates vary by monthly volume, card network,
              product, and settlement timing. Those are list or observed published rates, not realized revenue or
              margin. CloudWalk says its Open Finance position and AI underwriting support credit access, and reports
              that credit granted more than doubled over the 12 months preceding August 2025. Revenue per employee
              reached $1.8 million in 2025 with 720 employees, but this productivity proxy does not substitute for
              customer acquisition cost, payback, loss rates, or contribution margin.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
