      - number: '4.3'
        title: Capital adequacy and funding dependency
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's public capital story has two distinct layers: retained operating profitability and externally
              funded receivables or credit activity. Sacra describes more than $1.3 billion of FIDC debt issuance
              financing AI-underwritten working-capital loans, while the Portuguese Wikipedia page reports a R$3.14
              billion FIDC transaction announced in June 2025. Neither figure establishes cash on hand, free cash flow,
              debt maturities, advance rates, reserve requirements, borrowing costs, or runway. A Brazilian legal-tax
              explainer says FIDCs must meet investment-entity requirements, including at least 67% receivables and
              professional discretionary management, or investors may face the come-cotas tax regime. This is general
              FIDC context rather than evidence of a CloudWalk breach, but it illustrates why fund structure and
              investor demand are material funding dependencies.
            claimRefs:
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a provisional view of strong operating momentum and positive reported earnings,
              with a potentially attractive model if payments distribution continues to cross-sell settlement, accounts,
              and credit. It does not support a full underwriting conclusion on revenue durability or capital adequacy.
              The largest missing bridge is from merchant activity to recognized revenue and gross profit by product,
              including TPV, take rate, processing expense, credit yield, charge-offs, provisions, and funding cost. The
              second is liquidity: cash, unrestricted reserves, FIDC advance rates, maturities, covenants, and stress
              performance are not disclosed in the assigned evidence. Finally, published prices and company-reported
              customer savings should not be treated as realized unit economics. Investors should request cohort-level
              contribution margins, CAC and payback by channel, credit vintage curves, funding concentration, and a
              24-month base/downside cash-and-capital plan before relying on the reported profit trajectory.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI008
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite reported profitability conditionally
            body: >-
              Treat the growth and profit figures as promising but company-reported until product-level revenue
              recognition, gross margin, credit losses, and funding-cost data are obtained.
            calloutType: recommendation
            claimRefs:
              - CI001
              - CI002
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and merchant workflow
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's current public surface is organized around InfinitePay in Brazil, JIM in the United States,
              and Pierre in Brazil. InfinitePay has evolved beyond its initial point-of-sale wedge into phone-based
              acceptance, receivables acceleration, credit, payment links, and account functions. JIM is also embedded
              inside InfinitePay as an assistant for merchant tasks such as pricing, marketing, sales, and receivables,
              while Vision mode can initiate actions from a product, document, or QR-code image. This breadth is
              strategically coherent because each module sits close to a merchant's transaction and cash workflow.
              Public materials, however, do not separate registered access from active, retained, or paid use by module.
