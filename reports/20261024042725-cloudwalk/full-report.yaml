      - number: '1.3'
        title: Funding, financing, and milestones
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's disclosed equity history is concentrated in 2021: Sacra reports a $190 million Series B
              followed by a $150 million Series C, both led by Coatue, for approximately $365 million of lifetime equity
              funding. The same source records $1.3 billion of annualized revenue in 2025, while company announcements
              report $990 million of 2025 revenue, $110 million of net income, and a $1.3 billion annualized run rate in
              December. A later company release dated May 2026 reports approximately $1.7 billion of current annualized
              revenue run rate and $322 million of annualized pre-tax profit as of March 2026; those are run-rate and
              pre-tax measures, not interchangeable with reported revenue or net income. Separately, Valor and NeoFeed
              describe FIDC receivables financing used to fund advances to merchants. This is an important financing
              dependency: FIDC proceeds are not equity capital or cash available for general corporate use, and the
              reviewed sources do not provide a complete current bridge from payment volume to revenue, credit losses,
              funding cost, and cash generation.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.4'
        title: Ground truth and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence supports a company with real product breadth, meaningful merchant reach, and
              reported profitability rather than a venture business dependent only on future monetization. At the same
              time, the evidence base is weighted toward company releases, syndicated announcements, and analyst
              synthesis; it does not establish an independently audited current valuation, a full cap table, board
              governance, customer retention, transaction-volume economics, or the durability of FIDC investor demand.
              The current company overview should therefore be reused as a factual identity layer with explicit
              qualifications: reported scale and profitability are credible company disclosures, historical equity
              valuation is not a current price, and financing-market capacity is not equivalent to unrestricted
              liquidity. A refresh should prioritize primary financial statements, regulatory records, governance
              documents, and a current financing and valuation bridge.
            claimRefs:
              - CO010
              - CO012
              - CO013
              - CO015
