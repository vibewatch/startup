      - number: '3.2'
        title: Capability comparison and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              For an SME buyer, the material buying criteria are onboarding friction, payment acceptance, settlement
              speed, access to working capital, account and cash-flow tools, support quality, trust, and the ability to
              operate without a dedicated terminal. CloudWalk's disclosed product scope includes payment acceptance,
              digital-account features, credit, payment links, e-commerce and AI assistance, while its Open Finance
              program uses consented data to support credit and fee decisions. Stone's official investor surface
              describes a different but overlapping bundle of payments, banking and credit for SMB and micro clients.
              MercadoLibre's 2026 investor release shows MercadoPago as a regional fintech platform serving both
              marketplace and off-platform users, with merchant point-of-sale processing and digital accounts. These are
              meaningful capability overlaps, not proof of parity: the matrix preserves unknowns where public sources do
              not disclose comparable prices, conversion, retention, approval rates or service-level commitments.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP010
              - CP011
      - number: '3.3'
        title: Durability, switching costs and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest potential moat is data and workflow compounding: payment history can inform credit, Open
              Finance consent can improve underwriting and pricing, and a broader merchant relationship can make a
              replacement decision more costly than swapping a card terminal. Sacra's analysis describes this as payment
              volume feeding receivables finance, transaction history and account balances, while CloudWalk reports
              19.5% of Brazilian business Open Finance consents as of August 2025 and more than 5 million active
              clients. The counterargument is that these advantages depend on continued trust, funding access,
              regulatory permissions and useful execution across several products. A competitor with a larger ecosystem
              can bundle payments with commerce or banking, and incumbent acquirers can match individual features.
              CloudWalk's 2025 complaint-ranking release is favorable, but it is company-issued and should not be
              treated as an independent benchmark; public comparable retention, churn, take-rate and merchant cohort
              data remain gaps.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP012
      - number: '3.4'
        title: Evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate observed product overlap from unsupported assumptions. Numeric positioning is
              ordinal rather than a market-share claim: it summarizes the evidence-backed relative breadth of the
              disclosed offering and the apparent strength of distribution or ecosystem reach. No point should be read
              as a verified ranking of revenue, profitability or customer satisfaction. The figure is a decision aid for
              diligence prioritization, not a substitute for provider-level operating data or verified market share.
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the central competitive question
            body: >-
              CloudWalk's software-led acquisition and multi-product expansion could compound merchant value, but the
              assigned evidence does not prove lower acquisition cost or higher retention than incumbents.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
          - type: callout
            title: Pricing and cohort evidence remain decision blockers
            body: >-
              Public sources describe overlapping products but do not provide comparable realized pricing, take rates,
              churn, cohort retention, credit losses or switching costs.
            calloutType: risk
            claimRefs:
              - CP004
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Reported scale and earnings quality
        blocks:
          - type: paragraph
            body: >-
              CloudWalk's latest company-issued figures describe a high-growth, profitable payments and
              financial-services platform rather than a venture business dependent on recurring equity financing. A
              March 2026 release reports $990 million of 2025 revenue, up 104% year over year on a
              foreign-exchange-neutral basis, and $110 million of net income, up 90%; the same release says December
              annualized revenue reached $1.3 billion. An earlier October 2025 release separately reported first-half
              net revenue of $404 million and net income of $39 million. These are not interchangeable measures:
              annualized run rate is not period revenue, and net revenue is not gross merchandise volume. The 2023
              revenue baseline was $320.5 million, according to a company release. The direction is compelling, but
              public disclosures do not show transaction volume, take rate, interchange and processing costs, credit
              yield, provisions, or gross margin, so revenue quality remains only partly underwritten.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
