  - id: FU001
    title: Customer journey from payment acceptance to financial-services expansion
    type: journey-map
    summary: >-
      InfinitePay's public product evidence describes a path from merchant acquisition and settlement into data-enabled
      credit and business-management services.
    data:
      items:
        - stage: '1'
          label: Acquire
          title: Acquire
          description: Owner-operator starts with app-based payment acceptance.
          touchpoints:
            - InfiniteTap
            - card and Pix acceptance
        - stage: '2'
          label: Settle
          title: Settle
          description: Merchant receives proceeds and manages money in the app.
          touchpoints:
            - next-day or instant settlement
            - digital account
        - stage: '3'
          label: Operate
          title: Operate
          description: Merchant adds digital workflows around selling.
          touchpoints:
            - payment links
            - billing
            - inventory and online catalog
        - stage: '4'
          label: Consent
          title: Consent
          description: Merchant may share financial data through Open Finance.
          touchpoints:
            - customer-consented data sharing
            - fee comparison
        - stage: '5'
          label: Expand
          title: Expand
          description: Transaction and consent data can support additional financial products.
          touchpoints:
            - working-capital credit
            - AI fee optimization
        - stage: '6'
          label: Automate
          title: Automate
          description: JIM adds AI assistance to pricing, marketing, and business tasks.
          touchpoints:
            - JIM interactions
            - content and sales support
    claimRefs:
      - CU006
      - CU007
      - CU010
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Relative diligence priority rises where funding, regulation, data, and execution risks combine.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Funding and receivables
          values:
            - label: Medium-High
              detail: Capital availability and portfolio performance are linked.
            - label: High
              detail: Funding disruption could constrain receivables advances and credit.
            - label: Partial
              detail: Multiple institutions and subordinated protection are disclosed.
            - label: High
              detail: Loss rates, covenants, spreads, and concentration remain undisclosed.
        - label: Regulation and data governance
          values:
            - label: Medium
              detail: Broader permissions and Open Finance expand the compliance perimeter.
            - label: High
              detail: Restrictions could affect credit, investment products, and data access.
            - label: Partial
              detail: Payment and credit authorizations plus consent controls are described.
            - label: High
              detail: Supervisory, privacy-control, and complaint evidence remains incomplete.
        - label: AI and service execution
          values:
            - label: Medium
              detail: Automated agents perform several core operating functions.
            - label: High
              detail: Errors could affect underwriting, fraud, software, sales, and support.
            - label: Partial
              detail: Human policy, exception handling, and risk governance are described.
            - label: High
              detail: Independent validation and control-performance metrics are absent.
        - label: Customer concentration
          values:
            - label: Unknown
              detail: Product, merchant, and cohort shares are not disclosed.
            - label: Medium-High
              detail: Concentrated exposure could transmit churn or losses.
            - label: Unverified
              detail: No public concentration schedule was retained.
            - label: High
              detail: Unknown exposure prevents a quantified downside case.
        - label: Partner and settlement dependency
          values:
            - label: Medium
              detail: Institutional funding and card settlement are recurring dependencies.
            - label: High
              detail: Withdrawal, repricing, or settlement failure can affect liquidity.
            - label: Partial
              detail: Multiple funding sources and subordinated protection are claimed.
            - label: High
              detail: Counterparty shares and replacement capacity are undisclosed.
        - label: Privacy and security
          values:
            - label: Medium
              detail: Open Finance and AI broaden the sensitive-data surface.
            - label: High
              detail: A material event could impair trust and regulatory standing.
            - label: Unverified
              detail: Public materials describe intent rather than independent assurance.
            - label: High
              detail: Incident, testing, and remediation evidence is missing.
    approximationNotes: >-
      Relative placement is a qualitative synthesis of cited exposure and disclosed gaps, not a measured probability or
      external benchmark.
    claimRefs:
      - CR006
      - CR007
      - CR011
      - CR014
