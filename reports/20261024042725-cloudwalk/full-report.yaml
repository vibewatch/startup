  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      A source-bounded view of the interfaces, workflows, data, decisioning, agent, and engineering layers visible in
      CloudWalk's public materials.
    data:
      layers:
        - label: Customer interfaces
          detail: Product surfaces through which users initiate financial and business actions.
          items:
            - label: InfinitePay
              detail: Brazil merchant payments, account, credit, and receivables workflows
            - label: JIM.com
              detail: US self-employed seller workflow
            - label: Pierre
              detail: Brazil consumer financial-intelligence workflow
        - label: Merchant workflows
          detail: Tasks performed inside or alongside the product interfaces.
          items:
            - label: Payment acceptance
              detail: Phone and other payment-acceptance surfaces
            - label: Business automation
              detail: Pricing, marketing, storefront, sales, and receivables tasks
        - label: Integration surfaces
          detail: External rails and permissions needed to deliver selected functions.
          items:
            - label: Tap to Pay
              detail: PSP, entitlement, API, interface, and application-review dependency
            - label: Open Finance
              detail: Consent-based financial-data exchange
        - label: Data and decisioning
          detail: Inputs and models used for merchant decisions.
          items:
            - label: Smart Credit
              detail: Merchant scoring using company and Open Finance data
            - label: Dynamic fees
              detail: Pricing adjustments based on business and historical inputs
        - label: Agent orchestration
          detail: AI systems used in customer-facing and internal workflows.
          items:
            - label: JIM
              detail: Merchant assistant built from internal, open-source, and external AI components
            - label: Bela and Claudio Walker
              detail: Sales and support automation described by CloudWalk
        - label: Engineering assets
          detail: Public signals of implementation breadth rather than a complete production topology.
          items:
            - label: Stratus
              detail: Public EVM-compatible ledger focused on performance and observability
            - label: Multi-language repositories
              detail: Current Rust, Python, and Ruby development signals
    approximationNotes: >-
      Layer order is analytical and does not imply that every product traverses every component; no complete production
      architecture was publicly available in the assigned evidence.
