        title: Technology and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model combines payment interfaces, consented financial data, automated
              decisioning, AI-agent workflows, and public engineering assets. CloudWalk says JIM combines proprietary
              technology, open-source AI platforms, internal prompts, and third-party LLM tools. Its Smart Credit engine
              reportedly uses more than 8,000 data points plus Open Finance data, while a separate fee engine adjusts
              merchant pricing using revenue, seasonality, segment, region, and external history. CloudWalk's GitHub
              organization adds a current developer signal through recently updated Rust, Python, and ledger-related
              repositories. These observations establish components, not a complete production topology: data lineage,
