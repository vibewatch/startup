            body: >-
              Luis Silva remains the named founder and chief executive, while the reviewed sources identify functional
              leaders in growth, product, financial services, and treasury. Pulse2's interview identifies Ricardo Cici
              as chief growth officer responsible for global expansion, go-to-market, and revenue growth, and says he
              joined through the acquisition of a payments reconciliation company he founded. CloudWalk's jobs page
