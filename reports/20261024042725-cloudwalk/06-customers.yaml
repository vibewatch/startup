      severity: material
      topic: retention
      missingEvidence: "Merchant-level cohort tables showing activation, repeat payment volume, renewal, churn, GRR, and NRR by acquisition year and product."
      whyItMatters: "Aggregate active-seller growth can coexist with low repeat usage or high churn, so it does not establish durable customer economics."
      diligencePath: "Request monthly cohort retention and revenue bridges segmented by Brazil/U.S., merchant size, product, and acquisition channel."
      relatedQuestionRefs: [QU005, QU008]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-customer and top-cohort revenue, TPV, gross profit, and credit exposure concentration for the latest twelve months."
      whyItMatters: "A large aggregate base may still depend on a small number of merchants, channels, or products."
      diligencePath: "Obtain a customer concentration schedule with top 10, top 50, and long-tail shares plus product-level contribution margins."
      relatedQuestionRefs: [QU007]
    - type: enumeration-incomplete
      severity: minor
      topic: named customer proof
      missingEvidence: "Independent named customer references documenting production deployment, repeat usage, and measurable outcomes."
      whyItMatters: "Company and investor aggregate claims do not independently verify customer outcomes or distinguish pilots from durable production use."
      diligencePath: "Interview a stratified sample of Brazilian and U.S. merchants and reconcile references to billing and activity records."
      relatedQuestionRefs: [QU004, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: eligibility
      missingEvidence: "Activation and service-eligibility rates by identity status, first-transaction status, geography, and product."
      whyItMatters: "The app listing explicitly says not all services are available to all customers, so the feature catalog may overstate realized customer breadth."
      diligencePath: "Request funnel data from account creation through verified activation, first transaction, and each cross-sell product."
      relatedQuestionRefs: [QU007]
