      - [JIM.com U.S. sellers, "Micro-merchants and gig workers", "Smartphone payments and autonomous financial-agent functions", "Production launch; early adoption", "Tens of thousands across all 50 states reported within months", "No public paid conversion, churn, or outcome dataset"]
      - [InfinitePay JIM users, "Brazilian entrepreneurs", "AI assistant for pricing, marketing, transactions, and content", "Production feature; early interaction", "Thousands of entrepreneurs reported interacting after launch", "No denominator, frequency, or measured business outcome"]
    notes: "This is a partial public enumeration, not a complete customer list; logos and aggregate counts do not prove retention or production outcomes for every account."
    claimRefs: [CU006, CU009, CU010, CU011, CU012]
