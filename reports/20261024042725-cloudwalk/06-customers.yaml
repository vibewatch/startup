chapter:
  number: 6
  title: Customers
  summary: CloudWalk's customer evidence shows a large and expanding base of Brazilian micro and small merchants, with InfinitePay combining payments, settlement, credit, and business tools. Public proof is strongest for account scale, product usage surfaces, and customer-consented Open Finance activity; retention, revenue concentration, and cohort durability remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer and user segmentation
    body: >-
      CloudWalk primarily serves Brazilian micro and small entrepreneurs whose jobs include accepting cards and Pix, receiving proceeds quickly, issuing invoices, managing inventory, and accessing working capital. Sacra describes the initial target as hairdressers, street vendors, delivery drivers, and other micro-entrepreneurs earning roughly $500-$1,000 per month, while the InfinitePay listing also names shopkeepers, entrepreneurs, and merchants. The buyer, user, and payer are often the same owner-operator, but Team Mode and multiple phone installations introduce staff and delivery workers as additional users. The platform also reaches U.S. micro-merchants through JIM.com, although public evidence does not disclose U.S. revenue or retention by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and usage trajectory
    body: >-
      Publicly available evidence supports rapid top-of-funnel growth, but not a complete retention funnel. Company and investor materials report InfinitePay growth from 3 million to more than 6.3 million active sellers in 2025, while an August 2025 company release reported more than 5 million active clients and 19.5% of Brazilian business Open Finance data-sharing consents. Sacra independently describes a rise from 70,000 merchants to more than 6 million and identifies payment links, digital accounts, and AI-underwritten working-capital loans as products layered onto the payments relationship. These figures use different dates and labels, so they should not be added together or treated as a deduplicated customer count.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-retention
    title: Named proof, durability, and expansion
    body: >-
      Named proof is more developed for product availability and reported customer outcomes than for contractual durability. CloudWalk's JIM announcement says the assistant was available to more than 4 million InfinitePay customers in April 2025 and that thousands of entrepreneurs were already interacting with it after its mid-March introduction. The Open Finance release links customer consent to stated benefits such as access to credit and better rates, and reports fee savings and increased credit issuance. However, these are company-issued or investor-adjacent disclosures: they do not establish renewal, gross or net retention, customer-level revenue, or production deployment for each named merchant. The customer thesis therefore depends on validating cohorts, repeat usage, and cross-sell conversion in diligence.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-risks
    title: Expansion and concentration risks
    body: >-
      CloudWalk's expansion logic is attractive because a merchant relationship can extend from acquiring into instant settlement, payment links, accounts, credit, and business management. Sacra characterizes each merchant as adding transaction history and receivables that can support additional financial products, while the app listing shows the breadth of the cross-sell surface. The same model creates diligence risks: the public record does not disclose customer concentration, revenue by product, cohort retention, credit adoption by cohort, or the share of activity from the largest merchants. Availability is also conditional: the app listing states that not all services are available to all customers and requires identity verification and a first transaction for benefits. This limitation is a concrete reason to test eligibility, activation, and realized product breadth rather than infer it from the feature catalog.
    claimRefs: [CU013, CU014, CU015]
    callouts:
      - calloutType: strength
        title: Distribution can compound
        body: InfinitePay's app-first distribution and layered financial products create a credible path from a payments account to repeat financial-services usage, but the conversion and retention rates are not publicly disclosed.
        claimRefs: [CU006, CU013]
      - calloutType: risk
        title: Retention is the central missing proof
        body: The available evidence establishes scale and reported product interactions, not merchant cohort durability, revenue concentration, or net expansion; management data should be requested before underwriting customer quality.
        claimRefs: [CU012, CU014, CU015]
