company:
  name: CloudWalk
chapter:
  number: 4
  title: Financials
  summary: CloudWalk reports unusually rapid, profitable growth, but the public record does not provide a complete payments revenue-quality, margin, or funding-cost bridge. The underwriting case therefore rests on validating whether merchant growth, credit expansion, and FIDC funding can continue without materially increasing risk or compressing economics.
sections:
  - id: reported-scale-and-quality
    title: Reported scale and earnings quality
    body: >-
      CloudWalk's latest company-issued figures describe a high-growth, profitable payments and financial-services platform rather than a venture business dependent on recurring equity financing. A March 2026 release reports $990 million of 2025 revenue, up 104% year over year on a foreign-exchange-neutral basis, and $110 million of net income, up 90%; the same release says December annualized revenue reached $1.3 billion. An earlier October 2025 release separately reported first-half net revenue of $404 million and net income of $39 million. These are not interchangeable measures: annualized run rate is not period revenue, and net revenue is not gross merchandise volume. The 2023 revenue baseline was $320.5 million, according to a company release. The direction is compelling, but public disclosures do not show transaction volume, take rate, interchange and processing costs, credit yield, provisions, or gross margin, so revenue quality remains only partly underwritten.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI007]
    tableRefs: [TI001]
  - id: monetization-and-unit-economics
    title: Monetization and operating leverage
    body: The monetization model appears to stack several products on the same small-merchant relationship. InfinitePay accepts card and Pix payments, provides digital-account and settlement functionality, and extends credit; independent analysis describes payment activity as creating transaction history for working-capital underwriting and future receivables to finance. A third-party rate table updated in August 2026 reports headline minimum rates of 0.75% for debit, 1.62% for one-time credit, 2.25% for 12-installment credit, and zero for Pix, while warning that rates vary by monthly volume, card network, product, and settlement timing. Those are list or observed published rates, not realized revenue or margin. CloudWalk says its Open Finance position and AI underwriting support credit access, and reports that credit granted more than doubled over the 12 months preceding August 2025. Revenue per employee reached $1.8 million in 2025 with 720 employees, but this productivity proxy does not substitute for customer acquisition cost, payback, loss rates, or contribution margin.
    claimRefs: [CI004, CI009, CI010, CI011, CI012, CI015]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-funding
    title: Capital adequacy and funding dependency
    body: >-
      CloudWalk's public capital story has two distinct layers: retained operating profitability and externally funded receivables or credit activity. Sacra describes more than $1.3 billion of FIDC debt issuance financing AI-underwritten working-capital loans, while the Portuguese Wikipedia page reports a R$3.14 billion FIDC transaction announced in June 2025. Neither figure establishes cash on hand, free cash flow, debt maturities, advance rates, reserve requirements, borrowing costs, or runway. A Brazilian legal-tax explainer says FIDCs must meet investment-entity requirements, including at least 67% receivables and professional discretionary management, or investors may face the come-cotas tax regime. This is general FIDC context rather than evidence of a CloudWalk breach, but it illustrates why fund structure and investor demand are material funding dependencies.
    claimRefs: [CI013, CI014, CI016]
    tableRefs: []
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The public record supports a provisional view of strong operating momentum and positive reported earnings, with a potentially attractive model if payments distribution continues to cross-sell settlement, accounts, and credit. It does not support a full underwriting conclusion on revenue durability or capital adequacy. The largest missing bridge is from merchant activity to recognized revenue and gross profit by product, including TPV, take rate, processing expense, credit yield, charge-offs, provisions, and funding cost. The second is liquidity: cash, unrestricted reserves, FIDC advance rates, maturities, covenants, and stress performance are not disclosed in the assigned evidence. Finally, published prices and company-reported customer savings should not be treated as realized unit economics. Investors should request cohort-level contribution margins, CAC and payback by channel, credit vintage curves, funding concentration, and a 24-month base/downside cash-and-capital plan before relying on the reported profit trajectory.
    claimRefs: [CI001, CI002, CI004, CI008, CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: strength
        title: Profitable scale is a meaningful signal
        body: Reported 2025 revenue and net income growth, together with $1.8 million of revenue per employee, indicate operating leverage; the figures remain company-issued and should be reconciled to audited or lender-level reporting.
        claimRefs: [CI001, CI002, CI004]
      - calloutType: risk
        title: Funding transparency is the central blocker
        body: FIDC-supported credit expansion can make payments distribution more valuable, but the assigned evidence does not disclose cash, funding cost, reserve, maturity, or stress-loss data sufficient to test liquidity resilience.
        claimRefs: [CI013, CI014, CI016]
tables:
  - id: TI001
    title: Reported financial scale
    columns: [Metric, Period, Value, Interpretation, Diligence ask]
    rows:
      - [Revenue, "2023", "$320.5m", "Company-reported period revenue", "Reconcile to audited statements and revenue recognition policy"]
      - [Net revenue, "H1 2025", "$404m", "Company-reported net revenue; not annualized revenue", "Define deductions and reconcile to gross revenue"]
      - [Net income, "H1 2025", "$39m", "Company-reported first-half profit", "Reconcile to tax, provisions, and cash conversion"]
      - [Revenue, "FY 2025", "$990m", "Company-reported revenue, +104% YoY FX-neutral", "Validate FX treatment and product mix"]
      - [Net income, "FY 2025", "$110m", "Company-reported net income, +90% YoY", "Request audited financial statements"]
      - [Annualized revenue run rate, "Dec 2025", "$1.3bn", "Run rate, not period revenue", "Provide calculation and underlying monthly cohort data"]
    notes: "Company-issued releases report different revenue concepts and periods; annualized revenue/run rate is not equivalent to recognized revenue, ARR, or GMV."
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI007]
  - id: TI002
    title: Revenue streams and monetization
    columns: [Stream, Mechanism, Published value/status, Quality, Diligence ask]
    rows:
      - [Card acceptance, "Merchant card payments through InfinitePay", "Active product; realized take rate undisclosed", "Core payments stream; company and independent descriptions", "TPV, take rate, network and processing costs"]
      - [Pix and instant payments, "Pix acceptance and instant settlement", "Pix listed at 0% in an independent rate table; settlement fees vary by product", "Published list/observed pricing, not revenue", "Product-level net revenue and settlement economics"]
      - [Digital account, "Account and balances attached to merchant relationship", "Available product; revenue contribution undisclosed", "Cross-sell mechanism, no public mix", "Average balances, interchange, fees, retention"]
      - [Merchant credit, "AI-underwritten working-capital loans", "Credit granted more than doubled over the 12 months preceding August 2025", "Company claim; yield and losses undisclosed", "Vintage curves, approval, yield, defaults, provisions"]
      - [Receivables-backed credit, "Working-capital lending financed through FIDC structures", "Public sources report material FIDC issuance; realized yield and losses are undisclosed", "Potential fee and interest stream with funding dependency", "Credit yield, losses, advance rates, funding cost, and maturities"]
    notes: "Product existence and list pricing do not establish realized revenue, contribution margin, or product mix."
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
  - id: TI003
    title: Unit-economics and capital-data availability
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue per employee, "$1.8m in 2025", "Medium; company-reported", "Operating leverage proxy", "Reconcile average headcount and exclude pass-through revenue"]
      - [Customer acquisition cost, null, "Unavailable", "Tests whether growth is self-funding", "CAC and payback by channel and cohort"]
      - [Gross margin, null, "Unavailable", "Separates payment scale from economic value", "Product-level gross-margin bridge"]
      - [Credit loss rate, null, "Unavailable", "Determines whether credit growth creates or destroys value", "Vintage loss, recovery, and provisioning history"]
      - [Funding cost, null, "Unavailable", "Tests FIDC and balance-sheet economics", "Weighted funding cost, fees, advance rates, maturities"]
      - [Cash and runway, null, "Unavailable", "Tests liquidity and next-round dependency", "Cash, restricted cash, stress runway, covenants"]
      - [Net revenue retention, null, "Unavailable", "Tests merchant expansion and churn", "Cohort retention and product attach data"]
    notes: "Null means the assigned public evidence did not disclose the metric; no unavailable value is treated as zero or estimated."
    claimRefs: [CI004, CI013, CI014, CI016]
figures:
  - id: FI001
    title: Payments-to-finance revenue model
    type: flow
    summary: Merchant activity can feed payment fees, settlement and account usage, and credit economics, but the public evidence does not quantify conversion or profitability at each step.
    data:
      nodes:
        - id: merchant-activity
          label: Merchant payments and Pix
          detail: "Transaction activity and settlement through InfinitePay"
        - id: payment-revenue
          label: Payment and settlement revenue
          detail: "Fees depend on product, volume, card network, and settlement timing"
        - id: data-and-balances
          label: Transaction data and account balances
          detail: "Data and balances can support broader financial products"
        - id: credit-revenue
          label: Credit and receivables economics
          detail: "AI-underwritten working capital financed partly through FIDC structures"
        - id: funding-layer
          label: FIDC funding layer
          detail: "Receivables funding supports credit activity but adds refinancing and structural dependencies"
        - id: gross-profit
          label: Gross profit and capital demand
          detail: "Processing costs, losses, provisions, and funding costs are not publicly bridged"
      edges:
        - [merchant-activity, payment-revenue]
        - [merchant-activity, data-and-balances]
        - [data-and-balances, credit-revenue]
        - [credit-revenue, funding-layer]
        - [funding-layer, gross-profit]
        - [payment-revenue, gross-profit]
        - [credit-revenue, gross-profit]
    approximationNotes: "This is a qualitative operating-model flow, not a proportional revenue bridge or conversion funnel."
    claimRefs: [CI012, CI013, CI014, CI016]
callouts:
  - calloutType: recommendation
    title: Underwrite reported profitability conditionally
    body: Treat the growth and profit figures as promising but company-reported until product-level revenue recognition, gross margin, credit losses, and funding-cost data are obtained.
    claimRefs: [CI001, CI002, CI013, CI016]
