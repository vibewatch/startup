      - ["JIM.com", "US self-employed sellers", "Current company page says available in all 50 states", "Agentic payment and storefront workflow", "Authorized-state scope and active seller denominator"]
      - ["Pierre", "Brazilian consumers", "Current company page says available in Brazil", "Open Finance-based account monitoring and financial guidance", "Consent retention, accuracy, and suitability controls"]
      - ["Smart Credit and fee engine", "InfinitePay merchants", "Company reports live credit and dynamic-fee use", "Combines merchant activity with Open Finance inputs", "Approval, default, bias, and fee-distribution evidence"]
      - ["Public engineering assets", "CloudWalk engineers and technical users", "Multiple repositories show 2026 updates", "Visible Rust, Python, Ruby, and ledger work", "Production usage, contributor depth, and security-review scope"]
    notes: >-
      Status and differentiation reflect public or company-issued evidence as
      of the access date; they do not establish independent production maturity
      or adoption for every listed module.
    claimRefs: [CE001, CE002, CE003, CE004, CE010, CE011, CE012]
  - id: TE002
    title: Workflow and use-case table
    columns:
      - User job
      - Prior friction
      - CloudWalk surface
      - Public benefit signal
      - Limitation
    rows:
      - ["Accept contactless payments", "Dedicated terminal or hardware setup", "InfinitePay phone-based acceptance", "Tap to Pay can accept contactless payments on iPhone without extra terminals", "CloudWalk-specific authorization and device-success rates are unavailable"]
      - ["Manage sales and receivables", "Manual reconciliation and task switching", "JIM inside InfinitePay", "Company describes transaction, statement, sales, and receivables actions", "Independent usage and action-error rates are unavailable"]
      - ["Price and market products", "Limited specialist time", "JIM and Vision mode", "Company describes price comparison and social-content generation from images", "No independently measured sales uplift or content-quality benchmark"]
      - ["Obtain working capital", "Slow underwriting and fragmented data", "Smart Credit", "Company says more than 8,000 data points feed merchant scoring", "Approval, loss, pricing, and fairness distributions are unavailable"]
      - ["Monitor personal finances", "Accounts and upcoming obligations are fragmented", "Pierre", "Company describes daily Open Finance account reading and planning", "Accuracy, engagement, and advice-suitability evidence are unavailable"]
    notes: >-
      Benefits are disclosed capabilities or platform properties, not causal
      customer outcomes; the limitation column identifies missing underwriting
      evidence rather than implying product failure.
    claimRefs: [CE001, CE004, CE005, CE010, CE013, CE014, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Disclosed dependency
      - Principal technical risk
    rows:
      - ["Merchant interfaces", "Expose payments, finance, and business actions", "Mobile applications and device capabilities", "Availability, accessibility, and action authorization"]
      - ["Acceptance integration", "Read contactless payment credentials", "Supported PSP, Apple entitlement, APIs, and app review", "Certification drift, device coverage, and authorization failures"]
      - ["Financial-data layer", "Supply consented external account information", "Brazilian Open Finance standards and customer consent", "Privacy, revocation, stale data, and reconciliation"]
      - ["Decisioning layer", "Score credit and adjust merchant fees", "Transaction, business, regional, and Open Finance inputs", "Bias, explainability, data quality, and model drift"]
      - ["Agent layer", "Automate sales, support, marketing, and merchant tasks", "Open-source frameworks, internal prompts, external LLM tools, and live data", "Hallucination, unsafe actions, escalation, and vendor concentration"]
      - ["Engineering and ledger assets", "Support performance, observability, and internal software", "Public repositories plus undisclosed production infrastructure", "Incomplete topology, resilience, key-management, and audit evidence"]
    notes: >-
      This is an evidence-bounded analytical stack, not a company-provided
      architecture diagram; connections and risks are limited to disclosed
      components and explicit platform dependencies.
    claimRefs: [CE006, CE007, CE010, CE011, CE012, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      A source-bounded view of the interfaces, workflows, data, decisioning,
      agent, and engineering layers visible in CloudWalk's public materials.
    data:
      layers:
        - label: Customer interfaces
          detail: Product surfaces through which users initiate financial and business actions.
          items:
            - label: InfinitePay
              detail: Brazil merchant payments, account, credit, and receivables workflows
            - label: JIM.com
              detail: US self-employed seller workflow
            - label: Pierre
              detail: Brazil consumer financial-intelligence workflow
        - label: Merchant workflows
          detail: Tasks performed inside or alongside the product interfaces.
          items:
            - label: Payment acceptance
              detail: Phone and other payment-acceptance surfaces
            - label: Business automation
              detail: Pricing, marketing, storefront, sales, and receivables tasks
        - label: Integration surfaces
          detail: External rails and permissions needed to deliver selected functions.
          items:
            - label: Tap to Pay
              detail: PSP, entitlement, API, interface, and application-review dependency
            - label: Open Finance
              detail: Consent-based financial-data exchange
        - label: Data and decisioning
          detail: Inputs and models used for merchant decisions.
          items:
            - label: Smart Credit
              detail: Merchant scoring using company and Open Finance data
            - label: Dynamic fees
              detail: Pricing adjustments based on business and historical inputs
        - label: Agent orchestration
          detail: AI systems used in customer-facing and internal workflows.
          items:
            - label: JIM
              detail: Merchant assistant built from internal, open-source, and external AI components
            - label: Bela and Claudio Walker
              detail: Sales and support automation described by CloudWalk
        - label: Engineering assets
          detail: Public signals of implementation breadth rather than a complete production topology.
          items:
            - label: Stratus
              detail: Public EVM-compatible ledger focused on performance and observability
            - label: Multi-language repositories
              detail: Current Rust, Python, and Ruby development signals
    approximationNotes: >-
      Layer order is analytical and does not imply that every product traverses
      every component; no complete production architecture was publicly
      available in the assigned evidence.
    claimRefs: [CE001, CE004, CE006, CE007, CE010, CE012, CE014]
