      - [PagSeguro, hardware-and-field-distribution peer, "No comparable scale metric in the assigned evidence", "Brazilian SMB acquiring, as characterized by Sacra", "Cheaper hardware and field distribution in Sacra's comparison", "Current scope, pricing and operating scale are not established by an assigned primary source"]
