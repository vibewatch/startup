chapter:
  number: 3
  title: Competitors
  summary: CloudWalk competes in Brazilian merchant acquiring and SME financial services through a software-led, multi-product model. The evidence supports differentiation from traditional terminal-led acquirers through app distribution, credit, Open Finance and AI-enabled service, but public evidence is insufficient to compare realized pricing or unit economics with peers.
sections:
  - id: landscape
    title: Landscape and strategic position
    body: >-
      CloudWalk's relevant competitive set spans traditional Brazilian acquirers, digital financial platforms, commerce ecosystems and the status quo of cash, bank transfers or internal operational work. Its own website positions InfinitePay, JIM and Pierre as three brands, while independent and company-issued material describes InfinitePay as an app-based platform for small merchants and JIM as an AI-enabled US expansion. The competitive distinction is therefore not a single payment feature; it is the attempt to combine acceptance, settlement, credit, account data and merchant software in one relationship. That broad scope creates more cross-sell surface than a terminal-only proposition, but it also exposes CloudWalk to well-capitalized ecosystems such as MercadoLibre/MercadoPago and to incumbent acquirers with established distribution. The evidence does not establish that CloudWalk wins every segment or that its software-only model has lower realized acquisition cost at scale.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-buying-criteria
    title: Capability comparison and buyer trade-offs
    body: >-
      For an SME buyer, the material buying criteria are onboarding friction, payment acceptance, settlement speed, access to working capital, account and cash-flow tools, support quality, trust, and the ability to operate without a dedicated terminal. CloudWalk's disclosed product scope includes payment acceptance, digital-account features, credit, payment links, e-commerce and AI assistance, while its Open Finance program uses consented data to support credit and fee decisions. Stone's official investor surface describes a different but overlapping bundle of payments, banking and credit for SMB and micro clients. MercadoLibre's 2026 investor release shows MercadoPago as a regional fintech platform serving both marketplace and off-platform users, with merchant point-of-sale processing and digital accounts. These are meaningful capability overlaps, not proof of parity: the matrix preserves unknowns where public sources do not disclose comparable prices, conversion, retention, approval rates or service-level commitments.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability-and-risk
    title: Durability, switching costs and displacement risk
    body: >-
      The strongest potential moat is data and workflow compounding: payment history can inform credit, Open Finance consent can improve underwriting and pricing, and a broader merchant relationship can make a replacement decision more costly than swapping a card terminal. Sacra's analysis describes this as payment volume feeding receivables finance, transaction history and account balances, while CloudWalk reports 19.5% of Brazilian business Open Finance consents as of August 2025 and more than 5 million active clients. The counterargument is that these advantages depend on continued trust, funding access, regulatory permissions and useful execution across several products. A competitor with a larger ecosystem can bundle payments with commerce or banking, and incumbent acquirers can match individual features. CloudWalk's 2025 complaint-ranking release is favorable, but it is company-issued and should not be treated as an independent benchmark; public comparable retention, churn, take-rate and merchant cohort data remain gaps.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: exhibits
    title: Evidence exhibits
    body: >-
      The exhibits separate observed product overlap from unsupported assumptions. Numeric positioning is ordinal rather than a market-share claim: it summarizes the evidence-backed relative breadth of the disclosed offering and the apparent strength of distribution or ecosystem reach. No point should be read as a verified ranking of revenue, profitability or customer satisfaction. The figure is a decision aid for diligence prioritization, not a substitute for provider-level operating data or verified market share.
    claimRefs: [CP003, CP006, CP009, CP012]
