      - [Payment acceptance and settlement, "Payment solutions; up to 2-second receipt is company-founder claim from 2022", "Payments disclosed", "Online and physical POS processing disclosed", "All three have overlap; realized speed and cost are not comparable"]
      - [Working-capital credit, "AI/Open Finance credit and Smart Credit disclosed", "Credit disclosed", "Credit lines disclosed", "Credit is a shared category; approval, loss and pricing data are unknown"]
      - [Digital account / broader financial services, "InfinitePay and Pierre disclosed", "Banking disclosed", "Digital account, savings, investments and insurance disclosed", "Ecosystem breadth favors incumbents on disclosed scope, but usage is unknown"]
      - [AI-enabled merchant operations, "JIM and AI support agents disclosed", "Unknown", "Unknown in assigned release", "Potential differentiation, not independently benchmarked"]
      - [Trust / service evidence, "Company reports 135 valid complaints and index 9.55 in Q3 2025 ranking", "Unknown", "Unknown", "CloudWalk evidence is company-issued; independent validation is required"]
    notes: "Cells marked Unknown are intentionally unsupported by the assigned fetched texts. Company-issued descriptions are classified as company evidence, not independent comparative proof."
    claimRefs: [CP002, CP005, CP007, CP010, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [Provider or alternative, Price / unit / contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [CloudWalk / InfinitePay, "Not disclosed in assigned source pool", "Payments, account, credit, payment links, e-commerce and AI features are described", "Realized merchant pricing and bundles unknown", "Cannot conclude price leadership from capability breadth"]
      - [Stone, "Not disclosed in fetched investor-relations text", "Payments, banking and credit are described", "Discounts and contract terms unknown", "Incumbent overlap is clear; price comparison is not"]
      - [MercadoPago, "Not disclosed in assigned Q1 2026 release", "Online and physical POS processing, digital account and credit are described", "Merchant pricing and incentives unknown", "Ecosystem bundling may matter, but no like-for-like quote exists"]
      - ["Cash, bank transfer or internal build", "Merchant-specific and not standardized", "Existing workflow or self-managed operations", "Operational cost and reliability unknown", "Status quo can win where avoiding migration outweighs feature benefits"]
    notes: "No assigned source provides a like-for-like current list-price schedule for CloudWalk and peers. The table therefore records unknowns rather than estimating realized take rates or discounts."
    claimRefs: [CP004, CP006, CP007, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "CloudWalk appears broad in disclosed merchant-finance capabilities and software-led distribution, while MercadoPago has the strongest disclosed ecosystem reach; points are ordinal analytical summaries, not market-share measurements."
    data:
      xAxis: "Disclosed software-led distribution and merchant workflow breadth (ordinal)"
      yAxis: "Disclosed ecosystem reach and adjacent financial-service breadth (ordinal)"
      points:
        - {label: InfinitePay Brazil, x: 7, y: 8, note: "App-led payments, credit, Open Finance and merchant software are disclosed; scores do not measure adoption or economics.", tone: positive}
        - {label: JIM United States, x: 8, y: 6, note: "CloudWalk says JIM serves sellers across all 50 states with payments and merchant-operation automation.", tone: positive}
        - {label: Pierre Brazil, x: 5, y: 6, note: "CloudWalk describes an Open Finance-based consumer account, investment product and card.", tone: neutral}
        - {label: MercadoPago, x: 9, y: 9, note: "The 2026 issuer release describes commerce-linked and off-platform fintech services across 18 countries.", tone: positive}
        - {label: Stone, x: 6, y: 7, note: "Stone's official surface discloses payments, banking and credit for SMB and micro clients.", tone: neutral}
        - {label: PagSeguro model, x: 5, y: 4, note: "Sacra characterizes its historical distribution as cheaper hardware plus field sales; current breadth is not established.", tone: neutral}
    approximationNotes: "The 1–10 coordinates are ordinal analyst classifications of only the disclosed product scope and geographic or distribution reach. They are not measured market share, pricing, adoption, profitability or customer-satisfaction scores."
    claimRefs: [CP001, CP002, CP003, CP005, CP006]
callouts:
  - calloutType: insight
    title: Distribution is the central competitive question
    body: CloudWalk's software-led acquisition and multi-product expansion could compound merchant value, but the assigned evidence does not prove lower acquisition cost or higher retention than incumbents.
    claimRefs: [CP003, CP009]
  - calloutType: risk
    title: Pricing and cohort evidence remain decision blockers
    body: Public sources describe overlapping products but do not provide comparable realized pricing, take rates, churn, cohort retention, credit losses or switching costs.
    claimRefs: [CP004, CP012]
