    notes: "Scale signals are not comparable measures: market capitalization, customer counts and a retained investor-relations homepage are different evidence types. Unknown means the assigned fetched text did not support a comparable value."
    enumerationScope:
      coverage: partial
      basis: "Named alternatives retained from the assigned 2026 competitor search pool, not a complete census of Brazilian payments providers."
