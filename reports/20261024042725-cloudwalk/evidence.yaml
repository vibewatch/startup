evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete cap table, board roster, independent-director composition, and succession plan.
    whyItMatters: Founder dependence and investor control cannot be assessed reliably without ownership and governance evidence.
    diligencePath: >-
      Request the latest cap table, shareholder agreement, board minutes or roster, and management succession plan under
      NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: financial-scale
    missingEvidence: >-
      A reconciled statement showing reported revenue, annualized run rate, net revenue, pre-tax profit, and net income
      on consistent periods and definitions.
    whyItMatters: >-
      Run-rate and accounting metrics are not interchangeable and could materially change valuation or profitability
      interpretation.
    diligencePath: >-
      Obtain audited or management-certified 2025 statements plus monthly 2026 management accounts and a
      metric-definition bridge.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: FIDC-financing
    missingEvidence: Current FIDC concentration, delinquencies, chargebacks, reserve structure, renewal terms, and funding-cost data.
    whyItMatters: >-
      Receivables financing supports merchant liquidity and may constrain growth if investor appetite or portfolio
      performance weakens.
    diligencePath: >-
      Review FIDC offering documents, monthly trustee reports, portfolio stratification, subordinated exposure, and
