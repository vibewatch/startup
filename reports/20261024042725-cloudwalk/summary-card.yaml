  topStrengths:
    - Reported rapid revenue and net-income growth with positive profitability.
    - Integrated payments, accounts, credit, and merchant-automation product breadth.
    - Software-led distribution and transaction data create a plausible underwriting and cross-sell loop.
  topRisks:
    - FIDC funding, reserve coverage, credit losses, and liquidity sensitivity are not fully disclosed.
    - Public customer figures use inconsistent populations and do not establish retention or concentration.
    - The only retained equity valuation is the 2021 $2.15 billion mark, with no current price-discovery point.
  unresolvedGaps:
    - No public TPV, take-rate, reserve, and funding-cost bridge sufficient for full revenue-quality underwriting.
    - No public NRR, GRR, or merchant-cohort retention disclosure comparable to public-market peers.
    - No fresh 2025-2026 private price-discovery point beyond the widely cited US$2.15B valuation mark.
