  title: Market Analysis
  summary: Define the market boundary, buyer budgets, sizing lenses, and adoption constraints that govern valuation.
sections:
- id: market-boundary
  title: Boundary and substitutes
  body: 'The most defensible market boundary is defense ISR plus the autonomy stack around it, not a generic drone market
    and not consumer mapping. Quantum Systems is now explicitly positioned around air, land, sea, counter-UAS, and a mission-software
    layer, which means its addressable market is the sum of hardware, integration, sustainment, and software budget lines
    rather than just airframe sales. That framing is reinforced by the company’s procurement-led evidence: public references
    are overwhelmingly to military and government customers, and the most relevant substitutes are legacy UAV suppliers, prime
    contractors, manual ISR workflows, and autonomy platforms from Anduril, Helsing, or Auterion-like software layers.'
  claimRefs:
  - CM001
  - CM002
  - CM006
  - CM009
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: buyers-and-adoption
  title: Buyers, budget owners, and adoption path
  body: The buyer map is public-sector heavy. Budget ownership sits with defense ministries, armed forces, and allied procurement
    bodies, while the user is often the tactical unit or operator rather than the purchasing authority. That means adoption
    depends on procurement cycles, local sustainment, field performance, and trust, not on product-led growth or trial-to-paid
    conversion. The available evidence also suggests that national sovereignty requirements and in-country production are
    part of the buying decision, which makes local footprint and allied-market access strategically important. In practice,
    the company wins when it can show operational proof, local support, and compatibility with existing military workflows.
  claimRefs:
  - CM003
  - CM004
  - CM007
  - CM010
  - CM011
  tableRefs:
  - TM003
- id: sizing-and-constraints
  title: Sizing lenses and constraints
  body: A single credible TAM number is not supported by the public record, so this chapter preserves multiple lenses instead
    of forcing one estimate. The most useful lenses are procurement spend, installed-base expansion, software attach, and
    allied-market localization. Those lenses fit the company’s strategic re-rating in 2025-2026, when public reporting linked
    defense rearmament to rising investor willingness to pay up for sovereign autonomy platforms. The main constraints are
    procurement friction, switching costs, regulatory approvals, and the need to prove reliability in live operations. That
    combination usually favors vendors with field performance and local support, but it also means the market can be large
    without being easy to win. The pyramid below makes the layered market lens explicit.
  claimRefs:
  - CM005
  - CM008
  - CM012
  tableRefs:
  - TM002
