- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Lens
  - What it measures
  - Proxy / input
  - Why it is useful
  rows:
  - - Procurement spend
    - Budget flowing through defense contracts
    - Named national programs
    - Closest to revenue
  - - Installed base
    - Deployed systems per customer
    - Ukraine / allied missions
    - Shows expansion potential
  - - Software attach
    - Recurring layer attached to hardware
    - MOSAIC / QBase
    - Tests margin upside
  - - Sovereign localization
    - Local manufacturing / sustainment spend
    - Regional footprints
    - Defensibility in procurement
  - - Adjacent domains
    - Land / sea / cUAS budgets
    - Roadmap categories
    - Optionality beyond ISR
  - - Allied expansion
    - NATO and partner-state demand
    - Europe / US / allied markets
    - Geographic growth lens
  - - Replacement cycle
    - Refresh of legacy UAVs
    - Budget timing
    - Constraint on speed
  - - Competition share
    - Budget share taken from rivals
    - Peers and substitutes
    - Useful for scenario planning
  - - Commercial overlap
    - Industrial / mapping overlap
    - Trinity legacy use
    - Secondary revenue pool
  - - Strategic premium
    - Valuation uplift for sovereignty
    - Observed 2025-2026 rerating
    - Explains price discipline
  notes: This is a multiple-lens sizing scaffold, not a numeric TAM model. It keeps the market question honest when the public
    record is incomplete.
