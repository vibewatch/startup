chapter:
  number: 1
  title: Company Overview
  summary: Establish identity, leadership, funding, scale, and milestones that later chapters can reuse as ground truth.
sections:
- id: identity-and-offering
  title: Identity and offering
  body: Quantum Systems is best understood as a Munich-area defense technology company that builds autonomous unmanned systems
    and mission software rather than a single-drone vendor. The public identity now spans aerial intelligence, ground autonomy,
    maritime adjacencies, and counter-UAS, all tied together by a software-defined stack. That matters for the refresh because
    the company markets itself around an interoperable family of systems, not just a tactical ISR platform. The website and
    third-party profiles agree on the founding year and on Germany as the operating center of gravity, while the company’s
    own wording emphasizes government, security, and commercial buyers.
  claimRefs:
  - CO001
  - CO003
  - CO004
  tableRefs:
  - TO001
- id: leadership-and-financing
  title: Leadership, founders, and financing
  body: 'The leadership picture is stable at the founder level even as the company scales quickly. Florian Seibel and Sven
    Kruck are the names most consistently associated with the business, and the 2026 financing announcement treats both as
    co-founders/co-CEOs. Funding history is much clearer than private operating metrics: the company has documented a 2023
    Series B, a 2025 Series C, and a 2026 Series D that pushed the post-money valuation to roughly $8 billion. Multiple independent
    sources corroborate the funding size and investor syndicate, which gives the cap-table story more credibility than the
    private metrics story.'
  claimRefs:
  - CO002
  - CO005
  - CO006
  - CO008
  tableRefs:
  - TO002
  - TO003
- id: scale-and-gaps
  title: Scale, footprint, and diligence gaps
  body: The scale narrative is strong but not fully audited. Company statements and third-party reporting point to over 19,000
    missions in Ukraine during 2025, a production footprint spanning Germany, Ukraine, the US, Australia, Romania, the UK,
    and the Baltics, and a rapid transition from hardware-only drone sales toward a software-defined autonomy platform. At
    the same time, the public record still leaves open the exact current revenue base, gross margin, cash runway, and cap-table
    preference terms. Headcount is also only approximate because different public profiles report materially different numbers,
    which means the refresh should treat employee count as a range rather than a point estimate. The milestone timeline below
    captures the refresh cadence and the acceleration in financing.
  claimRefs:
  - CO007
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs: []
  figureRefs:
  - FO001
