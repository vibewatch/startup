  title: Risks
  summary: Rank legal, regulatory, operational, partner, and financial risks with thesis-break triggers.
sections:
- id: risk-ranking
  title: Risk ranking
  body: The top risk is not that Quantum Systems lacks demand; it is that the business is strategically boxed into a segment
    that the company itself does not fully control. Investor restrictions on weapons development leave it outside much of
    the strike-munitions budget pool, while rival software-first primes compete for the control layer. That means the company
    can keep winning contracts and still lose strategic share of the defense stack. Integration sprawl and procurement dependence
    are the next most important risks because both get worse as the company scales its footprint and adds domains. The heatmap
    below compresses the ranking into a visual view.
  claimRefs:
  - CR001
  - CR003
  - CR004
  - CR005
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-legal-risk
  title: Operational and legal risk
  body: Operational risk is substantial because the company is scaling across several countries, product lines, and customer
    programs at once. That is the kind of growth profile that can mask quality issues until a contract slips or a certification
    blocker appears. Public evidence does not currently show litigation or sanctions, but the defense niche is sensitive enough
    that export control, local-content rules, and safety approvals still matter. A good risk read is therefore not “there
    is a lawsuit,” but “the company operates in a jurisdiction-heavy segment where compliance can change fast and break growth
    even without a headline event.” The operational layer is where small failures compound quickly.
  claimRefs:
  - CR002
  - CR006
  - CR007
  - CR009
  - CR012
  tableRefs:
  - TR002
- id: monitoring-and-triggers
  title: Monitoring and thesis-break triggers
  body: 'The right monitoring variables are concrete: new-country expansion, supply-chain slippage, customer concentration,
    software attach rate, and whether the company keeps winning allied procurement after the current rearmament cycle. If
    one of those turns, the thesis can break even if headline revenue still grows. The most important trigger would be a world
    in which the market keeps moving toward strike munitions or software-control layers while Quantum Systems remains stuck
    in ISR hardware. In that case the company could still be good, but not good enough for the current valuation. Those dependencies
    are where the downside hides.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  tableRefs:
  - TR003
