  title: Product & Technology
  summary: Explain what is delivered, how it works, what is mature, and where product risk remains.
sections:
- id: product-definition
  title: Product definition
  body: Quantum Systems is best understood as an integrated autonomous-systems company. The public product surface now spans
    aerial ISR platforms, mission software, ground autonomy, maritime adjacency, and counter-UAS. That matters because customer
    value is delivered by the stack, not just the airframe. The website and independent profiles both stress software, AI,
    and multi-sensor data rather than simple drone hardware, which supports the thesis that the company is moving up the value
    chain. The key product question is no longer whether it can build a drone; it is whether it can keep the whole mission
    stack interoperable and deployable in the field. The architecture figure makes the stack view concrete.
  claimRefs:
  - CE001
  - CE003
  - CE004
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture-and-deployment
  title: Architecture and deployment
  body: 'The architecture combines eVTOL fixed-wing aircraft, onboard perception, edge AI, mission planning, and an orchestration
    layer that can connect to existing military software. That makes deployment more than a hardware handoff: the product
    has to integrate into command systems, survive GPS-denied and jammed conditions, and support local sustainment. The public
    record is strongest on battlefield usage and software integration, and weaker on formal certification and security documentation.
    So the product is credible in operational terms, but the diligence view should still treat trust, quality, and cybersecurity
    as open questions unless the company can provide artifacts.'
  claimRefs:
  - CE002
  - CE004
  - CE005
  - CE010
  tableRefs:
  - TE003
- id: roadmap-and-differentiation
  title: Roadmap and differentiation
  body: The roadmap is broadening quickly into land, sea, and counter-UAS. That creates optionality, but it also increases
    execution risk because each new domain adds manufacturing, certification, and support complexity. The differentiator that
    seems hardest to copy is not a single sensor or airframe; it is the combination of field feedback, local production, and
    the ability to connect many mission assets through one software layer. Even so, the public evidence does not yet prove
    a moat strong enough to stop software-stack displacement or hardware commoditization, which means roadmap breadth should
    be read as both an opportunity and a risk. That breadth is a real execution test.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE011
  - CE012
  tableRefs:
  - TE002
