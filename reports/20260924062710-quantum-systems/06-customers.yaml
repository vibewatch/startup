  title: Customers
  summary: Identify paying users, proof of adoption, expansion potential, and concentration risk.
sections:
- id: named-proof
  title: Named customer proof
  body: 'The customer story is strongest where the company can point to named government programs and battlefield use. Public
    evidence shows Germany, the US, Romania, Australia, Spain, New Zealand, and Ukraine, with the German Army framework and
    the Ukraine mission count standing out as the clearest proof that the product is not just a pilot. The customer mix is
    still highly concentrated in defense and allied public-sector budgets, but that is also the point: procurement-heavy accounts
    are where the company’s current credibility is highest. This is a real customer base, not a vanity pipeline. The customer
    journey is strongest where procurement becomes repeated use.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: durability-and-expansion
  title: Durability, concentration, and expansion
  body: 'What is missing is classic SaaS-style retention data. We do not have NRR, churn, or a named customer count, so durability
    has to be inferred from repeat procurement, program expansion, and the company’s increasing domain breadth. The good news
    is that Quantum Systems appears to be land-and-expanding inside its existing accounts: once it wins aerial ISR, it can
    add software, ground, and maritime modules to the same customer. The bad news is concentration risk remains high because
    the disclosed backlog narrative is driven by a relatively small number of large government programs. The expansion path
    is real, but the denominator stays opaque.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU011
  - CU012
  tableRefs:
  - TU002
- id: customer-implication
  title: Investment implication
  body: The customer evidence supports a high-conviction product-market-fit view, but not a broad horizontal-market view.
    In diligence terms, that means the company should be evaluated on program depth, repeat procurement, and account expansion
    rather than on logo count alone. The biggest customer questions are whether the same relationships can support expansion
    into software, land, and maritime domains, and whether the company can broaden beyond a handful of sovereign buyers without
    losing procurement fit. Until those answers are clearer, customer quality is strong but concentrated. That is enough for
    conviction, not for complacency. The table is exhaustive for the disclosed proof set.
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU007
  - CU010
  tableRefs:
  - TU003
