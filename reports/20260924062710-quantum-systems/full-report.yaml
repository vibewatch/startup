  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and price
        blocks:
          - type: paragraph
            body: >-
              The valuation case is strong on strategic relevance and weak on transparency. An $8 billion price can be
              defended if Quantum Systems keeps converting defense demand into multi-domain revenue, improves software
              attach, and sustains operating profitability. But the public record still leaves enough private-data gaps
              that the valuation should be treated as stretched rather than obviously cheap. This is a classic
              defense-tech re-rating story: the market is paying for sovereignty, production, and battlefield proof, not
              for pure SaaS economics. That makes the stock-style question less about “is it growing?” and more about
              “can it keep growing fast enough to justify the new capital base?” The recommendation follows directly
              from that chain.
