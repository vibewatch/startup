      - number: '4.3'
        title: Underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The largest financial gaps are still the ones that matter most for underwriting: contract pricing, backlog
              quality, gross margin, cash balance, and runway. Public sources imply a big and fast-growing business, but
              they do not yet tell us how much of the revenue comes from one-off hardware, multi-year support, or
              software attach. They also do not show whether the company’s capital intensity will keep falling as
              production scales. Until those items are answered, the best conclusion is that the business is real and
              fast-growing, but not yet transparent enough to underwrite as a conventional software multiple story.
              Those gaps still block a clean software-style valuation. These unanswered items keep the valuation range
