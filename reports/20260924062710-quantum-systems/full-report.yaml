      - number: '7.2'
        title: Operational and legal risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is substantial because the company is scaling across several countries, product lines,
              and customer programs at once. That is the kind of growth profile that can mask quality issues until a
              contract slips or a certification blocker appears. Public evidence does not currently show litigation or
              sanctions, but the defense niche is sensitive enough that export control, local-content rules, and safety
              approvals still matter. A good risk read is therefore not “there is a lawsuit,” but “the company operates
              in a jurisdiction-heavy segment where compliance can change fast and break growth even without a headline
              event.” The operational layer is where small failures compound quickly.
            claimRefs:
