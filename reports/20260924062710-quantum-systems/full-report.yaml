      - number: '1.3'
        title: Scale, footprint, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The scale narrative is strong but not fully audited. Company statements and third-party reporting point to
              over 19,000 missions in Ukraine during 2025, a production footprint spanning Germany, Ukraine, the US,
              Australia, Romania, the UK, and the Baltics, and a rapid transition from hardware-only drone sales toward
              a software-defined autonomy platform. At the same time, the public record still leaves open the exact
              current revenue base, gross margin, cash runway, and cap-table preference terms. Headcount is also only
              approximate because different public profiles report materially different numbers, which means the refresh
              should treat employee count as a range rather than a point estimate. The milestone timeline below captures
              the refresh cadence and the acceleration in financing.
