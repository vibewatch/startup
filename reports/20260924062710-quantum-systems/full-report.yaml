      - number: '3.2'
        title: Differentiation and moat
        blocks:
          - type: paragraph
            body: >-
              The company’s best differentiators are not just the aircraft themselves; they are the combination of
              hardware, software, local manufacturing, and allied procurement access. MOSAIC UXS is strategically
              important because it pushes the competitive fight up the stack into command-and-control and mission
              orchestration, where switching costs are higher. Quantum Systems also benefits from a broader
              sovereign-production story than many pure software startups, which matters in Europe and the US. But those
              strengths do not eliminate the moat question: if rivals build comparable software or if buyers standardize
              on a different C2 layer, the company could be pushed back toward being one of several interchangeable
              hardware vendors.
