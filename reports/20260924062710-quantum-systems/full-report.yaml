      - number: '7.3'
        title: Monitoring and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The right monitoring variables are concrete: new-country expansion, supply-chain slippage, customer
              concentration, software attach rate, and whether the company keeps winning allied procurement after the
              current rearmament cycle. If one of those turns, the thesis can break even if headline revenue still
              grows. The most important trigger would be a world in which the market keeps moving toward strike
              munitions or software-control layers while Quantum Systems remains stuck in ISR hardware. In that case the
              company could still be good, but not good enough for the current valuation. Those dependencies are where
              the downside hides.
