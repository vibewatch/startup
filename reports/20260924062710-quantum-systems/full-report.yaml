      - number: '2.2'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is public-sector heavy. Budget ownership sits with defense ministries, armed forces, and
              allied procurement bodies, while the user is often the tactical unit or operator rather than the
              purchasing authority. That means adoption depends on procurement cycles, local sustainment, field
              performance, and trust, not on product-led growth or trial-to-paid conversion. The available evidence also
              suggests that national sovereignty requirements and in-country production are part of the buying decision,
              which makes local footprint and allied-market access strategically important. In practice, the company
              wins when it can show operational proof, local support, and compatibility with existing military
              workflows.
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM010
              - CM011
