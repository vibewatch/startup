      - number: '3.3'
        title: Displacement risk
        blocks:
          - type: paragraph
            body: >-
              The hardest competitive question is whether Quantum Systems can defend its valuation if the market keeps
              rewarding software-first players and strike specialists. The public record does not yet show a moat that
              is immune to commoditization, and the company’s own expansion into adjacent domains widens the attack
              surface as much as it widens the market. That makes procurement access, field performance, and software
              attach the key variables to watch. If a rival captures the mission-architecture layer or if a government
              customer standardizes on another autonomy stack, Quantum Systems could still win hardware deals but lose
              strategic control of the account. In practice, the moat remains contingent. A small but important
              distinction remains.
