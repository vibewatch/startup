    columns:
      - Argument
      - Why it supports the thesis
      - What would change the view
    rows:
      - - Strategic relevance
        - Defense demand and battlefield proof support a premium.
        - If demand cools or proof stalls, the premium compresses.
      - - Software attach
        - MOSAIC and adjacent software can improve margins.
        - If attach stays thin, the story stays hardware-heavy.
      - - Customer base
        - Named allied programs show real adoption.
        - If expansion stalls, concentration risk dominates.
      - - Capital base
        - The large 2026 funding round gives room to execute.
        - If capital is spent without margin gains, dilution risk rises.
      - - Operational scaling
        - Production and local sustainment can create barriers.
        - If scale introduces quality issues, the moat weakens.
      - - Competitive position
        - The company sits in a market with real strategic scarcity.
        - If software-first rivals own the control layer, the multiple falls.
      - - Exit optionality
        - IPO or consolidation remains plausible.
        - If public comps rerate down, exit support drops.
      - - Public transparency
        - Enough evidence exists for a track/hold view.
        - If disclosures improve materially, a stronger view is possible.
      - - Valuation discipline
        - The current price can work on growth and strategic value.
        - If growth slows, the stock becomes stretched.
      - - Risk management
        - The company has clear thesis-break triggers to monitor.
        - If those triggers fire, the valuation case fails.
