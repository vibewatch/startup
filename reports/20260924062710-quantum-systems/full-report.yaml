              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Comparables and range
        blocks:
          - type: paragraph
            body: >-
              The best comparator set mixes European autonomy peers, US neoprimes, and the closest ISR platform vendors.
              Helsing and Anduril matter because they show how the market pays for software control and systems
              integration; Tekever and AeroVironment matter because they anchor the hardware/procurement side; Shield AI
              and Auterion matter because they compete at the software layer. Against that set, Quantum Systems looks
              like a real business with real revenue, but still one whose multiple depends on the market believing that
              mission software will become more valuable over time. If the software layer disappoints, the multiple will
              likely compress even if sales keep rising. The peer set is wide because the company competes across
              layers.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Downside and exit discipline
        blocks:
          - type: paragraph
            body: >-
              The downside case is straightforward: procurement slows, the company remains hardware heavy, and the
              software layer fails to become a durable control point. In that outcome, the current valuation will look
              expensive because the market has already priced in strategic relevance. Exit-wise, the public record
              suggests eventual IPO or strategic consolidation, but neither is yet underwritten by formal disclosure.
              That is why price discipline matters: the company has enough momentum to justify interest, but not enough
              visibility to justify complacency. The next refresh should therefore focus on audited financials, software
              attach, and evidence that the multi-domain strategy is actually broadening margins. That discipline keeps
              the downside visible.
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
