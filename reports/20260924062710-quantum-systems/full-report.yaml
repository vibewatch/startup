        title: Capital stack and margin path
        blocks:
          - type: paragraph
            body: >-
              Capital availability improved dramatically in 2026. The company’s own materials and independent sources
              agree that the Series D and related debt package left it with a large war chest, while management also
              claims positive profitability. That combination is unusual in defense tech and helps explain why the
              valuation re-rated so sharply. But the public data still stop short of audited gross margin, burn, and
              runway, so the margin story remains more directional than bankable. The right mental model is “capitalized
              growth industrial,” not “profitable software compounder.” The capital stack remains unusually large. The
              disclosed capital base is unusually large for a defense-tech scaleup.
