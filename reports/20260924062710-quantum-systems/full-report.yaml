  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction
        blocks:
          - type: paragraph
            body: >-
              The revenue story is a mix of hardware sales, support, and an emerging software layer. Public estimates
              suggest the company moved from roughly $124 million in 2024 to about $330 million in 2025, which is strong
              growth but still dominated by procurement-style contracts rather than subscription ARR. That means the
              company’s revenue quality should be evaluated like a defense OEM with software upside, not like a SaaS
              business. The key underwriting question is whether MOSAIC and adjacent software can eventually widen
              recurring revenue without losing the procurement advantages that currently drive growth.
