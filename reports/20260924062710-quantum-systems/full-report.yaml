  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking
        blocks:
          - type: paragraph
            body: >-
              The top risk is not that Quantum Systems lacks demand; it is that the business is strategically boxed into
              a segment that the company itself does not fully control. Investor restrictions on weapons development
              leave it outside much of the strike-munitions budget pool, while rival software-first primes compete for
              the control layer. That means the company can keep winning contracts and still lose strategic share of the
              defense stack. Integration sprawl and procurement dependence are the next most important risks because
              both get worse as the company scales its footprint and adds domains. The heatmap below compresses the
              ranking into a visual view.
