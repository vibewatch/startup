      - number: '2.3'
        title: Sizing lenses and constraints
        blocks:
          - type: paragraph
            body: >-
              A single credible TAM number is not supported by the public record, so this chapter preserves multiple
              lenses instead of forcing one estimate. The most useful lenses are procurement spend, installed-base
              expansion, software attach, and allied-market localization. Those lenses fit the company’s strategic
              re-rating in 2025-2026, when public reporting linked defense rearmament to rising investor willingness to
              pay up for sovereign autonomy platforms. The main constraints are procurement friction, switching costs,
              regulatory approvals, and the need to prove reliability in live operations. That combination usually
              favors vendors with field performance and local support, but it also means the market can be large without
              being easy to win. The pyramid below makes the layered market lens explicit.
            claimRefs:
