  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers and adjacencies
        blocks:
          - type: paragraph
            body: >-
              Quantum Systems competes in a crowded but stratified defense landscape. The nearest European peer set
              includes Helsing on the autonomy/strike side and Tekever on the aerial ISR side, while Anduril, Shield AI,
              and AeroVironment define the larger US reference class. The company is not judged only against drone
              hardware vendors, however: it also competes against software layers like Auterion and, at the extreme,
              internal defense programs that decide to build instead of buy. That is why the competitive frame has to
              include direct peers, adjacencies, and substitutes rather than a narrow like-for-like drone list.
