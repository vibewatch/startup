      - number: '1.2'
        title: Leadership, founders, and financing
        blocks:
          - type: paragraph
            body: >-
              The leadership picture is stable at the founder level even as the company scales quickly. Florian Seibel
              and Sven Kruck are the names most consistently associated with the business, and the 2026 financing
              announcement treats both as co-founders/co-CEOs. Funding history is much clearer than private operating
              metrics: the company has documented a 2023 Series B, a 2025 Series C, and a 2026 Series D that pushed the
              post-money valuation to roughly $8 billion. Multiple independent sources corroborate the funding size and
              investor syndicate, which gives the cap-table story more credibility than the private metrics story.
