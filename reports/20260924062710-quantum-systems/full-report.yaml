      - number: '5.2'
        title: Architecture and deployment
        blocks:
          - type: paragraph
            body: >-
              The architecture combines eVTOL fixed-wing aircraft, onboard perception, edge AI, mission planning, and an
              orchestration layer that can connect to existing military software. That makes deployment more than a
              hardware handoff: the product has to integrate into command systems, survive GPS-denied and jammed
              conditions, and support local sustainment. The public record is strongest on battlefield usage and
              software integration, and weaker on formal certification and security documentation. So the product is
              credible in operational terms, but the diligence view should still treat trust, quality, and cybersecurity
              as open questions unless the company can provide artifacts.
            claimRefs:
              - CE002
              - CE004
              - CE005
