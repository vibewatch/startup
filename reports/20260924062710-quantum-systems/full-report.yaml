      - number: '6.3'
        title: Investment implication
        blocks:
          - type: paragraph
            body: >-
              The customer evidence supports a high-conviction product-market-fit view, but not a broad
              horizontal-market view. In diligence terms, that means the company should be evaluated on program depth,
              repeat procurement, and account expansion rather than on logo count alone. The biggest customer questions
              are whether the same relationships can support expansion into software, land, and maritime domains, and
              whether the company can broaden beyond a handful of sovereign buyers without losing procurement fit. Until
              those answers are clearer, customer quality is strong but concentrated. That is enough for conviction, not
