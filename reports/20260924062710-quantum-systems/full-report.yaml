      - number: '6.2'
        title: Durability, concentration, and expansion
        blocks:
          - type: paragraph
            body: >-
              What is missing is classic SaaS-style retention data. We do not have NRR, churn, or a named customer
              count, so durability has to be inferred from repeat procurement, program expansion, and the company’s
              increasing domain breadth. The good news is that Quantum Systems appears to be land-and-expanding inside
              its existing accounts: once it wins aerial ISR, it can add software, ground, and maritime modules to the
              same customer. The bad news is concentration risk remains high because the disclosed backlog narrative is
              driven by a relatively small number of large government programs. The expansion path is real, but the
              denominator stays opaque.
