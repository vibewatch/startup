  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition
        blocks:
          - type: paragraph
            body: >-
              Quantum Systems is best understood as an integrated autonomous-systems company. The public product surface
              now spans aerial ISR platforms, mission software, ground autonomy, maritime adjacency, and counter-UAS.
              That matters because customer value is delivered by the stack, not just the airframe. The website and
              independent profiles both stress software, AI, and multi-sensor data rather than simple drone hardware,
              which supports the thesis that the company is moving up the value chain. The key product question is no
              longer whether it can build a drone; it is whether it can keep the whole mission stack interoperable and
              deployable in the field. The architecture figure makes the stack view concrete.
