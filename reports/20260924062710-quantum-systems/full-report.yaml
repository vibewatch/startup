  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The most defensible market boundary is defense ISR plus the autonomy stack around it, not a generic drone
              market and not consumer mapping. Quantum Systems is now explicitly positioned around air, land, sea,
              counter-UAS, and a mission-software layer, which means its addressable market is the sum of hardware,
              integration, sustainment, and software budget lines rather than just airframe sales. That framing is
              reinforced by the company’s procurement-led evidence: public references are overwhelmingly to military and
              government customers, and the most relevant substitutes are legacy UAV suppliers, prime contractors,
              manual ISR workflows, and autonomy platforms from Anduril, Helsing, or Auterion-like software layers.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM009
