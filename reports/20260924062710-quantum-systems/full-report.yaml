      - number: '5.3'
        title: Roadmap and differentiation
        blocks:
          - type: paragraph
            body: >-
              The roadmap is broadening quickly into land, sea, and counter-UAS. That creates optionality, but it also
              increases execution risk because each new domain adds manufacturing, certification, and support
              complexity. The differentiator that seems hardest to copy is not a single sensor or airframe; it is the
              combination of field feedback, local production, and the ability to connect many mission assets through
              one software layer. Even so, the public evidence does not yet prove a moat strong enough to stop
              software-stack displacement or hardware commoditization, which means roadmap breadth should be read as
              both an opportunity and a risk. That breadth is a real execution test.
            claimRefs:
