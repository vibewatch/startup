    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and offering
        blocks:
          - type: paragraph
            body: >-
              Quantum Systems is best understood as a Munich-area defense technology company that builds autonomous
              unmanned systems and mission software rather than a single-drone vendor. The public identity now spans
              aerial intelligence, ground autonomy, maritime adjacencies, and counter-UAS, all tied together by a
              software-defined stack. That matters for the refresh because the company markets itself around an
              interoperable family of systems, not just a tactical ISR platform. The website and third-party profiles
              agree on the founding year and on Germany as the operating center of gravity, while the company’s own
              wording emphasizes government, security, and commercial buyers.
            claimRefs:
