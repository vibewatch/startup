  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              最有依据的市场边界，是防务 ISR 及其周边的自主技术栈；既不是泛化的无人机市场，也不是消费级测绘。Quantum Systems
              已明确布局空、陆、海、反无人机和任务软件，因此可服务市场应包括硬件、系统集成、维保和软件预算，而不只是机体销售。采购端证据也支持这一划分：公开提及的客户绝大多数是军方和政府。主要替代方案包括传统 UAV
              供应商、主承包商、人工 ISR 流程，以及 Anduril、Helsing 等自主平台和 Auterion 一类软件层。
