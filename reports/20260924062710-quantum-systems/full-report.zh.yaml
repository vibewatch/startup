        title: 采购方、预算归属与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方以公共部门为主。国防部、武装部队和盟国采购机构掌握预算；实际使用者通常是一线战术单位或操作员，而非采购决策者。因此，产品能否采用取决于采购周期、本地维保、实战表现和信任，而不是产品驱动增长或免费试用转付费。现有证据还显示，国家主权要求和本土生产也会影响采购决策，使本地布局和进入盟国市场具有战略意义。要赢得订单，公司必须证明产品经得起实战、能提供本地支持，并可接入现有军用流程。
