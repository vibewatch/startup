        title: 标杆客户印证
        blocks:
          - type: paragraph
            body: >-
              客户叙事最扎实之处，是公司能列出具体政府项目和战地应用。公开证据涉及德国、美国、罗马尼亚、澳大利亚、西班牙、新西兰和乌克兰；德国陆军框架协议及乌克兰任务量，是产品已越过概念试点阶段的最有力证明。客户仍高度集中在国防和盟国公共部门预算，但这正是公司当前公信力的来源：采购型大客户构成了最坚实的基本盘。这些是实际交付的客户，不是用来撑场面的销售管线。采购转化为反复使用时，客户旅程的说服力最强。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: 客户黏性、集中度与增购拓展
        blocks:
          - type: paragraph
            body: >-
              目前缺少典型 SaaS 留存数据：外界不知道公司的净收入留存率（NRR）、流失率或具名客户数，因此只能从重复采购、项目扩容和业务领域拓展间接判断客户黏性。积极的一面是，Quantum Systems
              似乎能在现有客户中“先切入、再扩张”：拿下空中 ISR
              订单后，再向同一客户销售软件、地面和海上模块。风险在于客户集中度仍高，已披露的在手订单主要由少数大型政府项目支撑。扩张路径已显现，但客户总数这个分母依旧不透明。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: 投资启示
        blocks:
          - type: paragraph
            body: >-
              现有客户证据有力支持公司在特定垂直场景实现产品市场匹配（PMF），却不足以证明它拥有广阔的通用横向市场。因此，尽调应关注军工项目渗透深度、重复采购和单客扩张，而不是只数签约
              Logo。关键问题是：现有政企关系能否带动软件、地面和海上业务增购？公司能否在不损害采购适配度的前提下，摆脱对少数主权买方的依赖？在这些问题得到更清楚的回答前，客户质量虽高，集中度也高。这足以建立投资信心，但不能因此自满。后表汇总了公开披露的全部佐证。
            claimRefs:
              - CU003
