  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险优先级排序
        blocks:
          - type: paragraph
            body: >-
              最大风险不是缺乏需求，而是公司在战略上受困于一个自己无法完全掌控的细分生态。投资者对武器研发的限制，使公司无法参与大部分对地打击弹药预算；与此同时，软件优先的新型防务巨头正在争夺核心控制层。即便 Quantum
              Systems 持续赢得合同，也可能丢失防务技术栈中的战略份额。其次是系统集成范围失控和对政府采购的依赖；随着公司扩张地域、增加业务领域，这两项风险都会加重。下方风险热力图概括了风险排序。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 运营与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              运营风险不低：公司同时在多个国家扩张、拓展多条产品线并推进多个客户项目。如此激进的扩张可能掩盖质量问题，直到合同延期或认证受阻时才暴露。现有公开证据没有显示诉讼或制裁，但防务行业高度敏感，出口管制、本地含量要求和安全审批都不可绕过。风险判断的重点不该是“有没有官司”，而是公司身处监管严、法域多的行业；即便没有头条事件，合规要求突变也可能中断增长。执行中的小疏漏也容易迅速累积放大。
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR009
              - CR012
      - number: '7.3'
        title: 动态监控与逻辑推翻触发条件
        blocks:
          - type: paragraph
            body: >-
              需要跟踪的变量很具体：新国家市场拓展、供应链延误、客户集中度、软件附加率，以及本轮再武装周期后能否继续赢得盟国采购。任何一项逆转，都可能推翻投资逻辑，即使表面营收仍在增长。最重要的触发条件是：若市场继续转向打击弹药或软件控制层，而
              Quantum Systems 仍困在单一 ISR 硬件业务，公司或许依然不错，却不值得当前估值。下行风险就藏在这些脆弱的前提里。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR008
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心估值逻辑与定价值得度
        blocks:
          - type: paragraph
            body: >-
              估值的支撑来自战略价值，短板则是透明度不足。如果 Quantum Systems 能持续把国防需求转化为跨领域收入、提高软件附加率并维持经营盈利，$8B（80
              亿美元）估值并非毫无依据。但公开资料留下太多数据缺口，因此当前估值更应视为“偏高”（stretched），而非明显“便宜”（cheap）。这是一轮典型的防务科技估值重估：市场买的是主权供应链、规模化生产和战地实证，而不是纯
              SaaS 经济模型。问题也不再只是“公司有没有增长”，而是“增长能否足够快，以消化扩大的资本底盘”。最终评级由此推导而来。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 可比公司与估值区间
        blocks:
          - type: paragraph
            body: >-
              合理的可比公司应覆盖欧洲自主系统同行、美国新型防务企业（neoprimes）和最接近的 ISR 平台厂商。Helsing 与 Anduril 可帮助观察市场如何为软件控制和系统集成定价；Tekever 与
              AeroVironment 体现硬件交付及防务采购业务的估值基准；Shield AI 和 Auterion 则在软件层直接竞争。与这些公司对照，Quantum Systems
              是有实际营收的企业，但估值倍数仍取决于市场是否相信任务软件会随时间增值。若软件业务不及预期，即使销售继续增长，估值倍数也可能收缩。可比范围之所以广，是因为公司跨多个技术层级竞争。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 下行风险与退出纪律
        blocks:
          - type: paragraph
            body: >-
              悲观情景很清楚：采购放缓，公司仍严重依赖硬件，软件层也未能成为持久的控制点。届时，市场已提前把战略价值计入价格，当前估值就会显得昂贵（expensive）。公开资料暗示公司最终可能 IPO
              或被战略收购，但目前没有正式披露为这两条退出路径提供依据。因此必须守住估值纪律：公司增长势头足以吸引关注，但信息透明度不足以支撑自满。下次更新应重点核查经审计财报、软件附加率，以及多域战略是否确实改善利润率。严守纪律，才能持续看清下行风险。
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
