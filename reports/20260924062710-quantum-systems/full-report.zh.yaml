    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位与业务组合
        blocks:
          - type: paragraph
            body: >-
              Quantum Systems
              更适合被看作一家慕尼黑地区的防务科技公司：它打造自主无人系统和任务软件，而非只卖单一无人机。公司公开定位已覆盖空中情报、地面自主、海上应用和反无人机系统，并由软件定义架构串联。此次更新尤其要把握这一点：Quantum
              Systems 推介的是一组可互操作的系统，而不只是一款战术 ISR 平台。官网和第三方资料对成立年份及德国作为运营中心的说法一致；客户范围方面，公司自己的表述则强调政府、安全和商业买方。
