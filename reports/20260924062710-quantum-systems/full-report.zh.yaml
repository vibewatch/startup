    title: 正反投资逻辑对比表
    columns:
      - 论点
      - 支撑投资逻辑的理由
      - 观点反转触发条件
    rows:
      - - 战略稀缺性
        - 国防需求与战场验证支撑估值溢价。
        - 若需求降温或实战验证遇阻，估值溢价将收窄。
      - - 软件搭载率
        - MOSAIC 及周边软件有望改善利润率。
        - 若软件搭载迟迟没有提升，市场仍会把公司看作硬件为主。
      - - 客户群体
        - 盟国具名项目证明产品已被实际采用。
        - 若跨客户拓展停滞，客户集中度风险将成为主导矛盾。
      - - 资本储备
        - 2026 年大额融资为业务执行留出空间。
        - 若资金投入未带来利润率提升，股权稀释风险就会上升。
      - - 运营与交付扩张
        - 量产与本地保障有望形成竞争壁垒。
        - 若扩张带来质量问题，竞争壁垒就会削弱。
      - - 竞争定位
        - 公司所在市场确有战略稀缺性。
        - 若软件先行的竞对掌控指挥控制层，估值倍数将受压。
      - - 退出选择权
        - IPO 或行业整合仍有可能。
        - 若公开市场可比公司估值下修，退出估值支撑也会减弱。
      - - 公开透明度
        - 现有公开证据足以支撑「观察 / 观望」评级。
        - 若信息披露有实质性改善，评级有望上调。
      - - 估值纪律
        - 凭借增长与战略价值，当前价格仍说得通。
        - 若增长放缓，当前股价就显得偏贵。
      - - 风险监控
        - 公司已明确列出需要监控的逻辑失效触发条件。
        - 一旦触发，当前估值逻辑就站不住脚。
    notes: 反方一栏特意把条件说清楚，因为估值对缺失的非公开数据高度敏感。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景推演表
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 核心风险
      - 发生概率信号
    rows:
      - - 乐观
        - 软件搭载率走高；盟国采购需求保持强劲
        - 估值足以支撑当前价格，甚至更高估值
        - 交付执行风险与信息披露缺口
        - 还需更有力的利润率证据
      - - 基准
        - 硬件仍占大头，但业务增速依然扎实
        - 价格偏高但仍有辩护空间，维持「观察 / 观望」
        - 若软件表现不及预期，估值倍数或面临压缩
        - 与当前公开证据最为吻合
      - - 悲观
        - 采购放缓，控制层仍掌握在外部
        - 若市场下修至纯硬件倍数，股价存在大幅下行空间
        - 战略溢价消退
        - 需求或利润率不达预期即会触发
      - - 估值纪律
        - 建仓前需看清利润率走向
        - 在信息披露改善前严格保持克制
        - 投资判断仍缺关键依据
        - 支撑耐心观望立场
      - - 退出就绪度
        - IPO 或战略出售取决于能否做大规模
        - 可能出现流动性事件，但市场尚未将其计入价格
        - 发行窗口也可能关闭
        - 仅可视为期权价值
      - - 竞争威胁
        - 竞对持续向软件化转型
        - 估值倍数将失去支撑
        - 指挥控制层面临被替代风险
        - 亟需构建更显著的差异化优势
      - - 财务透明度
        - 经审计的财务指标仍未公开
        - 信息不透明应折价估值
        - 测算模型失真风险
        - 支撑证据仍不完整
      - - 大额融资后续影响
        - 大额融资资金可支持后续业务扩张
        - 资本投入若能转化为利润率提升，就是利好
        - 若未能提升盈利能力则面临股权稀释
        - 厚实的资产负债表能提供缓冲，但解决不了所有问题
      - - 客户横向拓展
        - 存量客户拓展至陆海等全新应用场景
        - 经常性收入具备向上弹性
        - 客户高度集中仍是隐患
        - 最具价值的上行增长路径
      - - 负面下行触发点
        - 软件搭载与跨域拓展陷入停滞
        - 估值将面临大幅下修
        - 投资逻辑失效
        - 核心跟踪指标
    notes: 由于公开的远期财务数据和退出可比案例仍有限，各情景仅作定性推演。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
