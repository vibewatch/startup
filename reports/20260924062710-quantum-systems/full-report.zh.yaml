        blocks:
          - type: paragraph
            body: >-
              Quantum Systems 所处的防务市场竞争拥挤，但层次分明。欧洲最接近的同行包括主攻自主与打击系统的 Helsing，以及专注空中 ISR 的 Tekever；美国的 Anduril、Shield AI
              和 AeroVironment 则是规模更大的参照对象。不过，不能只拿无人机硬件厂商来衡量 Quantum Systems：它也与 Auterion
              等软件层厂商竞争，极端情况下还会遇到军方决定自研而非外购。竞争分析因此要同时纳入直接同行、相邻领域和替代方案，而不能只列同类无人机。
