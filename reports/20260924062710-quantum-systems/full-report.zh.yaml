      - number: '3.3'
        title: 替代与洗牌风险
        blocks:
          - type: paragraph
            body: >-
              最难回答的问题是：如果市场继续奖励软件优先的玩家和专攻打击系统的厂商，Quantum Systems
              能否守住估值？公开资料尚未显示公司拥有足以抵御商品化的护城河；向相邻领域扩张虽扩大了市场，也增加了可被攻击的环节。后续要重点看采购准入、实战表现和软件附加率。若竞争者拿下任务架构层，或政府客户统一采用另一套自主技术栈，Quantum
              Systems 仍可能拿到硬件订单，却失去对客户账户的战略控制。归根结底，护城河能否成立仍取决于若干条件，其中有个细微但重要的区别。
