        blocks:
          - type: paragraph
            body: >-
              营收来自硬件销售、技术支持和仍在起步的软件业务。公开估算显示，公司营收从 2024 年约 $124M（1.24 亿美元）增至 2025 年约 $330M（3.3
              亿美元），增长强劲，但收入仍主要来自采购型合同，而非订阅 ARR。因此，评估其收入质量时，更应把它看作有软件上行空间的防务 OEM，而非 SaaS 公司。投资判断的关键是：MOSAIC
              及相关软件能否扩大经常性收入，同时不损害当前推动增长的采购优势。
