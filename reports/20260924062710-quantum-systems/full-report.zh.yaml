              年的估值重估：当时公开报道将防务再武装与投资者更愿意为主权自主平台支付溢价联系起来。主要制约包括采购阻力、切换成本、监管审批，以及在实战中证明可靠性的门槛。这些因素通常有利于具备实战表现和本地支持能力的厂商，但市场再大也不容易攻下。下方金字塔图呈现了这一分层市场视角。
