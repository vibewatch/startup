companyProfile:
  summary: >-
    Quantum Systems is a German defense technology company that sells autonomous unmanned systems and mission software
    for defense, security, and allied government customers. It has moved from aerial ISR toward a broader multi-domain
    autonomy stack covering air, land, sea, and counter-UAS, with MOSAIC UXS as the software backbone.
  foundedDate: '2015-01-01'
  foundingLocation: Germany
  headquarters: Munich/Gilching, Germany
  productSummary: >-
