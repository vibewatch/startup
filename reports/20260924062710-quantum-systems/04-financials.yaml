- id: TI003
  title: Unit economics summary
  columns:
  - Metric
  - Current signal
  - Why it matters
  - Gap / next diligence step
  rows:
  - - Gross margin
    - Not publicly audited
    - Determines whether growth is scaling efficiently
    - Request management accounts and product-line margins
  - - Burn rate
    - Not disclosed
    - Shows capital intensity and runway risk
    - Obtain cash flow and monthly operating spend
  - - Runway
    - Not disclosed
    - Tests whether the company can self-fund growth
    - Ask for lender deck and treasury forecast
  - - Operating leverage
    - Directionally positive
    - Explains whether revenue can outpace headcount
    - Check hiring plan versus revenue growth
  - - Software attach
    - Early / emerging
    - Could raise margin if material
    - Quantify software revenue share and attach rate
  - - Deployment cost
    - High upfront
    - Affects customer ROI and contract economics
    - Break out install and support economics
  - - Customer concentration
    - Unknown publicly
    - High concentration would make revenue lumpy
    - Request top-customer share and churn data
  - - Capex intensity
    - Meaningful
    - Can depress free cash flow even when profitable
    - Review production capex and inventory build
  - - Debt service
    - Some disclosed debt
    - Could constrain flexibility
    - Review covenants and amortization schedule
  - - Profitability claim
    - Positive / double-digit claimed
    - Important but unaudited
    - Reconcile against management accounts
  notes: This table translates the public revenue story into diligence questions that should be answered before underwriting
    a multiple.
