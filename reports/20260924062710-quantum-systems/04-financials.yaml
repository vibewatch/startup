  title: Financials
  summary: Explain revenue quality, capital needs, and what the public record still does not support.
sections:
- id: revenue-model
  title: Revenue model and traction
  body: The revenue story is a mix of hardware sales, support, and an emerging software layer. Public estimates suggest the
    company moved from roughly $124 million in 2024 to about $330 million in 2025, which is strong growth but still dominated
    by procurement-style contracts rather than subscription ARR. That means the company’s revenue quality should be evaluated
    like a defense OEM with software upside, not like a SaaS business. The key underwriting question is whether MOSAIC and
    adjacent software can eventually widen recurring revenue without losing the procurement advantages that currently drive
    growth.
  claimRefs:
  - CF001
  - CF007
  - CF011
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: capital-and-margin
  title: Capital stack and margin path
  body: Capital availability improved dramatically in 2026. The company’s own materials and independent sources agree that
    the Series D and related debt package left it with a large war chest, while management also claims positive profitability.
    That combination is unusual in defense tech and helps explain why the valuation re-rated so sharply. But the public data
    still stop short of audited gross margin, burn, and runway, so the margin story remains more directional than bankable.
    The right mental model is “capitalized growth industrial,” not “profitable software compounder.” The capital stack remains
    unusually large. The disclosed capital base is unusually large for a defense-tech scaleup.
  claimRefs:
  - CF003
  - CF004
  - CF005
  - CF006
  - CF010
  - CF012
  tableRefs:
  - TI003
- id: underwriting-gaps
  title: Underwriting gaps
  body: 'The largest financial gaps are still the ones that matter most for underwriting: contract pricing, backlog quality,
    gross margin, cash balance, and runway. Public sources imply a big and fast-growing business, but they do not yet tell
    us how much of the revenue comes from one-off hardware, multi-year support, or software attach. They also do not show
    whether the company’s capital intensity will keep falling as production scales. Until those items are answered, the best
    conclusion is that the business is real and fast-growing, but not yet transparent enough to underwrite as a conventional
    software multiple story. Those gaps still block a clean software-style valuation. These unanswered items keep the valuation
    range wide.'
  claimRefs:
  - CF002
  - CF008
  - CF009
  tableRefs:
  - TI002
