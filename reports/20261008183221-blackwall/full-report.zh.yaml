      - number: '4.2'
        title: 市场进入经济学、单位成本驱动与运营结构
        blocks:
          - type: paragraph
            body: >-
              Blackwall 模式的经济可行性取决于渠道优先市场进入结构的效率，以及分布式边缘处理的成本构成。Blackwall 通过 100 多家全球服务与托管合作伙伴，覆盖超过 230
              万个活跃受保护网站和应用，并借用合作伙伴已有的计费与客户关系基础设施。相比 Cloudflare、Akamai 或 Imperva
              等企业网络安全直销厂商，这种结构性杠杆显著压低传统获客成本（CAC）。但销售工程和合作伙伴接入周期会产生可观的前期运营成本，需要专门的技术架构师把反向代理集群接入专有托管控制面板和计费引擎。在交付成本端，毛利率驱动因素由
              GateKeeper 分布式服务器集群架构决定，该集群包括边缘反向代理、检测引擎和集中式数据仓库。流量处理需要持续计算资源，用于跨 L3–L7 协议进行深度数据包检测和会话行为分析、TLS 1.3/HTTP/3
              终止，以及自动化 SSL 生命周期维护。虽然 Blackwall
              将部分边缘代理负载转移到合作伙伴管理的环境中，但集中式威胁情报关联、机器学习行为建模和多区域基础设施仍带来基础托管开支。人员支出是主要现金流出项；员工人数从 B 轮时的 65
              人扩张，并计划在欧洲、美国和亚太国际枢纽实现团队翻倍。
