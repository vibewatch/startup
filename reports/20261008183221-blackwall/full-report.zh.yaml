      - number: '6.2'
        title: 采用轨迹与部署覆盖
        blocks:
          - type: paragraph
            body: >-
              Blackwall 的部署轨迹呈现由渠道导入驱动的快速漏斗顶部扩张。公司由 Nikita Rozenberg 和 Denis Prochko 于 2019 年创立后，到 2025 年初已通过 100
              多家全球服务与托管合作伙伴保护超过 230 万个活跃网站和 Web 应用（2.3m）。这一批发覆盖支撑了 TopTech 2026 排名中的隐含公司估值，估计为 10.3
              亿欧元（€1.03b）；该估值基于强劲的已报告收入增长，较 2.21 亿欧元（€221m）上涨 368%。Baltic Domain Days、CloudFest 和区域电商峰会等国际渠道活动，以及与克罗地亚
              INFO-IMPERO、日本 Future Spirits 和区域 IT 市场 Elcore 等分销伙伴的集成关系，也证明了运营规模。不过，Blackwall 直接向托管服务商许可
              GateKeeper，而服务商会在整个共享 IP 范围启用覆盖，因此 230 万个（2.3m）受保护网站的表面数量代表批发租户覆盖，而不是 230 万个（2.3m）自主商业购买决策。
