  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该决策流程展示从市场进展到估值立场，再到最终投资建议的逻辑推进。
    data:
      nodes:
        - id: proven-scale
          label: 已验证的分发规模
          detail: 通过 100 多家全球 HSP/MSP 合作伙伴保护 230 万多个网站（2.3m）
        - id: product-economics
          label: 有吸引力的单位经济性
          detail: 将主机运营支出降低 10%–25%，同时带来经常性网络安全增值收入
        - id: channel-risk
          label: 渠道依赖风险
          detail: 终端客户关系掌握在托管合作伙伴手中；合作伙伴流失高度集中
        - id: valuation-status
          label: 模拟纸面估值
          detail: TopTech 的 €1.03B 估值只是隐含的可比公司倍数基准，并非股权交易
        - id: underwriting-hurdle
          label: 尽调投资判断门槛
          detail: 在确定股权定价前，必须拿到经审计确认的 ARR 和合作伙伴队列 NRR
        - id: track-recommendation
          label: 最终投资判断：跟踪
          detail: 估值已显得偏高，在定价轮确认实际收入和 NRR 前维持跟踪
      edges:
        - from: proven-scale
          to: product-economics
        - from: product-economics
          to: channel-risk
        - from: channel-risk
          to: valuation-status
        - from: valuation-status
          to: underwriting-hurdle
        - from: underwriting-hurdle
          to: track-recommendation
    approximationNotes: 该流程图展示按顺序开展的尽调评估，将运营优势、商业脆弱点和模拟估值风险串联起来。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
