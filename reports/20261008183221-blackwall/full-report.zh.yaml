              - CU013
      - number: '6.4'
        title: 留存持久性、扩张动力与渠道集中风险
        blocks:
          - type: paragraph
            body: >-
              Blackwall 商业引擎的核心持久性风险，来自极端渠道依赖，以及净收入留存率（NRR）和毛收入留存率（GRR）的结构性不透明。公司依靠不足 150 家批发基础设施合作伙伴触达 230
              万个终端安装，因而面临显著的交易对手集中度：任何一家头部托管合作伙伴或多集群云服务商流失，都可能立即从活跃覆盖中抹去数万个已部署域名。此外，托管服务商经常把 GateKeeper
              作为基础设施公用能力捆绑，而非逐项列出的高级附加项，难以判断下游 SMB 终端客户是否直接认可这项安全服务的商业价值。Blackwall
              虽提供永久免费的监控层，计划通过威胁情报可见性转化潜在托管网络和个人管理员，但转化率、续订周期和多年合同结构仍未披露，是机构投资者必须核查的关键事项。
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU014
              - CU015
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: B2B2C 渠道优势：以批发模式释放运营杠杆
            body: >-
              Blackwall 主要通过托管和托管式服务商分销 GateKeeper，凭借约 65 名员工把规模扩展到超过 230 万个受保护网站，释放了很强的运营分销杠杆。但该模式也带来明显的分析不透明：终端 SMB
              很少直接选择或支付给 Blackwall，因此产品留存实际上取决于服务商层面的主服务协议，而非终端用户的品牌忠诚。
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
          - type: callout
            title: 合作伙伴集中与批发去中介化暴露
            body: >-
              超过 230 万个受保护网站分布在仅 100 多家托管与服务合作伙伴中，Blackwall 的平均每账户集中度超过 20,000 个域名。大型托管集团退出，或内部开发 CrowdSec、ModSecurity
              分支等竞争性开源反向代理，都会构成难以通过零售获客迅速缓解的结构性收入与规模风险。
            calloutType: risk
            claimRefs:
              - CU001
              - CU008
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险分类与投资敞口
        blocks:
          - type: paragraph
            body: >-
              评估 Blackwall，需要拆解这家基础设施层网络安全服务商在全球托管生态扩张时固有的脆弱点。首要宏观风险是商业渠道集中：Blackwall
              几乎完全通过托管服务商（HSP）、托管式服务商（MSP）和电商平台变现，而不是经营直接企业关系。渠道策略虽能以高效率通过 100+ 个合作伙伴网络分销到超过 2.3M 个网站，却也引入了中间守门摩擦：终端 SMB
              的留存完全取决于托管合作伙伴的打包方式和合同续订。与此同时，Blackwall 在 2026 年 9 月获得 Prudentia 与 Siena Secondary Fund 的 TopTech 排名隐含估值
              10.3 亿欧元（€1.03b）后，承受显著估值悬空风险。这一数字较 2.21 亿欧元（€221m）同比上涨
              368%，明确基于上市同业收入倍数，而非已执行的定价轮；如果独立股权交易完成前公开网络安全倍数收缩，下行风险将加剧。缓释措施需要正式跟踪合作伙伴毛收入留存，并可验证地审计 ARR 倍数。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
