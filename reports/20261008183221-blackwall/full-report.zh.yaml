      - number: '1.3'
        title: 资本化历史、隐含估值与规模轨迹
        blocks:
          - type: paragraph
            body: >-
              据报道，Blackwall 自 2020 年 10 月以来通过四轮融资累计获得 4,900 万至 6,270 万美元（$49.0m–$62.7m）的机构股权融资。公司于 2021 年 2 月完成由 Tera
              Ventures 领投、Firlej Kastory 参与的种子轮，随后在 2024 年 3 月完成由 Tera Ventures 和 MMC Ventures 支持的 A 轮。2025 年 3
              月，Blackwall 完成由 Dawn Capital 领投、MMC Ventures 继续参与的里程碑式 4,500 万欧元（€45m；等值 4,900 万美元（$49.0m））B 轮融资，并同步从
              BotGuard 更名为 Blackwall。B 轮时，公司在全球拥有 65 名员工、管理 100 多个托管合作关系，保护超过 230 万个活跃网站和 Web 应用（2.3m）；到 2026
              年年中，员工规模约增至 100 人。2026 年 9 月，Prudentia Tallinn 与 Siena Secondary Fund 发布的独立 TopTech 2026 排名将 Blackwall
              评为爱沙尼亚最有价值科技公司第五名，隐含估值 10.3 亿欧元（€1.03b；11.3 亿美元；$1.13b），较 2025 年的 2.21 亿欧元（€221m）上涨 368%。尽调必须强调，10.3
              亿欧元（€1.03b）是基于网络安全上市同业与收入增长推导的分析师隐含倍数，并非经审计的交易价格或已完成的融资轮。
