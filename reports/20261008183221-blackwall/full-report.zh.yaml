  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              GateKeeper 面向托管服务商和服务提供商销售，而不是直接面向每个托管的中小企业网站。Blackwall 称系统位于 Web 流量入口，检查并过滤请求，只允许合法流量到达应用层。公开的控制面包括 Web
              应用防火墙、机器人管理、反抓取与防内容复制控制、速率限制、证书自动化、缓存，以及对 HTTP/3 和 TLS 1.3
              的支持。因此，客户工作流本质上是一次基础设施部署：服务商评估流量路径，             
              通过概念验证（PoC）验证方案，把服务接入自身环境，再向托管客户开放安全能力。公开材料未披露模块级采用率、附加率或实际客户成果。
