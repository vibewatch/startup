      - number: '6.3'
        title: 已命名客户部署与运营成果
        blocks:
          - type: paragraph
            body: >-
              Blackwall 生产性能的独立验证，主要来自合作伙伴集成、分销商案例研究和第三方安全评估。技术分销商 Elcore 记录了三类不同客户的生产成果：一个拥有数百万用户的金融服务平台，将自动化虚假账户注册减少
              96%，后端服务器负载降低 50%；一家电商零售商缓解了未经授权的竞品价格抓取，并恢复了搜索引擎排名可见度；一家电信运营商在多向三层至七层 DDoS 攻击期间保持持续运行。其他现场合作包括与东南欧
              INFO-IMPERO 共同进行电商优化，以及与日本云服务商 Future Spirits 举办联合技术网络研讨会，分析自动化爬虫行为。尽管这些技术案例积极，独立安全基准仍存在严重透明度缺口：WAFPlanet
              指出，Blackwall 既未发布第三方对比攻击缓解基准，也未发布公开价目表，商业评估必须直接接触销售团队。
            claimRefs:
              - CU004
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
