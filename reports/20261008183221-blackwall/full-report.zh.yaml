      - number: '7.2'
        title: 监管、法律、数据隐私与实体区分风险
        blocks:
          - type: paragraph
            body: >-
              监管与法律方面，Blackwall 位于 Web 流量入口，GateKeeper 检查传入的 HTTP/3、TLS 1.3 和 TCP
              流，区分人类用户与恶意自动化机器人。平台因此会在包括欧盟（GDPR）、美国和亚太地区在内的多种司法辖区处理 IP 地址、会话请求结构和行为元数据。由于 GateKeeper
              检查七层负载并缓解自动化抓取与凭证填充，Blackwall 必须遵守严格的数据最小化标准，避免触发欧洲数据保护法规风险。此外，自动化威胁情报带来误拦合法流量的次生风险，可能中断客户合法电商交易并引发合作伙伴
              SLA 责任。尽调发现的另一项治理脆弱点是跨实体名称混淆：全球搜索经常把 2019 年成立的爱沙尼亚网络安全公司 Blackwall，与澳大利亚房地产投资和基金管理集团 BlackWall
              Limited（ASX: BWF）、以及无关法律合伙关系混为一谈。清晰的法律实体区分和成文隐私条款是尽调必需品。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: 运营、基础设施与合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营方面，GateKeeper 是保护云端资产、数据中心和 Web 集群的内联反向代理。内联运行使平台绝对依赖实时可用性与数据包处理速度：任何反向代理延迟峰值、TLS
              终止失败或分布式服务器集群中断，都会直接降低下游托管客户的性能。此外，高级机器人运营者持续演进住宅代理轮换、CAPTCHA
              绕过和分布式僵尸网络模拟等反检测技术，需要快速且资源密集的研发。在合作伙伴侧，Blackwall 高度依赖 Elcore 等区域第三方分销关系，把自身接入 cPanel、Plesk
              和云虚拟机管理程序的控制面板与配置管线。4,500 万欧元（€45m）B 轮后，公司在北美和亚太扩张，需要把员工人数从 65 人增至 100 多人，给分布式销售工程和基础设施支持团队带来组织执行风险。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
