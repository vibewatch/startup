      - number: '8.3'
        title: 情景投资判断、下行触发因素与尽调核验
        blocks:
          - type: paragraph
            body: >-
              为建立纪律化的投资判断参数，我们从三个不同的运营和市场情景评估 Blackwall。乐观情景下，Blackwall 加快美国和亚太渠道渗透，将技术与销售人员增至 130+ 人，并成功转化 300
              多家一线托管平台；合作伙伴净收入留存率超过 125%，在正式融资轮或战略出售中支撑 €1.2b–€1.5b 的股权估值。基准情景下，托管合作伙伴稳步增长，终端覆盖维持在 2.5m+，利润率小幅扩张，按
              10x–14x 前瞻收入倍数，对应 €650m–€850m 的股权估值。悲观情景下，托管服务商整合、边缘计算延迟开销导致利润率承压，或公开 SaaS 倍数收缩，会将公允市场价值拉低至
              €300m–€450m。论点失效触发因素包括头部 5 家 HSP 中任何一家发生重大合作伙伴流失、规模化攻击期间出现严重的 L7 延迟故障或误报激增，以及折价轮融资。最后的尽调要求包括核验 Blackwall
              的经审计损益表、 按渠道合作伙伴队列拆分的毛收入留存率和净收入留存率，并确认其法律主体和资产负债表与无关的 ASX 上市实体相互独立。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对合成估值保持投资判断纪律
            body: >-
              Blackwall 已覆盖 230 万个网站（2.3m），商业进展亮眼，也获得 Dawn Capital 的有力支持；但机构投资判断必须区分独立比较排名基准和已依法完成 的股权融资。TopTech 2026
              给出的 10.3 亿欧元（€1.03b）估值，是把高同行倍数套用于私人营收估算的结果。我们建议将 Blackwall 列入“跟踪”
              状态，在经审计财务数据和正式定价股权轮次形成客观市场出清价之前，不要接受纸面独角兽估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV012
