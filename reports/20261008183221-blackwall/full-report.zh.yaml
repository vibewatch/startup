  - id: FU001
    title: 客户获取、基础设施接入与扩张旅程
    type: journey-map
    summary: 展示 B2B2C 客户从初始网络威胁监控到全域代理变现的旅程。
    data:
      items:
        - label: 发现与威胁评估
          stage: 发现与评估
          actor: 托管服务商 / MSP
          touchpoints:
            - 参与 CloudFest 和 MSP Global 行业会议
            - 在测试 Web 集群中部署免费监控模式
            - 被动分析机器人流量画像并审阅威胁情报仪表盘
        - label: 反向代理集成
          stage: 基础设施集成
          actor: 托管基础设施团队
          touchpoints:
            - 配置内联 GateKeeper 反向代理集群
            - 自动部署 TLS 1.3 证书并配置 HTTP/3 QUIC
            - 与 cPanel、Plesk 和 WHMCS 预集成管理
        - label: 全域域名激活
          stage: 全域激活
          actor: 托管商业团队
          touchpoints:
            - 在数千个托管租户域名上激活
            - 实现 10% 至 25% 的服务器密度和算力节省
            - 将基础 WAF 和机器人缓解打包进托管套餐
        - label: 增值追加销售与利润率扩张
          stage: 商业变现与扩张
          actor: 终端 SMB 与经销商
          touchpoints:
            - 追加销售包括 CAPTCHA 定制在内的高级安全功能
            - 扩展至多集群和多数据中心环境
            - 渠道经销商收入分成及经常性利润率扩张
        - label: 生态扩张与 APAC 规模化
          stage: 地理扩张
          actor: 区域渠道合作伙伴
          touchpoints:
            - 借助本地化销售工程师拓展 APAC 和北美
            - 与 Future Spirits 等区域主办方联合举办品牌教育网络研讨会
            - 赞助区域会议并发表生态主题演讲
        - label: 持续威胁建模与留存
          stage: 生命周期防御
          actor: 托管运营与安全团队
          touchpoints:
            - 实时调整 AI 行为模型，应对不断变化的抓取器
            - 自动更新 OWASP Top 10 规则，无需重新配置源服务器
            - 持续监控基础设施密度并续签托管合同
