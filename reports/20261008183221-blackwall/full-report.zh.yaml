      - number: '8.2'
        title: 融资历程、倍数对标与纸面价值和交易价值
        blocks:
          - type: paragraph
            body: >-
              Blackwall 的资本化历程说明了欧洲创业公司的稳健扩张，最终在 2025 年 3 月完成由 Dawn Capital 领投、老股东 MMC Ventures 参与的 4,500 万欧元（€45m）B
              轮融资。历史创投登记显示，公司在 Seed、A 轮和 B 轮累计募资 4,900 万至 6,270 万美元（$49.0m–$62.7m）。2026 年 9 月， 由并购顾问 Prudentia Tallinn 和
              Siena Secondary Fund 编制的独立 TopTech 2026 排名，将 Blackwall 评为最大跃升者，隐含估值 10.3 亿欧元（€1.03b；$1.13b），较 2025 年约 2.21
              亿欧元（€221m）上涨 368%。联合作者 Rando Rannus 解释称，这一估值是以营业额为基础的 市场倍数推导而来，参照上市网络安全同行和近期行业融资轮次，并套用于 Blackwall
              报告的强劲营收增长。关键在于，Fomo.Observer 和 Invest in Estonia 的分析报道都强调，10.3
              亿欧元（€1.03b）只是纸面上的合成基准，并非定价股权融资或交易估值。尽管市场观察人士预计，
              即将到来的机构轮次将独立确认独角兽估值，机构投资者仍应把当前基准视为未经确认的倍数扩张产物；一旦更广泛的网络安全公开市场倍数 收缩，它也会受到冲击。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
