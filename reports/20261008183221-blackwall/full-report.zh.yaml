  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与渠道变现
        blocks:
          - type: paragraph
            body: >-
              Blackwall 主要通过批发式 B2B2SMB 渠道分销变现网络安全基础设施，而非高接触度的企业直销。核心平台 GateKeeper 是部署在托管边界的高级反向代理，用于检测 Web
              流量、隐藏后端基础设施，并中和自动化机器人活动、七层 DDoS 流量激增和未经授权的 Web 抓取。Blackwall
              通过与托管服务商（HSP）、托管式服务商（MSP）及电商平台合作来商业化这项技术。这些渠道合作伙伴共同管理数百万个托管网站的基础设施，使 Blackwall 无需承担传统高 CAC
              直销开支，就能广泛渗透中小企业。收入分为基础设施层批发许可协议，以及合作伙伴向终端客户转售的白标或联名安全附加模块。在这些合作安排下，托管服务商可以把 GateKeeper
              集成为全包式默认托管层功能，也可以按月订阅提供自适应 WAF、反抓取控制和 CAPTCHA 替代方案等模块化防护。Blackwall
              推广动态商业条款，旨在让供应商激励与托管基础设施经济性一致，并声称在源端计算资源消耗前过滤无用自动化请求，可使服务器集群运营成本降低 10% 至
              25%。但合同批发折扣表、最低量承诺和终端零售分成仍属私有且未经验证。
