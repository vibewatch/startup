  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Blackwall 的可服务边界涵盖云端自动化威胁缓解、Web 应用防火墙（WAF）和恶意机器人流量管理。恶意机器人在 Web 请求中的占比不断上升，给 Web 托管基础设施带来运营与财务压力。Blackwall
              将攻击面拆分为自动化机器人流量、L7 DDoS
              攻击、凭证滥用和七层应用漏洞。企业内部终端防护套件、以用户席位计费的安全访问服务边缘（SASE）架构，以及专用网络三/四层传输清洗管线不属于当前边界；这些方案需要不同的采购路径和本地物理设备部署。在核心边界内，Blackwall
              将 GateKeeper 反向代理和 BotGuard 应用直接置于 Web 流量接入层，在应用计算资源消耗之前透明过滤流量。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM011
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与受约束的可服务获取空间
        blocks:
          - type: paragraph
            body: >-
              评估 Blackwall 的市场潜力，必须把自上而下的行业估算与自下而上的渠道现实分开。独立网络安全行业评估预计，到 2026 年全球更广义的 Web 应用与 API 防护（WAAP）及机器人防御市场将达
              €18.2B，预计 CAGR 为 16.5%。但 Zscaler 等面向企业的厂商通过高合同价值年度 SaaS 订阅获取大型企业 IT 席位，中型市场与 SMB 网站因此服务不足。Blackwall
              的可服务可得市场（SAM）由服务 SMB 的全球托管与托管式服务商生态界定，在欧洲、北美和亚太托管集群中约为 €2.4B。其可服务可获取市场（SOM）代表合作 HSP 与 MSP 的即时渠道容量；根据 100
              多个合作伙伴网络和 230 万个受保护网站的当前渗透率，保守估计为 €145M。区域基准指数中的隐含估值倍数已达到 €1.03B，但独立的二级验证仍在等待。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方分层、预算归属与采用经济学
        blocks:
          - type: paragraph
            body: >-
              Blackwall 采用独特的 B2B2C
              商业模式，使基础设施运营方与下游终端客户的预算激励相互衔接。主要商业买方是托管服务商（HSP）、托管式服务商（MSP）和负责服务器集群、共享托管集群及云数据中心的基础设施 OpEx
              负责人。对这些基础设施买方而言，不需要的恶意机器人流量最多占自动化请求的 66%，会造成 CPU 耗尽、内存争用和人为带宽峰值。托管运营方把 GateKeeper
              部署为集群级反向代理后，可通过提高服务器用户密度，把后端运营计算支出降低 10% 至 25%。与此同时，托管服务商的商业团队把机器人防御和 WAF 功能包装成 SMB
              网站所有者的高级托管附加项或原生安全套餐，从而释放经常性增量收入，减少客户流失摩擦。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 结构性增长驱动、采用约束与承保式尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动 Blackwall 市场采用的主要顺风，是自动化、AI 驱动的机器人框架不断扩散，并能够绕过传统 IP 信誉与静态特征过滤。SMB 承受 43% 的网络攻击，却缺乏购买 Zscaler 或
              Cloudflare 等厂商六位数企业合同所需的内部安全人员和资金。反过来，显著的采用约束与尽调缺口决定了投资风险。高层 TAM 预测往往把 PCI DSS、HIPAA、FedRAMP
              等彼此不同的企业合规支出加总，但这些支出未必转化为托管渠道的采购能力。此外，ASX:BWF
              等更广泛区域市场的公开小盘股可比公司表明，当经营亏损持续、流动性受限时，公开市场投资者会施加严重估值折价。              隐含 10.3 亿欧元（€1.03b）估值的私人二级市场倍数同比跃升
              368%，需要独立融资轮验证和经审计的毛利率佐证。
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: SMB 安全中的渠道优先 B2B2C 优势
            body: >-
              企业网络安全厂商过去很难渗透 SMB，因为获客成本高、销售周期复杂。Blackwall 将 GateKeeper 直接嵌入托管服务商的服务器集群，把托管平台变成批发分销引擎，无需逐站修改
              DNS，就能即时保护数百万客户域名。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
          - type: callout
            title: 公开可比公司中的估值基准脱节
            body: >-
              区域私人指数依据快速的营收增长，将 Blackwall 的隐含估值定为 €1.03B；但名称相近的公开小盘股可比公司表明，资本市场会惩罚持续净亏损和未经验证的有机现金流。承保方必须区分渠道驱动的经常性 ARR
              与缺乏流动性的纸面估值上调。
            calloutType: risk
            claimRefs:
              - CM009
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与威胁格局动态
        blocks:
          - type: paragraph
            body: >-
              Web 应用安全竞争的核心，是自动化机器人流量的数量与复杂度快速上升。行业估计显示，自动化机器人约占全部 Web 流量的
              50%，其中三分之二被归类为恶意探测、凭证填充、抓取或七层容量型攻击。             
              过去，传统网络安全厂商通常为拥有专门安全运营中心和百万美元防御预算的大型企业定制产品与商业条款。这种企业导向使承担约 43% 网络攻击的中小企业长期服务不足且易受攻击。Blackwall
              针对这一市场缺口，为托管服务商和托管式服务商设计 GateKeeper；这些合作伙伴合计运营数百万个托管客户网站。Blackwall
              不直接争夺单个企业安全合同，而是把自己定位成基础设施层防御，在恶意流量抵达租户应用服务器前，保护托管集群免受七层容量型 DDoS 与机器人攻击。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 架构差异与部署权衡
        blocks:
          - type: paragraph
            body: >-
              从架构看，Blackwall 的替代方案分为集中式公有云边缘网络和服务器内主机防护代理。Cloudflare 等领先云边缘厂商通过全球 Anycast 网络路由租户流量，提供强大的 Web 应用防火墙和 DDoS
              缓解，但要求客户重定向 DNS 或完整委派区域。这种模式往往绕开托管服务商，把它们变成商品化计算基础设施，同时由云安全厂商掌握客户关系和利润。相反，BitNinja
              等以服务器为中心的竞争者把代理模块直接部署到单台 Linux 主机，在全球节点网络中共享恶意 IP 遥测，无需反向代理。Blackwall 的 GateKeeper
              处于两者之间：它是直接部署在托管服务商基础设施内的分布式反向代理集群。该设置隐藏源服务器 IP 地址，原生处理 TLS 1.3 证书自动配置和 HTTP/3 QUIC
              加速；cPanel、Plesk、DirectAdmin 和 WHMCS 的预构建集成，则把防护嵌入标准 Web 托管流程。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
      - number: '3.3'
        title: 商业包装、定价透明度与 GTM 能力
        blocks:
          - type: paragraph
            body: >-
              商业包装与市场进入结构，是 Blackwall 对传统安全厂商形成渠道切入口的关键。企业安全服务商通常要求高额年度承诺、复杂的按席位或按请求许可，以及大量专业服务。Blackwall 则采用渠道优先的 B2B2C
              批发模式，通过 Realtime Register 和 Elcore 等专业合作伙伴分销。托管分销商把 GateKeeper
              纳入自动化配置流程，提供无需最低量承诺的按用量付费条款。这种分销协同使托管服务商能够把高级七层机器人缓解、自适应 WAF
              规则和抓取防护重新包装进标准托管套餐，或作为高毛利经常性安全附加项销售。此外，Blackwall 声称，在恶意自动化流量抵达源服务器集群前将其过滤，可通过优化用户密度和减少服务器资源争用，使托管合作伙伴降低 10
              至 25% 的运营支出。但公司依赖定制销售谈判，且完全没有公开价目表，导致批发定价利润无法独立验证。
            claimRefs:
