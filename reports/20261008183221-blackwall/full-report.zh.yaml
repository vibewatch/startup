      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值悬空与市场可比风险
            body: >-
              爱沙尼亚 TopTech 2026 排名公布的 10.3 亿欧元（€1.03b）估值，是参照上市网络安全同业的隐含收入倍数，而非协商确定的股权交易价格。Siena Secondary Fund
              虽指出快速收入增长支撑这一估值，但若独立股权轮验证估值前上市同业倍数收缩，私人科技估值仍会面临下行波动。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: 渠道优先护城河与客户所有权困境
            body: >-
              Blackwall 将 GateKeeper 嵌入托管服务商，因而无需高额企业直销营销成本，就能迅速覆盖 230 万个网站。但该模式也隔离了 Blackwall 与底层 SMB
              终端用户，使商业留存和定价权始终紧密依赖托管合作伙伴的打包决策与运营状况。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与战略承保立场
        blocks:
          - type: paragraph
            body: >-
              Blackwall 的投资逻辑，核心在于它高效的结构化分销能力，以及在托管和云基础设施栈中的关键位置。公司 2019 年在爱沙尼亚塔林以 BotGuard 之名成立，2025 年 3 月更名为
              Blackwall，解决了 Web 安全商业化中最顽固的瓶颈之一：在不承担高获客成本的企业直销开支的前提下， 保护规模庞大、服务不足的中小企业（SMB）Web 生态。Blackwall 将 GateKeeper
              反向代理直接嵌入托管服务商（HSP）、托管服务提供商（MSP） 和电商平台的网络，已为全球 100 多家合作伙伴的逾 230 万个网站提供保护。这套架构带来很强的运营协同：托管合作伙伴通过第 7 层机器人
              过滤，最多可削减 25% 的计算和网络开销，同时还能通过加售网络安全附加服务，打开经常性变现渠道。反方逻辑则来自中间商守门人集中、 渠道定价权和估值倍数脆弱性。Blackwall
              的收入增长高度依赖合作伙伴的打包方式和续约率，因此暴露于合作伙伴流失或整合风险。 此外，市场对 AI 驱动机器人威胁和网络安全领域并购的追捧，已把纸面估值推向超高增长倍数；如果北美和亚太渠道扩张落后预期，
              这些估值可能与底层现金流脱节。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
