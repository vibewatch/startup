chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Blackwall（前身为 BotGuard OÜ）是一家网络安全基础设施与流量过滤服务商，由 Nikita Rozenberg 和 Denis Prochko 于 2019 年在爱沙尼亚 Tallinn
              创立。Prochko 曾搭建一个分享蔬菜食谱的小型兴趣网站，但网站持续遭受自动化机器人攻击，促使两位创始人开发专用缓解基础设施。Blackwall 采用基础设施层 B2B
              模式，主要通过与托管服务商（HSP）、托管式服务商（MSP）及电商平台合作的渠道交付旗舰产品 GateKeeper，而非直接销售给企业。GateKeeper
              是部署在网络流量入口的高级反向代理，在恶意请求抵达托管服务器集群或客户后端应用之前，执行七层深度数据包检测、自动机器人中和和七层 DDoS
              缓解。该方案隐藏后端基础设施并提高服务器集群租户密度，使托管合作伙伴最多可降低 25% 的运营支出，同时把自动化网络安全防护包装成面向数百万下游中小企业（SMB）的可扩展经常性收入附加服务。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
