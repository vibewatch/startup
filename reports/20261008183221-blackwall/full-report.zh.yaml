  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设与运营驱动因素
      - 隐含估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 一线美国 / APAC HSP 快速采用；受保护网站增至 5M+；NRR 超过 125%；毛利率达到 80%+
        - 定价机构融资轮确认 €1.2B–€1.5B 股权估值；成为云巨头有吸引力的战略并购目标
        - 国际销售扩张存在执行瓶颈；企业 CDN 厂商激进捆绑竞争
        - 25%——取决于美国渠道执行无误，以及网络安全倍数持续扩张
      - - 基准情景
        - 在中型市场托管商中稳步扩张；受保护网站达到 3M–3.5M；员工人数稳定在 100–120 人左右；单位经济模型实现盈利
        - 基于 10x–14x 远期 ARR 的 €650M–€850M 公允市场估值；增长可持续，现金消耗可控
        - 托管行业整合压低合作伙伴批发抽成；国际销售周期拉长
        - 55%——符合爱沙尼亚科技创始人以往展现的资本高效扩张路径
      - - 悲观情景
        - 关键 HSP 合作伙伴流失；托管商搭建基础的内部抓取器；公开市场网络安全 SaaS 倍数压缩
        - €300M–€450M 估值，反映倍数回落至 2025 年水平（€221M 基准加 Series B 现金）
        - 严重估值悬顶打击员工股权激励；资本市场收紧时存在下轮融资风险
        - 20%——合成纸面估值及未对冲的渠道集中度推高下行风险
    notes: 情景模型考虑了私营公司的低流动性、对合成可比倍数的依赖，以及 2026–2028 年间的渠道执行风险。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Blackwall 从 2019 年在塔林创立，到 Series B 机构扩张及 2026 年获得 €1B 隐含估值认可的里程碑按时间推进。
    data:
      items:
        - label: 2019-06：首次创立
          detail: Nikita Rozenberg 和 Denis Prochko 在爱沙尼亚塔林创立 BotGuard，此前 Prochko 的菜谱网站持续遭受机器人攻击。
          tone: neutral
        - label: 2020-10：首次融资活动
          detail: 公司记录了最初的外部天使及种子前承诺，用于开发商业网络流量过滤软件。
          tone: positive
        - label: 2021-02：机构种子轮
          detail: BotGuard 在由总部位于塔林的 Tera Ventures 领投、Firlej Kastory 参与的种子轮中获得首笔风险投资。
          tone: positive
        - label: 2024-03：Series A 扩张
          detail: 获得由 Tera Ventures 领投、MMC Ventures 参与的 Series A 融资，加速渠道合作。
          tone: positive
        - label: 2025-03：€45M Series B 与品牌重塑
          detail: 获得 Dawn Capital 领投、MMC Ventures 参与的 €45M Series B；公司品牌从 BotGuard 更名为 Blackwall。
          tone: positive
        - label: 2025-03：治理扩张
          detail: 由 Norman Fiore（Dawn Capital）组成正式董事会，并任命 Hudson Rock CEO Roi Carthy 为执行董事长。
          tone: positive
        - label: 2025-03：渠道规模里程碑
          detail: 受保护的网站和应用超过 230 万个，部署覆盖 100+ 家全球托管服务商合作伙伴。
          tone: positive
        - label: 2026-07：员工扩张
          detail: 国际员工人数从 Series B 交割时的 65 人增至约 100 人，分布于欧洲、美国和 APAC 业务。
          tone: positive
        - label: 2026-09：TopTech €1B 隐含估值
          detail: Prudentia 和 Siena Secondary Fund 在 TopTech 2026 中将 Blackwall 排名第 5，隐含估值 €1.03B，并注明交易确认尚待完成。
          tone: warning
        - label: 2026-10：尽调实体消歧
          detail: 市场股票代码混淆后，审计人员确认其与 ASX 上市房地产管理商 Blackwall Limited（ASX:BWF）严格保持企业独立。
          tone: neutral
    approximationNotes: 日期代表公开宣布的日历季度及风险投资数据库记录的交易日期；内部运营部署时间线可能早于披露。
