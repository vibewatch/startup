      - number: '1.2'
        title: 高管领导、治理与董事会架构
        blocks:
          - type: paragraph
            body: >-
              Blackwall 由共同创始人 Nikita Rozenberg（首席执行官）和 Denis Prochko（首席技术官）领导；自 2019 年成立以来，两人一直推动管理战略与核心反向代理架构。公司在 2025
              年 3 月完成 B 轮融资并从 BotGuard 更名后，大幅规范公司治理和国际管理团队，以支持在北美及亚太地区扩张。Hudson Rock 联合创始人兼首席执行官 Roi Carthy
              出任董事会执行主席；领投方 Dawn Capital 联合创始人兼普通合伙人 Norman Fiore 任董事，Dawn Capital 主任 Shamillah Bankiya
              任董事会观察员，进一步强化了治理。运营团队还包括首席运营官 Martin Pawliczek、首席财务与安全官 Robin Sharpe、总法律顾问 Medeia Japaridze、首席人才官 Maria
              Markopolou、首席体验官 Robert Jacobi、亚太区副总裁 Makoto Nishizawa，以及销售与业务开发副总裁 Francisco Carvalho。技术架构仍以创始人 Denis
              Prochko 为核心，但治理监督高度依托机构投资者代表和资深网络安全管理层。
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO011
