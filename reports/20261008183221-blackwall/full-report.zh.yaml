  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与买方画像匹配
        blocks:
          - type: paragraph
            body: >-
              Blackwall 围绕两层 B2B2C
              架构获客，而非直接销售企业边界安全。主要经济买方是基础设施服务商，包括托管服务商（HSP）、托管式服务商（MSP）和多租户电商平台运营方。对这些托管运营方而言，Blackwall 的 GateKeeper
              反向代理充当上游流量控制器和运营利润保护器，在伪造请求抵达核心源服务器集群前，缓解自动化机器人流量与七层拒绝服务容量峰值。相比之下，最终用户是中小企业（SMB）；它们托管的网站可获得透明的机器人缓解、WAF
              规则过滤和 TLS 证书自动管理，无需逐域重新委派 DNS。次级客群包括在 Apache、Nginx 或主要内容管理系统上部署独立 BotGuard Web 服务器插件的网站管理员，以及通过 Elcore
              等增值分销商采购的企业平台客户。
