      - number: '3.4'
        title: 护城河持久性、供应商透明度与基准缺口
        blocks:
          - type: paragraph
            body: >-
              Blackwall 与托管服务商的渠道协同建立了可防守的分销护城河，但其定位的持久性受到明显透明度与验证缺口挑战。安全评测机构 WAFPlanet 的独立分析指出，Blackwall
              既未公布透明的目录价，也未提供详尽的公开技术文档。更关键的是，公司没有公开第三方安全基准或独立检测率测试，行为型机器人检测准确率与误报率的说法没有独立实验室佐证。公司最近从 BotGuard 更名为
              Blackwall，也造成旧托管插件和文档库中的品牌碎片化。              尽管欧洲网络安全同业估值仍然坚挺，TopTech 2026 依据强劲收入增长倍数给出 €1.03B 隐含估值，但
              Blackwall 仍易受传统厂商反击。如果大型边缘服务商推出低成本托管合作伙伴层，或服务器代理专业厂商扩展代理能力，Blackwall 缺乏透明且可验证的基准领先地位，可能被竞争者取代。
