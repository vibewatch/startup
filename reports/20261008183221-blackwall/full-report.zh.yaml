      - number: '1.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 渠道优先分销释放有利单位经济
            body: >-
              传统企业机器人管理厂商往往面临漫长的直销周期和沉重的专业服务负担；Blackwall 直接接入托管控制面板（cPanel、DirectAdmin、Plesk 及定制 HSP
              计费模块），因此建立了高效的批发分销渠道。托管服务商将 GateKeeper 打包为托管式安全功能，在保护超过 230 万个网站（2.3m）的同时，最多降低托管服务器集群 25% 的运营支出。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: callout
            title: 区分研究隐含倍数与交易股权价值
            body: >-
              TopTech 2026 将 Blackwall 的估值记为 10.3 亿欧元（€1.03b；较 2025 年的 2.21 亿欧元（€221m）上涨 368%），但 Siena Secondary Fund
              明确指出，该数字是依据上市网络安全可比公司和收入走势推导的隐含倍数，而非按公平交易价格确定的股权交易。除非独立的定价融资轮予以确认，投资者不应把这一媒体里程碑当作经验证的股权估值基准。
            calloutType: risk
