evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-arr
    missingEvidence: >-
      Confirmed audited Annual Recurring Revenue (ARR) and transaction documentation verifying an equity valuation above
      €1.0 billion.
    whyItMatters: >-
      TopTech 2026 assigns an implied €1.03 billion valuation based on market peer multiples, but Blackwall has not yet
      confirmed an arm's-length priced round at that level.
    diligencePath: >-
      Request confidential management financial package, trailing twelve-month revenue ledger, and latest priced round
      cap table agreements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: detailed-cap-table
    missingEvidence: >-
      Exact percentage equity breakdown and voting distribution between co-founders and venture funds Tera Ventures,
      Dawn Capital, and MMC Ventures.
    whyItMatters: >-
      Full cap table transparency is necessary to model founder control dynamics, anti-dilution provisions, and
      liquidation waterfall preferences.
    diligencePath: >-
      Review Blackwall's Estonian commercial registry filing (Äriregister) or request formal share registry disclosure
      under NDA.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: wholesale-take-rate
    missingEvidence: >-
      Exact contractual wholesale revenue share percentages and average revenue per protected domain between Blackwall
      and HSP partners.
    whyItMatters: >-
      Directly determines the conversion rate of Blackwall's €145M SOM channel capacity into recognized annual recurring
      revenue.
    diligencePath: Review representative HSP master service agreements (MSAs) and partner tier commission schedules under NDA.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: unconfirmed-benchmark
    severity: material
    topic: implied-valuation-verification
    missingEvidence: >-
      Audited term sheet or regulatory filing confirming the priced close of an equity financing round validating the
      €1.03B TopTech valuation.
    whyItMatters: >-
      The 368% implied valuation surge relies entirely on revenue multiple comparables that could be revised downward if
      market multiples compress.
    diligencePath: >-
      Inspect commercial register filings in Estonia and investor closing notices for Series B or subsequent growth
      rounds.
    relatedQuestionRefs:
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: >-
      Audited third-party detection rate benchmarks and head-to-head performance evaluations comparing GateKeeper
      against Cloudflare WAF, BitNinja, and Wallarm.
    whyItMatters: >-
      Without independent benchmarking, claims regarding bot mitigation efficacy, false positive rates, and latency
      overhead rely strictly on vendor and distributor assertions.
    diligencePath: >-
      Request customer proof-of-concept telemetry and independent test lab evaluations under simulated high-volume bot
      attack scenarios.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: partner-wholesale-pricing
    missingEvidence: >-
      Disclosed wholesale per-server or per-domain rate cards and volume discount tiers agreed with hosting providers
      and distributors.
    whyItMatters: >-
      Because Blackwall does not publish list pricing and relies on custom sales negotiations, gross margin impact and
      net cost per customer site cannot be validated from public filings.
    diligencePath: >-
      Obtain distributor rate schedules and partner revenue-share agreements from Realtime Register or Elcore
      distribution channels.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: revenue-breakdown
    missingEvidence: >-
      Contractual breakdown of realized GAAP/IFRS annual recurring revenue (ARR), recognized gross margins, and
      wholesale discount schedules.
    whyItMatters: >-
      Implied valuations benchmarked against cybersecurity peers cannot be verified without audited income statement
      figures.
    diligencePath: >-
      Obtain management accounts, audited annual financial statements, and top-tier partner commercial contracts under
      NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: private-evidence-only
    severity: material
    topic: cash-flow-and-burn
    missingEvidence: >-
      Audited balance sheet, current monthly net cash burn, and remaining cash runway from the €45 million Series B
      financing.
    whyItMatters: >-
      Determines forward capital adequacy and whether headcount expansion in the US and APAC will necessitate additional
      equity capital.
    diligencePath: Review bank covenant letters, cash flow statements, and forward operating budgets for FY2026 and FY2027.
    relatedQuestionRefs:
      - QI004
      - QI006
  - type: conflicting-data
    severity: blocking
    topic: market-data-confusion
    missingEvidence: >-
      Clear institutional investor documentation distinguishing Blackwall from Australian ASX-listed real estate entity
      BlackWall Limited (ASX:BWF).
    whyItMatters: >-
      Automated aggregators and screening algorithms cross-link distressed property financials to the cybersecurity
      startup, creating severe underwriting error.
    diligencePath: >-
      Confirm corporate registry incorporation records in Tallinn, Estonia and verify independent cap table
      registration.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: assurance-gaps
    missingEvidence: >-
      Independent efficacy and false-positive testing, throughput and latency results, uptime history, incident records,
      and security certification documents.
    whyItMatters: >-
      GateKeeper is positioned inline with customer traffic, so detection errors, latency, outages, and control failures
      could directly affect hosted applications.
    diligencePath: >-
      Request third-party test reports, status and incident exports, certification scope statements, and production SLO
      evidence under NDA.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: >-
      Current network and data-flow diagrams, tenancy boundaries, data classification, retention schedules, failover
      design, and deployment rollback procedures.
    whyItMatters: Named components alone do not establish isolation, privacy, resilience, or operational recoverability.
    diligencePath: >-
      Run an architecture review with Engineering and Security using diagrams, threat models, disaster-recovery tests,
      and representative partner configurations.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public API specifications, changelogs, release history, package or repository activity, contributor signals, and
      practitioner discussion tied to GateKeeper.
    whyItMatters: >-
      Hiring posts indicate implementation complexity but do not establish product velocity, integration quality, or an
      external developer ecosystem.
    diligencePath: >-
      Request API documentation, connector support matrices, release notes, deprecation policy, and anonymized
