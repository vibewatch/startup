chapter:
  number: 5
  title: "Product & Technology"
  summary: "Blackwall presents GateKeeper as an inline web-security and traffic-management layer for hosting and service providers, built around a reverse proxy, detection server, data warehouse, and integration modules. The public evidence supports a partner-led deployment workflow and a broad control set, but it does not independently establish detection accuracy, latency, uptime, certification status, incident history, or a product-specific roadmap."
sections:
  - id: "product-and-workflow"
    title: "Product Surface and Customer Workflow"
    body: "GateKeeper is marketed to hosting and service providers rather than directly to each hosted small-business site. Blackwall says the system sits at the web-traffic entry point, inspects and filters requests, and allows only legitimate traffic to reach the application layer. The disclosed control surface includes a web application firewall, bot management, anti-scraping and content-copy controls, rate limiting, certificate automation, caching, and support for HTTP/3 and TLS 1.3. The customer workflow is therefore an infrastructure deployment: a provider evaluates its traffic path, validates a solution through a proof of concept, integrates the service into its environment, and then exposes security capabilities to hosted customers. Public materials do not disclose module-level adoption, attach rates, or realized customer outcomes."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE009"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-delivery"
    title: "Architecture, Integration, and Delivery Model"
    body: "The official architecture description identifies a distributed server cluster containing a GateKeeper reverse proxy, a detection server, a data warehouse, and integration modules. That is enough to establish the named components, but not their topology, tenancy boundaries, data flows, model design, or failure modes. Hiring materials add a delivery signal: technical staff are expected to assess partner infrastructure, design solution architectures, run proofs of concept with Tech Ops, identify integration risks, and transition validated deployments toward production. The same materials mention reverse proxies, NGINX, Apache, WAF, bot protection, and DDoS as relevant environment knowledge. These postings are company-issued evidence of intended implementation work, not independent verification of production performance."
    claimRefs:
      - "CE002"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "maturity-and-differentiation"
    title: "Maturity and Differentiation"
    body: "The strongest maturity indicator is a company claim that GateKeeper protects more than 2.3 million websites and applications through more than 100 partners; the retained evidence does not provide a denominator, measurement method, active-deployment definition, or independent confirmation. Blackwall's clearest product distinction is its hosting-provider distribution and integration orientation, not a proven performance advantage. VentureRadar's BotGuard profile describes web-server extensions, CMS plugins, and hosting-panel plugins across Apache, NGINX, WordPress, cPanel, Plesk, and DirectAdmin, but that directory is descriptive market taxonomy rather than an independent benchmark. The public roadmap is also directional: Blackwall says it intends to invest in additional infrastructure and security products, without naming release dates, specifications, or acceptance criteria."
    claimRefs:
      - "CE006"
      - "CE012"
      - "CE013"
  - id: "trust-controls-and-evidence-limits"
    title: "Trust Controls and Evidence Limits"
    body: "Blackwall discloses several product-level controls, including WAF, encrypted transport support, rate limiting, certificate automation, and filtering for L7 DDoS, brute-force, and automated bot traffic. Its documentation also exposes a support workflow for technical issues, bug reports, and feature suggestions, while the documentation team says it aims to assign remedial tasks for documentation feedback within five working days; this is not a five-day product-incident resolution commitment. The assigned evidence does not include independent efficacy tests, uptime or status history, security certification documents, incident reports, privacy and retention details, or public developer-repository activity. Two pool results further limit corroboration: one job aggregator is thin and template-padded, while an Arm article is an unrelated name collision involving an Aston Martin employee."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE007"
      - "CE014"
      - "CE015"
