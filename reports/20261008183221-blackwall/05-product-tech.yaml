callouts:
  - calloutType: "strength"
    title: "Provider-Level Distribution Is the Clearest Product Thesis"
    body: "GateKeeper is designed to sit in the hosting provider's traffic path, allowing security and traffic controls to be delivered across many hosted sites through one partner integration. That distribution thesis is supported by company product and deployment materials, although adoption quality and economics are not independently verified."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE009"
  - calloutType: "risk"
    title: "Technical Underwriting Still Requires Primary Operating Evidence"
    body: "The assigned pool does not establish detection accuracy, production latency, availability, incident history, data handling, external certifications, or roadmap execution. Diligence should obtain architecture diagrams, audit reports, status and incident exports, performance tests, API documentation, and representative PoC acceptance records."
    claimRefs:
      - "CE014"
