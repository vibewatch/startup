callouts:
  - calloutType: "risk"
    title: "Critical Need for Capital Structure and Entity Disambiguation"
    body: "Financial underwriting must prevent automated data pollution between Blackwall, the venture-backed cybersecurity technology startup founded in Estonia, and BlackWall Limited (ASX:BWF), a publicly traded Australian commercial real estate fund. Financial databases often conflate ASX:BWF's statutory accounts ($789 thousand revenue, $2.35 million net loss in FY2026, suspended dividends) with the private security startup. Blackwall itself is a venture-backed growth entity with €45 million in Series B financing led by Dawn Capital and an implied €1.03 billion valuation in TopTech 2026. Underwriters must demand separate corporate documentation, bank statements, and Estonian commercial registry records to avoid reliance on ASX filings."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
  - calloutType: "insight"
    title: "Channel GTM Structural Operating Leverage"
    body: "By focusing on hosting and managed service providers rather than enterprise direct sales, Blackwall circumvents the standard multi-million dollar direct marketing and direct sales expenditures common among cybersecurity unicorns. With 65 team members scaling across 100+ channel partners and 2.3M+ protected websites, the company displays exceptional headcount efficiency. However, this structure shifts risk toward partner concentration, channel discount compression, and the inability to capture full downstream retail pricing power."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI006"
      - "CI008"
