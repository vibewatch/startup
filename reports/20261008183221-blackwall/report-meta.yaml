companyProfile:
  summary: "Blackwall is a Tallinn-based cybersecurity infrastructure company founded in 2019 as BotGuard and rebranded in March 2025 after a €45 million Series B led by Dawn Capital. It sells GateKeeper, a reverse-proxy bot mitigation platform distributed through hosting service providers, managed service providers, and web platforms, and claims to protect more than 2.3 million websites across 100+ partners. Independent TopTech 2026 benchmarking later assigned the company an implied €1.03 billion valuation, but core private financial metrics remain undisclosed."
