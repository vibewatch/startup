callouts:
  - calloutType: "insight"
    title: "The B2B2C Channel Advantage: Operational Leverage with Wholesale Masking"
    body: "Blackwall's choice to distribute GateKeeper primarily through hosting and managed service providers affords extraordinary operational distribution leverage, scaling past 2.3 million protected websites with a team of approximately 65 employees. However, this model introduces significant analytical opacity: end-user SMBs rarely select or pay Blackwall directly, meaning product retention is effectively tied to host-level master service agreements rather than end-user brand loyalty."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Partner Concentration and Wholesale Disintermediation Exposure"
    body: "With more than 2.3 million protected websites distributed across only 100+ hosting and service partners, Blackwall's average account concentration exceeds 20,000 domains per partner. The defection of a major hosting conglomerate or internal development of competing open-source reverse proxies (such as CrowdSec or ModSecurity forks) represents a structural revenue and volume risk that cannot be easily mitigated through retail acquisition."
    claimRefs:
      - "CU001"
      - "CU008"
      - "CU014"
      - "CU015"
