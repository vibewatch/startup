chapter:
  number: 6
  title: "Customers"
  summary: "Blackwall operates an infrastructure-embedded B2B2C distribution model that reaches over 2.3 million websites via more than 100 hosting and managed service provider partners. While wholesale partner adoption drives substantial top-of-funnel deployment scale and allows 10-25% server farm density savings, commercial retention and direct end-user demand remain unverified due to wholesale revenue masking and an absence of audited churn metrics."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Persona Alignment"
    body: "Blackwall structures its customer acquisition around a two-tier B2B2C architecture rather than direct enterprise perimeter sales. The primary economic buyer is the infrastructure provider—encompassing Hosting Service Providers (HSPs), Managed Service Providers (MSPs), and multi-tenant eCommerce platform operators. For these hosting operators, Blackwall's GateKeeper reverse proxy serves as an upstream traffic command and operational margin protector, mitigating automated bot traffic and layer-7 denial-of-service volumetric spikes before synthetic requests reach core origin server clusters. The ultimate end-users, by contrast, are small and medium-sized businesses (SMBs) whose hosted web properties receive transparent bot mitigation, WAF rule filtering, and automated TLS certificate management without requiring per-domain DNS re-delegation. Secondary segments include independent web property administrators who deploy the standalone BotGuard web server plugin across Apache, Nginx, or major content management systems, as well as enterprise platform clients procured via value-added distributors such as Elcore."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-scale"
    title: "Adoption Trajectory and Deployment Footprint"
    body: "Blackwall's deployment trajectory exhibits rapid top-of-funnel expansion driven by channel-led onboarding. Following its founding in 2019 by Nikita Rozenberg and Denis Prochko, the company scaled its footprint to protect over 2.3 million active websites and web applications across more than 100 global service and hosting partners by early 2025. This wholesale footprint underpinned an estimated €1.03 billion implied corporate valuation in the TopTech 2026 rankings, reflecting a 368 percent year-on-year multiple expansion from €221 million based on strong reported revenue growth. Operational scale is further evidenced by international channel activities across Baltic Domain Days, CloudFest, and regional e-commerce summits, alongside integration relationships with distribution partners like INFO-IMPERO in Croatia, Future Spirits in Japan, and Elcore across regional IT markets. However, because Blackwall licenses GateKeeper directly to hosting providers who activate coverage across entire shared IP ranges, the headline count of 2.3 million protected sites reflects wholesale tenant exposure rather than 2.3 million discretionary commercial buying decisions."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-deployments-case-evidence"
    title: "Named Customer Deployments and Operational Outcomes"
    body: "Independent verification of Blackwall's production performance is primarily documented through partner integrations, distributor case studies, and third-party security evaluations. Technology distributor Elcore documents production outcomes across three distinct client archetypes: a multi-million-user financial services platform that achieved a 96 percent reduction in automated fake account registrations and a 50 percent drop in backend server load; an e-commerce retailer that mitigated unauthorized competitor price scraping and reclaimed search engine ranking visibility; and a telecommunications operator that sustained continuous uptime during a multi-vector layer-3 through layer-7 DDoS assault. Complementary field engagements include e-commerce optimization alongside INFO-IMPERO in Southeastern Europe and joint technical webinars with Japanese cloud provider Future Spirits analyzing automated crawler behavior. Despite these positive technical case studies, independent security benchmarking remains an acute transparency gap: WAFPlanet notes that Blackwall publishes neither third-party comparative attack mitigation benchmarks nor public pricing schedules, necessitating direct sales engagement for commercial evaluation."
    claimRefs:
      - "CU004"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-concentration"
    title: "Retention Durability, Expansion Dynamics, and Channel Concentration Risks"
    body: "The central durability risk in Blackwall's commercial engine stems from extreme channel dependency and structural opacity regarding net revenue retention (NRR) and gross revenue retention (GRR). By relying on fewer than 150 wholesale infrastructure partners to reach its 2.3 million endpoint install base, Blackwall faces substantial counterparty concentration: the churn of a single top-tier hosting partner or multi-cluster cloud provider could instantly eliminate tens of thousands of deployed domains from its active footprint. Furthermore, hosting providers often bundle GateKeeper as a baseline infrastructure utility rather than an itemized premium add-on, obscuring whether downstream SMB end-users place direct commercial value on the security service. While Blackwall offers a permanent free monitoring tier designed to convert prospective hosting networks and individual administrators via threat intelligence visibility, conversion rates, renewal intervals, and multi-year contract structures remain undisclosed, representing critical diligence items for institutional investors."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU014"
      - "CU015"
