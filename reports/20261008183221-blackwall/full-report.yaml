      - number: '2.4'
        title: Structural Growth Drivers, Adoption Constraints, and Underwriting Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary tailwind accelerating Blackwall's market adoption is the proliferation of automated, AI-driven
              bot frameworks capable of bypassing legacy IP reputation and static signature filters. SMBs sustain 43% of
              cyberattacks but lack the internal security personnel and capital necessary to purchase six-figure
              enterprise contracts from vendors such as Zscaler or Cloudflare. Conversely, significant adoption
              constraints and diligence gaps govern investment risk. High-level TAM projections often aggregate
              disparate enterprise compliance spend (PCI DSS, HIPAA, FedRAMP) that does not translate into hosting
              channel purchasing power. Furthermore, public small-cap comparables in broader regional markets (such as
              ASX:BWF) illustrate that public investors enforce severe valuation discounts when operating losses persist
              and liquidity remains constrained. Private secondary multiples implying a €1.03B valuation represent a
              368% year-over-year surge that requires independent round verification and audited gross margin
              corroboration.
