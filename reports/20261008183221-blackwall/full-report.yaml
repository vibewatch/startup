      - number: '5.2'
        title: Architecture, Integration, and Delivery Model
        blocks:
          - type: paragraph
            body: >-
              The official architecture description identifies a distributed server cluster containing a GateKeeper
              reverse proxy, a detection server, a data warehouse, and integration modules. That is enough to establish
              the named components, but not their topology, tenancy boundaries, data flows, model design, or failure
              modes. Hiring materials add a delivery signal: technical staff are expected to assess partner
              infrastructure, design solution architectures, run proofs of concept with Tech Ops, identify integration
              risks, and transition validated deployments toward production. The same materials mention reverse proxies,
              NGINX, Apache, WAF, bot protection, and DDoS as relevant environment knowledge. These postings are
              company-issued evidence of intended implementation work, not independent verification of production
              performance.
