  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The addressable boundary for Blackwall encompasses cloud-based automated threat mitigation, web
              application firewalls (WAF), and malicious bot traffic management. Malicious bots represent an escalating
              proportion of web requests, placing operational and financial burdens on web hosting infrastructure.
              Blackwall segments the operational attack surface into automated bot traffic, L7 DDoS assaults, credential
              abuse, and Layer 7 application vulnerabilities. Excluded from this immediate boundary are
              enterprise-specific internal endpoint protection suites, secure access service edge (SASE) user-seat
              architectures, and dedicated network Layer 3/4 transit scrubbing pipelines, which require distinct
              procurement pathways and on-premises physical appliance deployments. Within the core addressable boundary,
              Blackwall positions its GateKeeper reverse proxy and BotGuard applications directly at the web traffic
              ingestion layer, filtering traffic transparently before application compute resources are consumed.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
