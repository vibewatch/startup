      - number: '6.2'
        title: Adoption Trajectory and Deployment Footprint
        blocks:
          - type: paragraph
            body: >-
              Blackwall's deployment trajectory exhibits rapid top-of-funnel expansion driven by channel-led onboarding.
              Following its founding in 2019 by Nikita Rozenberg and Denis Prochko, the company scaled its footprint to
              protect over 2.3 million active websites and web applications across more than 100 global service and
              hosting partners by early 2025. This wholesale footprint underpinned an estimated €1.03 billion implied
              corporate valuation in the TopTech 2026 rankings, reflecting a 368 percent year-on-year multiple expansion
              from €221 million based on strong reported revenue growth. Operational scale is further evidenced by
              international channel activities across Baltic Domain Days, CloudFest, and regional e-commerce summits,
              alongside integration relationships with distribution partners like INFO-IMPERO in Croatia, Future Spirits
              in Japan, and Elcore across regional IT markets. However, because Blackwall licenses GateKeeper directly
              to hosting providers who activate coverage across entire shared IP ranges, the headline count of 2.3
              million protected sites reflects wholesale tenant exposure rather than 2.3 million discretionary
              commercial buying decisions.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU008
              - CU011
          - type: table
