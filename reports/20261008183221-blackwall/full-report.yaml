      - number: '1.3'
        title: Capitalization History, Implied Valuation, and Scale Trajectory
        blocks:
          - type: paragraph
            body: >-
              Blackwall has raised cumulative institutional equity funding reported between $49.0 million and $62.7
              million across four funding rounds since October 2020. The company raised an initial Seed round in
              February 2021 led by Tera Ventures with participation from Firlej Kastory, followed by a Series A round in
              March 2024 backed by Tera Ventures and MMC Ventures. In March 2025, Blackwall completed a milestone €45
              million ($49.0M USD equivalent) Series B financing led by Dawn Capital with continued participation from
              MMC Ventures, concurrently rebranding from BotGuard to Blackwall. At the time of the Series B round, the
              company employed 65 team members globally, managed over 100 hosting partnerships, and protected more than
              2.3 million active websites and web applications, with workforce expansion reaching approximately 100
              employees by mid-2026. In September 2026, the independent TopTech 2026 ranking published by Prudentia
              Tallinn and Siena Secondary Fund recognized Blackwall as Estonia's fifth most valuable tech firm with an
              implied valuation of €1.03 billion ($1.13B), up 368% from €221 million in 2025. Diligence must emphasize
              that this €1.03 billion valuation represents an analyst-derived implied multiple based on cybersecurity
              public peers and revenue growth rather than an audited transaction price or closed funding round.
