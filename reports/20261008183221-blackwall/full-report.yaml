      - number: '7.2'
        title: Regulatory, Legal, Data Privacy, and Entity Disambiguation Risks
        blocks:
          - type: paragraph
            body: >-
              On the regulatory and legal front, Blackwall operates at the web traffic entry point where GateKeeper
              inspects incoming HTTP/3, TLS 1.3, and TCP streams to differentiate human users from automated malicious
              bots. In doing so, the platform processes IP addresses, session request structures, and behavioral
              metadata across diverse jurisdictions including the European Union (GDPR), the United States, and
              Asia-Pacific territories. Because GateKeeper inspects Layer 7 payloads and mitigates automated scraping
              and credential stuffing, Blackwall must maintain strict data minimization standards to avoid regulatory
              exposure under European data protection directives. Furthermore, automated threat intelligence creates a
              secondary risk of false-positive traffic blocking, which can disrupt legitimate customer eCommerce
              transactions and trigger partner SLA liabilities. A distinct governance vulnerability discovered during
              diligence is cross-entity name confusion: global search discovery regularly conflates Blackwall (the
              Estonian cybersecurity company founded in 2019) with BlackWall Limited (ASX: BWF), an Australian property
              investment and funds management group with an Australian corporate governance framework, as well as
              unrelated legal partnerships. Clear legal disambiguation and documented privacy terms are essential
              diligence requisites.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, Infrastructure, and Partner Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, GateKeeper functions as an inline reverse proxy protecting cloud-based assets, data
              centers, and web clusters. Operating inline creates an absolute dependency on real-time availability and
              packet processing speed: any reverse-proxy latency spike, TLS termination failure, or distributed server
              cluster outage directly degrades the performance of downstream hosting clients. Additionally,
              sophisticated bot operators continuously evolve counter-detection techniques such as residential proxy
              rotation, CAPTCHA bypasses, and distributed botnet mimicry, necessitating rapid and resource-intensive
              R&D. On the partner side, Blackwall depends heavily on third-party distributor relationships, such as
              Elcore in regional markets, to integrate into control panels and provisioning pipelines across cPanel,
              Plesk, and cloud hypervisors. International expansion across North America and APAC following the €45
              million Series B requires doubling headcount from 65 toward 100+ employees, introducing organizational
              execution risk across distributed sales engineering and infrastructure support teams.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR014
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Overhang and Market Comparables Risk
            body: >-
              The €1.03 billion valuation published in Estonia's TopTech 2026 ranking reflects an implied revenue
              multiple benchmarked against publicly listed cybersecurity peers rather than a negotiated equity
              transaction price. While Siena Secondary Fund highlights rapid revenue growth supporting this mark,
              private tech valuations face downside volatility if listed peer multiples contract before an independent
              equity round validates the valuation.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: Channel-First Moat Versus Customer Ownership Dilemma
            body: >-
              Blackwall's strategy of embedding GateKeeper into hosting service providers delivers immediate scale
              across 2.3 million websites without heavy direct enterprise marketing costs. However, this model insulates
              Blackwall from the underlying SMB end-users, meaning commercial retention and pricing power remain tightly
              coupled to the hosting partner's bundling decisions and operational health.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Strategic Underwriting Stance
        blocks:
          - type: paragraph
            body: >-
              Our investment thesis for Blackwall centers on its structural distribution efficiency and mission-critical
              positioning within the hosting and cloud infrastructure stack. Founded in Tallinn, Estonia in 2019 as
              BotGuard and rebranded to Blackwall in March 2025, the company has solved one of the most stubborn
              commercialization bottlenecks in web security: protecting the vast, underserved small and medium-sized
              business (SMB) web ecosystem without incurring high-CAC enterprise direct sales overhead. By embedding its
              GateKeeper reverse proxy directly into the networks of Hosting Service Providers (HSPs), Managed Service
              Providers (MSPs), and eCommerce platforms, Blackwall protects over 2.3 million websites across more than
              100 global partners. This architecture creates powerful operational alignment: hosting partners reduce
              compute and network overhead by up to 25% through Layer 7 bot filtering, while unlocking recurring
              monetization streams by upselling cybersecurity add-ons. Conversely, the core anti-thesis is driven by
              intermediary gatekeeper concentration, channel pricing power, and valuation multiple fragility.
              Blackwall's revenue growth is highly dependent on partner packaging and renewal rates, leaving it exposed
              to partner churn or consolidation. Furthermore, market excitement surrounding AI-driven bot threats and
              macro cybersecurity M&A has driven paper valuations into hyper-growth multiples, which may decouple from
              underlying cash flows if channel expansion in North America and APAC lags expectations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
