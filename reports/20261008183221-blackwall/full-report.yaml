      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Blackwall operates a distinct B2B2C commercial model that aligns budget incentives across infrastructure
              operators and downstream end customers. The primary commercial buyers are Hosting Service Providers
              (HSPs), Managed Service Providers (MSPs), and Infrastructure OpEx owners who operate server clusters,
              shared hosting farms, and cloud data centers. For these infrastructure buyers, unwanted malicious bot
              traffic constitutes up to 66% of automated requests, causing CPU exhaustion, memory contention, and
              artificial bandwidth spikes. By deploying GateKeeper as a cluster-level reverse proxy, hosting operators
              reduce backend operational compute expenses by 10% to 25% through improved server user density.
              Concurrently, hosting commercial teams unlock recurring incremental revenue by packaging bot defense and
              WAF features as premium hosting add-ons or native security bundles for SMB website owners, eliminating
              frictionless customer churn.
