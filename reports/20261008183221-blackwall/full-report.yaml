      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Need for Capital Structure and Entity Disambiguation
            body: >-
              Financial underwriting must prevent automated data pollution between Blackwall, the venture-backed
              cybersecurity technology startup founded in Estonia, and BlackWall Limited (ASX:BWF), a publicly traded
              Australian commercial real estate fund. Financial databases often conflate ASX:BWF's statutory accounts
              ($789 thousand revenue, $2.35 million net loss in FY2026, suspended dividends) with the private security
              startup. Blackwall itself is a venture-backed growth entity with €45 million in Series B financing led by
              Dawn Capital and an implied €1.03 billion valuation in TopTech 2026. Underwriters must demand separate
