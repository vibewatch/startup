  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              GateKeeper is marketed to hosting and service providers rather than directly to each hosted small-business
              site. Blackwall says the system sits at the web-traffic entry point, inspects and filters requests, and
              allows only legitimate traffic to reach the application layer. The disclosed control surface includes a
              web application firewall, bot management, anti-scraping and content-copy controls, rate limiting,
              certificate automation, caching, and support for HTTP/3 and TLS 1.3. The customer workflow is therefore an
              infrastructure deployment: a provider evaluates its traffic path, validates a solution through a proof of
              concept, integrates the service into its environment, and then exposes security capabilities to hosted
              customers. Public materials do not disclose module-level adoption, attach rates, or realized customer
              outcomes.
            claimRefs:
