chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Origins, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Blackwall (formerly BotGuard OÜ) is a cybersecurity infrastructure and traffic filtering provider founded
              in Tallinn, Estonia in 2019 by Nikita Rozenberg and Denis Prochko. The company originated when Prochko
              built a small hobby website for sharing vegetable recipes that experienced persistent automated bot
              attacks, prompting the co-founders to engineer purpose-built mitigation infrastructure. Blackwall operates
              an infrastructure-layer B2B model delivering its flagship GateKeeper solution primarily through channel
              partnerships with Hosting Service Providers (HSPs), Managed Service Providers (MSPs), and eCommerce
              platforms rather than direct enterprise sales. GateKeeper functions as an advanced reverse proxy
              positioned at the web traffic entry point, executing Layer 7 deep packet inspection, automated bot
              neutralization, and Layer 7 DDoS mitigation before malicious requests reach hosting server farms or
              backend customer applications. By obfuscating backend infrastructure and maximizing server farm tenant
              density, the solution enables hosting partners to reduce operational expenditures by up to 25% while
              packaging automated cybersecurity defenses into scalable recurring-revenue add-ons for millions of
              downstream small and medium-sized businesses (SMBs).
