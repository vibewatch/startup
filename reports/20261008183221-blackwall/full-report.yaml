    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological milestone progression of Blackwall from 2019 Tallinn founding through Series B institutional scaling
      and €1B implied valuation recognition in 2026.
    data:
      items:
        - label: '2019-06: Initial Founding'
          detail: >-
            Nikita Rozenberg and Denis Prochko establish BotGuard in Tallinn, Estonia, after Prochko's recipe website
            experiences persistent bot attacks.
          tone: neutral
        - label: '2020-10: First Financing Activity'
          detail: >-
            Company records initial external angel and pre-seed commitments to develop commercial web traffic filtering
            software.
          tone: positive
        - label: '2021-02: Institutional Seed Round'
          detail: >-
            BotGuard raises initial venture capital in a Seed round led by Tallinn-based Tera Ventures with
            participation from Firlej Kastory.
          tone: positive
        - label: '2024-03: Series A Expansion'
          detail: >-
            Secures Series A financing round led by Tera Ventures with participation from MMC Ventures to accelerate
            channel partnerships.
          tone: positive
        - label: '2025-03: €45M Series B & Rebranding'
          detail: >-
            Secures €45 million Series B led by Dawn Capital with MMC Ventures; rebrands corporate identity from
            BotGuard to Blackwall.
          tone: positive
        - label: '2025-03: Governance Expansion'
          detail: >-
            Formalizes Board of Directors with Norman Fiore (Dawn Capital) and appoints Hudson Rock CEO Roi Carthy as
            Executive Chairman.
          tone: positive
        - label: '2025-03: Channel Scale Milestone'
          detail: >-
            Surpasses 2.3 million protected websites and applications deployed across 100+ global hosting service
            provider partners.
          tone: positive
        - label: '2026-07: Workforce Expansion'
          detail: >-
            Grows international employee base from 65 at Series B close toward 100 personnel across European, US, and
            APAC operations.
          tone: positive
        - label: '2026-09: TopTech €1B Implied Valuation'
          detail: >-
            Prudentia and Siena Secondary Fund rank Blackwall 5th in TopTech 2026 with an implied €1.03B valuation,
            noting transactional confirmation is pending.
          tone: warning
        - label: '2026-10: Diligence Entity Disambiguation'
          detail: >-
            Auditors confirm strict corporate separation from ASX-listed property manager Blackwall Limited (ASX:BWF)
            following market ticker confusion.
          tone: neutral
