      - number: '4.2'
        title: Go-to-Market Economics, Unit Cost Drivers, and Operating Structure
        blocks:
          - type: paragraph
            body: >-
              The economic viability of Blackwall's model hinges on the efficiency of its channel-first go-to-market
              structure and distributed edge-processing cost profile. Operating through 100+ global service and hosting
              partners across more than 2.3 million active protected websites and applications, Blackwall leverages the
              partner's pre-existing billing and customer-relationship infrastructure. This structural leverage
              substantially compresses traditional customer acquisition costs (CAC) compared to direct enterprise
              cybersecurity vendors like Cloudflare, Akamai, or Imperva. However, sales engineering and partner
              onboarding cycles represent material upfront operational costs, requiring dedicated technical architects
              to integrate reverse-proxy clusters into proprietary hosting control panels and billing engines. On the
              delivery cost side, gross margin drivers are dictated by the architecture of GateKeeper's distributed
              server cluster, which comprises edge reverse proxies, detection engines, and centralized data warehouses.
              Traffic processing requires continuous compute for deep packet inspection and session behavioral analysis
              across L3–L7 protocols, TLS 1.3/HTTP/3 termination, and automated SSL lifecycle maintenance. While
              Blackwall offloads a portion of edge proxy footprint onto partner-managed environments, centralized threat
              intelligence correlation, machine learning behavioral modeling, and multi-region infrastructure introduce
              baseline hosting expenses. Personnel expenditures represent the primary cash outflow, with headcount
              expanding from 65 employees at Series B toward targeted team doubling across international hubs in Europe,
              the United States, and the Asia-Pacific region.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
