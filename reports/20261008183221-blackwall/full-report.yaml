      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Constrained Serviceable Capture'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market potential for Blackwall requires separating top-down industry estimates from
              bottom-up channel reality. Independent cybersecurity industry evaluations estimate the broader Web
              Application and API Protection (WAAP) and bot defense market at €18.2B globally by 2026, expanding at an
              estimated 16.5% CAGR. However, enterprise-oriented providers like Zscaler capture large enterprise IT
              seats through high-contract-value annual SaaS subscriptions, leaving mid-market and SMB websites
              underserved. Blackwall's Serviceable Available Market (SAM) is bounded by the global hosting and managed
              service provider ecosystem serving SMBs, sized at approximately €2.4B across European, North American, and
              Asia-Pacific hosting clusters. Blackwall's Serviceable Obtainable Market (SOM) represents the immediate
              channel capacity across partnered HSPs and MSPs, conservatively estimated at €145M based on current
              penetration across 100+ partner networks and 2.3M protected websites. While implied valuation multiples
              reached €1.03B in regional benchmark indices, independent secondary validation remains pending.
            claimRefs:
              - CM005
              - CM006
              - CM007
