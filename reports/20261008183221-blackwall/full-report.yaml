      - number: '1.2'
        title: Executive Leadership, Governance, and Board Architecture
        blocks:
          - type: paragraph
            body: >-
              Blackwall is led by co-founders Nikita Rozenberg (Chief Executive Officer) and Denis Prochko (Chief
              Technology Officer), who have driven executive strategy and core reverse-proxy architecture since the
              company's inception in 2019. Following its March 2025 Series B financing and rebranding from BotGuard, the
              company significantly formalized its corporate governance and international management team to support
              global expansion across North America and the Asia-Pacific region. Governance was reinforced with the
              appointment of Roi Carthy (Co-Founder and CEO of cyber intelligence firm Hudson Rock) as Executive
              Chairman of the Board of Directors, alongside Norman Fiore (Co-Founder and General Partner at lead
              investor Dawn Capital) as Director and Shamillah Bankiya (Principal at Dawn Capital) as Board Observer.
              Executive operations are supported by Chief Operating Officer Martin Pawliczek, Chief Financial and
              Security Officer Robin Sharpe, General Counsel Medeia Japaridze, Chief People Officer Maria Markopolou,
              Chief Experience Officer Robert Jacobi, Vice President of APAC Makoto Nishizawa, and VP of Sales &
              Business Development Francisco Carvalho. While technical architecture remains centered around founder
              Denis Prochko, governance oversight is heavily anchored by institutional investor representatives and
              experienced cybersecurity leadership.
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
