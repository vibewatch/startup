      - number: '5.3'
        title: Maturity and Differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity indicator is a company claim that GateKeeper protects more than 2.3 million
              websites and applications through more than 100 partners; the retained evidence does not provide a
              denominator, measurement method, active-deployment definition, or independent confirmation. Blackwall's
              clearest product distinction is its hosting-provider distribution and integration orientation, not a
              proven performance advantage. VentureRadar's BotGuard profile describes web-server extensions, CMS
              plugins, and hosting-panel plugins across Apache, NGINX, WordPress, cPanel, Plesk, and DirectAdmin, but
              that directory is descriptive market taxonomy rather than an independent benchmark. The public roadmap is
              also directional: Blackwall says it intends to invest in additional infrastructure and security products,
              without naming release dates, specifications, or acceptance criteria.
            claimRefs:
              - CE006
              - CE012
              - CE013
      - number: '5.4'
        title: Trust Controls and Evidence Limits
        blocks:
          - type: paragraph
            body: >-
              Blackwall discloses several product-level controls, including WAF, encrypted transport support, rate
              limiting, certificate automation, and filtering for L7 DDoS, brute-force, and automated bot traffic. Its
              documentation also exposes a support workflow for technical issues, bug reports, and feature suggestions,
              while the documentation team says it aims to assign remedial tasks for documentation feedback within five
              working days; this is not a five-day product-incident resolution commitment. The assigned evidence does
              not include independent efficacy tests, uptime or status history, security certification documents,
              incident reports, privacy and retention details, or public developer-repository activity. Two pool results
              further limit corroboration: one job aggregator is thin and template-padded, while an Arm article is an
              unrelated name collision involving an Aston Martin employee.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Provider-Level Distribution Is the Clearest Product Thesis
            body: >-
              GateKeeper is designed to sit in the hosting provider's traffic path, allowing security and traffic
              controls to be delivered across many hosted sites through one partner integration. That distribution
              thesis is supported by company product and deployment materials, although adoption quality and economics
              are not independently verified.
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
              - CE009
          - type: callout
            title: Technical Underwriting Still Requires Primary Operating Evidence
            body: >-
              The assigned pool does not establish detection accuracy, production latency, availability, incident
              history, data handling, external certifications, or roadmap execution. Diligence should obtain
              architecture diagrams, audit reports, status and incident exports, performance tests, API documentation,
              and representative PoC acceptance records.
            calloutType: risk
            claimRefs:
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Persona Alignment
        blocks:
          - type: paragraph
            body: >-
              Blackwall structures its customer acquisition around a two-tier B2B2C architecture rather than direct
              enterprise perimeter sales. The primary economic buyer is the infrastructure provider—encompassing Hosting
              Service Providers (HSPs), Managed Service Providers (MSPs), and multi-tenant eCommerce platform operators.
              For these hosting operators, Blackwall's GateKeeper reverse proxy serves as an upstream traffic command
              and operational margin protector, mitigating automated bot traffic and layer-7 denial-of-service
              volumetric spikes before synthetic requests reach core origin server clusters. The ultimate end-users, by
              contrast, are small and medium-sized businesses (SMBs) whose hosted web properties receive transparent bot
              mitigation, WAF rule filtering, and automated TLS certificate management without requiring per-domain DNS
              re-delegation. Secondary segments include independent web property administrators who deploy the
              standalone BotGuard web server plugin across Apache, Nginx, or major content management systems, as well
              as enterprise platform clients procured via value-added distributors such as Elcore.
            claimRefs:
              - CU001
