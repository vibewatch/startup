      - number: '6.4'
        title: Retention Durability, Expansion Dynamics, and Channel Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              The central durability risk in Blackwall's commercial engine stems from extreme channel dependency and
              structural opacity regarding net revenue retention (NRR) and gross revenue retention (GRR). By relying on
              fewer than 150 wholesale infrastructure partners to reach its 2.3 million endpoint install base, Blackwall
              faces substantial counterparty concentration: the churn of a single top-tier hosting partner or
              multi-cluster cloud provider could instantly eliminate tens of thousands of deployed domains from its
              active footprint. Furthermore, hosting providers often bundle GateKeeper as a baseline infrastructure
              utility rather than an itemized premium add-on, obscuring whether downstream SMB end-users place direct
              commercial value on the security service. While Blackwall offers a permanent free monitoring tier designed
              to convert prospective hosting networks and individual administrators via threat intelligence visibility,
              conversion rates, renewal intervals, and multi-year contract structures remain undisclosed, representing
              critical diligence items for institutional investors.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The B2B2C Channel Advantage: Operational Leverage with Wholesale Masking'
            body: >-
              Blackwall's choice to distribute GateKeeper primarily through hosting and managed service providers
              affords extraordinary operational distribution leverage, scaling past 2.3 million protected websites with
              a team of approximately 65 employees. However, this model introduces significant analytical opacity:
              end-user SMBs rarely select or pay Blackwall directly, meaning product retention is effectively tied to
              host-level master service agreements rather than end-user brand loyalty.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
          - type: callout
            title: Partner Concentration and Wholesale Disintermediation Exposure
            body: >-
              With more than 2.3 million protected websites distributed across only 100+ hosting and service partners,
              Blackwall's average account concentration exceeds 20,000 domains per partner. The defection of a major
              hosting conglomerate or internal development of competing open-source reverse proxies (such as CrowdSec or
              ModSecurity forks) represents a structural revenue and volume risk that cannot be easily mitigated through
              retail acquisition.
            calloutType: risk
            claimRefs:
              - CU001
              - CU008
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy and Investment Exposure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Blackwall requires dissecting vulnerabilities inherent to an infrastructure-layer cybersecurity
              provider expanding across global hosting ecosystems. The primary macro vulnerability centers on commercial
              channel concentration: Blackwall monetizes almost exclusively through Hosting Service Providers (HSPs),
              Managed Service Providers (MSPs), and eCommerce platforms rather than direct enterprise relationships.
              While this channel strategy allows efficient distribution to over 2.3 million websites across 100+ partner
              networks, it introduces intermediary gatekeeper friction where end-customer SMB retention depends entirely
              on hosting partner packaging and contract renewals. Concurrently, Blackwall carries material valuation
              overhang risk following its September 2026 implied valuation of €1.03 billion in the TopTech ranking by
              Prudentia and Siena Secondary Fund. This 368% year-over-year surge from €221 million is explicitly based
              on revenue multiples of listed peers rather than an executed priced round, creating downside risk if
              public cybersecurity multiples contract before an independent equity transaction closes. Mitigations
              require formal tracking of partner gross revenue retention and verifiable audit of ARR multiples.
            claimRefs:
              - CR001
