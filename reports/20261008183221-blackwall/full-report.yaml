          - type: callout
            title: Channel GTM Structural Operating Leverage
            body: >-
              By focusing on hosting and managed service providers rather than enterprise direct sales, Blackwall
              circumvents the standard multi-million dollar direct marketing and direct sales expenditures common among
              cybersecurity unicorns. With 65 team members scaling across 100+ channel partners and 2.3M+ protected
              websites, the company displays exceptional headcount efficiency. However, this structure shifts risk
              toward partner concentration, channel discount compression, and the inability to capture full downstream
