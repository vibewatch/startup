callouts:
  - calloutType: "risk"
    title: "Valuation Overhang and Market Comparables Risk"
    body: "The €1.03 billion valuation published in Estonia's TopTech 2026 ranking reflects an implied revenue multiple benchmarked against publicly listed cybersecurity peers rather than a negotiated equity transaction price. While Siena Secondary Fund highlights rapid revenue growth supporting this mark, private tech valuations face downside volatility if listed peer multiples contract before an independent equity round validates the valuation."
    claimRefs:
      - "CR004"
      - "CR005"
  - calloutType: "insight"
    title: "Channel-First Moat Versus Customer Ownership Dilemma"
    body: "Blackwall's strategy of embedding GateKeeper into hosting service providers delivers immediate scale across 2.3 million websites without heavy direct enterprise marketing costs. However, this model insulates Blackwall from the underlying SMB end-users, meaning commercial retention and pricing power remain tightly coupled to the hosting partner's bundling decisions and operational health."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
