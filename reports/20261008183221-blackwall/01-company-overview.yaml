chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in Tallinn, Estonia in 2019 as BotGuard and rebranded in March 2025 following a €45 million Series B round led by Dawn Capital, Blackwall provides reverse-proxy web security and bot mitigation infrastructure (GateKeeper) to hosting service providers, managed service providers, and web platforms protecting over 2.3 million websites globally. In September 2026, independent Estonian M&A research by Prudentia and Siena Secondary Fund benchmarked Blackwall at an implied €1.03 billion valuation based on high peer multiples and strong revenue growth, although private financing benchmarks remain distinct from transactional equity valuations."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Origins, and Core Business Model"
    body: "Blackwall (formerly BotGuard OÜ) is a cybersecurity infrastructure and traffic filtering provider founded in Tallinn, Estonia in 2019 by Nikita Rozenberg and Denis Prochko. The company originated when Prochko built a small hobby website for sharing vegetable recipes that experienced persistent automated bot attacks, prompting the co-founders to engineer purpose-built mitigation infrastructure. Blackwall operates an infrastructure-layer B2B model delivering its flagship GateKeeper solution primarily through channel partnerships with Hosting Service Providers (HSPs), Managed Service Providers (MSPs), and eCommerce platforms rather than direct enterprise sales. GateKeeper functions as an advanced reverse proxy positioned at the web traffic entry point, executing Layer 7 deep packet inspection, automated bot neutralization, and Layer 7 DDoS mitigation before malicious requests reach hosting server farms or backend customer applications. By obfuscating backend infrastructure and maximizing server farm tenant density, the solution enables hosting partners to reduce operational expenditures by up to 25% while packaging automated cybersecurity defenses into scalable recurring-revenue add-ons for millions of downstream small and medium-sized businesses (SMBs)."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "executive-leadership-governance"
    title: "Executive Leadership, Governance, and Board Architecture"
    body: "Blackwall is led by co-founders Nikita Rozenberg (Chief Executive Officer) and Denis Prochko (Chief Technology Officer), who have driven executive strategy and core reverse-proxy architecture since the company's inception in 2019. Following its March 2025 Series B financing and rebranding from BotGuard, the company significantly formalized its corporate governance and international management team to support global expansion across North America and the Asia-Pacific region. Governance was reinforced with the appointment of Roi Carthy (Co-Founder and CEO of cyber intelligence firm Hudson Rock) as Executive Chairman of the Board of Directors, alongside Norman Fiore (Co-Founder and General Partner at lead investor Dawn Capital) as Director and Shamillah Bankiya (Principal at Dawn Capital) as Board Observer. Executive operations are supported by Chief Operating Officer Martin Pawliczek, Chief Financial and Security Officer Robin Sharpe, General Counsel Medeia Japaridze, Chief People Officer Maria Markopolou, Chief Experience Officer Robert Jacobi, Vice President of APAC Makoto Nishizawa, and VP of Sales & Business Development Francisco Carvalho. While technical architecture remains centered around founder Denis Prochko, governance oversight is heavily anchored by institutional investor representatives and experienced cybersecurity leadership."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-valuation-scale"
    title: "Capitalization History, Implied Valuation, and Scale Trajectory"
    body: "Blackwall has raised cumulative institutional equity funding reported between $49.0 million and $62.7 million across four funding rounds since October 2020. The company raised an initial Seed round in February 2021 led by Tera Ventures with participation from Firlej Kastory, followed by a Series A round in March 2024 backed by Tera Ventures and MMC Ventures. In March 2025, Blackwall completed a milestone €45 million ($49.0M USD equivalent) Series B financing led by Dawn Capital with continued participation from MMC Ventures, concurrently rebranding from BotGuard to Blackwall. At the time of the Series B round, the company employed 65 team members globally, managed over 100 hosting partnerships, and protected more than 2.3 million active websites and web applications, with workforce expansion reaching approximately 100 employees by mid-2026. In September 2026, the independent TopTech 2026 ranking published by Prudentia Tallinn and Siena Secondary Fund recognized Blackwall as Estonia's fifth most valuable tech firm with an implied valuation of €1.03 billion ($1.13B), up 368% from €221 million in 2025. Diligence must emphasize that this €1.03 billion valuation represents an analyst-derived implied multiple based on cybersecurity public peers and revenue growth rather than an audited transaction price or closed funding round."
