callouts:
  - calloutType: "insight"
    title: "Channel-First Distribution Unlocks Favorable Unit Economics"
    body: "Unlike traditional enterprise bot management vendors who face protracted direct enterprise sales cycles and heavy professional service burdens, Blackwall's integration directly into hosting control planes (cPanel, DirectAdmin, Plesk, and custom HSP billing modules) creates an efficient wholesale distribution channel. Hosting providers bundle GateKeeper as a managed security feature, protecting over 2.3 million websites while reducing hosting farm operational expenditures by up to 25%."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
  - calloutType: "risk"
    title: "Distinguishing Implied Research Multiples from Transactional Equity"
    body: "While TopTech 2026 credited Blackwall with a €1.03 billion valuation (a 368% jump from €221 million in 2025), Siena Secondary Fund explicitly noted that this figure is an implied multiple derived from listed cybersecurity comparables and revenue trajectory rather than an arm's-length priced equity transaction. Investors must not treat this media milestone as a verified equity valuation baseline until confirmed by an independent priced financing round."
    claimRefs:
      - "CO013"
      - "CO014"
