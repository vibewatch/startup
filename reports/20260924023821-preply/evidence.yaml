evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-table
    missingEvidence: Full public board / leadership coverage beyond the handful of executives on the about page
    whyItMatters: The leadership table is intentionally only partial and should not be read as a full governance map.
    diligencePath: Obtain a board deck or governance summary with current directors and observers.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: investor-map
    missingEvidence: A complete cap table and preference stack for current and prior investors
    whyItMatters: The simplified investor map is only a public-stakeholder snapshot.
    diligencePath: Request a cap table or financing memo.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: private-financials
    missingEvidence: Audited 2024-2025 revenue, gross margin, CAC/payback, and customer concentration
    whyItMatters: These drive the downstream financial and valuation chapters.
    diligencePath: Obtain management accounts, investor deck, or audited filings.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: market-share
    missingEvidence: A public study that isolates Preply’s SAM/SOM or market share by segment
    whyItMatters: It would let us quantify the exact size of the reachable market.
    diligencePath: Pull analyst data or management material with segment sizing.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: multi-homing
    missingEvidence: A public dataset showing how often tutors and learners multi-home across language platforms
    whyItMatters: It would quantify how durable the moat really is.
    diligencePath: Use customer interviews or marketplace analytics.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: Audited 2024-2025 income statement, balance sheet, and cash-flow detail
    whyItMatters: It would let us estimate gross margin, burn, runway, and capital adequacy properly.
    diligencePath: Request management accounts or audited statements.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: minor
    topic: architecture-diagram
    missingEvidence: A public architecture diagram or API reference for the marketplace and co-pilot stack
    whyItMatters: It would reduce uncertainty around dependencies and reliability.
    diligencePath: Request a technical diligence session or internal architecture memo.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Public NRR/GRR, cohort retention, and concentration metrics
    whyItMatters: They would show whether customer value compounds or decays over time.
    diligencePath: Request cohort tables or investor materials.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: incidents
    missingEvidence: A formal incident postmortem or regulator filing for the status-page outages
    whyItMatters: It would distinguish routine maintenance from true service reliability problems.
    diligencePath: Ask for incident logs or customer communications.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Audited revenue, margin, and retention evidence that can test the 24x estimate
    whyItMatters: Without it the valuation range is only directional.
    diligencePath: Obtain management pack or audited financials.
    relatedQuestionRefs:
      - QV008
