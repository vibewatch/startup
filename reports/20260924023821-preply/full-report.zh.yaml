  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界界定与替代方案
        blocks:
          - type: paragraph
            body: >-
              Preply 属于广义语言学习市场中的家教平台，不是纯 SaaS 应用。买方可能是学员、雇主或导师；替代选择则有自学 App、传统语言学校和非正式语言交流。提出任何 TAM
              规模主张前，必须先说清市场边界。个人和企业购买的是不同服务，但都依托导师供给，目标都是提升语言学习成效。
