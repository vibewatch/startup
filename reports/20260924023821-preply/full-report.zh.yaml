              销售都要同时推进，因此管理梯队很重要。尚待厘清的是，执行能力有多少仍依赖创始人，又有多少已沉淀在现任管理团队。多元业务让 Preply 比单一功能 App 更有韧性，也增加了执行和治理难度。
