            body: >-
              公开市场测算的口径差异很大。Preply 引用 $115B 的全球市场规模，并称 D2C 市场到 2035 年可达 $227B；LingoBright 给出的口径更窄，估算 2026 年在线语言学习市场为
              $24.39B。市场规模足以支撑一家达到风险投资规模的平台，但边界不同，测算结果就可能相差一个数量级。它们反映的是不同统计口径，不必视为相互矛盾；只要纳入规则清楚，狭义在线学习和广义 D2C 口径都有参考价值。
