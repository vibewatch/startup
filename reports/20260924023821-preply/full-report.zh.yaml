        title: 采纳成效与落地实证
        blocks:
          - type: paragraph
            body: >-
              最有力的公开证据来自 Preply Business 客户评价，以及 2026 年 1 月融资公告引用的 LeanLab
              效率研究。这些材料显示产品可能改善学习结果和工作表现，比单纯展示客户标识更有说服力。Spaulding Ridge 案例则称，Preply
              在业务扩张时用数据工具提升内部决策能力。证据来自客户评价、合作伙伴案例和公司公告，但并非审计数据，更多只能说明客户看到了价值，无法证明这种价值能维持多轮续约。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: 导师端体验与复购行为
        blocks:
          - type: paragraph
            body: >-
              TEFL Academy
              的导师文章提供了另一面：平台既有吸引力，也有让导师不满之处。导师看重排课灵活，但在意抽成和无偿试听课。评估满意度时，既要看学员学习成效，也要看导师收入；供给健康，平台流动性才有保障。这些抱怨尚不致命，但若公司在抽成、试听课经济或平台规则上过于强势，可能演变为留存问题。
            claimRefs:
              - CU005
              - CU010
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: 仍待穿透的核心盲区
        blocks:
          - type: paragraph
            body: >-
              Preply 的公开材料能证明市场需求和产品价值，却不足以评估客户集中度、留存或复购。公司没有公开 NRR、GRR
              或客户集中度明细。本报告将其列为尽调缺口，不从客户评价或员工反馈中臆测。缺少数据不等于业务出了问题，只说明这是一家非上市公司。投资人应把集中度、流失和复购列为待补齐的承保数据，而不是从零散证言推断。
            claimRefs:
              - CU009
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律合规与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              最具体的风险写在服务条款和隐私政策里：Preply 采用仲裁，可暂停服务，在部分司法辖区限制服务，并处理大量个人、导师及 AI 相关数据。随着产品更多使用 AI
              辅助学习，隐私和治理会持续成为尽调重点。风险不只在某一条款，而在仲裁、服务限制和广泛数据处理叠加后，可能让用户维权更难；若监管者或客户认为披露过于激进，也可能妨碍后续 AI 产品拓展。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR012
      - number: '7.2'
        title: 运营履约与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              公开状态页和 TechCrunch 报道显示，系统可用性和战时运营确实会影响业务。Preply 团队分布在多个地点，可借助不同办公中心分散风险；但 Kyiv
              的运营仍受停电和地区局势影响。分布式团队与状态监控能缓冲部分冲击，却不能消除运营风险，突发中断可能很快损害学员信任。全球授课平台经不起频繁故障或长期区域性中断。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
      - number: '7.3'
        title: 市场环境与合作方风险
        blocks:
          - type: paragraph
            body: >-
              平台依赖第三方支付、导师供给和用户信任，本身就有市场风险。抽成过高可能引发导师不满；BBB
              等投诉渠道也说明服务体验和客户支持很重要。这不是致命问题，但平台必须同时照顾供需两端。若导师不满佣金、用户不断遇到服务摩擦，流动性可能先于收入下滑而恶化。因此，投诉和导师反馈比单看 NPS 更值得关注。
            claimRefs:
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 核心投资逻辑证伪条件
        blocks:
          - type: paragraph
            body: >-
              若增长放缓、利润率不再改善，或隐私和可靠性问题削弱公众信任，投资逻辑就会动摇。乐观情景依赖导师供给稳定、平台能扛住冲击，并靠企业业务扩张抵消个人客户流失。真正的否决信号不是单一诉讼，而是运营或信任问题反复出现。一次事故或可补救；持续的信任问题、收入增速放缓或结构性合规阻力，则足以改变投资判断。
            claimRefs:
              - CR007
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Preply 所处市场广阔，产品结合真人教学与 AI，且已呈现 EBITDA 转正势头；B2B
              业务也提供了个人家教之外的扩张路径。这些因素让公司具备创造风险投资级回报的可能，但只有当增长转化为可衡量且持久的经济效益时，投资逻辑才真正成立。估值需要经营杠杆支撑，不能只靠市场规模或增长叙事。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: 反向逻辑
        blocks:
          - type: paragraph
            body: >-
              反向逻辑是：公开证据还不足以支持精确承保。收入只有间接估算，利润率没有披露；若公司提高抽成，导师供给可能承压。在自学工具和 AI 足以替代部分需求的市场，这些风险不可忽视。若 Preply
              只是表现不错而非出色，溢价估值就可能迅速回落，因为太多关键经营数据仍未证实。
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
      - number: '8.3'
        title: 可比对标与投资纪律
        blocks:
          - type: paragraph
            body: >-
              可比证据更像是在指向一家估值偏高的后期私营平台，而非便宜标的。与其拿纯软件公司作比较，不如把 Preply 看作经济性优于纯
              App、但仍需证明利润率扩张的优质平台。在获得更强的收入证据前，建议维持观察或继续研究。由于 Preply 兼具教育科技、平台和软件特征，合适的对标公司并不明确；这也是承保时保持谨慎的理由。
            claimRefs:
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
      - number: '8.4'
        title: 最终尽调诉求与退出逻辑
        blocks:
          - type: paragraph
            body: >-
              下一步应核实收入、毛利率、留存和客户集中度。若数据能支撑当前估值，Preply 仍可能成为具备 IPO
              选择权的后期成长资产；若不能，即使产品和品牌依然强，估值也显得偏高。应以真实经营数据检验估值：指标若经得住检验，可考虑更积极的投资立场；否则，当前估值更像是对未来的期待，而非已有数据的支撑。
            claimRefs:
              - CV012
