        title: 需求驱动力与渗透阻力
        blocks:
          - type: paragraph
            body: >-
              跨境工作、移民和个性化教学需求，是最明确的需求驱动力。Preply
              的数据和分析文章显示，公司用实验和数据管道优化学习流程；平台要运转，供需两端都得活跃。阻力也很实际：导师佣金、信任问题，以及更便宜的自学替代品。用户买单不是因为新鲜感，而是看重个性化、灵活排课和跨国沟通；若导师收益受挤压或产品价值下降，供给和需求都可能转向别处。
