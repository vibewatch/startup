    - Fees and unpaid trials
    - Affects supply health
  - - Careers page
    - Strong employee pride
    - Not a customer metric
    - Useful proxy only
  - - Public complaints
    - Support and trust monitoring
    - Complaint surface exists
    - Warns about friction
  claimRefs:
  - CU005
  - CU009
  - CU011
  - CU012
  notes: The supply side is part of customer health because tutor satisfaction directly affects learner availability.
