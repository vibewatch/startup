company:
  name: Preply
chapter:
  number: 6
  title: Customers
  summary: Show who buys and uses Preply, what public proof exists for adoption, and where retention and concentration remain
    opaque.
sections:
- id: su-seg
  title: Segments and use cases
  body: 'Preply serves at least three customer groups: learners, enterprise buyers, and tutors. The consumer side buys lessons;
    the enterprise side buys language training; the tutor side supplies the marketplace. That matters because the economics,
    retention, and value proposition differ materially by segment. The segmentation matters because each side has a different
    willingness to pay and a different reason to leave. That means customer diligence has to separate learner retention from
    enterprise renewal and tutor supply health rather than treating the business as one generic funnel. The segmentation matters
    because each side has a different willingness to pay and a different reason to leave. That means customer diligence has
    to separate learner retention from enterprise renewal and tutor supply health rather than treating the business as one
    generic funnel.'
  claimRefs:
  - CU001
  - CU010
  - CU012
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: su-proof
  title: Proof of adoption and outcomes
  body: 'The best public proof comes from Preply Business testimonials and the LeanLab efficiency study cited in the January
    2026 funding release. Together they say the product can improve learner outcomes and work performance, which is much stronger
    than a generic logo wall. The Spaulding Ridge case study adds a more operational story: the company itself used data tooling
    to scale its internal decision-making while its business expanded. The public outcomes are useful because they come from
    a mix of testimonials, partner validation, and company announcements. Still, they are directional rather than audited,
    so they tell us that customers see value but not how much of that value is sticky over multiple renewals. The public outcomes
    are useful because they come from a mix of testimonials, partner validation, and company announcements. Still, they are
    directional rather than audited, so they tell us that customers see value but not how much of that value is sticky over
    multiple renewals.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU007
  - CU008
  tableRefs:
  - TU002
- id: su-supply
  title: Tutor experience and repeat usage
  body: 'The TEFL Academy tutor article is a useful counterweight because it shows the tutor side can be attractive and frustrating
    at the same time. Tutors like the flexibility, but fee structure and unpaid trial lessons are clear pain points. That
    means customer satisfaction should be thought about in two directions: learner outcomes on one side and tutor economics
    on the other. Tutor sentiment is important because marketplace liquidity is only durable if supply remains healthy. The
    complaints here are not existential, but they do warn that take-rate, trial economics, and platform rules can turn into
    a real retention problem if management pushes too aggressively. Tutor sentiment is important because marketplace liquidity
    is only durable if supply remains healthy. The complaints here are not existential, but they do warn that take-rate, trial
    economics, and platform rules can turn into a real retention problem if management pushes too aggressively.'
  claimRefs:
  - CU005
  - CU010
  - CU012
  tableRefs:
  - TU003
- id: su-gap
  title: What remains opaque
  body: Preply has enough public proof to show demand and value, but not enough to fully underwrite concentration, retention,
    or repeat usage. There is no public NRR, GRR, or customer concentration schedule. The report therefore keeps those items
    as explicit diligence gaps rather than inferring them from testimonials or employee sentiment. The gap is not evidence
    of a broken business; it is evidence of a private one. Investors should therefore treat concentration, churn, and repeat
    usage as missing underwriting inputs, not as facts to be guessed from testimonials. The gap is not evidence of a broken
    business; it is evidence of a private one. Investors should therefore treat concentration, churn, and repeat usage as
    missing underwriting inputs, not as facts to be guessed from testimonials.
  claimRefs:
  - CU009
  - CU011
  - CU012
  tableRefs: []
