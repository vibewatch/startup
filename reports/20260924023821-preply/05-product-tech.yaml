chapter:
  number: 5
  title: Product & Technology
  summary: Explain the core product workflow, the technical evidence behind the platform, and the trust/compliance systems
    that make the marketplace viable at scale.
sections:
- id: se-product
  title: Product definition
  body: Preply’s product is easiest to understand as a marketplace that supports live lessons rather than as a pure content
    app. The AI layer is real, but it sits on top of tutor-led instruction rather than replacing it. That distinction matters
    because it shapes both customer trust and the economics of the product. The public product story is therefore a live-learning
    workflow with matching, scheduling, tutoring, payments, and post-lesson support all tied together. That workflow matters
    because it is the economic unit of the marketplace, not just the user interface.
  claimRefs:
  - CE001
  - CE002
  - CE008
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: se-tech-proof
  title: Technical proof and data culture
  body: 'The strongest technical evidence is not a traditional architecture blog; it is the public design-system repository,
    the data-public repo, and the Amplitude case study. Together they show a company that ships product infrastructure, uses
    data to run experiments, and exposes some of its learning infrastructure to the outside world. That is enough to conclude
    the product is operationally mature, even if the exact stack remains private. The engineering signal is stronger when
    you look at multiple proof points together: a public visual-coverage repo, a public data repo, and external evidence that
    the company invests in analytics tooling and experimentation. Those are weaker than an architecture deck, but they are
    real and consistent.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE009
  tableRefs:
  - TE002
- id: se-trust
  title: Trust, privacy, and compliance
  body: 'The privacy policy is unusually informative: it explicitly mentions AI-powered recommendations, tutor verification,
    biometrics, DAC7, and business reporting. Those disclosures are valuable because they show the company has to manage not
    just UX but also data governance, fraud, and international compliance. In other words, product maturity here is tied directly
    to trust controls. The legal surface is not just boilerplate. The privacy policy exposes how the company handles AI recommendations,
    verification, biometrics, reporting, and user content, which means engineering choices are tied to compliance choices.
    That raises the bar for any product roadmap that adds more automation.'
  claimRefs:
  - CE006
  - CE007
  - CE012
  tableRefs:
  - TE003
- id: se-gap
  title: What is still opaque
  body: 'What is not public is the cleanest product architecture diagram, API surface, or release roadmap. The company clearly
    has enough engineering maturity to support global learning and B2B analytics, but investors still have to infer a lot
    of the stack from source code and marketing pages. That is normal for a private marketplace, but it leaves diligence questions
    around uptime, dependencies, and roadmap sequencing. The remaining opacity is exactly where diligence should stay disciplined:
    architecture, dependency mapping, incident handling, and release governance. The absence of a public diagram is not a
    failure, but it does mean the investment case depends partly on trust in the company’s internal controls and execution.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  tableRefs: []
