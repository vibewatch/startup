      - number: '3.3'
        title: Differentiation and moat
        blocks:
          - type: paragraph
            body: >-
              Preply’s strongest claim is that it combines a human tutor marketplace with AI-supported personalization
              and progress tracking. TechCrunch and Fortune both describe the product as human-guided rather than
              AI-only, which is a sensible positioning against commoditization pressure. The downside is that the buyer
              can compare alternatives quickly, so differentiation has to show up in learner outcomes and tutor
              retention rather than marketing language. The product narrative still leans on the combination of human
              tutors and AI support, but that advantage is only durable if users keep perceiving better outcomes rather
              than just more features.
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Where the moat is still uncertain
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not show a regulatory moat or a sticky enterprise lock-in model. Preply may have
              brand and supply depth, but the category is easy to multi-home, and the same AI tools that support the
              product also lower switching friction across the market. The report therefore treats moat durability as a
              live diligence question rather than a settled conclusion. Because users and tutors can multi-home, the
              moat is likely to be brand, supply depth, and workflow convenience rather than hard lock-in. That keeps
              the competitive question open.
            claimRefs:
              - CP009
              - CP011
