    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product
        blocks:
          - type: paragraph
            body: >-
              Preply is positioned as a human-led, AI-enabled language-learning marketplace rather than a traditional
              school or pure self-study app. The company’s official materials emphasize personalized one-on-one lessons,
              a global tutor supply, and a B2B layer through Preply Business. That framing is stable across the company
              website, careers page, and 2026 funding announcement, so the key question for diligence is not what the
              company sells but how much durable economic value it captures from the marketplace. It also suggests the
              company can monetize across consumer and employer channels without changing the core lesson experience.
