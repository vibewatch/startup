      - number: '2.2'
        title: Sizing lenses and public estimates
        blocks:
          - type: paragraph
            body: >-
              The public sizing story is intentionally messy. Preply itself cites a $115B global market and a $227B
              direct-to-consumer market by 2035, while LingoBright gives a much smaller but more concrete
              online-language-learning estimate of $24.39B in 2026. The right takeaway is that the market is large
              enough to support a venture-scale marketplace, but the exact boundary changes the number by an order of
              magnitude. That means each sizing lens should be read as a boundary choice, not a contradiction. A narrow
              online-learning lens and a broader direct-to-consumer lens can both be valid if the underlying inclusion
              rules are clear.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.3'
        title: Demand drivers and adoption frictions
        blocks:
          - type: paragraph
            body: >-
              Cross-border work, migration, and the need for personalized instruction are the clearest demand drivers.
              The company’s own data and analytics posts show that it optimizes the learner journey with experimentation
              and data pipelines, which matters because a marketplace needs both supply and demand to stay active.
              Frictions remain real: tutor commissions, trust, and the ease of switching to cheaper self-study
              substitutes. The main adoption driver is not raw novelty but the practical value of personalization,
              scheduling, and global communication. The main frictions are tutor economics and the fact that many users
              can fall back to self-study substitutes if the value proposition weakens.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: What is still unproven
        blocks:
          - type: paragraph
            body: >-
              Preply does not publicly isolate its SAM, SOM, or the split between consumer and enterprise revenue. The
              report therefore treats the market opportunity as credible and large, but not fully bounded. That
              uncertainty is one of the main reasons the valuation chapter remains conservative rather than assuming
              every market estimate converts into addressable share. Because Preply does not publicly isolate its share
              by segment, the report treats the market opportunity as credible but not precisely sized. That keeps the
              valuation discussion disciplined and avoids pretending the public market estimate is more exact than it
              really is.
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape
        blocks:
          - type: paragraph
            body: >-
              Preply competes most directly with other language-learning marketplaces, especially italki, and more
              broadly with self-study apps and informal language practice. The important distinction is that Preply
              sells live human instruction with a marketplace layer, whereas the strongest substitutes sell subscription
              learning or cheaper community tutoring. That difference matters because buyer comparisons are mostly about
              price, convenience, and learning style rather than feature parity. The competitive set is not just one
              marketplace versus another; it is a continuum from live tutoring to self-study and AI-assisted practice,
              which makes pricing and convenience the real battleground.
            claimRefs:
