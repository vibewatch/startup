      - number: '3.2'
        title: Pricing and supply economics
        blocks:
          - type: paragraph
            body: >-
              The cleanest public pricing comparison is with italki: LingoBright says italki charges a flat 15%
              commission while Preply starts at 33% and slides to 18%. The TEFL Academy tutor article reinforces that
              tutors care about flexibility and can be sensitive to fee structure and trial lessons. That makes tutor
              supply a competitive variable, not just a by-product of demand. In a category this legible, tutor
              economics are part of the competition. Lower commissions can attract supply, but they can also narrow
              monetization if the platform cannot offset that with volume or enterprise sales.
            claimRefs:
              - CP003
