  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Preply is best understood as a tutoring marketplace inside the broader language-learning market, not as a
              pure SaaS app. The buyer can be a learner, an employer, or a tutor, and the main substitutes are
              self-study apps, traditional schools, and informal language exchange. That is why the market needs a
              boundary statement before any TAM claim. The fact that buyers can be consumers or employers means the
              market is not just one spend line; it is a family of adjacent use cases that share tutoring labor and
              language outcomes.
            claimRefs:
              - CM001
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM012
