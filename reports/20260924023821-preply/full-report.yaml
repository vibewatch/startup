      - number: '7.1'
        title: Legal and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The most concrete risks are in the terms and privacy policy. Preply uses arbitration, can suspend
              services, restricts service in certain jurisdictions, and processes a broad set of personal, tutor, and
              AI-related data. That makes privacy and governance an ongoing diligence issue, especially if product usage
              expands deeper into AI-assisted learning. The key issue is not one clause in isolation but the combination
              of arbitration, service restrictions, and broad data processing. That combo matters because it can
              complicate both user redress and future AI-product expansion if regulators or customers decide the
              disclosures are too aggressive. The key issue is not one clause in isolation but the combination of
              arbitration, service restrictions, and broad data processing. That combo matters because it can complicate
