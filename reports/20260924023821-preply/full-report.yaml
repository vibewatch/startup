      - - Revenue quality
        - Determines multiple support
        - Indirectly estimated
        - Audited revenue and margin
      - - Retention / cohort behavior
        - Shows whether value compounds
        - Not public
        - Cohort or NRR data
      - - Customer concentration
        - Reveals single-tenant risk
        - Not public
        - Top-customer schedule
      - - Tutor economics
        - Affects marketplace liquidity
        - Mixed public signals
        - Take-rate and supply data
    claimRefs:
      - CV005
      - CV007
      - CV010
      - CV012
