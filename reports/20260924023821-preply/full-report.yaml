      - number: '7.2'
        title: Operational and geopolitical risk
        blocks:
          - type: paragraph
            body: >-
              The status page and TechCrunch coverage show that uptime and wartime logistics are real operational
              variables. Preply has a distributed footprint and can use multiple hubs as a hedge, but the Kyiv operation
              remains exposed to power outages and broader regional risk. That makes operational resilience a real, not
              theoretical, part of the investment case. In practice, these risks are partly hedged by distributed teams
              and public status monitoring, but the company still has exposure to operational shocks that can affect
              learner trust quickly. A marketplace that runs lessons globally cannot afford frequent outages or
              prolonged regional disruption.
            claimRefs:
              - CR004
              - CR005
              - CR006
