      - number: '7.3'
        title: Market and partner risk
        blocks:
          - type: paragraph
            body: >-
              The marketplace model itself creates risk because it depends on third-party payments, tutor supply, and
              user trust. Tutor economics can become contentious if commissions feel too high, and complaint surfaces
              like BBB indicate that user experience and support matter. This is not a fatal problem, but it does mean
              the company has to keep the marketplace healthy on both sides. Marketplace risk is subtle because it can
              erode gradually: if tutors dislike commission structure or users complain about service friction,
              liquidity thins before revenue does. That is why complaint surfaces and tutor feedback deserve more
              attention than a simple NPS-style vanity metric.
            claimRefs:
              - CR008
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: What would break the thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is most vulnerable if growth slows, margins stop improving, or public trust weakens because of
              privacy or reliability issues. The upside case relies on a resilient marketplace with durable tutor supply
              and enough enterprise expansion to offset consumer churn. So the kill criteria are less about one lawsuit
              and more about a cluster of recurring operational or trust failures. The thesis break is therefore
              cumulative. A single incident is manageable; repeated trust issues, a slowing top line, or structural
              compliance friction would be enough to change the investment view.
            claimRefs:
              - CR007
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis
        blocks:
          - type: paragraph
            body: >-
              Preply is attractive because it sits in a large market, has a recognizably differentiated human-plus-AI
              product, and now shows EBITDA-positive momentum. The company also appears to have a real B2B expansion
              path, which makes it more than a consumer tutoring app. Those are all legitimate reasons the business can
              support venture-scale value creation. The thesis only becomes compelling if the public growth story
              translates into measurable, durable economics. In other words, the valuation is justified by operating
              leverage, not just by category size or narrative momentum.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is that the current public evidence still does not support precise underwriting. Revenue
              is only indirectly estimated, margins are not public, and tutor economics can create friction if the
              company pushes too hard on take-rate. In a category that can be partially commoditized by self-study and
              AI, those are not trivial concerns. The anti-thesis is strongest when you ask what happens if the company
              is merely good instead of great. In that case, a premium mark can compress quickly because the public
              evidence still leaves too many private inputs unproven.
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
      - number: '8.3'
        title: Comps and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Comparable evidence points to a late-stage private marketplace with a premium valuation rather than a
              cheap one. The right way to think about the entry is not as a bargain relative to software but as a
              quality marketplace with better economics than a pure app, yet still demanding enough to require proof of
              margin expansion. That puts the decision in the track/research-more bucket unless diligence surfaces
              stronger revenue evidence. Comparable evidence suggests the company sits in a premium private-growth
              bucket, but the right comparison set is not obvious because it mixes edtech, marketplace, and software
              characteristics. That ambiguity itself is a reason to keep the underwriting conservative.
            claimRefs:
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
      - number: '8.4'
        title: Final diligence and exit logic
        blocks:
          - type: paragraph
            body: >-
              The next diligence ask is straightforward: confirm revenue, gross margin, retention, and customer
              concentration. If those items support the current mark, the company could remain a credible late-stage
              growth asset with IPO optionality. If they do not, the valuation will look stretched even if the product
              and brand remain strong. The most useful next step is to test the mark against real revenue, margin, and
              retention data. If those numbers hold up, the company deserves a more positive entry stance; if they do
              not, the current valuation is best treated as aspirational rather than supported.
            claimRefs:
              - CV012
