          - type: paragraph
            body: >-
              The largest missing items are audited revenue, gross margin, customer concentration, CAC/payback, and the
              exact split between consumer and B2B. Multiples’ $50M estimate is useful as a directional anchor, but it
              is still only an estimate. Until management discloses more, the financial story remains one of growth and
              improving efficiency rather than fully underwritten economics. Until audited statements appear, the best
