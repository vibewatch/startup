  name: Preply
chapter:
  number: 2
  title: Market Analysis
  summary: Define the market boundary, demand drivers, buyer segments, and adoption constraints that matter for Preply’s long-term
    growth and pricing power.
sections:
- id: sm-boundary
  title: Boundary and substitutes
  body: Preply is best understood as a tutoring marketplace inside the broader language-learning market, not as a pure SaaS
    app. The buyer can be a learner, an employer, or a tutor, and the main substitutes are self-study apps, traditional schools,
    and informal language exchange. That is why the market needs a boundary statement before any TAM claim. The fact that
    buyers can be consumers or employers means the market is not just one spend line; it is a family of adjacent use cases
    that share tutoring labor and language outcomes.
  claimRefs:
  - CM001
  - CM005
  - CM009
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sm-size
  title: Sizing lenses and public estimates
  body: The public sizing story is intentionally messy. Preply itself cites a $115B global market and a $227B direct-to-consumer
    market by 2035, while LingoBright gives a much smaller but more concrete online-language-learning estimate of $24.39B
    in 2026. The right takeaway is that the market is large enough to support a venture-scale marketplace, but the exact boundary
    changes the number by an order of magnitude. That means each sizing lens should be read as a boundary choice, not a contradiction.
    A narrow online-learning lens and a broader direct-to-consumer lens can both be valid if the underlying inclusion rules
    are clear.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM002
- id: sm-drivers
  title: Demand drivers and adoption frictions
  body: 'Cross-border work, migration, and the need for personalized instruction are the clearest demand drivers. The company’s
    own data and analytics posts show that it optimizes the learner journey with experimentation and data pipelines, which
    matters because a marketplace needs both supply and demand to stay active. Frictions remain real: tutor commissions, trust,
    and the ease of switching to cheaper self-study substitutes. The main adoption driver is not raw novelty but the practical
    value of personalization, scheduling, and global communication. The main frictions are tutor economics and the fact that
    many users can fall back to self-study substitutes if the value proposition weakens.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM012
  tableRefs:
  - TM003
- id: sm-gap
  title: What is still unproven
  body: Preply does not publicly isolate its SAM, SOM, or the split between consumer and enterprise revenue. The report therefore
    treats the market opportunity as credible and large, but not fully bounded. That uncertainty is one of the main reasons
    the valuation chapter remains conservative rather than assuming every market estimate converts into addressable share.
    Because Preply does not publicly isolate its share by segment, the report treats the market opportunity as credible but
    not precisely sized. That keeps the valuation discussion disciplined and avoids pretending the public market estimate
    is more exact than it really is.
  claimRefs:
  - CM010
  - CM011
  tableRefs: []
