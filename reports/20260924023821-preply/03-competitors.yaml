company:
  name: Preply
chapter:
  number: 3
  title: Competitors
  summary: Compare Preply with direct marketplaces and substitutes, emphasizing pricing, supply economics, and whether human-led
    tutoring remains defensible against AI-assisted alternatives.
sections:
- id: sp-landscape
  title: Landscape
  body: Preply competes most directly with other language-learning marketplaces, especially italki, and more broadly with
    self-study apps and informal language practice. The important distinction is that Preply sells live human instruction
    with a marketplace layer, whereas the strongest substitutes sell subscription learning or cheaper community tutoring.
    That difference matters because buyer comparisons are mostly about price, convenience, and learning style rather than
    feature parity. The competitive set is not just one marketplace versus another; it is a continuum from live tutoring to
    self-study and AI-assisted practice, which makes pricing and convenience the real battleground.
  claimRefs:
  - CP001
  - CP002
  - CP004
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: sp-pricing
  title: Pricing and supply economics
  body: 'The cleanest public pricing comparison is with italki: LingoBright says italki charges a flat 15% commission while
    Preply starts at 33% and slides to 18%. The TEFL Academy tutor article reinforces that tutors care about flexibility and
    can be sensitive to fee structure and trial lessons. That makes tutor supply a competitive variable, not just a by-product
    of demand. In a category this legible, tutor economics are part of the competition. Lower commissions can attract supply,
    but they can also narrow monetization if the platform cannot offset that with volume or enterprise sales.'
  claimRefs:
  - CP003
  - CP006
  - CP008
  tableRefs:
  - TP002
- id: sp-differentiation
  title: Differentiation and moat
  body: Preply’s strongest claim is that it combines a human tutor marketplace with AI-supported personalization and progress
    tracking. TechCrunch and Fortune both describe the product as human-guided rather than AI-only, which is a sensible positioning
    against commoditization pressure. The downside is that the buyer can compare alternatives quickly, so differentiation
    has to show up in learner outcomes and tutor retention rather than marketing language. The product narrative still leans
    on the combination of human tutors and AI support, but that advantage is only durable if users keep perceiving better
    outcomes rather than just more features.
  claimRefs:
  - CP005
  - CP007
  - CP010
  - CP012
  tableRefs:
  - TP003
- id: sp-gap
  title: Where the moat is still uncertain
  body: Public evidence does not show a regulatory moat or a sticky enterprise lock-in model. Preply may have brand and supply
    depth, but the category is easy to multi-home, and the same AI tools that support the product also lower switching friction
    across the market. The report therefore treats moat durability as a live diligence question rather than a settled conclusion.
    Because users and tutors can multi-home, the moat is likely to be brand, supply depth, and workflow convenience rather
    than hard lock-in. That keeps the competitive question open.
  claimRefs:
  - CP009
  - CP011
  - CP012
  tableRefs: []
