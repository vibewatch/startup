company:
  name: Preply
chapter:
  number: 4
  title: Financials
  summary: Summarize how Preply monetizes, what public revenue and funding signals exist, and which private financial metrics
    remain essential for underwriting.
sections:
- id: si-model
  title: Monetization model
  body: 'Preply monetizes a two-sided marketplace: students pay for lessons and tutors receive a share after the platform
    takes its commission. The public materials also show a B2B layer through Preply Business, so the company is not dependent
    on one consumer-only stream. That matters because marketplaces live or die on take rate, utilization, and the stability
    of recurring demand. The model depends on lesson take-rate, tutor utilization, and the ability to cross-sell enterprise
    accounts without losing the core consumer marketplace.'
  claimRefs:
  - CI001
  - CI005
  - CI008
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: si-capital
  title: Capital and profitability
  body: The latest public capital mark is still the January 2026 Series D at a $1.2 billion valuation. The company says it
    became EBITDA positive in the prior twelve months, which is an important sign that growth is not purely bought with capital.
    At the same time, the exact cash balance, burn, and runway are not public, so diligence should not assume the business
    is self-funding forever. The financial story is stronger if enterprise accounts and AI tools improve lifetime value without
    increasing service complexity or support costs.
  claimRefs:
  - CI002
  - CI003
  - CI010
  - CI012
  tableRefs:
  - TI002
- id: si-pricing
  title: Pricing and unit economics
  body: Tutor economics are the heart of the model. Public coverage says tutors are paid via a sliding commission structure
    and trial lessons are part of the economics, while older reporting suggests the company kept growing even when it was
    still far from the current scale. The implication is that margin can improve with utilization, but the take-rate may also
    create supply friction if the company pushes too hard. The company still needs to prove that profitability is durable
    rather than just a by-product of a favorable demand cycle and disciplined hiring.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI009
  tableRefs:
  - TI003
- id: si-gaps
  title: Financial gaps that still matter
  body: The largest missing items are audited revenue, gross margin, customer concentration, CAC/payback, and the exact split
    between consumer and B2B. Multiples’ $50M estimate is useful as a directional anchor, but it is still only an estimate.
    Until management discloses more, the financial story remains one of growth and improving efficiency rather than fully
    underwritten economics. Until audited statements appear, the best interpretation is that the business is healthier than
    in prior years but still not fully underwritten. The goal is not to manufacture certainty from public estimates; it is
    to isolate the few numbers that materially move the valuation view.
  claimRefs:
  - CI003
  - CI004
  - CI010
  - CI011
  tableRefs: []
