  - CI008
  - CI011
  notes: The revenue stack is partly inferred from public pricing and product descriptions; private mix is not disclosed.
- id: TI002
  title: Pricing / monetization table
  columns:
  - Price or model
  - List vs realized
  - Scope
  - Implication
  rows:
  - - 33% start → 18% tutor commission
    - List-like public mechanic
    - Consumer marketplace
    - Can pressure supply if too high
  - - Trial lesson retained by platform
    - Public model detail
    - Consumer marketplace
    - Raises conversion importance
  - - Tutor-set lesson rates
    - Variable realized price
    - Consumer marketplace
    - Creates price dispersion
  - - Enterprise language training
    - Custom pricing, not public
    - B2B
    - Potentially higher ACV but opaque
  claimRefs:
  - CI005
  - CI008
  - CI009
  - CI012
  notes: This table separates public pricing mechanics from realized revenue, which remains undisclosed.
- id: TI003
  title: Capital adequacy table
  columns:
  - Item
  - Status / value
  - Interpretation
  - Diligence ask
  rows:
  - - Cash on hand
    - Not public
    - Cannot size runway from public data
    - Request balance sheet or bank summary
  - - Monthly burn
    - Not public
    - Cannot model runway precisely
    - Request management accounts
  - - Runway months
    - Not public
    - Capital adequacy unconfirmed
    - Need latest cash and burn
  - - Next financing trigger
    - Likely not immediate given EBITDA positivity
    - Positive but not sufficient
    - Need board plan and use-of-funds detail
  claimRefs:
  - CI002
  - CI010
  - CI011
  - CI012
  notes: This table intentionally leaves private capital metrics blank instead of guessing.
