company:
  name: Preply
chapter:
  number: 1
  title: Company Overview
  summary: Establish Preply’s identity, leadership, funding, operating footprint, and the most important public milestones
    that later chapters reuse.
sections:
- id: so-identity
  title: Identity and product
  body: Preply is positioned as a human-led, AI-enabled language-learning marketplace rather than a traditional school or
    pure self-study app. The company’s official materials emphasize personalized one-on-one lessons, a global tutor supply,
    and a B2B layer through Preply Business. That framing is stable across the company website, careers page, and 2026 funding
    announcement, so the key question for diligence is not what the company sells but how much durable economic value it captures
    from the marketplace. It also suggests the company can monetize across consumer and employer channels without changing
    the core lesson experience.
  claimRefs:
  - CO001
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: so-leadership
  title: Founders, leadership, and footprint
  body: Public sources consistently identify Kirill Bigai and Dmytro Voloshyn as the original founders, with Bigai still serving
    as the public face of the company. The organization now spans several hubs and a much larger executive bench, which is
    important because the business depends on product, marketplace operations, and B2B sales all at once. The biggest unresolved
    question is how much of the execution engine is still founder-dependent versus institutionalized in the current management
    team. That combination makes the company more resilient than a narrow app, but it also increases the complexity of execution
    and governance.
  claimRefs:
  - CO002
  - CO003
  - CO007
  - CO008
  - CO011
  tableRefs:
  - TO002
- id: so-capital
  title: Funding and scale milestones
  body: 'The latest public mark is the January 2026 Series D: $150 million at a $1.2 billion valuation. Preply’s own release
    says the company was EBITDA positive over the prior twelve months and had more than tripled its bookable tutor base since
    the earlier round. That is strong evidence of operating momentum, but the exact lifetime funding total varies by source,
    so the report keeps the figure approximate rather than over-precise. The funding round also brought in new and existing
    backers, which matters because it resets the cap table and signals ongoing investor interest.'
  claimRefs:
  - CO009
  - CO010
  - CO012
  tableRefs:
  - TO003
- id: so-gaps
  title: Open questions and diligence posture
  body: 'The open issues are mostly private metrics and governance: audited revenue, gross margin, CAC/payback, customer concentration,
    and the exact board / preference stack. Public materials also leave some ambiguity around headcount because different
    pages and press reports use different approximations. The report therefore treats these as diligence gaps rather than
    facts and carries them forward into the financial and valuation chapters. A credible diligence answer will need both management
    commentary and some hard financial data before the private mark can be treated as fully supported.'
  claimRefs:
  - CO008
  - CO011
  - CO012
  tableRefs:
  - TO004
