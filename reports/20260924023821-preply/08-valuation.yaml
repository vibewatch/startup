company:
  name: Preply
chapter:
  number: 8
  title: Valuation
  summary: Translate the evidence into an investment view, show why the public mark is rich, and define the diligence needed
    before treating the current valuation as fully supported.
sections:
- id: sv-thesis
  title: Investment thesis
  body: Preply is attractive because it sits in a large market, has a recognizably differentiated human-plus-AI product, and
    now shows EBITDA-positive momentum. The company also appears to have a real B2B expansion path, which makes it more than
    a consumer tutoring app. Those are all legitimate reasons the business can support venture-scale value creation. The thesis
    only becomes compelling if the public growth story translates into measurable, durable economics. In other words, the
    valuation is justified by operating leverage, not just by category size or narrative momentum.
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV009
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: sv-anti
  title: Anti-thesis
  body: The anti-thesis is that the current public evidence still does not support precise underwriting. Revenue is only indirectly
    estimated, margins are not public, and tutor economics can create friction if the company pushes too hard on take-rate.
    In a category that can be partially commoditized by self-study and AI, those are not trivial concerns. The anti-thesis
    is strongest when you ask what happens if the company is merely good instead of great. In that case, a premium mark can
    compress quickly because the public evidence still leaves too many private inputs unproven.
  claimRefs:
  - CV003
  - CV005
  - CV008
  - CV010
  tableRefs:
  - TV002
- id: sv-comps
  title: Comps and entry discipline
  body: Comparable evidence points to a late-stage private marketplace with a premium valuation rather than a cheap one. The
    right way to think about the entry is not as a bargain relative to software but as a quality marketplace with better economics
    than a pure app, yet still demanding enough to require proof of margin expansion. That puts the decision in the track/research-more
    bucket unless diligence surfaces stronger revenue evidence. Comparable evidence suggests the company sits in a premium
    private-growth bucket, but the right comparison set is not obvious because it mixes edtech, marketplace, and software
    characteristics. That ambiguity itself is a reason to keep the underwriting conservative.
  claimRefs:
  - CV006
  - CV007
  - CV011
  tableRefs:
  - TV003
- id: sv-diligence
  title: Final diligence and exit logic
  body: 'The next diligence ask is straightforward: confirm revenue, gross margin, retention, and customer concentration.
    If those items support the current mark, the company could remain a credible late-stage growth asset with IPO optionality.
    If they do not, the valuation will look stretched even if the product and brand remain strong. The most useful next step
    is to test the mark against real revenue, margin, and retention data. If those numbers hold up, the company deserves a
    more positive entry stance; if they do not, the current valuation is best treated as aspirational rather than supported.'
  claimRefs:
  - CV012
  tableRefs: []
