chapter:
  number: 7
  title: Risks
  summary: Rank the legal, privacy, operational, geopolitical, and marketplace risks that could impair the business, and identify
    what would break the thesis.
sections:
- id: sr-legal
  title: Legal and privacy risk
  body: The most concrete risks are in the terms and privacy policy. Preply uses arbitration, can suspend services, restricts
    service in certain jurisdictions, and processes a broad set of personal, tutor, and AI-related data. That makes privacy
    and governance an ongoing diligence issue, especially if product usage expands deeper into AI-assisted learning. The key
    issue is not one clause in isolation but the combination of arbitration, service restrictions, and broad data processing.
    That combo matters because it can complicate both user redress and future AI-product expansion if regulators or customers
    decide the disclosures are too aggressive. The key issue is not one clause in isolation but the combination of arbitration,
    service restrictions, and broad data processing. That combo matters because it can complicate both user redress and future
    AI-product expansion if regulators or customers decide the disclosures are too aggressive.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR008
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: sr-ops
  title: Operational and geopolitical risk
  body: The status page and TechCrunch coverage show that uptime and wartime logistics are real operational variables. Preply
    has a distributed footprint and can use multiple hubs as a hedge, but the Kyiv operation remains exposed to power outages
    and broader regional risk. That makes operational resilience a real, not theoretical, part of the investment case. In
    practice, these risks are partly hedged by distributed teams and public status monitoring, but the company still has exposure
    to operational shocks that can affect learner trust quickly. A marketplace that runs lessons globally cannot afford frequent
    outages or prolonged regional disruption.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR010
  tableRefs:
  - TR002
- id: sr-market
  title: Market and partner risk
  body: 'The marketplace model itself creates risk because it depends on third-party payments, tutor supply, and user trust.
    Tutor economics can become contentious if commissions feel too high, and complaint surfaces like BBB indicate that user
    experience and support matter. This is not a fatal problem, but it does mean the company has to keep the marketplace healthy
    on both sides. Marketplace risk is subtle because it can erode gradually: if tutors dislike commission structure or users
    complain about service friction, liquidity thins before revenue does. That is why complaint surfaces and tutor feedback
    deserve more attention than a simple NPS-style vanity metric.'
  claimRefs:
  - CR008
  - CR009
  - CR012
  tableRefs:
  - TR003
- id: sr-thesis
  title: What would break the thesis
  body: The thesis is most vulnerable if growth slows, margins stop improving, or public trust weakens because of privacy
    or reliability issues. The upside case relies on a resilient marketplace with durable tutor supply and enough enterprise
    expansion to offset consumer churn. So the kill criteria are less about one lawsuit and more about a cluster of recurring
    operational or trust failures. The thesis break is therefore cumulative. A single incident is manageable; repeated trust
    issues, a slowing top line, or structural compliance friction would be enough to change the investment view.
  claimRefs:
  - CR007
  - CR011
  - CR012
  tableRefs: []
