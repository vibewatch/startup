  topStrengths:
    - Large global tutor marketplace with a recognizable consumer brand and a meaningful B2B expansion path.
    - Human-led, AI-enabled positioning fits the category better than pure self-study or pure automation.
    - Public evidence suggests EBITDA-positive momentum and enough scale to support continued product investment.
  topRisks:
