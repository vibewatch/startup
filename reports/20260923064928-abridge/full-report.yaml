companyProfile:
  summary: |
    Abridge is a healthcare AI company that records clinician-patient conversations and turns
    them into structured clinical notes, evidence-linked summaries, and adjacent workflow
    intelligence for health systems. The platform is built for enterprise deployment, integrates
    deeply with Epic, and has expanded beyond ambient documentation into decision support and
    related clinical workflows.
  foundedDate: '2018-01-01'
  founders:
    - name: Shiv Rao
      role: CEO, Co-founder
      background: Cardiologist and physician-scientist
    - name: Zack Lipton
      role: CTO, Co-founder
      background: Machine-learning researcher and professor
  foundingLocation: Pittsburgh, PA
  headquarters: Pittsburgh, PA / San Francisco, CA
  productSummary: |
    Abridge's core product is an ambient AI clinical documentation system that turns encounter
    audio into specialty-specific notes with linked evidence and enterprise workflow controls.
    The platform now extends into clinical intelligence and adjacent workflow modules.
  customerFocus: Enterprise health systems and large provider networks
  businessModel: Enterprise SaaS / per-seat subscriptions with implementation and support services
  stage: Series E
  fundingStatus: $757M total raised; $300M Series E closed at a $5.3B valuation
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current scale
        blocks:
          - type: paragraph
            body: >-
              Abridge is an AI-native clinician intelligence company built around the clinical conversation. Its public
              positioning in 2026 emphasizes enterprise health-system deployments, real-time documentation, Linked
              Evidence, and increasingly decision support and revenue-cycle workflows. The company now claims deployment
              across more than 300 of the largest health systems in the U.S. and says it will support more than 100
              million patient- clinician conversations this year. That scale matters because it shows Abridge has moved
              beyond a single ambient-scribe use case into a broader workflow layer inside large health systems.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO011
      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The public founder story remains centered on Shiv Rao, a practicing cardiologist who is the company’s CEO
              and cofounder, with Zach Lipton also identified in third-party coverage as a cofounder. Governance remains
              mostly private-company opaque, but Tracxn currently lists a board that includes Shivdev K. Rao plus
              multiple independent directors. That is enough to confirm Abridge has matured beyond a founder-only
              structure, but not enough to fully evaluate control rights, board committees, or investor protections. The
              result is a credible founder-market-fit story paired with limited public governance transparency.
            claimRefs:
              - CO002
              - CO003
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO012
      - number: '1.3'
        title: Financing, valuation, and 2026 milestones
        blocks:
          - type: paragraph
            body: >-
              Abridge’s disclosed financing story still centers on its $300 million Series E led by Andreessen Horowitz
              and supported by Khosla Ventures, at a reported $5.3 billion valuation. The company later added a
              strategic investment from Eli Lilly, but the amount was not disclosed, so the cleanest public
              capitalization view is still the Series E as the latest priced round. In 2026, the company expanded into
              payer workflows with Availity, won selection for the VA enterprise contract, and pushed decision support
              into more clinicians. Those milestones reinforce distribution strength and product breadth, but they do
              not yet close the persistent opacity around revenue, margin, or customer economics. That means the
              headline story is still growth and platform breadth rather than confirmed operating efficiency or a fully
              transparent capital structure.
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO010
              - CO011
