company:
  name: Abridge
chapter:
  number: 6
  title: Customers
  summary: >-
    Abridge serves large health systems first, and the public evidence suggests meaningful
    adoption depth: broad deployment counts, high retention signals, and many named enterprise
    references. The remaining customer question is not whether hospitals use it, but how
    concentrated the revenue base is and how expansion behaves after the initial rollout.
sections:
  - id: customer-segmentation
    title: Customer base segmentation
    body: >-
      Abridge's customer base is clearly enterprise-led. The public story centers on health
      systems, academic medical centers, children's hospitals, and integrated delivery networks,
      not solo clinicians or small practices. The company also appears to be expanding into
      payer, federal, and nursing workflows, which broadens the user set but still leaves the
      buyer at the system level. In practice, the segmentation is less about geography and more
      about whether the organization can support Epic-grade governance and implementation.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and retention
    body: >-
      Public adoption signals are strong by private-company standards. Abridge says it is used
      across 300+ health systems, 9,400+ clinicians, and 50 million-plus conversations annually.
      It also reports 95% user retention and strong crossover preference in public customer
      quotes. Those are excellent signals, but they are still vendor-reported and should be read
      as directional rather than audited. The main diligence question is whether those metrics
      hold when the product is rolled from pilot champions into enterprise-wide standard practice.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: concentration-and-expansion
    title: Expansion and concentration risk
    body: >-
      The customer set is broad on paper, yet revenue concentration can still be high if a small
      number of systems account for most deployment volume. Abridge's move into decision support,
      prior authorization, and nurse workflows creates expansion opportunities, but it also makes
      the relationship more complex and potentially more fragile if a customer rollout stalls.
      Public materials do not disclose NRR, GRR, churn, or top-customer concentration, so the
      open question is how much expansion offsets concentration risk at the enterprise level.
      That gap matters because a company can look broadly adopted while still having a revenue
      base anchored in only a handful of very large rollouts, which makes renewals and expansions
      disproportionately important to the investment case.
      It also means the strongest adoption signal may still come from the breadth of reference
      logos, not from any one headline customer.
      Renewal performance therefore remains the most important hidden variable.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: []
