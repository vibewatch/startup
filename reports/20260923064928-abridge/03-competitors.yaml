    notes: "This is a directional buying matrix, not a benchmark scorecard."
    claimRefs: [CP005, CP006, CP007, CP012]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [vendor, price_model, included_capabilities, discount_or_unknowns, implication]
    rows:
