      - [Freed, "Self-serve subscription", "Basic ambient notes", "Lower-tier feature breadth", "Competes on simplicity and price"]
      - [Heidi, "Self-serve subscription", "Ambient note workflows", "Enterprise controls vary", "Competes for smaller clinics"]
      - [Nuance DAX, "Enterprise contract", "Ambience and dictation workflow", "Pricing varies by deal", "Incumbent bundle pressure"]
    notes: "Public pricing details are sparse and should be treated as directional unless contract terms are disclosed."
    claimRefs: [CP006, CP007, CP008]
