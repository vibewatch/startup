      - ["Evaluation loop", "Measure quality and clinician feedback", "Human review + analytics", "Model drift"]
    notes: "Dependencies and risks are inferred from public architecture descriptions and implementation stories."
    claimRefs: [CE005, CE006, CE007, CE011]
