      - [gross_margin, null, low, "Determines software-like economics", "Ask for cohort margin bridge"]
      - [NRR, null, low, "Shows expansion strength", "Request renewal cohorts"]
      - [burn, null, low, "Determines runway", "Ask for cash and burn snapshot"]
      - [headcount, 676, medium, "Proxy for scaling cost base", "Check current internal headcount"]
    notes: "Null means not publicly disclosed; the table is intentionally incomplete because Abridge does not publish the metric."
    claimRefs: [CI005, CI007, CI008, CI011]
