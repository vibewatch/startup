      - ["Expansion into CDS and prior auth can raise ACV", "No measurable attach / renewal upside"]
      - ["High retention signals suggest real product value", "Retention and cohort data weaken"]
      - ["Opaque financials keep diligence risk elevated", "Public KPI disclosure improves"]
      - ["Strong hospital trust can support expansion", "Buyer confidence erodes or procurement slows"]
    notes: "Arguments are directional and should be rechecked against the latest public materials."
    claimRefs: [CV001, CV003, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenario table
    columns: [scenario, assumptions, valuation_or_return_logic, key_risks, probability_signal]
    rows:
      - ["Bull", "Expansion modules monetize; economics become visible", "Premium multiple holds or expands", "Execution and disclosure risk", "Needs stronger proof than public data"]
      - ["Base", "Growth continues, but disclosure stays limited", "Track at current premium level", "Margin opacity and competition", "Most consistent with current evidence"]
      - ["Bear", "Epic or competitors compress pricing; growth slows", "Multiple de-rates", "Bundling, trust, or rollout friction", "Possible if adoption slips"]
      - ["Upside optionality", "Installed base supports adjacent workflow monetization", "Strategic value exceeds near-term optics", "Execution complexity", "Lower-probability but meaningful upside"]
    notes: "This scenario table is qualitative and should not be treated as a formal DCF."
    claimRefs: [CV009, CV010, CV011, CV012]
