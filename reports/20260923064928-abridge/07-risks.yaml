      - ["Support overload", medium, medium, "early", "Margin pressure", "Implementation staffing"]
    notes: "Likelihood and severity are qualitative judgments from public deployment stories and review coverage."
    claimRefs: [CR005, CR006, CR007]
  - id: TR003
    title: Partner or dependency risk register
    columns: [dependency, counterparty, role, concentration, failure_scenario, severity, mitigation, residual_exposure]
    rows:
      - ["EHR integration", "Epic", "Distribution and workflow depth", "High", "Native bundle compresses differentiation", "high", "Deep integration and evidence", "Bundling risk"]
      - ["Prior auth partner", "Availity", "Claims / payer workflow", "Medium", "Partner scope changes", "medium", "Joint roadmap", "Channel dependence"]
      - ["Federal contract vehicle", "VA", "Federal rollout", "Medium", "Task-order delays", "medium", "Pilot and security posture", "Procurement timing"]
      - ["Large system customers", "Top health systems", "Revenue base", "Medium", "Rollout stalls", "high", "Expand modules", "Concentration risk"]
    notes: "Concentration is inferred from the enterprise model and public partner announcements."
    claimRefs: [CR009, CR010, CR011, CR012]
