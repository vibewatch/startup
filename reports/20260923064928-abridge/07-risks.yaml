          values: ["Support load", "Integration regression", "Transcription / trust failure"]
        - label: "Regulatory"
          values: ["Policy nuance", "Consent ambiguity", "Retention / privacy breach"]
        - label: "Partner"
          values: ["Secondary vendor", "Workflow partner", "Epic / large-system bundling"]
        - label: "Financial"
          values: ["Muted growth", "Premium pressure", "Runway / burn stress"]
        - label: "Reputational"
          values: ["Small complaint", "Buyer hesitation", "Enterprise rollout delay"]
        - label: "Roadmap"
          values: ["Feature gap", "Module drift", "Scope creep"]
    claimRefs: [CR001, CR005, CR009]
