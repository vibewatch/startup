    notes: "This is a policy-risk register built from public product and review materials, not legal advice."
    claimRefs: [CR001, CR002, CR003]
    enumerationScope:
      coverage: partial
      basis: "Publicly visible consent, retention, and workflow-policy issues in 2026 materials"
  - id: TR002
