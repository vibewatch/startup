      - number: '6.3'
        title: 客户增购与集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户名单看似广泛，但如果部署量主要来自少数大型系统，收入集中度仍可能很高。决策支持、预先授权和护士工作流带来增购机会，也让客户关系更复杂；项目落地一旦受阻，关系可能更脆弱。公司没有披露净留存率（NRR）、总留存率（GRR）、流失率或头部客户集中度，因此增购能否抵消大型客户集中风险仍无从判断。客户表面覆盖面广，不代表收入不依赖少数超大型项目；这会让续约和扩张对投资逻辑格外重要。相比单个明星客户，标杆客户的广度或许更能说明采纳情况。续约表现仍是最关键的未知数。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              最大的法律风险不是某一起受到广泛报道的案件，而是大规模录制临床对话带来的知情同意、隐私和合规负担。Abridge
              会保留音频一段时间，业务覆盖多个司法辖区，也已进入预先授权和决策支持等敏感工作流。随着部署扩大，公司必须持续证明同意流程、数据留存和安全控制符合要求。医疗系统一旦不再信任这些管控，即使产品本身正常，部署也可能停止。法律尽调应关注的不是某一个案，而是公司拓展敏感工作流时，政策是否始终与产品实际行为一致。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
      - number: '7.2'
        title: 运营、模型质量与数据安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险主要落在可靠性和工作流适配上：产品要能接入 Epic 等
              EHR、覆盖不同专科，转录质量也要过关，同时不能给医生增加太多操作负担。多份评价都提到它在大型机构和小型诊所中的适配度不同，同一平台可能在一种环境里好用，换个场景就不顺手。模块越多，模型漂移、幻觉、集成回归和大客户支持压力等失效模式也越多。风险会累积：平台还要应对更多内部审核者、外部利益相关方和边缘案例。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
      - number: '7.3'
        title: 合作伙伴、财务与投资逻辑破损风险
        blocks:
          - type: paragraph
            body: >-
              Abridge 依赖几类关键关系：Epic 生态集成、大型医疗系统买方，以及 Availity、VA 合同载体等工作流合作关系。这些关系顺利时是优势，也带来依赖集中风险。财务模型同样不透明，公开资料没有
              ARR、利润率或烧钱数据。若增长放缓、核心伙伴转向，或企业交付负担拖慢产品路线图，投资逻辑就会失效。伙伴改变方向或买方放慢扩张，都可能迅速削弱收入前景；公司又缺少公开运营指标来佐证。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              看多 Abridge 的理由是：大型客户基础扎实、Epic
              工作流集成深入、留存信号强，产品也从病历生成拓展到决策支持和支付方工作流。这更像平台，而非单点功能工具。公司似乎已赢得大型医疗系统的信任；在医疗行业，这种信任很难复制，往往比应用安装量更重要。反面是，财务披露少、定价不透明，竞争也很激烈；如果单个部署无法持续创造经济价值，估值可能很快承压。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
      - number: '8.2'
        title: 评级建议、确定性与估值立场
        blocks:
          - type: paragraph
            body: >-
              以现有公开证据，建议继续跟踪，而不是激进买入。Abridge
              的产品和渠道能力突出，但经济模型披露不足，尚不能支撑更积极的入场判断。估值仍偏高：最新一轮定价融资已把公司推至数十亿美元估值，而当前扩张尚未由公开财务数据验证。运营信号虽强，承销所需的关键数据仍不完整，因此判断把握度为中等。后续应核实收入质量、客户集中度，以及新工作流是否真正提高单客价值，而非只增加产品模块数量。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 乐观、基准与悲观情景推演
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求扩张转化为可衡量的经济回报：更多客户采用决策支持和预先授权，利润率管理可信，披露也更透明。基准情景是企业客户继续增长，但单位经济效益仍不透明，溢价估值暂能维持。悲观情景则包括扩张放慢、Epic
              或其他传统厂商挤压，或信任事件拖慢企业部署。尽调重点不是产品愿景，而是变现证据、续约质量和客户集中度。若现有客户能采用更广泛的工作流平台，即使不大量获取新客户，也有机会提高单客价值，带来额外上行空间。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
