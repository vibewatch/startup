    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位、产品与当前规模
        blocks:
          - type: paragraph
            body: >-
              Abridge 围绕临床对话构建 AI 临床智能产品。公司在 2026 年重点强调大型医疗系统部署、实时病历生成和 Linked Evidence，并正把产品延伸至决策支持与收入周期工作流。Abridge
              称已部署到美国 300 多家大型医疗系统，预计今年将支持超过 1 亿次（100 million）医患对话。这个规模说明，业务已不止于单一的环境式病历记录用例，而是开始进入大型医疗系统更广泛的工作流。
