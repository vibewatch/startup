      - number: '3.2'
        title: 功能、定价与分发渠道对比
        blocks:
          - type: paragraph
            body: >-
              Abridge 的优势来自三者叠加：输出可追溯、深度嵌入 Epic，并有大型医疗系统落地验证。竞品则常在某一项上占优，例如价格更低、注册更简单、兼容更多非 Epic
              系统，或自助采购更直接。因此，功能相近不等于胜负已定；买方还要权衡实施负担，以及企业治理是否比上线速度或采购成本更重要。需要受管控地在企业内部规模化部署时，Abridge 最具优势。
