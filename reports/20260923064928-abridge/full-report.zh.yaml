  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购决策链路
        blocks:
          - type: paragraph
            body: >-
              Abridge 面向临床医生提供企业级环境式 AI，市场不只是通用转录软件，还包括编码、预先授权（Prior Auth）和循证指导等相邻需求。医疗系统的 CIO 或 CMIO
              通常主导采购，但收入周期、医疗信息、隐私合规和运营团队也都能否决项目。因此市场虽大，销售和部署周期却长：买方要的是能切实缓解医生倦怠、接入 EHR 并满足治理要求的方案，而不是便宜的单点工具。Abridge
              多个标杆项目都嵌入 Epic 工作流，集成深度因此格外关键。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
      - number: '2.2'
        title: 市场规模测算视角与证据边界
        blocks:
          - type: paragraph
            body: >-
              公开资料提供了几种估算市场的切口：美国医疗行政支出、大型医疗系统数量、第三方估计的临床医生年费区间，以及受病历负担影响的临床医生比例。但这些都不能单独代表完整的总可用市场（TAM），用一个自上而下的数字概括市场规模容易失真。尽调更适合给出有边界的区间，说明赛道吸引力，同时不假装市场已被精确量化。Abridge
              宣称美国每年有 1.5 万亿美元行政成本；这能说明需求规模，却不是经过审计的市场估值。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
