      - number: '3.3'
        title: 切换成本、锁定效应与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Abridge 的护城河真实存在，但并非牢不可破。产品一旦深入 Epic 工作流、融入临床日常和医疗系统治理，切换成本就会上升；与此同时，Epic
              也可能捆绑更多原生环境式功能。若产品迭代跟不上，买方还可能按专科同时采用多家工具。低端产品趋于同质化、缺乏明确 ROI 的企业合同遭遇压价，都是现实风险。长期看，Abridge
              必须从病历记录及时拓展到更广泛的临床智能，才能抵御更便宜、更易试用、价格更透明的单点产品。即使它仍是大型机构首选，重视采购速度和预算确定性的买方也会把第二家供应商留在候选名单中。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              公开信息显示，Abridge 采用企业级
              SaaS，并叠加定制实施服务。公司不公布标价，合同需要逐一谈判；市场评价也显示，客户通常签定制年约，而非自行注册付费。产品正从病历生成扩展到编码、预先授权和临床决策支持，收入来源由单一按席位收费的速记工具走向多模块组合。相邻工作流若能真正落地，就有机会提高年度合同价值（ACV）。
