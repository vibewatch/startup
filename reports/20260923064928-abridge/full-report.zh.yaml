        blocks:
          - type: paragraph
            body: >-
              目前最清晰的融资记录仍是 Andreessen Horowitz 领投、Khosla Ventures 参投的 $300 million E 轮；据报道，该轮估值为 $5.3 billion。Abridge
              后来又获得 Eli Lilly 战略投资，但金额未披露，因此 E 轮仍是最近一轮有明确价格的融资，也是公开资本结构最可靠的参照。2026 年，公司与 Availity 拓展支付方工作流，中选 VA 企业级环境式
              AI 合同，并把决策支持推广给更多临床医生。这些进展增强了渠道和产品广度，却没有解开收入、利润率和客户经济模型的谜团。当前投资故事仍主要靠增长与平台扩张支撑，运营效率尚未得到证实，资本结构也谈不上透明。
