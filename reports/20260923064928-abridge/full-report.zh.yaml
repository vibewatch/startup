      - number: '4.2'
        title: 定价机制、利润率演进与单元经济模型
        blocks:
          - type: paragraph
            body: >-
              财务尽调最大的障碍不是出现了负面信号，而是关键数据缺席：公开资料没有披露年经常性收入（ARR）、毛利率、净留存率（NRR）或烧钱速度。分析只能参考替代指标，包括媒体报道的合同金额区间、覆盖的医疗系统规模，以及企业工作流是否足够深入、能否带来增购。客户评价显示，Abridge
              定价处于环境式 AI
              市场高端；若客户持续使用，较高价格有利于毛利。但这取决于实施、后续支持和模型推理成本能否受控。若相邻工作流能提高合同金额，又不让支持成本同比例上涨，单位经济效益仍有望明显改善。管理层披露前，公开替代数据还不足以作为承销级估值依据，外部估值只能作方向性判断，不能下定论。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
