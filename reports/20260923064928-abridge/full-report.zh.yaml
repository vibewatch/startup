  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品、传统厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争对手分属不同市场。Nuance DAX、Suki、Ambience 和 DeepScribe 等企业级环境式 AI 最直接地与 Abridge 竞争；Freed、Heidi
              等轻量自助工具则争夺小型诊所预算。人工速记员、手工录入和通用语音听写也是替代方案。买方评估 Abridge 时很少只看病历质量，还会比较集成深度、部署支持、治理能力，以及供应商能否通过严格的企业采购审查。
