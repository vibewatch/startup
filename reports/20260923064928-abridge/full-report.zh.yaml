      - number: '5.3'
        title: 信任机制、安全保障与技术路线图
        blocks:
          - type: paragraph
            body: >-
              Abridge 的技术主张不止是自动写病历，更强调临床医生能审计、信任生成结果。Linked
              Evidence、安全授权、企业治理和持续评测构成其公开展示的信任基础。路线图已从病历延伸到编码、决策支持和支付方工作流，平台范围更广，对可靠性、隐私和产品纪律的要求也随之提高：每个新模块都会带来新的失效模式。公司需要证明扩张能补强核心流程，而不是摊子铺得过大、让临床团队难以稳定承接。企业医疗尤其如此——演示中好用的功能，进入生产环境后仍可能增加审核摩擦或操作步骤。目前公开的产品主线仍聚焦可信度、整体工作流适配和企业部署能力。
            claimRefs:
              - CE009
              - CE010
              - CE011
