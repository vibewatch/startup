        title: 系统架构、部署方式与系统集成
        blocks:
          - type: paragraph
            body: >-
              从公开资料看，系统由语音采集、专科适配转录、上下文推理和回写 EHR
              的工作流集成组成；产品支持多个专科和语种，也覆盖移动端与桌面端。部署并不轻松，医疗系统要投入集成和治理审查，有时还需定制支持。这套产品因此更适合大型机构，而非零散小诊所。
