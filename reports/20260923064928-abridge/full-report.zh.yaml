      - number: '2.3'
        title: 采纳驱动力与落地阻力
        blocks:
          - type: paragraph
            body: >-
              临床痛点推动赛道升温：医生倦怠、病历积压、预先授权流程反复耗时，以及不增加加班也要完整记录可计费服务。落地则要闯过企业采购、系统集成、隐私审查和部署前的价值验证。Abridge
              聚焦大客户，能把这些门槛变成服务大型医疗系统的护城河，却也因此难以覆盖小型机构。关键不是“有多少医生需要速记员”，而是“有多少医疗系统有能力合规部署，并打通
              EHR、计费和决策支持”。近期最有把握的客户，是正把环境式 AI 推向多专科标准化的医疗系统；它们能把部署成本摊到更大的存量用户基础上，也比分散的门诊网络更容易推动工作流变更。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM012
