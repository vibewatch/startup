        title: 产品定义与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Abridge
              把现场医患对话转成结构化病历，并将证据链接到生成内容，方便临床医生核验。就诊过程中，系统持续收听并实时起草；问诊结束后，医生可审阅病历、处理编码并继续下游流程。产品面向大型医疗系统，而非轻量自助记笔记场景，因此特别依赖
