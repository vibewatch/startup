companyProfile:
  summary: |
    Abridge 是一家医疗 AI 公司，专注记录医患对话并将其转化为结构化临床病历、关联证据的摘要以及医疗系统配套的工作流智能。该平台专为企业级部署打造，与 Epic 深度集成，业务已从环境式病历生成延伸至临床决策支持及相关工作流。
  foundedDate: '2018-01-01'
  founders:
    - name: Shiv Rao
      role: CEO 兼联合创始人
      background: 心脏病学专家兼医学科学家
    - name: Zack Lipton
      role: CTO 兼联合创始人
      background: 机器学习研究员兼教授
  foundingLocation: Pittsburgh, PA
  headquarters: Pittsburgh, PA / San Francisco, CA
  productSummary: |
    Abridge 核心产品是一套环境式 AI 临床病历系统，能将接诊音频转化为包含关联证据的分专科病历，并配备企业级工作流管控能力。目前平台进一步延伸至临床智能与周边工作流模块。
  customerFocus: 大型医疗系统与大型医疗服务机构网络
  businessModel: 企业级 SaaS / 按席位订阅，辅以实施和支持服务
  stage: Series E
  fundingStatus: 累计融资 $757M；以 $5.3B 估值完成 $300M E 轮融资
  disclosureProfile: private-undisclosed
