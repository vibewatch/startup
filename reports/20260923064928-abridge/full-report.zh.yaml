            body: >-
              Abridge 融资充足，但财务透明度有限。最近一轮定价融资是 $300 million E 轮，估值为 $5.3
              billion；之后虽披露有战略投资，却没有给出价格。资金充裕意味着现金跑道可能较长，但不能据此判断烧钱速度或盈利能力。结论是：Abridge
              有真实需求支撑，是定位高端的企业平台；但收入和利润率未披露，承销评估仍需更高证据门槛，外部也难以验证当前估值。
