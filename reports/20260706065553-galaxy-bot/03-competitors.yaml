  title: The moat can compress if VLAs converge faster than distribution advantages widen
  body: 'Figure, AgiBot, and Physical Intelligence all reinforce the same strategic risk: if end-to-end robot models become easier to port or copy, then distribution, pricing, and support economics will dominate and raw architecture novelty will matter less.'
