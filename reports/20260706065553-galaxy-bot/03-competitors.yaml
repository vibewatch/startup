- id: P502
  title: Profiles of the highest-signal rivals
  body: 'AgiBot, Unitree, Figure, and Physical Intelligence represent four distinct competitor archetypes. AgiBot is the clearest Chinese scale peer: it combines a broad hardware portfolio, aggressive production milestones, and an OEM-platform narrative that extends beyond one robot body. Unitree is the clearest public price anchor and the most visible low-end commercialization story, with a much cheaper G1 and broad international shipping reach. Figure is the best-capitalized venture-backed benchmark and pairs headline valuation with a manufacturing and model-stack story that targets both workforce and home use cases. Physical Intelligence is less a direct hardware seller than a model-layer risk, because its generalist π0 family and open-source release make it easier to imagine future hardware becoming more interchangeable. XPENG and UBTech are important fast followers because they bring auto or public-market resources, but the highest current underwriting pressure still comes from the
    Chinese scale pair and the US capital/model pair.'
