- id: P504
  title: Switching costs, lock-in, and distribution asymmetries
  body: 'Galbot''s moat is not a classic software network effect; it is an operational bundle of dataset depth, site integration, customer workflow tuning, and access to procurement channels. That can create meaningful switching costs once a customer has validated a deployment in a live store, hospital, or factory, but it does not make multi-homing impossible. If humanoid bodies converge on similar VLA architectures and task APIs, customers may test more than one vendor at once and allocate tasks based on reliability, support quality, and economics. Distribution therefore becomes unusually important. Galbot''s state-backed investor set and relationships with industrial champions may improve access to Chinese pilot programs, procurement credibility, and partner introductions that smaller venture-only startups cannot easily match. The asymmetry cuts both ways, however: incumbents with automotive or electronics supply chains, such as XPENG or other large manufacturers, can potentially match
    or exceed Galbot on manufacturing leverage if the humanoid category becomes more scale-driven than model-driven.'
  claimRefs:
  - CP021
  - CP022
  - CP027
  - CP033
  - CP034
  - CP035
  - CP036
