company:
  name: Galaxy Bot
chapter:
  number: 3
  title: Competitors
  summary: 'Galbot competes in a crowded embodied-AI field where Chinese scale leaders such as AgiBot and Unitree set the shipment and price anchors, while US players such as Figure and Physical Intelligence define the capital and model-stack frontier. Galbot''s strongest relative advantages are full-stack vertical integration, a large embodied dataset, named industrial and retail deployments, and state-backed distribution access inside China. Those advantages are real but not unassailable: pricing is opaque, shipment leadership is disputed, VLA architectures are converging, and adverse outside commentary still argues that many humanoid deployments remain more demonstrative than economically decisive.'
sections:
- id: P501
  title: Competitive landscape and who actually matters
  body: Galbot should be benchmarked against more than a short list of famous humanoid brands. The real landscape includes direct full-stack humanoid peers, auto-backed or public-company entrants, model-layer competitors that could abstract away hardware differentiation, substitutes such as fixed automation and manual retail or factory labor, and theoretical entrants that can leverage supply-chain scale from automotive or electronics ecosystems. In direct embodied-AI competition, AgiBot and Unitree matter most on current Chinese shipment evidence, Figure matters most on capital intensity and global narrative power, and Physical Intelligence matters because it could compress product differentiation at the model layer if generalist robot foundation models become portable across hardware. Adjacent pressure comes from XPENG, UBTech, Boston Dynamics, and 1X, each attacking a different slice of industrial, commercial, or household robotics. The practical status quo substitute remains human labor
    plus task-specific automation, which keeps buyer scrutiny focused on reliability and labor replacement rather than on humanoid novelty alone.
