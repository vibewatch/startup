  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: galbot retail unit economics
    missingEvidence: No public source in this chapter discloses Galaxy Bot’s robot pricing, retail revenue, customer concentration, or task-level payback period.
    whyItMatters: Without company-specific unit economics, the chapter can only frame the market and substitutes, not prove Galbot’s share of the opportunity.
    diligencePath: Request price sheets, pilot-to-production conversion data, average robots per site, labor-replacement assumptions, and cohort economics by deployment type.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: material
    topic: retail labor cost benchmarks
    missingEvidence: Direct China Chain Store & Franchise Association style data on labor cost as a percentage of store operating expense was not available in reviewed public sources.
    whyItMatters: Buyer-budget sizing and SOM estimates are weaker without direct retailer cost structure benchmarks.
    diligencePath: Obtain CCFA/KPMG convenience-store and supermarket operating benchmark reports or equivalent sell-side retail coverage.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: material
    topic: humanoid market sizing methodology
    missingEvidence: Market-research publishers provide sharply different China humanoid market sizes and growth rates with limited public methodology transparency.
    whyItMatters: A single TAM figure would overstate certainty and could distort valuation or go-to-market expectations.
    diligencePath: Treat multiple market estimates as scenario inputs, and build an internal bottom-up SOM using store counts, automatable tasks, and ROI constraints.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM008
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: full service-robotics and service-robot install detail
    missingEvidence: Some of the strongest service-robotics and retail benchmark reports are summarized publicly but keep full China segment detail behind paywalls or report subscriptions.
    whyItMatters: The chapter can establish market direction but not always the deepest segmentation by vertical or geography.
    diligencePath: Purchase or access full analyst reports from IFR, market-research providers, or sector consultants for China-specific segment splits.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: buyer budget owner granularity
    missingEvidence: Public buyer case studies rarely disclose which internal budget line item funded robotics pilots versus scaled deployments.
    whyItMatters: GTM assumptions are weaker when the payer is inferred rather than documented.
    diligencePath: Interview pilot customers or channel partners and request procurement flowcharts for store ops, IT, and facilities budgets.
    relatedQuestionRefs:
    - QM009
    - QM011
    relatedTableRefs:
    - TM003
