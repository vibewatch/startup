tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded / adjacent spend
  - Buyer / payer
  - Relevance to Galaxy Bot
  rows:
  - - Humanoid / mobile-manipulator retail automation
    - In-store picking, replenishment, shelf tasks, store-runner delivery, packaging, pharmacy service workflows
    - Pure software analytics, smart carts, self-checkout-only systems, fixed kiosks
    - Store operations, innovation teams, facilities, chain management
    - Core target wedge when one robot can replace multiple manual tasks
  - - Service robotics
    - Hospitality, delivery, guiding, transport, professional service robots
    - Humanoid-specific dexterity or multi-arm manipulation claims
    - Operations teams, healthcare/hospitality operators, commercial facilities
    - Important adjacent market and lower-cost substitute set
  - - Warehouse / logistics robotics
    - Picking, sorting, transportation, palletization, tote movement, fulfillment automation
    - Front-of-store customer interaction and checkout
    - 3PL operations, warehouse managers, supply-chain capex
    - Adjacent workflow pool that competes for the same labor-saving thesis
  - - Self-checkout / smart carts / unattended retail
    - Checkout labor replacement, faster transactions, basket visibility, front-end customer throughput
    - Backroom picking, whole-store replenishment, complex manipulation
    - Retail IT, store operations, finance
    - Cheaper substitute for part of the store-labor problem
  - - E-commerce and omnichannel substitution
    - Online order capture, fulfillment, click-and-collect, in-store digital/offline integration
    - Physical humanoid labor automation itself
    - Digital commerce, fulfillment, omnichannel leadership
    - A retailer may choose channel shift or warehouse automation instead of store humanoids
  notes: Boundary is defined by the buyer problem—reducing store and fulfillment labor while maintaining customer experience—rather than by any single robot form factor.
