- id: market-sizing-lenses-and-estimate-dispersion
  title: Market Sizing Lenses and Estimate Dispersion
  body: 'Market sizing for humanoid robotics is unusually unstable because analysts are often measuring different things: some count only hardware revenue, others include software and services, and still others model long-run labor replacement rather than near-term sales. Morgan Stanley’s long-horizon view is among the most bullish, projecting nearly 1 billion humanoids globally by 2050, about 90% of them in industrial or commercial settings, with China alone potentially reaching 302.3 million units in use. Goldman Sachs is also optimistic but still conditional: one report cited at least a $6 billion market in 10 to 15 years and a $154 billion blue-sky case by 2035 if product design, affordability, and public acceptance hurdles are overcome. By contrast, Interact Analysis argues that despite a theoretical $2 trillion addressable market, actual global humanoid shipments may only reach about 40,000 units and roughly $2 billion of revenue by 2032.


    China-specific estimates are no cleaner. One market-research source puts the China humanoid market at about $173.5 million in 2025 growing to $1.69 billion by 2034; another places it at $205 million in 2024 and almost $5.93 billion by 2032; and China Daily cited a conference estimate of 2.76 billion yuan in 2024 reaching 75 billion yuan by 2029. The spread is too wide to average mechanically. Instead, the dispersion itself is the insight: the market is real enough to attract capital and policy attention, but methodology remains immature and highly assumption-sensitive.


    For diligence, the most credible approach is to pair top-down TAM lenses with nearer adjacent markets that already exist—warehouse robotics, service robotics, self-checkout, and retail automation—and then further narrow into the subset of those budgets where a mobile manipulator creates incremental ROI. A clean chapter should therefore preserve contradictory estimates rather than smoothing them away, because disagreement is a core characteristic of the market today.'
