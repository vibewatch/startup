      - number: '8.4'
        title: Comparable set and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              A useful valuation framework for Galbot must be hybrid. On one end, Figure AI’s official $39 billion
              Series C shows how much capital global markets can still assign to a perceived category leader. On
              another, Chinese peers and public-company comparables show that pricing pressure, market discounts, and
              disclosure differences can quickly compress that optimism. That is why the scenario framework matters more
              than a single point estimate. The bull case assumes Galbot becomes a clear domestic industrial leader with
              genuine revenue scale and much richer strategic optionality. The base case assumes meaningful progress but
              ongoing discounts for concentration, disclosure, and policy risk. The bear case assumes that
              commercialization slips or that concentration and regulation materially weaken future financing leverage.
              These ranges are wide, but the width reflects reality: public evidence today supports direction more
              confidently than precision.
