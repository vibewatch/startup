      - number: '7.4'
        title: Partner dependency and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The company’s strongest external proof points double as concentration risks. CATL gives Galbot a
              prestigious industrial reference and a financing signal, but it also concentrates both demand credibility
              and investor confidence in one relationship. Bosch-linked partnerships, state-backed capital, and
              NVIDIA-associated tooling make the company look strategically connected, yet each tie also reduces freedom
              if terms change, politics shift, or platform access tightens. Financially, the company is still hard to
              underwrite cleanly because public evidence gives valuation and fundraising numbers without comparable
              disclosure on revenue, burn, or support economics. That combination creates a specific downside pattern:
              if buyer demand stays narrower than the headline deployment set suggests, Galbot may still appear
              prominent while needing continued capital at uncertain terms. The gap between Galbot’s $3 billion
              valuation and Figure’s much larger U.S. peer mark should therefore be read partly as a risk discount, not
              just as optional upside.
