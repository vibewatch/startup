      - number: '5.2'
        title: Hardware Platform and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Official Galbot materials provide an unusually concrete hardware envelope for G1. The platform stands 1730
              mm tall in standard posture, lifts its torso 650 mm, extends to a 0–2100 mm vertical workspace, and uses
              710 mm arms with roughly 190 cm span to cover shelving and counters above and below standard human waist
              height. Dual-arm payload is listed at 5 kg, enough for medication trays, snack bags, bottles, and light
              industrial parts rather than heavy manufacturing loads. Power comes from a 48V 30Ah lithium battery with
              claimed operating duration up to 10 hours, paired with WiFi, Ethernet, USB, and cloud integration for
              fleet supervision. The design choice that most affects deployment economics is the wheel-foot mobility
              structure: Galbot appears to optimize for stable indoor navigation and longer runtime while preserving
              human-space reach through a torso lift and long arm geometry. The six-and-a-quarter-inch touchscreen gives
              local operator interaction, while multimodal vision, tactile, and depth sensing support the
              embodied-control stack above the hardware. One specification conflict remains: the official bundle cites
              roughly 92.5 kg body weight, while secondary reviews sometimes quote 85 kg.
            claimRefs:
