      - number: '5.3'
        title: AI Stack, Data Engine, and Developer Surface
        blocks:
          - type: paragraph
            body: >-
              Galbot's software story is built around verticalized vision-language-action models rather than a single
              generic foundation model. GraspVLA is positioned as the core embodied grasping model, trained on billions
              of simulated interactions and supported by DexGraspNet-scale grasp data, with the commercial promise of
              zero-shot handling of unseen objects and tasks. TrackVLA extends the stack into navigation and following
              behaviors by visually tracking people or objects, accepting voice commands, and re-acquiring the target
              after temporary visual loss. GroceryVLA narrows the abstraction to retail manipulation by claiming it can
              handle deformable snack bags, rigid bottles, and fragile jars in cluttered stores without per-SKU
              reprogramming. Across these modules Galbot describes a brain-cerebellum-neural-control architecture that
              compresses perception, decision, and low-latency feedback control into a more end-to-end pipeline than
              legacy robotics stacks. The data-moat claim rests on 10 billion-plus data points and a Sim2Real loop that
              leans heavily on synthetic data generation, reportedly using NVIDIA Isaac Sim, followed by limited
              real-world fine-tuning. The public developer platform suggests a real integration surface exists, but
              public documentation remains thinner than what leading global embodied-AI peers expose.
            claimRefs:
