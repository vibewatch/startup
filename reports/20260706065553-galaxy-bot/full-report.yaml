  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The right starting point for Galbot is the current financing mark, not a conventional discounted cash-flow
              exercise. Public evidence gives a strong headline: more than $300 million raised at roughly a $3 billion
              valuation in March 2026, following earlier financing that appears to push cumulative capital above $1.15
              billion. That is enough to treat Galbot as one of the best-capitalized Chinese humanoid companies. It is
              not enough to treat the current price as obviously fair. Public sources still do not disclose audited
              revenue, gross margin, burn rate, or the detailed cap-table stack that determines whether the headline
              post-money translates into attractive common-equity entry. This is why entry discipline matters more than
              category excitement. A new investor should assume that structure, concentration, and commercialization
              timing are at least as important as the market-size narrative.
            claimRefs:
              - CV001
              - CV002
              - CV003
