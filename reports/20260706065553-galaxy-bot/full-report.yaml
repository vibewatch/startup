      - number: '2.4'
        title: Demand Drivers, Constraints, and Galbot Implications
        blocks:
          - type: paragraph
            body: >-
              China clearly has the macro conditions to support automation demand. Robot density reached 470 per 10,000
              manufacturing employees in 2023, up from 402 in 2022, placing China third globally behind Korea and
              Singapore. The 14th Five-Year Plan for the robotics industry aimed for annual revenue growth above 20% and
              a doubling of industrial robot intensity by 2025. Meanwhile, China’s working-age population share fell to
              61.3% in 2023, and retirement-age reforms beginning in 2025 will gradually push men from 60 to 63 and
              women from 50/55 to 55/58. Those shifts do not guarantee humanoid adoption, but they do reinforce the
              policy and labor backdrop for more automation spending.


              Still, the market constraints are concrete and near-term. Interact Analysis highlights safety, dexterity,
              cost, and form-factor uncertainty; warehouse-robotics research highlights high initial investment and
              maintenance burden; service-robotics research points to privacy, interoperability, and standardization
              issues; and labor-market studies show that automation can create political and organizational resistance
              when workers face wage or employment pressure. VoxDev’s China evidence is especially important because it
              moves the risk discussion from theory to measured labor outcomes: robot exposure reduced employment
              probability and wages for affected groups while pushing workers toward retraining or early retirement.


              For Galaxy Bot, the implication is that market attractiveness depends less on macro TAM rhetoric than on
              proving task-level ROI in constrained use cases. The best early wedge is where China’s automation-friendly
              policy environment meets severe labor pressure and where a multi-purpose mobile manipulator can do more
              than a self-checkout kiosk, a service robot, or an AMR. The worst place to over-invest is in broad claims
              that all retail environments are ready for humanoids. The market is growing, capital is abundant, and
              strategic investors are engaged—but commercial proof still has to outrun hype.
