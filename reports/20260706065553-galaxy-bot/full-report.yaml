              fleet-operations ledger that would prove factory-scale reliability. The strongest quantified proof point
              is healthcare: media coverage of Beijing pharmacy deployments cites 10-plus operational sites, 24/7
              operating patterns, and 99.5% medication-handling success, while retail coverage says a single G1 can
              autonomously operate a 50 square meter store and that the rollout target expands toward 100-plus pharmacy
              or store sites. These are useful maturity signals because they imply repeated integration into live
              environments with shelves, SKUs, and staff workflows. Industrial maturity is more promising than proven.
              Bosch and UAES joint-venture announcements show Galbot is being taken seriously by process-manufacturing
              and automotive partners, but public documents still stop short of publishing line-level throughput, MTBF,
              recovery times, or service staffing ratios. The competitive implication is that Galbot appears credible
              for semi-structured indoor operations today, but roadmap credibility for 99.9%-plus industrial accuracy
