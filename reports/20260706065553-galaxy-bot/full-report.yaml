companyProfile:
  summary: >
    Galaxy Bot, publicly branded as Galbot, is a Beijing-based embodied-AI robotics company founded in May 2023. Public
    materials position the company around general-purpose mobile manipulation and humanoid-style retail, industrial, and
    healthcare workflows, including inventory handling, replenishment, packaging, pharmacy operations, and factory
    automation. The company combines research-led embodied AI with practical robotics deployment experience and has
    attracted strategic backing from CATL and later state-linked Chinese capital. By 2026, public coverage indicates
    Galaxy Bot had advanced well beyond its June 2025 $153 million Series B milestone, but its revenue base and unit
    economics still remain private.
