      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The strongest public founder evidence points to a two-person operating nucleus: He Wang on the research
              and model side, and Yao Tengzhou on the commercialization and robotics-industry side. Peking University’s
              faculty page confirms that He Wang is a tenure-track assistant professor at CFCS, received his PhD from
              Stanford in 2021 under Leonidas Guibas, and serves as director of the PKU-Galbot joint lab of embodied AI.
              The official Galbot site’s embedded team content similarly presents him as the flagship scientific figure
              behind the company. That gives Galaxy Bot unusually strong founder-market fit for an embodied-AI startup:
              the lead technical founder is an active academic with deep 3D vision, robot learning, and grasping
              credentials rather than a pure operator imported from adjacent software markets.


              Baidu Encyclopedia’s company and founder entries add the operational counterpart. They identify Yao
              Tengzhou as co-founder and legal representative, describe him as a Beihang Robotics Institute graduate,
              and note prior work at ABB’s Shanghai robot R&D center. That background is consistent with the company’s
              commercial thesis: combining frontier robot-learning research with pragmatic hardware design,
              manufacturing, and deployment experience. Baidu also names Guo Xiaoliang as chairman, which suggests some
              governance formalization beyond the two founders as the company scaled and completed shareholding reform
              in late 2025.


              Governance transparency, however, is still thin by institutional-investor standards. No reviewed source
              provides a clean public board roster, voting structure, or investor rights summary. That is not unusual
              for a Chinese private robotics company at this stage, but it increases diligence dependence on management
              access. A follow-up investor session should request the current cap table, board composition, reserved
              matters, and whether CATL, Puquan Capital, Meituan, Bosch-linked entities, or state-backed funds hold
              special governance rights that could influence strategy, procurement, or exit timing.
