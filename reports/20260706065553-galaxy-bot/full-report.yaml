      - number: '1.4'
        title: Milestones, Scale Signals, and Unresolved Questions
        blocks:
          - type: paragraph
            body: >-
              Galaxy Bot’s operating story is unusually fast for a company founded in 2023. Baidu’s company chronology
              points to angel financing in 2023, a Peking University joint lab and first-generation robot unveiling in
              2024, GraspVLA in January 2025, a smart-retail solution in March 2025, a Bosch-linked JV in June 2025, and
              a CATL strategic production-line partnership in June 2026. The Robot Report’s mid-2025 coverage describes
              the G1 as a wheeled dual-arm mobile manipulator built to automate inventory, replenishment, delivery, and
              packaging, with nearly 10 Beijing stores deployed and a plan to reach 100 stores nationwide within the
              year. Later company-linked reporting pushes those scale claims further, saying Galbot Store operated in
              more than 30 cities and that the company had secured orders for thousands of units.


              The technology narrative is credible enough to explain investor enthusiasm. ArXiv papers show GraspVLA and
              TrackVLA as real published technical programs, while NVIDIA documented DexGraspNet as a large simulated
              dexterous-grasp dataset built by Galbot. This supports the view that the company is not merely integrating
              off-the-shelf robot hardware; it is trying to build a proprietary embodied-model stack spanning grasping,
              tracking, and retail task execution. That differentiation matters because many competitors in humanoid
              robotics still depend on eye-catching demos rather than domain-specific task learning.


              Even so, the most prudent overview ends with caution. KR Asia, MERICS, and the U.S.-China Economic and
              Security Review Commission all highlight the same macro risk: commercialization remains early, costs are
              still high, precision and autonomy remain limited, and investors are increasingly worried that
              humanoid-robot valuations are outrunning revenue. For Galaxy Bot specifically, there is still no public
              evidence on revenue, gross margin, burn, exact headcount, customer concentration, or the conversion rate
              from pilots to production deployments. Those omissions do not negate the company’s technical momentum, but
              they do mean that the most attractive parts of the narrative are still more proven in capability terms
              than in mature financial terms.
