        title: Revenue model, pricing, and recognition issues
        blocks:
          - type: paragraph
            body: >-
              Galbot's public commercial story implies several revenue streams even though the company does not publish
              a full financial breakdown. The most visible stream is hardware sales of the G1 platform, but those sales
              likely arrive bundled with integration work, deployment configuration, and support commitments that blur
              the line between equipment revenue and implementation services. A second stream appears in retail and
              pharmacy operations, where Galbot Store and pharmacy deployments suggest an operator or managed-service
              model rather than a one-time product sale. Industrial projects with CATL, Mercedes-Benz, and Bosch-linked
              partners imply larger enterprise contracts with longer acceptance cycles, and healthcare deployments
              introduce service-quality and reliability obligations that can complicate revenue recognition timing. What
              is missing is just as important: Galbot does not publish ASP, contract duration, whether any store
              economics are revenue-share based, or whether software or model licensing is booked separately from
              hardware. That leaves the revenue model legible in shape but still opaque in actual mix and accounting.
