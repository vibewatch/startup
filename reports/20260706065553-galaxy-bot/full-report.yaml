  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Mechanism
      - Evidence
      - Implication for Galaxy Bot
    rows:
      - - Shrinking working-age population
        - driver
        - Fewer workers raise interest in productivity-enhancing automation
        - Working-age share fell to 61.3% in 2023
        - Supports long-run automation demand, especially in labor-tight formats
      - - Retirement-age reform
        - mixed driver
        - Raises labor-force participation but also signals structural aging and pension pressure
        - Men rise to 63; women to 55/58 over time
        - Automation demand remains supported, but urgency may vary by segment
      - - China policy support for robotics
        - driver
        - Industrial plans, standards work, and revenue-growth targets de-risk ecosystem buildout
        - 14th Five-Year Plan targets >20% annual growth and doubled robot intensity
        - Improves supplier base and policy alignment for domestic robotics firms
      - - High robot density and manufacturing base
        - driver
        - Existing automation ecosystem lowers component, integration, and learning costs
        - China reached 470 robots per 10,000 manufacturing workers in 2023
        - Favors industrial and logistics deployments before messy retail settings
      - - Safety and dexterity limits
        - constraint
        - Humanoids can topple, struggle with manipulation, and remain below human productivity in many tasks
        - Interact Analysis identifies safety and dexterity as primary barriers
        - Limits broad in-store deployment without constrained use-case design
      - - Capital intensity and maintenance burden
        - constraint
        - Robots promise ROI but require high up-front and lifecycle spend
        - Warehouse and service-robot sources highlight high initial investment and maintenance cost
        - Pushes buyers toward pilots, RaaS, or cheaper substitutes first
      - - Substitute technologies
        - constraint
        - Self-checkout, smart carts, service robots, and warehouse AMRs solve slices of the problem more cheaply
        - Amazon removed Just Walk Out while self-checkout market continues to grow
        - Galbot must prove multi-task superiority rather than generic automation value
      - - Funding exuberance vs PMF
        - constraint
        - Capital can outrun revenue validation in embodied AI
        - Yicai reports funding frenzy but no proven large-scale commercial applications
        - Valuation upside exists, but market-entry discipline matters
    notes: >-
      Drivers and constraints are intentionally paired because most positive adoption forces also carry execution,
      political, or ROI risks.
