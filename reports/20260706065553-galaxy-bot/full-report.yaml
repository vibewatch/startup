appendices:
  - id: A
    title: Methodology and source coverage
    blocks:
      - type: paragraph
        body: >
          This report is based solely on public sources reviewed through 2026-07-06, including official company pages,
          university and company-profile materials, independent news outlets, analyst market commentary, and regulatory
          or legal sources. No management interviews, customer references, confidential data rooms, or unpublished
          financial statements were used.
        claimRefs: []
      - type: paragraph
        body: >
          Because Galaxy Bot is private and financially opaque, this report relies heavily on triangulating fundraising
          events, partner announcements, deployment case studies, and market structure evidence. That approach is useful
          for strategic diligence but materially weaker than audited revenue and cohort data for underwriting intrinsic
          value.
        claimRefs: []
