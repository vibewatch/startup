      - number: '4.3'
        title: Cost structure, margin drivers, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Galbot's cost structure is almost certainly more hardware-heavy than software investors may instinctively
              assume. A humanoid deployment embeds bill-of-materials costs, electromechanical components, batteries,
              sensors, compute, factory labor, field installation, and ongoing service support. That means gross margin
              will be governed not only by pricing power but also by yield, utilization, warranty burden, and service
              efficiency. Public sources do not disclose a Galbot gross margin, yet broader physical-AI and robotics
              context suggests the margin band is likely far below pure SaaS and dependent on manufacturing maturity.
              Working capital is another likely drag: robots and parts must be financed through inventory and deployment
              cycles before cash is fully recovered, especially if enterprise buyers negotiate milestone-based payments.
              The March 2026 financing likely funds exactly these pressures—manufacturing scale-up, model development,
              and field deployment expansion—which is why Galbot should be underwritten as a capital-intensive
              physical-AI company, not as an asset-light AI software vendor.
