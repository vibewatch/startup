      - number: '6.3'
        title: Named Customer Proof and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is strongest where Galbot or high-credibility financing coverage explicitly links a
              customer logo to a live workflow. CATL is the clearest industrial anchor because it is described as both
              lead investor and customer, with factory routine operations and large cumulative orders tied to the
              relationship. Xuanwu Hospital is the clearest healthcare anchor because the company publicly scoped
              patient rooms, pharmacies, and hospital guidance around that collaboration. BAIC, SAIC, and Toyota are
              meaningful logos, but not all carry the same evidentiary weight; they appear largely in funding or profile
              coverage as named ordering or aligned industrial customers rather than deep case studies. Mercedes-Benz
              and Zeekr appear in TechNode reporting about wheeled robots at local factories without detailed
              operational write-ups. Bosch and UAES are best treated as hybrid partner-customer channels: the joint
              ventures validate market demand and factory access, but public materials do not yet prove normalized fleet
              purchases from those entities. Retail evidence is unusual because Galbot's own stores are both proof of
