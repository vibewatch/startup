  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market frame for Galaxy Bot is narrower than “all humanoids” and broader than “robots in
              stores.” Galbot’s stated jobs-to-be-done—inventory checks, replenishment, picking, delivery, and
              packaging—touch three already-existing automation pools: retail automation, service robotics, and
              warehouse/logistics robotics. China’s total retail sales reached 48.79 trillion yuan in 2024, with online
              retail sales of physical goods at 13.08 trillion yuan and 26.8% of the total. That matters because a
              retailer deciding whether to automate store labor is not only comparing Galaxy Bot against human staff; it
              is also comparing against self-checkout, smart carts, electronic shelf labels, barcode/RFID workflows,
              autonomous mobile robots, and even channel migration to e-commerce fulfillment. In other words, the
              relevant budget is fragmented across store operations, IT, facilities, and supply-chain automation rather
              than a clean “humanoid robot” line item.


              Adjacent-market data reinforces that point. China’s self-checkout market alone is estimated at about $330
              million in 2024 and $1.3 billion by 2035, while global warehouse robotics is already a
              multi-billion-dollar category and global service robotics is larger still. These markets solve parts of
              the same operating problem with lower technical ambition. A grocer that wants faster checkout and fewer
              front-end cashiers can install self-checkout or smart carts. A retailer or pharmacy that wants repetitive
              transport and delivery can use wheeled service robots. A 3PL or e-commerce warehouse can invest in AMRs,
              AGVs, or picking systems. Galaxy Bot only wins if a mobile manipulator or humanoid form factor is
              measurably better than these substitutes across multiple tasks inside constrained physical environments.


              This boundary logic matters for valuation. A company can cite trillion-dollar humanoid forecasts, but if
              its near-term customer budget competes with much cheaper point solutions, its actual serviceable market is
              a filtered subset of retail and fulfillment labor spend. That is why this chapter treats retail
              automation, self-checkout, service robotics, warehouse robotics, and e-commerce substitution as part of
              the same buyer decision tree.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM009
              - CM045
