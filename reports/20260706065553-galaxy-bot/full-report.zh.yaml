      - number: '2.3'
        title: 买方、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Galbot 的买方分层最好按工作流理解，而不是按机器人分类。大卖场和超市关心上架准确率、门店劳动生产率、结账吞吐和损耗管理。便利店和药房关心 24/7
              轻人力运营、补货，以及小面积场地里的服务速度。餐饮和酒店经营者更在意重复配送和服务支撑，而不是拟人能力。仓库和 3PL
              关心能否安全、低成本地移动商品、周转箱和纸箱。工业制造商关心结构化重复任务，因为这些场景机器人利用率高、流程环境可预测。每个细分市场都有不同的使用者、付费方和接受门槛。


              市场给出的最重要采用经验是：规模化商业化迄今最先出现在结构化环境里。Agility Robotics 和 GXO 称，双方在试点后签署了首个正式商业人形机器人部署和首个 RaaS 人形机器人协议，Digit
              在真实物流作业中搬运周转箱。China Daily 的行业报道从中国侧给出同样判断：工业制造被视为首个主要人形机器人应用领域，因为其标准化程度高，也更容易约束环境。这对 Galbot
              是有意义的信号。虽然公司的零售故事有吸引力，但更广泛的买方证据仍支持仓库、物流和工业场景，胜过高变化、面向顾客的门店环境。


              零售还面临严酷的替代集合。Amazon 从 Fresh 门店撤下 Just Walk
              Out，转向智能购物车，以保留便利性并让购物者实时看到账单。这很重要，因为它说明，即便资金充足的零售自动化实验，也会在客户信任、经济性或运营透明度崩塌时重新设计。实践中，门店自动化预算可能先流向更简单的方案；人形机器人或移动操作机器人只会留给那些场所：一台设备能替代多套更窄系统，或在药房、小型门店、混合零售履约等难招人的业态里实质降低劳动力。
