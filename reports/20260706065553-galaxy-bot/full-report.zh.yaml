  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与排序
        blocks:
          - type: paragraph
            body: >-
              Galbot
              的风险画像不是被某个致命缺陷主导。公司融资可信、部署可见，也有中国本土市场顺风；但这些正面因素可能掩盖一个事实：人形机器人经济性要变得可持续，许多依赖项必须同时跑通。最严重的风险出现在政策、商业化和集中度交叉处。中国的标准和
              数字身份制度最终可能帮到可信供应商，但短期内会形成具体的合规门槛和召回义务。与此同时，公开报道仍显示，赢得买方比造出机器人更难；因此，即便技术演示 表现好，规模假设也可能落空。再叠加 CATL
              集中、高硬件资本强度和未披露收入指标，下行情形就不是单点爆雷，而是多项风险累积。
