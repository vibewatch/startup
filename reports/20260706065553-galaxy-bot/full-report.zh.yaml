      - number: '2.4'
        title: 需求驱动、约束与 Galbot 含义
        blocks:
          - type: paragraph
            body: >-
              中国显然具备支撑自动化需求的宏观条件。2023 年机器人密度达到每 10,000 名制造业员工 470 台，高于 2022 年的 402
              台，位居全球第三，仅次于韩国和新加坡。机器人产业“十四五”规划目标是年收入增速超过 20%，并到 2025 年将工业机器人使用密度翻番。与此同时，中国劳动年龄人口占比 2023 年降至 61.3%，2025
              年启动的退休年龄改革将逐步把男性从 60 岁推至 63 岁，女性从 50/55 岁推至 55/58 岁。这些变化不保证人形机器人一定被采用，但确实强化了政策和劳动力背景，支持更多自动化支出。


              但市场约束是具体且短期的。Interact Analysis
              强调安全、灵巧性、成本和形态不确定性；仓储机器人研究强调前期投资高、维护负担重；服务机器人研究指出隐私、互操作性和标准化问题；劳动力市场研究显示，当员工面临工资或就业压力时，自动化会引发政治和组织阻力。VoxDev
              的中国证据尤其重要，因为它把风险讨论从理论拉到可测量的劳动结果：机器人暴露降低了受影响群体的就业概率和工资，同时把劳动者推向再培训或提前退休。


              对 Galaxy Bot 而言，市场吸引力不取决于宏观 TAM 话术，而取决于能否在受限用例中证明任务级
              ROI。最佳早期切入点，是中国友好的自动化政策环境与严重劳动力压力重叠之处，并且多用途移动操作机器人能做得比自助结账亭、服务机器人或 AMR
              更多。最不应过度投入的地方，是宣称所有零售环境都已准备好迎接人形机器人。市场在增长，资本充裕，战略投资人已参与——但商业证明仍必须跑赢热度。
