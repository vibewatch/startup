      - number: '7.5'
        title: 缓释因素、监控重点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Galbot 并非没有防线。全栈架构可以减少产品最战略部分对外部供应商的依赖；国资背景投资人加上工业、零售、医疗场景的参考部署，也比许多更早期人形机器人
              初创公司拥有更强地基。监管框架也有有利的双刃剑一面：一旦清晰标准和数字身份工作流被内化，资本更充足的供应商可能受益于小竞争对手无法跨过的门槛。中国之外，治理预期也在变得更正式：NIST 把可信 AI
              定义为全组织风险管理纪律，而不是狭义模型调优。但这些缓释因素无法抹掉核心尽调问题。投资人仍需要证明：合规工作流已经可运行，CATL
              集中度没有过高，正常运行时间和服务成本能支撑替代人工的叙事，且一次严重现场事故不会演变成召回和融资问题。因此，正确姿态是边跟踪边建立信念，而不是一概怀疑。
