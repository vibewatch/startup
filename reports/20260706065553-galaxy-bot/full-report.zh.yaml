      - number: '4.6'
        title: 财务结论与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Galbot 的财务图景结合了强资产负债表代理指标与弱披露质量。看多情景很直接：公司已融到足够多的钱，有能力成为重要玩家；跨多个垂直领域拥有可信部署参考；并且似乎是在战略支持而非资金绝境中，同时投入制造和具身
              AI 研发。看空情景同样清楚：投资者仍无法验证收入、毛利率、烧钱速度、回本周期、客户集中度，甚至无法验证硬件、服务和运营商收入之间的拆分。这很关键，因为该品类已经面临真实买方需求质疑，而且与 Figure
              等美国同行存在严重估值差距。因此，财务结论是：资本充足性谨慎正面，透明度中性偏负，收入质量尚未解决。核心尽调要求不是再看一次愿景演示，而是一张按日期串起订单、已交付单元和已确认收入的财务桥，并按业务线披露利润率和现金消耗。
