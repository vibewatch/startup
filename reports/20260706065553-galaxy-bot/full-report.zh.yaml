      - number: '6.4'
        title: 留存代理指标、扩张路径与渠道动态
        blocks:
          - type: paragraph
            body: >-
              Galbot 不公布 NRR、GRR、客户留存、流失率或合同期限数据，所以客户耐久性只能从结构性信号推断。最正面的代理指标是运营连续性：官方材料提到仓储场景 24/7
              使用超过一年，药房部署也在继续，这意味着至少有部分客户选择把机器人留在工作流里，而不是试点后撤掉。第二个代理指标是战略绑定。CATL
              同时是投资方和客户，很可能加深锁定，因为这段关系横跨资本、信用背书和工厂使用；但同样的紧密度也引入关联方风险。扩张路径看起来通过三类渠道推进：面向标杆工业和医疗账户的企业直销，通过 Bosch 和 UAES
              进入制造业的伙伴渠道，以及 Galbot 自营零售形态——先验证自身经济性、收集数据，再把模板向外销售。药房从 10 多个点位走向 100
              多个点位的铺开目标，也暗示如果单个工作流验证成立，可以复制到更多地点，就能形成先落地再扩张的打法。缺口仍是商业质量披露：公开信息没有说明续约时间、机队追加销售率、软件绑定率，也没有说明已安装基座中有多少是付费生产环境，多少是补贴式战略铺开。
