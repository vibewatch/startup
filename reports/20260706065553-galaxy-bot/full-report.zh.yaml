  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 方向
      - 机制
      - 证据
      - 对 Galaxy Bot 的含义
    rows:
      - - 劳动年龄人口收缩
        - 驱动
        - 劳动力减少，企业更愿意关注提升生产率的自动化
        - 2023 年劳动年龄人口占比降至 61.3%
        - 支撑长期自动化需求，尤其是用工紧张业态
      - - 退休年龄改革
        - 混合驱动
        - 提高劳动参与率，同时也暴露结构性老龄化和养老金压力
        - 男性逐步提高至 63 岁；女性提高至 55/58 岁
        - 自动化需求仍有支撑，但紧迫性因细分市场而异
      - - 中国机器人政策支持
        - 驱动
        - 产业规划、标准工作和收入增长目标，降低生态建设风险
        - “十四五”规划目标为年增长 >20%，机器人密度翻倍
        - 国内机器人公司的供应商基础和政策顺风更强
      - - 高机器人密度和制造基础
        - 驱动
        - 现有自动化生态降低零部件、集成和学习成本
        - 2023 年中国每 10,000 名制造业工人拥有 470 台机器人
        - 先利好工业和物流落地，再进入更复杂的零售场景
      - - 安全性和灵巧度限制
        - 约束
        - 人形机器人可能跌倒，操作能力仍吃力，很多任务的生产率低于人类
        - Interact Analysis 将安全性和灵巧度列为主要障碍
        - 若不把用例约束清楚，难以在门店大范围部署
      - - 资本强度和维护负担
        - 约束
        - 机器人有 ROI 预期，但前期投入和全生命周期支出都高
        - 仓储和服务机器人资料都强调初始投资和维护成本高
        - 买方会先转向试点、RaaS 或更便宜的替代品
      - - 替代技术
        - 约束
        - 自助结账、智能购物车、服务机器人和仓储 AMR 能更便宜地解决部分问题
        - Amazon 下线 Just Walk Out，同时自助结账市场继续增长
        - Galbot 必须证明多任务优势，而不是泛泛证明自动化价值
      - - 融资热度 vs PMF
        - 约束
        - 在具身 AI 里，资本可能跑在收入验证前面
        - Yicai 报道融资狂热，但尚无已验证的大规模商业应用
        - 估值上行空间存在，但市场进入纪律很关键
    notes: 驱动因素和约束有意成对呈现，因为大多数正向采用力量也伴随执行、政治或 ROI 风险。
