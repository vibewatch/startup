      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              公开创始人证据最强地指向一个双人运营核心：He Wang 负责研究和模型侧，Yao Tengzhou 负责商业化和机器人产业侧。Peking University 的教师主页确认，He Wang 是 CFCS
              预聘制助理教授，2021 年获 Stanford 博士学位、师从 Leonidas Guibas，并担任 PKU-Galbot 具身 AI 联合实验室主任。Galbot
              官网嵌入的团队内容同样把他呈现为公司背后的标志性科学人物。这让 Galaxy Bot 在具身 AI 创业公司中拥有异常强的创始人—市场匹配：首席技术创始人是仍在一线研究的学者，具备深厚的 3D
              视觉、机器人学习和抓取履历，而不是从相邻软件市场转入的纯运营者。


              Baidu Encyclopedia 的公司和创始人条目补上了运营侧人物。条目称 Yao Tengzhou 为联合创始人和法定代表人，描述其毕业于 Beihang 机器人研究所，并曾在 ABB
              上海机器人研发中心工作。这个背景与公司的商业命题一致：把前沿机器人学习研究，与务实的硬件设计、制造和部署经验拼在一起。Baidu 还称 Guo Xiaoliang 为董事长，说明公司在扩张并于 2025
              年底完成股份制改革后，治理正式化程度可能已超出两位创始人的小核心。


              不过，以机构投资者标准看，治理透明度仍偏薄。审阅来源没有提供清晰的公开董事名单、投票结构或投资人权利摘要。这对当前阶段的中国民营机器人公司并不罕见，但会提高尽调对管理层访谈的依赖。后续投资人会议应要求公司提供当前股权结构、董事会构成、保留事项，以及
              CATL、Puquan Capital、Meituan、Bosch 关联实体或国资基金是否持有可能影响战略、采购或退出时点的特殊治理权。
