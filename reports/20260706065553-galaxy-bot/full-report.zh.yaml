      - number: '8.5'
        title: 建议、退出逻辑与最终尽调
        blocks:
          - type: paragraph
            body: >-
              本章结论是 research-more。这不是否定 Galbot 的战略位置，而是判断当前公开记录仍留下太多未解问题，无法把 $3 billion
              标记称作有吸引力。公司确有优势，包括资本深度、可信的本土市场位置和可见部署；但缺失项恰好是入场质量最关键的部分：审计经济性、资本结构条款、交易对手集中度、出货真实性数据集和详细合规姿态。合理持有期可能是四到六年，因为商业化成熟度和
              IPO 准备度 大概率落后于融资故事。建立信念的最佳路径不是更多叙事，而是更窄、更硬的证据。如果审计财务、重复客户扩张和更干净的集中度调整后单位经济性
              出现，估值立场可能从偏贵走向公允。在那之前，最终尽调应承担主要工作。
