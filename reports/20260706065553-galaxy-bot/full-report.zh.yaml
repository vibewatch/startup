companyProfile:
  summary: >
    Galaxy Bot 公开品牌为 Galbot，是一家 2023 年 5 月成立、总部位于北京的具身 AI
    机器人公司。公开资料把公司定位在通用移动操作和类人形零售、工业、医疗流程上，场景包括库存处理、补货、包装、药房运营和工厂自动化。 公司把研究驱动的具身 AI 与实际机器人部署经验结合起来，并获得 CATL
    以及之后带国资背景的中国资本战略背书。到 2026 年，公开报道显示 Galaxy Bot 已明显越过 2025 年 6 月 $153 million Series B 里程碑，但收入基础和单元经济仍未公开。
  foundedDate: '2023-05-19'
