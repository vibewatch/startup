  - id: TE002
    title: AI/软件栈
    columns:
      - 组件
      - 描述
      - 声称能力
      - 差异化
      - 证据质量
    rows:
      - - GraspVLA
        - 端到端具身抓取基础模型
        - 无需额外训练，即可零样本泛化到新物体和新任务
        - 把大规模仿真预训练与自有机器人执行闭环结合
        - 中高：官方和行业媒体相互印证，但没有公开基准测试套件
      - - TrackVLA
        - 导航与目标跟踪模型
        - 跟随人或物体，接受语音指令，遮挡后恢复跟踪
        - 在杂乱空间里把移动能力和意图跟随接起来
        - 中：公司材料有描述，但外部技术细节有限
      - - GroceryVLA
        - 零售专用操作模型
        - 无需逐品类重编程，即可处理可变形、刚性和易碎物品
        - 针对真实门店库存做垂直专精，而不是泛化机器人演示
        - 中高：官方描述和部署报道支撑
      - - 大脑-小脑-神经控制架构
        - 感知-决策-控制一体化栈
        - 把多模态输入转成低延迟动作闭环
        - 声称比传统模块化机器人栈更端到端
        - 中：架构停留在营销层描述，没有系统论文
      - - 开发者平台
        - 公开开发者门户和手册
        - 提供集成和二次开发接口
        - 说明 Galbot 想做伙伴可扩展性，而不只是卖封闭设备
        - 中：门户存在公开可见，API 深度仍不清楚
      - - Sim2Real 数据引擎
        - 合成数据预训练加有限真实世界微调
        - 减少人工重标注，加快迁移到新场景
        - 若仿真质量足够高，可能形成数据飞轮优势
        - 中高：有独立报道，但未经基准测试验证
    notes: 证据质量衡量每项说法有多少来自一手技术细节，而不是二级报道。目前没有公开基准测试仓库或可复现评估工具链可用于这些模型。
