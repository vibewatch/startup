      - number: '3.5'
        title: 护城河耐久度与反向情景
        blocks:
          - type: paragraph
            body: >-
              Galbot 的反向情景不是没有竞争者，而是强竞争者太多，且同时存在：它们都有重叠的 VLA 叙事，却都还未完整证明广泛买方愿意付费。外部批评仍很尖锐。TechXplore
              引述观察人士称，许多人形机器人仍是表演性大于功能性，真实用例仍很窄。市场领导权说法也很嘈杂：AgiBot 在部分 2025 出货数据集中排名第一，但 Unitree
              用自己的出货说法质疑这一领先地位。最后，中国估值基准仍远低于 Figure 等美国同行，这意味着即便部署叙事看似可比，资本市场仍在折价中国人形机器人玩家的耐久度或全球变现能力。最稳妥的判断是：Galbot
              在中国本土部署入口和垂直栈所有权上确有近端护城河；但除非它能证明经济性更好、学习循环更快、真实世界利用率高于正奔向同一架构的竞争对手，否则长期护城河耐久度只有中等。
