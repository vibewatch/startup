      - number: '1.3'
        title: 资本结构与战略支持方
        blocks:
          - type: paragraph
            body: >-
              公开融资证据在 2025 年 6 月这一轮最扎实。Crunchbase 的独角兽榜单文章称 Galaxy Bot 获 Contemporary Amperex Technology 领投 $153
              million，估值 $1 billion。独立机器人和行业媒体随后补充轮次细节：The Robot Report、Ofweek、Exportsemi、Robotics & Automation News
              均称公司完成 RMB 1.1 billion 融资，由 CATL 和 Puquan Capital 领投，China Development Bank 的科技基金、Beijing Robot Industry
              Fund 以及其他中国风险投资人参与。合在一起，这些来源足以支撑一个高置信结论：Galaxy Bot 在 2025 年中越过独角兽门槛，CATL 是关键战略支持方。


              这个投资人组合的战略价值至少与估值标题同等重要。CATL 不只是财务出资方；到 2026 年 6 月，独立媒体 CNEVPost 和 Gasgoo 报道称，双方签署战略合作协议，Galbot S1 机器人已进入
              CATL 生产线。Bosch 关联资本是第二个值得关注的锚点。GlobeNewswire 和多家机器人媒体报道，Boyuan Capital、Bosch China 与 Galbot 设立合资公司并签署
              MOU，重点面向工业制造应用。这让 Galaxy Bot 获得两条特权商业化走廊：EV 电池制造和高精度工业自动化。


              在此之上，还有一个更激进、但置信度更低的增长故事。2025 年 12 月，Galbot 通过 PR Newswire 发布新闻稿，称完成超过 $300 million 融资、估值达到 $3 billion；The
              Robot Report 也复述了这些公司说法。由于这次后续估值跃升高度依赖公司端披露，而非广泛独立佐证，本章把 2025 年 6 月 CATL 领投轮和 $1 billion
              估值作为最清洁、外部锚定的资本事实，同时将之后的 $3 billion 数字标记为可信但尚未达到尽调级。
