      - number: '5.3'
        title: AI 栈、数据引擎与开发者接口
        blocks:
          - type: paragraph
            body: >-
              Galbot 的软件故事围绕垂直化视觉—语言—动作模型展开，而不是单一通用基础模型。GraspVLA 被定位为核心具身抓取模型，基于数十亿次仿真交互训练，并由 DexGraspNet
              规模的抓取数据支撑；商业承诺是对未见过的物体和任务实现零样本处理。TrackVLA 把栈延伸到导航和跟随行为：视觉追踪人或物体，接受语音命令，并在目标短暂丢失后重新捕获。GroceryVLA
              则把抽象收窄到零售操作，声称可在杂乱门店中处理可变形零食袋、刚性瓶和易碎罐，且无需针对每个 SKU 重新编程。Galbot
              把这些模块描述为“脑—小脑—神经控制”架构，把感知、决策和低延迟反馈控制压缩进一条比传统机器人栈更端到端的管线。数据护城河主张建立在超过 100 亿个数据点和 Sim2Real
              循环之上，后者高度依赖合成数据生成，据称使用 NVIDIA Isaac Sim，随后用有限真实世界数据微调。公开开发者平台说明确实存在真实集成接口，但公开文档仍比全球领先具身 AI 同行暴露得更少。
