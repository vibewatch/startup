      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >-
              具名客户证明，在 Galbot 或高可信融资报道明确把客户标识和实际工作流连起来时最强。CATL 是最清晰的工业锚点，因为材料把它同时描述为领投方
              和客户，并把工厂日常作业及大额累计订单同这段关系绑定。Xuanwu Hospital 是最清晰的医疗锚点，因为公司公开把患者病房、药房和院内导引纳入该合作范围。BAIC、SAIC、Toyota
              是有分量的客户标识，但证据权重不完全相同；它们主要出现在融资或公司画像报道中，作为具名下单或产业协同客户，而不是深度案例。Mercedes-Benz 和 Zeekr 出现在 TechNode
              关于本地工厂轮式机器人的报道里，但缺少详细运营记录。Bosch 和 UAES
              更适合当作伙伴-客户混合渠道：合资和合作验证了市场需求与工厂入口，但公开材料还不能证明这些主体已经形成常态化机队采购。零售证据比较特殊，因为 Galbot
              自营门店既是部署证明，也是部分自营渠道；这能改善运营反馈回路，但用于集中度分析时，不如独立客户标识有力。
