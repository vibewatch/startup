      - number: '5.5'
        title: 差异化、安全、合规与路线图可信度
        blocks:
          - type: paragraph
            body: >-
              Galbot 的核心差异化不在某个单点组件，而在整套栈的组合：自有数据、具身基础模型、机器人硬件，以及进入零售、医疗、制造落地场景的通道。与 Peking University、BAAI、Bosch、UAES
              的合作强化了一点：Galbot 想搭的是数据和制造飞轮，而不是一次性产品。2025 World Humanoid Robot Games
              和药品分拣挑战的第三方验证，也给出一定信号：这套栈能泛化到有基准的任务。不过，安全与合规只被部分去风险。IP54 有用，但只是有限的防尘防水，不等于医疗、工厂或隐私认证的细节。中国 2026 年 3
              月人形机器人标准和 2026 年 5 月机器人数字身份 制度会抬高基础合规义务；法律评论也指出，责任、自治和数据处理仍有问题未解。最尖锐的信任缺口是隐私：一篇反向报告明确指出，Galbot
              尚未解释药房场景里患者可识别个人身份的健康信息如何得到保护。这个遗漏不推翻产品本身，但也意味着，要进一步打入医疗场景，路线图可信度仍取决于尚未公开的治理和安全披露。
