  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与真正重要的玩家
        blocks:
          - type: paragraph
            body: >-
              不能只拿几家知名人形机器人品牌来给 Galbot
              做基准。真实格局包括：直接的全栈人形机器人同行，汽车支持或上市公司入场者，可能抽象掉硬件差异的模型层竞争者，固定自动化与人工零售或工厂劳动力等替代品，以及能借汽车或电子生态供应链规模切入的潜在进入者。在直接具身
              AI 竞争里，AgiBot 和 Unitree 最重要，原因是它们已有中国出货证据；Figure 最重要，原因是资本强度和全球叙事能力；Physical Intelligence
              也重要，因为如果通用机器人基础模型能跨硬件迁移，它可能压缩产品差异化。相邻压力来自 XPENG、UBTech、Boston Dynamics 和
              1X，各自切入工业、商业或家庭机器人中的不同切片。现实中的现状替代品仍是人工劳动力加任务专用自动化，这让买方审查继续聚焦可靠性和劳动力替代，而不只是人形新奇感。
