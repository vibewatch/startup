      - number: '6.2'
        title: 采用轨迹与部署台账
        blocks:
          - type: paragraph
            body: >-
              Galbot 的采用轨迹主要看部署数量，而不是已披露收入或分群指标。最重要商业信号是 2025 年 12 月融资稿：公司称来自以 CATL、Toyota、BAIC Group
              为首的工业客户的累计订单达数千台。这个说法足以指向真实需求管线，而不是少数试点；但其中有多少是约束性订单、框架协议或分阶段铺开，公开材料没有拆开。零售方面，公司称截至 2025 年底 Galbot Store
              已扩展到 30 多个城市，后续报道又指截至 2026 年 3 月，20 多个城市已有 100 多台设备。医疗方面，北京至少 10 家药房在运行，并提到 99.5% 药品处理成功率和 24/7
              运行。仓储还提供了另一个耐久性替代指标，官方融资表述称已稳定全天候运行超过一年。合起来看，这些信号显示公司正从展示性安装走向可重复部署模板；但公开采用情况仍需谨慎解读，因为 Galbot
              不披露利用率、单机器人经常性收入，也不披露试点转扩展机队的比例。
