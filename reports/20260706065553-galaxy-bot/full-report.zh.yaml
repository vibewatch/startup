      - number: '8.4'
        title: 可比组与情景区间
        blocks:
          - type: paragraph
            body: >-
              Galbot 的有用估值框架必须是混合型。一端，Figure AI 官方 $39 billion Series C
              显示，全球资本市场仍会给被视为品类领导者的公司很高定价。另一端，中国同行和上市公司可比标的显示，定价压力、市场折价和披露差异会迅速压缩这种乐观。因此，情景框架比单点估计更重要。乐观情形假设 Galbot
              成为清晰的中国本土工业领导者，收入规模真实、战略可选性大幅更丰富。基准情形假设公司取得实质进展，但仍因集中度、披露和政策风险承受折价。悲观情形假设商业化滑坡，或集中度与监管实质削弱未来融资杠杆。区间很宽，但宽度符合现实：今天的公开证据对方向的支持强于对精度的支持。
