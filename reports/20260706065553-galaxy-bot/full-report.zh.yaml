      - number: '1.4'
        title: 里程碑、规模信号与未解问题
        blocks:
          - type: paragraph
            body: >-
              对一家 2023 年成立的公司来说，Galaxy Bot 的运营推进异常快。Baidu 的公司年表指向一连串节点：2023 年天使融资，2024 年 Peking University
              联合实验室和第一代机器人发布，2025 年 1 月 GraspVLA，2025 年 3 月智能零售方案，2025 年 6 月 Bosch 关联 JV，2026 年 6 月 CATL 战略生产线合作。The
              Robot Report 2025 年中的报道把 G1 描述为轮式双臂移动操作机器人，用于自动化库存、补货、配送和包装；当时已在北京近 10 家门店部署，并计划年内覆盖全国 100
              家门店。后续与公司有关的报道进一步推高了规模说法，称 Galbot Store 覆盖 30 多个城市，公司已拿到数千台订单。


              技术叙事足以解释投资人热情。ArXiv 论文显示 GraspVLA 和 TrackVLA 是真实发表的技术项目，NVIDIA 也记录 DexGraspNet 是 Galbot
              构建的大型仿真灵巧抓取数据集。这支持一个判断：公司不只是集成现成机器人硬件，而是在尝试搭建一套自有具身模型栈，覆盖抓取、追踪和零售任务执行。这种差异化很重要，因为不少人形机器人竞争者仍依赖吸睛演示，而不是面向特定领域的任务学习。


              即便如此，最审慎的概览仍应以谨慎收尾。KR Asia、MERICS 以及 U.S.-China Economic and Security Review Commission
              都强调同一个宏观风险：商业化仍早、成本仍高、精度和自主性仍有限，投资者也越来越担心人形机器人估值跑在收入之前。就 Galaxy Bot
              而言，收入、毛利率、烧钱速度、准确员工数、客户集中度，乃至试点转为生产部署的比例，都没有公开证据。这些缺口不否定公司的技术动能，但也意味着，叙事中最有吸引力的部分在能力层面比在成熟财务层面更有证据。
