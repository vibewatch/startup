      - number: '6.5'
        title: 集中度风险与反向信号
        blocks:
          - type: paragraph
            body: >-
              客户故事有吸引力，但并未充分去风险。CATL 同时是 Galbot 最具战略性的投资关系，也是最清晰的工业客户锚点；这带来集中度和治理问题，而私营公司的公开记录还无法回答。公开部署也高度中国中心化，使
              Galbot 暴露在同一个监管环境、人才生态和人形机器人系统早期采用市场中。独立反向报道让警惕更强：TechXplore 认为人形机器人供给可能跑在真实买方需求之前，因为可用生产场景仍有限；CNBC
              也把该赛道描述为投资人热、商业化未成熟。这些批评贴合 Galbot
              的证据形态：公开客户标识和铺开数量是真实的，但详细机队经济性、续约情况、第三方验证的生产率结果仍稀少。多个垂直场景和伙伴渠道确实降低了一些单一市场风险，但数千台订单说法，相比 Galbot
              融资轮次和制造叙事隐含的规模雄心，仍处早期。简言之，采用动能真实存在，但集中度与商业化质量尚未达到后期工业平台投资人想看到的证明强度。
