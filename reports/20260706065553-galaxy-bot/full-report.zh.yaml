            body: >-
              AgiBot、Unitree、Figure 和 Physical Intelligence 代表四种不同竞争者原型。AgiBot
              是最清晰的中国规模同行：它结合了广泛硬件组合、激进生产里程碑，以及一个超越单一机器人本体的 OEM 平台叙事。Unitree 是最清晰的公开价格锚，也是最显眼的低端商业化故事，G1
              价格低得多，并拥有广泛国际发货覆盖。Figure 是资本最充裕的风险投资支持基准，把醒目估值与面向劳动力和家庭场景的制造及模型栈叙事绑定在一起。Physical Intelligence
              与其说是直接硬件卖方，不如说是模型层风险；它的通用 π0 系列和开源发布，让人更容易想象未来硬件会变得更可替代。XPENG 和 UBTech
              是重要的快速跟随者，因为它们带来汽车或公开市场资源；但当前承销压力最大，仍来自中国规模组合以及美国资本 / 模型组合。
