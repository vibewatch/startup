      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从资本充足性看，Galbot 在民营创业公司标准下很强。融资路径从 2023 年未披露的种子轮和天使轮，升级到 2025 年 6 月 RMB 1.1B 机构轮，再到 2025 年 12 月以 $3B 估值完成超过
              $300M 融资，之后 2026 年 3 月 RMB 2.5B 融资把累计已披露资本推至约 $1.15B+。这种资本规模应给予 Galbot
              充足空间，在没有迫近融资悬崖的情况下扩张制造、商业部署和模型训练。两个保留项是烧钱速度和融资依赖。烧钱未披露；对于一家研发和现场运营都很重的人形机器人公司，烧钱可能相当可观。融资依赖也不只是数字问题，而是战略问题：国家资本和产业资本已经参与，让
              Galbot 看起来比许多创业公司风险更低；但同样的支持也可能把预期锁向国内战略目标。总体看，资本充足性不错，但在现金和烧钱披露前，跑道仍只是估计。
