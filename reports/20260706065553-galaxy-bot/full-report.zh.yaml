      - number: '2.2'
        title: 市场测算口径与估计分散
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场测算异常不稳定，因为分析师常常在量不同的东西：有人只统计硬件收入，有人把软件和服务也纳入，还有人建模的是长期劳动力替代，而不是近端销售。Morgan Stanley 的长期观点最乐观之一：预计到
              2050 年全球将有近 1 billion 台人形机器人，约 90% 用于工业或商业场景，仅中国潜在在用量就可达 302.3 million 台。Goldman Sachs
              也乐观，但仍有条件：一份被引用的报告称，10 到 15 年内市场至少 $6 billion；如果产品设计、可负担性和公众接受度障碍被克服，2035 年蓝天情景可达 $154
              billion。相较之下，Interact Analysis 认为，尽管理论可寻址市场有 $2 trillion，实际全球人形机器人出货到 2032 年可能只有约 40,000 台、约 $2 billion
              收入。


              中国特定估计同样不清爽。一家市场研究来源称，中国人形机器人市场将从 2025 年约 $173.5 million 增至 2034 年 $1.69 billion；另一家称其 2024 年为 $205
              million，到 2032 年接近 $5.93 billion；China Daily 引用会议估算称，2024 年为 2.76 billion yuan，到 2029 年达 75 billion
              yuan。差距太大，不能机械求平均。真正的洞见恰恰是分散本身：市场足够真实，能吸引资本和政策关注，但方法论仍不成熟，且高度依赖假设。


              做尽调时，更可信的办法是把自上而下 TAM 口径，与已经存在的近邻市场配对——仓储机器人、服务机器人、自助结账和零售自动化——再进一步收窄到移动操作机器人能创造增量 ROI
              的预算子集。因此，一个干净的章节应保留相互矛盾的估计，而不是把它们抹平，因为分歧正是当下市场的核心特征。
