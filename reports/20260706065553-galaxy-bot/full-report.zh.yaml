      - number: '7.4'
        title: 伙伴依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              公司的最强外部证明点也同时是集中度风险。CATL 给 Galbot 带来有分量的工业背书和融资信号，但也把需求可信度与投资人信心集中到一段关系上。Bosch 相关合作、国资背景资本、NVIDIA
              相关工具链，让公司看起来战略连接度高；但一旦条款变化、政治环境转向或平台入口收紧，每条连接也会压缩自由度。财务上，公司仍难以清晰判断投资价值，因为公开证据给出了估值和融资数字，却没有可比的收入、现金消耗或支持经济性披露。这个组合形成一种具体下行情形：如果买方需求比标题式部署集合更窄，Galbot
              仍可能显得很突出，却需要按不确定条款继续融资。因此，Galbot $3 billion 估值与 Figure 更高得多的美国同行估值标记之间的差距，应部分理解为风险折价，而不只是可选上行空间。
