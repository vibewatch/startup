            body: >-
              Galbot 的公开商业故事暗示了几条收入流，尽管公司没有披露完整财务拆分。最显眼的是 G1
              平台硬件销售，但这类销售很可能与集成工作、部署配置和支持承诺打包出现，使设备收入与实施服务之间的界线变得模糊。第二条收入流出现在零售和药房运营中，Galbot Store
              和药房部署更像运营商或托管服务模式，而不是一次性产品销售。CATL、Mercedes-Benz 以及 Bosch
              关联伙伴的工业项目，意味着更大的企业合同和更长验收周期；医疗部署则带来服务质量和可靠性义务，可能让收入确认时点更复杂。同样重要的是缺口：Galbot 没有披露
              ASP、合同期限、任何门店经济性是否基于收入分成，以及软件或模型授权是否与硬件分开入账。因此，收入模型在形态上可读，但真实组合和会计处理仍不透明。
