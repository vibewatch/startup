  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基座细分与公开足迹
        blocks:
          - type: paragraph
            body: >-
              Galbot 的客户版图，与其按经典 SaaS 账户清单理解，不如拆成采购方、使用方和付款方。工业制造里，采购和付款方是 CATL、Bosch 相关实体、BAIC、SAIC、Toyota 提及客户、UAES
              等大型企业或战略伙伴；日常使用者是工厂操作员、生产团队和自动化工程师。医疗里，医院或药房运营商买单，药剂师和支持人员使用，直接受益的是患者流程。零售里，Galbot 通过 Galbot Store 和
              Galaxy Space Capsule
              这类自主便利店形态，部分扮演自己的参考客户，在一些点位既是供应商也是运营者。公开证据显示，所有垂直场景都集中在中国：具名部署、国家支持报道、监管语境和城市级铺开线索都围绕中国展开。这给 Galbot
              带来清晰的本土切入口，但也说明，当前客户基座按地域和政策体系看，比垂直清单乍看之下更集中。
