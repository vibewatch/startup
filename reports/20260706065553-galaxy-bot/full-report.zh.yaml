  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Galaxy Bot 的正确市场框架应窄于“所有人形机器人”，又宽于“门店里的机器人”。Galbot
              声称要完成的任务——库存盘点、补货、拣选、配送和包装——触及三个已经存在的自动化池：零售自动化、服务机器人和仓储 / 物流机器人。中国 2024 年社会消费品零售总额达到 48.79 trillion
              yuan，其中实物商品网上零售额为 13.08 trillion yuan，占总额 26.8%。这很关键，因为零售商决定是否自动化门店劳动力时，不只是把 Galaxy Bot
              与人工员工对比；它还会与自助结账、智能购物车、电子价签、条码 / RFID
              流程、自主移动机器人，甚至向电商履约迁移的渠道方案对比。换句话说，相关预算分散在门店运营、IT、设施和供应链自动化里，而不是一个清晰的“人形机器人”科目。


              相邻市场数据强化了这一点。仅中国自助结账市场，2024 年规模就估算约 $330 million，2035 年将达 $1.3
              billion；全球仓储机器人已经是数十亿美元级品类，全球服务机器人规模更大。这些市场用更低的技术野心解决同一运营问题的一部分。想加快结账、减少前端收银员的食品杂货商，可以安装自助结账或智能购物车。想做重复搬运和配送的零售商或药房，可以用轮式服务机器人。3PL
              或电商仓库可以投 AMR、AGV 或拣选系统。只有当移动操作机器人或人形形态在受限物理环境中的多任务表现明显优于这些替代品时，Galaxy Bot 才能赢。


              这种边界逻辑会影响估值。公司可以引用万亿美元级人形机器人预测，但如果近端客户预算要与便宜得多的点状方案竞争，实际可服务市场就是零售和履约劳动力支出的过滤子集。因此，本章把零售自动化、自助结账、服务机器人、仓储机器人和电商替代，一并纳入同一条买方决策树。
