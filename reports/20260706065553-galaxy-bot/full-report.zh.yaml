  - id: TE001
    title: G1 硬件规格
    columns:
      - 参数
      - 值
      - 备注
      - 对比背景
    rows:
      - - 高度（标准姿态）
        - 1730 mm
        - 官方产品包和产品页均指向站立高度约 173 cm。
        - 人形尺度服务机器人，尺寸适配标准货架和柜台。
      - - 躯干升降
        - 650 mm
        - 躯干大行程升降扩大了高低货架触达范围，不改变底盘占地。
        - 室内零售和药房作业里，这比腿部表现力更关键。
      - - 臂长
        - 710 mm
        - 官方产品包已披露。
        - 长触达双臂几何补足了稳定轮式底盘的工作半径。
      - - 垂直工作空间
        - 0–2100 mm
        - 官方产品包给出标准范围，并称部分姿态下可触达更高位置。
        - 覆盖地面料箱到高位零售货架。
      - - 双臂载荷
        - 5 kg
        - 载荷看起来针对物品搬运调校，不是重型装配。
        - 适合 SKU、托盘、瓶装品和轻型零件。
      - - 电池
        - 48V 30Ah 锂电池
        - 电池规格来自官方；循环寿命和热插拔设计未披露。
        - 支撑公司声称最长 10 小时续航。
      - - 运行时长
        - 最长 10 小时
        - 公司声称的续航；未披露工作周期假设。
        - 对单班室内作业有竞争力。
      - - 防护等级
        - IP54
        - 只提供基础防尘和防溅水能力。
        - 低于严苛工业或临床清洁制度常要求的认证深度。
      - - 传感器
        - 视觉、触觉、深度
        - 模态公开，但传感器供应商和冗余层未披露。
        - 足以支撑抓取、跟踪和避障操控。
      - - 连接能力
        - WiFi、Ethernet、USB、云集成
        - 显示其面向机队管理，也保留本地接口选项。
        - 便于接入互联零售和企业网络。
      - - 机身重量
        - 官方 ~92.5 kg；部分评测 ~85 kg
        - 在建模楼面承载或运输前，需要先解决不同来源的重量冲突。
        - 影响搬运、移动能耗和安全规划。
    notes: 各行仅汇总截至运行日期公开披露的规格。若二级来源与官方产品包不一致，先列官方值，并在备注中披露差异。
