      - number: '4.4'
        title: 公开进展真实，但财务披露偏薄
        blocks:
          - type: paragraph
            body: >-
              Galbot 的公开进展在运营层面亮眼，在财务层面薄弱。运营侧，来源指向 2025 年底 30 多城零售覆盖、2026 年初 100
              多个药房或门店部署、累计数千台工业订单，以及药房流程中非常具体的任务成功率说法。这足以判断 Galbot
              不是只停留在实验室的创业公司。但如果没有订单到交付的转化、合同金额、验收时点或服务绑定细节，这些指标都无法干净地转化为已入账收入。公司不披露收入、ARR、EBITDA、毛利率、烧钱速度或客户集中度。即便利用率或劳动力替代叙事很强，仍只是代理指标，不是已确认财务结果。因此，更合适的框架是不对称：部署证据有意义，但收入质量仍未经验证，因为公开章节呈现运营远多于会计。
