      - number: '5.4'
        title: 部署成熟度、可靠性与支持信号
        blocks:
          - type: paragraph
            body: >-
              公开部署证据显示，Galbot 已走出实验室演示，但尚未发布能证明工厂级可靠性的车队运营台账。最强的量化证据点来自医疗：北京药房部署的媒体报道引用了 10 多个运营站点、24/7 运行模式和 99.5%
              药品处理成功率；零售报道则称一台 G1 能自主运营 50 平方米门店，铺开目标扩至 100 多个药房或门店站点。这些是有用的成熟度信号，因为它们意味着公司已反复集成进有货架、SKU
              和员工工作流的真实环境。工业成熟度更有前景，但还未被证明。Bosch 和 UAES 的合资公告显示，流程制造和汽车伙伴已认真看待
              Galbot；但公开文件仍未发布产线级吞吐、MTBF、恢复时间或服务人员配比。竞争含义是，Galbot 今天在半结构化室内运营中看起来可信，但 99.9%+
              工业准确率的路线图可信度，仍取决于围绕正常运行时间、异常处理和部署支持工具的私下尽调。
