  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 项目
      - 描述
      - 紧迫性
      - 未解决是否导致论点破裂
    rows:
      - - 经审计收入证明
        - 提供经审计或董事会级别的收入、毛利率和烧钱披露。
        - 立即
        - 是；没有经济性，价格无法干净承销。
      - - CATL 集中度
        - 披露合同条款、期限和依赖组合。
        - 立即
        - 是；如果单一对手方实质上同时锚定收入和融资信心。
      - - 实际交付时间表
        - 按主要部署展示实际交付与承诺交付的时间差。
        - 高
        - 是；如果出货相对商业化叙事明显滑坡。
      - - 股权结构与优先权
        - 披露清算顺位、参与权和优先级。
        - 高
        - 是；如果结构在标称估值下明显压低新资金顺位。
      - - 合规状态
        - 展示数字 ID、隐私和医疗控制就绪度。
        - 高
        - 是；如果监管可能中断关键部署。
    notes: 这些触发项围绕会直接改变投资建议的问题展开，而不是只增加泛泛提醒。
    claimRefs:
      - CV010
      - CV018
      - CV029
      - CV030
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入与单元 P&L
        - 季度收入、毛利率、支持成本和现金消耗
        - 估值纪律取决于证明业务本身，而不只是证明品类。
        - 与管理层和审计师开展财务尽调。
      - - CATL 合同结构
        - 期限、定价、排他性和终止权
        - 集中度会放大上行，也会扭曲下行。
        - 审阅已签协议的商业和法律条款。
      - - 交付事实集
        - 各站点实际出货量与已宣布部署对比
        - 这条投资逻辑需要真实规模，而不只是高曝光试点。
        - 运营尽调加客户背调电话。
      - - 毛利结构
        - 硬件毛利与软件或服务贡献对比
        - 决定规模扩大是在抬升价值，还是只是加重支持负担。
        - 财务和产品尽调。
      - - 员工数与烧钱速度
        - 按职能划分的人头数和月度现金消耗
        - 用来判断跑道和未来稀释压力。
        - HR 和 CFO 尽调。
      - - 知识产权和隐私状态
        - 专利图谱、FTO 意见、医疗隐私控制
        - 如果基础薄弱，两项都会带来不易察觉的下行风险。
        - 法务和安全尽调。
    notes: 要把一轮战略上有吸引力的私人融资，变成可以完整承销的投资决策，上述材料是最低配置。
    claimRefs:
      - CV011
      - CV015
      - CV018
      - CV019
      - CV030
      - CV038
