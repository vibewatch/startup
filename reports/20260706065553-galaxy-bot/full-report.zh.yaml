        - 需要外部证据证明数据和模型优势能转化为更好的现场结果。
      - - 商业证明
        - CATL 等部署表明 Galbot 已不只是原型。
        - 少数参考客户标识仍可能掩盖集中度和复购疲弱。
        - 需要复购订单和多客户扩张证据。
      - - 资本基础
        - 国资背景投资人提供耐久资本和政策通道。
        - 优先权和集中度不明，可能让后进投资人保护不足。
        - 需要股权结构、条款和治理细节。
      - - 团队质量
        - He Wang 的技术履历支撑具身 AI 叙事。
        - 商业化铺开后，创始人集中会抬高执行负荷。
        - 需要组织纵深和运营节奏证据。
      - - 监管环境
        - 标准长期可抬高弱势竞争者的门槛。
        - 合规、召回和隐私义务会先拖慢价值兑现。
        - 需要合规就绪、医疗和隐私控制的实操证据。
    notes: 这张表把每个投资论点支柱放到对应反论点下检验；投资人若要激进承销当前价格，必须先解决这些问题。
