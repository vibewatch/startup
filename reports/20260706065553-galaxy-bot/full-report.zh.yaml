      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              Galbot 的监管图景格外重要，因为中国政府不只是旁观人形机器人，而是在围绕它们建立可执行框架。2026 年 3 月的国家标准体系和 2026 年 5
              月的数字身份制度，让人形机器人更接近受监管的工业产品品类；这利好长期市场发展，但会让准备不足的供应商付出高成本。法律风险也不止合规清单。Hill Dickinson
              的分析有说服力，因为它把责任、隐私和问责视为未解问题，即便完全自治还未到来。若机器人伤到工人、误识别人，或在药房/医院误处理敏感数据，责任可能横跨制造商、运营方和软件栈。也就是说，一次重大事故可能同时触发商业观望、监管审查和直接成本。
