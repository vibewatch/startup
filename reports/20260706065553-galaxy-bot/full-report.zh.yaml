        title: 切换成本、锁定与分销不对称
        blocks:
          - type: paragraph
            body: >-
              Galbot
              的护城河不是经典软件网络效应；它是一组运营捆绑：数据集深度、站点集成、客户工作流调优，以及采购渠道入口。当客户在真实门店、医院或工厂验证部署后，这会创造有意义的切换成本，但并不会让多供应商并行变得不可能。如果人形机器人本体收敛到相似的
              VLA 架构和任务 API，客户可能同时测试不止一家供应商，再按可靠性、支持质量和经济性分配任务。因此，分销变得异常重要。Galbot
              的国资支持投资人组合，以及与工业龙头的关系，可能提高它进入中国试点项目、建立采购可信度和获得伙伴引荐的能力，这是规模更小、只有风投资本的创业公司很难匹配的。另一方面，不对称也会反过来：XPENG
              等拥有汽车或电子供应链的在位者，或其他大型制造商，如果人形机器人品类变得更由规模而非模型驱动，可能在制造杠杆上追平甚至超过 Galbot。
