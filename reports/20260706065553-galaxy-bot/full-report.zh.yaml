      - number: '4.2'
        title: GTM 方式与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Galbot 的 GTM
              看起来由企业销售和标杆账户驱动，而不是自助式。公开进展通过具名部署、战略投资人关系，以及工厂、医院和零售环境中的案例式叙事浮现，意味着高接触销售、更长试点，以及比软件式产品驱动增长更复杂的实施。这可以是优势，因为大型工业和医疗客户能创造信任和可复制性；但也意味着销售效率只能从代理指标推断。公开证据显示，Galbot
              正围绕劳动力替代或吞吐经济性优化：据称一台机器人能运营 50 平方米门店，并在三年内替代三班人力；医院药房流程则引用 99.5% 处理成功率。这些数据点支持价值创造，但没有披露
              CAC、回本周期、留存或扩张。GTM 含义是，Galbot 可能拿下高 ACV 客户，但投资者仍缺少判断获客是否高效、可复制，并且轻资本到足以支撑当前融资规模的指标。
