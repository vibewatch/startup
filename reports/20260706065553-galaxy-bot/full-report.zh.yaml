      - number: '4.3'
        title: 成本结构、利润率驱动与资本强度
        blocks:
          - type: paragraph
            body: >-
              Galbot
              的成本结构几乎肯定比软件投资者直觉上想象的更偏硬件。一次人形机器人部署会嵌入物料清单成本、机电组件、电池、传感器、算力、工厂人工、现场安装和持续服务支持。这意味着毛利率不仅由定价权决定，也由良率、利用率、保修负担和服务效率支配。公开来源没有披露
              Galbot 毛利率，但更广泛的物理 AI 和机器人背景显示，其利润率区间很可能远低于纯
              SaaS，并取决于制造成熟度。营运资本也是可能的拖累：尤其当企业买方协商按里程碑付款时，机器人和零部件必须先通过库存和部署周期融资，现金才能完全回收。2026 年 3
              月融资很可能正是为这些压力供血——制造爬坡、模型开发和现场部署扩张——因此，Galbot 应按资本密集型物理 AI 公司来承销，而不是按轻资产 AI 软件供应商。
