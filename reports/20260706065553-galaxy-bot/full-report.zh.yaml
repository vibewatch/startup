      - number: '5.2'
        title: 硬件平台与运行架构
        blocks:
          - type: paragraph
            body: >-
              Galbot 官方资料为 G1 提供了异常具体的硬件边界。平台标准姿态身高 1730 mm，躯干可升降 650 mm，垂直工作空间延伸至 0–2100 mm；710 mm 手臂和约 190 cm
              臂展覆盖标准人体腰部上下的货架和柜台。双臂负载列为 5 kg，足以处理药盘、零食袋、瓶装商品和轻型工业零件，而不是重型制造载荷。动力来自 48V 30Ah 锂电池，宣称最长运行 10 小时，并配有
              WiFi、Ethernet、USB 和云端集成用于车队监督。最影响部署经济性的设计选择是轮足移动结构：Galbot 看起来在优化稳定室内导航和更长续航，同时通过躯干升降和长臂几何保留人类空间触达能力。6.25
              英寸触摸屏提供本地操作员交互，多模态视觉、触觉和深度感知则支撑硬件之上的具身控制栈。一个规格冲突仍在：官方包引用的机身重量约 92.5 kg，而二级评测有时称 85 kg。
