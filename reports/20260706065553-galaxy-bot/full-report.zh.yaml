        title: 融资语境与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Galbot 的正确起点是当前融资标记，而不是常规 DCF 测算。公开证据给出强标题：2026 年 3 月以约 $3 billion 估值融资超过 $300 million；更早融资似乎把累计资本推到 $1.15
              billion 以上。这足以把 Galbot
              视为中国资本最充足的人形机器人公司之一，但不足以说明当前价格明显公允。公开来源仍未披露审计收入、毛利率、现金消耗率，或决定标题式投后估值能否转化为有吸引力普通股入场机会的详细资本结构。这也是为什么入场纪律比品类热度更重要。新投资人应假设，结构、集中度和商业化时点至少和市场规模叙事同等重要。
            claimRefs:
              - CV001
