  - id: TV003
    title: 牛 / 基础 / 熊情景表
    columns:
      - 情景
      - 概率
      - 关键假设
      - 隐含 5 年价值驱动因素
      - 估值区间
    rows:
      - - 牛
        - 25%
        - 中国仍是人形机器人商业化中心，Galbot 赢得工业领域领导地位，收入到 2028 年至少达到数亿美元。
        - 经营杠杆叠加本土品类龙头的战略溢价。
        - $25B-$35B
      - - 基础
        - 50%
        - Galbot 在两到三个垂直领域放量，但披露只逐步改善，市场仍会折价处理集中度和政策风险。
        - 收入可见度稳步提升，治理证明改善但仍不完美。
        - $10B-$15B
      - - 熊
        - 25%
        - 商品化、合规拖累或 CATL 收缩阻止广泛规模化，并迫使融资条款更苛刻。
        - 下行保护靠资产和战略选择权，而不是爆发式增长。
        - $1B-$1.5B
    notes: 这些区间是讨论区间，不是管理层指引；锚点是里程碑推进，而不是单一收入倍数。
    claimRefs:
      - CV012
      - CV026
      - CV027
      - CV028
      - CV031
      - CV037
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 阶段
      - 估值 ($B)
      - 收入模式
      - 关键差异化
      - 估值倍数背景
    rows:
      - - Galbot
        - 私募轮
        - 增长 / Pre-IPO 叙事
        - 3
        - 人形机器人硬件 + 具身 AI 部署
        - 中国全栈工业聚焦，背后有国资资本
        - 标称私募轮估值，未公开收入披露
      - - Figure AI
        - 私募轮
        - Series C / 品类龙头
        - 39
        - 通用人形机器人平台
        - 同业中已披露的最高私募估值
        - 官方 2025 年 Series C 轮投后估值
      - - AgiBot
        - 私营公司估算
        - 私募后期 / 规模化
        - 4
        - 中国人形机器人部署
        - 国内出货可见度强
        - 市场报道中点估算，并非官方价格
      - - Unitree
        - 公私混合市场标尺
        - 商业产品规模
        - null
        - 机器人硬件销售
        - 中国市场公开价格点激进
        - 可作为定价锚点，但不是已披露私募估值
      - - XPENG
        - 上市可比公司
        - 上市 EV / 机器人选择权
        - null
        - 整车销售 + 机器人选择权
        - 披露充分，具备公开市场流动性
        - 使用基于申报文件的上市公司背景，而不是直接套用估值
      - - Boston Dynamics / Hyundai
        - 战略型既有玩家
        - 企业支持的商业化对手
        - null
        - 工业机器人与战略部署
        - 既有玩家的制造和商业化深度
        - 战略可比，不适合直接转移倍数
      - - Physical Intelligence
        - 基础模型可比公司
        - 私营 AI 平台
        - null
        - 通用机器人模型平台
        - 显示价值可能流向软件优先的控制层
        - 提供叙事和融资背景，而不是干净倍数
    notes: 这张表混合了已披露私募估值锚点、上市公司和战略可比对象，因为 Galbot 运营披露不足，无法机械套用单一倍数法。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant private, public, and strategic robotics comparables visible in the
        reviewed 2024-2026 evidence set, but not every Chinese or U.S. humanoid financing round.
