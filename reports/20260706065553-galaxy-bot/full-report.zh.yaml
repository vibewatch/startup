      - number: '7.3'
        title: 运营可靠性与产品化风险
        blocks:
          - type: paragraph
            body: >-
              运营可靠性仍是从亮眼原型叙事到韧性业务之间最大的桥。公开来源支持人形机器人系统正在快速变好，但也显示，买方要看到可重复节省，前面还有很多环节必须成功。工厂部署需要极高准确率和 正常运行时间；具身 AI
              的错误不会像仪表盘指标那样悄悄变差，而可能外溢成物理事故。Deloitte 对物理 AI
              的警示在这一类风险中比在纯软件里更重要，因为幻觉和感知错误会驱动执行器在人周围移动。电池完整性、触觉传感和网络加固还会叠加更多层。TechXplore 和 Associated Press
              的报道同样有价值，因为它们把当前商业瓶颈框定为需求和信任，而不是原始生产速度；这正是那种会在大量资本投入后才显形的风险。
