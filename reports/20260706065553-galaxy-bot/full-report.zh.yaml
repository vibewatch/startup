chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、品牌与运营版图
        blocks:
          - type: paragraph
            body: >-
              Galaxy Bot 看起来与如今公开以 Galbot 品牌示人的公司是同一业务；部分英文来源也称其为 Galaxy General Robot。相较摘要数据库，尽调中最重要的修正是官网：当前官方入口指向
              galbot.com，而不是提示中给出的、看起来偏旧的 galaxybot.ai。官网称公司是具身 AI 与通用机器人开发商，并展示商业零售、工业制造和医疗应用。Baidu Encyclopedia
              汇总的工商登记式信息显示，法律实体为 Beijing Galbot Co., Ltd. / Beijing Galaxy General Robot Joint Stock Co.,
              Ltd.，地址在北京市海淀区，成立于 2023 年 5 月 19 日。这与独立报道相互印证：公司在 2025 年 6 月完成 CATL 领投融资时，多次被称为一家约两岁的北京创业公司。


              相比稀疏的渲染 HTML，官方 Web 应用包透露了更多信息。它显示 Galbot 在北京、深圳、苏州、香港设有研发中心，并与 Peking University、Xuanwu Hospital、Beijing
              Zhongguancun College
              建立了联合实验室或研究中心。这些细节很关键，因为公司不只是一个纯概念阶段的人形机器人创业公司，更像一个研究商业化平台，试图同时搭建模型和部署渠道。同一批官方资料把商业与零售用例描述为精准拣选、配送、库存管理和补货，与
              Crunchbase 对“用于库存、补货和包装的人形机器人”的描述相吻合。


              身份层面缺失的信息同样重要。本次审阅没有找到任何公开一手来源披露经审计财务、准确员工数或权威董事会名单。公司显然希望外界把它当作广义具身智能平台，而不是单一门店零售机器人供应商；但在有更充分的独立披露之前，投资者应谨慎看待规模说法，尤其是活跃机器人数量、已上线站点数量，以及现有安装究竟是试点、付费生产部署还是展示环境。
