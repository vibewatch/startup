company:
  name: Galaxy Bot
chapter:
  number: 1
  title: Company Overview
  summary: Galaxy Bot is the company Crunchbase identified in June 2025 as a Beijing-based retail-robotics unicorn, but the current operating brand and verified official website are Galbot / Galaxy General Robot at galbot.com. Public evidence supports a May 2023 founding, Beijing headquarters, a June 2025 CATL-led RMB 1.1 billion (~$153 million) round that independent outlets linked to a $1 billion valuation, and a strategy centered on embodied-AI robots for retail, industrial, and healthcare workflows. The company has moved quickly from academic research to pilot deployments and strategic partnerships, but it still discloses little on board governance, revenue, headcount, or unit economics, and independent sources remain skeptical about near-term humanoid robotics commercialization.
sections:
- id: identity-brand-and-operating-footprint
  title: Identity, Brand, and Operating Footprint
  body: 'Galaxy Bot appears to be the same business now branding itself publicly as Galbot and, in some English-language sources, Galaxy General Robot. The most important diligence correction versus summary databases is the website: current official surfaces resolve to galbot.com rather than the legacy-looking galaxybot.ai URL given in the prompt. The official site describes the company as an embodied-AI and general-purpose robotics developer and shows applications across commercial retail, industrial manufacturing, and healthcare. Company-registration-style information summarized by Baidu Encyclopedia identifies the legal entity as Beijing Galbot Co., Ltd. / Beijing Galaxy General Robot Joint Stock Co., Ltd., with a Haidian District, Beijing address and a May 19, 2023 establishment date. That aligns well with independent reporting that repeatedly describes the company as a roughly two-year-old Beijing startup when it raised its CATL-led round in June 2025.


    The official web application bundle is more informative than the sparse rendered HTML. It states that Galbot operates R&D centers in Beijing, Shenzhen, Suzhou, and Hong Kong, and that it has set up joint laboratories or research centers with Peking University, Xuanwu Hospital, and Beijing Zhongguancun College. Those details matter because they position the company less as a pure concept-stage humanoid startup and more as a research-commercialization platform trying to build both models and deployment channels at once. The same official materials describe commercial and retail use cases as precision picking, delivery, inventory management, and restocking, which matches the Crunchbase description of a humanoid robot for inventory, replenishment, and packaging.


    What remains missing at the identity layer is equally important. No public primary source in this review disclosed audited financials, exact headcount, or an authoritative board list. The company clearly wants to be evaluated as a broad embodied-intelligence platform rather than a single-store retail robot vendor, but investors should treat scale claims cautiously until there is better independent disclosure on how many robots are active, how many sites are live, and whether current installations are pilots, paid production deployments, or showcase environments.'
