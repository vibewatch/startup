  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Galaxy Bot does not publicly disclose its board roster, investor-rights package, reserved matters, or the governance implications of strategic shareholders such as CATL and Bosch-linked entities.
    whyItMatters: Without governance disclosure, it is difficult to assess control rights, strategic vetoes, and exit flexibility.
    diligencePath: Request the current cap table, board list, shareholder agreement summary, and any side letters tied to strategic investors.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Revenue, gross margin, burn, runway, and customer-concentration metrics are not publicly disclosed for Galaxy Bot.
    whyItMatters: The company’s valuation and commercialization narrative cannot be tested against operating performance without financial disclosure.
    diligencePath: Request audited or management financial statements, monthly revenue by deployment type, gross-margin bridge, and cash runway model.
    relatedQuestionRefs:
    - QO013
  - type: private-evidence-only
    severity: material
    topic: headcount-and-scale
    missingEvidence: Exact headcount, site-level staffing, and the split between pilots, paid deployments, and showcase environments are not public.
    whyItMatters: Operational scale and hiring burden materially affect burn, serviceability, and the credibility of aggressive rollout claims.
    diligencePath: Request current org chart, employee count by site and function, active deployment list, and monthly robot utilization metrics.
    relatedQuestionRefs:
    - QO014
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: later-round-valuation
    missingEvidence: Later 2025 claims of a $300M-plus round and $3B valuation rely heavily on company-originated disclosures and lighter third-party repetition than the June 2025 unicorn round.
    whyItMatters: Using the higher valuation anchor without stronger corroboration would overstate certainty around the current capitalization narrative.
    diligencePath: Request signed financing documents, updated cap table, lead-investor confirmation, and independent press coverage or database entries for the later round.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table public completeness
    missingEvidence: The public record does not enumerate the full board, senior functional leaders, or investor observers behind the leadership table.
    whyItMatters: The leadership view may miss decision-makers who influence commercialization, hiring, or capital allocation.
    diligencePath: Ask management for a full leadership roster, reporting lines, and biographies for board-level or observer-level representatives.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
