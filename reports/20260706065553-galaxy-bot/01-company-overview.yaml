- id: capitalization-and-strategic-backers
  title: Capitalization and Strategic Backers
  body: 'Public funding evidence is strongest around the June 2025 round. Crunchbase’s unicorn-board article states that Galaxy Bot raised $153 million led by Contemporary Amperex Technology and was valued at $1 billion. Independent robotics and sector press then added round-level color: The Robot Report, Ofweek, Exportsemi, and Robotics & Automation News all described a RMB 1.1 billion financing led by CATL and Puquan Capital, with additional participation from the China Development Bank’s science-and-technology fund, the Beijing Robot Industry Fund, and other Chinese venture investors. Taken together, those sources support a high-confidence conclusion that Galaxy Bot crossed the unicorn threshold in mid-2025 with CATL as the key strategic backer.


    The strategic value of that investor syndicate is at least as important as the valuation headline. CATL is not just a financial sponsor; by June 2026, independent outlets CNEVPost and Gasgoo reported a strategic cooperation agreement that placed Galbot S1 robots on CATL production lines. Bosch-linked capital is the second notable anchor. GlobeNewswire and multiple robotics outlets reported that Boyuan Capital, Bosch China, and Galbot created a joint venture and signed an MOU focused on industrial manufacturing applications. This gives Galaxy Bot privileged access to two commercialization corridors: EV-battery manufacturing and high-precision industrial automation.


    There is also a more aggressive, lower-confidence growth story layered on top. In December 2025, Galbot distributed a PR Newswire release claiming a funding round of over $300 million and a $3 billion valuation, and The Robot Report repeated those company statements. Because that later step-up relies heavily on company-originated disclosure rather than broad independent corroboration, this chapter treats the June 2025 CATL-led round and $1 billion valuation as the cleanest externally anchored capital facts, while flagging the later $3 billion number as plausible but not yet diligence-grade.'
