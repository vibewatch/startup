evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Galaxy Bot does not publicly disclose its board roster, investor-rights package, reserved matters, or the
      governance implications of strategic shareholders such as CATL and Bosch-linked entities.
    whyItMatters: Without governance disclosure, it is difficult to assess control rights, strategic vetoes, and exit flexibility.
    diligencePath: >-
      Request the current cap table, board list, shareholder agreement summary, and any side letters tied to strategic
      investors.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Revenue, gross margin, burn, runway, and customer-concentration metrics are not publicly disclosed for Galaxy Bot.
    whyItMatters: >-
      The company’s valuation and commercialization narrative cannot be tested against operating performance without
      financial disclosure.
    diligencePath: >-
      Request audited or management financial statements, monthly revenue by deployment type, gross-margin bridge, and
      cash runway model.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: headcount-and-scale
    missingEvidence: >-
      Exact headcount, site-level staffing, and the split between pilots, paid deployments, and showcase environments
      are not public.
    whyItMatters: >-
      Operational scale and hiring burden materially affect burn, serviceability, and the credibility of aggressive
      rollout claims.
    diligencePath: >-
      Request current org chart, employee count by site and function, active deployment list, and monthly robot
      utilization metrics.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: later-round-valuation
    missingEvidence: >-
      Later 2025 claims of a $300M-plus round and $3B valuation rely heavily on company-originated disclosures and
      lighter third-party repetition than the June 2025 unicorn round.
    whyItMatters: >-
      Using the higher valuation anchor without stronger corroboration would overstate certainty around the current
      capitalization narrative.
    diligencePath: >-
      Request signed financing documents, updated cap table, lead-investor confirmation, and independent press coverage
      or database entries for the later round.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table public completeness
    missingEvidence: >-
      The public record does not enumerate the full board, senior functional leaders, or investor observers behind the
      leadership table.
    whyItMatters: The leadership view may miss decision-makers who influence commercialization, hiring, or capital allocation.
    diligencePath: >-
      Ask management for a full leadership roster, reporting lines, and biographies for board-level or observer-level
      representatives.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder map public completeness
    missingEvidence: >-
      The stakeholder map captures material public investors and partners but not the full cap table or all side
      agreements.
    whyItMatters: >-
      Missing smaller but rights-rich shareholders could distort assessments of control and follow-on financing
      dynamics.
    diligencePath: >-
      Request shareholder ledger, SAFE/convertible history, and any strategic side agreements attached to procurement or
      JV rights.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: galbot retail unit economics
    missingEvidence: >-
      No public source in this chapter discloses Galaxy Bot’s robot pricing, retail revenue, customer concentration, or
      task-level payback period.
    whyItMatters: >-
      Without company-specific unit economics, the chapter can only frame the market and substitutes, not prove Galbot’s
      share of the opportunity.
    diligencePath: >-
      Request price sheets, pilot-to-production conversion data, average robots per site, labor-replacement assumptions,
      and cohort economics by deployment type.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: retail labor cost benchmarks
    missingEvidence: >-
      Direct China Chain Store & Franchise Association style data on labor cost as a percentage of store operating
      expense was not available in reviewed public sources.
    whyItMatters: Buyer-budget sizing and SOM estimates are weaker without direct retailer cost structure benchmarks.
    diligencePath: >-
      Obtain CCFA/KPMG convenience-store and supermarket operating benchmark reports or equivalent sell-side retail
      coverage.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: material
    topic: humanoid market sizing methodology
    missingEvidence: >-
      Market-research publishers provide sharply different China humanoid market sizes and growth rates with limited
      public methodology transparency.
    whyItMatters: A single TAM figure would overstate certainty and could distort valuation or go-to-market expectations.
    diligencePath: >-
      Treat multiple market estimates as scenario inputs, and build an internal bottom-up SOM using store counts,
      automatable tasks, and ROI constraints.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: full service-robotics and service-robot install detail
    missingEvidence: >-
      Some of the strongest service-robotics and retail benchmark reports are summarized publicly but keep full China
      segment detail behind paywalls or report subscriptions.
    whyItMatters: The chapter can establish market direction but not always the deepest segmentation by vertical or geography.
    diligencePath: >-
      Purchase or access full analyst reports from IFR, market-research providers, or sector consultants for
      China-specific segment splits.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: buyer budget owner granularity
    missingEvidence: >-
      Public buyer case studies rarely disclose which internal budget line item funded robotics pilots versus scaled
      deployments.
    whyItMatters: GTM assumptions are weaker when the payer is inferred rather than documented.
    diligencePath: >-
      Interview pilot customers or channel partners and request procurement flowcharts for store ops, IT, and facilities
      budgets.
    relatedQuestionRefs:
      - QM009
      - QM011
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: Galbot pricing and unit economics
    missingEvidence: Public ASP, gross margin, maintenance attach rate, and contract terms for Galbot deployments are not disclosed.
    whyItMatters: >-
      Without price and service economics, it is hard to judge whether deployment breadth translates into durable margin
      advantage.
    diligencePath: Request customer proposals, realized invoices, and hardware-versus-service revenue mix by vertical.
    relatedQuestionRefs:
      - QP014
      - QP024
  - type: conflicting-data
    severity: material
    topic: shipment leadership
    missingEvidence: A harmonized third-party shipment table that resolves AgiBot versus Unitree 2025 leadership claims.
    whyItMatters: Competitive ranking affects how much weight investors should place on scale advantage versus marketing narrative.
    diligencePath: Obtain the underlying Omdia or equivalent shipment methodology and compare company claims to delivered units.
    relatedQuestionRefs:
      - QP002
      - QP020
  - type: missing-source
    severity: material
    topic: win-loss and switching costs
    missingEvidence: Public win-loss data and repeat-customer expansion data versus AgiBot, Unitree, and Figure are absent.
    whyItMatters: Moat durability ultimately depends on conversion and retention, not just named pilots.
    diligencePath: Ask management for competitive win-loss by vertical, deployment size, and follow-on order history.
    relatedQuestionRefs:
      - QP018
      - QP024
  - type: private-evidence-only
    severity: blocking
    topic: revenue and margin verification
    missingEvidence: No audited or management-confirmed revenue, gross margin, burn, or cash-balance disclosure is public.
    whyItMatters: These are the core inputs for judging revenue quality, valuation support, and capital adequacy.
    diligencePath: Request a dated management financial pack with revenue bridge, margin bridge, and cash runway schedule.
    relatedQuestionRefs:
      - QI006
      - QI014
      - QI024
  - type: missing-source
    severity: material
    topic: sales efficiency
    missingEvidence: CAC, sales cycle, payback, renewal, and expansion metrics are absent from public sources.
    whyItMatters: Strong deployment references do not prove efficient or repeatable customer acquisition.
    diligencePath: Obtain cohort analysis and funnel metrics by industrial, retail, and healthcare vertical.
    relatedQuestionRefs:
      - QI009
      - QI011
  - type: missing-source
    severity: material
    topic: order conversion
    missingEvidence: >-
      Public sources cite several-thousand-unit orders but do not reconcile booked orders to accepted deliveries and
      recognized revenue.
    whyItMatters: Without conversion data, operational traction can overstate near-term financial performance.
    diligencePath: Reconcile backlog, shipments, acceptance, and deferred revenue with a dated order book.
    relatedQuestionRefs:
      - QI017
      - QI025
  - type: conflicting-data
    severity: material
    topic: valuation interpretation
    missingEvidence: >-
      A normalized China-versus-US comparable set that adjusts Galbot and Figure for stage, disclosure, and deployment
      maturity.
    whyItMatters: >-
      The valuation gap is important, but it can be misread if investors compare headline numbers without adjusting for
      transparency and capital-market context.
    diligencePath: Build a like-for-like peer grid using disclosed funding, deployment, and monetization evidence.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
