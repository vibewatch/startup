sections:
- id: section-U1
  title: Customer Base Segmentation and Public Footprint
  body: 'Galbot''s customer map is easier to understand through buyer, user, and payer roles than through a classic SaaS account list. In industrial manufacturing, the buyer and payer are large enterprises or strategic partners such as CATL, Bosch-linked entities, BAIC, SAIC, Toyota-referenced customers, and UAES; the day-to-day users are factory operators, production teams, and automation engineers. In healthcare, hospitals or pharmacy operators are the buyers, pharmacists and support staff are the users, and the direct operating beneficiary is the patient workflow. In retail, Galbot partially acts as its own reference customer through Galbot Store and Galaxy Space Capsule-style autonomous convenience formats, making the company both vendor and operator in some sites. Public evidence indicates concentration in China across all verticals: named deployments, state-backing coverage, regulatory context, and city-level rollout references are all China-centered. That gives Galbot a coherent home-market
    wedge, but it also means the present customer base is more concentrated by geography and policy regime than the breadth of the vertical list might initially suggest.'
  claimRefs:
