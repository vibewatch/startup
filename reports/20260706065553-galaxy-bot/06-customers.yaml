- id: section-U2
  title: Adoption Trajectory and Deployment Ledger
  body: Galbot's adoption trajectory is visible through deployment counts rather than disclosed revenue or cohort metrics. The most important commercial signal is the December 2025 funding release claiming cumulative orders for several thousand units from industrial clients led by CATL, Toyota, and BAIC Group. That claim is large enough to imply a genuine pipeline, not a handful of pilots, although the mix of binding orders, framework agreements, and staged rollouts is not public. In retail, the company said Galbot Store had expanded to 30-plus cities by late 2025, then later coverage pointed to 100-plus units across 20-plus cities by March 2026. In healthcare, Beijing had at least 10 pharmacies in operation with 99.5% medication-handling success and 24/7 operation cited. Warehousing adds another durability proxy, with official financing language claiming stable around-the-clock operation for more than a year. Together these signals show movement from showcase installs to repeat deployment
    templates, but public adoption still needs to be interpreted carefully because Galbot does not disclose utilization, recurring revenue per robot, or conversion from pilot to expanded fleet.
  claimRefs:
  - CU005
  - CU011
  - CU012
  - CU013
  - CU015
  - CU024
  - CU029
  - CU030
  tableRefs:
  - TU003
