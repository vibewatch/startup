    severity: material
    topic: retention-metrics
    missingEvidence: Actual NRR, GRR, gross churn, logo churn, and renewal-rate data by cohort or vertical.
    whyItMatters: The customer chapter cannot fully assess durability or expansion quality without retention metrics.
    diligencePath: Request customer cohort tables and renewal schedules from management or the data room.
