  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue share of the top one, three, and five customers, including any related-party concentration tied to CATL.
    whyItMatters: Concentration and governance risk are central to underwriting Galbot's customer quality and independence.
    diligencePath: Obtain top-customer concentration schedules and related-party policy disclosures.
