company:
  name: Galaxy Bot
chapter:
  number: 6
  title: Customers
  summary: 'Galbot''s public customer base is real but still concentrated: the strongest named proof clusters around Chinese industrial buyers and partners, Beijing healthcare deployments, and company-operated retail footprints such as Galbot Store and Galaxy Space Capsule locations. Adoption evidence is directionally strong—several thousand industrial orders claimed, 30+ cities by late 2025, 100+ retail units across 20+ cities by March 2026, 10+ active pharmacies, and some 24/7 operations for over a year—but public retention disclosure is almost nonexistent. The key diligence conclusion is that Galbot has crossed from prototype into early commercial scaling, yet concentration, related-party exposure to CATL, China-only geography, and thin renewal metrics still make customer durability harder to prove than top-line deployment momentum.'
