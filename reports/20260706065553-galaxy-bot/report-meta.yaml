companyProfile:
  summary: >
    Galaxy Bot, publicly branded as Galbot, is a Beijing-based embodied-AI robotics company founded in May
    2023. Public materials position the company around general-purpose mobile manipulation and humanoid-style
    retail, industrial, and healthcare workflows, including inventory handling, replenishment, packaging,
    pharmacy operations, and factory automation. The company combines research-led embodied AI with practical
    robotics deployment experience and has attracted strategic backing from CATL and later state-linked
    Chinese capital. By 2026, public coverage indicates Galaxy Bot had advanced well beyond its June 2025
    $153 million Series B milestone, but its revenue base and unit economics still remain private.
  foundedDate: '2023-05-19'
  founders:
    - name: He Wang
      role: Co-founder / scientific lead
      background: Peking University tenure-track assistant professor; Stanford PhD under Leonidas Guibas; director of the PKU-Galbot joint lab of embodied AI.
      claimRefs: [CO010, CO011, CO012]
    - name: Yao Tengzhou
      role: Co-founder / legal representative
      background: Beihang Robotics Institute graduate with prior experience at ABB's Shanghai robot R&D center.
      claimRefs: [CO005, CO013]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >
    Galaxy Bot's product narrative centers on embodied-AI robots for retail, industrial, and healthcare
    environments, with public materials highlighting inventory management, replenishment, delivery,
    packaging, and high-precision manufacturing use cases.
  customerFocus: >
    Enterprise and institutional buyers in manufacturing, retail, and healthcare, with China as the core
    operating market and CATL among the most visible strategic counterparties.
  businessModel: >
    Likely a mix of hardware sales, deployment and integration fees, and recurring service or managed
    operations revenue; public evidence does not confirm a separately disclosed software or model-licensing
    revenue line.
  stage: Late-stage private
  fundingStatus: >
    Public evidence shows a June 2025 CATL-led $153 million Series B milestone, a December 2025 $300+
    million round at a $3 billion valuation, and a March 2026 RMB 2.5 billion financing led by the
    National AI Industry Investment Fund, bringing cumulative disclosed capital to roughly $1.15 billion+
    as of 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO009, CO014, CI004, CI005, CI006, CI008, CI009]
summary:
  headline: >
    Galaxy Bot is a strategically credible Chinese embodied-AI robotics contender with real deployment
    evidence and unusually deep capital backing, but opaque unit economics and concentrated partner risk
    keep the underwriting case speculative.
