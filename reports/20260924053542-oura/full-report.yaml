      - number: '4.3'
        title: Capital and Underwriting
        blocks:
          - type: paragraph
            body: >-
              Oura has raised about $1.5 billion in total capital, including the $900 million Series E led by Fidelity
              and a $250 million revolving credit facility. That capital stack is large enough to support global
              distribution and product expansion, but it also means the IPO will be judged not only on growth, but on
              whether public investors are buying a secondary liquidity event, a new growth war chest, or both. The main
              underwriting question is how much of the current valuation is justified by sustainable recurring revenue
              versus temporary momentum. That underwriting story will be judged against the company's legal overhang and
              the amount of liquidity available for product expansion after listing. The filing therefore reads as both
              a growth story and a risk reset.
            claimRefs:
              - CI008
