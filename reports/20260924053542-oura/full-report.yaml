              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: Sizing and Adoption
        blocks:
          - type: paragraph
            body: >-
              Public market-sizing data is strongest at the category level and weaker at the exact Oura-specific
              addressable layer. A recent industry estimate places the global smart-ring market near $1.01 billion in
              2026 and projects it to grow to about $7.8 billion by 2035, while company and investor commentary points
              to Oura as the dominant brand with well over 80% share. Oura's premium positioning is helped by stronger
              finger-based signals, long battery life, and a recurring subscription that makes the product easier to
              justify for users who care about recovery more than step counts. The public sizing lens is therefore
              useful mainly as a calibration device: it shows the category can scale, but it does not by itself prove
              the exact spend Oura can capture.
            claimRefs:
