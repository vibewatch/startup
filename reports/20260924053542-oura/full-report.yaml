      - number: '5.3'
        title: Trust, Security, and Product Risk
        blocks:
          - type: paragraph
            body: >-
              Oura invests heavily in security and compliance, but the product also exposes a live quality surface:
              public known-issues pages show missing sleep data, heart-rate anomalies, sync problems, and other defects
              that can directly affect user trust. In practice, the technology thesis is only as strong as the combined
              reliability of sensors, firmware, sync, cloud scoring, and support operations. The risk side is therefore
              not abstract: if sync or scoring breaks, the health product loses credibility quickly, even when the
              security posture is strong. The company therefore needs both excellent product design and operational
              discipline to keep the category believable.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
