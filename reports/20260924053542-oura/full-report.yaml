  - id: FM001
    title: Oura Market Sizing Lens
    type: pyramid
    layout: standard
    summary: >-
      A three-layer sizing lens that treats Oura as a premium smart-ring business inside a broader preventive-health
      wearables market, with the narrow category the cleanest public estimate.
    data:
      nodes:
        - id: layer-ecosystem
          label: Broader preventive-health ecosystem
          detail: Health subscriptions, labs, coaching, and adjacent services that could eventually absorb Oura.
        - id: layer-broad
          label: Broader wearables market
          detail: Generic fitness watches and bands that set the outer ceiling for consumer attention.
        - id: layer-core
          label: Smart-ring category
          detail: The cleanest public estimate at about $1.01 billion in 2026.
        - id: layer-premium
          label: Premium health ring niche
          detail: High-intent users willing to pay for recovery and sleep insights.
        - id: layer-company
          label: Oura platform
          detail: The current business scale near $1.4 billion of trailing revenue.
        - id: layer-enterprise
          label: Enterprise and clinical extension
          detail: Employer, research, and provider workflows that extend the market beyond consumer devices.
    claimRefs:
