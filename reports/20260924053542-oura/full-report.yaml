      - number: '3.3'
        title: Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive risk is not a single better ring; it is category normalization. If consumers start
              believing ring data is good enough without a subscription, Oura loses pricing power. If broader platforms
              like Apple or Google turn health sensing into a default feature bundle, Oura must defend a premium niche
              with science, trust, and niche workflows rather than broad market scale. The strategic risk is therefore
              not only a better ring, but a cheaper or more convenient default health layer from a platform incumbent. A
              default health layer from a platform incumbent would also shift the customer conversation from features to
              bundling and convenience.
