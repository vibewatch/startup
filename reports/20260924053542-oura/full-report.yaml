  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Product Risk
        blocks:
          - type: paragraph
            body: >-
              Oura now faces a visible legal and product-quality overhang. The sleep-tracking lawsuit is the clearest
              public challenge to the company's core claim set because it attacks the accuracy of the very metrics that
              make the ring valuable. That matters more than ordinary marketing noise: if consumers doubt the sleep
              score, they also doubt the subscription and the daily habit it supports. The risk is not just a one-off
              court case; it is the possibility that accuracy criticism bleeds into churn, refunds, and slower
              conversion of new members. In practical diligence terms, the question is whether the product's strongest
              claims are truly durable or merely well marketed. Investors should treat that as a core underwriting issue
              rather than a side complaint. That makes the case materially more important than a normal consumer
              complaint.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
