  - id: FE001
    title: Oura Product Architecture Stack
    type: stack
    layout: standard
    summary: >-
      A five-layer view of how Oura turns a ring's sensor stream into app insights, partner integrations, and
      enterprise-facing workflows.
    data:
      layers:
        - label: User Interface Layer
          detail: iOS and Android app, Oura Advisor, and customer-facing dashboards.
        - label: Health Intelligence Layer
          detail: Sleep staging, readiness, resilience, heart health, and metabolic insights.
        - label: Integration Layer
          detail: Oura API v2, webhooks, sandbox, Apple Health / app partners, and organization tools.
        - label: Data Platform Layer
          detail: Cloud storage, model inference, and synchronization of biometrics and scores.
        - label: Sensor / Hardware Layer
          detail: Ring PPG, temperature, motion, and SpO2 sensing with long battery life.
        - label: Feedback / support layer
          detail: Known-issues triage, support workflows, and TCX processes that protect trust when product quality slips.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
