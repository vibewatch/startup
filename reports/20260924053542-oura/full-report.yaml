      - number: '4.2'
        title: Margin and Cash
        blocks:
          - type: paragraph
            body: >-
              The striking change in 2026 is that Oura is no longer just growing; it is also profitable in the public
              numbers now visible. One industry summary of the S-1 reports about 55% gross margin, roughly $61 million
              of net income, and $107 million of adjusted EBITDA for the first nine months of 2026. That is unusually
              strong for a consumer hardware company, but it remains a blended model: hardware still dominates the
              revenue mix, so margin durability will depend on whether subscriptions and add-ons keep compounding faster
              than device sales. Because the public margin bridge is still partial, the valuation debate hinges on
              whether those margins are repeatable after hardware mix and marketing are normalized. In other words, the
              debate is now about durability of profitability rather than whether the company can reach scale.
