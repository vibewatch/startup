  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peers
        blocks:
          - type: paragraph
            body: >-
              The most direct rivals now split into two camps. Samsung, RingConn, Ultrahuman, and Garmin emphasize
              subscription-free ownership and lower total cost, while WHOOP and Oura compete on deeper recovery
              analytics and ongoing software value. Apple and Google remain broader platform threats because they can
              use phone ecosystems and default distribution to turn health features into a bundled layer rather than a
              stand-alone ring category. The key diligence point is that the ring category is now crowded enough that a
              premium price must be justified every day, not just at checkout. The rival set is broad enough that even
              small pricing or distribution changes can move switching behavior faster than before.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
