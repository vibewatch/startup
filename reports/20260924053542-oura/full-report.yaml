  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model
        blocks:
          - type: paragraph
            body: >-
              Oura monetizes through a premium ring sale, a recurring membership, and a growing set of add-ons and
              enterprise deployments. Public disclosures now show a business that is much more than a gadget sale: 2025
              revenue was about $1 billion, nine-month 2026 revenue was $1.21 billion, and external estimates put
              trailing revenue near $1.4 billion. The company says the membership base has reached about 5 million
              paying users, which makes retention and churn more important than one-off hardware volume. The remaining
              diligence question is not whether revenue is large, but how much of it can be held and expanded through
              renewals, add-ons, and enterprise programs. That recurring base is the reason the market is paying up: the
              company is no longer just shipping rings, it is monetizing engagement.
