      - number: '7.2'
        title: Security, Privacy, and Operations
        blocks:
          - type: paragraph
            body: >-
              The operational risk surface is broad because Oura ships a consumer device, a mobile app, a cloud
              pipeline, and enterprise workflows at the same time. The trust center is a real mitigant, but it does not
              eliminate the need for constant quality control. Public known-issues pages show that missing sleep data,
              heart-rate anomalies, and sync problems still surface. Third-party monitoring and security reports also
              imply that the market expects Oura to behave like a real software platform, not just a hardware accessory,
              which raises the bar on uptime, incident response, and privacy governance. When the product underperforms,
              the customer feels it immediately. That operational burden can easily show up as churn if it is not
              managed tightly. The business therefore has to win on reliability as much as on feature depth.
            claimRefs:
              - CR004
              - CR005
              - CR006
