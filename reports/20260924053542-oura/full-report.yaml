      - number: '3.2'
        title: Moat and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Oura's best defense is not being cheapest; it is being the product users keep wearing. The company still
              leans on better sleep and recovery detail, stronger finger-based sensing, and a membership habit that
              turns a device sale into a recurring relationship. That said, the same subscription model that supports
              retention also creates a simple attack vector for rivals that can promise similar hardware without the
              fee. That makes wear-time and data quality the real moat tests: if users stop opening the app or stop
              wearing the ring, the hardware alone becomes much easier to copy. That is why Oura has to keep proving
              that the ring is a habit, not just a gadget.
