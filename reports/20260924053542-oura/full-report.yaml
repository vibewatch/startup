        title: Adoption and Retention
        blocks:
          - type: paragraph
            body: >-
              The adoption story is strong. Oura says it has over 5 million paid members, roughly 85% 12-month
              retention, and millions of rings sold, while third-party commentary points to very high day-to-day wear
              time. Those metrics suggest the product has become habitual rather than episodic, which is the real test
              for a subscription hardware business. The key signal is that the product appears to have moved from trial
              to habit, which is exactly what a subscription hardware business needs to survive competitive pressure.
              The key signal is that the product appears to have moved from trial to habit, which is exactly what a
