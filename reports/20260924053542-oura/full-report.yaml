      - number: '2.3'
        title: Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The category's main adoption friction is not awareness, but economics and preference. Samsung, Garmin,
              Fitbit, and Apple-related alternatives reduce the cost of entry or shift the form factor away from the
              finger, while Oura's subscription makes long-term ownership more expensive than flat-fee or no-fee rivals.
              That does not erase the product advantage, but it does mean growth depends on the market continuing to
              value passive sleep and recovery data enough to pay for recurring access. The unresolved diligence
              question is how large the prevent- ive-health layer becomes once consumers, employers, and clinical buyers
              are all counted together. The main diligence issue is that a subscription ring must keep proving value
              every day, which makes retention, health outcomes, and price perception the decisive adoption variables.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
