  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface
        blocks:
          - type: paragraph
            body: >-
              Oura's customer-facing product is simple to explain: a smart ring plus an app plus a membership. Under the
              hood it is more layered, with biometric sensing, app-based scoring, cloud sync, AI coaching, and a growing
              enterprise surface for organizations and partners. The product is designed around passive, 24/7 wear, so
              battery life, comfort, and sleep accuracy are just as important as raw sensor count. The practical
              question is whether that surface keeps members engaged enough to justify the subscription and keep the
              hardware from becoming a one-time purchase. That matters because the ring only has value if the app keeps
              translating sensor streams into daily behavior change.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
