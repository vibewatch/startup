      - number: '1.2'
        title: Capital, Scale, and Traction
        blocks:
          - type: paragraph
            body: >-
              The latest public financing context points to a very large private-company scale. Oura raised $900 million
              in October 2025 at an approximately $11 billion valuation, then filed confidentially for an IPO in May
              2026 and later surfaced in September reporting that the company could seek a valuation near $16 billion.
              Oura says it passed 5 million paid members, retained roughly 85% of members on a 12-month basis, and
              generated about $1 billion of 2025 revenue with 2026 sales expected to approach $2 billion. The company
              has also said it has sold 3.6 million rings over the past year and now counts more than 750 global
              employees. That combination gives the company a large enough footprint to matter in public markets, but
              still leaves valuation discipline dependent on margin, cohort, and disclosure quality.
            claimRefs:
