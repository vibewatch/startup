      - number: '8.2'
        title: Bull / Base / Bear
        blocks:
          - type: paragraph
            body: >-
              A bull case assumes Oura keeps compounding members, improves enterprise penetration, and sustains
              profitability as a recurring-revenue health platform. A base case assumes growth remains strong but the
              market discounts the company because consumer hardware multiples are not usually this rich. A bear case
              assumes the sleep lawsuit, platform competition, or a compression in consumer willingness to pay forces
              the multiple down even if revenue keeps growing. In other words, the valuation debate is about durability,
              not just size. The range is therefore about business quality and legal cleanliness as much as it is about
              growth rate. The range is therefore about business quality and legal cleanliness as much as it is about
