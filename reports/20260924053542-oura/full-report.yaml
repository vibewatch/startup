      - number: '1.3'
        title: Milestones and Open Risks
        blocks:
          - type: paragraph
            body: >-
              Oura’s trajectory has included a Kickstarter-era proof of concept, a breakout shift into subscriptions,
              the Gen 4 launch, and a fast expansion into enterprise and healthcare channels. The current diligence
              question is whether that momentum survives public-market scrutiny. The company is defending a 2026
              class-action lawsuit over sleep-tracking accuracy claims, so the most important near-term risk is that
              product trust and public disclosures may be tested at the same time that IPO pricing is being negotiated.
              Governance opacity is the quieter risk: the company has disclosed enough to show scale, but not enough to
              give outside investors a full view of control, committee structure, or decision rights.
            claimRefs:
              - CO001
