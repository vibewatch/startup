  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Oura's market is not as generic wearables, but as premium smart rings sold for
              sleep, recovery, and preventive health. That framing matters because the ring competes against both other
              smart rings and the broader set of wrist-worn devices, subscription health platforms, and app-only
              wellness tools. Oura's own distribution through healthcare, research, employers, and government partners
              shows the category is no longer only about consumer hardware; it is a preventive-health workflow that sits
              between consumer wellness and clinical data capture. That boundary also keeps the discussion focused on
              whether Oura owns a durable health habit, not whether it participates in every smartwatch or wellness
              category.
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
