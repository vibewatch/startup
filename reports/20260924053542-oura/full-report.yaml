  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              The public anchor points are now clear enough to frame a range. Reuters and CNBC both indicate that Oura
              moved from a sub-$6 billion valuation in 2024 to an $11 billion valuation after the $900 million Series E,
              while IPO commentary points to a possible $16 billion listing target. Sacra and the filing summaries also
              show revenue scaling quickly enough to support a premium multiple. The key question is no longer whether
              the company can justify a premium over a normal hardware vendor; it is how much premium public investors
              should pay for a consumer-health platform that still has legal and disclosure gaps. That gives investors
              enough visibility to price the company as a platform rather than a single-product hardware vendor. That
              gives investors enough visibility to price the company as a platform rather than a single-product hardware
              vendor.
