      - number: '7.3'
        title: Dependency and Mitigants
        blocks:
          - type: paragraph
            body: >-
              The remaining diligence question is how much of the business depends on a small set of product, channel,
              and partner assumptions. Oura has strong reference customers, but it does not disclose how much revenue
              comes from any one employer, government account, or channel. That means the team needs to show that no
              single partner, platform, or pricing assumption can break the model. The best mitigants are transparency,
              incident discipline, and a clear chain from product quality to retention. If those are in place, the risks
              are manageable; if they are not, the upside case can still be derailed by preventable execution issues. A
              good mitigant is useful only if management can show it works in practice. Without that proof,
              concentration risk can become a valuation risk very quickly.
            claimRefs:
