chapter:
  number: 4
  title: Financials
  summary: Oura now looks like a high-growth hardware-plus-subscription business with
    unusually strong revenue growth and early profitability, but the exact margin
    bridge and capital allocation story still need public-market scrutiny.
sections:
- id: revenue-model
  title: Revenue Model
  body: 'Oura monetizes through a premium ring sale, a recurring membership, and a
    growing set of add-ons and enterprise deployments. Public disclosures now show
    a business that is much more than a gadget sale: 2025 revenue was about $1 billion,
    nine-month 2026 revenue was $1.21 billion, and external estimates put trailing
    revenue near $1.4 billion. The company says the membership base has reached about
    5 million paying users, which makes retention and churn more important than one-off
    hardware volume. The remaining diligence question is not whether revenue is large,
    but how much of it can be held and expanded through renewals, add-ons, and enterprise
    programs. That recurring base is the reason the market is paying up: the company
    is no longer just shipping rings, it is monetizing engagement.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  - TI002
- id: margin-and-cash
  title: Margin and Cash
  body: 'The striking change in 2026 is that Oura is no longer just growing; it is
    also profitable in the public numbers now visible. One industry summary of the
    S-1 reports about 55% gross margin, roughly $61 million of net income, and $107
    million of adjusted EBITDA for the first nine months of 2026. That is unusually
    strong for a consumer hardware company, but it remains a blended model: hardware
    still dominates the revenue mix, so margin durability will depend on whether subscriptions
    and add-ons keep compounding faster than device sales. Because the public margin
    bridge is still partial, the valuation debate hinges on whether those margins
    are repeatable after hardware mix and marketing are normalized. In other words,
    the debate is now about durability of profitability rather than whether the company
    can reach scale.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
  - CI012
  tableRefs:
  - TI003
  figureRefs:
  - FI001
- id: capital-and-underwriting
  title: Capital and Underwriting
  body: Oura has raised about $1.5 billion in total capital, including the $900 million
    Series E led by Fidelity and a $250 million revolving credit facility. That capital
    stack is large enough to support global distribution and product expansion, but
    it also means the IPO will be judged not only on growth, but on whether public
    investors are buying a secondary liquidity event, a new growth war chest, or both.
    The main underwriting question is how much of the current valuation is justified
    by sustainable recurring revenue versus temporary momentum. That underwriting
    story will be judged against the company's legal overhang and the amount of liquidity
    available for product expansion after listing. The filing therefore reads as both
    a growth story and a risk reset.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
