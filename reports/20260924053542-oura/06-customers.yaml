  title: Customers
  summary: Oura's customer base is broadening from premium consumers into employers,
    research, and government, but the public record still hides concentration, cohort,
    and renewal detail.
sections:
- id: customer-segmentation
  title: Customer Segmentation
  body: 'Oura''s customers now span premium consumers, employers, healthcare and research
    buyers, sports organizations, and government or defense programs. That mix matters
    because the company is no longer relying on one demand pool: consumer health habit
    formation drives the ring, while enterprise partnerships and provider workflows
    are becoming an increasingly important layer of expansion. The public mix now
    matters because enterprise and government channels could either widen the moat
    or hide concentration if one segment becomes overly important. The public mix
    now matters because enterprise and government channels could either widen the
    moat or hide concentration if one segment becomes overly important. The public
    mix now matters because enterprise and government channels could either widen
    the moat or hide concentration if one segment becomes overly important.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
- id: adoption-and-retention
  title: Adoption and Retention
  body: The adoption story is strong. Oura says it has over 5 million paid members,
    roughly 85% 12-month retention, and millions of rings sold, while third-party
    commentary points to very high day-to-day wear time. Those metrics suggest the
    product has become habitual rather than episodic, which is the real test for a
    subscription hardware business. The key signal is that the product appears to
    have moved from trial to habit, which is exactly what a subscription hardware
    business needs to survive competitive pressure. The key signal is that the product
    appears to have moved from trial to habit, which is exactly what a subscription
    hardware business needs to survive competitive pressure. The key signal is that
    the product appears to have moved from trial to habit, which is exactly what a
    subscription hardware business needs to survive competitive pressure.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU002
  figureRefs:
  - FU003
- id: concentration-and-expansion
  title: Concentration and Expansion
  body: 'Oura''s expansion channels are encouraging, but the public record is still
    missing the data investors would want on concentration. We know the company serves
    sports teams, government groups, hospitals, banks, and consumer retailers, yet
    we do not know how much revenue each channel contributes or whether any single
    enterprise or partner is material enough to move the model. The remaining gap
    is segment concentration: Oura names many reference customers, but it still does
    not disclose how much any one channel contributes to revenue. The remaining gap
    is segment concentration: Oura names many reference customers, but it still does
    not disclose how much any one channel contributes to revenue. The remaining gap
    is segment concentration: Oura names many reference customers, but it still does
    not disclose how much any one channel contributes to revenue.'
