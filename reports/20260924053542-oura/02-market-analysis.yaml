company:
  name: Oura
chapter:
  number: 2
  title: Market Analysis
  summary: Oura sells into a narrow but fast-growing smart-ring category that is expanding
    into broader preventive-health wearables, yet the true addressable market remains
    definition-sensitive and harder to size than the revenue line suggests.
sections:
- id: market-boundary
  title: Market Boundary
  body: The cleanest way to define Oura's market is not as generic wearables, but
    as premium smart rings sold for sleep, recovery, and preventive health. That framing
    matters because the ring competes against both other smart rings and the broader
    set of wrist-worn devices, subscription health platforms, and app-only wellness
    tools. Oura's own distribution through healthcare, research, employers, and government
    partners shows the category is no longer only about consumer hardware; it is a
    preventive-health workflow that sits between consumer wellness and clinical data
    capture. That boundary also keeps the discussion focused on whether Oura owns
    a durable health habit, not whether it participates in every smartwatch or wellness
    category.
  claimRefs:
  - CM001
  - CM002
  - CM006
  tableRefs:
  - TM001
- id: sizing-and-adoption
  title: Sizing and Adoption
  body: 'Public market-sizing data is strongest at the category level and weaker at
    the exact Oura-specific addressable layer. A recent industry estimate places the
    global smart-ring market near $1.01 billion in 2026 and projects it to grow to
    about $7.8 billion by 2035, while company and investor commentary points to Oura
    as the dominant brand with well over 80% share. Oura''s premium positioning is
    helped by stronger finger-based signals, long battery life, and a recurring subscription
    that makes the product easier to justify for users who care about recovery more
    than step counts. The public sizing lens is therefore useful mainly as a calibration
    device: it shows the category can scale, but it does not by itself prove the exact
    spend Oura can capture.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM010
  - CM011
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: adoption-constraints
  title: Adoption Constraints
  body: The category's main adoption friction is not awareness, but economics and
    preference. Samsung, Garmin, Fitbit, and Apple-related alternatives reduce the
    cost of entry or shift the form factor away from the finger, while Oura's subscription
    makes long-term ownership more expensive than flat-fee or no-fee rivals. That
    does not erase the product advantage, but it does mean growth depends on the market
    continuing to value passive sleep and recovery data enough to pay for recurring
    access. The unresolved diligence question is how large the prevent- ive-health
    layer becomes once consumers, employers, and clinical buyers are all counted together.
    The main diligence issue is that a subscription ring must keep proving value every
    day, which makes retention, health outcomes, and price perception the decisive
    adoption variables.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM012
  tableRefs:
  - TM003
