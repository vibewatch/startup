        eventually absorb Oura.
    - id: layer-broad
      label: Broader wearables market
      detail: Generic fitness watches and bands that set the outer ceiling for consumer
        attention.
    - id: layer-core
      label: Smart-ring category
      detail: The cleanest public estimate at about $1.01 billion in 2026.
    - id: layer-premium
      label: Premium health ring niche
      detail: High-intent users willing to pay for recovery and sleep insights.
