  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式
        blocks:
          - type: paragraph
            body: >-
              Oura 靠高端戒指、会员订阅，以及不断增加的增值服务和企业部署变现。公开数据表明，它已不只是卖消费硬件：2025 年收入约 $1B，2026 年前 9 个月为 $1.21B，外部估算的 TTM 收入接近
              $1.4B。公司称付费会员约 5M，因此留存和流失比单次硬件销量更重要。尽调重点不是收入够不够大，而是有多少收入能靠续订、增值服务和企业项目留住并扩大。经常性收入让市场愿意给出更高估值：Oura
              已不只是出货戒指，也在把用户持续使用转化为收入。
