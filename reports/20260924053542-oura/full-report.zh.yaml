      - number: '6.3'
        title: 客户集中度与业务扩张
        blocks:
          - type: paragraph
            body: >-
              Oura 的扩张渠道令人鼓舞，但公开资料没有披露投资者关心的客户集中度。公司服务体育队、政府部门、医院、银行和零售商，但各渠道收入占比不明，也无法判断是否有单一企业或伙伴足以影响整体业务。Oura
              列出了许多标杆客户，却没有披露任何单一渠道贡献多少收入。
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
