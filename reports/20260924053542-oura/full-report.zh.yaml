      - number: '4.2'
        title: 利润率与现金流
        blocks:
          - type: paragraph
            body: >-
              2026 年最显著的变化是，Oura 不只在增长，公开数据还显示公司已经盈利。一份解读其 S-1 的行业摘要称，2026 年前 9 个月毛利率约 55%，净利润约 $61M，调整后 EBITDA 约
              $107M。对消费硬件公司而言，这样的表现相当突出；但收入仍以硬件为主，利润率能否维持，取决于订阅和增值服务能否持续跑赢设备销售增速。利润构成披露尚不完整，估值争论因此落在：把硬件收入占比和营销费用调整到常态水平后，这些利润率还能否延续。现在要判断的是盈利质量能否持续，而不是公司能否做大。
