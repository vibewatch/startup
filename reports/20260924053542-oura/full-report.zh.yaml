      - number: '4.3'
        title: 资本结构与投资判断
        blocks:
          - type: paragraph
            body: >-
              Oura 获得的总资本约 $1.5B，包括 Fidelity 领投的 $900M E 轮融资和 $250M 循环信贷额度。这笔资金足以支撑全球分销和产品扩张，但 IPO
              仍要回答一个问题：发行中究竟是老股转让为现有股东提供流动性、公司增发新股筹集增长资金，还是两者兼有。估值判断的关键，是当前价格有多少由可持续的经常性收入支撑，又有多少来自暂时的增长势头；投资者还会权衡未决诉讼，以及上市后能用于产品扩张的资金。因此，这份申报既讲增长，也是在重新评估风险。
            claimRefs:
              - CI008
              - CI009
              - CI010
