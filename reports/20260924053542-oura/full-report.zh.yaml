      - number: '2.2'
        title: 市场规模与采纳节奏
        blocks:
          - type: paragraph
            body: >-
              公开数据对智能戒指这一品类的规模估算较有力，但对 Oura 实际可触达的市场估算较弱。近期行业预测称，全球智能戒指市场在 2026 年接近 $1.01B，到 2035 年约为 $7.8B；公司和投资者评论则认为
              Oura 是主导品牌，份额远超 80%。指端传感信号更强、续航更长；对恢复比步数更看重的用户，也更容易觉得订阅物有所值，这些因素支撑了 Oura 的高端定位。市场规模数据能说明品类有望做大，却不能单独证明
              Oura 能拿下多少支出。
            claimRefs:
