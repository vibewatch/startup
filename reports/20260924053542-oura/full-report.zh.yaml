      - number: '1.3'
        title: 发展里程碑与未决风险
        blocks:
          - type: paragraph
            body: >-
              Oura 从 Kickstarter 时期完成概念验证（PoC），随后转向订阅模式、推出 Gen 4，并快速拓展企业和医疗渠道。眼下要看的是，这股势头能否经受公开市场检验。公司正为 2026
              年一宗围绕睡眠监测准确度主张的集体诉讼辩护；IPO
              定价谈判期间，产品信任和信息披露可能同时受到考验。治理不透明则是另一项较隐蔽的风险：现有披露能说明业务规模，却不足以让外部投资者看清控制权、委员会架构和决策权归属。
            claimRefs:
