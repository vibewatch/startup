      - number: '5.3'
        title: 信任、安全与产品风险
        blocks:
          - type: paragraph
            body: >-
              Oura
              持续投入安全与合规，但公开的已知问题页面也列出睡眠数据缺失、心率异常和同步故障等会直接影响信任的问题。产品可靠性取决于传感器、固件、同步、云端评分和客服支持整条链路。一旦同步或评分出错，即便安全防护到位，用户也可能很快不再相信这款健康产品。Oura
              既要把产品设计做好，也要严守运营质量，才能维持用户对这一品类的信心。
