      - number: '1.2'
        title: 资本、规模与业务表现
        blocks:
          - type: paragraph
            body: >-
              最新公开融资信息显示，Oura 已是一家规模可观的非上市公司。公司于 2025 年 10 月以约 $11B 估值融资 $900M，2026 年 5 月秘密提交 IPO 文件；9 月的报道则称，公司可能寻求接近
              $16B 的估值。Oura 称付费会员已超过 5M，12 个月留存率约 85%；2025 年收入约 $1B，2026 年销售额预计接近 $2B。公司还称，过去一年售出 3.6M 枚戒指，全球员工超过 750
              人。这一规模已足以引起公开市场重视，但估值仍要看利润率、用户队列表现和披露质量。
