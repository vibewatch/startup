      - number: '2.3'
        title: 采纳阻碍
        blocks:
          - type: paragraph
            body: >-
              这一品类的主要采纳阻力不是认知度，而是成本和用户偏好。Samsung、Garmin、Fitbit 及 Apple 相关产品降低了尝鲜门槛，或提供不同于戒指的形态；Oura
              的订阅则让长期使用成本高于一次性付费或免订阅的竞品。这并不抵消产品优势，但增长仍取决于用户是否持续认可睡眠和恢复数据的价值，并愿意为此付费。另一项未决问题是，把消费者、雇主和临床买方都纳入后，预防性健康市场究竟有多大。订阅制戒指还必须每天证明价值，因此留存、健康结果和价格接受度都是采纳的关键变量。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
