  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与交付界面
        blocks:
          - type: paragraph
            body: >-
              Oura 面向消费者的产品很简单：戒指、App 和会员服务。底层则包括生物识别传感、App 评分、云端同步、AI
              健康指导，以及不断扩展的机构和合作伙伴服务。戒指为全天候被动佩戴设计，续航、舒适度和睡眠准确性与传感器数量同样重要。关键是产品能否持续吸引会员，证明订阅值得付费，而不让戒指沦为一次性硬件。只有 App
              能把传感数据转成日常行为改变，戒指才真正有价值。
