    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与研发布局
        blocks:
          - type: paragraph
            body: >-
              Oura Health Ltd. 由 Petteri Lahtela、Kari Kivelä 和 Markku Koskela 于 2013 年在芬兰 Oulu
              创立。公司现以旧金山为运营中心，工程和产品研发仍扎根 Oulu。核心产品 Oura Ring 4 是一款钛金属智能戒指，配套订阅 App 提供睡眠、准备度、活动、心脏健康和女性健康洞察。到 2026 年，Oura
              已不再只是小众硬件厂商，而是把自己定位为面向消费者、企业、临床机构和政府的健康平台。尽调重点也随之改变：关键不再是戒指能否做出来，而是公司能否凭借持续使用行为，为更大的平台主张提供支撑。
