      - number: '3.2'
        title: 护城河与差异化
        blocks:
          - type: paragraph
            body: >-
              Oura
              最好的防守不是卖得最便宜，而是让用户一直戴着。公司靠更细致的睡眠与恢复分析、更强的指端传感，以及把硬件购买转成持续会员关系来支撑差异化。但订阅制也是对手的突破口：竞品若提供相近硬件却不收订阅费，就能直接挑战
              Oura。真正的护城河要看佩戴时长和数据质量；用户若不再打开 App 或戴戒指，硬件本身很容易被复制。Oura 必须持续证明这是一种日常习惯，而不只是新鲜玩意。
