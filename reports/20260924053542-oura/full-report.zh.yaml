companyProfile:
  summary: >-
    Oura Health Ltd. 成立于 2013 年，是一家芬兰健康科技公司，现总部位于加利福尼亚州旧金山（San Francisco, CA）。公司设计并销售 Oura Ring——一款钛金属智能戒指，采用“App
    加会员”模式追踪睡眠、活动、身心准备度（Readiness）以及其他生物识别指标。收入来自硬件销售与 Oura Membership
    经常性订阅，企业端和科研端产品则构成了第二增长曲线。公开报道的融资与估值里程碑表明，该公司已从早期消费级可穿戴设备厂商，跨入受资本支持的成熟期健康平台。
  foundedDate: '2013-01-01'
  founders:
    - name: Petteri Lahtela
      role: 联合创始人兼首任 CEO
      background: 芬兰连续创业者；从创立起带领 Oura 完成早期产品发布。
    - name: Kari Kivela
      role: 联合创始人兼首席技术官（CTO）
      background: 硬件与传感器技术负责人；在 Oulu 主导戒指硬件开发。
    - name: Markku Koskela
      role: 联合创始人
      background: Oura 联合创始人，参与了早期产品与业务开发。
  foundingLocation: Oulu, Finland
  headquarters: San Francisco, CA (global HQ); Oulu, Finland (R&D center)
  productSummary: >-
    Oura Ring Gen 4 是一款配备生物识别传感器的钛金属智能戒指，搭配专属 App 呈现睡眠（Sleep）、身心准备度（Readiness）与活动（Activity）评分。Oura 还提供 API
    与机构级产品，将数据平台延伸至科研、医疗机构及企业工作流中。
  customerFocus: 关注健康的消费者、运动员、科研机构、雇主及政府采购方。
  businessModel: 硬件销售加经常性订阅，辅以持续扩张的企业端与合作伙伴业务。
  stage: Late Stage / Series E
  fundingStatus: 完成 $900M 融资后以 $11B 估值敲定 E 轮融资；累计融资额约 $1.5B。
  disclosureProfile: private-undisclosed
