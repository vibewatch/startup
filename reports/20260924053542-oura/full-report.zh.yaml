      - number: '3.3'
        title: 竞争风险
        blocks:
          - type: paragraph
            body: >-
              最大的竞争风险不是某一款更好的戒指，而是智能戒指逐渐变得同质化。若消费者觉得不订阅也能获得足够好的数据，Oura 就会失去定价能力。Apple 或 Google 若把健康监测捆进默认平台功能，Oura
              就只能靠科学依据、信任和垂直场景守住高端细分市场，不能指望大众市场规模取胜。平台巨头若推出更便宜或更方便的默认健康服务，竞争焦点也会从功能转向捆绑和便利。
