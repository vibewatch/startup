      - number: '6.2'
        title: 采纳与留存
        blocks:
          - type: paragraph
            body: Oura 称付费会员超过 500 万，12 个月留存率约 85%，戒指销量达数百万枚；第三方评论也称用户日常佩戴时间很长。这些指标说明产品可能已从短期尝鲜变成日常习惯，而这正是订阅制硬件能否经受竞争的关键。
            claimRefs:
