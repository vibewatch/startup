  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界
        blocks:
          - type: paragraph
            body: >-
              Oura 的市场不宜笼统归入可穿戴设备，更适合界定为面向睡眠、恢复和预防性健康的高端智能戒指。它既要与其他智能戒指竞争，也要面对腕戴设备、订阅健康平台和纯 App 健康工具。Oura
              借助医疗、科研、雇主和政府伙伴拓宽分发渠道，说明这类产品不再只是消费硬件，也进入了消费健康与临床数据采集之间的预防性健康工作流。尽调应聚焦于 Oura
              能否成为用户长期坚持的健康习惯，而不是它是否覆盖所有智能手表或健康品类。
            claimRefs:
              - CM001
              - CM002
              - CM006
