  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品
        blocks:
          - type: paragraph
            body: >-
              直接对手分成两类：Samsung、RingConn、Ultrahuman 和 Garmin 强调免订阅、总成本更低；WHOOP 与 Oura 则比拼恢复分析深度和持续的软件价值。Apple 和 Google
              的威胁更广，它们可以借助手机生态和默认分发，把健康功能作为平台服务打包，而不必单卖戒指。如今智能戒指竞争已相当拥挤，Oura
              必须让用户每天都觉得溢价值得，而不只是购买时认可。竞品选择变多后，小幅调价或渠道变化也更容易促使用户转向。
            claimRefs:
