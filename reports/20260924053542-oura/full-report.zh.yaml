            body: >-
              Oura
              的客户包括高端消费者、企业雇主、医疗和科研买方、体育组织，以及政府和国防项目。消费健康习惯支撑戒指业务，企业合作和医疗工作流则成为新的增长层，公司不再只依赖一种需求。企业和政府渠道可能拓宽护城河，也可能在某一客群占比过高时掩盖集中度风险；但公开资料尚不足以判断哪种情况更接近现实。
