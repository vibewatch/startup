      - - IPO 目标估值
        - $16B
        - Value Add VC / 申报文件点评
        - 中
        - 相较私募轮隐含溢价
      - - TTM 收入
        - $1.4B
        - Sacra
        - 中
        - 支撑高成长性估值溢价
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值判断
      - 核心风险
    notes: 情景仅作方向性参考，用于辅助投资判断，并非精确定价工具。
    rows:
      - - 乐观
        - 会员数持续增长、企业业务扩张、利润率提升
        - 维持高估值倍数
        - 业务执行不出现重大偏差
      - - 基准
        - 保持强劲增长，但估值倍数温和收缩
        - 估值依然偏高但站得住脚
        - 市场按「硬件 + 软件」综合业务模式估值
      - - 悲观
        - 诉讼阴影未散、消费者信任受挫或竞争加剧
        - 估值倍数大幅收缩
        - 业务仍在增长但估值严重受损
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: 上市可比公司与历史先例表
    columns:
      - 可比标的
      - 参考价值
      - 核心启示
    notes: 可比公司仅供粗略参考，目前没有与 Oura 完全一致的公开上市公司。
    rows:
      - - WHOOP
        - 以订阅制为主的健身可穿戴设备
        - 印证经常性收入框架的合理性
      - - Garmin
        - 硬件驱动的可穿戴老牌厂商
        - 表明纯硬件业务估值倍数更低
      - - Apple Watch / 健康平台
        - 规模效应与生态系统溢价
        - 凸显生态渠道分发优势
      - - 消费健康领域私募融资
        - 近期融资可比交易
        - 显示私募市场愿意给出高估值
    claimRefs:
      - CV001
      - CV004
      - CV011
figures:
  - id: FO001
    title: Oura 公司发展里程碑时间线
    type: timeline
    summary: 梳理 Oura 从创立、扩张到融资、产品发布和诉讼的关键节点，呈现其 IPO 进程及当下的信任风险。
    data:
      items:
        - label: 公司成立（2013 年）
          detail: Lahtela、Kivelä 和 Koskela 在 Oulu 创立 Oura Health Ltd.。
          tone: neutral
          claimRefs:
            - CO001
        - label: Kickstarter 众筹时期（2015 年）
          detail: 早期戒指产品开创了智能戒指品类，也培养了消费者日常佩戴的习惯。
          tone: positive
          claimRefs:
            - CO001
            - CO003
        - label: 拓展企业端市场（2020—2024 年）
          detail: 团队与机构合作跳出消费级可穿戴范畴，深入医疗健康、竞技体育和政府领域。
          tone: positive
          claimRefs:
            - CO005
            - CO010
        - label: D 轮融资（2024 年 12 月）
          detail: 融资 $200M，估值升至 $5.2B，市场对其规模的预期随之上调。
          tone: positive
          claimRefs:
            - CO006
        - label: E 轮融资（2025 年 10 月）
          detail: 融资 $900M，估值约 $11B。
          tone: positive
          claimRefs:
            - CO006
        - label: 秘密提交 IPO 文件（2026 年 5 月）
          detail: Oura 向 SEC 秘密提交注册声明草案。
          tone: positive
          claimRefs:
            - CO007
        - label: IPO 目标估值传闻（2026 年 9 月）
          detail: 据报道，IPO 目标估值接近 $16B。
          tone: neutral
          claimRefs:
            - CO007
            - CO008
        - label: 睡眠准确度诉讼（2026 年 8 月）
          detail: 一宗拟议集体诉讼质疑公司的睡眠监测主张。
          tone: negative
          claimRefs:
            - CO012
        - label: 2026 年收入预期调整
          detail: 公开评论目前估算其年收入接近 $1B，并指出有望进一步迈向 $2B。
          tone: positive
          claimRefs:
            - CO008
        - label: 业务规模里程碑
          detail: Oura 称公司有 750 多名员工和数百万会员。
          tone: positive
          claimRefs:
            - CO009
            - CO010
  - id: FM001
    title: Oura 市场空间测算分层
    type: pyramid
    summary: 这套三层市场框架将 Oura 放在预防性健康可穿戴设备市场中，聚焦其高端智能戒指业务；其中智能戒指品类的公开估算最清晰。
    data:
      nodes:
        - id: layer-ecosystem
          label: 广义预防性健康生态
          detail: 涵盖健康订阅、实验室检测、健康指导及周边服务，未来可能将 Oura 纳入其中。
        - id: layer-broad
          label: 广义可穿戴设备市场
          detail: 通用健身手表与手环，为争夺消费者注意力划出更广的市场边界。
        - id: layer-core
          label: 智能戒指细分品类
          detail: 最清晰的公开预估规模为 2026 年约 $1.01B。
        - id: layer-premium
          label: 高端健康戒指细分市场
          detail: 愿意为恢复和睡眠洞察付费的高意愿用户。
        - id: layer-company
          label: Oura 平台业务
          detail: 当前业务规模接近 $1.4B 的 TTM 收入。
        - id: layer-enterprise
          label: 企业端与临床延伸市场
          detail: 雇主、科研机构和医疗服务方的工作流，把市场延伸到消费硬件之外。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM011
  - id: FP001
    title: 竞争格局定位图
    type: quadrant
    summary: Oura 位于「洞察深、规模中等」象限：睡眠分析深度胜过低价竞品，但订阅费形成门槛，生态规模也小于 Apple、Samsung 和 Garmin。
    data:
      points:
        - label: Oura Ring 4
          x: 6
          'y': 9
        - label: Samsung Galaxy Ring
          x: 8
          'y': 6
        - label: WHOOP
          x: 5
          'y': 8
        - label: Garmin CIRQA
          x: 7
          'y': 6
        - label: Fitbit Air
          x: 5
          'y': 4
        - label: RingConn / Ultrahuman
          x: 3
          'y': 5
        - label: Apple Watch / 平台型可穿戴设备
          x: 10
          'y': 7
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP010
  - id: FI001
    title: 收入模型拆解桥接图
    type: waterfall
    summary: Oura 的硬件销售、会员订阅和融资共同支撑起当前业务规模，已足以进入公开市场投资者的评估范围。
    data:
      items:
        - label: 2024 年收入
          value: 500
        - label: 2025 年收入
          value: 1000
        - label: 2026 年 9M 收入
          value: 1210
        - label: TTM 预估收入（2026 年 6 月）
          value: 1400
        - label: IPO 目标估值
          value: 16000
        - label: 潜在 IPO 募资额
          value: 16000
    approximationNotes: 收入数值为公司自述或预估，未经审计；目标估值来自报道，尚非最终定价。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
  - id: FE001
    title: Oura 产品技术架构体系
    type: stack
    summary: 五层架构展示 Oura 如何把戒指传感器数据转成 App 洞察、伙伴集成和企业工作流。
    data:
      layers:
        - label: 用户界面层
          detail: iOS 和 Android 客户端、Oura Advisor 以及面向用户的分析看板。
        - label: 健康智能层
          detail: 睡眠分期、准备度、韧性、心脏健康和代谢洞察。
        - label: 生态集成层
          detail: Oura API v2、webhooks、沙箱环境、Apple Health 与第三方应用伙伴，以及机构端工具。
        - label: 数据平台层
          detail: 云端存储、算法模型推理，以及生物体征与健康评分的同步。
        - label: 传感器与硬件层
          detail: 戒指 PPG、温度、运动和 SpO2 传感器，并具备长续航能力。
        - label: 反馈与客户支持层
          detail: 已知问题分流、客服工作流与 TCX 流程，在产品体验出现波动时筑牢用户信任。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE010
  - id: FU003
    title: 客户全生命周期旅程图
    type: journey-map
    summary: 展示 Oura 如何把一次性戒指销售转成持续订阅，并让部分客户进一步拓展到企业或临床合作。
    data:
      items:
        - label: 认知发现
          description: 借助社交背书、体育赛事曝光、测评口碑与合作伙伴渠道触达用户。
          claimRefs:
            - CU008
            - CU010
        - label: 购买决策
          description: 用户通过 DTC 官网或零售渠道下单，随后确定尺寸并激活会员订阅。
          claimRefs:
            - CU001
            - CU004
        - label: 初始设置
          description: 戒指根据用户特征完成校准，并建立其睡眠和恢复基线。
          claimRefs:
            - CU004
        - label: 日常互动
          description: 晨间评分和连续监测指标，让用户养成每天查看 App 的习惯。
          claimRefs:
            - CU005
            - CU006
        - label: 订阅转化
          description: 完整洞察一旦形成黏性，会员订阅就会带来持续收入。
          claimRefs:
            - CU005
            - CU007
        - label: 增购扩展与口碑推荐
          description: 部分用户会购买 Health Panels、加入企业项目，或向他人推荐 Oura。
          claimRefs:
            - CU008
            - CU009
            - CU010
        - label: 售后支持与口碑推荐
          description: 满意的用户分享反馈、推荐产品，有时也会推动企业或临床场景的拓展。
          claimRefs:
            - CU011
            - CU012
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU008
      - CU011
