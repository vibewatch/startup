companyProfile:
  summary: >-
    Oura Health Ltd. is a Finnish health technology company founded in 2013 and now headquartered in San Francisco, CA.
    It designs and sells the Oura Ring, a titanium smart ring that tracks sleep, activity, readiness, and other
    biometrics through an app plus membership model. Revenue comes from hardware sales and a recurring Oura Membership
    subscription, with enterprise and research offerings adding a second growth layer. Publicly reported funding and
    valuation milestones show the company moving from an early-stage consumer wearable to a late-stage, investor-backed
    health platform.
  foundedDate: '2013-01-01'
  founders:
    - name: Petteri Lahtela
      role: Co-Founder & Founding CEO
      background: Serial Finnish entrepreneur; led Oura from founding through initial product launches.
    - name: Kari Kivela
      role: Co-Founder & Chief Technology Officer
      background: Hardware and sensor technology leader; helped drive ring hardware development in Oulu.
    - name: Markku Koskela
      role: Co-Founder
      background: Co-founded Oura and contributed to early product and business development.
  foundingLocation: Oulu, Finland
  headquarters: San Francisco, CA (global HQ); Oulu, Finland (R&D center)
  productSummary: >-
    The Oura Ring Gen 4 is a titanium smart ring with biometric sensors and a companion app that surfaces Sleep,
    Readiness, and Activity scores. Oura also offers API and organizational products that extend the data platform into
    research, provider, and enterprise workflows.
  customerFocus: Health-conscious consumers, athletes, research organizations, employers, and government buyers.
  businessModel: Hardware sales plus recurring subscription, with a growing enterprise / partnership layer.
  stage: Late Stage / Series E
  fundingStatus: Series E closed at an $11B valuation after a $900M round; total funding is roughly $1.5B.
  disclosureProfile: private-undisclosed
summary:
