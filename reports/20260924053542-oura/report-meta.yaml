  topStrengths:
    - Category leader in smart rings with a large installed base and strong brand recognition.
    - Recurring subscription model creates a meaningful software layer on top of hardware sales.
    - Enterprise, research, and government references broaden the TAM beyond consumers.
    - Public revenue and profitability signals show much more scale than an early-stage wearable startup.
  topRisks:
    - Sleep-tracking lawsuit and consumer accuracy criticism could hurt trust and retention.
    - Public disclosures still leave margin, cash-flow, and cohort economics incomplete.
    - Subscription-free competitors and platform incumbents can pressure pricing power.
    - Channel concentration and partner dependence remain opaque.
  unresolvedGaps:
    - Channel-level revenue mix and concentration.
    - Cash flow, CAC payback, and full margin bridge.
    - Resolved legal posture around sleep-tracking accuracy claims.
