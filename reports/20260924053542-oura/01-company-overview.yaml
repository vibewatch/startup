company:
  name: Oura
chapter:
  number: 1
  title: Company Overview
  summary: Oura has shifted from a category-leading smart-ring company into an IPO-bound preventive-health platform with strong membership retention, a large installed base, and a still-opaque governance structure.
sections:
  - id: identity-and-footprint
    title: Identity and Footprint
    body: >-
      Oura Health Ltd. was founded in Oulu, Finland in 2013 by Petteri Lahtela, Kari Kivelä, and Markku Koskela.
      The business now operates from San Francisco while keeping engineering and product development anchored in
      Oulu. Its core product remains the Oura Ring 4, a titanium smart ring paired with a subscription app that
      surfaces sleep, readiness, activity, heart-health, and women’s-health insights. In 2026 the company is no
      longer a niche hardware maker: it is positioning itself as a consumer health platform with enterprise,
      clinical, and government-facing distribution. That shift matters because the diligence question is no longer
      whether the ring exists, but whether the company can defend a larger platform claim with recurring behavior.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
    tableRefs:
      - TO001
      - TO002
  - id: capital-and-scale
    title: Capital, Scale, and Traction
    body: >-
      The latest public financing context points to a very large private-company scale. Oura raised $900 million in
      October 2025 at an approximately $11 billion valuation, then filed confidentially for an IPO in May 2026 and
      later surfaced in September reporting that the company could seek a valuation near $16 billion. Oura says it
      passed 5 million paid members, retained roughly 85% of members on a 12-month basis, and generated about $1
      billion of 2025 revenue with 2026 sales expected to approach $2 billion. The company has also said it has sold
      3.6 million rings over the past year and now counts more than 750 global employees. That combination gives the
      company a large enough footprint to matter in public markets, but still leaves valuation discipline dependent on
      margin, cohort, and disclosure quality.
    claimRefs:
      - CO004
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO003
  - id: milestones-and-risks
    title: Milestones and Open Risks
    body: >-
      Oura’s trajectory has included a Kickstarter-era proof of concept, a breakout shift into subscriptions, the
      Gen 4 launch, and a fast expansion into enterprise and healthcare channels. The current diligence question is
      whether that momentum survives public-market scrutiny. The company is defending a 2026 class-action lawsuit
      over sleep-tracking accuracy claims, so the most important near-term risk is that product trust and public
      disclosures may be tested at the same time that IPO pricing is being negotiated. Governance opacity is the
      quieter risk: the company has disclosed enough to show scale, but not enough to give outside investors a full
      view of control, committee structure, or decision rights.
    claimRefs:
      - CO001
      - CO003
      - CO012
    figureRefs:
      - FO001
