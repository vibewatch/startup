callouts:
- calloutType: insight
  title: Elimination of Native Gas Tokens as a Moat and Unit Economics Driver
  body: By replacing volatile native token gas with an enshrined Fee AMM settling in stablecoins, Tempo removes the chief
    accounting friction hindering corporate treasury adoption. However, this structure transforms validator compensation from
    speculative token dilution into a direct cash-flow extraction from transaction volume, requiring high sustained volume
    to support network economics.
  claimRefs:
  - CI001
  - CI002
  - CI006
- calloutType: risk
  title: Platform Neutrality and Validator Censorship Concerns
  body: Tempo's permissioned initial validator set and close governance alignment with Stripe introduce platform neutrality
    skepticism among competing payment processors. Industry observers note that identifiable institutional validators face
    distinct regulatory enforcement and censorship risks compared to decentralized settlement networks.
  claimRefs:
  - CI008
  - CI012
  - CI013
