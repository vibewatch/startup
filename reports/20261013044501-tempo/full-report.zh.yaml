  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心架构与执行模型
        blocks:
          - type: paragraph
            body: >-
              Tempo 是独立的 Layer-1 区块链，专门为高吞吐稳定币结算打造，而非通用去中心化计算。不同于继承底层结算延迟或桥接安全风险的 Ethereum Layer-2 Rollup，Tempo 把
              Paradigm 的 Reth 执行客户端与 Simplex BFT 共识结合在自主底层，提供亚秒级确定性终局，架构容量最高达每秒 100,000
              笔交易。这套架构消除了通用工作量证明和权益证明链常见的概率性重组，满足企业结算系统和销售终端的零重组要求。更重要的是，Tempo 完全兼容以太坊虚拟机，目标对接 Osaka 硬分叉，让开发者无需迁移摩擦即可用
              Solidity、Foundry、Hardhat 等标准以太坊工具链编写、测试和部署智能合约。但完全依赖 Reth
              作为主执行引擎，也带来客户端多样性集中风险：未处理的客户端漏洞可能令最初的精选验证者集合停止执行网络。
