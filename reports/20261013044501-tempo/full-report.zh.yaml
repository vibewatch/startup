      - number: '1.2'
        title: 管理层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Tempo 的高管架构围绕共同孵化机构股东的高级支持搭建。加密投资公司 Paradigm 联合创始人兼管理合伙人 Matt Huang 担任 Tempo 首席执行官和主要治理负责人，同时继续担任 Paradigm
              管理合伙人。Stripe 首席执行官 Patrick Collison 负责战略分发协同，并公开将 Tempo 定位为 Stripe 后续商业产品发布的默认区块链基础设施。技术执行和客户架构由 Paradigm
              首席技术官 Georgios Konstantopoulos 指导，依托 Paradigm 的核心工程能力打造 Reth Rust 执行客户端。这个架构让 Tempo 拥有罕见的技术履历和覆盖 Stripe
              商户网络的即时商业触达，但也形成明显的关键人物和治理依赖。Huang 与 Collison 高度集中战略决策和优先级，一旦 Stripe 内部产品与在链上建设的竞争支付平台发生商业冲突，Tempo
              能否保持独立治理仍存疑问。
            claimRefs:
              - CO003
