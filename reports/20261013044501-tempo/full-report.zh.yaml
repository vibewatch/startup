      - number: '2.3'
        title: 买方分层、采购画像与预算归属
        blocks:
          - type: paragraph
            body: >-
              Tempo
              的支付优先基础设施覆盖三类核心客户：数字原生电商商户、机构银行与金融科技平台，以及自主人工智能开发者。企业商户和零工经济平台由首席财务官主导支付收款和承包商付款预算，希望降低支付处理开销、绕开跨境电汇延迟并消除汇率波动风险。机构银行和交易银行部门从资金与流动性运营预算出发评估
              Tempo，要求严格兼容 ISO 20022 消息标准，以便在不重构后台对账的情况下，把传统清算系统接入全天候区块链结算。与此同时，Stripe 共同编写的 Machine Payment
              Protocol（MPP）引入了自主 AI 智能体这一新买方类别：它们可基于标准 HTTP 402 协议进行程序化微计量和 API 变现，工程负责人则为机器对机器商业分配自动化软件预算。
            claimRefs:
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: 采用催化剂、监管约束与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Tempo
              的主要采用催化剂来自企业对传统支付结算摩擦的强烈不满、企业对受监管稳定币日益熟悉，以及直接用稳定币支付交易费而不暴露于投机代币的独特易用性。专用协议支付通道把商业转账与网络拥堵隔离，带来可预测的企业级结算可靠性。但显著的结构性约束会压低市场扩张速度。企业区块链项目在去中心化金融参与者和银行监管者中面临强烈怀疑，焦点包括平台中立性、验证者集中化和司法辖区责任。Tempo
              初期由包含 Stripe、Visa 和机构托管方的许可制验证者集合控制，批评者因此强调单点故障风险，并质疑竞争支付平台是否会信任一个与 Stripe 深度结盟的网络。此外，Tempo
              尚未公开披露经审计的交易费率、毛处理利润或净商户留存指标，使其底层单位经济性和独立变现能力存在重大尽调不确定性。
            claimRefs:
              - CM005
              - CM008
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 将支付与 Gas 波动战略性脱钩
            body: Tempo 用 TIP-20 稳定币 Gas 费结算和专用支付通道替代波动性原生 Gas 代币，直击企业采用区块链的主要运营障碍，让资金部门无需持有投机性代币也能预测交易成本。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: 中心化与平台中立性隐患
            body: 初期在企业管理下采用许可制验证者集合，会带来监管责任和平台中立性难题；竞争金融机构及加密原生生态因此质疑 Tempo 能否保持不偏不倚的全球结算工具地位。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与替代支付通道
        blocks:
          - type: paragraph
            body: >-
              Tempo 进入日益激烈的支付市场，面对三类明显替代方案：通用高速 Layer-1 网络、新兴的发行方联盟稳定链，以及传统代理行系统。Solana、以太坊 Rollup
              等多用途区块链已获得早期零售交易量和开发者试验，但其架构让商业支付直接与波动性 DeFi 清算、NFT 铸造和套利活动竞争。Tempo 严格定位为支付结算引擎，依靠 Stripe
              广泛的商户和平台覆盖，而不是依靠投机性代币流动性激励来推动采用。与此同时，Circle 计划推出的 Arc 区块链和 Tether 支持的 Plasma
              等发行方联盟网络，分别针对机构资本市场和零售汇款优化，直接挑战 Tempo 成为国际稳定币流动默认结算层的目标。
            claimRefs:
              - CP001
              - CP007
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP007
              - CP013
      - number: '3.2'
        title: 架构权衡与功能矩阵
        blocks:
          - type: paragraph
            body: >-
              Tempo 的架构直面通用链长期阻碍企业采用稳定币的核心摩擦。在 Ethereum、Solana 等网络上，交易费必须用 ETH 或 SOL
              等波动性原生代币支付，迫使企业财务和资金团队购入、管理并对冲投机性加密资产。Tempo 完全取消原生 Gas
              代币，让企业用受支持的美元稳定币结算网络费，再由集成的自动做市商把费用资产直接换成验证者偏好的代币。Tempo 还引入专用支付通道，为 TIP-20
              转账预留协议级区块空间，确保高量付款和汇款即使在网络整体繁忙时也能以低于千分之一美元的可预测成本执行。为接入企业 ERP 和核心银行账本，TIP-20 转账原生嵌入 32 字节交易备注，并与 ISO 20022
              消息标准对齐，弥合去中心化账本与传统代理行之间的差距。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
      - number: '3.3'
        title: 结算经济性与产品打包动态
        blocks:
          - type: paragraph
            body: >-
              结算成本和执行延迟，是商业商户评估替代通道时的关键标准。传统代理行除了电汇费，还常在中间环节扣除百分之二至百分之七的费用，并需两至三个工作日完成国际电汇。相比之下，Tempo 采用 Simplex BFT
              共识，在 0.5 至 0.6 秒内实现亚秒级确定性终局，避免可能干扰大额商业记账的链重组风险。Stripe 报告称，Tempo 每笔转账的固定成本约为 $0.001，相比 Solana 或 Ethereum
              Layer-2 波动的优先费，成本极其可预测。除人工发起的商业支付外，Tempo 与 Stripe 共同编写 Machine Payments Protocol，重新启用 HTTP 402，为自主 AI
              智能体提供按会话的标准化微额收费批处理，开辟传统卡网络和银行基础设施无法以经济方式服务的高频结算通道。
            claimRefs:
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP010
      - number: '3.4'
        title: 护城河持久性、治理审视与替代风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Tempo 具备技术能力，且可借助 Stripe 收购 Bridge 的 11 亿美元交易和既有处理规模获得战略分发，它仍面临明显的治理与结构性替代风险。Tempo 由 Stripe 和 Paradigm
              孵化，并以经过筛选的许可制验证者结构启动 2026 年 3 月主网，因此行业批评者质疑竞争支付聚合商是否会信任一个可能偏向 Stripe 专有服务的企业支持账本。此外，包括 Visa、Deutsche Bank
              和 Standard Chartered 在内的重量级机构设计伙伴正在 Tempo 与 Circle 的 Arc 等竞争网络之间多栖部署，说明一线金融机构会维持多元结算通道，而非完全押注 Stripe
              生态。Tempo 的护城河最终取决于能否按计划转向无许可验证，同时保住受监管金融企业所要求的严格延迟、确定性费用上限和合规保障。
            claimRefs:
              - CP005
              - CP011
