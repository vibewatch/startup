      - number: '4.4'
        title: 财务投资判断与尽调重点
        blocks:
          - type: paragraph
            body: >-
              从财务投资判断看，Tempo 是一项机构级支付基础设施资产：资本充足性罕见，战略支持者顶级，产品论点则瞄准 190 万亿美元的全球跨境支付结算市场。5
              亿美元资产负债表缓冲，为漫长的市场采用周期提供了不受削弱的防御垫（CI010、CI011）。但严谨的机构投资判断不能忽略关键证据缺口和结构性治理风险。由于 Tempo 依靠 Visa、Stripe
              等企业伙伴组成的许可制验证者集合，加密分析师和法律学者警告，网络把审查责任和监管暴露集中在可识别实体上，这些实体可能被迫限制交易（CI012）。此外，知名支付基础设施架构师质疑商业竞争者和竞争商户收单机构是否愿意把关键金融流量交给一个与
              Stripe 紧密关联的账本（CI013）。再加上公开单位经济性、净费率和客户获取成本完全缺乏验证，在以 50 亿美元私人估值为基准评估股权回报前，财务结论需要严格的确认性尽调（CI014）。
