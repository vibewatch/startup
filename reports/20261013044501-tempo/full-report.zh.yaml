  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将企业规模、架构差异化、治理风险和估值纪律连接到“继续研究”立场的决策流程。
    data:
      nodes:
        - id: scale-and-sponsorship
          label: 规模与赞助
          description: Stripe 和 Paradigm 孵化，Thrive 与 Greenoaks 领投 $500M Series A，估值 $5B
        - id: architectural-edge
          label: 架构差异化
          description: 100k+ TPS、亚秒级最终性、ISO 20022 合规及稳定币计价 Gas 费
        - id: revenue-opacity
          label: 变现不透明
          description: 经审计的交易费抽成率、净利润分成及付费客户交易量仍属非公开
        - id: governance-risks
          label: 治理与客户端风险
          description: 许可制验证者责任、竞争者抵制及 Reth 客户端集中度
        - id: valuation-discipline
          label: 估值纪律
          description: $5.0B 价格对应偏高倍数，企业转化必须近乎完美
        - id: recommendation-outcome
          label: 建议结果
          description: 立场：继续研究；信心：中；风险评级：高；估值立场：偏高
      edges:
        - from: scale-and-sponsorship
          to: architectural-edge
        - from: architectural-edge
          to: revenue-opacity
        - from: revenue-opacity
