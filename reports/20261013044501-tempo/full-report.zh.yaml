      - number: '4.2'
        title: 定价结构、Gas 抽象与变现动态
        blocks:
          - type: paragraph
            body: >-
              Tempo 的定价策略针对超低且可预测的成本结构，直接与自动清算所（ACH）、卡组织和代理行网络竞争。官方协议规格和合作伙伴发布材料显示，Tempo
              的目标是每笔支付低于十分之一美分（$0.001），相较传统跨境支付 2% 至 7% 的费用大幅下降（CI004）。除基础支付转账外，Tempo 还通过与 Stripe 共同编写的 Machine Payments
              Protocol（MPP）开拓新的变现路径（CI005）。MPP 重新启用 HTTP 402 Payment Required
              状态码，以聚合预算会话封装微支付。这个会话抽象把数百或数千笔程序化智能体微交易汇总为一次链上结算，使持续按使用付费的 API 变现具备经济可行性，而不会让用户被 Gas
              开销拖垮。专用支付通道在高负载下保持费用可预测，确保高量企业交易不会在市场活动高峰出现费用飙升（CI003）。结合 Stripe 的 Bridge 基础设施，Tempo
              为企业客户提供了从传统卡通道平滑迁移到边际成本接近于零的可编程稳定币通道的路径（CI007）。
