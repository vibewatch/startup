        title: 单位经济性、资本充足性与资产负债表续航
        blocks:
          - type: paragraph
            body: >-
              尽管 Tempo 获得强大机构支持并拥有广泛分发触达，其单位经济性仍基本未接受公开审计。Tempo 在官方门户自报年化稳定币支付量超过 $36b，平台上的稳定币和代币化资产价值超过
              $700m（CI008）。协议于 2026 年 3 月 18 日主网上线后正式进入生产阶段，从 2025 年 12 月的初始测试网转向实际商业处理（CI009）。资产负债表方面，Tempo 于 2025 年 10
              月获得 $500m A 轮融资，估值 $5b，支持者包括 Thrive Capital、Greenoaks、Sequoia 和 Ribbit Capital
              等一线机构（CI010）。这笔大额股权注资带来出色的资本充足性，让公司有多年续航资金投入网络基础设施、验证者伙伴激励和监管合规项目，无需近期追加融资（CI011）。由于 Tempo
              不靠增发原生代币稀释来补贴验证者，未来运营开支主要由工程团队、协议安全审计和开发者生态扩张驱动，形成干净的类软件成本结构，并具备长期运营杠杆（CI014）。
