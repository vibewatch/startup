              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可寻址支出与传统替代方案
        blocks:
          - type: paragraph
            body: >-
              Tempo 将核心可寻址市场定义为数字美元稳定币的结算和交易通道，并刻意把支付基础设施与通用去中心化金融及投机性加密交易分开。它不要求商业企业管理 ETH 或 SOL 等波动性原生 Gas
              代币，而是把架构边界限定在稳定币金融产品、代币化存款和自动化机器对机器微支付。相关支出的主要现有替代方案，是 SWIFT 协调的传统代理行网络、各国自动清算所通道，以及 Visa、Mastercard
              等传统支付卡网络。传统银行转账结算可能拖延数日、受银行营业时间限制，并在中间机构之间累计削减 2% 至 7% 的费用；传统卡支付则收取 1.5% 至 3.5% 的交换费，还要求较高的滚动准备金。Tempo
              试图用可预测的低于一美分交易费和亚秒级确定性终局承接这类支付流，并直接接入 Stripe 近期收购的 Bridge 稳定币发行平台和 Privy 嵌入式钱包。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 拆解
        blocks:
          - type: paragraph
            body: >-
              评估 Tempo 的可寻址机会，需要分别从宏观结算、流通资产和网络吞吐量三个视角拆解需求，而不能依赖单一总额估算。在宏观上限下，全球跨境支付每年通过传统代理行通道转移约 190
              万亿美元，这构成机构批发结算被替代的理论上限。在数字资产领域，美国财政部领导层预计，在完整监管框架下，稳定币可能扩展为 2
              万亿美元资产类别，为链上金融提供更广泛的货币浮存金。更直接的是，与美元挂钩的稳定币流通市值在 2026 年 7 月达到 3000 亿美元，代表当前在公链上运行的活跃可服务流动性。Tempo
              报告称，主网上线初期年化支付量超过 360 亿美元，链上代币化价值超过 7 亿美元。但独立尽调显示，这一早期可服务交易量很大程度反映 Stripe
              内部处理流和设计合作伙伴活动，而非广泛的有机商户替代；长期独立协议交易量仍未经证明。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
