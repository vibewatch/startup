              - CO016
          - type: callout
            title: 许可制验证者治理与机构协同风险
            body: >-
              Tempo 依赖经过筛选的许可制机构验证者，并与 Stripe
              保持紧密企业联系，带来实质性的监管与中立性风险。正如批评者指出的那样，由企业主导且验证者实体可识别的区块链，仍容易受到监管强制、司法辖区责任以及与独立支付网络竞争冲突的影响。
            calloutType: risk
            claimRefs:
