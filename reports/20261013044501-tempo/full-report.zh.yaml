  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 比较不同支付替代方案的机构级企业适配度、架构中立性与去中心化程度。
    approximationNotes: 坐标体现定性序数定位，依据为已记录的验证者模型、Gas 代币机制及机构设计合作。
    data:
      points:
        - label: Tempo
          x: 8.5
          'y': 4
          detail: 专为支付打造的 L1，具备亚秒级最终性、稳定币 Gas 和许可制验证者集合
        - label: Circle Arc
          x: 7.5
          'y': 4.5
          detail: 原生 USDC 的机构链，采用双 ARC Gas 代币，聚焦资本市场
        - label: Solana
          x: 6
          'y': 7
          detail: 高吞吐通用链，拥有公开验证者集合，但 Gas 代币波动且区块空间共享
        - label: Ethereum L2（Base）
          x: 5.5
          'y': 6.5
          detail: EVM 兼容的 Rollup，继承 Ethereum 基础结算并依赖对排序器的信任假设
        - label: Tether Plasma
          x: 5
