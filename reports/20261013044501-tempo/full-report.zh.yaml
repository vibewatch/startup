      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 垂直一体化支付栈带来的战略护城河
            body: >-
              通用区块链必须争夺投机流动性和零售开发者心智，而 Tempo 专门充当 Stripe 企业边界内的结算底座。借助 Bridge 进行稳定币发行编排、借助 Privy 提供嵌入式钱包，Stripe 和
              Paradigm 可以把企业支付流直接导入 Tempo，商户无需接触底层加密原语。
            calloutType: insight
            claimRefs:
              - CO003
