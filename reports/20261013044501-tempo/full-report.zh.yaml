      - number: '5.3'
        title: 机构合规控制与智能体支付
        blocks:
          - type: paragraph
            body: >-
              企业和银行接入所需的监管可执行性，不能依赖脆弱的定制智能合约逻辑。Tempo 通过 TIP-403 Policy Registry
              解决这一问题：这是内置的合规接口，允许代币发行方和受监管机构执行司法辖区规则、管理身份白名单和黑名单，并通过统一政策对多个代币执行获授权的资产追回或冻结。账户安全方面，Tempo Transactions
              原生集成智能账户，支持批量多操作付款、应用承担 Gas 费、定时付款，以及用于生物识别登录的现代 WebAuthn P256 通行密钥认证。除人工商业支付外，Tempo 与 Stripe 共同开发 Machine
              Payment Protocol，标准化自动 HTTP 402 支付握手和按会话计费通道，使自主 AI 智能体无需人工干预即可通过微交易购买 API
              服务和计算资源。初期验证者运营仍在创始机构伙伴之间采用许可制，但 Tempo 路线图承诺逐步转向无许可网络验证。
