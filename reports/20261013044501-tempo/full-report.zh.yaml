        - 客户端多样性不足；Reth 软件缺陷可能令整个网络停摆
      - - 共识引擎
        - 推动区块在亚秒内完成最终确认，避免重组
        - 通过 Commonware 实现的 Simplex BFT 共识
        - 全球网络延迟严重时，吞吐量（delta）会退化为超时路径
      - - Gas 与结算层
        - 以法币支持的稳定币路由交易费用
        - 内置支持 USDC 和 TIP-20 代币的 Fee AMM
        - 底层稳定币脱锚会造成验证者费用错配
      - - 验证者网络
        - 签署区块并认证快照证书
        - 使用 BLS 门限签名的精选联盟节点
        - 被点名的企业验证者运营方存在中心化和法律责任风险
    notes: 核心协议依赖评估基于 GitHub 仓库源代码、Blockdaemon 文档和 Blockworks 报道。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE014
      - CE015
