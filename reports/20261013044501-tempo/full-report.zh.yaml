        - 估值压缩至 $1.5B-$2.5B，需要折价融资或资本重组
        - 重大监管行动，或 Visa / Shopify 等关键合作伙伴推出自有支付通道
    notes: 情景分析对不同执行路径下未来 3 年的估值结果进行建模。
