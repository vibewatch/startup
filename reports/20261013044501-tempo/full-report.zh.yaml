  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与结算费架构
        blocks:
          - type: paragraph
            body: >-
              Tempo 的商业收入架构与传统公链根本不同：它不用原生代币投机来收取 Gas，而是直接用法币支持的稳定币将实用性费用变现。如 CI001 所述，网络完全取消波动性原生 Gas 代币，让企业可直接用
              USDC、USDT 等主流稳定币支付网络处理费。为使机制落地，Tempo 在协议层部署内置自动做市商（Fee AMM），把收到的 Gas
              付款转换为每个验证者偏好的结算货币，同时避免用户暴露于二级市场代币波动（CI002）。专用 TIP-20
              支付通道进一步隔离商业结算流和去中心化金融拥堵，无论整体区块链市场周期如何，都能保持低于千分之一美元的可预测费用（CI003）。验证者运营商完全以稳定币而非通胀性区块奖励获得报酬，使网络运营利润直接与交易吞吐挂钩（CI006）。这套变现架构与
              Stripe 支付生态紧密整合；Stripe 于 2024 年 10 月以 $1.1b（11 亿美元）收购 Bridge，进一步打造覆盖软件 API 和底层结算的端到端稳定币编排通道（CI007）。
