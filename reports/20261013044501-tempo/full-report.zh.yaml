chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与协议基础
        blocks:
          - type: paragraph
            body: >-
              Tempo 是一家以机构支付为先的 Layer-1 区块链公司，由 Stripe 和 Paradigm 于 2025 年共同创立并孵化。项目旨在解决通用区块链无法大规模支持全球商业支付的结构性瓶颈：原生 Gas
              代币价格波动、拥堵费不可预测地飙升，以及多秒级结算的概率性终局。公司与主要运营发起方同在美国加州旧金山办公，但作为独立运营实体，Tempo 旨在替代传统代理行结算网络。底层协议基于 Reth
              执行客户端，完整兼容以太坊虚拟机（EVM）工具链，并通过 Commonware 实现 Simplex BFT 共识，在约 500 至 600
              毫秒内提供确定性的亚秒级终局且不发生链重组。为消除企业资金管理中的记账摩擦，Tempo 完全取消波动性原生 Gas 代币，允许交易费通过内置自动做市商直接以美元计价稳定币结算，同时用专用的 94%
              支付通道隔离支付区块空间。
            claimRefs:
              - CO001
              - CO005
              - CO016
