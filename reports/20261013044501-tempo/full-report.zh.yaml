figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Tempo 从 2025 年最初的隐秘孵化，发展到测试网试运行，并于 2026 年 3 月上线主网。
    data:
      items:
        - date: 2025-08
          label: 隐秘开发
          detail: Stripe 与 Paradigm 悄然开始共同开发支付机构优先的 Layer-1 网络。
          tone: neutral
        - date: 2025-09
          label: 公开宣布
          detail: Tempo 于 2025 年 9 月 4 日正式亮相，Visa 和 Deutsche Bank 等设计合作伙伴同时公布。
          tone: positive
        - date: 2025-09
          label: 私有测试网
          detail: 私有测试网启动，与精选金融科技合作伙伴共同评估 Simplex 共识和稳定币 Gas 机制。
          tone: neutral
        - date: 2025-10
          label: Series A 融资
          detail: 完成 $500 million Series A 融资，投后估值 $5 billion，由 Thrive Capital 和 Greenoaks 领投。
          tone: positive
        - date: 2025-12
          label: 公共测试网
          detail: 公共测试网于 2025 年 12 月 9 日开放，Mastercard 和 UBS 等企业试用参与者接入。
          tone: neutral
        - date: 2026-03
          label: 主网上线
          detail: 2026 年 3 月 18 日正式部署主网，在 Reth 上提供亚秒级最终性和 EVM 兼容性。
          tone: positive
        - date: 2026-03
          label: 机器支付协议
          detail: 与 Stripe 联合发布开源机器支付协议（MPP），支持 AI 智能体自主进行微支付。
          tone: positive
        - date: 2026-04
          label: 机构验证者接入
          detail: Visa、Stripe 和机构托管方部署许可制验证者节点，成为首批上线节点。
          tone: positive
        - date: 2026-09
          label: 治理审查
          detail: 行业分析师和加密架构师对许可制验证者集中化及企业控制提出疑虑。
          tone: negative
    approximationNotes: 里程碑日期来自截至 2026 年 10 月的官方新闻稿、公开代码库文档及媒体报道。
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO013
      - CO014
      - CO015
