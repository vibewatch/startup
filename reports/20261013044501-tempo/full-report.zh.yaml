  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 核心支柱
      - 论点
      - 反论点风险
      - 证伪触发条件
    rows:
      - - 战略分销
        - Stripe 商户基础和合作伙伴生态，相比独立 L1，可立即带来分销优势
        - Circle Arc 等竞争者及传统银行可能拒绝通过与 Stripe 关联的通道转移交易量
        - 主要商户合作伙伴将交易量转向竞争性的私有链或通用链
      - - 协议经济
        - 取消原生 Gas 代币并以稳定币结算，可消除企业运营和会计摩擦
        - 没有代币就没有投机性代币需求带来的上行空间，协议只能依赖微薄的交易费
        - 没有代币激励，就无法维持验证者经济或补贴生态发展
      - - 技术性能
        - Simplex BFT 提供 100,000+ TPS 和亚秒级最终性，带来支付级结算确定性
        - 依赖 Reth 执行引擎形成单客户端脆弱性，客户端故障可能令网络停摆
        - 高价值机构结算实际运行时发生网络中断或共识停顿
      - - 市场定位
        - ISO 20022 合规和企业合规接口支持接入代理行结算通道
        - 许可制验证者模型带来监管责任，也违背加密原生体系应有的可信中立性
        - 监管执法将许可制验证者视为指定金融市场基础设施
    notes: 将核心投资论点支柱与反论点及论点失效触发条件进行对照。
