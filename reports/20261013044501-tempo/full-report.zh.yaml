      - number: '5.2'
        title: 原生支付标准与稳定币费用抽象
        blocks:
          - type: paragraph
            body: >-
              传统公链要求参与者持有 ETH、SOL 等波动性原生 Gas 代币的资金余额，给企业财务团队带来严重汇兑风险、记账摩擦和不可预测的运营开销。Tempo 在底层完全取消原生 Gas 代币，用户直接用 USDC
              等主流法币支持稳定币支付网络交易费，集成的 Fee 自动做市商则在后台自动把费用换成验证者偏好的结算货币。为保证商户支付流的经济性可预测，Tempo 将 TIP-20 代币标准写入协议；这是一种增强版
              ERC-20 扩展，带有专用支付通道，可把稳定币转账与投机性 DeFi 套利或高频交易造成的嘈杂邻居执行峰值隔离。专用通道内的转账成本目标低于千分之一美元（每笔 <$0.001）。此外，Tempo 还加入兼容
              ISO 20022 银行消息标准的协议级交易备注和链下承诺定位器，让金融机构能把发票号和审计轨迹直接附在账本转账上。
