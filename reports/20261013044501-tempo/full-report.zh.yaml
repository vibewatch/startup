      - number: '1.4'
        title: 运营里程碑、不利审视与机构风险
        blocks:
          - type: paragraph
            body: >-
              Tempo 于 2025 年 9 月 4 日公开亮相后，沿着多阶段路线图推进。2025 年 9 月启动私有测试网，12 月转为面向企业开放的公测网，并于 2026 年 3 月 18
              日正式部署主网。主网上线期间，Stripe 与 Tempo 共同推出 Machine Payments Protocol（MPP），利用 HTTP 402 状态码这一开放标准，让 AI
              智能体能够在法币和稳定币通道上自主进行微支付。尽管取得这些运营里程碑，且公司声称在 95 条法币走廊上实现了超过 $36 billion 的年化稳定币交易量，Tempo
              仍受到知名加密研究者和支付架构师的强烈负面审视。Libra 联合创始人 Christian Catalini、加密教育者 Omid Malekan 等批评者认为，Tempo
              初期依赖一组经过筛选的许可制机构验证者，削弱了其可信中立性。如果验证者节点由已知企业实体运营，网络仍可能受到监管强制、制裁执行或回滚指令的法律约束，长期看会在机构合规要求与去中心化结算承诺之间形成结构性张力。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO013
              - CO014
              - CO015
