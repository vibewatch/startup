      - number: '1.3'
        title: 资本结构、投资者基础与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              Tempo 在 2025 年 10 月完成 $500m（5 亿美元）A 轮融资，投后估值为 $5b（50 亿美元），由此获得顶级早期资本支持。本轮由成长型股权机构 Thrive Capital 和
              Greenoaks 领投，据报道 Sequoia Capital、Ribbit Capital 和 SV Angel 参与了银团。公开报道确认，孵化方 Stripe 和 Paradigm
              没有向本轮股权融资追加资本，使外部创投机构建立了基准估值。作为交换，Tempo 聚集了覆盖一线卡组织、全球银行和金融科技平台的企业设计合作伙伴及首批验证者候选方，包括
              Visa、Mastercard、Deutsche Bank、Standard Chartered 和 Klarna。这笔融资让 Tempo
              能在短期没有资本约束的情况下补贴开发者接入和验证者基础设施；不过，完整股权结构表中的董事会席位分配、投资者保护条款、清算优先权及潜在未来代币认股权分配，仍受私人协议约束而未披露。
            claimRefs:
              - CO002
              - CO011
              - CO012
