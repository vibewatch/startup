  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: Tempo 上从客户端请求到验证者稳定币结算的端到端交易转换流程。
    data:
      nodes:
        - label: 客户端支付请求
          detail: 商户或 AI 智能体通过 API 或 MPP 会话发起交易
        - label: MPP 授权与会话
          detail: HTTP 402 握手预留预算并汇总微支付
        - label: 稳定币费用 AMM 转换
          detail: 内置 AMM 将 Gas 费转换为验证者偏好的货币
        - label: 专用 TIP-20 支付通道
          detail: 交易通过隔离的区块空间路由，避开 DeFi 拥堵
        - label: Simplex 共识最终确认
          detail: Simplex BFT 在约 500ms 内实现确定性结算最终性
        - label: 验证者稳定币付款
          detail: 交易费直接以稳定币分配给验证者
      edges:
        - from: Client Payment Request
          to: MPP Authorization & Session
        - from: MPP Authorization & Session
          to: Stablecoin Fee AMM Conversion
        - from: Stablecoin Fee AMM Conversion
          to: Dedicated TIP-20 Payment Lane
        - from: Dedicated TIP-20 Payment Lane
          to: Simplex Consensus Finalization
        - from: Simplex Consensus Finalization
          to: Validator Stablecoin Payout
    approximationNotes: 流程代表架构上的交易路径；具体费用分成随验证者协议和走廊流动性而变化。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
  - id: FE001
    title: Tempo 技术架构栈
    type: stack
    summary: 六层架构栈展示 Tempo 构建在 Reth 执行和 Simplex 共识之上的专用支付与合规原语。
    data:
      layers:
        - label: 智能体与工具层
          detail: 机器支付协议（MPP）HTTP 402 会话，以及 Mercator 智能体发现和工具路由工作流。
        - label: 应用与网关层
          detail: Stripe API 高层支付抽象和 Blockdaemon 企业 RPC 端点基础设施。
        - label: 合规与安全层
          detail: TIP-403 政策注册表执行统一的跨代币允许列表、阻止列表及司法辖区资产冻结钩子。
        - label: 代币与交易标准
          detail: 内置 TIP-20 代币标准，包含专用支付通道和 ISO 20022 备注对账字段。
        - label: 账户与费用抽象
          detail: 内置多稳定币 Fee AMM、原生智能账户多操作批处理及 WebAuthn P256 通行密钥登录。
        - label: 执行与共识核心
          detail: Paradigm Reth SDK EVM 执行客户端面向 Osaka 硬分叉，并搭配提供亚秒级最终性的 Simplex BFT 共识（Commonware）。
    approximationNotes: 代表经 GitHub 代码库和技术文档核实的协议分层。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业从最初通过 Stripe 路由支付，经专用支付通道，走向自动化智能体结算的采用路径。
    data:
      nodes:
        - label: 1. Stripe 生态探索
          stage: Onboarding
          touchpoints:
            - Stripe Dashboard banner
            - API documentation
            - Stablecoin payout settings
          actions:
            - Merchants enable stablecoin payouts without new blockchain infrastructure
          barriers:
            - Corporate treasury policies prohibiting digital asset custody
        - label: 2. 专用支付通道评估
          stage: Integration
          touchpoints:
            - TIP-20 token interface
            - Sub-cent gas fee quote
            - ISO 20022 memo tester
          actions:
            - Treasury teams benchmark settlement finality against correspondent banking
          barriers:
            - Direct redemption contracts required with stablecoin issuers under FASB rules
        - label: 3. 机构结算试点
          stage: Pilot
          touchpoints:
            - Permissioned validator portal
            - Elliptic transaction monitoring
            - Dune dashboard
          actions:
            - Design partners run parallel cross-border remittance test runs
          barriers:
            - Concerns regarding validator decentralization and platform neutrality
        - label: 4. 多币种生产环境付款
          stage: Production
          touchpoints:
            - Enshrined AMM
            - 95 fiat on/offramps
            - Native stablecoin swap
          actions:
            - Live vendor disbursements across international corridors
          barriers:
            - Undisclosed contractual take rates and interchange revenue models
        - label: 5. 企业资金管理 Earn 部署
          stage: Expansion
          touchpoints:
            - Tempo Earn interface
            - Tokenized US Treasury vaults
            - Private credit pools
          actions:
            - Enterprises deploy idle stablecoin balances into yield strategies up to 7% APY
          barriers:
            - Liquidity lockups and credit risk assessment on underlying debt assets
        - label: 6. 智能体商业自动化
          stage: Maturity
          touchpoints:
            - Machine Payment Protocol (MPP)
            - Mercator router
            - HTTP 402 gateway
          actions:
            - Autonomous software agents execute session-budgeted API micropayments
          barriers:
            - Emerging protocol standard with unproven long-term agent transaction volume
    approximationNotes: 采用阶段和运营触点依据 Tempo 产品架构、开发者文档及披露的合作伙伴工作流建模。
    claimRefs:
      - CU002
      - CU006
      - CU008
      - CU013
