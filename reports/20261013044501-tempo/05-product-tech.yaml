chapter:
  number: 5
  title: "Product & Technology"
  summary: "Tempo is an Ethereum-compatible Layer-1 blockchain engineered specifically for payment workloads, pairing Reth-based execution with Simplex BFT consensus for sub-second deterministic finality. By replacing volatile gas tokens with multi-stablecoin fee settlement, enshrining compliant TIP-20 payment lanes and TIP-403 policy registries, and introducing the Machine Payment Protocol for agentic commerce, Tempo targets high-throughput institutional settlement while managing single-client execution risks and private-validator centralization trade-offs."
sections:
  - id: "architecture-overview"
    title: "Core Architecture and Execution Model"
    body: "Tempo is architected as an independent Layer-1 blockchain engineered specifically for high-throughput stablecoin settlement rather than general-purpose decentralized computation. Unlike Ethereum Layer-2 rollups that inherit base-layer settlement latency or bridge security risks, Tempo operates an autonomous base layer pairing Paradigm's Reth execution client with Simplex BFT consensus to achieve sub-second deterministic finality and an architectural capacity of up to 100,000 transactions per second. This architecture eliminates the probabilistic re-organizations common to general-purpose proof-of-work and proof-of-stake chains, satisfying the zero-reorg requirements of enterprise settlement systems and point-of-sale networks. Crucially, Tempo provides full Ethereum Virtual Machine compatibility targeting the Osaka hardfork, enabling developers to write, test, and deploy smart contracts using standard Ethereum toolchains such as Solidity, Foundry, and Hardhat without migration friction. However, relying exclusively on Reth as the primary execution engine introduces client-diversity concentration risk, meaning an unhandled client bug could stall network execution across the initial curated validator set."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "payment-standards-and-gas"
    title: "Native Payment Standards and Stablecoin Fee Abstraction"
    body: "Traditional public blockchains require participants to maintain treasury balances of volatile native gas tokens like ETH or SOL, imposing severe foreign exchange risks, accounting friction, and unpredictable operational overhead on corporate finance teams. Tempo eliminates native gas tokens entirely at the base layer. Users pay network transaction fees directly in major fiat-backed stablecoins such as USDC, with an integrated Fee Automated Market Maker automatically executing background conversions into the validator's preferred settlement currency. To guarantee predictable economics for merchant flows, Tempo enshrines the TIP-20 token standard, an enhanced ERC-20 extension featuring dedicated payment lanes that isolate stablecoin transfers from noisy-neighbor execution spikes caused by speculative DeFi arbitrage or high-frequency trading. Transfer costs within these dedicated lanes target sub-millidollar levels (<$0.001 per transfer). Furthermore, Tempo incorporates protocol-level transaction memos compatible with the banking messaging standard ISO 20022 and off-chain commitment locators, allowing financial institutions to attach invoice numbers and audit trails directly to ledger transfers."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "compliance-and-agentic-payments"
    title: "Institutional Compliance Controls and Agentic Payments"
    body: "Enterprise and banking integration requires regulatory enforceability that cannot depend on fragile, custom-written smart contract logic. Tempo addresses this through its TIP-403 Policy Registry, a built-in compliance hook that enables token issuers and regulated institutions to enforce jurisdictional rules, manage identity allowlists and blocklists, and execute authorized asset recovery or freezing across multiple tokens through a single unified policy. For account security, Tempo Transactions natively integrate smart accounts supporting batched multi-operation payouts, gas fee sponsorship by applications, scheduled disbursements, and modern WebAuthn P256 passkey authentication for biometric sign-ins. Beyond human commerce, Tempo co-developed the Machine Payment Protocol with Stripe, standardizing automated HTTP 402 payment handshakes and session-based payment channels that allow autonomous AI agents to purchase API services and computational resources via micro-transactions without human intervention. While initial validator operations remain permissioned among founding institutional partners, Tempo's roadmap commits to a gradual transition toward permissionless network validation."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE015"
      - "CE016"
