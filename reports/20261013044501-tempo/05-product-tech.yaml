      - "CE007"
  - calloutType: "risk"
    title: "Execution Client Monoculture"
    body: "Building exclusively on the Reth SDK provides superior memory safety and execution performance, but the absence of multi-client diversity means any unhandled consensus or state transition bug poses an existential availability risk to the network."
