callouts:
  - calloutType: "insight"
    title: "Gas Abstraction as Enterprise Catalyst"
    body: "By replacing volatile native utility tokens with an enshrined Fee AMM operating directly in stablecoins, Tempo removes the chief accounting and treasury barrier preventing corporate finance departments from adopting on-chain settlement."
    claimRefs:
