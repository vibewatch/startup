      - "CV010"
      - "CV014"
  - calloutType: "risk"
    title: "Governance Liability and Neutrality Overhang"
    body: "A critical hurdle for Tempo's long-term enterprise value is establishing credible neutrality. As long as validators remain permissioned and closely tied to Stripe, competing fintechs and global merchant aggregators face strategic disincentives to route mission-critical payment volume across the network."
    claimRefs:
      - "CV008"
      - "CV012"
