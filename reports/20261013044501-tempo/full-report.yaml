        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Decoupling of Payments from Gas Volatility
            body: >-
              By replacing native volatile gas tokens with TIP-20 stablecoin gas fee settlement and dedicated payment
              lanes, Tempo structurally addresses the chief operational barrier to enterprise blockchain adoption,
              allowing treasury desks to forecast transaction costs without speculative token holdings.
