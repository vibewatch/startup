      - number: '5.2'
        title: Native Payment Standards and Stablecoin Fee Abstraction
        blocks:
          - type: paragraph
            body: >-
              Traditional public blockchains require participants to maintain treasury balances of volatile native gas
              tokens like ETH or SOL, imposing severe foreign exchange risks, accounting friction, and unpredictable
              operational overhead on corporate finance teams. Tempo eliminates native gas tokens entirely at the base
              layer. Users pay network transaction fees directly in major fiat-backed stablecoins such as USDC, with an
              integrated Fee Automated Market Maker automatically executing background conversions into the validator's
              preferred settlement currency. To guarantee predictable economics for merchant flows, Tempo enshrines the
              TIP-20 token standard, an enhanced ERC-20 extension featuring dedicated payment lanes that isolate
              stablecoin transfers from noisy-neighbor execution spikes caused by speculative DeFi arbitrage or
              high-frequency trading. Transfer costs within these dedicated lanes target sub-millidollar levels (<$0.001
              per transfer). Furthermore, Tempo incorporates protocol-level transaction memos compatible with the
              banking messaging standard ISO 20022 and off-chain commitment locators, allowing financial institutions to
              attach invoice numbers and audit trails directly to ledger transfers.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE011
              - CE012
              - CE015
      - number: '5.3'
        title: Institutional Compliance Controls and Agentic Payments
        blocks:
          - type: paragraph
            body: >-
              Enterprise and banking integration requires regulatory enforceability that cannot depend on fragile,
              custom-written smart contract logic. Tempo addresses this through its TIP-403 Policy Registry, a built-in
              compliance hook that enables token issuers and regulated institutions to enforce jurisdictional rules,
              manage identity allowlists and blocklists, and execute authorized asset recovery or freezing across
              multiple tokens through a single unified policy. For account security, Tempo Transactions natively
              integrate smart accounts supporting batched multi-operation payouts, gas fee sponsorship by applications,
              scheduled disbursements, and modern WebAuthn P256 passkey authentication for biometric sign-ins. Beyond
              human commerce, Tempo co-developed the Machine Payment Protocol with Stripe, standardizing automated HTTP
              402 payment handshakes and session-based payment channels that allow autonomous AI agents to purchase API
              services and computational resources via micro-transactions without human intervention. While initial
              validator operations remain permissioned among founding institutional partners, Tempo's roadmap commits to
              a gradual transition toward permissionless network validation.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Gas Abstraction as Enterprise Catalyst
            body: >-
              By replacing volatile native utility tokens with an enshrined Fee AMM operating directly in stablecoins,
              Tempo removes the chief accounting and treasury barrier preventing corporate finance departments from
              adopting on-chain settlement.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Execution Client Monoculture
            body: >-
              Building exclusively on the Reth SDK provides superior memory safety and execution performance, but the
              absence of multi-client diversity means any unhandled consensus or state transition bug poses an
              existential availability risk to the network.
            calloutType: risk
            claimRefs:
              - CE003
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Tempo segments its enterprise customer opportunity across four distinct buyer profiles: global card
              networks and merchant acquirers, multinational e-commerce marketplaces, corporate treasuries and
              importers, and autonomous artificial intelligence platforms. Each segment operates with distinct
              operational objectives and decision-makers. Global card networks and acquirers seek multi-currency
              wholesale settlement rails that bypass multi-day correspondent banking delays and eliminate foreign
              exchange friction. Multinational marketplaces target automated contractor and seller disbursements across
              emerging markets, where traditional banking infrastructure is slow or costly. Corporate treasuries and
              importers evaluate stablecoins as cash equivalents for cross-border supplier payments, though corporate
              adoption remains tightly constrained by accounting standards that require direct redemption contracts with
              token issuers. Finally, autonomous AI agent developers and API providers require programmatic
              micropayments with sub-second finality and predictable dollar-denominated fees, representing an emerging
              frontier in machine commerce.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory and Network Throughput
        blocks:
          - type: paragraph
            body: >-
              Tempo's self-reported adoption trajectory indicates substantial nominal scale, highlighted by more than
              $36 billion in annualized stablecoin payment volume and over $700 million in tokenized asset value. The
              network has established on- and offramp connectivity spanning 95 fiat currencies, enabling merchant
              disbursements across global payment corridors. From a technical capacity standpoint, Tempo's architecture
              is engineered to sustain throughput in excess of 100,000 transactions per second with sub-second finality
              using its Simplex BFT consensus engine and dedicated payment lanes that isolate stablecoin transfers from
              general computational congestion. However, critical performance denominators remain private: public
              disclosures do not disaggregate how much of the $36 billion annualized throughput represents organic
              third-party merchant commerce versus automated internal routing by Stripe, nor do they report sustained
              mainnet transactions per second under multi-party adversarial workloads.
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Design Partners and Deployment Status
        blocks:
          - type: paragraph
            body: >-
              To establish enterprise credibility, Stripe and Tempo assembled a notable cohort of design partners
              spanning traditional financial leaders, high-growth technology platforms, and artificial intelligence
              research labs. Disclosed participants include Visa, Deutsche Bank, Shopify, Revolut, Nubank, DoorDash,
              OpenAI, and Anthropic. For financial institutions such as Deutsche Bank and Visa, Tempo's protocol-level
              ISO 20022 messaging alignment and sub-second finality provide a compelling bridge between legacy interbank
              messaging and modern settlement. Concurrently, for AI developers like OpenAI and Anthropic, the Machine
              Payment Protocol co-authored by Stripe and Tempo introduces standardized HTTP 402 payment handshakes for
              autonomous agent API metering. Nevertheless, all disclosed enterprise relationships currently operate as
              design partnerships, testnet evaluations, or pilot integrations; verifiable evidence of long-term
              production contracts, committed annual recurring revenue, or binding platform exclusivity remains absent.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
