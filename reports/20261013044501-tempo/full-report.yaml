  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Legacy Substitutes
        blocks:
          - type: paragraph
            body: >-
              Tempo defines its core addressable market as the settlement and transaction rails for digital dollar
              stablecoins, deliberately separating payments infrastructure from general-purpose decentralized finance
              and speculative crypto trading. Rather than forcing commercial enterprises to manage volatile native gas
              tokens like ETH or SOL, Tempo establishes an architectural boundary focused exclusively on stablecoin
              financial products, tokenized deposits, and automated machine-to-machine micropayments. The primary
              status-quo substitutes for this spend are legacy correspondent banking networks coordinated by SWIFT,
              national automated clearinghouse rails, and traditional payment card networks such as Visa and Mastercard.
              While legacy bank transfers suffer from multi-day settlement delays, restrictive banking hours, and
              cumulative intermediary fee haircuts between 2% and 7%, conventional card processing imposes interchange
              fees between 1.5% and 3.5% alongside significant rolling reserve requirements. Tempo attempts to capture
              this payment flow by offering predictable sub-cent transactions and sub-second deterministic finality,
              directly integrating with Stripe's recent strategic infrastructure acquisitions including the Bridge
              stablecoin issuance platform and Privy embedded wallets.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and SOM Breakdown'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Tempo's addressable opportunity requires segmenting demand across distinct macro settlement,
              circulating asset, and network throughput lenses rather than relying on a single top-line estimate. At the
              macroeconomic ceiling, global cross-border payments move approximately $190 trillion annually through
              traditional correspondent banking rails, representing the theoretical upper bound for institutional
              wholesale settlement displacement. Within the digital asset domain, US Treasury leadership projects that
              stablecoins could expand into a $2 trillion asset class under comprehensive regulatory frameworks,
              providing the broader monetary float for on-chain finance. More immediately, the circulating market
              capitalization of dollar-pegged stablecoins reached $300 billion in July 2026, establishing the active
              serviceable available liquidity currently operating across public blockchains. Tempo reported annualized
              payment volume exceeding $36 billion and over $700 million in on-chain tokenized value upon mainnet
              deployment in early 2026. However, independent diligence indicates that this early serviceable volume
              heavily reflects Stripe's internalized processing flows and design partner activity rather than
              broad-based organic merchant substitution, leaving long-term independent protocol volume unproven.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
