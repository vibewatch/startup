      - number: '2.3'
        title: Buyer Segmentation, Procurement Profiles, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption of Tempo's payments-first infrastructure spans three core customer tiers: digital-native
              e-commerce merchants, institutional banks and fintech platforms, and autonomous artificial intelligence
              developers. Enterprise merchants and gig-economy platforms manage payment acceptance and contractor
              disbursement budgets under the direction of Chief Financial Officers, seeking to lower payment processing
              overhead, bypass cross-border wire delays, and eliminate currency volatility risks. Institutional banks
              and transaction banking desks evaluate Tempo through treasury and liquidity operations budgets, requiring
              strict ISO 20022 messaging compatibility to bridge legacy clearing systems with 24/7 blockchain settlement
              without re-architecting back-office reconciliation. Simultaneously, the emergence of the Machine Payment
              Protocol (MPP) co-authored by Stripe introduces autonomous AI agents as a novel buyer class, enabling
              programmatic micro-metering and API monetization over standard HTTP 402 protocols where engineering
              leadership allocates automated software budgets for machine-to-machine commerce.
            claimRefs:
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: Adoption Catalysts, Regulatory Constraints, and Critical Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Tempo's primary adoption catalysts stem from acute enterprise dissatisfaction with legacy payment
              settlement friction, rising corporate comfort with regulated stablecoins, and the unique usability
              advantages of paying transaction fees directly in stablecoins without speculative token exposure.
              Dedicated protocol payment lanes protect commercial transfers from network congestion, creating
              predictable enterprise-grade settlement reliability. Conversely, significant structural constraints temper
              rapid market expansion. Corporate blockchain initiatives face substantial skepticism from decentralized
              finance participants and banking regulators regarding platform neutrality, validator centralization, and
              jurisdictional liability. With Tempo initially controlled by a permissioned validator set comprising
              Stripe, Visa, and institutional custodians, critics highlight single-point-of-failure risks and question
              whether competitive payment platforms will trust a network deeply allied with Stripe. Furthermore, Tempo
              has not publicly disclosed audited transaction take rates, gross processing margins, or net merchant
              retention metrics, preserving substantial diligence uncertainty regarding its underlying unit economics
              and standalone monetization power.
            claimRefs:
              - CM005
              - CM008
              - CM011
              - CM013
              - CM014
