  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Architecture and Execution Model
        blocks:
          - type: paragraph
            body: >-
              Tempo is architected as an independent Layer-1 blockchain engineered specifically for high-throughput
              stablecoin settlement rather than general-purpose decentralized computation. Unlike Ethereum Layer-2
              rollups that inherit base-layer settlement latency or bridge security risks, Tempo operates an autonomous
              base layer pairing Paradigm's Reth execution client with Simplex BFT consensus to achieve sub-second
              deterministic finality and an architectural capacity of up to 100,000 transactions per second. This
              architecture eliminates the probabilistic re-organizations common to general-purpose proof-of-work and
              proof-of-stake chains, satisfying the zero-reorg requirements of enterprise settlement systems and
              point-of-sale networks. Crucially, Tempo provides full Ethereum Virtual Machine compatibility targeting
              the Osaka hardfork, enabling developers to write, test, and deploy smart contracts using standard Ethereum
              toolchains such as Solidity, Foundry, and Hardhat without migration friction. However, relying exclusively
              on Reth as the primary execution engine introduces client-diversity concentration risk, meaning an
              unhandled client bug could stall network execution across the initial curated validator set.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
              - CE014
