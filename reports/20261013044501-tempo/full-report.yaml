figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Tempo from initial stealth incubation in 2025 to testnet trials and March 2026
      mainnet launch.
    data:
      items:
        - date: 2025-08
          label: Stealth Development
          detail: Stripe and Paradigm quietly begin co-developing an institutional payments-first Layer-1 network.
          tone: neutral
        - date: 2025-09
          label: Public Announcement
          detail: >-
            Tempo is officially unveiled on September 4, 2025, alongside design partners including Visa and Deutsche
            Bank.
          tone: positive
        - date: 2025-09
          label: Private Testnet
          detail: >-
            Private testnet launches to evaluate Simplex consensus and stablecoin gas mechanisms with select fintech
            partners.
          tone: neutral
        - date: 2025-10
          label: Series A Capitalization
          detail: >-
            Closes $500 million Series A funding round at a $5 billion post-money valuation led by Thrive Capital and
            Greenoaks.
          tone: positive
        - date: 2025-12
          label: Public Testnet
          detail: >-
            Public testnet opens on December 9, 2025, onboarding enterprise trial participants including Mastercard and
            UBS.
          tone: neutral
        - date: 2026-03
          label: Mainnet Launch
          detail: Official mainnet deployment on March 18, 2026, delivering sub-second finality and EVM compatibility on Reth.
          tone: positive
        - date: 2026-03
          label: Machine Payments Protocol
          detail: >-
            Co-releases open-source Machine Payments Protocol (MPP) with Stripe to facilitate autonomous AI agent
            micropayments.
          tone: positive
        - date: 2026-04
          label: Institutional Validator Onboarding
          detail: >-
            Visa, Stripe, and institutional custodians deploy permissioned validator nodes as part of initial launch
            set.
          tone: positive
        - date: 2026-09
          label: Governance Scrutiny
          detail: >-
            Industry analysts and crypto architects raise concerns over permissioned validator centralization and
            corporate control.
          tone: negative
    approximationNotes: >-
