    title: Tempo Technology Architecture Stack
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Tempo's specialized payment and compliance primitives built atop Reth
      execution and Simplex consensus.
    data:
      layers:
        - label: Agentic & Tooling Layer
          detail: Machine Payment Protocol (MPP) HTTP 402 sessions and Mercator agent discovery and tool-router workflows.
        - label: Application & Gateway Layer
          detail: Stripe API high-level payment abstractions and Blockdaemon enterprise RPC endpoint infrastructure.
        - label: Compliance & Security Layer
          detail: >-
            TIP-403 Policy Registry enforcing unified cross-token allowlists, blocklists, and jurisdictional asset
            freezing hooks.
        - label: Token & Transaction Standards
          detail: TIP-20 enshrined token standard featuring dedicated payment lanes and ISO 20022 memo reconciliation fields.
        - label: Account & Fee Abstraction
          detail: >-
            Enshrined multi-stablecoin Fee AMM, native smart account multi-operation batching, and WebAuthn P256 passkey
            sign-in.
        - label: Execution & Consensus Core
          detail: >-
            Paradigm Reth SDK EVM execution client targeting Osaka hardfork paired with Simplex BFT consensus
            (Commonware) providing sub-second finality.
