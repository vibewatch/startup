          Eliminating native gas tokens and settling in stablecoins removes enterprise operational and accounting
          friction
        - >-
          Absence of a token eliminates speculative token-demand upside and leaves protocol reliant on slim transaction
          fees
        - Inability to sustain validator economics or subsidize ecosystem development without token incentives
      - - Technical Performance
        - Simplex BFT delivering 100,000+ TPS and sub-second finality provides payment-grade settlement certainty
        - Reth execution engine dependency creates single-client vulnerability where client bugs could halt the network
        - Network outage or consensus halt during live high-value institutional settlement
      - - Market Positioning
        - ISO 20022 compliance and enterprise compliance hooks enable integration with correspondent banking rails
        - Permissioned validator model invites regulatory liability and contradicts crypto-native credible neutrality
        - Regulatory enforcement treating permissioned validators as designated financial market utilities
    notes: Comparison of core investment thesis pillars against counter-arguments and thesis-break triggers.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV013
