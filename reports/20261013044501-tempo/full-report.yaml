            title: Strategic Moat via Vertically Integrated Payments Stack
            body: >-
              Unlike general-purpose blockchains that must compete for speculative liquidity and retail developer
              mindshare, Tempo is engineered specifically as the settlement base of Stripe corporate perimeter. By
              integrating Bridge for stablecoin issuance orchestration and Privy for embedded wallets, Stripe and
              Paradigm can route enterprise payment flows directly onto Tempo without merchants ever interacting with
