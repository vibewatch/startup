      - number: '1.4'
        title: Operational Milestones, Adverse Scrutiny, and Institutional Risks
        blocks:
          - type: paragraph
            body: >-
              Following its public unveiling on September 4, 2025, Tempo advanced through a rigorous multi-phase
              development roadmap. A private testnet in September 2025 transitioned to an open enterprise public testnet
              in December 2025, culminating in official mainnet deployment on March 18, 2026. Concurrently with mainnet,
              Stripe and Tempo co-launched the Machine Payments Protocol (MPP), an open standard leveraging HTTP 402
              status codes to enable autonomous AI agent micropayments across fiat and stablecoin rails. Despite these
              operational milestones and company claims of over $36 billion in annualized stablecoin volume across 95
              fiat currency corridors, Tempo has drawn sharp adverse scrutiny from prominent cryptocurrency researchers
              and payments architects. Critics, including Libra co-creator Christian Catalini and crypto educator Omid
              Malekan, argue that Tempo initial reliance on a curated set of permissioned institutional validators
              undermines credible neutrality. If validator nodes are operated by known corporate entities, the network
              remains legally susceptible to regulatory compulsion, sanctions enforcement, or potential rollback
              directives, creating long-term structural tension between institutional compliance requirements and
              decentralized settlement guarantees.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO013
              - CO014
