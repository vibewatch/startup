      - number: '4.4'
        title: Financial Underwriting Verdict and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              From a financial underwriting perspective, Tempo presents an institutional-grade payments infrastructure
              asset with rare capital adequacy, elite strategic backing, and an ambitious product thesis targeting the
              $190 trillion global cross-border payments settlement market. The $500 million balance sheet provides an
              uncompromised defensive cushion against prolonged market adoption cycles (CI010, CI011). However, rigorous
              institutional underwriting cannot overlook critical evidence gaps and structural governance risks. Because
              Tempo relies on a permissioned validator set comprised of corporate partners like Visa and Stripe, crypto
              analysts and legal scholars have warned that the network concentrates censorship liability and regulatory
              exposure in identifiable entities that could be compelled to restrict transactions (CI012). Furthermore,
              prominent payments infrastructure architects have questioned whether commercial competitors and rival
              merchant acquirers will willingly route mission-critical financial volume through a ledger intimately
              affiliated with Stripe (CI013). Combined with the total absence of verified public unit economics, net
              take rates, or customer acquisition costs, the financial verdict requires rigorous confirmatory diligence
              before underwriting equity returns at a $5 billion private valuation benchmark (CI014).
