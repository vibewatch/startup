      - number: '1.3'
        title: Capitalization, Investor Base, and Strategic Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Tempo achieved elite early-stage capitalization through a massive $500 million Series A financing round
              completed in October 2025 at a post-money valuation of $5 billion. The financing was co-led by premier
              growth equity firms Thrive Capital and Greenoaks, with reported syndicate participation from Sequoia
              Capital, Ribbit Capital, and SV Angel. Public reporting confirmed that incubating sponsors Stripe and
              Paradigm did not contribute additional capital into the equity round, allowing external venture
              institutions to establish the baseline valuation benchmark. In exchange, Tempo assembled an unparalleled
              coalition of enterprise design partners and launch validator candidates spanning tier-one card networks,
              global banks, and fintech platforms, including Visa, Mastercard, Deutsche Bank, Standard Chartered, and
              Klarna. This capitalization grants Tempo extensive runway to subsidize developer onboarding and validator
              infrastructure without near-term capital constraints; however, full cap table terms, including board seat
              distribution, investor protective provisions, liquidation preferences, and potential future token warrant
              allocations, remain undisclosed under private agreements.
            claimRefs:
              - CO002
              - CO011
              - CO012
