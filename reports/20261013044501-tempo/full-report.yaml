  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Payment Rails
        blocks:
          - type: paragraph
            body: >-
              Tempo enters an increasingly competitive payments landscape characterized by three distinct alternative
              categories: general-purpose high-speed Layer-1 networks, emerging issuer-aligned stablechains, and legacy
              correspondent banking systems. While multi-purpose blockchains such as Solana and Ethereum rollups have
              captured early retail transaction volume and developer experimentation, their architectures force
              commercial payments to compete directly against volatile DeFi liquidations, NFT minting runs, and
              arbitrage activity. Tempo distinguishes itself by specializing strictly as a payment settlement engine,
              relying on Stripe's extensive merchant and platform footprint rather than speculative token liquidity
              incentives to drive adoption. Concurrently, issuer-aligned networks like Circle's planned Arc blockchain
              and Tether-backed Plasma represent direct competitors optimizing respectively for institutional capital
              markets and retail remittances, challenging Tempo's bid to become the default settlement layer for
              international stablecoin flows.
            claimRefs:
              - CP001
              - CP007
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP007
              - CP013
      - number: '3.2'
        title: Architectural Tradeoffs and Feature Matrix
        blocks:
          - type: paragraph
            body: >-
              Architecturally, Tempo addresses the core friction points that have historically hindered enterprise
              stablecoin adoption across general-purpose chains. On networks like Ethereum and Solana, transaction fees
              must be paid in volatile native tokens like ETH or SOL, forcing corporate finance and treasury teams to
              acquire, manage, and hedge speculative crypto assets. Tempo eliminates the native gas token entirely,
              enabling enterprises to settle network fees in supported USD stablecoins via an integrated automated
              market maker that converts the fee asset directly into the validator's preferred token. Furthermore, Tempo
              introduces dedicated payment lanes that reserve protocol-level blockspace for TIP-20 transfers, ensuring
              that high-volume payout and remittance runs execute with sub-millidollar predictability even during
              periods of broader network activity. To facilitate seamless integration with existing enterprise ERP and
              core banking ledgers, TIP-20 transfers natively embed 32-byte transaction memos aligned with ISO 20022
              messaging standards, bridging the gap between decentralized ledgers and traditional correspondent banking.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP009
      - number: '3.3'
        title: Settlement Economics and Packaging Dynamics
        blocks:
          - type: paragraph
            body: >-
              Settlement economics and execution latency represent critical decision criteria for commercial merchants
              evaluating alternative rails. Traditional correspondent banking incurs substantial costs, often deducting
              between two and seven percent in intermediary fees alongside wire charges, while taking two to three
              business days to finalize international wires. In contrast, Tempo achieves deterministic sub-second
              settlement finality within 0.5 to 0.6 seconds using Simplex BFT consensus, preventing re-org risks that
              could complicate high-volume commercial accounting. Stripe reports a flat transfer cost of approximately
              $0.001 per Tempo transfer, delivering extreme cost predictability compared to the fluctuating priority
              fees of Solana or Ethereum Layer-2 networks. Beyond human-initiated commerce, Tempo and Stripe have
              co-authored the Machine Payments Protocol, reviving HTTP 402 to provide standardized session-based
              micro-charge batching for autonomous AI agents, opening a high-velocity settlement corridor that legacy
              card networks and traditional banking infrastructure cannot economically service.
            claimRefs:
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP010
      - number: '3.4'
        title: Moat Durability, Governance Scrutiny, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Despite Tempo's technical capabilities and the strategic distribution leverage provided by Stripe's $1.1
              billion acquisition of Bridge and existing processor scale, the platform faces meaningful governance and
              structural displacement risks. Because Tempo was incubated by Stripe and Paradigm and launched its March
              2026 mainnet under a curated permissioned validator structure, industry critics question whether competing
              payment aggregators will trust a corporate-backed ledger that could favor Stripe's proprietary services.
              Furthermore, heavyweight institutional design partners, including Visa, Deutsche Bank, and Standard
              Chartered, are actively multi-homing across both Tempo and competing networks like Circle's Arc,
              demonstrating that tier-one financial institutions will maintain diversified settlement rails rather than
              committing exclusively to Stripe's ecosystem. Moat durability will ultimately depend on whether Tempo can
              execute its planned transition toward permissionless validation while preserving the strict latency,
              deterministic fee ceilings, and compliance guarantees demanded by regulated financial enterprises.
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Multi-Homing and Corporate Neutrality Scrutiny
            body: >-
              While Tempo benefits from Stripe's massive merchant reach, its permissioned validator structure and
              corporate backing raise neutrality concerns among competing payment processors. Crucially, anchor
              financial design partners including Visa and Deutsche Bank are actively multi-homing across alternative
              stablechains such as Circle's Arc, reducing vendor lock-in and capping Tempo's pricing power.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Settlement Fee Architecture
        blocks:
          - type: paragraph
            body: >-
              Tempo's commercial revenue architecture departs fundamentally from conventional public Layer 1 blockchains
              by replacing native token gas speculation with direct utility fee monetization in fiat-backed stablecoins.
              As established in CI001, the network eliminates volatile native gas tokens entirely, enabling enterprises
              to pay network processing fees directly in major stablecoins such as USDC and USDT. To operationalize this
              mechanism, Tempo deploys an enshrined automated market maker (Fee AMM) at the protocol layer, converting
              incoming gas payments into each validator's preferred settlement currency without exposing users to
              secondary market token volatility (CI002). This architectural design is further reinforced by dedicated
              TIP-20 payment lanes that isolate commercial settlement traffic from decentralized finance congestion,
              ensuring predictable sub-millidollar fees regardless of broader blockchain market cycles (CI003).
              Validator operators receive their compensation entirely in stablecoins rather than inflationary block
              rewards, aligning network operating margins directly with transaction throughput (CI006). This
              monetization architecture is tightly integrated with Stripe's payments ecosystem, which was strategically
              bolstered by the $1.1 billion acquisition of Bridge in October 2024 to establish an end-to-end stablecoin
              orchestration rails spanning software APIs and base-layer settlement (CI007).
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
