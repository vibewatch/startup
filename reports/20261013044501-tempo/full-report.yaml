chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Protocol Foundation
        blocks:
          - type: paragraph
            body: >-
              Tempo is an institutional payments-first Layer-1 blockchain company co-founded and incubated in 2025 by
              Stripe and Paradigm. The initiative was conceptualized to resolve fundamental structural bottlenecks that
              prevent general-purpose blockchains from supporting global commercial payments at scale: volatile native
              gas tokens, unpredictable congestion fee spikes, and probabilistic multi-second settlement finality.
              Headquartered alongside its primary operating sponsors in San Francisco, California, Tempo functions as an
              independent operating entity engineered to replace legacy correspondent banking settlement rails. The
              underlying protocol is built on the Reth execution client for full Ethereum Virtual Machine (EVM) tooling
              compatibility and utilizes Simplex BFT consensus implemented through Commonware to deliver deterministic
              sub-second finality in approximately 500 to 600 milliseconds without chain reorganizations. To eliminate
              treasury accounting friction for corporate enterprises, Tempo eliminates volatile native gas tokens
              entirely, allowing transaction fees to be settled directly in USD-denominated stablecoins via an enshrined
              automated market maker while isolating payment blockspace via dedicated 94% payment lanes.
            claimRefs:
              - CO001
              - CO005
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependencies
        blocks:
          - type: paragraph
            body: >-
              Tempo executive leadership is uniquely structured around senior sponsorship from its co-incubating
              institutional backers. Matt Huang, co-founder and managing partner of crypto investment firm Paradigm,
              serves as Chief Executive Officer and principal governance lead for Tempo while maintaining his managing
              partner role at Paradigm. Strategic distribution alignment is anchored by Patrick Collison, Chief
              Executive Officer of Stripe, who publicly established Tempo as Stripe default blockchain infrastructure
              for forthcoming commercial product releases. Technical execution and client architecture have been guided
              by Paradigm Chief Technology Officer Georgios Konstantopoulos, leveraging Paradigm core engineering of the
              Reth Rust execution client. While this leadership structure affords Tempo extraordinary technical pedigree
              and immediate commercial reach across Stripe merchant network, it creates an acute key-person and
              governance dependency. Executive decision-making and strategic prioritization are heavily concentrated
              between Huang and Collison, leaving open questions regarding independent governance autonomy should
              commercial conflicts arise between Stripe internal products and competing payment platforms building on
              the chain.
            claimRefs:
              - CO003
              - CO004
              - CO009
              - CO010
