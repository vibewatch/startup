      sponsors Stripe and Paradigm.
    diligencePath: Obtain organizational chart and key-person employment agreements for all principal operating officers.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercial-monetization-metrics
    missingEvidence: >-
