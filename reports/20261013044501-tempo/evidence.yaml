evidenceGaps:
  - type: missing-source
    severity: material
    topic: Monetization and Production Fee Revenue
    missingEvidence: >-
      Audited breakdown of annualized contract revenue, merchant transaction take-rate, and gross margin per payment
      corridor.
    whyItMatters: >-
      Without verified net take-rate disclosures, Tempo's underlying operating profitability and unit economics cannot
      be evaluated against its $5 billion post-money valuation.
    diligencePath: >-
      Request management financial reports covering fee schedules, net revenue run-rate, and partner take-rate sharing
      arrangements under Stripe.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: Cap Table Governance and Investor Liquidation Terms
    missingEvidence: >-
      Complete capitalization table details specifying class voting rights, board seats, liquidation seniority, and any
      token warrant rights.
    whyItMatters: >-
      Private equity terms dictate downside investor protections and determine whether token-linked economics could
      dilute common equity holders.
    diligencePath: >-
      Review confidential Series A financing agreements, investor rights covenants, and board voting agreements during
      formal diligence.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
