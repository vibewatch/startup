callouts:
  - calloutType: risk
    title: Enterprise Multi-Homing and Corporate Neutrality Scrutiny
    body: While Tempo benefits from Stripe's massive merchant reach, its permissioned validator structure and corporate backing raise neutrality concerns among competing payment processors. Crucially, anchor financial design partners including Visa and Deutsche Bank are actively multi-homing across alternative stablechains such as Circle's Arc, reducing vendor lock-in and capping Tempo's pricing power.
    claimRefs:
      - CP011
      - CP012
