chapter:
  number: 6
  title: "Customers"
  summary: "Tempo's commercial adoption strategy centers on leveraging Stripe's enterprise merchant distribution and co-designing payment rails with marquee partners like Visa, Deutsche Bank, and OpenAI, claiming over $36 billion in annualized stablecoin payment volume. However, public evidence of binding multi-year production commitments, contract take rates, or organic retention independent of Stripe's internal volume remains scarce, while corporate governance and validator liability concerns present ongoing friction for third-party enterprise trust."
sections:
  - id: "customer-segmentation-and-target-buyer-profiles"
    title: "Customer Segmentation and Buyer Profiles"
    body: "Tempo segments its enterprise customer opportunity across four distinct buyer profiles: global card networks and merchant acquirers, multinational e-commerce marketplaces, corporate treasuries and importers, and autonomous artificial intelligence platforms. Each segment operates with distinct operational objectives and decision-makers. Global card networks and acquirers seek multi-currency wholesale settlement rails that bypass multi-day correspondent banking delays and eliminate foreign exchange friction. Multinational marketplaces target automated contractor and seller disbursements across emerging markets, where traditional banking infrastructure is slow or costly. Corporate treasuries and importers evaluate stablecoins as cash equivalents for cross-border supplier payments, though corporate adoption remains tightly constrained by accounting standards that require direct redemption contracts with token issuers. Finally, autonomous AI agent developers and API providers require programmatic micropayments with sub-second finality and predictable dollar-denominated fees, representing an emerging frontier in machine commerce."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-network-throughput"
    title: "Adoption Trajectory and Network Throughput"
    body: "Tempo's self-reported adoption trajectory indicates substantial nominal scale, highlighted by more than $36 billion in annualized stablecoin payment volume and over $700 million in tokenized asset value. The network has established on- and offramp connectivity spanning 95 fiat currencies, enabling merchant disbursements across global payment corridors. From a technical capacity standpoint, Tempo's architecture is engineered to sustain throughput in excess of 100,000 transactions per second with sub-second finality using its Simplex BFT consensus engine and dedicated payment lanes that isolate stablecoin transfers from general computational congestion. However, critical performance denominators remain private: public disclosures do not disaggregate how much of the $36 billion annualized throughput represents organic third-party merchant commerce versus automated internal routing by Stripe, nor do they report sustained mainnet transactions per second under multi-party adversarial workloads."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-design-partners-and-pilot-conversion"
    title: "Named Design Partners and Deployment Status"
    body: "To establish enterprise credibility, Stripe and Tempo assembled a notable cohort of design partners spanning traditional financial leaders, high-growth technology platforms, and artificial intelligence research labs. Disclosed participants include Visa, Deutsche Bank, Shopify, Revolut, Nubank, DoorDash, OpenAI, and Anthropic. For financial institutions such as Deutsche Bank and Visa, Tempo's protocol-level ISO 20022 messaging alignment and sub-second finality provide a compelling bridge between legacy interbank messaging and modern settlement. Concurrently, for AI developers like OpenAI and Anthropic, the Machine Payment Protocol co-authored by Stripe and Tempo introduces standardized HTTP 402 payment handshakes for autonomous agent API metering. Nevertheless, all disclosed enterprise relationships currently operate as design partnerships, testnet evaluations, or pilot integrations; verifiable evidence of long-term production contracts, committed annual recurring revenue, or binding platform exclusivity remains absent."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "retention-durability-and-platform-concentration-risks"
    title: "Durability, Churn Risks, and Corporate Platform Dependencies"
    body: "The durability of Tempo's customer base faces structural governance and platform concentration risks. By incubating Tempo as a corporate-backed blockchain governed initially by a permissioned validator set of commercial partners, Stripe has attracted scrutiny from decentralization advocates and distributed systems researchers. Industry critics highlight that permissioned validators represent identified corporate entities subject to regulatory subpoena, legal liability, and censorship pressures. Furthermore, prospective third-party payments competitors question whether Stripe can credibly maintain platform neutrality, expressing concern that the platform could eventually favor proprietary Stripe products over independent developers. Without independent customer retention metrics, net revenue retention benchmarks, or documented multi-year contract renewals, investors must treat current adoption as heavily reliant on Stripe's captive distribution rather than organically validated third-party market demand."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
