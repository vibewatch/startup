callouts:
  - calloutType: insight
    title: Strategic Moat via Vertically Integrated Payments Stack
    body: >-
      Unlike general-purpose blockchains that must compete for speculative liquidity and retail developer mindshare,
      Tempo is engineered specifically as the settlement base of Stripe corporate perimeter. By integrating Bridge for
      stablecoin issuance orchestration and Privy for embedded wallets, Stripe and Paradigm can route enterprise payment
      flows directly onto Tempo without merchants ever interacting with raw crypto primitives.
    claimRefs:
      - CO003
      - CO011
      - CO016
  - calloutType: risk
    title: Permissioned Validator Governance and Institutional Alignment Risk
    body: >-
      Tempo reliance on a curated set of permissioned institutional validators and close corporate ties to Stripe
      creates material regulatory and neutrality risks. As critics have highlighted, a corporate-led blockchain with
      identifiable validator entities remains susceptible to regulatory compulsion, jurisdictional liability, and
      potential competition conflicts with independent payment rails.
    claimRefs:
      - CO014
      - CO015
