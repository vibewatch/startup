company:
  name: Tempo
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tempo is an institutional payments-first Layer-1 blockchain incubated by Stripe and Paradigm, launched on mainnet in
    March 2026 and capitalized with a $500 million Series A at a $5 billion valuation led by Thrive Capital and
    Greenoaks. Engineered with sub-second Simplex BFT consensus, Reth execution, and native stablecoin gas without a
    volatile native token, the network targets corporate payouts, cross-border remittances, and AI agent payments while
    facing ongoing diligence questions regarding validator decentralization, private cap table terms, and unproven
    commercial fee conversion.
sections:
  - id: corporate-identity-architecture
    title: Corporate Identity and Protocol Foundation
    body: >-
      Tempo is an institutional payments-first Layer-1 blockchain company co-founded and incubated in 2025 by Stripe and
      Paradigm. The initiative was conceptualized to resolve fundamental structural bottlenecks that prevent
      general-purpose blockchains from supporting global commercial payments at scale: volatile native gas tokens,
      unpredictable congestion fee spikes, and probabilistic multi-second settlement finality. Headquartered alongside
      its primary operating sponsors in San Francisco, California, Tempo functions as an independent operating entity
      engineered to replace legacy correspondent banking settlement rails. The underlying protocol is built on the Reth
      execution client for full Ethereum Virtual Machine (EVM) tooling compatibility and utilizes Simplex BFT consensus
      implemented through Commonware to deliver deterministic sub-second finality in approximately 500 to 600
      milliseconds without chain reorganizations. To eliminate treasury accounting friction for corporate enterprises,
      Tempo eliminates volatile native gas tokens entirely, allowing transaction fees to be settled directly in
      USD-denominated stablecoins via an enshrined automated market maker while isolating payment blockspace via
      dedicated 94% payment lanes.
    claimRefs:
      - CO001
      - CO005
      - CO016
    tableRefs:
      - TO001
  - id: leadership-governance
    title: Leadership, Governance, and Key-Person Dependencies
    body: >-
      Tempo executive leadership is uniquely structured around senior sponsorship from its co-incubating institutional
      backers. Matt Huang, co-founder and managing partner of crypto investment firm Paradigm, serves as Chief Executive
      Officer and principal governance lead for Tempo while maintaining his managing partner role at Paradigm. Strategic
      distribution alignment is anchored by Patrick Collison, Chief Executive Officer of Stripe, who publicly
      established Tempo as Stripe default blockchain infrastructure for forthcoming commercial product releases.
      Technical execution and client architecture have been guided by Paradigm Chief Technology Officer Georgios
      Konstantopoulos, leveraging Paradigm core engineering of the Reth Rust execution client. While this leadership
      structure affords Tempo extraordinary technical pedigree and immediate commercial reach across Stripe merchant
      network, it creates an acute key-person and governance dependency. Executive decision-making and strategic
      prioritization are heavily concentrated between Huang and Collison, leaving open questions regarding independent
      governance autonomy should commercial conflicts arise between Stripe internal products and competing payment
      platforms building on the chain.
    claimRefs:
      - CO003
      - CO004
      - CO009
      - CO010
    tableRefs:
      - TO002
  - id: capitalization-stakeholder-map
    title: Capitalization, Investor Base, and Strategic Stakeholders
    body: >-
      Tempo achieved elite early-stage capitalization through a massive $500 million Series A financing round completed
      in October 2025 at a post-money valuation of $5 billion. The financing was co-led by premier growth equity firms
      Thrive Capital and Greenoaks, with reported syndicate participation from Sequoia Capital, Ribbit Capital, and SV
      Angel. Public reporting confirmed that incubating sponsors Stripe and Paradigm did not contribute additional
      capital into the equity round, allowing external venture institutions to establish the baseline valuation
      benchmark. In exchange, Tempo assembled an unparalleled coalition of enterprise design partners and launch
      validator candidates spanning tier-one card networks, global banks, and fintech platforms, including Visa,
      Mastercard, Deutsche Bank, Standard Chartered, and Klarna. This capitalization grants Tempo extensive runway to
      subsidize developer onboarding and validator infrastructure without near-term capital constraints; however, full
      cap table terms, including board seat distribution, investor protective provisions, liquidation preferences, and
      potential future token warrant allocations, remain undisclosed under private agreements.
    claimRefs:
      - CO002
      - CO011
      - CO012
    tableRefs:
      - TO003
  - id: operational-milestones-adverse-evaluation
    title: Operational Milestones, Adverse Scrutiny, and Institutional Risks
    body: >-
      Following its public unveiling on September 4, 2025, Tempo advanced through a rigorous multi-phase development
      roadmap. A private testnet in September 2025 transitioned to an open enterprise public testnet in December 2025,
      culminating in official mainnet deployment on March 18, 2026. Concurrently with mainnet, Stripe and Tempo
      co-launched the Machine Payments Protocol (MPP), an open standard leveraging HTTP 402 status codes to enable
      autonomous AI agent micropayments across fiat and stablecoin rails. Despite these operational milestones and
      company claims of over $36 billion in annualized stablecoin volume across 95 fiat currency corridors, Tempo has
      drawn sharp adverse scrutiny from prominent cryptocurrency researchers and payments architects. Critics, including
      Libra co-creator Christian Catalini and crypto educator Omid Malekan, argue that Tempo initial reliance on a
      curated set of permissioned institutional validators undermines credible neutrality. If validator nodes are
      operated by known corporate entities, the network remains legally susceptible to regulatory compulsion, sanctions
      enforcement, or potential rollback directives, creating long-term structural tension between institutional
      compliance requirements and decentralized settlement guarantees.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO013
      - CO014
      - CO015
    figureRefs:
      - FO001
