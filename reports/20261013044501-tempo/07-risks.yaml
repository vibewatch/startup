callouts:
  - calloutType: risk
    title: Single-Client Execution Vulnerability and Chain Halt Exposure
    body: Tempo reliance on Paradigm Reth client as its sole execution layer creates acute systemic vulnerability. Unlike Ethereum, where client diversity cushions individual software bugs, an unpatched defect in Reth could trigger an immediate network-wide halt, paralyzing institutional settlement.
    claimRefs:
      - CR007
      - CR008
  - calloutType: insight
    title: Corporate Governance Duality and Enterprise Partner Hesitation
    body: While Stripe incubation provides immediate distribution and marquee design partners, competing financial institutions face structural channel conflict. Independent payment processors and rival banks risk becoming dependent on infrastructure steered by a key competitor.
    claimRefs:
      - CR003
      - CR004
      - CR010
