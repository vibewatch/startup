evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters-and-legal-entity
    missingEvidence: An official legal entity name, registered address, and incorporation record for Tempo.
    whyItMatters: >-
      Jurisdiction, contracting, regulatory scope, and entity diligence cannot be completed from public marketing
      surfaces alone.
    diligencePath: >-
      Request the certificate of incorporation, registered-agent address, and any terms-of-service or legal pages that
      identify the contracting entity.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: private-evidence-only
    severity: material
    topic: leadership-and-governance-disclosure
    missingEvidence: >-
      Board roster, committee structure, investor-rights summary, and any conflict-management framework covering Matt
      Huang's dual role.
    whyItMatters: >-
      Key-person risk, related-party oversight, and governance quality cannot be assessed from validator-roadmap
      disclosures alone.
    diligencePath: >-
      Request the board list, governance charter, investor-rights summary, and any written conflict policy covering
      Paradigm and Stripe relationships.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-and-traction-metrics
    missingEvidence: >-
      Revenue, gross margin, customer count, volume by corridor, current headcount, and any audited or reviewed
      financial statements.
    whyItMatters: >-
      The round size and valuation cannot be pressure-tested without evidence on actual operating performance or
      customer conversion.
    diligencePath: >-
      Request a KPI pack covering revenue, gross profit, customer concentration, volume growth, current headcount, and
      cash runway.
  - type: missing-source
    severity: material
    topic: series-a-primary-documents
    missingEvidence: >-
      An official company or investor announcement, term sheet summary, or filing confirming the Series A size,
      valuation, and rights.
    whyItMatters: >-
      The public funding narrative currently rests on secondary reporting, which is adequate for context but weak for
      diligence-grade ownership analysis.
    diligencePath: >-
      Request the financing announcement deck, cap-table snapshot, and preferred-share terms from the company or lead
      investors.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: public-leadership-and-ownership-enumeration
    missingEvidence: >-
      A full public leadership roster and a complete shareholder map that goes beyond incubators and named Series A
      participants.
    whyItMatters: >-
      The leadership and stakeholder tables are intentionally partial because public sources do not cover the full org
      chart or capitalization structure.
    diligencePath: Request an executive org chart, a full cap table, and the current board observer list.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Public corridor-by-corridor revenue mix or payment-volume share by Tempo target segment that would let us isolate
      a precise SAM and SOM.
    whyItMatters: >-
      Without customer-mix and corridor-share data, the chapter can bound the market but cannot responsibly publish a
      Tempo-specific SAM or SOM.
    diligencePath: >-
      Request internal volume split by workflow, geography, and buyer segment; then map those shares onto retained
      cross-border and payout benchmarks.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: corridor-operability
    missingEvidence: >-
      Corridor-level off-ramp depth, tax treatment, labor-law constraints, and payout failure rates for the first
      payroll or marketplace corridors Tempo wants to win.
    whyItMatters: >-
      Headline cost and speed gains can disappear if local compliance and fiat conversion are weak in the corridors that
      matter most.
    diligencePath: >-
      For each planned launch corridor, collect partner term sheets, off-ramp SLAs, tax memos, and payout-support
      metrics before underwriting expansion.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
      - TM004
  - type: stale
    severity: material
    topic: regulatory-convergence
    missingEvidence: >-
      A current jurisdiction-by-jurisdiction matrix showing when reserve, charter, redemption, and payment-system rules
      will be production-ready across the US, UK, EU, and other launch markets.
    whyItMatters: >-
      Enterprise procurement depends on when local rules converge enough to let treasury, compliance, and legal teams
      approve a common operating model.
    diligencePath: >-
      Refresh legal memos for target corridors each quarter and compare bank-charter, stablecoin-issuer, and
      payment-rail requirements side by side.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: tempo-validator-economics
    missingEvidence: >-
      Tempo does not publicly disclose a finalized validator count, validator roster, or mainnet reward and fee schedule
      that would let an investor compare governance economics with public-chain rivals.
    whyItMatters: >-
      Validator concentration and fee economics determine whether Tempo's bounded-validator model is a durable
      enterprise feature or simply a centralization trade-off without compensating economic advantage.
    diligencePath: >-
      Request the latest validator roster, target validator expansion plan, and post-mainnet economics memo from Tempo
      or Blockdaemon under NDA.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: material
    topic: tempo-partner-scale
    missingEvidence: >-
      Tempo names enterprises and design partners, but public sources do not quantify live payment volume, conversion
      rates from pilot to production, or customer concentration across those accounts.
    whyItMatters: >-
      Named logos improve credibility, but underwriting competitive durability requires knowing whether Tempo already
      owns material recurring payment volume or is still in low-volume proof-of-concept deployments.
    diligencePath: >-
      Ask for signed live-customer counts, annualized payment volume by top deployment, and expansion pipeline metrics
      for named enterprise accounts.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: >-
      Tempo, Circle, Fireblocks, and Bridge do not publish comparable enterprise contract pricing, minimums, or discount
      structures that would allow a true head-to-head TCO analysis.
    whyItMatters: >-
      Pricing power and implementation cost drive win rates in infrastructure deals, and public fee-per-transaction
      signals alone do not reveal the commercial burden of enterprise deployment.
    diligencePath: >-
      Collect redlined MSAs or commercial quote sheets for at least two comparable enterprise use cases across Tempo and
      the main orchestration alternatives.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: stale
    severity: minor
    topic: production-throughput-comparability
    missingEvidence: >-
      Tempo and several rivals publish targets, benchmarks, or stage-specific confirmation times, but there is no single
      like-for-like public dataset for sustained enterprise payment throughput under production conditions.
    whyItMatters: >-
      Without comparable production throughput and failure-mode data, buyers may over-index on headline TPS or finality
      marketing when choosing a settlement layer.
    diligencePath: >-
      Request benchmark methodology, live throughput percentiles, downtime history, and peak-load payment performance
      from Tempo and shortlisted competitors.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: validator-economics
    missingEvidence: >-
      Tempo and partner materials do not publish a finalized validator reward split, minimum stake, treasury take, or
      fee-schedule table ahead of mainnet.
    whyItMatters: Without a finalized reward schedule, validator ROI and network-security incentives cannot be underwritten.
    diligencePath: >-
      Request the mainnet economics deck, validator onboarding terms, target validator count, minimum participation
      thresholds, and expected fee split between validators, treasury, and any AMM or liquidity providers.
    relatedQuestionRefs:
      - QI010
