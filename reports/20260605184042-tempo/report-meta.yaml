companyProfile:
  summary: >-
    Tempo is a private payments-infrastructure startup jointly incubated by Stripe and Paradigm to build an
    Ethereum-compatible Layer 1 optimized for stablecoin settlement, remittances, embedded finance, tokenized
    deposits, and machine-native payments. Public evidence supports a September 2025 launch, a March 2026
    mainnet, a reported $500 million Series A at a $5 billion valuation, and unusually strong early design-
    partner and validator interest from major technology, payments, and banking brands. The core diligence
    question is not whether Tempo has strategic relevance; it is whether revenue conversion, fee capture,
    governance, and regulatory execution are strong enough to justify the current private mark.
