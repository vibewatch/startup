      - number: '4.2'
        title: GTM 节奏与单位经济代理指标：商业意图强，公开转化数据弱
        blocks:
          - type: paragraph
            body: >-
              对早期区块链网络来说，Tempo 的 GTM 信号异常偏企业。设计伙伴名单横跨银行、金融科技、大型商户、AI 公司和跨境支付玩家，基础设施伙伴阵容覆盖托管、分析、合规、钱包、互操作和开发者工具。Built In
              职位进一步显示，公司在商业伙伴、客户成功、产品工程、基础设施、法律、传播和财务控制职能上招聘。这些信号合起来指向一个刻意设计的 B2B
              商业化动作，而不是面向消费者的代币发布。它们也意味着在大规模网络收入被证明前，公司会有可观运营开支。信号没有提供的是客户转化或销售效率。公开披露里没有销售周期长度、合同最低额、渠道经济、设计伙伴转付费、或
              CAC/payback。缺口很重要，因为 Tempo 的可见价格点很小。转账成本低于 1 美分时，收入需要巨量支付量、高价值结算流，或附加变现才能有意义。招聘和生态广度支撑商业准备度提升的论点；但只有当
              Tempo 展示付费生产使用和实际费用收益率时，它们才会转化成收入质量。
