companyProfile:
  summary: >-
    Tempo 是由 Stripe 和 Paradigm 联合孵化的私有支付基础设施创业公司，正在打造一个兼容 Ethereum 的 Layer 1，针对稳定币结算、汇款、嵌入式金融、代币化存款和机器原生支付优化。公开证据支持 2025
    年 9 月发布、2026 年 3 月主网上线、据报 $500 million Series A 且估值 $5 billion，以及大型科技、支付和银行品牌异常强的早期设计伙伴与验证者兴趣。核心尽调问题不是 Tempo
    有没有战略相关性；而是收入转化、费用捕获、治理和监管执行是否足够强，能否支撑当前私募估值标记。
