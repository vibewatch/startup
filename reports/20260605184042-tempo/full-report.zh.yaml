      - number: '8.5'
        title: 否决触发点与尽调问题：付高价前必须成立的事实
        blocks:
          - type: paragraph
            body: >-
              最大的剩余工作不是主题研究，而是私营公司尽调。监管者和政策机构持续警告，稳定币进入主流支付流后，可能制造挤兑风险、运营风险和系统性关联。这些警告不会杀死 Tempo
              投资逻辑，但它们意味着，企业采用会偏向能够证明合规、银行访问、储备处理和可靠运营控制的服务商。对 Tempo
              来说，决定性缺失项是商业和结构层面的：按走廊拆分的活跃支付量、已实现净收入和毛利率、具名合作伙伴确实在生产环境付费的证明，以及带有优先权和稀释细节的当前股权结构表。没有这些，投资者可以描述上行，却无法正确衡量下行。因此，否决触发点很实际：主网
              之后商业化证明仍不可见、合作伙伴转化仍主要停留在叙事，或者监管把稳定币经济性压进银行控制的渠道，$5 billion 标记就会更难辩护。
