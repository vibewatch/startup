  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 若投资人要求约 3x 总回报，且稀释不可忽略，$5B 入场价需要很大的退出收入支撑。
    data:
      items:
        - label: 6x 退出倍数 / 25% 稀释
          value: 3.33
          note: 从 $5B 入场取得约 3.0x 总回报所需的退出收入（$B）。
        - label: 8x 退出倍数 / 20% 稀释
          value: 2.34
          note: 仍假设支付轨道能拿到类似高端软件的变现水平。
        - label: 10x 退出倍数 / 20% 稀释
          value: 1.88
          note: 只有在抽成率可持续时，才比 6x 情形更可信。
        - label: 12x 退出倍数 / 15% 稀释
          value: 1.47
          note: 需要高端倍数支撑和强增长同时成立。
        - label: 15x 退出倍数 / 10% 稀释
          value: 1.11
          note: 最乐观的公开市场倍数和稀释假设，不是基准情形。
    approximationNotes: 假设以 $5B 入场、五年目标为 3.0x 总回报；数值为所需退出收入，单位为 US$ 十亿，不是 Tempo 预测。
    claimRefs:
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Tempo 是私营公司，公开变现输入仍稀疏，所以情景区间刻意拉得很宽。
    data:
      items:
        - label: 乐观情形退出股权价值（$B）
          low: 14
          mid: 18
          high: 24
          note: 若稀释受控、伙伴转化强，总回报约 2.8x-4.8x。
        - label: 基准情形退出股权价值（$B）
          low: 6
          mid: 8
          high: 11
          note: 若 Tempo 能变现，但更像基础设施而不是软件，总回报约 1.2x-2.2x。
        - label: 悲观情形退出股权价值（$B）
          low: 2
          mid: 4
          high: 6
          note: 若试点不能转化且倍数压缩，总回报约 0.4x-1.2x。
    approximationNotes: 这些是退出股权价值区间，不是当前公允价值；设计目的，是在明确乐观、基准和悲观假设下展示回报敏感性。
    claimRefs:
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 式打分强调，卡点是证据质量约束下的估值，不是产品野心不足。
    data:
