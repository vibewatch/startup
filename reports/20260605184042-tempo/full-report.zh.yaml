      - number: '4.3'
        title: 资本充足性与估值：据报大额 Series A，但没有公开现金跑道计算
        blocks:
          - type: paragraph
            body: >-
              公开报道中最常被引用的财务数据点，是据报 $500 million Series A 和约 $5 billion 估值。独立媒体大体认同规模、估值锚点和投资人组合：Thrive Capital 和
              Greenoaks 领投，据报 Stripe 与 Paradigm 虽然孵化了公司，但未参与本轮。这笔大额融资很重要，因为 Tempo
              同时在建设新链、生态和企业网络。不过，公开记录仍没有真正说明资本是否充足。官方材料和审阅到的二级来源都没有披露交割后现金、招聘烧钱速度、基础设施承诺、发布支出，或以月计的现金跑道。股权结构同样不透明：审阅范围内没有公开备案文件或可访问的条款级来源显示清算优先权、董事会权利、债务，或任何代币认股权证结构。验证者经济也仍未完成，网络层现金流分配无法高信心建模。因此，据报融资轮只是估值锚点和融资能力的粗略证明，不是偿付能力或稀释问题的完整答案。没有管理层数据时，Series
              A 提升了 Tempo 能为发布融资的信心，但没有关闭关于现金跑道或资本强度的投资论证。
