      - number: '6.4'
        title: 耐久性、留存代理指标与证明边界
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录迅速变薄的地方。审阅来源都没有披露付费客户数量、NRR、GRR、客户流失、合同长度或续约队列。可见的反而是承诺代理指标。Visa 投入工程工作，现在内部运行验证者。Stripe 发布了明确引用
              Tempo 的产品和 API 支持。Kraken 和 Alchemy 在网络之上开放了上线基础设施接口。这些信号有用，说明 Tempo
              已越过概念阶段，但不能替代留存或单位经济证据。面向客户的案例研究也更多停在意图和架构，而不是实现后结果。DoorDash、MoneyGram 和 Flutterwave
              解释了为什么更快结算、更低跨境成本和更好对账重要，但没有发布上线后节省、失败率下降或多个季度扩张数据。因此，投资人可以把公开记录视为真实实施工作的证据，而不是持久商业表现的证明。
