      - number: '3.3'
        title: 分发、切换成本与企业信任
        blocks:
          - type: paragraph
            body: >-
              架构只能把 Tempo 带进候选名单；分发和信任决定它能不能赢下账户。Tempo 已有有意义的早期证明点：DoorDash、Stripe、Coastal 和 ARQ 是具名设计伙伴，公司还称 50+
              个基础设施伙伴覆盖托管、合规、出入金、发卡和编排。这让 Tempo 比纯白皮书阶段的链更有企业牵引。但多数对手起步时已有更大的安装基础。Base 继承 Coinbase 的开发者和企业分发。Solana
              带着公开稳定币量和 Visa 的技术背书。Stellar 已有全球支付出入金触达。XRPL 有十余年企业链运营历史，稳定币集合也在扩展。Circle、Fireblocks 和 Bridge
              都通过编排或服务层销售企业采用，而不是先要求买方选择一条新链。

              这降低了基础设施层的切换成本。如果资金管理、付款或嵌入式金融团队能通过 Circle、Fireblocks 或 Bridge 加入稳定币流，它就可以多链并行，或完全推迟底层链决策。Tempo
              的顾问模式和有边界的验证者接入，可能降低受监管买方的执行风险，但不会自动形成 Coinbase、大银行关系或中立 API 供应商已经拥有的嵌入式分发护城河。实际看，Tempo
              最强的场景，是买方想要一条支付优化链，并愿意主动选择它，而不是把选链当作实施细节。
