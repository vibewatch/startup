      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >
              领导层公开披露很窄。最清楚的官方治理事实是 Matt Huang 表示会在继续与 Alana 共同领导 Paradigm 的同时领导
              Tempo，这立刻让他成为公司的关键外部面孔、连接一个孵化方的桥梁，以及投资人和合作伙伴面前最醒目的战略阐释者。CoinDesk 另报道称 Tempo 上线时团队 15
              人，凸显叙事、融资和战略问责集中在仍很小的组织里。Tempo 之后引入 Ethereum 研究员 Dankrad
              Feist，提升了技术可信度，但这项招聘没有消除关键人风险；它分散了一部分技术执行风险，企业治理披露仍大体空白。Tempo 对网络治理远比对公司治理明确。官方文章解释了从测试网上 4
              个团队运行验证者，到合作伙伴验证者，最终走向无许可验证者集合的路径，但审阅到的公开材料没有披露董事会名单、委员会结构、投票权或优先权结构。这种不对称很重要：验证者路线图说明链可能如何去中心化，而背后的公司仍结构性不透明。尽调层面，Matt
              Huang 集中度和缺少正式治理披露是主要领导风险。
