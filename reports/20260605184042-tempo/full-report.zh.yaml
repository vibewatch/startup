  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：稳定币支付基础设施，不是泛加密
        blocks:
          - type: paragraph
            body: >-
              最适合把 Tempo 理解为面向稳定币原生商业支付的基础设施，而不是通用区块链，也不是全部加密活动的代理。Tempo
              自身定位聚焦现实世界稳定币支付，当前用例页面也集中在全球付款、跨境供应商付款、薪资、汇款和代币化资金流动。这个边界很重要，因为广义稳定币统计里仍包含大量交易、DeFi 流动性和交易所结算活动。ECB 和
              Castle Island
              的证据都说明，原始生态数字可能误导：稳定币对加密市场流动性至关重要，即便调整后的结算数据也需要先去噪，才像支付活动。尽调用的纳入支出，是帮助企业围绕稳定币流完成移动、对账、控制和合规的软件与基础设施，覆盖付款、B2B
              结算、资金管理、薪资，以及商户或平台结算。排除支出包括投机交易量、一般加密投资，以及从不触及稳定币发行、链上结算或相关合规和对账工作流的传统支付软件。
