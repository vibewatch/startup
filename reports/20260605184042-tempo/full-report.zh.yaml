chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与创立故事
        blocks:
          - type: paragraph
            body: >
              Tempo 将自己定义为为现实世界稳定币支付而建的区块链，而不是通用加密网络。Tempo 和 Paradigm 的官方发布叙事一致：Stripe 贡献支付运营经验，Paradigm
              贡献加密基础设施能力，公司由此针对全球付款、汇款、代币化存款、智能体小额支付等具体工作流问题搭建。产品叙事强调稳定币计价 gas、专用支付通道、内置 memo 字段，以及基于 Reth 的 EVM
              兼容性，目标是让支付操作比交易驱动链更可预测。公开证据讲产品更清楚，讲法律实体则模糊。Tempo 官网没有公布街道地址或注册记录，但 Built In 和 F6S 都把公司放在 San
              Francisco。同样，官方材料清楚显示 2025 年 9 月的公开发布窗口，准确法律成立日期仍不透明。因此，最有支撑的创立故事是运营层面的，而不是公司层面的：Tempo 是一条新推出、联合孵化的支付链，GTM
              正通过企业设计伙伴和基础设施供应商验证，而不是靠披露财务结果证明。
