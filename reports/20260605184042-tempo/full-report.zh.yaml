  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价：收费型支付轨道清楚，实际变现仍不清楚
        blocks:
          - type: paragraph
            body: >-
              Tempo 的公开材料把收入漏斗上端讲得比落袋端清楚。公司反复把自己定位为面向稳定币的支付优先链，而这套记录里最清楚的变现表面，是 TIP-20 转账和 Tempo Transactions 上以 USD
              稳定币支付的交易费。官方和伙伴文档支持一个固定收费模型：单笔转账低于 0.001 美元、稳定币计价 gas，以及把用户支付费用转换成验证者偏好资产的 Fee
              AMM。这足以说明交易费是真实存在、且有意做成企业友好；但不足以判断 Tempo 每笔交易能留下多少总收入，费用如何在验证者或任何金库之间拆分，AMM
              是否嵌入点差捕获，或生产环境中的实际企业定价长什么样。公开来源也没有同等清楚地展示第二个变现表面。合作公告和招聘可以支撑一种假设：围绕接入、结算和网络运营存在企业服务或商业关系，但它们没有披露合同价值或经常性软件收入。因此，投资判断很直接：标价可见，但收入组合、费用捕获和收入质量大多仍未披露。
