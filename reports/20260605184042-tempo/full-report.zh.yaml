      - number: '8.2'
        title: 2025 年 10 月轮次证明了什么，仍留下什么未知
        blocks:
          - type: paragraph
            body: >-
              据报道的 Series A 给了投资者一个头条锚点，但不是完整承销文件。多家媒体一致称，Tempo 以约 $5 billion 估值融资 $500 million，由 Thrive Capital 和
              Greenoaks 领投，Sequoia、Ribbit 和 SV Angel 参与，而 Stripe 和 Paradigm
              未在该轮追加资本。这有意义：它说明，在孵化之后、广泛公开财务披露之前，可信投资者愿意大规模资助 Tempo。但融资头条不等于估值支撑。要从 $5 billion
              入场价拿到风险投资式回报，公司仍需要大得多的退出价值；未知稀释还会把门槛推得更高。因为 Tempo
              仍是私营公司，收入未披露，正确方法是情景和敏感性分析，而不是虚假的精确。公开记录可以帮助框定这个价格需要什么；它不能让我们宣称，这些所需的收入或现金流结果已经可见。
