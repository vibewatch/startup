      - number: '8.4'
        title: 乐观、基准与悲观：正确估值方法是情景分析
        blocks:
          - type: paragraph
            body: >-
              Tempo
              是私营公司，收入未披露，因此核心问题不是“今天它应得多少精确倍数？”，而是“哪些未来结果能让这个入场价成立？”乐观情景要求几件事同时发生：旗舰合作伙伴必须从设计或试点模式转入规模化付费生产，支付量必须集中在
              Tempo 能保住有意义抽成的工作流上，公开市场或战略退出对支付基础设施的倍数也要保持慷慨。基准情景更温和，坦率说也更常见：产品进展扎实、用量真实，但商业化更慢，经济性也比合作伙伴名单暗示的更商品化。悲观情景不是
              Tempo 技术差，而是合作伙伴标识转化不够快，受监管银行或编排竞争对手拿走企业层，并且在 Tempo 披露有说服力的财务证明之前，市场对加密资产的风险偏好已经压缩。因此，下方情景区间刻意拉宽，也明确由假设驱动。
