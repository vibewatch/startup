      - number: '7.5'
        title: 金融系统风险、缓解因素与投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              最后一项承销风险在于，Tempo 的上行取决于一场宏观和政策转型；即便公司执行良好，这场转型仍可能不均衡地展开。Federal Reserve
              的研究表明，稳定币增长可能改变银行融资结构，提高无保险批发资金集中度，并加剧服务发行方银行的流动性压力。IMF
              的分析把担忧从存款延伸到更远：代币化金融可能移除时间缓冲，把控制权转移到共享基础设施和代码中；当法律确定性或治理较弱时，还会通过速度、集中度和碎片化放大不稳定性。对 Tempo
              而言，监管进展并不是一条干净的去风险路径。采用率提高本身，可能带来对发行方质量、储备管理、运营韧性和跨境结算治理的更严格审视。缓解理由仍然真实：公司有专为支付打造的功能、正在增加的机构验证者、明确的合规工具，以及一个越来越受正式规则手册支持的品类。但投资者不应把“可信的品类形成”等同于“公司已经去风险”。如果牌照或发行方资格切断关键走廊，如果协议或验证者控制故障削弱信任，如果设计伙伴势头始终无法转化为持续支付量，或者关联方集中度让
              Tempo 看起来更像一条封闭企业轨道，而不是中立的企业支付网络，这条投资逻辑就会失效。
