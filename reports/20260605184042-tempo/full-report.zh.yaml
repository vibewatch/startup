  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 支付产品范围与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Tempo
              不是在卖一条泛智能合约链，然后寄希望支付自然发生在上面。它自己的发布、测试网和主网材料始终用工作流定义产品：全球付款、薪资、汇款、嵌入式金融账户、代币化存款、商户结算、微交易和智能体支付。当前上线栈覆盖核心
              L1、TIP-20 发行和合规控制、稳定币原生费用与兑换层、支持代付/批处理/排程的 Tempo Transactions，以及带有会话和支付目录的 Machine Payments
              Protocol。这种产品打包很重要，因为它把基于 memo 的对账、稳定币费用抽象和大批量付款批处理这些关键支付行为，下沉到协议或交易层，而不是留给应用中间件。结果是，金融科技、平台和 AI
              服务运营商的买方叙事更清楚；但这也意味着，很多关于可扩展性和运营顺滑度的主张，仍是等待广泛公开生产遥测验证的产品主张。
