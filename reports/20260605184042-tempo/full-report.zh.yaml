      - number: '4.4'
        title: 同行披露与下行情形：支付链上行空间存在，但利润率路径仍是推测
        blocks:
          - type: paragraph
            body: >-
              公开加密基础设施同行的可比披露说明，为什么投资人可以相信 Tempo 模型，也说明剩余风险为什么仍大。Coinbase 2025 年 Q3
              股东信显示，一家加密基础设施公司可以同时在多个支付相邻层变现：交易活动、稳定币余额和区块链奖励。同一披露也显示了规模经济的危险：Base
              收入随使用量上升而增长，但当网络持续压低成本时，单笔交易收入下降。Arbitrum 的费用分配文档把这种取舍讲得更直白：把费用回流给用户、开发者或金库可以提升采用，但也会降低链收入。Tempo
              的公开材料还没有说明自己会落在这个光谱的哪一端。这就形成了核心下行情形。一条新的支付聚焦链可以赢得设计伙伴、招募人才并融到大量资本，同时仍无法在加密下行周期中证明持久费用捕获、验证者激励或企业使用。财务结论因此是混合的。业务拥有可信的支付架构和强融资/伙伴叙事，但公开证据对收入质量、利润率路径和长期股权经济性仍过薄，无法在据报估值上形成高信心投资判断。
