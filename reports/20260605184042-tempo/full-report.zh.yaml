  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Tempo 在 EVM 执行栈和有界 BFT 验证者集合之上，叠加支付原生交易和稳定币功能。
    data:
      layers:
        - label: 应用与支付工作流层
          detail: 薪资发放、对外付款、汇款、商户结算、代币化存款、智能体支付和机密企业流程。
        - label: 交易原语层
          detail: Tempo Transactions 加入赞助付费、批处理、调度、并发 nonces、访问密钥和适配 passkey 的认证。
        - label: 稳定币与对账层
          detail: TIP-20 代币、TIP-403 策略、转账备注、固定费用定价，以及无需原生 gas 资产的费用代币选择。
        - label: 流动性与路由层
          detail: 专用 Fee AMM 加上稳定币 DEX，转换用户支付的费用代币，并支持稳定币之间的流转。
        - label: 执行与共识层
          detail: 基于 Reth 的 EVM 执行、JSON-RPC 兼容、Commonware / Simplex BFT 共识，以及正逐步向无许可运营扩展的受邀验证者委员会。
    approximationNotes: 这套堆栈把营销口径抽象为架构层；公开文档没有披露每个内部服务边界或节点角色。
