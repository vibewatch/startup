  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于两边的落差：一边是强产品和伙伴信号，另一边是 $5B 价格下仍很薄的公开变现证据。
    data:
      nodes:
        - id: price
          label: ~$5B 入场价
          detail: 最近披露的一轮融资为未来回报设下很高证明门槛。
        - id: product
          label: 产品就绪度
          detail: 主网、MPP 和支付优先设计已经可见。
        - id: partners
          label: 伙伴质量
          detail: 验证者和具名企业为投资论点增加可信度。
        - id: monetization
          label: 变现缺口
          detail: 收入、支付量、抽成率和利润率仍未披露。
        - id: regulation
          label: 监管 / 周期风险
          detail: 稳定币采用在增长，但监管和倍数压缩仍是真实约束。
        - id: comps
          label: 可比视角
          detail: 同业和公开基准显示确有价值，但通常披露更深。
        - id: recommendation
          label: 跟踪 / 继续研究
          detail: 公司信号不错，但公开信息不足以支撑按最近披露价格买入。
      edges:
        - from: partners
          to: product
          label: 支撑
        - from: product
          to: recommendation
          label: 帮助
        - from: price
          to: recommendation
          label: 抬高门槛
        - from: monetization
          to: recommendation
          label: 阻断确信度
        - from: regulation
