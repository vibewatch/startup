      - number: '7.3'
        title: 安全、协议与运营控制风险
        blocks:
          - type: paragraph
            body: >-
              Tempo 比许多私营加密初创公司有更多可见的安全脚手架，但公开记录仍显示，保证层面存在实质残余缺口。官方文档显示，公司依靠 Blockaid、Chainalysis /
              Hexagate、Elliptic、TRES 和 TRM Labs 等专门的监控、筛查与对账服务商；GitHub
              仓库也显示，团队在做签名发布和构建溯源等供应链完整性工作。这些确实是加分项。但它们不等于生产代码路径已经完成独立保证。GitHub 仍称 Tempo 正在接受审计，尚无活跃漏洞赏金计划；公开 VDP
              目录也显示，安全港和奖励并未由组织认证。外部 Kai 报告把残余风险具体化：报告发现一个高严重度 AccountKeychain
              缺陷，可能让过期访问密钥继续花费；还发现一个围绕基于地址停用机制的验证者抢跑弱点。Tempo
              可以指向缓解措施和日渐成熟的披露界面，但承销结论很简单：安全成熟度已经存在，但项目仍足够早，公开证据本身尚未充分消除智能合约正确性、验证者控制、事件准备和研究者激励风险。
