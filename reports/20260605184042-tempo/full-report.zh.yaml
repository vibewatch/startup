  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Tempo 方案
      - 可衡量收益
      - 限制
    rows:
      - - 全球薪资 / 付款
        - 高频付款受银行截止时间限制，还要承担对账开销
        - 专用支付通道、批量交易、稳定币费用、转账备注
        - 可预期的低于 1 美分支付经济性，以及原子化批量付款
        - 没有公开客户转化、成功率或薪资吞吐数据。
      - - 跨境汇款
        - 多层中介轨道，结算耗时数天
        - 稳定币结算、确定性最终性和 7×24 可用性
        - 秒级结算叙事和更简单的走廊定价
        - 公开走廊经济模型和合规接入细节仍薄。
      - - 商户或市场平台结算
        - 平台主导结算，需要手工对账，还承受费用波动风险
        - 协议备注、批量结算和费用赞助模式
        - 对账数据随支付流转，无需定制账本管道
        - 没有公开退单 / 争议处理或恢复流程文档。
      - - 智能体支付
        - 大量小额服务支付，用传统轨道通常不现实
        - MPP sessions 一次授权，把多笔小额支付聚合成更少的结算
        - 让机器到机器的按次付费流在经济上说得通
        - 生态仍早期；真实生产流量没有公开量化。
      - - 代币化存款 / 受监管发行
        - 封闭银行轨道上的许可转账
        - 使用 TIP-403 策略的 TIP-20 发行，并与稳定币 DEX 互操作
        - 发行方既能保留转账控制，又能使用共享结算基础设施
        - 需要公开的实时发行方案例，以及面向监管的实施证据。
      - - 保密型企业资金流
        - 机构避开公链，因为交易量和交易对手会泄露
        - Zones 保持区内余额私密，同时保留主网互操作性
        - 无需每个 Zone 单独配流动性，也能获得私密余额和可互操作资产
        - Zone 运营方可见性和暂停权会引入新的信任假设。
    notes: 收益基于已记录的协议属性和所描述用例；缺失的实时采用或运营指标按尽调缺口处理，不推断结果。
