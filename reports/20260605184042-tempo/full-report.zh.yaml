      - number: '5.4'
        title: 相对同行的性能与技术定位
        blocks:
          - type: paragraph
            body: >-
              与其他支付相邻链对比时，Tempo 的定位最容易理解。相对 Base，Tempo 提供一条目的明确的 L1，具备确定性终局性和稳定币计价费用；而 Base 继承 Ethereum 的 L2
              费用栈和延迟提款终局性。相对 Solana，Tempo 竞争的是支付抽象——memo、费用代付、批处理和低且可预测的费用——但 Solana 已经发布约 400ms 资金确认和低于 1
              美分成本的公链支付性能数字。相对 XRPL 和 Stellar，Tempo 在执行模型上更接近 Ethereum，同时试图保留支付网络易用性；取舍在于，XRPL 和 Stellar
              仍依赖原生费用资产和更老的支付聚焦共识与流动性设计，而 Tempo 以稳定币和 EVM 可编程性为中心。竞争上行空间清楚：Tempo
              让稳定币支付像原生能力。下行在于，它必须证明这套更有野心的栈能在真实负载下交付同行级可靠性和去中心化，而不只是停留在文档和伙伴演示材料里。
