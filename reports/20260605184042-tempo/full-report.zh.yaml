  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值 / 状态
      - 质量
      - 尽调问题
    rows:
      - - 网络交易费
        - TIP-20 转账和 Tempo Transactions 使用稳定币计价的 gas
        - 每笔交易
        - 公开资料可验证；基础转账目标 < $0.001，AA / 批量交易也低于 1 美分
        - 公开信息中把握最高的收入流
        - 提供按产品流程拆分的月交易笔数、总费用收入、净费用收入和实际单笔费用。
      - - 验证者费用收入
        - 验证者赚取交易费，用户支付的稳定币通过 Fee AMM 转成验证者偏好的资产
        - 费用池分成
        - 主网上线前已有公开描述，但确切奖励分配、最低参与门槛和收益率尚未披露
        - 中
        - 提供验证者收入分成公式、金库抽成，以及上线和稳态下的目标验证者 ROI。
      - - 稳定币 DEX / 兑换经济模型
        - 内置稳定资产 DEX 和 Fee AMM 可能产生价差或路由收入
        - 价差 / 兑换费
        - 机制存在，但没有公开来源披露谁拿走价差收益，费用是否归金库、验证者或流动性提供者
        - 低
        - 提供 AMM 费率表、价差假设、LP 激励，以及兑换收入的会计处理。
      - - 企业合作收入
