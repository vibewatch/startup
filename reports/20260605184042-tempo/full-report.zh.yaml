  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Tempo 不是在真空里竞争。企业稳定币结算的直接链替代品，是已经营销支付或企业级金融用途的公链：Solana、Base、Stellar 和 XRPL。围绕这些链，还有由 Circle CPN 和
              Arc、Fireblocks、Bridge 构成的相邻基础设施层，它们都能帮助机构路由、托管和编排稳定币流，而不要求客户把 Tempo 标准化为底层链。Plasma
              增加了一种垂直对齐的稳定币链模型，带着可信发布路径；而银行发行的代币化存款和银行主导的内部账本，仍是那些第一优先级是受监管表内货币、而不是开放网络触达的买方最可信替代品。

              这意味着 Tempo 的买方很少只是在区块链之间二选一。很多评估里，真正的决策是要不要采用一条新的结算链，还是在现有链之上购买编排，或把支付逻辑留在银行控制的环境里。因此，Tempo
              的竞争集横跨直接公链同行、既有基础设施供应商、相邻稳定币生态和受监管替代品。这个广度重要，因为不同对手赢在不同理由：Solana 赢在公链速度，Base 赢在 Coinbase 分发和 EVM
              熟悉度，Stellar 和 XRPL 赢在既有支付可信度，Circle 或 Fireblocks 赢在企业集成，Plasma 赢在自家资产对齐，代币化存款赢在审慎监管舒适度。
