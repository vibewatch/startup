        title: 图表
        blocks:
          - type: callout
            title: Tempo 的最佳匹配买方想要一条支付优化链，而不只是稳定币接入
            body: >-
              Tempo 最适合那些想要单一结算链的企业；这条链要针对支付优化，并具备 EVM
              可迁移性、稳定币费用和受监管资金流控制。如果买方主要只是想加入稳定币付款，而不想选择长期链战略，中立编排供应商往往是摩擦更低的替代方案。
            calloutType: insight
            claimRefs:
              - CP037
              - CP042
          - type: callout
            title: 抽象层风险是核心竞争威胁
            body: >-
              最危险的竞争者未必是最快的链，而是能让客户获得稳定币收益、同时把链选择保持为可选项的供应商或银行栈。这就是为什么 Fireblocks、Bridge 和代币化存款替代品在 Tempo 的真实企业交易流中，和
              Solana、Base 或 XRPL 一样重要。
            calloutType: risk
            claimRefs:
