  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 结论与入场纪律：公司信号强，公开价格支撑弱
        blocks:
          - type: paragraph
            body: >-
              Tempo 看起来是重要市场里的一家严肃公司。官方材料和合作伙伴文章支持几个事实：它已经上线主网，推出 Machine Payments
              Protocol，吸引了高质量验证者，并获得真正转移资金的企业关注。这足以支撑一条可投资的公司逻辑。但仅凭公开证据，还不足以支撑新的 $5 billion 入场价。Tempo
              是私营公司，保留下来的公开记录仍未披露当前收入、年化支付量、费率抽成、毛利率、活跃付费客户数或股权结构条款。与此同时，2025 年 10 月 Series A
              已经把合作伙伴转化、商业化和品类领导地位的异常高预期计入价格。因此，正确判断应当对价格敏感，而不是对公司视而不见：Tempo 可能成为非常重要的支付资产，但在约 $5 billion
              的位置，公开记录支持的是观察或继续研究，而不是激进领投。
