      - number: '2.2'
        title: 规模测算视角：母市场巨大，可用支付切片窄得多
        blocks:
          - type: paragraph
            body: >-
              留存来源支持一个大机会，但不支持一个干净的 Tempo TAM。最宽口径下，IMF 估计传统与加密跨境支付在 2024 年接近约 $1 quadrillion，其中加密仍只是总量中的小部分。再下一层，World
              Bank 汇款数据表明，传统跨境轨道仍有明显摩擦，尤其是小额转账和银行主导通道。再往下，稳定币估计会因方法不同而大幅分叉。Castle Island 和 Visa 估计，去噪后的稳定币总量结算在 2024
              年达到年化 $5.28 trillion；Stripe 引用 2024 年稳定币转账量 $27.6 trillion；Morph 和 CoinLaw 将 2025 年支付轨道交易量推到约 $33
              trillion；Artemis 自下而上的工作只把 2025 年 8 月年化支付结算归因到约 $118 billion。这些数字不能直接比较，但这种错位本身就有信息量：Tempo
              真正可服务市场更接近较窄的商业支付层，而不是原始链上周转。公开数据足以给市场划边界，但若没有内部通道和客户组合数据，还不足以发布精确的公开 SAM 或 SOM。
