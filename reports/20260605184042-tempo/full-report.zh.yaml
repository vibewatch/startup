  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与购买动作
        blocks:
          - type: paragraph
            body: >-
              Tempo 的公开客户图景比发布时标识名单看起来更窄，也更像企业业务。持续出现的买方问题是支付运营，而不是一般加密采用：平台付款、汇款、资金管理与资金流、嵌入式金融和智能体支付。最具体的公开用例来自
              DoorDash、MoneyGram、Flutterwave、Stripe 和
              Kraken。在这些例子里，买方通常是支付负责人、资金管理负责人、平台产品负责人或付款业务负责人；日常用户是支付运营、财务、合规和工程团队；付费方来自基础设施或资金流转预算，而不是市场或实验性创新预算。伙伴组合强化了这个判断。AI
              实验室、电商平台、银行、数字银行、赞助银行、交易所和付款公司之所以出现，是因为 Tempo
              想成为许多支付产品背后的结算层，而不是一个零售钱包品牌。这让细分是真实的，但也意味着公开证据在伙伴披露具体工作流的地方最强，在 Tempo 只披露标识的地方最弱。
