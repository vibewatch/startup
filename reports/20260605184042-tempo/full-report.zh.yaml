      - number: '1.4'
        title: 截至 2026 年的里程碑、设计伙伴与反向背景
        blocks:
          - type: paragraph
            body: >
              Tempo 从宣布到商业化推进很快。2025 年 9 月亮相后，公司当月晚些时候披露首批基础设施伙伴，10 月引入 Dankrad Feist，同月据报完成 $500 million Series A，12
              月开放公共测试网。到 2026 年 3 月，Tempo 已上线主网和 Machine Payments Protocol，Stripe 随后在 API 更新日志中把 Tempo 加为支持的加密网络。2026 年
              4 月至 6 月，叙事从设计意图转向运营里程碑：Stripe、Visa 和 Zodia Custody 加入成为验证者；DoorDash 描述了面向 40+ 个国家平台的稳定币结算工作；MoneyGram
              成为首个汇款验证者和结算伙伴；Flutterwave 把 Tempo 定位为覆盖 34 个非洲市场的新跨境结算轨道；Kraken 把自己定位为 Tempo 首个美国中心化交易所基础设施栈；Stripe
              自己也在面向 AI 原生计费的流式支付发布中使用 Tempo。这种伙伴新闻节奏是公司最强的公开进展信号，但旁边也有清晰风险旗标。BizBrief 明确质疑融资速度和规模是否反映了创业泡沫热情，围绕 Dankrad
              Feist 加入的批评则显示，Tempo 很容易成为开源与企业区块链之争的焦点。更结构性地看，美国监管机构和国会分析仍警告，支付稳定币面临 AML、储备质量、挤兑风险和实施不确定性。Tempo
              的里程碑是真实的，但监管和披露负担还没有追上故事的野心。
