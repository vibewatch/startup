      - number: '5.5'
        title: 安全、隐私、路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              Tempo 的公开信任叙事是混合的。正面看，它已经披露了实质性的合规和安全伙伴栈、公开安全联系人、开源仓库、签名发布版本，以及可见的加固升级节奏。负面看，GitHub
              安全政策仍称区块链正在审计且没有有效漏洞赏金计划，也没有找到公开审计报告或主网事故历史。Zones
              改善了企业工作流隐私，但也引入明确的信任假设：运营者可以看到区内全部活动，控制排序和活性，并可能按自己的合规规则暂停提款或转账。更广泛地看，网络仍在快速演进。2026 年升级计划包括反复的安全和 gas
              变更、验证者配置变更、支付通道分类，以及多跳 FeeAMM 路由，其中部分事项在报告日期仍未完成。因此，Tempo
              技术上有差异化，商业目标也明确，但集中度、快速协议变动和公开安全保证证据不完整，仍带来实质架构风险。
