      - - Coinbase
        - 2025 年 Q3 总收入 $1.87B；稳定币收入 $354.7M；区块链奖励 $184.6M
        - 上市公司 / 已披露多元化货币化基准
        - 展示规模化链上货币化在公开申报和股东材料中的样子
        - 交易所、托管和交易业务组合明显宽于 Tempo 计划采用的模式。
    notes: 选取 2025-2026 年已披露锚点；本表只部分列举有用的估值或披露基准，不穷尽所有加密或支付基础设施公司。
