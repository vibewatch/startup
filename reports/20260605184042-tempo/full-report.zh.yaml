      - number: '7.2'
        title: 治理、验证者集中度与关联方敞口
        blocks:
          - type: paragraph
            body: >-
              最重要的治理风险在于，Tempo 的去中心化叙事仍是未来式，而当前运营模式刻意保持中心化。Paradigm 的发布文章称，Matt Huang 将在继续领导 Paradigm 的同时领导
              Tempo，这让他既是公司的公开战略面孔，也是 Tempo 与两家孵化方之一之间的桥梁。Tempo 的验证者文档说明了这件事在运营上为何重要：新的验证者仍需向 Tempo
              团队提交注册信息，必须由团队在链上添加；在某些情况下，身份轮换或恢复工作流仍需与团队协调。公开报道显示，验证者集合如今包括 MoneyGram、Visa、Stripe 和 Zodia
              等真实机构，这增强了信心，但也让集中度风险更尖锐，因为这些机构同时支撑信誉、合规观感和业务拓展。CoinDesk 对 Visa
              的采访尤其说明问题：目标不是最大化去中心化，而是打造一个大型企业认为足够快、足够可控、可以使用的支付系统。这在商业上也许合理，但投资者承销的系统，其韧性、审查姿态、应急权力和关联方治理，仍比营销表层更不透明。
