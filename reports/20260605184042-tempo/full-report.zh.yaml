  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 企业付款轨道
        - 面向承包商、商户、联盟伙伴、创作者和卖家的全球付款；围绕这些资金流的编排、出入金、合规和对账
        - 从不触及稳定币结算的通用薪资软件或银行 API
        - 付款负责人、市场平台 GM、CFO 办公室、支付运营
        - 这是 Tempo 最干净的切入点之一，因为痛点可见，ROI 可衡量
      - - 跨境 B2B 结算
        - 供应商付款、公司间转账、进出口结算、资金调拨和走廊流动性运营
        - 不执行或管理稳定币轨道的贸易金融软件、FX 平台或银行消息产品
        - 财资负责人、财务 VP、AP / AR 负责人、支付负责人
        - 捕捉稳定币通常最先瞄准的财资和营运资本预算
      - - PSP / 商户结算基础设施
        - 商户结算、稳定币支持的银行卡、嵌入式金融结算、付款引擎
        - 没有稳定币层的通用商户软件、结账 UX 或收卡工具
        - 首席产品官、支付负责人、结算或平台工程预算
        - 相关性在于，PSP 可以聚合大量支付量，并把 Tempo 式轨道分发给许多商户
      - - 薪资 / 劳动力发放轨道
        - 雇主注资、承包商和员工付款、嵌入式钱包、薪资资金管理控制
        - 不具备跨境或稳定币功能的国内 HRIS 模块
        - 薪资 GM、运营负责人、财资、人力运营财务赞助人
        - 这是重要的相邻切入点，稳定币可以解决时间、FX 和钱包访问痛点
      - - 排除的更广泛加密活动
        - 只有支持支付或结算运营的软件才应计入
        - 投机交易、DeFi 流动性供给、质押、通用加密托管，以及脱离商业的原始转账量
        - 加密交易者、交易所或投资者
        - 需要把 Tempo 的市场边界收窄到低于所有稳定币或区块链活动
    notes: 边界从全部稳定币活动收窄到以稳定币作为结算或付款轨道、且买方拥有运营预算的业务工作流。
