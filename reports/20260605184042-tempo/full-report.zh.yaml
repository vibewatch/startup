  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，Tempo 先靠解决一个棘手结算问题拿到关注，再用咨询支持、基础设施伙伴和通道扩展把该工作流包起来。
    approximationNotes: 图中抽象整合 DoorDash、MoneyGram、Flutterwave、Stripe 和 Kraken 材料，而不是复刻某一家公司的具体实施顺序。
    data:
      items:
        - label: 识别痛点
          actor: 支付负责人 / 司库 / 平台总经理
          touchpoints:
            - 跨境结算慢
            - FX 和中介成本高
            - 对账困难
            - AI 微计费受限
          painpoint: Existing rails are too slow, opaque, or expensive for the target workflow.
          opportunity: >-
            Tempo is pitched as a payments-first chain with predictable fees, dedicated payment lanes, and structured
            payment metadata.
        - label: 界定用例
          actor: 支付运营 + 合规 + 工程
          touchpoints:
            - 稳定币咨询
            - 解决方案架构
            - 托管与合规设计
            - 出入金伙伴选择
          painpoint: Enterprises rarely have in-house stablecoin architecture expertise.
          opportunity: Tempo sells a high-touch deployment playbook instead of just raw blockchain access.
        - label: 在测试网或设计阶段验证
          actor: 产品与基础设施团队
          touchpoints:
            - 设计伙伴反馈
            - 测试网工作负载验证
            - 验证者接入
          painpoint: Payment teams need proof of throughput, reliability, and operational fit before production.
          opportunity: Tempo used launch and testnet partners to validate real workloads before mainnet.
        - label: 在基础设施界面上线
          actor: 基础设施与支付运营方
          touchpoints:
            - 公共 RPC
            - Stripe 中的 Tempo 网络支持
            - Visa 验证者节点
            - Kraken 存取款
            - Alchemy MPP 计费
          painpoint: A chain must be reachable through real operator infrastructure before enterprise flows can ship.
          opportunity: The strongest public proof today is live infrastructure and operator integrations.
        - label: 扩展支付流
          actor: 资金管理、客户成功和业务负责人
          touchpoints:
            - DoorDash 付款
            - MoneyGram 结算
            - Flutterwave 通道
            - Stripe 流式支付
          painpoint: Initial success must translate into more corridors, products, and recurring usage to matter economically.
          opportunity: >-
            Tempo’s public story is explicitly about land-and-expand from one painful flow into a broader payments
            footprint.
        - label: 评估持久性
          actor: 投资人或采购委员会
          touchpoints:
            - 留存指标
            - 集中度数据
            - 成果研究
            - 试点到生产转化
          painpoint: Public proof of deployment is stronger than public proof of renewals, expansion economics, or concentration.
          opportunity: The next refresh should test whether early relationships convert into durable, measurable customer value.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
      - CU041
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 公开可见路径从明星设计伙伴披露开始，经测试网验证、主网就绪、基础设施正式启用，最后进入一小批具名生产部署。
    approximationNotes: 这个漏斗综合了发布、测试网、主网、验证者和合作伙伴案例披露，而不是公司发布的实际 CRM 漏斗。
    data:
      nodes:
        - id: n1
          label: 明星设计伙伴
          detail: 发布披露建立了一个覆盖 AI、商业、银行和金融科技的广泛名单。
        - id: n2
          label: 测试网验证
          detail: 公开测试网带来第二波伙伴，并声称验证了真实支付工作负载。
        - id: n3
          label: 主网与公共 API
          detail: Tempo 主网上线时提供公共 RPC 访问、MPP 和 100+ 服务目录。
        - id: n4
          label: 基础设施运营方上线
          detail: 验证者、Stripe 网络支持、Kraken 支付轨道支持和 Alchemy 计费，证明运营方基础设施已可部署。
        - id: n5
          label: 具名流程进入生产
          detail: DoorDash、Stripe、ARQ、Coastal、MoneyGram 和 Flutterwave 提供最清楚的公开落地证据。
        - id: n6
          label: 持久性证明缺口
          detail: 客户数、续约、集中度和已实现结果数据仍大多未公开。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU017
      - CU018
      - CU035
  - id: FU003
    title: 客户证明矩阵
    type: matrix
