      - number: '6.2'
        title: 采用轨迹与已经真正上线的内容
        blocks:
          - type: paragraph
            body: >-
              Tempo 的采用时间线有意义，因为它不只是公告戏码。2025 年 9 月建立了最初设计伙伴集合。12 月测试网证据显示了更大的第二波伙伴，并声称验证了真实支付工作负载。2026 年 3 月主网开放公共 RPC
              接入，并推出 MPP 和 100+ 服务支付目录。主网上线后，证明点从品类定位转向基础设施激活：Stripe 增加 Tempo 作为加密支付网络选项，Visa 在六个月共同工作后上线内部验证者，Tempo
              称验证者伙伴已经在测试真实工作负载。最强的公开生产信号不再只是“大名字正在帮助塑造这条链”，而是部分运营者正在把产品和基础设施接到 Tempo 上。Tempo 自己的企业页面称设计伙伴正在把支付流带入生产，并点名
              Stripe、DoorDash、Coastal 和 ARQ 作为早期例子。这仍未达到披露交易量或收入的程度，但明显强于主网上线前的标识墙。
