      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自运营，而不是意识形态。调查和供应商数据一致指向更快结算、更低 FX 和代理行漏损、全天候流动性，以及更好的资金可见性，这些才是企业关心的原因。Tempo 和 Fireblocks
              的案例说明了为什么：结算时间长、营运资金被困、手工对账、异常处理昂贵，都会直接转化为利润率和客户体验。监管在某些场景中也正变成净正面因素，因为储备规则、牌照和 AML
              工具让严肃买方更容易采购。但约束仍然实质存在。BIS、Fed、ECB、Bank of England 和 SEC
              都强调，支付稳定币只有在储备质量、赎回权、法律权利主张和运营控制可信时，才能规模化运转。买方仍面对与 ERP
              集成、会计和税务处理、钱包和托管设计、出金流动性、本地劳动或支付规则绑定的切换成本。既有玩家也保留分发优势：卡组织、银行和 PSP 往往能成为采用的第一路径，这意味着 Tempo
              仍需要合适伙伴和信任架构，才能捕获企业工作负载，而不只是验证这个品类。
