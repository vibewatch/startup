        - label: 证据质量
          value: 2
          note: 足以搭情景框架，但不足以支撑高确信度定价。
    approximationNotes: 分数是基于保留证据综合得出的 1-5 顺序判断，用于委员会讨论，不用于机械配置组合。
    claimRefs:
