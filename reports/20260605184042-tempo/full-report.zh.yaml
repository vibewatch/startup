  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 应用、钱包和托管前端
        - 发起支付、显示余额，并抽象 Tempo 专属交易逻辑
        - 钱包支持必须压住原生余额假设，并处理费用代币选择
        - 通用 Ethereum 钱包可能误处理无原生代币语义或默认费用行为。
      - - Tempo Transactions 层
        - 加入赞助、批处理、调度、passkey 和并发 nonce 通道
        - 要求 SDK 和钱包支持 Tempo 专属交易类型
        - 相较普通 EVM 链，自定义类型交易会增加集成工作量。
      - - TIP-20 + TIP-403 代币层
        - 定义稳定币发行、备注、RBAC、奖励和转账策略
        - 发行方必须管理策略注册表、角色和费用流动性路由
        - 策略配置错误或代币暂停，可能打断跨应用和 Zone 的支付流。
      - - Fee AMM / 稳定币 DEX
        - 把用户支付的费用转成验证者偏好的代币，并支持稳定币兑换
        - 依赖有流动性的 USD TIP-20 池，以及正确的验证者 / 用户费用代币偏好
        - 流动性薄或路由变化，可能削弱费用代币灵活性和执行质量。
      - - Reth EVM 执行和 RPC 接口
        - 运行合约，并暴露兼容 Ethereum 的工具
        - 依赖 Reth、gas 估算调整和 Tempo 专属费用语义
        - 更高的状态创建成本和自定义费用处理，可能让通用 EVM 集成踩坑。
      - - Simplex / Commonware 共识
        - 用 BFT 语义确定区块和支付排序
        - 有限验证者集、DKG 仪式、节点互联和 epoch 切换
        - 委员会集中或 DKG 失败会直接影响活性和抗审查能力。
      - - 合作伙伴 RPC / 验证者 / 托管基础设施
        - 提供托管验证者、专用端点、数据流和钱包
        - Blockdaemon、BitGo 等外部供应商承担关键运营暴露面
        - 企业采用可能依赖少数基础设施供应商。
      - - Zones 和隐私运营方
        - 运行私有并行链，并执行可见性 / 纳入模型
        - 运营方正确执行、Tempo 主网托管合约和签名 RPC 认证
        - 用户能对公众隐藏隐私，但必须信任运营方能守住可用性和保密边界。
    notes: 这张架构表把协议原生组件和链下基础设施假设放在一起；这些假设已明确写入 Tempo 的公开集成材料。
