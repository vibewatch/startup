              关键尽调任务是精确分类每个明星名字。Stripe 的生产证据最清楚：Tempo 称 Stripe 在资金管理能力中使用这条链，Stripe 也分别宣布了 Tempo 支持的流式支付和加密网络支持。DoorDash
              有公开案例研究和企业概览，称 Tempo 支撑的付款流正在进入生产，但没有通道交易量。MoneyGram 有作为首个汇款验证者、以及与 Stripe
              计划上线结算流的公开证明，同样没有通道指标。Flutterwave 和 Tempo 更明确地表示集成尚未完全上线：双方描述了计划中的 wallet-to-wallet USDC 和 USDT
              结算，并称团队正在推动进入生产。Kraken 作为基础设施已经上线，支持基于 Tempo 的 USDT0 和 USDC.e 存取。Visa
              也已经上线，但身份是验证者基础设施，而不是已披露的客户交易流。相比之下，OpenAI、Anthropic、Shopify 和 Deutsche Bank 仍是公开设计伙伴，在审阅范围内没有独立部署证明。
