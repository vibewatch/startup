      - number: '3.4'
        title: 护城河耐久性、替代品与反向证据
        blocks:
          - type: paragraph
            body: >-
              Tempo 的护城河有希望，但尚未定局。乐观观点很直接：想要 EVM
              可迁移性、确定性结算、稳定币计价费用、支付元数据和发行方政策控制的企业，很难找到很多把这些特征打包进一个产品的直接替代品。悲观观点则是品类趋同。Base 继续改进最容易的 Coinbase 背书 EVM
              路径。Solana 和 XRPL 已有很强的公链支付可信度。Stellar 仍是一条经验证的跨境和资产发行轨道。Circle 和 Plasma
              说明，垂直对齐生态可以优先支持自家资产，同时仍赢下分发。Fireblocks 和 Bridge 说明，编排供应商可以拥有实施层，让底层链更难差异化。

              最深的替代品根本不是另一条加密网络。BIS、IMF、Federal Reserve 和 RBA
              都把投资人指向同一个问题：如果机构主要想要可编程、合规、受监管的结算资产，代币化商业银行货币和存款挂钩系统可能完成其中一部分任务，而不需要风险委员会采用新的公共或半公共结算链。这不等于 Tempo
              不相关；它意味着 Tempo 的最佳匹配买方比泛稳定币故事更窄。客户重视开放网络触达、可组合性和链级支付专业化时，Tempo 最强；买方只想要更安全的银行负债、中立编排层，或现有分发更大的主流公链时，Tempo
              最弱。
