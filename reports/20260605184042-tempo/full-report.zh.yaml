      - number: '5.2'
        title: L1 架构、执行与验证者模型
        blocks:
          - type: paragraph
            body: >-
              Tempo 的核心架构是一条定制的支付导向 L1，保留 Ethereum 开发者体验，同时改写若干经济和运营假设。执行层兼容 EVM，兼容 JSON-RPC，并面向
              Solidity、Hardhat、Foundry 和标准钱包流程。关键偏离在于，Tempo 没有原生 gas 代币，用 USD 计价的 TIP-20 稳定币定价费用，并采用固定收费模型，而不是 EIP-1559
              式可变基础费。专用支付通道为支付转账预留区块空间，Fee AMM 则以固定汇率在用户和验证者偏好的费用代币之间转换。共识采用基于 Commonware 的 Simplex BFT，公开文档描述约 0.5
              秒终局性，测试网基准为 20,000 TPS，同时营销材料讲 100K+ 规模。不过，验证者参与仍有结构性边界：公开测试网从 4
              个团队运行验证者开始，合作伙伴验证者之后加入，无许可运行仍是路线图方向，而不是已完整落地的当前状态属性。
