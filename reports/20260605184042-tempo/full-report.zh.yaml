  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重度
      - 缓释措施 / 尽调问题
    rows:
      - - EVM、稳定币 gas 与确定性结算
        - Base 具备同等 EVM 可迁移性，编排厂商也能把 gas 处理和链选择抽象掉
        - 高
        - 验证 Tempo 胜出的原因：客户是真的需要某条链的支付特性，还是只需要更省心的稳定币编排
      - - 邀请制、企业友好的验证者模型
        - 买方可能把该模型视为中心化；若验证者经济模型或实时可靠性证据不足，抵消力度不够
        - 中
        - 索取验证者名单、在线率历史和经济模型，证明有边界的治理是功能优势，而不是妥协
      - - 企业设计伙伴和顾问模式
        - 已点名合作伙伴并不等于规模化经常性交易量，也不证明相对 Coinbase、Circle 或银行渠道拥有更广分发
        - 高
        - 获取已点名部署的实时交易量、续约和客户集中度数据
      - - 稳定币中立姿态
        - Circle 和 Plasma 可以借自有资产绑定加速生态采用，Fireblocks 和 Bridge 则无需新链就能出售中立性
        - 高
        - 展示发行方组合、资产多样性，以及中立链为何比中立 API 层能承接更高价值工作负载
      - - 代币化存款支持
        - 银行发行的代币化存款可能满足审慎型买方，无需让他们采用新的结算链
        - 高
        - 梳理哪些用例确实需要开放网络触达，哪些可能留在银行主导的轨道内
      - - 面向支付的协议功能
        - 公链和基础设施厂商可以逐步补上备注、策略控制或费用抽象，压缩功能差异
        - 中
        - 量化 Tempo 原生功能带来的达产速度、集成成本和留存优势，而不是服务包装带来的优势
    notes: 严重度衡量的是 Tempo 差异化的承保风险，并不表示任何对手一定会赢；核心未知是客户有多看重专用支付链，而不是编排工具或银行替代方案。
