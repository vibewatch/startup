        - 要求按客户披露头部账户交易量占比，以及试点转扩张的转化率
      - - Stripe 分发与产品嵌入
        - Stripe 既是赞助方又是渠道，Tempo 可能对其高度依赖
        - 嵌得深，上行很强；若 Stripe 交易量有限或迁往别处，下行也不小
        - 披露可归因于 Stripe 的 Tempo 交易量、客户数和毛利
      - - 汇款与非洲走廊扩张
        - MoneyGram 和 Flutterwave 仍处早期，走廊铺开可能卡住
        - 如果这些参考走廊保持狭窄或停在生产前，跨境论点会变弱
        - 要求逐条走廊披露上线日期、活跃发送量和单位经济性
      - - 验证者与基础设施可信度
        - 验证者能证明信任，不一定证明产生收入的客户使用
        - 投资者可能把基础设施采用过度解读为客户变现
        - 在尽调材料中拆开验证者、集成和付费客户 KPI
      - - AI 与机器支付论点
        - OpenAI 和 Anthropic 仍停留在设计伙伴名义上，缺少公开部署证据
        - 如果头部实验室不上线，AI 上行叙事可能跑在真实需求前面
        - 要求已签署的 AI 客户证明、MPP 会话量和重复使用数据
      - - 咨询驱动的 GTM
        - 规模化可能需要大量解决方案工程和伙伴协调
        - 复杂交易的成交率可以更高，但销售周期更慢、销售效率更低也会并存
        - 提供从咨询到生产的转化率、部署时长，以及服务与软件的收入结构
    notes: 扩张驱动真实存在，但每条可见增长线仍需要私下尽调集中度、交易转化和部署深度。
