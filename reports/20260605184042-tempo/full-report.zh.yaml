  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与司法辖区风险
        blocks:
          - type: paragraph
            body: >-
              Tempo 的核心投资逻辑，押注受监管稳定币会在主要市场成为可接受的支付资产；但公开规则手册说明，“更清晰”不等于“无摩擦落地”。在美国，GENIUS
              框架把发行主体收窄到获准发行方，并要求全额储备、赎回流程、AML / 制裁控制，以及明确的阻断或冻结能力。这意味着 Tempo 可用资产菜单的一部分，不只是技术接入问题，而是合规筛选问题。在欧盟，MiCA
              已经从抽象监管走向具体分销约束：ESMA 要求 CASP 停止便利投资者获取不合规的 ART 和 EMT，并把投资者导向合规替代品。英国、香港、UAE
              和日本也指向同一个方向：牌照、托管、赎回、储备治理和边界问题，已经成为规模化的闸门。严肃的企业买家会因此受益，但 Tempo
              也会继承各辖区之间的错配：发行方身份、稳定币类型、支付用例、跨境服务模式彼此未必对得上。结果是一项高严重度执行风险：Tempo
              即使技术上已经准备好，只要支持的发行方或工作流落在当地制度之外，仍可能失去走廊、商户或资金管理用例。
