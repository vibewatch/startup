      - number: '1.3'
        title: 资本结构、投资人和披露指标
        blocks:
          - type: paragraph
            body: >
              Tempo 的融资故事相对其类上市公司披露的单薄程度来说异常庞大。多家媒体报道，Tempo 在 2025 年 10 月完成 $500 million Series A，估值 $5 billion，由
              Greenoaks 和 Thrive Capital 领投，Sequoia、Ribbit Capital 和 SV Angel 也参投。报道还称 Stripe 和 Paradigm
              孵化了公司，但没有向这一轮投入新资金。这个区分很重要，因为它说明 Tempo
              进入首个可见机构融资轮时已经带着战略背书，而外部投资人在收入、客户数量或利润率公开前，就给独立业务定了很高价格。因此，最强的公开牵引信号都是间接的。Tempo 披露了 12
              个具名首批设计伙伴、主网上线时支付目录中 100+ 项服务、到 2025 年 12 月又有 40 个基础设施伙伴，以及 2026 年与 DoorDash、MoneyGram、Flutterwave、Kraken
              等的一系列伙伴激活。这些都是有意义的采用信号，但不能替代已确认收入或已签约客户数量。人员规模同样不完整：CoinDesk 报道上线时团队 15 人，但 2026 年当前人数并不公开。实际看，Tempo
              像一家资本充足、战略背书强、Series A 后的公司，商业动能通过生态里程碑可见，而不是通过传统经营 KPI 可见。
