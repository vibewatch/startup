  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手或替代方案
      - 类别
      - 规模或定位信号
      - 目标买方
      - 差异化
      - 相对 Tempo 的关键局限
    rows:
      - - Tempo
        - 参照公司
        - Stripe 和 Paradigm 孵化；已点名企业设计合作伙伴；声称有 50+ 基础设施合作伙伴
        - 企业支付团队、银行、金融科技公司
        - 稳定币支付 gas、EVM 可移植性、确定性亚秒级结算、代币化存款支持
        - 仅限邀请的验证者模型和实时经济性，比成熟公链对手更不透明
      - - Solana
        - 直接公链对手
        - 2025 年稳定币交易量 $1T+；Visa 技术背书
        - 优先看重公链速度和流动性的金融科技公司与支付开发者
        - 公链结算快、费用低于 1 美分、稳定币活动强
        - 公链运营模型和原生资产经济性，不如 Tempo 贴合有边界的企业治理
      - - Base
        - 直接公链对手
        - Coinbase 孵化；声称有 1,000+ 家企业
        - Coinbase 生态开发者、消费者应用、美国金融科技公司
        - EVM 可移植性，加上 Coinbase 分发和机构信任
        - 经济终局性更慢，且仍依赖排序器 / Ethereum
      - - Stellar
        - 既有支付网络
        - 声称覆盖 90+ 个现金出入金国家，平均结算 9.5 秒
        - 跨境金融科技公司、钱包和代币化开发者
        - 锚点、资产发行，以及支付优先的网络身份
        - 对已标准化采用 Solidity 或 EVM 工具的团队，Ethereum 可移植性较弱
      - - XRPL / Ripple
        - 既有支付网络
        - 声称 10+ 年无错误运行历史；稳定币覆盖广泛扩张
        - 企业支付、发行方和流动性导向开发者
        - 低成本结算、内置 DEX、合规优先功能、稳定币集合扩大
        - XRP 仍是基础流动性和费用资产，削弱了 Tempo“无波动 gas”的对比点
      - - Circle CPN + Arc
        - 相邻全栈基础设施
        - 机构支付网络，加上 Arc Layer 1 与 Circle Gateway 集成
        - OFI、BFI、银行和以 USDC 为中心的全球支付运营商
        - 单一集成、USDC 流动性、重合规工作流、全栈产品套件
        - 更垂直绑定 Circle 生态，而非发行方中立的多链结算
      - - Fireblocks + Bridge
        - 相邻编排替代方案
        - Fireblocks 接入 40+ 稳定币提供商和 60+ 货币；Bridge 定位为端到端 API 平台
        - 想要编排、托管或发行、但不想先选定一条链的企业
        - 链中立连接、嵌入式合规、编排 API、更快落地路径
        - 可能把底层链抽象掉，把 Tempo 的核心结算层商品化
      - - Plasma / Tether 阵营链
        - 垂直绑定的稳定币链对手
        - 专为稳定币打造的网络，分阶段推出验证者
        - USDT 占比高且想要专用支付链的应用和运营商
        - 稳定币优先定位，以及秒级 BFT 式终局性
        - 可信启动验证者模型一开始就不如 Tempo 的发行方无关叙事中立
      - - 银行发行的代币化存款
        - 替代方案 / 现状升级
        - BIS 和 IMF 政策框架偏好的架构；Federal Reserve 讨论过银行回应
        - 优先考虑审慎监管舒适度的银行、司库和受监管机构
        - 受监管负债、既有银行关系和熟悉的监管框架
        - 开放网络互操作性和多机构可组合性弱于 Tempo 的价值主张
    notes: 各行比较直接链、相邻基础设施供应商，以及最可信的受监管替代方案；企业合同定价和实时支付量往往不公开。
