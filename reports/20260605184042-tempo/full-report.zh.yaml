        - 示例性退出股权价值为 $14B-$24B；若稀释受控且退出倍数保持溢价，按 $5B 入场价计算，费用前总回报约 2.8x-4.8x。
        - 执行几乎不能出错；如果过度建设却没有货币化，或市场倍数重置，投资逻辑就会破裂。
        - 需要在 2027-2028 年前披露生产队列、留存和费率证据。
      - - 基准
        - Tempo 交付可信基础设施并赢得部分真实流量，但货币化落后于 logo 叙事，经济性更像编排而非软件。
        - 示例性退出股权价值为 $6B-$11B；取决于稀释和退出倍数，总回报约 1.2x-2.2x。
        - 客户转化、费率压缩和更长的企业销售周期都可能让回报保持平庸。
        - 与技术进展强劲但商业证明不完整的状态一致。
      - - 熊市
        - 已具名伙伴停留在试点，支付量无法转化为有吸引力的净收入，公共或战略估值倍数在风险规避的加密周期中压缩。
        - 示例性退出股权价值为 $2B-$6B；稀释后总回报约 0.4x-1.2x，并存在永久资本损失的真实风险。
        - 周期风险、受监管银行替代和费用捕获疲弱，会叠加在私营公司不透明之上。
        - 缺少货币化证据、通道推进更慢或出现降轮环境时触发。
    notes: Tempo 是私营公司且收入未披露，所以情景只作示例；本表用来框定证明责任和回报数学，不是伪装成公开市场精确预测。
    claimRefs:
      - CV023
      - CV025
