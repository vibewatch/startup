      - number: '3.2'
        title: 能力、终局性与架构对比
        blocks:
          - type: paragraph
            body: >-
              技术架构上，Tempo 对自己要解决的支付问题讲得异常明确。官方材料强调稳定币支付 gas、专用支付通道、结构化支付元数据、代币化存款支持，以及在邀请制验证者模型上的确定性亚秒结算。这套栈在开发者可迁移性上最接近
              Base，因为两者都面向 EVM，但 Base 继承了排序器和 Ethereum 结算取舍，使更强的经济终局性被拉长到分钟级，而不是 Tempo 宣称的确定性亚秒结算。Solana
              是最强的纯性能型对手：其支付指南引用约 400 毫秒结算、低于 1 美分费用，以及 2025 年超过 $1 trillion 稳定币量；Visa 也强调其已展示的高吞吐和低成本可预测性。但 Solana
              仍是公共加密网络，而不是边界清楚的企业验证者集合。

              Stellar 和 XRPL 更接近合规导向的支付传统。Stellar 强调锚点机构、资产发行和验证者运营，同时配合低费用和全球支付出入金通道；XRPL
              强调业务可靠性、低成本结算、内置流动性，以及面向受监管资产的合规优先扩展。与此同时，Plasma 提供另一种围绕 Fast HotStuff 式共识和分阶段验证者推出构建的稳定币原生架构。因此，Tempo
              最清楚的架构差异不是速度本身，而是速度加 EVM 可迁移性、稳定币计价费用、支付专用控制，并把这些打包成一条面向企业支付、有明确取舍的链。
