      - number: '8.3'
        title: 可比视角：已披露的战略价值存在，但商业化证明更关键
        blocks:
          - type: paragraph
            body: >-
              Tempo 最合适的公开可比组，不是一个干净的单一同行集合，而是稳定币基础设施 M&A、公开稳定币网络披露，以及多元化链上商业化基准的混合体。私营侧显示出真实战略价值：Mastercard 同意以最高 $1.8
              billion 收购 BVNK，Stripe 更早收购 Bridge 的报道价格约为 $1.1
              billion。这些交易支持一个观点：编排和结算基础设施可能具有战略重要性。但它们也提醒投资者，即使是有价值的基础设施业务，成交价格也可能明显低于 Tempo 据报道的 $5 billion
              标记。公开市场侧更有启发性。Circle 的 S-1 和 Coinbase 的股东信展示了当市场能够检查收入、储备收益、稳定币余额、区块链奖励和盈利能力时，已披露商业化长什么样。Tempo
              尚未提供这种披露水平。因此，可比结论是混合的：品类价值真实存在，但支持这个具体价格的公开证据仍然很薄，因为上市或被收购同行可见的商业化证明，比 Tempo 深得多。
