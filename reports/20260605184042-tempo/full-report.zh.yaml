      - number: '5.3'
        title: 开发者接口与集成假设
        blocks:
          - type: paragraph
            body: >-
              Tempo 的产品设计假设，开发者、钱包和支付运营商想保留 EVM 工具链，但不想围绕它重建支付基础设施。因此，Tempo Transactions 是核心架构接口，而不是边缘 SDK
              功能：它们在交易层直接加入费用代付、访问密钥和 passkeys、批处理、并发 nonce，以及排程执行。集成负担从编写定制合约和中继器，转向调整钱包逻辑，以适配费用代币选择、原生余额细节和 Tempo
              特定交易类型。公开 GitHub 材料、签名发布版本，以及 Blockdaemon、BitGo、Turnkey 的伙伴文档显示，生态已经围绕 Tempo 打包托管验证者、RPC
              端点、钱包流程和交易策略工具。这是企业接入的真实 GTM 优势，但也意味着运营模型高度依赖链下供应商——RPC 运营商、托管供应商、合规引擎和资金系统——持续与 Tempo 的定制支付原语对齐，而不是只支持泛
              Ethereum 行为。
