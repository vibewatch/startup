      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方证据首先指向已经承受跨境运营复杂度痛点的组织：平台型企业、PSP、赞助银行、资金管理重的企业、薪资平台，以及汇款或嵌入式金融应用。Fireblocks 和 EY
              都显示，跨境供应商付款、资金管理和子商户结算是企业最先优先考虑的用例之一。经济买方通常是支付负责人、司库、CFO
              办公室、负责付款或薪资的总经理，或掌握结算经济性的产品负责人；日常用户则横跨财务运营、资金管理、合规、支持和支付运营团队。因此，预算归属更常落在支付
              P&L、资金管理转型预算，或产品和基础设施预算里，而不是实验性加密团队。采用路径也比长期终点更清楚：公司先从一条高摩擦通道或一个付款工作流开始，借助编排伙伴避免第一天就自己承担所有钱包和牌照依赖，跑受控试点，再等对账、资金管理和合规流程在生产环境跑通后，扩展到更多通道和更多工作流。Tempo
              自己的企业案例与这个模式高度吻合。
