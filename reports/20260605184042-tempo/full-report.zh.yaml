  - id: TV005
    title: 论点破裂与清仓触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 缺少货币化证明
        - 未来 12 个月内没有披露实时年化支付量、已实现收入或费率证据
        - 没有收入证明，溢价倍数仍只停留在叙事层面
        - 不要按当前价格加仓；要求入场价大幅下调或披露硬 KPI。
      - - 伙伴转化疲弱
        - 到下一轮融资事件前，少于两个旗舰伙伴进入规模化付费生产
        - logo 组合会变成信号，而不是持久需求证明
        - 把伙伴公告视为营销，而非估值支撑。
      - - 费用捕获过低
        - 验证者、资金管理和结算经济性显示有吞吐量，但没有有吸引力的净收入
        - 如果经济性像公用事业，仅有高交易量无法支撑风险投资回报
        - 把 Tempo 重新定价到基础设施公用事业或编排层水平。
      - - 监管或银行瓶颈
        - 关键通道、托管伙伴或合规路径被延迟、受限，或变得依赖银行
        - 企业采用放慢，利润率向受监管中介转移
        - 大幅提高风险溢价，或直接退出。
      - - 周期驱动的倍数压缩
        - 风险规避周期中，公开加密 / 支付基础设施倍数或私募估值被下调
        - Tempo 证明规模前，退出路径支撑先消失
        - 要求大幅更低的入场价，或等待。
    notes: 清仓触发项是绑定证据和价格的投资纪律规则，不是对管理层会做或不会做什么的预测。
    claimRefs:
      - CV014
      - CV032
      - CV033
      - CV034
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 收入 / 支付量
        - 按产品或通道拆分的当前月度年化支付量、净收入、毛利率和费率
        - 这是任何 $5B 承销案例缺失的核心输入
        - 要求提供 CFO 数据室资料包和董事会批准的 KPI 材料。
      - - 客户转化
        - 已具名伙伴从设计伙伴到上线付费生产的漏斗，包括续约或流失数据
        - 把信号很强的 logo 与真实商业牵引区分开
        - 与 CRO 或 COO 复核 GTM 管线和队列级生产账户。
      - - 股权结构 / 优先级
        - 最新股权结构、清算优先权、参与权、二级出售、期权池、债务和代币认股权证
        - 优先级和稀释不明，可能抹掉上轮价格下的名义上行空间
        - 获取法律尽调资料包和最新融资文件。
      - - 验证者 / 资金管理经济性
        - 验证者、资金管理以及任何储备收益或结算参与方之间的费用分成
        - 决定交易量能否转化为有吸引力的股权经济性
        - 要求提供协议经济性备忘录和资金管理政策。
      - - 监管 / 银行依赖
        - 牌照、合规控制、制裁工具、银行伙伴、托管设置和通道特定约束
        - 机构采用更依赖这些控制，而不只是链上速度
        - 开展法律、合规和银行背调尽调。
      - - 退出路径
        - 潜在收购方、IPO 准备度、已审计控制和报告节奏
        - $5B 入场需要一条可信路径，通向规模大得多或战略意义很强的退出
        - 承销前与管理层和行业投行验证。
    notes: 在把上次报道估值视为可投资入场点前，这些尽调问题是最低资料包。
    claimRefs:
      - CV014
      - CV015
      - CV037
      - CV038
      - CV039
      - CV042
