    "title": "Risks",
    "summary": "Tempo’s public risk profile is dominated by regulatory fragmentation and deliberate centralization trade-offs, not by lack of ambition. Official docs and partner reporting show a permissioned, team-mediated validator model with heavy Stripe and Paradigm dependence, while U.S., EU, UK, Hong Kong, UAE, and Japan rules increasingly force licensed issuers, reserve discipline, and compliance controls. Tempo has credible security scaffolding, but public audit closure, bug-bounty clarity, validator concentration metrics, and production payment volume remain too incomplete to underwrite the network as a low-risk enterprise rail."
  },
