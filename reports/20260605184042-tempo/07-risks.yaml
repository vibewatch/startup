      "id": "security-protocol-and-operational-control-risk",
      "title": "Security, protocol, and operational-control risk",
      "body": "Tempo has more visible security scaffolding than many private crypto startups, but the public record still supports a material residual assurance gap. Official docs show the company leaning on specialist monitoring, screening, and reconciliation providers such as Blockaid, Chainalysis/Hexagate, Elliptic, TRES, and TRM Labs, and the GitHub repository shows supply-chain integrity work like signed releases and build provenance. Those are real positives. They are not the same thing as completed independent assurance on production code paths. GitHub still says Tempo is undergoing audit and does not have an active bug bounty, while the public VDP directory says safe harbor and rewards are not organization-attested. The external Kai report makes the residual risk concrete: it found one high-severity AccountKeychain flaw that could let expired access keys keep spending and one validator front-running weakness around address-based deactivation. Tempo can point to mitigations and a maturing disclosure surface, but the underwriting takeaway is simple: security maturity exists, yet the project is early enough that smart-contract correctness, validator controls, incident readiness, and researcher incentives are not fully de-risked by public evidence alone.",
