      "id": "regulatory-and-jurisdictional-risk",
      "title": "Regulatory and jurisdictional risk",
      "body": "Tempo’s core thesis depends on regulated stablecoins becoming acceptable payment assets across major markets, but the public rulebooks show that “more clarity” does not mean “frictionless rollout.” In the United States, the GENIUS framework narrows issuance to permitted issuers, forces full reserves, redemption procedures, AML/sanctions controls, and explicit blocking or freezing capability, which means Tempo’s usable asset menu is partly a compliance-screening problem rather than just a technical integration problem. In the EU, MiCA has already moved from abstract supervision to concrete distribution constraints, with ESMA telling CASPs to stop facilitating acquisition of non-compliant ARTs and EMTs and to wind investors toward compliant alternatives. The UK, Hong Kong, UAE, and Japan all point in the same direction: licensing, custody, redemption, reserve governance, and perimeter questions are now the gating items for scale. That helps serious enterprise buyers, but it also means Tempo inherits every jurisdictional mismatch among issuer status, stablecoin type, payment use case, and cross-border servicing model. The result is a high-severity execution risk: Tempo can be technologically ready and still lose corridors, merchants, or treasury use cases if its supported issuers or workflows fall outside a local regime.",
