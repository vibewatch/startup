- id: drivers-and-constraints
  title: Growth drivers versus constraints
  body: 'The strongest growth drivers are operational, not ideological. Surveys and vendor data consistently point to faster settlement, lower FX and correspondent-bank leakage, round-the-clock liquidity, and better treasury visibility as the reasons enterprises care. Tempo’s and Fireblocks’ examples show why: long settlement times, trapped working capital, manual reconciliation, and expensive exception handling all convert directly into margins and customer experience. Regulation is also becoming a net positive in some contexts because reserve rules, licensing, and AML tooling make procurement easier for serious buyers. But the constraint set remains material. BIS, the Fed, the ECB, the Bank of England, and the SEC all emphasize that payment stablecoins only work at scale when reserve quality, redemption rights, legal claims, and operational controls are credible. Buyers still face switching costs tied to ERP integration, accounting and tax treatment, wallet and custody design, off-ramp
    liquidity, and local labor or payment rules. Incumbents also retain distribution advantages: card networks, banks, and PSPs can often be the first path to adoption, which means Tempo still needs the right partners and trust architecture to capture enterprise workloads rather than simply validate the category.'
