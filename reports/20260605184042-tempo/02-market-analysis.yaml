  summary: Nested layers show why Tempo should be underwritten against the narrow payment-settlement slice, not the entire payments or onchain activity pool.
  data:
    nodes:
    - label: Global cross-border payments (2024)
      value: 1000
      detail: IMF parent market estimate; crypto remains a small fraction.
    - label: Raw stablecoin transfer volume (2024-2025)
      value: 30.3
      detail: Stripe 2024 and Morph/CoinLaw 2025 all-in transfer estimates.
    - label: Denoised aggregate stablecoin settlement
      value: 5.28
      detail: Castle Island/Visa annualized 1H24 settlement pace after de-noising.
    - label: Attributed payment settlements run rate
      value: 0.118
      detail: Artemis/Castle Island annualized Aug 2025 payment-settlement pace.
  approximationNotes: Values use a single $T annualized unit but represent progressively narrower methodologies, not a literal TAM/SAM/SOM waterfall.
