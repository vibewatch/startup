company:
  name: Tempo
chapter:
  number: 2
  title: Market Analysis
  summary: Tempo should be underwritten against the stablecoin payments infrastructure market, not against all crypto activity or the entire global payments stack. The usable public sizing lens spans from about $118 billion of bottoms-up attributed payment settlements to roughly $5.28 trillion of denoised stablecoin settlement and $27.6-$33 trillion of raw transfer volume, while the broader cross-border payments pool approaches $1 quadrillion. Buyers are typically heads of payments, treasury, finance, product, and compliance at marketplaces, PSPs, banks, and globally distributed employers; adoption is pulled by speed, FX and correspondent-cost compression, and clearer regulation, but constrained by trust, switching costs, off-ramp depth, and prudential scrutiny.
sections:
- id: market-boundary
  title: 'Market boundary: stablecoin payments infrastructure, not generic crypto'
  body: 'Tempo is best framed as infrastructure for stablecoin-native business payments rather than as a general-purpose blockchain or a proxy for all crypto activity. Tempo’s own positioning centers on real-world stablecoin payments, and its current use-case pages focus on global payouts, cross-border supplier payments, payroll, remittances, and tokenized-money movement. That boundary matters because broad stablecoin statistics still contain a large amount of trading, DeFi liquidity, and exchange settlement activity. ECB and Castle Island evidence both show why raw ecosystem numbers can mislead: stablecoins are critical to crypto-market liquidity, and even adjusted settlement data needs de-noising before it resembles payment activity. For diligence purposes, the included spend is software and infrastructure that helps enterprises move, reconcile, control, and comply around stablecoin flows across payouts, B2B settlement, treasury, payroll, and merchant or marketplace settlement. Excluded
    spend includes speculative trading volume, general crypto investing, and traditional payments software that never touches stablecoin issuance, onchain settlement, or related compliance and reconciliation workflows.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
- id: sizing-lenses
  title: 'Sizing lenses: a huge parent market, but a much narrower usable payments slice'
  body: 'The retained sources support a large opportunity, but they do not support a single clean Tempo TAM. At the broadest end, the IMF estimates that traditional plus crypto cross-border payments approached about $1 quadrillion in 2024, with crypto still only a small fraction of that total. At the next layer down, World Bank remittance data shows that legacy cross-border rails still carry meaningful friction, especially for smaller transfers and bank-led corridors. Below that, stablecoin estimates diverge sharply by methodology. Castle Island and Visa estimate denoised aggregate stablecoin settlement at a $5.28 trillion annualized pace in 2024; Stripe cites $27.6 trillion of 2024 stablecoin transfer volume; Morph and CoinLaw push 2025 rails volume to roughly $33 trillion; Artemis’s bottoms-up work attributes only about $118 billion of annualized payment settlements in August 2025. These figures are not directly comparable, but that mismatch is itself informative: Tempo’s real addressable
    market is much closer to the narrower business-payment layers than to raw onchain turnover. Public data is strong enough to bound the market, but not strong enough to publish a precise public SAM or SOM without internal corridor and customer-mix data.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
