- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Settlement speed and 24/7 availability
    - driver
    - near-term
    - Makes stablecoins attractive where cash-flow timing and user experience matter
    - Which corridors or workflows create the most visible wait-time pain today?
  - - Lower correspondent, FX, and exception-handling costs
    - driver
    - near-term
    - Creates measurable ROI for cross-border payments, payouts, and treasury
    - What fully loaded per-transaction cost does Tempo replace for pilot customers?
  - - Freed working capital and less trapped liquidity
    - driver
    - near-term
    - Strengthens treasury and intercompany-transfer use cases
    - How much prefunding or idle balance do target buyers currently carry?
  - - Regulatory clarity and reserve standards
    - driver
    - near-term
    - Makes enterprise procurement easier and reduces perceived category risk
    - Which target segments require bank-issued or charter-backed structures before purchase?
  - - ERP, treasury, and compliance tooling maturity
    - driver
    - near-term
    - Improves implementation readiness and shrinks time to pilot
    - Which integrations are already packaged versus custom?
  - - Demand for digital-dollar access in volatile markets
    - driver
    - medium-term
    - Supports payroll, remittance, and contractor payout adoption in specific corridors
    - Which recipient geographies see the highest FX and inflation pain?
  - - Regulatory fragmentation across jurisdictions
    - constraint
    - near-term
    - Slows enterprise rollout and forces corridor-by-corridor sequencing
    - Where do licensing, Travel Rule, or token classification rules still block launch?
  - - Trust, reserve, and redemption standards
    - constraint
    - near-term
    - Narrow compliant design window and raises vendor due-diligence burden
    - Which issuers, reserve assets, and redemption paths are acceptable to target buyers?
  - - Switching costs and systems integration
    - constraint
    - near-term
    - Finance teams must rework reconciliation, tax, accounting, support, and control processes
    - What is the true implementation cost beyond blockchain integration?
  - - Incumbent bank / card / PSP distribution power
    - constraint
    - medium-term
    - Could force Tempo to win through partners rather than direct displacement
    - Which incumbent relationships are blockers versus channels?
  - - Deposit disintermediation and prudential scrutiny
    - constraint
    - medium-term
    - May impose holding limits, charter requirements, and more conservative issuance structures
    - How do target jurisdictions treat business balances and systemic-scale issuance?
  - - Off-ramp liquidity and local compliance edge cases
    - constraint
    - medium-term
    - Weak local conversion or tax treatment can erase headline cost savings
    - Which pilot corridors actually have reliable off-ramps and payroll-grade compliance?
  notes: Drivers and constraints are tied to timing and to the enterprise teams that must approve, integrate, and operate stablecoin payment workflows.
