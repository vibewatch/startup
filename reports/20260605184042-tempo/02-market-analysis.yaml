- id: buyer-map
  title: Buyer, user, payer, and adoption path
  body: 'Buyer evidence points first to organizations already carrying painful cross-border operating complexity: marketplaces, PSPs, sponsor banks, treasury-heavy corporates, payroll platforms, and remittance or embedded-finance apps. Fireblocks and EY both show that cross-border supplier payments, treasury, and sub-merchant settlement are among the first use cases enterprises prioritize. The economic buyer is usually a head of payments, treasurer, CFO office, general manager for payouts or payroll, or a product leader who owns settlement economics; the day-to-day users span finance operations, treasury, compliance, support, and payment operations teams. Budget ownership therefore tends to sit in payments P&Ls, treasury transformation budgets, or product and infrastructure budgets rather than in experimental crypto teams. The adoption path is also clearer than the long-term endpoint: companies start with one high-friction corridor or payout workflow, use orchestration partners to avoid
    owning every wallet and licensing dependency on day one, run a controlled pilot, then widen into more corridors and more workflows only after reconciliation, treasury, and compliance processes work in production. Tempo’s own enterprise examples fit this pattern closely.'
