tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Enterprise payout rails
    - Global payouts to contractors, merchants, affiliates, creators, and sellers; orchestration, on/off-ramp, compliance, and reconciliation around those flows
    - Generic payroll software or banking APIs that never touch stablecoin settlement
    - Head of payouts, GM marketplace, CFO office, payments operations
    - One of the cleanest Tempo wedges because pain is visible and ROI is measurable
  - - Cross-border B2B settlement
    - Supplier payments, intercompany transfers, import/export settlement, treasury movement, and corridor liquidity operations
    - Trade finance software, FX platforms, or bank messaging products that do not execute or manage stablecoin rails
    - Treasurer, VP Finance, AP/AR leadership, head of payments
    - Captures the treasury and working-capital budget that stablecoins often target first
  - - PSP / merchant settlement infrastructure
    - Merchant settlement, stablecoin-backed cards, embedded finance settlement, payout engines
    - General merchant software, checkout UX, or card acceptance tools with no stablecoin layer
    - Chief Product Officer, head of payments, settlement or platform engineering budget
    - Relevant because PSPs can aggregate large payment volume and distribute Tempo-like rails to many merchants
  - - Payroll / workforce disbursement rails
    - Employer funding, contractor and employee payouts, embedded wallets, payroll treasury controls
    - Domestic HRIS modules without cross-border or stablecoin functionality
    - Payroll GM, operations lead, treasury, people-ops finance sponsor
    - Important adjacent wedge where stablecoins solve timing, FX, and wallet-access pain
  - - Excluded broader crypto activity
    - Only supporting software for payment or settlement operations should count
    - Speculative trading, DeFi liquidity provision, staking, general crypto custody, and raw transfer volume divorced from commerce
    - Crypto traders, exchanges, or investors
    - Needed to keep Tempo’s market boundary narrower than all stablecoin or blockchain activity
  notes: Boundary narrows from all stablecoin activity to business workflows where stablecoins are the settlement or payout rail and where buyers own operating budgets.
