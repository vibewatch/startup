- id: FM004
  title: 'Adoption funnel: from corridor pain to scaled production'
  type: flow
  layout: wide
  summary: Enterprise adoption usually starts with one painful corridor, then widens only after treasury, support, and compliance processes are operational.
  data:
    nodes:
    - label: Identify one high-friction corridor
      detail: Start where delays, FX spreads, or payout complaints are already measured.
    - label: Choose orchestration or in-house model
      detail: Most enterprises begin with partners that handle liquidity, custody, and compliance.
    - label: Run a limited pilot
      detail: Operate stablecoin flows alongside incumbent rails for about 60 days.
    - label: Integrate treasury, reconciliation, and controls
      detail: Harden SLAs, support playbooks, ERP mapping, and compliance workflows.
    - label: Expand to more corridors and workflows
      detail: Broaden from payouts into treasury, payroll, or merchant-settlement use cases.
  approximationNotes: Sequence is synthesized from Tempo’s implementation guidance and enterprise examples; it represents the dominant operating path rather than a strict product requirement.
