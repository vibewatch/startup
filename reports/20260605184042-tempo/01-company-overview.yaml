  evidenceGaps:
    - type: missing-source
      severity: material
      topic: headquarters-and-legal-entity
      missingEvidence: "An official legal entity name, registered address, and incorporation record for Tempo."
      whyItMatters: "Jurisdiction, contracting, regulatory scope, and entity diligence cannot be completed from public marketing surfaces alone."
      diligencePath: "Request the certificate of incorporation, registered-agent address, and any terms-of-service or legal pages that identify the contracting entity."
      relatedQuestionRefs: [QO004, QO005]
    - type: private-evidence-only
      severity: material
      topic: leadership-and-governance-disclosure
      missingEvidence: "Board roster, committee structure, investor-rights summary, and any conflict-management framework covering Matt Huang's dual role."
      whyItMatters: "Key-person risk, related-party oversight, and governance quality cannot be assessed from validator-roadmap disclosures alone."
      diligencePath: "Request the board list, governance charter, investor-rights summary, and any written conflict policy covering Paradigm and Stripe relationships."
      relatedQuestionRefs: [QO007, QO008]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-and-traction-metrics
      missingEvidence: "Revenue, gross margin, customer count, volume by corridor, current headcount, and any audited or reviewed financial statements."
      whyItMatters: "The round size and valuation cannot be pressure-tested without evidence on actual operating performance or customer conversion."
      diligencePath: "Request a KPI pack covering revenue, gross profit, customer concentration, volume growth, current headcount, and cash runway."
    - type: missing-source
      severity: material
      topic: series-a-primary-documents
      missingEvidence: "An official company or investor announcement, term sheet summary, or filing confirming the Series A size, valuation, and rights."
      whyItMatters: "The public funding narrative currently rests on secondary reporting, which is adequate for context but weak for diligence-grade ownership analysis."
      diligencePath: "Request the financing announcement deck, cap-table snapshot, and preferred-share terms from the company or lead investors."
      relatedTableRefs: [TO003]
    - type: enumeration-incomplete
      severity: material
      topic: public-leadership-and-ownership-enumeration
      missingEvidence: "A full public leadership roster and a complete shareholder map that goes beyond incubators and named Series A participants."
      whyItMatters: "The leadership and stakeholder tables are intentionally partial because public sources do not cover the full org chart or capitalization structure."
      diligencePath: "Request an executive org chart, a full cap table, and the current board observer list."
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002, TO003]
