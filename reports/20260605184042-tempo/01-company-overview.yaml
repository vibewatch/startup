schemaVersion: "report-v2"
artifact: company-overview
slug: tempo
runDate: "2026-06-05"
company:
  name: Tempo
chapter:
  number: 1
  title: Company Overview
  summary: >
    Tempo is a payments-first Layer 1 blockchain jointly incubated by Stripe and Paradigm and led publicly by Paradigm
    co-founder Matt Huang. Official sources support a September 2025 public launch, a December 2025 public testnet,
    and a March 2026 mainnet plus Machine Payments Protocol launch, while secondary reporting pegs the October 2025
    Series A at $500 million and a $5 billion valuation. Third-party profiles place the company in San Francisco, but
    Tempo still does not publish a legal address, board roster, cap-table terms, revenue, customer count, or audited
    financials, making governance concentration and regulatory execution central diligence issues.

sections:
  - id: identity-and-founding-story
    title: Identity, product, and founding story
    body: >
      Tempo presents itself as a blockchain built for real-world payments via stablecoins rather than as a general-purpose
      crypto network. The official launch narrative is consistent across Tempo and Paradigm: Stripe contributed payments
      operating experience, Paradigm contributed crypto infrastructure expertise, and the resulting company was built to
      solve specific workflow problems such as global payouts, remittances, tokenized deposits, and agentic micropayments.
      The product pitch emphasizes stablecoin-denominated gas, dedicated payment lanes, built-in memo fields, and EVM
      compatibility on top of Reth, all of which are meant to make payment operations more predictable than on trading-led
      chains. Public evidence is clearer about the product than about the legal entity. Tempo's own site does not publish a
      street address or incorporation record, but Built In and F6S both place the company in San Francisco. Likewise,
      official material clearly shows a September 2025 public launch window, while the exact legal founding date remains
      opaque. That means the best-supported founding story is operational rather than corporate: Tempo is a newly launched,
      jointly incubated payments chain whose go-to-market is being validated through enterprise design partners and
      infrastructure providers rather than through disclosed financial results.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008, CO009, CO010, CO011, CO012, CO044]
    figureRefs: [FO002]

  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person dependence
    body: >
      Public leadership disclosure is narrow. The clearest official governance fact is that Matt Huang said he would lead
      Tempo while continuing to lead Paradigm alongside Alana, which immediately makes him the key external face of the
      company, the bridge to one incubator, and the most visible interpreter of strategy to investors and partners. CoinDesk
      separately reported that Tempo launched with a 15-person team, underscoring how much narrative, fundraising, and
      strategic accountability are concentrated in a still-small organization. Tempo later strengthened technical credibility
      by bringing in Ethereum researcher Dankrad Feist, but that hire does not eliminate central-person risk; it redistributes
      some technical execution risk while leaving corporate governance largely undisclosed. Tempo is much more explicit about
      network governance than corporate governance. Official posts explain the path from four team-run validators on testnet
      to partner validators and eventually a permissionless validator set, but none of the public materials reviewed disclose
      a board roster, committee structure, voting rights, or preference stack. That asymmetry matters: the validator roadmap
      shows how the chain might decentralize, while the company behind it remains structurally opaque. For diligence, Matt
      Huang concentration and the absence of formal governance disclosures are the main leadership risks.
    claimRefs: [CO005, CO006, CO013, CO014, CO015, CO021, CO029, CO035, CO036, CO037]
    tableRefs: [TO002]

  - id: capital-investors-and-disclosed-metrics
    title: Capitalization, investors, and disclosed metrics
    body: >
      Tempo's financing story is unusually large relative to the thinness of its public-company-style disclosure. Multiple
      outlets reported that Tempo raised a $500 million Series A at a $5 billion valuation in October 2025, led by Greenoaks
      and Thrive Capital with Sequoia, Ribbit Capital, and SV Angel also participating. Those reports also said Stripe and
      Paradigm incubated the company but did not contribute fresh capital to the round. That distinction matters because it
      suggests Tempo entered its first visible institutional financing round with strategic sponsorship already in place,
      while outside investors priced the stand-alone business at a very high level before revenue, customer count, or margin
      disclosures were made public. The strongest public traction signals are therefore indirect. Tempo disclosed 12 named
      launch design partners, 100+ services in the payments directory at mainnet, 40 additional infrastructure partners by
      December 2025, and a series of 2026 partner activations with DoorDash, MoneyGram, Flutterwave, Kraken, and others.
      Those are meaningful adoption signals, but they are not substitutes for booked revenue or contracted customer counts.
      Headcount is similarly incomplete: CoinDesk reported a 15-person team at launch, but current 2026 headcount is not
      public. In practice, Tempo looks like a heavily capitalized, strategically sponsored, post-Series-A company whose
      commercial momentum is visible through ecosystem milestones rather than conventional operating KPIs.
    claimRefs: [CO007, CO013, CO016, CO017, CO018, CO019, CO028, CO030, CO031, CO032, CO033, CO042, CO043]
    tableRefs: [TO001, TO003]
    figureRefs: [FO003]

  - id: milestones-partners-and-risk-context
    title: Milestones, design partners, and adverse context through 2026
    body: >
      Tempo moved quickly from announcement to commercialization. After the September 2025 unveiling, it disclosed its first
      infrastructure partners later that month, added Dankrad Feist in October, reported a $500 million Series A in the same
      month, and opened its public testnet in December. By March 2026 it had launched mainnet and the Machine Payments
      Protocol, with Stripe subsequently adding Tempo as a supported crypto network in its API changelog. From April through
      June 2026, the story shifted from design intent to operating milestones: Stripe, Visa, and Zodia Custody joined as
      validators; DoorDash described stablecoin settlement work for a 40+ country marketplace; MoneyGram became the first
      remittance validator and settlement partner; Flutterwave framed Tempo as a new cross-border settlement rail for 34
      African markets; Kraken positioned itself as Tempo's first U.S. centralized-exchange infrastructure stack; and Stripe
      itself used Tempo in its streaming-payments launch for AI-native billing. This pace of partner news is the company's
      strongest public progress signal, but it sits beside clear risk flags. BizBrief explicitly questioned whether the pace
      and size of the raise reflected startup-bubble enthusiasm, and criticism around Dankrad Feist's move showed how quickly
      Tempo can become a lightning rod in the open-source-versus-corporate blockchain debate. More structurally, U.S.
      regulators and congressional analysis still warn that payment stablecoins face AML, reserve-quality, run-risk, and
      implementation uncertainty. Tempo's milestones are real, but the regulatory and disclosure burden has not caught up to
      the ambition of the story.
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO043]
    tableRefs: [TO004]
    figureRefs: [FO001]

