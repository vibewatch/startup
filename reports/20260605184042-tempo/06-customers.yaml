- id: named-proof-and-status
  title: 'Named relationship classification: production, pre-production, and signaling'
  body: 'The key diligence task is to classify each marquee name precisely. Stripe has the clearest production evidence: Tempo says Stripe uses the chain inside money management capabilities, and Stripe separately announced Tempo-backed streaming payments and crypto-network support. DoorDash has a public case study and an enterprise overview that say Tempo-powered payout flows are moving into production, but no corridor volumes. MoneyGram has public proof as the first remittance validator and a planned live settlement flow with Stripe, again without corridor metrics. Flutterwave and Tempo are more explicit that the integration is not fully live yet: they describe intended wallet-to-wallet USDC and USDT settlement and say the teams are working to move it into production. Kraken is live as infrastructure, with Tempo-based deposits and withdrawals for USDT0 and USDC.e. Visa is also live, but as validator infrastructure rather than disclosed customer transaction flow. By contrast, OpenAI, Anthropic,
    Shopify, and Deutsche Bank remain public design partners with no standalone deployment proof in the reviewed set.'
