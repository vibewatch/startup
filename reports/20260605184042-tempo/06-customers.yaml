  evidenceGaps:
  - type: missing-source
    severity: material
    topic: marquee-logo-deployment-status
    missingEvidence: Customer-side deployment announcements, case studies, or volume disclosures for OpenAI, Anthropic, Shopify, Deutsche Bank, and Visa-linked client flows on Tempo.
    whyItMatters: These logos carry much of Tempo’s public credibility, but today they mostly evidence design participation or infrastructure support rather than clearly measured production usage.
    diligencePath: Request approved reference calls or written deployment summaries from each marquee logo and ask which flows are live, in pilot, or still exploratory.
    relatedQuestionRefs:
    - QU011
    - QU022
    relatedTableRefs:
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, logo churn, contract duration, renewal cohorts, and paying customer counts for Tempo’s enterprise accounts.
    whyItMatters: Without retention and renewal data, the chapter cannot distinguish durable enterprise adoption from recent launch activity or high-touch pilots.
    diligencePath: Request customer cohort tables by quarter, renewal schedules, logo churn history, and contract-length distribution for the top enterprise accounts.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-partner concentration by payment volume, revenue, and pipeline contribution, including dependency on Stripe or any other flagship account.
    whyItMatters: A small number of marquee relationships could dominate economics even if the public logo roster looks broad, which would materially affect underwriting risk.
    diligencePath: Request top-10 customer and partner concentration by payment volume and revenue, plus pipeline concentration by segment and corridor.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: realized-customer-outcomes
    missingEvidence: Post-go-live savings, settlement-speed deltas, exception-rate reductions, or margin impacts for DoorDash, MoneyGram, Flutterwave, and Stripe on Tempo.
    whyItMatters: The current case studies are persuasive on intent and architecture but weak on realized commercial outcomes, which limits conviction on customer value and expansion potential.
    diligencePath: Ask each reference customer for pre/post KPI snapshots after at least one full quarter in production, with corridor-level or workflow-level adoption metrics.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU003
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-enumeration
    missingEvidence: An exhaustive public roster mapping every named design partner and enterprise counterparty to design, validator, pilot, production, or inactive status as of 2026-06-05.
    whyItMatters: The named proof and relationship tables intentionally prioritize the most evidentiary rows and the logos specifically requested by the user, so they should not be mistaken for a full customer census.
    diligencePath: Build a maintained partner-status ledger from Tempo CRM, reference approvals, and partner comms before the next refresh.
    relatedTableRefs:
    - TU003
    - TU004
