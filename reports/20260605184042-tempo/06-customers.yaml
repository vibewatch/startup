- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Land one painful payment flow, then widen into more corridors
    - A few flagship accounts may dominate activity even if the logo list is broad
    - Could create fast expansion inside winners but leave economics overly concentrated
    - Request top-account volume share and pilot-to-expansion conversion by customer
  - - Stripe distribution and product embedding
    - Tempo could become highly dependent on Stripe as both sponsor and channel
    - Strong upside if embedded deeply; meaningful downside if Stripe volume remains limited or migrates elsewhere
    - Disclose Stripe-attributable Tempo volume, customer count, and gross margin
  - - Remittance and Africa corridor expansion
    - MoneyGram and Flutterwave are still early enough that corridor rollout could stall
    - Cross-border thesis weakens if these reference corridors stay narrow or pre-production
    - Request corridor-by-corridor go-live dates, active send volume, and unit economics
  - - Validator and infrastructure credibility
    - Validators may prove trust but not revenue-bearing customer usage
    - Investors could over-read infrastructure adoption as customer monetization
    - Separate validator, integration, and paying-customer KPIs in diligence materials
  - - AI and machine-payments thesis
    - OpenAI and Anthropic remain design-partner logos without public deployment proof
    - The AI upside story could be ahead of real demand if marquee labs do not go live
    - Request signed AI customer references, MPP session volume, and repeat-usage data
  - - Advisory-led GTM
    - Scaling may require substantial solutions engineering and partner coordination
    - Higher close rates on complex deals can coexist with slower sales cycles and lower sales efficiency
    - Provide advisory-to-production conversion rates, deployment durations, and services versus software mix
  notes: Expansion drivers are real, but every visible growth vector still requires private diligence on concentration, deal conversion, and deployment depth.
