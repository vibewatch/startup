tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Global marketplace payouts
    - Platform GM or head of payments / payments ops, finance ops, engineering / platform infrastructure budget
    - Merchant, seller, and worker payouts plus refund and reconciliation flows
    - DoorDash operates across 40+ countries; Stripe Connect powers 11 million businesses
    - Large-volume wedge with frequent, measurable settlement pain
    - Tempo does not disclose how much of this platform volume is already routed over Tempo
  - - Remittances and consumer settlement
    - Remittance or money-movement executive / treasury, settlement ops, compliance / remittance network or wallet budget
    - Cross-border settlement and treasury movement for retail remittance networks
    - MoneyGram cites 50M+ customers in 200+ countries and territories
    - High-frequency, cross-border flow with clear speed and cost upside
    - No public corridor-level Tempo volume or rollout schedule
  - - African cross-border business payments
    - Regional payments GM / Send App and enterprise payments teams / Flutterwave product and operations budget
    - Wallet-to-wallet stablecoin transfers, supplier settlements, and diaspora corridors
    - Flutterwave cites 34 African markets plus diaspora send corridors
    - Extends Tempo into corridors where legacy correspondent costs are unusually high
    - Integration is not yet publicly confirmed live by corridor
  - - Enterprise treasury and money management
    - Treasurer, CFO office, money-management or treasury product lead / finance ops and engineering / treasury platform budget
    - Holding, sending, receiving, and settling stablecoins inside money-management stacks
    - Stripe says Tempo supports money management for millions of businesses
    - Could anchor Tempo inside a broad existing software distribution layer
    - No public disclosure of Tempo-specific payment volume, take rate, or customer attach
  - - Banking and regulated-finance enablement
    - Bank innovation, sponsor-bank product, or payments strategy lead / compliance, ops, infra teams / institutional infrastructure budget
    - Validator participation, tokenized deposits, stablecoin settlement, and regulated payment infrastructure
    - Visa is a live validator; Deutsche Bank, Standard Chartered, Lead Bank, and Coastal are public partners
    - Adds credibility with enterprise buyers that need regulated counterparties
    - Public evidence is uneven on which of these names are live users versus design partners
  - - AI and machine-payments infrastructure
    - AI platform or developer infrastructure lead / engineering and product teams / API monetization or infra budget
    - Streaming micropayments, agent wallets, and machine-to-machine payments
    - MPP launched with 100+ services and Alchemy says agents can already pay via Tempo
    - Creates a differentiated adoption surface beyond traditional payments
    - OpenAI and Anthropic are still public design partners rather than proven production references
  notes: Segment assignments are derived from named partner disclosures and case studies; Tempo does not publish a formal revenue mix by segment, geography, or account size.
