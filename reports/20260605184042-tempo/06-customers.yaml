- id: adoption-trajectory
  title: Adoption trajectory and what has actually gone live
  body: 'Tempo’s adoption timeline is meaningful because it moves beyond announcement theater. September 2025 established the initial design-partner set. December testnet evidence showed a larger second wave of partners and claimed validation of real payment workloads. March 2026 mainnet opened public RPC access and launched MPP plus a 100+ service payments directory. After mainnet, the proof shifted from category positioning to infrastructure activation: Stripe added Tempo as a crypto-payments network option, Visa launched an in-house validator after six months of joint work, and Tempo said validator partners had already been testing real workloads. The strongest public production signal is no longer just “big names are helping shape the chain.” It is that selected operators are connecting products and infrastructure to Tempo. Tempo’s own enterprise page says design partners are bringing payment flows into production, and it singles out Stripe, DoorDash, Coastal, and ARQ as early examples.
    That still falls short of disclosed volume or revenue, but it is materially stronger than a pre-mainnet logo wall.'
