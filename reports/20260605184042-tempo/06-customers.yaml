figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests Tempo wins attention by solving one hard settlement problem, then wrapping that workflow with advisory help, infrastructure partners, and corridor expansion.
  approximationNotes: The map abstracts across the DoorDash, MoneyGram, Flutterwave, Stripe, and Kraken materials rather than reproducing a single company-specific implementation sequence.
  data:
    items:
    - label: Identify pain
      actor: Head of payments / treasurer / platform GM
      touchpoints:
      - slow cross-border settlement
      - high FX and intermediary costs
      - hard reconciliation
      - AI microbilling limits
      painpoint: Existing rails are too slow, opaque, or expensive for the target workflow.
      opportunity: Tempo is pitched as a payments-first chain with predictable fees, dedicated payment lanes, and structured payment metadata.
    - label: Scope the use case
      actor: Payment ops + compliance + engineering
      touchpoints:
      - stablecoin advisory
      - solution architecture
      - custody and compliance design
      - ramp partner selection
      painpoint: Enterprises rarely have in-house stablecoin architecture expertise.
      opportunity: Tempo sells a high-touch deployment playbook instead of just raw blockchain access.
    - label: Validate on testnet or in design
      actor: Product and infrastructure teams
      touchpoints:
      - design-partner feedback
      - testnet workload validation
      - validator onboarding
      painpoint: Payment teams need proof of throughput, reliability, and operational fit before production.
      opportunity: Tempo used launch and testnet partners to validate real workloads before mainnet.
    - label: Go live on infrastructure surfaces
      actor: Infrastructure and payments operators
      touchpoints:
      - public RPC
      - Tempo network support in Stripe
      - Visa validator node
      - Kraken deposits and withdrawals
      - Alchemy MPP billing
      painpoint: A chain must be reachable through real operator infrastructure before enterprise flows can ship.
      opportunity: The strongest public proof today is live infrastructure and operator integrations.
    - label: Expand payment flows
      actor: Treasury, customer success, and business owners
      touchpoints:
      - DoorDash payouts
      - MoneyGram settlement
      - Flutterwave corridors
      - Stripe streaming payments
      painpoint: Initial success must translate into more corridors, products, and recurring usage to matter economically.
      opportunity: Tempo’s public story is explicitly about land-and-expand from one painful flow into a broader payments footprint.
    - label: Underwrite durability
      actor: Investor or procurement committee
      touchpoints:
      - retention metrics
      - concentration data
      - outcome studies
      - pilot-to-production conversion
      painpoint: Public proof of deployment is stronger than public proof of renewals, expansion economics, or concentration.
      opportunity: The next refresh should test whether early relationships convert into durable, measurable customer value.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU009
  - CU041
