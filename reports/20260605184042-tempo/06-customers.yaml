- id: durability-and-proof-limits
  title: Durability, retention proxies, and proof limits
  body: Durability is where the public record thins out fast. None of the reviewed sources discloses paying customer count, NRR, GRR, logo churn, contract length, or renewal cohorts. What is visible instead are commitment proxies. Visa committed engineering work and now runs a validator in-house. Stripe shipped product and API support that explicitly references Tempo. Kraken and Alchemy expose live infrastructure surfaces on top of the network. Those are useful signals that Tempo is past a concept stage, but they are not substitutes for retention or unit-economics evidence. The customer-facing case studies also stop at intent and architecture more often than they reach realized outcomes. DoorDash, MoneyGram, and Flutterwave explain why faster settlement, lower cross-border cost, and better reconciliation matter, but they do not publish post-launch savings, failure-rate reductions, or multi-quarter expansion data. Investors can therefore treat the public record as evidence of real implementation
    work, not as proof of durable commercial performance.
  claimRefs:
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
  tableRefs:
  - TU005
- id: expansion-concentration-and-skepticism
  title: Expansion logic, concentration risk, and the skeptical lens
  body: Tempo’s visible expansion logic is credible but still concentrated. The pattern is to land one painful payment flow—marketplace payouts, remittance settlement, treasury movement, or machine payments—and then widen into more corridors or adjacent products once the rail works. That can create a strong land-and-expand motion, especially when Tempo pairs the chain with advisory help and partner introductions across custody, compliance, and ramp providers. The same structure creates risk. Public proof still clusters around a curated set of marquee references and company-authored stories, while TechCrunch’s launch framing made clear that several early design partners were prospective users if the chain performed well. BizBrief went further and questioned whether the pace of fundraising and logo accumulation reflected startup-bubble enthusiasm. The disciplined read is therefore neither “just signaling” nor “fully proven customer franchise.” Tempo has real early deployment evidence, but
    concentration, procurement friction, and logo-to-production conversion remain open diligence questions.
