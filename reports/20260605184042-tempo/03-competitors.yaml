  rows:
  - - Tempo
    - Reference company
    - Stripe and Paradigm incubation; named enterprise design partners; 50+ infrastructure partners claimed
    - Enterprise payment teams, banks, fintechs
    - Stablecoin-paid gas, EVM portability, deterministic sub-second settlement, tokenized-deposit support
    - Invitation-only validator model and live economics remain less transparent than mature public-chain rivals
  - - Solana
    - Direct public-chain rival
    - $1T+ stablecoin volume in 2025; Visa technical endorsement
    - Fintechs and payment builders prioritizing public-chain speed and liquidity
    - Fast public-chain settlement, sub-cent fees, strong stablecoin activity
    - Public-chain operating model and native-asset economics are less tailored to bounded enterprise governance
  - - Base
    - Direct public-chain rival
    - Coinbase-incubated; 1,000+ businesses claimed
    - Coinbase-aligned builders, consumer apps, U.S. fintechs
    - EVM portability with Coinbase distribution and institutional trust
    - Economic finality is slower and still sequencer/Ethereum dependent
  - - Stellar
    - Incumbent payment network
    - 90+ cash-ramp countries and 9.5 second average settlement claimed
    - Cross-border fintechs, wallets, and tokenization builders
    - Anchors, asset issuance, and payments-first network identity
    - Less Ethereum-portable for teams standardized on Solidity or EVM tooling
  - - XRPL / Ripple
    - Incumbent payments network
    - 10+ years of error-free operating history claimed; broad stablecoin expansion
    - Business payments, issuers, and liquidity-oriented builders
    - Low-cost settlement, built-in DEX, compliance-first features, widening stablecoin set
    - XRP remains the base liquidity and fee asset, which weakens Tempo's no-volatile-gas contrast
  - - Circle CPN + Arc
    - Adjacent full-stack infrastructure
    - Institutional payment network plus Arc Layer 1 and Circle Gateway integration
    - OFIs, BFIs, banks, and USDC-centered global payment operators
    - Single integration, USDC liquidity, compliance-heavy workflow, full-stack product suite
    - More vertically aligned to Circle's ecosystem than to issuer-neutral multi-chain settlement
  - - Fireblocks + Bridge
    - Adjacent orchestration substitute
    - 40+ stablecoin providers and 60+ currencies on Fireblocks; Bridge positions as end-to-end API platform
    - Enterprises that want orchestration, custody, or issuance without choosing one chain first
    - Chain-neutral connectivity, embedded compliance, orchestration APIs, faster implementation path
    - May abstract away the base chain and commoditize Tempo's core settlement layer
  - - Plasma / Tether-aligned chain
    - Vertically aligned stablecoin-chain rival
    - Purpose-built stablecoin network with staged validator rollout
    - USDT-heavy apps and operators who want a dedicated payments chain
    - Stablecoin-first positioning and BFT-style finality in seconds
    - Trusted-launch validator model starts less neutral than Tempo's issuer-agnostic story
  - - Bank-issued tokenized deposits
    - Substitute / status quo upgrade
    - Preferred architecture in BIS and IMF policy framing; bank response discussed by the Federal Reserve
    - Banks, treasurers, and regulated institutions prioritizing prudential comfort
    - Regulated liabilities, existing bank relationships, and familiar supervision
    - Open-network interoperability and multi-institution composability are weaker than Tempo's value proposition
