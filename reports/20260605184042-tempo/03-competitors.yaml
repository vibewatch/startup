- id: distribution-and-switching
  title: Distribution, switching costs, and enterprise trust
  body: |-
    Architecture only gets Tempo into the consideration set; distribution and trust decide whether it wins the account. Tempo has meaningful early proof points: DoorDash, Stripe, Coastal, and ARQ are named design partners, and the company says more than 50 infrastructure partners span custody, compliance, on/off ramps, card issuance, and orchestration. That gives Tempo more enterprise traction than a pure whitepaper-stage chain. But most rivals start from larger installed bases. Base inherits Coinbase's developer and business distribution. Solana brings public stablecoin volume and Visa's technical endorsement. Stellar already has global payment-ramp reach. XRPL has more than a decade of business-chain operating history and a widening stablecoin set. Circle, Fireblocks, and Bridge all sell enterprise adoption through an orchestration or service layer instead of first asking the buyer to choose one new chain.

    This lowers switching cost at the infrastructure layer. If a treasury, payout, or embedded-finance team can add stablecoin flows through Circle, Fireblocks, or Bridge, it can multi-home across chains or postpone the base-chain decision entirely. Tempo's advisory model and bounded validator onboarding may reduce execution risk for regulated buyers, but they do not automatically create the embedded distribution moat that Coinbase, major bank relationships, or neutral API vendors already possess. In practice, Tempo looks strongest where a buyer wants one payment-optimized chain and is willing to choose it deliberately rather than treat chain selection as an implementation detail.
