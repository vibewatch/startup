callouts:
- calloutType: insight
  title: Tempo's best-fit buyer wants one payment-optimized chain, not just stablecoin access
  body: |-
    Tempo looks strongest for enterprises that want a single settlement chain optimized for payments, EVM portability, stablecoin fees, and regulated-flow controls. If a buyer mainly wants to add stablecoin payouts without choosing a long-term chain strategy, neutral orchestration vendors are often the lower-friction alternative.
  claimRefs:
  - CP037
  - CP042
- calloutType: risk
  title: Abstraction-layer risk is the central competitive threat
  body: |-
    The most dangerous competitor is not necessarily the fastest chain. It is the vendor or banking stack that lets customers capture stablecoin benefits while keeping chain choice optional. That is why Fireblocks, Bridge, and tokenized-deposit substitutes matter as much as Solana, Base, or XRPL in Tempo's real enterprise deal flow.
  claimRefs:
  - CP041
  - CP042
  - CP043
  - CP044
