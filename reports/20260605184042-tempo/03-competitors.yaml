- id: moat-and-adverse-evidence
  title: Moat durability, substitutes, and adverse evidence
  body: |-
    Tempo's moat is promising but not settled. The bullish view is straightforward: enterprises that want EVM portability, deterministic settlement, stablecoin-denominated fees, payment metadata, and issuer policy controls do not have many direct alternatives that bundle those traits in one product. The bearish view is category convergence. Base keeps improving the easiest Coinbase-backed EVM route. Solana and XRPL already have strong public-chain payment credibility. Stellar remains a proven cross-border and asset-issuance rail. Circle and Plasma show how vertically aligned ecosystems can prioritize a house asset and still win distribution. Fireblocks and Bridge show how orchestration vendors can own the implementation layer and make the underlying chain harder to differentiate.

    The deepest substitute is not another crypto network at all. BIS, IMF, the Federal Reserve, and the RBA all point investors toward the same problem: if institutions mostly want programmable, compliant, regulated settlement assets, tokenized commercial bank money and deposit-linked systems may satisfy parts of that job without asking risk committees to adopt a new public or semi-public settlement chain. That does not make Tempo irrelevant; it means its best-fit buyer is narrower than the generic stablecoin story. Tempo is strongest when a customer values open-network reach, composability, and chain-level payment specialization. It is weakest when the buyer only wants a safer bank liability, a neutral orchestration layer, or a mainstream public chain with bigger existing distribution.
