  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: tempo-validator-economics
    missingEvidence: Tempo does not publicly disclose a finalized validator count, validator roster, or mainnet reward and fee schedule that would let an investor compare governance economics with public-chain rivals.
    whyItMatters: Validator concentration and fee economics determine whether Tempo's bounded-validator model is a durable enterprise feature or simply a centralization trade-off without compensating economic advantage.
    diligencePath: Request the latest validator roster, target validator expansion plan, and post-mainnet economics memo from Tempo or Blockdaemon under NDA.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: material
    topic: tempo-partner-scale
    missingEvidence: Tempo names enterprises and design partners, but public sources do not quantify live payment volume, conversion rates from pilot to production, or customer concentration across those accounts.
    whyItMatters: Named logos improve credibility, but underwriting competitive durability requires knowing whether Tempo already owns material recurring payment volume or is still in low-volume proof-of-concept deployments.
    diligencePath: Ask for signed live-customer counts, annualized payment volume by top deployment, and expansion pipeline metrics for named enterprise accounts.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: Tempo, Circle, Fireblocks, and Bridge do not publish comparable enterprise contract pricing, minimums, or discount structures that would allow a true head-to-head TCO analysis.
    whyItMatters: Pricing power and implementation cost drive win rates in infrastructure deals, and public fee-per-transaction signals alone do not reveal the commercial burden of enterprise deployment.
    diligencePath: Collect redlined MSAs or commercial quote sheets for at least two comparable enterprise use cases across Tempo and the main orchestration alternatives.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: stale
    severity: minor
    topic: production-throughput-comparability
    missingEvidence: Tempo and several rivals publish targets, benchmarks, or stage-specific confirmation times, but there is no single like-for-like public dataset for sustained enterprise payment throughput under production conditions.
    whyItMatters: Without comparable production throughput and failure-mode data, buyers may over-index on headline TPS or finality marketing when choosing a settlement layer.
    diligencePath: Request benchmark methodology, live throughput percentiles, downtime history, and peak-load payment performance from Tempo and shortlisted competitors.
    relatedQuestionRefs:
    - QP025
