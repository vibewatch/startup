- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - EVM plus stablecoin gas plus deterministic settlement
    - Base matches EVM portability, while orchestration vendors can abstract gas handling and chain choice
    - High
    - Test whether Tempo wins because customers need chain-specific payment traits or because they simply need easier stablecoin orchestration
  - - Invitation-only, enterprise-friendly validator model
    - Buyers may view the model as centralization without enough offsetting proof on validator economics or live reliability
    - Medium
    - Request validator roster, uptime history, and economics to show why bounded governance is a feature rather than a compromise
  - - Enterprise design partners and advisory model
    - Named partners do not prove scaled recurring volume or broad distribution versus Coinbase, Circle, or bank channels
    - High
    - Obtain live volume, renewal, and customer-concentration data for named deployments
  - - Stablecoin-neutral posture
    - Circle and Plasma can use house-asset alignment to accelerate ecosystem adoption, while Fireblocks and Bridge sell neutrality without requiring a new chain
    - High
    - Show issuer mix, asset diversity, and why a neutral chain captures higher-value workloads than a neutral API layer
  - - Tokenized-deposit support
    - Bank-issued tokenized deposits may satisfy prudentially conservative buyers without asking them to adopt a new settlement chain
    - High
    - Map which use cases truly require open-network reach and which are likely to stay inside bank-led rails
  - - Payment-specific protocol features
    - Public chains and infrastructure vendors can add memos, policy controls, or fee abstraction over time, compressing functional differentiation
    - Medium
    - Quantify time-to-value, integration cost, and retention advantages that come from Tempo's native features rather than service wrapping
  notes: Severity reflects underwriting risk to Tempo's differentiation rather than a claim that any rival will certainly win; the main unknown is how much customers value a dedicated payment chain versus orchestration or bank substitutes.
