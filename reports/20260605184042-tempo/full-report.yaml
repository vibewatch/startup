      - number: '6.5'
        title: Expansion logic, concentration risk, and the skeptical lens
        blocks:
          - type: paragraph
            body: >-
              Tempo’s visible expansion logic is credible but still concentrated. The pattern is to land one painful
              payment flow—marketplace payouts, remittance settlement, treasury movement, or machine payments—and then
              widen into more corridors or adjacent products once the rail works. That can create a strong
              land-and-expand motion, especially when Tempo pairs the chain with advisory help and partner introductions
              across custody, compliance, and ramp providers. The same structure creates risk. Public proof still
              clusters around a curated set of marquee references and company-authored stories, while TechCrunch’s
              launch framing made clear that several early design partners were prospective users if the chain performed
              well. BizBrief went further and questioned whether the pace of fundraising and logo accumulation reflected
              startup-bubble enthusiasm. The disciplined read is therefore neither “just signaling” nor “fully proven
              customer franchise.” Tempo has real early deployment evidence, but concentration, procurement friction,
              and logo-to-production conversion remain open diligence questions.
