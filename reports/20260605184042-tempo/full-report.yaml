      - number: '6.4'
        title: Durability, retention proxies, and proof limits
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record thins out fast. None of the reviewed sources discloses paying
              customer count, NRR, GRR, logo churn, contract length, or renewal cohorts. What is visible instead are
              commitment proxies. Visa committed engineering work and now runs a validator in-house. Stripe shipped
              product and API support that explicitly references Tempo. Kraken and Alchemy expose live infrastructure
              surfaces on top of the network. Those are useful signals that Tempo is past a concept stage, but they are
              not substitutes for retention or unit-economics evidence. The customer-facing case studies also stop at
              intent and architecture more often than they reach realized outcomes. DoorDash, MoneyGram, and Flutterwave
              explain why faster settlement, lower cross-border cost, and better reconciliation matter, but they do not
              publish post-launch savings, failure-rate reductions, or multi-quarter expansion data. Investors can
              therefore treat the public record as evidence of real implementation work, not as proof of durable
              commercial performance.
