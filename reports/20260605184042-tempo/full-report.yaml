      - number: '7.2'
        title: Governance, validator concentration, and related-party exposure
        blocks:
          - type: paragraph
            body: >-
              The most important governance risk is that Tempo’s decentralization narrative remains prospective while
              the current operating model is deliberately centralized. Paradigm’s launch post says Matt Huang will lead
              Tempo while continuing to lead Paradigm, making him both the public strategic face of the company and the
              bridge to one of its two incubators. Tempo’s validator documentation shows why this matters operationally:
              new validators still submit registration details to the Tempo team, must be added on-chain by the team,
              and in some cases must still coordinate with the team for identity rotation or recovery workflows. Public
              reporting improves comfort that the validator set now includes real institutions—MoneyGram, Visa, Stripe,
              and Zodia—but it also sharpens concentration risk because those same institutions anchor credibility,
              compliance optics, and business development. CoinDesk’s Visa interview is especially revealing: the point
              is not maximal decentralization, but a payment system that large enterprises judge fast and controllable
              enough to use. That may be commercially rational, but it leaves investors underwriting a system whose
              resilience, censorship posture, emergency powers, and related-party governance are still less transparent
              than its marketing surface.
            claimRefs:
