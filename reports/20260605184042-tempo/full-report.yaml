      - number: '5.5'
        title: Security, privacy, roadmap, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Tempo’s public trust story is mixed. On the positive side, it already discloses a substantial compliance
              and security-partner stack, a public security contact, open-source repositories, signed releases, and a
              visible cadence of hardening upgrades. On the negative side, the GitHub security policy still says the
              blockchain is undergoing audit and has no active bug bounty, and no public audit reports or mainnet
              incident history were found. Zones improve privacy for enterprise workflows, but they also introduce
              explicit trust assumptions: operators can see all in-zone activity, control sequencing and liveness, and
              may suspend withdrawals or transfers under their own compliance rules. More broadly, the network is still
              evolving quickly. The 2026 upgrade schedule includes repeated security and gas changes, validator-config
              changes, payment-lane classification, and multihop FeeAMM routing, with some items still upcoming at the
              report date. Tempo therefore looks technically differentiated and commercially purposeful, but it still
              carries meaningful architecture risk from concentration, rapid protocol churn, and incomplete public
              assurance evidence.
