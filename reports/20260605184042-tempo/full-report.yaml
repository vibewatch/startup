  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Public proof is strongest for Stripe and infrastructure operators, middling for rollout-in-progress references
      like DoorDash and MoneyGram, and weakest for marquee design partners without case studies.
    data:
      columns:
        - Production evidence
