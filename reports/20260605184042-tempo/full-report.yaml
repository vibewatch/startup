      - number: '8.3'
        title: 'Comparable lenses: disclosed strategic values exist, but monetization proof matters'
        blocks:
          - type: paragraph
            body: >-
              The best public comparable set for Tempo is not a single clean peer group. It is a mix of stablecoin
              infrastructure M&A, public stablecoin-network disclosures, and diversified onchain monetization
              benchmarks. The private side shows real strategic value: Mastercard agreed to buy BVNK for up to $1.8
              billion, and Stripe’s earlier Bridge acquisition was reported around $1.1 billion. Those deals support the
              idea that orchestration and settlement infrastructure can be strategically important. But they also
              highlight that even valuable infrastructure businesses can clear at prices materially below Tempo’s
              reported $5 billion mark. The public side is even more revealing. Circle’s S-1 and Coinbase’s shareholder
              letter show what disclosed monetization looks like when the market can inspect revenue, reserve income,
              stablecoin balances, blockchain rewards, and profitability. Tempo has not yet offered that level of
              disclosure. So the comparable conclusion is mixed: category value is real, but public evidence supporting
              this specific price remains thin because the monetization proof available for public or acquired peers is
              much deeper than Tempo’s.
            claimRefs:
