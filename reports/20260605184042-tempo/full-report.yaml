          label: Compose Tempo Transaction
          detail: App chooses sponsorship, batching, scheduling, memos, and fee-token behavior.
          tone: positive
        - id: n3
          label: Use payment lane blockspace
          detail: TIP-20 payment flow enters reserved payment blockspace rather than generic demand queues.
          tone: positive
        - id: n4
          label: Fee AMM conversion if needed
          detail: If user and validator prefer different fee tokens, protocol converts at fixed AMM rates.
          tone: positive
        - id: n5
          label: Simplex BFT finalization
          detail: Validators order and finalize the payment with deterministic, sub-second settlement targets.
          tone: positive
        - id: n6
          label: Reconcile / off-ramp / zone transfer
          detail: Memo fields, partner infrastructure, or Zones move the payment into treasury, custody, or private workflows.
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Prepare payment
        - from: n2
          to: n3
          label: Submit
        - from: n3
          to: n4
          label: If fee token differs
        - from: n4
          to: n5
          label: Settle
        - from: n5
          to: n6
          label: Post-settlement operations
    approximationNotes: >-
      The flow shows the common operating path rather than every possible branch, especially for app-sponsored or
      zone-mediated transactions.
    claimRefs:
      - CE002
      - CE005
      - CE008
      - CE014
      - CE015
      - CE024
      - CE026
      - CE048
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Tempo’s payment promise depends not only on protocol code, but also on validators, stablecoin issuers, liquidity,
      compliance vendors, and enterprise infrastructure partners.
    data:
      nodes:
        - id: tempo-core
          label: Tempo core L1
          type: system
          detail: Reth-based execution plus Simplex consensus and payment-native transaction types.
        - id: validators
          label: Bounded validator set
          type: dependency
          detail: Invited validators provide ordering, liveness, and fee collection until permissionless expansion matures.
        - id: issuers
          label: TIP-20 issuers and policy admins
          type: dependency
          detail: Stablecoin issuers define fee-eligible tokens, transfer rules, and freezes.
        - id: liquidity
          label: Fee AMM / DEX liquidity
          type: dependency
          detail: Stablecoin fee conversion and cross-stablecoin flows depend on sufficient onchain liquidity.
        - id: infra
          label: RPC, custody, and wallet partners
          type: dependency
          detail: Blockdaemon, BitGo, Turnkey, and similar providers make the chain operable for enterprises.
        - id: compliance
          label: Security and AML partners
          type: dependency
          detail: Blockaid, Chainalysis, Elliptic, TRM, and TRES support safe institutional usage.
        - id: zones
          label: Zone operators
          type: dependency
          detail: Private deployments depend on operators for visibility, sequencing, and availability.
        - id: customers
          label: Enterprise payment operators
          type: dependency
          detail: >-
            Real-world adoption depends on finance, treasury, and platform teams integrating Tempo into existing
            systems.
      edges:
        - from: tempo-core
          to: validators
          label: Consensus / liveness
        - from: tempo-core
          to: issuers
          label: Fee-eligible stablecoins
        - from: tempo-core
          to: liquidity
          label: Fee conversion and swaps
        - from: tempo-core
          to: infra
          label: Operational access
        - from: tempo-core
          to: compliance
          label: Safety and AML workflows
        - from: tempo-core
          to: zones
          label: Private extensions
        - from: infra
          to: customers
          label: Managed integrations
        - from: issuers
          to: customers
          label: Transfer permissions and reserves
        - from: zones
          to: customers
          label: Private workflow option
    approximationNotes: >-
      This map represents operational dependency rather than ownership or contractual certainty; public evidence is
      strongest on vendors and weakest on concentration thresholds.
    claimRefs:
      - CE020
      - CE028
      - CE029
      - CE031
      - CE034
      - CE035
      - CE042
      - CE048
      - CE050
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Tempo appears strongest on payment-native design and EVM tooling, less proven on decentralization, public
      assurance artifacts, and broad production privacy deployments.
    data:
      columns:
        - Payment primitives
        - EVM/tooling surface
        - Validator / ops model
        - Privacy / Zones
        - Competitive proof
      rows:
        - label: Public product specificity
          values:
            - label: High
              tone: positive
              detail: Docs clearly explain stablecoin fees, batching, memos, sponsorship, and MPP workflows.
            - label: High
              tone: positive
              detail: Reth/EVM compatibility and JSON-RPC integration are explicit and detailed.
            - label: Medium
              tone: neutral
              detail: Lifecycle and monitoring docs are detailed, but live validator census transparency is limited.
            - label: Medium
              tone: neutral
              detail: Zones are well documented conceptually, but public production proof remains early.
            - label: Medium
              tone: neutral
              detail: Competitive differentiation is clear, yet independent field proof is still limited.
        - label: Current operating maturity
          values:
            - label: High
              tone: positive
              detail: Mainnet is live and payment-oriented transaction types are documented.
            - label: High
              tone: positive
              detail: Repo, SDK references, RPC providers, and custody integrations are already public.
            - label: Medium
              tone: warning
              detail: Validator expansion is underway, but the public model is still bounded and operator-heavy.
            - label: Low
              tone: warning
              detail: Zones repo warns of rapid iteration and not-for-production status.
            - label: Medium
              tone: warning
              detail: Peer comparisons are plausible, but public runtime metrics are less mature than leading rails.
        - label: Security / assurance transparency
          values:
            - label: Medium
              tone: neutral
              detail: Payment features reduce middleware complexity but increase protocol surface.
            - label: Medium
              tone: neutral
              detail: Open-source repo and signed releases are positive, but public audits are absent.
            - label: Low
              tone: warning
              detail: Concentration and missing incident history reduce confidence in resilience claims.
            - label: Low
              tone: warning
              detail: Operator visibility and suspension powers are explicitly trusted rather than minimized away.
            - label: Low
              tone: warning
              detail: No public benchmark pack or broad third-party reliability data was found for runDate.
    approximationNotes: The matrix scores documentary maturity and publicly evidenced readiness, not hidden internal quality.
    claimRefs:
      - CE018
      - CE032
      - CE038
      - CE039
      - CE040
      - CE041
      - CE043
      - CE046
      - CE047
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public evidence suggests Tempo wins attention by solving one hard settlement problem, then wrapping that workflow
      with advisory help, infrastructure partners, and corridor expansion.
    approximationNotes: >-
      The map abstracts across the DoorDash, MoneyGram, Flutterwave, Stripe, and Kraken materials rather than
      reproducing a single company-specific implementation sequence.
    data:
      items:
        - label: Identify pain
          actor: Head of payments / treasurer / platform GM
          touchpoints:
            - slow cross-border settlement
            - high FX and intermediary costs
            - hard reconciliation
            - AI microbilling limits
          painpoint: Existing rails are too slow, opaque, or expensive for the target workflow.
          opportunity: >-
            Tempo is pitched as a payments-first chain with predictable fees, dedicated payment lanes, and structured
            payment metadata.
        - label: Scope the use case
          actor: Payment ops + compliance + engineering
          touchpoints:
            - stablecoin advisory
            - solution architecture
            - custody and compliance design
            - ramp partner selection
          painpoint: Enterprises rarely have in-house stablecoin architecture expertise.
          opportunity: Tempo sells a high-touch deployment playbook instead of just raw blockchain access.
        - label: Validate on testnet or in design
          actor: Product and infrastructure teams
          touchpoints:
            - design-partner feedback
            - testnet workload validation
            - validator onboarding
          painpoint: Payment teams need proof of throughput, reliability, and operational fit before production.
          opportunity: Tempo used launch and testnet partners to validate real workloads before mainnet.
        - label: Go live on infrastructure surfaces
          actor: Infrastructure and payments operators
          touchpoints:
            - public RPC
            - Tempo network support in Stripe
            - Visa validator node
            - Kraken deposits and withdrawals
            - Alchemy MPP billing
          painpoint: A chain must be reachable through real operator infrastructure before enterprise flows can ship.
          opportunity: The strongest public proof today is live infrastructure and operator integrations.
        - label: Expand payment flows
          actor: Treasury, customer success, and business owners
          touchpoints:
            - DoorDash payouts
            - MoneyGram settlement
            - Flutterwave corridors
            - Stripe streaming payments
          painpoint: Initial success must translate into more corridors, products, and recurring usage to matter economically.
          opportunity: >-
            Tempo’s public story is explicitly about land-and-expand from one painful flow into a broader payments
            footprint.
        - label: Underwrite durability
          actor: Investor or procurement committee
          touchpoints:
            - retention metrics
            - concentration data
            - outcome studies
            - pilot-to-production conversion
          painpoint: Public proof of deployment is stronger than public proof of renewals, expansion economics, or concentration.
          opportunity: The next refresh should test whether early relationships convert into durable, measurable customer value.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU009
      - CU041
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      The visible public path runs from marquee design-partner disclosure to testnet validation, mainnet readiness, live
      infrastructure activation, and then a smaller set of named production rollouts.
    approximationNotes: >-
      This funnel synthesizes launch, testnet, mainnet, validator, and partner-case-study disclosures rather than a
      literal CRM funnel published by the company.
    data:
      nodes:
        - id: n1
          label: Marquee design partners
          detail: Launch disclosures established a broad roster across AI, commerce, banks, and fintechs.
        - id: n2
          label: Testnet validation
          detail: Public testnet added a second wave of partners and claimed validation of real payment workloads.
        - id: n3
          label: Mainnet and public APIs
          detail: Tempo mainnet launched with public RPC access plus MPP and a 100+ service directory.
        - id: n4
          label: Infrastructure operators live
          detail: >-
            Validators, Stripe network support, Kraken rail support, and Alchemy billing prove deployable operator
            infrastructure.
        - id: n5
          label: Named flows moving into production
          detail: DoorDash, Stripe, ARQ, Coastal, MoneyGram, and Flutterwave provide the clearest public rollout evidence.
        - id: n6
          label: Durability proof gap
          detail: Customer count, renewal, concentration, and realized outcome data are still mostly private.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
