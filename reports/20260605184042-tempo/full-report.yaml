      - number: '3.4'
        title: Moat durability, substitutes, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Tempo's moat is promising but not settled. The bullish view is straightforward: enterprises that want EVM
              portability, deterministic settlement, stablecoin-denominated fees, payment metadata, and issuer policy
              controls do not have many direct alternatives that bundle those traits in one product. The bearish view is
              category convergence. Base keeps improving the easiest Coinbase-backed EVM route. Solana and XRPL already
              have strong public-chain payment credibility. Stellar remains a proven cross-border and asset-issuance
              rail. Circle and Plasma show how vertically aligned ecosystems can prioritize a house asset and still win
              distribution. Fireblocks and Bridge show how orchestration vendors can own the implementation layer and
              make the underlying chain harder to differentiate.


              The deepest substitute is not another crypto network at all. BIS, IMF, the Federal Reserve, and the RBA
              all point investors toward the same problem: if institutions mostly want programmable, compliant,
              regulated settlement assets, tokenized commercial bank money and deposit-linked systems may satisfy parts
