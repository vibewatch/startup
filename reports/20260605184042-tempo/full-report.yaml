      - number: '7.5'
        title: Financial-system risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final underwriting risk is that Tempo’s upside depends on a macro and policy transition that could
              still unfold unevenly even if the company executes well. Federal Reserve research suggests stablecoin
              growth can alter bank funding, increase uninsured wholesale concentration, and intensify liquidity stress
              at banks serving issuers. IMF analysis extends the concern beyond deposits: tokenized finance can remove
              temporal buffers, move control into shared infrastructure and code, and amplify instability through speed,
              concentration, and fragmentation when legal certainty or governance is weak. For Tempo, that means
              regulatory progress is not a clean de-risking vector. Greater adoption can itself create tougher scrutiny
              of issuer quality, reserve management, operational resilience, and cross-border settlement governance. The
              mitigation case is still real: the company has purpose-built payment features, growing institutional
              validators, explicit compliance tooling, and a category increasingly supported by formal rulebooks. But
              investors should not confuse “credible category formation” with “de-risked company.” The thesis breaks if
              licensing or issuer eligibility cuts off key corridors, if a protocol or validator-control failure
              undermines trust, if design-partner momentum never converts into sustained payment volume, or if
              related-party concentration leaves Tempo looking more like a captive corporate rail than a neutral
              enterprise payment network.
