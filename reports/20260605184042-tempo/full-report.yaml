  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation is driven by the gap between strong product and partner signal on one side and thin public
      monetization evidence at a $5B price on the other.
    data:
      nodes:
        - id: price
          label: ~$5B entry price
          detail: The last reported round sets a high burden of proof for future returns.
        - id: product
          label: Product readiness
          detail: Mainnet, MPP, and payments-first design are visible.
        - id: partners
          label: Partner quality
          detail: Validators and named enterprises add credibility to the thesis.
        - id: monetization
          label: Monetization gap
          detail: Revenue, payment volume, take rate, and margin remain undisclosed.
        - id: regulation
          label: Regulatory / cycle risk
          detail: Stablecoin adoption is growing, but oversight and multiple compression remain real constraints.
        - id: comps
          label: Comparable lens
          detail: Peers and public benchmarks show real value, but usually with deeper disclosure.
        - id: recommendation
          label: Track / research more
          detail: Good company signal, weak public support for paying the last reported price.
      edges:
        - from: partners
          to: product
          label: supports
        - from: product
          to: recommendation
          label: helps
        - from: price
          to: recommendation
          label: raises hurdle
        - from: monetization
          to: recommendation
          label: blocks conviction
        - from: regulation
          to: recommendation
          label: adds downside
        - from: comps
          to: recommendation
          label: checks price
        - from: price
          to: comps
          label: frames comp need
    approximationNotes: This figure expresses decision logic rather than a deterministic valuation model.
    claimRefs:
      - CV001
      - CV011
      - CV014
      - CV018
      - CV020
      - CV032
      - CV039
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      A $5B entry needs very large exit revenue if investors require roughly a 3x gross return and dilution is not
      trivial.
    data:
      items:
        - label: 6x exit multiple / 25% dilution
          value: 3.33
          note: Required exit revenue in $B for ~3.0x gross from a $5B entry.
        - label: 8x exit multiple / 20% dilution
          value: 2.34
          note: Still assumes premium software-like monetization for a payments rail.
        - label: 10x exit multiple / 20% dilution
          value: 1.88
          note: High but more plausible than the 6x case only if take rate is durable.
        - label: 12x exit multiple / 15% dilution
          value: 1.47
          note: Requires both premium multiple support and strong growth.
        - label: 15x exit multiple / 10% dilution
          value: 1.11
          note: Best-case public-multiple and dilution assumptions, not a base case.
    approximationNotes: >-
      Assumes a 3.0x gross target over five years from a $5B entry; values are required exit revenue in US$ billions,
      not Tempo forecasts.
    claimRefs:
      - CV037
      - CV038
      - CV039
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Scenario ranges are intentionally wide because Tempo is private and public monetization inputs remain sparse.
    data:
      items:
        - label: Bull-case exit equity ($B)
          low: 14
          mid: 18
          high: 24
          note: Roughly 2.8x-4.8x gross if dilution stays contained and partner conversion is strong.
        - label: Base-case exit equity ($B)
          low: 6
          mid: 8
          high: 11
          note: Roughly 1.2x-2.2x gross if Tempo monetizes but looks more like infrastructure than software.
        - label: Bear-case exit equity ($B)
          low: 2
          mid: 4
          high: 6
          note: Roughly 0.4x-1.2x gross if pilots do not convert and multiples compress.
    approximationNotes: >-
      These are exit-equity ranges, not current fair values; they are designed to show return sensitivity under explicit
      bull, base, and bear assumptions.
    claimRefs:
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style scoring emphasizes that the blocker is valuation under evidence quality, not a lack of product ambition.
    data:
      items:
        - label: Market tailwind
          value: 4
          note: Stablecoin growth and enterprise-readiness signals are real.
        - label: Product readiness
          value: 4
          note: Mainnet, MPP, and payments-first primitives are publicly visible.
        - label: Distribution proof
          value: 3.5
          note: Partner set is strong, but paid production proof is still limited publicly.
        - label: Economics visibility
          value: 1.5
          note: Revenue, payment volume, and take rate remain undisclosed.
        - label: Regulatory resilience
          value: 2.5
          note: Tailwinds exist, but prudential and operational requirements are rising.
        - label: Valuation attractiveness
          value: 1.5
          note: The last reported price is ahead of public proof.
        - label: Evidence quality
          value: 2
          note: Good for framing scenarios, not good enough for high-conviction pricing.
    approximationNotes: >-
      Scores are ordinal 1-5 judgments synthesized from retained evidence and are intended for committee discussion, not
      for mechanical portfolio construction.
    claimRefs:
      - CV001
      - CV011
      - CV014
      - CV023
      - CV027
      - CV032
      - CV039
