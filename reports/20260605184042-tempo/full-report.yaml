      - number: '8.4'
        title: 'Bull, base, and bear: the right valuation method is scenario analysis'
        blocks:
          - type: paragraph
            body: >-
              Because Tempo is private and revenue is undisclosed, the central question is not “what exact multiple does
              it deserve today?” but “what future outcomes would make this entry work?” The bull case requires several
              things to happen together: flagship partners must move from design or pilot mode into scaled paid
              production, payment volume has to concentrate on workflows where Tempo can keep a meaningful take rate,
              and public-market or strategic-exit multiples need to stay generous for payment infrastructure. The base
              case is more moderate and, frankly, more common: solid product progress, real usage, but slower
              monetization and more commoditized economics than the partner roster implies. The bear case is not that
              Tempo is bad technology. It is that partner logos do not convert fast enough, regulated-bank or
              orchestration competitors capture the enterprise layer, and risk appetite for crypto-linked assets
              compresses before Tempo discloses compelling financial proof. That is why the scenario ranges below are
              intentionally wide and explicitly assumption-driven.
            claimRefs:
              - CV023
