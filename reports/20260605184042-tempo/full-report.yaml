      - number: '8.2'
        title: What the October 2025 round proves, and what it still leaves unknown
        blocks:
          - type: paragraph
            body: >-
              The reported Series A gives investors a headline anchor but not a full underwriting file. Multiple outlets
              agree that Tempo raised $500 million at an approximately $5 billion valuation with Thrive Capital and
              Greenoaks leading, plus Sequoia, Ribbit, and SV Angel participating, while Stripe and Paradigm did not add
              capital in the round. That is meaningful: it says credible investors were willing to fund Tempo at scale
              after incubation and before broad public financial disclosure. But a financing headline is not the same
              thing as valuation support. To earn venture-style returns from a $5 billion entry, the company would still
              need a much larger exit value, and unknown dilution makes the hurdle even higher. Because Tempo remains
              private and revenue is undisclosed, the correct method is scenario and sensitivity analysis, not false
              precision. The public record allows us to frame what the price requires; it does not allow us to claim
              that those required revenue or cash-flow outcomes are already visible.
            claimRefs:
              - CV011
