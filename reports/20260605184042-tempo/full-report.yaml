  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and pricing: fee-based rails are clear, realized monetization is not'
        blocks:
          - type: paragraph
            body: >-
              Tempo’s public materials make the top of the revenue funnel clearer than the bottom. The company
              repeatedly positions itself as a payments-first chain built for stablecoins, and the clearest monetization
              surface in that record is transaction fees paid in USD stablecoins on TIP-20 transfers and Tempo
              Transactions. Official and partner documentation support a fixed-fee model with sub-millidollar transfer
              pricing, stablecoin-denominated gas, and a Fee AMM that converts user-paid fees into the validator’s
              preferred asset. That is enough to conclude that transaction fees are real and intentionally
              enterprise-friendly. It is not enough to conclude how much gross revenue Tempo keeps per transaction, how
              fees split across validators or any treasury, whether the AMM embeds spread capture, or what realized
              enterprise pricing looks like in production. Public sources also do not show a second monetization surface
              with the same clarity. Partnership announcements and hiring can support a hypothesis of enterprise
              services or commercial relationships around onboarding, settlement, and network operations, but they do
              not disclose contract values or recurring software revenue. As a result, the underwriting picture is
              straightforward: list pricing is visible, but revenue mix, fee capture, and revenue quality remain mostly
