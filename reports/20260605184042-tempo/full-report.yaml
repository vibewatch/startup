      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              Public leadership disclosure is narrow. The clearest official governance fact is that Matt Huang said he
              would lead Tempo while continuing to lead Paradigm alongside Alana, which immediately makes him the key
              external face of the company, the bridge to one incubator, and the most visible interpreter of strategy to
              investors and partners. CoinDesk separately reported that Tempo launched with a 15-person team,
              underscoring how much narrative, fundraising, and strategic accountability are concentrated in a
              still-small organization. Tempo later strengthened technical credibility by bringing in Ethereum
              researcher Dankrad Feist, but that hire does not eliminate central-person risk; it redistributes some
              technical execution risk while leaving corporate governance largely undisclosed. Tempo is much more
              explicit about network governance than corporate governance. Official posts explain the path from four
              team-run validators on testnet to partner validators and eventually a permissionless validator set, but
              none of the public materials reviewed disclose a board roster, committee structure, voting rights, or
              preference stack. That asymmetry matters: the validator roadmap shows how the chain might decentralize,
              while the company behind it remains structurally opaque. For diligence, Matt Huang concentration and the
              absence of formal governance disclosures are the main leadership risks.
