chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and founding story
        blocks:
          - type: paragraph
            body: >
              Tempo presents itself as a blockchain built for real-world payments via stablecoins rather than as a
              general-purpose crypto network. The official launch narrative is consistent across Tempo and Paradigm:
              Stripe contributed payments operating experience, Paradigm contributed crypto infrastructure expertise,
              and the resulting company was built to solve specific workflow problems such as global payouts,
              remittances, tokenized deposits, and agentic micropayments. The product pitch emphasizes
              stablecoin-denominated gas, dedicated payment lanes, built-in memo fields, and EVM compatibility on top of
              Reth, all of which are meant to make payment operations more predictable than on trading-led chains.
              Public evidence is clearer about the product than about the legal entity. Tempo's own site does not
              publish a street address or incorporation record, but Built In and F6S both place the company in San
              Francisco. Likewise, official material clearly shows a September 2025 public launch window, while the
              exact legal founding date remains opaque. That means the best-supported founding story is operational
              rather than corporate: Tempo is a newly launched, jointly incubated payments chain whose go-to-market is
              being validated through enterprise design partners and infrastructure providers rather than through
              disclosed financial results.
