      - - Partner conversion weak
        - Fewer than two flagship partners in scaled paid production by the next financing event
        - Turns the logo set into signaling rather than durable demand proof
        - Treat partnership announcements as marketing, not valuation support.
      - - Fee capture too low
        - Validator, treasury, and settlement economics imply throughput without attractive net revenue
        - High volume alone cannot justify venture returns if economics are utility-like
        - Re-rate Tempo toward infrastructure utility or orchestration levels.
      - - Regulatory or banking bottleneck
        - Key corridors, custody partners, or compliance pathways are delayed, restricted, or made bank-dependent
        - Enterprise adoption slows and margin shifts toward regulated intermediaries
        - Raise risk premium materially or step away.
      - - Cycle-driven multiple compression
        - Public crypto / payments infrastructure multiples or private marks rerate lower during a risk-off cycle
        - Exit path support disappears before Tempo proves scale
        - Demand a much lower entry price or wait.
    notes: >-
      Kill triggers are investor discipline rules tied to evidence and price, not predictions about what management will
      or will not do.
    claimRefs:
      - CV014
      - CV032
      - CV033
      - CV034
      - CV039
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue / payment volume
        - Current monthly annualized payment volume, net revenue, gross margin, and take rate by product or corridor
        - This is the core missing input for any $5B underwriting case
        - Request CFO data-room package and board-approved KPI deck.
      - - Customer conversion
        - Named-partner funnel from design partner to live paid production, including renewal or churn data
        - Separates signal-rich logos from real commercial traction
        - Review GTM pipeline and cohort-level production accounts with CRO or COO.
      - - Cap table / seniority
        - >-
          Latest cap table, liquidation preferences, participation rights, secondary sales, option pool, debt, and token
          warrants
        - Unknown seniority and dilution can erase nominal upside at the last round price
        - Obtain legal diligence set plus latest financing documents.
      - - Validator / treasury economics
        - Fee split among validators, treasury, and any reserve-yield or settlement participants
        - Determines whether volume can become attractive equity economics
        - Request protocol-economics memo and treasury policy.
      - - Regulatory / banking dependencies
        - >-
          Licenses, compliance controls, sanctions tooling, banking partners, custody setup, and corridor-specific
          constraints
        - Institutional adoption depends on these controls more than on chain speed alone
        - Run legal, compliance, and banking-reference diligence.
      - - Exit path
        - Likely acquirers, IPO readiness, audited controls, and reporting cadence
        - A $5B entry needs a believable path to a much larger or very strategic exit
        - Test with management and sector bankers before underwriting.
    notes: >-
      These diligence asks are the minimum package required before treating the last reported valuation as an investable
      entry point.
    claimRefs:
      - CV014
      - CV015
      - CV037
      - CV038
      - CV039
      - CV042
