      - number: '2.2'
        title: 'Sizing lenses: a huge parent market, but a much narrower usable payments slice'
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a large opportunity, but they do not support a single clean Tempo TAM. At the
              broadest end, the IMF estimates that traditional plus crypto cross-border payments approached about $1
              quadrillion in 2024, with crypto still only a small fraction of that total. At the next layer down, World
              Bank remittance data shows that legacy cross-border rails still carry meaningful friction, especially for
              smaller transfers and bank-led corridors. Below that, stablecoin estimates diverge sharply by methodology.
              Castle Island and Visa estimate denoised aggregate stablecoin settlement at a $5.28 trillion annualized
              pace in 2024; Stripe cites $27.6 trillion of 2024 stablecoin transfer volume; Morph and CoinLaw push 2025
              rails volume to roughly $33 trillion; Artemis’s bottoms-up work attributes only about $118 billion of
              annualized payment settlements in August 2025. These figures are not directly comparable, but that
              mismatch is itself informative: Tempo’s real addressable market is much closer to the narrower
              business-payment layers than to raw onchain turnover. Public data is strong enough to bound the market,
              but not strong enough to publish a precise public SAM or SOM without internal corridor and customer-mix
              data.
