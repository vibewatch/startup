      - number: '1.4'
        title: Milestones, design partners, and adverse context through 2026
        blocks:
          - type: paragraph
            body: >
              Tempo moved quickly from announcement to commercialization. After the September 2025 unveiling, it
              disclosed its first infrastructure partners later that month, added Dankrad Feist in October, reported a
              $500 million Series A in the same month, and opened its public testnet in December. By March 2026 it had
              launched mainnet and the Machine Payments Protocol, with Stripe subsequently adding Tempo as a supported
              crypto network in its API changelog. From April through June 2026, the story shifted from design intent to
              operating milestones: Stripe, Visa, and Zodia Custody joined as validators; DoorDash described stablecoin
              settlement work for a 40+ country marketplace; MoneyGram became the first remittance validator and
              settlement partner; Flutterwave framed Tempo as a new cross-border settlement rail for 34 African markets;
              Kraken positioned itself as Tempo's first U.S. centralized-exchange infrastructure stack; and Stripe
              itself used Tempo in its streaming-payments launch for AI-native billing. This pace of partner news is the
              company's strongest public progress signal, but it sits beside clear risk flags. BizBrief explicitly
              questioned whether the pace and size of the raise reflected startup-bubble enthusiasm, and criticism
              around Dankrad Feist's move showed how quickly Tempo can become a lightning rod in the
              open-source-versus-corporate blockchain debate. More structurally, U.S. regulators and congressional
              analysis still warn that payment stablecoins face AML, reserve-quality, run-risk, and implementation
              uncertainty. Tempo's milestones are real, but the regulatory and disclosure burden has not caught up to
              the ambition of the story.
