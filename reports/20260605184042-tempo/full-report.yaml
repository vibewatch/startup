  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: stablecoin payments infrastructure, not generic crypto'
        blocks:
          - type: paragraph
            body: >-
              Tempo is best framed as infrastructure for stablecoin-native business payments rather than as a
              general-purpose blockchain or a proxy for all crypto activity. Tempo’s own positioning centers on
              real-world stablecoin payments, and its current use-case pages focus on global payouts, cross-border
              supplier payments, payroll, remittances, and tokenized-money movement. That boundary matters because broad
              stablecoin statistics still contain a large amount of trading, DeFi liquidity, and exchange settlement
              activity. ECB and Castle Island evidence both show why raw ecosystem numbers can mislead: stablecoins are
              critical to crypto-market liquidity, and even adjusted settlement data needs de-noising before it
              resembles payment activity. For diligence purposes, the included spend is software and infrastructure that
              helps enterprises move, reconcile, control, and comply around stablecoin flows across payouts, B2B
              settlement, treasury, payroll, and merchant or marketplace settlement. Excluded spend includes speculative
              trading volume, general crypto investing, and traditional payments software that never touches stablecoin
              issuance, onchain settlement, or related compliance and reconciliation workflows.
