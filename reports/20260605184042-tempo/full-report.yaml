        title: Exhibits
        blocks:
          - type: callout
            title: A strong company story is not yet a public $5B underwriting case
            body: >-
              Tempo may be building a valuable payments asset, but public evidence still does not show the revenue,
              payment-volume, or cap-table detail needed to underwrite the last reported valuation with confidence.
            calloutType: recommendation
