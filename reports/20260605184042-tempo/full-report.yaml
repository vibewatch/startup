  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Payment product scope and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Tempo is not selling a generic smart-contract chain and hoping payments happen on top. Its own launch,
              testnet, and mainnet materials consistently define the product in workflow terms: global payouts, payroll,
              remittances, embedded financial accounts, tokenized deposits, merchant settlement, microtransactions, and
              agentic payments. The live stack now spans the core L1, TIP-20 issuance and compliance controls, a
              stablecoin-native fee and exchange layer, Tempo Transactions for sponsorship/batching/scheduling, and the
              Machine Payments Protocol with sessions and a payments directory. That product packaging matters because
              it pushes key payment behaviors—memo-based reconciliation, stablecoin fee abstraction, and large payout
              batching—down into protocol or transaction layers rather than leaving them to application middleware. The
              result is a clearer buyer story for fintechs, marketplaces, and AI-service operators, but it also means
              many claims about scalability and operational smoothness are still product claims awaiting broad public
