      - number: '8.5'
        title: 'Kill triggers and diligence asks: what must be true before paying up'
        blocks:
          - type: paragraph
            body: >-
              The biggest remaining work is not thematic research; it is private-company diligence. Regulators and
              policy institutions continue to warn that stablecoins can create run risk, operational risk, and systemic
              linkages as they move into mainstream payment flows. Those warnings do not kill the Tempo thesis, but they
              do mean enterprise adoption will favor providers that can document compliance, banking access, reserve
              handling, and reliable operational controls. For Tempo specifically, the decisive missing items are
              commercial and structural: live payment volume by corridor, realized net revenue and gross margin, proof
              that named partners are actually paying in production, and a current cap table with preference and
              dilution details. Without those, investors can describe the upside but cannot properly size the downside.
              The kill triggers are therefore practical: if monetization proof still is not visible after mainnet, if
              partner conversion stays mostly narrative, or if regulation forces stablecoin economics into
              bank-controlled channels, the $5 billion mark becomes much harder to defend.
            claimRefs:
              - CV014
