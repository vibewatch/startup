      - number: '1.3'
        title: Capitalization, investors, and disclosed metrics
        blocks:
          - type: paragraph
            body: >
              Tempo's financing story is unusually large relative to the thinness of its public-company-style
              disclosure. Multiple outlets reported that Tempo raised a $500 million Series A at a $5 billion valuation
              in October 2025, led by Greenoaks and Thrive Capital with Sequoia, Ribbit Capital, and SV Angel also
              participating. Those reports also said Stripe and Paradigm incubated the company but did not contribute
              fresh capital to the round. That distinction matters because it suggests Tempo entered its first visible
              institutional financing round with strategic sponsorship already in place, while outside investors priced
              the stand-alone business at a very high level before revenue, customer count, or margin disclosures were
              made public. The strongest public traction signals are therefore indirect. Tempo disclosed 12 named launch
              design partners, 100+ services in the payments directory at mainnet, 40 additional infrastructure partners
              by December 2025, and a series of 2026 partner activations with DoorDash, MoneyGram, Flutterwave, Kraken,
              and others. Those are meaningful adoption signals, but they are not substitutes for booked revenue or
              contracted customer counts. Headcount is similarly incomplete: CoinDesk reported a 15-person team at
              launch, but current 2026 headcount is not public. In practice, Tempo looks like a heavily capitalized,
              strategically sponsored, post-Series-A company whose commercial momentum is visible through ecosystem
              milestones rather than conventional operating KPIs.
