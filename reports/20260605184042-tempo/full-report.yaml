      - number: '5.4'
        title: Performance and technical positioning versus peers
        blocks:
          - type: paragraph
            body: >-
              Tempo’s positioning is easiest to understand in contrast with other payment-adjacent chains. Versus Base,
              Tempo offers a purpose-built L1 with deterministic finality and stablecoin-denominated fees, while Base
              inherits an L2 fee stack and delayed withdrawal finality from Ethereum. Versus Solana, Tempo competes on
              payment abstractions—memos, fee sponsorship, batching, and low predictable fees—but Solana already
              publishes public-network payment performance figures around ~400ms secured funds and sub-cent costs.
              Versus XRPL and Stellar, Tempo is closer to Ethereum in execution model while trying to preserve
              payment-network ergonomics; the trade is that XRPL and Stellar still rely on native-fee assets and older
              payment-focused consensus and liquidity designs, whereas Tempo centers stablecoins and EVM
              programmability. The competitive upside is clear: Tempo makes stablecoin payments feel native. The
              downside is that it must prove that this more ambitious stack can deliver peer-level reliability and
              decentralization under real load, not just in documentation and partner decks.
