  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Verdict and entry discipline: strong company signal, weak public price support'
        blocks:
          - type: paragraph
            body: >-
              Tempo looks like a serious company in an important market. Official material and partner posts support
              that it has shipped mainnet, launched the Machine Payments Protocol, attracted high-quality validators,
              and won attention from enterprises that actually move money. That is enough to support an investable
              company thesis. It is not enough to support a fresh $5 billion entry price on public evidence alone. Tempo
              is private, and the retained public record still does not disclose current revenue, annualized payment
              volume, fee take rate, gross margin, live paid-customer count, or cap-table terms. At the same time, the
              October 2025 Series A already priced in unusually high expectations for partner conversion, monetization,
              and category leadership. The right judgment is therefore price-sensitive rather than company-blind: Tempo
              may become a very important payments asset, but at roughly $5 billion the public record supports a
              track-or-research-more posture, not an aggressive lead-the-round stance.
            claimRefs:
