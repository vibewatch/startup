        - id: n3
          label: Security / code assurance gap
          description: Audits still in progress; public vulnerabilities already found
        - id: n4
          label: Partner and issuer dependency
          description: Stripe, Paradigm, anchor validators, issuers, and compliance vendors
        - id: n5
          label: Production adoption shortfall
          description: Design partners stay in pilot mode or volumes remain undisclosed
        - id: n6
          label: Margin and treasury pressure
          description: Higher compliance cost, fallback operations, and fragile corridor economics
        - id: n7
          label: Customer / investor trust loss
          description: Users and investors doubt resilience, neutrality, or go-live readiness
        - id: n8
