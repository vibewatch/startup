  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Apps, wallets, and custody front ends
        - Initiate payments, render balances, and abstract Tempo-specific transaction logic
        - Wallet support must suppress native-balance assumptions and handle fee-token choice
        - Generic Ethereum wallets can mis-handle no-native-token semantics or default-fee behavior.
      - - Tempo Transactions layer
        - Adds sponsorship, batching, scheduling, passkeys, and concurrent nonce lanes
        - Requires Tempo-specific transaction type support in SDKs and wallets
        - Custom typed transactions increase integration work versus plain EVM chains.
      - - TIP-20 + TIP-403 token layer
        - Defines stablecoin issuance, memos, RBAC, rewards, and transfer policies
        - Issuers must manage policy registries, roles, and fee-liquidity routing
        - Misconfigured policies or paused tokens could interrupt payment flows across apps and zones.
      - - Fee AMM / stablecoin DEX
        - Converts user-paid fees into validator-preferred tokens and supports stablecoin swaps
        - Depends on liquid USD TIP-20 pools and correct validator/user fee-token preferences
        - Thin liquidity or routing changes can impair fee-token flexibility and execution quality.
      - - Reth EVM execution and RPC surface
        - Runs contracts and exposes Ethereum-compatible tooling
        - Depends on Reth, gas estimation tweaks, and Tempo-specific fee semantics
        - Higher state-creation costs and custom fee handling can surprise generic EVM integrations.
      - - Simplex / Commonware consensus
        - Finalizes blocks and payment ordering with BFT semantics
        - Bounded validator set, DKG ceremonies, peer connectivity, and epoch transitions
        - Committee concentration or DKG failure would directly affect liveness and censorship resistance.
      - - Partner RPC / validator / custody infrastructure
        - Provides managed validators, dedicated endpoints, data streaming, and wallets
        - External vendors such as Blockdaemon and BitGo maintain critical operational surface area
        - Enterprise adoption can become dependent on a small set of infrastructure vendors.
      - - Zones and privacy operators
        - Run private parallel chains and enforce visibility / inclusion model
        - Operator correctness, Tempo Mainnet escrow contracts, and signed RPC auth
        - Users gain privacy from the public, but must trust operators for availability and confidentiality boundaries.
    notes: >-
      This architecture table combines protocol-native components with the offchain infrastructure assumptions
      explicitly embedded in Tempo’s public integration materials.
