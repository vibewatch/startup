  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Tempo is not competing in a vacuum. The direct chain alternatives for enterprise stablecoin settlement are
              public networks that already market payments or business-grade finance usage: Solana, Base, Stellar, and
              XRPL. Around those chains sits an adjacent infrastructure layer made up of Circle CPN and Arc, Fireblocks,
              and Bridge, all of which help institutions route, custody, and orchestrate stablecoin flows without
              forcing a customer to standardize on Tempo as the base chain. Plasma adds a vertically aligned
              stablecoin-chain model with a trusted launch path, while bank-issued tokenized deposits and internal
              bank-led ledgers remain the most credible substitute for buyers whose first priority is regulated
              balance-sheet money rather than open-network reach.


              That means Tempo's buyer is rarely choosing only between blockchains. In many evaluations the real
              decision is whether to adopt a new settlement chain at all, or instead to buy orchestration on top of
              existing chains or keep payment logic inside a bank-controlled environment. Tempo's competitive set
              therefore spans direct public-chain peers, incumbent infrastructure vendors, adjacent stablecoin
              ecosystems, and regulated substitutes. That breadth matters because different rivals win for different
              reasons: Solana for public-chain speed, Base for Coinbase distribution and EVM familiarity, Stellar and
              XRPL for existing payment credibility, Circle or Fireblocks for enterprise integration, Plasma for
              house-asset alignment, and tokenized deposits for prudential comfort.
