  topStrengths:
    - >-
      Stripe and Paradigm incubation gives Tempo unusual distribution, payments-domain credibility, and access to
      enterprise design partners for a newly launched chain.
    - >-
      Public product evidence is concrete: Tempo launched testnet and mainnet quickly, supports stablecoin-denominated
      fees, and has shipped payment-specific workflow features rather than a generic crypto narrative.
    - >-
      Named partner and validator activity from Stripe, Visa, MoneyGram, Flutterwave, Kraken, and others suggests real
      ecosystem pull beyond a speculative token launch.
  topRisks:
    - >-
      Public sources still do not disclose revenue, payment volume, take rate, gross margin, cap-table terms, or board
      structure, leaving investors unable to underwrite economics or downside cleanly.
    - >-
      Stablecoin-payment regulation, AML expectations, reserve-quality rules, and bank-controlled distribution could
      compress Tempo's economics or slow enterprise adoption.
    - >-
      The company remains highly dependent on Matt Huang, Stripe, Paradigm, and a small set of marquee partners to
      convert narrative momentum into durable commercial proof.
  unresolvedGaps:
    - >-
      Live paid production volume, take rate, and gross-margin evidence by major partner or corridor are still
      undisclosed.
    - >-
      Current cap table, liquidation preferences, board composition, and any token-linked economics senior to common
      equity remain private.
    - >-
      Design-partner conversion into contracted, revenue-bearing customers is still only partially evidenced in public
      sources.
    - Exact legal founding date and company-published headquarters information still need confirmation.
