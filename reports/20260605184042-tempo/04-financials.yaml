  figureRefs:
  - FI003
  - FI004
- id: peer-benchmarks-and-risks
  title: 'Peer disclosures and downside case: payment-chain upside exists, but margin path is still speculative'
  body: >-
    Comparable disclosures from public crypto infrastructure peers show why investors can believe in Tempo’s model and why the remaining risk is still large. Coinbase’s Q3 2025 shareholder letter demonstrates that a crypto infrastructure company can monetize multiple payment-adjacent layers at once: transaction activity, stablecoin balances, and blockchain rewards. The same disclosure also shows the danger of scale economics: Base revenue grew with higher usage, but revenue per transaction fell as the network pushed costs down. Arbitrum’s fee-distribution documentation makes the trade-off even more explicit: routing fees back to users, developers, or treasury can improve adoption but also reduces chain revenue. Tempo’s public materials do not yet say where on that spectrum it will land. That creates the central downside case. A new payments-focused chain can win design partners, recruit talent, and raise substantial capital while still failing to prove durable fee capture, validator incentives,
    or enterprise usage through a crypto downcycle. The financial verdict is therefore mixed. The business has a credible payments architecture and a strong funding/partnering narrative, but public evidence is still too thin to underwrite revenue quality, margin path, or long-run equity economics with high conviction.
  claimRefs:
