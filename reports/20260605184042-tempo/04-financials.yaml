- id: TI002
  title: Pricing / monetization table
  columns:
  - price/unit/contract
  - list vs realized pricing
  - discounts/unknowns
  - source
  rows:
  - - 'TIP-20 transfer: < $0.001'
    - List-level protocol target visible in GitHub and partner docs
    - Realized effective fee depends on gas used and is not shown by production customer or lane
    - Tempo GitHub / BitGo
  - - 'AA transaction (P256): ~ $0.001'
    - Illustrative partner-doc estimate
    - No realized customer examples; volume discounts or sponsorship economics undisclosed
    - BitGo
  - - 'Batch transaction (3 calls): < $0.002'
    - Illustrative partner-doc estimate
    - No realized cost curves by call count or enterprise batch size
    - BitGo
  - - Stablecoin gas / fixed base fee
    - Publicly documented fee model
    - No public fee schedule table by transaction type, validator, or lane beyond examples
    - Tempo home / BitGo / README
  - - Enterprise contracts or service fees
    - No public price card
    - Discounting, minimum commits, rev shares, and onboarding fees unavailable
    - No public disclosure
  notes: This table captures visible list pricing only; it does not imply realized revenue or gross margin.
