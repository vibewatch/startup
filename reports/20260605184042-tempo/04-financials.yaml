tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value/status
  - quality
  - diligence ask
  rows:
  - - Network transaction fees
    - Stablecoin-denominated gas on TIP-20 transfers and Tempo Transactions
    - per transaction
    - Publicly evidenced; basic transfers target < $0.001 and AA / batch transactions are also sub-cent
    - Highest-confidence public stream
    - >-
      Provide monthly transactions, gross fee revenue, net fee revenue, and realized fee per transaction by product flow.
  - - Validator fee income
    - >-
      Validators earn transaction fees, with user-paid stablecoins converted via Fee AMM into validator-preferred assets
    - share of fee pool
    - Publicly described, but exact reward split, minimum participation, and yield rates are undisclosed pre-mainnet
    - Medium
    - Provide validator revenue-share formula, treasury take, and target validator ROI at launch and steady state.
  - - Stablecoin DEX / conversion economics
    - Built-in stable asset DEX and Fee AMM could create spread or routing economics
    - spread / swap fee
    - >-
      Mechanism exists, but no public source discloses who captures spread economics or whether fees accrue to treasury, validators, or liquidity providers
    - Low
    - Provide AMM fee schedule, spread assumptions, LP incentives, and accounting treatment for conversion revenue.
  - - Enterprise partnership revenue
    - >-
      Commercial partnerships and customer-success roles imply service or enablement economics around launch and integration
    - contract / implementation fee
    - Not publicly disclosed; partnership announcements do not confirm paid contracts
    - Low
    - >-
      Provide signed enterprise contracts, pricing model, minimum commits, and services mix versus pure network-fee revenue.
  - - Token or treasury monetization
    - Possible governance, token, or treasury economics beyond stablecoin fees
    - token / treasury capture
    - Unsupported today; public docs emphasize no native gas coin and do not disclose any tokenomics roadmap
    - Low
    - State whether a token, treasury-seigniorage, or revenue-share model exists and who benefits economically.
  notes: >-
    Rows separate public fee mechanics from inferred but undisclosed monetization surfaces; lack of disclosure is intentional and should not be read as zero economics.
