callouts:
- calloutType: strength
  title: The fee mechanism is real even if fee capture is opaque
  body: >-
    Tempo’s pricing and stablecoin-gas mechanics are repeatedly documented across official and partner materials, so the revenue mechanism is not speculative. What remains speculative is who ultimately keeps the economics once fees are routed through validators and any AMM logic.
  claimRefs:
  - CI003
  - CI004
  - CI014
  - CI032
- calloutType: risk
  title: Validator economics are still pre-mainnet disclosures, not proven unit economics
  body: >-
    Partner documentation explicitly says reward structures, fee schedules, yield rates, and minimum participation requirements are still to be finalized. That leaves a core security-and-margin question unresolved at the chapter level.
  claimRefs:
  - CI013
  - CI014
  - CI015
- calloutType: assumption
  title: The Series A supports launch confidence, not runway confidence
  body: >-
    A reported $500 million raise materially lowers immediate financing risk, but without burn, cash, and cap-structure data it should be treated as a valuation anchor and solvency signal, not as a completed runway model.
  claimRefs:
  - CI018
  - CI019
  - CI031
  - CI042
- calloutType: recommendation
  title: Demand more private data before underwriting a $5B valuation
  body: >-
    Tempo has a credible payments architecture and high-quality ecosystem signals, but public evidence is still too thin on monetized usage, gross margin, validator economics, and cap structure to support a high-conviction financial underwriting case at the reported valuation.
  claimRefs:
  - CI019
  - CI029
  - CI030
  - CI032
