company:
  name: Tempo
chapter:
  number: 4
  title: Financials
  summary: >-
    Tempo’s public record makes the fee mechanism clear and the revenue model plausible, but it stops well short of disclosing realized monetization, margin, or runway. A widely reported $500 million Series A at a roughly $5 billion valuation gives a valuation anchor and some comfort on launch funding, yet fee capture, validator economics, token economics, burn, runway, and cap structure all remain materially undisclosed.
sections:
- id: financial-model
  title: 'Revenue model and pricing: fee-based rails are clear, realized monetization is not'
  body: >-
    Tempo’s public materials make the top of the revenue funnel clearer than the bottom. The company repeatedly positions itself as a payments-first chain built for stablecoins, and the clearest monetization surface in that record is transaction fees paid in USD stablecoins on TIP-20 transfers and Tempo Transactions. Official and partner documentation support a fixed-fee model with sub-millidollar transfer pricing, stablecoin-denominated gas, and a Fee AMM that converts user-paid fees into the validator’s preferred asset. That is enough to conclude that transaction fees are real and intentionally enterprise-friendly. It is not enough to conclude how much gross revenue Tempo keeps per transaction, how fees split across validators or any treasury, whether the AMM embeds spread capture, or what realized enterprise pricing looks like in production. Public sources also do not show a second monetization surface with the same clarity. Partnership announcements and hiring can support a hypothesis
    of enterprise services or commercial relationships around onboarding, settlement, and network operations, but they do not disclose contract values or recurring software revenue. As a result, the underwriting picture is straightforward: list pricing is visible, but revenue mix, fee capture, and revenue quality remain mostly undisclosed.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI014
  - CI016
  - CI028
  - CI029
  - CI032
  - CI043
  - CI044
  - CI045
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-and-unit-economics
  title: 'GTM motion and unit economics proxies: strong commercial intent, weak public conversion data'
  body: >-
    Tempo’s go-to-market signal is unusually enterprise-heavy for an early blockchain network. The design-partner list spans banks, fintechs, large merchants, AI companies, and cross-border payment players, while the infrastructure-partner roster covers custody, analytics, compliance, wallets, interoperability, and developer tooling. Built In postings further show hiring in commercial partnerships, customer success, product engineering, infrastructure, legal, communications, and controller functions. Together these signals point to a deliberate B2B commercialization motion rather than a consumer-token launch. They also imply meaningful operating expense before large-scale network revenue is proven. What the signals do not provide is customer conversion or sales efficiency. There is no public disclosure of sales cycle length, contract minimums, channel economics, paid design-partner conversions, or CAC/payback. The absence matters because Tempo’s visible price points are tiny. With transfer
    costs measured below a cent, revenue needs enormous payment volume, high-value settlement flows, or ancillary monetization to become meaningful. Hiring and ecosystem breadth support a thesis of growing commercial readiness; they do not convert into revenue quality until Tempo shows paid production usage and realized fee yield.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI017
  - CI023
  - CI026
  - CI027
  - CI029
