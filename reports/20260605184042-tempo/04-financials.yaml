- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metrics
  - impact
  - exact diligence path
  rows:
  - - Revenue, ARR, run-rate, GMV, and paid transaction volume
    - Cannot connect tiny visible fee prices to actual revenue scale or growth
    - Request monthly transaction volume, GMV, revenue by stream, and top-customer concentration.
  - - Realized fee yield and enterprise pricing
    - List prices may overstate or understate monetization if sponsorship or discounts are common
    - Request realized fee per transaction, pricing waterfall, discount policy, and signed contract samples.
  - - Gross margin and cost stack
    - Without margin, low pricing could imply an attractive rails model or a structurally weak one
    - Request gross-margin bridge including validator, data, compliance, and partner support costs.
  - - Burn, cash, and runway
    - Capital adequacy cannot be underwritten from a headline Series A alone
    - Request monthly burn, current cash, 24-month operating plan, and downside runway model.
  - - Validator economics and fee-capture split
    - Unknown security economics make long-run network sustainability and treasury capture hard to model
    - Request validator payout model, fee-routing logic, and AMM spread capture policy.
  - - Cap structure and financing terms
    - Valuation without terms can misstate dilution and downside protection
    - Request cap table, financing documents, preference stack, and any debt or token-warrant arrangements.
  notes: Every row is a disclosed gap that blocks full underwriting rather than a theoretical wish list.
