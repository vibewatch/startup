- id: TI003
  title: Unit economics table
  columns:
  - metric
  - value/null
  - confidence
  - why it matters
  - diligence ask
  rows:
  - - Basic transfer list price
    - < $0.001
    - High
    - Shows Tempo is pricing for very high-volume payments rather than software-like ARPU
    - Provide realized average fee per transaction by use case and customer cohort.
  - - AA transaction list price
    - ~ $0.001
    - Medium
    - Shows programmable payments remain inexpensive on paper
    - Provide production cost distribution and fee sponsorship incidence.
  - - Batch transaction (3 calls)
    - < $0.002
    - Medium
    - Suggests batching can compress cost per instruction
    - Provide batch-size elasticity and enterprise payroll or payout examples.
  - - Revenue / ARR / run-rate
    - null
    - Low
    - Without monetized volume, list pricing cannot be turned into revenue quality
    - Provide monthly revenue, run-rate, and revenue mix by stream.
  - - Gross margin
    - null
    - Low
    - Critical for judging whether tiny transaction pricing is sustainable
    - Provide gross-margin waterfall including data, validator, and partner costs.
  - - CAC / payback / sales cycle
    - null
    - Low
    - Design-partner lists do not show the cost to land and scale accounts
    - Provide pipeline conversion, deal-cycle length, CAC, and payback by segment.
  - - Validator reward rate
    - null
    - Low
    - Network security and decentralization depend on economically viable validators
    - Provide launch validator economics, stake requirements, and payout schedule.
