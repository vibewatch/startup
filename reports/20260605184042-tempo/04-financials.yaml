  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy
  title: 'Capital adequacy and valuation: a large reported Series A, but no public runway math'
  body: >-
    The most cited financial data point in public coverage is the reported $500 million Series A at an approximately $5 billion valuation. Independent outlets broadly agree on the size, valuation anchor, and investor set, with Thrive Capital and Greenoaks leading and Stripe plus Paradigm reportedly sitting out the round despite incubating the company. That headline capital matters because Tempo is building a new chain, ecosystem, and enterprise network simultaneously. However, the public record still stops short of actual capital adequacy. Neither official materials nor reviewed secondary sources disclose cash on hand after closing, hiring burn, infrastructure commitments, launch spend, or runway in months. The same opacity applies to cap structure: no public filing or accessible term-level source in the reviewed set surfaced liquidation preferences, board rights, debt, or any token-warrant structure. Validator economics are also unfinished enough that network-level cash-flow sharing cannot
    be modeled confidently. The reported round therefore functions as a valuation anchor and a rough proof of financing capacity, not as a complete answer on solvency or dilution. Without management data, the Series A improves confidence that Tempo can fund launch, but it does not close the underwriting case on runway or capital intensity.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI015
  - CI018
