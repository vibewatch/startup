  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: validator-economics
    missingEvidence: >-
      Tempo and partner materials do not publish a finalized validator reward split, minimum stake, treasury take, or fee-schedule table ahead of mainnet.
    whyItMatters: Without a finalized reward schedule, validator ROI and network-security incentives cannot be underwritten.
    diligencePath: >-
      Request the mainnet economics deck, validator onboarding terms, target validator count, minimum participation thresholds, and expected fee split between validators, treasury, and any AMM or liquidity providers.
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: fee-capture-and-token-economics
    missingEvidence: >-
      Public sources show stablecoin gas and a Fee AMM but do not disclose conversion-spread capture, treasury economics, or any governance-token roadmap.
    whyItMatters: >-
      Fee-capture design determines gross margin, treasury accumulation, and whether enterprise volume accrues to equity value or only to network participants.
    diligencePath: >-
      Request protocol-level fee-routing documentation, AMM spread assumptions, treasury policy, and any future token or governance-rights plan.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: >-
      No public data discloses Tempo cash on hand after the Series A, monthly burn, hiring burn, infrastructure commitments, or runway in months.
    whyItMatters: >-
      Capital adequacy cannot be underwritten without knowing how fast the company is spending against its reported raise.
    diligencePath: >-
      Request monthly cash balance, monthly net burn, 12- to 24-month operating plan, vendor commitments, and downside runway scenarios.
    relatedQuestionRefs:
    - QI015
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: series-a-terms-and-cap-structure
    missingEvidence: >-
      No reviewed public source disclosed the security type, cap-table composition, preference stack, pro-rata rights, board rights, or any debt attached to Tempo’s financing.
    whyItMatters: Valuation without terms can materially misstate downside protection, dilution, and equity-holder economics.
    diligencePath: >-
      Request the cap table, financing documents, board rights summary, investor rights agreement, and any debt or project-finance side letters.
    relatedQuestionRefs:
    - QI014
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-and-commercial-metrics
    missingEvidence: >-
      No public evidence discloses revenue, GMV, active enterprise usage, take rate, paid design-partner conversions, or gross margin by revenue stream.
    whyItMatters: The company can have strong ecosystem interest while still lacking monetized, repeatable production volume.
    diligencePath: >-
      Request monthly transaction volume, fee revenue by stream, paid partner conversions, realized enterprise pricing, customer concentration, and gross margin waterfall.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI008
    - QI021
    - QI024
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
