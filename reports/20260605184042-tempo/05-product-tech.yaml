  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      A typical Tempo payment flow starts with a stablecoin-funded app or wallet and ends with
      immediate settlement plus optional reconciliation, liquidity conversion, or private-zone
      handling.
    data:
      nodes:
        - id: n1
          label: Fund wallet / custody account
          detail: User or application starts with a USD-denominated TIP-20 balance or sponsored-fee setup.
          tone: neutral
        - id: n2
          label: Compose Tempo Transaction
          detail: App chooses sponsorship, batching, scheduling, memos, and fee-token behavior.
          tone: positive
        - id: n3
          label: Use payment lane blockspace
          detail: >-
            TIP-20 payment flow enters reserved payment blockspace rather than generic demand
            queues.
          tone: positive
        - id: n4
          label: Fee AMM conversion if needed
          detail: If user and validator prefer different fee tokens, protocol converts at fixed AMM rates.
          tone: positive
        - id: n5
          label: Simplex BFT finalization
          detail: >-
            Validators order and finalize the payment with deterministic, sub-second settlement
            targets.
          tone: positive
        - id: n6
          label: Reconcile / off-ramp / zone transfer
          detail: >-
            Memo fields, partner infrastructure, or Zones move the payment into treasury, custody,
            or private workflows.
          tone: warning
      edges:
        - from: n1
          to: n2
          label: Prepare payment
        - from: n2
          to: n3
          label: Submit
        - from: n3
          to: n4
          label: If fee token differs
        - from: n4
          to: n5
          label: Settle
        - from: n5
          to: n6
          label: Post-settlement operations
    approximationNotes: >-
      The flow shows the common operating path rather than every possible branch, especially for
      app-sponsored or zone-mediated transactions.
    claimRefs:
      - CE002
      - CE005
      - CE008
      - CE014
      - CE015
