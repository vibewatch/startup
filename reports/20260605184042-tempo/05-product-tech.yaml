  - id: developer-surface-and-integration-assumptions
    title: Developer surface and integration assumptions
    body: >-
      Tempo’s product design assumes that developers, wallets, and payment operators want to keep
      the EVM toolchain but avoid rebuilding payment infrastructure around it. Tempo Transactions
      are therefore a core architectural surface, not a peripheral SDK feature: they add fee
      sponsorship, access keys and passkeys, batching, concurrent nonces, and scheduled execution
      directly at the transaction layer. The integration burden moves from writing custom contracts
      and relayers toward adapting wallet logic for fee-token selection, native-balance quirks, and
      Tempo-specific transaction types. Public GitHub materials, signed releases, and partner
      documentation from Blockdaemon, BitGo, and Turnkey show that the ecosystem is already
      packaging managed validators, RPC endpoints, wallet flows, and transaction-policy tooling
      around Tempo. That is a real go-to-market advantage for enterprise onboarding, but it also
      means the operating model depends heavily on offchain providers—RPC operators, custody
      vendors, compliance engines, and treasury systems—staying aligned with Tempo’s custom payment
      primitives rather than just generic Ethereum behavior.
    claimRefs:
      - CE011
      - CE012
      - CE023
      - CE024
