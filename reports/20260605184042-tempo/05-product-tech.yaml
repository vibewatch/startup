  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Tempo’s payment promise depends not only on protocol code, but also on validators, stablecoin
      issuers, liquidity, compliance vendors, and enterprise infrastructure partners.
    data:
      nodes:
        - id: tempo-core
          label: Tempo core L1
          type: system
          detail: Reth-based execution plus Simplex consensus and payment-native transaction types.
        - id: validators
          label: Bounded validator set
          type: dependency
          detail: >-
            Invited validators provide ordering, liveness, and fee collection until permissionless
            expansion matures.
        - id: issuers
          label: TIP-20 issuers and policy admins
          type: dependency
          detail: Stablecoin issuers define fee-eligible tokens, transfer rules, and freezes.
        - id: liquidity
          label: Fee AMM / DEX liquidity
          type: dependency
          detail: >-
            Stablecoin fee conversion and cross-stablecoin flows depend on sufficient onchain
            liquidity.
        - id: infra
          label: RPC, custody, and wallet partners
          type: dependency
          detail: >-
            Blockdaemon, BitGo, Turnkey, and similar providers make the chain operable for
            enterprises.
        - id: compliance
          label: Security and AML partners
          type: dependency
          detail: Blockaid, Chainalysis, Elliptic, TRM, and TRES support safe institutional usage.
        - id: zones
          label: Zone operators
          type: dependency
          detail: Private deployments depend on operators for visibility, sequencing, and availability.
        - id: customers
          label: Enterprise payment operators
          type: dependency
          detail: >-
            Real-world adoption depends on finance, treasury, and platform teams integrating Tempo
            into existing systems.
