figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Tempo layers payment-native transaction and stablecoin features on top of an EVM execution
      stack and a bounded BFT validator set.
    data:
      layers:
        - label: Application and payment workflow layer
          detail: >-
            Payroll, payouts, remittances, merchant settlement, tokenized deposits, agentic
            payments, and confidential enterprise flows.
        - label: Transaction primitive layer
          detail: >-
            Tempo Transactions add sponsorship, batching, scheduling, concurrent nonces, access
            keys, and passkey-friendly authentication.
        - label: Stablecoin and reconciliation layer
          detail: >-
            TIP-20 tokens, TIP-403 policies, transfer memos, fixed-fee pricing, and fee-token
            selection without a native gas asset.
        - label: Liquidity and routing layer
          detail: >-
            Dedicated Fee AMM plus stablecoin DEX convert user-paid fee tokens and support
            stablecoin-to-stablecoin flows.
        - label: Execution and consensus layer
          detail: >-
            Reth-based EVM execution, JSON-RPC compatibility, Commonware / Simplex BFT consensus,
            and an invited validator committee expanding toward permissionless operation.
    approximationNotes: >-
      This stack abstracts marketing surfaces into architecture layers; public docs do not expose
      every internal service boundary or node role.
    claimRefs:
      - CE004
      - CE011
      - CE012
      - CE014
