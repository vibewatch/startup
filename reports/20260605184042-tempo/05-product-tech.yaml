  - id: performance-and-technical-positioning-versus-peers
    title: Performance and technical positioning versus peers
    body: >-
      Tempo’s positioning is easiest to understand in contrast with other payment-adjacent chains.
      Versus Base, Tempo offers a purpose-built L1 with deterministic finality and
      stablecoin-denominated fees, while Base inherits an L2 fee stack and delayed withdrawal
      finality from Ethereum. Versus Solana, Tempo competes on payment abstractions—memos, fee
      sponsorship, batching, and low predictable fees—but Solana already publishes public-network
      payment performance figures around ~400ms secured funds and sub-cent costs. Versus XRPL and
      Stellar, Tempo is closer to Ethereum in execution model while trying to preserve
      payment-network ergonomics; the trade is that XRPL and Stellar still rely on native-fee assets
      and older payment-focused consensus and liquidity designs, whereas Tempo centers stablecoins
      and EVM programmability. The competitive upside is clear: Tempo makes stablecoin payments feel
      native. The downside is that it must prove that this more ambitious stack can deliver
      peer-level reliability and decentralization under real load, not just in documentation and
      partner decks.
    claimRefs:
      - CE038
      - CE039
      - CE040
      - CE041
      - CE043
      - CE046
    figureRefs:
      - FE004
  - id: security-privacy-roadmap-and-technical-risks
    title: Security, privacy, roadmap, and technical risks
    body: >-
      Tempo’s public trust story is mixed. On the positive side, it already discloses a substantial
      compliance and security-partner stack, a public security contact, open-source repositories,
      signed releases, and a visible cadence of hardening upgrades. On the negative side, the GitHub
      security policy still says the blockchain is undergoing audit and has no active bug bounty,
      and no public audit reports or mainnet incident history were found. Zones improve privacy for
      enterprise workflows, but they also introduce explicit trust assumptions: operators can see
      all in-zone activity, control sequencing and liveness, and may suspend withdrawals or
      transfers under their own compliance rules. More broadly, the network is still evolving
      quickly. The 2026 upgrade schedule includes repeated security and gas changes,
      validator-config changes, payment-lane classification, and multihop FeeAMM routing, with some
      items still upcoming at the report date. Tempo therefore looks technically differentiated and
      commercially purposeful, but it still carries meaningful architecture risk from concentration,
      rapid protocol churn, and incomplete public assurance evidence.
