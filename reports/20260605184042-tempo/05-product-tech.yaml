        - Live mainnet
        - >-
          Stablecoin-native fees, dedicated payment lanes, deterministic BFT settlement, EVM
          compatibility
        - Need public mainnet latency distribution, validator census, and incident history.
      - - TIP-20 token and policy stack
        - Stablecoin issuers, banks, treasury teams
        - Live protocol standard
        - RBAC, TIP-403 compliance policies, transfer memos, reward hooks, DEX quote-token support
        - Need named production issuers and usage volumes beyond design-partner examples.
      - - Fee AMM / stablecoin DEX
        - Wallets, validators, stablecoin issuers, liquidity providers
        - Live core feature; routing still evolving
        - Any-stablecoin fee payment with fixed conversion and built-in stablecoin exchange path
        - Need public liquidity depth, pool concentration, and slippage disclosures.
      - - Tempo Transactions
        - Wallet, app, and payments engineers
        - Live protocol feature
        - Protocol-native sponsorship, batching, concurrency, scheduling, and passkey-friendly auth
        - Need public volume share between Tempo Transactions and plain EVM transactions.
      - - MPP sessions and payments directory
        - AI-agent builders and service providers
        - Live mainnet but early
        - >-
          Rail-agnostic machine-payments standard plus session-based aggregation and service
          discovery
        - Need retention, settlement-failure, and merchant adoption metrics.
      - - Tempo Zones
        - Enterprises, regulated institutions, payroll / treasury operators
        - Design partners + testnet / phased production
        - >-
          Private parallel EVM chains anchored to Mainnet with interoperable assets and
          operator-visible compliance model
        - Need production deployments, operator SLA terms, audits, and named customer references.
    notes: >-
      Rows mix live mainnet features with testnet- and roadmap-stage modules; each maturity label
      reflects the most concrete public status found as of 2026-06-05.
