  - id: l1-architecture-execution-and-validator-model
    title: L1 architecture, execution, and validator model
    body: >-
      Tempo’s core architecture is a custom payments-oriented L1 that keeps Ethereum developer
      ergonomics while rewriting several economic and operational assumptions. Execution is
      EVM-compatible on Reth, JSON-RPC-compatible, and aimed at Solidity, Hardhat, Foundry, and
      standard wallet flows. The key departures are that Tempo has no native gas token, prices fees
      in USD-denominated TIP-20 stablecoins, and uses a fixed-fee model instead of EIP-1559-style
      variable base fees. Dedicated payment lanes reserve blockspace for payment transfers, while
      the Fee AMM converts fee tokens between user and validator preferences at fixed rates.
      Consensus is Simplex BFT via Commonware, with public docs describing ~0.5 second finality and
      testnet benchmarking at 20,000 TPS alongside broader 100K+ scale marketing. Validator
      participation, however, is still structurally bounded: public testnet began with four team-run
      validators, partner validators joined later, and permissionless operation remains a roadmap
      direction rather than a fully realized current-state property.
    claimRefs:
      - CE004
      - CE005
