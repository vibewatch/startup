company:
  name: Tempo
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Tempo is an Ethereum-compatible, payments-first Layer 1 built on Reth with Simplex BFT,
    stablecoin-denominated fees, and protocol-native payment abstractions such as fee sponsorship,
    batching, scheduling, and a built-in fee-conversion AMM. Public docs and partner tooling show
    real developer and payments infrastructure momentum, but validator decentralization, Zones trust
    assumptions, and still-incomplete public audit and performance evidence keep the technical risk
    profile materially above the marketing surface.
sections:
  - id: payment-product-scope-and-workflows
    title: Payment product scope and customer workflows
    body: >-
      Tempo is not selling a generic smart-contract chain and hoping payments happen on top. Its own
      launch, testnet, and mainnet materials consistently define the product in workflow terms:
      global payouts, payroll, remittances, embedded financial accounts, tokenized deposits,
      merchant settlement, microtransactions, and agentic payments. The live stack now spans the
      core L1, TIP-20 issuance and compliance controls, a stablecoin-native fee and exchange layer,
      Tempo Transactions for sponsorship/batching/scheduling, and the Machine Payments Protocol with
      sessions and a payments directory. That product packaging matters because it pushes key
      payment behaviors—memo-based reconciliation, stablecoin fee abstraction, and large payout
      batching—down into protocol or transaction layers rather than leaving them to application
      middleware. The result is a clearer buyer story for fintechs, marketplaces, and AI-service
      operators, but it also means many claims about scalability and operational smoothness are
      still product claims awaiting broad public production telemetry.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE009
      - CE010
