callouts:
  - calloutType: strength
    title: Protocol-native payment primitives are the core moat
    body: >-
      Tempo’s most credible technical edge is not just faster blocks; it is the decision to enshrine
      stablecoin fees, batching, sponsorship, scheduling, and reconciliation hooks directly into
      protocol or transaction layers.
    claimRefs:
      - CE014
      - CE024
      - CE046
  - calloutType: risk
    title: Trust assumptions are still meaningfully concentrated
    body: >-
      Invited validators, operator-visible Zones, and missing public audit and incident evidence
      mean that Tempo still behaves more like an institution-oriented payment network than a fully
      trust-minimized public chain.
    claimRefs:
      - CE020
      - CE032
      - CE035
      - CE042
      - CE043
  - calloutType: insight
    title: Tempo competes by centering stablecoins, not by copying existing rails
    body: >-
      Relative to Solana, Base, XRPL, and Stellar, Tempo’s differentiation is that stablecoins are
      not an application afterthought; they are the protocol’s fee currency, liquidity substrate,
      and transaction-design anchor.
    claimRefs:
      - CE038
      - CE039
      - CE040
      - CE041
      - CE046
