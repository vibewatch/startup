      - Limitation
    rows:
      - ["Treat unresectable or otherwise difficult liver tumors", "Incision-based surgery, radiation, or thermal ablation", "Edison applies focused ultrasound histotripsy non-invasively", "Company and coverage position lower invasiveness and avoidance of heat/radiation", "Pool does not provide comparative outcomes, reimbursement, or utilization by cohort"]
      - ["Plan around irregular target shape and size", "Manual imaging review and procedure planning", "Physicians contour and plan treatment to target geometry", "Personalized treatment planning is explicit on the official product page", "No public data here on planning time or interoperability with hospital imaging systems"]
      - ["Execute tissue destruction while monitoring response", "Monitor ablation/surgery effects through procedural imaging and operator judgment", "Bubble-cloud creation and treatment effect are monitored in real time while the system moves through the treatment plan", "Real-time visualization/control is a repeated differentiator in official and patent-oriented descriptions", "No public uptime, retreatment-rate, or workflow-throughput metrics in this pool"]
      - ["Expand treatment to kidney tumors", "Partial nephrectomy or thermal ablation remain current alternatives", "Kidney filing aims to extend the same non-invasive histotripsy workflow", "HOPE4KIDNEY provides a concrete 67-patient pivotal support package", "Kidney use is still investigational pending FDA review"]
    notes: Benefits are preserved exactly at the level proven in assigned sources; where comparative performance or workflow metrics are missing, the limitation column states the diligence ask instead of inferring superiority.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Focused-ultrasound histotripsy engine", "Mechanically destroys and liquefies targeted tissue via acoustic cavitation", "Precise energy delivery and tissue targeting", "Clinical differentiation weakens if real-world efficacy varies materially by organ or lesion type"]
      - ["Planning and targeting software", "Lets physicians contour, calibrate, and execute personalized treatment plans", "Usable operator workflow and reliable target definition", "Public pool does not prove integration with hospital imaging/IT or planning-system interoperability"]
      - ["Robotic arm, transducer, and imaging stack", "Positions therapy hardware and provides real-time bubble-cloud visualization", "Robotics, imaging quality, and hardware serviceability", "Scale-up depends on installation, maintenance, and field-service performance not disclosed here"]
      - ["Training and site enablement", "Restricts use to trained physicians and turns early adopter hospitals into live treatment sites", "Training throughput, partner-site support, and protocol standardization", "Clinical expansion can outrun enablement capacity if later-organ launches multiply site complexity"]
    notes: Architecture rows blend official product-page detail with independent patent-oriented analysis; operating risks remain highest where the public evidence stops at mechanism rather than site-performance metrics.
    claimRefs: [CE001, CE002, CE009, CE010, CE011, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Edison layers an indication-specific clinical program on top of histotripsy physics, imaging-guided control, robotic hardware, and site enablement.
    data:
      layers:
        - label: Current clinical use
          detail: Liver tumors are the current cleared or indicated product scope in the assigned evidence set.
        - label: Near-term indication expansion
          detail: Kidney is under FDA review while pancreas and prostate remain later-stage platform extensions rather than proven commercial modules.
        - label: Therapy engine
          detail: Focused ultrasound histotripsy mechanically destroys targeted tissue via controlled cavitation rather than heat.
        - label: Planning and monitoring
          detail: Physicians contour treatment, calibrate energy, and watch the bubble cloud in real time during execution.
        - label: System architecture
          modules:
            - label: Robotic arm + therapy transducer
              note: Cart-based positioning and pulse delivery
            - label: Imaging + control software
              note: Contouring, targeting, and treatment execution
        - label: Deployment layer
          outputs:
            - label: Physician training requirement
              note: Use limited to trained clinicians
            - label: Early installed-base signal
              note: Company said >2,000 patients and >50 U.S. medical centers as of Aug 2025
    approximationNotes: The stack preserves authored operating layers and labels; it does not imply equal technical weight or prove missing integration/security layers that the public corpus does not disclose.
    claimRefs: [CE001, CE003, CE006, CE009, CE011, CE013]
