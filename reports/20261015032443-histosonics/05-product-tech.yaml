      - ["Kidney-tumor indication expansion", "Urologic oncology teams", "May 2026 De Novo submission supported by pivotal trial; still investigational", "Organ-preserving, nephron-sparing positioning versus invasive or thermal alternatives", "Need FDA timing, label scope, and launch economics after authorization"]
      - ["Pancreas program", "GI/surgical oncology teams", "Clinical-trial/roadmap stage", "Same platform thesis applied to another difficult solid-tumor setting", "Need trial design, enrollment progress, and commercial sequencing versus kidney"]
