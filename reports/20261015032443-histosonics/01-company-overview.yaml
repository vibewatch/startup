      - ["Johnson & Johnson Innovation - JJDC", "Existing investor named in the 2024 Series D syndicate.", "Signals strategic medtech backing that may matter for market access and partner credibility.", "Confirm whether JJDC remains a shareholder and whether any commercial rights accompany the investment."]
