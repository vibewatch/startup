artifact: company-overview
slug: histosonics
runDate: 2026-10-15
company:
  name: HistoSonics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    HistoSonics enters the October 2026 refresh as a privately held histotripsy
    company with one cleared liver-tumor platform, a disclosed 2024 Series D, a
    2025 majority-stake acquisition at an approximately $2.25 billion valuation,
    and a later 2025 growth financing. The retained evidence supports identity,
    regulatory scope, leadership continuity, and financing milestones, but it
    still leaves founders, post-acquisition governance economics, and current
    revenue/headcount/customer metrics as open diligence items.
sections:
  - id: identity-platform
    title: Identity and product scope
    body: >-
      HistoSonics describes itself as a privately held medical device company
      built around the Edison Histotripsy System, a non-invasive focused
      ultrasound platform that mechanically destroys targeted tissue for liver
      tumor treatment while the company pursues additional organ indications.
      The retained sources consistently place its operating footprint in Ann
      Arbor, Michigan, with Minneapolis, Minnesota also cited as an office or
      operating base. The strongest stable facts here are what Edison is, where
      the company operates, and that FDA De Novo clearance arrived in October
      2023 for liver tumors rather than for a broad cancer platform.
    claimRefs: [CO001, CO002, CO003, CO004, CO013]
  - id: leadership-governance
    title: Leadership and governance
    body: >-
      The public evidence in this worker pool makes Mike Blue the central named
      operator: the 2025 acquisition materials keep him as president and chief
      executive officer while also indicating that he would assume the chairman
      role, and the earlier 2024 Series D materials add an investor-board seat
      for Alpha Wave's Chris Dimitropoulos. Joe Herman appears as a medical
      leader tied to first commercial procedures, which is useful for clinical
      credibility, but the pool does not surface founder biographies or a full
      current board roster. That makes key-person concentration and governance
      transparency real diligence asks rather than settled facts.
    claimRefs: [CO006, CO007, CO009, CO014]
    tableRefs: [TO002]
  - id: capital-scale
    title: Capitalization and disclosed scale markers
    body: >-
      The retained evidence shows three capital milestones with different levels
      of detail: a fully disclosed $102 million Series D in August 2024, an
      approximately $2.25 billion majority-stake acquisition in August 2025,
      and an oversubscribed $250 million financing in October 2025. A June 2026
      distributor-linked note adds another financing event involving Reed Jobs
      and Yosemite, but it explicitly withholds terms, so it is a signal of
      continued investor access rather than a quantified capital update. Public
      scale evidence is strongest on clinical adoption markers such as treated
      patients and installed centers, while current revenue, headcount, customer
      count, cash, debt, and runway remain unsupported in the assigned corpus.
    claimRefs: [CO005, CO008, CO010, CO011, CO012, CO014, CO015]
    tableRefs: [TO001, TO003]
  - id: milestones-gaps
    title: Milestones and remaining diligence gaps
    body: >-
      The company timeline is clear enough to anchor later chapters: founding in
      2009, liver-tumor clearance in 2023, first announced commercial patient
      treatments in early 2024, and successive financing and valuation events
      through mid-2026. What remains unclear is not chronology but economics and
      control. The assigned sources do not disclose a founder narrative, a fully
      current board map, post-acquisition cap-table mechanics, or current
      operating metrics such as revenue and utilization by site cohort. Those
      omissions matter because later market, customer, and valuation judgments
      depend on whether clinical momentum has translated into durable commercial
      performance.
    claimRefs: [CO003, CO004, CO005, CO008, CO010, CO011, CO012, CO014, CO015]
    figureRefs: [FO001]
