evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: founders-and-board
    missingEvidence: Current founder biographies, founder ownership, and a full post-acquisition board roster.
    whyItMatters: Leadership quality and governance concentration are material to underwriting execution risk and investor control.
    diligencePath: Request the current board list, founder history, and governance deck from management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics-gap
    missingEvidence: Current revenue, run-rate, gross margin, customer count, headcount, and site-utilization cohorts.
    whyItMatters: >-
      Valuation and customer-quality judgments are weak without evidence that clinical adoption is converting into
      repeatable commercial economics.
    diligencePath: Request audited financials, monthly utilization by installed site, and a current operating KPI dashboard.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization-gap
    missingEvidence: Post-acquisition cap table, security terms, liquidation preferences, cash balance, debt, and runway.
    whyItMatters: The public financing narrative is strong, but current ownership economics and downside protection remain opaque.
    diligencePath: Request cap-table detail, term sheets, debt schedules, and a current cash bridge from finance.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: independent-adverse-coverage
    missingEvidence: Independent adverse reporting on regulatory setbacks, litigation, product complaints, or execution failures.
    whyItMatters: >-
      The assigned pool's limiting evidence is mostly company-disclosed indication scope rather than arms-length
      criticism or incident reporting.
    diligencePath: >-
      Expand the next refresh with regulator, court, recall, and clinical-outcome sources beyond company-authored
      materials.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: minor
    topic: financing-2026
    missingEvidence: Primary disclosure for the June 2026 financing event, including transaction size and valuation terms.
    whyItMatters: >-
      Without terms, the 2026 financing signal cannot be converted into a reliable step-up, down-round, or liquidity
      interpretation.
    diligencePath: Obtain the original 2026 company or investor announcement and compare it with the distributor summary.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A numeric TAM, SAM, or SOM methodology by indication and geography, including procedure counts, pricing
      assumptions, and reimbursement logic.
    whyItMatters: >-
      Without a bottoms-up sizing method, the market case can be overstated by broad oncology language that the retained
      sources do not quantify.
    diligencePath: >-
      Request management's current market model and reconcile it against procedure volumes, site counts, pricing, and
      indication mix.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: payer-gap
    missingEvidence: >-
      Named reimbursement owner, hospital budget owner, capital-purchase motion, and repeat-utilization economics by
      active site cohort.
    whyItMatters: >-
      Buyer and user can be inferred, but valuation depends on who pays, how budgets are approved, and whether
      utilization ramps after installation.
    diligencePath: >-
      Obtain reimbursement status, procurement workflow, average procedure volume, and site-level utilization cohorts
      from management or customers.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: named-direct-peers
    missingEvidence: >-
      Public competitor-specific documentation for named commercial histotripsy or closely substitutable platform
      vendors with comparable product detail.
    whyItMatters: >-
      Without named peer disclosures, the chapter can compare modalities and adoption friction but cannot benchmark
      direct commercial rivalry with the same confidence.
    diligencePath: >-
      Collect competitor product briefs, FDA or CE records, procurement listings, and independent case studies for named
      device vendors in the same treatment workflow.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Edison list pricing, service terms, consumable economics, reimbursement detail, and hospital payback or
      utilization assumptions.
    whyItMatters: >-
      Price and packaging determine whether modality differentiation converts into procurement wins and defensible unit
      economics.
    diligencePath: >-
      Request quote sheets, customer procurement documents, reimbursement guides, and realized utilization data by site
      cohort.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: outcome-benchmarking
    missingEvidence: >-
      Independent head-to-head benchmarking of histotripsy versus surgery, thermal ablation, and radiation across the
      same patient populations.
    whyItMatters: The assigned pool supports workflow and positioning analysis but not rigorous comparative-outcome underwriting.
    diligencePath: >-
      Add peer-reviewed comparative studies, treatment-guideline commentary, and registry data tied to the same tumor
      indications.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, monthly burn, debt obligations, and management runway plan after the 2025-2026 financings.
    whyItMatters: >-
      Capital adequacy cannot be underwritten from public evidence without knowing how much liquidity remains and what
      obligations consume it.
    diligencePath: Request board materials or lender packages with monthly cash bridge, debt schedule, and covenant summary.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Executed customer contracts, list price guidance, realized ASP, discount ladders, and any separate service or
      training charges.
    whyItMatters: >-
      Revenue quality depends on whether placement volume converts into durable realized pricing rather than only into
      announced installations.
    diligencePath: Review signed hospital contracts, price books, and any distributor or channel agreements by region.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Site-cohort utilization, procedure counts, reimbursement capture, service-delivery cost, and gross margin by
      platform or indication.
    whyItMatters: >-
      Adoption proxies are positive, but they do not show whether installations mature into attractive gross profit or
      fast payback.
    diligencePath: >-
      Obtain cohort dashboards tying installed sites to procedures, revenue recognition, gross margin, and support-cost
