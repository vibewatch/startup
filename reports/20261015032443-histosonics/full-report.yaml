      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The chapter's biggest commercial gap is not whether there is demand, but how durable and diversified that
              demand is. None of the retained sources disclose NRR, GRR, churn, renewal rates, contract length,
              top-customer exposure, or utilization by site cohort. The public proof therefore remains concentrated in
              reference academic centers, trial-linked centers, and distributor announcements rather than a disclosed
              long tail of routine community-hospital usage. That does not negate the adoption signals already in hand,
              but it means the expansion case still relies on management and partner assertions more than on observable
              recurring-use or concentration data that would show how resilient the installed base really is.
            claimRefs:
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
