  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is still modality-led, not peer-led
        blocks:
          - type: paragraph
            body: >-
              The retained sources frame HistoSonics less as one more vendor in an already crowded product category and
              more as a new local-therapy option inserted into an existing liver-tumor care pathway. Independent and
              company-issued sources consistently position Edison against surgery, radiation, chemotherapy, and
              conventional thermal ablation rather than against a disclosed list of same-modality peers. That makes the
              current rivalry set modality-led: the practical buyer choice is whether a center routes eligible patients
              into an established invasive or thermal workflow, into a newer non-invasive histotripsy workflow, or
              leaves some patients in limited option pathways when resection or ablation are poor fits. The same sources
              also broaden the future rivalry set because HistoSonics is trying to move from liver into kidney,
              pancreas, prostate, and BPH use cases, where the incumbent standards and buyer objections will differ by
              organ and specialty.
            claimRefs:
              - CP001
