      - number: '4.2'
        title: Capital access remains strong, which also signals continuing capital intensity
        blocks:
          - type: paragraph
            body: >-
              HistoSonics has repeatedly raised or attracted capital even after a change-of-control transaction. Johnson
              & Johnson Innovation published the company's August 2024 announcement of a $102 million Series D for
              commercial growth and the BOOMBOX study. The company later announced a $2.25 billion majority-stake
              acquisition and then an oversubscribed $250 million growth financing; MedTech Dive said the acquisition
              consortium also joined that later round. In 2026, HistoSonics' official news page and distributor Synektik
              both pointed to another financing that included Yosemite participation, but the assigned public sources do
              not disclose the amount or terms. That pattern is positive for access to capital, but it also implies that
              commercial expansion, indication development, and global rollout are still being funded ahead of
              transparent self-financing metrics.
