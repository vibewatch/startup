        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows three capital milestones with different levels of detail: a fully disclosed
              $102 million Series D in August 2024, an approximately $2.25 billion majority-stake acquisition in August
              2025, and an oversubscribed $250 million financing in October 2025. A June 2026 distributor-linked note
