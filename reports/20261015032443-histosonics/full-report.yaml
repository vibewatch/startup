              - CU004
              - CU008
              - CU009
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reference-site proof is real, not just logo usage
            body: >-
              HistoSonics progressed from 2023 training partners to named post-clearance production use at Rochester and
              Cleveland Clinic, then to company-backed disclosures of more than 2,000 treated patients at over 50 active
              centers by August 2025.
            calloutType: strength
            claimRefs:
              - CU003
              - CU005
              - CU006
          - type: callout
            title: Durability remains the key commercial blind spot
            body: >-
              Public evidence still does not disclose NRR, churn, renewal rates, contract length, top-customer exposure,
              or site-level utilization cohorts, so the customer story is still easier to prove at marquee academic
              sites than at scale.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk concentration sits in expansion execution, not in a surfaced public crisis
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not surface a public enforcement action, recall, or disclosed litigation event, so
              the main risk picture comes from what HistoSonics is officially authorized to do today versus what it
              still needs to execute next. Public evidence supports a narrow current commercial base: U.S. liver-tumor
              use, formal training dependence, and staged geographic and indication expansion. That leaves the
              highest-severity risks clustered around regulatory broadening, site activation throughput, and whether
              clinical enthusiasm converts into repeatable multi-center utilization before the company stretches into
              kidney, pancreas, and prostate programs. New capital reduces immediate financing pressure, but the pool
              does not disclose cash burn, complaint trends, or contract economics strongly enough to treat those
              downstream risks as resolved.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR010
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR009
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory breadth remains the gating risk to broader commercialization
        blocks:
          - type: paragraph
            body: >-
              The strongest hard constraint is still label scope. FDA-cleared commercial use is for liver tumors, while
              company disclosures separately caution that the FDA has not evaluated cancer outcomes or other disease
              claims and that kidney use remains investigational. Europe is now an expansion path because CE Mark was
              reported in July 2026, but even that launch is described as phased and centered on select liver-treatment
              centers rather than a broad channel release. The 2023 pivotal evidence was credible enough to unlock de
              novo commercialization, yet it still reflects modest trial scale, which means further indication growth
              remains exposed to regulator timing, additional study execution, and post-market evidence quality.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR008
              - CR011
      - number: '7.3'
        title: Rollout quality depends on training throughput, workflow integration, and partner execution
        blocks:
          - type: paragraph
            body: >-
              HistoSonics' own materials describe Edison as a physician-controlled, imaging-led workflow rather than a
              push-button install, and the training role in the pool is correspondingly hands-on. Site activation
              therefore depends on instructor capacity, travel-intensive field coverage, and consistent physician
              proficiency across treatment planning, ultrasound imaging, and troubleshooting. The hardware stack also
              depends on integrated ultrasound equipment, reusable capital hardware, and disposable procedure
              components, which raises classic medtech scaling risks around supply coordination, uptime, and
              quality-system discipline. Early named customer proof and the company's own reference to first partner
              programs suggest traction, but they also imply that rollout concentration in a relatively small set of
              centers can still slow or skew expansion if activation quality slips.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.4'
        title: The unresolved diligence asks are economic durability, complaint visibility, and control terms
        blocks:
          - type: paragraph
            body: >-
              Before underwriting fresh capital at scale, investors still need evidence that operational growth is
              translating into durable economics and manageable post-market risk. The assigned pool confirms funding for
              expansion and a majority-stake ownership reset, but it does not disclose runway, burn, margin,
              board-control protections, or complaint/MDR trends in a way that clears downside uncertainty. Practical
              kill criteria are therefore measurable: a delay or denial in kidney-label expansion, weak European
              conversion beyond select centers, meaningful post-market safety or quality disclosures, or evidence that
              installation growth outruns physician training quality and repeat procedure use.
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority thesis-break triggers
            body: >-
              A delayed or failed kidney expansion, weak European conversion outside select centers, material
              post-market safety/quality disclosures, or installation growth that outruns training quality would each
              damage the current commercialization thesis more than a single missed quarter of fundraising optics.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR010
              - CR015
          - type: callout
            title: The financing story is not the same as the risk story
            body: >-
              New capital and a $2.25 billion transaction reduce immediate balance-sheet stress, but they do not answer
              whether utilization, margins, and regulatory expansion can support the next phase of rollout without
              hidden quality or governance friction.
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The underwriting debate is not whether HistoSonics has real product proof; it does. Company and partner
              sources say the August 2025 transaction valued the business at about $2.25 billion, after FDA clearance,
              more than 2,000 treated patients, more than 50 active U.S. centers, and another 50 planned installations
              by year-end. The harder question is price support. The assigned public evidence shows a second large
              capital raise only two months after the control transaction and gives just one third-party October 2025
              valuation/revenue multiple datapoint. That is enough to justify a serious diligence track, but not enough
              to justify a fresh buy-style call at face value. Entry discipline should therefore stay anchored to fuller
              disclosure on unit economics, utilization and capital structure rather than on technology enthusiasm
              alone.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV011
              - CV012
      - number: '8.2'
        title: Scenario frame and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              The bullish case is straightforward: the Edison platform has already crossed the hardest medtech
              thresholds of regulatory clearance, first commercial adoption and visible investor willingness to fund
              expansion, while management is pushing into kidney, pancreas and prostate indications. The base case is
              less generous because the public market evidence remains sparse. Multiples records October 2025 revenue of
              $100 million and a $3 billion valuation, which implies a 30.0x revenue multiple, and Synektik later
              described another financing round without disclosing terms. Those facts can support a stretched private
              valuation only if installation growth converts into repeat procedure utilization and if later-organ
              indications expand the addressable market on schedule. Without that proof, multiple compression or
              preference overhang can erase much of the headline value to new common-equity entrants.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence is good enough to justify continued work, but not good enough to collapse the remaining
              valuation uncertainty. The top asks are audited revenue, gross margin and system-utilization cohorts;
              current cash, burn and runway; and the exact post-acquisition cap-table and liquidation-preference stack
              after the 2025-2026 financings. Positive read-through on those points, together with on-time kidney or
              other non-liver expansion and continuing site activation, could move the recommendation toward investable.
              The thesis breaks if procedure growth lags installed-base growth, if follow-on capital comes with onerous
              preferences, or if indication expansion slips while the company keeps financing ahead of disclosed
              economics.
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              HistoSonics looks like a rare private medtech company with real platform proof, but the current public
              record supports a tighter entry bar than the clinical excitement suggests.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV012
