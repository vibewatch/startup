              - CE011
              - CE013
      - number: '5.3'
        title: Deployment controls and technical risk
        blocks:
          - type: paragraph
            body: >-
              The maturity signal is real but still mixed. Company-issued materials say the platform has treated more
              than 2,000 patients at more than 50 U.S. medical centers and cite early standard-clinical-practice use at
              Rochester and Cleveland Clinic, which supports that Edison is beyond prototype stage. At the same time,
              the clearest public control language in this source set is clinical and regulatory: only trained
              physicians should use the system, the FDA has not evaluated it for cancer outcomes, and kidney use remains
              investigational pending authorization. That leaves the most important remaining product diligence around
              operational detail the pool does not prove directly, especially hospital integration, service reliability,
              cybersecurity/compliance artifacts, and the throughput of training new sites at scale.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modality proof is stronger than a typical private medtech platform claim
            body: >-
              HistoSonics has a concrete product architecture, a cleared liver use case, and a live kidney filing tied
              to a named pivotal trial, which is materially better evidence than a generic multi-organ roadmap story.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE011
          - type: callout
            title: Public evidence still underspecifies operating readiness
            body: >-
              The source set proves indication progress and training restrictions more clearly than it proves
              integration, uptime, site-support, or security posture, so scaling risk remains an execution question
              rather than a closed diligence item.
            calloutType: risk
            claimRefs:
