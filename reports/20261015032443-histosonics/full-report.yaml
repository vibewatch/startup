  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model visibility is directional, not underwritable
        blocks:
          - type: paragraph
            body: >-
              The public record supports a commercialization model built around hospital system placements rather than a
              disclosed recurring-software fee stream. HistoSonics said Edison had treated more than 2,000 patients at
              over 50 centers, with another 50 planned installations, and an earlier launch update said the company was
              training key staff and launching over a dozen partner programs in the United States. The 2026 news feed
              then adds CE Mark and TFDA milestones that expand where the company can sell the platform. That is enough
              to see the commercial flywheel - install systems, train sites, drive procedures, then expand indications
              and geographies - but not enough to see list price, realized ASP, reimbursement capture, or gross profit
              conversion.
