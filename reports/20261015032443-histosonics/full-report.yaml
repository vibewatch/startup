      - number: '4.3'
        title: Public underwriting blockers remain substantial
        blocks:
          - type: paragraph
            body: >-
              Independent reporting adds the only revenue-like figures in this pool, but not enough to close the
              diligence gap. Fierce Biotech, citing the Financial Times, said HistoSonics had revenue predictions of
              $100 million "this year" and $200 million in 2026, while also reporting that the company had explored both
              a sale and an IPO before opting for a sale amid market uncertainty. Without audited revenue, recognition
              policy, gross margin, cash balance, burn, debt, working-capital requirements, or procedure-level
              reimbursement economics, those signals cannot be converted into a defensible margin path or runway model.
              The financial verdict is therefore favorable on fundraising access and commercial momentum, but still
              cautious on revenue quality, capital intensity, and next-round dependency.
