  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and rollout model
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a hospital-centered enterprise sale rather than a consumer or office-tool
              purchase. HistoSonics' own product page says federal law restricts Edison to sale by or on the order of a
              physician, and the workflow shown on that page is explicitly physician-led: clinicians localize the
              target, plan the procedure, and then monitor treatment in real time. That positioning narrows the current
              buyer and user base to liver-tumor programs with trained physicians, imaging capacity, and procedural
              support. Expansion is visible, but it is still structured: Europe is rolling out first through select
              centers of excellence, while parts of Central and Eastern Europe are being addressed through a
              sole-distributor model rather than direct broad-based hospital coverage.
