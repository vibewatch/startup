              - CP008
              - CP011
              - CP013
      - number: '3.3'
        title: Switching friction exists, but public pricing and direct-peer visibility are still weak
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports HistoSonics' novelty also limits a clean underwriting-style comparison.
              Medical Economics explicitly describes a widening menu of image-guided options that are intended to
              complement, rather than replace, surgical and interventional standards of care, which is a reminder that
              incumbent workflows still retain referral power and clinical legitimacy. Meanwhile, the retained financing
              and launch coverage does not publish list price, discounting, procedure economics, or contract structure
              for Edison, so public sources do not yet support an apples-to-apples pricing comparison against status-quo
              alternatives. In short, HistoSonics appears differentiated enough to earn center attention, but the public
              record in this assigned pool is still too thin to prove durable displacement economics or to map named
              direct commercial peers with the same confidence as the modality-level comparison.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP012
