        title: Named proof of adoption and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Customer proof is strongest where HistoSonics names flagship academic adopters. Its customer release says
              the University of Rochester Medical Center and Cleveland Clinic were the first sites to deliver
              standard-clinical-practice liver-tumor treatments after FDA clearance, and Cleveland Clinic disclosed
              three treated patients in that early experience. The broader adoption story improved materially in 2025:
              company and ecosystem sources both said Edison had treated more than 2,000 patients across more than 50
              active centers, with another 50 installations planned by year-end. Even so, the company still describes
              momentum more often than hard cohort data, so utilization depth is easier to see than revenue quality or
              site productivity.
            claimRefs:
