  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Current market boundary is a narrow liver-tumor wedge, not a general oncology TAM
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a tight market definition before any sizing exercise begins. HistoSonics'
              current commercial wedge is liver tumors, with its own technology page limiting intended use to the
              "partial or complete destruction of unresectable liver tumors via histotripsy" and warning that the FDA
              has not evaluated the system for cancer outcomes or any other specific disease. MassDevice independently
              frames the same product as a non-invasive histotripsy platform for liver tumors and notes that CE mark
              approval extends that same use case into Europe. That means the immediate opportunity is not "all
              oncology" or even all focused-ultrasound procedures: it is a specialist, procedure-led liver-tumor
              adoption path whose substitute set is surgery, thermal ablation, radiation, and other invasive liver
              interventions rather than a generic software budget.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: Expansion depends on geography, new indications, and specialist-site rollout
        blocks:
          - type: paragraph
            body: >-
              Public materials describe a real expansion path, but they also show how staged it still is. MassDevice
              says CE mark approval lets HistoSonics commercialize Edison in Europe for liver tumors and begin with
              select specialist centers, while Synektik says it is the sole distributor across Poland and several
              Central and Eastern European countries. Company-issued announcements and independent trade coverage also
              keep pointing to kidney, pancreas, prostate, and BPH as the next growth vectors beyond the current liver
              focus. At the same time, the strongest direct adoption evidence in the pool is still early-site proof:
              HistoSonics highlights first standard-practice treatments at the University of Rochester Medical Center
              and Cleveland Clinic after De Novo clearance. That combination implies a market that expands center by
              center, indication by indication, and geography by geography, with physicians and specialist tumor centers
              acting as the practical adoption bottleneck.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM005
