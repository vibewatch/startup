chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              HistoSonics describes itself as a privately held medical device company built around the Edison
              Histotripsy System, a non-invasive focused ultrasound platform that mechanically destroys targeted tissue
              for liver tumor treatment while the company pursues additional organ indications. The retained sources
              consistently place its operating footprint in Ann Arbor, Michigan, with Minneapolis, Minnesota also cited
              as an office or operating base. The strongest stable facts here are what Edison is, where the company
              operates, and that FDA De Novo clearance arrived in October 2023 for liver tumors rather than for a broad
              cancer platform.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The public evidence in this worker pool makes Mike Blue the central named operator: the 2025 acquisition
              materials keep him as president and chief executive officer while also indicating that he would assume the
              chairman role, and the earlier 2024 Series D materials add an investor-board seat for Alpha Wave's Chris
              Dimitropoulos. Joe Herman appears as a medical leader tied to first commercial procedures, which is useful
              for clinical credibility, but the pool does not surface founder biographies or a full current board
              roster. That makes key-person concentration and governance transparency real diligence asks rather than
              settled facts.
