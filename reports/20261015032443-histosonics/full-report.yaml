              - CP013
      - number: '3.2'
        title: Differentiation today comes from modality novelty, proof points, and workflow enablement
        blocks:
          - type: paragraph
            body: >-
              HistoSonics' best public differentiation is not low price or broad packaging disclosure; it is the
              combination of a first-of-kind histotripsy platform, visible early deployment, and a workflow that blends
              imaging, physician training, and site onboarding. Company-issued sources say Edison is the first and only
              histotripsy platform cleared for clinical use globally, that more than 2,000 patients have been treated at
              more than 50 U.S. medical centers, and that the company expected another 50 system installations by
              year-end after the 2025 transaction. Independent patent analysis adds a second moat layer by tying the
              platform to ultrasound therapy, robotic targeting, imaging, and software/control IP rather than to a
              single marketing claim. That combination suggests HistoSonics is harder to copy than a stand-alone
              disposable or narrow software feature, but it also means adoption depends on training, installation, and
              center-level reference building rather than a light-touch software sale.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
