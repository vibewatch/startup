  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and clinical workflow
        blocks:
          - type: paragraph
            body: >-
              The commercial product is the Edison histotripsy system, which HistoSonics describes as delivering pulsed
              sound energy without incisions or needles while the physician monitors the treatment bubble cloud in real
              time. Across official and independent 2026 coverage, the current cleared or indicated use remains liver
              tumor destruction, while the May 2026 kidney submission is an expansion program rather than an
              already-cleared indication. That kidney step matters because the company and third-party coverage
              consistently tie it to the ongoing HOPE4KIDNEY pivotal study, giving the roadmap a concrete regulatory
              milestone rather than a generic platform aspiration.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
