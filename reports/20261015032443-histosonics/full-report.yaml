      - number: '2.3'
        title: Public evidence shows momentum and capital, but not a defensible TAM stack
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports valuation-relevant momentum signals, but not a clean TAM/SAM/SOM build. MedTech
              Dive and VCA Online both tie the 2025 financing to global commercial expansion and additional indications,
              and Tracxn reports cumulative funding of $566M across 12 rounds with a June 2026 Series E. Those facts
              matter because this category appears capital intensive: the company must widen regulatory scope, train
              sites, and prove repeat procedure demand before the market can resemble a broad medtech platform. What the
              sources do not provide is equally important. Across the reviewed public materials, there is no numeric
              TAM, SAM, or SOM methodology for histotripsy, no disclosed reimbursement owner, and no explicit hospital
              budget line. The best sizing lens available here is therefore constrained: current liver-tumor use, Europe
              as the next geographic wedge, and new-organ indications as the main unlocks, with diligence still needed
              on utilization, reimbursement, and real per-site economics.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
