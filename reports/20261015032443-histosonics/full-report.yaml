      - number: '5.2'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The technical architecture is more specific than a simple ultrasound console pitch. Official product
              language and patent-oriented independent analysis both describe a system that combines focused-ultrasound
              histotripsy physics, real-time imaging, robotic positioning, software-driven targeting, and
              physician-controlled treatment execution. That combination underpins the company's differentiation claim:
              mechanical tissue destruction without surgery, radiation, or thermal injury, plus a platform design that
              management is already framing as expandable into kidney, pancreas, prostate, and other organs. The
              extension story is credible as a platform thesis, but only liver use is clearly commercialized today.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
              - CE012
