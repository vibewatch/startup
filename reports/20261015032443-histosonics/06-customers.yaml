schemaVersion: report-v2
artifact: customers
slug: histosonics
runDate: 2026-10-15
company:
  name: HistoSonics
chapter:
  number: 6
  title: Customers
  summary: >-
    HistoSonics has crossed from pre-launch partner training into real clinical use at
    flagship liver-tumor centers, with company-backed disclosures of more than 2,000
    treated patients at over 50 active centers by August 2025 and a Europe rollout that
    began after CE Mark approval in July 2026. The commercial story is still concentrated
    in marquee academic sites and channel announcements, with no public retention,
    renewal, or customer-concentration metrics in the retained evidence.
sections:
  - id: buyer-user-and-rollout-model
    title: Buyer, user, and rollout model
    body: >-
      The retained evidence points to a hospital-centered enterprise sale rather than a
      consumer or office-tool purchase. HistoSonics' own product page says federal law
      restricts Edison to sale by or on the order of a physician, and the workflow shown
      on that page is explicitly physician-led: clinicians localize the target, plan the
      procedure, and then monitor treatment in real time. That positioning narrows the
      current buyer and user base to liver-tumor programs with trained physicians,
      imaging capacity, and procedural support. Expansion is visible, but it is still
      structured: Europe is rolling out first through select centers of excellence, while
      parts of Central and Eastern Europe are being addressed through a sole-distributor
      model rather than direct broad-based hospital coverage.
    claimRefs: [CU001, CU002, CU008, CU009, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-scale
    title: Named proof of adoption and disclosed scale
    body: >-
      Customer proof is strongest where HistoSonics names flagship academic adopters.
      Its customer release says the University of Rochester Medical Center and Cleveland
      Clinic were the first sites to deliver standard-clinical-practice liver-tumor
      treatments after FDA clearance, and Cleveland Clinic disclosed three treated
      patients in that early experience. The broader adoption story improved materially in
      2025: company and ecosystem sources both said Edison had treated more than 2,000
      patients across more than 50 active centers, with another 50 installations planned
      by year-end. Even so, the company still describes momentum more often than hard
      cohort data, so utilization depth is easier to see than revenue quality or site
      productivity.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU010]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risk
    body: >-
      The chapter's biggest commercial gap is not whether there is demand, but how
      durable and diversified that demand is. None of the retained sources disclose NRR,
      GRR, churn, renewal rates, contract length, top-customer exposure, or utilization
      by site cohort. The public proof therefore remains concentrated in reference
      academic centers, trial-linked centers, and distributor announcements rather than a
      disclosed long tail of routine community-hospital usage. That does not negate the
      adoption signals already in hand, but it means the expansion case still relies on
      management and partner assertions more than on observable recurring-use or
      concentration data that would show how resilient the installed base really is.
    claimRefs: [CU011, CU012]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - U.S. flagship academic centers
        - "Buyer: hospital liver program; user: trained physician-led clinical team; payer: hospital budget plus procedure economics"
        - Initial liver-tumor treatments after FDA clearance
        - Named production use at University of Rochester Medical Center and Cleveland Clinic
        - Creates reference sites and clinical credibility
        - No disclosed contract value, reimbursement mix, or utilization by site
      - - Broader U.S. leading medical centers
        - "Buyer: major health systems; user: hepatobiliary and interventional teams; payer: hospital capital / service-line budget"
        - Ongoing liver-tumor destruction programs
        - More than 2,000 patients treated at over 50 active centers by August 2025
        - Strongest disclosed footprint signal beyond first two sites
        - No split between ordered, installed, and regularly used systems
      - - European centers of excellence
        - "Buyer: specialist liver-tumor centers; user: physician teams; payer: provider procurement in CE-mark markets"
        - Initial Europe commercialization after CE Mark
        - Phased rollout beginning with select centers of excellence
        - Opens a new geography without waiting for a mass-market launch
        - No named commercial go-live count or utilization per center
      - - Central / Eastern Europe distributor channel
        - "Buyer: hospitals reached through Synektik; user: local physician teams; payer: hospital procurement via distributor"
        - Channel-led market entry for liver treatment
        - Sole distributor disclosed for six countries
        - Extends coverage without building direct sales everywhere
        - Distributor coverage is not proof of purchased or productive sites
    notes: >-
      Rows mix named production sites, disclosed active-center scale, and channel setup;
      revenue per account and reimbursement mix are not publicly disclosed in the retained
      sources.
    claimRefs: [CU001, CU003, CU006, CU008, CU009, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - First standard-clinical-practice sites named
        - University of Rochester Medical Center and Cleveland Clinic
        - 2024 release describing December 18 first procedure
        - HistoSonics customer release
        - medium
        - Shows movement from trial-era proof into production clinical use
        - No total installed base disclosed at that time
      - - Early clinical volume at named site
        - Cleveland Clinic disclosed three treated patients
        - 2024 release
        - HistoSonics customer release
        - medium
        - Concrete use evidence, but still from a very small sample
        - No repeat-procedure cadence, renewal data, or payer economics
      - - Global patient and center footprint
        - More than 2,000 patients at over 50 active centers worldwide
        - August 2025
        - BusinessWire and Focused Ultrasound Foundation
        - high
        - Strongest disclosed adoption snapshot in the retained pool
        - No procedures per site or share of centers with sustained utilization
      - - Planned additional installations
        - Another 50 system installations planned by year-end
        - August 2025
        - BusinessWire and Focused Ultrasound Foundation
        - high
        - Suggests the installed base was still expanding quickly
        - Planned installations are not the same as live productive sites
      - - Utilization momentum
        - Growing physician adoption and increasing utilization at leading academic medical centers and health systems
        - June 2026
        - Lumira Ventures financing announcement
        - medium
        - Points to deeper use at early reference sites
        - No account count, utilization numerator, or cohort denominator
    notes: >-
      The table keeps installation plans separate from live active-center proof; public
      materials disclose momentum language more often than auditable site-level cohorts.
    claimRefs: [CU003, CU004, CU006, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / channel
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - University of Rochester Medical Center
        - U.S. academic medical center
        - First targeted liver-tumor treatment after clearance
        - Production clinical care
        - Company says it delivered the world's first targeted liver-tumor treatment using Edison in standard clinical practice
        - No disclosed ongoing volume, contract size, or reimbursement outcome
      - - Cleveland Clinic
        - U.S. academic medical center
        - Initial liver-tumor treatments after clearance
        - Production clinical care
        - Company says the team treated three patients and reported early patient comfort benefits
        - Evidence is company-issued and the sample is still tiny
      - - Select European centers of excellence
        - European liver-tumor centers
        - Initial commercialization after CE Mark
        - Early commercial rollout
        - Endovascular Today says rollout starts with select centers and cites trial participation across Germany, Italy, Spain, and the UK
        - No named go-live commercial accounts or procedure counts
      - - Synektik territories
        - Distributor-led channel across Poland, Czech Republic, Slovakia, Lithuania, Latvia, and Estonia
        - Market-entry channel for liver treatment
        - Channel setup, not named end-customer production
        - Synektik says it is the sole distributor for six countries
        - Distributor presence is not proof of hospital purchase or utilization
    notes: >-
      This is a partial enumeration of publicly named customer proof and disclosed channels
      in the assigned pool, not a full installed-base roster.
    enumerationScope:
      coverage: partial
      basis: Publicly named customer proofs and channel disclosures retained from the assigned pool as of the 2026-10-15 run date.
    claimRefs: [CU003, CU004, CU008, CU009]
