      Adoption moves from physician-gated liver-center targeting into reference-site proof,
      then broadens through active-center expansion, select European centers, and
      distributor-led geographies.
    data:
      items:
        - label: Target liver-tumor programs
          actor: "Buyer: hospital oncology / liver service line"
          phase: Initial segmentation
          touchpoints:
            - FDA-cleared liver indication
            - Sale restricted to physician order
          tone: neutral
        - label: Train the clinical team
          actor: "User: trained physician-led treatment team"
          phase: Workflow enablement
          touchpoints:
            - HistoSonics-required training
            - Physician-led localization, planning, and treatment monitoring
          tone: risk
        - label: Land flagship reference sites
          actor: University of Rochester Medical Center and Cleveland Clinic
          phase: First production proof
          touchpoints:
            - First standard-clinical-practice liver-tumor treatments
            - Cleveland Clinic disclosed 3 early treated patients
          tone: opportunity
        - label: Expand within leading U.S. centers
          actor: Academic medical centers and health systems
          phase: Utilization ramp
          touchpoints:
            - Growing physician adoption and increasing utilization
            - ">2,000 patients at >50 active centers by August 2025"
          tone: opportunity
        - label: Open Europe through center-led rollout
          actor: Select European centers of excellence
          phase: International commercialization
          touchpoints:
            - CE Mark approval in July 2026
            - Phased rollout focused on liver-tumor centers
          tone: opportunity
        - label: Add distributor-led geographies
          actor: Synektik in six Central / Eastern European countries
          phase: Channel expansion
          touchpoints:
            - Sole-distributor model
            - End-customer installs not yet publicly named
          tone: risk
    claimRefs: [CU001, CU003, CU004, CU006, CU008, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Reference-site proof is real, not just logo usage
    body: >-
      HistoSonics progressed from 2023 training partners to named post-clearance
      production use at Rochester and Cleveland Clinic, then to company-backed disclosures
      of more than 2,000 treated patients at over 50 active centers by August 2025.
    claimRefs: [CU003, CU005, CU006]
  - calloutType: risk
    title: Durability remains the key commercial blind spot
    body: >-
      Public evidence still does not disclose NRR, churn, renewal rates, contract length,
      top-customer exposure, or site-level utilization cohorts, so the customer story is
      still easier to prove at marquee academic sites than at scale.
    claimRefs: [CU011, CU012, CU013]
