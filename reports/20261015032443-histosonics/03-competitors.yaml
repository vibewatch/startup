      - ["Training / site-enablement requirement", "High — company-provided training and first-partner programs are explicit", "Existing specialty workflow", "Existing specialty workflow", "Existing specialty workflow", "Switching costs likely come from capital, training, and physician workflow change more than from feature checklist gaps"]
