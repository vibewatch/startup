      - ["Surgical resection / transplant pathway", "Not quantified in assigned pool", "Existing hospital and specialty workflow", "Operative pathway", "Incumbent workflows may be easier to budget administratively, but this pool does not quantify procedure economics"]
      - ["Thermal ablation", "Not quantified in assigned pool", "Existing interventional workflow", "Conventional local tumor ablation", "Public evidence here supports modality comparison, not economic comparison"]
      - ["Radiation or systemic care", "Not quantified in assigned pool", "Existing oncology workflow", "Established non-surgical or systemic management", "These pathways remain credible substitutes, but the assigned pool does not support like-for-like pricing math"]
      - ["Limited-option / no-local-therapy status quo", "No vendor price", "No new deployment package", "Observation, monitoring, or unsupported treatment gap", "Status quo may persist where capital, training, or candidacy limits block adoption"]
    notes: >-
      The assigned pool contains commercialization and financing signals but no Edison list price,
      discount schedule, reimbursement profile, or contract structure, so this exhibit records the
      packaging evidence that is public and flags the missing economic detail.
