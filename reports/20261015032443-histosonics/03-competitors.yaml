        min: 1
        max: 5
        low: Closer to existing clinical pathway
        high: More novel non-invasive modality
        description: Ordinal scoring based on retained public evidence, not benchmarked outcomes.
        scale: ordinal
      yAxis:
        label: Commercial maturity in retained evidence
        min: 1
        max: 5
        low: Early or limited deployment signal
        high: Established current-use pathway
        description: Ordinal scoring from the current assigned pool, not a market-share estimate.
        scale: ordinal
      points:
        - label: HistoSonics histotripsy
          x: 5
          y: 4
        - label: Surgical resection
          x: 2
          y: 5
        - label: Thermal ablation
          x: 2
          y: 5
        - label: Radiation therapy
          x: 2
          y: 5
        - label: Chemotherapy / systemic care
          x: 1
          y: 5
        - label: Limited-option status quo
          x: 1
          y: 2
    approximationNotes: >-
      Scores are evidence-backed ordinals derived from retained claims about invasiveness, workflow
      novelty, and current commercialization signals; they are not inferred efficacy rankings,
      market-share estimates, or pricing scores.
