      - ["Current cleared liver commercialization", "Yes — FDA De Novo in the U.S. and CE Mark in Europe", "Incumbent pathway", "Incumbent pathway", "Incumbent pathway", "HistoSonics is differentiated but still commercializing into established clinical habits"]
