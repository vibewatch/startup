companyProfile:
  summary: >-
    HistoSonics is a privately held medtech company built around the Edison Histotripsy System, a non-invasive
    focused-ultrasound platform used for liver tumors and being expanded into other organs. The public record shows FDA
    De Novo clearance, first clinical treatments, a disclosed $102 million Series D, a 2025 majority-stake acquisition
    at roughly $2.25 billion, and a later $250 million financing, but it still does not disclose current revenue,
    margins, cash, debt, or utilization economics needed to underwrite the business.
  headquarters: Ann Arbor, Michigan, USA (with Minneapolis, Minnesota also cited as an office / operating base)
  productSummary: >-
    Edison is a histotripsy-based non-invasive tumor destruction system focused on liver tumors, with additional organ
    indications under development.
  customerFocus: >-
    Hospitals, surgeons, and medical centers treating liver tumors and other solid tumors where histotripsy can be
    adopted clinically.
  businessModel: >-
    System commercialization and placement, with related clinical expansion and support; public pricing and realized
    unit economics are not disclosed.
  stage: Private unicorn
  fundingStatus: >-
    Disclosed $102 million Series D in 2024, a 2025 majority-stake acquisition at approximately $2.25 billion, a $250
    million financing in October 2025, and a June 2026 financing announcement with undisclosed terms.
