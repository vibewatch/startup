  topStrengths:
    - First-of-kind clinical platform with disclosed FDA clearance and a real adoption base.
    - Repeated capital access from strategic and financial investors across 2024 to 2026.
    - Expansion path beyond liver tumors into additional indications and geographies.
  topRisks:
    - Core operating economics remain undisclosed, including revenue, margin, cash, and runway.
    - Post-acquisition cap table, liquidation preferences, and governance rights are opaque.
    - Commercial scale-up depends on reimbursement, site activation, and execution in new indications.
  unresolvedGaps:
    - Audited revenue, gross margin, and per-system utilization by site cohort.
    - Cash balance, burn, debt, and runway after the 2025 acquisition and growth financing.
    - Post-acquisition cap table, liquidation preferences, and governance terms for new investors.
    - Realized paid-procedure volume and repeat utilization after payer-coverage wins.
    - Timing and economic contribution of kidney authorization and later-organ expansion.
