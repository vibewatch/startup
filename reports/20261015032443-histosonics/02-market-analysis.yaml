  - id: TM004
    title: Adoption constraints that replace a numeric market-sizing figure
    columns:
      - Constraint
      - Supporting evidence
      - Adoption / valuation implication
      - Diligence ask
    rows:
      - - Regulatory scope remains narrow
        - Current intended use remains liver tumors even as broader indications are discussed
        - Near-term revenue should be modeled from a narrow initial wedge
        - Confirm current procedure mix and installed-base concentration by indication
      - - Cancer-outcome claims are explicitly limited
        - HistoSonics says the FDA has not evaluated cancer outcomes or any other specific disease
        - Clinical enthusiasm may run ahead of reimbursable or guideline-supported adoption
        - Review clinical evidence package, reimbursement status, and physician adoption thresholds
      - - Specialist-site rollout drives adoption pace
        - CE-mark rollout starts with select centers and first U.S. treatments are highlighted site by site
        - Expansion likely follows a slower center-onboarding curve than generic medtech TAM language implies
        - Obtain site count, utilization by cohort, and repeat-procedure data
      - - Market dollars are not publicly quantified in the retained pool
        - No retained source discloses TAM, SAM, SOM, reimbursement owner, or budget-line math
        - Valuation should depend on execution milestones rather than unsupported market-size arithmetic
        - Build a bottoms-up model from sites, procedures, pricing, and reimbursement once available
