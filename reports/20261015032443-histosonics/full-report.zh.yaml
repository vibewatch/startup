  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式可见度是方向性的，尚不足以支撑投资判断
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一种围绕医院系统部署的商业化模式，而不是已披露的经常性软件收费流。HistoSonics 表示 Edison 已在 50 多个中心治疗超过 2,000 名患者，并计划再安装 50
              套系统；更早的上市更新则称公司正在培训关键员工，并在美国启动十多个合作伙伴项目。2026 年新闻流又增加 CE 标志和 TFDA
              里程碑，扩大平台可销售的地域。这足以看出商业飞轮——安装系统、培训站点、推动手术，再扩展适应症和地域——但不足以看清目录价格、实际 ASP、报销收入捕获或毛利转化。
