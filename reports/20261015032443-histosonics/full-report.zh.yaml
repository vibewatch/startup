    title: 客户旅程图
    type: journey-map
    summary: 采用路径从医生主导的肝脏中心目标筛选开始，经由标杆站点验证，再通过活跃中心扩张、部分欧洲中心和经销商主导的地区逐步扩大。
    data:
      items:
        - label: 目标肝脏肿瘤项目
