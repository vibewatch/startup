      - number: '2.3'
        title: 公开证据显示势头和资本，但不足以构建可辩护的 TAM
        blocks:
          - type: paragraph
            body: >-
              指定工作池支持与估值相关的势头信号，却不足以构建清晰的 TAM/SAM/SOM。MedTech Dive 和 VCA Online 都将 2025 年融资与全球商业扩张及新增适应症联系起来，Tracxn 则报告
              12 轮累计融资 5.66 亿美元，并在 2026 年 6 月出现 E
              轮。这些事实很重要，因为该品类似乎资本密集：公司必须扩大监管范围、培训站点并证明手术需求可重复，市场才可能接近广泛的医疗科技平台。来源同样没有提供关键内容：已审阅的公开材料没有组织学碎片化的数值 TAM、SAM
              或 SOM 方法，没有披露报销方，也没有明确的医院预算科目。因此，当前最可用的规模视角受到约束：肝肿瘤当前用途、作为下一地域切入口的欧洲，以及作为主要解锁项的新器官适应症；使用率、报销和真实单站点经济性仍需尽调。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
