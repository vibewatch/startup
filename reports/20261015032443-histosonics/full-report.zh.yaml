              当前获准做什么，以及接下来仍需执行什么。公开证据支持狭窄的当前商业基础：美国肝肿瘤用途、对正式培训的依赖，以及分阶段的地域和适应症扩张。最高严重度风险集中在监管范围扩大、站点启动吞吐量，以及在公司进入肾脏、胰腺和前列腺项目之前，临床热度能否转化为可重复的多中心使用。新资本降低了眼前融资压力，但工作池没有披露现金消耗、投诉趋势或合同经济性，不能把下游风险视为已解决。
