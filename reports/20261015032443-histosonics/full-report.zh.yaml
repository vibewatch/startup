chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 将自己描述为一家私营医疗器械公司，围绕 Edison Histotripsy System
              构建业务。这是一套无创聚焦超声平台，通过机械方式摧毁目标组织，用于治疗肝肿瘤，同时公司正在推进其他器官适应症。留存来源一致将其运营足迹定位在密歇根州安娜堡，另有来源提到明尼苏达州明尼阿波利斯是其办公室或运营基地。这里最稳定的事实是
              Edison 的产品性质、公司的运营地点，以及 FDA De Novo 放行于 2023 年 10 月针对肝肿瘤，而非广泛癌症平台。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              本轮工作池的公开证据将 Mike Blue 置于核心运营者位置：2025 年收购材料显示他继续担任总裁兼 CEO，并将接任董事长；更早的 2024 年 D 轮材料则显示 Alpha Wave 的 Chris
              Dimitropoulos 获得投资人董事席位。Joe Herman
              作为与首批商业手术相关的医疗负责人出现，有助于临床可信度，但工作池没有提供创始人履历或完整的现任董事会名单。因此，关键人物集中度和治理透明度仍是真实的尽调问题，而非已解决事实。
