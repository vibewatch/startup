  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 当前市场边界是狭窄的肝肿瘤切入口，而非一般肿瘤学 TAM
        blocks:
          - type: paragraph
            body: >-
              在开始估算规模前，指定证据支持先严格界定市场。HistoSonics 当前商业切入口是肝肿瘤；其技术页面将预期用途限定为“通过组织学碎片化部分或完全摧毁不可切除的肝肿瘤”，并警告 FDA
              尚未评估该系统的癌症结果或任何其他特定疾病。MassDevice 独立地将同一产品定义为用于肝肿瘤的无创组织学碎片化平台，并指出 CE
              标志批准把这一用途扩展到欧洲。因此，眼前机会不是“全部肿瘤学”，甚至也不是所有聚焦超声手术，而是一条由专科手术驱动的肝肿瘤采用路径；其替代方案是手术、热消融、放疗及其他侵入性肝脏干预，而不是通用软件预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: 扩张取决于地域、新适应症和专科站点部署
        blocks:
          - type: paragraph
            body: >-
              公开材料描述了真实的扩张路径，但也显示它仍是分阶段推进。MassDevice 称 CE 标志让 HistoSonics 能在欧洲将 Edison 商业化用于肝肿瘤，并从精选专科中心开始；Synektik
              则称自己是波兰及若干中东欧国家的独家分销商。公司公告和独立行业报道也持续把肾脏、胰腺、前列腺和 BPH
              列为当前肝脏业务之外的下一批增长方向。与此同时，工作池中最强的直接采用证据仍是早期站点验证：HistoSonics 强调 De Novo 放行后，罗切斯特大学医学中心和 Cleveland Clinic
              首次按标准临床实践开展治疗。因此，市场会逐中心、逐适应症、逐地域扩展，医生和专科肿瘤中心是实际采用瓶颈。
