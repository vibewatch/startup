  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局仍由治疗方式主导，而非同业对标
        blocks:
          - type: paragraph
            body: >-
              留存来源并未把 HistoSonics 描绘成拥挤产品品类中的又一家供应商，而更像是嵌入既有肝肿瘤治疗路径的新型局部治疗选项。独立来源和公司材料都将 Edison
              与手术、放疗、化疗和传统热消融对比，而不是列出已披露的同治疗方式同行。因此，当前竞争由治疗方式主导：中心要决定把符合条件的患者送入成熟的侵入性或热消融流程、新的无创组织学碎片化流程，或在切除和消融都不合适时让患者停留在选择有限的路径中。未来竞争范围也会扩大，因为
              HistoSonics 正试图把用途从肝脏推进至肾脏、胰腺、前列腺和 BPH，而不同器官和专科的既有标准及买方异议并不相同。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP011
