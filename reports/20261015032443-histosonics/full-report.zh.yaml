      - number: '4.2'
        title: 资本获取能力仍强，也说明资本密集度持续
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 在控制权交易后仍反复融资或吸引资本。Johnson & Johnson Innovation 发布了公司 2024 年 8 月 1.02 亿美元 D 轮公告，资金用于商业增长和
              BOOMBOX 研究。公司随后宣布 22.5 亿美元多数股权收购，又完成超额认购的 2.5 亿美元增长融资；MedTech Dive 称收购财团也参与了后续轮次。2026 年，HistoSonics
              官方新闻页和分销商 Synektik 都指向另一笔包含 Yosemite
              参与的融资，但指定公开来源没有披露金额或条款。这种模式对资本获取是积极信号，但也意味着商业扩张、适应症开发和全球部署仍在透明的自我融资指标形成前依赖资金投入。
