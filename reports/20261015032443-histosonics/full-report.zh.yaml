  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 视角
      - 论点
      - 改变判断的因素
    rows:
      - - 正方论点
        - 首创产品的证明强于大多数私营医疗科技资产：FDA 批准、逾 2,000 名已治疗患者和不断扩大的站点基数，都支持真实的商业化路径。
        - 如果安装无法转化为重复手术量或付款方认可，这套证明叙事会迅速走弱。
      - - 正方论点
        - 老练投资者持续为该平台提供资金，包括 2025 年 8 月的控股交易和 2025 年 10 月的超额认购融资。
        - 如果后续融资附带沉重的优先权，或在经济性改善前就必须融资，同一融资记录的看多意义会减弱。
      - - 反方论点
        - 相对于表面估值，价格记录仍很薄，因为公开证据缺少经审计的收入质量、已披露利润率和当前股权结构条款。
        - 经审计的使用率队列、利润率披露和优先权细节会削弱这一疑虑。
      - - 反方论点
        - 肝脏以外的扩张仍有执行和时间表风险，因此当前估值可能过早计入未来适应症。
        - 肾脏领域按期推进监管，以及肝脏领域持久的商业采用，会加强扩张逻辑。
    notes: 每行都将最有证据支持的正面因素，与会推翻相应疑虑或强化相应优势的具体披露或里程碑配对。
