      - number: '4.3'
        title: 公开投资判断障碍仍然很大
        blocks:
          - type: paragraph
            body: >-
              独立报道提供了本工作池中仅有的类收入数字，却不足以填补尽调缺口。Fierce Biotech 援引 Financial Times 称，HistoSonics 对“今年”的收入预测为 1 亿美元、2026 年为
              2 亿美元，同时报道公司在市场不确定性下放弃出售前曾探索出售和
              IPO。没有经审计收入、确认政策、毛利率、现金余额、现金消耗、债务、营运资金需求或手术级报销经济性，这些信号无法转化为可辩护的利润路径或现金跑道模型。因此，财务结论是：融资获取和商业势头偏正面，但收入质量、资本密集度和下一轮融资依赖仍需谨慎。
