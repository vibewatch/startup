        blocks:
          - type: paragraph
            body: >-
              在大规模投资新资本前，投资者仍需证明运营增长正在转化为持久经济性和可管理的上市后风险。指定工作池确认了扩张融资和多数股权控制重置，但没有以足以消除下行不确定性的方式披露跑道、现金消耗、利润率、董事会控制保护或投诉/MDR
