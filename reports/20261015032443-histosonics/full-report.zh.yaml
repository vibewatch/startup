            body: >-
              留存证据显示三项细节程度不同的资本里程碑：2024 年 8 月完全披露的 1.02 亿美元 D 轮融资、2025 年 8 月约 22.5 亿美元的多数股权收购，以及 2025 年 10 月超额认购的 2.5
