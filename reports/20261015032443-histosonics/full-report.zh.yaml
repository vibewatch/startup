        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              投资判断的争议不是 HistoSonics 是否拥有真实产品证明；它确实有。公司和合作伙伴来源称，2025 年 8 月交易在 FDA 放行、治疗超过 2,000 名患者、拥有 50
              多家活跃美国中心并计划年末前再安装 50 套之后，将公司估值定为约 22.5 亿美元。更难的问题是价格是否有支撑。指定公开证据显示，控制权交易仅两个月后又完成一轮大型融资，并只有一个第三方 2025 年 10
              月估值/收入倍数数据点。这足以支持严肃尽调，但不足以按当前表面价格给出买入式结论。因此，入场纪律应锚定更完整的单位经济性、使用率和资本结构披露，而不是单靠技术热情。
