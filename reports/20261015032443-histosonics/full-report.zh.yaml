      - number: '3.2'
        title: 当前差异化来自治疗方式新颖性、证明点和流程落地能力
        blocks:
          - type: paragraph
            body: >-
              HistoSonics 最强的公开差异化并不是低价或广泛的包装披露，而是首创组织学碎片化平台、可见的早期部署，以及把影像、医生培训和站点上线结合起来的流程。公司材料称 Edison
              是全球首个且唯一获准临床使用的组织学碎片化平台；已有超过 2,000 名患者在 50 多家美国医疗中心接受治疗；公司预计 2025 年交易后年末前再安装 50
              套系统。独立专利分析又增加了一层护城河：平台覆盖超声治疗、机器人定位、影像和软件/控制知识产权，而不只是一个营销说法。这使 HistoSonics
              比独立耗材或狭窄的软件功能更难复制，但也意味着采用取决于培训、安装和中心级标杆建设，而不是轻量软件销售。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP011
              - CP013
      - number: '3.3'
        title: 转换摩擦存在，但公开价格和直接同行可见度仍弱
        blocks:
          - type: paragraph
            body: >-
              支持 HistoSonics 新颖性的同一批证据，也限制了清晰的投资判断式比较。Medical Economics
              明确描述，越来越多的影像引导选项旨在补充而非替代外科和介入治疗标准，这提醒我们，既有流程仍掌握转诊能力和临床正当性。同时，留存的融资和上市报道没有公布 Edison
              的目录价格、折扣、手术经济性或合同结构，因此公开来源还不支持与现有替代方案做同口径价格比较。简言之，HistoSonics
              似乎已具备吸引中心关注的差异化，但本工作池的公开记录仍过于单薄，既无法证明持久的替代经济性，也无法像治疗方式层面的比较那样有把握地列出直接商业同行。
            claimRefs:
