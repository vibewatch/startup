  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐结论从已验证的临床牵引力出发，落到更薄弱的定价和披露记录上。
    data:
      nodes:
        - id: proof
          label: 临床验证
          detail: FDA 批准的肝脏肿瘤平台，已治疗超过 2,000 名患者，覆盖超过 50 个活跃的美国中心。
        - id: scale
          label: 商业规模信号
          detail: 年底前计划再安装 50 套系统，且全球适应症持续扩张。
        - id: capital
          label: 资本支持
          detail: $2.25B 控制权交易之后，又完成超额认购的 $250M 融资。
        - id: price
          label: 价格锚点
          detail: 一条 2025 年 10 月的第三方数据记录显示，以 $100M 收入对应 $3B 估值，即 30.0x。
        - id: gaps
          label: 披露缺口
          detail: 此处留存的来源没有披露经过审计的使用量队列、现金消耗或收购后的优先权条款。
        - id: call
          label: 推荐结论
          detail: 继续研究；高风险；在经济性和条款更加清晰前，估值偏高。
      edges:
        - from: proof
          to: scale
          label: 支持
        - from: scale
          to: capital
          label: 吸引
        - from: capital
          to: price
          label: 设定
        - from: price
          to: gaps
          label: 被……削弱
        - from: gaps
          to: call
          label: 驱动
    approximationNotes: 该图是逻辑链而非量化模型；它概括留存证据如何改变推荐结论。
