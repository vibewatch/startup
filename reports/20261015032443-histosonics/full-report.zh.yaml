  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 安装基数增长转化为高重复使用率，肾脏 / 胰腺 / 前列腺拓展按期落地，投资者继续提供融资且没有惩罚性条款。
        - 溢价倍数可以维持或扩大，因为公司将证明自己是多适应症平台，而不只是单一肝脏设备。
        - 每增加一个适应症或地域，执行负担都会上升。
        - 需要清晰披露 2026-2027 年使用率、利润率和融资结构。
      - - 基准
        - 肝脏采用率增长，但后续器官里程碑和单位经济性降低风险的速度慢于表面融资故事所暗示的速度。
        - 业务可以支撑较高的私募估值，但由于上行空间已有部分资本化，新进入者需要更严格的定价。
        - 倍数压缩、使用率放缓，或在经济性得到完整证明前追加融资。
        - 最符合当前证据集。
      - - 悲观
        - 手术增长落后于安装，肝脏以外扩张延误，且在经济性透明前的后续融资带来优先权悬置。
        - 表面企业价值可以维持高位，但普通股入场回报会明显压缩。
        - 条款不透明、倍数偏高，以及漫长的商业化周期。
        - 如果披露持续稀疏而资本需求继续，这一情景就更可能发生。
    notes: 这些情景是方向性的判断框架，不是模型测算的公允价值，因为所分配的公开证据未披露经审计的收入质量、利润率结构或股权结构条款。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
