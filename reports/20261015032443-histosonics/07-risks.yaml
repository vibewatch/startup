company:
  name: HistoSonics
chapter:
  number: 7
  title: Risks
  summary: >-
    HistoSonics' risk stack is led by regulatory-scope dependence and training-heavy
    rollout execution rather than a disclosed safety crisis or financing shortfall in
    the assigned evidence pool. The key public-source concern is that commercial proof
    still sits on a liver-only label, select-center expansion, and field-intensive site
    enablement while cash-burn, post-market complaint, and governance-detail evidence
    remain under-disclosed.
sections:
  - id: ranked-risk-stack
    title: Risk concentration sits in expansion execution, not in a surfaced public crisis
    body: >-
      The assigned pool does not surface a public enforcement action, recall, or
      disclosed litigation event, so the main risk picture comes from what HistoSonics
      is officially authorized to do today versus what it still needs to execute next.
      Public evidence supports a narrow current commercial base: U.S. liver-tumor use,
      formal training dependence, and staged geographic and indication expansion. That
      leaves the highest-severity risks clustered around regulatory broadening, site
      activation throughput, and whether clinical enthusiasm converts into repeatable
      multi-center utilization before the company stretches into kidney, pancreas, and
      prostate programs. New capital reduces immediate financing pressure, but the pool
      does not disclose cash burn, complaint trends, or contract economics strongly
      enough to treat those downstream risks as resolved.
    claimRefs: [CR001, CR002, CR004, CR006, CR010, CR014, CR015]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-and-clinical-scope
    title: Regulatory breadth remains the gating risk to broader commercialization
    body: >-
      The strongest hard constraint is still label scope. FDA-cleared commercial use is
      for liver tumors, while company disclosures separately caution that the FDA has
      not evaluated cancer outcomes or other disease claims and that kidney use remains
      investigational. Europe is now an expansion path because CE Mark was reported in
      July 2026, but even that launch is described as phased and centered on select
      liver-treatment centers rather than a broad channel release. The 2023 pivotal
      evidence was credible enough to unlock de novo commercialization, yet it still
      reflects modest trial scale, which means further indication growth remains
      exposed to regulator timing, additional study execution, and post-market
      evidence quality.
    claimRefs: [CR001, CR002, CR003, CR006, CR008, CR011]
  - id: rollout-and-operational-dependencies
    title: Rollout quality depends on training throughput, workflow integration, and partner execution
    body: >-
      HistoSonics' own materials describe Edison as a physician-controlled, imaging-led
      workflow rather than a push-button install, and the training role in the pool is
      correspondingly hands-on. Site activation therefore depends on instructor
      capacity, travel-intensive field coverage, and consistent physician proficiency
      across treatment planning, ultrasound imaging, and troubleshooting. The hardware
      stack also depends on integrated ultrasound equipment, reusable capital hardware,
      and disposable procedure components, which raises classic medtech scaling risks
      around supply coordination, uptime, and quality-system discipline. Early named
      customer proof and the company's own reference to first partner programs suggest
      traction, but they also imply that rollout concentration in a relatively small
      set of centers can still slow or skew expansion if activation quality slips.
    claimRefs: [CR004, CR005, CR007, CR012, CR013, CR015]
    tableRefs: [TR002, TR003]
  - id: monitoring-and-kill-criteria
    title: The unresolved diligence asks are economic durability, complaint visibility, and control terms
    body: >-
      Before underwriting fresh capital at scale, investors still need evidence that
      operational growth is translating into durable economics and manageable
      post-market risk. The assigned pool confirms funding for expansion and a
      majority-stake ownership reset, but it does not disclose runway, burn, margin,
      board-control protections, or complaint/MDR trends in a way that clears downside
      uncertainty. Practical kill criteria are therefore measurable: a delay or denial
      in kidney-label expansion, weak European conversion beyond select centers,
      meaningful post-market safety or quality disclosures, or evidence that
      installation growth outruns physician training quality and repeat procedure use.
    claimRefs: [CR003, CR009, CR010, CR014, CR015]
