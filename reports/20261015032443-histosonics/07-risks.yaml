callouts:
  - calloutType: risk
    title: Highest-priority thesis-break triggers
    body: >-
      A delayed or failed kidney expansion, weak European conversion outside select
      centers, material post-market safety/quality disclosures, or installation growth
      that outruns training quality would each damage the current commercialization
      thesis more than a single missed quarter of fundraising optics.
    claimRefs: [CR002, CR004, CR006, CR010, CR015]
  - calloutType: insight
    title: The financing story is not the same as the risk story
    body: >-
      New capital and a $2.25 billion transaction reduce immediate balance-sheet stress,
      but they do not answer whether utilization, margins, and regulatory expansion can
      support the next phase of rollout without hidden quality or governance friction.
    claimRefs: [CR009, CR010, CR014, CR015]
