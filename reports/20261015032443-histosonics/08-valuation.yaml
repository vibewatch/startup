  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Audited revenue, gross margin, and per-system utilization by cohort or site age.
      whyItMatters: Those metrics determine whether the current valuation anchors are supported by repeatable economic throughput instead of just placements and financing momentum.
      diligencePath: Request board or lender materials with audited 2025 and trailing-2026 revenue quality, contribution margin, and utilization cohorts.
    - type: missing-source
      severity: material
      topic: capital-structure-gap
      missingEvidence: Post-acquisition cap table, liquidation preferences, and any senior security or structured-financing rights tied to the 2025-2026 rounds.
      whyItMatters: Preference overhang can materially separate enterprise-value optics from returns available to new common-equity entrants.
      diligencePath: Obtain the post-acquisition financing documents or a current cap-table summary from management and counsel.
      relatedQuestionRefs:
        - QV008
    - type: missing-source
      severity: material
      topic: liquidity-runway
      missingEvidence: Current cash balance, burn, debt, and runway after the acquisition and subsequent financings.
      whyItMatters: The need for further capital could change both negotiation leverage and downside protection.
      diligencePath: Request monthly cash bridge, debt schedule, and 12-18 month operating plan from finance leadership.
      relatedQuestionRefs:
        - QV007
        - QV008
    - type: stale
      severity: minor
      topic: indication-expansion
      missingEvidence: Updated kidney, pancreas, or prostate milestone timing after the 2025 announcements.
      whyItMatters: Scenario upside depends on whether non-liver applications arrive fast enough to justify premium price anchors.
      diligencePath: Ask for current regulatory timeline, enrollment status, and commercialization assumptions for each non-liver program.
      relatedQuestionRefs:
        - QV006
        - QV007
