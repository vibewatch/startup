        - id: capital
          label: Capital support
          detail: $2.25B control transaction followed by an oversubscribed $250M financing.
        - id: price
          label: Price anchor
          detail: One third-party October 2025 datapoint records $3B valuation on $100M revenue, or 30.0x.
        - id: gaps
