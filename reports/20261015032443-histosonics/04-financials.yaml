schemaVersion: report-v2
artifact: financials
slug: histosonics
runDate: 2026-10-15
company:
  name: HistoSonics
chapter:
  number: 4
  title: Financials
  summary: >-
    HistoSonics has kept capital access open through a 2024 Series D, a 2025 majority-stake acquisition,
    a later 2025 growth financing, and another financing announcement in 2026. Public evidence confirms
    placement and adoption momentum, but it still does not disclose pricing, margin, cash, burn, debt,
    or reimbursement detail well enough to underwrite revenue quality or runway.
sections:
  - id: revenue-model-visibility
    title: Revenue model visibility is directional, not underwritable
    body: >-
      The public record supports a commercialization model built around hospital system placements rather
      than a disclosed recurring-software fee stream. HistoSonics said Edison had treated more than 2,000
      patients at over 50 centers, with another 50 planned installations, and an earlier launch update
      said the company was training key staff and launching over a dozen partner programs in the United
      States. The 2026 news feed then adds CE Mark and TFDA milestones that expand where the company can
      sell the platform. That is enough to see the commercial flywheel - install systems, train sites,
      drive procedures, then expand indications and geographies - but not enough to see list price,
      realized ASP, reimbursement capture, or gross profit conversion.
    claimRefs: [CI004, CI008, CI009, CI011, CI012, CI015, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-base-and-scaling
    title: Capital access remains strong, which also signals continuing capital intensity
    body: >-
      HistoSonics has repeatedly raised or attracted capital even after a change-of-control transaction.
      Johnson & Johnson Innovation published the company's August 2024 announcement of a $102 million
      Series D for commercial growth and the BOOMBOX study. The company later announced a $2.25 billion
      majority-stake acquisition and then an oversubscribed $250 million growth financing; MedTech Dive
      said the acquisition consortium also joined that later round. In 2026, HistoSonics' official news
      page and distributor Synektik both pointed to another financing that included Yosemite participation,
      but the assigned public sources do not disclose the amount or terms. That pattern is positive for
      access to capital, but it also implies that commercial expansion, indication development, and global
      rollout are still being funded ahead of transparent self-financing metrics.
    claimRefs: [CI001, CI002, CI003, CI005, CI006, CI007, CI009, CI010]
    tableRefs: [TI003]
  - id: underwriting-blockers-and-verdict
    title: Public underwriting blockers remain substantial
    body: >-
      Independent reporting adds the only revenue-like figures in this pool, but not enough to close the
      diligence gap. Fierce Biotech, citing the Financial Times, said HistoSonics had revenue predictions
      of $100 million "this year" and $200 million in 2026, while also reporting that the company had
      explored both a sale and an IPO before opting for a sale amid market uncertainty. Without audited
      revenue, recognition policy, gross margin, cash balance, burn, debt, working-capital requirements,
      or procedure-level reimbursement economics, those signals cannot be converted into a defensible
      margin path or runway model. The financial verdict is therefore favorable on fundraising access and
      commercial momentum, but still cautious on revenue quality, capital intensity, and next-round
      dependency.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Edison system placements
        - Hospitals adopt Edison as a capital-equipment platform and add trained treatment sites.
        - System / site
        - >-
          Company-backed sources said Edison had treated more than 2,000 patients at over 50 centers,
          with another 50 planned system installations.
        - Adoption proxy is public; monetization terms are not.
        - Provide executed contracts, installed-base by cohort, and install-to-first-procedure timing.
      - - Training and launch programs
        - Training key staff and opening partner programs help sites go live and begin procedures.
        - Program / site
        - Official launch update said HistoSonics was launching over a dozen partner programs in the U.S.
        - Company-claimed operational proxy, not a disclosed revenue line.
        - Break out training obligations, any paid service component, and site activation cost.
      - - Geographic expansion
        - Regulatory wins open additional commercial territories for the same platform.
        - Region / approval
        - Official news page lists CE Mark in Europe and TFDA approval in Taiwan during 2026.
        - Expansion lever is public; shipped-unit and ASP detail is not.
        - Provide country-level launch plan, distributor economics, and initial order backlog.
      - - Indication expansion
        - New organ indications expand the procedure opportunity on the installed platform.
        - Organ / indication
        - 2025-2026 sources describe kidney, pancreas, and prostate expansion activity.
        - Direction of expansion is public; incremental revenue mix is not.
        - Provide expected timing, reimbursement path, and contribution margin by indication.
    notes: >-
      Partial revenue model view only: public evidence supports placement and expansion mechanics, while
      price realization, service attach, and recurring economics remain undisclosed.
    claimRefs: [CI004, CI008, CI011, CI012, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Commercial lever
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Edison system capital purchase
        - null
        - No public list price or realized ASP appears in the assigned pool.
        - Discounting, financing support, and acceptance milestones are undisclosed.
        - Official and news sources reviewed for this chapter
      - - Training / service obligations
        - null
        - No public rate card or service contract structure appears in the assigned pool.
        - Unknown whether training or support is charged separately or bundled into placements.
        - Official launch update and later financing coverage
      - - Procedure / reimbursement economics
        - null
        - No public procedure price, reimbursement capture, or revenue-recognition policy appears in the assigned pool.
        - Mix by payer, hospital, and indication remains undisclosed.
        - Official, partner, and independent reporting reviewed for this chapter
    notes: >-
      Null means the assigned public sources did not disclose the price point or contract structure; this
      table is a diligence map, not evidence that a charge definitely exists for every row.
    claimRefs: [CI013, CI015, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 financing base
        - $102 million Series D
        - High
        - Funded U.S. commercial growth and the BOOMBOX study before the later ownership change.
        - Reconcile how much of this capital remained before the later acquisition and follow-on financings.
      - - Change-of-control valuation
        - Approximately $2.25 billion majority-stake acquisition
        - High
        - Anchors investor expectations but does not disclose operating quality or liquidation terms.
        - Provide full cap table, secondary component, preference stack, and governance rights.
      - - 2025 growth financing
        - $250 million oversubscribed round
        - High
        - Suggests ongoing capital demand for global scale, new indications, and operational capacity.
        - Provide use-of-funds bridge, milestone plan, and runway assumptions.
      - - Current commercial traction proxy
        - >-
          More than 2,000 patients treated; over 50 centers; another 50 planned installations
        - High
        - Strongest public adoption proxy when audited revenue and utilization cohorts are unavailable.
        - Provide paid procedures per site cohort, utilization ramp, and reorder behavior.
      - - Latest financing disclosure
        - 2026 financing announced with Yosemite participation; amount undisclosed
        - Medium
        - Confirms capital inflow remained active after the 2025 transactions.
        - Provide amount, security type, dilution, and investor rights.
      - - Forward revenue signal
        - 'FT via Fierce: $100 million "this year" and $200 million in 2026'
        - Low
        - Only revenue-like numbers in the assigned pool, but unverified and not tied to margin.
        - Provide audited revenue, backlog, recognition policy, and gross margin by product line.
      - - Margin and runway disclosure
        - null
        - Low
        - Public blind spot that blocks CAC/payback, margin-path, and runway underwriting.
        - Provide cash, burn, debt, working-capital needs, capex, and service-delivery cost detail.
    notes: >-
      This table mixes reported capital events with operating proxies because the assigned public sources do
      not disclose a usable revenue-and-margin model; null means undisclosed, not zero.
    claimRefs: [CI001, CI003, CI004, CI005, CI009, CI010, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how financing and adoption milestones could convert into system revenue, while
      still stopping short of a disclosed gross-profit model.
    data:
      nodes:
        - label: Investor capital
          detail: 2024 Series D, 2025 acquisition and growth financing, and a new 2026 financing announcement.
        - label: System placements
          detail: Hospitals continue to order Edison systems, with another 50 planned installations by year-end.
        - label: Training and site activation
          detail: HistoSonics described training key staff and launching over a dozen partner programs.
        - label: Procedure utilization
          detail: Edison had treated more than 2,000 patients at over 50 centers in company-backed sources.
        - label: Geography and indication expansion
          detail: Europe and Taiwan approvals plus kidney, pancreas, and prostate expansion widen the commercial surface.
        - label: Revenue and gross profit visibility
          detail: Public sources do not disclose ASP, reimbursement capture, service costs, or gross margin conversion.
    approximationNotes: >-
      Sequence shows the authored commercial logic only; it does not imply quantified conversion rates,
      margins, or timing between stages.
    claimRefs: [CI001, CI003, CI004, CI005, CI008, CI009, CI011, CI012, CI015, CI016]
callouts:
  - calloutType: strength
    title: Capital access survived the control change
    body: >-
      The 2024 Series D, 2025 $2.25 billion acquisition, 2025 $250 million growth round, and another 2026
      financing announcement together show unusually strong financing access for a private medtech platform.
    claimRefs: [CI001, CI003, CI005, CI009]
  - calloutType: risk
    title: Public economics remain too thin for a clean underwriting case
    body: >-
      The assigned sources do not disclose price realization, gross margin, cash, burn, debt, or procedure
      reimbursement economics, so investors still cannot model payback or runway from public evidence alone.
    claimRefs: [CI013, CI016]
  - calloutType: insight
    title: Adoption proxies matter more than any single revenue number
    body: >-
      In this evidence set, the most usable commercial signals are system placements, treated-patient counts,
      training programs, and new geography or indication approvals rather than audited revenue disclosure.
    claimRefs: [CI004, CI008, CI011, CI012, CI013, CI015]
