              Deepwatch 销售的是 AI 辅助的托管安全服务，接入客户现有安全栈，把自动化运营和持续专家监督结合起来。这些证据支持的是“人员 +
              平台”的交付模式，而不是某种具体计费模式：指定来源既未披露标价或实际合同金额，也未披露计费单位、折扣安排、合同期限或收入确认政策。因此，商业逻辑依赖于把广泛集成和全天候服务转化为持久客户合同，但公开证据无法证明收入究竟是经常性、按用量、按
              retainers，还是混合模式。没有管理层记录，任何 ARR、ACV、订单积压或递延收入结论都为时过早。
