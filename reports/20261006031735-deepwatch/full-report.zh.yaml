        title: 展示项
        blocks:
          - type: callout
            title: 租户内 SIEM 架构消除了数据复制开销
            body: >-
              Deepwatch 原生 Microsoft Sentinel 和云 SIEM 部署模式避免把客户原始日志复制或仓储到第二个专有存储库。通过直接在客户 Azure 边界内执行分析和狩猎查询，Deepwatch
              可去除大量数据导出费用，并缓解企业安全审查中的数据主权顾虑。
