      - number: '3.2'
        title: 架构权衡、SIEM 所有权与定价动态
        blocks:
          - type: paragraph
            body: >
              在托管安全服务中，决定长期供应商匹配度和切换摩擦的，可能是架构结构，而不是表面的功能清单。Deepwatch 称其运行在企业既有 SIEM 和 EDR 部署之上。有意向的竞争者 UnderDefense 将
              Deepwatch 描述为以 Splunk 为锚点，而 Arctic Wolf
              则把客户遥测标准化到专有云原生平台中。指定证据没有独立确认这些所有权和访问权限说法，因此买方应直接在产品文档和合同中核实部署所有权、原始数据访问、检测规则权利及导出格式。


              商业结构可能反映这些架构选择，但指定来源没有出现标准的 Deepwatch 或 Arctic Wolf 价目表。UnderDefense 援引买方报告称，Arctic Wolf 年费中位数接近
              $96,340，约在 $29,000 至 $320,000 之间，并描述了不限摄入量的按用户计费模式。同一竞争者称，Deepwatch 的经济性会随着 Splunk
              摄入量上升，规则可移植性则取决于实例所有权。这些是尽调假设，不是经验证的实际价格或合同条款。必须取得同口径报价和标红协议，检验遥测假设、附加项、折扣、响应权限、数据导出成本及迁移支持。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: 切换成本、护城河持久性与尽调要点
        blocks:
          - type: paragraph
            body: >
              评估 MDR 护城河的持久性，需要在服务留存优势和潜在切换障碍之间权衡。Deepwatch 称其命名 Squad 模式是内部安全团队的延伸，并报告支持超过 800
              个遥测来源。这些公司发布的说法表明它已嵌入运营，但不能证明客户留存，也不能证明客户离开后必须重建管线或规则。退出摩擦取决于每个客户的架构和合同：SIEM、标准化数据、检测内容、案件历史和自动化分别由谁拥有，以及这些资产能否以可用格式导出。


              RFP.wiki 报告了反复出现的告警量激增、仪表盘可见性、按量定价、仅美国的全天候覆盖以及领导层或人员变动等担忧。这种目录汇总是有用的反向证据，但不能替代直接客户群、服务水平记录或续约数据。Deepwatch
              自己的自动威胁防护说明也承认，自动化需要校准阈值、可观测性、回滚和治理，才能避免业务中断。因此，Deepwatch 仍需证明，相比固定费用、平台原生、相邻暴露面管理和内部自建方案，NEXA 及其人工治理的
              Squad 模式能改善经验证结果和总拥有成本。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 架构结构决定可逆性与退出成本
            body: >-
              商业营销强调全天候覆盖和 AI 加速，但数据所有权和检测规则可移植性可能决定退出成本。竞争者 UnderDefense 将 Deepwatch 描述为以 Splunk
              为锚点且对用量敏感；在所有权、定价、导出和规则权利得到直接核实前，买方应把这一说法视为合同尽调假设。
            calloutType: insight
