        - 20%（对当前实际增长速度可见性低）
      - - 基准情景
        - 收入稳定在 $85M-$100M 左右；温和的低两位数增长
        - $200M-$260M EV（混合技术 / 服务组合对应 2.0x-2.6x ARR 倍数）
        - 偿债义务挤压自由现金流；利润率收缩
        - 55%（与第三方建模的收入基准一致）
      - - 悲观情景
        - 重组后客户流失；ARR 收缩至 $70M 以下
        - <$150M EV；可能重组或违反信贷契约
        - Vista Credit 优先止赎或高度稀释性的资本重组
        - 25%（受不透明的现金消耗率和领导层更替推高）
    notes: 情景估值反映以混合型网络安全服务商为基准的示意性 ARR 倍数区间。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV010
      - CV011
      - CV012
