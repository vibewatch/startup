      - number: '5.3'
        title: 架构、部署集成与外部依赖
        blocks:
          - type: paragraph
            body: >-
              Deepwatch 的底层技术架构是一个分析与编排覆盖层，位于客户拥有的 SIEM 和安全数据存储之上。在 Microsoft Azure 和 Sentinel 部署中，Deepwatch MDR 使用
              Azure 原生连接器和 API 标准化遥测，编写自定义 KQL
              分析规则及持续威胁狩猎流程，不复制原始事件日志，也不把敏感客户遥测存放在外部。这种不复制方式可减少数据导出费用，并应对受监管企业严格的数据主权约束。同样，在 Splunk 和第三方数据环境中，Deepwatch
              借助定制集成包、应用和 API 管线，同步威胁情报指标、自动生成工单并执行远程遏制动作。


              尽管自动化程度很高、营销口径也声称自主 SOC 运营，Deepwatch 仍严重依赖外部软件编排平台和人工运营人员。技术集成基准显示，Deepwatch 纳入 Torq
              等商业编排引擎，以扩大自主工作流执行规模，并连接客户云环境中割裂的安全工具。此外，NEXA AI
              生态负责初步丰富和抑制误报，但最终遏制决策和威胁狩猎效果仍根本依赖人工专业能力，具体包括专门的安全运营工程师、上线专家和威胁猎手。公开开发者生态指标显示，其开源软件贡献和公开开发工具极少，说明 Deepwatch
              的竞争壁垒依靠专有平台集成和托管运营流程，而非开源社区分发。
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
              - CE010
              - CE012
