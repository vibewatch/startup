      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模视角
        blocks:
          - type: paragraph
            body: >-
              估算 Deepwatch 的可服务市场，需要把宽泛的网络安全支出拆成可验证的服务层，而不是依赖不受约束的顶线估计。Gartner 的行业研究认为，企业通信服务中的 AI Security
              具备较高潜在收益，并正在进入早期主流采用阶段 CM004。然而，独立商业数据库对 Deepwatch 实际规模的画像差异很大：IncFact 依据行业损益表平均值，将公司模型化为年收入 $100M 至 $500M
              的宽区间 CM002、CM011；Datanyze 和 Prospeo 的私有数据库记录则给出 $84 million 至 $120 million 的点估收入，并列出累计风险融资 $256 million
              CM011、CM012。按市场渗透看，6sense 的技术画像数据显示，Deepwatch 在宽泛网络安全品类中的市场份额为 0.05%，并追踪到 66 个经验证的客户部署
              CM005。这些已检测客户中绝大多数（87.7%）集中在美国，因此北美企业防御构成 Deepwatch 实际可服务市场的有效地理范围 CM007。TAM
              的根本边界仍取决于企业是否愿意把运营遏制权限交给外部托管伙伴 CM014。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM007
