  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户安全工作流
        blocks:
          - type: paragraph
            body: >-
              Deepwatch 以混合式托管检测与响应（MDR）平台运行在客户企业环境中，直接接入既有安全栈，不要求部署专有代理或替换基础设施。它不强迫客户把数据迁出主要云数据湖或 SIEM，而是让 Guardian MDR
              Platform 接入云原生安全信息与事件管理工具（如 Microsoft Sentinel 和
              Splunk），摄入遥测、标准化不同事件日志，并直接在客户云边界内丰富信号。这种架构让企业安全运营团队能够持续看见端点、身份提供商、SaaS
              服务和多云环境，同时保留严格的数据本地化和监管控制。告警和行为信号在升级前会动态排序，大幅降低企业安全人员的误报疲劳，把 Tier-2/Tier-3 人工复核集中到已验证的高严重度事件上。


              运营工作流把自动化威胁摄入和人工参与治理结合起来。遥测流入平台后，Deepwatch 会将其与映射到 MITRE ATT&CK
              矩阵的已知对手战术、技术和程序（TTP）进行上下文关联。摄入管线采用预调优检测规则和针对客户环境定制的狩猎查询，消除重复人工分流，同时保留满足合规要求的详细审计日志。客户合作生命周期通过统一控制台
              Deepwatch Security Center 运行，实时显示事件状态、覆盖指标和可执行建议，让内部 CISO 透明了解托管运营，而不是面对一个封闭的黑盒服务。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
      - number: '5.2'
        title: 核心平台模块与自主代理能力
        blocks:
          - type: paragraph
            body: >-
              Deepwatch 的核心产品线围绕 Guardian MDR Platform 构建，并配有暴露面管理、漏洞运营和自主 AI 检测等专业模块。核心仍是托管检测与响应，由 Deepwatch
              检测工程师和专业网络安全分析师协作，提供全天候持续威胁监控、自动事件关联和快速事件遏制。为超越被动处理告警，Deepwatch 还纳入持续威胁暴露管理（CTEM）和攻击面管理，这些能力部分源自收购
              Dassana，可主动识别企业环境中的身份配置错误、暴露云资产和未修补攻击路径。


              2026 年初，Deepwatch 推出 NEXA Agentic AI 生态，由一组嵌入 SOC 生命周期的专业软件代理组成。此次发布的旗舰组件 NEXA Detection Advisor
              Agent，充当自主检测工程师：持续检查客户遥测流，评估全组织检测覆盖，识别 SaaS 和身份层面的遥测缺口，并在攻击发生前，依据新出现的威胁活动验证企业的威胁准备度。与自主代理配套的是 Dynamic Risk
              Scoring（DRS）引擎，这是一套实时风险计算系统，会依据业务关键性、观察到的威胁行为和新发现漏洞动态为身份与资产评分，确保关键生产基础设施在遭受主动入侵时立即得到遏制干预。
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
