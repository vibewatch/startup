  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Deepwatch 所处市场包括托管检测与响应（MDR）以及联合托管安全运营中心（SOC）服务，核心是接入遥测、持续检测威胁、引导调查并自动遏制 CM001。统计行业登记将 Deepwatch 归入 NAICS
              541511（定制计算机编程）和 NAICS 541512（计算机系统设计服务），反映其把专有分析软件与托管人工工程结合起来 CM002。该市场边界内的企业支出直接覆盖全天候威胁监控、SecOps
              工作流和持续暴露面优先级管理，但不包括硬件设备转售和基础 IT 服务台。平台运行在既有企业端点检测和 SIEM 环境之上，包括 Google SecOps、Splunk、Microsoft Sentinel 和
              CrowdStrike，刻意避开高资本投入的彻底替换部署 CM013。其专有 Dynamic Risk Scoring 引擎声称可消除最高 98%
              的低、中严重度安全告警，针对的是过载企业安全团队普遍存在的告警疲劳 CM003。主要现状替代方案包括内部 SOC 工程、只被动转发告警的传统托管安全服务商（MSSP），以及缺乏专门人工运营监督的独立 SIEM 或
              XDR 平台 CM014。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM014
          - type: table
