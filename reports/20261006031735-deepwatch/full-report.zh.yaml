      - number: '2.3'
        title: 买方画像、用户分层与预算归属
        blocks:
          - type: paragraph
            body: >-
              Deepwatch 的商业获客主要面向企业和高端中型市场组织，这些组织的网络安全运营复杂度已经超过内部人力资源。技术画像显示，Deepwatch 活跃企业账户中超过 60% 的员工数超过 1,000
              人，最大集中层级是 16 个拥有 1,000 至 4,999 名员工的企业账户 CM006。主要经济买方通常是首席信息安全官（CISO）或信息安全副总裁，他们掌握运营网络安全预算的自主支配权；日常用户则是内部
              SOC 分析师、安全工程师和事件响应人员，他们需要自动化告警关联 CM006。从行业看，采用高度集中在受监管、数据密集型领域，包括金融服务、个人银行、退休规划、财富管理和医疗保健
              CM015。对这些组织而言，Deepwatch 100% 以渠道为主的分销模式可借助可信的增值经销商简化采购，而北美监管框架进一步巩固了企业客户的国内集中度 CM007。
            claimRefs:
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM015
      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              推动 Deepwatch
              扩大市场的宏观催化因素，集中在网络犯罪工业化和不断增加的监管合规要求上。初始访问经纪人（IAB）通过窃取企业凭证、令牌和暴露的边缘资产，再放到地下市场拍卖，使早期入侵流程专业化，大幅压缩从取得初始立足点到部署勒索软件的时间
              CM008。因此，企业需要在一小时内遏制，而不是事后分流告警。与此同时，零信任架构和严格的审计制度（包括 SOX、PCI DSS 和 HIPAA）要求在复杂混合环境中集中管理安全策略，并持续确保策略有效
              CM009。反过来，供应商异构也给企业采用带来强烈摩擦：把统一安全策略翻译到多云和传统防火墙架构，可能造成服务中断和盲区
              CM010。此外，严重的私募市场不透明和相互冲突的收入披露——在没有经审计客户群披露的情况下，区间横跨 $84M 至 $120M+——仍是投资人验证持久 SOM 扩张时未解决的尽调缺口 CM011。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 中型市场企业聚焦带来运营效率
            body: >-
              技术画像显示，Deepwatch 被检测到的客户群中，超过六成拥有 1,000 名以上员工。对中型市场和核心企业的安全负责人而言，与联合托管 MDR
              服务商合作，可以在预算约束下解决不可能自建全天候内部安全运营中心的运营难题。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
          - type: callout
            title: 商业估值与收入透明度缺口
            body: >-
              第三方商业估计在 $84 million 至 $120 million 之间大幅分化，泛化统计评估则把收入放在 $100M-$500M 的宽区间。Deepwatch
              仍是私营、风险资本支持的公司，没有经审计的财务客户群报表，就无法核实独立 MDR 经常性收入。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与服务商分类
        blocks:
          - type: paragraph
            body: >
              托管检测与响应市场分成三种架构模式：纯 MDR 运营商、平台原生托管服务和持续暴露面管理平台。Deepwatch 主要是纯托管安全运营服务商，聚焦中型市场和企业客户。在这一细分市场，买方希望外包 SOC
              能力，但不想彻底替换现有遥测基础设施。直接竞争者包括 Arctic Wolf、eSentire、Red Canary 和 Expel，它们都在争夺企业安全监控和事件遏制合同。


              RFP.wiki 的目录模型从多信号遥测覆盖、调查质量和遏制权限等维度为服务商评分；它不是独立的功效基准。在该模型中，Deepwatch 在 10 家受评 MDR 服务商中排名第 8，综合得分为 3.6，59
              条评价的平均评分为 4.2。Huntress、Red Canary 和 eSentire 在同一模型中的综合得分为 4.0 至 4.1。Deepwatch 声称的差异化在于供应商中立立场和专属 Squad
              交付模式。感兴趣的竞争者 Guardare 则把互联暴露面可见性和修复优先级包装成相邻的购买路径；其比较能划出品类边界，但不能独立证明暴露面管理比 MDR 带来更好结果。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
