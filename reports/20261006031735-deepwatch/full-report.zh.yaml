  - id: FU001
    title: 企业客户采用旅程与扩张生命周期
    type: journey-map
    summary: 可视化地图详述 Deepwatch MDR 生命周期中的客户入驻、运营集成和渠道驱动扩张阶段。
    data:
      items:
        - label: 渠道发现与 GSA 采购
          stage: 渠道发现与 GSA 采购
          actor: 潜在企业 / 联邦机构 CISO
          action: >-
            Evaluates MDR through national reseller partners (e.g., GuidePoint Security) or GSA Schedule Contract
            #GS-35F-508CA
          touchpoints:
            - 渠道合作伙伴 RFP 评估
            - GSA Schedule 合同选择
            - 架构适配评审
          painPoints: High cost and staffing shortages associated with internal 24/7 Security Operations Center construction
        - label: 遥测接入与部署前范围界定
          stage: 遥测接入与部署前范围界定
          actor: 首席企业架构师和渠道销售工程师
          action: >-
            Inventories hybrid telemetry sources, SIEM connectors, and endpoint sensors to establish deployment
            boundaries
          touchpoints:
            - 遥测可行性评审
            - 连接器兼容性核验
            - 日志量规模评估
          painPoints: Fragmented event streams and inconsistent legacy logging across hybrid infrastructure
        - label: 小队入驻与上下文基线调优
          stage: 小队入驻与上下文基线调优
          actor: 客户安全运营团队与 Deepwatch 小队
          action: >-
            Integrates existing SIEM, EDR, cloud, and Microsoft 365 environments into Guardian platform without
            rip-and-replace
          touchpoints:
            - API 日志转发设置
            - 指定小队介绍
            - 上下文基线定义
          painPoints: Data quality silos, integration complexity, and internal admin tuning requirements
        - label: 持续 MDR 与自动化威胁抑制
          stage: 持续 MDR 与自动化威胁抑制
          actor: SOC 分析师和企业风险经理
          action: Operates 24/7/365 threat monitoring, leveraging NEXA AI to reduce low/medium alert volume by 98%
          touchpoints:
            - 24/7 实时事件升级
            - 威胁狩猎报告
            - 高管治理简报
          painPoints: Ensuring alert precision and avoiding false positives across business-critical workflows
        - label: 主动响应与威胁遏制
          stage: 主动响应与威胁遏制
          actor: 事件响应负责人和 Deepwatch 小队专家
          action: Executes guided response playbooks, host isolation, and collaborative containment during active compromise
          touchpoints:
            - 自动化预案执行
            - 协作式战情室桥接
            - 事件后取证复盘
          painPoints: Balancing aggressive containment speed against operational disruption of production systems
        - label: 合同续签与多模块扩张
          stage: 合同续签与多模块扩张
          actor: CISO 与采购负责人
          action: Renews recurring subscription and expands coverage to Vulnerability Management, CTEM, and cloud workloads
          touchpoints:
            - 年度合同续签
            - 多年期服务级别协议
            - 追加日志量增购
          painPoints: Lack of public visibility into cohort churn rates and private pricing tiers
    approximationNotes: 生命周期阶段基于 Deepwatch 的运营工作流、合作伙伴分销实践和案例研究材料进行概念化归纳。
    claimRefs:
      - CU002
      - CU004
      - CU006
      - CU007
      - CU008
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按剩余影响和发生可能性，对主要企业风险与运营风险进行分类的评估矩阵。
    approximationNotes: 可能性和严重程度分类属于定性判断，综合了威胁频率数据与运营依赖关系。
    claimRefs:
      - CR002
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
    data:
      columns:
        - 低严重度
        - 中严重度
        - 高严重度
      rows:
        - label: 高可能性
          values:
            - 开发者工具仿冒
            - 联邦 FedRAMP 认证延迟
            - 边缘网关零日漏洞武器化
        - label: 中高可能性
          values:
            - 利用现有工具进行攻击
            - 固件 Rootkit 持久化
            - BYOVD 内核安全规避
        - label: 中等可能性
          values:
            - 渠道经销商摩擦
            - 供应链软件包渗透
            - 身份 MFA 疲劳劫持
        - label: 中低可能性
          values:
            - SaaS 到 SaaS 横向移动
            - 过时 Shadow Framework 远程代码执行
            - 大规模勒索导致 ERP 失陷
        - label: 低可能性
          values:
            - 遥测存储容量上限
            - 多云 API 令牌撤销
            - 自动化事件修复偏移
        - label: 可忽略可能性
          values:
            - 本地边界物理入侵
            - 单租户 SIEM 静默分区
            - 公共威胁情报源全面中断
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将 Deepwatch 的运营证据、资本结构不透明度和风险指标映射至持续跟踪建议的决策流程。
    data:
      nodes:
        - id: scale-proof
          label: MDR 平台规模：已融资 $256M，已建立 SOC 小队模式和 NEXA AI 生态
        - id: financial-opacity
          label: 财务不透明：没有经核实的公开 ARR、毛利率或现金消耗披露
        - id: capital-structure
          label: 资本负担：Vista Credit 的 C 轮结构化债务带来优先受偿权风险
        - id: valuation-discipline
          label: 估值评估：未披露的投后估值阻碍有纪律的定价
        - id: entry-governance
          label: 进入治理：审计指标和契约条款必须满足严格尽调条件
        - id: final-recommendation
          label: 审慎立场：建议持续跟踪，置信度中等，风险评级高
      edges:
        - from: scale-proof
          to: financial-opacity
        - from: financial-opacity
          to: capital-structure
        - from: capital-structure
          to: valuation-discipline
        - from: valuation-discipline
          to: entry-governance
        - from: entry-governance
          to: final-recommendation
    approximationNotes: 流程图展示了推导投资立场的分析顺序。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV009
      - CV010
