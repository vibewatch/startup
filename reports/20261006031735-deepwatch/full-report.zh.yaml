            body: >-
              第三方收入数字与一家已具规模的私营公司大致一致，但不足以用于投资判断。ReviewBolt 估算 $114M，GetLatka 报告 2023 年预计年收入 $111M，Levels.fyi 显示
              $100M-$250M 的估算，Datanyze 列出 $84M，IncFact 则把年收入放在更宽的 $100M-$500M 统计区间。这些数字采用不同期间、标签和大多未披露的方法。它们是收入估计而非经验证的
              ARR，任何一组都不能证明增长、收入结构、客户集中度、续约质量或会计确认。站得住脚的结论是财务不透明，而不是精确的 run rate。
