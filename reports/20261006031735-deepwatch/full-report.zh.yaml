              尽管 NEXA 自主 AI 生态宣传声势很大，Deepwatch 的竞争价值主张和高严重度响应仍高度依赖指定的人工分析师、检测工程师和上线专家。交付人员流失或运营能力下降，会直接威胁服务质量、SLA
              履约和客户续约率。
