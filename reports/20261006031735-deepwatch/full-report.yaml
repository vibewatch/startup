  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Security Workflow
        blocks:
          - type: paragraph
            body: >-
              Deepwatch operates in customer enterprise environments as a hybrid Managed Detection and Response (MDR)
              platform that integrates directly into existing security stacks without requiring proprietary agent
              deployment or infrastructure replacement. Rather than forcing clients to migrate data out of their primary
              cloud data lakes or SIEMs, the Deepwatch Guardian MDR Platform connects into cloud-native security
              information and event management tools—such as Microsoft Sentinel and Splunk—ingesting telemetry,
              normalizing disparate event logs, and enriching signals directly within the customer cloud boundary. This
              architecture enables enterprise security operations teams to establish continuous visibility across
              endpoints, identity providers, SaaS services, and multi-cloud environments while retaining strict data
              locality and regulatory control. Alerts and behavioral signals undergo dynamic prioritization before
              escalation, substantially reducing false positive fatigue for enterprise security staff and focusing
              Tier-2/Tier-3 human review exclusively on validated high-severity incidents.


              Operational workflows combine automated threat ingestion with human-in-the-loop governance. When telemetry
              flows into the platform, Deepwatch applies contextual correlation against known adversary tactics,
              techniques, and procedures (TTPs) mapped to the MITRE ATT&CK matrix. The ingestion pipeline applies
              pre-tuned detection rules and customized hunting queries tailored to the customer environment, eliminating
              repetitive manual triage while preserving detailed audit logs for compliance requirements. The customer
              engagement lifecycle operates through a unified console—the Deepwatch Security Center—which displays
              incident status, coverage metrics, and actionable recommendations in real time, granting internal CISOs
              transparent operational insight into managed operations rather than a closed black-box service model.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
      - number: '5.2'
        title: Core Platform Modules and Autonomous Agent Capabilities
        blocks:
          - type: paragraph
            body: >-
              The core Deepwatch product line is structured around the Guardian MDR Platform, complemented by
              specialized modules for exposure management, vulnerability operations, and autonomous AI-driven detection.
              The central pillar remains Managed Detection and Response, providing 24/7/365 continuous threat
              monitoring, automated event correlation, and rapid incident containment delivered collaboratively by
              Deepwatch detection engineers and specialized cyber analysts. To extend beyond reactive alert handling,
              Deepwatch incorporates Continuous Threat Exposure Management (CTEM) and Attack Surface Management, derived
              in part from its acquisition of Dassana, providing proactive identification of identity misconfigurations,
              exposed cloud assets, and unpatched attack vectors across enterprise environments.


              In early 2026, Deepwatch introduced the NEXA Agentic AI ecosystem, an autonomous network of specialized
              software agents embedded across the security operations center (SOC) lifecycle. The flagship component of
              this rollout, the NEXA Detection Advisor Agent, functions as an autonomous detection engineer that
              continuously inspects customer telemetry streams, evaluates organization-wide detection coverage,
              identifies telemetry gaps across SaaS and identity surfaces, and validates enterprise threat readiness
              against emerging threat campaigns before attacks manifest. Complementing the autonomous agents is the
              Dynamic Risk Scoring (DRS) engine, a real-time risk calculation system that dynamically scores identities
              and assets based on business criticality, observed threat actor behaviors, and newly discovered
              vulnerabilities, ensuring that critical production infrastructure receives immediate containment
              intervention during active breach attempts.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
