              - CR012
      - number: '7.2'
        title: Operational, Telemetry, and Detection Failure Modes
        blocks:
          - type: paragraph
            body: >-
              Operational efficacy in managed security services depends on maintaining high-fidelity threat detection
              across volatile customer environments without overwhelming human analysis teams. Threat actors
              increasingly deploy evasive tradecraft including Bring Your Own Vulnerable Driver techniques that
              terminate endpoint detection processes at the kernel level, pastejacking social engineering tactics, and
              trojanized developer dependencies. In response to alert volumes that challenge traditional Security
              Operations Centers, Deepwatch deployed its NEXA AI architecture to automate alert triage and correlation,
              reporting a 98% reduction in low and medium severity alerts alongside a tenfold improvement in threat
              detection metrics. However, excessive reliance on automated correlation introduces operational risk if
              novel evasion techniques bypass algorithmic heuristics. Continuous validation through human-in-the-loop
              analyst squads and preemptive vulnerability enrichment remains vital to maintain operational containment
              standards.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR009
