          - type: paragraph
            body: >
              Architectural structure rather than surface-level feature checklists can determine long-term vendor fit
              and switching friction in managed security services. Deepwatch says it operates across existing enterprise
              SIEM and EDR deployments. UnderDefense, an interested competitor, characterizes Deepwatch as
              Splunk-anchored and Arctic Wolf as normalizing customer telemetry into a proprietary cloud-native
              platform. Those ownership and access assertions were not independently established by the assigned
              evidence, so buyers should verify deployment ownership, raw-data access, detection-rule rights, and export
              formats directly in product documentation and contracts.


              Commercial structures may reflect those architectural choices, but no standard Deepwatch or Arctic Wolf
              price sheet appears in the assigned sources. UnderDefense cites buyer-reported Arctic Wolf pricing near a
              $96,340 annual median, spanning roughly $29,000 to $320,000, and describes a per-user model with unlimited
              ingestion. The same competitor says Deepwatch economics rise with Splunk ingestion and that rule
              portability depends on instance ownership. These are diligence hypotheses, not verified realized prices or
              contract terms. Matched-scope quotes and redlined agreements are necessary to test telemetry assumptions,
              add-ons, discounting, response authority, egress costs, and transition support.
            claimRefs:
