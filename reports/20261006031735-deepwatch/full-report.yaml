  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Landscape
        blocks:
          - type: paragraph
            body: >-
              Enterprise Managed Detection and Response operations require rigorous adherence to cross-jurisdictional
              privacy statutes, breach disclosure mandates, and government-grade security attestations. Deepwatch's
              platform ingests telemetry across more than 800 supported security sources, exposing operations to
              stringent compliance scrutiny under GDPR, CCPA, and emerging federal cyber reporting requirements. While
              the company maintains active security advisory monitoring across critical enterprise infrastructure,
              formal government authorization milestones such as FedRAMP listings remain unverified in public
              registries, constraining federal procurement velocity. Legal exposures are amplified by rapid
              vulnerability weaponization cycles affecting enterprise edge appliances and enterprise resource planning
              systems, where failure to detect active zero-day exploitation could trigger contractual liability or
              customer disputes. Mitigating these risks requires transparent governance models, strict service level
              agreements, and expert-validated response workflows.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
