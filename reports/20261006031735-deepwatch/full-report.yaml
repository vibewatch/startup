      - number: '6.3'
        title: Retention Durability, Channel Expansion, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Deepwatch operates a 100% channel-driven go-to-market motion, relying heavily on national cybersecurity
              solution providers such as GuidePoint Security to drive customer acquisition and federal contract access
              (CU006, CU014). This partner-led distribution model provides scalable market access but introduces
              intermediary dependency and potential procurement friction if partner priorities diverge (CU006, CU014).
              While private equity backer Springcoast Capital Partners emphasizes high customer stickiness and
              operational return on investment, audited retention benchmarks—such as Net Retention Rate (NRR), Gross
              Retention Rate (GRR), and annual logo churn—are strictly confidential private data (CU002, CU015).
              Furthermore, customer reviews and service analyses highlight that deploying advanced MDR and context-aware
              threat analytics demands skilled internal security administrators for alert tuning, model configuration,
              and policy management, creating onboarding complexity and organizational strain that can hinder post-sales
              adoption and renewal velocity (CU016).
