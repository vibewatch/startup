  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary for Deepwatch encompasses Managed Detection and Response (MDR) and co-managed Security
              Operations Center (SOC) services, specifically integrating telemetry ingestion, continuous threat
              detection, guided investigation, and automated containment CM001. Deepwatch is categorized under NAICS
              541511 (Custom Computer Programming) and NAICS 541512 (Computer Systems Design Services) in statistical
              industry registries, reflecting its blend of proprietary analytics software and managed human engineering
              CM002. Enterprise spend within this boundary directly covers 24/7 threat monitoring, SecOps workflows, and
              continuous exposure prioritization, while excluding hardware appliance resale and basic IT helpdesk
              operations. The platform operates on top of existing enterprise endpoint detection and SIEM environments,
              including Google SecOps, Splunk, Microsoft Sentinel, and CrowdStrike, deliberately avoiding
              capital-intensive rip-and-replace deployments CM013. Its proprietary Dynamic Risk Scoring engine claims to
              eliminate up to 98 percent of low- and medium-severity security alerts, addressing the alert fatigue that
              plagues overburdened enterprise security teams CM003. Primary status-quo substitutes include in-house SOC
              engineering, legacy managed security service providers (MSSPs) providing passive alert forwarding, and
              standalone SIEM or XDR platforms that lack dedicated human operational oversight CM014.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM014
