      - number: '3.3'
        title: Switching Costs, Moat Durability, and Diligence Considerations
        blocks:
          - type: paragraph
            body: >
              Evaluating moat durability in MDR requires balancing service-retention advantages against possible
              switching obstacles. Deepwatch says its named Squad model acts as an extension of internal security teams
              and reports support across more than 800 telemetry sources. Those company-issued statements suggest
              operational embedding but do not establish retention or prove that a departing customer must rebuild
              pipelines or rules. Exit friction will depend on each customer's architecture and contract: who owns the
              SIEM, normalized data, detection content, case history, and automation, and whether those assets can be
              exported in usable formats.


              RFP.wiki reports recurring concerns about alert-volume spikes, dashboard visibility, volume-based pricing,
              US-only 24/7 coverage, and leadership or staffing changes. That directory synthesis is useful adverse
              evidence but is not a substitute for direct customer cohorts, service-level records, or renewal data.
              Deepwatch's own automated-threat-prevention explainer also acknowledges that automation requires
              calibrated thresholds, observability, rollback, and governance to avoid business disruption. Deepwatch
              therefore still must demonstrate that NEXA and its human-governed squad model improve verified outcomes
              and total cost of ownership against fixed-fee, platform-native, adjacent exposure-management, and
              internal-build alternatives.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
