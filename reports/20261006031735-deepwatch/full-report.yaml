        title: TAM, SAM, and Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing Deepwatch's addressable market requires decomposing broad cybersecurity spending into verifiable
              serviceable layers rather than relying on an unconstrained top-line estimate. Industry research by Gartner
              positions AI Security in enterprise communication services as delivering high potential benefit while
              advancing into early mainstream adoption CM004. However, independent commercial database profiling reveals
              wide divergence in Deepwatch's realized scale: IncFact models the firm within a broad $100M to $500M
              annual revenue bracket based on statistical P&L industry averages CM002, CM011, while private database
              records from Datanyze and Prospeo cite point revenue estimates of $84 million to $120 million alongside
              $256 million in lifetime venture financing CM011, CM012. In terms of market penetration, technographic
              intelligence from 6sense measures Deepwatch's footprint at a 0.05 percent market share within the broad
              cyber security category, tracking 66 verified customer deployments CM005. The overwhelming majority (87.7
              percent) of these detected customers are concentrated in the United States, defining North American
              enterprise defense as Deepwatch's effective geographic serviceable available market CM007. The fundamental
              TAM boundary remains bounded by enterprise willingness to delegate operational containment authority to an
              external managed partner CM014.
