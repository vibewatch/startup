  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Provider Classification
        blocks:
          - type: paragraph
            body: >
              The managed detection and response market divides into three distinct architectural models: pure-play MDR
              operators, platform-native managed offerings, and continuous exposure management platforms. Deepwatch
              operates primarily as a pure-play managed security operations vendor focused on mid-market and enterprise
              estates. In this segment, buyers seek outsourced security operations center (SOC) capabilities without
              ripping and replacing their existing telemetry infrastructure. Direct competitors include Arctic Wolf,
              eSentire, Red Canary, and Expel, each competing for enterprise security monitoring and incident
              containment contracts.


              RFP.wiki's directory model scores providers across multi-signal telemetry coverage, investigation quality,
              and containment authority; it is not an independent efficacy benchmark. In that model, Deepwatch ranks #8
              among 10 evaluated MDR providers with a composite score of 3.6 and an average review rating of 4.2 across
              59 reviews. Huntress, Red Canary, and eSentire receive composite scores of 4.0 to 4.1 in the same model.
              Deepwatch's stated differentiation lies in its vendor-agnostic posture and dedicated squad delivery model.
              Guardare, an interested competitor, instead frames connected exposure visibility and remediation
              prioritization as an adjacent buying approach; its comparison identifies a category boundary but does not
              independently prove that exposure management produces better outcomes than MDR.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
