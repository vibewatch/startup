company:
  name: "Deepwatch"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Deepwatch is a private managed detection and response provider with a current AI-and-expert operating model, but its public corporate record is unusually inconsistent: assigned sources disagree on headquarters, cumulative funding, revenue, and headcount, while valuation, debt terms, founders, board composition, and current CEO identity remain unsupported."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Deepwatch presents itself as an AI-native managed detection and response provider that
      combines threat intelligence, automated operations, and expert oversight. Its stated
      delivery model works with a customer's existing SIEM, EDR, cloud, identity, and SaaS
      tools rather than requiring a wholesale replacement. Two independent company profiles
      place founding in 2019, which is the most supportable founding year in the assigned
      evidence. Headquarters are not similarly settled: Prospeo lists Palo Alto, while the
      archived Datanyze profile names Denver in one place and a Tampa address in another.
      Corporate registry evidence is therefore required before treating any location as the
      legal headquarters.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "capital-and-scale"
    title: "Capitalization, Stage, and Scale"
    body: >-
      The available evidence supports a growth-stage private-company characterization, but
      not a precise valuation or liquidity conclusion. Datanyze reports $256 million raised
      over three rounds, whereas a company-authored profile syndicated by Gritt states more
      than $275 million in growth capital. Those figures may use different definitions and
      must not be combined into cash available. Public scale indicators are also modeled
      rather than audited: Datanyze reports 400 employees and $84 million of revenue,
      Levels.fyi reports 300 employees and estimated revenue of $100 million to $250 million,
      and IncFact publishes a $100 million to $500 million statistical range. A 6sense
      technographic count of more than 65 organizations is not an official customer count.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Visibility"
    body: >-
      Leadership visibility is insufficient for investment-grade governance assessment.
      Datanyze provides a functional executive roster spanning technology, revenue, finance,
      people, security, and legal roles, but the assigned official leadership-page text
      contains no individual names or board information. That mismatch makes current tenure
      impossible to verify and leaves founder identity, CEO authority, board composition,
      investor representation, succession planning, and equity concentration open. The
      functional breadth is directionally useful, yet it does not establish decision rights
      or reduce key-person risk. Management interviews, a current organization chart, and
      board minutes are needed before attributing governance quality to the listed executives.
    claimRefs:
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "milestones-and-diligence-implications"
    title: "Milestones and Diligence Implications"
    body: >-
      The defensible public chronology is narrower than the company's maturity narrative.
      It begins with 2019 founding, includes trademark records dated November 2020 and
      October 2023, and includes third-party profile claims of annual workplace or industry
      recognition from 2020 through 2025. These dates demonstrate continuity of branding
      and external recognition, but they do not establish revenue expansion, product
      adoption, regulatory clearance, or financing close dates. IncFact's observation that
      it found no recent trademark applications is a weak and indirect adverse signal, not
      proof of product stagnation. A complete milestone record must be reconstructed from
      executed financing documents, dated product release materials, customer evidence, and
      legal or regulatory records.
    claimRefs:
      - "CO002"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
