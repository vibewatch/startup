    - type: "conflicting-data"
      severity: "material"
      topic: "scale"
      missingEvidence: "Dated audited revenue, ARR, customer definition and count, payroll headcount, growth, margins, churn, and net retention."
      whyItMatters: "The public estimates use undisclosed methods and incompatible ranges, preventing a reliable scale or efficiency assessment."
      diligencePath: "Reconcile audited financial statements, monthly recurring-revenue schedules, CRM account counts, and payroll records to a common period."
      relatedTableRefs:
        - "TO001"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "investors"
      missingEvidence: "Complete investor list, round-by-round allocation, security type, ownership, board rights, and liquidation preferences."
      whyItMatters: "A named-backer list does not establish control, economic seniority, or the denominator behind reported growth capital."
      diligencePath: "Obtain the fully diluted capitalization table, stock purchase documents, debt documents, side letters, and board consents."
