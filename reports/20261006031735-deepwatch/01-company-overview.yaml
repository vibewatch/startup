      relatedTableRefs:
        - "TO002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "valuation-and-debt"
      missingEvidence: "Current valuation, security-level round amounts, debt principal, interest rate, maturity, covenants, liquidation preferences, and cash balance."
      whyItMatters: "Capital raised cannot be converted into valuation, cash availability, runway, or downside seniority without instrument-level terms."
      diligencePath: "Review executed financing agreements, debt schedules, capitalization records, bank statements, and the latest board-approved cash forecast."
      relatedQuestionRefs:
        - "QO006"
      relatedTableRefs:
        - "TO001"
