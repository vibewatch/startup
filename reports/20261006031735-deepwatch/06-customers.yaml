callouts:
  - calloutType: "insight"
    title: "Channel-Centric Distribution Shields Direct Sales Overhead but Introduces Partner Governance Risks"
    body: "Deepwatch's 100% channel-driven distribution strategy, exemplified by its core federal partnership with GuidePoint Security under GSA Contract #GS-35F-508CA, eliminates substantial direct enterprise sales overhead while accelerating access to regulated public sector accounts. However, this structure leaves Deepwatch reliant on partner alignment and third-party reseller sales teams to drive recurring expansion and sustain renewal velocity."
    claimRefs:
      - "CU006"
      - "CU014"
  - calloutType: "risk"
    title: "Absence of Audited Net Retention and Customer Concentration Benchmarks Obscures Expansion Health"
    body: "Despite marketing assertions of strong customer stickiness and 432% operational return on investment, Deepwatch discloses neither gross retention rates nor top-customer revenue concentration. Furthermore, implementing context-aware analytics and advanced MDR workflows continues to impose significant telemetry tuning and administrative burdens on customer security teams, representing a potential friction point for long-term account durability."
    claimRefs:
      - "CU002"
      - "CU007"
      - "CU015"
      - "CU016"
