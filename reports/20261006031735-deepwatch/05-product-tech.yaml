  - calloutType: insight
    title: In-Tenancy SIEM Architecture Eliminates Data Duplication Overhead
    body: Deepwatch's native Microsoft Sentinel and cloud SIEM deployment model avoids copying or warehousing raw customer logs into a secondary proprietary repository. By executing analytics and hunting queries directly in the customer Azure boundary, Deepwatch removes significant data egress charges and alleviates data sovereignty objections during enterprise security review.
    claimRefs:
      - CE001
      - CE002
      - CE006
  - calloutType: risk
    title: Core Service Delivery Remains Anchored to Human Specialist Squads
    body: Despite heavy branding around the NEXA autonomous AI ecosystem, Deepwatch's competitive value proposition and high-severity response rely heavily on named human analysts, detection engineers, and onboarding specialists. Any attrition or operational degradation among delivery personnel directly threatens service quality, SLA adherence, and customer renewal rates.
    claimRefs:
      - CE002
      - CE005
      - CE009
      - CE010
