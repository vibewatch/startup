  - id: TE002
    title: Enterprise Security Workflow and Incident Lifecycle
    columns:
      - User Job
      - Current Enterprise Workflow
      - Deepwatch Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Telemetry Ingestion & Log Normalization
        - Multi-tool ingestion pipelines with high egress costs and duplicate storage pools
        - Direct Azure Sentinel and cloud SIEM connectors without external log duplication
        - Maintains data within customer cloud boundary; zero secondary storage egress fees
        - Telemetry completeness depends entirely on customer log source configuration
      - - Alert Triage & Noise Reduction
        - Manual tier-1 alert analysis resulting in severe alert fatigue and missed low-severity signals
        - NEXA AI agent triage and automated contextual correlation across identity and cloud telemetry
        - Up to 98% reduction in low and medium severity alert volume requiring analyst review
        - Automated suppression rules risk false negatives if threat behaviors mimic administrative activity
      - - Threat Detection & MITRE ATT&CK Mapping
        - Generic out-of-the-box static detection rules requiring constant internal engineering
        - Custom KQL and SIEM analytic rules tuned by Deepwatch detection engineers
        - Continuous rule optimization aligned to emerging adversary TTPs and zero-day campaigns
        - Rule tuning requires ongoing collaboration and environment context from customer admins
      - - Incident Containment & Active Response
        - Fragmented manual host isolation and credential revocation across disparate consoles
        - Automated and expert-assisted active response playbooks executed via orchestration APIs
        - Rapid containment across endpoints, network perimeters, and identity access layers
        - Active response actions restricted by customer-granted IAM service principal permissions
    notes: Workflow comparison derived from Deepwatch CISO Buyer Guide, Sentinel Solution Brief, and technical whitepapers.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
  - id: TE003
    title: Technology Stack and Architecture Operating Model
    columns:
      - Architecture Layer
      - Underlying Technology / Component
      - Operational Role
      - Technical Dependency / External Partner
      - Architectural Risk / Diligence Ask
    rows:
      - - Cloud SIEM & Data Tier
        - Microsoft Sentinel / Azure Data Lake, Splunk
        - Primary log repository, query execution engine, and analytics data layer
        - Customer cloud tenancy (Microsoft Azure / Splunk Cloud)
        - Platform completely reliant on cloud provider uptime and query API rate limits
      - - Agentic AI & Triage Engine
        - NEXA AI Ecosystem / Specialized Autonomous Agents
        - Automated alert enrichment, investigation explanation, and telemetry gap detection
        - Proprietary LLM orchestration and vector embeddings pipeline
        - Model training provenance, data privacy leakage risks, and autonomous execution safety
      - - Security Orchestration (SOAR)
        - Enterprise SOAR Integration (Torq Integration)
        - Autonomous playbook execution, security infrastructure connectivity, and workflow automation
        - Third-party hyperautomation partner (Torq Case Study)
        - Critical operational dependency on third-party orchestration engine stability and API latency
      - - Human Expert SOC Tier
        - Dedicated Squads (Analysts, Hunters, Detection Engineers)
        - 24/7/365 threat monitoring, deep-dive forensic hunting, and response governance
        - Internal specialized engineering and operations workforce
        - Operational capacity vulnerable to workforce turnover, wage inflation, and analyst burnout
    notes: Architectural decomposition based on Deepwatch technical documentation, Sentinel brief, and Torq case study.
