  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Diligence Shift Trigger
    rows:
      - - Market & Platform
        - Demand for 24/7/365 managed cyber resilience and NEXA AI threat reduction
        - MDR market faces aggressive competition from SIEM vendors and MSSP peers
        - Independent proof of sustained win-rates against platform competitors
      - - Financial Transparency
        - Long operating history with $256M capital raised across three funding rounds
        - Zero audited public disclosure of ARR, recurring margins, or GAAP losses
        - Provision of verified audited financial statements and ARR cohort data
      - - Capital Structure
        - Backing by reputable institutional growth investors including Splunk Ventures
        - Structured credit tranche from Vista Credit may impose severe debt seniority
        - Disclosure of full cap table waterfall and credit covenant compliance terms
      - - Operational Footprint
        - Substantial workforce scale supporting enterprise SOC-as-a-service squad delivery
        - Absence of recent trademark filings indicating possible market expansion stalls
        - Verification of net headcount stability and engineering productivity metrics
    notes: Synthesis of core investment merits against structural balance sheet and governance uncertainties.
