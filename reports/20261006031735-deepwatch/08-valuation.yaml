  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Valuation / Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - ARR expands to $120M+ powered by NEXA AI automation and channel leverage
        - $360M-$480M EV (3.0x-4.0x ARR multiple on software-assisted delivery)
        - Execution delays in AI monetization; gross margin erosion
        - 20% (low visibility into actual current growth run-rate)
      - - Base Case
        - Revenue stable around $85M-$100M; modest low-double-digit growth
        - $200M-$260M EV (2.0x-2.6x ARR multiple on hybrid tech/services mix)
        - Debt service obligations strain free cash flow; margin compression
        - 55% (consistent with third-party modeled revenue benchmarks)
      - - Bear Case
        - Customer attrition post-restructuring; ARR contracts below $70M
        - <$150M EV; potential restructuring or credit covenant breach
        - Vista Credit senior foreclosure or highly dilutive recapitalization
        - 25% (heightened by opaque burn rate and leadership churn)
    notes: Scenario valuations reflect illustrative ARR multiple ranges benchmarked against hybrid cybersecurity service providers.
