callouts:
  - calloutType: recommendation
    title: 'Recommendation Justification: Track'
    body: Deepwatch maintains a reputable product footprint in managed detection and response, supported by $256M in aggregate funding. However, the complete absence of verified ARR disclosures, unknown private valuation marks, and the presence of senior structured credit from Vista Credit create asymmetric downside risks for prospective equity investors. We recommend maintaining a track posture until audited financial performance and debt covenant terms are disclosed.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
  - calloutType: risk
    title: 'Capital Structure Overhang: Series C Debt Tranche'
    body: The Series C financing completed in February 2023 included Vista Credit Partners as a co-lead alongside equity sponsors. The undisclosed terms of this structured debt tranche—including coupon rates, maturity schedules, and financial covenants—create potential liquidation preference overhang and refinance risk senior to common shareholders.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV012
