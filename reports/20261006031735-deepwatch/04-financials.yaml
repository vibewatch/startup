slug: "deepwatch"
runDate: "2026-10-06"
company:
  name: "Deepwatch"
chapter:
  number: 4
  title: "Financials"
  summary: "Deepwatch's public evidence supports a people-and-platform managed security model, but it does not disclose pricing, recognized revenue, ARR, gross margin, cash, burn, or runway. Independent revenue estimates range from $84M to a broad $100M-$500M band and cannot be treated as verified financial results, while conflicting cumulative-capital figures reinforce the need for primary financial diligence."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing Boundaries"
    body: "Deepwatch markets an AI-assisted managed security service that works with a customer's existing security stack and combines automated operations with continuous expert oversight. That evidence supports a people-and-platform delivery model, not a specific billing model: the assigned sources disclose neither list prices nor realized contract values, billing units, discount schedules, contract duration, or revenue-recognition policy. The commercial thesis therefore depends on converting broad integrations and round-the-clock service into durable customer contracts, but public evidence cannot establish whether revenue is recurring, usage-based, retainer-based, or mixed. Any ARR, ACV, backlog, or deferred-revenue conclusion would be premature without management records."
    claimRefs:
      - "CI001"
      - "CI002"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "public-traction-and-estimate-conflicts"
    title: "Public Traction Is Estimated, Not Verified"
    body: "Third-party revenue figures are directionally consistent with a scaled private company but are not sufficiently comparable for underwriting. ReviewBolt estimates $114M, GetLatka reports an estimated $111M of annual revenue for 2023, Levels.fyi displays a $100M-$250M estimate, Datanyze lists $84M, and IncFact places annual revenue in a much wider $100M-$500M statistical band. These figures use different periods, labels, and largely undisclosed methods. They are revenue estimates rather than verified ARR, and none establishes growth, revenue mix, customer concentration, renewal quality, or accounting recognition. The defensible conclusion is financial opacity, not a precise run rate."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
  - id: "gtm-and-cost-structure"
    title: "GTM and Cost Structure Proxies"
    body: "Public evidence offers only weak proxies for sales efficiency. Dataford describes a three-round, roughly three-to-five-week Account Executive hiring process and estimates $165K-$180K compensation from six self-reported salary observations; neither measure is a customer sales cycle, quota-attainment record, or CAC estimate. On delivery economics, Deepwatch's own positioning and a company-profile reproduction emphasize 24/7/365 expert coverage and named teams. That model indicates human service capacity remains economically relevant alongside automation, but public sources do not quantify analyst utilization, cloud and telemetry costs, partner economics, support burden, gross margin, CAC, payback, or net retention."
    claimRefs:
      - "CI002"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "Capital raised cannot be equated with cash available. Datanyze reports $256M across three rounds, while a Gritt profile written in the company's promotional voice claims more than $275M of growth capital. The discrepancy may reflect scope, timing, or financing classification, but the assigned evidence does not resolve it. Staffing proxies are similarly inconsistent: ReviewBolt lists 439 employees and negative five percent growth, GetLatka reports approximately 412 people, and Datanyze lists 400. Without a current balance sheet, cash flow statement, debt schedule, burn, runway, working-capital profile, or capex plan, Deepwatch's capital adequacy and financing dependency remain ununderwriteable."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
