      severity: "material"
      topic: "pricing-and-contracts"
      missingEvidence: "Current rate cards, executed contracts, billing units, realized prices, discounts, renewal terms, and revenue-recognition policy."
      whyItMatters: "Without contract economics, revenue quality, expansion behavior, and the relationship between bookings, ARR, recognized revenue, and cash cannot be modeled."
      diligencePath: "Request the SKU catalog, anonymized contracts and invoices, bookings waterfall, deferred-revenue rollforward, and revenue-recognition memo."
      relatedQuestionRefs:
        - "QI002"
      relatedTableRefs:
        - "TI001"
        - "TI002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: "Gross margin, labor utilization, infrastructure cost, support burden, CAC, payback, retention, customer concentration, working capital, and capex."
      whyItMatters: "The managed-service model includes continuous expert delivery, so topline estimates alone cannot establish operating leverage or cash conversion."
      diligencePath: "Obtain audited financials and monthly contribution-margin, retention, sales-efficiency, working-capital, and capex schedules by offering."
      relatedQuestionRefs:
        - "QI006"
      relatedTableRefs:
        - "TI003"
    - type: "conflicting-data"
      severity: "material"
      topic: "capital-raised"
      missingEvidence: "A primary-source reconciliation of the $256M and greater-than-$275M cumulative-capital figures by date and instrument."
      whyItMatters: "Different scopes may combine equity, structured credit, or other growth capital, and funding raised does not establish liquidity."
      diligencePath: "Reconcile the cap table, financing agreements, proceeds received, repayments, and current debt schedule with management."
      relatedQuestionRefs:
        - "QI007"
      relatedTableRefs:
        - "TI003"
    - type: "private-evidence-only"
      severity: "blocking"
      topic: "capital-adequacy"
      missingEvidence: "Current cash, monthly cash burn, runway, debt and credit terms, covenant compliance, planned use of funds, and next-round triggers."
      whyItMatters: "Capital adequacy and financing dependency cannot be judged from cumulative funding announcements or staffing estimates."
      diligencePath: "Require a current balance sheet, cash-flow statement, debt schedule, covenant certificates, board-approved budget, and 24-month financing plan."
      relatedQuestionRefs:
        - "QI009"
      relatedTableRefs:
        - "TI003"
