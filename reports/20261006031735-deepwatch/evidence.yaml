evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: >-
      Verified founder identities, current CEO, complete executive roster, board membership, tenure, ownership, and
      succession responsibilities.
    whyItMatters: Governance quality and key-person dependence cannot be assessed from an undated third-party role directory.
    diligencePath: >-
      Obtain a current organization chart, executive biographies, capitalization table, board minutes, and officer
      certificates from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-and-debt
    missingEvidence: >-
      Current valuation, security-level round amounts, debt principal, interest rate, maturity, covenants, liquidation
      preferences, and cash balance.
    whyItMatters: >-
      Capital raised cannot be converted into valuation, cash availability, runway, or downside seniority without
      instrument-level terms.
    diligencePath: >-
      Review executed financing agreements, debt schedules, capitalization records, bank statements, and the latest
      board-approved cash forecast.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      Dated audited revenue, ARR, customer definition and count, payroll headcount, growth, margins, churn, and net
      retention.
    whyItMatters: >-
      The public estimates use undisclosed methods and incompatible ranges, preventing a reliable scale or efficiency
      assessment.
    diligencePath: >-
      Reconcile audited financial statements, monthly recurring-revenue schedules, CRM account counts, and payroll
      records to a common period.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Complete investor list, round-by-round allocation, security type, ownership, board rights, and liquidation
      preferences.
    whyItMatters: >-
      A named-backer list does not establish control, economic seniority, or the denominator behind reported growth
      capital.
    diligencePath: >-
      Obtain the fully diluted capitalization table, stock purchase documents, debt documents, side letters, and board
      consents.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Dated financing closes, product launches, customer-scale milestones, partnerships, regulatory events, and adverse
      incidents.
    whyItMatters: >-
      The retained chronology demonstrates continuity but cannot substantiate the full operating and financing
      evolution.
    diligencePath: >-
      Reconstruct the timeline from executed deal documents, release archives, customer contracts, regulatory records,
      and incident logs.
  - type: conflicting-data
    severity: material
    topic: commercial-scale-and-market-sizing
    missingEvidence: >-
      Independent audited enterprise customer count and segmented ARR across mid-market versus large enterprise
      accounts.
    whyItMatters: >-
      Commercial scale estimates vary widely between third-party database models ($84M to $120M+ revenue; 66 to 400+
      customers), making SOM penetration impossible to verify with high confidence.
    diligencePath: >-
      Request audited revenue by cohort, customer account count, and average contract value (ACV) under management
      diligence.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Matched-scope prices, funding and scale evidence, realized enterprise discounts, service inclusions, data egress
      rights, and detection-rule ownership for Deepwatch and direct peers.
    whyItMatters: >-
      Custom quotes and broad third-party estimates prevent precise total-cost, financial staying-power, and
      switching-friction comparisons.
    diligencePath: >-
      Obtain comparable RFP bids, funding documents, customer references, and redlined contract terms across equivalent
      user, telemetry, and response scopes.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: churn-and-displacement
    missingEvidence: >-
      Documented customer win-loss and displacement metrics between Deepwatch and Arctic Wolf following 2025–2026
      workforce adjustments.
    whyItMatters: >-
      Direct customer migration rates would verify whether alert fatigue and pricing friction are causing measurable
      account attrition.
    diligencePath: >-
      Conduct expert network interviews with recently churned enterprise accounts and channel partners distributing both
      Deepwatch and Arctic Wolf.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      Current rate cards, executed contracts, billing units, realized prices, discounts, renewal terms, and
      revenue-recognition policy.
    whyItMatters: >-
      Without contract economics, revenue quality, expansion behavior, and the relationship between bookings, ARR,
      recognized revenue, and cash cannot be modeled.
    diligencePath: >-
      Request the SKU catalog, anonymized contracts and invoices, bookings waterfall, deferred-revenue rollforward, and
      revenue-recognition memo.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, labor utilization, infrastructure cost, support burden, CAC, payback, retention, customer
      concentration, working capital, and capex.
    whyItMatters: >-
      The managed-service model includes continuous expert delivery, so topline estimates alone cannot establish
      operating leverage or cash conversion.
    diligencePath: >-
      Obtain audited financials and monthly contribution-margin, retention, sales-efficiency, working-capital, and capex
      schedules by offering.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A primary-source reconciliation of the $256M and greater-than-$275M cumulative-capital figures by date and
      instrument.
    whyItMatters: >-
      Different scopes may combine equity, structured credit, or other growth capital, and funding raised does not
      establish liquidity.
    diligencePath: >-
      Reconcile the cap table, financing agreements, proceeds received, repayments, and current debt schedule with
      management.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly cash burn, runway, debt and credit terms, covenant compliance, planned use of funds, and
      next-round triggers.
    whyItMatters: >-
      Capital adequacy and financing dependency cannot be judged from cumulative funding announcements or staffing
      estimates.
    diligencePath: >-
      Require a current balance sheet, cash-flow statement, debt schedule, covenant certificates, board-approved budget,
      and 24-month financing plan.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: ai-model-governance
    missingEvidence: >-
      Audited architectural documentation detailing LLM model selection, training data provenance, latency SLAs, and
      hallucination guardrails for the NEXA agentic ecosystem.
    whyItMatters: >-
      Without independent model audits or benchmark metrics, the reliability of autonomous alert triage and the risk of
      automated false-negative suppression cannot be quantified.
    diligencePath: >-
      Request AI model architecture whitepaper, SOC 2 Type II trust criteria covering AI systems, and benchmark test
      results against standard threat corpuses under NDA.
    relatedQuestionRefs:
      - QE003
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: >-
      Public developer documentation, software development kits (SDKs), or open-source community repositories for
      Deepwatch API integration.
    whyItMatters: >-
      Restricts independent validation of platform extensibility and confirms Deepwatch operates primarily as a
      proprietary managed service rather than a developer-extensible platform.
    diligencePath: >-
      Review customer API documentation, developer portal access, and custom connector SDK specifications in the virtual
      data room.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention and churn metrics
    missingEvidence: Audited quantitative Net Retention Rate (NRR), Gross Retention Rate (GRR), and annual customer logo churn data.
    whyItMatters: >-
      Without audited retention and churn figures, long-term customer lifetime value and product durability cannot be
      verified.
    diligencePath: Request confidential historical cohort retention tables and renewal rate schedules under NDA.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration and channel dependence
    missingEvidence: >-
      Revenue contribution breakdown of top 10 enterprise accounts and percentage volume generated via GuidePoint
      Security.
    whyItMatters: High account or partner concentration creates vulnerability to reseller renegotiations or key client defections.
    diligencePath: Inspect audited customer concentration schedules and reseller agreement terms in management diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer enumeration completeness
    missingEvidence: Comprehensive census of all paying Deepwatch enterprise and federal customers.
    whyItMatters: Public case studies and partner announcements represent a partial sample rather than an exhaustive roster.
    diligencePath: Review full customer account roster and active subscription census in virtual data room.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Audited SOC 2 Type II reports, ISO 27001 certificates, and official FedRAMP Marketplace status documentation.
    whyItMatters: >-
      Without verified compliance attestations, enterprise procurement and federal sector expansion opportunities remain
      constrained.
    diligencePath: Request Deepwatch's current compliance documentation package and FedRAMP agency sponsorship roadmap.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: operational-quality-security-risk-register
    missingEvidence: >-
      Third-party benchmark studies quantifying false negative rates of the NEXA AI correlation platform against novel
      zero-day malware.
    whyItMatters: >-
      Marketing figures of 98% alert reduction cannot be independently confirmed without comparative detection efficacy
      evaluations.
    diligencePath: Obtain independent MITRE ATT&CK evaluation results or customer-side red teaming detection benchmark reports.
    relatedQuestionRefs:
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
