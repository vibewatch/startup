callouts:
  - calloutType: insight
    title: Mid-Market Enterprise Focus Drives Operational Efficiency
    body: >-
      Technographic data reveals that over sixty percent of Deepwatch's detected customer base operates with more than
      1,000 employees. For mid-market and core enterprise security leaders, partnering with a co-managed MDR provider
      resolves the operational impossibility of staffing a 24/7/365 internal security operations center within budget
      constraints.
    claimRefs:
      - CM001
      - CM006
  - calloutType: risk
    title: Commercial Valuation and Revenue Transparency Gap
    body: >-
      Third-party commercial estimates diverge significantly between $84 million and $120 million, with generalized
      statistical evaluations placing revenue in a broad $100M-$500M band. Because Deepwatch remains a private
      venture-backed entity, standalone MDR recurring revenue cannot be verified without audited financial cohort
      statements.
    claimRefs:
      - CM011
      - CM012
