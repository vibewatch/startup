        - Hardware firewall appliance procurement, on-premise physical security staffing, standalone EDR software resale
        - CISO / VP of Information Security (Security Operations OPEX)
        - Core commercial offering delivered via Guardian MDR Platform and NEXA AI Ecosystem
      - - Continuous Threat Exposure Management (CTEM)
        - Attack surface monitoring, external exposure discovery, vulnerability prioritization, business risk context
        - Standalone manual penetration testing, destructive red-team retainers, physical facility inspection
        - Director of Vulnerability Management / CISO
        - Strategic expansion capability anchored by Dassana acquisition, addressing pre-attack exposure
      - - Initial Access & Threat Intelligence
        - Adversary TTP intelligence feeds, credential compromise detection, initial access broker tracking
        - Consumer credit monitoring, generic anti-fraud portals, bulk unfiltered dark web scraping
        - Lead Threat Hunter / SOC Manager
        - Direct threat intelligence feed into Dynamic Risk Scoring and proactive hunting workflows
      - - Security Policy Management & Posture
        - Automated policy assurance, zero trust alignment, segmentation verification, audit compliance trails
        - General IT service management ticketing, generic GRC suites, physical network routing hardware
        - Security Architect / Director of Compliance
        - Cross-domain operational control preventing configuration drift and alert bloat
