  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cash-runway
      missingEvidence: Current unrestricted cash, quarterly cash burn, debt, and management runway guidance.
      whyItMatters: Gross financing proceeds cannot establish cash available or the timing and scale of future dilution.
      diligencePath: Reconcile the next Form 10-Q cash-flow statement and balance sheet to transaction closing proceeds and financing uses.
      relatedQuestionRefs: [QV002, QV003, QV004]
    - type: missing-source
      severity: material
      topic: capitalization
      missingEvidence: Fully diluted shares, options, warrants, PIPE terms, legacy preferences, and any lock-up or registration overhang.
