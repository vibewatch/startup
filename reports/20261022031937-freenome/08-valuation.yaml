company:
  name: Freenome
chapter:
  number: 8
  title: Valuation
  summary: >-
    Freenome has crossed into public-market price discovery with commercial and regulatory
    milestones, but the assigned evidence does not disclose the net cash, burn, fully diluted
    share count, preference overhang, or audited operating results needed for a defensible
    valuation range. The recommendation is research-more with high risk and no price endorsement
    until those inputs are reconciled.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The evidence supports research-more, not a price-insensitive buy. Seeking Alpha displayed a
      $14.01 close and $14.26 post-market price on October 21, while Robinhood displayed a $1.51
      billion market capitalization and another syndicated market item showed $1.35 billion.
      Those observations establish that investors can now price the equity, but they do not
      establish enterprise value or intrinsic value. Freenome also reported approximately $310
      million of gross transaction proceeds, yet gross proceeds are neither current cash
      availability nor runway. Entry discipline therefore requires audited cash, burn, debt,
      fully diluted shares, and preference data before a valuation range or target return can be
      defended.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV016
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is stronger than a pre-commercial platform story: the assigned evidence describes
      an FDA-approved colorectal screening product, an Abbott commercialization relationship, a
      two-test lung and colorectal offering, and updated clinical performance data. The anti-thesis
      is that product proof and commercial availability have not yet translated into auditable
      revenue, margin, adoption, or cash-runway evidence in this source set. A historical company
      statement that more than $1.1 billion had been raised is evidence of financing capacity, not
      cash on hand. Public listing status improves disclosure potential, but it does not by itself
      resolve commercialization, dilution, or valuation risk.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
    tableRefs:
      - TV002
  - id: scenario-framework
    title: Bull, base, and bear framework
    body: >-
      Scenario analysis must remain conditional because the evidence cannot support numerical
      valuation ranges. The bull case requires conversion of regulatory and partner milestones
      into repeatable screening volume, visible economics, and sufficient runway without punitive
      dilution. The base case assumes commercial progress but delayed financial proof, making the
      current market capitalization an observation rather than a justified anchor. The bear case
      is driven by weak adoption, negative operating economics, capital needs, or valuation
      compression; Robinhood's negative displayed price-to-earnings ratio and Morningstar's
      premium label are warning signals, not substitutes for audited loss or cash-burn data.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV016
    tableRefs:
      - TV003
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Freenome is already publicly quoted, so the relevant exit question is liquidity quality and
      value realization rather than whether a listing path exists. The next scheduled financial
      disclosure is a near-term opportunity to test the thesis against reported cash, operating
      loss, commercial activity, and capital needs. Before upgrading the recommendation, diligence
      should reconcile shares and options, net cash, debt, PIPE terms, legacy preferences,
      milestone obligations, product volumes, pricing, reimbursement, gross margin, and quarterly
      burn. Thesis-break triggers include missed commercial conversion, materially shorter runway,
      financing on dilutive terms, or evidence that current price embeds adoption unsupported by
      reported results.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision field
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Public pricing and product milestones are visible, but core valuation inputs are missing.
        - Do not endorse an entry price until audited financial and capitalization data are reconciled.
      - - Confidence
        - Medium
        - Multiple market-data pages corroborate public trading, while company-issued sources supply financing and product milestones.
        - Confidence can rise after the next financial filing provides auditable operating data.
      - - Risk rating
        - High
        - Commercial conversion, negative earnings indications, capital needs, and incomplete dilution data remain material.
        - Require a larger margin of safety than the current evidence can quantify.
      - - Valuation stance
        - Unproven at observed market capitalization
        - Assigned sources showed market capitalization observations of $1.35 billion and $1.51 billion on different pages.
        - Treat the discrepancy as timing-sensitive market data, not a justified valuation range.
      - - Entry discipline
        - Conditional
        - Approximately $310 million was reported as gross transaction proceeds, not current cash or runway.
        - Recalculate enterprise value only after obtaining cash, debt, share-count, and burn data.
    notes: >-
      Market prices and market capitalizations are provider observations around October 21-22,
      2026; gross proceeds are not treated as cash available, and no intrinsic valuation is estimated.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Regulatory and clinical progress has produced a marketed colorectal screening option rather than only a research pipeline.
        - Reported commercial volumes, reimbursement, and repeat ordering would strengthen the case.
      - - Thesis
        - Abbott commercialization and a conditional $70 million milestone can reduce go-to-market burden.
        - Weak partner execution or unfavorable economics would reduce this benefit.
      - - Thesis
        - A lung test and bundled colorectal option expand the product surface beyond one indication.
        - Prospective real-world outcomes and adoption evidence are needed to validate portfolio leverage.
      - - Anti-thesis
        - More than $1.1 billion of historical funding does not reveal current liquidity or capital efficiency.
        - Audited cash, quarterly burn, and a multi-year runway would mitigate this concern.
      - - Anti-thesis
        - Public-market access creates liquidity but exposes the equity to dilution and multiple compression before economics are proven.
        - Fully diluted capitalization and sustained commercial growth at improving margins would change the view.
    notes: >-
      The table separates product and financing evidence from unresolved operating economics; company
      claims are not treated as independent validation of adoption or value.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Commercial screening volume scales through Abbott; the lung offering adds demand; reported economics improve; runway is sufficient.
        - Upside requires evidence that growth and cash economics justify a premium to the observed market capitalization.
        - Adoption, reimbursement, execution, and dilution.
        - Not quantifiable from assigned evidence; requires reported commercial and financial results.
      - - Base
        - Product launches progress, but financial proof and portfolio expansion take multiple reporting periods.
        - Hold valuation judgment open because net cash, burn, shares, and operating results are unavailable.
        - Delayed disclosure, uneven uptake, and financing needs.
        - Most consistent with the mixed proof and missing valuation inputs in the current record.
      - - Bear
        - Adoption underperforms, losses persist, cash needs accelerate, or financing is materially dilutive.
        - Downside follows from multiple compression and a lower cash-adjusted value; no precise floor is supportable.
        - Negative operating economics, commercialization failure, and dilution.
        - Morningstar's premium label and Robinhood's negative displayed P/E are cautionary, not probability estimates.
    notes: >-
      Scenarios are qualitative because the assigned evidence lacks audited revenue, loss, cash,
      debt, fully diluted shares, burn, and preference terms; no probability or valuation range is invented.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV016
