    type: flow
    summary: Product proof and public liquidity improve investability, but missing financial and capitalization evidence blocks a price endorsement.
    data:
      nodes:
        - id: clinical-proof
          label: Clinical and regulatory proof
          detail: Updated CRC validation metrics and an FDA-approved product support product credibility.
        - id: commercial-path
          label: Commercial pathway
          detail: Abbott commercialization and a two-test portfolio create routes to adoption.
        - id: public-capital
          label: Public capital access
          detail: The 2026 business combination supplied gross proceeds and established public trading.
        - id: disclosure-test
          label: Financial disclosure test
          detail: Scheduled quarterly results can reveal cash, losses, commercial activity, and capital needs.
        - id: valuation-proof
          label: Valuation proof missing
          detail: Net cash, burn, fully diluted shares, preferences, and audited economics are not established.
        - id: recommendation
          label: Research more
          detail: Reassess only after the missing inputs permit enterprise-value and return analysis.
      edges:
        - from: clinical-proof
          to: commercial-path
        - from: commercial-path
          to: public-capital
        - from: public-capital
          to: disclosure-test
        - from: disclosure-test
          to: valuation-proof
        - from: valuation-proof
          to: recommendation
    approximationNotes: >-
      The flow is a qualitative decision chain; it does not encode probabilities, conversion rates,
      or a numerical valuation.
    claimRefs:
