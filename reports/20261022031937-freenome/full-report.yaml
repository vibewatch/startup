  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and channel segmentation
        blocks:
          - type: paragraph
            body: >-
              Freenome's commercial workflow separates the ordering actor, tested patient, payer, and distribution
              channel. Current company posts say both SimpleScreen CRC and SimpleScreen Lung are ordered by healthcare
              providers; eligible adults are the tested users, and positive results require colonoscopy or low-dose CT
              rather than constituting a final diagnosis. Freenome's SEC filing identifies Abbott as the exclusive U.S.
              commercializer for SimpleScreen CRC and says its established provider, reimbursement, patient-support, and
              Nexus infrastructure will support adoption. The same filing says the approved CRC test meets Medicare
              coverage criteria, but the assigned evidence does not show paid claims, net pricing, payer contracts,
              ordering-account counts, or the buyer for Freenome Digital Health. The customer thesis therefore depends
              on a multi-party care pathway, not a direct-to-patient transaction or an undifferentiated customer logo
              list.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU011
      - number: '6.2'
        title: Adoption trajectory and proof boundaries
        blocks:
          - type: paragraph
            body: >-
              The evidence shows a progression from research infrastructure to trial scale, regulatory clearance, and
              channel launch. Google Cloud reported that Freenome expanded its cloud use when diagnostic trials began in
              2022. A later validation report describes 48,995 PREEMPT CRC participants across more than 200 sites and
              reports performance for an updated assay; these are clinical-study measures, not customer or utilization
              counts. In July 2026, Freenome's SEC filing reported FDA approval of SimpleScreen CRC, while Freenome's
              current LinkedIn page says Abbott launched the test in September and that eligible patients can now
              receive colorectal and lung screening through a single blood draw. A separate company release says its
              CLIA laboratory was processing commercial samples. None of these sources provides the denominator needed
              to calculate active-account penetration, reorder behavior, paid-test growth, or conversion from an initial
              screen to completed follow-up.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU014
      - number: '6.3'
        title: Named relationships versus named customers
        blocks:
          - type: paragraph
            body: >-
              Abbott is the strongest named commercialization proof because the SEC filing describes an exclusive U.S.
              arrangement and a $100 million approval milestone. Roche is also a material strategic counterparty:
              independent 2025 reporting described non-U.S. rights for kitted multi-cancer tests, while Freenome's 2026
              release called both Abbott and Roche transformative partners. Google Cloud provides operating evidence for
              live research and processing infrastructure, but it is Freenome's supplier rather than a diagnostic
              customer. These relationships support readiness and distribution reach; they do not establish a
              diversified base of paying health systems. The assigned evidence names no production health-system
              account, and the Synapse page displayed no pipeline data on the access date. Accordingly, the exhibit
              treats counterparties, suppliers, and clinical populations as distinct from end-customer proof rather than
              inflating a customer list.
            claimRefs:
              - CU003
              - CU006
              - CU008
              - CU011
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
              - CU011
      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Freenome describes an expansion loop in which screening results connect to longitudinal real-world data
              and product improvement, but the source presents that loop as product design rather than measured
              retention. No assigned source reports NRR, GRR, churn, renewal rates, contract duration, repeat-order
              cohorts, customer concentration, or channel revenue mix. Abbott's reach may lower commercialization
              friction, yet exclusivity makes execution dependent on one U.S. channel. The company's own SEC risk
              language highlights both the ability to negotiate definitive arrangements with potential customers and
              competition from other tests. Independent reporting adds that Guardant had first-mover advantage and was
              projected to perform more than 80,000 Shield tests in 2025, while an analyst questioned important details
              behind Freenome's version-two validation data. Durable adoption remains a material diligence gap until
              management supplies payer decisions, account cohorts, follow-up completion, repeat use, and economics by
              channel.
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Launch proof now exceeds clinical readiness alone
            body: >-
              The FDA approval filing and Freenome's current launch statements establish a later commercial stage than
              trial enrollment or laboratory readiness by themselves.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU005
          - type: callout
            title: Channel access is not customer durability
            body: >-
              Abbott provides a named U.S. commercialization route, but no assigned source discloses diversified account
              cohorts, repeat orders, retention, or channel concentration.
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, clinical, and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              The core risk is not whether Freenome has crossed any regulatory threshold; company materials say
              SimpleScreen CRC is FDA-approved and commercially launched. The remaining exposure is version-specific and
              performance-specific. Clinical Lab Products reported that the updated assay reached 18.2% sensitivity for
              advanced precancerous lesions, 41.9% for lesions with high-grade dysplasia, 80.4% for colorectal cancer,
              and 90% specificity, while the first-generation product had already entered FDA review and the company
              planned a supplemental application for the updated version. That creates a measurable residual risk:
              approval of one version does not remove missed-lesion risk or the need to validate later versions.
              Public-market disclosure is another watch item. Freenome announced a completed business combination, but
              Morningstar said the stock was not formally analyst-covered and several public profiles contained
              inconsistent employee or corporate-status fields. The register therefore treats current regulatory status
              as partially evidenced and legal, privacy, and security posture as unverified rather than incident-free.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Scale, quality, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Freenome itself identifies manufacturing and scaling challenges, clinical validation, partner execution,
              market adoption, competition, and talent retention as risks. Those disclosures matter because the
              announced use of transaction proceeds spans pipeline development, an AI-enabled multiomics platform,
              laboratory and digital infrastructure, and commercialization rather than a single bounded launch. The
              operating model also concentrates critical execution outside Freenome. Clinical Lab Products described
              Abbott as the exclusive commercializer of the CRC test and tied a $70 million milestone to study outcome,
              technology transfer, and FDA approval; Freenome separately described Abbott and Roche as transformative
              partners. These arrangements may accelerate reach, but the assigned evidence does not disclose service
              levels, termination rights, minimum commitments, economics, or backup channels. Mitigation therefore
              appears strategically meaningful but contractually unverified. Investment underwriting should treat
              successful transfer, launch quality, follow-up completion, and partner continuity as monitored
              dependencies, not settled capabilities.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR009
              - CR011
      - number: '7.3'
        title: Capital risk, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The July transaction was expected to deliver approximately $310 million of gross proceeds, comprising
              about $70 million from the former SPAC trust and a $240 million PIPE. Gross proceeds are not cash
              available, cash burn, or runway, and the evidence pool contains no audited bridge from transaction
              proceeds to unrestricted liquidity. A Robinhood snapshot reported a negative price-to-earnings ratio, but
              neither that market statistic nor LeadIQ's estimated revenue range can substitute for filed operating
              results. The primary thesis-break triggers should therefore be observable: delay or rejection of a
              required updated-test submission; materially worse real-world sensitivity, specificity, or follow-up
              completion than the cited validation; failed technology transfer or commercial launch with Abbott; loss of
              a major partner without replacement; or liquidity falling below a board-approved development and
              commercialization plan. Before investment, obtain the latest filed financial statements, cash commitments,
              monthly burn, Abbott and Roche contracts, regulatory correspondence, quality-system metrics, privacy and
              security assessments, and a litigation schedule.
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Gross proceeds are not runway
            body: >-
              The transaction announcement quantified approximately $310 million of gross proceeds but did not disclose
              unrestricted cash, transaction costs, monthly burn, committed development spend, or runway.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
          - type: callout
            title: Gate underwriting on partner and regulatory evidence
            body: >-
              Require current FDA correspondence, Abbott and Roche contract summaries, technology-transfer milestones,
              and real-world quality metrics before treating commercialization risk as mitigated.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more, not a price-insensitive buy. Seeking Alpha displayed a $14.01 close
              and $14.26 post-market price on October 21, while Robinhood displayed a $1.51 billion market
              capitalization and another syndicated market item showed $1.35 billion. Those observations establish that
              investors can now price the equity, but they do not establish enterprise value or intrinsic value.
              Freenome also reported approximately $310 million of gross transaction proceeds, yet gross proceeds are
              neither current cash availability nor runway. Entry discipline therefore requires audited cash, burn,
              debt, fully diluted shares, and preference data before a valuation range or target return can be defended.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is stronger than a pre-commercial platform story: the assigned evidence describes an
              FDA-approved colorectal screening product, an Abbott commercialization relationship, a two-test lung and
              colorectal offering, and updated clinical performance data. The anti-thesis is that product proof and
              commercial availability have not yet translated into auditable revenue, margin, adoption, or cash-runway
              evidence in this source set. A historical company statement that more than $1.1 billion had been raised is
              evidence of financing capacity, not cash on hand. Public listing status improves disclosure potential, but
              it does not by itself resolve commercialization, dilution, or valuation risk.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.3'
        title: Bull, base, and bear framework
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain conditional because the evidence cannot support numerical valuation ranges.
              The bull case requires conversion of regulatory and partner milestones into repeatable screening volume,
              visible economics, and sufficient runway without punitive dilution. The base case assumes commercial
              progress but delayed financial proof, making the current market capitalization an observation rather than
              a justified anchor. The bear case is driven by weak adoption, negative operating economics, capital needs,
              or valuation compression; Robinhood's negative displayed price-to-earnings ratio and Morningstar's premium
              label are warning signals, not substitutes for audited loss or cash-burn data.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Freenome is already publicly quoted, so the relevant exit question is liquidity quality and value
              realization rather than whether a listing path exists. The next scheduled financial disclosure is a
              near-term opportunity to test the thesis against reported cash, operating loss, commercial activity, and
              capital needs. Before upgrading the recommendation, diligence should reconcile shares and options, net
              cash, debt, PIPE terms, legacy preferences, milestone obligations, product volumes, pricing,
              reimbursement, gross margin, and quarterly burn. Thesis-break triggers include missed commercial
              conversion, materially shorter runway, financing on dilutive terms, or evidence that current price embeds
              adoption unsupported by reported results.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Maintain a research-more stance until reported financials and fully diluted capitalization support a
              cash-adjusted valuation and downside case; product quality alone does not establish an attractive entry
              price.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV016
