        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert public deal figures into runway
            body: >-
              The retained evidence does not disclose unrestricted cash, operating cash burn, redemptions, transaction
              fees, debt repayment, or committed launch spending. A precise runway estimate would therefore be
              fabricated.
            calloutType: risk
            claimRefs:
