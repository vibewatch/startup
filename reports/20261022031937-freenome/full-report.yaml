  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and maturity
        blocks:
          - type: paragraph
            body: >-
              Freenome is building a screening system rather than a single analyte test. The available product
              descriptions combine a standard blood draw with genomic, epigenomic, proteomic, autoantibody, and
              cell-free-DNA signals, then apply computational biology and machine learning to identify cancer-related
              patterns. The current portfolio is centered on colorectal and lung screening, with a broader multi-cancer
              research pipeline. MTEC lists a CRC product with regulatory submission in progress, an acquired
              CE-IVD-marked autoantibody lung assay, a SimpleScreen Lung product for health systems, and digital-health
              tooling for EHR-based patient identification and engagement. This is a credible product surface, but
              several maturity labels remain company- or directory-reported rather than independently verified.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: Clinical workflow and proof points
        blocks:
          - type: paragraph
            body: >-
              The operating model moves from specimen collection to laboratory assay processing, algorithmic
              interpretation, and provider follow-up. Freenome's PCD description adds an eligibility and engagement
              layer intended to route patients to guideline-based screening, while positive results still require
              confirmatory or follow-up procedures. The strongest public technical evidence is the updated SimpleScreen
              CRC validation: the reported sensitivity was 18.2% for advanced precancerous lesions, 41.9% for lesions
              with high-grade dysplasia, and 80.4% for colorectal cancer, including 52% of Stage I cases, with 90%
              specificity for no colonoscopy findings. Those results are reported by the trade publication as
              company-released findings, so the underlying protocol, confidence intervals, and independent adjudication
              should remain diligence items.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE008
              - CE009
              - CE011
              - CE013
              - CE014
      - number: '5.3'
        title: Architecture, dependencies, and technical risks
        blocks:
          - type: paragraph
            body: >-
              The architecture's differentiation is the integration of multiple biological signals with machine learning
              and longitudinal real-world data, evaluated in large prospective studies. The same architecture creates
              dependencies: sample quality and laboratory throughput, assay and algorithm transfer, FDA review, Abbott
              commercialization, and the ability to generate sufficiently representative data across indications. The
              July 2026 company release states that Freenome's CLIA laboratory was processing commercial samples and
              that Abbott and Roche partnerships were in place, but it does not disclose reliability, turnaround-time,
              failure-rate, cybersecurity, or post-market surveillance metrics. Public developer-signal evidence is also
              limited; the assigned pool provides company and market surfaces rather than an engineering repository or
              operational status history. Morningstar's FRNM page also states that its quantitative ratings are
              algorithmic rather than formal analyst coverage, so that surface does not independently validate the
              product architecture.
