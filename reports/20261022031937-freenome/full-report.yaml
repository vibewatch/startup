      - number: '4.2'
        title: Public financial snapshots are inconsistent and incomplete
        blocks:
          - type: paragraph
            body: >-
              Public market summaries do not provide a reconciled operating history. A Yahoo Finance-hosted analysis
              reports $34.24 million of revenue and a $225.03 million net loss, while The Motley Fool page lists
              trailing revenue of $0.00; Tickeron separately describes roughly $35 million of trailing revenue and about
              $310 million of SPAC-related gross proceeds. Those figures may use different consolidation dates,
              accounting periods, or transaction definitions and therefore should not be blended. STAT described the
              announced transaction as a $330 million deal including a $240 million private investment, which is not the
              same metric as cash available after closing costs and operating use. EquityZen's old private-market
              funding snapshot and quantitative market pages further illustrate why only audited post-close statements
              can resolve revenue, cash, debt, and operating cash flow.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
          - type: table
            tableRef: TI003
