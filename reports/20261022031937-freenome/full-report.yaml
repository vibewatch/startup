          - type: paragraph
            body: >-
              Freenome closed its combination with Perceptive Capital Solutions in July 2026 and began trading under
              FRNM. The company announcement reports approximately $310 million of gross proceeds, composed of
              approximately $70 million from the former trust account and a fully committed $240 million PIPE led by
              Perceptive Advisors and RA Capital. Independent reporting had described more than $1.3 billion raised
