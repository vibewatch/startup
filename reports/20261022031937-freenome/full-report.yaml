              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.3'
        title: The margin path and runway remain unobservable
        blocks:
          - type: paragraph
            body: >-
              The $100 million approval milestone strengthens near-term funding relative to a no-payment scenario, but
              it cannot be translated into runway without the closing balance sheet, payment timing, operating cash
              burn, committed clinical spending, capital expenditure, debt obligations, and transaction costs.
              Accounting loss is not cash burn, announced financing is not cash on hand, and gross transaction value is
              not net liquidity. Revenue quality is also unresolved because the public record does not separate
              milestone, collaboration, service, and future per-test economics. The Abbott channel may improve sales
              efficiency, yet Freenome's transfer price, royalty or profit share, laboratory cost, collection logistics,
              reimbursement lag, and bad-debt exposure are unavailable. The financial verdict is therefore conditional:
              financing events create optionality, while recurring margin quality and capital adequacy require primary
              financial statements and the executed commercial agreement.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI013
              - CI014
              - CI015
              - CI016
