    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Freenome is headquartered in Brisbane, California and was founded in 2014. Its stated business is early
              cancer detection through blood-based screening tests: the company describes a Personalized Cancer
              Detection approach that combines multiomic blood tests with digital workflow and longitudinal data. The
              platform analyzes circulating cell-free DNA methylation patterns alongside additional biomarkers, while
              the company’s product strategy spans colorectal cancer, lung cancer, and additional single- and
              multi-cancer indications. Following its July 2026 transaction, Freenome is publicly traded under FRNM, but
              public-company status by itself does not establish commercial scale, recurring revenue, or customer
              adoption.
