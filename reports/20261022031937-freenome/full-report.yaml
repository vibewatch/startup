  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Freenome's screening architecture spans biological measurement, computational interpretation, clinical validation,
      and provider delivery.
    data:
      layers:
        - label: Biological measurement
          detail: Blood-based molecular measurements provide the input layer for the screening workflow.
          items:
            - label: Cell-free DNA and methylation
              detail: Blood-based molecular signal used in the CRC screening description.
            - label: Genomic, epigenomic, and proteomic signals
              detail: Multiomic inputs described for the CRC product.
            - label: Autoantibody profiling
              detail: CE-IVD-marked lung capability described as acquired.
        - label: Computational interpretation
          detail: Computational methods integrate biological signals into detection models.
          items:
            - label: Computational biology
              detail: Integrates biological signals for early-detection models.
            - label: Machine-learning models
              detail: Interprets multi-analyte and methylation patterns.
            - label: Biomarker discovery
              detail: Supports cancer and drug-response research collaborations.
        - label: Clinical evidence
          detail: Prospective studies and regulatory work establish clinical maturity.
          items:
            - label: Prospective CRC validation
              detail: PREEMPT CRC and the updated SimpleScreen CRC validation.
            - label: Lung and multi-cancer studies
              detail: PROACT LUNG and Vallania research programs.
        - label: Regulatory pathway
          detail: Regulatory submissions and partner transfer govern readiness for routine use.
          items:
            - label: Regulatory submission
              detail: FDA pathway described for the first-generation CRC test.
        - label: Laboratory and digital delivery
          detail: Laboratory and workflow components connect tests to provider operations.
          items:
            - label: CLIA laboratory processing
              detail: Company release says the laboratory was processing commercial samples.
            - label: Digital eligibility and engagement
              detail: EHR-native tools are described for health-system workflows.
        - label: Longitudinal learning loop
          detail: Real-world data and repeated screening are intended to support product iteration.
          items:
            - label: Longitudinal real-world data
              detail: PCD is designed to use results for product enhancement and repeated screening baselines.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: Screening journey and the unmeasured durability loop
    type: journey-map
    summary: The assigned evidence supports the ordered care path, while repeat use and economics remain unquantified.
    data:
      nodes:
        - id: eligibility
          label: Eligible adult identified
          title: Eligibility
          detail: Providers identify adults who fit the indication-specific screening population.
          touchpoints:
            - Primary care or screening workflow
            - Risk and guideline criteria
        - id: order
          label: Provider order
          title: Order
          detail: Both currently described tests require a healthcare-provider order.
          touchpoints:
            - Provider workflow
            - Abbott commercialization channel for CRC
        - id: draw
          label: Single blood draw
          title: Collection
          detail: Freenome markets CRC and lung screening through one blood draw when both are appropriate.
          touchpoints:
            - Routine blood collection
            - Patient consent and access
        - id: analysis
          label: Laboratory analysis
          title: Processing
          detail: Freenome says its CLIA laboratory processes commercial samples.
          touchpoints:
            - Laboratory workflow
            - Multiomics and data processing
        - id: follow-up
          label: Indicated follow-up
          title: Follow-up
          detail: Positive CRC and lung results require colonoscopy and low-dose CT, respectively.
          touchpoints:
            - Diagnostic referral
            - Completion tracking
        - id: durability
          label: Repeat screening and learning
          title: Durability
          detail: >-
            Longitudinal data and repeated screening are proposed expansion mechanisms, but public retention metrics are
            absent.
          touchpoints:
            - Longitudinal real-world data
            - Repeat-order and retention evidence gap
    approximationNotes: >-
      The sequence reflects the publicly described workflow; it does not imply conversion rates, elapsed time, or
      verified completion at any stage.
