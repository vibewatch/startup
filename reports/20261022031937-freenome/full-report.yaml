  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than oncology diagnostics or total cancer care. It includes screening
              tests used before a cancer diagnosis, the laboratory and software required to process and interpret them,
              and the provider workflow needed to identify, order, and follow up with eligible patients. Freenome's
              immediate wedge is blood-based colorectal-cancer screening; lung screening and risk-based multi-cancer
              panels are adjacencies whose regulatory, evidence, and reimbursement pathways differ. Treatment,
              surveillance after diagnosis, confirmatory procedures after a positive screen, and non-cancer diagnostics
              sit outside this boundary. The practical alternatives are also broader than liquid-biopsy competitors:
              colonoscopy, stool testing, mammography, MRI, low-dose CT, and non-participation each compete for patient
              attention, provider workflow, and payer budget. Independent profile pages consistently describe Freenome
              as an early cancer-detection company, but those equity-oriented pages do not validate demand or TAM.
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: Multiple sizing lenses, not one headline TAM
        blocks:
          - type: paragraph
            body: >-
              Freenome's filing estimates a collective U.S. opportunity of approximately $50 billion, but explicitly
              labels it an internal market-sizing exercise rather than projected revenue. Its mechanics combine an
              estimated 120 million people eligible for colorectal screening, assumed overlap with eligibility for
              additional cancer indications, and a proposed $509 Medicare multi-cancer reimbursement benchmark. Each
              input is uncertain, and the company has no commercial products for the non-colorectal indications embedded
              in that estimate. More constrained demand lenses are useful but not interchangeable: Freenome estimates
              40-50 million people remain unscreened for colorectal cancer; MedCity reports an analyst view that about
              11 million average-risk people would accept a blood test but not colonoscopy; and the filing identifies
              14-15 million guideline-eligible high-risk lung patients with only 10-15% screening participation. These
              are overlapping populations, not annual tests or revenue. A defensible SAM and SOM therefore remain open
              until geography, indication, reimbursement, price, repeat cadence, and conversion are jointly evidenced.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The patient is the test user, but adoption is provider-led and payer-constrained. Primary-care and
              specialist clinicians identify eligibility and order screening; health systems and laboratories implement
              collection, processing, electronic-record integration, and follow-up; commercial insurers, Medicare,
              Medicaid, employers, or patients fund the transaction. Freenome's Personalized Cancer Detection model adds
              digital tools intended to identify eligible patients and deliver guideline-based screening, making
              workflow integration part of the product rather than an accessory. Distribution can accelerate that path:
              the filing describes Exact Sciences infrastructure reaching more than 260,000 providers, hundreds of
              health systems, and millions of people who had not completed stool-based testing. However, Freenome also
              disclosed that it had not independently secured commercial payer contracts, coverage decisions, or
              contracted payment rates for its own account. The budget owner and economic buyer therefore vary by
              channel, and a clinical order does not itself establish payment.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is unmet screening participation: a routine blood draw may reduce procedural
              friction, while a common assay and integrated workflow could let one provider interaction address several
              guideline-defined risks. Company-issued releases emphasize colorectal screening, lung cancer, additional
              indications, digital navigation, and investment in commercial infrastructure. Those releases establish
              strategy, not independent adoption proof. The constraints are equally material. Medicare treatment of
              preventive services, payer-by-payer contracting, coding, evidence requirements, and follow-up costs can
              delay coverage even after regulatory authorization. MedCity reports that Guardant's Shield had first-mover
              advantage and was projected to exceed 80,000 tests in the cited year, giving an incumbent time to improve
              while Freenome advances later versions. For valuation, neither screening-eligible populations nor the
              internal TAM should be capitalized as revenue without observed orders, paid claims, repeat utilization,
              partner economics, and gross-margin evidence.
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Internal TAM is not a revenue forecast
            body: >-
              The approximately $50 billion estimate embeds population overlap, future reimbursement, regulatory
              approval, and commercialization assumptions that have not all been realized.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: Workflow and payment define the serviceable market
            body: >-
              Provider reach and patient eligibility can create leads, but contracted coverage, paid claims, and
              completed screening determine addressable commercial demand.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than blood-test developers. Guardant Shield is the direct
              blood-based peer and established the category's first FDA-approved primary-screening position. Abbott and
              Exact Sciences combine channel power with Cologuard, a stool-based incumbent, while colonoscopy and other
              stool tests remain entrenched substitutes. Blood tests compete partly by reaching people who resist those
              established workflows, so the status quo of delayed or missed screening is also a practical alternative.
              Provider-built outreach, referral, laboratory, and data workflows are internal-build substitutes, although
              the assigned evidence does not establish their costs. Multi-cancer entrants are strategically relevant,
              but this source pool does not support an exhaustive entrant ranking.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: Performance, regulation, and trust
        blocks:
          - type: paragraph
            body: >-
              FDA approval gives the first SimpleScreen CRC version a concrete trust anchor, but it does not make every
              later-generation result part of the approved label. The filed performance reported 81.1% colorectal-cancer
              sensitivity, 13.7% advanced-precancerous-lesion sensitivity, and 90.4% specificity for advanced colorectal
              neoplasia. Separate updated-test evidence reported 80.4% colorectal-cancer sensitivity and 18.2%
              advanced-lesion sensitivity in a validation study, while a smaller case-control release reported 85% and
              22%, respectively, at 90% specificity. Those cohorts and endpoints should not be treated as
              interchangeable. The updated version may improve precancer detection, but durable differentiation requires
              a regulatory bridge and like-for-like comparison with Guardant, stool testing, and colonoscopy.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
      - number: '3.3'
        title: Distribution power, access, and control
        blocks:
          - type: paragraph
            body: >-
              Freenome has chosen partner leverage over fully owned distribution. Abbott has exclusive U.S.
              commercialization responsibility for SimpleScreen CRC, and the FDA approval triggered a reported $100
              million milestone. Roche holds exclusive ex-U.S. rights for decentralized "kitted" tests, while Freenome
              retains specified centralized and U.S. rights. These relationships can accelerate provider access,
              reimbursement work, technology transfer, and international reach, but they also place customer ownership
              and route-to-market economics in partner hands. Abbott's Cologuard position creates a particularly
              important dual role: the partner can offer both an incumbent stool product and Freenome's blood test. That
              portfolio breadth may expand screening choice while limiting Freenome's independent channel power.
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Freenome's defensibility rests on regulated clinical evidence, assay iteration, data learning, and partner
              access rather than on demonstrated contractual lock-in. Switching friction should emerge from validated
              workflows, reimbursement, laboratory transfer, provider integration, and longitudinal data, but the
              assigned sources do not disclose customer contracts or realized pricing. Guardant's reported first-mover
              utilization provides commercial learning and time to improve its next test before Freenome's updated
              version completes its own regulatory path. Conversely, Freenome's improved lesion detection and
              Abbott/Roche routes could narrow that lead. The adverse case is therefore execution-based: a better peer
              version, partner bargaining power, weak reimbursement, or slow provider adoption could commoditize the
              assay before Freenome proves an owned data advantage.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory proof plus scaled partners
            body: >-
              FDA approval removes a major first-product risk, while Abbott and Roche provide routes to U.S. and
              selected ex-U.S. markets that Freenome would otherwise need to build.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP015
          - type: callout
            title: A partner-enabled moat is not an owned channel
            body: >-
              Exclusive commercialization rights can accelerate launch, but they also concentrate customer access and
              economics with partners that have their own platforms and screening portfolios.
            calloutType: risk
            claimRefs:
              - CP005
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization begins with milestones, not a proven recurring model
        blocks:
          - type: paragraph
            body: >-
              The most concrete financial event is contractual rather than recurring: Freenome's July 2026 SEC filing
              says FDA approval of SimpleScreen CRC triggered a $100 million milestone payment from Abbott. The filing
              also says Abbott will exclusively commercialize the test in the United States, using its provider,
              reimbursement, patient-support, and colorectal-cancer infrastructure. That arrangement can reduce
              Freenome's need to build a full direct commercial channel, but it shifts economics and execution toward a
              partner whose recurring payment formula is not disclosed in the reviewed filing. A separate industry
              report describes a $70 million milestone for the updated test, contingent on technology transfer and FDA
              approval. These milestones are valuable financing events, but neither is evidence of repeatable test
              revenue, realized reimbursement, or positive gross margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
              - CI015
