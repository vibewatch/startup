              The July 2026 transaction announcement names Aaron Elliott as chief executive officer, Riley Ennis as
              co-founder and chief product officer, Linh Le as chief financial officer, and Jimmy Lin as chief
              scientific officer. It also lists a board that combines company leadership with investors and diagnostics
              or life-sciences executives, including Ann Costello, Peter Kolchinsky, Deepa Pakianathan, Carole
