  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Signal, Value, Period, Attribution, Confidence, Customer implication, Missing denominator]
    rows:
      - [Cloud expansion for diagnostic trials, "Use increased materially", "2022, reported by Google Cloud in 2023", "Google Cloud partner case study", medium, "Operational capacity expanded before commercialization", "No customers, tests, sites, or revenue tied to the infrastructure increase"]
      - [PREEMPT CRC validation scale, "48,995 adults across more than 200 sites", "Reported for the updated test before 2026-10-22", "Company release republished by Clinical Lab Products", medium, "Large clinical evidence base and site network", "Participants and sites are not paid accounts or repeat-use cohorts"]
      - [Regulatory and channel milestone, "FDA approval; $100 million Abbott milestone", "2026-07-27", "Freenome Form 8-K", medium, "Clears the disclosed U.S. commercialization trigger", "No order volume, recognized revenue, net price, or account count"]
      - [Commercial availability, "CRC launched through Abbott; company also calls Lung commercially available", "September-October 2026 company posts", "Freenome LinkedIn page", medium, "Evidence has moved beyond a planned launch", "No paid-test count, utilization rate, reorder rate, or customer denominator"]
    notes: "The trajectory mixes infrastructure, clinical-study, regulatory, and company-reported launch signals. None is converted into a customer-growth rate because a comparable account or paid-test denominator is unavailable."
    claimRefs: [CU002, CU003, CU004, CU005, CU009]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: "Named commercialization and infrastructure relationships found in the assigned 2023-2026 evidence pool; this is not a complete customer list"
    columns: [Named entity, Relationship, Deployment or use case, Status, Evidence of outcome, Customer-proof limitation]
    rows:
      - [Abbott, "Exclusive U.S. commercialization channel", "SimpleScreen CRC provider access, reimbursement support, and patient support", "FDA approval trigger met; company reports launch", "$100 million approval milestone disclosed in the 8-K", "Channel partner is not an end-customer cohort; orders, accounts, and economics are undisclosed"]
      - [Roche, "Strategic and non-U.S. commercialization partner", "Kitted multi-cancer tests outside the U.S.", "Agreement reported; launch volume not reported", "Independent reporting describes rights plus equity and milestone consideration", "No named buying health systems, country launches, customer volume, or realized milestone schedule"]
      - [Google Cloud, "Infrastructure supplier to Freenome", "Cloud storage, compute, analytics, and collaboration for research workflows", "Expanded operating use described by Google", "Partner case study names deployed services", "This is supplier evidence, not evidence that Google buys Freenome screening tests"]
    notes: "This sample deliberately separates commercial channels and suppliers from end customers. Table-level claims span company-filed, independent, and partner-issued sources; no complete customer enumeration was publicly available."
    claimRefs: [CU003, CU004, CU006, CU008, CU011]
figures:
  - id: FU001
    title: Screening journey and the unmeasured durability loop
    type: journey-map
    summary: The assigned evidence supports the ordered care path, while repeat use and economics remain unquantified.
    data:
      nodes:
        - id: eligibility
          label: Eligible adult identified
          title: Eligibility
          detail: Providers identify adults who fit the indication-specific screening population.
          touchpoints: ["Primary care or screening workflow", "Risk and guideline criteria"]
        - id: order
          label: Provider order
          title: Order
          detail: Both currently described tests require a healthcare-provider order.
          touchpoints: ["Provider workflow", "Abbott commercialization channel for CRC"]
        - id: draw
          label: Single blood draw
          title: Collection
          detail: Freenome markets CRC and lung screening through one blood draw when both are appropriate.
          touchpoints: ["Routine blood collection", "Patient consent and access"]
        - id: analysis
          label: Laboratory analysis
          title: Processing
          detail: Freenome says its CLIA laboratory processes commercial samples.
          touchpoints: ["Laboratory workflow", "Multiomics and data processing"]
        - id: follow-up
          label: Indicated follow-up
          title: Follow-up
          detail: Positive CRC and lung results require colonoscopy and low-dose CT, respectively.
          touchpoints: ["Diagnostic referral", "Completion tracking"]
        - id: durability
          label: Repeat screening and learning
          title: Durability
          detail: Longitudinal data and repeated screening are proposed expansion mechanisms, but public retention metrics are absent.
          touchpoints: ["Longitudinal real-world data", "Repeat-order and retention evidence gap"]
    approximationNotes: "The sequence reflects the publicly described workflow; it does not imply conversion rates, elapsed time, or verified completion at any stage."
    claimRefs: [CU001, CU004, CU006, CU007, CU014]
callouts:
  - calloutType: strength
    title: Launch proof now exceeds clinical readiness alone
    body: The FDA approval filing and Freenome's current launch statements establish a later commercial stage than trial enrollment or laboratory readiness by themselves.
    claimRefs: [CU002, CU004, CU005]
  - calloutType: risk
    title: Channel access is not customer durability
    body: Abbott provides a named U.S. commercialization route, but no assigned source discloses diversified account cohorts, repeat orders, retention, or channel concentration.
    claimRefs: [CU003, CU014, CU016]
