schemaVersion: "report-v2"
artifact: customers
slug: freenome
runDate: 2026-10-22
company:
  name: Freenome
chapter:
  number: 6
  title: Customers
  summary: >-
    Freenome has crossed from clinical validation into an Abbott-led U.S. launch of SimpleScreen
    CRC, while its own current posts also describe a commercially available lung laboratory-
    developed test. That is credible channel and launch evidence, but the assigned public sources
    still do not disclose named production health-system customers, paid-account counts,
    utilization, retention, payer economics, or customer concentration.
sections:
  - id: customer-segments
    title: Buyer, user, payer, and channel segmentation
    body: >-
      Freenome's commercial workflow separates the ordering actor, tested patient, payer, and
      distribution channel. Current company posts say both SimpleScreen CRC and SimpleScreen Lung
      are ordered by healthcare providers; eligible adults are the tested users, and positive
      results require colonoscopy or low-dose CT rather than constituting a final diagnosis.
      Freenome's SEC filing identifies Abbott as the exclusive U.S. commercializer for
      SimpleScreen CRC and says its established provider, reimbursement, patient-support, and
      Nexus infrastructure will support adoption. The same filing says the approved CRC test
      meets Medicare coverage criteria, but the assigned evidence does not show paid claims, net
      pricing, payer contracts, ordering-account counts, or the buyer for Freenome Digital Health.
      The customer thesis therefore depends on a multi-party care pathway, not a direct-to-patient
      transaction or an undifferentiated customer logo list.
    claimRefs: [CU001, CU002, CU003, CU004, CU007]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof boundaries
    body: >-
      The evidence shows a progression from research infrastructure to trial scale, regulatory
      clearance, and channel launch. Google Cloud reported that Freenome expanded its cloud use
      when diagnostic trials began in 2022. A later validation report describes 48,995 PREEMPT
      CRC participants across more than 200 sites and reports performance for an updated assay;
      these are clinical-study measures, not customer or utilization counts. In July 2026,
      Freenome's SEC filing reported FDA approval of SimpleScreen CRC, while Freenome's current
      LinkedIn page says Abbott launched the test in September and that eligible patients can now
      receive colorectal and lung screening through a single blood draw. A separate company
      release says its CLIA laboratory was processing commercial samples. None of these sources
      provides the denominator needed to calculate active-account penetration, reorder behavior,
      paid-test growth, or conversion from an initial screen to completed follow-up.
    claimRefs: [CU002, CU004, CU005, CU006, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named relationships versus named customers
    body: >-
      Abbott is the strongest named commercialization proof because the SEC filing describes an
      exclusive U.S. arrangement and a $100 million approval milestone. Roche is also a material
      strategic counterparty: independent 2025 reporting described non-U.S. rights for kitted
      multi-cancer tests, while Freenome's 2026 release called both Abbott and Roche
      transformative partners. Google Cloud provides operating evidence for live research and
      processing infrastructure, but it is Freenome's supplier rather than a diagnostic customer.
      These relationships support readiness and distribution reach; they do not establish a
      diversified base of paying health systems. The assigned evidence names no production
      health-system account, and the Synapse page displayed no pipeline data on the access date.
      Accordingly, the exhibit treats counterparties, suppliers, and clinical populations as
      distinct from end-customer proof rather than inflating a customer list.
    claimRefs: [CU003, CU006, CU008, CU011, CU014, CU015]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      Freenome describes an expansion loop in which screening results connect to longitudinal
      real-world data and product improvement, but the source presents that loop as product
      design rather than measured retention. No assigned source reports NRR, GRR, churn, renewal
      rates, contract duration, repeat-order cohorts, customer concentration, or channel revenue
      mix. Abbott's reach may lower commercialization friction, yet exclusivity makes execution
      dependent on one U.S. channel. The company's own SEC risk language highlights both the
      ability to negotiate definitive arrangements with potential customers and competition from
      other tests. Independent reporting adds that Guardant had first-mover advantage and was
      projected to perform more than 80,000 Shield tests in 2025, while an analyst questioned
      important details behind Freenome's version-two validation data. Durable adoption remains a
      material diligence gap until management supplies payer decisions, account cohorts,
      follow-up completion, repeat use, and economics by channel.
    claimRefs: [CU007, CU012, CU013, CU014, CU016]
