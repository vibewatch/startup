  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: trust-safety-security
      missingEvidence: Public evidence of cybersecurity controls, privacy governance, model monitoring, assay failure rates, turnaround times, and post-market quality surveillance.
      whyItMatters: Screening products affect clinical decisions, and the assigned sources describe capabilities without providing operational safety or reliability denominators.
      diligencePath: Request the quality-management system, security attestations, validation protocols, model-monitoring plan, complaint history, and laboratory quality metrics.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: product-readiness
      missingEvidence: Independent confirmation of current FDA status, commercial availability, payer workflow, and real-world adoption for each SimpleScreen product.
      whyItMatters: Company and syndicated descriptions establish intended positioning but do not independently prove regulatory scope, deployment scale, or durable clinical utility.
      diligencePath: Obtain current FDA records, CLIA laboratory documentation, partner commercialization milestones, payer coverage evidence, and provider utilization data.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public engineering repositories, package activity, technical operating history, practitioner discussion, or an equivalent independent developer-signal proxy.
      whyItMatters: The assigned evidence shows product claims and clinical milestones but does not demonstrate software release cadence, engineering participation, service reliability, or practitioner adoption.
      diligencePath: Request engineering release history and reliability records, then corroborate them through public repositories, technical talks, integration-partner evidence, or practitioner-community discussion.
      relatedQuestionRefs: [QE009]
