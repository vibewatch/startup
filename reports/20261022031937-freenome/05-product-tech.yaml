      - ["Freenome Digital Health", "Health-system care teams", "EHR-native workflow tooling", "Eligibility identification and patient engagement around screening", "Deployment, interoperability, security, and measured adherence"]
    notes: >-
      Statuses and differentiation are reported in the assigned MTEC, LinkedIn, and
      company-release materials; null operational fields are diligence requests, not
      evidence of failure.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Freenome solution, Measurable benefit or proof, Limitation]
    rows:
      - [Identify eligible screening patients, Manual or fragmented health-system outreach, PCD combines test selection with integrated digital eligibility and engagement tools, Designed to expand participation; no public adherence denominator, Benefit is a design claim pending deployment evidence]
      - [Screen for colorectal cancer, Colonoscopy or stool-based screening pathways, Blood-based SimpleScreen CRC with algorithmic multiomics interpretation, 80.4% colorectal-cancer sensitivity and 90% specificity reported in validation, Positive result still requires colonoscopy and regulatory scope must be confirmed]
      - [Screen selected adults for lung cancer, LDCT eligibility and referral workflows, SimpleScreen Lung blood test with follow-up LDCT for a positive result, Lung product and target population described on company surface, Public operating volume and outcome data are not disclosed]
      - [Improve later versions, Static test development without longitudinal feedback, Link results to longitudinal real-world data and repeated screening baselines, PCD says data can inform product enhancements, Data governance and model-drift controls are not public]
    notes: >-
      Benefits distinguish reported clinical metrics from intended workflow effects.
      The table does not infer conversion, adherence, or outcome rates where a
      denominator or independent deployment study is unavailable.
    claimRefs: [CE008, CE009, CE011, CE013, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Specimen and molecular measurement", "Capture genomic, epigenomic, proteomic, cell-free-DNA, and autoantibody signals from blood", "Sample collection and assay quality", "Pre-analytic variation and reproducibility are not publicly quantified"]
      - ["Computational and machine-learning interpretation", "Integrate multiomic signals and identify biomarker patterns", "Training data, model validation, and algorithm transfer", "Generalization, calibration, and model-drift evidence remain limited"]
      - ["Clinical validation and regulatory pathway", "Evaluate performance in prospective populations and support FDA submissions", "Large studies, statistical analysis, and regulatory review", "Approval timing and next-generation submission status are unresolved"]
      - ["Laboratory and digital delivery", "Process commercial samples and connect results to provider workflows", "CLIA laboratory, EHR integrations, Abbott commercialization, and Roche collaboration", "Throughput, uptime, security, and implementation economics are not disclosed"]
    notes: >-
      This is an evidence-bounded operating model synthesized from the assigned
      product descriptions, study reports, and company release; it is not a complete
      proprietary architecture diagram.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE011, CE012, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Freenome's screening architecture spans biological measurement, computational interpretation, clinical validation, and provider delivery.
    data:
      layers:
        - label: Biological measurement
          detail: Blood-based molecular measurements provide the input layer for the screening workflow.
          items:
            - label: Cell-free DNA and methylation
              detail: Blood-based molecular signal used in the CRC screening description.
            - label: Genomic, epigenomic, and proteomic signals
              detail: Multiomic inputs described for the CRC product.
            - label: Autoantibody profiling
              detail: CE-IVD-marked lung capability described as acquired.
        - label: Computational interpretation
          detail: Computational methods integrate biological signals into detection models.
          items:
            - label: Computational biology
              detail: Integrates biological signals for early-detection models.
            - label: Machine-learning models
              detail: Interprets multi-analyte and methylation patterns.
            - label: Biomarker discovery
              detail: Supports cancer and drug-response research collaborations.
        - label: Clinical evidence
          detail: Prospective studies and regulatory work establish clinical maturity.
          items:
            - label: Prospective CRC validation
              detail: PREEMPT CRC and the updated SimpleScreen CRC validation.
            - label: Lung and multi-cancer studies
              detail: PROACT LUNG and Vallania research programs.
        - label: Regulatory pathway
          detail: Regulatory submissions and partner transfer govern readiness for routine use.
          items:
            - label: Regulatory submission
              detail: FDA pathway described for the first-generation CRC test.
        - label: Laboratory and digital delivery
          detail: Laboratory and workflow components connect tests to provider operations.
          items:
            - label: CLIA laboratory processing
              detail: Company release says the laboratory was processing commercial samples.
            - label: Digital eligibility and engagement
              detail: EHR-native tools are described for health-system workflows.
        - label: Longitudinal learning loop
          detail: Real-world data and repeated screening are intended to support product iteration.
          items:
            - label: Longitudinal real-world data
              detail: PCD is designed to use results for product enhancement and repeated screening baselines.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007, CE011, CE013, CE014]
callouts:
  - calloutType: strength
    title: Strongest technical proof
    body: The updated SimpleScreen CRC validation reports improved precancerous-lesion sensitivity alongside colorectal-cancer detection metrics from a large prospective study population.
    claimRefs: [CE008, CE009, CE010]
  - calloutType: risk
    title: Main execution dependency
    body: The product's commercial value depends on regulatory clearance, laboratory execution, partner technology transfer, and evidence that workflow tools improve screening participation without compromising safety or follow-up.
    claimRefs: [CE011, CE012, CE013, CE014, CE015]
