      - Evidence
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Laboratory, manufacturing, and commercial scale-up
        - "Freenome listed manufacturing and scaling challenges as risks while directing transaction proceeds toward laboratory, digital, and commercial infrastructure."
        - "Explicit company risk disclosure"
        - High
        - "In progress: CLIA processing and new capital were described"
        - "High until throughput, turnaround, failure-rate, and capacity data are disclosed"
        - "Site-level capacity, assay failure rate, turnaround time, quality events, and continuity plan"
      - - Assay and algorithm version control
        - "The updated CRC test changed assay and algorithm performance and was expected to use a supplemental regulatory pathway."
        - "Active product iteration"
        - High
        - "Partial: prospective validation was described"
        - "Medium-high because each material version may require evidence, transfer, and controlled deployment"
        - "Locked-model policy, validation protocol, drift monitoring, change-control records, and version-specific labels"
      - - Workforce and operating-data integrity
        - "Freenome disclosed talent retention as a risk, while public profiles showed employee counts ranging from 3 to more than 400."
        - "Explicit retention risk plus inconsistent external metadata"
        - Medium
        - "Unverified beyond named leadership and public profiles"
        - "Medium; staffing adequacy and key-person concentration cannot be measured from the assigned sources"
        - "Current organization chart, regretted attrition, critical vacancies, succession plan, and reconciled headcount"
    notes: >-
      Qualitative ranking uses the company's explicit risk disclosure and observable product
      status; the assigned pool contained no verified security-control or incident source.
    claimRefs: [CR003, CR004, CR005, CR006, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration and failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - CRC commercialization and technology transfer
        - "Abbott; reported exclusive commercializer"
        - "Transfer, approval, or launch underperformance could delay revenue and adoption; a $70 million milestone was described as conditional."
        - High
        - "Partner has an established diagnostics channel, but contract terms were not available"
        - "High until transfer acceptance, launch KPIs, economics, and termination protections are verified"
      - - Broader screening distribution
        - "Abbott and Roche; strategic partnerships described by Freenome"
        - "Loss or reprioritization of either relationship could narrow workflow access and commercialization capacity."
        - High
        - "Two named partners provide some diversification"
        - "Medium-high because scope, exclusivity, minimum commitments, and replacement options are undisclosed"
      - - Capital-market funding and development plan
        - "PIPE investors and former SPAC trust; financing of pipeline, platform, and infrastructure"
        - "Gross proceeds may not cover transaction costs, burn, and the full multi-indication development plan."
        - High
        - "Approximately $310 million of gross proceeds was announced"
        - "Unknown until unrestricted cash, burn, commitments, and runway are reconciled"
    notes: >-
      Concentration and residual-exposure judgments are qualitative; no private partner contract,
      cash bridge, or board-approved operating plan was available in the assigned source pool.
    claimRefs: [CR002, CR003, CR007, CR009, CR011]
