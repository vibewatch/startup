company:
  name: Freenome
chapter:
  number: 7
  title: Risks
  summary: >-
    Freenome's highest-evidence risks are regulatory and clinical iteration, execution at
    commercial scale, and dependence on Abbott and Roche, while public disclosure quality is
    still uneven. The July 2026 transaction supplied gross proceeds, not a disclosed runway,
    and the assigned evidence does not establish privacy, security, litigation, or contractual
    protections.
sections:
  - id: regulatory-clinical-and-disclosure-risk
    title: Regulatory, clinical, and disclosure risk
    body: >-
      The core risk is not whether Freenome has crossed any regulatory threshold; company
      materials say SimpleScreen CRC is FDA-approved and commercially launched. The remaining
      exposure is version-specific and performance-specific. Clinical Lab Products reported
      that the updated assay reached 18.2% sensitivity for advanced precancerous lesions,
      41.9% for lesions with high-grade dysplasia, 80.4% for colorectal cancer, and 90%
      specificity, while the first-generation product had already entered FDA review and the
      company planned a supplemental application for the updated version. That creates a
      measurable residual risk: approval of one version does not remove missed-lesion risk or
      the need to validate later versions. Public-market disclosure is another watch item.
      Freenome announced a completed business combination, but Morningstar said the stock was
      not formally analyst-covered and several public profiles contained inconsistent employee
      or corporate-status fields. The register therefore treats current regulatory status as
      partially evidenced and legal, privacy, and security posture as unverified rather than
      incident-free.
    claimRefs: [CR001, CR005, CR006, CR008, CR010, CR012]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: scale-quality-and-dependency-risk
    title: Scale, quality, and dependency risk
    body: >-
      Freenome itself identifies manufacturing and scaling challenges, clinical validation,
      partner execution, market adoption, competition, and talent retention as risks. Those
      disclosures matter because the announced use of transaction proceeds spans pipeline
      development, an AI-enabled multiomics platform, laboratory and digital infrastructure,
      and commercialization rather than a single bounded launch. The operating model also
      concentrates critical execution outside Freenome. Clinical Lab Products described Abbott
      as the exclusive commercializer of the CRC test and tied a $70 million milestone to study
      outcome, technology transfer, and FDA approval; Freenome separately described Abbott and
      Roche as transformative partners. These arrangements may accelerate reach, but the
      assigned evidence does not disclose service levels, termination rights, minimum
      commitments, economics, or backup channels. Mitigation therefore appears strategically
      meaningful but contractually unverified. Investment underwriting should treat successful
      transfer, launch quality, follow-up completion, and partner continuity as monitored
      dependencies, not settled capabilities.
    claimRefs: [CR003, CR004, CR005, CR007, CR009, CR012]
    tableRefs: [TR002, TR003]
  - id: capital-risk-and-kill-criteria
    title: Capital risk, monitoring, and thesis-break triggers
    body: >-
      The July transaction was expected to deliver approximately $310 million of gross proceeds,
      comprising about $70 million from the former SPAC trust and a $240 million PIPE. Gross
      proceeds are not cash available, cash burn, or runway, and the evidence pool contains no
      audited bridge from transaction proceeds to unrestricted liquidity. A Robinhood snapshot
      reported a negative price-to-earnings ratio, but neither that market statistic nor
      LeadIQ's estimated revenue range can substitute for filed operating results. The primary
      thesis-break triggers should therefore be observable: delay or rejection of a required
      updated-test submission; materially worse real-world sensitivity, specificity, or
      follow-up completion than the cited validation; failed technology transfer or commercial
      launch with Abbott; loss of a major partner without replacement; or liquidity falling
      below a board-approved development and commercialization plan. Before investment, obtain
      the latest filed financial statements, cash commitments, monthly burn, Abbott and Roche
      contracts, regulatory correspondence, quality-system metrics, privacy and security
      assessments, and a litigation schedule.
    claimRefs: [CR002, CR007, CR011, CR012]
callouts:
  - calloutType: risk
    title: Gross proceeds are not runway
    body: >-
      The transaction announcement quantified approximately $310 million of gross proceeds but
      did not disclose unrestricted cash, transaction costs, monthly burn, committed development
      spend, or runway.
    claimRefs: [CR002, CR003]
  - calloutType: recommendation
    title: Gate underwriting on partner and regulatory evidence
    body: >-
      Require current FDA correspondence, Abbott and Roche contract summaries, technology-transfer
      milestones, and real-world quality metrics before treating commercialization risk as mitigated.
    claimRefs: [CR006, CR007, CR009]
