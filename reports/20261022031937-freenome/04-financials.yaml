chapter:
  number: 4
  title: "Financials"
  summary: >-
    Freenome's clearest disclosed monetization is milestone-based: FDA approval
    triggered a $100 million Abbott payment, while Abbott controls U.S.
    commercialization. Public financial snapshots disagree on revenue and do
    not disclose cash, burn, recurring partner economics, pricing, or gross
    margin, so capital adequacy and unit economics remain underwriting blockers.
sections:
  - id: "monetization-and-distribution"
    title: "Monetization begins with milestones, not a proven recurring model"
    body: >-
      The most concrete financial event is contractual rather than recurring:
      Freenome's July 2026 SEC filing says FDA approval of SimpleScreen CRC
      triggered a $100 million milestone payment from Abbott. The filing also
      says Abbott will exclusively commercialize the test in the United States,
      using its provider, reimbursement, patient-support, and colorectal-cancer
      infrastructure. That arrangement can reduce Freenome's need to build a
      full direct commercial channel, but it shifts economics and execution
      toward a partner whose recurring payment formula is not disclosed in the
      reviewed filing. A separate industry report describes a $70 million
      milestone for the updated test, contingent on technology transfer and FDA
      approval. These milestones are valuable financing events, but neither is
      evidence of repeatable test revenue, realized reimbursement, or positive
      gross margin.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI013"
      - "CI015"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "reported-performance-and-capital"
    title: "Public financial snapshots are inconsistent and incomplete"
    body: >-
      Public market summaries do not provide a reconciled operating history.
      A Yahoo Finance-hosted analysis reports $34.24 million of revenue and a
      $225.03 million net loss, while The Motley Fool page lists trailing
      revenue of $0.00; Tickeron separately describes roughly $35 million of
      trailing revenue and about $310 million of SPAC-related gross proceeds.
      Those figures may use different consolidation dates, accounting periods,
      or transaction definitions and therefore should not be blended. STAT
      described the announced transaction as a $330 million deal including a
      $240 million private investment, which is not the same metric as cash
      available after closing costs and operating use. EquityZen's old
      private-market funding snapshot and quantitative market pages further
      illustrate why only audited post-close statements can resolve revenue,
      cash, debt, and operating cash flow.
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "underwriting-verdict"
    title: "The margin path and runway remain unobservable"
    body: >-
      The $100 million approval milestone strengthens near-term funding relative
      to a no-payment scenario, but it cannot be translated into runway without
      the closing balance sheet, payment timing, operating cash burn, committed
      clinical spending, capital expenditure, debt obligations, and transaction
      costs. Accounting loss is not cash burn, announced financing is not cash
      on hand, and gross transaction value is not net liquidity. Revenue quality
      is also unresolved because the public record does not separate milestone,
      collaboration, service, and future per-test economics. The Abbott channel
      may improve sales efficiency, yet Freenome's transfer price, royalty or
      profit share, laboratory cost, collection logistics, reimbursement lag,
      and bad-debt exposure are unavailable. The financial verdict is therefore
      conditional: financing events create optionality, while recurring margin
      quality and capital adequacy require primary financial statements and the
      executed commercial agreement.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
      - "CI007"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
