  topStrengths:
    - FDA 批准的 SimpleScreen CRC 奠定了明确的商业产品里程碑。
    - 多组学与机器学习能力支撑差异化癌症筛查平台的投资逻辑。
    - Abbott 的商业化与 Roche 的合作，可能让分销触达超出 Freenome 自有基础设施的范围。
  topRisks:
    - 指定证据中仍未披露现金消耗、现金 runway、经审计收入和完全摊薄后资本结构。
    - Abbott 主导的商业化与报销落地，决定这项批准能否转化为经常性经济收益。
    - Guardant 等液体活检竞争者带来先发优势和临床验证压力。
  unresolvedGaps:
    - 经审计的经常性收入、现金余额、消耗率、债务和获批后的 runway 尚未披露。
    - 经核实的客户、检测量和商业采用数据仍不可得。
    - 要形成可辩护的估值区间，还需要完全摊薄股数、优先权结构和企业价值输入。
    - 报销覆盖、定价和 Abbott 的上市经济性仍需确认。
    - 更广泛的多癌种临床与监管里程碑，成熟度仍低于已获批的 CRC 产品。
