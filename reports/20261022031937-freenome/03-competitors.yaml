company:
  name: "Freenome"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Freenome now has an FDA-approved colorectal-cancer blood test, but Guardant retains first-mover
    evidence and Abbott controls U.S. commercialization. Freenome's next-generation performance and
    Roche-enabled international route strengthen its position, while pricing, reimbursement,
    adoption, and like-for-like competitor economics remain unverified.
sections:
  - id: "competitive-set"
    title: "Competitive set and buyer alternatives"
    body: >-
      The relevant competitive set is broader than blood-test developers. Guardant Shield is the
      direct blood-based peer and established the category's first FDA-approved primary-screening
      position. Abbott and Exact Sciences combine channel power with Cologuard, a stool-based
      incumbent, while colonoscopy and other stool tests remain entrenched substitutes. Blood tests
      compete partly by reaching people who resist those established workflows, so the status quo
      of delayed or missed screening is also a practical alternative. Provider-built outreach,
      referral, laboratory, and data workflows are internal-build substitutes, although the
      assigned evidence does not establish their costs. Multi-cancer entrants are strategically
      relevant, but this source pool does not support an exhaustive entrant ranking.
    claimRefs: [CP011, CP012, CP013, CP014]
    tableRefs: [TP001]
  - id: "performance-and-trust"
    title: "Performance, regulation, and trust"
    body: >-
      FDA approval gives the first SimpleScreen CRC version a concrete trust anchor, but it does not
      make every later-generation result part of the approved label. The filed performance reported
      81.1% colorectal-cancer sensitivity, 13.7% advanced-precancerous-lesion sensitivity, and 90.4%
      specificity for advanced colorectal neoplasia. Separate updated-test evidence reported 80.4%
      colorectal-cancer sensitivity and 18.2% advanced-lesion sensitivity in a validation study,
      while a smaller case-control release reported 85% and 22%, respectively, at 90% specificity.
      Those cohorts and endpoints should not be treated as interchangeable. The updated version may
      improve precancer detection, but durable differentiation requires a regulatory bridge and
      like-for-like comparison with Guardant, stool testing, and colonoscopy.
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: "distribution-and-control"
    title: "Distribution power, access, and control"
    body: >-
      Freenome has chosen partner leverage over fully owned distribution. Abbott has exclusive U.S.
      commercialization responsibility for SimpleScreen CRC, and the FDA approval triggered a
      reported $100 million milestone. Roche holds exclusive ex-U.S. rights for decentralized
      "kitted" tests, while Freenome retains specified centralized and U.S. rights. These
      relationships can accelerate provider access, reimbursement work, technology transfer, and
      international reach, but they also place customer ownership and route-to-market economics in
      partner hands. Abbott's Cologuard position creates a particularly important dual role: the
      partner can offer both an incumbent stool product and Freenome's blood test. That portfolio
      breadth may expand screening choice while limiting Freenome's independent channel power.
    claimRefs: [CP005, CP006, CP013, CP015]
    tableRefs: [TP003]
  - id: "moat-and-displacement"
    title: "Moat durability, switching costs, and displacement risk"
    body: >-
      Freenome's defensibility rests on regulated clinical evidence, assay iteration, data learning,
      and partner access rather than on demonstrated contractual lock-in. Switching friction should
      emerge from validated workflows, reimbursement, laboratory transfer, provider integration,
      and longitudinal data, but the assigned sources do not disclose customer contracts or
      realized pricing. Guardant's reported first-mover utilization provides commercial learning and
      time to improve its next test before Freenome's updated version completes its own regulatory
      path. Conversely, Freenome's improved lesion detection and Abbott/Roche routes could narrow
      that lead. The adverse case is therefore execution-based: a better peer version, partner
      bargaining power, weak reimbursement, or slow provider adoption could commoditize the assay
      before Freenome proves an owned data advantage.
    claimRefs: [CP007, CP008, CP010, CP014, CP015]
callouts:
  - calloutType: "strength"
    title: "Regulatory proof plus scaled partners"
    body: >-
      FDA approval removes a major first-product risk, while Abbott and Roche provide routes to U.S.
      and selected ex-U.S. markets that Freenome would otherwise need to build.
    claimRefs: [CP001, CP005, CP015]
  - calloutType: "risk"
    title: "A partner-enabled moat is not an owned channel"
    body: >-
      Exclusive commercialization rights can accelerate launch, but they also concentrate customer
      access and economics with partners that have their own platforms and screening portfolios.
    claimRefs: [CP005, CP013, CP015]
