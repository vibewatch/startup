        title: 产品、监管与商业里程碑
        blocks:
          - type: paragraph
            body: >-
              Freenome 的里程碑路径从 2014 年成立，走到 2026 年进入公开市场并获得 SimpleScreen CRC 的 FDA 批准，适用人群为 45 岁及以上的平均风险成年人。SEC
              提供的新闻稿显示，获批检测在 PREEMPT CRC 分析中对结直肠癌的灵敏度为 81.1%，对晚期癌前病变的灵敏度为 13.7%，对晚期结直肠肿瘤的特异度为 90.4%。Clinical Lab
              Products 另行报道更新版检测的结果分别为 80.4%、18.2% 和 90%；两版检测及其分析不应混为一谈。Abbott
