  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、临床与披露风险
        blocks:
          - type: paragraph
            body: >-
              核心风险不是 Freenome 是否跨过任何监管门槛；公司材料称 SimpleScreen CRC 已获 FDA 批准并已商业上市。剩余风险与版本和性能直接相关。Clinical Lab Products
              报道更新版检测对晚期癌前病变的灵敏度为 18.2%、对高等级异型增生病变为 41.9%、对结直肠癌为 80.4%，特异度为 90%；第一代产品当时已进入 FDA
              审查，公司计划为更新版提交补充申请。这形成了可量化的剩余风险：一个版本获批并不能消除漏检病变风险，也不能替代对后续版本的验证。公开市场披露是另一项观察点。Freenome 宣布已完成业务合并，但
              Morningstar 称该股票没有正式分析师覆盖，多个公开资料页面的员工或公司状态字段也不一致。因此，登记表将当前监管状态视为部分有证据支持，并将法律、隐私和安全状况视为尚未核实，而不是视为没有事故。
