    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Freenome 总部位于加州 Brisbane，成立于 2014 年。公司所述业务是用血液筛查检测实现癌症早筛：其 Personalized Cancer Detection
              方法把多组学血液检测、数字化工作流和纵向数据结合起来。平台分析循环游离 DNA 的甲基化模式及其他生物标志物；产品战略覆盖结直肠癌、肺癌，以及其他单癌种和多癌种适应症。2026 年 7
              月完成交易后，Freenome 以 FRNM 上市交易，但上市身份本身不能证明商业规模、经常性收入或客户采用。
            claimRefs:
