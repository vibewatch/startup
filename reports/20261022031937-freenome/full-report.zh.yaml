  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现先靠里程碑，而非已验证的经常性模式
        blocks:
          - type: paragraph
            body: >-
              最明确的财务事件是合同性而非经常性收入：Freenome 2026 年 7 月 SEC 文件称，SimpleScreen CRC 获得 FDA 批准后，Abbott 触发了一笔 $100M
              里程碑付款。文件还称，Abbott 将在美国独家商业化该检测，利用其医疗服务提供者、报销、患者支持和结直肠癌基础设施。这种安排可以减少 Freenome
              建设完整直销渠道的需要，但会把经济性和执行转向一家合作伙伴，而经审阅文件没有披露其经常性付款公式。一份独立行业报道描述更新版检测对应 $70M 里程碑，付款取决于技术转移和 FDA
