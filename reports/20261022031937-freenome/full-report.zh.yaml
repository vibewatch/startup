  - id: FI001
    title: 收入模型桥接：从已披露事件到未披露的经常性经济性
    type: flow
    summary: 公开信息链条已走到审批里程碑和 Abbott 渠道，但单次检测收入与毛利步骤仍未披露。
    data:
      nodes:
        - id: development
          label: 临床与平台开发
          detail: 消耗资本的活动；当前支出不可得。
        - id: validation
          label: 临床验证与技术转移
          detail: 支持审批，并对应一笔另行报告的有条件里程碑款。
        - id: approval
          label: FDA 批准
          detail: SimpleScreen CRC 于 2026 年 7 月 27 日宣布获批。
        - id: milestone
          label: $100M Abbott 里程碑款
          detail: 由 FDA 批准触发的一次性付款。
        - id: commercial-channel
          label: Abbott 美国商业化
          detail: 使用 Abbott 医疗服务提供方和报销基础设施的独家渠道。
        - id: test-utilization
          label: 已完成且获得报销的检测
          detail: 规模、标价、实际价格和回款滞后均不可得。
        - id: freenome-economics
          label: Freenome 经常性经济性
          detail: 转移价格、特许权使用费、利润分成和最低承诺均不可得。
        - id: gross-profit
          label: 毛利贡献
          detail: 没有经常性经济性和检测层面的成本，无法计算。
    approximationNotes: 仅展示有序的概念流程；未获得的经常性经济性没有赋予数值，也没有推导转化率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI013
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Freenome 的筛查架构覆盖生物测量、计算解读、临床验证和医疗服务提供方交付。
    data:
      layers:
        - label: 生物测量
          detail: 基于血液的分子测量为筛查工作流提供输入层。
          items:
            - label: 游离 DNA 与甲基化
              detail: CRC 筛查描述中使用的血液分子信号。
            - label: 基因组、表观基因组与蛋白质组信号
              detail: CRC 产品描述的多组学输入。
            - label: 自身抗体分析
              detail: 据描述为已收购的 CE-IVD 标记肺部检测能力。
        - label: 计算解读
          detail: 计算方法将生物信号整合进检测模型。
          items:
            - label: 计算生物学
              detail: 为早期检测模型整合生物信号。
            - label: 机器学习模型
              detail: 解读多分析物和甲基化模式。
            - label: 生物标志物发现
              detail: 支持癌症和药物反应研究合作。
        - label: 临床证据
          detail: 前瞻性研究和监管工作体现临床成熟度。
          items:
            - label: 前瞻性 CRC 验证
              detail: PREEMPT CRC 和更新版 SimpleScreen CRC 验证。
            - label: 肺癌与多癌种研究
              detail: PROACT LUNG 和 Vallania 研究项目。
        - label: 监管路径
          detail: 监管申报和合作伙伴技术转移决定常规使用的准备程度。
          items:
            - label: 监管申报
              detail: 首代 CRC 检测所采用的 FDA 路径。
        - label: 实验室与数字化交付
          detail: 实验室和工作流组件把检测接入医疗服务提供方运营。
          items:
            - label: CLIA 实验室处理
              detail: 公司公告称，该实验室正在处理商业样本。
            - label: 数字化资格判断与患者参与
              detail: 据描述，面向 EHR 的工具服务于医疗系统工作流。
        - label: 纵向学习闭环
          detail: 真实世界数据和重复筛查旨在支持产品迭代。
          items:
            - label: 纵向真实世界数据
              detail: PCD 设计为利用结果改进产品，并建立重复筛查基线。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: 筛查路径与尚未量化的持续性闭环
    type: journey-map
    summary: 指定证据支持有序的诊疗路径，但重复使用和经济性仍无法量化。
    data:
      nodes:
        - id: eligibility
          label: 识别符合资格的成年人
          title: Eligibility
          detail: 医疗服务提供方识别符合特定适应症筛查人群的成年人。
          touchpoints:
            - Primary care or screening workflow
            - Risk and guideline criteria
        - id: order
          label: 医疗服务提供方开单
          title: Order
          detail: 当前描述的两项检测都需要医疗服务提供方开单。
          touchpoints:
            - Provider workflow
            - Abbott commercialization channel for CRC
        - id: draw
          label: 单次抽血
          title: Collection
          detail: 当两项筛查都适用时，Freenome 通过一次抽血提供 CRC 和肺癌筛查。
          touchpoints:
            - Routine blood collection
            - Patient consent and access
        - id: analysis
          label: 实验室分析
          title: Processing
          detail: Freenome 称，其 CLIA 实验室正在处理商业样本。
          touchpoints:
            - Laboratory workflow
            - Multiomics and data processing
        - id: follow-up
          label: 按适应症进行后续检查
          title: Follow-up
          detail: CRC 和肺癌结果呈阳性后，分别需要结肠镜检查和低剂量 CT。
          touchpoints:
            - Diagnostic referral
            - Completion tracking
        - id: durability
          label: 重复筛查与学习
          title: Durability
          detail: 纵向数据和重复筛查被提出作为扩展机制，但公开的留存指标缺失。
          touchpoints:
            - Longitudinal real-world data
            - Repeat-order and retention evidence gap
    approximationNotes: 该顺序反映公开描述的工作流；不代表任何环节的转化率、耗时或已验证完成情况。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU007
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 按证据支持的敞口排序的定性矩阵，不赋予未经支持的数值概率。
    data:
      columns:
        - id: impact
          label: 影响
        - id: likelihood-signal
          label: 可能性信号
        - id: mitigation-maturity
          label: 缓释成熟度
        - id: residual-exposure
          label: 剩余敞口
      rows:
        - label: 更新版本监管路径
          values:
            - value: High
            - value: Active submission work
            - value: Partial
            - value: High
        - label: 临床检测局限
          values:
            - value: High
            - value: Observed sensitivity gap
            - value: Partial
            - value: High
        - label: 实验室与商业化扩张
          values:
            - value: High
            - value: Company-disclosed risk
            - value: In progress
            - value: High
        - label: 对 Abbott 商业化的依赖
          values:
            - value: High
            - value: Contract-dependent
            - value: Partial
            - value: High
        - label: 资本充足性
          values:
            - value: High
            - value: Runway undisclosed
            - value: Gross proceeds announced
            - value: Unknown
        - label: 披露与数据质量
          values:
            - value: Medium
            - value: Conflicting public fields
            - value: Developing
            - value: Medium
    approximationNotes: 各类别均为定性判断，并追溯至引用证据；未估算数值化的可能性、损失金额或概率。
    claimRefs:
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 产品证据和公开市场流动性提升了可投资性，但财务和资本结构证据缺失，暂不能认可价格。
    data:
      nodes:
        - id: clinical-proof
          label: 临床与监管证据
          detail: 更新后的 CRC 验证指标和获 FDA 批准的产品支持产品可信度。
        - id: commercial-path
          label: 商业化路径
          detail: Abbott 商业化和双检测产品组合提供了采用路径。
        - id: public-capital
          label: 公开资本渠道
          detail: 2026 年业务合并带来总收益，并确立公开交易地位。
        - id: disclosure-test
          label: 财务披露检验
          detail: 计划中的季度业绩可以揭示现金、亏损、商业活动和资金需求。
        - id: valuation-proof
          label: 估值证据缺失
          detail: 净现金、烧钱、完全摊薄股数、优先权和经审计的经济性尚未得到确认。
        - id: recommendation
          label: 继续研究
          detail: 只有在缺失的输入足以开展企业价值和回报分析后，才重新评估。
      edges:
        - from: clinical-proof
          to: commercial-path
        - from: commercial-path
          to: public-capital
        - from: public-capital
          to: disclosure-test
        - from: disclosure-test
          to: valuation-proof
        - from: valuation-proof
          to: recommendation
    approximationNotes: 该流程是定性的决策链，不编码概率、转化率或数值估值。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
