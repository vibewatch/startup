        title: 管理层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月交易公告列出 Aaron Elliott 为首席执行官、Riley Ennis 为联合创始人兼首席产品官、Linh Le 为首席财务官、Jimmy Lin
              为首席科学官。公告还列出一届由公司管理层、投资人以及诊断或生命科学高管组成的董事会，包括 Ann Costello、Peter Kolchinsky、Deepa Pakianathan、Carole
              Nuechterlein、Randy Scott 和 Douglas
              VanOort。证据显示临床科学、财务、产品和诊断商业化职能均有人覆盖，但无法证明继任梯队深度、留任安排，或产品和监管执行在多大程度上依赖某一位高管。
