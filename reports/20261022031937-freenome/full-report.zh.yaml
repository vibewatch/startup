            body: >-
              相比完全不付款的情景，$100M
              批准里程碑增强了近期融资能力，但没有交割资产负债表、付款时间、经营现金消耗、已承诺临床支出、资本开支、债务义务和交易成本，就无法换算成现金续航。会计亏损不等于现金消耗，公告融资不等于手头现金，交易总价值也不等于净流动性。收入质量同样未定，因为公开记录没有拆分里程碑、合作、服务和未来按次检测的经济性。Abbott
              渠道可能提高销售效率，但 Freenome
