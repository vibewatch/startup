      - number: '1.3'
        title: 融资、上市转型与规模披露
        blocks:
          - type: paragraph
            body: >-
              Freenome 于 2026 年 7 月完成与 Perceptive Capital Solutions 的合并，并以 FRNM 开始交易。公司公告披露交易总募集款约 $310M，其中约 $70M
              来自原信托账户，另有由 Perceptive Advisors 和 RA Capital 领投、已全额承诺的 $240M PIPE。独立报道曾称公司自 2014 年成立以来累计融资超过
              $1.3B，并将计划中的交易描述为 $330M 注资；SEC 文件则确认上市以及 7 月 27 日的 FDA
              公告。这些数字不能混用：总募集款、历史融资和交割后可用现金是不同口径，而指定证据没有披露交割后现金消耗、续航、收入或经核实的员工人数。
