            body: >-
              7 月交易预计带来约 $310M 总募集款，包括原 SPAC 信托的约 $70M 和 $240M
              PIPE。总募集款不等于可用现金、现金消耗或续航，而证据池没有从交易募集款到不受限制流动性的经审计桥接表。Robinhood 快照报告了负的市盈率，但这一市场统计和 LeadIQ
              的收入估算区间都不能替代申报的经营结果。因此，主要论点失效触发器应当可观察：所需更新版检测申报延迟或被拒；现实世界灵敏度、特异度或后续完成度显著差于引用的验证结果；与 Abbott
              的技术转移或商业上市失败；重要合作伙伴流失且无人替代；或流动性低于董事会批准的开发和商业化计划。在投资前，应取得最新申报财务报表、现金承诺、月度消耗、Abbott 和 Roche
              合同、监管往来、质量体系指标、隐私和安全评估，以及诉讼清单。
