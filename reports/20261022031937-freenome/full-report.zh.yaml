        title: 产品系统与成熟度
        blocks:
          - type: paragraph
            body: >-
              Freenome 在建设的是一套筛查系统，而不是单一分析物检测。现有产品描述把标准抽血与基因组、表观基因组、蛋白组、自身抗体和游离 DNA
              信号结合起来，再用计算生物学和机器学习识别癌症相关模式。当前产品组合以结直肠癌和肺癌筛查为中心，并有更广泛的多癌种研究管线。MTEC 列出一个正在进行监管申报的 CRC 产品、一项收购而来的带 CE-IVD
              标志的自身抗体肺部检测、一个面向医疗系统的 SimpleScreen Lung 产品，以及基于 EHR 识别和触达患者的数字医疗工具。这一产品面有可信度，但其中多项成熟度标签仍来自公司或目录，而非独立核实。
