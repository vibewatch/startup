          - type: callout
            title: 以合作伙伴和监管证据作为投资判断门槛
            body: 在将商业化风险视为已缓释前，应要求最新 FDA 往来、Abbott 和 Roche 合同摘要、技术转移里程碑及现实世界质量指标。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“继续研究”，而不是不计价格买入。Seeking Alpha 显示 10 月 21 日收盘价为 $14.01，盘后价格为 $14.26；Robinhood 显示市值
              $1.51B，另一条联合发布的市场信息显示 $1.35B。这些观察证明投资者现在可以给股票定价，但不能证明企业价值或内在价值。Freenome 还报告约 $310M
              总募集款，但总募集款既不是当前可用现金，也不是续航。因此，在辩护估值区间或目标回报前，入场纪律要求先取得经审计现金、消耗、债务、完全摊薄股数和优先权数据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              这条投资论点强于一则商业化前平台故事：指定证据描述了获 FDA 批准的结直肠癌筛查产品、与 Abbott
              的商业化关系、肺癌和结直肠癌双检测组合，以及更新后的临床性能数据。反论点是，在这组来源中，产品证明和商业可用性尚未转化为可审计的收入、利润率、采用或现金续航证据。公司历史上称已筹得超过
              $1.1B，这证明融资能力，而不是手头现金。上市状态提高了披露潜力，但本身并不能解决商业化、稀释或估值风险。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              情景分析必须保留条件性，因为证据不足以支持数值化估值区间。乐观情景要求把监管和合作伙伴里程碑转化为可重复的筛查量、可见的经济性和充足续航，同时避免惩罚性稀释。基准情景假设商业进展存在但财务证明滞后，因此当前市值只是观察值，而不是有依据的锚点。悲观情景由采用疲弱、经营经济性为负、资本需求或估值压缩驱动；Robinhood
              显示的负市盈率和 Morningstar 的溢价标签是警示信号，不能替代经审计的亏损或现金消耗数据。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
