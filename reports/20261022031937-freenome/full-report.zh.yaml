  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场窄于肿瘤诊断或整体癌症医疗。它包括癌症确诊前使用的筛查检测、处理和解读检测所需的实验室及软件，以及识别、开单并跟进符合条件患者所需的医疗服务流程。Freenome
              当前切入点是血液结直肠癌筛查；肺癌筛查和基于风险的多癌种检测属于相邻市场，其监管、证据和报销路径各不相同。治疗、确诊后的监测、筛查阳性后的确认性操作，以及非癌症诊断均不在此边界内。实际替代方案也不只是液体活检竞争者：结肠镜、粪便检测、乳腺摄影、MRI、低剂量
              CT 和不参与筛查，都在争夺患者注意力、医疗服务流程和支付方预算。独立简介页面一贯将 Freenome 描述为癌症早筛公司，但这些面向股票投资者的页面不能验证需求或 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM015
      - number: '2.2'
        title: 多种测算视角，而非单一总市场规模
        blocks:
          - type: paragraph
            body: >-
              Freenome 在申报文件中估算美国合计机会约为 $50B，但明确称其为内部市场测算，而非收入预测。测算把预计 120M 名符合结直肠癌筛查条件的人群、与其他癌症适应症人群的假定重叠，以及拟议的 $509
              Medicare 多癌种报销基准结合起来。每项输入都有不确定性，而且公司在该估算涉及的非结直肠癌适应症上还没有商业化产品。更窄的需求视角有参考价值，但不能互换：Freenome 估计仍有 40-50M
              人未接受结直肠癌筛查；MedCity 报道某位分析师认为约 11M 名平均风险人群愿意接受血液检测但不愿做结肠镜；申报文件则识别出 14-15M 名符合指南的高风险肺癌患者，而实际筛查参与率仅为
              10-15%。这些是相互重叠的人群，不是年度检测量或收入。因此，在地理范围、适应症、报销、价格、复检频率和转化率得到共同证据支持前，可靠的 SAM 和 SOM 仍无法确定。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM016
      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              患者是检测用户，但采用由医疗服务提供者推动、受支付方约束。基层和专科医生识别适用人群并开单筛查；医疗系统和实验室负责采样、处理、电子病历整合及后续跟进；商业保险公司、Medicare、Medicaid、雇主或患者承担交易费用。Freenome
              的 Personalized Cancer Detection 模型还加入了用于识别合资格患者并提供符合指南筛查的数字工具，使工作流整合成为产品的一部分，而不是附属功能。分销可以加快这一路径：申报文件称
              Exact Sciences 的基础设施覆盖超过 26 万名医疗服务提供者、数百个医疗系统，以及数百万人未完成粪便检测的人群。不过，Freenome
              也披露，公司尚未为自身独立取得商业支付方合同、覆盖决定或签约支付费率。因此，预算负责人和经济买方会随渠道变化，临床开单本身并不能证明已产生付款。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动是筛查参与率不足：常规抽血或可减少操作摩擦，而通用检测和整合工作流可能让一次医疗服务互动覆盖多项指南定义的风险。公司发布的公告强调结直肠癌筛查、肺癌、其他适应症、数字导航和商业基础设施投入。这些公告证明的是战略，而非独立的采用证据。约束同样重大。即便获得监管授权，Medicare
              对预防性服务的处理、逐家支付方签约、编码、证据要求和后续跟进成本，也可能推迟覆盖。MedCity 报道 Guardant 的 Shield 具有先发优势，预计在报道所述年度检测量超过 8 万次，这给了现有玩家在
              Freenome 推进后续版本时继续改进的时间。就估值而言，在没有实际订单、已支付理赔（claims）、重复使用、合作伙伴经济性和毛利证据前，既不能把符合筛查条件的人群，也不能把内部 TAM 直接资本化为收入。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 内部 TAM 不是收入预测
            body: 约 $50B 的估算包含人群重叠、未来报销、监管批准和商业化假设，而这些假设尚未全部实现。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: 工作流和付款决定可服务市场
            body: 医疗服务提供者覆盖面和患者资格可以带来线索，但签约覆盖、已支付理赔（claims）和完成筛查才决定可触达的商业需求。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不限于血液检测开发商。Guardant Shield 是直接的血液检测同业，并率先占据该品类首个 FDA 批准的初筛位置。Abbott 和 Exact Sciences 借助 Cologuard
              这一现有粪便检测产品获得渠道力量，而结肠镜和其他粪便检测仍是根深蒂固的替代方案。血液检测部分依靠触达排斥既有流程的人群来竞争，因此筛查延迟或漏筛这一现状本身也是现实替代方案。医疗机构自建的触达、转诊、实验室和数据流程属于内部建设替代方案，但指定证据无法证明其成本。多癌种进入者具有战略相关性，但这组来源不足以支持完整的进入者排名。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: 性能、监管与信任
        blocks:
          - type: paragraph
            body: >-
              FDA 批准为第一版 SimpleScreen CRC 提供了明确的信任锚点，但并不意味着所有后续版本结果都属于获批标签。申报的性能为：结直肠癌灵敏度 81.1%、晚期癌前病变灵敏度
              13.7%、晚期结直肠肿瘤特异度 90.4%。另一组更新版检测证据在验证研究中报告结直肠癌灵敏度 80.4%、晚期病变灵敏度 18.2%；一份规模更小的病例对照发布则报告在 90% 特异度下分别为 85% 和
              22%。这些队列和终点不能视为可互换。更新版可能提高癌前病变检出率，但要形成持久差异化，仍需监管衔接，并与 Guardant、粪便检测和结肠镜进行同口径比较。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
      - number: '3.3'
        title: 分销力量、准入与控制权
        blocks:
          - type: paragraph
            body: >-
              Freenome 选择借助合作伙伴杠杆，而不是完全自有分销。Abbott 对 SimpleScreen CRC 负有美国独家商业化责任，FDA 批准据报道触发了 $100M 里程碑付款。Roche
              持有去中心化“kitted”检测的美国以外独家权利，而 Freenome
              保留约定的集中式和美国权利。这些关系可以加快医疗服务提供者准入、报销工作、技术转移和国际拓展，但也把客户归属和上市路径经济性交给合作伙伴。Abbott 的 Cologuard
              地位带来一个尤其重要的双重角色：该合作伙伴既能提供现有粪便检测产品，也能提供 Freenome 的血液检测。这种组合广度可能扩大筛查选择，同时限制 Freenome 独立掌控渠道的能力。
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: 壁垒持久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Freenome
              的防御力依靠受监管的临床证据、检测迭代、数据学习和合作伙伴准入，而不是已被证明的合同锁定。转换摩擦可能来自经验证的工作流、报销、实验室转移、医疗服务提供者整合和纵向数据，但指定来源没有披露客户合同或实际定价。Guardant
              已报道的先发使用量带来商业学习和迭代时间，使其能在 Freenome 更新版完成自身监管路径前改进下一版检测。反过来，Freenome 更好的病变检出能力以及 Abbott/Roche
              渠道也可能缩小差距。因此，负面情景取决于执行：更好的同业版本、合作伙伴议价能力不足、报销薄弱或医疗服务提供者采用缓慢，都可能在 Freenome 证明自有数据优势前把检测商品化。
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管证明加规模化合作伙伴
            body: FDA 批准消除了首款产品的一项重大风险；Abbott 和 Roche 则提供了 Freenome 原本需要自行建设的美国及部分美国以外市场路径。
            calloutType: strength
            claimRefs:
