              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              Freenome
              已经上市交易，因此相关退出问题是流动性质量和价值实现，而不是是否存在上市路径。下一次计划中的财务披露，是用现金、经营亏损、商业活动和资本需求检验投资论点的近期机会。在上调建议前，尽调应对账股数和期权、净现金、债务、PIPE
              条款、历史优先权、里程碑义务、产品量、定价、报销、毛利率和季度消耗。投资论点失效触发器包括商业转化未达预期、续航明显缩短、以稀释性条款融资，或有证据表明当前价格已计入报告结果并不支持的采用水平。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 在已披露财务和完全摊薄资本结构能够支持现金调整后估值及下行情景前，维持“继续研究”立场；产品质量本身不能证明入场价格有吸引力。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV016
