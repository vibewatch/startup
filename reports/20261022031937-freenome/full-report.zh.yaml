  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 观察视角
      - 基于证据的论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 监管和临床进展已经带来一款面向市场的结直肠癌筛查方案，而不只是研究管线。
        - 据报道的商业量、报销情况和重复下单会增强这一判断。
      - - 投资逻辑
        - Abbott 的商业化以及有条件的 $70 million 里程碑款，可能降低上市推广负担。
        - 合作伙伴执行不力或经济条件不利，会削弱这一好处。
      - - 投资逻辑
        - 肺癌检测和打包的结直肠癌方案，让产品覆盖面超越单一适应症。
        - 仍需前瞻性真实世界结果和采用证据，才能验证组合杠杆。
      - - 反向逻辑
        - 超过 $1.1 billion 的历史融资并不能说明当前流动性或资本效率。
        - 经审计的现金、季度烧钱和多年现金跑道可以缓解这一担忧。
      - - 反向逻辑
        - 进入公开市场能带来流动性，但在经济性得到验证前，也会让股权面临摊薄和估值倍数压缩。
        - 完全摊薄后的资本结构，以及利润率改善下持续增长的商业表现，会改变判断。
    notes: 该表将产品和融资证据与尚未解决的经营经济性分开；公司自述不被视为采用率或价值的独立验证。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 商业筛查量通过 Abbott 扩大；肺癌产品带来新增需求；据报道经济性改善；现金跑道充足。
        - 上行空间需要证据证明，增长和现金经济性足以支撑相对于观察市值的溢价。
        - 采用率、报销、执行和摊薄。
        - 指定证据无法量化；需要已报告的商业和财务结果。
      - - 基准
        - 产品发布持续推进，但财务证明和产品组合扩展需要多个报告期。
        - 由于净现金、烧钱、股数和经营结果均不可得，暂不下估值结论。
        - 披露延迟、采用率不均和融资需求。
        - 与当前记录中证据混杂、估值输入缺失的情况最一致。
      - - 悲观
        - 采用率不及预期、亏损持续、现金需求加速，或融资造成重大摊薄。
        - 下行来自估值倍数压缩和现金调整后价值下降；无法支持精确底价。
        - 经营经济性为负、商业化失败和摊薄。
        - Morningstar 的溢价标签和 Robinhood 显示的负 P/E 是警示信号，不是概率估计。
    notes: 由于指定证据缺少经审计的收入、亏损、现金、债务、完全摊薄股数、烧钱和优先权条款，情景仅作定性分析；未臆造概率或估值区间。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV016
