companyProfile:
  summary: >-
    Freenome is a Brisbane, California-based diagnostics company founded in 2014 that develops blood-based
    cancer-screening tests from multiomics and machine-learning analysis. It became publicly traded in July 2026 and
    received FDA approval for SimpleScreen CRC, while the available evidence still leaves commercial scale, recurring
    revenue, runway, and the broader multi-cancer portfolio's economics unresolved.
