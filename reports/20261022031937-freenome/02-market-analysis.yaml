      - [Lung eligibility and uptake, "2026 filing; United States", "14-15M eligible; 10-15% screening rate", "Guideline-eligible high-risk population and reported national adherence", medium, "Current LDCT participation does not establish blood-test conversion"]
    notes: "Values use different denominators and methods and must not be summed; no retained source supplied a CAGR, payer-qualified SAM, or Freenome SOM."
    claimRefs: [CM003, CM004, CM006, CM007, CM008]
  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns: [Segment, Buyer or budget owner, User, Payer, Workflow, Adoption trigger]
    rows:
      - [Average-risk CRC screening, "Primary-care practice or health system", "Screening-eligible adult", "Commercial insurer, Medicare pathway, employer, or patient", "Identify eligibility, order blood draw, route result, manage follow-up", "Guideline fit, coverage, and lower procedural burden"]
      - [Health-system population screening, "Health-system clinical and laboratory leadership", "Attributed patient panel", "Payer contract or system budget", "EHR outreach, collection, laboratory processing, and navigation", "Operational integration and measurable completion gains"]
      - [High-risk lung screening, "Primary-care or pulmonary program", "Guideline-eligible current or former smoker", "Payer or patient", "Risk qualification, blood test, and confirmatory pathway", "Evidence that blood testing improves low screening participation"]
      - [Risk-based multi-cancer screening, "Provider, health system, or partner channel", "Patient eligible for multiple indications", "Coverage pathway not established", "One draw, multiple classifiers, digital navigation, and follow-up", "Regulatory authorization, clinical utility, and reimbursement"]
    notes: "Roles are analytical mappings from the filed workflow; payer terms, test prices, partner economics, and realized adoption were not disclosed in the assigned evidence."
    claimRefs: [CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: U.S. screening-population lenses
    type: bar
    summary: Comparable population counts show the scale of eligibility and participation gaps without presenting them as a revenue funnel.
    data:
      items:
        - label: "CRC screening eligible"
          value: 120
          unit: "million people"
          valueNote: "Company estimate based on guidelines, demographics, and coverage assumptions."
        - label: "CRC eligible and potentially eligible for another indication"
          value: 100.8
          unit: "million people"
          valueNote: "Derived as 84% of 120M; populations overlap."
        - label: "CRC eligible and potentially eligible for 2+ additional indications"
          value: 50.4
          unit: "million people"
          valueNote: "Derived as 42% of 120M; populations overlap."
        - label: "CRC unscreened lower bound"
          value: 40
          unit: "million people"
          valueNote: "Lower bound of the company's 40-50M range."
        - label: "Other-indication eligible outside CRC population"
          value: 17
          unit: "million people"
          valueNote: "Company estimate; not additive to overlapping CRC subgroups."
        - label: "High-risk lung screening eligible lower bound"
          value: 14
          unit: "million people"
          valueNote: "Lower bound of the filing's 14-15M range."
    approximationNotes: "Derived values are simple multiplication of the filing's rounded 120M base by 84% and 42%; range values use lower bounds. Cohorts overlap and are not additive."
    claimRefs: [CM005, CM016]
callouts:
  - calloutType: risk
    title: Internal TAM is not a revenue forecast
    body: The approximately $50 billion estimate embeds population overlap, future reimbursement, regulatory approval, and commercialization assumptions that have not all been realized.
    claimRefs: [CM004, CM005]
  - calloutType: insight
    title: Workflow and payment define the serviceable market
    body: Provider reach and patient eligibility can create leads, but contracted coverage, paid claims, and completed screening determine addressable commercial demand.
    claimRefs: [CM009, CM010, CM011]
