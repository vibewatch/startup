company:
  name: Freenome
chapter:
  number: 2
  title: Market Analysis
  summary: Freenome's near-term market is U.S. blood-based colorectal-cancer screening, with broader personalized multi-cancer screening remaining an expansion thesis rather than a proven serviceable market. The filing's approximately $50 billion internal TAM is highly assumption-sensitive, while payer coverage, workflow adoption, and incumbent execution govern conversion into realized demand.
sections:
  - id: market-boundary
    title: Market boundary and status-quo alternatives
    body: >-
      The investable market is narrower than oncology diagnostics or total cancer care. It
      includes screening tests used before a cancer diagnosis, the laboratory and software
      required to process and interpret them, and the provider workflow needed to identify,
      order, and follow up with eligible patients. Freenome's immediate wedge is blood-based
      colorectal-cancer screening; lung screening and risk-based multi-cancer panels are
      adjacencies whose regulatory, evidence, and reimbursement pathways differ. Treatment,
      surveillance after diagnosis, confirmatory procedures after a positive screen, and
      non-cancer diagnostics sit outside this boundary. The practical alternatives are also
      broader than liquid-biopsy competitors: colonoscopy, stool testing, mammography, MRI,
      low-dose CT, and non-participation each compete for patient attention, provider workflow,
      and payer budget. Independent profile pages consistently describe Freenome as an early
      cancer-detection company, but those equity-oriented pages do not validate demand or TAM.
    claimRefs: [CM001, CM002, CM015]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses, not one headline TAM
    body: >-
      Freenome's filing estimates a collective U.S. opportunity of approximately $50 billion,
      but explicitly labels it an internal market-sizing exercise rather than projected
      revenue. Its mechanics combine an estimated 120 million people eligible for colorectal
      screening, assumed overlap with eligibility for additional cancer indications, and a
      proposed $509 Medicare multi-cancer reimbursement benchmark. Each input is uncertain,
      and the company has no commercial products for the non-colorectal indications embedded
      in that estimate. More constrained demand lenses are useful but not interchangeable:
      Freenome estimates 40-50 million people remain unscreened for colorectal cancer; MedCity
      reports an analyst view that about 11 million average-risk people would accept a blood
      test but not colonoscopy; and the filing identifies 14-15 million guideline-eligible
      high-risk lung patients with only 10-15% screening participation. These are overlapping
      populations, not annual tests or revenue. A defensible SAM and SOM therefore remain open
      until geography, indication, reimbursement, price, repeat cadence, and conversion are
      jointly evidenced.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-payer-path
    title: Buyer, user, payer, and adoption path
    body: >-
      The patient is the test user, but adoption is provider-led and payer-constrained.
      Primary-care and specialist clinicians identify eligibility and order screening; health
      systems and laboratories implement collection, processing, electronic-record integration,
      and follow-up; commercial insurers, Medicare, Medicaid, employers, or patients fund the
      transaction. Freenome's Personalized Cancer Detection model adds digital tools intended
      to identify eligible patients and deliver guideline-based screening, making workflow
      integration part of the product rather than an accessory. Distribution can accelerate
      that path: the filing describes Exact Sciences infrastructure reaching more than 260,000
      providers, hundreds of health systems, and millions of people who had not completed
      stool-based testing. However, Freenome also disclosed that it had not independently
      secured commercial payer contracts, coverage decisions, or contracted payment rates for
      its own account. The budget owner and economic buyer therefore vary by channel, and a
      clinical order does not itself establish payment.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: growth-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      The strongest demand driver is unmet screening participation: a routine blood draw may
      reduce procedural friction, while a common assay and integrated workflow could let one
      provider interaction address several guideline-defined risks. Company-issued releases
      emphasize colorectal screening, lung cancer, additional indications, digital navigation,
      and investment in commercial infrastructure. Those releases establish strategy, not
      independent adoption proof. The constraints are equally material. Medicare treatment of
      preventive services, payer-by-payer contracting, coding, evidence requirements, and
      follow-up costs can delay coverage even after regulatory authorization. MedCity reports
      that Guardant's Shield had first-mover advantage and was projected to exceed 80,000 tests
      in the cited year, giving an incumbent time to improve while Freenome advances later
      versions. For valuation, neither screening-eligible populations nor the internal TAM
      should be capitalized as revenue without observed orders, paid claims, repeat utilization,
      partner economics, and gross-margin evidence.
    claimRefs: [CM009, CM010, CM013, CM014]
