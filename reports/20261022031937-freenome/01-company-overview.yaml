callouts:
  - calloutType: strength
    title: Regulatory and commercialization inflection
    body: FDA approval and an exclusive Abbott commercialization arrangement create a concrete route from clinical validation to a reimbursable colorectal-cancer screening product, although launch performance is not yet evidenced.
    claimRefs: [CO014, CO016]
  - calloutType: risk
    title: Scale and financing visibility remain limited
    body: The assigned evidence reports large historical and transaction funding figures but does not establish recurring revenue, current cash, burn rate, runway, or verified headcount; those gaps limit assessment of financial durability.
    claimRefs: [CO008, CO010, CO011, CO012]

