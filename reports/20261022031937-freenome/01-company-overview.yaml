company:
  name: Freenome
chapter:
  number: 1
  title: Company Overview
  summary: Freenome is a Brisbane, California-based blood-based cancer-screening company that became publicly traded in July 2026 after a Perceptive Capital Solutions business combination. Its first commercial milestone is FDA approval of SimpleScreen CRC, but public evidence remains incomplete on recurring revenue, cash runway, employee scale, and the economics of the broader multi-cancer portfolio.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Freenome is headquartered in Brisbane, California and was founded in 2014. Its stated business is early cancer detection through blood-based screening tests: the company describes a Personalized Cancer Detection approach that combines multiomic blood tests with digital workflow and longitudinal data. The platform analyzes circulating cell-free DNA methylation patterns alongside additional biomarkers, while the company’s product strategy spans colorectal cancer, lung cancer, and additional single- and multi-cancer indications. Following its July 2026 transaction, Freenome is publicly traded under FRNM, but public-company status by itself does not establish commercial scale, recurring revenue, or customer adoption.
    claimRefs: [CO001, CO002, CO003, CO009]
    tableRefs: [TO001]
  - id: leadership-governance-and-dependence
    title: Leadership, governance, and key-person dependence
    body: The July 2026 transaction announcement names Aaron Elliott as chief executive officer, Riley Ennis as co-founder and chief product officer, Linh Le as chief financial officer, and Jimmy Lin as chief scientific officer. It also lists a board that combines company leadership with investors and diagnostics or life-sciences executives, including Ann Costello, Peter Kolchinsky, Deepa Pakianathan, Carole Nuechterlein, Randy Scott, and Douglas VanOort. The evidence shows functional coverage across clinical science, finance, product, and diagnostics commercialization, but it does not establish succession depth, retention arrangements, or the extent to which product and regulatory execution depends on any one executive.
    claimRefs: [CO004, CO005]
    tableRefs: [TO002]
  - id: financing-and-public-transition
    title: Financing, public transition, and scale disclosures
    body: >-
      Freenome closed its combination with Perceptive Capital Solutions in July 2026 and began trading under FRNM. The company announcement reports approximately $310 million of gross proceeds, composed of approximately $70 million from the former trust account and a fully committed $240 million PIPE led by Perceptive Advisors and RA Capital. Independent reporting had described more than $1.3 billion raised since the 2014 founding and the planned transaction as a $330 million infusion, while the SEC filing confirms the public listing and the July 27 FDA announcement. These figures are not interchangeable: gross proceeds, historical funding, and cash available after closing are different measures, and the assigned evidence does not disclose post-close cash burn, runway, revenue, or a verified headcount.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Product, regulatory, and commercial milestones
    body: Freenome’s milestone path moved from its 2014 founding to public-market access in 2026 and FDA approval of SimpleScreen CRC for average-risk adults aged 45 and older. The SEC-furnished release reports the approved test’s PREEMPT CRC analysis at 81.1% colorectal-cancer sensitivity, 13.7% advanced-precancerous-lesion sensitivity, and 90.4% specificity for advanced colorectal neoplasia. Clinical Lab Products separately reports updated-test results of 80.4%, 18.2%, and 90%, respectively; the versions and analyses should not be conflated. Abbott is to commercialize the approved test in the United States, while realized volume, recurring revenue, cash runway, and broader regulatory submissions remain open.
    claimRefs: [CO001, CO007, CO008, CO009, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]

