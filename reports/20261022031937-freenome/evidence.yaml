evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Audited recurring revenue, current cash, burn rate, debt, and post-close runway.
    whyItMatters: Funding and transaction proceeds do not establish operating durability or available cash.
    diligencePath: Obtain the latest public financial statements, cash-flow forecast, debt schedule, and board-approved runway case.
    relatedQuestionRefs:
      - QO005
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: operating-scale
    missingEvidence: Verified current headcount, customer count, locations, and commercial test volume.
    whyItMatters: Scale and adoption cannot be inferred from partnerships or a public listing.
    diligencePath: Request a dated operating KPI pack reconciling employees, customers, tests, and active sites.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive biographies, succession coverage, retention arrangements, and current committee assignments.
    whyItMatters: Named roles do not establish leadership depth, continuity, or independent governance coverage.
    diligencePath: Obtain the current proxy, committee charters, employment agreements, and board-approved succession plan.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: >-
      Independent current review of litigation, regulatory enforcement, outages, recalls, and material leadership
      changes.
    whyItMatters: The assigned adverse evidence is limited and does not establish a complete incident record.
    diligencePath: >-
      Run a current legal, regulatory, product-safety, and executive-change search and obtain management
      representations.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: >-
      A reconciled capitalization and funding schedule separating historical raises, PIPE proceeds, trust proceeds,
      partner payments, and cash on hand.
    whyItMatters: The reported $1.3 billion historical raise and $310-$330 million transaction descriptions use different bases.
    diligencePath: >-
      Tie each financing and partner payment to audited statements, cap table records, and transaction closing
      documents.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      A payer-qualified SAM and a Freenome SOM using observed price, coverage, order conversion, repeat cadence, partner
      economics, and realized utilization.
    whyItMatters: >-
      Population eligibility and internal TAM cannot be converted into revenue timing or market share without commercial
      evidence.
    diligencePath: >-
      Obtain payer contracts and policies, paid-claim data, launch pricing, partner economics, completed-order cohorts,
      repeat-screening behavior, and channel-specific conversion.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent reconciliation of the $40B current-spend lens, the $50B internal TAM, the 11M willingness cohort, and
      overlapping screening-eligible populations.
    whyItMatters: >-
      The retained estimates use different units, periods, populations, and assumptions and cannot be treated as a
      single market forecast.
    diligencePath: >-
      Commission a bottom-up model by indication and geography using current guidelines, payer policy, price, annual
      cadence, and observed modality conversion.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing and reimbursement
    missingEvidence: >-
      Comparable list and realized prices, payer coverage, reimbursement terms, discounts, test volumes, and
      contribution margins.
    whyItMatters: >-
      Transaction milestones do not show buyer willingness to pay, recurring revenue, or economic durability against
      Guardant and established screening.
    diligencePath: >-
      Review payer contracts, claims data, Abbott commercialization terms, realized invoices, volume cohorts, and
      product-level margin schedules.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: head-to-head comparability
    missingEvidence: >-
      Independent, like-for-like performance across current Freenome, Guardant, stool-test, and colonoscopy pathways
      using aligned populations and endpoints.
    whyItMatters: Different versions, cohorts, and modalities make an ordinal competitor ranking misleading.
    diligencePath: >-
      Obtain full protocols, confidence intervals, FDA labels, peer-reviewed datasets, and a prespecified comparative
      analysis.
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: entrant and internal-build landscape
    missingEvidence: >-
      An exhaustive current roster of multi-cancer entrants plus quantified provider internal-build and status-quo
      workflows.
    whyItMatters: Unmapped entrants or internal workflows could weaken apparent differentiation and alter channel bargaining power.
    diligencePath: >-
      Build a regulator-verified product roster and interview health-system screening, laboratory, procurement, and
      population-health leaders.
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: updated-version regulatory bridge
    missingEvidence: >-
      FDA correspondence, submission timing, final label, and confirmatory evidence for the updated SimpleScreen CRC
      version.
    whyItMatters: Updated performance cannot support commercial parity until its regulatory status and approved claims are clear.
    diligencePath: >-
      Review the supplemental PMA package, FDA questions, final decision documents, technology-transfer validation, and
      launch plan.
  - type: private-evidence-only
    severity: material
    topic: pricing and reimbursement
    missingEvidence: >-
      SimpleScreen CRC list price, contracted payer rates, realized reimbursement, discounts, denial rates, and
      collection lag.
    whyItMatters: Without realized net price, neither revenue per test nor adoption elasticity can be underwritten.
    diligencePath: Request payer contracts, launch price schedules, patient-assistance terms, and management's net-price bridge.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current unrestricted cash, restricted cash, debt, monthly operating cash burn, committed spending, transaction
      costs, and downside runway.
    whyItMatters: Funding raised and milestone rights do not establish cash available or the date of the next financing need.
    diligencePath: >-
      Request audited post-close balance sheet, monthly cash-flow statements, debt schedule, and scenario-based 24-month
      liquidity model.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: Executed Abbott economics, per-test laboratory and logistics costs, payer mix, bad debt, and volume assumptions.
    whyItMatters: >-
      The recurring gross-margin path cannot be calculated from milestone payments or commercialization responsibility
      alone.
    diligencePath: >-
      Review the executed Abbott agreement and obtain test-level contribution-margin cohorts by payer and monthly
      volume.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: reported revenue
    missingEvidence: >-
      Audited reconciliation of the $34.24 million, roughly $35 million, and $0 public revenue presentations by period
      and revenue stream.
    whyItMatters: A conflicting baseline prevents assessment of revenue quality, growth, and valuation multiples.
    diligencePath: >-
      Obtain filed quarterly financial statements and management's revenue-recognition and pro forma consolidation
      bridge.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI003
  - type: access-blocked
    severity: material
    topic: trust-safety-security
    missingEvidence: >-
      Public evidence of cybersecurity controls, privacy governance, model monitoring, assay failure rates, turnaround
      times, and post-market quality surveillance.
    whyItMatters: >-
      Screening products affect clinical decisions, and the assigned sources describe capabilities without providing
      operational safety or reliability denominators.
    diligencePath: >-
      Request the quality-management system, security attestations, validation protocols, model-monitoring plan,
      complaint history, and laboratory quality metrics.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: product-readiness
    missingEvidence: >-
      Independent confirmation of current FDA status, commercial availability, payer workflow, and real-world adoption
      for each SimpleScreen product.
    whyItMatters: >-
      Company and syndicated descriptions establish intended positioning but do not independently prove regulatory
      scope, deployment scale, or durable clinical utility.
    diligencePath: >-
      Obtain current FDA records, CLIA laboratory documentation, partner commercialization milestones, payer coverage
      evidence, and provider utilization data.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public engineering repositories, package activity, technical operating history, practitioner discussion, or an
      equivalent independent developer-signal proxy.
    whyItMatters: >-
      The assigned evidence shows product claims and clinical milestones but does not demonstrate software release
      cadence, engineering participation, service reliability, or practitioner adoption.
    diligencePath: >-
      Request engineering release history and reliability records, then corroborate them through public repositories,
      technical talks, integration-partner evidence, or practitioner-community discussion.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: >-
      Account- and patient-level cohorts showing paid starts, repeat orders, renewals, churn, follow-up completion, and
      revenue by channel.
    whyItMatters: Regulatory approval and channel launch do not establish durable demand, retention, or customer economics.
    diligencePath: >-
      Request monthly account, order, patient, and revenue cohorts by indication and channel, including cancellations,
      follow-up completion, repeat screening, and retention definitions.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Payer coverage decisions, reimbursement receipts, list and net pricing, patient out-of-pocket exposure, and
      provider procurement terms.
    whyItMatters: >-
      Coverage eligibility in a company filing is not evidence of paid claims, affordability, or sustainable unit
      economics.
    diligencePath: >-
      Obtain payer policies, adjudicated claims, denial rates, net realized price, patient-assistance use, and signed
      provider procurement terms.
    relatedQuestionRefs:
      - QU001
      - QU005
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
