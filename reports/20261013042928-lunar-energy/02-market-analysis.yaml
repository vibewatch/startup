callouts:
  - calloutType: insight
    title: Customer Value Is Program-Specific, Not a Universal Payback
    body: Lunar's reported $464 average VPP earnings and $338 average incremental optimization savings are separate 2025 observations. Without cohort, tariff, geography, hardware-price, financing, or persistence data, they should not be summed into a universal annual return or used to derive a payback period.
    claimRefs:
      - CM007
      - CM008
  - calloutType: risk
    title: Adoption Depends on Local Programs and Trusted Financing
    body: Lunar's own materials state that VPP access depends on location and compatible hardware, and its executive interview warns about third-party-ownership failures. Program eligibility, bill impact, customer control, installer execution, and finance-counterparty durability therefore require market-by-market diligence.
    claimRefs:
      - CM009
      - CM010
      - CM014
      - CM015
      - CM016
