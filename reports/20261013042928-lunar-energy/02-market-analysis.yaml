company:
  name: Lunar Energy
chapter:
  number: 2
  title: Market Analysis
  summary: Lunar Energy addresses a coupled residential-storage and distributed-energy orchestration market rather than a single homogeneous category. The available evidence shows commercial scale and customer-value signals, but it does not establish a defensible dollar TAM, SAM, or SOM; locality, hardware eligibility, customer trust, and financing quality remain material adoption constraints.
sections:
  - id: market-boundary
    title: Market Boundary and Status-Quo Alternatives
    body: |
      Lunar's relevant market has two linked layers. The first is behind-the-meter residential hardware: modular batteries, solar optimization, an inverter, and home electrical controls. The second is Gridshare software, which coordinates batteries and other flexible devices for utilities, community choice aggregators, energy retailers, and other fleet operators. This analysis therefore includes spending on integrated home-energy hardware, installation and commissioning, device management, customer enrollment, fleet monitoring, optimization, and VPP dispatch. It excludes front-of-the-meter utility-scale storage, generation assets, transmission infrastructure, and standalone rooftop solar that is not paired with storage or controllable loads.

      The status quo is not only another battery brand. A homeowner can remain on ordinary grid service, use solar without storage, install a backup-only system, or decline VPP enrollment. A utility or aggregator can operate separate device-specific systems rather than a multi-device platform. Lunar says Gridshare can combine batteries, EVs and chargers, thermostats, and hot-water heaters from different manufacturers. That breadth expands the software opportunity beyond Lunar hardware, but the source pool does not quantify revenue by hardware, software, or grid-services activity.
    claimRefs:
      - CM001
      - CM002
      - CM003
    tableRefs:
      - TM001
  - id: sizing-and-economics
    title: Evidence-Constrained Sizing and Customer Economics
    body: |
      The available sources support several sizing lenses, none of which is a dollar market size. Mercom reports that venture funding across the entire energy-storage sector reached $4.8 billion in 2025 across 75 deals, up 30% from $3.7 billion across 84 deals in 2024. That measures capital formation across a broader sector, not residential demand. Lunar separately claims 650 MW of devices under management across multiple continents and thousands of systems deployed in California during its first year of commercialization. Those figures indicate operating reach, but neither discloses device mix, paid software seats, contracted capacity, revenue, or the addressable population.

      Customer economics provide a narrower adoption lens. Lunar reported that participating customers earned an average of $464 from VPP programs in 2025, while Lunar System owners saved an average of $338 more with its optimization than under standard battery self-consumption. These are distinct company-reported benefits and must not be added into a universal annual return: the disclosed sources do not provide cohort size, distribution, geography mix, tax treatment, hardware price, financing cost, or persistence. A defensible TAM/SAM/SOM therefore requires external deployment counts, installed prices, eligible-household counts, program availability, and utility-territory economics.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-and-adoption
    title: Buyers, Budget Ownership, and Adoption Constraints
    body: |
      The buying system is multi-sided. Homeowners use the equipment and may fund it directly or through financing; installers influence product choice and carry implementation risk; utilities, CCAs, and energy retailers sponsor programs or procure orchestration; and fleet operators need monitoring, dispatch, and customer communication. WestLight Energy's announced program illustrates the chain: WestLight owns the program objective, Gridshare is the VPP engine, Haven Energy handles customer recruitment, agreements, and installation contractors, and hardware partners supply batteries. Lunar states that Gridshare's dispatch target is more than 95% of available fleet energy while maintaining a 20% minimum reserve.

      Adoption is local rather than automatic. Lunar's support material says VPP participation is limited to areas with a supported program and requires compatible hardware; it also acknowledges that participation can increase a customer's utility bill, even though Lunar expects program value to offset it. In an industry interview, a Lunar executive framed dynamic rates, evolving market rules, savings, ease, and trust as decisive factors and warned that some third-party ownership providers may fail. These are company perspectives rather than independent forecasts, but they identify diligence priorities: program-level net benefits, opt-out and reserve behavior, installer and finance counterparty quality, regulatory approval, and renewal or retention evidence.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM003
