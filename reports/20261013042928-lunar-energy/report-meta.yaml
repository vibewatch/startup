  topStrengths:
    - Integrated hardware and Gridshare software architecture with real operating deployments.
    - Strong capital access and a deep strategic investor syndicate.
    - Demonstrated customer value from VPP earnings and bill savings.
  topRisks:
    - Opaque unit economics and no disclosed valuation / waterfall terms.
    - Heavy Sunrun, California, and utility-program concentration.
    - Hardware manufacturing, warranty, and channel-execution risk.
  unresolvedGaps:
    - Audited revenue, gross margin, burn, runway, and unit economics by hardware, software, and VPP stream.
    - Series C / D post-money valuation, liquidation preferences, and full cap-table waterfall.
    - >-
      Revenue and managed-capacity concentration by partner, especially Sunrun, utilities, installers, and financing
      channels.
    - Warranty claims, field-failure rates, reserve policy, and service-cost history as deployed volume scales.
    - >-
      Cohort retention, renewal behavior, geographic mix outside California, and evidence that customer economics travel
      beyond the current public proof set.
