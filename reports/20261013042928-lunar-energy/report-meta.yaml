companyProfile:
  summary: >-
    Lunar Energy is a Mountain View-based residential clean energy company that combines modular home battery hardware
    with the Gridshare distributed energy resource management and virtual power plant platform. The business serves
    homeowners, installers, utilities, community choice aggregators, and energy retailers, pairing upfront hardware
    deployments with recurring software and VPP participation revenue. Public evidence shows real operating traction,
    but the company keeps gross margin, burn, and valuation terms largely confidential.
  founders:
