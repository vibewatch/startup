company:
  name: Lunar Energy
chapter:
  number: 4
  title: Financials
  summary: Lunar Energy operates a dual-engine commercial model combining hardware battery sales and leases with its device-agnostic Gridshare software and virtual power plant orchestration platform. While 2026 Series C and D rounds added $232 million to support ongoing deployments and a 150,000-device managed fleet, standalone hardware gross margins, customer acquisition costs, and cash burn remain undisclosed private metrics amid significant installer channel headwinds and extreme Sunrun concentration.
sections:
  - id: revenue-streams-and-pricing-architecture
    title: Revenue Streams and Pricing Architecture
    body: 'Lunar Energy generates revenue across three distinct commercial vectors: transactional hardware sales and leases distributed through certified residential solar installers, recurring enterprise software licensing for its Gridshare distributed energy resource management (DERMS) platform, and performance-based virtual power plant (VPP) grid-services revenue sharing. The Lunar System hardware is distributed through certified installers without transparent list pricing, typically quoting in the tens of thousands of dollars before federal investment tax credits and local rebates. In April 2026, the company expanded downstream into consumer retail electricity bundling through an innovative partnership with Octopus Energy in Texas, offering a 30 kWh battery system for zero dollars down, a forty-five dollar monthly subscription fee, and a fixed eight cents per kilowatt-hour power rate over a three-year contract. While hardware leases and sales provide immediate transactional volume, Gridshare''s software licensing and capacity-dispatch performance fees represent the company''s highest-margin, most scalable recurring cash flows.'
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
    tableRefs:
      - TI001
      - TI002
  - id: cost-structure-and-unit-economics-benchmarks
    title: Cost Structure and Unit Economics Benchmarks
    body: Lunar Energy's cost structure reflects the operational friction of scaling capital-intensive physical hardware alongside asset-light DERMS software. On the consumer side, the company discloses that participating residential battery owners earned an average of 464 dollars through grid-service participation in 2025, alongside 338 dollars in annual household electricity bill savings generated by behind-the-meter automated load shifting. However, core manufacturer-level unit economics—including hardware bill of materials (BOM), contract manufacturing margins, warranty reserve accruals, and fully loaded customer acquisition costs (CAC) across installer channels—remain strictly undisclosed private data. Independent financial analyses indicate that while Gridshare software operates with attractive gross margins, physical battery production operates as a heavy capital drain with substantial balance sheet exposure, competing head-to-head against deep-pocketed incumbents like Tesla and Base Power.
    claimRefs:
      - CI003
      - CI008
      - CI011
    tableRefs:
      - TI003
  - id: commercial-traction-and-vpp-monetization-flow
    title: Commercial Traction and VPP Monetization Flow
    body: Public commercial deployment data reveals a stark divergence between Lunar Energy's physical hardware footprint and its software orchestration reach. The company has deployed approximately 2,000 proprietary battery systems across key United States markets, targeting an expansion to 20,000 units by year-end 2026 and 100,000 units by 2028. In contrast, the Gridshare software platform already coordinates nearly 150,000 distributed energy devices across California, Hawaii, New England, Puerto Rico, and Japan, including approximately 130,000 batteries for residential solar leader Sunrun. Gridshare monetizes this multi-vendor fleet by executing algorithmic relay-race dispatch during peak grid strain events, delivering aggregate capacity relief to utilities and community choice aggregators such as WestLight Energy while capturing performance fees and protecting household backup reserves.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI014
    figureRefs:
      - FI001
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: 'Lunar Energy announced an aggregate 232 million dollars in private capital in February 2026, comprising a previously unannounced 130 million dollar Series C led by Activate Capital and an oversubscribed 102 million dollar Series D co-led by B Capital and Prelude Ventures. Lifetime equity financing now exceeds 500 million dollars, providing medium-term liquidity to support manufacturing expansion and software deployment. However, this balance sheet must absorb heavy capital demands amid severe macro headwinds across the broader residential solar installer ecosystem, where high interest rates, California''s NEM 3.0 export tariff cuts, and SunPower''s 2024 bankruptcy have thinned distributor channels. Furthermore, Lunar Energy faces acute customer concentration risk: Sunrun acts simultaneously as its primary software customer, founding investor, board participant, and potential internal-software competitor, leaving forward revenue visibility vulnerable to channel conflict.'
    claimRefs:
      - CI009
      - CI010
      - CI012
      - CI013
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit of Sale
      - Current Commercial Status
      - Revenue Quality
      - Diligence Requirement
    rows:
      - - Hardware Sales & Leases
        - Direct equipment sales and leasing through certified installers and distribution channels
        - Per battery cabinet (15–30 kWh)
        - Commercialized; ~2,000 systems installed across US key markets
        - Transactional hardware; low gross margin prone to manufacturing ramp costs
        - Unit production cost, average realized selling price, warranty accrual policy
      - - Gridshare VPP Platform Licensing
        - Recurring software licensing to utilities and asset aggregators (DERMS)
        - Per connected device / fleet MW under management
        - Commercialized; dispatches ~130,000 batteries for Sunrun and international fleets
        - High-margin recurring SaaS; sticky integration into utility and installer workflows
        - Contract term, per-device license fee, customer concentration across Sunrun vs others
      - - VPP Grid-Service Revenue Share
        - Share of utility and wholesale market capacity and load-shift performance payments
        - Per participating household ($/year) / MWh dispatched
        - Active; customers earned average ~$464 in 2025 across enrolled programs
        - Performance-dependent; policy and tariff sensitive across regional markets
        - Revenue-share split percentage between Lunar, installer/aggregator, and homeowner
      - - Retail Electricity Subscription Bundles
        - $0-down hardware bundles with fixed monthly fee and flat-rate electricity in deregulated markets
        - Monthly customer subscription ($45/mo) plus power volumetric rate (8¢/kWh)
        - Pilot deployment in Texas via Octopus Energy partnership launched April 2026
        - Hybrid recurring subscription and retail spread; capital-intensive balance sheet exposure
        - Subsidy payback period, customer churn rate, bad debt and wholesale hedging mechanisms
    notes: Data compiled from company disclosures, B Capital investment brief, and Teardown diligence; audited segment revenue breakdown remains undisclosed private data.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / Offering
      - Pricing & Contract Structure
      - List vs. Realized Pricing
      - Discounts, Subsidies & Unknowns
      - Source & Evidence Vintage
    rows:
      - - Lunar System Hardware (15–30 kWh)
        - Quoted through installer network; premium residential storage pricing (tens of thousands installed)
        - List pricing opaque; realized pricing varies widely across regional installers and financing packages
        - Federal ITC / Section 25D tax credits (30%), state SGIP incentives, installer markups undisclosed
        - Teardown deep dive (Aug 2026); installer quote benchmarks
      - - Octopus Energy Texas Plan
        - $0 upfront, $45/month subscription fee, flat 8¢/kWh electricity rate for 3-year term
        - Fixed consumer tariff; realized net margin depends on wholesale ERCOT peak dispatch capture
        - Subsidized hardware capital cost funded through energy retailer balance sheet and grid services
        - Octopus Energy and Teardown public plan disclosure (Apr 2026)
      - - Gridshare Enterprise DERMS
        - Tiered annual enterprise license based on connected devices and aggregated MW capacity
        - Custom negotiated utility contracts; realized pricing per device undisclosed
        - Volume discounts for large asset owners (e.g. Sunrun ~130,000 device fleet); integration setup fees unknown
        - Lunar Enterprise platform and WestLight Energy partnership (2025–2026)
      - - Homeowner VPP Participation
        - Annual incentive payment to enrolled homeowners; ~$464 average customer earnings in 2025
        - Net realized payment to participating households after aggregator and utility administration fees
        - Varies by utility program rules (e.g. WestLight, Hawaiian Electric, CA Connected Solutions)
        - B Capital investment announcement and company VPP disclosures (2025–2026)
    notes: Reflects published commercial terms and independent analyst estimates; exact wholesale margin capture and installer wholesale pricing are confidential.
    claimRefs:
      - CI002
      - CI004
      - CI006
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Reported / Estimated Value
      - Confidence Level
      - Analytical Significance
      - Diligence Requirement
    rows:
      - - Average Annual VPP Homeowner Earnings
        - $464 / year (2025)
        - Medium
        - Core economic driver underpinning customer participation and hardware lease viability
        - Audit sample of customer payouts, distribution of earnings across programs, and seasonal variance
      - - Average Annual Household Bill Savings
        - $338 / year (2025)
        - Medium
        - Measures tangible behind-the-meter value delivered via AI load shifting vs static battery dispatch
        - Methodology for baseline comparison against standard time-of-use tariffs and net metering regimes
      - - Active System Installed Base
        - ~2,000 hardware units (US)
        - Medium
        - Establishes physical commercial deployment scale relative to manufacturing targets
        - State-by-state installation registry verification and warranty activation tracking
      - - Gridshare Connected Device Fleet
        - ~150,000 devices (~130,000 for Sunrun)
        - High
        - Demonstrates software scale and network effect on third-party hardware assets
        - Breakdown by battery OEM, geography (US vs Japan/Europe), and contract expiration schedule
      - - Hardware Gross Margin
        - null
        - Low
        - Critical determinant of hardware cash burn vs self-sustaining profitability
        - BOM teardown, contract manufacturing assembly fees, logistics, and field service warranty reserves
      - - Customer Acquisition Cost (CAC) / Payback
        - null
        - Low
        - Measures sales efficiency across installer channel and retail energy bundle motions
        - Channel commission structure, installer partner co-op marketing spend, and direct customer CAC
    notes: Private company operational metrics; unit margins, CAC, and cash burn metrics are undisclosed private data requiring formal data-room audit.
    claimRefs:
      - CI003
      - CI005
      - CI007
      - CI008
      - CI009
