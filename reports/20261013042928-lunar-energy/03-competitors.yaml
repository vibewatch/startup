callouts:
  - calloutType: "insight"
    title: "Dual Hardware-Software Strategy as a Competitive Wedge"
    body: "Lunar Energy differentiates itself from closed storage OEMs like Tesla and Enphase by combining vertically integrated BESS hardware with an open DERMS platform (Gridshare) capable of orchestrating third-party edge assets. This hybrid approach enables Lunar to target both retail homeowners via installers and wholesale utility programs seeking vendor-agnostic fleet aggregation."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP010"
  - calloutType: "risk"
    title: "Entrenched Installer Channels and Distribution Bottlenecks"
    body: "Scaling residential storage from thousands of pilot units to 100,000 systems requires displacing Tesla and Enphase across thousands of certified solar installation contractors. In the absence of proprietary nationwide installation labor, Lunar remains heavily dependent on anchor channel partner Sunrun and regional solar dealers who already maintain deep incumbent supplier commitments."
    claimRefs:
      - "CP002"
      - "CP007"
      - "CP012"
      - "CP014"
