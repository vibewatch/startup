  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              Lunar's relevant market has two linked layers. The first is behind-the-meter residential hardware: modular
              batteries, solar optimization, an inverter, and home electrical controls. The second is Gridshare
              software, which coordinates batteries and other flexible devices for utilities, community choice
              aggregators, energy retailers, and other fleet operators. This analysis therefore includes spending on
              integrated home-energy hardware, installation and commissioning, device management, customer enrollment,
              fleet monitoring, optimization, and VPP dispatch. It excludes front-of-the-meter utility-scale storage,
              generation assets, transmission infrastructure, and standalone rooftop solar that is not paired with
              storage or controllable loads.


              The status quo is not only another battery brand. A homeowner can remain on ordinary grid service, use
              solar without storage, install a backup-only system, or decline VPP enrollment. A utility or aggregator
              can operate separate device-specific systems rather than a multi-device platform. Lunar says Gridshare can
              combine batteries, EVs and chargers, thermostats, and hot-water heaters from different manufacturers. That
              breadth expands the software opportunity beyond Lunar hardware, but the source pool does not quantify
              revenue by hardware, software, or grid-services activity.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Evidence-Constrained Sizing and Customer Economics
        blocks:
          - type: paragraph
            body: >
              The available sources support several sizing lenses, none of which is a dollar market size. Mercom reports
              that venture funding across the entire energy-storage sector reached $4.8 billion in 2025 across 75 deals,
              up 30% from $3.7 billion across 84 deals in 2024. That measures capital formation across a broader sector,
              not residential demand. Lunar separately claims 650 MW of devices under management across multiple
              continents and thousands of systems deployed in California during its first year of commercialization.
              Those figures indicate operating reach, but neither discloses device mix, paid software seats, contracted
              capacity, revenue, or the addressable population.


              Customer economics provide a narrower adoption lens. Lunar reported that participating customers earned an
              average of $464 from VPP programs in 2025, while Lunar System owners saved an average of $338 more with
              its optimization than under standard battery self-consumption. These are distinct company-reported
              benefits and must not be added into a universal annual return: the disclosed sources do not provide cohort
              size, distribution, geography mix, tax treatment, hardware price, financing cost, or persistence. A
              defensible TAM/SAM/SOM therefore requires external deployment counts, installed prices, eligible-household
              counts, program availability, and utility-territory economics.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
