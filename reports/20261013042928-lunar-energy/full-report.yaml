      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Unified DC Architecture & Dual-Sided Software Platform
            body: >
              Lunar Energy's core technical strength lies in coupling high-efficiency DC power electronics with a proven
              enterprise DERMS platform. By designing proprietary 5 kWh modular battery blocks alongside solar
              Maximizers and smart microgrid switching, Lunar eliminates multi-vendor hardware integration friction for
              residential installers. Concurrently, the Gridshare platform operates across multi-vendor fleets managing
              650 MW of distributed energy assets, generating dual-sided value through behind-the-meter homeowner
              savings and front-of-the-meter utility capacity aggregation.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE009
              - CE014
          - type: callout
            title: Aggressive Hardware Manufacturing Ramp & Multi-Vendor Fleet Exposure
            body: >
              Lunar faces critical technical execution risks as it scales manufacturing from thousands of deployed
              California units to 20,000 units in 2026 and 100,000 units by 2028. Ramping precision hardware assembly
              fivefold within twelve months strains supplier quality controls, battery cell procurement, and field
              warranty reserves. Concurrently, Gridshare's dependence on orchestrating third-party hardware leaves
              enterprise VPP operations exposed to third-party firmware updates, communication latency, and field
              connectivity dropouts that can degrade committed utility dispatch capacity.
            calloutType: risk
            claimRefs:
              - CE006
