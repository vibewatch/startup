              Lunar Energy's capital allocation remains heavily committed to scaling hardware manufacturing toward
              100,000 units by 2028, directly competing against Tesla and Base Power during a severe residential solar
              market slowdown marked by NEM 3.0 export cuts and installer bankruptcies.
            calloutType: risk
            claimRefs:
              - CI005
              - CI011
              - CI012
          - type: callout
            title: Software Agnostic Fleet Advantage
            body: >-
              Gridshare's device-agnostic architecture enables Lunar Energy to capture recurring software and
