      - number: '7.4'
        title: Capital Intensity, Model Risks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Developing proprietary residential hardware alongside cloud DERMS software imposes intense capital demands
              and ongoing working capital friction. Although Lunar secured $232 million across Series C and Series D
              rounds through early 2026, private investment marks attributing a $1 billion valuation establish
              aggressive commercial expectations. If residential battery hardware margins compress amid price
              competition from low-cost incumbent storage vendors, software revenue alone may fail to absorb hardware
              development burn. At the customer level, participating in VPP programs carries electricity bill volatility
              if dynamic utility export remuneration fails to outpace battery degradation and on-peak charging costs,
              increasing customer churn risk. Core thesis-break triggers include sustained utility refusal to adopt
              bi-directional export tariffs, material field warranty failure rates across NMC modules, or Sunrun
              curtailing its Gridshare distribution relationship. Diligence must monitor warranty reserve accounting and
              installer unit economics.
            claimRefs:
              - CR006
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Interconnection and Channel Concentration Define Core Vulnerabilities
            body: >-
              Lunar Energy's growth trajectory is heavily exposed to two interdependent bottlenecks: utility
              interconnection approval cycles for bi-directional battery export tariffs, and commercial concentration in
              early distribution channels such as Sunrun and regional California Community Choice Aggregators. Until
              multi-region utility interconnection standardization and diversified direct installer channels mature,
              localized regulatory friction directly throttles fleet capacity growth.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy presents a compelling core investment thesis built on the structural convergence of
              residential battery storage hardware and distributed grid software. Rather than competing as a pure
              hardware original equipment manufacturer or a detached distributed energy resource management system
              (DERMS) vendor, Lunar vertically integrates modular battery systems with its proprietary Gridshare
              software platform. This architecture creates dual monetization streams: direct hardware sales and leases
              to homeowners alongside recurring virtual power plant (VPP) coordination revenues from utilities and
              Community Choice Aggregators. Real-world operating evidence confirms that participating homeowners earn an
              average of $464 annually from VPP programs while generating an additional $338 in electricity bill savings
              through Lunar AI optimization. However, the anti-thesis highlights severe structural headwinds. Domestic
              manufacturing in Georgia and Washington exposes Lunar to heavy capital expenditure, assembly cost
              inflation, and inventory cycles typical of hardware businesses. Furthermore, while the Gridshare software
              manages 650 MW of distributed capacity, software revenue contributions remain unverified against
              low-margin hardware deployments, and distribution remains heavily concentrated through anchor partners
              like Sunrun.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Lunar Energy announced a massive $232 million financing package that combines a $102
              million Series D round and a previously unannounced $130 million Series C round. The Series D was led by B
              Capital and Prelude Ventures, while Activate Capital spearheaded the Series C, supported by strategic and
              venture participants including Sunrun, SK Group, Itochu Corporation, and DCVC. Legal advisory for the
              transaction was handled by Wilson Sonsini Goodrich & Rosati. Across its financing history, Lunar Energy
              has raised between $530 million and $662 million in cumulative capital, placing it among the most
              well-capitalized private distributed energy players in the United States. Despite this substantial
              capitalization, post-money valuation marks, liquidation preference seniority, and cap-table waterfall
              mechanics remain strictly confidential. The absence of verified post-money valuation metrics creates
              substantial underwriting uncertainty: with hundreds of millions in senior preferred capital in the ground,
              junior equity and common shareholders face severe preference overhang in any non-optimal exit scenario.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Modeling and Valuation Multiples
        blocks:
          - type: paragraph
            body: >-
              Valuing Lunar Energy requires an explicit multi-scenario framework that balances ambitious manufacturing
              expansion against macroeconomic clean energy realities. The company aims to ramp domestic production to
              20,000 units by late 2026 and 100,000 units by 2028, scaling its Gridshare footprint into multiple
              regional transmission organizations. In our bull scenario, achieving this trajectory with software margin
              expansion supports an enterprise value of $1.8B to $2.5B, priced at a 4.0x to 5.0x blended multiple. In
              our base scenario, production ramps steadily toward 20,000 units with continued Sunrun channel dependence,
              anchoring enterprise value between $800M and $1.2B on a 2.5x to 3.0x multiple. In the bear scenario,
              manufacturing bottlenecks in Georgia and Washington combined with broader clean energy funding
              contractions compress valuation to $300M to $500M, triggering preference overhang that severely impairs
              common equity. Broader market data reinforces this caution: while venture capital investment in energy
              storage grew 30 percent in 2025, total corporate storage funding contracted, and high-profile hardware
              failures like European battery manufacturer Northvolt underline the severe valuation penalties inflicted
              on capital-intensive clean-tech producers.
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Final Recommendation and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              We conclude with a research-more recommendation, a high risk rating, and a stretched valuation stance.
              Lunar Energy has built genuine operational credibility, proven by more than 2,000 residential battery
              installations, 650 MW of managed DER capacity, and demonstrated customer annual earnings of $464 from VPP
              participation. Its tier-one venture syndicate provides capital runway to execute its domestic
              manufacturing roadmap. Nevertheless, without audited gross margin accounting across hardware versus
              software, verified partner concentration schedules with Sunrun, and visibility into Series C and Series D
              preference structures, investors cannot underwrite risk-adjusted returns or defend private round marks.
              Prior to capital commitment, diligence must confirm unit gross margin trajectories, non-California utility
              pipeline conversion, and the full preferred liquidation waterfall. Until these private records are
              inspected, entering at current implied private marks risks overpaying for capital-intensive hardware
              assembly without software-grade margin protection.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disciplined Underwriting Required on Private Mark
            body: >-
              While Lunar Energy's $232M financing coalition and 2,000+ deployments establish clear category presence,
              the lack of disclosed post-money valuation and unit gross margins requires investors to treat entry
              multiples as stretched until audited financial statements are reviewed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV014
          - type: callout
            title: Capital Intensity and Preference Overhang
            body: >-
              With over $530M to $662M in total capital raised, the liquidation preference stack represents a material
              hurdle for junior capital in any downside scenario where hardware margins fail to inflect.
            calloutType: risk
            claimRefs:
              - CV004
