      - number: '5.3'
        title: Deployment Scale, Competitive Differentiation, & Technical Risks
        blocks:
          - type: paragraph
            body: >
              Lunar differentiates its technology stack through two primary vectors: hardware ease-of-installation
              paired with DC optimization, and vendor-agnostic software aggregation. Unlike legacy AC-coupled storage
              systems that suffer round-trip conversion losses through redundant inverter stages, Lunar's DC
              architecture maximizes round-trip efficiency while packaging solar optimization and smart switching into
              streamlined, pre-configured enclosures designed to reduce installer commissioning times and field errors.
              Furthermore, Gridshare's fleet management software integrates third-party inverters, batteries, electric
              vehicles, and smart thermostats alongside Lunar's native hardware, positioning the company as an operating
              system for residential energy fleets rather than an isolated hardware vendor. Major channel partners,
              notably Sunrun, leverage Gridshare across regional utility programs in New England, Hawaii, and Puerto
              Rico. However, this hybrid strategy creates substantial product and operational risks. On the hardware
              front, Lunar faces aggressive manufacturing scaling pressure: backed by $232 million in Series C and D
              funding closed in early 2026, the company plans to expand production from thousands of deployed California
              units to 20,000 units by year-end 2026, and 100,000 units annually by 2028. Scaling specialized power
              electronics and battery pack assembly fivefold within twelve months introduces acute supply chain
              vulnerabilities, cell procurement risks, and factory yield challenges. On the software front,
              orchestrating multi-vendor hardware fleets exposes Gridshare to third-party firmware revisions,
              communication dropouts over residential cellular and Wi-Fi networks, and complex cybersecurity surface
              areas across public API and Model Context Protocol (MCP) endpoints.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
