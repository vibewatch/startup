  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Interconnection, and Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Distributed virtual power plant deployment velocity is fundamentally constrained by state public utility
              commission regulations and local electric distribution company (EDC) interconnection tariffs. In
              regulatory dockets such as New Jersey BPU Docket QO26030099, Lunar Energy highlights that bi-directional
              battery export interconnection lacks standardized pathways, with utilities frequently imposing arbitrary
              export caps and protracted multi-month engineering review cycles. Behind-the-meter energy storage systems
              cannot maximize flexibility or realize grid service revenue without authorized export permissions.
              Concurrently, participating in advanced utility flexibility programs requires strict compliance with
              cybersecurity mandates, including SOC 2 Type II certification and NIST SP 800-82 industrial control
              standards, alongside privacy frameworks like Green Button Connect OAuth 2.0 to govern high-resolution
              interval meter data. While the Lunar System has achieved UL 9540A 6th Edition thermal runaway
              certification, divergent municipal fire codes and local permitting setback requirements continue to
              introduce regional installation friction.
            claimRefs:
              - CR001
              - CR005
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
