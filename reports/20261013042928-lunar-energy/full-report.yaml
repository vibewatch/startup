      - number: '6.3'
        title: Named Customer Deployments & Utility Partnerships
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence confirms meaningful enterprise-scale validation across institutional aggregators
              and municipal clean energy agencies. Sunrun represents Lunar's most significant deployment partner; during
              the summer 2023 heat emergency in California, Lunar Gridshare successfully dispatched Sunrun residential
              batteries in what partners described as the largest home-battery VPP event in United States history. In
              August 2026, WestLight Energy (formerly Peninsula Clean Energy) announced a partnership with Lunar
              Enterprise to operate its residential battery load-shifting program. Notably, this program targets
              low-income residents enrolled in WestLight's Solar + Battery Savings Program, delivering free solar and
              storage hardware supported by state incentives in exchange for participation in automated grid load
              reduction. Beyond California municipal aggregators, retail power provider Octopus Energy partnered with
              Lunar in Texas to integrate home batteries with dynamic ERCOT retail power tariffs, testing whether
              residential storage aggregation can thrive in competitive, weather-volatile wholesale markets without
              subsidized net metering.
            claimRefs:
