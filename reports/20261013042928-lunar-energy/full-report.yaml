              - CU008
      - number: '6.2'
        title: Adoption Trajectory & Economic Value Delivery
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of Lunar Energy solutions expanded rapidly following commercial launch in 2025 and new
              capital injections of $232 million across Series C and D rounds announced in early 2026. In its initial
              commercialization year, Lunar deployed thousands of home battery systems across California, establishing
              manufacturing and installation velocity across regional dealer and partner networks. Across its broader
              enterprise software footprint, Lunar reports approximately 650 MW of distributed energy resources under
              management across North America, Europe, and Asia on its Gridshare platform. Crucially for customer
              retention and word-of-mouth adoption, Lunar demonstrates tangible economic value delivery to participating
              households. In 2025, participating Lunar battery owners earned an average of $464 through enrolled VPP
              grid services programs, while Lunar AI automated behind-the-meter dispatch saved homeowners an additional
              $338 per year relative to standard battery self-consumption modes. These combined savings of over $800
              annually transform residential storage from an expensive backup luxury into an economically productive
              asset for participating homeowners.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
