      - number: '1.4'
        title: Commercial Scale, VPP Milestones, and Competitive Positioning
        blocks:
          - type: paragraph
            body: >-
              Since emerging from stealth in 2022 and initiating commercial shipments in California in 2024, Lunar
              Energy has established operational scale across distributed virtual power plants. The company currently
              manages 650 MW of distributed energy resources across North America, Europe, and Asia through Lunar
              Gridshare. In the United States, solar installer Sunrun leverages Gridshare across home battery fleets in
              New England, Hawaii, and Puerto Rico, demonstrating cross-market utility dispatch capability. Furthermore,
              Lunar Enterprise partners with California Community Choice Aggregators, including WestLight Energy
              (formerly Peninsula Clean Energy) and Haven Energy, to operate load-shifting programs tailored to
              low-income residential solar and storage customers. While Lunar has demonstrated technical execution and
              customer cost savings, it faces formidable market competition from incumbent storage providers, most
              notably Tesla Powerwall, Enphase Energy, and SolarEdge. Sustained market expansion will depend on
              navigating domestic content supply-chain constraints, expanding installer distribution beyond California,
              and translating high-margin software dispatch into audited operating cash flows.
