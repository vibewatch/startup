chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy, Inc. is a Mountain View, California-based clean technology company founded in August 2020 by
              Kunal Girotra, former head of Tesla Energy. The company operates on the core thesis that home
              electrification requires tightly coupled hardware and software: physical energy storage provides
              resilience, while algorithmic optimization captures economic value on the modern electrical grid. Rather
              than assembling third-party components, Lunar engineers an integrated residential ecosystem comprising
              modular 5 kWh battery blocks, a hybrid inverter, solar Maximizers, and the Lunar Bridge smart
              interconnection panel, designed in California and manufactured in Georgia and Washington. On the software
              layer, Lunar deploys Lunar Gridshare, a distributed energy resource management system (DERMS) that
              aggregates residential batteries into virtual power plants to deliver grid-balancing capacity. During 2025
              commercial operations, Lunar software generated an average of $464 in VPP program earnings per
              participating household alongside $338 in bill savings relative to standard battery modes, though customer
              participation remains geographically constrained by regional utility program availability.
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
              - CO011
      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy is led by an executive team with substantial operating experience in commercial energy
              storage, residential solar finance, and distributed technology. Founder and Chief Executive Officer Kunal
              Girotra previously scaled clean tech hardware from lab to production and led Tesla Energy through early
              2020, serving as the central technical architect and commercial strategist for Lunar. President Mark
              Gudiksen brings more than two decades of experience spanning venture investment, technology
              commercialization, and corporate company building to oversee day-to-day operations and strategic
              expansion. Technical vision and product systems are guided by engineering leader Mark Holveck, while
              corporate finance, capital markets, and treasury operations are directed by Vice President of Finance and
              Accounting Rishi Simha, an alumnus of SolarCity and Tesla Energy engineering finance. Commercial
              go-to-market, installer relationships, and utility VPP contracting are managed by Vice President of
              Revenue Ed Gunn. Outside legal counsel is provided by Wilson Sonsini Goodrich & Rosati, which advised
              Lunar on its multi-stage financings. Leadership continuity represents a material key-person dependence
              around Girotra, whose specialized industry background remains integral to capital raising, OEM
              relationships, and channel credibility.
            claimRefs:
              - CO001
              - CO002
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.3'
        title: Capitalization History, Investor Syndicate, and Valuation Opacity
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy has accumulated substantial capital across four private financing rounds, securing $532
              million in total lifetime equity investment. In February 2026, the company announced $232 million in new
              capital, consisting of an oversubscribed $102 million Series D round led by venture firms B Capital and
              Prelude Ventures, alongside a previously unannounced $130 million Series C growth financing led by
              Activate Capital. The investor syndicate features institutional and corporate venture backers including
              DCVC, Piva Capital, Leitmotif, Sunrun, Itochu Corporation, and Q Capital Partners, reflecting deep ties to
              residential solar installers and international trading conglomerates. Prior to the Series C and D rounds,
              Lunar had entered the commercial market in 2022 following more than $300 million in initial capitalization
              supported by Sunrun and South Korea’s SK Group. Despite this large capital base, Lunar discloses no
              official post-money valuation, liquidation preference terms, or cap-table waterfalls. External investment
              club tear sheets estimate the Series D valuation at approximately $1 billion, but enterprise value
              multiples, burn rates, and cash runway remain strictly undisclosed, creating material diligence gaps
              regarding corporate unit economics.
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
              - CO011
