  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Residential Product Definition & Modular Hardware Architecture
        blocks:
          - type: paragraph
            body: >
              Lunar Energy delivers an end-to-end residential clean energy system designed to replace fragmented
              inverter, storage, and transfer switch equipment with a unified, DC-coupled hardware architecture. At the
              system's core is the Lunar System, which integrates three primary hardware components: modular battery
              blocks, solar Maximizers, and the Lunar Bridge. Rather than deploying fixed-capacity monolithic battery
              packs, Lunar engineers its storage enclosure around 5 kilowatt-hour modular battery blocks that scale from
              a baseline 15 kWh configuration up to 30 kWh per residential site. Each installation delivers 9.6 kW
              continuous power output and up to 15 kW peak output, supporting full-home backup capability. On the
              photovoltaic generation side, Lunar incorporates module-level power electronics termed Lunar Maximizers,
              which optimize energy harvest at each solar panel and mitigate shading losses before DC routing. The
              connection between residential loads, photovoltaic arrays, storage modules, and utility distribution is
              governed by the Lunar Bridge, a specialized smart transfer switch and microgrid interconnect device. For
              granular circuit-level control during grid disconnection events, Lunar integrates directly with Eaton
              AbleEdge smart breakers. This breaker-level orchestration allows homeowners to automate load shedding,
              immediately cutting discretionary loads such as pool pumps and vehicle chargers while preserving critical
              energy reserves for refrigeration, medical equipment, lighting, and communications.
