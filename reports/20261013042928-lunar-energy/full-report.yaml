              - CI004
              - CI006
      - number: '4.2'
        title: Cost Structure and Unit Economics Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy's cost structure reflects the operational friction of scaling capital-intensive physical
              hardware alongside asset-light DERMS software. On the consumer side, the company discloses that
              participating residential battery owners earned an average of 464 dollars through grid-service
              participation in 2025, alongside 338 dollars in annual household electricity bill savings generated by
              behind-the-meter automated load shifting. However, core manufacturer-level unit economics—including
              hardware bill of materials (BOM), contract manufacturing margins, warranty reserve accruals, and fully
              loaded customer acquisition costs (CAC) across installer channels—remain strictly undisclosed private
              data. Independent financial analyses indicate that while Gridshare software operates with attractive gross
              margins, physical battery production operates as a heavy capital drain with substantial balance sheet
              exposure, competing head-to-head against deep-pocketed incumbents like Tesla and Base Power.
            claimRefs:
              - CI003
              - CI008
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Commercial Traction and VPP Monetization Flow
        blocks:
          - type: paragraph
            body: >-
              Public commercial deployment data reveals a stark divergence between Lunar Energy's physical hardware
              footprint and its software orchestration reach. The company has deployed approximately 2,000 proprietary
              battery systems across key United States markets, targeting an expansion to 20,000 units by year-end 2026
              and 100,000 units by 2028. In contrast, the Gridshare software platform already coordinates nearly 150,000
              distributed energy devices across California, Hawaii, New England, Puerto Rico, and Japan, including
              approximately 130,000 batteries for residential solar leader Sunrun. Gridshare monetizes this multi-vendor
              fleet by executing algorithmic relay-race dispatch during peak grid strain events, delivering aggregate
              capacity relief to utilities and community choice aggregators such as WestLight Energy while capturing
              performance fees and protecting household backup reserves.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI007
              - CI014
      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy announced an aggregate 232 million dollars in private capital in February 2026, comprising a
              previously unannounced 130 million dollar Series C led by Activate Capital and an oversubscribed 102
              million dollar Series D co-led by B Capital and Prelude Ventures. Lifetime equity financing now exceeds
              500 million dollars, providing medium-term liquidity to support manufacturing expansion and software
              deployment. However, this balance sheet must absorb heavy capital demands amid severe macro headwinds
              across the broader residential solar installer ecosystem, where high interest rates, California's NEM 3.0
              export tariff cuts, and SunPower's 2024 bankruptcy have thinned distributor channels. Furthermore, Lunar
              Energy faces acute customer concentration risk: Sunrun acts simultaneously as its primary software
              customer, founding investor, board participant, and potential internal-software competitor, leaving
              forward revenue visibility vulnerable to channel conflict.
