      - number: '2.3'
        title: Buyers, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The buying system is multi-sided. Homeowners use the equipment and may fund it directly or through
              financing; installers influence product choice and carry implementation risk; utilities, CCAs, and energy
              retailers sponsor programs or procure orchestration; and fleet operators need monitoring, dispatch, and
              customer communication. WestLight Energy's announced program illustrates the chain: WestLight owns the
              program objective, Gridshare is the VPP engine, Haven Energy handles customer recruitment, agreements, and
              installation contractors, and hardware partners supply batteries. Lunar states that Gridshare's dispatch
              target is more than 95% of available fleet energy while maintaining a 20% minimum reserve.


              Adoption is local rather than automatic. Lunar's support material says VPP participation is limited to
              areas with a supported program and requires compatible hardware; it also acknowledges that participation
              can increase a customer's utility bill, even though Lunar expects program value to offset it. In an
              industry interview, a Lunar executive framed dynamic rates, evolving market rules, savings, ease, and
              trust as decisive factors and warned that some third-party ownership providers may fail. These are company
              perspectives rather than independent forecasts, but they identify diligence priorities: program-level net
              benefits, opt-out and reserve behavior, installer and finance counterparty quality, regulatory approval,
              and renewal or retention evidence.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer Value Is Program-Specific, Not a Universal Payback
            body: >-
              Lunar's reported $464 average VPP earnings and $338 average incremental optimization savings are separate
              2025 observations. Without cohort, tariff, geography, hardware-price, financing, or persistence data, they
              should not be summed into a universal annual return or used to derive a payback period.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: Adoption Depends on Local Programs and Trusted Financing
            body: >-
              Lunar's own materials state that VPP access depends on location and compatible hardware, and its executive
              interview warns about third-party-ownership failures. Program eligibility, bill impact, customer control,
              installer execution, and finance-counterparty durability therefore require market-by-market diligence.
            calloutType: risk
            claimRefs:
