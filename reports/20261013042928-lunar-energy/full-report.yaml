      - number: '7.2'
        title: Operational, Hardware Quality, and Cybersecurity Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Operating a distributed fleet of residential batteries introduces compounding operational and reliability
              vulnerabilities at both device and grid levels. Simultaneous automated charging across hundreds of home
              batteries during low-price overnight windows risks inducing severe distribution feeder voltage depression,
              requiring Lunar's Gridshare platform to execute complex feeder-aware throttling to prevent localized
              circuit tripping. On the hardware front, Lunar utilizes 5 kWh Lithium Nickel Manganese Cobalt (NMC)
              battery blocks rather than Lithium Iron Phosphate (LFP) chemistry. While NMC delivers high volumetric
              energy density, it elevates exposure to volatile cobalt and nickel raw material pricing and demands
              stricter thermal management safeguards. Furthermore, physical assembly operations are concentrated in
              manufacturing facilities in Georgia and Washington. Any localized operational disruption, equipment
              failure, or regional transport bottleneck directly threatens hardware delivery schedules, while software
              dispatch errors could trigger customer battery reserve depletion prior to severe grid outages.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
