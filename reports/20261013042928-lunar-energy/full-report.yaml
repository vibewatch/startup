      - number: '5.2'
        title: Gridshare DERMS, AWS Infrastructure, & Virtual Power Plant Orchestration
        blocks:
          - type: paragraph
            body: >
              While Lunar manufactures proprietary residential hardware, its enterprise operating model and fleet
              management rely on the Gridshare software platform, a distributed energy resource management system
              (DERMS) and virtual power plant (VPP) orchestration engine. Acquired through Moixa and re-architected on
              Amazon Web Services (AWS), Gridshare operates as a dual-sided platform serving both behind-the-meter home
              energy management (HEMS) and front-of-the-meter utility aggregation. At the individual home level,
              proprietary algorithms generate daily bespoke energy plans by ingesting real-time utility rate structures,
              historical consumption profiles, local weather forecasts, and solar generation models. At the fleet level,
              Gridshare aggregates geographically dispersed energy storage into dispatchable virtual power plants,
              managing over 650 megawatts of distributed energy assets and 1.2 gigawatt-hours of connected storage
              across more than 130,000 devices in the United States, Japan, and Europe. In commercial VPP deployments,
              such as its partnership with WestLight Energy (formerly Peninsula Clean Energy) in California, Gridshare
              executes dynamic load shifting and peak demand reduction while maintaining programmatic constraints. To
              preserve homeowner trust and ensure battery readiness during severe weather, Gridshare enforces hard
              operational safeguards: the platform protects a minimum customer-selected battery reserve—typically 20% to
              30% of capacity—during grid support events, and automatically pauses dispatching while charging systems to
              100% capacity whenever severe weather alerts are triggered. Underneath this operational logic lies a
              serverless AWS infrastructure utilizing AWS IoT Core for MQTT/HTTPS telemetry, AWS Lambda and AWS Step
              Functions for dispatch workflows, Amazon ECS on Fargate for containerized predictive workloads, and
              DynamoDB for low-latency operational state, collectively processing nearly 178 terabytes of telemetry data
              annually.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
