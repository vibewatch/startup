  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Channel Strategy
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy operates a dual-pronged go-to-market model addressing both consumer and enterprise tiers
              within the residential clean energy ecosystem. At the consumer level, homeowners purchase or lease the
              modular Lunar System—comprising 15 to 30 kWh battery blocks, an integrated hybrid inverter, and the smart
              Bridge distribution panel—seeking resilience against grid outages and automated electricity bill
              reduction. However, rather than relying exclusively on high-friction direct consumer acquisition, Lunar
              primarily routes its hardware and software through major enterprise channels. The most prominent channel
              partner is Sunrun, the leading residential solar installer in the United States, which licenses Lunar
              Gridshare to orchestrate distributed residential storage assets across California, New England, Hawaii,
              and Puerto Rico. In parallel, Lunar engages Community Choice Aggregators (CCAs) and municipal utilities,
              such as WestLight Energy, Silicon Valley Clean Energy, and Ava Community Energy, to deploy equity-focused
              Virtual Power Plant (VPP) programs that aggregate residential storage fleets for peak grid load shifting.
              Finally, energy retailers including Octopus Energy in Texas provide a path to scale dynamic retail battery
              plans in deregulated wholesale power markets.
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
