      - number: '7.3'
        title: Partner Concentration and Supply Chain Dependencies
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy exhibits pronounced counterparty concentration across both upstream commercial distribution
              and downstream field installation. Sunrun serves as Lunar's dominant residential partner, deploying
              Gridshare across more than a dozen key regional markets including New England, Hawaii, and Puerto Rico;
              any strategic shift by Sunrun toward alternative battery hardware or proprietary DERMS platforms would
              severely impair Lunar's commercial volume. In community choice aggregator programs like WestLight Energy
              and Central Coast Community Energy (3CE), Lunar relies on external contractors such as Haven Energy for
              customer acquisition, agreements, and physical installation labor. The 3CE partnership establishes
              aggressive dispatch milestones of 5 MW by year-end 2026 scaling to 30 MW by 2030, leaving Lunar vulnerable
              to performance penalties or unrecovered customer acquisition expenses if local installer capacity falls
              short. Strategic capital providers like Sunrun and Itochu Corporation mitigate financing risks but deepen
              operational coupling.
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
          - type: table
            tableRef: TR003
