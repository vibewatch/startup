      - number: '6.4'
        title: Retention Dynamics, Expansion Loops & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Long-term customer durability relies on the continuous co-optimization of homeowner comfort, backup
              protection, and grid revenue. Gridshare maintains user trust by enforcing rigid dispatch constraints:
              algorithms guarantee a minimum 20% battery reserve level for home backup during all dispatch events and
              automatically trigger Outage Watch to pre-charge batteries to 100% capacity upon detecting severe storm
              warnings. Furthermore, Lunar Enterprise provides white-label mobile applications for utility and
              aggregator partners, ensuring clear transparency into program performance and accrued customer savings.
              Despite these technical strengths, Lunar faces critical diligence risks regarding customer concentration
              and disclosure opacity. External VPP directory benchmarks capture only 100 MW of source-reported capacity
              across two states (California and Texas) with undisclosed participant counts, in stark contrast to broader
              corporate marketing claims. Substantial exposure to Sunrun's origination pipeline creates channel
              vulnerability, while the lack of disclosed customer cohort retention, hardware failure rates, or contract
              renewal metrics obscures true account-level durability.
            claimRefs:
              - CU003
