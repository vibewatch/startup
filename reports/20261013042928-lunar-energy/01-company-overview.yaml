company:
  name: Lunar Energy
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Lunar Energy is a Mountain View-based residential clean energy startup developing integrated home battery systems
    and AI-powered Virtual Power Plant (VPP) software. Founded in 2020 by former Tesla Energy head Kunal Girotra, the
    company has raised $532 million in lifetime capital—including a $232 million Series C and D package announced in
    February 2026—and manages 650 MW of distributed energy assets globally, while keeping underlying revenue, gross
    margins, and valuation multiples confidential.
sections:
  - id: company-identity-and-mission
    title: Corporate Identity, Founding, and Core Architecture
    body: >-
      Lunar Energy, Inc. is a Mountain View, California-based clean technology company founded in August 2020 by Kunal
      Girotra, former head of Tesla Energy. The company operates on the core thesis that home electrification requires
      tightly coupled hardware and software: physical energy storage provides resilience, while algorithmic optimization
      captures economic value on the modern electrical grid. Rather than assembling third-party components, Lunar
      engineers an integrated residential ecosystem comprising modular 5 kWh battery blocks, a hybrid inverter, solar
      Maximizers, and the Lunar Bridge smart interconnection panel, designed in California and manufactured in Georgia
      and Washington. On the software layer, Lunar deploys Lunar Gridshare, a distributed energy resource management
      system (DERMS) that aggregates residential batteries into virtual power plants to deliver grid-balancing capacity.
      During 2025 commercial operations, Lunar software generated an average of $464 in VPP program earnings per
      participating household alongside $338 in bill savings relative to standard battery modes, though customer
      participation remains geographically constrained by regional utility program availability.
    claimRefs:
      - CO001
      - CO006
      - CO008
      - CO014
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Executive Leadership, Governance, and Key-Person Risk
    body: >-
      Lunar Energy is led by an executive team with substantial operating experience in commercial energy storage,
      residential solar finance, and distributed technology. Founder and Chief Executive Officer Kunal Girotra
      previously scaled clean tech hardware from lab to production and led Tesla Energy through early 2020, serving as
      the central technical architect and commercial strategist for Lunar. President Mark Gudiksen brings more than two
      decades of experience spanning venture investment, technology commercialization, and corporate company building to
      oversee day-to-day operations and strategic expansion. Technical vision and product systems are guided by
      engineering leader Mark Holveck, while corporate finance, capital markets, and treasury operations are directed by
      Vice President of Finance and Accounting Rishi Simha, an alumnus of SolarCity and Tesla Energy engineering
      finance. Commercial go-to-market, installer relationships, and utility VPP contracting are managed by Vice
      President of Revenue Ed Gunn. Outside legal counsel is provided by Wilson Sonsini Goodrich & Rosati, which advised
      Lunar on its multi-stage financings. Leadership continuity represents a material key-person dependence around
      Girotra, whose specialized industry background remains integral to capital raising, OEM relationships, and channel
      credibility.
    claimRefs:
      - CO001
      - CO002
      - CO009
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization History, Investor Syndicate, and Valuation Opacity
    body: >-
      Lunar Energy has accumulated substantial capital across four private financing rounds, securing $532 million in
      total lifetime equity investment. In February 2026, the company announced $232 million in new capital, consisting
      of an oversubscribed $102 million Series D round led by venture firms B Capital and Prelude Ventures, alongside a
      previously unannounced $130 million Series C growth financing led by Activate Capital. The investor syndicate
      features institutional and corporate venture backers including DCVC, Piva Capital, Leitmotif, Sunrun, Itochu
      Corporation, and Q Capital Partners, reflecting deep ties to residential solar installers and international
      trading conglomerates. Prior to the Series C and D rounds, Lunar had entered the commercial market in 2022
      following more than $300 million in initial capitalization supported by Sunrun and South Korea’s SK Group. Despite
      this large capital base, Lunar discloses no official post-money valuation, liquidation preference terms, or
      cap-table waterfalls. External investment club tear sheets estimate the Series D valuation at approximately $1
      billion, but enterprise value multiples, burn rates, and cash runway remain strictly undisclosed, creating
      material diligence gaps regarding corporate unit economics.
    claimRefs:
      - CO003
      - CO004
      - CO007
      - CO009
      - CO011
    tableRefs:
      - TO003
  - id: operational-milestones-and-market-traction
    title: Commercial Scale, VPP Milestones, and Competitive Positioning
    body: >-
      Since emerging from stealth in 2022 and initiating commercial shipments in California in 2024, Lunar Energy has
      established operational scale across distributed virtual power plants. The company currently manages 650 MW of
      distributed energy resources across North America, Europe, and Asia through Lunar Gridshare. In the United States,
      solar installer Sunrun leverages Gridshare across home battery fleets in New England, Hawaii, and Puerto Rico,
      demonstrating cross-market utility dispatch capability. Furthermore, Lunar Enterprise partners with California
      Community Choice Aggregators, including WestLight Energy (formerly Peninsula Clean Energy) and Haven Energy, to
      operate load-shifting programs tailored to low-income residential solar and storage customers. While Lunar has
      demonstrated technical execution and customer cost savings, it faces formidable market competition from incumbent
      storage providers, most notably Tesla Powerwall, Enphase Energy, and SolarEdge. Sustained market expansion will
      depend on navigating domestic content supply-chain constraints, expanding installer distribution beyond
      California, and translating high-margin software dispatch into audited operating cash flows.
    claimRefs:
      - CO004
      - CO005
      - CO008
      - CO010
      - CO012
      - CO013
    figureRefs:
      - FO001
