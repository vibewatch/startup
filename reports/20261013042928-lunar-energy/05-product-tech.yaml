company:
  name: Lunar Energy
chapter:
  number: 5
  title: Product & Technology
  summary: Lunar Energy pairs an integrated residential hardware stack with Gridshare, a cloud DERMS platform orchestrating 650 MW of distributed energy assets across 130,000+ devices. The hardware architecture couples 5 kWh modular battery blocks with solar Maximizers and smart-meter switching, while AWS-hosted optimization engines automate VPP dispatches with reserve protections. Technical diligence centers on manufacturing yield as targets scale fivefold, hardware gross margins, and field reliability across multi-vendor fleets.
sections:
  - id: product-definition-hardware-stack
    title: Residential Product Definition & Modular Hardware Architecture
    body: >
      Lunar Energy delivers an end-to-end residential clean energy system designed to replace fragmented inverter, storage, and transfer switch equipment with a unified, DC-coupled hardware architecture. At the system's core is the Lunar System, which integrates three primary hardware components: modular battery blocks, solar Maximizers, and the Lunar Bridge. Rather than deploying fixed-capacity monolithic battery packs, Lunar engineers its storage enclosure around 5 kilowatt-hour modular battery blocks that scale from a baseline 15 kWh configuration up to 30 kWh per residential site. Each installation delivers 9.6 kW continuous power output and up to 15 kW peak output, supporting full-home backup capability. On the photovoltaic generation side, Lunar incorporates module-level power electronics termed Lunar Maximizers, which optimize energy harvest at each solar panel and mitigate shading losses before DC routing. The connection between residential loads, photovoltaic arrays, storage modules, and utility distribution is governed by the Lunar Bridge, a specialized smart transfer switch and microgrid interconnect device. For granular circuit-level control during grid disconnection events, Lunar integrates directly with Eaton AbleEdge smart breakers. This breaker-level orchestration allows homeowners to automate load shedding, immediately cutting discretionary loads such as pool pumps and vehicle chargers while preserving critical energy reserves for refrigeration, medical equipment, lighting, and communications.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: software-platform-vpp-architecture
    title: Gridshare DERMS, AWS Infrastructure, & Virtual Power Plant Orchestration
    body: >
      While Lunar manufactures proprietary residential hardware, its enterprise operating model and fleet management rely on the Gridshare software platform, a distributed energy resource management system (DERMS) and virtual power plant (VPP) orchestration engine. Acquired through Moixa and re-architected on Amazon Web Services (AWS), Gridshare operates as a dual-sided platform serving both behind-the-meter home energy management (HEMS) and front-of-the-meter utility aggregation. At the individual home level, proprietary algorithms generate daily bespoke energy plans by ingesting real-time utility rate structures, historical consumption profiles, local weather forecasts, and solar generation models. At the fleet level, Gridshare aggregates geographically dispersed energy storage into dispatchable virtual power plants, managing over 650 megawatts of distributed energy assets and 1.2 gigawatt-hours of connected storage across more than 130,000 devices in the United States, Japan, and Europe. In commercial VPP deployments, such as its partnership with WestLight Energy (formerly Peninsula Clean Energy) in California, Gridshare executes dynamic load shifting and peak demand reduction while maintaining programmatic constraints. To preserve homeowner trust and ensure battery readiness during severe weather, Gridshare enforces hard operational safeguards: the platform protects a minimum customer-selected battery reserve—typically 20% to 30% of capacity—during grid support events, and automatically pauses dispatching while charging systems to 100% capacity whenever severe weather alerts are triggered. Underneath this operational logic lies a serverless AWS infrastructure utilizing AWS IoT Core for MQTT/HTTPS telemetry, AWS Lambda and AWS Step Functions for dispatch workflows, Amazon ECS on Fargate for containerized predictive workloads, and DynamoDB for low-latency operational state, collectively processing nearly 178 terabytes of telemetry data annually.
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE002
  - id: deployment-scale-differentiation-risks
    title: Deployment Scale, Competitive Differentiation, & Technical Risks
    body: >
      Lunar differentiates its technology stack through two primary vectors: hardware ease-of-installation paired with DC optimization, and vendor-agnostic software aggregation. Unlike legacy AC-coupled storage systems that suffer round-trip conversion losses through redundant inverter stages, Lunar's DC architecture maximizes round-trip efficiency while packaging solar optimization and smart switching into streamlined, pre-configured enclosures designed to reduce installer commissioning times and field errors. Furthermore, Gridshare's fleet management software integrates third-party inverters, batteries, electric vehicles, and smart thermostats alongside Lunar's native hardware, positioning the company as an operating system for residential energy fleets rather than an isolated hardware vendor. Major channel partners, notably Sunrun, leverage Gridshare across regional utility programs in New England, Hawaii, and Puerto Rico. However, this hybrid strategy creates substantial product and operational risks. On the hardware front, Lunar faces aggressive manufacturing scaling pressure: backed by $232 million in Series C and D funding closed in early 2026, the company plans to expand production from thousands of deployed California units to 20,000 units by year-end 2026, and 100,000 units annually by 2028. Scaling specialized power electronics and battery pack assembly fivefold within twelve months introduces acute supply chain vulnerabilities, cell procurement risks, and factory yield challenges. On the software front, orchestrating multi-vendor hardware fleets exposes Gridshare to third-party firmware revisions, communication dropouts over residential cellular and Wi-Fi networks, and complex cybersecurity surface areas across public API and Model Context Protocol (MCP) endpoints.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
    tableRefs:
      - TE003
