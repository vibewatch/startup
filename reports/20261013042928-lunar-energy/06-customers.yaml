callouts:
  - calloutType: strength
    title: Dual Economic Value Driver for Homeowner Retention
    body: Lunar Energy differentiates its customer value proposition by combining automated behind-the-meter bill savings ($338/year average) with upfront and recurring VPP grid participation incentives ($464/year average), creating an $800+ annual value stack that reinforces customer satisfaction and lowers payback periods.
    claimRefs:
      - CU005
      - CU006
  - calloutType: risk
    title: Aggregator and Geographic Channel Concentration
    body: A substantial proportion of Lunar's deployed residential fleet and VPP capacity relies on Sunrun's origination engine and California wholesale markets. Failure to diversify distribution into independent certified dealers and outside CAISO/ERCOT exposes Lunar to channel partner renegotiation and local regulatory changes.
    claimRefs:
      - CU007
      - CU008
      - CU015
