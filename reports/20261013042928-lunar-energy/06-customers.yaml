chapter:
  number: 6
  title: Customers
  summary: Lunar Energy addresses a diversified customer ecosystem spanning residential homeowners, solar aggregator partners like Sunrun, and Community Choice Aggregators such as WestLight Energy. While commercial deployments demonstrate meaningful traction with thousands of systems operating in California and 650 MW of DER assets under management, heavy channel concentration in Sunrun and geographic exposure to CAISO and ERCOT remain central customer risks.
sections:
  - id: customer-segmentation-and-go-to-market
    title: Customer Base Segmentation & Channel Strategy
    body: Lunar Energy operates a dual-pronged go-to-market model addressing both consumer and enterprise tiers within the residential clean energy ecosystem. At the consumer level, homeowners purchase or lease the modular Lunar System—comprising 15 to 30 kWh battery blocks, an integrated hybrid inverter, and the smart Bridge distribution panel—seeking resilience against grid outages and automated electricity bill reduction. However, rather than relying exclusively on high-friction direct consumer acquisition, Lunar primarily routes its hardware and software through major enterprise channels. The most prominent channel partner is Sunrun, the leading residential solar installer in the United States, which licenses Lunar Gridshare to orchestrate distributed residential storage assets across California, New England, Hawaii, and Puerto Rico. In parallel, Lunar engages Community Choice Aggregators (CCAs) and municipal utilities, such as WestLight Energy, Silicon Valley Clean Energy, and Ava Community Energy, to deploy equity-focused Virtual Power Plant (VPP) programs that aggregate residential storage fleets for peak grid load shifting. Finally, energy retailers including Octopus Energy in Texas provide a path to scale dynamic retail battery plans in deregulated wholesale power markets.
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU008
    tableRefs:
      - TU001
  - id: commercial-adoption-and-economic-traction
    title: Adoption Trajectory & Economic Value Delivery
    body: Commercial adoption of Lunar Energy solutions expanded rapidly following commercial launch in 2025 and new capital injections of $232 million across Series C and D rounds announced in early 2026. In its initial commercialization year, Lunar deployed thousands of home battery systems across California, establishing manufacturing and installation velocity across regional dealer and partner networks. Across its broader enterprise software footprint, Lunar reports approximately 650 MW of distributed energy resources under management across North America, Europe, and Asia on its Gridshare platform. Crucially for customer retention and word-of-mouth adoption, Lunar demonstrates tangible economic value delivery to participating households. In 2025, participating Lunar battery owners earned an average of $464 through enrolled VPP grid services programs, while Lunar AI automated behind-the-meter dispatch saved homeowners an additional $338 per year relative to standard battery self-consumption modes. These combined savings of over $800 annually transform residential storage from an expensive backup luxury into an economically productive asset for participating homeowners.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU002
  - id: named-customer-evidence-and-partner-validation
    title: Named Customer Deployments & Utility Partnerships
    body: Public customer evidence confirms meaningful enterprise-scale validation across institutional aggregators and municipal clean energy agencies. Sunrun represents Lunar's most significant deployment partner; during the summer 2023 heat emergency in California, Lunar Gridshare successfully dispatched Sunrun residential batteries in what partners described as the largest home-battery VPP event in United States history. In August 2026, WestLight Energy (formerly Peninsula Clean Energy) announced a partnership with Lunar Enterprise to operate its residential battery load-shifting program. Notably, this program targets low-income residents enrolled in WestLight's Solar + Battery Savings Program, delivering free solar and storage hardware supported by state incentives in exchange for participation in automated grid load reduction. Beyond California municipal aggregators, retail power provider Octopus Energy partnered with Lunar in Texas to integrate home batteries with dynamic ERCOT retail power tariffs, testing whether residential storage aggregation can thrive in competitive, weather-volatile wholesale markets without subsidized net metering.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU003
  - id: customer-retention-expansion-and-concentration-risk
    title: Retention Dynamics, Expansion Loops & Concentration Risks
    body: 'Long-term customer durability relies on the continuous co-optimization of homeowner comfort, backup protection, and grid revenue. Gridshare maintains user trust by enforcing rigid dispatch constraints: algorithms guarantee a minimum 20% battery reserve level for home backup during all dispatch events and automatically trigger Outage Watch to pre-charge batteries to 100% capacity upon detecting severe storm warnings. Furthermore, Lunar Enterprise provides white-label mobile applications for utility and aggregator partners, ensuring clear transparency into program performance and accrued customer savings. Despite these technical strengths, Lunar faces critical diligence risks regarding customer concentration and disclosure opacity. External VPP directory benchmarks capture only 100 MW of source-reported capacity across two states (California and Texas) with undisclosed participant counts, in stark contrast to broader corporate marketing claims. Substantial exposure to Sunrun''s origination pipeline creates channel vulnerability, while the lack of disclosed customer cohort retention, hardware failure rates, or contract renewal metrics obscures true account-level durability.'
    claimRefs:
      - CU003
      - CU008
      - CU012
      - CU014
      - CU015
    figureRefs:
      - FU001
