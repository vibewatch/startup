callouts:
  - calloutType: risk
    title: Regulatory Interconnection and Channel Concentration Define Core Vulnerabilities
    body: 'Lunar Energy''s growth trajectory is heavily exposed to two interdependent bottlenecks: utility interconnection approval cycles for bi-directional battery export tariffs, and commercial concentration in early distribution channels such as Sunrun and regional California Community Choice Aggregators. Until multi-region utility interconnection standardization and diversified direct installer channels mature, localized regulatory friction directly throttles fleet capacity growth.'
    claimRefs:
      - CR001
      - CR002
      - CR004
