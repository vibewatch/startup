chapter:
  number: 7
  title: Risks
  summary: Comprehensive diligence evaluation of Lunar Energy's legal, regulatory, operational, partner dependency, and capital intensity risks, highlighting bi-directional export interconnection hurdles, channel reliance on Sunrun and California CCAs, and NMC cell thermal supply chain constraints.
sections:
  - id: regulatory-and-legal-risks
    title: Regulatory, Interconnection, and Compliance Risks
    claimRefs:
      - CR001
      - CR005
      - CR007
    tableRefs:
      - TR001
    body: Distributed virtual power plant deployment velocity is fundamentally constrained by state public utility commission regulations and local electric distribution company (EDC) interconnection tariffs. In regulatory dockets such as New Jersey BPU Docket QO26030099, Lunar Energy highlights that bi-directional battery export interconnection lacks standardized pathways, with utilities frequently imposing arbitrary export caps and protracted multi-month engineering review cycles. Behind-the-meter energy storage systems cannot maximize flexibility or realize grid service revenue without authorized export permissions. Concurrently, participating in advanced utility flexibility programs requires strict compliance with cybersecurity mandates, including SOC 2 Type II certification and NIST SP 800-82 industrial control standards, alongside privacy frameworks like Green Button Connect OAuth 2.0 to govern high-resolution interval meter data. While the Lunar System has achieved UL 9540A 6th Edition thermal runaway certification, divergent municipal fire codes and local permitting setback requirements continue to introduce regional installation friction.
  - id: operational-and-security-risks
    title: Operational, Hardware Quality, and Cybersecurity Vulnerabilities
    claimRefs:
      - CR003
      - CR008
      - CR009
      - CR013
    tableRefs:
      - TR002
    body: Operating a distributed fleet of residential batteries introduces compounding operational and reliability vulnerabilities at both device and grid levels. Simultaneous automated charging across hundreds of home batteries during low-price overnight windows risks inducing severe distribution feeder voltage depression, requiring Lunar's Gridshare platform to execute complex feeder-aware throttling to prevent localized circuit tripping. On the hardware front, Lunar utilizes 5 kWh Lithium Nickel Manganese Cobalt (NMC) battery blocks rather than Lithium Iron Phosphate (LFP) chemistry. While NMC delivers high volumetric energy density, it elevates exposure to volatile cobalt and nickel raw material pricing and demands stricter thermal management safeguards. Furthermore, physical assembly operations are concentrated in manufacturing facilities in Georgia and Washington. Any localized operational disruption, equipment failure, or regional transport bottleneck directly threatens hardware delivery schedules, while software dispatch errors could trigger customer battery reserve depletion prior to severe grid outages.
  - id: partner-and-supply-chain-dependencies
    title: Partner Concentration and Supply Chain Dependencies
    claimRefs:
      - CR002
      - CR004
      - CR010
      - CR011
    tableRefs:
      - TR003
    body: Lunar Energy exhibits pronounced counterparty concentration across both upstream commercial distribution and downstream field installation. Sunrun serves as Lunar's dominant residential partner, deploying Gridshare across more than a dozen key regional markets including New England, Hawaii, and Puerto Rico; any strategic shift by Sunrun toward alternative battery hardware or proprietary DERMS platforms would severely impair Lunar's commercial volume. In community choice aggregator programs like WestLight Energy and Central Coast Community Energy (3CE), Lunar relies on external contractors such as Haven Energy for customer acquisition, agreements, and physical installation labor. The 3CE partnership establishes aggressive dispatch milestones of 5 MW by year-end 2026 scaling to 30 MW by 2030, leaving Lunar vulnerable to performance penalties or unrecovered customer acquisition expenses if local installer capacity falls short. Strategic capital providers like Sunrun and Itochu Corporation mitigate financing risks but deepen operational coupling.
  - id: financial-model-and-thesis-break-risks
    title: Capital Intensity, Model Risks, and Thesis-Break Triggers
    claimRefs:
      - CR006
      - CR012
      - CR014
    figureRefs:
      - FR001
    body: Developing proprietary residential hardware alongside cloud DERMS software imposes intense capital demands and ongoing working capital friction. Although Lunar secured $232 million across Series C and Series D rounds through early 2026, private investment marks attributing a $1 billion valuation establish aggressive commercial expectations. If residential battery hardware margins compress amid price competition from low-cost incumbent storage vendors, software revenue alone may fail to absorb hardware development burn. At the customer level, participating in VPP programs carries electricity bill volatility if dynamic utility export remuneration fails to outpace battery degradation and on-peak charging costs, increasing customer churn risk. Core thesis-break triggers include sustained utility refusal to adopt bi-directional export tariffs, material field warranty failure rates across NMC modules, or Sunrun curtailing its Gridshare distribution relationship. Diligence must monitor warranty reserve accounting and installer unit economics.
