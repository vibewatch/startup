evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited financial statements verifying GAAP revenue, gross margins by hardware and software streams, operating
      expenses, and cash burn rate.
    whyItMatters: >-
      Without audited revenue and margin data, true unit economics, manufacturing profitability, and cash runway cannot
      be independently evaluated.
    diligencePath: >-
      Request audited financial statements, management accounts, and hardware bill-of-materials margin reports under
      confidentiality agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: valuation-and-cap-table-terms
    missingEvidence: >-
      Official Series C and Series D post-money valuation confirmations, liquidation preference hierarchy, and option
      pool sizing.
    whyItMatters: >-
      Tear sheet profiles report an unverified $1B valuation, leaving economic rights, anti-dilution provisions, and
      return hurdle waterfalls uncertain.
    diligencePath: >-
      Obtain the amended Certificate of Incorporation, voting agreements, and investor rights agreements from corporate
      counsel or data room.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: complete-executive-and-investor-enumeration
    missingEvidence: >-
      Comprehensive listing of all equity holders, board members, and extended executive staff beyond public press
      releases.
    whyItMatters: Full governance structure, board seat allocation, and key-person retention incentives remain partially disclosed.
    diligencePath: >-
      Request formal cap table capitalization export and board composition documentation during management diligence
      meetings.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: addressable-market-sizing
    missingEvidence: >-
      Independent residential-storage deployment counts, installed-price distributions, eligible-household and
      utility-territory denominators, program participation rates, and software contract economics needed to calculate
      dollar TAM, SAM, and SOM.
    whyItMatters: >-
      Sector venture funding, managed megawatts, product capacity, deployment descriptions, and customer averages use
