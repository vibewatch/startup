  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 住宅产品定义与模块化硬件架构
        blocks:
          - type: paragraph
            body: >
              Lunar Energy 提供端到端住宅清洁能源系统，用统一的直流耦合硬件架构替代分散的逆变器、储能和转换开关设备。系统核心是 Lunar System，整合三类主要硬件：模块化电池块、太阳能 Maximizer
              和 Lunar Bridge。Lunar 没有部署固定容量的一体式电池包，而是围绕 5 kWh 模块化电池块设计储能外壳，使每个住宅站点的容量可从基础 15 kWh 扩展到 30 kWh。每套安装可提供 9.6
              kW 持续输出功率和最高 15 kW 峰值输出，支持全屋备用。在光伏发电侧，Lunar 使用名为 Lunar Maximizer
              的组件级电力电子设备，优化每块太阳能板的能量收集，并在直流传输前减少遮阴损失。住宅负荷、光伏阵列、储能模块和公用事业配电之间的连接由 Lunar Bridge
              管理；它是一种专用智能转换开关和微电网互联设备。为在断网事件期间实现电路级精细控制，Lunar 直接与 Eaton AbleEdge
              智能断路器集成。这种断路器级编排让家庭用户能够自动切除负荷，立即关闭泳池泵和车辆充电器等非必要负荷，同时为冰箱、医疗设备、照明和通信保留关键能源储备。
