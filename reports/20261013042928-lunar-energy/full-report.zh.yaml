      - number: '3.2'
        title: 能力对比与软硬件协同优化
        blocks:
          - type: paragraph
            body: >-
              住宅储能的竞争差异化越来越集中在软件编排和边缘负荷灵活性，而不只是电池化学体系。Tesla 和 Enphase 的传统储能系统主要是为自发自用和紧急孤岛运行设计的封闭生态，车队聚合受限于专有设备。Lunar
              则以开放的多供应商 DERMS 架构与之区分：其 Gridshare 平台在全球管理 650 MW 分布式能源资源，协调多个制造商的电池、电动车充电器、智能恒温器和热水器。在硬件层，Lunar 系统以 5 kWh
              电池块提供 15 至 30 kWh 的模块化容量，并配套一体化 Lunar Bridge 智能面板和专用直流耦合太阳能 Maximizer。这套一体化架构能够在电路级别精细切负荷和削减峰值需求，但老牌 OEM
              竞争者在规模和住宅消费者品牌认知上仍占据明显优势。
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
