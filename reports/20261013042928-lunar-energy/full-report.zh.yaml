  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 的核心投资逻辑很有吸引力，建立在住宅电池储能硬件与分布式电网软件的结构性融合之上。Lunar 不把自己定位成纯硬件
              OEM，也不是游离于硬件之外的分布式能源资源管理系统（DERMS）供应商，而是将模块化电池系统与自研 Gridshare
              软件平台纵向整合。这一架构带来双重变现：向房主直接销售和出租硬件，同时从公用事业与社区选择聚合商获得持续性的虚拟电厂（VPP）协调收入。真实运营证据显示，参与项目的房主每年平均获得 $464 的 VPP
              收入，并通过 Lunar AI 优化额外节省 $338 电费。不过，反向逻辑也暴露出严重的结构性阻力。Lunar 在佐治亚州和华盛顿州进行本土制造，面临硬件企业常见的高资本开支、组装成本通胀与库存周期。此外，尽管
              Gridshare 软件管理着 650 MW 的分布式容量，但相较于低毛利硬件部署，软件收入贡献仍未得到验证；分销也高度依赖 Sunrun 等锚定合作伙伴。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
