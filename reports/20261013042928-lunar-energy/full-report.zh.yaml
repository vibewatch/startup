chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与核心架构
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy, Inc. 是一家总部位于加州 Mountain View 的清洁技术公司，由 Tesla Energy 前负责人 Kunal Girotra 于 2020 年 8
              月创立。公司的核心判断是，家庭电气化需要硬件与软件紧密耦合：实体储能提供韧性，算法优化则从现代电网中捕获经济价值。Lunar 没有简单拼装第三方组件，而是自行设计一套一体化住宅生态，包括模块化 5 kWh
              电池块、混合逆变器、太阳能 Maximizer，以及 Lunar Bridge 智能互联面板；产品在加州设计，在佐治亚州和华盛顿州制造。在软件层，Lunar 部署 Lunar
              Gridshare——一个分布式能源资源管理系统（DERMS），将住宅电池聚合成虚拟电厂，提供电网平衡容量。2025 年商业运营期间，Lunar 软件为每个参与家庭平均带来 $464 的 VPP
              项目收益，相比标准电池模式另节省 $338 电费；不过，客户参与仍受各地区公用事业项目可用性的地理限制。
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
              - CO011
      - number: '1.2'
        title: 高管团队、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 的管理团队深耕商业储能、住宅太阳能融资和分布式技术，拥有丰富运营经验。创始人兼首席执行官 Kunal Girotra 曾将清洁技术硬件从实验室推进到量产，并在 2020 年初之前带领
              Tesla Energy，是 Lunar 的核心技术架构师和商业策略负责人。总裁 Mark Gudiksen 拥有超过二十年横跨风险投资、技术商业化和企业建设的经验，负责日常运营与战略扩张。工程负责人 Mark
              Holveck 负责技术愿景和产品系统；财务与会计副总裁 Rishi Simha 负责企业财务、资本市场和资金管理，曾在 SolarCity 和 Tesla Energy 工程财务部门任职。收入副总裁 Ed
              Gunn 负责商业拓展、安装商关系和公用事业 VPP 合同。Wilson Sonsini Goodrich & Rosati 担任外部法律顾问，并曾为 Lunar 的多轮融资提供建议。管理层连续性对
              Girotra 存在显著关键人物依赖：他的专业行业背景仍是融资、OEM 关系和渠道信誉的核心。
            claimRefs:
              - CO001
              - CO002
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.3'
        title: 资本化历程、投资者联盟与估值不透明
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 通过四轮私募融资积累了大量资本，累计股权投资达 $532 million。2026 年 2 月，公司宣布新增 $232 million 资本，包括由 B Capital 和
              Prelude Ventures 领投、超额认购的 $102 million D 轮，以及由 Activate Capital 领投、此前未宣布的 $130 million C 轮成长融资。投资者联盟包括
              DCVC、Piva Capital、Leitmotif、Sunrun、Itochu Corporation 和 Q Capital Partners
              等机构及企业风险投资方，反映出公司与住宅太阳能安装商及国际贸易集团的深厚联系。在 C、D 轮之前，Lunar 已于 2022 年进入商业市场；此前其在 Sunrun 和韩国 SK Group 支持下完成了超过
              $300 million 的初始资本化。尽管资本基础雄厚，Lunar 没有披露官方投后估值、清算优先权条款或资本表瀑布。外部投资俱乐部材料估计 D 轮估值约为 $1
              billion，但企业价值倍数、现金消耗率和现金跑道仍严格未披露，形成关于公司单位经济性的重大尽调缺口。
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
              - CO011
