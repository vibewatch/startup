      - number: '1.4'
        title: 商业规模、VPP 里程碑与竞争定位
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 自 2022 年结束隐身状态、并于 2024 年在加州开始商业出货以来，已在分布式虚拟电厂领域建立运营规模。目前，公司通过 Lunar Gridshare 在北美、欧洲和亚洲管理 650
              MW 分布式能源资源。在美国，太阳能安装商 Sunrun 在新英格兰、夏威夷和波多黎各的家庭电池群中使用 Gridshare，展现跨市场公用事业调度能力。此外，Lunar Enterprise
              与加州社区选择聚合商合作，包括 WestLight Energy（原 Peninsula Clean Energy）和 Haven Energy，为低收入住宅太阳能及储能客户运营负荷转移项目。虽然 Lunar
              已证明技术执行力并带来客户成本节省，但其面临 Tesla Powerwall、Enphase Energy 和 SolarEdge
              等老牌储能供应商的强劲竞争。持续扩张取决于应对本土化内容供应链约束、把安装商分销拓展到加州以外，以及将高毛利软件调度转化为经审计的经营现金流。
