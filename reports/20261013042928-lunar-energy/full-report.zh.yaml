      - number: '6.4'
        title: 留存动力、扩张闭环与集中风险
        blocks:
          - type: paragraph
            body: >-
              长期客户稳定性取决于家庭舒适度、备用保护和电网收入的持续协同优化。Gridshare 通过严格的调度约束维持用户信任：算法保证所有调度事件期间家庭备用电池至少保留 20%，检测到强风暴警报后自动触发 Outage
              Watch，将电池预充至 100% 容量。此外，Lunar Enterprise 为公用事业和聚合商伙伴提供白标移动应用，确保项目表现和累计客户节省清晰可见。尽管技术实力不弱，Lunar
              客户集中度高、披露透明度低，仍有重大尽调风险。外部 VPP 目录基准只记录了加州和得州两个州合计 100 MW 的来源报告容量，参与者数量未披露，与公司在营销材料中声称的更大口径形成鲜明对比。公司高度依赖
              Sunrun 的客户获取管线，因而容易受到渠道冲击；而未披露客户群留存、硬件故障率或合同续约指标，也让真实的账户级持久性难以判断。
            claimRefs:
              - CU003
              - CU008
              - CU012
              - CU014
              - CU015
