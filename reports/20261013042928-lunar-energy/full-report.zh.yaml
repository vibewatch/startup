            body: >-
              Lunar Energy 的解决方案在 2025 年商业发布、以及 2026 年初公布的 C、D 轮合计 $232 million 新资本注入后迅速扩大商业采用。在商业化第一年，Lunar
              通过区域经销商和合作伙伴网络在加州部署了数千套家用电池系统，建立制造和安装速度。在更广泛的企业软件覆盖范围内，Lunar 报告称其 Gridshare 平台在北美、欧洲和亚洲管理约 650 MW
              分布式能源资源。对客户留存和口碑式采用而言，Lunar 为参与家庭带来了切实的经济价值。2025 年，参与的 Lunar 电池用户通过加入 VPP 电网服务项目平均获得 $464；同时，Lunar AI
              的表后自动调度相较标准电池自发自用模式，每年为家庭用户额外节省 $338。这些每年超过 $800 的合计节省，将住宅储能从昂贵的备用奢侈品变成参与家庭用户可产生经济价值的资产。
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
