        - id: capacity-payments
          label: 电网服务收入兑现
          detail: 公用事业和 CCA 支付容量费与绩效费；户主平均每年获得 $464 激励
        - id: software-margin
          label: Gridshare 软件与平台利润
          detail: Lunar 从管理设备容量中获取经常性 SaaS 许可费和 VPP 收入分成
        - id: hardware-margin
          label: 硬件现金流与制造成本回收
          detail: 硬件设备销售或持续租赁收入流摊销制造、保修及资本开支
    approximationNotes: 基于已披露商业模式机制和合作协议的示意性商业流程；具体收入分成因公用事业项目而异。
    claimRefs:
      - CI001
      - CI003
      - CI007
      - CI014
  - id: FE001
    title: Lunar Energy 端到端技术与运营架构栈
    type: stack
    summary: 六层技术架构涵盖物理电力电子、边缘通信、云数据基础设施、算法优化、企业 DERMS 管理和外部合作伙伴 API。
    data:
      layers:
        - label: 企业与开发者集成层
          detail: RESTful 合作伙伴 / 客户 API 及 Model Context Protocol（MCP）服务器使用 AWS Cognito bearer token 认证，用于公用事业和智能代理集成
          modules:
            - Gridshare 合作伙伴 API（公用事业与 DERMS REST 集成）
            - Gridshare 客户 API（户主委托控制）
            - 面向 AI 代理的远程 Model Context Protocol（MCP）服务器
            - AWS Cognito OAuth2 令牌认证
        - label: 机群 DERMS 与 VPP 编排层
          detail: 企业级机群聚合平台编排多供应商设备，强制保留 20-30% 电池备用电量，并自动启动恶劣天气冻结保护
          modules:
            - Gridshare 企业管理平台
            - Fleet Flex 组聚合与调度引擎
            - 客户备用电量自动保护（20-30% 下限）
            - 恶劣天气电网隔离与自动预充电
        - label: 算法优化与 HEMS 层
          detail: 定制化每日家庭能源调度，综合历史用电习惯、动态公用事业费率和天气模型
          modules:
            - Lunar AI 定制化每日调度规划器
            - 动态公用事业费率与实时价格接入
            - 本地天气预测与太阳能发电建模
            - 站点能源消费习惯学习引擎
        - label: 云端遥测与工作流执行层
          detail: 无服务器 AWS 基础设施通过 IoT Core、Step Functions、Lambda 和 DynamoDB，处理覆盖 130,000+ 台设备、每年 178 TB 的遥测数据
          modules:
            - AWS IoT Core 遥测处理（MQTT / HTTPS）
            - AWS Step Functions 调度编排
            - AWS Lambda 与 Amazon ECS Fargate 计算
            - Amazon DynamoDB 状态存储与 178 TB/年遥测处理
        - label: 站点连接与微电网切换层
          detail: 通过 Lunar Bridge 和 Eaton 智能断路器实现智能孤岛运行、微电网互联及电路级自动减载
          modules:
            - Lunar Bridge 智能电表插座与微电网互联
            - Eaton AbleEdge 智能断路器集成
            - 子配电盘自动减载逻辑
            - 本地 Wi-Fi、以太网和蜂窝备份网关
        - label: 物理电力与储能硬件层
          detail: 模块化 5 kWh 锂电池模块（总计 15-30 kWh）、9.6 kW 连续 / 15 kW 峰值电力电子设备及屋顶太阳能 Maximizer
          modules:
            - 模块化 5 kWh 锂电池模块（15-30 kWh 系统）
            - 9.6 kW 连续 / 15 kW 峰值功率输出电子设备
            - 屋顶太阳能 Lunar Maximizer（直流功率优化器）
            - 统一高效直流耦合系统逆变器
    approximationNotes: 代表基于 AWS 技术出版物、公司平台文档和安装商产品目录提炼的硬件、边缘控制及 AWS 云服务功能抽象。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 从硬件安装到 AI 自动优化、VPP 聚合及社区能源扩张的端到端客户旅程。
    data:
      nodes:
        - label: 渠道发现与规模评估
          stage: Awareness
          touchpoints:
            - Homeowner evaluates solar storage via installer or Sunrun partner
            - Modular 15 kWh to 30 kWh battery sizing based on home load
          owner: Installer & Partner Channel
        - label: 无缝安装与调试
          stage: Acquisition
          touchpoints:
            - Integrated DC-coupled inverter and smart Bridge installed in single day
            - Rapid commissioning using Lunar installer software tool
          owner: Certified Installers & Contractors
        - label: 表后自主优化
          stage: Onboarding
          touchpoints:
            - Lunar App onboards homeowner and connects local Eaton smart breakers
            - Lunar AI generates daily custom dispatch plan saving $338/year avg.
          owner: Lunar Mobile App & Lunar AI
        - label: 加入 VPP 项目
          stage: Activation
          touchpoints:
            - One-tap enrollment into utility, CCA, or retailer VPP programs
            - Customizable battery reserve levels (minimum 20% backup reserve)
          owner: Lunar App & Gridshare DERMS
        - label: 电网调度与激励兑现
          stage: Retention
          touchpoints:
            - Automated peak dispatch earning homeowners $464/year avg.
            - Severe weather alerts trigger automatic 100% pre-storm charging
          owner: Gridshare Platform & Utility
        - label: 设备群扩容与多设备协同
          stage: Expansion
          touchpoints:
            - White-label app integration for municipal CCAs and retail energy partners
            - Co-optimization expanding to EV chargers, heat pumps, and hot water
          owner: Lunar Enterprise & CCA Partners
    approximationNotes: 旅程阶段和触点反映了公开记录中的客户工作流，覆盖直销、合作伙伴和 CCA 部署渠道。
    claimRefs:
