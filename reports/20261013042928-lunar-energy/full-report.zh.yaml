            body: Lunar Energy 的 $232M 融资联盟和 2,000+ 次部署确立了其明确的品类存在感，但由于投后估值和单位毛利均未披露，投资者在审阅经审计财务报表前，应将入场倍数视为偏高。
            calloutType: recommendation
