      - number: '5.3'
        title: 部署规模、竞争差异化与技术风险
        blocks:
          - type: paragraph
            body: >
              Lunar 的技术栈通过两条主线实现差异化：易安装的硬件结合直流优化，以及与供应商无关的软件聚合。传统交流耦合储能系统需要经过多级冗余逆变器，存在往返转换损耗；Lunar
              的直流架构则最大化往返效率，并把太阳能优化和智能切换装入预配置的一体化机箱，以减少安装商调试时间和现场错误。此外，Gridshare 车队管理软件将第三方逆变器、电池、电动车和智能恒温器与 Lunar
              原生硬件整合，使公司更像住宅能源车队的操作系统，而不是孤立的硬件供应商。Sunrun 等主要渠道合作伙伴在新英格兰、夏威夷和波多黎各的区域公用事业项目中使用
              Gridshare。不过，这种混合战略也带来重大产品和运营风险。在硬件端，Lunar 面临激进的制造扩张压力：公司依托 2026 年初完成的 $232 million C、D
              轮融资，计划把加州已部署的数千台设备扩大到 2026 年底的 20,000 台，并在 2028 年达到年产 100,000
              台。十二个月内将专用电力电子和电池包组装规模扩大五倍，会带来严重供应链脆弱性、电芯采购风险和工厂良率挑战。在软件端，编排多供应商硬件车队使 Gridshare 暴露于第三方固件更新、住宅蜂窝网络和 Wi-Fi
              通信中断，以及公共 API 和模型上下文协议（MCP）端点带来的复杂网络安全攻击面。
