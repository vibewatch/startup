      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月，Lunar Energy 宣布一项规模达 $232 million 的融资方案，其中包括 $102 million 的 D 轮融资和此前未宣布的 $130 million C 轮融资。D
              轮由 B Capital 和 Prelude Ventures 领投，Activate Capital 牵头 C 轮，Sunrun、SK Group、Itochu Corporation 和 DCVC
              等战略及风险投资方参与支持。Wilson Sonsini Goodrich & Rosati 为该交易提供法律顾问服务。纵观融资历史，Lunar Energy 累计融资额介于 $530 million 和
              $662 million
              之间，跻身美国资本最充足的私有分布式能源企业之列。尽管资本实力雄厚，投后估值标记、清算优先权顺位和股权结构表瀑布机制仍严格保密。由于缺少经验证的投后估值指标，投资判断存在显著不确定性：公司已有数亿美元的高级优先股资本，若退出不理想，次级股权和普通股股东将面临严重的优先权负担。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.3'
        title: 情景建模与估值倍数
        blocks:
          - type: paragraph
            body: >-
              给 Lunar Energy 估值，需要明确的多情景框架，在雄心勃勃的制造扩张与清洁能源宏观现实之间取得平衡。公司计划在 2026 年底前将本土产量提升至 20,000 台，并在 2028 年达到 100,000
              台，同时把 Gridshare 的覆盖范围扩展至多个区域输电组织。在乐观情景下，若这一轨迹伴随软件毛利扩张，企业价值可达 $1.8B 至 $2.5B，对应 4.0x 至 5.0x
              的综合倍数。基准情景中，产量稳步接近 20,000 台，但仍持续依赖 Sunrun 渠道，企业价值以 2.5x 至 3.0x 倍数计为 $800M 至
              $1.2B。悲观情景下，佐治亚州和华盛顿州的制造瓶颈叠加清洁能源融资整体收缩，将估值压低至 $300M 至 $500M，并触发严重损害普通股权益的优先权负担。更广泛的市场数据也支持这一谨慎判断：尽管 2025
              年能源储能领域的风险投资增长了 30%，企业储能融资总额却收缩；Northvolt 等欧洲电池制造商的高调硬件失败，凸显资本密集型清洁技术生产商所承受的严重估值惩罚。
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 最终建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              我们的结论是：继续研究，风险评级为高，估值偏高。Lunar Energy 已建立真实的运营信誉：住宅电池安装量超过 2,000 套，管理的 DER 容量达 650 MW，参与 VPP 的客户年收益已达到
              $464。其一线风险投资人联盟为执行本土制造路线图提供了现金跑道。然而，在缺少硬件与软件分拆后的经审计毛利率核算、经验证的 Sunrun 合作伙伴集中度明细，以及 C 轮和 D
              轮优先权结构透明度的情况下，投资者无法评估风险调整后回报，也无法为私募轮估值提供依据。投入资本前，尽调必须确认单位毛利走势、加州以外公用事业项目管线的转化率，以及完整的优先股清算分配瀑布。在查阅这些私有记录之前，按当前隐含的私募估值入场，可能是在软件级利润保护尚未建立时，为资本密集型硬件组装支付过高价格。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV014
