      - number: '5.2'
        title: Gridshare DERMS、AWS 基础设施与虚拟电厂编排
        blocks:
          - type: paragraph
            body: >
              Lunar 虽然制造专有住宅硬件，但其企业运营模式和车队管理依赖 Gridshare 软件平台；该平台既是分布式能源资源管理系统（DERMS），也是虚拟电厂（VPP）编排引擎。Gridshare 通过收购
              Moixa 获得，并在 Amazon Web Services（AWS）上重新架构，作为双边平台同时服务表后家庭能源管理（HEMS）和表前公用事业聚合。             
              针对单个家庭，专有算法读取实时公用事业费率结构、历史用电曲线、当地天气预报和太阳能发电模型，每日生成定制能源计划。对整个车队，Gridshare 将地理分散的储能聚合成可调度虚拟电厂，管理超过 650 MW
              的分布式能源资产，以及分布在美国、日本和欧洲超过 130,000 台设备上的 1.2 GWh 连接储能。在商业 VPP 部署中，例如其与加州 WestLight Energy（原 Peninsula Clean
              Energy）的合作，Gridshare 在维持项目约束的同时执行动态负荷转移和峰值需求削减。为保持家庭用户信任并确保恶劣天气下电池可用，Gridshare
              强制执行严格的运营防护：平台在电网支持事件期间保护最低的客户自选电池储备，通常为容量的 20% 至 30%；一旦触发恶劣天气警报，系统会自动暂停调度，并在充电时将电池充至 100%
              容量。支撑这套运营逻辑的是无服务器 AWS 基础设施：AWS IoT Core 负责 MQTT/HTTPS 遥测，AWS Lambda 和 AWS Step Functions 负责调度流程，Amazon ECS
              on Fargate 负责容器化预测工作负载，DynamoDB 负责低延迟运营状态；整体每年处理近 178 terabytes 的遥测数据。
