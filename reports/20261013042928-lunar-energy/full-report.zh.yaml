            body: >-
              长期护城河的稳固性受到老牌企业渠道力量和公共虚拟电厂补贴波动的显著威胁。硬件无关的 DERMS
              软件一旦嵌入公用事业合作伙伴的运营调度流程，就会形成有意义的切换壁垒；但家庭用户的锁定主要仍由硬件决定。专有逆变器协议和电气副面板配置，使用户难以同时使用多个竞争聚合商。此外，Tesla 和 Enphase
              拥有远超 Lunar 技术人员规模的认证安装商队伍；当 Lunar 试图把年产量从 10,000 台扩大到 2028 年的 100,000 台时，这会造成渠道瓶颈。监管不确定性又放大了扩张风险，例如州长
              Gavin Newsom 否决加州 Demand Side Grid Support（DSGS）项目资金，打乱了 Lunar 核心地理市场公共 VPP 激励的可预测性。
