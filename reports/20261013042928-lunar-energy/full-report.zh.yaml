  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Lunar 面向的市场由两个相互连接的层次组成。第一层是表后住宅硬件：模块化电池、太阳能优化、逆变器和家庭电气控制。第二层是 Gridshare
              软件，为公用事业、社区选择聚合商、能源零售商及其他车队运营商协调电池和其他可调节设备。因此，本分析纳入一体化家庭能源硬件、安装与调试、设备管理、客户注册、车队监控、优化和 VPP
              调度的支出；不纳入表前公用事业级储能、发电资产、输电基础设施，以及未与储能或可控负荷配套的独立屋顶太阳能。


              现状并不只是换一个电池品牌。家庭用户可以继续使用普通电网服务、只使用太阳能而不配储能、安装仅用于备用的系统，或不参加 VPP。公用事业或聚合商也可以分别运营面向单类设备的系统，而不是多设备平台。Lunar
              表示，Gridshare 可以整合不同制造商的电池、电动车及充电器、恒温器和热水器。这种广度把软件机会扩展到了 Lunar 硬件之外，但现有资料没有按硬件、软件或电网服务活动拆分收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 受证据约束的市场规模与客户经济性
        blocks:
          - type: paragraph
            body: >
              现有来源支持几种规模观察角度，但没有一种能给出美元市场规模。Mercom 报道称，整个储能行业的风险投资在 2025 年达到 $4.8 billion，涉及 75 笔交易，较 2024 年 84 笔交易的
              $3.7 billion 增长 30%。这衡量的是更广泛行业的资本形成，而非住宅需求。Lunar 另称，其在多个大洲管理着 650 MW
              设备，并在商业化第一年于加州部署了数千套系统。这些数字说明了运营触达范围，但都没有披露设备组合、付费软件席位、签约容量、收入或可服务人口。


              客户经济性提供了更窄的采用视角。Lunar 报告称，参与客户在 2025 年从 VPP 项目中平均获得 $464；Lunar System 用户通过其优化，相比标准电池自发自用模式平均多节省
              $338。这是公司报告的两项不同收益，不能相加成普遍适用的年度回报：披露来源没有提供客户群规模、分布、地理构成、税务处理、硬件价格、融资成本或持续性。因此，可信的 TAM/SAM/SOM
              需要外部部署数量、安装价格、符合条件的家庭数量、项目可用性和公用事业辖区经济性。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >
              采购体系具有多方参与者。家庭用户使用设备，并可能直接付款或通过融资购买；安装商影响产品选择并承担实施风险；公用事业、CCA
              和能源零售商发起项目或采购编排能力；车队运营商则需要监控、调度和客户沟通。WestLight Energy 公布的项目说明了这条链条：WestLight 负责项目目标，Gridshare 是 VPP
              引擎，Haven Energy 负责客户招募、协议和安装承包商，硬件合作伙伴供应电池。Lunar 表示，Gridshare 的调度目标是覆盖可用车队能源的 95% 以上，同时维持 20% 的最低储备。


              采用取决于当地条件，并非自动发生。Lunar 支持材料称，VPP 参与仅限于有支持项目的地区，并要求硬件兼容；材料也承认，参与可能提高客户电费，尽管 Lunar
              预计项目价值可以抵消这部分增加。在一次行业访谈中，一名 Lunar
              高管将动态费率、不断变化的市场规则、节省、便利性和信任列为决定性因素，并警告部分第三方所有权提供商可能失败。这些是公司观点而非独立预测，但它们指出了尽调重点：项目层面的净收益、退出选择与储备行为、安装商和融资交易对手质量、监管批准，以及续约或留存证据。
            claimRefs:
