  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 系统化决策路径，串联资本化情况、运营验证、尽调缺口、下行风险、估值立场与“继续研究”建议。
    approximationNotes: null
    data:
      nodes:
        - id: capital-scale
          label: 资本与规模锚点
          description: 2026 年通过 C/D 轮融资获得 $232M；各轮累计融资超过 $500M-$662M。
        - id: operational-traction
          label: 运营足迹
          description: 已部署 2,000+ 套户用电池系统，并在 Gridshare 上协调 650 MW / 150k 套 DER。
        - id: unit-value-proof
          label: 客户与 VPP 价值
          description: 有记录显示，AI 优化每年为客户节省 $338，VPP 项目每年为客户节省 $464。
        - id: governance-gaps
          label: 财务与估值不透明
          description: 没有经审计的财务报表，投后估值保密，清算优先权分配顺序也未披露。
        - id: concentration-risks
          label: 集中度与市场风险
          description: 高度依赖核心合作伙伴 Sunrun，暴露于加州单一区域，同时还面临更广泛的储能行业融资逆风。
        - id: valuation-stance
          label: 估值立场：偏高
          description: 资本密集度高、优先股压顶，因此需要以克制的估值倍数入场。
        - id: final-verdict
          label: 最终结论：继续研究
          description: 保持积极跟踪；在单位毛利和资本结构表条款得到验证前，暂缓直接投资。
      edges:
        - from: capital-scale
          to: operational-traction
        - from: operational-traction
          to: unit-value-proof
        - from: unit-value-proof
          to: governance-gaps
        - from: governance-gaps
          to: concentration-risks
        - from: concentration-risks
          to: valuation-stance
        - from: valuation-stance
          to: final-verdict
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV008
      - CV011
      - CV014
