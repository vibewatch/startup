      - number: '3.3'
        title: 定价模式、GTM 分销与客户经济性
        blocks:
          - type: paragraph
            body: >-
              住宅储能的变现分为两类：通过认证太阳能安装商网络进行传统的前期硬件销售，以及由公用事业发起的虚拟电厂收入分成。在传统模式下，Lunar 系统与 Tesla Powerwall 3 和 Enphase IQ 5P
              争夺安装商货架位置，交钥匙安装成本通常在 $12,000 至 $25,000 之间，尚未扣除联邦税收抵免。为加快回本，Lunar 借助 Gridshare 提供双重价值：公司称参与客户在 2025 年平均获得
              $464 的公用事业 VPP 收入，并通过 AI 驱动的电费优化节省 $338。相反，得州 Base Power 等颠覆性进入者完全绕开消费者购买硬件，改为以较低前期费用租赁电池并赚取电力交易利润。Lunar
              的主要市场进入护城河高度依赖核心股权合作伙伴 Sunrun；Sunrun 在加州及十多个区域市场部署 Gridshare，降低了公司独立直面消费者获客的摩擦。
