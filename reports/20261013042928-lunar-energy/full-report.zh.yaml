      - number: '6.3'
        title: 具名客户部署与公用事业合作
        blocks:
          - type: paragraph
            body: >-
              公开客户证据确认了机构聚合商和市政清洁能源机构在企业规模上的实质性验证。Sunrun 是 Lunar 最重要的部署伙伴；在 2023 年夏季加州热浪紧急事件期间，Lunar Gridshare 成功调度
              Sunrun 的住宅电池，合作伙伴称这是美国历史上规模最大的家用电池 VPP 事件。2026 年 8 月，WestLight Energy（原 Peninsula Clean Energy）宣布与 Lunar
              Enterprise 合作，运营其住宅电池负荷转移项目。值得注意的是，该项目面向参加 WestLight Solar + Battery Savings Program
              的低收入居民，以州级激励支持免费太阳能和储能硬件，换取居民参与自动削减电网负荷。除加州市政聚合商外，零售电力供应商 Octopus Energy 还与 Lunar 在得州合作，将家用电池接入动态 ERCOT
              零售电价，测试住宅储能聚合能否在竞争激烈、受天气影响的批发市场中脱离补贴性净计量而发展。
            claimRefs:
