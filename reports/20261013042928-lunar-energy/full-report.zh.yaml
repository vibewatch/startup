        title: 展示项
        blocks:
          - type: callout
            title: 家庭用户留存的双重经济价值驱动
            body: Lunar Energy 将自动表后电费节省（平均 $338/年）与前期及持续性的 VPP 电网参与激励（平均 $464/年）结合，形成每年 $800 以上的价值组合，强化客户满意度并缩短回本周期。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: 聚合商与地域渠道集中
            body: >-
              Lunar 已部署的住宅车队和 VPP 容量中有相当比例依赖 Sunrun 的客户获取引擎和加州批发市场。如果不能把分销拓展到独立认证经销商和 CAISO/ERCOT 以外的市场，Lunar
              将暴露于渠道合作伙伴重新谈判和当地监管变化。
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、并网与合规风险
        blocks:
          - type: paragraph
            body: >-
              分布式虚拟电厂的部署速度根本上受州公用事业委员会监管和当地配电公司（EDC）并网电价约束。在新泽西州 BPU 案卷 QO26030099 等监管程序中，Lunar Energy
              指出，双向电池输出并网缺乏标准化路径；公用事业经常设置任意输出上限，并进行持续数月的工程审查。表后储能系统若没有获授权的输出许可，就无法最大化灵活性或实现电网服务收入。同时，参与先进公用事业灵活性项目还需要严格遵守网络安全要求，包括
              SOC 2 Type II 认证和 NIST SP 800-82 工业控制标准，以及用于管理高分辨率区间电表数据的 Green Button Connect OAuth 2.0 隐私框架。虽然 Lunar
              System 已取得 UL 9540A 第 6 版热失控认证，但不同市政消防规范和当地许可退距要求仍持续造成区域安装摩擦。
            claimRefs:
              - CR001
              - CR005
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR007
      - number: '7.2'
        title: 运营、硬件质量与网络安全漏洞
        blocks:
          - type: paragraph
            body: >-
              运营分布式住宅电池车队，会让设备端和电网端的运营与可靠性漏洞叠加。数百个家庭电池在低价夜间时段同时自动充电，可能导致配电馈线电压严重下降；Lunar 的 Gridshare
              平台必须执行复杂的馈线感知限流，以防局部电路跳闸。硬件上，Lunar 使用 5 kWh 镍锰钴锂（NMC）电池块，而不是磷酸铁锂（LFP）化学体系。NMC
              虽拥有较高体积能量密度，却会增加对钴、镍原材料价格波动的暴露，并要求更严格的热管理防护。此外，实体组装集中在佐治亚州和华盛顿州的制造工厂。任何局部运营中断、设备故障或区域运输瓶颈都会直接威胁硬件交付计划；软件调度错误则可能在严重电网停电前耗尽客户电池储备。
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: 合作伙伴集中与供应链依赖
        blocks:
          - type: paragraph
            body: >-
              Lunar Energy 在上游商业分销和下游现场安装两端都存在明显交易对手集中。Sunrun 是 Lunar 的主导住宅合作伙伴，在包括新英格兰、夏威夷和波多黎各在内的十多个重点区域市场部署
              Gridshare；如果 Sunrun 转向替代电池硬件或自有 DERMS 平台，Lunar 的商业销量将受到严重冲击。在 WestLight Energy 和 Central Coast Community
              Energy（3CE）等社区选择聚合商项目中，Lunar 依赖 Haven Energy 等外部承包商负责客户获取、签约和实体安装。3CE 合作设定了激进的调度里程碑：2026 年底达到 5 MW，2030
              年扩大到 30 MW；如果当地安装能力不足，Lunar 可能面临绩效罚款或无法收回客户获取费用。Sunrun 和 Itochu Corporation 等战略资本提供方降低了融资风险，但也加深了运营耦合。
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR010
              - CR011
      - number: '7.4'
        title: 资本密集度、模型风险与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              同时开发专有住宅硬件和云端 DERMS 软件，会带来巨大的资本需求和持续的营运资金摩擦。尽管 Lunar 在 2026 年初之前通过 C、D 轮融资获得 $232 million，但私人投资者给出的 $1
              billion
              估值标记已经抬高了商业预期。如果住宅电池硬件利润率在低成本老牌储能供应商的价格竞争下被压缩，仅靠软件收入可能无法覆盖硬件研发现金消耗。客户端如果动态公用事业输出补偿无法跑赢电池衰减和峰时充电成本，参与 VPP
              项目会带来电费波动，增加客户流失风险。击穿核心论点的触发因素包括：公用事业持续拒绝采用双向输出电价、NMC 模块现场保修故障率达到较高水平，或 Sunrun 缩减与 Lunar 的 Gridshare
              分销关系。尽调必须跟踪保修准备金会计处理和安装商单位经济性。
            claimRefs:
              - CR006
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管并网与渠道集中定义核心脆弱性
            body: >-
              Lunar Energy 的增长路径高度暴露于两个相互依赖的瓶颈：双向电池外送费率所需的公用事业并网审批周期，以及早期分销渠道的商业集中度，例如 Sunrun
              和加州各地区的社区选择聚合商。在多地区公用事业并网标准化、直接安装商渠道实现多元化之前，局部监管摩擦会直接压制车队容量增长。
            calloutType: risk
            claimRefs:
              - CR001
