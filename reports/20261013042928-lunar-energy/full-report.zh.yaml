      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 客户价值取决于具体项目，并非普遍回本
            body: >-
              Lunar 报告的 $464 平均 VPP 收益和 $338 平均增量优化节省，是 2025
              年两项独立观察。在缺少客户群、费率、地理位置、硬件价格、融资或持续性数据的情况下，不应把它们相加为普遍适用的年度回报，也不应据此推导回本周期。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
          - type: callout
            title: 采用依赖本地项目与可信融资
            body: Lunar 自身材料称，VPP 使用权取决于地点和兼容硬件，其高管访谈也警告第三方所有权模式可能失败。因此，项目资格、电费影响、客户控制权、安装商执行能力和融资交易对手的持续性，都需要逐个市场尽调。
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与核心竞争者画像
        blocks:
          - type: paragraph
            body: >-
              住宅分布式能源储能市场包括成熟设备制造商、专业电力电子供应商、相邻的虚拟电厂聚合商，以及新兴零售能源挑战者。Lunar Energy 直接挑战 Tesla Energy（Powerwall 3）和 Enphase
              Energy（IQ Battery 5P）等住宅电池龙头，也面对传统发电机供应商 Generac（PWRcell）和逆变器制造商 SolarEdge。在得州等区域市场，Base Power Company
              等资金充足的新进入者正在探索替代资本化结构，通过补贴租赁电池配合零售电力供应商运营，获取 ERCOT 套利收益。与此同时，Octopus Energy 和 Voltus
              等软件及零售能源专业公司，在不制造专有电池的情况下，将住宅清洁能源设备聚合到批发容量市场。Lunar 采用混合策略来区分自身：制造专有模块化硬件，同时把 Gridshare
              推向第三方公用事业和安装合作伙伴，作为覆盖整个车队的 DERMS 引擎。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP012
              - CP014
          - type: table
            tableRef: TP001
