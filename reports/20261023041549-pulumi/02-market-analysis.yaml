schemaVersion: "report-v2"
artifact: market-analysis
slug: pulumi
runDate: 2026-10-23
company:
  name: Pulumi
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Pulumi participates in a global infrastructure-as-code category that The Business
    Research Company sizes at $2.03 billion in 2026 and forecasts at $5.25 billion in
    2030, but other published estimates use different vintages and boundaries. Public
    evidence supports platform-engineering demand and a developer-led buyer thesis,
    while Pulumi-specific SAM, SOM, budget ownership, and conversion remain unquantified.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The defensible core market is paid tools and services used to provision and manage
      infrastructure through machine-readable definitions, rather than all cloud spend.
      The Business Research Company explicitly includes tools and services across
      provisioning, orchestration, configuration, security and compliance, monitoring,
      integration, support, and training. For Pulumi, the most relevant slice is
      programmatic multi-cloud infrastructure automation for developer and platform
      teams. Adjacent cloud management, secrets, policy, and internal-developer-platform
      spend can expand wallet share, but counting all of it as IaC would overstate the
      addressable market. Status-quo substitutes include manual console or API work,
      cloud-native provisioning systems, Terraform or OpenTofu workflows, and
      application platforms that abstract infrastructure provisioning away.
    claimRefs: [CM001, CM011, CM012, CM013, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and estimate conflict
    body: >-
      The strongest current top-line estimate in the assigned evidence is $2.03 billion
      of global IaC revenue in 2026, rising to $5.25 billion in 2030 at a stated 26.8%
      CAGR. That should not be blended with ByteIota's $2.1 billion 2026 and $3.3 billion
      2030 figures, The New Stack's citation of a forecast above $3.3 billion by 2030,
      or GeekWire's 2023 citation of $2.3 billion by 2027. The gaps are analytical, not
      rounding noise: publishers use different dates, component scopes, and methods,
      while only some expose their market definition. These values establish category
      order of magnitude and growth direction, not Pulumi's serviceable or obtainable
      market. A credible SAM/SOM requires Pulumi's paid-account profile, geographic mix,
      eligible cloud estate, pricing, attach rates, and win rates.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Public evidence points to developers and platform engineers as daily users, with
      infrastructure or platform leadership as the likely economic buyer and budget
      owner. Zaira identifies self-service platform teams, polyglot organizations, and
      mixed-cloud estates as strong Pulumi use cases; CNCF separately finds that 28% of
      surveyed organizations have a dedicated platform-engineering team and 41% use a
      multi-team collaboration model for internal platforms. Adoption is therefore more
      likely to start with a workload or platform abstraction, prove repeatability and
      governance, and then expand across teams than to begin as a company-wide tool
      replacement. Security, compliance, and AI workloads can raise urgency, but the
      evidence does not disclose who signs Pulumi contracts, the budget line used, or
      how platform-team prevalence converts into paid demand.
    claimRefs: [CM008, CM009, CM010, CM011, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Platform standardization, multi-cloud complexity, policy automation, and AI
      infrastructure are credible demand drivers. CNCF reports that 35% of surveyed
      organizations use a hybrid platform approach for AI workloads, indicating that
      buyers often extend existing platforms rather than create separate stacks.
      Adoption constraints remain material: Pulumi's general-purpose-language model
      shifts complexity into dependency, runtime, and code-structure discipline;
      provider behavior can inherit upstream Terraform constraints; and teams may prefer
      a cloud-native or more standardized ecosystem. A vendor survey reported by The New
      Stack also found broad IaC difficulty and low maturity, although its sponsor makes
      it directional rather than an independent benchmark. Valuation should therefore
      reward category growth only after Pulumi demonstrates paid penetration, durable
      expansion, and lower migration friction; a broad market CAGR alone cannot support
      a company-specific revenue multiple.
    claimRefs: [CM010, CM012, CM013, CM014, CM016]
callouts:
  - calloutType: insight
    title: Category TAM is not Pulumi SAM
    body: >-
      The $2.03 billion 2026 figure covers global IaC tools and services across many
      architectures and end users. Pulumi's reachable spend must be narrowed by buyer
      fit, geography, cloud estate, pricing, and competitive win rate.
    claimRefs: [CM001, CM002, CM015]
  - calloutType: risk
    title: Estimate spread is methodological
    body: >-
      Published 2030 estimates range from $3.3 billion to $5.25 billion in the retained
      evidence. The difference should remain visible until detailed definitions and
      methods can be reconciled.
    claimRefs: [CM003, CM005, CM006]
tables:
  - id: TM001
    title: Market definition and spend boundary
    columns:
      - Segment or substitute
      - Included spend
      - Excluded spend
      - Buyer or payer
      - Relevance to Pulumi
    rows:
      - - Core IaC tools
        - Provisioning, orchestration, configuration, policy, and managed workflow software
        - Underlying cloud consumption and unrelated developer tools
        - Infrastructure or platform engineering leadership
        - Direct category and primary competitive budget
      - - IaC services
        - Consulting, integration, deployment, support, maintenance, and training
        - General cloud migration work not tied to IaC
        - Infrastructure leadership and transformation programs
        - Addressable through services or ecosystem, but not equivalent to recurring software revenue
      - - Internal developer platforms
        - Self-service infrastructure workflows and embedded provisioning automation
        - Application-platform spend with no infrastructure-management function
        - Platform engineering leaders
        - Strong adjacency through Automation API and reusable abstractions
      - - Cloud security and management
        - Secrets, policy, compliance, asset visibility, and remediation tied to infrastructure workflows
        - Standalone security categories with no IaC connection
        - Infrastructure, security, or cloud-operations leadership
        - Expansion adjacency; count only demonstrated product attach
      - - Status quo and substitutes
        - Manual console or API work, cloud-native templates, Terraform or OpenTofu, and application abstractions
        - None; these are alternative ways to perform the job
        - Existing cloud, DevOps, or application teams
        - Constrains conversion and creates migration or workflow switching costs
    notes: >-
      Boundary is synthesized from TBRC's category definition and independent or
      competitor descriptions of Pulumi use cases; adjacency rows are analytical
      classifications and must not be added to the core market estimate.
    claimRefs: [CM001, CM011, CM012, CM013, CM014, CM015]
  - id: TM002
    title: Published infrastructure-as-code sizing lenses
    columns:
      - Publisher
      - Year or period
      - Geography
      - Value
      - Growth
      - Method or boundary disclosed
      - Confidence and limitation
    rows:
      - - The Business Research Company
        - "2026"
        - Global
        - "$2.03B market revenue"
        - "27.3% from 2025 to 2026"
        - Tools and services; multiple component, infrastructure, organization-size, and end-user segments
        - Medium; current and defined, but detailed calculations are not public in the fetched page
      - - The Business Research Company
        - "2030 forecast"
        - Global
        - "$5.25B market revenue"
        - "26.8% CAGR for 2026-2030"
        - Same tools-and-services market definition
        - Medium; forecast inherits publisher assumptions not fully visible in the fetched page
      - - ByteIota
        - "2026"
        - Global
        - "$2.1B market"
        - "28.2% annual growth"
        - Article asserts platform-engineering-driven adoption
        - Low; no transparent primary methodology in the fetched text
      - - ByteIota
        - "2030 forecast"
        - Global
        - "$3.3B market"
        - Not separately stated for this interval
        - Same article-level estimate
        - Low; conflicts materially with TBRC's 2030 forecast
      - - GeekWire citing a market report
        - "2027 forecast, reported in 2023"
        - Global
        - "$2.3B market"
        - Not stated
        - Underlying report methodology not reproduced
        - Low-medium; historical secondary citation
      - - The New Stack citing Fortune Business Insights
        - "2030 forecast, reported in 2024"
        - Global
        - "More than $3.3B"
        - From $908.7M in 2023
        - Underlying analyst definition not reproduced
        - Medium; reputable secondary source but older forecast and unclear boundary
    notes: >-
      Values are preserved as published and are not averaged because vintages, boundaries,
      and methods differ. They size the broad global category, not Pulumi's SAM or SOM.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM007]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Primary user
      - Likely buyer or payer
      - Workflow and budget owner
      - Adoption trigger
    rows:
      - - Developer-led multi-cloud teams
        - Software and infrastructure engineers
        - Infrastructure or platform engineering leadership
        - Cloud automation and developer-productivity budget
        - Need for familiar languages, reusable abstractions, and one multi-cloud model
      - - Internal developer platform teams
        - Platform engineers and application developers
        - VP or head of infrastructure or platform
        - Platform tooling and self-service enablement
        - Embedding provisioning in portals or APIs through Automation API
      - - Enterprise governance teams
        - Infrastructure, security, and compliance operators
        - Infrastructure or security leadership
        - Cloud governance, policy, secrets, and audit workflows
        - Need for standardized controls across teams and clouds
      - - Single-cloud or operations-led teams
        - Cloud operations and DevOps practitioners
        - Cloud-platform owner
        - Native-cloud or established IaC tooling budget
        - Pulumi adoption requires benefits beyond first-party semantics or Terraform familiarity
      - - Low-maturity or manually managed organizations
        - Generalist developers and operators
        - Technology leadership
        - Project or cloud-operations budget
        - Configuration inconsistency, provisioning queues, or compliance pressure
    notes: >-
      Buyer and budget-owner labels are evidence-backed inferences from documented use
      cases and platform-team structures; no retained source discloses Pulumi's actual
      contract signatories, ACV by segment, or procurement conversion.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Evidence-constrained addressability layers
    type: pyramid
    summary: >-
      The public evidence quantifies the broad global category and selected demand
      signals, but not Pulumi-specific SAM or obtainable share.
    data:
      items:
        - label: Global IaC tools and services
          value: "$2.03B in 2026"
          detail: TBRC global market revenue across tools and services.
        - label: IaC tools subset
          value: Not separately disclosed
          detail: Services must be removed before treating the estimate as software spend.
        - label: Programmatic and imperative IaC
          value: Not separately disclosed
          detail: Pulumi competes most directly where code-based infrastructure fits team workflows.
        - label: Dedicated platform-team demand
          value: "28% of surveyed organizations"
          detail: CNCF and SlashData survey signal; not a spending share or Pulumi penetration rate.
        - label: Hybrid AI-platform demand
          value: "35% of surveyed organizations"
          detail: CNCF and SlashData survey signal using a different denominator from market revenue.
        - label: Pulumi obtainable share
          value: Not publicly isolated
          detail: Requires paid-account, pricing, win-rate, expansion, geography, and churn evidence.
    approximationNotes: >-
      Layer order is a conceptual narrowing path, not a proportional scale or conversion
      funnel. Dollar values and survey percentages have different denominators; unknown
      layers remain unquantified rather than being estimated.
    claimRefs: [CM001, CM002, CM008, CM010, CM015, CM016]
