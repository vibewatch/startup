    columns: [User job, Starting workflow, Pulumi mechanism, Potential benefit, Limitation]
    rows:
      - ["Author infrastructure", "Provider-specific configuration or scripts", "Supported programming-language SDK", "Reuse application-language skills and tooling", "Programming-language flexibility still requires infrastructure expertise"]
      - ["Plan and apply changes", "Manual or tool-specific execution", "Desired-state plan with create, update, and delete actions", "Reviewable change intent before apply", "Public sources do not quantify preview or rollback accuracy"]
      - ["Separate environments", "Ad hoc configuration and state files", "Stacks with remote backend options", "Repeatable environment boundaries and collaboration", "Backend recovery and concurrency behavior need testing"]
      - ["Protect configuration secrets", "Plaintext or separately managed credentials", "Encrypted config with Pulumi-managed or external keys", "Reduced plaintext handling and key-choice flexibility", "Rotation and leakage outcomes are not disclosed"]
      - ["Remediate policy violations", "Detection followed by manual engineering work", "Neo-generated fixes with guardrails and approvals", "Potential reduction in remediation effort", "No independent accuracy or blast-radius metrics"]
    notes: "Potential benefits are mechanism-based hypotheses or company claims, not measured productivity outcomes on a common customer population."
    claimRefs: [CE001, CE003, CE004, CE005, CE011]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Principal technical risk]
    rows:
      - ["Language SDK and host", "Express desired infrastructure and execute user code", "Language runtimes and package ecosystems", "Runtime drift and language-specific behavior"]
      - ["Engine and resource graph", "Calculate and apply resource changes", "Open-source engine and provider schemas", "Incorrect diffs or partial updates"]
      - ["Providers", "Translate resources to cloud and SaaS APIs", "Upstream APIs and provider release cadence", "Coverage gaps and breaking upstream changes"]
      - ["Stacks, state, and backends", "Track resource identity, configuration, and history", "Pulumi Cloud or customer-managed storage", "Locking, corruption, recovery, and portability"]
      - ["ESC, policy, and identity", "Protect configuration and constrain changes", "Secret stores, keys, policy packs, and access controls", "Privilege expansion or misconfigured policy"]
      - ["Insights, Operator, and Neo", "Inventory, trigger deployments, and remediate issues", "Cloud credentials, Kubernetes, resource context, and model output", "False positives, rollback failure, and unsafe automation"]
    notes: "This is an analytical operating model assembled from public product descriptions, not a verified diagram of Pulumi's internal service topology."
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE011]

figures:
  - id: FE001
    title: Pulumi product architecture map
    type: stack
    summary: The product layers authoring, execution, state, controls, and managed operations around the core IaC engine.
    data:
      layers:
        - name: Developer interface
          label: Developer interface
          detail: Author infrastructure in familiar languages and review intended changes.
          items:
            - label: Language SDKs
              detail: TypeScript, JavaScript, Python, Go, .NET, Java, YAML, and HCL.
            - label: CLI and plan workflow
              detail: Preview and apply create, update, and delete actions.
        - name: Infrastructure execution
          label: Infrastructure execution
          detail: Resolve programs into provider-backed resource operations.
          items:
            - label: Apache-2.0 engine
              detail: Open-source execution foundation.
            - label: Resource providers
              detail: Connect major clouds, Kubernetes, and service APIs.
        - name: State and configuration
          label: State and configuration
          detail: Maintain environment-specific resource identity and settings.
          items:
            - label: Stacks
              detail: Organize state and configuration.
            - label: Backends
              detail: Use Pulumi Cloud or customer-managed object storage.
        - name: Security and governance
          label: Security and governance
          detail: Protect secrets and constrain infrastructure changes.
          items:
            - label: ESC and encrypted configuration
              detail: Connect secrets and environment configuration.
            - label: Policy as Code
              detail: Evaluate infrastructure against authored controls.
        - name: Delivery and visibility
          label: Delivery and visibility
          detail: Run deployments and inspect cloud resources.
          items:
            - label: Deployments and Kubernetes Operator
              detail: Execute or trigger infrastructure updates.
            - label: Insights
              detail: Inventory, search, visualize, and assess resources.
        - name: AI-assisted operations
          label: AI-assisted operations
          detail: Generate infrastructure or policy-remediation actions with review boundaries.
          items:
            - label: Neo
              detail: Propose or apply policy fixes under configurable approvals.
    approximationNotes: "Layer order is an authored workflow synthesis; it does not imply that every module shares one runtime, data plane, or availability boundary."
    claimRefs: [CE001, CE002, CE003, CE006, CE010, CE013]

callouts:
  - calloutType: strength
    title: A coherent developer-to-governance expansion
    body: Pulumi uses its language and provider foundation to extend from provisioning into reusable platform workflows, secrets, inventory, policy, and deployment automation.
    claimRefs: [CE001, CE002, CE006, CE007, CE008]
  - calloutType: risk
    title: Breadth increases the validation surface
    body: State, provider, identity, Kubernetes, and AI-remediation boundaries create failure modes that repository activity and company capability announcements do not quantify.
    claimRefs: [CE004, CE009, CE011, CE014, CE016]

