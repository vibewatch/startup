company:
  name: Pulumi
chapter:
  number: 8
  title: Valuation
  summary: >-
    Pulumi has credible adoption and product-expansion signals, but the public financing
    record conflicts and does not expose the operating or preference data needed for a
    defensible entry valuation. The evidence supports a research-more recommendation with
    medium confidence, high risk, and no supportable precise fair-value range.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The appropriate public-evidence recommendation is research-more, not buy. StartupHub
      reports a $145 million Series D at a $1.5 billion post-money valuation in October
      2025, while Tracxn still identifies Pulumi as Series C with $99 million raised. The
      independently reported and company-issued 2023 record agrees on a $41 million Series
      C and $99 million of total funding at that time, but it does not verify the reported
      later round. This conflict prevents a clean current capitalization baseline. Public
      sources also do not provide ARR, gross margin, retention, burn, liquidation
      preferences, or fully diluted ownership, so neither a revenue multiple nor a target
      return can be calculated responsibly. Entry discipline should therefore be tied to
      primary round documents and current operating data rather than the reported headline
      valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Pulumi can turn a developer-friendly infrastructure-as-code wedge
      into a broader control plane. Pulumi reported revenue doubling and more than 2,000
      customers in 2023; its current product page claims more than 4,000 companies in
      production; and The New Stack documented expansion into ESC and Insights alongside
      IaC. Those signals indicate commercial reach and product optionality, but they do not
      establish paid attach, retention, or margin quality. The anti-thesis is structural:
      one technical comparison says Terraform's provider ecosystem is roughly 2.7 times
      larger, while independent analysis warns that migrations and general-purpose-language
      abstractions can create switching costs and obscure blast radius. IBM's ownership of
      HashiCorp adds enterprise distribution behind the incumbent. Pulumi therefore merits
      diligence for upside, but not a platform premium without cohort evidence.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      The bull case requires the reported Series D to be verified and a paid-customer bridge
      to show durable expansion across IaC, ESC, Insights, governance, and AI workflows. The
      base case treats adoption as real but monetization and price as unresolved, keeping the
      company on a research-more posture until ARR quality and financing terms are available.
      The bear case combines incumbent ecosystem pressure, migration friction, and a
      down-round or preference overhang that transfers value away from a new common-equity
      investor. No numeric valuation range is supportable from the assigned public evidence:
      the necessary revenue denominator and capital terms are missing. Scenario probabilities
      should therefore be signaled by evidence milestones, not fabricated percentages. The
      central downside trigger is failure to reconcile the later financing claim or failure
      to show paid renewal and expansion after initial adoption.
    claimRefs: [CV001, CV007, CV009, CV010, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: comparables-and-exit
    title: Comparable context, exit readiness, and final asks
    body: >-
      The available comparables are contextual rather than valuation-grade. IBM completed
      its HashiCorp acquisition at a $6.4 billion enterprise value, demonstrating strategic
      value in infrastructure automation but not providing a direct multiple for the smaller,
      private Pulumi without revenue and margin comparability. Spacelift's $51 million Series
      C shows that adjacent infrastructure-orchestration companies can attract growth capital,
      yet its release provides no post-money valuation. These events support exit plausibility
      and competitive intensity, not a Pulumi price. Final diligence should obtain the signed
      Series D documents, capitalization table, preference stack, ARR and revenue bridge,
      gross margin, burn and runway, NRR and GRR, product-level attach, top-customer
      concentration, and renewal cohorts. The thesis breaks if those records do not reconcile
      or if expansion depends primarily on unmonetized community adoption.
    claimRefs: [CV011, CV012, CV016]
