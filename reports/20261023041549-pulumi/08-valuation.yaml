  evidenceGaps:
    - type: conflicting-data
      severity: blocking
      topic: financing
      missingEvidence: Primary documentation for the reported 2025 Series D, $1.5 billion post-money valuation, and current capitalization.
      whyItMatters: The financing baseline determines entry price, dilution, and ownership economics.
      diligencePath: Obtain signed financing documents, investor notices, and the fully diluted capitalization table.
      relatedQuestionRefs: [QV002, QV003, QV009, QV010]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: Current ARR, growth, gross margin, burn, runway, NRR, GRR, product attach, and customer concentration.
      whyItMatters: Adoption counts do not establish revenue quality, a supportable multiple, or a target return.
      diligencePath: Reconcile board reporting and audited financials to billing data and customer cohorts.
      relatedQuestionRefs: [QV001, QV005, QV006, QV008, QV009]
    - type: private-evidence-only
      severity: material
      topic: preference-overhang
      missingEvidence: Liquidation preferences, participation rights, seniority, option-pool treatment, and pro rata obligations.
      whyItMatters: Headline post-money valuation can materially overstate common-equity value after preference waterfalls.
      diligencePath: Review the charter, stock purchase agreement, side letters, and pro forma distribution waterfall.
      relatedQuestionRefs: [QV010]
