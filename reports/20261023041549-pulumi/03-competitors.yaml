    rows:
      - [Terraform, direct peer / incumbent, "Largest hiring pool and registry, according to env.dev", "Broad cloud and platform teams", "HCL ecosystem, mature workflows, commercial Terraform Cloud", "Business Source License since 2023; migration and governance costs remain"]
      - [OpenTofu, direct peer / substitute, "Linux Foundation fork; MPL 2.0", "Teams wanting HCL without BSL", "Terraform-compatible language, state format, and provider protocol", "Requires a distinct operating choice and does not provide Pulumi's general-purpose language model"]
      - [Spacelift, adjacent governance competitor, "Supports Pulumi, Terraform, OpenTofu, Kubernetes, CloudFormation, Ansible, and Terragrunt", "Multi-tool platform teams", "Concurrency-based pricing and cross-tool workflow policies", "Not a replacement for the underlying IaC engine"]
      - [env0, adjacent governance competitor, "Presented by env.dev as a Terraform-adjacent workflow option", "Teams standardizing CI/CD around infrastructure", "Workflow integration around IaC delivery", "Public assigned evidence does not establish comparative scale or pricing"]
      - [AWS CDK / CloudFormation, cloud-native substitute, "AWS-centered ecosystem", "AWS-first organizations", "Native cloud integration and narrower operational scope", "Less multi-cloud and not the same integrated Pulumi governance surface"]
      - [Crossplane, adjacent Kubernetes-native substitute, "Kubernetes-centered control-plane approach", "Kubernetes-native platform teams", "Infrastructure delivered through Kubernetes APIs", "Different operating model and evidence pool does not establish feature parity"]
      - [Humanitec, adjacent internal-developer-platform substitute, "Scale not established in assigned evidence", "Platform engineering teams", "Golden paths and self-service abstractions above infrastructure tools", "Company-issued positioning does not establish comparative outcomes"]
      - [Encore, infrastructure-from-code substitute, "Scale not established in assigned evidence", "Application teams seeking less infrastructure configuration", "Automates provisioning from application requirements", "Trades some granular infrastructure control for simplicity"]
      - [Internal platform or self-managed state, status quo / internal build, "Scale is organization-specific", "Teams with mature platform engineering capacity", "Maximum control over backends, workflows, and tooling", "Recurring maintenance, security, orchestration, and analytics labor remains internal"]
      - ["Manual console, CLI, or scripts", status quo substitute, "Scale is organization-specific", "Small or infrequently changing estates", "No platform migration or subscription required", "Weak repeatability, collaboration, and governance as complexity grows"]
    notes: >-
      Categories and limitations are analytical classifications based on the cited
      comparison and platform sources; scale signals are not comparable customer or
      revenue measures. Unknown fields are intentionally not estimated.
    claimRefs: [CP001, CP003, CP004, CP005, CP007, CP009, CP013, CP015, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Pulumi, Terraform, OpenTofu, Adjacent or status-quo option, Implication]
    rows:
      - [Infrastructure language, "TypeScript, Python, Go, C#, Java, YAML; HCL support also reported", HCL, HCL, "CloudFormation/Bicep use cloud-native DSLs; internal build uses existing languages", "Pulumi favors software-engineering-shaped infrastructure; HCL favors constraint and familiarity"]
      - [Provider reach, "Native packages plus Terraform/OpenTofu provider bridge", "Terraform Registry", "OpenTofu Registry", "Cloud-native tools concentrate on their own provider", "Bridge reduces but does not eliminate ecosystem diligence"]
      - [Testing and abstraction, "Host-language tests, functions, classes, packages", "Built-in or third-party testing and modules", "Built-in or third-party testing and modules", "Internal build depends on team practice", "Pulumi's advantage is conditional on engineering discipline"]
      - [State and collaboration, "Pulumi Cloud or DIY backends; Cloud provides history, RBAC, audit and secrets", "Configured backend or HCP Terraform", "Configured backend or third-party SaaS", "Self-managed state and CI", "Managed collaboration can reduce operator work but creates vendor and billing considerations"]
      - [Governance and policy, "Policy as Code, RBAC, audit, compliance and remediation surfaces described", "Commercial ecosystem and HCP Terraform", "Open-source core plus surrounding tools", "Spacelift/env0 provide cross-tool governance", "Pulumi can sell an integrated platform, while adjacent tools can aggregate multiple engines"]
      - [AI and cloud inventory, "Insights, search, AI-oriented products and Neo described", "Not established by assigned evidence", "Not established by assigned evidence", "Firefly reports AI interest and drift pain in the category", "Pulumi differentiation is plausible but independent outcome evidence is incomplete"]
    notes: >-
      Cells marked "not established" are evidence gaps, not negative findings.
      Feature descriptions combine independent comparison pages, a news report, and
      competitor-authored material; competitor-authored claims are not independent
      benchmarks.
    claimRefs: [CP002, CP003, CP005, CP006, CP009, CP012, CP015, CP016]
  - id: TP003
    title: Pricing, switching, and packaging comparison
    columns: [Option, Price or contract model, Included capability or cost driver, Discount or unknown, Strategic implication]
    rows:
      - [Pulumi Cloud Individual, "Always free; 500 deployment minutes per month reported", "Automatic state management, updates, secrets", "Assigned source does not establish enterprise conversion", "Low-friction entry supports adoption but does not show paid economics"]
      - [Pulumi Cloud Team, "$0.0005 per Pulumi credit and $0.01 per deployment minute above reported allowances", "Up to 10 users, five concurrency, unlimited stacks, CI/CD assistant, webhooks", "Usage can be difficult to predict because resources and deployment minutes are metered", "Managed collaboration monetizes operational activity"]
      - [Pulumi Cloud Enterprise, "$32,850 yearly AWS Marketplace price reported; sales quote otherwise", "Unlimited users and teams, RBAC, SAML/SSO, migration, advanced querying, 12x5 support", "Exact quota and negotiated terms unknown", "Enterprise control plane is a monetizable wrapper around open-source IaC"]
      - [Pulumi Business Critical, "$50,000 yearly Azure Marketplace starting price reported; sales quote otherwise", "Self-hosting, policy enforcement, audit exports, 24x7 support and private Slack", "Exact quota and negotiated terms unknown", "Security and compliance buyers may pay for control, but list price is not realized revenue"]
      - [Terraform / OpenTofu self-managed, "Backend and labor costs vary; no comparable Pulumi credit schedule in assigned evidence", "HCL, provider ecosystems, self-managed state", "Total ownership cost unknown", "Status quo can win when migration and operator skills dominate"]
      - [Spacelift, "Concurrency-based pricing described as more predictable", "Supports multiple IaC and automation tools with policy and dependencies", "Exact price not established in assigned evidence", "Multi-tool buyers may prefer predictable aggregation over engine-specific metering"]
    notes: >-
      Prices and allowances are publisher-reported list or marketplace figures, not
      realized contract prices, revenue, or gross margin. The assigned evidence does
      not support a like-for-like total-cost model across options.
    claimRefs: [CP007, CP008, CP009, CP016]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Pulumi is positioned toward software-shaped, integrated multi-cloud infrastructure; alternatives occupy different trade-offs in language familiarity, governance breadth, or cloud specificity.
    data:
      xAxis: "Software-language flexibility (ordinal 1-5)"
      yAxis: "Integrated governance and workflow breadth (ordinal 1-5)"
      points:
        - {label: "Pulumi", x: 5, y: 5, detail: "General-purpose languages, provider bridge, managed state, policy, deployment and inventory surfaces"}
        - {label: "Terraform", x: 2, y: 4, detail: "HCL, mature ecosystem, and commercial hosted workflow"}
        - {label: "OpenTofu", x: 2, y: 3, detail: "HCL and open-source fork; assigned evidence does not establish comparable hosted governance"}
        - {label: "Spacelift", x: 3, y: 5, detail: "Cross-tool governance and concurrency model; underlying engine remains separate"}
        - {label: "Cloud-native tools", x: 2, y: 3, detail: "Cloud-specific integration with narrower cross-cloud scope"}
        - {label: "Internal build", x: 4, y: 2, detail: "Can use familiar languages but governance breadth depends on internal investment"}
    approximationNotes: >-
      Ordinal scores are analyst synthesis from the cited capability descriptions, not
      measured benchmarks or market rankings. They show relative decision dimensions,
      not product quality, market share, or financial value.
    claimRefs: [CP001, CP005, CP006, CP007, CP015]
callouts:
  - calloutType: strength
    title: Integrated platform wedge
    body: Pulumi's strongest differentiator is the combination of a programmable IaC engine and a managed layer for state, policy, deployment, secrets, and inventory; syntax alone is becoming less defensible as HCL and provider compatibility expand.
    claimRefs: [CP002, CP003, CP005, CP015]
  - calloutType: risk
    title: Adoption and pricing proof remain incomplete
    body: The assigned evidence does not establish Pulumi's paid customer economics, comparative market share, or independent benchmark superiority; usage-based pricing and language complexity can preserve the status quo's advantage.
    claimRefs: [CP008, CP010, CP011, CP012, CP014]
