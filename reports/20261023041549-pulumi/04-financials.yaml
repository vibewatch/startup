schemaVersion: "report-v2"
artifact: financials
slug: pulumi
runDate: 2026-10-23
company:
  name: Pulumi
chapter:
  number: 4
  title: Financials
  summary: >-
    Pulumi has a credible open-core path from free developer adoption to paid cloud
    management, governance, secrets, deployment, and AI usage. Public evidence does
    not disclose current ARR, gross margin, retention, sales efficiency, cash, burn,
    or runway, so revenue quality and capital adequacy remain underwriting blockers.
sections:
  - id: revenue-model
    title: Revenue model and pricing architecture
    body: >-
      Pulumi monetizes the management layer around an Apache-licensed infrastructure
      engine rather than the engine alone. Secondary sources describe free individual
      use, paid Team and Enterprise entry tiers, and custom Business Critical terms,
      while the paid surface spans managed state, deployments, secrets, discovery,
      governance, support, and Neo usage. That creates multiple expansion paths as a
      customer adds people, resources, workflows, secrets, or controls. It does not,
      however, establish realized average selling price or revenue mix. The available
      pricing sources also disagree on whether the core commercial basis should be
      characterized as user-based or activity/resource-based, so current official
      quotes and representative contracts are required before modeling revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI009]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-gtm
    title: Public traction and go-to-market signals
    body: >-
      The last concrete operating snapshot in the assigned evidence is historical:
      GeekWire reported more than 2,000 customers, 150,000 open-source users, and
      revenue doubling in the year before October 2023. The New Stack later relayed
      Pulumi's claim of more than 100 million IaC downloads, but downloads are not
      paying customers or ARR. A third-party headcount model estimates 129 employees,
      with roughly 38% in technical roles and 12% in sales. Taken together, these
      signals fit a product-led funnel that converts open-source use into paid cloud
      and enterprise controls, but they cannot yield CAC, quota productivity, sales
      cycle, conversion, or payback without private cohort and pipeline data.
    claimRefs: [CI005, CI006, CI008, CI012, CI016]
  - id: unit-economics
    title: Unit economics and cost structure
    body: >-
      Customer anecdotes suggest that the managed platform can replace meaningful
      internal engineering effort: YesPress reports that Starburst reversed a move
      to self-managed state after two engineers spent one or two days each week on
      the substitute, and separately reports a deployment-time reduction from two
      weeks to three hours. Those examples support willingness to pay for orchestration
      and governance, not a company-wide gross-margin estimate. Pulumi still bears
      hosting, workflow, support, sales, and continued product-development costs,
      including AI inference where Neo is used. No retained source provides current
      gross margin, NRR, GRR, churn, CAC, payback, support burden, or product-level
      contribution margin, so a credible margin bridge cannot yet be calculated.
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      GeekWire reported a $41 million Series C and $99 million of total funding in
      October 2023. That funding history is not a current cash balance and cannot be
      converted into burn or runway. None of the assigned evidence establishes cash
      on hand, monthly net burn, debt or credit obligations, planned use of funds, or
      a next-round trigger. Competitive pressure also matters: self-managed
      alternatives can remove control-plane fees, and one customer tested that option
      before returning because of labor cost. The financial verdict is therefore
      conditional: Pulumi has plausible recurring and usage expansion, but revenue
      quality, margin durability, and financing dependency are not underwritable
      without management accounts, billing cohorts, cost-of-service data, and a
      current capitalization and liquidity schedule.
    claimRefs: [CI007, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams and monetization mechanisms
    columns:
      - Stream
      - Mechanism and unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - [Pulumi IaC, "Apache-licensed engine and SDK adoption", "Free/open-source acquisition layer", "No direct revenue established", "Monthly active organizations and free-to-paid conversion"]
      - [Pulumi Cloud, "Managed state, history, access, and collaboration", "Commercial hosted wrapper is established", "Potentially recurring but mix is undisclosed", "ARR by tier, contract term, and renewal cohort"]
      - [Deployments and Insights, "Workflow execution and discovered-resource activity", "Presented as paid platform surfaces", "Usage expansion is plausible but unquantified", "Usage revenue, attach rate, and infrastructure cost per unit"]
      - [ESC and policy controls, "Managed secrets, environments, and governance", "Separate or bundled paid capabilities", "Enterprise expansion path; realized price unknown", "Secrets volume, attach rate, discounting, and gross margin"]
      - [Neo and Business Critical, "AI tokens plus custom support/self-hosting terms", "Metered and negotiated elements described by secondary sources", "Potential expansion with higher service and inference cost", "AI cost per token, support burden, ACV, and contribution margin"]
    notes: >-
      Sources describe product and billing architecture, not audited revenue mix;
      every revenue-quality conclusion is provisional pending management billing data.
    claimRefs: [CI001, CI003, CI009]
  - id: TI002
    title: Public pricing and monetization evidence
    columns:
      - Tier or item
      - Publicly reported price or unit
      - List versus realized
      - Discount or uncertainty
      - Underwriting treatment
    rows:
      - [Individual, "$0 in secondary 2026 comparisons", "Public list indication", "Single-user and included-usage limits require confirmation", "Acquisition tier; do not treat as revenue"]
      - [Team, "$40 per month reported by two secondary sources", "List indication only", "Included resources, credits, seats, and overages may change economics", "Do not use as realized ARPU"]
      - [Enterprise, "$400 per month reported by two secondary sources", "Entry list indication only", "Included usage and negotiated terms are not verified", "Obtain current quote and sampled invoices"]
      - [Business Critical, "Custom", "Negotiated", "Support, compliance, and self-hosting scope drive price", "Require contract cohort and renewal analysis"]
    notes: >-
      No current official Pulumi pricing page was retained in this assigned pool;
      secondary sources conflict on billing basis, and quoted entry prices are not
      realized customer revenue.
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Specific diligence ask
    rows:
      - [Current ARR and revenue, "Unavailable", "Low", "Sets scale and valuation denominator", "Monthly revenue by product, tier, geography, and cohort"]
      - [Gross margin, "Unavailable", "Low", "Tests hosted-cloud and AI economic quality", "COGS split across hosting, support, workflows, and inference"]
      - ["NRR, GRR, and churn", "Unavailable", "Low", "Tests recurring-revenue durability", "Logo and dollar retention by annual cohort and segment"]
      - [CAC and payback, "Unavailable", "Low", "Tests sales efficiency of product-led and enterprise motions", "Fully loaded CAC, sales cycle, win rate, and payback by segment"]
      - [Support and implementation burden, "Customer anecdotes only", "Medium", "Determines service intensity and expansion economics", "Support hours and professional-services contribution by tier"]
      - [Cash on hand and net burn, "Unavailable", "Low", "Determines financing dependency", "Latest bank balance, monthly cash flow, and board-approved plan"]
      - [Runway and next-round trigger, "Unavailable", "Low", "Frames dilution and execution risk", "Base and downside runway with hiring and revenue assumptions"]
      - [Debt and contractual obligations, "Unavailable", "Low", "Could shorten effective runway", "Debt schedule, covenants, leases, and minimum cloud commitments"]
    notes: >-
      "Unavailable" means the metric was not established by the assigned successful
      prefetched evidence; it does not mean the metric is zero.
    claimRefs: [CI006, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model flow and missing gross-profit bridge
    type: flow
    summary: >-
      Open-source adoption can convert into paid platform activity, but public evidence
      does not quantify conversion, revenue mix, cost of service, or gross profit.
    data:
      nodes:
        - id: open-source-adoption
          label: Open-source adoption
          detail: IaC engine, SDKs, packages, and community usage
        - id: cloud-account
          label: Pulumi Cloud account
          detail: Managed state, history, access, and collaboration
        - id: paid-tier
          label: Paid tier
          detail: Team, Enterprise, or negotiated Business Critical terms
        - id: platform-activity
          label: Platform activity
          detail: Resources, secrets, workflows, discovery, governance, and Neo tokens
        - id: recurring-usage-revenue
          label: Recurring and usage revenue
          detail: Mix, conversion, and realized pricing are not publicly disclosed
        - id: service-costs
          label: Service-delivery costs
          detail: Hosting, support, workflow execution, and AI inference are unquantified
        - id: gross-profit
          label: Gross profit
          detail: Unavailable without revenue mix and cost-of-service data
      edges:
        - from: open-source-adoption
          to: cloud-account
          label: Activation
        - from: cloud-account
          to: paid-tier
          label: Conversion
        - from: paid-tier
          to: platform-activity
          label: Adoption and expansion
        - from: platform-activity
          to: recurring-usage-revenue
          label: Billing
        - from: recurring-usage-revenue
          to: gross-profit
          label: Revenue contribution
        - from: service-costs
          to: gross-profit
          label: Cost deduction
    approximationNotes: >-
      Conceptual flow only; no conversion rate, revenue share, cost allocation, or
      margin magnitude is inferred.
    claimRefs: [CI001, CI009, CI013]
callouts:
  - calloutType: risk
    title: Funding raised is not runway
    body: >-
      The historical $99 million total-funding figure cannot establish current cash,
      burn, debt capacity, or months of runway; those require current primary records.
    claimRefs: [CI007, CI014]
  - calloutType: recommendation
    title: Gate underwriting on private financial data
    body: >-
      Require recurring-revenue cohorts, realized pricing, cost-of-service detail,
      sales-efficiency metrics, and a current liquidity schedule before assigning a
      revenue multiple or financing-risk conclusion.
    claimRefs: [CI013, CI014, CI015]
