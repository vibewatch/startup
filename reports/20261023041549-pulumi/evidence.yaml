evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: financing
    missingEvidence: >-
      Primary documentation for any 2025 or 2026 financing, post-money valuation, investor terms, debt, and current
      ownership.
    whyItMatters: A financing history without current terms cannot support a current valuation or dilution judgment.
    diligencePath: >-
      Request the latest capitalization table, financing documents, board-approved valuation, and debt schedule under
      NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: Current headcount, ARR or revenue, customer-account definition, retention, and product attach rates.
    whyItMatters: >-
      Reported customers, users, employees, and revenue growth use different periods and denominators and cannot
      establish present operating scale.
    diligencePath: Obtain a dated KPI pack separating active paid accounts, open-source users, ARR, growth, retention, and headcount.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current executive and board roster with role dates and succession coverage.
    whyItMatters: Founder and technical-leader evidence is useful but does not reveal governance depth or key-person concentration.
    diligencePath: Request the current leadership roster, board composition, committee responsibilities, and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: adverse-evidence
    missingEvidence: Independent current records of litigation, sanctions, material outages, and customer concentration.
    whyItMatters: The assigned pool contains one critical review but no comprehensive current legal or operational-risk record.
    diligencePath: >-
      Run a dated legal, regulatory, incident, and customer-reference review using company-provided disclosures and
      independent databases.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: pulumi-sam-som
    missingEvidence: >-
      Pulumi-specific paid-account counts, ACV by segment, eligible cloud-estate distribution, geography, attach rates,
      competitive win rates, and churn.
    whyItMatters: >-
      Without these inputs, the global category estimate cannot be converted into a defensible serviceable or obtainable
      market.
    diligencePath: >-
      Obtain management cohort data and CRM pipeline exports, then reconcile them to billing records and construct
      bottom-up SAM and SOM ranges by segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-methodology
    missingEvidence: >-
      Full publisher methodologies, component splits, source samples, and geographic assumptions for the conflicting
      market forecasts.
    whyItMatters: >-
      The retained estimates cannot be normalized or averaged without knowing whether they measure the same revenue
      pool.
    diligencePath: >-
      Acquire the underlying analyst reports and compare definitions, base-year data, currency treatment, services
      inclusion, and forecast assumptions line by line.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
