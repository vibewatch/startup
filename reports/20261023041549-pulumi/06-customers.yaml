schemaVersion: "report-v2"
artifact: customers
slug: pulumi
runDate: "2026-10-23"
company:
  name: Pulumi
chapter:
  number: 6
  title: Customers
  summary: >-
    Pulumi has credible evidence of adoption among developer-led platform teams and complex
    enterprise infrastructure operators, including historically reported scale of more than
    2,000 customers and 150,000 open-source users. Named outcomes support real production use,
    but current paid-customer scale, retention, product attach, and concentration remain private.
sections:
  - id: customer-base-and-segmentation
    title: Customer base and segmentation
    body: >-
      Pulumi's clearest customer fit is with software developers, platform engineers, and
      infrastructure teams that want programmatic control over multi-cloud resources. The evidence
      spans an open-source user funnel, enterprise platform teams, and operators of large fleets,
      rather than a single homogeneous buyer group. In October 2023, GeekWire reported more than
      2,000 customers, more than half of the Fortune 50, and 150,000 open-source users; those
      figures establish historical reach but are too old to represent the current base. Pulumi's
      current customer page only says that thousands of engineering teams use the product, so it
      does not close the dated-count gap or reveal how many users convert to paid accounts.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001, TU002]
  - id: named-production-proof
    title: Named production proof and outcomes
    body: >-
      The strongest adoption evidence is operational rather than logo-based. YesPress reports that
      Starburst reversed an attempt to replace Pulumi Cloud after two engineers were spending one
      or two days each week maintaining the substitute; it also reports a deployment workflow
      falling from two weeks to three hours. The same source describes Learning Machine reducing
      new-customer provisioning from as long as three weeks to one hour and Wiz operating Pulumi
      across more than one million resources. BMW is separately identified by both a sponsored
      practitioner post and an independent tool directory. These examples indicate production use,
      but they remain selected case studies without contract values, cohort definitions, or audited
      outcome methodologies.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: adoption-and-expansion-loop
    title: Adoption and expansion loop
    body: >-
      The customer journey appears to begin with developer or platform-team adoption of the
      open-source IaC engine, then move toward managed state, collaboration, deployment automation,
      secrets, governance, and cloud visibility. The New Stack reported that Pulumi framed IaC,
      ESC, and Insights as independently adoptable products that are stronger together, while
      hundreds of organizations participated in the ESC public beta before general availability.
      That supports a plausible land-and-expand mechanism, not a measured attach-rate conclusion.
      Starburst's return to the hosted service illustrates how internal operating labor can create
      expansion pressure, but Pulumi has not publicly disclosed conversion, product attach, or
      expansion-revenue metrics in the assigned evidence.
    claimRefs: [CU006, CU007, CU008, CU009]
    figureRefs: [FU001]
  - id: durability-and-procurement-risk
    title: Durability, procurement friction, and concentration risk
    body: >-
      Public evidence is insufficient to judge recurring durability. No assigned source discloses
      NRR, GRR, logo churn, renewal rates, contract length, cohort retention, or top-customer
      concentration. Two external sources identify possible procurement friction: SoftwareSuggest
      publishes a price comparison that places Pulumi above similar tools, while competitor Encore
      argues that dependence on a managed state service may be unattractive for closed-network
      environments. Neither source is an authoritative contract-level benchmark, so both signals
      receive low confidence. The investment case therefore should treat retention, enterprise
      expansion, hosted-service dependency, and revenue concentration as diligence items rather
      than infer durability from customer logos or selected case studies.
    claimRefs: [CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale or proof
      - Strategic value and evidence gap
    rows:
      - - Developer-led adopters
        - Platform or engineering leader / software developers / organization
        - Define and manage infrastructure in familiar programming languages
        - 150,000 open-source users reported in October 2023
        - Broad top-of-funnel signal; paid conversion is undisclosed
      - - Enterprise platform teams
        - VP of infrastructure or platform leader / platform engineers / enterprise
        - Standardize multi-cloud provisioning, policy, collaboration, and governance
        - More than half of the Fortune 50 reported as customers in October 2023
        - Potentially high strategic value; paid-seat and contract mix are undisclosed
      - - Large-fleet operators
        - Infrastructure leadership / platform and DevOps teams / enterprise
        - Automate repeated deployments and manage high resource volumes
        - Named examples include Starburst, BMW, and Wiz
        - Strong production signal; case-study selection and outcome methodology limit inference
      - - Managed-platform evaluators
        - Platform or security leader / infrastructure team / organization
        - Add hosted state, workflow automation, secrets, visibility, and policy
        - Starburst reportedly returned after attempting to self-manage the backend
        - Supports total-cost-of-ownership value; renewal and attach rates remain private
    notes: >-
      Segments synthesize assigned public evidence; historical scale figures are dated October
      2023, and payer identity, paid conversion, contract value, and segment revenue are unavailable.
    claimRefs: [CU001, CU002, CU003, CU005, CU008, CU009, CU012, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / access date
      - Source attribution
      - Confidence and implication
      - Missing denominator or limitation
    rows:
      - - Customers
        - More than 2,000
        - October 2023
        - GeekWire reporting company figures
        - Medium; establishes historical commercial scale
        - No current count, paid-plan split, or customer definition
      - - Fortune 50 penetration
        - More than half
        - October 2023
        - GeekWire reporting company figures
        - Medium; indicates enterprise reach
        - No named population, contract size, or production-depth breakdown
      - - Open-source platform users
        - 150,000
        - October 2023
        - GeekWire reporting company figures
        - Medium; indicates developer funnel size
        - No active-user window, growth series, or paid conversion rate
      - - Engineering teams
        - Thousands
        - Accessed October 2026
        - Pulumi customer page
        - Low; current company marketing remains directionally consistent with broad adoption
        - Undated, rounded, and not reconciled to customers or active paid accounts
    notes: >-
      Values preserve source terminology and vintages; "users," "customers," "Fortune 50
      penetration," and "engineering teams" have different denominators and are not combined into
      a growth rate.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Starburst
        - Data-platform operator
        - Pulumi IaC plus Pulumi Cloud workflow and state services
        - Production use and a reported return after self-managed substitution
        - Multi-region blue-green deployment reportedly fell from two weeks to three hours
        - Vendor-linked case-study evidence; no independent audit or contract detail
      - - Learning Machine
        - Software company provisioning customer environments
        - Reusable cloud provisioning workflow
        - Reported production use
        - New-customer provisioning reportedly fell from up to three weeks to one hour
        - Historical case-study figure with no cohort size or measurement protocol
      - - Wiz
        - Cloud-security enterprise
        - Automation API and Go SDK across a large multi-cloud resource fleet
        - Reported production use
        - More than one million resources and hundreds of thousands of daily updates reported
        - Scale is case-study reporting without audited usage data
      - - BMW
        - Large enterprise / automotive
        - Large-scale infrastructure management
        - Adoption identified; production depth not established by the fetched excerpts
        - No quantified outcome retained from the two corroborating sources
        - One source is sponsored and neither excerpt supplies contract or deployment detail
    notes: >-
      This is a representative sample of names supported by the assigned pool, not an exhaustive
      customer roster; production labels and outcomes reproduce source characterization and are not
      audited.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative named deployments with usable detail in the chapter's assigned prefetched
        evidence as of 2026-10-23.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      A source-grounded path from developer entry to managed-platform expansion, with private
      conversion and retention metrics left explicitly unresolved.
    data:
      nodes:
        - id: discover
          label: Discover and evaluate
          detail: Developers or platform engineers evaluate real-language infrastructure as code.
          value: Open-source and technical adoption surface
        - id: pilot
          label: Encode a repeated workflow
          detail: A team ports a bounded deployment or creates reusable infrastructure components.
          value: Technical proof before commercial expansion
        - id: operationalize
          label: Operate at production scale
          detail: Repeated deployments and large resource fleets create orchestration requirements.
          value: Named Starburst and Wiz production evidence
        - id: managed-cloud
          label: Adopt managed services
          detail: Hosted state, collaboration, deployment workflows, and analytics replace internal toil.
          value: Starburst return illustrates total-cost-of-ownership pressure
        - id: expand
          label: Add adjacent products
          detail: ESC and Insights can be adopted independently around the IaC foundation.
          value: Hundreds of organizations joined the ESC public beta
        - id: renew-or-reassess
          label: Renew or reassess
          detail: Teams compare platform fees and dependency with internal operating cost and controls.
          value: Public renewal and churn metrics are unavailable
    approximationNotes: >-
      The sequence is an analytical journey assembled from product and customer evidence, not a
      measured funnel; no conversion rates, stage populations, or elapsed times are inferred.
    claimRefs: [CU006, CU007, CU008, CU009, CU015, CU016]
callouts:
  - calloutType: strength
    title: Production evidence goes beyond a logo wall
    body: >-
      Starburst, Learning Machine, and Wiz have reported operational outcomes or production-scale
      usage, providing stronger adoption evidence than unnamed testimonials alone.
    claimRefs: [CU010, CU011, CU013]
  - calloutType: risk
    title: Durability remains a private-evidence question
    body: >-
      Public sources do not disclose retention, renewal, contract-duration, attach-rate, or
      concentration metrics, so logo breadth cannot establish recurring-revenue quality.
    claimRefs: [CU001, CU002, CU003, CU004]
