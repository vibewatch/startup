  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Current NRR, GRR, logo churn, renewal rate, contract length, cohort retention, and customer
        satisfaction data segmented by customer tier.
      whyItMatters: >-
        Without retention evidence, public adoption and outcome examples cannot establish recurring
        revenue durability or customer dependence on the paid platform.
      diligencePath: >-
        Obtain board-approved cohort schedules and billing exports, reconcile opening and closing
        ARR by cohort, and sample renewal contracts and churned-account interviews.
      relatedQuestionRefs: [QU009]
    - type: private-evidence-only
      severity: material
      topic: concentration-and-expansion
      missingEvidence: >-
        Top-10 customer revenue concentration, product-level ARR, paid conversion, and attach rates
        for Deployments, ESC, Insights, Governance, and Neo.
      whyItMatters: >-
        These data determine whether broad developer reach converts into diversified commercial
        revenue and whether the multi-product strategy produces measurable expansion.
      diligencePath: >-
        Request anonymized customer-level ARR, product entitlements, expansion and contraction
        bridges, and top-account renewal calendars for the last eight quarters.
      relatedQuestionRefs: [QU010]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customers
      missingEvidence: >-
        A current, complete roster of named paying customers with deployment status, products used,
        production scale, contract value, and outcome methodology.
      whyItMatters: >-
        The public sample is selected and cannot establish the share of logos in production, the
        representativeness of reported outcomes, or the breadth of paid adoption.
      diligencePath: >-
        Reconcile CRM and billing records to a customer reference list, then verify a stratified
        sample through direct customer calls and architecture reviews.
      relatedTableRefs: [TU003]
