artifact: company-overview
slug: pulumi
runDate: 2026-10-23
company:
  name: Pulumi
chapter:
  number: 1
  title: Company Overview
  summary: Pulumi is a Seattle-founded infrastructure-as-code company built around an open-source engine that lets engineers use general-purpose languages across cloud providers. Public evidence supports a multi-product expansion and meaningful financing history, but current valuation, revenue, and operating-scale metrics remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity and product model
    body: >-
      Pulumi was founded in Seattle in 2017 by Joe Duffy and Eric Rudder and
      built its initial wedge around infrastructure as code in general-purpose
      languages. Its open-source engine and SDKs provision resources across
      AWS, Azure, Google Cloud Platform, Kubernetes, and hundreds of providers.
      The product model has expanded beyond the core engine: public company
      materials describe Pulumi Cloud, Deployments, ESC for environments and
      secrets, Insights, Policy as Code, and AI-oriented capabilities. This
      breadth is strategically coherent because the management layer can monetize
      governance, collaboration, and operations around an open-source control
      plane, but the evidence does not establish current revenue or product-level
      attach rates.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and organizational coverage
    body: >-
      The strongest public leadership evidence identifies Joe Duffy as CEO and
      co-founder, Eric Rudder as co-founder and chairman or executive chairman,
      and Luke Hoban as CTO with prior Microsoft and Amazon Web Services
      experience. GeekWire also reported a chief customer officer hire in 2023,
      while TechCrunch reported additional commercial and engineering leadership
      appointments in 2020. This gives Pulumi credible founder and technical
      continuity, but the available sources do not provide a complete current
      board roster, succession plan, or a verified 2026 executive census. Founder
      dependence therefore remains a diligence consideration rather than a
      quantified risk.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, traction, and milestone record
    body: >-
      Pulumi's official journey records a $5 million seed round in 2017, a
      $15 million Series A in 2018, a $37.5 million Series B in 2020, and a
      $41 million Series C in 2023. TechCrunch corroborates the 2020 Series B
      and $57.5 million cumulative investment at that point; GeekWire reported
      $99 million total funding, more than 2,000 customers, 150,000 open-source
      users, revenue doubling over the prior year, and more than 100 employees
      in October 2023. A 2025 Pulumi release states that the company served over
      3,700 customers, but no current valuation, revenue run-rate, headcount, or
      Series D terms are established by the assigned evidence. Those gaps limit
      any current financing or scale conclusion.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
