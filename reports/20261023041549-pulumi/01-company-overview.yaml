callouts:
  - calloutType: strength
    title: Open-source distribution with an expanding control plane
    body: Pulumi combines an open-source engine with hosted state, governance, deployment, secrets, discovery, and AI-oriented layers, creating a plausible path from developer adoption to enterprise workflow spend.
    claimRefs: [CO002, CO003, CO004, CO014]
  - calloutType: risk
    title: Current scale and valuation remain opaque
    body: Public evidence supports historical financing and reported customer growth, but it does not verify current valuation, revenue, headcount, customer denominator, or any later financing terms.
    claimRefs: [CO011, CO012, CO013, CO016]
