              The strongest public leadership evidence identifies Joe Duffy as CEO and co-founder, Eric Rudder as
              co-founder and chairman or executive chairman, and Luke Hoban as CTO with prior Microsoft and Amazon Web
              Services experience. GeekWire also reported a chief customer officer hire in 2023, while TechCrunch
              reported additional commercial and engineering leadership appointments in 2020. This gives Pulumi credible
