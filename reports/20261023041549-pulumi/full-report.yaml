              - CI014
          - type: callout
            title: Gate underwriting on private financial data
            body: >-
              Require recurring-revenue cohorts, realized pricing, cost-of-service detail, sales-efficiency metrics, and
              a current liquidity schedule before assigning a revenue multiple or financing-risk conclusion.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Pulumi's core workflow lets an infrastructure or platform engineer describe desired cloud resources in a
              familiar programming language, preview a plan, and apply creates, updates, or deletions. Official pages
              list TypeScript, JavaScript, Python, Go, .NET, Java, YAML, and HCL, while an independent tutorial
              describes stacks as the unit that stores state and environment-specific configuration. That tutorial also
              describes Pulumi Cloud and customer-managed object storage as backend choices, and explains that
              configuration secrets are encrypted with a Pulumi-managed key by default or a customer-selected
              key-management service. The practical value proposition is fewer language boundaries between application
              and infrastructure work, not the elimination of review, testing, credential, and state-recovery
              responsibilities.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
              - CE008
              - CE009
