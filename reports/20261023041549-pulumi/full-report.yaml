      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to developers and platform engineers as daily users, with infrastructure or
              platform leadership as the likely economic buyer and budget owner. Zaira identifies self-service platform
              teams, polyglot organizations, and mixed-cloud estates as strong Pulumi use cases; CNCF separately finds
              that 28% of surveyed organizations have a dedicated platform-engineering team and 41% use a multi-team
              collaboration model for internal platforms. Adoption is therefore more likely to start with a workload or
              platform abstraction, prove repeatability and governance, and then expand across teams than to begin as a
              company-wide tool replacement. Security, compliance, and AI workloads can raise urgency, but the evidence
              does not disclose who signs Pulumi contracts, the budget line used, or how platform-team prevalence
              converts into paid demand.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Platform standardization, multi-cloud complexity, policy automation, and AI infrastructure are credible
              demand drivers. CNCF reports that 35% of surveyed organizations use a hybrid platform approach for AI
              workloads, indicating that buyers often extend existing platforms rather than create separate stacks.
              Adoption constraints remain material: Pulumi's general-purpose-language model shifts complexity into
              dependency, runtime, and code-structure discipline; provider behavior can inherit upstream Terraform
              constraints; and teams may prefer a cloud-native or more standardized ecosystem. A vendor survey reported
              by The New Stack also found broad IaC difficulty and low maturity, although its sponsor makes it
              directional rather than an independent benchmark. Valuation should therefore reward category growth only
              after Pulumi demonstrates paid penetration, durable expansion, and lower migration friction; a broad
              market CAGR alone cannot support a company-specific revenue multiple.
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
