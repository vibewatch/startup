              - CP005
              - CP006
              - CP007
              - CP015
      - number: '3.2'
        title: Buyer-facing capability and packaging comparison
        blocks:
          - type: paragraph
            body: >-
              The buyer decision turns on the operating model rather than syntax alone. Pulumi is strongest where
              application engineers need loops, functions, types, tests, reusable components, or multi-cloud provider
              coverage; HCL remains attractive where teams value a constrained language, a larger pool of practitioners,
              or an existing Terraform estate. The managed layer adds state, RBAC, audit, secrets, deployment workflows,
              policy, and cloud inventory, but usage-based resource and deployment-minute billing can be harder to
              forecast than a concurrency-priced alternative. Public comparison material also points to a structural
              trade-off: Pulumi's provider bridge reduces ecosystem risk, while Terraform/OpenTofu retain broader
              registry familiarity and cloud-native tools can be simpler for narrow single-cloud use cases.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP012
              - CP015
              - CP016
      - number: '3.3'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Pulumi's moat is not just the language runtime. It is the combination of reusable infrastructure code,
              provider compatibility, state and deployment workflows, governance, secrets, inventory, and accumulated
              team knowledge. Customer evidence suggests the wrapper can be valuable: Starburst reported that replacing
              Pulumi Cloud with self-managed state shifted recurring dashboarding, orchestration, security, and
              analytics work onto engineers. That is customer-reported evidence, not a controlled benchmark, and it does
              not prove universal savings. The counterweight is equally important: real languages can create more
              complex failure modes, while choosing self-managed state shifts locking and operations back to the buyer.
              Firefly's 2025 survey reports 62% Terraform current share versus 47% planning to continue, alongside 12%
              current OpenTofu use and 27% planned adoption; the article does not disclose a denominator or methodology
              in the fetched text, so these figures indicate an unsettled category rather than Pulumi-specific market
              share. Durable differentiation therefore depends on proving lower total ownership cost and safer
              governance in bounded customer workflows, while avoiding abstraction that hides blast radius.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP016
      - number: '3.4'
        title: Evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate sourced competitor facts from analyst synthesis and make the comparison auditable.
              Competitor categories are not market-share claims, historical customer counts are not current scale, and
              list prices are not realized revenue. Unknown pricing, unsupported feature cells, and unverified relative
              performance are retained as unknown rather than filled with estimates. This treatment is important because
              buyer priorities differ by cloud scope, team skills, governance requirements, and tolerance for migration
              risk.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated platform wedge
            body: >-
              Pulumi's strongest differentiator is the combination of a programmable IaC engine and a managed layer for
              state, policy, deployment, secrets, and inventory; syntax alone is becoming less defensible as HCL and
              provider compatibility expand.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP015
          - type: callout
            title: Adoption and pricing proof remain incomplete
            body: >-
              The assigned evidence does not establish Pulumi's paid customer economics, comparative market share, or
              independent benchmark superiority; usage-based pricing and language complexity can preserve the status
              quo's advantage.
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Pulumi monetizes the management layer around an Apache-licensed infrastructure engine rather than the
              engine alone. Secondary sources describe free individual use, paid Team and Enterprise entry tiers, and
              custom Business Critical terms, while the paid surface spans managed state, deployments, secrets,
              discovery, governance, support, and Neo usage. That creates multiple expansion paths as a customer adds
              people, resources, workflows, secrets, or controls. It does not, however, establish realized average
              selling price or revenue mix. The available pricing sources also disagree on whether the core commercial
              basis should be characterized as user-based or activity/resource-based, so current official quotes and
              representative contracts are required before modeling revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
