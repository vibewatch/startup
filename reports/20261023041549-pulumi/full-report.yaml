  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible core market is paid tools and services used to provision and manage infrastructure through
              machine-readable definitions, rather than all cloud spend. The Business Research Company explicitly
              includes tools and services across provisioning, orchestration, configuration, security and compliance,
              monitoring, integration, support, and training. For Pulumi, the most relevant slice is programmatic
              multi-cloud infrastructure automation for developer and platform teams. Adjacent cloud management,
              secrets, policy, and internal-developer-platform spend can expand wallet share, but counting all of it as
              IaC would overstate the addressable market. Status-quo substitutes include manual console or API work,
              cloud-native provisioning systems, Terraform or OpenTofu workflows, and application platforms that
              abstract infrastructure provisioning away.
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Sizing lenses and estimate conflict
        blocks:
          - type: paragraph
            body: >-
              The strongest current top-line estimate in the assigned evidence is $2.03 billion of global IaC revenue in
              2026, rising to $5.25 billion in 2030 at a stated 26.8% CAGR. That should not be blended with ByteIota's
              $2.1 billion 2026 and $3.3 billion 2030 figures, The New Stack's citation of a forecast above $3.3 billion
              by 2030, or GeekWire's 2023 citation of $2.3 billion by 2027. The gaps are analytical, not rounding noise:
              publishers use different dates, component scopes, and methods, while only some expose their market
              definition. These values establish category order of magnitude and growth direction, not Pulumi's
              serviceable or obtainable market. A credible SAM/SOM requires Pulumi's paid-account profile, geographic
              mix, eligible cloud estate, pricing, attach rates, and win rates.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
