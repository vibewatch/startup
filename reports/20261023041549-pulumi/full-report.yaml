      - number: '4.2'
        title: Public traction and go-to-market signals
        blocks:
          - type: paragraph
            body: >-
              The last concrete operating snapshot in the assigned evidence is historical: GeekWire reported more than
              2,000 customers, 150,000 open-source users, and revenue doubling in the year before October 2023. The New
              Stack later relayed Pulumi's claim of more than 100 million IaC downloads, but downloads are not paying
              customers or ARR. A third-party headcount model estimates 129 employees, with roughly 38% in technical
              roles and 12% in sales. Taken together, these signals fit a product-led funnel that converts open-source
              use into paid cloud and enterprise controls, but they cannot yield CAC, quota productivity, sales cycle,
              conversion, or payback without private cohort and pipeline data.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI012
              - CI016
      - number: '4.3'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Customer anecdotes suggest that the managed platform can replace meaningful internal engineering effort:
              YesPress reports that Starburst reversed a move to self-managed state after two engineers spent one or two
              days each week on the substitute, and separately reports a deployment-time reduction from two weeks to
              three hours. Those examples support willingness to pay for orchestration and governance, not a
              company-wide gross-margin estimate. Pulumi still bears hosting, workflow, support, sales, and continued
              product-development costs, including AI inference where Neo is used. No retained source provides current
              gross margin, NRR, GRR, churn, CAC, payback, support burden, or product-level contribution margin, so a
              credible margin bridge cannot yet be calculated.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              GeekWire reported a $41 million Series C and $99 million of total funding in October 2023. That funding
              history is not a current cash balance and cannot be converted into burn or runway. None of the assigned
              evidence establishes cash on hand, monthly net burn, debt or credit obligations, planned use of funds, or
              a next-round trigger. Competitive pressure also matters: self-managed alternatives can remove
              control-plane fees, and one customer tested that option before returning because of labor cost. The
              financial verdict is therefore conditional: Pulumi has plausible recurring and usage expansion, but
              revenue quality, margin durability, and financing dependency are not underwritable without management
              accounts, billing cohorts, cost-of-service data, and a current capitalization and liquidity schedule.
            claimRefs:
              - CI007
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
