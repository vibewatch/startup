chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product model
        blocks:
          - type: paragraph
            body: >-
              Pulumi was founded in Seattle in 2017 by Joe Duffy and Eric Rudder and built its initial wedge around
              infrastructure as code in general-purpose languages. Its open-source engine and SDKs provision resources
              across AWS, Azure, Google Cloud Platform, Kubernetes, and hundreds of providers. The product model has
              expanded beyond the core engine: public company materials describe Pulumi Cloud, Deployments, ESC for
              environments and secrets, Insights, Policy as Code, and AI-oriented capabilities. This breadth is
              strategically coherent because the management layer can monetize governance, collaboration, and operations
              around an open-source control plane, but the evidence does not establish current revenue or product-level
              attach rates.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
