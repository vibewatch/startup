        title: Exhibits
        blocks:
          - type: callout
            title: Category TAM is not Pulumi SAM
            body: >-
              The $2.03 billion 2026 figure covers global IaC tools and services across many architectures and end
              users. Pulumi's reachable spend must be narrowed by buyer fit, geography, cloud estate, pricing, and
              competitive win rate.
