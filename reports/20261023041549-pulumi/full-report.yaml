  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Pulumi's direct comparison set is Terraform and OpenTofu: all three reconcile desired infrastructure state
              through providers, but Pulumi uses general-purpose languages while Terraform and OpenTofu center on HCL.
              That distinction is now less absolute because Pulumi can run HCL and use Terraform or OpenTofu providers,
              so the durable contest is increasingly about governance, state, workflow, ecosystem, and who maintains the
              code. The New Stack describes Pulumi as expanding from an open-source IaC foundation into ESC and
              Insights; YesPress separately describes Deployments, Policy as Code, IDP, and Neo. Adjacent competitors
              include Spacelift and env0 for orchestration and governance, while AWS CDK, CloudFormation, Azure Bicep,
              and Crossplane are cloud-native or Kubernetes-centered substitutes. Internal platform teams and status-quo
              Terraform estates remain the most important alternatives because migration has a real switching cost even
              where feature parity is high.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
