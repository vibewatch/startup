        - Requires new private evidence
      - - Base
        - Adoption is real; monetization and round terms remain opaque
        - Research-more with no public fair-value range
        - Slow enterprise expansion
        - Best fit with retained evidence
      - - Bear
        - Later round fails verification or preferences are punitive
        - Down-round, dilution, and multiple compression dominate
        - Terraform/OpenTofu substitution
        - Material downside path
      - - Thesis-break
        - Paid cohorts do not renew or expand after adoption
        - No platform premium is warranted
        - Community use fails to monetize
        - Immediate negative signal
    notes: >-
      No probabilities, valuation ranges, or target returns are assigned because public ARR, margins, burn, ownership,
      and preference terms are unavailable.
    claimRefs:
      - CV001
      - CV007
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: Pulumi company milestone timeline
    type: timeline
    summary: >-
      Publicly documented milestones show a progression from open-source IaC to hosted management, governance, and
      AI-oriented products.
    data:
      items:
        - date: '2017'
          label: Founding and $5M seed
          detail: Pulumi's official journey records founding and a $5M seed fundraise.
          tone: positive
        - date: '2018'
          label: Open-source and Pulumi Service launch
          detail: The official journey records the open-source launch and Pulumi Service launch, alongside a $15M Series A.
          tone: positive
        - date: '2019'
          label: Pulumi 1.0 launch
          detail: Pulumi's official journey records the 1.0 product milestone.
          tone: positive
        - date: '2020'
          label: Pulumi 2.0 and $37.5M Series B
          detail: The official journey and TechCrunch report the 2.0 era and Series B financing.
          tone: positive
        - date: '2021'
          label: Pulumi 3.0 launch
          detail: The official journey records the 3.0 product milestone.
          tone: positive
        - date: '2022'
          label: Universal IaC and Deployments
          detail: The official journey records Universal IaC and Pulumi Deployments milestones.
          tone: positive
        - date: '2023'
          label: Insights, ESC, Platform Teams, and $41M Series C
          detail: The official journey and GeekWire describe product expansion and Series C financing.
          tone: positive
        - date: '2025'
          label: Neo and AI policy remediation
          detail: Pulumi's About page and PRNewswire describe AI-oriented product milestones and policy remediation.
          tone: positive
    approximationNotes: >-
      Dates are year-level where the assigned source supplies only a year; the timeline preserves reported milestones
      and does not infer launch dates beyond the source text.
    claimRefs:
      - CO009
      - CO010
      - CO014
  - id: FM001
    title: Evidence-constrained addressability layers
    type: pyramid
    summary: >-
      The public evidence quantifies the broad global category and selected demand signals, but not Pulumi-specific SAM
      or obtainable share.
    data:
      items:
        - label: Global IaC tools and services
          value: $2.03B in 2026
          detail: TBRC global market revenue across tools and services.
        - label: IaC tools subset
          value: Not separately disclosed
          detail: Services must be removed before treating the estimate as software spend.
        - label: Programmatic and imperative IaC
          value: Not separately disclosed
          detail: Pulumi competes most directly where code-based infrastructure fits team workflows.
        - label: Dedicated platform-team demand
          value: 28% of surveyed organizations
          detail: CNCF and SlashData survey signal; not a spending share or Pulumi penetration rate.
        - label: Hybrid AI-platform demand
          value: 35% of surveyed organizations
          detail: CNCF and SlashData survey signal using a different denominator from market revenue.
        - label: Pulumi obtainable share
          value: Not publicly isolated
          detail: Requires paid-account, pricing, win-rate, expansion, geography, and churn evidence.
    approximationNotes: >-
      Layer order is a conceptual narrowing path, not a proportional scale or conversion funnel. Dollar values and
      survey percentages have different denominators; unknown layers remain unquantified rather than being estimated.
    claimRefs:
      - CM001
      - CM002
      - CM008
      - CM010
      - CM015
      - CM016
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Pulumi is positioned toward software-shaped, integrated multi-cloud infrastructure; alternatives occupy different
      trade-offs in language familiarity, governance breadth, or cloud specificity.
    data:
      xAxis: Software-language flexibility (ordinal 1-5)
      yAxis: Integrated governance and workflow breadth (ordinal 1-5)
      points:
        - label: Pulumi
          x: 5
          'y': 5
          detail: General-purpose languages, provider bridge, managed state, policy, deployment and inventory surfaces
        - label: Terraform
          x: 2
          'y': 4
          detail: HCL, mature ecosystem, and commercial hosted workflow
        - label: OpenTofu
          x: 2
          'y': 3
          detail: HCL and open-source fork; assigned evidence does not establish comparable hosted governance
        - label: Spacelift
          x: 3
          'y': 5
          detail: Cross-tool governance and concurrency model; underlying engine remains separate
        - label: Cloud-native tools
          x: 2
          'y': 3
          detail: Cloud-specific integration with narrower cross-cloud scope
        - label: Internal build
          x: 4
          'y': 2
          detail: Can use familiar languages but governance breadth depends on internal investment
    approximationNotes: >-
      Ordinal scores are analyst synthesis from the cited capability descriptions, not measured benchmarks or market
      rankings. They show relative decision dimensions, not product quality, market share, or financial value.
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP007
      - CP015
  - id: FI001
    title: Revenue model flow and missing gross-profit bridge
    type: flow
    summary: >-
      Open-source adoption can convert into paid platform activity, but public evidence does not quantify conversion,
      revenue mix, cost of service, or gross profit.
    data:
      nodes:
        - id: open-source-adoption
          label: Open-source adoption
          detail: IaC engine, SDKs, packages, and community usage
        - id: cloud-account
          label: Pulumi Cloud account
          detail: Managed state, history, access, and collaboration
        - id: paid-tier
          label: Paid tier
          detail: Team, Enterprise, or negotiated Business Critical terms
        - id: platform-activity
          label: Platform activity
          detail: Resources, secrets, workflows, discovery, governance, and Neo tokens
        - id: recurring-usage-revenue
          label: Recurring and usage revenue
          detail: Mix, conversion, and realized pricing are not publicly disclosed
        - id: service-costs
          label: Service-delivery costs
          detail: Hosting, support, workflow execution, and AI inference are unquantified
        - id: gross-profit
          label: Gross profit
          detail: Unavailable without revenue mix and cost-of-service data
      edges:
        - from: open-source-adoption
          to: cloud-account
          label: Activation
        - from: cloud-account
          to: paid-tier
          label: Conversion
        - from: paid-tier
          to: platform-activity
          label: Adoption and expansion
        - from: platform-activity
          to: recurring-usage-revenue
          label: Billing
        - from: recurring-usage-revenue
          to: gross-profit
          label: Revenue contribution
        - from: service-costs
          to: gross-profit
          label: Cost deduction
    approximationNotes: Conceptual flow only; no conversion rate, revenue share, cost allocation, or margin magnitude is inferred.
    claimRefs:
      - CI001
      - CI009
      - CI013
  - id: FE001
    title: Pulumi product architecture map
    type: stack
    summary: The product layers authoring, execution, state, controls, and managed operations around the core IaC engine.
    data:
      layers:
        - name: Developer interface
          label: Developer interface
          detail: Author infrastructure in familiar languages and review intended changes.
          items:
            - label: Language SDKs
              detail: TypeScript, JavaScript, Python, Go, .NET, Java, YAML, and HCL.
            - label: CLI and plan workflow
              detail: Preview and apply create, update, and delete actions.
        - name: Infrastructure execution
          label: Infrastructure execution
          detail: Resolve programs into provider-backed resource operations.
          items:
            - label: Apache-2.0 engine
              detail: Open-source execution foundation.
            - label: Resource providers
              detail: Connect major clouds, Kubernetes, and service APIs.
        - name: State and configuration
          label: State and configuration
          detail: Maintain environment-specific resource identity and settings.
          items:
            - label: Stacks
              detail: Organize state and configuration.
            - label: Backends
              detail: Use Pulumi Cloud or customer-managed object storage.
        - name: Security and governance
          label: Security and governance
          detail: Protect secrets and constrain infrastructure changes.
          items:
            - label: ESC and encrypted configuration
              detail: Connect secrets and environment configuration.
            - label: Policy as Code
              detail: Evaluate infrastructure against authored controls.
        - name: Delivery and visibility
          label: Delivery and visibility
          detail: Run deployments and inspect cloud resources.
          items:
            - label: Deployments and Kubernetes Operator
              detail: Execute or trigger infrastructure updates.
            - label: Insights
              detail: Inventory, search, visualize, and assess resources.
        - name: AI-assisted operations
          label: AI-assisted operations
          detail: Generate infrastructure or policy-remediation actions with review boundaries.
          items:
            - label: Neo
              detail: Propose or apply policy fixes under configurable approvals.
    approximationNotes: >-
      Layer order is an authored workflow synthesis; it does not imply that every module shares one runtime, data plane,
      or availability boundary.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE010
      - CE013
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      A source-grounded path from developer entry to managed-platform expansion, with private conversion and retention
      metrics left explicitly unresolved.
    data:
      nodes:
        - id: discover
          label: Discover and evaluate
          detail: Developers or platform engineers evaluate real-language infrastructure as code.
          value: Open-source and technical adoption surface
        - id: pilot
          label: Encode a repeated workflow
          detail: A team ports a bounded deployment or creates reusable infrastructure components.
          value: Technical proof before commercial expansion
        - id: operationalize
          label: Operate at production scale
          detail: Repeated deployments and large resource fleets create orchestration requirements.
          value: Named Starburst and Wiz production evidence
        - id: managed-cloud
          label: Adopt managed services
          detail: Hosted state, collaboration, deployment workflows, and analytics replace internal toil.
          value: Starburst return illustrates total-cost-of-ownership pressure
        - id: expand
          label: Add adjacent products
          detail: ESC and Insights can be adopted independently around the IaC foundation.
          value: Hundreds of organizations joined the ESC public beta
        - id: renew-or-reassess
          label: Renew or reassess
          detail: Teams compare platform fees and dependency with internal operating cost and controls.
          value: Public renewal and churn metrics are unavailable
    approximationNotes: >-
      The sequence is an analytical journey assembled from product and customer evidence, not a measured funnel; no
      conversion rates, stage populations, or elapsed times are inferred.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU015
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Relative impact and likelihood of Pulumi's principal public-evidence risk categories, with mitigation maturity
      retained as a separate qualifier.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: AI remediation correctness and authorization
          values:
            - critical
            - medium
            - emerging
            - high
        - label: Security, secrets, and state controls
          values:
            - critical
            - medium
            - established but unverified
            - high
        - label: Provider and hosted-workflow dependency
          values:
            - high
            - medium
            - partial
            - high
        - label: Pricing, margin, and customer concentration opacity
          values:
            - high
            - medium
            - limited public evidence
            - high
        - label: Large-program complexity and support execution
          values:
            - medium
            - medium
            - mixed
            - medium
        - label: Compliance evidence and audit outcomes
          values:
            - high
            - medium
            - emerging
            - high
    approximationNotes: >-
      Relative rankings are analytical synthesis of cited evidence; they are not incident probabilities, loss estimates,
      or audited risk scores.
    claimRefs:
      - CR003
      - CR006
      - CR008
      - CR011
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: The decision chain separates evidence of strategic value from the missing inputs required to price that value.
    data:
      nodes:
        - id: historical-proof
          label: Historical financing proof
          detail: $41M Series C and $99M total in 2023
        - id: adoption
          label: Adoption signal
          detail: 2,000+ customers in 2023; 4,000+ companies currently claimed
        - id: platform
          label: Platform optionality
          detail: IaC expands toward ESC, Insights, governance, and AI
        - id: current-price
          label: Current price uncertainty
          detail: Reported Series D and $1.5B post-money lack primary support
        - id: economics
          label: Economics gap
          detail: ARR, retention, margins, burn, and preferences remain private
        - id: decision
          label: Decision
          detail: Research-more; no precise public fair value
      edges:
        - from: historical-proof
          to: adoption
        - from: adoption
          to: platform
        - from: platform
          to: current-price
        - from: current-price
          to: economics
        - from: economics
          to: decision
    approximationNotes: This is a qualitative decision sequence, not a probability-weighted valuation model.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV016
