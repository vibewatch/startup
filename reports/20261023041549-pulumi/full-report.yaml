              - CE005
              - CE011
      - number: '5.2'
        title: Architecture, modules, and maturity
        blocks:
          - type: paragraph
            body: >-
              The architecture is a layered system rather than a single provisioning binary. The Apache-2.0 engine,
              language SDKs, resource providers, state, and stacks form the execution foundation. Reporting from The New
              Stack described IaC, ESC, and Insights as independently adoptable products that work better together: ESC
              sits between secret stores and target environments, while Insights adds inventory, search, dashboards,
              policy, and remediation. Kubernetes Operator 2.0 added a Stack custom resource that can trigger cloud
              changes from Kubernetes. Official migration tooling also claims support for moving code and resource state
              from Terraform, CloudFormation, Azure Resource Manager, and other systems. These interfaces broaden
              Pulumi's addressable workflow, while multiplying provider, identity, state, and rollback boundaries that
              need buyer-specific validation.
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
