- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Revenue / utilization assumption
  - Multiple assumption
  - Implied valuation range
  - Probability signal / key risk
  rows:
  - - Bull
    - Annualized revenue roughly $150M-$220M with strong utilization, visible software/inference attach, and long-dated contracted demand
    - 12x-14x revenue
    - $1.8B-$3.0B
    - Requires sovereign demand to convert into durable contracts before hyperscalers close the gap
  - - Base
    - Annualized revenue roughly $90M-$140M with mixed compute-plus-services economics and moderate utilization
    - 9x-12x revenue
    - $0.8B-$1.7B
    - Most plausible if Neysa scales but remains a niche sovereign provider
  - - Bear
    - Annualized revenue below $60M, weak utilization, and a large share of economics consumed by debt service or discounting
    - 5x-8x revenue
    - $0.3B-$0.7B
    - Triggered by supply delays, thin demand visibility, or price competition
  - - Current headline mark
    - Public evidence does not disclose the current revenue base
    - Equivalent to about 15x at $93M, 10x at $140M, or 6.6x at $212M
    - $1.4B today
    - The gap is not the price itself; it is the lack of disclosed revenue to anchor it
  notes: Scenario ranges are explicit assumptions based on public comp multiples and should not be mistaken for management forecasts.
