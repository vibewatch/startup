- id: recommendation-and-diligence
  title: Recommendation, Triggers, and Final Diligence
  body: 'The recommendation is research-more, not because Neysa lacks strategic relevance, but because the public file does not yet show that the current price is investable. There is enough evidence to believe the company is pursuing a real opportunity: the round closed, the capex plan is large, the founder is credible, and policy and market structure support a sovereign AI-cloud niche in India. There is not enough evidence to believe $1.4 billion is a bargain. The missing blocks are precisely the ones that drive price discipline: current ARR or run-rate revenue, gross margin, signed utilization, concentration of top customers, debt cost, and whether the majority-sponsor round contains preference protections that subordinate common-equity upside. The practical upgrade path is straightforward. If private diligence shows revenue or contracted utilization that places Neysa inside roughly a 10x-15x band without punitive structure, the call can move toward track or buy. If the term sheet is
    hard, the utilization curve is weak, or hyperscaler pricing erodes the sovereign premium before scale arrives, the downside path is a stretched mark followed by a correction or dilutive recap. Price sensitivity is therefore the core message of this chapter: the company may be attractive, but the public evidence does not yet prove the price is.'
