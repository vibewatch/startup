company:
  name: Neysa
chapter:
  number: 8
  title: Valuation
  summary: Neysa’s February 2026 financing created a real public valuation anchor at roughly $1.4 billion, but not a public operating record strong enough to prove that price today. Public and private AI-cloud comps suggest the mark can work if Neysa is already building toward roughly $100 million-plus of high-quality annualized revenue with clean terms; absent that proof, the right call is research-more with medium confidence, high risk, and a stretched valuation stance.
sections:
- id: financing-and-price-context
  title: Financing and Public Price Context
  body: 'Neysa''s current valuation context is easy to headline and hard to underwrite. The round is real: official and independent reporting line up around a $1.2 billion financing package, split between up to $600 million of equity and an intended additional $600 million of debt, with Blackstone expected to emerge as the majority owner. The headline valuation most often cited in independent reporting is roughly $1.4 billion, but the public record describes it as an enterprise valuation and does not disclose the preference stack, debt pricing, or covenant package that would determine the true economic price for minority equity. That distinction matters. A sponsor-led majority round plus a debt layer can improve GPU procurement, power access, and customer introductions, yet it can also embed downside protections that make the common-equity value less generous than the headline. Public operating disclosure is also thin. Neysa had about 1,200 GPUs live, wants to scale beyond 20,000, employed
    roughly 110 people, and says revenue should more than triple next year, but it has not publicly disclosed the revenue base, gross margin, utilization, or customer concentration that would prove whether the current price is conservative or already forward-priced.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
