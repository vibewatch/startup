callouts:
- calloutType: recommendation
  title: Research-more until public narrative becomes economic proof
  body: Neysa may be strategically interesting, but the public file still looks like a headline financing event rather than a fully underwritten valuation case. The right posture is to keep it live in diligence, not to infer margin of safety from the Blackstone mark alone.
  claimRefs:
  - CV002
  - CV015
  - CV016
  - CV048
- calloutType: assumption
  title: The key valuation variable is hidden, not unknowable
  body: This chapter does not assume Neysa is overpriced because public revenue is absent; it assumes the price cannot be called attractive until revenue, utilization, and capital-structure terms are disclosed privately or publicly.
  claimRefs:
  - CV037
  - CV039
  - CV049
- calloutType: risk
  title: Debt plus utilization risk is the transmission channel to downside
  body: If GPU delivery and customer utilization ramp slower than expected, the same financing that enables scale can become the reason equity value compresses. In AI cloud, the wrong capacity curve damages both operating performance and multiple selection at once.
  claimRefs:
  - CV021
  - CV043
  - CV044
  - CV050
