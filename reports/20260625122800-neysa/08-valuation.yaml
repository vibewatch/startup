  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: neysa-revenue-economics
    missingEvidence: Current ARR or revenue run rate, gross margin, utilization, and mix between bare-metal, inference, and software services.
    whyItMatters: These metrics determine whether the $1.4B headline sits inside a supportable revenue multiple band or already assumes a bull case.
    diligencePath: Request monthly revenue bridge, gross profit by product line, GPU utilization, and booked-vs-live capacity schedules from management.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV020
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: neysa-terms-and-preferences
    missingEvidence: Debt pricing, collateral package, covenants, investor protections, liquidation preferences, anti-dilution rights, and board controls for the Blackstone round.
    whyItMatters: The economic price of the round can differ materially from the enterprise headline once structure and downside protections are known.
    diligencePath: Review the definitive debt and equity documents, cap-table waterfall, and any side letters before forming an entry-price view.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: neysa-customer-concentration
    missingEvidence: Customer concentration, reserved-capacity commitments, renewal terms, and proof of multi-year utilization beyond testimonials.
    whyItMatters: A few anchor customers or weak renewal terms could make the equity case much more fragile than the headline demand narrative suggests.
    diligencePath: Inspect top-customer schedules, contract tenors, prepaid commitments, and renewal cohorts; cross-check with pipeline conversion assumptions.
    relatedQuestionRefs:
    - QV010
    - QV024
    - QV028
    - QV029
  - type: private-evidence-only
    severity: minor
    topic: neysa-exit-path
    missingEvidence: A board-level view on target holding period, possible strategic buyers, or a realistic IPO readiness map supported by disclosure milestones.
    whyItMatters: Exit route affects acceptable entry multiple, dilution tolerance, and required pace of proof for the investment to work.
    diligencePath: Ask management and sponsor for the intended value-creation path, expected disclosure milestones, and realistic exit timelines under base and bear cases.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
