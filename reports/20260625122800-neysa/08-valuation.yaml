- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Sovereign AI demand
    - India-specific data residency, latency, and public-sector demand create a local wedge
    - Policy narrative can outrun actual monetization and could narrow if incumbents localize more aggressively
    - Show signed regulated-sector workloads and durable renewal behavior
  - - Full-stack differentiation
    - Integrated observability, MLOps, and security can raise switching costs versus raw GPU rental
    - Software attach may remain too small to offset compute commoditization
    - Disclose attach rates, margins, and share of revenue from managed services
  - - Sponsor advantage
    - Blackstone can help with procurement, credit access, and customer introductions
    - Majority PE ownership plus debt may also mean preference protections and stricter return hurdles
    - Share the term sheet, debt pricing, and any investor protections
  - - Customer proof
    - Public testimonials suggest locality, support, and compliance matter to real buyers
    - Testimonials are not the same as disclosed ARR, utilization, or concentration
    - Provide cohort data, reserved-capacity commitments, and concentration metrics
  - - Comp support
    - CoreWeave, Together AI, and DigitalOcean show real clouds can trade well above generic infrastructure multiples
    - Those comps disclose scale and revenue in ways Neysa does not, while Nebius is an outlier
    - Reveal enough operating data to place Neysa credibly inside the comp band
  - - Competition
    - Indian specialization may matter while global backlogs keep U.S. neoclouds focused elsewhere
    - Hyperscalers remain the real enemy because they can cross-subsidize GPU pricing and bundle contracts
    - Prove a durable TCO, compliance, or service advantage versus AWS/Azure/GCP
  notes: Rows separate company quality from price quality so the recommendation remains explicitly valuation-sensitive.
