tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Financing is real, but public revenue and term-sheet economics are not disclosed
    - Do not underwrite the $1.4B mark on public evidence alone
  - - Confidence
    - medium
    - Enough evidence exists to form a price-sensitive view, but the core valuation variables remain private
    - Keep the stance provisional until private diligence closes the gaps
  - - Risk rating
    - high
    - Debt layer, majority-sponsor structure, utilization risk, and hyperscaler competition all matter simultaneously
    - Assume downside protection is needed if pursuing the opportunity
  - - Valuation stance
    - stretched
    - Visible comp bands require materially more disclosed revenue than Neysa has publicly shown
    - Treat the round as a benchmark to test rather than as validation
  - - Upgrade trigger
    - Move inside roughly 10x-15x revenue with clean terms
    - Requires private proof of revenue or contracted utilization plus acceptable preferences/covenants
    - Only re-open aggressively if diligence shows real margin of safety
  - - Downgrade trigger
    - Hard debt terms or weak utilization proof
    - If economics depend mostly on narrative, the equity case deteriorates quickly
    - Move toward avoid if pricing risk compounds before scale appears
  notes: This table converts the public record into an investment stance; recommendation values are author judgments, not management guidance.
