- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Status
  - Public metric
  - Valuation / multiple
  - Relevance
  - Limitation
  rows:
  - - CoreWeave
    - Public AI cloud
    - Q1 2026 revenue $2.078B; backlog $99.4B
    - $55.03B market cap; ~6.6x annualized Q1 revenue
    - Closest scaled public neocloud reference for GPU-first infrastructure
    - Carries heavy leverage and concentration risk; more mature than Neysa
  - - Nebius
    - Public AI cloud
    - Q1 2026 revenue $399M
    - $65.92B market cap; ~41.3x annualized Q1 revenue
    - Shows what public markets pay for hypergrowth AI-cloud momentum
    - Outlier premium; not a normal underwriting benchmark
  - - DigitalOcean
    - Public managed cloud
    - FY2025 revenue $901M; ARR $970M; AI ARR $120M
    - $15.5B market cap; ~14.2x guided 2026 revenue
    - Useful for a software-attached, inference-heavy cloud model
    - Broader SMB cloud business with positive margins and longer operating history
  - - Oracle OCI
    - Public incumbent cloud segment
    - FY2026 OCI revenue $18.1B; RPO $638B
    - $453.76B market cap for whole company; segment not directly separable
    - Shows scale and financing flexibility incumbents bring to AI infrastructure
    - Mixes database, SaaS, and other businesses; not a startup comp
  - - Together AI
    - Private AI infra/API platform
    - 'Sacra estimate: ~$1B annualized revenue'
    - In talks at ~$7.5B pre-money; ~7.5x annualized revenue
    - Private-market reference for revenue-visible AI infrastructure
    - Estimate from third-party analysis, not audited disclosure
  - - Lambda
    - Private GPU cloud
    - 25,000+ GPUs and 5,000+ customers disclosed in 2025 reporting
    - $2.5B in Feb 2025 round; then >$1.5B Series E in Nov 2025
    - Shows scale and repeated capital needs of specialist GPU clouds
    - Revenue not publicly disclosed, so direct multiple unavailable
  - - Crusoe
    - Private integrated AI infrastructure
    - Bookings grew 5x in first three quarters of 2025; 1.2 GW campus phase live
    - '> $10B Series E valuation'
    - Reference for integrated power-plus-cloud premium
    - Power-led model is more vertically integrated than Neysa
  notes: The comp set intentionally mixes public neoclouds, managed-cloud analogs, and private AI infrastructure builders because Neysa has not disclosed enough economics to support a narrower pure-play match.
  enumerationScope:
    coverage: partial
    basis: Seven relevant public and private AI infrastructure references were selected for revenue visibility, valuation visibility, or capital-intensity insight as of the 2025-2026 window; the set is analytical rather than exhaustive.
