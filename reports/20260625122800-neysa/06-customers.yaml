  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, cohort retention, and renewal-rate disclosure for Neysa customers.
    whyItMatters: Without cohort retention metrics, it is impossible to distinguish durable infrastructure adoption from short-lived pilot wins or one-off project spend.
    diligencePath: Request a customer-metrics pack with logo retention, ARR retention, and cohort expansion by enterprise vs startup segments.
    relatedQuestionRefs:
    - QU022
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, top-10 customer concentration, and named-contract minimum commitments.
    whyItMatters: A few public logos could account for an outsized share of revenue, which would materially change downside risk if one account pauses expansion or re-procures.
    diligencePath: Request customer concentration tables, signed pipeline by stage, and anonymized ARR buckets for the ten largest accounts.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: material
    topic: customer-satisfaction
    missingEvidence: Reliable public review volume, customer SLA performance history, and referenceable support-quality evidence for Neysa itself.
    whyItMatters: Enterprise buyers re-procure on support and reliability as much as raw GPU cost; sparse review evidence makes platform durability harder to underwrite.
    diligencePath: Run reference calls with at least one regulated customer, one startup, and one systems-integrator partner; request support SLA dashboards and incident history.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A fuller named-customer roster covering government, healthcare, and startup segments with deployment stage and use-case detail.
    whyItMatters: The public proof table is broad enough to show adoption but still incomplete for understanding segment diversification and repeatability of the sales motion.
    diligencePath: Ask management for a customer reference list grouped by segment, stage, and production status, with permissioned anonymized examples where logos cannot be shared.
    relatedQuestionRefs:
    - QU011
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: partner-influence
    missingEvidence: Partner-sourced pipeline share, co-sell win rates, and attach rates for GreyLabs, Pipeshift, and broader channel partners.
    whyItMatters: The public partner program is clearly active, but without sourced-pipeline data it is hard to tell whether channel influence is incremental marketing or a major sales engine.
    diligencePath: Request channel attribution by sourced revenue, influenced revenue, and renewals, plus partner-tier counts and certification status.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU005
    - TU006
