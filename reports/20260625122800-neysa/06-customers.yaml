chapter:
  number: 6
  title: Customers
  summary: 'Neysa has credible public customer proof across regulated financial services, retail payments, travel, research, and an unnamed global medtech deployment, with the strongest outcome evidence coming from TIFIN (65% lower GPU spend, 99.95% uptime) and Innoviti (60% lower field-support TCO across a 50,000-merchant network). The customer story is still shallow relative to the scale implied by Neysa''s funding and GPU plans: partner-led routes clearly matter, named public references remain concentrated in a small set of verticals, and no public NRR, churn, contract-term, or customer-concentration data was found, while ClusterMAX published an adverse review highlighting security, usability, and monitoring gaps.'
sections:
- id: customer-segments-and-buying-motions
  title: Customer Segments and Buying Motions
  body: 'Neysa''s public positioning is broad but not random. Its own industry pages explicitly segment demand into regulated financial institutions, insurers, digital commerce teams, manufacturers, research institutions, and AI-native startups, all tied together by a common buying thesis: customers want GPU-heavy AI workloads without stitching together multiple hyperscaler services or taking data outside India. The regulated segments are the clearest. BFSI and insurance pages emphasize RBI, IRDAI, privacy, auditability, and model-governance requirements, while the sovereign-AI blog frames local jurisdiction and locally sourced infrastructure as a procurement requirement rather than a branding choice. Retail and manufacturing buyers are framed less around regulation and more around operational bottlenecks such as high inference cost, integration complexity, pilot-to-production delays, and edge or plant-floor deployment needs. Startups sit at the other end of the spectrum: the pitch is instant
    GPU access, usage-based pricing, no waitlists, and low-friction experimentation. This mix suggests Neysa is trying to serve both high-value regulated enterprises and faster-moving AI-native builders, but the public evidence shows the strongest referenceability in India-first sectors where sovereignty, latency, and support matter more than global breadth. Pricing and partner-program language also show that Neysa expects adoption to start with experimentation or targeted workloads before broad enterprise standardization.'
