- id: named-customer-proof-and-usage-patterns
  title: Named Customer Proof and Usage Patterns
  body: 'The strongest public customer proof comes from case studies that describe concrete production workloads rather than logo placements. TIFIN is the most complete proof point: Neysa says TIFIN serves India''s largest mutual funds and wealth managers, moved production workloads after reliability issues with another local neocloud, achieved 65% lower GPU spend versus hyperscalers, and reached 99.95% uptime. Innoviti is the clearest scaled operations reference: its payments network covers more than 50,000 merchants across 2,000 cities and includes enterprise retailers such as Reliance Retail, Shoppers Stop, and DMart; both Neysa and Innoviti describe the deployment as a move from proof-of-concept to a production AI inference environment, with 60% lower TCO, 7,000-plus daily ticket logs, 96% automated verification accuracy, and sub-30-second latency. ITQ extends the story into travel distribution, where airline-policy interpretation was running at hundreds of billions of tokens per month
    and general-purpose cloud economics reportedly broke down. Neysa also presents an unnamed global medtech user and IISc Bangalore as proof that the platform reaches both regulated healthcare innovation and research-heavy workloads. Independent reporting broadens the visible surface area: The Times of India names Juspay, Swiggy, and Perfios as key customers, while WEKA says Neysa serves customers ranging from startups to major enterprises and supports over 100 million tokens of daily processing. Together, the evidence supports real adoption, but it still relies on a relatively small number of public references and a mix of customer-owned, partner-owned, and company-owned narratives.'
