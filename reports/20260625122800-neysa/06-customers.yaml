- id: FU001
  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: Illustrates how Neysa moves buyers from regulated or cost-sensitive demand into production adoption and expansion.
  data:
    nodes:
    - label: 1. Need Trigger
      detail: AI teams hit cost, latency, compliance, or GPU-access limits on fragmented infrastructure
      tone: neutral
    - label: 2. Architecture Review
      detail: Buyers test sovereign-data posture, pricing model, and support responsiveness before committing regulated workloads
      tone: neutral
    - label: 3. Pilot / PoC
      detail: Neysa positions reserved or on-demand GPU capacity for proof workloads across BFSI, retail, manufacturing, research, and startups
      tone: neutral
    - label: 4. Production Deployment
      detail: Reference cases show live production or production-like deployment at TIFIN, Innoviti, ITQ, IISc, and a global medtech team
      tone: positive
    - label: 5. Optimization / Support
      detail: Customers seek lower token cost, fewer outages, and faster inference; partner bundles can add workflow-specific value
      tone: positive
    - label: 6. Expansion or Stall
      detail: Expansion depends on compliance approvals, cost discipline, and platform quality; weak monitoring or unclear renewals can stall broader rollouts
      tone: risk
