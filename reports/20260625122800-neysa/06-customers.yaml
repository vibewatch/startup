- id: TU006
  title: Procurement Friction and Channel Influence Table
  columns:
  - Theme
  - Evidence
  - Customer Segment
  - Implication
  - Diligence Ask
  rows:
  - - Data localization / sovereign control
    - BFSI and insurance pages stress RBI / IRDAI alignment, auditability, and in-region data handling
    - Regulated enterprise
    - Procurement approval depends on compliance and architecture review, not just model accuracy
    - Review architecture diagrams, key-management model, and regulator-facing documentation
  - - Pilot-to-production transition
    - BFSI, insurance, retail, and manufacturing pages all cite delays moving from PoC or pilot to production
    - Cross-vertical
    - Budget conversion may lag technical enthusiasm
    - Request average conversion time, pilot success rate, and paid-production rate
  - - Cost transparency
    - Pricing page offers hourly pricing, reserved discounts, and no egress / API surprise fees
    - Startups and enterprise workload owners
    - Lower-friction experimentation can help land deals
    - Compare realized bills for sample workloads against hyperscaler alternatives
  - - Partner-led distribution
    - Partner page promises resellers, SIs/MSPs, ISVs, referral fees, revenue sharing, and co-selling
    - Channel ecosystem
    - Channel may materially influence how customers discover and buy Neysa
    - Request split of sourced pipeline by direct, partner-sourced, and co-sold motions
  - - Workload optimization burden
    - Economic Times says a Neysa client still struggled with token costs and latency because workloads were unoptimized
    - Enterprise AI adopters
    - Customer success may require architecture help beyond raw GPU access
    - Ask for managed optimization playbooks, FinOps tooling, and reference workload benchmarks
  notes: This exhibit translates marketing and press evidence into concrete buying friction themes; most items describe procurement mechanics, not closed-won outcomes.
