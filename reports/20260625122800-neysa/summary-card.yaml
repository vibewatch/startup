summary:
  headline: >-
    Neysa has a credible sovereign-AI infrastructure wedge and sponsor-backed scale capital, but the current ~$1.4B
    price is not yet supported by public evidence on revenue quality, utilization, margins, or debt structure.
  overallScore: 5.8
  recommendation: research-more
