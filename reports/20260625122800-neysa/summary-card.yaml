  topStrengths:
    - >-
      Founder-market fit is unusually strong for India AI infrastructure, combining Netmagic-era data-center execution
      with current sovereign-cloud demand.
    - >-
      Public customer case studies show concrete value on cost, uptime, and latency for regulated and operationally
      intensive workloads.
    - >-
      Blackstone-backed financing materially improves Neysa's ability to secure GPU supply and build local AI capacity
      at a time when India is pushing sovereign compute.
  topRisks:
    - >-
      Public disclosures do not show ARR, gross margin, utilization, debt pricing, or preference stack terms, making the
      $1.4B valuation hard to underwrite.
    - >-
      Neysa's economics depend on scaling from roughly 1,200 live GPUs toward 20,000-plus without supply, power, or
      occupancy shortfalls.
    - >-
      Hyperscalers and strong Indian rivals can compress pricing while enterprise and government procurement cycles
      remain long and concentrated.
  unresolvedGaps:
    - No audited revenue, backlog, gross margin, burn, or cash-runway figures are public.
    - Debt tranche terms, security package, covenants, and refinancing assumptions remain undisclosed.
    - Public evidence on customer concentration, retention, contract duration, and renewal rates is shallow.
    - >-
      Conflicting public data on employee count, live GPU inventory, and exact facility rollout timing needs management
      reconciliation.
