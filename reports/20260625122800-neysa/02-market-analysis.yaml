  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A public, buyer-segmented India AI-cloud or GPU-infrastructure revenue series that separates sovereign/public compute, regulated enterprise demand, and generic cloud adjacency.
      whyItMatters: Without a clean segmented revenue series, SAM and SOM must rely on adjacent-market and capacity proxies rather than direct demand measurement.
      diligencePath: Request operator pipeline, reservation, and utilization data under NDA from Neysa, Yotta, and hyperscaler India teams; cross-check with IDC/Gartner custom cuts.
      relatedQuestionRefs: [QM020, QM022, QM023, QM026]
    - type: private-evidence-only
      severity: material
      topic: som-proxy
      missingEvidence: Customer-level contract values, reserved-capacity commitments, and realized GPU utilization for Neysa and comparable Indian GPU clouds.
      whyItMatters: A credible SOM for Neysa depends on paid utilization and contract mix, not just announced GPU deployments or headline funding rounds.
      diligencePath: Ask management for cohort-level ARR, active GPU count, reserved-versus-on-demand split, and top-customer concentration by sector.
      relatedQuestionRefs: [QM023, QM026]
    - type: missing-source
      severity: minor
      topic: power-water-mapping
      missingEvidence: City-by-city AI-campus data on available power, water sourcing, cooling design, and delivery timelines for target facilities in Mumbai, Hyderabad, Pune, Chennai, and Vizag.
      whyItMatters: Conversion timing depends on whether announced sites can actually energize and cool high-density GPU clusters on schedule.
      diligencePath: Map Neysa and competitor campuses against state utility approvals, renewable PPAs, and cooling-water plans before underwriting aggressive capacity ramps.
      relatedQuestionRefs: [QM017, QM018, QM026]
