callouts:
  - calloutType: insight
    title: The best market lens is a constrained-SAM thesis, not a giant-TAM story
    body: The evidence supports a meaningful India opportunity, but only after narrowing broad cloud and data-center totals to workloads that actually value sovereign compute, local latency, or regulated deployment support.
    claimRefs: [CM023, CM037, CM044, CM045]
  - calloutType: risk
    title: Physical infrastructure may bottleneck revenue faster than demand does
    body: Power, water, thermal design, grid execution, and GPU lead times are the main reasons announced AI-infrastructure capacity may monetize more slowly than bullish funding headlines imply.
    claimRefs: [CM028, CM031, CM032, CM033, CM049]
