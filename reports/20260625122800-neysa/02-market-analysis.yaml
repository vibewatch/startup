  claims:
    - {id: CM001, statement: "India approved the IndiaAI Mission with a budget outlay of Rs.10,371.92 crore and an initial public AI compute infrastructure target of 10,000 or more GPUs built through public-private partnership.", type: observed, topic: indiaai-mission, sourceRefs: [SM001, SM019], confidence: high, freshness: recent, answersQuestionRefs: [QM001]}
    - {id: CM002, statement: "The IndiaAI Mission is designed as a full ecosystem program covering compute, indigenous models, datasets, application development, skills, startup financing, and safe-and-trusted AI rather than as a compute-only subsidy.", type: observed, topic: indiaai-mission, sourceRefs: [SM001, SM003], confidence: high, freshness: current, answersQuestionRefs: [QM007, QM021]}
    - {id: CM003, statement: "The India AI Governance Guidelines state that more than 38,000 GPUs had been onboarded through a subsidized national compute facility by February 2026.", type: observed, topic: sovereign-compute, sourceRefs: [SM003, SM015], confidence: high, freshness: current, answersQuestionRefs: [QM001, QM002, QM005]}
    - {id: CM004, statement: "ETGovernment reported that India planned to add another 20,000 GPUs to the 38,000-plus already provisioned under the IndiaAI Mission, implying sovereign compute capacity of roughly 58,000 GPUs.", type: third-party-reported, topic: sovereign-compute, sourceRefs: [SM015], confidence: medium, freshness: current, answersQuestionRefs: [QM002, QM015]}
    - {id: CM005, statement: "India's sovereign-AI strategy is explicitly framed around democratised compute access, indigenous model development, and institutional control rather than dependence on foreign platforms alone.", type: observed, topic: sovereign-ai, sourceRefs: [SM001, SM003, SM016], confidence: high, freshness: current, answersQuestionRefs: [QM004, QM021]}
    - {id: CM006, statement: "The Reserve Bank of India requires payment-system data to be stored only in India, creating a concrete localization driver for domestic AI and cloud infrastructure in financial workloads.", type: observed, topic: data-localization, sourceRefs: [SM004, SM019], confidence: high, freshness: historical, answersQuestionRefs: [QM003, QM012]}
    - {id: CM007, statement: "S&P Global argues that India's data-center and AI-infrastructure demand has been strengthened by the RBI localization rule, the 2023 Digital Personal Data Protection Act, and the 2024 launch of the IndiaAI Mission.", type: third-party-reported, topic: policy-demand, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM016]}
    - {id: CM008, statement: "Oracle already operates two OCI public-cloud regions in India—Mumbai and Hyderabad—and explicitly treats India as a two-region country for commercial-cloud business continuity.", type: observed, topic: hyperscaler-structure, sourceRefs: [SM007], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010]}
    - {id: CM009, statement: "Google Cloud markets AI-optimized infrastructure, global regions, and SLA-backed data residency for foundational and agentic workloads, which defines the baseline local providers must compete against.", type: observed, topic: hyperscaler-structure, sourceRefs: [SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM010, QM011]}
    - {id: CM010, statement: "AWS frames cloud competition around broad regional service breadth that includes EC2, EKS, Lambda, Redshift, and SageMaker, reinforcing how wide the hyperscaler feature set is relative to local GPU specialists.", type: observed, topic: hyperscaler-structure, sourceRefs: [SM005], confidence: medium, freshness: current, answersQuestionRefs: [QM010, QM011]}
    - {id: CM011, statement: "Financial Express reported that Microsoft committed $17.5 billion to India between 2026 and 2029, on top of the $3 billion announced earlier, to expand cloud and AI infrastructure and sovereign digital capabilities.", type: third-party-reported, topic: hyperscaler-investment, sourceRefs: [SM021, SM022], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010, QM016]}
    - {id: CM012, statement: "Microsoft's India South Central region in Hyderabad is expected to go live in mid-2026 as the company's largest cloud region in India, alongside expansion of existing regions in Chennai, Hyderabad, and Pune.", type: third-party-reported, topic: hyperscaler-investment, sourceRefs: [SM021, SM022], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010]}
    - {id: CM013, statement: "CRN Asia reported that AWS has committed $8.3 billion to its Mumbai region, indicating that hyperscalers are still investing heavily in India even as local AI clouds scale up.", type: third-party-reported, topic: hyperscaler-investment, sourceRefs: [SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010]}
    - {id: CM014, statement: "CRN Asia reported that Google is building a $15 billion AI hub in Visakhapatnam with AdaniConneX and Nxtra by Airtel, extending India's AI infrastructure buildout beyond the traditional metro markets.", type: third-party-reported, topic: hyperscaler-investment, sourceRefs: [SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM010]}
    - {id: CM015, statement: "Yotta's Shakti Cloud says it is India's sovereign AI cloud and advertises the country's largest NVIDIA deployment with 8,000-plus H100 GPUs and future B200 capacity.", type: company-claimed, topic: local-competition, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM015]}
    - {id: CM016, statement: "Shakti Cloud says its Microsoft-aligned sovereign infrastructure is designed to satisfy the DPDP Act and Indian data-residency norms for enterprise AI workloads.", type: company-claimed, topic: data-residency, sourceRefs: [SM004, SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM010, QM012, QM021]}
    - {id: CM017, statement: "Neysa's pricing page lists H100 SXM instances from $4.39 per hour and H200 SXM from $4.73 per hour and claims up to 70% lower total cost of ownership versus general-purpose hyperscalers.", type: company-claimed, topic: neysa-pricing, sourceRefs: [SM009], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM022]}
    - {id: CM018, statement: "Neysa positions its AI cloud as India-built, GPU-first, and deployable across private, hybrid, and public cloud models rather than as a generic public-cloud substitute.", type: company-claimed, topic: neysa-positioning, sourceRefs: [SM009, SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM004, QM011, QM022]}
    - {id: CM019, statement: "Neysa's homepage uses customer examples to argue that local infrastructure matters when buyers need lower latency, India-specific model performance, predictable cost, and data residency that hyperscalers do not fully solve.", type: company-claimed, topic: customer-needs, sourceRefs: [SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM008, QM012, QM022]}
    - {id: CM020, statement: "Blackstone, Neysa, and multiple news reports say Neysa plans to deploy more than 20,000 GPUs in India using a $1.2 billion financing package.", type: third-party-reported, topic: neysa-capacity, sourceRefs: [SM011, SM012, SM013, SM014, SM023, SM024], confidence: high, freshness: current, answersQuestionRefs: [QM015, QM016, QM022]}
    - {id: CM021, statement: "TechCrunch reported that Blackstone estimates India currently has fewer than 60,000 GPUs deployed and expects that figure to scale to more than 2 million in the coming years.", type: third-party-reported, topic: national-gpu-base, sourceRefs: [SM012, SM013], confidence: medium, freshness: current, answersQuestionRefs: [QM015]}
    - {id: CM022, statement: "TechCrunch says demand for domestic AI compute in India is being driven by government programs, regulated sectors that need local data, and AI developers or labs seeking lower-latency in-country capacity.", type: third-party-reported, topic: demand-drivers, sourceRefs: [SM012, SM023], confidence: medium, freshness: current, answersQuestionRefs: [QM007, QM008, QM012, QM016]}
    - {id: CM023, statement: "Arizton values the India data-center market at $9.79 billion in 2025 and projects it to reach $21.03 billion by 2031 at a 13.59% CAGR.", type: third-party-reported, topic: market-size-adjacent, sourceRefs: [SM020], confidence: medium, freshness: current, answersQuestionRefs: [QM005, QM014, QM024]}
    - {id: CM024, statement: "JLL projects that India will add 604 MW of data-center capacity between H2 2024 and 2026, requiring 7.3 million square feet of space and $3.8 billion of capital investment.", type: third-party-reported, topic: capacity-additions, sourceRefs: [SM017], confidence: medium, freshness: recent, answersQuestionRefs: [QM005, QM014, QM016, QM019]}
    - {id: CM025, statement: "JLL identifies Navi Mumbai as a pre-leasing hotspot with potential demand of about 800 MW, illustrating how AI-cluster demand is concentrating around power-rich campuses rather than evenly across India.", type: third-party-reported, topic: geographic-concentration, sourceRefs: [SM017], confidence: medium, freshness: recent, answersQuestionRefs: [QM009, QM017]}
    - {id: CM026, statement: "Cushman & Wakefield says India has 1.6 GW of operational data-center capacity and 3.1 GW under construction or planned, with Mumbai set to exceed 1 GW of operational capacity by end-2026 and Hyderabad ranking ninth globally among secondary markets.", type: third-party-reported, topic: capacity-pipeline, sourceRefs: [SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM005, QM009, QM014]}
    - {id: CM027, statement: "Cushman says power availability, execution capability, land access, and regulatory readiness are now central competitive variables in AI-led data-center expansion.", type: third-party-reported, topic: execution-constraints, sourceRefs: [SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM016, QM017, QM025]}
    - {id: CM028, statement: "S&P Global estimates India's datacenter electricity demand at about 13 TWh in 2024 and projects it to reach 57 TWh by 2030, alongside more than 5 GW of additional IT load capacity.", type: third-party-reported, topic: power-demand, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM005, QM017, QM025]}
    - {id: CM029, statement: "S&P expects India to become the second-largest datacenter electricity-demand market in Asia-Pacific within two years, surpassing Japan and Australia.", type: third-party-reported, topic: regional-position, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM016, QM025]}
    - {id: CM030, statement: "S&P says Maharashtra, Telangana, and Karnataka account for about 70% of India's operating data-center capacity, showing that supply remains geographically concentrated.", type: third-party-reported, topic: geographic-concentration, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM017]}
    - {id: CM031, statement: "S&P says energy costs represent about 65% of datacenter operating expense in India, making power economics central to neo-cloud pricing and margins.", type: third-party-reported, topic: power-economics, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM017, QM025]}
    - {id: CM032, statement: "S&P says water availability is a growing risk in Mumbai, Bengaluru, and Chennai and cites Uptime Institute data that a 1 MW data-center load can need about 25.5 million liters of cooling water per year.", type: third-party-reported, topic: water-risk, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM018, QM025]}
    - {id: CM033, statement: "S&P estimates that India may need 15 GW to 30 GW of additional renewable capacity over the next five years to satisfy projected datacenter electricity demand.", type: third-party-reported, topic: renewables, sourceRefs: [SM019], confidence: medium, freshness: current, answersQuestionRefs: [QM018, QM025]}
    - {id: CM034, statement: "EY argues that sovereign AI in India requires domestic infrastructure, local data control, talent, legal frameworks, and cybersecurity because dependence on foreign platforms creates resilience and security risks.", type: third-party-reported, topic: sovereign-ai, sourceRefs: [SM016], confidence: medium, freshness: current, answersQuestionRefs: [QM004, QM021]}
    - {id: CM035, statement: "The IndiaAI Mission makes startups, researchers, and public-interest AI applications explicit target users of domestic compute, meaning early market demand is not limited to large enterprises.", type: observed, topic: buyer-base, sourceRefs: [SM001, SM003], confidence: high, freshness: current, answersQuestionRefs: [QM007, QM008]}
    - {id: CM036, statement: "CRN Asia reports that AI startups, GCCs, and mid-sized enterprises are active buyers of AI infrastructure and that these deployments are smaller than hyperscale campuses but more accessible to mid-market execution partners.", type: third-party-reported, topic: buyer-base, sourceRefs: [SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM007, QM020]}
    - {id: CM037, statement: "CRN Asia cites IDC in projecting that India's public-cloud services market will reach $30.4 billion by 2029, which is a useful adjacency but materially broader than Neysa's direct AI-infrastructure market.", type: third-party-reported, topic: market-size-adjacent, sourceRefs: [SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM005, QM013, QM024]}
    - {id: CM038, statement: "Moneycontrol describes Neysa as a domestic alternative to AWS and Azure for GPU-as-a-service and local data hosting, especially for regulated and high-performance workloads.", type: third-party-reported, topic: neysa-positioning, sourceRefs: [SM023], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM022]}
    - {id: CM039, statement: "Shakti Cloud claims multiple in-country regions, RBI-, ISO-, and SOC-certified data centers, and low-latency nationwide access for regulated AI workloads.", type: company-claimed, topic: local-competition, sourceRefs: [SM008], confidence: medium, freshness: current, answersQuestionRefs: [QM008, QM012]}
    - {id: CM040, statement: "Financial Express reports that Microsoft launched sovereign public-cloud and sovereign private-cloud offerings for Indian organizations alongside the new infrastructure commitment.", type: third-party-reported, topic: sovereign-cloud, sourceRefs: [SM022], confidence: medium, freshness: current, answersQuestionRefs: [QM010, QM021]}
    - {id: CM041, statement: "The IndiaAI portal shows the public program is building an ecosystem around initiatives, datasets, standards, research, startups, and companies rather than only around raw compute allocation.", type: observed, topic: ecosystem, sourceRefs: [SM002], confidence: medium, freshness: current, answersQuestionRefs: [QM007, QM021]}
    - {id: CM042, statement: "Moneycontrol says many Indian firms still rely on foreign cloud providers for AI workloads and therefore face privacy-compliance, latency, and cost concerns when infrastructure sits outside India.", type: third-party-reported, topic: local-demand, sourceRefs: [SM023], confidence: medium, freshness: current, answersQuestionRefs: [QM012, QM021]}
    - {id: CM043, statement: "CRN Asia says buyers in banking, healthcare, and government are placing data-residency and sovereignty requirements on infrastructure decisions, affecting site choice, architecture, and partner selection.", type: third-party-reported, topic: local-demand, sourceRefs: [SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM012, QM021]}
    - {id: CM044, statement: "No public source in the current evidence set cleanly isolates India AI-cloud or GPU-infrastructure revenue by buyer segment, so SAM must be framed through adjacent cloud/data-center markets plus sovereign-compute and operator-capacity proxies.", type: inferred, topic: sizing-gap, sourceRefs: [SM017, SM018, SM020, SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM006, QM022, QM024]}
    - {id: CM045, statement: "Applying S&P's disclosed IndiaAI floor price of $1.36 per GPU hour to 34,371 awarded GPUs implies an annualized public-compute spend equivalent of about $0.41 billion at full utilization.", type: estimated, topic: public-compute-floor, sourceRefs: [SM019], confidence: low, freshness: current, answersQuestionRefs: [QM005, QM015, QM022]}
    - {id: CM046, statement: "Applying the same $1.36 per GPU hour rate to the 38,000-plus GPUs cited in the 2026 governance guidelines implies an annualized public-compute floor of about $0.45 billion at full utilization.", type: estimated, topic: public-compute-floor, sourceRefs: [SM003, SM019], confidence: low, freshness: current, answersQuestionRefs: [QM005, QM015, QM022]}
