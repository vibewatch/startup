company:
  name: Neysa
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Neysa's addressable market in India is narrower than generic cloud but materially larger than a single GPU-rental niche: it sits where sovereign compute, regulated-data workloads, India-specific latency/performance needs, and hands-on AI infrastructure operations matter more than commodity public cloud. Public policy has now created a visible demand floor—IndiaAI's Rs.10,371.92 crore mission, 38,000+ onboarded GPUs, and a planned expansion to roughly 58,000 sovereign GPUs—while hyperscalers and local operators race to add capacity. The cleanest sizing view is multi-lens rather than one TAM headline: India public cloud could reach $30.4B by 2029 (broad adjacency), India data-center investment is projected at $21.03B by 2031, and government-backed compute alone implies a roughly $0.41B-$0.69B annualized public-compute floor at disclosed subsidized pricing. Neysa's most supportable SAM is the subset of government, regulated enterprise, GCC, startup, and AI-lab workloads that require in-country GPU capacity, data assurance, and lower-latency deployment. The market is attractive, but power, water, land, execution capability, and GPU supply remain real constraints on how fast announced demand becomes revenue.
sections:
  - id: market-boundary-and-structure
    title: Market boundary and market structure
    body: >-
      Neysa does not compete for all Indian cloud spending. Its relevant market includes GPU-as-a-service, AI training and inference clusters, AI-platform infrastructure, sovereign/public compute pools, and the colocation, power, cooling, and orchestration layers needed to operate those workloads in India. It excludes generic SaaS, horizontal enterprise software, standard CPU cloud, and most non-AI data-center construction not tied to high-density compute. That boundary matters because broad public-cloud or data-center totals overstate Neysa's true opportunity unless they are narrowed to workloads that value local GPUs, data residency, performance tuning, or dedicated support. India now has a three-part market structure: a public sovereign-compute layer led by IndiaAI; global hyperscalers such as Microsoft, AWS, Google, and Oracle that sell regional cloud footprints plus sovereign-ready controls; and local neo-cloud/data-center operators such as Neysa and Yotta that package dedicated GPUs, domestic hosting, and India-specific service levels. The strategic substitution pattern is also clear: buyers can stay on generic hyperscalers, build private clusters, or use Indian AI clouds that promise lower latency, stronger residency posture, and more predictable GPU economics.
    claimRefs: [CM001, CM005, CM006, CM008, CM011, CM015, CM018, CM034, CM052, CM053]
    tableRefs: [TM001]
    figureRefs: [FM004]
  - id: sizing-lenses-and-neysa-sam
    title: Sizing lenses and Neysa addressable market
    body: >-
      Public sources do not provide a clean, directly measured India AI-cloud or GPU-infrastructure TAM, so the chapter uses multiple lenses. The broadest adjacency is IDC's India public-cloud projection of $30.4B by 2029, but that includes many workloads Neysa will never touch. A tighter infrastructure lens comes from Arizton's India data-center market estimate of $9.79B in 2025 growing to $21.03B by 2031, reinforced by Cushman and JLL's evidence of a multi-gigawatt build pipeline, but those figures still include generic capacity. The most decision-useful floor is sovereign/public compute: S&P says 34,371 GPUs had been awarded in IndiaAI tenders by mid-2025 at subsidized rates as low as $1.36 per GPU hour, the official governance guidelines say 38,000+ GPUs were onboarded by February 2026, and ETGovernment says an additional 20,000 GPUs were being added to reach roughly 58,000. Annualizing those disclosed public-compute footprints yields an evidence-backed floor of roughly $0.41B-$0.69B before private enterprise demand. Neysa's SAM therefore sits between that public floor and the much broader cloud/data-center adjacencies, concentrated in regulated enterprises, government programs, GCCs, startups, and AI labs that need in-country GPU clusters rather than generic cloud bundles.
    claimRefs: [CM003, CM004, CM020, CM021, CM023, CM024, CM026, CM028, CM037, CM044, CM045, CM046, CM047, CM048]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]
  - id: buyers-sovereignty-and-adoption-path
    title: Buyers, sovereignty dynamics, and the adoption path
    body: >-
      Budget ownership in this market is fragmented. Government demand comes from IndiaAI itself, sector ministries, public institutions, and state-level programs that need subsidized compute, model development, and public-interest AI applications. Regulated enterprises in banking, healthcare, and public services increasingly care about local data hosting, auditability, and the ability to keep sensitive model-training workflows within India. GCCs and AI-native startups form a third buyer cluster: they may not own hyperscale budgets, but they are often the fastest adopters of dedicated GPU capacity, inference endpoints, and deployment support. Hyperscalers and global AI labs can also become customers or channel partners when they need in-country inference capacity, overflow clusters, or sovereign-ready footprints. The adoption path is therefore not simply buyer to cloud region; it often runs from policy or compliance trigger, to local hosting requirement, to either public sovereign compute or a neo-cloud operator that can provide dedicated GPUs plus hands-on integration. Microsoft explicitly markets sovereign public and sovereign private cloud offerings for Indian organizations, while Neysa and Yotta pitch India-first performance, compliance, and lower-friction deployment. That dynamic helps explain why the market can support both hyperscalers and local specialists rather than one winner-take-all model.
    claimRefs: [CM002, CM006, CM012, CM016, CM019, CM022, CM035, CM040, CM041, CM042, CM043, CM050]
    tableRefs: [TM003]
    figureRefs: [FM003]
  - id: growth-drivers-and-constraints
    title: Growth drivers and constraints
    body: >-
      Demand is rising because policy, capital, and usage are finally lining up. IndiaAI lowers the entry cost for startups and researchers; hyperscalers are adding sovereign-ready capacity; Blackstone's financing of Neysa and Yotta's scale-up show institutional belief that India needs domestic AI compute; and data-center developers are expanding across Mumbai, Hyderabad, Chennai, Pune, Delhi NCR, and emerging AI hubs such as Vizag. The key constraint is that announced capacity is not the same as operational, revenue-generating AI infrastructure. Cushman, JLL, and CRN all describe a market where execution capability, power availability, land access, and thermal design are becoming as important as demand. S&P adds the harder physical bottlenecks: datacenter electricity demand could rise from 13 TWh in 2024 to 57 TWh by 2030, energy already represents around 65% of operating expense, water stress threatens major urban clusters, and 15-30 GW of additional renewable capacity may be needed over five years. GPU supply and utilization visibility are also weak. For Neysa, that means the opportunity is real but conversion speed depends on solving power, cooling, and deployment bottlenecks faster than generic hyperscalers or rival Indian GPU clouds.
    claimRefs: [CM011, CM017, CM020, CM024, CM027, CM028, CM029, CM031, CM032, CM033, CM036, CM049]
    tableRefs: [TM004]
