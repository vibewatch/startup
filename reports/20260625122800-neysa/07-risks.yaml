  evidenceGaps:
  - type: missing-source
    severity: material
    topic: utilization-disclosure
    missingEvidence: Current public disclosure of live utilization, reserved usage, occupancy, or GPU-hours sold by cohort.
    whyItMatters: The investment case depends on whether capex is converting into repeatable usage before debt and depreciation scale up.
    diligencePath: Request monthly capacity dashboards showing installed GPUs, active GPUs, reserved usage, and realized utilization by customer segment.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Debt covenant, interest-rate, amortization, security-package, and liquidity-cushion terms for the intended $600 million debt tranche.
    whyItMatters: Financing structure determines how much operating variance Neysa can absorb before equity value is impaired.
    diligencePath: Obtain lender term sheets or board-approved financing summary with covenant package and downside operating cases.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: uptime-and-incidents
    missingEvidence: Historical uptime, incident counts, MTTR, SLA attainment, and customer-facing postmortem evidence.
    whyItMatters: Neysa is selling mission-critical infrastructure to regulated users, so operational credibility must be measured rather than inferred from marketing copy.
    diligencePath: Request 12-month reliability dashboard plus anonymized incident postmortems and SLA-credit history.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration, expansion, renewal, and churn data by top customer and vertical.
    whyItMatters: A handful of lighthouse accounts can validate the platform but also create downside if reference customers are disproportionately important to utilization.
    diligencePath: Request top-10 customer concentration, reserved-versus-on-demand split, and cohort retention by segment.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Customer-inspectable assurance package beyond public website claims, including certificate scope, penetration-test summary, and control exceptions.
    whyItMatters: Security marketing is useful for sourcing demand, but regulated buyers and investors need evidence that controls are audited, current, and operationally effective.
    diligencePath: Ask for latest ISO 27001 certificate details, SOC report scope, external pentest summary, and remediation tracker.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: minor
    topic: governance-visibility
    missingEvidence: Current board committees, reserved matters, and post-Blackstone governance structure.
    whyItMatters: A majority-investor infrastructure company needs governance mechanisms that can discipline capex pacing and risk management as the fleet scales.
    diligencePath: Request board composition, committee charters, and escalation rights around capex, cyber, and liquidity decisions.
