  title: The financing round solves access to capital, not the harder problem of matching capital to filled clusters
  body: The Blackstone-led raise clearly improves Neysa’s ability to buy GPUs and build sites, but it also makes utilization the central KPI. If reserved demand, public-sector conversion, or enterprise production migrations lag capex, the downside reaches cash flow before it reaches narrative.
