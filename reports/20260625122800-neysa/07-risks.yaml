- id: supply-chain-power-and-hyperscaler-pressure
  title: GPU supply, power availability, and hyperscaler competition compound each other rather than acting independently
  body: 'Neysa’s supply-side exposure is unusually concentrated for a young company. Business Standard quoted management saying roughly 95% of the fleet was Nvidia-based, with only some AMD inventory and ongoing discussions about broader silicon diversity. That matters because the same 2026 news cycle shows Neysa explicitly talking about supply-chain resilience while competing against AWS, Azure, and Google products that already market massive H100 or H200 clusters, deep interconnects, and mature AI ecosystems. The competition problem is not merely a list-price problem. Neysa must secure chips, deploy them, power them, cool them, and keep them full while buyers continue to compare it with vendors whose GPU supply, software breadth, and financing capacity are much larger. Sector evidence increases the pressure: Indian data-centre commentary now points to a jump from roughly 1 GW of operational electricity demand in 2025 to 13 GW by FY32, while AI-ready racks can require 80–120 kW and large
    loads need heavy storage and redundant power planning. A supply slip, power bottleneck, or slower-than-expected ramp in paid utilization would reinforce the others.'
