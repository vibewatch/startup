- id: customer-proof-concentration-and-operations
  title: Public customer proof is credible but still narrow enough that concentration and execution risk remain elevated
  body: 'There is now real public deployment proof, but it is not yet broad enough to neutralize concentration concerns. Neysa’s site names a handful of customers and use cases across research, payments, voice AI, and enterprise automation, while earlier financing coverage referenced paying customers across AI-native startups, media, software vendors, public sector users, and other enterprise categories. The best documented workloads are also the most demanding. The IISc case study describes a 33 million-pair data generation pipeline plus repeated 7B and 13B training runs on dedicated bare metal. Innoviti describes 50,000-plus merchants, 7,000-plus daily service ticket logs, payment-data sensitivity, and a hard requirement for deterministic sub-30-second inference. Those are meaningful proof points, but they also imply the early reference base is concentrated in high-stakes workloads where a single outage, migration delay, or cost overrun can damage reputation disproportionately. The monitoring
    role on Neysa’s careers page reinforces the same point: reliable operations, patching, and incident response are already central execution muscles, not back-office nice-to-haves.'
