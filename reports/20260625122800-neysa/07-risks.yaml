chapter:
  number: 7
  title: Risks
  summary: 'Neysa’s core risk is executional transmission: a debt-assisted plan to scale from roughly 1,200 live GPUs to more than 20,000 has to stay supplied, powered, utilized, compliant, and reliable before hyperscalers and Indian rivals compress the economics. Public evidence shows real traction, policy tailwinds, and differentiated in-country positioning, but the same evidence also shows dependence on Nvidia-heavy supply, IndiaAI-driven demand, regulated-workload uptime obligations, and valuation downside if occupancy, customer breadth, or financing discipline lag the capex curve.'
sections:
- id: capital-intensity-and-utilization
  title: Capital intensity and utilization are the first-order risk because every other upside assumption depends on them
  body: The public record now frames Neysa less as a software startup and more as an infrastructure balance-sheet story. Blackstone’s February 2026 deal was not a small growth extension; it paired up to $600 million of fresh equity with an intended $600 million of debt and tied that financing directly to a plan to deploy more than 20,000 GPUs in India. TechCrunch simultaneously reported about 1,200 GPUs live and a goal to more than triple capacity within a year if advanced customer conversations convert. That creates a narrow operating window. Pricing pages show aggressive committed-use discounts, including large savings on multi-year H100 reservations, and the company advertises no extra charges for egress or inference transactions. Those terms can help win share, but they also make occupancy, reservation capture, and fleet utilization decisive for margin recovery. If deployments slip, debt documents tighten, or customers stay in pilot mode instead of moving to sustained reserved usage,
    the downside hits cash flow first and valuation second.
