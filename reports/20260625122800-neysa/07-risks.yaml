- calloutType: risk
  title: Sovereign-compute positioning is helpful but not exclusive
  body: IndiaAI empanelment, in-country deployment, and DPDP-aware messaging are real differentiators, yet the public record also shows multiple Indian providers and rapidly scaling global incumbents chasing the same regulated-workload opportunity. Policy support should be treated as an accelerator, not a permanent moat.
