- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public proxy
  - Exact diligence path
  rows:
  - - Revenue / ARR / recurring mix
    - Needed for valuation, debt sizing, and revenue-quality judgment
    - Broad third-party revenue bands only
    - Obtain audited statements and a monthly revenue bridge by product line
  - - Gross margin / contribution margin
    - Determines whether customer savings claims still leave room for attractive unit economics
    - No public disclosure
    - Request COGS breakdown for compute, power, support, and depreciation
  - - Cash, burn, and runway
    - Determines next-round timing and covenant resilience
    - No public disclosure
    - Request current cash, forecast burn, and undrawn capital availability
  - - Utilization / reserved mix / renewals
    - Occupancy is the core driver of capex payback and debt service coverage
    - Case studies imply production use but no portfolio-wide metric
    - Request occupancy by SKU, reserved-vs-on-demand mix, and renewal cohorts
  - - Debt tenor, coupon, collateral, covenants
    - The new debt tranche is the biggest swing factor in downside risk
    - Only size is public
    - Request signed debt term sheet and board financing memo
  - - Customer concentration / backlog
    - Long-duration contracts determine whether buildout is demand-backed or speculative
    - Public sector references and customer logos only
    - Request top-customer concentration, backlog, and contract duration data
  notes: 'Nulls are intentional: the chapter avoids inventing ARR, burn, margin, or backlog where public evidence is absent.'
