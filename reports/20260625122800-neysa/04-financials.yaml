- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - On-demand GPU instances
    - Hourly VM or container consumption on shared cloud
    - USD per GPU-hour
    - Public list pricing live for L4/L40S/H100/H200
    - Fast-converting but likely most volatile and utilization-sensitive
    - Need realized blended rate and occupancy by SKU
  - - Reserved capacity
    - 1- to 36-month commit plans with discounting
    - Monthly or term commit
    - Publicly disclosed commit framework and discount claims
    - Higher quality if backed by minimum commits and renewal behavior
    - Need booked ARR/MRR, cancellation rights, and renewal rates
  - - Bare-metal dedicated clusters
    - Single-tenant 8-GPU nodes and larger dedicated environments
    - Monthly node or cluster fee
    - Public bare-metal SKUs and customer proofs are visible
    - Likely higher ACV and lower churn but capital intensive
    - Need minimum contract term and gross margin by cluster type
  - - Managed inference endpoints
    - Single-tenant or dedicated inference APIs via Velocis and Pipeshift
    - Contract or usage fee
    - Product exists publicly but standalone pricing is not disclosed
    - Potentially stickier and more software-like than raw compute
    - Need pricing metric, attach rate, and gross margin split
  - - Platform / MLOps / security tools
    - AI Studio, orchestration, observability, and Aegis controls
    - Subscription, bundle, or services
    - Capabilities are public, monetization format is not
    - Could improve retention and blended margin if paid separately
    - Need separate revenue line item or attach-rate disclosure
  - - Solution engineering / onboarding
    - Deployment help, tuning, and workload optimization
    - Project or services fee
    - Support intensity is clear from case studies but pricing is not
    - Lowest-quality revenue if non-recurring, useful only as land-and-expand
    - Need services share of revenue and gross margin
  notes: Uses only public product evidence; realized revenue mix, discounts, and attach rates remain undisclosed.
