  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited FY2025/FY2026 revenue, ARR, recurring-vs-services mix, and any backlog or remaining performance obligations.
    whyItMatters: Public third-party revenue bands are too wide to support valuation or debt-service underwriting, and they do not distinguish recurring from project revenue.
    diligencePath: Request the last two audited financial statements plus a monthly revenue bridge broken out by on-demand, reserved capacity, bare metal, and managed inference.
    relatedQuestionRefs:
    - QI010
    - QI011
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: debt-terms
    missingEvidence: Debt lender list, tenor, coupon, amortization profile, collateral package, covenant thresholds, and any warehouse-to-term-out plan for the announced borrowing.
    whyItMatters: Debt mix is the biggest new variable in Neysa’s capital structure, yet no public source discloses whether the borrowing is conservative capacity finance or aggressive spot-market leverage.
    diligencePath: Request the signed term sheet or board-approved financing memo covering size, pricing, collateral, maturity schedule, and committed-revenue tests.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-burn
    missingEvidence: Gross margin by product line, contribution margin by deployment type, monthly burn, and current cash or undrawn liquidity.
    whyItMatters: Without margin and burn data, the chapter cannot quantify runway or test whether the planned debt can be serviced through steady-state cash generation.
    diligencePath: Request monthly management accounts with COGS detail for compute, power, networking, support, depreciation, and debt service, plus current cash and forecast burn.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: utilization
    missingEvidence: Average GPU utilization, reserved-vs-on-demand mix, occupancy by SKU generation, and customer churn or renewal data.
    whyItMatters: Utilization is the fulcrum between attractive unit economics and stranded capex for a neo-cloud business carrying fast-depreciating hardware.
    diligencePath: Request cohort-level GPU occupancy data by SKU and customer type, plus realized blended price per GPU-hour and renewal rates for committed clusters.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-backlog
    missingEvidence: Top-customer concentration, committed contract durations, backlog, and any hyperscaler/lab anchor agreements supporting the 20,000-GPU buildout.
    whyItMatters: The announced debt is easier to underwrite if backed by long-duration contracts; without concentration and backlog disclosure, financing resilience is unknowable.
    diligencePath: Request the top-10 customer list with contract values, duration, renewal options, backlog, and any board-approved capacity reservations.
    relatedQuestionRefs:
    - QI023
    - QI024
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
