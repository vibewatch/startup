- id: unit-economics-and-service-delivery
  title: Unit economics proxies and service-delivery cost logic
  body: |-
    Neysa does not publish gross margin, contribution margin, customer acquisition cost, or payback. The best public read therefore comes from customer proofs and the cost architecture implied by the hardware offer. Three customer cases — TIFIN, Innoviti, and ITQ — all frame Neysa’s value in the same language: lower spend than hyperscalers or general-purpose clouds, better latency, and stronger control for regulated or high-volume workloads. The savings claims range from 40% to 65%, while operating metrics include 99.95% uptime, sub-2-second P99 latency, 2,500 tokens per second, sub-30-second processing loops, and rapid production deployment. Those are not audited financial metrics, but they do suggest Neysa is winning workloads where dedicated or reserved infrastructure can amortize fixed costs better than token-priced API usage.

    The caveat is that this model only works if occupancy stays high. Neysa’s price list exposes the cost base indirectly: H100 and H200 clusters, NVMe-heavy nodes, high-bandwidth interconnects, and support-intensive managed environments. CoreWeave’s S-1 provides a useful public comp for the economic logic. It shows that even a scaled neo-cloud can lose money while growing if utilization, concentration, or financing assumptions disappoint, and it explicitly states that real-world AI infrastructure often delivers only 35% to 45% of peak theoretical output because of system inefficiencies. For Neysa, the implication is straightforward: reserved clusters, private deployments, and long-lived regulated workloads are not optional upsells; they are the economic mechanism that turns fast-depreciating hardware into a plausible margin path.
