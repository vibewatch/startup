  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue
    missingEvidence: No audited revenue, ARR, gross margin, or customer-spend disclosure was verified from public sources.
    whyItMatters: Company overview needs a dependable scale baseline, and valuation context is weaker without revenue visibility.
    diligencePath: Request FY2025-FY2026 management accounts, audited financial statements, and cohort-level revenue concentration by customer segment.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: gpu-scale
    missingEvidence: Public sources conflict on currently live GPU count, with TechCrunch citing ~1,200 and SiliconANGLE citing ~2,000.
    whyItMatters: Live capacity is a core scale metric and affects utilization assumptions against the 20,000+ GPU expansion story.
    diligencePath: Request infrastructure inventory by site, installed versus billable GPUs, and monthly utilization reports as of June 2026.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Public headcount points differ between 110 employees in February 2026 reporting and 122 employees in Tracxn as of May 2026.
    whyItMatters: Hiring pace and operating leverage matter for a capital-intensive infrastructure company scaling product, sales, and operations simultaneously.
    diligencePath: Request current HR roster, city-wise headcount, and hiring plan tied to the Blackstone financing plan.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public sources identify founders, chairman, and a strategic advisor, but not a full board roster, committee structure, or control rights package.
    whyItMatters: A majority-stake transaction can materially change governance, veto rights, and key-person dependence.
    diligencePath: Request post-transaction board composition, shareholder agreement summary, reserved matters, and governance committee charters.
    relatedQuestionRefs:
    - QO008
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: chennai-footprint
    missingEvidence: This chapter verified a Chennai office but did not find a source confirming Chennai as a Neysa-operated data-center location.
    whyItMatters: Later infrastructure and capacity chapters should not overstate physical footprint by conflating sales or engineering offices with compute sites.
    diligencePath: Request site list separating offices, third-party colocation, current GPU clusters, and announced future data-center projects by city.
