callouts:
- calloutType: strength
  title: Founder-market fit is unusually strong for India AI infrastructure
  body: Neysa is not trying to invent demand for compute from scratch; it is being built by operators whose prior careers ran through Netmagic and NTT, which is why investors keep citing founder credibility as a reason to back a capital-intensive model. That matters in a business where supply chains, data-center operations, enterprise trust, and speed of deployment matter as much as software polish.
  claimRefs:
  - CO010
  - CO011
  - CO013
  - CO023
- calloutType: risk
  title: The key risk is economic execution, not public controversy
  body: No major public legal or governance scandal surfaced in this chapter. The real adverse story is that Neysa is now carrying a sovereign-compute buildout thesis that depends on debt, utilization, and differentiated service surviving hyperscaler competition. That raises the bar for site-level GPU utilization, pricing discipline, and capital efficiency over the next 12-24 months.
  claimRefs:
  - CO020
  - CO049
  - CO050
- calloutType: insight
  title: Customer proof already spans regulated, research, and AI-native buyers
  body: 'The public evidence is strongest where Neysa solves hard constraints: regulated financial workloads, cost-sensitive AI-native startups, research labs that need dedicated GPU access, and inference-heavy production systems that want India-resident deployment. That breadth makes the company more than a single-vertical bet, even though revenue depth within each cohort remains undisclosed.'
