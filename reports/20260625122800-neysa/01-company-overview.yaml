- id: funding-valuation-and-scale
  title: Funding history, valuation, and scale signals
  body: 'Neysa’s capital story moved unusually fast. The company raised a $20 million seed round in early 2024, then a $30 million Series A in October 2024, before announcing a February 2026 Blackstone-led transaction that combined up to $600 million of equity with a stated plan to secure another $600 million of debt. Public databases and press sources broadly converge around a roughly $1.4 billion valuation for the February 2026 round, though exact post-money versus enterprise-value framing is not always consistent across sources.


    The investor roster matters because it mixes traditional venture, strategic infrastructure credibility, and later-stage capital. Seed and Series A backers included Z47, Nexus Venture Partners, and NTTVC, with Tracxn also naming backers such as Blume Ventures and Anchorage. The February 2026 financing added Blackstone plus Teachers’ Venture Growth, TVS Capital, and 360 ONE, and public reporting says Blackstone emerged with majority ownership. That cap-table evolution suggests Neysa progressed from venture-backed product formation into infrastructure-scale financing in under three years.


    Scale metrics are directionally strong but not fully reconciled. Official and independent coverage align on a 20,000+ GPU expansion plan, but current live-GPU counts differ: TechCrunch reported about 1,200 GPUs while SiliconANGLE reported about 2,000. Headcount shows a similar pattern, with TechCrunch citing 110 employees in February 2026 and Tracxn listing 122 by May 2026. Those differences are not fatal, but they are significant enough that later chapters should not propagate a single precise scale number without management confirmation.'
