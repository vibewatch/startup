- id: founders-leadership-and-governance
  title: Founders, leadership, and governance coverage
  body: 'The public founding team is straightforward: Sharad Sanghi is co-founder and CEO, and Anindya Das is co-founder and CTO. Their founder-market fit is unusually strong for an infrastructure startup in India because both executives come out of the Netmagic and NTT ecosystem that helped define Indian data-center and managed-cloud capacity. Company, investor, and media materials all lean heavily on that prior operating history when justifying why Neysa should be trusted with a capital-intensive sovereign-compute buildout.


    Governance disclosure is thinner than founder disclosure. Home-page and VCCircle materials identify Silicon Valley veteran BV Jagadeesh as chairman, and Neysa announced former Wipro and YES Bank CIO Anup Purohit as a strategic advisor in June 2026. That gives public evidence of external guidance, but not a full board map or post-Blackstone control framework. Tracxn’s public board snippet is too incomplete to rely on as a governance record, and this chapter did not verify committee composition, reserved matters, or minority-protection terms after Blackstone took majority control.


    The diligence implication is that Neysa looks founder-led with credible external validation, but still exhibits material key-person dependence. Sanghi is central to capital formation, infrastructure relationships, and external storytelling; Das anchors the technical credibility. That can be a strength at this stage, yet it also means later-stage investors should press for explicit governance documentation before assuming the post-transaction control environment is fully institutionalized.'
