  topStrengths:
    - 创始人与市场匹配度在印度 AI 基础设施里格外强，把 Netmagic 时期的数据中心执行经验与当下主权云需求接了起来。
    - 公开客户案例在成本、在线率和延迟上给出了具体价值，尤其适合受监管、运营强度高的工作负载。
    - 印度推动主权算力之际，Blackstone 背书融资明显增强了 Neysa 锁定 GPU 供给、建设本地 AI 产能的能力。
  topRisks:
    - 公开披露没有 ARR、毛利率、利用率、债务定价或优先权结构条款，$1.4B 估值很难承销。
    - Neysa 的经济性取决于能否从约 1,200 张在线 GPU 扩到 20,000 张以上，同时不被供给、电力或上架率短板卡住。
    - 超大规模云厂商和印度本土强对手会挤压价格；企业和政府采购周期又长且集中。
  unresolvedGaps:
    - 经审计收入、积压订单、毛利率、烧钱速度或现金 runway 数字均未公开。
    - 债务分层条款、抵押包、契约和再融资假设仍未披露。
    - 关于客户集中度、留存、合同期限和续约率的公开证据很浅。
    - 员工数、在线 GPU 库存和设施精确落地时间的公开数据相互冲突，需要管理层对齐解释。
