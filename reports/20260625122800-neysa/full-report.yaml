      - number: '1.4'
        title: Milestones, customer proof, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Neysa has enough public milestone density to look like an operating platform, not just a financing story.
              The company moved from seed financing in 2024 to a July 2024 Velocis launch, claimed paying customers by
              October 2024, announced an insurance-cloud partnership with Data Science Wizards in December 2024,
              surfaced an NTT Data-Telangana Hyderabad compute-cluster plan in April 2025, launched India-resident
              inference with Pipeshift in May 2026, and added Anup Purohit as strategic advisor in June 2026. That
              cadence supports the idea that the company is trying to build both infrastructure and go-to-market
              simultaneously.


              Customer proof is stronger than a typical early infrastructure company’s public footprint. Company case
              studies show deployments at Indian Institute of Science, Innoviti, TIFIN, and ITQ, while broader site
              materials reference HDFC Bank, PhonePe, Juspay, Fractal, Navana.ai, Smallest.ai, Graylabs.ai, and
              Arrowhead AI. Across those examples, Neysa’s strongest repeatable angle is not generic cloud hosting; it
              is sovereign and performance-sensitive AI workloads where data residency, latency, or cost transparency
              make hyperscalers look less attractive.


              The main adverse signals are economic rather than legal. Sacra explicitly flags hyperscaler price
              competition, regulatory shifts, and the leverage introduced by planned debt financing as material risks.
              Fortune India adds another useful caution: before the Blackstone deal, Neysa had already deployed about
              $44 million of its first $50 million into GPU infrastructure, which implies a business model that can
              absorb capital quickly and therefore depends heavily on utilization discipline. In short, the company has
              meaningful momentum, but the business now has to prove that capital intensity, local-demand growth, and
              sovereign-compute differentiation can translate into durable economics.
