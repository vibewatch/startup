  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Capital intensity outruns utilization
        - Live GPU deployment, reserved-usage uptake, or paying-customer growth trails infrastructure commitments
        - Any multi-quarter gap between fleet growth and signed/reserved consumption
        - >-
          Cut valuation expectations, re-underwrite cash runway, and require updated debt and occupancy data before
          adding exposure
      - - GPU supply concentration
        - Management discloses delivery slippage or extends timelines while keeping capex commitments intact
        - Meaningful delay in Nvidia-heavy procurement without offsetting silicon diversification
        - Assume slower revenue ramp and higher customer-acquisition friction
      - - Power and site-readiness strain
        - MW expansion, cooling, or RTC-power arrangements lag AI-rack density requirements
        - Delayed site activation or evidence of localized grid/cooling constraints
        - Reduce confidence in uptime claims and add power-procurement diligence
      - - Security / compliance failure
        - Critical CERT-In-type issue, major customer incident, or public breach/compliance dispute
        - Any serious incident without fast customer communication and documented remediation
        - Treat as thesis-break for regulated-workload adoption until control evidence improves
      - - Customer concentration / proof gap
        - Public proof remains limited to a few lighthouse logos while revenue scales faster than disclosures
        - No broadening of named production deployments or reference quality over the next refresh cycle
        - Apply a concentration haircut to utilization and retention assumptions
      - - Policy or IndiaAI dependency
        - Policy-backed demand softens or competitors capture the visible subsidized workloads
        - Material reduction in IndiaAI-linked onboarding or loss of strategic empanelment relevance
        - Reframe the thesis around purely commercial demand and lower terminal multiple assumptions
    notes: >-
      These kill criteria translate the public evidence into observable thresholds; they are not forecasts, but they
      define when capital, utilization, or control assumptions should be treated as broken.
