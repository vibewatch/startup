  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and monetization layers
        blocks:
          - type: paragraph
            body: >-
              Neysa’s public surfaces point to a revenue model that is broader than simple spot GPU rental but still
              fundamentally anchored in selling compute capacity. The company openly lists three core product forms —
              managed VM instances, bare-metal GPU servers, and managed Kubernetes clusters — and then overlays those
              with public, private, and hybrid deployment options. That matters financially because the price
              discrimination logic is visible: on-demand workloads monetize experimentation and burst demand, while
              reserved or committed capacity is designed to trade discounting for better forward visibility. The same
              pricing page also removes several common cloud surcharges, including ingress, egress, and inference
              transaction fees, which supports the narrative that Neysa is competing on bill predictability as much as
              on raw peak performance.


              The more interesting question is whether Neysa can attach higher-quality revenue on top of commodity
              compute. The answer is “probably yes, but still not in a way investors can quantify publicly.” Velocis
              bundles orchestration, AI Studio, observability, inference endpoints, and security features such as Aegis,
              while the Pipeshift partnership expands into dedicated managed inference environments. Those features
              likely increase switching costs and open room for platform or services monetization. Still, Neysa does not
              disclose how much revenue comes from recurring reserved capacity, how much from professional services, or
              whether managed inference is billed as a premium software layer versus a pass-through compute wrapper.
              Publicly, the company looks like a B2B GPU cloud and sovereign AI platform with multiple monetization
              levers; privately, the missing mix data is the first major underwriting blocker.
