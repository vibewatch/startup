      - number: '3.4'
        title: Switching costs, defensibility, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Neysa’s defensibility is more likely to come from workflow integration than from GPU access alone. The
              domestic market is increasingly well supplied through IndiaAI empanelment, Yotta’s scale build-out, E2E’s
              transparent self-service catalog, and Tata’s sovereign enterprise platform. If GPU supply broadens and
              subsidies lower switching barriers, simple “India-hosted compute” becomes easier to match. Neysa’s
              stronger story is that buyers can procure compute, MLOps, and AI security together in one contract. That
              matters most for regulated enterprise buyers who want fewer vendors and clearer cost control.


              Even so, switching costs cut both ways. Hyperscaler customers already committed to Azure ML or broader AWS
              and Google estates may prefer to keep model development inside existing contracts, identity systems, and
              platform tooling. Domestic clouds are somewhat easier to multi-home across because several market
              themselves around Kubernetes, cluster-based GPU access, or standard storage interfaces. But reserved
              capacity, support processes, experiment-tracking habits, security controls, and procurement approvals
              still create real stickiness after a team starts training or serving models in production. The main
              competitive risk to Neysa is therefore not only a single rival; it is a crowded field where each
              alternative owns a different part of the buyer decision stack—scale, price transparency, sovereign trust,
              enterprise distribution, or ecosystem breadth.
