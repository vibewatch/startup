      Neysa’s buildout concentrates risk in hardware capex, non-GPU infrastructure, and the future debt service that
      sits on top of both.
    data:
      columns:
        - Cash intensity
        - Visibility
        - Main risk signal
        - Immediate diligence priority
      rows:
        - label: GPU acquisition
          values:
            - High upfront
            - Publicly implied, not budgeted
            - Hardware depreciation / obsolescence
            - Need SKU-level rollout and depreciation policy
        - label: Data-center power + networking
          values:
            - High upfront
            - Only indirectly visible through product specs
            - Fit-out and insurance concentration
            - Need site-level power, cooling, and insurance cost
        - label: Platform R&D
          values:
            - Medium ongoing
            - Mentioned in press but not quantified
            - Software spend may dilute hardware payback
            - Need R&D budget and hiring plan
        - label: Customer onboarding + support
          values:
            - Medium ongoing
            - Visible in case studies, not in financials
            - Services-heavy delivery can cap margin
            - Need support headcount and services gross margin
        - label: Debt service + refinancing
          values:
            - Potentially high fixed outflow
            - No public term sheet
            - Coupon, covenants, and maturity wall unknown
            - Need signed debt terms and contracted revenue support
    approximationNotes: >-
      Matrix translates disclosed strategic actions into cash-flow buckets; only the debt and GPU expansion headline is
      directly public.
    claimRefs:
      - CI002
      - CI004
      - CI030
      - CI032
      - CI037
      - CI038
      - CI039
      - CI047
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Velocis layers sovereign infrastructure, flexible compute delivery, orchestration, developer tooling, inference
      services, and governance into one operating stack.
    approximationNotes: >-
      The stack uses Neysa's named product components and public integration lists; it is still an analyst
      reconstruction because Neysa has not published a deeply technical reference architecture.
    data:
      layers:
        - label: Sovereign facilities and connectivity
          detail: Indian data-center footprint and hybrid or private deployment posture
          tone: positive
          modules:
            - Indian data centers
            - Public/private/hybrid
            - VPC support
          outputs:
            - Locality and residency
        - label: Compute pool
          detail: GPUaaS delivered as bare metal, VMs, or containers
          tone: positive
          modules:
            - H100 fractional
            - H100 SXM
            - H200 references
          outputs:
            - Training and inference capacity
        - label: Control plane
          detail: AI cluster management, scheduler, and resource manager
          tone: positive
          modules:
            - Cluster management
            - AI scheduler
            - Resource manager
          outputs:
            - Provisioning and orchestration
        - label: Developer and MLOps layer
          detail: Pre-integrated tools for building, tracking, and shipping models
          tone: positive
          modules:
            - Jupyter
            - PyTorch
            - MLflow
            - Kubeflow
          outputs:
            - Build and experiment workflow
        - label: Inference and solution layer
          detail: Managed endpoints, open-source model deployment, and partner inference extensions
          tone: positive
          modules:
            - Inference endpoints
            - OpenAI-compatible APIs
            - Pipeshift integration
          outputs:
            - Production AI services
        - label: Governance and observability
          detail: Security, telemetry, and cost controls applied across the stack
          tone: warning
          modules:
            - RBAC
            - Audit logs
            - Encryption
            - Dashboards
          outputs:
            - Trust and operations signal
