      - number: '8.2'
        title: Comparable Benchmarks and Scenario Ranges
        blocks:
          - type: paragraph
            body: >-
              The comp set says more about what Neysa must still prove than about what price is already justified.
              CoreWeave, the closest public neo-cloud reference with disclosed scale, traded around 6.6x annualized Q1
              revenue in June 2026, but only after building nearly $100 billion of backlog and more than 1 GW of active
              power. DigitalOcean, a more inference-heavy and managed-cloud business, traded closer to 14x guided 2026
              revenue or 16x ARR while posting positive margins and disclosing that over 70% of its AI ARR comes from
              inference services and core cloud rather than bare metal. Together AI's private benchmark, at roughly 7.5x
              annualized revenue, sits nearer CoreWeave than the exuberant public outlier Nebius, whose June 2026 market
              cap implied more than 40x annualized Q1 revenue. Nebius can sustain that premium because it disclosed
              hypergrowth, public-market liquidity, and 1.2 GW of new factory capacity. Neysa has disclosed none of
              those economics. At the current $1.4 billion mark, Neysa would need roughly $93 million of revenue at a
              15x multiple, $140 million at 10x, or $212 million at a CoreWeave-like 6.6x. Without disclosed revenue,
              the valuation cannot be called cheap on public evidence. The bull, base, and bear cases therefore need to
              be framed around explicit threshold economics rather than around narrative alone.
