        title: Customer Segments and Buying Motions
        blocks:
          - type: paragraph
            body: >-
              Neysa's public positioning is broad but not random. Its own industry pages explicitly segment demand into
              regulated financial institutions, insurers, digital commerce teams, manufacturers, research institutions,
              and AI-native startups, all tied together by a common buying thesis: customers want GPU-heavy AI workloads
              without stitching together multiple hyperscaler services or taking data outside India. The regulated
              segments are the clearest. BFSI and insurance pages emphasize RBI, IRDAI, privacy, auditability, and
              model-governance requirements, while the sovereign-AI blog frames local jurisdiction and locally sourced
              infrastructure as a procurement requirement rather than a branding choice. Retail and manufacturing buyers
              are framed less around regulation and more around operational bottlenecks such as high inference cost,
              integration complexity, pilot-to-production delays, and edge or plant-floor deployment needs. Startups sit
              at the other end of the spectrum: the pitch is instant GPU access, usage-based pricing, no waitlists, and
              low-friction experimentation. This mix suggests Neysa is trying to serve both high-value regulated
              enterprises and faster-moving AI-native builders, but the public evidence shows the strongest
              referenceability in India-first sectors where sovereignty, latency, and support matter more than global
              breadth. Pricing and partner-program language also show that Neysa expects adoption to start with
              experimentation or targeted workloads before broad enterprise standardization.
