      - number: '3.3'
        title: Hyperscalers and global neo-cloud analogs
        blocks:
          - type: paragraph
            body: >-
              AWS, Azure, and Google Cloud remain strategically relevant in India even when they are not the cleanest
              sovereign-cloud answer. AWS has India regions and local zones plus H100/H200-backed P5 families. Azure has
              ND-series GPU infrastructure and broad enterprise entrenchment, but its own data-residency documentation
              makes clear that some AI and management metadata can leave the selected geo depending on service choice.
              Google Cloud emphasizes global regions, price-performance tooling, and data-residency capable regions, but
              the pages reviewed still present AI infrastructure as part of a global cloud catalog rather than a
              purpose-built Indian sovereign AI bundle. In other words, hyperscalers compete through ecosystem gravity,
              not India-first packaging.


              CoreWeave matters because it is the global benchmark for AI-native cloud specialization. Its official site
              and S-1 describe a purpose-built AI cloud centered on bare metal, orchestration, observability, and
              storage/networking optimized for model training and inference. That is closer to the operating model
              Indian sovereign AI clouds aspire to than the generalized-cloud model of AWS, Azure, or GCP. But CoreWeave
              is an analog rather than a direct Indian sovereign rival: the retained sources do not show IndiaAI
              participation, India-specific data residency claims, or local public-sector positioning. For Neysa, that
              makes CoreWeave more relevant as a benchmark on product architecture and economics than as a near-term
              go-to-market blocker inside India.
