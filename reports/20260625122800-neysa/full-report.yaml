      - number: '7.3'
        title: Policy, security, and sovereignty are part of the moat, but they also create a heavier compliance burden
        blocks:
          - type: paragraph
            body: >-
              Neysa’s strongest differentiation claim is that Indian enterprises can keep sensitive AI workloads,
              prompts, and inference traffic inside India with tighter operational control than on foreign-hosted
              stacks. That positioning is commercially useful, but it means the company is volunteering for a denser
              compliance surface. The privacy policy sets out a shared-responsibility model in which Neysa owns
              infrastructure security while customer tenants remain responsible for their own data privacy and access
              controls. Product pages claim RBAC, encryption, BYOK, audit logs, ISO/IEC 27001:2022 certification, and
              SOC2 compliance, while the monitoring job posting shows incident management, patching, root-cause
              analysis, and SLA escalation are active operating functions rather than future aspirations. External
              obligations are also rising. CERT-In’s June 2026 guidance explicitly covers cloud service providers and
              pushes immediate disclosure and accelerated remediation timelines for serious vulnerabilities. The DPDP
              Act and IndiaAI Mission create additional expectations around data handling, local deployment, and
              public-sector readiness. These are valuable demand tailwinds, but they raise the cost of failure because a
              security lapse or compliance miss would hit regulated customers first.
