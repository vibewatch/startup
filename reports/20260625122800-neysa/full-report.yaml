        title: Exhibits
        blocks:
          - type: callout
            title: Founder-market fit is unusually strong for India AI infrastructure
            body: >-
              Neysa is not trying to invent demand for compute from scratch; it is being built by operators whose prior
              careers ran through Netmagic and NTT, which is why investors keep citing founder credibility as a reason
              to back a capital-intensive model. That matters in a business where supply chains, data-center operations,
              enterprise trust, and speed of deployment matter as much as software polish.
