      - number: '2.2'
        title: Sizing lenses and Neysa addressable market
        blocks:
          - type: paragraph
            body: >-
              Public sources do not provide a clean, directly measured India AI-cloud or GPU-infrastructure TAM, so the
              chapter uses multiple lenses. The broadest adjacency is IDC's India public-cloud projection of $30.4B by
              2029, but that includes many workloads Neysa will never touch. A tighter infrastructure lens comes from
              Arizton's India data-center market estimate of $9.79B in 2025 growing to $21.03B by 2031, reinforced by
              Cushman and JLL's evidence of a multi-gigawatt build pipeline, but those figures still include generic
              capacity. The most decision-useful floor is sovereign/public compute: S&P says 34,371 GPUs had been
              awarded in IndiaAI tenders by mid-2025 at subsidized rates as low as $1.36 per GPU hour, the official
              governance guidelines say 38,000+ GPUs were onboarded by February 2026, and ETGovernment says an
              additional 20,000 GPUs were being added to reach roughly 58,000. Annualizing those disclosed
              public-compute footprints yields an evidence-backed floor of roughly $0.41B-$0.69B before private
              enterprise demand. Neysa's SAM therefore sits between that public floor and the much broader
              cloud/data-center adjacencies, concentrated in regulated enterprises, government programs, GCCs, startups,
              and AI labs that need in-country GPU clusters rather than generic cloud bundles.
