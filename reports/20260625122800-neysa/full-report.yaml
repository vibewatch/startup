companyProfile:
  summary: >-
    Neysa is a Mumbai-headquartered AI acceleration cloud company founded in 2023 by Sharad Sanghi and Anindya Das. The
    company positions Velocis as a sovereign Indian AI cloud stack that combines GPU infrastructure, orchestration,
    observability, inference, and AI security for regulated enterprises, startups, research users, and public-sector
    workloads. Public evidence shows real customer proof and a major February 2026 Blackstone-led financing, but the
    operating record behind the valuation remains opaque because revenue, margins, utilization, and debt terms are not
    publicly disclosed.
