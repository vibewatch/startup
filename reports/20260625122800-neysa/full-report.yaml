      - number: '8.3'
        title: Investment Thesis vs. Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Neysa is conceptually coherent. India's compute deficit is large, policy is
              directionally supportive, and enterprise buyers in regulated sectors do appear to value onshore
              infrastructure, lower latency, and better support than they can get from generic cloud menus. The company
              also seems to understand that raw GPU rental is not enough: its public positioning consistently bundles
              GPU infrastructure with orchestration, observability, and AI security. That combination, if it truly lands
              in production, could justify a better multiple than pure capacity brokerage. The anti-thesis is stronger
              than management rhetoric admits. Hyperscalers remain the real competitive benchmark because they can
              cross-subsidize GPU pricing inside wider enterprise contracts. The public record also shows that AI-cloud
              expansion is increasingly a credit and utilization game, not just a demand story. Data Center Knowledge
              reports that capacity providers now care most about credit quality, end-customer visibility, and long-term
              utilization certainty. Neysa is still early on those proof points. Its own materials admit Blackwell is
              not deployed yet and thousand-GPU single-training runs are still a build-out goal. In short: the thesis
              can work, but only if utilization, software attach, and customer stickiness appear faster than debt and
              competition compress the economics.
