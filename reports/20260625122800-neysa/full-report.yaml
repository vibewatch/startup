chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product model
        blocks:
          - type: paragraph
            body: >-
              Neysa positions itself as an AI Acceleration Cloud provider rather than an application-layer AI startup.
              Public company materials describe the business as a purpose-built infrastructure layer for enterprises,
              startups, research institutions, and public-sector organizations that want local GPU capacity,
              orchestration, and security without stitching together multiple vendors. The legal-entity record suggests
              a December 2022 incorporation, but the company and most media consistently treat 2023 as the operating
              founding date, which is the most defensible public shorthand for this report.


              The company is headquartered in Mumbai and publicly lists offices in Mumbai, Bengaluru, and Chennai.
              Current compute-site evidence is narrower than office evidence: Sacra specifically references pre-wired
              capacity in Mumbai and Bangalore data centers, while public reporting supports a planned Hyderabad cluster
              with NTT Data and the Telangana government. This chapter therefore treats Mumbai as confirmed
              headquarters, Bengaluru and Chennai as confirmed offices, and Hyderabad as an announced scale project
              rather than already-operational capacity.


              On product, Velocis is the core operating system for Neysa’s business model. Official materials present it
              as a full-stack environment spanning GPU-as-a-Service, AI Platform-as-a-Service, inference endpoints,
              orchestration, observability, and AI/ML security. Pricing and product pages show that the company is
              already merchandising multiple GPU families and deployment models, which matters because Neysa is selling
              control, local residency, and predictable economics as much as raw chips. Moneycontrol’s framing of Neysa
              as a domestic AWS/Azure-style alternative is directionally consistent with this positioning, though
              Neysa’s actual differentiation is narrower and more infrastructure-specific than a hyperscaler equivalent.
