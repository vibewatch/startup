      - number: '2.3'
        title: Buyers, sovereignty dynamics, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Budget ownership in this market is fragmented. Government demand comes from IndiaAI itself, sector
              ministries, public institutions, and state-level programs that need subsidized compute, model development,
              and public-interest AI applications. Regulated enterprises in banking, healthcare, and public services
              increasingly care about local data hosting, auditability, and the ability to keep sensitive model-training
              workflows within India. GCCs and AI-native startups form a third buyer cluster: they may not own
              hyperscale budgets, but they are often the fastest adopters of dedicated GPU capacity, inference
              endpoints, and deployment support. Hyperscalers and global AI labs can also become customers or channel
              partners when they need in-country inference capacity, overflow clusters, or sovereign-ready footprints.
              The adoption path is therefore not simply buyer to cloud region; it often runs from policy or compliance
              trigger, to local hosting requirement, to either public sovereign compute or a neo-cloud operator that can
              provide dedicated GPUs plus hands-on integration. Microsoft explicitly markets sovereign public and
              sovereign private cloud offerings for Indian organizations, while Neysa and Yotta pitch India-first
              performance, compliance, and lower-friction deployment. That dynamic helps explain why the market can
              support both hyperscalers and local specialists rather than one winner-take-all model.
