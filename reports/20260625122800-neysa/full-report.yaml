  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Debt economics disappoint
        - Debt pricing, covenants, or amortization consume too much cash flow
        - Turns scale-up from strategic asset into equity overhang
        - Move from research-more toward avoid unless price resets
      - - Utilization fails to ramp
        - No proof of contracted demand or healthy utilization against the 20,000-GPU plan
        - Capex stops looking like moat-building and starts looking like idle inventory
        - Require contracted utilization or do not proceed
      - - Hyperscaler TCO closes the gap
        - AWS/Azure/GCP pricing or bundling removes Neysa's cost/compliance edge
        - Compresses margins and weakens the sovereign niche
        - Re-underwrite as lower-multiple infrastructure, not software-attached cloud
      - - Concentration is too high
        - One or two customers or sectors dominate demand
        - Makes valuation vulnerable to churn, insourcing, or policy change
        - Demand concentration discount and tighter exposure limits
      - - Procurement or power slips
        - GPU allocation, data-center capacity, or support infrastructure arrives late
        - Delays revenue realization while debt or sponsor return clocks keep running
        - Push expected value toward the bear case until execution catches up
    notes: Kill triggers focus on variables that can simultaneously damage both revenue realization and multiple selection.
    claimRefs:
      - CV020
      - CV021
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
      - CV050
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and margin
        - Current ARR/run-rate, gross margin, inference vs bare-metal mix
        - Without this, the comp band cannot be applied credibly
        - Request monthly cohort revenue, gross profit, and utilization bridge
      - - Customer concentration
        - Top-10 customers, reserved-capacity commitments, renewal terms
        - Determines whether revenue is durable or fragile
        - Review customer cohort data and contract summaries
      - - Debt package
        - Pricing, security, amortization, covenants, and cross-default terms on the planned $600M debt
        - Debt can change the economic value of the same headline valuation
        - Obtain lender term sheet and downside case model
      - - Preference stack
        - Liquidation preferences, ratchets, anti-dilution, board rights, and consent rights
        - Needed to translate enterprise value into equity value
        - Review definitive equity documents and cap-table waterfall
      - - Procurement and power
        - GPU allocation letters, delivery schedule, colocation / power commitments
        - Tests whether the 20,000-GPU ambition is executable on time
        - Inspect OEM, colocation, and power agreements
      - - Go-forward exit evidence
        - Evidence for sponsor recap, strategic takeout, or public-market path
        - Exit route affects acceptable entry price and holding period
        - Build exit map only after revenue and structure are validated
    notes: >-
      These asks are prioritized by how directly they could move the valuation call rather than by general operational
      curiosity.
    claimRefs:
      - CV015
      - CV016
      - CV039
      - CV049
      - CV051
