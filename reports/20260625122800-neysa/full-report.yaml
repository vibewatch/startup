  - id: TP002
    title: Pricing and procurement comparison
    columns:
      - Provider
      - Published price / pricing mode
      - Commercial shape
      - Transparency / extra-charge signal
      - Implication for Neysa
    rows:
      - - Neysa
        - Reserved all-inclusive rate; public page shows SKU inventories but not a simple one-line rate card
        - Sales-led reserved access across bare metal, VMs, and managed Kubernetes
        - Company says one rate covers compute, storage, egress, K8s, Jupyter, MLflow, W&B, and inference endpoints
        - >-
          Supports budget predictability for enterprise buyers, but lower public price transparency than E2E or Yotta
          list pages
      - - Yotta
        - H100 AI Lab workstations listed from ₹27,000/month to ₹1,504,000/month; ₹70,000/month platform access
        - Monthly workstation, VM, bare metal, cluster, and support catalog
        - More transparent than quote-only enterprise clouds, but platform access is an extra line item
        - Good fit for committed sovereign-AI programs; Neysa counters with integrated platform economics
      - - E2E Networks
        - B200 ₹624/hr; H200 ₹300/hr; H100 ₹249/hr; L4 ₹49/hr
        - Hourly, monthly, or annual plans with self-service procurement
        - Most explicit public rate card among reviewed India-focused competitors; taxes and storage/services separate
        - >-
          Strong benchmark against Neysa for startup and developer acquisition, especially when teams prefer
          pay-as-you-go
      - - Tata Communications Vayu
        - Pay-as-you-go and committed-use posture; H100/H200/L40S offered but public rate card not shown
        - Enterprise-led procurement with sovereign-cloud and network integration
        - >-
          Official pages emphasize predictable costs and no surprise egress fees, but exact GPU list prices stay behind
          sales
        - Helps Tata sell into large accounts, but makes public side-by-side benchmarking harder than with E2E or Yotta
      - - AWS
        - Region, instance, and commitment pricing via docs and calculators
        - Pay-as-you-go, reserved, and enterprise contracting
        - Reviewed pages describe instance families and regions, not a simple India AI bundle rate card
        - >-
          Hyperscaler breadth is strong, but procurement is comparatively complex for teams that only want India-hosted
          GPU stacks
      - - Azure
        - Service- and agreement-driven pricing across regional and global options
        - Enterprise agreement and pay-as-you-go patterns
        - Reviewed residency and GPU pages prioritize governance and capability over simple public GPU rate tables
        - Works best for existing Microsoft estates rather than buyers seeking a simple sovereign AI package
      - - Google Cloud
        - SKU and regional pricing tables plus picker tools
        - Global pricing model tied to workload, region, and discounts
        - Transparent in tooling terms, but not framed as an India-sovereign AI commercial bundle
        - Strong for globally optimized buyers; less tailored to India-specific procurement narratives
      - - CoreWeave
        - Contract-style enterprise pricing; no public simple list rate on reviewed pages
        - AI-native platform sold around performance and operating efficiency
        - Operational transparency is emphasized more than static list pricing
        - Important benchmark on AI-native economics, but not the most direct procurement substitute inside India today
    notes: >-
      Only Yotta and E2E provide easily reusable public list prices in the retained sources. Neysa, Tata, and the
      hyperscalers either describe pricing philosophy, capacity, or tooling without offering a clean India-specific
      side-by-side GPU rate table on the reviewed pages.
