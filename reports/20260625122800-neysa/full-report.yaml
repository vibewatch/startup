      - number: '4.3'
        title: Capital structure, capex intensity, and debt implications
        blocks:
          - type: paragraph
            body: >-
              Neysa’s 2026 financing package is the clearest public signal that this is an infrastructure company first
              and a software company second. The announced structure — up to $600 million of equity plus an intended
              $600 million of debt — is large relative to the company’s age and prior funding base, and it is explicitly
              tied to scaling beyond 20,000 GPUs. Even without management guidance on exact capex, a simple heuristic
              shows how capital hungry the next phase is. If only the planned debt ultimately funds the hardware build,
              the capital pool already implies about $30,000 per target GPU; if the full package is applied to the
              buildout, the gross pool rises to about $60,000 per target GPU before accounting for data-center fit-out,
              networking, software, or working capital. That is why debt structure matters as much as the headline
              valuation.


              Publicly, the debt is the least transparent part of the story. NewsBytes says Indian GPU-backed loans can
              finance 40% to 70% of GPU value at rates up to 14%, which is workable only when lenders believe
              utilization and contract duration will stay high. External adverse research sharpens the risk. Compute
              Forecast argues that shortage-era GPU debt was often underwritten against rental assumptions that have
              already compressed, while CNBC highlights the “GPU debt treadmill” created when lenders finance long-lived
              facilities around shorter-lived compute assets. CoreWeave’s filing shows how large the debt stacks can
              become even for a scaled operator. Neysa may ultimately prove more conservative than the risk narrative,
              but until it discloses tenor, collateral, and contracted revenue coverage, investors are underwriting a
              sovereign-AI expansion with a partially hidden debt instrument.
