  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing and Public Price Context
        blocks:
          - type: paragraph
            body: >-
              Neysa's current valuation context is easy to headline and hard to underwrite. The round is real: official
              and independent reporting line up around a $1.2 billion financing package, split between up to $600
              million of equity and an intended additional $600 million of debt, with Blackstone expected to emerge as
              the majority owner. The headline valuation most often cited in independent reporting is roughly $1.4
              billion, but the public record describes it as an enterprise valuation and does not disclose the
              preference stack, debt pricing, or covenant package that would determine the true economic price for
              minority equity. That distinction matters. A sponsor-led majority round plus a debt layer can improve GPU
              procurement, power access, and customer introductions, yet it can also embed downside protections that
              make the common-equity value less generous than the headline. Public operating disclosure is also thin.
              Neysa had about 1,200 GPUs live, wants to scale beyond 20,000, employed roughly 110 people, and says
              revenue should more than triple next year, but it has not publicly disclosed the revenue base, gross
              margin, utilization, or customer concentration that would prove whether the current price is conservative
              or already forward-priced.
            claimRefs:
