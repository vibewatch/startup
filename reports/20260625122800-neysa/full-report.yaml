      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand is rising because policy, capital, and usage are finally lining up. IndiaAI lowers the entry cost
              for startups and researchers; hyperscalers are adding sovereign-ready capacity; Blackstone's financing of
              Neysa and Yotta's scale-up show institutional belief that India needs domestic AI compute; and data-center
              developers are expanding across Mumbai, Hyderabad, Chennai, Pune, Delhi NCR, and emerging AI hubs such as
              Vizag. The key constraint is that announced capacity is not the same as operational, revenue-generating AI
              infrastructure. Cushman, JLL, and CRN all describe a market where execution capability, power
              availability, land access, and thermal design are becoming as important as demand. S&P adds the harder
              physical bottlenecks: datacenter electricity demand could rise from 13 TWh in 2024 to 57 TWh by 2030,
              energy already represents around 65% of operating expense, water stress threatens major urban clusters,
              and 15-30 GW of additional renewable capacity may be needed over five years. GPU supply and utilization
              visibility are also weak. For Neysa, that means the opportunity is real but conversion speed depends on
              solving power, cooling, and deployment bottlenecks faster than generic hyperscalers or rival Indian GPU
              clouds.
