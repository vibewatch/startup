      - number: '6.3'
        title: Durability, Procurement Friction, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of Neysa's public customer story. The reviewed materials do not disclose
              NRR, GRR, churn, contract length, minimum commitments, renewal rates, or top-customer revenue share, so
              there is no direct public way to tell whether the visible reference set is sticky or simply recent. The
              available proxies are encouraging but incomplete: TIFIN describes a post-migration production deployment
              with faster commercial rollout; Innoviti and ITQ both frame Neysa as infrastructure that made scaled
              production feasible; partner motions with Pipeshift and GreyLabs imply that solution-led distribution is
              expanding. Yet the same evidence also reveals friction. Neysa's own segment pages repeatedly describe
              delays moving from pilots or PoCs into production, data-localization review, GPU cost pressure, and
              integration overhead as barriers that must be overcome before budgets fully scale. Economic Times adds
              that enterprise clients are wrestling with token costs and latency even after adopting newer models, while
              ClusterMAX's adverse review is the clearest external warning signal: SemiAnalysis rated Neysa Bronze and
              cited security, usability, onboarding, scheduling, and monitoring weaknesses relative to international
              competitors. Concentration risk is therefore material. Public named proof clusters in a handful of
              India-centric verticals — wealth management, payments and retail field ops, travel distribution, research,
              and one unnamed medtech customer — with additional named customers from independent press but no disclosed
              revenue weights. That means Neysa's partner program and new partner-led offerings may be important for
              diversification, but current public evidence does not yet show how much of growth comes from repeat
              expansion versus new logo acquisition.
