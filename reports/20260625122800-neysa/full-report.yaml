  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and market structure
        blocks:
          - type: paragraph
            body: >-
              Neysa does not compete for all Indian cloud spending. Its relevant market includes GPU-as-a-service, AI
              training and inference clusters, AI-platform infrastructure, sovereign/public compute pools, and the
              colocation, power, cooling, and orchestration layers needed to operate those workloads in India. It
              excludes generic SaaS, horizontal enterprise software, standard CPU cloud, and most non-AI data-center
              construction not tied to high-density compute. That boundary matters because broad public-cloud or
              data-center totals overstate Neysa's true opportunity unless they are narrowed to workloads that value
              local GPUs, data residency, performance tuning, or dedicated support. India now has a three-part market
              structure: a public sovereign-compute layer led by IndiaAI; global hyperscalers such as Microsoft, AWS,
              Google, and Oracle that sell regional cloud footprints plus sovereign-ready controls; and local
              neo-cloud/data-center operators such as Neysa and Yotta that package dedicated GPUs, domestic hosting, and
              India-specific service levels. The strategic substitution pattern is also clear: buyers can stay on
              generic hyperscalers, build private clusters, or use Indian AI clouds that promise lower latency, stronger
              residency posture, and more predictable GPU economics.
