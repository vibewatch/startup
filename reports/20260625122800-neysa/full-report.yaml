  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Neysa is not entering a blank Indian GPU-cloud market. The closest direct alternatives are domestic,
              India-hosted providers that promise some mix of sovereign compute, AI infrastructure, and
              regulated-workload fit: Yotta’s Shakti Cloud, E2E Networks, Tata Communications Vayu, and adjacent
              enterprise alternatives such as Sify CloudInfinit+AI. Around them sits a second ring of hyperscalers—AWS,
              Azure, and Google Cloud—that remain relevant in India because they already own large enterprise budgets,
              broad developer ecosystems, and adjacent managed services. A third ring consists of global AI-native
              “neo-clouds” such as CoreWeave, which are not sovereign India providers but represent the operational and
              economic benchmark that Indian providers are increasingly measured against.


              For Neysa, the important competitive question is less “who has GPUs?” and more “who offers the best
              combination of India-resident compute, procurement simplicity, managed AI workflow, and enterprise trust?”
              On that basis the market is segmented. Yotta emphasizes raw sovereign scale and flagship partnerships; E2E
              emphasizes self-service and transparent hourly economics; Tata emphasizes compliance, network reach, and
              enterprise delivery; hyperscalers emphasize breadth; and CoreWeave shows what AI-native infrastructure
              looks like at global frontier scale. That means Neysa’s strategic contest is multi-front: it must beat
              domestic rivals on integration and security while avoiding being boxed out by hyperscaler lock-in and
              IndiaAI-subsidized channel expansion.
