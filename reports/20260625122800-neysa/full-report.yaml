              The public materials tell a coherent growth story, but they still do not provide the disclosure depth
              investors would have for a mature listed cloud operator. That matters because the risk transmission path
              is clear. If chip deliveries slow, if IndiaAI-linked demand softens, if enterprise conversions stay bursty
              rather than reserved, or if uptime and security proof remain more marketing-led than independently
              audited, then utilization stays below plan. In a capital-light SaaS company that would mainly hurt
