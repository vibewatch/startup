      - number: '4.4'
        title: Disclosure gaps and the underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The public disclosure problem is not that Neysa lacks evidence of demand; it is that nearly all of the
              decision-grade financial evidence is missing. Revenue is the best example. Tofler and Tracxn both provide
              revenue bands, but one says ₹10 crore to ₹25 crore and the other says ₹10 crore to ₹50 crore, with neither
              acting as a substitute for audited statements, recurring-revenue mix, or backlog. The same applies to
              cash, burn, gross margin, utilization, customer concentration, and debt service coverage: the chapter can
              infer the business model, but it cannot fully underwrite the company from public sources. This is why the
              financial analysis needs to stay disciplined about nulls. There is no credible basis to invent ARR,
              runway, gross margin, or net retention from the evidence reviewed.


              The bottom-line view is therefore mixed but coherent. Revenue quality looks better than a pure spot
              marketplace because Neysa appears to be selling dedicated capacity, private deployments, and managed
              inference into regulated enterprises that care about sovereignty, latency, and support. That should make
              the eventual revenue base stickier than commodity burst compute. At the same time, capex intensity is
              plainly high, and the new debt layer raises the cost of being wrong about utilization, pricing power, or
              hardware obsolescence. In other words: the business model is strategically plausible and commercially
              timely, but the public record still supports a financing-dependent infrastructure thesis, not a
              transparently profitable software thesis. Any serious diligence process should start by turning the
              chapter’s nulls into board-grade numbers.
