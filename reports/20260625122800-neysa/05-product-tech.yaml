- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow pressure
  - Neysa solution surface
  - measurable benefit
  - known limitation
  rows:
  - - Train or fine-tune enterprise models inside India
    - Teams need sovereign GPU access without waiting for imported capacity or building their own cluster
    - Dedicated or fractional GPUs, Jupyter and framework-ready environments, and private or hybrid deployment options
    - Faster provisioning and local data handling for training and fine-tuning
    - Public materials do not disclose exact regional footprint or queue-time statistics
  - - Publish production inference for latency-sensitive apps
    - Shared APIs create latency spikes, cold starts, and cross-border routing
    - Velocis inference endpoints and the Pipeshift partnership offer single-tenant, OpenAI-compatible endpoints
    - Nurix cited a 3x TTFT improvement and Arrowhead was live within a day
    - Those outcomes are customer-specific and not normalized into a public benchmark suite
  - - Run regulated BFSI AI workloads
    - Foreign-hosted inference and volatile unit economics can break compliance and business models
    - TIFIN used Velocis for training, experimentation, and inference within India
    - Case study claims 65% lower GPU-cloud spend and 99.95% uptime
    - Evidence comes from a company-authored case study, not an independent audit
  - - Automate multimodal retail support verification
    - Shared black-box APIs do not provide enough stack visibility or latency determinism
    - Innoviti moved Qwen 3.0 VL workloads onto dedicated Neysa inference infrastructure
    - Case study claims 60% TCO reduction, sub-30-second latency, and 96% automated verification accuracy
    - No raw benchmark methodology is published
  - - Support research-grade training with high-memory compute
    - Academic labs often face queue contention and insufficient memory headroom on shared clusters
    - IISc used dedicated bare-metal GPU nodes for synthetic data generation, training, and evaluation
    - 33 million sketch-image pairs and two open-weight models were reportedly trained without scaling down the design
    - The public case study does not name exact GPU counts or total training duration
  notes: Benefits are taken from published case-study or partner claims and should be treated as directional proof points rather than universally portable benchmarks.
