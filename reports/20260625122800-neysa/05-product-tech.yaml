- id: TE004
  title: Trust / quality / compliance table
  columns:
  - control / certification
  - status
  - scope
  - why it matters
  - gap
  rows:
  - - Zero-trust access model
    - Claimed live
    - Applies from provisioning through training, tuning, and serving
    - Supports tenant isolation and regulated workloads
    - No public architecture artifact explains enforcement boundaries in detail
  - - RBAC plus SSO/IAM integration
    - Claimed live
    - Permissions can be assigned by project, persona, or asset; SSO and IAM are named integrations
    - Lets enterprise admins map Velocis into existing identity controls
    - No public admin guide or permission schema is available
  - - Audit logging
    - Claimed live
    - Every action, access event, and deployment trigger is logged and exportable
    - Important for governance, forensics, and compliance teams
    - Retention windows, export formats, and alerting controls are undisclosed
  - - Encryption and BYOK/KMS
    - Claimed live
    - Data and model artifacts are encrypted at rest and in transit with customer-managed key support
    - Critical for sensitive model weights and regulated data
    - Public documentation does not name supported KMS backends or key-rotation workflows
  - - ISO/IEC 27001:2022 and SOC 2
    - Claimed by Neysa
    - Security page states both; customer-facing trust language is broad
    - Signals minimum enterprise security maturity
    - Public sources do not expose the SOC 2 report scope or exceptions
  - - CSA STAR listing and certification
    - Independently listed
    - CSA registry shows Level 1 self-assessment and Level 2 certification entries for Neysa Velocis
    - Externalizes some trust claims beyond Neysa marketing copy
    - CSA listing is not a substitute for full buyer diligence on control operation
  notes: Controls are evidence-backed at the feature or registry level, but buyer-grade trust artifacts remain partly gated or unavailable in public.
