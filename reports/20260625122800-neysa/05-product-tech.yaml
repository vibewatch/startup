  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hardware-fleet
    missingEvidence: A current, auditable breakdown of live GPU capacity by SKU, region, and delivery mode, including H100, H200, L40S, and any AMD or other accelerators.
    whyItMatters: Hardware mix drives performance expectations, queue risk, margin assumptions, and how credible the 20,000-GPU expansion target really is.
    diligencePath: Request a current infrastructure capacity deck or customer architecture appendix with per-SKU installed base and planned near-term deployments.
    relatedQuestionRefs:
    - QE013
    - QE027
  - type: private-evidence-only
    severity: material
    topic: support-and-sla
    missingEvidence: Public buyer-grade SLA artifacts covering uptime commitments, support response times, service credits, and incident-reporting obligations by plan or deployment mode.
    whyItMatters: Case studies claim reliability gains, but investors and enterprise buyers still need formal contractual reliability evidence rather than only marketing or testimonial language.
    diligencePath: Obtain sample MSA or SLA schedules plus a recent incident history or support KPI report for enterprise customers.
    relatedQuestionRefs:
    - QE025
    - QE026
  - type: missing-source
    severity: material
    topic: developer-surface-docs
    missingEvidence: Public API references, admin walkthroughs, and schema-level documentation for provisioning, monitoring, and policy controls inside Velocis.
    whyItMatters: The product narrative leans heavily on orchestration and control-plane depth, but without technical docs it is hard to underwrite integration effort or operational maturity.
    diligencePath: Request direct access to public or NDA-bound API documentation, console screenshots, and a sandbox or demo tenant walkthrough.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: minor
    topic: marketplace-roadmap
    missingEvidence: A dated public roadmap for the marketplace ecosystem, including launch timing, initial partners, and monetization mechanics.
    whyItMatters: Marketplace upside is part of the differentiation story, but a non-GA surface should not be underwritten as if it already contributes adoption or revenue.
    diligencePath: Ask management for an internal launch plan, signed partner list, and first-customer adoption targets for the marketplace module.
    relatedQuestionRefs:
    - QE014
    - QE027
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: minor
    topic: customer-mix
    missingEvidence: An auditable count of active production customers and workloads by vertical, deployment type, and revenue concentration.
    whyItMatters: Public proof spans multiple verticals, but investors still need to know whether those examples represent a broad installed base or a small set of lighthouse deployments.
    diligencePath: Request a pipeline and installed-base summary with customer counts, top-account concentration, and workload segmentation.
    relatedQuestionRefs:
    - QE028
