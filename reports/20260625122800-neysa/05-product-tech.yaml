    - Sovereign India-first positioning with transparent posted pricing
    - Exact live installed base by SKU, region, and bare-metal vs VM split is undisclosed
  - - aiPaaS lifecycle control plane
    - ML engineers and platform teams
    - Live / actively marketed
    - Integrated environments for training, fine-tuning, model registry, experiment tracking, monitoring, and CI/CD integration
    - Tries to remove toolchain sprawl rather than leaving buyers to assemble MLOps themselves
    - Public API and console documentation remain thin relative to the marketing depth
  - - Managed inference endpoints
    - Application and product teams
    - Live / expanding
    - Dedicated and managed inference for open-source and custom models with autoscaling and security layers
    - Bridge from experimentation into production deployment with lower ops overhead
    - Public SLA detail and benchmark disclosure remain limited
  - - Security and governance layer
    - Security, platform, and compliance teams
    - Live / externally attested
    - RBAC, SSO, audit logs, encryption, BYOK, KMS integration, and zero-trust access
    - Sovereign AI infrastructure paired with buyer-facing governance claims
    - SOC 2 scope and control mappings are not fully public
