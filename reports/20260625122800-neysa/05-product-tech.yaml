- id: sec-03
  title: Trust, sovereignty, and deployment proof
  body: Security, compliance, and localization are central to Neysa's differentiation story, and the public evidence is better than average for an early-stage infrastructure vendor. Neysa documents zero-trust access, project- and asset-level RBAC, SSO and IAM integration, exportable audit trails, encryption at rest and in transit, and customer-managed key support. It also claims ISO/IEC 27001:2022 certification and SOC 2 compliance, while the CSA STAR registry independently lists Neysa Velocis with both Level 1 self-assessment and Level 2 certification records. The localization argument is equally explicit. Neysa's event, funding, and partner materials repeatedly state that workloads, prompts, model weights, and enterprise data can remain inside Indian data centers, which is framed as particularly important for BFSI, healthcare, government, and public-service use cases. Customer proof is consistent with that narrative. TIFIN cites India-border data handling and 99.95% uptime for regulated
    financial workloads; Innoviti emphasizes deterministic sub-30-second latency, white-box control, and payment-data-sensitive operations; IISc describes high-memory bare-metal training for open-weight research; homepage references and partner materials point to voice AI builders such as Nurix, Navana, and Smallest. Taken together, the trust story is one of sovereign operations plus production support, not merely a compliance checkbox layered on later.
