- id: sec-02
  title: Architecture, orchestration, and hardware stack
  body: 'The most specific product evidence sits on Neysa''s architecture pages. Velocis describes an end-to-end ML lifecycle from data ingestion to inference and names concrete control-plane layers: AI cluster management, an AI scheduler, a resource manager, and support for GPUs delivered as bare metal, virtual machines, or containers. Storage is described across object, block, and NFS modes, while the integration surface spans GitHub or GitLab, Docker, MLflow, Kubeflow, Airflow, SIEM tooling, VPC connectivity, and enterprise IAM. Public observability claims are also concrete enough to matter in diligence: Neysa says the dashboard tracks GPU utilization, disk utilization, and NVMe allocation with custom metrics available on request. Hardware disclosures are less comprehensive than the software ones, but still meaningful. Neysa publishes H100 fractional and full-SXM offers and separately references H100 and H200 availability across product and case-study materials, while NVIDIA documentation
    supports why those SKUs matter for training and inference workloads that need high memory bandwidth, NVLink interconnects, and low-latency scale-out behavior. The architectural story is therefore coherent: Neysa is trying to own not just compute provisioning, but the orchestration and operating layer that sits between GPU capacity and a customer''s production AI workflow.'
