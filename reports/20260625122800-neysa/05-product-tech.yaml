- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - evidence-backed implementation detail
  - key dependency
  - risk
  rows:
  - - AI cluster management
    - Organizes compute pools for AI workloads
    - Explicitly named on the architecture page as part of the aiPaaS lifecycle
    - Available GPU capacity and scheduler quality
    - Public detail stops short of exposing placement logic or tenancy isolation mechanics
  - - AI scheduler
    - Matches workloads to compute resources
    - Named as a control-plane component and tied to scalable training and inference pipelines
    - Accurate resource metadata and workload-awareness
    - No public benchmark shows scheduling efficiency under load
  - - Resource manager
    - Allocates and tracks infrastructure resources
    - Listed alongside AI scheduler and cluster management in the public architecture
    - Telemetry, quota controls, and admin policies
    - Depth of quota and policy automation is not publicly documented
  - - Compute delivery modes
    - Provides GPUs as bare metal, VMs, or containers
    - Architecture page explicitly lists all three delivery modes
    - GPU supply, virtualization stack, and ops tooling
    - No public matrix shows which GPU SKUs are available in each mode
  - - Storage layer
    - Persists data, checkpoints, and model artifacts
    - Object, block, and NFS support are explicitly listed; case studies add NVMe references
    - Underlying storage fabric and throughput design
    - Public materials do not publish storage performance benchmarks
  - - Integration surface
    - Connects Velocis into existing dev and enterprise tooling
    - 'Identity: SSO/SAML/LDAP/RBAC; Dev/MLOps: GitHub or GitLab, Docker, MLflow, Kubeflow, Airflow; Cloud: VPC and hybrid support'
    - Customer IAM, containers, and CI/CD estate
    - Public docs do not show breadth of tested integrations or connector maturity
  - - Observability and logging
    - Monitors infrastructure and model operations
    - Dashboard claims cover GPU utilization, disk utilization, NVMe allocation, and custom metrics
    - Reliable telemetry collection and UI depth
    - No public screenshots or schema-level docs for logs and metrics are posted
  - - Inference and partner layer
    - Turns trained models into production APIs and workflows
    - Inference endpoints, autoscaling concepts, and the Pipeshift integration extend the stack beyond training
    - Partner software, security controls, and networking
    - Partner-led performance benefits may not generalize across every workload
  notes: This table separates publicly named components from inferred behavior; missing benchmarks and API docs remain the biggest architecture diligence gap.
