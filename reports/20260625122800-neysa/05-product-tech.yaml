chapter:
  number: 5
  title: Product & Technology
  summary: 'Neysa Velocis is positioned as a sovereign Indian AI cloud stack rather than a bare GPU reseller: the public product surface spans GPUaaS, an AI PaaS control plane, managed inference, observability, and security controls. Public evidence is strongest on deployment flexibility, security posture, and customer case-study outcomes; it is materially thinner on exact live fleet composition, buyer-grade SLAs, and public API documentation depth.'
sections:
- id: sec-01
  title: Product surface in customer workflow terms
  body: 'Neysa markets Velocis as a full-stack AI acceleration cloud rather than a single GPU rental page. The homepage and product page consistently present three buyer journeys: provision sovereign GPU capacity, build or fine-tune models inside pre-integrated environments, and publish production inference with governance and observability already attached. That positioning matters because the public materials do not stop at raw compute. They highlight integrated MLOps, model registry, experiment tracking, inference endpoints, centralized dashboards, and security controls as part of the commercial surface. The platform is also explicitly open-source-first in its orientation, emphasizing Jupyter, PyTorch, Hugging Face, MLflow, Kubeflow, Git, and container workflows rather than a closed proprietary model stack. Pricing evidence reinforces the same point. Neysa publishes fractional and full-H100 configurations, but pairs those listings with claims about predictable TCO, public or private deployment
    options, and managed support. Customer quotes on the homepage and case studies further suggest that the practical job-to-be-done is moving from AI prototype to production inside India without surrendering data residency, latency control, or cost predictability.'
