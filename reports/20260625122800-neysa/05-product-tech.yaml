- id: sec-04
  title: Roadmap signals, scale-up path, and technical risk
  body: 'Neysa''s roadmap signals are strongest where they intersect funding, partner launches, and explicit product placeholders. The architecture page says the roadmap is designed to absorb new GPU SKUs, model formats, agents, fine-tuning, and vector databases. The main product page labels the marketplace ecosystem as coming soon rather than generally available, which is important because it separates shipped modules from aspirational ones. The Pipeshift launch extends the product into single-tenant, OpenAI-compatible inference for open-source models and suggests a near-term go-to-market focus on latency-sensitive enterprise workloads such as voice AI, enterprise search, copilots, and reasoning systems. Blackstone and TechCrunch add the infrastructure scale-up layer: capital is earmarked for compute, networking, storage, orchestration, observability, and security software, with an explicit long-range goal of more than 20,000 GPUs in India. The same sources also reveal the main technical
    risks. Exact live GPU mix is still under-disclosed, marketplace timing is vague, public SLA artifacts are thin, and external news coverage still emphasizes sector-wide constraints around chip supply, data-center buildout, and power availability. In other words, Neysa''s roadmap is plausible and increasingly capitalized, but some of the most important underwriting details remain behind the curtain.'
