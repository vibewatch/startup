        title: GPU 供应、电力可得性和 hyperscaler 竞争相互叠加，而不是各自独立
        blocks:
          - type: paragraph
            body: >-
              对一家年轻公司而言，Neysa 的供给侧暴露异常集中。Business Standard 引述管理层称，约 95% 机群基于 Nvidia，仅有部分 AMD
              库存，并且还在讨论更广泛的芯片多元化。这很重要，因为同一个 2026 年新闻周期里，Neysa 一边明确谈到供应链韧性，一边又在与 AWS、Azure、Google 的产品竞争；这些产品已经宣传大规模 H100
              或 H200 集群、深度互连和成熟 AI 生态。竞争问题不只是标价问题。Neysa 必须拿到芯片、完成部署、供电、散热并保持满载，同时买家会继续把它与 GPU
              供应、软件广度和融资能力都大得多的供应商比较。行业证据进一步加压：印度 data-centre 评论现在指向运营用电需求从 2025 年约 1 GW 跳升到 FY32 的 13 GW；AI-ready
              机架可能需要 80–120 kW，大型负载还需要大量储能和冗余供电规划。供应滑坡、电力瓶颈，或付费利用率爬坡慢于预期，都会彼此强化。
