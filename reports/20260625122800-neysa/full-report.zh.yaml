  - id: TV005
    title: 论点破裂与终止触发条件表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - 债务经济性不及预期
        - 债务定价、契约或摊还吃掉过多现金流
        - 规模扩张从战略资产变成股权负担
        - 除非价格重置，否则从继续研究转向规避
      - - 利用率爬坡失败
        - 针对 20,000-GPU 计划，没有签约需求或健康利用率证明
        - Capex 不再像在修护城河，而像闲置库存
        - 要求已签约利用率，否则不推进
      - - 超大规模云厂商 TCO 差距收窄
        - AWS/Azure/GCP 定价或打包消除 Neysa 的成本 / 合规优势
        - 压缩利润率，并削弱主权细分市场
        - 按低倍数基础设施重新承销，而非软件附加云
      - - 集中度过高
        - 一两个客户或行业主导需求
        - 估值容易受流失、内建替代或政策变化冲击
        - 要求集中度折价和更紧的敞口上限
      - - 采购或电力滑坡
        - GPU 配额、数据中心容量或支持基础设施延迟到位
        - 债务或赞助方回报时钟继续走，收入兑现却被推迟
        - 执行赶上前，把预期价值推向熊市情景
    notes: 终止触发条件聚焦那些会同时损害收入兑现和倍数选择的变量。
    claimRefs:
      - CV020
      - CV021
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
      - CV050
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入和利润率
        - 当前 ARR / 收入运行率、毛利率、推理与裸金属业务组合
        - 缺少这些，就无法可信套用可比区间
        - 要求月度 cohort 收入、毛利和利用率桥接表
      - - 客户集中度
        - Top-10 客户、预留容量承诺、续约条款
        - 决定收入是耐久还是脆弱
        - 审查客户 cohort 数据和合同摘要
      - - 债务包
        - 计划中 $600M 债务的定价、担保、摊还、契约和交叉违约条款
        - 债务会改变同一公开估值下的经济价值
        - 获取贷款方条款清单和下行情景模型
      - - 优先权结构
        - 清算优先权、ratchet 调整权、反稀释、董事会权利和同意权
        - 需要借此把企业价值转换为股权价值
        - 审查最终股权文件和股权结构表分配瀑布
      - - 采购和电力
        - GPU 配额函、交付时间表、托管 / 电力承诺
        - 检验 20,000-GPU 目标能否按时落地
        - 检查 OEM、托管和电力协议
      - - 后续退出证据
        - 赞助方资本重组、战略收购或公开市场路径证据
        - 退出路线影响可接受入场价格和持有期
        - 收入和结构验证后，再搭建退出地图
    notes: 这些问题按其对估值判断的直接影响排序，而不是按一般运营好奇心排序。
    claimRefs:
      - CV015
      - CV016
      - CV039
      - CV049
      - CV051
