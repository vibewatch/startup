      - number: '4.4'
        title: 披露缺口和承保结论
        blocks:
          - type: paragraph
            body: >-
              Neysa 的公开披露问题不在于缺乏需求证据，而在于几乎所有决策级财务证据都缺失。收入是最好的例子。Tofler 和 Tracxn 都给出收入区间，但一个称 ₹10 crore 到 ₹25 crore，另一个称
              ₹10 crore 到 ₹50 crore；二者都不能替代经审计报表、经常性收入结构或
              backlog。现金、烧钱速度、毛利率、利用率、客户集中度和债务服务覆盖也一样：本章可以推断商业模式，但无法仅凭公开来源完整承保公司。这也是财务分析必须严守 null 的原因。已审阅证据没有可信基础来编造
              ARR、runway、毛利率或净留存。


              因此，底线判断是混合但自洽的。收入质量看起来好于纯现货市场，因为 Neysa
              似乎在向重视主权、延迟和支持的受监管企业销售专用容量、私有部署和托管推理。这应让最终收入基底比商品化突发计算更有粘性。与此同时，资本开支强度显然很高，新增债务层提高了对利用率、定价权或硬件淘汰判断出错的成本。换句话说：商业模式在战略上可行，也赶上商业窗口，但公开记录仍支撑的是一个依赖融资的基础设施命题，而不是一个已透明盈利的软件命题。任何严肃尽调都应从把本章的
              null 转成董事会级数字开始。
