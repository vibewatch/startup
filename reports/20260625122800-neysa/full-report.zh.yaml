  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 梳理从主权需求顺风、产品差异化，到隐藏经济性风险，再到最终建议的链条。
    data:
      nodes:
        - id: n1
          label: 印度需求顺风：当前 <60k 块 GPU，长期潜力 >2M
        - id: n2
          label: Neysa 差异化：主权本地性 + 全栈工具 + 赞助方支持
        - id: n3
          label: 证据缺口：无公开 ARR、利润率、利用率或清算优先权结构
        - id: n4
          label: 可比区间：按公开可见倍数，需要 $93M-$212M 收入支撑 $1.4B 估值
        - id: n5
          label: 下行压力：债务、产能信贷筛选和超大规模云厂商交叉补贴
        - id: n6
          label: 建议：继续研究 / 高风险 / 估值拉伸
    claimRefs:
