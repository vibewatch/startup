companyProfile:
  summary: >-
    Neysa 是一家总部位于孟买的 AI 加速云公司，由 Sharad Sanghi 和 Anindya Das 于 2023 年创立。公司把 Velocis 定位为印度主权 AI
    云栈，面向受监管企业、初创公司、研究用户和公共部门工作负载，把 GPU 基础设施、编排、可观测性、推理和 AI 安全打包在一起。公开证据显示公司已有真实客户验证，并在 2026 年 2 月拿到 Blackstone
    领投的大额融资；但支撑估值的经营记录仍不透明，因为收入、利润率、利用率和债务条款都未公开披露。
