      - number: '3.3'
        title: 超大规模云厂商和全球新型云类比
        blocks:
          - type: paragraph
            body: >-
              即便 AWS、Azure 和 Google Cloud 不是最纯粹的主权云答案，它们在印度仍具战略相关性。AWS 拥有印度区域和本地区域，以及 H100/H200 支持的 P5 系列。Azure 拥有 ND 系列
              GPU 基础设施和深厚企业渗透，但其自身数据驻留文档明确显示，部分 AI 和管理元数据可能因服务选择离开所选地理区域。Google Cloud 强调全球区域、性价比工具和具备数据驻留能力的区域，但已审阅页面仍把
              AI 基础设施呈现为全球云目录的一部分，而不是专为印度主权 AI 打造的捆绑包。换言之，超大规模云厂商靠生态引力竞争，而不是靠印度优先包装。


              CoreWeave 很重要，因为它是 AI 原生云专业化的全球基准。其官网和 S-1 描述了一朵专为 AI 打造的云，围绕裸金属、编排、可观测性，以及为模型训练和推理优化的存储 / 网络展开。这比
              AWS、Azure 或 GCP 的通用云模式更接近印度主权 AI 云所追求的运营模式。但 CoreWeave 是类比对象，而不是直接的印度主权竞争对手：保留来源没有显示其参与
              IndiaAI、提出印度特定数据驻留主张，或进行本地公共部门定位。对 Neysa 来说，CoreWeave 更像是产品架构和经济性的基准，而不是印度境内短期市场进入阻碍。
