  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 证明点
      - 定价 / 打包方式
      - 最适合买方
      - 相对 Neysa 的战略短板
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the main India-relevant sovereign AI cloud, hyperscaler, and AI-native analog options with public
        evidence reviewed on 2026-06-25; excludes smaller local resellers and providers with only thin public
        disclosure.
    rows:
      - - Neysa
        - 本土主权 AI 云
        - 官方定价页披露库存，包括 392 个 H100 SXM、200 个 H200 SXM，以及 L40S、L4 和 MI300
        - 销售主导的预留式打包；公司称定价全包，覆盖算力、存储、出站流量、K8s、笔记本环境、MLOps 和推理
        - 受监管企业、生产级 AI 团队、开放权重模型开发者
        - 原始资源规模看起来小于 Yotta 和超大规模云厂商；官方对比称，托管专有模型 API 不是重点
      - - Yotta Shakti Cloud
        - 本土主权 AI 云
        - 官方网站称拥有 8,000+ 个 H100 GPU、NVIDIA Cloud Partner 身份和印度托管主权云
        - 已发布月度工作站和集群价格；平台访问单独销售
        - 政府、公共部门、企业和大型主权 AI 训练工作负载
        - 公开证据显示，其一体化 MLOps 和 AI 专用安全弱于 Neysa；部分商业层看起来是分开的
      - - E2E Networks
        - GPU 优先的印度云
        - MeitY 入围 GPU 云，发布 B200/H200/H100/L4 价格，并执行 IndiaAI 订单
        - 小时、月度和年度标价，定位自助采购
        - 创业公司、研究人员、突发工作负载、成本敏感型 AI 团队
        - 打包安全、可观测性或全栈企业控制的证据较少
      - - Tata Communications Vayu
        - 企业主权 AI 云
        - 印度驻留主权云姿态，加上 GPU 云、连接能力和企业客户覆盖
        - 报价主导的 GPU 打包，宣称按需付费且无意外出站流量费
        - 大型企业、政府、受监管行业、既有 Tata 客户群
        - 公开定价透明度低于 E2E 或 Yotta，产品主导自助服务的公开证据也更少
      - - AWS
        - 超大规模云厂商
        - 印度区域和本地区域；P5 H100 以及 P5e/P5en H200 系列
        - 由计算器和合同驱动，而不是印度专属主权 AI 套餐
        - 已在 AWS 服务上标准化的企业
        - 生态广度强，但印度优先的主权打包较弱
      - - Azure
        - 超大规模云厂商
        - ND 系列 GPU 加深厚的 Microsoft 企业版图
        - 按需付费 / 企业协议式采购
        - 以 Microsoft 为中心的企业和混合云买方
        - 数据驻留模型存在按服务划分的例外，不如本土“全在印度”营销口径干净
      - - Google Cloud
        - 超大规模云厂商
        - 全球 43 个区域、130 个可用区，提供 AI 导向基础设施和按区域定价工具
        - 全球 SKU / 区域价格表，而不是主权 AI 套餐
        - 需要 Google AI 生态、全球路由和性价比工具的买方
        - 印度主权打包或简化受监管行业采购的证据较少
      - - Sify CloudInfinit+AI
        - 本土相邻企业服务商
        - 基于印度数据中心足迹和企业 ICT 客户基础推出 GPUaaS
        - 按需付费 GPUaaS，定位训练、推理、分析、渲染和仿真
        - 既有 Sify 企业客户追加 GPU 容量
        - 一体化 MLOps / 安全深度和详细标价的公开证据较少
      - - CoreWeave
        - 全球 AI 原生新型云对标
        - 专为 AI 打造的云，加上 SEC 文件披露的 AI 基础设施定位
        - 企业 / 合同式 AI 原生云经济模型
        - 前沿模型实验室和全球 AI 原生团队
        - 未看到印度主权托管、IndiaAI 渠道访问或本地公共部门姿态的已审阅证据
    notes: 各行混合了官方厂商披露、技术文档、政府来源、申报文件和新闻。“战略短板”是分析归纳，不是直接引语，应理解为相对 Neysa 公开定位的差距。
