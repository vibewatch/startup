      - number: '2.4'
        title: 增长驱动和约束
        blocks:
          - type: paragraph
            body: >-
              需求正在上升，因为政策、资本和使用终于开始对齐。IndiaAI 降低了初创公司和研究者的进入成本；超大规模云厂商在增加主权就绪容量；Blackstone 对 Neysa 的融资和 Yotta
              的扩张显示机构资本相信印度需要本土 AI 计算；数据中心开发商也在孟买、Hyderabad、钦奈、Pune、Delhi NCR，以及 Vizag 等新兴 AI
              枢纽扩张。关键约束在于，已宣布容量不等于已经投运、能够产生收入的 AI 基础设施。Cushman、JLL 和 CRN 都描述了一个市场：执行能力、电力可得性、土地获取和热设计正变得与需求同样重要。S&P
              还补充了更硬的物理瓶颈：数据中心电力需求可能从 2024 年的 13 TWh 升至 2030 年的 57 TWh；能源已占运营支出约 65%；水资源压力威胁主要城市集群；未来五年可能需要 15-30 GW
              额外可再生能源容量。GPU 供应和利用率可见度也偏弱。对 Neysa 来说，机会是真实的，但转化速度取决于它能否比通用超大规模云厂商或印度 GPU 云竞争对手更快解决电力、制冷和部署瓶颈。
