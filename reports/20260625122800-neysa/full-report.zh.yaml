      - CV013
      - CV037
      - CV043
      - CV048
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 展示在不同可比倍数下，Neysa 需要多少年化收入才能支撑 $1.4B 估值。
    data:
      items:
        - label: 41.3x（Nebius 式异常值）
          value: 34
        - label: 25x（高溢价现有巨头视角）
          value: 56
        - label: 15x（公开云区间上沿）
          value: 93
        - label: 10x（中段区间）
          value: 140
        - label: 7.5x（Together AI 视角）
          value: 187
        - label: 6.6x（CoreWeave 视角）
          value: 212
    approximationNotes: 数值为 $1.4B 估值除以公开可见可比倍数后隐含的收入门槛，单位为百万美元；这些是敏感性锚点，不是预测。
