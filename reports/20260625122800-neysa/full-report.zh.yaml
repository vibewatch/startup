  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 展示 Neysa 如何把受监管或成本敏感需求推进到生产采用和扩张。
    data:
      nodes:
        - label: 1. 需求触发
          detail: AI 团队在碎片化基础设施上遇到成本、延迟、合规或 GPU 获取限制
          tone: neutral
        - label: 2. 架构评审
          detail: 买方在承诺受监管工作负载前，先测试主权数据姿态、定价模型和支持响应速度
          tone: neutral
        - label: 3. 试点 / PoC
          detail: Neysa 为 BFSI、零售、制造、研究和初创企业的验证工作负载提供预留或按需 GPU 容量
          tone: neutral
        - label: 4. 生产部署
          detail: 参考案例显示，TIFIN、Innoviti、ITQ、IISc 和一家全球医疗技术团队已上线生产或类生产部署
          tone: positive
        - label: 5. 优化 / 支持
          detail: 客户寻求更低 token 成本、更少宕机和更快推理；合作伙伴捆绑可增加工作流特定价值
          tone: positive
        - label: 6. 扩张或停滞
          detail: 扩张要靠合规审批、成本纪律和平台质量撑住；监控薄弱或续约不清，都会卡住更大范围的落地
          tone: risk
    approximationNotes: 阶段划分综合了公开案例、定价表述和负面评价证据，并非公司披露的官方漏斗。
