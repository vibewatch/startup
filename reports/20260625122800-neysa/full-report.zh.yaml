  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本强度和利用率是一阶风险，因为其他上行假设都建立在这两点之上
        blocks:
          - type: paragraph
            body: >-
              公开记录现在把 Neysa 描绘得更像一个基础设施资产负债表故事，而不是软件初创公司。Blackstone 2026 年 2 月的交易不是小规模增长延伸；它把最高 $600M 新股权与计划中的 $600M
              债务配在一起，并把融资直接绑定到在印度部署超过 20,000 块 GPU 的计划。TechCrunch 同时报道称，Neysa 约有 1,200 块 GPU
              已上线，目标是在高级客户对话转化后一年内把容量扩大到三倍以上。这给公司留下的运营窗口很窄。定价页显示 committed-use 折扣很激进，包括多年 H100
              预留的大幅节省；公司还宣传不对出口流量或推理交易额外收费。这些条款能帮助抢份额，但也让上座率、预留量捕获和机群利用率成为利润率修复的决定因素。如果部署延迟、债务文件收紧，或客户停留在试点而不是转向持续预留使用，下行会先打到现金流，再打到估值。
