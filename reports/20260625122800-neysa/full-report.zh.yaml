  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - IndiaAI Mission 和主权算力政策
        - 增长驱动
        - 2024-2026
        - 为本土算力提供商创造明确公共需求、补贴访问和合法性
        - 核实实际利用率、预留逻辑，以及政策容量转化为付费工作负载的比例
      - - 超大规模云厂商主权就绪建设
        - 增长驱动
        - 2025-2029
        - 证明印度是战略性 AI 区域，也让 AI 工作负载境内托管变得常态化
        - 跟踪超大规模云厂商定价是否压缩新型云的差异化空间
      - - Blackstone/Yotta 资本承诺
        - 增长驱动
        - 2026 年起
        - 释放机构资金看好本土 AI 基础设施的信号，并加速供给建设
        - 确认硬件交付排期、融资条款和利用率假设
      - - 受监管行业的数据驻留和审计需求
        - 增长驱动
        - 当前
        - 推动 BFSI、医疗和政府买方转向本地 AI 部署模式
        - 识别哪些行业可在控制措施下使用超大规模云厂商，哪些必须使用专用本土集群
      - - 电力可用性和电网执行
        - 约束
        - 当前至 2030
        - 即使需求可见，也可能拖慢 AI 就绪园区，并推高运营成本
        - 按城市和园区绘制电力可用性，而不只看已宣布兆瓦数
      - - 用水和冷却强度
        - 约束
        - 当前至 2030
        - 高密度 AI 机架会在已经承压的城市市场带来用水和散热风险
        - 确认目标园区的冷却设计、水源和回收安排
      - - GPU 供给和硬件交付周期
        - 约束
        - 当前
        - 限制已宣布需求转化为可用容量的速度
        - 验证分配优先级、供应商组合和进口 / 物流韧性
      - - 利用率不透明和合同价值不透明
        - 约束
        - 当前
        - 公开 GPU 数量无法说明付费利用率、预留组合或收入获取
        - 在 NDA 下索取管线、占用率和合同组合数据，以收紧 SAM/SOM 测算
    notes: 上行情景不只取决于抽象的 AI 需求，更取决于资本、政策和硬件能否落成有电力、冷却和客户利用率支撑的运营集群。
