  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价和变现层
        blocks:
          - type: paragraph
            body: >-
              Neysa 的公开界面指向一种比简单现货 GPU 租赁更宽的收入模式，但根基仍是出售计算容量。公司公开列出三种核心产品形态——托管 VM 实例、裸金属 GPU 服务器和托管 Kubernetes
              集群——再叠加公有、私有和混合部署选项。这在财务上很关键，因为价格歧视逻辑清晰可见：按需工作负载把实验和突发需求变现，预留或承诺容量则用折扣换取更好的前瞻可见度。同一价格页还去掉了几类常见云附加费，包括
              ingress、egress 和推理交易费，这支撑了 Neysa 不仅按原始峰值性能竞争，也按账单可预测性竞争的叙事。


              更有意思的问题是，Neysa 能否在商品化计算之上挂上更高质量收入。答案是“很可能可以，但公开投资人仍无法量化”。Velocis 打包编排、AI Studio、可观测性、推理端点，以及 Aegis
              等安全功能；Pipeshift 合作又把产品扩展到专用托管推理环境。这些功能可能提高转换成本，并打开平台或服务变现空间。不过，Neysa
              没有披露多少收入来自经常性预留容量，多少来自专业服务，也没有说明托管推理是按高溢价软件层计费，还是只是转嫁计算成本的包装。公开层面，公司像一家 B2B GPU 云和主权 AI
              平台，拥有多条变现杠杆；私下层面，缺失的收入结构数据是第一个重大承保障碍。
