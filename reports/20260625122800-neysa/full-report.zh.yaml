    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 情景
      - 收入 / 利用率假设
      - 倍数假设
      - 隐含估值区间
      - 概率信号 / 关键风险
    rows:
      - - 牛市
        - 年化收入约 $150M-$220M，利用率强，软件 / 推理附加收入可见，并有长期签约需求
        - 12x-14x 收入
        - $1.8B-$3.0B
        - 需要主权需求在超大规模云厂商缩小差距前转化为持久合同
      - - 基准
        - 年化收入约 $90M-$140M，算力加服务经济性混合，利用率中等
        - 9x-12x 收入
        - $0.8B-$1.7B
        - 如果 Neysa 做出规模但仍是小众主权供应商，这是最可能情景
      - - 熊市
        - 年化收入低于 $60M，利用率弱，且相当多经济性被债务服务或折扣吃掉
        - 5x-8x 收入
        - $0.3B-$0.7B
        - 由供应延误、需求可见度薄弱或价格竞争触发
      - - 当前公开估值
        - 公开证据未披露当前收入基数
        - 对应 $93M 收入约 15x，$140M 收入约 10x，或 $212M 收入约 6.6x
        - 当前 $1.4B
        - 问题不在价格本身，而在缺少已披露收入锚定价格
    notes: 情景区间是基于公开可比公司倍数的明确假设，不应误读为管理层预测。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 公开指标
      - 估值 / 倍数
      - 相关性
      - 局限
    rows:
      - - CoreWeave
        - 上市 AI 云
        - 2026 年 Q1 收入 $2.078B；待履约订单 $99.4B
        - 市值 $55.03B；约 6.6x 年化 Q1 收入
        - GPU 优先基础设施最接近的规模化上市新云参照
        - 杠杆和集中度风险较重；比 Neysa 更成熟
      - - Nebius
        - 上市 AI 云
        - 2026 年 Q1 收入 $399M
        - 市值 $65.92B；约 41.3x 年化 Q1 收入
        - 展示公开市场愿为超高增长 AI 云动能支付的价格
        - 异常溢价；不是常规承销基准
      - - DigitalOcean
        - 上市托管云
        - FY2025 收入 $901M；ARR $970M；AI ARR $120M
        - 市值 $15.5B；约 14.2x 指引 2026 年收入
        - 可参照软件附加、推理占比较高的云模式
        - 更广泛的 SMB 云业务，利润率为正，运营历史更长
      - - Oracle OCI
        - 上市在位云业务
        - FY2026 OCI 收入 $18.1B；RPO $638B
        - 全公司市值 $453.76B；分部无法直接拆分
        - 体现在位巨头给 AI 基础设施带来的规模和融资弹性
        - 混有数据库、SaaS 和其他业务；不是创业公司可比对象
      - - Together AI
        - 私有 AI 基础设施 / API 平台
        - Sacra 估算：约 $1B 年化收入
        - 正洽谈约 $7.5B 融资前估值；约 7.5x 年化收入
        - 收入可见 AI 基础设施的私有市场参照
        - 估算来自第三方分析，非经审计披露
      - - Lambda
        - 私有 GPU 云
        - 2025 年报道披露 25,000+ GPUs 和 5,000+ 客户
        - 2025 年 2 月轮次 $2.5B；随后 2025 年 11 月 >$1.5B Series E
        - 显示专业 GPU 云的规模和反复资本需求
        - 收入未公开披露，无法直接计算倍数
      - - Crusoe
        - 私有一体化 AI 基础设施
        - 2025 年前三季度订单额增长 5x；1.2 GW 园区阶段已上线
        - '> $10B Series E 估值'
        - 一体化电力加云溢价参照
        - 电力主导模式比 Neysa 更垂直整合
    notes: 可比集合刻意混合上市新云、托管云类比对象和私有 AI 基础设施建设者，因为 Neysa 尚未披露足够经济性，无法支撑更窄的纯粹同业匹配。
    enumerationScope:
      coverage: partial
      basis: >-
        Seven relevant public and private AI infrastructure references were selected for revenue visibility, valuation
        visibility, or capital-intensity insight as of the 2025-2026 window; the set is analytical rather than
        exhaustive.
