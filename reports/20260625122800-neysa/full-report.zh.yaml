      - number: '2.2'
        title: 规模测算视角和 Neysa 可服务市场
        blocks:
          - type: paragraph
            body: >-
              公开来源没有给出一个干净、直接测量的印度 AI 云或 GPU 基础设施 TAM，因此本章采用多个视角。最宽的相邻市场是 IDC 对印度公有云到 2029 年达到 $30.4B 的预测，但其中包含许多 Neysa
              永远不会触达的工作负载。更收窄的基础设施视角来自 Arizton 对印度数据中心市场的估算：2025 年 $9.79B，2031 年增至 $21.03B；Cushman 和 JLL
              关于多吉瓦建设管线的证据也支撑这一视角，但这些数字仍包含通用容量。最有决策价值的底线是主权 / 公共计算：S&P 称，到 2025 年中，IndiaAI 招标已授出 34,371 张 GPU，补贴价格低至每
              GPU 小时 $1.36；官方治理指南称，截至 2026 年 2 月，38,000+ 张 GPU 已接入；ETGovernment 称还在追加 20,000 张 GPU，使总数达到约
              58,000。把这些已披露公共计算足迹年化，在私人企业需求之前，可得到约 $0.41B-$0.69B 的证据支撑底线。因此，Neysa 的 SAM 位于这个公共底线与更宽的云 /
              数据中心相邻市场之间，集中在需要国内 GPU 集群而非通用云捆绑包的受监管企业、政府项目、GCC、初创公司和 AI 实验室。
