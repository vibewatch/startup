      - number: '3.4'
        title: 转换成本、防御性和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Neysa 的防御性更可能来自工作流集成，而不是单纯 GPU 访问。通过 IndiaAI 入围、Yotta 规模化建设、E2E 透明自助目录和 Tata 主权企业平台，国内市场供应越来越充足。如果 GPU
              供应扩大、补贴降低转换壁垒，简单的“印度托管计算”会更容易被复制。Neysa 更强的故事在于，买家可以在一份合同里一起采购计算、MLOps 和 AI
              安全。对希望减少供应商、获得更清晰成本控制的受监管企业买家，这一点最重要。


              即便如此，转换成本也有双向作用。已经投入 Azure ML 或更广泛 AWS 和 Google
              体系的超大规模云客户，可能更愿意把模型开发留在现有合同、身份系统和平台工具内。国内云之间相对更容易多云并用，因为多家公司围绕 Kubernetes、集群式 GPU
              访问或标准存储接口营销自己。但预留容量、支持流程、实验追踪习惯、安全控制和采购审批，在团队开始训练模型或把模型投入生产服务后，仍会形成真实粘性。因此，Neysa
              面临的主要竞争风险不只是某个单一对手，而是一个拥挤市场：每种替代方案都占据买家决策栈的一部分——规模、价格透明度、主权信任、企业分销或生态广度。
