              detail: 客户引述有说服力，但基准透明度有限。
            - label: 强
              tone: positive
              detail: Pipeshift 合作是清晰的 2026 年路线图延伸，且已进入市场。
        - label: 安全与合规
          values:
            - label: 强
              tone: positive
              detail: 安全控制有明确文档。
            - label: 中
              tone: neutral
              detail: 控制宽度扎实，但买方级实施细节有限。
            - label: 强
              tone: positive
              detail: 信任和主权是一线卖点。
            - label: 强
              tone: positive
              detail: CSA STAR 独立佐证了部分信任姿态。
            - label: 中
              tone: neutral
              detail: 公开信任门户深度仍可提升。
        - label: 市场生态
          values:
            - label: 低
              tone: warning
              detail: 公开页面写的是即将推出，而非普遍可用。
            - label: 低
              tone: warning
              detail: 未发布公开工作流示例或合作伙伴目录。
            - label: 中
              tone: neutral
              detail: 若推出得当，可加强印度特定 ISV 分发。
            - label: 低
              tone: warning
              detail: 尚无外部客户验证。
            - label: 低
              tone: warning
              detail: 时间表和商业模式仍披露不足。
