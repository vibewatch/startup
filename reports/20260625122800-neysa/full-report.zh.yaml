        - 展示已签约的受监管行业负载，以及稳定续约行为
      - - 全栈差异化
        - 集成可观测性、MLOps 和安全能力，相比单纯 GPU 租赁可抬高切换成本
        - 软件附加收入可能仍太小，抵不过算力商品化
        - 披露附加率、利润率，以及托管服务收入占比
      - - 赞助方优势
        - Blackstone 可帮助采购、融资和客户引荐
        - PE 控股加债务，也可能意味着优先权保护和更严格回报门槛
        - 分享条款清单、债务定价和任何投资人保护安排
      - - 客户证据
        - 公开客户证言显示，本地性、支持和合规确实影响真实买家
        - 客户证言不等于已披露 ARR、利用率或集中度
        - 提供 cohort 数据、预留容量承诺和集中度指标
      - - 可比公司支撑
        - CoreWeave、Together AI 和 DigitalOcean 证明，真正的云资产可按远高于通用基础设施的倍数交易
        - 这些可比公司披露了 Neysa 未披露的规模和收入，Nebius 又属于异常高值
        - 披露足够运营数据，让 Neysa 能可信落入可比区间
      - - 竞争
        - 只要全球待履约订单让美国新云厂商暂时专注别处，印度专精可能有价值
        - 超大规模云厂商才是真正对手，因为它们能交叉补贴 GPU 定价并打包合同
        - 证明相对 AWS/Azure/GCP 有持久的 TCO、合规或服务优势
