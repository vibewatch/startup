      - number: '8.2'
        title: 可比基准与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比公司更能说明 Neysa 还必须证明什么，而不是说明什么价格已经合理。CoreWeave 是披露规模的最接近公开 neo-cloud 参照，2026 年 6 月交易价格约为 Q1 年化收入的
              6.6x，但这是在其构建了近 $100B backlog 和超过 1 GW active power 之后。DigitalOcean 更偏推理和 managed-cloud，交易价格接近 2026 年指引收入的
              14x 或 ARR 的 16x，同时利润率为正，并披露 AI ARR 中超过 70% 来自推理服务和核心云，而非 bare metal。Together AI 的私募基准约为年化收入的 7.5x，更接近
              CoreWeave，而不是热度更高的公开市场异类 Nebius；Nebius 2026 年 6 月市值隐含超过 Q1 年化收入的 40x。Nebius 能维持这个溢价，是因为它披露了超高增长、公开市场流动性和
              1.2 GW 新工厂容量。Neysa 没有披露这些经济指标。在当前 $1.4B 标记下，如果按 15x 倍数，Neysa 需要约 $93M 收入；按 10x 需要 $140M；按 CoreWeave 式 6.6x
              需要 $212M。没有披露收入，就不能凭公开证据说估值便宜。因此，牛市、基准和熊市情景都需要围绕明确的门槛经济性来框定，而不是只围绕叙事。
