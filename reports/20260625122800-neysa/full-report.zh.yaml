  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Neysa 进入的不是一片空白的印度 GPU 云市场。最接近的直接替代者是印度本土、印度托管的提供商，它们承诺不同组合的主权计算、AI 基础设施和受监管工作负载适配：Yotta 的 Shakti
              Cloud、E2E Networks、Tata Communications Vayu，以及 Sify CloudInfinit+AI 等相邻企业替代方案。它们外围还有第二圈超大规模云厂商——AWS、Azure
              和 Google Cloud——这些厂商在印度仍然相关，因为它们已经掌握大型企业预算、广泛开发者生态和相邻托管服务。第三圈是 CoreWeave 等全球 AI
              原生“新型云”，它们不是印度主权提供商，但代表印度提供商越来越需要对标的运营和经济性基准。


              对 Neysa 来说，更重要的竞争问题不是“谁有 GPU？”，而是“谁能提供印度境内计算、采购简便性、托管 AI 工作流和企业信任的最佳组合？”按这个标准，市场已经分层。Yotta
              强调原始主权规模和旗舰合作；E2E 强调自助服务和透明小时经济性；Tata 强调合规、网络覆盖和企业交付；超大规模云厂商强调广度；CoreWeave 则展示全球前沿规模下的 AI 原生基础设施形态。这意味着
              Neysa 的战略竞争是多线作战：它必须在集成和安全上胜过本土对手，同时避免被超大规模云厂商锁定和 IndiaAI 补贴渠道扩张挤出。
