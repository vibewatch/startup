      - number: '1.4'
        title: 里程碑、客户验证和负面信号
        blocks:
          - type: paragraph
            body: >-
              Neysa 的公开里程碑密度足够高，使其看起来像一个运营中的平台，而不只是一个融资故事。公司从 2024 年种子轮出发，2024 年 7 月发布 Velocis，2024 年 10 月声称已有付费客户，2024
              年 12 月宣布与 Data Science Wizards 的保险云合作，2025 年 4 月浮现 NTT Data-Telangana Hyderabad 计算集群计划，2026 年 5 月与
              Pipeshift 推出印度境内推理，2026 年 6 月又加入 Anup Purohit 作为战略顾问。这一节奏支持一种判断：公司正在同时搭建基础设施和市场进入能力。


              客户验证强于典型早期基础设施公司的公开足迹。公司案例研究展示了 Indian Institute of Science、Innoviti、TIFIN 和 ITQ 的部署，更广泛的网站材料提到 HDFC
              Bank、PhonePe、Juspay、Fractal、Navana.ai、Smallest.ai、Graylabs.ai 和 Arrowhead AI。跨这些例子看，Neysa
              最可复制的角度不是通用云托管，而是主权且对性能敏感的 AI 工作负载；在这些场景里，数据驻留、延迟或成本透明度会让超大规模云厂商显得不那么有吸引力。


              主要负面信号是经济性的，而不是法律层面的。Sacra 明确把超大规模云厂商价格竞争、监管变化和计划债务融资引入的杠杆列为重大风险。Fortune India 又补充了一条有用警示：Blackstone
              交易前，Neysa 已把首批 $50 million 中约 $44 million 投入 GPU
              基础设施，说明该商业模式能快速吞掉资本，因此高度依赖利用率纪律。简言之，公司有实质动能，但业务现在必须证明资本强度、本地需求增长和主权计算差异化能够转化为持久经济性。
