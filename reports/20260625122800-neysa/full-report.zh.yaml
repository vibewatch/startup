              持久性是 Neysa 公开客户故事里最薄弱的一环。已审阅材料没有披露
              NRR、GRR、流失率、合同期限、最低承诺、续约率或头部客户收入占比，因此无法从公开信息直接判断这些可见参考是否黏性足够，还是只是近期新增。现有代理指标积极但不完整：TIFIN 描述了迁移后的生产部署和更快的商业
              rollout；Innoviti 与 ITQ 都把 Neysa 定位为让规模化生产可行的基础设施；与 Pipeshift、GreyLabs 的合作动作暗示方案型分销正在扩大。但同一组证据也暴露了摩擦。Neysa
              自己的细分页面反复提到，从试点或 PoC 进入生产的延迟、数据本地化审查、GPU 成本压力和集成开销，都是预算真正放大前必须跨过去的障碍。Economic Times 还指出，企业客户即便采用新模型后，仍在处理
              token 成本和延迟问题；ClusterMAX 的负面评测则是最清晰的外部警报：SemiAnalysis 给 Neysa 评为
              Bronze，并指出其安全性、易用性、入门、调度和监控相较国际竞争对手存在弱项。因此，集中度风险很实质。公开点名的证据集中在少数印度中心的垂直场景——财富管理、支付和零售现场运营、旅游分销、研究，以及一个未具名
              medtech 客户；独立媒体又补充了一些具名客户，但没有披露收入权重。这意味着 Neysa 的伙伴计划和新的伙伴主导产品可能对多元化很重要，但当前公开证据还没有说明增长中有多少来自重复扩张，又有多少来自新
              logo 获取。
