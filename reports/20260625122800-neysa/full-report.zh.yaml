          - type: callout
            title: 债务加利用率风险，是下行传导通道
            body: 如果 GPU 交付和客户利用率爬坡慢于预期，推动规模的同一笔融资也可能成为股权价值压缩的原因。在 AI 云里，错误的容量曲线会同时伤害运营表现和倍数选择。
            calloutType: risk
