  - id: TP002
    title: 定价和采购对比
    columns:
      - 服务商
      - 已发布价格 / 定价模式
      - 商业形态
      - 透明度 / 额外收费信号
      - 对 Neysa 的含义
    rows:
      - - Neysa
        - 预留式全包费率；公开页面展示 SKU 库存，但没有简单的一行式价目表
        - 销售主导的预留访问，覆盖裸金属、VM 和托管 Kubernetes
        - 公司称一档费率覆盖算力、存储、出站流量、K8s、Jupyter、MLflow、W&B 和推理端点
        - 支撑企业买方的预算可预期性，但公开价格透明度低于 E2E 或 Yotta 的价目页
      - - Yotta
        - H100 AI Lab 工作站标价从 ₹27,000/month 到 ₹1,504,000/month；平台访问 ₹70,000/month
        - 月度工作站、VM、裸金属、集群和支持目录
        - 比只报价的企业云更透明，但平台访问是额外行项目
        - 适合已承诺投入的主权 AI 项目；Neysa 用一体化平台经济性反击
      - - E2E Networks
        - B200 每小时 ₹624；H200 每小时 ₹300；H100 每小时 ₹249；L4 每小时 ₹49
        - 小时、月度或年度套餐，自助采购
        - 在已审阅的印度导向竞争对手中，公开价目表最明确；税费和存储 / 服务另计
        - 是 Neysa 获取创业公司和开发者客户时的强基准，尤其当团队偏好按需付费时
      - - Tata Communications Vayu
        - 按需付费和承诺使用姿态；提供 H100/H200/L40S，但未公开价目表
        - 企业主导采购，绑定主权云和网络集成
        - 官方页面强调成本可预期、无意外出站流量费，但具体 GPU 标价仍在销售背后
        - 帮助 Tata 切入大客户，但公开横向基准比 E2E 或 Yotta 更难做
      - - AWS
        - 通过文档和计算器按区域、实例和承诺期定价
        - 按需付费、预留和企业合同
        - 已审阅页面描述实例系列和区域，而非简单的印度 AI 套餐价目表
        - 超大规模云厂商广度很强，但只想要印度托管 GPU 栈的团队会觉得采购相对复杂
      - - Azure
        - 跨区域和全球选项，按服务和协议定价
        - 企业协议和按需付费模式
        - 已审阅的数据驻留和 GPU 页面优先讲治理与能力，而不是简单公开 GPU 价目表
        - 最适合既有 Microsoft 体系，而不是想要简单主权 AI 套餐的买方
      - - Google Cloud
        - SKU 和区域定价表，加选择器工具
        - 全球定价模型绑定工作负载、区域和折扣
        - 工具层面透明，但没有包装成印度主权 AI 商业套餐
        - 适合做全球优化的买方；对印度专属采购叙事的适配较弱
      - - CoreWeave
        - 合同式企业定价；已审阅页面没有公开简单标价
        - AI 原生平台围绕性能和运营效率销售
        - 比起静态标价，更强调运营透明度
        - 是 AI 原生经济模型的重要基准，但今天在印度境内不是最直接的采购替代品
    notes: 保留来源中，只有 Yotta 和 E2E 提供容易复用的公开标价。Neysa、Tata 和超大规模云厂商要么描述定价理念、容量或工具，要么没有在已审阅页面给出干净的印度专属 GPU 横向价目表。
