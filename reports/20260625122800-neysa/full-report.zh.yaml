      - number: '7.3'
        title: 政策、安全与主权是护城河的一部分，但也带来更重的合规负担
        blocks:
          - type: paragraph
            body: >-
              Neysa 最强的差异化主张是，印度企业可以把敏感 AI 负载、prompt
              和推理流量留在印度境内，并获得比外国托管技术栈更强的运营控制。这个定位在商业上有用，但也意味着公司主动承担了更密集的合规面。隐私政策列出共享责任模型：Neysa
              负责基础设施安全，客户租户仍负责自己的数据隐私和访问控制。产品页面宣称具备 RBAC、加密、BYOK、审计日志、ISO/IEC 27001:2022 认证和 SOC2
              合规；监控岗位招聘则显示，事件管理、补丁、根因分析和 SLA 升级已经是实际运营职能，而不是未来愿景。外部义务也在上升。CERT-In 2026 年 6
              月指南明确覆盖云服务提供商，并要求严重漏洞立即披露、加速修复。DPDP Act 和 IndiaAI Mission
              又给数据处理、本地部署和公共部门就绪度增加了预期。这些都是有价值的需求顺风，但也提高了失败成本，因为安全事故或合规失误会最先打到受监管客户。
