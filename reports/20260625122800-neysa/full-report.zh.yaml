      - number: '8.4'
        title: 建议、触发因素与最终尽调
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，不是因为 Neysa 缺乏战略相关性，而是因为公开档案尚未证明当前价格可投。有足够证据相信公司在追逐真实机会：融资已经完成，capex 计划很大，创始人可信，政策和市场结构支持印度的主权
              AI-cloud 细分生态。但没有足够证据相信 $1.4B 是便宜价格。缺失模块恰恰是约束价格纪律的变量：当前 ARR 或 run-rate
              revenue、毛利率、已签约利用率、头部客户集中度、债务成本，以及多数 sponsor 轮是否包含会压低普通股上行的优先权保护。实际的上调路径很直接。如果私下尽调显示，收入或合同利用率能让 Neysa 落在约
              10x-15x 区间内，且结构不苛刻，评级可以转向 track 或 buy。如果条款强硬、利用率曲线偏弱，或 hyperscaler 定价在规模到来前侵蚀主权溢价，下行路径就是拉伸估值之后出现修正或稀释性
              recap。因此，本章的核心信息是价格敏感性：公司可能有吸引力，但公开证据尚未证明价格合理。
