chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局和产品模式
        blocks:
          - type: paragraph
            body: >-
              Neysa 把自己定位为 AI Acceleration Cloud 提供商，而不是应用层 AI 初创公司。公司公开材料称，业务是一层专为企业、初创公司、研究机构和公共部门组织打造的基础设施：客户想要本地 GPU
              容量、编排和安全能力，又不想把多个供应商拼在一起。法律实体记录显示公司可能在 2022 年 12 月注册，但公司和多数媒体一致把 2023 年视为运营创立年份，因此本报告采用这一最可辩护的公开简称。


              公司总部位于孟买，并公开列出孟买、班加罗尔和钦奈办公室。当前计算站点证据比办公室证据更窄：Sacra 明确提到孟买和 Bangalore 数据中心的预布线容量，公开报道则支持与 NTT Data 和
              Telangana 政府规划 Hyderabad 集群。因此，本章把孟买视为已确认总部，把班加罗尔和钦奈视为已确认办公室，把 Hyderabad 视为已宣布的规模化项目，而非已经投运的容量。


              产品层面，Velocis 是 Neysa 商业模式的核心操作系统。官方材料把它呈现为全栈环境，覆盖 GPU-as-a-Service、AI Platform-as-a-Service、推理端点、编排、可观测性和
              AI/ML 安全。定价和产品页显示，公司已经在销售多种 GPU 系列和部署模式；这很关键，因为 Neysa 卖的不只是原始芯片，也在卖控制权、本地驻留和可预测经济性。Moneycontrol 将 Neysa
              描述为印度本土 AWS/Azure 式替代方案，这与其定位方向一致，但 Neysa 的真实差异化比超大规模云厂商等价物更窄，也更偏基础设施。
