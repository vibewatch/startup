  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在熊、基准、牛三种情景下，用明确的利用率和倍数假设给出示意性估值区间。
    data:
      items:
        - label: 熊市情景
          low: 300
          mid: 500
          high: 700
        - label: 基准情景
          low: 900
          mid: 1300
          high: 1700
        - label: 牛市情景
          low: 1800
          mid: 2400
          high: 3000
    approximationNotes: 所有数值均为示意性股权价值，单位为百万美元。熊市情景假设利用率偏弱且倍数压缩；基准情景假设规模有意义但偏小众；牛市情景假设合约需求强劲，且软件附加销售跑通。
    claimRefs:
