  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与公开价格背景
        blocks:
          - type: paragraph
            body: >-
              Neysa 当前估值背景很容易写成标题，却很难承销。融资是真实的：官方与独立报道都指向一个 $1.2B 融资包，分为最高 $600M 股权和计划中额外 $600M 债务，Blackstone
              预计将成为多数股东。独立报道最常引用的标题估值约为 $1.4B，但公开记录把它描述为企业价值，并未披露优先权结构、债务定价或 covenant 包；这些才决定少数股权的真实经济价格。这个区别很重要。由
              sponsor 主导的多数轮叠加债务层，可以改善 GPU 采购、电力获取和客户引介，但也可能嵌入下行保护，让普通股价值没有标题数字看起来那么慷慨。公开运营披露也很薄。Neysa 约有 1,200 块 GPU
              已上线，希望扩至超过 20,000 块，员工约 110 人，并称明年收入应增长三倍以上；但公司没有公开披露收入基数、毛利率、利用率或客户集中度，无法证明当前价格是保守的，还是已经计入未来。
