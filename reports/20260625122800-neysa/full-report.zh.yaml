      - number: '1.3'
        title: 融资历史、估值和规模信号
        blocks:
          - type: paragraph
            body: >-
              Neysa 的资本故事推进得异常快。公司在 2024 年初完成 $20 million 种子轮，2024 年 10 月完成 $30 million Series A，随后在 2026 年 2 月宣布
              Blackstone 领投交易，组合为最高 $600 million 股权融资，并计划再取得 $600 million 债务融资。公开数据库和新闻来源大体收敛到 2026 年 2 月轮次估值约 $1.4
              billion，但各来源对 post-money 和 enterprise value 的口径并不总是一致。


              投资人名单很关键，因为它混合了传统风险资本、战略基础设施可信度和后期资本。种子轮和 Series A 投资方包括 Z47、Nexus Venture Partners 和 NTTVC，Tracxn 还列出
              Blume Ventures 和 Anchorage 等投资方。2026 年 2 月融资加入 Blackstone、Teachers’ Venture Growth、TVS Capital 和 360
              ONE，公开报道称 Blackstone 获得多数股权。股权结构的演进说明，Neysa 在不到三年内从风险资本支持的产品成型，走向基础设施规模融资。


              规模指标方向上强劲，但还没有完全对齐。官方和独立报道都认同 20,000+ GPU 扩张计划，但当前现网 GPU 数量存在差异：TechCrunch 报道约 1,200 张 GPU，SiliconANGLE
              报道约 2,000 张。员工数也类似，TechCrunch 称 2026 年 2 月有 110 名员工，Tracxn 到 2026 年 5 月列出 122
              名。这些差异并非致命，但足以说明后续章节不应在未经管理层确认的情况下传播单一精确规模数字。
