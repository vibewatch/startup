      - number: '2.3'
        title: 买家、主权动态和采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的预算归属很分散。政府需求来自 IndiaAI 本身、行业部委、公共机构和州级项目，它们需要补贴算力、模型开发和公益 AI
              应用。银行、医疗和公共服务等受监管企业越来越重视本地数据托管、可审计性，以及把敏感模型训练工作流留在印度境内的能力。GCC 和 AI 原生初创公司构成第三类买家：它们未必拥有超大规模预算，但往往是专用 GPU
              容量、推理端点和部署支持最快的采用者。超大规模云厂商和全球 AI
              实验室在需要国内推理容量、溢出集群或主权就绪足迹时，也可能成为客户或渠道伙伴。因此，采用路径不是简单的“买家到云区域”；它常常从政策或合规触发开始，走向本地托管要求，再进入公共主权计算，或进入能提供专用 GPU
              加动手集成的新型云运营商。Microsoft 明确向印度组织营销主权公有云和主权私有云产品，Neysa 和 Yotta
              则主打印度优先的性能、合规和低摩擦部署。这一动态解释了为什么市场能同时容纳超大规模云厂商和本地专门厂商，而不是赢家通吃。
