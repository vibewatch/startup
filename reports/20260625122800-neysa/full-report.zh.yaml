      - number: '4.3'
        title: 资本结构、资本开支强度和债务含义
        blocks:
          - type: paragraph
            body: >-
              Neysa 的 2026 年融资方案是最清晰的公开信号：这首先是一家基础设施公司，其次才是一家软件公司。已宣布结构为最高 $600 million 股权加拟议 $600 million
              债务，相对于公司年龄和此前融资基础都很大，并且明确绑定到扩张至超过 20,000 张
              GPU。即便没有管理层对精确资本开支的指引，一个简单启发式也能显示下一阶段多么吃资本。如果最终只有计划债务用于硬件建设，这个资本池已意味着每张目标 GPU 约
              $30,000；如果全套资金都投入建设，在计入数据中心改造、网络、软件或营运资本之前，总资金池升至每张目标 GPU 约 $60,000。这就是债务结构与标题估值同样重要的原因。


              公开层面，债务是故事中最不透明的部分。NewsBytes 称，印度 GPU 抵押贷款可按 GPU 价值融资 40% 到 70%，利率最高
              14%；只有当贷款人相信利用率和合同期限会保持高位时，这才可行。外部负面研究进一步凸显风险。Compute Forecast 认为，短缺时期的 GPU 债务往往按已经压缩的租赁假设承销；CNBC
              则强调，当贷款人围绕较短寿命计算资产为长期设施融资时，会产生“GPU debt treadmill”。CoreWeave 的文件显示，即使对规模化运营商，债务堆栈也可能变得很大。Neysa
              最终可能比风险叙事更保守，但在披露期限、抵押品和合同收入覆盖之前，投资人承保的是一场带有部分隐藏债务工具的主权 AI 扩张。
