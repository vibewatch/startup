      - number: '4.2'
        title: 单位经济性代理和服务交付成本逻辑
        blocks:
          - type: paragraph
            body: >-
              Neysa 不公布毛利率、贡献利润率、获客成本或回本期。因此，最好的公开解读来自客户验证，以及硬件供给所暗示的成本架构。TIFIN、Innoviti 和 ITQ 三个客户案例都用同一种语言描述 Neysa
              的价值：比超大规模云厂商或通用云支出更低、延迟更好，并为受监管或高容量工作负载提供更强控制。节省幅度从 40% 到 65%，运营指标包括 99.95% uptime、低于 2 秒的 P99 延迟、每秒 2,500
              tokens、低于 30 秒的处理循环，以及快速生产部署。这些不是经审计财务指标，但确实表明 Neysa 正在赢得一些工作负载；在这些场景里，专用或预留基础设施比按 token 计价的 API
              使用更能摊销固定成本。


              但前提是占用率必须保持高位。Neysa 的价格表间接暴露了成本基础：H100 和 H200 集群、重 NVMe 节点、高带宽互连，以及支持密集的托管环境。CoreWeave 的 S-1
              提供了一个有用的公开可比，解释这套经济逻辑。它显示，即使规模化的新型云，如果利用率、集中度或融资假设落空，也可能在增长中亏钱；文件还明确称，由于系统低效，现实世界 AI 基础设施往往只能交付理论峰值输出的 35%
              到 45%。对 Neysa 来说，含义很直接：预留集群、私有部署和长期受监管工作负载不是可有可无的追加销售，而是把快速折旧硬件转化为可行利润率路径的经济机制。
