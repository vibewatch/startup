  - id: TP004
    title: 护城河耐久性和竞争风险登记表
    columns:
      - 护城河主张 / 威胁
      - 受益方
      - 严重性
      - 证据支持的理由
      - 对 Neysa 的含义
    rows:
      - - 一体化 AI 栈加安全是真实切入口
        - Neysa
        - 中
        - Neysa 是已审阅本土服务商中唯一公开把算力、MLOps 和 AI 安全作为一份合同来销售的公司
        - 如果买家更看重少用供应商、部署能满足监管，而不是只追最低裸 GPU 价格，这一路径就站得住
      - - 主权 GPU 裸供给越来越商品化
        - Yotta、E2E、Tata、IndiaAI 云服务商
        - 高
        - IndiaAI 扩容叠加 Yotta 和 E2E 规模化建设，扩大了印度本土算力供给
        - Neysa 不能只靠「印度托管 GPU」构筑护城河
      - - 自助式小时计价把初创公司拉向 E2E
        - E2E Networks
        - 高
        - 在已审阅的印度本土厂商中，E2E 的公开小时价目表最清晰
        - Neysa 或许能赢下企业打包方案，但如果不简化入门计价，开发者主导的份额会流失
      - - 企业采购和连接能力偏向 Tata
        - Tata Communications
        - 高
        - Tata 把主权云、GPU 云和网络集成一起卖进受监管客户
        - Neysa 必须证明，产品集成的价值能压过 Tata 的客户控制力和信任资产
      - - 超大规模云厂商的生态锁定仍然很强
        - AWS / Azure / GCP
        - 高
        - 更广的云合同、平台工具和相邻服务，抬高了既有客户的迁出成本
        - Neysa 需要讲清迁移路径，而不只是把 GPU 账单压低
      - - Azure 地理例外削弱了部分 AI 工作负载的「纯主权」叙事
        - 印度本土主权厂商
        - 中
        - Azure 文档列出若干情形：元数据或模型处理可能发生在所选地理区域之外
        - 在受监管用例里，这给 Neysa、Tata、Yotta 和 E2E 打开了切入点
      - - IndiaAI 补贴渠道扩大了竞争对手的分发面
        - Yotta、E2E、NxtGen、Tata、Jio 等
        - 高
        - 官方分配和分轮入围机制，在纯直销之外创造了需求流
        - 即使 Neysa 产品很强，渠道入口也能加速竞争对手被采用
