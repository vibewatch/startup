      - number: '1.2'
        title: 创始人、领导层和治理覆盖
        blocks:
          - type: paragraph
            body: >-
              公开创始团队很清晰：Sharad Sanghi 是联合创始人兼 CEO，Anindya Das 是联合创始人兼 CTO。对于印度基础设施初创公司，两人的创始人—市场匹配度异常强，因为二人都来自 Netmagic
              和 NTT 生态，而该生态曾帮助定义印度数据中心和托管云容量。公司、投资人和媒体材料在解释为什么 Neysa 值得被托付资本密集型主权计算建设时，都大量依赖这段过往运营履历。


              治理披露比创始人披露更薄。首页和 VCCircle 材料确认硅谷老将 BV Jagadeesh 担任董事长，Neysa 又在 2026 年 6 月宣布前 Wipro 和 YES Bank CIO Anup
              Purohit 担任战略顾问。这证明公司有外部指导，但没有给出完整董事会地图或 Blackstone 交易后的控制框架。Tracxn 的公开董事会片段过于不完整，不能作为治理记录依赖；本章也未能核实
              Blackstone 取得多数控制权后，委员会构成、保留事项或少数股东保护条款。


              尽调含义是，Neysa 看起来仍由创始人主导，并拥有可信的外部背书，但关键人物依赖也很明显。Sanghi 是资本形成、基础设施关系和对外叙事的中心；Das
              则支撑技术可信度。这一阶段这可以是优势，但也意味着后期投资人应要求明确的治理文件，然后再假设交易后的控制环境已完全制度化。
