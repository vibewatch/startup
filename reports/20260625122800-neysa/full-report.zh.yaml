      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 继续研究，直到公开叙事变成经济证据
            body: Neysa 可能在战略上有吸引力，但公开档案仍更像一次标题融资事件，而不是一个已充分承销的估值案例。正确姿态是把它留在尽调管线里，而不是仅凭 Blackstone 标记推断安全边际。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV015
              - CV016
              - CV048
          - type: callout
            title: 关键估值变量是隐藏的，不是不可知的
            body: 本章并不因为公开收入缺失就假设 Neysa 被高估；本章假设，在收入、利用率和资本结构条款通过私下或公开渠道披露前，不能说这个价格有吸引力。
            calloutType: assumption
            claimRefs:
              - CV037
