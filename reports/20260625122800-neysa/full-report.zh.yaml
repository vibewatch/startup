  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 资本强度跑在利用率前面
        - 上线 GPU 部署、预留用量采用或付费客户增长落后于基础设施承诺
        - 集群增长与已签约 / 已预留消耗之间出现任何跨季度缺口
        - 下调估值预期，重新承销现金 runway，并在增加敞口前要求更新债务和占用率数据
      - - GPU 供应集中
        - 管理层披露交付滑坡或延长时间线，同时维持 capex 承诺
        - 以 Nvidia 为主的采购出现实质延迟，且没有芯片多元化抵消
        - 假设收入爬坡更慢，获客摩擦更高
      - - 电力和站点准备度承压
        - MW 扩张、冷却或 RTC 电力安排落后于 AI 机架密度要求
        - 站点启用延迟，或出现本地电网 / 冷却约束证据
        - 降低对正常运行时间声明的信心，并增加电力采购尽调
      - - 安全 / 合规失败
        - 关键 CERT-In 类问题、重大客户事件，或公开泄露 / 合规争议
        - 任何严重事件如果没有快速客户沟通和有记录的补救
        - 在控制证据改善前，将其视为受监管工作负载采用的投资逻辑破裂点
      - - 客户集中 / 证据缺口
        - 收入增长快于披露节奏，但公开证据仍局限于少数灯塔 logo
        - 下一轮刷新周期内，具名生产部署或背书质量没有拓宽
        - 对利用率和留存假设施加集中度折价
      - - 政策或 IndiaAI 依赖
        - 政策支持需求走弱，或竞争对手拿走可见补贴工作负载
        - IndiaAI 相关上线实质减少，或战略入围资格相关性下降
        - 将 thesis 重构为纯商业需求，并降低终局倍数假设
    notes: 这些终止标准把公开证据转成可观察阈值；它们不是预测，而是界定资本、利用率或控制假设何时应被视为失效。
