  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和市场结构
        blocks:
          - type: paragraph
            body: >-
              Neysa 并不争夺印度全部云支出。它的相关市场包括 GPU-as-a-service、AI 训练和推理集群、AI 平台基础设施、主权 /
              公共计算池，以及在印度运行这些工作负载所需的托管、供电、制冷和编排层。它不包括通用 SaaS、横向企业软件、标准 CPU 云，以及大多数与高密度计算无关的非 AI
              数据中心建设。这个边界很重要，因为广义公有云或数据中心总量会夸大 Neysa 的真实机会，除非它们被收窄到重视本地 GPU、数据驻留、性能调优或专属支持的工作负载。印度当前形成三层市场结构：IndiaAI
              主导的公共主权计算层；Microsoft、AWS、Google 和 Oracle 等全球超大规模云厂商，销售区域云足迹加主权就绪控制；以及 Neysa、Yotta 等本地新型云 / 数据中心运营商，打包专用
              GPU、国内托管和印度特定服务水平。战略替代模式也很清楚：买家可以留在通用超大规模云厂商上，自建私有集群，或使用承诺更低延迟、更强驻留姿态和更可预测 GPU 经济性的印度 AI 云。
