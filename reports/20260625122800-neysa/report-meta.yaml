companyProfile:
  summary: Neysa is a Mumbai-headquartered AI acceleration cloud company founded in 2023 by Sharad Sanghi and Anindya Das. The company positions Velocis as a sovereign Indian AI cloud stack that combines GPU infrastructure, orchestration, observability, inference, and AI security for regulated enterprises, startups, research users, and public-sector workloads. Public evidence shows real customer proof and a major February 2026 Blackstone-led financing, but the operating record behind the valuation remains opaque because revenue, margins, utilization, and debt terms are not publicly disclosed.
  foundedDate: '2023-01-01'
  founders:
    - name: Sharad Sanghi
      role: Co-founder & CEO
      background: Former Netmagic founder and data-center operator whose prior company was sold to NTT, giving him direct credibility in Indian infrastructure buildouts.
      claimRefs: [CO010, CV011]
    - name: Anindya Das
      role: Co-founder & CTO
      background: Former Netmagic/NTT infrastructure executive and long-time collaborator of Sanghi on cloud and data-center operations.
      claimRefs: [CO011, CO013]
  foundingLocation: Mumbai, India
  headquarters: Mumbai, India
  productSummary: Sovereign AI cloud infrastructure sold as GPU-as-a-Service, AI Platform-as-a-Service, and inference services through the Velocis stack, with managed deployment options spanning VMs, bare metal, Kubernetes, observability, and AI security.
  customerFocus: Indian financial services, technology, healthcare, public-sector, research, and AI-native startup workloads that need local data handling, lower-latency GPU access, or managed AI infrastructure.
  businessModel: Consumption and committed-capacity monetization for GPU compute, plus higher-layer platform, inference, observability, and managed AI services delivered on India-hosted infrastructure.
  stage: late-stage private
  fundingStatus: $20M seed, $30M Series A, and a February 2026 package of up to $600M equity plus planned $600M debt; independent trackers describe about $650M of equity disclosed to date excluding the intended debt tranche.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO005, CO006, CO007, CO009, CO010, CO011, CO019, CO020, CO021, CI007]
summary:
  headline: Neysa has a credible sovereign-AI infrastructure wedge and sponsor-backed scale capital, but the current ~$1.4B price is not yet supported by public evidence on revenue quality, utilization, margins, or debt structure.
