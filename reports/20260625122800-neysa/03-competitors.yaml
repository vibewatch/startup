- id: TP004
  title: Moat durability and competitive-risk register
  columns:
  - Moat claim / threat
  - Who benefits
  - Severity
  - Evidence-backed rationale
  - Implication for Neysa
  rows:
  - - Integrated AI stack plus security is a real wedge
    - Neysa
    - Medium
    - Neysa is the only reviewed domestic provider publicly pitching compute, MLOps, and AI security together as one contract
    - Defensible if buyers value fewer vendors and regulated deployment support more than the cheapest raw GPU
  - - Raw sovereign GPU supply is increasingly commoditized
    - Yotta, E2E, Tata, IndiaAI CSPs
    - High
    - IndiaAI expansion plus Yotta and E2E scale build-out broaden domestic compute access
    - Neysa cannot rely on “India-hosted GPUs” alone as its moat
  - - Self-service hourly pricing pulls startups toward E2E
    - E2E Networks
    - High
    - E2E publishes the cleanest public hourly price card in the reviewed domestic set
    - Neysa may win enterprise bundles but lose developer-led share unless it simplifies entry pricing
  - - Enterprise procurement and connectivity favor Tata
    - Tata Communications
    - High
    - Tata sells sovereign cloud, GPU cloud, and network integration together into regulated accounts
    - Neysa must prove that product integration outweighs Tata’s account control and trust
  - - Hyperscaler ecosystem lock-in remains powerful
    - AWS / Azure / GCP
    - High
    - Broader cloud contracts, platform tooling, and adjacent services raise exit cost for existing customers
    - Neysa needs a migration story, not just lower GPU bills
  - - Azure geo exceptions weaken “pure sovereignty” for some AI workloads
    - Domestic sovereign vendors
    - Medium
    - Azure documents cases where metadata or model processing can occur outside the selected geo
    - Creates a wedge for Neysa, Tata, Yotta, and E2E in regulated use cases
  - - IndiaAI subsidy channels broaden rival distribution
    - Yotta, E2E, NxtGen, Tata, Jio, others
    - High
    - Official allocations and round-based empanelment create demand flow outside pure direct sales
    - Channel access can accelerate rival adoption even when Neysa’s product is strong
  - - Global AI-native clouds set performance expectations
    - CoreWeave and global analogs
    - Medium
    - CoreWeave defines the AI-native benchmark on orchestration, goodput, and operating model
    - Neysa must keep product architecture competitive even when India-specific GTM protects it locally
  notes: Severity is an analytical judgment. “High” means the threat can materially change buyer selection or go-to-market efficiency even if Neysa’s core technology is sound.
