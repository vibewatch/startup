- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / proof point
  - Pricing / packaging
  - Best-fit buyer
  - Strategic limitation vs. Neysa
  enumerationScope:
    coverage: partial
    basis: Covers the main India-relevant sovereign AI cloud, hyperscaler, and AI-native analog options with public evidence reviewed on 2026-06-25; excludes smaller local resellers and providers with only thin public disclosure.
  rows:
  - - Neysa
    - Domestic sovereign AI cloud
    - Official pricing page exposed inventories including 392 H100 SXM and 200 H200 SXM plus L40S, L4, and MI300
    - Sales-led reserved packaging; company says pricing is all-inclusive across compute, storage, egress, K8s, notebooks, MLOps, and inference
    - Regulated enterprises, production AI teams, open-weight model builders
    - Raw estate appears smaller than Yotta and hyperscalers; official comparison says hosted proprietary-model APIs are not the focus
  - - Yotta Shakti Cloud
    - Domestic sovereign AI cloud
    - Official site says 8,000+ H100 GPUs, NVIDIA Cloud Partner status, and India-hosted sovereign cloud
    - Monthly workstation and cluster pricing published; platform access sold separately
    - Government, public-sector, enterprise, and large sovereign AI training workloads
    - Thinner public evidence on integrated MLOps and AI-specific security than Neysa; some commercial layers appear separate
  - - E2E Networks
    - GPU-first Indian cloud
    - MeitY-empanelled GPU cloud with public B200/H200/H100/L4 pricing and IndiaAI order execution
    - Hourly, monthly, and annual list pricing with self-service positioning
    - Startups, researchers, burst workloads, cost-sensitive AI teams
    - Less evidence of bundled security, observability, or full-stack enterprise controls
  - - Tata Communications Vayu
    - Enterprise sovereign AI cloud
    - India-resident sovereign-cloud posture plus GPU cloud, connectivity, and enterprise account coverage
    - Quote-led GPU packaging with pay-as-you-go claims and no surprise egress fees
    - Large enterprises, government, regulated sectors, existing Tata account base
    - Less public pricing transparency than E2E or Yotta and less public evidence of product-led self-service
  - - AWS
    - Hyperscaler
    - India regions and local zones; P5 H100 and P5e/P5en H200 families
    - Calculator and contract driven rather than India-specific sovereign AI bundles
    - Enterprises already standardized on AWS services
    - Broad ecosystem strength but weaker India-first sovereign packaging
  - - Azure
    - Hyperscaler
    - ND-series GPUs plus deep Microsoft enterprise estate
    - Pay-as-you-go / enterprise agreement style procurement
    - Microsoft-centric enterprises and hybrid-cloud buyers
    - Data-residency model has service-specific exceptions that are less clean than domestic “all in India” marketing
  - - Google Cloud
    - Hyperscaler
    - 43 regions and 130 zones globally with AI-focused infrastructure and region-based pricing tools
    - Global SKU/region price list rather than sovereign AI bundle
    - Buyers wanting Google AI ecosystem, global routing, and price-performance tooling
    - Less evidence of India-sovereign packaging or simplified regulated-sector procurement
  - - Sify CloudInfinit+AI
    - Domestic adjacent enterprise provider
    - GPUaaS launch on India data-center footprint and enterprise ICT base
    - Pay-as-you-go GPUaaS positioned for training, inference, analytics, rendering, and simulation
    - Existing Sify enterprise customers adding GPU capacity
    - Public evidence is thinner on integrated MLOps/security depth and detailed list pricing
  - - CoreWeave
    - Global AI-native neo-cloud analog
    - Purpose-built AI cloud plus SEC-filed AI-infrastructure posture
    - Enterprise / contract style AI-native cloud economics
    - Frontier-model labs and global AI-native teams
    - No reviewed evidence of India-sovereign hosting, IndiaAI channel access, or local public-sector posture
  notes: Rows mix official vendor disclosures, technical documentation, government sources, filings, and news. “Strategic limitation” is an analytical synthesis rather than a direct quote, and should be read as the relative gap versus Neysa’s public positioning.
