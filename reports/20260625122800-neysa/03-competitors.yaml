    whyItMatters: The current evidence is sufficient to treat CoreWeave as an analog rather than a direct India-sovereign competitor, but not enough to rule out future local entry or partner-led presence.
    diligencePath: Search CoreWeave region maps, partner announcements, or customer-location documentation for APAC and India-specific infrastructure statements.
