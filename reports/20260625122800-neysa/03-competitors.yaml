  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hyperscaler-india-gpu-pricing
    missingEvidence: Static public India-region H100/H200 list prices from AWS, Azure, and Google in directly comparable format.
    whyItMatters: Without clean official side-by-side India price cards, the chapter can compare commercial transparency but cannot make a high-confidence apples-to-apples rate claim against domestic providers.
    diligencePath: Pull calculator screenshots or written quotes from AWS, Azure, and Google sales for equivalent India-region H100/H200 configurations on the same day.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP002
  - type: enumeration-incomplete
    severity: material
    topic: indiaai-long-tail-providers
    missingEvidence: Detailed public pricing and capacity disclosures for CtrlS, NxtGen, Jio, and other IndiaAI empanelled providers beyond headline program mentions.
    whyItMatters: The competitive set is broader than the deeply profiled names here, and insufficient disclosure makes it harder to judge whether Neysa faces pricing pressure from a wider subsidized field.
    diligencePath: Collect provider-specific IndiaAI tender documents, public product pages, or customer allocation examples for each CSP named by IndiaAI and Fortune India.
    relatedQuestionRefs:
    - QP003
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: minor
    topic: neysa-commercial-rate-card-headers
    missingEvidence: Public explanation of Neysa’s SKU-pricing column labels, term structure, and whether displayed rates are hourly, reserved, or multi-term tiers for each configuration.
    whyItMatters: The pricing page is clearly rich in capacity data, but its extracted layout is not clean enough to support precise comparative rate claims for every GPU family without risking misread labels.
    diligencePath: Request Neysa sales collateral or a PDF rate card that names each column and term explicitly, then reconcile it with the web page inventory view.
    relatedQuestionRefs:
    - QP005
    - QP023
    relatedTableRefs:
