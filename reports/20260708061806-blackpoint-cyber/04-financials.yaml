  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: core-financial-metrics
    missingEvidence: ARR, revenue growth, gross margin, NRR, burn, runway, and cash-on-hand remain undisclosed.
    whyItMatters: Without these metrics, a late-stage underwriting model cannot be completed from public evidence alone.
    diligencePath: Request current board deck or finance pack with revenue bridge, margin split, retention, and cash runway.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI015
    - QI018
    - QI019
    - QI025
  - type: pricing-opaque
    severity: material
    topic: realized-pricing
    missingEvidence: Partner list pricing, discount schedules, bundle terms, and realized net price by module.
    whyItMatters: Pricing opacity prevents clean ACV, payback, and gross-margin analysis.
    diligencePath: Request partner price cards, recent quote examples, and realized discount bands by product.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI024
    relatedTableRefs:
    - TI002
  - type: review-mixed-signal
    severity: minor
    topic: retention-risk
    missingEvidence: Neutral cohort retention and support metrics to contextualize review-site complaints or praise.
    whyItMatters: Adverse review snippets may reflect isolated cases or real service-friction patterns; public evidence cannot tell which.
    diligencePath: Request churn reasons, NPS / CSAT trends, and support escalation metrics.
