- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Remaining Diligence Blockers
  body: |-
    From a financial-diligence perspective, Blackpoint looks more advanced than many private security startups but less underwritable than a public comp. The company appears to have a durable recurring-service model, credible institutional backing, and a platform-broadening strategy that could support higher revenue per partner over time. Those are meaningful positives. However, almost every metric that would convert this story into an underwriting model remains private: revenue, ARR, module mix, realized pricing, gross margin, retention, burn, runway, and cash conversion. Public review sources also reinforce that pricing transparency is limited and that operational quality still matters to retention, which means even basic revenue-quality questions require direct management evidence.

    The correct financial conclusion is therefore neither bearish nor complacent. Blackpoint is not a financing-question-mark company based on public evidence; it is a disclosure-question-mark company. The next step is not more storytelling about the size of the round. It is a disciplined request list: pricing cards, partner economics, churn and NRR by cohort, gross margin by product family, services-versus-software mix, and a current cash runway view. Without those materials, investors can only validate the broad shape of the model, not its actual efficiency.
  claimRefs:
  - CI013
