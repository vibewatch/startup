- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Why it matters
  - Public warning sign
  - Diligence test
  rows:
  - - ARR materially below premium bands
    - Would make any low-billion valuation too full.
    - No public ARR disclosure.
    - Request current ARR and growth bridge by module.
  - - Gross margin more services-like than software-like
    - Would shift the company toward lower MDR and services multiples.
    - No public gross-margin disclosure.
    - Request GAAP gross margin and services mix by product line.
  - - Weak net retention or poor module attach
    - Would imply the MSP base is less monetizable than the platform story suggests.
    - No public NRR or attach-rate disclosure.
    - Review cohort retention, attach, and expansion by partner vintage.
  - - Microsoft or bundled-platform pressure rising
    - Would compress willingness to pay for stand-alone MDR.
    - Public comps already show huge spread between premium and compressed assets.
    - Inspect win-loss, Microsoft overlap, and renewal pressure data.
  - - Round terms doing the valuation work
    - Could mean the headline price overstates economic quality.
    - No public disclosure of preferences or secondary mix.
    - Review term sheet, liquidation stack, and any participating preference features.
  - - Concentration in a few MSPs or end customers
    - Would weaken resilience and warrant a discount.
    - Public customer concentration is undisclosed.
    - Request top-partner, top-tenant, and end-customer concentration data.
  notes: These are the few variables that can most quickly move Blackpoint from a compelling strategic asset to an overreached financing story.
