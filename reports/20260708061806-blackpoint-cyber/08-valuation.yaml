- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Ask
  - Why it is required
  - Public status
  rows:
  - - Current ARR and historical growth by module
    - Needed to map Blackpoint onto a real comp band rather than a narrative band.
    - Not public
  - - Gross margin and services-versus-software mix
    - Needed to know whether MDR economics deserve a software or services multiple.
    - Not public
  - - NRR, gross retention, and churn by partner cohort
    - Needed to test whether the MSP channel creates stickier economics than public peers.
    - Not public
  - - Partner and end-customer concentration
    - Needed to size downside risk and discount rate.
    - Not public
  - - Module attach, pricing, and ACV / ARPU by cohort
    - Needed to assess whether CompassOne and adjacent products expand value per partner.
    - Not public
  - - Last round valuation, liquidation preferences, and any secondary component
    - Needed to judge whether the headline round economics were investor-friendly or investor-protected.
    - Not public
  notes: Every row is a gating item for real underwriting; without them, valuation remains scenario work rather than an investment-grade entry memo.
