  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: A dated board package or term sheet showing the actual post-money valuation, dilution, preference stack, and any secondary component of Blackpoint’s last major financing.
    whyItMatters: Without a real price and term structure, public comp work cannot tell investors whether Blackpoint was financed conservatively or aggressively.
    diligencePath: Request the most recent financing documents, cap table, and board-approved valuation materials in the data room.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Current ARR, historical growth, gross margin, NRR, gross retention, and module attach by partner or customer cohort.
    whyItMatters: These are the variables that determine whether Blackpoint belongs near Huntress-style private marks, broad cyber medians, or lower services-oriented ranges.
    diligencePath: Request the operating KPI deck, cohort-retention tables, gross-margin bridge, and product-attach analysis used for management reporting.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Partner concentration, end-customer concentration, and exposure to Microsoft-overlap displacement by account segment.
    whyItMatters: A concentrated or highly overlapped revenue base would justify a discount even if top-line growth appears strong.
    diligencePath: Request top-10 partner concentration, top-20 end-customer concentration, and recent win-loss analysis against Microsoft, Huntress, and Arctic Wolf.
    relatedQuestionRefs:
    - QV028
    - QV029
    relatedTableRefs:
    - TV003
