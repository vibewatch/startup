      - number: '7.2'
        title: Operational, Quality, and Security-Service Risk
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s operating model makes service quality a core risk variable. The company sells active
              response, 24/7 SOC coverage, and threat-hunting expertise alongside software. That can be a competitive
              advantage, but it also means failures in hiring, analyst quality, workflow discipline, or support
              execution can hit customer value directly. Review sources already provide at least some adverse signal
              that service friction matters. CISA and NIST sources also show why the environment is unforgiving:
              attackers increasingly abuse legitimate remote-management tools, identities, and remote-access surfaces,
              which can raise the burden on context-rich investigation and quick judgment.


              The result is a classic scaling risk. If demand grows faster than Blackpoint’s ability to maintain analyst
              quality and process consistency, the company could see degraded customer experience, higher churn, or
              partner dissatisfaction even while headline growth looks healthy. Public sources are good enough to
              identify this risk, but not to quantify current control quality or error rates.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR016
              - CR026
              - CR032
