  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Managed detection and response should be understood as a service category, not merely as a product feature
              set. Retained analyst sources define the market around continuous monitoring, threat detection,
              investigation, and active response delivered by external experts or managed platforms. In practical terms,
              MDR is what closes the gap between owning security tooling and actually operating a 24/7 response
              function. That distinction is especially important for MSPs and mid-market buyers, because many
              organizations can afford licenses for endpoint or logging tools long before they can afford a mature
              internal SOC.


              The size of the broader managed-services universe is enormous relative to the specific MDR slice. Omdia
              says managed services reach $595 billion globally in 2025, while MarketsandMarkets sizes the
              managed-services market at $460.59 billion in 2026 and $705.22 billion by 2031. Within that much larger
              universe, MarketsandMarkets projects MDR at $6.22 billion in 2026 and $17.64 billion by 2031. The spread
              between TAM and MDR is precisely why Blackpoint’s pitch matters: it is not trying to own all managed
              services, only the security-critical layer where talent scarcity, regulatory pressure, and threat
              intensity make outsourced response economically compelling. Public data, however, does not support a
              precise SAM or SOM for Blackpoint itself because customer count, partner count, endpoint count, and
              revenue remain undisclosed.
