      - number: '4.2'
        title: Cost Structure and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s public record suggests a capital-light but people-intensive security-services business. There
              is no sign of manufacturing, hardware inventory, or project-finance exposure; instead, the visible
              operating engine is human SOC coverage, threat hunting, response authority, cloud-delivered telemetry,
              engineering for product modules, and partner enablement. That mix usually produces a margin profile that
              is different from pure software endpoint vendors. The recurring revenue may resemble SaaS in cadence, but
              delivery still depends on analysts, remediators, support, onboarding, and infrastructure. The
              Denver-office announcement showing more than 200 employees is therefore economically meaningful even
              without direct payroll disclosure: it signals enough operating scale that labor efficiency and platform
              leverage matter materially.


              Customer stories also provide rough ROI proxies. R3 explicitly framed the choice as building an internal
              24/7 SOC or partnering with Blackpoint, and described Blackpoint as equivalent to several full-time SOC
              analysts. Interlaced described a scaled opt-out adoption motion, which suggests Blackpoint’s economics
              improve when MSPs can standardize rather than customize every sale. These are vendor-chosen proof points,
              so they should not be over-weighted, but they do at least show the economic narrative management is
              selling: partner leverage plus outsourced labor substitution. Public evidence still cannot compute CAC,
              payback, gross margin, or retention, so unit-economics analysis remains largely inferential.
