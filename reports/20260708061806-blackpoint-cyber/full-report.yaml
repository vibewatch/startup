  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation Facts and Why Opacity Matters
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation facts in the public record are the financing event and the missing fields around
              it. Bain Capital, Blackpoint, William Blair, and PR Newswire all support the same hard fact pattern:
              Blackpoint raised $190 million in June 2023 from Bain Capital Tech Opportunities and Accel, and the money
              was explicitly framed as capital to keep building product and MSP-partner support. SecurityWeek added an
              important but still incomplete second datapoint by saying the round brought total capital to just over
              $200 million. That is enough to treat Blackpoint as a meaningfully financed growth company rather than a
              lightly funded channel boutique.


              What outsiders still cannot observe is the part that matters most for valuation discipline: the price.
              None of the retained primary sources discloses a post-money valuation, and none provides the cap-table
              context, secondary mix, liquidation preferences, or dilution mechanics that would tell an investor whether
              the round was conservative, strategic, or aggressive. Bain’s 2025 portfolio snapshot confirms that
              Blackpoint still sits inside the sponsor’s portfolio, and the 2025 CEO transition points to a company
              still thinking about expansion and acquisitions rather than harvesting cash. But those are stage signals,
              not underwriting inputs. Public evidence therefore supports the existence of a serious late-stage
              financing event, while leaving the actual entry price unresolved.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV045
          - type: table
