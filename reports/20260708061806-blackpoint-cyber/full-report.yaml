chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and MSP-First Operating Model
        blocks:
          - type: paragraph
            body: >-
              Blackpoint Cyber’s public materials consistently position the company as an MSP-first cybersecurity vendor
              built around managed detection and response rather than as a traditional direct-enterprise MSSP. The
              homepage, partner page, and 2023 funding announcement all stress the same core proposition: Blackpoint’s
              24/7 Security Operations Center acts on behalf of MSP partners and their downstream customers rather than
              simply forwarding alerts. That distinction matters because the company’s go-to-market motion, product
              decisions, and customer proof all sit inside the managed-service-provider ecosystem.


              By mid-2026, Blackpoint’s product scope is clearly broader than pure MDR. Official pages show CompassOne,
              LogIC SIEM, ITDR, cloud posture, vulnerability management, asset inventory, application control, and
              tenant administration under a single platform umbrella. The strategic message is that Blackpoint wants to
              consolidate fragmented security tooling for MSPs while preserving the human-led SOC layer that made its
              MDR brand credible. Customer proof sources reinforce that the appeal is not only better detection, but
              lower false-positive burden, faster response, and a partner that will take action when in-house teams are
              offline. This combination of channel-first delivery and growing platform breadth is the company’s defining
              identity as of the run date.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO025
