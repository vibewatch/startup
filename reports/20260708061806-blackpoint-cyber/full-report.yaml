      - number: '1.3'
        title: Capital Formation, Investor Base, and Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              The clearest financing fact in the public record is the June 2023 growth round: Blackpoint raised $190
              million from Bain Capital Tech Opportunities and Accel, with existing investors Adelphi Capital Partners,
              Telecom Ventures, Pelican Ventures, and WP Global Partners still associated with the cap table.
              Independent press reports say the transaction brought total capital raised to just over $200 million. One
              CRN article goes further and says Blackpoint had raised $26 million before 2023, which would imply roughly
              $216 million of lifetime funding, but that exact subtotal does not appear in retained official company
              releases. This should be treated as a medium-confidence triangulation rather than a canonical company
              number.


              More notable than the round size is what remains undisclosed. None of the retained primary funding
              announcements publish a post-money valuation, and no retained independent source provides a verifiable
              figure tied to the 2023 financing. The same opacity applies to ARR, revenue growth, exact partner count,
              exact endpoint count, and a detailed cap table. For a company that is visibly broadening platform scope,
              hiring a scale-oriented CEO, and discussing expansion and M&A, that disclosure gap is material. It does
              not mean the business is weak; it means outside investors cannot anchor Blackpoint’s late-stage profile to
              the same quality of operating metrics they would expect from a company approaching public markets.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
