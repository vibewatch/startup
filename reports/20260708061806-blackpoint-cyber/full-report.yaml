      - number: '2.2'
        title: Buyer Segments, Channel Motion, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              The buyer map for MDR is best segmented by who bears the staffing burden and who has the compliance or
              downtime exposure that justifies outsourcing. Large enterprises and public companies need board-defensible
              incident reporting, risk management, and governance processes; regulated mid-market firms need outcomes
              they can show to insurers, auditors, customers, and trading partners; and MSPs need to deliver those
              outcomes repeatedly across many downstream environments without hiring a full night-shift SOC for every
              client. That last segment is where Blackpoint’s channel-first model is especially well aligned.


              Blackpoint’s product and partner materials show a market bet on consolidation rather than tool sprawl.
              CompassOne adds posture, logging, asset inventory, vulnerability, and tenant-administration features
              around the core MDR service, while partner-program materials emphasize enablement, remediation support,
              and growth economics for MSPs. In other words, the buyer is no longer purchasing only alert triage. The
              buyer increasingly wants an operational layer that can unify visibility, reduce third-party-tool
              fragmentation, and convert security complexity into an outsourceable workflow. That is why MSPs,
              mid-market internal IT teams, and regulated organizations remain the most natural fit for Blackpoint’s
              model, even though the company does not publicly disclose the exact size of each cohort in its installed
              base.
            claimRefs:
              - CM011
