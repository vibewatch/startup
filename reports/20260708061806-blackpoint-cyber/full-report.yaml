      - number: '1.5'
        title: Chronology of Evolution from MDR Specialist to Broader Platform Story
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s milestone path is coherent even if some later-stage metrics are undisclosed. The company was
              founded in 2014 around Jon Murchison’s NSA-derived view that partners needed true response rather than
              more alerts. In June 2023 it raised $190 million to expand product development for MSPs, shortly after
              introducing Managed Application Control and Blackpoint University. In August 2024 it opened a Denver
              office and disclosed a 200-plus employee base. In April 2025 it launched CompassOne, reframing the
              business from an MDR specialist into a broader unified security posture and response platform. Two months
              later, it shifted leadership to Gagan Singh while keeping Murchison tightly involved as executive
              chairman.


              Fresh 2026 evidence suggests that Blackpoint wants to pair this platform evolution with continuing channel
              relevance. The company highlighted a CRN Security 100 recognition in February 2026 and published a threat
              report in April 2026 built from SOC telemetry and framed around credential abuse, RMM misuse, and
              trusted-tool attacks. Those milestones matter because they show Blackpoint trying to own both product
              breadth and category narrative. Later chapters will need to test whether that broader story creates
              durable economics, but the chronology itself is clear enough to serve as the report’s canonical backdrop.
