  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s public product, partner, and platform materials support a recurring-revenue model built
              around continuously delivered security services rather than one-time license sales. The company’s
              distribution is channel-led: MSP partners resell or package Blackpoint’s managed detection and response,
              identity coverage, SIEM or logging, posture, and adjacent controls into their own customer relationships.
              That means monetization is likely shaped by seat, endpoint, tenant, bundle, or service-layer constructs,
              but public sources do not reveal the exact contract architecture or realized pricing. What they do reveal
              is that Blackpoint is no longer just a narrow MDR SKU. CompassOne, LogIC, ITDR, posture, and
              tenant-administration capabilities imply a wider monetization surface that can expand wallet share within
              existing partner accounts.


              That matters financially because channel-delivered recurring security businesses can grow not only by
              adding net-new partners, but by selling more modules through the same partner base. Blackpoint’s own
              materials heavily emphasize stack consolidation, unified operations, and proving value to MSPs. Those are
              commercial messages, but they are consistent with a model where expansion revenue matters alongside
              new-logo growth. The problem is that no retained public source discloses the basic metrics—ARR, NRR, gross
              retention, attach rates, or module mix—that would quantify how well this model is actually working.
