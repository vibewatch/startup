      - - Arctic Wolf
        - 2021 financing mark at $4.3B; 2025 Cylance acquisition
        - Useful as a private security-operations platform reference with strategic expansion logic.
        - Valuation mark is stale and not a current traded price.
        - Official financing and M&A releases
      - - Huntress
        - $1.55B valuation on $150M Series D; approaching $100M ARR
        - Most relevant disclosed private precedent for SMB/MSP-oriented MDR.
        - Growth context came through secondary reporting, not audited filings.
        - Official round post + Crunchbase News
