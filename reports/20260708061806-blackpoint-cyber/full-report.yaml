        title: Exhibits
        blocks:
          - type: callout
            title: Blackpoint is not chasing the whole managed-services TAM
            body: >-
              The broad managed-services market is measured in hundreds of billions of dollars, but the actual MDR
              subsegment remains single-digit billions in 2026. Blackpoint’s opportunity is therefore not “all IT
              outsourcing”; it is the fast-growing slice where response quality, channel delivery, and platform
              consolidation intersect.
