          detail: $190M Bain / Accel round is public and well corroborated
        - id: opacity
          label: Price still unknown
          detail: No retained primary source discloses Blackpoint’s post-money valuation
        - id: dispersion
          label: Comp spread is wide
          detail: CrowdStrike, SentinelOne, Huntress, and MDR services ranges point to very different bands
        - id: pressure
          label: Platform pressure
          detail: Microsoft-centric XDR and multiple compression cap stand-alone MDR upside
        - id: output
          label: Track / Unknown
