      - number: '8.2'
        title: Comparable Framework and Multiple Context
        blocks:
          - type: paragraph
            body: >-
              The right comparable question for Blackpoint is not “which one public stock looks closest,” but “which
              valuation regime fits an MSP-first MDR platform with incomplete financial disclosure.” Public companies
              give a very wide answer. CrowdStrike is the premium outlier: fiscal 2026 revenue of $4.81 billion and July
              2026 market capitalization around $198 billion imply roughly 41x revenue, a figure supported by the same
              public-market exuberance that Windsor Drake says reserves premium pricing for scaled, AI-relevant leaders.
              SentinelOne, by contrast, reported just over $1.0 billion of fiscal 2026 revenue against roughly $6.2
              billion of market cap, implying only about 6.2x revenue. That gap is not noise; it is the market saying
              that quality, profitability, category leadership, and platform breadth all matter.


              The private and strategic precedents are also mixed. Arctic Wolf’s last disclosed financing mark was $4.3
              billion in 2021, but that figure is stale and should be treated as a historical financing mark rather than
              today’s price. Still, Arctic Wolf’s later Cylance acquisition shows the strategic logic of building a
              broader security-operations platform. Huntress is the closer peer for channel orientation: its June 2024
              Series D was disclosed at a $1.55 billion valuation, and Crunchbase said the company was growing more than
              70% year over year while approaching $100 million of ARR. Ontinue and Microsoft sharpen the downside logic
              instead: Microsoft’s 2026 XDR leadership and Ontinue’s Microsoft-centric MXDR positioning show why
              stand-alone MDR assets can be squeezed when larger ecosystems own the control plane.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
