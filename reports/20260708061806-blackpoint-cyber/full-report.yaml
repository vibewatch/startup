      - number: '7.3'
        title: Channel Dependency and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s pure MSP model is both moat and concentration risk. If partner trust remains high, the model
              is differentiated. If major MSPs consolidate, shift preferred stacks, or increasingly standardize on
              large-bundle vendors, the same focus can become a vulnerability. Microsoft is the clearest bundle-pressure
              example because it can combine broad security tooling with procurement convenience and customer-installed
              base. Blackpoint’s own compare pages also show it is actively fighting over channel conflict, pricing
              complexity, and platform breadth. That is useful evidence, but it also reveals where management sees
              pressure.


              The dependency question extends beyond partners themselves. MSP-focused security depends on RMM tooling,
              identities, APIs, and workflow integrations that sit outside Blackpoint’s direct control. A disruption or
              strategic shift in those ecosystems could affect both service delivery and renewal dynamics. Because the
              company does not disclose partner concentration publicly, investors cannot tell how diversified the base
              really is.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR017
              - CR018
              - CR022
              - CR027
              - CR031
