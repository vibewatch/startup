  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Blackpoint sells into a market where cyber operations are increasingly governed, reported, and audited.
              SEC cyber-disclosure rules raise governance expectations for public-company customers and their boards.
              CMMC and NIS2 extend more explicit control and reporting obligations into defense-adjacent and European
              contexts. Privacy and data-handling rules such as GLBA and CCPA can layer on additional requirements
              depending on customer mix, retention practices, and how broadly a vendor handles logs, identities, and
              incident data. Even when these frameworks do not bind Blackpoint directly in every case, they shape
              customer diligence expectations and can turn product or service-control gaps into legal or contractual
              problems.


              That means regulatory risk for Blackpoint is often indirect but still economically real. Customers may
              demand evidence, reporting, and workflow alignment that exceed what a lightweight MDR service used to
              provide. Public evidence is enough to map the regulatory environment, but not enough to prove whether
              Blackpoint’s internal controls already satisfy all the expectations its customers may project onto it.
            claimRefs:
