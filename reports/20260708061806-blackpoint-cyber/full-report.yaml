      - Multiple lens
      - ARR needed for $1.0B EV (USD M)
      - ARR needed for $1.5B EV (USD M)
      - Interpretation
    rows:
      - - Bull
        - 15.5x Huntress-like private financing mark
        - 64.5
        - 96.8
        - >-
          A low-billion Blackpoint price can work if growth, retention, and software attach resemble the strongest
          private channel-MDR precedent.
      - - Base+
        - 8.0x blended public endpoint multiple
        - 125
        - 187.5
        - Requires clear evidence that Blackpoint is more platform software than services wrapper.
      - - Base
        - 6.0x public cybersecurity median
        - 166.7
