      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Huntress is the most useful disclosed private precedent
            body: >-
              CrowdStrike and SentinelOne show the public-market outer bounds, but Huntress is the cleaner disclosed
              precedent for an SMB / MSP-oriented MDR company with a billion-plus private financing mark.
            calloutType: insight
            claimRefs:
              - CV019
              - CV020
              - CV022
              - CV024
          - type: callout
            title: Opacity is the core anti-thesis
            body: >-
              The hardest bearish argument is not that Blackpoint lacks demand. It is that the public file still does
              not reveal ARR, retention, margins, customer concentration, or the actual price of the last round.
            calloutType: risk
            claimRefs:
              - CV003
