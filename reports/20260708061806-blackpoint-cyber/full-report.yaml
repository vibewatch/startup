      - number: '8.4'
        title: Risks to Valuation, Diligence Asks, and Thesis-Breaks
        blocks:
          - type: paragraph
            body: >-
              The adverse case for Blackpoint is not that the company lacks strategic value. It is that 2026 market
              structure is far less forgiving than 2021-style cyber valuation lore. First Analysis describes a more
              selective public market with concentration at the top, while Kroll says median cyber EV/NTM multiples fell
              26% quarter over quarter in Q1 2026. Finro makes the same point at the niche level by showing that
              endpoint-security M&A can clear below private round marks when buyers discount execution risk and
              commoditization. For Blackpoint, that means investors should be especially skeptical of unsupported
              valuation rumors or any attempt to benchmark the company only against CrowdStrike-style premium software
              multiples.


              The diligence path is straightforward. Before underwriting a priced entry, investors need current ARR,
              growth by module, gross margin, net revenue retention, partner concentration, endpoint or tenant scale,
              and the actual economics of the last round or any proposed new round. The thesis breaks quickly if those
              metrics show a more services-heavy business than the marketing narrative suggests, if renewal or expansion
              are weak, or if investor-protective terms do the real valuation work behind an attractive headline number.
              Until those questions are answered, the correct conclusion is not that Blackpoint is overvalued. It is
              that Blackpoint is under-disclosed.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV041
              - CV044
              - CV046
              - CV047
              - CV048
