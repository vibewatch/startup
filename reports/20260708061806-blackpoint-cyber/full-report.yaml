  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Why it matters
      - Public warning sign
      - Diligence test
    rows:
      - - ARR materially below premium bands
        - Would make any low-billion valuation too full.
        - No public ARR disclosure.
        - Request current ARR and growth bridge by module.
      - - Gross margin more services-like than software-like
        - Would shift the company toward lower MDR and services multiples.
        - No public gross-margin disclosure.
        - Request GAAP gross margin and services mix by product line.
      - - Weak net retention or poor module attach
        - Would imply the MSP base is less monetizable than the platform story suggests.
        - No public NRR or attach-rate disclosure.
        - Review cohort retention, attach, and expansion by partner vintage.
      - - Microsoft or bundled-platform pressure rising
        - Would compress willingness to pay for stand-alone MDR.
        - Public comps already show huge spread between premium and compressed assets.
        - Inspect win-loss, Microsoft overlap, and renewal pressure data.
      - - Round terms doing the valuation work
        - Could mean the headline price overstates economic quality.
        - No public disclosure of preferences or secondary mix.
        - Review term sheet, liquidation stack, and any participating preference features.
      - - Concentration in a few MSPs or end customers
        - Would weaken resilience and warrant a discount.
        - Public customer concentration is undisclosed.
        - Request top-partner, top-tenant, and end-customer concentration data.
    notes: >-
      These are the few variables that can most quickly move Blackpoint from a compelling strategic asset to an
      overreached financing story.
    claimRefs:
      - CV023
      - CV032
      - CV034
      - CV044
      - CV047
      - CV048
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Ask
      - Why it is required
      - Public status
    rows:
      - - Current ARR and historical growth by module
        - Needed to map Blackpoint onto a real comp band rather than a narrative band.
        - Not public
      - - Gross margin and services-versus-software mix
        - Needed to know whether MDR economics deserve a software or services multiple.
        - Not public
      - - NRR, gross retention, and churn by partner cohort
        - Needed to test whether the MSP channel creates stickier economics than public peers.
        - Not public
      - - Partner and end-customer concentration
        - Needed to size downside risk and discount rate.
        - Not public
      - - Module attach, pricing, and ACV / ARPU by cohort
        - Needed to assess whether CompassOne and adjacent products expand value per partner.
        - Not public
      - - Last round valuation, liquidation preferences, and any secondary component
        - Needed to judge whether the headline round economics were investor-friendly or investor-protected.
        - Not public
    notes: >-
      Every row is a gating item for real underwriting; without them, valuation remains scenario work rather than an
      investment-grade entry memo.
    claimRefs:
      - CV003
      - CV041
      - CV046
      - CV047
