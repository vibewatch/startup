      - number: '3.2'
        title: Capability Breadth and Platform Competition
        blocks:
          - type: paragraph
            body: >-
              The competitive battle is no longer only about whether a vendor has a SOC. Almost every credible rival now
              combines detection tooling with some version of managed expertise, automation, or adjacent controls.
              Arctic Wolf emphasizes proactive MDR, a concierge model, and a large security-operations base. Huntress
              pairs managed EDR with managed SIEM and an MSP-friendly partner motion. SentinelOne combines a broad
              platform narrative with Vigilance MDR services. Microsoft layers Sentinel and Defender with expert-managed
              services and the budget power of a larger suite. Todyl explicitly combines security, networking, MXDR, and
              compliance in one platform, while Coro markets all-in-one simplicity for lean IT and MSP-style buyers.


              That context is why CompassOne matters for Blackpoint. Independent and official launch material both show
              the company broadening beyond narrow MDR into posture and response workflows. Without that move,
              Blackpoint would risk being framed as a high-quality but comparatively narrow SOC specialist. With it, the
              company can argue that it belongs in platform-shortlist conversations rather than only in alert-response
              bake-offs. Still, the public record shows that some peers—especially Microsoft and vendors with larger
              native estates—retain structural breadth advantages.
