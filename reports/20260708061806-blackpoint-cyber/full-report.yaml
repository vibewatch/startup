  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buyer Structure
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s customer model has two layers. The immediate commercial buyer is usually an MSP or channel
              partner that embeds Blackpoint into its managed-security offering. The protected end customer is more
              often an SMB or mid-market organization that lacks the staff, time, or appetite to build a round-the-clock
              security operation alone. That dual-layer model is important because it means the company is not selling
              only product satisfaction; it is selling partner economics, operational trust, and repeatable client
              delivery.


              The case-study mix and partner materials point to a sweet spot where standardization matters. MSPs want to
              deliver 24/7 security outcomes, prove value, reduce tool sprawl, and avoid standing up a large internal
              SOC team. That is different from a direct-enterprise go-to-market centered on bespoke security
              engineering. Public evidence therefore supports a segment thesis more than a scale thesis: Blackpoint
              looks well matched to MSPs serving smaller organizations, but public sources do not reliably disclose
              total customer, partner, endpoint, vertical, or geographic mix.
