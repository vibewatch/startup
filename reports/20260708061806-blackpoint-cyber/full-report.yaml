      - number: '8.3'
        title: Scenario View and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Once the comparable set is framed correctly, the valuation problem becomes reverse-engineering rather than
              point estimation. External market-data sources suggest at least four relevant bands. A public-cyber median
              near 6x revenue is the cleanest broad-market anchor. Windsor Drake’s endpoint work places pure-play MDR
              and legacy antivirus around 3x to 6x and a blended public endpoint multiple near 8x. CT Acquisitions
              places scaled MDR and XDR platforms around 2x to 4x recurring revenue or 12x to 16x EBITDA. Huntress’s
              disclosed 2024 financing, meanwhile, implies a much more generous private mark of roughly 15.5x ARR if the
              company truly was approaching $100 million of ARR at a $1.55 billion valuation.


              That spread drives the recommendation. At 6x revenue, a $1.0 billion Blackpoint valuation would require
              roughly $167 million of ARR; at Huntress-like financing levels it would require only about $65 million; at
              2x to 4x MDR revenue it would require $250 million to $500 million. Those are radically different
              underwriting pictures. Because Blackpoint discloses none of the operating metrics that decide which band
              is appropriate, the only defensible public stance is track with an unknown valuation stance. A low-billion
              valuation could be defendable if Blackpoint really has software-like growth, sticky expansion, and
              multi-module attach through the MSP base. But absent that proof, investors would be leaning on narrative
              rather than evidence.
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
