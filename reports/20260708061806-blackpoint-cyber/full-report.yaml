  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Archetypes Around Blackpoint
        blocks:
          - type: paragraph
            body: >-
              Blackpoint’s competitor set is best understood as overlapping archetypes rather than a single ladder. Some
              rivals compete primarily on being MSP-native or MSP-exclusive, others compete as mature MDR providers with
              broader enterprise reach, and still others pressure the category by bundling managed services onto larger
              security or operations platforms. This matters because a buyer choosing Blackpoint is not always deciding
              between identical substitutes. In one motion the choice is between specialist MSP-focused providers such
              as Huntress or Todyl; in another, between a specialist and an enterprise-grade MDR provider such as Arctic
              Wolf or SentinelOne; and in another, between a specialist and Microsoft’s wider security stack.


              The consequence is that “who wins” depends heavily on the buyer’s operating model. Buyers who care most
              about partner trust, multi-tenant execution, and avoiding account-control conflict behave differently from
              buyers who are already deep in a hyperscaler stack or who prioritize the largest platform footprint.
              Public evidence therefore supports a segmented market view: Blackpoint is not fighting one rival; it is
              fighting several different buying logics at once.
            claimRefs:
