      - number: '7.4'
        title: People, Execution, and Investor Mitigations
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is execution capacity. Cybersecurity talent remains scarce, AI is changing how
              security teams work, and Blackpoint’s own operating model requires sustained human excellence rather than
              only product shipping. The CEO transition may broaden leadership capacity, but it also introduces
              execution change at a time when the company is broadening platform scope and signaling international or
              inorganic ambitions. Denver expansion and a 200-plus-employee footprint show the company is not tiny, but
              they do not eliminate the risk that talent, process, and integration complexity outrun management systems.


              The best mitigants visible publicly are channel alignment, product consolidation, and human expertise. But
              those are not passive defenses; they must be executed continuously. For investors, the right response is
              to define explicit kill criteria around service-quality slippage, partner concentration, hiring strain,
              and competitive compression rather than to assume category growth will protect the business.
            claimRefs:
