companyProfile:
  summary: Blackpoint Cyber is a U.S.-based MSP-first managed detection and response company founded in 2014 by Jon Murchison, a former NSA computer operations expert. Public sources show a 24/7 human-led SOC, a platform that broadened into CompassOne and adjacent controls, and a $190 million Bain Capital Tech Opportunities and Accel financing in June 2023. In June 2025 the company appointed Gagan Singh as CEO while Murchison became executive chairman, signaling a next phase focused on scale, platform expansion, and potential M&A.
