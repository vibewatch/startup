  figureRefs:
  - FU004
- id: customer-risk-and-diligence-focus
  title: Customer Risk, Concentration, and Next Diligence Steps
  body: |-
    The biggest public evidence gap is concentration and cohort quality. Named case studies do not reveal how much revenue they represent, which sectors dominate the base, how many customers churn, or what module expansion looks like over time. Public market and threat sources support the idea that demand for MSP-delivered security remains attractive, but they do not reveal how much of that demand Blackpoint captures or retains. Even geography remains fuzzy: the model appears heavily U.S.-anchored, but public evidence does not establish a reliable distribution table.

    For diligence, the right next step is not collecting more anecdotal wins. It is asking for retention by partner cohort, customer concentration by MSP and end-market, expansion by module, reference density by segment, and churn reasons. Only then can an investor distinguish a strong curated proof set from a durable, repeatable customer engine.
  claimRefs:
  - CU021
  - CU022
  - CU026
  - CU027
  - CU028
  - CU032
  - CU035
