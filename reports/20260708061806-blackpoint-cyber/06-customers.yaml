chapter:
  number: 6
  title: Customers
  summary: Blackpoint Cyber’s public customer evidence points to an MSP-mediated base serving SMB and mid-market environments that need outsourced 24/7 protection, faster response, and simpler security operations. The evidence is rich enough to map customer jobs-to-be-done and adoption motion, but too curated and too sparse on hard operating metrics to quantify retention, concentration, or true installed-base scale.
sections:
- id: customer-segments-and-buyers
  title: Customer Segments and Buyer Structure
  body: |-
    Blackpoint’s customer model has two layers. The immediate commercial buyer is usually an MSP or channel partner that embeds Blackpoint into its managed-security offering. The protected end customer is more often an SMB or mid-market organization that lacks the staff, time, or appetite to build a round-the-clock security operation alone. That dual-layer model is important because it means the company is not selling only product satisfaction; it is selling partner economics, operational trust, and repeatable client delivery.

    The case-study mix and partner materials point to a sweet spot where standardization matters. MSPs want to deliver 24/7 security outcomes, prove value, reduce tool sprawl, and avoid standing up a large internal SOC team. That is different from a direct-enterprise go-to-market centered on bespoke security engineering. Public evidence therefore supports a segment thesis more than a scale thesis: Blackpoint looks well matched to MSPs serving smaller organizations, but public sources do not reliably disclose total customer, partner, endpoint, vertical, or geographic mix.
  claimRefs:
  - CU001
  - CU002
  - CU011
  - CU012
  - CU025
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: jobs-to-be-done-and-adoption-motion
  title: Jobs-to-Be-Done and Adoption Motion
  body: |-
    Across the public customer-proof set, the same jobs-to-be-done recur. Customers want a substitute for building an internal SOC; they want after-hours response; they want fewer tools; they want to show downstream clients or internal stakeholders that security value is real; and they want a partner that can turn threat detection into action. R3 frames the problem as build-versus-buy. Interlaced frames it as driving adoption across many clients. DTC frames it as escaping a painful product experience and getting a more human-led SOC. Responsive Technology Partners highlights value demonstration. STF highlights a middle-of-the-night incident. BECA highlights consolidation and peace of mind.

    The adoption motion is therefore as important as the product. An MSP can recommend the service, package it, roll it out, and then use Blackpoint as an operating layer across many downstream customers. That is a powerful lever when attacks remain frequent and when end customers still struggle to translate security tooling into response outcomes. That also makes partner trust unusually important.
