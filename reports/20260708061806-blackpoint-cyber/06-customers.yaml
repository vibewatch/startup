- id: independent-signals-and-retention-limits
  title: Independent Signals and Retention Limits
  body: |-
    Independent sources help, but only up to a point. Review and listing sites confirm that Blackpoint has market presence and customer-visible product usage, and they provide some directional feedback on support, usability, and product fit. They also provide the necessary adverse counterweight to company-authored success stories. However, they do not form a robust satisfaction dataset. A handful of reviews or listing profiles cannot stand in for cohort retention, net retention, reference density, or broad deployment depth.

    That limitation matters more in a channel-mediated model because retention is multi-layered. End customers need to feel protected and supported, but MSPs also need profitability, trust, and operational efficiency. A bad implementation or support experience can affect more than one downstream customer relationship. Public evidence is therefore enough to identify the questions an investor should ask about retention risk; it is not enough to answer them conclusively.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU018
  - CU024
  - CU029
  - CU031
  - CU034
