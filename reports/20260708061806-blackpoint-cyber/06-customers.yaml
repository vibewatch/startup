  title: Blackpoint’s public customer evidence is rich on jobs-to-be-done, thin on portfolio metrics
  body: The case-study set is good enough to understand why customers buy—outsourced expertise, response quality, consolidation, and scale—but not good enough to quantify how many stay, expand, or concentrate revenue.
