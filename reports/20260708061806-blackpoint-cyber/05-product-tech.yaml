- id: roadmap-dependencies-and-gaps
  title: Roadmap Signals, Dependencies, and Technical Gaps
  body: |-
    The public roadmap signal from 2025-2026 is one of expansion. CompassOne launched, follow-on blog material framed it as becoming faster and more powerful, and the 2026 threat-report narrative underscored why context across identity, RMM, and remote access must keep improving. That trajectory suggests a product still broadening into adjacent workflows rather than one that has finished its architecture journey. For investors, that can be positive because it expands monetizable surface area. It can also increase engineering complexity because every new module raises data-normalization, workflow, and integration burdens.

    The biggest unresolved questions are architectural rather than marketing. How much of the platform is natively built versus integrated? How standardized are detections and playbooks across modules? How costly is data retention at SIEM scale? How much automation is truly closed-loop versus human-assisted? And how much operational benefit does unified context deliver in practice? Those are all decisive technical questions, and none are answered fully in public sources. That is why management demos, architecture reviews, and partner-reference calls remain essential before concluding that Blackpoint’s platform breadth translates into durable technical advantage.
