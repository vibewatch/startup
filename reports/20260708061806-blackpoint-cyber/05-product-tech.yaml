chapter:
  number: 5
  title: Product & Technology
  summary: Blackpoint Cyber’s product has evolved from a channel-first MDR service into a broader security-posture-and-response platform. Public evidence supports a genuinely wider architecture—MDR, SIEM/logging, identity, posture, tenant administration, integrations, and human-led operations—but it does not yet provide neutral proof that the unified-context promise materially outperforms larger suite vendors or other MSP-native competitors.
sections:
- id: platform-surface-and-architecture
  title: Platform Surface and Architecture
  body: |-
    The retained public record shows a meaningful broadening of Blackpoint’s technology surface. CompassOne is described as a unified security posture and response platform, while separate pages identify LogIC for SIEM or logging, ITDR for cloud identity threat detection, MDR for active response, and platform-level functions such as tenant administration, asset inventory, vulnerability management, cloud posture, and integrations. This is important because it changes the product category Blackpoint is trying to occupy. A few years ago the company could have been understood mainly as an MDR specialist. The current architecture story is that Blackpoint wants to be the operating layer that combines prevention, detection, posture, and response in one context for MSPs.

    That does not mean the public record proves deep technical unification at the infrastructure level. Public pages do not expose storage architecture, detection-pipeline details, model training, or exact data-normalization mechanics. But they do make a strong product-architecture claim: one interface, one context layer, and a shared workflow across modules. For an MSP audience, that claim matters because multi-tenant operations and context switching can be a bigger practical burden than raw detection feature count.
