- id: operating-model-and-detection-design
  title: Operating Model and Detection Design
  body: |-
    Blackpoint’s technical value proposition depends on more than software modules. The MDR, SOC, and Adversary Pursuit Group pages present service operations as part of the product itself: analysts, threat hunters, response authority, and contextual decision-making sit alongside detection logic and workflow software. The strongest public evidence for that design comes from Blackpoint’s 2026 threat-report material, which emphasizes abuse of trusted credentials, RMM tools, SSL VPNs, fake CAPTCHA lures, and other forms of legitimate-tool exploitation. This is not a story about catching only obvious malware. It is a story about noticing bad behavior inside normal administrative surfaces and interrupting it quickly.

    That design choice is especially relevant for MSP-heavy environments because the attack surface is distributed and privileged tools are already present. The telemetry Blackpoint publishes implies the product must correlate identity, remote-management, cloud, and endpoint context with enough speed to let humans or automated controls act before payload delivery. Public sources do not prove how well the system performs versus peers in lab conditions, but they do show that Blackpoint’s detection philosophy is behavior- and workflow-oriented, not just signature-oriented.
