callouts:
- calloutType: insight
  title: Blackpoint is competing against buying motions, not just logos
  body: The most important competitive fact is segmentation. Huntress and Todyl pressure Blackpoint on MSP alignment, Arctic Wolf and SentinelOne on MDR sophistication, and Microsoft on suite economics. Investors should ask which motion actually drives Blackpoint’s pipeline rather than count every logo equally.
  claimRefs:
  - CP014
  - CP015
  - CP020
- calloutType: risk
  title: Vendor-authored comparison pages are useful but biased
  body: Blackpoint’s strongest public comparative arguments come from its own sales collateral. Those pages reveal strategy, but they do not substitute for neutral win-loss data, pricing evidence, or customer references that validate the claims.
