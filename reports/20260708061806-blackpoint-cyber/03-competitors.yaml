  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss-data
    missingEvidence: Neutral win-loss, renewal, pricing, and displacement data across Blackpoint and named competitors.
    whyItMatters: Public product pages establish positioning but do not prove who wins, why, or at what gross margin cost.
    diligencePath: Request CRM win-loss analysis, partner reference calls, and pricing cards across Blackpoint, Huntress, and top rivals.
