- id: limitations-and-investor-interpretation
  title: Public-Evidence Limits and How to Interpret Them
  body: |-
    The biggest limitation in public competitor mapping is that most sources describe positioning rather than performance. Vendor-authored comparison pages can be useful because they reveal where a company believes it wins, but they should not be mistaken for neutral head-to-head proof. Likewise, public product pages tell us a vendor’s stated breadth and target buyer, but they do not prove win rates, retention, attach rates, pricing efficiency, or SOC performance under stress. Investors should therefore treat this chapter as a map of competitive vectors, not a definitive ranking.

    That distinction matters for Blackpoint. Public evidence is enough to say that the company faces real pressure from Huntress and Todyl on MSP alignment, from Arctic Wolf and SentinelOne on MDR sophistication, and from Microsoft on bundle economics. It is not enough to prove exactly where Blackpoint wins, at what price delta, or with what renewal advantage. The remaining diligence burden is to test whether Blackpoint’s response quality, platform breadth, and partner economics are sufficiently superior in the specific buyer slices the company is targeting.
