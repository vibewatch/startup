    - QP016
    - QP017
    - QP025
  - type: source-bias
    severity: medium
    topic: vendor-authored-compare-pages
    missingEvidence: Neutral third-party benchmarking of Blackpoint versus Arctic Wolf and Huntress on response quality, pricing, and platform breadth.
    whyItMatters: Vendor-authored compare pages are informative about strategy but inherently biased.
    diligencePath: Supplement with customer interviews, analyst evaluations, or independent MSSP comparisons.
