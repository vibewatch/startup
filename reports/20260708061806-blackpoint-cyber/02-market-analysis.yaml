  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: blackpoint-sam-som
    missingEvidence: Revenue, customer-count, partner-count, and endpoint-count data needed to compute a defensible Blackpoint SAM or SOM.
    whyItMatters: Without company-specific scale metrics, market attractiveness cannot be translated into share or penetration analysis.
    diligencePath: Request management KPI deck or investor metrics sheet with revenue, partners, endpoints, and customer segmentation.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map-simplification
    missingEvidence: Primary data on Blackpoint customer mix by segment, geography, and regulatory profile.
    whyItMatters: The buyer map is analytical rather than census-like, so it should not be mistaken for disclosed customer composition.
    diligencePath: Ask management for customer mix by MSP, mid-market, enterprise, and regulated vertical.
    relatedQuestionRefs:
    - QM007
    - QM023
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: market-estimate-boundary
    missingEvidence: Comparable multi-publisher MDR estimates that use identical scope definitions and time windows.
    whyItMatters: Analyst figures can diverge when MDR, XDR, SOC-as-a-service, and managed security services are grouped differently.
    diligencePath: Normalize analyst definitions before using topline market numbers in valuation work.
