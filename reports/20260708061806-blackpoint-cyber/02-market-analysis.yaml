callouts:
- calloutType: insight
  title: Blackpoint is not chasing the whole managed-services TAM
  body: The broad managed-services market is measured in hundreds of billions of dollars, but the actual MDR subsegment remains single-digit billions in 2026. Blackpoint’s opportunity is therefore not “all IT outsourcing”; it is the fast-growing slice where response quality, channel delivery, and platform consolidation intersect.
  claimRefs:
  - CM004
  - CM005
  - CM006
- calloutType: risk
  title: A good market does not solve Blackpoint’s disclosure opacity
  body: Even though the MDR category is attractive, public data still does not reveal Blackpoint’s revenue, exact customer base, exact partner count, or exact endpoint count. Market tailwinds are easier to prove than Blackpoint’s exact share capture.
  claimRefs:
  - CM032
  - CM033
  - CM035
