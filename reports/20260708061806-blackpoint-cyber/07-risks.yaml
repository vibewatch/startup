    - Stable QA / response metrics and reference consistency
    - Evidence of rising churn or response failures
  - - Channel concentration
    - Partner-first model and alignment message
    - Diversified top-partner exposure and stable renewals
    - Overconcentration in a few partners
  - - Regulatory readiness
    - Framework-aware product positioning
    - Control mapping and customer audit support proof
    - Major gaps in control / evidence support
  - - Talent / execution
    - Scale and leadership bench expansion
    - Healthy attrition, training, and analyst productivity
    - Inability to hire / retain key operators
  - - Competitive compression
    - Broader platform narrative
    - Win-loss resilience against bundle vendors
    - Persistent bundle-driven win-rate deterioration
  notes: Kill criteria are intentionally concrete because risk work is only useful if it changes diligence behavior.
