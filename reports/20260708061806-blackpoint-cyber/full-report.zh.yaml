  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 面向的市场里，网络安全运营越来越需要治理、披露和审计。SEC 网络安全披露规则抬高了上市公司客户及其董事会的治理预期。CMMC 和 NIS2
              把更明确的控制与报告义务延伸到涉防和欧洲场景。GLBA、CCPA 等隐私和数据处理规则，也会随客户组合、留存做法，以及供应商处理日志、身份和事件数据的范围叠加更多要求。即便上述框架并非每次都直接约束
              Blackpoint，上述框架也会塑造客户尽调预期，并把产品或服务控制缺口推成法律或合同问题。


              因此，Blackpoint 的监管风险往往是间接的，但经济后果真实存在。客户可能要求证据、报告和工作流对齐，标准高于轻量 MDR 服务过去提供的水平。公开证据足以勾勒监管环境，却不足以证明 Blackpoint
              的内部控制已经满足客户可能转嫁给它的全部预期。
