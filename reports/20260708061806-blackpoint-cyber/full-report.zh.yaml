  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Blackpoint 周边的竞争类型
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的竞争对手集合，最好理解为相互重叠的类型，而不是一条单一阶梯。有些对手主要以 MSP 原生或 MSP 专属身份竞争，有些是企业覆盖更广的成熟 MDR
              提供商，还有一些把托管服务捆到更大的安全或运营平台上来挤压品类。这个视角重要，因为买方选择 Blackpoint 时，并不总是在同类替代品之间做选择。在一种动作里，选择发生在 Huntress 或 Todyl
              这类专注 MSP 的专业提供商之间；另一种动作里，选择发生在专业厂商与 Arctic Wolf 或 SentinelOne 这类企业级 MDR 提供商之间；还有一种动作里，选择发生在专业厂商与 Microsoft
              更宽安全栈之间。


              因此，“谁赢”高度取决于买方的运营模式。最看重合作伙伴信任、多租户执行、避免账户控制冲突的买方，行为不同于已经深度嵌入超大规模云厂商栈、或优先考虑最大平台足迹的买方。公开证据因此支持一种分层市场视角：Blackpoint
              不是在打一家对手，而是同时对抗几套不同购买逻辑。
