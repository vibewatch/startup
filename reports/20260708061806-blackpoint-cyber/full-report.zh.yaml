      - number: '4.2'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的公开记录显示，它是一家资本较轻、但人员密集的安全服务公司。没有迹象显示公司有制造、硬件库存或项目融资暴露；可见的运营引擎是人工 SOC
              覆盖、威胁狩猎、响应授权、云交付遥测、产品模块工程和合作伙伴赋能。这种组合通常会产生不同于纯软件端点厂商的利润率画像。经常性收入的节奏可能像
              SaaS，但交付仍依赖分析师、修复人员、支持、入驻和基础设施。因此，Denver 办公室公告披露员工超过 200 人，即使没有直接薪酬披露，也有经济意义：它说明运营规模已足以让劳动力效率和平台杠杆变得很关键。


              客户故事也提供了粗略投资回报（ROI）代理指标。R3 明确把选择描述为自建内部 24/7 SOC 还是与 Blackpoint 合作，并称 Blackpoint 等同于几名全职 SOC
              分析师。Interlaced 描述了一种规模化默认采用、客户可选择退出的动作，说明当 MSP 能够标准化而非为每笔销售定制时，Blackpoint
              的经济性会改善。这些都是供应商挑选的证据点，因此不应赋予过高权重，但至少展示了管理层正在销售的经济叙事：合作伙伴杠杆加外包劳动力替代。公开证据仍无法计算获客成本（CAC）、回本周期、毛利率或留存，因此单位经济分析很大程度上仍是推断。
