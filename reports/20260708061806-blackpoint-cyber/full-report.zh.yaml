            body: >-
              公开客户证据集中，反复出现的是同一组待完成任务。客户想替代自建内部 SOC；想要非工作时间响应；想要更少工具；想向下游客户或内部利益相关方证明安全价值真实存在；也想要一个能把威胁检测转化为行动的合作伙伴。R3
              把问题表述为自建还是采购。Interlaced 把问题表述为在许多客户中推动采用。DTC 把问题表述为摆脱痛苦产品体验，并获得人工主导程度更高的 SOC。Responsive Technology
              Partners 强调价值展示。STF 强调半夜事件。BECA 强调整合和安心。


              因此，采用路径和产品一样重要。MSP 可以推荐这项服务、打包、推出，然后把 Blackpoint
              用作覆盖许多下游客户的运营层。当攻击仍然频繁、终端客户仍难把安全工具转化为响应结果时，这是一个强杠杆。这也让合作伙伴信任变得异常重要。
