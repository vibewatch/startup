      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: Blackpoint 不是在追逐整个托管服务 TAM
            body: 广义托管服务市场以数千亿美元计，但真正的 MDR 子品类在 2026 年仍只有个位数十亿美元规模。因此，Blackpoint 的机会不是“所有 IT 外包”，而是响应质量、渠道交付和平台整合交汇的高增长切片。
            calloutType: insight
