  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的公开产品、合作伙伴和平台材料，支持一个围绕持续交付安全服务而非一次性许可证销售搭建的经常性收入模式。公司的分销由渠道主导：MSP 合作伙伴把 Blackpoint 的
              MDR、身份覆盖、SIEM
              或日志、态势和周边控制转售或打包进自己的客户关系中。因此，变现很可能由席位、端点、租户、捆绑包或服务层结构塑造，但公开来源没有揭示具体合同架构或实际定价。它们确实揭示的是，Blackpoint 已不再只是一个狭窄
              MDR SKU。CompassOne、LogIC、ITDR、态势和租户管理能力意味着更宽的变现表面，可以在既有合作伙伴账户中扩大钱包份额。


              财务含义在于，渠道交付的经常性安全业务，不仅可以靠新增净合作伙伴增长，也可以靠同一合作伙伴基础销售更多模块增长。Blackpoint 自身材料大量强调技术栈整合、统一运营和向 MSP
              证明价值。这些是商业信息，但与一个把扩张收入和新增客户增长并列看待的模式相一致。问题在于，本报告保留的公开来源没有披露基础指标——年经常性收入（ARR）、净留存率（NRR）、总留存、附加率或模块组合——来量化这个模式实际运转得多好。
