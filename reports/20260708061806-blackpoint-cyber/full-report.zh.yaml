      - number: '8.4'
        title: 估值风险、尽调问题与论断破裂点
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的反向情形，不是公司缺少战略价值，而是 2026 年市场结构远比 2021 年式网络安全估值神话更不宽容。First Analysis 描述的公开市场更挑剔、价值向头部集中；Kroll 则称
              2026 年一季度网络安全 EV/NTM 中位倍数环比下跌 26%。Finro 从细分层面提出同样观点：买方给执行风险和商品化打折时，终端安全 M&A 可以低于私募轮估值成交。对 Blackpoint
              而言，投资人应特别怀疑没有支撑的估值传闻，也应警惕只拿 CrowdStrike 式高溢价软件倍数来对标公司的做法。


              尽调路径很直接。投资人给有价格的入场做承销前，需要拿到当前 ARR、按模块拆分的增长、毛利率、净收入留存、伙伴集中度、终端
              或租户规模，以及上一轮或任何拟议新一轮的真实经济条款。若上述指标显示业务比营销叙事更重服务，续约或扩售偏弱，或真正撑起漂亮标题数字的是投资人保护条款，论断会很快破裂。在上述问题回答前，正确结论不是
              Blackpoint 被高估，而是 Blackpoint 披露不足。
