      - number: '2.3'
        title: 增长驱动与监管顺风
        blocks:
          - type: paragraph
            body: >-
              三股力量同时抬升 MDR 需求。第一，人才稀缺仍然严重：World Economic Forum 仍描述全球网络安全专业人员短缺近 4 million 名，2026 年展望还称 AI
              采用、地缘政治碎片化和能力差距扩大，让运营环境更难而不是更容易。招不到足够网络安全人才的买方，会被推向外部响应提供商，或能够规模化打包专业能力的渠道合作伙伴。第二，监管要求正在把网络成熟度变成治理义务。SEC
              现在要求上市公司快速披露重大事件，并描述风险管理、管理层和董事会监督流程。NIS2 将正式网络义务扩展到欧盟 18 个行业，CMMC 则迫使国防承包商证明其对 FCI 和 CUI 的保护。


              第三，威胁格局本身越来越瞄准 MSP 和外包运营方能创造价值的地方。Blackpoint 的 2026 年威胁报告和 CISA 的 SimpleHelp 公告都强调可信工具滥用、RMM 误用、VPN
              失陷和远程服务卫生薄弱的危险。这些不是边缘案例，而是分布式 IT 环境里的结构性风险。因此，MDR
              需求不再只由对新型零日漏洞的恐惧驱动。真正的驱动力，是持续监控日常凭证、常规工作流、远程工具和供应链暴露，并在事件演变成入侵之前，带着足够上下文采取行动。
