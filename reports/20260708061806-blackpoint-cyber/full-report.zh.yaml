      - number: '1.5'
        title: 从 MDR 专家到更广平台叙事的演进时间线
        blocks:
          - type: paragraph
            body: >-
              即便部分后期指标未披露，Blackpoint 的里程碑路径仍然连贯。公司 2014 年创立，源于 Jon Murchison 基于 NSA 经历形成的判断：合作伙伴需要真正的响应，而不是更多告警。2023 年 6
              月，公司融资 $190M，用于扩大面向 MSP 的产品开发；此前不久，公司推出 Managed Application Control 和 Blackpoint University。2024 年 8
              月，公司开设 Denver 办公室，并披露员工超过 200 人。2025 年 4 月，公司推出 CompassOne，把业务从 MDR 专家重新表述为更广的统一安全态势与响应平台。两个月后，公司把领导权交给
              Gagan Singh，同时让 Murchison 以执行董事长身份保持深度参与。


              2026 年的新证据显示，Blackpoint 想把平台演进与持续的渠道地位放在一起。公司在 2026 年 2 月强调入选 CRN Security 100，并在 2026 年 4 月发布一份基于 SOC
              遥测的威胁报告，叙事聚焦凭证滥用、RMM 误用和可信工具攻击。这些里程碑重要，因为它们显示 Blackpoint
              试图同时占住产品宽度和品类叙事。后续章节需要检验这个更宽故事能否带来耐久经济性，但时间线本身已经足够清楚，可以作为本报告的标准背景。
