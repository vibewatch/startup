        - 宽口径市场的软件锚点，但仍要求公司已有相当规模。
      - - 悲观
        - 4.0x，MDR 收入区间上沿
        - 250
        - 375
        - 若投资者看到明显服务强度，或平台稀缺性有限，则适用这一档。
      - - 下行情形并购
        - 3.0x，托管安全低端 / 服务压缩区间
        - 333.3
        - 500
        - 除非收入远高于公开资料显示，否则低十亿美元级估值很难站住。
    notes: ARR 要求由企业价值除以各倍数区间反推得出；这些要求是敏感性点，不是 Blackpoint 已披露指标。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV029
      - CV038
      - CV039
      - CV040
      - CV043
      - CV044
  - id: TV005
    title: 打破论点与叫停触发项表
    columns:
      - 触发项
      - 为何重要
      - 公开警讯
      - 尽调测试
    rows:
      - - ARR 明显低于溢价区间
        - 会让任何低十亿美元级估值显得过满。
        - 未公开披露 ARR。
        - 索取当前 ARR，以及按模块拆分的增长桥。
      - - 毛利率更像服务，而非软件
        - 会把公司推向更低的 MDR 和服务倍数。
        - 未公开披露毛利率。
        - 索取 GAAP 毛利率和按产品线拆分的服务占比。
      - - 净留存偏弱或模块附加销售不佳
        - MSP 客户基础的变现能力可能低于平台故事暗示。
        - 未公开披露 NRR 或附加率。
        - 按合作伙伴批次审阅留存、附加销售和扩张。
      - - Microsoft 或捆绑平台压力上升
        - 会压缩客户为独立 MDR 付费的意愿。
        - 公开可比对象已经显示，溢价资产与被压缩资产之间差距很大。
        - 检查赢单 / 输单、Microsoft 重叠和续约压力数据。
      - - 融资条款在撑估值
        - 可能意味着名义价格高估了经济质量。
        - 未公开披露优先权或二级交易占比。
        - 审阅投资条款清单、清算层级，以及任何参与型优先权条款。
      - - 少数 MSP 或终端客户集中
        - 会削弱韧性，并需要估值折扣。
        - 未公开披露客户集中度。
        - 索取头部合作伙伴、头部租户和终端客户集中度数据。
    notes: 下列变量最可能迅速把 Blackpoint 从有吸引力的战略资产，改写成估值过头的融资故事。
    claimRefs:
      - CV023
      - CV032
      - CV034
      - CV044
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调清单
    columns:
      - 索取项
      - 为何必需
      - 公开状态
    rows:
      - - 当前 ARR 及按模块拆分的历史增长
        - 用于将 Blackpoint 映射到真实可比倍数区间，而不是叙事倍数区间。
        - 未公开
      - - 毛利率及服务 / 软件收入结构
        - 用于判断 MDR 经济性应拿软件倍数还是服务倍数。
        - 未公开
      - - NRR、毛留存及按合作伙伴批次拆分的流失
        - 用于测试 MSP 渠道是否带来比上市同业更强的粘性。
        - 未公开
      - - 合作伙伴和终端客户集中度
        - 用于测算下行风险和折现率。
        - 未公开
      - - 按批次拆分的模块附加销售、定价和 ACV / ARPU
        - 用于评估 CompassOne 和相邻产品是否提高每个合作伙伴的价值。
        - 未公开
      - - 上一轮估值、清算优先权和任何二级交易部分
        - 用于判断上一轮融资的表面经济性是对投资者友好，还是靠保护条款托底。
        - 未公开
    notes: 每一行都是真实投资评估的门槛项；缺少这些，估值就仍是情景推演，而不是投资级进入备忘录。
    claimRefs:
      - CV003
      - CV041
      - CV046
      - CV047
