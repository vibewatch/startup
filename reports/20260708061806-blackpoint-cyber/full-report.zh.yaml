      - number: '3.2'
        title: 能力宽度与平台竞争
        blocks:
          - type: paragraph
            body: >-
              竞争战场已不再只是供应商有没有 SOC。几乎所有可信对手现在都会把检测工具与某种托管专业能力、自动化或周边控制结合起来。Arctic Wolf 强调主动 MDR、专属顾问模式和庞大的安全运营基础。Huntress
              把托管 EDR 与托管 SIEM、对 MSP 友好的合作伙伴打法放在一起。SentinelOne 将更宽的平台叙事与 Vigilance MDR 服务结合。Microsoft 把 Sentinel 和
              Defender 叠加专家托管服务，并利用更大套件的预算力量。Todyl 明确把安全、网络、MXDR 和合规放进一个平台；Coro 则向精简 IT 和 MSP 类型买方主打一体化、轻量简单。


              正因为有这个背景，CompassOne 对 Blackpoint 才重要。独立和官方发布材料都显示，公司正在从狭义 MDR 拓宽到态势和响应工作流。没有这一步，Blackpoint 会被框定为高质量但相对狭窄的
              SOC 专家。有了这一步，公司可以主张自己属于平台候选名单讨论，而不只是告警响应比拼。不过，公开记录也显示，一些同行——尤其是 Microsoft 和拥有更大原生资产的厂商——仍保有结构性宽度优势。
