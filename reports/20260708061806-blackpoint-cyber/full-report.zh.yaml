      - number: '7.2'
        title: 运营、质量与安全服务风险
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的运营模式让服务质量成为核心风险变量。公司卖的不只是软件，还包括主动响应、24/7 SOC
              覆盖和威胁狩猎能力。软件加服务可以形成竞争优势，但招聘、分析师质量、工作流纪律或支持执行一旦失手，客户价值会直接受损。评论来源已经给出一些反向信号，说明服务摩擦确实重要。CISA 和 NIST
              来源也解释了环境为什么不宽容：攻击者越来越多滥用合法远程管理工具、身份和远程访问面，迫使团队承担更重的上下文调查和快速判断负担。


              结果就是典型的规模化风险。如果需求增长快过 Blackpoint
              维持分析师质量和流程一致性的能力，即便表面增长健康，客户体验也可能下滑、流失率升高，或伙伴不满。公开来源足以识别风险，却无法量化当前控制质量或错误率。
            claimRefs:
