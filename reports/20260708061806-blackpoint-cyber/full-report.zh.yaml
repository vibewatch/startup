  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与规模口径
        blocks:
          - type: paragraph
            body: >-
              托管检测与响应应被理解为一个服务品类，而不只是产品功能集合。本报告保留的分析师来源把市场定义在持续监控、威胁检测、调查和主动响应之上，这些能力由外部专家或托管平台交付。说得更实际一点，MDR
              弥合的是“拥有安全工具”和“真正运营 24/7 响应职能”之间的缺口。这个差别对 MSP 和中端市场买方尤其重要，因为许多组织买得起端点或日志工具许可证，却很久之后才负担得起成熟的内部 SOC。


              与具体 MDR 细分相比，更广的托管服务宇宙巨大得多。Omdia 称，2025 年全球托管服务规模达到 $595B；MarketsandMarkets 估算托管服务市场 2026 年为 $460.59B，2031
              年将达到 $705.22B。在这个大得多的宇宙里，MarketsandMarkets 预计 MDR 2026 年为 $6.22B，2031 年达到 $17.64B。总可用市场（TAM）与 MDR 之间的差距，正是
              Blackpoint 叙事有意义的原因：它并不试图拿下所有托管服务，只瞄准安全关键层。在这一层里，人才稀缺、监管压力和威胁强度让外包响应具备经济吸引力。不过，公开数据不足以为 Blackpoint
              自身给出精确的可服务市场（SAM）或可获取市场（SOM），因为客户数、合作伙伴数、端点数和收入都未披露。
