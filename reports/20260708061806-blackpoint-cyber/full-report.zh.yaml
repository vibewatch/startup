      - number: '2.2'
        title: 买方分层、渠道打法与采用路径
        blocks:
          - type: paragraph
            body: >-
              MDR 的买方地图，最好按谁承担人员负担、谁有合规或停机暴露来划分。大型企业和上市公司需要能向董事会交代的事件报告、风险管理和治理流程；受监管的中端市场公司需要能给保险公司、审计师、客户和交易伙伴看的结果；MSP
              则需要在大量下游环境里反复交付这些结果，而不用为每个客户招聘完整夜班 SOC。最后这个分层，正是 Blackpoint 渠道优先模式最契合的地方。


              Blackpoint 的产品和合作伙伴材料显示，它押注的是整合，而不是工具蔓延。CompassOne 在核心 MDR 服务周围增加态势、日志、资产清单、漏洞和租户管理功能；合作伙伴计划材料则强调赋能、修复支持和
              MSP 增长经济。换句话说，买方现在购买的不只是告警分诊。买方越来越想要一个运营层：统一可见性、减少第三方工具碎片化，并把安全复杂度转化为可外包的工作流。因此，MSP、中端市场内部 IT 团队和受监管组织仍是
              Blackpoint 模式最自然的匹配对象，尽管公司没有公开披露装机基础中每个群体的确切规模。
