  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值事实，以及不透明为何重要
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净的估值事实，是那次融资事件，以及围绕它缺失的字段。Bain Capital、Blackpoint、William Blair 和 PR Newswire 都支持同一个硬事实：Blackpoint
              在 2023 年 6 月从 Bain Capital Tech Opportunities 和 Accel 融得 $190 million，融资资金被明确描述为继续建设产品和支持 MSP
              伙伴的资本。SecurityWeek 又补充了一个重要但仍不完整的数据点：该轮融资使总融资额略高于 $200 million。融资信息足以把 Blackpoint
              视为一家获得实质融资的成长公司，而不是轻融资的渠道型小公司。


              外部人仍看不到的，是估值纪律里最关键的部分：价格。已留存的一手来源没有披露投后估值，也没有给出股权结构背景、老股转让比例、清算优先权或稀释机制；上述信息才能告诉投资人，该轮融资到底保守、战略性还是激进。Bain
              2025 年投资组合快照确认 Blackpoint 仍在 Bain 的投资组合里，2025 年 CEO
              换任也指向一家公司仍在考虑扩张和收购，而不是收割现金。但上述信号只是阶段信号，不是投资定价输入。因此，公开证据能证明一次严肃后期融资事件的存在，却仍把实际入场价格留作未知。
