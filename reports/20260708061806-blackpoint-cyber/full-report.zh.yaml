          label: 价格仍未知
          detail: 已保留的一手来源均未披露 Blackpoint 投后估值
        - id: dispersion
          label: 可比公司区间很宽
          detail: CrowdStrike、SentinelOne、Huntress 与 MDR 服务区间指向差异很大的估值带
