    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围和 MSP 优先运营模式
        blocks:
          - type: paragraph
            body: >-
              Blackpoint Cyber 的公开材料始终把公司定位为 MSP 优先的网络安全厂商，核心围绕 MDR，而不是传统的企业直销型 MSSP。官网、合作伙伴页面和 2023
              年融资公告都强调同一件事：Blackpoint 的 24/7 安全运营中心代表 MSP
              合作伙伴及其下游客户采取行动，而不只是转发告警。这个差别重要，因为公司的市场打法、产品决策和客户证据都嵌在托管服务提供商生态里。


              到 2026 年中，Blackpoint 的产品范围已经明显超过纯 MDR。官方页面显示，CompassOne、LogIC
              SIEM、ITDR、云态势、漏洞管理、资产清单、应用控制和租户管理都被放进同一平台伞下。公司的战略信息很清楚：Blackpoint 想为 MSP 整合碎片化安全工具，同时保留让其 MDR 品牌站住脚的人工主导
              SOC 层。客户证据也说明，吸引力不只来自更好的检测，还来自更低误报负担、更快响应，以及内部团队离线时仍会动手处理的合作伙伴。截至本报告日期，渠道优先交付和不断扩大的平台宽度共同构成了公司的核心身份。
