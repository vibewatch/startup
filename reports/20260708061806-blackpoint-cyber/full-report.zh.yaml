  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台覆盖面与架构
        blocks:
          - type: paragraph
            body: >-
              本报告保留的公开记录显示，Blackpoint 的技术覆盖面已明显拓宽。CompassOne 被描述为统一的安全态势与响应平台；其他页面则把 LogIC 定位为 SIEM 或日志，把 ITDR
              定位为云身份威胁检测，把 MDR 定位为主动响应，并列出租户管理、资产清单、漏洞管理、云态势和集成等平台级功能。这一点重要，因为它改变了 Blackpoint 想进入的产品品类。几年前，公司主要可以被理解为
              MDR 专家；现在的架构故事是，Blackpoint 想成为一个运营层，在同一上下文里为 MSP 结合预防、检测、态势和响应。


              公开记录还不能证明公司在基础设施层面完成了深度技术统一。公开页面没有披露存储架构、检测管线细节、模型训练或精确数据标准化机制。但它们确实提出了强产品架构主张：一个界面、一个上下文层、跨模块共享工作流。面向 MSP
              受众时，这个主张重要，因为多租户运营和上下文切换可能比原始检测功能数量更让人吃力。
