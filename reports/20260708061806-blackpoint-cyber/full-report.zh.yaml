      - number: '8.2'
        title: 可比框架与倍数语境
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的正确可比问题不是“哪只上市股票看起来最像”，而是“财务披露不完整、MSP 优先的 MDR 平台，应落在哪套估值体系里”。上市公司给出的答案跨度很大。CrowdStrike
              是高端异常值：2026 财年收入 $4.81 billion、2026 年 7 月市值约 $198 billion，隐含约 41x 收入；Windsor Drake 所说的公开市场热情也支撑了约 41x
              的倍数——高溢价定价只留给已成规模且与 AI 绑定的龙头。相比之下，SentinelOne 报告 2026 财年收入略高于 $1.0 billion，市值约 $6.2 billion，只隐含约 6.2x
              收入。倍数差距不是噪音，而是市场在说：质量、盈利能力、品类领导力和平台广度都重要。


              私募和战略先例也并不统一。Arctic Wolf 最后一次披露的融资估值是 2021 年的 $4.3 billion，但这个数字已经过时，应视为历史融资标记，而不是今天的价格。即便如此，Arctic Wolf
              后来收购 Cylance，说明它有意构建更广安全运营平台。Huntress 在渠道取向上更接近：其 2024 年 6 月 D 轮融资披露估值为 $1.55 billion，Crunchbase 称公司同比增长超过
              70%，ARR 接近 $100 million。Ontinue 和 Microsoft 则强化了下行逻辑：Microsoft 2026 年的 XDR 领导地位，以及 Ontinue 围绕 Microsoft 的
              MXDR 定位，说明当更大生态掌握控制平面时，独立 MDR 资产为什么会被挤压。
