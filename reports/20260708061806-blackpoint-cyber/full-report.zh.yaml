      - number: '3.4'
        title: 公开证据边界及解读方式
        blocks:
          - type: paragraph
            body: >-
              公开竞争映射最大的限制，是大多数来源描述的是定位，而不是表现。供应商自写的对比页面有用，因为它们透露公司认为自己赢在哪里，但不应被误认为中立的正面对比证据。同样，公开产品页面告诉我们供应商声称的宽度和目标买方，却无法证明胜率、留存、附加率、定价效率或
              SOC 在压力下的表现。因此，投资者应把本章视为竞争向量地图，而不是确定性排名。


              这个区别对 Blackpoint 很重要。公开证据足以说明，公司在 MSP 一致性上面对 Huntress 和 Todyl 的真实压力，在 MDR 成熟度上面对 Arctic Wolf 和 SentinelOne
              的压力，在套件经济上面对 Microsoft 的压力。但这些证据不足以证明 Blackpoint 具体在哪里赢、以多大价格差赢，或具备怎样的续约优势。剩余尽调负担，是检验 Blackpoint
              的响应质量、平台宽度和合作伙伴经济性，是否在公司瞄准的具体买方切片里足够优越。
