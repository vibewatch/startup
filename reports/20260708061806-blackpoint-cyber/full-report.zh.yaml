      - number: '4.4'
        title: 财务结论与剩余尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从财务尽调角度看，Blackpoint
              比许多私营安全初创公司更成熟，但比上市可比公司更难承销。公司似乎拥有耐久的经常性服务模式、可信的机构支持，以及可能随时间提升单个合作伙伴收入的平台拓宽战略。这些都是有意义的正面因素。不过，几乎所有能把这个故事转成承销模型的指标仍是私有信息：收入、年经常性收入（ARR）、模块组合、实际定价、毛利率、留存、烧钱速度、现金跑道和现金转化。公开评论来源也强化了两点：定价透明度有限，运营质量仍影响留存；因此，即便是基础收入质量问题，也需要管理层直接提供证据。


              因此，正确的财务结论既不是看空，也不是自满。根据公开证据，Blackpoint
              不是一家融资问号公司，而是一家披露问号公司。下一步不是继续讲融资规模的故事，而是提出纪律严明的资料清单：价格卡、合作伙伴经济性、按队列拆分的流失和净留存率（NRR）、按产品家族拆分的毛利率、服务与软件收入组合，以及当前现金跑道视图。没有这些材料，投资者只能验证模式的大致形状，而无法验证其真实效率。
            claimRefs:
              - CI013
              - CI014
              - CI019
              - CI021
              - CI025
              - CI027
              - CI030
              - CI034
              - CI035
      - number: '4.5'
        title: 图表与要点
        blocks:
