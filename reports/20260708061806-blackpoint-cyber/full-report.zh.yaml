      - number: '1.4'
        title: 规模信号、地理足迹与仍待验证事项
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 确实给出了一些可信的公开规模信号。2024 年 8 月 Denver 办公室公告称公司员工超过 200 人，并把 Denver
              描述为第二个办公室所在地，暗示公司在别处已有主要足迹。联系和领导层页面现在显示北美、英国和澳大利亚电话覆盖；2025
              年首席执行官交接稿也明确提到国内外办公室和国际扩张。这些信号说明，公司已不再只是区域型企业。与此同时，公开记录足够混乱，审慎的尽调备忘录不应过度确定总部信息。


              地点线索指向三个方向。2023 年 PR Newswire 稿件使用 Ellicott City, Maryland 日期线。TrustRadius 和 Slashdot 仍将 Blackpoint 描述为位于
              Maryland 或 Ellicott City。但 2025 年首席执行官交接稿使用 Denver 日期线，2024 年 Denver 开业也被包装成重要战略扩张事件。最稳妥的结论是：Blackpoint 有
              Maryland 历史根基，在 Denver
              拥有大型且越来越可见的存在，并有国际支持足迹；但官网没有清晰披露当前总部呈现方式。反复出现的合作伙伴数量和端点数量说法，也应保持同样谨慎：它们可能方向上正确，但本章没有保留可直接审计的一手来源来支撑这些数字。
