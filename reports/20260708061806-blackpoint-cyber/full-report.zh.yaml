        blocks:
          - type: paragraph
            body: >-
              最大的公开证据缺口是集中度和队列质量。具名案例研究没有披露它们代表多少收入、哪些行业主导客户基础、多少客户流失，或模块扩张随时间如何变化。公开市场和威胁来源支持一个判断：MSP
              交付的安全需求仍有吸引力；但它们没有揭示 Blackpoint 捕获或留住了多少需求。即便地理分布也很模糊：模式看起来高度锚定美国，但公开证据没有建立可靠的分布表。


              尽调的正确下一步不是收集更多轶事式赢单，而是要求公司提供按合作伙伴队列拆分的留存、按 MSP
              和终端市场拆分的客户集中度、按模块拆分的扩张、按分层拆分的引用密度，以及流失原因。只有这样，投资者才能区分强但被精心挑选的证据集，和一个耐久、可复制的客户引擎。
