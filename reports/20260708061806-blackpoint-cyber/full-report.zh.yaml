      - number: '1.2'
        title: 领导层、董事会构成与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              2025 年 6 月，Blackpoint 的领导层发生实质变化。创始人 Jon Murchison 从首席执行官转任执行董事长，Gagan Singh 出任首席执行官。Singh
              的履历更偏规模化软件和网络安全平台，此前曾在 McAfee、NortonLifeLock 和 Avast 任职。官方及渠道报道都把这次调整描述为 Blackpoint 为国际扩张、CompassOne 落地和潜在
              M&A 做准备，而不是危机交接。即便如此，这次交接仍是尽调重点，因为 Murchison 并没有退到象征性的创始人位置：执行董事长职责仍覆盖产品战略、网络响应运营、收购，以及与 MSP 合作伙伴的深度互动。


              领导层页面显示，公司在财务、安全、人力、法务、客户增长、创新和客户成功等职能上已有较完整的高管团队。同一页面也显示，董事会里有 Bain Capital 和 Accel
              代表直接在场。因此，公司治理混合了创始人影响力、运营高管和资方监督。关键人问题不在于 Blackpoint 缺少管理梯队；问题在于，公司的起源故事、产品气质和合作伙伴信任仍与 Murchison
              的经历和公开声音紧密绑定。如果 Blackpoint 最终演进为更宽的平台公司，投资者需要看到 Singh 和其他运营团队能够承接这份品牌资产，同时不稀释公司赖以起家的渠道优先文化。
