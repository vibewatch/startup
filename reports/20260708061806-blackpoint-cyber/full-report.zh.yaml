      - number: '1.3'
        title: 资本形成、投资者基础与披露边界
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清楚的融资事实是 2023 年 6 月的成长轮：Blackpoint 从 Bain Capital Tech Opportunities 和 Accel 融资 $190M，原有投资者 Adelphi
              Capital Partners、Telecom Ventures、Pelican Ventures 和 WP Global Partners
              仍出现在股权结构表语境中。独立媒体报道称，这笔交易让累计融资升至略高于 $200M。CRN 的一篇文章进一步称 Blackpoint 在 2023 年之前已融资 $26M，据此推算公司生命周期融资约为
              $216M，但这个精确小计没有出现在本报告保留的公司官方稿件中。因此，应把它视为中等置信度的交叉验证，而不是公司口径的标准数字。


              比轮次规模更值得注意的是仍未披露的内容。本报告保留的一手融资公告都没有公布投后估值，也没有保留的独立来源给出可核验、并与 2023
              年融资绑定的估值数字。同样不透明的还有年经常性收入（ARR）、收入增长、准确合作伙伴数量、准确端点数量和详细股权结构表。Blackpoint 正在明显扩大平台范围、任命偏规模化的首席执行官，并讨论扩张和
              M&A；在这个背景下，上述披露缺口很实质。这并不意味着业务弱，而是意味着外部投资者无法用接近上市公司的经营指标质量来锚定 Blackpoint 的后期公司画像。
