      - number: '5.2'
        title: 运营模式与检测设计
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的技术价值主张不只依赖软件模块。MDR、SOC 和 Adversary Pursuit Group
              页面把服务运营作为产品本身的一部分：分析师、威胁猎手、响应授权和带上下文的决策，与检测逻辑和工作流软件并列。支撑这种设计的最强公开证据来自 Blackpoint 2026 年威胁报告材料，其中强调可信凭证、RMM
              工具、SSL VPN、假 CAPTCHA 诱饵和其他合法工具利用方式被滥用。这不是只抓明显恶意软件的故事，而是在正常管理界面里发现异常行为，并快速打断。


              这种设计选择对 MSP 密集环境尤其重要，因为攻击面分散，特权工具本来就已存在。Blackpoint
              发布的遥测暗示，产品必须足够快地关联身份、远程管理、云和端点上下文，让人工或自动控制在载荷投递前采取行动。公开来源没有证明系统在实验室条件下相对同行表现如何，但它们显示 Blackpoint
              的检测哲学是面向行为和工作流，而不只是面向签名。
