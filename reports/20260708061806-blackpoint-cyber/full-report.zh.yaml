  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方结构
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的客户模式有两层。直接商业买方通常是 MSP 或渠道合作伙伴，他们把 Blackpoint 嵌入自己的托管安全服务。受保护的终端客户更多是 SMB
              或中端市场组织，它们缺少独自搭建全天候安全运营所需的人员、时间或意愿。这种双层模式重要，因为公司销售的不只是产品满意度，还包括合作伙伴经济性、运营信任和可复制的客户交付。


              案例研究组合和合作伙伴材料指向一个标准化很重要的甜蜜点。MSP 希望交付 24/7 安全结果、证明价值、减少工具蔓延，并避免搭建大型内部 SOC
              团队。这不同于围绕定制安全工程展开的企业直销市场打法。公开证据因此更支持分层逻辑，而不是规模逻辑：Blackpoint 看起来很适合服务较小组织的
              MSP，但公开来源没有可靠披露总客户、合作伙伴、端点、垂直行业或地理组合。
