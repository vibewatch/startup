      - number: '7.3'
        title: 渠道依赖与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Blackpoint 的纯 MSP 模式既是护城河，也是集中度风险。只要伙伴信任保持高位，模式就有差异化；一旦大型 MSP
              整合、切换首选技术栈，或越来越多标准化采用大型套件供应商，同样的聚焦就会变成脆弱点。Microsoft 是最清楚的套件压力样本，因为它能把广泛安全工具、采购便利性和客户装机基础合在一起。Blackpoint
              自己的对比页面也显示，公司正围绕渠道冲突、定价复杂度和平台广度主动作战。证据有用，但也暴露了管理层看到的压力点。


              依赖问题不只在伙伴本身。面向 MSP 的安全服务还依赖 RMM 工具、身份、API 和工作流集成，前述要素都不在 Blackpoint 直接控制之内。RMM、身份、API
              和工作流生态若中断或战略转向，服务交付和续约动态都会受影响。公司未公开披露伙伴集中度，投资人也就无法判断基础盘到底有多分散。
            claimRefs:
