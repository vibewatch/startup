- id: scale-signals-footprint
  title: Scale Signals, Geographic Footprint, and What Remains Unverified
  body: |-
    Blackpoint does provide some credible public scale signals. Its August 2024 Denver office announcement said the company had more than 200 employees and described the Denver site as a second office location, implying an existing primary footprint elsewhere. Contact and leadership pages now show North America, UK, and Australia phone coverage, and the 2025 CEO-transition release explicitly mentions domestic and international office locations and international expansion. Those signals establish a company that is no longer purely regional. At the same time, the public record is messy enough that a careful diligence memo should not overstate certainty about headquarters.

    The location trail runs in three directions. The 2023 PR Newswire release used an Ellicott City, Maryland dateline. TrustRadius and Slashdot still describe Blackpoint as Maryland- or Ellicott City-based. But the 2025 CEO-transition release used a Denver dateline, and the 2024 Denver opening was portrayed as a major strategic expansion event. The safest conclusion is that Blackpoint has historical Maryland roots, a large and increasingly visible Denver presence, and an international support footprint, while exact current headquarters presentation is not crisply disclosed on the public site. The same caution applies to frequently repeated partner-count and endpoint-count claims: they may be directionally true, but this chapter did not retain a direct, auditable primary source that substantiates them.
  claimRefs:
  - CO021
