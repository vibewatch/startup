  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: A directly sourced post-money valuation from the 2023 round or any later financing or secondary event.
    whyItMatters: Without valuation disclosure, later-stage multiple analysis rests on inference instead of a public anchor.
    diligencePath: Request cap-table summary, financing memo, or investor presentation from management or lead investors.
    relatedQuestionRefs:
    - QO009
    - QO025
  - type: private-evidence-only
    severity: material
    topic: scale-disclosure
    missingEvidence: A primary source that directly states current MSP partner count and protected endpoint count.
    whyItMatters: Partner and endpoint figures are central proof points in Blackpoint’s market position and channel scale.
    diligencePath: Request an official partner-count and endpoint-count disclosure or a dated investor metric sheet.
    relatedQuestionRefs:
    - QO016
    - QO025
  - type: conflicting-data
    severity: minor
    topic: founding-conflict
    missingEvidence: An explanation for why a CRN article lists 2007 while official and multiple independent sources list 2014.
    whyItMatters: The discrepancy is not thesis-changing by itself, but it can pollute downstream cross-chapter chronology and external database checks.
    diligencePath: Treat 2014 as canonical unless Blackpoint provides corporate-incorporation documentation showing a different predecessor timeline.
    relatedQuestionRefs:
    - QO023
  - type: conflicting-data
    severity: material
    topic: hq-ambiguity
    missingEvidence: A current, explicit headquarters statement from Blackpoint that reconciles Maryland roots, Denver datelines, and international support presence.
    whyItMatters: Headquarters and footprint ambiguity complicate legal, hiring, tax, and diligence workflows and creates database drift.
    diligencePath: Ask management for legal entity headquarters, executive headquarters, and operating-office list as of run date.
    relatedQuestionRefs:
    - QO017
    - QO023
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-partial-coverage
    missingEvidence: A fuller public organization chart and explicit succession planning for the senior leadership and board roster.
    whyItMatters: The leadership table is intentionally partial because Blackpoint publishes role names but not a complete organization chart, committee structure, or succession framework.
