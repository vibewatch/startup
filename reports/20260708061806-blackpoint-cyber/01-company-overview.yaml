company:
  name: Blackpoint Cyber
chapter:
  number: 1
  title: Company Overview
  summary: Blackpoint Cyber is a late-stage MSP-first cybersecurity company founded in 2014 by former NSA operator Jon Murchison. Public evidence shows a decisive broadening of its story from pure MDR into the CompassOne posture-and-response platform after a $190 million Bain/Accel-led growth round in 2023 and a June 2025 CEO transition to Gagan Singh, but valuation, exact partner count, exact endpoint count, and even current headquarters presentation remain partially opaque.
sections:
- id: identity-business-model
  title: Identity, Product Scope, and MSP-First Operating Model
  body: |-
    Blackpoint Cyber’s public materials consistently position the company as an MSP-first cybersecurity vendor built around managed detection and response rather than as a traditional direct-enterprise MSSP. The homepage, partner page, and 2023 funding announcement all stress the same core proposition: Blackpoint’s 24/7 Security Operations Center acts on behalf of MSP partners and their downstream customers rather than simply forwarding alerts. That distinction matters because the company’s go-to-market motion, product decisions, and customer proof all sit inside the managed-service-provider ecosystem.

    By mid-2026, Blackpoint’s product scope is clearly broader than pure MDR. Official pages show CompassOne, LogIC SIEM, ITDR, cloud posture, vulnerability management, asset inventory, application control, and tenant administration under a single platform umbrella. The strategic message is that Blackpoint wants to consolidate fragmented security tooling for MSPs while preserving the human-led SOC layer that made its MDR brand credible. Customer proof sources reinforce that the appeal is not only better detection, but lower false-positive burden, faster response, and a partner that will take action when in-house teams are offline. This combination of channel-first delivery and growing platform breadth is the company’s defining identity as of the run date.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO025
  - CO027
  figureRefs:
  - FO002
- id: leadership-governance
  title: Leadership, Board Composition, and Key-Person Dependence
  body: |-
    Blackpoint’s leadership picture changed materially in June 2025. Founder Jon Murchison moved from CEO to executive chairman while Gagan Singh became chief executive officer. Singh’s resume is more scaled-software and cybersecurity-platform oriented than intelligence-community oriented, with prior roles at McAfee, NortonLifeLock, and Avast. Official and channel coverage frame the move as preparation for Blackpoint’s next phase of international expansion, CompassOne execution, and possible M&A, not as a crisis handoff. Even so, the transition is important for diligence because Murchison did not recede into a symbolic founder role: his executive-chairman remit still covers product strategy, cyber response operations, acquisitions, and deep engagement with MSP partners.

    The leadership page shows a reasonably complete senior team across finance, security, people, legal, customer growth, innovation, and client success. The same page also reveals direct investor presence on the board through Bain Capital and Accel representatives. Governance therefore blends founder influence, operating executives, and sponsor oversight. The key-person issue is not that Blackpoint lacks an executive bench; rather, it is that the company’s origin story, product ethos, and partner credibility are still tightly linked to Murchison’s experience and public voice. If Blackpoint ultimately evolves into a broader platform company, investors will want evidence that Singh and the rest of the operating team can carry that brand equity without diluting the channel-first culture that built the business.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO034
