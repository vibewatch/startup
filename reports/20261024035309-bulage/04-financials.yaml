  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: Signed customer contracts, invoices, collections, revenue-recognition policy, and product-level revenue split.
      whyItMatters: Without realized revenue evidence, the reported valuation cannot be tested against recurring, transactional, or services economics.
      diligencePath: Obtain monthly management accounts and a revenue-recognition memo, then tie reported revenue to contracts and bank receipts.
      relatedQuestionRefs: [QI001]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, monthly burn, committed capex, debt, restricted cash, runway, and next-round trigger.
      whyItMatters: Funding raised is not cash available, and liquidity risk can force financing before commercial validation.
      diligencePath: Request a 24-month cash bridge, bank statements, debt schedule, capex plan, and board-approved financing plan.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: SKU-level list and realized prices, bill of materials, compute and service costs, warranty reserves, and contribution margin.
      whyItMatters: Market ASPs and peer margins do not establish Bulage's own unit economics or margin path.
      diligencePath: Reconcile a representative customer transaction from quotation through delivery, support, collections, and gross-profit accounting.
      relatedQuestionRefs: [QI003, QI004, QI008]
      relatedTableRefs: [TI002]
    - type: missing-source
      severity: material
      topic: commercial-concentration
      missingEvidence: Customer pipeline, pilot-to-production conversion, customer concentration, cancellation terms, and deployment utilization.
      whyItMatters: A crowded market and immature use cases can make nominal pipeline or pilots poor predictors of durable revenue.
      diligencePath: Review the CRM, signed pilots, deployment logs, renewal terms, and referenceable customer outcomes.
      relatedQuestionRefs: [QI005, QI006]
    - type: stale
      severity: material
      topic: financing
      missingEvidence: A current primary-source financing announcement, capitalization table, and investor rights package.
      whyItMatters: Media reports can compress round size, valuation, ownership, and cash availability into a single headline.
      diligencePath: Obtain the definitive financing documents and reconcile proceeds, post-money ownership, liquidation preferences, and use-of-funds covenants.
      relatedQuestionRefs: [QI002]
