chapter:
  number: 4
  title: Financials
  summary: Public evidence identifies a large reported financing and valuation, but does not disclose Bulage revenue, pricing, gross margin, cash balance, burn, runway, or customer economics. The sector context supports a potentially large commercialization opportunity while also showing immature business models, concentration among better-capitalized peers, and bubble risk.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Bulage's public financial profile is unusually thin for a company reported at a $2 billion post-money valuation. A June 2026 Crunchbase report identifies Shanghai-based Bulage as a robotics-intelligence company that raised a $220 million seed round and was valued at $2 billion, but it does not provide revenue, customers, pricing, gross margin, shipment volume, or contract terms. A contemporaneous Chinese technology report describes the direction as world models and an embodied brain, while stating that the financing was led by Gaorong Capital and HSG with Tencent participating; that is financing evidence, not evidence of recurring revenue or realized unit economics. Sector research indicates that the broader Chinese humanoid market is moving from technology verification toward commercialization, with reported price bands and software, integration, and maintenance layers, but these are market benchmarks rather than Bulage disclosures. Underwriting therefore requires a clear separation between reported capital formation, company or media descriptions of product ambition, and verified customer cash receipts.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-cost-drivers
    title: Pricing, cost structure, and margin path
    body: >-
      No assigned source publishes Bulage's list price, realized price, take rate, bill of materials, cloud or compute cost, service-delivery cost, warranty exposure, or gross margin. The ResearchAndMarkets summary, distributed through GlobeNewswire, estimates Chinese humanoid robot price tiers of RMB 100,000-200,000, RMB 250,000-500,000, and above RMB 500,000, and separately estimates software, systems integration, and maintenance revenue; its methodology combines public data and industry interviews. Those figures can frame diligence questions but cannot be mapped to Bulage's business model because the sources do not establish whether Bulage sells robots, licenses models, supplies software, or combines these activities. TrendForce reports that Unitree's combined gross margin across quadruped and humanoid segments reached 60% in 2025, while also describing AgiBot's order-driven manufacturing and supply-chain arrangements. These peer observations suggest that manufacturing scale and supply control may determine margin outcomes, but they are not comparable company metrics. The financial model should remain scenario-based until Bulage provides product-level pricing, cost accounting, and contract evidence.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The reported $220 million seed round gives Bulage meaningful gross financing capacity relative to an early-stage robotics company, but public evidence does not show how much cash remains, the pace of spending, debt or project-finance obligations, planned use of funds, or the next-round trigger. A large financing balance should not be treated as cash available: fees, restricted proceeds, operating losses, capitalized equipment, and staged investment could materially reduce liquidity. Market forecasts show why additional capital may be available to strong operators: CNBC reports Morgan Stanley's 2026 China humanoid shipment forecast at 50,000 units and a $2 billion market estimate, while TrendForce highlights peers with production expansion and financing-market effects. The adverse case is equally material: Unite.AI reports an NDRC warning that more than 150 companies were flooding the market with nearly identical products and that technological pathways, business models, and application scenarios had not fully matured. Bulage may have financing runway to pursue platform development, but the public record cannot establish revenue quality, path to gross-profit breakeven, or whether follow-on financing is optional. The underwriting verdict is research-more, contingent on primary financial statements, bank evidence, customer contracts, and a bottoms-up cash plan.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
callouts:
  - calloutType: risk
    title: Financial underwriting gap
    body: The reported valuation and financing are visible, but revenue, cash, burn, runway, pricing, and customer economics remain unavailable in the assigned public evidence.
    claimRefs: [CI002, CI009, CI012]
  - calloutType: recommendation
    title: Diligence condition
    body: Require monthly management accounts, bank statements, signed customer contracts, product-level gross-margin bridges, and a 24-month cash plan before underwriting the reported valuation.
    claimRefs: [CI009, CI012]
