evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: disclosure
    missingEvidence: Audited or management-provided revenue, customer, headcount, cash, runway, and product-operating data.
    whyItMatters: The reported valuation cannot be tested against operating performance without these metrics.
    diligencePath: >-
      Request a current data room with monthly financials, customer contracts, payroll/headcount, bank balance, and
      product KPIs.
    relatedQuestionRefs:
      - QO001
      - QO006
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founder, executive, board, investor-rights, and succession enumeration.
    whyItMatters: Founder concentration and governance quality are not assessable from one named leader.
    diligencePath: Obtain the cap table, charter, board minutes, executive roster, and key-person insurance or succession plan.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Executed financing documents reconciling the reported $220 million amount and approximately $2 billion post-money
      valuation.
    whyItMatters: >-
      Media reports may omit instrument terms, option-pool treatment, or non-cash components that change economic
      dilution.
    diligencePath: Reconcile signed term sheets, capitalization tables, investor wires, and any debt or secondary transactions.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: product-direction
    missingEvidence: Direct company product, safety, deployment, and customer-pilot evidence.
    whyItMatters: Industry forecasts and founder history do not establish that Bulage has a working product or commercial traction.
    diligencePath: >-
      Request a technical demo, product roadmap, deployment logs, pilot statements of work, and safety/compliance
      documentation.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: blocking
    topic: company-specific-sizing
    missingEvidence: Bulage product scope, target workflows, pricing, paid deployments, and obtainable-market assumptions.
    whyItMatters: Category growth cannot be translated into Bulage revenue or valuation without a defined product and buyer.
    diligencePath: >-
      Request a management market model with product-level pricing, named customer segments, pipeline conversion,
      deployment economics, and a reconciled SAM/SOM bridge.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
  - type: conflicting-data
    severity: material
    topic: shipments
    missingEvidence: A common definition reconciling Morgan Stanley's external-sales estimates with CMG's domestic shipment counts.
    whyItMatters: The estimates differ materially and could change the implied pace of commercialization and component demand.
    diligencePath: >-
      Obtain the underlying methodologies, inclusion rules, geography, and shipment dates from each publisher or a
      primary industry dataset.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: Task-level customer outcomes, deployment payback, service costs, safety acceptance, and repeat-order rates.
    whyItMatters: Adoption may remain demonstration-led if buyers cannot clear ROI and reliability hurdles.
    diligencePath: >-
      Request anonymized pilot scorecards and production contracts showing baseline labor or throughput, robot
      utilization, uptime, and renewal or expansion terms.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: stale
    severity: minor
    topic: household-adoption
    missingEvidence: Updated household product pricing, safety approvals, and consumer willingness-to-pay as the category develops.
    whyItMatters: Household adoption is a longer-dated adjacency and should not be used to support near-term Bulage revenue.
    diligencePath: Recheck consumer launches, regulatory requirements, pre-orders, and independent user evidence in the next refresh.
    relatedQuestionRefs:
      - QM004
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Bulage and competitor list prices, contract structures, deployment fees, support terms, and realized
      discounting.
    whyItMatters: >-
      Without packaging and realized price evidence, capability comparisons cannot establish economic differentiation or
      switching-cost leverage.
    diligencePath: >-
      Request competitor quote sheets and Bulage customer proposals for the same task, including hardware, software,
      integration, support, and renewal terms.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat
    missingEvidence: >-
      Named Bulage customers or pilots with task-level outcomes, repeat deployments, and evidence of model performance
      across hardware.
    whyItMatters: A strategic direction is not evidence of a defensible moat against scaled manufacturers and integrators.
    diligencePath: >-
      Obtain customer references, deployment logs, task success metrics, uptime, intervention rates, and evidence of
      repeat or expanded contracts.
    relatedQuestionRefs:
      - QP004
      - QP009
  - type: enumeration-incomplete
    severity: minor
    topic: competitors
    missingEvidence: >-
      A complete list of Chinese, U.S., and European direct, adjacent, and status-quo alternatives with current product
      and channel evidence.
    whyItMatters: >-
      The assigned pool supports a useful initial landscape but cannot prove that all likely entrants or internal-build
      alternatives are covered.
    diligencePath: >-
      Refresh with named competitor-class searches and collect official product, pricing, security, channel, and
      customer references for each material alternative.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Signed customer contracts, invoices, collections, revenue-recognition policy, and product-level revenue split.
    whyItMatters: >-
      Without realized revenue evidence, the reported valuation cannot be tested against recurring, transactional, or
      services economics.
    diligencePath: >-
      Obtain monthly management accounts and a revenue-recognition memo, then tie reported revenue to contracts and bank
      receipts.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, committed capex, debt, restricted cash, runway, and next-round trigger.
