  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: financing-terms
      missingEvidence: "Signed financing documents, capitalization table, share price, preference stack, option pool, and investor rights for the reported round."
      whyItMatters: "A headline post-money valuation cannot support entry returns or dilution analysis without the securities and ownership mechanics."
      diligencePath: "Obtain the executed term sheet, cap table, shareholder agreement, and preference schedule under confidentiality."
      relatedQuestionRefs: [QV001, QV004]
    - type: private-evidence-only
      severity: material
      topic: company-financials
      missingEvidence: "Verified revenue, paid deployments, gross margin, burn, runway, and customer-level outcomes."
      whyItMatters: "Market forecasts cannot be converted into Bulage value without evidence of company-level traction and economics."
      diligencePath: "Request monthly management accounts, deployment contracts, cohort economics, bank statements, and a customer reference call list."
      relatedQuestionRefs: [QV003, QV006, QV009]
    - type: missing-source
      severity: material
      topic: regulation
      missingEvidence: "Bulage's target geographies, safety case, data controls, conformity plan, and applicable robotics approvals."
      whyItMatters: "AI and embodied-robot deployments can incur certification, monitoring, liability, and market-access costs that affect timing and margins."
      diligencePath: "Commission legal and technical diligence covering target-country AI, product-safety, privacy, export-control, and workplace rules."
      relatedQuestionRefs: [QV008]
