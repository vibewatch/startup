chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a large and expanding humanoid-robot opportunity, but does not provide Bulage revenue, unit economics, cap-table terms, or a verified current financing price. The reported $2 billion post-money valuation therefore warrants research-more rather than a buy decision.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The investable thesis is that Bulage may be entering a market with unusually strong
      capital and commercialization momentum. CNBC reports Morgan Stanley expects China to
      ship 50,000 humanoid robots in 2026, up from its prior 28,000 forecast, and estimates
      a $2 billion market in 2026 growing to $15 billion by 2030. TrendForce separately
      expects global commercialization to enter a critical phase in the second half of 2026
      and says China output could grow 94% in 2026. Those figures describe the market, not
      Bulage, and neither source establishes that Bulage has shipped a product, secured
      customers, or captured a share. The anti-thesis is valuation risk: the reported
      financing is a media account rather than a filing or company disclosure, while an
      NDRC warning cited by Unite.AI says more than 150 companies are offering similar
      products and that business models and application scenarios are not yet mature.
      Without verified company-level traction, the market growth case is not sufficient to
      underwrite a $2 billion entry price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: price-discipline
    title: Financing context and entry discipline
    body: >-
      The strongest available company-specific valuation evidence is a June 2026 report
      that attributes to The Information a first financing of several hundred million
      dollars at an approximately $2 billion post-money valuation, with Gaorong Capital and
      Sequoia China described as co-leads at $100 million each and Tencent as a $20 million
      participant. The same report says the transaction had closed and that Lin Junyang was
      seeking another round, but it does not provide a term sheet, share count, liquidation
      preference, option-pool treatment, dilution schedule, or audited financials. The
      correct underwriting posture is consequently price-sensitive: treat $2 billion as a
      reported mark, not a verified fair value; require the signed financing documents and
      cap table before assigning ownership-adjusted returns; and avoid converting the
      reported raise into ARR, revenue, or cash runway. Public comparables are also
      imperfect. ABB's market capitalization was listed at $148.55 billion in October
      2026, but ABB is a diversified public industrial company rather than a seed-stage
      embodied-AI laboratory, so its multiple is a scale reference, not a direct Bulage
      comparable.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      A scenario framework is more defensible than a point valuation because Bulage's
      disclosed revenue, shipments, margins, retention, customers, and financing terms are
      missing from the assigned evidence. The bull case requires evidence that Bulage has a
      differentiated model or robot stack, paid deployments, repeatable unit economics,
      and financing terms that do not impose hidden preference overhang. The base case
      assumes the sector grows but Bulage remains an early laboratory with uncertain
      commercialization, making a reported $2 billion mark difficult to validate. The bear
      case combines sector crowding, delayed use cases, and financing compression; Unite.AI
      reports the sector warning and notes that more than 10,000 units were projected for
      industry-wide 2025 shipments, a small base relative to the investment activity. Exit
      readiness is therefore unproven. An investor should require named customers, paid
      pilots, deployment outcomes, cash burn and runway, the full cap table, preference
      terms, governance rights, and safety/compliance evidence. A thesis break is a
      failed financing at materially lower terms, inability to demonstrate paid repeat
      deployments, or evidence that the reported valuation cannot be reconciled to
      ownership and preference economics.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
callouts:
  - calloutType: recommendation
    title: Research-more at the reported price
    body: >-
      Public market evidence is constructive, but company-level valuation support is too
      thin to justify a buy. Move toward investable only after financing documents,
      cap-table economics, and paid deployment evidence reconcile the reported $2 billion
      mark.
    claimRefs: [CV006, CV010, CV014]
  - calloutType: risk
    title: Bubble and commercialization risk
    body: >-
      The sector's growth forecasts are accompanied by an official-policy warning, as
      reported by Unite.AI, that product homogeneity and immature business models could
      compress returns before scale economics are proven.
    claimRefs: [CV004, CV005, CV013]
