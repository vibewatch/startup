callouts:
  - calloutType: insight
    title: The product is not yet independently legible
    body: >-
      Bulage has a reported direction and founder pedigree, but the assigned evidence does not
      identify a product boundary, release artifact, deployment, or technical performance measure.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Commercial proof is the gating milestone
    body: >-
      Market growth forecasts do not resolve whether Bulage can move from an embodied-AI thesis to
      safe, reliable, supported customer operations.
    claimRefs: [CE009, CE010, CE011, CE013]
