      - ["Embodied brain", "Robot operators", "Directional thesis only", "Founder statement is linked to action-oriented thinking", "Decision stack, task success, and safety envelope unavailable"]
      - ["Physical robot or embodied asset", "Industrial or consumer users", "Undisclosed", "No named Bulage SKU or robot is identified", "Hardware design, supplier access, and certification unavailable"]
      - ["Deployment and support layer", "Enterprise deployment teams", "Undisclosed", "No Bulage customer or production site is identified", "Integration, uptime, maintenance, and acceptance evidence unavailable"]
    notes: >-
      Bulage-specific maturity is based on the retained company report; comparator evidence is
      contextual and does not establish that Bulage has shipped any listed module.
    claimRefs: [CE001, CE002, CE003, CE004]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow or market pattern, Potential company solution, Measurable benefit, Limitation]
    rows:
      - ["Plan physical tasks", "Human or scripted robot planning", "World-model and embodied-brain thesis", "No Bulage metric disclosed", "Architecture is unverified"]
      - ["Execute manipulation", "Dedicated control and path planning", "Brain plus real-time control stack", "No Bulage task-success rate disclosed", "Industry commentary says the control layer is less mature"]
      - ["Operate in factories or logistics", "Demonstrations and emerging production deployments", "Integrated robot workflow", "Peers report commercial verification", "Bulage deployment and uptime are unverified"]
      - ["Serve retail or interactive settings", "Experience stores and interactive services", "Potential embodied service workflow", "Market reports growing rollouts", "No Bulage site, customer, or support evidence"]
    notes: >-
      The table combines a diligence hypothesis for Bulage with industry observations; “potential”
      is not a product claim and no measurable Bulage benefit is asserted.
    claimRefs: [CE005, CE006, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - ["Perception and semantic understanding", "Convert physical observations into state", "Multimodal sensors and models", "Accuracy under edge cases and sensor failure"]
      - ["World model or foundation model", "Represent environment and predict action consequences", "Data, simulation, compute, and model evaluation", "Generalization and inference cost"]
      - ["Decision and planning", "Select and sequence actions", "Task policies and safety constraints", "Hallucinated plans and policy-boundary violations"]
      - ["Real-time motor control", "Convert plans into stable movement", "Low-latency control and path planning", "Timing, collision, and recovery failures"]
      - ["Hardware and supply chain", "Provide actuators, sensors, batteries, and mechanics", "Qualified suppliers and manufacturing process", "Cost, availability, and field repair"]
      - ["Deployment and governance", "Operate safely in customer environments", "Monitoring, permissions, privacy, and incident response", "No public Bulage controls or certifications retained"]
    notes: >-
      This is an analytical architecture map informed by industry commentary and peer disclosures;
      it is not a disclosed Bulage architecture.
    claimRefs: [CE006, CE007, CE013, CE014, CE015]
