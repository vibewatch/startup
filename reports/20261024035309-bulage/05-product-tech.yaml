company:
  name: Bulage
chapter:
  number: 5
  title: Product & Technology
  summary: Public evidence identifies Bulage as a newly formed AI laboratory focused on world models and an embodied “brain,” but does not yet document a shippable product, technical architecture, deployment record, or control system. Industry evidence shows that commercialization is moving from demonstrations toward factory, logistics, and retail use while safety, integration, and product-market fit remain material gating risks.
sections:
  - id: product-scope
    title: Product scope and maturity
    body: >-
      The strongest company-specific public description is directional rather than productized. A
      report on Bulage says its focus is “world models and embodied brains,” and links the direction
      to founder Lin Junyang’s prior work leading Qwen. It does not identify a named robot, model
      release, API, SKU, customer deployment, supported task, or measurable performance target. That
      makes Bulage best treated as a pre-product or undisclosed platform effort for diligence
      purposes, not as a verified robot manufacturer. The distinction matters because industry
      reporting describes a market moving from demonstrations toward external commercial sales, while
      prototype, internal-use, and pre-order units can inflate apparent maturity. Bulage’s current
      maturity therefore rests on founder provenance and financing visibility, not independently
      verified product evidence.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: operating-workflow
    title: Operating model and architecture
    body: >-
      A plausible embodied-AI operating model has at least a perception and semantic layer, a
      foundation or world-model layer, decision and planning, real-time motor control, and a
      physical robot and deployment layer. Industry commentary explicitly separates a “brain” for
      decision-making and planning from a less mature “cerebellum” for real-time motor control and
      path planning. That distinction is useful as a diligence map, but it is not evidence that
      Bulage has implemented each layer. The available Bulage reporting does not disclose training
      data, model latency, hardware interfaces, simulation stack, safety envelope, or integration
      protocol. Any underwriting assumption that Bulage owns a complete robot stack should therefore
      be marked unverified until technical artifacts or live deployments are produced.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]
  - id: commercialization
    title: Deployment, integration, and reliability
    body: >-
      External benchmarks show both a credible commercialization path and a demanding execution
      bar. Morgan Stanley’s June 2026 forecast, as reported by CNBC, expects 50,000 China humanoid
      shipments in 2026 and 446,000 in 2030, excluding prototypes, pre-order trials, and internal
      use. TrendForce likewise describes a second-half-2026 shift toward tangible user value, while
      reporting that leading peers are scaling production and standardized supply chains. These
      signals establish an addressable deployment environment, not Bulage traction. Other coverage
      warns that many automotive “deployments” are strategic tie-ups rather than sales and that
      embodied intelligence still lacks a clear revenue path. Bulage needs evidence of production
      integration, uptime, task success, support ownership, and acceptance criteria before those
      market benchmarks can be applied to it.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: differentiation-risk
    title: Differentiation, trust, and technical risk
    body: >-
      Bulage’s possible differentiation is currently a hypothesis: founder experience in open
      model development and a stated focus on world models could support a software-led approach,
      but no Bulage patent, benchmark, open-source repository, certification, security statement, or
      customer reference is retained in the assigned evidence. Competitive evidence shows that
      peers are investing in multimodal models, embodied datasets, motion control, dexterous
      hardware, and manufacturing capacity, raising the bar beyond a general “embodied brain”
      narrative. China’s NDRC has also warned that more than 150 companies have similar products and
      that technology paths, business models, and use cases are not fully mature. The central
      diligence risk is not a disproven technology claim; it is the absence of verifiable evidence
      that Bulage has converted a thesis into a differentiated, safe, supportable system.
    claimRefs: [CE013, CE014, CE015, CE016]
  - id: exhibits
    title: Evidence-backed exhibits
    body: >-
      The exhibits separate Bulage-specific disclosures from market comparators and unresolved
      implementation questions. Comparator metrics are not substitutes for Bulage evidence. Null
      cells identify information that cannot be responsibly inferred from the assigned sources. This
      presentation also prevents a peer's production scale, architecture, or certification from
      being mistaken for Bulage's own maturity. The most decision-relevant missing artifacts are a
      product boundary, a technical release, a deployment record, and evidence of safe operation in
      a customer environment. Until those are available, the exhibits support a diligence plan and
      risk framing rather than a verified product score.
    claimRefs: [CE001, CE009, CE013]
tables:
  - id: TE001
