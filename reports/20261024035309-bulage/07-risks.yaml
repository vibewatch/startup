    rows:
      - [Dual-use export classification and authorization, EU, medium, high, "Not evidenced", "High until product scope and destinations are mapped", "Obtain a written EU 2021/821 classification and licensing memo"]
      - [EAR classification and end-use controls, United States, medium, high, "Not evidenced", "High for controlled hardware, software, or technical assistance", "Map products, users, destinations, and support flows to the official EAR"]
      - [Sanctions and export-control evasion exposure, "EU / G7-linked trade", medium, high, "Not evidenced", "High where intermediaries or end users are unclear", "Implement screening, end-use certificates, records, and escalation ownership"]
      - ["Licensing, privacy, safety, or product-liability obligations", "Target markets", unknown, high, "Not disclosed", "Material and unquantified", "Commission a market-entry compliance and safety gap assessment"]
    enumerationScope:
      coverage: partial
      basis: "Publicly available regulatory frameworks and reported robotics transactions; Bulage-specific records are incomplete."
    notes: Regulatory framework facts come from the European Commission and BIS; Bulage-specific licensing and compliance status are not publicly evidenced, so likelihood and residual exposure are diligence judgments rather than confirmed incidents.
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Prototype-to-production failure, high, high, "Not evidenced", "High", "No public production deployment or conversion denominator"]
      - [Safety or reliability failure in physical environments, medium, high, "Not disclosed", "High", "No public incident, test, certification, or uptime record"]
      - [Homogeneous-market competition and price pressure, high, high, "Not evidenced", "High", "No defensible product differentiation or cost curve disclosed"]
      - [Cash intensity and financing dependence, unknown, high, "Not disclosed", "High", "No burn, runway, margin, or working-capital evidence"]
    notes: Rows synthesize sector evidence from TrendForce, Unite.AI, CNBC, and the reported Bulage financing article; no row asserts that Bulage has suffered the failure mode.
    claimRefs: [CR005, CR006, CR007, CR008, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or layer, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Critical robotics components, "Unidentified suppliers", "Actuators, sensors, compute, or bodies", "Unknown", "Delay, allocation, or cost shock blocks delivery", high, "Qualify alternates and hold critical inventory", "High until supplier map and lead times are disclosed"]
      - [Foundation models and cloud infrastructure, "Unidentified providers", "Model training, inference, or tooling", "Unknown", "Access, price, or policy change interrupts product", high, "Document portability, fallback models, and service-level controls", "High"]
      - [International distribution and technical support, "Unidentified partners", "Market access and deployment", "Unknown", "Export restriction or partner failure blocks a region", medium, "Use compliance-screened channels and regional substitutes", "Medium to high"]
    notes: Bulage counterparties and concentration are not identified in the assigned sources; the rows are control questions anchored by the sector supply-chain and geopolitical evidence, not confirmed relationships.
    claimRefs: [CR009, CR010, CR011, CR012]
figures:
  - id: FR001
    title: Risk heatmap
    summary: Current evidence places the largest residual exposures in compliance, commercialization, safety, and dependency controls that remain unverified for Bulage.
    type: matrix
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual exposure, Evidence basis]
      rows:
        - label: Export-control and sanctions compliance
          values: [Medium, High, Unverified, High, "EU / US frameworks"]
        - label: Prototype-to-production conversion
          values: [High, High, Unverified, High, "Sector evidence"]
        - label: Physical safety and reliability
          values: [Medium, High, Unverified, High, "Bulage gap"]
        - label: Homogeneous competition and price pressure
          values: [High, High, Low evidence, High, "NDRC warning"]
        - label: Supplier and infrastructure concentration
          values: [Unknown, High, Unverified, High, "Supply-chain context"]
        - label: Financing and runway dependence
          values: [Unknown, High, Unverified, High, "Financial disclosure gap"]
    approximationNotes: Likelihood and residual exposure are qualitative evidence-based assessments; no numeric probabilities or Bulage-specific incident rates are available.
    claimRefs: [CR013, CR014, CR015, CR016]
callouts:
  - calloutType: risk
    title: Primary thesis risk
    body: Bulage's reported capital formation is not evidence of production readiness, customer retention, safety controls, or regulatory clearance; underwriting should remain conditional on those disclosures.
    claimRefs: [CR007, CR013, CR016]
  - calloutType: recommendation
    title: Immediate diligence gate
    body: Require a product-and-jurisdiction compliance map, named production deployments with outcomes, supplier and model dependency disclosure, and cash-runway evidence before treating the reported financing valuation as investable.
    claimRefs: [CR003, CR009, CR014, CR015]
