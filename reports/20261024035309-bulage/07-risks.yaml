company:
  name: Bulage
chapter:
  number: 7
  title: Risks
  summary: Public evidence points to material regulatory, commercialization, concentration, and execution risks for Bulage, while company-specific controls, incidents, customer exposure, and financial resilience remain largely undisclosed.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Bulage's public evidence does not establish that it has obtained, needs, or lacks any
      particular license, approval, certification, or litigation clearance. The relevant exposure
      is nevertheless material because the EU regime governs export, transit, brokering, and
      technical assistance for dual-use items, while the US EAR is a broad control framework whose
      official resource cautions that its interactive presentation is not the official legal
      edition. A company building embodied-AI systems may therefore face classification,
      end-use, destination, record-keeping, and compliance questions before selling or supporting
      systems internationally. The evidence supports a diligence requirement, not a finding that
      Bulage has violated a rule. The highest-value next step is a jurisdiction-by-jurisdiction
      product classification and export-control memo tied to actual components, model access, and
      technical support.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: market-and-execution
    title: Commercialization and execution risk
    body: >-
      The sector backdrop is simultaneously a validation opportunity and a risk amplifier.
      TrendForce describes commercialization moving toward tangible user value, but its report also
      highlights rapid scaling by established peers and component suppliers. Unite.AI reports an
      NDRC warning that more than 150 Chinese companies are pursuing humanoid robotics and that
      technological pathways, business models, and application scenarios have not fully matured.
      CNBC likewise reports that Morgan Stanley's shipment forecast excludes prototypes, pre-order
      trials, and internal use, which is an important denominator distinction when interpreting
      market growth. Bulage's reported financing and founder pedigree do not demonstrate repeatable
      deployments, safety performance, unit economics, or a defensible production advantage. Those
      missing operating proofs create execution risk even if the market expands.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-concentration
    title: Partner, supply-chain, and geopolitical dependencies
    body: >-
      Public materials do not identify Bulage's suppliers, cloud or model providers, distributors,
      anchor customers, or geographic revenue mix. That absence prevents a quantified concentration
      assessment rather than proving that concentration is low. The surrounding market evidence
      shows why dependency mapping matters: TrendForce describes standardized supply chains and
      order-driven manufacturing as important to scale, while CNBC reports that overseas robotics
      operators are responding to geopolitical uncertainty through geographic diversification and
      local regulatory compliance. The EU and US control frameworks add a second dependency layer
      for components, software, and technical assistance. Bulage should disclose critical suppliers,
      single-source parts, model and cloud dependencies, customer concentration, export
      restrictions, and substitution lead times before an investment decision.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring indicators and thesis-break triggers
    body: >-
      The appropriate risk posture is research-more until Bulage provides operating evidence that
      converts a high-profile financing story into a measurable business. Monitoring should focus
      on production deployments rather than demonstrations; paid repeat usage rather than logos;
      gross margin and cash runway rather than funding raised; incident and safety reporting rather
      than the absence of public complaints; and export-control compliance by product and
      destination. A thesis break would be a confirmed material compliance breach, an inability to
      obtain required approvals, repeated pilot failure without conversion, a single-source
      dependency without a qualified substitute, or financing needs that materially dilute the
      reported entry thesis. These triggers are intentionally conditional because the assigned
      public sources do not disclose Bulage-specific operating denominators.
    claimRefs: [CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
tables:
