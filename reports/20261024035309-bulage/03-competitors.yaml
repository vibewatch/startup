      - [AgiBot, Direct embodied-robot manufacturer, "10,000th general-purpose embodied robot; output rose from 1,000 to 5,000 and then 10,000 units", "Automotive, consumer electronics, logistics", "Standardized supply chain and order-driven flexible production", "Public evidence does not establish unit economics or retention"]
      - [UBTech Robotics, Direct industrial humanoid manufacturer, "Orders exceeding 800 million yuan for Walker series in 2025; planned 5,000-unit 2026 capacity", "Factories and logistics", "Named automaker and Foxconn relationships; Walker series", "Reported orders and planned capacity are not audited revenue"]
      - [Agile Robots, Adjacent automation integrator, "Acquired thyssenkrupp Automation Engineering business, subject to regulatory approvals", "Industrial automation buyers", "End-to-end intelligent components to turnkey systems", "Adjacent system-provider model may not compete as a general-purpose model platform"]
    notes: "Sources are public reporting, analyst commentary, and a law-firm transaction announcement; scale figures use each source's stated period and are not normalized for revenue, shipments, or accounting treatment."
    claimRefs: [CP001, CP002, CP003, CP011]
  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, Bulage, Unitree or AgiBot, UBTech or Agile Robots, Evidence implication]
    rows:
      - [General-purpose embodied intelligence, "World models and embodied brain are reported as the intended direction; implementation details unknown", "TrendForce reports LLM integration and general-purpose robot commercialization", "Agile Robots is described as combining robotics and AI in industrial solutions", "Bulage's software differentiation is plausible but unverified"]
      - [Production and supply chain, "No retained source establishes production volume or manufacturing footprint", "AgiBot has reported 10,000-unit milestone and standardized supply chain", "UBTech plans capacity expansion; Agile offers turnkey integration", "Scale and delivery readiness favor incumbents on current evidence"]
      - [Industrial distribution, "No named customer, pilot, or channel evidence in retained sources", "AgiBot orders span automotive, consumer electronics, and logistics", "UBTech customers include BYD, Geely Auto, FAW-Volkswagen, and Foxconn", "Reference accounts and integration capability may raise switching costs"]
      - [Pricing and packaging, "Unknown", "No comparable list or realized pricing in retained sources", "No comparable list or realized pricing in retained sources", "Do not infer price advantage or margin from shipment forecasts"]
    notes: "Unknown denotes absent evidence in the assigned pool, not evidence that the capability is absent. Vendor comparison statements are not treated as independent benchmarks."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing, packaging, and strategic implications
    columns: [Alternative, Price or contract model, Included capabilities, Discount or unknowns, Strategic implication]
    rows:
      - [Bulage, Unknown, "Reported world-model and embodied-brain direction; product package unknown", "No public price, contract, deployment, or service terms retained", "Commercial model and monetization remain a primary diligence gap"]
      - [Scaled humanoid purchase, "Unit price and contract terms not comparable in retained sources", "Robot hardware plus vendor software and support, scope varies", "External sales can be distinguished from prototypes, trials, and internal use", "Shipment growth should not be treated as recurring software revenue"]
      - [Industrial integrator or internal build, "Project or turnkey contract; terms unknown", "Components, integration, and potentially full deployment", "Customer-specific engineering and switching costs are not disclosed", "Integration access may matter as much as model quality"]
    notes: "No source in the assigned pool provides a comparable realized price. The table preserves unknowns instead of converting capacity, orders, or market forecasts into pricing."
    claimRefs: [CP007, CP008, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "An ordinal evidence map places competitors by publicly evidenced deployment scale and degree of integrated solution scope; coordinates are analytical scores, not market-share measurements."
    data:
      xAxis: "Publicly evidenced deployment or production scale (ordinal 1-5)"
      yAxis: "Integrated solution scope (ordinal 1-5)"
      points:
        - {label: "Bulage", x: 1, y: 2, note: "Direction is reported, but no retained evidence establishes production scale or full-stack scope"}
        - {label: "Unitree", x: 5, y: 3, note: "TrendForce reports revenue mix, capacity plans, and broad product commercialization"}
        - {label: "AgiBot", x: 5, y: 4, note: "TrendForce reports a 10,000-unit milestone and standardized supply-chain model"}
        - {label: "UBTech", x: 4, y: 4, note: "Unite.AI reports industrial orders, automaker customers, and capacity plans"}
        - {label: "Agile Robots", x: 3, y: 5, note: "Taylor Wessing describes components-to-turnkey automation scope; production scale is not comparable"}
        - {label: "Status quo or internal build", x: 3, y: 2, note: "Conceptual alternative; no retained source quantifies its scale or scope"}
    approximationNotes: "Coordinates are ordinal analyst judgments based only on retained source descriptions. They are not measured market shares, performance benchmarks, or claims that the alternatives are directly comparable."
    claimRefs: [CP002, CP003, CP006, CP011, CP012]
callouts:
  - calloutType: strength
    title: Scale is already visible in adjacent competitors
    body: "Unitree, AgiBot, and UBTech have publicly reported production, capacity, or customer signals that Bulage must overcome or complement."
    claimRefs: [CP001, CP002, CP003]
  - calloutType: risk
    title: Crowded market and immature use cases
    body: "The NDRC warning reported by Unite.AI directly challenges the assumption that a rapidly growing humanoid category will support durable vendor-level differentiation."
    claimRefs: [CP013, CP014]
  - calloutType: insight
    title: Software differentiation is not yet a moat
    body: "A world-model or embodied-brain thesis becomes defensible only if it demonstrates hardware portability, production outcomes, and repeatable distribution; the assigned evidence does not yet show those properties."
    claimRefs: [CP005, CP010, CP016]
