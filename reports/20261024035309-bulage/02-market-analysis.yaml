company:
  name: Bulage
chapter:
  number: 2
  title: Market Analysis
  summary: Bulage appears positioned at the intersection of world models and embodied intelligence, but the available evidence sizes the surrounding China humanoid-robot market rather than Bulage's own addressable revenue. Commercialization is accelerating in factories, logistics, retail, and services, while policy support, heterogeneous use cases, geopolitical friction, and bubble risk constrain how quickly a startup can convert technical capability into durable budgets.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is not all artificial intelligence and not all robotics. For
      Bulage, the evidence supports a boundary around embodied-intelligence software,
      general-purpose humanoid or mobile robot systems, and the components and
      integration required to deploy those systems in physical workflows. This boundary
      includes model-enabled robot bodies, perception and action software, and
      application integration for factories, logistics, retail, restaurants, and
      eventual households. It excludes generic cloud-model consumption, conventional
      fixed industrial automation, and speculative internal prototypes unless a buyer
      pays for an external deployment. The substitute set therefore includes existing
      industrial robots, task-specific automation, human labor, and an internal build
      using third-party foundation models. The market is strategically attractive, but
      its commercial perimeter remains unsettled: an industry warning says more than
      150 Chinese companies are offering nearly identical products and that business
      models and application scenarios are not yet mature.
    claimRefs: [CM001, CM002]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses, not a Bulage forecast
    body: >-
      Public estimates point to a rapidly expanding China humanoid-robot market, but
      they measure different populations and should not be combined into one funnel.
      Morgan Stanley's June 2026 estimate covers external China sales and excludes
      prototypes, pre-order trials, and internal use: it puts the market at $2 billion
      in 2026 and $15 billion in 2030, with shipments rising from 50,000 to 446,000
      units. A separate industry account reports 18,000 domestic shipments in 2025 and
      62,500 projected for 2026, while TrendForce describes 2026 as the expected
      commercialization phase and cites a 94% output-growth expectation. These
      differences likely reflect distinct definitions, dates, and shipment concepts,
      so they are useful as ranges and market signals rather than a precise TAM for
      Bulage. No retained source isolates Bulage's SAM, pricing, attach rate, or SOM;
      those remain underwriting gaps.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-adoption
    title: Buyers, users, and adoption path
    body: >-
      The clearest near-term buyer is an industrial operator that owns a repeatable
      workflow and can measure throughput, quality, safety, or labor substitution.
      Factories, logistics networks, automotive and electronics producers, retailers,
      and restaurants appear in the current commercialization evidence. The buyer and
      user are not necessarily the same: an operations or manufacturing executive owns
      the budget, frontline workers and robot supervisors use the system, and an
      integrator or component supplier may control deployment. Consumer households are
      a later, more demanding segment: an analyst cited by Global Times expects small-
      scale household adoption in three to five years and large-scale penetration in
      five to ten years. The adoption path therefore runs from demonstrations and
      pilots to paid, repeatable task deployments, then to standardized production and
      channel distribution. Bulage-specific customer, payer, and workflow evidence was
      not found in this assigned pool.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand is being pulled by Chinese policy support, supply-chain localization,
      falling component costs, and reported movement from demonstrations toward real
      deployments. TrendForce cites automotive manufacturing, consumer electronics,
      and logistics orders as evidence of demand, while CNBC reports policy measures
      including local-government subsidies and favorable lending. Those drivers can
      shorten commercialization timelines and expand the component and integration
      ecosystem. They do not remove execution risk. The NDRC warning reported by
      Unite.AI describes a crowded field, immature business models, and the risk that
      homogeneous products squeeze room for research and development. Overseas sales
      also face geopolitical and compliance friction. For valuation, the implication
      is asymmetric: the category may grow quickly, but Bulage needs disclosed
      deployments, repeatable unit economics, and defensible differentiation before
      the sector's top-down growth can justify a company-specific premium.
    claimRefs: [CM014, CM015, CM016, CM017, CM018]
    callouts:
      - calloutType: insight
        title: Category growth is not company SAM
        body: Public market estimates validate category momentum, not Bulage's obtainable revenue. The missing bridge is paid workflow evidence tied to a buyer, unit economics, and deployment scale.
        claimRefs: [CM005, CM009, CM018]
      - calloutType: risk
        title: Commercialization and concentration risk
        body: The sector is moving toward production, but policy scrutiny and a large population of similar entrants create a credible risk of price pressure, consolidation, or delayed returns on model and robot investment.
        claimRefs: [CM016, CM017]
