  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: company-specific-sizing
      missingEvidence: Bulage product scope, target workflows, pricing, paid deployments, and obtainable-market assumptions.
      whyItMatters: Category growth cannot be translated into Bulage revenue or valuation without a defined product and buyer.
      diligencePath: Request a management market model with product-level pricing, named customer segments, pipeline conversion, deployment economics, and a reconciled SAM/SOM bridge.
      relatedQuestionRefs: [QM003, QM004, QM005]
    - type: conflicting-data
      severity: material
      topic: shipments
      missingEvidence: A common definition reconciling Morgan Stanley's external-sales estimates with CMG's domestic shipment counts.
      whyItMatters: The estimates differ materially and could change the implied pace of commercialization and component demand.
      diligencePath: Obtain the underlying methodologies, inclusion rules, geography, and shipment dates from each publisher or a primary industry dataset.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: buyer-economics
      missingEvidence: Task-level customer outcomes, deployment payback, service costs, safety acceptance, and repeat-order rates.
      whyItMatters: Adoption may remain demonstration-led if buyers cannot clear ROI and reliability hurdles.
      diligencePath: Request anonymized pilot scorecards and production contracts showing baseline labor or throughput, robot utilization, uptime, and renewal or expansion terms.
      relatedQuestionRefs: [QM005, QM007]
    - type: stale
      severity: minor
      topic: household-adoption
      missingEvidence: Updated household product pricing, safety approvals, and consumer willingness-to-pay as the category develops.
      whyItMatters: Household adoption is a longer-dated adjacency and should not be used to support near-term Bulage revenue.
      diligencePath: Recheck consumer launches, regulatory requirements, pre-orders, and independent user evidence in the next refresh.
      relatedQuestionRefs: [QM004, QM007]
