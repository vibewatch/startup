      - number: '1.3'
        title: Milestones, external context, and open diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a founder transition in March, entity formation in May and June, a first
              financing reported in June, and a technical direction that had roots in an Alibaba robotics and
              embodied-AI group in October 2025. External industry evidence provides both opportunity and caution: CNBC
              reports a Morgan Stanley forecast of 50,000 Chinese humanoid-robot shipments in 2026, TrendForce describes
              commercialization as entering a critical phase in the second half of 2026, and Global Times reports
              substantial sector financing. Conversely, reporting on an NDRC warning says more than 150 Chinese
              companies are pursuing similar humanoid products and that technological pathways, business models, and
              application scenarios are not yet mature. An unrelated Agile Robots acquisition shows that robotics
              capability can also expand through M&A, but it is not evidence of a Bulage transaction. These market
              signals do not prove Bulage traction. The company-overview conclusion is therefore a high-potential,
              low-disclosure profile: verify legal entities, cap table, board and key hires, product demonstrations,
              customer pilots, cash runway, and safety/compliance controls before relying on the reported valuation.
