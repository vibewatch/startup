chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, strategy, and current evidence
        blocks:
          - type: paragraph
            body: >-
              Public reporting identifies Bulage with an AI laboratory founded by Lin Junyang after his departure from
              Alibaba. The reported strategy is not another general-purpose language model: it is oriented toward world
              models, embodied intelligence, and systems that can reason for action. The available record is unusually
              founder-led and unusually early. One account says the company had no official name, products, revenue, or
              website when the first round was reported, while another records Shanghai corporate registrations for
              Bulage and related entities between May and June 2026. The evidence therefore supports a strong identity
              and technical thesis, but not an operating profile. No retained source names a paying customer, product
              release, recurring revenue stream, employee count, board, or headquarters address beyond the Shanghai
              registration context. Those omissions are material because the reported valuation is based largely on
              founder history and anticipated technical potential rather than disclosed operating performance.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, capital, and control signals
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang is the only named Bulage executive in the retained evidence. The sources describe a rapid
              progression from Alibaba algorithm engineer to P10 and technical lead for Tongyi Qianwen, followed by a
              March 2026 departure and the new venture. That background is a credible technical asset, but it also
              creates key-person concentration: the public record does not identify a second founder, operating leader,
              board member, or succession plan. Financing reports consistently describe Sequoia China and GaoRong
              Capital as contributing $100 million each and Tencent as contributing $20 million, for a reported $220
              million round at roughly $2 billion post-money. These are media-reported financing terms, not audited
              company disclosures, and the sources do not establish liquidation preferences, debt, option-pool
              treatment, investor rights, cash balance, or runway. The reported immediate search for another round
              increases the need to verify capital structure and spending pace.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
