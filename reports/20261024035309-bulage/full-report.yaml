  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all artificial intelligence and not all robotics. For Bulage, the evidence
              supports a boundary around embodied-intelligence software, general-purpose humanoid or mobile robot
              systems, and the components and integration required to deploy those systems in physical workflows. This
              boundary includes model-enabled robot bodies, perception and action software, and application integration
              for factories, logistics, retail, restaurants, and eventual households. It excludes generic cloud-model
              consumption, conventional fixed industrial automation, and speculative internal prototypes unless a buyer
              pays for an external deployment. The substitute set therefore includes existing industrial robots,
              task-specific automation, human labor, and an internal build using third-party foundation models. The
              market is strategically attractive, but its commercial perimeter remains unsettled: an industry warning
              says more than 150 Chinese companies are offering nearly identical products and that business models and
              application scenarios are not yet mature.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: Multiple sizing lenses, not a Bulage forecast
        blocks:
          - type: paragraph
            body: >-
              Public estimates point to a rapidly expanding China humanoid-robot market, but they measure different
              populations and should not be combined into one funnel. Morgan Stanley's June 2026 estimate covers
              external China sales and excludes prototypes, pre-order trials, and internal use: it puts the market at $2
              billion in 2026 and $15 billion in 2030, with shipments rising from 50,000 to 446,000 units. A separate
              industry account reports 18,000 domestic shipments in 2025 and 62,500 projected for 2026, while TrendForce
              describes 2026 as the expected commercialization phase and cites a 94% output-growth expectation. These
              differences likely reflect distinct definitions, dates, and shipment concepts, so they are useful as
              ranges and market signals rather than a precise TAM for Bulage. No retained source isolates Bulage's SAM,
              pricing, attach rate, or SOM; those remain underwriting gaps.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM018
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest near-term buyer is an industrial operator that owns a repeatable workflow and can measure
              throughput, quality, safety, or labor substitution. Factories, logistics networks, automotive and
              electronics producers, retailers, and restaurants appear in the current commercialization evidence. The
              buyer and user are not necessarily the same: an operations or manufacturing executive owns the budget,
              frontline workers and robot supervisors use the system, and an integrator or component supplier may
              control deployment. Consumer households are a later, more demanding segment: an analyst cited by Global
              Times expects small- scale household adoption in three to five years and large-scale penetration in five
              to ten years. The adoption path therefore runs from demonstrations and pilots to paid, repeatable task
              deployments, then to standardized production and channel distribution. Bulage-specific customer, payer,
              and workflow evidence was not found in this assigned pool.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM018
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by Chinese policy support, supply-chain localization, falling component costs, and
              reported movement from demonstrations toward real deployments. TrendForce cites automotive manufacturing,
              consumer electronics, and logistics orders as evidence of demand, while CNBC reports policy measures
              including local-government subsidies and favorable lending. Those drivers can shorten commercialization
              timelines and expand the component and integration ecosystem. They do not remove execution risk. The NDRC
              warning reported by Unite.AI describes a crowded field, immature business models, and the risk that
              homogeneous products squeeze room for research and development. Overseas sales also face geopolitical and
              compliance friction. For valuation, the implication is asymmetric: the category may grow quickly, but
              Bulage needs disclosed deployments, repeatable unit economics, and defensible differentiation before the
              sector's top-down growth can justify a company-specific premium.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Bulage is positioned in a market that spans humanoid robot manufacturers, embodied-AI model providers,
              industrial automation integrators, and status-quo factory automation. The available evidence identifies
              Unitree Robotics and AgiBot as the strongest China-based scale comparators: TrendForce projects the two
              together could account for nearly 80% of Chinese humanoid shipments in 2026, while separately reporting
              AgiBot's rollout of its 10,000th general-purpose embodied robot. Those are shipment and production
              signals, not proof of profitable recurring demand. UBTech is a more industrially anchored comparator:
              Unite.AI reports orders exceeding 800 million yuan for its Walker series in 2025 and customers including
              BYD, Geely Auto, FAW-Volkswagen, and Foxconn. Bulage's reported focus on world models and an embodied
              brain therefore faces both hardware-scale competitors and integrated deployment vendors.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
      - number: '3.2'
        title: Buyer-facing alternatives and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              The buyer can solve an embodied-work task through several routes: purchase a general-purpose humanoid from
              a scaled manufacturer, procure an industrial system from an integrator, adopt a lower-cost or
              task-specific robot, or retain human labor and existing automation. Public evidence is uneven across these
              alternatives. TrendForce describes Unitree's and AgiBot's progress in mass production and order-driven
              supply chains, while Taylor Wessing describes Agile Robots as a system provider ranging from intelligent
              components to turnkey systems. CNBC reports that Morgan Stanley's 2026 China forecast includes external
              sales but excludes prototypes, pre-order trials, and internal use, a useful reminder that production
              headlines do not equal comparable customer deployments. Bulage's public materials in this pool do not
              establish price, packaging, integrations, service-level commitments, or named deployments, so matrix cells
              involving Bulage remain unknown rather than scored as advantages.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Distribution, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest observable competitive advantages are supply-chain control, production learning, and access
              to industrial distribution. TrendForce attributes AgiBot's output to standardized supply chains, flexible
              order-driven manufacturing, collaborative development, and dedicated supply arrangements; the same report
              says automotive, consumer-electronics, and logistics orders are moving from trial adoption toward real
              demand. UBTech's reported factory and logistics customers illustrate the value of reference accounts and
              integration access. Agile Robots' described end-to-end model shows another route to lock-in: customers can
              buy a system rather than assemble components themselves. Bulage may differentiate through world models or
              an embodied-brain layer, but the current evidence cannot show whether its software is proprietary,
              portable across third-party hardware, or difficult for incumbents to replicate. That leaves switching
              costs and moat durability as open diligence items.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
      - number: '3.4'
        title: Commoditization and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Competitive intensity is unusually high relative to demonstrated market maturity. Unite.AI reports that
              China's economic planning agency warned more than 150 companies were flooding the market with nearly
              identical products and that technological pathways, business models, and application scenarios had not
              fully matured. That warning is adverse evidence against assuming that a large sector forecast
              automatically converts into durable vendor power. TrendForce's account of Unitree, AgiBot, Boston
              Dynamics, 1X, and Tesla shows that Bulage could be squeezed between Chinese scale leaders and global
              platforms with substantial capital or brand recognition. Barclays' estimate, as reported by The Next Web,
              is a maximum-substitution scenario rather than a base case and explicitly encounters customer-readiness
              questions. A Bulage moat would need evidence of task-level outcomes, model performance in production,
              hardware neutrality, and repeatable distribution; none is established by the retained sources.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is already visible in adjacent competitors
            body: >-
              Unitree, AgiBot, and UBTech have publicly reported production, capacity, or customer signals that Bulage
              must overcome or complement.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: callout
            title: Crowded market and immature use cases
            body: >-
              The NDRC warning reported by Unite.AI directly challenges the assumption that a rapidly growing humanoid
              category will support durable vendor-level differentiation.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
          - type: callout
            title: Software differentiation is not yet a moat
            body: >-
              A world-model or embodied-brain thesis becomes defensible only if it demonstrates hardware portability,
              production outcomes, and repeatable distribution; the assigned evidence does not yet show those
              properties.
            calloutType: insight
            claimRefs:
              - CP005
              - CP010
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Bulage's public financial profile is unusually thin for a company reported at a $2 billion post-money
              valuation. A June 2026 Crunchbase report identifies Shanghai-based Bulage as a robotics-intelligence
              company that raised a $220 million seed round and was valued at $2 billion, but it does not provide
              revenue, customers, pricing, gross margin, shipment volume, or contract terms. A contemporaneous Chinese
              technology report describes the direction as world models and an embodied brain, while stating that the
              financing was led by Gaorong Capital and HSG with Tencent participating; that is financing evidence, not
              evidence of recurring revenue or realized unit economics. Sector research indicates that the broader
              Chinese humanoid market is moving from technology verification toward commercialization, with reported
              price bands and software, integration, and maintenance layers, but these are market benchmarks rather than
              Bulage disclosures. Underwriting therefore requires a clear separation between reported capital formation,
              company or media descriptions of product ambition, and verified customer cash receipts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI006
              - CI007
      - number: '4.2'
        title: Pricing, cost structure, and margin path
        blocks:
          - type: paragraph
            body: >-
              No assigned source publishes Bulage's list price, realized price, take rate, bill of materials, cloud or
              compute cost, service-delivery cost, warranty exposure, or gross margin. The ResearchAndMarkets summary,
              distributed through GlobeNewswire, estimates Chinese humanoid robot price tiers of RMB 100,000-200,000,
              RMB 250,000-500,000, and above RMB 500,000, and separately estimates software, systems integration, and
              maintenance revenue; its methodology combines public data and industry interviews. Those figures can frame
              diligence questions but cannot be mapped to Bulage's business model because the sources do not establish
              whether Bulage sells robots, licenses models, supplies software, or combines these activities. TrendForce
              reports that Unitree's combined gross margin across quadruped and humanoid segments reached 60% in 2025,
              while also describing AgiBot's order-driven manufacturing and supply-chain arrangements. These peer
              observations suggest that manufacturing scale and supply control may determine margin outcomes, but they
              are not comparable company metrics. The financial model should remain scenario-based until Bulage provides
              product-level pricing, cost accounting, and contract evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI008
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The reported $220 million seed round gives Bulage meaningful gross financing capacity relative to an
              early-stage robotics company, but public evidence does not show how much cash remains, the pace of
              spending, debt or project-finance obligations, planned use of funds, or the next-round trigger. A large
              financing balance should not be treated as cash available: fees, restricted proceeds, operating losses,
              capitalized equipment, and staged investment could materially reduce liquidity. Market forecasts show why
              additional capital may be available to strong operators: CNBC reports Morgan Stanley's 2026 China humanoid
              shipment forecast at 50,000 units and a $2 billion market estimate, while TrendForce highlights peers with
              production expansion and financing-market effects. The adverse case is equally material: Unite.AI reports
              an NDRC warning that more than 150 companies were flooding the market with nearly identical products and
              that technological pathways, business models, and application scenarios had not fully matured. Bulage may
              have financing runway to pursue platform development, but the public record cannot establish revenue
              quality, path to gross-profit breakeven, or whether follow-on financing is optional. The underwriting
              verdict is research-more, contingent on primary financial statements, bank evidence, customer contracts,
              and a bottoms-up cash plan.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI009
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial underwriting gap
            body: >-
              The reported valuation and financing are visible, but revenue, cash, burn, runway, pricing, and customer
              economics remain unavailable in the assigned public evidence.
            calloutType: risk
            claimRefs:
              - CI002
              - CI009
              - CI012
          - type: callout
            title: Diligence condition
            body: >-
              Require monthly management accounts, bank statements, signed customer contracts, product-level
              gross-margin bridges, and a 24-month cash plan before underwriting the reported valuation.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific public description is directional rather than productized. A report on
              Bulage says its focus is “world models and embodied brains,” and links the direction to founder Lin
              Junyang’s prior work leading Qwen. It does not identify a named robot, model release, API, SKU, customer
              deployment, supported task, or measurable performance target. That makes Bulage best treated as a
              pre-product or undisclosed platform effort for diligence purposes, not as a verified robot manufacturer.
              The distinction matters because industry reporting describes a market moving from demonstrations toward
              external commercial sales, while prototype, internal-use, and pre-order units can inflate apparent
              maturity. Bulage’s current maturity therefore rests on founder provenance and financing visibility, not
              independently verified product evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE016
      - number: '5.2'
        title: Operating model and architecture
        blocks:
          - type: paragraph
            body: >-
              A plausible embodied-AI operating model has at least a perception and semantic layer, a foundation or
              world-model layer, decision and planning, real-time motor control, and a physical robot and deployment
              layer. Industry commentary explicitly separates a “brain” for decision-making and planning from a less
              mature “cerebellum” for real-time motor control and path planning. That distinction is useful as a
              diligence map, but it is not evidence that Bulage has implemented each layer. The available Bulage
              reporting does not disclose training data, model latency, hardware interfaces, simulation stack, safety
              envelope, or integration protocol. Any underwriting assumption that Bulage owns a complete robot stack
              should therefore be marked unverified until technical artifacts or live deployments are produced.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Deployment, integration, and reliability
        blocks:
          - type: paragraph
            body: >-
              External benchmarks show both a credible commercialization path and a demanding execution bar. Morgan
              Stanley’s June 2026 forecast, as reported by CNBC, expects 50,000 China humanoid shipments in 2026 and
              446,000 in 2030, excluding prototypes, pre-order trials, and internal use. TrendForce likewise describes a
              second-half-2026 shift toward tangible user value, while reporting that leading peers are scaling
              production and standardized supply chains. These signals establish an addressable deployment environment,
              not Bulage traction. Other coverage warns that many automotive “deployments” are strategic tie-ups rather
              than sales and that embodied intelligence still lacks a clear revenue path. Bulage needs evidence of
              production integration, uptime, task success, support ownership, and acceptance criteria before those
              market benchmarks can be applied to it.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Differentiation, trust, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Bulage’s possible differentiation is currently a hypothesis: founder experience in open model development
              and a stated focus on world models could support a software-led approach, but no Bulage patent, benchmark,
              open-source repository, certification, security statement, or customer reference is retained in the
              assigned evidence. Competitive evidence shows that peers are investing in multimodal models, embodied
              datasets, motion control, dexterous hardware, and manufacturing capacity, raising the bar beyond a general
              “embodied brain” narrative. China’s NDRC has also warned that more than 150 companies have similar
              products and that technology paths, business models, and use cases are not fully mature. The central
              diligence risk is not a disproven technology claim; it is the absence of verifiable evidence that Bulage
              has converted a thesis into a differentiated, safe, supportable system.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Evidence-backed exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate Bulage-specific disclosures from market comparators and unresolved implementation
              questions. Comparator metrics are not substitutes for Bulage evidence. Null cells identify information
              that cannot be responsibly inferred from the assigned sources. This presentation also prevents a peer's
              production scale, architecture, or certification from being mistaken for Bulage's own maturity. The most
              decision-relevant missing artifacts are a product boundary, a technical release, a deployment record, and
              evidence of safe operation in a customer environment. Until those are available, the exhibits support a
              diligence plan and risk framing rather than a verified product score.
            claimRefs:
              - CE001
              - CE009
              - CE013
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The product is not yet independently legible
            body: >-
              Bulage has a reported direction and founder pedigree, but the assigned evidence does not identify a
              product boundary, release artifact, deployment, or technical performance measure.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: Commercial proof is the gating milestone
            body: >-
              Market growth forecasts do not resolve whether Bulage can move from an embodied-AI thesis to safe,
              reliable, supported customer operations.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Bulage's publicly described direction is world models and an embodied-intelligence brain, but the assigned
              evidence does not identify a buyer, payer, customer logo, contract, or production deployment for Bulage.
              The customer map therefore separates plausible market segments from verified company evidence. Industrial
              manufacturers and logistics operators are the clearest observable adoption surfaces in the broader market:
              TrendForce describes demand from automotive manufacturing, consumer electronics, and logistics, while
              independent reporting describes UBTech deployments with automakers and Foxconn. Consumer experience stores
              and pre-orders are a distinct, earlier commercialization surface rather than evidence of enterprise
              recurring revenue. The key underwriting gap is whether Bulage sells a model, a robot stack, services, or a
              hybrid, and which party bears integration and safety costs.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption evidence and trajectory
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports a market-level commercialization trajectory, not a Bulage adoption trajectory.
              TrendForce says the sector is expected to enter a critical commercialization phase in the second half of
              2026 and reports AgiBot's expansion to 10,000 general-purpose embodied robots; Global Times reports
              consumer pre-orders, offline experience stores, and a projected increase in Chinese humanoid-robot
              shipments from about 18,000 units in 2025 to 62,500 in 2026. These observations show where customer demand
              may emerge, but they do not provide Bulage's active-user count, utilization, repeat purchase, deployment
              locations, or revenue denominator. Bulage's reported financing and technical pedigree may improve access
              to pilots, yet no assigned source converts that access into verified customer outcomes.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named proof, retention, and expansion
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a named Bulage customer reference, production-versus-pilot designation,
              outcome metric, renewal term, NRR, GRR, churn rate, contract length, or top-customer concentration. The
              strongest available named proof is comparator evidence: Yicai reports that UBTech deployed Walker S robots
              in bulk across automotive, electronics, semiconductor manufacturing, and logistics, and Global Times
              reports named industrial customers for UBTech alongside consumer pre-orders and AgiBot retail activity.
              Those examples demonstrate the evidence standard Bulage would need to meet, not proof that Bulage has met
              it. Until customer-level contracts or independently attributable deployment outcomes are disclosed,
              retention and expansion should remain unscored and customer concentration should be treated as an open
              diligence item.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU009
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market adoption is not Bulage adoption
            body: >-
              Comparable robotics companies show emerging demand and named deployments, but the assigned evidence does
              not establish a Bulage customer, pilot, shipment, utilization metric, or renewal.
            calloutType: insight
            claimRefs:
              - CU005
              - CU009
              - CU012
          - type: callout
            title: Customer proof gap
            body: >-
              The absence of disclosed customer-level evidence leaves buyer identity, deployment maturity, retention,
              expansion, and concentration unverified; these should remain explicit diligence gates rather than inferred
              from the reported financing.
            calloutType: risk
            claimRefs:
              - CU001
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Bulage's public evidence does not establish that it has obtained, needs, or lacks any particular license,
              approval, certification, or litigation clearance. The relevant exposure is nevertheless material because
              the EU regime governs export, transit, brokering, and technical assistance for dual-use items, while the
              US EAR is a broad control framework whose official resource cautions that its interactive presentation is
              not the official legal edition. A company building embodied-AI systems may therefore face classification,
              end-use, destination, record-keeping, and compliance questions before selling or supporting systems
              internationally. The evidence supports a diligence requirement, not a finding that Bulage has violated a
              rule. The highest-value next step is a jurisdiction-by-jurisdiction product classification and
              export-control memo tied to actual components, model access, and technical support.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Commercialization and execution risk
        blocks:
          - type: paragraph
            body: >-
              The sector backdrop is simultaneously a validation opportunity and a risk amplifier. TrendForce describes
              commercialization moving toward tangible user value, but its report also highlights rapid scaling by
              established peers and component suppliers. Unite.AI reports an NDRC warning that more than 150 Chinese
              companies are pursuing humanoid robotics and that technological pathways, business models, and application
              scenarios have not fully matured. CNBC likewise reports that Morgan Stanley's shipment forecast excludes
              prototypes, pre-order trials, and internal use, which is an important denominator distinction when
              interpreting market growth. Bulage's reported financing and founder pedigree do not demonstrate repeatable
              deployments, safety performance, unit economics, or a defensible production advantage. Those missing
              operating proofs create execution risk even if the market expands.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.3'
        title: Partner, supply-chain, and geopolitical dependencies
        blocks:
          - type: paragraph
            body: >-
              Public materials do not identify Bulage's suppliers, cloud or model providers, distributors, anchor
              customers, or geographic revenue mix. That absence prevents a quantified concentration assessment rather
              than proving that concentration is low. The surrounding market evidence shows why dependency mapping
              matters: TrendForce describes standardized supply chains and order-driven manufacturing as important to
              scale, while CNBC reports that overseas robotics operators are responding to geopolitical uncertainty
              through geographic diversification and local regulatory compliance. The EU and US control frameworks add a
              second dependency layer for components, software, and technical assistance. Bulage should disclose
              critical suppliers, single-source parts, model and cloud dependencies, customer concentration, export
              restrictions, and substitution lead times before an investment decision.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The appropriate risk posture is research-more until Bulage provides operating evidence that converts a
              high-profile financing story into a measurable business. Monitoring should focus on production deployments
              rather than demonstrations; paid repeat usage rather than logos; gross margin and cash runway rather than
              funding raised; incident and safety reporting rather than the absence of public complaints; and
              export-control compliance by product and destination. A thesis break would be a confirmed material
              compliance breach, an inability to obtain required approvals, repeated pilot failure without conversion, a
              single-source dependency without a qualified substitute, or financing needs that materially dilute the
              reported entry thesis. These triggers are intentionally conditional because the assigned public sources do
              not disclose Bulage-specific operating denominators.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis risk
            body: >-
              Bulage's reported capital formation is not evidence of production readiness, customer retention, safety
              controls, or regulatory clearance; underwriting should remain conditional on those disclosures.
            calloutType: risk
            claimRefs:
              - CR007
              - CR013
              - CR016
          - type: callout
            title: Immediate diligence gate
            body: >-
              Require a product-and-jurisdiction compliance map, named production deployments with outcomes, supplier
              and model dependency disclosure, and cash-runway evidence before treating the reported financing valuation
              as investable.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR009
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Bulage may be entering a market with unusually strong capital and
              commercialization momentum. CNBC reports Morgan Stanley expects China to ship 50,000 humanoid robots in
              2026, up from its prior 28,000 forecast, and estimates a $2 billion market in 2026 growing to $15 billion
              by 2030. TrendForce separately expects global commercialization to enter a critical phase in the second
              half of 2026 and says China output could grow 94% in 2026. Those figures describe the market, not Bulage,
              and neither source establishes that Bulage has shipped a product, secured customers, or captured a share.
              The anti-thesis is valuation risk: the reported financing is a media account rather than a filing or
              company disclosure, while an NDRC warning cited by Unite.AI says more than 150 companies are offering
              similar products and that business models and application scenarios are not yet mature. Without verified
              company-level traction, the market growth case is not sufficient to underwrite a $2 billion entry price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV011
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest available company-specific valuation evidence is a June 2026 report that attributes to The
              Information a first financing of several hundred million dollars at an approximately $2 billion post-money
              valuation, with Gaorong Capital and Sequoia China described as co-leads at $100 million each and Tencent
              as a $20 million participant. The same report says the transaction had closed and that Lin Junyang was
              seeking another round, but it does not provide a term sheet, share count, liquidation preference,
              option-pool treatment, dilution schedule, or audited financials. The correct underwriting posture is
              consequently price-sensitive: treat $2 billion as a reported mark, not a verified fair value; require the
              signed financing documents and cap table before assigning ownership-adjusted returns; and avoid converting
              the reported raise into ARR, revenue, or cash runway. Public comparables are also imperfect. ABB's market
              capitalization was listed at $148.55 billion in October 2026, but ABB is a diversified public industrial
              company rather than a seed-stage embodied-AI laboratory, so its multiple is a scale reference, not a
              direct Bulage comparable.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a point valuation because Bulage's disclosed revenue,
              shipments, margins, retention, customers, and financing terms are missing from the assigned evidence. The
              bull case requires evidence that Bulage has a differentiated model or robot stack, paid deployments,
              repeatable unit economics, and financing terms that do not impose hidden preference overhang. The base
              case assumes the sector grows but Bulage remains an early laboratory with uncertain commercialization,
              making a reported $2 billion mark difficult to validate. The bear case combines sector crowding, delayed
              use cases, and financing compression; Unite.AI reports the sector warning and notes that more than 10,000
              units were projected for industry-wide 2025 shipments, a small base relative to the investment activity.
              Exit readiness is therefore unproven. An investor should require named customers, paid pilots, deployment
              outcomes, cash burn and runway, the full cap table, preference terms, governance rights, and
              safety/compliance evidence. A thesis break is a failed financing at materially lower terms, inability to
              demonstrate paid repeat deployments, or evidence that the reported valuation cannot be reconciled to
              ownership and preference economics.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at the reported price
            body: >-
              Public market evidence is constructive, but company-level valuation support is too thin to justify a buy.
              Move toward investable only after financing documents, cap-table economics, and paid deployment evidence
              reconcile the reported $2 billion mark.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV014
          - type: callout
            title: Bubble and commercialization risk
            body: >-
              The sector's growth forecasts are accompanied by an official-policy warning, as reported by Unite.AI, that
              product homogeneity and immature business models could compress returns before scale economics are proven.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV013
