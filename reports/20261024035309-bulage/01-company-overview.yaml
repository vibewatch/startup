company:
  name: Bulage
chapter:
  number: 1
  title: Company Overview
  summary: Bulage is a Shanghai embodied-AI startup associated with former Alibaba Qwen technical lead Lin Junyang. Public reporting describes a $220 million first round at an approximately $2 billion post-money valuation, but the company has not publicly disclosed products, revenue, customers, headcount, or governance detail sufficient for conventional underwriting.
sections:
  - id: identity-and-strategy
    title: Identity, strategy, and current evidence
    body: >-
      Public reporting identifies Bulage with an AI laboratory founded by Lin Junyang after his departure from Alibaba. The reported strategy is not another general-purpose language model: it is oriented toward world models, embodied intelligence, and systems that can reason for action. The available record is unusually founder-led and unusually early. One account says the company had no official name, products, revenue, or website when the first round was reported, while another records Shanghai corporate registrations for Bulage and related entities between May and June 2026. The evidence therefore supports a strong identity and technical thesis, but not an operating profile. No retained source names a paying customer, product release, recurring revenue stream, employee count, board, or headquarters address beyond the Shanghai registration context. Those omissions are material because the reported valuation is based largely on founder history and anticipated technical potential rather than disclosed operating performance.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, capital, and control signals
    body: >-
      Lin Junyang is the only named Bulage executive in the retained evidence. The sources describe a rapid progression from Alibaba algorithm engineer to P10 and technical lead for Tongyi Qianwen, followed by a March 2026 departure and the new venture. That background is a credible technical asset, but it also creates key-person concentration: the public record does not identify a second founder, operating leader, board member, or succession plan. Financing reports consistently describe Sequoia China and GaoRong Capital as contributing $100 million each and Tencent as contributing $20 million, for a reported $220 million round at roughly $2 billion post-money. These are media-reported financing terms, not audited company disclosures, and the sources do not establish liquidation preferences, debt, option-pool treatment, investor rights, cash balance, or runway. The reported immediate search for another round increases the need to verify capital structure and spending pace.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence
    title: Milestones, external context, and open diligence
    body: >-
      The milestone record shows a founder transition in March, entity formation in May and June, a first financing reported in June, and a technical direction that had roots in an Alibaba robotics and embodied-AI group in October 2025. External industry evidence provides both opportunity and caution: CNBC reports a Morgan Stanley forecast of 50,000 Chinese humanoid-robot shipments in 2026, TrendForce describes commercialization as entering a critical phase in the second half of 2026, and Global Times reports substantial sector financing. Conversely, reporting on an NDRC warning says more than 150 Chinese companies are pursuing similar humanoid products and that technological pathways, business models, and application scenarios are not yet mature. An unrelated Agile Robots acquisition shows that robotics capability can also expand through M&A, but it is not evidence of a Bulage transaction. These market signals do not prove Bulage traction. The company-overview conclusion is therefore a high-potential, low-disclosure profile: verify legal entities, cap table, board and key hires, product demonstrations, customer pilots, cash runway, and safety/compliance controls before relying on the reported valuation.
    claimRefs: [CO006, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Founder credibility is the principal disclosed asset
    body: Public sources attribute the financing interest primarily to Lin Junyang's prior Qwen leadership and technical record, not to disclosed revenue or customer traction.
    claimRefs: [CO003, CO009]
  - calloutType: risk
    title: Valuation is not yet supported by operating disclosure
    body: The reported $2 billion post-money valuation sits alongside missing public evidence on products, revenue, customers, headcount, governance, and runway.
    claimRefs: [CO004, CO011, CO016]
