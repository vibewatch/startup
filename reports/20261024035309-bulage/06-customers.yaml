      - [Foxconn, Logistics / manufacturing, "Reported as a UBTech customer", "Not specified in assigned text", "No task-level outcome reported", "Comparator evidence; no Bulage linkage"]
    notes: "Enumeration is partial and intentionally limited to named comparator customers in the assigned evidence; no Bulage customer is asserted."
