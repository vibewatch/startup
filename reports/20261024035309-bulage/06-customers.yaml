callouts:
  - calloutType: insight
    title: Market adoption is not Bulage adoption
    body: Comparable robotics companies show emerging demand and named deployments, but the assigned evidence does not establish a Bulage customer, pilot, shipment, utilization metric, or renewal.
    claimRefs: [CU005, CU009, CU012]
  - calloutType: risk
    title: Customer proof gap
    body: The absence of disclosed customer-level evidence leaves buyer identity, deployment maturity, retention, expansion, and concentration unverified; these should remain explicit diligence gates rather than inferred from the reported financing.
    claimRefs: [CU001, CU010, CU012]
