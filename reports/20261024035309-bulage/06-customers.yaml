company:
  name: Bulage
chapter:
  number: 6
  title: Customers
  summary: Public evidence does not yet establish Bulage's paying customers, production deployments, retention, or expansion economics. Industry comparables show that embodied-AI adoption is moving from demonstrations toward factories, logistics, and consumer touchpoints, but those comparables should not be treated as Bulage traction.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      Bulage's publicly described direction is world models and an embodied-intelligence brain, but the assigned evidence does not identify a buyer, payer, customer logo, contract, or production deployment for Bulage. The customer map therefore separates plausible market segments from verified company evidence. Industrial manufacturers and logistics operators are the clearest observable adoption surfaces in the broader market: TrendForce describes demand from automotive manufacturing, consumer electronics, and logistics, while independent reporting describes UBTech deployments with automakers and Foxconn. Consumer experience stores and pre-orders are a distinct, earlier commercialization surface rather than evidence of enterprise recurring revenue. The key underwriting gap is whether Bulage sells a model, a robot stack, services, or a hybrid, and which party bears integration and safety costs.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption evidence and trajectory
    body: >-
      Available evidence supports a market-level commercialization trajectory, not a Bulage adoption trajectory. TrendForce says the sector is expected to enter a critical commercialization phase in the second half of 2026 and reports AgiBot's expansion to 10,000 general-purpose embodied robots; Global Times reports consumer pre-orders, offline experience stores, and a projected increase in Chinese humanoid-robot shipments from about 18,000 units in 2025 to 62,500 in 2026. These observations show where customer demand may emerge, but they do not provide Bulage's active-user count, utilization, repeat purchase, deployment locations, or revenue denominator. Bulage's reported financing and technical pedigree may improve access to pilots, yet no assigned source converts that access into verified customer outcomes.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: proof-retention-expansion
    title: Named proof, retention, and expansion
    body: >-
      No assigned source provides a named Bulage customer reference, production-versus-pilot designation, outcome metric, renewal term, NRR, GRR, churn rate, contract length, or top-customer concentration. The strongest available named proof is comparator evidence: Yicai reports that UBTech deployed Walker S robots in bulk across automotive, electronics, semiconductor manufacturing, and logistics, and Global Times reports named industrial customers for UBTech alongside consumer pre-orders and AgiBot retail activity. Those examples demonstrate the evidence standard Bulage would need to meet, not proof that Bulage has met it. Until customer-level contracts or independently attributable deployment outcomes are disclosed, retention and expansion should remain unscored and customer concentration should be treated as an open diligence item.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
