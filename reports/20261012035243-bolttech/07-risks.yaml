callouts:
  - calloutType: "risk"
    title: "Carrier Capacity Vulnerability and Asymmetric Underwriting Exposure"
    body: "Because Bolttech does not carry the bulk of underwriting risk on its own balance sheet, its multi-billion dollar gross quoted premium volume remains structurally dependent on carrier risk appetite. Any contract restructuring, carrier credit downgrade, or capacity withdrawal by primary underwriting partners such as Tokio Marine would directly impair embedded product availability across its retail distribution channels."
    claimRefs:
      - "CR005"
      - "CR009"
      - "CR015"
  - calloutType: "insight"
    title: "Regulatory Licensing Friction as a Moat and Governance Complexity Driver"
    body: "Operating across 30+ jurisdictions and all 50 US states requires maintaining distinct insurance agency, brokerage, and MGA licenses. While this regulatory footprint creates significant barriers to entry against emerging insurtech rivals, it also introduces substantial ongoing regulatory compliance overhead and co-ownership governance complexity, as illustrated by FWD's 25% minority acquisition in Bolttech Insurance Hong Kong."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
