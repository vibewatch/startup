  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、嵌入式保障范围与相邻领域
        blocks:
          - type: paragraph
            body: >-
              嵌入式保险生态与传统直销及代理经纪分销存在结构性差异。消费者不必自行寻找、评估和购买独立保单，嵌入式保险会把销售点保障直接放进第三方商业交易和消费者硬件旅程。Bolttech
              主要充当技术基础设施提供商和多保险公司交易平台，通过统一 API
              在零售、电信、金融服务和汽车等行业分销保单。可触达的嵌入式市场包括高频消费电子保障、生活方式设备保修、嵌入式旅行保障及一体化财产与意外险保障。不纳入这一运营边界的包括重资产商业风险、定制企业承保业务，以及不使用数字集成触点的非捆绑直接经纪业务。除纯交易编排外，Bolttech
              还通过香港 Bolttech Insurance 等实体保留持牌风险承担能力，形成兼具数字分销覆盖和受监管承保能力的混合架构。
            claimRefs:
              - CM001
              - CM002
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
      - number: '2.2'
        title: 市场规模视角与受约束的 TAM/SAM 分析
        blocks:
          - type: paragraph
            body: >-
              评估 Bolttech 的可触达市场机会，必须区分核心报价吞吐量、可触达的总保费池和实际实现的净平台费率。Bolttech 公开披露，其平台在四大洲 39 个市场处理的年化报价保费超过 $85B 至 $90B，较
              2022 年末约 $50B 大幅增长。但这一指标是合作伙伴渠道向消费者展示的保险选项总价值，不等于已承保保单量或确认的企业收入。战略伙伴 Sumitomo Corporation
              的行业研究显示，消费设备保障板块增速高于平均水平，受智能手机平均售价上升、翻新及二手设备快速普及，以及亚太和新兴市场城市化加速推动。从估值角度看，包括 $147M C 轮、$2.1B
              估值在内的私募融资基准，反映机构对平台交易规模的高度信心，但转化保费和净费率的详细公开披露仍被严格控制。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM010
              - CM013
      - number: '2.3'
        title: 买方分层、预算归属与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              Bolttech 的商业进入架构采用多边 B2B2C
              交付模式，覆盖保险价值链上的三类利益相关方。企业买方是不属于保险业的分销伙伴，主要包括移动网络运营商、汽车金融机构、商业银行和大型电商平台；它们希望变现现有客户流量、增加附加利润，同时不承担承保风险。终端用户是零售消费者，他们在销售点购买捆绑的保修或保障附加项，费用通过电信月账单、设备融资合同或数字结账车支付。第三层是
              230 多家保险公司和管理总代理，它们支付平台分销及技术赋能费用，以接入非传统消费者分销渠道。合作企业的预算通常由首席商务官或数字产品负责人掌握，驱动因素是提升客户终身价值和降低流失，而不是单独的保险采购预算。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: 结构性增长动力、监管约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              嵌入式保障的扩张由消费者趋势和商业激励推动，但跨境市场仍面临显著监管和运营摩擦。核心增长顺风包括硬件更换成本上升、消费者对灵活月度保障的需求，以及企业希望用高毛利费用收入抵消传统商品化服务收入。Bolttech
              超过 220 个微服务的模块化架构加快了技术赋能，简化合作伙伴接入和理赔生命周期管理。反过来，多司法辖区扩张带来复杂监管阻力：保险分销受到各地严格监管，在 30 多个国家和美国全部 50
              个州都需要本地经纪牌照、法定资本储备及合规的市场行为规则。此外，Bolttech 对外披露的是报价量，而非已承保保费或净收入留存，机构投资者必须自行审计转化率、保险公司集中度和费率可持续性，才能建立企业估值基线。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 生态报价吞吐量与变现费率
            body: Bolttech 报告的 $85B 至 $90B+ 报价量，凸显其覆盖 39 个国家的庞大分销版图；但投资分析必须把核心报价路由与已承保书面保费，以及业务取得的净平台佣金或技术费率区分开。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM014
          - type: callout
            title: 跨境监管牌照与合规复杂度
            body: 在 30 多个国家司法辖区和美国 50 个州运营，需要管理不同的保险中介牌照制度、消费者保护规则和本地资本要求；这可能限制产品快速上线，并增加持续合规成本。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              嵌入式保险生态包含四股主要竞争力量：多保险公司数字分销交易平台、专注销售点的保险科技公司、资产负债表型保险公司工作室，以及企业内部 IT 自建方案。Bolttech
              在这一分类中定位独特：它是独立的多保险公司技术交易平台，把分销伙伴与覆盖个人和商业保障的广泛保险公司库连接起来。与专注旅行或票务数字结账保修的细分玩家不同，bolttech
              将数字保单分销与实体设备生命周期管理、设备置换和智能手机保障结合。其广泛范围得到强大机构资本支持，包括 2024 年 12 月由 MUFG Dragon Fund 和 Liquidity Group
              领投、投后估值 21 亿美元的 C 轮融资，此前 Tokio Marine 支持的 B 轮估值为 15 亿美元。bolttech 与 Sumitomo Corporation
              在东南亚的战略合资进一步扩大了其相对区域新创企业的国际分销覆盖。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP010
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP012
      - number: '3.2'
        title: 功能与能力比较
        blocks:
          - type: paragraph
            body: >-
              对竞争格局中的平台能力进行比较，可以看到保险公司中立性、技术模块化和售后服务深度之间存在不同取舍。Bolttech 的核心架构优势在于分销引擎：它聚合数百家预集成保险公司，并支持动态报价问卷、产品配置器和嵌入式
              API 端点。Cover Genius 等专业嵌入式服务商提供简洁 API，可即时接入电商结账；bolttech
              则进一步延伸到完整的售后服务基础设施，包括自有保单管理软件、多语言全球联络中心、自动化理赔门户和实体设备维修网络。相反，Chubb Studio
              等在位保险公司方案具备企业级财务实力和全球承保能力，却天然缺少多保险公司选择。对于寻求供应商多元化和有竞争力承保定价的企业分销商，bolttech 的开放架构交易平台可降低专有保险公司平台带来的供应商锁定。
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP012
      - number: '3.3'
        title: 定价、产品打包与商业经济性
        blocks:
          - type: paragraph
            body: >-
              嵌入式保险基础设施的商业变现通常采用混合模式，将按交易计费的总书面保费（GWP）佣金与企业软件许可费结合。Bolttech
              主要通过平台承保保单收取费率或分销价差，再在承保保险公司、分销伙伴和交易平台之间分配。除保费佣金外，bolttech 还通过企业 SaaS
              订阅、软件实施套餐和面向保险经纪人的代理管理门户变现技术栈。此外，公司通过售后服务和设备保障项目获取高接触度运营收入，为客户支持履约、设备检测和逆向物流管理收费。相比需要数百万美元前期工程投入并持续维护监管牌照的企业自建方案，bolttech
              能让分销伙伴更快上市、降低资本强度；但大流量分销商仍需权衡持续的费率损耗与专有系统成本。
