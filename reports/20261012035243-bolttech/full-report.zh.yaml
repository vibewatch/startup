chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bolttech 于 2020 年 4 月在新加坡成立，是一家国际保险科技平台，最初由 Pacific Century Group 和 FWD Group 在 Rob Schimek 的领导下孵化。公司运营全球
              B2B2C 数字保险交易平台，通过统一的云端软件基础设施和标准化 API 连接保险公司、数字分销伙伴与终端消费者。Bolttech
              不把保险风险直接放在自身资产负债表上，而是充当交易中介和编排层。其核心技术套件管理从产品配置、合作伙伴接入到数字理赔处理的完整保单生命周期。截至 2026 年，据公司披露，已覆盖四大洲 39
              个国际市场，年化报价总保费超过 850 亿美元，并将 700 多家分销合作伙伴与全球 230 多家持牌保险公司连接起来。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO010
              - CO011
              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: 高管团队、治理与董事会监督
        blocks:
          - type: paragraph
            body: >-
              Bolttech 由经验丰富的管理团队负责运营，并由一支具有影响力的董事会治理，体现其在亚洲金融和国际保险市场中的机构背景。集团首席执行官 Rob Schimek 拥有超过 35 年全球保险管理经验，曾任 FWD
              Group 董事总经理兼集团首席运营官，以及 AIG 全球商业保险业务总裁兼首席执行官。董事会主席 Richard Li Tzar Kai 是 Pacific Century Group
              创始人兼董事长；该集团提供基石支持，并帮助公司接入区域金融服务和电信资产。独立及非执行董事包括澳大利亚第 29 任总理、前 Goldman Sachs 合伙人 Malcolm Turnbull，以及 AIG
              前集团 CEO Peter Hancock。职能管理由集团首席技术与运营官 David Lynch 和集团总法律顾问 Ashley Mullins 负责，前者曾任 DBS 和 Standard Chartered
              CIO，后者曾任职于 Chubb。
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: 资本化历程、估值与股东构成
        blocks:
          - type: paragraph
            body: >-
              Bolttech 自成立以来持续激进融资，累计股权融资超过 6.9 亿美元，用于国际收购、地域扩张和技术开发。2021 年 7 月，公司成立仅 15 个月便达到独角兽地位；此前完成 1.8 亿美元 A 轮，随后在
              Activant Capital 和新加坡 EDBI 参与下扩大至 2.1 亿美元。2022 年 10 月，日本保险集团 Tokio Marine 领投 B 轮上行融资，使 bolttech 估值约达 15
              亿美元，并提供战略资产负债表能力和承保支持。最近，公司于 2025 年中完成 1.47 亿美元 C 轮，投后股权估值更新为 21 亿美元。该轮由 Sumitomo Corporation 和欧洲风险投资机构
              Iberis Capital 联合领投，Dragon Fund、Baillie Gifford 及 Generali 旗下 Lion River 继续参与。关键在于，Sumitomo
              的投资与成立运营合资企业同步进行，旨在通过亚洲电信渠道扩大设备生命周期保障。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: 运营里程碑、透明度缺口与尽调重点
        blocks:
          - type: paragraph
            body: >-
              尽管 bolttech 资本积累迅速、地域版图不断扩大，独立技术分析师和私募市场评论人士仍强调其财务基本面的显著不透明。Bolttech 经常强调在 39 个市场报价超过 850
              亿美元年化保费等经营指标，但行业观察人士指出，报价总额并不直接对应确认收入、费率或经营利润。公司对经审计损益表、毛利率和客户队列留存保持沉默。非官方私募市场追踪机构 Latka 估计 2025 日历年收入约为
              3.2 亿美元，但经审计的 GAAP 或 IFRS 数据尚未公开披露。此外，bolttech 自报员工超过 2,000 人，而外部劳动力数据库估计更接近 1,028
              人，说明投资尽调必须核实实体范围及子公司合并口径。
            claimRefs:
