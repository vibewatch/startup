              Bolttech 在 Pacific Century Group 内部孵化，并与 FWD Group 及 Sumitomo、Tokio Marine
              等战略伙伴紧密协同。公司从关联方关系中获得显著商业优势，但这也引出分销条款是否公允以及收入集中度的治理问题。
            calloutType: risk
