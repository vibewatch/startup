      - number: '4.3'
        title: 成本结构与单位经济性仍属私密信息
        blocks:
          - type: paragraph
            body: >-
              公开案例描述了转化率提升、保费增长和服务提速等客户结果，但这些是伙伴成果，并非 Bolttech
              的收入、毛利或贡献利润。运营模式很可能承担跨市场集成、保险牌照与合规、保单管理、联络中心、理赔处理、维修网络和定制项目交付等重大成本。指定来源没有量化任何成本池，因此无法计算有依据的毛利率、获客成本、回本周期、净留存或伙伴
              队列盈利能力。关键投资判断要求，是按地域、产品、保险公司和分销伙伴拆分，完成从总书面或报价保费到确认收入、毛利和贡献利润的队列 级对账。没有这项数据，交易量快速增长仍可能与低费率或服务密集型交付成本并存。
            claimRefs:
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: 融资扩大能力，但不能证明现金跑道
        blocks:
          - type: paragraph
            body: >-
              Bolttech 于 2025 年 6 月以 21 亿美元估值完成 1.47 亿美元 C
              轮融资，并称资金将增强平台、加速全球增长。这证明公司可以获得外部融资，不代表当前可用现金。累计融资总额也不一致：Finovate 报告超过 6.9 亿美元，Multiples 报告五轮共 6.4
              亿美元，GetLatka 报告三轮共 5.53
              亿美元。轮次覆盖不同或许能解释差异，但这些总额都没有提供现金余额、烧钱、债务余额、优先股堆叠或本轮资金用途。因此资本充足性仍未证实。财务结论是：商业规模和融资能力可信，但收入质量、利润率路径和跑道仍是重大阻碍。管理层应在得出估值或偿付能力结论前，提供经审计报表、月度现金和烧钱、债务及契约安排，以及下一轮融资触发条件。
            claimRefs:
