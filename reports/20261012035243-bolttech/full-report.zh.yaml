              Bolttech 的经济角色位于保险公司、分销伙伴和终端客户之间。Multiples 描述了保险及保障产品分销产生的佣金、管理费和相关服务收入；Bolttech 则将自身定位为单一 API
              平台，拥有覆盖分销、销售、保单服务和理赔的 220
