    title: 正题与反题评估框架
    columns:
      - 支柱
      - 正题论点
      - 反题风险
      - 证据 / 尽调触发项
    rows:
      - - 分销护城河
        - 700 多家分销伙伴和覆盖 37 多个市场的 230 多家保险公司，构成强网络效应
        - 头部电信商和设备分销商的客户集中度高，替换风险也高
        - 审计后的合作伙伴流失及前十大伙伴群组集中度指标
      - - 产品与模式
        - 纯 API 驱动的嵌入式保障平台，避开主要承保资产负债表损失风险
        - B2B2C 赋能面临费率压缩和客户品牌黏性低的问题
        - 已披露的费率分配和合同结构（SaaS 费用与佣金）
      - - 财务质量
        - 年化保费报价 $50B 至 $90B，并持续获得全球顶级风险资本支持
        - 公开收入估算相互冲突（$320M 至 $1.9B），且没有任何经验证的 GAAP 利润率或 EBITDA 数据
        - FY2024-FY2025 经审计的 GAAP 损益表和现金流量表
      - - 退出准备度
        - 通过二级平台获得 IPO 前股份，显示合格投资者有兴趣
        - IPO 前股份带有转让限制、优先购买权障碍及流动性折价
        - 清晰的资本化表审阅及注册权评估
    notes: 框架将 Bolttech 公司和 Sumitomo 发布的规模指标，与 UpMarket 及 Silicon Valley Investclub 的市场数据进行对照。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV012
      - CV016
  - id: TV003
    title: 情景估值与目标回报矩阵
    columns:
      - 情景
      - 运营与增长假设
      - 隐含净收入
      - 估值倍数
      - 目标估值
      - 下行情景 / 正题失效触发项
    rows:
      - - 乐观
        - 设备合资企业达到 10M 用户；费率维持在 4%；ARR 增长超过 40% YoY
        - $450M - $550M
        - 6.0x - 8.0x
        - $2.8B - $3.5B
        - 承保机构被绕过，或监管限制嵌入式保险捆绑销售
      - - 基准
        - 业务量温和增长 15-25%；设备保障保持稳定；费率为 2.5%
        - $350M - $420M
        - 4.5x - 5.5x
        - $1.8B - $2.1B
        - 合作伙伴流失超过 10%，或亚洲关键电信伙伴更换供应商
      - - 悲观
        - 倍数严重压缩；平台费下滑；合作伙伴集中度优势丧失
        - $250M - $300M
        - 3.0x - 4.0x
        - $1.0B - $1.4B
        - 二级市场价格跌破 $1.5B，或 Series D 下轮融资造成稀释
    notes: 假设 Bolttech 具备相应运营模式特征，并采用 2026 年当时适用的金融科技估值倍数进行情景分析。
    claimRefs:
      - CV005
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2020 年成立到 2025 年 Series C 融资期间的重要组织、融资、合作及运营里程碑。
    data:
      items:
        - date: 2020-04
          label: 公司成立
          detail: bolttech 在新加坡正式启动，由 Pacific Century Group 和 FWD Group 孵化，Rob Schimek 负责领导。
          tone: neutral
        - date: 2021-07
          label: 独角兽地位与 Series A
          detail: 创立 15 个月内完成创纪录的 $180 million Series A 融资，达到独角兽地位。
          tone: positive
        - date: 2021-09
          label: Series A 扩展轮
          detail: 在 Activant Capital 和新加坡 EDBI 支持下，将 Series A 扩大至 $210 million。
          tone: positive
        - date: 2022-06
          label: 全球交易规模
          detail: 覆盖 700 多家分销伙伴和 189 家保险承保机构，年化保费报价超过 $44 billion。
          tone: neutral
        - date: 2022-10
          label: 与 Tokio Marine 的 Series B 上调轮
          detail: 获得 Tokio Marine 领投的 Series B 融资，估值上调至约 $1.5 billion。
          tone: positive
        - date: 2024-06
          label: 收购 Digital Care 并在波兰重新品牌化
          detail: 完成对总部位于波兰的设备保障专家 Digital Care 的整合和重塑品牌，将其更名为 bolttech Poland。
          tone: neutral
        - date: 2025-05
          label: Sumitomo 战略合作
          detail: 与 Sumitomo Corporation 成立合资企业并建立战略合作，为亚洲范围的电信设备提供保障。
          tone: positive
        - date: 2025-06
          label: Series C 融资与 $2.1B 估值
          detail: 完成由 Sumitomo Corporation 和 Iberis Capital 领投的 $147 million Series C 融资，估值升至 $2.1 billion。
          tone: positive
    approximationNotes: 日期来自公开新闻公告和经核实的公司披露；时间线展示战略推进节奏，不代表所有区域实体的设立过程。
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO011
      - CO013
  - id: FM001
    title: 嵌入式保障转化金字塔
    type: pyramid
    summary: 多层市场规模框架，展示从宏观保障潜力到可变现费率经济性的转化漏斗。
    data:
      items:
        - label: 第 1 层：平台变现费率（SOM 核心）
          detail: 估计从已处理保障业务量中取得的净交易及技术平台费率（通常为已承保保费的 5-15%，私有 / 未披露）
          value: Undisclosed Take Rate
        - label: 第 2 层：已承保且有效的嵌入式保单（SOM 运营）
          detail: 报价保费中已在 39 个活跃国家市场成功转化并承保的部分
          value: Bound GWP Subset
        - label: 第 3 层：年化保费报价吞吐量（直接机会）
          detail: 由 700 多家分销伙伴和 230 多家保险承保机构协调的保费报价规模
          value: $85B-$90B+
          unit: USD
        - label: 第 4 层：产品目录与承保机构交易能力（SAM 可用）
          detail: 在设备、家居、网络安全、汽车和旅行类别中支持超过 6,000 至 7,000 种产品变体
          value: 7,000+ Products
        - label: 第 5 层：全球合作伙伴分销网络（SAM 可触达）
          detail: 覆盖四大洲的电信、零售、汽车及银行合作伙伴全球网络
          value: 700+ Partners
        - label: 第 6 层：全球可触达保障缺口（宏观 TAM）
          detail: 面向数字化嵌入消费者生活方式的全球可触达非寿险及保障市场总规模
          value: Multi-Trillion Opportunity
    approximationNotes: 保费报价规模（$85B-$90B+）来自 bolttech 公司公告及 Insurtech Insights 在 2026 年年中的披露。由于私有交易费率未披露， 转化为已承保保费和净费率层级受到限制。
    claimRefs:
      - CM001
      - CM004
      - CM010
      - CM013
