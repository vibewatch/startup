      - number: '3.5'
        title: 切换成本、分销壁垒与不利事件风险
        blocks:
          - type: paragraph
            body: >-
              Bolttech 的竞争防御力受到高企业切换成本和多供应商并用摩擦的强化。一旦大型电信运营商或零售银行把 bolttech
              的动态报价问卷、保单管理系统和维修物流嵌入客户计费流程，迁移到替代供应商就会带来显著技术风险、合作伙伴重新签约和服务中断。与 Sumitomo Corporation
              及区域龙头保险公司的战略分销联盟，也锁定了东南亚主要设备零售渠道；当地设备价格上涨正推动消费者对智能手机保险的需求加速。然而，bolttech 的网络安全治理和企业信任仍面临严重不利风险。2026 年 1
              月，勒索软件组织 Everest 声称窃取 bolttech 186GB 内部记录，包括客户保单数据、员工账户和财务标识符。Bolttech
              尚未公开确认该事件，官方监管制裁也尚未得到验证；但未解决的泄露指控会削弱企业交易对手信心，可能拉长采购审查，并给通过安全审查的竞争者留下机会。
            claimRefs:
