  - id: FI001
    title: 经济性未决的收入模式桥接图
    type: flow
    summary: 客户活动可以产生分销和服务收入，但从保费流转化为毛利的每一步都需要私有合同数据。
    data:
      nodes:
        - id: partner-demand
          label: 合作伙伴客户旅程
          detail: 分销商将保障嵌入现有销售渠道。
        - id: quote-and-bind
          label: 报价与保单活动
          detail: Bolttech 连接产品提供方与分销伙伴。
        - id: premium-flow
          label: 报价或已承保保费
          detail: 公开证据披露的是保费报价规模，而非已确认收入。
        - id: distribution-revenue
          label: 佣金与管理收入
          detail: 费率、收费表及确认时间均未披露。
        - id: servicing-cost
          label: 服务与交付成本
          detail: 理赔申请、联络中心、维修及定制成本均未披露。
        - id: gross-profit
          label: 毛利与现金贡献
          detail: 公开信息无法计算利润率、营运资金和现金转化。
    approximationNotes: 仅为概念性流程；不含任何估计转化率、费率或利润率，也不意味着每个项目都会使用所有服务。
    claimRefs:
      - CI002
      - CI006
      - CI012
      - CI013
  - id: FE001
    title: Bolttech 多层平台架构
    type: stack
    summary: 分层架构展示合作伙伴分销界面、云端 API 微服务、承保连接器及实体服务网络。
    data:
      layers:
        - label: 分销与互动触点
          detail: 包括 Consumer Self-Service、Partner Portal、Agency Portal 和 Merchant Management 在内的全渠道门户。
        - label: 集成与沙盒网关
          detail: RESTful Embedded Insurance APIs、Webhooks、Partner Testing Sandbox 及 Third-Party Data Connectors。
        - label: 微服务与保单编排引擎
          detail: 超过 220 个模块化微服务，管理产品定价、推荐、保单承保及生命周期管理。
        - label: 承保与保险机构集成总线
          detail: 多承保机构连接器、承保规则转换适配器及实时保单报价聚合。
        - label: 企业云基础设施
          detail: AWS 云计算、Amazon EC2、MongoDB Atlas 数据持久化及企业级基于角色的安全控制。
        - label: 实体服务与维修生态
          detail: 全球设备维修网络、认证电子技术人员、逆向物流及多语种联络中心。
    approximationNotes: 基于工程披露和产品文档对平台层级的概念性呈现。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE009
      - CE011
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示 bolttech 嵌入式保障生命周期中客户与合作伙伴的端到端旅程。
    data:
      items:
        - label: 销售点集成
          detail: 通过 API 动态配置保障的电商结账、电信合同签署或银行应用开户。
          touchpoints:
            - 电商结账组件
            - 电信门店设备购买
            - 银行应用贷款发起
        - label: 动态报价与保单承保
          detail: 算法定价将买方画像和设备价值与 230 多家承保机构的承保规则匹配。
          touchpoints:
            - 亚秒级报价生成
            - 无代码保单配置器
            - 即时数字证书交付
        - label: 数字化开户与服务
          detail: 支持数字化保单管理、文档访问及保障更新的白标投保人门户。
          touchpoints:
            - 白标移动 Web 门户
            - 自动化保单文档
            - 自助修改保障范围
        - label: 自动化理赔提交
          detail: 支持预测式填表、图片上传和智能路由的全渠道理赔申请。
          touchpoints:
            - 移动理赔申报门户
            - 全球多语种联络中心
            - 文档核验流程
        - label: 履约与设备生命周期
          detail: 调度全球维修网络、替换设备，并与 Sumitomo 等伙伴开展循环以旧换新。
          touchpoints:
            - 授权维修技术人员调度
            - 快速替换物流
            - 二手设备以旧换新与转售
        - label: 合作伙伴扩张与交叉销售
          detail: 售后互动门户用于培养客户忠诚度，并支持合作伙伴向家居、旅行或网络安全领域交叉销售。
          touchpoints:
            - 360 度互动分析
            - 触发式多险种保障报价
            - 年度保单续期提醒
    approximationNotes: 旅程阶段反映 bolttech 截至 2026 年 10 月公布的运营架构和产品文档。
