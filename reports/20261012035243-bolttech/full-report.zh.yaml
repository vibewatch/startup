            body: >-
              Bolttech 目前声称年报价保费超过 900 亿美元，而 2022 年约为 500 亿美元。这说明交易所路由的活动大幅扩张，但报价保费既不是入账收入，也不是
              ARR，无法说明费率、收入确认政策、取消、保险公司转付或毛利。官网还声称覆盖 39 个市场、拥有 700 多家分销伙伴和 7,000 多种产品，体现的是运营广度，而不是收入质量。GetLatka 列出 2025
