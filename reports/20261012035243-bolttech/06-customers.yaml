figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: End-to-end customer and partner journey across bolttech embedded protection lifecycle.
    data:
      items:
        - label: Point-of-Sale Integration
          detail: E-commerce checkout, telco contract signing, or bank app onboarding where protection is dynamically configured via API.
          touchpoints:
            - E-commerce checkout widget
            - Telco store device purchase
            - Banking app loan origination
        - label: Dynamic Quoting & Policy Binding
          detail: Algorithmic pricing matching buyer profile and device value to 230+ carrier underwriting rules.
          touchpoints:
            - Sub-second quote generation
            - No-code policy configurator
            - Instant digital certificate delivery
        - label: Digital Onboarding & Servicing
          detail: White-label policyholder portal supporting digital policy administration, document access, and coverage updates.
          touchpoints:
            - White-label mobile web portal
            - Automated policy documentation
            - Self-service coverage modification
        - label: Automated Claims Submission
          detail: Omni-channel claims filing with predictive form filling, image upload, and intelligent routing.
          touchpoints:
            - Mobile claims filing portal
            - Global multi-lingual contact centers
            - Document verification workflow
        - label: Fulfillment & Device Lifecycle
          detail: Global repair network dispatch, device replacement, and circular trade-in with partners like Sumitomo.
          touchpoints:
            - Authorized repair technician dispatch
            - Express replacement logistics
            - Used device trade-in and resale
        - label: Partner Expansion & Cross-Selling
          detail: Post-sale engagement portal cultivating customer loyalty and enabling partner cross-sell into home, travel, or cyber.
          touchpoints:
            - 360-degree engagement analytics
            - Triggered multi-line coverage offers
            - Annual policy renewal prompt
    approximationNotes: Journey stages reflect bolttech's published operational architecture and product documentation as of October 2026.
