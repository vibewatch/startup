callouts:
  - calloutType: insight
    title: 'The B2B2C Wedge: Converting Point-of-Sale Attention into Multi-Line Retention'
    body: Bolttech's core commercial engine relies on selling low-ticket device protection at the exact moment of physical purchase. While consumer electronics insurance delivers high transaction velocity, the platform's long-term enterprise valuation depends on whether these touchpoints can successfully cross-sell higher-margin lines such as cyber, travel, and personal property.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU012
  - calloutType: risk
    title: Disintermediation and Disclosure Deficits Across Major Distribution Channels
    body: 'Despite processing tens of billions in annualized quoted premiums, Bolttech''s commercial durability faces two structural challenges: the threat of tier-one distributors building direct carrier API integrations in-house, and complete opacity regarding cohort renewal rates, partner concentration, and underwriting profitability.'
    claimRefs:
      - CU013
      - CU014
      - CU015
