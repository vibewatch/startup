  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Pricing & Packaging Model
      - Mechanism & Unit
      - Included Capabilities
      - Discounts, Take-Rates & Unknowns
      - Competitive Implication
    rows:
      - - GWP Distribution Take Rate
        - Percentage commission on gross written premium (typically 10%-25% depending on insurance product line)
        - Product catalog access, dynamic quoting API, checkout integration, and policy binding
        - Exact carrier net-retention and distributor split schedules are private commercial agreements
        - Aligns vendor incentives with partner sales volume but exposes revenue to underlying product premium cycles
      - - Enterprise Platform / SaaS Licensing
        - Recurring annual or monthly software subscription plus implementation and integration fees
        - Agency management portal, developer SDKs, telemetry dashboards, and partner enablement tooling
        - Volume tiering and enterprise bundling discounts applied for multi-country rollouts
        - Provides recurring high-margin software revenue distinct from cyclical underwriting performance
      - - Lifecycle & Servicing Fees
        - Per-incident or per-device servicing fee for repair coordination, claim handling, and trade-in management
        - Global contact center support, reverse logistics dispatch, and authorized technician network management
        - Device repair fulfillment costs vary widely by geography, parts availability, and warranty terms
        - Expands revenue capture beyond digital checkout into operational post-sale customer lifecycle
    notes: Commercial packaging structures derived from industry benchmarks, B2B2C distribution engine disclosures, and partner announcements. Private revenue-share percentages represent standard industry ranges.
