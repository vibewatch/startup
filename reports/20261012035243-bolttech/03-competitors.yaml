callouts:
  - calloutType: insight
    title: Carrier Neutrality as a Key Enterprise Wedge
    body: Unlike captive carrier platforms such as Chubb Studio, bolttech provides distribution partners with open access to hundreds of pre-integrated insurers. This multi-carrier architecture enables enterprise distributors to deliver dynamic policy comparisons and maintain supplier bargaining power without building custom bilateral carrier integrations.
    claimRefs:
      - CP002
      - CP012
  - calloutType: risk
    title: Ransomware Allegations Pose Counterparty Audit Headwinds
    body: The unconfirmed Everest ransomware breach claim involving 186GB of alleged policy and financial data represents a critical operational risk. For an infrastructure platform handling enterprise customer records and compliance workflows, unresolved security allegations threaten partner trust and can lengthen enterprise sales cycles.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP014
