    title: Competitor Profile Table
    columns:
      - Competitor
      - Category
      - Scale / Funding Lens
      - Target Segment
      - Key Differentiation
      - Strategic Limitation
    rows:
      - - bolttech
        - Global Insurtech Exchange
        - $2.1B valuation; >$690M total raised (Series C in Dec 2024)
        - Global telcos, device retailers, banks, and e-commerce platforms
        - Multi-carrier exchange with hundreds of pre-integrated insurers and lifecycle device servicing
        - Heavy operational complexity managing multi-jurisdiction regulatory compliance and repair logistics
      - - Cover Genius (XCover)
        - Specialized Embedded Insurtech
        - Private VC backing (~$165M+ raised; estimated valuation ~$1B+)
        - Global OTA travel platforms, ticketing platforms, and cross-border e-commerce
        - Proprietary XCover API tailored for checkout warranty, ticket protection, and instant claim payouts
        - Narrower presence in physical device repair, trade-in fulfillment, and local offline carrier networks
      - - Chubb Studio / Carrier Platforms
        - Incumbent Carrier Studio
        - Corporate balance-sheet scale of global balance-sheet insurer ($100B+ market cap)
        - Tier-1 global financial institutions, airlines, and multinational enterprises
        - Direct balance-sheet capacity, premier global brand reputation, and unified international underwriting
        - Single-carrier captive limitation; lacks independent market comparison and multi-underwriter dynamic quoting
      - - In-House Build / White-Label Broker
        - Status Quo / Internal IT
        - Corporate IT and risk budget allocations ($2M-$10M build cost)
        - Large enterprise retailers and regional telcos seeking full margin capture
        - Zero intermediary take-rate leakage and bespoke proprietary customer journey control
        - High continuous engineering overhead, slow carrier integration speed, and burdensome regional licensing
