companyProfile:
  summary: >-
    Bolttech is a Singapore-headquartered embedded insurance exchange and servicing platform that connects carriers,
    telecoms, retailers, banks, and other distribution partners through a cloud-based API stack. The company has scaled
    to 39 markets, 700+ distribution partners, and 230+ insurance carriers, but it remains opaque on audited financials,
    take rates, and cohort retention.
