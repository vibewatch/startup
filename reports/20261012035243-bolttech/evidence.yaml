evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited financial statements detailing bolttech's GAAP/IFRS revenue breakdown, net take rate across quoted
      premiums, gross margins, and operating cash burn.
    whyItMatters: >-
      Quoted annualized premium volume ($85B+) does not indicate actual revenues or profitability, leaving valuation
      multiples and unit economics uncertain.
    diligencePath: >-
      Obtain statutory annual returns filed with Singapore's Accounting and Corporate Regulatory Authority (ACRA) or
      confidential investor presentation materials under NDA.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: capitalization-table
    missingEvidence: >-
      Complete capitalization table and shareholder registry disclosing exact percentage ownership stakes, liquidation
      preferences, and secondary transaction terms.
    whyItMatters: >-
      Without full shareholder registry filings, exact voting control and economic priority between Pacific Century
      Group, strategic corporates, and institutional funds cannot be confirmed.
    diligencePath: >-
      Review company share register filings with Singapore ACRA or Series C shareholder rights agreement during formal
      investment diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: take-rate-disclosure
    missingEvidence: >-
      Audited financial breakdown of net platform revenue, take rates, and bound gross written premiums versus quoted
      premium throughput.
    whyItMatters: >-
      Quoted premiums ($85B-$90B+) measure transaction throughput across the exchange but do not establish bolttech's
      economic monetization or margin profile.
    diligencePath: >-
      Obtain private management accounts, audited Series C financial disclosures, or carrier commission schedules during
      investment diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Volume distribution and churn metrics across top distribution partners and carrier cohorts.
    whyItMatters: >-
      Heavy reliance on key anchor partners or affiliated entities could introduce structural channel risk if commercial
      terms shift.
    diligencePath: >-
      Request customer and partner concentration schedules, contract renewal dates, and gross margin contribution by
      partner cohort.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing
    missingEvidence: >-
      Audited take-rate percentages, net commission schedules, and enterprise SaaS subscription contract pricing across
      major distribution partners.
    whyItMatters: >-
      Without transparent revenue-share disclosures, evaluating unit economics and competitive margin pressure against
      rival insurtechs remains an inference.
    diligencePath: Request anonymized partner cohort contracts and take-rate schedules during formal management diligence.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: cybersecurity-incident
    missingEvidence: >-
      Independent third-party forensic reports or official regulatory breach disclosures verifying the scope and
      validity of the alleged 186GB Everest ransomware incident.
    whyItMatters: >-
      Unconfirmed data breach allegations expose the company to potential partner contract penalties, regulatory
      scrutiny, and customer churn if sensitive financial or PII records were compromised.
    diligencePath: >-
      Request internal security incident post-mortems, SOC2 compliance audits, and regulatory communications regarding
      the January 2026 dark web claim.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized take rates, price schedules, discounts, minimum commitments and revenue-recognition terms by product and
      partner cohort.
    whyItMatters: >-
      Without contract economics, quoted premium and partner counts cannot be converted into revenue quality or
      gross-profit estimates.
    diligencePath: >-
      Review a representative contract sample and reconcile quoted premium, written premium, recognized revenue and
      gross profit by cohort.
    relatedQuestionRefs:
