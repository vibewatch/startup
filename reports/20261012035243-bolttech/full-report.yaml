            title: Ecosystem Interdependence with Strategic Backers
            body: >-
              Incubated within Pacific Century Group and closely aligned with FWD Group and strategic partners like
              Sumitomo and Tokio Marine, bolttech derives significant commercial advantage from affiliate relationships,
              raising governance questions regarding arms-length distribution terms and revenue concentration.
            calloutType: risk
