            title: Platform Gross Volume Versus Revenue Conversion
            body: >-
              Bolttech's headline metric of $85 billion+ in quoted premiums represents gross transaction throughput
              across its exchange rather than company revenues. In the absence of audited net take rates or GAAP
              filings, underwriting the $2.1 billion valuation requires caution regarding true gross-to-net margin
              conversion.
            calloutType: insight
            claimRefs:
              - CO010
