  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Core Insurance Exchange
        blocks:
          - type: paragraph
            body: >-
              Bolttech positions its core offering as a comprehensive B2B2C embedded protection and insurance exchange
              that connects underwriters, enterprise distribution partners, and end-consumers across digital and
              physical touchpoints. Rather than operating purely as a traditional Managing General Agent (MGA) or
              bespoke software distributor, the platform acts as an intermediary exchange operating across more than 30
              international markets. The platform architecture enables non-insurance enterprises—such as
              telecommunications operators, digital banks, e-commerce retailers, and original equipment manufacturers
              (OEMs)—to embed tailored protection products directly into existing purchase or service workflows. Through
              a unified cloud integration point, corporate distribution partners can present single-product offerings or
              multi-carrier comparative catalogs to retail consumers without building custom bilateral carrier
              integrations. Technical enablement spans quote generation, risk binding, policy fulfillment, and automated
              policy lifecycle administration across personal lines, travel, and mobile device protection.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE009
              - CE011
              - CE014
      - number: '5.2'
        title: Operating Stack, API Architecture, and Administration
        blocks:
          - type: paragraph
            body: >-
              The underlying operating model relies on a cloud-based infrastructure hosted on Amazon Web Services (AWS)
              that orchestrates over 220 discrete microservices. The architecture is engineered around modular service
              interfaces designed to decouple front-end partner touchpoints from legacy back-end insurance carrier
              underwriting systems. Core operational functions, including product recommendation algorithms, rating
              engines, policy issuance, and billing reconciliation, execute as distributed cloud microservices
              communicating via application programming interfaces (APIs). Distribution partners integrate through
              standard RESTful endpoints or an API sandbox environment that allows technical teams to simulate pricing
              models, policy structures, and partner transaction journeys before moving into production. Administrative
              management and partner portal functionality, notably for the high-volume Device Protection department,
              utilize customized open-source administrative tooling built with AdminJS on Node.js and Express, connected
              to MongoDB Atlas databases for role-based configuration, batch data imports, and enterprise credential
              auditing.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE013
      - number: '5.3'
        title: Post-Sale Servicing, Device Lifecycle, and Operating Workflow
        blocks:
          - type: paragraph
            body: >-
              Beyond digital policy distribution, Bolttech maintains an operational and physical servicing layer
              tailored to consumer electronics, mobile handsets, and specialized protection lines. The digital insurance
              platform orchestrates post-sale activities through a white-label servicing and claims portal that utilizes
              dynamic intake forms and predictive field population to minimize customer friction during claim
              submission. For physical asset lines such as smartphones and connected gadgets, the digital workflow
              integrates directly with authorized third-party repair networks, logistics providers, and regional contact
              centers operating in multiple languages. Strategic joint ventures, such as Bolttech's collaboration with
              Sumitomo Corporation across South and Southeast Asia, link this digital claims architecture to device
              refurbishment, repair, and circular resale infrastructure. However, the reliance on external logistics and
              localized repair facilities introduces operational dependencies that distinguish Bolttech's operational
              footprint from pure SaaS software margins.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE010
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: API-Driven Decoupling Accelerates Distribution Onboarding
            body: >-
              Bolttech's primary architectural value proposition lies in abstracting heterogeneous insurer underwriting
              rules into a standardized catalog of over 220 cloud microservices. This abstraction allows distribution
              partners like telecommunications carriers and digital banks to embed insurance products at digital
              checkout via a single API, drastically compressing deployment timelines compared to legacy bilateral
              carrier integrations.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE008
          - type: callout
            title: Operational and Supply Chain Dependencies in Device Protection
            body: >-
              Unlike pure software marketplaces that maintain minimal post-sale operational exposure, Bolttech's device
              protection line requires direct integration with physical logistics, customer contact centers, and
              certified repair networks. Operational bottlenecks or spare part shortages within regional repair networks
              introduce execution risks that digital API layers cannot eliminate.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and B2B2C Distribution Structure
        blocks:
          - type: paragraph
            body: >-
              Bolttech operates as an intermediary infrastructure provider linking two primary enterprise customer
              groups: underwriting insurance carriers seeking digital distribution, and non-insurance commercial
              distributors seeking embedded protection products for their retail consumer bases. Rather than
              underwriting balance-sheet risk directly, the platform functions as a cloud-based exchange connecting more
              than 700 distribution partners with over 230 carriers across 39 international markets. The commercial
              anchor of this model is point-of-sale device protection and extended warranties, typically priced between
              2% and 10% of the underlying product value. This high-frequency, low-ticket wedge enables consumer
              electronics retailers, mobile network operators, and digital platforms to monetize transaction flows with
              minimal operational friction, allowing Bolttech to capture platform fees, commissions, and servicing
              revenues across more than 7,000 distinct product variations.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
