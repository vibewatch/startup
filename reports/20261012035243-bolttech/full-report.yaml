chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Bolttech was established in Singapore in April 2020 as an international insurance technology platform,
              originally incubated within Pacific Century Group and FWD Group under the executive leadership of Rob
              Schimek. The company operates a global business-to-business-to-consumer (B2B2C) digital insurance exchange
              that connects insurance carriers, digital distribution partners, and end consumers through a unified
              cloud-based software infrastructure and standardized application programming interfaces. Rather than
              underwriting insurance risk directly onto its own balance sheet, bolttech functions as an exchange
              intermediary and orchestration layer. Its core technology suite manages end-to-end policy lifecycles,
              product configuration, partner onboarding, and digital claims processing. As of 2026, bolttech reports
              operating across 39 international markets spanning four continents, quoting more than $85 billion in
              annualized gross premiums and connecting over 700 distribution partners to more than 230 licensed
              insurance carriers worldwide.
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO010
              - CO011
              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance, and Board Oversight
        blocks:
          - type: paragraph
            body: >-
              Bolttech is directed by an experienced executive management cadre and governed by an influential board of
              directors reflecting its institutional lineage within Asian finance and international insurance markets.
              Group Chief Executive Officer Rob Schimek brings more than 35 years of global insurance leadership
              experience, having previously served as Managing Director and Group Chief Operating Officer of FWD Group
              and President and CEO of AIG's commercial insurance businesses worldwide. Governance oversight is anchored
              by Board Chairman Richard Li Tzar Kai, founder and Chairman of Pacific Century Group, which provides
              cornerstone sponsorship and strategic access across regional financial services and telecommunications
              assets. Independent and non-executive board representation includes high-profile international figures
              such as Malcolm Turnbull, the 29th Prime Minister of Australia and former Goldman Sachs partner, alongside
              Peter Hancock, former Group CEO of AIG. Functional leadership is led by Group Chief Technology and
              Operating Officer David Lynch, previously CIO at DBS and Standard Chartered, and Group General Counsel
              Ashley Mullins, formerly of Chubb.
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
      - number: '1.3'
        title: Capitalization History, Valuation, and Stakeholder Composition
        blocks:
          - type: paragraph
            body: >-
              Bolttech has pursued an aggressive capital formation strategy since its inception, raising more than $690
              million in aggregate equity financing to support international acquisitions, geographic expansion, and
              technology development. The company achieved unicorn status in July 2021 just 15 months after its
              founding, following a $180 million Series A financing round that was subsequently expanded to $210 million
              with participation from Activant Capital and Singapore's EDBI. In October 2022, Japanese insurance
              conglomerate Tokio Marine led an up-round Series B financing round valuing bolttech at approximately $1.5
              billion, providing strategic balance-sheet capacity and underwriting support. Most recently, bolttech
              closed a $147 million Series C round in mid-2025 at an updated post-money equity valuation of $2.1
              billion. The round was co-led by Sumitomo Corporation and European venture investor Iberis Capital,
              alongside ongoing institutional participation from Dragon Fund, Baillie Gifford, and Generali's Lion
              River. Crucially, Sumitomo's investment coincided with the formation of an operating joint venture to
              scale device lifecycle protection across Asian telecom channels.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: Operational Milestones, Transparency Deficits, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Despite bolttech's rapid capital accretion and expanding geographic footprint, independent technology
              analysts and private-market commentators have emphasized notable opacity regarding the company's financial
              fundamentals. While bolttech frequently highlights top-line operational metrics such as quoting over $85
              billion in annualized premiums across 39 markets, industry observers point out that gross quoted volumes
              do not correlate directly with recognized net revenues, take rates, or operating profitability. The
              company remains tight-lipped regarding its audited income statements, gross margins, and customer cohort
              retention. Unofficial private market trackers such as Latka estimate calendar 2025 revenue at
              approximately $320 million, but audited GAAP or IFRS figures have not been publicly disclosed.
              Additionally, reported global headcount metrics exhibit divergence between bolttech's self-reported figure
              of over 2,000 team members and external workforce database estimates tracking closer to 1,028 employees,
              highlighting the necessity of verifying entity scope and subsidiary consolidation during investment
              diligence.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO013
