figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Major organizational, funding, partnership, and operational milestones from founding in 2020 through Series C
      financing in 2025.
    data:
      items:
        - date: 2020-04
          label: Company Launch
          detail: >-
            bolttech officially launches in Singapore, incubated within Pacific Century Group and FWD Group, led by Rob
            Schimek.
          tone: neutral
        - date: 2021-07
          label: Unicorn Status & Series A
          detail: Achieves unicorn status within 15 months of launch following a record $180 million Series A round.
          tone: positive
        - date: 2021-09
          label: Series A Extension
          detail: Extends Series A to $210 million with backing from Activant Capital and Singapore EDBI.
          tone: positive
        - date: 2022-06
          label: Global Exchange Scale
          detail: >-
            Exceeds $44 billion in annualized quoted premiums across 700+ distribution partners and 189 insurance
            carriers.
          tone: neutral
        - date: 2022-10
          label: Series B Up-Round with Tokio Marine
          detail: >-
            Secures Series B funding led by Tokio Marine, establishing an up-round valuation of approximately $1.5
            billion.
          tone: positive
        - date: 2024-06
          label: Digital Care Acquisition & Polish Rebrand
          detail: >-
            Completes integration and rebranding of Poland-based device protection specialist Digital Care as bolttech
            Poland.
          tone: neutral
        - date: 2025-05
          label: Sumitomo Strategic Partnership
          detail: >-
            Forms joint venture and strategic partnership with Sumitomo Corporation for Asia-wide telecom device
            protection.
          tone: positive
        - date: 2025-06
          label: Series C Financing & $2.1B Valuation
          detail: >-
            Closes $147 million Series C round led by Sumitomo Corporation and Iberis Capital, elevating valuation to
            $2.1 billion.
          tone: positive
    approximationNotes: >-
