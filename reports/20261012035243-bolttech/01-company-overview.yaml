callouts:
  - calloutType: "insight"
    title: "Platform Gross Volume Versus Revenue Conversion"
    body: "Bolttech's headline metric of $85 billion+ in quoted premiums represents gross transaction throughput across its exchange rather than company revenues. In the absence of audited net take rates or GAAP filings, underwriting the $2.1 billion valuation requires caution regarding true gross-to-net margin conversion."
    claimRefs:
      - "CO010"
      - "CO014"
      - "CO015"
  - calloutType: "risk"
    title: "Ecosystem Interdependence with Strategic Backers"
    body: "Incubated within Pacific Century Group and closely aligned with FWD Group and strategic partners like Sumitomo and Tokio Marine, bolttech derives significant commercial advantage from affiliate relationships, raising governance questions regarding arms-length distribution terms and revenue concentration."
    claimRefs:
      - "CO004"
      - "CO007"
      - "CO008"
