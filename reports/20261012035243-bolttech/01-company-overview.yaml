company:
  name: "Bolttech"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in Singapore in 2020, bolttech has rapidly scaled into a global B2B2C embedded insurance exchange connecting over 700 distribution partners with more than 230 insurance carriers across 39 markets. Valued at $2.1 billion following a $147 million Series C round in mid-2025 with backing from Pacific Century Group, Tokio Marine, and Sumitomo Corporation, the company quotes over $85 billion in annualized premiums, though audited net revenue and subsidiary margins remain undisclosed."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Business Model"
    body: "Bolttech was established in Singapore in April 2020 as an international insurance technology platform, originally incubated within Pacific Century Group and FWD Group under the executive leadership of Rob Schimek. The company operates a global business-to-business-to-consumer (B2B2C) digital insurance exchange that connects insurance carriers, digital distribution partners, and end consumers through a unified cloud-based software infrastructure and standardized application programming interfaces. Rather than underwriting insurance risk directly onto its own balance sheet, bolttech functions as an exchange intermediary and orchestration layer. Its core technology suite manages end-to-end policy lifecycles, product configuration, partner onboarding, and digital claims processing. As of 2026, bolttech reports operating across 39 international markets spanning four continents, quoting more than $85 billion in annualized gross premiums and connecting over 700 distribution partners to more than 230 licensed insurance carriers worldwide."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance, and Board Oversight"
    body: "Bolttech is directed by an experienced executive management cadre and governed by an influential board of directors reflecting its institutional lineage within Asian finance and international insurance markets. Group Chief Executive Officer Rob Schimek brings more than 35 years of global insurance leadership experience, having previously served as Managing Director and Group Chief Operating Officer of FWD Group and President and CEO of AIG's commercial insurance businesses worldwide. Governance oversight is anchored by Board Chairman Richard Li Tzar Kai, founder and Chairman of Pacific Century Group, which provides cornerstone sponsorship and strategic access across regional financial services and telecommunications assets. Independent and non-executive board representation includes high-profile international figures such as Malcolm Turnbull, the 29th Prime Minister of Australia and former Goldman Sachs partner, alongside Peter Hancock, former Group CEO of AIG. Functional leadership is led by Group Chief Technology and Operating Officer David Lynch, previously CIO at DBS and Standard Chartered, and Group General Counsel Ashley Mullins, formerly of Chubb."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization History, Valuation, and Stakeholder Composition"
    body: "Bolttech has pursued an aggressive capital formation strategy since its inception, raising more than $690 million in aggregate equity financing to support international acquisitions, geographic expansion, and technology development. The company achieved unicorn status in July 2021 just 15 months after its founding, following a $180 million Series A financing round that was subsequently expanded to $210 million with participation from Activant Capital and Singapore's EDBI. In October 2022, Japanese insurance conglomerate Tokio Marine led an up-round Series B financing round valuing bolttech at approximately $1.5 billion, providing strategic balance-sheet capacity and underwriting support. Most recently, bolttech closed a $147 million Series C round in mid-2025 at an updated post-money equity valuation of $2.1 billion. The round was co-led by Sumitomo Corporation and European venture investor Iberis Capital, alongside ongoing institutional participation from Dragon Fund, Baillie Gifford, and Generali's Lion River. Crucially, Sumitomo's investment coincided with the formation of an operating joint venture to scale device lifecycle protection across Asian telecom channels."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "operating-milestones-and-diligence-outlook"
    title: "Operational Milestones, Transparency Deficits, and Diligence Priorities"
    body: "Despite bolttech's rapid capital accretion and expanding geographic footprint, independent technology analysts and private-market commentators have emphasized notable opacity regarding the company's financial fundamentals. While bolttech frequently highlights top-line operational metrics such as quoting over $85 billion in annualized premiums across 39 markets, industry observers point out that gross quoted volumes do not correlate directly with recognized net revenues, take rates, or operating profitability. The company remains tight-lipped regarding its audited income statements, gross margins, and customer cohort retention. Unofficial private market trackers such as Latka estimate calendar 2025 revenue at approximately $320 million, but audited GAAP or IFRS figures have not been publicly disclosed. Additionally, reported global headcount metrics exhibit divergence between bolttech's self-reported figure of over 2,000 team members and external workforce database estimates tracking closer to 1,028 employees, highlighting the necessity of verifying entity scope and subsidiary consolidation during investment diligence."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
