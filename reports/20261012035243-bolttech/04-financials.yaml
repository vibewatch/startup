          detail: Take rate, fee schedule and recognition timing are undisclosed.
        - id: servicing-cost
          label: Servicing and delivery costs
          detail: Claims, contact-center, repair and customization costs are undisclosed.
        - id: gross-profit
          label: Gross profit and cash contribution
          detail: Margin, working capital and cash conversion cannot be calculated publicly.
    approximationNotes: >-
      Conceptual sequence only; it contains no estimated conversion rate, take rate
      or margin and does not imply that every program uses every service.
    claimRefs: [CI002, CI006, CI012, CI013]
