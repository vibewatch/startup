schemaVersion: "report-v2"
artifact: financials
slug: bolttech
runDate: 2026-10-12
company:
  name: Bolttech
chapter:
  number: 4
  title: Financials
  summary: >-
    Bolttech appears to monetize insurance distribution through commissions,
    administration and related services, but the public evidence does not expose
    realized pricing, take rates, gross margin, cash burn or runway. Company-claimed
    quoted-premium scale has increased materially, yet that transaction-flow metric
    is not revenue; a third-party $320 million revenue figure has no recorded source
    and should not be used for underwriting without primary financial evidence.
sections:
  - id: revenue-engine
    title: Revenue engine and monetization
    body: >-
      Bolttech's economic role sits between insurance carriers, distribution
      partners and end customers. Multiples describes commissions, administration
      fees and related services generated when insurance and protection products are
      distributed, while Bolttech markets a single-API platform with more than 220
      microservices spanning distribution, sales, policy servicing and claims. This
      supports a multi-stream model: transaction-linked distribution economics,
      software-enabled program administration, servicing and claims activity, and
      custom device-protection or lifecycle programs. The reviewed pages do not
      disclose list pricing, realized contract pricing, commission schedules, take
      rates, implementation fees or minimum commitments. Consequently, the revenue
      model is directionally identifiable but not quantifiable. Sumitomo's planned
      collaboration from device protection through resale also shows that strategic
      channels may broaden the service perimeter, although neither party disclosed
      the resulting revenue share or margin structure.
    claimRefs: [CI001, CI002, CI012, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction signals are not financial statements
    body: >-
      Bolttech currently claims more than US$90 billion of quoted premiums annually,
      compared with approximately US$50 billion disclosed in 2022. That comparison
      indicates substantial expansion in activity routed through the exchange, but
      quoted premium is neither booked revenue nor annual recurring revenue and does
      not reveal take rate, recognition policy, cancellations, carrier pass-throughs
      or gross profit. The homepage also claims 39 markets, more than 700 distribution
      partners and more than 7,000 products, demonstrating operating breadth rather
      than revenue quality. GetLatka lists US$320 million of annual revenue for June
      2025, but its own table says the source is not recorded. Tech in Asia had
      already warned in 2022 that platform metrics were no barometer for topline and
      that the company was tight-lipped about revenue. Until management supplies
      audited statements and a metric bridge, the revenue estimate should remain a
      low-confidence diligence lead rather than an underwriting input.
    claimRefs: [CI003, CI004, CI005, CI006, CI010, CI011, CI013]
    tableRefs: [TI003]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics remain private
    body: >-
      Public case studies describe customer outcomes such as higher conversion,
      premium growth and faster service, but those are partner results rather than
      Bolttech revenue, gross profit or contribution margin. The operating model
      plausibly carries material costs for integrations, insurance licensing and
      compliance across markets, policy administration, contact centers, claims
      handling, repair networks and custom program delivery. The assigned sources do
      not quantify any of those cost pools, so no defensible gross-margin estimate,
      customer-acquisition cost, payback period, net retention or partner-cohort
      profitability can be calculated. The key underwriting request is therefore a
      cohort-level reconciliation from gross written or quoted premium to recognized
      revenue, gross profit and contribution profit, separated by geography, product,
      carrier and distribution partner. Without it, rapid transaction growth could
      coexist with weak take rates or service-heavy delivery costs.
    claimRefs: [CI012, CI013, CI015]
  - id: capital-adequacy
    title: Funding extends capacity but does not establish runway
    body: >-
      Bolttech closed a US$147 million Series C at a US$2.1 billion valuation in June
      2025 and said the capital would enhance its platform and accelerate global
      growth. That establishes access to external financing, not cash currently
      available. Even the cumulative funding total is inconsistent: Finovate reports
      more than US$690 million, Multiples reports US$640 million across five rounds,
      and GetLatka reports US$553 million across three rounds. Different round
      coverage may explain the spread, but none of these totals supplies the cash
      balance, burn, debt balance, preference stack or post-round uses of funds.
      Capital adequacy is therefore unproven. The financial verdict is that commercial
      scale and financing access are credible, while revenue quality, margin path and
      runway remain material blockers. Management should provide audited statements,
      monthly cash and burn, debt and covenant schedules, and the next financing
      trigger before valuation or solvency conclusions are drawn.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI015]
callouts:
  - calloutType: risk
    title: Transaction scale cannot substitute for unit economics
    body: >-
      More than US$90 billion of quoted premium may indicate distribution reach, but
      it does not reveal recognized revenue, take rate, gross margin or cash
      generation. The only reviewed revenue estimate lacks a recorded source.
    claimRefs: [CI003, CI010, CI011, CI013]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Insurance distribution
        - Commissions when insurance or protection products are distributed
        - Commission or take rate
        - Undisclosed
        - Transaction-linked; carrier and cancellation terms unknown
        - Revenue by premium cohort, take rate and recognition policy
      - - Program administration
        - Administration and related services across the policy lifecycle
        - Fee per policy, program or service
        - Undisclosed
        - Potentially recurring, but contract duration and renewal are unknown
        - Contract samples, renewal data and gross margin by program
      - - Servicing and claims
        - Portals, contact centers, repair networks and claims workflows
        - Fee per policy, claim or service event
        - Undisclosed
        - Service intensity may dilute software-like margins
        - Service revenue, direct labor, repair and claims-handling costs
      - - Device lifecycle partnerships
        - Protection services linked with device distribution and resale
        - Revenue share, service fee or resale spread
        - Sumitomo partnership announced; economics undisclosed
        - Channel opportunity, not evidence of realized revenue
        - Joint-venture ownership, transfer pricing and contribution margin
    notes: >-
      Mechanisms are based on reviewed company, partner and market-data descriptions;
      all pricing, take-rate and realized-revenue fields are unavailable unless stated.
    claimRefs: [CI001, CI002, CI012, CI014]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offering
      - Price or contract unit
      - List versus realized pricing
      - Discounts or unknowns
      - Evidence implication
    rows:
      - - Single-API distribution platform
        - Undisclosed
        - Neither list nor realized price disclosed
        - Volume tiers, minimums and implementation fees unknown
        - Cannot calculate software revenue per partner
      - - Embedded insurance distribution
        - Commission or take rate not disclosed
        - Realized economics unavailable
        - Carrier share, refunds and cancellations unknown
        - Quoted premium cannot be converted into revenue
      - - Servicing, claims and custom solutions
        - Undisclosed service or program fee
        - Realized economics unavailable
        - Labor, repair-network and customization costs unknown
        - Gross-margin profile cannot be separated from platform economics
    notes: >-
      No public list-price schedule or realized contract economics appeared in the
      reviewed assigned sources; null economics are diligence gaps, not zero values.
    claimRefs: [CI002, CI012, CI013]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annual revenue
        - US$320M for June 2025, third-party figure with source not recorded
        - Low
        - Possible scale anchor, but not auditable
        - Audited revenue and recognition bridge
      - - Quoted premiums
        - More than US$90B annually, company-claimed
        - Medium
        - Activity proxy only; not revenue or ARR
        - Bind rate, written premium and take-rate bridge
      - - Gross margin
        - null
        - Unavailable
        - Determines whether servicing intensity permits operating leverage
        - Gross margin by stream, geography and partner cohort
      - - CAC and payback
        - null
        - Unavailable
        - Tests efficiency of enterprise and channel acquisition
        - Fully loaded acquisition cost and cohort payback
      - - Retention and concentration
        - null
        - Unavailable
        - Governs durability and bargaining power
        - Renewal, churn, net retention and top-ten partner concentration
      - - Funding raised
        - US$553M to more than US$690M across reviewed third-party sources
        - Low
        - Coverage differences prevent a clean cumulative total
        - Cap table and round-by-round cash proceeds reconciliation
      - - Cash, burn and runway
        - null
        - Unavailable
        - Required to assess financing dependency and next-round timing
        - Monthly cash, net burn, debt and covenant schedule
    notes: >-
      Values preserve each source's metric and period. Funding raised is not cash
      available, quoted premium is not revenue, and null denotes no support in the
      reviewed assigned evidence.
    claimRefs: [CI003, CI007, CI008, CI009, CI010, CI011, CI013, CI015]
