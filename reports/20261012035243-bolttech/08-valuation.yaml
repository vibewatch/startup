callouts:
  - calloutType: "recommendation"
    title: "Diligence Prerequisite: Convert Quoted Premiums to Audited GAAP Revenue"
    body: "Investors should refrain from underwriting equity allocations at the $2.1 billion valuation until Bolttech provides verified GAAP revenue, net revenue retention rates, and cohort-level take rates. Quoted premium figures of $50 billion to $90 billion reflect gross marketplace activity rather than company top-line capture."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV016"
  - calloutType: "risk"
    title: "Secondary Market Friction and Liquidity Risk"
    body: "While pre-IPO brokers quote an indicative $2.1 billion valuation, private transactions involve substantial illiquidity, right-of-first-refusal constraints, and potential discounts. Investors risk permanent capital impairment if subsequent institutional funding rounds reflect public tech multiple compression."
    claimRefs:
      - "CV009"
      - "CV012"
      - "CV015"
