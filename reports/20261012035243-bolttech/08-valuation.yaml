company:
  name: "Bolttech"
chapter:
  number: 8
  title: "Valuation"
  summary: "Bolttech commands a headline post-money valuation of $2.1 billion following its $147 million Series C round in June 2025, but the valuation stance remains stretched and warrants a research-more stance due to unverified net revenue run-rates, non-disclosed unit economics, and reliance on aggregate quoted premium metrics."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "Bolttech presents an investment thesis centered on global scale as an embedded insurance exchange, connecting more than 700 distribution partners with over 230 insurance providers across 37 to 39 markets on four continents. By offering quote, bind, pay, and servicing capabilities through modular APIs, Bolttech facilitates distribution without carrying primary balance-sheet underwriting risk. Conversely, the anti-thesis highlights critical structural uncertainties: public disclosures report annualized quoted premiums of $50 billion to $90 billion rather than recognized net revenue or annual recurring revenue, and independent trackers reveal starkly conflicting revenue estimates ranging from $320 million to $1.9 billion. Furthermore, while strategic corporate backers such as Tokio Marine and Sumitomo Corporation provide commercial distribution partnerships, the lack of transparency into partner concentration, gross margin, take-rates, and cap-table preference terms prevents underwriting the $2.1 billion Series C headline price with institutional conviction."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV002"
  - id: "financing-history-and-valuation-context"
    title: "Financing History and Valuation Context"
    body: "Bolttech reached unicorn status rapidly following its founding in 2020, closing an up-round Series B of $196 million in May 2023 at a $1.6 billion valuation led by Tokio Marine, and a Series C of $147 million in June 2025 at a $2.1 billion post-money valuation led by Dragon Fund, Sumitomo Corporation, and Iberis Capital. Cumulative funding stands at approximately $670 million to $690 million across six funding rounds. Secondary market platforms such as UpMarket broker accredited pre-IPO transactions for Bolttech stock at an indicative $2.1 billion valuation, while warning that shares remain illiquid, speculative, and subject to substantial discounts. A key diligence concern is cap-table dilution and liquidation preference overhang: Series B and Series C investors purchased an estimated 12% and 7% equity stake respectively, yet the specific seniority, participating rights, and return hurdles established across rounds have not been publicly disclosed."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV001"
  - id: "scenarios-and-recommendation-framework"
    title: "Valuation Scenarios and Recommendation Framework"
    body: "Assessing Bolttech across bull, base, and bear scenarios requires explicit modeling of take-rates, partner retention, and multiple compression. In the bull case, Bolttech achieves sustained expansion through joint ventures like its device lifecycle partnership with Sumitomo Corporation targeting 10 million customers by 2030, capturing a stable 3% to 5% software and distribution take-rate on quoted volume to justify a $2.8 billion to $3.5 billion valuation at 7x to 9x revenue. In the base case, revenue growth moderates amid carrier fee resistance and platform commoditization, supporting a valuation of $1.8 billion to $2.1 billion at 5x to 6x revenue. In the bear case, partner churn, margin compression, and secondary market illiquidity trigger a down-round valuation of $1.0 billion to $1.4 billion at 3x to 4x revenue. Consequently, the recommendation is research-more with high risk and a stretched valuation stance, requiring access to audited financials and partner retention cohorts before capital commitment."
    claimRefs:
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
