evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board observers, and cap-table ownership by major investors and founders.
    whyItMatters: >-
      Governance rights and ownership concentration affect control, refresh dynamics, and any downside or secondary
      liquidity scenario.
    diligencePath: >-
      Request the latest board list, voting agreements, and post-2023 cap-table summary from the company or lead
      investor.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Current ARR, gross margin, burn, net retention, cash balance, and runway as of 2025-2026.
    whyItMatters: >-
      The company can look scaled on reach metrics while still carrying weak unit economics or elevated cash burn that
      changes valuation materially.
    diligencePath: >-
      Obtain board materials or audited management accounts covering FY2024, FY2025, and year-to-date 2026 operating
      performance.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A fresh priced primary round, tender, or credible secondary transaction that confirms current fair market value.
    whyItMatters: >-
      The spread between the 2021 $1B round and 2026 third-party markdown estimates is too wide to ignore in an
      investment decision.
    diligencePath: Request any 409A, mutual-fund marks, secondary tender data, or board-approved fair-value memos from 2025-2026.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: tam-precision
    missingEvidence: >-
      A company-verified breakdown of paying districts, contracted students, and attach rates across content,
      assessment, and analytics modules.
    whyItMatters: >-
      Public enrollment and pricing points let us frame a market range, but not isolate Newsela's true serviceable and
      obtainable market with confidence.
    diligencePath: >-
      Request management's current contracted-student count, win rates, and product attach-rate data by district size
      and product line.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-durability
    missingEvidence: >-
      Customer cohort data showing which Newsela contracts are funded from recurring operating budgets versus expiring
      federal or one-time funds.
    whyItMatters: >-
      The post-ESSER market can look large on paper while actual renewal budgets shrink materially if contracts depend
      on non-recurring dollars.
    diligencePath: Review renewal cohorts, funding-source tags in CRM, and top-50 district budget sources for FY2026 and FY2027.
    relatedQuestionRefs:
      - QM019
      - QM020
    relatedTableRefs:
      - TM003
      - TM004
