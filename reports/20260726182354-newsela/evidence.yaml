    severity: minor
    topic: district-usage-depth
    missingEvidence: Module-level usage intensity and retention by district for Learning Suite, Formative, and Schoolytics.
    whyItMatters: >-
      Integrated-system demand only helps valuation if districts actually adopt multiple modules and not just one narrow
      product surface.
    diligencePath: >-
      Request product analytics by cohort showing cross-module activation, weekly active educators, and renewal rates
      for bundled versus standalone accounts.
    relatedQuestionRefs:
      - QM012
      - QM025
    relatedTableRefs:
      - TM003
