figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Shows how Newsela moves from district procurement and setup into teacher activation, student usage, administrator monitoring, and potential product expansion.
  data:
    items:
    - label: Procurement / subscription approval
      note: District or state buyers approve access through contracts, procurement vehicles, or district-specific subscription arrangements.
    - label: Technical setup and rostering
      note: Admins choose SSO, LMS, or roster-sync paths such as Schoology, Clever, TeachHub, or other district workflows.
    - label: Teacher activation
      note: Teachers find content, assign leveled texts, use quizzes or writing prompts, and decide whether Newsela becomes part of routine instruction.
    - label: Student engagement and evidence generation
      note: Students consume differentiated content and generate quiz, reading, writing, or assessment signals.
    - label: Administrator monitoring
      note: District teams review usage reports, progress data, and implementation quality to justify continuation or expansion.
    - label: Expansion or renewal loop
      note: Satisfied districts can add products such as Formative, Writing, or Schoolytics, but public renewal metrics remain undisclosed.
  claimRefs:
