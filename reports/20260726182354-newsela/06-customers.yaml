  - - Students
    - End users
    - Read leveled texts, complete quizzes, writing, and assessments
    - LAUSD, NYCDOE, and efficacy pages describe student-facing use
    - No public DAU/WAU or assignment-frequency disclosure
  - - Large urban districts
    - High strategic-value accounts
    - Districtwide or citywide deployment and implementation support
