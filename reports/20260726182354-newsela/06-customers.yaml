callouts:
- calloutType: insight
  title: This is a real district customer base, not just an edtech awareness brand
  body: The combination of named district deployments, procurement evidence, district-specific implementation pages, and classroom workflow documentation supports a genuine enterprise customer footprint. The customer story is not merely hypothetical.
  claimRefs:
  - CU002
  - CU007
  - CU012
  - CU018
- calloutType: risk
  title: Public customer proof is deeper on usage anecdotes than on retention economics
  body: Newsela can show why districts adopt, but the public record is much thinner on why they renew, expand, or resist competitive displacement over time. That gap matters directly for revenue durability.
  claimRefs:
  - CU026
  - CU027
  - CU031
  - CU033
- calloutType: risk
  title: Reference quality is real but still curated
  body: Many of the strongest proofs come from company-authored success stories or company-adjacent reference platforms. That is still useful evidence, but it should be checked against private cohort, renewal, and churn data before being treated as complete customer truth.
