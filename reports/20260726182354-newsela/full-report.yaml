      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Newsela’s historical financing is well supported, but its present capital adequacy is not. Tracxn and
              TechCrunch corroborate the February 2021 $100 million Series D at a $1 billion post-money valuation.
              Third-party trackers disagree, however, on total lifetime capital: GetLatka shows $170.3 million, Tracxn
              shows $173 million, and Premier Alternatives shows $189.0 million. The disagreement itself is not fatal,
              but it underscores the basic issue that investors lack a company-disclosed balance-sheet view. No reviewed
              public source provides current cash on hand, monthly burn, debt obligations, or runway.


              Secondary-market sources point to weaker capital signaling than the 2021 financing implied. PM Insights
              shows an approximately $833 million implied valuation as of July 2026, below the last round, while Premier
              Alternatives publishes a much lower $297.1 million estimate. These are not equivalent methodologies and
              should not be treated as precise fair value, but together they indicate that outside investors no longer
              automatically anchor on the unicorn mark. That makes current liquidity, burn discipline, and next-round
              optionality central diligence items.
