      - number: '8.2'
        title: Financing context and comparable lens
        blocks:
          - type: paragraph
            body: >-
              Newsela should not be valued like a blank private narrative, but it also should not be valued like
              Duolingo. The public-comp set in this run is useful because it shows how widely education-software
              multiples diverge once growth, buyer mix, and confidence separate. Duolingo’s July 2026 CompaniesMarketCap
              pages show roughly $1.09 billion of trailing revenue, a $5.69 billion market cap, and a price-to-sales
              ratio above 5x. Coursera screens much lower at roughly $0.77 billion of trailing revenue, about $1.53
              billion of market cap, and a price-to-sales ratio around 2x. Chegg, by contrast, trades at distressed
              levels on falling revenue, roughly $0.10 billion of market cap, and sub-1x price-to-sales.

              Newsela sits somewhere between those outcomes, but the right side of the band depends on proof that is not
              public. It is more workflow-embedded and district-contracted than consumer education apps, which argues
              against using Chegg-like distress as the default lens. But it is also more opaque, less liquid, and more
              budget-exposed than Duolingo, which argues strongly against paying a premium public-software multiple. The
              company therefore looks most comparable to a mid-quality vertical education software asset that deserves a
              discount to best-in-class public comps until private diligence can prove retention quality, multi-product
              attach, and margin depth. The comp table should be read as a boundary-setting exercise, not as a
              false-precision output.
