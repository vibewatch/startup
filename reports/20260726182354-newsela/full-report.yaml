  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: recurring district software, not ad-supported media'
        blocks:
          - type: paragraph
            body: >-
              Public sources show that Newsela monetizes as a district and school software vendor rather than as a
              consumer subscription or advertising business. The company’s site pushes prospective buyers toward demos,
              pricing conversations, and product-specific enterprise inquiries, while the Maryland procurement file
              provides a concrete per-student contract example. That structure is consistent with annual or multiyear
              district subscriptions whose revenue depends on enrollment, product bundle, and implementation scope
              rather than casual article consumption. The inclusion of Learning Suite, Formative, Schoolytics, and
              attendance-related add-ons also suggests a portfolio model with both core-content and adjacent analytics
              revenue opportunities.


              The strongest public revenue datapoint remains third-party rather than company-disclosed: GetLatka lists
              2024 revenue at $109 million ARR. That makes Newsela one of the larger private K-12 instructional-software
              vendors, but it is still below the scale where public-market comps receive premium multiples without
              strong growth and margin proof. The financial question is therefore not whether Newsela has revenue, but
              whether that revenue is sufficiently recurring, expansion-friendly, and efficiently serviced to justify
              anything close to its former unicorn mark.
            claimRefs:
              - CI001
