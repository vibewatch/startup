      - number: '4.2'
        title: Pricing, packaging, and sales efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Pricing evidence is partial but directionally useful. Newsela’s website still routes buyers to sales
              rather than publishing self-serve district pricing, which implies negotiated enterprise deals and longer
              procurement cycles. The Maryland state contract provides one public point at $35.49 per student, while
              historical reporting referenced a much lower $6-$14 range several years earlier. That gap is not
              necessarily contradiction: it likely reflects product-scope differences, contract-specific services,
              district scale, and the addition of adjacent products since the earlier quote. Still, it shows that public
              list-price proxies are poor substitutes for realized net pricing.


              Because Newsela sells into schools and districts, sales efficiency is driven less by website conversion
              and more by procurement, curriculum alignment, implementation support, and renewal motion. Customer
              stories, LMS integrations, and efficacy marketing all support a consultative GTM model, but public CAC,
              payback, win rate, and contract-length metrics are absent. The company probably benefits from expansion
              opportunities across curriculum, formative assessment, and data/attendance layers, yet investors should
              treat that as a plausible motion rather than a disclosed efficiency outcome.
