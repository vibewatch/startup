  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Newsela does not compete in the entire education software universe. The relevant market boundary is the
              U.S. K-12 instructional materials and literacy-support market, especially digital content,
              reading-comprehension, formative-assessment, and adjacent district data workflows. Freedonia's 2025-2026
              instructional-materials overview describes a market entering a reset as states revise standards and
              districts demand measurable impact. Its reading-market overview adds that districts increasingly want
              integrated systems that combine core instruction, assessment, intervention, professional learning,
              multilingual support, and actionable data rather than isolated point tools. That framing fits Newsela's
              current positioning as a combined content, assessment, and analytics platform rather than a single-purpose
              article library.


              The key substitutes are not only direct edtech peers. The status quo includes textbooks, teacher-created
              packets, district-curated resources in LMS environments, and free nonprofit tools such as Khan Academy and
              CommonLit. Official competitor pages also show why the boundary is messy: IXL spans skills practice across
              subjects and grades, Renaissance emphasizes reading practice plus assessment, and Amplify sells full ELA
              curricula. Because districts can solve the same literacy and instructional problem through curriculum
              adoptions, supplemental content, practice software, or locally assembled workflows, Newsela's practical
              market is defined by district budget lines and procurement logic rather than by a single product taxonomy.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM028
              - CM029
              - CM030
              - CM031
