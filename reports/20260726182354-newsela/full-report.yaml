              software habits.


              The workflow also explains why Newsela can support multiple buyers. Teachers care about content and
              assignment ease, principals care about instructional consistency and literacy outcomes, district leaders
              care about assessment, analytics, and cross-school visibility. The portfolio is therefore designed to
              serve both classroom usage and administrative oversight. The risk is that broader workflow ambition also
