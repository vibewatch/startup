      - number: '7.5'
        title: Model risk is mostly about retention, concentration, and proof thresholds rather than disclosed burn distress
        blocks:
          - type: paragraph
            body: >-
              Because Newsela is private and does not publish detailed financial statements, the financial-model risk in
              this chapter is less about a visible insolvency signal and more about what could silently erode valuation
              quality. If ARR is large but renewal quality is uneven, if a handful of large districts represent too much
              of revenue, or if product expansion depends on costly services and implementation support, then the
              company’s apparent scale may deserve a lower quality multiple than a cleaner SaaS story would imply. The
              public record does not disclose NRR, GRR, gross margins, top-customer concentration, or attach-rate
              economics by module. That makes price discipline and diligence sequencing critical. The most important
              kill triggers are therefore measurable: sustained post-ESSER district churn, evidence that overlapping
              products are being consolidated out, any material privacy or security breakdown, low usage inside major
              contracts, or proof that multi-product breadth does not convert into durable revenue expansion. None of
              these outcomes is proven today, but each is plausible enough that the investment case should remain
              contingent on private diligence rather than on public optimism alone.
