chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, headquarters, and product scope
        blocks:
          - type: paragraph
            body: >-
              Newsela presents itself in 2026 as a connected instruction, assessment, and data platform for K-12 schools
              rather than as a single reading-news product. The homepage and product pages describe a suite that spans
              Newsela Learning Suite, Balanced Assessment by Formative, and Schoolytics, with the stated mission of
              delivering meaningful classroom learning for every student. The company page says Newsela launched in 2013
              with content adapted to five reading levels, while current product materials position the platform around
              18,000-plus texts and videos, AI-powered scaffolds, subject-specific products, and district-level data
              workflows. The company remains headquartered in New York City, and both 2026 press releases and legal
              pages continue to identify the issuer as Newsela, Inc. operating a school-focused platform rather than a
              direct-to-consumer app.


              The current marketing mix matters for diligence because it shows Newsela has moved up-stack from
              supplemental literacy content into a broader district workflow budget line that blends instruction,
              assessment, and analytics. That broadening can improve average contract size and retention, but it also
              means the company now competes against more integrated curriculum and assessment vendors, not only
              literacy tools. Publicly visible district pages for LAUSD and NYCDOE, as well as the corporate homepage,
              support the conclusion that Newsela is sold primarily through school and district relationships rather
              than individual teacher subscriptions.
