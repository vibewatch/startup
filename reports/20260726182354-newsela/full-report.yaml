      - number: '2.5'
        title: 'Adoption constraints: ESSER cliff, funding gaps, and proof burden'
        blocks:
          - type: paragraph
            body: >-
              The main market constraint in 2026 is not lack of need; it is funding quality. The Department of
              Education's liquidation-extension materials confirm that previously approved ARP ESSER late-liquidation
              projects can continue only through March 30, 2026 under the litigation-related guidance, while SETDA says
              just 6% of respondents have durable funding plans for ongoing edtech work. Civic IQ, HelloSubs,
              TeachingChannel, and Strategic Plan 360 each describe a post-ESSER environment in which districts must
              defend every renewal with stronger ROI logic, often amid enrollment decline, higher operating costs, and
              competing AI or cybersecurity priorities. This does not eliminate Newsela's market, but it makes the
              category more selective.


              The second constraint is that buyers now judge literacy tools against more comprehensive alternatives.
              CommonLit advertises a full ELA program, Amplify offers complete ELA curriculum, Renaissance sells reading
              practice plus assessment, and IXL covers skill practice across subjects. In that environment Newsela's
              market advantage depends less on saying the literacy market is large and more on proving that its mix of
              differentiated content, formative assessment, and data coordination can either replace other spend or
              defend its own renewal. The key diligence question is therefore not whether there is demand for literacy
              support, but whether Newsela can convert broad category demand into recurring, budget-resilient contracts
              at acceptable acquisition and retention economics.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
              - CM035
              - CM036
              - CM037
              - CM038
