      - number: '6.5'
        title: >-
          Expansion is plausible through product breadth and district workflow embedment, but concentration is still
          opaque
        blocks:
          - type: paragraph
            body: >-
              Newsela clearly has expansion levers. District-specific pages already expose ELA, social studies, SEL,
              writing, Formative, Schoolytics, and implementation services, so the platform is positioned to sell more
              than a single article library. Case studies also show adjacent motions such as curriculum alignment,
              bilingual support, professional learning, and state- or district-specific content. Those are credible
              land-and-expand ingredients. But the public record does not show the denominator that matters most: how
              much revenue is tied to the largest districts, how many districts buy multiple products, or what
              percentage of logos actually renew. Concentration could still be meaningful if a handful of very large
              districts or state contracts account for a disproportionate share of ARR. Likewise, expansion could be
              overstated if broader product surfaces are mostly marketing rather than meaningfully attached licenses.
              The underwriting conclusion for this chapter is therefore positive but qualified: Newsela has real
              customer proof and real expansion logic, but customer durability and concentration still need management
              disclosure or private-data validation before they can be underwritten with high confidence.
