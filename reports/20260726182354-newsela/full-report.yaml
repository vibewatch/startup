  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Renewal quality
        - GRR, NRR, cohort renewal, seat expansion, and usage depth by top district.
        - Without this, ARR scale cannot be translated into durable value.
        - Request CFO and customer-success cohort pack.
      - - Cap table and balance sheet
        - Debt, preference stack, ratchets, option pool, and any secondary-clearing history.
        - Equity outcomes can differ sharply from simple EV/revenue math.
        - Request legal summary, cap table, and financing documents.
      - - Margin and implementation economics
        - Gross margin by product, services burden, support load, and implementation cost.
        - These decide whether Newsela merits SaaS-like or heavier-services valuation treatment.
        - Request finance model and board KPI deck.
      - - Customer concentration
        - Revenue share and renewal status of the largest districts and state contracts.
        - A few at-risk districts could change the whole underwriting picture.
        - Request top-20 account review with renewal calendar.
      - - Product attach and expansion
        - Revenue mix across core content, Formative, Schoolytics, and other modules.
        - The bull case depends on multi-product expansion, not just core literacy retention.
        - Request module-level ARR bridge and attach cohorts.
      - - Exit readiness
        - Any banker workstream, formal financing prep, or board-approved strategic path.
        - The likely exit path shapes holding-period discipline and valuation tolerance.
        - Request CEO/CFO process discussion and advisor list.
    notes: The first four rows are hard blockers to underwriting a fresh entry near the historical unicorn mark.
    claimRefs:
