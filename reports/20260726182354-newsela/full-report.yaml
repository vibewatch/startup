      - number: '3.3'
        title: Distribution, switching costs, and multi-homing behavior
        blocks:
          - type: paragraph
            body: >-
              Newsela's district pages for LAUSD and NYCDOE show that the company has real enterprise-school
              distribution and is not limited to teacher-by-teacher bottom-up adoption. That is important because
              district-standard tools can gain sticky roster and workflow placement even without owning the entire
              curriculum budget. Newsela's Google, Clever, and Canvas integrations further reduce onboarding friction,
              which improves deployability inside existing classroom systems. Those are real competitive strengths
              against smaller vendors that lack system-level integrations or district implementation support.


              But these strengths do not translate into hard lock-in. CommonLit publicly shows Google Classroom, Clever,
              and Canvas support categories; many districts already use multiple literacy tools side by side; and
              teachers can still mix Newsela with IXL, Khan Academy, or Accelerated Reader depending on lesson goals.
              That means switching costs are moderate rather than prohibitive. The vendor most likely to win is often
              the one that best fits the district's current operating model—core curriculum adoption, assessment-led
              literacy monitoring, supplemental differentiated content, or free teacher-directed enrichment—rather than
              the one with the most isolated features. For Newsela, the implication is that renewal depends on becoming
              embedded in recurring instructional routines, not merely being technically integrated.
            claimRefs:
              - CP026
              - CP027
              - CP028
              - CP033
              - CP037
      - number: '3.4'
        title: Pricing, packaging opacity, and enterprise procurement dynamics
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains a structural weakness in competitor analysis because most enterprise K-12 vendors
              avoid transparent list pricing. Newsela itself illustrates the problem: public evidence shows a historical
              $6-$14 per-student range from 2021 and a $35.49 per-student procurement example from Maryland, but not a
              current universal price book. CommonLit signals affordability without publishing enterprise district
              pricing on the reviewed surfaces. Amplify, Renaissance, and Achieve3000 similarly rely on sales-led
              procurement rather than self-serve enterprise pricing. This opacity makes side-by-side pricing comparisons
              difficult and increases the importance of pilots, procurement references, and ROI narratives.


              The practical effect is that free or low-cost alternatives exert more pricing pressure than enterprise
              list sheets do. Khan Academy and teacher-created resources put a ceiling on what purely supplemental
              literacy tools can charge. CommonLit's lower-cost posture can narrow the gap further. Full-suite vendors
              can also reframe the conversation away from line-item price and toward total workflow replacement,
              especially if they bundle curriculum, assessment, and reporting. Newsela therefore has to justify price
              not only against direct peers, but against the buyer's ability to combine a free tool, a core curriculum,
              and an assessment platform into a viable alternative stack.
            claimRefs:
