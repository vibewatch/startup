  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The company-quality case for Newsela is real, but the price-quality case is still incomplete. The retained
              source pack shows a real $100 million late-stage round at a $1 billion valuation, broad district-facing
              distribution, and a third-party ARR estimate around $109 million for 2024. Those are not vanity signals.
              They establish that Newsela became a scaled K-12 software asset with enough customer proof to matter in
              procurement-led education markets. District pages, procurement records, and product expansion into
              Formative and Schoolytics further support the idea that Newsela is selling into core instructional
              workflows rather than chasing a one-feature literacy niche.

              The problem is that public price support has weakened faster than public company-quality support. PM
              Insights and Premier Alternatives both imply 2026 values below the 2021 unicorn mark, and HolonIQ now
              treats Newsela as a lapsed unicorn. None of those sources should be mistaken for audited fair value, but
              together they show that outside observers no longer automatically underwrite Newsela at the last private
              round. At the same time, the public record still lacks audited revenue, gross margin, renewal,
              concentration, and cap-table waterfall detail. That combination argues for a track recommendation rather
              than a buy call: stay engaged, but require either a materially better entry or much stronger private
              diligence before underwriting the old headline price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
