      - number: '8.4'
        title: Thesis-break triggers, exit path, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The missing work is not cosmetic. To upgrade Newsela from track to buy, an investor would need private
              evidence on revenue quality, not just revenue scale. The essential questions are whether large districts
              renew, whether usage depth is strong enough to defend budgets after ESSER, whether Formative and
              Schoolytics actually lift attach rates, and whether the cap table leaves room for attractive common-equity
              outcomes. Newsela’s privacy and contracting posture is more mature than many edtech vendors, which does
              reduce some downside, but legal maturity does not solve financial opacity. Procurement proof and named
              districts show credibility, not necessarily efficient or expanding revenue.

              Exit readiness also remains conditional. Nothing in the retained public pack proves an imminent IPO path,
              and there is no surfaced public evidence of a formal process. The more realistic paths today are another
              private round, a structured secondary, or eventual strategic interest if Newsela proves renewal quality
              and cross-sell durability. The cleanest thesis-break triggers are therefore measurable: major-district
              churn, low active usage inside flagship deployments, a hidden preference stack or debt burden, a privacy
              or security event that damages trust, or proof that multi-product breadth does not convert into durable
              economics. Until those items are cleared, the company stays on the serious-watchlist side of the line, not
              the ready-to-pay-full-price side.
