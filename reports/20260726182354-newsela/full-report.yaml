  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Post-ESSER budget attrition
        - Dollar renewal rate in districts whose ESSER support has ended
        - Meaningful step-down versus management plan
        - Reprice risk and demand cohort explanation
      - - Teacher-activation weakness
        - Active-teacher rate or assignment frequency in major accounts
        - Low or declining usage inside flagship districts
        - Treat logo count as weaker than headline ARR suggests
      - - Privacy / security breakdown
        - Material incident, delayed notice, or regulator complaint
        - Confirmed event or repeated customer redlines on controls
        - Pause underwriting until incident facts and remediation are reviewed
      - - Competitive displacement
        - Losses to free or lower-cost substitutes in core literacy workflows
        - Repeated displacement by CommonLit, Khan, or bundled district tools
        - Lower retention assumptions and multiple
      - - Concentration surprise
        - Top-customer revenue concentration exceeds comfort band
        - A small set of districts drives outsized ARR or expansion
        - Discount valuation quality and push for concentration covenants
      - - Product-cohesion failure
        - Multi-product attach does not improve renewal or ACV
        - Breadth remains marketing-visible but financially weak
        - Value Newsela closer to a narrower point-solution story
    notes: >-
      These kill criteria convert abstract risk into measurable diligence tests that can change the investment view
      quickly.
    claimRefs:
      - CR035
      - CR037
      - CR038
      - CR039
      - CR040
