  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - District renewal quality breaks
        - Large flagship districts show weak renewal, shrinking seat counts, or low active usage.
        - >-
          The company would look less like sticky instructional infrastructure and more like cuttable supplemental
          spend.
        - Re-underwrite toward the bear range or walk away.
      - - Hidden cap-table overhang
        - Preference seniority, debt, or ratchets materially subordinate new common-equity exposure.
        - Apparent enterprise value would stop translating into attractive equity upside.
        - Pause unless price resets or structure is cleaned up.
      - - Privacy or security failure
        - A material student-data incident or trust breakdown emerges in diligence.
        - Procurement friction and renewal risk would both rise at once.
        - Treat as a thesis break for premium-multiple underwriting.
      - - Cross-sell does not monetize
        - Formative and Schoolytics lift product breadth but not attach, expansion, or margin.
        - The bull case would lose its main reason to expand the multiple.
        - Hold to base or bear underwriting only.
      - - Post-ESSER cuts deepen
        - District software reviews increasingly treat Newsela as overlapping or noncore.
        - Revenue durability would rerate toward lower-quality edtech multiples.
        - Reduce exposure appetite and demand a lower clearing price.
    notes: Kill triggers focus on price-sensitive failure modes rather than generic operating noise.
    claimRefs:
      - CV030
