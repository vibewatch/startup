              Schools, LAUSD, and NYCDOE all appear in retained sources with concrete descriptions of how the platform
              is used. These are not just unlabeled customer logos: the stories describe subjects served, student
              counts, rollout mechanics, or implementation outcomes such as differentiated instruction, cross-subject
              literacy practice, custom curriculum support, or time saved for teachers. In several cases, Newsela's own
              pages are corroborated by a mirrored case-study marketplace page or a broader reference directory, which
              improves confidence that these are genuine deployments. The caveat is freshness and curation. Most of the
              public proof is company-authored or distributed through company-adjacent marketplaces, and many outcomes
              are qualitative or framed for marketing. Even so, the underlying deployment evidence is still meaningful
              because it shows Newsela operating in districts ranging from roughly 3,500 students to 85,000 students and
