      - number: '1.3'
        title: Funding history, valuation marks, and conflicting private-market signals
        blocks:
          - type: paragraph
            body: >-
              Newsela's last clearly disclosed financing was its February 2021 Series D. TechCrunch, Built In NYC, and a
              PR Newswire copy of the announcement each state that Newsela raised $100 million and reached a $1 billion
              valuation, with Franklin Templeton leading the round. TechCrunch also reports that the round was larger
              than the company's prior aggregate capital raised, while noting management guidance that more than 11
              million students would use licensed Newsela products by the end of 2021 and that paid pricing then ranged
              from roughly $6 to $14 per student. Those are credible historical anchor points because they were reported
              contemporaneously and are corroborated across multiple outlets.


              What is much less clear is the current value of the business. Newsela has not publicly announced another
              primary financing since 2021. HolonIQ's edtech unicorn tracker says Newsela joined the unicorn list in
              February 2021 and was removed in January 2024 as a "lapsed" company whose last funding round was too old
              to support a current $1B mark on then-current multiples. Premier Alternatives now shows a secondary-style
              implied valuation around $297 million in 2026. GetLatka estimates $109 million of 2024 revenue and roughly
              $170 million of lifetime funding, but these are database estimates, not management disclosures. The key
              diligence takeaway is that the 2021 unicorn mark is historically real, but it should not be treated as a
              current mark without fresh transaction evidence.
