  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Theme
      - Thesis
      - Anti-thesis / unresolved issue
      - What would change the view
    rows:
      - - Market position
        - Newsela has real district-scale proof, product breadth, and literacy relevance.
        - Scale proof does not prove clean renewals or protected budgets.
        - Show district-level renewal and usage cohorts by product.
      - - Product expansion
        - Formative and Schoolytics create a plausible multi-product expansion path.
        - Public evidence does not show attach rates or cross-sell economics.
        - Provide module-by-module revenue mix and attach cohorts.
      - - Valuation anchor
        - The 2021 $1B round proves sophisticated investors once underwrote a unicorn outcome.
        - Secondary and tracker sources now point materially below that mark.
        - Provide a current board-mark rationale and recent secondary clearing prices.
      - - Comparable lens
        - Newsela should trade above distressed edtech assets if K-12 workflow stickiness is real.
        - It should still trade below premium public education software until margins and growth are proven.
        - Show audited growth, gross margin, and retention versus the comp set.
      - - Risk-adjusted entry
        - A discounted entry into a real K-12 platform could be attractive.
        - Paying near the last round without cap-table clarity could erase upside.
        - Share the full preference stack, pro rata, and debt summary.
    notes: >-
      This table separates business-quality evidence from price-quality evidence; both must work for an investable buy
