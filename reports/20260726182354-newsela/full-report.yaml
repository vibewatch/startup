        title: Retention and satisfaction proof exists, but it is thin, partly stale, and mostly qualitative
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is the weakest part of the customer case. TrustRadius and a wayback-accessible
              G2 snapshot show that teachers value differentiated reading levels, content quality, and ease of
              engagement, which supports the intuition that Newsela solves a real classroom problem. At the same time,
              the visible review footprint is small relative to Newsela's claimed scale, the G2 snapshot is old, and
              Capterra was blocked by verification during review. Those facts do not disprove customer satisfaction, but
              they do cap how much weight an investor should place on public review sites. More importantly, the public
              pack does not disclose NRR, GRR, churn, contract length, renewal rates, or cohort behavior by district
              size. That means the diligence posture should separate satisfaction proxies from actual economic
              durability. The right reading is that Newsela probably has real teacher love in many classrooms, but the
