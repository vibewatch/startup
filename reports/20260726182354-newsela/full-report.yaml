  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          ARR expands toward roughly $130M-$150M, cross-sell works, major districts renew cleanly, and cap-table
          overhang is limited.
        - Analytical value of roughly $0.78B-$1.05B at ~6x-7x ARR; only then does the old unicorn mark look defensible.
        - Requires unproven attach rates, strong usage depth, and favorable structure.
        - Possible, but not the most supportable case on current public evidence.
      - - Base
        - >-
          ARR stays near roughly $109M-$120M, budget pressure persists, and valuation clears like a mid-quality private
          vertical-software asset.
        - >-
          Analytical value of roughly $0.44B-$0.60B at ~4x-5x ARR; solid company, but limited upside if entry is too
          high.
        - Renewal quality, concentration, and margin depth remain unresolved.
        - Most supportable public-only case.
      - - Bear
        - >-
          ARR effectively resets toward roughly $90M-$100M after budget cuts, weak usage, or lower renewal quality;
          multiple compresses further.
        - Analytical value of roughly $0.23B-$0.35B at ~2.5x-3.5x ARR; a material re-rating below the 2021 round.
        - District churn, overlap cuts, or structural overhang would accelerate downside.
        - Real downside tail if public opacity hides weaker fundamentals.
    notes: All scenario values are analyst-generated public-record estimates rather than observed transaction prices.
