        title: The customer base spans district buyers, teacher users, and student end-users
        blocks:
          - type: paragraph
            body: >-
              Newsela's public customer record makes most sense when split into payer, buyer, user, and administrator
              roles instead of treated as one monolithic account list. District and state leaders appear to be the
              principal economic buyers because procurement records, district onboarding pages, and implementation
              checklists all emphasize subscription access, rostering, usage reporting, and implementation support.
              Teachers are the daily activation layer because they assign content, sync classes, and decide whether
              Newsela becomes part of ordinary instruction. Students are the end users who generate the learning and
              usage signals that districts care about. That layered customer structure matters for diligence because it
              means adoption can look strong at the district logo level while still depending on teacher activation and
              ongoing administrative sponsorship. Public evidence from LAUSD, NYCDOE, Maryland procurement, and multiple
              district success stories supports the view that Newsela has moved well beyond single-classroom
              experimentation into real district workflow territory, but public reporting still stops short of
              disclosing how much of that footprint is paid, renewed, or deeply used.
