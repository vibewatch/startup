              The visible operating model is straightforward: districts provision access, teachers sync classes through
              Google Classroom, Clever, or Canvas, students consume differentiated content and assignments, and
              administrators or instructional leaders aggregate the resulting learning signals. This is not a
              speculative architecture diagram; it is how the documented workflows actually read in the help center.
