  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, substitutes, and incumbent categories'
        blocks:
          - type: paragraph
            body: >-
              Newsela faces a broader competitive set than a simple "reading app" label suggests. The direct substitute
              set includes differentiated literacy platforms such as Achieve3000 and CommonLit, broad practice platforms
              such as IXL, free mission-driven learning platforms such as Khan Academy, and established
              reading-assessment ecosystems such as Renaissance. At the incumbent end, Amplify represents a more
              comprehensive ELA curriculum adoption alternative that can absorb budget that might otherwise go to
              supplemental literacy tools. Newsela therefore competes simultaneously against direct product peers,
              curriculum incumbents, and the status quo of teacher-created materials paired with free resources.


              The product surfaces show why this matters. Newsela sells a cross-curricular instructional content
              platform with integrated assessments and actionable insights; CommonLit markets a full ELA program at a
              fraction of the cost; IXL offers standards-aligned skill practice across subjects; Khan Academy reaches
              far larger free-learner scale; Renaissance combines reading practice with assessment infrastructure;
              Amplify sells an adoption-grade curriculum; and Achieve3000 remains the closest public peer on adaptive
              differentiated literacy. Because districts can multi-home across several of these tools, Newsela is rarely
              competing in a winner-take-all category. The real contest is which product becomes core, which becomes
              supplemental, and which gets cut when budgets tighten.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP010
