      - number: '7.3'
        title: The operational risk is that districts keep only what they can prove and afford
        blocks:
          - type: paragraph
            body: >-
              Newsela’s most practical near-term risk is budget and usage attrition rather than a single dramatic
              operational blow-up. Official and independent post-ESSER materials point in the same direction: one-time
              federal relief funds have ended, approved liquidation windows are limited, durable funding plans for
              edtech are weak, and district leaders are reviewing whether software overlaps, goes unused, or fails to
              show measurable outcomes. Government Technology’s June 2026 reporting makes the threat especially concrete
              by describing district technology audits, skepticism toward overlapping tools, and pressure to protect
              only systems that are deeply embedded or clearly outcome-linked. That matters because Newsela sits in a
              contested lane between core curriculum, supplemental literacy, assessment, and general instructional
              tooling. If districts decide the product is central to literacy and assessment workflows, it is
              defendable. If they classify it as overlapping enrichment, it becomes cuttable. Public evidence supports
              both interpretations: district pages and procurement records show enterprise embedment, while free and
              low-cost alternatives plus sparse public renewal data preserve real vulnerability.
