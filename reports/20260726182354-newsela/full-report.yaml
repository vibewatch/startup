      - number: '7.4'
        title: Platform dependencies, product breadth, and teacher activation create execution risk
        blocks:
          - type: paragraph
            body: >-
              Newsela’s product breadth is a strength only if the company can keep the experience coherent across
              content, assessment, and data surfaces while preserving easy teacher activation. Public help and district
              pages show real dependencies on Google Classroom, Clever, Schoology or equivalent district provisioning
              paths, and administrative setup decisions. Those dependencies reduce go-to-market friction when they work,
              but they also create failure points: broken rosters, weak sync hygiene, or low implementation quality can
              make a signed contract feel underused. Competition sharpens the risk. CommonLit, Khan Academy, and IXL
              give districts free or alternative paths for literacy and skills practice, which means Newsela often has
              to defend not just absolute value but differentiated value relative to cheaper or already-adopted tools. A
              second execution risk is portfolio cohesion. Newsela now markets Formative and Schoolytics alongside core
              instructional products, which creates a plausible land-and-expand story but also a risk that cross-sell
              breadth is more visible in marketing than in realized attach rates. The absence of public expansion
              metrics means investors must still underwrite teacher activation, product coherence, and implementation
              depth as unresolved execution variables.
