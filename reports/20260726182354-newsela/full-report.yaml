  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The risk stack is dominated by budget durability, privacy obligations, and renewal uncertainty
        blocks:
          - type: paragraph
            body: >-
              The headline risk for Newsela in 2026 is that its customer value may be real while its budget protection
              is still conditional. The market chapter already showed a post-ESSER buyer environment where districts are
              cutting duplicative or weakly used software first, demanding measurable academic ROI, and treating
              operating budgets more defensively. That interacts with the customer chapter in a nontrivial way: Newsela
              has named district proof and broad reach claims, but not a public renewal table, multi-product attach
              table, or concentration breakout. The result is a risk profile where the company can simultaneously look
              credible and still be vulnerable. Layered on top of that are K-12 privacy obligations under FERPA, COPPA,
              and state privacy laws, plus the usual SaaS dependencies on integrations, teacher activation, and
              implementation quality. The strongest mitigants are visible privacy contracts, district-specific
              deployment workflows, procurement acceptance, and efficacy messaging. The biggest residual gaps are that
              public evidence does not show how well these mitigants hold up when districts rebudget, tech stacks
              consolidate, or a security incident forces customer scrutiny.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
