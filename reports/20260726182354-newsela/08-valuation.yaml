    - Consumer language app with superior disclosure and different buyer mix.
  - - Coursera
    - Public mid-band education software / learning-platform reference
    - About $0.77B TTM revenue, $1.53B market cap, and roughly 2x P/S in July 2026.
    - Useful middle-band reference for a scaled but lower-premium education platform.
