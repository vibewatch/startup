- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public evidence
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Company quality is credible, but public valuation support is incomplete.
    - Stay active in diligence, but do not lead or chase at the old unicorn mark on public evidence alone.
  - - Confidence
    - medium
    - Core financing, scale, and customer-proof facts are supported; renewal and margin quality are not.
    - Use this as a screening view pending data room access.
  - - Risk rating
    - high
    - Budget, retention, privacy, and cap-table opacity can all move fair value quickly.
    - Require downside protections and clear kill triggers before proceeding.
  - - Valuation stance
    - stretched
    - PM Insights, Premier Alternatives, and HolonIQ all challenge the idea that the 2021 mark still clears cleanly.
    - Prefer entry only at a material discount to the last round or after stronger private proof.
  - - Public-only fair range
    - roughly $0.4B-$0.8B
    - Base logic anchors on ~$109M ARR with a conservative private vertical-software multiple band.
    - Treat anything near $1B as a bull-case outcome needing private validation.
  - - What changes the call
    - cleaner diligence or lower price
    - NRR/GRR, gross margin, concentration, usage depth, and a clean cap table could all improve the view.
    - Upgrade only if the private record materially beats the public one.
  notes: Public-evidence recommendation only; valuation views exclude any undisclosed dilution, debt, or preference-stack effects.
