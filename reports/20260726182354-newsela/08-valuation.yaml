- id: scenario-framework-and-return-logic
  title: Scenario framework and return logic
  body: 'Because Newsela does not disclose audited current revenue or margin in the retained public pack, every scenario here is explicitly analytical rather than observed. The base frame starts from the best visible revenue anchor—GetLatka’s roughly $109 million ARR estimate—and then applies a discount for post-ESSER budget pressure, limited transparency, and unresolved renewal economics. That produces a more conservative range than the 2021 round but still recognizes that Newsela has real market position, named district proof, and a product surface broad enough to support eventual upsell. Under that framework, the current public evidence supports a middle band closer to disciplined mid-hundreds of millions than to an unquestioned unicorn mark.

    The bull case requires more than simple survival. It assumes that multi-product expansion is translating into durable revenue growth, that major districts renew with healthy usage, and that cap-table or preference overhang is modest. In that world, Newsela could still earn a valuation close to the old round. The bear case matters because the downside transmission is easy to imagine: district software rationalization, weak usage inside large contracts, or hidden capital-structure complexity could pull fair value materially lower. The correct committee output is therefore a range with explicit triggers, not a single target. Public evidence supports interest, but only price-sensitive interest.'
