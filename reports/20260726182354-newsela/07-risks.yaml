    - Lower retention assumptions and multiple
  - - Concentration surprise
    - Top-customer revenue concentration exceeds comfort band
    - A small set of districts drives outsized ARR or expansion
    - Discount valuation quality and push for concentration covenants
  - - Product-cohesion failure
    - Multi-product attach does not improve renewal or ACV
    - Breadth remains marketing-visible but financially weak
    - Value Newsela closer to a narrower point-solution story
  notes: These kill criteria convert abstract risk into measurable diligence tests that can change the investment view quickly.
