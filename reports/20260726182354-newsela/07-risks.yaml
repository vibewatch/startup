- id: legal-and-regulatory
  title: Privacy and student-data compliance are core regulatory risks, even with strong contractual mitigants
  body: For a K-12 software vendor, privacy and data-handling risk is not an edge case; it is part of the business model. Newsela’s privacy policy, DPA, and master services agreement visibly acknowledge FERPA, COPPA, state privacy laws, customer control of data, audit rights, and a seventy-two-hour incident-notice commitment after confirmation. That is better than many smaller edtech vendors and clearly reduces procurement friction. But the same public record also makes the risk concrete. Federal privacy guidance aimed at education-technology vendors, online educational services, model terms of service, and data destruction best practices shows how many ways a district can decide a vendor’s posture is insufficient even without a formal enforcement action. FTC COPPA guidance remains active and was amended in April 2025, while Department of Education privacy resources continue to emphasize that breaches, over-collection, insecure sharing, or weak terms can all create real student-privacy harm.
    Newsela therefore looks contractually aware, but the public record is much stronger on policy language than on audited technical controls, incident history, or enforcement-tested resilience.
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
