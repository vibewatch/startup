  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Newsela 现在把自己呈现为连接教学、测评和数据的平台，而不是单一阅读新闻产品。公开产品面覆盖 Learning Suite、Newsela ELA、Social
              Studies、STEM、Writing、Balanced Assessment by
              Formative、Schoolytics，以及新近突出展示的考勤改善工作流。按客户工作流看，平台帮助学区找到对齐标准的内容，分层开放阅读入口，布置练习，捕捉课堂证据，并把使用或学生数据向上汇总给管理者。这个产品广度重要，因为
              Newsela 想卖的是平台预算，而不是点状内容预算。


              底层产品身份仍从内容、分层和教师工作流开始。Newsela 反复强调 18,000 多篇文本和视频、五个阅读级别、学习支架、理解检查、对齐 rubric 的写作反馈，以及跨学科使用。Luna AI
              和数据产品的加入，说明这个栈正在成熟：它把更多工作流自动化和管理可见性叠到了原始内容核心之上。
