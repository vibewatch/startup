              拆成付款方、买方、用户和管理员角色看，Newsela
              的公开客户记录最清楚；如果把它当成一张单一账户清单，反而失真。采购记录、学区导入页面和实施清单都强调订阅访问、花名册、使用报告和实施支持，说明学区和州级领导很可能是主要经济买方。教师是日常激活层，因为他们布置内容、同步班级，并决定
