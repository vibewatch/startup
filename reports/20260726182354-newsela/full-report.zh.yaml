      - number: '2.3'
        title: 买方、使用者、付款方与学区采用路径
        blocks:
          - type: paragraph
            body: >-
              这个品类的买方图谱是多层的。使用者通常是课堂教师和学生；直接工作流负责人可能是 ELA 负责人、校长、课程主任或学区学术团队；付款方通常是学校或学区预算负责人。Newsela 的 LAUSD 和 NYCDOE
              学区页面强化了这一点：这是机构销售，而不是以教师个人购买为主。产品采用也越来越触及测评负责人、MTSS 团队和数据办公室，因为 Newsela 现在把 Formative、Schoolytics
              和内容打包在一起。这扩大了公司可争取的内部拥护者数量，也扩大了能在使用、互操作性或 ROI 不达标时卡住续约的利益相关方数量。


              采购路径本身也变得更重证据。SETDA 称，资金现在是州级 edtech 最大的未满足需求；多份 2026 年 ESSER 断崖资料则描述了这样的学区环境：先砍重复或低使用工具，同时保护核心课程、测评、SIS
              和合规系统。也就是说，学区把 Newsela 当作读写常规、共同测评或学区数据行动的基础设施来买时，公司更容易赢；如果学区只把它看作可选拓展工具，胜率就低得多。商业含义是，Newsela
              向测评和分析扩张有助于买方论证，但前提是公司能证明组合套件缩短了教师备课、改善了实施，或保住了原本会分散给多个供应商的预算。
