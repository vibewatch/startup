      - number: '7.2'
        title: 隐私和学生数据合规是核心监管风险，即使合同缓释较强
        blocks:
          - type: paragraph
            body: >-
              对 K-12 软件供应商，隐私和数据处理风险不是边缘情况，而是商业模式的一部分。Newsela 的隐私政策、DPA 和主服务协议清楚承认 FERPA、COPPA、州隐私法、客户对数据的控制权、审计权，以及确认后
              72
              小时内发出事件通知的承诺。这已经优于很多小型教育科技供应商，并明显降低采购摩擦。但同一公开记录也让风险变得具体。面向教育技术供应商、在线教育服务、服务条款模板和数据销毁最佳实践的联邦隐私指南，显示学区即便没有正式执法，也有很多理由认定供应商姿态不足。FTC
              COPPA 指引仍然有效，并在 2025 年 4 月修订；教育部隐私资源继续强调，泄露、过度收集、不安全共享或薄弱条款都可能造成真实学生隐私伤害。因此，Newsela
              看起来具备合同意识，但公开记录对政策语言的证明远强于对经审计技术控制、事件历史或经执法检验韧性的证明。
