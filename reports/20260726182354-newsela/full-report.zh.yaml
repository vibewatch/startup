      - number: '4.2'
        title: 定价、包装与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              定价证据不完整，但方向上有用。Newsela 网站仍把买方导向销售，而不是发布自助式学区定价，这意味着公司依赖协商型企业交易和更长采购周期。Maryland 州合同给出一个公开点位：每名学生
              $35.49；历史报道则提到几年前低得多的 $6-$14
              区间。这个差距不一定矛盾：它很可能反映产品范围差异、合同特定服务、学区规模，以及早期报价后相邻产品的加入。即便如此，它仍说明公开标价代理指标很难替代实际净价。


              Newsela 向学校和学区销售，销售效率更多由采购、课程匹配、实施支持和续约动作驱动，而不是由网站转化驱动。客户故事、LMS 集成和效果营销都支撑顾问式 GTM 模型，但公开材料没有给出
              CAC、回本周期、赢单率和合同期限指标。公司大概率能在课程、形成性测评和数据 / 考勤层之间获得扩张机会；但投资者应把它视为一种可信动作，而不是已经披露的效率结果。
