      - number: '6.3'
        title: 采用轨迹可以从覆盖声明、学区导入和成效代理指标中看出来
        blocks:
          - type: paragraph
            body: >-
              Newsela 没有发布清晰的客户群组表，但公开采用信号仍勾出一条合理轨迹：从广泛的漏斗顶端覆盖，走向活跃的学区部署。与公司有关的历史报道称，Newsela
              有数千万注册教师和学生，进入了大多数美国学校；LAUSD 和 NYCDOE
              的学区专页则展示运营级上线导入路径、花名册同步要求、课堂作业步骤和使用报告界面。两者合在一起，更像是真实装机基础，而不是纸面覆盖。面向结果的证据也有助于把活跃使用和闲置账户区分开。Freehold
              的案例把使用和阅读增长目标相连，Pine Bush 把 Formative 实施和标准提升、Regents 备考相连，Newsela 研究页面与 ERIC
              也总结了定期使用相关的可衡量读写改善。这些都不能完全替代付费席位、续约或活跃用户披露，但足以说明平台有部署深度，能在多个产品上产生学区案例、实施工作流和反复出现的成效叙事。
