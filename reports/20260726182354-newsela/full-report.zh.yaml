  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈由预算耐久性、隐私义务和续约不确定性主导
        blocks:
          - type: paragraph
            body: >-
              Newsela 在 2026 年的核心风险是：客户价值可能真实，但预算保护仍有条件。市场章节已经展示 post-ESSER 买方环境：学区会先砍重复或弱使用的软件，要求可衡量的学业
              ROI，并对运营预算更防守。这和客户章节以并不简单的方式相互作用：Newsela
              有具名学区证据和广泛覆盖声明，但没有公开续约表、多产品绑定表或集中度拆分。结果就是一种双重风险画像：公司可以看起来可信，同时仍然脆弱。叠加其上的是 FERPA、COPPA 和州隐私法下的 K-12 隐私义务，以及
              SaaS
              对集成、教师激活和实施质量的常规依赖。最强缓释因素是可见的隐私合同、学区专属部署工作流、采购接受度和成效信息。最大残余缺口在于，公开证据没有显示当学区重新编预算、技术栈整合，或安全事件触发客户审视时，这些缓释能扛住多少。
