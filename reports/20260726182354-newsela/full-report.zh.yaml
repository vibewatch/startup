  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - ARR 扩张至约 $130M-$150M，交叉销售跑通，主要学区顺利续约，股权结构包袱有限。
        - 按 ~6x-7x ARR，分析价值约 $0.78B-$1.05B；只有这样，旧独角兽估值才站得住。
        - 需要尚未证明的附加率、强使用深度和有利交易结构。
        - 有可能，但不是当前公开证据最能支撑的情形。
      - - 基准
        - ARR 维持在约 $109M-$120M，预算压力延续，成交估值接近中等质量私有垂直软件资产。
        - 按 ~4x-5x ARR，分析价值约 $0.44B-$0.60B；公司扎实，但入场价过高时上行有限。
        - 续约质量、集中度和利润率深度仍未解决。
        - 仅凭公开资料最能支撑的情形。
      - - 熊
        - 预算削减、使用偏弱或续约质量下滑后，ARR 实际重置到约 $90M-$100M；倍数进一步压缩。
        - 按 ~2.5x-3.5x ARR，分析价值约 $0.23B-$0.35B；相较 2021 轮大幅重估向下。
        - 学区流失、重叠功能裁撤或结构性包袱会加速下行。
        - 如果公开不透明掩盖更弱基本面，下行尾部真实存在。
    notes: 所有情景值都是分析师基于公开记录生成的估算，不是已观察到的交易价格。
    claimRefs:
      - CV023
      - CV024
