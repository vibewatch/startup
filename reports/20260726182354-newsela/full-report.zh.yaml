      - number: '7.4'
        title: 平台依赖、产品宽度和教师激活带来执行风险
        blocks:
          - type: paragraph
            body: >-
              Newsela 的产品宽度只有在公司能让内容、评估和数据页面之间的体验保持连贯，同时维持教师容易上手时，才算优势。公开帮助文档和学区页面显示，它真实依赖 Google
              Classroom、Clever、Schoology 或等价的学区开通路径，也依赖管理员设置决定。这些依赖在顺畅时降低 GTM
              摩擦，但也制造故障点：花名册断裂、同步卫生差或实施质量低，都会让已签合同显得使用不足。竞争会放大风险。CommonLit、Khan Academy 和 IXL 给学区提供免费或替代路径来做读写和技能练习，意味着
              Newsela 往往不仅要证明绝对价值，还要证明相对更便宜或已经采用工具的差异化价值。第二个执行风险是组合凝聚力。Newsela 现在把 Formative 和 Schoolytics
              与核心教学产品一起销售，这让先落地再扩张故事合理，但也带来一种风险：交叉销售宽度在营销中更显眼，在实际绑定率中未必兑现。缺少公开扩张指标，意味着投资人仍必须把教师激活、产品连贯性和实施深度作为未解决的执行变量来承销。
