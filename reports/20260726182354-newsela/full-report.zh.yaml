      - number: '4.5'
        title: 财务判断：收入潜力不错，但公开材料难以承销
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但不完整的财务判断。Newsela 看起来拥有真实经常性收入、学区级合同，以及横跨内容、测评和分析的交叉销售潜力。这些都是耐久 K-12
              软件经济性的正确材料。与此同时，最影响决策的财务变量仍是私有的：实际定价、毛利率、续约扩张、CAC 回本、运营烧钱和当前流动性。这意味着收入故事可信，但承销案例仍缺文档支撑。


              尽调时，应把公司看作一个有规模的私有 edtech SaaS 资产：收入质量可能好过当前市场认可，但仅凭公开来源无法负责任地判断估值支撑。如果管理层能展示稳定或增长的
              ARR、克制的烧钱，以及新产品的强捆绑附加，公司仍可能配得上私有软件溢价画像。否则，定价不透明、学区预算放慢和融资背景陈旧交织在一起，可能继续压低估值和融资杠杆。
