      - number: '2.5'
        title: 采用约束：ESSER 断崖、资金缺口与证明负担
        blocks:
          - type: paragraph
            body: >-
              2026 年最大的市场约束不是没有需求，而是资金质量。Department of Education 的清算延期材料确认，在与诉讼有关的指引下，此前获批的 ARP ESSER late-liquidation
              项目只能延续到 2026 年 3 月 30 日；SETDA 则称，仅 6% 的受访者对持续 edtech 工作有耐久资金计划。Civic IQ、HelloSubs、TeachingChannel 和
              Strategic Plan 360 都描述了 ESSER 后的环境：学区必须用更强的 ROI 逻辑捍卫每一次续约，而且常常还要面对入学人数下降、运营成本上升，以及 AI 或网络安全优先级的竞争。这不会消灭
              Newsela 的市场，但会让品类筛选更严。


              第二个约束是，买方现在会拿读写工具和更完整的替代方案比较。CommonLit 宣传完整 ELA 项目，Amplify 提供完整 ELA 课程，Renaissance 销售阅读练习加测评，IXL
              则覆盖多学科技能练习。在这种环境里，Newsela
              的市场优势不再取决于宣称读写市场很大，而更取决于证明它由差异化内容、形成性测评和数据协调组成的组合，能替代其他支出，或守住自己的续约。关键尽调问题因此不是有没有读写支持需求，而是 Newsela
              能否把广泛品类需求转化为经常性、预算韧性强、获客和留存经济性可接受的合同。
