        title: 模型风险主要是留存、集中度和证明门槛，而不是已披露的烧钱困境
        blocks:
          - type: paragraph
            body: >-
              Newsela 是私有公司，不发布详细财务报表，因此本章的财务模型风险，与其说是可见的资不抵债信号，不如说是可能悄悄侵蚀估值质量的因素。如果 ARR
              很大但续约质量不均，如果少数大型学区贡献过多收入，或如果产品扩张依赖昂贵服务和实施支持，那么公司表面规模对应的质量倍数，可能低于更干净的 SaaS 故事。公开记录没有披露
              NRR、GRR、毛利率、头部客户集中度，或按模块划分的绑定率经济性。这让价格纪律和尽调排序变得关键。因此，最重要的否决触发项都是可衡量的：post-ESSER
              后学区持续流失、重叠产品被整合出局的证据、任何重大隐私或安全故障、主要合同内部使用率低，或多产品宽度无法转化为耐久收入扩张的证明。这些结果今天都没有被证实，但每一项都足够合理，投资论证应继续取决于私有尽调，而不是公开乐观。
