      - number: '3.3'
        title: 分发、切换成本与多工具并用
        blocks:
          - type: paragraph
            body: >-
              Newsela 面向 LAUSD 和 NYCDOE
              的学区页面显示，公司有真实的学校体系企业级分发，并不局限于教师逐个自下而上的采用。这一点重要，因为学区标准工具即使不拥有整个课程预算，也能获得有粘性的花名册和工作流位置。Newsela 与
              Google、Clever 和 Canvas 的集成进一步降低了上手摩擦，提高了在既有课堂系统中的可部署性。相较缺少系统级集成或学区实施支持的小供应商，这些是真实竞争优势。


              但这些优势并不会转化为硬锁定。CommonLit 公开展示了 Google Classroom、Clever 和 Canvas 支持类别；许多学区已经并行使用多个读写工具；教师仍可按课堂目标把 Newsela 与
              IXL、Khan Academy 或 Accelerated Reader
              混用。这意味着切换成本是中等，而不是高到不可承受。最可能获胜的供应商，往往不是功能孤立最多的那个，而是最贴合学区当前运营模式的那个——核心课程采纳、测评驱动的读写监测、补充性差异化内容，或免费的教师主导拓展。Newsela
              得到的启示是：续约取决于它能否嵌入反复发生的教学常规，而不仅是技术上集成。
            claimRefs:
              - CP026
              - CP027
              - CP028
              - CP033
              - CP037
      - number: '3.4'
        title: 定价、包装不透明与企业采购动态
        blocks:
          - type: paragraph
            body: >-
              公开定价仍是竞品分析的结构性弱点，因为多数企业级 K-12 供应商都回避透明标价。Newsela 自己就说明了这个问题：公开证据显示 2021 年每名学生 $6-$14 的历史区间，以及 Maryland
              每名学生 $35.49 的采购示例，但没有当前通用价目表。CommonLit 传递的是可负担信号，但在审阅页面上没有发布企业学区定价。Amplify、Renaissance 和 Achieve3000
              也同样依赖销售主导的采购，而不是自助式企业定价。这种不透明让并排价格比较变难，也抬高了试点、采购推荐和 ROI 叙事的重要性。


              实际效果是，免费或低成本替代方案带来的定价压力，比企业价目表更强。Khan Academy 和教师自制资源，给纯补充性读写工具的收费设了天花板。CommonLit
              的低成本姿态会进一步缩小价差。完整套件供应商也可以把讨论从单项价格转向整体工作流替代，尤其当它们把课程、测评和报告打包时。因此，Newsela
              不只要相对直接同行证明价格合理，还要对抗买方把免费工具、核心课程和测评平台组合成可行替代栈的能力。
