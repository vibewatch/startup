  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、替代方案与存量品类
        blocks:
          - type: paragraph
            body: >-
              Newsela 面对的竞争集合，比「阅读应用」这个简单标签暗示的更宽。直接替代集合包括 Achieve3000、CommonLit 这类差异化读写平台，IXL 这类宽口径练习平台，Khan Academy
              这类免费使命驱动学习平台，以及 Renaissance 这类成熟阅读测评生态。在存量供应商一端，Amplify 代表更完整的 ELA
              课程采纳替代方案，可以吸收原本可能流向补充性读写工具的预算。因此，Newsela 同时在和直接产品同行、课程存量供应商，以及「教师自制材料 + 免费资源」的现状方案竞争。


              产品表面说明了为什么这很重要。Newsela 销售的是跨学科教学内容平台，内置测评和可行动洞察；CommonLit 以低得多的成本营销完整 ELA 项目；IXL 提供对齐标准、跨学科的技能练习；Khan
              Academy 拥有大得多的免费学习者规模；Renaissance 把阅读练习与测评基础设施结合起来；Amplify 销售可用于课程采纳的课程；Achieve3000
              仍是自适应差异化读写领域最接近的公开同行。学区可以在其中多个工具之间多栖使用，因此 Newsela 很少处在赢家通吃品类里。真正的竞争是：哪个产品成为核心，哪个沦为补充，预算收紧时哪个会被砍掉。
