  - id: TV004
    title: 可比估值表
    enumeration: true
    columns:
      - 可比项
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Newsela 2021 年 D 轮
        - 公司特定历史价格参考
        - $100M 融资，估值 $1B。
        - 公司最可靠的历史估值锚。
        - 旧价格来自不同市场环境，也早于 ESSER 退坡后重置。
      - - Newsela 2026 年二级市场 / 跟踪区间
        - 当前外部私有市场信号
        - PM Insights 暗示约 $833M，Premier Alternatives 发布约 $297M；HolonIQ 将 Newsela 视为已失效独角兽。
        - 显示旧独角兽估值已不再被普遍接受。
        - 来源方法不同，也不是经审计董事会估值。
      - - Duolingo
        - 公开市场高质量教育软件参考
        - 2026 年 7 月约 $1.09B TTM 收入、$5.69B 市值、~5.23x P/S。
        - 对盈利且享受溢价交易的教育软件，是有用的上限可比。
        - 消费者语言学习应用，披露更充分，买方结构不同。
      - - Coursera
        - 公开市场中段教育软件 / 学习平台参考
        - 2026 年 7 月约 $0.77B TTM 收入、$1.53B 市值、约 2x P/S。
        - 对有规模但溢价较低的教育平台，是有用的中段参考。
        - 终端市场和流动性画像不同于学区 K-12 软件。
      - - Chegg
        - 公开市场困境学习平台参考
        - 2026 年 7 月约 $0.31B TTM 收入、~$0.10B 市值、低于 1x P/S。
        - 在信心偏弱导致倍数压缩时，是有用的下限边界。
        - 学生辅导模型与 Newsela 不是直接业务模式匹配。
    notes: 该可比组意在建立边界区间，而不是单一点倍数。
