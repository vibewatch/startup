        - 面向全球学习者、教师和学校的免费访问
        - 免费分发、巨大触达、AI 助手、强使命品牌
        - 未围绕 Newsela 式分级非虚构工作流或学区阅读运营定制
      - - Renaissance
        - 评估 + 阅读练习既有厂商
        - 依托 Star + AR 的成熟评估 / 阅读基础设施
        - 重视基准数据、进度监测和阅读练习的学区
        - 深度评估 / 报告、阅读练习系统、广泛学区信任
        - 较少聚焦时事内容和灵活跨学科文章工作流
