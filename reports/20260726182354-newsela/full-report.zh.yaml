      - number: '2.2'
        title: 规模测算视角：学生基数、单生支出与现实可服务区间
        blocks:
          - type: paragraph
            body: >-
              最宽的需求视角从 K-12 学生基数开始。NCES 报告称，2022 年秋季公立小学和中学学生约 49.6 million，2021 年秋季私立学校学生约 5.5 million；在扣除
              homeschool、重叠或采购排除项之前，美国 K-12 可触达学习者总量约为 55
              million。这个人群适合做教学内容供应商的漏斗顶端，但不是付费客户数。更有用的视角，是学区为改善读写和参与度的产品支付的单生支出。TechCrunch 报道称，Newsela 付费产品在 2021
              年约为每名学生 $6-$14，而一份 Maryland 公共采购文件显示，2023 年指定学校使用的示例高得多，为每名学生 $35.49。这些公开点位提示了两条通道：低成本补充内容，以及价值更高的一体化套件。


              用这些公开价格锚点测算，得到的是有边界的市场图景，而不是夸大的市场故事。把 $6-$14 套到约 55.1 million 名公立加私立 K-12 学生上，意味着广义补充内容 TAM 约为 $331
              million 到 $771 million。把 Maryland 示例套到同一人群上，则得到接近 $2.0 billion 的高配套件上限视角；但这很可能高估现实，因为并非每个学区都会买高端读写 /
              数据栈，也因为部分支出已经埋在更大的课程或测评包里。关键结论是，Newsela 真实的美国可服务市场，更适合看成一个几亿美元到低个位数十亿美元的机会，取决于捆绑深度、学区渗透率，以及分析和测评是否被附加进去。
