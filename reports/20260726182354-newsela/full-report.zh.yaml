      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Newsela 的历史融资有充分支撑，但当前资本充足性没有。Tracxn 和 TechCrunch 都印证了 2021 年 2 月 $100 million Series D，投后估值 $1
              billion。不过，第三方跟踪器对累计资本看法不一：GetLatka 显示 $170.3 million，Tracxn 显示 $173 million，Premier Alternatives 显示
              $189.0 million。分歧本身不致命，但它凸显了基本问题：投资者缺少公司披露的资产负债表视角。审阅过的公开来源没有给出当前现金、月度烧钱、债务义务或 runway。


              二级市场来源给出的资本信号，弱于 2021 年融资曾暗示的水平。PM Insights 显示，截至 2026 年 7 月，隐含估值约 $833 million，低于上一轮；Premier Alternatives
              则发布了低得多的 $297.1 million
              估算。这些方法并不等同，也不应被当作精确公允价值；但放在一起，它们说明外部投资者已不再自动锚定独角兽估值。因此，当前流动性、烧钱纪律和下一轮融资选择权，都是核心尽调项。
            claimRefs:
