      - number: '8.3'
        title: 情景框架与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              Newsela 没有在留存公开材料包中披露经审计的当前收入或利润率，因此这里每个情景都明确是分析框架，而不是已观测事实。基础框架从最好的可见收入锚点出发，即 GetLatka 约 $109M 的 ARR
              估算，再为 post-ESSER 预算压力、透明度有限和未解决的续约经济性打折。这个结果比 2021 年融资轮更保守，但仍承认 Newsela
              有真实市场位置、具名学区证据，以及足够宽的产品表面，未来可以支撑增购。在这一框架下，当前公开证据支持的中间区间，更接近有纪律的数亿美元中段，而不是无需质疑的独角兽标记。

              牛市情形需要的不只是简单存活。它假设多产品扩张正在转化为耐久收入增长，主要学区在健康使用下续约，股权结构或优先权包袱有限。在这个世界里，Newsela
              仍可能拿到接近旧轮次的估值。熊市情形也重要，因为下行传导路径很容易想象：学区软件理性化、大型合同内部使用弱，或隐藏资本结构复杂性，都可能把公允价值明显往下拉。因此，投委会输出应是一组带明确触发项的区间，而不是单一目标价。公开证据支持兴趣，但只支持价格敏感的兴趣。
            claimRefs:
              - CV023
