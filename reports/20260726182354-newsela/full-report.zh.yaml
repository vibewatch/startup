chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命、总部与产品范围
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Newsela 呈现给市场的形态已经是面向 K-12 学校的教学、测评和数据连接平台，而不是单一的阅读新闻产品。官网首页和产品页描述的套件覆盖 Newsela Learning
              Suite、Balanced Assessment by Formative 和 Schoolytics，并把使命表述为让每个学生获得有意义的课堂学习。公司页面称 Newsela 在 2013
              年上线，最初把内容改写到五个阅读级别；当前产品材料则围绕 18,000 多篇文本和视频、AI 驱动的学习支架、分学科产品，以及学区级数据工作流来定位平台。公司仍将总部设在纽约市；2026
              年新闻稿和法律页面也继续把发行主体标为 Newsela, Inc.，运营的是面向学校的平台，而非直接面向消费者的应用。


              当前营销组合对尽调重要，因为它显示 Newsela
              已经从补充性读写内容上移到更宽的学区工作流预算项，把教学、测评和分析揉在一起。拓宽产品线可以抬高平均合同额和留存，但也意味着公司现在不只和读写工具竞争，还要对上更一体化的课程与测评供应商。LAUSD 和
              NYCDOE 的公开学区页面，以及公司官网，都支撑这一判断：Newsela 主要靠学校和学区关系销售，而不是靠教师个人订阅。
