      - number: '1.3'
        title: 融资历史、估值标记与私募市场信号冲突
        blocks:
          - type: paragraph
            body: >-
              Newsela 最后一次明确披露的融资是 2021 年 2 月 Series D。TechCrunch、Built In NYC 和 PR Newswire 转载的公告都称，Newsela 融资 $100
              million，并达到 $1 billion 估值，由 Franklin Templeton 领投。TechCrunch 还报道，这轮融资规模超过公司此前累计融资额，并提到管理层指引：到 2021 年底，超过
              11 million 名学生将使用授权 Newsela 产品，付费价格当时约为每名学生 $6 到 $14。这些是可信的历史锚点，因为报道发生在同一时期，并得到多个媒体相互印证。


              更不清楚的是这家公司现在值多少钱。2021 年之后，Newsela 没有公开宣布新的一级融资。HolonIQ 的 edtech 独角兽跟踪器称，Newsela 在 2021 年 2 月进入独角兽名单，又在
              2024 年 1 月被移出，标注为「过期」公司：上一轮融资时间太久，无法在当时倍数下支撑当前 $1B 估值。Premier Alternatives 现在显示，2026 年二级交易式隐含估值约为 $297
              million。GetLatka 估算 2024 年收入为 $109 million、累计融资约 $170 million，但这些是数据库估算，不是管理层披露。关键尽调结论是：2021
              年独角兽标记在历史上真实存在，但没有新的交易证据，就不应把它当成当前估值。
