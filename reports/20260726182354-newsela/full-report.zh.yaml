  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Newsela 并不在整个教育软件市场里竞争。更切题的市场边界，是美国 K-12 教学材料和读写支持市场，尤其是数字内容、阅读理解、形成性测评，以及相邻的学区数据工作流。Freedonia 的 2025-2026
              年教学材料概览称，州级标准修订、学区要求可衡量影响，正把这个市场带入重置期。它的阅读市场概览还补充说，学区越来越想要整合系统，把核心教学、测评、干预、专业学习、多语言支持和可行动数据结合起来，而不是孤立点状工具。这个框架贴合
              Newsela 当前定位：它是内容、测评和分析结合的平台，而非单一用途的文章库。


              关键替代品不只来自直接 edtech 同行。现状方案包括课本、教师自制材料包、学区在 LMS 环境里整理的资源，以及 Khan Academy、CommonLit
              这类免费非营利工具。官方竞品页面也说明边界为什么混杂：IXL 横跨多学科、多年级技能练习，Renaissance 强调阅读练习加测评，Amplify 则销售完整 ELA
              课程。学区可以通过课程采纳、补充内容、练习软件或本地拼装的工作流来解决同一个读写与教学问题，因此 Newsela 的实际市场由学区预算线和采购逻辑定义，而不是由单一产品分类定义。
