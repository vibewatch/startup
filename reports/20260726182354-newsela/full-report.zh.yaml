      - number: '1.4'
        title: 规模、学区覆盖与产品套件扩张
        blocks:
          - type: paragraph
            body: >-
              Newsela 当前公开材料强调广泛的机构覆盖。产品页称平台覆盖 47 million 名学习者、4 million 名教师、18,000 多条内容，并在约 90%
              的美国学校中使用。这些规模口径来自公司陈述，因此应视为管理层报告，而非独立审计指标；但 LAUSD 和 NYCDOE 的具体学区部署页面，以及多篇成功案例和效果材料，在方向上提供了印证。Newsela
              自己面向学区的页面把平台放在课堂工作流里：它借助 LMS、花名册同步和学区内容集合运转，而不是偶尔拿来补充阅读。


              M&A 扩张也在重塑公司画像。Newsela 之前加入了 Formative，随后在 2026 年 1 月宣布收购 Schoolytics，并在 2026 年 3 月宣布收购 EveryDay
              Labs。这些交易合在一起，把 Newsela 从内容和课堂测评推向学区分析、MTSS
              工作流和考勤干预。它们撑起更宽的平台叙事，也带来更多交叉销售路径；但集成复杂度上升，买方也更多，且每类买方都必须看到产品之间能形成连贯 ROI。East Orange 成功案例和 2026 年 CODiE
              新闻稿支撑这样的判断：Newsela 在拓宽到学区基础设施的同时，仍保有课堂可信度。
