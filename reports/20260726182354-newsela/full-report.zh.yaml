      - number: '3.5'
        title: 护城河耐久性：哪些能守住，哪些会被侵蚀
        blocks:
          - type: paragraph
            body: >-
              Newsela
              今天看起来最可信的护城河不是原始规模或独特集成，而是差异化五级内容、跨学科适配性、教师友好的作业工作流，以及现在横跨内容、测评和数据的产品组合。当学区想要一层灵活但仍重证据的跨学科工具，而不是固定的基础教材项目时，这个组合会很有力。Newsela
              还受益于一个事实：时事和真实世界非虚构内容，仍明显不同于技能刷题练习或静态纸质课程。


              护城河较弱的部分，是定价防御力和资本光环。HolonIQ 在 2024 年把 Newsela 从活跃独角兽名单中移出，称其为过期公司，这削弱了 2021 年融资曾带来的信号力量。与此同时，Duolingo 和
              Khan Academy
              展示了现代教育软件挑战的两端：一个说明公开市场奖励怎样的规模和盈利能力，另一个说明免费使命驱动平台可以维持多大的覆盖。如果学区向核心套件整合，或者把完整课程与免费补充工具拼成栈，Newsela
              就可能被替代，除非它能证明自己的集成工作流确实改变学生结果或教师生产率。护城河是真实的，但有条件，而且必须在每个采购周期重新赢回来。
