companyProfile:
  summary: >-
    Newsela 是一家总部位于纽约的 K-12 软件公司，2013 年创立，向学校和学区销售教学内容、测评，以及面向数据的课堂工作流工具。公开证据显示，它的产品面已经覆盖 Learning
    Suite、Formative、Schoolytics 和考勤能力；同时，公司有具名学区案例，也确有 2021 年 $100 million Series D，当时估值 $1 billion。核心尽调约束不是 Newsela
    是否是真平台，而是当前业务质量信号——ARR 规模、学区验证和产品广度——是否足以抵消 ESSER 后预算压力、有限财务披露，以及外部估值信号在 2026 年出现的明显重估。
