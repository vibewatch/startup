  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 学区续约质量破裂
        - 大型旗舰学区出现续约弱、席位数收缩或活跃使用低。
        - 公司看起来就不再像有粘性的教学基础设施，更像可削减的补充性支出。
        - 按熊情景区间重新承销，或直接退出。
      - - 隐藏股权结构包袱
        - 优先权顺位、债务或棘轮条款让新普通股敞口明显次级化。
        - 表面企业价值将无法转化为有吸引力的股权上行。
        - 除非价格重置或结构清理干净，否则暂停。
      - - 隐私或安全失守
        - 尽调中发现重大学生数据事件或信任破裂。
        - 采购摩擦和续约风险会同时上升。
        - 对高溢价倍数承销视为论点破裂。
      - - 交叉销售无法变现
        - Formative 和 Schoolytics 提升了产品宽度，却没有拉动附加、扩张或利润率。
        - 牛情景会失去扩张倍数的主要理由。
        - 只按基准或熊情景承销。
      - - ESSER 退坡后削减加深
        - 学区软件审查越来越把 Newsela 视为重叠或非核心。
        - 收入耐久性会重估到较低质量教育科技倍数。
        - 降低敞口意愿，并要求更低成交价。
    notes: 否决触发项聚焦价格敏感的失败模式，而不是一般运营噪音。
    claimRefs:
      - CV030
      - CV032
      - CV034
      - CV041
      - CV042
      - CV043
      - CV044
      - CV049
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 续约质量
        - 按头部学区拆分的 GRR、NRR、队列续约、席位扩张和使用深度。
        - 没有这些，ARR 规模无法转成耐久价值。
        - 索取 CFO 与客户成功队列资料包。
      - - 股权结构与资产负债表
        - 债务、优先权堆栈、棘轮条款、期权池，以及任何二级成交历史。
        - 股权结果可能与简单 EV/收入测算差异很大。
        - 索取法律摘要、股权结构表和融资文件。
      - - 利润率与实施经济性
        - 按产品拆分的毛利率、服务负担、支持负载和实施成本。
        - 这些决定 Newsela 应按 SaaS 式估值，还是按服务更重的估值处理。
        - 索取财务模型和董事会 KPI 材料。
      - - 客户集中度
        - 最大学区和州合同的收入占比与续约状态。
        - 少数高风险学区就可能改写整个承销图景。
        - 索取前 20 大账户复盘和续约日历。
      - - 产品附加与扩张
        - 核心内容、Formative、Schoolytics 及其他模块的收入结构。
        - 牛情景依赖多产品扩张，不只是核心读写留存。
        - 索取模块级 ARR 桥接表和附加队列。
      - - 退出准备度
        - 任何投行工作流、正式融资准备或董事会批准的战略路径。
        - 可能退出路径会塑造持有期纪律和估值容忍度。
        - 要求与 CEO/CFO 讨论流程，并索取顾问名单。
    notes: 前四行是按接近历史独角兽估值承销新入场的硬性障碍。
    claimRefs:
      - CV028
      - CV035
      - CV036
      - CV045
      - CV046
      - CV047
      - CV048
      - CV050
      - CV051
