      - number: '6.5'
        title: 通过产品宽度和嵌入学区工作流，扩张有合理性，但集中度仍不透明
        blocks:
          - type: paragraph
            body: >-
              Newsela 确实有扩张杠杆。学区专页已经展示 ELA、社会研究、SEL、写作、Formative、Schoolytics
              和实施服务，因此平台不只是一座文章库。案例研究还显示相邻动作，例如课程对齐、双语支持、专业学习，以及州或学区定制内容。这些都是可信的先落地再扩张要素。但公开记录没有给出最关键的分母：多少收入绑定在最大学区、多少学区购买多个产品、实际续约的客户占比是多少。若少数超大型学区或州合同贡献了不成比例的
              ARR，集中度仍可能很高。同样，如果更宽的产品页面主要是营销，而不是有实质绑定的授权，扩张也可能被夸大。本章的承销结论因此是正面但有条件：Newsela
              有真实客户证据和真实扩张逻辑，但客户耐久性和集中度还需要管理层披露或私有数据验证，才能高置信承销。
