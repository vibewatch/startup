          - type: paragraph
            body: >-
              Newsela 不应像一个空白私有叙事那样估值，但也不应像 Duolingo 那样估值。本次使用的公开可比公司集合有价值，因为它显示，一旦增长、买方结构和信心分化，教育软件倍数会拉得很开。Duolingo 的
              2026 年 7 月 CompaniesMarketCap 页面显示，过去 12 个月收入约 $1.09B，市值 $5.69B，市销率超过 5x。Coursera 筛出来低得多：过去 12 个月收入约
              $0.77B，市值约 $1.53B，市销率约 2x。相比之下，Chegg 在收入下滑下按困境水平交易，市值约 $0.10B，市销率低于 1x。

              Newsela 大致落在这些结果之间，但区间右侧取决于尚未公开的证明。它比消费者教育应用更嵌入工作流、也更多通过学区合同售卖，因此不应默认套用 Chegg 式困境视角。但它也比 Duolingo
              更不透明、流动性更弱、预算暴露更高，因此不应支付高端公开软件倍数。公司看起来最像一个中等质量的垂直教育软件资产；在私有尽调证明留存质量、多产品绑定和利润率深度之前，应相对一流公开可比公司打折。可比公司表应被当成边界设定工具，而不是虚假精确的估值输出。
