              都出现在留存来源中，并带有平台如何使用的具体描述。它们不是没有标签的客户标识：案例写到了服务科目、学生数、铺开方式，或差异化教学、跨学科读写练习、自定义课程支持、为教师节省时间等实施结果。若干案例还被镜像案例研究市场页或更广的参考目录交叉印证，提升了这些部署真实性的信心。需要注意的是新鲜度和筛选偏差。多数公开证据由公司撰写，或通过公司相邻的市场平台分发，许多结果也偏定性或按营销叙事包装。即便如此，底层部署证据仍有意义，因为它显示
              Newsela 运行在约 3,500 名到 85,000 名学生不等的学区，覆盖课堂层面和全学区用例。
