      - number: '6.4'
        title: 留存和满意度证据存在，但薄、部分陈旧，且多为定性
        blocks:
          - type: paragraph
            body: >-
              公开留存证据是客户论证中最弱一环。TrustRadius 和可通过 Wayback 访问的 G2 快照显示，教师看重差异化阅读等级、内容质量和易于激发参与，这支持 Newsela
              解决真实课堂问题的直觉。与此同时，相对于 Newsela 声称的规模，可见评论规模很小，G2 快照已经过时，Capterra
              在审查期间被验证流程挡住。这些事实不能否定客户满意度，但限制了投资人能给公开评论网站分配的权重。更重要的是，公开材料没有披露
              NRR、GRR、流失率、合同期限、续约率，或按学区规模划分的客户群组行为。因此，尽调应把满意度代理指标和实际经济耐久性分开。正确读法是：Newsela
              很可能在许多课堂里确有教师喜爱，但公开证据没有量化这种教师价值多稳定地转化为经常性学区收入或多产品扩张。
