      - number: '3.2'
        title: 能力对比：Newsela 做得好的地方，以及对手能追平的地方
        blocks:
          - type: paragraph
            body: >-
              Newsela 最强的可见能力组合，是差异化真实世界内容、跨学科覆盖、内置测验与活动，以及主流学区工作流集成。Clever 应用页和 Google Classroom
              插件材料显示，SSO、花名册同步、作业和评分工作流已经成熟。这很重要，因为部署摩擦会在教学法发挥作用前先杀死使用。Newsela 还受益于 ELA、社会研究、科学 / STEM
              和写作的横向广度，比单科阅读干预更灵活。


              不过，公开来源也清楚显示了几类竞品优势。CommonLit 不只是内容库；它把自己定位为带测评、数据和专业发展的完整 ELA 项目，支持中心也展示了学区期待 Newsela 具备的同类主流集成。IXL
              在对齐标准的重复技能练习和跨学科日常使用上更强。Renaissance 通过 Star Assessments 加 Accelerated Reader，在阅读测评和进度监测基础设施上更深。Achieve3000
              是差异化读写工作流上最接近的直接同行，强调自适应阅读级别、Science of Reading 定位和报告。Amplify 在学区想要核心课程而不是灵活的「补充内容 + 测评」层时更强。因此，能力图谱显示
              Newsela 在差异化时事内容和工作流平衡上占优，但并非在学区买方关心的每个类别都占优。
