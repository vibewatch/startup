      - number: '5.5'
        title: 信任、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              对一个面向 K-12 的教育科技平台，隐私和合同控制就是产品的一部分，不只是法律管线。Newsela 的法律文件明确写到 FERPA、COPPA、州隐私法、数据所有权、DPA 条款、客户审计权，以及确认安全事件后
              72 小时内通知。这些控制撑住学区采购，也压低平台采用中最大的阻力之一。因此，官方页面呈现出一家把隐私和学校官方职责视为产品交付核心的公司。


              不过，公开记录对法律承诺的证明强于对技术透明度的证明。Newsela 没有公开提供状态页、SLA
              或可靠性细节到基础设施型软件公司可能提供的程度。这不等于质量弱；它意味着尽调需要把隐私文件成熟度和运营证明成熟度拆开看。信任叙事足够支撑买方信心，但还没完整到让技术投资人停止追问。
