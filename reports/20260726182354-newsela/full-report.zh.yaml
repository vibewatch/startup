      - number: '1.2'
        title: 创始人、领导层交接与组织方向
        blocks:
          - type: paragraph
            body: >-
              Newsela 由 Matthew Gross 和 Dan Cogan-Drew 创立；公司页面和创始人作者页把 Gross 锚定为联合创始人和长期前 CEO，把 Cogan-Drew
              锚定为联合创始人和首席学术官。公开记录中最重要的治理变化，是 2023 年 1 月 Pep Carrera 接任 CEO。公司投资方之一 Owl Ventures 称，Gross 在约十年后交出 CEO
              职位，但继续担任执行董事长。Pep Carrera 目前在 Newsela 的作者页确认他是现任 CEO，并强调他过去在 Nearpod 和 VitalSource 的领导经历；这很相关，因为它说明
              Newsela 有意选择一位熟悉课程相邻教育软件和数字教材转型的运营型负责人。


              这次交接与 Newsela 的战略演进一致：公司从创始人主导的读写产品，走向规模化投资组合公司。Gross 仍公开连接着公司的原始使命和早期增长；Carrera 则出现在 2026
              年收购公告和奖项新闻稿的引述中，说明运营控制权已经落到新 CEO
              手里。现有公开证据没有披露完整董事会名单，因此治理尽调仍需要直接索取董事会和股权结构材料。但资料显示的是一次受控接班，而不是突然动荡；这降低了一类管理风险，同时也带来后创始人运营阶段常见的执行风险。
