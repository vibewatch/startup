      - number: '8.4'
        title: 论点破裂触发项、退出路径与最终尽调
        blocks:
          - type: paragraph
            body: >-
              缺失工作不是表面修饰。若要把 Newsela 从跟踪升级为买入，投资人需要的是收入质量的私有证据，而不只是收入规模。核心问题是：大型学区是否续约，使用深度是否足以在 ESSER 之后守住预算，Formative
              和 Schoolytics 是否真的抬升绑定率，以及股权结构是否给普通股留下有吸引力的结果空间。Newsela
              的隐私和签约姿态比许多教育科技供应商更成熟，确实降低部分下行风险，但法务成熟不能解决财务不透明。采购证据和具名学区显示可信度，不一定显示高效或扩张中的收入。

              退出准备度也仍有条件。留存公开材料包没有证明近期 IPO 路径，也没有浮现正式流程的公开证据。今天更现实的路径是再来一轮私募融资、结构化二级交易，或在 Newsela
              证明续约质量和交叉销售耐久性后，最终引发战略方兴趣。因此，最清晰的论点破裂触发项都是可衡量的：主要学区流失、旗舰部署内活跃使用率低、隐藏优先权堆栈或债务负担、损害信任的隐私或安全事件，或多产品宽度无法转化为耐久经济性的证据。在这些事项清掉之前，公司站在严肃观察名单一侧，而不是愿意全价买入的一侧。
