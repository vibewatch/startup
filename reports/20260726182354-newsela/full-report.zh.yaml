      - number: '7.3'
        title: 运营风险在于：学区只保留能证明价值且付得起的东西
        blocks:
          - type: paragraph
            body: >-
              Newsela 最实际的近期风险不是单一戏剧性运营爆雷，而是预算和使用流失。官方和独立 post-ESSER
              材料都指向同一方向：一次性联邦救助资金已经结束，获批清算窗口有限，教育科技长期资金计划薄弱，学区领导正在复盘哪些软件重叠、闲置或无法证明可衡量结果。Government Technology 2026 年 6
              月的报道把威胁写得尤其具体：学区技术审计、对重叠工具的怀疑，以及只保护深度嵌入或明确关联结果的系统的压力。关键在于，Newsela
              位于核心课程、补充读写、评估和通用教学工具之间的竞争赛道。如果学区认定产品是读写和评估工作流的核心，它就守得住；如果被归为重叠的拓展内容，它就会被砍。公开证据支持两种解读：学区页面和采购记录显示企业级嵌入，而免费和低价替代品，加上稀疏的公开续约数据，保留了真实脆弱性。
