      - CU029
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 预算能否扛住、隐私 / 安全、激活 / 续约风险落在最高风险区，都会直接传导到收入质量。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余风险
      rows:
        - label: ESSER 退坡后的学区预算削减
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
        - label: 隐私 / 学生数据合规
          values:
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
            - label: 中-强
              tone: positive
            - label: 中-高
              tone: risk
        - label: 合同内教师激活
          values:
            - label: 中-高
              tone: risk
            - label: 高
              tone: risk
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
        - label: 集成 / 开通摩擦
          values:
            - label: 中
              tone: neutral
            - label: 中-高
              tone: risk
            - label: 中
              tone: neutral
            - label: 中
              tone: risk
        - label: 竞争重叠 / 整合
          values:
            - label: 高
              tone: risk
            - label: 中-高
              tone: risk
            - label: 中
              tone: neutral
            - label: 高
              tone: risk
        - label: 未披露集中度
          values:
            - label: 未知-中
              tone: neutral
            - label: 高
              tone: risk
            - label: 弱
              tone: risk
            - label: 高
              tone: risk
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR017
      - CR018
      - CR033
      - CR034
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示隐私、预算和激活失败如何传导到客户流失、扩张放慢、倍数下调，以及更防御性的尽调。
    data:
      nodes:
        - id: budget
          label: 预算悬崖 / ROI 压力
          detail: 学区在盘点软件支出，要求价值可量化，只保必要系统。
          tone: risk
        - id: privacy
          label: 隐私 / 安全负担
          detail: FERPA、COPPA、合同控制和泄露风险，把犯错成本抬高。
          tone: risk
        - id: activation
          label: 教师激活风险
          detail: 合同内使用率低，会削弱续约防线。
          tone: risk
        - id: competition
          label: 竞争重叠
          detail: 免费或更便宜的工具会压低付费意愿。
          tone: risk
        - id: renewal
          label: 续约质量
          detail: 收入韧性取决于学区能否留住并扩展产品。
          tone: neutral
        - id: valuation
          label: 估值质量
          detail: 倍数质量取决于留存、集中度和利润率假设是否干净。
          tone: neutral
      edges:
        - from: budget
          to: renewal
          label: 削减和重编预算
        - from: privacy
          to: renewal
          label: 采购摩擦 / 信任流失
        - from: activation
          to: renewal
          label: 使用疲弱
        - from: competition
          to: renewal
          label: 替代压力
        - from: renewal
          to: valuation
          label: ARR 质量
    claimRefs:
      - CR010
      - CR017
      - CR021
      - CR026
      - CR035
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Newsela 最依赖学区预算、教师使用、落地生态和隐私信任，而不是某个公开可见的硬件或供应链瓶颈。
    data:
      nodes:
        - id: newsela
          label: Newsela 平台
          detail: 面向学区销售的教学、评估和分析界面。
          tone: neutral
        - id: district
          label: 学区预算
          detail: 普通基金和 ESSER 后预算负责人决定哪些系统能留下。
          tone: risk
        - id: teacher
          label: 教师
          detail: 推动作业分配频率和嵌入式使用。
          tone: risk
        - id: lms
          label: LMS / 名册系统
          detail: Google Classroom、Clever、Schoology 和管理员配置都会影响激活。
          tone: risk
        - id: privacy
          label: 隐私控制
          detail: 合同和实际控制必须满足 K-12 采购要求。
          tone: risk
        - id: competitors
          label: 免费 / 重叠替代品
          detail: CommonLit、Khan Academy、IXL 和其他学区工具给预算施压。
          tone: risk
      edges:
        - from: district
          to: newsela
          label: 批准 / 续约预算
        - from: teacher
          to: newsela
          label: 激活工作流
        - from: lms
          to: newsela
          label: 开通和同步
        - from: privacy
          to: newsela
          label: 信任和合规
        - from: competitors
          to: district
          label: 价格 / 重叠压力
    claimRefs:
      - CR020
      - CR024
      - CR025
      - CR027
      - CR028
      - CR029
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从历史证明和当前规模，到二级市场重估与观察建议的决策链。
    data:
      nodes:
        - id: round
          label: 历史融资证明
          detail: 2021 年以 $1B 估值完成 $100M 轮融资。
        - id: scale
          label: 经营证明
          detail: ~109M ARR 估算，加上点名学区和采购证明。
        - id: reset
          label: 估值重置信号
          detail: PM Insights、Premier Alternatives 和 HolonIQ 都削弱了旧的独角兽锚点。
        - id: opacity
          label: 披露缺口
          detail: 公开证据仍缺少经审计的留存数据、利润率、集中度和股权结构表细节。
        - id: decision
          label: 建议：观察
          detail: 是严肃尽调候选，但必须守住价格纪律，并做私下验证。
      edges:
        - from: round
          to: scale
          label: 支撑可信度
        - from: scale
          to: reset
          label: 但挡不住
        - from: reset
          to: opacity
          label: 又受制于
        - from: opacity
          to: decision
          label: 引向谨慎
    approximationNotes: 这张图压缩呈现投资委员会的逻辑链，不是确定性的财务模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV008
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 仅使用公开来源锚点和明确假设，展示不同 ARR 与倍数组合下的示意性价值结果。
    data:
      items:
        - label: $95M ARR，3x 倍数
          value: 285
          detail: 如果使用或续约质量弱于公开信号暗示，即为下行情景。
        - label: $109M ARR，4x 倍数
          value: 436
          detail: 以可见 ARR 锚点测算，落在可支撑基准区间的低端。
        - label: $120M ARR，5x 倍数
          value: 600
          detail: 若留存质量合格但不突出，则是更强的基准情景。
        - label: $130M ARR，6x 倍数
          value: 780
          detail: 若交叉销售和续约质量得到验证，则是乐观情景的下界。
        - label: $150M ARR，7x 倍数
          value: 1050
          detail: 只有增长和质量都明显好于公开材料显示时，才撑得起历史独角兽级成交价。
    approximationNotes: 条形图数值是分析师生成的百万美元口径结果，并非可观察交易价格。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观和历史参照情景下的低 / 中 / 高价值结果。
    data:
      items:
        - label: 悲观情景价值
          low: 225
          mid: 290
          high: 350
          unit: USD millions
          displayValue: $0.23B-$0.35B
          detail: 假设 ARR 更低、续约更弱，私募市场倍数收缩。
        - label: 基准情景价值
          low: 436
          mid: 520
          high: 600
          unit: USD millions
          displayValue: $0.44B-$0.60B
          detail: 假设 ARR 大致持平到小幅增长，私募倍数严格落在 4x-5x 区间。
        - label: 乐观情景价值
          low: 780
          mid: 910
          high: 1050
          unit: USD millions
          displayValue: $0.78B-$1.05B
          detail: 假设扩张经济性更强、续约质量干净，资本结构拖累有限。
        - label: 历史轮次参照
          low: 950
          mid: 1000
          high: 1050
          unit: USD millions
          displayValue: ~$1.0B
          detail: 代表 2021 年独角兽时期参照，不是当前公允价值估计。
    approximationNotes: 区间仅为基于公开记录的分析估计；稀释、债务或优先权都可能让实际股权结果大幅偏离。
    claimRefs:
      - CV001
      - CV024
      - CV025
      - CV026
      - CV027
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，概括市场、证明、护城河、经济性、风险、估值和证据质量。
    data:
      items:
        - label: 市场
          value: 7/10
          detail: 读写能力需求真实，Newsela 也贴合学区工作流，但 K-12 预算更紧。
        - label: 证明
          value: 7/10
          detail: 历史融资、客户案例和采购证据，足够支撑严肃尽调。
        - label: 护城河
          value: 6/10
          detail: 产品宽度有帮助，但公开证据尚不足以证明附加销售和留存能长期守住。
        - label: 经济性
          value: 5/10
          detail: ARR 规模可见，但毛利率和续约质量尚未从公开渠道验证。
        - label: 风险
          value: High
          detail: 预算压力、隐私义务、股权结构表不透明都不能忽略。
        - label: 估值
          value: 4/10
          detail: 相对于 2026 年可见证据集，2021 年独角兽估值显得偏满。
        - label: 证据质量
          value: Medium
          detail: 足够给出观察结论，不足以支撑干净的买入建议。
    approximationNotes: 分数是委员会基于支撑性证据集做的速记，不是机器生成指标。
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV010
      - CV015
      - CV016
      - CV040
