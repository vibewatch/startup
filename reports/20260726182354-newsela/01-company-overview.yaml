- id: section-2
  title: Founders, leadership transition, and organizational direction
  body: 'Newsela was founded by Matthew Gross and Dan Cogan-Drew, with the company page and founder-author pages anchoring Gross as co-founder and former long-time CEO and Cogan-Drew as co-founder and Chief Academic Officer. The most important governance development in the public record is the January 2023 transition to Pep Carrera as chief executive officer. Owl Ventures, one of the company''s investors, reported that Gross handed over the CEO role after roughly a decade while remaining Executive Chairman. Pep Carrera''s current author page on Newsela confirms he is the sitting CEO and emphasizes his prior leadership at Nearpod and VitalSource, which is relevant because it shows Newsela intentionally chose an operator with experience in curriculum-adjacent education software and digital textbook transitions.


    That transition appears consistent with Newsela''s strategic evolution from a founder-led literacy product into a scaled portfolio company. Gross is still publicly linked to the company''s original mission and early growth, while Carrera is quoted in 2026 acquisition announcements and award releases, indicating operational control now sits with the new CEO. The available public evidence does not disclose a full board roster, so governance diligence still needs a direct board and cap-table request. But the sources do show a controlled succession rather than abrupt churn, which reduces one form of management risk while introducing the normal execution risk that comes with a post-founder operating era.'
  claimRefs:
  - CO003
