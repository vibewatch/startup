companyProfile:
  summary: Newsela is a New York-headquartered K-12 software company founded in 2013 that sells instructional content, assessment, and data-oriented classroom workflow tools to schools and districts. Public evidence supports a product surface that now spans Learning Suite, Formative, Schoolytics, and attendance-related capabilities, alongside named district proof and a real 2021 $100 million Series D that valued the company at $1 billion. The central diligence constraint is not whether Newsela is a real platform; it is whether the current business-quality signals—ARR scale, district proof, and product breadth—are strong enough to offset post-ESSER budget pressure, limited financial disclosure, and a visible 2026 reset in external valuation signals.
