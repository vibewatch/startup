  topStrengths:
  - 'Real historical financing proof exists: a $100 million 2021 Series D at a $1 billion valuation.'
  - Named district proof and procurement evidence support a genuine enterprise K-12 footprint rather than a lightweight teacher tool.
  - Public product positioning now spans instruction, assessment, analytics, and attendance-oriented workflow expansion.
  - Third-party ARR around $109 million suggests real scale for a private K-12 software vendor.
  - Privacy and contracting posture appear more mature than many smaller edtech vendors.
  topRisks:
  - Current public valuation support is materially weaker than the historical unicorn mark, with external 2026 signals resetting lower.
  - Audited revenue quality, renewal cohorts, gross margin, and top-customer concentration remain undisclosed publicly.
  - Post-ESSER district budget pressure can compress both growth expectations and private-market multiples.
  - Product-breadth upside is still largely theoretical until attach, expansion, and usage depth are verified.
  - Hidden debt, preference seniority, or secondary-clearing dynamics could materially change common-equity outcomes.
  unresolvedGaps:
  - GRR, NRR, active usage depth, seat expansion, and renewal quality by flagship district and by product.
  - Full cap-table waterfall, debt obligations, option pool detail, ratchets, and recent secondary-clearing evidence.
  - Gross margin by module, implementation burden, support intensity, and cross-sell economics across Learning Suite, Formative, and Schoolytics.
  - Revenue concentration across major districts, state contracts, and product lines.
  - Any formal exit-readiness workstream, banker process, or board-approved financing path after 2021.
