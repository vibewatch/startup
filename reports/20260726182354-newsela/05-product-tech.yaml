  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Public uptime, SLA, RPO/RTO, incident history, and release-quality metrics by product.
    whyItMatters: Workflow maturity is visible, but operational resilience is not deeply evidenced.
    diligencePath: Request enterprise assurance package, incident log summary, and product reliability KPIs.
    relatedQuestionRefs:
    - QE019
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: medium
    topic: ai-governance
    missingEvidence: Model selection, prompt-governance, evaluation, hallucination handling, and educator guardrails for Luna.
    whyItMatters: AI can improve usability or create pedagogical and trust risk depending on controls.
    diligencePath: Review model cards, internal evals, escalation policy, and educator-facing safety UX.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: medium
    topic: product-cohesion
    missingEvidence: Attach rates, unified navigation, and cross-product workflow depth across Learning Suite, Formative, Schoolytics, and EveryDay Labs.
    whyItMatters: Portfolio breadth is a strength only if users experience it as one coherent system.
    diligencePath: Demo cross-product workflows and request product-usage overlap data.
    relatedQuestionRefs:
    - QE016
    - QE017
    relatedTableRefs:
    - TE001
