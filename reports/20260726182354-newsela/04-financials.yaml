  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-liquidity
    missingEvidence: Current cash, burn, runway, and debt profile.
    whyItMatters: Without liquidity, investors cannot assess financing dependency or downside tolerance.
    diligencePath: Request latest monthly financial package, debt schedule, and base/downside runway model.
