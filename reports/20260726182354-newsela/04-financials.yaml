- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Realized net pricing by district and bundle
    - Without it, public contract examples can mislead on ACV and margin
    - Request contract cohort export by customer size, products, and effective per-student rate
  - - Gross margin by product
    - Needed to know whether acquisitions improved or diluted economics
    - Request GAAP gross margin bridge and services allocation
  - - CAC / payback / win rate
    - Sales efficiency cannot be inferred from case studies
    - Request segment-level funnel and payback deck
  - - NRR / GRR / churn
    - Retention durability is central in K-12 budgets
    - Request cohort retention with logo and dollar metrics
  - - Cash, burn, and runway
    - Valuation cannot be separated from financing need
    - Request latest board materials or monthly management reporting
  - - Acquisition integration economics
    - Schoolytics and EveryDay Labs could be accretive or distracting
    - Request synergy plan, cost to integrate, and cross-sell contribution
  notes: These are not nice-to-have metrics; they are the minimum required for responsible underwriting.
