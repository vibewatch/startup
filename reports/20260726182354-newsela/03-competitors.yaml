- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Five-level differentiated real-world content
    - CommonLit and Achieve3000 narrow the differentiation gap with structured literacy programs
    - Medium
    - Test whether districts see Newsela as uniquely useful for background knowledge and current-events engagement
  - - Mainstream LMS and roster integrations
    - CommonLit and other incumbents also support mainstream classroom systems
    - Medium
    - Quantify whether integrations materially increase activation or simply meet table-stakes expectations
  - - Cross-curricular content breadth
    - Amplify and core curricula can own ELA while free tools fill supplemental gaps elsewhere
    - High
    - Measure whether breadth drives larger ACVs or just broader evaluation without budget conversion
  - - Assessment + data portfolio breadth
    - Renaissance and curriculum incumbents already sell deep assessment or full-suite workflows
    - High
    - Show attach rates and renewal rates for Formative and Schoolytics alongside content licenses
  - - Brand and capital signaling
    - HolonIQ lapse and stale 2021 valuation weaken perceived category leadership
    - Medium
    - Request recent win/loss data versus better-capitalized or better-known alternatives
  - - Teacher habit and workflow embedment
    - Multi-homing lets teachers mix Newsela with IXL, Khan, or AR instead of standardizing
    - High
    - Review usage intensity, assignment frequency, and districtwide adoption depth before underwriting retention
  notes: The main competitive question is not whether Newsela has value, but whether that value is strong enough to remain budget-resilient when districts can combine free, low-cost, and full-suite alternatives.
