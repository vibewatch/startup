  topStrengths:
    - 历史融资证据真实存在：2021 年 $100 million Series D，估值 $1 billion。
    - 具名学区证据和采购记录表明，它是真正的企业级 K-12 覆盖，而不是轻量教师工具。
    - 公开产品定位已覆盖教学、评估、分析，以及面向出勤的工作流扩展。
    - 第三方估计 ARR 约 $109 million，说明这家私营 K-12 软件厂商已有真实规模。
    - 隐私和合同能力看起来比许多小型 edtech 厂商更成熟。
  topRisks:
    - 当前公开估值支撑明显弱于历史独角兽标记，外部 2026 年信号也在向下重置。
    - 经审计收入质量、续约队列、毛利率和头部客户集中度仍未公开披露。
    - ESSER 后学区预算承压，可能同时压缩增长预期和私募市场倍数。
    - 产品宽度带来的上行仍很大程度停留在理论层面，必须先验证附加销售、扩张和使用深度。
    - 隐性债务、优先权层级或老股清算动态，可能实质改变普通股结果。
  unresolvedGaps:
    - 按旗舰学区和产品划分的 GRR、NRR、活跃使用深度、席位扩张和续约质量。
    - 完整股权结构瀑布、债务义务、期权池细节、估值保护条款和近期老股清算证据。
    - Learning Suite、Formative 和 Schoolytics 各模块的毛利率、实施负担、支持强度和交叉销售经济性。
    - 主要学区、州级合同和产品线之间的收入集中度。
    - 2021 年后任何正式退出准备工作流、投行流程或董事会批准的融资路径。
