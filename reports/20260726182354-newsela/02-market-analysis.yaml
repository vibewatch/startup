  rows:
  - - Digital instructional content and literacy support
    - Leveled reading content, nonfiction texts, assignments, formative activities
    - Core print basal textbook spend unless digitally bundled
    - District curriculum leaders, schools
    - Closest to legacy Newsela demand
  - - ELA curriculum and assessment suites
    - Digital curriculum, benchmarks, common assessments, teacher workflows
    - Pure intervention tutoring labor and stand-alone PD
    - District academics, principals, assessment leaders
    - Relevant because Formative broadens Newsela into this lane
  - - District data / MTSS workflow tools
    - Analytics, attendance/intervention workflow, student-data dashboards
    - SIS core recordkeeping unless integrated
    - District data/MTSS leaders
    - Relevant because Schoolytics and EveryDay Labs broaden scope
  - - Status-quo substitutes
    - Teacher-created materials, LMS libraries, free nonprofit tools, textbooks
    - Non-instructional admin software
    - Teachers, schools, districts
    - Sets the real replacement set for Newsela renewals
  - - Adjacencies that shape budget competition
    - AI teacher tools, cybersecurity, devices, tutoring, intervention
    - Facilities and non-instructional capital projects
    - District leadership / finance
    - Important because these categories compete for the same post-ESSER dollars
  notes: Market boundary is framed around the district budgets and workflows Newsela can realistically access, not the entire edtech software universe.
