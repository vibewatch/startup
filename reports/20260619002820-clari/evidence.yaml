evidenceGaps:
  - type: missing-source
    severity: material
    topic: competition
    missingEvidence: >-
      Independent win-rate benchmarking comparing Clari against Gong, Salesforce Revenue Cloud, and AI-native
      forecasting startups in contested enterprise deals.
    whyItMatters: >-
      Without competitive benchmarking, the risks chapter cannot adequately quantify the probability of customer churn
      to well-funded rivals or the pricing pressure on future renewals.
    diligencePath: >-
      Request G2 and TrustRadius category rankings, analyst competitive teardowns (Forrester Wave for Revenue
      Intelligence), and Clari's internal win/loss data for late-stage enterprise deals.
    relatedQuestionRefs:
      - QO020
  - type: stale
    severity: material
    topic: arr
    missingEvidence: >-
      Combined Clari-Salesloft ARR or revenue run rate for fiscal 2025 or 2026 from an independent or company-filed
      source.
    whyItMatters: >-
      The most recent validated ARR figure is $158.5M for standalone Clari in 2024; the post-merger revenue profile is
      unknown and is a critical input to any valuation analysis of the combined entity.
    diligencePath: >-
      Request audited or board-approved combined revenue figures from management; supplement with Latka or
      industry-tracker refreshes once the merged entity has operated for a full fiscal year.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
