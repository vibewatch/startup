companyProfile:
  summary: >-
    Clari 是一家私有收入编排软件公司，成立于 2012 年，靠 AI 驱动的预测、管道检查和面向大型 B2B 销售组织的收入工作流软件建立市场位置。2025 年 12 月与 Salesloft 合并前，Clari 独立口径
    2024 年 ARR 约为 $158.5M，客户约 1,500 家；合并后平台覆盖 5,000 多家客户，估算 ARR 约 $450M，产品栈从销售互动延伸到预测执行。战略逻辑可信，但公开披露质量仍是后期私营公司水平，远未达到
    IPO 准备度：Clari 最后一次官方估值仍是 2022 年 1 月 $2.6B 的 Series F，而当前合并后经济性、留存和资本结构细节大多未披露。
