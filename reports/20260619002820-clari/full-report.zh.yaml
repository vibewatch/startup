        - 留存集未计算公开市场定价
        - 展示规模化订阅增长质量在公开市场的样子
        - 产品套件和客户组合宽得多
      - - Salesforce 公共可比
        - FY2026 收入 $41.5B；RPO $72.4B；Agentforce ARR $800M
        - 留存集未计算公开市场定价
        - 全球规模下 AI revenue operations 的战略天花板可比
        - 体量太大、业务太分散，不能直接作为定价锚
    notes: 只有估值和 ARR / 收入分母都能由留存来源支撑时，才计算倍数。公开公司行是定性天花板可比，因为本章没有留存当前市值 / EV 数据。
