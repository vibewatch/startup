  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 影响 Clari 可靠性、治理负担和竞争位置的关键生态依赖。
    approximationNotes: 节点集合仅覆盖审阅来源中证据最直接的依赖，而不是生态里每一个产品集成。
    data:
      nodes:
        - id: clari-core
          label: Clari 核心平台
          type: output
          detail: 预测、检查、Copilot 和工作流界面
        - id: salesforce
          label: Salesforce / CRM 资产
          type: risk
          detail: 数据来源、工作流锚点，也是直接竞争平台
        - id: zoom
          label: Zoom / 会议
          type: risk
          detail: Copilot 工作流依赖录制和转写
        - id: google
          label: Google / 邮件-日历数据
          type: risk
          detail: 在客户授权下摄取企业通信数据
        - id: groove
          label: Groove API 设置
          type: risk
          detail: 管理员 API 密钥，以及录制通话流入 Copilot
        - id: salesloft
          label: Salesloft 执行层
          type: risk
          detail: 任务、AI 邮件和 MCP 服务器界面
        - id: ai-tools
          label: 外部 AI 工具
          type: risk
          detail: Claude、ChatGPT、Copilot、Gemini、Agentforce 通过 MCP 接入
      edges:
        - from: salesforce
          to: clari-core
          label: CRM 数据和工作流依赖
        - from: zoom
          to: clari-core
          label: 会议捕获依赖
        - from: google
          to: clari-core
          label: 邮件 / 日历数据依赖
        - from: groove
          to: clari-core
          label: API 介导的通话与笔记流
        - from: salesloft
          to: clari-core
          label: 收入工作流内的执行动作
        - from: ai-tools
          to: salesloft
          label: MCP 驱动的工具访问
        - from: salesloft
          to: ai-tools
          label: 实时收入上下文导出
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
      - CR027
      - CR028
      - CR029
      - CR031
      - CR043
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论取决于实时价格信号能否与已验证的合并 ARR 和整合执行相互印证。
    data:
      nodes:
        - id: stale-primary
          label: 2022 年一级市场估值
          detail: 官方 Series F 锚点为 $2.6B+
          tone: neutral
        - id: live-secondary
          label: 2026 年二级市场信号
          detail: PM Insights 隐含价值约 $3.41B
          tone: positive
        - id: combined-arr
          label: 合并 ARR 问题
          detail: Forrester 称约 $450M；公司尚未公开审计
          tone: warning
        - id: integration-risk
          label: 整合 / 流失风险
          detail: 重叠、裁员和路线图不确定性压低倍数
          tone: warning
        - id: scenario-range
          label: 情景区间
          detail: $2.0B-$4.7B，取决于证明质量和执行
          tone: neutral
        - id: recommendation
          label: 继续研究
          detail: 等待财务证明或更好价格
          tone: warning
      edges:
        - from: stale-primary
          to: scenario-range
        - from: live-secondary
          to: scenario-range
        - from: combined-arr
          to: scenario-range
        - from: integration-risk
          to: scenario-range
        - from: scenario-range
          to: recommendation
    approximationNotes: 该流程强调决策依赖，而不是时间安排或概率权重。
    claimRefs:
      - CV012
      - CV013
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资者使用独立 ARR 还是合并 ARR、依赖一级还是二级估值锚点，会让 Clari 的倍数看起来截然不同。
    data:
      items:
        - label: 2022 年估值 / 2024 年独立 ARR
          value: 16.4
          unit: x
          detail: $2.6B 除以 $158.5M
        - label: 2022 年估值 / 合并 ARR 估计
          value: 5.8
          unit: x
          detail: $2.6B 除以 ~$450M
        - label: 2026 年 PM 估值 / 2024 年独立 ARR
          value: 21.5
          unit: x
          detail: $3.41B 除以 $158.5M
        - label: 2026 年 PM 估值 / 合并 ARR 估计
          value: 7.6
          unit: x
          detail: $3.41B 除以 ~$450M
        - label: Gong 2026 年二级市场 / ARR
          value: 9
          unit: x
          detail: $4.5B 除以 >$500M
        - label: Outreach 2026 年二级市场 / ARR
          value: 1.2
          unit: x
          detail: ~$300M 除以 ~$250M
    approximationNotes: 合并 ARR 是分析师估计值，Outreach ARR 则是带入 2026 年价值讨论的 2023 年分母，因此该图用于比较而非精确计算。
    claimRefs:
      - CV010
      - CV011
      - CV013
      - CV014
      - CV021
      - CV023
      - CV026
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 可支撑估值带从同业压缩的下行情景，一直延伸到接近 Gong 的上行情景。
    data:
      items:
        - label: 熊市估值
          low: 2
          high: 2.6
          unit: $B
          detail: 整合拖累，或合并 ARR 弱于宣传
        - label: 基准估值
          low: 3
          high: 3.6
          unit: $B
          detail: 合并 ARR 约 ~$450M，留存稳定
        - label: 牛市估值
          low: 4
          high: 4.7
          unit: $B
          detail: 交叉销售和溢价倍数支撑更接近 Gong
        - label: PM Insights 2026 年信号
          low: 3.35
          high: 3.47
          unit: $B
          detail: 围绕引用的约 ~$3.41B 隐含二级市场价值
        - label: 2022 年官方估值
          low: 2.6
          high: 2.6
          unit: $B
          detail: 历史一级融资锚点
    approximationNotes: PM Insights 区间是在引用数字周围做轻度平滑，避免让稀薄的私人二级市场显得有虚假的精确度。
    claimRefs:
      - CV001
      - CV012
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Clari 在战略相关性上得分较好，但并购后披露仍然单薄，估值支撑只能算中等。
    data:
      items:
        - label: 规模证明
          value: 7
          unit: /10
          detail: 如果合并 ARR 确实接近 $450M、客户超过 5,000 家，证明力度就很强
        - label: 增长质量
          value: 6
          unit: /10
          detail: 2024 年独立增长很强，但并购后 NRR 或流失率没有披露
        - label: 护城河耐久性
          value: 7
          unit: /10
          detail: 数据集广度和工作流深度真实存在，但尚未完全统一
        - label: 整合执行
          value: 4
          unit: /10
          detail: 重叠、裁员和路线图不确定性降低信心
        - label: 估值支撑
          value: 5
          unit: /10
          detail: 有二级市场信号，但一级市场价格发现已经陈旧
        - label: 证据质量
          value: 4
          unit: /10
          detail: 仍有太多关键指标缺失于公开来源
        - label: 整体可投资性
          value: 5
          unit: /10
          detail: 值得跟踪的资产，但还不是明确买入
    approximationNotes: 分数是综合章节证据形成的分析判断，并非公司披露的 KPI。
    claimRefs:
      - CV006
      - CV012
      - CV028
      - CV030
      - CV034
      - CV040
      - CV045
