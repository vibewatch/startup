      - number: '3.2'
        title: 直接同业：Gong 与 Outreach
        blocks:
          - type: paragraph
            body: >-
              Gong 是 2026 年中 Clari 最重要的直接竞争对手。Gong 于 2026 年 5 月 ARR 突破 $500M，同比增长超过 55%，且连续第十个季度增速加快；目前服务 4,000
              多家企业客户，包括 Fortune 10 的一半。Gong 的 AI 优势建立在 Revenue Graph 上：它把邮件、通话、会议和交易转化为专有的活记忆层，驱动关于交易优先级、团队风险信号和
              next-best action 的自动决策。Gong 的模块化产品套件（Foundation 用于通话录音与分析，Engage 用于销售序列，Forecast 用于管道管理）在每个核心
              Clari-Salesloft 使用场景上都形成直接竞争。全套件定价为每用户每月 $200–$250，大体可比 Clari 的 $200–$310 区间，意味着 Clari 无法只靠价格竞争。2026 年 G2
              用户评分显示 Clari 为 4.6–4.7、Gong 为 4.7–4.8；Gong 在销售代表辅导和 UI 上评分更高，Clari
              则在预测准确性和高管级报告上领先。许多大型企业同时运行两套平台，形成估算约每用户每月 $500 的叠加技术栈税。2026 年 5 月前两个季度，Gong 新增 $1M
              以上客户数超过此前六个季度总和，显示当销售代表辅导是主要驱动因素时，其在企业账户中的替换潜力正在加速。到 2026 年 5 月，Gong 有 50% 客户运行多个产品，旗舰 AI 能力使用同比增长超过
              200%，说明 Gong 客户的平台粘性在增强，与 Clari 自身锁定叙事相呼应。Outreach ARR 约 $340M，服务 6,000
              多家企业客户，主要在销售互动层竞争——邮件序列、拨号器和销售代表工作流自动化——这也是 Salesloft 历史上最强的领域。Outreach 累计融资 $489M，2021 年 6 月 Series G 估值
              $4.4B，采用企业专属 GTM，交易起价为每月 $2,500；对考虑合并后整合的组织来说，它是合并平台中 Salesloft 一半业务的直接替换候选。
