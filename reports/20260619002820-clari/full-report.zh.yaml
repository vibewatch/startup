chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Clari 于 2012 年 9 月在加州注册成立；二级来源通常把产品商业化归于 2013 年，反映注册成立与正式进入市场之间的时间差。公司最初位于加州 Redwood City，后将总部迁至加州
              Sunnyvale 的 1154 Sonora Court；截至 2026 年 6 月本次报告日期，公司仍在那里办公。Clari 是一家 Series F 阶段的私营公司，最近一次披露的投后估值为
              $2.6B，来自 2022 年 1 月融资交割，距今已超过四年。核心产品是一套面向企业 B2B 收入团队的 AI 驱动收入编排平台，汇聚 CRM
              系统、电子邮件、日历和销售对话信号，输出预测性预测、管道管理和收入工作流自动化。商业模式是企业 SaaS 订阅，通常定价在每用户每月 $200–$310
              区间，因此对中型市场和企业买家而言属于董事会层面的采购决策。Clari 将自身定位为横跨销售、营销运营和客户成功的横向平台，而不是只做预测的单点解决方案。截至 2024 年，Salesloft 合并把规模推高到
              5,000 多家组织之前，公司服务约 1,500 家企业客户。下方 KPI 快照汇总了后续章节将作为事实基准重复使用的已验证公开指标，并明确标出公开来源无法取得的私有指标缺口。
