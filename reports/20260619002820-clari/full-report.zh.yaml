      - number: '5.3'
        title: AI 层、MCP Server 与开发者界面
        blocks:
          - type: paragraph
            body: >-
              Clari 的 AI 技术栈一部分已经建立，一部分仍在成形。Ask Clari、Smart Chapters、Smart Feed、Smart Follow Ups 等 RevAI 功能在合并前已经推出，
              展示方式更像工作流级辅助，而非独立 copilots。较新的 Revenue AI Agents 页面把组合扩展到 Advanced Opportunity Scores、Smart Topics、 Smart
              CRM Suggestions、AI Projections，以及 Deal Inspection Agent、Trend Analysis Agent 等代理式功能；但公开标签很关键：部分功能仍为 early
              access， Ask Clari for Deals 仍标注 coming soon。2026 年最大的产品技术变化是 MCP 叙事。Salesloft 和 Clari 现在描述了一个 MCP
              server，让外部 AI 工具基于实时管道、 交易、账户和通话数据操作，实质上把 Clari / Salesloft 作为 Claude、ChatGPT、Copilot、Gemini 和 Agentforce
              的上下文提供方。官方 MCP 文档和 Microsoft 开发者指南支持这种模式的技术可行性：MCP 是一个基于 JSON-RPC 的标准，覆盖 hosts、clients、servers、tools 和
              resources。但 Microsoft 安全指南也划出了风险边界—— 如果企业在没有策略控制的情况下暴露 tool
              servers，就会面临工具投毒、提示注入和治理薄弱等风险。结论是，生态系统策略可信，但仍需尽调访问控制、权限范围， 以及 Clari 公开开发者界面对第三方开发者是否足够深入，而不只是依赖客户专属文档。
