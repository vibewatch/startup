      - number: '4.2'
        title: ARR 轨迹与已披露公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Clari 公开可得的 ARR 数据勾勒出一条增长曲线：2020 年为 $22.6 million，2023 年升至 $97.5 million，2024 年达到 $158.5 million——按 Latka
              截至 2025 年 11 月收集的第三方数据， 公司连续五年增长。2023 年到 2024 年新增 ARR 约 $61.0 million，同比增长 62.6%，显著高于 2025 年私有 SaaS
              公司基准研究中约 26% 的 ARR 增长中位数，说明 Clari 可能受益于 Groove 整合和企业客户增购动作。按 2022 年至 2024 年计算，两年 CAGR 约为 38%，即使 SaaS
              增长整体放缓， 动能仍然持续。2025 年 12 月与 Salesloft 合并后，收入基数发生实质变化。Forrester 2025 年 8 月分析师简报是目前最权威的第三方估计，将合并后实体 ARR 定在约
              $450 million；这意味着 Salesloft 为合并贡献了约 $290 million ARR，几乎让 Clari 2024 年独立运行率翻倍。合并后实体称， 平台管理 5,000 多家组织的 $10
              trillion 年度客户收入；这衡量的是平台活动广度，不是 Clari 自身披露收入。合并前 Clari 服务约 1,500 家企业客户；按 2025 年 12 月合并完成材料，合并后实体在全球服务 5,000
              多家组织。截至 2026 年 6 月报告运行日，尚未找到合并后实体的官方财务披露；因此，$450 million 合并 ARR 估计没有得到一手文件或官方公告验证，这是任何投资承销中的重大缺口。
