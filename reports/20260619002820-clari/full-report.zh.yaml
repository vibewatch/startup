  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Clari 应被视为对价格敏感的 salestech 平台，而不是泛泛的“好公司等于好投资”故事。公司仍有实质优势：最后披露的独立 ARR 基础在 2024 年达到 $158.5
              million，Salesloft 合并创造了声称 5,000 多客户的覆盖面，2026 年 PM Insights 二级市场快照还显示投资者仍按约 $3.41 billion
              隐含价值成交股票。问题在于，这些事实单独看都不能证明合并后公司能维持溢价倍数。$2.6 billion 官方估值来自 2022 年 1 月，早于 SaaS 倍数压缩， 早于 Groove 加 Salesloft
              的产品重叠必须被理顺，也早于 2026 年裁员和整合压力。因此，正确投资姿态是以中等信心继续研究：如果合并 ARR 真的约为 $450 million
              且留存保持健康，公司可能值得一个合理成长倍数；但合并后披露不足，无法承销买入结论，也不足以在没有新管理层证据的情况下支付高于当前二级区间上限的价格。
