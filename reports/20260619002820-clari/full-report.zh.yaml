              - CV044
      - number: '8.5'
        title: Kill 触发项与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              如果合并后基本面弱于叙事，thesis 会很快破裂。最清晰的 kill 触发项包括：经验证合并 ARR 低于约 $400 million、净留存低于 100%、Groove 与 Salesloft
              重叠被理顺时出现强制迁移流失证据，或新融资低于 2022 年 $2.6 billion 官方估值。任何一项都说明当前二级市场乐观已经跑在一级市场现实前面。 另一侧，尽调路径很直接。管理层需要提供合并 ARR
              桥、毛利率和服务收入组合、按 legacy Clari 与 legacy Salesloft 账户拆分的队列留存、当前净现金和烧钱率， 以及干净的 cap-table / preference-stack
              摘要，说明任何 tender 或二级价格如何转换为普通股价值。缺少这些材料，投资委员会只能说 Clari 具有战略相关性、
              可能定价合理，而不能说当前价格有吸引力。这也是建议保持继续研究，而不是明确做多或放弃的原因。
            claimRefs:
