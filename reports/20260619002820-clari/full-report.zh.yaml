  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合并整合、平台统一与人员风险
        blocks:
          - type: paragraph
            body: >-
              核心承销风险在于，Clari 能否足够快地合并重叠的收入编排资产，在维持客户信心的同时继续跟上 AI 竞争。公开规模披露很大：2025 年 8 月合并公告称， 合并后公司将服务 5,000 多家组织，管理 $10
              trillion 客户收入，并摄取超过 10 billion 个收入动作和 1 trillion 个数据信号。但对这种规模最有力的独立解读是谨慎， 不是庆祝。Forrester
              称这笔交易是高风险、高回报的押注，提出的产品问题多于答案；原因是 Salesloft、Groove 和 Clari 都触及相邻工作流层， 而双方都未明确补齐与 Gong 的会话智能差距。2025 年 12
              月交易完成还带来新 CEO Steve Cox，以及研发投入翻倍承诺，这让执行速度更关键： 公司同时承诺平台统一、更重 AI 投资和持续 go-to-market 连续性。2026 年 WARN 相关裁员冲击两份
              Sunnyvale 通知、涉及 172 名员工后，人员信号恶化。 这些文件本身不能证明困境，但确实表明角色整合不再停留在理论层面。按实际尽调口径，Clari
              要求投资者同时为三段转型买单：领导层交接、产品栈整合和组织重设。 如果面向客户的团队、实施资源或路线图清晰度在合并平台变得比旧栈更简单之前恶化，续约风险会先于协同收益显现而上升。
