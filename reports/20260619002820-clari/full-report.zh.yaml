  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              收入运营与收入智能市场涵盖一类软件平台：它们为企业 B2B 收入团队统一销售互动、管道预测、收入智能和 AI 引导的工作流自动化。Gartner 在 2025 年 12 月发布首份 Magic Quadrant
              时，将这一融合正式定义为 Revenue Action Orchestration（RAO），把过去三个独立采购品类——销售互动、收入智能和销售自动化（SFA）——压缩为一个 AI 原生市场定义。RAO
              边界包括预测准确性、管道分析、对话智能、交易检查、销售代表辅导和自主收入信号整合相关支出。RAO 边界之外包括：核心 CRM
              席位许可（Salesforce、HubSpot）、商业智能和分析（Tableau、Power BI）、营销自动化（Marketo、Pardot），以及 HR 或薪酬管理工具。企业采用专门 RAO
              前的现状替代品包括 CRM 原生报表、基于电子表格的预测汇总，以及碎片化单点方案，如独立通话录音工具、简单邮件序列软件和手工管道复盘节奏。RAO 与 CRM 的相邻关系很重要：Salesforce 的
              Agentforce 和 Einstein AI 覆盖层直接争夺同一预算线，而与 Salesforce CRM 的平台集成要求既是分发优势，也是每个 RAO 供应商——包括
              Clari-Salesloft——都必须处理的转换成本。Gartner 创建品类说明市场已进入早期主流采用阶段，企业买家现在可以围绕公认基准发布正式 RFP，降低早期增长所受的市场教育负担。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
