  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Revenue Action Orchestration（RAO）竞争格局包含四类清晰威胁。第一，直接 RAO 平台同业——Gong 和
              Outreach——在对话智能、销售互动和管道预测上正面竞争。第二，平台型既有厂商——Salesforce Agentforce 和 HubSpot——靠捆绑 CRM 能力竞争，利用既有安装基础关系压低独立
              RAO 定价。第三，数据智能和 ABM 供应商——ZoomInfo 和 6sense——切入账户定位和买方意图数据等相邻预算线，即使产品替代有限，也会造成预算竞争。第四，新兴 AI 原生单点方案和
              Aviso、People.ai 等专业预测工具，瞄准中型市场的具体工作流组件。Clari-Salesloft 合并于 2025 年 12 月交割，合并约 $450M ARR 和 5,000
              多家组织，明确是一次做大规模的动作，用于对抗 Gong 的 $500M 以上 ARR 平台和 Salesforce 快速扩张的 Agentforce 套件。合并实体如今是按 ARR 计算第二大的纯 RAO
              平台，仅次于 Gong。Steve Cox 在合并交割时被任命为 CEO，此前没有 Clari 任职经历，正在推进两套重叠平台的整合；Forrester
              认为这一过程存在显著产品重叠风险，并称“问题多于答案”。Clari 的长期竞争位置取决于，合并后的数据语料和执行整合能否在 Salesforce 捆绑和 Gong 能力扩张中和预测溢价前，转化为持久差异化。
