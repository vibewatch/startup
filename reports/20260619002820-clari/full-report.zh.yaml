      - number: '8.3'
        title: 可比公司组与相对定位
        blocks:
          - type: paragraph
            body: >-
              给 Clari 估值最有用的方法，是把它夹在增速更快的溢价同业和被压缩的私有市场落后者之间，而不是强行找一个虚假的一对一公开可比公司。Gong 是最干净的高端私有基准： 2026 年它报告 ARR 超过 $500
              million，二级交易估值约 $4.5 billion，意味着即使从 2021 年 $7.25 billion 一级估值重置后，仍约为 9.0x ARR。Outreach 展示了另一端：PM
              Insights、Sacra 和 Premier Alternatives 都指向 2026 年约 $300 million 估值，对应约 $250 million 的 2023 年 ARR，只有约 1.2x
              ARR。Clari 位于两者之间。按合并 ARR 计算，它比 Gong 便宜，但远高于被压缩的 Outreach； 对一个有真实规模但整合风险未解的资产而言，这在方向上合理。Salesloft 2021 年
              $2.3 billion 私有化估值和 Seismic 的二级市场估值标记仍值得注意， 但两者都不能提供干净的 2026 年收入倍数，因此只是背景锚，而非主要定价证据。HubSpot 和 Salesforce
              更像战略天花板可比对象，不是定价可比对象， 因为它们是公开、多元化、流动性强的公司，产品套件宽得多，不透明度也低得多。
            claimRefs:
