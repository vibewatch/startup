      - number: '8.4'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              熊情景假设，合并后公司无法在产品简化过程中稳住客户，交叉销售表现不佳，且真实审计后的收入桥显示合并 ARR 显著低于 Forrester 约 $450 million 估计。 在这种结果下，Clari
              可能重估到私有 salestech 区间低端，约 $2.0-$2.6 billion，或约 4.4x-5.8x 合并 ARR。基准情景假设合并 ARR 估计大体正确，
              没有出现大规模强制迁移流失，且管理层能证明留存稳定、利润率具备软件属性；这支持约 $3.0-$3.6 billion，或约 6.7x-8.0x ARR，覆盖 PM Insights 二级市场估值标记。
              牛情景要求证据显示 Salesloft 合并在商业上有效，而不仅是叙事有效：合并 ARR 走向或超过 $500 million，真实交叉销售出现，整合纪律足以支撑接近 Gong 2026
              年二级市场基准的倍数。在这种情况下，$4.0-$4.7 billion 区间，或约 8.9x-10.4x 合并 ARR，才变得可支撑。没有管理层级别的合并后财务披露， 这些情景都不能上调为可承销入场价。
            claimRefs:
              - CV006
              - CV012
              - CV021
