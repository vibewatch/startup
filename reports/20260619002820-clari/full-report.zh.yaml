      - number: '3.3'
        title: 平台型既有厂商：Salesforce Agentforce 与 HubSpot
        blocks:
          - type: paragraph
            body: >-
              Salesforce 是对 Clari 预测溢价构成最结构性威胁的竞争力量。Agentforce ARR 在 FY2026（截至 2026 年 1 月的财年）达到约 $800M，同比增长
              169%；自发布以来已成交 29,000 多笔交易，FY2026 Q4 预订中 60% 来自既有客户扩张，说明 Salesforce 正在转化庞大的 CRM 安装基础，而不是赢得净新
              logo。Salesforce FY2026 总收入为 $41.5B，同比增长 10%，剩余履约义务达到 $72.4B，使 Salesforce 具备持续激进捆绑的财务规模。到 FY2026
              末，Agentforce 与 Data Cloud 合计达到 $2.9B ARR，同比增至三倍以上，公司交付 24 亿个 agentic work units（AWUs）——由 AI 自主完成的离散任务——显示
              Salesforce 已从分析转向执行。Salesforce 的“Agentic Enterprise”叙事把 Agentforce 定位为每个现有 Salesforce Sales Cloud 部署的原生 AI
              执行层，意味着任何已为 Salesforce CRM 付费的企业，都可以把预测、管道分析和收入智能 agent 作为增量 upsell 激活，从而消除独立 Clari 许可。这种捆绑动态——既有 CRM
              订阅者以零增量许可成本获得可比功能——是对 Clari 预测价值主张最高的结构性威胁。Clari 的反主张是，多来源信号摄取和 Salesloft
              互动数据能带来更高准确性，但该主张取决于客户是否愿意维持两个企业平台。HubSpot 通过 2026 年春季 AI 大改进入收入智能讨论，新增 AI 驱动预测、管道评分、对话智能，以及按每条线索 $1 定价的
              Prospecting Agent，与 Clari 按席位 $200–$310 的定价形成消费型定价对比。HubSpot FY2025 收入 $3.1B，客户基础 288,706 家，分发能力强大；不过其 RAO
              能力仍偏向中型市场买方，而不是 Clari 占优的复杂、多区域企业部署。
            claimRefs:
              - CP014
              - CP015
