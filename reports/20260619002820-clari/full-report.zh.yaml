      - number: '5.2'
        title: 架构、数据模型与集成界面
        blocks:
          - type: paragraph
            body: >-
              公开架构故事围绕 Revenue Context 展开：Clari 称其捕获人工活动和系统生成活动，保留谁在何时做了什么，并用这份共享上下文指导人员和 AI
              agents。支撑这个故事的技术界面比营销文案更具体。公开 Clari API 参考文档列明了基于 token 的认证、异步导出和导入任务、forecast-tab 导出、
              审计事件、面向合作伙伴的数据摄取端点，以及用于邮件、会议和文件的活动导出 API。这说明其真实运营模型围绕几件事搭建：把运营数据从 Clari 拉出，
              把缺失账户或机会数据推回去，并让合作伙伴在没有直接数据库访问的情况下扩展平台。Groove-in-Copilot 知识文章补充了一个重要运营细节：部分工作流连接并非原生魔法， 而依赖管理员配置的 API
              keys、API secrets 和产品权限。2026 年，Clari 还把平台与 Salesloft 绑得更紧，让管理者可以在 Forecast、Inspect 和 Copilot 界面创建任务并发送 AI
              邮件。好处是工作流更闭环；风险是平台越来越依赖相邻系统的健康度，例如 Salesforce、Zoom、邮件 / 日历提供商，以及新合并的 Salesloft 执行层。
