      - number: '2.5'
        title: 采用障碍与市场约束
        blocks:
          - type: paragraph
            body: >-
              尽管增长驱动因素强劲，RevOps 市场仍面临显著结构性约束，压低近期渗透速度并压缩可触达 SOM。最系统性的威胁是 AI agent 对按席位 SaaS 许可模式的冲击：能够执行多步骤收入工作流的 AI
              agent 会减少所需人工席位数，直接压迫按席位平台的 ARR。多家市场分析机构记录称，2026 年初，投资人给这一风险定价，导致 SaaS 市值蒸发 $1T–$2T，SaaS 远期 EV/收入倍数首次低于
              S&P 500 平均水平。2026 年一项覆盖 2,000 名商业领导者的调查显示，数据隐私担忧（34%）和 AI 可解释性不足（30%）是企业 RevOps 采用 AI 的主要障碍；Clari
              必须用透明的模型文档和治理功能解决这些障碍，才能维持企业采购审批。企业 SaaS 许可浪费同样严重：36% 许可未被使用，代表每年全球超过 $100B 的浪费，这给 CFO
              带来主动整合或削减平台、而非新增平台的压力。深度 Salesforce CRM 集成带来的转换成本是一把双刃剑：它保护现有 Clari 客户不易流失，但也让新 logo
              部署时必须重新集成数据管道、用户权限和自定义对象，增加落地摩擦。宏观经济环境进一步构成约束：Forrester 的 2026 年预算规划研究发现，经济不确定性持续时，领导者更加谨慎，即使 AI 预算受保护，酌情
              RevOps 支出也会接受成本优化审查。对 Clari 而言，平台定价为每用户每月 $200–$310，处于企业 SaaS 价格顶端；若低成本 AI 原生进入者以结果计费或按动作计费替代席位许可，Clari
              可能面对性价比挑战。
