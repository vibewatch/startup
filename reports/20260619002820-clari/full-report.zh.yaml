        - 约 $300M；约 1.2x ARR
        - 最好的受压 private salestech 下行可比
        - ARR 分母更旧，业务组合不同
      - - Salesloft 历史控制权价值
        - 仅作独立估值锚
        - 2021 年 Vista take-private 约 $2.3B；留存来源不足以支撑倍数
        - 有助于记住，合并一半资产曾经带有独角兽控制权价值
        - 陈旧，且不是干净的 2026 倍数
