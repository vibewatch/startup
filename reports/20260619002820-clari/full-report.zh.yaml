      - number: '3.5'
        title: 定价姿态与分发对比
        blocks:
          - type: paragraph
            body: >-
              RAO 品类定价跨度很大，从 HubSpot 每席每月 $150，到 Clari 每用户每月 $200–$310，以及 Gong 等价的 $200–$250 全套件档位。按标价看，Clari 与 Gong
              是同档对手；两家公司都不公布官方价格，均需要报价式谈判、多年合同和显著 onboarding 投入。Clari 报告的平均企业年支出约 $362,484，Gong 100 用户首年企业成本超过
              $194,000，两者都把平台牢牢放在战略采购范围内，转换决策谨慎但不频繁。关键竞争差异在分发能力，而不是标价。Salesforce 通过 150,000 多个 CRM
              关系和几乎触达每个企业买家的联合销售伙伴网络分发；HubSpot 借助 288,706 个客户开展 inbound 和产品驱动增长；Gong 通过直接企业销售动作扩张，且多产品渗透率达 50%。Clari
              的主要分发优势一直是深度 Salesforce CRM 集成，以及与高增长 SaaS CRO 的早期关系；但 Salesforce 将 Agentforce 直接捆绑，令既有 Salesforce
              客户不再关心增量定价，从而正面削弱这一优势。合并后的 Clari-Salesloft 客户基础超过 5,000 家组织，代表显著交叉销售机会——Salesloft 互动客户是潜在 Clari 预测 upsell
              对象——但兑现机会需要新管理团队在 172 名合并后裁员背景下顺畅完成整合执行。
