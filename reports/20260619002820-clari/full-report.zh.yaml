      - - Gartner RAO 品类正式化（2025 年 12 月）
        - 驱动
        - 立即（2026 年及以后）
        - 形成正式 RFP 模板，降低市场教育成本；企业买方现在可以对标供应商
        - 企业从点状解决方案堆栈升级到完整 RAO 平台的速度有多快？
      - - SaaS 工具整合 / 集成疲劳
        - 驱动
        - 2026–2028
        - 收入技术栈中位数从 8+ 个工具缩到约 5.2 个；平台相对点状解决方案受益
        - Clari-Salesloft 会赢下整合型交易，还是输给 Gong 或 Salesforce 套件捆绑？
      - - 已验证的企业 ROI 证据（Forrester TEI）
        - 驱动
        - 当前
        - 三年 $96.2M 价值 / 398% ROI 支撑 CFO 审批，采购推进更快
        - 新客户采购中是否引用 Forrester TEI 研究？该研究是否为 2026 年合并实体刷新？
      - - AI 智能体冲击按席位 SaaS 模式
        - 约束
        - 2025–2028（加速）
        - AI 智能体减少人工席位需求；若定价模式不演进，每客户 ARR 会被侵蚀
        - Clari-Salesloft 是否已宣布按结果或按智能体动作计费，以守住每账户收入？
      - - Salesforce CRM 存量带来的切换成本
        - 约束
        - 长期结构性
        - 必须深度集成 Salesforce，增加部署摩擦，拖慢新 logo 获取周期
        - 有多少比例的 Clari 客户面对 Salesforce 作为共同供应商带来的双供应商复杂性？
      - - 数据隐私与 AI 信任门槛
        - 约束
        - 2025–2026（活跃）
        - 2026 年 McKinsey 研究显示，34% 提到隐私，30% 提到 AI 可解释性缺口是采用障碍
        - Clari 是否具备可审计的可解释性功能、SOC 2 Type II 认证和 GDPR 合规？
    notes: >-
      方向（驱动 / 约束）和时间是基于 2026 年市场数据的分析师判断。驱动因素主要加速 RevOps 的广泛采用； 约束则具体压制 Clari 近期 SOM 渗透和定价模式耐久性。尽调问题仍是开放问题，需要 Clari
