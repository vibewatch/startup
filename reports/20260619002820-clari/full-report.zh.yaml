      - - 数据广度可以形成类似 Gong 叙事的持久护城河
        - 10B 次互动、1T 个信号、R&D 投入承诺翻倍
        - 产品整合停滞，数据护城河无法转化为交叉销售或留存
        - 牛市情景靠护城河变现，而不只是数据集营销
