      - number: '2.3'
        title: 买方分层与预算归属
        blocks:
          - type: paragraph
            body: >-
              企业 RevOps 和 RAO 采购集中在至少 200 名员工、拥有专门 B2B 销售团队的公司，重心落在大型企业（收入超过 $1B）和高端中型市场（收入
              $100M–$1B）账户。主要预算负责人是首席收入官或销售副总裁，他们发起采购并拥有成功标准；CFO 作为财务审批者，在授权前要求有文档化 ROI 模型，通常要求 12–18 个月内回本。顶级工具的企业
              RevOps 平台定价为每用户每月 $200–$310，100 席以上企业部署通常每年合计 $180,000–$240,000，使采购在多数组织中成为董事会层面的预算项。企业交易的采购委员会平均包含 11–20
              名利益相关者，覆盖 IT、采购、法务、销售领导层和财务；安全与合规审查会给周期增加 30–60 天。ACV 超过 $100,000 的企业 SaaS 平均交易周期为 120–270 天，超过 $500,000
              的交易接近 270 天。高增长 SaaS 公司是尤其活跃的买方群体：投资人对预测准确性和 ARR 可见性的压力，使 AI 预测从 Series B 起就成为董事会级要求。金融服务和保险公司是新兴 RevOps
              买方群体，驱动力来自监管对收入审计追踪的合规要求。技术和制造企业把 RevOps 作为数字化转型任务的一部分来采用，通常需要多区域管道整合和合作伙伴渠道追踪。预算通常来自销售技术或 GTM
              技术预算；企业基准显示，成长期公司该预算占收入 5%–8%，成熟企业占 IT 预算 4%–6%。IT 支出占收入比例从普通企业的 4%–6%，到技术行业公司的 12%–18% 不等。
