      - number: '7.5'
        title: 融资、退出压力与破题触发项
        blocks:
          - type: paragraph
            body: >-
              最后一类风险是资本市场时点。Clari 最后一次官方估值披露仍是 2022 年 1 月 Series F，超过 $2.6 billion；在已审阅来源集中，没有更晚的官方公开估值标记。 与此同时，独立收入数据指向
              2024 年独立收入约 $158.5 million，2025 年末员工约 800 人；Forrester 又把合并部分描述为可能改善最终 IPO 定位的规模动作。
              这种组合制造了真实退出压力：投资者被要求在过时估值标记上承销一家更大但更复杂的公司，而且它正处于整合期，所在品类的平台型 incumbents 正在激进捆绑 AI。 WARN
              通知加剧了敏感性，因为在市场看清合并后留存、利润率结构或协同捕获之前，成本和组织变化已经外部可见。换句话说，Clari 仍可能成为更强的规模化平台， 但路径要求多件事同时做对：路线图简化、企业续约稳定、隐私和
              AI 治理姿态干净，以及可信的下一次估值事件。因此，可投资姿态应是有条件的，而非绝对的。 如果未来 12 到 18 个月出现另一轮裁员、重大隐私或 AI
              治理发现、续约中产品混乱证据，或新融资明显低于合并后叙事隐含估值，就应把 thesis 视为破裂，而不只是延后。
