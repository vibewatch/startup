  - id: FI004
    title: 并购后资本强度与成本结构图
    type: waterfall
    layout: standard
    summary: 基于 SaaS 行业基准和已披露的并购后成本信号，估算合并后 Clari-Salesloft 实体相对于约 $450M 合并 ARR 的年度成本结构。
