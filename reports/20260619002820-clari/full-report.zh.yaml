      - number: '7.3'
        title: 产品可靠性与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Clari 的产品故事在工作流闭环时最强，但同一架构也制造了实质依赖风险。2026 年 3 月发布说明展示了有意义进展——Salesloft 侧边栏访问、一键 AI 邮件、 从 Clari 创建任务和
              Copilot 跟进动作——但也展示了集成层体验有多脆弱。同一发布中，客户被告知 Zoom 收紧了第三方访问要求，若不重新同步，Copilot 将无法加入会议、
              录制通话和生成转录。Groove-in-Copilot 文档又增加一项运营依赖：管理员必须配置 API keys 和 secrets，且只有已录制通话可进入下游工作流。 Clari 的 MSA
              把依赖关系说得很明确：第三方服务变更可能导致故障，客户侧未经授权的 CRM 变更会把性能风险转回客户。trust site 同样表示，正常运行时间数据可能反映由外部应用、
              网络或设备造成的停机。合在一起，这些来源说明 Clari 的可靠性不只是代码质量问题，而是横跨 Salesforce、Google、Zoom、Groove、Salesloft 和客户管理员的多系统协调问题。
              这一点重要，因为 Clari 把自己卖成收入执行的记录系统。如果数据捕获、通话记录或动作执行工作流变旧，产品信誉会直接在每周预测和检查节奏里受损，而不是只在外围仪表盘中受损。
              对一个卖进高风险企业运营节奏的平台而言，即使中等程度的集成脆弱性，也可能带来被放大的续约后果。
