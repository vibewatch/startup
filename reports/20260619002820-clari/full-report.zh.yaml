      - number: '6.4'
        title: 留存、满意度与耐久性信号
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据是混合的。正面看，案例研究持续把 Clari 描述为生产级记录系统：客户在每周节奏、董事会汇报、续约风险评审和经理日常检查中使用它。 评测聚合器和第三方产品页面把 Clari
              放在整体较高满意度区间，有数千条公开评论，并反复赞扬预测准确性、可视性和围绕 Salesforce 的工作流契合度。 6sense 案例尤其相关，因为它越过新 logo 预测，展示 Clari
              进入续约动作：客户成功负责人使用活动分析和 AI 评分来缓解流失，并支持净美元留存目标。 负面看，在已审阅来源中，Clari 未公开披露 NRR、GRR、logo
              churn、队列留存或平均合同期限。公开评论叙事还强调管理员复杂度、部分性能或刷新延迟投诉， 以及需要专职 RevOps
              负责人。因此，现有公开证据支持“最佳适配企业账户工作流黏性高”的判断，但还不能证明一旦涨价、产品重叠或合并后路线图变化进入续约谈判， 平均客户队列到底有多黏。
