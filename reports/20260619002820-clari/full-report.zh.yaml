      - number: '7.2'
        title: 法律、隐私与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              Clari 的法律与合规风险，今天不在于某个单一头条执法事件，而在于它选择暴露的累计界面。公司公开称其处理 CRM 数据、文件、邮件日历信息、联系人、Google 数据， 并在某些场景中处理声纹；其隐私、GDPR
              和 DPA 页面也确认跨境传输、子处理方使用、违规通知义务，以及并行的 controller / processor 角色。
              这套法律脚手架能缓释风险，但不是免责通行证。同一批文件显示，大量敏感运营数据在产品中流动；MSA 又把合法使用、账户管理和第三方系统变更的实质责任推回客户。 新的 MCP 和外部 AI
              叙事再次扩大风险边界。Salesloft 现在营销一个 MCP server，把实时管道、交易、账户和通话上下文暴露给 Claude、ChatGPT、Copilot、 Gemini 和 Agentforce
              等工具。Microsoft 和 Cloud Security Alliance 官方指南把这个设计空间视为高风险，除非每个 agent 都可观察、受治理、最小权限运行，
              并被当作不可信第三方界面；Microsoft 2026 年研究明确显示，一旦 tools 接入 agents，提示注入可能演变为远程代码执行。监管侧，EU AI Act 透明度规则将于 2026 年 8
              月生效，高风险系统义务到 2027 年仍在移动但门槛上升。即使 Clari 当前 RevOps 工作流不完全落入 Annex III 类别，该法律仍然重要，
              因为产品已经营销自动化指导、评分和代理式动作。未来若在没有记录化监督和日志的情况下扩展到就业、信贷或类似重大决策支持，合规负担会快速上升。
