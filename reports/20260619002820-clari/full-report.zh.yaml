      - number: '7.4'
        title: 竞争、商业与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Clari 现在所在市场同时在整合和商品化。一侧，Gong 称 ARR 已超过 $500 million，增速超过 55%，客户正在标准化到单一 revenue AI 平台。 另一侧，Salesforce 报告
              Agentforce ARR 为 $800 million、交易超过 29,000 笔，并从 Clari 已经依赖其 CRM 上下文的安装基础中实现扩张驱动采用。 这些披露重要，因为 Clari
              的独立评测证据已经指向定价、采购和部署摩擦。The CRO Report 称 Forecast 和 Inspect 仍是 Clari 最强模块， 但也提示 Copilot 成熟度仍在演进、重度 CRM
              定制风险，以及复杂的定价 / 续约动态。品类成熟会加剧这种压力。Clari 自身 Gartner 相关材料把 Revenue Action Orchestration 描述为一个新统一的 AI
              品类，并明确称企业在技术成为主流前有关键两年窗口。如果 Clari 执行好，这一叙事具有战略力量； 如果执行不好，同一叙事也很危险，因为它意味着差异化会迅速收窄。商业盲点是客户集中度和留存。公开材料展示了头部
              logo 和 1,500 家独立客户基础， 但已审阅公开来源没有披露头部客户收入占比、合并后 logo 重叠、合并后迁移率或 NRR /
              GRR。对于一个高价企业工作流产品，缺少这个分母意味着董事会还无法判断安装基础到底广且有韧性， 还是只是有价值但集中。在买方越来越能把 Clari 与 Gong、Salesforce、Outreach 以及单一
              RAO 框架下的捆绑 AI 功能对比的市场里，定价权和续约耐久性应被视为开放风险项， 而不是默认优势。
