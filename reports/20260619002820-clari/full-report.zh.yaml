      - number: '4.4'
        title: 单位经济与利润率画像（推断）
        blocks:
          - type: paragraph
            body: >-
              Clari 未公开披露毛利率、经营利润率、EBITDA 或 NRR。可比规模企业 SaaS 行业基准提供了推断边界： 专业服务收入很少的软件公司毛利率中位数约为 77%；当服务收入超过总收入的 15–20%
              时，混合毛利率通常更低。 Clari 2024 年 ARR 为 $158.5 million，除以约 789 名已报告员工，约等于每名员工 $201,000 ARR——低于 ARR 超过 $100 million
              的 SaaS 公司 $300,000 以上中位数，可能反映合并前扩张投入和附带的专业服务成本基础。 Clari 委托 Forrester 于 2025 年 9 月发布的 Total Economic Impact
              研究发现，一个复合企业客户三年内实现 398% ROI 和 $96.2 million 净现值，回本期不足六个月。研究把 $52.3 million 归因于客户续约率提升 20 个百分点， 把 $25.3
              million 归因于赢单率翻倍和客户支出提升 33% 带来的扩张收入；如果客户证据具有代表性，这释放了强劲底层 NRR 信号。企业 SaaS CAC 基准约为每 $1.00 新 ARR 对应 $2.00
              销售和营销支出，Clari 未确认这一比例；该基准意味着， 以 Clari 现有规模，相对于新增预订额，其 S&M 负担不轻。2025 年私有 B2B SaaS 的 NRR 中位数接近 101%，最佳公司超过
              115%；Clari 实际留存率未披露，不过其收入治理和预测定位有利于在平台采用足够深入的账户中形成较强续约黏性。
