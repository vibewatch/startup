  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Clari 运营的是模块化、按席位计费的 SaaS 订阅平台，所有标准企业部署都要求年度合同，没有月度计费选项。合并后平台由四条产品线构成：Forecast 和
              Inspect（核心收入智能）、Copilot（AI 对话智能）、Groove（来自 2023 年收购 Groove Labs 的销售互动工作流），以及新整合的 Salesloft
              互动分析套件。独立基准分析估算，Forecast 每用户每月 $100–$120，Copilot 为 $60–$110，Groove 为 $50–$80。整合所有模块的全平台在实施前基准为每用户每月
              $200–$310 以上。专业服务费在第一年增加 $15,000–$75,000，占中型市场和企业部署第一年总成本的 20%–30%。按 Latka 第三方数据，2024 年平均合同价值（ACV）约
              $105,700，确认客户基础以企业为主。Clari 采用直接、高接触的顾问式销售动作，瞄准拥有 100 名以上销售代表的组织；渠道主导或经销商驱动的 GTM
              并非重要收入动作。独立分析合并后商业动态显示，合并后客户预期续约价格每年上涨 10%–20%。领投 $225M Series F 的 Blackstone Growth 承诺在其 250 家以上被投公司中部署
              Clari，提供结构性企业渠道。实施周期从 50 用户以下团队的 6–8 周，到超过 500 用户企业部署的 12–16 周不等。
