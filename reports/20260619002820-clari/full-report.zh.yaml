      - number: '4.5'
        title: 资本充足性、烧钱信号与合并后成本动作
        blocks:
          - type: paragraph
            body: >-
              Clari 的资本充足性不透明。截至 2026 年 6 月，手头现金、月度烧钱率和跑道长度均未公开披露。最近一次确认的流动性事件是 2022 年 1 月 Series
              F，距今已超过四年，之后未发现股权或债务融资。2025 年 12 月 Salesloft 合并采用全股权结构，
              不会注入运营现金；相关整合成本，包括遣散费、平台整合和研发系统统一，在公开来源中仍未量化。公司承诺合并后研发投入翻倍， 表明新增技术支出会部分抵消重组带来的人力节省。两份 California WARN Act
              通知记录了 172 人裁员：96 名员工自 2026 年 1 月 5 日生效（通知于 2025 年 11 月 6 日提交），76 名员工自 2026 年 4 月 11 日生效（通知于 2026 年 2 月 10
              日提交），地点均为 Clari 位于 1154 Sonora Court 的 Sunnyvale 总部。第三方评论把这些裁员描述为合并后角色整合， 目标是重叠的销售、营销和工程职能。受影响的 172
              名员工约占合并后员工总数的 11–22%，具体取决于人力规模假设；这说明重组幅度显著但有边界。
              剩余现金用途、债务义务或下一轮融资触发条件均未公开披露，使资本跑道成为任何投资者承销合并后实体时最关键的未解问题之一。
