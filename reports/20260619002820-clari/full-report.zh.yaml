      - number: '2.6'
        title: Clari-Salesloft 之后的品类变化与竞争格局
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月 Gartner Magic Quadrant for Revenue Action Orchestration 建立了正式竞争框架，其中
              Clari（Leader）、Gong（Leader，Critical Capabilities 得分第 1）和 Salesloft（Visionary，现已并入 Clari）是定位最突出的三家供应商。合并后的
              Clari-Salesloft 实体声称拥有该品类最大的收入数据资产，摄取超过 100 亿个收入动作和 1 万亿个买方互动信号，使其在 AI 模型优势上具备竞争位置。然而，Gong ARR 已在 2026 年 5
              月突破 $500M，受同样的技术栈整合顺风推动，证明该品类并非赢家通吃。Salesforce 的 Agentforce AI 层到 2026 年初达到 $800M ARR，通常作为企业 Salesforce
              安装的直接覆盖层部署，而 CRM 已嵌在收入技术栈中心，这为 Salesforce 原生企业提供了低转换成本的竞争路径。品类从单点方案转向统一 RAO 平台，这一点已由企业收入技术栈中位数从 8 个以上工具缩至约
              5.2 个得到广泛确认，但该变化并非均匀利好 Clari：Outreach 将自身定位为面向收入团队的 agentic AI 平台，Gong 扩展后的平台覆盖销售互动（通过 Gong
              Engage）、预测和辅导，直接挑战 Clari-Salesloft 的合并套件。企业买家现在可以用共同的 Gartner RAO 标尺评估 Clari、Gong、Salesforce Agentforce 和
              Outreach；这一变化降低了基于品类教育的供应商差异化，把竞争转向已验证 ROI、集成深度和 AI 模型准确性。Clari-Salesloft
              合并在近期带来整合执行风险：客户报告对路线图优先级存在不确定性，2026 年加州 WARN Act 裁员 172 人，也显示关键产品统一节点上存在降本压力。
