  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Clari 将产品定位为收入编排平台，而不是单一预测工具。公开产品概览把套件分为 Capture、Inspect、Align、Copilot、Forecast、Analyze 和
              Groove；较新的收入平台叙事则把架构归为 Revenue Data、Revenue Insights、Revenue Cadences & Workflows 和 Revenue Agents。
              从客户实际工作流看，技术栈先从邮件、日历、通话、CRM 及相关系统自动捕获收入信号；再把这些信号送入交易检查、预测和分析界面；通过 Copilot 叠加会话智能和辅导；最后借助 Groove，并在 2026
              年借助更深的 Salesloft 动作，延伸到执行层。这一点重要，因为 Clari 不再只卖给董事会的预测可视化。
              它试图拿下从获客、管道检查到会后跟进的日常运营闭环。支撑这一定位的最强证据，不只是官网话术，而是官方页面和 2026 年发布说明持续把捕获、检查、 预测和销售执行连成一个工作流。主要保留意见是，一些头部 AI
              能力的市场宣传仍领先于完整生产成熟度；因此，承销时应把该套件看作已验证核心平台， AI 边界仍在扩张但不均衡，而不是今天已经完全成熟的代理式系统。
