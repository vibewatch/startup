        - 如果 stack 很重，secondary 估值可能高估普通股价值
        - 索取 cap-table waterfall 和近期 secondary memo
      - - 整合路线图
        - 产品整合里程碑、客户迁移政策和重叠理顺
        - 决定合并会获得 Gong 式溢价，还是 Outreach 式折价
        - 索取产品路线图加续约风险登记表
    notes: 这些问题是最低资料包；拿到之后，本章才能从情景分析变成可承销的投资决定。
