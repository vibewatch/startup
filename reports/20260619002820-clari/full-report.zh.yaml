      - number: '3.4'
        title: 相邻竞争者：ZoomInfo 与 6sense
        blocks:
          - type: paragraph
            body: >-
              ZoomInfo 和 6sense 切入的是与 Clari 工作流编排核心相邻的数据补全和买方意图层，造成预算竞争，而非直接产品替代。ZoomInfo 2026 年 Q1 收入为 $310.2M（同比增长
              1.5%），全年 2026 年指引下调至 $1.185B–$1.205B，反映宏观逆风和 AI 原生数据补全工具竞争加剧。截至 2026 年 Q1，ZoomInfo 有 1,900 家客户 ACV 超过
              $100,000，高端市场 ACV 同比增长 5%，过去十二个月净收入留存约 90%，期内高端市场留存超过 100%。裁员 20%
              并转向信用点定价，显示该业务正承受企业画像数据商品化带来的利润率压力。ZoomInfo 的 RevOS 平台争夺数据补全和意图信号预算，但缺少原生工作流编排；企业通常把 ZoomInfo 作为输入 Clari
              的数据源，而不是预测和管道治理层的替代品。6sense 的重叠面不同。6sense 在截至 2024 年 1 月的财年 ARR 突破 $200M，增长 40%，并以 $5.2B 估值完成 $200M Series
              E，使累计融资达到 $426M；公司增长很快，并已扩展到销售智能模块，集成 Gong Engage。不过，6sense 的核心是 account-based
              marketing（ABM）和买方意图数据，服务需求生成团队，而不是销售运营或 CRO 级预测。它与 Clari
              的竞争重叠仅限于需求生成智能功能；在管道预测或多方收入治理上不存在替代风险。更准确地说，ZoomInfo 和 6sense 都是 Clari AI 模型的数据层输入，而不是对其平台收入的生存级竞争威胁。
            claimRefs:
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
