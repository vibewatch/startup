      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Andy Byrne 与 Venkat Rangan 于 2012 年共同创办 Clari。Byrne 从创立起一直担任 CEO，直到 2025 年 12 月完成与 Salesloft
              的合并；十余年间，他是融资、客户信任和产品愿景的核心人物。Rangan 此前曾联合创办电子发现公司 Clearwell Systems，该公司于 2011 年被 Symantec 收购；他加入 Clari
              后担任首席技术官，并在合并后继续任职。本章审阅的公开记录并未将 Carlos Delatorre 识别为 Clari 联合创始人；确认的联合创始人为 Byrne 和 Rangan，这一结论与
              Tracxn、PitchBook、Clay 及公司自有新闻材料一致。2025 年 12 月 3 日，合并交割后，Steve Cox 被任命为合并后 Clari-Salesloft 实体 CEO。Cox 拥有超过
              25 年 SaaS 领导经验，曾任 Employ CEO，并在 Community Brands、Vertafore 和 Chess 担任高管。合并公司正在整合两套复杂的收入平台，领导层从创始人 CEO
              切换到外部聘任者，是一项重要尽调信号。合并后董事会治理细节尚未在公开材料中完整披露，包括哪些投资人董事占有席位，以及 Byrne 是否保留任何正式顾问角色；下一轮尽调更新应补齐这一缺口。
