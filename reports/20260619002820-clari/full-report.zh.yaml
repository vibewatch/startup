      - number: '1.3'
        title: 资本结构、投资人与估值
        blocks:
          - type: paragraph
            body: >
              Clari 在 2014 至 2022 年间披露了七轮融资，累计募资约 $510M。资本堆栈从 2014 年 4 月 Sequoia Capital 领投的 $6M Series A 开始，随后是 2014 年
              6 月 Bain Capital Ventures 与 Sequoia 共同领投的 $20M Series B。2018 年 3 月 $35M Series C（Tenaya Capital）和 2019 年
              10 月 $60M Series D（Sapphire Ventures）支撑公司完成产品成熟和早期企业级扩张。2021 年 3 月 $150M Series E 由 Silver Lake 和 Khosla
              Ventures 共同领投，Workday Ventures 在 2021 年加入延伸 Series E 批次，为公司增加了战略型企业生态维度。仅 2021 年，就有 18 家 Clari 客户完成 IPO，包括
              Confluent、UiPath、Procore 和 Samsara，证明公司在 Series E 增长期已打入高增长企业账户。资本形成在 2022 年 1 月达到顶点：Blackstone
              Growth（BXG）领投 $225M Series F，Silver Lake、Light Street Capital 和 Maverick Capital
              作为新投资人加入，并有既有股东跟投。Blackstone 宣称计划在其 250 多家被投公司中部署 Clari，这为纯财务回报增加了 go-to-market 放大器。截至 2026 年 6
              月报告日期，尚未识别到新的股权轮、可转债或更新估值披露，$2.6B 数字已陈旧超过四年，任何投资决策前都需要重新估值。
