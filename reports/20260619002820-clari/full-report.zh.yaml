  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Clari 披露的客户基础更偏大型、运营成熟的 B2B 收入组织，而不是广泛 SMB 采用。合并前，Clari 称超过 1,500 家组织使用平台管理超过 $5 trillion 收入；2025 年 8 月和
              12 月合并公告则把合并后 Clari-Salesloft 覆盖面提升到 5,000 多家组织、约 $10 trillion 管理收入。最强公开参考客户来自企业软件、网络安全、IT 和复杂服务运营商，例如
              Okta、Databricks、6sense、Certinia、Alight、Alteryx、 Unity、BirchStreet 和 Tipalti。这一模式与第三方评测覆盖一致：当 CRO、CFO 或
              RevOps 负责人需要跨 50 多名销售代表做多层级预测汇总、 检查节奏和规范化销售工作流时，Clari 最适合。实践中，买方通常是 CRO 或 RevOps 负责人，日常用户是一线经理和销售，付款方是企业
              GTM 预算。 这种分层偏向对大客户是优势，因为 Clari 深嵌进领导层运营仪式；但它也意味着，已披露客户证据集中在采购周期更长、实施需求更重、续约谈判规模更大的账户。
