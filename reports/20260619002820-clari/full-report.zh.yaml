      - number: '3.6'
        title: 护城河耐久性、转换成本与赢输动态
        blocks:
          - type: paragraph
            body: >-
              Clari 的竞争护城河建立在三根相互强化的支柱上：数据规模、预测准确性和深度工作流集成。合并后的 Clari-Salesloft 数据集包含超过 100 亿次收入互动和 1 万亿个数据信号，形成专有训练语料；纯
              AI 平台或 CRM 既有厂商若没有十年级别的可比企业部署，很难复制。Clari 客户平均实现 95%–98% 的预测准确性，并由 Forrester 2025 年 Total Economic Impact
              研究外部验证，后者报告企业价值 $96.2M、三年 ROI 398%；这些指标即使面对 Salesforce 捆绑压力，也能支撑 CFO 为每席每月 $200–$310 的价格点给出合理性。2026 年 4 月
              MCP server 发布，使 ChatGPT 和 Microsoft Copilot 等外部 AI 工具能够访问实时 Clari 收入信号，把护城河外延到更广的企业 AI 生态。Constellation
              Research 指出，整合平台和 MCP server 让收入数据成为“更广生态的基础”，把转换成本从应用层推向更深处。若买方首要需求是企业级预测准确性和董事会层面的收入治理，赢输动态有利于
              Clari；若主要使用场景是对话智能和销售代表辅导，则有利于 Gong。Forrester 合并分析中的不利信号——Clari-Salesloft 整合引发产品重叠担忧，且两家公司都未弥合与 Gong
              的对话智能差距——带来执行风险；若 2026–2027 年整合摩擦在客户续约中浮现，竞争替换窗口可能打开。2026 年初 172 名 WARN-Act
              裁员影响运营、工程和客户成功中的重叠岗位，显示复杂整合在一位没有 Clari 既往任职经历的首次 CEO 领导下会带来组织扰动。Gong 增长轨迹正在加速——两个季度新增 $1M
              以上客户数超过此前六个季度总和——这是最可操作的不利信号，说明 Clari 近期在竞争性企业交易中面临真实替换风险。
