      - number: '5.5'
        title: 安全、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              Clari 为企业软件披露了相对较强的合规界面：安全页面发布了 SOC 2 Type II、ISO 27001、ISO 27701、CSA、ADA 和 GDPR 声明，并提供公开状态站点和漏洞披露措辞。
              这对采购是正面信号。更重要的承销问题在工作流边缘的运营韧性，因为 Clari 依赖外部系统和 bots。2026 年有两个官方例子能说明这一点。第一，3 月发布说明提醒， Zoom 安全变更会让 Copilot
              bots 无法加入或录制会议，除非客户重新同步 Zoom。第二，公开 trust site 记录了 2026 年 6 月 Salesforce 集成问题， 部分客户必须重新认证 Copilot
              Salesforce 连接才能恢复功能。这些事件并不意味着产品结构性失败，但说明关键连接器改变行为或认证状态时，Clari 用户体验会降级。 独立用户反馈又增加了一层谨慎：Gartner peer
              内容中有一条评价称赞支持，同时表示工具崩溃次数高于预期。综合来看，Clari 的安全和合规姿态足以进入采购流程； 但日常可靠性仍与连接器健康、管理员操作规范，以及越来越相互依赖的模块稳定性绑定。
