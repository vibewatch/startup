      - number: '1.5'
        title: 不利事件、合并后风险与整合挑战
        blocks:
          - type: paragraph
            body: >
              合并后阶段出现了重大不利信号，尽调必须把这些信号视为当前问题，而不是历史噪音。加州两份 WARN Act 备案显示，2026 年 1 月 5 日生效裁员 96 人，2026 年 4 月 11 日生效再裁 76
              人，Santa Clara County 合计 172 名员工受影响。两份备案均称原因为裁员而非关闭设施，与合并后 Clari 和 Salesloft 劳动力中重叠岗位整合相一致。裁员叠加 2025 年 12 月
              CEO 从创始人 Andy Byrne 切换为 Steve Cox，使合并实体进入首个完整经营年度时面临可量化的关键人物和执行风险。Clari 还承受来自 Gong
              的竞争压力，后者在对话智能中根基很深；Salesforce 和其他大型 CRM 平台正在扩展到收入编排；AI 原生初创公司也在打造专门的预测工具，可能侵蚀可触达的钱包份额。最后一次公开披露估值为 2022 年 1
              月的 $2.6B，发生在 Salesloft 合并、2026 年 WARN Act 裁员，以及 2022–2026 年 SaaS
              倍数整体压缩之前。任何给合并实体定价的新投资人，都必须把四年估值缺口与变化后的成本结构、整合负担，以及多个资本充足的竞争对手瞄准同一企业收入运营预算的市场格局一起重估。
