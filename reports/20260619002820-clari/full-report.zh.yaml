      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 正确分母是合并 ARR，不是独立 ARR
            body: >-
              使用 2024 年独立 ARR，会让 2022 年官方估值和 2026 年 PM Insights 二级市场估值都显得很贵。使用经济上更相关的合并后 ARR 估计，会把倍数压缩到可辩护但仍有争议的区间。
              分母选择就是整个估值争论。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
          - type: callout
            title: 二级市场乐观不等于一级市场价格发现
            body: PM Insights 估值标记有用，但不能替代审计轮、tender memorandum 或管理层背书的收入桥。如果新融资低于 2022 年估值标记，当前二级市场叙事会立即失去很多支撑。
            calloutType: risk
            claimRefs:
              - CV012
              - CV035
              - CV043
          - type: callout
            title: 整合风险是 Clari 不应按 Gong 溢价交易的原因
            body: Gong 目前的高估值倍数，靠的是 2026 年 ARR 可见、增长持续提速，以及并购噪音更少。 Clari 未来或许也配得上类似档位，但当下重叠业务、裁员和披露缺口仍要求给出折价。
            calloutType: risk
            claimRefs:
              - CV019
              - CV021
              - CV030
              - CV033
