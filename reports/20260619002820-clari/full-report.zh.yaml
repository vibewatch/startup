      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Clari 的财务画像同时呈现出证据充分的收入增长故事和重大的不透明风险；没有管理层账户访问权限，就无法正式承销。2024 年独立 ARR 为 $158.5 million，同比增长
              62.6%，按同业基准相当强劲；合并后 ARR 估计约 $450 million，意味着其在企业收入编排市场已有相当位置。 收入质量指标也偏正面：年度合同、偏企业客户的 $105,700 ACV，以及
              Forrester TEI 发现企业客户 ROI 达 398%，都指向黏性强、价值高的订阅基础。 但 $2.6 billion 估值来自 2022 年 1 月，早于 Salesloft 合并、2026 年
              WARN Act 裁员，以及 SaaS 倍数压缩——典型成长期私有 SaaS 估值从 15–20x ARR 降至 5–8x ARR。用过时的 $2.6 billion 对照 $450 million 合并
              ARR，EV/ARR 约为 5.8x；在当前市场条件下不算激进， 但估值信息已经过时四年。合并后实体的收入质量难以确认：毛利率、经营利润率、NRR、Salesloft 独立 P&L 或合并烧钱率均未公开披露。
              产品整合在交易完成六个月后仍被描述为未完成，带来执行风险和近期潜在客户流失。任何投资决策都需要审计财务、队列分析和 WARN 后员工快照， 才能在任何估值下承销合并后实体。
