      - number: '6.5'
        title: 扩张、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              客户侧最大上行来自合并后 Clari-Salesloft 安装基础内的 land-and-expand。管理层叙事是连贯的：Salesloft 负责漏斗顶部创建，Clari 负责转化、检查和预测纪律，
              合并平台还能进一步延伸到续约、辅导和 AI 引导执行。只要产品路线图保持连贯，这一架构就能在 5,000 多家组织中创造真实交叉销售潜力。主要反向力量是采购摩擦。 第三方买家指南称，Clari
              仍然昂贵、价格不透明、管理投入重，实施常常需要数周，续约有时会出现显著涨幅。指南还提醒，客户第一年经常过度购买席位或模块， 随后花几个季度梳理实际使用范围。由于 Clari 看起来最适合拥有专职 RevOps
              的大型企业，收入集中度可能偏向数量更少、规模更大、审批链更长且续约谈判力更强的账户。 公开来源未披露头部客户集中度或按队列划分的收入占比，因此这仍是未解承销风险，也与多个目标具名账户的 logo
              证据缺口并列存在。
