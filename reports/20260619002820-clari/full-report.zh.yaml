          detail: 行业基准：每 $1 新 ARR 约需 $2 S&M；Clari 具体数字未披露。
          tone: warning
        - id: expansion
          label: 续约时模块扩张
          detail: Copilot 和 Groove 加购；Forrester TEI 显示客户支出 +33%，赢单率翻倍。
          tone: positive
        - id: ltv
          label: 长期 LTV
          detail: 若 NRR > 100%，LTV 较高；Forrester TEI 综合企业样本显示，每家企业 3 年 NPV 为 $96.2M。
          tone: positive
    edges:
