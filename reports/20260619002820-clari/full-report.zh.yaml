      - number: '1.4'
        title: 规模、客户、产品与里程碑
        blocks:
          - type: paragraph
            body: >
              Salesloft 合并前，Clari 的商业规模已证明它是一家成熟的企业软件公司。按 Latka 数据，Clari 2024 年报告 ARR 为 $158.5M，高于 2023 年的 $97.5M；员工约
              789 人，企业客户 1,500 家。2023 年 8 月，Clari 收购销售互动平台
              Groove，将产品覆盖从预测延伸到工作流自动化和邮件序列。具名企业客户横跨多个垂直领域，包括技术（Okta、Snowflake、Dropbox）、软件（Adobe、Workday）和多元企业（IBM、3M、Zoom、Shopify、Qualtrics、RingCentral）。Clari
              的 RevDB 专有数据层汇聚 CRM、电子邮件、日历和通话转录信号；合并后的 Clari-Salesloft 平台摄取超过 100 亿个收入动作和 1 万亿个买方互动信号，形成专有数据集，用于训练 AI
              预测和管道分析模型。2025 年 8 月宣布与 Salesloft 合并，Andy Byrne 将其描述为打造 Autonomous Revenue System 和 Revenue AI 飞轮；交易于 2025
              年 12 月交割，将合并实体提升到 5,000 多家组织、每年管理 $10T 收入的规模。Forrester 2025 年 Total Economic Impact 研究独立报告称，Clari
              在三年内为企业客户交付 $96.2M 价值和 398% ROI，支撑了产品影响力主张。Clari 还入选 2025 Gartner Magic Quadrant for Revenue Action
              Orchestration 的 Leader，显示合并完成前已获得品类认可。下方里程碑表是 Clari 从创立到本报告日期的单一记录时间线。
