      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              多个分析师视角共同确认，收入运营与收入智能品类的 TAM 估算逻辑一致，但区间较宽。最窄且可辩护的 TAM 聚焦收入智能和预测软件，基于 Verified Market Reports 与
              WorldMetrics 的汇总估算，2026 年全球规模为 $4B–$5B，并以 13%–15% CAGR 增长，到 2030 年达到 $10B–$12B。若纳入所有销售和营销 AI 软件，2030 年 TAM
              会被推高到 $240B（MarketsandMarkets），但该数字把营销 AI 支出与纯 RevOps 混在一起，对衡量 Clari 核心机会用途有限。第三个企业 AI 视角（Mordor
              Intelligence）将 2026 年市场放在 $114.87B，CAGR 为 18.91%，但覆盖范围同样远大于收入编排。本分析采用最适用的 TAM 锚点：2026 年收入智能与编排市场
              $4B–$5B，并向 2030 年 $10B–$12B 扩张。SAM 更难拆分：Gartner 的 RAO Hype Cycle 将市场描述为已进入早期主流采用，并指出到 2027
              年前有关键的两年采用窗口，但没有给出服务型企业细分市场的明确金额。用 Clari-Salesloft 披露的 2024 年独立口径 ARR $158.5M，以及公开可得的竞争对手 ARR 锚点（Gong
              $500M ARR、Salesforce Einstein 层）保守估算，企业级 RAO 平台——面向员工 200 人以上、GTM 动作复杂且多产品的公司——2026 年 SAM 约为 $2B–$3B。合并后
              Clari-Salesloft 实体的 SOM 根据其 2024 年 ARR 基础 $158.5M 和合并后 5,000 多家客户足迹推断，近期可触达收入约为 $0.8B–$1.2B，反映当前对 SAM 约
              15%–20% 的渗透率。由于该领域没有供应商公开分部收入，且分析师定义范围差异很大，所有规模估算都存在重大不确定性。
