              Clari 的估值计算会因使用哪个分母而彻底改变。按独立口径，2022 年 1 月 Series F 超过 $2.6 billion 的估值标记，除以 GetLatka 的 2024 年 $158.5
              million ARR，得到约 16.4x ARR；2026 年 4 月 PM Insights 约 $3.41 billion 的二级市场估值，则意味着约 21.5x
              ARR。这些数字看起来偏高，但分析上也不完整，因为它们忽略了 2025 年 12 月 Salesloft 合并。如果 Forrester 约 $450 million 的合并 ARR 估计方向正确，过时的
              $2.6 billion 官方估值压缩到约 5.8x 合并 ARR，PM Insights 二级信号压缩到约 7.6x 合并 ARR。合并口径分母为一个有规模、
              但有整合风险的收入编排资产提供了更可信的定价框架。关键不是哪个数字“正确”，而是当前投资 case 取决于合并 ARR 估计和合并后收入质量能否验证。 在此之前，二级市场估值只是方向性数据点，不是基本价值证明。
