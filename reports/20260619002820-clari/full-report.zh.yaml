      - number: '4.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Clari 的资本形成跨越十年：2014 年 4 月 $6 million Series A（Sequoia Capital），2014 年 6 月 $20 million Series B（Bain
              Capital Ventures 和 Sequoia），2018 年 3 月 $35 million Series C（Tenaya Capital），2019 年 10 月 $60 million Series
              D（Sapphire Ventures），以及 2021 年 3 月 $150 million Series E（Silver Lake 和 Khosla Ventures）。2022 年 1 月 Series
              F 由 Blackstone Growth（BXG）领投，金额 $225 million，确立了 $2.6 billion 投后估值， 至今仍是 Clari 最后一次公开披露估值。公开数据集把累计融资额放在
              $496 million 到 $510 million 区间；取决于数据供应商是否完全一致地计入每一轮早期融资，披露资本大约为 $506 million。2023 年 8 月，Clari 以未披露金额收购
              Groove Labs，并将 Groove 联合创始人 Chris Rothstein 和 Austin Wang 纳入公司。2025 年 12 月，Clari 与 Salesloft
              以全股权交易合并；Salesloft 此前由 Vista Equity Partners 持有。Morgan Stanley 担任 Clari 在 Salesloft 交易中的独家财务顾问。2022 年 1
              月融资完成后，未发现新的股权轮、可转债或已披露债务额度。Blackstone 承诺把 Clari 部署到 250
              多家投组公司，形成战略渠道；避免稀释性新融资的激励可能推迟了下一次资本事件，但四年空窗也让现金跑道不透明、 杠杆能力不足在进入合并后整合期时成为尽调红旗。
