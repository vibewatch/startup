      "id": "named-customer-proof",
      "title": "Named Customer Proof and Deployment Quality",
      "body": "Public customer proof is directionally strong but unevenly distributed. Okta is the clearest requested logo with a detailed production narrative: it used Clari to operationalize a balanced-pipeline methodology, enforce weekly forecast and pipeline cadences, and create a shared source of truth across the go-to-market organization. Outside the requested logo set, Clari's best public proof comes from named case studies that disclose specific production outcomes: Databricks reports better rescue rates on slipped deals and large forecasting time savings; Certinia cites faster closes and higher win rates; League describes a six-week rollout and near-immediate value; BirchStreet, Alight, Unity, Alteryx, Tipalti, and 6sense all describe Clari as embedded in daily production workflows rather than a pilot tool. By contrast, most of the remaining user-requested names—Adobe, Workday, Dropbox, Snowflake, Qualtrics, RingCentral, Zoom, and Fivetran—are supported only by roster-level mentions, customer-video listings, or third-party customer directories in the sources reviewed for this run. That is useful logo proof, but not enough to underwrite deployment depth, renewal age, or outcome durability without customer reference calls.",
