    {
      "id": "expansion-concentration-and-procurement",
      "title": "Expansion, Concentration, and Procurement Friction",
      "body": "The biggest customer-side upside is land-and-expand inside the merged Clari-Salesloft install base. Management's pitch is coherent: Salesloft handles top-of-funnel creation, Clari handles conversion, inspection, and forecast discipline, and the combined platform can extend further into renewals, coaching, and AI-guided execution. That architecture creates real cross-sell potential across 5,000-plus organizations if the product roadmap stays coherent. The primary counterweight is procurement friction. Third-party buyer guides say Clari remains expensive, opaque to price, and labor-intensive to administer, with implementation often taking weeks and renewals sometimes carrying meaningful increases. They also warn that customers frequently overbuy seats or modules in year one and then spend quarters rationalizing what they actually use. Because Clari appears best suited to large enterprises with dedicated RevOps, revenue concentration likely skews toward fewer, larger accounts with long approval chains and stronger negotiating leverage at renewal. Public sources do not disclose top-customer concentration or revenue share by cohort, so this remains an unresolved underwriting risk alongside the logo-proof gap for several requested named accounts.",
