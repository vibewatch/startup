    {
      "id": "retention-satisfaction-and-durability",
      "title": "Retention, Satisfaction, and Durability Signals",
      "body": "Public durability evidence is mixed. On the positive side, the case studies consistently describe Clari as a production system of record: customers use it in weekly cadences, board reporting, renewal risk reviews, and day-to-day manager inspection. Review aggregators and third-party product pages place Clari in a generally high-satisfaction band, with thousands of public reviews and repeated praise for forecasting accuracy, visibility, and Salesforce-centric workflow fit. The 6sense story is especially relevant because it moves beyond new-logo forecasting and shows Clari in the renewal motion, where customer success leaders use activity analytics and AI scoring to mitigate churn and support net dollar retention goals. The negative side is that Clari does not publicly disclose NRR, GRR, logo churn, cohort retention, or average contract duration in the sources reviewed. The public review narrative also highlights admin complexity, some performance or refresh-lag complaints, and the need for dedicated RevOps ownership. As a result, the current public evidence supports a thesis of high workflow stickiness for best-fit enterprise accounts, but it does not yet prove how sticky the average customer cohort really is once price increases, product overlap, or post-merger roadmap changes enter renewal conversations.",
