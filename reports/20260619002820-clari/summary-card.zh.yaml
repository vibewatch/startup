  topStrengths:
    - Clari 已有真实企业级规模，独立 2024 ARR 约 $158.5 million；合并后平台覆盖超过 5,000 家组织。
    - 合并后的 Clari-Salesloft 栈覆盖预测、交易检查、conversation intelligence、销售互动和 AI 工作流自动化，并共享同一套收入数据。
    - 大型企业客户证明和分析师品类认可显示，Clari 在 Revenue Action Orchestration 中占据可信领导位，而不是小众 point solution。
    - 2026 年二级市场需求说明，即便 SaaS 倍数整体压缩，投资人仍给该资产赋予有意义价值。
  topRisks:
    - 公开披露仍缺少经审计合并后 ARR、NRR、毛利率、烧钱速度、净现金，以及独立 Clari 经济性到合并实体之间的清晰桥接。
    - Salesloft 合并带来了领导层变化、产品重叠，以及 2026 年 California WARN notice 下的 172 人裁员，集成和执行风险因此上升。
    - Clari 面对 Gong、Salesforce 和其他 revenue-AI 套件等资本更厚或披露更快的对手，定价可能被压缩，差异化也可能收窄。
    - 随着 Clari 在 CRM、通信和外部 AI 界面上暴露更丰富客户数据与 agentic 工作流，隐私、AI 治理和多系统依赖风险上升。
  unresolvedGaps:
    - 合并后 Clari-Salesloft 实体的经审计合并 ARR、收入结构、毛利率、经营烧钱、净现金和留存指标。
    - 客户集中度、合并后 logo 重叠、迁移流失，以及 legacy Clari 与 legacy Salesloft 账户的队列留存。
    - 当前 cap table、优先权栈、二级交易条款，以及任何 2026 估值信号能否干净传导到普通股价值。
    - 产品理顺路线图，Clari、Groove 和 Salesloft 模块之间的重叠退役计划，以及平台简化是在改善而非伤害续约的证据。
