    {
      "id": "kill-triggers-diligence-asks",
      "title": "Kill Triggers and Final Diligence Asks",
      "body": "The thesis breaks quickly if the post-merger fundamentals prove weaker than the narrative. The clearest kill triggers are a verified combined ARR below about $400 million, net retention below 100%, evidence of forced-migration churn as Groove and Salesloft overlaps are rationalized, or a new financing below the 2022 $2.6 billion official mark. Any of those would suggest the current secondary optimism is outrunning primary-market reality. On the other side, the diligence path is straightforward. Management needs to provide a combined ARR bridge, gross margin and services mix, cohort retention by legacy Clari versus legacy Salesloft accounts, current net cash and burn, and a clean cap-table / preference-stack summary explaining how any tender or secondary price translates into common-equity value. Without those items the investment committee can only say that Clari is strategically relevant and possibly fairly priced, not that the current price is attractive. That is why the recommendation remains research-more rather than a firm long or pass.",
