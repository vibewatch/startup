    {
      "id": "comparables-relative-positioning",
      "title": "Comparable Set and Relative Positioning",
      "body": "The most useful way to value Clari is to bracket it between faster-growing premium peers and compressed private-market laggards rather than force a false one-to-one public comp. Gong is the cleanest high-end private benchmark: in 2026 it reported ARR above $500 million and secondary trading around a $4.5 billion valuation, implying roughly 9.0x ARR even after private-market reset from its 2021 $7.25 billion primary mark. Outreach illustrates the opposite extreme: PM Insights, Sacra, and Premier Alternatives all point to a 2026 value near $300 million against roughly $250 million of 2023 ARR, or only about 1.2x ARR. Clari sits between those poles. On combined ARR math it is cheaper than Gong but dramatically richer than compressed Outreach, which feels directionally fair for an asset with real scale but unresolved integration risk. Salesloft's 2021 $2.3 billion take-private valuation and Seismic's secondary-market marks are still worth noting, but neither provides a clean 2026 revenue multiple, so they are context anchors rather than primary pricing evidence. HubSpot and Salesforce matter more as strategic ceiling comps than pricing comps because they are public, diversified, liquid businesses with much broader product suites and lower opacity.",
