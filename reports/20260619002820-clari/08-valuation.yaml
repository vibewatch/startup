    {
      "id": "valuation-anchors-multiple-math",
      "title": "Valuation Anchors and Revenue-Multiple Math",
      "body": "Clari's valuation math changes radically depending on which denominator is used. On a standalone basis, the January 2022 Series F mark of more than $2.6 billion divided by GetLatka's $158.5 million 2024 ARR yields approximately 16.4x ARR, while the April 2026 PM Insights secondary mark of roughly $3.41 billion implies about 21.5x ARR. Those figures look stretched, but they are also analytically incomplete because they ignore the December 2025 Salesloft merger. If Forrester's approximately $450 million combined ARR estimate is directionally right, the stale $2.6 billion official mark compresses to roughly 5.8x combined ARR and the PM Insights secondary signal compresses to about 7.6x combined ARR. That combined denominator produces a much more plausible pricing frame for a scaled but integration-risky revenue orchestration asset. The key point is not that one number is 'correct'; it is that the current investment case depends on whether the combined ARR estimate and post-merger quality of revenue can be verified. Until then, the secondary mark is a directional data point, not proof of fundamental value.",
