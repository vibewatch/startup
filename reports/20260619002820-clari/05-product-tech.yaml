    {
      "id": "release-velocity-and-maturity",
      "title": "Release Velocity and Module Maturity",
      "body": "The release cadence suggests an active product organization, but also makes clear that the platform is still being unified after the Salesloft combination. January 2025 release notes were still previewing future cross-platform integrations. By February 2026, Clari had shipped improved faceted search and Groove any-step automated actions, which are practical workflow enhancements rather than category-changing architecture. By March 2026, the releases became more integration-heavy: a Salesloft side panel inside Clari, AI-generated Salesloft emails, task creation from Clari, Copilot-to-Salesloft follow-up emails, and task creation from smart action items. Those are meaningful because they tighten the loop between insights and seller execution, but they also show that the merged product is still being stitched together via connectors, quick-start guides, and admin setup work. The maturity map is therefore mixed. Core data capture, forecasting, inspection, and Groove sales-engagement surfaces appear mature and public. Newer AI-agent surfaces are not yet uniformly GA. MCP is strategically important, but the public documentation still focuses more on promise and use cases than on full implementation detail, security architecture, or customer rollout evidence. That is consistent with a platform in active convergence rather than final-state simplification.",
