    {
      "id": "security-reliability-technical-risks",
      "title": "Security, Reliability, and Technical Risks",
      "body": "Clari discloses a reasonably strong compliance surface for enterprise software: SOC 2 Type II, ISO 27001, ISO 27701, CSA, ADA, and GDPR claims are all published on the security page, alongside a public status site and vulnerability-disclosure language. That is a positive signal for procurement. The more important underwriting question is operational resilience at the workflow edge, where Clari depends on external systems and bots. Two official 2026 examples illustrate this. First, March release notes warned that Zoom security changes would stop Copilot bots from joining or recording meetings unless customers re-synced Zoom. Second, the public trust site recorded a June 2026 Salesforce integration issue where some customers had to re-authenticate the Copilot Salesforce connection to restore functionality. Those incidents do not imply structural product failure, but they do show that Clari's user experience can degrade when key connectors change behavior or auth state. Independent user feedback adds a further caution: Gartner peer content includes a quote praising support while saying the tool crashes more than expected. Combined, the evidence suggests Clari's security and compliance posture is procurement-ready, but its day-to-day reliability remains coupled to connector health, admin hygiene, and the stability of increasingly interdependent modules.",
