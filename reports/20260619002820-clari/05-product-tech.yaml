    {
      "id": "ai-mcp-developer-surface",
      "title": "AI Layer, MCP Server, and Developer Surface",
      "body": "Clari's AI stack is partly established and partly still emerging. RevAI features such as Ask Clari, Smart Chapters, Smart Feed, and Smart Follow Ups were launched before the merger and are presented as workflow-level aids rather than standalone copilots. The newer Revenue AI Agents page expands that portfolio with Advanced Opportunity Scores, Smart Topics, Smart CRM Suggestions, AI Projections, and agentic features like Deal Inspection Agent and Trend Analysis Agent, but the public labels matter: some are early access and Ask Clari for Deals is still marked coming soon. The biggest 2026 product-technology change is the MCP narrative. Salesloft and Clari now describe an MCP server that lets external AI tools operate on live pipeline, deal, account, and call data, effectively treating Clari/Salesloft as a context provider for Claude, ChatGPT, Copilot, Gemini, and Agentforce. Official MCP documentation and Microsoft's developer guidance support the technical plausibility of that pattern: MCP is a JSON-RPC based standard for hosts, clients, servers, tools, and resources. But Microsoft's security guidance also highlights the risk envelope \u2014 tool poisoning, prompt injection, and weak governance if enterprises expose tool servers without policy controls. The result is a credible ecosystem strategy, but one that still requires diligence on access controls, entitlement scope, and whether Clari's public developer surface is deep enough for third-party builders without customer-only documentation.",
