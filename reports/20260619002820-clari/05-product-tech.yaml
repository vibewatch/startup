      "id": "architecture-data-integration-model",
      "title": "Architecture, Data Model, and Integration Surface",
      "body": "The public architecture story centers on Revenue Context: Clari says it captures both human and system-generated activity, preserves who did what and when, and uses that shared context to guide both people and AI agents. The technical surface supporting that story is more concrete than the marketing prose. The public Clari API reference documents token-based authentication, asynchronous export and import jobs, forecast-tab exports, audit events, data-ingestion endpoints for partners, and activity export APIs for emails, meetings, and files. That indicates a real operating model built around pulling operational data out of Clari, pushing missing account or opportunity data back in, and letting partners extend the platform without direct database access. The Groove-in-Copilot knowledge article adds an important operational detail: some workflow connections are not just native magic, but depend on admin-provisioned API keys, API secrets, and product entitlements. In 2026 Clari also tied the platform more tightly to Salesloft, letting managers create tasks and send AI emails from Forecast, Inspect, and Copilot surfaces. The upside is a more closed-loop workflow. The risk is that the platform becomes increasingly dependent on the health of adjacent systems such as Salesforce, Zoom, email/calendar providers, and the newly merged Salesloft execution layer.",
