        blocks:
          - type: paragraph
            body: >-
              Clari's disclosed customer base skews toward large, operationally mature B2B revenue organizations rather
              than broad SMB adoption. Pre-merger Clari stated that more than 1,500 organizations used the platform to
              manage over $5 trillion in revenue, while the August and December 2025 merger announcements lifted the
              combined Clari-Salesloft footprint to more than 5,000 organizations and roughly $10 trillion in revenue
              under management. The strongest public reference set comes from enterprise software, cybersecurity, IT,
              and complex-services operators such as Okta, Databricks, 6sense, Certinia, Alight, Alteryx, Unity,
              BirchStreet, and Tipalti. That pattern is consistent with third-party review coverage that says Clari
              works best where a CRO, CFO, or RevOps leader needs multi-level forecast rollups, inspection cadences, and
              disciplined seller workflows across 50-plus reps. In practice, the buyer is usually a CRO or RevOps
              leader, the daily users are frontline managers and sellers, and the payer is the enterprise GTM budget.
              This segment bias is a strength for large accounts because it embeds Clari deeply into leadership rituals,
              but it also means the disclosed customer evidence is concentrated in accounts with longer procurement
              cycles, heavier implementation demands, and larger renewal negotiations.
