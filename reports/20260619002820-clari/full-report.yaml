  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >-
              The revenue operations and intelligence market encompasses software platforms that unify sales engagement,
              pipeline forecasting, revenue intelligence, and AI-guided workflow automation for enterprise B2B revenue
              teams. Gartner formally defined this convergence as Revenue Action Orchestration (RAO) in its inaugural
              Magic Quadrant published in December 2025, collapsing what was formerly three separate purchase
              categories—sales engagement, revenue intelligence, and sales force automation (SFA)—into one AI-native
              market definition. The RAO boundary includes spend on forecasting accuracy, pipeline analytics,
              conversation intelligence, deal inspection, rep coaching, and autonomous revenue signal consolidation.
              Excluded from the RAO boundary are: core CRM seat licenses (Salesforce, HubSpot), business intelligence
              and analytics (Tableau, Power BI), marketing automation (Marketo, Pardot), and HR or compensation
              management tools. Status-quo substitutes that enterprises use before dedicated RAO adoption include CRM
              native reporting, spreadsheet-based forecast rollups, and fragmented point solutions such as standalone
              call recording tools, simple email sequencing software, and manual pipeline review cadences. The adjacency
              between RAO and CRM is material: Salesforce's Agentforce and Einstein AI overlays directly compete for the
              same budget lines, and the platform integration requirement with Salesforce CRM is both a distribution
              advantage and a switching cost that every RAO vendor—including Clari-Salesloft—must navigate. Gartner's
              category creation signals that the market has reached early mainstream adoption and that enterprise buyers
              can now issue formal RFPs against a recognized benchmark, reducing the market-education overhead that
              constrained earlier growth.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
