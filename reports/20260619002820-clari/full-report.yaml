  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Clari scores well on strategic relevance and only middling on valuation support because the post-merger disclosure
      set remains thin.
    data:
      items:
        - label: Scale proof
          value: 7
          unit: /10
          detail: Strong if combined ARR really approximates $450M and 5,000+ customers
        - label: Growth quality
          value: 6
          unit: /10
          detail: 2024 standalone growth was strong, but no post-merger NRR or churn disclosure
        - label: Moat durability
          value: 7
          unit: /10
          detail: Dataset breadth and workflow depth are real but not yet fully unified
        - label: Integration execution
          value: 4
          unit: /10
          detail: Overlap, layoffs, and roadmap uncertainty lower confidence
        - label: Valuation support
          value: 5
          unit: /10
          detail: Secondary signal exists, but primary price discovery is stale
        - label: Evidence quality
          value: 4
          unit: /10
          detail: Too many crucial metrics are still missing from public sources
        - label: Overall investability
          value: 5
          unit: /10
          detail: Trackable asset, not yet a clear buy
    approximationNotes: Scores are analytical judgments synthesizing the chapter evidence; they are not company-disclosed KPIs.
    claimRefs:
