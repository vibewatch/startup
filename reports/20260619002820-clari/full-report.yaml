  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Clari markets the product as a revenue orchestration platform rather than a single forecasting tool. The
              public product overview organizes the suite across Capture, Inspect, Align, Copilot, Forecast, Analyze,
              and Groove, while the newer revenue-platform framing groups the architecture into Revenue Data, Revenue
              Insights, Revenue Cadences & Workflows, and Revenue Agents. In practical customer-workflow terms, the
              stack starts by autocapturing revenue signals from email, calendar, calls, CRM, and related systems; moves
              those signals into deal inspection, forecasting, and analytics surfaces; layers conversation intelligence
              and coaching through Copilot; and extends execution through Groove and, in 2026, deeper Salesloft actions.
              This matters because Clari is no longer selling only boardroom forecast visibility. It is trying to own
              the daily operating loop from prospecting to pipeline inspection to post-call follow-up. The strongest
              evidence for that positioning is not the homepage rhetoric alone, but the way official pages and 2026
              release notes consistently connect capture, inspection, forecasting, and seller execution as a single
              workflow. The main caveat is that some headline AI capabilities are still marketed ahead of full
              production maturity, so the suite should be underwritten as a proven core platform with an expanding but
              uneven AI perimeter rather than as a fully mature agentic system today.
