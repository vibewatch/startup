  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: standard
    summary: >-
      The recommendation depends on whether live price signals can be reconciled with verified combined ARR and
      integration execution.
    data:
      nodes:
        - id: stale-primary
          label: 2022 primary mark
          detail: $2.6B+ official Series F anchor
          tone: neutral
        - id: live-secondary
          label: 2026 secondary signal
          detail: PM Insights roughly $3.41B implied value
          tone: positive
        - id: combined-arr
          label: Combined ARR question
          detail: Forrester says about $450M; company has not audited it publicly
          tone: warning
        - id: integration-risk
          label: Integration / churn risk
          detail: Overlap, layoffs, and roadmap uncertainty pressure the multiple
          tone: warning
        - id: scenario-range
          label: Scenario range
          detail: $2.0B-$4.7B depending on proof quality and execution
          tone: neutral
        - id: recommendation
          label: Research-more
          detail: Wait for financial proof or a better price
          tone: warning
      edges:
        - from: stale-primary
          to: scenario-range
        - from: live-secondary
          to: scenario-range
        - from: combined-arr
          to: scenario-range
        - from: integration-risk
          to: scenario-range
        - from: scenario-range
          to: recommendation
    approximationNotes: The flow emphasizes decision dependencies, not timing or probability weights.
