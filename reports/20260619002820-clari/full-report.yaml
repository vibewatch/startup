      - number: '2.6'
        title: Category Shifts After Clari-Salesloft and Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              The December 2025 Gartner Magic Quadrant for Revenue Action Orchestration created a formal competitive
              framework within which Clari (as a Leader), Gong (as a Leader with #1 Critical Capabilities score), and
              Salesloft (as a Visionary, now merged into Clari) were the three most prominently positioned vendors. The
              post-merger Clari-Salesloft entity claims the largest revenue data asset in the category— ingesting more
              than 10 billion revenue actions and 1 trillion buyer interaction signals—which positions it competitively
              for AI model superiority. However, Gong's ARR crossed $500 million in May 2026, driven by the same
              stack-consolidation tailwind, confirming that the category is not winner-take-all. Salesforce's Agentforce
              AI layer reached $800 million ARR by early 2026, often deployed as a direct overlay to enterprise
              Salesforce installations that already embed the CRM at the center of the revenue stack—presenting a
              low-switching-cost competitive path for Salesforce-native enterprises. The category shift away from point
              solutions toward unified RAO platforms is broadly confirmed by the shrinkage of the median enterprise
              revenue stack from 8+ tools to approximately 5.2 tools, but it is not uniformly favorable to Clari:
              Outreach markets itself as an agentic AI platform for revenue teams, and Gong's expanded platform covers
              sales engagement (via Gong Engage), forecasting, and coaching in a direct challenge to Clari-Salesloft's
