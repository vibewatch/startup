companyProfile:
  summary: >-
    Clari is a private revenue orchestration software company founded in 2012 that built its position through AI-led
    forecasting, pipeline inspection, and revenue workflow software for large B2B sales organizations. The company
    scaled to roughly $158.5 million of standalone 2024 ARR and about 1,500 customers before merging with Salesloft in
    December 2025, a move that created a combined 5,000-plus-customer platform with an estimated $450 million of ARR and
    a broader product stack spanning sales engagement through forecast execution. The strategic case is credible, but
    public disclosure quality remains late-stage-private rather than IPO-ready: Clari's last official valuation is still
    the January 2022 $2.6 billion Series F, while current post-merger economics, retention, and capital-stack details
    remain largely undisclosed.
