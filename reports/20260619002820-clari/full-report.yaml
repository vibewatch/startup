  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Clari should be treated as a price-sensitive salestech platform rather than a generic 'good company equals
              good investment' story. The company still has meaningful strengths: the last disclosed standalone ARR base
              reached $158.5 million in 2024, the Salesloft merger created a claimed 5,000-plus-customer footprint, and
              a 2026 PM Insights secondary snapshot suggests investors still clear shares at roughly a $3.41 billion
              implied value. The problem is that none of those facts, by themselves, proves that the merged company can
              sustain a premium multiple. The $2.6 billion official mark comes from January 2022, before SaaS multiple
              compression, before the Groove-plus-Salesloft product overlap had to be rationalized, and before the 2026
              layoffs and integration strain. The right investment stance is therefore research-more with medium
              confidence: the company may deserve a fair growth multiple if combined ARR is really around $450 million
              and retention remains healthy, but there is not enough post-merger disclosure to underwrite a buy call or
              to pay above the upper end of the current secondary range without fresh management evidence.
            claimRefs:
