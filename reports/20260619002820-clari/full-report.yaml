      - number: '3.3'
        title: 'Platform Incumbents: Salesforce Agentforce and HubSpot'
        blocks:
          - type: paragraph
            body: >-
              Salesforce represents the most structurally threatening competitive force for Clari's forecasting premium.
              Agentforce ARR reached approximately $800M in FY2026 (fiscal year ended January 2026), up 169%
              year-over-year, with 29,000-plus deals closed since launch and 60% of Q4 FY2026 bookings originating from
              existing customer expansions — demonstrating that Salesforce is converting its massive CRM installed base
              rather than winning net-new logos. Total Salesforce FY2026 revenue was $41.5B, up 10% year-over-year, with
              remaining performance obligation reaching $72.4B — giving Salesforce the financial scale to sustain
              aggressive bundling. Agentforce and Data Cloud combined reached $2.9B in ARR by the end of FY2026, more
              than tripling year-over-year, and the company delivered 2.4 billion agentic work units (AWUs) — discrete
              tasks completed autonomously by AI — signaling that Salesforce has shifted from analytics to execution.
              Salesforce's "Agentic Enterprise" framing positions Agentforce as the AI execution layer native to every
              existing Salesforce Sales Cloud deployment, meaning any enterprise already paying for Salesforce CRM can
              activate forecasting, pipeline analytics, and revenue intelligence agents as an incremental upsell,
              eliminating the standalone Clari license. This bundling dynamic — comparable functionality at zero
              incremental license cost for existing CRM subscribers — is the highest structural threat to Clari's
              forecasting value proposition. Clari's counterclaim that its multi-source signal ingestion and Salesloft
              engagement data produce superior accuracy depends on customer willingness to maintain two enterprise
              platforms. HubSpot entered the revenue intelligence conversation through its Spring 2026 AI overhaul,
              adding AI-powered forecasting, pipeline scoring, conversation intelligence, and a Prospecting Agent priced
              at $1 per lead — a consumption-based pricing contrast to Clari's seat-based $200–$310 range. HubSpot's
              FY2025 revenue of $3.1B and customer base of 288,706 organizations provide formidable distribution, though
              its RAO capabilities remain weighted toward mid-market buyers rather than the complex multi-region
              enterprise deployments where Clari dominates.
