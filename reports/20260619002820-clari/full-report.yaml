  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Merger Integration, Platform Consolidation, and People Risk
        blocks:
          - type: paragraph
            body: >-
              The central underwriting risk is whether Clari can merge overlapping revenue-orchestration assets fast
              enough to preserve customer confidence while still keeping pace with AI competition. Public scale
              disclosures are large: the August 2025 merger announcement said the combined company would serve more than
              5,000 organizations, manage $10 trillion in customer revenue, and ingest more than 10 billion revenue
              actions and 1 trillion data signals. But the strongest independent interpretation of that scale is
              cautious, not celebratory. Forrester called the deal a high-risk, high-reward bid that raises more product
              questions than answers because Salesloft, Groove, and Clari all touch adjacent workflow layers, while
              neither side clearly closes the conversation-intelligence gap with Gong. The December 2025 close also
              brought a new CEO, Steve Cox, and a promise to double R&D investment, which makes execution speed more
              important: the company is simultaneously promising platform unification, heavier AI investment, and
              continued go-to-market continuity. The people signal worsened in 2026 when WARN-linked layoffs hit 172
              workers across two Sunnyvale notices. Those filings do not prove distress by themselves, but they do
              indicate that role consolidation is no longer theoretical. In practical diligence terms, Clari is asking
              investors to fund a three-part transition at once: leadership transition, product-stack consolidation, and
              organization redesign. If customer-facing teams, implementation resources, or roadmap clarity degrade
              before the merged platform becomes simpler than the legacy stack, renewal risk will rise before synergy
              benefits are visible.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR038
              - CR039
              - CR044
