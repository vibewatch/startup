      - number: '4.4'
        title: Unit Economics and Margin Profile (Inferred)
        blocks:
          - type: paragraph
            body: >-
              Clari has not publicly disclosed gross margin, operating margin, EBITDA, or NRR. Industry benchmarks for
              enterprise SaaS at comparable scale provide inference bounds: median software gross margin is
              approximately 77% for companies with minimal professional services revenue; blended margins are typically
              lower when services exceed 15–20% of total revenue. Clari's 2024 ARR of $158.5 million divided by
              approximately 789 reported employees implies roughly $201,000 ARR per employee—below the $300,000-plus
              median for SaaS companies above $100 million ARR—likely reflecting pre-merger scale-up investments and an
              attached professional-services cost base. The Forrester Total Economic Impact study published September
              2025, commissioned by Clari, found a composite enterprise customer achieved 398% ROI and $96.2 million in
              net present value over three years with payback under six months. The study attributed $52.3 million to a
              20-point increase in customer renewal rates and $25.3 million to expansion revenue driven by doubled win
              rates and a 33% lift in customer spend—a signal of strong underlying NRR if the customer evidence is
              representative. Enterprise SaaS CAC benchmarks at approximately $2.00 of sales and marketing expense per
              $1.00 of new ARR, a ratio Clari has not confirmed; this benchmark implies a meaningful S&M load relative
              to new bookings at Clari's current scale. NRR medians for private B2B SaaS sit near 101% in 2025, with
              best-in-class above 115%; Clari's actual retention rate is undisclosed, though its revenue-governance and
              forecasting positioning favors high renewal stickiness in accounts where platform adoption is deep.
