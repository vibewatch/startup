      - number: '4.3'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Clari's capital formation spans a decade: a $6 million Series A (April 2014, Sequoia Capital), $20 million
              Series B (June 2014, Bain Capital Ventures and Sequoia), $35 million Series C (March 2018, Tenaya
              Capital), $60 million Series D (October 2019, Sapphire Ventures), and $150 million Series E (March 2021,
              Silver Lake and Khosla Ventures). The January 2022 Series F—$225 million led by Blackstone Growth
              (BXG)—set the $2.6 billion post-money valuation that remains Clari's last publicly disclosed mark. Public
              datasets place lifetime capital raised in a $496 million to $510 million band, implying roughly $506
              million of disclosed capital depending on whether data vendors count every early round identically. In
              August 2023, Clari acquired Groove Labs for an undisclosed sum, bringing Groove co-founders Chris
              Rothstein and Austin Wang into the company. In December 2025, Clari merged with Salesloft in an all-equity
              transaction—Salesloft was previously owned by Vista Equity Partners. Morgan Stanley served as exclusive
              financial advisor to Clari on the Salesloft deal. No new equity round, convertible note, or disclosed debt
              facility has been identified since the January 2022 close. With Blackstone committed to deploy Clari
              across 250-plus portfolio companies as a strategic channel, incentives to avoid a dilutive new raise may
              have deferred the next capital event, though the four-year gap is a diligence red flag on runway opacity
              and leverage capacity entering the post-merger integration phase.
