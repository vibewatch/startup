  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: standard
    summary: >-
      Clari's multiple looks very different depending on whether investors use standalone or combined ARR and whether
      they rely on primary or secondary valuation anchors.
    data:
      items:
        - label: 2022 mark / 2024 standalone ARR
          value: 16.4
          unit: x
          detail: $2.6B divided by $158.5M
        - label: 2022 mark / combined ARR est.
          value: 5.8
          unit: x
          detail: $2.6B divided by ~$450M
        - label: 2026 PM mark / 2024 standalone ARR
          value: 21.5
          unit: x
          detail: $3.41B divided by $158.5M
        - label: 2026 PM mark / combined ARR est.
          value: 7.6
          unit: x
          detail: $3.41B divided by ~$450M
        - label: Gong 2026 secondary / ARR
          value: 9
          unit: x
          detail: $4.5B divided by >$500M
        - label: Outreach 2026 secondary / ARR
          value: 1.2
          unit: x
          detail: ~$300M divided by ~$250M
    approximationNotes: >-
      Combined ARR is analyst-estimated and Outreach ARR is a 2023 denominator carried into a 2026 value discussion, so
      the chart is comparative rather than precise.
