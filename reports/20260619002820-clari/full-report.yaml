    layout: wide
    summary: How integration, governance, and competitive risks can flow into renewals, margin, financing, and valuation.
    approximationNotes: The graph expresses causal pathways implied by the source set; it does not quantify the magnitude of each pathway.
    data:
      nodes:
        - id: integration
          label: Integration overlap
          type: risk
          detail: Product and org consolidation across Clari, Groove, and Salesloft
        - id: compliance
          label: Privacy / AI compliance
          type: risk
          detail: GDPR, DPA, AI Act, and agent-governance duties
        - id: dependency
          label: Platform dependency
          type: risk
          detail: Salesforce, Zoom, Google, and customer-admin workflows
        - id: competition
          label: Competitive compression
          type: risk
          detail: Gong and Salesforce expanding AI-led platform pressure
        - id: renewals
          label: Renewals / expansion
          type: output
          detail: Price, trust, and product clarity shape durable revenue
        - id: margin
          label: Margin / support load
          type: output
          detail: Services, support, and incident cost can rise during convergence
        - id: financing
          label: Financing / exit options
          type: output
          detail: Market confidence depends on clean execution and stable growth
        - id: valuation
          label: Valuation outcome
          type: output
          detail: Stale 2022 mark will be tested by the next capital event
      edges:
        - from: integration
