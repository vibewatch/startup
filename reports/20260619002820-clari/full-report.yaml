      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses confirm a coherent but wide-ranging TAM estimate for the revenue operations and
              intelligence category. The narrowest defensible TAM—focused specifically on revenue intelligence and
              forecasting software—sits at $4–5 billion globally in 2026 based on aggregated estimates from Verified
              Market Reports and WorldMetrics, growing to $10–12 billion by 2030 at a 13–15% CAGR. A broader lens
              incorporating all AI-for-sales and marketing software pushes the 2030 TAM to $240 billion
              (MarketsandMarkets), but this figure conflates marketing AI spend with pure RevOps and is of limited
              utility for sizing Clari's core opportunity. A third enterprise AI lens (Mordor Intelligence) places the
              2026 market at $114.87 billion with an 18.91% CAGR, but this again spans a far wider footprint than
              revenue orchestration. For this analysis, the most applicable TAM anchor is the $4–5 billion 2026 figure
              for revenue intelligence and orchestration, expanding toward $10–12 billion by 2030. The SAM is harder to
              isolate: Gartner's RAO Hype Cycle characterizes the market as having reached early mainstream adoption
              with a critical two-year adoption window through 2027, but provides no explicit dollar figure for the
              serviceable enterprise segment. Conservative SAM estimation using Clari-Salesloft's disclosed $158.5
              million standalone 2024 ARR and publicly available competitor ARR anchors (Gong $500M ARR, Salesforce
              Einstein layers) suggests the SAM for enterprise-grade RAO platforms—companies with 200+ employees and
              complex multi-product GTM motions—is approximately $2–3 billion in 2026. The SOM for the combined
              Clari-Salesloft entity, inferred from its $158.5 million 2024 ARR base and 5,000-plus post-merger customer
              footprint, is approximately $0.8–1.2 billion in near-term addressable revenue, reflecting a current
              penetration rate of roughly 15–20% of the SAM. All sizing estimates carry material uncertainty because no
              vendor in this space reports segment revenue publicly, and analyst definitions vary significantly in
              scope.
