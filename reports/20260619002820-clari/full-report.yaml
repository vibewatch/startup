      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Andy Byrne and Venkat Rangan co-founded Clari in 2012. Byrne served as CEO from founding through the
              December 2025 merger completion with Salesloft, acting as the central figure in fundraising, customer
              trust, and product vision for more than a decade. Rangan, who previously co-founded Clearwell Systems—an
              e-discovery company acquired by Symantec in 2011—joined Clari as Chief Technology Officer and has
              continued in that role through the post-merger period. Public records reviewed in this chapter do not
              identify Carlos Delatorre as a co-founder of Clari; confirmed co-founders are Byrne and Rangan, a finding
              consistent across Tracxn, PitchBook, Clay, and the company's own press materials. On December 3, 2025,
              upon merger close, Steve Cox was appointed CEO of the combined Clari-Salesloft entity. Cox brings more
              than 25 years of SaaS leadership experience from prior roles including CEO of Employ, executive positions
              at Community Brands, Vertafore, and Chess. The leadership transition from a founder-CEO to an external
              hire is a material diligence signal at a time when the combined company is integrating two complex revenue
              platforms. Governance details of the combined board—including which investor directors hold seats and
              whether Byrne retains any formal advisory role—are not fully disclosed in public materials, representing a
              gap the next diligence refresh should close.
            claimRefs:
              - CO004
              - CO005
              - CO006
