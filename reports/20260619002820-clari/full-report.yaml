            body: >-
              The $2.6 billion post-money valuation dates to January 2022—four years before the Salesloft merger, the
              2026 WARN Act restructuring, and the broad SaaS multiple compression that halved or worse typical
              private-company EV/ARR multiples. No secondary transaction, updated mark, or new equity round has been
