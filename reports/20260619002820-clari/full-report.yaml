      - number: '1.5'
        title: Adverse Events, Post-Merger Risks, and Integration Challenges
        blocks:
          - type: paragraph
            body: >
              The post-merger period has introduced material adverse signals that diligence must treat as current rather
              than historical. Two WARN Act filings in California document 96 layoffs effective January 5, 2026, and 76
              additional layoffs effective April 11, 2026, totaling 172 workers in Santa Clara County. Both filings cite
              a reduction in force rather than a facility closure, consistent with post-merger consolidation of
              overlapping roles across the combined Clari and Salesloft workforce. The workforce actions, combined with
              the CEO transition from founder Andy Byrne to Steve Cox in December 2025, create measurable key-person and
              execution risk heading into the combined entity's first full operating year. Clari also faces competitive
              pressure from Gong, which is deeply entrenched in conversation intelligence; from Salesforce and other
              major CRM platforms expanding into revenue orchestration; and from AI-native startups building
              purpose-built forecasting tools that could erode addressable wallet share. The last publicly disclosed
              valuation of $2.6 billion dates to January 2022, prior to the Salesloft merger, the 2026 WARN Act layoffs,
              and the broader SaaS multiple compression that has characterized the 2022–2026 environment. Any new
              investor pricing the combined entity must reconcile the four-year valuation gap with the altered cost
              structure, the integration burden, and an evolving competitive landscape in which several well-capitalized
              rivals are targeting the same enterprise revenue operations budget.
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO038
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: RevDB proprietary dataset creates a durable competitive moat
            body: >-
              Clari's RevDB aggregates over 10 billion revenue actions and 1 trillion buyer signals across thousands of
              enterprise workflows, building a flywheel in which more usage improves AI model quality for all customers.
              This self-reinforcing data advantage is difficult to replicate quickly and represents a core source of
              long-term defensibility that later chapters should evaluate against competitor data assets.
            calloutType: strength
            claimRefs:
              - CO040
              - CO041
          - type: callout
            title: Founder departure and post-merger layoffs elevate near-term execution risk
            body: >-
              Andy Byrne's transition out of the CEO role at merger close is a significant key-person event at a time
              when the combined company must integrate two complex revenue platforms. The 172 California WARN Act
              layoffs in the first half of 2026 signal ongoing restructuring that may disrupt product velocity, customer
              success continuity, and the cultural integration required for the Salesloft combination to generate its
              projected synergies.
            calloutType: risk
            claimRefs:
              - CO031
              - CO037
              - CO038
          - type: callout
            title: Merger with Salesloft creates a category-defining Revenue AI platform
            body: >-
              The Clari-Salesloft combination unifies revenue orchestration, sales engagement, conversation
              intelligence, and AI forecasting into one platform serving 5,000-plus enterprises. The resulting dataset
              scale—$10 trillion in annual revenue under management—positions the combined company to train and deploy
              more powerful revenue AI models than either standalone entity could achieve, addressing the boardroom
              demand for a single system of record for enterprise revenue.
            calloutType: insight
            claimRefs:
              - CO033
