      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The right denominator is combined ARR, not standalone ARR
            body: >-
              Using standalone 2024 ARR makes both the 2022 official mark and the 2026 PM Insights secondary mark look
              very rich. Using the more economically relevant post-merger combined ARR estimate compresses the multiple
              into a defensible but still debateable range. That denominator choice is the entire valuation debate.
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
          - type: callout
            title: Secondary optimism is not the same as primary price discovery
            body: >-
              The PM Insights mark is useful, but it does not replace an audited round, a tender memorandum, or a
              management-backed revenue bridge. If a new financing clears below the 2022 mark, the current secondary
              narrative loses a lot of force immediately.
            calloutType: risk
            claimRefs:
              - CV012
              - CV035
              - CV043
          - type: callout
            title: Integration risk is the reason Clari should not trade at Gong's premium
            body: >-
              Gong's current premium multiple rests on visible 2026 ARR, sustained acceleration, and less merger noise.
              Clari may eventually deserve a similar tier, but the current overlap, layoffs, and disclosure gaps argue
              for a discount today.
            calloutType: risk
            claimRefs:
              - CV019
              - CV021
              - CV030
              - CV033
