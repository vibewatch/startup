      - number: '3.2'
        title: 'Direct Peers: Gong and Outreach'
        blocks:
          - type: paragraph
            body: >-
              Gong is the most consequential direct competitor to Clari in mid-2026. Having surpassed $500M ARR in May
              2026 with 55%-plus year-over-year growth — its tenth consecutive quarter of accelerating growth rate —
              Gong now serves 4,000-plus enterprise customers, including half of the Fortune 10. Gong's AI advantage
              rests on the Revenue Graph, which converts emails, calls, meetings, and deals into a proprietary living
              memory layer that powers automated decisions about deal prioritization, team risk signals, and next-best
              actions. Gong's modular product suite (Foundation for call recording and analytics, Engage for sales
              sequences, Forecast for pipeline management) creates direct competition across every core Clari-Salesloft
              use case. Full-suite pricing runs $200–$250 per user per month, broadly comparable to Clari's $200–$310
              range, meaning Clari cannot compete on price alone. G2 user ratings in 2026 place Clari at 4.6–4.7 and
              Gong at 4.7–4.8, with Gong rated higher for rep coaching and UI while Clari leads on forecasting accuracy
              and executive-level reporting. Many large enterprises run both platforms simultaneously, creating a
              combined stack tax estimated at approximately $500 per user per month. Gong added more $1M-plus customers
              in the last two quarters before May 2026 than in the previous six combined, signaling accelerating
              enterprise displacement potential in accounts where rep coaching is the primary driver. Gong's 50% of
              customers running multiple products as of May 2026, with flagship AI capability use growing over 200%
              year-over-year, signals increasing platform stickiness for Gong customers that mirrors Clari's own lock-in
              story. Outreach, with approximately $340M ARR serving 6,000-plus enterprise customers, competes primarily
              in the sales engagement layer — email sequencing, dialer, and rep workflow automation — where Salesloft
              has historically been strongest. Outreach raised $489M total at a $4.4B Series G valuation in June 2021
              and operates an enterprise-only GTM with deals starting at $2,500 per month, positioning it as a direct
              replacement candidate for the Salesloft half of the combined platform in organizations considering
              post-merger consolidation.
