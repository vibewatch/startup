      - number: '1.3'
        title: Capital Structure, Investors, and Valuation
        blocks:
          - type: paragraph
            body: >
              Clari has raised approximately $510 million in total across seven disclosed rounds spanning from 2014
              through 2022. The capital stack begins with a $6 million Series A in April 2014 led by Sequoia Capital,
              followed by a $20 million Series B in June 2014 co-led by Bain Capital Ventures and Sequoia. A $35 million
              Series C in March 2018 (Tenaya Capital) and a $60 million Series D in October 2019 (Sapphire Ventures)
              supported the company through product maturation and early enterprise scale. The $150 million Series E in
              March 2021 was co-led by Silver Lake and Khosla Ventures, with Workday Ventures joining an extended Series
              E tranche in 2021, adding a strategic enterprise ecosystem dimension. Eighteen Clari customers completed
              IPOs in 2021 alone—including Confluent, UiPath, Procore, and Samsara—establishing the company's
              penetration into high-growth enterprise accounts during the Series E growth period. The capital formation
              culminated in a $225 million Series F in January 2022, led by Blackstone Growth (BXG), with Silver Lake,
              Light Street Capital, and Maverick Capital joining as new investors alongside existing backers.
              Blackstone's stated intent to deploy Clari across its 250-plus portfolio companies added a go-to-market
              multiplier to the purely financial return. As of the June 2026 run date, no new equity round, convertible
              note, or updated valuation disclosure has been identified, leaving the $2.6 billion figure more than four
              years stale and requiring a fresh valuation analysis before any investment decision.
