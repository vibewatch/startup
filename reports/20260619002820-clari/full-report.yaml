      - number: '1.4'
        title: Scale, Customers, Product, and Milestones
        blocks:
          - type: paragraph
            body: >
              Clari's commercial scale establishes it as a proven enterprise software company well before the Salesloft
              merger. As of 2024, Clari reported $158.5 million in annual recurring revenue per Latka data—up from $97.5
              million in 2023—with approximately 789 employees and 1,500 enterprise customers. In August 2023, Clari
              acquired Groove, a sales engagement platform, to extend its product coverage beyond forecasting into
              workflow automation and email sequencing. Named enterprise customers span verticals including technology
              (Okta, Snowflake, Dropbox), software (Adobe, Workday), and diversified enterprise (IBM, 3M, Zoom, Shopify,
              Qualtrics, RingCentral). Clari's RevDB proprietary data layer aggregates signals from CRM, email,
              calendar, and call transcripts; the combined Clari- Salesloft platform ingests more than 10 billion
              revenue actions and 1 trillion buyer interaction signals, building a proprietary dataset that trains AI
              forecasting and pipeline analytics models. The August 2025 merger announcement with
              Salesloft—characterized by Andy Byrne as the creation of an Autonomous Revenue System and Revenue AI
              flywheel—closed in December 2025, elevating the combined entity to 5,000-plus organizations and $10
              trillion in annual revenue under management. A 2025 Forrester Total Economic Impact study independently
              reported $96.2 million in value delivered to enterprise customers over three years with 398% ROI,
              substantiating product impact claims. Clari was also named a Leader in the 2025 Gartner Magic Quadrant for
              Revenue Action Orchestration, reflecting category recognition ahead of the merger completion. The
              milestone table below is the single chronology of record for Clari's history from founding through the run
              date.
