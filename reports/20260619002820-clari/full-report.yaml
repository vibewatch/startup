      - number: '3.4'
        title: 'Adjacent Competitors: ZoomInfo and 6sense'
        blocks:
          - type: paragraph
            body: >-
              ZoomInfo and 6sense address the data enrichment and buyer intent layers adjacent to Clari's workflow
              orchestration core, creating budget competition rather than direct product displacement. ZoomInfo
              generated $310.2M in Q1 2026 revenue (1.5% year-over-year growth), with full-year 2026 guidance lowered to
              $1.185–$1.205B reflecting macro headwinds and intensifying competition from AI-native data enrichment
              tools. ZoomInfo had 1,900 customers paying $100,000-plus in ACV as of Q1 2026, with upmarket ACV growing
              5% year-over-year and net revenue retention of approximately 90% for the trailing twelve months — with
              in-period upmarket retention above 100%. A 20% workforce reduction and shift to credit-based pricing
              indicate a business under margin pressure from commoditizing firmographic data. ZoomInfo's RevOS platform
              competes for the data enrichment and intent-signal budget, but it lacks native workflow orchestration;
              enterprises characteristically treat ZoomInfo as a data feed into Clari, not a replacement for its
              forecasting and pipeline governance layer. 6sense presents a different overlap profile. Having crossed
              $200M ARR in its fiscal year ending January 2024 with 40% growth, and having raised a $200M Series E at a
              $5.2B valuation bringing total funding to $426M, 6sense is growing rapidly and has expanded into sales
              intelligence modules with integrations to Gong Engage. However, 6sense's core is account-based marketing
              (ABM) and buyer intent data, serving demand-generation teams rather than sales operations or CRO-level
              forecasting. The competitive overlap with Clari is limited to demand-generation intelligence features;
              there is no substitution risk on pipeline forecasting or multi-party revenue governance. Both ZoomInfo and
              6sense are more accurately characterized as data-layer inputs for Clari's AI models than as existential
              competitive threats to its platform revenue.
