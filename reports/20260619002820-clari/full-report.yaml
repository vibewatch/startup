      - number: '2.3'
        title: Buyer Segmentation and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Enterprise RevOps and RAO purchasing concentrates in companies with at least 200 employees and dedicated
              B2B sales teams, with the center of gravity in large enterprise (greater than $1 billion revenue) and
              upper mid-market ($100 million–$1 billion revenue) accounts. The primary budget owner is the Chief Revenue
              Officer or VP of Sales, who initiates the procurement and owns the success criteria; the CFO serves as
              financial approver and demands a documented ROI model before authorization—typically requiring payback
              within 12–18 months. Enterprise RevOps platform pricing runs $200–$310 per user per month for top-tier
              tools, and 100-plus-seat enterprise implementations typically total $180,000–$240,000 annually, making the
              purchase a board-level line item in most organizations. The buying committee in enterprise deals averages
              11–20 stakeholders and spans IT, procurement, legal, sales leadership, and finance, with security and
              compliance review adding 30–60 days to the cycle. Average enterprise SaaS deal cycles for contracts above
              $100,000 ACV run 120–270 days, with deals above $500,000 approaching 270 days. High-growth SaaS companies
              represent an especially active buyer segment: investor pressure for forecast accuracy and ARR visibility
              makes AI forecasting a board-level requirement from Series B onward. Financial services and insurance
              firms are an emerging RevOps buyer segment driven by regulatory compliance requirements for revenue audit
              trails. Technology and manufacturing enterprises adopt RevOps as part of digital transformation mandates,
              often requiring multi-region pipeline consolidation and partner channel tracking. Budget is typically
              allocated from the sales technology or GTM technology budget, which enterprise benchmarks place at 5–8% of
              revenue for growth-stage companies and 4–6% of IT budget for mature enterprises. IT spend as a percentage
              of revenue ranges from 4–6% for the average enterprise to 12–18% for technology-sector companies.
