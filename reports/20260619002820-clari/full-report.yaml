  - id: FV003
    title: Valuation / Return Range
    type: range
    layout: standard
    summary: The supportable valuation band spans from a compressed-peer downside case to a Gong-adjacent upside case.
    data:
      items:
        - label: Bear valuation
          low: 2
          high: 2.6
          unit: $B
          detail: Integration drag or weaker-than-advertised combined ARR
        - label: Base valuation
          low: 3
          high: 3.6
          unit: $B
          detail: Combined ARR around ~$450M with stable retention
        - label: Bull valuation
          low: 4
          high: 4.7
          unit: $B
          detail: Cross-sell and premium-multiple support closer to Gong
        - label: PM Insights 2026 signal
          low: 3.35
          high: 3.47
          unit: $B
          detail: Centered on the cited ~$3.41B implied secondary value
        - label: 2022 official mark
          low: 2.6
          high: 2.6
          unit: $B
          detail: Historical primary financing anchor
    approximationNotes: >-
      The PM Insights band is a light smoothing range around the cited figure to avoid implying false precision from a
      thin private secondary market.
