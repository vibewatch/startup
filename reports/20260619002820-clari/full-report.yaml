      - number: '2.5'
        title: Adoption Barriers and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Despite robust growth drivers, the RevOps market faces significant structural constraints that moderate
              near-term penetration and compress the addressable SOM. The most systemic threat is AI agent disruption of
              the per-seat SaaS licensing model: AI agents capable of executing multi-step revenue workflows reduce the
              number of human seats required, directly pressuring ARR for seat-based platforms. Multiple market analysts
              documented between $1 trillion and $2 trillion in SaaS market capitalization erased in early 2026 as
              investors priced in this risk, with forward EV/revenue multiples for SaaS falling below S&P 500 averages
              for the first time. A 2026 survey of 2,000 business leaders identified data privacy concerns (34%) and
              lack of AI explainability (30%) as the leading barriers to AI adoption in enterprise RevOps— barriers that
              Clari must address through transparent model documentation and governance features to retain enterprise
              procurement approval. Enterprise SaaS license waste is also acute: 36% of licenses are unused,
              representing over $100 billion in annual global waste, which creates active CFO pressure to consolidate or
              cut platforms rather than add new ones. Switching costs tied to deep Salesforce CRM integration are a
              double-edged factor: they protect existing Clari customers from churn but create deployment friction for
              new logos that must re-integrate data pipelines, user permissions, and custom objects. The macroeconomic
              environment adds a further constraint: Forrester's 2026 budget planning research found that leaders are
              growing more cautious as economic uncertainty persists, with discretionary RevOps spend subject to
              cost-optimization review even when AI budgets are protected. For Clari specifically, the platform is
              priced at $200–$310 per user per month, which places it in the top tier of enterprise SaaS pricing and may
              expose it to value-for-money challenges as lower-cost AI-native entrants emerge with outcome-based or
              per-action pricing models rather than seat licensing.
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM027
