      - number: '7.5'
        title: Financing, Exit Pressure, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The final risk bucket is capital-markets timing. Clari's last official valuation disclosure is still the
              January 2022 Series F at more than $2.6 billion, and there is no later official public mark in the
              reviewed source set. Meanwhile, independent revenue data points to roughly $158.5 million of standalone
              2024 revenue and about 800 employees by late 2025, while Forrester frames the merger partly as a scale
              move that could improve eventual IPO positioning. That combination creates real exit pressure: investors
              are being asked to underwrite a larger but more complex company on a stale mark, during an integration
              period, in a category where platform incumbents are bundling AI aggressively. The WARN notices worsen that
              sensitivity because they make cost and organization changes externally visible before the market has a
              clear view of combined retention, margin structure, or synergy capture. In other words, Clari may still
              become a stronger scaled platform, but the path requires several things to go right at once: roadmap
              simplification, stable enterprise renewals, clean privacy and AI-governance posture, and a believable next
              valuation event. The investable posture should therefore be conditional, not absolute. If the next 12 to
              18 months produce another layoff wave, material privacy or AI-governance findings, evidence of product
              confusion at renewal, or a new financing event materially below the implied post-merger narrative, the
              thesis should be treated as broken rather than merely delayed.
            claimRefs:
