              SaaS companies in 2025 benchmark studies, suggesting Clari benefited from the Groove integration and
              enterprise upsell motion. The 2022-to-2024 two-year CAGR of approximately 38% per annum confirms sustained
              momentum even against a market backdrop of slowing SaaS growth. The December 2025 merger with Salesloft
              materially changed the revenue base. Forrester's August 2025 analyst brief—the most authoritative
              third-party estimate available—pegged the combined entity's ARR at approximately $450 million, implying
              Salesloft contributed roughly $290 million of ARR to the combination, nearly doubling Clari's standalone
              2024 run rate. The combined entity reports managing $10 trillion in annual customer revenue across
              5,000-plus organizations, a measure of platform activity breadth rather than Clari's own reported revenue.
              Pre-merger Clari served approximately 1,500 enterprise customers; the combined entity serves over 5,000
              globally per December 2025 merger completion materials. No official financial disclosure for the combined
              entity has been identified through the June 2026 run date, leaving the $450 million combined ARR estimate
              unverified by a primary-source filing or official announcement, a material gap for any investment
              underwriting.
