      - number: '7.2'
        title: Legal, Privacy, and AI Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Clari's legal and compliance risk is less about a single headline enforcement action today and more about
              the cumulative surface area it has chosen to expose. The company publicly says it processes CRM data,
              files, email-calendar information, contacts, Google data, and in some contexts voiceprints; its privacy,
              GDPR, and DPA pages also confirm cross-border transfers, subprocessor use, breach-notification duties, and
              parallel controller / processor roles. That legal scaffolding is a mitigation, but it is not a free pass.
              The same documents show how much sensitive operational data moves through the product, while the MSA
              pushes meaningful responsibility back to customers for lawful use, account administration, and third-party
              system changes. The risk envelope expands again with the new MCP and external-AI narrative. Salesloft now
              markets an MCP server that exposes live pipeline, deal, account, and call context to tools like Claude,
              ChatGPT, Copilot, Gemini, and Agentforce. Official Microsoft and Cloud Security Alliance guidance treats
              that design space as high risk unless every agent is observable, governed, least-privileged, and treated
              as an untrusted third-party surface; Microsoft's 2026 research explicitly shows how prompt injection can
              become remote code execution once tools are wired into agents. On the regulatory side, the EU AI Act's
              transparency rules become active in August 2026, and high-risk system obligations remain a moving but
              rising compliance bar into 2027. Even if Clari's current RevOps workflows do not cleanly fall into Annex
              III categories, the law matters because the product already markets automated guidance, scoring, and
              agentic action. Any future expansion into employment, credit, or similarly consequential decision support
              without documented oversight and logging would raise the compliance burden quickly.
