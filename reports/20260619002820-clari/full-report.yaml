chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Clari was incorporated as a California company in September 2012, with product commercialization typically
              attributed to 2013 in secondary sources reflecting the gap between incorporation and go-to-market launch.
              The company was originally based in Redwood City, California, before relocating its headquarters to
              Sunnyvale, California, at 1154 Sonora Court, where it remains as of the June 2026 run date. Clari operates
              as a private company at the Series F stage, with its most recently disclosed post-money valuation of $2.6
              billion dating to the January 2022 funding close—now more than four years stale. Its core product is an
              AI-powered revenue orchestration platform designed for enterprise B2B revenue teams, aggregating signals
              from CRM systems, email, calendar, and sales conversations to produce predictive forecasting, pipeline
              management, and revenue workflow automation. The business model is an enterprise SaaS subscription
              typically priced in the $200–$310 per user per month range, making it a board-level procurement decision
              for mid-market and enterprise buyers. Clari positions itself as a horizontal platform spanning sales,
              marketing operations, and customer success, not a point solution limited to forecasting alone. As of 2024,
              the company served approximately 1,500 enterprise customers before the Salesloft merger transformed the
              scale to 5,000-plus organizations. The KPI snapshot below summarizes the verified public metrics that
              later chapters will reuse as ground truth, with explicit gaps for private metrics unavailable from public
              sources.
