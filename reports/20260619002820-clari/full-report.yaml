            body: >-
              Public durability evidence is mixed. On the positive side, the case studies consistently describe Clari as
              a production system of record: customers use it in weekly cadences, board reporting, renewal risk reviews,
              and day-to-day manager inspection. Review aggregators and third-party product pages place Clari in a
              generally high-satisfaction band, with thousands of public reviews and repeated praise for forecasting
