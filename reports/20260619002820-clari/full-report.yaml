      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bear case assumes that the merged company cannot hold customers through product simplification, that
              cross-sell underperforms, and that a real audited revenue bridge shows combined ARR materially below the
              roughly $450 million Forrester estimate. Under that outcome, Clari would likely re-rate toward the low end
              of the private salestech range at roughly $2.0-$2.6 billion, or about 4.4x-5.8x combined ARR. The base
              case assumes the combined ARR estimate is broadly right, that no large forced-migration churn appears, and
              that management can prove stable retention with software-like margins; that supports roughly $3.0-$3.6
              billion, or about 6.7x-8.0x ARR, which brackets the PM Insights secondary mark. The bull case requires
              evidence that the Salesloft merger is working commercially rather than merely narratively: combined ARR
              moving toward or above $500 million, real cross-sell, and integration discipline good enough to justify a
              multiple closer to Gong's 2026 secondary benchmark. In that case a $4.0-$4.7 billion range, or about
              8.9x-10.4x combined ARR, becomes supportable. None of these scenarios can be upgraded to an underwriteable
              entry price without management-grade post-merger financial disclosure.
            claimRefs:
              - CV006
              - CV012
