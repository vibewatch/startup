  - id: moat-switching-costs
    title: Moat Durability, Switching Costs, and Win/Loss Dynamics
    body: >-
      Clari's competitive moat rests on three reinforcing pillars: data scale, forecast accuracy, and
      deep workflow integration. The combined Clari-Salesloft dataset of 10 billion-plus revenue
      interactions and 1 trillion data signals creates a proprietary training corpus that pure-play AI
      platforms or CRM incumbents cannot easily replicate without a decade of comparable enterprise
      deployments. Clari customers achieve 95–98% forecasting accuracy on average, validated externally
      by the Forrester 2025 Total Economic Impact study reporting $96.2M in enterprise value and 398%
      three-year ROI — metrics that sustain CFO justification for the $200–$310 per seat per month
      price point even against Salesforce bundling pressure. The April 2026 MCP server launch, enabling
      external AI tools including ChatGPT and Microsoft Copilot to access live Clari revenue signals,
      extends the moat by making Clari's data foundational for the broader enterprise AI ecosystem.
      Constellation Research noted the integrated platform and MCP server make the revenue data
      "foundational for a broader ecosystem," increasing switching costs beyond the application layer.
      Win/loss dynamics favor Clari when the buyer's primary need is enterprise forecasting accuracy
      and board-level revenue governance; they favor Gong when conversation intelligence and rep
      coaching are the primary use case. The adverse signal from Forrester's merger analysis — that
      the Clari-Salesloft integration raises product overlap concerns and that neither company closes
      the conversation intelligence gap with Gong — introduces execution risk that could open
      competitive displacement windows in 2026–2027 if integration friction surfaces in customer
      renewals. The 172 WARN-Act layoffs in early 2026 affected overlapping roles in operations,
      engineering, and customer success, signaling the organizational disruption that accompanies
      a complex integration under a first-time CEO with no prior Clari tenure. Gong's accelerating
      growth trajectory — adding more $1M-plus customers in two quarters than in the prior six
      combined — is the most actionable adverse signal indicating that Clari faces active displacement
      risk in competitive enterprise deals in the near term.
    claimRefs:
