    title: Salesforce Agentforce Bundling Threat
    body: >-
      Salesforce's ability to deliver comparable forecasting and pipeline intelligence as a zero-incremental-
      cost add-on to existing CRM licenses is the highest structural threat to Clari's core value proposition.
      With Agentforce ARR reaching $800M at 169% YoY growth and 60% of Q4 FY2026 bookings from existing
      customer expansions, the bundling displacement risk is already materializing inside the Salesforce
      installed base.
    claimRefs:
