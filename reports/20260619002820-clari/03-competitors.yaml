  - id: platform-incumbents
    title: "Platform Incumbents: Salesforce Agentforce and HubSpot"
    body: >-
      Salesforce represents the most structurally threatening competitive force for Clari's forecasting
      premium. Agentforce ARR reached approximately $800M in FY2026 (fiscal year ended January 2026), up
      169% year-over-year, with 29,000-plus deals closed since launch and 60% of Q4 FY2026 bookings
      originating from existing customer expansions — demonstrating that Salesforce is converting its
      massive CRM installed base rather than winning net-new logos. Total Salesforce FY2026 revenue was
      $41.5B, up 10% year-over-year, with remaining performance obligation reaching $72.4B — giving
      Salesforce the financial scale to sustain aggressive bundling. Agentforce and Data Cloud combined
      reached $2.9B in ARR by the end of FY2026, more than tripling year-over-year, and the company
      delivered 2.4 billion agentic work units (AWUs) — discrete tasks completed autonomously by AI —
      signaling that Salesforce has shifted from analytics to execution. Salesforce's "Agentic Enterprise"
      framing positions Agentforce as the AI execution layer native to every existing Salesforce Sales
      Cloud deployment, meaning any enterprise already paying for Salesforce CRM can activate forecasting,
      pipeline analytics, and revenue intelligence agents as an incremental upsell, eliminating the
      standalone Clari license. This bundling dynamic — comparable functionality at zero incremental
      license cost for existing CRM subscribers — is the highest structural threat to Clari's forecasting
      value proposition. Clari's counterclaim that its multi-source signal ingestion and Salesloft
      engagement data produce superior accuracy depends on customer willingness to maintain two enterprise
      platforms. HubSpot entered the revenue intelligence conversation through its Spring 2026 AI overhaul,
      adding AI-powered forecasting, pipeline scoring, conversation intelligence, and a Prospecting Agent
      priced at $1 per lead — a consumption-based pricing contrast to Clari's seat-based $200–$310 range.
      HubSpot's FY2025 revenue of $3.1B and customer base of 288,706 organizations provide formidable
      distribution, though its RAO capabilities remain weighted toward mid-market buyers rather than the
      complex multi-region enterprise deployments where Clari dominates.
    claimRefs:
      - CP014
      - CP015
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP021
      - CP037

  - id: data-intelligence-providers
    title: "Adjacent Competitors: ZoomInfo and 6sense"
    body: >-
      ZoomInfo and 6sense address the data enrichment and buyer intent layers adjacent to Clari's workflow
      orchestration core, creating budget competition rather than direct product displacement. ZoomInfo
      generated $310.2M in Q1 2026 revenue (1.5% year-over-year growth), with full-year 2026 guidance
      lowered to $1.185–$1.205B reflecting macro headwinds and intensifying competition from AI-native
      data enrichment tools. ZoomInfo had 1,900 customers paying $100,000-plus in ACV as of Q1 2026,
      with upmarket ACV growing 5% year-over-year and net revenue retention of approximately 90% for
      the trailing twelve months — with in-period upmarket retention above 100%. A 20% workforce
      reduction and shift to credit-based pricing indicate a business under margin pressure from
      commoditizing firmographic data. ZoomInfo's RevOS platform competes for the data enrichment and
      intent-signal budget, but it lacks native workflow orchestration; enterprises characteristically
      treat ZoomInfo as a data feed into Clari, not a replacement for its forecasting and pipeline
      governance layer. 6sense presents a different overlap profile. Having crossed $200M ARR in its
      fiscal year ending January 2024 with 40% growth, and having raised a $200M Series E at a $5.2B
      valuation bringing total funding to $426M, 6sense is growing rapidly and has expanded into sales
      intelligence modules with integrations to Gong Engage. However, 6sense's core is account-based
      marketing (ABM) and buyer intent data, serving demand-generation teams rather than sales operations
      or CRO-level forecasting. The competitive overlap with Clari is limited to demand-generation
      intelligence features; there is no substitution risk on pipeline forecasting or multi-party revenue
      governance. Both ZoomInfo and 6sense are more accurately characterized as data-layer inputs for
      Clari's AI models than as existential competitive threats to its platform revenue.
    claimRefs:
      - CP022
      - CP023
      - CP024
      - CP025
