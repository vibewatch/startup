      - CP016
      - CP037

  - calloutType: risk
    title: Post-Merger Integration and Execution Risk
    body: >-
      Forrester's assessment that the Clari-Salesloft merger raises more questions than answers on product
      overlap — combined with 172 WARN-Act layoffs in early 2026 and a CEO appointment with no prior Clari
      tenure — creates a competitive vulnerability window. Gong and Outreach are likely running active
      displacement campaigns against enterprise accounts experiencing post-merger disruption during the
      2026 renewal cycle.
    claimRefs:
      - CP028
      - CP030
      - CP043

  - calloutType: strength
    title: MCP Data-Layer Moat Strategy
    body: >-
      The April 2026 MCP server launch enabling external AI tools to access live Clari revenue signals is
      the strategically correct response to AI model commoditization. By making Clari's proprietary dataset
      the standard reference layer for external AI agents including Claude, Gemini, and Microsoft Copilot,
      Clari extends switching costs beyond its application surface area into the broader enterprise
      AI infrastructure stack.
    claimRefs:
      - CP002
      - CP031
      - CP041

