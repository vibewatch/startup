chapter:
  number: 3
  title: Competitors
  summary: >-
    The revenue action orchestration (RAO) market in mid-2026 is contested by Gong ($500M ARR, 55%+ YoY growth),
    Salesforce Agentforce ($800M ARR, 169% YoY), and Outreach ($340M ARR), while the combined Clari-Salesloft
    entity sits at approximately $450M ARR serving 5,000+ organizations. Clari's core moats — proprietary
    forecasting accuracy (95–98%), the merged 10B+ revenue-interaction data corpus, and deep CRM workflow
    integration — are durable against point-solution challengers but face structural displacement risk from
    Salesforce's bundled CRM upsell and Gong's expanding platform footprint. Post-merger integration friction,
    172 WARN-Act layoffs, and a first-time CEO represent near-term execution vulnerabilities that competitors
    are likely exploiting.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >-
      The revenue action orchestration (RAO) competitive landscape as of mid-2026 spans four distinct threat
      categories. First, direct RAO platform peers — Gong and Outreach — compete head-on across conversation
      intelligence, sales engagement, and pipeline forecasting. Second, platform incumbents — Salesforce
      Agentforce and HubSpot — compete via bundled CRM capabilities, leveraging existing installed-base
      relationships to undercut standalone RAO pricing. Third, data intelligence and ABM providers — ZoomInfo
      and 6sense — address adjacent budget lines in account targeting and buyer intent data, creating budget
      competition even where product substitution is limited. Fourth, emerging AI-native point solutions and
      specialist forecasting tools such as Aviso and People.ai target specific workflow components in the
      mid-market. The Clari-Salesloft merger, which closed in December 2025 and united approximately $450M in
      combined ARR across 5,000-plus organizations, was explicitly a scale-building move to compete against
      Gong's $500M-plus ARR platform and Salesforce's rapidly expanding Agentforce suite. The combined entity
      is now the second-largest pure-play RAO platform by ARR, behind Gong. Steve Cox, appointed CEO at merger
      close with no prior Clari tenure, is navigating integration of two overlapping platforms — a process
      Forrester characterized as carrying significant product overlap risk with "more questions than answers."
      Clari's long-term competitive position rests on whether the merged data corpus and execution integration
      can translate into durable differentiation before Salesforce's bundling and Gong's capability expansion
      neutralize the forecasting premium.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP028
      - CP030
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: direct-peers-gong-outreach
    title: "Direct Peers: Gong and Outreach"
    body: >-
      Gong is the most consequential direct competitor to Clari in mid-2026. Having surpassed $500M ARR in
      May 2026 with 55%-plus year-over-year growth — its tenth consecutive quarter of accelerating growth rate
      — Gong now serves 4,000-plus enterprise customers, including half of the Fortune 10. Gong's AI advantage
      rests on the Revenue Graph, which converts emails, calls, meetings, and deals into a proprietary living
      memory layer that powers automated decisions about deal prioritization, team risk signals, and next-best
      actions. Gong's modular product suite (Foundation for call recording and analytics, Engage for sales
      sequences, Forecast for pipeline management) creates direct competition across every core Clari-Salesloft
      use case. Full-suite pricing runs $200–$250 per user per month, broadly comparable to Clari's $200–$310
      range, meaning Clari cannot compete on price alone. G2 user ratings in 2026 place Clari at 4.6–4.7 and
      Gong at 4.7–4.8, with Gong rated higher for rep coaching and UI while Clari leads on forecasting
      accuracy and executive-level reporting. Many large enterprises run both platforms simultaneously,
      creating a combined stack tax estimated at approximately $500 per user per month. Gong added more
      $1M-plus customers in the last two quarters before May 2026 than in the previous six combined, signaling
      accelerating enterprise displacement potential in accounts where rep coaching is the primary driver.
      Gong's 50% of customers running multiple products as of May 2026, with flagship AI capability use
      growing over 200% year-over-year, signals increasing platform stickiness for Gong customers that
      mirrors Clari's own lock-in story. Outreach, with approximately $340M ARR serving 6,000-plus enterprise
      customers, competes primarily in the sales engagement layer — email sequencing, dialer, and rep workflow
      automation — where Salesloft has historically been strongest. Outreach raised $489M total at a $4.4B
      Series G valuation in June 2021 and operates an enterprise-only GTM with deals starting at $2,500 per
      month, positioning it as a direct replacement candidate for the Salesloft half of the combined platform
      in organizations considering post-merger consolidation.
