company:
  name: Clari
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Clari is a Sunnyvale-based enterprise revenue orchestration company incorporated in 2012 and backed by approximately
    $510 million in capital, most recently at a $2.6 billion post-money valuation in January 2022. Following its
    December 2025 merger with Salesloft, the combined entity serves over 5,000 organizations managing $10 trillion in
    annual revenue, though 2026 WARN Act layoffs and a founder-CEO departure signal material post-merger integration
    strain requiring continued diligence.
sections:
  - id: section-identity
    title: Identity, Headquarters, and Business Model
    body: >
      Clari was incorporated as a California company in September 2012, with product commercialization typically
      attributed to 2013 in secondary sources reflecting the gap between incorporation and go-to-market launch. The
      company was originally based in Redwood City, California, before relocating its headquarters to Sunnyvale,
      California, at 1154 Sonora Court, where it remains as of the June 2026 run date. Clari operates as a private
      company at the Series F stage, with its most recently disclosed post-money valuation of $2.6 billion dating to the
      January 2022 funding close—now more than four years stale. Its core product is an AI-powered revenue
      orchestration platform designed for enterprise B2B revenue teams, aggregating signals from CRM systems, email,
      calendar, and sales conversations to produce predictive forecasting, pipeline management, and revenue workflow
      automation. The business model is an enterprise SaaS subscription typically priced in the $200–$310 per user per
      month range, making it a board-level procurement decision for mid-market and enterprise buyers. Clari positions
      itself as a horizontal platform spanning sales, marketing operations, and customer success, not a point solution
      limited to forecasting alone. As of 2024, the company served approximately 1,500 enterprise customers before the
      Salesloft merger transformed the scale to 5,000-plus organizations. The KPI snapshot below summarizes the verified
      public metrics that later chapters will reuse as ground truth, with explicit gaps for private metrics unavailable
      from public sources.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO007
      - CO008
      - CO023
      - CO044
    tableRefs:
      - TO001
    figureRefs:
      - FO003

  - id: section-founders-leadership
    title: Founders, Leadership, and Governance
    body: >
      Andy Byrne and Venkat Rangan co-founded Clari in 2012. Byrne served as CEO from founding through the December
      2025 merger completion with Salesloft, acting as the central figure in fundraising, customer trust, and product
      vision for more than a decade. Rangan, who previously co-founded Clearwell Systems—an e-discovery company
      acquired by Symantec in 2011—joined Clari as Chief Technology Officer and has continued in that role through the
      post-merger period. Public records reviewed in this chapter do not identify Carlos Delatorre as a co-founder of
      Clari; confirmed co-founders are Byrne and Rangan, a finding consistent across Tracxn, PitchBook, Clay, and the
      company's own press materials. On December 3, 2025, upon merger close, Steve Cox was appointed CEO of the combined
      Clari-Salesloft entity. Cox brings more than 25 years of SaaS leadership experience from prior roles including CEO
      of Employ, executive positions at Community Brands, Vertafore, and Chess. The leadership transition from a
      founder-CEO to an external hire is a material diligence signal at a time when the combined company is integrating
      two complex revenue platforms. Governance details of the combined board—including which investor directors hold
      seats and whether Byrne retains any formal advisory role—are not fully disclosed in public materials, representing
      a gap the next diligence refresh should close.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO031
      - CO032
      - CO043
    tableRefs:
      - TO002

  - id: section-capital-investors
    title: Capital Structure, Investors, and Valuation
    body: >
      Clari has raised approximately $510 million in total across seven disclosed rounds spanning from 2014 through
      2022. The capital stack begins with a $6 million Series A in April 2014 led by Sequoia Capital, followed by a $20
      million Series B in June 2014 co-led by Bain Capital Ventures and Sequoia. A $35 million Series C in March 2018
      (Tenaya Capital) and a $60 million Series D in October 2019 (Sapphire Ventures) supported the company through
      product maturation and early enterprise scale. The $150 million Series E in March 2021 was co-led by Silver Lake
      and Khosla Ventures, with Workday Ventures joining an extended Series E tranche in 2021, adding a strategic
      enterprise ecosystem dimension. Eighteen Clari customers completed IPOs in 2021 alone—including Confluent, UiPath,
      Procore, and Samsara—establishing the company's penetration into high-growth enterprise accounts during the Series
      E growth period. The capital formation culminated in a $225 million Series F in January 2022, led by Blackstone
      Growth (BXG), with Silver Lake, Light Street Capital, and Maverick Capital joining as new investors alongside
      existing backers. Blackstone's stated intent to deploy Clari across its 250-plus portfolio companies added a
      go-to-market multiplier to the purely financial return. As of the June 2026 run date, no new equity round,
      convertible note, or updated valuation disclosure has been identified, leaving the $2.6 billion figure more than
      four years stale and requiring a fresh valuation analysis before any investment decision.
    claimRefs:
