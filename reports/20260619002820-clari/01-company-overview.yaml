callouts:
  - calloutType: strength
    title: RevDB proprietary dataset creates a durable competitive moat
    body: >-
      Clari's RevDB aggregates over 10 billion revenue actions and 1 trillion buyer signals across thousands of
      enterprise workflows, building a flywheel in which more usage improves AI model quality for all customers. This
      self-reinforcing data advantage is difficult to replicate quickly and represents a core source of long-term
      defensibility that later chapters should evaluate against competitor data assets.
    claimRefs:
      - CO040
      - CO041
  - calloutType: risk
    title: Founder departure and post-merger layoffs elevate near-term execution risk
    body: >-
      Andy Byrne's transition out of the CEO role at merger close is a significant key-person event at a time when the
      combined company must integrate two complex revenue platforms. The 172 California WARN Act layoffs in the first
      half of 2026 signal ongoing restructuring that may disrupt product velocity, customer success continuity, and the
      cultural integration required for the Salesloft combination to generate its projected synergies.
    claimRefs:
      - CO031
      - CO037
      - CO038
  - calloutType: insight
    title: Merger with Salesloft creates a category-defining Revenue AI platform
    body: >-
      The Clari-Salesloft combination unifies revenue orchestration, sales engagement, conversation intelligence, and
      AI forecasting into one platform serving 5,000-plus enterprises. The resulting dataset scale—$10 trillion in
      annual revenue under management—positions the combined company to train and deploy more powerful revenue AI models
      than either standalone entity could achieve, addressing the boardroom demand for a single system of record for
      enterprise revenue.
    claimRefs:
      - CO033
      - CO034
      - CO041

