  - id: section-adverse-risks
    title: Adverse Events, Post-Merger Risks, and Integration Challenges
    body: >
      The post-merger period has introduced material adverse signals that diligence must treat as current rather than
      historical. Two WARN Act filings in California document 96 layoffs effective January 5, 2026, and 76 additional
      layoffs effective April 11, 2026, totaling 172 workers in Santa Clara County. Both filings cite a reduction in
      force rather than a facility closure, consistent with post-merger consolidation of overlapping roles across the
      combined Clari and Salesloft workforce. The workforce actions, combined with the CEO transition from founder Andy
      Byrne to Steve Cox in December 2025, create measurable key-person and execution risk heading into the combined
      entity's first full operating year. Clari also faces competitive pressure from Gong, which is deeply entrenched in
      conversation intelligence; from Salesforce and other major CRM platforms expanding into revenue orchestration; and
      from AI-native startups building purpose-built forecasting tools that could erode addressable wallet share. The
      last publicly disclosed valuation of $2.6 billion dates to January 2022, prior to the Salesloft merger, the 2026
      WARN Act layoffs, and the broader SaaS multiple compression that has characterized the 2022–2026 environment.
      Any new investor pricing the combined entity must reconcile the four-year valuation gap with the altered cost
      structure, the integration burden, and an evolving competitive landscape in which several well-capitalized rivals
      are targeting the same enterprise revenue operations budget.
    claimRefs:
      - CO035
      - CO036
      - CO037
      - CO038

