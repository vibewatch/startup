  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competition
      missingEvidence: >-
        Independent win-rate benchmarking comparing Clari against Gong, Salesforce Revenue Cloud, and AI-native
        forecasting startups in contested enterprise deals.
      whyItMatters: >-
        Without competitive benchmarking, the risks chapter cannot adequately quantify the probability of customer
        churn to well-funded rivals or the pricing pressure on future renewals.
      diligencePath: >-
        Request G2 and TrustRadius category rankings, analyst competitive teardowns (Forrester Wave for Revenue
        Intelligence), and Clari's internal win/loss data for late-stage enterprise deals.
      relatedQuestionRefs:
        - QO020

    - type: stale
      severity: material
      topic: arr
      missingEvidence: >-
        Combined Clari-Salesloft ARR or revenue run rate for fiscal 2025 or 2026 from an independent or company-filed
        source.
      whyItMatters: >-
        The most recent validated ARR figure is $158.5M for standalone Clari in 2024; the post-merger revenue profile
        is unknown and is a critical input to any valuation analysis of the combined entity.
      diligencePath: >-
        Request audited or board-approved combined revenue figures from management; supplement with Latka or
        industry-tracker refreshes once the merged entity has operated for a full fiscal year.
      relatedQuestionRefs:
        - QO022

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Post-merger board composition of the combined Clari-Salesloft entity, including which investor directors hold
        seats, observer rights, and any veto provisions.
      whyItMatters: >-
        Governance structure directly affects future strategic decisions, secondary liquidity options, and the balance
        of power between Blackstone, Silver Lake, and legacy Salesloft investors.
      diligencePath: >-
        Request updated corporate governance documents and board composition schedules from management or primary
        investor contacts.
      relatedQuestionRefs: []
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: material
      topic: integration
      missingEvidence: >-
        Detailed integration roadmap, product consolidation timeline, and cost synergy estimates for the Clari-Salesloft
        combination.
      whyItMatters: >-
        Integration execution risk is one of the highest-priority near-term risks; without a published or disclosed
        plan the timeline and budget impact cannot be independently assessed.
      diligencePath: >-
        Request management's integration plan including product deprecation schedule, platform migration timeline for
        Salesloft customers, and anticipated one-time integration costs.
      relatedQuestionRefs: []

    - type: missing-source
      severity: minor
      topic: funding
      missingEvidence: >-
        Comparable total-raised benchmarks for Gong and other peer revenue-intelligence platforms to contextualize
        Clari's $510M capital position relative to competitors.
      whyItMatters: >-
        Understanding the capital efficiency and relative firepower of key competitors informs the market-analysis and
        valuation chapters.
      diligencePath: >-
        Gather PitchBook or Crunchbase funding summaries for Gong and three to five comparable B2B revenue-intelligence
        platforms.
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO003

