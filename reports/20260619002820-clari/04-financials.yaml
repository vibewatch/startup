chapter:
  number: 4
  title: Financials
  summary: >-
    Clari's standalone ARR rose from $97.5 million in 2023 to $158.5 million in 2024, a $61.0 million absolute gain
    and 62.6% year-over-year growth, before the December 2025 Salesloft merger lifted the combined estimated ARR to
    approximately $450 million across 5,000-plus organizations. Public capital-raise records span roughly $496
    million to $510 million in lifetime funding, anchored by the $225 million January 2022 Series F at a $2.6
    billion valuation. That valuation is now four years stale, implying about 5.8x EV/ARR against the post-merger
    revenue estimate, while gross margin, burn, NRR, and combined-entity financials remain undisclosed and keep
    capital adequacy underwriting blocked.
sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Clari operates a modular, per-seat SaaS subscription platform with annual contracts required for all standard
      enterprise deployments—no monthly billing option exists. Four product lines compose the post-merger platform:
      Forecast and Inspect (core revenue intelligence), Copilot (AI conversation intelligence), Groove (sales
      engagement workflows from the 2023 Groove Labs acquisition), and the newly integrated Salesloft engagement
      analytics suite. Independent benchmark analysis estimates Forecast at $100–$120 per user per month, Copilot at
      $60–$110, and Groove at $50–$80. The full platform combining all modules is benchmarked at $200–$310+ per user
      per month before implementation. Professional services fees add $15,000–$75,000 in the first year, representing
      20–30% of total year-one cost for mid-market and enterprise deployments. Average contract value (ACV) was
      approximately $105,700 in 2024 per Latka third-party data, confirming a predominantly enterprise customer base.
      Clari employs a direct, high-touch consultative sales motion targeting organizations with 100 or more sales
      representatives; channel-led or reseller-driven GTM is not a material revenue motion. Post-merger customers face
      expected renewal price increases of 10–20% annually per independent analysis of post-merger commercial dynamics.
      Blackstone Growth, which led the $225M Series F, committed to deploy Clari across 250 or more of its portfolio
      companies, providing a structural enterprise channel. Implementation timelines range from 6–8 weeks for teams
      under 50 users to 12–16 weeks for enterprise deployments exceeding 500 users.
    claimRefs:
      - CI001
