      is stale by four years. Combined ARR is analyst-estimated (Forrester), not officially disclosed. Gross
      margin range is drawn from 2025 SaaS benchmark studies, not Clari-specific data.
    claimRefs:
      - CI011
      - CI013
      - CI044
      - CI045

  - id: FI004
    title: Post-Merger Capital Intensity and Cost Structure Map
    type: waterfall
    layout: standard
    summary: >-
      Estimated annual cost structure for the combined Clari-Salesloft entity relative to ~$450M combined ARR,
      based on SaaS industry benchmarks and disclosed post-merger cost signals.
    data:
      items:
        - label: "Combined ARR baseline (est.)"
          value: 450
          detail: "Forrester analyst estimate; not officially disclosed. Starting waterfall reference."
        - label: "Less: S&M (est. 20–25% of ARR)"
          value: -101
          detail: "Industry benchmark for enterprise SaaS; Clari's direct, high-touch model implies higher load."
        - label: "Less: R&D (post-merger doubling pledge)"
          value: -90
          detail: "Pre-merger R&D likely 15–20% ARR; doubling pledge adds incremental spend."
        - label: "Less: COGS incl. services (est. 20–30% of ARR)"
          value: -108
          detail: "Software COGS + professional services COGS at blended 70–80% gross margin assumption."
        - label: "Less: G&A (est. 8–10% of ARR)"
          value: -40
          detail: "Typical G&A load for combined-entity scale post-merger; includes integration overhead."
        - label: "Implied Operating Residual (illustrative range)"
          value: 111
          detail: "Not a disclosed figure; illustrative of remaining margin if benchmarks apply. Actual unknown."
    approximationNotes: >-
      All values are illustrative estimates derived from enterprise SaaS benchmark studies (burklandassociates.com,
      benchmarkit.ai, highalpha.com 2025) applied to the analyst-estimated $450M combined ARR. Clari has not
      disclosed any financial line items. Actual R&D, S&M, and COGS may differ materially from these benchmarks.
      Post-merger integration costs and severance are not captured separately but are partially embedded in G&A.
    claimRefs:
      - CI027
      - CI031
      - CI036
      - CI041

callouts:
  - calloutType: risk
    title: Four-Year Valuation Staleness and Capital Gap
    body: >-
      The $2.6 billion post-money valuation dates to January 2022—four years before the Salesloft merger,
      the 2026 WARN Act restructuring, and the broad SaaS multiple compression that halved or worse typical
      private-company EV/ARR multiples. No secondary transaction, updated mark, or new equity round has been
      identified. Any investment decision based on the $2.6B figure is underwriting a stale price that requires
      fresh negotiation.
    claimRefs:
      - CI036
      - CI044
      - CI046

  - calloutType: risk
    title: Capital Adequacy and Integration Opacity Are Blocking Diligence Items
    body: >-
      Neither cash on hand, burn rate, nor runway is publicly disclosed. The post-merger integration is
      independently described as incomplete six months after close. The 172 California WARN Act layoffs indicate
      cost pressure, yet the R&D doubling pledge signals offsetting investment. Without a management-provided
      financial model, cohort analysis, and combined P&L, the capital runway and churn risk for the merged
      entity cannot be assessed.
    claimRefs:
      - CI040
      - CI041
      - CI043

  - calloutType: strength
    title: Strong ARR Growth and Enterprise ROI Evidence
    body: >-
      Clari's 62.6% standalone ARR growth in 2024—well above the ~26% SaaS market median—combined with a
      Forrester TEI finding of 398% ROI and $96.2M three-year NPV for enterprise customers, provides
      meaningful evidence of product value and revenue growth quality. The $105,700 ACV and annual-contract
      model support predictable cash flows if churn is controlled.
    claimRefs:
      - CI011
      - CI012
      - CI032

