  - id: capital-adequacy-burn-layoffs
    title: Capital Adequacy, Burn Signals, and Post-Merger Cost Actions
    body: >-
      Clari's capital adequacy is opaque. Cash on hand, monthly burn rate, and runway length are not publicly
      disclosed as of June 2026. The most recent confirmed liquidity event was the January 2022 Series F close,
      now more than four years stale, with no subsequent equity or debt financing identified. The December 2025
      Salesloft merger—structured as an all-equity transaction—would not have injected operating cash; any associated
      integration costs, including severance, platform consolidation, and R&D system unification, remain
      unquantified in public sources. The company's pledge to double R&D investment post-merger signals incremental
      technology spending that partially offsets labor savings from restructuring. Two California WARN Act notices
      documented 172 layoffs: 96 workers effective January 5, 2026 (notice filed November 6, 2025) and 76 workers
      effective April 11, 2026 (notice filed February 10, 2026), both at Clari's Sunnyvale headquarters at 1154
      Sonora Court. Third-party commentary characterized these reductions as post-merger role consolidation targeting
      overlapping sales, marketing, and engineering functions. The 172 affected workers represent an estimated 11–22%
      of combined post-merger headcount depending on workforce size assumptions, indicating material but bounded
      restructuring. No planned use of remaining cash, debt obligations, or next-round financing trigger has been
      publicly disclosed, leaving capital runway as one of the most critical open questions for any investor
      underwriting the combined entity.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
