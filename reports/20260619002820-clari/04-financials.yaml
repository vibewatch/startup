  - id: financial-verdict-gaps
    title: Financial Verdict and Diligence Blockers
    body: >-
      Clari's financial profile presents a well-evidenced revenue growth story alongside material opacity risks that
      preclude a formal underwriting without management-account access. Standalone ARR of $158.5 million with 62.6%
      YoY growth in 2024 was strong by peer benchmarks, and the combined post-merger ARR estimate of approximately
      $450 million implies a meaningful market position in enterprise revenue orchestration. Revenue quality
      indicators are encouraging: annual contracts, an enterprise-skewed $105,700 ACV, and a Forrester TEI finding of
      398% ROI for enterprise customers all point toward a sticky, high-value subscription base. However, the $2.6
      billion valuation dates to January 2022—four years before the Salesloft merger, the 2026 WARN Act layoffs, and
      the SaaS multiple compression that brought typical growth-stage private SaaS valuations from 15–20x to 5–8x
      ARR. Using the stale $2.6 billion against $450 million combined ARR implies approximately 5.8x EV/ARR—moderate
      under current market conditions but stale by four years. Revenue quality for the combined entity is difficult
      to confirm: no gross margin, operating margin, NRR, Salesloft standalone P&L, or combined burn rate has been
      publicly disclosed. Product integration has been described as incomplete six months post-close, creating
      execution risk and potential customer attrition in the near term. Any investment decision requires audited
      financials, cohort analysis, and a post-WARN headcount snapshot before underwriting the combined entity at any
      valuation.
    claimRefs:
      - CI044
      - CI045
      - CI046
      - CI048
      - CI049
      - CI050
