  - id: arr-trajectory-traction
    title: ARR Trajectory and Disclosed Public Traction
    body: >-
      Clari's publicly available ARR data traces a growth arc from $22.6 million in 2020 to $97.5 million in 2023 and
      $158.5 million in 2024—five years of uninterrupted growth per Latka third-party data collected through November
      2025. The 2023-to-2024 step-up added approximately $61.0 million of incremental ARR and produced 62.6%
      year-over-year growth, materially above the roughly 26% median ARR growth rate for private SaaS companies in
      2025 benchmark studies, suggesting Clari benefited from the Groove integration and enterprise upsell motion. The
      2022-to-2024 two-year CAGR of approximately 38% per annum confirms sustained momentum even against a market
      backdrop of slowing SaaS growth. The December 2025 merger with Salesloft materially changed the revenue base.
      Forrester's August 2025 analyst brief—the most authoritative third-party estimate available—pegged the combined
      entity's ARR at approximately $450 million, implying Salesloft contributed roughly $290 million of ARR to the
      combination, nearly doubling Clari's standalone 2024 run rate. The combined entity reports managing $10 trillion
      in annual customer revenue across 5,000-plus organizations, a measure of platform activity breadth rather than
      Clari's own reported revenue. Pre-merger Clari served approximately 1,500 enterprise customers; the combined
      entity serves over 5,000 globally per December 2025 merger completion materials. No official financial disclosure
      for the combined entity has been identified through the June 2026 run date, leaving the $450 million combined ARR
      estimate unverified by a primary-source filing or official announcement, a material gap for any investment
      underwriting.
    claimRefs:
      - CI011
      - CI012
