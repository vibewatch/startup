      whyItMatters: >-
        Product integration quality directly affects renewal rates and near-term ARR trajectory; incomplete
        integration creating customer friction could suppress the $450M combined ARR run rate through elevated
        churn before the merged platform matures.
      diligencePath: >-
        Request customer cohort data post-December 2025 close showing renewal rates by product line, NPS
