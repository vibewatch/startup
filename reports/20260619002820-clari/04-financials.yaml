  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: >-
        Clari's current cash balance, monthly burn rate, and estimated runway for the combined entity post-merger.
      whyItMatters: >-
        Capital adequacy cannot be assessed or underwritten without cash and burn data; a company four years
        from its last equity raise with 172 recent layoffs has ambiguous runway status.
      diligencePath: >-
        Request CFO financial model, recent bank-statement summary, and a cash bridge through 12 months from
        management in the first diligence meeting.
      relatedQuestionRefs:
        - QI012

    - type: missing-source
      severity: material
      topic: arr-trajectory
      missingEvidence: >-
        An official Clari management disclosure or audited revenue statement confirming the combined 2025/2026
        ARR figure; the ~$450M estimate is analyst-derived from Forrester, not primary-source verified.
      whyItMatters: >-
        The combined ARR baseline is the primary growth anchor and valuation multiple input; an unverified
        estimate introduces material uncertainty in underwriting.
      diligencePath: >-
        Request audited or board-reviewed consolidated revenue statement for the combined Clari-Salesloft
        entity covering at least one full post-merger quarter.
      relatedQuestionRefs:
        - QI015

    - type: private-evidence-only
      severity: material
      topic: margin
      missingEvidence: >-
        Gross margin (software vs. services), operating margin, and EBITDA for the combined entity; none
        are publicly disclosed.
      whyItMatters: >-
        Without margin data, the profitability profile and path to cash-flow positivity cannot be modeled;
        the company's attractiveness at a 5.8x EV/ARR multiple depends heavily on underlying margin structure.
      diligencePath: >-
        Request segment-level P&L with separate software gross margin, services gross margin, and operating
        margin from management accounts.

    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: >-
        The merger consideration paid by Clari to acquire Salesloft from Vista Equity Partners, and any debt
        or credit obligations assumed as part of or since the transaction.
      whyItMatters: >-
        Cannot assess total post-merger liabilities, capital structure, or potential debt service obligations
        without the merger consideration and any assumed debt.
      diligencePath: >-
        Request merger definitive agreement, cap table post-merger, and confirmation of any debt instruments
        assumed or issued in connection with the Salesloft transaction.
      relatedQuestionRefs:
        - QI010

    - type: missing-source
      severity: minor
      topic: layoffs
      missingEvidence: >-
        Current combined headcount by function for the merged Clari-Salesloft entity following the 2026
        WARN Act layoffs and ongoing integration.
      whyItMatters: >-
        Cannot compute post-merger ARR-per-employee efficiency, R&D-to-revenue ratio, or assess whether
        the WARN Act reductions were sufficient to stabilize burn without this data.
      diligencePath: >-
        Request current headcount by function and the associated compensation envelope from management; a
        simple department-level summary would suffice.
      relatedQuestionRefs:
        - QI016

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Net revenue retention (NRR), gross revenue retention (GRR), and cohort-level churn data for Clari's
        enterprise customer base; these are not publicly disclosed.
      whyItMatters: >-
        Revenue quality depends entirely on retention; without NRR and GRR, the $450M ARR estimate and
        62.6% growth rate cannot be validated as durable, and the 5.8x EV/ARR multiple may be mis-priced
        if net dollar retention is below the ~101% SaaS median.
      diligencePath: >-
