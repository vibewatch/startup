- id: product-reliability-and-dependency-risk
  title: Product Reliability and Dependency Risk
  body: 'Clari''s product story is strongest when the workflow loop closes, but that same architecture creates material dependency risk. The March 2026 release notes show meaningful progress — Salesloft side panel access, one-click AI emails, task creation from Clari, and Copilot follow-up actions — yet they also show how fragile the experience can be at the integration layer. In the same release, customers were told that Zoom had tightened third-party access requirements and that failing to re-sync would stop Copilot from joining meetings, recording calls, and generating transcripts. Groove-in-Copilot documentation adds another operational dependency: admins must provision API keys and secrets, and only recorded calls are available in downstream workflows. Clari''s MSA makes the dependency explicit: third-party-service changes can cause malfunction, and unauthorized customer-side CRM changes shift performance risk back to the customer. The trust site likewise states that uptime figures
    can reflect downtime tied to external applications, networks, or equipment. Together, those sources imply that Clari''s reliability is not just a code quality question; it is a multi-system coordination problem spanning Salesforce, Google, Zoom, Groove, Salesloft, and customer admins. That matters because Clari sells itself as a system of record for revenue execution. If data capture, call records, or action-taking workflows go stale, the product''s credibility erodes directly inside weekly forecast and inspection cadences rather than in a peripheral dashboard. For a platform sold into high-stakes enterprise operating rhythms, even modest integration fragility can have outsized renewal consequences.'
