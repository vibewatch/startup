- id: TR005
  title: Mitigation and thesis-break triggers table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Integration execution
    - Roadmap simplification slips
    - No clear module rationalization, packaging simplification, or migration milestones by next major refresh
    - Move to hold / research-more until product overlap and support burden are credibly declining
  - - Customer durability
    - Renewal friction or concentration surprise
    - Evidence of elevated churn in large accounts, material price pushback, or top-customer concentration above underwriting assumptions
    - Re-cut base-case growth and valuation; prioritize downside scenario
  - - Legal / privacy / AI compliance
    - Material inquiry, breach, or AI-governance failure
    - Regulator inquiry, major customer security exception, or unmanaged MCP / agent incident
    - Treat as thesis impairment because trust is core to enterprise deployment
  - - People / services capacity
    - Second major layoff wave or implementation bottleneck
    - Another large restructuring before platform convergence, or rising backlog / declining support metrics
    - Assume synergy capture is coming at the expense of customer continuity
  - - Exit / financing
    - Reset valuation event
    - Down-round, highly structured financing, or strategic process below the stale 2022 narrative
    - Use new mark as evidence that market confidence in integration and growth has weakened
  notes: Each trigger is intentionally monitorable. The goal is to separate normal integration noise from events that should materially change underwriting.
