  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, cohort NRR/GRR, and overlap between legacy Clari, Groove, and Salesloft logos.
    whyItMatters: Without concentration and retention denominators, it is impossible to distinguish a broad durable install base from a valuable but fragile enterprise roster.
    diligencePath: Request cohort retention, gross retention, NRR, and top-20 customer concentration from management and test renewal narratives in reference calls.
    relatedQuestionRefs:
    - QR026
    - QR027
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: product-rationalization
    missingEvidence: Module-level migration plan, feature deprecation schedule, support model, and overlap-resolution roadmap across Clari, Groove, and Salesloft.
    whyItMatters: The merger thesis depends on simplification; without a dated roadmap, customers may experience prolonged product ambiguity and implementation drag.
    diligencePath: Obtain product roadmap by module, current staffing by product line, and milestone owners for every major convergence decision.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR029
    - QR032
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: ai-governance
    missingEvidence: Internal AI policy, agent inventory, red-team findings, approval flow for high-privilege actions, and audit-log retention for MCP-connected workflows.
    whyItMatters: Public governance guidance exists, but the public source set does not prove Clari has implemented mature controls proportionate to its new agentic surface area.
    diligencePath: Review internal security architecture, AI governance committee charter, tool allowlists, and incident-response tabletop results.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
    - QR031
    - QR014
    relatedTableRefs:
    - TR001
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: legal-inquiry-log
    missingEvidence: Customer security exceptions, regulator inquiries, privacy complaints, and unresolved contractual disputes tied to data handling or integration outages.
    whyItMatters: Enterprise software legal risk often surfaces first through sales friction and customer escalations before it becomes public enforcement or litigation.
    diligencePath: Ask counsel and RevOps for the last 24 months of privacy, security, procurement, and regulator escalations by issue type and resolution status.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR030
    - QR032
    relatedTableRefs:
    - TR001
    - TR005
