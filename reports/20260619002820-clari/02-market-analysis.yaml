callouts:
  - calloutType: insight
    title: RAO Category Creation Is a Double-Edged Market Signal
    body: >-
      Gartner's inaugural Magic Quadrant for Revenue Action Orchestration formalizes the market and reduces
      buyer education costs—but it also creates a transparent competitive rubric that levels the playing field
      between Clari-Salesloft, Gong, Salesforce Agentforce, and Outreach. The Clari-Salesloft merger's primary
      market benefit (combined data scale and end-to-end coverage) must now be proven in head-to-head evaluations
      against Gong's $500M ARR platform and Salesforce's distribution advantage, not just in category narrative.
    claimRefs:
      - CM029
      - CM030
      - CM031
      - CM032
  - calloutType: risk
    title: AI Agent Disruption Threatens Per-Seat SaaS Pricing Model
    body: >-
      The same AI adoption mandate that drives RevOps demand also undermines the per-seat SaaS pricing model
      underpinning Clari's $200–$310/user/month revenue base. If enterprise AI agents reduce the number of
      human RevOps seats required, Clari must evolve to outcome-based or agent-action pricing or risk ARR
      erosion as customers reduce license counts while maintaining the same workflow automation footprint.
    claimRefs:
      - CM027
      - CM028
      - CM041
  - calloutType: recommendation
    title: Prioritize SAM Penetration Evidence Over TAM Scale Arguments
    body: >-
      The $4–5B 2026 revenue intelligence TAM and $10–12B 2030 projection are directionally useful but
      carry high definitional uncertainty. Investors should prioritize empirical SAM penetration evidence—
      net new logos per quarter, expansion ARR from existing 5,000+ accounts, and Gartner Critical
      Capabilities scores relative to Gong—over broad TAM narratives to assess Clari-Salesloft's actual
      market execution as of 2026.
    claimRefs:
      - CM004
      - CM007
      - CM022
      - CM030

