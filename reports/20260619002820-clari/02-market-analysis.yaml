          label: Category Awareness (Gartner RAO MQ / Hype Cycle)
          description: >-
            Gartner's December 2025 RAO MQ creates formal category awareness; enterprises can now benchmark
            vendors against a recognized rubric, reducing market education cost for Clari-Salesloft.
        - id: evaluation
          label: RFP / Vendor Evaluation (11–20 stakeholder committee)
          description: >-
            Enterprise buying committees average 11–20 stakeholders across CRO, CFO, IT, legal, and
            procurement; formal RFP/RFI process standard for $100K+ ACV contracts.
        - id: poc
          label: Proof-of-Concept / Pilot (30–90 days)
          description: >-
            Enterprise RevOps deals require 30–90 day POC phases demonstrating forecast accuracy, CRM
            integration, and AI pipeline signal quality before contract signature.
        - id: contract
          label: Contract Signature (120–270 day cycle)
          description: >-
            Average enterprise SaaS deal cycle for $100K–$250K ACV is approximately 170 days; $500K+
            deals approach 270 days, directly governing Clari time-to-revenue for new logos.
        - id: deployment
          label: Platform Deployment and Integration
          description: >-
            Full RAO deployment requires Salesforce CRM integration, data pipeline configuration, and
            user onboarding across sales, RevOps, and management personas—typically 60–180 days post-close.
        - id: roi
          label: Measured ROI / Expansion (6–18 month ramp)
          description: >-
            Enterprise accounts achieving Forrester TEI-equivalent 398% ROI require 6–18 month ramp;
            5,000+ combined Clari-Salesloft customers represent varying maturity across this journey.
