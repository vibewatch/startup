  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market sizing
      missingEvidence: >-
        An explicit Gartner or Forrester dollar figure for the RAO enterprise-only SAM; all current public
        sources provide only qualitative characterizations ("multi-billion") or broad TAM aggregations.
      whyItMatters: >-
        Without a primary-source SAM figure, the Clari-Salesloft penetration rate and SOM estimates in this
        chapter are analyst derivations rather than verified benchmarks, which reduces confidence in valuation
        and market-share conclusions.
      diligencePath: >-
        Obtain a Gartner market forecast subscription or request the RAO Critical Capabilities dollar sizing
        from Gartner directly; alternatively, request Clari management to share their internal TAM/SAM model.
      relatedQuestionRefs:
        - QM027

    - type: stale
      severity: material
      topic: market sizing
      missingEvidence: >-
        Any recent analyst report (2026) specifically challenging or contradicting the $10–12B 2030 revenue
        intelligence market projection with a lower, more conservative range or different methodology.
      whyItMatters: >-
        The wide range of TAM estimates ($1.2B narrow to $240B broad) and the lack of a clearly adverse
        analyst counterpoint creates a risk of overstating the market opportunity in the absence of a
        disconfirming estimate.
      diligencePath: >-
        Search for Forrester Wave or IDC MarketScape reports for revenue operations technology published
        in 2026 that may apply narrower scope definitions or lower growth assumptions.
      relatedQuestionRefs:
        - QM026

    - type: missing-source
      severity: material
      topic: customer count
      missingEvidence: >-
        Net new logo acquisition rate and customer churn data for the combined Clari-Salesloft entity
        post-merger in H1 2026; no public disclosure available.
      whyItMatters: >-
        Without post-merger customer net adds or churn data, it is impossible to assess whether the 5,000+
        customer count is growing or declining as integration friction affects retention.
      diligencePath: >-
        Request from Clari management the H1 2026 net new logo count, gross churn rate, and NRR for the
        combined entity; cross-check against Salesloft customer reference checks.
      relatedQuestionRefs:
        - QM028

    - type: missing-source
      severity: minor
      topic: competitive position
      missingEvidence: >-
        Independent analyst or customer reports documenting specific Clari-Salesloft post-merger integration
        failures, platform instability, or customer churn attributed to integration execution.
      whyItMatters: >-
        The 172 WARN Act layoffs and founder-CEO departure are adverse signals but do not directly document
        customer impact; a confirmed customer churn pattern would materially change the market-share analysis.
      diligencePath: >-
        Search G2 and Gartner Peer Insights for reviews posted in Q1–Q2 2026 mentioning integration issues
        or service degradation; check LinkedIn for customer-facing team departures in engineering and CS roles.
      relatedQuestionRefs:
        - QM029
