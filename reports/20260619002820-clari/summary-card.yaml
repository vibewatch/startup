  topStrengths:
    - >-
      Clari has real enterprise scale, with roughly $158.5 million of standalone 2024 ARR and a combined post-merger
      platform reaching more than 5,000 organizations.
    - >-
      The merged Clari-Salesloft stack now spans forecasting, deal inspection, conversation intelligence, sales
      engagement, and AI workflow automation on a shared revenue dataset.
    - >-
      Large-enterprise customer proof and analyst category recognition suggest Clari occupies a credible leadership
      position in Revenue Action Orchestration rather than a niche point-solution slot.
    - >-
      Secondary-market demand in 2026 implies investors still ascribe meaningful value to the asset despite broader SaaS
      multiple compression.
  topRisks:
    - >-
      Public disclosure still omits audited post-merger ARR, NRR, gross margin, burn, net cash, and a clear bridge
      between standalone Clari economics and the combined entity.
    - >-
      The Salesloft merger introduced leadership change, product overlap, and 172 California WARN-notice layoffs in
      2026, all of which raise integration and execution risk.
    - >-
      Clari competes against better-capitalized or faster-disclosing rivals including Gong, Salesforce, and other
      revenue-AI suites that can compress pricing and narrow differentiation.
    - >-
      Privacy, AI-governance, and multi-system dependency risk rises as Clari exposes richer customer data and agentic
      workflows across CRM, communications, and external AI surfaces.
  unresolvedGaps:
    - >-
      Audited combined ARR, revenue mix, gross margin, operating burn, net cash, and retention metrics for the merged
      Clari-Salesloft entity.
    - >-
      Customer concentration, post-merger logo overlap, migration churn, and cohort retention by legacy Clari versus
      legacy Salesloft accounts.
    - >-
      Current cap table, preference stack, secondary transaction terms, and whether any 2026 valuation signal would
      translate cleanly into common-equity value.
    - >-
      Product-rationalization roadmap, overlap-retirement plan across Clari, Groove, and Salesloft modules, and evidence
      that platform simplification is improving rather than hurting renewals.
