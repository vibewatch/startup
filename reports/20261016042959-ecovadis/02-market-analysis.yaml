  evidenceGaps:
    - type: missing-source
      severity: material
      topic: tam-sam-som
      missingEvidence: Module-level revenue, buyer counts by segment, regional mix, and management's serviceable-market assumptions for ratings, risk, carbon, and enablement products.
      whyItMatters: Public footprint counts can support market existence and adoption depth, but they cannot be converted into a defendable TAM, SAM, or SOM or into valuation-ready penetration math.
      diligencePath: Request management's current buyer count, paying-supplier count, ARR by module and region, and the internal market model used for board or fundraising materials.
      relatedQuestionRefs: [QM002, QM007]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: minor
      topic: public-footprint-denominators
      missingEvidence: A reconciled definition for companies rated, suppliers screened, industries covered, and buyers served across EcoVadis' public assets.
      whyItMatters: Different denominators and vintages can overstate or understate adoption if an investor treats them as one consistent time series.
      diligencePath: Ask EcoVadis to reconcile current metric definitions and provide a dated footnote pack for public KPI disclosures used in diligence materials.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-conversion-and-depth
      missingEvidence: Cohort-level renewal, expansion, module attach, and supplier-engagement data by buyer program size.
      whyItMatters: The valuation question is how much of the visible network turns into recurring multi-module spend, which public marketing pages do not reveal.
      diligencePath: Review cohort dashboards or board reporting that show supplier-count growth, module adoption, retention, and buyer expansion by segment.
      relatedQuestionRefs: [QM003, QM004, QM007]
      relatedTableRefs: [TM003]
