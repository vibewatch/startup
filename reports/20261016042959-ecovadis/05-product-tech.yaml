  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-and-reliability
      missingEvidence: Public or customer-shared evidence for uptime history, security certifications, incident response, and API/service availability commitments.
      whyItMatters: Technical underwriting depends on whether the platform can be embedded in procurement workflows without introducing hidden operational or compliance risk.
      diligencePath: Request security documentation, trust-center materials, uptime history, and enterprise contract exhibits covering SLA and support commitments.
    - type: missing-source
      severity: material
      topic: implementation-depth
      missingEvidence: Detailed public integration documentation or architecture references for APIs, data schemas, onboarding steps, and buyer-side deployment patterns.
      whyItMatters: Current evidence supports high-level workflow claims but not integration effort, extensibility, or implementation risk by customer segment.
      diligencePath: Request product demos, API docs, reference architectures, and implementation case studies from both buyer and supplier deployments.
    - type: private-evidence-only
