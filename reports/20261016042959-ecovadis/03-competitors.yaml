  rows:
  - - EcoVadis core platform
    - Direct platform
    - 175,000 rated companies; 1,400+ requesters/buyers on official pages
    - Enterprise procurement, supplier-risk, carbon, and sustainability workflows
    - Standardized ratings, network reuse, analyst verification, procurement integrations
    - Public pricing is not disclosed in the assigned pool
  - - Procurement-suite ecosystems (SAP Ariba / Coupa / Jaggaer / Ivalua)
    - Incumbent / adjacent
    - SAP partner listing confirms at least one major suite distributes EcoVadis; no like-for-like scale disclosure for the others in this pool
    - Buyers that want ESG embedded inside existing source-to-pay operations
    - Own the buyer workflow and can bundle ESG into broader procurement processes
    - Assigned pool lacks current direct feature or price pages for the full peer set
  - - CDP-style disclosure tools
    - Adjacent specialist
    - Workiva cites CDP as a known alternative, but without current scale or pricing detail in this pool
    - Organizations focused primarily on environmental disclosure and reporting
    - Clearer fit for narrower disclosure use cases
    - Workiva contrasts CDP with EcoVadis because CDP is narrower than a multi-theme supplier benchmark
  - - Manual questionnaires and spreadsheets
    - Status quo substitute
    - No vendor scale; official EcoVadis pages describe this as fragmented manual work
    - Teams still running supplier ESG collection through ad hoc forms and internal trackers
    - Lowest process change and easiest to start quickly
    - Weak comparability and hard to scale across large supplier bases
  - - Consulting-led prep or internal build
    - Substitute / complement
    - Third-party guides show active preparation and evidence-gathering support, but no shared benchmark network
    - Suppliers or buyers that need support assembling evidence or tailoring a bespoke process
    - Can fit narrow needs or bridge readiness gaps
    - Does not replace buyer-side network reuse, procurement embeds, or shared cross-supplier scoring
  notes: Rows compare the practical ways a buyer can solve the same supplier-sustainability job with the assigned evidence; unsupported scale or pricing fields are marked as missing rather than inferred.
