      - ["Custom integration or slow deployment blocks workflow embedding", "External review says NetSuite and Oracle may require custom API work and typical implementation can take 2-3 months.", "Medium", "Medium-High", "Medium", "Medium", "Need deployment backlog, professional-services utilization, and connector roadmap by system."]
      - ["Worker-voice and grievance operations add service complexity", "Ulula adds whistleblower channels, direct worker communication, and compliance-oriented analytics to the suite.", "Medium", "Medium-High", "Medium", "Medium", "Need moderation staffing ratios, case-resolution KPIs, and independent control testing."]
    notes: "Rows focus on failure modes that could impair product trust, deployment, or renewals; qualitative rankings are evidence-led but not management-verified."
    claimRefs: ["CR001", "CR003", "CR004", "CR005", "CR012", "CR014"]
