callouts:
  - calloutType: "risk"
    title: "Data-quality credibility is the thesis-critical risk"
    body: "If supplier coverage, freshness, and alert accuracy are weaker than the marketing surface implies, the product can stay relevant while still failing the trust threshold needed for embedded procurement decisions."
    claimRefs: ["CR001", "CR004", "CR009", "CR010"]
  - calloutType: "recommendation"
    title: "Legal, incident, and control diligence should be a pre-close gate"
    body: "The retained sources support active mitigation work, but they do not yet clear public-proof gaps on live legal exposure, security history, or control effectiveness for AI-assisted risk decisions."
    claimRefs: ["CR006", "CR007", "CR008", "CR012", "CR014"]
