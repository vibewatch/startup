callouts:
  - calloutType: insight
    title: Category reach is supportable, but the denominator is not singular
    body: Multiple sources support meaningful platform reach, yet they refer to different units—companies rated, businesses using tools, companies screened, and buyer organizations. Later chapters should preserve those distinctions instead of forcing them into one customer or traction number.
    claimRefs: [CO012, CO013, CO014]
  - calloutType: risk
    title: Ownership and named-governance diligence is still open
    body: The assigned pool is strong on product and ecosystem signals but weak on capital-structure and named-leadership disclosure. Any management-quality, control, or valuation conclusion later in the report will need new evidence rather than inference from this overview pack.
    claimRefs: [CO015, CO016]
