artifact: company-overview
slug: ecovadis
runDate: 2026-10-16
company:
  name: EcoVadis
chapter:
  number: 1
  title: Company Overview
  summary: EcoVadis appears to be a large, Paris-headquartered supply-chain sustainability ratings platform with active 2026 product and ecosystem expansion. The assigned public source pool supports current scale and operating-model signals, but it does not support current valuation, financing, or named founder/board disclosures, and its reach metrics use multiple denominators that later chapters should not treat as interchangeable.
sections:
  - id: identity-and-scope
    title: Identity, category, and supported scale metrics
    body: |
      EcoVadis positions itself as a supply-chain sustainability ratings and intelligence platform rather than a single-point disclosure tool. The official homepage describes a connected system that turns fragmented sustainability inputs into comparable ratings across 175,000+ companies in 180+ countries, while also claiming 3 million suppliers screened and coverage across 230 industries. Third-party and company-adjacent sources corroborate meaningful scale, but they use different denominators: one company-authored 2026 report says 150,000+ businesses use EcoVadis tools, while a syndicated July 2026 release cites more than 100,000 companies rated between 2021 and 2025 and 1,400+ buyer organizations. Those figures are directionally supportive of category reach, but they should not be collapsed into a customer-count proxy without fresh corroboration.
    claimRefs: [CO001, CO002, CO004, CO012, CO014]
    tableRefs: [TO001]
  - id: operating-model-and-governance-signal
    title: Operating model, public leadership signal, and governance gaps
    body: |
      The strongest current operating-model evidence is functional rather than biographical. EcoVadis says its assessments combine advanced AI, alignment with UN Global Compact, GRI, and ISO 26000, and review by more than 500 in-house sustainability analysts. A current LinkedIn job posting also shows hiring for a Senior Knowledge Graph Engineer in Barcelona inside a growing AI Center of Excellence, which suggests ongoing investment in AI-enriched product infrastructure and a Spain-based technical footprint. What the assigned pool does not provide is equally important: it does not surface named founders, a current CEO, board composition, or shareholder-control disclosures from direct company leadership pages or independent governance coverage, so later management-quality and ownership judgments need new evidence.
    claimRefs: [CO003, CO007, CO015]
    tableRefs: [TO002]
  - id: milestones-and-open-diligence-items
    title: 2026 milestone cadence and unresolved diligence items
    body: |
      The 2026 evidence pack shows a steady sequence of ecosystem and product milestones rather than a capital-markets story. Independent market-pulse coverage records Community launch and expansion milestones, entry into the EU AI Act Advisory Forum, and publication of a Carbon Data Reliability Level methodology, while the July 2026 Sustainability Ratings Index release demonstrates continuing thought-leadership around supplier data gaps. These milestones support a thesis of product breadth and policy relevance, but not a thesis about current financial quality or ownership structure. The assigned pool still does not support current valuation, total capital raised, debt, or secondary-sale history, and it leaves the stakeholder map partial on investor/control questions.
    claimRefs: [CO005, CO006, CO008, CO009, CO010, CO011, CO012, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI and disclosure status
    columns:
      - Metric
      - Value or status
      - As-of / period
      - Confidence
      - Gap note
    rows:
      - [Founded, 2007, historical, medium, "Supported by third-party explainer rather than a direct corporate history page in the assigned pool."]
      - [Headquarters, "Paris, France", current, medium, "Supported by an independent company-profile page; no direct corporate legal/contact page was assigned."]
      - ["Product scope", "Ratings, risk, carbon-management tools, and e-learning for supply-chain sustainability", current, medium, "Category description is supportable, but segment revenue mix is not."]
      - ["Rated companies", "175,000+ companies rated", current, medium, "Do not equate to paying customers or active buyers."]
      - ["Geographic coverage", "180+ countries", current, medium, "Repeated across multiple sources, but not linked to a dated audited disclosure."]
      - ["Industry coverage", "220-230 industries/categories", current, low, "Source wording varies by page and denominator."]
      - ["Expert review layer", "500+ in-house sustainability analysts", current, medium, "Company-claimed operating input, not total employee headcount."]
      - [Valuation, null, current, low, "No supportable current valuation surfaced in the assigned pool."]
      - ["Total capital raised", null, current, low, "No supportable funding-history total surfaced in the assigned pool."]
      - [Headcount, null, current, low, "Hiring signals exist, but no supportable total employee count surfaced in the assigned pool."]
    notes: "Official and third-party sources use different scale denominators; null means the assigned pool did not support a current figure."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO014, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Leadership slot
      - Public evidence in assigned pool
      - What it suggests
      - Key-person / governance gap
    rows:
      - ["Founder(s)", "Not named in assigned pool", "Founding year is supportable, but founder identity is not.", "Need direct company history or independent founder bios."]
      - ["CEO / named executive leadership", "Not named in assigned pool", "Later chapters should avoid attributing strategy or execution to a named executive without new evidence.", "Need leadership page, executive interview, or filing-quality profile."]
      - ["Board / governance", "Not disclosed in assigned pool", "Governance structure cannot be assessed from this source pack.", "Need board, shareholder, or control disclosures."]
      - ["AI Center of Excellence", "LinkedIn job posting for a Senior Knowledge Graph Engineer in Barcelona", "Signals active AI infrastructure hiring and a Spain-based technical footprint.", "Does not identify the executive owner or reporting structure."]
      - ["Expert review organization", "Official site cites 500+ in-house sustainability analysts", "Supports a human-review layer on top of AI-assisted workflows.", "Not a substitute for named management or board oversight disclosure."]
    notes: "Coverage is partial because the assigned pool supports functional operating-model signals but not named founders, executives, or directors."
    enumerationScope:
      coverage: partial
      basis: "Rows reflect only leadership and governance elements directly evidenced in the assigned public pool, with missing named roles left explicit instead of inferred."
    claimRefs: [CO003, CO005, CO007, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role in ecosystem
      - Why economically or strategically relevant
      - Diligence ask
    rows:
      - ["Rated companies / suppliers", "Supply-side participants assessed and benchmarked on the platform", "They provide the network density that underpins rating, risk, and improvement workflows.", "Need paying-versus-rated conversion and retention data."]
      - ["Buyer organizations", "Demand-side multinationals and procurement teams using EcoVadis outputs", "They appear to drive enterprise adoption and network effects across supplier bases.", "Need concentration by top buyers and contract economics."]
      - ["Named enterprise users", "Reference customers including Johnson & Johnson, L’Oréal, Unilever, Bridgestone, BASF, and JPMorgan", "These names validate enterprise relevance but do not disclose revenue concentration or contract length.", "Need evidence on ACV, logo churn, and expansion."]
      - ["Procurement leaders outside the paid base", "Community audience widened to non-EcoVadis customers in July 2026", "This may expand top-of-funnel reach beyond current subscribers.", "Need evidence on monetization and conversion from Community participation."]
      - ["Regulators and policy forums", "Policy-facing stakeholders linked to AI and supply-chain disclosure requirements", "Regulatory alignment can strengthen product relevance and urgency for buyers.", "Need evidence on formal approvals, certifications, or enforceable market access benefits."]
      - ["Investors / cap-table holders", "Not supportable from assigned pool", "Ownership and control remain unresolved despite refresh priority.", "Need current shareholder list, financing history, debt, and any secondary-sale record."]
    notes: "This is a stakeholder map rather than a true investor map because the assigned pool supports ecosystem participants but not current cap-table disclosure."
    enumerationScope:
      coverage: partial
      basis: "Rows enumerate stakeholder groups evidenced in the assigned 2026 public source pool; investor/control rows remain explicit gaps where no supportable ownership source was assigned."
    claimRefs: [CO001, CO004, CO008, CO009, CO011, CO012, CO014, CO016]
