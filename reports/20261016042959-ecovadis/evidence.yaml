evidenceGaps:
  - type: missing-source
    severity: material
    topic: ownership-gap
    missingEvidence: Current valuation, funding-history total, debt/credit facilities, and any secondary-sale record.
    whyItMatters: Ownership and financing context are necessary for later valuation framing and downside analysis.
    diligencePath: >-
      Retrieve a supportable financing history from company, investor, or filing-quality sources allocated to the
      valuation chapter, then reconcile it against current cap-table evidence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: Named founders, current CEO and executive team, board composition, and control/governance disclosures.
    whyItMatters: Management-quality, key-person dependence, and control-risk judgments cannot rest on functional signals alone.
    diligencePath: >-
      Add a direct leadership page, executive interview, or filing-quality profile source before making named leadership
      claims in later chapters.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Directly sourced founder and executive identities for the leadership table.
    whyItMatters: The table currently shows evidence status rather than a full named roster because the public pack is incomplete.
    diligencePath: >-
      Replace gap rows with sourced names and backgrounds once a direct leadership or independent profile source is
      available.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Current investor, lender, and control-party details that would convert the stakeholder map into a true investor
      map.
    whyItMatters: >-
      Without ownership evidence, later financing and governance analysis risks overstating network stakeholders as
      capital providers.
    diligencePath: >-
      Add current financing and shareholder sources, then split investor/control rows from ecosystem stakeholder rows in
      the valuation chapter.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      Module-level revenue, buyer counts by segment, regional mix, and management's serviceable-market assumptions for
      ratings, risk, carbon, and enablement products.
    whyItMatters: >-
      Public footprint counts can support market existence and adoption depth, but they cannot be converted into a
      defendable TAM, SAM, or SOM or into valuation-ready penetration math.
    diligencePath: >-
      Request management's current buyer count, paying-supplier count, ARR by module and region, and the internal market
      model used for board or fundraising materials.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: public-footprint-denominators
    missingEvidence: >-
      A reconciled definition for companies rated, suppliers screened, industries covered, and buyers served across
      EcoVadis' public assets.
    whyItMatters: >-
      Different denominators and vintages can overstate or understate adoption if an investor treats them as one
      consistent time series.
    diligencePath: >-
      Ask EcoVadis to reconcile current metric definitions and provide a dated footnote pack for public KPI disclosures
      used in diligence materials.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion-and-depth
    missingEvidence: Cohort-level renewal, expansion, module attach, and supplier-engagement data by buyer program size.
    whyItMatters: >-
      The valuation question is how much of the visible network turns into recurring multi-module spend, which public
      marketing pages do not reveal.
    diligencePath: >-
      Review cohort dashboards or board reporting that show supplier-count growth, module adoption, retention, and buyer
      expansion by segment.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current public list pricing, contract minimums, discounting rules, or package boundaries for EcoVadis and directly
      comparable alternatives.
    whyItMatters: >-
      Without rate cards or disclosed customer contracts, the chapter cannot prove whether EcoVadis wins on absolute
      cost, bundle economics, or buyer ROI versus substitutes.
    diligencePath: >-
      Collect current vendor pricing pages, procurement screenshots, or customer contract examples for EcoVadis and
      named alternatives, then rebuild the pricing table with actual price/unit evidence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: named-peer-verification
    missingEvidence: >-
      Current official feature and pricing pages for Coupa, Jaggaer, Ivalua, CDP, and other named alternatives within
      this assigned pool.
    whyItMatters: >-
      The chapter can defend category-level positioning, but not a strict apples-to-apples vendor benchmark, because the
      retained sources lean heavily on EcoVadis surfaces and adjacent commentary.
    diligencePath: >-
      Retain current official product, pricing, and security/compliance pages for each named alternative in the
      discovery pool so the matrix can move from category comparison to vendor comparison.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current ARR or revenue, growth, gross margin, segment mix, and retention metrics.
    whyItMatters: Public network metrics cannot substitute for revenue quality or operating leverage in an underwriting model.
    diligencePath: >-
      Request a finance data room with monthly recurring revenue, segment mix, customer cohorts, GRR, NRR, and
      gross-margin bridge.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Latest cash balance, debt facilities, monthly burn, runway, and next financing trigger.
    whyItMatters: Historical funding announcements do not prove present capital sufficiency or dilution risk.
    diligencePath: Obtain board or lender materials covering cash, debt covenants, burn, runway, and planned financing needs.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Net realized pricing, discounting, and attach rates across supplier subscriptions and buyer-side products.
    whyItMatters: Public plan logic shows monetization paths but not actual ACV, ASP, or upsell yield.
    diligencePath: Request current price book, cohort-level ASP/discount data, and buyer-versus-supplier revenue split.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability
    missingEvidence: >-
      Public or customer-shared evidence for uptime history, security certifications, incident response, and API/service
      availability commitments.
    whyItMatters: >-
      Technical underwriting depends on whether the platform can be embedded in procurement workflows without
      introducing hidden operational or compliance risk.
    diligencePath: >-
      Request security documentation, trust-center materials, uptime history, and enterprise contract exhibits covering
      SLA and support commitments.
  - type: missing-source
    severity: material
    topic: implementation-depth
    missingEvidence: >-
      Detailed public integration documentation or architecture references for APIs, data schemas, onboarding steps, and
      buyer-side deployment patterns.
    whyItMatters: >-
      Current evidence supports high-level workflow claims but not integration effort, extensibility, or implementation
      risk by customer segment.
    diligencePath: >-
      Request product demos, API docs, reference architectures, and implementation case studies from both buyer and
      supplier deployments.
  - type: private-evidence-only
    severity: material
    topic: commercial-packaging
    missingEvidence: >-
      Module-level pricing, attach-rate data, or cohort outcomes showing which product surfaces are widely adopted
      versus cross-sold aspirations.
    whyItMatters: >-
      Without packaging and usage detail, it is difficult to separate mature revenue-bearing modules from broader
      platform positioning.
    diligencePath: >-
      Request SKU packaging, pricing sheets, module penetration metrics, and product-line usage cohorts by buyer and
      supplier account type.
  - type: missing-source
    severity: material
    topic: customer-definition
    missingEvidence: >-
      Segmented counts of paying buyer logos, paying supplier subscriptions, free community members, and overlap between
      those populations.
    whyItMatters: >-
      Public scale metrics are large, but they still mix different customer and participant populations, making revenue
      quality and true customer concentration harder to underwrite.
    diligencePath: >-
      Request current logo, seat, and ARR counts split by buyer, supplier, and community cohorts, plus overlap between
      multi-role accounts.
    relatedQuestionRefs:
      - QU001
      - QU002
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: >-
      NRR, GRR, logo churn, renewal rates, contract-length mix, and top-customer concentration for EcoVadis' own
      commercial base.
    whyItMatters: >-
      These are the core metrics needed to test whether visible adoption converts into durable recurring revenue and
      whether buyer concentration creates downside risk.
    diligencePath: >-
      Request cohort retention, renewal, and concentration data by buyer and supplier segment from management or a
      current board deck.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: An exhaustive, dated list of publicly referenceable EcoVadis customers with deployment status and use-case detail.
    whyItMatters: >-
      The retained proof table is representative rather than exhaustive, so it shows credibility but not full breadth or
      sector mix.
    diligencePath: >-
      Request a current referenceable-customer list or independently verify additional case studies by segment and
      geography.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-adaptation
    missingEvidence: >-
      A complete list of live lawsuits, enforcement matters, licensing requirements, material privacy/security
      obligations, and legal entity-specific compliance regimes.
    whyItMatters: >-
      The regulatory / legal register is only a severity-ranked partial view from assigned public materials, so a clean
      page in this chapter does not prove absence of legal exposure.
    diligencePath: >-
      Run counsel diligence across litigation dockets, privacy terms, DPAs, certifications, and regulator-facing
      correspondence before underwriting.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: data-pipeline
    missingEvidence: >-
      Measured alert accuracy, analyst override rates, uptime, security controls, incident history, and integration SLA
      performance.
    whyItMatters: >-
      The product's value depends on reliable monitoring and embedded workflow execution, but the assigned pool provides
      marketing claims rather than operating proof.
    diligencePath: >-
      Request SOC or equivalent security materials, uptime reports, alert QA metrics, customer references, and
      postmortem history.
    relatedQuestionRefs:
      - QR003
  - type: missing-source
    severity: material
    topic: partner-dependency
    missingEvidence: >-
      Partner revenue concentration, deployment mix by channel, and contractual dependence on specific data or
      carbon-data alliances.
    whyItMatters: >-
      Ecosystem expansion can help scale, but concentrated delivery or data dependencies would raise renewal and margin
      risk.
    diligencePath: >-
      Obtain partner revenue mix, implementation ownership by cohort, and concentration disclosures for strategic
      alliances.
    relatedQuestionRefs:
      - QR004
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR or revenue, growth, gross margin, net or gross retention, burn, and cash-runway data.
    whyItMatters: >-
      Public scale signals do not translate into valuation without current operating quality and cash-efficiency
      evidence.
    diligencePath: Request the latest board pack, audited financial statements, and KPI bridge used in the current financing process.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Latest primary or secondary pricing, current cap table, liquidation preferences, debt terms, and any structured
      financing or project-finance obligations.
    whyItMatters: Downside protection and dilution risk can dominate returns even when the business category is attractive.
    diligencePath: >-
      Obtain the current cap table, financing documents, and any secondary-transaction or preference summaries from
      counsel or management.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: >-
      A clean definition of paying customers versus rated companies, plus cohort retention, expansion, and concentration
      by buyer or supplier segment.
    whyItMatters: Exit quality depends on durable commercial depth, not just network size or product breadth.
    diligencePath: >-
      Request cohort analysis, top-customer concentration, and paid-seat or contract-value segmentation from the
      company.
    relatedQuestionRefs:
      - QV008
