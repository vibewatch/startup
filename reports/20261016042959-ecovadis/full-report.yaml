      - number: '3.3'
        title: Pricing and switching tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Public pricing is the weakest part of the competitive picture in this worker pool, so the comparison has
              to lean on packaging and workflow signals rather than rate-card arithmetic. Even with that limitation, the
              evidence still suggests a clear tradeoff: EcoVadis gains leverage when buyers want a standardized,
              repeatable benchmark that suppliers can reuse, but substitutes remain viable when a buyer only needs
              narrower environmental disclosure, basic supplier attestations, or a consulting-led preparation process.
              Those substitutes likely lower upfront change-management costs for some use cases, while EcoVadis looks
              strongest when the buyer values shared standards, cross-supplier comparability, and integrations into
              broader procurement operations.
