      - number: '2.2'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The market appears two-sided. Enterprise procurement, responsible sourcing, compliance, and carbon-program
              leaders are the economic buyers because they invite trading partners, benchmark suppliers, and use
              dashboards to manage risk and corrective actions. Suppliers are also users and, in some cases, payers
              because they complete one assessment and can reuse the resulting scorecard across multiple customer
              requests. Public descriptions tie adoption to concrete workflows: onboarding and screening suppliers,
              satisfying due-diligence obligations, embedding risk signals inside sourcing tools, collecting supplier
              carbon data, and supporting corrective-action programs. ERP Research's pricing description is especially
              useful because it suggests the commercial expansion variable is supplier count assessed rather than seats
              or buyer spend alone, which implies adoption depth depends on how broadly a customer rolls EcoVadis across
              its supplier base.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
