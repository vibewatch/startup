      - number: '6.2'
        title: Adoption evidence and named proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is directionally strong. EcoVadis' own pages cite 175,000 rated companies and
              millions of screened companies, while the impact page adds 1,400+ requesters/buyers and €2 trillion-plus
              in spend rated. That is enough to conclude the platform is used at meaningful enterprise scale, even if
              the official pages still mix screened, requested, rated, and improvement-program populations rather than
              offering one clean paying-customer denominator. Named proof is also better than logo-only evidence:
              retained sources include customer quotes from CEF, SNCF, Clariant, and Tier 1 Asset Management that
              describe concrete usage patterns ranging from supplier-risk workflows to community-guided implementation
              and commercial win support. The limitation is that every named proof here is still company-curated rather
              than independently audited.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
