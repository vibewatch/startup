  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              The clearest public picture is a procurement-driven subscription model. An independent explainer says
              assessments begin when a customer, prospective customer, or lender asks a company to be rated, while the
              rated company pays the annual subscription and buyer organizations pay separately for access to the
              network. That makes EcoVadis look less like a one-off certification vendor and more like a recurring
              workflow platform whose revenue is tied to renewal, buyer distribution, and plan upsell. Public
              monetization signals also extend beyond the core scorecard: official pages pair ratings with monitoring,
              dashboards, corrective-action plans, e-learning, and a separate carbon module, suggesting land-and-expand
              potential even though realized contract values are not disclosed.
