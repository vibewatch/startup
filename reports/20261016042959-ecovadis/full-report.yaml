  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scores position buyer alternatives by workflow embed and ratings-methodology depth using only retained
      assigned evidence.
    xAxis:
      label: Workflow embed / distribution power
      min: 1
      max: 5
      lowLabel: Manual / standalone
      highLabel: Embedded in buyer systems
    yAxis:
      label: Ratings-methodology depth
      min: 1
      max: 5
      lowLabel: Narrow or bespoke
      highLabel: Multi-theme verified benchmark
    data:
      points:
        - label: EcoVadis core platform
          x: 4.4
          'y': 4.8
          detail: >-
            High on both axes because retained official evidence combines network reuse, analyst-reviewed methodology,
            and procurement integrations.
        - label: Procurement-suite ecosystems
          x: 4.9
          'y': 2.8
