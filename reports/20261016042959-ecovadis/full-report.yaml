  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, category, and supported scale metrics
        blocks:
          - type: paragraph
            body: >
              EcoVadis positions itself as a supply-chain sustainability ratings and intelligence platform rather than a
              single-point disclosure tool. The official homepage describes a connected system that turns fragmented
              sustainability inputs into comparable ratings across 175,000+ companies in 180+ countries, while also
              claiming 3 million suppliers screened and coverage across 230 industries. Third-party and company-adjacent
              sources corroborate meaningful scale, but they use different denominators: one company-authored 2026
              report says 150,000+ businesses use EcoVadis tools, while a syndicated July 2026 release cites more than
              100,000 companies rated between 2021 and 2025 and 1,400+ buyer organizations. Those figures are
              directionally supportive of category reach, but they should not be collapsed into a customer-count proxy
              without fresh corroboration.
