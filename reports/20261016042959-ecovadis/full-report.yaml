              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a plausible land-and-expand motion: buyers request suppliers to join,
              suppliers can share one scorecard across a broader customer network, and the community now reaches
              procurement teams that are not yet paying EcoVadis customers. Public sources also suggest commercial
              pressure can be real, with onboarding requirements and minimum score expectations influencing supplier
              eligibility. But those strengths do not resolve durability. The retained public pack does not disclose
              NRR, GRR, logo churn, contract-length mix, or top-customer concentration for EcoVadis itself. A further
              caution is that EcoVadis' own July 2026 data shows 80% of rated tier 1 suppliers still lack a documented
              process for managing sustainability risks in their own supply chains, which suggests customer adoption
              depth below direct suppliers remains incomplete even as top-level platform penetration looks substantial.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Buyer-led acquisition plus supplier reuse is the core growth mechanic
            body: >-
              The retained sources consistently show buyers requesting suppliers to join, while suppliers can reuse one
              scorecard across a wider customer network. That combination makes EcoVadis' customer motion more
              defensible than a logo wall alone because it creates both enterprise demand and supplier-side reuse
              incentives.
            calloutType: strength
            claimRefs:
              - CU001
              - CU007
              - CU008
              - CU010
          - type: callout
            title: Public traction is visible, but durability is still hard to underwrite
            body: >-
              Public materials establish scale and named proof, but they stop short of disclosing NRR, GRR, churn,
              contract mix, or customer concentration for EcoVadis itself. The July 2026 supplier-depth data also
              suggests customer adoption below direct suppliers remains incomplete.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is that EcoVadis sells decision-support into procurement and compliance
              workflows while depending on uneven supplier participation, third-party data, and complex product
              integrations to keep those signals trustworthy. Company materials emphasize scale, AI-assisted monitoring,
              expert review, and ecosystem growth, but the independent review in the assigned pool also flags
              undercoverage among smaller suppliers, emerging-market blind spots, and stale inputs when suppliers do not
              refresh assessments. That combination makes the investment case sensitive to measurable product-quality
              evidence rather than top-line network claims alone.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR009
              - CR010
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and legal exposure is manageable but live
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not show a current enforcement action or lawsuit, but it does show that
              EcoVadis is operating directly inside evolving European ratings, AI-governance, and human-rights diligence
              regimes. The company's own materials highlight methodology updates for new ESG ratings standards,
              whitepapers on CSRD and CSDDD thresholds, and worker-voice products designed for HRDD use cases.
              BriefGlance also reports that EcoVadis joined the European Commission's AI Act Advisory Forum in June
              2026. That is encouraging mitigation, yet it also confirms that regulatory change is an active operating
              dependency rather than a remote backdrop risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.3'
        title: Operational quality and partner dependencies drive renewal risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk concentrates in data quality, supplier responsiveness, and the reliability of the
              monitoring and integration stack. EcoVadis says its products consume 100,000+ news and data sources, 200+
              data points, 10+ API integrations, and 24/7 monitoring, which creates clear product depth but also a broad
              failure surface if inputs are stale, connectors break, or false negatives slip through. The external
              review adds that some ERP environments still require custom API work and multi-month deployment.
              Meanwhile, the 2026 partnership and consulting-partner updates suggest the company is widening its
              delivery ecosystem, which can improve reach but also adds execution and coordination dependencies.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR011
              - CR015
      - number: '7.4'
        title: Mitigations exist, but kill criteria should stay evidence-led
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a view that EcoVadis is proactively building mitigations: methodology
              updates, analyst review, carbon-data reliability work, grievance channels, and training all point in the
              right direction. The underwriting problem is that the assigned pool does not verify whether those controls
              produce enough measurable reliability, security, and regulatory readiness for a scaled software platform
              embedded in customer decision workflows. The thesis should weaken quickly if diligence shows weak override
              controls, thin customer integration support, materially stale supplier data, or a lack of concrete legal
              and incident-response documentation behind the marketing claims.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR008
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-quality credibility is the thesis-critical risk
            body: >-
              If supplier coverage, freshness, and alert accuracy are weaker than the marketing surface implies, the
              product can stay relevant while still failing the trust threshold needed for embedded procurement
              decisions.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR009
              - CR010
          - type: callout
            title: Legal, incident, and control diligence should be a pre-close gate
            body: >-
              The retained sources support active mitigation work, but they do not yet clear public-proof gaps on live
              legal exposure, security history, or control effectiveness for AI-assisted risk decisions.
            calloutType: recommendation
            claimRefs:
              - CR006
