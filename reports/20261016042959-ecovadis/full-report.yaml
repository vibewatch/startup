  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources indicate a buyer-triggered, supplier-paid recurring workflow with adjacent product upsells, but no
      public unit-economics disclosure.
    data:
      nodes:
        - id: request
          label: Buyer / lender request
          detail: >-
            Customer, prospect, or lender asks a legal entity to be assessed as part of procurement, onboarding, or
            review.
        - id: subscription
          label: Rated company subscription
          detail: The rated company pays an annual subscription priced by employee count and country.
        - id: evidence
          label: Questionnaire + evidence submission
          detail: Documents, policies, certifications, and metrics are uploaded; incomplete evidence earns no credit.
        - id: review
          label: AI + analyst review
          detail: >-
            EcoVadis combines advanced AI with more than 500 in-house analysts and millions of documents analyzed
            monthly.
        - id: scorecard
          label: Scorecard / medal output
          detail: Scorecards are valid for 12 months; medal eligibility begins at Premium.
        - id: workflow
          label: Buyer workflow usage
          detail: >-
            Monitoring, dashboards, corrective-action plans, and network sharing embed the scorecard in procurement
            operations.
        - id: expansion
          label: Adjacent module expansion
          detail: Carbon, intelligence, community, and training products create add-on revenue paths beyond the base rating.
      edges:
        - from: request
          to: subscription
          label: demand trigger
        - from: subscription
          to: evidence
          label: paid access
        - from: evidence
          to: review
          label: formalized inputs
        - from: review
          to: scorecard
          label: assessed output
        - from: scorecard
          to: workflow
          label: procurement use
        - from: workflow
          to: expansion
          label: upsell path
    approximationNotes: >-
      This is a qualitative workflow bridge built from public product and explainer evidence; it does not imply
      conversion rates or gross-profit percentages.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI010
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a layered operating model spanning intake, scoring logic, external monitoring, analyst
      review, and buyer/supplier workflows.
    data:
      layers:
        - label: User workflows
          detail: Separate buyer and supplier operating paths sit on top of the same ratings system.
          outputs:
            - Buyer screening and procurement decisions
            - Supplier assessment and reassessment
        - label: Engagement layer
          detail: Improvement guidance and enablement keep the workflow active after initial scoring.
          modules:
            - Improvement plans and benchmarking
            - Community and e-learning
        - label: Score outputs
          detail: Core outputs package comparable sustainability judgments for operational use.
          outputs:
            - Ratings and scorecards
            - Risk and carbon signals
        - label: Validation layer
          detail: Human review and evidence handling sit between raw inputs and customer-facing outputs.
          modules:
            - In-house sustainability analysts
            - Evidence review and scoring decisions
        - label: Intelligence layer
          detail: Public technical hiring suggests growing graph and agent infrastructure behind the product.
          modules:
            - AI-assisted monitoring
            - GraphRAG, entity resolution, and MCP tooling
        - label: Data ingestion
          detail: Product inputs span questionnaires, uploaded documents, and monitored external information.
          modules:
            - Questionnaires and supporting documents
            - External sources and enterprise data feeds
    approximationNotes: >-
      Layering is synthesized from public product copy, documentation, and one technical job posting; vendor-managed
      security, API, and infrastructure components are not publicly specified in the assigned pool.
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Buyer mandates pull suppliers into the network, then score sharing, community participation, and improvement
      workflows create expansion paths.
    data:
      items:
        - label: Buyer mandate
          touchpoints:
            - Procurement executives request suppliers to answer EcoVadis.
            - Minimum score expectations can influence tender eligibility.
        - label: Supplier onboarding
          touchpoints:
            - Supplier creates an account and prepares evidence for the assessment.
            - Annual subscription and scorecard cadence frame the commercial relationship.
        - label: Expert scoring
          touchpoints:
            - EcoVadis analysts review submitted evidence and external inputs.
            - Scorecards can be used by both suppliers and buyer organizations.
        - label: Shareable scorecard
          touchpoints:
            - One assessment can be shared across a broader customer network.
            - Reuse lowers repeated questionnaire friction for suppliers.
        - label: Community layer
          touchpoints:
            - Procurement leaders and sustainability practitioners can access community resources.
            - Community access now extends to non-EcoVadis customers as well.
        - label: Expansion and improvement
          touchpoints:
            - Customer stories emphasize new-business wins, supplier-risk workflows, and implementation support.
            - Deeper-tier adoption still appears incomplete in July 2026 supplier-risk data.
