              The strongest verified operating-model evidence points to a hybrid system rather than a pure self-serve
              ESG form. Official copy says EcoVadis combines AI with analyst validation and continuous monitoring, while
              the document guide confirms evidence handling is formalized enough to warrant a dedicated submission
              manual and document-limit guidance. Public technical hiring adds a more current signal: EcoVadis is
              recruiting for GraphRAG ingestion pipelines, knowledge-graph infrastructure, entity resolution,
              SHACL-based data-quality controls, and MCP endpoints for autonomous agents. That suggests the product
              stack is evolving toward a richer internal intelligence layer spanning structured enterprise data,
              unstructured disclosures, and external registries. The evidence supports technical ambition and
              data-integration depth, but not enough detail to verify production reliability metrics, external API
