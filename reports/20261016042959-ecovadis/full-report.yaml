      - number: '3.4'
        title: Durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat visible in the assigned evidence is therefore conditional rather than absolute. EcoVadis looks
              durable where large buyers mandate a common supplier-rating workflow and where regulatory complexity
              favors a multi-theme, analyst-reviewed benchmark with integrations into enterprise procurement systems.
              The main displacement risk is not a like-for-like ratings startup alone; it is that incumbent procurement
              suites, narrower disclosure tools, or internal programs may solve enough of the job for budget owners who
              do not need the full benchmark network. With no public pricing evidence in the pool, the prudent takeaway
              is that EcoVadis has real workflow and network strengths, but its competitive power still depends on
              continued buyer acceptance of the shared-rating model.
