      - number: '4.3'
        title: Capital base, cost structure, and underwriting blind spots
        blocks:
          - type: paragraph
            body: >-
              External market-data pages indicate EcoVadis has raised substantial private capital and built a large
              team, but the public record remains too thin to assess capital adequacy. Tracxn lists $732 million of
              cumulative funding, a $500 million Series D in 2022, a last known $1 billion valuation, and a 1,001–5,000
              employee range, which at least implies a meaningful fixed-cost base. Independent and official materials
              also point to a hybrid delivery model with 500+ in-house analysts, AI-assisted workflows, and heavy
              document-review volume, which likely helps retention and trust but also suggests non-trivial service
              costs. What is still missing is the core underwriting set: current ARR or revenue, growth, gross margin,
              NRR/GRR, CAC or payback, cash, debt, and runway.
            claimRefs:
              - CI008
              - CI009
              - CI010
