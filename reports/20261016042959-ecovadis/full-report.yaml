              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Growth drivers, constraints, and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Demand is being pulled by regulation and customer pressure rather than by discretionary ESG
              experimentation alone. Independent commentary and EcoVadis-linked materials repeatedly connect adoption to
              CSRD, CSDDD/CS3D, LkSG, Scope 3 reporting, and buyer requirements for documented supplier controls. The
              same evidence also shows why the market should not be treated as frictionless. Workiva's guide portrays
              the assessment as evidence-heavy and capable of taking several weeks, which can slow supplier
              participation. EcoVadis' July 2026 index release points to shallow cascade beyond tier 1: 80% of rated
              companies still lacked a documented process for managing sustainability risk in their own supply chains,
              42% still relied on unverified supplier questionnaires, and only 20% used on-site audits. That combination
              suggests a real market need, but also shows that deeper, multi-tier adoption still requires operational
              change and proof burdens that public TAM rhetoric does not capture. The main diligence gap is therefore
              not whether the category exists, but how much of the observable network turns into paid, durable,
              multi-module spend by buyer cohort and geography.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
