  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and observable footprint
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently place EcoVadis in supply-chain sustainability ratings and intelligence rather
              than broad ESG disclosure software. Official materials describe a platform that assesses suppliers across
              Environment, Labor & Human Rights, Ethics, and Sustainable Procurement, then layers risk mapping, carbon
              management, and improvement tooling around that core rating workflow. That framing matters for
              underwriting: the relevant budget is supplier-risk, procurement, compliance, and decarbonization spend
              tied to supply-chain execution, not every corporate ESG software dollar. The installed footprint is
              meaningful, but the public numbers are adoption lenses rather than market size: EcoVadis claims ratings
              across 175,000+ companies in 180+ countries, says it has screened 3 million suppliers, and cites 49,000
              ratings completed in 2024 plus 159,000 since 2020 in its 2025 index materials. Those figures demonstrate
              network breadth and activity, but they do not isolate total spend, paid penetration, or the serviceable
              share of buyers likely to standardize on EcoVadis.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
