  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              EcoVadis is competing for a specific job: giving buyers a reusable, comparable supplier-sustainability
              signal that can sit inside procurement workflows rather than remain a one-off questionnaire or consulting
              exercise. The assigned evidence points to four practical alternative paths for the same buyer need:
              procurement-suite workflows that can distribute or embed ESG data inside source-to-pay systems,
              disclosure-first ESG tools that solve a narrower reporting problem, manual questionnaires or spreadsheets,
              and consulting-led or internally built evidence-gathering processes. That means the competitive set is
              broader than standalone ESG ratings vendors, and buyer adoption is likely shaped as much by enterprise
              workflow ownership as by scoring methodology alone.
