  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and user workflow
        blocks:
          - type: paragraph
            body: >-
              EcoVadis's public product surface is best understood as a two-sided workflow. Suppliers complete a
              tailored sustainability assessment, upload supporting documents, receive scored output, and use
              benchmarks, improvement guidance, and medal or badge outcomes to manage future customer requests. Buyers
              use the same system to screen supplier bases, compare counterparties on a standardized rubric, and route
              sustainability requirements into procurement decisions. That framing matters because the current evidence
              supports a recurring operating workflow — questionnaire, analyst review, score publication, annual
              reassessment, and ongoing supplier monitoring — not a lightweight point-in-time certification utility.
              Public materials consistently describe the product as supply-chain sustainability infrastructure tied to
              procurement, supplier risk, and corrective-action programs.
