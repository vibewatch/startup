        title: Exhibits
        blocks:
          - type: callout
            title: Observable scale is not the same as addressable spend
            body: >-
              The best public sizing inputs are network and activity counts plus supplier-based pricing; none of the
              retained sources isolate a clean TAM, SAM, or SOM for EcoVadis' combined ratings, risk, carbon, and
              improvement stack.
