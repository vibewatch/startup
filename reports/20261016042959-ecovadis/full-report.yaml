        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a credible thesis that EcoVadis has built a scaled, recurring procurement
              workflow with cross-sell opportunities in carbon, monitoring, and community products, and that regulation
              and buyer requirements help pull demand into the platform. The same evidence does not support a clean
              judgment on revenue quality or capital sufficiency, because public sources stop at network metrics,
              selected customer ROI anecdotes, and stale third-party funding data. From a diligence perspective, that
              leaves the key financial verdict conditional: EcoVadis looks commercially important, but underwriting
              still depends on management disclosure of realized pricing, retention, gross margin, burn, debt, and cash
              runway.
