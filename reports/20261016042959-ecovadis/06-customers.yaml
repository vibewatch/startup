schemaVersion: report-v2
artifact: customers
slug: ecovadis
runDate: 2026-10-16
company:
  name: EcoVadis
chapter:
  number: 6
  title: Customers
  summary: >-
    EcoVadis shows credible public customer traction across both sides of its
    network, with 1,400+ requesters/buyers and 175,000 rated companies cited on
    current official pages. The harder underwriting question is durability:
    public materials show buyer-led acquisition, shareable scorecards, and named
    customer anecdotes, but they do not disclose NRR, churn, contract mix, or
    customer concentration for EcoVadis' own revenue base.
sections:
  - id: customer-model-and-segments
    title: Customer model and entry points
    body: >-
      EcoVadis' public customer model is two-sided. Official and third-party
      descriptions both position the platform around buyer organizations that
      request assessments from suppliers, plus supplier organizations that pay
      to complete assessments, share scorecards, and maintain eligibility across
      procurement workflows. That architecture matters because EcoVadis is not
      selling a single-purpose point tool to one persona: it is trying to sit in
      the middle of buyer qualification, supplier evidence gathering, and
      broader sustainability collaboration. The 2026 community expansion adds a
      further layer by opening part of the experience to procurement leaders and
      non-customers before they commit to a paid assessment workflow, which
      broadens top-of-funnel reach but also blurs the public boundary between
      paying customers, rated entities, and free community participants.
    claimRefs: [CU001, CU002, CU004, CU005, CU007, CU008, CU009, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-evidence-and-named-proof
    title: Adoption evidence and named proof
    body: >-
      Public adoption evidence is directionally strong. EcoVadis' own pages cite
      175,000 rated companies and millions of screened companies, while the
      impact page adds 1,400+ requesters/buyers and €2 trillion-plus in spend
      rated. That is enough to conclude the platform is used at meaningful
      enterprise scale, even if the official pages still mix screened,
      requested, rated, and improvement-program populations rather than offering
      one clean paying-customer denominator. Named proof is also better than
      logo-only evidence: retained sources include customer quotes from CEF,
      SNCF, Clariant, and Tier 1 Asset Management that describe concrete usage
      patterns ranging from supplier-risk workflows to community-guided
      implementation and commercial win support. The limitation is that every
      named proof here is still company-curated rather than independently
      audited.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU011, CU012, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The public evidence supports a plausible land-and-expand motion: buyers
      request suppliers to join, suppliers can share one scorecard across a
      broader customer network, and the community now reaches procurement teams
      that are not yet paying EcoVadis customers. Public sources also suggest
      commercial pressure can be real, with onboarding requirements and minimum
      score expectations influencing supplier eligibility. But those strengths do
      not resolve durability. The retained public pack does not disclose NRR,
      GRR, logo churn, contract-length mix, or top-customer concentration for
      EcoVadis itself. A further caution is that EcoVadis' own July 2026 data
      shows 80% of rated tier 1 suppliers still lack a documented process for
      managing sustainability risks in their own supply chains, which suggests
      customer adoption depth below direct suppliers remains incomplete even as
      top-level platform penetration looks substantial.
    claimRefs: [CU007, CU008, CU009, CU010, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / sponsor
      - Primary users
      - Payer
      - Use case
      - Strategic value
      - Gap
    rows:
      - - Requester enterprises
        - Large procurement and sustainability organizations
        - Procurement, supplier-risk, and compliance teams
        - Buyer organization
        - Request supplier assessments, compare scorecards, and monitor improvement actions
        - Drives enterprise demand and spend-rated footprint
        - Public sources do not disclose buyer logo count beyond 1,400+ requesters/buyers or contract sizing by cohort
      - - Rated suppliers
        - Supplier sustainability, procurement, and operations leaders
        - Teams assembling evidence, managing scorecards, and coordinating corrective actions
        - Supplier company subscription is described publicly, but the paying share of rated entities is not disclosed
        - Complete assessments, share results across customers, and protect eligibility in tenders
        - Creates reuse economics when one scorecard can serve multiple buyers
        - No public split between paying suppliers, invited suppliers, and legacy rated entities
      - - Community users and prospects
        - Procurement leaders and sustainability practitioners, including non-EcoVadis customers
        - Members consuming discussions, templates, events, and peer connections
        - Free account for community access; monetization path undisclosed
        - Learn requirements, benchmark practices, and explore workflows before or alongside assessment
        - Extends top-of-funnel reach beyond the assessed base
        - No disclosed conversion rate from community participation to paid platform revenue
    notes: "Rows segment the public go-to-market surfaces visible in retained sources; payer counts and overlap between buyer, supplier, and community cohorts are not publicly disclosed."
    claimRefs: [CU001, CU004, CU005, CU007, CU008, CU009, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Buyer-side footprint
        - 1,400+ requesters / buyers and €2 trillion+ in spend rated
        - 2026-10-16 access of current impact page
        - Our Impact
        - Medium
        - Shows meaningful enterprise-side adoption by procurement organizations
        - No split between paying enterprise logos, active seats, and inactive historical accounts
      - - Rated-company footprint
        - 175,000 rated companies
        - 2026-10-16 access of current official pages
        - Homepage plus impact page
        - High
        - Confirms a large supplier-side installed base
        - No breakout of active paying suppliers versus all-time rated entities
      - - Screened-company footprint
        - Homepage says 3M suppliers screened; impact page says 3.5 million companies screened
        - 2026-10-16 access of current official pages
        - Homepage plus impact page
        - High
        - Screening funnel is materially larger than the rated base
        - Public materials do not reconcile the screened metric definition across pages
      - - Community expansion
        - Community opened to all procurement organizations and non-EcoVadis customers on 2026-07-23
        - 2026-07-23 item on market-pulse page
        - BriefGlance
        - Medium
        - EcoVadis is extending engagement beyond existing assessed accounts
        - No public member count or conversion rate to paid workflows
      - - Public audience reach
        - 150,492 LinkedIn followers
        - 2026-10-16 snapshot
        - LinkedIn company page
        - Medium
        - Brand and practitioner reach is wider than the named case-study set
        - Followers are not equivalent to paying customers or active platform users
    notes: "These rows mix buyer, screened, rated, community, and audience indicators, so they show directional adoption rather than one comparable funnel denominator."
    claimRefs: [CU002, CU003, CU004, CU006]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / organization
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / evidence
      - Limitation
    rows:
      - - Tier 1 Asset Management
        - Supplier-side community user
        - Uses EcoVadis Community guidance to implement and evidence sustainability work
        - Ongoing usage implied; production depth not independently verified
        - Paul Shortland says the Community makes the solution easier to implement, maintainable, and functional
        - Testimonial sits on an EcoVadis-controlled page and does not disclose contract scope or ROI
      - - CEF
        - Supplier / distributor
        - Uses EcoVadis rating in commercial sustainability positioning
        - Production customer quote; exact deployment footprint not broken out
        - "\"Our sales increase, our turnover goes up\" after working with EcoVadis"
        - Company-curated quote with no independent baseline or attribution method
      - - SNCF
        - Large enterprise buyer / procurement team
        - Uses EcoVadis primary data with Sweep for supplier-risk and carbon-footprint management
        - Production workflow implied; scope inside SNCF not quantified
        - EcoVadis is cited as providing primary data for supplier risk and maturity
        - No independent case study or procurement-spend denominator accompanies the quote
      - - Clariant
        - Large enterprise buyer / supplier-sustainability team
        - Uses EcoVadis within supplier-sustainability and decarbonization workflows
        - Production program implied; supplier coverage denominator is partial
        - Clariant says 92% of raw-materials spend is allocated to suppliers and partners joining its journey
        - Quote is customer-provided on EcoVadis' site and does not isolate EcoVadis-only causality
    notes: "Representative public case studies and testimonials from retained pages only; production depth, contract scope, and ROI remain mostly self-reported."
    enumerationScope:
      coverage: partial
      basis: "Representative sample of named customer examples and community testimonials visible in the retained public EcoVadis pages accessed on 2026-10-16; not an exhaustive customer registry."
    claimRefs: [CU004, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Buyer mandates pull suppliers into the network, then score sharing,
      community participation, and improvement workflows create expansion paths.
    data:
      items:
        - label: Buyer mandate
          touchpoints:
            - Procurement executives request suppliers to answer EcoVadis.
            - Minimum score expectations can influence tender eligibility.
        - label: Supplier onboarding
          touchpoints:
            - Supplier creates an account and prepares evidence for the assessment.
            - Annual subscription and scorecard cadence frame the commercial relationship.
        - label: Expert scoring
          touchpoints:
            - EcoVadis analysts review submitted evidence and external inputs.
            - Scorecards can be used by both suppliers and buyer organizations.
        - label: Shareable scorecard
          touchpoints:
            - One assessment can be shared across a broader customer network.
            - Reuse lowers repeated questionnaire friction for suppliers.
        - label: Community layer
          touchpoints:
            - Procurement leaders and sustainability practitioners can access community resources.
            - Community access now extends to non-EcoVadis customers as well.
        - label: Expansion and improvement
          touchpoints:
            - Customer stories emphasize new-business wins, supplier-risk workflows, and implementation support.
            - Deeper-tier adoption still appears incomplete in July 2026 supplier-risk data.
    claimRefs: [CU004, CU005, CU007, CU008, CU009, CU010, CU015]
callouts:
  - calloutType: strength
    title: Buyer-led acquisition plus supplier reuse is the core growth mechanic
    body: >-
      The retained sources consistently show buyers requesting suppliers to join,
      while suppliers can reuse one scorecard across a wider customer network.
      That combination makes EcoVadis' customer motion more defensible than a
      logo wall alone because it creates both enterprise demand and supplier-side
      reuse incentives.
    claimRefs: [CU001, CU007, CU008, CU010]
  - calloutType: risk
    title: Public traction is visible, but durability is still hard to underwrite
    body: >-
      Public materials establish scale and named proof, but they stop short of
      disclosing NRR, GRR, churn, contract mix, or customer concentration for
      EcoVadis itself. The July 2026 supplier-depth data also suggests customer
      adoption below direct suppliers remains incomplete.
    claimRefs: [CU015, CU016]
