      - [Anti-thesis, Public valuation evidence is still too thin and inconsistent for a disciplined entry range., Primary financing documents or audited operating metrics would materially change the call., "Apiday only provides broad subscription pricing; BounceWatch provides low-confidence funding aggregation rather than a corroborated current mark."]
    notes: >-
      Key support cells paraphrase the underlying retained claims for compactness;
      use the cited claims and source quotations for precise wording and context.
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV008, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, EcoVadis converts its large network and regulatory relevance into durable workflow ownership plus higher-value carbon and worker-voice expansion., Upside only makes sense if primary metrics show strong growth quality and the round price does not fully capitalize category-leader status., Missing proof on retention and margins could collapse the premium case., "Watch for audited growth, strong cohort retention, and clean primary financing terms."]
      - [Base, "EcoVadis remains strategically relevant and continues expanding, but investors still underwrite around disclosure gaps and complementary-tool dependence.", Returns depend more on disciplined entry price and downside protections than on heroic multiple expansion., Valuation opacity and incomplete customer-economics proof keep sizing conservative., Most current evidence fits this case because scale and market need are visible but monetization depth is not.]
      - [Bear, "EcoVadis is important but not singular, and buyers treat it as one input among several while valuation expectations remain rich.", Downside is driven by multiple compression or a structure-heavy round rather than by lack of category demand alone., "Blind-spot critiques, dependence on extra diligence, and unverified financing terms dominate underwriting.", This scenario becomes more likely if current metrics disappoint or financing resets below implied premium expectations.]
    notes: >-
      Scenario table uses qualitative valuation logic because the retained public
      record does not disclose the current inputs needed for a numeric range.
    claimRefs: [CV005, CV006, CV007, CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a chain from visible category scale and demand
      support to unresolved valuation disclosure and underwriting discipline.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 175K rated companies and 3M suppliers screened show visible platform reach.
          value: "175K / 3M"
        - id: demand
          label: Demand support
          detail: Buyer budgets and cross-border compliance pressure still support the category in 2026.
          value: "87% / 75%"
        - id: differentiation
          label: Differentiation
          detail: Verdantix leader positioning plus analyst validation and adjacent modules support relevance.
        - id: monetization
          label: Monetization hints
          detail: Subscription pricing exists, but public evidence does not bridge to current ARR, margin, or retention.
          value: "€350-€6,500"
        - id: frictions
          label: Underwriting frictions
          detail: Third-party sources warn the rating should not be a sole diligence tool, and financing disclosure is thin.
          tone: risk
        - id: recommendation
          label: Research-more / unknown valuation
          detail: Wait for primary financial and cap-table evidence before underwriting an entry price.
          tone: risk
      edges:
        - from: scale
          to: demand
          label: Scale matters only if category need persists
        - from: demand
          to: differentiation
          label: Tailwind is stronger when product quality is visible
        - from: differentiation
          to: monetization
          label: Product relevance still must translate into economics
        - from: monetization
          to: frictions
          label: Missing metrics and product limits widen the discount
        - from: frictions
          to: recommendation
          label: Price discipline stays paramount
    approximationNotes: >-
      Figure is a qualitative decision chain rather than a quantitative model or
      implied valuation bridge.
    claimRefs: [CV001, CV002, CV005, CV007, CV011, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: "Public call: research-more"
    body: >-
      Public evidence supports EcoVadis as a serious category asset, but not as
      a priceable deal without primary operating metrics and financing terms.
    claimRefs: [CV001, CV005, CV007, CV014]
  - calloutType: risk
    title: The anti-thesis is product and valuation opacity, not category irrelevance
    body: >-
      The strongest downside signals are that EcoVadis should not be the sole
      diligence tool and that current valuation inputs remain unverified.
    claimRefs: [CV011, CV012, CV014]
