  evidenceGaps:
    - type: missing-source
      severity: material
      topic: financial-disclosure
      missingEvidence: Current ARR or revenue, growth, gross margin, net or gross retention, burn, and cash-runway data.
      whyItMatters: Public scale signals do not translate into valuation without current operating quality and cash-efficiency evidence.
      diligencePath: Request the latest board pack, audited financial statements, and KPI bridge used in the current financing process.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: capital-structure
      missingEvidence: Latest primary or secondary pricing, current cap table, liquidation preferences, debt terms, and any structured financing or project-finance obligations.
      whyItMatters: Downside protection and dilution risk can dominate returns even when the business category is attractive.
      diligencePath: Obtain the current cap table, financing documents, and any secondary-transaction or preference summaries from counsel or management.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: customer-economics
      missingEvidence: A clean definition of paying customers versus rated companies, plus cohort retention, expansion, and concentration by buyer or supplier segment.
      whyItMatters: Exit quality depends on durable commercial depth, not just network size or product breadth.
      diligencePath: Request cohort analysis, top-customer concentration, and paid-seat or contract-value segmentation from the company.
      relatedQuestionRefs: [QV008]
