company:
  name: EcoVadis
chapter:
  number: 8
  title: Valuation
  summary: >-
    EcoVadis shows credible category relevance, product breadth, and regulatory
    tailwinds in 2026, but the retained public record still does not provide a
    priceable equity case. The chapter therefore lands on a research-more
    recommendation, high risk rating, and unknown valuation stance until
    management discloses current financial performance and capital-structure
    evidence.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The retained evidence supports EcoVadis as a strategically relevant
      supply-chain sustainability platform rather than a clearly underwritable
      equity entry. Company-controlled 2026 materials describe a large installed
      footprint, with 175,000 rated companies, 3 million suppliers screened,
      and more than 500 sustainability analysts reviewing assessments, while
      a separate enterprise page points to 1,500-plus procurement,
      sustainability, and compliance leaders using the platform. Company-issued
      2026 updates also point to current product momentum through Verdantix
      leadership positioning and a fast-growing community layer, and EcoVadis's
      own index article describes sustained buyer spending and cross-border
      regulatory pull. That combination is enough to justify continued
      diligence, but not enough to support a price-sensitive go decision,
      because the retained public record still lacks current ARR, growth,
      margin, retention, burn, cap-table, preference, and contemporaneous
      valuation disclosures.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV014]
    tableRefs: [TV001]
  - id: thesis-anti-thesis-and-scenarios
    title: Thesis, anti-thesis, and scenario framing
    body: >-
      The bullish case rests on EcoVadis occupying a workflow that buyers appear
      to keep funding: standardized supplier sustainability data, regulatory
      mapping, and decision support that sits inside procurement processes. That
      thesis is strengthened by evidence of analyst validation, network scale,
      and complementary product modules around carbon, worker voice, and
      community. The anti-thesis is that third-party descriptions of the product
      still warn that EcoVadis ratings emphasize documented management systems,
      may miss practical implementation, and should not be used as the sole
      diligence tool. Pricing evidence is also too thin for precision: Apiday
      gives only a broad subscription range for company assessments, while the
      public record offers no verified operating metrics that would connect that
      monetization model to durable margins or an investable multiple.
    claimRefs: [CV003, CV005, CV006, CV007, CV009, CV011, CV012, CV013, CV014]
    tableRefs: [TV002, TV003]
    figureRefs: [FV001]
  - id: diligence-gates-exit-readiness-and-breaks
    title: Diligence gates, exit readiness, and thesis-break triggers
    body: >-
      Entry discipline should start with management materials, not public-market
      multiple guessing. Before underwriting, an investor should obtain current
      ARR or revenue, growth, gross margin, cohort retention, customer mix,
      burn, cash runway, and a clean cap-table showing any liquidation
      preferences, debt, or structured financing. The only retained third-party
      financing summary is a low-confidence aggregator record that lists
      $733.90 million raised and a 2022 secondary-market event, which is
      directionally useful for dilution questions but not reliable enough to set
      price. Thesis-break signals would include evidence that buyers continue to
      need separate tools around verification and local implementation, a down
      round or preference-heavy financing, weaker expansion of the non-customer
      community funnel, or stalled proof that EcoVadis can convert category
      importance into durable, decision-grade economics.
    claimRefs: [CV006, CV010, CV011, CV012, CV013, CV014]
