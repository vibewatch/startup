      - Public pricing signal
      - Contract / revenue basis
      - Disclosed realization
      - Source / caveat
    rows:
      - ["Basic plan scorecard", "Receives score and theme scores but no medal", "Supplier-side subscription", "No public price", "GravityPlatform says medal eligibility starts at Premium"]
      - ["Premium+ tier", "Required for medal and badge eligibility; adds benchmarking and external network sharing", "Supplier-side subscription", "No public price", "Public plan logic visible; not enough to infer ASP"]
      - ["Annual subscription tiering", "Quoted on request and priced by employee-count tier and country", "Recurring annual contract", "No list prices disclosed", "Independent explainer explicitly says EcoVadis does not publish subscription rates"]
      - ["Buyer access / network tools", "Buyer pays separately for access to the network", "Buyer-side enterprise contract", "No public price", "Independent explainer confirms separate buyer payment but not contract size"]
    notes: "This table captures only public pricing signals; list price, discounting, and net revenue realization remain unavailable."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR / revenue run rate", null, "Low", "Core scale metric for software underwriting", "Provide latest ARR or revenue, revenue mix, and reporting basis"]
      - ["Revenue growth", null, "Low", "Tests demand acceleration versus compliance-driven one-offs", "Provide 2-3 year revenue growth bridge"]
      - ["Gross margin", null, "Low", "Needed to judge software leverage versus analyst-service intensity", "Provide gross-margin definition and trend"]
      - ["CAC / payback", null, "Low", "Shows efficiency of buyer-led and supplier-led acquisition motion", "Provide blended and segment CAC plus payback"]
      - ["NRR / GRR", null, "Low", "Measures renewal quality and land-and-expand durability", "Provide logo retention, GRR, and NRR by cohort"]
      - ["Cash / burn / runway", null, "Low", "Required to assess capital adequacy and financing dependency", "Provide latest cash, debt, monthly burn, and runway"]
      - ["Headcount", "1,001-5,000 employees as of Jul 24 (Tracxn)", "Low", "Signals a sizable cost base but not productivity", "Provide current FTE count and functional mix"]
      - ["Latest external capital datapoint", "$732M total funding; $500M Series D in 2022; $1B last known valuation (Tracxn)", "Low", "Useful context, but stale and third-party", "Confirm current cap table, cash balance, and any debt or secondary activity"]
    notes: "Nulls indicate metrics not disclosed in the reviewed public source set, not zero values."
    claimRefs: [CI008, CI009, CI010, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources indicate a buyer-triggered, supplier-paid recurring
      workflow with adjacent product upsells, but no public unit-economics
      disclosure.
    data:
      nodes:
        - id: request
          label: Buyer / lender request
          detail: Customer, prospect, or lender asks a legal entity to be assessed as part of procurement, onboarding, or review.
        - id: subscription
          label: Rated company subscription
          detail: The rated company pays an annual subscription priced by employee count and country.
        - id: evidence
          label: Questionnaire + evidence submission
          detail: Documents, policies, certifications, and metrics are uploaded; incomplete evidence earns no credit.
        - id: review
          label: AI + analyst review
          detail: EcoVadis combines advanced AI with more than 500 in-house analysts and millions of documents analyzed monthly.
        - id: scorecard
          label: Scorecard / medal output
          detail: Scorecards are valid for 12 months; medal eligibility begins at Premium.
        - id: workflow
          label: Buyer workflow usage
          detail: Monitoring, dashboards, corrective-action plans, and network sharing embed the scorecard in procurement operations.
        - id: expansion
          label: Adjacent module expansion
          detail: Carbon, intelligence, community, and training products create add-on revenue paths beyond the base rating.
      edges:
        - from: request
          to: subscription
          label: demand trigger
        - from: subscription
          to: evidence
          label: paid access
        - from: evidence
          to: review
          label: formalized inputs
        - from: review
          to: scorecard
          label: assessed output
        - from: scorecard
          to: workflow
          label: procurement use
        - from: workflow
          to: expansion
          label: upsell path
    approximationNotes: "This is a qualitative workflow bridge built from public product and explainer evidence; it does not imply conversion rates or gross-profit percentages."
    claimRefs: [CI001, CI002, CI003, CI005, CI010, CI011]
callouts:
  - calloutType: insight
    title: Recurring motion is visible; realized pricing is not
    body: >-
      EcoVadis' public materials make the commercial workflow legible — annual
      supplier subscriptions, buyer-side workflow usage, and module expansion —
      but they do not disclose price points, discounting, or segment mix.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Financial diligence still depends on private disclosure
    body: >-
      Public evidence does not provide current ARR, growth, gross margin,
      retention, burn, debt, or runway, so even a strong strategic position
      cannot be translated into an underwriting-ready financial model yet.
    claimRefs: [CI012]
