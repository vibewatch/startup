      - number: '2.2'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场看起来是双边的。企业采购、负责任采购、合规和碳项目负责人是经济买方，因为他们邀请交易伙伴、对供应商做基准比较，并用仪表盘管理风险和整改。供应商也是用户，有时也是付费方：它们完成一次评估后，可以在多个客户要求中复用所得评分卡。公开描述将采用与具体流程绑定：供应商入驻与筛查、满足尽调义务、把风险信号嵌入寻源工具、收集供应商碳数据，以及支持整改项目。ERP
              Research 的定价描述尤其有用，因为它暗示商业扩张变量是已评估的供应商数量，而不只是席位数或买方支出；换句话说，客户把 EcoVadis 推广到供应商基础的广度，决定采用能走多深。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: 增长驱动、约束与规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              需求主要由监管和客户压力拉动，而不是单靠可选的 ESG 试验。独立评论和 EcoVadis 相关材料反复将采用与 CSRD、CSDDD/CS3D、LkSG、Scope 3
              报告以及买方要求供应商控制措施留痕联系起来。同一批证据也说明，市场并非没有摩擦。Workiva 指南称，评估过程证据要求高，可能耗时数周，从而拖慢供应商参与。EcoVadis 2026 年 7
              月指数发布指出，一级供应商之外的传导仍很浅：80% 的已评级公司仍没有管理自身供应链可持续风险的书面流程，42% 仍依赖未经验证的供应商问卷，只有 20%
              使用现场审计。这说明市场确有需求，但也显示更深层、多层级的采用仍需要运营变革和证明成本，而公开 TAM
              叙事没有反映这些成本。因此，主要尽调缺口不是这个品类是否存在，而是可观察网络中有多少最终转化为按买方群组和地域划分的付费、持久、多模块支出。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 可观察规模不等于可触达支出
            body: 最好的公开规模输入是网络和活动数量，以及按供应商计价的信息；现有来源没有单独给出 EcoVadis 评级、风险、碳和改进产品组合的清晰 TAM、SAM 或 SOM。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: callout
            title: 更深层级的采用仍是转化瓶颈
            body: EcoVadis 自己的 2026 年指数发布显示，一级供应商以下仍存在显著流程缺口，说明品类需求真实存在，但运营证明、供应商参与和流程变化仍限制买方将这一模式推进到网络多深。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              EcoVadis 争夺的是一个具体任务：为买方提供可复用、可比较的供应商可持续发展信号，并嵌入采购流程，而不是停留在一次性问卷或咨询项目中。现有证据指向满足同一买方需求的四条现实替代路径：可在
              source-to-pay 系统中分发或嵌入 ESG 数据的采购套件流程、解决较窄报告问题的披露优先型 ESG 工具、人工问卷或电子表格，以及咨询主导或内部搭建的证据收集流程。因此，竞争集合比独立 ESG
              评级供应商更广，买方采用很可能既取决于评分方法，也取决于企业流程归属。
