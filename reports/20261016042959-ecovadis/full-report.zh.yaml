              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 尽调门槛、退出准备度与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              进入纪律应从管理层材料开始，而不是猜测公开市场倍数。在纳入投资判断前，投资者应取得当前 ARR
              或收入、增长、毛利率、群组留存、客户组合、烧钱、现金跑道，以及清晰的股权表，列明任何清算优先权、债务或结构化融资。现有唯一第三方融资摘要来自低置信度聚合记录，列出融资 $733.90M 和 2022
              年一次二级市场事件；它可用于粗略思考稀释问题，但不可靠到足以定价。投资逻辑破裂信号包括：买方仍需围绕验证和本地实施使用独立工具、出现下轮融资或偏重优先权的融资、非客户社区漏斗扩张减弱，或 EcoVadis
              将品类重要性转化为持久且可用于决策的经济效益的证据停滞。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开结论：继续研究
            body: 公开证据支持 EcoVadis 是一个重要品类资产，但在缺少一手运营指标和融资条款前，不支持将其视为可定价交易。
            calloutType: recommendation
            claimRefs:
