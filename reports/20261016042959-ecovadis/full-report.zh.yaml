  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - EcoVadis 将庞大网络和监管相关性转化为持久的流程控制权，并拓展更高价值的碳与员工声音产品。
        - 只有在主要指标显示增长质量强劲、且本轮价格尚未充分反映品类领导者地位时，上行空间才成立。
        - 留存和利润率缺少证明，可能让溢价逻辑失效。
        - 关注经审计的增长、强劲的队列留存和清晰的主要融资条款。
      - - 基准
        - EcoVadis 仍具战略相关性并持续扩张，但投资者仍需围绕披露缺口和对配套工具的依赖来评估收入质量。
        - 回报更多取决于有纪律的入场价格和下行保护，而不是倍数大幅扩张。
        - 估值不透明、客户经济性证据不完整，因此仓位应保持保守。
        - 目前大多数证据都符合这一情景：规模和市场需求清晰可见，但变现深度尚不明确。
      - - 悲观
        - EcoVadis 重要但并非不可替代；买方将其视为多个输入之一，而估值预期仍然偏高。
        - 下行主要由倍数收缩或结构复杂的融资轮次驱动，而不只是品类需求不足。
        - 盲点批评、对额外尽调的依赖以及未经验证的融资条款，主导投资判断。
        - 若当前指标令人失望，或融资价格重置到隐含溢价预期以下，这一情景的可能性会更高。
    notes: 情景表采用定性估值逻辑，因为保留的公开记录没有披露形成数值区间所需的当前输入。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
