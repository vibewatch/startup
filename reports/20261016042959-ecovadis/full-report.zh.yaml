      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              因此，现有证据中的护城河是有条件的，而非绝对的。大型买方要求统一的供应商评级流程、监管复杂度又偏好带企业采购系统集成的多主题分析师审核基准时，EcoVadis
              更具持久性。主要替代风险不只是出现一个同类评级初创公司；采购套件、较窄的披露工具或内部项目，也可能为不需要完整基准网络的预算负责人解决足够多的问题。由于资料中没有公开定价证据，稳妥结论是：EcoVadis
              确有流程和网络优势，但竞争力仍取决于买方是否持续接受共享评级模式。
            claimRefs:
