              - CV005
              - CV007
              - CV014
          - type: callout
            title: 反投资逻辑是产品与估值不透明，而非品类无关紧要
            body: 最强的下行信号是 EcoVadis 不应成为唯一尽调工具，且当前估值输入仍未验证。
            calloutType: risk
            claimRefs:
