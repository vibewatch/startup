  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐逻辑从可见的品类规模和需求支撑出发，落到尚未解决的估值披露和投资判断纪律。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 175K 家已评级公司和 3M 家已筛选供应商，显示平台覆盖面可见。
          value: 175K / 3M
        - id: demand
          label: 需求支撑
          detail: 2026 年买方预算和跨境合规压力仍支撑这一品类。
          value: 87% / 75%
        - id: differentiation
          label: 差异化
          detail: Verdantix 领导者定位、分析师验证和相邻模块共同支撑其相关性。
        - id: monetization
          label: 变现线索
          detail: 已有订阅价格，但公开证据无法连接到当前 ARR、利润率或留存。
          value: €350-€6,500
        - id: frictions
          label: 投资判断阻力
          detail: 第三方来源警告评级不应成为唯一尽调工具，且融资披露稀薄。
          tone: risk
        - id: recommendation
          label: 继续研究 / 估值未知
          detail: 在评估入场价格前，等待主要财务数据和资本表证据。
          tone: risk
      edges:
        - from: scale
          to: demand
          label: 只有品类需求持续，规模才有意义
        - from: demand
          to: differentiation
          label: 产品质量清晰可见时，顺风更强
        - from: differentiation
          to: monetization
          label: 产品相关性仍须转化为经济性
        - from: monetization
          to: frictions
          label: 指标缺失和产品局限扩大折价
        - from: frictions
          to: recommendation
          label: 价格纪律始终最重要
    approximationNotes: 该图是定性决策链，而非定量模型或隐含估值桥接。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
