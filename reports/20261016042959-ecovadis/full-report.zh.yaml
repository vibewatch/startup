        blocks:
          - type: paragraph
            body: >
              当前最有力的运营模式证据来自职能而非履历。EcoVadis 称，其评估结合了先进 AI、与 UN Global Compact、GRI 和 ISO 26000 的对齐，以及 500
              多名内部可持续发展分析师的审核。一则当前 LinkedIn 招聘信息显示，公司在不断扩大的 AI 卓越中心内招聘驻巴塞罗那的高级知识图谱工程师，说明其仍在投资 AI
              增强型产品基础设施，并在西班牙形成技术布局。同样重要的是，现有资料没有提供直接公司领导层页面或独立治理报道中的具名创始人、现任 CEO、董事会构成或股东控制披露，因此后续对管理层质量和所有权的判断需要新证据。
