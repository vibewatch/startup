          label: 买方流程使用
          detail: 监控、仪表盘、纠正措施计划和网络共享，使评分卡嵌入采购运营。
        - id: expansion
          label: 相邻模块扩展
          detail: 碳、智能、社区和培训产品，为基础评级之外创造加购收入路径。
      edges:
        - from: request
          to: subscription
          label: 需求触发
        - from: subscription
          to: evidence
          label: 付费访问
        - from: evidence
          to: review
          label: 标准化输入
        - from: review
          to: scorecard
          label: 评估输出
        - from: scorecard
          to: workflow
          label: 采购使用
        - from: workflow
          to: expansion
          label: 加购路径
    approximationNotes: 这是依据公开产品资料和说明性证据搭建的定性流程桥接图；不代表转化率或毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI010
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一个分层运营模型，覆盖信息接收、评分逻辑、外部监控、分析师审阅以及买方 / 供应商流程。
    data:
      layers:
        - label: 用户流程
          detail: 买方和供应商各自的运营路径建立在同一评级系统之上。
          outputs:
            - 买方筛选与采购决策
            - 供应商评估与复评
        - label: 参与层
          detail: 改进指导和赋能让流程在首次评分后继续运转。
          modules:
            - 改进计划与基准比较
            - Community 与在线学习
        - label: 评分输出
          detail: 核心输出将可比的可持续发展判断打包，供运营使用。
          outputs:
            - 评级与评分卡
            - 风险与碳信号
        - label: 验证层
          detail: 人工审阅和证据处理位于原始输入与面向客户的输出之间。
          modules:
            - 内部可持续发展分析师
            - 证据审阅与评分决策
        - label: 智能层
          detail: 公开的技术岗位招聘表明，产品背后的图谱和智能体基础设施正在扩展。
          modules:
            - AI 辅助监控
            - GraphRAG、实体解析与 MCP 工具
        - label: 数据摄取
          detail: 产品输入涵盖问卷、上传文件和受监控的外部信息。
          modules:
            - 问卷与支持文件
            - 外部来源与企业数据流
    approximationNotes: 分层结构综合自公开产品文案、文档和一份技术岗位招聘信息；指定证据池没有公开说明供应商管理的安全、API 和基础设施组件。
    claimRefs:
      - CE002
      - CE005
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 买方要求将供应商拉入网络，随后评分共享、社区参与和改进流程带来扩展路径。
    data:
      items:
        - label: 买方要求
          touchpoints:
            - 采购负责人要求供应商完成 EcoVadis 评估。
            - 最低评分要求可能影响投标资格。
        - label: 供应商入驻
          touchpoints:
            - 供应商创建账户并为评估准备证据。
            - 年度订阅和评分卡周期构成商业关系框架。
        - label: 专家评分
          touchpoints:
            - EcoVadis 分析师审阅提交的证据和外部输入。
            - 供应商和买方组织都可以使用评分卡。
        - label: 可共享评分卡
          touchpoints:
            - 一次评估可以在更广泛的客户网络中共享。
            - 复用减少供应商重复填写问卷的摩擦。
        - label: 社区层
          touchpoints:
            - 采购负责人和可持续发展从业者可以访问社区资源。
            - 现在非 EcoVadis 客户也可以访问社区。
        - label: 扩展与改进
          touchpoints:
            - 客户案例强调新业务成果、供应商风险流程和落地支持。
            - 在 2026 年 7 月的供应商风险数据中，更深层级的采用似乎仍不完整。
    claimRefs:
      - CU004
      - CU005
      - CU007
      - CU008
      - CU009
      - CU010
      - CU015
