      - number: '4.3'
        title: 资本基础、成本结构与投资判断盲区
        blocks:
          - type: paragraph
            body: >-
              外部市场数据页面显示 EcoVadis 已筹集大量私人资本并组建了较大团队，但公开记录仍过于稀薄，无法评估资本充足性。Tracxn 列出累计融资 $732M、2022 年 $500M 的 Series
              D、最近已知 $1B 估值，以及 1,001–5,000 名员工的区间，至少暗示其固定成本基础不小。独立和官方材料还指向一种混合交付模式：500 多名内部分析师、AI
              辅助流程和大量文件审核，这可能有助于留存和信任，但也意味着不低的服务成本。核心投资判断数据仍缺失：当前 ARR 或收入、增长、毛利率、NRR/GRR、CAC 或回本期、现金、债务和现金跑道。
