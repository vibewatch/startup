      - number: '3.3'
        title: 定价与切换权衡
        blocks:
          - type: paragraph
            body: >-
              现有资料对公开定价的覆盖最弱，因此比较只能依靠产品包装和流程信号，而不是价目表算术。即便如此，证据仍显示出清晰权衡：买方需要标准化、可重复且供应商可复用的基准时，EcoVadis
              更有杠杆；但如果买方只需要较窄的环境披露、基础供应商声明或咨询主导的准备流程，替代方案仍然可行。这些替代方案可能降低部分场景的前期变革管理成本；而当买方重视共同标准、供应商间可比性和对更广采购运营的集成时，EcoVadis
              的优势最明显。
            claimRefs:
              - CP004
