            body: >
              EcoVadis 将自己定位为供应链可持续发展评级与情报平台，而不是单点披露工具。官网称，其互联系统把分散的可持续发展输入转化为可比较的评级，覆盖 180 多个国家的 175,000 多家公司；同时声称已筛查
              300 万家供应商、覆盖 230 个行业。第三方及公司周边来源都印证了其具备一定规模，但分母各不相同：一份公司撰写的 2026 年报告称，超过 150,000 家企业使用 EcoVadis 工具；一份 2026
              年 7 月的联合发布稿则称，2021 至 2025 年间有超过 100,000 家公司获得评级，买方组织超过 1,400 家。这些数字大体支持其品类触达范围，但没有新的交叉验证前，不应将其合并为客户数代理指标。
