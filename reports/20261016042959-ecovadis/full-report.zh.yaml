  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可观察触达范围
        blocks:
          - type: paragraph
            body: >-
              公开来源始终将 EcoVadis 归入供应链可持续发展评级与情报，而不是广义 ESG
              披露软件。官方材料称，该平台围绕核心评级流程，从环境、劳工与人权、道德和可持续采购等维度评估供应商，再叠加风险地图、碳管理和改进工具。这一定位对投资判断很关键：相关预算是与供应链执行挂钩的供应商风险、采购、合规和脱碳支出，而不是所有企业
              ESG 软件预算。其已安装触达范围确实可观，但公开数字反映的是采用视角，不是市场规模：EcoVadis 声称评级覆盖 180 多个国家的 175,000 多家公司，已筛查 300 万家供应商，并在 2025
              年指数材料中称 2024 年完成 49,000 次评级、2020 年以来完成 159,000 次。这些数字展现了网络广度和活跃度，却没有拆出总支出、付费渗透率，或可能将 EcoVadis
              标准化部署的买方中可服务的份额。
