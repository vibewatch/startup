        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开画像是采购驱动的订阅模式。一份独立说明称，客户、潜在客户或贷款方要求公司评级后，评估才会开始；被评级公司支付年度订阅费，买方组织则另行付费获取网络访问权。因此，EcoVadis
              不像一次性认证供应商，更像一个收入取决于续费、买方分发和套餐增购的经常性流程平台。公开变现信号也超出核心评分卡：官方页面将评级与监测、仪表盘、整改计划、在线学习和独立碳模块配套，显示出先落地再扩张的潜力，尽管实际合同金额尚未披露。
