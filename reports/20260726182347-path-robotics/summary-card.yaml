  topStrengths:
    - Strong late-stage funding support including a $100M Series D and an official $300M+ cumulative funding claim.
    - Clear product differentiation around programming-light autonomous welding for variable, high-mix manufacturing.
    - >-
      Real customer and partner proof spanning heavy fabrication, TYCROP-style labor-shortage use cases, and early
      shipbuilding programs with HII and Saronic.
    - >-
      Large robotic-welding and industrial-automation market tailwinds supported by multiple 2026 analyst market
      reports.
    - >-
      Patent estate and strategic manufacturing relationships make the moat more credible than a typical early robotics
      narrative.
  topRisks:
    - >-
      Public sources still do not disclose current revenue, gross margin, burn, runway, or retention with enough detail
      for full underwriting.
    - >-
      No confirmed current post-money valuation or financing structure is publicly available, limiting valuation
      discipline.
    - >-
      Pilot-to-production conversion in shipbuilding and other new verticals remains early and could prove slower or
      costlier than the narrative suggests.
    - >-
      Support burden, deployment complexity, and quality assurance in hazardous industrial environments can compress
      margins and slow scale.
    - Large incumbents and integrators can compete with stronger service networks and broader installed bases.
  unresolvedGaps:
    - Current post-money valuation, liquidation preferences, debt covenants, and other cap-table terms remain private.
    - Revenue quality, backlog conversion, gross margin, support-unit economics, and runway are not publicly disclosed.
    - >-
      Customer durability data such as repeat-cell expansion, renewal, and concentration remain thin in the public
      record.
    - >-
      HII, Saronic, and mobile welding programs look strategically important, but their paid scope and
      production-conversion path are still unclear.
    - Official company materials list founding in 2018 while some third-party databases still list 2014.
