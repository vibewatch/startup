- id: traction-versus-financial-opacity
  title: Traction versus financial opacity
  body: 'Path clearly passes the “real business” threshold but not the “publicly underwritable financial profile” threshold. The official 2025 review gives the strongest traction claim with bookings above $100 million, and expansion hiring plus shipbuilding announcements show ongoing commercial ambition. Yet the same source base stops short of what later-stage financial diligence actually requires. There is no audited revenue, no public gross margin, no customer-concentration disclosure, no contract-value range, and no evidence of payback or renewal by cohort. Built In’s adverse summary is useful because it states the core problem directly: growth indicators lean on bookings and announcements rather than audited revenue or shipment figures. Premier Alternatives adds a conflicting valuation estimate that further warns against equating fundraising and current enterprise value. The right financial conclusion is therefore balanced. Path looks well funded, commercially active, and strategically
    ambitious, but public evidence is still too thin to support a high-confidence verdict on revenue quality, margin path, or runway durability.'
