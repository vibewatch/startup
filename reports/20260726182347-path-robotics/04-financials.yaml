- id: cost-structure-and-service-delivery-burden
  title: Cost structure and service-delivery burden
  body: Everything public about Path points to a business with real delivery burden. The company is not just licensing software. It runs autonomous hardware, promises 24/7 mission-control support, maintains a field-deployable stack, and now markets contract manufacturing through Path Foundry with certified welding personnel in the loop. The Columbus expansion release also links additional hiring directly to production capacity and market demand, reinforcing the likelihood of substantial labor, facility, testing, and deployment expense. Rove adds another layer by pushing the company toward more mobile and potentially less standardized operating environments. This does not make the model unattractive; in industrial automation, service intensity can deepen switching costs and customer stickiness. But it does mean gross margin path and working-capital needs depend on utilization, support efficiency, and deployment discipline, none of which are disclosed publicly. Investors should underwrite
    Path as a capital- and operations-intensive industrial-AI company, not as an asset-light pure software platform.
  claimRefs:
  - CI001
  - CI009
  - CI010
