- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on diligence
  - Current proxy
  - Why proxy is insufficient
  - Exact diligence path
  rows:
  - - Recognized revenue
    - Cannot translate bookings into quality of revenue
    - Bookings >$100M in 2025
    - Bookings can include future or staged delivery commitments
    - Request audited revenue and monthly recognized revenue trend
  - - Gross margin by stream
    - Cannot underwrite software leverage versus services drag
    - Support claims and Foundry staffing signals
    - Qualitative signals do not quantify margin
    - Request gross margin by product support and Foundry
  - - Burn and runway
    - Cannot judge financing dependency or next-round timing
    - Total capital raised and hiring expansion
    - Raised capital does not equal remaining cash
    - Request cash balance burn and base-case runway
  - - Customer concentration
    - Cannot measure revenue durability or negotiation risk
    - HII and shipbuilding announcements suggest larger accounts
    - Announcements do not show purchase concentration
    - Request top-10 customers and percent of revenue
  - - Contract value and renewal
    - Cannot compare Path monetization with peer public price bands
    - RaaS and Foundry structure hints recurring potential
    - Structure without numbers is not underwritable
    - Request ACV TCV renewal and expansion cohort data
  - - Working capital and capex plan
    - Cannot model cash conversion or scaling burden
    - Production expansion and mobile product launches
    - Growth announcements omit equipment and inventory detail
    - Request capex roadmap installation working capital and debt schedule
  notes: The chapter’s main blocker is not whether Path has a business; it is whether public evidence reaches the standard needed for late-stage underwriting.
