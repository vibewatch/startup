- id: capital-formation-and-capital-adequacy
  title: Capital formation and capital adequacy
  body: 'Public capital-formation evidence is good, but adequacy evidence is still indirect. The October 2024 Series D is well corroborated at $100 million led by Matter Venture Partners and Drive Capital, and the current official newsroom claims more than $300 million raised overall. That level of financing is materially large for a welding-automation startup and helps explain why the company can support headquarters expansion, product development, and new category bets like Rove and Path Foundry. The 2026 Gaingels-linked Form D adds a useful but limited signal: it shows investor syndication activity around a Path-linked vehicle, not a disclosed Path corporate cash balance. Likewise, SEC Form D guidance clarifies that these filings are financing notices, not evidence of revenue quality or free cash flow. The net effect is that Path appears well capitalized relative to niche peers, but public evidence still does not disclose monthly burn, cash on hand, or runway months. Capital strength
    is plausible; capital adequacy is not yet fully evidenced.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI018
