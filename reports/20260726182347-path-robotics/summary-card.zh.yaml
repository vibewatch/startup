  topStrengths:
    - 后期融资支持扎实，包括 $100M Series D，以及官方披露的累计融资超过 $300M。
    - 面向多变、小批量多品种制造，产品差异化清晰：自主焊接对编程依赖更低。
    - 客户和伙伴证据真实，覆盖重型制造、TYCROP 式劳动力短缺场景，以及与 HII、Saronic 的早期造船项目。
    - 多份 2026 年分析师市场报告支撑机器人焊接和工业自动化市场的长期顺风。
    - 专利组合和战略制造关系让护城河更像真资产，不只是常见早期机器人公司的叙事。
  topRisks:
    - 公开来源仍未充分披露当前收入、毛利率、烧钱速度、现金跑道或留存，无法支撑完整承销。
    - 当前投后估值和融资结构没有公开确认，估值纪律因此受限。
    - 造船等新垂直领域仍处在从试点转向量产的早期，节奏可能比叙事更慢，成本也可能更高。
    - 危险工业环境里的支持负担、部署复杂度和质量保证会挤压利润率，也会拖慢规模化。
    - 大型既有厂商和集成商拥有更强服务网络、更广装机基础，竞争压力不轻。
  unresolvedGaps:
    - 当前投后估值、清算优先权、债务契约和其他股权结构条款仍未公开。
    - 收入质量、积压订单转化、毛利率、支持单元经济性和现金跑道没有公开披露。
    - 重复工作站扩张、续约和客户集中度等客户耐久性数据，在公开记录里仍然稀薄。
    - HII、Saronic 和移动焊接项目看起来具备战略重要性，但付费范围和量产转化路径仍不清楚。
    - 公司官方材料写明成立于 2018 年，但部分第三方数据库仍列为 2014 年。
