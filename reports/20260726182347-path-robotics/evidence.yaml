      - QI002
      - QI024
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: private-evidence-only
    severity: important
    topic: customer concentration and cohort quality
    missingEvidence: Top-customer share of revenue expansion rates renewal behavior and pilot-to-production conversion.
    whyItMatters: >-
      Late-stage underwriting depends on knowing whether growth is diversified durable and repeatable across customer
