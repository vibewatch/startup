    severity: important
    topic: Rove field reliability
    missingEvidence: >-
      Pilot uptime error-rate maintenance burden and human-supervision requirements for Rove in live shipyard or
      construction environments.
    whyItMatters: >-
      The mobile form factor is strategically important, but the hardest operating questions appear only after field
      deployment begins.
    diligencePath: Request pilot logs support escalations MTBF estimates and site-readiness requirements from early-adopter programs.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: important
    topic: generalization across materials and weld types
    missingEvidence: Coverage maps for MIG TIG plasma and material-specific performance under varying fit-up conditions.
    whyItMatters: >-
      A broad autonomy claim is only durable if the model generalizes beyond a narrow training set or demo-friendly
      workload.
    diligencePath: Request qualification matrices by process material thickness joint geometry and environmental variability.
    relatedQuestionRefs:
      - QE023
      - QE024
    relatedTableRefs:
      - TE001
      - TE005
  - type: private-evidence-only
    severity: important
    topic: model-governance and update cadence
    missingEvidence: How often Obsidian models are updated validated rolled back and certified for production customers.
    whyItMatters: >-
      A data-flywheel promise is compelling, but production autonomy also needs disciplined model governance and release
      management.
    diligencePath: Request MLOps documentation validation workflow and release criteria for fielded systems.
