evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited revenue
    missingEvidence: Audited revenue gross margin and recognized run-rate disclosures for 2025-2026.
    whyItMatters: >-
      Bookings and deployment proof are useful but they do not reveal unit economics revenue quality or path to
      profitability.
    diligencePath: >-
      Request audited financial statements or management reporting that bridges bookings backlog revenue recognition and
      gross margin.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: customer count
    missingEvidence: A clearly dated independently corroborated customer-count disclosure or cohort breakdown.
    whyItMatters: Chapter-one cover metrics should separate marketing narratives from measurable installed-customer scale.
    diligencePath: Ask management for current active-customer count deployed-cell count and top-customer concentration by revenue.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Exact Series D post-money valuation and a current cap-table bridge reconciled against secondary-market marks.
    whyItMatters: >-
      The valuation story changes materially depending on whether the 2024 round confirmed a unicorn-class price or
      secondary trading now sits far below that level.
    diligencePath: Request the Series D term sheet post-money cap table and any board-approved 409A or secondary pricing references.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public leadership and milestone coverage
    missingEvidence: A complete public org chart board-rights disclosure and a fuller dated milestone archive.
    whyItMatters: >-
      The leadership stakeholder and milestone tables are intentionally partial because public materials expose only the
      most visible names investors and events.
    diligencePath: Request a current org chart board observer list financing chronology and archived press timeline from management.
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: public pricing
    missingEvidence: A public or disclosed price range by cell deployment type contract model or annual service equivalent.
    whyItMatters: >-
      Buyer qualification and practical SAM depend on whether the product clears budget thresholds for job shops
      utilities and heavy-industry accounts.
    diligencePath: >-
      Request list-price analogs minimum contract values and payback examples by segment from sales or customer
      references.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: end-market mix
    missingEvidence: Revenue or deployment mix by automotive heavy fabrication utilities shipbuilding and prefab categories.
    whyItMatters: Public case studies show breadth but not where most commercial demand actually concentrates today.
    diligencePath: Ask management for deployments bookings and revenue by end market for the last 12 months.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: rollout conversion
    missingEvidence: Pilot-to-production conversion rates and expansion cohorts by customer type.
    whyItMatters: >-
      Market attractiveness depends not only on initial interest but on whether early pilots compound into scaled
      installed bases.
    diligencePath: Request cohort data covering pilots landed time-to-go-live expansion rate and churn or decommissioning outcomes.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: Path public pricing
    missingEvidence: >-
      A current public list price minimum contract value or disclosed pricing range for Path fixed cells and Rove
      deployments.
    whyItMatters: >-
      The competitor chapter can see concrete public entry prices for Vectis and Hirebotics but cannot benchmark whether
      Path sells at a premium justified by autonomy.
    diligencePath: >-
      Request current pricing cards pilot pricing minimum contract terms and at least three recent customer deal
      examples segmented by part size and deployment model.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: Head-to-head win loss data
    missingEvidence: >-
      Named competitive win rates against Lincoln Miller Novarc Vectis Hirebotics and incumbent integrators by segment
      and deal stage.
    whyItMatters: >-
      Public product surfaces show who can compete, but they do not reveal whether Path consistently wins after paid
      pilots or loses on price support or incumbent bias.
    diligencePath: >-
      Ask management for pipeline conversion by competitor reason codes pilot-to-production outcomes and recent churn or
      replacement events.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
      - TP004
  - type: missing-source
    severity: material
    topic: Comparative weld quality benchmarks
    missingEvidence: >-
      Normalized defect rate rework and first-pass-yield data comparing Path against cobot packs incumbents and Novarc
      on similar weld families.
    whyItMatters: >-
      The moat thesis depends on autonomy producing measurably better outcomes rather than only more sophisticated
      marketing language.
    diligencePath: >-
      Request customer benchmark studies acceptance data and test-cell results across comparable materials joint
      geometries and production variability.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP002
      - TP004
  - type: partial-enumeration
    severity: important
    topic: Capability-matrix coverage limits
    missingEvidence: >-
      Some matrix cells reflect public posture rather than fully disclosed technical parity across every vendor
      configuration.
    whyItMatters: >-
      Vendors often publish only flagship use cases, so absence from a public page should not be confused with a hard
      product limitation.
    diligencePath: >-
      Validate contested matrix cells through demo scripts application notes and direct technical diligence with each
      shortlisted rival.
    relatedQuestionRefs:
      - QP012
      - QP018
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: recognized revenue and gross margin
    missingEvidence: Audited or management-provided revenue gross margin and stream mix for 2024 through 2026.
    whyItMatters: >-
      Bookings and funding show momentum, but they do not reveal whether Path is becoming a high-margin software-enabled
      automation platform or a support-heavy industrial-services business.
    diligencePath: >-
      Request monthly revenue by stream gross margin by stream and any audited statements or board reporting used
      internally.
    relatedQuestionRefs:
      - QI012
      - QI013
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: burn runway and cash on hand
    missingEvidence: Cash balance monthly burn base-case runway and financing trigger thresholds.
    whyItMatters: >-
      The company appears well funded, but adequacy cannot be underwritten from raised-capital headlines or SPV filing
      notices alone.
    diligencePath: >-
      Request latest balance sheet cash burn bridge monthly cash use and management runway forecast under base and
      downside scenarios.
    relatedQuestionRefs:
      - QI014
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: Path pricing and realized contract values
    missingEvidence: Public or disclosed ACV TCV minimum contract value and support pricing for cells RaaS and Path Foundry.
