      - - Lincoln Electric
        - 公开市值和收入
        - $13.77B 市值，$4.35B TTM 收入（市值 / 收入约 3.2x）
        - 最接近的大型公开可比公司，业务直接覆盖机器人焊接
        - 成熟且盈利的在位者，披露多得多，已安装基数也更广
      - - ESAB
        - 公开市值和收入
        - $5.24B 市值，$2.91B TTM 收入（市值 / 收入约 1.8x）
        - 披露透明的焊接设备和耗材可比公司
        - 成熟度仍显著高于 Path，也不是纯自主机器人公司
      - - Illinois Tool Works
        - 公开市值与收入
        - $16.22B TTM 收入对应 $81.42B 市值（市值 / 收入约 5.0x）
        - 工业自动化估值上限参照，显示多元化优质资产能拿到的估值
