  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与核心论点
        blocks:
          - type: paragraph
            body: >-
              Path Robotics 看起来是一家质地不错的后期工业自动化公司，但后期价格未知时，公开资料更支持继续跟踪，而不是直接给买入结论。正面信号确实存在：2024 年完成 $100 million Series D
              轮；公司当前材料称累计融资超过 $300 million；Path 称 2025 年订单预订额超过 $100 million；重型制造客户验证可见；还与 HII、Saronic
              建立了战略造船关系。这些披露强于许多私有机器人公司。问题在于，估值承销看价格和经济性，不只看公司质地。公开材料仍未披露收入、毛利率、现金消耗、现金续航、留存或当前投后估值。因此建议必须保持价格敏感。更合适的投资姿态是跟踪
              / 继续研究，直到 Path 的收入质量和当前估值更清楚，或入场结构足以补偿信息缺口。
