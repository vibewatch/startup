  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 安全关键型部署、重服务交付和早期灯塔客户交汇处，剩余风险最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 安全 / 合规执行
          values:
            - label: 中高
              tone: warning
              detail: 即便 OSHA 没有一条只针对机器人的单一规则，现行 OSHA 和焊接要求今天就适用。
            - label: 关键
              tone: negative
              detail: 一起严重事故可能同时冲击工人、客户、监管方和融资信心。
            - label: 中
              tone: warning
              detail: Path 看起来重视安全，但公开的、针对具体部署的证据仍然偏薄。
            - label: 高
              tone: negative
              detail: 只有车队级安全表现可见后，剩余严重度才会下降；在此之前仍然很高。
        - label: 服务模式毛利压力
          values:
            - label: 高
              tone: negative
              detail: 定制安装、支持和维护本来就是产品的一部分。
            - label: 高
              tone: negative
              detail: 如果支持能力放大得不好，毛利和现金需求会一起恶化。
            - label: 中
              tone: warning
              detail: 远程诊断和预防性维护有帮助，但没有公开的单位经济性细节。
            - label: 高
              tone: negative
              detail: 在公司披露可重复的单工作单元经济性前，这个模式仍然暴露在风险中。
        - label: 船厂 / 防务转化
          values:
            - label: 中高
              tone: warning
              detail: 公开记录仍以概念验证、评估和试点为主。
            - label: 高
              tone: negative
              detail: 这些项目支撑叙事可信度，也可能带来大客户价值。
            - label: 中低
              tone: warning
              detail: 战略合作关系已经存在，但商业成熟度还早。
            - label: 高
              tone: negative
              detail: 在生产转化得到证明前，剩余严重度会保持高位。
        - label: 既有厂商竞争
          values:
            - label: 高
              tone: warning
              detail: 大型焊接 OEM 已经有很宽的机器人流程组合和服务纵深。
            - label: 高
              tone: warning
              detail: 在 Path 做大规模前，竞争对手追上来会压低赢单率。
            - label: 中
              tone: neutral
              detail: 今天 Path 在多品种小批量自主焊接上仍显得有差异化。
            - label: 中高
              tone: warning
              detail: 剩余严重度取决于 Path 能把切入口守多久。
        - label: 人才与招聘深度
          values:
            - label: 高
              tone: warning
              detail: 焊接和机器人两个劳动力市场都存在结构性紧缺。
            - label: 中高
              tone: warning
              detail: 招聘缺口会同时拖慢路线图、安装和客户支持。
            - label: 中低
              tone: warning
              detail: 公司在发布职位，但员工规模信号仍然混杂。
            - label: 中高
              tone: warning
              detail: 在留才和人员厚度可见前，剩余敞口仍然不小。
    claimRefs:
      - CR004
      - CR013
      - CR017
      - CR020
      - CR024
      - CR029
      - CR032
      - CR039
      - CR044
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Path 的主要风险经由几个共同通道传导：安全执行、支持成本、试点转化、融资弹性和竞争护城河。
    data:
      nodes:
        - id: n1
          label: 安全 / 合规执行
          description: 工作单元防护、操作员资质、焊接规则遵循和事故预防。
        - id: n2
          label: 客户信任
          description: 客户是否相信 Path 能在生产中安全、可靠地运行。
        - id: n3
          label: 服务负担
          description: 每次部署需要多高强度的安装、维护、诊断和支持。
        - id: n4
          label: 毛利 / 现金消耗
          description: 支持和硬件强度会吃掉多少经济性。
        - id: n5
          label: 试点转化
          description: HII、Saronic 及类似项目能否扩展成可重复业务。
        - id: n6
          label: 融资弹性
          description: 公司能否用可接受条款融资，或守住资本。
        - id: n7
          label: 估值支撑
          description: 投资人能否继续把 Path 按一家有差异化的成长公司来承销。
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n6
        - from: n3
          to: n4
        - from: n2
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n3
          to: n2
        - from: n4
          to: n7
    claimRefs:
      - CR001
      - CR013
      - CR017
      - CR020
      - CR035
      - CR037
      - CR039
      - CR041
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Path 的交付栈同时依赖标准机构、支持运营、灯塔船厂项目、机器人部件，以及既有厂商主导的市场结构。
    data:
      nodes:
        - id: d1
          label: OSHA / 共识标准
          description: 机器人、焊接和移动系统的安全预期会塑造部署方式。
        - id: d2
          label: Path 工程与支持
          description: 内部团队必须把系统造出来、装上去，并长期支撑。
        - id: d3
          label: 部件生态
          description: 传感器、运动硬件、计算和移动平台来自外部采购或集成。
        - id: d4
          label: HII / Saronic / LAD
          description: 能见度高的船厂和防务相邻参考客户。
        - id: d5
          label: 既有焊接 OEM
          description: Lincoln Electric 等大型供应商覆盖更宽的工艺范围。
        - id: d6
          label: Path 商业结果
          description: 收入质量、续约信心和估值支撑。
      edges:
        - from: d1
          to: d2
        - from: d2
          to: d6
        - from: d3
          to: d2
        - from: d4
          to: d6
        - from: d5
          to: d6
        - from: d1
          to: d6
        - from: d3
          to: d6
    claimRefs:
      - CR006
      - CR013
