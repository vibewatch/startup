            body: >-
              Rove 是 2026 年最重要的技术扩张，因为它改变了 Path 试图解决的问题。固定式机器人单元已经需要困难的感知和过程控制，但在大型不可移动结构上移动焊接，还要加入定位、稳定性、导航和工地变化。Path
              官方页面给出具体工作流：移动到预设焊接位置，定位焊缝，实时调整参数，并在补偿热变形的同时采集数据。独立行业报道持续强化同一命题，把 Rove
              描述为一个面向造船和重型建筑的四足平台，适用于无法把工件搬进单元的场景。Saronic 作为早期采用者出现，以及 2027 年仅出货 50
              台的明确上限，共同构成了平衡图景：产品真实到足以重要，但显然仍处于受控早期商业化，而非大规模部署。对尽调而言，Rove 战略上令人兴奋，但执行风险仍重。
