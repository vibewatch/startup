      - number: '1.2'
        title: 领导层、治理与运营班底
        blocks:
          - type: paragraph
            body: >-
              公开领导层可信，但仍比公开市场投资人希望看到的薄。官方页面显示，公司已不再只是两位创始人的故事：Heather Carroll 负责收入，Mike Renn 负责全球运营，Scott Smith
              负责财务，Andrew Lein 负责产品，Matthew Randle 负责安全与可靠性工程，Alexandra Scheimen 负责人力。董事会也在 2025 年 12 月扩充，加入 Rocket Lab
              的 Frank Klein 和 Yale University 的 Geoffrey Chatas；About 页面还显示，Drive Capital 合伙人 Nick Solaro、Matter Venture
              Partners 创始合伙人 Haomiao Huang 与创始人同在董事会。这形成了可见的组合：创始人控制、制造业运营经验和风险资本监督。不过，公开记录仍缺少委员会披露、所有权集中度和治理权利细节。因此，相比把
              Path 看作治理信息充分透明的后期公司，更适合按创始人主导的运营型企业承销。缺口并不否定公司的进展，但 Path 已经足够大、融资足够多，缺失的治理细节不再是私人公司常见小瑕疵，而是尽调事项。
