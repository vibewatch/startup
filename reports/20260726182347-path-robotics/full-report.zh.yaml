  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Path 收入没有公开，因此今天最站得住脚的数值区间，是观察到的上市可比公司收入倍数带，而不是伪造一个单公司估值估计。
    approximationNotes: 该图用观察到的公开参照区间和市场增长范围锚定估值纪律，而不是声称给出 Path 私有估值。
    data:
      items:
        - label: 相关上市可比公司的收入倍数区间（x）
          low: 1.8
          mid: 3.2
          high: 5
          displayValue: 1.8x–5.0x
          detail: ESAB 锚定低端，Lincoln Electric 是中枢参照，ITW 是宽松上限。
          tone: neutral
        - label: 2026 年机器人焊接市场规模区间（USDbn）
          low: 9
          mid: 10.2
          high: 11.49
          displayValue: $9.0B–$11.49B
          detail: Fortune 和 Business Research Insights 对 2026 年规模判断不一致，因此 TAM 可以提示上行空间，但不能制造虚假精确度。
          tone: positive
    claimRefs:
      - CV020
      - CV023
      - CV024
      - CV025
      - CV043
