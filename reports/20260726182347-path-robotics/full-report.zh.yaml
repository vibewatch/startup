    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与产品范围
        blocks:
          - type: paragraph
            body: >-
              Path Robotics 现在把自己定位成聚焦自主焊接的实体 AI 制造商，而不是泛机器人初创公司。公司新闻室列明成立于 2018 年，总部位于 Columbus，累计融资超过 $300M，员工超过 200
              人。About 页面和新闻室确认 Andy 和 Alex Lonsberry 兄弟为联合创始人，Andy 任 CEO，Alex 任 CTO，并把公司起源描述为一项始于 Case Western Reserve
              University 关联地下室工坊的工作，之后在 Columbus 扩张成企业。官方页面和行业报道中的产品定位也高度一致。Path 称 Obsidian 是其制造业基础模型，支撑智能焊接单元，并从 2026 年
              4 月起支撑移动 Rove 系统。其核心公开叙事是：Path
              销售面向可变、真实焊缝的自适应自动化，系统靠感知、建模和调整工作，而不是依赖僵硬编程和完美夹具。这一表述很关键，因为它既解释了投资人为何大手笔下注，也说明后续章节必须验证：这家公司究竟是软件主导的机器人平台，还是本质上仍是节省人工的焊接集成商。
