      - number: '2.4'
        title: 增长驱动、采用约束与节奏
        blocks:
          - type: paragraph
            body: >-
              增长逻辑很强，但并非无摩擦。AWS、BLS 和 Path
              自有材料都指向同一结构性压力：焊接仍是基础设施、能源、交通、航空航天和国防制造的关键环节，而劳动力池老化、岗位空缺仍高。市场报告补充了技术侧：更多买方因劳动力短缺、吞吐和精度而优先考虑自动化，协作机器人、AI
              焊缝跟踪和预测性维护也在改善采用理由。Path 推出 Rove
              还暗示了一个打开市场的命题：在固定式单元吃力的不可移动结构和生产现场中工作。不过，同一组来源也让约束非常清楚。先进机器人焊接仍有资本和集成负担，许多账户缺少编程能力，低批量或高度定制工作仍比营销
              营销演示显示的更难自动化。BLS 还指出，即使替补岗位需求保持高位，自动化也可能限制焊工就业总量增长。对 Path 来说，采用节奏很可能在痛点严重且 ROI
              立刻可见的场景最强：高混合重型制造、短缺驱动账户，以及吞吐失败具有战略代价的行业。市场有吸引力，但它是解决瓶颈的市场，不是瞬间全面替代的市场。
