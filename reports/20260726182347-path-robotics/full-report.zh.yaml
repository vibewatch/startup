    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 预订额转化为可见收入，船厂项目扩张，移动焊接扩大 TAM，Path 守住真实的高混合场景自主能力领先。
        - 如果 Path 展现持续增长，且利润率好于系统集成商，相比成熟公开焊接可比公司的私营溢价倍数就更站得住。
        - 在位者追赶、安全事件或支持成本爬升仍会威胁上行。
        - 有可能，但需要多个公开材料尚未证明的事实。
      - - 基准
        - Path 仍是需求真实的强势细分龙头，但收入质量和利润率披露暂时有限。
        - 当前后期定价应视为充分；可接受的进入点需要信息权、结构安排，或相对隐含溢价预期的折扣。
        - 不透明、转化较慢和资本强度，使建议无法上调到买入。
        - 最符合留存公开记录。
      - - 悲观
        - 试点转化停滞、支持负担上升、竞争缩小差异化，或融资条款恶化。
        - 外部投资人仍缺少经济性证据，因此降价轮或倍数压缩变得可信。
        - 叙事强度掩盖了弱于预期的经营杠杆，或慢于预期的商业化。
        - 公开经济性有限，不能排除。
    notes: 这些情景是定性的，因为公开材料缺少精确回报测算所需的收入和股权结构输入。
