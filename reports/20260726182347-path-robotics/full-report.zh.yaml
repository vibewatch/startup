  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Path Robotics 的正确市场边界不是整个焊接经济。公开市场研究说明了原因。Business Research Insights 预计 2026 年全球焊接市场接近
              $393B，但该类别包含耗材、设备，以及大量人工、半自动和高度自动化流程。Path 不能吃下所有支出。更贴近的是机器人焊接自动化：把机器人、传感、软件和过程控制结合起来，自动处理可变焊缝的系统。Future
              Market Insights 将 2026 年机器人焊接规模定为 $11.72B，Intel Market Research 将机器人焊接系统定为 $8.06B，Business Research
              Insights 将工业焊接机器人定为 $11.49B。这些窄口径对尽调更有用，因为它们更贴合 Path
              的产品范围，尤其是重型制造、公用事业、造船和其他高混合环境。主要替代方案包括人工焊接、加班次、合同制造，以及仍需要刚性夹具和大量编程的传统固定式机器人单元。换句话说，Path
              不只是争夺“焊接预算”；它争夺的是买方是否愿意自动化困难焊缝，而不是继续忍受劳动力稀缺、低吞吐或不灵活的旧自动化。
