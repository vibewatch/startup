  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Path Robotics
              的风险画像，由一个熟悉的初创公司问题主导，只是它发生在不熟悉的工业语境里：公司必须证明，一个技术上可信的自主化故事，能在真实世界的安全、服务和资本负担中规模化存活。公司确有缓释因素——具名客户、国防主承包商关系、已授权专利和新资本——但这些事实也勾勒出下行形状。Path
              卖的不是轻量软件；它把机器人焊接系统部署到受监管、对伤害敏感的环境中，自定义集成、正常运行时间支持、操作员资质和热作业安全都很重要。这意味着一次失手可能同时穿透多层：事故、可靠性问题或部署延迟，会同时伤害客户信任、利润率、融资意愿和估值支撑。因此，风险摘要把安全
              / 合规执行、灯塔客户集中度、服务模型强度和既有供应商反应，放在通用初创波动之上。
