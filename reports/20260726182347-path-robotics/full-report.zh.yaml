            body: >-
              Path 的公开财务故事，在变现逻辑上强于已报告会计结果。可见收入面至少有三层。第一是核心自主单元业务，首页和产品页宣传生产率、降本和支持，但不公布标价。第二是 RaaS 叙事，Path
              明确把购买机器人框定为随时间折旧的快照，并把自己的模式定位成前置 CapEx 的替代方案。第三是 Path
              Foundry，这是合同制造延伸，经济属性不同于简单交付一个焊接单元：它承诺最快四周开始生产，把机器人与熟练人员捆绑，并把买方推向运营费用。合起来看，这些来源暗示一种混合模型：设备、服务和产能都在其中。这在战略上可能有吸引力，但也意味着投资人不应期待简单的
              SaaS 式收入画像，或干净的单线变现故事。
