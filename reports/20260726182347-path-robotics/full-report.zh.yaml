      - number: '8.4'
        title: 情景框架与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              情景框架故意保持定性，因为公开资料不足以支持对 Path 当前估值或收入基数做虚假的数字精度。上行情景里，Path 把订单预订动能和灯塔客户转成可复现、可披露的收入增长；Rove
              和造船业务在既有厂商追上前拉宽护城河。基准情景里，Path
              仍是强势细分龙头，客户需求真实存在，但外部投资人要有信心承销一个溢价后期价格，公司还需要更多时间和披露。下行情景里，支持负担、集成摩擦、试点延误或估值倍数压缩会压出更弱的融资结果，即便技术不错。最后的尽调清单很直接：确认当前收入质量、续约耐久度、股权表和优先权结构、支持单位经济性，以及
