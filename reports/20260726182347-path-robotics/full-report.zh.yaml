companyProfile:
  summary: >-
    Path Robotics 是一家未上市工业自动化公司，为制造商打造 AI 驱动的自主焊接系统。公司销售智能焊接单元、配套支持和自动化服务，以及较新的移动焊接产品；公开证据覆盖重型制造和早期造船项目。Path
    已拿到大额后期风险资本，并称 2025 年订单额超过 $100M，但收入质量、利润率、客户耐久性和当前估值大多未披露。
