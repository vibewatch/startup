      - number: '2.3'
        title: 规模测算口径与实际 SAM
        blocks:
          - type: paragraph
            body: >-
              最稳妥的市场规模结论是：Path 位于一个真实增长、数十亿美元级别的类别里，但公开证据不足以让我们从宽口径 TAM 直接跳到公司特定 SAM。最宽口径是 2026 年约 $393B
              的总焊接市场；它只适合作背景，因为其中大部分支出并不现实地属于自主焊接平台。更窄的自动化口径更重要。Future Market Insights 将 2026 年机器人焊接定为 $11.72B，Business
              Research Insights 将工业焊接机器人定为 $11.49B，Intel Market Research 将机器人焊接系统定为
              $8.06B。区间差异不是噪音，而是定义不同。有些发布方纳入更宽的机器人类别，有些聚焦特定系统，有些按应用或负载等级计数。因此，正确尽调做法是先把今天机器人焊接市场的公开自上而下区间视为约 $8B–$12B，再按
              Path 的实际契合度继续下切：高混合、大零件、难编程、受劳动力约束的制造。Path 越能从固定式单元进入公用事业、造船、重型设备和预制基础设施，更大的实际 SAM
              就越可信。但在客户数、定价和部署批次数据公开之前，实际 SAM 仍比标题式 TAM 幻灯片暗示的更受证据约束。
