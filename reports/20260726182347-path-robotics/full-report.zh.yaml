  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 当前收入与订单转化
        - 季度收入、积压订单转收入情况、客户层面集中度
        - 订单只有转成持久、可确认的经济性才有意义
        - 与管理层和领投方做财务尽调
      - - 毛利率与支持经济性
        - 安装成本、维护负担、现场支持人员配置、单元级贡献毛利
        - Path 可能是高端自动化公司，也可能是服务很重的集成商；两者估值差异很大
        - 财务与运营尽调
      - - 股权结构与融资轮条款
        - 当前投后估值、优先权、按比例跟投权、贷款方契约以及任何特殊载体
        - 公司再强，只要价格或结构不利，仍可能不是好投资
        - 法务与投资人权利尽调
      - - 客户持久性
        - 按客群看续约率、重复单元扩展、流失率和合同期限
        - 客户验证已有，但持久性大多仍未公开
        - 商业与客户背书尽调
      - - 船厂转化路径
        - HII、Saronic 及相关项目的付费范围、里程碑和成功标准
        - 上行空间很大一部分取决于这些标杆账户能否从试点放大
        - 项目管理与客户背书尽调
      - - 护城河验证
        - 赢单 / 输单数据、基准对比，以及既有厂商在多品种小批量自主能力上无法追平 Path 的证据
        - 溢价估值不能只靠动人的产品故事
        - 技术与商业尽调
    notes: 这是从估值框架推进到实际投资判断所需的最低材料包。
    claimRefs:
