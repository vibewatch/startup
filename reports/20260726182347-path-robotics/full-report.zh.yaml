        title: 商业验证、增长信号与第一章缺口
        blocks:
          - type: paragraph
            body: >-
              Path 已通过第一道门槛：公司真实存在且商业上活跃。官方案例材料显示 TYCROP、Mine Rite、Cheetah Manufacturing、Nello 和一个大型发电机油箱项目的用例；2025 年末和
              2026 年公告又显示，公司正通过 LAD Services、Saronic 和 HII 进入造船。Modern Machine Shop 补充了关键运营细节：公司以 RaaS
              模型打包系统，把硬件、软件、监控和维护捆在一起，这既解释了低 CapEx 销售话术，也解释了为何需要强支持基础设施。公开性能主张同样重要。Path 称其单元速度最高可达人工焊接的 17 倍，成本降低超过
              30%，一次通过率高于 97%，并能在客户现场连续运行——这些环境往往因劳动力短缺而难以安排第二班。不过，概览仍无法回答几个承销问题。公开材料没有给出经审计收入、毛利率、客户数量或 Series D
              确切投后估值，第三方数据库与公司在成立年份和员工数上也不一致。这些缺口不至于杀死投资论点，但会让这个原本亮眼的工业 AI 故事只能保持审慎信心。
