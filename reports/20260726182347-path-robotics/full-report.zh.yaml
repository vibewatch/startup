      - number: '7.3'
        title: 运营、伙伴与客户风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Path 的差异化带来的负担和优势一样多。Modern Machine Shop 对服务包的描述很清楚：Path
              不只是交付一只焊接机械臂；它交付自定义单元、工艺设备、支持、诊断和持续维护。客户喜欢这一点，因为它降低自动化失败率，但执行风险也因此集中在 Path 的现场和支持组织内部。最新船厂案例强调了这一点。HII 的
              HYPR 时间线仍是 2026 年概念验证、2027 年试点，Saronic 则明确正在生产中评估 Rove。这些项目具有战略价值，但仍足够早，验证和失败的重要性高于收入规模。竞争侧，Lincoln
              Electric 广得多的机器人焊接足迹说明，Path 正在和工艺目录更深、集成商网络成熟、支持历史更长的既有供应商赛跑。公开证据仍支持 Path
              的命题：高混合变化是真实楔子；但还不能证明一旦大型既有供应商产品化类似自适应功能，楔子仍保持打开。
