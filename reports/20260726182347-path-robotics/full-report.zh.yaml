  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 自动化市场大且仍在增长，焊工结构性短缺；两者合在一起，为自主焊接提供可信的需求顺风。
        - 如果用工压力明显缓和，或机器人焊接采用停滞，论点里的市场支撑就会变弱。
      - - 作为一家私营机器人初创公司，Path 的公开证据异常强：大额融资、客户案例、HII、Saronic、专利，以及 >$100M 预订额说法。
        - 如果这些证据点无法转化为已披露的收入质量或重复部署，它们仍只是叙事信号，不是估值支撑。
      - - 公开可比公司锚点显示，经过验证的工业自动化业务，一旦收入和盈利质量可见，就能拿到有意义的倍数。
        - 没有 Path 收入披露，基于可比公司的上行仍是假设，无法承销。
      - - 在位者竞争和服务强度是主要反论点；Path 规模化之前，它们就可能同时压缩增长和利润率。
        - 更清晰的赢单 / 输单记录、重复工作站扩张和支持效率数据，会显著强化论点。
    notes: 只有正向证据从战略信号变成经济性证据，建议才会上调。
