  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到投资论点
      - 行动含义
    rows:
      - - 收入透明度没有实质改善
        - 到下一次融资决策点，公司仍不披露收入质量、毛利率和续约数据
        - 可比估值纪律无法落地，建议只能停留在观察
        - 没有经济性数据，不领投也不抬价
      - - HII 或 Saronic 项目未能转化
        - POC 或评估仍像试点，没有付费扩展
        - 削弱船厂增长和护城河扩展论点
        - 下调国防与移动焊接相关上行情景
      - - 支持负担增速超过单系统收入
        - 安装、维护或现场支持成本涨得比经常性收益更快
        - 压缩利润率，并推高资本强度
        - 把 Path 重估为较低倍数的系统与服务业务
      - - 既有厂商在自适应焊接上追赶
        - 大型 OEM 凭相近自主能力叙事和更强服务覆盖，拿下更多多品种小批量任务
        - 削弱护城河和溢价倍数逻辑
        - 收紧进入纪律，下调预期上行空间
      - - 融资条款恶化
        - 新一轮融资结构过重、内部估值下调，或优先权压力清晰可见
        - 说明估值拉得过高，议价能力变弱
        - 建模降价轮风险和下行保护需求
      - - 安全或质量信号走弱
        - 重大部署问题、客户背书流失或认证受挫公开浮现
        - 直接伤害市场对安全关键自动化品类的信任
        - 暂停投资判断，直到根因和补救方案可信
    notes: 论点破裂既是运营问题，也是财务问题，因为 Path 的估值依赖危险工业场景中的可信部署。
