      - number: '7.4'
        title: 财务、人员与否决条件
        blocks:
          - type: paragraph
            body: >-
              财务和人员风险紧密相连，因为 Path
              的商业模式硬件和服务密集，而公开披露异常稀薄。公司可以指向订单额、产品发布和灯塔合作，但外部观察者仍无法清楚看见收入质量、现金消耗、跑道、客户集中度、续约模式或服务毛利率。同时，帮助 Path
              销售产品的劳动力背景，也约束 Path 自己的执行。AWS 劳动力数据继续显示焊工结构性短缺，Path 还在招聘稀缺的机器人和感知人才，以构建并支持越来越复杂的系统。Built In
              上混合的员工数信号进一步说明，这还不是一个充分去风险的扩张故事。正确承销姿态因此应基于里程碑。若 Path
              能把试点转化为重复部署，展现安全和正常运行时间纪律，并保持融资灵活性，投资论点仍成立；若移动和国防扩张带来的复杂度超过可重复单位经济性，或装机支持负担增长快于耐久收入，投资论点就会破裂。
