              公开资本形成证据不错，但资本充足性证据仍是间接的。2024 年 10 月 Series D 获充分交叉印证，规模 $100M，由 Matter Venture Partners 和 Drive Capital
              领投；当前官方新闻室称累计融资超过 $300M。对一家焊接自动化初创公司来说，这一融资水平实质上很大，也解释了公司为何能支持总部扩张、产品开发，以及 Rove 和 Path Foundry
              这类新类别下注。2026 年 Gaingels 相关 Form D 增添了有用但有限的信号：它显示围绕 Path 关联载体的联合投资活动，而不是披露 Path 公司现金余额。同样，SEC Form D
              指引说明，这些申报是融资通知，不是收入质量或自由现金流证据。净效果是，相较小众同业，Path 看起来资本化很好；但公开证据仍未披露月度现金消耗、账上现金或跑道月数。资本实力可信；资本充足性尚未完全被证实。
