      - CR021
      - CR025
      - CR026
      - CR043
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于强品类和强产品信号，能否压过收入与价格可见度仍然很大的缺口。
    data:
      nodes:
        - label: 机器人焊接大顺风
          detail: 分析师报告都指向一个有规模、在增长的自动化市场，背后还有劳动力短缺支撑。
          tone: positive
        - label: 真实战略证明
          detail: Path 有 $100M Series D、客户案例、专利和船厂关系。
          tone: positive
        - label: 经济性可见度缺口
          detail: 收入、毛利、留存、现金消耗、现金续航和投后估值仍未公开。
          tone: negative
        - label: 上市可比公司现实
          detail: 相关上市可比公司的交易基础是已披露收入和盈利质量，而不只是叙事。
          tone: neutral
        - label: 估值立场
          detail: 在未知后期轮估值下，更应对价格和证据敏感，而不是直接看多。
          tone: warning
        - label: 建议
          detail: 继续跟踪 / 深入研究，等经济性或入场价格改善。
          tone: warning
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV020
      - CV021
      - CV022
      - CV035
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 观察到的上市可比公司市值 / 收入参照，给出了私人投资者可用来做现实校验的区间。
    approximationNotes: 数值来自引用的公开来源：用公开市值数字除以对应 TTM 收入数字。
