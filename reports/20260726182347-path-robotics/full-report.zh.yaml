      - number: '8.2'
        title: 融资背景与可比公司锚点
        blocks:
          - type: paragraph
            body: >-
              可比公司不能直接告诉投资人 Path 今天值多少钱，但会划出一个公开现实区间：任何后期私募价格最终都要长进这个区间。按公开市值和收入参照，Lincoln Electric 的市值 / 收入约 3.2x，ESAB
              约 1.8x，Illinois Tool Works 约 5.0x。ITW 只是噪音较大的上沿参照，因为它是宽口径工业集团，不是纯焊接公司；Lincoln 和 ESAB 更贴近，但也比 Path
              成熟得多，盈利能力和透明度都高得多。差异很关键。后期私有机器人公司如果复合增长快、护城河耐久，可以相对增长较慢的上市既有厂商 享受溢价；但公开市场投资者仍会把价值锚在已披露收入和盈利质量上。Path
              的公开档案没有给出这种经济性颗粒度。估值纪律因此很清楚：公开可比区间可以作为参考护栏，但没有 Path 自身更充分的披露，无法支撑某个具体私募估值。
