      - CU025
      - CU029
      - CU037
    data:
      items:
        - label: 已审阅的具名公开客户案例
          value: 9
          unit: accounts / organizations
          note: 具名案例：TYCROP、Mine Rite、Nello、Cheetah、Millerbernd、AMSi、LAD Services、Saronic、HII
        - label: 有客户或合作伙伴直接引述的具名案例
          value: 6
          unit: accounts / organizations
          note: TYCROP、LAD Services、Saronic、HII，以及 Path 归因的 Mine Rite 和 Cheetah 相关证言
        - label: 有明确量化结果的具名案例
          value: 2
          unit: accounts
          note: TYCROP 的吞吐 / 效率提升，以及 Mine Rite 相当于第二班次的产能
        - label: 仍处于 FAT 或实施交接阶段的具名案例
          value: 3
          unit: accounts
          note: Nello、AMSi 和发电机罐体类证据更强调准备就绪，而非长周期生产
        - label: 防务 / 造船项目仍未放量
          value: 2
          unit: programs
          note: Saronic 处于铺开学习阶段；HII 计划 2026 年做概念验证、2027 年试点
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 成熟重型制造客户的证据质量最强；最新的船厂客户战略价值最高，但成熟度更低。
    claimRefs:
      - CU006
      - CU014
      - CU022
      - CU025
      - CU032
      - CU039
      - CU040
      - CU037
    data:
      columns:
        - 结果具体度
        - 时效性
        - 生产成熟度
        - 独立性
      rows:
        - label: TYCROP
          values:
            - label: 强
              tone: positive
              detail: 多个来源提到吞吐、效率和按期交付，并配有具名客户高管引述。
            - label: 强
              tone: positive
              detail: 证据更新至 2025–2026 年，并绑定一个正在推进的实施项目。
            - label: 强
              tone: positive
              detail: 证据被表述为成功落地，而不只是探索性 MOU。
            - label: 中等
              tone: neutral
              detail: 最有信息量的细节仍由供应商和合作伙伴主导，不是长期独立客户研究。
        - label: Mine Rite / Nello / Cheetah 集群
          values:
            - label: 中等
              tone: neutral
              detail: 每个证据点都点名了真实用例，但只有 Mine Rite 给出近似量化的产能结果。
            - label: 强
              tone: positive
              detail: 大多数案例来自 2026 年，并与当前获客垂直领域一致。
            - label: 中等
              tone: neutral
              detail: Nello 强调 FAT 阶段准备度，Cheetah 和 Mine Rite 看起来更偏生产导向。
            - label: 中弱
              tone: risk
              detail: 证据仍大多由 Path 撰写，独立运营数据有限。
        - label: 造船 / 防务
          values:
            - label: 中等
              tone: neutral
              detail: 战略合作伙伴描述了吞吐目标和真实用例，但公开的硬性能指标很少。
            - label: 强
              tone: positive
              detail: 主要案例都来自 2025 年末至 2026 年。
            - label: 中弱
              tone: risk
              detail: HII 明确把工作放在概念验证和试点阶段。
            - label: 强
              tone: positive
              detail: HII 和独立行业报道提供的第三方验证，强于多数仅由 Path 发布的案例页。
