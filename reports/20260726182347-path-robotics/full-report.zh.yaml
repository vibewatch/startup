      - number: '7.2'
        title: 监管、法律与安全栈
        blocks:
          - type: paragraph
            body: >-
              关于 Path，最重要的法律事实不是活跃诉讼，而是工业机器人和电弧焊安全周围的义务密度。OSHA
              明确表示没有机器人专项标准，这意味着合规存在于通用机器防护、lockout/tagout、PPE、焊接和共识标准控制组成的马赛克中。OSHA
              的机器人手册和焊接规则清楚说明，许多事故发生在设置、维护、编程等非常规状态——这些也正是 Path 自适应自主化承诺最有运营价值的状态。A3 和 ISO 标准更新进一步说明门槛正在提高：修订后的 R15.06
              标准更明确地写入功能安全，扩展协作应用语言，并加入网络安全相关内容。Path 的专利足迹和已登记担保权益提升了公司拥有有意义 IP
              的信心，但也显示这些资产重要到足以进入贷款人抵押包。法律结论因此是混合的：Path 看起来认真且受保护，但它也处在标准密集环境中，合规错误可能很快变成商业阻碍。
