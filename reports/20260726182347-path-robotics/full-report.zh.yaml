      - number: '2.2'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              类似 Path
              的自动化，买方地图比简单的“焊接部门”预算线复杂得多。用户通常是工厂层面的焊接团队、制造工程师或运营负责人，他们想提高吞吐并减少对难排班次的依赖。经济买方会变化：在汽车和较大型重工业账户中，可能是工厂管理层或自动化负责人；在公用事业、基础设施或国防相邻制造中，运营、资本规划和项目级制造领导层都会参与。支付方也随部署模型变化。Path
              的 RaaS 叙事，以及 Machine Design 对运营费用式采用的讨论，都暗示部分客户解决的不只是人工问题，也包括 CapEx
              问题。这会影响采用节奏。买方首先需要足够痛的劳动力或质量瓶颈，然后相信机器人套件能处理零件变化，最后还要有足够经济弹性去试点或铺开。因此，Path
              强调可变零件、实时自适应和无需自定义代码，不只是技术信息，也是在降低买方采用门槛。可触达账户并非所有焊接车间，而是焊接强度、零件变化和用工痛点足以支撑新自动化采购的子集。
