      - number: '8.3'
        title: 市场上行空间与采纳摩擦
        blocks:
          - type: paragraph
            body: >-
              市场结构支持上行，但不支持盲目乐观。纳入的分析师 / 市场数据来源都显示工业机器人和机器人焊接确有增长，但它们对当前市场规模的分歧足够大，提醒投资人不要假装精确。Grand View 估算 2024
              年工业机器人约 $34 billion，到 2030 年超过 $60 billion；Fortune 认为 2026 年机器人焊接为 $9.0 billion；Business Research Insights
              估算 2026 年工业焊接机器人为 $11.49 billion。共同结论比精确数字更重要：自动化焊接处在一个巨大且增长中的制造自动化类别里，还受劳动力短缺推动。与此同时，两份机器人焊接报告都强调 Path
              必须跨过同一组摩擦——高前期成本、集成复杂、维护负担、熟练机器人焊接人才稀缺。这些不是抽象保留意见；它们直接影响 Path 把订单预订额转成收入的速度，也影响部署和支持之后还能留下多少利润率。因此估值必须把
              TAM 扩张，与困难物理环境里规模化的真实成本一起权衡。
