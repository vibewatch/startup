  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              Path 面对的不是一个单一巨头。公开竞争格局至少分为四类。第一类是直接的自适应焊接同业，其中 Novarc 重叠最清晰，因为它现在营销机器视觉、AI 驱动的焊缝调整，以及面向现有机器人队列的改造智能。第二类是
              Vectis、Hirebotics 等协作机器人打包商，它们用预集成系统、App 式编程和公开标价降低采用难度。第三类是 Lincoln Electric 和 Miller 等焊接 OEM
              与集成商堆栈，它们把自动化作为成熟焊接品牌、培训和支持的延伸来销售。第四类是 Universal Robots、KUKA、Yaskawa
              等机器人平台玩家，即使它们自己不拥有完整自主化叙事，也能支撑大量伙伴解决方案。这一点重要，因为买方可以在多个自主化层级解决同一个劳动力和吞吐问题。因此，Path 不只与 AI
              同业竞争，也要对抗更容易、更便宜、更熟悉、且足以自动化部分工作的方案。
