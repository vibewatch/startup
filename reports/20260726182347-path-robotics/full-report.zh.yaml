        title: 国防、造船与扩张路径
        blocks:
          - type: paragraph
            body: >-
              造船具有战略重要性，因为它同时抬高了账户规模和账户复杂度。Saronic 2026 年 2 月合作，以及 LAD Services 2025 年 12 月部署计划，显示 Path
              正进入那些面对难自动化焊缝变化和长期劳动力短缺的船厂。HII 又把故事推向更高端：2026 年 2 月 MOU 和 2026 年 4 月 HYPR 启动，使 Path 进入 HII 和 GrayMatter
              Robotics 参与的正式国防制造现代化项目。这是很强的战略验证，但细则同样重要：HII 自己的公告称 2026 年是概念验证演示，2027
              年是试点，这意味着最可见的国防关系仍处于资格验证曲线早期。扩张机会真实存在——尤其是成功船厂标杆案例外溢到其他大型结构行业之后——但今天的公开证据对战略入口和付费学习潜力的支撑强于对规模化经常性国防收入的证明。这一区分很重要，因为这些账户即使在成为大型经常性收入线之前，也可能先成为优秀标杆案例。
