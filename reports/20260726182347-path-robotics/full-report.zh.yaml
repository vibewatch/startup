      - number: '1.3'
        title: 融资形成与里程碑路径
        blocks:
          - type: paragraph
            body: >-
              当前公开记录中证据最扎实的融资事件是 2024 年 10 月 Series D。Taiwania Capital 和 The Robot Report 都描述了一轮 $100M 融资，由 Matter
              Venture Partners 和 Drive Capital 领投，Yamaha Ventures、Taiwania Capital、MediaTek、Catapult
              Ventures、Gaingels、Addition、Tiger Global 和 Basis Set 参投。同一批公告称，公司此前已从 Drive Capital、Addition、Tiger
              Global、Basis Set、Lemnos 和 Silicon Valley Bank 等投资方融资 $170M。The Robot Report 2021 年 5 月文章又单独确认 Addition 领投的
              $56M Series B，并称 Path 当时累计融资 $71M。此后官方页面补充了两个重要里程碑：Path 称 2025 年订单额突破 $100M，并在 2025 年 9 月推出 Obsidian，之后于
              2026 年 4 月发布移动系统 Rove。合起来看，这些节点显示公司正从风险资本支持的概念验证走向规模化商业化。弱点是估值透明度。第三方二级市场数据暗示的当前隐含估值远低于独角兽叙事可能给人的印象，因此
              2024 轮的确切投后结果仍需要直接尽调。
