      - FM004
  - id: sizing-lenses-and-practical-sam
    title: Sizing lenses and the practical SAM
    body: >-
      The safest market-sizing conclusion is that Path sits inside a real,
      growing multi-billion-dollar category, but public evidence does not let us
      jump straight from broad TAM to company-specific SAM. The broadest lens is
      the total welding market at roughly $393 billion in 2026; that is useful
      only as context because most of that spend is not realistically available
      to an autonomous welding platform. Narrower automation lenses matter more.
      Future Market Insights places robotics welding at $11.72 billion in 2026,
      Business Research Insights places industrial welding robots at
      $11.49 billion, and Intel Market Research places robotic welding systems
      at $8.06 billion. The spread is not noise; it reflects different
      definitions. Some publishers include wider robot categories, some focus on
      specific systems, and some count applications or payload classes
      differently. That means the right diligence move is to treat roughly
      $8 billion to $12 billion as the public top-down band for today’s robotic
      welding market, then cut further based on Path’s actual fit: high-mix,
      large-part, hard-to-program, labor-constrained manufacturing. The more
      Path succeeds in moving from fixed cells into utilities, shipbuilding,
      heavy equipment, and prefabricated infrastructure, the more believable a
      larger practical SAM becomes. But until customer-count, pricing, and
      deployment-cohort data are public, the practical SAM remains more
      evidence-constrained than headline TAM slides would suggest.
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM005
      - CM006
      - CM022
      - CM023
      - CM024
      - CM025
      - CM027
      - CM038
      - CM040
