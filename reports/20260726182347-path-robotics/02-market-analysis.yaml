company:
  name: Path Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Path Robotics operates inside a broad welding economy but competes most
    directly in the narrower robotic-welding and high-mix automation segments.
    Public market studies put 2026 robotic welding between roughly $8 billion
    and $12 billion depending on whether the boundary is systems, industrial
    robots, or the wider robotics-welding category, while the overall welding
    economy is vastly larger at roughly $393 billion. The core adoption logic is
    straightforward: labor scarcity, quality pressure, and reshoring create real
    demand, but capital intensity, programming complexity, and custom-part
    variability still slow penetration and keep Path's practical SAM much
    smaller than headline welding TAM figures imply.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary, included spend, and substitutes
    body: >-
      The right market boundary for Path Robotics is not the entire welding
      economy. Public market studies show why. Business Research Insights puts
      the global welding market near $393 billion in 2026, but that category
      includes consumables, equipment, and a wide range of manual, semi-
      automated, and highly automated workflows. Path does not address all of
      that spend. Its nearer category is robotic welding automation: systems
      that combine robotics, sensing, software, and process control to automate
      variable welds. Future Market Insights places robotics welding at
      $11.72 billion in 2026, Intel Market Research places robotic welding
      systems at $8.06 billion, and Business Research Insights places industrial
      welding robots at $11.49 billion. Those narrower lenses are much more
      useful for diligence because they better match Path’s product scope,
      especially in heavy fabrication, utilities, shipbuilding, and other
      high-mix environments. The main substitutes are manual welding, extra
      shifts, contract fabrication, and traditional fixed robotic cells that
      still require rigid fixturing and heavy programming. Put differently,
      Path is not only competing for “welding budget”; it is competing for a
      buyer’s decision to automate difficult welds at all rather than continue
      living with labor scarcity, low throughput, or inflexible legacy
      automation.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM018
      - CM021
      - CM033
      - CM037
      - CM038
