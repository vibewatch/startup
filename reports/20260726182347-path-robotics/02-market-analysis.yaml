callouts:
  - calloutType: insight
    title: Broad TAM is real but mostly irrelevant to near-term underwriting
    body: The overall welding market is enormous, but Path's nearer market is the much smaller robotic-welding category where variable-part automation and buyer readiness actually matter.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM038]
  - calloutType: strength
    title: Labor scarcity and quality pressure create a genuine market wedge
    body: BLS, AWS, and Path's own materials all support a durable shortage-and-productivity story that makes welding automation a real budget priority rather than a speculative future category.
    claimRefs: [CM007, CM009, CM012, CM013, CM015, CM016, CM017]
  - calloutType: risk
    title: Adoption friction remains substantial in high-mix manufacturing
    body: Programming scarcity, capex burden, and low-volume complexity mean many potential buyers will remain difficult to convert even if the strategic case for automation is sound.
    claimRefs: [CM021, CM026, CM034, CM040]
