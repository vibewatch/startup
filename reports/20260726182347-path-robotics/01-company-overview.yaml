      - FO002
  - id: capital-formation-and-milestone-path
    title: Capital formation and milestone path
    body: >-
      The best-supported financing event in the current public record is the
      October 2024 Series D. Taiwania Capital and The Robot Report both
      describe a $100 million round led by Matter Venture Partners and Drive
      Capital with participation from Yamaha Ventures, Taiwania Capital,
      MediaTek, Catapult Ventures, Gaingels, Addition, Tiger Global, and Basis
      Set. Those same releases say the company had previously raised
      $170 million from investors including Drive Capital, Addition, Tiger
      Global, Basis Set, Lemnos, and Silicon Valley Bank. A May 2021 Robot
      Report article separately confirms a $56 million Series B led by Addition
      and states that Path had raised $71 million at that point. Official pages
      since then add two more important milestones: Path says it surpassed
      $100 million in bookings during 2025 and launched Obsidian in September
      2025 before unveiling the Rove mobile system in April 2026. Together
      these milestones show a business moving from venture-backed proof of
      concept toward scale commercialization. The weak point is valuation
      transparency. Third-party secondary-market data suggest a much lower
      current implied valuation than a headline unicorn narrative would imply,
      so the exact post-money outcome of the 2024 round still needs direct
      diligence.
    claimRefs:
      - CO003
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO031
      - CO040
