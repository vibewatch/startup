company:
  name: Path Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Path Robotics is a Columbus-based autonomous welding company that now
    describes itself as a physical-AI manufacturer with 200+ employees,
    $300M+ raised, and a product stack spanning fixed welding cells and the
    mobile Rove platform. Official and independent sources confirm a
    $100 million October 2024 Series D, 2025 bookings above $100 million,
    and an expansion into shipbuilding, but public evidence on exact
    post-money valuation, audited revenue, and governance detail remains
    incomplete and occasionally contradictory.
sections:
  - id: identity-footprint-and-product-scope
    title: Identity, footprint, and product scope
    body: >-
      Path Robotics now presents itself as a physical-AI manufacturer focused
      on autonomous welding rather than as a generic robotics startup. The
      company newsroom lists founding year 2018, headquarters in Columbus,
      funding raised above $300 million, and headcount above 200. The about
      page and newsroom identify brothers Andy and Alex Lonsberry as
      co-founders, with Andy as chief executive and Alex as chief technical
      officer, and describe the company’s origin story as work that began in a
      basement shop tied to Case Western Reserve University before the business
      scaled in Columbus. Product positioning is equally consistent across
      official pages and trade coverage. Path says Obsidian is its foundational
      model for manufacturing, powering intelligent welding cells and, from
      April 2026, the mobile Rove system. The core public message is that Path
      sells adaptive automation for variable, real-world welds: systems that
      see, model, and adjust rather than relying on rigid programming and
      perfect fixturing. That framing matters because it explains both why
      investors funded the company so aggressively and why later chapters have
      to test whether the business is a software-led robotics platform or still
      largely a labor-saving welding integrator.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
