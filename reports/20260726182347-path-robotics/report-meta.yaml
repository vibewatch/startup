companyProfile:
  summary: Path Robotics is a private industrial-automation company building AI-powered autonomous welding systems for manufacturers. The company sells intelligent welding cells, related support and automation services, and newer mobile welding offerings, with public proof across heavy fabrication and early shipbuilding programs. Path has raised a large late-stage venture base and claims more than $100 million in 2025 bookings, but its revenue quality, margin profile, customer durability, and current valuation remain largely undisclosed.
