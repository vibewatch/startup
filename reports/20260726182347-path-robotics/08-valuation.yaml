  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current valuation and cap table
    missingEvidence: Current post-money valuation, liquidation preferences, lender covenants, pro rata structure, and any insider or secondary pricing since the 2024 Series D.
    whyItMatters: A strong company can still be a weak investment if the current price or structure already embeds most of the upside.
    diligencePath: Request the latest cap table, term sheet summary, board materials on financing, and any internal or secondary marks.
    relatedQuestionRefs:
    - QV002
    - QV004
    - QV024
    - QV029
    relatedTableRefs:
    - TV001
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue quality and unit economics
    missingEvidence: Current revenue, backlog conversion, gross margin, contribution margin by deployment, support burden, and renewal / repeat-cell data.
    whyItMatters: Without economics, the investor cannot tell whether Path deserves a premium software-like valuation, a systems-integrator multiple, or something in between.
    diligencePath: Request cohort-level revenue and margin tables, SLA history, install cost, and renewal / expansion data by customer segment.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV013
    - QV029
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: important
    topic: shipyard and mobile commercialization
    missingEvidence: Paid scope, conversion milestones, and scaled economics for HII, Saronic, Rove, and other shipyard/mobile use cases.
    whyItMatters: A meaningful share of the upside case depends on these programs becoming repeatable and profitable, not just strategically impressive.
    diligencePath: Request milestone tracker, customer references, pilot budgets, and expected deployment footprint for each lighthouse program.
    relatedQuestionRefs:
    - QV019
    - QV020
    - QV025
    - QV032
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: missing-source
    severity: important
    topic: benchmark-style competitive proof
    missingEvidence: Win/loss data, defect-rate or throughput benchmarks versus incumbent solutions, and evidence that customers are buying repeatably despite cheaper alternatives.
    whyItMatters: A late-stage premium is only defensible if Path’s autonomy advantage is measurable and durable, not simply compelling in demos and case studies.
    diligencePath: Request benchmark studies, competitive bake-off outcomes, and account-level reasons won/lost against Lincoln, ESAB-adjacent alternatives, and other automation vendors.
    relatedQuestionRefs:
    - QV007
    - QV022
    - QV031
    relatedTableRefs:
    - TV002
    - TV006
