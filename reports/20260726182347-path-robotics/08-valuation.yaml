- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue and bookings conversion
    - Quarterly revenue, backlog-to-revenue conversion, and customer-level concentration
    - Bookings only matter if they convert into durable, recognized economics
    - Finance diligence with management and lead investor
  - - Gross margin and support economics
    - Installation cost, maintenance burden, field-support staffing, and per-cell contribution margin
    - Path may be a premium automation company or a service-heavy integrator; the difference changes valuation dramatically
    - Finance and operations diligence
  - - Cap table and round structure
    - Current post-money valuation, preferences, pro rata, lender covenants, and any special vehicles
    - A strong company can still be a poor investment if the price or structure is unfavorable
    - Legal and investor-rights diligence
  - - Customer durability
    - Renewal rate, repeat-cell expansion, churn, and contract duration by cohort
    - Customer proof exists, but durability remains largely private
    - Commercial and customer-reference diligence
  - - Shipyard conversion path
    - Paid scope, milestones, and success criteria for HII, Saronic, and related programs
    - A large share of upside rests on these lighthouse accounts scaling beyond pilot status
    - Program-management and customer-reference diligence
  - - Moat verification
    - Win/loss data, benchmark comparisons, and evidence that incumbents are not matching Path in high-mix autonomy
    - Premium valuation requires more than a compelling product story
    - Technical and commercial diligence
  notes: This is the minimum package required to move from valuation framing to actual underwriting.
