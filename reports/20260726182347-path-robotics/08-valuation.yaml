- id: market-upside-versus-friction
  title: Market upside versus adoption friction
  body: 'Market structure supports upside, but not blind optimism. The retained analyst-market-data sources all show real growth in industrial robotics and robotic welding, yet they disagree enough on current market size to warn against false precision. Grand View places industrial robotics at roughly $34 billion in 2024 growing to more than $60 billion by 2030, Fortune puts robotic welding at $9.0 billion in 2026, and Business Research Insights places industrial welding robots at $11.49 billion in 2026. The shared message is more important than the exact number: automated welding sits inside a large, growing manufacturing automation category with labor-shortage tailwinds. At the same time, both robotic-welding reports emphasize the same frictions Path must overcome—high upfront cost, integration complexity, maintenance burden, and scarcity of skilled robotic-welding talent. These are not abstract caveats; they directly affect how fast Path can convert bookings into revenue and how much
    margin it can keep after deployment and support. The valuation case therefore has to balance TAM expansion against the real cost of scaling in difficult physical environments.'
