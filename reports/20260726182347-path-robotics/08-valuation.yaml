- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Selected public welding and industrial references plus Path’s own late-stage financing context; not exhaustive and not sufficient for exact private valuation without Path revenue disclosure.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Path Robotics Series D (2024)
    - Private financing event
    - $100M late-stage round led by Matter Venture Partners and Drive Capital
    - Best direct signal that strong investors support the company and category
    - Public sources do not disclose the post-money valuation or preferences
  - - Lincoln Electric
    - Public market cap and revenue
    - $13.77B market cap on $4.35B TTM revenue (~3.2x market-cap-to-revenue)
    - Closest large public welding-adjacent comp with direct robotic-welding exposure
    - Mature, profitable incumbent with far more disclosure and a broader installed base
  - - ESAB
    - Public market cap and revenue
    - $5.24B market cap on $2.91B TTM revenue (~1.8x market-cap-to-revenue)
    - Useful welding-equipment and consumables comp with public transparency
    - Still much more mature than Path and not a pure autonomous-robotics company
  - - Illinois Tool Works
    - Public market cap and revenue
    - $81.42B market cap on $16.22B TTM revenue (~5.0x market-cap-to-revenue)
    - Upper-bound industrial-automation proxy showing what diversified quality can earn
    - Conglomerate mix makes it a loose ceiling, not a clean Path comp
  - - Robotic welding market references
    - End-market growth signals
    - $9.0B to $11.49B 2026 market estimates with strong growth forecasts
    - Helps frame long-term TAM and why investors may pay for category leadership
    - Market-report disagreement is too wide to justify precision on Path’s value
  notes: Comparable rows are ordered from direct financing context to public-company anchors and then market references.
