- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Bookings convert into visible revenue, shipyard programs expand, mobile welding extends TAM, and Path keeps a real high-mix autonomy lead.
    - A premium private multiple above mature public welding comps becomes more defensible if Path shows sustained growth plus better-than-systems-integrator margins.
    - Incumbent catch-up, safety incidents, or support cost creep still threaten upside.
    - Possible, but requires multiple facts the public file does not yet prove.
  - - Base
    - Path remains a strong niche leader with real demand, but disclosure on revenue quality and margins stays limited for now.
    - Current late-stage pricing should be treated as full; acceptable entry requires information rights, structure, or a discount to implied premium expectations.
    - Opacity, slower conversion, and capital intensity keep the call from becoming a buy.
    - Most consistent with the retained public record.
  - - Bear
    - Pilot conversion stalls, support burden rises, competition narrows differentiation, or financing terms worsen.
    - A down-round or multiple compression outcome becomes plausible because outside investors still lack economic proof.
    - Narrative strength masks weaker operating leverage or slower commercialization than expected.
    - Cannot be dismissed given limited public economics.
  notes: These scenarios are qualitative because the public file lacks the revenue and cap-table inputs required for precise return math.
