- id: scenario-framework-and-diligence-gates
  title: Scenario framework and diligence gates
  body: 'The scenario framework is intentionally qualitative because the public record does not support false numerical precision on Path’s current valuation or revenue base. In the bull case, Path converts its bookings momentum and lighthouse customers into repeatable, disclosed revenue growth while Rove and shipbuilding widen the moat before incumbents catch up. In the base case, Path remains a strong niche leader with genuine customer demand, but the company still needs more time and disclosure before outside investors can underwrite a premium late-stage price with confidence. In the bear case, support burden, integration friction, pilot slippage, or multiple compression force a weaker financing outcome despite good technology. That leads to a straightforward final diligence agenda: confirm current revenue quality, renewal durability, cap-table and preference structure, support-unit economics, and the conversion path from HII/Saronic-style pilots into scaled production programs. Until
    that package exists, the thesis is investable in theory but not fully underwritable in price-sensitive practice.'
