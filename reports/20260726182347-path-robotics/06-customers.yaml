- id: named-customer-proof-and-outcomes
  title: Named customer proof and outcomes
  body: 'The best customer evidence is not a single blockbuster logo but a repeated pattern of named deployments tied to concrete production pain. TYCROP is the cleanest published proof: TYCROP, ALM, and Quality Digest all describe a live implementation and quote TYCROP’s VP of Operations & Engineering on throughput and efficiency gains, while Path’s own case-study page adds a 24-hour scalability claim. Mine Rite offers a different flavor of proof, framing Path as the equivalent of adding a second shift without expanding labor. Nello, AMSi, and the generator-tank example show Path winning very large, variable fabrications where fit-up and geometry variation break conventional automation. Cheetah emphasizes that capacity can increase without adding programming burden or cutting jobs, while Millerbernd shows relevance in infrastructure pole fabrication. Taken together, the public set supports real adoption in production-oriented heavy manufacturing, but outcome reporting is still mostly anecdotal
    or qualitative rather than numerically standardized.'
  claimRefs:
