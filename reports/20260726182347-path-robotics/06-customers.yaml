chapter:
  number: 6
  title: Customers
  summary: Path Robotics now has enough named manufacturing references to prove real adoption across heavy fabrication, but the public record still says far more about why customers buy than about how long they stay or how widely deployments expand. Energy, mining, infrastructure, electrical-equipment, and shipbuilding accounts all reinforce the same thesis—Path wins where weld variability and labor scarcity are acute—while retention, concentration, and multi-cell expansion remain the major diligence gaps.
sections:
- id: customer-segments-and-buying-centers
  title: Customer segments and buying centers
  body: 'Path Robotics’ public customer proof set is now broad enough to show a clear segment pattern even though the company still withholds customer-count denominators and contract economics. The strongest visible clusters are heavy fabricated products where weld variation, part size, and labor scarcity make traditional programming unattractive: energy and power equipment at TYCROP and AMSi, mining structures at Mine Rite, utility and telecom infrastructure at Nello, transportation and infrastructure poles at Millerbernd, custom chassis at Cheetah, and shipbuilding at LAD Services, Saronic, and HII. In nearly every case, the public spokesperson is an operations, engineering, or manufacturing leader rather than procurement alone, which implies the buyer journey is led by plant operators solving throughput constraints, with welding teams as daily users and executive sponsors paying for capacity expansion. Geography also matters: the proof set is overwhelmingly North American, which supports
    regional manufacturing fit but leaves international go-to-market breadth largely unproven.'
