- id: defense-shipbuilding-and-expansion-paths
  title: Defense, shipbuilding, and expansion paths
  body: 'Shipbuilding is strategically important because it raises both account size and account complexity. Saronic’s February 2026 collaboration and LAD Services’ December 2025 deployment plan show Path entering yards that face hard-to-automate weld variability and chronic labor shortages. HII then takes the story upmarket: the February 2026 MOU and April 2026 HYPR launch place Path inside a formal defense-manufacturing modernization program alongside HII and GrayMatter Robotics. That is strong strategic validation, but the fine print is just as important: HII’s own release says 2026 is for proof-of-concept demonstrations and 2027 is for a pilot, which means the most visible defense relationships are still early in the qualification curve. The expansion opportunity is real—especially if successful shipyard references spill into other large-structure industries—but public evidence today supports strategic access and paid-learning potential more strongly than it proves scaled recurring defense
    revenue. That distinction matters because these accounts could still become excellent references even before they become large recurring revenue lines.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU032
  - CU039
  - CU040
  tableRefs:
  - TU004
- id: durability-retention-and-concentration-gaps
  title: Durability, retention, and concentration gaps
  body: 'The central customer diligence problem is durability visibility, not absence of logos. Path now has enough named references to prove relevance across multiple industrial niches, but it still does not publish net revenue retention, churn, contract length, installed-base size, renewal rates, or top-customer concentration. Several public references also stop at factory-acceptance-test or implementation-announcement stage rather than documenting a year or more of on-floor performance. Even TYCROP and Mine Rite, the most concrete proof points, do not disclose economics such as payback period, gross margin impact, or volume committed under contract. Built In’s 2026 growth summary captures the risk succinctly: momentum is visible, yet items like the HII MOU still need conversion into durable purchase orders. That does not negate Path’s customer traction; it simply means the customer chapter should grade adoption proof as credible, expansion potential as plausible, and long-duration revenue
    durability as still under-documented in public materials.'
