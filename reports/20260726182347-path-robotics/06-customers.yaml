figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Path most often appears to land when a plant faces labor scarcity, high weld variability, and throughput pressure, then expands through proof of uptime and second-cell economics.
  claimRefs:
  - CU002
  - CU004
  - CU027
  - CU028
  - CU036
  - CU041
  data:
    items:
    - label: Labor and throughput trigger
      detail: Manufacturers first encounter Path when skilled-welder scarcity, delayed schedules, or fit-up variability make manual welding a bottleneck.
      tone: neutral
    - label: Focused use-case qualification
      detail: The deal is usually anchored to a narrow high-pain workload such as poles, tanks, mining structures, trailers, or ship assemblies.
      tone: positive
    - label: FAT and deployment handoff
      detail: Public proof frequently highlights a factory acceptance test or initial implementation milestone before the cell begins routine production.
      tone: neutral
    - label: Capacity and quality proof
      detail: Reference customers then talk about more throughput, better schedule adherence, or the practical equivalent of adding labor capacity.
      tone: positive
    - label: Expansion decision
      detail: The final step depends on whether the customer adds more cells, renews a RaaS contract, or broadens into adjacent weld families—evidence Path rarely discloses publicly.
      tone: neutral
