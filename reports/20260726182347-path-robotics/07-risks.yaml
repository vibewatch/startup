- id: regulatory-legal-and-safety-stack
  title: Regulatory, legal, and safety stack
  body: 'The most important legal fact about Path is not an active lawsuit but the density of obligations around industrial robot and arc-welding safety. OSHA explicitly says there is no robotics-specific standard, which means compliance lives in a mosaic of general machine guarding, lockout/tagout, PPE, welding, and consensus-standard controls. OSHA’s robot manual and welding rules make clear that many incidents happen during non-routine states like setup, maintenance, and programming—the same states where Path’s promise of adaptive autonomy is most operationally valuable. The A3 and ISO standard updates reinforce that the bar is rising: the revised R15.06 standard makes functional safety more explicit, expands collaborative-application language, and adds cybersecurity-related content. Path’s patent footprint and recorded security interests improve confidence that the company owns meaningful IP, but they also show those assets matter enough to sit inside lender collateral packages. The
    legal verdict is therefore mixed: Path appears serious and protected, but it also operates in a standards-heavy environment where compliance mistakes can become commercial blockers quickly.'
