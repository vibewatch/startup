- id: financial-people-and-kill-criteria
  title: Financial, people, and kill criteria
  body: Financial and people risk remain tightly linked because Path’s business model is hardware- and service-intensive while public disclosure remains unusually thin. The company can point to bookings, product launches, and lighthouse partnerships, but outside observers still cannot cleanly see revenue quality, burn, runway, customer concentration, renewal patterns, or service gross margins. At the same time, the labor backdrop that helps sell Path’s product also constrains Path’s own execution. AWS workforce data continues to show a structural shortage of welders, and Path is simultaneously hiring scarce robotics and perception talent to build and support increasingly complex systems. Mixed headcount signals on Built In reinforce that this is not a fully de-risked scaling story yet. The right underwriting posture is therefore milestone-based. The thesis stays alive if Path converts pilots into repeat deployments, shows safety and uptime discipline, and maintains financing flexibility.
    It breaks if mobile and defense expansion produce more complexity than repeatable unit economics, or if the installed-base support burden rises faster than durable revenue.
