company:
  name: Path Robotics
chapter:
  number: 7
  title: Risks
  summary: Path Robotics’ biggest risks come from trying to scale safety-critical, service-heavy autonomous welding into shipyards and heavy-manufacturing plants before public financial and fleet-performance evidence catches up. The company has meaningful mitigants—real patents, real customers, and a defense-prime partner—but the residual risk remains high around compliance execution, support economics, component dependency, and incumbent response.
sections:
- id: risk-overview
  title: Severity-ranked risk overview
  body: 'Path Robotics’ risk profile is led by a familiar startup problem in an unfamiliar industrial context: it must prove that a technically credible autonomy story can survive real-world safety, service, and capital burdens at scale. The company has real mitigants—named customers, a defense-prime relationship, granted patents, and fresh capital—but those same facts expose the shape of the downside. Path is not selling lightweight software; it is deploying robotic welding systems into regulated, injury-sensitive environments where custom integration, uptime support, operator qualification, and hot-work safety all matter. That means a single miss can propagate through several layers at once: an accident, reliability problem, or delayed deployment can impair customer trust, margin, financing appetite, and valuation support simultaneously. The risk summary therefore weights safety/compliance execution, lighthouse-customer concentration, service-model intensity, and incumbent response above
    generic startup volatility.'
  claimRefs:
