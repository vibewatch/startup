  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fleet safety performance
    missingEvidence: Incident rates, near-miss data, OSHA-reportable events, and customer safety-validation records across the installed base.
    whyItMatters: In an injury-sensitive automation category, strong marketing and standards awareness do not substitute for hard evidence that deployed systems stay safe in production.
    diligencePath: Request fleet safety metrics, incident postmortems, customer acceptance criteria, and any regulator or insurer correspondence.
    relatedQuestionRefs:
    - QR008
    - QR029
    - QR030
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: service-model unit economics
    missingEvidence: Per-cell gross margin, install cost, maintenance burden, support staffing ratios, and uptime SLA attainment by cohort.
    whyItMatters: Path’s business model appears more support-intensive than a pure equipment or software model, so margin quality can deteriorate even while bookings rise.
    diligencePath: Request unit-economics waterfall, support-cost curves, SLA history, and renewal economics by customer segment.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR025
    - QR026
    relatedTableRefs:
    - TR003
    - TR004
    - TR006
  - type: private-evidence-only
    severity: important
    topic: legal freedom-to-operate and insurance posture
    missingEvidence: Counsel-cleared FTO analysis, litigation summary, product-liability insurance scope, and indemnity positions in customer contracts.
    whyItMatters: A visible patent portfolio and lender liens prove the IP matters, but they do not prove that Path faces no litigation or indemnity risk as deployments scale.
    diligencePath: Request outside-counsel memo, claims history, carrier coverage limits, and key contract indemnity language.
    relatedQuestionRefs:
    - QR005
    - QR007
    - QR027
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: important
    topic: supplier concentration and hardware redundancy
    missingEvidence: Bill-of-material concentration for critical sensors, actuation, compute, mobile-platform elements, and alternative qualified suppliers.
    whyItMatters: As Path expands into larger and mobile systems, component concentration can turn into schedule delays, field failures, or margin pressure before public customers ever know why.
    diligencePath: Request approved-vendor lists, alternate-source qualification status, long-lead component strategy, and component-failure escalation data.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR031
    relatedTableRefs:
    - TR004
