- id: capability-and-deployment-comparison
  title: Capability comparison and deployment model differences
  body: 'The sharpest competitive split is between autonomy depth and ease of adoption. Path and Novarc argue that real differentiation comes from sensing, adaptation, and weld intelligence in variable production conditions. That is the hardest part of the problem and likely where late-stage value accrues if the claims hold. But Vectis, Hirebotics, and the UR ecosystem attack a different bottleneck: they reduce programming fear, integration cost, and time to first weld. Hirebotics explicitly says its system is ready in hours with no integrators or coding, while Vectis publishes all-in pricing and pairs it with a return policy and financing options. Lincoln and Miller sit in between. They are not marketing full autonomy, but they make the buying decision legible for incumbent-biased shops by offering pre-engineered cells, certifications, training, and familiar welding workflows. In practice, many accounts will buy the simplest system that clears throughput and quality thresholds. That keeps
    competitive pressure on Path even where its technical ceiling is higher.'
