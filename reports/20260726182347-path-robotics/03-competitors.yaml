- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation or diligence ask
  rows:
  - - Path owns the autonomy premium
    - Novarc now markets machine-vision autonomy and retrofit intelligence
    - High
    - NovAI Capture Control Autonomy and Yaskawa partnership compress the narrative gap
    - Request win-loss evidence versus Novarc on similar part families
  - - Path can outflank easier cobots
    - Vectis and Hirebotics publish much lower public entry prices and simpler adoption motions
    - High
    - Published $95k to $105k entry bands plus no-code deployment marketing
    - Benchmark Path payback against cobot alternatives by use case not by brand halo
  - - Incumbents are too legacy-bound to matter
    - Lincoln and Miller translate incumbent trust into faster lower-risk automation buys
    - Medium
    - eCell Fab-Pak Pro-Pak and Copilot all target approachable adoption
    - Test whether Path loses deals where incumbent welding stack preference dominates
  - - Robot OEMs are just suppliers
    - UR KUKA and Yaskawa channel power lets partners ship capable alternatives quickly
    - Medium
    - 100000+ UR cobots and 600000+ Yaskawa robots expand the rival ecosystem
    - Map which partner-led systems show up most often in Path’s pipeline
  - - Mobility is uniquely defensible
    - Portable cobot carts solve some repositioning needs even without full Rove-like mobility
    - Medium
    - UR and Hirebotics cases emphasize moving automation to the job
    - Clarify where Rove meaningfully exceeds portable cell alternatives
  - - ROI superiority is obvious
    - Competitors already claim 2x to 10x productivity and fast payback
    - High
    - UR Hirebotics and Vectis publish material ROI language
    - Demand normalized customer economics by weld type cycle and labor substitution
  notes: This register focuses on whether Path’s autonomy and mobility claims remain commercially durable when easier or more incumbent-friendly substitutes can solve enough of the job.
