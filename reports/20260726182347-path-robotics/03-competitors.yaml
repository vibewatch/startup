- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Scale or proof point
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Path Robotics
    - 200+ employees and $300M+ raised per official site context
    - Heavy fabrication shipbuilding variable large-part welding
    - Adaptive AI autonomous welding and mobile Rove narrative
    - No public pricing and limited head-to-head quality disclosure
  - - Novarc / adaptive peer
    - Retrofit and autonomy stack plus Yaskawa partnership
    - Fabricators with installed robots seeking more intelligence
    - Machine vision adaptive control weld data and retrofit path
    - Public pricing not disclosed and direct installed-base scale is opaque
  - - Vectis / cobot packager
    - 800+ systems in the field per company claim
    - SMB and mid-market fabricators needing fast entry
    - Published turnkey pricing UR-based portability and low-risk packaging
    - Lower autonomy ceiling in public materials than Path or Novarc
  - - Hirebotics / app-led cobot packager
    - Public pricing plus Beacon software workflow
    - Shops valuing no-code deployment and quick setup
    - Ready-in-hours installation tablet programming and bundled support
    - Best suited to approachable entry automation rather than maximum autonomy
  - - Lincoln Electric / incumbent cell vendor
    - A3-certified sites training and fast-ship eCell Fab-Pak Pro-Pak range
    - Existing Lincoln-biased plants and first automation buyers
    - Brand trust pre-engineered cells certification and service network
    - Public autonomy claims are lighter and pricing is mostly private
  - - Miller / incumbent collaborative expansion
    - 2026 Copilot expansion for larger weldments and aluminum
    - Miller or FANUC-standardized shops
    - Welder-friendly interface plus incumbent welding-process credibility
    - Retained public evidence is launch-level not deep installed-base disclosure
  - - UR ecosystem / platform
    - 100000+ cobots deployed and broad marketplace
    - Partners and flexible high-mix adopters
    - Large ecosystem intuitive programming and many partner kits
    - UR is usually the enabling platform not the differentiated weld-intelligence layer
  - - KUKA and Yaskawa / industrial robot OEMs
    - KUKA welding software stack and Yaskawa 600000+ robots installed
    - Large industrial programs with robot-standard preferences
    - Global support process breadth and controller-level integration
    - Public surfaces emphasize platform breadth more than no-code autonomy
  notes: This table separates Path’s autonomy-led position from retrofit peers, cobot packagers, incumbent welding OEMs, and robot-platform suppliers that indirectly shape buyer choice.
