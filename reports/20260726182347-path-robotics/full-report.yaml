  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and core thesis
        blocks:
          - type: paragraph
            body: >-
              Path Robotics looks like a high-quality late-stage industrial automation company, but the public record
              still supports a monitoring posture more strongly than a buy call at an unknown late-stage price. The
              positive side is real: a $100 million Series D in 2024, $300 million-plus cumulative funding in current
              company materials, more than $100 million in 2025 bookings according to Path, visible customer proof in
              heavy fabrication, and strategic shipbuilding relationships with HII and Saronic. Those signals are
              stronger than what many private robotics companies disclose. The problem is that valuation underwriting
              depends on price and economics, not just company quality. Public materials still do not disclose revenue,
              gross margin, burn, runway, retention, or current post-money valuation. That means the recommendation must
              stay price-sensitive. The right investment stance is track / research more until Path’s revenue quality
              and current valuation are clearer, or until an entry structure compensates for the information gap.
            claimRefs:
