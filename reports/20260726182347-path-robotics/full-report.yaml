  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Path Robotics’ risk profile is led by a familiar startup problem in an unfamiliar industrial context: it
              must prove that a technically credible autonomy story can survive real-world safety, service, and capital
              burdens at scale. The company has real mitigants—named customers, a defense-prime relationship, granted
              patents, and fresh capital—but those same facts expose the shape of the downside. Path is not selling
              lightweight software; it is deploying robotic welding systems into regulated, injury-sensitive
              environments where custom integration, uptime support, operator qualification, and hot-work safety all
              matter. That means a single miss can propagate through several layers at once: an accident, reliability
              problem, or delayed deployment can impair customer trust, margin, financing appetite, and valuation
              support simultaneously. The risk summary therefore weights safety/compliance execution,
              lighthouse-customer concentration, service-model intensity, and incumbent response above generic startup
              volatility.
