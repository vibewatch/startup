          unit: /10
          note: Named deployments exist, but retention and repeat-order data remain thin
        - label: Economic visibility
          value: 3
          unit: /10
          note: Revenue, margin, and runway are not publicly clear enough for conviction
        - label: Risk profile
          value: 4
          unit: /10
          note: Safety, service intensity, pilot conversion, and competition keep risk elevated
        - label: Valuation visibility
          value: 2
          unit: /10
          note: Current private mark is not publicly disclosed with enough detail
        - label: Overall readiness for new capital at price
          value: 4
          unit: /10
          note: Attractive company, but not fully underwritable at an unknown late-stage price
    claimRefs:
