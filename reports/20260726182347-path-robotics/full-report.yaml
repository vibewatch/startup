      - number: '3.3'
        title: Distribution power, switching costs, and buyer behavior
        blocks:
          - type: paragraph
            body: >-
              Incumbents still own meaningful structural advantages. Lincoln and Miller can piggyback on installed
              welding-equipment relationships, training programs, certification comfort, and service expectations.
              Yaskawa and KUKA bring robot-platform breadth and process coverage, while Universal Robots contributes a
              large installed cobot ecosystem that partners can commercialize quickly. Those assets matter because
              welding-automation purchases are rarely greenfield technology bets; they are operating decisions inside
              plants that already have maintenance habits, safety rules, preferred robot brands, and familiar channels.
              Public case material also suggests buyers frequently multi-home. A shop might use a collaborative system
              for one bottleneck, an incumbent robotic cell for another, and keep manual welding where variability
              remains too high. That weakens any thesis that one vendor will monopolize the account quickly. Path can
              still win if its autonomy unlocks harder work, but it must overcome distribution inertia and prove that
              better adaptation justifies a more complex vendor switch.
