  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and the substitute set
        blocks:
          - type: paragraph
            body: >-
              Path is not competing against one monolithic rival. The public landscape breaks into at least four
              classes. First are direct adaptive-welding peers, where Novarc is the clearest overlap because it now
              markets machine vision, AI-driven weld adjustment, and retrofit intelligence for existing robot fleets.
              Second are cobot-packagers such as Vectis and Hirebotics that simplify adoption with pre-integrated
              systems, app-based programming, and visible list prices. Third are incumbent welding OEM and integrator
              stacks such as Lincoln Electric and Miller, which sell automation as an extension of established welding
              brands, training, and support. Fourth are robot-platform players such as Universal Robots, KUKA, and
              Yaskawa that can power many partner solutions even when they do not themselves own the full autonomy
              narrative. This matters because buyers can solve the same labor and throughput problem at multiple
              autonomy levels. Path therefore competes not only against AI peers, but also against easier cheaper and
              more familiar ways to automate enough of the job.
