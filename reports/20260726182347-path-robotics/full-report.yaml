      - number: '2.4'
        title: Growth drivers, adoption constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              The growth case is strong, but it is not frictionless. AWS, BLS, and Path’s own materials all point to the
              same structural pressure: welding remains essential to infrastructure, energy, transportation, aerospace,
              and defense manufacturing, while the labor pool is aging and openings remain high. Market reports add the
              technology side: more buyers are prioritizing automation for labor shortage, throughput, and precision,
              with collaborative robots, AI seam tracking, and predictive maintenance improving the case for adoption.
              Path’s Rove launch also suggests a market-opening thesis around immovable structures and production sites
              where fixed cells struggle. However, the same source base makes the constraint story obvious. Advanced
              robotic welding still carries capital and integration burden, many accounts lack programming expertise,
              and low-volume or highly custom work remains harder to automate than a marketing demo implies. BLS also
              notes that automation can limit overall welder employment growth even while replacement openings stay
              high. For Path, that means adoption timing will likely be strongest where the pain is severe and the ROI
              is immediate: high-mix heavy fabrication, shortage-driven accounts, and sectors where throughput failures
              are strategically expensive. The market is attractive, but it is a solve-the-bottleneck market, not an
              instant universal replacement market.
