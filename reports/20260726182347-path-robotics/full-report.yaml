  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product scope
        blocks:
          - type: paragraph
            body: >-
              Path Robotics now presents itself as a physical-AI manufacturer focused on autonomous welding rather than
              as a generic robotics startup. The company newsroom lists founding year 2018, headquarters in Columbus,
              funding raised above $300 million, and headcount above 200. The about page and newsroom identify brothers
              Andy and Alex Lonsberry as co-founders, with Andy as chief executive and Alex as chief technical officer,
              and describe the company’s origin story as work that began in a basement shop tied to Case Western Reserve
              University before the business scaled in Columbus. Product positioning is equally consistent across
              official pages and trade coverage. Path says Obsidian is its foundational model for manufacturing,
              powering intelligent welding cells and, from April 2026, the mobile Rove system. The core public message
              is that Path sells adaptive automation for variable, real-world welds: systems that see, model, and adjust
              rather than relying on rigid programming and perfect fixturing. That framing matters because it explains
              both why investors funded the company so aggressively and why later chapters have to test whether the
              business is a software-led robotics platform or still largely a labor-saving welding integrator.
