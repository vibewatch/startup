  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              Path’s public financial story is stronger on monetization logic than on reported accounting outcomes. The
              visible revenue surface has at least three layers. First is the core autonomous-cell business, where the
              homepage and product pages market productivity, cost reduction, and support but do not publish list
              pricing. Second is the RaaS narrative, where Path explicitly frames purchased robots as depreciating
              snapshots in time and positions its model as an alternative to up-front capex. Third is Path Foundry, a
              contract-manufacturing extension that looks economically different from simply shipping a welding cell: it
              promises production starting in as little as four weeks, bundles robotics with skilled personnel, and
              shifts buyers toward operating expense. Taken together, these sources imply a hybrid model with equipment,
              service, and production capacity all in the mix. That can be strategically attractive, but it also means
              investors should not expect a simple SaaS-style revenue profile or a clean single-line monetization story.
