  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No meaningful improvement in revenue transparency
        - Company still withholds revenue quality, gross margin, and renewal data at the next financing decision point
        - Prevents comp-based valuation discipline and keeps recommendation stuck at monitor-only
        - Do not lead or stretch on price without economics
      - - HII or Saronic programs fail to convert
        - Proof-of-concept or evaluation remains pilot-like without paid expansion
        - Undercuts the shipyard-growth and moat-expansion argument
        - Reduce upside assumptions tied to defense and mobile welding
      - - Support burden outgrows revenue per system
        - Installation, maintenance, or field-support costs rise faster than recurring economics
        - Compresses margin and increases capital intensity
        - Reframe Path as a lower-multiple systems-and-service business
      - - Incumbent catch-up in adaptive welding
        - Large OEMs win more high-mix jobs with comparable autonomy claims and better service reach
        - Weakens moat and premium-multiple logic
        - Tighten entry discipline and lower expected upside
      - - Financing terms deteriorate
        - New round occurs with heavy structure, lower internal marks, or clear preference overhang
        - Signals valuation stretch and weaker bargaining power
        - Model down-round risk and downside protection needs
      - - Safety or quality signal degrades
        - Material deployment issue, customer reference loss, or qualification setback surfaces publicly
        - Directly damages trust in a safety-critical automation category
        - Pause underwriting until root-cause and remediation are credible
    notes: >-
      A thesis break is operational as much as financial because Path’s valuation relies on trusted deployment in
      hazardous industrial settings.
    claimRefs:
      - CV006
      - CV007
      - CV021
      - CV027
      - CV033
      - CV035
      - CV039
      - CV040
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current revenue and bookings conversion
        - Quarterly revenue, backlog-to-revenue conversion, and customer-level concentration
        - Bookings only matter if they convert into durable, recognized economics
        - Finance diligence with management and lead investor
      - - Gross margin and support economics
        - Installation cost, maintenance burden, field-support staffing, and per-cell contribution margin
        - >-
          Path may be a premium automation company or a service-heavy integrator; the difference changes valuation
          dramatically
        - Finance and operations diligence
      - - Cap table and round structure
        - Current post-money valuation, preferences, pro rata, lender covenants, and any special vehicles
        - A strong company can still be a poor investment if the price or structure is unfavorable
        - Legal and investor-rights diligence
      - - Customer durability
        - Renewal rate, repeat-cell expansion, churn, and contract duration by cohort
        - Customer proof exists, but durability remains largely private
        - Commercial and customer-reference diligence
      - - Shipyard conversion path
        - Paid scope, milestones, and success criteria for HII, Saronic, and related programs
        - A large share of upside rests on these lighthouse accounts scaling beyond pilot status
        - Program-management and customer-reference diligence
      - - Moat verification
        - Win/loss data, benchmark comparisons, and evidence that incumbents are not matching Path in high-mix autonomy
        - Premium valuation requires more than a compelling product story
        - Technical and commercial diligence
    notes: This is the minimum package required to move from valuation framing to actual underwriting.
