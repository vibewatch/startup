      - number: '3.4'
        title: Moat durability and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The moat question is therefore mixed rather than settled. Path does appear differentiated on variable-part
              autonomy and now on mobility through Rove, which few retained rivals match in their public product
              surfaces. That supports a thesis that Path can own harder large-part and off-cell use cases. The
              counterargument is that many buyers do not need maximum autonomy. Published Vectis and Hirebotics prices
              anchor the market at a much lower public entry point, and UR case studies show meaningful outcomes in
              high-mix environments without buying a fully autonomous cell. Novarc further compresses Path’s narrative
              advantage by now using its own Physical AI language, retrofit story, and Yaskawa channel expansion. In
              other words, Path’s technical wedge may be real, but the commercial wedge can still narrow if easier or
              cheaper systems solve enough of the shortage and quality problem. Diligence should focus less on whether
              Path is impressive and more on whether it wins often enough against these practical alternatives.
