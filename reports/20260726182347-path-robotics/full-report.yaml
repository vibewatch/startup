      - number: '5.1'
        title: Core autonomy stack
        blocks:
          - type: paragraph
            body: >-
              Path’s core technical differentiation still centers on Obsidian and the broader Weld World Model. The
              official technical page is unusually concrete for a startup marketing surface: it describes a neural
              network trained on multimodal weld data, reinforcement learning inside a simulator-like environment,
              seam-by-seam real-time decision-making, and a sensor stack with cameras lasers point-cloud generation and
              reflection filtering. The intelligent-welding-cells page adds the commercial shorthand of “no programming”
              and “no fixturing,” while the homepage and newsroom frame the system as able to handle variable welds that
              traditional automation cannot. That combination matters. It suggests the company is not merely selling a
              prettier interface around conventional robotic welding, but is instead attempting to move seam
              identification planning parameter control and quality adaptation into a proprietary data-driven loop. The
              caveat is that nearly all of this proof remains company-authored. Public evidence supports the
              architecture story far more strongly than it supports independently benchmarked output quality.
