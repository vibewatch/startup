      - number: '8.2'
        title: Financing context and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The comparable set does not tell investors what Path is worth today, but it does define the range of
              public reality that any late-stage private price must eventually grow into. Using public market-cap and
              revenue references, Lincoln Electric screens around 3.2x market-cap-to-revenue, ESAB around 1.8x, and
              Illinois Tool Works around 5.0x. ITW is a noisy upper-bound proxy because it is a broad industrial
              conglomerate, not a welding pure-play, while Lincoln and ESAB are more relevant but also far more mature,
              profitable, and transparent than Path. Those differences matter. A private late-stage robotics company can
              deserve a premium to slower public incumbents if it is compounding rapidly and building a durable moat,
              but public investors still anchor value to disclosed revenue and earnings quality. Path’s public file
              simply does not supply that level of economics. The result is a clear valuation discipline point: public
              comp bands are useful reference rails, yet they cannot justify a specific private mark without much better
              disclosure from Path itself.
