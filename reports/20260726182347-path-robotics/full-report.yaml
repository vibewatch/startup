      - number: '2.2'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map for Path-like automation is more complex than a simple “welding department” budget line. The
              user is typically a plant-level welding team, manufacturing engineer, or operations leader trying to
              improve throughput and reduce dependence on hard-to-staff shifts. The economic buyer can vary: in
              automotive and larger heavy-industry accounts it may be plant management or automation leadership; in
              utilities, infrastructure, or defense-adjacent fabrication it can involve operations, capital planning,
              and program-level manufacturing leadership. The payer also shifts with deployment model. Path’s RaaS
              framing and Machine Design’s discussion of operating-expense style adoption suggest that some customers
              are solving a CapEx problem as much as a labor problem. That matters for adoption timing. Buyers first
              need a sufficiently painful labor or quality bottleneck, then confidence that a robotics package can
              handle their part variability, then enough economic flexibility to pilot or roll out. Path’s emphasis on
              variable parts, real-time adaptation, and avoiding custom code is therefore as much a buyer-enablement
              message as a technology one. The addressable accounts are not all welding shops; they are the subset with
              enough weld intensity, part variability, and labor pain to justify a new automation motion.
            claimRefs:
