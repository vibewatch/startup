  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk is highest where safety-critical deployment, service intensity, and early-stage lighthouse customers
      intersect.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Safety / compliance execution
          values:
            - label: medium-high
              tone: warning
              detail: OSHA and welding requirements apply today even though there is no single robotics-only OSHA rule.
            - label: critical
              tone: negative
              detail: A serious incident can hit workers, customers, regulators, and financing confidence at once.
            - label: medium
              tone: warning
              detail: Path appears safety-aware, but public deployment-specific evidence is still thin.
            - label: high
              tone: negative
              detail: Residual severity remains high until fleet-scale safety performance is visible.
        - label: Service-model margin pressure
          values:
            - label: high
              tone: negative
              detail: Custom installs, support, and maintenance are inherent to the offering.
            - label: high
              tone: negative
              detail: If support scales poorly, margin and cash needs deteriorate together.
            - label: medium
              tone: warning
              detail: Remote diagnostics and PM help, but no public unit-economics detail exists.
            - label: high
              tone: negative
              detail: The model remains exposed until repeatable per-cell economics are shared.
        - label: Shipyard / defense conversion
          values:
            - label: medium-high
              tone: warning
              detail: The public record is still proof-of-concept, evaluation, and pilot-heavy.
            - label: high
              tone: negative
              detail: These programs drive narrative credibility and potentially large account value.
            - label: low-medium
              tone: warning
              detail: Strategic partnerships exist, but commercial maturity is early.
            - label: high
              tone: negative
              detail: Residual severity stays elevated until production conversion is proven.
        - label: Incumbent competition
          values:
            - label: high
              tone: warning
              detail: Large welding OEMs already offer broad robotic process portfolios and service depth.
            - label: high
              tone: warning
              detail: Competitive catch-up could pressure win rates before Path reaches scale.
            - label: medium
              tone: neutral
              detail: Path still appears differentiated in high-mix autonomy today.
            - label: medium-high
              tone: warning
              detail: Residual severity depends on how long Path can preserve its wedge.
        - label: Talent and hiring depth
          values:
            - label: high
              tone: warning
              detail: Welding and robotics labor markets are both structurally tight.
            - label: medium-high
              tone: warning
              detail: Hiring gaps can slow roadmap, installations, and customer support simultaneously.
            - label: low-medium
              tone: warning
              detail: Jobs are posted, but headcount signals remain mixed.
            - label: medium-high
              tone: warning
              detail: Residual exposure remains meaningful until retention and staffing depth are visible.
    claimRefs:
      - CR004
      - CR013
      - CR017
      - CR020
      - CR024
      - CR029
      - CR032
      - CR039
      - CR044
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Path’s main risks transmit through a few shared channels: safety execution, support cost, pilot conversion,
      financing flexibility, and competitive moat.
    data:
      nodes:
        - id: n1
          label: Safety / compliance execution
          description: Cell safeguarding, operator qualification, welding-rule adherence, and incident prevention.
        - id: n2
          label: Customer trust
          description: Confidence that Path can run safely and reliably in production.
        - id: n3
          label: Service burden
          description: Installation, maintenance, diagnostics, and support intensity per deployment.
        - id: n4
          label: Gross margin / cash use
          description: How much support and hardware intensity erodes economics.
        - id: n5
          label: Pilot conversion
          description: Whether HII, Saronic, and similar programs expand into recurring business.
        - id: n6
          label: Financing flexibility
          description: Ability to raise or preserve capital on acceptable terms.
        - id: n7
          label: Valuation support
          description: Whether investors can keep underwriting Path as a differentiated growth company.
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n6
        - from: n3
          to: n4
        - from: n2
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n3
          to: n2
        - from: n4
          to: n7
    claimRefs:
      - CR001
      - CR013
      - CR017
      - CR020
      - CR035
      - CR037
      - CR039
      - CR041
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Path’s delivery stack depends on standards bodies, support operations, lighthouse shipyard programs, robotics
      components, and incumbent market structure at the same time.
    data:
      nodes:
        - id: d1
          label: OSHA / consensus standards
          description: Robot, welding, and mobile-system safety expectations that shape deployments.
        - id: d2
          label: Path engineering and support
          description: The internal team that must build, install, and sustain the systems.
        - id: d3
          label: Component ecosystem
          description: Sensors, motion hardware, compute, and mobile platforms sourced externally or integrated together.
        - id: d4
          label: HII / Saronic / LAD
          description: High-visibility shipyard and defense-adjacent reference accounts.
        - id: d5
          label: Incumbent welding OEMs
          description: Lincoln Electric and other large providers with wider process coverage.
        - id: d6
          label: Path commercial outcome
          description: Revenue quality, renewal confidence, and valuation support.
      edges:
        - from: d1
          to: d2
        - from: d2
          to: d6
        - from: d3
          to: d2
        - from: d4
          to: d6
        - from: d5
          to: d6
        - from: d1
          to: d6
        - from: d3
          to: d6
    claimRefs:
      - CR006
      - CR013
      - CR020
      - CR021
      - CR025
      - CR026
      - CR043
      - CR044
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation depends on whether strong category and product signals outweigh the still-large gap in revenue
      and price visibility.
    data:
      nodes:
        - label: Large robotic-welding tailwind
          detail: Analyst reports all show a meaningful and growing automation market with labor-shortage support.
          tone: positive
        - label: Real strategic proof
          detail: Path has a $100M Series D, customer references, patents, and shipyard relationships.
          tone: positive
        - label: Economic visibility gap
          detail: Revenue, gross margin, retention, burn, runway, and post-money valuation are still not public.
          tone: negative
        - label: Public-comp reality
          detail: Relevant public comps trade on disclosed revenue and earnings quality, not on narrative alone.
          tone: neutral
        - label: Valuation stance
          detail: Price-sensitive and evidence-sensitive rather than outright bullish at an unknown late-stage mark.
          tone: warning
        - label: Recommendation
          detail: Track / research more until economics or entry price improve.
          tone: warning
    claimRefs:
      - CV001
      - CV003
      - CV015
      - CV020
      - CV021
      - CV022
      - CV035
      - CV037
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Observed public-comp market-cap-to-revenue references illustrate the band private investors should use as a
      reality check.
    approximationNotes: >-
      Values are derived by dividing public market-cap figures by the corresponding TTM revenue figures from the cited
      public sources.
