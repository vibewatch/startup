      - number: '1.4'
        title: Commercial proof, growth signals, and chapter-one gaps
        blocks:
          - type: paragraph
            body: >-
              Path clears the first-threshold question of whether the company is real and commercially active. Official
              case material shows use cases at TYCROP, Mine Rite, Cheetah Manufacturing, Nello, and a large
              generator-tank program, while late-2025 and 2026 releases show the company moving into shipbuilding with
              LAD Services, Saronic, and HII. Modern Machine Shop adds an important operating detail: the company
              packages its systems in a robotics-as-a-service model that bundles hardware, software, monitoring, and
              maintenance, which helps explain both the low-capex sales pitch and the need for strong support
              infrastructure. Public performance claims are also material. Path says its cells can be up to 17 times
              faster than manual welding, cut cost by more than 30%, deliver first-pass yield above 97%, and operate
              continuously in customer environments where labor shortages make second shifts hard to staff. Still, the
              overview cannot close several underwriting questions. Public materials do not provide audited revenue,
              gross margin, customer count, or exact Series D post-money valuation, and third-party databases disagree
              with the company on founding year and headcount. Those gaps are not thesis-killing, but they keep
              confidence at a measured level for an otherwise impressive industrial AI story.
