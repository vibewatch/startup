      Path most often appears to land when a plant faces labor scarcity, high weld variability, and throughput pressure,
      then expands through proof of uptime and second-cell economics.
    claimRefs:
      - CU002
      - CU004
      - CU027
      - CU028
      - CU036
      - CU041
    data:
      items:
        - label: Labor and throughput trigger
          detail: >-
            Manufacturers first encounter Path when skilled-welder scarcity, delayed schedules, or fit-up variability
            make manual welding a bottleneck.
          tone: neutral
        - label: Focused use-case qualification
          detail: >-
            The deal is usually anchored to a narrow high-pain workload such as poles, tanks, mining structures,
            trailers, or ship assemblies.
          tone: positive
        - label: FAT and deployment handoff
          detail: >-
            Public proof frequently highlights a factory acceptance test or initial implementation milestone before the
            cell begins routine production.
          tone: neutral
        - label: Capacity and quality proof
          detail: >-
            Reference customers then talk about more throughput, better schedule adherence, or the practical equivalent
            of adding labor capacity.
          tone: positive
        - label: Expansion decision
          detail: >-
            The final step depends on whether the customer adds more cells, renews a RaaS contract, or broadens into
            adjacent weld families—evidence Path rarely discloses publicly.
          tone: neutral
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      The public evidence set narrows from many named references into a smaller subset with quantified or time-sequenced
      outcomes.
    approximationNotes: Values are counts of public proof points reviewed for this chapter, not company-disclosed customer totals.
    claimRefs:
      - CU001
      - CU005
      - CU011
      - CU022
      - CU025
      - CU029
      - CU037
    data:
      items:
        - label: Named public customer references reviewed
          value: 9
          unit: accounts / organizations
          note: TYCROP, Mine Rite, Nello, Cheetah, Millerbernd, AMSi, LAD Services, Saronic, HII
        - label: Named references with direct customer or partner quotes
          value: 6
          unit: accounts / organizations
          note: TYCROP, LAD Services, Saronic, HII, plus Path-attributed testimonials around Mine Rite and Cheetah
        - label: Named references with clear quantified outcomes
          value: 2
          unit: accounts
          note: TYCROP throughput / efficiency improvement and Mine Rite second-shift-equivalent capacity
        - label: Named references still at FAT or implementation handoff stage
          value: 3
          unit: accounts
          note: Nello, AMSi, and generator-tank style proof emphasize readiness more than long-duration production
        - label: Defense / shipbuilding programs still pre-scale
          value: 2
          unit: programs
          note: Saronic rollout learning phase; HII proof-of-concept in 2026 and pilot in 2027
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality is strongest in established heavy-fabrication accounts, while the newest shipyard accounts carry
      the highest strategic value but lower maturity.
    claimRefs:
      - CU006
      - CU014
      - CU022
      - CU025
      - CU032
      - CU039
      - CU040
      - CU037
    data:
      columns:
        - Outcome specificity
        - Freshness
        - Production maturity
        - Independence
      rows:
        - label: TYCROP
          values:
            - label: Strong
              tone: positive
              detail: >-
                Multiple sources cite throughput, efficiency, and on-schedule delivery with a named customer executive
                quote.
            - label: Strong
              tone: positive
              detail: Proof is current to 2025–2026 and tied to an active implementation.
            - label: Strong
              tone: positive
              detail: Evidence is framed as a successful implementation, not merely an exploratory MOU.
            - label: Moderate
              tone: neutral
              detail: The best details are still vendor- and partner-led rather than a long independent customer study.
        - label: Mine Rite / Nello / Cheetah cluster
          values:
            - label: Moderate
              tone: neutral
              detail: Each proof point names a real use case, but only Mine Rite adds a quasi-quantified capacity outcome.
            - label: Strong
              tone: positive
              detail: Most references are from 2026 and aligned with current go-to-market verticals.
            - label: Moderate
              tone: neutral
              detail: Nello highlights FAT-stage readiness while Cheetah and Mine Rite look more production-oriented.
            - label: Weak-moderate
              tone: risk
              detail: The evidence remains largely Path-authored, with limited independent operating data.
        - label: Shipbuilding / defense
          values:
            - label: Moderate
              tone: neutral
              detail: >-
                Strategic partners describe throughput goals and real use cases, but few hard performance metrics are
                public.
            - label: Strong
              tone: positive
              detail: All major references are from late 2025 through 2026.
            - label: Weak-moderate
              tone: risk
              detail: HII explicitly places the work in proof-of-concept and pilot phases.
            - label: Strong
              tone: positive
              detail: HII and independent trade coverage provide better third-party validation than most Path-only case pages.
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
