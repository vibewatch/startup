      - number: '1.2'
        title: Leadership, governance, and operating bench
        blocks:
          - type: paragraph
            body: >-
              The public leadership surface is credible but still thinner than a public-market investor would want.
              Official pages show the company has moved beyond a two-founder story: Heather Carroll leads revenue, Mike
              Renn leads global operations, Scott Smith leads finance, Andrew Lein leads product, Matthew Randle
              oversees security and reliability engineering, and Alexandra Scheimen leads people. The board was also
              expanded in December 2025 with Frank Klein of Rocket Lab and Geoffrey Chatas of Yale University, while the
              about page shows Drive Capital partner Nick Solaro and Matter Venture Partners founding partner Haomiao
              Huang on the board alongside the founders. This creates a visible blend of founder control, manufacturing
              operating experience, and venture oversight. At the same time, the public record still lacks committee
              disclosure, ownership concentration, or governance-right detail. The company is therefore easier to
              underwrite as a founder-led operating business than as a fully transparent late-stage governance package.
              That gap does not negate the company’s progress, but it is important because Path is already large enough
              and well funded enough that missing governance details become a diligence item rather than a trivial
              private-company omission.
