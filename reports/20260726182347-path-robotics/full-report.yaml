          unit: x revenue
          note: Approximate market-cap-to-revenue reference from public market-cap and revenue pages
        - label: Illinois Tool Works proxy ceiling
          value: 5
          unit: x revenue
          note: Loose upper-bound proxy; conglomerate mix makes it an imperfect Path comp
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Because Path revenue is not public, the most defensible numerical range today is the observed public-comp
      revenue-multiple band rather than a fake single-company valuation estimate.
    approximationNotes: >-
      The figure anchors valuation discipline using observed public reference bands and market-growth ranges, not a
      claimed private Path valuation.
    data:
      items:
        - label: Relevant public-comp revenue-multiple band (x)
          low: 1.8
          mid: 3.2
          high: 5
          displayValue: 1.8x–5.0x
          detail: ESAB anchors the lower end, Lincoln Electric the central reference, and ITW a loose upper bound.
          tone: neutral
        - label: 2026 robotic-welding market size band (USDbn)
          low: 9
          mid: 10.2
          high: 11.49
          displayValue: $9.0B–$11.49B
          detail: >-
            Fortune and Business Research Insights disagree on 2026 size, which is why TAM should inform upside but not
            create false precision.
          tone: positive
    claimRefs:
      - CV020
      - CV023
      - CV024
      - CV025
      - CV043
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Analyst synthesis of the core underwriting dimensions shows why the company is attractive but still
      under-documented at price.
    approximationNotes: Scores are 1-10 analyst heuristics based on the retained public record, not company-reported KPI scales.
    data:
      items:
        - label: Market tailwind
          value: 8
          unit: /10
          note: Large and growing automation demand with labor-shortage support
        - label: Product / moat credibility
          value: 7
          unit: /10
          note: Patents, customers, and high-mix positioning are real but not fully benchmarked
        - label: Customer proof
