- id: developer-signal-and-engineering-depth
  title: Developer signal and engineering depth
  body: 'The strongest non-marketing evidence in this chapter comes from the jobs surface. Built In and startup.jobs show Path hiring not just generic software engineers, but specialists in robotic welding perception, sensor simulation, reinforcement learning, real-time C++ systems, ROS and ROS2 integration, point-cloud fusion, localization, navigation, and production-grade deployment. Those listings imply a stack that spans research and operations: synthetic data generation in Isaac Sim and Unreal, sim-to-real validation, cloud and HMI software, and direct deployment to live robotic cells. This is important because it helps distinguish a genuine technical organization from a company that is mostly packaging third-party components. The engineering surface also lines up well with the product claims: if Rove truly exists, the company should need mobile software, localization, and rugged perception; if Obsidian truly improves over time, it should need data pipelines, simulation, and production
    ML operations. The hiring evidence is therefore consistent with the architecture story, even though it cannot prove product performance on its own.'
