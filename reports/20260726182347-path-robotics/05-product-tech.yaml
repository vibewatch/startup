- id: rove-and-mobile-execution
  title: Rove and mobile execution
  body: 'Rove is the most important 2026 technical expansion because it changes the problem Path is trying to solve. Fixed robotic cells already require difficult perception and process control, but mobile welding on large immovable structures adds localization, stability, navigation, and worksite variability. Path’s official page lays out a concrete workflow: move to a predefined welding location, locate seams, adjust parameters in real time, and capture data while compensating for heat distortion. Independent trade coverage consistently reinforces the same thesis, describing Rove as a quadruped platform built for shipbuilding and heavy construction where bringing the workpiece into a cell is impractical. The presence of Saronic as an early adopter and the explicit limit of only 50 units shipping in 2027 create a balanced picture: the product is real enough to matter, but still clearly in controlled early commercialization rather than mass deployment. For diligence, that makes Rove strategically
    exciting but still execution-risk heavy.'
  claimRefs:
