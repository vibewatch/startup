- id: ip-moat-and-validation-limits
  title: IP moat and validation limits
  body: Path’s patent surface is meaningful, but it does not close the validation gap. Multiple patent publications and a granted patent support the idea that the company has protected work around autonomous welding robots and simulated weld-path generation. The granted patent’s security-interest assignments also hint that the IP is important enough to sit inside financing relationships. That said, patents and marketing together are not the same as third-party validation. Most independent reporting on Rove and Obsidian restates the company narrative instead of publishing comparative defect rates, cycle times, material-coverage benchmarks, or reproducibility detail. Buyers can therefore take reasonable comfort that Path is building real IP and a real engineering organization, but they still cannot independently prove how much of the moat comes from proprietary data and field performance rather than from ambitious product storytelling. The product-tech verdict is positive, but confidence should
    stay measured until benchmark-style proof improves.
