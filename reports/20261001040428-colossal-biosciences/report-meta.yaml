  topStrengths:
    - >-
      The company has moved beyond pure narrative: conservation-tech sales, sovereign partnerships, and spinout
      commercialization provide real monetization paths before the first extinction revival.
    - >-
      Scientific credibility remains unusually strong, with a founder bench and research footprint that still lead the
      category on de-extinction and ancient-DNA work.
    - >-
      Capital access has stayed robust, with roughly $615M of cumulative funding and follow-on valuation support in 2026
      secondary and fundraising reports.
  topRisks:
    - >-
      The core de-extinction thesis is still unproven in the wild, so a large share of the valuation depends on science,
      regulation, and public acceptance converging over a very long horizon.
    - >-
      Audited financials, cash burn, and cap-table detail remain undisclosed, making the true downside protection and
      return profile difficult to underwrite.
    - >-
      The current valuation already embeds substantial optionality from spinouts and future platforms, leaving limited
      margin for error if those businesses underperform.
    - >-
      Public reporting on total capital raised still spans a wide range, which signals that external visibility into the
      company's financing history remains incomplete.
  unresolvedGaps:
    - Audited financial statements, operating cash burn, and runway are still not public.
    - The full capitalization table and liquidation preference stack remain undisclosed.
    - Colossal's retained ownership stakes in spinouts such as Form Bio, Breaking, and Astromech are not fully verified.
    - Independent legal opinion on release constraints for de-extinction species remains absent from the public record.
