companyProfile:
  summary: >-
    Colossal Biosciences is a Dallas-based de-extinction and genomics platform company founded in 2021 by Ben Lamm and
    George Church. The company combines CRISPR-based extinct-species programs with conservation-tech commercialization,
    sovereign partnerships, and spinouts such as Form Bio, Breaking, and Astromech. Public reporting in 2026 places
    cumulative capital around $615 million and implied equity value around $10.3 billion, but the company still has not
    executed a live de-extinction release and has not disclosed audited financials or a complete cap table.
  foundedDate: '2021-09-13'
  founders:
    - name: Ben Lamm
      role: CEO and Co-Founder
      background: Serial entrepreneur and technology investor who remains Colossal's public-facing executive lead.
      claimRefs:
        - CO001
        - CO003
    - name: George Church
      role: Co-Founder and Scientific Advisor
      background: Harvard geneticist and genomics pioneer whose reputation anchors the company's scientific credibility.
      claimRefs:
        - CO001
        - CO004
  foundingLocation: Dallas, Texas, USA
  headquarters: Dallas, Texas
  productSummary: >-
    Colossal's core product is a platform combining ancient-DNA reconstruction, multiplex CRISPR editing, stem-cell and
    reproductive biology, and conservation-tech tooling. Its commercial outputs include conservation services,
    sovereign-partnership work, and spinout businesses that commercialize adjacent software and AI biology assets.
  customerFocus: >-
    Governments, conservation bodies, strategic public-sector partners, and synthetic-biology or biopharma users of
    Colossal-linked spinouts and technology services.
  businessModel: >-
    Mix of conservation-tech sales and licensing, sovereign partnerships, spinout equity and services, and future
    de-extinction commercialization.
  stage: late-stage private
  fundingStatus: >-
    About $615 million raised across seed, Series A/B/C, and sovereign partnership capital; the January 2025 Series C at
    a $10.2 billion valuation was followed by 2026 reports of a possible $20 billion to $30 billion new financing target
    and secondary marks near $10.3 billion.
