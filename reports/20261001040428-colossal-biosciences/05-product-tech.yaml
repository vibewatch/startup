callouts:
  - calloutType: insight
    title: The Spinout and Platform Monetization Strategy
    body: >-
      Because primary de-extinction milestones involve decadal biological timelines, Colossal's
      near-term technology thesis rests on commercializing ancillary computational and molecular
      discoveries. Software platforms like Form Bio, bioremediation tools like Breaking, and AI
      predictive life science models like Astromech allow the company to capture enterprise venture
      value long before a live woolly mammoth or thylacine can be reintroduced into the wild.
    claimRefs:
      - CE011
      - CE012
  - calloutType: risk
    title: Surrogate Bottlenecks and Gestational Constraints
    body: >-
      Multiplex cellular editing has proven feasible in vitro, but reproductive translation remains
      the primary scientific bottleneck. Asian elephants are endangered themselves, limiting their
      ethical and practical availability as surrogates for woolly mammoth gestation. Until mechanical
      artificial womb technologies achieve full-term developmental parity, biological surrogacy
      constraints represent a hard physical ceiling on de-extinction throughput.
    claimRefs:
      - CE007
      - CE008
