  - id: TE002
    title: Technology and Operating Architecture Stack
    notes: >-
      Synthesized from peer-reviewed publications, technical patent disclosures, and executive interviews.
    columns:
      - Architectural Layer
      - Core Role and Capability
      - Key Biological / Technical Dependency
      - Primary Technical Risk
    rows:
      - - Paleogenomic Reconstruction
        - Reconstructing degraded ancient genomes into chromosomal assemblies
        - High-depth sequencing of sub-fossil specimens; synteny with modern relatives
        - DNA fragmentation and post-mortem cytosine deamination artifacts
      - - Multiplex Gene Editing
        - Executing simultaneous multi-locus modifications in single interventions
        - CRISPR/Cas9 enzymes, bespoke guide RNA arrays, monoclonal cell screening
        - Cellular cytotoxicity and off-target double-strand break translocations
      - - In Vitro Embryo Engineering
        - Generating viable diploid embryos containing edited nuclear genetic material
        - Somatic cell nuclear transfer (SCNT); avian primordial germ cell culture
        - Extremely low SCNT nuclear reprogramming efficiency in non-model organisms
      - - Gestation and Development
        - Gestating edited embryos to full-term live birth
        - Interspecific surrogate mothers or prototype ex utero artificial wombs
        - Gestational immunology, maternal-fetal incompatibility, surrogate scarcity
      - - Longitudinal Husbandry
        - Continuous veterinary and epigenetic health tracking in managed preserves
        - Biosecure enclosures, telemetry tracking, metabolic health monitoring
        - Late-onset developmental abnormalities or premature senescence
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
