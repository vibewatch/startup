  - id: TE003
    title: Core Workflow and Conservation Use-Case Analysis
    notes: >-
      Evaluates practical deployment workflows for Colossal's core technological solutions.
    columns:
      - User Job
      - Traditional Workflow
      - Colossal Technical Solution
      - Measurable Benefit
      - Technical / Operational Limitation
    rows:
      - - Genetic Rescue of Endangered Species
        - Captive breeding with shrinking genetic pools and inbreeding depression
        - Biobanking cell lines and introducing multiplex genetic diversity edits
        - Preservation of viable germplasm across 2,300+ ESA-listed species
        - High cost per species and requirement for viable reproductive biology
      - - Pathogen Mitigation in Wildlife
        - Isolation, quarantine, and non-specific supportive veterinary care
        - Rapid development of targeted mRNA vaccines and cellular resistance edits
        - Complete protection demonstrated against lethal EEHV in Asian elephants
        - Cold-chain distribution hurdles for remote field wildlife deployments
      - - Paleogenomic Trait Restoration
        - Inability to reintroduce lost ecological keystone behaviors or traits
        - De novo synthesis and multiplex insertion of adaptive ancient alleles
        - Re-creation of functional phenotypes (e.g. cold-tolerant lipid pathways)
        - Phenotypes are approximations and do not reconstitute extinct behavioral culture
      - - Large-Scale Wildlife Bio-Surveillance
        - Invasive radio-collaring, physical trapping, and manual visual counts
        - AI-powered autonomous bioacoustics and thermal drone computer vision
        - Passive individual identification and real-time threat detection
        - Processing power constraints and algorithmic drift across complex field habitats
    claimRefs:
      - CE003
      - CE004
      - CE014
