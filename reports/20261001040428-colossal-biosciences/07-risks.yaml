callouts:
  - calloutType: "risk"
    title: "The Valuation vs Commercialization Disconnect"
    body: "Colossal's prospective valuation discussions of $20B to $30B reflect an extraordinary premium for a biotechnology platform that has not revived a single extinct animal and whose ultimate flagship products have no existing commercial buyer market. If biological timelines slip or spinout equity value fails to match parent burn, severe capital structure dilution could occur."
    claimRefs:
      - "CR007"
      - "CR009"
      - "CR012"
  - calloutType: "insight"
    title: "The De-Extinction Proxy Definition Debate"
    body: "Independent scientific commentary emphasizes that edited Asian elephant cells or modified gray wolves are functional ecological proxies rather than authentic resurrections of extinct species. While scientifically advanced, this gap creates ongoing vulnerability to accusations of promotional hype if marketed as complete de-extinction."
    claimRefs:
      - "CR005"
      - "CR006"
