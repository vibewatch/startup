  topStrengths:
    - 业务走出纯叙事阶段：在首个灭绝物种复活之前，保护科技销售、主权合作与分拆业务商业化已经提供了切实的变现路径。
    - 科研公信力依然突出：创始团队与科研布局在去灭绝及古 DNA 研究领域依然保持行业领先。
    - 资本获取能力保持稳健：累计融资约 $615M，2026 年老股交易与融资报道也持续支撑着后续估值。
  topRisks:
    - 核心的去灭绝逻辑尚未在野外得到验证，当前估值很大程度上取决于科学、监管与公众接受度能否在极长周期内达成共识。
    - 经审计财务数据、烧钱速度与股权结构表细节均未公开，难以评估真正的下行保护与投资回报。
    - 当前估值已经打入了分拆公司与未来平台的巨大期权价值，一旦这些业务不及预期，估值容错空间极小。
    - 公开报道对累计融资金额的统计口径差异较大，表明外部对公司融资历史的能见度仍不完整。
  unresolvedGaps:
    - 经审计财务报表、经营性烧钱速度与现金跑道仍未公开。
    - 完整股权结构表、清算优先权及优先股堆叠仍未公开披露。
    - Colossal 在 Form Bio、Breaking、Astromech 等分拆实体中的保留持股比例尚未完全核实。
    - 公开记录中仍缺失针对去灭绝物种野外释放法律约束的独立法律意见书。
