- calloutType: risk
  title: Severe Customer Concentration in Sovereign Capital
  body: Colossal's disclosed commercial cash generation is overwhelmingly concentrated in sovereign and defense partnerships,
    most notably a $60 million bilateral commitment from the United Arab Emirates. The parent company lacks a diversified,
    recurring enterprise client base, leaving revenue highly vulnerable to geopolitical, regulatory, or public policy shifts.
  claimRefs:
  - CU002
  - CU009
  - CU013
- calloutType: insight
  title: Spinoff Architecture Isolates Software Revenue
  body: While Colossal has created significant enterprise value through spinoffs like Form Bio ($30M Series A) and Astromech
    ($2B valuation), these entities operate with independent capitalization and balance sheets. Downstream software customers
    contract with the spinouts rather than Colossal Biosciences Inc., limiting direct software ARR capture at the parent decacorn
    level.
  claimRefs:
  - CU003
  - CU007
  - CU015
