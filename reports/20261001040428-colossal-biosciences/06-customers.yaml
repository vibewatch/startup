figures:
- id: FU001
  title: Customer Journey & Technology Commercialization Map
  type: journey-map
  summary: Multi-stage progression from scientific proof-of-concept to sovereign partnership and commercial spinoff adoption.
  data:
    items:
    - label: Genomic Discovery & De-extinction R&D
      summary: Core research in CRISPR editing, ancient DNA extraction, and embryology funded by venture capital.
      detail: Scientists reconstruct ancient genomes and identify cold-adaptation or phenotypic traits using computational
        biology.
      touchpoints:
      - Ancient tissue DNA extraction
      - Multiplex CRISPR editing
      - In vitro cellular validation
      tone: neutral
    - label: Proof-of-Concept Validation
      summary: Generation of modified organisms or cellular lines proving technology viability.
      detail: Successful birth of gene-edited pups (dire wolf proxy) and woolly mice validates pipeline.
      touchpoints:
      - Surrogate embryo transfer
      - Phenotypic trait verification
      - Scientific peer review
      tone: positive
    - label: Institutional & Sovereign Engagement
      summary: Governments and defense agencies contract for bio-banking, conservation, and surveillance tools.
      detail: Sovereign partners commit capital for national BioVaults and regional genetic rescue programs.
      touchpoints:
      - Bilateral BioVault agreements
      - Defense pathogen surveillance contracts
      - Conservation foundation alliances
      tone: positive
    - label: Spinoff Commercialization
      summary: Extraction and capitalization of general-purpose technology modules into independent corporations.
      detail: Internal tools spun out into Form Bio (software), Breaking (bioremediation), and Astromech (predictive AI).
      touchpoints:
      - Independent venture financing
      - Enterprise client software sales
      - Commercial biopharma licensing
      tone: positive
    - label: Market-Scale Monetization (Future)
      summary: Scale adoption across artificial womb fertility systems and institutional biodiversity credit markets.
      detail: Long-term revenue model dependent on novel regulatory frameworks and commoditized biodiversity offsets.
      touchpoints:
      - Mammalian ectogenesis clinics
      - Voluntary biodiversity credit exchanges
      - Long-term ecosystem monitoring
      tone: risk
    - label: Ecosystem Rewilding & Bio-Credit Issuance
      summary: Long-term monitoring of reintroduced keystone species yielding audited biodiversity credits.
      detail: Third-party ecological verification bodies audit habitat restoration metrics and issue certified biodiversity
        credits for institutional buyers.
      touchpoints:
      - Ecological sensor monitoring
      - Third-party biodiversity audit
      - Regulated credit exchange listing
      tone: positive
  approximationNotes: Stage sequencing reflects company corporate strategy disclosures, spinoff transaction histories, and
    executive roadmap commentary.
