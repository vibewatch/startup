  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Colossal Biosciences自2021年创立以来的发展脉络，涵盖关键融资轮次、复活物种发布及商业里程碑。
    data:
      items:
        - date: 2021-09
          label: 公司创立
          detail: Ben Lamm与George Church博士共同创立Colossal Biosciences，募集1500万美元种子轮资金，致力于复活猛犸象。
          tone: positive
        - date: 2022-03
          label: A轮融资
          detail: 完成$60M A轮融资，加速推进基因编辑研发并扩建实验室设施。
          tone: positive
        - date: 2022-08
          label: 袋狼复活项目启动
          detail: 宣布携手墨尔本大学启动塔斯马尼亚虎（袋狼）复活项目。
          tone: positive
        - date: 2022-09
          label: 分拆Form Bio
          detail: 分拆计算生物学平台Form Bio，获3000万美元独立风险投资。
          tone: neutral
        - date: 2023-01
          label: B轮融资与渡渡鸟项目
          detail: 完成由US Innovative Technology Fund领投的$150M B轮融资，估值达$1B以上，并成立鸟类基因组学研究组。
          tone: positive
        - date: 2024-03
          label: iPSC大象干细胞技术突破
          detail: 宣布成功诱导分化出亚洲象诱导多能干细胞（iPSC），攻克猛犸象基因工程的关键技术瓶颈。
          tone: positive
        - date: 2025-01
          label: C轮百亿独角兽估值
          detail: 完成由TWG Global领投的$200M C轮融资，估值攀升至$10.2B，累计融资额达$435M。
          tone: positive
        - date: 2025-04
          label: 恐狼概念验证成果发布
          detail: 公布针对恐狼性状的工程化细胞编辑成果，引发学界对物种复活定义的争议。
          tone: neutral
        - date: 2026-07
          label: 传闻洽谈$20B-$30B估值新一轮融资
          detail: Axios报道公司正洽谈估值最高达300亿美元的新一轮融资，但由于缺乏活体复活动物成果，引来投资人质疑。
          tone: adverse
