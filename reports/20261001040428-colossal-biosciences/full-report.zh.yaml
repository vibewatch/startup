chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位与创立使命
        blocks:
          - type: paragraph
            body: >-
              Colossal Biosciences是一家未上市生物科技与基因工程公司，由连续创业者Ben Lamm与哈佛医学院著名遗传学家George
              Church博士于2021年9月创立。公司总部位于得克萨斯州达拉斯，业务横跨合成生物学、基因组学与细胞工程交叉领域。Colossal将去灭绝（de-extinction）确立为核心使命，即复活灭绝物种并重塑其生态位，首批规划包括猛犸象、袋狼（塔斯马尼亚虎）、渡渡鸟以及恐狼。公司将宏大的生态保护愿景与平台化商业模式相结合，研发底层基因工程工具包、计算生物学架构以及人造子宫硬件设备，未来可向人类健康与家畜领域拓展变现。成立四年内，Colossal便跻身后期成长期非上市公司行列，在得克萨斯州、马萨诸塞州和澳大利亚建立核心研发设施，并与全球16所学术机构保持合作研究协议。
