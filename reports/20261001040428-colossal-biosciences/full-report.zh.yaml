  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景与直接竞对态势
        blocks:
          - type: paragraph
            body: >-
              Colossal Biosciences是合成生物学赛道中唯一由VC支持、规模化推进多物种去灭绝的商业平台，定位独特。但尽调显示，公司并非没有竞对。非营利基金会Revive &
              Restore与Colossal使命最相近：它为黑足雪貂和旅鸽保护性克隆项目协调高校实验室与野生动物机构，却无须承担Colossal高昂的私营平台开支。与此同时，以圣迭戈动物园野生动植物联盟冷冻动物园（Frozen
              Zoo）为代表的生物资产老牌机构，掌控着历经50余年沉淀的丰富冷冻细胞株。这些机构级资源库对获取活体生物组织构成了极高的准入壁垒，而传统生态野化组织则提供了立即可用且低风险的生态替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
