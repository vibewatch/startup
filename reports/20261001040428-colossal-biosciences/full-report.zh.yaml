        - label: 基因组学与计算建模
          detail: 半化石古DNA测序与机器学习表型分析
          modules:
            - 古DNA提取纯化与高覆盖度古基因组测序
            - 机器学习表型预测与多基因位点编辑设计算法
            - 将现存近缘物种参考基因组作为对照，绘制共线性图谱
        - label: 细胞工程与质控
          detail: 多重CRISPR递送与高通量单克隆筛选
          modules:
            - 多重CRISPR/Cas9递送系统，支持数十个基因组位点同步编辑
            - 单克隆细胞系扩增与自动化单细胞挑取
            - 全基因组测序与核型分析，排除脱靶突变
        - label: 体外与类器官验证
          detail: 着床前表型检测与染色质可及性分析
          modules:
            - 组织特异性类器官培养，用于体外表型特征验证
            - 表观遗传图谱分析与染色质可及性测定
            - 细胞毒理学评估与代谢适应度基准测试
        - label: 胚胎与生殖工程
          detail: 体细胞核移植与鸟类原始生殖细胞培养
          modules:
            - 哺乳动物体细胞核移植（SCNT）重编程技术
            - 鸟类长效原始生殖细胞（PGC）分离与培养
            - 配子低温冷冻保存与辅助生殖技术规范
        - label: 妊娠发育与分娩
          detail: 代孕宿主着床与机械人造子宫孵育
          modules:
            - 现存近缘物种异种代孕胚胎移植
            - 处于持续硬件研发中的体外人造子宫原型系统
            - 妊娠免疫耐受与母胎屏障监测
        - label: 长期饲育与生物安全
          detail: 受控生态保护区内的出生后持续健康监测
          modules:
            - 持续生物遥测与纵向表观遗传健康监测
            - 零泄漏标准的生物安全防护设施
            - 将基因组数据集公开发布至开放数据库（NCBI BioProject）
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
      - CE015
  - id: FU001
    title: 客户旅程与技术商业化全景图
    type: journey-map
    summary: 从科研概念验证到主权机构合作、再到商业衍生公司落地的多阶段演进路径。
    data:
      items:
        - label: 基因组发现与物种复活研发
          summary: Core research in CRISPR editing, ancient DNA extraction, and embryology funded by venture capital.
          detail: 科研人员重建古基因组，借助计算生物学识别耐寒性状等表型特征。
          touchpoints:
            - 古组织DNA提取
            - 多重CRISPR编辑
            - 体外细胞验证
          tone: neutral
        - label: 概念验证
          summary: Generation of modified organisms or cellular lines proving technology viability.
          detail: 基因编辑幼犬（恐狼替代物）与猛犸鼠顺利降生，验证全套研发管线。
          touchpoints:
            - 代孕胚胎移植
            - 表型特征验证
            - 学术同行评审
          tone: positive
        - label: 机构与主权伙伴拓展
          summary: Governments and defense agencies contract for bio-banking, conservation, and surveillance tools.
          detail: 主权合作伙伴出资建设国家级BioVault与区域基因救援项目。
          touchpoints:
            - 双边BioVault协议
            - 国防病原体监测合同
            - 保护基金会合作联盟
          tone: positive
        - label: 衍生公司商业化
          summary: Extraction and capitalization of general-purpose technology modules into independent corporations.
          detail: 内部技术工具孵化分拆为Form Bio（软件）、Breaking（生物修复）与Astromech（预测性AI）。
          touchpoints:
            - 独立风险投资融资
            - 企业客户软件销售
            - 商业生物医药授权
          tone: positive
        - label: 规模化市场变现（远期）
          summary: Scale adoption across artificial womb fertility systems and institutional biodiversity credit markets.
          detail: 远期商业模式有赖于全新监管框架与大宗商品化生物多样性抵消机制。
          touchpoints:
            - 哺乳动物体外妊娠医疗中心
            - 自愿生物多样性信用交易所
            - 长期生态系统监测
          tone: risk
        - label: 生态野化与生物信用签发
          summary: Long-term monitoring of reintroduced keystone species yielding audited biodiversity credits.
          detail: 第三方生态核查机构审核栖息地修复指标，向机构买家签发经认证的生物多样性信用。
          touchpoints:
            - 生态传感器监测
            - 第三方生物多样性审计
            - 受监管信用交易所挂牌
          tone: positive
    approximationNotes: 阶段演进顺序反映公司战略披露、衍生公司交易沿革及高管路线图规划。
    claimRefs:
      - CU002
      - CU006
      - CU007
      - CU014
      - CU016
