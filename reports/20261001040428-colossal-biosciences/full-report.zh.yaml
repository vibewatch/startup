              Colossal维持着极高的重资本运营规模，以支撑横跨灭绝与濒危物种项目的多重CRISPR基因编辑与细胞工程研发。公司依托位于得克萨斯州达拉斯占地55,000平方英尺的专用总部实验设施，并在全球16家合作实验室支持超过170位科学家与遗传学家
              [CI011]。运营支出主要由高薪科研团队、专用实验试剂、高通量测序设备及计算建模算力集群构成。尽管通过一级市场股权融资与主权合作，其累计实缴资本已达615 million
