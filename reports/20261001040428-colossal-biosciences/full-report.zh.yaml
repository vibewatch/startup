              Colossal的股权定价与估值走势反映出一级市场多轮融资的激进跳升。2025年1月，公司完成由TWG Global领投的200 million dollars C轮融资，投后估值升至10.2 billion
              dollars [CI002]。流动性与二级市场定价机制进一步揭示了投资者需求。2026年8月，伦敦上市公司Shaires Holdings同意按每股24.89 dollars的价格，初步受让价值12.0
              million dollars的Colossal普通股非现金对价份额；该价格直接对应2025年9月C轮追加融资设定的10.3 billion dollars完全稀释估值
              [CI003]。同时，UpMarket和EquityZen等Pre-IPO二级市场平台也为合格投资者撮合老股转让，但设有50,000 dollars最低投资门槛、托管要求以及公司的优先购买权
              [CI012]。2026年年中，据报道Colossal已就按20 billion至30 billion dollars的目标估值募集新资金展开接洽
              [CI009]。然而行业观察人士指出，这一估值水平建立在对未经证实的商业化潜在市场的巨大估值倍数扩张之上 [CI010]。
