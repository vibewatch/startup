      - number: '1.2'
        title: 领导架构与治理动态
        blocks:
          - type: paragraph
            body: >-
              Colossal的管理治理架构以首席执行官Ben Lamm为核心，这位连续科技创业者此前曾完成五次成功的创业退出，横跨消费级软件、数字媒体与人工智能赛道。科学战略与基因组学研发由联合创始人George
              Church博士统领，其在CRISPR基因编辑与合成生物学领域的奠基性突破赋予公司无可比拟的学术号召力。管理团队还吸纳了首席运营官Adam
              Milne，其在辉瑞（Pfizer）与BioLabs等全球生物医药领军机构积累了近三十年的运营管理经验；首席科学官Beth
              Shapiro博士则是享誉国际的古基因组学家与麦克阿瑟天才奖得主，负责领导古DNA重构与鸟类基因组工程。公司组织架构暴露出显著的关键人物依赖：融资推进、主权国家谈判以及分拆业务孵化高度仰仗Lamm的高管人脉网络；机构层面的科研信誉则长期绑定于Church持续的学术声望与专利产出。
