      - number: '1.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 估值走势与生物学里程碑脱钩
            body: >-
              尽管Colossal展现出惊人的募资能力并成功分拆出具备商业可行性的软件与材料公司，其数十亿美元的高估值仍大幅脱离了核心科学使命。在尚未复活任何灭绝物种、首头猛犸象幼崽最快也要到2028年才能落地的现实下，市场传闻中高达$20B–$30B的估值讨论一旦遭遇研发进度延期或监管禁令，将面临巨大的重新定价风险。
            calloutType: risk
            claimRefs:
              - CO006
              - CO008
              - CO013
          - type: callout
            title: 平台分拆业务成为实质经济支柱
            body: >-
              Colossal的运作逻辑与其说是一家单一生物科技公司，不如说更接近一个概念先行的风险投资孵化器（venture studio）。打着去灭绝旗号研发的技术资产——例如计算生物学（Form
              Bio，融资$30M）与AI预测建模（Astromech，估值$2B）——提供了传统单一管线创新药企所缺乏的实体商业资产与下行安全边际。
            calloutType: insight
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出分类
        blocks:
          - type: paragraph
            body: >-
              Colossal
              Biosciences在基因工程、物种保护生物学与企业级生物科技平台交叉赛道占据独特生态位。公司并未将自身局限于非营利科研保护项目或单一资产研发商，而是围绕平台型技术架构搭建商业策略。其核心研发引擎涵盖多重CRISPR基因编辑、细胞重编程、古基因组学与体外胚胎孵化培育，持续沉淀高价值知识产权与专有技术壁垒。当公众目光几乎完全被猛犸象、袋狼与渡渡鸟等标志性去灭绝旗舰项目吸引时，Colossal正从多条中间路径捕捉商业价值：收购ViaGen
              Pets and Equine等能稳定产生现金流的商业克隆企业、与主权国家建立公私保护合作，并将商业软件与合成生物学平台分拆为独立融资的实体公司。
