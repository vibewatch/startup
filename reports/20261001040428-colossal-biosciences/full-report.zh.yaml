      - number: '1.4'
        title: 运营规模、里程碑与商业化落地
        blocks:
          - type: paragraph
            body: >-
              Colossal的实体研发基地以位于得克萨斯州达拉斯、占地55,000平方英尺的企业总部与实验中心为枢纽，辅以设在马萨诸塞州波士顿和澳大利亚墨尔本的专项研究中心。公司旗下汇聚超过170名科学家，并拥有由95位以上科学与物种保护专家组成的顾问委员会。尽管Colossal公布了一系列技术进展——包括成功诱导分化出亚洲象诱导多能干细胞（iPSC）以及完成恐狼特异性细胞基因编辑——但公司至今尚未复活任何一种灭绝动物，其备受瞩目的灭绝物种复活里程碑在预计2028年首头猛犸象幼崽诞生前仍具推测性质。商业化落地因而沿双轨推进：一方面是通过直接向政府提供生态保护技术授权以及推进价值$60
              million的阿联酋合作项目；另一方面是借助企业分拆将平台技术推向市场。已分拆实体包括计算生物学平台Form Bio（累计融资$30
              million）以及预测性AI生物学企业Astromech，后者于2026年3月达成$2 billion的独立估值。
