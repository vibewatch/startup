  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与平台范畴
        blocks:
          - type: paragraph
            body: >-
              Colossal
              Biosciences运营着一套合成生物学与去灭绝技术平台，将多重CRISPR基因编辑、古DNA古基因组学与辅助生殖技术同时应用于灭绝谱系与现存濒危物种。Colossal并非要制造与远古动物100%完全一致的基因复制品，而是致力于工程化培育功能性替代体（functional
              proxies）——即在靶向基因座上经过基因修饰、具备耐寒性或庞大体形等关键表型特征的活体生物。除了备受瞩目的灭绝物种复活目标外，Colossal还与政府及机构伙伴合作建立了分布式BioVault生物样本库网络，旨在储备遗传资源并为濒危野生动物研发预防性兽医应对方案。
            claimRefs:
