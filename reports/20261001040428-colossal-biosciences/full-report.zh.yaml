      - number: '5.4'
        title: 生物安全、动物福利与伦理管控
        blocks:
          - type: paragraph
            body: >-
              复杂真核生物的基因编辑涉及深层生物安全、生物隔离与伦理考量。Colossal的安全体系推行分阶段验证机制，在推进至活体胚胎前，候选基因修饰需依次通过计算机模拟（in silico）机器学习模型、体外（in
              vitro）类器官以及细胞核型分析的层层筛选。为保障动物福利，公司主动剔除与健康风险相关的远古基因突变（例如听觉障碍或白化病），保留良性的现代同源基因。活体实验对象被安置于受控保护区内，接受持续的长期健康跟踪，执行零逃逸隔离规范，并将基因数据集公开上传至NCBI公共数据库。然而，野外生态放归仍受制于尚未明确的国际野生动物条约与《濒危物种法案》（ESA）监管框架。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 分拆孵化与平台变现战略
            body: >-
              由于核心去灭绝里程碑横跨以十年计的漫长生物研发周期，Colossal的短期技术商业化逻辑立足于将衍生出来的计算与分子生物学发现推向市场。Form
              Bio等软件平台、Breaking等生物降解工具，以及Astromech等生命科学AI预测模型，使公司早在活体猛犸象或袋狼真正被放归自然之前，就得以提前捕获企业级创投价值。
            calloutType: insight
            claimRefs:
              - CE011
              - CE012
          - type: callout
            title: 代孕瓶颈与母体妊娠制约
            body: >-
              多重细胞基因编辑已被证实具备体外可行性，但生殖转化依然是首要的科研瓶颈。亚洲象本身属于濒危物种，无论是从伦理还是现实可行性来看，将其作为猛犸象妊娠代孕母体都受到极大限制。在机械人造子宫技术实现足月发育完全等效之前，生物代孕约束构成了去灭绝产能无法逾越的物理天花板。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
  - number: 6
    title: 客户生态
    sections:
      - number: '6.1'
        title: 客户细分与买方生态
        blocks:
          - type: paragraph
            body: >-
              Colossal
              Biosciences并不具备传统企业级SaaS或消费品的客群特征。相反，其商业架构横跨四大截然不同的机构与商业客群：主权国家合作伙伴、国防与情报机构、分拆企业级技术采纳方，以及消费级生殖生物学客户。


              主权与政府客群由标杆级合作奠定基石，最引人瞩目的是阿拉伯联合酋长国与美国联邦机构。2026年2月，阿联酋在双边合作中承诺出资$60
              million，用于建设保护濒危物种遗传资源的全球“BioVault”生物样本库，并部署Colossal的保护基因组学工具包。同样，以参与B轮融资的In-Q-Tel为代表的美国国防与国家安全机构，与Colossal在生物监测、快速病原体检测以及多重基因编辑技术上展开合作，旨在保护本土生物基础设施安全。


              除公共部门客户外，Colossal还通过商业分拆推动研发管线变现。生物医药、合成生物学及废弃物处理领域的企业客户，直接从Form
              Bio、Breaking和Astromech采购软件与工程生物学产品，而非直接与作为母公司的去灭绝主体签约。最后，消费端业务集中于ViaGen Pets and
              Equine，该收购子公司通过商业宠物及家畜克隆产生经营现金流。
