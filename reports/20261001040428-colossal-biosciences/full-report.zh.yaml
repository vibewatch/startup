        title: 技术架构与科研管线
        blocks:
          - type: paragraph
            body: >-
              Colossal的运作架构横跨五大计算与生物学核心层级：古基因组测序、计算生物学设计、多重细胞编辑、胚胎工程，以及受控的长期繁育管理。整个研发流程始于对亚化石古DNA碎片的测序，并利用机器学习算法将其与现代参考基因组进行比对映射。进入细胞环节后，Colossal应用多重CRISPR基因编辑，在多个基因座上同时执行数十项基因修饰，随后通过全基因组重测序与核型分析剔除脱靶突变。下游交付则依托体细胞核移植（SCNT）、原始生殖细胞培养，以及正在研发的体外人造子宫系统，旨在摆脱对稀缺代孕母体宿主群体的依赖。
