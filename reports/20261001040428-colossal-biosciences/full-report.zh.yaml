      - number: '1.3'
        title: 资本历史与估值走势
        blocks:
          - type: paragraph
            body: >-
              Colossal Biosciences走出了一条生物科技史上最为陡峭的估值跃升曲线之一。继2021年底斩获$15 million种子轮融资、2022年初完成$60 million
              A轮融资后，公司于2023年1月完成由US Innovative Technology Fund领投的$150 million B轮融资，企业估值突破$1
              billion并跻身独角兽行列。2025年1月，Colossal敲定由TWG Global（古根海姆合伙人CEO Mark Walter与传奇影业创始人Thomas Tull联合创立的投资机构）领投的$200
              million C轮融资，累计股权融资总额推升至$435 million，官方估值达$10.2
              billion，成为得克萨斯州首家超级独角兽。截至2026年7月，财经媒体报道称Colossal已展开初步接洽，计划按$20 billion至$30
              billion的目标估值筹集新一轮股权资金。公司多元化的资本结构囊括了传统机构VC、以In-Q-Tel为代表的情报与国家安全基金、主权投资者，以及多位知名高净值天使投资财团成员。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
