      - number: '8.5'
        title: 核心图表与附录
        blocks:
          - type: callout
            title: 重估值纪律，轻叙事势能
            body: >-
              尽管 Colossal 塑造了无可否认的文化与科学叙事，投资回报归根结底取决于入场倍数。以 $20B 至 $30B
              估值参与一级市场融资，意味着对物种复活完美落地与衍生技术激进商业化做了充分预先定价。在估值倍数重新向可验证现金流靠拢之前，投资人理应恪守资金纪律。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV014
          - type: callout
            title: 清算优先权与降估值脆弱性
            body: >-
              鉴于公司已在多轮优先股融资中累计吸纳逾 $451M 至 $555M
              资金，高级清算优先权对普通股股东与无对冲后期投资者构成了实质性悬顶风险。一旦里程碑发生延误或估值承压，分配瀑布的结构性机制可能严重侵蚀次级股权价值。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV011
