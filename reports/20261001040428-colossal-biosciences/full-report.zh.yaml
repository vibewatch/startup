              Europe等现存物种野化组织当前即可实现生态修复，且不伴随基因不确定性与道德风险。此外，包括世界自然保护联盟（IUCN）犬科专家组在内的独立科学机构对Colossal的恐狼项目提出尖锐审视，认为其夸大了经过基因编辑的灰狼替代体与真正灭绝物种之间的差异。雪上加霜的是，基因编辑生物的野外放归还面临美国FDA有意基因改变（IGA）法规以及IUCN于2025年10月颁布的合成生物学政策的严密监管，可能导致去灭绝商业化产物无限期受限于圈养型生物样本库之中。
