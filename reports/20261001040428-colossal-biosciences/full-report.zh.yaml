            body: >-
              Colossal旗下管线的成熟度在不同生物分类阶元及技术分拆方向上分化显著。在犬科领域，Colossal已在灰狼细胞系中完成跨14个基因、共20项特征的基因修饰，成功培育出活体恐狼幼崽，完成了概念验证。相反，受大象生殖生物学特性及长达22个月妊娠期的制约，猛犸象等大型动物项目仍面临长达数年的研发周期。为了将研发阶段性成果变现，Colossal采取双轨商业模式：一方面分拆专业软件与工业资产——例如计算生物学领域的Form
