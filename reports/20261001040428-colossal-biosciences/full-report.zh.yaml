      - number: '2.3'
        title: 客户画像细分与采购路径
        blocks:
          - type: paragraph
            body: >-
              Colossal面向四类截然不同的客户群体，各群体的采购机制、预算权限与决策周期差异巨大。主权财富基金与国家环境部门是国家级生物多样性保护平台及BioVault样本库的核心买家；此类交易涉及双边政府间谈判、跨年度财政预算拨款，以及围绕生态领导力的地缘战略布局。与之形成鲜明对比的是，富裕宠物主与顶级马匹繁育者构成了成熟的自费服务市场，由子公司ViaGen
              Pets承接；其采购兼具高度交易化与私密性，主要受个人情感寄托或高价值种畜资产保全诉求驱动。第三类客群为生物医药研发机构，通过独立分拆的Form
              Bio和Astromech获得企业级计算软件授权。最后，临床医疗与生殖医学机构构成了转化技术的新兴客群，尤其关注哺乳动物人造子宫系统与诱导多能干细胞（iPSC）抗癌模型。
