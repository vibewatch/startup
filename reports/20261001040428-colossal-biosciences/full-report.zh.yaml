              Colossal Biosciences本质上是一家尚处于商业化前期的生物科技平台企业，其企业估值主要由远期物种复活里程碑预期支撑，而非持续性的软件或产品现金流驱动
              [CI001]。为了在需要耗费数年的去灭绝目标达成前实现知识产权变现，管理层搭建了三大核心商业收入渠道 [CI004]：首先，开展主权国家与政府级生态保护合作，最具代表性的是阿拉伯联合酋长国承诺投入60
              million dollars，用于部署保护科技并设立针对濒危物种遗传资源的全球生物样本库 [CI005]；其次，公司通过将其核心基因研发管线孵化出的专业技术公司分拆以获取巨额资产价值，包括Form
              Bio、Breaking和Astromech [CI006]；其中Astromech于2026年3月估值达到2.0 billion dollars，Form Bio在A轮融资中筹集了30 million
