  - id: TV003
    title: 乐观 / 基准 / 悲观情境分析表
    columns:
      - 情境
      - 核心运营假设
      - 估值与回报逻辑
      - 核心风险与下行触发条件
      - 发生概率指标
    rows:
      - - 乐观情景
        - 2028年前让猛犸象幼崽活产；人造子宫人类生殖衍生业务估值突破50亿美元；主权BioVault合同持续扩容
        - 借助多家分拆业务组成的集团IPO或主权流动性退出，目标企业价值达$30B至$40B
        - 基因改造物种野外释放遭遇监管阻击；代孕妊娠技术失败
        - 15%——鉴于科研里程碑尚处早期，发生概率较低
      - - 基准情景
        - 物种复活里程碑延期2-4年；平台分拆业务的软件授权收入仅达$30M-$50M
        - 估值停留在$8B-$10B；近几轮入场资金的回报受限在0.8x-1.2x
        - 高利率环境下估值倍数承压，捐赠与资助资本出现疲劳
        - 55%——发生概率较高，反映硬科技研发周期普遍延长的常态
      - - 悲观情景
        - 多性状基因编辑遭遇技术瓶颈；主权资本枯竭；衍生公司价值捕获未能反哺母公司
        - 被迫按$1B-$3B估值下调融资或清算（高位入场资本损失70%-90%）
        - 高级清算优先权吞噬普通股与后期成长型股权价值
        - 30%——鉴于资本密集度与资金消耗率，发生概率中等
      - - 市场共识风险触发点
        - 里程碑延期触发对硬科技投资组合的资本配给紧缩
        - EquityZen等平台上的二级市场转让价格大幅折价，跌破一级市场估值水位
        - 二级市场老股转让大幅折价，释放非公开市场流动性枯竭信号
        - 持续监测二级市场活跃交易及主权机构续约条款
    notes: 情景概率与回报倍数基于尚未商业化的硬科技里程碑及平台资产价值建模测算。
