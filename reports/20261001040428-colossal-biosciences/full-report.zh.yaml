      - number: '6.2'
        title: 采纳曲线与收入变现
        blocks:
          - type: paragraph
            body: >-
              审视Colossal的商业落地进程，必须将去灭绝核心里程碑与商业化技术部署明确区分开来。猛犸象、袋狼与渡渡鸟等旗舰物种项目虽然带来了极高的品牌声量与主权国家关注，但并未产生任何直接的软件或产品商业账单。真正的业务动能主要通过技术转让与结构化的跨年度开发协议释放。


              在2025至2026年期间，Colossal形成了三项核心运营收入来源：主权与联邦级保护技术授权、技术分拆商业化，以及已收购的消费级克隆业务。尽管公司估值在2025年底至2026年初达到了$10.2
              billion至$10.32 billion——且2026年中期的融资意向将目标定在$20 billion至$30 billion——但估计其年营业收入仅约$10
              million。这导致其估值相较于年化收入的倍数达到了惊人的1,000倍以上TTM市销率。


              未来的落地增长高度取决于其动物人造子宫平台的商业化进展（该平台计划于2026年底完成小型哺乳动物验证，并存在分拆进军人类辅助生殖的可能），以及建立自愿性生物多样性信用市场的远期构想。在机构级生物多样性信用获得正式监管标准化之前，近期的收入扩张依然紧密受限于公共部门拨款、主权国家赞助与分拆公司股权收益。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
