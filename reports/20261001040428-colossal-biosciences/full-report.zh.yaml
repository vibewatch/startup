      - number: '6.3'
        title: 标杆客户实证与机构合作背书
        blocks:
          - type: paragraph
            body: >-
              Colossal的实际落地实证主要体现为机构间合作协议，而非标准的企业级商业软件采购部署。其中最显著的机构合作涉及具有明确落地要求的主权国家与高校学术伙伴关系。


              阿拉伯联合酋长国是Colossal已公开的最大主权合作伙伴，于2026年2月承诺出资$60
              million，用于资助BioVault遗传样本库建设，并在中东地区保护项目中部署专用基因组学软件。转到学术与区域生态保护，塔斯马尼亚大学于2026年6月与Colossal及其非营利保护机构Colossal
              Foundation达成合作，应用基因组测序与抗病基因编辑技术，保护濒危的塔斯马尼亚恶魔（袋獾）免受传染性袋獾面部肿瘤病的侵害。


              在北美地区，Colossal与包括曼丹、希达察和阿里卡拉（MHA）国家主席Mark
              Fox在内的原住民部落领袖签署了文化与生态管护协议，聚焦生态修复与具有重要文化意义的物种保护。尽管这些合作验证了Colossal的技术信誉与社会运营许可，但其本质属于非稀释性科研赞助与慈善性质的落地项目，而非具备标准软件高毛利的具可复制性商业合同。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
