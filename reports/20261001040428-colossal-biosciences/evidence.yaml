evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-liquidation-waterfall
    missingEvidence: >-
      Full capitalization table disclosing senior liquidation preference multiples, participation rights, and protective
      provisions across Series A, B, and C rounds.
    whyItMatters: >-
      Without the liquidation preference waterfall, common share recovery and net economic returns cannot be modeled
      under intermediate exit valuations.
    diligencePath: >-
      Request confidential cap table disclosures, Series C investor agreements, and shareholder rights agreements via
      institutional data room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-revenue-and-spinout-equity
    missingEvidence: >-
      Audited financial statements detailing revenue composition from U.S. government contracts, UAE partnerships, and
      retained equity percentages in spinouts Form Bio and Astromech.
    whyItMatters: >-
      Determining whether Colossal can sustain its burn rate through commercial platform revenues or remains entirely
      dependent on external equity financings.
    diligencePath: >-
      Obtain corporate financial statements and audited spinout equity schedules through confidential investor due
      diligence.
    relatedTableRefs:
      - TO001
      - TO002
  - type: missing-source
    severity: material
    topic: biodiversity-credit-market-structure
    missingEvidence: >-
      Empirical pricing data, trading volume records, and standardized accreditation registries for tradeable
      biodiversity credit contracts.
    whyItMatters: >-
      Management's hundred-billion-dollar addressable market narrative relies on biodiversity credits to monetize
      rewilded habitats, but without formalized regulatory frameworks, revenue models remain entirely theoretical.
    diligencePath: >-
      Review emerging voluntary biodiversity credit pilot registries (e.g., Taskforce on Nature-related Financial
      Disclosures and Verra frameworks) and evaluate sovereign offtake commitments.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: viagen-pets-commercial-financials
    missingEvidence: >-
      Audited financial statements and unit-level revenue breakdowns for acquired animal cloning subsidiary ViaGen Pets
      and Equine.
    whyItMatters: >-
