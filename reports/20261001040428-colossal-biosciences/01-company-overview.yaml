company:
  name: Colossal Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Colossal Biosciences is a Dallas-based de-extinction and genomics platform founded in September 2021 by Ben Lamm and
    George Church that reached a $10.2B valuation following its January 2025 Series C led by TWG Global. While the
    company has announced active revival projects for the woolly mammoth, thylacine, dodo, and dire wolf, it has not yet
    completed a species revival and is reportedly seeking up to $30B in fresh private capital. Commercial monetization
    currently relies on government conservation technology contracts, a $60M UAE partnership, and venture spinouts
    including Astromech and Form Bio.
sections:
  - id: corporate-identity-and-founding
    title: Corporate Identity and Founding Mission
    body: >-
      Colossal Biosciences is a privately held biotechnology and genetic engineering company established in September
      2021 by serial entrepreneur Ben Lamm and renowned Harvard Medical School geneticist Dr. George Church.
      Headquartered in Dallas, Texas, the company operates across an intersection of synthetic biology, genomics, and
      cellular engineering. Colossal defines its foundational mission as de-extinction—the resurrection and ecological
      reintroduction of extinct species, beginning with the woolly mammoth, thylacine (Tasmanian tiger), dodo bird, and
      dire wolf. The company pairs this ambitious conservation mission with a commercial platform business model,
      developing underlying genetic engineering toolkits, computational biology architectures, and artificial womb
      hardware that can be monetized across human health and livestock applications. Colossal reached late-stage private
      status within four years of founding, establishing operations across major research facilities in Texas,
      Massachusetts, and Australia while maintaining collaborative research agreements with sixteen academic
      institutions globally.
    claimRefs:
      - CO001
      - CO002
      - CO009
      - CO014
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership Structure and Governance Dynamics
    body: >-
      Colossal executive governance is anchored by Chief Executive Officer Ben Lamm, a serial technology entrepreneur
      who previously completed five successful venture exits across consumer software, digital media, and artificial
      intelligence ventures. Scientific strategy and genomics research are directed by co-founder Dr. George Church,
      whose foundational breakthroughs in CRISPR gene editing and synthetic biology provide the venture with unmatched
      academic authority. The executive bench further includes Chief Operating Officer Adam Milne, who brings nearly
      three decades of operational leadership from global biopharmaceutical leaders including Pfizer and BioLabs, and
      Chief Science Officer Dr. Beth Shapiro, an internationally recognized paleogenomicist and MacArthur Fellow leading
      ancient DNA reconstruction and avian genome engineering. The company organizational profile introduces notable
      key-person dependence: corporate fundraising momentum, sovereign negotiations, and venture spinouts rely heavily
      on Lamm executive network, while institutional scientific credibility remains tethered to Church ongoing academic
      prestige and patents.
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO010
    tableRefs:
      - TO002
  - id: capitalization-and-valuation-trajectory
    title: Capitalization History and Valuation Trajectory
    body: >-
      Colossal Biosciences has charted one of the steepest private valuation trajectories in biotechnology history.
      After securing a $15 million seed financing in late 2021 and a $60 million Series A in early 2022, the company
      completed a $150 million Series B funding round in January 2023 led by the US Innovative Technology Fund,
      attaining unicorn status at an enterprise valuation exceeding $1 billion. In January 2025, Colossal closed a $200
      million Series C financing round led by TWG Global—an investment firm established by Guggenheim Partners CEO Mark
      Walter and Legendary Entertainment founder Thomas Tull—elevating total capital raised to $435 million and
      establishing an official valuation of $10.2 billion as Texas first decacorn startup. By July 2026, financial press
      reported that Colossal entered early negotiations to raise fresh equity at a targeted valuation between $20
      billion and $30 billion. The company diverse capital base incorporates institutional venture firms, intelligence
      and national security funds including In-Q-Tel, sovereign investors, and notable high-net-worth angel syndicate
      backers.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO003
  - id: operational-scale-milestones-and-commercial-traction
    title: Operational Scale, Milestones, and Commercial Execution
    body: >-
      Colossal physical infrastructure centers on a 55,000-square-foot corporate headquarters and laboratory facility in
      Dallas, Texas, supplemented by specialized research outposts in Boston, Massachusetts, and Melbourne, Australia.
      The company employs more than 170 scientists and retains an advisory council of over 95 scientific and
      conservation specialists. While Colossal has reported technical progress—including the derivation of Asian
      elephant induced pluripotent stem cells (iPSCs) and engineered dire wolf cellular edits—the company has not yet
      revived a single extinct animal species, leaving its headline de-extinction milestone targets speculative ahead of
      a projected 2028 woolly mammoth delivery window. Commercial traction has consequently advanced through dual
      channels: direct government conservation technology licensing alongside a $60 million UAE partnership, and
      corporate spinouts that commercialize platform innovations. Spun-out entities include computational biology
      platform Form Bio ($30 million raised) and predictive AI biology venture Astromech, which achieved a $2 billion
      independent private valuation in March 2026.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
