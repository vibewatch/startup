callouts:
  - calloutType: risk
    title: Valuation Decoupling from Biological Milestones
    body: >-
      While Colossal has demonstrated exceptional fundraising capability and spun out viable software and materials
      ventures, its multi-billion-dollar valuation remains largely detached from its primary scientific mission. With
      zero revived species delivered and the first woolly mammoth calf not targeted until 2028 at earliest, public
      valuation discussions reaching $20B–$30B invite significant repricing risk if developmental delays or regulatory
      bans materialize.
    claimRefs:
      - CO006
      - CO008
      - CO013
  - calloutType: insight
    title: Platform Spinoffs as the True Economic Foundation
    body: >-
      Colossal operates less like a single biotech company and more like a high-concept venture studio. Technologies
      developed under the guise of de-extinction—such as computational biology (Form Bio, $30M raised) and AI predictive
      modeling (Astromech, valued at $2B)—provide tangible commercial assets and downside protection that traditional
      single-asset therapeutics companies lack.
    claimRefs:
      - CO011
      - CO012
