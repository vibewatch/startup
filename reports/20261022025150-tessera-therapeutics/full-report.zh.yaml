            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 情景、可比公司与论点破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要首次人体数据确认可耐受性、有意义的目标细胞递送、持久编辑和商业可行的制造流程；届时价值可能高于历史标记，但没有公开证据支持目标价格或概率。基准情景是技术前景可观但资本密集的私营生物科技公司，其公开参考点横跨
              Forge 的 $668.33M 估算和 Multiples 的 $1.7B 历史标记；这个区间是证据边界，不是公允价值区间。悲观情景是安全性、递送、疗效、监管或融资失败，导致价值低于 Forge
              估算或出现严重减值。商业上市公司的收入倍数不能直接与这一临床前阶段证据比较。Forge 还报告市场交易有限，且没有公司认可的 IPO
              计划，这降低了对近期流动性的信心。决定性尽调问题是当前现金与烧钱速度、完整所有权和优先权条款、已签署的 Regeneron
              经济安排、人体试验数据，以及独立的递送和脱靶审查。人体药效动力学较弱、临床暂停、无法资助下一次读数，或存在未披露且优先级明显更高的权利，都会打破投资论点。
            claimRefs:
