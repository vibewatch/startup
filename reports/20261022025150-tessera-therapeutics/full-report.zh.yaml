            body: >-
              Tessera 已披露的使用者主要是内部湿实验和计算生物学团队、合作方及潜在治疗开发伙伴，而不是付费终端客户。Quilt 的案例研究称，Tessera 的科学数据超过 1
              petabyte，由湿实验科学家和计算生物学家共享；测序仪器、外部合作方和湿实验仪器共同为流程提供数据。这直接证明了运营中的使用者基础，但不能证明外部软件收入或患者采用。治疗平台还形成第二类群体：生物制药合作方可以提供疾病项目、资本、开发能力或商业化触达，不过可访问的保留来源没有指出任何独立交易的治疗客户，也没有披露合作经济。Fierce
              Biotech 报道的临床前应用最终受益者是患者，但本组来源没有证明接受治疗的患者数量、报销或商业需求。这一分群意味着近期价值通过平台验证创造，而持久的合作伙伴和支付方证据仍是未来的临床与商业里程碑。
