        title: 展示材料
        blocks:
          - type: callout
            title: 决策
            body: 值得继续研究。证据支持关注该平台，但不足以支持不计价格买入：估值标记既已过时，方法也不一致；同时临床、现金、稀释、优先权和流动性输入仍不完整。
            calloutType: recommendation
            claimRefs:
              - CV006
