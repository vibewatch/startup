  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 历史融资和临床前证据还要经过相互冲突的估值标记与流动性限制，最终只能给出继续研究的建议。
    data:
      nodes:
        - id: scale
          label: 历史融资
          detail: 报道称，截至 2022 年 Series C，15 个月内融资超过 $500M
        - id: proof
          label: 临床前证明
          detail: 独立报道描述，一次灵长类动物注射后编辑率最高达 35%
        - id: marks
          label: 相互冲突的估值
          detail: Multiples 显示 2022 年估值为 $1.7B，而 Forge 显示 2025 年为 $668.33M
        - id: terms
          label: 优先权审查
          detail: Forge 显示 1.0x 优先权和 6% 累计股息
        - id: diligence
          label: 所需尽调
          detail: 股权结构表、现金跑道、合作伙伴经济条件和试验数据
        - id: recommendation
          label: 继续研究
          detail: 持续跟踪，直到价格和临床证据足以支持投资判断
      edges:
        - - scale
          - proof
        - - proof
          - marks
        - - marks
          - terms
        - - terms
          - diligence
        - - diligence
          - recommendation
