      - number: '3.3'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Tessera 的潜在壁垒来自整合式发现与递送技术栈，而非单一编辑反应。公司 2022 年融资材料称，其评估了数万种天然和合成移动遗传元件；Flagship
              的叙述则介绍了专有脂质纳米颗粒平台。这可能在载荷设计、组织靶向、制造和临床开发之间形成学习效应。同一证据也突出了替代风险：AAV 和 CRISPR 拥有广泛的临床生态、成熟的开发经验和大量项目；尽管
              TSRA-196 已列入 1/2 期，Tessera 的比较性表现证据仍处于临床前阶段或源自公司。要形成持久优势，必须反复证明人体安全性、疗效、递送能力和可制造性；这些证明在本组来源中仍是开放问题。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 技术差异化清晰，但商业价值尚未证明
            body: 该平台提出能够在不受同等核酸酶或病毒载体约束的情况下写入更长序列，因此具有技术差异化；但公开证据尚未显示这种能力能转化为更优临床结果或更低交付成本。
            calloutType: insight
            claimRefs:
              - CP003
              - CP006
              - CP011
              - CP013
          - type: callout
            title: 在位生态风险
            body: AAV 和 CRISPR 的成熟生态使发起方的切换门槛很高，除非 Tessera 能在载荷、给药、组织可达性、安全性或制造环节证明具有临床意义的优势。
