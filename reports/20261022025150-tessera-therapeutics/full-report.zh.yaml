          - type: paragraph
            body: >-
              即使基因写入化学在选定模型中有效，递送和流程控制仍是重要执行风险。Flagship 将脂质纳米颗粒描述为 Tessera 的体内 RNA 递送平台；Fierce Biotech 报道称，在一项实验中，非人灵长类
              T 细胞的报告基因递送率约为 35% 至 50%。这一报告基因结果不能证明治疗性 Gene Writer 的递送。GEN Edge
              描述了使用计算候选筛选、人体细胞测试及效率、特异性和保真度测量的发现流程；Tessera 一名高管则表示，公司开始投入治疗开发和制造团队。分配到的来源不包含 GMP
              文件包。应监测目标细胞暴露、剂量反应、批次放行、收率、可比性和临床供应连续性。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 合作伙伴、资本与模式依赖
        blocks:
          - type: paragraph
            body: >-
              Tessera 的融资历史降低了但没有消除资金风险。GlobalGenes 报道了 $230 million 的 Series B，随后是超过 $300 million 的 Series C；Fobi
              列出的总融资额为 $530 million。这些指标描述的是融资额，不是可用现金或资金期限。Series C 公告称，所得资金将支持平台和多个治疗项目，意味着资本配置负担较广。依赖风险也延伸至
              Flagship：Flagship 创立了 Tessera，并据一家联合发布的公司公告称，向 Tessera 授权了一组覆盖 RNA 和 DNA Gene Writing
              的知识产权。尽调应取得当前现金、烧钱速度、按临床情景划分的资金期限、供应商集中度、许可条款和制造备用方案。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
