figures:
  - id: FO001
    title: Tessera 里程碑时间线
    summary: 公开记录的里程碑显示，平台从 Flagship 发起的组建阶段逐步进入临床，并在 2026 年完成领导层交接。
    type: timeline
    data:
      items:
        - date: '2017'
          label: Flagship Labs 开始探索
          details: Flagship 科学家 Geoffrey von Maltzahn、Jacob Rubens 和 Rob Citorik 等开始探索 DNA 切割之外的方案。
          tone: neutral
          claimRefs:
            - CO008
        - date: '2018'
          label: Tessera 成立
          details: Flagship Pioneering 成立 Tessera Therapeutics，专注于 Gene Writing 药物。
          tone: positive
          claimRefs:
            - CO001
            - CO008
        - date: 2020-07
          label: 公司走出隐身期
          details: Flagship 和 Tessera 公开介绍了基于可移动遗传元件的 Gene Writing。
          tone: positive
          claimRefs:
            - CO008
        - date: 2021-01
          label: Series B 融资
          details: 独立报道称 Series B 融资超过 $230M。
          tone: positive
          claimRefs:
            - CO011
        - date: 2022-04
          label: Series C 融资
          details: Tessera 宣布 Series C 融资超过 $300M。
          tone: positive
          claimRefs:
            - CO012
        - date: 2023-01
          label: 临床前平台数据发布
          details: 报道介绍了人细胞、小鼠和非人灵长类数据，包括基因写入和递送实验。
          tone: neutral
          claimRefs:
            - CO005
        - date: 2026-02
          label: TSRA-196 获 FDA 认定
          details: 报道称 TSRA-196 获得 Fast Track 和 Orphan Drug 认定。
          tone: positive
          claimRefs:
            - CO003
        - date: '2026-07-23'
          label: CEO 交接
          details: Joseph Romanelli 接任总裁兼 CEO，接替 Michael Severino。
          tone: neutral
          claimRefs:
            - CO006
            - CO007
        - date: '2026-10-22'
          label: 临床阶段管线
          details: 指定报道描述 TSRA-196 处于 Phase 1/2，另有镰状细胞病和体内 CAR-T 项目。
          tone: neutral
          claimRefs:
            - CO004
            - CO015
