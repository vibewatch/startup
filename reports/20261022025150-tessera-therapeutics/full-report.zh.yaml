              - CR016
      - number: '7.4'
        title: 监测计划与论点破裂触发因素
        blocks:
          - type: paragraph
            body: >-
              风险态势应根据可观察的里程碑监测，而不是泛泛的生物科技情绪。近期指标包括队列给药、不良事件和剂量递增披露、药效学证据、目标细胞递送，以及首次人体读数的时间和质量。运营指标包括制造准备度、批次一致性、放行规格和临床供应连续性。财务指标包括相对于下一数据事件的现金期限，以及任何新融资的条款。如果主要项目在没有可信解释的情况下严重延期、出现不可接受的安全性或目标结合不足、无法稳定制造，或在有意义的临床读数前需要惩罚性融资，投资论点就会破裂。公开证据尚未消除这些风险。
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 主要论点破裂事件
            body: 投资论点最容易受到首次人体安全性、目标结合和持久性的冲击。临床暂停、不可接受的剂量限制性毒性，或在可耐受剂量下靶向写入不足，都会使当前从平台走向临床的叙事失效。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: 证据边界
            body: 融资公告和平台演示显示了资源与技术意图，但不能证明当前现金期限、临床疗效、监管接受度或制造准备度。
            calloutType: assumption
            claimRefs:
