            body: >-
              Tessera 于 2022 年 4 月宣布完成超过 $300 million 的 Series C 融资，参与方包括 ADIA、Alaska Permanent Fund
              Corporation、SoftBank Vision Fund 2、由 T. Rowe Price 提供投资建议的基金、Flagship Pioneering 及其他现有机构投资者。独立的 2021 年报道另称
              Series B 融资超过 $230 million，因此两轮已披露融资合计构成超过 $530 million
              的算术下限；这是历史融资额，不是当前可用现金。两份来源都没有披露投后估值、现金余额、烧钱速度或资金可支撑时间。当前公司发布的材料确认 TSRA-196 与 Regeneron
