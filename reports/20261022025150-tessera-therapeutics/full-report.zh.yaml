              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              乐观情景是：平台拥有广泛的基因组目标、充足的历史支持和明确的临床前信号。Tessera 2022 年融资公告称，该平台计划通过 RNA 递送实现碱基改变、插入或删除以及完整基因写入；Fierce Biotech
              则报道，非人灵长类动物单次注射后的编辑率最高达
              35%。如果人体安全性、持久性、递送和制造能够转化，这些数据可能支撑有价值的治疗和合作期权。反论点是，审阅到的阶段证据仍属临床前，而不同市场数据提供商的融资记录彼此不一致。公开来源还没有量化当前现金、烧钱速度、所有权和完整优先权经济条款。因此，投资者面临集中的临床、监管、融资和流动性风险。要作出正面的投资判断，既需要有理据的入场价格，也需要能够显著降低平台二元开发风险的人体证据。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV015
              - CV016
