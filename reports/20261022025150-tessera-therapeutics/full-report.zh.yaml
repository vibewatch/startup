      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Tessera 于 2022 年 4 月宣布完成超过 $300M 的 Series C 融资；Fierce Biotech 报道称，截至当时公司 15 个月内累计融资超过 $500M。Multiples
              将该轮融资与 $1.7B 估值联系起来。相比之下，Forge 展示了 2025 年 12 月 Series D 的 $668.33M 投后估值，并列出 1.0x 清算优先权和 6%
              累计股息等条款。跨来源标记暗示后一个参考值约低 61%，但由于发布者使用的来源基础不同，且 Forge
              声明不提供审计或独立验证，这一算术不能证明存在直接可比的下行轮。各提供商对累计融资额也有分歧；Multiples 还报告了包含潜在里程碑在内的 Regeneron
              战略对价。融资额不是可用现金，里程碑池不是已实现所得，私募投后估值也不是退出价格。因此，在将任一公开标记用作公允价值前，入场纪律要求取得原始融资文件、股权结构瀑布表，以及支撑到下一次临床读数的资金期限。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
