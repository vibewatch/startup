              Flagship 2026 年公告称，Joseph Romanelli 于 2026 年 7 月 23 日出任总裁兼首席执行官，接替自 2022 年 6 月起领导 Tessera 的 Michael
              Severino。公告同时称，Romanelli 加入 Tessera 董事会，并以 CEO-Partner 身份加入 Flagship；Geoffrey von Maltzahn 继续担任联合创始人、董事长和
              Flagship 普通合伙人。创始叙述称，von Maltzahn、Jacob Rubens 和 Rob Citorik 是 2017 年启动 Flagship Labs 探索的科学家之一；公司称 Tessera
              于 2018 年成立。Romanelli 在 Merck 工作近 30 年，曾负责覆盖 75 个市场的国际人类健康业务；较早的技术报道则将 Rubens 列为联合创始人兼首席科学官，将 Cecilia
              Cotta-Ramusino 列为技术开发负责人。公开记录因此覆盖了商业、科学和平台领导层，但没有提供完整董事名单、委员会架构、继任计划或关键人员风险缓释方案。
