      - number: '5.2'
        title: 架构与成熟度
        blocks:
          - type: paragraph
            body: >-
              该架构由三层相连。第一，Tessera 挖掘并改造移动遗传元件，使其成为使用逆转录或整合机制的 Gene Writer；第二，RNA 或 DNA
              模板规定载荷或目标序列变化；第三，脂质纳米颗粒或其他非病毒载体将组件递送至目标细胞。外部技术报道称，公司在 452 个真核生物物种中调查了 9,559 个逆转录元件，筛选了 406 个重建候选，并选出
              Vingi-1_Acar 进一步开发。临床前演示覆盖人类细胞、人源化小鼠和非人灵长类动物；TSRA-196 合作是最清晰的临床开发转折点。因此，成熟度属于平台到候选药物，而非已验证的商业基础设施：公开材料无法证明
              GMP 规模、可重复的制造收率、临床级放行规格或完整的整合控制策略。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
