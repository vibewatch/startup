          - type: callout
            title: 主要估值风险
            body: 如果所得资金、里程碑付款、清算优先权、二级流动性和当前现金没有对账，私募融资标题可能高估可投资价值。应将 $1.7B 和 $668.33M 都视为有来源归属的参考点，而非已验证的公允价值。
            calloutType: risk
            claimRefs:
              - CV005
