chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与阶段
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics 由 Flagship Pioneering 于 2018 年创立，自称是一家处于临床阶段的生物科技公司，开发用于体内基因药物的 Gene Writing
              和递送平台。公司称，该平台使用全 RNA 构建体和以靶标为引物的逆转录，可改变一个或多个碱基对、插入外显子长度的序列，或加入完整基因；其专有脂质纳米颗粒平台则用于将 RNA
              递送至目标细胞类型。这些是公司及创始人发布的描述，并非经过独立验证的临床表现主张。独立报道将该技术描述为受到移动遗传元件启发，并称其已在人类细胞、小鼠和非人灵长类动物中开展临床前工作。主要临床资产
              TSRA-196 正与 Regeneron 合作开发，用于治疗 α1-抗胰蛋白酶缺乏症；分配到的临床更新显示，这是一项单次给药、开放标签、多国参与的 1/2
              期研究。现有证据支持公司从平台和临床前开发转向临床阶段执行，但保留来源未披露任何临床疗效或安全性结果。
