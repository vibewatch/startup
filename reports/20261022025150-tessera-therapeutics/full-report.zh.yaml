    data:
      nodes:
        - id: external-capital
          label: 外部资本
          detail: 股权融资轮和最高 $41.3M 的奖励资助了业务，但不是经常性产品收入。
        - id: platform-rd
          label: 平台研发
          detail: Gene Writing 发现覆盖广泛的潜在疾病应用。
        - id: delivery-cmc
          label: 递送与制造
          detail: 专有脂质纳米颗粒递送和制造能力需要单独投资。
        - id: preclinical
          label: 临床前项目
          detail: 第三方管线数据列出 4 个临床前项目。
        - id: clinical
          label: Phase 1/2 TSRA-196
          detail: 公司称正与 Regeneron 共同开发一项进行中的首次人体试验。
        - id: commercial
          label: 潜在商业经济性
          detail: 获批、定价、合同对价、收入确认和毛利尚未确定。
      edges:
        - source: external-capital
          target: platform-rd
          label: 资助
        - source: platform-rd
          target: delivery-cmc
          label: 需要
        - source: delivery-cmc
          target: preclinical
          label: 促成
        - source: preclinical
          target: clinical
          label: 推进
        - source: clinical
          target: commercial
          label: 条件性路径
    approximationNotes: 概念性依赖流程；不代表金额、概率、时间、转化率或累计财务桥接。
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI012
      - CI013
      - CI014
      - CI015
  - id: FE001
    title: Gene Writing 产品架构图
    type: stack
    summary: Tessera 的公开技术可理解为从发现到递送的技术栈，每一层都需要临床控制。
    data:
      layers:
        - name: Discovery engine
          label: 发现引擎
          detail: 公开描述的可移动遗传元件搜索与工程化流程。
          items:
            - label: MGE 挖掘
              detail: 报道研究调查了 452 个真核物种中的 9,559 个逆转录元件。
            - label: 候选筛选
              detail: 研究筛选了 406 个重构候选元件在人体细胞中的活性。
        - name: Gene Writer
          label: Gene Writer
          detail: 用于写入或重写基因组序列的工程化分子机制。
          items:
            - label: RNA Gene Writer
              detail: 使用 Gene Writer 机制和 RNA 模板改变序列或实现持久插入。
            - label: DNA Gene Writer
              detail: 被描述为可将更大的 DNA 载荷写入基因组。
        - name: Template and payload
          label: 模板与载荷
          detail: 携带目标编辑或治疗载荷的 RNA 或 DNA 指令。
          items:
            - label: 序列修正
              detail: 碱基对替换、插入和缺失被描述为平台目标。
            - label: 基因或外显子载荷
              detail: 外显子长度序列和完整基因添加被描述为平台目标。
        - name: Delivery
          label: 递送
          detail: 用于在体内抵达细胞的脂质纳米颗粒和靶向递送层。
          items:
            - label: 脂质纳米颗粒
              detail: 报道的体内演示使用非病毒 RNA 递送。
            - label: 靶向 LNP
              detail: tLNP 被用于在人源化小鼠中生成 CAR-T 细胞。
        - name: Development control
          label: 开发控制
          detail: 实现转化所需的临床候选物、安全性、持久性和制造证据。
          items:
            - label: TSRA-196
              detail: 已合作的 AATD 项目，计划一次性修正 SERPINA1。
            - label: 安全性与持久性
              detail: 人体整合位点安全性、临床持久性和长期基因毒性仍待解决。
        - name: Clinical validation
          label: 临床验证
          detail: 患者层面的证据是尚未解决的最终转化层。
          items:
            - label: 首次人体证据
              detail: 指定来源中没有 TSRA-196 的临床安全性、药效学和持久性数据。
    approximationNotes: 该技术栈是对公开描述的结构化呈现；不代表每一层都已具备生产条件，也不代表各层组成经过验证的商业供应链。
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE012
      - CE014
  - id: FU001
    title: 从科研使用到医保报销治疗的客户旅程
    type: journey-map
    summary: 该图将已观察到的内部平台使用，与未来的合作、临床和支付方里程碑区分开来。
    data:
      nodes:
        - id: internal-data
          label: 内部科研团队
          title: Operational data user
          detail: 湿实验和计算团队围绕超过 1 PB 的科研数据使用 Quilt、Nextflow、Dagster、S3、IAM 和 OpenSearch。
          claimRefs:
            - CU001
            - CU005
        - id: platform-program
          label: 治疗项目
          title: Preclinical or early clinical development
          detail: 已描述 PKU、镰状细胞病、CAR-T 及其他 Gene Writing 应用，并报告了临床前性能指标。
          claimRefs:
            - CU006
            - CU007
        - id: strategic-partner
          label: 潜在合作方
          title: Partner validation and co-development
          detail: 可访问的留存来源中，没有任何来源识别出独立交易的治疗客户，也没有确定合作经济性和部署范围。
          claimRefs:
            - CU012
        - id: clinical-payer
          label: 临床服务提供方与支付方
          title: Future treated-patient pathway
          detail: 监管、入组、报销和持久患者结局证据仍待补齐。
          claimRefs:
            - CU003
            - CU004
        - id: clinical-proof
          label: 临床证据
          title: Clinical validation milestone
          detail: 评估支付方采用前，需要临床安全性、疗效、入组和持久性证据。
          claimRefs:
            - CU003
            - CU004
        - id: payer-proof
          label: 支付方证据
          title: Reimbursement and repeat-use milestone
          detail: 指定来源中没有任何来源确定报销、定价、续约或重复治疗。
          claimRefs:
            - CU003
            - CU004
    claimRefs:
      - CU001
      - CU005
      - CU009
      - CU012
