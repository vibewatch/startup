      - number: '3.2'
        title: 能力、买方与切换比较
        blocks:
          - type: paragraph
            body: >-
              Tessera 提出的差异化在于能力广度：既能改变碱基对，也能进行小片段插入或删除，还能写入完整基因；递送则依靠 RNA 和脂质纳米颗粒。最有力的公开表现信号仍来自早期实验室或动物结果，而非临床基准：Fierce
              报道，在非人灵长类 PKU 模型中，单次给药纠正率最高达 35%；在灵长类实验中，报告基因递送率约为 35% 至 50%；公司材料则将平台定位于肝脏、造血干细胞和 T
              细胞。这些数据不能直接与竞争者的临床终点比较。买方仍会权衡监管先例、制造可靠性、重复给药、组织可达性和持久获益证据。分配到的来源没有证明公开标价、实际折扣或逐患者成本的正面比较；这些单元应保持为未知，不应从融资额推断。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
