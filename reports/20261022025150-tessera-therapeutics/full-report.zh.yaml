        - 人体数据安全，并显示靶细胞编辑具有持久性；合作伙伴资本持续投入
        - 没有人体证据，超过历史 $1.7B 估值的价值判断仍无依据
        - 低至中等
        - 首次人体试验安全性和药效学读出积极
      - - 基准
        - 临床开发推进，但仍依赖数据和资本
        - $668.33M 至 $1.7B 是证据区间，不是公允价值区间
        - 中等
