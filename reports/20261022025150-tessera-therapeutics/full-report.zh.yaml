      - number: '2.3'
        title: 买方、采用路径与约束
        blocks:
          - type: paragraph
            body: >-
              经济买方会随阶段变化。早期平台和临床开发预算由生物科技发起方及战略制药合作伙伴控制；临床使用者是研究者和专科治疗中心；最终支付方可能是公共或私人医保计划，而患者和照护者承担治疗负担。Regeneron
              交易展示了一条合作路径：大型制药公司可以在 Tessera
              主导首次人体工作后，共享全球开发和商业化。采用触发因素包括持久纠正、降低治疗负担，以及能够到达相关组织的递送特征。约束同样重要：临床安全性、递送至目标细胞、制造规模、监管审查、报销证据，以及来自
              AAV、LNP/碱基编辑和 CRISPR 的竞争。临床前结果和公司描述证明的是技术假设，不是临床疗效或支付方的支付意愿。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 尽调含义
        blocks:
          - type: paragraph
            body: >-
              市场判断应被视为受证据约束的区间，而非单一 TAM。公开来源没有拆分 Tessera 的 SAM 或 SOM，没有披露治疗净价格，也没有提供市场预测覆盖地区内已验证的 AATD
              合资格患者数量。管线记录还存在登录限制，因此不应被解读为完整的竞争者或适应症清单。估值的核心问题是，Gene Writing
              能否将广泛的技术覆盖转化为可报销、可重复交付的临床产品。下一步尽调应取得按地区划分的患者漏斗、竞品定价和持续治疗数据、制造成本假设，以及关于安全性、持久性和目标细胞递送的临床证据。在此之前，市场只能支持战略期权价值，不能支持精确收入预测。
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 可投资市场窄于平台叙事
            body: AATD 疾病市场预测和 TSRA-196 合作提供了最清晰的商业锚点；在临床、支付方和制造证据公开前，更广泛的基因药物主张仍只是期权价值。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM015
          - type: callout
            title: 递送与报销可能限制采用
            body: 即使写入技术有明显差异化，也必须安全地到达正确细胞、扩大制造规模并获得支付方认可；当前公开证据尚未量化这些约束。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与类别
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不是一张基因编辑公司名单，而是包括使用 AAV 或逆转录病毒载体的病毒基因疗法在位者、CRISPR 等核酸酶编辑器、碱基编辑及其他精准编辑器、细胞疗法开发商，以及现有治疗。Flagship 将 AAV
              描述为主要的体内递送路径，并称有超过 175 项 AAV 基因疗法处于临床开发；其叙述还将 CRISPR、锌指核酸酶、TALEN、巨型核酸酶和 megaTAL 列为成熟编辑方法。Fierce Biotech
              报道称，Tessera 的 RNA 和 DNA Gene Writing 方法使用的分子机制不同于 CRISPR 和病毒载体疗法。Synapse 将 TSRA-196 列为 1/2
              期，将另外四个具名项目列为临床前，但分配到的来源没有人体结果数据。因此，竞争格局横跨成熟临床疗法、早期临床 Gene Writing 新进入者、新兴精准编辑器，以及生物制药发起方的自建或外购决策。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
