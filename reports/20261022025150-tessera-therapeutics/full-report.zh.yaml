            body: >-
              最有力的采用证据来自运营，而非商业。Quilt 报道，Tessera 的数据平台让实验和计算团队能够访问超过 1 petabyte 的科学数据，并提供元数据、质量控制指标、可视化和自动化流程。案例研究还提到
              Tessera 的数据平台负责人，并描述了在类似生产环境的流程中使用 Quilt、Nextflow、Dagster、Amazon S3、IAM 和 OpenSearch。另一方面，Fierce Biotech
              报道了 J.P. Morgan 期间展示的临床前证据：非人灵长类动物单次注射后，PKU 等位基因纠正率最高达 35%；接受治疗的镰状细胞患者细胞中正常血红蛋白生成率为 98%；小鼠 T 细胞中的报告基因递送率超过
              80%，灵长类动物中的递送率较低。截至该报道发表于 2023 年 1 月时，CEO 拒绝披露人体试验时间表。这些是项目开发产出，不是留存、续约或产品使用指标。分配到的来源没有提供
