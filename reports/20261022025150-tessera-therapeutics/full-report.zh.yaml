      - number: '5.3'
        title: 差异化与部署风险
        blocks:
          - type: paragraph
            body: >-
              差异化主张来自作用机制：Gene Writer 试图在不产生核酸酶编辑相关的双链断裂、也不依赖宿主 DNA 修复的情况下写入 DNA；全 RNA
              方法则可能将持久整合与非病毒递送结合起来。但该技术尚不是所有编辑方式的精准替代方案。近期技术叙述报告了广泛分布的整合、初步但效率较低的 TRAC 重新靶向，以及一个 CD19 CAR 模板 22.8%
              的功能性整合率。报告还称，在所测试条件下，六个诱导多能干细胞克隆中约 1%
              为非整倍体细胞，且没有发现大规模重排；同时明确指出，这些结果不能证明长期安全性。主要部署风险包括组织靶向、剂量、不完整或截短的整合、脱靶或插入效应、免疫反应，以及人源化小鼠表现与患者之间的差距。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
      - number: '5.4'
        title: 路线图、控制与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Tessera 的路线图体现在从平台发现走向治疗项目的进展中：用于序列改写和持久插入的 RNA Gene Writer、用于更大载荷的 DNA Gene Writer、体内工程化细胞概念，以及作为合作方 AATD
              主要项目的 TSRA-196。Regeneron 表示，Tessera 将主导最初的首次人体试验，Regeneron
              则主导后续全球开发和商业化；这提供了开发和监管能力，但也使项目依赖合作伙伴并需要共同执行。由于这是生物治疗平台而非企业软件产品，公开来源没有提供完整的安全、隐私、质量体系或制造控制档案。投资判断是：技术上有差异化且具有临床重要性，但仍受证据约束；尽调应优先关注临床安全性、整合位点数据、效力与放行检测、递送分布、制造可比性，以及权利义务的精确划分。
            claimRefs:
              - CE012
              - CE013
              - CE014
