  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不是所有生物科技，也不是所有基因编辑，而是永久改变体细胞的基因药物开发及最终商业化；近期边界集中在罕见单基因疾病项目和递送平台。Tessera 自己将 Gene Writing
              与两大成熟支柱并列：病毒基因疗法和基于核酸酶的基因编辑。因此，实际纳入的支出包括治疗性研发、临床开发、制造、递送，以及最终针对需要持久序列插入或改写的项目的治疗报销。近期可服务市场不包括仅用于发现的工具、非治疗性基因组工程，以及
              Tessera 作为未来可能性讨论但尚未披露为商业项目的广泛常见病应用。AATD 的现状治疗仍是每周一次的血浆来源 AAT 补充；体外细胞疗法，以及 AAV 或 LNP 递送的编辑则是替代疗法。这一边界使
              $1.2 billion 的 AATD 估算比笼统的“基因药物”TAM 更有决策价值，但无法证明 Tessera 可获得的市场份额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 多种市场规模视角及其不能证明的事项
        blocks:
          - type: paragraph
            body: >-
              最有力的公开市场数字来自 PackGene 转引的 GlobalData 预测：美国和德国的 AATD 市场在 2023 年估值为 $1.2 billion，预计到 2031 年达到 $3.48
              billion，CAGR 为 11.2%。这是疾病市场视角，不是 Gene Writing 市场或 Tessera 收入预测。第二个视角是合作经济：Regeneron 与 Tessera 宣布，TSRA-196
              的合作金额最高可达 $275 million，其中包括 $150 million 的预付款和股权，以及最高 $125 million
              的里程碑款；双方均摊成本，并计划分享利润。交易金额说明战略方愿意为项目提供资金，但融资额不是市场收入，里程碑也不是今天可用的现金。第三个视角是平台广度：公开管线记录列出 TSRA-196 处于 1/2
              期，另有四个临床前项目，但管线数量不等于可治疗市场价值。这些视角支持受约束的机会判断，同时全球患病率、符合条件的患者、净价格和实际采用率仍未量化。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
