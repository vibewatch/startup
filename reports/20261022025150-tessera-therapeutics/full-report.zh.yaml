  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台与客户流程
        blocks:
          - type: paragraph
            body: >-
              Tessera 的产品是治疗平台，而不是软件 SKU：它将 Gene Writer 分子载荷、递送载体和适应症专属的基因模板组合起来。预期流程是识别致病序列或治疗性细胞状态，选择 RNA 或 DNA
              模板的写入器，将组件封装后递送至目标组织，在可行时进行体内给药，并验证最终的基因组编辑和临床表型。公司及合作伙伴的描述涵盖碱基对改变、小片段插入或删除、外显子长度序列和完整基因加入；Regeneron
              项目则将近期临床用途收窄为一次性静脉治疗，旨在纠正 AATD 中的 SERPINA1。这对生物制药合作方或临床开发者而言是可信的客户流程，但不能证明每种载荷或组织都能部署。
            claimRefs:
              - CE001
              - CE002
              - CE003
