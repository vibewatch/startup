company:
  name: Tessera Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: Tessera is developing Gene Writing, an engineered-mobile-genetic-element platform intended to make durable genomic changes with RNA or DNA templates and non-viral delivery. Public evidence now includes a peer-reviewed-style report of all-RNA gene writing and in-vivo CAR-T generation in humanized mice, plus a partner-described TSRA-196 program, but long-term human safety, tissue breadth, integration precision, and clinical performance remain unproven.
sections:
  - id: platform-and-user-workflow
    title: Platform and customer workflow
    body: >-
      Tessera's product is a therapeutic platform rather than a software SKU: it combines a
      Gene Writer molecular payload with a delivery vehicle and an indication-specific genetic
      template. The intended workflow is to identify a pathogenic sequence or therapeutic cell
      state, choose an RNA- or DNA-templated writer, package the components for a target tissue,
      administer them in vivo where feasible, and verify the resulting genomic edit and clinical
      phenotype. Company and partner descriptions cover base-pair changes, small insertions or
      deletions, exon-length sequences, and whole-gene additions, while the Regeneron program
      narrows the near-term clinical use case to a one-time intravenous treatment intended to
      correct SERPINA1 in AATD. This is a credible customer workflow for a biotech partner or
      clinical developer, but it is not evidence that every payload or tissue is deployable.
    claimRefs: [CE001, CE002, CE003]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: >-
      The architecture has three linked layers. First, Tessera mines and engineers mobile
      genetic elements into Gene Writers that use reverse-transcription or integration
      machinery; second, an RNA or DNA template specifies the cargo or intended sequence
      change; third, lipid nanoparticles or another non-viral vehicle deliver the components
      to the target cell. External technical reporting describes 9,559 retroelements surveyed
      across 452 eukaryotic species, 406 reconstructed candidates screened, and selection of
      Vingi-1_Acar for further development. Preclinical demonstrations span human cells,
      humanized mice, and nonhuman primates, while the TSRA-196 collaboration is the clearest
      transition toward clinical development. The maturity is therefore platform-to-candidate,
      not validated commercial infrastructure: public materials do not establish GMP scale,
      repeatable manufacturing yields, clinical-grade release specifications, or a complete
      integration-control strategy.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-deployment-risk
    title: Differentiation and deployment risk
    body: >-
      The differentiation claim is mechanistic: Gene Writers seek to write DNA without the
      double-strand breaks and host DNA-repair dependence associated with nuclease editing, and
      the all-RNA approach could combine durable integration with non-viral delivery. The
      technology is not yet a precision substitute for every editing modality. The recent
      technical account reports broadly distributed integration, preliminary but low-efficiency
      TRAC retargeting, and 22.8% functional integrations for one CD19 CAR template. It also
      reports approximately 1% aneuploid cells and no large rearrangements in six analyzed
      induced-pluripotent-stem-cell clones under the tested conditions, while explicitly noting
      that these results do not establish long-term safety. The main deployment risks are
      tissue targeting, dose, incomplete or truncated integrations, off-target or insertional
      effects, immune response, and the gap between humanized-mouse performance and patients.
    claimRefs: [CE008, CE009, CE010, CE011, CE015]
  - id: roadmap-and-diligence-verdict
    title: Roadmap, controls, and diligence verdict
    body: >-
      Tessera's roadmap is visible in the progression from platform discovery to therapeutic
      programs: RNA Gene Writers for sequence rewriting and durable insertion, DNA Gene Writers
      for larger payloads, in-vivo engineered-cell concepts, and TSRA-196 as the partnered AATD
      lead. Regeneron says Tessera will lead the initial first-in-human trial while Regeneron
      leads later global development and commercialization, which supplies development and
      regulatory capabilities but also makes the program dependent on a partner and shared
      execution. Public sources do not provide a complete security, privacy, quality-system, or
      manufacturing-control dossier because this is a biological therapeutic platform rather
      than an enterprise software product. The underwriting verdict is technically differentiated
      and clinically consequential, but still evidence-constrained: diligence should prioritize
      clinical safety, integration-site data, potency and release assays, delivery biodistribution,
      manufacturing comparability, and the precise division of rights and obligations.
    claimRefs: [CE012, CE013, CE014]
