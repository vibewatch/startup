callouts:
  - calloutType: insight
    title: Differentiation is technically legible but commercially unproven
    body: >-
      The platform is differentiated by its proposed ability to write larger
      sequences without the same nuclease or viral-vector constraints, but
      public evidence does not yet show that this translates into superior
      clinical outcomes or lower delivered cost.
    claimRefs: [CP003, CP006, CP011, CP013]
  - calloutType: risk
    title: Incumbent ecosystem risk
    body: >-
      Established AAV and CRISPR ecosystems create a high switching hurdle for
      sponsors unless Tessera can demonstrate a clinically meaningful advantage
      in payload, dosing, tissue access, safety, or manufacturing.
    claimRefs: [CP002, CP004, CP012]
  - calloutType: recommendation
    title: Underwrite the proof transition, not the platform narrative
    body: >-
      Tessera merits continued competitive monitoring because its proposed payload
      and delivery architecture addresses real modality constraints, but diligence
      should require human safety, efficacy, durability, repeat-dosing, and
      manufacturing evidence before assigning a durable moat.
    claimRefs: [CP006, CP008, CP011, CP013]
