      - [Ex-vivo workflow avoidance, "In-vivo ambition stated", "In-vivo or ex-vivo depending on vector", "Cell therapies can require collection and reinfusion", "Workflow burden is a buyer tradeoff"]
      - [Clinical validation, "TSRA-196 listed in Phase 1/2; no human outcomes in pool", "Broad clinical development described", "Clinical ecosystem described", "Incumbents retain evidence advantage"]
      - [Manufacturing, "Scalable and affordable manufacture is a stated goal", "Viral-vector manufacture described as an impediment", "No comparable source-backed cost data", "CMC proof is unresolved"]
    notes: >-
      Cells describe evidence-backed capability claims or explicit unknowns, not
      independently validated performance rankings. Tessera cells are primarily
      company-claimed or third-party reported from preclinical coverage.
    claimRefs: [CP003, CP005, CP006, CP007, CP008, CP009, CP012]
  - id: TP003
