      - [Tessera Therapeutics, direct platform entrant, "Over $300 million Series C in 2022; TSRA-196 listed in Phase 1/2", rare disease and oncology programs, Gene Writing plus LNP delivery, human outcome evidence and commercial pricing remain unestablished]
