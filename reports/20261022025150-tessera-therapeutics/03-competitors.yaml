      - [CRISPR or nuclease editing, null, "Program-specific economics not in pool", Programmable editing, "Price unknown", "Buyer comparison requires indication-level data"]
      - ["Ex-vivo CAR-T", null, "Treatment-specific pricing not in pool", "Cell collection, engineering, and reinfusion", "Price unknown", "Workflow burden is visible but cost is not quantified"]
    notes: >-
      No assigned source supplies public list price, realized price, discounting,
      contract term, or cost-per-patient data for the compared alternatives. Null
      values are evidence gaps, not zero prices.
