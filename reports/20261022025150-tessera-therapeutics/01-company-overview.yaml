    title: Platform-to-clinic transition
    body: "Tessera has moved from a Flagship-originated platform story to a clinical-stage lead program, with TSRA-196 in Phase 1/2 and Regeneron collaboration; the transition still depends on human safety and biomarker evidence that has not been disclosed here."
    claimRefs: [CO003, CO004, CO013]
  - calloutType: risk
    title: Disclosure and execution concentration
    body: "The public record does not establish current cash runway, valuation, headcount, detailed governance, or full partnership economics, while the 2026 CEO transition concentrates near-term execution and succession questions."
    claimRefs: [CO006, CO012, CO014, CO016]
  - calloutType: recommendation
    title: Priority diligence
    body: "Request the latest cap table and financing terms, cash and burn schedule, complete board and executive roster, Regeneron and Gates agreements, and Phase 1/2 TSRA-196 safety and biomarker readout."
    claimRefs: [CO004, CO012, CO013, CO015, CO016]

