company:
  name: Tessera Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Tessera Therapeutics is a private, clinical-stage biotechnology company founded by Flagship Pioneering in 2018 to develop Gene Writing and delivery platforms for in vivo genetic medicines. The company has moved its lead TSRA-196 program into a Phase 1/2 study while changing chief executives in 2026; financing, headcount, revenue, valuation, and detailed governance disclosures remain incomplete in the assigned public evidence.
sections:
  - id: identity-and-platform
    title: Identity, platform, and stage
    body: >-
      Tessera Therapeutics was founded by Flagship Pioneering in 2018 and describes
      itself as a clinical-stage biotechnology company developing Gene Writing and
      delivery platforms for in vivo genetic medicines. The platform is presented as
      using all-RNA constructs and target-primed reverse transcription to change
      single or multiple base pairs, add exon-length sequences, or add whole genes;
      its proprietary lipid nanoparticle platform is intended to deliver RNA to
      targeted cell types. These are company and founder-issued descriptions rather
      than independently validated clinical performance claims. Independent coverage
      describes the technology as inspired by mobile genetic elements and reports
      preclinical work across human cells, mice, and nonhuman primates. The lead
      clinical asset, TSRA-196, is being developed with Regeneron for alpha-1
      antitrypsin deficiency, and the assigned clinical update reports a single-dose,
      open-label, multinational Phase 1/2 study. The evidence supports a transition
      from platform and preclinical development into clinical-stage execution, but no
      clinical efficacy or safety result is reported in the retained sources.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, founders, and operating coverage
    body: >-
      Flagship’s 2026 announcement says Joseph Romanelli became president and chief
      executive officer on July 23, 2026, succeeding Michael Severino, who had led
      Tessera since June 2022. The same announcement says Romanelli joined Tessera’s
      board and joined Flagship as a CEO-Partner, while Geoffrey von Maltzahn remained
      a co-founder, chairman, and Flagship general partner. The founding account
      identifies von Maltzahn, Jacob Rubens, and Rob Citorik among the scientists who
      began the Flagship Labs exploration in 2017; the company says Tessera was
      founded in 2018. Romanelli brings nearly three decades at Merck, including
      responsibility for an international human-health business spanning 75 markets,
      while the earlier technical coverage identifies Rubens as co-founder and chief
      scientific officer and Cecilia Cotta-Ramusino as head of technology development.
      This gives the public record coverage of commercial, scientific, and platform
      leadership, but it does not provide a complete board roster, committee
      structure, succession plan, or key-person mitigation plan.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Capital, partnerships, and milestones
    body: >-
      Tessera announced more than $300 million in Series C financing in April 2022,
      with participation from ADIA, Alaska Permanent Fund Corporation, SoftBank Vision
      Fund 2, T. Rowe Price-advised funds, Flagship Pioneering, and other existing
      institutional investors. Independent 2021 coverage separately reported more
      than $230 million in Series B financing, so the two disclosed rounds represent
      an arithmetic floor above $530 million; that is historical funding raised, not
      current cash available. Neither source discloses post-money valuation, cash
      balance, burn rate, or runway. Current company-issued coverage confirms joint
      development and commercialization of TSRA-196 with Regeneron, but the assigned
      materials do not establish milestone, ownership, option, or cost-sharing
      economics. The 2026 leadership announcement also describes a sickle-cell
      development candidate and in-vivo CAR-T work. The milestone record therefore
      shows institutional financing, a strategic partner, clinical entry, and a
      leadership transition, while private financial scale and detailed governance
      remain diligence gaps.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]

