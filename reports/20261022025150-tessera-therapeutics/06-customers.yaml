callouts:
  - calloutType: strength
    title: Technical adoption is evidenced before commercial adoption
    body: The Quilt case study provides unusually concrete evidence of internal workflow use, data scale, named ownership, and reproducible tooling, but it does not establish customer revenue or retention.
    claimRefs: [CU001, CU005]
  - calloutType: risk
    title: Retention and concentration are not quantifiable
    body: No assigned source discloses NRR, GRR, churn, renewal, contract duration, paid customer count, or counterparty concentration; partnership claims should not be promoted to durable customer adoption.
    claimRefs: [CU003, CU004, CU011]
