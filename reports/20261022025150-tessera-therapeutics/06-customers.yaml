      - ["Normal hemoglobin in treated sickle-cell patient cells", "98% of treated cells produced normal hemoglobin", "Reported 2023", "Fierce Biotech report; medium confidence", "Shows ex vivo proof point", "Sample size, persistence, manufacturing yield, and patient outcomes"]
      - ["Reporter-gene delivery to primate target cells", "approximately 35% to 50%", "Reported 2023", "Fierce Biotech report; medium confidence", "Highlights delivery progress and remaining variability", "Animal count, target-cell denominator, safety, and therapeutic payload performance"]
    notes: "Values are not a common funnel or retention cohort: they use different populations, units, and periods. No NRR, GRR, churn, renewal, contract-length, or active-account denominator was disclosed in the assigned sources."
