    columns: [Named relationship, Segment, Deployment or use case, Production vs pilot, Outcome or signal, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly named relationships and deployments found in the assigned 2020-2026 source pool; private counterparties and undisclosed programs are excluded."
    rows:
      - [Quilt, "Data-platform partner", "Metadata, versioning, and workflow management for Tessera's scientific data", "Operational case study; production status beyond the case study is not independently verified", "More than 1 petabyte made accessible to experimental and computational teams", "Partner-issued; no contract value, renewal, or independent customer interview"]
      - ["2022 institutional investor syndicate", "Capital providers, not customers", "Finance platform and therapeutic-program development", "Completed financing round described in a company-issued release", "More than $300 million announced with multiple named investors", "Financing validates access to capital, not customer demand, deployment, or retention"]
      - [Flagship Pioneering, "Founder and sponsor", "Company creation, financing, and platform development", "Operating sponsor relationship", "Founded Tessera and backed its platform", "Company-controlled relationship, not an arms-length customer proof"]
    notes: "This is a partial enumeration of named relationships, not a complete customer list; production, pilot, outcome, and commercial fields are left qualified where public evidence is incomplete."
    claimRefs: [CU009, CU010, CU011, CU012]
