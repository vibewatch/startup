company:
  name: Tessera Therapeutics
chapter:
  number: 6
  title: Customers
  summary: Tessera has credible evidence of internal scientific adoption and named external ecosystem relationships, but public evidence remains concentrated in company, supplier, and preclinical disclosures. The customer base is therefore best understood as a platform-development funnel rather than a demonstrated commercial revenue base.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      Tessera's disclosed users are primarily internal wet-lab and computational biology teams, collaborators, and prospective therapeutic-development partners rather than paying end customers. Quilt's case study describes more than 1 petabyte of Tessera scientific data shared across wet-lab scientists and computational biologists, with sequencing instruments, external partners, and wet-lab instruments feeding the workflow. That is direct evidence of an operating user base, but not of external software revenue or patient adoption. The therapeutic platform also creates a second segment: biopharma counterparties that could supply disease programs, capital, development capability, or commercialization reach, although no accessible retained source identifies an arms-length therapeutic customer or discloses partnership economics. Patients are the eventual beneficiaries of the preclinical applications reported by Fierce Biotech, but no source in this pool establishes treated-patient counts, reimbursement, or commercial demand. This segmentation implies that near-term value is created through platform validation while durable partner and payer evidence remains a future clinical and commercial milestone.
    claimRefs: [CU001, CU002, CU003, CU004, CU006, CU007]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and durability evidence
    body: >-
      The strongest adoption evidence is operational rather than commercial. Quilt reports that Tessera's data platform gives experimental and computational teams access to more than 1 petabyte of scientific data, with metadata, quality-control metrics, visualizations, and automated pipelines. The case study also names a Tessera data-platform director and describes use of Quilt, Nextflow, Dagster, Amazon S3, IAM, and OpenSearch in a production-like workflow. Separately, Fierce Biotech reports preclinical evidence presented at J.P. Morgan: up to 35% correction of a PKU allele in nonhuman primates after one injection, 98% normal hemoglobin production in treated sickle-cell patient cells, and more than 80% reporter-gene delivery to mouse T cells, with lower delivery in primates. As of that January 2023 report, the CEO declined to disclose a timeline for human tests. These are program-development outputs, not retention, renewal, or product utilization metrics. No assigned source supplies NRR, GRR, churn, repeat-purchase, contract duration, patient enrollment, or a denominator for an active customer count. The adoption trajectory should therefore be scored as expanding technical capability with commercial durability unresolved.
    claimRefs: [CU005, CU006, CU007, CU008, CU013]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named relationship proof and concentration
    body: >-
      Named evidence is strongest for Tessera's technology suppliers and sponsor ecosystem, not for conventional customers. Quilt identifies Tessera's data-platform implementation and quotes a named director describing centralized, trustworthy data. Flagship identifies the company as founded by Flagship Pioneering, while the 2022 financing release lists institutional investors and describes the platform's intended applications; those materials are supplier, company, or sponsor issued and should not be treated as independent customer validation. The assigned sources do not identify a production therapeutic customer, a paid software customer, a completed commercial deployment, or a customer concentration percentage. Few disclosed relationships cannot by themselves establish concentration, because undisclosed counterparties may exist. The public record therefore does not permit either a numeric concentration estimate or a conclusion that concentration is absent. The diligence priority is to obtain contracts, program stage, enrollment, renewal, and economics by counterparty.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-journey
    title: From platform user to therapeutic payer
    body: >-
      Tessera's observable customer journey begins with scientists and computational teams ingesting experimental data, proceeds through reproducible analysis and genome-writing program selection, and then moves toward biopharma collaboration and clinical development. The journey is not yet a conventional sales funnel: the sources show workflow use and preclinical outputs, but not a comparable population, paid conversion rate, renewal cohort, or patient-treatment denominator. The commercial inflection point is whether platform demonstrations become durable partnerships and whether clinical evidence converts those partnerships into funded development, regulatory approvals, and reimbursed therapies. A customer journey map therefore distinguishes evidence-backed current users from future users and payers, rather than implying that preclinical percentages represent commercial conversion.
    claimRefs: [CU001, CU005, CU009, CU012]
    figureRefs: [FU001]
