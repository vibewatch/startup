        - Medium
        - Clinical hold, weak pharmacodynamics, or inability to fund runway
      - - No-decision case
        - Entry price, cash, dilution, and complete preferences remain unavailable
        - No reliable return calculation is possible
        - High until diligence closes gaps
        - Missing primary financing and cap-table evidence
    notes: >-
      Probability signals are qualitative, not numerical probabilities. The two public marks use different dates and
      methodologies and therefore do not constitute a valuation range.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
      - CV014
      - CV015
