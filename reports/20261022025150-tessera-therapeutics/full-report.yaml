  - id: FI001
    title: Capital-to-commercialization dependency chain
    type: flow
    summary: >-
      Public evidence reaches clinical development, but pricing, approval, recognized revenue, and gross profit remain
      future and unquantified steps.
    data:
      nodes:
        - id: external-capital
          label: External capital
          detail: Equity rounds and an up-to-$41.3 million award fund activity but are not recurring product revenue.
        - id: platform-rd
          label: Platform R&D
          detail: Gene Writing discovery spans a broad set of potential disease applications.
        - id: delivery-cmc
          label: Delivery and manufacturing
          detail: Proprietary lipid-nanoparticle delivery and manufacturing capability require separate investment.
        - id: preclinical
          label: Preclinical programs
          detail: Third-party pipeline data lists four preclinical projects.
        - id: clinical
          label: Phase 1/2 TSRA-196
          detail: The company reports an ongoing first-in-human study jointly developed with Regeneron.
        - id: commercial
          label: Potential commercial economics
          detail: Approval, pricing, contract consideration, revenue recognition, and gross profit are not established.
      edges:
        - source: external-capital
          target: platform-rd
          label: funds
        - source: platform-rd
          target: delivery-cmc
          label: requires
        - source: delivery-cmc
          target: preclinical
          label: enables
        - source: preclinical
          target: clinical
          label: advances
        - source: clinical
          target: commercial
          label: contingent path
    approximationNotes: >-
      Conceptual dependency flow; it does not represent amounts, probabilities, timing, conversion rates, or a
      cumulative financial bridge.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI012
      - CI013
      - CI014
      - CI015
  - id: FE001
    title: Gene Writing product architecture map
    type: stack
    summary: >-
      Tessera's public technology can be read as a discovery-to-delivery stack, with clinical controls spanning every
      layer.
    data:
      layers:
        - name: Discovery engine
          label: Discovery engine
          detail: Publicly described search and engineering process for mobile genetic elements.
          items:
            - label: MGE mining
              detail: 9,559 retroelements across 452 eukaryotic species were surveyed in the reported study.
            - label: Candidate screening
              detail: 406 reconstructed candidates were screened for activity in human cells.
        - name: Gene Writer
          label: Gene Writer
          detail: Engineered molecular machinery intended to write or rewrite genomic sequence.
          items:
            - label: RNA Gene Writer
              detail: Uses Gene Writer machinery and an RNA template for sequence changes or durable insertion.
            - label: DNA Gene Writer
              detail: Described for writing larger DNA payloads into the genome.
        - name: Template and payload
          label: Template and payload
          detail: RNA or DNA instructions carrying the intended edit or therapeutic cargo.
          items:
            - label: Sequence correction
              detail: Base-pair substitutions, insertions, and deletions are described as platform objectives.
            - label: Gene or exon payload
              detail: Exon-length sequences and whole-gene additions are described as platform objectives.
        - name: Delivery
          label: Delivery
          detail: Lipid-nanoparticle and targeted-delivery layer for reaching cells in vivo.
          items:
            - label: Lipid nanoparticles
              detail: Non-viral RNA delivery is used in the reported in-vivo demonstrations.
            - label: Targeted LNPs
              detail: tLNPs were used to generate CAR-T cells in humanized mice.
        - name: Development control
          label: Development control
          detail: Clinical candidate, safety, durability, and manufacturing evidence needed for translation.
          items:
            - label: TSRA-196
              detail: Partnered AATD program intended for a one-time SERPINA1 correction.
            - label: Safety and durability
              detail: Human integration-site safety, clinical durability, and long-term genotoxicity remain open.
        - name: Clinical validation
          label: Clinical validation
          detail: Patient-level evidence is the unresolved final translation layer.
          items:
            - label: First-in-human evidence
              detail: TSRA-196 clinical safety, pharmacodynamics, and durability data are not present in the assigned sources.
    approximationNotes: >-
      The stack is a structured presentation of public descriptions; it does not imply that each layer is
      production-ready or that the layers form a validated commercial supply chain.
    claimRefs:
      - CE004
      - CE005
      - CE008
      - CE012
      - CE014
  - id: FU001
    title: Customer journey from scientific use to reimbursed therapy
    type: journey-map
