chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and stage
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics was founded by Flagship Pioneering in 2018 and describes itself as a clinical-stage
              biotechnology company developing Gene Writing and delivery platforms for in vivo genetic medicines. The
              platform is presented as using all-RNA constructs and target-primed reverse transcription to change single
              or multiple base pairs, add exon-length sequences, or add whole genes; its proprietary lipid nanoparticle
              platform is intended to deliver RNA to targeted cell types. These are company and founder-issued
              descriptions rather than independently validated clinical performance claims. Independent coverage
              describes the technology as inspired by mobile genetic elements and reports preclinical work across human
              cells, mice, and nonhuman primates. The lead clinical asset, TSRA-196, is being developed with Regeneron
              for alpha-1 antitrypsin deficiency, and the assigned clinical update reports a single-dose, open-label,
              multinational Phase 1/2 study. The evidence supports a transition from platform and preclinical
              development into clinical-stage execution, but no clinical efficacy or safety result is reported in the
              retained sources.
