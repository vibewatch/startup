figures:
  - id: FO001
    title: Tessera milestone timeline
    summary: >-
      Publicly documented milestones show progression from Flagship-originated platform formation to clinical entry and
      a 2026 leadership transition.
    type: timeline
    data:
      items:
        - date: '2017'
          label: Flagship Labs exploration begins
          details: >-
            Flagship scientists including Geoffrey von Maltzahn, Jacob Rubens, and Rob Citorik began exploring
            alternatives to cutting DNA.
          tone: neutral
          claimRefs:
            - CO008
        - date: '2018'
          label: Tessera founded
          details: Flagship Pioneering founded Tessera Therapeutics as a company focused on Gene Writing medicines.
          tone: positive
          claimRefs:
            - CO001
            - CO008
        - date: 2020-07
          label: Company emerges from stealth
          details: Flagship and Tessera publicly introduced Gene Writing based on mobile genetic elements.
          tone: positive
          claimRefs:
            - CO008
        - date: 2021-01
          label: Series B financing
          details: Independent coverage reported more than $230 million in Series B financing.
          tone: positive
          claimRefs:
            - CO011
        - date: 2022-04
          label: Series C financing
          details: Tessera announced more than $300 million in Series C financing.
          tone: positive
          claimRefs:
            - CO012
        - date: 2023-01
          label: Preclinical platform data presented
