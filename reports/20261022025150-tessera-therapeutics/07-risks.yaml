        - label: Off-target writing
          values: [medium, critical, high, immediate]
        - label: Target-cell delivery
          values: [medium, critical, high, immediate]
        - label: Manufacturing comparability
          values: [medium, high, high, near-term]
        - label: Runway before data
          values: [medium, high, high, quarterly]
        - label: Foundational IP license
          values: [medium, high, medium, annual]
    claimRefs: [CR001, CR002, CR005, CR006, CR009, CR010, CR013, CR016]

callouts:
  - calloutType: risk
    title: Primary thesis-break event
    body: The investment thesis is most exposed to first-in-human safety, target engagement, and durability. A clinical hold, unacceptable dose-limiting toxicity, or inadequate on-target writing at a tolerable dose would invalidate the current platform-to-clinic transition narrative.
    claimRefs: [CR001, CR002, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: Financing announcements and platform demonstrations show resources and technical intent, but they do not establish current cash runway, clinical efficacy, regulatory acceptance, or manufacturing readiness.
    claimRefs: [CR003, CR005, CR009, CR010, CR011]

