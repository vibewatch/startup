    notes: "Partial public coverage as of 2026-10-22; funding, awards, collaboration economics, recognized revenue, and cash availability are kept separate, and undisclosed values are not treated as zero."
    claimRefs: [CI002, CI003, CI004, CI006, CI008, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Economic input, Public evidence, Current value, Confidence, Diligence ask]
    rows:
      - [TSRA-196 price, "No list or realized price in retained sources", null, Low, "Build payer research and one-time-therapy comparable set"]
      - [Regeneron consideration, "Joint development confirmed; consideration and cost sharing absent", null, Low, "Obtain upfront, milestones, options, royalties, and expense allocation"]
      - [ARPA-H cash receipts, "Award ceiling reported; draw schedule and recognized amount absent", null, Low, "Reconcile award milestones to cash receipts and grant accounting"]
      - [Orphan incentives, "Tax credits, user-fee exemption, and possible seven-year exclusivity described", "Statutory incentives; not a selling price", Medium, "Model only when eligibility, taxable income, and approval scenario are specified"]
      - [Revenue recognition, "No policy or audited statements located", null, Low, "Obtain audited financials and contract-by-contract accounting analysis"]
    notes: "Null means the assigned public evidence does not establish the value; regulatory incentives and financing are not presented as product revenue."
    claimRefs: [CI001, CI006, CI008, CI009, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Recognized revenue, null, Low, "Establishes whether collaboration or grant activity has entered the income statement", "Provide audited revenue by stream and recognition policy"]
      - [Gross margin, null, Low, "Tests sustainable economics after manufacturing and delivery costs", "Provide program-level COGS and gross-margin bridge"]
      - [Manufacturing cost per dose, null, Low, "One-time therapies can carry material CMC and release-testing costs", "Provide batch yield, dose, release, failure, and logistics assumptions"]
      - [Research and development expense, null, Low, "Multiple platform and program workstreams may compound burn", "Provide historical and forecast spend by platform and program"]
      - [Cash on hand, null, Low, "Defines capacity to reach the next clinical milestone", "Provide latest balance sheet and restricted-cash schedule"]
      - [Cash burn and runway, null, Low, "Determines the timing and size of the next financing need", "Provide monthly cash flow and downside runway to data readout"]
      - [Debt and fixed obligations, null, Low, "Debt, leases, or contingent payments can accelerate dilution", "Provide debt, lease, covenant, and contingent-obligation schedules"]
    notes: "Every null is an evidence gap rather than a zero; public pipeline breadth identifies cost categories but does not quantify these unit-economic or liquidity metrics."
    claimRefs: [CI005, CI010, CI012, CI013, CI014, CI016]
