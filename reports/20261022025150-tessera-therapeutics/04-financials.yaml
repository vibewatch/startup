schemaVersion: "report-v2"
artifact: financials
slug: tessera-therapeutics
runDate: 2026-10-22
company:
  name: Tessera Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Tessera has attracted substantial equity financing, an up-to-$41.3 million
    government award, and a Regeneron development relationship, but those inflows
    are not evidence of recurring revenue or cash currently available. Audited
    financials, collaboration economics, cash burn, runway, pricing, and cost of
    goods remain unavailable, so the financial case cannot yet be underwritten.
sections:
  - id: revenue-model
    title: Revenue model remains prospective
    body: >-
      Tessera is best analyzed as a privately financed, clinical-stage biotechnology
      company rather than as a business with a disclosed recurring-revenue engine.
      Public evidence identifies equity rounds, an up-to-$41.3 million ARPA-H award,
      and joint development of TSRA-196 with Regeneron. These are distinct economic
      categories: financing raised is not revenue, an award ceiling is not cash
      received, and a collaboration does not reveal recognized revenue without its
      contract and accounting policy. The retained sources disclose no product sales,
      ARR, realized license revenue, or revenue mix. Future monetization could include
      collaboration consideration and approved-therapy sales, but neither stream can
      be quantified from the available record.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI008, CI011]
    tableRefs: [TI001]
  - id: pricing-and-go-to-market
    title: Pricing and go-to-market evidence
    body: >-
      The observable go-to-market motion is partner- and development-led, not a
      conventional customer-acquisition funnel. Tessera has advanced TSRA-196 into a
      Phase 1/2 study and describes Regeneron as a joint-development partner, while
      the FDA designations can reduce some regulatory friction and create statutory
      incentives. None of those facts establishes list price, realized net price,
      payer access, sales-cycle duration, customer acquisition cost, milestone
      probability, option economics, or revenue recognition. The appropriate
      diligence unit is therefore each program and contract rather than a SaaS-style
      multiple. The signed Regeneron agreement, grant draw schedule, and indication-
      level commercialization model are prerequisites to estimating revenue quality.
    claimRefs: [CI007, CI008, CI009, CI011, CI016]
    tableRefs: [TI002]
  - id: cost-structure
    title: Cost structure and capital intensity
    body: >-
      Public evidence points to a broad cost base spanning platform discovery,
      proprietary lipid-nanoparticle delivery, therapeutic development, manufacturing
      capability, animal studies, and clinical execution. Tessera's co-founder said
      the Series B proceeds would support investment in therapeutic-development and
      manufacturing teams. Independent coverage also described experiments across
      human cells, mice, and nonhuman primates, while a current pipeline database lists
      one Phase 1/2 asset and four preclinical projects. This breadth indicates several
      simultaneous capital demands, but it does not quantify research expense, CMC
      spend, batch yield, working capital, capex, or cost per dose. Gross-margin
      modeling should remain blank until those inputs are provided.
    claimRefs: [CI005, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      Historical access to capital is credible: two independent sources corroborate
      the $230 million Series B, and reporting describes a subsequent Series C of more
      than $300 million. That chronology demonstrates fundraising capacity, not
      present liquidity. No retained source reports cash on hand, post-restructuring
      burn, debt or lease obligations, milestone receipts, or runway to clinical data.
      AInvest's adverse assessment is directionally useful because it identifies the
      absence of audited financials and a clear revenue path, but its reported funding
      range is not a substitute for company accounts. The verdict is therefore
      "ununderwritable, not necessarily underfunded": investors need current financial
      statements and a milestone-linked operating plan before judging dilution risk,
      margin potential, or capital adequacy.
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI016]
