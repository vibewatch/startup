          target: clinical
          label: advances
        - source: clinical
          target: commercial
          label: contingent path
    approximationNotes: "Conceptual dependency flow; it does not represent amounts, probabilities, timing, conversion rates, or a cumulative financial bridge."
    claimRefs: [CI005, CI007, CI008, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: risk
    title: Runway cannot be inferred from capital raised
    body: >-
      Historical rounds and an award ceiling do not disclose current liquidity.
      Require cash, burn, obligations, partner receipts, and milestone timing before
      concluding that Tessera can fund the lead trial without another financing.
    claimRefs: [CI002, CI003, CI004, CI006, CI010]
