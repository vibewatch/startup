artifact: valuation
slug: tessera-therapeutics
runDate: 2026-10-22
company:
  name: Tessera Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: Tessera combines substantial financing and preclinical gene-writing evidence with a sharply uncertain private-market value. A 2022 $1.7B mark and Forge's $668.33M 2025 post-money estimate are not directly comparable, so the evidence supports a high-risk research-more stance rather than a price-insensitive investment.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is a platform with broad genomic ambitions, substantial historical
      backing, and a specific preclinical signal. Tessera's 2022 financing announcement describes
      a platform intended to make base changes, insertions or deletions, and whole-gene writes
      using RNA delivery, while Fierce Biotech reported editing of up to 35% after one injection
      in nonhuman primates. Those data could support valuable therapeutic and partnership options
      if human safety, durability, delivery, and manufacturing translate. The anti-thesis is that
      the reviewed stage evidence remains preclinical and the financing record is internally
      inconsistent across market-data providers. The public source set also leaves current cash,
      burn, ownership, and complete preference economics unquantified. Investors therefore face
      concentrated clinical, regulatory, financing, and liquidity risk. A positive underwriting
      decision requires both a defensible entry price and human evidence that materially reduces
      the platform's binary development risk.
    claimRefs: [CV001, CV002, CV003, CV004, CV013, CV015, CV016]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      Tessera announced more than $300M of Series C financing in April 2022, and Fierce Biotech
      reported that the company's cumulative haul then exceeded $500M over fifteen months.
      Multiples associates that round with a $1.7B valuation. Forge, by contrast, displays a
      $668.33M post-money estimate for a December 2025 Series D and terms including a 1.0x
      liquidation preference and 6% cumulative dividend. The cross-source marks imply a roughly
      61% lower later reference, but that arithmetic is not evidence of a directly comparable
      down round because the publishers use different source bases and Forge disclaims audit
      or independent verification. The providers also disagree on aggregate funding, while
      Multiples reports strategic Regeneron consideration that includes potential milestones.
      Funding raised is not cash available, a milestone pool is not realized proceeds, and a
      private post-money estimate is not an exit price. Entry discipline therefore requires
      primary financing documents, a cap-table waterfall, and runway through the next clinical
      readout before either public mark is used as fair value.
    claimRefs: [CV001, CV002, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV015]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenarios, comparables, and thesis-break triggers
    body: >-
      A bull case requires first-in-human data that confirms tolerability, meaningful target-cell
      delivery, durable editing, and a commercially viable manufacturing process; in that case
      value could move above the historical mark, but no public evidence supports a target price
      or probability. The base case is a technically promising, capital-intensive private biotech
      whose public reference points span Forge's $668.33M estimate and Multiples' $1.7B historical
      mark; that span is an evidence envelope, not a fair-value range. The bear case is a safety,
      delivery, efficacy, regulatory, or financing failure that pushes value below Forge's estimate
      or causes severe impairment. Revenue multiples from commercial public companies are not
      directly comparable to this preclinical-stage evidence. Forge also reports limited market
      activity and no company-endorsed IPO plan, reducing confidence in near-term liquidity. The
      decisive diligence asks are current cash and burn, complete ownership and preference terms,
      executed Regeneron economics, human trial data, and an independent delivery and off-target
      review. Weak human pharmacodynamics, a clinical hold, inability to fund the next readout, or
      materially senior undisclosed preferences would break the thesis.
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite a buy without primary financing documents and human clinical evidence]
      - [Confidence, medium-low, Public marks provide direction but not a verified current clearing price]
      - [Risk rating, high, "Clinical, delivery, regulatory, financing, and liquidity risks remain material"]
      - [Valuation stance, uncertain, The 2022 and 2025 marks differ materially and are not directly comparable]
      - [Target return / hold / exit, unsupported, No return target or exit timing is defensible from the assigned public evidence]
    notes: >-
      Assessment is an evidence-weighted judgment, not a quoted security price; the private
      financing and market-data sources use different dates, definitions, and limitations.
    claimRefs: [CV005, CV006, CV007, CV009, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Platform breadth and delivery, Gene-writing capabilities are company-described and reported preclinically, Human safety and durable delivery data]
      - [Capital validation, "More than $300M Series C and more than $500M raised over fifteen months by 2022", Current cash runway and use-of-proceeds reconciliation]
      - [Strategic validation, "Multiples reports $150M of Regeneron investment within up to $275M of deal value", Executed agreement and milestone conditions]
      - [Valuation reset signal, "Forge displays a $668.33M 2025 post-money estimate versus Multiples' $1.7B 2022 mark", Primary round documents and a consistent fully diluted share count]
      - [Downside from opacity, "Forge disclaims audit and independent verification; aggregate funding totals conflict", "Audited financials, cap table, and complete preference terms"]
    notes: >-
      The rows separate company claims, independent reporting, market-data estimates, and
      missing evidence; no row treats funding raised as revenue or cash available.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV009, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull / base / bear scenarios
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Trigger]
    rows:
      - [Bull, "Human data are safe and show durable target-cell editing; partner capital continues", "Value above the historical $1.7B mark is conceivable but unsupported without human proof", Low-to-medium, Positive first-in-human safety and pharmacodynamic readout]
      - [Base, "Clinical development progresses but remains data- and capital-dependent", "$668.33M to $1.7B is an evidence envelope rather than a fair-value range", Medium, Continued trial execution plus verified cash runway]
      - [Bear, "Safety, delivery, efficacy, regulatory, or financing execution fails", "Value falls below the $668.33M Forge estimate or suffers severe impairment", Medium, "Clinical hold, weak pharmacodynamics, or inability to fund runway"]
      - [No-decision case, "Entry price, cash, dilution, and complete preferences remain unavailable", No reliable return calculation is possible, High until diligence closes gaps, Missing primary financing and cap-table evidence]
    notes: >-
      Probability signals are qualitative, not numerical probabilities. The two public marks
      use different dates and methodologies and therefore do not constitute a valuation range.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV012, CV014, CV015, CV016]
