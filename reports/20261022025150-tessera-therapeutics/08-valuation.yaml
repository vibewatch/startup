  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Historical capital and preclinical evidence pass through conflicting valuation marks and liquidity limits to a research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Historical capital
          detail: More than $500M reported over fifteen months through the 2022 Series C
        - id: proof
          label: Preclinical proof
          detail: Independent reporting describes up to 35% editing after one primate injection
        - id: marks
          label: Conflicting marks
          detail: Multiples shows $1.7B for 2022 while Forge shows $668.33M for 2025
        - id: terms
          label: Preference review
          detail: Forge displays a 1.0x preference and 6% cumulative dividend
        - id: diligence
          label: Required diligence
          detail: Cap table, cash runway, partner economics, and trial data
        - id: recommendation
          label: Research-more
          detail: Track until price and clinical evidence support underwriting
      edges:
        - [scale, proof]
        - [proof, marks]
        - [marks, terms]
        - [terms, diligence]
        - [diligence, recommendation]
    claimRefs: [CV002, CV004, CV007, CV008, CV010, CV011, CV016]
callouts:
  - calloutType: recommendation
    title: Decision
    body: >-
      Research-more is warranted. The evidence supports platform interest, not a price-insensitive
      buy: the valuation marks are dated and methodologically inconsistent, while clinical, cash,
      dilution, preference, and liquidity inputs remain incomplete.
    claimRefs: [CV006, CV007, CV009, CV014, CV015, CV016]
  - calloutType: risk
    title: Primary valuation risk
    body: >-
      A private financing headline can overstate investable value when proceeds, milestone
      payments, liquidation preferences, secondary liquidity, and current cash are not reconciled.
      Treat both the $1.7B and $668.33M figures as attributed reference points, not verified fair value.
    claimRefs: [CV005, CV006, CV008, CV009, CV012, CV015]
