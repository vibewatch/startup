evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current cap table, valuation, cash balance, quarterly burn, debt, and runway through the first TSRA-196 clinical
      readout.
    whyItMatters: >-
      A private clinical-stage biotech's financing capacity and dilution exposure cannot be assessed from historical
      financing announcements alone.
    diligencePath: >-
      Request the latest investor deck, capitalization table, audited or management financials, and board-approved
      operating plan.
    relatedQuestionRefs:
      - QO005
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete current board, executive, committee, ownership, and succession records after the 2026 CEO transition.
    whyItMatters: Leadership concentration and decision rights affect execution risk as Tessera moves into clinical development.
    diligencePath: Obtain the current board roster, committee charters, executive employment terms, and succession plan.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: partnership
    missingEvidence: >-
      Executed Regeneron and Gates Foundation agreements, including milestones, options, ownership, cost sharing,
      disbursement, and access obligations.
    whyItMatters: >-
      Headline partnership and investment amounts do not reveal the economic value or obligations transferred to
      Tessera.
    diligencePath: Review executed agreements and management's schedule of contingent consideration and program commitments.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: blocking
    topic: clinical
    missingEvidence: First-in-human TSRA-196 safety, tolerability, pharmacodynamic, and efficacy data.
    whyItMatters: The lead asset's clinical signal is the central test of the platform-to-clinic transition.
    diligencePath: Request the latest clinical study report, data-cut summary, and regulatory interaction status.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: leadership
    missingEvidence: >-
      Public explanation of Michael Severino's departure and confirmation of continuity for the technical leadership
      team.
    whyItMatters: A CEO transition during clinical entry can signal either planned scaling or execution disruption.
    diligencePath: Ask management and the board for the transition rationale, retention data, and revised operating milestones.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A geography-specific AATD patient funnel with diagnosis, treatment eligibility, and expected net price.
    whyItMatters: >-
      The public disease-market estimate cannot be translated into Tessera's SAM or SOM without patient and price
      denominators.
    diligencePath: >-
      Request epidemiology, diagnosis, treatment-eligibility, pricing, and persistence assumptions from management and
      payer experts.
    relatedQuestionRefs:
      - QM005
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-gap
    missingEvidence: Clinical safety, target-cell delivery, manufacturing cost, and reimbursement evidence for Gene Writing.
    whyItMatters: >-
      These variables determine whether technical differentiation becomes a reimbursed product rather than platform
      option value.
    diligencePath: Review clinical protocol and data-room materials, CMC package, dose-response data, and payer-access work.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: pipeline
    missingEvidence: A complete current competitor and indication census across AATD and related genetic-medicine modalities.
    whyItMatters: >-
      The assigned pipeline source has a login boundary and cannot establish a complete market or competitor
      denominator.
    diligencePath: Triangulate registries, company pipelines, trial records, and specialist market reports.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Indication-level price, reimbursement, manufacturing cost, and realized discount data for Tessera and direct
      modalities.
    whyItMatters: >-
      Without delivered-cost evidence, capability claims cannot be translated into buyer ROI or a durable commercial
      advantage.
    diligencePath: >-
      Request sponsor-level pricing, CMC cost, reimbursement, and contract benchmarks for comparable genetic-medicine
      programs.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: Head-to-head human safety, efficacy, durability, and repeat-dosing evidence versus established modalities.
    whyItMatters: The proposed moat is not investable on preclinical platform breadth alone when incumbents have clinical precedent.
    diligencePath: >-
      Track clinical-trial disclosures and obtain comparable endpoint, durability, and immunogenicity data by
      indication.
    relatedQuestionRefs:
      - QP002
      - QP007
      - QP010
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Buyer interviews and procurement evidence on workflow, regulatory, manufacturing, and distribution switching
      costs.
    whyItMatters: Adoption may favor incumbent modalities even if Tessera's technical payload is broader.
    diligencePath: >-
      Interview gene-therapy sponsors, treatment centers, and payers about modality selection and implementation
      barriers.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, debt and lease obligations, restricted cash, and runway through the Phase 1/2 data
      plan.
    whyItMatters: >-
      Historical funding cannot establish whether Tessera can reach the next value-inflecting clinical milestone without
      additional dilution.
    diligencePath: >-
      Request the latest balance sheet, monthly cash-flow history, operating plan, obligation schedule, and
      base/downside runway cases.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: collaboration
    missingEvidence: >-
      Executed Regeneron agreement, upfront consideration, options, development cost sharing, milestones, royalties, and
      accounting treatment.
    whyItMatters: >-
      The relationship validates interest but cannot be translated into revenue quality, cash receipts, or future
      economics without contract terms.
    diligencePath: >-
      Review the signed agreement, board materials, cash ledger, milestone probability model, and revenue-recognition
      memorandum.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Program-level R&D spend, manufacturing yield, cost per dose, working capital, capex, and gross-margin assumptions.
    whyItMatters: >-
      A one-time genetic medicine can have compelling clinical value while remaining financially unattractive if
      delivery and manufacturing costs are high.
    diligencePath: Obtain the CMC cost build, batch history, dose assumptions, facility plan, and program-level expense forecast.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI010
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Audited revenue by stream, payer and pricing research, commercialization responsibilities, sales-cycle evidence,
      and any customer or license backlog.
    whyItMatters: >-
      Without commercial evidence, financing and technical progress cannot be converted into a defensible revenue
      forecast.
    diligencePath: >-
      Request audited income statements, contract schedules, launch plans, payer research, and indication-level revenue
      scenarios.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: blocking
    topic: clinical-safety
    missingEvidence: >-
      First-in-human safety, tolerability, pharmacodynamic, and integration-site results for TSRA-196 or another Gene
      Writing program.
    whyItMatters: >-
      The platform's investment case depends on translating preclinical editing and delivery into safe, durable patient
      benefit.
    diligencePath: >-
      Request the clinical protocol, registry updates, interim safety tables, pharmacodynamic endpoints, and
      integration-site analysis from Tessera and Regeneron.
    relatedQuestionRefs:
      - QE004
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: manufacturing
    missingEvidence: >-
      Clinical-grade manufacturing process, batch release assays, potency specifications, comparability plan, and scale
      assumptions for Gene Writer and lipid-nanoparticle components.
    whyItMatters: >-
      A technically successful editor can still fail commercially or clinically if delivery and release performance are
      not reproducible.
    diligencePath: >-
      Obtain CMC package summaries, representative certificates of analysis, process-development milestones, and planned
      GMP capacity.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: precision
    missingEvidence: >-
      Longitudinal in-vivo integration-site, biodistribution, off-target, immunogenicity, and repeat-dose data across
      the intended target tissues.
    whyItMatters: >-
      Random or incomplete integration and tissue-delivery limits could narrow the addressable indications and increase
      safety risk.
    diligencePath: >-
      Request full nonclinical study reports, dose-response data, tissue panels, and follow-up duration for each lead
      program.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: Detailed partner governance, rights allocation, milestone conditions, and cost-sharing mechanics for TSRA-196.
    whyItMatters: The development path depends on a partner-led commercialization model and shared execution.
    diligencePath: >-
      Review the executed collaboration agreement, option and termination provisions, milestone definitions, and
      development-governance plan.
    relatedQuestionRefs:
      - QE009
      - QE010
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Executed partner and customer agreements showing contract duration, renewal, churn, and economics.
    whyItMatters: >-
      Without retention evidence, platform use and strategic relationships cannot be translated into durable revenue or
      repeat adoption.
    diligencePath: >-
      Request a counterparty-level cohort schedule with contracts, renewals, churned programs, and recognized revenue by
      period.
    relatedQuestionRefs:
      - QU003
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A complete list of named customers, collaborators, pilots, and production therapeutic programs.
    whyItMatters: >-
      The public sample may omit material concentration, failed pilots, or dependence on a small number of
      counterparties.
    diligencePath: Obtain a customer and partner register with status, deployment stage, economics, and last verified activity date.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: commercial-adoption
    missingEvidence: Independent clinical enrollment, treatment, reimbursement, and patient-outcome records for active programs.
    whyItMatters: >-
      Preclinical performance and internal data operations are not evidence of clinical adoption or payer willingness to
