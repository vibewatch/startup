companyProfile:
  summary: >-
    Tessera Therapeutics is a private, clinical-stage biotechnology company developing Gene Writing and delivery
    platforms for in vivo genetic medicines. It has advanced TSRA-196, developed with Regeneron for alpha-1 antitrypsin
    deficiency, into a Phase 1/2 study while retaining a broader preclinical pipeline. Public materials support a
    differentiated platform thesis, but do not yet establish human safety or efficacy, current financial runway, or
    detailed governance and partnership economics.
