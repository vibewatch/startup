- id: expansion-and-concentration-risk
  title: Expansion and Concentration Risk
  body: "The biggest customer risk is not whether Loadsmart has customers; it is whether the visible customer set\
    \ is concentrated in a narrow, Opendock-heavy slice of the platform and in a relatively enterprise-heavy segment.\
    \ Public proof clusters in North American, high-volume operations where dock throughput, carrier coordination,\
    \ and freight cost control matter immediately. That concentration is strategically coherent, but it also means\
    \ the public file says very little about SMB penetration, international production deployments outside North\
    \ America, or how revenue is distributed across the top accounts inside the logo set. Expansion logic clearly\
    \ exists—Opendock now bundles ShipperGuide Instant Rates, and MercuryGate expands access to enterprise shipper\
    \ demand—but public proof still does not show how often these motions turn into durable multi-product ARR. The\
    \ 2026 LATAM expo post is especially revealing: it describes strong prospect interest and pipeline creation\
    \ rather than already-landed customers. That leaves the right underwriting conclusion as cautious: Loadsmart\
    \ appears to have real land-and-expand potential, but customer concentration and cross-surface recurrence remain\
    \ under-disclosed."
