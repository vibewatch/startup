  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Product-level NRR, GRR, logo churn, contract length, and renewal cohort data for Opendock,
      ShipperGuide, and managed transportation.
    whyItMatters: Without retention metrics, public customer proof cannot distinguish a strong implementation funnel
      from a durable recurring-revenue base.
    diligencePath: Request customer cohort tables by product, renewal rates by module, and the last four quarters
      of gross/logo retention data.
    relatedQuestionRefs:
    - QU016
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, largest-account ARR, and revenue split by vertical, geography,
      and product surface.
    whyItMatters: The visible customer set is enterprise-skewed, so concentration risk could be meaningful even
      if logo count appears healthy.
    diligencePath: Request account concentration schedules, vertical mix, and any customer representing more than
      5 percent of revenue.
    relatedQuestionRefs:
    - QU022
    - QU024
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: cross-surface-adoption
    missingEvidence: Independent case studies or customer references proving that Opendock accounts expand into
      ShipperGuide, managed transportation, or FreightIntel on recurring contracts.
    whyItMatters: Public evidence suggests land-and-expand logic, but the proof set remains concentrated in warehouse
      scheduling rather than the full Loadsmart suite.
    diligencePath: Ask for named multi-product customer references, attach-rate data, and ARR by product family
      for top warehouse-origin accounts.
    relatedQuestionRefs:
    - QU006
    - QU020
    - QU021
    relatedTableRefs:
    - TU002
    - TU006
  - type: stale
    severity: minor
    topic: brokerage-case-study-freshness
    missingEvidence: Newer named shipper-side case studies for Loadsmart brokerage and managed transportation after
      2022.
    whyItMatters: Several shipper-side references are dated and anonymized, making it hard to know whether those
      accounts are still active and representative of the current product mix.
    diligencePath: Request 2024-2026 customer references for named shippers using brokerage, managed transportation,
      or ShipperGuide outside Opendock-led deployments.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU004
  - type: conflicting-data
    severity: minor
    topic: review-signal-mix
    missingEvidence: Normalized review segmentation separating enterprise software users from carriers or marketplace
      users on broker-facing review sites.
    whyItMatters: The low-score marketplace complaints may reflect a different user cohort than the higher-scoring
      Opendock and ShipperGuide reviews, so adverse sentiment is directionally useful but not cleanly comparable.
    diligencePath: Map review platforms by cohort, then test enterprise NPS/CSAT against carrier and loadboard satisfaction
      separately.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU005
