- id: retention-review-and-durability
  title: Retention, Review Signals, and Durability
  body: "Public retention evidence is indirect. The strongest proxies come from scaled warehouse deployments and\
    \ repeat operational usage: Cascades’ 63-site footprint, Red Gold’s 25,000-plus auto-tendered loads, Glazer’s\
    \ 11 distribution centers, IAP’s formal process discipline, and the high review volume on Opendock relative\
    \ to the rest of the portfolio. Independent review surfaces are broadly constructive: Gartner rates Loadsmart\
    \ at 4.3 with especially good service and support, G2 shows 74 Opendock reviews and 24 ShipperGuide reviews,\
    \ and Software Advice highlights clear ease-of-use and carrier self-scheduling benefits. But those same review\
    \ channels also surface important friction—lag, slow support responses, double loads, inaccurate instant quotes,\
    \ and occasional scheduling misuse by carriers. The adverse carrier-facing marketplace reviews on SourceForge\
    \ are much harsher, but because they are older and low-sample they look more like a warning about service quality\
    \ variance than a clean read on enterprise SaaS churn. Most importantly, none of the public sources disclose\
    \ NRR, GRR, logo churn, or contract length, so durability still rests on proxies rather than disclosed retention\
    \ economics."
  claimRefs:
