- id: implementation-and-adoption-motion
  title: Implementation and Adoption Motion
  body: "The adoption motion is clearest in Opendock. Review and case-study evidence consistently describe manual\
    \ scheduling pain first—phone calls, spreadsheets, email coordination, missed appointments, congestion, and\
    \ weak carrier visibility—followed by a relatively structured rollout into self-service appointments, analytics,\
    \ and adjacent yard features. Public proof shows both fast single-site implementation and slower network rollouts:\
    \ Ralph Moyle says it was live within 60–90 minutes, while Cascades ran a phased migration that eventually put\
    \ 63 sites on the upgraded platform. The common implementation pattern is carrier self-scheduling plus exception\
    \ management by the shipper or warehouse team, which reduces labor while improving visibility and on-time coordination.\
    \ On the broader Loadsmart suite, adoption looks more account-manager-led and enterprise-integrated. Brokerage\
    \ and dynamic-pricing case studies usually involve embedded TMS or carrier-network workflows, not self-serve\
    \ product signups, which suggests longer sales cycles and heavier services involvement. That matters because\
    \ the best public customer evidence supports workflow adoption and operational embedding, but it does not yet\
    \ prove a broad, low-friction self-serve expansion engine across all products."
