- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Risk / expansion driver
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Opendock-heavy public proof
    - Most quantified 2024–2026 evidence comes from dock and yard case studies, not AI or managed transportation
    - Public logos may overstate recurring adoption of the full suite
    - Request attach rates and ARR by product family
  - - Enterprise / high-volume customer skew
    - Visible cases cluster in large North American shippers, plants, ports, and distribution centers
    - A few large accounts could matter disproportionately to revenue
    - Request top-customer concentration and vertical mix
  - - Anonymized brokerage customers
    - Several shipper-side wins are described only as Fortune 500 beverage, packaging, auto, tech, or airline customers
    - Hard to verify whether those accounts are current and expandable
    - Ask for named 2024–2026 references and renewal histories
  - - Channel-driven expansion
    - MercuryGate confirms partner access to enterprise shippers
    - Improves distribution, but does not prove retention or wallet share
    - Request partner-sourced pipeline, win rates, and renewal performance
  - - Early LATAM expansion
    - 2026 expo post shows prospect interest rather than public production logos
    - Geographic diversification remains pipeline-stage publicly
    - Request named LATAM customers and go-live metrics
  - - No public NRR / churn / contract terms
    - Retention remains inferred from scaled deployments and review volume
    - Durability cannot be fully underwritten from public evidence alone
    - Request cohort retention, contract length, and churn reasons by product
  notes: This table distinguishes between real expansion vectors and under-disclosed durability risks. The main
    issue is not absence of customers, but limited visibility into which customers recur and expand across the whole
    platform.
