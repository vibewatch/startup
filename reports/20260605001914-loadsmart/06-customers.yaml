chapter:
  number: 6
  title: Customers
  summary: "Loadsmart’s customer proof is real but lopsided: Opendock shows the clearest production adoption, with\
    \ 4,000+ warehouses, 230,000+ carriers, and named accounts like Red Gold, Cascades, Ralph Moyle, GoBolt, Glazer’s,\
    \ and International Auto Processing showing quantified workflow gains. By contrast, shipper-side brokerage and\
    \ ShipperGuide proof exists but is thinner, often anonymized, and weaker on retention or recurring-usage disclosure;\
    \ review surfaces are positive overall yet still flag glitches, lag, and coordination friction. Public evidence\
    \ therefore supports real adoption and land-and-expand potential, but not a clean read on NRR, top-account concentration,\
    \ or how much of the logo set uses multiple Loadsmart products on a recurring basis."
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: "Loadsmart’s public customer file points to a two-sided customer base rather than a single monolithic shipper\
    \ cohort. On one side are enterprise shippers using brokerage, Reliable Contracts, dynamic pricing, or ShipperGuide\
    \ workflows; on the other are warehouses, ports, and fulfillment operators using Opendock for dock, gate, and\
    \ yard execution. The strongest named proof clusters around North American, high-volume operations in food and\
    \ beverage, packaging, automotive, marine, and fulfillment. That segment fit makes sense given the company’s\
    \ pitch around throughput, appointment control, and freight-cost management, but it also means the visible customer\
    \ base skews upmarket and operationally complex. Public proof is much better on the warehouse side than on the\
    \ broader suite: Opendock has the clearest user-role evidence, explicit scale metrics, and most of the named\
    \ recent case studies, while shipper-side logos are more likely to be anonymized or described by industry rather\
    \ than by account. The practical takeaway is that Loadsmart appears to know its ICP, but public evidence still\
    \ implies product adoption is uneven across surfaces."
