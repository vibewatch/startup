- id: named-customer-proof-and-reference-quality
  title: Named Customer Proof and Reference Quality
  body: "Loadsmart clears the named-customer-proof bar, but the quality of proof varies sharply by product and customer.\
    \ Opendock has the most decision-useful proof set: Red Gold, Cascades, Ralph Moyle, GoBolt, SSA Marine, Glazer’s\
    \ Beer & Beverage, International Auto Processing, and SnoTemp all tie the product to concrete operational workflows\
    \ and usually to measurable outcomes. Brokerage-side proof is real too—Stanley Black & Decker, MercuryGate-linked\
    \ packaging shippers, a Fortune 500 beverage manufacturer, a large automaker, and a Fortune 500 airline—but\
    \ much of that proof is anonymized by industry and framed around cost or service projects rather than durable\
    \ software usage. The testimonial layer is even thinner: Scotts Miracle-Gro and StoneLoads are named and positive,\
    \ yet neither quote gives enough detail to underwrite recurring product depth. The reference-quality pattern\
    \ is therefore asymmetric. Loadsmart clearly has real customers in production, but the best public evidence\
    \ mostly shows either warehouse workflow adoption or project-style freight outcomes, leaving a gap between logo\
    \ recognition and demonstrated recurring multi-product usage."
