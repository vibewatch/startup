chapter:
  number: 7
  title: Risks
  summary: 'Loadsmart’s highest residual risks are linked rather than isolated: 2026 broker-liability and bond-compliance tightening, freight-cycle-driven margin and carrier-liquidity volatility, and a broad multi-product operating surface that still shows real outage, fraud, and data-handling exposure. Mitigants are visible—Q3 2024 operating profitability, more than $100 million of cash disclosed in August 2024, broad network scale, and explicit legal/security controls—but public evidence is still too thin on current revenue mix, customer concentration, carrier-vetting reserves, and enterprise SLA depth to underwrite the software story cleanly.'
