- id: S704
  title: Competition, concentration, capital flexibility, and kill criteria
  body: 'The remaining risk stack is less about whether Loadsmart has real products and more about whether those products are defensible enough to support enterprise renewals and a software-like multiple through a choppy freight cycle. Gartner recognition and named customers show real market traction, but public customer proof is still concentrated in a relatively small set of logos and case-study patterns rather than in disclosed renewal or concentration metrics. At the same time, well-funded competitors keep advancing: Uber Freight is modernizing its TMS and dock features, Oracle remains a Gartner leader with a large enterprise footprint, and project44 continues to automate appointment management. Loadsmart’s survival through the earlier digital-broker shakeout and its broader logistics stack are genuine positives, but the underwrite still needs explicit kill criteria. The thesis breaks if bond or negligent-selection exposure surprises on the downside, if software reliability degrades
    faster than the company documents it, if carrier liquidity weakens network quality, or if hidden customer concentration makes the current valuation support look more fragile than the 2024 profitability milestone suggests.'
