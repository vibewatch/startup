company:
  name: Loadsmart
chapter:
  number: 1
  title: Company Overview
  summary: 'Loadsmart is a Chicago-headquartered private freight-technology company founded in 2014 by Felipe Capella and

    Ricardo Salgado. Official materials confirm a $200M Series D at a $1.3B valuation in February 2022 and

    operating profitability in Q3 2024, while current public scale metrics remain uneven: the company website says

    $346.4M raised and 600+ logistics experts, whereas third-party datasets show ~$384M total funding, ~505 employees,

    and an unverified $108M 2025 revenue estimate. Customer materials name Stanley Black & Decker, Scotts Miracle-Gro,

    and Ralph Moyle, while legal sources highlight new broker-liability exposure after the 2026 Montgomery ruling and

    an ongoing wage-law class action.'
sections:
- id: identity-and-platform
  title: Identity and Platform
  body: 'Loadsmart presents itself as a logistics-solutions and freight-technology company serving shippers, carriers,

    and warehouses through a combined software-and-services model rather than a single brokerage product. The

    current website and about page position the company around three major operating surfaces: shipper workflows

    such as managed transportation, ShipperGuide TMS, freight brokerage, and FreightIntel AI; carrier workflows

    such as CarrierGuide/CarrierTMS and loadboard access; and facility workflows such as Opendock, yard visibility,

    and gate management. This matters because later chapters should treat Loadsmart less as a point digital broker

    and more as an integrated transportation operating layer spanning planning, execution, dock, yard, and audit

    processes. Public market-data profiles consistently place the company in a private Series D stage, while the

    official site continues to market enterprise-grade integration depth, AI-enabled analytics, and an expanding

    dock-and-yard product footprint. Named customer materials and resource-center content show the software stack is

    being sold alongside managed execution, reinforcing the company''s claim that its differentiation is software-led

    logistics operations rather than subsidized freight volume.'
  claimRefs:
