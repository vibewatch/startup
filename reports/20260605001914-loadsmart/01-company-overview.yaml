callouts:
- calloutType: strength
  title: Software-plus-services breadth looks more durable than a pure spot-brokerage story
  body: Loadsmart’s current public story is not only freight brokerage. The company now ties managed transportation, TMS, dock scheduling, yard workflows, APIs, and FreightIntel AI together, and it still claims operating profitability during a weak freight market. That combination supports a more resilient platform thesis than a volume-led brokerage narrative alone.
  claimRefs:
  - CO005
  - CO007
  - CO023
  - CO030
  - CO032
- calloutType: risk
  title: Disclosure gaps and legal exposure remain material diligence items
  body: The public file is good enough to confirm funding, product breadth, and profitability inflection, but not good enough to settle capital totals, board control, Brazil operations, or revenue quality. At the same time, the Burr labor action and the post-Montgomery liability environment create real legal-overhang risk for any brokerage-heavy business model.
  claimRefs:
  - CO019
  - CO033
  - CO035
  - CO037
  - CO038
  - CO039
