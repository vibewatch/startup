- id: scale-milestones-and-risk
  title: Scale, Milestones, and Risk Signals
  body: 'The clearest recent operating milestone is Loadsmart''s October 2024 announcement that it had reached operating

    profitability in Q3 and expected record gross profit for the year. That statement supports the narrative that

    management chose margin discipline and product breadth over blitzscaled brokerage share. Product evidence also

    shows continued expansion after Series D: in February 2025 the company launched a Yard Management System built

    directly into Opendock and linked to NavTrac, extending the platform deeper into warehouse workflows. Customer

    proof is real but selectively disclosed. Official case materials name Stanley Black & Decker, Scotts

    Miracle-Gro, and Ralph Moyle, while many other case studies remain anonymized as Fortune 500 shippers. Public

    scale metrics are less clean than the customer and product story: the company website cites 600+ logistics

    experts, Revelio tracks 505 employees at end-2025, and GetLatka publishes an unverified $108M 2025 revenue

    estimate. Adverse evidence is also non-trivial. Loadsmart faces an active wage-law collective action record, and

    the 2026 Montgomery decision increases negligence-exposure risk for freight brokers nationally, including

    Loadsmart''s managed brokerage operations.'
