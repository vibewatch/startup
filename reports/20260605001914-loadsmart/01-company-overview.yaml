- id: leadership-and-governance
  title: Leadership and Governance
  body: 'Public leadership evidence is strongest around the founders and current operating bench. Craft and other

    profiles identify Felipe Capella as CEO and co-founder and Ricardo Salgado as executive chairman and

    co-founder, while the 2022 Series D release still described the pair as co-CEOs. That sequence suggests a

    post-Series D leadership rebalance rather than founder departure. Beyond the founders, public executive

    listings show an operating bench spanning finance, technology, customer success, managed transportation,

    brokerage sales, and core operations, which reduces pure single-founder execution dependence even though the

    founders still anchor strategy, capital markets narrative, and product direction. The biggest governance gap is

    not who runs day-to-day operations but what outside investors control. Reviewed public sources do not clearly

    disclose board composition, investor information rights, liquidation preferences, or any super-voting share

    structure. That opacity is material because the investor base includes major strategic and financial backers,

    yet outside control rights cannot be evaluated from public sources alone.'
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
  - CO039
  tableRefs:
  - TO002
- id: capital-and-stakeholders
  title: Capital Base and Stakeholders
  body: 'Loadsmart''s most important capital event remains the February 2022 Series D. Official company and interview

    materials align on the round size ($200M), post-money valuation ($1.3B), and lead investor (SoftBank Latin

    America Fund), with BlackRock, Janus Henderson, and CSX also named. That round confirmed Loadsmart''s unicorn

    status and gave management room to expand service lines and software offerings instead of chasing pure brokerage

    volume. The harder question is total capital raised. The official about page says $346.4M raised to date, while

    Tracxn reports $384M over six rounds and even lists a $250M Series D. Because the company itself has not

    reconciled the difference, the prudent view is to anchor on the official number while preserving the higher

    third-party estimate as an unresolved discrepancy. The investor mix is strategically notable: beyond financial

    capital, Loadsmart cites Maersk, Ports America, TFI International, and CSX, implying cap-table relationships

    that overlap with ocean, port, truck, and rail infrastructure. Public sources, however, stop short of

    disclosing which of those relationships carry board seats, commercial exclusivities, or protective rights.'
  claimRefs:
