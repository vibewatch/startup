callouts:
- calloutType: insight
  title: Software attach is the only visible route to better margin quality
  body: The strongest evidence in the public file is not the $108M revenue estimate or the funding history. It is the combination of 3,500+ facilities on Opendock, 10M+ appointments, and customer stories that show measurable operational savings. Those signals suggest Loadsmart’s quality-of-revenue story depends on embedding workflow software around brokerage and managed transportation, not on winning a pure spot-volume race.
