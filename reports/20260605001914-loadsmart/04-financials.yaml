- calloutType: risk
  title: Public profitability is directionally positive but still not underwriteable
  body: A company-defined operating-profitability milestone and an August 2024 cash statement are useful, but they do not substitute for current ARR, gross margin, burn, runway, or debt disclosure. The public file is strong enough to say Loadsmart improved, and too thin to say how durable that improvement is under a downside freight scenario.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI050
- calloutType: risk
  title: Sector history still punishes volume-led digital brokerage models
  body: 'Median brokerage margins near 12%, thousands of broker exits, and the Convoy collapse all point in the same direction: freight-tech platforms do not earn immunity from macro cycles. If Loadsmart’s software attach stalls or its working-capital discipline slips, the market has already shown what can happen to well-funded peers.'
  claimRefs:
  - CI041
  - CI042
  - CI043
  - CI046
  - CI047
  - CI048
