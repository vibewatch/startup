tables:
- id: TI001
  title: Revenue streams table
  notes: Public sources identify revenue streams and ROI hooks, not product-level revenue mix or ACV; all quality judgments are directional and should be confirmed in management materials.
  enumerationScope:
    coverage: partial
    basis: Covers the main revenue surfaces visible across official product pages, launch notes, and customer proof; exact mix percentages and contract terms are not public.
  columns:
  - Revenue stream
  - Mechanism / unit
  - Public signal
  - Revenue quality
  - Diligence ask
  rows:
  - - Managed transportation / consulting
    - Program-management fee, advisory fee, or savings-linked service contract
    - Official page sells up to 20% freight-cost savings and scaling without added headcount
    - Medium-to-high if multi-period service contracts are sticky; unknown without realized pricing
    - Request pricing model by account, renewal rates, and gross margin by managed account
  - - Freight brokerage
    - Spread between shipper price and purchased transportation cost across FTL/LTL/PTL/expedited/drayage/multimodal
    - Instant pricing, guaranteed capacity, dynamic pricing, and Reliable Contracts are publicly marketed
    - Medium-to-low because brokerage margins remain cyclical and market-clearing
    - Request gross margin by mode, contract vs spot mix, and claims-reserve history
  - - ShipperGuide TMS
    - Subscription and implementation revenue tied to planning, procurement, tendering, and visibility workflows
    - Official pages position ShipperGuide as the central shipper workflow system, but publish no ACV
    - Potentially high if recurring and embedded; current public economics unknown
    - Request ARR, implementation fees, and customer count for TMS-only vs bundled accounts
  - - Opendock / YMS / NavTrac
    - Facility-based subscription or workflow software revenue for dock, gate, and yard operations
    - More than 3,500 facilities, 10M+ appointments, and a 2025 YMS launch indicate real software scale
    - Highest-quality visible stream because usage looks recurring and workflow-embedded
    - Request facility ACV, churn, upsell from dock scheduling into YMS, and contribution margin
  - - Audit, analytics, and FreightIntel AI
    - Fee-based analytics, audit-and-pay, and intelligence services
    - Official pages list audit-and-pay and AI, but give no pricing or adoption numbers
    - Medium because offerings may be higher-margin but revenue contribution is not public
    - Request revenue share, attach rate, and gross margin for analytics / audit products
  - - Carrier-side products and factoring
    - Carrier SaaS, loadboard commissions, and financing-related fees
    - CarrierGuide, loadboard, and factoring are listed publicly, but monetization is not explained
    - Unknown; could diversify revenue, but evidence is too thin to score today
    - Request carrier-product revenue, take rates, and credit-loss experience if factoring is material
