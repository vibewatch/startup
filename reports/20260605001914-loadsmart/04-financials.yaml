- id: TI003
  title: Unit economics table
  notes: Loadsmart does not publish ARR by product, gross margin, CAC, or NRR; the table therefore mixes disclosed signals, tracker estimates, and market benchmarks to frame what must still be diligenced.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful unit-economics metrics visible from public sources plus the closest public brokerage benchmark; many cells are intentionally marked unknown because private-company disclosures are absent.
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR signal
    - $108M 2025 revenue estimate from GetLatka; no company-disclosed ARR
    - Low
    - This is the only public top-line revenue datapoint but it is tracker-based, not audited
    - Request monthly recurring revenue, ARR by product, and 24-month growth bridge
  - - Operating profitability
    - Q3 2024 operating profitable; 2024 record-gross-profit trajectory
    - High
    - Shows margin discipline during a weak market, but metric definition is company-specific
    - Request EBITDA bridge, GAAP operating income, and reconciliation to the public claim
  - - Cash support
    - More than $100M cash available in Aug 2024; no 2026 cash disclosure
    - Medium
    - Important sign of past liquidity, but too stale to establish current runway
    - Request current cash, restricted cash, borrowing capacity, and minimum liquidity targets
  - - Headcount proxy
    - 463 GetLatka; 505 Revelio; 600+ official experts
    - Medium
    - Workforce size is the best public proxy for cost base and service intensity
    - Request fully-loaded headcount by function, geography, and product
  - - Broker margin reference
    - 12% median brokerage margin in Dec 2025; 2-4% for bottom quartile loads
    - Medium
    - Frames how much brokerage spread can be squeezed when the market weakens
    - Request actual gross margin by mode and the share of loads below floor margin thresholds
  - - Software attach proxy
    - 3,500+ facilities and 10M+ appointments indicate recurring workflow usage
    - Medium
    - Software adoption is the most visible path to better blended margins and retention
    - Request software ARR, facility count by paid tier, and attach rate into brokerage / managed transportation
  - - Gross margin / contribution margin
    - Not publicly disclosed for Loadsmart; only benchmark evidence is available from public brokers
    - Not disclosed
    - Without stream-level margin data, the quality of the profitability claim cannot be tested
    - Request gross margin by stream plus contribution margin after support and implementation costs
  - - Burn / runway / NRR / concentration
    - Not publicly disclosed
    - Not disclosed
    - These are the core underwriting metrics for a late-stage private logistics platform
    - Request burn, runway, NRR, logo churn, and top-10 customer revenue share
