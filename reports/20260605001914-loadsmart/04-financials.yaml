chapter:
  number: 4
  title: Financials
  summary: 'Loadsmart’s public financial file supports a real but incomplete margin-improvement story. Official sources confirm Q3 2024 operating profitability, a record-gross-profit trajectory, more than $100M of cash available in August 2024, and a software-plus-services mix spanning brokerage, managed transportation, TMS, and Opendock/YMS. But the underwriteable core remains opaque: the only public revenue datapoint is a low-confidence $108M 2025 estimate, official capital totals conflict with tracker totals, FMCSA filings confirm a non-asset broker structure, and sector evidence shows brokerage margins stayed compressed near 12% median in late 2025 while failed digital-broker comps such as Convoy highlight the cost of chasing volume without durable unit economics.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Signals
  body: 'Loadsmart’s public materials support treating the company as a hybrid logistics platform rather than a pure spot broker. The official surface spans managed transportation, instant-quote freight brokerage, ShipperGuide workflow software, Opendock dock scheduling, a newer yard-management layer, and audit-and-pay style back-office services. That breadth matters because the quality of revenue depends on whether software and managed-service contracts can offset the structurally cyclical economics of brokerage spread. The strongest public monetization signals are not list prices but outcomes: managed transportation is sold against up-to-20% freight-cost savings, brokerage is sold around instant booking, guaranteed capacity, dynamic pricing, and transparent-margin contract constructs, and customer proof shows named shippers adopting multiple workflow modules instead of only buying truckload execution. At the same time, realized pricing remains opaque. None of the reviewed official pages
    publishes standard software ACVs, module pricing, implementation fees, or discount ladders. The practical conclusion is that Loadsmart clearly has multiple revenue streams, but the public record still says more about sales narrative and attach strategy than about how much each stream contributes to recurring, high-margin revenue.'
