- id: TI005
  title: Public financial gaps table
  notes: These are the specific missing metrics that still block a normal underwriting process even after the positive 2024 profitability update.
  enumerationScope:
    coverage: partial
    basis: Captures the material financial data requests that remain unresolved after reviewing official pages, filings, trackers, customer proof, and adverse market evidence.
  columns:
  - Missing metric
  - Why it matters
  - Current public signal
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - ARR by product and revenue mix
    - Needed to separate recurring software economics from brokerage spread
    - Only a low-confidence $108M 2025 revenue estimate is public
    - Cannot size high-quality recurring revenue or software attach economics
    - Request product P&L, ARR by module, and monthly recurring-revenue bridge
  - - Gross margin and contribution margin by stream
    - Determines whether profitability came from software leverage, labor cuts, or short-term rate conditions
    - No Loadsmart stream-level margin disclosure; only public broker benchmarks exist
    - Margin quality cannot be underwritten from public data alone
    - Request gross margin, variable cost, and contribution margin by brokerage, managed transportation, TMS, Opendock/YMS, and audit/pay
  - - Cash balance, burn, and runway
    - Core test of financing dependency and downside survivability
    - Only an Aug 2024 statement of >$100M cash is public
    - Current liquidity cannot be assessed in mid-2026
    - Request monthly cash bridge, runway model, and covenant package
  - - Debt, liens, and credit facilities
    - Brokerage working capital can be lender-constrained even when revenue looks stable
    - No public debt schedule surfaced in reviewed sources
    - Capital structure risk remains unresolved
    - Run UCC / lien search and request debt schedules, factoring lines, and insurance collateral arrangements
  - - NRR, churn, and customer concentration
    - The best test of stickiness for software-attached logistics platforms
    - No public NRR or concentration data surfaced
    - Cannot judge whether software attach is durable or concentrated in a few large accounts
    - Request cohort retention dashboards and top-customer revenue share
  - - Realized pricing and contract duration
    - Needed to evaluate pricing power, discounting, and payback dynamics
    - Public pages show value propositions but no ACV, ASP, or contract-length data
    - Pricing power remains narrative rather than underwritten fact
    - Request standard order forms, price lists, and realized pricing waterfalls for top accounts
