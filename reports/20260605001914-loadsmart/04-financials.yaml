- id: TI004
  title: Capital adequacy table
  notes: Funding chronology is visible, but current liquidity and debt are not; this table distinguishes high-confidence historical funding facts from unresolved present-day capital adequacy questions.
  enumerationScope:
    coverage: partial
    basis: Covers the public funding events, filing status, and macro capital pressures relevant to adequacy; current cash, debt, and covenant data remain private.
  columns:
  - Capital item
  - Public evidence
  - Date / freshness
  - Implication
  - Diligence ask
  rows:
  - - Series C financing
    - $90M official Series C announcement
    - 2020-11-20 / historical
    - Confirmed large pre-Series-D capital base
    - Request post-money valuation and use-of-proceeds analysis for Series C
  - - Series D financing
    - $200M official round at $1.3B valuation
    - 2022-02-01 / historical
    - Confirms unicorn-era capitalization and capacity to broaden the platform
    - Request full cap table, liquidation preferences, and investor rights
  - - Official total raised
    - $346.4M on current about page
    - 2026 / current
    - Official anchor for cumulative capital, but methodology is unexplained
    - Request audited capital ledger and reconciliation to every prior round
  - - Tracker totals
    - GetLatka says $309M; Tracxn says $384M
    - 2025-2026 / current
    - Conflicting totals make external benchmarking noisy and weaken confidence in valuation math
    - Reconcile official and tracker counts to signed financing docs
  - - Cash cushion
    - More than $100M cash available per Aug 2024 anniversary release
    - 2024-08-07 / stale
    - Suggests real liquidity at the profitability inflection, but not necessarily in 2026
    - Request current cash bridge and board liquidity pack
  - - Legal operating structure
    - ACTIVE property broker under MC-872918 with zero power units
    - 2026-02-11 / current
    - Supports an asset-light model with lower capex but still meaningful working-capital exposure
    - Confirm claims reserves, carrier-payable terms, and any customer prefunding needs
  - - Freight-cycle backdrop
    - Freight recession still ongoing in 2026; margin pressure only partly easing
    - 2026 / current
    - Macro softness can reopen financing dependence even after a profitability milestone
    - Stress-test liquidity under lower spread / lower volume scenarios
  - - Debt / secured facilities
    - No public debt schedule or UCC-backed facility surfaced in reviewed sources
    - 2026 / unknown
    - Absence of disclosure is not proof of absence; this remains a live diligence gap
    - Run UCC, lien, and debt diligence across every legal entity before underwriting
