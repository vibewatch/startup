- id: TI002
  title: Pricing / monetization table
  notes: This table separates public pricing signals from missing realized-pricing evidence; Loadsmart publishes value propositions and workflow hooks, not list prices or discount schedules.
  enumerationScope:
    coverage: partial
    basis: Covers the public monetization signals visible in official marketing surfaces and benchmark filings; exact contract pricing and customer-specific discounts are unavailable.
  columns:
  - Pricing signal
  - What is public
  - What is missing
  - Implication
  rows:
  - - Managed transportation
    - Up to 20% savings claim plus rapid implementation and assessment workflow
    - Fee model, gain-share terms, minimum volumes, and contract length
    - Strong ROI-led pitch, but no way to translate savings claim into revenue or gross margin
  - - Brokerage quote flow
    - Instant quotes, one-click booking, no price changes, and guaranteed capacity are advertised
    - Average take rate, re-pricing frequency, and realized gross margin by mode
    - Loadsmart is selling convenience and reliability rather than posted list price
  - - Reliable Contracts
    - Transparent margins and 100% PTA are marketed publicly
    - How margin floors, pass-throughs, and downside protections are actually structured
    - Could improve revenue quality if customers accept premium for certainty, but economics are undisclosed
  - - Dynamic pricing inside TMS
    - Dynamic pricing and TMS integrations are marketed as embedded workflow tools
    - Whether pricing is charged as a separate software fee or embedded in brokerage spread
    - Embedded pricing tooling may raise stickiness even if it does not directly increase ACV
  - - Opendock / YMS
    - No public list price; monetization inferred from facility footprint and workflow adoption
    - Facility ACV, module tiers, implementation fees, and cross-sell terms
    - Probably the cleanest recurring software opportunity, but still commercially opaque
  - - Customer proof as pricing proxy
    - Red Gold, Cascades, and GoBolt show measurable savings and efficiency gains
    - Whether those outcomes came from software subscription, brokerage attach, or service labor
    - Realized ROI suggests pricing power exists, but the split across products is unclear
