  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, covenant package, and runway estimate after the 2024 profitability inflection.
    whyItMatters: The public record proves only that Loadsmart had more than $100M of cash available in August 2024; it does not show whether that cushion still exists in mid-2026 or whether freight volatility is reopening financing dependence.
    diligencePath: Request the latest monthly cash bridge, 12-month burn history, board-approved operating plan, and any internal runway scenarios by base / downside / upside case.
    relatedQuestionRefs:
    - QI018
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Any revolving credit facility, factoring line, insurance-backed borrowing, term debt, or UCC-backed working-capital arrangement tied to Loadsmart’s brokerage operations.
    whyItMatters: Brokerage businesses can look profitable at the gross-profit level while still being liquidity-constrained if payables, claims reserves, or lender covenants tighten during a weak freight market.
    diligencePath: Run a formal UCC and lien search across every Loadsmart legal entity, request debt schedules and insurance collateral agreements, and reconcile them to month-end cash reporting.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized pricing, discount ladders, contract length, software ACVs, implementation fees, and attach-rate data by product line.
    whyItMatters: Public value propositions say Loadsmart can save customers money, but without realized pricing and attach rates it is impossible to judge revenue quality, CAC payback, or whether software actually carries the margin burden.
    diligencePath: Request a product-by-product pricing sheet, realized ASP/ACV waterfalls, top-20 customer contract summaries, and attach-rate data for ShipperGuide, Opendock, YMS, and managed transportation.
    relatedQuestionRefs:
    - QI020
    - QI021
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: Net revenue retention, gross retention, logo churn, top-customer concentration, and product-line contribution margin.
    whyItMatters: These are the core underwriting metrics for a hybrid software-and-brokerage business; without them an investor cannot tell whether Loadsmart’s software attach is durable or whether a handful of large accounts carry most of the economics.
    diligencePath: Request cohort retention dashboards, top-10 customer revenue share, product P&Ls, and board materials used to track expansion, churn, and contribution margins.
    relatedQuestionRefs:
    - QI021
    - QI023
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
