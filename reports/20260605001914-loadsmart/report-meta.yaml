companyProfile:
  summary: >
    Loadsmart is a Chicago-based private freight-technology company founded in
    2014 by Felipe Capella and Ricardo Salgado. The company sells a hybrid
    logistics stack spanning managed transportation, ShipperGuide TMS, freight
    brokerage, CarrierGuide, audit-and-pay, and Opendock/YMS tools for
    shippers, carriers, and warehouses. Public evidence shows real operating
    traction: a $200M Series D at a $1.3B valuation in February 2022, Q3 2024
    operating profitability, 4,000+ warehouses on Opendock, and 200+ shippers
    on ShipperGuide. But current economics remain only partly disclosed, with
    conflicting total-raised and workforce figures and no clean public read on
    software mix, margins, or customer concentration.
  foundedDate: "2014-01-01"
  founders:
    - name: "Felipe Capella"
      role: "CEO & Co-Founder"
      background: >
        Law, finance, and strategy background; public face of Loadsmart's
        software-led logistics story.
      claimRefs: [CO012, CO013]
    - name: "Ricardo Salgado"
      role: "Executive Chairman & Co-Founder"
      background: >
        Engineering and finance background; long-range strategy and founder
        continuity anchor for the business.
      claimRefs: [CO012, CO013]
  foundingLocation: null
  headquarters: "Chicago, IL"
  productSummary: >
    Loadsmart offers managed transportation, freight brokerage, ShipperGuide
    TMS, CarrierGuide workflows, audit-and-pay tooling, and Opendock/YMS for
    dock and yard operations, increasingly wrapped with FreightIntel AI and
    automation features.
  customerFocus: >
    Enterprise shippers, carriers, and warehouse or facility operators running
    high-volume freight, dock, and yard workflows.
  businessModel: >
    Hybrid software-and-services model combining brokerage and managed
    transportation revenue with workflow software sold around shipper,
    carrier, and facility operations.
  stage: "Late-stage private (Series D)"
  fundingStatus: >
    $200M Series D at a $1.3B valuation closed in February 2022. Loadsmart's
    about page currently says $346.4M raised to date, while third-party
    trackers publish a higher total near $384M.
  disclosureProfile: "private-undisclosed"
  claimRefs: [CO001, CO003, CO004, CO005, CO010, CO012, CO013, CO016, CO018, CO019, CO023, CE002, CU004]

summary:
  headline: >
    Loadsmart has credible platform breadth and improving operating discipline,
    but limited financial disclosure, freight-cycle sensitivity, and stale
    unicorn pricing keep the investable call at research-more.
  overallScore: 5.7
