- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Product economics
    - ARR, gross margin, and gross profit by brokerage, managed transportation, Opendock, YMS, and other software surfaces
    - This determines whether Loadsmart deserves a blended multiple or only a freight-execution multiple.
    - Management finance package and product P&L bridge.
  - - Capital structure
    - Current cap table, debt schedule, liquidation preferences, and any 409A or secondary mark
    - Headline valuation is not enough without seniority and downside protection.
    - CFO, counsel, and latest board materials.
  - - Customer quality
    - Top-customer concentration, NRR, logo churn, and software attach by cohort
    - A software premium requires durable retention and low concentration risk.
    - Revenue operations export and top-20 customer bridge.
  - - Cash runway
    - Current unrestricted cash, burn or cash generation, and covenant headroom
    - The public cash datapoint is stale and does not clear current financing risk.
    - Cash-flow model and treasury pack.
  - - 2026 pricing evidence
    - Any fresh financing memo, secondary trade, or investor mark since the 2022 round
    - Without a refreshed price signal, investors are comparing a stale private mark to current public comps.
    - Board deck, financing deck, or investor update.
  notes: 'The ask list is intentionally short and IC-oriented: every row is evidence that could move recommendation, confidence, or price discipline materially.'
