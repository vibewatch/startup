- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Lens
  - Current valuation proxy / status
  - Why it matters
  - Limitation
  - Read-through for Loadsmart
  rows:
  - - Loadsmart 2022 Series D
    - Historical private anchor
    - $1.3B valuation on $200M raise
    - Defines the mark many investors will anchor on.
    - It is stale and predates the freight reset.
    - Sets the psychological hurdle, not today's fair value.
  - - C.H. Robinson
    - Public freight broker / 3PL
    - ~1.3x revenue; 14.6% Q1 2026 NAST gross margin
    - Best public benchmark for disciplined freight execution at scale.
    - Pass-through revenue and much larger scale distort direct comparability.
    - Good ceiling for execution-heavy value, not for software upside.
  - - RXO
    - Public freight brokerage
    - ~0.8x revenue; 14.2% Q1 2026 gross margin; 0.4% EBITDA margin
    - Shows how quickly public markets penalize thin brokerage margins.
    - Integration noise and public-company costs make it imperfect.
    - Useful downside reference if Loadsmart is still mostly broker economics.
  - - Hub Group
    - Managed transportation / logistics
    - ~0.7x revenue; brokerage volume down while management prioritizes profit per load
    - Shows that even higher-quality logistics managers emphasize profitability over volume in 2026.
    - Intermodal and logistics mix is broader than Loadsmart's.
    - Supports a conservative blended multiple, not a growth premium.
  - - J.B. Hunt
    - Diversified transport / logistics
    - ~2.2x revenue
    - Provides an upper end for large, higher-quality public execution assets.
    - Scale, brand, and asset mix are far stronger than Loadsmart's.
    - Shows how high public execution multiples can go without implying software-like valuation.
  - - Descartes
    - Public logistics software
    - ~8.9x revenue
    - Anchors the public software end of the range.
    - Recurring software disclosure is far richer than Loadsmart's.
    - Useful only if management proves software-quality economics.
  - - Manhattan Associates
    - Public supply-chain software
    - ~8.1x revenue; 25% RPO bookings growth signal
    - Shows what a premium, well-disclosed logistics-software multiple looks like.
    - Category adjacency is stronger than business-model similarity.
    - Reinforces that software multiples require software disclosure.
  - - project44 2022 round
    - Private logistics software benchmark
    - $2.7B private round
    - Shows that premium private logistics-software marks were still possible in the downturn.
    - Visibility software is cleaner than freight brokerage plus services.
    - Defines a ceiling case, not the base case.
  - - Convoy shutdown / Flexport reset
    - Adverse private precedent
    - Shutdown and valuation-reset evidence rather than a positive multiple
    - Shows how quickly freight-tech equity can lose support when cycle and execution turn.
    - Distressed outcomes are not one-to-one comps for Loadsmart.
    - Supports down-round and opacity penalties in the valuation range.
  notes: This is a selected comparison set rather than an exhaustive industry census. It is designed to bracket Loadsmart between public freight-execution comps, public logistics software comps, and private freight-tech precedents.
