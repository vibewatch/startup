- id: scenarios-and-sensitivity
  title: Bull, Base, and Bear Scenarios
  body: >-
    The bear case assumes Loadsmart still clears largely as a freight broker with some services and software attached, while freight volumes remain soft and current gross-profit mix remains unproven. Under that setup, public evidence supports only roughly $150 million to $250 million of value, which would imply a very severe reset from the old unicorn mark. That is not a prediction that the company is distressed today; it is what happens when brokerage-like multiples meet private-company opacity.


    The base case is more balanced and more relevant. If Loadsmart can sustain profitability, keep software and managed services as a meaningful minority of gross profit, and avoid another freight downdraft, a blended valuation range of roughly $350 million to $550 million looks supportable on public evidence. The bull case requires more than hope: management would need to prove software-quality economics, better disclosure, and durable mix improvement, which is why the bull range of roughly $750 million to $1.05 billion still struggles to clear the historical $1.3 billion reference. The model therefore says upside exists, but only after valuation or diligence terms improve materially.
