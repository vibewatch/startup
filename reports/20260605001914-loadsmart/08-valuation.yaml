- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Freight cycle weakens again
    - Shipment indices keep falling and broker margins remain near late-2025 compression levels
    - Execution-heavy gross profit loses support and the blended lens shifts toward public broker floors.
    - Hold or walk unless the price already reflects a deep reset.
  - - Software proof stays qualitative
    - No module-level ARR, gross margin, or NRR disclosure appears
    - The market cannot justify leaving the freight-broker comp band.
    - Keep recommendation at research-more.
  - - Current financing defends unicorn pricing
    - Management markets any 2025-2026 round near the old $1.3B reference without richer disclosure
    - Entry price outruns public evidence and raises down-round or preference-overhang risk.
    - Treat as a kill trigger for a minority-growth entry.
  - - Cap table proves heavy seniority
    - Debt or liquidation preferences materially subordinate new common-equity upside
    - Public valuation ranges overstate common-equity value.
    - Require a full waterfall before proceeding.
  - - Software economics are proven
    - Management shows durable software mix, healthy retention, and gross margin separation from brokerage
    - The blended lens can shift upward toward software comps.
    - Re-open underwriting at a better-supported price.
  notes: Triggers are intentionally observable and investment-specific; they describe what would invalidate or upgrade the public-only underwriting case.
