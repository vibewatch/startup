- id: entry-discipline-diligence
  title: Entry Discipline, Thesis-Break Triggers, and Final Diligence Asks
  body: >-
    The recommendation is intentionally price-sensitive. On today's public evidence, the right stance is research-more with medium confidence, high risk, and a stretched valuation view. Management has done enough to keep the file interesting: profitability improved, the software story is realer than it was in 2022, and there is no public sign of an immediate liquidity emergency. But none of those points erase the current gaps around product economics, cap-table seniority, customer concentration, and current financing marks.


    What would change the call is equally clear. A materially lower entry point, or a diligence package that proves software-quality ARR, gross margin, retention, and clean capitalization, would make the base-case range more actionable. The thesis breaks if freight weakens again, brokerage margin compression persists, or software contribution stays more narrative than measurable. Until then, the discipline is to keep Loadsmart on the list, but not to pay as though the 2022 unicorn frame is still self-justifying.
