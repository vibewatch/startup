- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range ($M)
  - Probability signal
  - Decision implication
  rows:
  - - Bear
    - Freight stays soft, brokerage economics dominate, software mix remains mostly narrative, and any new round carries heavy reset pressure.
    - $150M-$250M
    - More likely if margins stay near late-2025 pressure levels and no fresh disclosure appears.
    - A round anywhere near the old unicorn mark would look fundamentally unsupported.
  - - Base
    - Profitability holds, software and managed services are real but minority contributors, and investors value Loadsmart on a blended freight-tech lens.
    - $350M-$550M
    - Most consistent with the current evidence package and comp set.
    - Interesting only if valuation resets materially or diligence proves cleaner economics.
  - - Bull
    - Software contribution is proven, 2026 disclosure improves sharply, and the market accepts a premium hybrid or software-like framing.
    - $750M-$1.05B
    - Requires evidence that is not public today.
    - Could justify re-engagement, but still only approaches the old unicorn mark at the upper end.
