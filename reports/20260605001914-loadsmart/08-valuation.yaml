tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Public evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Public evidence supports a real business but not a cleanly defendable unicorn entry today.
    - Do not underwrite a new round near the 2022 mark without private diligence or lower price.
  - - Confidence
    - medium
    - Historical financing, profitability, and software optionality are visible; product economics and cap-table terms are not.
    - Use this as a screening verdict rather than a final IC approval.
  - - Risk rating
    - high
    - Freight-cycle cyclicality combines with private-company opacity and reset precedent.
    - Protect downside first; avoid momentum underwriting.
  - - Valuation stance
    - stretched
    - The 2022 implied multiple screens above both public freight peers and public software peers.
    - Treat any attempt to defend the old mark as valuation risk, not as proof.
  - - Entry discipline
    - <~$600M pre or better disclosure
    - A lower price or audited mix-and-margin disclosure is needed to rebalance upside versus downside.
    - Upgrade only if price falls or disclosure quality rises materially.
  notes: The table summarizes an analyst judgment, not a market quote; the entry threshold is a public-comp-based discipline screen rather than management guidance.
