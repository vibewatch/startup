- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Software optionality
    - Managed transportation, Opendock, and YMS make Loadsmart more than a spot broker.
    - Public sources still do not disclose ARR, gross margin, or retention by software module.
    - Show product-level ARR, gross margin, and customer attach by module.
  - - Profitability
    - Q3 2024 operating profitability and record-gross-profit guidance show better discipline than the 2021-2022 growth era.
    - The freshest public profitability and cash evidence is stale, and the cycle stayed weak into 2026.
    - Provide 2025 audited statements and year-to-date 2026 profitability bridge.
  - - Business model quality
    - Asset-light broker registration and software surfaces create room for a blended valuation lens.
    - Asset-light does not remove working-capital, carrier, or spread risk.
    - Disclose gross-profit mix and cash-conversion dynamics by line of business.
  - - Comparable set
    - A hybrid platform can deserve more than a pure freight-broker multiple.
    - The comp-set mismatch allows investors to overpay by cherry-picking software multiples.
    - Publish enough software-quality metrics to justify leaving the freight-peer band.
  - - Private-market support
    - project44 shows premium private logistics-software marks can exist.
    - Convoy and Flexport show freight-tech marks can reset abruptly when growth or liquidity break.
    - Show a current mark, clean cap table, and disclosure quality closer to public software comps.
  notes: 'The anti-thesis is intentionally adverse and chapter-specific: it focuses on valuation support, not on whether Loadsmart has a real product.'
