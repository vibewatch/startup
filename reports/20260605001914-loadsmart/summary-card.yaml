  topStrengths:
    - >-
      Multi-surface logistics stack spanning managed transportation, TMS, brokerage, dock/yard, audit/pay, and AI
      reduces single-product dependence.
    - >-
      Opendock shows real production adoption with 4,000+ warehouses, 230,000 carriers, and 14M annual appointments,
      while ShipperGuide claims 200+ shippers.
    - >-
      Q3 2024 operating profitability and a disclosed $100M+ cash position in August 2024 suggest stronger discipline
      than many freight-tech peers.
    - >-
      Named customer proof across Stanley Black & Decker, Scotts Miracle-Gro, Red Gold, Cascades, GoBolt, and Ralph
      Moyle supports real enterprise usage.
    - >-
      Strategic investor and ecosystem ties across SoftBank, BlackRock, CSX, Maersk, Ports America, and TFI add
      distribution and credibility potential.
  topRisks:
    - >-
      The historical $1.3B valuation screens well above public freight-execution comps and is difficult to defend
      without materially better current disclosure.
    - >-
      Public evidence is thin on ARR, gross margin, NRR, customer concentration, product-level mix, and current
      cap-table terms.
    - >-
      Freight-cycle volatility, brokerage margin compression, and carrier-liquidity stress can still dominate economics
      if software mix remains minority.
    - 2026 broker-liability precedent and an ongoing wage-law action create real legal and compliance overhang.
    - Product breadth raises implementation, SLA, outage, fraud, AI-output, and partner-dependency risk.
  unresolvedGaps:
    - Current ARR, gross margin, and gross-profit mix by brokerage, managed transportation, and software surfaces.
    - Current cap table, liquidation preferences, debt, and any 2025-2026 financing marks or secondary trades.
    - Top-customer concentration, NRR, logo churn, and software attach rates across major cohorts.
    - Current unrestricted cash, runway, and post-2024 profitability durability.
    - Claims frequency, carrier-vetting reserves, and post-Montgomery liability exposure.
