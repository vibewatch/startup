- id: facility-automation-and-ai-layer
  title: Facility Automation and AI Layer
  body: 'Opendock and its newer yard capabilities are the most concrete evidence that Loadsmart is moving beyond brokerage-adjacent workflow claims into operational software that controls physical processes. Public materials show dock scheduling, driver check-in, yard management, SmartGate camera capture, carrier scorecards, and compliance reporting sitting inside one facility interface, while the 2025 YMS launch and the March 2026 release notes show post-launch iteration around unit-based scheduling, self check-out, BOL signing, search scalability, and technical-debt cleanup. That is a healthy sign: real products ship release notes. The AI layer is more mixed. FreightIntel AI and the older AI CoPilot give Loadsmart a real analytics story, and Copilot Tasks suggests the company is moving from dashboards toward exception execution. But the public proof base is still dominated by vendor-attributed outcome claims and narrative demos, not independently audited accuracy, savings attribution,
    or benchmark studies by module. The right read is that the AI surface is real, yet still easier to believe as workflow augmentation than as a fully proven autonomous moat.'
