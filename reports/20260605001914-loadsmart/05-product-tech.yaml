- id: integration-architecture-and-technical-operating-model
  title: Integration Architecture and Technical Operating Model
  body: 'The technical architecture looks more substantive than Loadsmart’s marketing shorthand suggests. ShipperGuide has a documented API program for both shippers and carriers, with OAuth2 client-credentials authentication, webhooks, OpenAPI documentation, rate limits, and support workflows routed through account management. Carrier-side integrations are more operationally demanding: Loadsmart’s carrier docs distinguish simpler direct carrier integrations from more powerful partner integrations that can impersonate carriers, manage onboarding, submit bids, surface shipment events, and interact with load offers. Opendock has its own technical stack as well, including a Neutron REST API, a Subspace real-time event stream, appointment validation, JWT-based auth, and production versus staging environments. External developer signals matter here because they show the ecosystem Loadsmart expects customers and partners to inhabit. Stacksync markets Loadsmart EDI as a translation-and-compliance
    layer between ERP/WMS systems and Loadsmart, and a third-party Opendock MCP wrapper shows the API is broad enough for community tooling. The implication is clear: Loadsmart has real platform plumbing, but adoption often still depends on integration work rather than turnkey self-serve setup.'
