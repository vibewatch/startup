  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-verification
    missingEvidence: Independent benchmarking or customer-audited evidence for FreightIntel AI savings, Copilot task-resolution quality, and error or rollback rates.
    whyItMatters: AI is a core differentiation claim in Loadsmart’s product story, but current public proof is mostly vendor-attributed and not enough to underwrite autonomy or durable ROI.
    diligencePath: Request customer-level before/after studies, model-governance documents, and sampled workflow logs showing intervention rates, exception resolution quality, and measured savings.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Module pricing sheets, implementation fees, API plan tiers, and sample SOW or order-form structures across ShipperGuide, Managed Transportation, CarrierGuide, and Opendock.
    whyItMatters: Without pricing and packaging detail, the diligence team cannot judge software mix, deployment friction, gross-margin potential, or whether the breadth story translates into usable commercial bundles.
    diligencePath: Request current pricing decks, API commercial terms, implementation statements of work, and recent customer proposals segmented by product and account size.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Product-specific SLA commitments, RPO or RTO targets, uptime history by module, and API throughput or rate-limit ceilings by commercial tier.
    whyItMatters: Managed transportation, carrier execution, and dock-yard workflows are operationally sensitive; missing reliability detail makes it hard to judge whether Loadsmart is enterprise-ready across the full breadth of its stack.
    diligencePath: Request master service schedules, trust-center collateral, incident postmortems, and API plan documentation for ShipperGuide, CarrierGuide, and Opendock.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: module-economics-and-adoption
    missingEvidence: Customer counts, attach rates, renewal rates, and usage distribution by product surface, especially for CarrierGuide, YMS, SmartGate, and FreightIntel AI.
    whyItMatters: The underwriting case depends on whether Loadsmart’s many modules are becoming a coherent suite with real adoption depth rather than a broad but uneven catalog.
    diligencePath: Request product-level cohort data, attach matrices, renewal or churn by module, and facility or carrier activation metrics for the last 12 months.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
