- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Public status
  - Scope
  - Evidence
  - Gap / diligence ask
  rows:
  - - SOC 2 Type II (Loadsmart)
    - Claimed on security page
    - Company-wide products
    - Security page says an independent auditor confirmed SOC 2 Type II
    - Request report scope, testing window, carve-outs, and entity/module coverage
  - - AWS hosting + encryption
    - Claimed on security page
    - Infrastructure and data protection
    - AWS listed as main cloud provider; AES-256-GCM at rest and TLS 1.2+ in transit are stated
    - Request KMS architecture, tenant isolation details, and encryption exceptions if any
  - - 24/7 critical support + public status
    - Partially evidenced
    - Operational support and incident transparency
    - Security page promises 24/7 critical support; status page shows dated incident updates
    - Request product-specific SLA language, escalation commitments, and incident postmortem cadence
  - - Opendock SOC 2 + compliance reporting
    - Claimed on Opendock site
    - Facility workflows and dwell-time / ISR reporting
    - Opendock footer claims SOC 2 Type II; feature set includes compliance reporting
    - Request audit scope for Opendock/SmartGate and examples of customer compliance artifacts
  - - Privacy and location tracking disclosures
    - Explicit in privacy policy
    - Drivers, assets, trucks, web users, and customers
    - Policy covers precise location tracking, diagnostics, and consent responsibilities
    - Request DPA terms, retention schedules, and role separation between shipper/carrier/facility data
  - - AI / automation governance
    - Only lightly public
    - FreightIntel, AI CoPilot, Copilot Tasks, and vision workflows
    - AI functionality is marketed publicly, but no model cards or benchmark governance docs are public
    - Request human-review rules, rollback controls, logging, and error-rate monitoring by workflow
  notes: Trust posture is stronger than average for a private logistics vendor, but still missing the procurement-grade detail needed for enterprise underwriting.
  enumerationScope:
    coverage: partial
    basis: Covers the controls and governance signals explicitly published on public pages or inferable from status/privacy materials; internal audits, pen tests, DPAs, and customer-specific security schedules are not public.
