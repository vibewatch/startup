tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Core workflow
  - Public maturity / status
  - Differentiation / proof point
  - Main diligence gap
  rows:
  - - Managed Transportation
    - Shipper logistics leadership
    - 4PL assessment, design, deployment, and ongoing freight program management
    - Live service offer with published deployment phases and savings claims
    - Services-led wedge plus ShipperGuide-backed tooling for customers not ready for pure software self-management
    - Need contract structures, staffing ratios, renewal data, and module attach by account
  - - ShipperGuide TMS
    - Shippers and transportation teams
    - Procurement, execution, carrier management, audit/dispute, analytics, and data consolidation
    - Established commercial product with 200+ shipper claim and published workflow/ROI narrative
    - Broad freight workflow coverage plus AI and middleware hooks inside one shipper operating layer
    - Need module-level pricing, churn, customer count by segment, and implementation timelines by scope
  - - CarrierGuide / Carrier TMS
    - Carriers and dispatch teams
    - Dispatch, driver/trailer management, load matching, invoicing, and back-office workflows
    - Live carrier product with marketplace and back-office positioning
    - Task/workflow management plus embedded load access and factoring adjacency
    - Need carrier count, retention, monetization split between software and network services
  - - Opendock Dock Scheduling
    - Warehouses, carriers, and dock teams
    - Appointment scheduling, carrier communications, driver check-in, and compliance evidence
    - Scaled product with public warehouse/appointment/carrier counts
    - Self-service dock coordination plus scorecards and event capture in one facility workflow
    - Need customer concentration, SLA metrics, and facility onboarding effort by site type
  - - Opendock YMS / SmartGate / NavTrac
    - Warehouses and yard operators
    - Gate, yard, and asset movement orchestration with vision-assisted capture
    - Recently expanded layer with 2025 launch and 2026 release-note iteration
    - Unified dock-gate-yard workflow and visual proof chain rather than point scheduling alone
    - Need attach rate, sensor/camera requirements, and validated ROI by feature cluster
  - - FreightIntel AI / AI CoPilot / Copilot Tasks
    - Shippers and ops teams
    - Spend analysis, question-answering, and bulk exception handling
    - Real product surfaces with public marketing pages and trade coverage, but proof remains mixed
    - AI layer is embedded into workflow rather than sold as a disconnected assistant
    - Need audited savings, task-resolution accuracy, governance controls, and hallucination/error handling evidence
  notes: Rows summarize concrete public module surfaces and the most decision-useful gaps; commercial depth and usage economics are still materially under-disclosed.
