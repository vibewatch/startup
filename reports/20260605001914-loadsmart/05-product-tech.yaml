callouts:
- calloutType: strength
  title: Workflow unification is the real moat candidate
  body: Loadsmart’s best product asset is not any single module; it is the fact that shipper procurement, carrier execution, and dock-yard operations can share one exception and data loop.
  claimRefs:
  - CE012
  - CE036
  - CE037
- calloutType: risk
  title: Implementation still looks heavier than the marketing implies
  body: OAuth/JWT setup, sandbox provisioning, carrier impersonation, compliance document flows, and EDI middleware are all public signs that customer deployment can be integration-heavy.
  claimRefs:
  - CE019
  - CE020
  - CE022
  - CE038
- calloutType: risk
  title: AI and software breadth need harder proof
  body: Loadsmart has real AI and facility products, but public materials still leave open whether module economics, reliability, and AI outcome claims are strong enough to beat incumbent suites at scale.
  claimRefs:
  - CE029
  - CE030
  - CE043
  - CE044
  - CE045
