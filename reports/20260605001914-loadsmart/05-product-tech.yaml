- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Concrete component
  - Role
  - Dependency
  - Risk / constraint
  rows:
  - - Service delivery layer
    - Managed Transportation teams + ShipperGuide
    - Operationalize shipper programs with people plus tooling
    - Requires customer process adoption and sustained service staffing
    - Can accelerate deployment, but may mask whether software is independently sticky
  - - Shipper orchestration layer
    - ShipperGuide application + APIs
    - Run procurement, execution, carrier management, analytics, and dispute workflows
    - Depends on account provisioning, OAuth credentials, and integrated shipment/order data
    - Customer value falls if integrations lag or data coverage is incomplete
  - - Carrier integration layer
    - Carrier API / Partner API
    - Onboard carriers, manage drivers, surface bids/load offers, and send shipment events
    - Requires sandbox setup, keys, JWT handling, integration requests, and compliance documents
    - Powerful but operationally heavy, especially for multi-carrier partners
  - - Facility execution layer
    - Opendock + Neutron/Subspace/PO Validation
    - Coordinate appointments, events, and validation across docks, gates, and yards
    - Depends on warehouse process changes, JWT auth, and customer/carrier participation
    - Facility adoption can stall if site workflows or data standards vary materially
  - - Ecosystem and middleware layer
    - EDI translation + partner connectors + external tooling
    - Move data among ERP, WMS, TMS, and carrier systems
    - Often relies on external middleware or partner-specific configuration
    - Integration burden may shift to partners instead of disappearing
  - - Analytics and automation layer
    - FreightIntel AI, AI CoPilot, Copilot Tasks
    - Surface savings, answer freight questions, and automate repetitive exceptions
    - Depends on high-quality operational data and safe workflow execution design
    - Public proof is stronger on promise than on independently audited results
  - - Reliability and trust layer
    - AWS, encryption, support, status, privacy controls
    - Provide infrastructure, security, observability, and governance baseline
    - Centralized platform uptime and data-handling discipline are mission critical
    - Public docs still omit module-specific SLAs, RPO/RTO, and throughput ceilings
  notes: The architecture is assembled from official API docs, integration docs, privacy/security pages, and external middleware/developer signals rather than from a single vendor-written architecture whitepaper.
  enumerationScope:
    coverage: partial
    basis: Maps the main operating layers that can be substantiated from public technical docs and product materials; internal services, data stores, model architecture, and non-public partner adapters are omitted.
