- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Loadsmart solution
  - Concrete mechanism
  - Public benefit signal
  - Limitation / risk
  rows:
  - - Run shipper procurement without juggling brokers, spreadsheets, and emails
    - Fragmented quote, bid, and execution handoffs
    - ShipperGuide TMS
    - Centralizes procurement, execution, carrier management, audit/dispute, and integration middleware
    - 35% savings per lane and 83% lower time on rate procurement are marketed outcomes
    - No public price card, module packaging, or independent ROI study by cohort
  - - Scale network management without adding internal headcount
    - In-house teams struggle to keep up with dynamic market conditions
    - Managed Transportation
    - 4PL service wraps assessment, design, deployment, and ongoing operation around Loadsmart tooling
    - Up to 20% freight-cost savings and start-seeing-savings-in-90-days positioning
    - Outcome claims are company-authored and require diligence on staffing model and realized renewal economics
  - - Help carriers digitize dispatch and back office
    - Manual task scheduling, empty miles, and fragmented invoicing
    - CarrierGuide
    - Task-driven TMS with driver/trailer/load management, load matching, accounting, and invoicing
    - Faster load finding, better truck utilization, and marketplace access are core value props
    - Monetization still mixes software with factoring and load access rather than pure SaaS
  - - Coordinate docks, gates, and yards from one facility layer
    - Phone-tag scheduling, manual check-in, and yard blind spots
    - Opendock + YMS
    - Self-service appointments, check-in, drag-and-drop assignments, asset tracking, and SmartGate
    - 4,000+ warehouses and 14M+ annual appointments suggest real operating scale
    - Need harder evidence on uptime, latency, deployment lift, and attach rates for SmartGate/NavTrac
  - - Automate exceptions and analytics across freight data
    - Ops teams work shipment problems one at a time and struggle to extract insight
    - FreightIntel AI + CoPilot / Copilot Tasks
    - Embedded analytics, chatbot-style querying, and bulk exception execution with audit trail
    - Trade coverage repeats 3-15% savings and 10-20% labor-optimization claims
    - Independent validation, model governance, and error-rate evidence are not public
  - - Connect Loadsmart into customer ERP, WMS, TMS, and carrier ecosystems
    - Legacy systems and partner workflows create translation and compliance friction
    - APIs + EDI + partner integrations
    - OAuth/JWT APIs, webhooks, sandbox setup, carrier impersonation flows, and external middleware
    - Documented API program and partner ecosystem make integration possible across many environments
    - The amount of setup detail is itself evidence that implementation is not lightweight
  notes: This table focuses on customer-visible jobs-to-be-done and where public evidence supports or weakens the value proposition.
