- id: FM004
  title: Freight-Tech Adoption Funnel and Value-Chain Map
  type: flow
  layout: wide
  summary: 'Freight-technology adoption follows a workflow sequence from shipper procurement through carrier execution and
    facility throughput. Loadsmart''s product suite spans the full value chain: from rate benchmarking and freight procurement
    (FreightIntel AI, TMS), through carrier selection and tendering (brokerage, managed transport), to appointment scheduling
    and dock execution (Opendock, YMS). Constraints appear at each stage: procurement integration at the buyer level, carrier
    digital gaps in the middle, and labor alignment at the facility level.'
  data:
    nodes:
    - id: shipper_procurement
      label: Shipper Freight Procurement
      detail: Annual carrier bid, RFP, contract award; TMS and managed transport entry point; slow cycle; ERP integration
        required
    - id: spot_execution
      label: Spot Market Execution
      detail: Daily/weekly load matching; brokerage and load board; sensitive to capacity conditions and margin compression
    - id: carrier_tendering
      label: Carrier Tendering and Acceptance
      detail: Auto-tender or manual; carrier connectivity gap (EDI, API, phone) constrains automation rate
    - id: appointment_scheduling
      label: Dock Appointment Scheduling
      detail: Carrier self-schedules via Opendock; replaces phone/email; 60k+ appointments per year at Red Gold
    - id: yard_management
      label: Yard and Gate Management
      detail: YMS tracks trailers, coordinates gate; AI-powered bottleneck prediction; 20% efficiency gain at GoBolt
    - id: freight_audit
      label: Freight Audit and Pay
      detail: Invoice reconciliation; audit catches billing errors; data feeds benchmarking
    - id: freightintel_ai
      label: FreightIntel AI
      detail: Market benchmarking; routing intelligence; performance analytics; cross-product data layer
