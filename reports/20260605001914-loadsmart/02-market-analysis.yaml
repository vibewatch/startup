  title: Buyer and Segment Map — Loadsmart''s Customer Acquisition Logic
  type: flow
  layout: wide
  summary: 'Loadsmart reaches four buyer segments through differentiated entry points: TMS for enterprise and mid-market shippers,
    managed transportation for outsourcing-oriented shippers, dock scheduling for warehouse operators, and carrier tools as
    a supply-side complement. Each segment has distinct procurement ownership and adoption speed, with dock scheduling showing
    the fastest cycles and enterprise TMS the slowest.'
