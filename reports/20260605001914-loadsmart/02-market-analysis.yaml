callouts:
- calloutType: strength
  title: Bundled TMS-plus-managed-transport model aligns with documented shipper demand
  body: 'CH Robinson''s 2025 10-K explicitly states that shippers increasingly want 4PL, managed transportation, and TMS from
    a single provider—precisely the model Loadsmart markets. Dock scheduling ROI is demonstrated in named customer cases (Red
    Gold: 18% throughput gain; Cascades: 63-plant centralization; GoBolt: 20% receiving improvement). These evidence points
    support the bundled platform thesis and suggest the market is structurally moving in Loadsmart''s strategic direction.'
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM006
  - CM016
  - CM017
- calloutType: risk
  title: Freight cyclicality, margin compression, and integration burden are durable structural constraints
  body: 'The 2023–2024 freight recession compressed brokerage revenue. December 2025 brokerage median margin compressed to
    ~12% (Triumph), with 1 in 4 loads at 2–4% margin. Enterprise TMS adoption is slowed by ERP integration complexity (JBF,
    GEP). The mid-2026 freight market remains volatile (FreightWaves). These constraints are not transient: freight cycles
    recur every 3–7 years and brokerage commoditization is structural. Loadsmart''s shift toward software and managed services
    mitigates but does not eliminate these risks.'
  claimRefs:
  - CM019
  - CM020
  - CM023
  - CM037
  - CM038
  - CM039
  - CM040
