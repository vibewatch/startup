  - id: FM001
    title: 货运科技市场规模视角——TMS 共识与数字货运经纪子集
    type: kpi
    layout: wide
    summary: >-
      分析师共识认为，2026 年全球 TMS 软件市场为 $13–23B，并以 10–19% CAGR 增长至 2030–2036 年。数字货运经纪子市场更窄，2026 年全球约 ~$5.2B，CAGR 更温和，为
      5.8%。两个市场都远大于 Loadsmart 当前估计收入，即便按保守渗透率，也意味着可观的可触达空间。
    data:
      items:
        - label: TMS 市场——低位共识（TBRC 2025 基准）
          value: $13.2B
          unit: global 2025
          detail: The Business Research Company 基准；预计 2030 年达到 $25.7B，CAGR 14.1%
        - label: TMS 市场——中位共识（GMI 2026）
          value: $16.3B
          unit: global 2026
          detail: Global Market Insights；2035 年 $40.3B，CAGR 10.6%
        - label: TMS 市场——高位共识（Fortune BI 2026）
          value: $21.3B
          unit: global 2026
          detail: Fortune Business Insights；2034 年 $44.8B，CAGR 9.8%；北美占比 39%
        - label: TMS 市场——最高共识（FMI 2026）
          value: $23.3B
          unit: global 2026
          detail: Future Market Insights；2036 年 $130.4B，CAGR 18.8%；包含 AI 服务扩张
        - label: BRI 离群值（排除在共识之外）
          value: $213.4B
          unit: global 2026
          detail: Business Research Insights；可能包含托管物流服务；未用于纯软件 TAM
        - label: 数字货运经纪（全球）
          value: $5.2B
          unit: global 2026
          detail: GMI；2035 年 $8.6B，CAGR 5.8%；2025 年美国部分约 ~$1.76B
        - label: 北美 TMS 份额
          value: ~39%
          unit: of global TMS
          detail: Fortune BI 2025；按共识区间推算，北美 TMS TAM 为 $5–9B
        - label: Cass 货运支出代理
          value: $37B
          unit: U.S. annual freight spend (Cass clients)
          detail: 每年处理 35M 张发票；仅覆盖大型托运人队列；美国卡车运输总量大得多
    approximationNotes: 所有市场规模数字都是第三方分析师估计，口径各不相同。TMS 共识区间（$13–23B）按机构不同代表纯软件或软件加服务。数字经纪（$5.2B）是一个更窄的独立子市场。BRI 数字按报告保留，但标记为离群值；不应纳入共识区间平均。
