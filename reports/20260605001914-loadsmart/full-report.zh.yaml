  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（$M）
      - 概率信号
      - 决策含义
    rows:
      - - 悲观
        - 货运持续疲软，经纪业务经济性主导，软件结构仍主要停留在叙事层面，任何新一轮融资都承受很强重置压力。
        - $150M-$250M
        - 如果利润率仍接近 2025 年末的受压水平，且没有新披露，悲观情景概率更高。
        - 任何接近旧独角兽估值的新轮次，看起来都缺少基本面支撑。
      - - 基准
        - 盈利能力守住，软件和托管服务真实存在但贡献仍少数，投资者用混合货运科技框架给 Loadsmart 估值。
        - $350M-$550M
        - 最符合当前证据包和可比公司集合。
        - 只有估值明显重置，或尽调证明经济性更干净，才值得关注。
      - - 乐观
        - 软件贡献得到验证，2026 年披露大幅改善，市场接受高溢价的混合平台或类软件叙事。
        - $750M-$1.05B
        - 需要目前尚未公开的证据。
        - 可以支持重新接触，但即便如此，也只有区间上沿接近旧独角兽估值。
    notes: 区间由分析师生成，来自上市可比倍数区间和唯一公开收入估计；不包括任何未披露的高级证券或异常优先权条款。
