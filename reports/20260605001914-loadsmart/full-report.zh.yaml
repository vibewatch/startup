    rows:
      - - Loadsmart
        - 经纪服务 + 托运人工作流 + 码头排程
        - 私营公司；前文中的公开规模指标仍不均衡
        - 需要经纪服务、托管运输和 Opendock 式设施工作流的北美托运人
        - 将经纪执行、托运人软件和码头排程结合
        - 没有 Oracle / SAP / CHR 公开可见的装机基础广度，也未披露可比的承运商规模指标
      - - Uber Freight
        - 数字经纪 + TMS + 采购
        - 大型承运商网络；经纪商接入产品；企业 TMS 覆盖
        - 托运人、经纪商、车主运营商和小车队
        - 市场执行、路径指南、采购、码头排程和支付
        - 定价未披露；赛道拥挤，仍需赢过众多在位者
      - - C.H. Robinson / Navisphere
        - 在位 3PL + 全球 TMS + 托管解决方案
        - Navisphere 上有 83K 托运人和 450K 承运商；引用近 200K 家公司
        - 需要托管运输或 4PL 的全球企业和中端市场托运人
        - 深厚的多式联运 TMS、托管服务和承运商网络
        - UX 和敏捷性可能不如创业公司；软件销售绑定在位运营模式
      - - Echo Global Logistics（货运经纪）
        - 经纪服务 + 托管运输 + TMS
        - 50K+ 服务商；$4B 货运支出议价力；与 ITS 合并后 2025 年收入约 $5.2B
        - 需要多式联运托管运输的北美托运人
        - 承运商采购、多式联运执行和托管服务层
        - 国际控制塔深度不如 Flexport 或 Oracle / SAP 套件公开可见
      - - Flexport
        - 货代 + 控制塔 + 海关 + 卡车运输
        - 获 10K+ 品牌信任；2025 年发布 AI / 控制塔
        - 进口占比高、需要国际编排和海关能力的托运人
        - 工厂到门的编排、报关代理、第三方货运可视性
        - 更偏全球贸易，而非国内码头排程；不是堆场专家
      - - project44
        - 可视性 + 堆场 / 预约管理
        - 每年 1.5B 票货运；1K+ 品牌
        - 大型托运人、LSP 和配送网络
        - 预约预订、堆场编排、可视性和 AI 智能体
        - 不像经纪商或 3PL 那样掌握货运执行
      - - FourKites
        - 可视性 + 堆场 / 码头执行
        - 大型企业可视性覆盖；推进 YardWorks AI / 计算机视觉
        - 入库设施流程复杂的全球托运人
        - 原生联动 ETA 的堆场运营和设施管理
        - 同样，相比经纪商或 4PL，执行控制权有限
      - - Descartes MacroPoint
        - 可视性网络 + 承运商连接
        - Descartes 网络上有 24K+ 客户；MacroPoint 用户数以千计
        - 寻求可视性和跟踪合规的托运人、经纪商、承运商和 LSP
        - 实时可视性、承运商连接和 AI 异常自动化
        - 更像覆盖层，而非端到端托管运输运营商
      - - Emerge
        - 货运采购市场
        - 面向企业的采购平台，支持年度项目、mini-bid 和现货工具
        - 优化合同和现货寻源的托运人
        - 承运商采购、竞标活动、基准对比和市场接入
        - 执行控制有限；依赖接入其他运营栈
      - - 企业 TMS 套件：Oracle / SAP / Blue Yonder / Infios / Trimble
        - 套件型或宽平台在位者
        - 大型企业装机基础和更宽的 SCM 或物流产品组合
        - 围绕 ERP 或编排套件标准化的企业
        - 运输与更宽的计划、执行和网络工作流打包
        - 目前公开证据对码头深度和纯现货经纪实力的刻画不够精确
      - - GoRamp / C3
