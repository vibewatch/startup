      - CV008
      - CV014
      - CV016
      - CV044
      - CV047
      - CV048
      - CV049
      - CV055
      - CV063
      - CV069
      - CV070
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 基于公开可比公司区间和软件上行情景，不同收入与倍数组合下的示意估值结果。
    data:
      items:
        - label: $108M @ 1x 承压经纪商倍数
          value: 108
          detail: 若 Loadsmart 像疲弱货运经纪商一样出清，这是大致下行情形。
        - label: $108M @ 2x 货运同业上沿倍数
          value: 216
          detail: 仍远低于旧独角兽参考。
        - label: $108M @ 4x 混合基准倍数
          value: 432
          detail: 接近公开基准情景中心。
        - label: $108M @ 5x 混合上行倍数
          value: 540
          detail: 需要可信的软件贡献，但不需要完全按 SaaS 估值。
        - label: $108M @ 8x 软件同业倍数
          value: 864
          detail: 即便今天套用软件式倍数，也低于 2022 年估值。
        - label: $120M @ 8.75x 软件乐观倍数
          value: 1050
          detail: 披露更好、软件经济性更干净时的上沿乐观情景。
    approximationNotes: 每条柱都是分析师用公开可比公司区间和唯一公开收入估计得出的 $M 估值结果；不是管理层指引。
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV051
      - CV052
      - CV053
      - CV060
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观和历史参考情景下，仅基于公开信息得出的低位、基准和高位估值结果。
    data:
      items:
        - label: 悲观情景价值（$M）
          low: 150
          base: 200
          high: 250
          unit: $M
          note: 如果周期持续疲弱且软件证据没有改善，估值会按类似经纪业务的区间出清。
        - label: 基准情景价值（$M）
          low: 350
          base: 450
          high: 550
          unit: $M
          note: 混合视角，认可盈利进展和少数软件贡献。
        - label: 乐观情景价值（$M）
          low: 750
          base: 900
          high: 1050
          unit: $M
          note: 需要验证软件收入结构、改善披露，并证明更高质量的收入画像。
        - label: 2022 年独角兽参考（$M）
          low: 1300
          base: 1300
          high: 1300
          unit: $M
          note: 历史私募锚点，不是 2026 年公开公允价值结论。
    approximationNotes: 回报未扣除未来稀释和任何未披露优先证券；该图旨在展示相对支撑区间，而不是精确 DCF。
    claimRefs:
      - CV001
      - CV044
      - CV051
      - CV052
      - CV053
      - CV054
      - CV056
      - CV060
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 视角下的 Loadsmart 当前投资画像：真实平台进展，与价格和证据缺口并存。
    data:
      items:
        - label: 历史价格锚
          value: 4/5
          detail: 非常显眼且很高，可提供有用背景，但本身不是正面因素。
        - label: 软件可选性
          value: 3/5
          detail: 管理运输、Opendock 和 YMS 创造了真实上行可选性。
        - label: 公开披露质量
          value: 1/5
          detail: 没有公开 ARR、产品毛利率、NRR 或优先权堆叠。
        - label: 利润率证据
          value: 2/5
          detail: Q3 2024 盈利是建设性信号，但 2026 年利润率质量证据仍薄。
        - label: 周期背景
          value: 2/5
          detail: 货运数据仍指向一个更奖励纪律、而非增长的市场。
        - label: 可比公司匹配度
          value: 2/5
          detail: Loadsmart 介于货运执行和软件可比公司之间，估值争议因此被拉大。
        - label: 当前进入吸引力
          value: 2/5
          detail: 公司值得关注，但只有在价格更低或披露大幅改善时才具备选择性吸引力。
    claimRefs:
      - CV007
      - CV009
      - CV014
      - CV016
