        title: 产品覆盖面与买方工作流
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的产品资料最适合被读成一套连接起来的工作流栈，而不是单一运输产品。托运方侧，ShipperGuide 被定位为采购、执行、承运人管理、分析、审计和结算的编排层；Managed
              Transportation 则为希望 Loadsmart 一起设计并运营网络的客户，提供服务主导的 4PL 外壳。承运人侧，CarrierGuide
              把覆盖面从托运方控制延伸到调度、货载匹配、开票和后台工作流。场站侧，Opendock 和更新的 YMS/SmartGate 层把 Loadsmart 推入码头、闸口和堆场运营。FreightIntel AI 和
              Copilot Tasks 则横跨这些界面，作为分析和异常自动化叠加层。这种宽度有战略意义，因为它给 Loadsmart 不止一个进入账户的入口；但也意味着本章应评估模块内聚性和实施开销，而不只是 SKU
              标题清单。公开证据支持一个连贯的端到端故事，但不是一个简单故事。
