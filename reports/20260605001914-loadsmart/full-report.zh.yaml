      - number: '7.2'
        title: 货运周期、承运商网络与利润率风险
        blocks:
          - type: paragraph
            body: >-
              核心经济风险在于，即便软件在叙事中越来越重要，Loadsmart 仍然接触一个周期性强、对费率敏感、依赖流动性的货运市场。Loadsmart 自己 2026 年 1 月的评论显示市场摇摆可以有多快：2025
              年末现货费率上冲，随后公司立刻预测 1 月会回吐。独立 2026
              年市场数据让问题更尖锐：拒标率上升，现货费率跑赢合同费率，柴油价格仍高，合规压力让卡车退出道路。在这种环境下，经纪商或托管运输平台必须维持高承运商质量，付款足够快以保持优先交易对手地位，并在采购费率快于销售费率变动时守住毛利率。Loadsmart
              有一些公开缓冲——2024 年 Q3 经营盈利、创纪录毛利指引，以及 2024 年 8 月披露超过 $100 million
              现金——但当前软件占比、营运资本需求，以及承运商和托运方基础内的集中度仍未公开，残余利润率风险因此仍高。
