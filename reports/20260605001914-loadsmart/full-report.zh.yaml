  - id: TV006
    title: 最终尽调问题清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 产品经济性
        - 按经纪、托管运输、Opendock、YMS 和其他软件触点拆分的 ARR、毛利率和毛利
        - 这决定 Loadsmart 值得混合倍数，还是只能拿货运执行倍数。
        - 管理层财务包和产品 P&L 桥接。
      - - 资本结构
        - 当前股权结构表、债务明细、清算优先权，以及任何 409A 或老股交易估值
        - 缺少高级权利和下行保护时，表面估值不够。
        - CFO、法律顾问和最新董事会材料。
      - - 客户质量
        - 头部客户集中度、NRR、logo 流失和按队列拆分的软件挂载
        - 软件溢价需要持久留存和低集中度风险。
        - 收入运营导出和前 20 大客户桥接。
      - - 现金跑道
        - 当前无限制现金、烧钱速度或现金生成，以及契约余量
        - 公开现金数据点已经过时，无法排除当前融资风险。
        - 现金流模型和资金包。
      - - 2026 年定价证据
        - 2022 年轮次之后的任何新融资备忘录、老股交易或投资者估值标记
        - 没有更新价格信号，投资者只能拿过时私募估值对比当前上市可比公司。
        - 董事会材料、融资材料或投资者更新。
    notes: 问题清单刻意保持简短、面向投委会：每一行都是可能实质改变建议、信心或价格纪律的证据。
