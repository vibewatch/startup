      - number: '5.4'
        title: 信任、数据治理与可靠性
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的信任姿态比许多私营物流软件同行披露得更好，但仍不足以支撑低强度技术尽调。最强的公开控制明确可见：Loadsmart 称其符合 SOC 2 Type II，运行在 AWS 上，使用
              AES-256-GCM 加密静态数据、使用 TLS 1.2+ 加密传输中数据，并为关键问题提供 24/7 支持。Opendock 网站也单独声称 SOC 2 Type
              II，并提供场站专属合规报告。隐私资料比营销页面更有信息量，因为它清楚显示平台的数据密度：精确位置追踪、资产追踪、卡车诊断，以及在需要时由客户负责取得司机或客户同意。公开状态页也是一个有用信号，因为它证明
              Loadsmart 愿意公开呈现事件更新，但也凸显对集中式可用性的依赖。仍缺失的是采购中真正重要的企业级细节：特定产品 SLA、RPO/RTO 承诺、模块可用性历史、API
              吞吐上限，以及按界面拆分的透明数据留存时间表。
