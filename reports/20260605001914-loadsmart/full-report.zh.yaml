      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              悲观情景假设 Loadsmart 主要仍按货运经纪商来出清，只附带一些服务和软件，同时货运量保持疲弱，当前毛利组合仍未得到证明。在这个设定下，公开证据只支持约 $150 million 到 $250
              million 的价值，相比旧独角兽标记意味着非常剧烈的重置。这不是预测公司今天陷入困境；而是经纪商式倍数碰上私营公司不透明时会发生的结果。


              基准情景更平衡，也更有相关性。如果 Loadsmart 能维持盈利，让软件和托管服务保持为毛利中有意义的少数部分，并避开另一轮货运下行，那么基于公开证据，约 $350 million 到 $550 million
              的混合估值区间可以支撑。乐观情景需要的不只是希望：管理层必须证明软件质量经济性、提供更好披露，并让组合改善变得持久；因此约 $750 million 到 $1.05 billion 的乐观区间仍难越过历史
              $1.3 billion 参考点。模型给出的结论是，上行空间存在，但只有在估值或尽调条款明显改善后才成立。
