  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 流程
      - 具体组件
      - 作用
      - 依赖
      - 风险 / 约束
    rows:
      - - 服务交付层
        - Managed Transportation 团队 + ShipperGuide
        - 用人员加工具把托运人项目落地
        - 需要客户采纳流程，并持续投入服务人员
        - 能加快部署，但也可能遮住软件本身是否有独立黏性
      - - 托运人编排层
        - ShipperGuide 应用 + API
        - 跑采购、执行、承运商管理、分析和争议处理流程
        - 依赖账号开通、OAuth 凭证，以及已集成的运单 / 订单数据
        - 集成滞后或数据覆盖不完整，客户价值就会下降
      - - 承运商集成层
        - Carrier API / Partner API
        - 接入承运商、管理司机、展示报价 / 货运机会，并发送运输事件
        - 需要沙盒设置、密钥、JWT 处理、集成申请和合规文件
        - 能力强，但运营负担重，尤其是多承运商伙伴
      - - 场站执行层
        - 码头工作流：Opendock + Neutron/Subspace/PO Validation
        - 在码头、闸口和堆场之间协调预约、事件和校验
        - 依赖仓库流程调整、JWT 认证，以及客户 / 承运商参与
        - 站点流程或数据标准差异大，场站落地就可能卡住
      - - 生态与中间件层
        - EDI 转换 + 伙伴连接器 + 外部工具
        - 在 ERP、WMS、TMS 和承运商系统之间搬运数据
        - 经常依赖外部中间件或伙伴专属配置
        - 集成负担可能只是转移给伙伴，并没有消失
      - - 分析与自动化层
        - AI 产品：FreightIntel AI、AI CoPilot、Copilot Tasks
        - 呈现节省机会、回答货运问题，并自动处理重复异常
        - 依赖高质量运营数据和安全的流程执行设计
        - 公开证据更能证明承诺，独立审计结果不足
      - - 可靠性与信任层
        - AWS、加密、支持、状态页、隐私控制
        - 提供基础设施、安全、可观测性和治理基线
        - 集中式平台的在线率和数据处理纪律是关键任务
        - 公开文档仍缺少模块级 SLA、RPO/RTO 和吞吐上限
    notes: 该架构并非来自单一供应商撰写的架构白皮书，而是由官方 API 文档、集成文档、隐私 / 安全页面，以及外部中间件 / 开发者信号拼出。
