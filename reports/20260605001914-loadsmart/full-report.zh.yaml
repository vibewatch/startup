      - number: '4.4'
        title: 周期压力与基准经济性
        blocks:
          - type: paragraph
            body: >-
              反向材料足以阻止对 Loadsmart 盈利声明作出自满解读。C.H. Robinson 2025 年 10-K
              是最清楚的公开基准，说明一家规模化、资产轻经纪商如何赚钱：利润本质上是托运方定价与外购运输之间的价差，托运方合同费率通常期限很短，即便面对合同客户业务，大量整车采购仍是现货。这正是为何周期后段货运数据重要。Triumph
              报告 2025 年 12 月全国经纪中位利润率压缩到约 12%，最弱四分位货载只赚 2% 至 4% 利润率。Truckstop 2026
              年调查进一步说明，经纪商正在把利润率置于收入增长之上；只有在货量本身已无法覆盖资本成本的市场里，这种选择才理性。Cox 把货运衰退描述为一场始于 2022 年、到 2026
              年仍非需求驱动的下行。对私营公司的穿透读法并不舒服：Loadsmart 可以用软件改善结构，但其经纪和托管运输界面仍处在一个价格敏感、运力驱动、且容易出现突然营运资本波动的市场里。
