  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Loadsmart 最重的剩余风险集中在经纪商责任 / 合规变化、货运周期带来的利润率压力，以及仍然嘈杂的运营面。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: 经纪商合规 / 法律责任
          values:
            - label: 中高
              tone: warning
              detail: Montgomery 和 FMCSA 保证金规则都是 2026 年已生效的变化，不是假设性风险。
            - label: 高
              tone: negative
              detail: 不利诉讼或保证金提款会同时冲击保险、营运资本和客户信任。
            - label: 中
              tone: warning
              detail: 合同和记录留存义务已经存在，但公开的准备金和筛查细节很薄。
            - label: 高
              tone: negative
              detail: 在当前索赔和保险安排变清楚前，剩余风险仍处高位。
        - label: 货运周期 / 利润率压缩
          values:
            - label: 高
              tone: negative
              detail: 现货和合同市场仍快速变化，柴油成本也依然高。
            - label: 高
              tone: negative
              detail: 若经纪业务经济性仍然重要，利润率下滑可能反噬软件叙事。
            - label: 中
              tone: warning
              detail: 2024 年经营盈利是真实进展，但当前软件收入结构仍不透明。
            - label: 高
              tone: negative
              detail: 收入结构和客户集中度仍属私密信息时，剩余严重性仍高。
        - label: 承运人网络 / 流动性
          values:
            - label: 中高
              tone: warning
              detail: 承运人现金流、安全执法和付款条款都会塑造可用运力。
            - label: 高
              tone: negative
              detail: 覆盖失败或慢付款摩擦会直接影响服务水平和采购运价。
            - label: 中
              tone: warning
              detail: QuickPay 和广泛网络有帮助，但付款经济性和流失率未披露。
            - label: 高
              tone: negative
              detail: 网络在公开层面仍强，但当前韧性没有外部验证。
        - label: 技术 / 安全 / 欺诈
          values:
            - label: 中
              tone: warning
              detail: 状态页事故和盗窃 / 欺诈证据显示了真实运营暴露。
            - label: 高
              tone: negative
              detail: 数据泄露或长时间宕机会同时损害经纪执行和软件可信度。
            - label: 中低
              tone: warning
              detail: 安全条款、状态报告和 AI 控制已经存在，但公开 SLA 深度有限。
            - label: 中高
              tone: warning
              detail: 在恢复指标、事后复盘和子处理方细节披露更充分前，剩余暴露仍有实质意义。
        - label: 竞争 / 集中度
          values:
            - label: 中
              tone: warning
              detail: Oracle、Uber Freight 和 project44 持续投入，而 Loadsmart 的客户组合仍未公开。
            - label: 高
              tone: warning
              detail: 少数账户流失或软件绑定走弱，都可能压低收入质量和估值。
            - label: 中
              tone: neutral
              detail: 公开引用和 Gartner 认可显示了一定市场牵引力。
            - label: 中高
              tone: warning
              detail: 剩余严重性来自隐藏的集中度和资金更充足的替代方案，而不是毫无牵引力。
