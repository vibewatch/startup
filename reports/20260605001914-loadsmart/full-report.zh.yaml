      - number: '7.4'
        title: 竞争、集中度、资本灵活性与否决标准
        blocks:
          - type: paragraph
            body: >-
              剩余风险堆栈的核心，不是 Loadsmart 是否有真实产品，而是这些产品是否足够可防守，能在震荡的货运周期里支撑企业续约和类似软件的估值倍数。Gartner
              认可和具名客户显示真实市场牵引力，但公开客户证据仍集中在相对少数 logo 和案例研究模式里，而不是已披露的续约或集中度指标。同时，资金充足的竞争对手还在推进：Uber Freight 正在现代化其 TMS
              和月台功能，Oracle 仍是 Gartner 领导者且拥有庞大企业覆盖，project44 继续自动化预约管理。Loadsmart
              熬过早期数字经纪商洗牌、并拥有更广物流技术栈，是真实加分项，但投资判断仍需要明确的否决标准。如果担保或疏忽选择风险带来负面意外，如果软件可靠性恶化快于公司记录，如果承运商流动性削弱网络质量，或如果隐藏客户集中度让当前估值支撑比
