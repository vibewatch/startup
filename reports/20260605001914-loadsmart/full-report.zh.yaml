  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与格局
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 跨越多个相邻的货运科技市场，而不是落在一个边界清楚的单一赛道里。最宽的伞形市场是运输管理系统（TMS）市场，涵盖帮助企业在运输网络中计划、执行、监控和优化货物流动的软件。TMS
              内部或相邻位置还嵌着数字货运经纪平台——用算法匹配托运方与承运人的工具——以及码头预约和堆场管理软件；Loadsmart 通过
              Opendock、其堆场管理系统（YMS）和托管运输产品切入这些环节。Loadsmart 的托运方页面明确列出五项核心买方产品：托管运输、ShipperGuide TMS、货运经纪、FreightIntel
              AI，以及码头与堆场解决方案，并把它们定位为一层统一的物流运营系统，用来替代电子邮件、电话和电子表格工作流。


              底层货运经济足够大，能支撑这个市场。按收入计，公路卡车约占美国货运总量的 70%；Cass Freight Index 每年代表数百家大型托运方处理 3500 万张商业发票和 $37B
              支出。承运人基础在结构上高度分散：FMCSA 数据显示，美国有 2,075,020 家注册承运人和 9.2M+ 名 CDL
              司机，绝大多数是小车队。这种分散既是市场机会，也是约束——小型承运人采用数字工具更慢，也更难接入自动发单工作流。


              分析机构对 TMS 市场边界定义不同，五家已审阅研究机构给出的 2026 年估算落在 $13.2B 至 $23.3B 之间（不含一个 $213B
              离群值，后者似乎纳入了托管服务和相邻垂直领域）。数字货运经纪子市场范围更窄，2025–2026 年全球规模估计为 $5.2B，美国约 $1.76B。码头预约和堆场管理多数研究机构没有单独测算，但它嵌在 TMS
              和供应链可视化市场中；Loadsmart 引用 3,500+ 个场站使用 Opendock，证明即使市场尚未达到均衡，这个细分也已有实质采用潜力。
