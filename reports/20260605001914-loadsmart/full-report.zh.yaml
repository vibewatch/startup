          detail: 年度承运商投标、RFP、合同授予；TMS 和托管运输切入点；周期慢；需要 ERP 集成
        - id: spot_execution
          label: 现货市场执行
          detail: 日 / 周度货物匹配；经纪和货运板；对运力条件和利润率压缩敏感
        - id: carrier_tendering
          label: 承运商发标与接受
          detail: 自动派单或手工派单；承运商连接缺口（EDI、API、电话）限制自动化率
        - id: appointment_scheduling
          label: 月台预约排程
          detail: 承运商通过 Opendock 自助排程，替代电话 / 邮件；Red Gold 每年处理 60k+ 次预约
        - id: yard_management
          label: 堆场与闸口管理
          detail: YMS 跟踪挂车、协调闸口；AI 预测瓶颈；GoBolt 效率提升 20%
        - id: freight_audit
          label: 货运审计与支付
          detail: 发票对账；审计捕捉计费错误；数据回流基准对标
        - id: freightintel_ai
          label: FreightIntel AI
          detail: 市场基准对标；路线智能；绩效分析；跨产品数据层
      edges:
        - from: shipper_procurement
          to: spot_execution
