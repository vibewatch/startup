    summary: Loadsmart 在工作流统一处显得最强；在定价、可靠性或自动化结果证明披露不足处显得最弱。
    claimRefs:
      - CE012
      - CE028
      - CE038
      - CE043
      - CE044
      - CE045
    data:
      columns:
        - 公开可见成熟度
        - 集成深度
        - 关键风险
      rows:
        - label: 托管运输
          values:
            - label: 已成型
              tone: positive
              detail: 已发布部署阶段和服务主导的运营模型。
            - label: 中等
              tone: neutral
              detail: 有 ShipperGuide 支撑，但仍由客户互动驱动，而不是自助式。
            - label: 经济性不透明
              tone: risk
              detail: 缺少公开定价、人员杠杆和续约数据。
        - label: ShipperGuide TMS
          values:
            - label: 已成型
              tone: positive
              detail: 工作流覆盖广，并有客户和 ROI 营销信号。
            - label: 强
              tone: positive
              detail: API 文档、webhook、OAuth 和中间件叙事都很明确。
            - label: 实施负担
              tone: risk
              detail: 访问和集成看起来仍由销售和客户经理居中协调。
        - label: CarrierGuide
          values:
            - label: 已成型
              tone: positive
              detail: 真正面向承运商侧的 TMS，带市场和后台工作流。
            - label: 中等
              tone: neutral
              detail: 与货载和 EDI 邻接性好，但伙伴证据更薄。
            - label: 货运敞口
              tone: risk
              detail: 变现仍把软件、网络和保理经济性混在一起。
        - label: Opendock / YMS
          values:
            - label: 扩张中
              tone: positive
              detail: 披露的设施覆盖大，加上 2025-2026 年发布和迭代节奏。
            - label: 强
              tone: positive
              detail: API、实时事件和验证协议都有文档。
            - label: 运营成熟度
              tone: risk
              detail: 发布说明仍强调清理、缺陷修复和可扩展性工作。
        - label: AI / 分析层
          values:
            - label: 真实但早期
              tone: neutral
              detail: FreightIntel AI、CoPilot 和 Copilot Tasks 都是公开产品。
            - label: 依赖数据
              tone: risk
              detail: 输出质量取决于已集成的客户和承运商数据。
            - label: 证明缺口
              tone: risk
              detail: 独立准确率、节省和治理证据都偏薄。
        - label: 信任 / 可靠性姿态
          values:
            - label: 高于私营供应商平均水平
              tone: positive
              detail: SOC 2、加密、隐私、支持和公开状态信号都可见。
            - label: 中等
              tone: neutral
              detail: 公司和设施产品都有治理界面。
            - label: 仍需企业级尽调
              tone: risk
              detail: 没有按模块披露公开 SLA、RPO/RTO 或吞吐细节。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开案例显示，Loadsmart 最常从手工排程或货运波动痛点切入，然后扩张到承运商自助、分析和相邻工作流。
