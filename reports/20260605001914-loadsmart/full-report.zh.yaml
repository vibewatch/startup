              轮后的领导分工再平衡，而不是创始人离开。创始人之外，公开高管名单显示，公司在财务、技术、客户成功、托管运输、经纪销售和核心运营上都有运营班底；即便创始人仍然主导战略、资本市场叙事和产品方向，公司对单一创始人执行的依赖也有所降低。最大的治理缺口不在谁管日常运营，而在外部投资者掌握什么控制权。已审阅的公开来源没有清楚披露董事会构成、投资者信息权、清算优先权，或任何超级投票股结构。这个不透明点很重要，因为投资者基础包括大型战略与财务投资方，但仅靠公开来源无法评估外部控制权。
