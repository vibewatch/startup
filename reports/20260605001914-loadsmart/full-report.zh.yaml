companyProfile:
  summary: >
    Loadsmart 是一家总部位于芝加哥的私营货运科技公司，2014 年由 Felipe Capella 和 Ricardo Salgado 创立。公司向托运方、承运人和仓库销售一套混合物流栈，覆盖托管运输、ShipperGuide
    TMS、货运经纪、CarrierGuide、审计与支付，以及面向码头和堆场的 Opendock/YMS 工具。公开证据显示其运营牵引力真实：2022 年 2 月以 $1.3B 估值完成 $200M D 轮融资、2024 年 Q3
    达到经营盈利、Opendock 接入 4,000+ 个仓库、ShipperGuide 服务 200+ 家托运方。但当前经济性仍只披露了一部分，累计融资和员工数存在冲突，也没有公开资料能干净拆出软件收入占比、利润率或客户集中度。
