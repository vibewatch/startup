        - API + EDI + 伙伴集成
        - OAuth/JWT API、webhook、沙盒设置、承运商身份模拟流程和外部中间件
        - 已成文的 API 计划和伙伴生态，让多种环境下的集成具备可行性
        - 设置细节本身就说明实施并不轻
