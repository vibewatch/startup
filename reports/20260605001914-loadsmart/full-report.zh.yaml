              最好的公开收入质量证据是间接的。Loadsmart 2024 年 10 月公告在方向上重要，因为它称公司 2024 年 Q3
              达到经营盈利，并预计全年毛利润创纪录，暗示管理层在疲软市场中选择利润率纪律，而不是货运量炫耀权。公开收入数据点本身弱得多：GetLatka 估计 2025 年收入
              $108M，但这个数字不是公司披露，也未审计。员工信号指向一门在盈利拐点后仍偏运营人力密集的业务。Revelio 显示员工数 2023 年至 2024 年明显下降，2025 年趋稳；Unify
              的部门结构仍偏向销售、支持和工程，而不是精简自助 SaaS 模式。客户证明是公开资料中最建设性的一部分。Red Gold、Cascades 和 GoBolt 显示吞吐量、提前期和效率有可衡量改善；Opendock
              的规模声明也表明 Loadsmart 正用更粘的软件界面变现工作流痛点。这个信号改善了故事质量，但没有解决核心承销问题：没有公开来源披露按产品拆分的 ARR、按收入流拆分的毛利率，或净留存。
