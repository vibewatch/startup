      - number: '6.4'
        title: 留存、评价信号与耐久性
        blocks:
          - type: paragraph
            body: >-
              公开留存证据是间接的。最强代理指标来自规模化仓库部署和重复运营使用：Cascades 的 63 个站点、Red Gold 的 25,000 多个自动招标货运单、Glazer’s 的 11 个配送中心、IAP
              的正式流程纪律，以及 Opendock 相对其他组合产品更高的评价量。独立评价页面整体偏正面：Gartner 给 Loadsmart 4.3 分，服务与支持尤其好；G2 显示 74 条 Opendock 评价和
              24 条 ShipperGuide 评价；Software Advice
              强调易用性和承运商自助排期的明确收益。但这些评价渠道也暴露重要摩擦——卡顿、支持响应慢、重复货运单、即时报价不准，以及承运商偶发误用排期。SourceForge
              上面向承运商的反向市场评价严厉得多，但样本少且时间更早，更像是服务质量差异的警示，而不是企业 SaaS 流失的干净读数。最关键的是，公开来源没有披露 NRR、GRR、logo
              流失或合同期限，所以耐久性仍靠代理指标，而不是已披露的留存经济学。
