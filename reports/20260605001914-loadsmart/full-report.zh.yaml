      - number: '2.2'
        title: 市场规模——多重口径与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              五家独立研究机构发布了 2026 年 TMS 市场估算，数字差异很大——共识区间从 $13.2B（TBRC）到 $23.3B（FMI），BRI 则给出 $213.4B
              的极端离群值，几乎可以确定是因为市场定义更宽，把托管运输服务、物流外包或货运支出总额，而非纯软件收入，纳入了口径。剔除 BRI 离群值后，2026 年全球 TMS 软件市场的中心共识大约是 $16–21B；取决于
              CAGR 假设，分析师预测 2030–2036 年终局规模在 $25.7B 至 $130B
              之间。区间很宽，反映的是范围定义差异：有些机构只纳入云托管和本地部署许可，另一些还叠加服务合同、集成和托管交付组件。五个来源在方向上只有一个共同结论：在供应链数字化、AI
              采用和电商物流复杂度推动下，市场正以双位数 CAGR 增长。


              数字货运经纪子市场更小，增速也更慢。GMI 估计全球市场 2026 年为 $5.2B，到 2035 年为 $8.6B，CAGR 为 5.8%——明显慢于 TMS 增长。美国部分 2025 年约
              $1.76B。这个温和增速反映结构性挑战：数字经纪平台必须在价格上与传统经纪商和自有资产承运人竞争，而后两者已经掌握可信任的托运方关系。Triumph 2025 年 12 月数据显示，全国经纪中位利润率压缩到约
              12%，四分之一货载只有 2–4% 利润率。这种利润率环境压制纯数字经纪商的收入质量，也强化了 Loadsmart 转向软件+服务打包的战略逻辑。


              按 Fortune Business Insights，2025 年北美约占全球 TMS 市场 39.1%，意味着在全球共识区间内，北美 TAM 大约为 $8–9B。对 Loadsmart 来说，SAM
              更窄：它主要服务美国托运方和场站，覆盖整车、LTL 和联运，码头预约则增加一块相邻市场。Cass Freight Index（处理 $37B 支出）和 C.H. Robinson 2025 年
              10-K（75,000 名客户、450,000 家合同承运人）一起框出了货运科技平台争相数字化的货运市场运营规模。
