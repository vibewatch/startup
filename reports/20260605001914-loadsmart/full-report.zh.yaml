  - id: FI001
    title: 收入模型桥
    type: flow
    layout: standard
    summary: 这条定性桥把托运人工作流痛点连接到 Loadsmart 的经纪、托管服务和软件收入组合，并突出质量更高的毛利可能来自哪里。
    approximationNotes: 没有公开来源披露收入结构百分比，因此该图展示有文件支持的机制，而不是量化拆分。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI023
      - CI024
      - CI049
    data:
      nodes:
        - label: 托运人计划与采购痛点
          detail: Loadsmart 卖给客户的是更低货运支出、集中采购和工作流自动化，而不是某个单一运输方式产品。
          tone: neutral
        - label: 经纪执行收入
          detail: 即时报价、保证运力和动态合约把整车及相邻模式里的执行和价差管理变现。
          tone: neutral
        - label: 托管运输费用
          detail: 专属 4PL 式服务团队和评估项目，目标是把节省计划和物流管理变现。
          tone: positive
        - label: 工作流软件订阅
          detail: ShipperGuide、Opendock、YMS 及相关工具，在公开文件中构成最清晰的经常性软件界面。
          tone: positive
        - label: 外采运输加服务人力
          detail: 非资产经纪商在毛利落袋前，仍要承担承运商采购成本、支持人力和实施负担。
          tone: negative
        - label: 混合毛利与经营结果
          detail: 只有软件附加和有纪律的价差增长跑赢货运执行波动，公开盈利能力才会改善。
          tone: positive
