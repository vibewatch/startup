            body: >-
              Opendock 及其较新的堆场能力，是 Loadsmart 从经纪相邻工作流叙事走向控制物理流程的运营软件的最具体证据。公开材料显示，码头预约、司机签到、堆场管理、SmartGate 摄像头采集、承运人
              scorecards 和合规报告被放在同一个场站界面里；2025 年 YMS 发布和 2026 年 3 月发布说明也显示，发布后公司围绕按单元排期、自助签出、BOL
              签署、搜索可扩展性和技术债清理持续迭代。这是健康信号：真正的产品会发布说明。AI 层更复杂。FreightIntel AI 和较早的 AI CoPilot 给 Loadsmart 一个真实分析故事，Copilot
              Tasks 也说明公司正从仪表盘走向异常执行。但公开证明基础仍主要由供应商归因的结果声明和叙事演示构成，而不是独立审计的准确率、节省归因或按模块的基准研究。正确读法是：AI
              界面真实存在，但作为工作流增强更容易相信；作为完全证明的自主护城河，证据还不够。
