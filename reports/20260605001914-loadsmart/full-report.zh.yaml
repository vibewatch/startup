        - Loadsmart 卖的是便利性和可靠性，而不是公开标价
      - - Reliable Contracts
        - 公开营销透明毛利和 100% PTA
        - 毛利底线、成本转嫁和下行保护如何实际设计
        - 如果客户愿意为确定性付溢价，收入质量可能改善，但经济性未披露
