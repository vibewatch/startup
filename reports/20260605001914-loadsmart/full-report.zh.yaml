  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              公开材料支持把 Loadsmart 看成混合物流平台，而不是纯现货经纪商。官方界面覆盖托管运输、即时报价货运经纪、ShipperGuide 工作流软件、Opendock
              码头预约、较新的堆场管理层，以及审计与支付式后台服务。这个宽度很重要，因为收入质量取决于软件和托管服务合同能否抵消经纪价差结构上的周期性经济性。最强的公开货币化信号不是价目表，而是结果：托管运输围绕最高 20%
              货运成本节省来销售；经纪围绕即时预订、保证运力、动态定价和透明利润率合同结构来销售；客户证据显示，具名托运方采用多个工作流模块，而不是只购买整车执行。同时，已实现定价仍不透明。已审阅的官方页面没有任何一个发布标准软件
              ACV、模块定价、实施费或折扣阶梯。实际结论是，Loadsmart 显然有多条收入流，但公开记录对销售叙事和附加销售策略说得更多，对每条收入流贡献多少经常性、高利润收入说得更少。
