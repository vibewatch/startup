chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与平台
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 对外定位不是单一经纪产品，而是一家物流解决方案和货运科技公司，靠软件+服务组合服务托运方、承运人和仓库。当前官网和
              关于页面把公司放在三大运营界面上：面向托运方的工作流，包括托管运输、ShipperGuide TMS、货运经纪和 FreightIntel AI；面向承运人的工作流，包括
              CarrierGuide/CarrierTMS 和货源板访问；以及面向场站的工作流，包括 Opendock、堆场可视化和闸口管理。这个定位很关键：后续章节不应把 Loadsmart
              看成单点数字经纪商，而应把它当作一层整合式运输运营系统，覆盖计划、执行、码头、堆场和审计流程。公开市场数据资料一致把公司列为私营 D 轮阶段；官网还继续强调企业级集成深度、AI
              分析和不断扩大的码头与堆场产品版图。具名客户材料和资源中心内容显示，这套软件栈与托管执行一起销售，强化了公司的说法：差异化来自软件驱动的物流运营，而不是靠补贴堆出来的货运量。
