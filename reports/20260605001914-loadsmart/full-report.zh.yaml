      - number: '5.2'
        title: 集成架构与技术运营模式
        blocks:
          - type: paragraph
            body: >-
              技术架构比 Loadsmart 的营销简写更实在。ShipperGuide 有面向托运方和承运人的 API 计划文档，包含 OAuth2 client-credentials
              认证、webhooks、OpenAPI 文档、速率限制，以及通过客户经理路由的支持工作流。承运人侧集成在运营上要求更高：Loadsmart
              的承运人文档区分较简单的直接承运人集成，以及能力更强的合作伙伴集成；后者可以模拟承运人身份、管理入驻、提交报价、呈现运输事件，并与货载报价交互。Opendock 也有自己的技术栈，包括 Neutron REST
              API、Subspace 实时事件流、预约校验、基于 JWT 的认证，以及生产和预发环境。外部开发者信号在这里很重要，因为它显示 Loadsmart 期待客户和合作伙伴进入怎样的生态。Stacksync 把
              Loadsmart EDI 营销为 ERP/WMS 系统与 Loadsmart 之间的翻译和合规层；第三方 Opendock MCP 封装器也表明 API 足够宽，能支持社区工具。含义很清楚：Loadsmart
              有真实平台管线，但采用往往仍依赖集成工作，而不是开箱即用的自助配置。
