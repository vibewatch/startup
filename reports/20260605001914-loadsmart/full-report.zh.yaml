      - number: '8.4'
        title: 可比估值基准
        blocks:
          - type: paragraph
            body: >-
              公开可比图景令人清醒，但有用。C.H. Robinson、RXO、Hub Group 和 J.B. Hunt 等执行属性重的货运公司，在简单的 2026 年 6 月市值筛选下约为收入的 0.7x 到
              2.2x；它们当前评论仍强调定价纪律、单票利润和利润率韧性，而不是干净的需求反弹。这并不意味着 Loadsmart 应该完全按公开经纪商估值，因为 Loadsmart
              确实拥有这些公开可比公司无法完全映射的软件和托管工作流产品面。但这意味着，经纪业务经济性在下行情景中仍应占很大权重。


              软件视角则相反。Descartes 和 Manhattan Associates 约为收入的 8x 到 9x，但它们也提供季度或年度披露，让这些倍数可读。project44 在 2022 年 $2.7
              billion 的私募轮说明，高溢价物流软件估值是可能的；Convoy 和 Flexport 则提醒投资者，货运科技估值也能快速重置。因此，正确框架既不是纯
              SaaS，也不是纯经纪，而是混合视角，并对不透明度和可比集合不匹配施加明确折价。
