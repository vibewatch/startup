      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 财务画像的可投资解读，在方向上建设性，但仍低于正常承销标准。建设性在于，官方来源显示公司 2024 年达到经营盈利，至少截至 2024 年 8 月持有有意义的现金垫子，并继续在
              Opendock 之上推出 YMS 等更高价值工作流软件。客户证明也显示平台可以带来实在运营节省，这是目前可用的收入耐久性最佳代理指标。低于标准在于，公开材料仍遗漏真正决定模型是复利增长还是仅仅存活的指标：产品级
              ARR、毛利率、贡献利润率、NRR、客户集中度、当前现金、烧钱、现金跑道和债务义务。行业背景让这些遗漏更严重，而不是更轻。货运经纪商仍面对压缩价差，失败的数字经纪先例也表明，宏观转向时，资本密集增长很快受罚。因此，合适的财务结论是：Loadsmart
              的故事已经从「风投支持的数字经纪商」改善为「挂上软件的物流平台」，但利润率路径只被部分证明，尽调阻塞项仍然重大。
