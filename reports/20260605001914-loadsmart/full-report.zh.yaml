      - number: '2.3'
        title: 买方分层与采用动态
        blocks:
          - type: paragraph
            body: >-
              货运科技买方宇宙可分为四个主要板块，每类都有不同的采购归属和采用触发点。企业托运方——Fortune 1000 制造商、零售商和消费品公司——由集中化物流或供应链组织掌握运输预算，并通过正式采购周期发起 TMS
              和托管运输采购。Oracle 采购文档显示，买方管理的运输可以配置到谈判、协议和采购订单层面，把货运决策嵌进寻源工作流。这样的集成深度既是机会，也是门槛：成熟企业买方期待 TMS 解决方案无缝连接 ERP 和
              WMS 系统；JBF TMS 买方指南把供应商激增、复杂度、成本和贴合度列为企业买方在选型调研阶段要穿过的核心挑战。C.H. Robinson 2025 年 10-K 明确说，托运方越来越想从单一供应商获得
              4PL、托管运输和 TMS——这正是 Loadsmart 直接复刻的打包模式。


              中端市场托运方采用速度更快：TMS 需求更简单，更愿意从电子表格迁移出来，采购周期也更短。MIT 关于整车采购的研究把托运方决策拆成战略和执行阶段的自建 vs.
              外包框架；规模较小的托运方更可能把执行完全外包给托管运输供应商，而不是自建 TMS 运行。GEP 指出，许多公司仍依赖电话沟通安排卡车，说明替代机会真实存在，但需要改变行为。


              仓库和场站运营方构成第三类：它们购买码头预约和 YMS 工具，解决预约拥堵、劳动力计划失灵和承运人沟通瓶颈。project44
              数据显示，没有预约系统的场站会被承运人的电话和邮件淹没，形成拖慢从卸货口到入库运营的瓶颈。Opendock 的客户证据很强：Red Gold 将仓库吞吐量提升 18%，预约提前期降低 90%，每年 60k+
              次预约完全自动化；Cascades 集中管理 63 家工厂的排期；GoBolt 将入库收货效率提升 20%。


              第三方物流提供商（3PL）是第四类：它们购买 TMS 和托管运输基础设施，在不按比例增加人手的情况下扩大运营，并且越来越常在同一批企业账户上与 Loadsmart 这样的经纪商竞争。
