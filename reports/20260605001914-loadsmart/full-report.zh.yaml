      - number: '8.5'
        title: 入场纪律、逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议刻意保持价格敏感。基于今天的公开证据，正确立场是继续研究：中等置信度、高风险、估值偏高。管理层已经做得足够让这个案子值得继续看：盈利改善，软件故事比 2022
              年更真实，也没有公开迹象显示公司有迫在眉睫的流动性危机。但这些都不能抹掉当前围绕产品经济性、股权结构优先级、客户集中度和当前融资标记的缺口。


              能改变判断的条件同样清楚。若入场点明显降低，或尽调材料证明软件质量
              ARR、毛利率、留存和干净资本结构，基准情景区间就更可执行。若货运再次走弱、经纪毛利率压缩持续，或软件贡献仍停留在叙事而非可衡量层面，投资逻辑就会破裂。在此之前，纪律是把 Loadsmart 留在名单上，但不要按
              2022 年独角兽框架仍能自我证明来付价。
