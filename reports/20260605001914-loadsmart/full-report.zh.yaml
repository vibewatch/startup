    rows:
      - - 推荐
        - 继续研究
        - 公开证据支持这是一门真实业务，但还不足以支撑今天以独角兽估值入场。
        - 没有私有尽调或更低价格，不要按接近 2022 估值标记承保新一轮。
      - - 置信度
        - 中
        - 历史融资、盈利能力和软件可选性可见；产品经济性和股权结构条款不可见。
        - 把它当作筛选结论，而非最终 IC 批准。
