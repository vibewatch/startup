      - number: '4.3'
        title: 资本基础与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的融资历史足以证明它获得过大量融资，但不足以厘清当前现金图景。公司官方页面仍称累计融资 $346.4M，Tracxn 称 $384M，GetLatka 称
              $309M。高置信度事实更窄：Loadsmart 官方宣布 2020 年完成 $90M C 轮、2022 年以 $1.3B 估值完成 $200M D 轮。最有用的资本充足性数据点是 2024 年 8
              月周年发布，管理层称公司有超过 $100M 现金可用于持续投资。这很有意义，因为它说明公司进入 2024 年盈利阶段时有真实流动性垫子，而不只是营销说法。不过，到 2026
              年中这个数据已经过时，公开资料没有月度烧钱、现金跑道或债务时间表。FMCSA 备案确认 Loadsmart
              注册为经纪商且动力单元为零，支持其资产轻运营模式，并较自有车队承运人降低资本开支强度。但资产轻不等于营运资本轻，尤其在货运周期波动、经纪应付账款可能快于回款变化时。因此，公开证据在方向上支持资本充足，但不足以移除融资依赖风险。
