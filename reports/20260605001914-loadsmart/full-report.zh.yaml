        - 不透明；强调节省主张
        - 全球贸易执行 + 可视性和控制塔
        - 当客户想要单一全球物流栈时，对 Loadsmart 构成威胁
      - - 可视化平台：project44 / FourKites / Descartes
        - 以可视性和设施工作流为核心的软件订阅或企业平台销售
