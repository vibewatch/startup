        - 衡量 ERP 主导转型中的胜率，并找出套件过度配置的细分场景
      - - 数字货运经纪经济性
        - Convoy 的先例显示，低毛利货运周期会压垮风险投资式经纪模式
        - 高
        - Convoy 倒下后，技术卖给了一个中立市场平台运营方
        - 要求证明 Loadsmart 能在下行周期守住毛利或差异化
      - - 承运人网络规模不透明
        - Loadsmart 未披露可与大型对手对比的最新网络指标
        - 中
        - CHR 和 Echo 的公开证据充足，Loadsmart 少得多
        - 尽调中要求提供承运人数量、活跃托运人和路由指南密度指标
      - - 公开定价不透明
        - 竞争对手销售 ROI 叙事，而不是公布价格
        - 中
        - 留存来源中，准确标价或 ACV 大多未披露
        - 尽调中推动客户访谈和同口径打包方案对比
