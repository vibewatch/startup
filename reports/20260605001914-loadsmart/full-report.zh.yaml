      - number: '7.3'
        title: 技术、集成与安全风险
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 现在更像一个物流操作系统，而不是单一货运经纪工作流，这既带来护城河潜力，也带来运营脆弱性。公司材料显示，货运单在 ShipperGuide、Carrier
              TMS、Opendock、托管运输服务、AI 工具和 NavTrac
              的摄像头堆场工作流之间流转。隐私政策确认，这套技术栈处理司机、位置、资产和支付数据，并与服务提供商共享信息；订阅协议则明确服务不是备份系统，并否认 AI 准确性保证。与此同时，公开状态页显示近期
              ShipperGuide 和 Opendock 都发生过事故；Loadsmart 自己的货物盗窃分析也强调，战略欺诈、假承运商和假文件正在上升，而这恰好发生在数字货运平台必须可信的订舱和提货节点。正面评价和
              SOC 2 信号有帮助，但公开证据仍未验证企业 SLA 深度、恢复时间表现、模型回退逻辑，或网络中的实际欺诈损失率。
