  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的公开客户材料显示，它服务的是两类客户，而不是单一、整齐的托运方队列。一类是企业托运方，使用货运经纪、Reliable Contracts、动态定价或 ShipperGuide
              工作流；另一类是仓库、港口和履约运营商，使用 Opendock
              执行月台、闸口和堆场流程。最强的具名证据集中在北美高吞吐业务，行业包括食品饮料、包装、汽车、海事和履约。考虑到公司主打吞吐量、预约控制和货运成本管理，这种客群匹配说得通，但也意味着可见客户群偏向高端、运营复杂的账户。公开证据在仓库侧明显强于更宽的产品套件：Opendock
              有最清晰的用户角色证据、明确规模指标和最多近期具名案例；托运方侧 logo 更常匿名，或只按行业描述而不点名账户。实际结论是：Loadsmart 看起来知道自己的
              ICP，但公开证据仍显示，各产品面的采用并不均衡。
