              的独角兽身份，也给管理层留下空间去扩展服务线和软件产品，而不是单纯追逐经纪货量。更难的问题是累计融资额。官方 关于页面称累计融资 $346.4M；Tracxn 报告六轮融资 $384M，甚至列出一笔 $250M
              D 轮。公司自身尚未对差异作出调和，因此审慎做法是以官方数字为锚，同时把第三方更高估算保留为未解决差异。投资者组合有战略意义：除财务资本外，Loadsmart 还提到 Maersk、Ports
              America、TFI International 和 CSX，意味着股权结构表中存在与海运、港口、卡车和铁路基础设施重叠的关系。不过，公开来源没有进一步披露这些关系是否带有董事席位、商业排他性或保护性权利。
