      - number: '2.4'
        title: 增长驱动与结构性约束
        blocks:
          - type: paragraph
            body: >-
              货运科技软件的主要增长驱动，是供应链数字化压力、AI 和自动化需求、实时可视化要求，以及承运人分散带来的匹配平台结构性价值。FMI 预计，AI 驱动的优化和实时可视化到 2036
              年仍会是稳定需求催化剂。FreightWaves 2026 年 6 月 State of the Industry
              报告记录了一个波动且对运力敏感的货运市场，其中现货费率跑赢合同费率——这会抬高数据平台和托管运输咨询的价值，帮助托运方锁定运力。non-domicile CDL 司机问题增加了新的运力收紧风险：Triumph
              估计约 190,000 名司机可能在两年内退出市场，进一步收紧供给，并提高托运方对具备承运人触达能力的经纪商和托管运输供应商的依赖。


              结构性约束很重，必须作为审慎反证保留。第一，货运周期性反复构成逆风：2023–2024 年货运衰退压缩经纪货量，拉紧数字经纪收入模式，说明货运科技 TAM 会随经济周期收缩。Cass Freight Index
              显示，衰退期货运支出会显著下滑。第二，经纪利润率压缩很尖锐：Triumph 数据显示，2025 年 12 月全国经纪中位利润率约 12%，即便拒单率上升，四分之一货载仍只有 2–4%
              利润率。这种结构性压力意味着，单靠数字经纪无法在规模化后成为可靠收入底座。第三，集成负担是企业账户采用的主门槛：GEP 和 JBF 都指出，TMS 部署需要连接 ERP 系统、WMS
              平台和异构承运人网络，复杂度会拉长采购周期、推高实施成本。第四，承运人分散虽然创造匹配机会，也限制数字化采用，因为许多小承运人没有 EDI 或 API 连接，仍需要人工接单或电话确认。FMCSA 数据显示有
              2M+ 家承运人，绝大多数是小型运营方。第五，信任和合规风险在上升：2026 年法律进展之后，货运经纪商面对更高的过失选择诉讼风险，所有经纪模式的合规成本都在增加。最后，来自规模化在位巨头（C.H.
              Robinson、XPO、Echo Global）的竞争制造定价压力，限制货运科技软件创业公司在市场经纪侧能收取的溢价。
