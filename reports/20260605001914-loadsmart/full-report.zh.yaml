  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 软件可选性
        - 托管运输、Opendock 和 YMS 让 Loadsmart 不只是现货经纪商。
        - 公开来源仍未披露各软件模块的 ARR、毛利率或留存。
        - 披露按模块拆分的产品级 ARR、毛利率和客户采用情况。
      - - 盈利能力
        - 2024 年 Q3 实现经营盈利，并给出创纪录毛利轨迹指引，说明纪律性强于 2021–2022 年增长期。
        - 最新公开的盈利和现金证据已经过时，周期到 2026 年仍偏弱。
        - 提供 2025 年经审计报表，以及 2026 年至今的盈利能力桥接。
      - - 商业模式质量
        - 轻资产经纪商注册身份和软件触点，给混合估值框架留下空间。
        - 轻资产并不消除营运资本、承运商或价差风险。
        - 按业务线披露毛利结构和现金转化动态。
      - - 可比公司集合
        - 混合平台可以拿到高于纯货运经纪商的倍数。
        - 可比集合错配，会让投资者挑软件倍数买贵。
        - 披露足够的软件质量指标，证明估值可以脱离货运同业区间。
      - - 私募市场支撑
        - project44 说明私募物流软件可以有高溢价估值。
        - Convoy 和 Flexport 说明，增长或流动性断裂时，货运科技估值会突然重置。
        - 给出当前估值、干净的股权结构表，以及更接近上市软件可比公司的披露质量。
    notes: 反向逻辑刻意保持不利且限于本章：它关注估值支撑，而不是 Loadsmart 是否真的有产品。
