  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Loadsmart 方案
      - 具体机制
      - 公开收益信号
      - 限制 / 风险
    rows:
      - - 不用在经纪商、电子表格和邮件之间来回切换，完成托运人采购
        - 报价、投标和执行交接碎片化
        - ShipperGuide TMS
        - 集中采购、执行、承运人管理、审计 / 争议和集成中间件
        - 宣传结果包括单线路节省 35%，费率采购耗时降低 83%
        - 无公开价目表、模块打包方式或按分群的独立 ROI 研究
      - - 不增加内部人手也能扩展网络管理
        - 内部团队很难跟上动态市场条件
        - Managed Transportation
        - 4PL 服务围绕 Loadsmart 工具提供评估、设计、部署和持续运营
        - 定位为最高节省 20% 货运成本，并在 90 天内看到节省
        - 结果声明来自公司自身，需要尽调人员模型和实际续约经济性
      - - 帮承运人数字化调度和后台
        - 手工任务排程、空驶里程和碎片化开票
        - CarrierGuide
        - 任务驱动型 TMS，覆盖司机 / 挂车 / 货运单管理、货源匹配、会计和开票
        - 更快找货、更高卡车利用率和市场平台接入是核心价值主张
        - 变现仍混合软件、保理和货源接入，而不是纯 SaaS
      - - 从一个场站层协同月台、门岗和堆场
        - 电话拉锯式排程、手工签到和堆场盲区
        - Opendock + YMS
        - 自助预约、签到、拖拽式分配、资产跟踪和 SmartGate
        - 4,000+ 个仓库和 1,400 万+次年预约量显示真实运营规模
        - 需要更硬证据来证明可用性、延迟、部署工作量，以及 SmartGate/NavTrac 的附着率
      - - 在货运数据中自动化异常处理和分析
        - 运营团队逐单处理运输问题，很难提炼洞察
        - AI 产品：FreightIntel AI + CoPilot / Copilot Tasks
        - 嵌入式分析、聊天式查询，以及带审计轨迹的批量异常处理
        - 行业报道反复提到 3-15% 节省和 10-20% 人力优化主张
        - 独立验证、模型治理和错误率证据尚未公开
