        - 先保护下行；不要用动量叙事承销。
      - - 估值判断
        - 偏高
        - 2022 年隐含倍数高于上市货运同业和上市软件同业。
        - 任何试图捍卫旧估值的动作，都应视为估值风险，而不是证明。
      - - 入场纪律
        - <~$600M 投前估值，或更好的披露
        - 需要更低价格，或经过审计的业务结构与利润率披露，才能重新平衡上行与下行。
        - 只有价格下调或披露质量明显改善，才上调判断。
