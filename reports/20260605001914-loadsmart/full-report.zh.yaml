        - 要求当前现金桥和董事会流动性材料包
      - - 法定运营结构
        - MC-872918 下 ACTIVE 财产经纪资质，动力单元为 0
        - 2026-02-11 / 当前
        - 支持资本开支较低的轻资产模式，但仍有显著营运资本敞口
        - 确认理赔准备金、承运人应付账款账期，以及是否需要客户预付款
      - - 货运周期背景
        - 2026 年货运衰退仍在持续；毛利压力只部分缓解
        - 2026 / 当前
        - 即便已到盈利里程碑，宏观疲软也可能重新打开融资依赖
        - 在低价差 / 低货量情景下压力测试流动性
      - - 债务 / 担保授信
        - 已审来源未发现公开债务明细或 UCC 支持的授信
        - 2026 / 未知
        - 没披露不等于没有；这仍是现实尽调缺口
        - 承销前，对所有法律实体做 UCC、留置权和债务尽调
