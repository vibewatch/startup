  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值视角
      - 当前估值代理 / 状态
      - 为什么重要
      - 局限
      - 对 Loadsmart 的映射
    rows:
      - - Loadsmart 2022 Series D
        - 历史私募锚点
        - $200M 融资对应 $1.3B 估值
        - 定义了许多投资者会锚定的估值。
        - 它已经过时，且早于货运重置。
        - 设定的是心理门槛，不是今天的公允价值。
      - - C.H. Robinson
        - 上市货运经纪商 / 3PL
        - ~1.3x 收入；2026 年 Q1 NAST 毛利率 14.6%
        - 规模化、纪律化货运执行的最佳上市基准。
        - 转付收入和大得多的规模扭曲直接可比性。
        - 是执行密集型价值的良好上限，不是软件上行的上限。
      - - RXO
        - 上市货运经纪
        - ~0.8x 收入；2026 年 Q1 毛利率 14.2%；EBITDA 利润率 0.4%
        - 说明公开市场惩罚低经纪利润率的速度有多快。
        - 整合噪音和上市公司成本让它不完美。
        - 如果 Loadsmart 仍主要是经纪经济性，它是有用的下行参照。
      - - Hub Group
        - 托管运输 / 物流
        - ~0.7x 收入；经纪业务量下滑，同时管理层优先追求每车利润
        - 说明即便质量更高的物流管理公司，2026 年也把盈利能力置于货量之上。
        - 多式联运和物流结构比 Loadsmart 更宽。
        - 支持保守的混合倍数，而不是增长溢价。
      - - J.B. Hunt
        - 多元运输 / 物流
        - ~2.2x 收入
        - 为大型、更高质量上市执行资产提供上限。
        - 规模、品牌和资产结构都远强于 Loadsmart。
        - 说明公开执行倍数可以很高，但不等于类软件估值。
      - - Descartes
        - 上市物流软件
        - ~8.9x 收入
        - 锚定区间的上市软件端。
        - 经常性软件披露远比 Loadsmart 丰富。
        - 只有管理层证明软件质量经济性时才有用。
      - - Manhattan Associates
        - 上市供应链软件
        - ~8.1x 收入；RPO 订单增长信号 25%
        - 展示高溢价、披露充分的物流软件倍数长什么样。
        - 品类邻近度强于商业模式相似度。
        - 进一步说明软件倍数需要软件披露。
      - - project44 2022 年轮次
        - 私募物流软件基准
        - $2.7B 私募轮
        - 说明下行周期中仍可能出现高溢价私募物流软件估值。
        - 可视化软件比货运经纪加服务更干净。
        - 定义上限情景，不是基准情景。
      - - Convoy 关停 / Flexport 重置
        - 反向私募先例
        - 关停和估值重置证据，而不是正向倍数
        - 说明周期和执行转坏时，货运科技股权会多快失去支撑。
        - 困境结果不能与 Loadsmart 一一对应。
        - 支持在估值区间中加入降估值融资和不透明折价。
    notes: 这是筛选后的可比集合，不是详尽行业普查。目的在于把 Loadsmart 放在上市货运执行可比公司、上市物流软件可比公司和私募货运科技先例之间框定。
