  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与建议
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 有足够公开证据建立历史价格锚，但不足以在今天支撑这个锚点。锚点很清楚：公司 2022 年 2 月以 $1.3 billion 估值融资 $200 million，仍称累计融资 $346.4
              million，宣布 2024 年 Q3 经营盈利，并在 2024 年 8 月强调拥有超过 $100 million 现金。公司也显然不只是现货经纪故事，托管运输、Opendock 和 YMS
              扩大了业务面，可能支撑混合倍数。


              估值问题在于，价格可见度远远跑在经济性可见度前面。GetLatka 对 2025 年收入 $108 million 的估计，是唯一当前公开收入代理指标，使 2022 年估值标记看起来约为收入的
              12x。这明显高于公开货运执行可比公司 0.7x–2.2x 的区间，也高于公开物流软件公司 8x–9x 的区间。由于 Loadsmart 仍未披露产品级
              ARR、毛利率、NRR、客户集中度或股权结构条款，基于公开证据可提交 IC 的判断是继续研究，而不是买入。
