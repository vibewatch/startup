  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 货运周期再次转弱
        - 出货指数继续下滑，经纪商利润率仍接近 2025 年末压缩水平
        - 执行密集型毛利失去支撑，混合估值框架向上市经纪商底部靠拢。
        - 持有或退出，除非价格已经反映深度重置。
      - - 软件证据仍停留在定性层面
        - 没有出现模块级 ARR、毛利率或 NRR 披露
        - 市场无法证明估值应脱离货运经纪可比区间。
        - 建议维持在继续研究。
      - - 当前融资捍卫独角兽定价
        - 管理层在 2025-2026 年任何轮次中，以接近旧 $1.3B 参照估值营销，且没有更充分披露
        - 入场价格跑赢公开证据，抬高降估值融资或优先权悬置风险。
        - 将其视为少数股权成长投资的否决触发项。
      - - 股权结构表显示高级权利很重
        - 债务或清算优先权实质性压低新普通股上行
        - 公开估值区间高估普通股价值。
        - 继续前先要求完整清算瀑布。
      - - 软件经济性得到证明
        - 管理层展示持久软件结构、健康留存，以及与经纪业务分离的毛利率
        - 混合估值框架可以上移，靠近软件可比公司。
        - 在更有支撑的价格重新打开承销。
    notes: 触发项刻意设置为可观察、且与投资相关；它们说明什么会推翻或上调仅基于公开信息的承销案例。
