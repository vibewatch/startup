  - id: TI005
    title: 公开财务缺口表
    notes: 即便 2024 年盈利更新为正，以下缺失指标仍会卡住正常承销流程。
    enumerationScope:
      coverage: partial
      basis: >-
        Captures the material financial data requests that remain unresolved after reviewing official pages, filings,
        trackers, customer proof, and adverse market evidence.
    columns:
      - 缺失指标
      - 重要性
      - 当前公开信号
      - 对承销的影响
      - 具体尽调路径
    rows:
      - - 按产品 ARR 和收入结构
        - 必须拆开经常性软件经济性与经纪价差
        - 公开信息只有低置信度的 2025 年收入估计 $108M
        - 无法测算高质量经常性收入或软件附着经济性
        - 要求产品 P&L、按模块 ARR 和月度经常性收入桥
      - - 按收入流毛利率和贡献毛利率
        - 判断盈利来自软件杠杆、人力削减，还是短期运价条件
        - Loadsmart 没有收入流级别毛利披露；只有公开经纪商基准
        - 仅靠公开数据无法承销毛利质量
        - 要求按经纪、托管运输、TMS、Opendock/YMS 和审计 / 支付拆分毛利率、可变成本和贡献毛利率
      - - 现金余额、现金消耗和资金跑道
        - 检验融资依赖和下行存活能力的核心指标
        - 公开信息只有 2024 年 8 月 >$100M 现金的声明
        - 2026 年中无法评估当前流动性
        - 要求月度现金桥、资金跑道模型和契约条款包
      - - 债务、留置权和授信额度
        - 即便收入看起来稳定，经纪营运资本也可能受贷款方约束
        - 已审来源未发现公开债务明细
        - 资本结构风险仍未解决
        - 做 UCC / 留置权检索，并要求债务明细、保理额度和保险抵押安排
      - - NRR、流失率和客户集中度
        - 检验软件附着型物流平台粘性的最佳指标
        - 未发现公开 NRR 或集中度数据
        - 无法判断软件附着是否耐久，还是集中在少数大账户
        - 要求分群留存看板和头部客户收入占比
      - - 实际定价和合同期限
        - 评估定价权、折扣和回本动态所必需
        - 公开页面有价值主张，但没有 ACV、ASP 或合同期限数据
        - 定价权仍是叙事，不是可承销事实
        - 要求标准订单表、价目表和头部账户实际定价瀑布
    claimRefs:
      - CI006
      - CI010
      - CI011
      - CI022
      - CI038
      - CI041
      - CI042
      - CI049
      - CI050
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
