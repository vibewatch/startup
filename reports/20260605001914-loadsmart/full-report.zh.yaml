  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与经纪商责任风险
        blocks:
          - type: paragraph
            body: >-
              Loadsmart 的公开法律安排比简单的数字货源板更成熟，但 2026 年的监管环境对货运经纪商仍明显比公司融资 Series D 时更严。托管运输 MSA 明确把 Loadsmart 定义为 FMCSA
              注册的货物经纪商，使用第三方供应商；用户协议和隐私政策则显示，平台如今很大一部分搭在承运商、货运单和位置数据之上，而不只是简单的费率发现。这一点重要，因为 FMCSA 的 2026
              年财务责任规则已经生效；经纪商担保低于 $75,000 且未及时补足时，可能触发运营授权暂停；最高法院 Montgomery 判决也重新打开了各州针对经纪商的疏忽选择索赔。Loadsmart
              的条款、承运商保险要求、记录保存义务和公开安全表述都是真实缓释项，但公开材料仍没有显示当前 BMC 提供方细节、索赔历史、准备金政策，或 Montgomery 之后承运商审核收紧到什么程度。
