  - id: FM004
    title: 货运科技采用漏斗与价值链地图
    type: flow
    layout: wide
    summary: >-
      货运科技采用沿工作流推进：从托运人采购，到承运商执行，再到设施吞吐。Loadsmart 的产品套件覆盖全价值链：从费率基准和货运采购（FreightIntel
      AI、TMS），到承运商选择和发标（经纪、托管运输），再到预约排程和码头执行（Opendock、YMS）。每个阶段都有约束：买方层面的采购集成、中段的承运商数字化缺口，以及设施层面的劳动协调。
