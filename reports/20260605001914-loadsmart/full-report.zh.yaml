  - id: TM003
    title: 买方与细分图谱 — 货运科技采购画像
    columns:
      - 买方细分
      - 估计规模
      - 采购归属
      - 核心痛点
      - 技术切入点
      - 采用速度
      - Loadsmart 匹配度
    rows:
      - - 企业托运人（Fortune 1000 制造商、零售商、CPG）
        - 数百家大型托运人；仅 Cass 就为这一群体处理 $37B 支出
        - 物流或供应链组织集中化；采购流程正式；运输偏好嵌入 ERP
        - 运力获取、货运成本控制、多设施可视性、合规负担
        - TMS + 托管运输；采购牵头的多供应商评估
        - 慢（12–24 个月销售周期）；集成要求高
        - 通过 ShipperGuide TMS + 托管运输组合，匹配度高；CH Robinson 模式验证了托运人对打包方案的需求
      - - 中端市场托运人
        - 数千家公司；基准数据较少，但体量大
        - 物流经理或运营副总裁；采购不那么正式；周期更快
        - 电子表格 / 邮件过载、运力获取、货运成本基准对比
        - 先上 TMS 或经纪服务；托管运输作为升级项
        - 中等（3–9 个月周期）；偏好 IT 负担低的 SaaS
        - 通过 ShipperGuide TMS 切入点和自动化经纪服务，匹配度高
      - - 仓库和设施运营方（3PL、制造商、分销商）
        - 3,500+ 个设施使用 Opendock；美国仓储整体可触达池要大得多
        - 运营或供应链经理；码头 / 堆场预算负责人独立于货运采购
        - 预约拥堵、计划外到达、人工承运商沟通、劳动力错配
        - 码头排程软件；YMS 作为升级项
        - 快（数周到数月）；独立 SaaS，集成要求低
        - 通过 Opendock + YMS，匹配度很高；Red Gold、Cascades、GoBolt 案例已证明 ROI
      - - 第三方物流服务商（3PL）
        - 数百家 3PL，从区域型到全球型都有
        - 运营和技术负责人；与经纪模式供应商存在竞争
        - 承运商网络获取、TMS 可扩展性、托管运输交付利润
        - 白标 TMS 或托管运输基础设施
        - 中等；通常替代或补充现有 TMS 投资
        - 匹配度中等；Loadsmart 在托管运输上与 3PL 竞争，同时也把它们作为软件客户服务
    notes: >-
      买方细分部分重叠：一家大型制造商可能同时是企业托运人（TMS 买方）、仓库运营方（码头排程买方）和托管运输买方。组织内部采购归属不一：运输团队和采购团队未必在供应商选择上保持一致，销售周期因此拉长。Oracle
      文档证实，由买方管理的运输偏好可以嵌入 PO 层面，说明物流技术决策可能上移到寻源工作流。
