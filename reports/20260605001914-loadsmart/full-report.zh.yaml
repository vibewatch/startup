  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从历史价格锚和软件可选性出发，经由当前可比公司倍数区间和披露缺口，推导最终建议。
    data:
      nodes:
        - id: price
          label: 2022 年独角兽锚点
          detail: $1.3B 历史估值仍在塑造预期。
        - id: proof
          label: 真实经营证据
          detail: 2024 年盈利和 YMS 扩张显示，其实质不只是纯现货经纪商。
        - id: cycle
          label: 货运周期重置
          detail: 2026 年市场数据仍强调货量疲弱和利润率纪律。
        - id: comps
          label: 可比公司区间分化
          detail: 上市经纪商约按 0.7x-2.2x 收入交易，上市软件公司约按 8x-9x 交易。
        - id: gaps
          label: 披露缺口
          detail: 没有公开 ARR、毛利率结构、NRR 或股权结构瀑布。
        - id: decision
          label: 建议：继续研究
          detail: 等到价格更低或披露明显改善后，再承销一轮融资。
      edges:
        - from: price
          to: comps
          label: 必须跨过
        - from: proof
          to: comps
          label: 支撑混合视角
        - from: cycle
          to: comps
          label: 压缩
        - from: comps
          to: gaps
          label: 因其加剧
        - from: gaps
          to: decision
          label: 迫使谨慎
        - from: proof
          to: decision
          label: 保留兴趣
    approximationNotes: 这张流程图是 IC 推理辅助，不是确定性模型；每个节点把若干公开数据点压缩成一个门槛判断。
    claimRefs:
