    rows:
      - - 运输管理软件（TMS）
        - 用于规划、执行和优化多式联运货物流转的软件；包括路线规划、承运商选择、费率管理和可视化
        - 全球 $13–23B（分析师共识，不含离群值）
        - ShipperGuide TMS、FreightIntel AI
        - 北美约 39% 份额；研究机构之间口径差异大
      - - 数字货运经纪
        - 算法和在线托运方—承运商匹配；自动定价、招标和订载
        - 全球约 $5.2B / 美国约 $1.76B（2025–2026）
        - 货运经纪产品
        - 增速慢于 TMS（CAGR 5.8%）；利润率压缩限制收入质量
      - - 托管运输服务
        - 外包物流运营，结合人工顾问、TMS 和承运商关系
        - 纳入宽口径 TMS / 服务估算；多数报告未单独测算
        - 托管运输产品
        - CH Robinson 将其定位为打包需求驱动项；Loadsmart 复制这一模式
      - - 月台预约与堆场管理（YMS）
        - 面向设施的预约管理、闸口控制、挂车跟踪和堆场可视化
        - TMS 和供应链可视化市场的子细分；未单独设基准
        - Opendock、NavTrac 驱动的 YMS
        - 截至 2025 年 2 月，3,500+ 个设施使用 Opendock；在市场饱和前已形成实质采用
      - - 货运智能与数据
        - AI 驱动的分析、市场基准、承运商表现评分和费率情报
        - TMS 软件市场子细分
        - FreightIntel AI
        - 战略价值高，但多数分析师定义里与 TMS 或货运经纪打包
    notes: Loadsmart 的可触达市场版图横跨五个细分，而不是单一市场线；TMS 软件的 TAM 全球为 $13–23B，但托管运输和月台预约的运营杠杆增加了可观相邻 SAM。所审阅研究未单独基准化托管运输服务和月台预约的可服务市场。
