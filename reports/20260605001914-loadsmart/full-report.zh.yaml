      - CE013
      - CE019
      - CE024
      - CE036
    data:
      layers:
        - label: AI 与智能层
          detail: FreightIntel AI、AI CoPilot 和 Copilot Tasks 架在运营数据之上，生成洞察并自动处理重复异常。
          tone: positive
        - label: 设施执行层
          detail: Opendock、YMS、SmartGate 和 NavTrac 管理预约、闸口事件、堆场状态和可视化凭证工作流。
          tone: positive
        - label: 托运人和承运商应用层
          detail: ShipperGuide 处理从采购到结算的流程，CarrierGuide 管理调度、货载匹配、司机和开票。
          tone: positive
        - label: 集成与事件层
          detail: OAuth/JWT API、webhook、承运商 / 伙伴集成流、EDI 转换和事件流管道，在 Loadsmart 与外部系统之间搬运数据。
          tone: neutral
        - label: 服务与生态层
          detail: 托管运输团队加上伙伴连接器，帮助客户把平台部署到既有流程里并跑起来。
          tone: neutral
        - label: 数据与信任基础
          detail: 货运、预约、承运商、堆场和资产数据流经 AWS 托管系统，并配有公开的加密、状态和隐私控制。
          tone: neutral
