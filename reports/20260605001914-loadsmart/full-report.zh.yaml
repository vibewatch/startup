        - 可视性、堆场、预约和自动化模块
        - 压缩 Opendock 相邻工作流的差异化
      - - Emerge
        - 带合同、mini-bid 和现货工具的采购平台
        - 不透明
        - 采购分析和市场接入
        - 可以替代寻源工作流，同时把执行留在别处
      - - 企业 TMS 套件：Oracle / SAP / Blue Yonder / Trimble / Infios
        - 更大物流 / ERP 预算内的套件或平台许可
        - 不透明；作为更大产品组合的一部分销售
        - 运输 + 计划、分析、协作及相邻模块
        - 打包经济性和装机基础杠杆是核心竞争武器
      - - GoRamp / C3
        - 面向码头和堆场工作流的垂直 SaaS
        - 不透明，但以 ROI 驱动
        - 码头排程、堆场可视性、自动化
        - 在单一工作流采购中，可能削弱对更宽平台的需求
