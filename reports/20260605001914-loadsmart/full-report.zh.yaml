    rows:
      - - 托管运输
        - 托运人物流负责人
        - 4PL 评估、设计、部署和持续货运项目管理
        - 已上线服务产品，公布了部署阶段和节省声明
        - 服务主导切入点，加上 ShipperGuide 支撑工具，面向尚未准备好纯软件自管的客户
        - 需要合同结构、人员配比、续约数据，以及按账户的模块附着
      - - ShipperGuide TMS
        - 托运人和运输团队
        - 采购、执行、承运人管理、审计 / 争议、分析和数据整合
        - 成熟商业产品，宣称有 200+ 托运人，并公布工作流 / ROI 叙事
        - 在一个托运人运营层里覆盖广泛货运工作流，并嵌入 AI 和中间件钩子
        - 需要模块级定价、流失率、按细分划分的客户数量，以及按范围划分的实施周期
      - - CarrierGuide / Carrier TMS
        - 承运人和调度团队
        - 调度、司机 / 挂车管理、货源匹配、开票和后台工作流
        - 已上线承运人产品，定位为市场平台和后台工具
        - 任务 / 工作流管理，加上嵌入式货源获取和保理邻接
        - 需要承运人数量、留存率，以及软件与网络服务之间的变现拆分
      - - Opendock 码头排程
        - 仓库、承运人和月台团队
        - 预约排程、承运人沟通、司机签到和合规证据
        - 已具规模产品，公开仓库、预约和承运人数量
        - 在一个场站工作流里提供自助月台协同、评分卡和事件捕捉
        - 需要客户集中度、SLA 指标，以及按站点类型拆分的场站上线工作量
      - - Opendock YMS / SmartGate / NavTrac
        - 仓库和堆场运营方
        - 门岗、堆场和资产移动编排，并用视觉辅助采集
        - 近期扩展层，2025 年发布，2026 年发布说明继续迭代
        - 不只是单点排程，而是统一月台-门岗-堆场工作流和视觉证据链
        - 需要附着率、传感器 / 摄像头要求，以及按功能簇验证的 ROI
      - - AI 产品：FreightIntel AI / AI CoPilot / Copilot Tasks
        - 托运人和运营团队
        - 支出分析、问答和批量异常处理
        - 产品界面真实存在，有公开营销页面和行业报道，但证据仍然混合
        - AI 层嵌入工作流，而不是作为脱节助手单独销售
        - 需要经审计节省、任务解决准确率、治理控制，以及幻觉 / 错误处理证据
    notes: 各行概括具体公开模块界面和最影响决策的缺口；商业深度和使用经济性仍严重披露不足。
