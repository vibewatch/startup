    severity: material
    topic: competitor-pricing
    missingEvidence: Exact subscription, implementation, or take-rate pricing for the leading platforms remains unavailable in retained public sources.
    whyItMatters: Pricing discipline is central to deciding whether Loadsmart wins on total cost of ownership or only on product fit.
    diligencePath: Collect customer references, pricing sheets, or procurement docs for at least Uber Freight, C.H. Robinson, Echo, Flexport, Oracle, and SAP.
    relatedQuestionRefs:
