- id: yard-visibility-and-procurement-adjacencies
  title: Yard, Visibility, and Procurement Adjacencies
  body: 'Loadsmart’s dock and orchestration flank is under pressure from vendors that start in adjacent workflows and then move toward the same decision points. project44 and FourKites are no longer just visibility vendors: both explicitly sell appointment booking, yard management, and AI-led workflow automation, and both position those products as ways to replace spreadsheet-driven facility planning. Descartes MacroPoint competes more on visibility and control than on brokerage, but its carrier network, customer base, and OpsForce automation make it a credible overlay in shipper and broker workflows. Emerge attacks earlier in the buying process by owning contract procurement, mini-bids, spot sourcing, and marketplace access while integrating into other TMS stacks. GoRamp and C3 are narrower specialists, yet they matter because they show that dock scheduling is increasingly a commodity workflow that can be delivered as cloud software with measurable labor and detention improvements. For
    Loadsmart, this means Opendock differentiation cannot rely on basic appointment scheduling alone.'
