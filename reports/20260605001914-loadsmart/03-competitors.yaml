  columns:
  - Current moat claim
  - Threat / who causes it
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated brokerage plus software
    - Execution platforms with bigger carrier or managed-service footprints (Uber, CHR, Echo, Flexport)
    - High
    - Execution-plus-software incumbents already sell TMS, procurement, or control-tower workflows
    - Prove where Loadsmart wins on cycle time, UX, or blended economics, not just product map
  - - Opendock and facility workflow ownership
    - project44, FourKites, GoRamp, and C3 make dock scheduling less unique
    - High
    - All four market appointment or yard automation and explicit spreadsheet replacement
    - Quantify adoption, retention, and switching friction unique to Opendock
  - - Platform neutrality
    - Customers may distrust competitor-owned infrastructure in volatile markets
    - Medium
    - Flexport said Convoy needed to become a neutral layer to reach full potential
    - Clarify when Loadsmart is a neutral workflow layer versus a carrier or broker counterparty
  - - Procurement adjacency
    - Emerge can capture sourcing workflow before execution is even awarded
    - Medium
    - Emerge sells annual events, mini-bids, and spot procurement with TMS integrations
    - Show whether Loadsmart is embedded in routing-guide creation or only downstream execution
  - - Enterprise bundle defense
    - Oracle, SAP, Blue Yonder, Trimble, and Infios fold transportation into wider budgets
    - High
    - Suite vendors market procurement, planning, execution, and network collaboration together
    - Measure win rate inside ERP-led transformations and identify the segments where suites are overkill
  - - Digital broker economics
    - Convoy precedent shows low-margin freight cycles can break venture-style broker models
    - High
    - Convoy collapsed, then its technology was sold into a neutral marketplace owner
    - Demand evidence that Loadsmart can sustain margins or differentiation through downturns
  - - Carrier-network scale opacity
    - Loadsmart does not publish comparable current network metrics versus large rivals
    - Medium
    - Public evidence is rich for CHR and Echo, less so for Loadsmart
    - Request carrier-count, active-shipper, and routing-guide density metrics in diligence
  - - Public pricing opacity
    - Competitors sell ROI stories rather than published pricing
    - Medium
    - Exact list prices or ACVs remain largely undisclosed across retained sources
    - Push for customer references and apples-to-apples packaging comparisons during diligence
