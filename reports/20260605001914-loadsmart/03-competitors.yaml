- id: pricing-distribution-and-switching-power
  title: Pricing, Distribution, and Switching Power
  body: 'Public pricing is strikingly opaque across the market. The major vendors almost always sell outcomes—lower freight spend, better on-time performance, faster settlement, or automation—rather than posting list prices. That opacity is not trivial: it favors vendors that can bundle transportation software with procurement leverage, managed labor, or a broader enterprise platform. C.H. Robinson and Echo can frame the software sale inside managed-service savings. Uber Freight and Flexport can trade on network access, procurement automation, and integrated execution. Oracle, SAP, Blue Yonder, Trimble, and Infios compete from an even stronger distribution position because transportation is only one module inside a much wider logistics or ERP buying motion. Buyers can also multi-home pieces of the workflow: Emerge can own procurement while a suite TMS remains system of record, and project44 or FourKites can sit on top of other systems for yard and visibility. Loadsmart therefore faces a
    market where commercial power often follows installed relationships and workflow adjacency more than product elegance alone.'
