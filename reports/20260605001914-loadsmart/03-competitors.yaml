  - Category
  - Scale / funding signal
  - Target buyer
  - Core overlap with Loadsmart
  - Key limitation or gap
  rows:
  - - Loadsmart
    - Brokerage + shipper workflow + dock scheduling
    - Private; public scale metrics remain uneven in earlier chapters
    - North American shippers needing brokerage, managed transportation, and Opendock-style facility workflows
    - Combines brokerage execution with shipper software and dock scheduling
    - Does not have the public installed-base breadth of Oracle/SAP/CHR and does not disclose comparable carrier-scale metrics
  - - Uber Freight
    - Digital brokerage + TMS + procurement
    - Large carrier network; broker-access product; enterprise TMS footprint
    - Shippers, brokers, owner-operators, and small fleets
    - Marketplace execution, routing guide, procurement, dock scheduling, and payments
    - Pricing undisclosed; must win against many incumbents despite crowded field
  - - C.H. Robinson / Navisphere
    - Incumbent 3PL + global TMS + managed solutions
    - 83K shippers and 450K carriers on Navisphere; nearly 200K companies cited
    - Global enterprises and mid-market shippers wanting managed transportation or 4PL
    - Deep multimodal TMS, managed services, and carrier network
    - UX and agility can be less startup-like; software sale is tied to incumbent operating model
  - - Echo Global Logistics
    - Brokerage + managed transportation + TMS
    - 50K+ providers; $4B freight-spend leverage; ~$5.2B combined 2025 revenue with ITS
    - North American shippers needing multimodal managed transportation
    - Carrier procurement, multimodal execution, and managed-service overlay
    - Less visible international control-tower depth than Flexport or Oracle/SAP suites
  - - Flexport
    - Forwarding + control tower + customs + trucking
    - Trusted by 10K+ brands; AI/control-tower release in 2025
    - Import-heavy shippers needing international orchestration and customs
    - Factory-to-door orchestration, customs brokerage, third-party freight visibility
    - More global-trade centric than domestic dock scheduling; not a yard specialist
  - - project44
    - Visibility + yard / appointment management
    - 1.5B shipments annually; 1K+ brands
    - Large shippers, LSPs, and distribution networks
    - Appointment booking, yard orchestration, visibility, and AI agents
    - Does not own freight execution the way brokers or 3PLs do
  - - FourKites
    - Visibility + yard / dock execution
    - Large enterprise visibility footprint; YardWorks AI/computer-vision push
    - Global shippers with complex inbound facility flows
    - Native ETA-linked yard operations and facilities management
    - Again, limited execution ownership compared with brokers or 4PLs
  - - Descartes MacroPoint
    - Visibility network + carrier connectivity
    - 24K+ customers on Descartes network; thousands of MacroPoint users
    - Shippers, brokers, carriers, and LSPs seeking visibility and tracking compliance
    - Real-time visibility, carrier connectivity, and AI exception automation
    - More overlay than end-to-end managed-transportation operator
  - - Emerge
    - Freight procurement marketplace
    - Enterprise-capable procurement platform with annual events, mini-bids, and spot tools
    - Shippers optimizing contract and spot sourcing
    - Carrier procurement, bid events, benchmarking, and market access
    - Limited execution ownership; relies on integration into other operating stacks
  - - Oracle / SAP / Blue Yonder / Infios / Trimble
    - Suite or broad-platform incumbents
    - Large enterprise installed bases and broader SCM or logistics portfolios
    - Enterprises standardizing on ERP or orchestration suites
    - Transportation is bundled with wider planning, execution, and network workflows
    - Current public evidence is less precise on dock depth and pure spot-brokerage strength
  - - GoRamp / C3
    - Dock and yard specialists
    - ROI-led specialist software vendors
    - Facilities teams and warehouses focused on scheduling and throughput
    - Dock scheduling, yard visibility, and operational automation
    - Narrower scope than execution platforms or enterprise suites
