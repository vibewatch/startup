evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer rights, and key investor control terms are not publicly disclosed.
    whyItMatters: Governance rights determine who can influence strategy, hiring, financing, and exit timing.
    diligencePath: Request the current board list, voting agreements, and investor rights summary from management or the data room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Public sources conflict on total capital raised and even on the Series D amount beyond the official announcement.
    whyItMatters: Capital history affects dilution analysis, runway interpretation, and valuation benchmarking.
    diligencePath: >-
      Reconcile the cap table and full financing history against management’s internal financing ledger and signed
      closing documents.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: No company-disclosed 2025 or 2026 revenue/ARR figure was surfaced; only third-party tracker estimates are public.
    whyItMatters: Revenue quality and recurring mix are central to judging platform durability and valuation support.
    diligencePath: >-
      Request board-approved 2024-2026 revenue, gross profit, and ARR by product line, plus customer concentration and
      churn metrics.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: geography
    missingEvidence: >-
      Reviewed sources show Brazilian founder ties but no direct, current evidence of a Brazil operating hub or office
      footprint.
    whyItMatters: >-
      Geographic operating footprint affects labor base, go-to-market scope, and potential cross-border execution
      advantages.
    diligencePath: >-
      Request the current office list, employee distribution by country, and any Brazil legal-entity or operating-team
      detail.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: >-
      Public sources surface titles for the senior bench, but they do not provide full bios, tenure dates, or a clearly
      complete executive roster.
    whyItMatters: Incomplete leadership evidence makes key-person risk and succession depth harder to score with confidence.
    diligencePath: >-
      Request a current org chart with executive bios, start dates, and reporting lines to confirm whether the public
      bench is complete.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO004 milestone completeness
    missingEvidence: >-
      Earlier financing and product milestones before 2022 rely partly on third-party databases because a full official
      archive was not surfaced.
    whyItMatters: >-
      Chronology gaps can distort how much of Loadsmart’s current platform was built organically versus added through
      later expansion.
    diligencePath: >-
      Rebuild the company timeline from archived newsroom posts, historical investor releases, and internal financing
      records.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
