  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Financing Context and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Loadsmart has enough public evidence to establish a historical price anchor, but not enough to underwrite
              that anchor today. The anchor is clear: the company raised $200 million at a $1.3 billion valuation in
              February 2022, still says it has raised $346.4 million overall, announced Q3 2024 operating profitability,
              and highlighted more than $100 million of cash in August 2024. The company also clearly has more than a
              spot-broker story, with managed transportation, Opendock, and YMS broadening the surface area that could
              justify a hybrid multiple.


              The valuation problem is that price visibility runs far ahead of economics visibility. GetLatka's $108
              million 2025 revenue estimate is the only current public revenue proxy, which makes the 2022 mark screen
              at roughly 12x revenue. That sits well above the 0.7x-2.2x range visible across public freight-execution
              comps and even above the 8x-9x range visible in public logistics software names. Because Loadsmart still
              does not publish product-level ARR, gross margin, NRR, customer concentration, or cap-table terms, the
              IC-ready call on public evidence is research-more rather than buy.
