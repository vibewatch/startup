  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-style snapshot of Loadsmart's current investment profile, balancing real platform progress against price and
      evidence deficits.
    data:
      items:
        - label: Historical price anchor
          value: 4/5
          detail: Very visible and very high, which is useful context but not positive by itself.
        - label: Software optionality
          value: 3/5
          detail: Managed transportation, Opendock, and YMS create real upside optionality.
        - label: Public disclosure quality
          value: 1/5
          detail: No public ARR, product gross margin, NRR, or preference stack.
        - label: Margin proof
          value: 2/5
          detail: Q3 2024 profitability is constructive, but 2026 quality-of-margin evidence is still thin.
        - label: Cycle backdrop
          value: 2/5
          detail: Freight data still point to a market that rewards discipline more than growth.
        - label: Comp-set fit
          value: 2/5
          detail: Loadsmart sits between freight-execution and software comps, which widens the valuation debate.
        - label: Entry attractiveness today
          value: 2/5
          detail: Interesting company, but only selectively attractive at a lower price or with much better disclosure.
