      - number: '8.4'
        title: Comparable Valuation Benchmarking
        blocks:
          - type: paragraph
            body: >-
              The public comparable picture is sobering but useful. Execution-heavy freight names such as C.H. Robinson,
              RXO, Hub Group, and J.B. Hunt screen at roughly 0.7x to 2.2x revenue on simple June 2026 market-cap
              screens, and their current commentary still emphasizes pricing discipline, profit per load, and margin
              resilience rather than a clean demand rebound. That does not mean Loadsmart should be valued exactly like
              a public broker, because Loadsmart does have software and managed-workflow surfaces that these public
              comps do not map perfectly. It does mean that brokerage economics still deserve heavy weight in the
              downside case.


              The software lens is the opposite. Descartes and Manhattan Associates screen around 8x to 9x revenue, but
              they also provide quarterly or annual disclosure that makes those multiples legible. project44's 2022 $2.7
              billion private round shows that premium logistics-software marks are possible, while Convoy and Flexport
              remind investors that freight-tech marks can also reset quickly. The right framing is therefore neither
              pure SaaS nor pure brokerage. It is a blended lens with an explicit penalty for opacity and comp-set
              mismatch.
