  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and broker-liability risk
        blocks:
          - type: paragraph
            body: >-
              Loadsmart’s public legal posture is more developed than that of a bare digital load board, but the 2026
              regulatory environment is still materially tougher for a freight broker than it was when the company
              raised its Series D. The managed-transportation MSA explicitly identifies Loadsmart as an FMCSA-registered
              property broker using third-party providers, while the user agreement and privacy policy show how much of
              the platform now sits on top of carrier, shipment, and location data rather than on simple rate discovery
              alone. That matters because FMCSA’s 2026 financial-responsibility rule is live, a broker’s security can
              trigger operating-authority suspension if it falls below $75,000 and is not promptly restored, and the
              Supreme Court’s Montgomery decision reopened state negligent-selection claims against brokers. Loadsmart’s
              terms, carrier insurance requirements, recordkeeping duties, and public security language are real
              mitigants, but the public file still does not show current BMC provider details, claims history, reserve
              policy, or how aggressively carrier vetting changed after Montgomery.
