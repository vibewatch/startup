    Salgado. The company sells a hybrid logistics stack spanning managed transportation, ShipperGuide TMS, freight
    brokerage, CarrierGuide, audit-and-pay, and Opendock/YMS tools for shippers, carriers, and warehouses. Public
    evidence shows real operating traction: a $200M Series D at a $1.3B valuation in February 2022, Q3 2024 operating
