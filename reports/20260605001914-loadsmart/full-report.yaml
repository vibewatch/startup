  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Buyer Workflows
        blocks:
          - type: paragraph
            body: >-
              Loadsmart’s product file is strongest when read as a connected workflow stack rather than as a single
              transport product. On the shipper side, ShipperGuide is positioned as the orchestration layer for
              procurement, execution, carrier management, analytics, audit, and settlement, while Managed Transportation
              offers a services-led 4PL wrapper for customers that want Loadsmart to design and operate the network with
              them. On the carrier side, CarrierGuide extends the footprint from shipper control into dispatch, load
              matching, invoicing, and back-office workflows. On the facility side, Opendock and the newer YMS/SmartGate
              layer push Loadsmart into dock, gate, and yard operations. FreightIntel AI and Copilot Tasks then sit
              across those surfaces as analytics and exception-automation overlays. That breadth is strategically
              important because it gives Loadsmart more than one entry point into an account, but it also means the
              chapter should judge module cohesion and implementation overhead, not just the headline list of SKUs. The
              public evidence supports a coherent end-to-end story, but not a simple one.
