      - number: '2.4'
        title: Growth Drivers and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              The primary growth drivers for freight-tech software are supply-chain digitization pressure, AI and
              automation demand, real-time visibility requirements, and carrier fragmentation that makes matching
              platforms structurally valuable. FMI projects AI-driven optimization and real-time visibility to remain
              consistent demand catalysts through 2036. The FreightWaves June 2026 State of the Industry report
              documents a freight market that is volatile and capacity-sensitive, with spot rates outpacing contract
              rates—a condition that raises the value of data platforms and managed transportation advisory that help
              shippers lock in capacity. The non-domicile CDL driver issue adds a new capacity-tightening risk: Triumph
              estimates approximately 190,000 drivers could exit the market over two years, further tightening supply
              and increasing shipper dependence on brokers and managed-transportation providers with carrier access.


              Structural constraints are significant and should be preserved as skeptical counterweights. First, freight
              cyclicality is a recurring headwind: the 2023–2024 freight recession compressed brokerage volumes and
              strained digital broker revenue models, demonstrating that freight-tech TAM contracts with economic
              cycles. The Cass Freight Index shows freight spend declining meaningfully during downturns. Second, margin
              compression is acute in brokerage: Triumph data shows the national median brokerage margin at roughly 12%
              in December 2025, with 1 in 4 loads at 2–4% margin even as tender rejections rose. This structural
              pressure means digital brokerage alone is not a reliable revenue base at scale. Third, integration burden
              is the dominant adoption barrier in enterprise accounts: GEP and JBF both note that TMS deployments
              require connecting to ERP systems, WMS platforms, and heterogeneous carrier networks, and that complexity
              drives long procurement cycles and high implementation costs. Fourth, carrier fragmentation—while a
              matchmaking opportunity—also constrains digital adoption because many small carriers lack EDI or API
              connectivity, requiring manual tender acceptance or phone confirmation. FMCSA data shows 2M+ carriers, and
              the vast majority are small operations. Fifth, trust and compliance risks are rising: freight brokers now
              face heightened negligent-selection litigation risk post-2026 legal developments, increasing the
              compliance cost for all broker-models. Finally, competition from scaled incumbents (CH Robinson, XPO, Echo
              Global) creates pricing pressure that limits the premium freight-tech software startups can charge on the
              brokerage side of the market.
