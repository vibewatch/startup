  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Signals
        blocks:
          - type: paragraph
            body: >-
              Loadsmart’s public materials support treating the company as a hybrid logistics platform rather than a
              pure spot broker. The official surface spans managed transportation, instant-quote freight brokerage,
              ShipperGuide workflow software, Opendock dock scheduling, a newer yard-management layer, and audit-and-pay
              style back-office services. That breadth matters because the quality of revenue depends on whether
              software and managed-service contracts can offset the structurally cyclical economics of brokerage spread.
              The strongest public monetization signals are not list prices but outcomes: managed transportation is sold
              against up-to-20% freight-cost savings, brokerage is sold around instant booking, guaranteed capacity,
              dynamic pricing, and transparent-margin contract constructs, and customer proof shows named shippers
              adopting multiple workflow modules instead of only buying truckload execution. At the same time, realized
              pricing remains opaque. None of the reviewed official pages publishes standard software ACVs, module
              pricing, implementation fees, or discount ladders. The practical conclusion is that Loadsmart clearly has
              multiple revenue streams, but the public record still says more about sales narrative and attach strategy
              than about how much each stream contributes to recurring, high-margin revenue.
