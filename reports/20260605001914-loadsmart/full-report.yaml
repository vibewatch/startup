      - number: '5.4'
        title: Trust, Data Governance, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Loadsmart’s trust posture is better documented than many private logistics software peers, but still not
              complete enough for a light-touch technical diligence. The strongest public controls are explicit:
              Loadsmart says it is SOC 2 Type II compliant, runs on AWS, encrypts data at rest with AES-256-GCM and in
              transit with TLS 1.2+, and provides 24/7 support for critical issues. Opendock’s site separately claims
              SOC 2 Type II and facility-specific compliance reporting. The privacy file is more revealing than the
              marketing pages because it makes clear how data-intensive the platform is: precise location tracking,
              asset tracking, truck diagnostics, and explicit customer responsibility to secure driver or customer
              consent where needed. The public status page is another useful signal because it proves Loadsmart is
              willing to surface incident updates publicly, but it also underscores dependence on centralized uptime.
              What remains missing are the enterprise details that matter in procurement: product-specific SLAs, RPO/RTO
              commitments, module uptime history, API throughput ceilings, and transparent data-retention schedules per
              surface.
            claimRefs:
              - CE031
