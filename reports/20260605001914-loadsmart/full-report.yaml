      - CV070
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative valuation outcomes under different revenue and multiple combinations, anchored to public comp bands
      and software-upside cases.
    data:
      items:
        - label: $108M @ 1x stressed broker multiple
          value: 108
          detail: Rough downside if Loadsmart clears like a weak freight broker.
        - label: $108M @ 2x upper freight-peer multiple
          value: 216
          detail: Still far below the old unicorn reference.
        - label: $108M @ 4x hybrid base multiple
          value: 432
          detail: Close to the center of the public base case.
        - label: $108M @ 5x hybrid-upside multiple
          value: 540
          detail: Requires credible software contribution but not full SaaS treatment.
        - label: $108M @ 8x software-peer multiple
          value: 864
          detail: Below the 2022 mark even if software-style multiples applied today.
        - label: $120M @ 8.75x software bull multiple
          value: 1050
          detail: Upper-end bull case with better disclosure and cleaner software economics.
    approximationNotes: >-
      Each bar is an analyst-generated outcome in $M using public comp ranges and the lone public revenue estimate; it
      is not management guidance.
    claimRefs:
