    title: Valuation / return range
    type: range
    layout: wide
    summary: Low, base, and high public-only valuation outcomes for bear, base, bull, and historical-reference cases.
    data:
      items:
        - label: Bear case value ($M)
          low: 150
          base: 200
          high: 250
          unit: $M
