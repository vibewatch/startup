      - number: '4.4'
        title: Cyclical Pressure and Benchmark Economics
        blocks:
          - type: paragraph
            body: >-
              The adverse file is strong enough to prevent a complacent reading of Loadsmart’s profitability claim. C.H.
              Robinson’s 2025 10-K is the clearest public benchmark for how a scaled, asset-light broker makes money:
              profit is fundamentally the spread between shipper pricing and purchased transportation, shipper
              contractual rates are typically short-dated, and much of truckload procurement still remains spot even
              against contractual customer business. That is exactly why late-cycle freight data matters. Triumph
              reports national brokerage margin compression to roughly 12% median in December 2025, with the weakest
              quartile of loads earning only 2% to 4% margins. Truckstop’s 2026 survey reinforces that brokers are
              prioritizing margins over revenue growth, which is rational only in a market where volume alone no longer
              clears the cost of capital. Cox describes the freight recession as a downturn that began in 2022 and was
              still not demand-driven in 2026. The private-company read-through is uncomfortable: Loadsmart can improve
              mix with software, but its brokerage and managed-transportation surfaces still sit in a market that
              remains pricing-sensitive, capacity-driven, and vulnerable to abrupt working-capital swings.
            claimRefs:
