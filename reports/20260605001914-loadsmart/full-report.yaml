        - Any BMC drawdown, FMCSA notice, or negligent-selection suit naming Loadsmart
        - Pause underwriting until broker security, reserve posture, and carrier-vetting controls are re-verified.
      - - Freight-cycle and margin compression
        - Spot-contract spread, diesel, and brokerage gross-profit trend
        - >-
          Carrier costs or rejection rates rise faster than shipper pricing for two consecutive quarters or gross profit
          deteriorates materially
        - Cut margin assumptions and treat software growth as insufficient unless revenue mix proves more durable.
      - - Carrier-network liquidity stress
        - Carrier churn, payment aging, or quick-pay usage
        - Evidence that payment lag, factor economics, or dispute rates are causing top carriers to leave the network
        - Assume higher procurement cost, lower service consistency, and weaker marketplace liquidity.
      - - Reliability or security breakdown
        - Public incident feed, private diligence, or breach disclosure
        - >-
          More than two material platform incidents in a quarter or any breach affecting shipment, driver, or location
          data
        - Re-rate software moat downward and require deeper diligence before underwriting cross-sell or premium pricing.
      - - Concentration or competition surprise
        - Win-loss data, renewal data, or customer concentration pack
        - A small customer set drives outsized gross profit, or large TMS/yard rivals displace anchor accounts
        - Cap valuation support and require explicit concentration disclosures before underwriting upside.
