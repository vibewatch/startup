  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Chain from historical price anchor and software optionality through current comp bands and disclosure gaps to the
      final recommendation.
    data:
      nodes:
        - id: price
          label: 2022 unicorn anchor
          detail: $1.3B historical mark still shapes expectations.
        - id: proof
          label: Real operating proof
          detail: 2024 profitability and YMS expansion show substance beyond a pure spot broker.
        - id: cycle
          label: Freight-cycle reset
          detail: 2026 market data still emphasize weak volumes and margin discipline.
        - id: comps
          label: Comp bands diverge
          detail: Public brokers trade around 0.7x-2.2x revenue while public software trades around 8x-9x.
        - id: gaps
          label: Disclosure gaps
          detail: No public ARR, gross-margin mix, NRR, or cap-table waterfall.
        - id: decision
          label: 'Recommendation: research-more'
          detail: Wait for lower price or materially better disclosure before underwriting a round.
      edges:
        - from: price
          to: comps
          label: must clear against
        - from: proof
          to: comps
          label: supports hybrid lens
        - from: cycle
          to: comps
          label: compresses
        - from: comps
          to: gaps
          label: made worse by
        - from: gaps
          to: decision
          label: forces caution
        - from: proof
          to: decision
          label: keeps interest alive
    approximationNotes: >-
      The flow is an IC reasoning aid rather than a deterministic model; each node compresses several public data points
      into one gating judgment.
    claimRefs:
      - CV007
      - CV008
      - CV014
      - CV016
      - CV044
      - CV047
      - CV048
      - CV049
      - CV055
      - CV063
