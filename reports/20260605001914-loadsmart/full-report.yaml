            body: >-
              Opendock and its newer yard capabilities are the most concrete evidence that Loadsmart is moving beyond
              brokerage-adjacent workflow claims into operational software that controls physical processes. Public
              materials show dock scheduling, driver check-in, yard management, SmartGate camera capture, carrier
              scorecards, and compliance reporting sitting inside one facility interface, while the 2025 YMS launch and
              the March 2026 release notes show post-launch iteration around unit-based scheduling, self check-out, BOL
