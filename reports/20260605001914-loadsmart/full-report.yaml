  - id: FM001
    title: Freight-Technology Market Sizing Lens — TMS Consensus vs. Digital Brokerage Subset
    type: kpi
    layout: wide
    summary: >-
      Analyst consensus places the global TMS software market at $13–23B in 2026 growing at 10–19% CAGR to 2030–2036.
      The digital freight brokerage sub-market is narrower at ~$5.2B globally in 2026 with a more modest 5.8% CAGR. Both
      markets are substantially larger than Loadsmart's current estimated revenue, implying significant addressable
      headroom even at conservative penetration rates.
    data:
      items:
        - label: TMS market — low consensus (TBRC 2025 base)
          value: $13.2B
          unit: global 2025
          detail: The Business Research Company baseline; $25.7B projected by 2030 at 14.1% CAGR
        - label: TMS market — mid consensus (GMI 2026)
          value: $16.3B
          unit: global 2026
          detail: Global Market Insights; $40.3B by 2035 at 10.6% CAGR
        - label: TMS market — high consensus (Fortune BI 2026)
          value: $21.3B
          unit: global 2026
          detail: Fortune Business Insights; $44.8B by 2034 at 9.8% CAGR; North America 39% share
        - label: TMS market — highest consensus (FMI 2026)
          value: $23.3B
          unit: global 2026
          detail: Future Market Insights; $130.4B by 2036 at 18.8% CAGR; includes AI-services expansion
        - label: BRI outlier (excluded from consensus)
          value: $213.4B
          unit: global 2026
          detail: Business Research Insights; likely includes managed logistics services; not used for software-only TAM
        - label: Digital freight brokerage (global)
          value: $5.2B
          unit: global 2026
          detail: GMI; $8.6B by 2035 at 5.8% CAGR; U.S. portion ~$1.76B in 2025
        - label: North America TMS share
          value: ~39%
          unit: of global TMS
          detail: Fortune BI 2025; implies $5–9B North America TMS TAM at consensus range
        - label: Cass freight spend proxy
