              release notes. The AI layer is more mixed. FreightIntel AI and the older AI CoPilot give Loadsmart a real
              analytics story, and Copilot Tasks suggests the company is moving from dashboards toward exception
              execution. But the public proof base is still dominated by vendor-attributed outcome claims and narrative
              demos, not independently audited accuracy, savings attribution, or benchmark studies by module. The right
              read is that the AI surface is real, yet still easier to believe as workflow augmentation than as a fully
