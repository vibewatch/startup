  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by Job To Be Done
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Loadsmart is wider than a simple list of digital freight brokers. Buyers can
              solve the same operational jobs through at least five routes: execution-led platforms that combine
              brokerage or managed transportation with software; visibility and yard specialists that extend into dock
              scheduling; procurement specialists that capture the routing-guide and tendering workflow without owning
              execution; suite incumbents that fold transportation management into a broader ERP or supply-chain stack;
              and status-quo substitutes built on spreadsheets, phone calls, email, and internal middleware. That
              framing matters because Loadsmart spans brokerage, shipper workflow software, and Opendock-style facility
              coordination. The strongest direct pressure therefore comes from companies that attack more than one of
              those layers at once. The most dangerous displacement path is often not a single competitor replacing
              Loadsmart end to end, but a stacked alternative in which procurement, TMS, visibility, and dock scheduling
              are sourced from different vendors that already sit inside the customer’s operating environment.
