      - number: '4.3'
        title: Capital Base and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Loadsmart’s funding history is well enough documented to prove it was heavily financed, but not well
              enough documented to settle the current cash picture. Official company pages still say $346.4M raised to
              date, while Tracxn says $384M and GetLatka says $309M. The high-confidence points are narrower: Loadsmart
              officially announced a $90M Series C in 2020 and a $200M Series D in 2022 at a $1.3B valuation. The most
              useful capital-adequacy datapoint is the August 2024 anniversary release, where management said the
              company had more than $100M of cash available for continued investment. That is meaningful because it
              suggests the company entered the 2024 profitability period with a real liquidity cushion, not just a
              marketing claim. Still, it is stale by mid-2026 and there is no public monthly burn, runway, or debt
              schedule. The FMCSA filing confirms Loadsmart is registered as a broker with zero power units, which
              supports an asset-light operating model and lowers capex intensity versus an owned-fleet carrier. But
              asset-light does not mean working-capital-light, especially when freight cycles are volatile and brokerage
              payables can move faster than collections. Public evidence therefore supports capital sufficiency
              directionally, but not enough to remove financing-dependency risk.
