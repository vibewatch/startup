    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Loadsmart looks strongest where workflows are unified and weakest where pricing, reliability, or proof of
      automation outcomes remain under-documented.
    claimRefs:
      - CE012
      - CE028
      - CE038
      - CE043
      - CE044
      - CE045
    data:
      columns:
        - Public maturity
        - Integration depth
        - Key risk
      rows:
        - label: Managed Transportation
          values:
            - label: Established
              tone: positive
              detail: Published deployment phases and service-led operating model.
            - label: Moderate
              tone: neutral
              detail: Backed by ShipperGuide but still engagement-led rather than self-serve.
            - label: Economics opacity
              tone: risk
              detail: Public pricing, staffing leverage, and renewal data are missing.
        - label: ShipperGuide TMS
          values:
            - label: Established
              tone: positive
              detail: Broad workflow coverage and customer/ROI marketing signals.
            - label: Strong
              tone: positive
              detail: API docs, webhooks, OAuth, and middleware story are explicit.
            - label: Implementation burden
              tone: risk
              detail: Access and integration still appear sales- and account-manager-mediated.
        - label: CarrierGuide
          values:
            - label: Established
              tone: positive
              detail: Real carrier-side TMS with marketplace and back-office workflows.
            - label: Moderate
              tone: neutral
              detail: Good adjacency to loads and EDI, but partner evidence is thinner.
            - label: Freight exposure
              tone: risk
              detail: Monetization still mixes software with network and factoring economics.
        - label: Opendock / YMS
          values:
            - label: Scaling
              tone: positive
              detail: Large stated facility footprint plus 2025-2026 launch and release cadence.
            - label: Strong
              tone: positive
              detail: APIs, real-time events, and validation protocols are documented.
            - label: Operational maturity
              tone: risk
              detail: Release notes still emphasize cleanup, bug fixes, and scalability work.
        - label: AI / analytics layer
          values:
            - label: Real but early
              tone: neutral
              detail: FreightIntel AI, CoPilot, and Copilot Tasks are public products.
            - label: Data dependent
              tone: risk
              detail: Output quality depends on integrated customer and carrier data.
            - label: Proof gap
              tone: risk
              detail: Independent accuracy, savings, and governance evidence are thin.
        - label: Trust / reliability posture
          values:
            - label: Above average for private vendor
              tone: positive
              detail: SOC 2, encryption, privacy, support, and public status signals are visible.
            - label: Moderate
              tone: neutral
              detail: Governance surfaces exist across company and facility products.
            - label: Enterprise diligence still required
              tone: risk
              detail: No public SLA, RPO/RTO, or throughput detail by module.
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public case studies suggest Loadsmart most often lands on manual scheduling or volatile-freight pain, then expands
      into carrier self-service, analytics, and adjacent workflows.
    claimRefs:
      - CU009
      - CU012
      - CU013
      - CU014
      - CU015
      - CU017
      - CU018
      - CU019
      - CU044
    data:
      items:
        - label: Manual pain discovery
          detail: >-
            Prospect is struggling with phone/email scheduling, unreliable spot coverage, or weak visibility into
            carrier and dock performance.
          tone: neutral
        - label: Initial deployment
          detail: >-
            Loadsmart or Opendock lands through a focused use case such as dock scheduling, reliable contracts, or
            dynamic routing tied to an existing TMS.
          tone: positive
        - label: Carrier self-service adoption
          detail: >-
            Carriers begin booking appointments directly or receiving instant prices and guarantees, reducing planner
            workload and manual touches.
          tone: positive
        - label: Scaled operational rollout
          detail: >-
            Named accounts expand into multi-site usage, measurable throughput gains, or ongoing program volume
            increases across additional facilities or lanes.
          tone: positive
        - label: Adjacency / expansion
          detail: >-
            The public expansion story is strongest from Opendock into analytics, gate/yard workflows, and bundled
            instant rates; cross-suite ARR proof remains incomplete.
          tone: neutral
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      The public proof set narrows quickly from logos and testimonials into a smaller subset of named customers with
      quantified outcomes and visible expansion evidence.
    approximationNotes: Values are counts of public proof points reviewed for this chapter, not disclosed customer counts.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU021
      - CU027
      - CU028
      - CU029
      - CU030
      - CU036
    data:
      items:
        - label: Named public customer references reviewed
          value: 12
          unit: accounts / references
          note: Includes named case-study customers plus named testimonials such as Scotts and StoneLoads
        - label: Named references with quantified outcomes
          value: 8
          unit: accounts
          note: Red Gold, Cascades, Ralph Moyle, GoBolt, SSA Marine, Glazer’s, IAP, Stanley Black & Decker
        - label: Named references with scaled rollout evidence
          value: 5
          unit: accounts
          note: Cascades, Red Gold, Ralph Moyle, Glazer’s, IAP show site, volume, or self-scheduling scale evidence
        - label: Named references with clear multi-product signal
          value: 2
          unit: accounts
          note: Red Gold and some Opendock accounts show cross-surface hints, but public proof is still sparse
        - label: Products with deep independent review depth
          value: 2
          unit: products
          note: Opendock and ShipperGuide have meaningful review volume; FreightIntel AI does not
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality is strongest in Opendock, moderate in ShipperGuide, and weakest in AI or broader cross-suite
      recurring-usage proof.
    claimRefs:
      - CU006
      - CU007
      - CU017
      - CU021
      - CU030
      - CU032
      - CU034
      - CU041
      - CU046
    data:
      columns:
        - Outcome specificity
        - Freshness
        - Recurring-use visibility
        - Independence
      rows:
        - label: Opendock warehouse customers
          values:
            - label: Strong
              tone: positive
              detail: Multiple named customers report quantified throughput, self-scheduling, or labor outcomes.
            - label: Strong
              tone: positive
              detail: Most named case studies are from 2024–2026, with active review volume and current scale claims.
            - label: Moderate
              tone: neutral
              detail: Scaled deployments are visible, but NRR, churn, and contract terms are still undisclosed.
            - label: Moderate
              tone: neutral
              detail: Independent reviews exist, but the strongest case studies are still vendor-authored.
        - label: ShipperGuide TMS
          values:
            - label: Moderate
              tone: neutral
              detail: Named reviews describe real workflow value, but quantified customer case studies are limited.
            - label: Moderate
              tone: neutral
              detail: Reviews are current, but public named customer references are sparse.
            - label: Weak
              tone: risk
              detail: Recurring usage is implied by daily reviewers, not by disclosed retention or cohort data.
            - label: Moderate
              tone: neutral
              detail: Review platforms provide third-party evidence, but sample sizes remain modest.
        - label: Brokerage / Reliable Contracts
          values:
            - label: Moderate
              tone: neutral
              detail: >-
                Named and anonymized cases show cost and service outcomes, but they read as projects more than software
                subscriptions.
            - label: Mixed
              tone: neutral
              detail: Several reference cases are older 2022 freight-market stories, not fresh 2026 deployments.
            - label: Weak
              tone: risk
              detail: Renewals, contract duration, and multi-product attach are not visible publicly.
            - label: Weak
              tone: risk
              detail: Most proof is company-authored and many customers are anonymized by industry.
        - label: FreightIntel AI / cross-suite platform
          values:
            - label: Weak
              tone: risk
              detail: No named customer outcomes were found for FreightIntel AI specifically.
            - label: Moderate
              tone: neutral
              detail: The product is current, but its public proof lags the rest of the suite.
            - label: Weak
              tone: risk
              detail: Cross-surface recurring usage is mostly inferred from product bundling, not demonstrated by customers.
            - label: Weak
              tone: risk
              detail: Seller-page placement exists, but independent review depth is effectively absent.
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Loadsmart’s heaviest residual risk clusters around broker-liability/compliance change, freight-cycle margin
      pressure, and a still-noisy operating surface.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Broker compliance / legal liability
          values:
            - label: medium-high
              tone: warning
              detail: Montgomery and FMCSA bond rules are live 2026 changes, not hypothetical risks.
            - label: high
              tone: negative
              detail: An adverse suit or bond drawdown can hit insurance, working capital, and customer trust at once.
            - label: medium
              tone: warning
              detail: Contracts and recordkeeping duties exist, but public reserve and vetting detail is thin.
            - label: high
              tone: negative
              detail: Residual risk stays elevated until current claims and insurance posture are visible.
        - label: Freight-cycle / margin compression
          values:
            - label: high
              tone: negative
              detail: Spot and contract conditions are still moving quickly and diesel remains expensive.
            - label: high
              tone: negative
              detail: Margin slips can unwind the software story if brokerage economics remain material.
            - label: medium
              tone: warning
              detail: Operating profitability in 2024 is real, but current software mix is still opaque.
            - label: high
              tone: negative
              detail: Residual severity remains high while revenue mix and customer concentration are private.
        - label: Carrier network / liquidity
          values:
            - label: medium-high
              tone: warning
              detail: Carrier cash flow, safety enforcement, and payment terms all shape available capacity.
            - label: high
              tone: negative
              detail: Coverage failures or slow-pay friction would directly affect service levels and buy rates.
            - label: medium
              tone: warning
              detail: QuickPay and a broad network help, but payout economics and churn are undisclosed.
            - label: high
              tone: negative
              detail: The network remains strong publicly, but its current resilience is not externally verified.
        - label: Technology / security / fraud
          values:
            - label: medium
              tone: warning
              detail: Status-page incidents and theft/fraud evidence show real operational exposure.
            - label: high
              tone: negative
              detail: A breach or prolonged outage would damage both brokerage execution and software credibility.
            - label: low-medium
              tone: warning
              detail: Security clauses, status reporting, and AI controls exist, but public SLA depth is limited.
            - label: medium-high
              tone: warning
              detail: >-
                Residual exposure remains meaningful until restore metrics, postmortems, and subprocessor detail are
                better disclosed.
        - label: Competition / concentration
          values:
            - label: medium
              tone: warning
              detail: Oracle, Uber Freight, and project44 keep investing while Loadsmart’s customer mix remains private.
            - label: high
              tone: warning
              detail: A few lost accounts or weaker software attach could pressure both revenue quality and valuation.
            - label: medium
              tone: neutral
              detail: Public references and Gartner recognition show some market traction.
            - label: medium-high
              tone: warning
              detail: >-
                Residual severity is driven by hidden concentration and better-funded alternatives rather than by zero
                traction.
    approximationNotes: null
    claimRefs:
      - CR018
      - CR019
      - CR022
      - CR031
      - CR041
      - CR042
      - CR043
      - CR045
      - CR046
      - CR047
      - CR048
      - CR049
      - CR050
      - CR055
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Loadsmart’s main risks transmit through a few shared channels: carrier quality, platform reliability, margin
      quality, and valuation support.
    data:
      nodes:
        - id: n1
          label: FMCSA / tort compliance
          description: Bond liquidity, recordkeeping, privacy, and negligent-selection exposure.
        - id: n2
          label: Carrier network quality
          description: Liquidity, safety, and capacity responsiveness of brokers and carriers.
        - id: n3
          label: Platform reliability
          description: ShipperGuide, Opendock, portals, cloud, and integration continuity.
        - id: n4
          label: Customer trust
          description: Enterprise confidence in using Loadsmart for execution and software workflows.
        - id: n5
          label: Revenue mix quality
          description: Share of gross profit coming from software/services versus cyclical brokerage.
        - id: n6
          label: Gross margin
          description: Buy-rate discipline, services intensity, and support burden.
        - id: n7
          label: Capital flexibility
          description: Ability to absorb shocks without needing weak-market financing.
        - id: n8
          label: Valuation support
          description: Whether the platform narrative remains defensible in a tougher market.
