      - number: '2.3'
        title: Buyer Segments and Adoption Dynamics
        blocks:
          - type: paragraph
            body: >-
              The freight-tech buyer universe divides into four primary segments, each with distinct procurement
              ownership structures and adoption triggers. Enterprise shippers—Fortune 1000 manufacturers, retailers, and
              consumer goods companies—own transportation budgets through centralized logistics or supply-chain
              organizations and initiate TMS and managed-transportation purchases through formal procurement cycles.
              Oracle procurement documentation shows that buyer-managed transportation can be configured at the
              negotiation, agreement, and purchase-order level, embedding freight decisions into sourcing workflows.
              This integration depth creates both an opportunity and a barrier: sophisticated enterprise buyers expect
              TMS solutions to connect with ERP and WMS systems without gaps, and the JBF TMS buyers guide identifies
              vendor proliferation, complexity, cost, and relevance as the central challenges that enterprise buyers
              navigate during discovery. CH Robinson's 2025 10-K explicitly names 4PL plus managed transportation plus
              TMS from a single provider as what shippers increasingly want—a bundled model that Loadsmart directly
              mirrors.


              Mid-market shippers are a faster-adoption segment: they have simpler TMS requirements, more willingness to
              move off spreadsheets, and shorter procurement cycles. MIT research on truckload procurement frames the
              shipper decision as a make-vs-buy framework across strategic and execution stages, with smaller shippers
              more likely to outsource execution entirely to a managed-transportation provider rather than run a TMS
              in-house. GEP notes that many companies still rely on telephonic communication for truck scheduling,
              confirming that the replacement opportunity is real but requires behavioral change.


              Warehouse and facility operators form a third segment: they buy dock scheduling and YMS tools to solve
              appointment congestion, labor-planning failures, and carrier-communication bottlenecks. project44 data
              shows facilities without appointment systems are overwhelmed by phone calls and emails from carriers,
              creating bottlenecks that slow dock-to-stock operations. Opendock customer evidence is strong: Red Gold
              achieved 18% warehouse throughput improvement, 90% appointment lead-time reduction, and 60k+ annual
              appointments fully automated; Cascades centralized scheduling across 63 plants; GoBolt improved inbound
              receiving efficiency by 20%.


              Third-party logistics providers (3PLs) represent a fourth segment: they buy TMS and managed-transportation
              infrastructure to scale operations without proportional headcount growth, and they increasingly compete
              with brokers like Loadsmart on the same enterprise accounts.
