      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Five independent research firms published TMS market estimates for 2026, and their figures diverge
              substantially—ranging from $13.2B (TBRC) to $23.3B (FMI) at the consensus end, with BRI publishing an
              extreme outlier of $213.4B that is almost certainly the result of a broader market definition encompassing
              managed transportation services, logistics outsourcing, or freight-spend totals rather than software-only
              revenue. Excluding the BRI outlier, the central consensus for the global TMS software market in 2026 is
              roughly $16–21B, and analysts project 2030–2036 end-states between $25.7B and $130B depending on CAGR
              assumptions. The wide range reflects differing scope definitions: some firms include cloud hosted and
              on-premises licensing only, while others layer in services contracts, integration, and managed-delivery
              components. All five sources agree on one directional finding: the market is growing at a double-digit
              CAGR driven by supply-chain digitization, AI adoption, and e-commerce logistics complexity.


              The digital freight brokerage sub-market is smaller and slower-growing. GMI estimates the global market at
              $5.2B in 2026 and $8.6B by 2035, a 5.8% CAGR—considerably slower than TMS growth. The U.S. component was
              approximately $1.76B in 2025. This modest growth rate reflects the structural challenge: digital brokerage
              platforms must compete on price with traditional brokers and asset-based carriers who already own trusted
              shipper relationships. Triumph data from December 2025 shows the median brokerage margin compressing to
              approximately 12% nationally, with 1 in 4 loads at only 2–4% margin. This margin environment constrains
              revenue quality for pure-play digital brokers and reinforces the strategic logic of Loadsmart's shift
              toward software-plus-services bundling.


              The North America share of the global TMS market was approximately 39.1% in 2025 per Fortune Business
              Insights, implying a North America TAM of roughly $8–9B within the global consensus range. For Loadsmart,
              the relevant SAM is narrower: it primarily serves U.S.-based shippers and facilities across truckload,
              LTL, and intermodal, with dock scheduling adding an additional adjacency. The Cass Freight Index ($37B in
              processed spend) and CH Robinson's 2025 10-K (75,000 customers, 450,000 contract carriers) bracket the
              operational scale of the freight market that freight-tech platforms compete to digitize.
