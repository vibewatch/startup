  evidenceGaps:
    - type: missing-source
      severity: material
      topic: ACF commercial customers from South Carolina facility
      missingEvidence: Redwood Materials has not publicly disclosed the names of commercial customers purchasing ACF from its South Carolina facility. The company confirmed the facility is producing and selling product but has not named buyers.
      whyItMatters: ACF revenue is a key component of the South Carolina facility business case. Without confirmed customers, it is impossible to assess the commercial progress of ACF sales or the risk of South Carolina underutilization.
      diligencePath: Request ACF customer list and supply agreement terms under NDA. Review any public procurement filings by US battery manufacturers that reference domestic copper foil supply.
