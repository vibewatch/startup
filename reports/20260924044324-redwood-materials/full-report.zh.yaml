      - number: '3.3'
        title: 能力与功能对比
        blocks:
          - type: paragraph
            body: >-
              电池回收领域的核心差异化能力维度包括：回收网络与物流体系、处理工艺与回收率、下游 CAM 制造能力、地理覆盖范围、OEM 合作深度以及监管与环保合规记录。Redwood 在回收率（公司宣称达 95%）、CAM
              制造一体化集成、契合美国汽车 OEM 布局的北美地理覆盖，以及 OEM 合作广度（Ford、Toyota、GM、VW、BMW、Volvo、Rivian、Amazon）上处于领先地位。Umicore
              则在全球规模、欧洲成熟的监管合作关系，以及长达数十年的 CAM 量产沉淀与客户关系上拔得头筹。Cirba Solutions
              在回收网络广度与多化学体系兼容（包括铅酸电池）上占优，但在综合回收率上处于劣势，且完全不具备 CAM 制造能力。Li-Cycle 的轮辐式模式展现了物流效率，却在中心枢纽提纯阶段遇阻。CATL/BRUNP
              拥有全球最深的垂直整合能力，但业务主要扎根中国。Redwood 面向 OEM 车企客户最核心的差异化卖点，在于提供全流程本土闭环解决方案：回收退役（EOL）电池、提炼金属矿物，再将再生的 CAM
              送回同一客户用于制造新电芯。目前仅有 Redwood 和 Umicore 能在具备商业意义的规模上跑通该完整闭环，且 Umicore 的闭环主要局限在欧洲。Redwood 宣称的 95% 综合回收率相比
              Umicore 等厂商采用的火法冶金工艺（约 60-70%）在大规模量产下构成了显著的经济优势，尽管该 95% 数据尚未经独立第三方审计。
            claimRefs:
              - CP001
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入构成
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials 采用双向工业收入模式，主要包含两条收入线：（1）向 OEM 车企及电池制造商提供电池收集与回收服务，收取处理费或冲抵材料返还款；（2）向将再生 CAM
              用于新电池生产的电芯制造商销售正极活性材料。第三条新兴收入线——2025 年 6 月推出 Redwood Energy
              品牌下的退役电池梯次利用储能系统租赁或销售——尚处早期阶段，在财务上尚未形成实质性贡献。处理服务的收入确认相对直接：按处理材料的公斤数收费，待废旧电池运抵 Redwood 厂区即确认收入。CAM
              销售收入则在交付给 Panasonic Energy of North America 及 Samsung SDI 等电芯客户时确认。CEO JB Straubel 披露 2024 年年化收入约为
              $200M；按其宣称的 20 GWh 年处理运行率推算，相当于每 GWh 折合约 $10——不过该数字混合了处理费与 CAM
              销售收入，具体拆分并未公开披露。两条收入线的质量均受大宗商品价格波动的直接制约：处理费可能挂钩回收金属价值，而 CAM 售价则紧跟碳酸锂、钴、镍现货市场。到 2024 年，碳酸锂价格较 2022 年峰值累计下跌约
              80%，严重压缩了定价挂钩大宗商品走势的回收加工商的单位处理收入。
