companyProfile:
  summary: >-
    Redwood Materials 是一家电池回收与关键材料公司，由 Tesla 联合创始人兼前 CTO JB Straubel 于 2017
    年创立。公司打通了垂直整合链条：回收退役锂离子电池，用专有湿法冶金工艺提炼金属，再以回收金属制造电池级负极铜箔与正极活性材料（CAM）。公司总部位于内华达州 Carson
    City，在当地建有大型制造园区，并在南卡罗来纳州规划建设第二处基地；借助 IRA 政策激励，Redwood 正在为美国 EV 产业打造本土供应链基础设施。公司于 2025 年 10 月按 $6B 估值完成 $350M Series
    E 初始交割，2026 年 1 月以 $425M 最终关账，并设立 Redwood Energy 拓展梯次利用储能业务。
