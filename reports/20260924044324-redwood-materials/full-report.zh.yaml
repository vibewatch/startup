      - number: '4.2'
        title: 成本结构与单体经济模型
        blocks:
          - type: paragraph
            body: >-
              Redwood 的成本主要来自内华达园区已投用资产的折旧与摊销（累计投用超 $2.35B）、人力支出（峰值时约 1,100 名员工）、湿法冶金处理能耗和化学试剂。公司未公开披露毛利率或
              EBITDA，导致单体经济模型分析只能依赖外部预估与同行对标。Livent 和 Albemarle 等上市电池材料加工同行在景气行情下公布的毛利率为 20-40%，但在当前低迷锂价环境下已压缩至
              5-15%。相比火法冶金，Redwood 的湿法工艺运营强度更高，但材料综合回收率明显更优，更高的金属回收产出部分抵消了较高的运营成本。规划总投资 $3.5B 的南卡罗来纳基地于 2025 年 11
              月启动一期运营，在尚未实现满产运行率收入前便带来了可观的增量折旧与产能爬坡成本。营运资金主要受废料库存、化学药剂以及电池回收至向客户交付 CAM 之间的时间窗口驱动。2025 年 11 月（裁员约 5%）与
              2026 年 4 月（裁员约 10%，约 135 名员工）的两次精简人员举措，是应对产能利用率低于计划的降本动作。
            claimRefs:
