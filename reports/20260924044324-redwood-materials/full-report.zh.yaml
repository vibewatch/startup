      - number: '5.2'
        title: 湿法冶金与火法冶金工艺的差异化对比
        blocks:
          - type: paragraph
            body: >-
              电池回收领域最根本的技术路径分歧在火法冶金（pyro）与湿法冶金（hydromet）之间。火法工艺在高温下熔炼废旧电池，将钴和镍回收为合金，但锂元素挥发损失，且后续仍需高耗能酸浸提取其他金属。湿法工艺则借助水溶液浸出并利用化学分离分别回收每种单一金属。Redwood
              采取湿法优先路线：其锂回收率达到 95% 以上；锂逐渐成为 NMC 811 和 LNMO
              正极材料的主要成本来源后，高回收率尤为关键。公司的直接锂回收（DLR）技术能绕过传统的加石灰沉淀工序，从浸出液中选择性提锂，既减少试剂消耗，也提高锂纯度。另一项优势是，Redwood
              的生产线兼容多种化学体系：能在同一设施内混合处理 NMC（111、532、622、811）、LFP、NCA
              及钴酸锂体系，相比仅针对特定正极体系优化的竞对具备原料适应性优势。这一优势格外关键，因为电池化学路线正在演变：LFP 正快速放量（到 2024 年占全球 EV 电池产量的比例已从近乎零跃升至超
              30%），钠离子电池也在崭露头角，给未来的原料成分结构带来了不确定性。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: CAM 与 ACF 产品规格及客户技术指标
        blocks:
          - type: paragraph
            body: >-
              Redwood 的两条产成品线——正极活性材料（CAM）与负极铜箔（ACF）——是一体化工艺中附加值最高的产品。正极材料端，Redwood 主要生产 NMC 811（镍锰钴比例为 80-10-10），这是
              Tesla 2170 电芯及 Panasonic 为 Model Y、Model 3 配套电芯等高能量密度 EV 应用的主流化学配方。NMC 811 CAM 必须满足电池级技术规范，包括粒径分布（D50 达
              10-12 微米）、比表面积（0.2-0.5 m2/g）及电化学性能（克容量 > 185 mAh/g，100 次循环容量保持率 > 80%）。Redwood 向 Panasonic Energy 商业化交付
              CAM，印证了其在量产规模下满足这些技术指标的能力。负极铜箔端，Redwood 生产 6、7、8 微米厚度的超薄铜箔，与日韩老牌铜箔企业（Iljin Materials、SKC、Furukawa
              Electric）竞争。超薄规格 ACF 要求极高的尺寸一致性与抗拉强度，考验专有的电沉积工艺控制能力。Redwood 在 ACF 上的差异化卖点在于使用再生铜作为原料：这带来了 IRA
              本土原产地认证优势；若精炼后的再生铜综合成本低于原生铜，还能形成潜在的成本优势。
            claimRefs:
              - CE011
              - CE012
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 超过 95% 的锂回收率形成结构性成本优势
            body: >-
              Redwood 的湿法 DLR 工艺能从电池原料中回收 95% 以上的锂，而火法工艺替代方案的锂回收率不足 5%。按当前电池级碳酸锂价格测算，锂成分已成为 NMC 811
              最主要的成本项；该回收率相对火法竞对构成了结构性的原料成本优势，降低了每公斤 CAM 产出的综合原料成本。
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: LFP 路线渗透率提升拉低每度电可回收金属价值
            body: >-
              LFP 电池不含钴和镍，仅含锂和铁。到 2030 年，LFP 在全球 EV 电池装机量中的占比预计将升至 40-50%；届时，Redwood 每处理一度电电池可回收的平均金属价值将显著下滑。公司虽然在 LFP
              工艺路线有所研发投入，但尚未公开披露 LFP 回收的经济模型；外界预计其单度电收益将明显逊于 NMC 体系。
            calloutType: risk
            claimRefs:
              - CE001
          - type: callout
            title: 工艺 Know-How 比专利组合更具防御壁垒
            body: >-
              Redwood 的正式专利组合虽覆盖了特定的工序配置，但基础湿法冶金化学原理在传统采矿业早已非常成熟。公司最具防御力的竞争壁垒在于大规模处理超 20 GWh 电池所沉淀的工艺
              know-how——这条学习曲线需要耗时数年才能复制，其涵盖的杂质控制、设备稳定性及综合收率调优等实操细节既难以申请专利保护，同样也难以被竞对逆向复刻。
            calloutType: insight
            claimRefs:
              - CE001
          - type: callout
            title: 假定商业化交付的 CAM 质量符合 Panasonic 规格
            body: >-
              基于双方持续的供应合作关系，本章假定 Redwood 向 Panasonic Energy 商业化交付的 CAM 符合电池级 NMC 811 技术指标。目前尚未见针对 Redwood 商业化 CAM
              产出的独立第三方质量检测或电化学表征数据公开发表。投资者应在签署保密协议（NDA）的前提下索取质控数据与客户验收合格凭证。
            calloutType: assumption
            claimRefs:
              - CE011
              - CE012
