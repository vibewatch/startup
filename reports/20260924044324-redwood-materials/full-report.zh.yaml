              Redwood Materials 运营着一套覆盖退役 EV 电池、电池制造废料及消费电子电池的回收网络。经公开披露确认的原料输入合作方包括：Ford Motor Company（2021 年宣布达成 EV
              电池回收伙伴关系，涵盖退役 Ford F-150 Lightning 与 Mustang Mach-E 电池）；Volkswagen Group of America（针对 Audi 与 Volkswagen
              EV 客户的退役电池回流物流伙伴关系）；Toyota（针对美国市场车型的电池回收合作）；Amazon（消费电子电池回收，重点涵盖 Ring 和 Alexa 设备电池）；Volvo Cars；以及包括
              Panasonic Energy 和 Envision AESC（供应制造废料）在内的多家电芯制造商。这套回收网络在当前阶段尤为珍贵，因为消费端 EV 电池才刚开始迎来规模化退役潮——2012-2015 年款
              Nissan Leaf 电池及 2015-2018 年款 Tesla Model S/X 电池组正步入回收期。Redwood 将电芯工厂制造废料（如 Panasonic 内华达 Gigafactory
              的次品电芯）作为近期关键原料支撑，在退役电池体量放量前提供了可预测的高品质原料供给。这套回收网络构成了战略性核心资产，因为它形成了双向依赖绑定：车企需要借助 Redwood 的回收产能满足退役电池法规要求，而
