  - id: TE001
    title: Redwood Materials 全产业链一体化工艺流程汇总
    description: Five-step process from battery collection to finished CAM and ACF products
    columns:
      - 工艺环节
      - 输入原料
      - 产出物料
      - 核心技术
      - 运营状态
    rows:
      - - 步骤 1：回收与物流
        - 退役电池、制造废料
        - 分选后的电池包
        - 逆向回收网络、物流软件
        - 已投入运营
      - - 步骤 2：机械拆解分选
        - 电池包
        - 黑粉 + 结构金属
        - 放电、破碎、物理分选
        - 已投入运营
      - - 步骤 3：湿法冶金精炼
        - 黑粉
        - 锂、镍、钴、锰、铜盐
        - 直接锂回收（DLR）、溶剂萃取、离子交换
        - 已投入运营
      - - 步骤 4：正极活性材料（CAM）合成
        - 硫酸盐金属溶液 + 锂盐
        - NMC 811 CAM（电池级）
        - 前驱体（pCAM）合成、烧结、包覆
        - 商业化产能爬坡
      - - 步骤 5：负极铜箔（ACF）生产
        - 精炼铜
        - 6–8 微米负极铜箔（ACF）
        - 电沉积工艺控制
        - 商业化产能爬坡
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All five process steps in Redwood Materials' publicly described integrated process stack, based on company
        disclosures, patent filings, and industry analyst descriptions. Stage status reflects publicly available
        information as of 2026.
    notes: CAM 与 ACF 生产（步骤 4–5）处于商业化产能爬坡阶段；截至 2026 年初尚未达到满产。内华达基地已具备全部环节的运营能力。
    sourceRefs:
      - SE001
