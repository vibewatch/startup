figures:
  - id: FO001
    title: Redwood Materials 企业里程碑时间线
    type: timeline
    summary: 梳理 Redwood Materials 自 2017 年创立至 2026 年 Series E 轮最终交割及向 Redwood Energy 业务转型的关键事件，包括 2026 年 4 月业务重组释放的不利信号。
    data:
      items:
        - label: 创立
          date: 2017-01
          detail: JB Straubel 创立 Redwood，旨在防患于未然，在电动汽车电池退役潮全面爆发前提早解决寿命终期处置难题
          tone: positive
        - label: Straubel 离开 Tesla
          date: 2019-07
          detail: Straubel 全面转岗投身 Redwood Materials，将其作为核心事业
          tone: positive
        - label: Series C 轮：约 $700M
          date: 2021-07
          detail: 当时全美清洁科技领域规模最大的融资；验证了本土电池供应链的商业逻辑
          tone: positive
        - label: South Carolina 基地
          date: 2022-02
          detail: 宣布建立东海岸制造枢纽，面向 Ford、VW 等主机厂合作伙伴提供配套服务
          tone: positive
        - label: DoE $2B 贷款承诺
          date: 2023-02
          detail: 美国政府向本土电池回收企业提供的最大一笔资金支持；提款以达成既定生产里程碑为先决条件
          tone: positive
        - label: 95%+ 金属回收中试
          date: 2023-03
          detail: 具有里程碑意义的技术成果，验证了卓越的关键矿物回收效率
          tone: positive
        - label: Series D 轮：$1B
          date: 2023-08
          detail: 由 Goldman Sachs 领投；对应投后估值超 $3.7B；稳固其独角兽地位
          tone: positive
        - label: 收购 Redux Recycling
          date: 2024-01
          detail: 收购德国电池回收企业，借此切入欧洲市场
          tone: positive
        - label: 旧金山研发中心启用
          date: 2025-04
          detail: 占地 15,000 平方英尺的湾区研发枢纽投入使用，吸引人工智能与材料科学人才
          tone: positive
        - label: Series E 轮：$350M（估值 $6B）
          date: 2025-10
          detail: 由 Eclipse Ventures 与 NVIDIA NVentures 领投，投后估值达 $6B
          tone: positive
        - label: 推出 Redwood Energy
          date: 2025-10
          detail: 面向数据中心与公用电网推出退役动力电池梯次利用储能系统
          tone: positive
        - label: Series E 轮最终交割：$425M
          date: 2026-01
          detail: 后续投资人追加认购后，Series E 轮总融资额达到 $425M
          tone: positive
        - label: 裁员约 10% 且 COO 离职
          date: 2026-04
          detail: 实施业务重组并将资源调配至储能板块；COO 离职；执行风险显著上升
          tone: negative
    approximationNotes: 时间线日期根据官方新闻稿与媒体报道日期精确至月份。2017 年创立年份确切，但具体月份未公开披露。
    claimRefs:
      - CO001
      - CO004
      - CO007
  - id: FM001
    title: 驱动美国电池回收需求的关键监管与市场事件
    type: timeline
    summary: 按时间顺序梳理驱动 Redwood 电池循环经济业务市场需求的一系列政策监管、底层技术与市场关键事件。
    data:
      items:
        - label: 《通胀削减法案》（IRA）签署通过
          detail: 第 30D、45X 与 48C 条款确立了本土制造比例要求，并为电池关键材料提供了生产制造税收抵免。
          date: '2022-08-16'
          tone: positive
        - label: DOE ATVM $2B 贷款有条件承诺
          detail: 美国能源部通过先进技术汽车制造（ATVM）项目承诺向 Redwood 提供 $2B 贷款，专项支持 Nevada 和 SC 基地的扩建。
          date: '2023-02-09'
          tone: positive
        - label: 碳酸锂价格暴跌
          detail: 碳酸锂现货价格从 $80K/MT 的历史高位骤跌超过 80%，沉重打击了废料回收的经济效益，给近期业务利润率带来严峻考验。
          date: '2023-06-01'
          tone: negative
        - label: Li-Cycle 暂停 Rochester 核心枢纽建设
          detail: 电池回收商 Li-Cycle 因现金流枯竭被迫暂停其旗舰枢纽工地的施工；向尚未实现规模效应的美国回收企业敲响了资金链风险警钟。
          date: '2023-10-23'
          tone: negative
        - label: 与 Ford 的 ACF 供应协议生效
          detail: Redwood 开始从 South Carolina 基地向 Ford 交付负极铜箔（ACF）；标志着首个美国本土负极铜箔供货合作正式进入执行阶段。
          date: '2024-01-01'
          tone: positive
        - label: IRA 30D 电动汽车购车税收抵免终止
          detail: 本届政府终止面向消费者的电动汽车税收抵免政策，抑制电动汽车渗透率的增长预期，也压低短期退役电池原料供给预期。
          date: '2025-09-30'
          tone: negative
        - label: 欧盟新电池法规生效
          detail: 欧盟强制推行新电池中回收金属含量的最低法定标准（到 2031 年钴达 16%、锂达 6%、镍达 6%），推动构建全球范围的合规倒逼压力。
          date: '2027-01-01'
          tone: positive
        - label: 电动汽车退役潮正式拉开帷幕
          detail: 第一代规模化普及的纯电动汽车逐步达到 8-10 年使用寿命；预计美国本土废旧电池回收原料供应规模将迎来爆发式放量。
          date: '2027-06-01'
          tone: positive
        - label: IRA 本地化含量要求：100% 关键矿物采购比例
          detail: 获得 IRA 30D 税收抵免资格所要求的本土或自贸协定（FTA）伙伴国关键矿物采购比例达到 100% 最高门槛。
          date: '2028-01-01'
          tone: positive
    claimRefs:
