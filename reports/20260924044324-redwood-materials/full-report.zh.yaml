              Redwood 供应材料的明确意向。Toyota 的合作既涵盖 EV 退役电池回收，也包含 Toyota 为其美国本土制造业务采购本土电池材料的意向。Redwood 还与 Volkswagen Group of
              America 签约，负责 Audi e-tron、Q4 e-tron 及 ID.4 车型的电池回收物流。上述 OEM 车企伙伴共同构筑了网络效应：每新增一家车企伙伴，便能增强原料回收供给，进而增强吸引更多
              CAM 与 ACF 产成品客户的说服力，反过来又会吸引更多寻求本土材料供应的车企加盟。这一网络效应的反向风险在于：若车企 EV
