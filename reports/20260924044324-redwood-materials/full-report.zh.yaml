      - number: '3.2'
        title: 直接竞对与在位企业画像
        blocks:
          - type: paragraph
            body: >-
              Li-Cycle Holdings 曾是北美领先的纯锂电回收龙头，但在 2023 年叫停其 Rochester Hub 湿法冶金工厂建设后，于 2024 年申请 Chapter 11
              破产重组。在其业务巅峰期，Li-Cycle 采用轮辐式（spoke-hub）模式：在分布式轮辐工厂破碎电池，再将产物运往中心枢纽进行湿法提炼，折合年处理电池材料约 5-6 GWh。Rochester Hub
              因工程成本超支及原料供应不足而折戟，印证了大规模电池回收面临的巨额资本开支与节奏错配风险。Ascend Elements（原名 Battery Resources）专注于生产回收正极材料，于 2026 年 4
              月申请 Chapter 11 破产保护；其商业模式与 Redwood 的一体化回收至 CAM 路线最为相似。Cirba Solutions 由 Retriev Technologies 与 Battery
              Solutions 合并而成，是北美本土幸存的最具威胁的替代选项；其实际处理包括锂离子、NiMH 和铅酸在内的多种化学体系电池，但并不生产 CAM，属于纯回收型竞对。Umicore
              是最具统治力的全球老牌巨头，在比利时和韩国拥有大型火法冶炼回收产能，能规模化量产 CAM，并与头部电池厂签有长期供料协议；Umicore 近年年化营业收入超过 €4B。全球最大电池制造商 CATL 在中国设立
              BRUNP Recycling 作为回收子公司，正持续扩张回收产能；CATL 在中国本土打通的电池制造与回收一体化模式是最具威胁的长期潜在对手，但其进入北美市场面临法规与地缘政治壁垒。
            claimRefs:
