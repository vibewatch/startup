              输送工厂制造废料（次品电池与不合格电芯）作为回收原料，形成了双向循环闭环。负极铜箔端，除宣称南卡罗来纳基地正向美国本土电池供应链供货外，Redwood 尚未公开披露任何商业化客户。潜在 ACF 买家包括
              Panasonic Energy（用于其内华达电芯）、Samsung SDI America（田纳西州 Blue Oval City 基地）以及 LG Energy Solution（多处美国本土设施）。ACF
              客户未予披露是一大尽调盲区：目前尚无法确认 Redwood 是否已规模化销售，还是仍处于潜在买家的产品导入认证阶段。客户集中度风险也极高：若 Panasonic Energy 将 CAM
              采购分流给韩国供应商（POSCO Future M、EcoPro BM）或自行搭建 CAM 产能，Redwood 短期内的 CAM 收入将受到实质性冲击。
