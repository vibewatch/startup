          历史峰值
      - - 估值立场
        - 按 $5.5B 估值计算估值充分至偏高；对应 12-18x 2025E 收入，而 Umicore 仅为 0.8-1.5x
        - 估值溢价需要 DOE 贷款落地、SC 基地产能爬坡与锂价回暖同时兑现；按当前估值缺乏安全边际
      - - 退出路径与持有期限
        - 2028-2030 年出售给主机厂或行业战略买方是最现实的退出路径；2026 年 IPO 环境严峻
        - 公开市场对尚未盈利的基础设施资产接纳度有限；Ford、Panasonic 与 Toyota 的合作证实了主机厂的战略兴趣
    notes: 建议仅基于截至 2026 年 5 月的公开证据。签署 NDA 进入数据室审查管理层资料将显著提升置信水平。DOE 贷款正式交割或 SC 基地 2026 年 Q4 产能吞吐量里程碑的公开披露，将是后续最值得监测的高价值指标。
    claimRefs:
      - CV003
      - CV006
      - CV009
      - CV012
  - id: TV002
    title: 投资逻辑与反向逻辑对比表
    columns:
      - 核心支柱
      - 投资逻辑
      - 反向逻辑
      - 预期差反转催化剂
    rows:
      - - 市场地位
        - 据 BNEF 测算，占据美国废旧电池回收市场约 50% 份额；本土龙头地位稳固；到 2030 年市场规模将达 $15-25B
        - 市场份额数据仅为公司口径且未经证实；相比 NMC，向 LFP 电池体系的技术切换可能侵蚀每吨材料回收价值
        - 第三方分析机构出具的独立市场份额审计；BNEF 或 Wood Mackenzie 发布美国电池回收市场份额榜单
      - - 政策支持
        - IRA 45X 构筑了 $35/kWh 的结构性护城河；FEOC 规则将与中国 CATL 关联的电池材料阻挡在符合 IRA 资格的供应链之外
        - IRA 30D 消费者税收抵免于 2025 年 9 月终止，拖慢电动汽车普及速度并减少原料来源供给；45X 面临政策逆转风险
        - 2027 年国会审议确认保留 45X 条款；政府释放关税政策保持稳定的信号
      - - 客户关系
        - Ford、Panasonic 与 Toyota 的供应协议锁定了废旧原料输入与 CAM/ACF 产成品销售收入
        - 协议条款未披露；若 Panasonic 推进采购多元化将带来集中度风险；Ford 电动汽车产能爬坡延后推迟了原料回收周期
        - 至少两家主机厂合作伙伴确认了多年期合同条款与采购量承诺
      - - 资本结构
        - DOE 的 $2B 有条件贷款使 SC Phase 2 减少了等额 $2B 稀释性股权融资需求；45X 在 10 年有效期内形成 EBITDA 缓冲垫
        - DOE 贷款尚未正式交割；Ascend Elements 前车之鉴表明，一旦发生重大不利事件，有条件拨款可能被撤回
        - DOE ATVM 贷款于 2026 年底前完成最终交割与首笔提款；SC 基地未发生重大不利事件
      - - 技术护城河
        - 回收效率达到 95% 或更高；拥有专有湿法冶炼工艺；规模效应构筑回收网络壁垒
        - 若缺乏 IRA 保护，中国制造商成本要低 20-40%；转向 LFP 体系在结构上压缩了每吨处理收益
        - 公布兼容 LFP 体系的工艺路线图；美国关税执行力度保持持续；NMC 电池体系的主导地位延续至 2028 年
    notes: 投资逻辑与反向逻辑代表截至 2026 年 5 月有证据支持的投资人论点。各大支柱均具有实质重要性；该投资逻辑要求全部五个支柱在未来 4-5 年内同时成立，条件极为苛刻。
    claimRefs:
      - CV003
      - CV006
      - CV009
      - CV012
  - id: TV003
    title: 乐观、基准与悲观情景推演表
    columns:
      - 情景
      - 发生概率
      - 核心假设
      - 2028E 预期收入
      - 隐含估值
      - 首要下行触发因素
    rows:
      - - 乐观情景
        - 20%
        - DOE 贷款于 2026 年 H1 完成交割；SC Phase 1 到 2027 年年产能达到 45 GWh 或更高；锂价回升至 $15,000/MT 或以上；LFP 份额稳定在 55% 以下；IRA 45X 保持完整
        - $1.2-1.8B
        - $9-15B（对应 7-8x 收入乘数）
        - SC 建设工期严重超支；未达成 DOE 里程碑；到 2027 年 LFP 渗透率迅速突破 65%
      - - 基准情景
        - 50%
        - DOE 有条件贷款于 2026 年按可能修改后的条款转为正式贷款；SC Phase 1 到 2028 年年产能达 30 GWh（较计划推迟约一年）；锂价维持在 $10,000-14,000/MT；45X 保持完整
        - $700M-1.1B
        - $4.5-7.5B（对应 5-7x 收入乘数）
        - SC 产能爬坡慢于计划；Panasonic 单一客户集中度风险；锂价持续低于 $12,000/MT
      - - 悲观情景
        - 30%
        - DOE 贷款拖延至 2027 年后或额度被大幅削减；锂价连续两个或更多季度低于 $8,000/MT；SC Phase 2 被迫以折价估值进行困境股权过桥融资
        - $250-450M
        - $1.5-3.0B（对应 3-5x 困境估值收入乘数）
        - 发生不利事件后 DOE 贷款被撤回；按 Series C 轮价格折价 50-75% 实施降估值融资（down-round）
    notes: 收入与估值预估均为分析师基于公开证据做出的推算。经审计财务报表将显著提升准确度。概率信号是基于 2026 年 5 月公开证据质量的主观预估。锂价走势与 DOE 贷款交割情况是杜绝下行风险的两个最高杠杆可观察指标。
