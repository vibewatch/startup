      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              多份独立行业测算均指向一个规模庞大但竞争激烈的市场机遇。按最宽泛口径，BloombergNEF 预估 2030 年全球电池材料制造总规模将达每年 $120–150B，但该 TAM 与 Redwood
              当前的实际产能关联不大。更具参考意义的全球指标是单一锂离子电池回收市场：SNE Research 预估其规模将从 2022 年的约 $3B 增长至 2030 年的约 $22B；MarketsandMarkets
              预测 2030 年达约 $17.6B（CAGR 约 23%）；IDTechEx 的预测则偏保守，预计 2033 年达
              $14.5B。各家口径存在分歧且未作调和，原因在于统计范围各异——部分机构仅统计回收收集与破碎处理，另一些则延伸至精炼材料销售。

              聚焦北美本土，可服务市场（SAM）的测算更为明确。将北美废旧电池回收材料市场（2030 年约 $5–7B）、美国本土超级工厂正极材料需求（2030 年每年约 $8–12B）以及铜箔需求（2030 年约
              $2–3B）综合计算，得出北美电池材料 SAM 约为 $15–25B。美国能源部在《国家锂电池蓝图》中预计，到 2030 年美国本土 EV 生产将需要 650,000 MT 锂和 300,000 MT 镍，这为
              Redwood 回收和精炼的关键矿物创造了直接需求。

              Redwood 的可获取市场（SOM）直接受制于其实际物理产能：内华达园区（目标年产约 100 GWh/yr CAM）与南卡罗来纳基地（目标年产约 100 GWh/yr
              ACF）若全部投产且按当前价格测算，对应年潜在收入为 $2–5B——不过，碳酸锂价格较 2022 年高点累计下跌 80%，大幅压缩了这一预测区间。鉴于公开预估数据相互矛盾且 Redwood
              财务数据未公开，目前尚无法精确验证其 SOM。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 增长驱动力与需求催化剂
        blocks:
          - type: paragraph
            body: >
              六大结构性驱动力支撑着 Redwood 一体化方案的市场需求。第一，2022 年出台的《通胀削减法案》（IRA）是美国最关键的政策催化剂。第 30D 条要求本土关键矿物含量达到 40%+，并于 2028 年提升至
              100%；第 45X 条为美国本土制造的正极与负极材料提供先进制造生产税收抵免——直接为 Redwood 的 CAM 和 ACF 产出变现；第 48C 条则将投资税收抵免扩大至先进能源制造领域。尽管现任政府已于
              2025 年 9 月 30 日终止了面向消费者的 EV 税收抵免（30D），但制造端激励（45X、48C）仍然有效。

              第二，美国 EV 渗透率攀升形成持续扩大的保有量，源源不断输送回收原料。IEA 预计到 2030 年美国道路上的 EV 将达 26M 辆，远高于截至 2023 年的约 6.5M 辆。BloombergNEF
              预估到 2030 年美国将有约 2M 个 EV 电池组需要回收；首批大众市场电动车陆续进入退役期后，2027 年起回收量预计将快速增长。消费电子产品仍是近期重要的原料过渡桥梁——EPA 估计全美每年报废 15B
              只锂离子电芯。

              第三，对华脱钩政策使得供应链自主与安全上升为国家安全战略。目前美国 70%+ 的正极活性材料和 90%+
              的负极材料依然依赖从中国进口。第四，整车厂设立的电池可持续发展指标催生了确定性的包销需求。Ford、GM、Toyota、BMW 和 Panasonic 均作出了电池闭环循环承诺，并与 Redwood
              签署了供应或回收协议——同时锁定了原料回收来源与成品材料销路。第五，2027 年生效的《欧盟电池法规》强制规定了最低回收料占比（到 2031 年达到 16% 钴、6% 锂、6% 镍）。第六，AI
              数据中心储能热潮成为 Redwood Energy 的新兴需求催化剂——按单度电（per-kWh）成本计算，退役 EV 电池组相比全新 LFP 系统能节省 40–60% 的开支。
            claimRefs:
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials 面临的竞争格局划分为五类参与者：（1）北美本土锂离子电池回收直面竞争对手——Cirba Solutions、Li-Cycle（已进入破产重组 Chapter 11）与
              Ascend Elements（已进入破产重组 Chapter 11）；（2）全球老牌电池材料在位供应商——Umicore、BASF、Sumitomo Metal
              Mining，它们以原矿开采或火法冶金加工材料提供最主要的现状替代方案；（3）中国一体化巨头——CATL 旗下 BRUNP Recycling 与 GEM
              Co.，它们在亚洲回收领域占据主导地位并在向全球扩张；（4）潜在的内部闭环回收商——包括 Panasonic、Samsung SDI 和 LG Energy Solution 在内的电池制造商，目前虽向
              Redwood 供应废料，但业务规模扩大后，未来可能将回收业务收归自营；（5）填埋与出口的现状模式，这在许多司法辖区依然合法且无需任何资本投入。Redwood 的差异化壁垒在于从回收直至 CAM
              产出的一体化闭环模式、庞大的处理规模（年处理超 20 GWh），以及形成双向供需绑定的 OEM 合作网络。尝试类似一体化路线的两家北美直接竞对（Ascend Elements 与
              Li-Cycle）均已申请破产保护，Redwood 的先发优势与资本获取能力由此与后发追随者拉开了结构性差距。
