            body: >-
              Redwood Materials 依据商业供应协议向美国本土电池制造商销售其两大产成品——NMC 811 正极活性材料（CAM）与负极铜箔（ACF）。目前唯一公开确认的 CAM 输出端客户是 Panasonic
              Energy，后者与 Toyota 联合运营内华达 Gigafactory 并向多家 OEM 车企供应电芯。与 Panasonic 的合作极具战略价值：Panasonic 的 Gigafactory 与
