  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险严重度评级总览与投资判断
        blocks:
          - type: paragraph
            body: >-
              投资前，投资者必须审视 Redwood Materials 面临的五类环环相扣的高危风险。第一，IRA 45X 先进制造生产补贴若被削减，是最大的单一政策风险；每千瓦时 35 美元的 CAM 补贴，是
              Redwood 抵御韩国厂商的核心利润缓冲。第二，美国财政部若收紧 FEOC 指引，可能限制采用 Redwood CAM 的下游汽车 OEM 享受电动车税收抵免，削弱客户支付本土溢价的意愿。第三，NMC 811
              正极材料在吉瓦时级规模下的工艺放大，仍未经独立第三方验证。第四，美国能源部（DOE）ATVM 贷款条款要求达成未公开的生产里程碑；历史数据显示，大约十分之三的条件性承诺未能推进至最终交割。第五，客户过度集中于
              Panasonic 与 Tesla 体系，同时放大了电动车市场波动与 DOE 贷款执行风险。当 45X 补贴削减超过每千瓦时 10 美元且 DOE
              贷款最终交割同时告吹时，将触发投资逻辑破裂；单一事件尚可通过调整财务模型消化，两项叠加则必须彻底重估投资逻辑。投资者须将工厂审查权、DOE 里程碑透明度以及 Panasonic 合同审查列为投资前提。按约 55
              亿美元的 Series E 入场估值计算，只有在 45X 补贴基本保持完整且南卡罗来纳基地如期爬坡的前提下，风险调整后收益才具备吸引力。
