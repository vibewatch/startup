      - number: '4.3'
        title: 资本充足度与融资能力
        blocks:
          - type: paragraph
            body: >-
              Redwood 的资本结构十分庞大。公司历经多轮融资已累计获得约 $2.3B 股权融资。最近一轮为 2025 年 10 月初始交割 $350M 的 Series E 轮，由 Eclipse Ventures
              领投，NVIDIA NVentures 参投，估值超 $6B；随后于 2026 年 1 月完成 $425M 最终关账。美国能源部于 2023 年 2 月针对其内华达园区电池材料生产基地提供了 $2B ATVM
              贷款有条件承诺。截至 2026 年 5 月，DoE 贷款的具体提款状态尚未获公开证实——Redwood 尚未宣布该笔贷款正式交割或初始资金到账，这仍是一项重大不确定性。在手现金未公开披露；2025 年底完成的
              $350-425M 最新融资提供了充足的现金跑道，但月度烧钱速度与南卡罗来纳建设资本开支排期并未公开。南卡罗来纳基地规划预算总计 $3.5B；2025 年 11
              月一期工程投产表明已有部分资本落地，但完整建设周期与后续资金来源尚不明朗。2026 年 4 月的裁员表明管理层在产能利用率低于计划时主动控制经营现金流出，但并未提供关于烧钱速度或现金跑道的直接透明度。自 2022
              年以来，公司公开讨论过将 IPO 作为战略选项；截至 2026 年年中的市场环境与营收轨迹很可能决定具体上市时机。DoE 贷款正式交割是一项关键融资事件：若正式落地，将为内华达基地提供 $2B
              低于市场利率的债务融资，大幅降低对股权资本的依赖。
            claimRefs:
              - CI001
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 端到端湿法冶金工艺全流程
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials 的技术架构核心由五个连续工序构成，协同将退役电池与工厂制造废料转化为可直接用于电芯制造的电池级材料。第一步为收集与物流：Redwood 运营着覆盖 EV
              车企、消费电子品牌及电池制造商的回收网络，截至 2024 年折合材料年处理量已超 20
              GWh。第二步为机械处理与黑粉制备：对电池进行放电、拆解、破碎分选，制成黑粉（含正负极活性材料、铜箔与电解液残留物的混合粉末）。第三步为湿法冶金提炼：利用酸溶液溶解黑粉，借助溶剂萃取、离子交换及专有的直接锂回收（DLR）工艺，对锂、镍、钴、锰、铜进行选择性分离纯化。第四步为
              CAM 合成：将高纯硫酸镍、硫酸钴、硫酸锰与锂盐化合制成正极前驱体（pCAM），经过烧结制备出电池级 NMC 811 正极活性材料。第五步为 ACF
              制造：在精炼阶段回收的再生铜经过进一步纯化与电沉积，生产出契合电池电芯要求的 6-8 微米超薄负极铜箔。五道工序在内华达园区全面整合，消除了工序间的物流运输成本与物料损耗；据 Redwood
              预估，这相比割裂的供应链带来了 15-20% 的良率与收率优势。
