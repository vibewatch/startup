chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与产品体系
        blocks:
          - type: paragraph
            body: >
              Redwood Materials, Inc. 是一家美国先进材料与能源技术私营公司，总部位于内华达州 McCarran（地处 Reno-Sparks 都会区）。公司由 Jeffrey Brian "JB"
              Straubel 于 2017 年创立；Straubel 此前联合创立 Tesla 并担任首席技术官约 15 年，后于 2019 年 7 月离职。Straubel Straubel
              当初的判断是：建设美国本土电池供应链，若要兼顾成本与环境韧性，与其开采新的关键矿物，不如从已投入使用且数量日增的 EV 和消费电子锂离子电池组中回收金属。

              Redwood 的使命是打造完全闭环的电池循环经济。其四阶段模式涵盖：（1）整合来自汽车
              OEM、电子制造商及消费端回收计划的退役电池回收与物流；（2）借助湿法冶金与火法冶金工艺提取镍、钴、锂、铜和锰；（3）规模化提纯与制造电池中价值密度最高的两大组件——正极活性材料（CAM）与负极铜箔（ACF）；（4）2025
              年起，设立 Redwood Energy 部门，将退役 EV 电池组改装为面向数据中心与工业园区的电网级储能系统。据 Redwood 宣称，公司关键矿物回收率超 95%，年处理电池容量约 20 GWh；截至
              2025 年，这一处理量约占北美全部锂离子电池及电池回收材料的 90%。
