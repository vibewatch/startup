tables:
  - id: TM001
    title: 'Redwood Materials Market Segments: Definition and Boundaries'
    type: enumeration
    summary: Five market segments Redwood participates in, with included/excluded spend and status-quo substitutes.
    columns:
      - Market Segment
      - Included Spend
      - Excluded Spend
      - Status-Quo Substitute
    rows:
      - - Li-ion Battery Collection & Processing
        - OEM take-back contracts, black-mass production, scrap logistics
        - Lead-acid recycling, NiMH battery recycling
        - Overseas smelting (Belgium/South Korea), landfill disposal
      - - Critical Mineral Refining
        - Li, Ni, Co, Mn, Cu intermediate production sold to manufacturers
        - Primary mining output, rare earth element refining
        - Chinese refined material imports (CNGR, Hunan Shanshan)
      - - Cathode Active Material (CAM) Manufacturing
        - NMC/NCA precursor and CAM production; OEM supply agreements
        - LFP cathode (not Redwood's current chemistry), cell assembly
        - Korean CAM producers (EcoPro, L&F), Chinese (BTR)
      - - Anode Copper Foil (ACF) Manufacturing
        - Battery-grade copper foil for anode substrates; SC campus output
        - General-purpose copper foil, printed circuit board foil
        - Korean/Japanese copper foil (Iljin Materials, Fukuda Metal)
      - - Second-Life Energy Storage (Redwood Energy)
        - Repurposed EV packs for grid/data-center storage; project revenue
        - New-chemistry grid storage (flow batteries, Na-ion)
        - New LFP systems (CATL, BYD), utility-scale new-build projects
    notes: Segment boundaries reflect Redwood's commercial footprint as of 2025-2026; adjacencies (direct lithium extraction, EU market via Redux) are excluded from SAM calculations in this chapter.
    enumerationScope:
      coverage: exhaustive
      basis: Covers all five business segments publicly disclosed by Redwood Materials across press releases, DOE loan documentation, and company website as of May 2026. No additional revenue-generating segments have been publicly announced.
