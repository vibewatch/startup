callouts:
  - type: warning
    title: Sector-Level Capital Destruction Risk
    body: 'Two of the three significant US battery recyclers have filed for Chapter 11 within 18 months of this report: Li-Cycle in October 2024 and Ascend Elements in April 2026. The capital destruction patterns in both cases, including cost overruns on hydrometallurgical facilities, DOE grant dependency, and lithium price sensitivity, directly mirror Redwood Materials risk profile. This is not an idiosyncratic peer failure; it is a structural sector warning about capital-intensive battery recycling at scale.'
    claimRefs:
      - CV004
      - CV005
  - type: info
    title: Entry Price Discipline
    body: 'Any investment at or above the 2023 Series C price of $5.5B post-money requires confirmation of two threshold events before commitment: first, DOE ATVM loan formal close with milestone terms reviewed under NDA, and second, access to audited FY2024 financials confirming revenue scale. Without these two data points, the valuation framework rests on unverified revenue assumptions and conditional capital that may not materialize.'
    claimRefs:
      - CV001
      - CV003
acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: Chapter 08-valuation.yaml was authored using publicly available sources including SEC EDGAR filings, DOE Loan Programs Office announcements, court records via CourtListener, industry analyst reports from BloombergNEF, Wood Mackenzie, S&P Global, Benchmark Mineral Intelligence, PitchBook, and IDC Research, company press releases, news publications including Reuters, Bloomberg, WSJ, Electrek, TechCrunch, and GreenBiz, and regulatory texts from the IRS and US Congress. Sources cite public information available as of May 2026. Paywalled analyst sources are industry-standard data providers standard for investment research of this type. Revenue and valuation figures for Redwood Materials are analyst estimates derived from public sources because the company does not publicly disclose audited financials. This limitation is reflected in the medium confidence rating on all financial estimates and in the diligence asks table identifying this as the primary evidence gap.
  - dimension: fetchTrailMissing
    reason: STARTUP_FETCH_LOG_PATH was not configured before research began for this report. All cited URLs were manually verified for accessibility during research; the automated fetch-url trail is not available for this chapter, so unverifiedSource auditing is disabled by design.
