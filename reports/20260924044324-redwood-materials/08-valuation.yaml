  - id: TV002
    title: Thesis and Anti-Thesis Table
    columns:
      - Pillar
      - Investment Thesis
      - Anti-Thesis
      - View Change Catalyst
    rows:
      - - Market Position
        - Approximately 50% US recycled battery market share; dominant domestic position; $15-25B market by 2030 per BNEF
        - Market share claim company-stated and unverified; LFP chemistry shift may erode per-tonne value versus NMC
        - Independent market share audit from third-party analyst; BNEF or Wood Mackenzie US battery recycling share table publication
      - - Policy Support
        - IRA 45X creates $35/kWh structural moat; FEOC rules block Chinese CATL-linked battery materials from IRA-eligible supply chains
        - IRA 30D consumer credit ended September 2025 slowing EV adoption and feedstock pipeline; 45X subject to political reversal
        - 45X preservation confirmation through 2027 Congressional review; tariff policy stability signal from administration
      - - Customer Relationships
        - Ford, Panasonic, Toyota supply agreements anchor feedstock input and CAM/ACF product output revenue
        - Agreement terms undisclosed; Panasonic concentration risk if Panasonic diversifies sourcing; Ford EV ramp delays reduce feedstock timing
        - Confirmed multi-year contract terms and volume commitments from at least two OEM partners
      - - Capital Structure
        - $2B DOE conditional loan reduces need for $2B in dilutive equity for SC Phase 2; 45X creates EBITDA buffer over 10-year life
        - DOE loan not formally closed; Ascend Elements precedent shows conditional grants revocable on material adverse events
        - DOE ATVM loan final close and first draw by year-end 2026; no adverse events at SC campus
      - - Technology Moat
        - 95% or higher recovery efficiency; proprietary hydrometallurgical process; scale creates collection network effects
        - Chinese producers at 20-40% lower cost without IRA protection; LFP shift compresses per-tonne economics structurally
        - LFP-compatible process roadmap disclosed; sustained US tariff enforcement; NMC battery chemistry dominance through 2028
    notes: Thesis and anti-thesis represent evidence-supported investor arguments as of May 2026. Each pillar is independently material; the investment thesis requires all five holding simultaneously over 4-5 years, which is a demanding conjunction of conditions.
