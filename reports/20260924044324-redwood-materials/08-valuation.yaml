    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
    rows:
      - - Overall Recommendation
        - 'CONDITIONAL WATCH: do not invest at $5.5B without DOE loan closure confirmation and audited financials'
        - Two US peer bankruptcies in 18 months; $5.5B demands flawless 4-year execution; audited financials unavailable
      - - Confidence Level
        - 'Medium: strategic positioning confirmed; financial performance unverified'
        - 30 sources confirm OEM agreements, DOE loan, and market position; audited financials not publicly available
      - - Risk Rating
        - 'High: capital intensity trap, DOE loan binary risk, sustained lithium price headwinds'
        - Li-Cycle $1.7B Chapter 11; Ascend Elements $542M Chapter 11; lithium at $12,000/MT vs. $81,000 peak
      - - Valuation Stance
        - Full valued to modestly overvalued at $5.5B; 12-18x 2025E revenue vs. Umicore at 0.8-1.5x
        - Premium requires simultaneous DOE loan, SC ramp, and lithium recovery success; no margin of safety at current price
      - - Exit and Hold Horizon
        - Trade sale to OEM or strategic buyer most realistic exit 2028-2030; IPO conditions difficult in 2026
        - Public markets constrained for pre-profitability infrastructure; OEM strategic interest validated by Ford, Panasonic, Toyota partnerships
    notes: Recommendation based solely on public evidence as of May 2026. Management access under NDA for data room review would materially improve confidence level. DOE loan formal close or SC campus Q4 2026 throughput milestone disclosure would be the highest-value public indicators to monitor.
