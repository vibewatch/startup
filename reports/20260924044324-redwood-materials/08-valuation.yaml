      - CV012
  - id: TV003
    title: Bull Base Bear Scenario Table
    columns:
      - Scenario
      - Probability
      - Key Assumptions
      - 2028E Revenue
      - Implied Valuation
      - Primary Downside Trigger
    rows:
      - - Bull Case
        - 20%
        - DOE loan closes H1 2026; SC Phase 1 at 45 GWh per year or more by 2027; lithium recovers to $15,000/MT or above; LFP share stabilizes below 55%; IRA 45X intact
        - $1.2-1.8B
        - $9-15B at 7-8x revenue multiple
        - SC construction overrun; DOE milestone failure; rapid LFP adoption above 65% by 2027
      - - Base Case
        - 50%
        - DOE conditional loan converts in 2026 on possibly modified terms; SC Phase 1 at 30 GWh per year by 2028 approximately one year behind plan; lithium $10,000-14,000/MT; 45X intact
        - $700M-1.1B
        - $4.5-7.5B at 5-7x revenue multiple
        - Slower SC ramp than plan; Panasonic customer concentration risk; lithium remaining below $12,000/MT
      - - Bear Case
        - 30%
        - DOE loan delayed beyond 2027 or reduced materially; lithium below $8,000/MT for two or more quarters; SC Phase 2 requires distressed equity bridge at discounted valuation
        - $250-450M
        - $1.5-3.0B at 3-5x distressed revenue multiple
        - DOE loan revocation following adverse event; down-round at 50-75% haircut from Series C price
    notes: Revenue and valuation estimates are analyst projections from public evidence. Audited financials would materially improve accuracy. Probability signals are subjective estimates based on May 2026 public evidence quality. Lithium price and DOE loan closure are the two highest-leverage observable indicators.
