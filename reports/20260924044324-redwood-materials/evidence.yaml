  - id: CO002
    statement: >-
      Redwood's four-stage model encompasses battery collection, hydrometallurgical and pyrometallurgical recycling,
      cathode active material (CAM) and anode copper foil (ACF) manufacturing, and energy storage deployment.
    type: company-claimed
    topic: business model
    sourceRefs:
      - SO001
