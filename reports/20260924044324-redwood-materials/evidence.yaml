    topic: DOE ATVM loan covenant conditions
    missingEvidence: >-
      The specific financial and operational covenant conditions attached to the DOE ATVM conditional loan commitment to
      Redwood Materials are not public. Milestone thresholds for final close, production ramp requirements, and early
      termination triggers are unknown from any public source.
    whyItMatters: >-
      Without covenant details, investors cannot model the probability of default, the conditions under which DOE might
      restructure the loan, or the equity dilution impact of a bridge financing requirement before final close. This is
      the single most material financial diligence gap for any investment commitment.
    diligencePath: >-
      Request conditional commitment letter and full term sheet under NDA from Redwood management. Consult with DOE Loan
      Programs Office on permissible disclosures. Review any public FOIA request responses covering Redwood's ATVM
      application history.
