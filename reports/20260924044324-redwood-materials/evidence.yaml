    statement: >-
      Before Redwood reached commercial scale, the US status-quo substitute for battery recycling was overseas
      pyrometallurgical smelting in Belgium and South Korea that recovered only cobalt and copper, discarding lithium
      and nickel into slag.
    type: third-party-reported
    topic: market-definition
    sourceRefs:
