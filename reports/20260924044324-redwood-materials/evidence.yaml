  - id: CM001
    statement: >-
      Redwood Materials operates across five integrated market segments: Li-ion battery collection and processing,
      critical mineral refining, cathode active material manufacturing, anode copper foil manufacturing, and second-life
      energy storage via Redwood Energy.
    type: company-claimed
    topic: market-definition
    sourceRefs:
