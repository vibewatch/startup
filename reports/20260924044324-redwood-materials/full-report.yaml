      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >
              Multiple independent sizing lenses converge on a large but contested market opportunity. The broadest
              framing—total global battery materials manufacturing—is estimated at $120–150B annually by 2030
              (BloombergNEF), but this TAM is largely irrelevant to Redwood's current capacity. A more relevant global
              figure is the lithium-ion battery recycling market alone: SNE Research estimates it reaches ~$22B by 2030
              from ~$3B in 2022; MarketsandMarkets placed it at ~$17.6B by 2030 (CAGR ~23%); IDTechEx projects a more
              conservative $14.5B by 2033. These figures are not reconciled because they use different scope
              definitions—some include only collection and processing, while others extend through refined material
              sales.

              For North America specifically, the SAM is more tractable. Combining the recycled battery materials market
              (~$5–7B by 2030, North America) with domestic CAM demand from US gigafactories (~$8–12B annually by 2030)
              and ACF demand (~$2–3B by 2030) yields a North American battery materials SAM of roughly $15–25B. The
              DOE's National Blueprint for Lithium Batteries projects that the US will need 650,000 MT of lithium and
              300,000 MT of nickel for domestic EV production through 2030, creating direct demand for the critical
              minerals Redwood recovers and refines.

              Redwood's SOM is bounded by its physical capacity: the Nevada campus (target ~100 GWh/yr CAM) plus the
              South Carolina campus (target ~100 GWh/yr ACF) imply potential revenues of $2–5B annually at full
              build-out and current pricing—though lithium carbonate price declines of 80% from 2022 peaks compress this
              range materially. Conflicting estimates and the private nature of Redwood's financials prevent precise SOM
              validation.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Growth Drivers and Demand Catalysts
        blocks:
          - type: paragraph
            body: >
              Six structural drivers underpin demand for Redwood's integrated offering. First, the Inflation Reduction
              Act (IRA) of 2022 is the single most important US policy catalyst. Section 30D required 40%+ domestic
              critical mineral content rising to 100% by 2028. Section 45X provides Advanced Manufacturing Production
              Credits for US-manufactured cathode and anode materials— directly monetizing Redwood's CAM and ACF output.
              Section 48C extends investment tax credits to advanced energy manufacturing. Although the EV consumer tax
              credit (30D) was terminated September 30, 2025 under the current administration, manufacturing incentives
              (45X, 48C) remain in force.

              Second, EV adoption in the US has created a growing installed base generating recycling feedstock. The IEA
              projects 26M EVs on US roads by 2030, up from ~6.5M through 2023. BloombergNEF estimates ~2M EV battery
              packs will require recycling in the US by 2030, with volume surging after 2027 as the first mass-market EV
              wave reaches end-of-life. Consumer electronics remain an important near-term feedstock bridge—EPA
              estimates 15 billion Li-ion cells are discarded in the US annually.

              Third, China decoupling policy has made supply chain resilience a national security imperative. The US
              currently imports 70%+ of cathode active material and 90%+ of anode materials from China. Fourth, OEM
              battery sustainability mandates have created committed offtake demand. Ford, GM, Toyota, BMW, and
              Panasonic have all made battery circularity commitments and signed supply or take-back agreements with
              Redwood—creating recurring feedstock supply and material demand simultaneously. Fifth, the EU Battery
              Regulation (effective 2027) mandates minimum recycled content (16% cobalt, 6% lithium, 6% nickel by 2031).
              Sixth, the AI data center storage boom is an emerging demand catalyst for Redwood Energy—second-life EV
              packs offer 40–60% cost savings versus new LFP systems on a per-kWh basis.
            claimRefs:
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for Redwood Materials spans five categories: (1) direct North American Li-ion
              battery recyclers — Cirba Solutions, Li-Cycle (Chapter 11), and Ascend Elements (Chapter 11); (2)
              incumbent global battery material suppliers — Umicore, BASF, Sumitomo Metal Mining — who provide the
              primary status-quo substitute via virgin-mined or pyrometallurgically processed materials; (3) Chinese
              integrated players — CATL's BRUNP Recycling affiliate and GEM Co. — who dominate Asian recycling and are
              expanding globally; (4) potential in-house recyclers — battery manufacturers including Panasonic, Samsung
              SDI, and LG Energy Solution who currently supply scrap to Redwood but could internalize recycling as
              volumes grow; and (5) the status quo of landfill and export, which remains legal in many jurisdictions and
              requires no capital investment. Redwood is differentiated by its integrated model from collection through
              CAM production, its scale (20+ GWh processed annually), and its OEM partnership network that creates
              bilateral supply security. The two North American direct competitors that attempted a similar approach
              (Ascend Elements and Li-Cycle) have both entered bankruptcy proceedings, suggesting that Redwood's early
              mover advantage and capital access have created a structural separation from followers.
