    notes: >-
      No competitor publicly discloses processing fees or contract terms. Pricing data is either company-claimed without
      verification or estimated from industry context. Actual contract terms are trade secrets in all cases.
    columns:
      - Competitor
      - Revenue Model
      - Pricing Mechanism
      - Key Unknown
      - Implication
