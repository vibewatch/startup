      - number: '6.2'
        title: CAM and ACF Output Customers
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials sells its two primary finished products—NMC 811 cathode active material (CAM) and anode
              copper foil (ACF)—to US battery cell manufacturers under commercial supply agreements. The only publicly
              confirmed CAM output customer is Panasonic Energy, which operates the Nevada Gigafactory in partnership
              with Toyota and supplies cells to multiple OEMs. The Panasonic relationship is strategic: Panasonic's
              Gigafactory is located adjacent to Redwood's Nevada campus, enabling just-in-time CAM delivery without the
              logistics costs of long-haul transportation. Panasonic also contributes manufacturing scrap (battery
              rejects and off-spec cells) as recycling feedstock, creating a circular bilateral relationship. For ACF,
              Redwood has not publicly disclosed commercial customers beyond stating that its South Carolina facility is
              selling into the US battery supply chain. Potential ACF customers include Panasonic Energy (for its Nevada
              cells), Samsung SDI America (Blue Oval City in Tennessee), and LG Energy Solution (multiple US
              facilities). The lack of disclosed ACF customers is a diligence gap: it is unknown whether Redwood is
              selling commercial volumes of ACF or is still in qualification stages with prospective buyers. The revenue
              concentration risk is significant: if Panasonic Energy diversifies its CAM supply to Korean producers
              (POSCO Future M, EcoPro BM) or builds in-house CAM capability, Redwood's near-term CAM revenue would be
              materially affected.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Strategic Partnerships and OEM Integration Depth
        blocks:
          - type: paragraph
            body: >-
              Beyond transactional customer relationships, Redwood Materials has established strategic partnerships that
              create deeper integration and switching cost moats. The Ford Motor Company partnership is the most
              strategically significant: Ford invested in Redwood's Series C and signed a battery recycling partnership
              that includes supply of Ford EV battery scrap and a framework for North American battery materials supply.
              This investment-plus-supply structure creates aligned incentives that extend beyond a simple vendor
              relationship. Amazon's partnership includes both battery supply (consumer electronics) and a stated
              intention to use Redwood-sourced materials in Amazon's commercial fleet electrification program. The
              Toyota partnership covers both EV battery take-back and Toyota's stated interest in domestic battery
              materials supply for its US manufacturing operations. Redwood has also signed a partnership with
              Volkswagen Group of America covering battery return logistics for the Audi e-tron, Q4 e-tron, and ID.4
              models. These OEM partnerships collectively create a network effect: each additional OEM partner
              strengthens the feedstock supply position, which in turn strengthens the case for additional CAM and ACF
              output customers, which in turn attracts additional OEM partners seeking domestic materials supply. The
              risk is that this network effect operates in reverse if OEM EV volumes disappoint: fewer batteries mean
              less recycling feedstock, which delays the feedstock volume growth needed to justify full gigafactory
              utilization.
            claimRefs:
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Tesla Is Not a Redwood Customer Despite Being the Largest US EV Battery Source
            body: >-
              Tesla is the largest producer of end-of-life EV batteries in the US market by volume, yet it is not a
              publicly confirmed Redwood Materials recycling partner. Tesla recycles batteries in-house at its
              Gigafactories and has not disclosed a third-party recycling relationship with Redwood. This absence is the
              most significant undisclosed feedstock risk in the Redwood customer picture and warrants specific
              diligence.
            calloutType: risk
            claimRefs:
              - CU001
          - type: callout
            title: 'Revenue Concentration: Panasonic Is the Only Confirmed CAM Buyer'
            body: >-
              Panasonic Energy is the only publicly confirmed commercial buyer of Redwood Materials' NMC 811 cathode
              active material. This creates extreme revenue concentration risk: if Panasonic diversifies its CAM supply,
              reduces order volumes, or renegotiates pricing downward in response to IRA credit changes, Redwood's CAM
              revenue would be materially affected in the 2025-2027 timeframe.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
          - type: callout
            title: Bilateral Dependencies Create Switching Cost Moats in OEM Partnerships
            body: >-
              Redwood's most strategically durable customer relationships involve bilateral dependencies: OEMs need
              Redwood's collection network to meet battery end-of-life regulations (EPR compliance), while Redwood needs
              OEM feedstock to maintain processing volumes. Ford and Amazon's equity investments add a third layer of
              alignment. This structure creates genuine switching costs on both sides, reducing the risk of partner
              attrition once relationships are established.
            calloutType: insight
            claimRefs:
              - CU011
              - CU012
          - type: callout
            title: 'EV Adoption Trajectory Assumption: 2027-2028 Feedstock Inflection Intact'
            body: >-
              This chapter's analysis of Redwood's customer pipeline assumes that US EV adoption continues to grow
              toward the volumes needed for a 2027-2028 feedstock inflection point. The Trump administration's rollback
              of EV purchase incentives in 2025 creates downside risk to this assumption. Wood Mackenzie's 10-15%
              reduction in US EV adoption forecasts would correspondingly delay Redwood's recycling volume growth and
              push back the economics of full gigafactory utilization.
            calloutType: assumption
            claimRefs:
              - CU001
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials confronts five interconnected high-severity risk categories that investors must evaluate
              before commitment. First, IRA 45X advanced manufacturing production credit erosion represents the single
              largest policy risk, since the thirty-five dollar per kilowatt- hour CAM credit is Redwood's primary
              margin buffer against Korean producers. Second, FEOC guidance narrowing by Treasury could restrict
              downstream OEM EV tax credit eligibility for vehicles using Redwood CAM, reducing willingness to pay a
              domestic premium. Third, CAM technology scale-up at NMC 811 gigawatt-hour volumes remains unvalidated by
              independent third parties. Fourth, DOE ATVM loan covenant compliance requires meeting undisclosed
              production milestones; historical data suggest roughly thirty percent of conditional commitments do not
              progress to final close. Fifth, customer concentration in the Panasonic and Tesla nexus amplifies EV
              market and DOE execution risks simultaneously. A thesis-break trigger occurs when 45X credit reduction
              exceeds ten dollars per kilowatt- hour AND the DOE loan final-close fails concurrently; either event alone
              is manageable with model adjustment, but both together require complete re-underwriting. Investors must
              negotiate factory access rights, DOE milestone transparency, and Panasonic contract review as conditions
              of commitment. The risk-adjusted return at the Series E entry valuation of approximately five point five
              billion dollars is attractive only if 45X remains substantially intact and the South Carolina campus ramp
              proceeds on schedule.
            claimRefs:
              - CR001
              - CR002
              - CR003
