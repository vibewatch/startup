      - number: '5.2'
        title: Hydrometallurgical Process Differentiation vs. Pyrometallurgy
        blocks:
          - type: paragraph
            body: >-
              The fundamental technology choice in battery recycling is between pyrometallurgical (pyro) and
              hydrometallurgical (hydromet) processing. Pyrometallurgical processes smelt battery materials at high
              temperatures, recovering cobalt and nickel as alloys but losing lithium (which volatilizes) and requiring
              energy-intensive acid leaching to recover other metals. Hydrometallurgical processes dissolve battery
              materials in aqueous solutions and use chemical separation to recover each metal individually. Redwood's
              process is hydromet-first: it achieves greater than 95% lithium recovery, which is critical as lithium
              becomes the key cost driver in NMC 811 and LNMO cathode chemistries. The company's direct lithium recovery
              (DLR) technology, which selectively extracts lithium from the leachate without the traditional lime
              precipitation step, is a key proprietary innovation that reduces reagent cost and improves lithium purity.
              Redwood's chemistry is also chemistry-agnostic: it can process NMC (111, 532, 622, 811), LFP, NCA, and
              cobalt oxide chemistries in the same facility, providing a feedstock flexibility advantage over
              competitors optimized for specific cathode types. This matters because the battery chemistry mix is
              shifting: LFP is growing rapidly (from near-zero to over 30% of global EV battery production by 2024) and
              sodium-ion is emerging, creating uncertainty about future feedstock chemistry profiles.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: CAM and ACF Product Specifications and Customer Requirements
        blocks:
          - type: paragraph
            body: >-
              Redwood's two finished product lines—cathode active material (CAM) and anode copper foil (ACF)—are the
              highest-value outputs of the integrated process. For CAM, Redwood primarily produces NMC 811
              (nickel-manganese-cobalt in 80-10-10 ratio), which is the dominant chemistry for high-energy-density EV
              applications including Tesla's 2170 cells and Panasonic's cells for the Model Y and Model 3. NMC 811 CAM
              must meet battery-grade specifications including particle size distribution (D50 of 10-12 microns),
              specific surface area (0.2-0.5 m2/g), and electrochemical performance (capacity > 185 mAh/g, capacity
              retention > 80% at 100 cycles). Redwood's commercial CAM deliveries to Panasonic Energy represent
              validation of its ability to meet these specifications at commercial volumes. For ACF, Redwood produces
              copper foil at 6, 7, and 8 micron thicknesses for anode applications, competing with established Korean
              and Japanese ACF producers (Iljin Materials, SKC, Furukawa Electric). ACF requires exceptional dimensional
              uniformity and tensile strength at ultra-thin gauges, which requires proprietary electrodeposition process
              control. Redwood's differentiation in ACF is the use of recycled copper as feedstock, which provides the
              IRA domestic content advantage and potentially a cost advantage if recycled copper is cheaper than virgin
              copper on a net basis after refining costs.
            claimRefs:
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Greater Than 95% Lithium Recovery Creates Structural Cost Advantage
            body: >-
              Redwood's hydromet DLR process recovers greater than 95% of lithium from battery feedstock, versus less
              than 5% for pyrometallurgical alternatives. As NMC 811's lithium content becomes the primary cost driver
              at current battery-grade lithium carbonate prices, this recovery rate creates a structural input cost
              advantage over pyro competitors and reduces the feedstock cost per kg of CAM produced.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: LFP Chemistry Growth Reduces Recoverable Metal Value per kWh
            body: >-
              LFP batteries contain no cobalt or nickel—only lithium and iron. As LFP grows toward 40-50% of global EV
              battery installations by 2030, the average recoverable value per kWh of battery processed by Redwood will
              decline materially. The company has invested in LFP process chemistry but has not publicly disclosed LFP
              recycling economics, which are expected to be significantly below NMC economics.
            calloutType: risk
            claimRefs:
              - CE001
          - type: callout
            title: Process Know-How is More Defensible Than Patent Portfolio
            body: >-
              Redwood's formal patent portfolio covers specific process configurations, but the fundamental
              hydrometallurgical chemistry is well-established in mining. The company's most defensible competitive
              asset is accumulated process know-how from processing over 20 GWh of batteries at scale—a learning curve
              that requires years to replicate and encompasses impurity management, equipment reliability, and yield
              optimization that are difficult to patent but equally difficult to reproduce.
            calloutType: insight
            claimRefs:
              - CE001
          - type: callout
            title: Commercial CAM Quality Assumed to Meet Panasonic Specifications
            body: >-
              This chapter assumes that Redwood's commercial CAM deliveries to Panasonic Energy meet battery-grade NMC
              811 specifications based on the continuation of the supply relationship. No independent third-party
              quality verification or electrochemical characterization of Redwood's commercial CAM output has been
              publicly published. Investors should request quality control data and customer acceptance certificates
              under NDA.
            calloutType: assumption
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Battery Feedstock Supply Partners (Input Customers)
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials operates a battery collection and take-back network that processes end-of-life EV
              batteries, battery manufacturing scrap, and consumer electronics batteries. Confirmed publicly disclosed
              input supply relationships include: Ford Motor Company (EV battery take-back partnership announced in
              2021, covering end-of-life Ford F-150 Lightning and Mustang Mach-E batteries); Volkswagen Group of America
              (battery return logistics partnership for Audi and Volkswagen EV customers); Toyota (battery recycling
              partnership for US-market vehicles); Amazon (consumer electronics battery take-back, particularly for Ring
              and Alexa device batteries); Volvo Cars; and several battery cell manufacturers including Panasonic Energy
              and Envision AESC (which contributes manufacturing scrap). The collection network is particularly valuable
              in the current period because consumer EV batteries are only beginning to reach end-of-life at volume—the
              first wave of 2012-2015 Nissan Leaf batteries and 2015-2018 Tesla Model S/X packs are now reaching
              recycling age. Redwood processes manufacturing scrap (cell rejects from Panasonic's Nevada Gigafactory) as
              a significant near-term feedstock, providing predictable high-quality input while end-of-life volumes
              grow. The take-back collection network represents a strategic asset because it creates bilateral
              dependency: OEMs need Redwood's recycling capacity to meet battery end-of-life regulations, and Redwood
              needs OEM feedstock to maintain processing volumes.
            claimRefs:
              - CU001
