      - number: '3.2'
        title: Direct Competitor and Incumbent Profiles
        blocks:
          - type: paragraph
            body: >-
              Li-Cycle Holdings was the leading North American pure-play lithium-ion battery recycler before pausing
              construction on its Rochester Hub hydrometallurgical processing facility in 2023 and filing for Chapter 11
              bankruptcy protection in 2024. At its peak, Li-Cycle processed approximately 5-6 GWh equivalent of battery
              materials annually using a spoke-hub model: shredding at distributed spokes feeding a central hub for
              hydrometallurgical processing. The Rochester Hub failure, attributed to construction cost overruns and
              insufficient feedstock, validates the capital and timing risk of battery recycling at scale. Ascend
              Elements (formerly Battery Resources) focused on producing recycled cathode active material and filed for
              Chapter 11 in April 2026. Its model most closely resembled Redwood's integrated recycling-to-CAM approach.
              Cirba Solutions, formed from the merger of Retriev Technologies and Battery Solutions, is the most
              relevant surviving North American alternative. It processes multiple battery chemistries including Li-ion,
              NiMH, and lead-acid but does not produce CAM, making it a recycling-only competitor. Umicore is the
              dominant global incumbent, operating large-scale pyrometallurgical recycling in Belgium and Korea,
              producing CAM at scale, and holding long-term supply agreements with major battery manufacturers.
              Umicore's revenue exceeded €4 billion in recent years. CATL, the world's largest battery manufacturer,
              operates BRUNP Recycling as its battery recycling affiliate in China and is expanding recycling capacity.
              CATL's integrated model across battery manufacturing and recycling in China is the most formidable
              potential long-run competitor, but faces regulatory and geopolitical barriers to North American market
              access.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Capability and Feature Comparison
        blocks:
          - type: paragraph
            body: >-
              The key capability dimensions in battery recycling differentiation are: collection network and logistics,
              processing technology and recovery efficiency, downstream CAM production, geographic coverage, OEM
              partnership depth, and regulatory/environmental compliance track record. Redwood leads on recovery
              efficiency (95% claimed), CAM production integration, North American geographic coverage aligned with U.S.
              automotive OEM locations, and OEM partnership breadth (Ford, Toyota, GM, VW, BMW, Volvo, Rivian, Amazon).
              Umicore leads on global scale, established regulatory relationships in Europe, and deep CAM production
              history with decades of customer relationships. Cirba Solutions leads on collection network breadth and
              multi-chemistry capability (including lead-acid) but lags on recovery efficiency and has no CAM
              production. Li-Cycle's spoke-hub model demonstrated efficient logistics but failed at the central hub
              processing stage. CATL/BRUNP has the deepest vertical integration globally but operates primarily in
              China. The most critical differentiator for Redwood's OEM customers is the ability to provide a
              closed-loop domestic supply solution: collect EOL batteries, recover minerals, and return recycled CAM to
              the same customer for new battery production. Only Redwood and Umicore currently operate this full loop at
              meaningful scale, and Umicore's loop is primarily European. Redwood's 95% claimed recovery efficiency
              versus approximately 60-70% for pyrometallurgical processes used by Umicore and others is a meaningful
              economic advantage at scale, though the 95% figure has not been independently audited.
            claimRefs:
              - CP001
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials operates a dual-sided industrial revenue model with two primary streams: (1) processing
              fees or material credits from OEM and battery manufacturer customers for battery collection and recycling
              services, and (2) cathode active material sales to cell manufacturers who incorporate recycled CAM into
              new battery production. A third emerging stream — second-life battery storage leasing or sale under the
              Redwood Energy brand launched in June 2025 — is early-stage and not yet financially material. Revenue
              recognition for processing services is straightforward: fees are charged per kilogram of material
              processed and recognized as batteries arrive at Redwood facilities. CAM sale revenue is recognized at
              delivery to cell manufacturer customers including Panasonic Energy of North America and Samsung SDI. CEO
              JB Straubel disclosed approximately $200 million in annual revenue for 2024, representing approximately
              $10 per GWh equivalent processed at the claimed 20 GWh processing run rate — though the figure mixes
              processing fee and CAM revenue and the split between streams is not publicly disclosed. Revenue quality is
              constrained by commodity price exposure on both streams: processing fees may be indexed to recovered
              material value, and CAM selling prices track lithium carbonate, cobalt, and nickel spot markets. Lithium
              prices declined approximately 80 percent from 2022 peaks by 2024, compressing revenue per unit processed
              for processors with commodity-linked pricing.
