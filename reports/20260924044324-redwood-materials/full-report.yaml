      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              JB Straubel (born December 20, 1975 in Des Moines, Iowa) holds both a BS and MS in Energy Engineering from
              Stanford University and is one of the most recognized figures in the global electric vehicle industry. At
              Tesla, he was employee number five and a co-founder, overseeing battery systems, powertrain architecture,
              and the Gigafactory concept across a 15-year tenure. He transitioned from an executive role to an advisory
              position at Tesla in July 2019 and was subsequently elected to Tesla's board of directors in 2023.
              Straubel effectively began Redwood Materials in 2017 while still at Tesla—positioning the company to solve
              end-of-life battery management before widespread adoption of EVs made the problem acute. His background
              provides exceptional founder-market fit: the battery supply chain problem Redwood addresses is precisely
              what he spent 15 years trying to build at Tesla.

              The current Redwood Materials leadership team, as publicly disclosed, includes Colin Campbell as Chief
              Technology Officer (a Tesla battery veteran who joined in August 2023), Cal Lankton as Chief Commercial
              Officer, Mandy Clark as Chief People Officer, Alexis Georgeson as VP of External Affairs, and Alma Chao as
              General Counsel. Redwood opened a 15,000-square-foot R&D center in San Francisco's Design District in
              April 2025 to attract Bay Area engineering and materials science talent. An April 2026 restructuring
              resulted in approximately 10% of the workforce being laid off and the departure of the company's
              COO—signaling that Redwood is pivoting resources toward the energy storage business and rationalizing its
              EV recycling cost structure.

              As a private company, Redwood does not publicly disclose its board composition or investor governance
              rights. Strategic investors—Eclipse Ventures, NVIDIA's NVentures, Goldman Sachs, and others—are likely
              represented at board or observer level. No material litigation, regulatory violations, or governance
              disputes have been publicly reported as of the runDate.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              Redwood Materials has raised approximately $2.3 billion in private equity capital since its founding, plus
              a $2 billion conditional loan commitment from the US Department of Energy, making it the most heavily
              capitalized US battery recycler by a wide margin. The Series E had an initial close of $350M in October
              2025 at a reported post-money valuation of approximately $6 billion, led by Eclipse Ventures and NVIDIA's
              NVentures. A final close in January 2026 brought the Series E total to $425M with additional investors.
              Wilson Sonsini Goodrich & Rosati advised Redwood on the legal aspects of the Series E. Prior rounds
              include a Series D of $1 billion raised in August 2023 at an implied valuation of approximately $3.7
              billion, a Series C of approximately $700M in 2021-2022, and earlier seed and Series A/B rounds. The DoE
              conditional commitment (February 2023) was for a $2B loan guarantee tied to construction of domestic
              battery materials manufacturing capacity in Nevada and South Carolina.

              The investor base spans prominent venture capital (Eclipse Ventures, Andreessen Horowitz), technology
              strategics (NVIDIA's NVentures), financial institutions (Goldman Sachs), and climate-focused funds.
              Partnerships with Ford Motor Company, Rivian, Toyota, Panasonic, GM, Volkswagen, and Caterpillar provide
              off-take revenue and supply chain integration. Key OEM investors and partners represent potential
              conflicts if they compete for battery supply in a tighter market.

              Revenue and financial metrics remain undisclosed publicly. Industry analysts at BatteryIndustry.net
              estimated 2024 revenue at approximately $200M annually, consistent with the scale of reported production
              contracts. Redwood has not disclosed profitability, cash burn, or remaining runway.
            claimRefs:
              - CO001
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Unmatched Founder-Market Fit and First-Mover Scale Advantage
            body: >
              JB Straubel spent 15 years building Tesla's battery supply chain and Gigafactory—making him arguably the
              world's most operationally experienced person in EV battery materials. Redwood's first-mover position
              means it processes approximately 90% of all lithium-ion batteries and battery materials recycled in North
              America. This creates a structural flywheel: more batteries collected → more material to process → more
              supply agreements with OEMs → more end-of-life batteries returned. No other US recycler has approached
              Redwood's collection volumes or manufacturing scale. The $2B DoE loan commitment—the largest US government
              financing for any battery recycler—signals institutional validation of the domestic supply chain thesis
              and provides a structural competitive moat against under-capitalized rivals.
            calloutType: strength
            claimRefs:
              - CO001
              - CO007
              - CO008
          - type: callout
            title: April 2026 Restructuring and COO Departure Elevate Execution Risk
            body: >
              The April 2026 workforce reduction of approximately 10% and the concurrent COO departure occurred at a
              pivotal moment: Redwood is simultaneously managing a capital-intensive recycling and materials
              manufacturing business while launching Redwood Energy (stationary storage for data centers). The
              restructuring press coverage from TechCrunch, Electrive, and American Bazaar Online characterized this
              explicitly as a cost rationalization driven by challenges in the EV recycling business, including
              lower-than-expected EV battery return volumes, Chinese cost competition in CAM/ACF markets, and
              uncertainty around US IRA subsidy continuity. Li-Cycle's 2023 pause of its Rochester Hub (due to cost
              overruns on a similar hydrometallurgical facility) offers a cautionary precedent for the capital intensity
              of at-scale battery recycling. The energy storage pivot, while strategically sensible, adds execution
              complexity to an already difficult core business.
            calloutType: risk
            claimRefs:
              - CO001
          - type: callout
            title: Redwood Energy Targets High-Growth AI Data Center Market with Differentiated Low-Cost Supply
            body: >
              Redwood Energy's thesis is compelling: second-life EV battery packs (which retain 70-80% of original
              capacity) can be deployed as grid-scale storage at dramatically lower cost than new battery cells,
              precisely when the AI data center market is creating unprecedented demand for on-site power storage. The
              Rivian manufacturing campus partnership and the Crusoe Energy data center partnership provide initial
              proof-of-concept customer validation. As the EV fleet matures through 2027-2030, the supply of retired
              packs will grow exponentially—creating a proprietary feedstock advantage for Redwood over any competitor
              trying to enter the second-life storage market without the collection infrastructure Redwood has already
              built. The $350M+ Series E was partly framed around this energy storage opportunity, and NVIDIA's
              participation as a strategic investor may reflect interest in Redwood Energy as a future power-supply
              partner for NVIDIA's data center ecosystem.
            calloutType: insight
            claimRefs:
              - CO001
          - type: callout
            title: Financial Health, Profitability Path, and DoE Loan Status Are Opaque
            body: >
              Redwood Materials does not disclose revenue, gross margins, EBITDA, cash position, or burn rate. The DoE
              $2B conditional loan commitment—the company's largest financing instrument—has undisclosed draw
              conditions, and it is unknown whether any portion has been drawn or when it will be. Analysts estimate
              2024 revenue at approximately $200M, but this figure is unverified. The company has not indicated when it
              expects to reach profitability on either its recycling or energy storage business. Investors must treat
              all commercial and financial claims as company-asserted and unverified until independent data, regulatory
              filings, or a future IPO/acquisition provides external validation.
            calloutType: assumption
            claimRefs:
              - CO001
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundaries, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Redwood Materials does not operate in a single discrete market but rather in an integrated stack of five
              adjacent segments: (1) Li-ion battery collection and processing (black-mass production); (2) critical
              mineral refining (lithium, nickel, cobalt, manganese intermediates); (3) cathode active material (CAM)
              manufacturing for NMC/NCA chemistry cells; (4) anode copper foil (ACF) manufacturing; and (5) second-life
              energy storage deployment via Redwood Energy. Included spend spans OEM battery take-back contracts,
              long-term materials supply offtake agreements with cell manufacturers, and energy storage project
              revenues. Excluded are primary mining of virgin critical minerals, EV battery cell manufacturing (which is
              Redwood's customer, not its business), and conventional grid storage using new chemistry (flow batteries,
              sodium-ion).

              Status-quo substitutes differ by segment. For battery recycling, the pre-Redwood US default was landfill
              disposal or low-value pyrometallurgical smelting—primarily overseas at plants in Belgium and South
              Korea—which recovered only cobalt and copper but discarded lithium and nickel into slag. For domestic
              cathode material, substitutes are imports predominantly from Chinese suppliers (CNGR, Hunan Shanshan) and
              Korean producers (EcoPro, L&F). For anode copper foil, the domestic market was essentially non-existent
              before Redwood's South Carolina campus; all supply came from South Korean and Japanese producers.
              Second-life energy storage competes with new LFP battery systems from CATL and BYD and domestic new-build
              storage projects.

              Adjacencies include direct lithium extraction (DLE) from brines, solid-state battery precursor supply, and
              battery-grade lithium carbonate/hydroxide production—areas where Redwood has made technical investments
              but not yet reached commercial scale. The European market (post-EU Battery Regulation 2027) represents a
              regulatory-driven adjacency that Redwood entered with its Redux acquisition but is treated as outside the
              primary North American SAM for this chapter.
