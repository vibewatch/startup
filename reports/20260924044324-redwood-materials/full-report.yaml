      - number: '4.2'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Redwood's cost structure is dominated by capital depreciation and amortization on its Nevada campus ($2.35
              billion-plus deployed), labor (approximately 1,100 employees at peak), energy costs for hydrometallurgical
              processing, and chemical inputs. The company has not publicly disclosed gross margin or EBITDA, making
              unit economics analysis dependent on estimation and analogy. Comparable public-company battery material
              processors such as Livent and Albemarle report gross margins of 20-40 percent in favorable commodity
              environments, compressing to 5-15 percent in the current depressed lithium price environment. Redwood's
              hydrometallurgical process has higher operational intensity than pyrometallurgical alternatives but
              achieves significantly higher material recovery, partially offsetting higher operating costs through
              higher recovered material yield. The South Carolina campus — planned at $3.5 billion total — entered
              first-phase operations in November 2025, adding significant incremental depreciation and ramp costs
              without yet achieving full-run-rate revenue. Working capital is driven by battery feedstock inventory,
              chemicals, and the timing gap between battery collection and CAM delivery to customers. The layoffs in
              November 2025 (approximately 5 percent) and April 2026 (approximately 10 percent, approximately 135
              employees) are cost-reduction actions consistent with operating below planned utilization.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Capital Adequacy and Financing
        blocks:
          - type: paragraph
            body: >-
              Redwood's capital stack is substantial. The company has raised approximately $2.3 billion in private
              equity across multiple rounds. The most recent was a Series E of $350 million initial close in October
              2025, led by Eclipse Ventures with NVIDIA NVentures participation, at a valuation exceeding $6 billion.
              The final close of $425 million was completed in January 2026. The Department of Energy conditionally
              committed a $2 billion ATVM loan in February 2023 for the Nevada campus battery materials production
              facility. As of May 2026, the status of the DoE loan drawdown is not publicly confirmed — Redwood has not
              announced formal closing or initial funding of the loan, which remains a material uncertainty. Cash on
              hand is not publicly disclosed; the most recent capital raise of $350-425 million in late 2025 provides
              significant runway, but monthly burn and the South Carolina buildout capex schedule are not public. The
              South Carolina campus is budgeted at $3.5 billion total; the November 2025 first-phase opening suggests
              partial capital deployment but the full buildout timeline and financing source are unclear. The April 2026
              workforce reduction is a signal that operating cash outflows are being managed proactively at below-plan
              utilization, but does not provide direct insight into burn rate or runway. IPO has been a strategic path
              discussed publicly since 2022; market conditions and revenue trajectory as of mid-2026 would likely
              determine timing. The DoE loan closing is a critical financing event: if formally closed, it provides $2
              billion in below-market financing for the Nevada campus, significantly reducing equity capital needs.
            claimRefs:
              - CI001
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: End-to-End Hydrometallurgical Process Stack
        blocks:
          - type: paragraph
            body: >-
              Redwood Materials' technology architecture is best understood as five sequential process steps that
              together convert end-of-life batteries and manufacturing scrap into battery-grade materials ready for cell
              manufacturing. Step 1 is collection and logistics: Redwood operates a take-back network that aggregates
              batteries from EV OEMs, consumer electronics brands, and battery manufacturers, processing over 20 GWh
              equivalent of material annually as of 2024. Step 2 is mechanical processing and black-mass production:
              batteries are discharged, disassembled, shredded, and processed to produce black mass (the mixed powder
              containing cathode and anode active materials, copper foil, and electrolyte residues). Step 3 is
              hydrometallurgical refining: black mass is dissolved in acid solutions, and lithium, nickel, cobalt,
              manganese, and copper are selectively separated and purified using solvent extraction, ion exchange, and
              direct lithium recovery (DLR) proprietary processes. Step 4 is CAM synthesis: purified nickel, cobalt, and
              manganese sulfates are combined with lithium to produce cathode precursor (pCAM) and then sintered to
              produce finished NMC 811 cathode active material at battery grade. Step 5 is ACF production: recycled
              copper recovered in the refining stage is further purified and electrodeposited to produce anode copper
              foil at the required 6-8 micron thickness for battery cells. The integration of all five steps on the
              Nevada campus eliminates the logistics cost and material loss between process steps, which Redwood
              estimates provides a 15-20% yield advantage over disaggregated supply chains.
            claimRefs:
              - CE001
              - CE002
              - CE003
