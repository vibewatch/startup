company:
  name: Redwood Materials
chapter:
  number: 4
  title: Financials
  summary: 'Redwood Materials is a pre-profitability industrial company with estimated revenue of approximately $200 million in 2024, a capital-intensive manufacturing footprint exceeding $4 billion deployed, and a private funding structure that limits financial transparency. Revenue derives from two primary streams: battery collection and processing fees paid by OEM customers, and cathode active material sales to cell manufacturers at commodity- adjacent pricing. The company has raised approximately $2.3 billion in private equity and received a $2 billion DoE ATVM conditional loan commitment, providing significant capital runway. However, the April 2026 layoffs affecting approximately 10 percent of workforce and COO exit are adverse signals suggesting operating costs exceed current utilization levels. The business model is structurally sound at scale but requires continued EV fleet growth and favorable commodity pricing. Key financial unknowns — gross margin, burn rate, DoE loan drawdown status, and unit economics — are private and represent material diligence blockers. The financial verdict is a capital-intensive industrial operator with a long path to profitability dependent on feedstock volume growth, commodity cycle management, and execution on the South Carolina campus buildout.'
sections:
  - id: revenue-model
    title: Revenue Model and Revenue Streams
    body: 'Redwood Materials operates a dual-sided industrial revenue model with two primary streams: (1) processing fees or material credits from OEM and battery manufacturer customers for battery collection and recycling services, and (2) cathode active material sales to cell manufacturers who incorporate recycled CAM into new battery production. A third emerging stream — second-life battery storage leasing or sale under the Redwood Energy brand launched in June 2025 — is early-stage and not yet financially material. Revenue recognition for processing services is straightforward: fees are charged per kilogram of material processed and recognized as batteries arrive at Redwood facilities. CAM sale revenue is recognized at delivery to cell manufacturer customers including Panasonic Energy of North America and Samsung SDI. CEO JB Straubel disclosed approximately $200 million in annual revenue for 2024, representing approximately $10 per GWh equivalent processed at the claimed 20 GWh processing run rate — though the figure mixes processing fee and CAM revenue and the split between streams is not publicly disclosed. Revenue quality is constrained by commodity price exposure on both streams: processing fees may be indexed to recovered material value, and CAM selling prices track lithium carbonate, cobalt, and nickel spot markets. Lithium prices declined approximately 80 percent from 2022 peaks by 2024, compressing revenue per unit processed for processors with commodity-linked pricing.'
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
    tableRefs:
      - TI001
      - TI002
      - TI003
    figureRefs:
      - FI001
  - id: cost-structure
    title: Cost Structure and Unit Economics
    body: Redwood's cost structure is dominated by capital depreciation and amortization on its Nevada campus ($2.35 billion-plus deployed), labor (approximately 1,100 employees at peak), energy costs for hydrometallurgical processing, and chemical inputs. The company has not publicly disclosed gross margin or EBITDA, making unit economics analysis dependent on estimation and analogy. Comparable public-company battery material processors such as Livent and Albemarle report gross margins of 20-40 percent in favorable commodity environments, compressing to 5-15 percent in the current depressed lithium price environment. Redwood's hydrometallurgical process has higher operational intensity than pyrometallurgical alternatives but achieves significantly higher material recovery, partially offsetting higher operating costs through higher recovered material yield. The South Carolina campus — planned at $3.5 billion total — entered first-phase operations in November 2025, adding significant incremental depreciation and ramp costs without yet achieving full-run-rate revenue. Working capital is driven by battery feedstock inventory, chemicals, and the timing gap between battery collection and CAM delivery to customers. The layoffs in November 2025 (approximately 5 percent) and April 2026 (approximately 10 percent, approximately 135 employees) are cost-reduction actions consistent with operating below planned utilization.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
    tableRefs: []
    figureRefs: []
  - id: capital-adequacy
    title: Capital Adequacy and Financing
    body: 'Redwood''s capital stack is substantial. The company has raised approximately $2.3 billion in private equity across multiple rounds. The most recent was a Series E of $350 million initial close in October 2025, led by Eclipse Ventures with NVIDIA NVentures participation, at a valuation exceeding $6 billion. The final close of $425 million was completed in January 2026. The Department of Energy conditionally committed a $2 billion ATVM loan in February 2023 for the Nevada campus battery materials production facility. As of May 2026, the status of the DoE loan drawdown is not publicly confirmed — Redwood has not announced formal closing or initial funding of the loan, which remains a material uncertainty. Cash on hand is not publicly disclosed; the most recent capital raise of $350-425 million in late 2025 provides significant runway, but monthly burn and the South Carolina buildout capex schedule are not public. The South Carolina campus is budgeted at $3.5 billion total; the November 2025 first-phase opening suggests partial capital deployment but the full buildout timeline and financing source are unclear. The April 2026 workforce reduction is a signal that operating cash outflows are being managed proactively at below-plan utilization, but does not provide direct insight into burn rate or runway. IPO has been a strategic path discussed publicly since 2022; market conditions and revenue trajectory as of mid-2026 would likely determine timing. The DoE loan closing is a critical financing event: if formally closed, it provides $2 billion in below-market financing for the Nevada campus, significantly reducing equity capital needs.'
    claimRefs:
      - CI001
    tableRefs: []
    figureRefs: []
