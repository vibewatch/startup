      - number: '5.5'
        title: 信任和质量控制主要通过流程语言可见，而不是通过公开认证可见
        blocks:
          - type: paragraph
            body: >-
              NextSilicon 确实呈现了一些信任和质量语言，但大多是间接的。公司的采购协议要求供应商遵守出口管制、维持许可证和许可，并支持与 ISO 9001、ISO 27001
              或类似标准对齐的质量管理和信息安全计划。隐私政策和使用条款页面展示了标准数据处理披露、安全语言和围绕网站使用的法律限制。这些材料有助于证明公司具备法律和运营流程脚手架。


              它们没有证明的东西同样重要。保留的公开来源没有显示 Maverick-2
              本身的产品安全门户、公开事件历史、软件物料清单、正式产品认证或独立可靠性统计，也没有一套广泛、中立的基准包，让外部买家跨许多工作负载测试主张。新计算架构里，这些缺口重要。技术已经显得差异化，并且越来越可部署；但下一层可信度将来自可复现基准数据、更清楚的安全和质量材料，以及更多关于什么会失败的公开证据，而不只是关于什么会成功。
