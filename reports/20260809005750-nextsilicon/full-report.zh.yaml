  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层级 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 数据流计算织构
        - 通过可配置计算单元执行已映射内核
        - 编译器和运行时质量
        - 如果映射质量弱，性能主张会很快削弱
      - - 遥测闭环
        - 为运行时优化和重新规划提供输入
        - 可观测性和快速软件响应
        - 遥测如果不透明或脆弱，会削弱自适应能力
      - - HBM3E 内存子系统
        - 为不规则和密集型工作负载提供带宽
        - 封装和内存可得性
        - 先进内存供应仍是系统级依赖
      - - 嵌入式 / 本地核心
        - 在加速器附近处理串行或控制工作
        - 均衡的任务切分
        - 串行瓶颈仍可能限制整体加速
      - - Arbel RISC-V CPU 路径
        - 把控制延伸到独立或耦合 CPU 角色
        - 软件生态成熟度和芯片执行
        - 路线图执行风险仍然重要
      - - 开发者工具
        - Profiler、Chip Viewer、Projection Viewer 暴露行为
        - 可用性和文档质量
        - 没有可用工具，「无需改写」在实践中会更难
      - - 系统集成层
        - PCIe / OAM 板卡、电源、散热和机架
        - Penguin、ParTec、OEM、Cornelis
        - 即便芯片可用，伙伴失手也会拖慢部署
      - - 应用支持层
        - 基准测试、移植、优化和客户联络
        - 熟练的现场工程师
        - 高接触度交付会限制规模化
    notes: 只有芯片、编译器、工具和集成一起到位，架构才能按承诺运转。
