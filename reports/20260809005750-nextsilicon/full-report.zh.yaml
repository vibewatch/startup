      - number: '5.2'
        title: Maverick-2 的核心技术主张是运行时可重构数据流执行
        blocks:
          - type: paragraph
            body: >-
              核心架构命题异常具体。NextSilicon 将 Maverick-2 描述为基于数据流原则的 Intelligent Compute Architecture，而不是 CPU 和 GPU
              那种以指令为中心的假设。在公司的解释里，运行时会 profile 整个应用，识别热点和可能流向，再利用遥测即时重构硬件资源。目标不只是换一种 kernel 调度方式，而是在工作负载执行过程中，重塑芯片如何把计算
              fabric 分配给最有价值的部分。


              这个命题重要，因为它把性能从静态峰值 FLOPS 重新定义为针对工作负载的自适应。官方和评测来源一致称，公司瞄准的是 HPC 和相邻 AI
              工作负载里最棘手的部分：分支多、不规则、内存密集或双精度代码；这些代码移植成本高，也常被为低精度 AI 优化的加速器服务不足。HPCG、PageRank、GUPS
              等公开基准主张都强化了这一框架。技术上行空间清楚，但限制同样重要：在供应商自撰或供应商提供材料之外，独立基准深度仍有限，所以架构可信度领先于公开第三方验证深度。
