              这是公开客户记录里最薄弱的一环。保留下来的来源没有披露 NRR、GRR、流失率、合同期限、 续约率、扩张收入或重复订单节奏。即便是具名客户的引述，也主要验证技术相关性，而不是
              财务韧性。留存最好的替代指标是持续可见度：Sandia 已经从最初合作走到系统部署，再到 正式验收；ODISSEE 也从参与联盟推进到硬件交付和持续技术协作。这是有用证据，但不等于
