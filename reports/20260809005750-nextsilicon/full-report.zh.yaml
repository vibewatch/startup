      - number: '3.2'
        title: 既有厂商仍掌握装机基础、软件栈和默认采购动作
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，最重的引力仍属于既有平台和超大规模平台。NVIDIA 的 HGX 栈把 GPU、CPU、网络和软件组合起来，目标是在大型数据中心内最大化应用性能。AMD 将 MI350
              定位为可插入现有机架、配套统一企业软件栈的 AI 与 HPC 加速器；Intel 则围绕开放 Ethernet 扩展和更容易的 GPU 迁移来包装 Gaudi。Top500、ORNL 和 HPE
              共同强化了同一个结构性事实：领导级已部署超算仍由成熟 OEM、CPU、GPU 生态主导，它们有深厚供应和支持能力。


              这比头条基准声明更重要。即便新架构在技术上优雅，也要从装机基础劣势起步。买家已经知道如何给既有集群配人、降温、调度和支持。采购团队认识交易对手，开发者熟悉工具链。因此，NextSilicon
              竞争的不只是硅片性能，也是在对抗供应商熟悉度。这正是为什么「更好的架构」本身不足以快速赢得广泛采用。
