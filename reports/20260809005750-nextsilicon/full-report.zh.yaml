      - number: '2.3'
        title: 买家、用户与预算所有者因细分市场而明显不同
        blocks:
          - type: paragraph
            body: >-
              买家地图并不统一。在国家实验室和国防项目中，技术用户是计算科学家和应用团队，但预算权在项目经理和政府 HPC 现代化办公室手里。在高校中心，用户是教师和研究小组，采购通常通过联盟经费、大学 IT
              或科研计算负责人推进。在企业 R&D 里，日常用户可能是仿真、量化或工程团队，但付款方通常是集中式基础设施、R&D 或业务单元预算负责人，他们需要清晰的总体拥有成本故事。


              云厂商又加了一层，因为它们既是客户，也是替代品。它们可以为自有机群采购加速器，也会通过提供突发容量和托管 HPC 环境，降低部分客户直接购买新硅片的紧迫感。当前公开证据显示，NextSilicon
              最强的早期采用路径，是那些技术成熟、足够重视性能、代码可移植性和能效，愿意测试非标准硬件的机构。Sandia 和 Zuse Institute Berlin
              重要，正因为它们验证了这一精确原型：先进研究环境愿意在可信集成商和强技术协作支持下评估新架构。
