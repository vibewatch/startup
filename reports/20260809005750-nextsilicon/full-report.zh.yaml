  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 公开客户基础偏向成熟研究买家，而不是宽泛企业覆盖
        blocks:
          - type: paragraph
            body: >-
              可见买家画像比通用企业基础设施客户更窄，技术要求也更高。具名公开证据集中在国家安全计算、研究型超算和欧洲科学基础设施，而不是一长串商业企业。Sandia 的 Vanguard
              项目是最清晰锚点：它在三实验室国家安全场景中使用 Maverick-2，买家看重 FP64 密集型工作负载、架构实验和更低移植摩擦。Zuse Institute Berlin 和 ODISSEE
              项目从欧洲侧强化同一模式，指向主权或公共资助科学计算环境；这些环境比主流企业 IT 买家更愿意容忍新颖性。


              与此同时，公司的现场岗位显示更大野心。售前和客户解决方案招聘提到政府、高校、金融、制造、工程、天气、图计算和 AI
              工作负载。这告诉我们公司想卖给谁，也很可能说明它正在何处拓客。它不能证明所有这些细分都已转化为付费、重复、生产客户。因此，当前证据支持一个分层判断：与研究和主权 HPC
              早期采用者匹配度强，进入技术型企业垂直领域有可能，但广泛商业渗透的公开证据仍薄。
