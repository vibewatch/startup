      - number: '2.5'
        title: 约束：电力、供应、软件风险和既有默认项让漏斗保持狭窄
        blocks:
          - type: paragraph
            body: >-
              同一批支持市场增长的来源，也解释了为什么市场规模本身并不能保证挑战者轻松被采用。Mordor、CSIS、NVIDIA
              和供应商页面共同描绘了一个现实：数据中心受电力约束、液冷昂贵、先进封装稀缺，既有平台还在持续快速改进。若客户想要替代方案，这种环境会帮到
              NextSilicon；但它也可能伤害公司，因为买家会对集成风险更保守，已经控制供应、软件栈和支持渠道的大厂也会变得更强。


              软件和迁移摩擦同样关键。NextSilicon 的市场论点取决于降低移植负担，而这正是 GPU
              巨头过去的护城河。即使友好来源也承认，客户仍需要工作负载证据、基准可信度、集成商支持，以及组织上愿意离开熟悉默认项。正确的心智模型因此是一个快速收窄的采用漏斗：顶部是广泛计算需求，下面是更小的一组有架构痛点的工作负载，再往下是更小的一组愿意评估新硅片的买家，而今天公开证据能证明的生产足迹非常小。这仍可投资，但不等于广泛市场捕获。
