        - label: 公开留存 / 扩展验证
          value: 1
          detail: 连续性代理指标存在，但没有真实续约数据集
    approximationNotes: 数值是证据密度指数，不是字面客户数量。
    claimRefs:
      - CU012
      - CU017
      - CU020
      - CU026
      - CU030
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 具名验证集在独立性、生产清晰度和留存可见度上差异很大。
    data:
      columns:
        - 独立确认
        - 生产清晰度
        - 结果具体度
        - 留存可见度
      rows:
        - label: Sandia / Spectra
          values:
            - 高
            - 中高
            - 高
            - 中
        - label: ZIB / ParTec
          values:
            - 中
            - 低中
            - 中
            - 低
        - label: ODISSEE / CERN 相关工作
          values:
            - 高
            - 低中
            - 中
            - 低中
        - label: 未具名「数十个站点」说法
          values:
            - 低
            - 低
            - 低
            - none
    approximationNotes: 定性排序只反映保留下来的公开证据，不应解读为来自公司内部数据的客户评分。
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
      - CU020
      - CU025
      - CU030
  - id: FU004
    title: 留存 / 重复使用队列
    type: cohort
    layout: wide
    summary: 公开可见度代理指标只能提示哪些具名案例随时间仍有持续互动，不能替代真实收入留存。
    data:
      columns:
        - '2024'
        - '2025'
        - '2026'
      rows:
        - label: Sandia 公开延续性
          values:
            - 100
            - 100
            - 100
        - label: ZIB 公开延续性
          values:
            - 100
            - 50
            - 50
        - label: ODISSEE 公开延续性
          values:
            - 0
            - 100
            - 100
    approximationNotes: 百分比只是延续性代理：看保留下来的公开来源在某一期间是否仍有活跃证据；不是客户收入留存率或续约率。
    claimRefs:
      - CU018
      - CU020
      - CU031
      - CU036
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 综合风险最高的项来自生态竞争、供应链脆弱性，以及公开验证基础集中在少数样本。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 出口管制复杂度
          values:
            - 中
            - 高
            - 中低
            - 中高
        - label: 晶圆代工 / 封装依赖
          values:
            - 中高
            - 高
            - 中低
            - 高
        - label: NVIDIA / 既有生态势力
          values:
            - 高
            - 高
            - 中低
            - 高
        - label: 合作伙伴介入交付
          values:
            - 中高
            - 中高
            - 中
            - 中高
        - label: 客户集中度
          values:
            - 高
            - 中高
            - 低
            - 中高
    claimRefs:
      - CR009
      - CR017
      - CR025
      - CR033
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 外部依赖一旦受冲击，会很快传导到客户验证、收入节奏、融资杠杆和估值信心。
    data:
      nodes:
        - id: n1
          label: 出口规则变化
        - id: n2
          label: 供应中断
        - id: n3
          label: 合作伙伴延期
        - id: n4
          label: 部署延期
        - id: n5
          label: 客户验证变弱
        - id: n6
          label: 销售周期拉长
        - id: n7
          label: 烧钱更多 / 杠杆更低
        - id: n8
          label: 估值信心下降
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
    claimRefs:
      - CR015
      - CR017
      - CR032
      - CR033
      - CR037
  - id: FR003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: NextSilicon 依赖几类外部机构；它们的激励和约束并不完全受公司控制。
    data:
      nodes:
        - id: d1
          label: BIS / 出口规则
        - id: d2
          label: 以色列出口机构
        - id: d3
          label: TSMC / 上游供应
        - id: d4
          label: Penguin / 集成商
        - id: d5
          label: ParTec / 欧洲路径
        - id: d6
          label: Cornelis / 生态触达
        - id: d7
          label: 旗舰客户引用
        - id: d8
          label: 商业化扩张
      edges:
        - from: d1
          to: d8
        - from: d2
          to: d8
        - from: d3
          to: d7
        - from: d4
          to: d7
        - from: d5
          to: d8
        - from: d6
          to: d8
        - from: d7
          to: d8
    claimRefs:
      - CR003
      - CR010
      - CR026
      - CR028
      - CR029
      - CR041
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议的核心，是把技术稀缺性与估值模糊、商业化风险放在一起权衡。
    data:
      nodes:
        - id: a
          label: 差异化架构
        - id: b
          label: 已有旗舰验证
        - id: c
          label: 估值锚点噪声大
        - id: d
          label: 收入 / 利润率不透明
        - id: e
          label: 风险堆栈偏高
        - id: f
          label: 继续研究
        - id: g
          label: 估值立场：偏高
      edges:
        - from: a
          to: f
          label: 支撑关注
        - from: b
          to: f
          label: 支撑关注
        - from: c
          to: g
          label: 削弱把握
        - from: d
          to: g
          label: 削弱把握
        - from: e
          to: g
          label: 折价
        - from: g
          to: f
          label: 需要更多验证
    claimRefs:
      - CV017
      - CV026
      - CV027
      - CV030
      - CV032
      - CV041
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 少数缺失变量主导了价值支撑的合理区间。
    data:
      items:
        - label: 收入 / 积压订单可见度
          value: 30
          unit: impact score
        - label: 具名客户广度
          value: 28
          unit: impact score
        - label: 毛利率方向
          value: 22
          unit: impact score
        - label: 供应 / 合规质量
          value: 20
          unit: impact score
        - label: 既有生态响应
          value: 18
          unit: impact score
    approximationNotes: 影响分数是定性投资判断权重，不是统计回归。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV037
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于验证和经济性尚未以足够精度公开披露，示意性股权价值结果仍然很宽。
    data:
      items:
        - label: 低情形股权价值（USD B）
          low: 0.5
          mid: 0.7
          high: 0.9
          note: 验证范围窄 + 经济性不透明 + 风险折价
        - label: 基础情形股权价值（USD B）
          low: 1
          mid: 1.3
          high: 1.6
          note: 客户更多，经济性可见度有所提升
        - label: 高情形股权价值（USD B）
          low: 1.7
          mid: 2.1
          high: 2.5
          note: 更广泛采用和强执行可支撑溢价
    approximationNotes: 示意情景锚定公开验证质量和同类赛道估值标记，而不是管理层指引或已披露收入模型。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV026
      - CV027
      - CV032
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 可见记录在技术差异化上最强，在经济性披露上最弱。
    data:
      items:
        - label: 公开估值锚点
          value: ~$1.5B-$1.6B
          note: 二手来源区间，不是公司申报文件
        - label: 总融资额（公开引用）
          value: $120M-$303M
          note: 融资轮历史存在来源冲突
        - label: 具名旗舰验证
          value: '3'
          note: Sandia、ZIB、ODISSEE 类锚点
        - label: 收入披露
          value: None public
          note: 未保留经审计收入或利润率
        - label: 建议
          value: research-more
          note: 需要私有证据承销溢价估值
        - label: 估值立场
          value: stretched
          note: 经济性披露改善后可能上修
    approximationNotes: KPI 卡混合二手估值锚点和公开验证数量，用来概括决策准备度，而不是公司运营 KPI。
    claimRefs:
      - CV002
      - CV005
      - CV014
      - CV030
      - CV032
      - CV041
