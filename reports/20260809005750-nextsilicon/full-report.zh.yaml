      - number: '4.4'
        title: 资本充足度好于平均初创，但 runway 仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开记录里最强的直接财务正面因素是资本获取能力。2026 年官方公司材料称，NextSilicon 至今已融资 $303M，全球员工超过 350 人。2025 年一篇特写同样描述公司生命周期内累计融资约
              $303M；Sandia 和商业化公告则显示，公司现在已有真实客户部署、伙伴项目和更大的现场组织支撑。这比许多加速器初创在公开发布前能展示的财务实质要强得多。


              问题在于，公开融资额不等于公开 runway。保留来源没有披露账面现金、月度 burn、债务、库存融资、在手订单转化或回款周期。公司法律顾问招聘明确强调股权融资轮、治理、cap table
              管理和后期私营公司的法律基础设施，说明融资在战略上仍重要。与此同时，更广泛的加速器市场仍极度吃资本：Groq、Cerebras、SambaNova 仅在 2026
              年就融资或部署了巨额资本。因此，最能防守的结论是：NextSilicon 比平均的收入前芯片初创资本更充足，但开放来源仍无法承销其 runway 或自我供血能力。
