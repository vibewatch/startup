      - number: '4.5'
        title: 财务判断：商业就绪信号真实，但承销输入不足
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个细分判断。正面看，NextSilicon 现在展示出一家正在规模化的半导体公司应有的组织部件：财务领导、controller
              支持、采购、销售运营、伙伴赋能、客户工程、融资轮法律支持，以及具体客户和伙伴引用。它的资金看起来也好过许多同类加速器企业，2026 年官方材料仍在依托九位数资本基础和不断扩大的伙伴生态。


              不过，公开记录恰恰在投资人承销近期收入质量所需的关键处偏弱。没有披露 ASP，没有在手订单，没有从概念验证转生产订单的转化数据，没有硬件毛利率，没有营运资本桥，也看不到现金 burn
              或债务义务。二级数据库在融资历史、估值、员工数和估计收入上也滞后或互相矛盾，提高了依赖它们的成本。结果是一个运营上严肃、分析上不完整的财务画像：足以支持继续尽调，但不足以对利润率路径、runway
