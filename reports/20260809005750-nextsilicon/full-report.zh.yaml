  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：正确市场比「所有 AI 芯片」更窄
        blocks:
          - type: paragraph
            body: >-
              尽调第一步不是先引用市场规模数字，而是先界定 NextSilicon 实际进入哪个市场。宽口径 AI 加速器报告会纳入超大规模训练和推理支出、边缘设备、特定应用硅片项目，这些都远大于 NextSilicon
              眼前买家池。相比之下，较窄的 HPC 加速器视角追踪的是与科学仿真、科研计算、国防、工业工程及其他并行工作负载有关的计算支出；在这些场景里，加速器选择受精度、带宽和运行效率共同影响。


              这种窄口径更贴合公司的公开定位。NextSilicon 一直围绕 HPC 和困难的 AI/HPC 融合工作负载营销 Maverick-2，而不是围绕商品化云推理。这个市场也有明确的现状替代项：买家可以继续使用
              NVIDIA、AMD、Intel 的既有平台；可以租用云 HPC，而不是购买新架构；也可以推迟迁移，保留 CPU 或 GPU 资产。实际结论是，邻近 AI
              硅片增长在战略上重要，因为它会强化既有厂商并抬高客户预期，但不应与 NextSilicon 的直接可服务市场混为一谈。
