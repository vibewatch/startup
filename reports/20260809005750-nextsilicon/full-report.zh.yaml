      - number: '8.5'
        title: 什么会改变结论：更多收入、客户广度和持久交付能力证据
        blocks:
          - type: paragraph
            body: >-
              这个决策框架既对价格敏感，也对证据敏感。如果管理层能展示来自具名项目的可重复收入、 超过少数旗舰账户的多元化获客、站得住的毛利率进展，以及能降低未来部署风险的制造 / 合规
              栈，同一个在公开材料里显得偏紧的估值，可能开始显得合理甚至有吸引力。反过来，如果客户 故事仍然狭窄，商业化仍依赖少数英雄式部署，或收入可见度继续不透明，那么即便架构技术很强， 也未必能支撑溢价私人标记。


              关键在于，缺失的尽调问题没有一个是装饰性的。这些变量正好决定公司是在变成可扩展计算平台， 还是仍是一笔精彩但小众的硬件赌注。因此，建议不是否定这个故事；而是在承销估值前补上证据
              缺口。上行可能真实存在，但单凭公开记录，还不足以让估值信心跑在技术欣赏前面。
            claimRefs:
