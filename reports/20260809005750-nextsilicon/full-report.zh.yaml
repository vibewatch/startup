      - number: '5.4'
        title: 部署成熟度真实存在，但仍依赖少数关键生态伙伴
        blocks:
          - type: paragraph
            body: >-
              公开部署证据现在已经足以把产品推出「仅原型」类别。Sandia 合作页面和 NextSilicon 的验收公告显示，Spectra 已在 Vanguard 项目下完成系统验收；ParTec 公开称 Zuse
              Institute Berlin 是 Maverick-2 的首个欧洲客户。ODISSEE 和 CORDIS 还把 NextSilicon 放进一个多方欧洲研究计划，该计划聚焦 exabyte
              级科学工作负载。这比许多新架构初创能达到的部署记录更强。


              但同一记录也暴露了依赖集中。Sandia 的系统集成通过 Penguin 推进，欧洲交付通过 ParTec 推进，未来网络验证通过 Cornelis
              推进，科学项目信誉来自少数标杆研究环境。这种依赖图谱并不致命——事实上，前沿基础设施经常就是这样商业化——但它意味着产品成熟度仍与伙伴执行、基准透明度，以及狭窄早期采用者生态的持续健康高度纠缠。产品是真实的；周围交付网络仍薄到足以产生实质影响。
