      - number: '7.5'
        title: 风险结论可投但脆弱：技术信号强，外部硬依赖多，破坏论点的条件清晰
        blocks:
          - type: paragraph
            body: >-
              这家公司的风险画像不能简单概括成“硬件很难”。更准确的说法是，几个外部依赖彼此叠加： 出口管制复杂度、代工和封装集中、在位生态力量、由伙伴参与的交付，以及仍然狭窄的参考
              客户基础。单看任何一个风险，都不必然致命。但合在一起，它们会制造相关下行。供应滑坡会 削弱客户背书；背书变弱会拉长销售周期；销售周期拉长会加重融资压力；融资压力又会降低
              公司缓冲供应链冲击、支撑高要求软件路线图的能力。


              这种相关性解释了为什么本章建议监控少数会打破投资论点的触发因素，而不是追踪几十个 泛泛的初创公司担忧。如果公司能在 Sandia 式旗舰证明之外增加具名客户，在欧洲拿出持久
              在线部署，在出口规则变化时保持合规成熟，并避免伙伴依赖遮蔽终端客户关系，风险会显著 压缩。如果做不到，下行故事就更容易想象：架构优雅、科学可信，却缺少足够商业逃逸速度。
              正确的尽调反应不是直接否定公司，而是在为上行叙事支付溢价前，要求公司拿出具体证据来 反驳这些传导路径。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
