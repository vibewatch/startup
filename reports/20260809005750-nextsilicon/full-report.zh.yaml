      - number: '2.4'
        title: 增长驱动带来更多计算需求，不等于初创更容易打进去
        blocks:
          - type: paragraph
            body: >-
              几项长期驱动支撑市场扩张。公开分析来源一致指向 AI 与 HPC
              融合、仿真和数字孪生的更广泛使用、主权计算项目，以及降低实验成本的云访问。官方云和基础设施页面补充了买家层面的细节：金融、基因组学、天气、EDA、分子动力学、能源工作负载已经消耗大规模 HPC
              资源，且经常需要紧耦合计算、快速网络和高带宽存储。HPE、ORNL 和 TOP500 描述的 exascale 建设也说明，科学和关键任务计算需求并未停滞。


              NextSilicon 真正起作用的驱动不是泛泛的 AI 亢奋，而是那些当前架构用起来别扭或能效偏低的工作负载。公司材料、外部访谈和 XPU 评测都聚焦不规则、内存密集、高精度工作负载；这些负载并不完全匹配当前
              AI 加速器军备竞赛里的低精度优先级。如果客户层面的痛点属实，公司既受益于长期需求增长，也受益于一条正在扩大的架构缺口：前沿 AI 工厂优化的东西，与部分 HPC 买家仍然需要的东西并不相同。
