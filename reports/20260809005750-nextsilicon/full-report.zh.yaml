      - number: '5.3'
        title: 可编程性取决于编译器、工具和 Arbel CPU 路径
        blocks:
          - type: paragraph
            body: >-
              任何非常规加速器的生死线都是可编程性，NextSilicon 显然知道这一点。公司的 BYOC 和 FAQ 材料反复强调，用户不应被迫重写代码或采用专有语言。公开页面称 Maverick-2 如今支持常见 HPC
              语言和框架，并计划更广泛集成；技术页面则突出 profiler、chip-viewer 和 projection-viewer 等工具，意在暴露运行时行为。开发者信号也从内部支持同一故事：AI libraries
              岗位要求优化 GEMM、FlashAttention 等 AI kernel，客户解决方案岗位则要求熟悉 LLVM、调度器和主流并行编程模型。


              Arbel 通过处理异构计算中的串行和编排侧，强化了这个软件故事。公开记录现在同时描述了一条与加速器集成的 RISC-V 路径，以及单独的服务器级 CPU 项目。Arbel 页面和工程博客讨论
              Linux、GCC/LLVM、一致性测试硅片、面向虚拟化的 ISA 目标、向量单元和 chiplet 式路线图。这不能证明广泛商业可用，但确实说明 NextSilicon 把
              CPU、编译器和加速器视为一个系统问题，而不是彼此孤立的模块。把它理解为紧耦合平台赌注，而不是单芯片赌注时，这套架构最有说服力。
