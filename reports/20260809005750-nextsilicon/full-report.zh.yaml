      - number: '8.4'
        title: 建议：继续研究；除非私下尽调补齐几个核心缺口，否则估值姿态偏紧
        blocks:
          - type: paragraph
            body: >-
              把这些拼在一起，结论应当谨慎。NextSilicon 明显拥有能支撑溢价的属性：深度技术差异化、 旗舰部署证明、与受功耗约束 HPC 的相关性，以及一个战略稀缺性可能有价值的市场类别。
              这些都是不应直接放弃公司的理由。但公开证明与公开价格锚之间的承销缺口仍然很大。如果 流传最广的估值标记大方向正确，投资人看起来是在已披露商业化证据之前付钱，而不是在其后
              付钱。这是合法的风险投资模式，但只有尽调能把公开模糊性替换成私下确定性时才成立。


              因此，最干净的判断是继续研究，而不是只有跟踪的乐观或一概否定。公司可能配得上溢价估值， 但公开可见记录还不足以让外部投资人验证经济引擎，从而放心接受这个溢价。实际姿态是偏紧，
              而不是荒谬。这个区别重要：偏紧意味着估值可以被更多证据挣回来；荒谬则意味着当前证明基础 显然撑不起价格。今天的 NextSilicon 更像前一种。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
