      - number: '1.5'
        title: 创立以来的里程碑与 2026 年前的主要观察点
        blocks:
          - type: paragraph
            body: >-
              半导体公司通常不会这样密集推进；这组里程碑异常紧凑。公开记录显示，公司 2017 年完成法律设立，2021 年大额融资确立了独角兽式预期，2023 年 8 月出现 Israel Innovation
              Authority 联盟信号，2024 年 5 月与 Sandia 达成合作，随后在 2024 年 10 月围绕 Maverick-2 高调走出隐身。到 2025
              年末，公司外部叙事进入新阶段，重心转向奖项、基准宣传和生态伙伴。2026 年 1 月的 Spectra 故事最重要，因为它把叙事从承诺推进到国家安全原型环境中的真实部署硅片。


              剩下的观察点很直接。第一，投资人需要更清楚地看到，性能主张能离开公司挑选的工作负载，进入可重复的客户价值。第二，他们需要证据证明 Sandia
              及同类实验室之外的商业买家，正在从兴趣转向生产支出。第三，公司需要一套对齐后的资本和治理材料，才能按运营业务来评估，而不只是按有吸引力的架构论点来评估。公开证据表明 NextSilicon
              已越过「严肃公司」门槛；但还不能说明商业化风险已经消失。
