        title: 交付产品是计算平台，不只是芯片
        blocks:
          - type: paragraph
            body: >-
              NextSilicon 卖的不是孤立的裸半导体。公开记录描述的是围绕 Maverick-2 加速器搭建的更宽计算平台：运行时和编译器层、开发者工具、客户工程支持，以及由伙伴主导、集成到 PCIe 卡和 OAM
              服务器等系统形态中。关于实际交付内容，最强公开证据来自 Sandia 的 Spectra 系统；Maverick-2 部署在一个 64 节点原型平台内，设计用于运行 HPCG、LAMMPS、SPARTA
              等任务工作负载。这比只有路线图的加速器故事具体得多。


              因此，产品应被理解为一套栈：起点是数据流硅片，但只有通过翻译、遥测、支持工具和系统级认证，才真正可用。公司的售前、AI libraries 和客户解决方案岗位也强化了这一解读，它们强调代码移植、基准测试、低层
              kernel 工作、profiling，以及跨科学和 AI 工作负载的终端用户支持。买家采用的不只是一个设备，而是一种新的执行模型；它需要编译器、诊断和服务，才能让硬件在近生产环境中可读、可信。
