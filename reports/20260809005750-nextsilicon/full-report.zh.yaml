  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资状态
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - NVIDIA HGX / Blackwell
        - 现有商售 GPU 平台
        - 超大市值现有厂商，当前装机基础最深
        - AI 工厂、HPC 中心、超大规模云厂商、企业
        - GPU、CPU、网络和软件的全栈整合
        - 锁定风险最高，部分买家还要承受沉重的供电 / 散热负担
      - - AMD Instinct MI350
        - 现有商售 GPU 替代方案
        - 大型上市现有厂商，触达 OEM 渠道
        - AI 和 HPC 数据中心部署
        - 软件开放姿态明确，并适配现有机架 / 散热边界
        - 生态引力仍落后于 NVIDIA
      - - Intel Gaudi 3
        - 现有商售加速器替代方案
        - 大型上市现有厂商
        - 大规模 AI 集群和成本敏感型迁移路径
        - 以 Ethernet 优先扩展，并明确主打反锁定信息
        - 公开叙事更偏 AI，而不是经典 HPC
      - - Google TPU
        - 超大规模云厂商自用芯片
        - Google 自有云平台，不是广泛商售芯片
        - Google Cloud AI 训练和推理用户
        - 深度垂直整合和大集群规模
        - 更多是 Google Cloud 内部替代品，而非直接商售选项
      - - AWS Trainium
        - 超大规模云厂商自用芯片
        - Amazon 自有云平台，不是通用商售加速卡
        - AWS AI 训练和推理用户
        - 定制化经济性与无缝 AWS 工具链
        - 更适合愿意留在 AWS 内的工作负载，而非主权本地 HPC
      - - Cerebras
        - AI 专用创业公司
        - 私有创业挑战者；规模叙事靠系统架构，而不是商售出货量
        - 大型 AI 训练和推理
        - 晶圆级引擎和极高原始 AI 算力
        - 公开定位更偏前沿 AI，而不是传统 HPC 可移植性
      - - Groq、SambaNova 与 d-Matrix
        - 推理专用挑战者
        - 私有 AI 基础设施挑战者
        - 高吞吐或低时延推理
        - Token 经济性和推理叙事强
        - 与 NextSilicon 以 HPC 优先的迁移切口不那么直接对齐
      - - Graphcore
        - AI 加速器架构替代方案
