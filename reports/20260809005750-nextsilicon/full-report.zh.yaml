  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买家 / 付款方
      - 与 NextSilicon 的相关性
    rows:
      - - 狭义 HPC 加速器市场
        - 用于 HPC 工作负载的加速卡或模块，包括 GPU、FPGA、CPU 加速器和 ASIC 替代方案
        - 通用服务器、云服务、软件、存储和消费级 AI 设备
        - 研究中心、国防实验室、企业研发、先进工业用户
        - 最直接的市场代理，因为它对应 NextSilicon 想影响的硬件采购决策
      - - 广义 HPC 市场
        - HPC 部署所需系统、软件、服务、存储、网络和支撑基础设施
        - 商品化企业 IT 和无关 AI 软件支出
        - 国家实验室、大学、超大规模云厂商、企业、政府
        - 有用背景，因为客户通常购买完整平台，而不是孤立芯片
      - - AI 加速器芯片市场
        - 覆盖超大规模云、企业、边缘和垂直芯片项目的训练与推理加速器
        - 非加速计算，以及大部分传统 HPC 软件 / 服务
        - 超大规模云厂商、OEM、云运营商、企业 AI 买家、设备制造商
        - 重要战略邻近市场，但显著宽于公司眼下可服务池
      - - 云 HPC 服务
        - 在云中以托管或自管理 HPC 容量出售的弹性计算、存储和网络
        - 自有本地硬件预算，以及部分隔离的主权系统
        - 云提供商和租用突发计算的客户
        - 既是替代品也是补充品，因为它可能延后硬件采购，同时拓宽工作负载实验
      - - 主权 / 国家实验室超算
        - 由政府或研究联盟资助、面向特定任务的百亿亿级和先进原型系统
        - 商业中小企业计算和通用企业 AI 设备
        - 项目办公室、部委、实验室、公共研究机构
        - 早期证明匹配度高，因为这些买家资助前沿架构评估
      - - 在位者现状采购
        - NVIDIA、AMD、Intel 和传统 CPU/GPU 集群的更新周期
        - 尚未获批的新架构溢价
        - 基础设施负责人、采购委员会、工作负载负责人
        - 这是 NextSilicon 必须替换的现实默认采购行为
    notes: 定义保留不同层次，避免把广义 AI 芯片估算误当成直接可寻址需求。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM020
      - CM031
