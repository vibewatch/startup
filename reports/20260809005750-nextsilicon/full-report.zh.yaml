      - number: '8.3'
        title: 估值敏感性主要由缺失的收入证据、客户广度和风险压缩驱动，而不是单靠市场规模
        blocks:
          - type: paragraph
            body: >-
              由于缺少直接财务披露，估值区间只能用情景逻辑搭起来。在低情景里，NextSilicon 仍是一家 技术可信但商业面狭窄的硬件平台，有旗舰证明但转化不确定；这时溢价独角兽标记价几乎不留
              犯错余地。在基准情景里，公司转化更多具名研究和主权账户，证明部署可持续，并展现足够 商业化成熟度，高端私人基础设施估值仍然说得通。在高情景里，公司在做到这些的同时，还 证明 Maverick-2
              或后续产品能从少数旗舰证明突破到更广的系统级或 AI 邻近切入口。


              最能改变估值的，不是又一句泛泛的 TAM 叙述，而是几个集中变量上的证据：超出 Sandia 式 参考胜利的客户广度、收入或已签订单可见度、毛利率方向、供应链执行，以及对抗在位生态
              锁定的韧性。没有这些数据点，下行情景仍然太容易勾勒。这不意味着公司弱；它意味着当前 公开证据仍支持很宽的可能估值分布。很宽的分布叠加溢价私人标记，通常指向谨慎而不是兴奋。
            claimRefs:
