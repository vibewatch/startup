      - number: '7.4'
        title: 伙伴依赖、长销售周期和公开客户广度不足叠加执行风险
        blocks:
          - type: paragraph
            body: >-
              NextSilicon 的获客路径看起来高度依赖技术密集型销售，以及帮助组装、交付或延展产品的 第三方。Sandia 案例里能看到 Penguin，欧洲能看到 ParTec，面向网络的参考架构里能看到
              Cornelis。这些伙伴有帮助，但也意味着部分客户体验不在公司直接控制之下。集成商延期、 OEM 激励错位，或伙伴战略转向，都可能拖慢转化。因此，商业路径比简单的硬件直销故事 更脆弱。


              公开客户名单很薄，进一步放大这种脆弱性。可见基础很小时，每个旗舰账户都要一身三任： 参考客户、技术验证者，以及下一笔销售的可信信号。这会抬高集中度风险，也让漫长评估周期
              更危险。公司可能技术上正确，却仍然丢时间；在前沿硬件里，时间会直接转化为烧钱。客户 章节已经说明，留存、重复订单和扩张在公开来源里大多尚未证明；从风险视角看，这意味着
              投资人是在为多个核心商业耐久性问题承销未来证明，而不是现有证明。
            claimRefs:
              - CR026
              - CR027
