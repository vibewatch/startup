      - number: '8.2'
        title: 可比公司显示 AI/HPC 芯片可以拿到很高估值，但估值更高的同行大多证明更宽、披露更清晰
        blocks:
          - type: paragraph
            body: >-
              可比组有信息量，但不好直接套。NVIDIA、AMD、Intel、TSMC 等公开龙头不是 IPO 前私人 初创公司的直接估值可比，但仍相关，因为它们定义了这个市场里在位规模、生态深度和资本强度
              的量级。Cerebras、Groq、SambaNova、Tenstorrent 等私人同行在概念上更近，因为它们同样 结合了新架构、重资本需求和战略可选性。它们披露的估值说明，只要投资人相信公司拥有稀缺
              技术资产、可信部署路径，或围绕 AI 基础设施需求的动能，市场愿意为 AI/HPC 芯片敞口支付 激进价格。


              问题在于，其中几个同行要么披露更多运营数据，要么类别定位更清楚，要么比 NextSilicon 目前的公开叙事更受 AI 顺风支撑。NextSilicon 的公开客户证明真实但狭窄；最强公开引用 来自先进 HPC
              和主权科学场景，而不是广泛 AI 推理或超大规模云厂商部署故事。这不意味着 公司应该低估值。它意味着直接同行比较只能当作外边界背景，不能作为任何溢价私人估值都
              自动合理的许可。一家公司可以属于热门类别，却相对自己的可见证明基础仍显昂贵。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
