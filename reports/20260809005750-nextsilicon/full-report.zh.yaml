      - number: '3.3'
        title: 挑战者阵营真实存在但碎片化，多数更偏 AI 而非 HPC
        blocks:
          - type: paragraph
            body: >-
              非既有厂商阵营很拥挤，但并不同质。Cerebras 强调面向超大 AI 工作负载的晶圆级训练和推理。Groq、SambaNova、d-Matrix
              都更偏推理经济性、吞吐或延迟，交付方式常是云或设备化交付，而不是经典 HPC 商用卡故事。Graphcore 在架构上仍有看点，但其公开产品话术仍围绕 IPU 概念和较早系统代际，显示其当下商业姿态弱于最激进的
              AI 基础设施挑战者。


              这种碎片化对 NextSilicon 有战略意义。它意味着公司没有面对一个完全对齐的初创对手，后者同时拥有同等 HPC 可移植性主张、同等国家实验室证据和同等伙伴支持。但它也意味着客户心智被许多「GPU
              替代品」叙事分走，其中大多数围绕 AI 训练或推理，而不是经典 HPC 代码。因此，NextSilicon 的 HPC
              优先、无需重写论点确实有差异，但这种差异存在于一个嘈杂市场里，许多挑战者也在承诺效率、速度、开放性或更低成本。
