        title: 具名客户证据存在，但高置信集合很小
        blocks:
          - type: paragraph
            body: >-
              好消息是，NextSilicon 现在有真实具名证据，而不只是 logo 幻灯片。Sandia 提供最强证据，因为公司和客户都独立描述了系统、工作负载和验收流程。ZIB 与 ParTec
              提供第二条具名路径，显示欧洲采用兴趣，以及围绕 Maverick-2 的具体培训活动。ODISSEE 提供第三个具名表面，公司和欧洲项目来源都确认 NextSilicon 参与了一个 exabyte
              科学联盟，并向该工作交付了硬件。


              坏消息是，这三个锚点也是公开证据集的核心。它们有意义，但还不是一个跨多个行业、具名商业终端客户多元名单。即便公司材料提到全球数十个客户站点，保留来源也没有把这句话转化为透明账号名单、付费部署名册或按垂直行业拆分的生产情况。因此，本章可以有信心地说公司拥有真实客户牵引；但还不能说这种牵引广泛、可重复，或在多种账号类型之间商业上均衡。
