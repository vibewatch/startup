    rows:
      - - NextSilicon
        - 未披露公开标价；硬件销售加合作伙伴主导集成 / 托管
        - 商售加速器、工具链、合作伙伴集成路径
        - 实际 ASP、支持定价和积压订单经济性未知
        - 仅靠公开数据仍无法做商业测算
      - - NVIDIA / AMD / Intel 商售系统
        - 通常通过 OEM 或合作伙伴系统销售；公开标价往往不透明
        - 商售硬件加成熟生态支持
        - 实际成交价会随 OEM、打包和采购量大幅变化
        - 采购默认熟悉度有利于现有厂商
      - - Google TPU
        - 通过 Google Cloud 定价结构按云消费
        - Google Cloud 内的加速器、集群规模和软件栈
        - 对多数买家不是商售加速卡；具体经济性取决于工作负载
        - 适合愿意把工作负载迁入 Google Cloud 的买家作为替代
      - - AWS Trainium
        - 通过 AWS 实例和托管服务按云消费
        - 芯片、网络、Neuron SDK、编排和机群运营
        - 经济性取决于预留 / 按需用量和模型行为
        - 适合买家重视 Token 经济性高于硬件所有权时作为替代
      - - Cerebras
        - 定制系统 / 服务合作
        - 晶圆级硬件和完整平台
        - 留存来源未见公开标价
        - 可能通过高接触度企业或科研销售路径出售
      - - Groq / SambaNova
        - 专用云或一体机式销售路径
        - 推理栈加基础设施或私有部署
        - 公开经济性偏叙事，且高度取决于工作负载
        - 在推理时延和吞吐关键的场景竞争最直接
      - - d-Matrix 与 Graphcore
        - 硬件平台销售路径，公开实际定价披露有限
        - 专用加速卡、系统或 IPU 服务器
        - 商业条款和装机基础深度在公开层面不清楚
        - 采购证据薄弱时，采用风险仍更高
    notes: 定价不透明本身就是该类别的竞争信号；除云消费模式外，公开标价并不常见。
