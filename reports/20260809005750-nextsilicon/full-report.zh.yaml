  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 首要问题不是数字，而是公开估值锚的质量和一致性
        blocks:
          - type: paragraph
            body: >-
              估值章节只有在锚点本身站得住时才有意义。对 NextSilicon 来说，这个锚点很嘈杂。一些 私募市场和初创公司追踪来源暗示或声称，公司估值已达到约 $1.5-1.6 billion；另一些来源 仍强调较早的
              2021 年融资图景，或只给出宽泛的独角兽式分类。额外的 2024 年报道显示， 公司先以 $800 million 估值完成 $200 million 融资，随后又以约 $1.6 billion 估值追加
              $100 million；但支撑这些步骤的公开证据来自二级数据库和新闻报道，而不是公司申报或 股权结构披露。这不说明数字为假，却说明它们更难被当作清晰事实承销。


              公司运营披露仍很薄。公开来源没有给出经审计收入、毛利率、经常性支持收入、留存指标或 已签订单，投资人无法三角验证一个数十亿美元级私人估值到底已经挣到，还是主要押注
              未来规模。实际结果是，估值不能做成精确的按模型标价练习。它必须围绕证明质量、已募资本、 战略定位，以及 AI/HPC 芯片类别里的可比市场行为做情景分析。证据缺到这个程度，正确问题
              就变成：当前估值标记在风险之外是否还留下足够上行，而不是电子表格能否为每一个小数位辩护。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
