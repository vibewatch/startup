  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 公开收入模型更像硬件加服务，而不是干净 SaaS 流
        blocks:
          - type: paragraph
            body: >-
              NextSilicon
              的公开商业足迹指向混合变现模型，而不是单一经常性软件流。公司的销售运营招聘写明，收入团队需要管理软硬件捆绑、物料清单准确性、收入拆分、分销商和渠道管理，以及从线索生成到现金回收的完整路径。这种语言符合一家半导体公司：销售系统或加速器模块，通过伙伴交付集成，再在必要时叠加软件、支持和现场工程。不符合简单自助订阅模型。


              同一模式也出现在面向客户的岗位。NextSilicon
              的售前和客户解决方案岗位强调概念验证、代码移植、基准测试、应用支持，以及与政府、高校和商业用户直接协作。这意味着收入确认和毛利率画像可能因交易而异：一部分价值可能落在硬件发货，一部分落在工程协助，还有一部分落在更长期支持关系。公开证据足以描述销售动作，但不足以衡量已实现
              ASP、软件附加率、服务组合，或经常性支持收入在多大程度上能抵消硬件销售天然的波动。
