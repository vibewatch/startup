companyProfile:
  summary: >-
    NextSilicon 是一家以色列私营计算硬件公司，成立于 2017 年，目标是把面向数据流的新型加速器架构商业化，服务高性能计算及相邻的高强度工作负载。公开材料最能支撑 Maverick-2 的差异化架构、Sandia
    牵头且挂钩 Vanguard 的 Spectra 部署，以及有分量的后期融资。公开材料最薄弱的地方在经济性披露、客户多元化、供应链细节，以及公司最新估值背后的精确结构。
