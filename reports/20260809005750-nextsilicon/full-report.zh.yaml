  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合比「其他芯片初创」更宽
        blocks:
          - type: paragraph
            body: >-
              竞争视角必须从买家要完成的任务开始，而不是从初创公司名单开始。NextSilicon 面对的任务，是为困难 HPC 和相邻 AI 工作负载提供加速计算。买家可以用 NVIDIA、AMD、Intel
              的既有商用平台解决；如果工作负载能迁入那些环境，也可以用 Google TPU 或 AWS Trainium 这类超大规模厂商自用硅片；可以选择 Groq、SambaNova、d-Matrix
              等专为推理打造的挑战者；可以选择 Cerebras 这类大模型专家；也可以简单刷新现有 CPU 和 GPU 资产，同时使用云端突发容量。


              这个框架很重要，因为其中一部分竞争者是直接对手，另一部分是替代品，赢法是让客户根本不需要购买新的商用加速器。NextSilicon 的公开故事最直接地区分于固定 GPU
              假设和移植痛点，但公司仍必须跨过几道坎：证明其架构在目标工作负载上确实优于既有经济性，证明软件迁移比买家担心的更容易，证明客户足够想要一个新的硬件品类，愿意打乱熟悉的采购模式。
