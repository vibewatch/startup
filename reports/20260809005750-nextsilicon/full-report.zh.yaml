      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Elad Raz 是 NextSilicon 最主要的公开面孔。公司官网 about 页面、外部访谈和合作伙伴评论都把他呈现为创始人兼
              CEO；检索到的公开记录中，他相对其他管理层拥有不成比例的叙事权重。Aleph 的公司页面补充了第二位公开可见创始人 Eyal Nagar，身份为联合创始人兼研发
              EVP。两人之外，公开来源的能见度迅速下降。Kelly Marquardt 出现在 Sandia 2024 年合作公告中，身份是 NextSilicon
              业务开发高管，但检索到的公开材料没有给出当前董事会名单、完整高管阵容或委员会结构。


              这种不对称会影响尽调。公司内部完全可能有更深的管理板凳，但公开记录仍显示，Raz
              的愿景、客户话术和融资叙事存在关键人集中。治理质量也因此比产品故事更难定价。投资人和管理层在尽调资料室里应该能轻松补齐这个缺口；在补齐之前，公开证据支持的判断是：创始人领导力强，但第三方治理透明度相对薄。
