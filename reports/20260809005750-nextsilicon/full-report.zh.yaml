      - number: '3.4'
        title: 切换成本、多栖部署与渠道权力决定真正战场
        blocks:
          - type: paragraph
            body: >-
              这个市场里的竞争优势不只是计算吞吐，而是降低切换成本，同时不要求买家把整个工作流押在一个新平台上。NextSilicon 明确攻击这个问题：承诺支持常见 HPC 语言，并把 Maverick-2
              定位为绕开供应商锁定的一条路径。XPU.pub 进一步强化了这一点，认为公司试图解决一类 HPC 工作负载——当供应商越来越为低精度 AI 优化时，这些负载服务不足。


              即便如此，买家可以多栖部署。他们可以保留现有 GPU 集群做大部分工作，为云端 AI 实验租用 TPU 或 Trainium，在 token
              经济性重要时使用专门推理服务，只在很窄的工作负载切片上测试新加速器。这会降低整体切换的紧迫性，也让渠道触达变得关键。NextSilicon 的公开伙伴组合——包括 Penguin、Dell 和
              ParTec——很重要，因为它提供了公司无法单独搭建的集成和交付路径。但这些渠道在可见范围内仍明显轻于最大既有厂商拥有的广泛 OEM、云和开发者分销网络。
