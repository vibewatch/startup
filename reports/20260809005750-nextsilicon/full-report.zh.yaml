      - number: '1.3'
        title: 融资历史、投资方与公开记录的混乱处
        blocks:
          - type: paragraph
            body: >-
              即便公开时间线并不完全干净，融资主线仍然扎实。NextSilicon 2024 年 10 月发布会稿称，公司已从一组辨识度高的风险投资机构累计融资 $303M，包括 Aleph、Amiti、Playground
              Global、Third Point Ventures、Liberty 系资本、StepStone 和 Standard Investments。Finder 2026 年 3 月画像给出非常接近的总额：五轮累计
              $302.6M，并把最新披露的估值跃升与 2024 年 10 月一笔 $100M 融资及 $1.6B 估值联系起来。


              问题在于，若干较早的开放数据库仍停在 2021 年 6 月 $120M 那轮，因此低估了当前融资额。Signalbase 增加了一笔 2024 年 6 月 $200M
              融资，但其标签不同于用户提供的时间线，也不同于其他画像。实务结论不是公司资金不足，而是公开来源里的轮次命名和排序仍有噪音。承销时，更保守的做法是把约 $303M 累计融资视为当前最可支持数字，同时把 2024
              年具体轮次标签、投资人分配和优先权堆栈列为尽调项，而不是干净的公开事实。
