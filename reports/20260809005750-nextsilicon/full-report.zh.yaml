chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立基线与公司销售内容
        blocks:
          - type: paragraph
            body: >-
              NextSilicon 本质上是一家以色列高性能计算芯片公司，试图用运行时自适应加速器替代 CPU 和 GPU 固定架构的前提假设。Dealroom、Tracxn、Finder
              与投资人材料给出的共同基线是：公司成立于 2017 年，总部在 Tel Aviv 地区；尽管部分公司自撰材料使用 2018
              年表述，那更可能指运营搭建，而不是法律注册。公司仍是未上市的后期私营公司，公开叙事几乎都围绕一个产品家族，而不是宽产品组合。


              这个产品家族就是 Maverick-2。NextSilicon 将其描述为基于 Intelligent Compute Architecture 的 Intelligent Compute
              Accelerator。卖点不只是 Maverick-2 更快，而是它在运行时观察应用、识别关键代码路径，并重塑硬件执行方式。重要的是，NextSilicon
              卖的不只是原始硅片性能，也在卖更低的移植摩擦：支持常见 HPC 语言和框架，被定位为对抗固定 GPU 生态的核心切入口。公司如今将服务器级 RISC-V CPU Arbel 与 Maverick-2
              一起推向市场，这强化了一种印象：NextSilicon 想随着时间控制更多计算栈，而不只是占一个小众加速器槽位。
