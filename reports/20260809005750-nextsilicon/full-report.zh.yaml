      - number: '3.5'
        title: 护城河判断：真实切口、证据偏薄、巨头反压很重
        blocks:
          - type: paragraph
            body: >-
              当前公开记录支持一个平衡判断。NextSilicon 确实看起来有真实切口：HPC 优先定位、由可移植性牵引的迁移故事，以及 Sandia 给出的异常具体的公开证据。这已经好过许多只有架构 PPT
              和泛泛客户承诺的硬件初创。问题在于，相对市场结构，护城河耐久性仍显得偏薄。公司尚未展示足以迫使既有厂商回应、或让替代变得容易承销的装机基础、软件生态广度、云触达或独立基准数量。


              因此，结论是：NextSilicon 的差异化可信，但默认还不耐久。如果 Sandia 路径扩展成可复现基准数据和更多具名部署，公司位置会明显增强。否则，市场仍可能吸收其核心洞见，而买家继续偏好既有
              GPU、云原生定制硅片或狭窄推理专家。最大的竞争风险不是公司没有想法，而是市场最强的分销和软件优势在别处。
