      - number: '2.2'
        title: 规模视角：真实增长、口径分散，没有单一干净 TAM
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开规模来源支持强劲市场增长，但没有给出单一共识金额。Data Bridge 较窄的 HPC 加速器口径将 2025 年该细分市场估为 $14.86B；Global Market Insights
              把更宽的 HPC 市场放在 2025 年 $43.5B；Mordor Intelligence 对 HPC 系统和服务的更宽口径则为 $55.78B。邻近 AI 加速器报告又大得多，Global Market
              Insights 估为 2025 年 $120.2B，Mordor 为 $140.55B。


              这些差距不一定互相矛盾，主要反映口径不同。有些发布方只统计加速器硬件，有些统计完整 HPC 系统、软件和服务，有些纳入超大规模 AI 硅片——后者在战略上有关联，但不直接等同于 NextSilicon
              近期目标。因此，最好的尽调姿态是保留多种视角，抵制虚假精确。只要采用跑通，这个市场显然足够大，能支撑风险投资级回报；但可用 SAM
              仍必须受工作负载匹配、采购摩擦、软件迁移风险和渠道触达约束，而不是引用能找到的最大 AI 数字。
