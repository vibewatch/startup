      - number: '7.2'
        title: 制造链暴露在代工、封装和地理风险下，NextSilicon 无法完全掌控
        blocks:
          - type: paragraph
            body: >-
              像大多数先进芯片初创公司一样，NextSilicon 在晶圆、封装、内存、板卡和系统集成上依赖 外部制造和供应链伙伴。这会带来普通初创公司风险，但在半导体里，所谓普通版本本身已经 很严峻。TSMC
              自己的公开报告强调地理集中、灾害规划、关键供应商管理，以及跨供应链主动 缓释风险的必要性。一家出货雄心勃勃加速器的无晶圆厂公司，等于继承了这些暴露，同时
              议价能力又低于超大规模云厂商或在位半导体巨头。链条任何一环收紧——代工产能分配、先进 封装、HBM、物流或公用事业连续性——初创公司都会先承受进度损害，而资产负债表还没有 多少空间吸收冲击。


              NextSilicon 追逐的客户类型会放大这个问题。国家实验室、研究中心和要求苛刻的 HPC 用户， 不会轻易容忍承诺系统延期，也不会接受组件替换改变性能特征。投资论点的一大优势是架构
              差异化；同样的差异化，在公司必须围绕替代组件或封装路径重做供应计划时，也可能降低 灵活性。因此，投资人不应把供应链风险当成泛泛的行业常数。对这家公司而言，它是决定
              收入节奏、客户背书能力和未来融资杠杆的核心执行变量之一。
