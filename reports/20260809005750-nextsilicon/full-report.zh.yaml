  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: NextSilicon 位于先进计算与跨境研究交汇处，出口管制和地缘政治风险不可忽视
        blocks:
          - type: paragraph
            body: >-
              先进计算周围的监管姿态已不再是静态背景噪音；它正在变成产品风险的一部分。美国先进计算 规则在 2026 年再次变化，实际效果是围绕谁可以买、谁控制实体、哪些软件和技术诀窍可以
              流动，以及供应商如何记录最终用途，不断抬高合规负担。NextSilicon 虽不是美国上市公司， 这一点仍然重要，因为前沿半导体项目与源自美国的设计工具、IP、合作伙伴生态和客户环境
              深度纠缠。即便公司面向看似友好的司法辖区销售，研究项目和全球渠道关系也可能带来许可 和筛查复杂度。


              以色列这一侧也不简单。公开官方来源显示，国防出口和民用两用监管各有渠道；2026 年的 法律评论还指向一个不断演进的民用两用管制草案框架。直接含义不是 NextSilicon 已有已知
              执法问题，而是合规必须比许多初创公司预期更早成熟。如果出口分类、客户筛查或技术转移 控制跟不上商业化节奏，公司可能恰好在最需要动能的地方丢时间：跨境旗舰账户、研究合作 和渠道伙伴关系。
