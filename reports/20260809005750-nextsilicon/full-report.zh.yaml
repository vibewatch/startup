      - number: '1.4'
        title: 规模快照、公开客户证据与仍未披露的内容
        blocks:
          - type: paragraph
            body: >-
              规模方面，公开证据方向正面但不精确。公司自撰发布材料称 NextSilicon 全球员工超过 300 人；Dealroom 公开预览映射出 376 名员工，Finder 将公司放在 201–500 人区间。官网
              about 页面也显示其地理覆盖横跨以色列、美国、欧洲、印度和澳大利亚。这些信号与一家真实运营组织相符，不像只有研究团队的隐身项目，尽管精确人数仍模糊。


              客户证据比许多硬件初创更强，但也集中。Sandia 的合作公告和 2026 年 1 月 Spectra 文章，给了 NextSilicon 比 logo 幻灯片有价值得多的东西：NNSA
              生态内一个具名、技术要求高、任务场景明确的部署。话虽如此，公司更广泛的商业表述仍停留在高层。发布材料提到数十家客户、在手订单，以及向金融、能源、制造、生命科学等垂直领域延伸，但公开记录没有具名商业账号和收入转化数据。因此，投资人应把
              Sandia 视为真实技术验证，而不是销售模型已经广泛去风险的充分证据。
