      - number: '4.3'
        title: 成本结构由硅片、集成与营运资本摩擦主导
        blocks:
          - type: paragraph
            body: >-
              公开材料强烈暗示，NextSilicon
              的单位经济性受制约的不是软件托管成本，而是经典半导体和系统商业化负担。采购经理招聘明确覆盖采购、发货、进出口、海关、货运代理、关税和库存预算管理。公司的供应商条款要求供应商遵守交付日期、保修和合规纪律；TSMC
              自身财务披露则说明，支撑上游供应链的是大规模资本、制程集中和先进节点经济性。即便 NextSilicon 仍是 fabless，也会通过晶圆获取、封装、HBM 采购、物流和验证周期承接这个生态的商业后果。


              成本图景也不只芯片成本。Sandia
              和合作伙伴证据显示，产品依赖融入液冷或高功率系统环境、应用移植支持，以及与客户团队的技术协作。这些活动能加深账号粘性，但也会引入服务交付成本，并拉长从工程投入到确认收入之间的周期。换言之，公司可能拥有溢价技术定位，但大概率仍背着硬件式营运资本画像，上面再叠加软件式主张。公开来源没有揭示其最终毛利率会更像专用硅片、集成系统，还是两者混合。
