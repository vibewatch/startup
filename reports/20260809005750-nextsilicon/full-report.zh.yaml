              公开证据显示出相当一致的客户旅程。第一步是识别工作负载并做技术评估：基准测试、代码移植和架构匹配分析。随后是与伙伴或研究团队做系统认证或 hackathon
              式启用。之后叙事才转向部署、验收和更广泛运营使用。Sandia、ParTec 的 ZIB 工作，以及公司自身客户支持和售前招聘中都能看到这条路径。ODISSEE 的上手式服务器交付和技术协作模型里也能看到。


              这意味着采用轨迹真实存在，但它大概比常规基础设施销售更慢、更咨询式。每一步似乎都需要公司和客户投入实质技术劳动。这种动态不一定是缺陷——早期前沿基础设施几乎总是这样销售——但它解释了为什么公开证据能在技术细节上很深，却在客户数量规模上仍薄。企业可以拥有重要客户，却还没有很多客户；当前公开证据更强地指向这个模式，而不是广泛放量扩张故事。
