tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to NextSilicon
  rows:
  - - Narrow HPC accelerator market
    - Accelerator cards or modules used for HPC workloads, including GPU, FPGA, CPU-accelerator, and ASIC alternatives
    - General servers, cloud services, software, storage, and consumer AI devices
    - Research centers, defense labs, enterprise R&D, advanced industrial users
    - Best direct market proxy because it maps to the hardware decision NextSilicon is trying to influence
  - - Broader HPC market
    - Systems, software, services, storage, networking, and supporting infrastructure for HPC deployments
    - Commodity enterprise IT and unrelated AI software spend
    - National labs, universities, hyperscalers, enterprises, governments
    - Useful backdrop because customers often buy full platforms, not isolated chips
  - - AI accelerator chips market
    - Training and inference accelerators across hyperscale, enterprise, edge, and vertical silicon programs
    - Non-accelerated compute and much of traditional HPC software/services
    - Hyperscalers, OEMs, cloud operators, enterprise AI buyers, device makers
    - Important strategic adjacency, but materially broader than the company’s immediate serviceable pool
  - - Cloud HPC services
    - Elastic compute, storage, and networking sold as managed or self-managed HPC capacity in the cloud
    - Owned on-prem hardware budgets and some air-gapped sovereign systems
    - Cloud providers and customers renting burst compute
    - Both substitute and complement because it can delay hardware purchases while also widening workload experimentation
  - - Sovereign / national-lab supercomputing
    - Mission-specific exascale and advanced-prototype systems funded by governments or research consortia
    - Commercial SMB compute and generic enterprise AI appliances
    - Program offices, ministries, labs, public research agencies
    - High fit for early proof because these buyers fund frontier architecture evaluation
  - - Status-quo incumbent procurement
    - Refresh cycles for NVIDIA, AMD, Intel, and conventional CPU/GPU clusters
    - Novel-architecture premiums not yet approved
    - Infrastructure leads, procurement committees, workload owners
    - This is the practical default against which NextSilicon must displace buying behavior
  notes: Definitions preserve separate layers so broad AI-silicon estimates are not mistaken for direct addressable demand.
