  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: A customer-level SAM cut that adjusts the broad accelerator market for workload fit, procurement authority, migration readiness, and deployment timing.
    whyItMatters: Without a constrained SAM, broad TAM figures can overstate what NextSilicon can reasonably sell into in the next several years.
    diligencePath: Request pipeline segmentation by buyer class, workload family, and expected pilot-to-production timing, then map those accounts onto the narrower accelerator market.
    relatedQuestionRefs:
    - QM022
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: Named procurement authorities, program budgets, and budget cycles for public or commercial accounts evaluating Maverick-2.
    whyItMatters: The buyer, user, and payer often differ in HPC procurement, and unclear budget ownership can materially lengthen sales cycles.
    diligencePath: Ask management for at least five active opportunities with named buyer, user, payer, and budget owner mapped explicitly.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: independent-benchmarks
    missingEvidence: Independent benchmark packs that show how representative customer applications perform on Maverick-2 versus incumbent alternatives.
    whyItMatters: Market demand is not enough if buyers cannot verify performance, portability, and energy outcomes on real workloads.
    diligencePath: Request Sandia or third-party benchmark readouts, external bakeoff results, and workload-level migration case studies.
    relatedQuestionRefs:
    - QM016
    - QM022
    - QM025
