  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AI and HPC convergence
    - positive
    - now
    - Expands compute demand and raises interest in heterogeneous architectures
    - Which target workloads truly benefit from runtime-adaptive hardware rather than newer GPUs?
  - - Simulation, digital twins, and scientific complexity
    - positive
    - now
    - Increases demand from engineering, research, and public-science programs
    - Which named verticals have moved beyond pilots to production spending?
  - - Sovereign and national-lab compute programs
    - positive
    - now
    - Creates early-adopter accounts willing to test novel architecture
    - How repeatable is the Sandia-style path across other programs or geographies?
  - - Cloud HPC availability
    - mixed
    - now
    - Lowers experimentation friction but can reduce urgency to buy new hardware
    - Does cloud access help or delay commercial conversion for target customers?
  - - Power-density and cooling pressure
    - mixed
    - now
    - Makes efficiency a board-level issue but also increases deployment conservatism
    - Do independent customer workloads show a meaningful perf-per-watt advantage?
  - - HBM, advanced-packaging, and leading-node supply constraints
    - negative
    - now
    - Can delay challenger shipments and favor vendors with secured supply
