companyProfile:
  summary: >-
    NextSilicon is an Israeli private compute-hardware company founded in 2017 to commercialize a novel
    dataflow-oriented accelerator architecture for high-performance computing and adjacent demanding workloads.
    Public evidence is strongest on Maverick-2's differentiated architecture, Sandia's Vanguard-linked Spectra
    deployment, and meaningful late-stage fundraising. Public evidence is weakest on economic disclosure,
    customer diversification, supply-chain detail, and the exact structure behind the company's latest valuation.
  foundedDate: '2017-08-07'
  founders:
    - name: Elad Raz
      role: Founder and CEO
      background: Public sources identify Raz as the founder-CEO and the dominant external spokesperson for NextSilicon.
      claimRefs: [CO003, CO041]
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel
  productSummary: >-
    NextSilicon's core offer is Maverick-2, an intelligent compute accelerator platform built around a
    runtime-adaptive dataflow-style architecture and surrounding software stack for demanding HPC and
    compute-intensive workloads.
  customerFocus: >-
    Research labs, sovereign and defense HPC programs, European scientific-computing environments, and technical
    enterprise buyers with complex simulation, sparse, graph, or power-constrained compute needs.
  businessModel: >-
    Hardware platform sales, systems integration through partners, and associated software / enablement / support
    engagements; detailed pricing and margin structure remain undisclosed publicly.
  stage: Series C
  fundingStatus: >-
    Public sources support roughly $303M of cumulative funding and indicate late-stage private valuation marks in
    the ~$1.5B-$1.6B range, but exact round chronology and valuation structure remain partly dependent on
    secondary reporting.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO020, CO041, CE001, CE011, CU014, CI001, CV030, CV032]
