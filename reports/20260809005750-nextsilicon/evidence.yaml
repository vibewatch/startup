evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current public board roster, committee structure, and independent governance disclosures.
    whyItMatters: Leadership concentration and investor control cannot be fully assessed without current board visibility.
    diligencePath: Request the current board list, observer rights, and any governance deck from management or investors.
    relatedQuestionRefs:
      - QO004
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-chronology
    missingEvidence: A reconciled round-by-round capitalization history covering 2020 through the 2024 raises.
    whyItMatters: >-
      Open sources disagree on 2024 round labels and some older databases still stop at the 2021 round, which weakens
      confidence in chronology and investor participation details.
    diligencePath: >-
      Obtain a cap-table or financing summary from management and reconcile it with proprietary databases such as
      PitchBook.
    relatedQuestionRefs:
      - QO008
      - QO011
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-customers
    missingEvidence: Named commercial customers, deployment status, contract size, and renewal evidence outside Sandia/NNSA.
    whyItMatters: >-
      The current public proof set may not translate into repeatable commercial demand, especially for enterprise and
      hyperscaler buyers.
    diligencePath: >-
      Ask for a customer reference list, pilot-to-production funnel, and at least three customer calls outside the
      federal-lab ecosystem.
    relatedQuestionRefs:
      - QO018
      - QO023
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-visibility
    missingEvidence: >-
      Revenue, backlog quality, order conversion, and gross-margin visibility tied to the 2024–2026 commercialization
      push.
    whyItMatters: Funding scale alone does not show whether the company is turning technical validation into durable economics.
    diligencePath: Request booked revenue, backlog composition, shipment timing, and margin assumptions by product form factor.
    relatedQuestionRefs:
      - QO017
      - QO024
  - type: missing-source
    severity: minor
    topic: independent-benchmarks
    missingEvidence: Third-party benchmark results or workload-level validation outside company-selected comparisons.
    whyItMatters: >-
      Company claims are directionally useful, but underwriting market acceptance needs external proof on representative
      workloads.
    diligencePath: Request Sandia benchmark readouts, third-party bakeoff data, or independent analyst validation for key workloads.
    relatedQuestionRefs:
      - QO019
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-investor-coverage
    missingEvidence: A more exhaustive public list of leadership bios and investor stakes beyond the names visible in open sources.
    whyItMatters: >-
      Enumeration tables in this chapter are intentionally partial because exact ownership and full leadership depth are
      not fully public.
    diligencePath: >-
      Use management-provided bios and financing documents to convert the current partial tables into exhaustive
      records.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: >-
      A customer-level SAM cut that adjusts the broad accelerator market for workload fit, procurement authority,
      migration readiness, and deployment timing.
    whyItMatters: >-
      Without a constrained SAM, broad TAM figures can overstate what NextSilicon can reasonably sell into in the next
      several years.
    diligencePath: >-
      Request pipeline segmentation by buyer class, workload family, and expected pilot-to-production timing, then map
      those accounts onto the narrower accelerator market.
    relatedQuestionRefs:
      - QM022
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owners
    missingEvidence: >-
      Named procurement authorities, program budgets, and budget cycles for public or commercial accounts evaluating
      Maverick-2.
    whyItMatters: >-
      The buyer, user, and payer often differ in HPC procurement, and unclear budget ownership can materially lengthen
      sales cycles.
    diligencePath: >-
      Ask management for at least five active opportunities with named buyer, user, payer, and budget owner mapped
      explicitly.
    relatedQuestionRefs:
