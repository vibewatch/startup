  topStrengths:
    - >-
      NextSilicon has genuine product differentiation around Maverick-2 and a runtime-adaptive architecture rather than
      a generic accelerator pitch.
    - Sandia's Spectra acceptance provides unusually strong flagship proof for a private HPC chip startup.
    - >-
      The company has raised meaningful capital and remains positioned in a strategic compute category where scarce
      technical assets can command premium investor attention.
    - European and research-program evidence suggests the architecture resonates beyond one isolated lab environment.
  topRisks:
    - >-
      Revenue, gross margin, backlog, and retention remain undisclosed, so valuation underwriting is still
      narrative-heavy.
    - >-
      NVIDIA-led ecosystem dominance and incumbent software depth can slow adoption even if the chip is technically
      compelling.
    - >-
      Foundry, packaging, and supply-chain dependence create schedule and commercialization risk that the company cannot
      fully control.
    - >-
      The named public customer base remains narrow, increasing concentration risk and making each flagship deployment
      disproportionately important.
    - Export-control and cross-border compliance complexity could become a friction point as commercialization broadens.
  unresolvedGaps:
    - Current revenue, backlog, gross margin, burn, and cash-runway detail by major customer segment.
    - Customer-level deployment map distinguishing pilots, accepted systems, production use, and repeat-order history.
    - >-
      Round terms, liquidation preferences, secondary mix, and cap-table structure behind the latest private valuation
      marks.
    - Supply-chain resilience detail including foundry allocation, packaging plan, and contingency procedures.
    - Export-classification and compliance workflow for cross-border customer and partner engagements.
