  topStrengths:
    - NextSilicon 围绕 Maverick-2 和运行时自适应架构形成了真实产品差异化，而不是泛泛的加速器叙事。
    - Sandia 的 Spectra 验收，为一家私营 HPC 芯片初创公司提供了罕见扎实的旗舰证明。
    - 公司已融到可观资本，仍处在战略计算赛道；稀缺技术资产能吸引溢价投资人关注。
    - 欧洲和研究项目证据显示，该架构的吸引力不止一个孤立实验室。
  topRisks:
    - 收入、毛利率、积压订单和留存未披露，估值承销仍偏叙事。
    - NVIDIA 主导的生态和既有软件深度，即使芯片技术上有吸引力，也会拖慢采用。
    - 晶圆代工、封装和供应链依赖带来进度与商业化风险，公司无法完全控制。
    - 公开具名客户群仍窄，集中度风险更高，每个旗舰部署的重要性也被放大。
    - 商业化扩张后，出口管制和跨境合规复杂度可能成为摩擦点。
