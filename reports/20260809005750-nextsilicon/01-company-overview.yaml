company:
  name: NextSilicon
chapter:
  number: 1
  title: Company Overview
  summary: NextSilicon is a late-stage Israeli HPC chip startup centered on Maverick-2, a runtime-adaptive accelerator architecture that finally moved from stealth narrative to named national-lab deployment in 2024-2026. The strongest public evidence is the Sandia/NNSA Vanguard relationship and roughly $303 million of disclosed cumulative funding, while the weakest areas remain reconciled financing chronology, named commercial customers, revenue disclosure, and governance transparency.
sections:
- id: identity-and-product
  title: Identity, Founding Baseline, and What the Company Sells
  body: 'NextSilicon is best understood as an Israeli high-performance-computing chip company trying to replace the fixed-architecture assumptions of CPUs and GPUs with a runtime-adaptive accelerator. Across Dealroom, Tracxn, Finder, and investor material, the common baseline is that the company was founded in 2017 and is headquartered in the Tel Aviv area, even though some company-authored material uses 2018 language that likely reflects operating buildout rather than legal incorporation. The company remains private and late stage, and its public presentation centers overwhelmingly on one product family rather than a broad portfolio.


    That product family is Maverick-2, which NextSilicon describes as an Intelligent Compute Accelerator built on Intelligent Compute Architecture. The pitch is not simply that Maverick-2 is faster, but that it observes applications in runtime, identifies critical code paths, and reshapes how the hardware executes them. This matters because NextSilicon is selling reduced porting friction as much as raw silicon: support for common HPC languages and frameworks is positioned as the core adoption wedge against fixed GPU ecosystems. Arbel, the server-class RISC-V CPU the company now markets alongside Maverick-2, strengthens the impression that NextSilicon wants to own more of the compute stack over time, not just a niche accelerator slot.'
  claimRefs:
  - CO001
  - CO002
