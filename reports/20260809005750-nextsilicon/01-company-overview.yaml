- id: scale-and-proof
  title: Scale Snapshot, Public Customer Proof, and What Still Is Not Disclosed
  body: 'On scale, the public evidence is directionally positive but imprecise. Company-authored launch material says NextSilicon has over 300 employees globally, while Dealroom’s public preview maps 376 employees and Finder places the company in a 201–500 range. The official about page also shows a broad geographic footprint across Israel, the United States, Europe, India, and Australia. Those signals are consistent with a real operating organization rather than a research-only stealth team, even if the exact headcount remains fuzzy.


    Customer proof is stronger than for many hardware startups, but it is also concentrated. Sandia’s partnership announcement and January 2026 Spectra article give NextSilicon something materially more valuable than a logo slide: a named, technically demanding, mission-relevant deployment inside the NNSA ecosystem. That said, the company’s broader commercial claims remain high level. Launch material references dozens of customers, backlog, and vertical reach into finance, energy, manufacturing, and life sciences, yet named commercial accounts and revenue conversion data are absent from the public record. Investors should therefore treat Sandia as genuine technical validation, but not as sufficient evidence that the sales model is already broadly de-risked.'
