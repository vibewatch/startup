- id: milestones-and-watchpoints
  title: Milestones Since Founding and the Main Watchpoints Heading into 2026
  body: 'The milestone pattern is unusually compressed for a semiconductor company. Public records show legal formation in 2017, a large 2021 round that established unicorn-style expectations, an August 2023 Israel Innovation Authority consortium signal, the May 2024 Sandia partnership, and then a very public October 2024 emergence from stealth around Maverick-2. By late 2025 the company had shifted into a new phase of external messaging centered on awards, benchmark publicity, and ecosystem partners. The January 2026 Spectra story matters most because it moves the narrative from promise to actual deployed silicon in a national-security prototype environment.


    The remaining watchpoints are straightforward. First, investors need clearer proof that performance claims travel beyond company-selected workloads and into repeatable customer value. Second, they need evidence that commercial buyers outside Sandia and related labs are converting from interest to production spend. Third, they need a reconciled capital and governance package so the company can be judged as an operating business, not just a compelling architecture thesis. The public evidence says NextSilicon has crossed the “serious company” threshold; it does not yet say commercialization risk has disappeared.'
