              Public evidence suggests a fairly consistent customer journey. First comes workload identification and
              technical evaluation: benchmarking, code porting, and architectural fit analysis. Next comes system
              qualification or hackathon-style enablement with partners or research teams. Only after that does the
              story shift into deployment, acceptance, and broader operational use. That path is visible at Sandia, in
              ParTec’s ZIB work, and in the company’s own customer-support and pre-sales hiring. It is also visible in
