  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Set Is Wider Than “Other Chip Startups”
        blocks:
          - type: paragraph
            body: >-
              The competitive lens has to start with the job the buyer is trying to solve, not with a list of startups.
              For NextSilicon, that job is accelerated compute for difficult HPC and adjacent AI workloads. Buyers can
              solve it with incumbent merchant platforms from NVIDIA, AMD, and Intel; with captive hyperscaler silicon
              like Google TPU or AWS Trainium when the workload can move into those environments; with purpose-built
              inference challengers such as Groq, SambaNova, and d-Matrix; with large-model specialists such as
              Cerebras; or by simply refreshing existing CPU and GPU estates while using cloud burst capacity.


              That framing matters because some of these competitors are direct rivals and others are substitutes that
              win by removing the need for a new merchant accelerator purchase at all. NextSilicon’s public story is
              most directly differentiated against fixed GPU assumptions and porting pain, but the company still has to
              clear multiple other hurdles: proof that its architecture really beats incumbent economics on target
              workloads, proof that software migration is easier than feared, and proof that customers want a new
              hardware category badly enough to disrupt familiar procurement patterns.
