      - number: '3.2'
        title: Incumbents Still Own the Installed Base, the Software Stack, and the Default Buying Motion
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows that the heaviest gravitational pull still belongs to incumbent and hyperscaler
              platforms. NVIDIA’s HGX stack combines GPUs, CPUs, networking, and software in a way designed to maximize
              application performance across large data centers. AMD positions MI350 as an AI and HPC accelerator that
              can slot into existing racks with a unified enterprise software stack, and Intel frames Gaudi around open
              Ethernet scaling and easier GPU migration. Top500, ORNL, and HPE together reinforce the same structural
              point: leadership-class deployed supercomputing is still dominated by established OEM, CPU, and GPU
              ecosystems with deep supply and support capacity.


              That matters more than headline benchmark claims. Even if a novel architecture is technically elegant, it
              still starts from an installed-base deficit. Buyers already understand how to staff, cool, schedule, and
              support incumbent clusters. Procurement teams know the counterparties, and developers know the toolchains.
              NextSilicon is therefore competing against vendor familiarity, not only against silicon performance. That
              is the core reason why “better architecture” is not enough by itself to win broad adoption quickly.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP014
              - CP016
              - CP019
              - CP027
              - CP029
              - CP038
