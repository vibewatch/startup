      - number: '7.4'
        title: Partner Dependence, Long Sales Cycles, and Thin Public Customer Breadth Compound Execution Risk
        blocks:
          - type: paragraph
            body: >-
              NextSilicon’s go-to-market appears to rely heavily on technically intensive selling and on third parties
              that help assemble, deliver, or extend the product. Penguin is visible in Sandia, ParTec in Europe, and
              Cornelis in networking-oriented reference architectures. Those partnerships are helpful, but they also
              mean part of the customer experience sits outside the company’s direct control. A delayed integrator, a
              misaligned OEM incentive, or a partner strategy shift can all slow conversion. The result is that the
              commercial path is more fragile than a simple direct-hardware-sales story suggests.


              The thinness of the public customer roster magnifies that fragility. When the visible base is small, each
              flagship account does triple duty: reference customer, technical validator, and credibility signal for the
              next sale. That raises concentration risk and makes long evaluation cycles more dangerous. A company can
              be technically right and still lose time, and in frontier hardware time converts directly into burn. The
              customer chapter already showed that retention, repeat orders, and expansion are mostly unproven in public
              sources; viewed through a risk lens, that means investors are underwriting future proof rather than
              present proof on several core commercial durability questions.
            claimRefs:
              - CR026
