      - number: '8.2'
        title: >-
          Comparable Companies Show That AI/HPC Silicon Can Win Very Large Marks, but Most Better-Valued Peers Have
          Broader Proof or Cleaner Disclosure
        blocks:
          - type: paragraph
            body: >-
              The comparable set is informative but slippery. Public leaders such as NVIDIA, AMD, Intel, and TSMC are
              not direct valuation comps for a pre-IPO private startup, yet they are relevant because they define the
              magnitude of incumbent scale, ecosystem depth, and capital intensity in this market. Private peers such as
              Cerebras, Groq, SambaNova, and Tenstorrent are closer conceptually because they combine novel
              architectures, heavy capital needs, and strategic optionality. Their reported valuations show that the
              market will pay aggressively for AI/HPC silicon exposure when investors believe the company has scarce
              technical assets, a credible route to deployment, or momentum around AI infrastructure demand.


              The catch is that several of those peers either disclose more operating data, have clearer category
              positioning, or benefit from stronger AI-tailwind narratives than NextSilicon currently does in public.
              NextSilicon’s public customer proof is real but narrow; its strongest public references are in advanced
              HPC and sovereign-science contexts, not in a broad AI inference or hyperscaler deployment story. That does
              not mean the company deserves a low value. It means direct peer comparisons should be used as
              outer-boundary context, not as permission to assume any premium private mark is automatically justified. A
              company can belong to a hot category and still be expensive relative to its visible proof base.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: table
