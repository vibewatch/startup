  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: The Right Market Is Narrower Than “All AI Chips”'
        blocks:
          - type: paragraph
            body: >-
              The first diligence task is to define what market NextSilicon is actually entering before quoting any
              market-size number. Broad AI accelerator reports capture hyperscaler training and inference spend, edge
              devices, and application-specific silicon programs that are much larger than NextSilicon’s immediate buyer
              pool. By contrast, the narrower HPC-accelerator lens tracks the subset of compute spend tied to scientific
              simulation, research computing, defense, industrial engineering, and other parallel workloads where
              accelerator choice is shaped by precision, bandwidth, and operating efficiency.


              That narrower framing fits the company’s public positioning. NextSilicon consistently markets Maverick-2
              around HPC and difficult AI/HPC convergence workloads, not around commodity cloud inference. The market
              also has a clear status-quo substitute set: buyers can stay with incumbent NVIDIA, AMD, and Intel
              platforms; they can rent cloud HPC instead of buying new architecture; or they can postpone migration and
              keep CPU or GPU estates in place. The practical conclusion is that adjacent AI-silicon growth matters
              strategically because it strengthens incumbents and raises customer expectations, but it should not be
              confused with NextSilicon’s direct serviceable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM020
              - CM031
              - CM039
              - CM040
