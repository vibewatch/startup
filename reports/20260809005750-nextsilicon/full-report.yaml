            body: >-
              NextSilicon does surface some trust and quality language, but it is mostly indirect. The company’s
              purchasing agreements require suppliers to comply with export controls, maintain licenses and permits, and
              support quality-management and information-security programs aligned with ISO 9001 and ISO 27001 or
