      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Channel Power Define the Real Battle
        blocks:
          - type: paragraph
            body: >-
              Competitive advantage in this market is not just compute throughput; it is the ability to lower switching
              cost without requiring buyers to bet their entire workflow on one novel platform. NextSilicon explicitly
              attacks that problem by promising support for common HPC languages and by positioning Maverick-2 as a path
              around vendor lock-in. XPU.pub strengthens the point by arguing that the company is trying to solve the
              subset of HPC workloads that are poorly served when vendors optimize increasingly for low-precision AI.


              Even so, buyers can multi-home. They can keep existing GPU clusters for most work, rent TPUs or Trainium
              for cloud AI experiments, use specialized inference services where token economics matter, and test new
              accelerators only on a narrow workload slice. That reduces the urgency to switch wholesale. It also means
              channel access becomes critical. NextSilicon’s public partner set — including Penguin, Dell, and ParTec —
              matters because it provides integration and delivery paths that the company could not build alone. But
              those channels are still visibly lighter than the broad OEM, cloud, and developer distribution enjoyed by
              the largest incumbents.
            claimRefs:
