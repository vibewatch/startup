      - - Compliance / supply friction surfaces
        - Material delays tied to export or manufacturing chain
        - Raises downside probability
        - Increase discount and require mitigation proof
      - - Partner-owned customer relationship
        - Management cannot map buyer / integrator / revenue owner cleanly
        - Lowers quality of pipeline and concentration insight
        - Cut conviction
    notes: These are valuation-specific kill triggers, not generic company-health checks.
    claimRefs:
      - CV028
      - CV029
      - CV034
      - CV035
      - CV036
