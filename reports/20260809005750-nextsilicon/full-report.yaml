  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: The Public Revenue Model Looks Like Hardware Plus Services, Not a Clean SaaS Stream
        blocks:
          - type: paragraph
            body: >-
              NextSilicon’s public commercial footprint points to a mixed monetization model rather than to a single
              recurring-software stream. The company’s sales-operations posting says the revenue team must manage
              hardware-and-software bundles, bill-of-materials accuracy, split revenue, distributor and channel
              management, and the full path from lead generation to cash collection. That language is consistent with a
              semiconductor company that sells systems or accelerator modules, wraps them in partner-delivered
              integration, and then attaches software, support, and field-engineering work where necessary. It is not
              consistent with a simple self-serve subscription model.


              The same pattern shows up in customer-facing roles. NextSilicon’s pre-sales and customer-solutions
              openings emphasize proof-of-concepts, code porting, benchmarking, application support, and direct work
              with governmental, academic, and commercial users. That implies revenue recognition and gross-margin
              profiles may differ by deal: some value likely lands in hardware shipment, some in engineering assistance,
              and some in longer support relationships. Public evidence is strong enough to describe the motion, but not
              strong enough to measure realized average selling prices, software attach rates, service mix, or the
              degree to which recurring support revenue can offset inherently lumpy hardware sales.
