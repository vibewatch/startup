companyProfile:
  summary: >-
    NextSilicon is an Israeli private compute-hardware company founded in 2017 to commercialize a novel
    dataflow-oriented accelerator architecture for high-performance computing and adjacent demanding workloads. Public
    evidence is strongest on Maverick-2's differentiated architecture, Sandia's Vanguard-linked Spectra deployment, and
    meaningful late-stage fundraising. Public evidence is weakest on economic disclosure, customer diversification,
    supply-chain detail, and the exact structure behind the company's latest valuation.
