      - number: '1.3'
        title: Funding History, Investor Base, and Where the Public Record Gets Messy
        blocks:
          - type: paragraph
            body: >-
              The broad funding story is strong even when the public chronology is not perfectly clean. NextSilicon’s
              October 2024 launch release said the company had raised $303 million from a recognizable venture syndicate
              that included Aleph, Amiti, Playground Global, Third Point Ventures, Liberty-related capital, StepStone,
              and Standard Investments. Finder’s March 2026 profile corroborates a very similar total at $302.6 million
              across five rounds and ties the latest reported step-up to an October 2024 $100 million financing at a
              $1.6 billion valuation.


              The problem is that several older open databases still stop at the June 2021 $120 million round and
              therefore understate current funding. Signalbase adds a June 2024 $200 million raise but labels it
              differently than the user-provided chronology and other profiles. The practical takeaway is not that the
              company is underfunded; it is that round naming and sequencing remain noisy in open sources. For
              underwriting, the conservative position is to accept the roughly $303 million cumulative total as the most
              supportable current figure while flagging the exact 2024 round labels, investor allocations, and
              preference stack as diligence items rather than cleanly public facts.
            claimRefs:
