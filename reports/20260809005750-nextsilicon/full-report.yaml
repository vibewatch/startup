      - number: '3.3'
        title: The Challenger Pack Is Real but Fragmented, and Most of It Leans More AI Than HPC
        blocks:
          - type: paragraph
            body: >-
              The non-incumbent field is crowded, but it is not homogeneous. Cerebras emphasizes wafer-scale training
              and inference for very large AI workloads. Groq, SambaNova, and d-Matrix all lean into inference
              economics, throughput, or latency, often with cloud or appliance delivery rather than a classic
              HPC-merchant-card story. Graphcore remains architecturally interesting, but its public product messaging
              still centers on the IPU concept and older system generations, which suggests a weaker present-day
              commercial posture than the most aggressive AI-infrastructure challengers.


              That fragmentation is strategically important for NextSilicon. It means the company does not face one
              perfectly aligned startup rival with equal HPC portability claims, equal national-lab proof, and equal
              partner support. But it also means customer mindshare is split across many “alternatives to GPUs”
              narratives, most of which are framed around AI training or inference rather than classical HPC code.
              NextSilicon’s HPC-first, no-rewrite argument is therefore differentiated, but it is differentiated inside
              a noisy market where many challengers are also promising efficiency, speed, openness, or lower cost.
            claimRefs:
