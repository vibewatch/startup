  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The Delivered Product Is a Compute Platform, Not Just a Chip
        blocks:
          - type: paragraph
            body: >-
              NextSilicon is not selling a bare semiconductor in isolation. The public record describes a broader
              compute platform built around Maverick-2 accelerators, a runtime and compiler layer, developer tools,
              customer engineering support, and partner-led integration into system form factors such as PCIe cards and
              OAM-based servers. The strongest public proof of what is actually delivered comes from Sandia’s Spectra
              system, where Maverick-2 is deployed inside a 64-node prototype platform designed to run mission workloads
              such as HPCG, LAMMPS, and SPARTA. That is meaningfully more concrete than a roadmap-only accelerator
              story.


              The product should therefore be read as a stack that begins with dataflow silicon but only becomes usable
              through translation, telemetry, support tooling, and system-level qualification. The company’s own
              pre-sales, AI-libraries, and customer-solutions roles reinforce that interpretation by emphasizing code
              porting, benchmarking, low-level kernel work, profiling, and end-user support across scientific and AI
              workloads. Buyers are not merely adopting a device; they are adopting a new execution model that needs
              compilers, diagnostics, and services to make the hardware legible and trustworthy in production-like
              environments.
            claimRefs:
