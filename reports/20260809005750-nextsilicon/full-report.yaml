              This means the adoption trajectory is real, but it is probably slower and more consultative than a
              conventional infrastructure sale. Each step appears to require meaningful technical labor from both the
              company and the customer. That dynamic is not necessarily a flaw — early frontier infrastructure almost
              always sells this way — but it explains why public proof can be deep on technical detail and still thin on
              customer-count scale. The business can have important customers without yet having many customers, and the
