      - number: '2.2'
        title: 'Sizing Lenses: Real Growth, Wide Dispersion, and No Single Clean TAM'
        blocks:
          - type: paragraph
            body: >-
              Retained public sizing sources support strong market growth but not a single consensus dollar figure. Data
              Bridge’s narrower HPC-accelerator lens puts the segment at $14.86 billion in 2025, while Global Market
              Insights places the broader HPC market at $43.5 billion in 2025 and Mordor Intelligence places a still
              broader HPC systems-and-services view at $55.78 billion. Adjacent AI accelerator reports are much larger
              again, with Global Market Insights at $120.2 billion in 2025 and Mordor at $140.55 billion.


              Those gaps are not necessarily contradictions; they mostly reflect scope. Some publishers count only
              accelerator hardware, some count full HPC systems, software, and services, and some count hyperscaler AI
              silicon that is strategically relevant but not directly equivalent to NextSilicon’s near-term target.
              Because of that scope dispersion, the best diligence posture is to preserve multiple lenses and resist
              false precision. The market is clearly large enough to support a venture-scale outcome if adoption works,
              but a usable SAM still has to be constrained by workload fit, procurement friction, software migration
              risk, and channel access rather than by citing the largest available AI number.
