        title: The Public Customer Base Skews Toward Sophisticated Research Buyers, Not Broad Enterprise Breadth
        blocks:
          - type: paragraph
            body: >-
              The visible buyer profile is narrower and more technically demanding than a generic enterprise
              infrastructure customer set. Named public proof clusters around national-security computing, research
              supercomputing, and European science infrastructure rather than around a long list of commercial
              enterprises. Sandia’s Vanguard program is the clearest anchor: it uses Maverick-2 in a tri-lab
              national-security context where the buyer values FP64-heavy workloads, architecture experimentation, and
              reduced porting friction. Zuse Institute Berlin and the ODISSEE project reinforce the same pattern from
              the European side, pointing toward sovereign or publicly funded scientific-computing environments willing
              to tolerate more novelty than a mainstream enterprise IT buyer.


              At the same time, the company’s field roles show a broader ambition. Pre-sales and customer-solutions
              postings mention government, academic, finance, manufacturing, engineering, weather, graph, and AI
              workloads. That tells us who the company wants to sell to, and likely where it is prospecting. It does not
              prove that all of those segments have converted into paying, repeat, production customers. The current
              evidence therefore supports a segmented view: strong fit with research and sovereign HPC early adopters,
              plausible reach into technical enterprise verticals, and still-thin public proof of wide commercial
              penetration.
