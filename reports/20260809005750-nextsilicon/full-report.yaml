      - number: '1.2'
        title: Founders, Leadership, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Elad Raz is the dominant public face of NextSilicon. The company’s own about page, outside interviews, and
              partner commentary all present him as founder and CEO, and the retrieved open-source record gives him
              disproportionate narrative weight relative to the rest of the management bench. Aleph’s company page adds
              a second publicly visible founder, Eyal Nagar, identified as co-founder and EVP of research and
              development. Beyond those two, open-source visibility falls off quickly. Kelly Marquardt appears in
              Sandia’s 2024 partnership announcement as a NextSilicon business-development executive, but a current
              board roster, full executive lineup, and committee structure were not available in the retrieved public
              materials.


              That asymmetry matters for diligence. The company may well have deeper bench strength internally, but the
              public record still suggests key-person concentration around Raz’s vision, customer messaging, and
              fundraising narrative. It also means governance quality is harder to underwrite than the product story.
              Investors and management should be able to close that gap easily in a diligence room, but until they do,
              public evidence supports a view of strong founder leadership paired with relatively thin third-party
              governance transparency.
            claimRefs:
              - CO003
              - CO004
              - CO041
