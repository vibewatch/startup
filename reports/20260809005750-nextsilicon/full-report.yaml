  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: >-
          Export-Control and Geopolitical Risk Is Material Because NextSilicon Sits at the Intersection of Advanced
          Compute and Cross-Border Research
        blocks:
          - type: paragraph
            body: >-
              The regulatory posture around advanced computing is no longer static background noise; it is becoming part
              of the product risk itself. U.S. advanced-computing rules changed again in 2026, and the practical effect
              is to keep raising the compliance burden around who can buy, who controls an entity, what software and
              know-how can move, and how vendors document end use. That matters to NextSilicon even though it is not a
              U.S. public company, because leading-edge semiconductor programs are deeply entangled with U.S.-origin
              design tools, IP, partner ecosystems, and customer environments. Research programs and global channel
              relationships can therefore create licensing and screening complexity even when the company is selling
              into seemingly friendly jurisdictions.


              The Israeli side is not simple either. Public official sources show separate defense-export and civilian
              dual-use oversight channels, and legal commentary in 2026 points to an evolving draft framework for
              civilian dual-use controls. The direct implication is not that NextSilicon faces a known enforcement
              issue; it is that compliance must be mature earlier than many startups expect. If export classification,
              customer screening, or technology-transfer controls lag the pace of commercialization, a company can lose
              time exactly where it most needs momentum: on flagship accounts, research collaborations, and channel
              partnerships that cross borders.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
