              Public deployment evidence is now substantial enough to move the product beyond the prototype-only
              category. Sandia’s partnership pages and NextSilicon’s acceptance announcement show that Spectra reached
              system acceptance under the Vanguard program, while ParTec publicly describes Zuse Institute Berlin as the
              first European customer for Maverick-2. ODISSEE and CORDIS additionally place NextSilicon inside a
              multi-party European research initiative focused on exabyte-scale scientific workloads. This is a stronger
              deployment record than many novel-architecture startups ever achieve.


              But the same record also reveals dependency concentration. System integration at Sandia runs through
              Penguin. European delivery runs through ParTec. Future network validation runs through Cornelis.
              Scientific-program credibility comes from a small number of marquee research environments. That dependency
