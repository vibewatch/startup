- id: retention-and-concentration
  title: Retention, Expansion, and Satisfaction Are Mostly Unproven Outside Continued
    Public Visibility
  body: |-
    This is the weakest part of the public customer record. No retained source discloses NRR, GRR, churn, contract duration, renewal rates, expansion revenue, or repeat-order cadence. Even named-customer quotes mostly validate technical relevance, not financial durability. The best proxy for retention is continued visibility: Sandia has moved from initial partnership to deployed system to formal acceptance, and ODISSEE has moved from consortium participation to delivered hardware and ongoing technical collaboration. That is useful evidence, but it is not the same thing as contractual renewal, spend expansion, or referenceable satisfaction at scale.

    The same gap makes concentration hard to judge numerically but easy to judge directionally. Because the named public proof set is small, the risk of perceived or actual customer concentration is high. If one or two flagship accounts stall, the visible proof base gets much thinner very quickly. Until the company can show more named deployments, clearer commercial outcomes, or independent user references across multiple segments, concentration will remain one of the biggest interpretive risks in the customer story.
  claimRefs:
