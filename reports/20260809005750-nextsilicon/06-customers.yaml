- id: named-proof
  title: Named Customer Proof Exists, but the Highest-Confidence Set Is Small
  body: |-
    The good news is that NextSilicon now has real named proof rather than only logo slides. Sandia offers the strongest evidence because both the company and the customer independently describe the system, the workloads, and the acceptance process. ZIB and ParTec provide a second named path showing European adoption interest and concrete training activity around Maverick-2. ODISSEE provides a third named surface, with both company and European project sources confirming that NextSilicon is participating in an exabyte-science consortium and has supplied hardware into that effort.

    The bad news is that these three anchors are also the core of the public proof set. They are meaningful, but they are not yet a diversified roster of named commercial end customers across multiple industries. Even when company materials mention dozens of customer sites worldwide, the retained sources do not convert that statement into a transparent account list, paid deployment roster, or production-by-vertical breakdown. As a result, the chapter can confidently say the company has genuine customer traction; it cannot yet say that traction is broad, repeatable, or commercially balanced across many account types.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
