- id: adoption-trajectory
  title: Adoption Appears to Move Through Evaluation, Qualification, and Partner-Led
    Deployment
  body: |-
    Public evidence suggests a fairly consistent customer journey. First comes workload identification and technical evaluation: benchmarking, code porting, and architectural fit analysis. Next comes system qualification or hackathon-style enablement with partners or research teams. Only after that does the story shift into deployment, acceptance, and broader operational use. That path is visible at Sandia, in ParTec’s ZIB work, and in the company’s own customer-support and pre-sales hiring. It is also visible in ODISSEE’s hands-on server delivery and technical collaboration model.

    This means the adoption trajectory is real, but it is probably slower and more consultative than a conventional infrastructure sale. Each step appears to require meaningful technical labor from both the company and the customer. That dynamic is not necessarily a flaw — early frontier infrastructure almost always sells this way — but it explains why public proof can be deep on technical detail and still thin on customer-count scale. The business can have important customers without yet having many customers, and the public evidence currently points much more strongly to that pattern than to a broad-volume expansion story.
