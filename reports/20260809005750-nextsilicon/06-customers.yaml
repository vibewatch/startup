- id: customer-verdict
  title: 'Customer Verdict: Real Proof, Narrow Surface, Strong Need for More Named
    Commercial Breadth'
  body: |-
    Taken together, the public record supports a balanced customer verdict. NextSilicon is past the stage where every claimed customer is hypothetical. Sandia alone gives the company a stronger credibility anchor than many hardware startups ever obtain, and the ZIB and ODISSEE paths show that the architecture resonates with European research buyers as well. That is enough to conclude that the product is solving a real customer problem for a real, sophisticated user cohort.

    But the record also stops well short of what an investor would want before assuming durable commercial scale. The visible cohort is dominated by research-style accounts, public references do not yet reveal broad repeat ordering or revenue expansion, and the company’s statement about dozens of sites is not decomposed into named production customers. The practical outcome is that the customer story is best read as high-quality but low-volume public proof. It justifies continued diligence and supports the thesis that the architecture is finding resonance, yet it also leaves concentration, retention, and enterprise-breadth questions open in material ways.
  claimRefs:
  - CU014
  - CU016
  - CU017
  - CU020
