- id: scenario-and-sensitivity
  title: The Sensitivity Is Driven Mostly by Missing Revenue Evidence, Customer Breadth,
    and Risk Compression Rather Than by Market Size Alone
  body: |-
    Because direct financial disclosure is missing, the valuation range has to be built from scenario logic. In the low case, NextSilicon remains a technically credible but commercially narrow hardware platform with flagship proofs and uncertain conversion, in which case a premium unicorn mark leaves little margin for error. In the base case, the company converts more named research and sovereign accounts, proves deployment durability, and shows enough commercialization maturity that a high-end private infrastructure valuation remains plausible. In the high case, it does that while also demonstrating that Maverick-2 or follow-on products can break beyond a few flagship proofs into a broader system or AI-adjacent wedge.

    What changes the valuation most is not another generic statement about TAM. It is evidence on a few concentrated variables: customer breadth beyond Sandia-style reference wins, revenue or backlog visibility, gross-margin direction, supply-chain execution, and resilience against ecosystem lock-in by incumbents. Without those data points, the downside case remains too easy to sketch. That does not mean the company is weak; it means the current public evidence still supports a wide distribution of possible values. A wide distribution plus a premium private mark usually argues for caution rather than enthusiasm.
  claimRefs:
