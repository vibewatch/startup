- id: diligence-unlockers
  title: 'What Would Move the Call: More Evidence on Revenue, Customer Breadth, and
    Durable Delivery Capability'
  body: |-
    The decision framework is price-sensitive and evidence-sensitive. If management can show repeatable revenue from named programs, diversified customer acquisition beyond a few flagship accounts, supportable gross-margin progression, and a manufacturing / compliance stack that de-risks future deployment, the same valuation that looks stretched in public could begin to look fair or even attractive. Conversely, if the customer story remains narrow, if commercialization still depends on a small number of heroic deployments, or if revenue visibility stays opaque, then even a technically strong architecture may not justify a premium private mark.

    The key is that none of the missing diligence asks is cosmetic. These are exactly the variables that determine whether the company is becoming a scalable compute platform or remaining a brilliant but niche hardware bet. That is why the recommendation is not to reject the story; it is to close the evidence gap before underwriting the valuation. The upside could be real, but the public record alone does not yet prove enough to let valuation conviction outrun technical admiration.
