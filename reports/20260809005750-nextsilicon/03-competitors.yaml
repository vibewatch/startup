    - Realized ASP, support pricing, and backlog economics are unknown
    - Commercial underwriting remains impossible from public data alone
  - - NVIDIA / AMD / Intel merchant systems
    - Typically OEM or partner system sale; public list price often opaque
    - Merchant hardware plus mature ecosystem support
    - Street pricing varies materially by OEM, bundle, and volume
    - Default procurement familiarity favors incumbents
  - - Google TPU
    - Cloud consumption through Google Cloud pricing constructs
    - Accelerator, cluster scale, and software stack inside Google Cloud
    - Not a merchant card for most buyers; exact economics are workload-specific
    - Substitute for buyers comfortable moving the workload into Google Cloud
  - - AWS Trainium
    - Cloud consumption through AWS instances and managed services
    - Chip, network, Neuron SDK, orchestration, and fleet operations
    - Economics depend on reserved / on-demand usage and model behavior
    - Substitute for buyers that prioritize token economics over hardware ownership
  - - Cerebras
    - Custom system / service engagement
    - Wafer-scale hardware and full platform
    - Public list pricing not visible in retained sources
    - Likely sold through a high-touch enterprise or research motion
  - - Groq / SambaNova
    - Dedicated cloud or appliance-style commercial motion
    - Inference stack plus infrastructure or private deployment
    - Public economics are narrative-heavy and workload-specific
    - Compete most directly where inference latency and throughput matter
  - - d-Matrix / Graphcore
    - Hardware-platform motion with limited public realized pricing disclosure
    - Specialized cards, systems, or IPU servers
    - Commercial terms and installed-base depth are unclear publicly
    - Adoption risk remains higher when procurement proof is thin
