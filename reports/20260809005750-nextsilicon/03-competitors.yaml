  rows:
  - - NVIDIA HGX / Blackwell
    - Incumbent merchant GPU platform
    - Mega-cap incumbent with deepest current installed base
    - AI factories, HPC centers, hyperscalers, enterprises
    - Full-stack GPU, CPU, networking, and software integration
    - Highest lock-in exposure and heavy power / cooling burden for some buyers
  - - AMD Instinct MI350
    - Incumbent merchant GPU alternative
    - Large public incumbent with OEM reach
    - AI and HPC data-center deployments
    - Open-software posture and fits existing rack / cooling envelopes
    - Still trails NVIDIA on ecosystem gravity
  - - Intel Gaudi 3
    - Incumbent merchant accelerator alternative
    - Large public incumbent
    - Scaled AI clusters and cost-sensitive migration paths
    - Ethernet-first scale and explicit anti-lock-in message
    - Public messaging is more AI-centric than classic HPC-centric
  - - Google TPU
    - Captive hyperscaler silicon
    - Google-owned cloud platform, not a broad merchant chip sale
    - Google Cloud AI training and inference users
    - Deep vertical integration and large cluster scale
    - Mostly a substitute inside Google Cloud rather than a direct merchant option
  - - AWS Trainium
    - Captive hyperscaler silicon
    - Amazon-owned cloud platform, not a general merchant card
    - AWS AI training and inference users
    - Purpose-built economics and seamless AWS tooling
    - Best fit for workloads comfortable inside AWS rather than sovereign on-prem HPC
  - - Cerebras
    - AI-specialist startup
    - Private startup challenger; scale presented through system architecture rather than merchant volume
    - Large AI training and inference
    - Wafer-scale engine and very high raw AI compute
    - Public positioning is more frontier AI than legacy HPC portability
  - - Groq / SambaNova / d-Matrix
    - Inference-specialist challengers
    - Private AI infrastructure challengers
    - High-throughput or low-latency inference
    - Strong token-economics and inference narratives
    - Less directly aligned with NextSilicon’s HPC-first migration wedge
  - - Graphcore
    - Architectural AI accelerator alternative
    - Private alternative architecture vendor with older public system framing
    - AI training and inference users willing to adopt IPU stack
    - Distinct processor architecture and software co-design story
    - Weaker visible current distribution and market momentum than the biggest rivals
