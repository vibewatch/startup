  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - No-rewrite portability wedge
    - Independent benchmarks may show migration is harder or narrower than marketed
    - high
    - Request workload-level benchmark packs and customer migration case studies
  - - Energy-efficiency advantage
    - Incumbent GPU and cloud roadmaps may narrow the economics gap
    - high
    - Compare real target workloads against current incumbent systems, not old baselines
  - - HPC-first differentiation
    - Demand mix may keep shifting toward AI inference economics instead of classic HPC
    - medium
    - Map pipeline by workload class and precision requirement
  - - National-lab proof
    - Sandia may remain exceptional rather than repeatable
    - medium
    - Request named follow-on programs and non-lab customer references
  - - Partner-led GTM
    - Channel breadth is still thinner than incumbent OEM and cloud distribution
    - high
    - Assess depth of Penguin, Dell, ParTec, and other partner commitments
  - - Open / anti-lock-in narrative
    - Buyers can already multi-home across clouds and incumbent vendors
    - medium
    - Determine whether anti-lock-in is a buying trigger or only a nice-to-have
  - - Merchant accelerator path
    - Captive hyperscaler silicon can win workloads without being sold as a merchant product
    - high
    - Track which workloads are migrating to cloud-only custom silicon
  - - Novel-architecture mindshare
    - Crowded alternative-accelerator narratives can dilute differentiation
    - medium
    - Clarify which customer job NextSilicon wins uniquely and repeatedly
  notes: The heaviest public risk is incumbent distribution power, not lack of adjacent alternatives.
