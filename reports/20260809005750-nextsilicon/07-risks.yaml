- id: risk-verdict-and-kill-criteria
  title: 'The Risk Verdict Is Investable-but-Fragile: Strong Technical Signal, Several
    Hard External Dependencies, and Clear Thesis-Break Conditions'
  body: |-
    This is not a company whose risk profile can be summarized as “hardware is hard.” The more precise statement is that several external dependencies stack on top of one another: export-control complexity, foundry and packaging concentration, incumbent ecosystem power, partner-enabled delivery, and a still-narrow reference base. None of those risks is automatically fatal in isolation. Together, however, they create correlated downside. A supply slip weakens customer references; weaker references lengthen sales cycles; longer sales cycles worsen financing pressure; financing pressure reduces the company’s ability to buffer supply-chain shocks or support a demanding software roadmap.

    That correlation is why the chapter’s recommendation is to monitor a small set of thesis-break triggers rather than to track dozens of generic startup worries. If the company can add named customers beyond Sandia-style flagship proofs, show durable deployments in Europe, maintain compliance maturity while export rules evolve, and keep partner dependencies from obscuring the end-customer relationship, risk compresses meaningfully. If not, the downside story becomes much easier to imagine: elegant architecture, credible science, and insufficient commercial escape velocity. The right diligence response is not to reject the company outright, but to demand concrete evidence against these transmission paths before paying up for the upside narrative.
  claimRefs:
