- id: software-stack-and-cpu
  title: Programmability Depends on the Compiler, Tools, and the Arbel CPU Path
  body: |-
    The make-or-break issue for any unconventional accelerator is programmability, and NextSilicon clearly knows it. The company’s BYOC and FAQ material repeatedly stresses that users should not have to rewrite code or adopt a proprietary language. Public pages say Maverick-2 supports common HPC languages and frameworks today, with broader integrations planned, while the technology page highlights profiler, chip-viewer, and projection-viewer tooling intended to expose runtime behavior. Developer-signal sources support the same story from the inside: the AI-libraries job requires optimization of AI kernels such as GEMM and FlashAttention, and the customer-solutions role expects familiarity with LLVM, schedulers, and mainstream parallel-programming models.

    Arbel strengthens that software story by addressing the serial and orchestration side of heterogeneous computing. The public record now describes both an accelerator-integrated RISC-V path and a separate server-class CPU program. Arbel’s page and engineering blog discuss Linux, GCC/LLVM, coherent test silicon, virtualization-oriented ISA targets, vector units, and a chiplet-style roadmap. That does not prove broad commercial availability, but it does show that NextSilicon sees the CPU, compiler, and accelerator as one system problem rather than as isolated blocks. The architecture is strongest when interpreted as a tightly coupled platform bet, not a single-chip bet.
