- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - NextSilicon solution
  - Measurable benefit
  - Limitation
  rows:
  - - HPCG / linear-algebra style benchmarking
    - Run on CPU/GPU clusters with extensive tuning
    - Map hotspots to Maverick-2 with runtime adaptation
    - Company claims leading-GPU-class HPCG at lower power
    - Independent replication not yet public
  - - LAMMPS / SPARTA / mission codes
    - Port and optimize for new accelerators
    - Run on Spectra with less rewrite burden
    - Sandia shows day-one support for key workloads
    - Proof concentrated in one marquee environment
  - - Graph analytics / PageRank
    - Use CPUs or GPUs that can struggle on large irregular graphs
    - Exploit dataflow throughput on irregular patterns
    - Company claims large graph advantage vs GPUs
    - Comparator details are still limited
  - - Scientific code modernization
    - Spend months porting to proprietary stacks
    - BYOC plus profiler-guided optimization
    - Potentially faster time-to-science and lower porting cost
    - Depends heavily on compiler quality
  - - AI-kernel optimization
    - Hand-tune kernels for GPU hierarchies
    - Use NextSilicon AI libraries and low-level kernel work
    - Could extend the platform beyond pure HPC
    - Public deployment proof for AI remains early
  - - European exabyte science pipelines
    - Process HL-LHC / SKAO data at scale
    - Participate through ODISSEE hardware/software work
    - Aligns architecture with sovereign scientific-compute needs
    - Commercial conversion from consortium work is unproven
  notes: Benefits reflect public claims and customer proof where available; unsupported
    cells stay qualitative.
