- id: deployment-and-dependencies
  title: Deployment Maturity Is Real but Still Depends on a Small Set of Critical
    Ecosystem Partners
  body: |-
    Public deployment evidence is now substantial enough to move the product beyond the prototype-only category. Sandia’s partnership pages and NextSilicon’s acceptance announcement show that Spectra reached system acceptance under the Vanguard program, while ParTec publicly describes Zuse Institute Berlin as the first European customer for Maverick-2. ODISSEE and CORDIS additionally place NextSilicon inside a multi-party European research initiative focused on exabyte-scale scientific workloads. This is a stronger deployment record than many novel-architecture startups ever achieve.

    But the same record also reveals dependency concentration. System integration at Sandia runs through Penguin. European delivery runs through ParTec. Future network validation runs through Cornelis. Scientific-program credibility comes from a small number of marquee research environments. That dependency map is not disqualifying — in fact it is exactly how frontier infrastructure often commercializes — but it means product maturity is still highly entangled with partner execution, benchmark transparency, and the continued health of a narrow early-adopter ecosystem. The product is real; the surrounding delivery web is still thin enough to matter materially.
  claimRefs:
