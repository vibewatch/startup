- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Dataflow compute fabric
    - Executes mapped kernels via configurable compute elements
    - Compiler and runtime quality
    - If mapping quality is weak, performance claims weaken quickly
  - - Telemetry loop
    - Feeds runtime optimization and replanning
    - Observability and fast software response
    - Opaque or brittle telemetry would undermine adaptivity
  - - HBM3E memory subsystem
    - Supplies bandwidth for irregular and dense workloads
    - Packaging and memory availability
    - Advanced-memory supply remains a system-level dependency
  - - Embedded / local cores
    - Handle serial or control work near the accelerator
    - Balanced work partitioning
    - Serial bottlenecks can still limit overall speedup
  - - Arbel RISC-V CPU path
    - Extends control into standalone or coupled CPU roles
    - Software ecosystem maturity and silicon execution
    - Roadmap execution risk remains material
  - - Developer tools
    - Profiler, chip viewer, projection viewer expose behavior
    - Usability and docs quality
    - Without usable tools, “no rewrite” becomes harder in practice
  - - System integration layer
    - PCIe / OAM boards, power, cooling, and racks
    - Penguin, ParTec, OEMs, Cornelis
    - Partner failure can slow deployments even if silicon works
  - - Application support layer
    - Benchmarks, porting, optimization, and customer liaison
    - Skilled field engineers
    - High-touch delivery can constrain scale
  notes: The architecture only works as promised when silicon, compiler, tooling,
    and integration all arrive together.
