chapter:
  number: 6
  title: Customers
  summary: EliseAI has credible customer proof in large U.S. multifamily owner/operators, fee managers, and student-housing portfolios, with quantified outcomes across CAF, Asset Living, RPM Living, Landmark, Mill Creek, Student Quarters, S2, and Brookfield. Public evidence also suggests broad enterprise penetration—70% of top-50 multifamily owners/operators and 600+ owners/operators—but the exact active-unit denominator varies across sources and public NRR / concentration disclosure is still absent. The strongest customer signal is cross-product expansion inside scaled housing accounts; the biggest caveat is resident-disclosure and compliance risk in sensitive communication workflows.
sections:
- id: market-coverage-segmentation
  title: Customer Base Segmentation and Public Scale
  body: |-
    EliseAI's customer evidence is strongest in large U.S. housing operators rather than small landlords or generic SMB property managers. The company is explicitly pitching both owners and fee managers, which matters because the buyer, day-to-day user, and budget owner are often different inside multifamily. Owner-facing material focuses on NOI, delinquency, vacancy, and asset performance, while property-manager material focuses on workload relief, lead conversion, renewals, and centralized communication. In practice, the public customer set spans large owners and REITs, third-party fee managers, student-housing operators, affordable and military housing operators, and some single-family portfolios.

    Scale is real, but the public denominator is not perfectly clean. Business Wire and funding coverage say EliseAI works with 70% of the top 50 multifamily owners/operators and is active in one out of every 12 multifamily apartments. Thesis Driven and AI for PropTech push the footprint higher, describing 600+ owners/operators and roughly 10% of the U.S. apartment market. Multifamily Dive goes further still, citing one in six rental units and 500,000 affordable units. The right read is not that adoption is weak; it is that public scale figures are marketing-oriented and not yet presented as one audited KPI set.
