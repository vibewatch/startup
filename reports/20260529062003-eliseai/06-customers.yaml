- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: The strongest public deployments start with a narrow pain point, prove ROI on a live portfolio, then expand into a wider centralized operating model.
  data:
    nodes:
    - id: pain-point
      label: Pain point
      detail: Staffing pressure, missed after-hours demand, poor collections, or maintenance overload create urgency.
    - id: pilot
      label: Pilot deployment
      detail: Customer starts with one product, site set, or portfolio slice to test AI performance versus incumbent process.
    - id: quant-proof
      label: Quantified proof
      detail: Operator measures lead-to-tour, occupancy, renewals, collections, hours saved, or work-order outcomes.
    - id: module-expand
      label: Module expansion
      detail: Leasing expands into renewals, delinquency, maintenance, voice, or guided tours after initial proof.
    - id: centralization
      label: Centralized operating model
      detail: Operator redesigns workflows, task routing, or managed services around one AI-plus-human control layer.
    - id: portfolio-rollout
      label: Portfolio rollout
      detail: Rollout becomes portfolio-wide or client-wide, making EliseAI part of the operating system rather than a point tool.
    edges:
    - from: pain-point
      to: pilot
    - from: pilot
      to: quant-proof
    - from: quant-proof
      to: module-expand
    - from: module-expand
      to: centralization
    - from: centralization
      to: portfolio-rollout
