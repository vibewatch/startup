  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: A single audited current figure for live owners/operators, active apartment units, and share of the U.S. apartment market.
    whyItMatters: The public footprint is clearly large, but the chapter cannot cleanly reconcile one in 12, ~10%, one in six, and >1M-unit claims into one denominator for penetration modeling.
    diligencePath: Request the latest board KPI pack or customer-success dashboard showing active live units, logo count, and definitions for live versus contracted properties.
    relatedQuestionRefs:
    - QU002
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal cohorts, and expansion by customer segment or product module.
    whyItMatters: Public case studies show renewal proxies and satisfaction gains, but they do not replace core SaaS durability metrics needed to underwrite recurring revenue quality.
    diligencePath: Request cohort retention by start year, gross and net retention by product family, and top reasons for churn / contraction.
    relatedQuestionRefs:
    - QU017
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR share, ACV bands, contract length mix, and renewal calendar for the largest customers.
    whyItMatters: Public proof is skewed toward large multifamily operators, so concentration could be materially higher than the logo count suggests.
    diligencePath: Request the top-customer concentration schedule, contract term matrix, and exposure by REIT / owner-operator / fee-manager cohort.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: cre-owner-expansion
    missingEvidence: Named office or broader CRE-owner deployments with quantified production outcomes similar to the multifamily references in this chapter.
    whyItMatters: Management says EliseAI now sells to owners and broader real-estate groups, but the public proof set fetched here remains overwhelmingly multifamily and student housing.
    diligencePath: Request two current named non-multifamily references with deployed modules, live property counts, and before/after operating metrics.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: TU003-named-customer-proof-coverage
    missingEvidence: A current top-customer list that maps named deployments to product modules, live property counts, and whether each reference is pilot, production, or expanded portfolio-wide.
    whyItMatters: The chapter has enough named proof to validate adoption, but the public set is still a partial sample and does not show how representative the strongest references are across the broader customer base.
    diligencePath: Request the current customer-reference deck or top-20 account list with live-unit counts, module footprint, referenceability status, and last-verified date for each named customer.
    relatedQuestionRefs:
    - QU004
    - QU021
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: resident-disclosure-governance
    missingEvidence: Current bot-disclosure templates, escalation policy, legal review standards, and human-off-ramp rules for delinquency and eviction-adjacent conversations.
    whyItMatters: The chapter found real tenant-advocacy criticism, and deployment into sensitive resident workflows will be easier to challenge if disclosure and governance controls are not explicit.
    diligencePath: Request the latest resident disclosure language, delinquency playbook, jurisdictions where drafting notices is enabled, and any external legal opinions or audits.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
