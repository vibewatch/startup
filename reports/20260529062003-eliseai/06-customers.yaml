    - Leasing, resident communication, voice, maintenance, AI-guided tours
    - Production / broad rollout
    - 8,338 leases in 2024; delinquency down 60 bps; AIGT rolled from 3-property pilot to 100+ properties
    - Most proof is from EliseAI-authored stories
  - - RPM Living
