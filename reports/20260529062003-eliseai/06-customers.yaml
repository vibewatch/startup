- id: expansion-concentration-risk
  title: Expansion Motion and Concentration Risk
  body: |-
    Public evidence suggests EliseAI expands inside accounts rather than winning a series of disconnected point-solution pilots. Asset Living, RPM, Michaels, Landmark, and Student Quarters all use multiple modules, and the official positioning now treats leasing, renewals, delinquency, maintenance, voice, CRM, and guided tours as one resident-lifecycle system. That matters for durability: once the platform is handling multiple communication channels and multiple steps in the resident journey, ripping it out becomes an operating-model decision, not just a software swap.

    The concentration risk is that nearly every strong public reference in this chapter is still U.S. housing—especially large multifamily, student housing, and large fee-manager portfolios. Public proof for office, hospitality, or broader CRE owner workflows is thin, and there is no public top-customer revenue disclosure to show how diversified the book is across REITs, PMCs, and owner-operators. In other words, EliseAI has strong penetration where it is strongest, but the chapter cannot prove how balanced the revenue base is across customer cohorts or how much of the current scale sits with a relatively small set of enterprise operators.
