  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale proof
  - Strategic value
  - Gap / limitation
  rows:
  - - Large multifamily owners / REITs
    - 'Buyer: owner / asset manager; User: centralized ops + onsite teams; Payer: ownership'
    - Leasing, delinquency, renewals, portfolio reporting, resident service
    - Business Wire names Bozzuto, AvalonBay, Equity Residential, and Invitation Homes; Brookfield and Equity show delinquency use in media coverage
    - High-value enterprise accounts with portfolio-wide rollout potential
    - No public disclosure of revenue concentration or contract size by owner
  - - Fee managers / PMCs
    - 'Buyer: property management leadership; User: leasing, centralized admin, onsite teams; Payer: manager or owner-approved tech budget'
    - Lead nurturing, collections, managed services, maintenance, renewals
    - Asset Living 450k+ units; RPM ~220k; CAF 24k units
    - Best public proof for land-and-expand and centralized-service use cases
    - Owner approval can still slow procurement and product expansion
  - - Student housing operators
    - 'Buyer: student housing ops / marketing; User: leasing teams, residents, maintenance; Payer: operator'
    - AI-guided tours, resident service, maintenance, voice, collections
    - Landmark 100+ properties / 72k+ beds; Scion 140 communities; Student Quarters 28 properties / 12.7k beds
    - Strong fit for after-hours demand and digitally native renters
    - Seasonal leasing makes year-round retention and utilization harder to benchmark
  - - Affordable / military / regulated housing
    - 'Buyer: affordable or military housing leadership; User: residents, compliance-aware ops teams; Payer: operator / owner'
    - Maintenance intake, resident communication, leasing support, future affordable rollout
    - Michaels manages 75k units including 50k affordable; Multifamily Dive says EliseAI represents 500k affordable units
    - Large whitespace for expansion if compliance-sensitive workflows are handled well
    - Public proof on compliance-heavy workflows remains limited and cautiously framed
  - - Owner-operators / value-add investors
    - 'Buyer: operator leadership; User: centralization, maintenance, asset teams; Payer: owner-operator'
    - Rent collection, maintenance, tours, renewals, resident lifecycle automation
    - GoldOller 48k units; S2 28k units / 78 communities; Post Brothers 6k units; Brookfield 100+ buildings
    - Good proof that ROI matters outside pure fee-management models
    - Most portfolio ROI evidence is still company-authored or conference-reported
  notes: Segmentation is based on public customer stories, owner/property-manager landing pages, and independent coverage; it is not a disclosed revenue mix.
