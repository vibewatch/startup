- id: retention-satisfaction-durability
  title: Retention, Satisfaction, and Durability Signals
  body: |-
    EliseAI does not publish classic SaaS durability metrics such as NRR, GRR, logo churn, cohort curves, or contract term mix, so public retention analysis has to rely on proxies. Those proxies are still directionally useful. CAF published a measurable renewal-retention improvement, RPM published faster renewals and higher renewal conversion, and Post Brothers reported better renewal engagement and earlier notice. Grace Hill and EliseAI also published a joint report showing higher NPS, stronger perceived value for rent, and better management-responsiveness scores after deployment across 300+ properties. That is not equivalent to audited retention, but it does suggest the product can improve resident-facing service when operators actually operationalize it.

    The adverse side is also real. Software-review comments say EliseAI can feel rigid on complex questions or less personal than a human, while tenant-advocacy sources object to undisclosed bot conversations in delinquency and eviction-adjacent workflows. That means durability is a two-sided story: operational buyers appear to keep expanding usage because AI creates labor leverage, but resident trust and compliance practices matter if EliseAI is going to own more sensitive communication surfaces over time.
