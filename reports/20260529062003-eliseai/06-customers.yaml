- id: named-customer-proof
  title: Named Deployments and Quantified Customer Outcomes
  body: |-
    The chapter's best proof comes from named deployments where EliseAI is embedded in production workflows and the operator is willing to publish before-and-after outcomes. CAF, Asset Living, RPM Living, Landmark, Mill Creek, Student Quarters, GoldOller, S2, Michaels, and Brookfield all provide some combination of portfolio scale, rollout scope, and metric change. The common pattern is that EliseAI starts with leasing or delinquency messaging, then expands into renewals, maintenance, voice, or AI-guided tours once the operator sees enough lift to justify a broader rollout.

    Importantly, not all named customers provide the same quality of evidence. Some rows are strong because they include multiple operating metrics and rollout detail; others are weaker because the proof is limited to a funding release or a single press/interview reference. Even so, the body of evidence is good enough to conclude that EliseAI has moved beyond logo collection. The strongest public references are not pilots with vanity quotes; they are portfolio-level deployments with response-time, conversion, collections, renewal, or maintenance metrics that show the software is sitting inside daily operating systems.
