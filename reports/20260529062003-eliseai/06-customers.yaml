figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: EliseAI creates value when a housing operator moves from leasing automation into resident, maintenance, renewal, and collections workflows across the same account.
  data:
    items:
    - label: Executive mandate
      description: Owner, asset-management, or property-management leadership wants better occupancy, lower delinquency, and fewer onsite bottlenecks.
    - label: Prospect capture
      description: LeasingAI and VoiceAI answer leads instantly across web, text, email, and phone so after-hours demand is not lost.
    - label: Tour / application
      description: The operator uses AI-guided tours, scheduling, and follow-up to move leads into tours, applications, and signed leases.
    - label: Move-in / resident service
      description: Resident communication, maintenance intake, and voice channels absorb repetitive requests while teams handle exceptions.
    - label: Renewal / collections
      description: Renewals and delinquency modules automate nudges, reminders, and context-rich handoffs that improve cash flow and notice timing.
    - label: Account expansion
      description: Once the workflow data and team design live inside EliseAI, the customer expands modules and centralization scope rather than running one-off pilots.
