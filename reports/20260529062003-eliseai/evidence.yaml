evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-cap-table
    missingEvidence: >-
      Exact post-Series-E board composition, ownership percentages, liquidation preferences, and any investor observer
      or veto rights.
    whyItMatters: >-
      Control rights and dilution economics affect strategic flexibility, refresh risk, and any later valuation
      analysis.
    diligencePath: >-
      Request the current cap table, board list, investor rights summary, and the post-Series-E financing documents
      under NDA.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Exact ARR, revenue growth, gross margin, burn, and a housing-versus-healthcare revenue mix breakdown.
    whyItMatters: >-
      Chapter 1 can establish that EliseAI crossed $100M ARR, but not how much of that scale is durable, profitable, or
      diversified across verticals.
    diligencePath: >-
      Ask management for audited or board-reported KPI packs covering revenue, gross margin, cash burn, and vertical mix
      for 2024-2026.
    relatedQuestionRefs:
      - QO010
      - QO026
  - type: conflicting-data
    severity: material
    topic: scale-metric-definitions
    missingEvidence: >-
      A reconciled definitions sheet for units served, apartment-market penetration, owners/operators, customers, and
      current employee count as of the run date.
    whyItMatters: >-
