  rows:
  - - Housing communication automation
    - Leasing, resident, renewals, delinquency, and maintenance workflows sold as enterprise AI modules
    - Enterprise SaaS / module contract
    - Largest disclosed installed base; 600+ owners/operators and 10% U.S. apartment market
    - Good adoption evidence; weak dollar disclosure
    - Request housing ARR, attach rate by module, and renewal rates
  - - EliseCRM hub
    - Free or included CRM layer that centralizes data, reporting, quotes, and workflows
    - Included platform anchor
    - Explicitly described as free/included, but monetization effect is indirect
    - Strong role clarity; no standalone economics
    - Request attach rate, implementation revenue, and conversion uplift from CRM-led landings
  - - Lease Audits
    - AI-driven resident-ledger and lease comparison for discrepancy detection and revenue protection
    - Add-on module; one-time or continuous
    - Positioned as revenue recovery and compliance feature; one-to-two-day audit turnaround claimed
    - Medium
    - Request price per property, recovery rate, and ongoing usage mix
  - - Fee Transparency Suite
    - Centralized fee disclosure logic across quotes, applications, chats, widgets, and PDFs
    - Compliance add-on / workflow module
    - Supports regulatory response and trust-building but no list price is public
    - Medium
    - Request attach rate by state, contract value, and retention effect
  - - Collections and renewals automation
    - Automated reminders, promises-to-pay support, delinquency follow-up, and renewal workflows
    - Recurring workflow module
    - Case studies show lower delinquency and recovered receivables
    - Medium
    - Request bad-debt reduction by cohort and renewal-rate lift
  - - Healthcare automation
    - Front-desk, call-center, scheduling, prior authorization, and billing support
    - Enterprise workflow contract
    - Strategic second vertical; no disclosed revenue split or customer count by specialty
    - Medium-low
    - Request healthcare ARR, gross margin, customer count, and sales cycle data
  notes: Public evidence establishes module categories and workflow positioning, but not booked ARR by stream; rows therefore describe monetization architecture rather than audited revenue mix.
