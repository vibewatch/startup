callouts:
- calloutType: insight
  title: CRM-as-hub appears to be the commercial wedge
  body: The strongest public monetization read is not a posted tariff; it is the way EliseCRM anchors workflow data and makes Lease Audits, Fee Transparency, and other modules easier to layer on top. That is a healthier revenue-quality signal than a single-purpose chatbot SKU because it implies broader retention and upsell potential.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI040
- calloutType: assumption
  title: Gross margin should be software-like, but not pure-SaaS pristine
  body: AppFolio shows that scaled property-management software can run at roughly mid-60s gross margins. EliseAI may ultimately reach similar territory, but its voice, messaging, onboarding, and customer-success burden likely keeps current gross margin below the cleanest horizontal SaaS benchmarks until the company discloses otherwise.
  claimRefs:
  - CI035
  - CI036
  - CI037
  - CI043
  - CI052
- calloutType: risk
  title: The immediate blocker is disclosure opacity, not lack of momentum
  body: EliseAI likely has enough commercial traction to matter, but investors still cannot reconcile total capital raised, true headcount, or post-Series E valuation from public evidence alone. Until management supplies a clean cap-table history, cash bridge, and revenue-mix breakdown, valuation and runway remain narrative rather than underwritten facts.
  claimRefs:
  - CI010
  - CI011
  - CI014
  - CI024
  - CI042
  - CI048
  - CI049
