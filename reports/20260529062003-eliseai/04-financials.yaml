  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly net burn, and base/upside/downside runway after the 2025 Series E.
    whyItMatters: Without balance-sheet data, investors cannot tell whether the $250M raise comfortably funds the hiring plan or merely offsets an expensive growth curve.
    diligencePath: Request CFO board pack with current cash, trailing six-month burn, 24-month forecast, and hiring plan sensitivity.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Any venture debt, bank line, equipment lease, or security interest still outstanding after the latest equity round.
    whyItMatters: Hidden leverage would change dilution risk, covenant headroom, and true runway, especially for a company scaling offices and headcount aggressively.
    diligencePath: Request debt schedule, lender agreements, UCC/security-interest summary, and board approvals for any non-equity financing.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Signed order forms or standard MSAs showing module pricing, minimums, implementation fees, and discounting practices by segment.
    whyItMatters: Public product pages establish capabilities but not monetization quality, so ARR durability and CAC payback cannot be tested from tariffs or list sheets.
    diligencePath: Request three redacted housing contracts and two healthcare contracts with booked ARR, ramp schedule, and services scope.
    relatedQuestionRefs:
    - QI002
    - QI026
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-margin
    missingEvidence: Revenue split by housing versus healthcare and by module, plus COGS by channel and gross-margin bridge.
    whyItMatters: The company may be scaled enough for strong software economics, but investors cannot tell whether newer healthcare or voice-heavy products dilute margin or increase support intensity.
    diligencePath: Request quarterly revenue bridge by vertical and module, gross margin by business line, and unit-cost detail for messaging, voice, model inference, and customer success.
    relatedQuestionRefs:
    - QI004
    - QI014
    - QI015
    relatedTableRefs:
    - TI001
    - TI003
  - type: conflicting-data
    severity: material
    topic: funding-and-headcount-opacity
    missingEvidence: One reconciled schedule for round-by-round funding, post-money valuation, and ending fully diluted shares, alongside a dated headcount roll-forward.
    whyItMatters: Official counters and third-party directories conflict enough that valuation multiples, dilution history, and ARR-per-employee calculations are all noisy.
    diligencePath: Request full cap-table history, financing ledger, and monthly headcount by function since the 2024 Series D.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI019
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: enumeration-incomplete
    severity: minor
    topic: early-funding-chronology
    missingEvidence: Direct documentation for pre-Series C rounds or debt events referenced indirectly by third-party databases and the TechCrunch total-raised figure.
    whyItMatters: The C-to-E chronology is clear, but early-round omissions make total-raised reconciliation and cumulative dilution analysis less precise.
    diligencePath: Request round-by-round financing summary from seed onward, including any special purpose vehicles or debt facilities.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
