- id: public-unit-economics-evidence
  title: Public unit-economics evidence
  body: 'EliseAI''s public financial evidence is strongest where customer case studies tie automation to a buyer budget line. The Kittle and Juniper case studies provide unusually concrete proof points for a private SaaS vendor: faster lead-to-lease cycles, lower advertising spend, incremental leases, lower delinquency, recovered receivables, and portfolio-level ROI per unit. Those outcomes are not enough to derive true company-level CAC or gross margin, but they do show that buyers are likely purchasing against labor, advertising, and bad-debt budgets rather than experimentation budgets. The call-center cost baseline reinforces that point: if healthcare or housing operators can replace or resize human call-center capacity, the product can justify meaningful contract value even without public tariffs. For margin benchmarking, AppFolio''s filing is useful even though it is not a direct peer. It shows that scaled property-management software can sustain software-like gross margins with substantial
    GTM spending, which supports the case that EliseAI could ultimately be a good-margin business if messaging, telephony, support, and onboarding costs stay controlled.'
