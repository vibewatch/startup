    - Frames operating leverage and whether hiring is outrunning revenue
    - Provide booked ARR per FTE and ramp assumptions
  - - Customer ROI / savings proof
    - ~$15 per unit per month at Juniper; 40% ad-spend reduction and $241k receivables recovery at Kittle
    - Medium
    - Suggests product is bought against labor, marketing, and bad-debt budgets
    - Provide audited cohort ROI and payback by module
  - - Call-center replacement baseline
    - $265,167 annual salaries for a five-person team; outsourced agents $25-$65 per hour
    - Medium
