  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-funded
    missingEvidence: A reconciled financing ledger showing whether the post-Series-D cumulative total was about $140–141.9 million or $171.9 million and what instruments each source includes.
    whyItMatters: Total capital raised affects dilution analysis, preference-stack sizing, and how much capital cushion investors actually bought at each round.
    diligencePath: Request the company cap table or financing summary from management and compare it to PitchBook and company round announcements.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: Current per-unit pricing, average contract value, net retention, and gross-margin by product line for housing and healthcare.
    whyItMatters: Without price realization and margin data, public ARR alone cannot show whether EliseAI deserves a premium software multiple or a services-like discount.
    diligencePath: Ask management for current pricing schedules, cohort retention tables, gross-margin bridges, and customer-level ARR concentration.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Series E term sheet terms, liquidation preferences, anti-dilution language, secondary sales, and any seniority between preferred classes.
    whyItMatters: A late-stage private valuation can look reasonable at the enterprise level while still producing weak common-equity outcomes once preferences and secondaries are modeled.
    diligencePath: Obtain the latest charter, financing documents, waterfall model, and any secondary transaction schedule from counsel or the company CFO.
    relatedQuestionRefs:
    - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: private-comp-and-term-coverage
    missingEvidence: A fuller private comparable set with disclosed revenue, margin, and round-term data for other vertical AI or proptech workflow companies.
    whyItMatters: The comparable table can anchor public multiples, but private AI marks may still diverge depending on growth, margins, and term-sheet structure.
    diligencePath: Extend the comp set with private data-room materials or secondary-market marks for adjacent vertical AI companies before final term-sheet pricing.
    relatedTableRefs:
    - TV004
