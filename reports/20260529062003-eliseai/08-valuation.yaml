- id: recommendation-entry-discipline-and-diligence
  title: Recommendation, entry discipline, and final diligence asks
  body: |-
    The recommendation is research-more, with medium confidence, a high risk rating, and a stretched valuation stance. The reason is not that EliseAI lacks proof of product-market fit; the company clearly has real adoption, strong growth, and a plausible right-to-win in housing workflows. The issue is that public evidence still stops at the edge of the questions that matter most for late-stage underwriting: current ARR by segment, gross margin, retention, customer concentration, and the preference stack.

    That missing disclosure is especially important because private rounds are not just about headline enterprise value. Without the Series E term sheet and waterfall, investors cannot know whether the current mark leaves enough downside protection for new capital or whether much of the apparent value sits above a preference stack that would dilute common outcomes in a softer exit.

    Entry discipline therefore has to be price-sensitive and evidence-sensitive. If management can show ARR materially above $150 million, healthy gross margins, sticky cohorts, and plain-vanilla preferences, the current mark can be defended. Without that data, investors should wait either for private disclosure or for a materially better entry price before treating EliseAI as a fundamentals-cleared late-stage investment.
