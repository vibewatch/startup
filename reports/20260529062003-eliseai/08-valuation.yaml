- id: public-comparable-set-and-multiple-math
  title: Comparable set and public-market multiple math
  body: |-
    AppFolio is the closest public operating comparable because it monetizes property-management workflows at scale; CoStar and Zillow are useful sector references but have more marketplace and data exposure, while Procore and ServiceTitan are adjacent vertical SaaS benchmarks rather than direct housing-software peers. The key public-comparable lesson is that late-May-2026 revenue multiples for this set cluster around 3.1x to 6.5x revenue, with a simple average near 5.0x.

    EliseAI's latest private valuation sits well above that range when measured against public ARR evidence. Using only the disclosed ARR floor of $100 million, the $2.2 billion mark implies about 22x ARR. That is roughly 4.4x the public-comp average multiple. The market is therefore paying not for what EliseAI has publicly disclosed, but for a view that ARR has already moved well above the disclosed floor and can remain much faster growing than the public comp set.

    That premium is not absurd on direction: EliseAI said it doubled revenue for four consecutive years, while the public comps were growing closer to the mid-teens or low-twenties. But the spread between ~22x on the public floor and ~5x across public comparables is still wide enough that price discipline matters. Public evidence supports a growth premium; it does not, by itself, fully support the current private mark.
