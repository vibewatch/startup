- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Thesis
    - Category winner in housing workflows
    - 600+ operators, one-in-eight apartment penetration, and deep automation breadth support category leadership.
    - Evidence of churn, concentrated customers, or weakening adoption would reduce the right-to-win narrative.
  - - Thesis
    - Growth can justify a premium multiple
    - EliseAI said revenue doubled four straight years and surpassed $100M ARR by 2025.
    - If current ARR is still near the disclosed floor, the growth premium would look too aggressive for the latest mark.
  - - Thesis
    - Healthcare adds a second growth vector
    - Series E capital explicitly funds healthcare and housing, extending TAM beyond multifamily alone.
    - If healthcare remains immaterial or lower quality than housing revenue, the second-vertical premium should compress.
  - - Anti-thesis
    - Public multiple support is thin
    - Public comps cluster around 3x–6.5x revenue while EliseAI's public ARR floor implies about 22x ARR.
    - A current ARR figure well above $150M and strong margin evidence would make the spread easier to defend.
  - - Anti-thesis
    - Funding totals and cap-table disclosure are imperfect
    - Public sources disagree on cumulative funding through Series D and disclose no preference stack.
    - A reconciled financing ledger and current waterfall model would remove a meaningful diligence overhang.
  - - Anti-thesis
    - Sector headwinds and regulation can compress multiples
    - RealPage antitrust scrutiny and weak 2026 multifamily rent growth can slow customer budgets or premium multiples.
    - Evidence that EliseAI's ROI is resilient in weak rent-growth markets would reduce this concern.
  notes: Arguments summarize the strongest public positives and negatives; they are not substitutes for private diligence on unit economics or cap-table terms.
