tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - EliseAI
    - Agentic leasing + resident operations platform
    - 750+ top PMCs on Entrata marketplace page; $250M Series E reported by TFN in 2026
    - Multifamily operators that want one AI layer across leasing, resident services, and ops
    - Spans prospect and resident workflows across text, email, voice, chat, tours, maintenance, renewals, delinquency, and reporting
    - Still depends on coexistence with incumbent PMS systems in many accounts and faces crowded AI positioning
  - - Entrata
    - Incumbent multifamily operating system
    - Private incumbent; official pages describe autonomous-property-management OS and thousands of operators
    - Owners and operators that want leasing, payments, renewals, compliance, and resident workflows in one stack
    - System-of-record adjacency plus embedded Leasing AI, ELI+, and workflow automation
    - Pricing is opaque and buyer may still need proof that embedded AI beats best-of-breed specialists
  - - RealPage / Knock
    - Incumbent suite plus CRM / AI leasing layer
    - Large incumbent suite distribution with Knock CRM and Lumina AI surfaces
    - Multifamily operators prioritizing front-office workflow, centralized leasing, and AI agents inside existing stack
    - Combines CRM, AI Leasing Agent, call intelligence, tours, and broader AI workforce narrative
    - Public materials emphasize platform breadth more than transparent pricing or independent outcome benchmarking
  - - Yardi
    - Incumbent suite with embedded AI
    - 40+ year platform foundation highlighted on Virtuoso page
    - Operators already standardized on Yardi / RentCafe workflows
    - Virtuoso, Chat IQ, CRM IQ, and Online Leasing tie AI directly into governed platform workflows
    - Incumbent depth may reduce need for third-party AI only if product quality is sufficient in practice
  - - AppFolio
    - Suite vendor with leasing AI assistant
    - Public suite vendor; review and official pages emphasize centralized accounting, marketing, leasing, and AI scheduling
    - Mid-market and portfolio operators seeking integrated marketing, leasing, and property management
    - Lisa works 24/7 and Realm-X adds trust, privacy, and accountability positioning
    - Official surfaces do not publish easy apples-to-apples pricing for direct comparison
  - - Funnel
    - Direct conversational-leasing / CRM specialist
    - Official page claims 46% AI-handled conversion and $4-5M annual operational savings
    - Multifamily operators wanting centralized leasing, CRM, contact center, renewals, and AI workflows
    - Renter-centric CRM plus strong portfolio-centralization and RealPage-compatibility narrative
    - Still depends on underlying PMS ecosystem and public funding scale is not surfaced on reviewed pages
  - - Betterbot
    - Resident-lifecycle AI specialist
    - Official results page cites 520-community deployment, $12.7M annual labor efficiency, and 9.85x ROI
    - Operators seeking one AI layer across leasing, maintenance, renewals, delinquency, and prequalification
    - Unified platform with specialized agents and deep PMS integrations
    - Outcome claims are company-authored and list pricing remains opaque
  - - LeaseHawk
    - Leasing AI / contact-center / CRM specialist
    - Established multifamily software vendor; official surfaces focus on ACE, CRM, and AI contact center rather than public funding detail
    - Operators needing leasing automation, contact-center coverage, and CRM workflow
    - Focused product set around leasing and resident communication automation
    - Less evidence in the reviewed pack of broader resident-ops breadth than EliseAI or Betterbot
  - - PERQ
    - Lead-management and conversational-AI specialist
    - Official page says hundreds of PMCs trust PERQ
    - Operators prioritizing lead capture, nurture, and lower-cost marketing conversion
    - Combines PPC, conversational AI, nurture automation, reactivation, and analytics to lower lead cost
    - More marketing-funnel oriented than full resident-operations platform
  - - Tour24
    - 'Workflow substitute: self-guided tours'
    - Multi-award-winning self-guided touring product with broad operator testimonials
    - Operators that mainly need after-hours coverage and property tours
    - Keeps touring available after hours and weekends without a full conversational-leasing deployment
    - Solves one high-value workflow rather than the whole leasing and resident journey
  notes: Selected rows cover the most relevant direct peers, incumbent suites, and workflow substitutes found in the fetched source pack. Scale/funding cells use only disclosed public signals from the reviewed sources and mark opacity where private vendors did not publish more detail.
