- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - EliseAI can own the full prospect-to-resident workflow
    - Incumbent suites now embed AI across leasing, payments, renewals, and resident data
    - High
    - Request cohort-level win/loss data against Entrata, Yardi, RealPage, and AppFolio by PMS installed base.
  - - Omnichannel agentic UX differentiates EliseAI
    - Peers like Funnel, Knock, Betterbot, LeaseHawk, and PERQ all market AI automation across multiple channels
    - High
    - Separate true workflow outcomes from generic AI claims using response-time, tour, lease, and retention benchmarks.
  - - Marketplace and integration presence can expand reach
    - The same integrations also enable multi-homing and partial displacement instead of hard lock-in
    - High
    - Map whether integrated accounts expand wallet share or simply keep EliseAI as one replaceable layer.
  - - Operational breadth should defend against point solutions
    - Tour24, PERQ, or LeaseHawk can peel away tours, lead capture, or contact-center work without forcing a full-stack switch
    - Medium-High
    - Quantify attach rates for each module and identify which workflows truly drive renewals or NOI.
  - - ROI narrative can justify premium pricing
    - Public pricing is opaque, so buyers may anchor on competitor ROI stories and implementation friction instead of EliseAI list price
    - Medium-High
    - Collect invoice samples, implementation timelines, and realized labor-savings studies for apples-to-apples comparisons.
  - - Trust / compliance posture supports enterprise adoption
    - Incumbents also market fair-housing guardrails, governance, privacy, and compliance-ready AI
    - Medium
    - Document EliseAI guardrails, model controls, auditability, and escalation workflows against incumbent claims.
  - - Capital raised can fund product lead
    - Large 2026 AI-native funding rounds raise the bar for growth and make category narratives more crowded
    - Medium
    - Test whether fresh capital translates into faster product velocity and durable reference accounts rather than just higher spend.
  notes: Severity reflects likely effect on procurement leverage, switching costs, and durability of margin or retention, not a quantified probability of loss. Each row translates public evidence into a diligence workstream.
