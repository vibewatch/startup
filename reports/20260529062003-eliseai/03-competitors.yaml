company:
  name: EliseAI
chapter:
  number: 3
  title: Competitors
  summary: 'EliseAI competes in two overlapping arenas: multifamily operating-system incumbents that are embedding AI into the system of record, and conversational-leasing specialists that can layer on top of those incumbents. The strongest evidence points to a durable but not winner-take-all position for EliseAI: incumbents keep distribution and lock-in, while peers like Funnel, Knock, Betterbot, LeaseHawk, PERQ, and Tour24 prove buyers can multi-home or peel away one workflow without replacing the whole stack.'
sections:
- id: landscape-and-competitive-frame
  title: Landscape and competitive frame
  body: 'EliseAI is not competing against one clean peer set. Its official platform materials describe a broad operating layer that spans prospect conversations, tours, resident communications, maintenance, renewals, delinquency, and reporting, while its Entrata marketplace page shows the product already lives inside incumbent property-management ecosystems rather than only outside them. That means the buyer can solve the same job through at least four paths: an incumbent suite with embedded AI and a system-of-record advantage; a conversational-leasing specialist that centralizes leasing workflows; a resident-operations platform that extends beyond leasing into maintenance and renewals; or a narrower substitute such as self-guided tours or lead-management automation. The common buyer problem is not “who has the best chatbot,” but who can reduce labor, protect lead response speed, preserve compliance, and fit the operator’s existing PMS and CRM stack. The most important competitive distinction
    is therefore platform adjacency. Entrata, RealPage, Yardi, and AppFolio increasingly package AI inside broader operating systems. Funnel, Knock, Betterbot, LeaseHawk, and PERQ attack speed, conversion, centralization, or labor savings at the workflow layer. Tour24 proves that even a single workflow such as after-hours touring can substitute for part of EliseAI’s value proposition. That makes coexistence, integration, and partial displacement at least as likely as pure rip-and-replace competition.'
