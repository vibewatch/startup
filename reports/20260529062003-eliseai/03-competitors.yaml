- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Price / unit / contract model
  - Included capabilities
  - Public price or unknown
  - Implication
  rows:
  - - EliseAI
    - Custom enterprise contract / demo-led sale
    - Leasing, resident communications, tours, maintenance, renewals, delinquency, reporting, integrations
    - List pricing not public
    - Buyers likely evaluate labor savings and workflow breadth rather than sticker price
  - - Entrata
    - Suite contract / module-based sale
    - OS modules plus leasing, payments, renewals, resident experience, ELI+ automation
    - List pricing not public
    - Bundled incumbent pricing can be hard for a point solution to beat in procurement
  - - RealPage / Knock
    - Enterprise quote and module sale
    - CRM, AI Leasing Agent, call intelligence, tours, front-office workflows, Lumina AI
    - List pricing not public
    - Pricing likely rides larger suite or front-office budget rather than isolated chatbot budget
  - - Yardi
    - Enterprise quote and suite sale
    - CRM IQ, Chat IQ, Online Leasing, Virtuoso AI, broader Yardi stack
    - List pricing not public
    - Embedded AI may feel cheaper if already licensed on Yardi / RentCafe
  - - AppFolio
    - Suite contract with add-on services
    - Marketing, leasing, Lisa AI assistant, broader property-management software
    - Official list price not visible; review sites discuss pricing and package variability
    - Mid-market buyers may compare suite simplicity against best-of-breed workflow depth
  - - Funnel
    - Custom quote / outcome-led sale
    - CRM, contact center, AI assistant, renewals, online leasing, marketing automation
    - List pricing not public
    - Vendor sells efficiency and conversion gains rather than transparent seat pricing
  - - Betterbot
    - Custom quote / ROI-led sale
    - Leasing, resident services, maintenance, renewals, delinquency, BI, PMS integrations
    - List pricing not public
    - Large ROI claims suggest value-based selling and raise pressure on EliseAI to prove measurable savings
  - - LeaseHawk
    - Custom quote
    - ACE assistant, CRM, AI contact center
    - List pricing not public
    - Can win as a narrower communication-automation purchase instead of a full resident-ops platform
  - - PERQ
    - Custom quote / marketing spend optimization
    - PPC, conversational AI, nurture automation, reactivation, analytics
    - List pricing not public
    - Can attack the marketing-funnel budget without replacing property-management stack
  - - Tour24
    - Custom quote
    - Self-guided tours, after-hours coverage, smart-tour workflows
    - List pricing not public
    - A single-purpose tour product can undercut the need for a broader AI leasing deployment in some accounts
  notes: Official competitor pages overwhelmingly route buyers to demos and outcome claims instead of publishing comparable list prices. The table therefore compares contract structure and packaging signals rather than claiming a clean net-price benchmark.
