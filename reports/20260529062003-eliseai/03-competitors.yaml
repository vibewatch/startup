- id: lock-in-pricing-and-durability
  title: Lock-in, pricing opacity, and moat durability
  body: 'The best evidence in the source pack cuts both for and against EliseAI. On the positive side, EliseAI is clearly more than a website chatbot: its platform spans leasing and resident operations, and it has enough scale to market itself to 750+ top property-management companies. On the negative side, almost every serious rival now tells an AI, automation, or agentic story. That weakens narrative uniqueness. The more durable question is whether EliseAI can become the workflow layer an operator cannot remove, even when the PMS remains Entrata, Yardi, RealPage, or AppFolio. The evidence today suggests partial lock-in rather than total lock-in. Funnel explicitly works with RealPage. EliseAI itself sells through Entrata Marketplace. Betterbot emphasizes deep PMS integrations. Tour24 and PERQ peel away tours or lead capture without replacing the system of record. Pricing opacity compounds the risk. Most official pages route buyers to demos or outcome claims instead of public list prices,
    which means buyers compare labor savings, conversion, and implementation friction more than sticker price. That favors vendors with strong ROI evidence, but it also makes switching-cost analysis difficult from public data alone. The practical underwriting view is that EliseAI has a credible product edge, but adverse displacement risk remains high wherever incumbents can bundle “good enough” AI or where operators only need one narrower workflow solved.'
