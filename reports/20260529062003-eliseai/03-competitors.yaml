  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized contract prices, implementation fees, and discount structures for EliseAI and the main rivals by property count or portfolio size.
    whyItMatters: Most official pages are demo-led, so public surfaces do not allow apples-to-apples net-price benchmarking or payback analysis.
    diligencePath: Request customer contracts, SOWs, invoice samples, and implementation timelines across at least one incumbent suite, one direct specialist, and one workflow substitute.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Account-level data on how often customers run EliseAI alongside Entrata, Yardi, RealPage, Funnel, Betterbot, PERQ, LeaseHawk, or Tour24 versus replacing them outright.
    whyItMatters: Moat durability depends on whether EliseAI becomes a hard-to-remove workflow layer or just one modular add-on in a multi-vendor stack.
    diligencePath: Collect implementation diagrams, churn analyses, module-attach data, and top-account stack maps segmented by incumbent PMS.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: win-rates
    missingEvidence: Independent win-loss data by incumbent ecosystem, property size, centralization model, and operator archetype.
    whyItMatters: Without segmented win-rate evidence, it is difficult to judge where EliseAI truly outperforms bundled incumbent AI versus point-solution specialists.
    diligencePath: Request CRM opportunity data, competitive battlecards validated against closed-lost deals, and third-party reference calls from operators on each major PMS.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
    - TP004
