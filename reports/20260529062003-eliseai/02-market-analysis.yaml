- id: buyer-map
  title: Buyer, user, and payer segmentation
  body: 'Budget authority in this market sits with housing operators rather than with residents. The buyer is typically the owner-operator, third-party manager, affordable portfolio manager, or portfolio operations/IT leader who controls portfolio software spend and staffing design. The day-to-day users are more fragmented: onsite leasing agents, centralized leasing teams, resident-service teams, property managers, marketers, compliance staff, and the prospects or residents interacting with the system. Multiple public sources show why this matters. Mordor says property managers and agents accounted for 42.73% of 2025 property-management-software outlays, while CMI says property managers are the largest end-user segment at 45.4% of 2026 share. EliseAI’s own pricing explainer describes per-unit, tiered, and enterprise-flat-fee buying patterns, especially for larger portfolios. Product pages from EliseAI and Entrata both emphasize owner operators, fee managers, affordable portfolios, student
    housing, and SFR as distinct operating environments. Practically, adoption tends to start where centralized teams can capture cross-property scale: lead intake, tour scheduling, follow-up, resident service triage, renewals, and delinquency workflows.'
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
