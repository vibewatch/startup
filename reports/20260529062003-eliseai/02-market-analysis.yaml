company:
  name: EliseAI
chapter:
  number: 2
  title: Market Analysis
  summary: 'EliseAI sits inside a narrower workflow market than generic proptech or broad property-management software: AI-native leasing, resident communications, and centralized operating workflows for multifamily and adjacent housing portfolios. Public market estimates for property-management software vary widely, from $6.53 billion to $30.80 billion in 2026, but a constrained North American residential lease-and-tenant-management slice is closer to roughly $0.5-2.3 billion using transparent share assumptions. Buyer power sits with owner-operators and third-party managers, while end users are onsite and centralized teams serving prospects and residents. Adoption is being pulled forward by staffing strain, after-hours response expectations, and proven conversion ROI, but bounded by fair-housing, tenant-screening, privacy, and automated-outreach rules.'
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'EliseAI should be analyzed as workflow software for housing operators, not as generic real-estate software. Its own platform pages define the product around leasing, resident management, maintenance, renewals, delinquency, and reporting, delivered across voice, SMS, email, and web chat. That puts the company in the intersection of property-management software, leasing automation, and resident-communication tooling. The included spend is therefore operator-paid software and service spend tied to prospect response, tour scheduling, resident service, collections, workflow routing, and centralization enablement. Excluded spend includes pure accounting-led PMS modules, construction tech, brokerage CRMs, one-off call centers, and non-housing vertical contact-center AI. The practical substitute set is not empty: AppFolio, Yardi, RealPage, and Entrata all frame the market around leasing, payments, maintenance, compliance, reporting, and resident portals, while manual site teams still cover
    the same jobs through phone calls, email, spreadsheets, and after-hours staffing. EliseAI’s wedge is that it layers always-on conversational automation and centralization on top of those existing systems rather than asking operators to rip out every system of record on day one.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing lenses and transparent demand constraints
  body: 'The public market is large enough to matter, but the number depends almost entirely on boundary discipline. Broad property-management-software pages span a global 2026 estimate of $6.53 billion from Mordor, $7.28 billion from The Business Research Company, and $30.80 billion from Coherent Market Insights. That spread is too wide to use as a single TAM without adjustment. A more useful approach is to anchor on a constrained lens: North America represented 40.27% of 2025 PMS revenue in Mordor, residential assets represented 58.19% of 2025 spend, and lease-and-tenant-management modules represented 35.44% of sales. Applied transparently, that yields a North American residential leasing-and-resident-operations software slice of roughly $0.5-2.3 billion, with a base case near $0.6 billion. Demand conditions also matter more than headline TAM. JCHS counted 46.1 million renter households, Yardi projected 458,731 multifamily completions in 2026, and Apartments.com expects AI-based leasing
    to scale in 2026 even as supply slows. Those data points support a large recurring workflow base and continued operator urgency around conversion, renewal, and service responsiveness.'
