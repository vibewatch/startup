- id: contradictions-and-gaps
  title: Contradictions and diligence gaps
  body: 'The key analytical mistake would be to treat every property-management-software number as if it described EliseAI’s actual addressable market. The public estimates differ because some pages describe all PMS spend, others include broad proptech or adjacent modules, and still others mix residential, commercial, and facilities workflows. Public evidence is also thin on real category pricing, market share, or deployment timelines by segment. EliseAI’s materials explain common pricing structures and cite ROI outcomes, but they do not disclose average contract value, churn, or win rates against AppFolio, RealPage, Yardi, or Entrata. Nor is there a vendor-neutral public dataset that cleanly separates conversational leasing automation from full-suite PMS spend. The right diligence stance is therefore: use the constrained North American residential workflow slice as the decision-grade lens; treat broad PMS figures as outer context, not valuation inputs; and request customer cohort data,
    pricing by portfolio type, and compliance-workflow performance before underwriting aggressive share-capture assumptions.'
