callouts:
- calloutType: strength
  title: Always-on response turns AI from feature into operating model
  body: The strongest evidence is not a speculative TAM chart but the combination of 24/7 response, after-hours coverage, and centralization outcomes. Once operators believe missed leads, renewals, and service requests are measurable margin leakage, leasing automation becomes an operations budget line rather than a chatbot experiment.
  claimRefs:
  - CM022
  - CM023
  - CM025
  - CM026
  - CM027
  - CM028
- calloutType: risk
  title: Fair-housing and automated-outreach rules are hard constraints, not soft ethics
  body: Housing AI cannot be evaluated like a generic marketing copilot. HUD, CFPB, FTC, and FCC sources all show that screening, ad targeting, scoring, robocalls, and robotexts carry live legal exposure. Any market-share assumption that ignores compliance design, audit logs, or human override is overstated.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
  - CM037
  - CM038
  - CM040
- calloutType: insight
  title: Decision-grade market sizing is far narrower than broad PMS TAM pages
  body: The credible way to size EliseAI is to start with broad PMS context and then narrow to North American residential lease-and-tenant workflows. That workflow slice still matters strategically, but it is materially smaller than the headline $30B-style pages that bundle together unrelated property, facilities, and commercial software spend.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
