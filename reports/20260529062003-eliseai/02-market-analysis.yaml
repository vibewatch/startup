  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Operator-level contract values, pricing by portfolio size, and actual software spend per unit for EliseAI and closest workflow alternatives.
    whyItMatters: Without disclosed contract values, market sizing can only rely on outer-category estimates and vendor-authored pricing heuristics.
    diligencePath: Request anonymized customer contracts or cohort-level ACV / price-per-unit data segmented by owner-operator, fee manager, and affordable portfolio.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: A vendor-neutral public market-share view for AI-native leasing and resident-operations software versus incumbent PMS suites.
    whyItMatters: Valuation depends on whether EliseAI is taking share from a specialist subcategory or from large incumbent system suites.
    diligencePath: Ask management for competitive-loss data, renewal cohorts, and third-party benchmark surveys covering AI leasing automation specifically.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-boundary
    missingEvidence: A reconciled methodology that explains why global PMS estimates range from $6.53B to $30.80B in 2026 and how much of each estimate is truly residential.
    whyItMatters: Unreconciled boundary inflation can overstate TAM and encourage unjustified market-share assumptions.
    diligencePath: Request analyst methodology notes or rebuild a bottoms-up model from disclosed module, geography, and property-type shares.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: regulated-workflow-performance
    missingEvidence: Public benchmarks on deployment time, compliance exceptions, and automation rates in affordable or other regulated portfolios.
    whyItMatters: Regulated segments appear attractive but may require more human review and longer implementation cycles than conventional multifamily.
    diligencePath: Request implementation case studies with deployment timelines, human-escalation rates, and compliance audit outcomes for affordable portfolios.
    relatedQuestionRefs:
    - QM026
