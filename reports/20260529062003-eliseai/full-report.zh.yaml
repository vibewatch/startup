        title: 结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开记录足以说明 EliseAI 已达到真实商业规模，但不足以承销估值或下行。收入质量看起来优于功能单薄的点状方案，因为产品嵌入经常性工作流，案例显示客户用平台保护
              NOI，而不只是改善响应时间。同时，监管条件是一把双刃剑。公司正把费用透明和租约审计需求变成可货币化功能，但同样的监管和法律压力意味着，触及租金、费用或租约条款的产品将持续承担合规和声誉风险。DOJ 的
