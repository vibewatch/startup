      - number: '1.3'
        title: 里程碑、合作与监管背景
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的里程碑节奏显示，公司正从品类切口走向更广泛的基本服务平台。它在 2023 年 1 月宣布平台覆盖 100 万套单元，同年 6 月完成 Series C，2024 年 8 月凭 Series D
              进入独角兽行列，2025 年开设 San Francisco 和 Chicago 办公室，并借 Series E 把自己定位为服务住房和医疗的 AI 公司。合作也把产品推近运营基础设施：Zillow
              Rentals 将 EliseAI 嵌入房源级租赁工作流，Brivo 则补上安全 AI 自助看房所需的门禁管线。公开证据显示运营商确有采用，包括 Asset Living 的 45 万套单元部署，以及覆盖
              3,763 个社区的 EliseAI/ALN 研究。这个顺序值得注意：融资、办公室扩张、合作和客户证明都集中在 2024–2025 年，说明 EliseAI
              正用新资本把消息软件做成业主和运营商更深嵌的运营层。相关下行视角来自行业层面的公平住房审查：2024 年 SafeRent 和解报道说明，涉住房 AI 系统可能遭遇歧视挑战；EliseAI 自己的 2025
              年支持文档强调标准答案、受保护类别转人工和中性处理，更像风险控制姿态，而非经独立审计的结果。
