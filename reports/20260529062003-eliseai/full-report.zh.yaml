      - 机制
      - 单位
      - 当前价值/状态
      - 质量
      - 尽调要求
    rows:
      - - 住房沟通自动化
        - 租赁、住户、续租、逾期和维修工作流，作为企业 AI 模块销售
        - 企业 SaaS / 模块合约
        - 披露部署基础最大；600+ 业主 / 运营商，覆盖美国公寓市场 10%
        - 采用证据较强；金额披露薄弱
        - 要求提供住房 ARR、各模块附加率和续约率
      - - EliseCRM 中枢
        - 免费或随产品包含的 CRM 层，集中承载数据、报表、报价和工作流
        - 随附的平台锚点
        - 明确称为免费 / 已包含，但变现影响是间接的
        - 角色定位清晰；无独立经济性
        - 要求提供附加率、实施收入，以及 CRM 主导落地带来的转化提升
      - - Lease Audits
        - 用 AI 对比住户台账和租约，发现差异并保护收入
        - 附加模块；一次性或持续使用
        - 定位为收入追回和合规功能；称审计周转只需 1–2 天
        - 中
        - 要求提供每处物业价格、追回率和持续使用组合
      - - Fee Transparency Suite
        - 在报价、申请、聊天、组件和 PDF 中统一费用披露逻辑
        - 合规附加项 / 工作流模块
        - 支持监管响应和信任建设，但未公开标价
        - 中
        - 要求按州提供附加率、合同价值和留存影响
      - - 催收和续租自动化
        - 自动提醒、还款承诺支持、逾期跟进和续租工作流
        - 经常性工作流模块
        - 案例研究显示逾期下降、应收款被追回
        - 中
        - 要求按队列提供坏账下降和续约率提升
      - - 医疗自动化
        - 前台、呼叫中心、排班、预授权和账单支持
        - 企业工作流合约
        - 战略第二垂直；未披露按专科拆分的收入或客户数
        - 中低
        - 要求提供医疗 ARR、毛利率、客户数和销售周期数据
    notes: 公开证据能确认模块类别和工作流定位，但无法确认各业务流已签约 ARR；因此各行描述的是变现架构，而非经审计的收入结构。
