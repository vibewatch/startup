  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值或证据
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前 ARR 低于 $150M
        - 管理层披露、尽调室或审计报表显示 ARR 明显低于支撑哪怕 15x 倍数所需水平。
        - 打破“当前估值已由远强于公开证据的经济性支撑”的论点。
        - 按 7x–10x 或更低倍数重做估值，并假设下行至基准情景或更低。
      - - 毛利率弱或留存差
        - 毛利率远低于软件常态，或 NRR / 流失显示耐久性差。
        - 业务从高溢价软件变成质量较低的自动化 / 服务经济性。
        - 下调可比公司组，并要求入场价格显著降低。
      - - 非标准优先股堆叠
        - 清算优先权、参与型优先股或大量老股交易，显著削弱新钱的下行保护或普通股回报。
        - 名义估值不再干净映射到可投资股权价值。
        - 要求清算瀑布模型，并按优先权后的结果重设定价。
      - - 多户住宅 AI 监管升级
        - 新的反垄断、公平住房或消费者保护行动，从 RealPage 式定价工具扩展到相邻工作流 AI。
        - 推高全品类合规成本和倍数压缩风险。
        - 加入监管折扣，并放慢任何投资决策。
      - - 房东预算压力延续到 2026 年
        - 租金增长疲弱、优惠增加和入住率压力，使运营商继续处于成本控制模式。
        - 拉长销售周期，降低为高溢价软件付费的意愿。
        - 除非 ROI 证据异常强，否则转向基准或悲观情景。
    notes: 这些触发项是可监测的公开或尽调事件，可实质改变估值判断，而不是小幅运营偏差。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
      - CV045
      - CV047
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 按分部拆分的当前 ARR
        - 住房 ARR、医疗 ARR、实施收入和当前季度运行率。
        - 判断 22x 公开下限倍数是否已经过时，还是仍应作为锚。
        - 向 CFO 索取经审计或董事会批准的 ARR 桥接表。
      - - 毛利率和烧钱速度
        - 按产品线拆分的毛利率、经营烧钱速度和 Series E 后现金跑道。
        - 区分高溢价软件经济性与人力密集型自动化经济性。
        - 要求提供月度财务包和预算 vs 实际。
      - - 留存与集中度
        - NRR、总留存率、最大客户占比和续约队列。
        - 判断装机基数规模是否足够耐久、多元，能支撑高溢价倍数。
        - 要求提供队列表和前 20 大客户收入集中度。
      - - 定价与单位经济性
        - 按单元 / 站点定价、合同长度、增购节奏和销售回本周期。
        - 解释 ARR 能否从当前基数高效复利增长。
        - 要求提供标准订单表和最近队列经济性。
      - - 股权结构表与优先股堆叠
        - Series E 每股价格、清算优先权、反稀释条款和老股交易。
        - 判断真实下行保护和普通股回报。
        - 从律师处取得章程、融资文件和清算瀑布模型。
      - - 医疗扩张质量
        - 医疗垂直领域的客户数、ARR 和利润率情况。
        - 乐观情景估值假设第二垂直领域带来的不只是 TAM 幻灯片。
        - 要求提供独立医疗 KPI 包和客户访谈名单。
    notes: 这些问题聚焦少数几组数据，最可能快速改变建议或清除当前估值悬念。
    claimRefs:
      - CV036
      - CV037
      - CV042
      - CV046
      - CV047
