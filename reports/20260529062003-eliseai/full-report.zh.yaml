      - - 合作伙伴 / 集成依赖
        - 主流技术栈覆盖一致性、合作伙伴路线图变化和渠道集中度
        - 丢失主要集成路径、Zillow 议价力上升，或 OpenAI / 模型经济性恶化
        - 降低对扩张和续约的信心；建模时放慢增长、提高支持成本
      - - 既有厂商竞争 / 集中度
