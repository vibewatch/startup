  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与住房工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              EliseAI 已远超单一租赁机器人，如今营销的是覆盖从潜客到住户旅程的住房运营栈。公开产品界面以 EliseCRM 为中心，把它作为访客卡、日历、任务、活动、报表和对话历史的记录系统，再在其上叠加
              LeasingAI、ResidentAI、VoiceAI
              和维修自动化。落到具体工作流，公司承诺从房源或网站捕获新线索，通过语音、SMS、邮件和聊天回答后续问题，预约看房，推进续租和欠费触点，并把住户维修对话转成分派后的工单。


              这种宽度不只是命名。下一代平台发布明确把维修、续租、欠费和一般住户请求归入住户服务界面；当前产品页则把 Maintenance App 推成一体化现场执行层，而不是单独外挂。PeakMade、Mill
              Creek、Greystar 和 GoldOller 等具名客户故事支持 EliseAI 用于组合运营这一判断，但最强公开证明仍是公司托管的案例材料，而不是完全独立基准。
