      - number: '3.2'
        title: 既有套件正在把 AI 嵌入记录系统
        blocks:
          - type: paragraph
            body: >-
              EliseAI 最难轻视的竞争者，是多户住宅软件既有厂商，因为它们不必逐项功能胜过 EliseAI 才有威胁。Entrata 如今称自己是 Autonomous Property Management
              的操作系统，并明确表示 AI 已嵌入租赁、支付、续租和住户体验。它的 Leasing AI 覆盖文本、邮件、SMS、语音、聊天、多语言支持、看房排期、线索资格判断和中心化活动记录。RealPage
              正做类似动作：其 CRM 界面现在推广带 AI Leasing Agent、通话智能和看房功能的 Knock CRM，Lumina AI Workforce 则把专用 AI
              智能体定位到多户住宅运营全流程。Yardi 同样激进：Virtuoso 称 AI 建在一个完全连接、受治理平台的每个运营环节里，Chat IQ 和 CRM IQ 则把对话式 AI
              直接接到客户互动和客户智能工作流。AppFolio 也没有停步；Lisa 24/7 工作，Realm-X 围绕智能体式 AI
              加入明确信任、隐私和责任框架。这很重要，因为这些既有套件已经拥有核心记录、支付、续租、租赁工作流或住户数据。如果它们的 AI
              “足够好”，采购方可能偏好嵌入式自动化，而不是单独采购供应商，尤其当公平住房护栏、治理或合规叙事可由同一既有厂商关系提供时。
