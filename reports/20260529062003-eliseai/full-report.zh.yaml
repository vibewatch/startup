  - id: TR001
    title: 监管 / 法律风险清单
    columns:
      - 规则 / 案件
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓释措施
      - 剩余暴露
      - 尽调路径
    rows:
      - - Fair Housing Act + HUD AI 租户筛查 / 广告定向指引
        - 美国住房
        - 生效；HUD 2024 年发布 AI 专项指引
        - 中
        - 严重
        - EliseAI 可以把范围限制在沟通 / 支持，并在资格判定或不利决定上保留人工复核
        - 公开来源未显示 EliseAI 做过独立公平住房审计或差异影响测试
        - 索取公平住房审查备忘录、偏差测试输出，以及潜客资格判定 / 广告定向的升级规则
      - - SafeRent 算法住房评分供应商诉讼先例
        - 美国住房诉讼
        - DOJ 支持的 FHA 案件顶住了筛查供应商的驳回请求
        - 中
        - 高
        - 避免用黑箱评分判断租户资格，并记录模型因素为何适用
        - 原告可把任何不透明筛查或排序逻辑类比为 SafeRent 式差异影响主张
        - 请产品 / 法务梳理 EliseAI 在申请分流、评分或筛查输出中施加影响的位置
      - - CFPB / FCRA 不利行动与租户筛查通知义务
        - 美国消费者金融 / 住房
        - 当前披露和争议权利仍然有效
        - 中
        - 高
        - 当 AI 参与拒绝或定价决策时，保留可解释规则、审计日志和争议工作流
        - 即便没有明确偏见，不透明或解释不足的自动化也可能造成通知和争议处理失灵
        - 审查不利行动模板、解释逻辑，以及有争议租赁决策的升级路径
      - - TCPA 机器人短信 / 自动电话同意撤回
        - 美国通信
        - FCC 将一项跨主题规则延至 2027 年，但撤回同意仍会阻断更多受覆盖电话 / 短信
        - 中
        - 高
        - 在各产品和客户间集中管理同意获取、STOP 处理和禁发名单
        - 任何选择退出处理不一致，都可能带来法定赔偿和集体诉讼暴露
        - 索取电话 / 短信的同意架构、关键词处理日志和供应商合同语言
      - - 医疗隐私 / 录音通信
        - 美国医疗隐私
        - HC 政策确认会为服务交付录音并广泛收集数据
        - 中
        - 高
        - 使用 BAA、最小权限访问和产品级数据隔离
        - 患者沟通、收件箱副本和凭证会在住房工作流之外制造泄露与滥用暴露
        - 审查 HIPAA 架构、访问控制、泄露通知 playbook 和留存时间表
    notes: 仅基于公开材料、按严重性排序的法律清单；缓释措施描述公司可能采取的应对，剩余暴露突出公开证据仍未验证的事项。
