    summary: 住房运营商从租赁自动化扩展到同一账户下的住户、维护、续租和催收工作流时，EliseAI 才创造价值。
    data:
      items:
        - label: 管理层指令
          description: 业主、资产管理或物业管理领导层希望提高入住率、降低拖欠，并减少现场瓶颈。
        - label: 潜客捕获
          description: LeasingAI 和 VoiceAI 通过网页、短信、邮件和电话即时响应线索，避免非工作时间需求流失。
        - label: 看房 / 申请
          description: 运营商用 AI 导览看房、排期和跟进，把线索推进到看房、申请和签约。
        - label: 入住 / 住户服务
          description: 住户沟通、维护报修和语音渠道吸收重复请求，团队处理例外。
        - label: 续租 / 催收
          description: 续租和欠款模块自动发送提醒、催促和带上下文的转交，改善现金流和通知时点。
        - label: 账户扩展
          description: 工作流数据和团队设计进入 EliseAI 后，客户扩展模块和集中化范围，而不是只做一次性试点。
    claimRefs:
      - CU005
      - CU006
      - CU020
      - CU046
      - CU047
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 最强的公开部署从狭窄痛点开始，在真实组合上证明 ROI，再扩展到更宽的集中化运营模式。
    data:
      nodes:
        - id: pain-point
          label: 痛点
          detail: 人员压力、错过非工作时间需求、催收差或维护过载造成紧迫感。
        - id: pilot
          label: 试点部署
          detail: 客户从一个产品、一组站点或一段组合切片开始，测试 AI 表现与既有流程的差异。
        - id: quant-proof
          label: 量化证明
          detail: 运营商衡量线索到看房、入住率、续租、催收、节省工时或工单结果。
        - id: module-expand
          label: 模块扩展
          detail: 初始证明后，租赁扩展到续租、欠款、维护、语音或导览看房。
        - id: centralization
          label: 集中化运营模式
          detail: 运营商围绕一个 AI 加人工控制层重设计工作流、任务路由或托管服务。
        - id: portfolio-rollout
          label: 组合推广
          detail: 推广变成组合级或客户级，EliseAI 成为运营系统的一部分，而不是点状工具。
      edges:
        - from: pain-point
          to: pilot
        - from: pilot
          to: quant-proof
        - from: quant-proof
          to: module-expand
        - from: module-expand
          to: centralization
        - from: centralization
          to: portfolio-rollout
    claimRefs:
      - CU009
      - CU013
      - CU016
      - CU019
      - CU021
      - CU027
      - CU038
      - CU047
      - CU050
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 当 EliseAI 发布运营商名称加硬指标时，证据质量最强；公开证明停留在标识或精选评价时最弱。
    data:
      columns:
        - 结果具体度
        - 投资组合规模可见度
        - 留存可见度
        - 反向 / 合规风险暴露
      rows:
        - label: Asset Living / RPM / CAF
          values:
            - 高
            - 高
            - 中
            - 低
        - label: Landmark / 学生公寓案例
          values:
            - 高
            - 高
            - 中
            - 低
        - label: Michaels / 可负担住房与军人住房扩张
          values:
            - 中
            - 高
            - 低
            - 中
        - label: Brookfield / 欠缴媒体证据
          values:
            - 中
            - 中
            - 低
            - 高
        - label: 通用评价 / 参考平台
          values:
            - 低到中
            - 低
            - 低
            - 中
    claimRefs:
      - CU042
      - CU043
      - CU044
      - CU048
      - CU050
  - id: FR001
    title: 风险热力图——可能性与影响
    type: matrix
    layout: wide
    summary: 按严重程度将 EliseAI 的主要风险放入 3×3 可能性—影响矩阵。影响最高的格子是公平住房 / 模型偏见风险、隐私 / 同意失误，以及可能迅速波及客户的可靠性或渠道依赖。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - null
            - 快速招聘带来交付压力；PMS 对等能力不均
            - 现有系统原生 AI 竞争；大型技术栈集成出问题
        - label: 中等可能性
          values:
            - 信任门槛 / 披露缺口
            - VoiceAI 宕机 / 转接负担；可负担住房工作流错误
            - 公平住房 / 模型偏见挑战；TCPA / 隐私失误；Zillow / OpenAI 牵制
        - label: 低可能性
          values:
            - null
            - 单一大客户流失事件
            - 重大医疗隐私事件，或算法歧视诉讼胜诉
    claimRefs:
      - CR029
      - CR031
      - CR035
      - CR045
      - CR046
      - CR047
      - CR048
  - id: FR002
    title: 风险传导图——风险如何传导至收入、利润率与信任
    type: dag
    layout: wide
    summary: 有向图展示合规、可靠性和依赖风险如何传导到服务质量、客户信任、收入韧性和融资假设。
    data:
      nodes:
        - id: r-fha
          label: 公平住房 / 偏见挑战
          detail: 算法歧视、筛选不透明，或广告定向投诉
        - id: r-privacy
          label: 隐私 / 同意失误
          detail: 通信录音、收件箱副本，或选择退出处理失误
        - id: r-outage
          label: VoiceAI 宕机
          detail: 服务中断把来电推回客户团队
        - id: r-partner
          label: 合作伙伴 / 渠道依赖
          detail: Zillow、OpenAI 或 PMS 的变化不受 EliseAI 控制
        - id: i-service
          label: 服务质量下降
          detail: 漏掉线索、响应变慢，或靠人工绕行
        - id: i-trust
          label: 客户信任侵蚀
          detail: 物业运营方质疑合规或可靠性主张
        - id: i-revenue
          label: 收入 / 留存压力
          detail: 扩张放缓、续约走弱，或预订放慢
        - id: i-margin
          label: 利润率承压
          detail: 支持、补救或合规成本上升
        - id: i-valuation
          label: 估值压力
          detail: 增长倍数压缩，尽调条件收紧
      edges:
        - from: r-fha
          to: i-trust
          label: 法律 / 声誉冲击
          critical: true
        - from: r-fha
          to: i-revenue
          label: 客户犹豫 / 丢单
        - from: r-privacy
          to: i-margin
          label: 补救 + 法律成本
          critical: true
        - from: r-privacy
          to: i-trust
          label: 敏感数据顾虑
        - from: r-outage
          to: i-service
          label: 人工转接
        - from: i-service
          to: i-trust
          label: 体验变差
        - from: r-partner
          to: i-revenue
          label: 渠道 / 技术栈牵制
          critical: true
        - from: i-trust
          to: i-revenue
          label: 续约 / 扩张拖累
          critical: true
        - from: i-margin
          to: i-valuation
          label: 成本基底抬高
        - from: i-revenue
          to: i-valuation
          label: 增长倍数压缩
          critical: true
    claimRefs:
      - CR035
      - CR045
      - CR046
      - CR047
      - CR048
  - id: FR003
    title: 依赖图——EliseAI 周边关键外部平台
    type: dag
    layout: wide
    summary: 有向图展示最直接影响 EliseAI 产品对等性、分发和客户交付的合作伙伴、系统栈和竞争对手。
    data:
      nodes:
        - id: d-appfolio
          label: AppFolio
          detail: API 附加项以及 AppFolio Max / Plus 限制影响产品对等性
        - id: d-realpage
          label: RealPage / Knock
          detail: RealPage 需要受支持的 CRM，也与原生 AI 租赁功能竞争
        - id: d-yardi
          label: Yardi / RentCafe
          detail: 已支持 Voyager / RentCafe，但不支持 Yardi Breeze
        - id: d-entrata
          label: Entrata
          detail: 原生支持最深，但也是直接 AI 竞争者
        - id: d-zillow
          label: Zillow Rentals
          detail: 市场平台线索获取和原生 AI Assist 分发
        - id: d-openai
          label: OpenAI
          detail: 医疗 API 合作伙伴和验证层
        - id: d-elise
          label: EliseAI 平台
          detail: 面向住房和医疗工作流的跨系统栈自动化层
        - id: d-customers
          label: 大型运营方 / 医疗服务商
          detail: 多户住宅、可负担住房和医疗客户
      edges:
        - from: d-appfolio
          to: d-elise
          label: PMS / CRM 依赖
          critical: true
        - from: d-realpage
          to: d-elise
          label: PMS + CRM 依赖
          critical: true
        - from: d-yardi
          to: d-elise
          label: Voyager / RentCafe 依赖
          critical: true
        - from: d-entrata
          to: d-elise
          label: 深度集成 + 竞争
          critical: true
        - from: d-zillow
          to: d-elise
          label: 线索分发
          critical: true
        - from: d-openai
          to: d-elise
          label: 医疗模型层
        - from: d-elise
          to: d-customers
          label: 自动化工作流与沟通
          critical: true
        - from: d-zillow
          to: d-customers
          label: 潜在客户入口
    claimRefs:
      - CR010
      - CR012
      - CR013
      - CR015
      - CR017
      - CR036
      - CR037
      - CR039
      - CR045
      - CR047
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 展示强采用率和增长如何支撑投资逻辑，但倍数和股权结构表问题仍未解决，建议只能维持“继续研究”。
    data:
      nodes:
        - id: adoption
          label: 采用：600+ 家运营方；每 8 套公寓中有 1 套
        - id: growth
          label: 增长：Series C 后 ARR >2.5x；2025 年 ARR >$100M
        - id: latest-mark
          label: 最新估值：Series E 轮估值 >$2.2B
        - id: comp-gap
          label: 可比差距：ARR 下限约 22x，上市可比公司均值约 5x
        - id: term-gap
          label: 条款缺口：未公开披露利润率、留存或优先股堆叠
        - id: decision
          label: 决策：财务和股权结构表尽调补齐缺口前，继续研究
      edges:
        - source: adoption
          target: latest-mark
        - source: growth
          target: latest-mark
        - source: latest-mark
          target: comp-gap
        - source: comp-gap
          target: decision
        - source: term-gap
          target: decision
        - source: growth
          target: decision
    approximationNotes: 这条流程是逻辑推演，不是统计模型；它概括了为什么强商业证据还不等于估值风险出清。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV028
      - CV036
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 接近或超过最新私人市场估值所需的 ARR 与倍数组合。
    data:
      items:
        - label: $100M ARR × 5x 倍数
          value: 0.5
        - label: $100M ARR × 8x 倍数
          value: 0.8
        - label: $100M ARR × 10x 倍数
          value: 1
        - label: $100M ARR × 15x 倍数
          value: 1.5
        - label: $150M ARR × 8x 倍数
          value: 1.2
        - label: $150M ARR × 10x 倍数
          value: 1.5
        - label: $220M ARR × 10x 倍数
          value: 2.2
        - label: $220M ARR × 12x 倍数
          value: 2.64
        - label: 最新私人市场估值
          value: 2.2
    approximationNotes: 数值以十亿美元计，基于最新披露估值和 ARR 下限，而不是公司提供的经营模型。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 乐观、基准、悲观估值区间与最新私人市场估值对比。
    data:
      items:
        - label: 悲观情景
          low: 0.4
          high: 0.72
        - label: 基准情景
          low: 0.9
          high: 1.8
        - label: 乐观情景
          low: 2
          high: 3.5
        - label: 最新私人市场估值
          low: 2.2
          high: 2.2
    approximationNotes: 区间只具方向性，投资测算时的实际 ARR 和利润率质量会显著左右结果。
    claimRefs:
      - CV011
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式评分，覆盖后期入场决策最关键的维度。
    data:
      items:
        - label: 存量客户验证
          value: 8
          unit: /10
        - label: 增长韧性
          value: 8
          unit: /10
        - label: 品类定位
          value: 8
          unit: /10
        - label: 公开披露质量
          value: 3
          unit: /10
        - label: 下行保护可见度
          value: 2
          unit: /10
        - label: 监管背景
          value: 4
          unit: /10
        - label: 估值纪律
          value: 3
          unit: /10
    approximationNotes: 评分是定性投委会辅助指标，来自本章证据，并非加权模型输出。
    claimRefs:
      - CV013
      - CV014
      - CV035
      - CV036
      - CV038
      - CV043
      - CV044
      - CV045
