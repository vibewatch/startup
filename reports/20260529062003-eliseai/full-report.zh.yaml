      - number: '6.2'
        title: 具名部署与量化客户结果
        blocks:
          - type: paragraph
            body: >-
              本章最好的证据来自具名部署：EliseAI 嵌入生产工作流，运营商也愿意发布前后对比结果。CAF、Asset Living、RPM Living、Landmark、Mill Creek、Student
              Quarters、GoldOller、S2、Michaels 和 Brookfield 都提供了组合规模、推广范围和指标变化的某种组合。共同模式是，EliseAI
              从租赁或欠费消息起步；一旦运营商看到足够提升，便扩展到续租、维修、语音或 AI 引导看房。


              重要的是，并非所有具名客户证据质量相同。有些行很强，因为包含多个运营指标和推广细节；有些较弱，因为证据仅限于融资新闻稿或单一新闻 / 访谈引用。即便如此，这组证据仍足以说明 EliseAI
              已越过只收集客户标识的阶段。最强公开引用不是带漂亮引语的试点，而是组合级部署，并配有响应时间、转化、催收、续租或维修指标，显示软件已进入日常运营系统。
