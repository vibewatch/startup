      - number: '2.5'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              关键分析错误，是把每一个物业管理软件数字都当成 EliseAI 的真实可触达市场。公开估算不同，是因为有的页面描述全部 PMS 支出，有的纳入广义 proptech
              或相邻模块，还有的混合住宅、商业和设施工作流。公开证据也很少披露真实品类定价、市场份额或各细分部署周期。EliseAI 的材料解释了常见定价结构并引用 ROI 结果，但没有披露平均合同价值、流失率，或相对
              AppFolio、RealPage、Yardi、Entrata 的胜率。也没有一个厂商中立的公开数据集，能把对话式租赁自动化从全套 PMS
              支出中干净切出来。正确的尽调姿态应是：用受约束的北美住宅工作流切片作为决策级口径；把广义 PMS 数字当外部背景，而不是估值输入；在承销激进份额获取假设前，要求查看客户群组
              数据、不同组合类型的定价和合规工作流表现。
            claimRefs:
