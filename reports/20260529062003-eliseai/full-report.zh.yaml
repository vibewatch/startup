      - number: '5.4'
        title: 信任、合规与已知限制
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的公开合规姿态在保障性住房叙事里最成熟：它强调一致的预批准回复、便于审计的日志、住宿便利请求升级，以及通过标准化处理降低偏见风险。这些都是合理的工作流护栏，也契合 Fair Housing Act
              底线。但公开证明仍更偏流程主张，而非独立验证。本轮研究找到了隐私和支持界面，以及 TechCrunch
              关于删除和退出权利的报道，但没有验证到住房特定的偏见审计、公开住房信任包，或能让投资人从外部测试控制质量的详细安全认证。


              限制叙事同样复杂。TechCrunch
              提到一些对话中关于细微语境、人工转接和资格判断不完整的投诉——自动化触及租赁或合规敏感工作流时，这些正是关键失效模式。公开文档还显示公司依赖外部模型提供商，部分支持文档也被登录墙挡住。这些都没有破坏产品论题，但意味着尽调应聚焦治理、升级阈值和连接器可靠性，而不能假设营销界面的宽度会在所有地方自动转化为生产级控制。
