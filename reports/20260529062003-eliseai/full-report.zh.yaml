      - number: '6.4'
        title: 扩张动作与集中风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，EliseAI 更像是在账户内部扩张，而不是赢下一串互不相关的点状方案试点。Asset Living、RPM、Michaels、Landmark 和 Student Quarters
              都使用多个模块，官方定位也已把租赁、续租、欠费、维修、语音、CRM
              和引导看房视为一套住户生命周期系统。这对耐久性很重要：一旦平台处理多个沟通渠道和住户旅程中的多个步骤，替换它就变成运营模式决策，而不只是软件替换。


              集中风险在于，本章几乎所有强公开引用仍来自美国住房，尤其是大型多户住宅、学生公寓和大型费用管理方组合。办公室、酒店或更广 CRE 业主工作流的公开证明很薄，也没有公开头部客户收入披露，无法显示账本在
              REITs、PMCs 和业主运营商之间的多元化程度。换句话说，EliseAI 在最强之处拥有强渗透，但本章无法证明收入基础在客户群组间有多均衡，也无法证明当前规模有多少集中在相对少数企业运营商手里。
