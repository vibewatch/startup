  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景与证据支持的投资逻辑
        blocks:
          - type: paragraph
            body: >-
              EliseAI 现在有两个清晰的公开估值锚。第一个出现在 2024 年 8 月 14 日，公司宣布完成 $75 million Series D，估值超过 $1 billion。第二个出现在 2025 年 8
              月，Reuters 和公司自己的新闻稿都称， $250 million Series E 将估值抬到超过 $2.2 billion。公开乐观逻辑很直接：公司在 Series C 之后继续复合增长，报告
              Series C 到 Series D 期间年经常性收入（ARR）增长超过 2.5x，2025 年 ARR 突破 $100 million，并在美国多户住宅运营商中搭起了异常深入的分销。


              采用证据是真实的。EliseAI 称其服务超过 600 家业主和运营商，其中包括 NMHC Top 50 的 75%；Reuters 和 AlleyWatch
              则称，约每八套美国公寓中就有一套使用该软件。工作流深度、装机基础和医疗扩张叠加在一起， 让公司看起来更像一个定义品类的垂直 AI 平台，而不是功能插件。


              但在保留下来的公开来源中，融资记录并非完全干净。TechCrunch 称 Series D 后累计融资为 $140 million， AlleyWatch 后来称 Series E 后累计融资达到 $391.9
              million，意味着此前约已融资 $141.9 million。 PitchBook 打出的数字高得多，为 $171.9 million。因此，最干净的公开读法是：EliseAI 在 Series D
              后已融资约 $140 million 至 $141.9 million，而不是一个完全对齐的精确数字。这个差异不推翻投资逻辑， 但提醒投资人，即便是基础股权结构问题，从公开证据看也仍有部分不透明。
