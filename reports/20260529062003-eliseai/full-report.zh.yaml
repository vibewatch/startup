      - number: '5.2'
        title: 集成、部署与运营模式
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的技术故事在工作流和集成层最强。公开材料反复把 EliseCRM 描述为同步渠道、任务和对话记录的分流与上下文引擎；集成目录和合作伙伴页面则显示，公司把自己接入 PMS、CRM、市场平台
              和看房生态，而不是迫使客户迁移到完全封闭的栈。Zillow 和 Knock 是最清晰的公开合作端点，更广泛的集成目录还列出其他门禁、看房和市场平台供应商。EliseAI 自己的 CRM/PMS
              集成指南少见地坦承，真实部署会遇到认证限制、API 速率限制和数据模型错配——这种坦诚有用，也确认实施风险落在连接器层，而不只在对话 UI。


              部署同样被定位为重服务。Maintenance App FAQ 把解决方案工程师、产品经理、战略人员和双语培训材料列为上线导入的一部分；公开帮助中心确认存在支持入口，但完整文章库需要登录。这个组合说明
              EliseAI 能支持复杂上线推广，但也提示买家在设置和集成验证阶段应预期供应商深度参与。
