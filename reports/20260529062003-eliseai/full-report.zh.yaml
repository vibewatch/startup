  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 EliseAI
              时，应把它看成面向住房运营商的工作流软件，而不是泛房地产软件。公司自己的平台页面围绕租赁、住户管理、维修、续租、欠费和报表定义产品，并通过语音、SMS、邮件和网页聊天交付。这把公司放在物业管理软件、租赁自动化和住户沟通工具的交集里。因此，纳入的支出应是运营商为潜客响应、看房排期、住户服务、催收、工作流分流和中心化而支付的软件和服务支出。排除的支出包括纯会计主导的
              PMS 模块、建筑科技、经纪 CRM、一次性呼叫中心和非住房垂直的联络中心 AI。现实替代集合并不为空：AppFolio、Yardi、RealPage 和 Entrata
              都把市场框定在租赁、支付、维修、合规、报表和住户门户周围；同时，现场团队仍通过电话、邮件、电子表格和下班后值班完成同样工作。EliseAI
              的切口在于，它把永久在线的对话自动化和中心化叠加到现有系统之上，而不是要求运营商第一天就替换所有记录系统。
