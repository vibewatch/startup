      - number: '2.2'
        title: 规模测算口径与透明需求约束
        blocks:
          - type: paragraph
            body: >-
              公开市场大到值得关注，但数字几乎完全取决于边界纪律。广义物业管理软件页面给出的 2026 年全球估算差距很大：Mordor 为 $6.53 billion，The Business Research
              Company 为 $7.28 billion，Coherent Market Insights 为 $30.80 billion。这个跨度太宽，不能不经调整就当作单一
              TAM。更有用的方法是锚定约束口径：Mordor 数据中，北美占 2025 年 PMS 收入的 40.27%，住宅资产占 2025 年支出的 58.19%，租赁和租户管理模块占销售额的
              35.44%。透明套用后，可得北美住宅租赁和住户运营软件切片约 $0.5–2.3 billion，基准情形接近 $0.6 billion。需求条件也比标题 TAM 更重要。JCHS 统计有 46.1
              million 个租户家庭，Yardi 预计 2026 年多户住宅竣工 458,731 套，Apartments.com 预计即便供给放缓，AI 租赁仍会在 2026
              年放量。这些数据点支持一个庞大的经常性工作流基础，也显示运营商围绕转化、续租和服务响应仍有紧迫感。
