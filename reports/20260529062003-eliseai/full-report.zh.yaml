              增长故事是真实的。EliseAI 公开披露 2023 年 $35M Series C、2024 年 $75M Series D 和 2025 年 $250M Series E，同时表示 ARR 跨过
              $100M，且 Series D 后员工数从约 150 人翻倍到 300 多人。问题不是缺乏势头，而是无法对账。关于页面称累计融资 $360M，首页仍显示 $140M，TechCrunch 称 Series D
