      - number: '6.3'
        title: 留存、满意度与耐久信号
        blocks:
          - type: paragraph
            body: >-
              EliseAI 不披露 NRR、GRR、客户数流失、群组曲线或合同期限结构等经典 SaaS 耐久指标，因此公开留存分析只能依赖代理指标。这些代理指标仍有方向价值。CAF 发布了可衡量的续租留存改善，RPM
              发布了更快续租和更高续租转化，Post Brothers 报告了更好的续租互动和更早通知。Grace Hill 和 EliseAI 还发布联合报告，显示 300+
              物业部署后，NPS、租金感知价值和管理响应评分均提高。这不等同于经审计留存，但确实说明，当运营商真正把产品运营起来，产品可以改善住户侧服务。


              负面一面也真实存在。软件评论称 EliseAI 在复杂问题上可能显得僵硬，或不如真人有温度；租户倡议来源反对在欠费和驱逐相邻工作流中未披露机器人对话。这意味着耐久性是双面故事：运营买家似乎会继续扩大使用，因为
              AI 带来人工杠杆；但如果 EliseAI 要长期占有更敏感的沟通界面，住户信任和合规实践同样关键。
