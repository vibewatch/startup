  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 货币化架构
        blocks:
          - type: paragraph
            body: >-
              公开证据更支持一个以工作流为中心的货币化故事，而不是透明价目表。EliseAI 似乎向住房和医疗工作流销售模块化自动化，EliseCRM
              则作为免费或内含的记录系统层，降低采用摩擦，并把数据、跟进和报表留在一个中枢内。这很重要，因为它指向
              先落地、再扩张的销售动作：运营商可从租赁或住户沟通起步，再逐步添加合规、催收、维修和分析产品。产品集如今已从最初租赁助手延伸到 Lease Audits、Fee
              Transparency、引导看房、维修和医疗呼叫中心自动化，扩大了钱包份额机会。但公开定价披露很弱。审阅过的产品页面不公布费率、合同最低额或实施费，因此公开资料能读出的最佳结论是，EliseAI 销售的是由
              ROI 主张支撑的可配置企业 SaaS 模块，而不是自助式按席位定价。
