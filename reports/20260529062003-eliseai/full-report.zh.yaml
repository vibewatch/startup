  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争框架
        blocks:
          - type: paragraph
            body: >-
              EliseAI 面对的不是一个清晰的同业集合。官方平台材料描述的是一个广泛运营层，横跨潜客对话、看房、住户沟通、维修、续租、欠费和报表；而它的 Entrata
              市场页面显示，产品已经存在于既有物业管理生态内部，而不只是生态之外。这意味着买方至少有四条路径解决同一工作：带嵌入式 AI
              和记录系统优势的既有套件；中心化租赁工作流的对话式租赁专家；从租赁延伸到维修和续租的住户运营平台；或自助看房、线索管理自动化等更窄替代方案。买方共同问题不是“谁的聊天机器人最好”，而是谁能减少人工、守住线索响应速度、保住合规，并贴合运营商现有
              PMS 和 CRM 技术栈。因此，最重要的竞争差异是平台邻接性。Entrata、RealPage、Yardi 和 AppFolio 越来越多地把 AI
              打包进更广泛运营系统。Funnel、Knock、Betterbot、LeaseHawk 和 PERQ 则在工作流层攻击速度、转化、中心化或人工节省。Tour24 证明，即便下班后看房这样的单一工作流，也能替代
              EliseAI 部分价值主张。因此，共存、集成和部分替代至少和纯粹推倒重来式竞争一样可能。
