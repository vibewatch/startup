      - number: '8.2'
        title: 可比公司集合与公开市场倍数测算
        blocks:
          - type: paragraph
            body: >-
              AppFolio 是最接近的公开运营可比公司，因为它已经规模化变现物业管理工作流；CoStar 和 Zillow 可作为行业参照， 但市场平台和数据敞口更重；Procore 和 ServiceTitan
              则是相邻垂直 SaaS 标尺，而不是直接住房软件同行。 公开可比公司的核心启示是：到 2026 年 5 月下旬，这组公司的收入倍数集中在 3.1x 至 6.5x，简单平均约 5.0x。


              用公开 ARR 证据衡量，EliseAI 最新私有估值明显高于这一区间。只采用已披露的 $100 million ARR 下限， $2.2 billion 估值意味着约 22x ARR，约为公开可比公司平均倍数的
              4.4x。因此，市场支付的不是 EliseAI 已公开披露的现状，而是一个判断：ARR 已经远高于披露下限，并且增长速度能长期显著快于公开可比公司。


              方向上，这一溢价并不荒唐：EliseAI 称收入连续四年翻倍，而公开可比公司的增长更接近十几个点到低二十几个点。 但公开下限约 22x、公开可比约 5x
              的价差仍足够大，价格纪律很重要。公开证据支持增长溢价；仅靠这些证据， 还不足以完全支撑当前私有估值。
