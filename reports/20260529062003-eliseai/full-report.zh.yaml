            body: >-
              最强的公开货币化解读不是一张公开价目表，而是 EliseCRM 锚定工作流数据，并让 Lease Audits、Fee Transparency 和其他模块更容易叠上去。这比单一用途聊天机器人 SKU
              更健康，因为它意味着更广的留存和追加销售潜力。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI040
          - type: callout
            title: 毛利率应接近软件，但不会像纯 SaaS 那样干净
            body: >-
              AppFolio 显示，规模化物业管理软件可做到约 mid-60s 毛利率。EliseAI 最终可能接近类似区间，但语音、消息、上线导入和客户成功负担，可能让当前毛利率低于最干净的横向 SaaS
              基准，除非公司披露相反证据。
            calloutType: assumption
            claimRefs:
              - CI035
              - CI036
              - CI037
              - CI043
              - CI052
          - type: callout
            title: 眼前阻塞项是披露不透明，不是缺乏势头
            body: >-
              EliseAI 很可能已有足够商业牵引力，值得认真对待，但投资人仍无法仅凭公开证据对齐累计融资、真实员工数或 Series E
              后估值。管理层给出清晰股本历史、现金桥和收入结构拆分之前，估值和跑道仍是叙事，而非已承销事实。
            calloutType: risk
            claimRefs:
