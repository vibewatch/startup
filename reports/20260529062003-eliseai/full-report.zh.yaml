        title: 锁定、定价不透明与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              来源包里最好的证据对 EliseAI 有利也不利。正面看，EliseAI 显然不只是网站聊天机器人：平台横跨租赁和住户运营，规模足以面向 750+ 顶级物业管理公司营销。负面看，几乎所有严肃竞争者现在都在讲
              AI、自动化或智能体式叙事。这削弱了叙事独特性。更持久的问题是，即便 PMS 仍是 Entrata、Yardi、RealPage 或 AppFolio，EliseAI
              能否成为运营商无法移除的工作流层。当前证据更像部分锁定，而非完全锁定。Funnel 明确与 RealPage 协作。EliseAI 自己通过 Entrata Marketplace 销售。Betterbot
              强调深度 PMS 集成。Tour24 和 PERQ
              可剥离看房或线索捕获，却不替换记录系统。定价不透明加剧风险。多数官方页面把买家引向演示或结果主张，而不是公开价目表；这意味着买家比较的是人工节省、转化和实施摩擦，而不是标价。这有利于 ROI
              证据强的供应商，但也让仅凭公开数据分析切换成本变得困难。实际承销视角是：EliseAI 具备可信产品优势，但只要既有厂商能打包“足够好”的 AI，或运营商只需要解决一个更窄工作流，反向替代风险仍高。
