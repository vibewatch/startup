        blocks:
          - type: paragraph
            body: >-
              直接同业集合不止对话式租赁。Funnel 和 Knock 尤其重要，因为它们围绕 EliseAI 瞄准的同一潜客旅程，打包 CRM、中心化租赁、AI 自动化和运营商工作流。Funnel 主打一套以租客为中心的
              CRM、联络中心、在线租赁、续租和 AI 助手，并发布了强劲结果主张，包括 AI 处理潜客 46% 转化率和每年 $4–5 million 运营节省。其 2026 年 RealPage 专用 AI
              助手页面在战略上很有启发：Funnel 不只把自己定位为既有厂商的替代品，而是定位为可与 RealPage 协作的组合级智能层。Knock 同样强调单一仪表盘带来的中心化、AI 跟进和排期，以及 22%
              看房转化提升主张。Betterbot 和 LeaseHawk 把威胁进一步扩展到住户运营和联络中心自动化。Betterbot 主打覆盖租赁、维修、续租、欠费和预资格判断的专用智能体，配深度 PMS 集成和高额
              ROI 主张。LeaseHawk 销售 ACE、CRM 和 AI 联络中心。PERQ 通过线索管理、对话式 AI、培育自动化和较低成本线索获取竞争。Tour24
              更窄，但战略上重要：它显示买家可以用单一用途产品解决非工作时间覆盖和看房，而不必采购完整对话式租赁平台。
