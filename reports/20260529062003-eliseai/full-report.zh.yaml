      - - TCPA / 隐私 / 录音合规
        - 退订处理日志、同意架构和数据泄露 / 投诉通知
        - 重大同意处理失误、无法解释的录音做法，或重大隐私事件
        - 在控制修复前，将其视为通信自动化投资逻辑破裂
      - - VoiceAI 可靠性
        - 事故频率、可用性指标和转接依赖
        - 反复宕机，或有证据显示服务出问题时客户经常靠人工接电话兜底
