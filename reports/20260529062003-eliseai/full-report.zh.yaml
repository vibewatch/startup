      - number: '7.2'
        title: 运营、隐私与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的产品触点已覆盖居民和患者的全渠道沟通，可靠性或隐私失守会直接传导成看房流失、维修交接遗漏和患者访问问题。
              公司自己的医疗隐私政策称，它会记录电子邮件、电话、短信和网页聊天中的沟通内容，并可能复制已连接收件箱和日历内容来运行服务。
              此类设计能提高工作流覆盖，但也集中敏感数据，抬高同意管理、消息留存和访问控制的风险。公开来源同样能看到可靠性风险： 支持中心记录了备用语音生成路径，以及 VoiceAI
              中断时完全转接至租赁办公室的流程；状态页也记录过一次系统更新导致的中断。 有回退方案好过没有，但服务故障确实会把工作量和服务降级重新推给客户。公开来源没有披露面向客户的正常运行时间 SLA，
              也没有详细的公开信任材料包，因此投资人无法在尽调室外独立界定剩余停机风险或控制风险。
