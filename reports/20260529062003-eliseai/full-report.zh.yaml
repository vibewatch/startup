      - number: '2.4'
        title: 采用驱动、信任约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动来自运营，而非概念。EliseAI 和 Entrata 都主打 24/7 响应、跟进自动化和中心化执行；VoiceAI
              特别聚焦即时看房预约和非工作时间覆盖。独立报道显示，这些承诺对应真实预算。Multifamily Executive 报道，受访运营商正在增加 AI
              支出、看到运营费用下降，并改善了线索到签约转化。BusinessWire 的保障性住房调查称，91% 的保障性住房运营商已部署 AI，55% 已围绕 AI 中心化现场团队。劳动力经济学也强化了这个故事：BLS
              给出的物业经理薪酬中位数为 $66,700，并指出这些员工常要处理下班后的紧急情况，因此速度和人员减负具备硬美元价值。主要刹车来自监管和信任。HUD 2024 年指南警告，AI 筛选和算法广告定向可能违反
              Fair Housing Act；FTC 和 CFPB 强调评分、筛选和数据准确性风险；FCC 正在收紧 AI 机器人电话和机器人短信规则。
              这些约束不会扼杀采用，但会迫使买家选择能证明护栏、可审计性和人工接管的工具。
