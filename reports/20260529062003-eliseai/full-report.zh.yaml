      - number: '7.3'
        title: 依赖、竞争与集中度风险
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的增长叙事要同时满足两个条件：合作伙伴系统继续跑得稳，大型运营商继续选择跨技术栈 AI 层， 而不是转向 PMS 供应商越来越成熟的原生 AI 工具。集成矩阵显示出真实的技术栈不对称：Knock
              是唯一支持的 RealPage CRM，AppFolio 租赁需要额外 API 权限，Yardi Breeze 不支持，Yardi Voyager 缺少原生租赁日历， 一些续租工作流在 AppFolio 或
              RealPage 上不存在。与此同时，RealPage、Yardi、Entrata 和 AppFolio 都在营销面向租赁、维护或运营的原生 AI；Zillow 掌握关键潜客获取入口，OpenAI
              提供医疗模型可信度和基础设施。 公开客户证据也集中在 Greystar、Fitch Irick 等大型多户住宅和保障性住房运营商身上；足以证明企业级价值， 但不能证明集中度低。公开来源披露的是 logo
              而非收入结构，因此投资人只能看到 EliseAI 拿下了大型运营商， 却无法判断业务对少数 logo、渠道或技术栈伙伴的暴露程度。
