      - number: '1.2'
        title: 资本、治理与当前规模
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的融资形成明显加速，分为几个阶段：2019 年小规模种子备案和 2021 年豁免融资，2023 年 $35 million Series C，2024 年 $75 million Series D
              将公司估值推过 $1 billion，随后是 2025 年 Andreessen Horowitz 领投的 $250 million Series E。Reuters 和 CNBC 均报道，Series E
              后公司估值超过 $2.2 billion；公司则表示，该轮融资发生在 ARR 超过 $100 million、全职员工数从 150 人增至 300 多人之后。融资同时扩展了治理结构：Eddie Kang 与
              Series C 董事会扩容相关，Cathy Gao 对应 Series D 董事席位，Alex Immerman 则出现在 a16z 领投之后的 2025 年 SEC
              备案中。公开规模披露很强，但并不同步：当前关于页面称覆盖 500 万+单元、600 多家业主和运营商；Series E 材料称覆盖 NMHC Top 50 的 75% 和公寓市场的 10%；CNBC 报道为
              700 多家业主 / 运营商和六分之一出租单元；运行时首页仍显示较旧的 $140 million 融资总额。后续章节因此应把融资、覆盖和员工数锚定到有日期的披露，而不是套用通用落地页文案。
