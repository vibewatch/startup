  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 支撑证据
      - 改变判断的因素
    rows:
      - - 投资逻辑
        - 住房工作流品类赢家
        - 600+ 家运营商、八分之一公寓渗透率，以及够深够广的自动化能力支撑品类领导地位。
        - 若出现流失、客户集中或采用减弱的证据，胜出资格叙事会被削弱。
      - - 投资逻辑
        - 增长可支撑溢价倍数
        - EliseAI 称收入连续四年翻倍，并在 2025 年突破 $100M ARR。
        - 如果当前 ARR 仍接近已披露下限，最新估值对应的增长溢价就过于激进。
      - - 投资逻辑
        - 医疗带来第二条增长曲线
        - Series E 资金明确投向医疗和住房，把 TAM 从单一多户住宅拉宽。
        - 如果医疗仍不成规模，或收入质量低于住房，第二垂直领域溢价应压缩。
      - - 反向逻辑
        - 公开倍数支撑偏弱
        - 上市可比公司收入倍数集中在 3x–6.5x，而 EliseAI 公开 ARR 下限隐含约 22x ARR。
        - 当前 ARR 若显著高于 $150M，且利润率证据强，价差会更容易辩护。
      - - 反向逻辑
        - 融资总额和股权结构披露不完整
        - 公开来源对 Series D 之前累计融资额不一致，也没有披露优先股堆叠。
        - 对齐后的融资台账和最新清算瀑布模型可消除一项重要尽调悬念。
      - - 反向逻辑
        - 行业逆风和监管可能压缩倍数
        - RealPage 反垄断审查和 2026 年疲弱的多户住宅租金增长，可能拖慢客户预算或压低溢价倍数。
        - 若有证据显示 EliseAI 的 ROI 在租金增长疲弱市场仍有韧性，这一担忧会下降。
    notes: 这些论点概括最强的公开正反证据；不能替代对单位经济性或股权结构条款的私下尽调。
