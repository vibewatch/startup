  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - EliseAI 可以拥有从潜在租户到住户的完整工作流
        - 既有套件现在已在租赁、支付、续租和住户数据中嵌入 AI
        - 高
        - 按 PMS 安装基础向 Entrata、Yardi、RealPage 和 AppFolio 索取队列级赢/输数据。
      - - 全渠道代理式 UX 使 EliseAI 差异化
        - Funnel、Knock、Betterbot、LeaseHawk 和 PERQ 等同业都在多个渠道营销 AI 自动化
        - 高
        - 使用响应时间、看房、租约和留存基准，将真实工作流成效与泛泛的 AI 主张分开。
      - - 市场和集成存在可以扩大触达范围
        - 相同集成也会支持多归属和部分替代，而不是形成硬锁定
        - 高
        - 绘制集成账户是扩大钱包份额，还是只是让 EliseAI 保持为一个可替换层。
      - - 运营广度应能防御单点解决方案
        - Tour24、PERQ 或 LeaseHawk 可以剥离看房、线索获取或联络中心工作，而无需迫使客户进行全栈切换
        - 中高
        - 量化每个模块的附加率，并识别哪些工作流真正驱动续约或 NOI。
      - - ROI 叙事可以支撑溢价定价
        - 公开定价不透明，因此买方可能锚定于竞争对手 ROI 故事和实施摩擦，而不是 EliseAI 标价
        - 中高
        - 收集发票样本、实施时间线和已实现劳动节省研究，用于同口径比较。
      - - 信任 / 合规态势支持企业采用
        - 既有厂商也营销公平住房护栏、治理、隐私和合规就绪 AI
        - 中
        - 将 EliseAI 的护栏、模型控制、可审计性和升级工作流与既有厂商主张进行记录对比。
      - - 已筹资本可以资助产品领先
        - 大型 2026 年 AI 原生融资轮提高了增长门槛，并让品类叙事更加拥挤
        - 中
        - 测试新资金是否转化为更快的产品速度和持久的参考账户，而不只是更高支出。
    notes: 严重性反映对采购杠杆、转换成本以及利润率或留存耐久性的可能影响，而不是量化的损失概率。每行都将公开证据转化为一个尽调工作流。
