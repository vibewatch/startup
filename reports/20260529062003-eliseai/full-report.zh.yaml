chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与领导层
        blocks:
          - type: paragraph
            body: >-
              EliseAI 是一家总部位于纽约、注册在 Delaware 的公司，由 Minna Song 和 Tony Stoyanov 于 2017 年创立。公司的 SEC 备案仍使用 Elise A.I.
              Technologies Corp. 这一法定名称，而当前公司网站和 2024–2025 年备案显示总部位于 33 E 33rd Street, 2nd Floor, New York, NY
              10016。Song 仍任 CEO，也是公司最主要的公开发言人；Stoyanov 是技术联合创始人兼 CTO。公开访谈和创始人画像把 Song 的创始人—市场匹配归因于两点：MIT
              计算机科学训练，以及她亲身接触过租赁行政流程痛点。这解释了 EliseAI 为什么不是做通用聊天机器人，而是做深度工作流层。当前平台围绕 EliseCRM
              组织，覆盖租赁、住户运营、欠费、维修、续租、看房和沟通工作流，横跨语音、SMS、邮件和网页聊天。住房仍是核心切口，但 EliseAI 早在 2023
              年已扩展到医疗，如今也把患者预约和前台自动化定位为真实的第二垂直。创始人主导的产品愿景和工作流级别的具体性很重要，因为后续尽调章节会把这些身份事实当作事实底座；它也解释了为什么公开材料仍显示，Song
              和最初产品论题周围存在不小的关键人物集中度。
