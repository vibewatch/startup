      - number: '8.3'
        title: 乐观、基准、悲观情景与反向证据
        blocks:
          - type: paragraph
            body: >-
              情景区间几乎完全由两个变量驱动：自上次披露下限以来 ARR 已经到什么水平，以及市场会继续给垂直 AI 软件多少溢价。乐观情景需要 ARR 接近 $200–250 million，并维持 10x–14x
              倍数，才能支撑 $2.0–3.5 billion 区间。只有公司已经显著超过公开 ARR 下限、把医疗转化为第二增长引擎，并在住房领域守住品类赢家地位， 这个结果才可能兑现。


              基准情景假设 ARR 落在 $130–180 million 区间，估值接近 7x–10x，对应约 $0.9–1.8 billion—— 对一家强软件公司仍算健康，但不足以完全承销上一轮私有估值。悲观情景假设
              ARR 仍接近 $100–120 million， 市场按成熟物业软件给 EliseAI 4x–6x，则隐含约 $0.4–0.72 billion。


              反向证据重要，因为行业监管和房东预算都可能压缩倍数。RealPage 反垄断案件显示，当自动化触及敏感决策时， 多户住宅中的 AI 会招来实质审查。另一边，CBRE 的 2026
              年展望称，运营商正把入住率置于租金增长之前，使用优惠， 并消化过剩供给。这不会打破 EliseAI 的降本逻辑，但会抬高客户愿意支付多少钱、预算扩张多快的门槛。
