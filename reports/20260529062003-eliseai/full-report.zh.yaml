        - 当前公开 ARR 下限已明显过时，实际 2026 ARR 显著更高。
      - - 基准
        - $130M–$180M ARR
        - 7x–10x
        - 0.9–1.8
        - 假设增长仍强但回归常态，倍数较上市可比公司有一定溢价。
        - 当前估值仍需要未来执行兑现，公开证据尚未证明。
      - - 悲观
        - $100M–$120M ARR
        - 4x–6x
        - 0.4–0.72
        - 假设 ARR 仍接近已披露下限，估值向成熟物业软件压缩。
        - 增长放慢、预算转弱或融资条款经济性不利，任意组合都会把价值压到 2024–2025 年估值以下。
    notes: 情景测算使用最新公开估值锚和 ARR 下限；区间只指示方向，不能替代公司提供的经营模型。
