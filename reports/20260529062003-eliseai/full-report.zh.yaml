      - number: '8.4'
        title: 建议、入场纪律与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中，风险评级高，估值立场偏高。原因不是 EliseAI 缺少产品市场契合证据；公司显然已有真实采用、
              强劲增长，以及在住房工作流中可解释的胜出路径。问题在于，公开证据仍停在晚期承销最关键问题的边缘：当前 ARR 分部门情况、毛利率、留存、客户集中度和优先股堆叠。


              缺失披露尤其重要，因为私有轮次不只是头条企业价值。没有 Series E 条款清单和清算瀑布，投资人无法判断当前估值是否给新资本留下足够下行保护，
              也无法判断表面价值是否有很大一部分位于会在较弱退出中稀释普通股结果的优先股堆叠之上。


              入场纪律因此必须同时看价格和证据。如果管理层能证明 ARR 显著高于 $150 million、毛利率健康、队列黏性强、
              优先权为普通条款，当前估值可以防守。没有这些数据，投资人应等待私下披露或明显更好的入场价格，再把 EliseAI 当作基本面已过关的晚期投资。
