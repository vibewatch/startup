  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - EliseAI
        - 代理式租赁 + 住户运营平台
        - Entrata 市场页面显示 750+ 顶级 PMC；TFN 在 2026 年报道 2.5 亿美元 E 轮
        - 希望用一个 AI 层覆盖租赁、住户服务和运营的多户住宅运营商
        - 覆盖潜在租户和住户工作流，包括短信、邮件、语音、聊天、看房、维修、续租、逾期欠款和报告
        - 在许多账户中仍依赖与既有 PMS 系统共存，并面对拥挤的 AI 定位
      - - Entrata
        - 既有多户住宅运营系统
        - 私营既有厂商；官方页面描述自主物业管理 OS 和数千家运营商
        - 希望在一个技术栈中获得租赁、支付、续租、合规和住户工作流的业主与运营商
        - 系统记录源邻近性，加上内嵌 Leasing AI、ELI+ 和工作流自动化
        - 定价不透明，买方可能仍需证明内嵌 AI 优于同类最佳专业工具
      - - RealPage / Knock
        - 既有套件加 CRM / AI 租赁层
        - 大型既有套件分发，带有 Knock CRM 和 Lumina AI 界面
        - 优先考虑前台工作流、集中式租赁和现有技术栈内 AI 代理的多户住宅运营商
        - 结合 CRM、AI Leasing Agent、通话智能、看房和更广泛的 AI 劳动力叙事
        - 公开材料更强调平台广度，而非透明定价或独立成效基准
      - - Yardi
        - 带内嵌 AI 的既有套件
        - Virtuoso 页面强调 40+ 年平台基础
        - 已在 Yardi / RentCafe 工作流上标准化的运营商
        - Virtuoso、Chat IQ、CRM IQ 和 Online Leasing 将 AI 直接接入受治理的平台工作流
        - 只有在实践中产品质量足够时，既有厂商深度才可能减少对第三方 AI 的需求
      - - AppFolio
        - 带租赁 AI 助手的套件供应商
        - 公开套件供应商；评论和官方页面强调集中式会计、营销、租赁和 AI 排程
        - 寻求集成式营销、租赁和物业管理的中端市场与组合运营商
        - Lisa 可 24/7 工作，Realm-X 则增加信任、隐私和问责定位
        - 官方页面没有发布便于直接比较的同口径定价
      - - Funnel
        - 直接的对话式租赁 / CRM 专业厂商
        - 官方页面声称 46% 转化由 AI 处理，以及每年 400万-500万美元运营节省
        - 希望获得集中式租赁、CRM、联络中心、续租和 AI 工作流的多户住宅运营商
        - 以租客为中心的 CRM，加上强组合集中化和 RealPage 兼容性叙事
        - 仍依赖底层 PMS 生态，且公开融资规模未在所审阅页面呈现
      - - Betterbot
        - 住户生命周期 AI 专业厂商
        - 官方成果页面引用 520 个社区部署、每年 1,270 万美元劳动效率和 9.85x ROI
        - 寻求一个 AI 层覆盖租赁、维修、续租、逾期欠款和预资格审查的运营商
        - 具备专业代理和深度 PMS 集成的统一平台
        - 成效声明由公司自行撰写，且标价仍不透明
      - - LeaseHawk
        - 租赁 AI / 联络中心 / CRM 专业厂商
        - 成熟的多户住宅软件供应商；官方页面侧重 ACE、CRM 和 AI 联络中心，而非公开融资细节
        - 需要租赁自动化、联络中心覆盖和 CRM 工作流的运营商
        - 围绕租赁和住户沟通自动化的聚焦产品集
        - 所审阅材料中显示的更广泛住户运营广度少于 EliseAI 或 Betterbot
      - - PERQ
        - 线索管理和对话式 AI 专业厂商
        - 官方页面称数百家 PMC 信任 PERQ
        - 优先考虑线索获取、培育和降低营销转化成本的运营商
        - 结合 PPC、对话式 AI、培育自动化、重新激活和分析，以降低线索成本
        - 比完整住户运营平台更偏营销漏斗
      - - Tour24
        - 工作流替代品：自助看房
        - 多次获奖的自助看房产品，拥有广泛运营商证言
        - 主要需要非工作时间覆盖和物业看房的运营商
        - 无需完整对话式租赁部署，也能让看房在非工作时间和周末可用
        - 解决一个高价值工作流，而不是整个租赁和住户旅程
    notes: 所选行覆盖已获取来源包中最相关的直接同业、既有套件和工作流替代品。规模/融资单元格只使用所审阅来源中的公开披露信号，并在私营供应商未发布更多细节时标注不透明。
    enumerationScope:
      coverage: partial
      basis: >-
        This is the materially relevant competitor set for EliseAI in multifamily leasing and resident operations, not
        an exhaustive census of every PMS, chatbot, or regional proptech vendor.
