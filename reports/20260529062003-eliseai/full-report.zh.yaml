companyProfile:
  summary: >
    EliseAI 是一家总部位于纽约的垂直 AI 公司，由 Minna Song（CEO）和 Tony Stoyanov（CTO）于 2017 年创立。公司最初为多户住宅运营商提供 AI
    租赁助手，此后成长为覆盖租赁、CRM、维修、欠费、续租和催收的完整住户生命周期自动化平台，并开始推出医疗沟通产品。到 2025 年中，公司 ARR 已超过 $100 million，软件部署到超过 200 万套公寓单元，累计从
    Andreessen Horowitz、Bessemer Venture Partners、Sapphire Ventures、Point72 等投资方融资 $360 million。Sapphire 领投的 2024 年 8 月
    Series D 确认公司以超过 $1 billion 估值进入独角兽行列；a16z 领投的 2025 年 Series E 将媒体报道估值推至约 $2.2 billion。围绕公平住房和 AI
    偏见的监管风险，是公开证据无法消除的核心尽调风险。
