  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、公平住房与模型偏见风险
        blocks:
          - type: paragraph
            body: >-
              EliseAI 最难对冲的风险不是普通软件 bug，而是嵌进租赁、申请人处理、住房广告或催收的自动化， 日后可能被认定造成歧视性结果。HUD 2024 年 5 月的 AI 指引已经把租户筛选和住房广告明确拉进
              Fair Housing Act 执法通道；DOJ 介入 SafeRent 则表明，算法评分一旦让受保护群体或住房券持有人处于不利位置，筛选供应商也会面对 FHA 差别影响索赔。CFPB
              指引又加了一层：复杂模型造成不利结果时，公司仍要给出具体、可解释的通知，并提供争议处理路径。 上述框架对 EliseAI
              很关键，因为它在保障性住房里的证明点强调预资格审核、潜客分流、催收和集中式决策支持；保障性住房规则重、 合规压力高，申请人群体也更脆弱，容错空间很小。公开材料没有显示 EliseAI
              做过独立公平住房或偏见审计，因此公司扩张工作流自动化的速度， 可能已经快于外部投资人验证其治理成熟度的速度。
