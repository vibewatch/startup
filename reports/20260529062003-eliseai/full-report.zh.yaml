  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与公开规模
        blocks:
          - type: paragraph
            body: >-
              EliseAI 的客户证据在美国大型住房运营商中最强，而不是小房东或泛 SMB
              物业经理。公司明确同时面向业主和费用管理方推销，这很重要，因为多户住宅内部的买方、日常用户和预算所有者常常不是同一批人。面向业主的材料聚焦
              NOI、欠费、空置和资产表现；面向物业经理的材料聚焦工作量减轻、线索转化、续租和中心化沟通。实际公开客户集覆盖大型业主和
              REITs、第三方费用管理方、学生公寓运营商、保障性和军人住房运营商，以及部分独户住宅组合。


              规模真实存在，但公开分母并不完全干净。Business Wire 和融资报道称，EliseAI 服务 Top 50 多户住宅业主 / 运营商中的 70%，并覆盖每 12 套多户住宅中的 1 套。Thesis
              Driven 和 AI for PropTech 把足迹推得更高，称覆盖 600+ 业主 / 运营商，以及约美国公寓市场 10%。Multifamily Dive 更进一步，引用六分之一出租单元和 500,000
              套保障性住房。正确解读不是采用弱，而是公开规模数字偏营销口径，尚未作为一套经审计的 KPI 呈现。
