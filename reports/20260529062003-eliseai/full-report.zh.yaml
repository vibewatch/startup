      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场的预算权在住房运营商手里，而不在住户手里。买方通常是业主运营商、第三方管理公司、保障性住房组合管理方，或控制组合软件支出和人员设计的组合运营 / IT
              负责人。日常用户更分散：现场租赁代理、中心化租赁团队、住户服务团队、物业经理、市场人员、合规人员，以及与系统互动的潜客或住户。多份公开来源显示这点为何重要。Mordor 称物业经理和代理贡献了 2025
              年物业管理软件支出的 42.73%，CMI 则称物业经理是最大终端用户板块，占 2026 年份额 45.4%。EliseAI
              自己的定价说明描述了按单元、分层和企业固定费用的采购模式，大型组合尤其如此。EliseAI 和 Entrata 的产品页面都强调业主运营商、费用管理方、保障性住房组合、学生公寓和 SFR
              是不同运营环境。实际采用通常从中心化团队能获得跨物业规模效应的地方开始：线索接入、看房排期、跟进、住户服务分诊、续租和欠费工作流。
