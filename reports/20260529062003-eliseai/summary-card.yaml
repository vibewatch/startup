summary:
  headline: >
    EliseAI has crossed $100M ARR with dominant multifamily penetration and tier-1 backing, but a 22x ARR multiple and
    unresolved fair-housing regulatory exposure make the current price stretched for investors without regulatory
    diligence access.
  overallScore: 7
