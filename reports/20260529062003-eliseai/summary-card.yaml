  topStrengths:
    - >-
      Crossed $100M ARR in 2025 with more than 2.5x ARR growth between Series C and D rounds, demonstrating real
      commercial scale in a durable vertical.
    - >-
      Dominant market penetration: 1 in 8 US apartments, 75% of NMHC top-50 operators, and 600+ owner-operator
      customers, creating a defensible network effect and switching-cost moat.
    - >-
      Tier-1 investor syndicate (Andreessen Horowitz, Bessemer, Sapphire, Point72) providing capital access, enterprise
      customer introductions, and strategic validation.
  topRisks:
    - >-
      Fair-housing and AI discrimination regulatory exposure: automated leasing, applicant handling, and housing
      advertising create HUD/DOJ liability risk that is structurally difficult to independently verify.
    - >-
      Valuation multiple ($2.2B on $100M ARR = ~22x) is expensive for a private illiquid asset; any slowdown in ARR
      growth or a multiple compression in vertical AI software would impair exit economics.
    - >-
      Concentration in multifamily housing creates platform risk; healthcare expansion is still early and unproven at
      scale, limiting diversification optionality in the near term.
  unresolvedGaps:
    - >-
      Exact Series E terms, including liquidation preferences, participation rights, and ratchets behind the $2.2B
      reported valuation.
    - NRR, gross churn, CAC, and LTV by product module—critical for underwriting the 22x ARR multiple.
    - >-
      Independent fair-housing audit results and regulator-facing controls; the company's own 2025 guidance is
      self-reported, not third-party verified.
    - >-
      Healthcare product ARR contribution, customer count, and competitive positioning relative to incumbent
      patient-communication vendors.
