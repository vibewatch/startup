  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Leadership
        blocks:
          - type: paragraph
            body: >-
              EliseAI is a New York-based, Delaware-incorporated company founded in 2017 by Minna Song and Tony
              Stoyanov. Its SEC filings continue to use the legal name Elise A.I. Technologies Corp., while the current
              company site and 2024-2025 filings place headquarters at 33 E 33rd Street, 2nd Floor, New York, NY 10016.
              Song remains CEO and the company’s dominant public spokesperson, while Stoyanov is the technical
              co-founder and CTO. Public interviews and founder profiles tie Song’s founder-market fit to both MIT
              computer-science training and first-hand exposure to rental-administration pain points, which helps
              explain why EliseAI was built as a deep workflow layer instead of a generic chatbot. The current platform
              spans leasing, resident operations, delinquency, maintenance, renewals, tours, and communication workflows
              across voice, SMS, email, and web chat, organized around EliseCRM. Although housing remains the core
              wedge, EliseAI had already expanded into healthcare by 2023 and now positions patient scheduling and
              front-desk automation as a real second vertical. That combination of founder-led product vision and
              workflow-level specificity matters because later diligence chapters will reuse these identity facts as
              ground truth; it also explains why public materials still imply meaningful key-person concentration around
              Song and the original product thesis.
