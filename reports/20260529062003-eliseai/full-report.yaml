  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a workflow-centric monetization story more than a transparent price list. EliseAI
              appears to sell module-based automation into housing and healthcare workflows, with EliseCRM acting as a
              free or included system-of-record layer that reduces adoption friction and keeps data, follow-up, and
              reporting inside one hub. That matters because it points to a land-and-expand motion: operators can start
              with leasing or resident communication and then add compliance, collections, maintenance, and analytics
              products over time. The product set now stretches beyond the original leasing assistant into Lease Audits,
              Fee Transparency, guided tours, maintenance, and healthcare call-center automation, which broadens wallet
              share opportunities. But public pricing disclosure is weak. The reviewed product pages do not publish
              tariffs, contract minimums, or implementation fees, so the best public read on pricing is that EliseAI
              sells configurable enterprise SaaS modules backed by ROI claims rather than self-serve seat pricing.
