      - number: '4.4'
        title: Verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to argue that EliseAI has reached true commercial scale, but not good
              enough to underwrite valuation or downside. Revenue quality looks better than that of a thin-feature point
              solution because the product embeds into recurring workflows and case studies show customers using the
              platform to protect NOI, not just improve response times. At the same time, regulatory conditions are a
              double-edged sword. The company is turning fee-transparency and lease-audit needs into monetizable
              features, yet the same regulatory and legal pressure means products touching rent, fees, or lease terms
              will carry ongoing compliance and reputational risk. The DOJ's RealPage case is not an EliseAI case, but
              it makes clear that algorithmic multifamily vendors now operate under sharper scrutiny. The decisive
              blocker remains disclosure opacity: public sources conflict on funding totals, valuation, and headcount,
              while cash, burn, pricing realization, revenue mix, gross margin, NRR, and debt remain undisclosed.
              Financially, the business looks promising; underwrite-ready it does not.
