  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      EliseAI creates value when a housing operator moves from leasing automation into resident, maintenance, renewal,
      and collections workflows across the same account.
    data:
      items:
        - label: Executive mandate
          description: >-
            Owner, asset-management, or property-management leadership wants better occupancy, lower delinquency, and
            fewer onsite bottlenecks.
        - label: Prospect capture
          description: >-
            LeasingAI and VoiceAI answer leads instantly across web, text, email, and phone so after-hours demand is not
            lost.
        - label: Tour / application
          description: >-
            The operator uses AI-guided tours, scheduling, and follow-up to move leads into tours, applications, and
            signed leases.
        - label: Move-in / resident service
          description: >-
            Resident communication, maintenance intake, and voice channels absorb repetitive requests while teams handle
            exceptions.
        - label: Renewal / collections
          description: >-
            Renewals and delinquency modules automate nudges, reminders, and context-rich handoffs that improve cash
            flow and notice timing.
        - label: Account expansion
          description: >-
            Once the workflow data and team design live inside EliseAI, the customer expands modules and centralization
            scope rather than running one-off pilots.
    claimRefs:
      - CU005
      - CU006
      - CU020
      - CU046
      - CU047
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      The strongest public deployments start with a narrow pain point, prove ROI on a live portfolio, then expand into a
      wider centralized operating model.
    data:
      nodes:
        - id: pain-point
          label: Pain point
          detail: Staffing pressure, missed after-hours demand, poor collections, or maintenance overload create urgency.
        - id: pilot
          label: Pilot deployment
          detail: >-
            Customer starts with one product, site set, or portfolio slice to test AI performance versus incumbent
            process.
        - id: quant-proof
          label: Quantified proof
          detail: Operator measures lead-to-tour, occupancy, renewals, collections, hours saved, or work-order outcomes.
        - id: module-expand
          label: Module expansion
          detail: Leasing expands into renewals, delinquency, maintenance, voice, or guided tours after initial proof.
        - id: centralization
          label: Centralized operating model
          detail: Operator redesigns workflows, task routing, or managed services around one AI-plus-human control layer.
        - id: portfolio-rollout
          label: Portfolio rollout
          detail: >-
            Rollout becomes portfolio-wide or client-wide, making EliseAI part of the operating system rather than a
            point tool.
      edges:
        - from: pain-point
          to: pilot
        - from: pilot
          to: quant-proof
        - from: quant-proof
          to: module-expand
        - from: module-expand
          to: centralization
        - from: centralization
          to: portfolio-rollout
    claimRefs:
