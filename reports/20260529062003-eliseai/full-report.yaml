              EliseAI works with 70% of the top 50 multifamily owners/operators and is active in one out of every 12
              multifamily apartments. Thesis Driven and AI for PropTech push the footprint higher, describing 600+
              owners/operators and roughly 10% of the U.S. apartment market. Multifamily Dive goes further still, citing
              one in six rental units and 500,000 affordable units. The right read is not that adoption is weak; it is
              that public scale figures are marketing-oriented and not yet presented as one audited KPI set.
