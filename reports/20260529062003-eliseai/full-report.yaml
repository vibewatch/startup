      - number: '8.3'
        title: Bull, base, and bear scenarios with adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The scenario range is driven almost entirely by what ARR has become since the last disclosed floor and by
              how much premium the market will continue to give vertical AI software. A bull case requires ARR closer to
              $200–250 million and a sustained 10x–14x multiple, which can support a $2.0–3.5 billion range. That
              outcome is achievable only if the company has already moved materially beyond the public ARR floor,
              converts healthcare into a second engine of growth, and maintains category-winner status across housing.


              The base case assumes ARR in the $130–180 million zone with valuation closer to 7x–10x. That produces
              about $0.9–1.8 billion—healthy for a strong software company, but not quite enough to fully underwrite the
              last private mark. The bear case assumes ARR remains near $100–120 million and the market treats EliseAI
              more like mature property software at 4x–6x, which implies roughly $0.4–0.72 billion.


              Adverse evidence matters because sector regulation and landlord budgets can both narrow the multiple. The
              RealPage antitrust cases show that AI in multifamily can draw meaningful scrutiny when automation touches
              sensitive decisions. Separately, CBRE's 2026 outlook says operators are prioritizing occupancy over rent
              growth, using concessions, and working through excess supply. That does not break EliseAI's cost-savings
              thesis, but it does raise the bar for how much customers will pay and how quickly budgets will expand.
            claimRefs:
              - CV028
