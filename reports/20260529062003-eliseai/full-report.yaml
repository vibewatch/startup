    title: Regulatory / Legal Risk Register
    columns:
      - Rule / case
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Fair Housing Act + HUD AI tenant-screening / ad-targeting guidance
        - U.S. housing
        - Active; HUD issued AI-specific guidance in 2024
        - M
        - Critical
        - >-
          EliseAI can limit scope to communications/support and maintain human review for qualification or adverse
          decisions
        - Public sources show no independent fair-housing audit or disparate-impact testing for EliseAI
        - >-
          Request fair-housing review memos, bias-testing outputs, and escalation rules for prospect qualification / ad
          targeting
      - - SafeRent litigation precedent for algorithmic housing scoring vendors
        - U.S. housing litigation
        - DOJ-backed FHA case survived dismissal against screening vendor
        - M
        - High
        - Avoid black-box scoring for tenant eligibility and document relevance of model factors
        - A plaintiff can analogize any opaque screening or ranking logic to SafeRent-style disparate-impact claims
        - Ask product/legal to map where EliseAI influences application triage, scoring, or screening outputs
      - - CFPB / FCRA adverse-action and tenant-screening notice duties
        - U.S. consumer-finance / housing
        - Current disclosure and dispute rights remain in force
        - M
        - High
        - >-
          Maintain explainable rules, audit logs, and dispute workflows when AI contributes to denial or pricing
          decisions
        - Opaque or poorly explained automation can create notice and dispute failures even without explicit bias
        - Review adverse-action templates, explanation logic, and escalation paths for disputed rental decisions
      - - TCPA robotext / robocall consent revocation
        - U.S. communications
        - FCC extended one cross-topic rule to 2027 but revocation still blocks additional covered calls/texts
        - M
        - High
        - Centralize consent capture, STOP handling, and suppression lists across products and customers
        - Any inconsistent opt-out handling can create statutory damages and class-action exposure
        - Request consent architecture, keyword handling logs, and vendor contract language for telephony / texting
      - - Healthcare privacy / recorded communications
        - U.S. healthcare privacy
        - HC policy confirms recording and broad data collection for service delivery
        - M
        - High
        - Use BAAs, least-privilege access, and product-specific data segregation
        - >-
          Patient communications, inbox copies, and credentials create breach and misuse exposure beyond housing
          workflows
        - Review HIPAA architecture, access controls, breach-notification playbooks, and retention schedules
    notes: >-
      Severity-ranked public-only legal register; mitigations describe plausible company responses, while residual
      exposure highlights what remains unverified from public evidence.
    enumerationScope:
      coverage: partial
