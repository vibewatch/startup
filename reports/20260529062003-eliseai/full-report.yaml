  - id: FE001
    title: EliseAI Product Architecture Map
    type: stack
    layout: standard
    summary: Publicly visible product layers from channel entry points to integrated field execution.
    data:
      layers:
        - label: Experience Layer
          detail: Voice, SMS, email, web chat, and listing-entry surfaces such as Zillow rentals
        - label: Conversation Automation Layer
          detail: LeasingAI, ResidentAI, VoiceAI, and maintenance-intake automation handle intent capture and first response
        - label: Operating System Layer
          detail: EliseCRM stores guest cards, tasks, calendars, campaigns, reports, and transcript context
        - label: Integration Layer
          detail: >-
            PMS, CRM, touring, access-control, marketplace, and partner connectors documented through public integration
            surfaces
        - label: Field & Feedback Layer
          detail: Maintenance App, customer support, and analytics close the loop with technicians and centralized specialists
    approximationNotes: >-
      Cloud, data-pipeline, and model-serving infrastructure are not publicly disclosed; this stack is inferred from
      product, integration, and support surfaces.
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE018
      - CE019
      - CE038
  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: standard
    summary: How EliseAI says a housing conversation becomes a routed, trackable task or resolution.
    data:
      nodes:
        - id: n1
          label: Inbound trigger
          description: Prospect or resident enters through listing, phone, text, email, or web chat
        - id: n2
          label: AI conversation
          description: LeasingAI, ResidentAI, VoiceAI, or maintenance intake collects intent and details
        - id: n3
          label: Context + routing
          description: EliseCRM updates the guest card, calendar event, task, or work order
        - id: n4
          label: Automated resolution or handoff
          description: The system answers directly or routes to a centralized specialist, live agent, or technician
        - id: n5
          label: Execution layer
          description: Onsite team or Maintenance App user completes the task and records status
        - id: n6
          label: Feedback loop
          description: Transcript, outcome, and performance data feed reporting, follow-up, and future workflows
      edges:
        - from: n1
          to: n2
          label: Starts
        - from: n2
          to: n3
          label: Creates context
        - from: n3
          to: n4
          label: Routes
        - from: n4
          to: n5
          label: Executes
        - from: n5
          to: n6
          label: Logs outcome
    claimRefs:
      - CE006
      - CE011
      - CE019
      - CE021
      - CE038
