      - number: '2.2'
        title: Sizing lenses and transparent demand constraints
        blocks:
          - type: paragraph
            body: >-
              The public market is large enough to matter, but the number depends almost entirely on boundary
              discipline. Broad property-management-software pages span a global 2026 estimate of $6.53 billion from
              Mordor, $7.28 billion from The Business Research Company, and $30.80 billion from Coherent Market
              Insights. That spread is too wide to use as a single TAM without adjustment. A more useful approach is to
              anchor on a constrained lens: North America represented 40.27% of 2025 PMS revenue in Mordor, residential
              assets represented 58.19% of 2025 spend, and lease-and-tenant-management modules represented 35.44% of
              sales. Applied transparently, that yields a North American residential leasing-and-resident-operations
              software slice of roughly $0.5-2.3 billion, with a base case near $0.6 billion. Demand conditions also
              matter more than headline TAM. JCHS counted 46.1 million renter households, Yardi projected 458,731
              multifamily completions in 2026, and Apartments.com expects AI-based leasing to scale in 2026 even as
              supply slows. Those data points support a large recurring workflow base and continued operator urgency
              around conversion, renewal, and service responsiveness.
            claimRefs:
