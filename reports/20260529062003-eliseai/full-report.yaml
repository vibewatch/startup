      - number: '2.5'
        title: Contradictions and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The key analytical mistake would be to treat every property-management-software number as if it described
              EliseAI’s actual addressable market. The public estimates differ because some pages describe all PMS
              spend, others include broad proptech or adjacent modules, and still others mix residential, commercial,
              and facilities workflows. Public evidence is also thin on real category pricing, market share, or
              deployment timelines by segment. EliseAI’s materials explain common pricing structures and cite ROI
              outcomes, but they do not disclose average contract value, churn, or win rates against AppFolio, RealPage,
              Yardi, or Entrata. Nor is there a vendor-neutral public dataset that cleanly separates conversational
              leasing automation from full-suite PMS spend. The right diligence stance is therefore: use the constrained
              North American residential workflow slice as the decision-grade lens; treat broad PMS figures as outer
              context, not valuation inputs; and request customer cohort data, pricing by portfolio type, and
              compliance-workflow performance before underwriting aggressive share-capture assumptions.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM017
              - CM018
              - CM023
              - CM033
              - CM034
              - CM036
              - CM039
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Always-on response turns AI from feature into operating model
            body: >-
              The strongest evidence is not a speculative TAM chart but the combination of 24/7 response, after-hours
              coverage, and centralization outcomes. Once operators believe missed leads, renewals, and service requests
              are measurable margin leakage, leasing automation becomes an operations budget line rather than a chatbot
              experiment.
            calloutType: strength
            claimRefs:
              - CM022
              - CM023
              - CM025
              - CM026
              - CM027
              - CM028
          - type: callout
            title: Fair-housing and automated-outreach rules are hard constraints, not soft ethics
            body: >-
              Housing AI cannot be evaluated like a generic marketing copilot. HUD, CFPB, FTC, and FCC sources all show
              that screening, ad targeting, scoring, robocalls, and robotexts carry live legal exposure. Any
              market-share assumption that ignores compliance design, audit logs, or human override is overstated.
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM040
          - type: callout
            title: Decision-grade market sizing is far narrower than broad PMS TAM pages
            body: >-
              The credible way to size EliseAI is to start with broad PMS context and then narrow to North American
              residential lease-and-tenant workflows. That workflow slice still matters strategically, but it is
              materially smaller than the headline $30B-style pages that bundle together unrelated property, facilities,
              and commercial software spend.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
