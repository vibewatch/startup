      - number: '4.3'
        title: Capital adequacy and hiring load
        blocks:
          - type: paragraph
            body: >-
              The growth story is real. EliseAI publicly disclosed a $35M Series C in 2023, a $75M Series D in 2024, and
              a $250M Series E in 2025, while also saying ARR crossed $100M and headcount doubled from roughly 150 to
              over 300 after the Series D. The problem is not lack of momentum; it is lack of reconciliation. The
              about-us page says $360M raised, the homepage still shows $140M raised, TechCrunch said the Series D
              brought total funding to $140M, and third-party datasets push post-Series E totals into a $325M-$382M
              range. Headcount shows similar variance across official and directory surfaces. That leaves capital
              adequacy directionally positive but not underwritable. A $250M round after $100M ARR should remove
              immediate financing pressure, yet public sources still do not reveal cash on hand, burn, runway, or any
              outstanding debt. The clearest visible use of proceeds is people: management repeatedly says hiring,
              especially engineering, is the main next-step priority.
