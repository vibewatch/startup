      - number: '7.2'
        title: Operational, Privacy, and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              EliseAI's product surface now spans omnichannel resident and patient communications, which means
              reliability and privacy failures can propagate directly into lost tours, missed maintenance handoffs, and
              patient-access problems. The company's own healthcare privacy policy says it records communications across
              email, phone, text, and webchat and may copy connected inbox and calendar contents to operate services.
              Those design choices can improve workflow coverage, but they also concentrate sensitive data and raise the
              stakes for consent handling, message retention, and access control. Reliability risk is also observable in
              public sources: the support center documents a backup voice-generation path and a full reroute to the
              leasing office during VoiceAI outages, while the status feed records a system-update outage. That
              combination is better than having no fallback plan, but it also confirms that a service failure pushes
              workload and service degradation back to customers. Public sources do not disclose a customer-facing
              uptime SLA or a detailed public trust package, so investors cannot independently bound residual outage or
              control risk from outside the diligence room.
