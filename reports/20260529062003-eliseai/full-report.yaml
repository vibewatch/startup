  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or evidence
      - Transmission to thesis
      - Action implication
    rows:
      - - Current ARR below $150M
        - >-
          Management disclosure, diligence room, or audited statements show ARR materially below the level needed for
          even a 15x multiple defense.
        - >-
          Breaks the argument that the current mark is already backed by much stronger economics than public evidence
          shows.
        - Re-underwrite valuation on 7x–10x or lower and assume downside to or below the base case.
      - - Weak gross margin or poor retention
        - Gross margin lands far below software norms or NRR/churn signals poor durability.
        - Turns the business from premium software into lower-quality automation/services economics.
        - Lower the comp set and require meaningfully lower entry pricing.
      - - Non-standard preference stack
        - >-
          Liquidation preferences, participating preferred, or heavy secondaries meaningfully reduce downside protection
          for new money or common outcomes.
        - Headline valuation no longer maps cleanly to investable equity value.
        - Demand waterfall model and reset pricing to post-preference outcomes.
      - - Regulatory escalation in multifamily AI
        - >-
          New antitrust, fair-housing, or consumer-protection actions expand beyond RealPage-style pricing tools into
          adjacent workflow AI.
        - Raises compliance cost and multiple compression risk across the category.
        - Add regulatory discount and slow any investment decision.
      - - Landlord budget stress persists through 2026
        - Weak rent growth, concessions, and occupancy pressure keep operators in cost containment mode.
        - Extends sales cycles and lowers willingness to pay premium software prices.
        - Move to the base or bear scenario unless ROI evidence is unusually strong.
    notes: >-
      These triggers are framed as monitorable public or diligence events that would move the valuation view materially,
      not minor operating misses.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV042
      - CV045
      - CV047
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR by segment
        - Housing ARR, healthcare ARR, implementation revenue, and current quarter run-rate.
        - Determines whether the 22x public-floor multiple is stale or still the right anchor.
        - Request audited or board-approved ARR bridge from CFO.
      - - Gross margin and burn
        - Gross margin by product line, operating burn, and cash runway post-Series E.
        - Separates premium software economics from labor-heavy automation economics.
        - Request monthly financial package and budget-vs-actuals.
      - - Retention and concentration
        - NRR, gross retention, top-customer share, and renewal cohorts.
        - Shows whether installed-base scale is durable and diversified enough to support premium multiples.
        - Request cohort tables and top-20 customer revenue concentration.
      - - Pricing and unit economics
        - Per-unit or per-site pricing, contract length, upsell cadence, and sales payback.
        - Explains whether ARR can compound efficiently from the current base.
        - Request standard order forms and recent cohort economics.
      - - Cap table and preference stack
        - Series E price per share, liquidation preferences, anti-dilution terms, and secondaries.
        - Determines real downside protection and common-equity outcomes.
        - Obtain charter, financing docs, and waterfall model from counsel.
      - - Healthcare expansion quality
        - Customer count, ARR, and margin profile for the healthcare vertical.
        - Bull-case valuation assumes the second vertical adds more than TAM slideware.
        - Request separate healthcare KPI pack and customer references.
    notes: >-
      These asks focus on the few data sets that could most quickly change the recommendation or clear the current
      valuation overhang.
    claimRefs:
      - CV036
      - CV037
      - CV042
      - CV046
      - CV047
