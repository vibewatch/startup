  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              EliseAI should be analyzed as workflow software for housing operators, not as generic real-estate
              software. Its own platform pages define the product around leasing, resident management, maintenance,
              renewals, delinquency, and reporting, delivered across voice, SMS, email, and web chat. That puts the
              company in the intersection of property-management software, leasing automation, and
              resident-communication tooling. The included spend is therefore operator-paid software and service spend
              tied to prospect response, tour scheduling, resident service, collections, workflow routing, and
              centralization enablement. Excluded spend includes pure accounting-led PMS modules, construction tech,
              brokerage CRMs, one-off call centers, and non-housing vertical contact-center AI. The practical substitute
              set is not empty: AppFolio, Yardi, RealPage, and Entrata all frame the market around leasing, payments,
              maintenance, compliance, reporting, and resident portals, while manual site teams still cover the same
              jobs through phone calls, email, spreadsheets, and after-hours staffing. EliseAI’s wedge is that it layers
              always-on conversational automation and centralization on top of those existing systems rather than asking
              operators to rip out every system of record on day one.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
