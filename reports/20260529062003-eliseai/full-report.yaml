      - number: '2.4'
        title: Adoption drivers, trust constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are operational rather than theoretical. EliseAI and Entrata both market 24/7
              response, follow-up automation, and centralized execution; VoiceAI focuses specifically on instant tour
              booking and after-hours coverage. Independent coverage suggests those promises map to real budgets.
              Multifamily Executive reports that surveyed operators are increasing AI spend, seeing operating-expense
              reductions, and improving lead-to-lease conversion. BusinessWire’s affordable-housing survey says 91% of
              affordable operators have deployed AI and 55% have centralized onsite teams around it. Labor economics
              reinforce the story: BLS puts median pay for property managers at $66,700 and notes these workers often
              respond to off-duty emergencies, so speed and staffing relief have hard-dollar value. The main brakes are
              regulatory and trust-based. HUD’s 2024 guidance warns that AI screening and algorithmic ad targeting can
              violate the Fair Housing Act, the FTC and CFPB highlight scoring, screening, and data-accuracy risks, and
              the FCC is actively tightening AI robocall and robotext rules. These constraints do not kill adoption, but
              they force buyers toward tools that can prove guardrails, auditability, and human override.
