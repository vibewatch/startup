          critical: true
        - from: i-trust
          to: i-revenue
          label: Renewal / expansion drag
          critical: true
        - from: i-margin
          to: i-valuation
          label: Higher cost base
        - from: i-revenue
          to: i-valuation
          label: Growth multiple compression
          critical: true
