  - id: FR001
    title: Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      Severity-ranked placement of EliseAI's primary risks across a 3×3 likelihood-impact matrix. The highest-impact
      cells are fair-housing / model-bias exposure, privacy / consent failures, and reliability or channel dependence
      that can quickly affect customers.
    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
      rows:
        - label: High Likelihood
          values:
            - null
            - Implementation strain from rapid hiring; uneven PMS parity
            - Incumbent-native AI competition; large-stack integration breaks
        - label: Medium Likelihood
          values:
            - Gated trust / disclosure gaps
            - VoiceAI outage / reroute burden; affordable-housing workflow error
            - Fair-housing / model-bias challenge; TCPA / privacy failure; Zillow / OpenAI leverage
        - label: Low Likelihood
          values:
            - null
            - Single major customer churn event
            - Material healthcare privacy incident or successful algorithmic-discrimination suit
    claimRefs:
      - CR029
      - CR031
      - CR035
      - CR045
      - CR046
      - CR047
      - CR048
  - id: FR002
    title: Risk Transmission Map — How Risks Propagate to Revenue, Margin, and Trust
    type: dag
    layout: wide
    summary: >-
      Directed graph showing how compliance, reliability, and dependency risks flow into service quality, customer
      trust, revenue durability, and financing assumptions.
    data:
      nodes:
        - id: r-fha
          label: Fair-Housing / Bias Challenge
          detail: Algorithmic discrimination, opaque screening, or ad-targeting complaint
        - id: r-privacy
          label: Privacy / Consent Failure
          detail: Recorded communications, inbox copies, or opt-out handling failure
        - id: r-outage
          label: VoiceAI Outage
          detail: Service interruption pushes calls back to customer teams
        - id: r-partner
          label: Partner / Channel Dependence
          detail: Zillow, OpenAI, or PMS changes outside EliseAI control
        - id: i-service
          label: Service Degradation
          detail: Missed leads, slower response times, or manual workarounds
        - id: i-trust
          label: Customer Trust Erosion
          detail: Operators question compliance or reliability claims
        - id: i-revenue
          label: Revenue / Retention Pressure
          detail: Lower expansion, weaker renewals, or slowed bookings
        - id: i-margin
          label: Margin Compression
          detail: Higher support, remediation, or compliance cost
        - id: i-valuation
          label: Valuation Pressure
          detail: Growth multiple compression and stricter diligence conditions
      edges:
        - from: r-fha
          to: i-trust
          label: Legal / reputational shock
          critical: true
        - from: r-fha
          to: i-revenue
