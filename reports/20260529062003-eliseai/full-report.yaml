        title: Trust, Compliance, and Known Limitations
        blocks:
          - type: paragraph
            body: >-
              EliseAI’s public compliance posture is most mature in the affordable-housing narrative, where it
              emphasizes consistent pre-approved replies, audit-friendly logging, accommodation-request escalation, and
              lower bias risk through standardized treatment. Those are sensible workflow guardrails, and they align
              with the Fair Housing Act baseline. But the public proof still leans more toward process claims than
              independent verification. This run found privacy and support surfaces plus TechCrunch reporting on
              deletion and opt-out rights, yet did not verify a housing-specific bias audit, a public housing trust
              packet, or detailed security attestations that would let an investor test control quality from the
              outside.


              The limitation story is similarly mixed. TechCrunch surfaced complaints about nuance, human handoff, and
              incomplete qualification in some conversations—exactly the failure modes that matter when automation
              touches leasing or compliance-sensitive workflows. Public docs also show dependence on outside model
              providers and partly gated support documentation. None of that breaks the product thesis, but it means
              diligence should focus on governance, escalation thresholds, and connector reliability rather than
              assuming the breadth of the marketing surface automatically translates into production-grade controls
              everywhere.
