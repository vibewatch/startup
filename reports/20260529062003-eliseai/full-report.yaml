  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context and evidence-backed thesis
        blocks:
          - type: paragraph
            body: >-
              EliseAI now has two distinct public valuation anchors. The first came on August 14, 2024, when the company
              announced a $75 million Series D at a valuation above $1 billion. The second came in August 2025, when
              Reuters and the company's own release described a $250 million Series E that lifted the mark to more than
              $2.2 billion. The public bull case is straightforward: the business kept compounding after the Series C,
              reported more than 2.5x ARR growth between Series C and Series D, crossed $100 million ARR by 2025, and
              built unusually deep distribution across U.S. multifamily operators.


              The adoption evidence is real. EliseAI said it served more than 600 owners and operators, including 75% of
              NMHC's Top 50, while Reuters and AlleyWatch placed the software in roughly one in eight U.S. apartments.
              That combination of workflow depth, installed base, and healthcare expansion makes the company look more
              like a category-defining vertical AI platform than a feature add-on.


              The financing record, however, is not perfectly clean in retained public sources. TechCrunch said the
              Series D brought total capital raised to $140 million, while AlleyWatch later said total funding reached
              $391.9 million after the Series E, implying roughly $141.9 million had been raised beforehand. PitchBook
              printed a much higher $171.9 million. The cleanest public read is therefore that EliseAI had raised about
              $140 million to $141.9 million after Series D, not a single fully reconciled exact figure. That
              discrepancy does not negate the thesis, but it is a reminder that even basic cap-structure questions
              remain partially opaque from public evidence.
            claimRefs:
