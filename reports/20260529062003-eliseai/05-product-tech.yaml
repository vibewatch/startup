    - Provides frontier-model and voice-model capability for some surfaces
    - OpenAI API plus disclosed voice-model partners
    - Vendor pricing, model quality, or policy changes can affect product performance
  - - Support and admin surface
    - Hosts rollout instructions, support content, and troubleshooting
    - Help center plus customer-success organization
    - Public documentation is partly gated behind login
  notes: This architecture view is inferred from public workflow, integration, and support surfaces rather than from disclosed cloud-infrastructure diagrams.
