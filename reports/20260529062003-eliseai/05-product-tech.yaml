- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - EliseAI solution
  - Measurable benefit
  - Known limitation
  rows:
  - - New lead from listing or website
    - Manual call-back or email follow-up
    - AI engages via voice, SMS, email, or chat and books tours
    - PeakMade reported 20% more in-person tours; Zillow page promises instant engagement
    - Independent review still flags qualification and nuance gaps
  - - Inbound phone prospect
    - Call center or onsite agent handles sequentially
    - VoiceAI answers 24/7 and logs the interaction into EliseCRM
    - PeakMade reported 81% more phone-generated leads after adding VoiceAI
    - Public SLA or abandon-rate detail is not disclosed
  - - Resident renewal or delinquency question
    - Staff manually respond and follow up
    - ResidentAI automates reminders, explanations, and follow-up tasks
    - Company positions the workflow as lowering bad debt and improving renewal velocity
    - Outcome evidence is mostly company-generated
  - - Maintenance request intake
    - Resident leaves voicemail or text that staff rekey into a system
    - AI captures details, creates the work order, categorizes urgency, and routes it
    - Student Quarters case on the maintenance page cites 26% fewer emergency maintenance calls
    - No independent error-rate study found
  - - Technician dispatch and execution
    - Supervisor manually assigns and checks status
    - Maintenance App auto-assigns, tracks geo-fenced time, and syncs updates
    - Public app-store and FAQ material highlight time tracking and workload visibility
    - Inventory and vendor-management scope is not fully public yet
  - - Affordable-housing inquiry
    - Staff must respond consistently and preserve an audit trail
    - Pre-approved replies, waitlist automation, accommodation flagging, and logs
    - Supports equal-treatment documentation and lower admin burden
    - No independent housing bias-audit result was verified
  notes: Benefit cells separate named customer outcomes from company claims; limitation cells highlight gaps where public diligence still lacks control detail.
