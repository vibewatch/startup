chapter:
  number: 5
  title: Product & Technology
  summary: 'EliseAI’s housing product has evolved into a portfolio operating stack anchored by EliseCRM, VoiceAI, resident-service automation, maintenance intake, and a technician-facing Maintenance App. Public evidence shows real breadth across channels, integrations, and centralization workflows, plus active product investment in multilingual voice and adjacent operating modules. The main diligence risks are not product-surface breadth but verification depth: implementation docs are partly gated, independent fair-housing or security attestations are thin, and public CRE-specific proof still lags the multifamily story.'
sections:
- id: product-suite-and-workflow
  title: Product Suite and Housing Workflow Coverage
  body: >-
    EliseAI has moved well beyond a single leasing bot and now markets a housing operating stack that spans the prospect-to-resident journey. The public product surface centers on EliseCRM as the system of record for guest cards, calendars, tasks, campaigns, reporting, and conversation history, with LeasingAI, ResidentAI, VoiceAI, and maintenance automation layered on top. In practical workflow terms, the company promises to capture new leads from listings or websites, answer follow-up questions in voice, SMS, email, and chat, book tours, keep renewals and delinquency touchpoints moving, and turn resident maintenance conversations into routed work orders.


    That breadth is not just naming convention. The next-generation platform launch explicitly grouped maintenance, renewals, delinquency, and general resident requests under the resident-services surface, while the live product pages push the Maintenance App as an integrated field-execution layer rather than a separate bolt-on. Named customer stories from PeakMade, Mill Creek, Greystar, and GoldOller support the idea that EliseAI is used across portfolio operations, but the strongest public proof is still company-hosted case material rather than fully independent benchmarking.
  claimRefs:
  - CE001
  - CE002
  - CE006
