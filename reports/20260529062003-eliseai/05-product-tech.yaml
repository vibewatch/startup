  title: Technology / Operating Architecture Table
  columns:
  - Layer or component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Communication channels
    - Handles voice, SMS, email, web chat, and listing-entry conversations
    - Telephony and messaging providers plus VoiceAI runtime
    - Underlying carrier and routing providers are not fully public
  - - EliseCRM record and routing layer
    - Stores guest cards, calendars, tasks, transcripts, campaigns, and reports
    - PMS or CRM sync plus internal workflow rules
    - Bad mappings or broken syncs can fragment the operating picture
  - - Maintenance execution layer
    - Turns resident issues into dispatched and tracked work orders
    - Technician devices, mobile apps, field connectivity, and permissions
    - Offline mode exists but some creation flows may still depend on connectivity
  - - Partner integration layer
    - Connects PMS, CRM, touring, access, and marketplace surfaces
    - Native connectors, APIs, webhooks, and partner marketplaces
