  evidenceGaps:
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Independent housing-platform security attestations, housing-specific bias-testing artifacts, or a public trust packet with concrete control descriptions.
    whyItMatters: The company markets privacy, accessibility, and fair-housing consistency, but outside diligence still cannot verify whether those controls are independently tested or merely policy statements.
    diligencePath: Request current SOC 2 or ISO summaries, housing-model governance materials, trust-center access, and any fair-housing review memos from customer diligence.
    relatedQuestionRefs:
    - QE016
    - QE018
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: integration-depth
    missingEvidence: Object-level field maps, sync directions, webhook behavior, error handling, and SLAs for named PMS integrations.
    whyItMatters: Integration depth determines whether EliseAI can truly replace manual handoffs or only sit on top of existing workflows.
    diligencePath: Request connector implementation guides, API field-mapping docs, sandbox access, and a live walkthrough of one PMS sync from lead creation through work-order close.
    relatedQuestionRefs:
    - QE010
    - QE012
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: cre-workflows
    missingEvidence: Standalone CRE or mixed-use product documentation, named commercial customers, and public module specs for lease administration or accounting workflows.
    whyItMatters: Commercial-real-estate expansion is strategically important, but current public evidence is still more suggestive than conclusive.
    diligencePath: Ask for customer references, CRE-specific demo environments, and product one-pagers for accounting, commercial leasing, and mixed-portfolio administration.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: minor
    topic: patents-ip
    missingEvidence: Company-assigned patents, published patent applications, or technical papers covering housing voice automation, leasing orchestration, or maintenance routing.
    whyItMatters: IP depth affects defensibility, especially if differentiation otherwise rests on integration breadth and workflow tuning.
    diligencePath: Review USPTO or Google Patents results with management, ask counsel for filed applications, and request any unpublished technical collateral used in enterprise sales.
    relatedQuestionRefs:
    - QE024
  - type: access-blocked
    severity: minor
    topic: support-docs
    missingEvidence: Ungated admin and implementation articles, API sandbox docs, and configuration playbooks from the EliseAI support center.
    whyItMatters: Login-gated support content makes it hard to validate how much configuration burden sits on customers versus EliseAI’s onboarding team.
    diligencePath: Request temporary support-center access or exported knowledge-base articles covering setup, escalation rules, language packs, and integration troubleshooting.
    relatedQuestionRefs:
    - QE012
    - QE020
