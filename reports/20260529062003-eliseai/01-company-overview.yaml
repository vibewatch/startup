- id: capital-governance-and-current-scale
  title: Capital, Governance, and Current Scale
  body: 'EliseAI’s capital formation has accelerated in three clear steps: a small 2019 seed filing and 2021 exempt round, a $35 million Series C in 2023, a $75 million Series D in 2024 that pushed the company above a $1 billion valuation, and then a $250 million Series E in 2025 led by Andreessen Horowitz. Reuters and CNBC both reported that the Series E valued the company above $2.2 billion, while the company itself said the round came after surpassing $100 million of ARR and after headcount had grown from 150 to over 300 full-time employees. Governance broadened alongside the raises, with Eddie Kang linked to the Series C board expansion, Cathy Gao to the Series D board seat, and Alex Immerman appearing in the 2025 SEC filing after the a16z-led round. Public scale disclosures are strong but not perfectly synchronized: the current about page says 5M-plus units and 600-plus owners and operators, the Series E materials said 75% of NMHC’s Top 50 and 10% of the apartment market, CNBC reported
    700-plus owners/operators and one in six rental units, and the home page still displayed an older $140 million funding total at run time. For later chapters, that means funding, reach, and headcount claims should be anchored to dated disclosures instead of recycled from generic landing-page copy.'
