- id: milestones-partnerships-and-regulatory-context
  title: Milestones, Partnerships, and Regulatory Context
  body: 'EliseAI’s milestone cadence shows a company moving from category wedge to broader essential-services platform. It announced one million units on platform in January 2023, raised Series C that June, reached unicorn status with Series D in August 2024, opened San Francisco and Chicago offices in 2025, and used Series E to frame itself as an AI company for both housing and healthcare. Partnerships also moved the product closer to operational infrastructure: Zillow Rentals embedded EliseAI into listing-level leasing workflows, while Brivo added access-control plumbing for secure AI-guided self-tours. Public proof points suggest real operator adoption, including Asset Living’s 450,000-unit deployment and an EliseAI/ALN study covering 3,763 communities. The sequencing is notable: financing, office openings, partnerships, and customer-proof all cluster around the 2024-2025 period, which suggests EliseAI was using fresh capital to turn messaging software into a more embedded operating layer
    for owners and operators. A relevant downside lens comes from sector-level fair-housing scrutiny: 2024 SafeRent settlement reporting shows how AI systems involved in housing can draw discrimination challenges, and EliseAI’s own 2025 support documentation emphasizes standardized answers, protected-class handoffs, and neutral treatment as a risk-control posture rather than as an independently audited outcome.'
