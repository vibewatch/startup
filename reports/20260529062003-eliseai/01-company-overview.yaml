chapter:
  number: 1
  title: Company Overview
  summary: EliseAI is a New York-based vertical AI company founded in 2017 by Minna Song and Tony Stoyanov that built its initial wedge in housing workflows before expanding into healthcare. Public disclosures show financing stepping from a $35M Series C in 2023 to a $75M Series D in 2024 and a $250M Series E in 2025; Reuters and CNBC reported the latest round valued the company above $2.2B and official materials said EliseAI had crossed $100M ARR. The public record also shows meaningful scale—millions of units touched, 600-700+ operators, and major customer logos—tempered by inconsistent metric freshness across company surfaces and a real fair-housing regulatory backdrop for housing AI.
sections:
- id: identity-product-and-leadership
  title: Identity, Product, and Leadership
  body: EliseAI is a New York-based, Delaware-incorporated company founded in 2017 by Minna Song and Tony Stoyanov. Its SEC filings continue to use the legal name Elise A.I. Technologies Corp., while the current company site and 2024-2025 filings place headquarters at 33 E 33rd Street, 2nd Floor, New York, NY 10016. Song remains CEO and the company’s dominant public spokesperson, while Stoyanov is the technical co-founder and CTO. Public interviews and founder profiles tie Song’s founder-market fit to both MIT computer-science training and first-hand exposure to rental-administration pain points, which helps explain why EliseAI was built as a deep workflow layer instead of a generic chatbot. The current platform spans leasing, resident operations, delinquency, maintenance, renewals, tours, and communication workflows across voice, SMS, email, and web chat, organized around EliseCRM. Although housing remains the core wedge, EliseAI had already expanded into healthcare by 2023 and now positions
    patient scheduling and front-desk automation as a real second vertical. That combination of founder-led product vision and workflow-level specificity matters because later diligence chapters will reuse these identity facts as ground truth; it also explains why public materials still imply meaningful key-person concentration around Song and the original product thesis.
