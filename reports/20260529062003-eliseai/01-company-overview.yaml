callouts:
- calloutType: strength
  title: Vertical AI moved from housing wedge to essential-services platform
  body: By 2025 EliseAI was no longer pitching a narrow leasing bot. The public record shows a company that used housing workflow credibility to raise a much larger Series E, cross the $100M ARR threshold, and then double down on healthcare administration—an expansion path that broadens its strategic narrative well beyond multifamily point software.
  claimRefs:
  - CO012
  - CO021
  - CO022
  - CO047
- calloutType: risk
  title: Public disclosure freshness is a real diligence issue
  body: EliseAI’s scale trajectory is clearly up and to the right, but the exact public numbers are not perfectly synchronized. The home page still showed an older $140M funding total at run time, while newer pages and filings support a figure above $360M; similarly, operator and unit counts vary across official and independent surfaces. Later chapters should anchor volatile metrics to the freshest evidence, not the prettiest landing page.
  claimRefs:
  - CO020
  - CO025
  - CO027
  - CO044
  - CO045
- calloutType: assumption
  title: Fair-housing posture is documented, not independently audited
  body: The strongest public evidence on EliseAI’s compliance posture is the company’s own 2025 fair-housing guidance. That matters, but it is not the same thing as a third-party audit or a public enforcement clean bill of health. Given the broader litigation climate around housing AI, diligence should treat compliance process evidence as necessary but not fully sufficient.
  claimRefs:
  - CO042
  - CO043
