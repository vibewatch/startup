  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-cap-table
    missingEvidence: Exact post-Series-E board composition, ownership percentages, liquidation preferences, and any investor observer or veto rights.
    whyItMatters: Control rights and dilution economics affect strategic flexibility, refresh risk, and any later valuation analysis.
    diligencePath: Request the current cap table, board list, investor rights summary, and the post-Series-E financing documents under NDA.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Exact ARR, revenue growth, gross margin, burn, and a housing-versus-healthcare revenue mix breakdown.
    whyItMatters: Chapter 1 can establish that EliseAI crossed $100M ARR, but not how much of that scale is durable, profitable, or diversified across verticals.
    diligencePath: Ask management for audited or board-reported KPI packs covering revenue, gross margin, cash burn, and vertical mix for 2024-2026.
    relatedQuestionRefs:
    - QO010
    - QO026
  - type: conflicting-data
    severity: material
    topic: scale-metric-definitions
    missingEvidence: A reconciled definitions sheet for units served, apartment-market penetration, owners/operators, customers, and current employee count as of the run date.
    whyItMatters: Different public surfaces cite different scale cutoffs, making it risky to lift a single number into later chapters without a freshness and definition check.
    diligencePath: Request a current company metrics sheet that defines each scale term and maps every public claim to one internal source of truth.
    relatedQuestionRefs:
    - QO011
    - QO012
    - QO023
    - QO024
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: milestone-completeness
    missingEvidence: Internal launch, office, governance, and healthcare-expansion milestones that were not publicly announced.
    whyItMatters: The public chronology is strong enough for a chapter overview, but it may omit inflection points that matter for execution history and investor timing.
    diligencePath: Ask for an internal corporate timeline or board deck chronology covering financing, product releases, office openings, and leadership changes.
    relatedQuestionRefs:
    - QO016
    - QO017
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: fair-housing-audit
    missingEvidence: A third-party audit, regulator letter, or independent evaluation directly assessing EliseAI’s own fair-housing outcomes.
    whyItMatters: Company-authored compliance documentation is helpful, but the regulatory downside in housing AI is meaningful enough that external validation would materially improve confidence.
    diligencePath: Request third-party audit reports, legal memos, internal compliance testing summaries, and any regulator correspondence covering fair-housing controls.
    relatedQuestionRefs:
    - QO027
