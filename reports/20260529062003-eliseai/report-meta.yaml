companyProfile:
  summary: >
    EliseAI is a New York-based vertical AI company founded in 2017 by Minna Song (CEO) and Tony Stoyanov (CTO).
    It started as an AI leasing assistant for multifamily housing operators and has since grown into a full resident-lifecycle
    automation platform covering leasing, CRM, maintenance, delinquency, renewals, and collections—plus an emerging
    healthcare communications product. By mid-2025 the company had surpassed $100 million in ARR, deployed software
    across more than two million apartment units, and raised $360 million total from Andreessen Horowitz, Bessemer
    Venture Partners, Sapphire Ventures, Point72, and others. The August 2024 Series D (led by Sapphire) confirmed
    unicorn status at a $1 billion-plus valuation; the 2025 Series E (led by a16z) pushed the reported mark to roughly
    $2.2 billion. Regulatory exposure around fair-housing and AI bias is the primary diligence risk that public evidence
    cannot resolve.
