- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Fair-housing / model-bias exposure
    - External audit evidence, complaint volume, and internal bias-test cadence
    - Company cannot produce current disparate-impact testing or receives a regulator / plaintiff challenge tied to housing decisions
    - Pause conviction and require legal / model-governance diligence before underwriting further growth
  - - TCPA / privacy / recording compliance
    - Opt-out handling logs, consent architecture, and breach / complaint notices
    - Material consent-handling failures, unexplained recording practices, or a significant privacy incident
    - Treat as a thesis break for communications automation until controls are remediated
  - - VoiceAI reliability
    - Incident frequency, availability metrics, and reroute dependence
    - Repeated outages or evidence that customers routinely absorb calls manually during service issues
    - Haircut adoption and margin assumptions; require SLA-backed reliability evidence
  - - Partner / integration dependence
    - Major-stack parity, partner roadmap changes, and channel concentration
    - Loss of a major integration path, Zillow leverage increase, or deterioration in OpenAI / model economics
    - Reduce confidence in expansion and renewals; model slower growth and higher support cost
  - - Incumbent competition / concentration
    - Win-rate trends against PMS-native AI and top-customer / top-channel mix
    - Native PMS AI wins begin displacing EliseAI in large portfolios or a few logos dominate bookings
    - Move from growth-underwrite to concentration-risk underwriting until retention and diversification data improve
  notes: 'Kill criteria are intentionally monitorable: each row names the artifact or event an investor can request or watch rather than a generic “watch competition” placeholder.'
