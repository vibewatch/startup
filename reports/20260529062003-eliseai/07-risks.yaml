- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: EliseAI is not starting from zero on mitigation. Public documents show it has a privacy-rights intake process, a product-by-product integration matrix, and a VoiceAI fallback procedure that at least attempts continuity during outages. Customer evidence also suggests the company can create tangible workflow value in affordable housing and large multifamily operations. But the residual risk profile remains high because the strongest public proofs are still company-authored, while the hardest questions — bias testing, concentration, and uptime commitments — remain private. The practical investment posture is therefore to treat fair-housing/model-bias risk, reliability risk, and partner-dependency risk as monitored conditions rather than abstract disclosures. The thesis breaks if EliseAI cannot produce evidence that automation touching housing decisions is being audited for disparate impact, if outages or consent failures start pushing labor back to customers at scale, or if large PMS
    vendors and key channels close the feature gap faster than EliseAI can maintain cross-stack product superiority.
