callouts:
- calloutType: risk
  title: Fair-housing exposure is the most asymmetric downside
  body: A product that touches leasing, prequalification, housing advertising, or resident communications can absorb disproportionate reputational and legal damage if outside observers conclude that AI changed who got housing opportunities or how applicants were treated.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR042
- calloutType: risk
  title: Reliability risk is already observable, not theoretical
  body: EliseAI's own support docs and incident feed show both the presence of fallback procedures and the reality of a public VoiceAI outage; that is a positive signal of operational preparation, but also hard evidence that customers can be forced back into manual operations.
  claimRefs:
  - CR007
  - CR008
  - CR046
- calloutType: insight
  title: Integrations create both moat and fragility
  body: The same cross-stack integration breadth that makes EliseAI attractive to operators also leaves it exposed to third-party roadmap changes and to native AI modules launched by the very PMS vendors it depends on.
