chapter:
  number: 7
  title: Risks
  summary: EliseAI's most material risks are fair-housing / model-bias exposure, privacy-and-consent failures in omnichannel communications, product-reliability risk that can push work back to customers, and rising dependency / competition risk as Zillow, OpenAI, and native PMS AI offerings gain leverage. Public evidence supports strong product adoption and large-operator relevance, but public governance, concentration, and uptime disclosures remain too thin to fully de-risk those exposures.
sections:
- id: regulatory-and-model-bias-risk
  title: Regulatory, Fair-Housing, and Model-Bias Risk
  body: 'EliseAI''s hardest-to-hedge risk is not a generic software bug; it is the possibility that automation embedded in leasing, applicant handling, housing advertising, or collections is later judged to have produced discriminatory outcomes. HUD''s May 2024 AI guidance explicitly pulled tenant screening and housing advertising into a named Fair Housing Act enforcement lane, while DOJ''s SafeRent intervention shows screening vendors can face FHA disparate-impact claims when algorithmic scores disadvantage protected classes or voucher holders. CFPB guidance adds a second layer: if complex models drive adverse outcomes, companies still need specific, explainable notices and a dispute path. That framework matters for EliseAI because its affordable-housing proof points emphasize prequalification, lead triage, collections, and centralized decision support in a market where compliance-heavy rules and vulnerable applicant populations make error tolerance low. Public materials do not show an
    independent fair-housing or bias audit for EliseAI, so the company may be scaling workflow automation faster than outside investors can verify governance maturity.'
  claimRefs:
