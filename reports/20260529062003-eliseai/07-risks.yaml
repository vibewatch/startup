  evidenceGaps:
  - type: missing-source
    severity: material
    topic: missing-governance-disclosure
    missingEvidence: Independent fair-housing or model-bias audit results, disparate-impact testing cadence, and remediation thresholds for housing-facing models.
    whyItMatters: Without third-party testing, investors cannot tell whether automation that touches prospect qualification, housing advertising, or resident communications is being monitored for disparate impact before regulators or plaintiffs do.
    diligencePath: Request the most recent fair-housing or algorithmic-bias review, model cards, escalation policies, and any external counsel or auditor memos on FHA exposure.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: missing-reliability-disclosure
    missingEvidence: Public or diligence-room uptime SLA, service-credit policy, trust-center controls, and incident-history summary for VoiceAI and core messaging services.
    whyItMatters: A real outage and an explicit reroute plan show the service can fail; without SLA and control documentation, residual reliability risk cannot be bounded.
    diligencePath: Request customer MSA uptime commitments, incident postmortems, trust-center artifacts, and quarterly availability metrics segmented by product line.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: missing-concentration-disclosure
    missingEvidence: Top-10 customer revenue mix, logo concentration by unit count, Zillow-sourced lead share, and revenue split between housing and healthcare.
    whyItMatters: Public case studies prove large-operator adoption but not how concentrated bookings or renewals are. A few large accounts or channels could dominate revenue and renewal risk.
    diligencePath: Request cohort revenue by top customers, top channels, and top PMS stacks, plus churn sensitivity if a major operator or distribution partner standardizes on a native PMS AI alternative.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
