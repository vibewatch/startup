- id: dependency-competition-and-concentration-risk
  title: Dependency, Competition, and Concentration Risk
  body: 'EliseAI''s growth narrative depends on two things happening at the same time: partner systems must keep working, and large operators must keep choosing a cross-stack AI layer instead of the increasingly capable native AI tools from their PMS vendors. The integrations matrix shows real stack asymmetry — Knock is the only RealPage CRM supported, AppFolio leasing requires extra API access, Yardi Breeze is unsupported, Yardi Voyager lacks a native leasing calendar, and some renewals workflows do not exist on AppFolio or RealPage. At the same time, RealPage, Yardi, Entrata, and AppFolio are all marketing native AI for leasing, maintenance, or operations, while Zillow owns a key lead-capture surface and OpenAI provides healthcare model credibility and infrastructure. Public customer proof also clusters around large multifamily and affordable-housing operators such as Greystar and Fitch Irick, which is useful proof of enterprise relevance but not proof of low concentration. Because public
    sources disclose logos rather than revenue mix, investors can see that EliseAI has landed large operators without being able to tell how exposed the business is to a small number of logos, channels, or stack partners.'
