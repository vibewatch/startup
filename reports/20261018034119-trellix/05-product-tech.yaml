    rows:
      - ["Endpoint security", "Security operations and endpoint teams", "Current, explicitly listed product family", "Single-vendor tie-in to XDR positioning and hybrid-environment coverage", "Need public proof of agent convergence, performance overhead, and migration from inherited tools"]
      - ["Data security", "Security and compliance teams", "Current, explicitly listed product family", "Keeps DLP and encryption inside the same commercial portfolio", "Need public evidence for policy coverage, cloud scope, and certification mapping"]
      - ["Network security", "SOC and network-security teams", "Current, explicitly listed product family", "Extends XDR narrative beyond endpoints into NDR, IPS, and forensics", "Need proof of cloud delivery roadmap and independent efficacy benchmarks"]
      - ["Email security", "Messaging-security and SOC teams", "Current, explicitly listed product family", "Lets Trellix market cross-vector detection rather than endpoint-only response", "Need production metrics for efficacy, admin effort, and false-positive rates"]
      - ["Threat intelligence", "Threat-hunting and IR teams", "Current, explicitly listed product family", "Pairs platform telemetry with research and intelligence services", "Need public evidence on exclusivity, update cadence, and customer-visible value"]
      - ["Security operations", "SOC managers and analysts", "Current, explicitly listed product family", "Helix, hyperautomation, ESM, and orchestration tools anchor the operating layer", "Need clarity on long-term console rationalization and cloud/on-prem operating model"]
    notes: >-
      Product-family names come from current official product listings and
      company-issued collateral; maturity here means publicly visible and
      marketed, not independently benchmarked.
    claimRefs: [CE001, CE002, CE006]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Trellix solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Unify cross-vector alert handling", "Collect alerts across endpoint, network, email, cloud, and data tools", "XDR platform plus broad security-product families", "Company claims less risk, complexity, and time to value", "No independent before/after productivity metric in assigned sources"]
      - ["Investigate incidents in one workspace", "SOC analysts correlate logs and response actions", "Helix plus integrated SecOps tooling", "Internal SOC users say having everything in one place reduces tool switching", "Case study is company-issued and not an external customer reference"]
      - ["Integrate existing controls into the platform", "Connect native and third-party security technologies", "Open APIs and broad ingestion into Helix/XDR", "Open model should reduce rip-and-replace pressure", "No public implementation-depth or connector-maintenance data"]
      - ["Apply threat context to prioritization", "Use intelligence and research to rank and explain events", "Threat-intelligence family plus Advanced Research Center and analytics", "Public materials position AI/ML and intelligence as triage accelerants", "Assigned pool lacks independent proof on alert-quality uplift or false-positive reduction"]
    notes: >-
      Benefits are kept qualitative unless the source gives a numeric outcome;
      the assigned pool supports workflow claims better than quantified ROI.
    claimRefs: [CE001, CE007, CE008, CE009, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Telemetry and controls", "Endpoint, network, email, data, and cloud security products generate events and enforce policy", "Depends on multiple legacy product families remaining operable and connected", "Breadth can mask inconsistent UX, policy models, and upgrade cadence"]
      - ["Correlation and response plane", "Helix/adjacent SecOps tools aggregate, correlate, score, and automate response workflows", "Depends on integration quality across native and open technologies", "Public evidence does not quantify reliability, throughput, or tuning burden"]
      - ["Management and orchestration", "ePO and related consoles support policy orchestration and administration", "Depends on coexistence between inherited McAfee and FireEye-era operating surfaces", "Convergence path is not publicly detailed in the assigned pool"]
      - ["Research and intelligence enrichment", "Threat intelligence and Advanced Research Center content add context and recommendations", "Depends on sustained research operations and content distribution into product workflows", "No independent evidence in this pool shows how differentiated the output is in day-to-day analyst operations"]
    notes: >-
      This is a public-surface architecture synthesis from official and trade
      sources, not a vendor-published low-level reference architecture.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Trellix's public architecture reads as layered controls, operations, and intelligence around an XDR core rather than a single monolithic application.
    data:
      layers:
        - label: Endpoint controls
          summary: Endpoint tools provide prevention, detection, forensics, and remediation coverage across hybrid environments.
          items:
            - Endpoint Security
          modules:
            - Endpoint Detection and Response (EDR)
            - Endpoint Forensics
          outputs:
            - Endpoint telemetry, alerts, and remediation actions
        - label: Network controls
          summary: Network products extend the platform into detection, prevention, and forensic capture across hybrid environments.
          items:
            - Network Detection and Response
            - Intrusion Prevention System
          modules:
            - Network Forensics
          outputs:
            - Network telemetry and threat detections
        - label: Email and collaboration controls
          summary: Email-security products add messaging-layer detection and protection into the broader XDR posture.
          items:
            - Email Security
            - IVX for Collaboration Platforms
          modules:
            - Phishing Simulator
          outputs:
            - Collaboration alerts and phishing-defense signals
        - label: Data protection controls
          summary: Data-security products keep DLP, encryption, and database-security functions inside the same portfolio.
          items:
            - Data Loss Prevention
            - Data Encryption
          modules:
            - Database Security
          outputs:
            - Policy events and data-protection enforcement
        - label: Detection, correlation, and response
          summary: Helix and adjacent SecOps products correlate events and route investigation and response workflows.
          items:
            - Security Operations family
          modules:
            - Helix
            - Hyperautomation / Connect
            - Enterprise Security Manager
          outputs:
            - Prioritized investigations, workflows, and response actions
        - label: Intelligence, analytics, and guidance
          summary: Research, threat intelligence, and AI/ML enrichment turn the stack into Trellix's claimed XDR experience.
          items:
            - Threat Intelligence family
            - Advanced Research Center
          modules:
            - Insights
            - SecondSight
            - Threat Intelligence Exchange
          outputs:
            - Threat context, scoring, and AI-guided recommendations
    claimRefs: [CE001, CE006, CE007, CE008, CE009, CE010]
callouts:
  - calloutType: strength
    title: Broad cross-vector coverage is real
    body: >-
      The assigned source set consistently supports Trellix's breadth across
      endpoint, network, email, data, intelligence, and SecOps categories, so
      the platform claim is grounded in a real product family map rather than a
      single-product rebrand.
    claimRefs: [CE001, CE002, CE006]
  - calloutType: risk
    title: Convergence risk remains under-evidenced
    body: >-
      Public evidence supports integration intent and open-ingestion claims, but
      it does not yet prove a low-friction migration path, independently strong
      performance, or a fully rationalized operating model across inherited
      McAfee and FireEye-era components.
    claimRefs: [CE011, CE012, CE013]
