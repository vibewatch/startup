  evidenceGaps:
    - type: missing-source
      severity: material
      topic: external-customer-proof
      missingEvidence: >-
        Current independent named customer case studies, procurement awards, or
        conference talks showing external production deployments, deployment
        scale, and measured outcomes.
      whyItMatters: >-
        The assigned pool proves internal dogfooding and inherited scale, but it
        does not prove how many current external accounts are in full production
        or expanding successfully.
      diligencePath: >-
        Request three current reference customers or public procurement records
        with go-live date, deployment scope, renewal status, and quantified
        operational outcomes.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: >-
        NRR, GRR, logo churn, renewal rate, and contract-term distribution by
        product family and cohort.
      whyItMatters: >-
        Renewal durability determines whether the inherited customer base is
        sticky enough to offset module migration and competitive displacement.
      diligencePath: >-
        Obtain retention and renewal cohorts from management or lender
        materials, then reconcile them to ARR or revenue by product family.
      relatedQuestionRefs:
        - QU005
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-customer concentration, reseller concentration, and public-sector
        mix by revenue or ARR.
      whyItMatters: >-
        A 53,000-customer headline can still hide a small number of large,
        strategically important accounts or channel dependencies.
      diligencePath: >-
        Request the top-20 customer schedule, partner contribution by ARR,
        sector mix, and any revenue concentration covenants used by lenders.
      relatedQuestionRefs:
        - QU001
        - QU002
