schemaVersion: "report-v2"
artifact: customers
slug: trellix
runDate: 2026-10-18
company:
  name: Trellix
chapter:
  number: 6
  title: Customers
  summary: >-
    Trellix shows real scale through an inherited enterprise and government
    installed base that was above 40,000 customers at launch and is now claimed
    at over 53,000 customers on its current about page. The strongest named
    deployment proof in the assigned evidence is Trellix's own SOC case study,
    while the clearest durability warning is VendorBenchmark's claim that 35% of
    renewals from 2024 to 2026 resulted in partial or full migration.
sections:
  - id: customer-base
    title: Installed base breadth is real, but much of it is inherited
    body: >-
      The assigned evidence supports a genuine enterprise-scale customer base,
      but it supports it more strongly as inherited scale than as freshly
      disclosed net-new adoption. At combination close in October 2021, McAfee
      Enterprise and FireEye said the merged business had more than 40,000
      customers, and TechTarget repeated that the relaunched Trellix served more
      than 40,000 combined business and government customers in January 2022.
      Trellix's current about page raises the headline to over 53,000 customers
      and ties that reach to an extensive partner ecosystem, which suggests the
      company is still leaning on both direct enterprise relationships and
      partner-mediated distribution. What is missing is a current segmentation
      breakout by geography, public-sector share, revenue band, or how much of
      the installed base reflects inherited McAfee/FireEye contracts versus net
      new Trellix-era wins.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU015
    tableRefs:
      - TU001
  - id: adoption-proof
    title: Adoption proof is strongest for internal production use and platform breadth
    body: >-
      Public proof of active use is credible but uneven. Trellix's own SOC case
      study provides the clearest named production deployment in this pool: the
      company says its internal team runs Trellix EDR, ePO, Helix, and Insights
      together, and the named analyst quote describes a single-pane
      investigation workflow rather than a generic marketing logo. That does not
      replace independent external references, but it does show the stack is
      deployed in a live operational environment. The broader platform pages and
      launch coverage reinforce why Trellix can attempt land-and-expand motions:
      the product family spans endpoint, data, network, email, threat
      intelligence, and security operations, while company statements in
      independent coverage say the XDR ecosystem can ingest more than 600 native
      and open technologies and pull from more than one billion sensors across
      enterprise and government customer bases.
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU008
      - CU015
    tableRefs:
      - TU003
    figureRefs:
      - FU001
  - id: durability-risks
    title: Durability depends on renewals, consolidation, and competitive defense
    body: >-
      The chapter's key customer risk is not whether Trellix ever had an
      installed base; it is whether that base renews and expands fast enough to
      offset migration pressure. VendorBenchmark portrays many accounts as legacy
      McAfee estates with five to fifteen SKU lines, which makes renewal-time
      consolidation into a broader XDR commitment the main expansion lever. The
      same source also describes one- to three-year subscriptions, a recommended
      120-day renewal notice, and a 2024-2026 pattern in which 35% of renewals
      resulted in partial or full migration. TechTarget's analyst quotes add a
      second caution signal by describing the XDR market as crowded and
      questioning differentiation. Trellix therefore appears to have a real base
      to mine, but public evidence still does not disclose NRR, GRR, logo churn,
      or top-customer concentration, so durability remains inferred rather than
      cleanly measured.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU002
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale evidence
      - Revenue / strategic value
      - Gap
    rows:
      - - Legacy enterprise installed base
        - CISO and security operations teams / enterprise IT / central procurement
        - Multi-product endpoint, network, email, data, and SecOps protection
        - ">40,000 customers at close; many inherited McAfee contract structures"
        - Core renewal base and XDR cross-sell opportunity
        - No public split between inherited base and Trellix-era net-new wins
      - - Business and government customers
        - Security leaders in enterprise and public-sector environments / analysts / agency or enterprise procurement
        - XDR and broader security-operations coverage
        - TechTarget said Trellix relaunched with >40,000 combined business and government customers
        - Broadens demand beyond a single commercial niche
        - No current disclosure of public-sector share or spending concentration
      - - Partner-influenced platform customers
        - CISO buyers / operators / direct buyer with partner and reseller influence
        - Platform-wide deployment and module expansion
        - About page says Trellix empowers >53,000 customers and works with an extensive partner ecosystem
        - Indicates channel leverage as Trellix defends and extends the installed base
        - No disclosure of direct versus indirect ARR or reseller concentration
      - - Internal Trellix SOC reference account
        - Trellix security operations leadership and analysts / internal IT security budget owner
        - EDR, ePO, Helix, and Insights in live operations
        - Named team members and workflow quotes indicate production use
        - Supports product dogfooding, support credibility, and internal feedback loops
        - Self-referential proof, not an external customer validation
    notes: >-
      Sources mix historical launch disclosures with current undated official
      pages; null-equivalent gaps mean the public record does not separate
      inherited customers, current-active accounts, or segment revenue.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU006
    enumerationScope:
      coverage: partial
      basis: >-
        Partial segmentation compiled from the assigned official, news, and
        benchmark sources; the public record does not provide a full customer
        registry, sector census, or revenue-by-segment cut.
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Combined customer base at close
        - ">40,000 customers"
        - "2021-10-08"
        - McAfee Enterprise and FireEye press release
        - Medium
        - Trellix started with meaningful inherited scale
        - No split by product line, geography, or customer activity level
      - - Business and government customer base at relaunch
        - ">40,000 combined business and government customers"
        - "2022-01-19"
        - TechTarget citing launch disclosures
        - High
        - Confirms the installed base included public-sector as well as enterprise buyers
        - No evidence of how many were active XDR users versus broader portfolio accounts
      - - Current customer headline
        - ">53,000 customers"
        - Accessed 2026-10-18
        - Trellix about page
        - Medium
        - Suggests reach has at least been maintained or expanded since relaunch
        - No disclosed starting denominator, cohort bridge, or independent corroboration
      - - Telemetry breadth across customer base
        - ">1 billion sensors across enterprise and government customer bases"
        - "2022-01-18"
        - Yahoo Finance syndication of company quote
        - Medium
        - Large telemetry footprint supports XDR and threat-intelligence value claims
        - No mapping from sensors to paying accounts, seats, or retained ARR
      - - Integration breadth inside customer environments
        - ">600 native and open security technologies"
        - "2022-01-18"
        - SDxCentral interview with CEO
        - Medium
        - Supports land-and-expand through heterogeneous environments
        - No disclosure of how many customers actually deploy third-party integrations
      - - Migration signal at renewal
        - 35% of renewals in 2024-2026 resulted in partial or full migration
        - 2024-2026
        - VendorBenchmark benchmark dataset
        - Low
        - Installed-base durability is under competitive pressure
        - Sample size and methodology are not public
    notes: >-
      Table mixes company statements, independent reporting, and one private
      benchmark dataset; low-confidence rows reflect missing methodology or
      denominators rather than arithmetic uncertainty.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU011
      - CU012
      - CU015
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / org
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Trellix Security Operations Center
        - Internal enterprise security operations reference account
        - Uses Trellix EDR, ePO, Helix, and Insights for data protection, endpoint security, and analytics
        - Production
        - Named deployment shows the stack is used in a live operational environment
        - Company-issued proof; no external ROI or budget data
      - - Trellix Security Operations Center (analyst workflow)
        - Internal analyst user workflow
        - Unified investigation flow across integrated telemetry
        - Production
        - Lauren Driscoll said the team can investigate in one place instead of logging into multiple tools
        - Same customer as row 1, so freshness and independence remain limited
      - - Inherited McAfee Enterprise + FireEye installed base
        - Enterprise and government cohort
        - Relaunch path into Trellix XDR and adjacent modules
        - Production inherited base, not a pilot signal
        - TechTarget cited >40,000 combined business and government customers at relaunch
        - Cohort evidence, not a named external customer reference
    notes: >-
      Enumeration is intentionally partial because the assigned evidence set
      provides one current named self-reference and one broad installed-base
      cohort, but no fresh independent roster of external production customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial named-proof list limited to the assigned prefetched sources; it
        captures the visible production references in this pool but is not a
        complete census of Trellix deployments.
    claimRefs:
      - CU001
      - CU006
      - CU007
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Trellix's customer motion starts from inherited McAfee/FireEye accounts,
      expands through renewal-time consolidation, and forks between integrated
      platform adoption and competitive migration risk.
    data:
      items:
        - label: Inherited McAfee/FireEye footprint
          actor: CISO buyer and installed-base account team
          phase: Installed base
          channel: Direct enterprise relationships plus reseller history
          tone: neutral
          touchpoints:
            - >-
              Launch disclosures framed Trellix around an inherited base of more
              than 40,000 customers.
            - >-
              The public mix included business and government customers rather
              than only private-sector accounts.
        - label: Renewal audit
          actor: Procurement, IT asset owner, and security leader
          phase: Renewal preparation
          channel: Contract review
          tone: warning
          touchpoints:
            - >-
              VendorBenchmark says legacy customers often carry five to fifteen
              SKU lines accumulated over years.
            - >-
              Renewal notice and module alignment become decision points before
              Trellix can upsell broader bundles.
        - label: XDR consolidation pitch
          actor: Trellix account team and platform champion
          phase: Expansion motion
          channel: Direct sale with partner influence
          tone: positive
          touchpoints:
            - >-
              Trellix positions consolidation into XDR as the main commercial
              expansion lever.
            - >-
              Platform breadth across endpoint, data, network, email, threat
              intelligence, and SecOps supports bundle expansion.
        - label: Integrated deployment
          actor: Security operations users
          phase: Operational rollout
          channel: Product integration
          tone: positive
          touchpoints:
            - >-
              Company statements in independent coverage say the XDR ecosystem
              can ingest over 600 technologies and draw from more than one
              billion sensors.
            - >-
              The value proposition depends on customers actually deploying the
              correlated data sources, not just buying the bundle.
        - label: Internal proof point
          actor: Trellix SOC leadership and analysts
          phase: Reference deployment
          channel: Customer story
          tone: positive
          touchpoints:
            - >-
              Trellix's own SOC says it runs EDR, ePO, Helix, and Insights in
              production.
            - >-
              The analyst quote emphasizes easier investigation from having
              everything in one place.
        - label: Retain or migrate
          actor: Renewal committee and competitive alternatives
          phase: Durability test
          channel: Competitive renewal
          tone: warning
          touchpoints:
            - >-
              VendorBenchmark says 35% of renewals in 2024-2026 ended in
              partial or full migration.
            - >-
              Public evidence does not disclose NRR, GRR, or concentration, so
              the true stickiness of the installed base remains opaque.
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
callouts:
  - calloutType: insight
    title: Installed-base quality matters more than the customer-count headline
    body: >-
      The evidence supports scale, but it supports inherited scale much better
      than it supports fresh external production wins, so renewal behavior is
      the real customer-quality test.
    claimRefs:
      - CU001
      - CU003
      - CU012
      - CU014
  - calloutType: risk
    title: Expansion depends on consolidation before competitors displace modules
    body: >-
      Trellix appears to rely on simplifying old McAfee-era contract sprawl into
      broader XDR commitments, which means migration risk can rise exactly at
      the moment when expansion should happen.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
