schemaVersion: report-v2
artifact: financials
slug: trellix
runDate: 2026-10-18
company:
  name: Trellix
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence still points to a large enterprise-security software revenue base, but most
    quantitative disclosure in the assigned pool comes from the 2021 McAfee Enterprise/FireEye
    combination and the early-2022 Trellix launch rather than current standalone financial
    reporting. Trellix's current official surfaces show broad product coverage and a large customer
    base, but they do not disclose pricing realization, unit economics, cash, debt, burn, or
    runway, so financial underwriting remains diligence-heavy.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      The cited current product catalog shows Trellix monetizes a broad security-software portfolio
      rather than a single SKU: endpoint, data, network, threat intelligence, email, and security
      operations are all active product families. That supports a portfolio revenue model with room
      for cross-sell, but the same official surface does not expose list prices or contract terms,
      so public evidence stops short of telling an investor whether revenue is mostly recurring
      subscription, term license, appliance-linked software, or services-heavy. Historical public
      scale is substantial: merger-era sources put the combined business above 40,000 customers,
      about 5,000 employees, and nearly $2 billion in revenue, while current official copy still
      markets Trellix as serving over 50,000 business and government customers. The gap is that
      current revenue, growth, and mix are not disclosed in the assigned pool.
    claimRefs: [CI003, CI004, CI005, CI008, CI009, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-sales-efficiency
    title: GTM motion and sales-efficiency visibility
    body: >-
      Public evidence points to a combined direct-plus-channel motion. CRN reported that Adam
      Philpott was tasked with integrating the FireEye and McAfee Enterprise sales teams and quoted
      CEO Bryan Palma saying Trellix would "go big on the channel," while the current company about
      page still emphasizes an extensive partner ecosystem. That suggests Trellix expects broad
      enterprise distribution rather than a low-touch self-serve model, which fits a scaled
      security-platform vendor. What is missing is the efficiency layer that matters for
      underwriting: the assigned pool does not disclose CAC, payback period, win rates, channel
      take rates, quota productivity, or customer concentration, so sales efficiency remains a
      diligence request rather than a public conclusion.
    claimRefs: [CI010]
    tableRefs: [TI003]
  - id: capital-structure-and-scope
    title: Capital structure signals and scope changes
    body: >-
      The public record is clearer on formation capital than on present liquidity. Multiple sources
      say STG paid $4 billion for McAfee Enterprise and $1.2 billion for FireEye Products, which
      establishes a sponsor-backed starting point and confirms that Trellix was assembled through
      large M&A rather than organic bootstrapping. Public coverage also says the Secure Service Edge
      portfolio, including CASB, SWG, and ZTNA, was being separated into another company, with CRN
      reporting that Trellix would remain the larger business at roughly $1.7 billion in annual
      sales. That helps frame revenue scope, but it does not answer whether Trellix today has ample
      cash, manageable leverage, or covenant headroom. None of those present-tense capital
      adequacy metrics are disclosed in this chapter's assigned evidence pool.
    claimRefs: [CI001, CI002, CI006, CI007, CI011]
  - id: financial-verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial picture is good enough to show that Trellix is not a subscale startup: it is a
      large cybersecurity platform with a broad product catalog, a sizeable customer base, and
      multi-billion-dollar historical revenue context. The problem is quality of earnings and
      forward capital adequacy, not simple existence of demand. Adverse analyst commentary matters
      because it focuses on monetization durability: TechTarget quoted Omdia's Eric Parizo arguing
      that the SSE split could make the portfolio harder to modernize competitively, and
      BankInfoSecurity quoted a practitioner who viewed the inherited products as resource-heavy and
      slow for some use cases. Without current ARR, gross margin, retention, burn, cash, or debt
      disclosure, the report cannot underwrite margin path or runway from public evidence alone.
    claimRefs: [CI008, CI009, CI012, CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Endpoint security, "Software platform / XDR endpoint modules", account or deployment, "Active product family on current catalog", "Current offering visible; mix and contract structure undisclosed", "Break out FY2026 ARR, renewal rate, and gross margin for endpoint products."]
      - [Data security, "Data-loss / encryption / database security software", account or workload, "Active product family on current catalog", "Current offering visible; pricing and attach rate undisclosed", "Disclose revenue mix, packaging, and retention by data-security products."]
      - [Network security, "Detection, IPS, and forensics software / appliances", deployment or site, "Active product family on current catalog", "Current offering visible; hardware vs software mix unclear", "Provide revenue split, services content, and margin by network-security line."]
      - [Threat intelligence, "Intelligence subscriptions and attached analytics", seat or subscription, "Active product family on current catalog", "Current offering visible; monetization format undisclosed", "Show stand-alone subscription revenue and cross-sell attachment."]
      - [Email security, "Email / collaboration protection products", account or mailbox base, "Active product family on current catalog", "Current offering visible; price points undisclosed", "Provide realized pricing, churn, and usage-based upsell metrics."]
      - [Security operations, "Helix / ESM / hyperautomation SecOps platform", platform subscription or enterprise contract, "Active product family on current catalog", "Current offering visible; public unit economics unavailable", "Disclose contract size, module attach, and gross-margin profile for SecOps products."]
    notes: Public product catalog confirms active monetizable product families, but not pricing, revenue mix, or contract terms.
    claimRefs: [CI008, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer or signal
      - Price/unit/contract
      - Public list price status
      - Realized pricing visibility
      - Discounts / unknowns
      - Source
    rows:
      - [Endpoint and XDR products, null, "No public list price on cited catalog", "None in assigned pool", "Discounts, term length, and deployment minimums unknown", SI003]
      - [Network and forensics products, null, "No public list price on cited catalog", "None in assigned pool", "Hardware-software bundle economics unknown", SI003]
      - [Email / collaboration security products, null, "No public list price on cited catalog", "None in assigned pool", "Per-user vs enterprise contract mechanics unknown", SI003]
      - [Security operations / Helix platform, null, "No public list price on cited catalog", "None in assigned pool", "Module attach, services content, and realized discounting unknown", SI003]
    notes: Null price fields mean the assigned official product catalog lists products and tours but not public list prices or contract terms.
    claimRefs: [CI008, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [ARR / recurring revenue mix, null, low, "Needed to separate durable recurring software revenue from legacy or non-recurring components.", "Provide FY2025-FY2026 ARR, recurring mix, and renewal cohorts."]
      - [Gross margin, null, low, "Required to judge software quality, services burden, and path to operating leverage.", "Provide gross margin by product family and consolidated gross-profit bridge."]
      - [NRR / GRR / logo churn, null, low, "Retention determines whether installed-base scale converts into durable growth.", "Provide cohort retention, churn, and top-customer concentration."]
      - [CAC / payback / sales efficiency, null, low, "Essential for underwriting GTM efficiency in a direct-plus-channel enterprise motion.", "Provide CAC, payback, quota attainment, pipeline conversion, and channel economics."]
      - ["Cash, debt, burn, runway", null, low, "Present capital adequacy cannot be judged without liquidity and leverage data.", "Provide latest balance sheet, debt stack, covenant package, cash burn, and runway assumptions."]
    notes: Null values mean the assigned public evidence pool does not disclose the metric directly; these are diligence requests, not implied zeros.
    claimRefs: [CI006, CI007, CI010, CI011]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a broad portfolio-to-enterprise-contract revenue path, but not gross-profit or runway quantification.
    data:
      nodes:
        - id: portfolio
          label: Product portfolio
          detail: Endpoint, data, network, threat intelligence, email, and security operations products are all listed on the current Trellix catalog.
        - id: installed-base
          label: Installed base
          detail: Historical public sources cite 40,000+ customers at merger close, while current official copy still claims 50,000+ business and government customers.
        - id: route-to-market
          label: Direct and channel GTM
          detail: Public reporting describes integrated sales teams, a global channel chief, and an extensive partner ecosystem.
        - id: revenue-scale
          label: Revenue scale
          detail: Historical public revenue markers range from nearly $2 billion for the combined company to $1.7 billion in annual sales for post-split Trellix.
        - id: gross-profit
          label: Gross-profit path
          detail: Software-platform breadth implies margin potential, but the assigned pool does not disclose consolidated gross margin.
        - id: blockers
          label: Underwriting blockers
          detail: No public ARR, retention, CAC, cash, debt, burn, or runway figures are disclosed in the assigned pool.
      edges:
        - from: portfolio
          to: installed-base
          label: broad platform supports cross-sell
        - from: installed-base
          to: route-to-market
          label: enterprise/government accounts served via direct + partners
        - from: route-to-market
          to: revenue-scale
          label: customer activity converts into platform sales
        - from: revenue-scale
          to: gross-profit
          label: margin unknown without disclosure
        - from: gross-profit
          to: blockers
          label: diligence still needed for underwriting
    claimRefs: [CI006, CI008, CI009, CI010, CI012, CI015]
