              当前产品目录显示，Trellix 变现的是广泛的安全软件组合，而非单一
              SKU：终端、数据、网络、威胁情报、电子邮件和安全运营都是活跃产品族。这支持一个有交叉销售空间的产品组合收入模式，但同一官方页面没有披露标价或合同条款，因此公开证据无法判断收入主要来自经常性订阅、期限许可、与设备绑定的软件，还是服务占比较高。历史公开规模可观：合并期来源称合并业务拥有超过
