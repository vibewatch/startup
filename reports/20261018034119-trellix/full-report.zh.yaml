      - number: '1.4'
        title: 规模信号、定位与未决尽调
        blocks:
          - type: paragraph
            body: >-
              指定证据池中最有力、且可公开支持的规模数据来自发布期而非当前：超过 40,000 名客户、约 5,000 名员工以及接近 $2B 的收入。这些数据说明 Trellix 起步时已有可观的企业规模，但不能当作当前
              2026 年经营指标来使用。独立评论也明确指出，Trellix 进入的是拥挤的 XDR
              市场，外界怀疑重塑品牌和收窄定位能否让合并后的产品组合实现差异化。剩余最重要的缺口是当前估值、资本结构、董事会构成、总部和更新后的经营 KPI，这些都直接影响投资或收购判断。
