        title: 领导层可见度与治理
        blocks:
          - type: paragraph
            body: >-
              Bryan Palma 是指定证据中最明确的具名运营负责人，也反复被定位为 Trellix 重启、战略和平台叙事的公开代表。来源集还显示 STG
