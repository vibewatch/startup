      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 既有客户转化为平台交叉销售并采用统一 XDR，同时当前估值接近可见第三方区间的低端。
        - 只有当尽调显示公开价格尚未反映这批既有客户，且优先级更高的债权及权利可控时，上行空间才成立。
        - 独立的现代化或采用证据有限。
        - 当前公开证据显示有可能，但尚未得到证明。
      - - 基准
        - Trellix 仍是规模化、产品覆盖广泛的厂商，但关于当前经济状况和准确条款的公开证据仍然稀薄。
        - 更合理的做法是继续持有或跟踪，而不是激进地做投资判断：规模看得见，定价却看不清。
        - 股权结构表不透明，增长质量不确定。
        - 与保留证据最为一致。
      - - 悲观
        - 拥挤的 XDR 竞争和旧产品拖累限制差异化，同时赞助方或融资条款吞噬大部分企业价值。
        - 即使公司在运营上仍有相关性，股权回报也会被压缩。
        - 产品组合复杂，现代化存在风险。
        - 有独立分析师的质疑支持。
      - - 压力或禁止进入
        - 尽调发现留存疲弱，或债务与优先权负担沉重，且没有清晰路径证明统一平台价值。
        - 由于下行控制很差，公开证据不足以支持以任何溢价倍数进入。
        - 当前财务及法律经济信息不透明。
        - 在缺口补齐前立即禁止进入。
    notes: 情景逻辑是定性的，因为保留来源没有披露当前准确估值、收入留存或现金创造指标。
