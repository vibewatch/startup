      - number: '8.2'
        title: 估值背景与公开价格证据
        blocks:
          - type: paragraph
            body: >-
              公开估值记录稀薄且混杂。STG 在创建 Trellix 的交易中以 $4B 收购 McAfee 企业安全业务、以 $1.2B 收购 FireEye
              产品业务，说明该平台由有规模的资产组建，而不是从小型创业公司基础起步。但这些 2021 年交易价值不是今天的 Trellix 股权价值，不能直接作为当前估值。证据池中最好的当前公开融资信号来自 Dealroom
              预览：它显示 2024 年 8 月发生一笔 $400M 融资，并给出 $100–250M 的宽泛公开估值区间，同时隐藏确切数值。这可以作为透明度信号，而非估值锚点。保留的独立来源也只提供定性市场比较：它们确认
              Trellix 在拥挤的 XDR 市场运营，并继承了重要的整合和差异化问题，但没有提供披露倍数的干净可比公司集合。因此，当前公开证据不足以有把握地判断进入价格、稀释风险或回报计算。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV014
