      - - 运营负担
        - CSO 与 BankInfoSecurity 都警告，合并后的资产环境可能需要较长时间过渡，且会显得遗留系统负担较重
        - Trend Micro 对比认为集中式云管理对部分买方更简单
        - 广度可能伴随更高的部署与变更管理成本
      - - 公开定价可见度
