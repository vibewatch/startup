  - id: FE001
    title: 产品架构图
    type: stack
    summary: Trellix 的公开架构更像是围绕 XDR 核心搭建的分层控制、运营和情报体系，而不是单一的整体式应用。
    data:
      layers:
        - label: 端点控制
          summary: >-
            Endpoint tools provide prevention, detection, forensics, and remediation coverage across hybrid
            environments.
          items:
            - Endpoint Security
          modules:
            - 终端检测与响应（EDR）
            - Endpoint Forensics
          outputs:
            - 端点遥测、告警和修复操作
        - label: 网络控制
          summary: >-
            Network products extend the platform into detection, prevention, and forensic capture across hybrid
            environments.
          items:
            - 网络检测与响应
            - Intrusion Prevention System
          modules:
            - Network Forensics
          outputs:
            - 网络遥测和威胁检测
        - label: 电子邮件与协作控制
          summary: Email-security products add messaging-layer detection and protection into the broader XDR posture.
          items:
            - Email Security
            - 面向协作平台的 IVX
          modules:
            - Phishing Simulator
          outputs:
            - 协作告警和钓鱼防御信号
        - label: 数据保护控制
          summary: Data-security products keep DLP, encryption, and database-security functions inside the same portfolio.
          items:
            - Data Loss Prevention
            - Data Encryption
          modules:
            - Database Security
          outputs:
            - 策略事件和数据保护执行
        - label: 检测、关联与响应
          summary: Helix and adjacent SecOps products correlate events and route investigation and response workflows.
          items:
            - 安全运营产品族
          modules:
            - Helix
            - Hyperautomation / Connect
            - 企业安全管理器
          outputs:
            - 排优先级的调查、工作流和响应操作
        - label: 情报、分析与指导
          summary: Research, threat intelligence, and AI/ML enrichment turn the stack into Trellix's claimed XDR experience.
          items:
            - 威胁情报产品族
            - Advanced Research Center
          modules:
            - Insights
            - SecondSight
            - Threat Intelligence Exchange
          outputs:
            - 威胁上下文、评分和 AI 指导的建议
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Trellix 的客户路径始于继承的 McAfee/FireEye 客户，通过续约时整合扩张，最终分化为采用集成平台或迁移至竞争对手两种风险。
    data:
      items:
        - label: 继承的 McAfee/FireEye 客户版图
          actor: CISO 买家与既有客户团队
          phase: 既有客户
          channel: 直连企业关系与经销商历史
          tone: neutral
          touchpoints:
            - 发布披露将 Trellix 定位在超过 40,000 名客户的继承基础上。
            - 公开客户构成包括企业和政府客户，而不只是私营部门客户。
        - label: 续约审计
          actor: 采购、IT 资产负责人和安全负责人
          phase: 续约准备
          channel: 合同审查
          tone: warning
          touchpoints:
            - VendorBenchmark 称，遗留客户往往带着多年累积的 5 到 15 条 SKU 产品线。
            - 在 Trellix 能够向上销售更广泛的捆绑包前，续约通知和模块对齐会成为决策节点。
        - label: XDR 整合方案
          actor: Trellix 客户团队与平台倡导者
          phase: 扩张动作
          channel: 受合作伙伴影响的直销
          tone: positive
          touchpoints:
            - Trellix 将整合到 XDR 定位为商业扩张的主要杠杆。
            - 端点、数据、网络、电子邮件、威胁情报和 SecOps 的平台广度支撑捆绑扩张。
        - label: 集成部署
          actor: 安全运营用户
          phase: 运营落地
          channel: 产品集成
          tone: positive
          touchpoints:
            - 独立报道中的公司说法称，XDR 生态可以摄取超过 600 项技术的数据，并调用超过 10 亿个传感器。
            - 价值主张取决于客户实际部署这些关联数据源，而不只是购买捆绑包。
        - label: 内部验证点
          actor: Trellix SOC 负责人和分析师
          phase: 参考部署
          channel: 客户案例
          tone: positive
          touchpoints:
            - Trellix 自有 SOC 称，其生产环境运行 EDR、ePO、Helix 和 Insights。
            - 分析师引述强调，将一切集中在一个地方可以让调查更容易。
        - label: 留存或迁移
          actor: 续约委员会与竞争性替代方案
          phase: 持久性测试
          channel: 竞争性续约
          tone: warning
          touchpoints:
            - VendorBenchmark 称，2024-2026 年的续约中有 35% 最终部分或全部迁移。
            - 公开证据没有披露 NRR、GRR 或客户集中度，因此既有客户的真实粘性仍不透明。
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，现代化、市场进入信任和未解决的尽调不透明度仍带来较高剩余负担。
    data:
      columns:
        - label: 可能性
          detail: 从公开证据观察到的概率，不是统计预测。
        - label: 影响
          detail: 对竞争力、客户信任或可投资性的潜在下行。
        - label: 剩余暴露
          detail: 在保留来源集中当前可见缓解措施之后的风险。
      rows:
        - label: 产品组合现代化
          note: 能力重叠且 XDR 市场拥挤，使差异化取决于执行。
          values:
            - label: 高
              tone: high
              note: 独立分析师质疑 Trellix 能否清晰差异化并实现合并堆栈现代化。
            - label: 高
              tone: high
              note: 失败会削弱平台背后的核心整合论点。
            - label: 高
              tone: high
              note: 官方已有缓解措施，但证明完成的最新外部证据很少。
        - label: SSE 分拆后的云端范围
          note: 分拆出去的 CASB、SWG 和 ZTNA 资产形成结构性依赖边界。
          values:
            - label: 中
              tone: medium
              note: 分拆是已观察到的事实，但对客户的影响没有完整披露。
            - label: 高
              tone: high
              note: 分析师将这一举措直接与产品组合现代化和竞争姿态联系起来。
            - label: 高
              tone: high
              note: 公开缓解措施侧重战略，而非有记录的工作流结果。
        - label: 渠道与 MSSP 信任
          note: 发布期报道称，Trellix 必须弥补前身在合作伙伴运营上的失误。
          values:
            - label: 中
              tone: medium
              note: 风险源自前身行为，而非假设，因此可信。
            - label: 高
              tone: high
              note: 合作伙伴支持不足会拖慢新客户赢单和平台整合。
            - label: 高
              tone: high
              note: 官方关于合作伙伴规模的说法有帮助，但收入构成和续约证据仍未披露。
        - label: 产品性能与可靠性
          note: 公开批评涉及延迟、噪声告警和端点代理可靠性投诉。
          values:
            - label: 中
              tone: medium
              note: 最强的反向证据较旧或来自第三手来源，因此时效性不佳。
            - label: 高
              tone: high
              note: 性能问题会直接削弱 XDR 操作系统式叙事。
            - label: 高
              tone: high
              note: 保留来源池中没有最新基准或事件趋势足以消除这一问题。
        - label: 隐私与治理反弹
          note: 端点遥测和响应权限可能在敏感环境中引发反弹。
          values:
            - label: 中
              tone: medium
              note: 来源集中有一个具体的高等教育反弹案例。
            - label: 中
              tone: medium
              note: 主要下行来自信任、采购阻力和治理审查。
            - label: 中
              tone: medium
              note: 这里的官方隐私合规细节不足以排除这一担忧。
        - label: 经济与法律披露不透明
          note: 当前公开证据无法排除流失、集中度、杠杆或法律状态问题。
          values:
            - label: 高
              tone: high
              note: 缺口确定存在，因为关键尽调项目不在公开材料中。
            - label: 高
              tone: high
              note: 即使产品规模真实，缺少经济和法律清晰度仍会限制投资判断。
            - label: 高
              tone: high
              note: 在管理层提供一手支持材料前，该风险仍维持高位。
    approximationNotes: 单元格总结保留来源的定性证据强度，不代表模型概率或精算损失估计。
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐遵循一条简单链条：可见规模和产品广度被估值不透明与执行风险抵消，因此“继续研究”是唯一有证据支持的结论。
    data:
      nodes:
        - id: scale
          label: 既有客户规模
          note: 合并完成时有 40,000+ 名客户；当前关于页面称客户数超过 53,000。
        - id: breadth
          label: 广泛安全产品组合
          note: 产品页面仍可看到端点、数据、网络、威胁情报、电子邮件和安全运营覆盖。
        - id: xdr
          label: 平台愿景
          note: Trellix 称，XDR 生态可以摄取超过 600 项原生和开放安全技术。
        - id: opacity
          label: 价格不透明
          note: 公开证据显示有融资活动和宽泛估值区间，但没有准确条款。
        - id: risk
          label: 执行层面质疑
          note: 独立分析师质疑 XDR 差异化、现代化和产品组合清晰度。
        - id: call
          label: 推荐
          note: 以中等信心继续研究，估值立场未知。
      edges:
        - from: scale
          to: breadth
          label: 证明相关性
        - from: breadth
          to: xdr
          label: 支持论点
        - from: xdr
          to: opacity
          label: 仍需价格证明
        - from: opacity
          to: risk
          label: 放大下行
        - from: risk
          to: call
          label: 让决策继续受门槛约束
    approximationNotes: null
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
