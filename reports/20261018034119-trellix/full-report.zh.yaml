              - CV014
      - number: '8.3'
        title: 情景、尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              上行情景取决于 Trellix 能否把安装基础、广泛的遥测覆盖和合作伙伴生态转化为可防守的 XDR 运营模式，改善续约质量，并讲出比当前公开记录更清晰的退出故事。基准情景没那么乐观：Trellix
              凭借企业触达仍保持相关性并可出售，但投资人仍无法从公开证据判断今天的估值是否已经反映这套安装基础、优先权或债务索偿是否使普通股处于次位，或续约和增长质量是否足以支撑软件公司式上行。下行情景很直接：如果市场继续把产品组合视为旧产品偏重，如果
              SSE
              拆分带走了战略重要的云能力，或如果赞助方融资条款带来沉重悬垂，即便业务仍具备运营规模，股权上行空间也可能快速收缩。在任何对价格敏感的上调判断前，尽调必须补齐当前财务表现、确切估值条款，以及客户正在采用统一平台而不只是续订继承产品的证据。
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议
            body: 继续研究是证据支持最强的判断，因为 Trellix 具备可见规模和产品广度，但指定公开来源没有证明当前确切估值、资本表经济性，或统一 XDR 论点正在转化为差异化回报的充分独立证据。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV012
