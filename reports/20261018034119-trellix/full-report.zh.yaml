              - CP009
              - CP011
              - CP013
      - number: '3.3'
        title: 护城河看起来存在，但很大一部分是惯性，而非无争议的优势
        blocks:
          - type: paragraph
            body: >-
              保留证据中 Trellix 最明显的竞争资产是既有地位。官方和报道来源显示，这是一家带着超过 40,000 名客户、数千名员工和多产品覆盖进入市场的企业；Trellix 当前关于页面仍声称拥有超过 53,000
              名客户。许多账户因此可以继续购买、扩展或逐步整合现有技术栈，而不必一次性全面迁移。CSO 引述 Forrester 的 Allie Mellen
              称部分迁移可能需要数年，这支持转换成本有助于留存的判断。同一份遗产也构成脆弱点。Antivirus-review 的路由指南显示，旧的 McAfee Enterprise 名称仍可能根据 SKU 将管理员引向
              Trellix、McAfee 消费产品或 Skyhigh；BankInfoSecurity 引述的一名从业者则称旧产品体系笨重且缓慢。因此，Trellix
              看起来耐久，是因为它嵌入现有体系、覆盖广且具有运营黏性，而不是因为指定证据证明它相对市场拥有决定性产品领先。
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
