companyProfile:
  summary: >-
    Trellix 是一家私有、由 STG 支持的网络安全平台，由 McAfee Enterprise 与 FireEye 的产品业务合并组建。公开证据支持其拥有覆盖面广、以 XDR
    为核心的产品组合、大规模继承而来的企业与政府客户基础，以及直销加渠道分销模式；但公司没有披露当前经审计财务、资本结构细节或完整治理图谱。因此，公司看起来已具备规模且确实在运营，但对投资判断真正关键的经济数据仍披露不足。
  productSummary: 面向企业的网络安全平台，覆盖终端、数据、网络、电子邮件、威胁情报以及安全运营 / XDR。
  customerFocus: 大型企业、政府和受监管组织。
  businessModel: 面向企业的软件与平台订阅，采用直销和渠道合作伙伴销售。
  stage: Private (PE-backed)
  fundingStatus: 通过 STG 以 $4B 收购 McAfee Enterprise、以 $1.2B 收购 FireEye 产品业务组建；当前股权与债务条款未公开。
  disclosureProfile: private-disclosed
