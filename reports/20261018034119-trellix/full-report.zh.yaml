        title: 资本结构信号与范围变化
        blocks:
          - type: paragraph
            body: >-
              公开记录对组建时的资本比对当前流动性更清楚。多个来源称 STG 以 $4B 收购 McAfee Enterprise、以 $1.2B 收购 FireEye Products，这既说明公司起点由赞助方支持，也确认
              Trellix 是通过大型并购而非自然积累组建。公开报道还称包括 CASB、SWG 和 ZTNA 在内的安全服务边缘产品组合正在拆分到另一家公司；CRN 报道 Trellix 将继续作为更大的业务，年销售额约
              $1.7B。这有助于界定收入范围，但无法回答 Trellix 今天是否拥有充足现金、可管理杠杆或契约余量。本章指定证据池没有披露任何当前资本充足性指标。
