      - number: '3.2'
        title: 差异化更多依靠广度与开放性，而非清晰的逐家对标证明
        blocks:
          - type: paragraph
            body: >-
              指定证据更清楚地支持 Trellix 的广度和生态故事，而不是证明其对每个点名竞争者都能取得干净、同口径的基准胜利。当前产品目录覆盖终端、数据、网络、电子邮件、威胁情报和安全运营；SDxCentral 称
              Helix 可接入超过 600 项原生和开放安全技术，CSO 称 Trellix 可对第三方应用使用分析。这给 Trellix
              提供了可信的整合销售论据。但独立的负面评论削弱了这一优势：BankInfoSecurity 引述 IDC 认为其产品组合足以承接 XDR
              的承诺，同时也引述从业者质疑老产品过时、噪声大、运营负担重。即使竞争对手撰写的比较文章也把 Trend Micro Vision One 视为重要替代方案，这再次说明 Trellix
              面对的是成熟市场，而不是在创造新类别。指定证据池没有公开、有来源支持的企业定价数据，因此商业优势仍是尽调问题，而非已证实结论。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
