      - number: '4.2'
        title: GTM 动作与销售效率可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据指向直销加渠道的组合模式。CRN 报道 Adam Philpott 负责整合 FireEye 与 McAfee Enterprise 的销售团队，并引用 CEO Bryan Palma 的话称
              Trellix 将“大力发展渠道”；当前公司关于页面仍强调广泛的合作伙伴生态。由此看，Trellix
              预期采用广泛的企业分销，而不是低接触自助模式，符合规模化安全平台供应商的定位。缺少的是对投资判断重要的效率层：指定证据池没有披露
              CAC、回本周期、赢单率、渠道分成率、配额生产率或客户集中度，因此销售效率仍是尽调要求，而非公开结论。
