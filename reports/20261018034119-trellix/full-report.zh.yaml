    sections:
      - number: '1.1'
        title: 身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              Trellix 目前将自己定位为一家全球网络安全公司，专注于面向企业和政府环境、由情报驱动的网络韧性；其宣传围绕 AI
              辅助的安全运营，以及对云端、本地、隔离网络和运营技术环境的保护展开。指定官方页面展示的当前产品面覆盖广泛，而非聚焦单一解决方案：终端、数据、网络、电子邮件、威胁情报和安全运营产品都仍属于平台叙事。这种广度对后续章节很重要，因为它把
              Trellix 定义为一个建立在合并安装基础和跨域控制栈之上的集成与产品组合执行故事，而不是单一产品初创公司。
