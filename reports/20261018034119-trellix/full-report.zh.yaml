        title: 组建与所有权路径
        blocks:
          - type: paragraph
            body: >-
              即便二手报道对部分交易时间细节的描述有所不同，公开组建叙事总体一致：Symphony Technology Group 收购 FireEye 的产品业务和 McAfee Enterprise，再合并这些资产并以
              Trellix 名义重新推出业务。官方与独立来源都确认合并于 2021 年 10 月完成、Trellix 于 2022 年 1
              月推出。因此，公司的起点是由赞助方打造的业务分拆，而不是自然创立的创业公司。这个出身很关键：后续对债务、资本结构和产品整合的尽调，应当按赞助方整合问题评估，而不是按绿地创业问题评估。
