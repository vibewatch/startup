            title: 广度加既有地位是主要竞争资产
            body: 指定证据中最强的竞争信号不是新颖性，而是 Trellix 能从终端、网络、电子邮件、数据和 SecOps 多个切入口进入交易，同时依靠大规模继承而来的安装基础。
            calloutType: strength
