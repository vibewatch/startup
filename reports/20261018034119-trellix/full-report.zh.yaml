  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 可投资市场是集成式企业防御，而不是整个网络安全市场
        blocks:
          - type: paragraph
            body: >-
              Trellix 的实际市场边界是企业扩展检测与响应（XDR）及其周边的安全运营工作流。当前产品组合覆盖终端、数据、网络、威胁情报、电子邮件和安全运营，而底层 XDR
              价值主张是关联这些控制点的遥测和响应。因此，如果没有一座桥梁剔除消费安全、纯身份工具、物理安全、独立服务和 Trellix 不直接销售的其他类别，广义“网络安全”支出就不适合作为 TAM。前 McAfee
              Enterprise 的安全服务边缘资产已拆分给 Skyhigh Security，因此 CASB、安全 Web 网关和 ZTNA 支出不应仅因产品拥有共同公司血缘就被计入 Trellix
              的收入机会。现状替代方案包括继续保留独立的终端、网络、电子邮件、SIEM
              和响应工具，在内部集成各家最佳控制，或接受分析师工作流碎片化。只有买方足够看重跨控制点遥测、调查、自动化和供应商整合，愿意替换这些替代方案时，Trellix 才能赢得可寻址支出。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
      - number: '2.2'
        title: 安装基础证据支持触达，而非市场规模结论
        blocks:
          - type: paragraph
            body: >-
              保留的证据不包含当前全球 XDR 支出的独立估算、与 Trellix 产品边界匹配的企业安全 SAM，或 Trellix 特有的 SOM，但提供了三个不可直接比较的规模指标。2021 年 10
              月合并时，Trellix 的前身业务声称拥有超过 40,000 名客户和接近 $2B 的收入。CRN 另行报道管理层在 2022 年 1 月将 Trellix 描述为年销售额 $1.7B、员工 4,000 至
              4,500 人的业务。当前公司关于页面则声称拥有超过 53,000
              名客户。这些数据使用了不同日期和分母：收入是公司收入而非市场支出，客户数是安装基础指标而非年度合同价值，而且都没有说明客户基础中有多少购买了集成平台。因此，当前只能采取受证据约束的测算姿态：在获得当前合同、续约、模块附加率和市场支出数据前，全球
              TAM、按产品边界划定的 SAM、可附加的安装基础机会以及可获得的 SOM 都仍未量化。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM015
      - number: '2.3'
        title: CISO 掌控决策，安全运营人员决定实际价值
        blocks:
          - type: paragraph
            body: >-
              最可能的经济买方是 CISO 或企业安全组织，而安全运营分析师则是调查、排序和响应工作流的日常用户。大型企业、政府和受监管组织最匹配，因为它们运营混合 IT
              资产，维护多层控制，并承担告警碎片化和响应迟缓的高昂成本。现有 McAfee Enterprise 和 FireEye 客户构成自然的采用路径：续订已部署的控制、附加相邻模块、接入遥测，然后围绕 XDR
              整合工作流。因此，有证据支持的最强采用驱动因素是运营整合，而不是网络风险的泛泛上升。Trellix 声称可与超过 600
              项原生及开放安全技术互操作，这可能降低替换摩擦，但指定证据池没有披露合同层面的附加率、采购周期、CISO 以下的预算归属或实际 ROI。缺少这些分母，仅凭客户数无法自下而上计算 SAM。
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 集成证明、信任与采购证据决定采用时点
        blocks:
          - type: paragraph
            body: >-
              产品组合广度同时带来机会和执行风险。独立报道将 Trellix
              描述为整合终端、网络和安全运营资产，但也把核心买方问题表述为：继承而来的产品能否成为一个连贯平台，而不是一组老旧工具。因此，集成深度、统一工作流、许可清晰度、迁移影响和支持连续性，决定名义上的安装基础触达能多快转化为平台采用。信任也有商业意义：Wikipedia
              当前文章称 Trellix 披露了 2026 年 5
              月的一次入侵，攻击者访问了部分源代码仓库，但被盗信息在所引述报道中仍未公开。该事件应被视为采用风险信号，而不是已量化的流失或市场份额损失证据。估值时，在尽调获得有边界的市场支出序列、续约与模块附加队列、输赢数据，以及证明整合能带来可量化安全或成本结果的客户证据前，不应给广泛的网络安全增长叙事太多权重。
            claimRefs:
              - CM014
              - CM016
              - CM006
              - CM007
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 不要把安装基础触达转化为 TAM
            body: 超过 53,000 名客户的说法说明了分销触达，但没有当前合同价值、附加率和产品层面的留存数据，就不能证明 SAM、SOM 或收入增长上限。
            calloutType: risk
            claimRefs:
              - CM007
              - CM012
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 市场格局与替代方案路径
        blocks:
          - type: paragraph
            body: >-
              Trellix 以一个不寻常的起点进入市场：它是 McAfee Enterprise 和 FireEye 产品资产的合并体，而前 McAfee Enterprise SSE
              产品组合被拆到另一家公司，而非留在同一平台内。这一结构扩大了真实竞争集合。买方不仅是在 Trellix 与绿地 XDR 厂商之间比较，也在决定是留在现有 McAfee 或 FireEye 体系、针对 SSE
              需求转向 Skyhigh，还是标准化采用另一套成熟安全产品。独立报道将 Trellix 与 Cisco、Microsoft、Check Point、VMware、CrowdStrike 和 Palo Alto
              Networks 放在同一竞争格局中；保留的官方页面则显示 Trellix 覆盖终端、网络、电子邮件、数据、威胁情报和安全运营。因此，Trellix
              可以出现在多种交易中，但也必须同时守住广泛的竞争边界，面对直接的 XDR 套件和现状续约行为。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP008
              - CP011
              - CP013
