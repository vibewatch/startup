        title: Architecture, control plane, and integration model
        blocks:
          - type: paragraph
            body: |-
              The best-supported architecture picture in the assigned evidence is an
              XDR stack built from multiple product layers rather than a single
              newly-built system. Official collateral and trade press point to Helix as
              a foundational cloud-native operations layer, enriched by threat
              intelligence, automation, and research, while the product catalog keeps
              endpoint, network, email, and data controls as distinct product families.
              Trellix also emphasizes open APIs and broad telemetry ingestion, with
              third-party integrations positioned as part of the operating model rather
              than an afterthought. That is a credible enterprise design pattern, but
              the evidence still describes architecture through product families and
              adjacent modules, not through a deeply documented public reference
              architecture with explicit shared services, tenancy boundaries, or control
