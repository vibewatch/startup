              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The cited current product catalog shows Trellix monetizes a broad security-software portfolio rather than
              a single SKU: endpoint, data, network, threat intelligence, email, and security operations are all active
              product families. That supports a portfolio revenue model with room for cross-sell, but the same official
              surface does not expose list prices or contract terms, so public evidence stops short of telling an
              investor whether revenue is mostly recurring subscription, term license, appliance-linked software, or
              services-heavy. Historical public scale is substantial: merger-era sources put the combined business above
              40,000 customers, about 5,000 employees, and nearly $2 billion in revenue, while current official copy
              still markets Trellix as serving over 50,000 business and government customers. The gap is that current
              revenue, growth, and mix are not disclosed in the assigned pool.
