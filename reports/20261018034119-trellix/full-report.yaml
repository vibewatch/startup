      - number: '1.2'
        title: Formation and ownership path
        blocks:
          - type: paragraph
            body: >-
              The public formation narrative is consistent at a high level even when secondary coverage varies on some
              transaction timing details: Symphony Technology Group assembled Trellix by buying FireEye's products
              business and McAfee Enterprise, then combining those assets and relaunching the business under the Trellix
              name. Official and independent sources align on the October 2021 merger completion and the January 2022
              Trellix launch, which makes the company's starting point a sponsor-created carve-out rather than an
              organically founded venture. That origin is strategically important because later diligence on debt,
              capital structure, and product rationalization should be evaluated as sponsor-integration questions, not
              as greenfield startup questions.
