    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Trellix currently presents itself as a global cybersecurity company focused on intelligence-led cyber
              resilience for enterprise and government environments, with messaging centered on AI-assisted security
              operations and protection across cloud, on-premises, air-gapped, and operational-technology settings. The
              current product surface in the assigned official pages is broad rather than point-solution narrow:
              endpoint, data, network, email, threat intelligence, and security-operations products are all still part
              of the platform story. That breadth matters for later chapters because it frames Trellix less as a
              single-product startup and more as an integration and portfolio-execution story built on a merged
              installed base and a cross-domain control stack.
