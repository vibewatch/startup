        title: Scale signals, positioning, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The strongest publicly supportable scale figures in the assigned pool are launch-era rather than current:
              more than 40,000 customers, roughly 5,000 employees, and nearly $2 billion in revenue. Those figures show
              Trellix started from meaningful enterprise scale, but they should not be reused as if they were current
              2026 operating metrics. Independent commentary also makes clear that Trellix entered a crowded XDR market
              and faced skepticism about whether the rebrand and narrowed positioning would differentiate the combined
              portfolio. The most important remaining gaps are current valuation, capital structure, board composition,
              headquarters, and updated operating KPIs, all of which are material to any investment or acquisition
              judgment.
