  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The investable market is integrated enterprise defense, not all cybersecurity
        blocks:
          - type: paragraph
            body: >-
              Trellix's practical market boundary is enterprise extended detection and response (XDR) and the
              security-operations workflows around it. Its current portfolio spans endpoint, data, network, threat
              intelligence, email, and security operations, while the underlying XDR proposition is to correlate
              telemetry and response across those control points. This makes broad "cybersecurity" spending an
              unsuitable TAM without a bridge that removes consumer security, identity-only tools, physical security,
              standalone services, and other categories Trellix does not directly sell. The former McAfee Enterprise
              secure-service-edge assets were separated into Skyhigh Security, so CASB, secure web gateway, and ZTNA
              spend should not be counted as Trellix revenue opportunity merely because those products share a corporate
              lineage. Status-quo substitutes include retaining separate endpoint, network, email, SIEM, and response
              tools, integrating best-of-breed controls internally, or accepting fragmented analyst workflows. Trellix
              therefore wins addressable spend only where a buyer values cross-control telemetry, investigation,
              automation, and vendor consolidation enough to displace those alternatives.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
      - number: '2.2'
        title: Installed-base evidence supports reach, not a market-size conclusion
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not contain a current independent estimate of global XDR spend, an
              enterprise-security SAM aligned to Trellix's product boundary, or a Trellix-specific SOM. It does provide
              three non-comparable scale indicators. At the October 2021 combination, Trellix's predecessor businesses
              claimed more than 40,000 customers and nearly $2 billion in revenue. CRN separately reported management's
              January 2022 description of Trellix as a $1.7 billion annual-sales business with 4,000 to 4,500 employees.
              The current company about page now claims more than 53,000 customers. These figures use different dates
              and denominators: revenue is company revenue rather than market spend, customer count is an installed-base
              measure rather than annual contract value, and neither identifies how much of the base buys the integrated
              platform. The result is an evidence-constrained sizing posture: global TAM, product-boundary SAM,
              attachable installed-base opportunity, and obtainable SOM all remain unquantified until current contract,
              renewal, module-attach, and market-spend data are obtained.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
