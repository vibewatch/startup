  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows a sponsor-driven assembly in 2021, Trellix launch in January 2022, and continuing
      platform-positioning updates in 2026, with some pre-launch timing details remaining thin.
    data:
      items:
        - date: 2021-06
          label: FireEye products deal
          detail: TechTarget reported STG bought FireEye for $1.2 billion following the split from Mandiant.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2021'
          label: McAfee Enterprise acquisition
          detail: >-
            Secondary coverage says a consortium led by STG acquired McAfee Enterprise for $4 billion before the
            combination.
          tone: neutral
          claimRefs:
            - CO005
        - date: 2021-09
          label: Combination announced
          detail: >-
            TechTarget reported STG announced it would combine the FireEye and McAfee product lines into a single entity
            in September 2021.
          tone: neutral
          claimRefs:
            - CO006
        - date: 2021-10
          label: Merger completed
          detail: >-
            SecuritySA and the official completion release both place the McAfee Enterprise and FireEye merger
            completion in October 2021.
          tone: positive
          claimRefs:
            - CO007
        - date: '2022-01-19'
          label: Trellix launch
          detail: >-
            Independent launch coverage shows the Trellix rebrand going live on January 19, 2022 with an XDR-led
            positioning.
          tone: positive
          claimRefs:
            - CO008
        - date: 2022-Q1
