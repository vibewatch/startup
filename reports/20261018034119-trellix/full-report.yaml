            body: >-
              Bryan Palma is the clearest named operating leader in the assigned evidence and is repeatedly positioned
              as the public face of the Trellix relaunch, strategy, and platform narrative. The source set also shows
              sponsor-side involvement from STG and at least one named go-to-market leader, but it does not provide a
