      - number: '3.3'
        title: Durability looks real, but much of it is inertia rather than an uncontested moat
        blocks:
          - type: paragraph
            body: >-
              Trellix's most visible competitive asset in the retained evidence is incumbency. Official and reported
              sources show a business that entered the market with more than 40,000 customers, thousands of employees,
              and multi-product coverage, and Trellix's current about page still claims more than 53,000 customers. That
              means many accounts can keep buying, extending, or gradually rationalizing an existing stack instead of
              replatforming all at once. CSO quotes Forrester's Allie Mellen saying some transitions could take years,
              which supports the idea that switching costs help retention. The same legacy is also a vulnerability.
              Antivirus-review's routing guide shows that old McAfee Enterprise names can still send administrators
              toward Trellix, McAfee consumer, or Skyhigh depending on the SKU, and BankInfoSecurity quotes a
              practitioner who says the older estate can feel clumsy and slow. Trellix therefore looks durable because
              it is embedded, broad, and operationally sticky, not because the assigned evidence proves a decisive
              product lead over the field.
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
