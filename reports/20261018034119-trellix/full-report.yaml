              - CM015
      - number: '2.3'
        title: CISOs control the decision; security operators determine realized value
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is most plausibly the CISO or enterprise security organization, while
              security-operations analysts are the daily users of investigation, prioritization, and response workflows.
              Large enterprises, governments, and regulated organizations are the clearest fit because they operate
              hybrid estates, maintain multiple control layers, and bear high costs from alert fragmentation and slow
              response. Existing McAfee Enterprise and FireEye accounts form a natural adoption path: renew a deployed
              control, attach adjacent modules, connect telemetry, and then consolidate workflows around XDR. The
              strongest evidence-backed adoption driver is therefore operational consolidation rather than a generic
              rise in cyber risk. Trellix claims interoperability with more than 600 native and open security
              technologies, which could reduce rip-and-replace friction, but the assigned pool does not disclose
              contract-level attach rates, procurement cycles, budget ownership below the CISO, or realized ROI. Those
              missing denominators prevent a bottom-up SAM from customer count alone.
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Integration proof, trust, and purchasing evidence govern adoption timing
        blocks:
          - type: paragraph
            body: >-
              Portfolio breadth creates opportunity and execution risk at the same time. Independent coverage describes
              Trellix as combining endpoint, network, and security-operations assets, but also frames the central buyer
              question as whether inherited products become a coherent platform rather than a collection of legacy
              tools. Integration depth, unified workflows, licensing clarity, migration impact, and support continuity
              therefore determine how quickly nominal installed-base reach converts into platform adoption. Trust is
              also commercially relevant: Wikipedia's current article reports that Trellix disclosed a May 2026 breach
              in which attackers accessed part of a source-code repository, while the stolen information remained
              undisclosed in the cited account. That event should be treated as an adoption-risk signal, not evidence of
              quantified churn or market-share loss. For valuation, broad cybersecurity growth narratives should receive
              little weight until diligence obtains a bounded market-spend series, renewal and module-attach cohorts,
              win/loss data, and customer evidence showing that consolidation produces measurable security or cost
              outcomes.
            claimRefs:
              - CM014
              - CM016
              - CM006
              - CM007
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert installed-base reach into TAM
            body: >-
              The 53,000-plus customer claim indicates distribution reach, but without current contract values, attach
              rates, and product-level retention it does not establish SAM, SOM, or a revenue-growth ceiling.
            calloutType: risk
            claimRefs:
              - CM007
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternative solution paths
        blocks:
          - type: paragraph
            body: >-
              Trellix enters the market from an unusual starting point: it is the combined McAfee Enterprise and FireEye
              products estate, while the former McAfee Enterprise SSE portfolio was split into a different company
              rather than kept inside the same platform. That structure broadens the true competitive set. Buyers are
              not only comparing Trellix against greenfield XDR vendors; they are also deciding whether to stay on an
              installed McAfee or FireEye footprint, move sideways into Skyhigh for SSE-centric needs, or standardize on
              another incumbent security suite. Independent coverage places Trellix against Cisco, Microsoft, Check
              Point, VMware, CrowdStrike, and Palo Alto Networks, while the retained official surfaces show Trellix
              spanning endpoint, network, email, data, threat intelligence, and security operations. The result is a
              landscape where Trellix can show up in many deal types, but where the company must also defend a wide
              perimeter against both direct XDR suites and status-quo renewal behavior.
            claimRefs:
