      - number: '4.3'
        title: Capital structure signals and scope changes
        blocks:
          - type: paragraph
            body: >-
              The public record is clearer on formation capital than on present liquidity. Multiple sources say STG paid
              $4 billion for McAfee Enterprise and $1.2 billion for FireEye Products, which establishes a sponsor-backed
              starting point and confirms that Trellix was assembled through large M&A rather than organic
              bootstrapping. Public coverage also says the Secure Service Edge portfolio, including CASB, SWG, and ZTNA,
              was being separated into another company, with CRN reporting that Trellix would remain the larger business
              at roughly $1.7 billion in annual sales. That helps frame revenue scope, but it does not answer whether
              Trellix today has ample cash, manageable leverage, or covenant headroom. None of those present-tense
              capital adequacy metrics are disclosed in this chapter's assigned evidence pool.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is good enough to show that Trellix is not a subscale startup: it is a large
              cybersecurity platform with a broad product catalog, a sizeable customer base, and multi-billion-dollar
              historical revenue context. The problem is quality of earnings and forward capital adequacy, not simple
              existence of demand. Adverse analyst commentary matters because it focuses on monetization durability:
              TechTarget quoted Omdia's Eric Parizo arguing that the SSE split could make the portfolio harder to
              modernize competitively, and BankInfoSecurity quoted a practitioner who viewed the inherited products as
              resource-heavy and slow for some use cases. Without current ARR, gross margin, retention, burn, cash, or
              debt disclosure, the report cannot underwrite margin path or runway from public evidence alone.
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product surface and customer workflow
        blocks:
          - type: paragraph
            body: |-
              Trellix's public product surface is broad and explicitly organized around
              enterprise security workflows rather than a single point tool. The current
              products page groups the offer into endpoint, data, network, threat
              intelligence, email, and security-operations families, while company-issued
              collateral frames the platform as a single open, AI-powered XDR layer that
              is meant to reduce telemetry sprawl, simplify investigations, and improve
              response speed for enterprise and government security teams. That breadth
              is strategically useful because buyers can cover prevention, detection,
              orchestration, and intelligence inside one commercial family, but it also
              means diligence should test how much of the "platform" experience is truly
              unified versus packaged adjacency across legacy products and modules.
            claimRefs:
