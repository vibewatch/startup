  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a broad portfolio-to-enterprise-contract revenue path, but not gross-profit or runway
      quantification.
    data:
      nodes:
        - id: portfolio
          label: Product portfolio
          detail: >-
            Endpoint, data, network, threat intelligence, email, and security operations products are all listed on the
            current Trellix catalog.
        - id: installed-base
          label: Installed base
          detail: >-
            Historical public sources cite 40,000+ customers at merger close, while current official copy still claims
            50,000+ business and government customers.
        - id: route-to-market
          label: Direct and channel GTM
          detail: >-
            Public reporting describes integrated sales teams, a global channel chief, and an extensive partner
            ecosystem.
        - id: revenue-scale
          label: Revenue scale
          detail: >-
            Historical public revenue markers range from nearly $2 billion for the combined company to $1.7 billion in
            annual sales for post-split Trellix.
        - id: gross-profit
          label: Gross-profit path
          detail: >-
            Software-platform breadth implies margin potential, but the assigned pool does not disclose consolidated
            gross margin.
        - id: blockers
          label: Underwriting blockers
          detail: No public ARR, retention, CAC, cash, debt, burn, or runway figures are disclosed in the assigned pool.
      edges:
        - from: portfolio
          to: installed-base
          label: broad platform supports cross-sell
        - from: installed-base
          to: route-to-market
          label: enterprise/government accounts served via direct + partners
        - from: route-to-market
          to: revenue-scale
          label: customer activity converts into platform sales
        - from: revenue-scale
          to: gross-profit
          label: margin unknown without disclosure
        - from: gross-profit
          to: blockers
          label: diligence still needed for underwriting
    claimRefs:
      - CI006
      - CI008
      - CI009
      - CI010
      - CI012
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Trellix's public architecture reads as layered controls, operations, and intelligence around an XDR core rather
      than a single monolithic application.
    data:
      layers:
        - label: Endpoint controls
          summary: >-
            Endpoint tools provide prevention, detection, forensics, and remediation coverage across hybrid
            environments.
          items:
            - Endpoint Security
          modules:
            - Endpoint Detection and Response (EDR)
            - Endpoint Forensics
          outputs:
            - Endpoint telemetry, alerts, and remediation actions
        - label: Network controls
          summary: >-
            Network products extend the platform into detection, prevention, and forensic capture across hybrid
            environments.
          items:
            - Network Detection and Response
            - Intrusion Prevention System
          modules:
            - Network Forensics
          outputs:
            - Network telemetry and threat detections
        - label: Email and collaboration controls
          summary: Email-security products add messaging-layer detection and protection into the broader XDR posture.
          items:
            - Email Security
            - IVX for Collaboration Platforms
          modules:
            - Phishing Simulator
          outputs:
            - Collaboration alerts and phishing-defense signals
        - label: Data protection controls
          summary: Data-security products keep DLP, encryption, and database-security functions inside the same portfolio.
          items:
            - Data Loss Prevention
            - Data Encryption
          modules:
            - Database Security
          outputs:
            - Policy events and data-protection enforcement
        - label: Detection, correlation, and response
          summary: Helix and adjacent SecOps products correlate events and route investigation and response workflows.
          items:
            - Security Operations family
          modules:
            - Helix
            - Hyperautomation / Connect
            - Enterprise Security Manager
          outputs:
            - Prioritized investigations, workflows, and response actions
        - label: Intelligence, analytics, and guidance
          summary: Research, threat intelligence, and AI/ML enrichment turn the stack into Trellix's claimed XDR experience.
          items:
            - Threat Intelligence family
            - Advanced Research Center
          modules:
            - Insights
            - SecondSight
            - Threat Intelligence Exchange
          outputs:
            - Threat context, scoring, and AI-guided recommendations
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Trellix's customer motion starts from inherited McAfee/FireEye accounts, expands through renewal-time
      consolidation, and forks between integrated platform adoption and competitive migration risk.
    data:
      items:
        - label: Inherited McAfee/FireEye footprint
          actor: CISO buyer and installed-base account team
          phase: Installed base
          channel: Direct enterprise relationships plus reseller history
          tone: neutral
          touchpoints:
            - Launch disclosures framed Trellix around an inherited base of more than 40,000 customers.
            - The public mix included business and government customers rather than only private-sector accounts.
        - label: Renewal audit
          actor: Procurement, IT asset owner, and security leader
          phase: Renewal preparation
          channel: Contract review
          tone: warning
          touchpoints:
            - VendorBenchmark says legacy customers often carry five to fifteen SKU lines accumulated over years.
            - Renewal notice and module alignment become decision points before Trellix can upsell broader bundles.
        - label: XDR consolidation pitch
          actor: Trellix account team and platform champion
          phase: Expansion motion
          channel: Direct sale with partner influence
          tone: positive
          touchpoints:
            - Trellix positions consolidation into XDR as the main commercial expansion lever.
            - >-
              Platform breadth across endpoint, data, network, email, threat intelligence, and SecOps supports bundle
              expansion.
        - label: Integrated deployment
          actor: Security operations users
          phase: Operational rollout
          channel: Product integration
          tone: positive
          touchpoints:
            - >-
              Company statements in independent coverage say the XDR ecosystem can ingest over 600 technologies and draw
              from more than one billion sensors.
            - >-
              The value proposition depends on customers actually deploying the correlated data sources, not just buying
              the bundle.
        - label: Internal proof point
          actor: Trellix SOC leadership and analysts
          phase: Reference deployment
          channel: Customer story
          tone: positive
          touchpoints:
            - Trellix's own SOC says it runs EDR, ePO, Helix, and Insights in production.
            - The analyst quote emphasizes easier investigation from having everything in one place.
        - label: Retain or migrate
          actor: Renewal committee and competitive alternatives
          phase: Durability test
          channel: Competitive renewal
          tone: warning
          touchpoints:
            - VendorBenchmark says 35% of renewals in 2024-2026 ended in partial or full migration.
            - >-
              Public evidence does not disclose NRR, GRR, or concentration, so the true stickiness of the installed base
              remains opaque.
    claimRefs:
      - CU001
      - CU004
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence points to a high residual burden around modernization, route-to-market trust, and unresolved
      diligence opacity.
    data:
      columns:
        - label: Likelihood
          detail: Observed probability from public evidence, not a statistical forecast.
        - label: Impact
          detail: Potential downside to competitiveness, customer trust, or investability.
        - label: Residual exposure
          detail: Risk after currently visible mitigations in the retained source set.
      rows:
        - label: Portfolio modernization
          note: Overlapping capabilities and a crowded XDR market make differentiation execution-sensitive.
          values:
            - label: High
              tone: high
              note: >-
                Independent analysts questioned whether Trellix can clearly differentiate and modernize the combined
                stack.
            - label: High
              tone: high
              note: Failure would weaken the core consolidation thesis behind the platform.
            - label: High
              tone: high
              note: Official mitigation exists, but fresh external proof of completion is thin.
        - label: Cloud scope after SSE split
          note: The separated CASB, SWG, and ZTNA assets create a structural dependency boundary.
          values:
            - label: Medium
              tone: medium
              note: The split is an observed fact, but the customer effect is not fully disclosed.
            - label: High
              tone: high
              note: Analysts tied the move directly to portfolio modernization and competitive posture.
            - label: High
              tone: high
              note: Public mitigations focus on strategy rather than documented workflow outcomes.
        - label: Channel and MSSP trust
          note: Launch-era coverage said Trellix must overcome predecessor partner missteps.
          values:
            - label: Medium
              tone: medium
              note: Risk is credible because it is rooted in predecessor behavior rather than a hypothetical.
            - label: High
              tone: high
              note: Weak partner advocacy can slow both new logo wins and platform consolidation.
            - label: High
              tone: high
              note: Official partner scale claims are helpful, but revenue mix and renewal evidence remain undisclosed.
        - label: Product performance and reliability
          note: Public criticism spans latency, noisy alerts, and endpoint-agent reliability complaints.
          values:
            - label: Medium
              tone: medium
              note: The strongest adverse evidence is older or tertiary, so recency is imperfect.
            - label: High
              tone: high
              note: Performance issues would directly weaken the XDR operating-system narrative.
            - label: High
              tone: high
              note: No fresh benchmark or incident trend in the retained pool clears the issue.
        - label: Privacy and governance backlash
          note: Endpoint telemetry and response powers can provoke pushback in sensitive environments.
          values:
            - label: Medium
              tone: medium
              note: The source set contains one concrete higher-education backlash example.
            - label: Medium
              tone: medium
              note: The main downside is trust, procurement friction, and governance scrutiny.
            - label: Medium
              tone: medium
              note: Official privacy-compliance detail is not strong enough here to dismiss the concern.
        - label: Economic and legal disclosure opacity
          note: Current public evidence does not clear churn, concentration, leverage, or legal status.
          values:
            - label: High
              tone: high
              note: The gap is certain because the key diligence items are absent from the public pack.
            - label: High
              tone: high
              note: Missing economics and legal clarity limit underwritability even if product scale is real.
            - label: High
              tone: high
              note: This remains high until management provides primary supporting material.
    approximationNotes: >-
      Cells summarize qualitative evidence strength from retained sources; they do not represent modeled probabilities
      or actuarial loss estimates.
    claimRefs:
      - CR003
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a simple chain: visible scale and product breadth are offset by valuation opacity and
      execution risk, leaving research-more as the only evidence-supported call.
    data:
      nodes:
        - id: scale
          label: Installed-base scale
          note: 40,000+ customers at combination close; 53,000+ customers on the current about page.
        - id: breadth
          label: Broad security portfolio
          note: >-
            Endpoint, data, network, threat intelligence, email, and security-operations coverage remains visible on the
            products page.
        - id: xdr
          label: Platform aspiration
          note: Trellix says the XDR ecosystem can ingest more than 600 native and open security technologies.
        - id: opacity
          label: Price opacity
          note: Public evidence shows financing activity and only a broad valuation band, not exact terms.
        - id: risk
          label: Execution skepticism
          note: Independent analysts question XDR differentiation, modernization, and portfolio clarity.
        - id: call
          label: Recommendation
          note: Research-more with medium confidence and unknown valuation stance.
      edges:
        - from: scale
          to: breadth
          label: proves relevance
        - from: breadth
          to: xdr
          label: supports thesis
        - from: xdr
          to: opacity
          label: still needs pricing proof
        - from: opacity
          to: risk
          label: amplifies downside
        - from: risk
          to: call
          label: keeps decision gated
    approximationNotes: null
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
