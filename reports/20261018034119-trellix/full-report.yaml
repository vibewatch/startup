              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth plus incumbency is the main competitive asset
            body: >-
              The strongest competitive signal in the assigned evidence is not novelty; it is Trellix's ability to enter
              a deal from multiple footholds across endpoint, network, email, data, and SecOps while leaning on a large
              inherited installed base.
            calloutType: strength
            claimRefs:
