      - number: '7.3'
        title: Partner, ownership, and route-to-market dependencies
        blocks:
          - type: paragraph
            body: >-
              Trellix's go-to-market still appears dependent on trust across partners, integrators, and large installed
              accounts. Official materials say the company now supports more than 53,000 customers and an extensive
              partner ecosystem, but MSSP Alert explicitly said the combined business must overcome previous channel and
              MSSP missteps from both predecessor companies. The sponsor structure adds another layer: STG created
              Trellix by combining McAfee Enterprise and FireEye, then split the SSE assets into a separate portfolio
              company. That may improve focus, but it also means product-boundary decisions can be driven by portfolio
              architecture as well as customer workflow logic. Public materials do not quantify how much revenue,
              renewal durability, or customer stickiness depends on partners, cloud-security adjacencies, or a subset of
              very large accounts, so diligence should treat dependency risk as unresolved rather than solved by scale
              headlines.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR009
              - CR010
              - CR014
              - CR015
