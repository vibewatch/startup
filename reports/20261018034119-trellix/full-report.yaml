      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Installed-base quality matters more than the customer-count headline
            body: >-
              The evidence supports scale, but it supports inherited scale much better than it supports fresh external
              production wins, so renewal behavior is the real customer-quality test.
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU012
              - CU014
          - type: callout
            title: Expansion depends on consolidation before competitors displace modules
            body: >-
              Trellix appears to rely on simplifying old McAfee-era contract sprawl into broader XDR commitments, which
              means migration risk can rise exactly at the moment when expansion should happen.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The public record points first to a modernization risk rather than a demand risk. Trellix still presents a
              broad platform across endpoint, data, network, email, threat intelligence, and security operations, but
              independent coverage of the launch argued that differentiating in a crowded XDR market would be difficult
              and that separating the SSE portfolio could weaken Trellix's cloud-specific posture. That matters because
              the platform thesis depends on customers accepting a consolidated architecture rather than a bundle of
              adjacent legacy tools. The public mitigation case is mainly strategic language around an open AI-powered
              platform, broad integrations, and an extensive partner ecosystem; this is directionally helpful, but it is
              weaker than fresh external proof of renewal strength, consolidation success, or competitive win rates.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR007
              - CR014
