companyProfile:
  summary: >-
    Trellix is a private, STG-backed cybersecurity platform assembled from the McAfee Enterprise and FireEye product
    businesses. The public evidence supports a broad XDR-oriented portfolio, a large inherited enterprise and government
    customer base, and direct plus channel distribution, but it does not disclose current audited financials, capital
    structure detail, or a complete governance map. That leaves the company looking scaled and operationally real, but
    still under-disclosed on the economics that matter for underwriting.
  productSummary: >-
    Enterprise cybersecurity platform spanning endpoint, data, network, email, threat intelligence, and security
    operations / XDR.
  customerFocus: Large enterprises, governments, and regulated organizations.
  businessModel: Enterprise software and platform subscriptions sold direct and through channel partners.
  stage: Private (PE-backed)
  fundingStatus: >-
    Formed through STG's $4B McAfee Enterprise acquisition and $1.2B FireEye products acquisition; current equity and
    debt terms are not public.
  disclosureProfile: private-disclosed
