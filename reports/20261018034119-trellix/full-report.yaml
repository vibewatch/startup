      - number: '6.3'
        title: Durability depends on renewals, consolidation, and competitive defense
        blocks:
          - type: paragraph
            body: >-
              The chapter's key customer risk is not whether Trellix ever had an installed base; it is whether that base
              renews and expands fast enough to offset migration pressure. VendorBenchmark portrays many accounts as
              legacy McAfee estates with five to fifteen SKU lines, which makes renewal-time consolidation into a
              broader XDR commitment the main expansion lever. The same source also describes one- to three-year
              subscriptions, a recommended 120-day renewal notice, and a 2024-2026 pattern in which 35% of renewals
              resulted in partial or full migration. TechTarget's analyst quotes add a second caution signal by
              describing the XDR market as crowded and questioning differentiation. Trellix therefore appears to have a
              real base to mine, but public evidence still does not disclose NRR, GRR, logo churn, or top-customer
              concentration, so durability remains inferred rather than cleanly measured.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
