      - number: '6.2'
        title: Adoption proof is strongest for internal production use and platform breadth
        blocks:
          - type: paragraph
            body: >-
              Public proof of active use is credible but uneven. Trellix's own SOC case study provides the clearest
              named production deployment in this pool: the company says its internal team runs Trellix EDR, ePO, Helix,
              and Insights together, and the named analyst quote describes a single-pane investigation workflow rather
              than a generic marketing logo. That does not replace independent external references, but it does show the
              stack is deployed in a live operational environment. The broader platform pages and launch coverage
              reinforce why Trellix can attempt land-and-expand motions: the product family spans endpoint, data,
              network, email, threat intelligence, and security operations, while company statements in independent
              coverage say the XDR ecosystem can ingest more than 600 native and open technologies and pull from more
              than one billion sensors across enterprise and government customer bases.
            claimRefs:
              - CU004
              - CU006
