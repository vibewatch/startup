      - number: '4.2'
        title: GTM motion and sales-efficiency visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a combined direct-plus-channel motion. CRN reported that Adam Philpott was
              tasked with integrating the FireEye and McAfee Enterprise sales teams and quoted CEO Bryan Palma saying
              Trellix would "go big on the channel," while the current company about page still emphasizes an extensive
              partner ecosystem. That suggests Trellix expects broad enterprise distribution rather than a low-touch
              self-serve model, which fits a scaled security-platform vendor. What is missing is the efficiency layer
              that matters for underwriting: the assigned pool does not disclose CAC, payback period, win rates, channel
              take rates, quota productivity, or customer concentration, so sales efficiency remains a diligence request
              rather than a public conclusion.
