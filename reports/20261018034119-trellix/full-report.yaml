  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Installed base breadth is real, but much of it is inherited
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a genuine enterprise-scale customer base, but it supports it more strongly
              as inherited scale than as freshly disclosed net-new adoption. At combination close in October 2021,
              McAfee Enterprise and FireEye said the merged business had more than 40,000 customers, and TechTarget
              repeated that the relaunched Trellix served more than 40,000 combined business and government customers in
              January 2022. Trellix's current about page raises the headline to over 53,000 customers and ties that
              reach to an extensive partner ecosystem, which suggests the company is still leaning on both direct
              enterprise relationships and partner-mediated distribution. What is missing is a current segmentation
              breakout by geography, public-sector share, revenue band, or how much of the installed base reflects
              inherited McAfee/FireEye contracts versus net new Trellix-era wins.
            claimRefs:
