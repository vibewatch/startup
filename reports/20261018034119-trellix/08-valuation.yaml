      whyItMatters: Price-sensitive recommendation and downside protection cannot be underwritten without knowing where enterprise value sits in the capital stack.
      diligencePath: Request the latest financing deck, debt agreements, and cap-table waterfall from management or the sponsor.
      relatedQuestionRefs: [QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: current-financial-quality
      missingEvidence: Audited FY2025 and year-to-date 2026 revenue, EBITDA, free cash flow, gross margin, retention, and churn data.
      whyItMatters: Scale alone does not show whether Trellix deserves software-like valuation support or whether renewal quality is deteriorating.
      diligencePath: Obtain current audited financials and cohort retention bridges before moving beyond research-more.
      relatedQuestionRefs: [QV001, QV008]
