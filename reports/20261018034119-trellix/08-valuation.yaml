      - [Upgrade trigger, "track or selective buy", medium, high, "fair or attractive", "Requires verified retention and margin evidence plus exact valuation and preference terms that leave room for upside."]
      - [Downgrade trigger, avoid, medium, critical, expensive, "If diligence shows weak renewal quality or heavy senior claims on value, installed-base scale is not enough to protect returns."]
    notes: >-
      Qualitative decision table only; retained sources do not disclose a current exact
      valuation, debt stack, or liquidation-preference structure.
    claimRefs: [CV007, CV012, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - ["Thesis: Trellix has real scale", "Official and independent sources describe a 40,000-plus customer base at launch and 53,000-plus customers on the current about page.", "Verified renewal quality and current financials would make that installed base more investable."]
      - ["Thesis: Broad portfolio can support cross-sell and platform stickiness", "The current products page still spans endpoint data network email threat intelligence and security operations.", "Evidence of unified-platform adoption rather than legacy point-product renewals would strengthen the valuation case."]
      - ["Anti-thesis: XDR differentiation may be hard to prove", "TechTarget quotes ESG and Omdia analysts describing the market as crowded and warning differentiation or portfolio modernization may be difficult.", "Independent proof of win rates platform consolidation and durable growth would reduce this concern."]
      - ["Anti-thesis: Public price evidence is too thin", "Dealroom shows financing activity and only a broad valuation band while exact values and terms remain hidden.", "Exact round terms debt covenants and preference rights are needed before return math can be trusted."]
    notes: >-
      Rows mix official scale signals with independent skepticism because the key
      underwriting question is whether breadth converts into durable differentiated
      economics.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV009, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Installed base converts into platform cross-sell and unified XDR adoption while current valuation sits near the low end of visible third-party ranges.", "Upside exists only if diligence shows the public price is not already paying for that installed base and if senior claims are manageable.", "Limited independent proof of modernization or adoption.", "Possible but unproven from current public evidence."]
      - [Base, "Trellix remains a scaled vendor with broad product coverage but public evidence stays thin on current economics and exact terms.", "Reasonable outcome is hold-or-track discipline rather than aggressive underwriting because scale is visible but pricing is not.", "Opaque cap table and uncertain growth quality.", "Most consistent with retained evidence."]
      - [Bear, "Crowded XDR competition and legacy-product drag limit differentiation while sponsor or financing terms absorb much of the enterprise value.", "Equity return compresses even if the company remains operationally relevant.", "Portfolio complexity and modernization risk.", "Supported by independent analyst skepticism."]
      - ["Stress or no-go", "Diligence uncovers weak retention or heavy debt and preference overhang with no clean path to unified platform proof.", "Public evidence would not justify entry at any premium multiple because downside control is poor.", "Missing current financial and legal-economic transparency.", "Immediate no-go until gaps close."]
    notes: >-
      Scenario logic is qualitative because retained sources do not disclose exact
      current valuation, revenue retention, or cash-generation metrics.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV009, CV010, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a simple chain: visible scale and product breadth are
      offset by valuation opacity and execution risk, leaving research-more as the only
      evidence-supported call.
    data:
      nodes:
        - id: scale
          label: Installed-base scale
          note: 40,000+ customers at combination close; 53,000+ customers on the current about page.
        - id: breadth
          label: Broad security portfolio
          note: Endpoint, data, network, threat intelligence, email, and security-operations coverage remains visible on the products page.
        - id: xdr
          label: Platform aspiration
          note: Trellix says the XDR ecosystem can ingest more than 600 native and open security technologies.
        - id: opacity
          label: Price opacity
          note: Public evidence shows financing activity and only a broad valuation band, not exact terms.
        - id: risk
          label: Execution skepticism
          note: Independent analysts question XDR differentiation, modernization, and portfolio clarity.
        - id: call
          label: Recommendation
          note: Research-more with medium confidence and unknown valuation stance.
      edges:
        - from: scale
          to: breadth
          label: proves relevance
        - from: breadth
          to: xdr
          label: supports thesis
        - from: xdr
          to: opacity
          label: still needs pricing proof
        - from: opacity
          to: risk
          label: amplifies downside
        - from: risk
          to: call
          label: keeps decision gated
    approximationNotes: null
    claimRefs: [CV002, CV003, CV004, CV005, CV007, CV008, CV009, CV012]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Research-more is the strongest evidence-supported call because Trellix has visible
      scale and product breadth, but the assigned public sources do not establish a
      current exact valuation, cap-table economics, or enough independent proof that the
      unified XDR thesis is translating into differentiated returns.
    claimRefs: [CV003, CV004, CV007, CV008, CV009, CV012]
