companyProfile:
  summary: >-
    Trellix is a private, STG-backed cybersecurity platform assembled from the McAfee Enterprise and FireEye product
    businesses. The public evidence supports a broad XDR-oriented portfolio, a large inherited enterprise and government
    customer base, and direct plus channel distribution, but it does not disclose current audited financials, capital
    structure detail, or a complete governance map. That leaves the company looking scaled and operationally real, but
    still under-disclosed on the economics that matter for underwriting.
