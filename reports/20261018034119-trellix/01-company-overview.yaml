company:
  name: "Trellix"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Trellix is a private, Symphony Technology Group-backed cybersecurity platform formed from the McAfee Enterprise and FireEye product combination and still positioned around XDR, AI-driven operations, and broad control-point coverage. The assigned public evidence supports launch-era scale and transaction history, but not current valuation, board composition, headquarters, or current audited operating metrics, which keeps core ownership and performance diligence open."
sections:
  - id: "identity-and-scope"
    title: "Identity and product scope"
    body: |-
      Trellix currently presents itself as a global cybersecurity company focused on intelligence-led cyber resilience for enterprise and government environments, with messaging centered on AI-assisted security operations and protection across cloud, on-premises, air-gapped, and operational-technology settings. The current product surface in the assigned official pages is broad rather than point-solution narrow: endpoint, data, network, email, threat intelligence, and security-operations products are all still part of the platform story. That breadth matters for later chapters because it frames Trellix less as a single-product startup and more as an integration and portfolio-execution story built on a merged installed base and a cross-domain control stack.
    claimRefs: ["CO001", "CO002", "CO003", "CO012"]
    tableRefs: ["TO001"]
  - id: "formation-and-ownership"
    title: "Formation and ownership path"
    body: |-
      The public formation narrative is consistent at a high level even when secondary coverage varies on some transaction timing details: Symphony Technology Group assembled Trellix by buying FireEye's products business and McAfee Enterprise, then combining those assets and relaunching the business under the Trellix name. Official and independent sources align on the October 2021 merger completion and the January 2022 Trellix launch, which makes the company's starting point a sponsor-created carve-out rather than an organically founded venture. That origin is strategically important because later diligence on debt, capital structure, and product rationalization should be evaluated as sponsor-integration questions, not as greenfield startup questions.
    claimRefs: ["CO004", "CO005", "CO006", "CO007", "CO008", "CO013", "CO016"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
  - id: "leadership-and-governance"
    title: "Leadership visibility and governance"
    body: |-
      Bryan Palma is the clearest named operating leader in the assigned evidence and is repeatedly positioned as the public face of the Trellix relaunch, strategy, and platform narrative. The source set also shows sponsor-side involvement from STG and at least one named go-to-market leader, but it does not provide a full current board list, legal-entity overview, or governance map. In practical terms, the visible public record is strong enough to establish who led the launch and who owned the combination, but too thin to conclude how decision rights are currently distributed across management, sponsor representatives, and any independent directors.
    claimRefs: ["CO013", "CO014"]
    tableRefs: ["TO002"]
  - id: "scale-positioning-and-open-gaps"
    title: "Scale signals, positioning, and unresolved diligence"
    body: |-
      The strongest publicly supportable scale figures in the assigned pool are launch-era rather than current: more than 40,000 customers, roughly 5,000 employees, and nearly $2 billion in revenue. Those figures show Trellix started from meaningful enterprise scale, but they should not be reused as if they were current 2026 operating metrics. Independent commentary also makes clear that Trellix entered a crowded XDR market and faced skepticism about whether the rebrand and narrowed positioning would differentiate the combined portfolio. The most important remaining gaps are current valuation, capital structure, board composition, headquarters, and updated operating KPIs, all of which are material to any investment or acquisition judgment.
    claimRefs: ["CO009", "CO010", "CO011", "CO015"]
