        - date: "2021-10"
          label: "Merger completed"
          detail: "SecuritySA and the official completion release both place the McAfee Enterprise and FireEye merger completion in October 2021."
          tone: "positive"
          claimRefs: ["CO007"]
        - date: "2022-01-19"
          label: "Trellix launch"
          detail: "Independent launch coverage shows the Trellix rebrand going live on January 19, 2022 with an XDR-led positioning."
          tone: "positive"
          claimRefs: ["CO008"]
        - date: "2022-Q1"
          label: "Planned SSE carve-out"
          detail: "Launch-period coverage said STG planned to separate the SSE, CASB, SWG, and ZTNA portfolio into another business."
          tone: "warning"
          claimRefs: ["CO016"]
        - date: "2026-10"
          label: "Current public positioning"
          detail: "The current homepage and product pages emphasize Agentic SOC, Trellix Wise, and a broad AI-powered security platform rather than a narrow single-product pitch."
          tone: "neutral"
          claimRefs: ["CO002", "CO003"]
    approximationNotes: "Timeline uses the most specific date or period available in the assigned source set; sparse public chronology before launch remains an evidence gap."
    claimRefs: ["CO002", "CO003", "CO004", "CO005", "CO006", "CO007", "CO008", "CO016"]
