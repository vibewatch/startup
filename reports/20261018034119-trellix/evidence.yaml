    whyItMatters: >-
      Integration debt and migration burden are the central technical underwriting risk in a post-merger security
      portfolio.
    diligencePath: >-
      Obtain current product roadmap decks, migration guides, and customer success materials covering Helix, ESM, ePO,
      and adjacent control surfaces.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
