    whyItMatters: >-
      Without quantitative execution evidence, it is difficult to distinguish broad feature coverage from durable
      operational quality.
    diligencePath: >-
      Request customer references with deployment metrics, service-level commitments, and third-party benchmark or
      evaluation results.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: external-customer-proof
    missingEvidence: >-
      Current independent named customer case studies, procurement awards, or conference talks showing external
      production deployments, deployment scale, and measured outcomes.
    whyItMatters: >-
      The assigned pool proves internal dogfooding and inherited scale, but it does not prove how many current external
      accounts are in full production or expanding successfully.
    diligencePath: >-
      Request three current reference customers or public procurement records with go-live date, deployment scope,
      renewal status, and quantified operational outcomes.
