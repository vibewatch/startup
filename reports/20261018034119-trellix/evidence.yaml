evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-operating-metrics
    missingEvidence: Current 2025-2026 revenue, ARR, customer count, headcount, and cohort retention metrics.
    whyItMatters: >-
      The best public scale evidence is launch-era, so later valuation and execution judgments could materially misstate
      current trajectory.
    diligencePath: >-
      Request the latest board deck or management KPI pack with revenue, ARR, customers, headcount, churn, and cohort
      bridge by legacy product family.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: governance-and-corporate-identity
    missingEvidence: Current headquarters, legal-entity map, and full board composition.
    whyItMatters: >-
      Governance visibility is incomplete, which limits diligence on oversight quality, sponsor control, and
      jurisdiction-specific operating exposure.
    diligencePath: >-
      Obtain a corporate fact sheet, secretary certificate, or board/governance materials that identify headquarters,
      entities, and director roster.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-and-capital-structure
    missingEvidence: >-
      Current valuation, debt balances, covenants, sponsor ownership percentages, and any post-formation financing
      events.
    whyItMatters: >-
      Sponsor-created platform stories can look attractive on product breadth while hiding leverage, mark-down risk, or
      constrained strategic options.
    diligencePath: >-
      Request cap table, debt agreements, latest lender or sponsor materials, and any internal valuation or secondary
      transaction references.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent XDR and security-operations spend series aligned to Trellix's included and excluded product
      categories.
    whyItMatters: >-
      Without a bounded spend denominator, the chapter cannot state a defensible TAM, SAM, SOM, CAGR, or market-share
      estimate.
    diligencePath: >-
      Obtain current Gartner, IDC, or equivalent category datasets and reconcile their definitions line by line to
      Trellix's product taxonomy.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement-gap
    missingEvidence: >-
      Customer-level contract values, renewal cohorts, module attach rates, sales-cycle duration, procurement authority,
      and realized ROI.
    whyItMatters: >-
      These data determine how much of the installed base is economically reachable and how quickly platform
      consolidation can convert into revenue.
    diligencePath: >-
      Review anonymized contract and cohort exports, interview reference customers and channel partners, and reconcile
      results to product-level bookings.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: company-scale
    missingEvidence: >-
      A dated, audited bridge among the 2021 nearly $2 billion revenue claim, the 2022 $1.7 billion annual-sales report,
      and current revenue or ARR.
    whyItMatters: >-
      The historical figures use different labels and periods and cannot support a growth rate or current market-share
      calculation.
    diligencePath: >-
      Obtain audited annual financials and management definitions for revenue, annual sales, ARR, and divested-product
      effects.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: >-
      Current public enterprise list pricing, packaging tiers, contract minimums, and discount norms for Trellix and
      named peers.
    whyItMatters: >-
      Pricing pressure and commoditization risk are central to competitor analysis, but the assigned evidence cannot
      support a like-for-like commercial comparison.
    diligencePath: >-
      Collect current procurement screenshots, public quote pages, or sales-issued pricing sheets for Trellix and direct
      peers, then rebuild the pricing matrix from primary surfaces.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: peer-benchmarking
    missingEvidence: >-
      Independent side-by-side benchmarks on efficacy, operating burden, migration effort, and module parity for Trellix
      versus the named XDR incumbents.
    whyItMatters: >-
      The chapter can support category-level positioning, but not a defensible claim that Trellix is better or worse
      than each named rival on a like-for-like basis.
    diligencePath: >-
      Gather official competitor docs plus independent lab tests, analyst scorecards, or customer case studies that use
      comparable scopes and timeframes.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-renewal
    missingEvidence: Current win-loss, migration-completion, churn, and expansion data by product family or account segment.
    whyItMatters: >-
      The retained evidence suggests stickiness, but it cannot distinguish durable product moat from simple renewal
      inertia.
    diligencePath: >-
      Request cohort-level renewal and displacement data, major-account references, and partner-driven pipeline or
      attach-rate evidence from management.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: revenue-scale
    missingEvidence: >-
      Current FY2025-FY2026 revenue, growth, ARR mix, and gross-margin disclosure for standalone Trellix after the SSE
      separation.
    whyItMatters: Historical merger-era scale does not establish present earnings quality or the current margin trajectory.
    diligencePath: Obtain the latest management financial package, audited statements, and product-line revenue bridge.
    relatedQuestionRefs:
      - QI002
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, debt stack, covenant package, burn rate, and runway assumptions.
    whyItMatters: Capital adequacy and refinancing risk cannot be underwritten from sponsor-transaction history alone.
    diligencePath: Request the latest balance sheet, debt schedule, lender documents, and monthly cash-flow forecast.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gtm
    missingEvidence: CAC, payback, sales productivity, channel take rates, and customer concentration metrics.
    whyItMatters: >-
      A scaled direct-plus-channel motion can be value-accretive or margin-dilutive depending on efficiency and
      concentration.
    diligencePath: Review board GTM dashboards, cohort retention data, and channel program economics.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Public or customer-verified pricing, contract duration, discounting, and minimum-commitment detail by product
      family.
    whyItMatters: Without pricing realization data, public product breadth does not translate cleanly into revenue quality.
