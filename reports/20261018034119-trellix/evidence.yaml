    whyItMatters: >-
      Renewal durability determines whether the inherited customer base is sticky enough to offset module migration and
      competitive displacement.
    diligencePath: >-
      Obtain retention and renewal cohorts from management or lender materials, then reconcile them to ARR or revenue by
      product family.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration, reseller concentration, and public-sector mix by revenue or ARR.
