company:
  name: Icertis
chapter:
  number: 4
  title: Financials
  summary: Public financial evidence on Icertis is enough to establish real scale but not a full private-company underwrite. The strongest supported facts are that the company crossed $250 million ARR in early 2024, reported more than $300 million ARR and positive free cash flow in 2024, raised $50 million in 2025 partly to pay down debt, and still carried a public valuation anchor around $5 billion. What remains missing are audited revenue, gross margin, retention, cash, and concentration disclosures.
sections:
- id: section-1
  title: Revenue model and public traction signals
  body: 'The public evidence supports a scaled recurring software business even though it does not support an IPO-grade financial model. Icertis said it crossed $250 million ARR in early 2024, and GeekWire later reported that the company exceeded $300 million ARR in 2024 while generating positive free cash flow. Sacra adds an outside estimate that ARR was approaching $350 million by August 2025. Those are meaningful numbers, but they still sit far below the disclosure depth investors would normally want at a $5 billion mark. For diligence, the important point is that these numbers should be read as boundary markers rather than audited truth. The public record gives enough signal to place Icertis in the upper tier of private enterprise software companies, yet it still leaves uncertainty around exact recurring-revenue composition, cohort behavior, profitability, and the durability of recent growth. That means the financial story is strong enough to support a serious late-stage valuation discussion,
    but not strong enough to remove the need for private-room verification on retention, gross margin, burn, debt, and cash-generation detail before underwriting a final view. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
