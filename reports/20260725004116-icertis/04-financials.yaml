- id: section-2
  title: Capital adequacy, debt posture, and disclosure limits
  body: 'The 2025 financing matters because it was described as debt-paydown capital rather than a simple growth round. That implies the balance sheet, not just growth appetite, was part of the financing story. The later sale-exploration reporting is consistent with that interpretation: Icertis looks financially real and probably healthy, but also mature enough that liquidity path and capital structure matter. The problem is disclosure depth. There is no public cash balance, no clean debt schedule, no gross margin bridge, and no durable public view into NRR or concentration. For diligence, the important point is that these numbers should be read as boundary markers rather than audited truth. The public record gives enough signal to place Icertis in the upper tier of private enterprise software companies, yet it still leaves uncertainty around exact recurring-revenue composition, cohort behavior, profitability, and the durability of recent growth. That means the financial story is strong
    enough to support a serious late-stage valuation discussion, but not strong enough to remove the need for private-room verification on retention, gross margin, burn, debt, and cash-generation detail before underwriting a final view. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
