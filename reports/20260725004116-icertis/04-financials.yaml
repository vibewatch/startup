- id: section-3
  title: What public comps and filings say about underwrite quality
  body: 'Docusign and Veeva both provide public financial and filing surfaces that show what mature enterprise-software disclosure looks like. Fitch''s note on Conga also shows how debt and leverage can be analyzed in a private software context when enough data exists. Icertis offers nothing close to that level of external visibility. The most defensible financial verdict is therefore positive but cautious: the business looks scaled and viable, but still under-disclosed relative to the valuation it is trying to sustain. For diligence, the important point is that these numbers should be read as boundary markers rather than audited truth. The public record gives enough signal to place Icertis in the upper tier of private enterprise software companies, yet it still leaves uncertainty around exact recurring-revenue composition, cohort behavior, profitability, and the durability of recent growth. That means the financial story is strong enough to support a serious late-stage valuation discussion,
    but not strong enough to remove the need for private-room verification on retention, gross margin, burn, debt, and cash-generation detail before underwriting a final view. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
