- id: section-3
  title: Regulatory, buyer, and liquidity risk
  body: 'Contracts often contain sensitive pricing, compliance, and personal-data obligations, so data governance is a foundational risk rather than an edge case. Icertis''s own historical GDPR-related product messaging shows that regulation can directly shape roadmap demands. Customer-side expectations are also harsh: surveys about money lost in contracting imply that buyers want hard ROI, not abstract AI narratives. Finally, sale-exploration coverage indicates liquidity timing risk for investors. If a company once seen as a likely IPO story is publicly testing sale options at roughly the same valuation level as years earlier, expected returns become much more path dependent. In diligence terms, the chapter should be read as a set of execution conditions rather than a simple red-flag list. None of these risk categories alone invalidates the business, but together they raise the evidence bar for underwriting a premium late-stage valuation. Leadership transition must settle, AI claims must
    remain measurable and governable, and the company must show that data-governance and compliance obligations scale with customer expectations. If those conditions hold, risk becomes manageable; if they do not, the same strengths that once drove valuation can amplify downside through slower sales cycles, weaker differentiation, or a narrower exit set. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
