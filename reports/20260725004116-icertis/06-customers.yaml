chapter:
  number: 6
  title: Customers & GTM
  summary: Public customer evidence points to a very enterprise-heavy GTM motion built around large, complex deployments rather than low-touch self-serve adoption. The strongest proof comes from Microsoft, Cognizant, Daimler, Mercedes-Benz, Best Buy, and Accenture case studies plus repeated claims that more than one third of the Fortune 100 uses Icertis. That customer mix is a strength because it supports credibility and large contract values, but it also implies long cycles, integration-heavy implementations, and dependence on partner routes such as Microsoft and SAP.
sections:
- id: section-1
  title: Customer profile and proof of enterprise fit
  body: 'The public customer set is unmistakably enterprise oriented. Microsoft, Accenture, Cognizant, Daimler, Mercedes-Benz, and Best Buy are not shallow references to small pilots; they are complex organizations using Icertis inside legal, procurement, sales, and supplier workflows that matter operationally. The repeated company claim that more than one third of the Fortune 100 uses Icertis is directionally consistent with this large-account proof set. That supports a GTM thesis centered on trust, referenceability, and complex workflow credibility rather than on broad self-serve volume. This evidence matters because customer quality and go-to-market efficiency are the clearest real-world tests of whether Icertis''s platform is strategic or merely well marketed. Named enterprises, partner co-sell motions, and large contract volumes all support the case that Icertis sits in consequential workflows, yet the public record still favors showcase wins over granular renewal and cohort detail.
    The right interpretation is that customer proof is strong at the logo and use-case level, while commercial durability still depends on private validation of expansion, churn, concentration, and the exact contribution of partners such as Microsoft, SAP, and systems integrators to net-new bookings. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
