company:
  name: Icertis
chapter:
  number: 1
  title: Company Overview
  summary: Icertis is a Bellevue-headquartered enterprise contract lifecycle management company founded in 2009 that now frames itself as an AI-native contract intelligence platform. Public evidence supports a long capital arc through a 2025 $50 million round and a still-current ~$5 billion valuation anchor, but recent leadership transition and the passing of co-founder Samir Bodas make governance continuity a live issue. The strongest reusable ground truths are the company's large-enterprise focus, deep Microsoft and SAP ties, and scaled recurring-revenue profile.
sections:
- id: section-1
  title: Identity, headquarters, and reusable ground truth
  body: 'Icertis should be treated as a late-stage private enterprise software company rather than a niche legal-tech tool. Independent reporting is clearer than the marketing-heavy about page on the core identifiers that later chapters need: Bellevue, Washington as headquarters, 2009 as the founding year, and a CLM platform now positioned around AI-powered contract intelligence. The company''s own materials consistently emphasize revenue, savings, compliance, and business outcomes rather than simple document storage, which matters because it shows Icertis wants to be seen as a system that shapes commercial operations across functions. This chapter''s evidence base matters beyond a profile page because later diligence questions depend on whether these identity markers really hold up across independent reporting, company releases, and partner disclosures. The practical read-through is that investors should separate durable facts from branding language, track where the public record is consistent,
    and note where disclosure becomes thinner just as private-market stakes get larger. That combination of confirmed scale signals and selective opacity is itself a material finding: it supports treating Icertis as a real late-stage platform company while preserving caution around exact governance, cap-table, and operating-detail conclusions.'
