- id: section-2
  title: Founders, leadership bench, and key-person risk
  body: 'The founder record is central to the Icertis story because Samir Bodas and Monish Darda were both public identity anchors and functional operators. Official leadership pages identify Bodas as co-founder and long-time CEO and Darda as co-founder and CTO, while later company communications highlight broader bench-building in operations, finance, and marketing. That makes the 2025-2026 succession sequence materially important: Icertis announced a CEO transition and then the passing of Samir Bodas. For a company still priced like a scaled private leader, continuity of execution and governance is now a real diligence topic. This chapter''s evidence base matters beyond a profile page because later diligence questions depend on whether these identity markers really hold up across independent reporting, company releases, and partner disclosures. The practical read-through is that investors should separate durable facts from branding language, track where the public record is consistent,
    and note where disclosure becomes thinner just as private-market stakes get larger. That combination of confirmed scale signals and selective opacity is itself a material finding: it supports treating Icertis as a real late-stage platform company while preserving caution around exact governance, cap-table, and operating-detail conclusions.'
