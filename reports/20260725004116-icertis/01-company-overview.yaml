- id: section-3
  title: Capital formation, valuation, and private-market maturity
  body: 'Icertis shows a classic long-form enterprise-software funding progression. Company releases document growth rounds across 2016, 2017, 2018, 2019, and 2022, while 2025 reporting confirms a fresh $50 million round from existing backers. The current private-market maturity signal is the combination of more than $500 million raised, more than $300 million ARR in 2024, positive free cash flow, and a valuation anchor that still sits around $5 billion. Those are not early-stage signals. At the same time, the 2026 sale-exploration reporting suggests Icertis is now balancing liquidity timing and disclosure expectations, not just growth financing. This chapter''s evidence base matters beyond a profile page because later diligence questions depend on whether these identity markers really hold up across independent reporting, company releases, and partner disclosures. The practical read-through is that investors should separate durable facts from branding language, track where the public record
    is consistent, and note where disclosure becomes thinner just as private-market stakes get larger. That combination of confirmed scale signals and selective opacity is itself a material finding: it supports treating Icertis as a real late-stage platform company while preserving caution around exact governance, cap-table, and operating-detail conclusions.'
