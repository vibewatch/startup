- id: section-4
  title: Scale signals, partnerships, and milestones to reuse later
  body: 'The cleanest scale signals are the ones repeated across multiple recent sources: more than one third of the Fortune 100, operations in 90-plus countries, and heavy emphasis on Microsoft and SAP as both product and GTM multipliers. Those signals matter because they reinforce a platform with real enterprise depth rather than isolated pilot deployments. The milestone record also shows a progression from funding rounds to AI-specific branding and then to governance disruption, so later chapters should treat both the positive partner and traction markers and the negative leadership markers as live parts of the same current company story. This chapter''s evidence base matters beyond a profile page because later diligence questions depend on whether these identity markers really hold up across independent reporting, company releases, and partner disclosures. The practical read-through is that investors should separate durable facts from branding language, track where the public record
    is consistent, and note where disclosure becomes thinner just as private-market stakes get larger. That combination of confirmed scale signals and selective opacity is itself a material finding: it supports treating Icertis as a real late-stage platform company while preserving caution around exact governance, cap-table, and operating-detail conclusions.'
