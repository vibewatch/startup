  topStrengths:
    - 在企业 CLM 品类里位置清晰，能切入多职能工作流。
    - 与 Microsoft 和 SAP 生态深度对齐，撑起产品深度和分发可信度。
    - 在科技、制造、医疗和工业买家中有蓝筹客户证明。
    - 公开规模信号更像后期软件公司，而不是新兴单点工具。
    - AI 叙事绑定真实合同工作流，不只是泛化助手品牌。
  topRisks:
    - 约 $5B 的私募市场估值仍偏满，公开披露不完整，可比公司信号也不一致。
    - 创始人交接和 Samir Bodas 去世之后，管理层延续性成了真实承销问题。
    - 大型套件厂商和 AI 原生挑战者可能挤压合同工作流里的差异化。
    - 敏感合同数据持续带来隐私、安全和合规负担。
    - 如果出售流程与未来 IPO 叙事并行，退出时点会更依赖路径。
  unresolvedGaps:
    - 经审计 ARR、GAAP 收入、毛利率、烧钱、现金跑道和净留存率仍未公开披露。
    - 公开客户证明在 logo 和案例上很强，但对集中度、续约和扩张队列披露不足。
    - 董事会构成、股权结构控制条款、债务 / covenant 细节都不够透明。
    - 合作伙伴对线索和签约贡献的准确比例未披露。
    - 私募市场是否愿意按高于 2025 年标记的刷新估值买单，仍未验证。
