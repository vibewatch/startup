- id: section-2
  title: Relative comparison set and what it says about fairness
  body: 'The comp set is mixed by design. Veeva is a premium public vertical-software benchmark with much richer disclosure and far larger revenue scale. Docusign is another public benchmark, though its agreement-cloud scope is broader and more signature-heavy. Coupa''s $8 billion take-private gives a relevant private-market anchor for a broader spend-management platform with contracting adjacency. Ironclad, LinkSquares, and Conga show the smaller-scale private CLM comparison range. None of this says Icertis is wildly mispriced, but it does suggest the current mark already assumes premium positioning inside a category with multiple credible alternatives. The practical takeaway is that valuation should be anchored by evidence quality, not by the headline price tag alone. Public comparables and transaction references show that Icertis still occupies a meaningful strategic position, yet they also show how sensitive the equity story is to growth durability, exit route, and the market''s willingness
    to keep rewarding contract-management platforms at premium multiples. A disciplined investor should therefore treat the current mark as plausible but not self-validating, and use cross-checks from public software multiples, comparable private financings, and downside execution scenarios before concluding that the 2025 valuation fully captures present risk-adjusted value. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CV010
  - CV011
  - CV012
