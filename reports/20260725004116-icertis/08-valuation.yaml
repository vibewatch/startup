- id: section-3
  title: Valuation stance and what would change it
  body: 'The valuation stance is not a blanket rejection. Icertis has enough public scale, partner leverage, enterprise fit, and category leadership evidence to justify being valued well above smaller CLM peers. But the burden of proof remains high because the public denominator is still fuzzy and the latest public valuation signal is linked to strategic-exit exploration. The mark would look more attractive if diligence confirmed durable growth, strong gross margins, low churn, and clear leadership continuity. It would look more expensive if revenue quality, debt, or concentration proved weaker than the headline ARR and Fortune 100 signals suggest. The practical takeaway is that valuation should be anchored by evidence quality, not by the headline price tag alone. Public comparables and transaction references show that Icertis still occupies a meaningful strategic position, yet they also show how sensitive the equity story is to growth durability, exit route, and the market''s willingness
    to keep rewarding contract-management platforms at premium multiples. A disciplined investor should therefore treat the current mark as plausible but not self-validating, and use cross-checks from public software multiples, comparable private financings, and downside execution scenarios before concluding that the 2025 valuation fully captures present risk-adjusted value. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
