  topStrengths:
  - Clear enterprise CLM category position with multi-function workflow relevance.
  - Strong Microsoft and SAP ecosystem alignment that supports product depth and distribution credibility.
  - Blue-chip customer proof across technology, manufacturing, healthcare, and industrial buyers.
  - Public scale signals support a late-stage software profile rather than an emerging-point-solution profile.
  - AI positioning is tied to real contract workflows instead of generic assistant branding alone.
  topRisks:
  - The roughly $5B private-market mark still looks full against partial public disclosure and mixed comparable signals.
  - Leadership continuity became a real underwriting issue after the founder transition and Samir Bodas's passing.
  - Large-suite competitors and AI-native challengers can compress differentiation in contracting workflows.
  - Sensitive contract data raises ongoing privacy, security, and compliance burdens.
  - Exit timing appears more path dependent if a sale process competes with an eventual IPO narrative.
  unresolvedGaps:
  - Audited ARR, GAAP revenue, gross margin, burn, cash runway, and net retention remain undisclosed publicly.
  - Public customer proof is strong on logos and case studies, but weak on concentration, renewals, and expansion cohorts.
  - Board composition, cap-table control terms, and debt/covenant detail are not publicly transparent.
  - The exact contribution of partners to sourced pipeline and bookings is not disclosed.
  - Current private-market appetite for a refreshed valuation above the 2025 mark is unverified.
