companyProfile:
  summary: Icertis is a private enterprise software company founded in 2009 that sells AI-powered contract lifecycle management through the Icertis Contract Intelligence platform. The company began in India, now operates from Bellevue, Washington, and sells primarily to large enterprises that need governed workflows across legal, procurement, sales, and supply-chain operations. Public evidence supports meaningful scale, blue-chip customers, deep Microsoft and SAP alignment, more than $500 million of disclosed funding, and a 2025 valuation anchor of roughly $5 billion, while leaving detailed financial disclosure comparatively thin.
  foundedDate: '2009-01-01'
