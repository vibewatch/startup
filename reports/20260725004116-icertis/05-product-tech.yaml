- id: section-2
  title: 'AI layer: copilots, Vera, and agentic evolution'
  body: 'The AI story has evolved from copilots toward Vera and Vera Agents. That progression keeps Icertis aligned with the broader enterprise-software shift toward agentic automation, but it also raises the bar because every major rival now markets some form of AI review, summarization, or agentic support. Icertis therefore has to prove not only that it has AI, but that its AI is grounded in enterprise contract data and linked to real business systems. Microsoft''s Azure and Azure OpenAI references help that case. The implication for investors is that product quality at Icertis should be judged on workflow depth, integration credibility, and controlled AI deployment rather than on generic generative-AI branding alone. Public materials support a broad platform surface and real enterprise architecture work, but they also show how much the go-to-market story depends on proving safe automation inside mission-critical contracting processes. The best diligence posture is therefore to view product
    breadth as credible, treat ecosystem integrations as a meaningful moat component, and still demand private evidence on implementation speed, AI guardrails, and release-to-release customer adoption before assuming sustained technical leadership. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
