      - number: '7.3'
        title: Regulatory, buyer, and liquidity risk
        blocks:
          - type: paragraph
            body: >-
              Contracts often contain sensitive pricing, compliance, and personal-data obligations, so data governance
              is a foundational risk rather than an edge case. Icertis's own historical GDPR-related product messaging
              shows that regulation can directly shape roadmap demands. Customer-side expectations are also harsh:
              surveys about money lost in contracting imply that buyers want hard ROI, not abstract AI narratives.
              Finally, sale-exploration coverage indicates liquidity timing risk for investors. If a company once seen
              as a likely IPO story is publicly testing sale options at roughly the same valuation level as years
              earlier, expected returns become much more path dependent. In diligence terms, the chapter should be read
