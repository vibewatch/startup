companyProfile:
  summary: >-
    Icertis is a private enterprise software company founded in 2009 that sells AI-powered contract lifecycle management
    through the Icertis Contract Intelligence platform. The company began in India, now operates from Bellevue,
    Washington, and sells primarily to large enterprises that need governed workflows across legal, procurement, sales,
    and supply-chain operations. Public evidence supports meaningful scale, blue-chip customers, deep Microsoft and SAP
    alignment, more than $500 million of disclosed funding, and a 2025 valuation anchor of roughly $5 billion, while
    leaving detailed financial disclosure comparatively thin.
  foundedDate: '2009-01-01'
  founders:
    - name: Samir Bodas
      role: Co-founder / former CEO
      background: Longtime public face of Icertis and a central operator through the company's scaling period.
      claimRefs:
        - CO010
        - CO011
        - CO013
    - name: Monish Darda
      role: Co-founder / CTO
      background: Technical co-founder who remains a key continuity anchor for product and engineering credibility.
      claimRefs:
        - CO010
        - CO012
        - CO014
  foundingLocation: Pune, India
  headquarters: Bellevue, Washington, USA
  productSummary: >-
    Icertis Contract Intelligence combines contract repository, authoring, workflow automation, analytics, obligation
    management, and AI-assisted review on top of enterprise integrations.
  customerFocus: Fortune 100, global enterprise, and regulated-industry legal, procurement, sales, and operations teams.
  businessModel: >-
