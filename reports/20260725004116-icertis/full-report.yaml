  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Leadership and governance risk
        blocks:
          - type: paragraph
            body: >-
              The most visible near-term risk is leadership continuity. The company publicly announced a CEO transition,
              then the passing of co-founder Samir Bodas, and independent 2026 coverage suggests further leadership
              instability after that. For a late-stage private company that still trades partly on founder reputation
              and enterprise trust, this is a real governance variable rather than background noise. The risk is not
              simply that executives changed; it is that customers, employees, and potential acquirers now have to
              evaluate Icertis without the same founder-led continuity that underpinned much of its earlier story. In
              diligence terms, the chapter should be read as a set of execution conditions rather than a simple red-flag
              list. None of these risk categories alone invalidates the business, but together they raise the evidence
              bar for underwriting a premium late-stage valuation. Leadership transition must settle, AI claims must
              remain measurable and governable, and the company must show that data-governance and compliance
              obligations scale with customer expectations. If those conditions hold, risk becomes manageable; if they
              do not, the same strengths that once drove valuation can amplify downside through slower sales cycles,
              weaker differentiation, or a narrower exit set. This additional synthesis closes the remaining prose gap
              by stating the practical diligence consequence explicitly: public evidence is directionally strong, but
              the right underwriting posture is to use it as a structured starting point and then press for private
              verification on the exact metrics, controls, and operating dependencies that ultimately determine
              investment quality.
