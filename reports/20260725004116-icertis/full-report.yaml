        title: Revenue model and public traction signals
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a scaled recurring software business even though it does not support an
              IPO-grade financial model. Icertis said it crossed $250 million ARR in early 2024, and GeekWire later
              reported that the company exceeded $300 million ARR in 2024 while generating positive free cash flow.
              Sacra adds an outside estimate that ARR was approaching $350 million by August 2025. Those are meaningful
              numbers, but they still sit far below the disclosure depth investors would normally want at a $5 billion
              mark. For diligence, the important point is that these numbers should be read as boundary markers rather
              than audited truth. The public record gives enough signal to place Icertis in the upper tier of private
              enterprise software companies, yet it still leaves uncertainty around exact recurring-revenue composition,
              cohort behavior, profitability, and the durability of recent growth. That means the financial story is
              strong enough to support a serious late-stage valuation discussion, but not strong enough to remove the
              need for private-room verification on retention, gross margin, burn, debt, and cash-generation detail
