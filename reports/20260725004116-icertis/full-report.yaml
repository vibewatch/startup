      - number: '3.3'
        title: Where the threat is most credible
        blocks:
          - type: paragraph
            body: >-
              The threat is strongest in three places. First, suite vendors can bundle contracting into adjacent
              workflows and win on procurement or ERP gravity. Second, UX-led tools like Ironclad and LinkSquares can
              appeal to teams that want faster deployment or simpler administration. Third, AI narratives are becoming
              universal, which means Icertis cannot rely on AI branding alone. The most durable moat is likely
