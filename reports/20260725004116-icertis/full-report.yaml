  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what belongs in scope
        blocks:
          - type: paragraph
            body: >-
              The most important discipline in this chapter is to define the market before sizing it. The retained
              sources support a CLM boundary that includes authoring, negotiation, repository management, analytics,
              obligation tracking, and post-signature performance visibility. That is larger than e-signature alone but
              smaller than all legal tech or all procurement software. For Icertis, the boundary matters because the
              company wants to be bought as a system that links contracts to enterprise execution rather than as a
              simple document utility. This matters because the investment case for Icertis depends as much on category
              quality as on company execution. A market that keeps expanding across legal, procurement, sales, and
              compliance functions can support sustained wallet share gains, but only if buyers continue prioritizing
              governed workflows over point automation. The most important interpretation is therefore not the exact
              top-down market estimate but the persistence of the underlying demand drivers: digital contracting,
              AI-enabled review, obligation management, and the need to connect agreement data to ERP, CRM, and
              procurement systems. Those forces collectively support a durable, multi-year spend category rather than a
              short-lived feature cycle. This additional synthesis closes the remaining prose gap by stating the
              practical diligence consequence explicitly: public evidence is directionally strong, but the right
              underwriting posture is to use it as a structured starting point and then press for private verification
              on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.
