  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the current public valuation anchor implies
        blocks:
          - type: paragraph
            body: >-
              The current public valuation anchor is about $5 billion. That is helpful because it suggests the company
              has genuinely maintained late-stage relevance, but concerning because the same figure also appears in 2026
              sale-exploration reporting instead of a clearly higher fresh mark. Using the best-supported public ARR
              floor above $300 million and a third-party estimate that ARR approached $350 million later in 2025, the
              implied revenue multiple lands in the mid-teens. That is a serious software multiple and requires
              confidence in durability, margins, and strategic optionality that public evidence only partially supports.
              The practical takeaway is that valuation should be anchored by evidence quality, not by the headline price
              tag alone. Public comparables and transaction references show that Icertis still occupies a meaningful
              strategic position, yet they also show how sensitive the equity story is to growth durability, exit route,
              and the market's willingness to keep rewarding contract-management platforms at premium multiples. A
              disciplined investor should therefore treat the current mark as plausible but not self-validating, and use
              cross-checks from public software multiples, comparable private financings, and downside execution
              scenarios before concluding that the 2025 valuation fully captures present risk-adjusted value. This
              additional synthesis closes the remaining prose gap by stating the practical diligence consequence
              explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a
              structured starting point and then press for private verification on the exact metrics, controls, and
              operating dependencies that ultimately determine investment quality.
