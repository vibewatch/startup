  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and workflow architecture
        blocks:
          - type: paragraph
            body: >-
              Icertis is best understood as a platform that turns contracts into structured operational data. Its
              retained product pages consistently tie together authoring, workflows, repository management, analytics,
              and post-signature control rather than presenting one isolated contract step. That matters because the
              company's strongest use cases rely on contracts influencing procurement, compliance, and commercial
              execution after signature, not just producing faster redlines before signature. The implication for
              investors is that product quality at Icertis should be judged on workflow depth, integration credibility,
              and controlled AI deployment rather than on generic generative-AI branding alone. Public materials support
              a broad platform surface and real enterprise architecture work, but they also show how much the
              go-to-market story depends on proving safe automation inside mission-critical contracting processes. The
              best diligence posture is therefore to view product breadth as credible, treat ecosystem integrations as a
              meaningful moat component, and still demand private evidence on implementation speed, AI guardrails, and
              release-to-release customer adoption before assuming sustained technical leadership. This additional
              synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public
              evidence is directionally strong, but the right underwriting posture is to use it as a structured starting
              point and then press for private verification on the exact metrics, controls, and operating dependencies
