      - number: '8.3'
        title: Valuation stance and what would change it
        blocks:
          - type: paragraph
            body: >-
              The valuation stance is not a blanket rejection. Icertis has enough public scale, partner leverage,
              enterprise fit, and category leadership evidence to justify being valued well above smaller CLM peers. But
              the burden of proof remains high because the public denominator is still fuzzy and the latest public
              valuation signal is linked to strategic-exit exploration. The mark would look more attractive if diligence
              confirmed durable growth, strong gross margins, low churn, and clear leadership continuity. It would look
              more expensive if revenue quality, debt, or concentration proved weaker than the headline ARR and Fortune
