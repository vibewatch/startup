        blocks:
          - type: paragraph
            body: >-
              The public customer set is unmistakably enterprise oriented. Microsoft, Accenture, Cognizant, Daimler,
              Mercedes-Benz, and Best Buy are not shallow references to small pilots; they are complex organizations
              using Icertis inside legal, procurement, sales, and supplier workflows that matter operationally. The
              repeated company claim that more than one third of the Fortune 100 uses Icertis is directionally
              consistent with this large-account proof set. That supports a GTM thesis centered on trust,
              referenceability, and complex workflow credibility rather than on broad self-serve volume. This evidence
              matters because customer quality and go-to-market efficiency are the clearest real-world tests of whether
              Icertis's platform is strategic or merely well marketed. Named enterprises, partner co-sell motions, and
              large contract volumes all support the case that Icertis sits in consequential workflows, yet the public
              record still favors showcase wins over granular renewal and cohort detail. The right interpretation is
              that customer proof is strong at the logo and use-case level, while commercial durability still depends on
              private validation of expansion, churn, concentration, and the exact contribution of partners such as
              Microsoft, SAP, and systems integrators to net-new bookings. This additional synthesis closes the
              remaining prose gap by stating the practical diligence consequence explicitly: public evidence is
