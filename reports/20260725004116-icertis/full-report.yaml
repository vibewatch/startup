      - number: '2.3'
        title: Growth drivers, budget owners, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              AI is a real tailwind, but not an automatic close. Icertis, Docusign, and other market voices all point to
              generative AI, contract summarization, and agentic workflows as rising priorities. Yet the same evidence
              shows persistent governance and visibility concerns, which means legal, procurement, and IT still need
              explainability and trust. Budget ownership is therefore fragmented: some deals look legal-led, others
              procurement-led, and still others ride ERP or source-to-pay programs. Icertis benefits from that
              complexity when integration matters, but it also faces more bundled competition because the same
              complexity lets larger suites pull contracting inside broader transformations. This matters because the
              investment case for Icertis depends as much on category quality as on company execution. A market that
              keeps expanding across legal, procurement, sales, and compliance functions can support sustained wallet
              share gains, but only if buyers continue prioritizing governed workflows over point automation. The most
              important interpretation is therefore not the exact top-down market estimate but the persistence of the
