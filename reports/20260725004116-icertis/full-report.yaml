      - number: '8.2'
        title: Relative comparison set and what it says about fairness
        blocks:
          - type: paragraph
            body: >-
              The comp set is mixed by design. Veeva is a premium public vertical-software benchmark with much richer
              disclosure and far larger revenue scale. Docusign is another public benchmark, though its agreement-cloud
              scope is broader and more signature-heavy. Coupa's $8 billion take-private gives a relevant private-market
              anchor for a broader spend-management platform with contracting adjacency. Ironclad, LinkSquares, and
              Conga show the smaller-scale private CLM comparison range. None of this says Icertis is wildly mispriced,
              but it does suggest the current mark already assumes premium positioning inside a category with multiple
              credible alternatives. The practical takeaway is that valuation should be anchored by evidence quality,
              not by the headline price tag alone. Public comparables and transaction references show that Icertis still
              occupies a meaningful strategic position, yet they also show how sensitive the equity story is to growth
