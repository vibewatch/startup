      - number: '7.2'
        title: Competitive and AI-displacement risk
        blocks:
          - type: paragraph
            body: >-
              Competition is intensifying from every direction. SAP, Coupa, Docusign, Sirion, Ironclad, and others all
              market stronger AI, better workflow automation, or tighter suite integration. At the same time, enterprise
              buyers increasingly believe AI agents can negotiate, summarize, or manage contracts, which raises the
              possibility that some contracting tasks become easier to automate without a full classic CLM deployment.
              Icertis still benefits from integration depth and a rich installed base, but its product advantage will
              shrink quickly if AI becomes a thin feature layer that buyers can source from larger platforms or cheaper
              specialists. In diligence terms, the chapter should be read as a set of execution conditions rather than a
