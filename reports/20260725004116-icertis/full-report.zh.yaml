      - number: '7.2'
        title: 竞争与 AI 替代风险
        blocks:
          - type: paragraph
            body: >-
              竞争正从每个方向加剧。SAP、Coupa、Docusign、Sirion、Ironclad 等都在营销更强 AI、更好的工作流自动化或更紧的套件集成。与此同时，企业买家越来越相信 AI
              智能体可以谈判、摘要或管理合同，这提高了一种可能性：部分合同任务无需完整的传统 CLM 部署，也会变得更容易自动化。Icertis 仍受益于集成深度和丰富装机基础，但如果 AI
              变成一个薄功能层，买方可以从更大平台或更便宜专家那里获取，它的产品优势会很快收窄。按尽调口径，本章应被读成一组执行条件，而不是简单的红旗清单。这些风险类别单独看，没有哪一项足以否定业务；但合在一起，会抬高为高溢价后期估值做投资测算的证据门槛。领导层交接必须稳定下来，AI
              主张必须保持可衡量、可治理，公司还必须证明数据治理和合规义务能随客户预期一起扩展。如果这些条件成立，风险可管理；如果不成立，曾经推高估值的同一批优势，可能通过销售周期变慢、差异化变弱或退出路径收窄来放大下行。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
