  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围和工作流架构
        blocks:
          - type: paragraph
            body: >-
              Icertis
              最适合被理解为一个把合同变成结构化运营数据的平台。其产品页面持续把起草、工作流、合同库管理、分析和签署后控制串在一起，而不是只呈现某个孤立的合同步骤。这很重要，因为公司最强的用例依赖合同在签署后影响采购、合规和商业执行，而不只是签署前更快出红线。对投资人来说，评判
              Icertis 的产品质量，应看工作流深度、集成可信度和受控 AI 部署，而不是只看泛化的生成式 AI 品牌。公开材料支持它平台覆盖面广，且真实投入了企业架构工作，但也显示 GTM
              故事很大程度上要靠证明：在任务关键型合同流程里，安全自动化确实能落地。因此，最好的尽调姿态是把产品广度视为可信，把生态集成视为有意义的护城河组成部分，同时仍要求私下证据来验证实施速度、AI
