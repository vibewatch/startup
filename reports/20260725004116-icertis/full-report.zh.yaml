      - number: '2.3'
        title: 增长驱动、预算归属和采用约束
        blocks:
          - type: paragraph
            body: >-
              AI 是真实顺风，但不会自动成交。Icertis、Docusign 和其他市场声音都把生成式 AI、合同摘要和智能体工作流指向上升优先级。但同一批证据也显示，治理和可见性担忧持续存在，这意味着法务、采购和 IT
              仍然需要可解释性和信任。预算归属因此很分散：有些交易由法务牵头，有些由采购牵头，还有一些搭在 ERP 或寻源到付款项目上。集成重要时，复杂性利好
              Icertis；但同样的复杂性也带来更多捆绑式竞争，因为大型套件可以把合同纳入更广的转型项目。这一点重要，因为 Icertis
              的投资逻辑既取决于公司执行，也取决于品类质量。如果市场继续横跨法务、采购、销售和合规扩张，就能支撑持续的钱包份额提升；前提是买方继续把受控工作流放在点状自动化之上。因此，最重要的不是某个自上而下的市场规模数字，而是底层需求驱动能否持续：数字化签约、AI
