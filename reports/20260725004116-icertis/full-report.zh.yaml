      claimRefs:
        - CO010
        - CO012
        - CO014
  foundingLocation: Pune, India
  headquarters: Bellevue, Washington, USA
  productSummary: Icertis Contract Intelligence 在企业集成之上，把合同库、起草、工作流自动化、分析、义务管理和 AI 辅助审阅整合起来。
  customerFocus: Fortune 100、全球企业，以及受监管行业的法务、采购、销售和运营团队。
  businessModel: 企业 SaaS 平台，靠直销和伙伴主导的企业渠道销售；实施和集成工作进一步推动扩张。
  stage: Late-stage private
