  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和公开牵引信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Icertis 已是规模化经常性软件业务，但还支撑不了 IPO 级财务模型。Icertis 称公司在 2024 年初突破 $250M ARR，GeekWire 后来报道公司 2024 年 ARR
              超过 $300M，并产生正自由现金流。Sacra 又给出外部估计，认为到 2025 年 8 月 ARR 正接近 $350M。这些数字有分量，但相对于 $5B
              估值标记，披露深度仍远低于投资人通常需要的水平。做尽调时，关键是把这些数字看成边界标记，而不是审计事实。公开记录给出的信号足以把 Icertis
              放进私有企业软件公司的上层梯队，但仍留下不确定性：经常性收入的准确构成、客户队列行为、盈利能力，以及近期增长的耐久性。也就是说，财务故事足以支撑严肃的后期估值讨论，但还不足以消除私下资料室核验的必要；在形成最终判断前，仍要核验留存、毛利率、烧钱、债务和现金生成细节。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
