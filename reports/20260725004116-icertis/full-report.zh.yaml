      - number: '7.3'
        title: 监管、买方与流动性风险
        blocks:
          - type: paragraph
            body: >-
              合同往往包含敏感定价、合规和个人数据义务，因此数据治理是基础风险，不是边缘情况。Icertis 自己过去围绕 GDPR
              的产品信息也显示，监管会直接塑造路线图需求。客户侧预期同样苛刻：关于合同造成资金损失的调查意味着，买方要的是硬 ROI，而不是抽象 AI 叙事。最后，探索出售的报道指向投资人的流动性时点风险。如果一家曾被视为可能
              IPO
              的公司，公开测试出售选项时估值水平大致仍与数年前相同，预期回报就会更依赖路径。按尽调口径，本章应被读成一组执行条件，而不是简单的红旗清单。这些风险类别单独看，没有哪一项足以否定业务；但合在一起，会抬高为高溢价后期估值做投资测算的证据门槛。领导层交接必须稳定下来，AI
