  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 领导层与治理风险
        blocks:
          - type: paragraph
            body: >-
              最显眼的近端风险是领导层连续性。公司先公开宣布 CEO 交接，随后公告联合创始人 Samir Bodas 去世，独立 2026
              年报道还显示之后出现进一步领导层不稳定。对一家仍部分依靠创始人声誉和企业信任来定价的后期私有公司来说，这是真实治理变量，不是背景噪音。风险不只是高管发生变动；而是客户、员工和潜在收购方如今必须在少了同样由创始人主导的连续性后评估
              Icertis，而这种连续性曾支撑公司早期叙事的大部分。按尽调口径，本章应被读成一组执行条件，而不是简单的红旗清单。这些风险类别单独看，没有哪一项足以否定业务；但合在一起，会抬高为高溢价后期估值做投资测算的证据门槛。领导层交接必须稳定下来，AI
              主张必须保持可衡量、可治理，公司还必须证明数据治理和合规义务能随客户预期一起扩展。如果这些条件成立，风险可管理；如果不成立，曾经推高估值的同一批优势，可能通过销售周期变慢、差异化变弱或退出路径收窄来放大下行。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
