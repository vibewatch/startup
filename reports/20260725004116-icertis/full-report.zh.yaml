  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局结构和竞争者类别
        blocks:
          - type: paragraph
            body: >-
              竞争者集合不是单一同业群。SAP 和 Coupa 是套件厂商，会自然把合同拉进支出和采购技术栈。Docusign
              来自规模更大的协议云和签名安装基础。Ironclad、Agiloft、LinkSquares、Conga 和 Sirion 是纯 CLM 或邻近领域专家，竞争点在现代化 UX、无代码管理、分析、收入生命周期或
              AI 原生功能。这种结构很重要，因为 Icertis 通常不是只在静态功能清单上竞争；它更常争夺的是买方希望合同数据和工作流停在哪里。分析结论是，Icertis
              并不是在真空中和某一个合同管理同行竞争。它处在分层战场里：既有厂商带来分销，上市可比公司带来估值基准，VC 支持的专家公司带来产品速度。这个组合改变了尽调优先级：关键问题不是有没有竞争，而是 Icertis
              能否持续赢下高价值、复杂的企业部署；在这些部署里，集成深度、条款智能和跨职能工作流必须足够重要，才能抵消大型套件压力或低摩擦替代方案。公开证据支持它有可信位置，但绝不是无人挑战。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
