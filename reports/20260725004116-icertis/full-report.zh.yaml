            body: >-
              2025 年融资重要，因为它被描述为用于偿债，而不是简单的增长轮。这意味着资产负债表，而不只是增长胃口，是融资故事的一部分。后续探索出售的报道也符合这种解释：Icertis
              看起来财务上是真实的，而且可能健康，但也成熟到流动性路径和资本结构都变得重要。问题在于披露深度。公开信息里没有现金余额、没有清晰债务表、没有毛利率桥接，也没有对 NRR
              或客户集中度的耐久公开视图。做尽调时，关键是把这些数字看成边界标记，而不是审计事实。公开记录给出的信号足以把 Icertis
              放进私有企业软件公司的上层梯队，但仍留下不确定性：经常性收入的准确构成、客户队列行为、盈利能力，以及近期增长的耐久性。也就是说，财务故事足以支撑严肃的后期估值讨论，但还不足以消除私下资料室核验的必要；在形成最终判断前，仍要核验留存、毛利率、烧钱、债务和现金生成细节。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
