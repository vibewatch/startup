  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户画像和企业适配证据
        blocks:
          - type: paragraph
            body: >-
              公开客户集合明显偏企业级。Microsoft、Accenture、Cognizant、Daimler、Mercedes-Benz 和 Best Buy
              不是小型试点的浅层背书；它们是复杂组织，在真正影响运营的法务、采购、销售和供应商工作流中使用 Icertis。公司反复声称超过三分之一的 Fortune 100 使用
              Icertis，这与这组大客户证明方向一致。它支持一个围绕信任、可背书性和复杂工作流可信度展开的 GTM 论点，而不是依赖广泛自助式体量。这些证据重要，因为客户质量和 GTM 效率，是检验 Icertis
              平台到底具备战略性，还是只是营销做得好，最清楚的现实测试。具名企业、伙伴联合销售动作和大合同量都支持一个判断：Icertis
              坐在有分量的工作流里；但公开记录仍更偏展示型胜利，而不是细颗粒度续约和客户队列明细。正确解读是，客户证据在客户标识和用例层面很强，但商业耐久性仍取决于私下验证：扩张、流失、集中度，以及 Microsoft、SAP
              和系统集成商等伙伴对净新增预订的准确贡献。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
