companyProfile:
  summary: >-
    Icertis 是一家成立于 2009 年的私有企业软件公司，通过 Icertis Contract Intelligence 平台销售 AI 驱动的合同生命周期管理。公司起步于印度，目前总部位于 Bellevue,
    Washington，主要面向大型企业销售，这些客户需要在法务、采购、销售和供应链运营中纳入受控工作流。公开证据支持其具备可观规模、蓝筹客户、与 Microsoft 和 SAP 的深度绑定、超过 $500M 的已披露融资，以及
    2025 年约 $5B 的估值锚点；但详细财务披露仍相对单薄。
  foundedDate: '2009-01-01'
  founders:
    - name: Samir Bodas
      role: 联合创始人 / 前 CEO
      background: Icertis 长期的公众代表，也是公司扩张期的核心经营者。
      claimRefs:
        - CO010
