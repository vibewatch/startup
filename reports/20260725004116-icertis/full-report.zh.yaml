  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前公开估值锚点意味着什么
        blocks:
          - type: paragraph
            body: >-
              当前公开估值锚点约为 $5 billion。这一数字有用，因为它说明公司确实维持了后期阶段的存在感；但也让人警惕，因为同一个数字出现在 2026
              年探索出售的报道中，而不是一个明显更高的新估值。按公开证据支撑最充分的 ARR 下限（超过 $300 million）以及第三方估算（2025 年稍晚 ARR 接近 $350
              million）测算，隐含收入倍数落在十几倍中段。这是很高的软件倍数，需要投资人相信收入韧性、利润率和战略可选性；公开证据只能支撑其中一部分。实际结论是，估值应由证据质量锚定，而不是只看标价。公开可比公司和交易参照显示，Icertis
              仍占据重要战略位置；但它们也说明，股权故事对增长韧性、退出路径，以及市场是否继续给合同管理平台高倍数非常敏感。因此，纪律性投资人应把当前估值视为合理但不能自证的锚点，在认定 2025
              年估值已充分反映当前风险调整价值前，先用公开软件倍数、可比私募融资和下行情景做交叉核对。补充判断把剩余文字缺口说清楚：公开证据方向上偏强，但正确的投资测算姿态是把它当作结构化起点，再要求私下核验具体指标、控制项和运营依赖，因为这些最终决定投资质量。
