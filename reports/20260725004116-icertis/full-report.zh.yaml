      - number: '8.2'
        title: 相对可比组及其对公允性的提示
        blocks:
          - type: paragraph
            body: >-
              可比组刻意混合不同参照。Veeva 是高溢价的上市垂直软件基准，披露更充分、收入规模也大得多。Docusign 是另一个上市基准，但协议云范围更宽，电子签名权重更高。Coupa 以 $8 billion
              私有化，为一个更宽的支出管理平台提供私募市场锚点，且与合同业务相邻。Ironclad、LinkSquares 和 Conga 则给出规模更小的私有 CLM 对照区间。这些证据不能说明 Icertis
              被严重错定价，但提示当前估值已经假设它在一个有多家可信替代者的品类里占据高端位置。实际结论是，估值应由证据质量锚定，而不是只看标价。公开可比公司和交易参照显示，Icertis
              仍占据重要战略位置；但它们也说明，股权故事对增长韧性、退出路径，以及市场是否继续给合同管理平台高倍数非常敏感。因此，纪律性投资人应把当前估值视为合理但不能自证的锚点，在认定 2025
              年估值已充分反映当前风险调整价值前，先用公开软件倍数、可比私募融资和下行情景做交叉核对。补充判断把剩余文字缺口说清楚：公开证据方向上偏强，但正确的投资测算姿态是把它当作结构化起点，再要求私下核验具体指标、控制项和运营依赖，因为这些最终决定投资质量。
