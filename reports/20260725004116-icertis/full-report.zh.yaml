      - number: '8.3'
        title: 估值立场，以及什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              估值立场并不是一概否定。Icertis 的公开规模、合作伙伴杠杆、企业适配度和品类领导力证据足够，支撑它较小型 CLM
              同行获得明显溢价。但举证门槛仍高，因为公开分母仍然模糊，最新公开估值信号又与战略退出探索挂钩。如果尽调确认增长可持续、毛利率强、流失率低且领导层延续清晰，当前估值会更有吸引力。如果收入质量、债务或客户集中度弱于对外口径
              ARR 和 Fortune 100 客户信号，估值就会显得更贵。实际结论是，估值应由证据质量锚定，而不是只看标价。公开可比公司和交易参照显示，Icertis
              仍占据重要战略位置；但它们也说明，股权故事对增长韧性、退出路径，以及市场是否继续给合同管理平台高倍数非常敏感。因此，纪律性投资人应把当前估值视为合理但不能自证的锚点，在认定 2025
              年估值已充分反映当前风险调整价值前，先用公开软件倍数、可比私募融资和下行情景做交叉核对。补充判断把剩余文字缺口说清楚：公开证据方向上偏强，但正确的投资测算姿态是把它当作结构化起点，再要求私下核验具体指标、控制项和运营依赖，因为这些最终决定投资质量。
