  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和纳入范围
        blocks:
          - type: paragraph
            body: >-
              本章最重要的纪律，是先定义市场再做规模测算。现有来源支持这样一条 CLM 边界：它包括起草、谈判、合同库管理、分析、义务跟踪和签署后的履约可见性。这个范围大于单纯电子签名，但小于全部法务科技或全部采购软件。对
              Icertis 来说，边界很重要，因为公司希望客户购买的是一个把合同连接到企业执行的系统，而不是简单的文档工具。这一点重要，因为 Icertis
              的投资逻辑既取决于公司执行，也取决于品类质量。如果市场继续横跨法务、采购、销售和合规扩张，就能支撑持续的钱包份额提升；前提是买方继续把受控工作流放在点状自动化之上。因此，最重要的不是某个自上而下的市场规模数字，而是底层需求驱动能否持续：数字化签约、AI
              辅助审阅、义务管理，以及把协议数据接入 ERP、CRM
              和采购系统的需求。这些力量合在一起，支撑的是一个多年持续支出品类，而不是短命功能周期。补充综合的尽调含义很直接：公开证据给出的方向性很强，但正确的投资测算口径，是把它当作结构化起点，再围绕最终决定投资质量的准确指标、控制项和运营依赖做私下核验。
