- id: section-2
  title: Sizing lenses, growth rates, and adoption pockets
  body: 'Independent market reports are directionally consistent even when they use slightly different definitions. Fortune Business Insights sizes the CLM market at roughly $1.84 billion in 2025 with long-term double-digit growth, while Grand View frames both a software-only CLM lens and a broader contract-management lens. Those are healthy numbers, but not numbers that justify careless TAM inflation. The more useful conclusion is that CLM is a meaningful category with room for multiple winners, especially inside North American enterprise budgets and procurement modernization programs. This matters because the investment case for Icertis depends as much on category quality as on company execution. A market that keeps expanding across legal, procurement, sales, and compliance functions can support sustained wallet share gains, but only if buyers continue prioritizing governed workflows over point automation. The most important interpretation is therefore not the exact top-down market estimate
    but the persistence of the underlying demand drivers: digital contracting, AI-enabled review, obligation management, and the need to connect agreement data to ERP, CRM, and procurement systems. Those forces collectively support a durable, multi-year spend category rather than a short-lived feature cycle. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
