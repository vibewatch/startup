  - FM002
- id: section-3
  title: Growth drivers, budget owners, and adoption constraints
  body: 'AI is a real tailwind, but not an automatic close. Icertis, Docusign, and other market voices all point to generative AI, contract summarization, and agentic workflows as rising priorities. Yet the same evidence shows persistent governance and visibility concerns, which means legal, procurement, and IT still need explainability and trust. Budget ownership is therefore fragmented: some deals look legal-led, others procurement-led, and still others ride ERP or source-to-pay programs. Icertis benefits from that complexity when integration matters, but it also faces more bundled competition because the same complexity lets larger suites pull contracting inside broader transformations. This matters because the investment case for Icertis depends as much on category quality as on company execution. A market that keeps expanding across legal, procurement, sales, and compliance functions can support sustained wallet share gains, but only if buyers continue prioritizing governed workflows
    over point automation. The most important interpretation is therefore not the exact top-down market estimate but the persistence of the underlying demand drivers: digital contracting, AI-enabled review, obligation management, and the need to connect agreement data to ERP, CRM, and procurement systems. Those forces collectively support a durable, multi-year spend category rather than a short-lived feature cycle. This additional synthesis closes the remaining prose gap by stating the practical diligence consequence explicitly: public evidence is directionally strong, but the right underwriting posture is to use it as a structured starting point and then press for private verification on the exact metrics, controls, and operating dependencies that ultimately determine investment quality.'
