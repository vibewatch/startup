summary:
  headline: >-
    Icertis looks like a real late-stage enterprise software asset with durable category demand and strong ecosystem
    leverage, but current valuation still requires disciplined diligence because disclosure remains partial and
    governance continuity is newly important.
  overallScore: 7.1
