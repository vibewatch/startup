evidenceGaps:
  - type: access-blocked
    severity: material
    topic: governance
    missingEvidence: >-
      The SEBI DRHP PDF URLs (mar-2026 and may-2026 paths) both returned 404 and Zaubacorp's Moneyview Limited and
      Whizdm Innovations corporate filings returned 403 during the research run, so the independent-director roster,
      statutory officers, and the audited cap-table in the DRHP could not be extracted directly.
    whyItMatters: >-
      Governance and cap-table opacity matter for IPO underwriting because dilution, voting rights, and audit-committee
      independence drive board-level alignment with public-market investors.
    diligencePath: >-
      Re-fetch the SEBI DRHP under a desktop browser profile, retrieve the SEBI-final RHP once published, and request
      Zaubacorp PDF copies of the Moneyview Limited and Whizdm Finance Private Limited filings.
    relatedQuestionRefs:
      - QO009
      - QO011
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: leadership-roster
    missingEvidence: >-
      Beyond the two co-founders and the family selling shareholder, no CFO, CRO, head of product, head of risk, or head
      of compliance is named in reviewed public sources for Moneyview Limited as of mid-2026.
    whyItMatters: >-
      An incomplete executive enumeration limits assessment of functional coverage, succession depth, and key-person
      risk beyond the two co-founders going into the IPO.
    diligencePath: >-
      Request the current org chart, board roster, and senior-leadership list during a management session; cross-check
      against LinkedIn senior-title scans and the eventual SEBI-final RHP officer disclosures.
    relatedQuestionRefs:
      - QO007
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Exact pre-IPO ownership percentages, preference stack, anti-dilution provisions, and OFS-sale sizes per
      shareholder are not disclosed in any reviewed open source for Moneyview Limited.
    whyItMatters: >-
      Without an itemised cap table, downstream valuation, dilution, and OFS-economics analyses cannot independently
      verify the post-IPO ownership story.
    diligencePath: >-
      Request the SEBI-final RHP cap-table tables and individual investor OFS-allocation schedules; cross-check against
      Accel, Apis Partners, Ribbit Capital, and Lok Capital portfolio databases.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: loan-book-split
    missingEvidence: >-
      The DRHP-disclosed Rs 19,814 crore live loan book on the Moneyview platform is not split publicly between WFPL
      on-balance-sheet originations and partner-lender LSP originations, even though WFPL 9M FY26 disbursal of Rs
      5,429.6 crore is reported.
    whyItMatters: >-
      Without an explicit on-book vs off-book split the credit-quality, DLG exposure, and capital-adequacy questions on
      WFPL cannot be sized precisely.
    diligencePath: >-
      Request the SEBI-final RHP breakdown of platform AUM by funding source and the WFPL standalone balance sheet
      alongside the lender-wise sourcing mix.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: app-store-metrics
    missingEvidence: >-
      The Google Play Store and Apple App Store URLs for the Moneyview app returned 404 during the research run, so the
      live 4.8-star rating, downloads count, and review count rely on secondary review-site summaries rather than the
      official storefront listing.
    whyItMatters: >-
      Live app-store metrics are the most direct customer-quality signal for a mass-market mobile-first fintech; a stale
      source weakens corroboration of the 50 million+ downloads claim.
    diligencePath: >-
      Re-fetch the Google Play store entry using an alternate browser profile and corroborate with the company's own
      app-store metric dashboard during a management meeting.
