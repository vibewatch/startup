      - QO022
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Public reviewed sources do not reconcile FACE's Rs 1.39 lakh crore digital NBFC outstanding (Dec 2025) with
      IMARC's US$157 billion India personal-loan TAM (2025); the two numbers describe different perimeters (digital NBFC
      stock vs all personal loans) and cannot be merged into a single TAM/SAM/SOM stack without methodology adjustment.
    whyItMatters: >-
      Without a reconciled definition, share-of-market read for Moneyview against the broader TAM remains an
      approximation and any single-number TAM claim risks being misleading.
    diligencePath: >-
      Source the FACE methodological appendix and reconcile against IMARC's personal-loan segmentation; cross-check
      against CIBIL TransUnion / Equifax retail-credit reports.
