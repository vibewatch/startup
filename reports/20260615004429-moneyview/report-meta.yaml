  productSummary: Moneyview offers personal loans, business loans, cards, BNPL-style credit, insurance distribution, digital gold, UPI-linked payments, and free CIBIL monitoring through an app-first interface.
  customerFocus: Mass-market Indian consumers, especially Tier-II/III and thin-file borrowers seeking unsecured credit and adjacent financial services.
  businessModel: 'Hybrid LSP plus captive-NBFC model: Moneyview earns partner-lender fees and commissions, carries some on-book exposure through Whizdm Finance, and increasingly cross-sells insurance, payments, and other consumer-finance products.'
  stage: Pre-IPO
  fundingStatus: More than $230M raised across multiple rounds from Accel, Nexus, Tiger Global, Apis, Ribbit, Winter Capital, and others; last private mark around $1.2B before the March 2026 IPO filing.
