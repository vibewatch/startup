companyProfile:
  summary: Moneyview is a Bengaluru-founded Indian fintech that scaled from a credit-score and personal-loan app into a multi-product consumer-finance platform spanning personal loans, business loans, cards, insurance, digital gold, payments, and home-loan referrals. The company combines a capital-light Lending Service Provider model with its own NBFC, Whizdm Finance, and reached unicorn status before filing for a March 2026 IPO.
  foundedDate: '2014-01-01'
  founders:
