  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ltv-to-cac
      missingEvidence: >-
        Cohort-level LTV-to-CAC is not publicly disclosed; without it the Rs 426.5 cr FY25
        ad spend cannot be calibrated against borrower lifetime value or compared like-for-
        like with KreditBee / Fibe ad efficiency.
      whyItMatters: >-
        IPO-grade conviction on the GTM motion requires LTV-to-CAC clarity; absent disclosure
        the cohort economics rely on inference rather than measured data.
      diligencePath: >-
        Request Moneyview cohort retention and revenue-per-cohort data during IPO bid; cross-
        check against fintech-peer benchmarks in the SEBI-final RHP.
      relatedQuestionRefs:
        - QI007
        - QI024
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: material
      topic: dlg-cohort
      missingEvidence: >-
        DLG drawdown trigger and historical realisation rate by partner cohort are disclosed
        only at aggregate level (Rs 321.7 cr expense, Rs 847 cr outstanding); cohort-level
        history would calibrate stress tests on the DLG framework reset.
      whyItMatters: >-
        Pseudo-on-book risk under DLG is the structural reason finance and impairment costs
        tripled in FY25; without cohort history the stress-test scenarios remain
        approximate.
      diligencePath: >-
        Request DLG historical drawdown by partner and vintage cohort during IPO diligence;
        cross-check with RBI guidance on DLG-cap calibration.
      relatedQuestionRefs:
        - QI011
        - QI023
        - QI024
      relatedTableRefs:
        - TI004
    - type: conflicting-data
      severity: minor
      topic: 9m-net-profit-print
      missingEvidence: >-
        Two public 9M FY26 net-profit prints exist — Rs 209.7 cr per harro.com (DRHP-
        sourced) and Rs 245 cr per TNIE; the reconciliation between the two has not been
        published.
      whyItMatters: >-
        Annualised FY26 net-profit ranges depend on which 9M print is the anchor; using
        the conservative Rs 209.7 cr produces a ~Rs 280 cr FY26 annualised estimate vs
        ~Rs 327 cr from the Rs 245 cr print.
      diligencePath: >-
        Wait for SEBI-final RHP to publish audited 9M FY26 prints; cross-check against
        Inc42 / Entrackr quarterly summaries once available.
