  - id: TI005
    title: Public financial gaps table
    columns:
      - gap
      - status
      - basis for inclusion
      - diligence path
    rows:
      - - Cohort-level LTV-to-CAC
        - Not publicly disclosed
        - Without LTV-to-CAC, the Rs 426 cr ad spend cannot be calibrated against borrower lifetime value.
        - Request Moneyview cohort retention and revenue-per-cohort data during IPO bid process.
      - - Top-10 partner renewal calendar and revenue share per partner
        - Not publicly disclosed
        - Partner concentration (37-47% of revenue) is timed by renewals, but the calendar is private.
        - Request redacted top-10 partner-contract renewal schedule; cross-check against IPO RHP.
      - - DLG drawdown trigger and historical realisation rate
        - Aggregates only; partner-level not disclosed
        - DLG of Rs 321.7 cr in FY25 is an aggregate; realisation history would calibrate stress tests.
        - Request DLG historical drawdown by partner during IPO due diligence.
      - - Gross-margin equivalent (revenue less direct credit cost)
        - Not separately reported
        - Inferred 50-60% in section text, but no audited gross-margin line is published.
        - Reconcile against IFRS-comparable Indian NBFC peer gross-margin disclosures (Bajaj Finance).
      - - IPO price band and use-of-funds breakdown
        - DRHP filed; price band not yet announced
        - Without price band, post-money valuation is undetermined.
        - Wait for SEBI approval and final RHP / price band announcement.
      - - Cohort-level credit performance (vintage)
        - Aggregated only; vintage-level not in DRHP summaries reviewed
        - Vintage cohort performance would calibrate the Rs 246 cr write-off severity.
        - Request vintage / cohort-level credit performance during IPO diligence.
      - - Inferred EBITDA bridge from prior years
        - FY25 EBITDA Rs 698 cr disclosed; FY24 not separately reported in coverage reviewed
        - Without prior-year EBITDA, margin trajectory is partly inferred.
        - Request comparative EBITDA from MCA / RoC filings (Tofler / Zauba data).
      - - Use-of-funds detail
        - Generic disclosed; line-by-line not yet public
        - General corporate purposes + WFPL capital injection mentioned; mix not quantified.
        - Wait for RHP use-of-funds detail; cross-check against fintech IPO benchmarks.
    notes: >-
      Gaps reflect the public-record financial coverage available pre-RHP filing. Several
