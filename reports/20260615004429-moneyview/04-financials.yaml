callouts:
  - calloutType: strength
    title: Capital-light revenue base with multi-year profitability
    body: >-
      Moneyview has been profitable since FY22 (Rs 17.7 cr) and has grown net profit to
      Rs 240.3 cr in FY25 and Rs 209.7 cr in 9M FY26 while expanding revenue at ~74% YoY in
      FY25. The 63% LSP-fee mix indicates a capital-light core that scales with origination
      volume without consuming own-balance-sheet equity per loan.
    claimRefs:
      - CI002
      - CI005
      - CI031
  - calloutType: risk
    title: Finance, impairment, and DLG costs tripled in FY25
    body: >-
      Finance costs (Rs 370 cr), impairment and write-offs (Rs 346 cr including Rs 246 cr
      write-offs), and DLG expense (Rs 321.7 cr) each approximately tripled YoY in FY25.
      Together these three lines absorbed Rs 1,038 cr — about 44% of FY25 revenue — and are
      the structural reason net margin compressed from ~12.7% in FY24 to ~10.3% in FY25.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI020
  - calloutType: insight
    title: 9M FY26 revenue already matches FY25 full year
    body: >-
      9M FY26 operating revenue of Rs 2,373 cr equals the entire FY25 revenue of Rs 2,339 cr
      in just nine months. Annualised, that implies a FY26 run-rate of approximately
      Rs 3,164 cr — a 35% YoY trajectory even after the FY25 print already grew 74%. EBITDA
      margin in 9M FY26 (~31.5%) is up modestly versus FY25 (~30%).
    claimRefs:
      - CI007
      - CI022
