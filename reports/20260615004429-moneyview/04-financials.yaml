runDate: '2026-06-15'
company:
  name: Moneyview
chapter:
  number: 4
  title: Financials
  summary: >-
    Moneyview Limited reported FY25 revenue of Rs 2,339 crore (up 74% YoY), net profit of
    Rs 240.3 crore (up 40% YoY) and EBITDA of Rs 698 crore on a capital-light Lending Service
    Provider (LSP) and Whizdm Finance NBFC stack; 9M FY26 (Apr-Dec 2025) added Rs 2,373 crore
    revenue, Rs 748.6 crore EBITDA and Rs 209.7 crore net profit per the March 2026 DRHP.
    Revenue mix in FY25 split roughly 63% fees and commissions / 34% interest income /
    3% other; unit economics ran at ~Rs 0.88 of expense per Rs 1 of revenue. Capital
    intensity is rising — finance costs tripled to Rs 370 crore, impairment tripled to
    Rs 346 crore (including Rs 246 crore of write-offs), and DLG expense was Rs 321.7 crore —
    against Rs 1,067.7 crore of cash and Rs 1,201 crore of non-current borrowings. The
    Rs 1,500 crore fresh-issue tranche of the Rs 3,000 crore IPO is the next-round trigger.
sections:
  - id: revenue-model-and-mix
    title: Revenue streams, pricing model, and revenue mix
    body: >-
      Moneyview earns revenue through three primary streams. The first and largest is fees
      and commissions earned as a Lending Service Provider (LSP) — origination fees, processing
      fees, and revenue-share commissions paid by 15+ partner lenders (Aditya Birla Capital,
      Northern Arc, Vivriti Capital, Oxyzo and others) for personal loans, business loans, and
      adjacent products that Moneyview originates on its platform; this stream contributed
      approximately Rs 1,486.8 crore of FY25 revenue (~63% of the Rs 2,339 crore total). The
      second is interest income earned on the on-book loan portfolio held by Moneyview's wholly-
      owned NBFC, Whizdm Finance Private Limited (WFPL); FY25 interest income was approximately
      Rs 789 crore (~34%). The third is fee revenue from insurance distribution (under IRDAI
      corporate-agent licence CA0925), digital-gold accumulation, UPI payments adjacency, and
      credit-score services, totalling approximately Rs 63.3 crore in FY25 (~3%). The pricing
      model is hybrid: LSP fees scale with disbursement volume and partner-specific revenue-
      share schedules; WFPL on-book yields are governed by published APR bands starting at
      16% per annum for personal loans on tenures of 3-60 months. Total income (revenue from
      operations plus other income of Rs 399.4 crore) reached approximately Rs 2,738.5 crore
      in FY25 per Inc42's financial summary, while Entrackr and The Head and Tale corroborated
      the Rs 2,339 crore operating revenue print. The 9M FY26 print of Rs 2,373 crore
      operating revenue effectively matches the entire FY25 print in nine months — a run-rate
      that annualises to approximately Rs 3,164 crore.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-and-unit-economics
    title: GTM motion, sales efficiency, and unit economics
    body: >-
      Moneyview's go-to-market is app-first and performance-marketing-led. The Android app
      with 50 million+ cumulative installs and a 4.8-star Google Play rating is the dominant
      acquisition surface, supplemented by SEM, partner referrals from BankBazaar and
      Paisabazaar-style aggregators, and 18,400+ pincode coverage that allows organic
      Tier II/III discovery. FY25 advertising and promotional spend was approximately
      Rs 426.5 crore — about 20% of total expenses — anchoring a high-velocity, low-touch
      acquisition motion that compares with KreditBee and Fibe's playbook. Unit economics
      ran at approximately Rs 0.88 of expense per Rs 1 of revenue in FY25 (Rs 2,059.3 crore
      total expense against Rs 2,339 crore revenue), giving an operating margin band that
      supports the reported Rs 698 crore EBITDA. Sales-efficiency proxies in the absence of
      a disclosed CAC include the monetised-user conversion (9.73 million monetised users out
      of 125.49 million registered, ~7.8% conversion as of December 2025) and the user growth
      rate of 36.20% annually; the Rs 426 crore ad spend translates to roughly Rs 187 per
      registered user incremental in FY25. Channel economics for the LSP stream are advantaged
      by the lack of own balance-sheet capital requirement on each origination; for the WFPL
      on-book stream, channel economics are bounded by the NBFC capital adequacy floor of 15%
      that RBI mandates. Cross-sell economics across cards, insurance, digital gold, BNPL, and
      EWA lift LTV on already-acquired users at near-zero incremental CAC, but a disclosed
      cohort LTV-to-CAC has not been published.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: cost-structure-and-margin
    title: Cost structure, margin drivers, and impairment
    body: >-
      The FY25 expense base of Rs 2,059.3 crore breaks down as follows. The single largest
      line is advertising and promotional spend at Rs 426.5 crore (~21% of expenses).
      Finance costs were Rs 370 crore — approximately tripling from FY24 levels — reflecting
      higher borrowings to fund the WFPL on-book book that disbursed Rs 5,429.6 crore in 9M
      FY26 (a 38% jump over FY25's Rs 3,933 crore). Impairment on portfolio loans and write-
      offs totalled Rs 346 crore in FY25 — again roughly tripling YoY — including Rs 246 crore
      of explicit write-offs. Default Loss Guarantee (DLG) expense, the cash outflow Moneyview
      books against credit performance of partner-lender originations, was Rs 321.7 crore in
      FY25 with DLG outstanding of Rs 847 crore by 9M FY26. Employee benefit expenses were
      Rs 222.5 crore (up 42%), and outsourcing service costs were Rs 196.6 crore. Despite the
      tripling of finance and impairment costs, FY25 net profit reached Rs 240.3 crore (up
      from Rs 171.1 crore in FY24, Rs 162.6 crore in FY23, and Rs 17.7 crore in FY22 — the
      company's first profitable year after a Rs 47 crore loss in FY21). Net margin in FY25
      was approximately 10.3%, compressed from approximately 12.7% in FY24 because impairment
      and finance costs grew faster than revenue. EBITDA margin in 9M FY26 was approximately
      31.5% (Rs 748.6 crore on Rs 2,373 crore), indicating margin expansion despite continued
      growth investment. Gross margin in a strict accounting sense is not separately reported
      because Moneyview is not a goods company; the closest analogue is revenue less
      impairment and DLG expense, which gives an inferred ~50-60% lend-margin in FY25.
    claimRefs:
