callouts:
  - calloutType: strength
    title: Cross-sell stack on a single KYC and AA consent surface
    body: >-
      Eleven product modules running off the same login, KYC, and Account Aggregator consent
      surface make Moneyview a platform rather than a portfolio of disjoint apps. The cross-
      sell stack lifts LTV on already-acquired users at near-zero incremental CAC.
    claimRefs:
      - CE007
      - CE008
      - CE012
      - CE014
  - calloutType: strength
    title: Regulatory and security trust posture
    body: >-
      ISO 27001:2022 certified ISMS, IRDAI corporate-agent licence CA0925, RBI Digital Lending
      Guidelines compliance, and the WFPL NBFC's RBI 15% CAR floor combine to give Moneyview
      a verifiable trust-posture moat that direct LSP / NBFC peers do not all publish.
    claimRefs:
      - CE018
      - CE019
      - CE028
      - CE030
  - calloutType: risk
    title: AA framework can commoditise the underwriting edge
    body: >-
      The Account Aggregator framework makes consented bank-statement data programmatically
      available to every regulated entity. As competitors build comparable thin-file models
      on the same primitives, the underwriting edge narrows over a 12-24 month horizon.
    claimRefs:
      - CE026
      - CE029
      - CE033
  - calloutType: risk
    title: Closed-stack disclosure limits independent architectural verification
    body: >-
      Moneyview does not publish a developer SDK, API documentation, or open-source
      contributions, so architectural claims rely on ISO certifications, regulator
      attestations, and the public app surface. Glassdoor employee reviews are the closest
      publicly available developer / engineering signal on organisational maturity.
    claimRefs:
      - CE034
      - CE035
