      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: deployment-and-roadmap
    title: Deployment, integration, reliability, and roadmap
    body: >-
      Deployment is consumer-facing Android-first via Google Play. The customer downloads the
      app, completes KYC, consents to Account Aggregator data sharing, applies for credit,
      and receives a disbursal into a bank account — typically end-to-end within minutes for
      repeat customers. Integration depth covers credit bureaus (CIBIL et al.), partner NBFC
      lenders for the LSP rail, AA framework for bank-statement aggregation, NPCI for UPI
      disbursements and collections, IRDAI insurers for insurance attach, and digital-gold
      providers for the gold module. Reliability is implied by the 4.8-star Google Play
      rating across 36 lakh+ reviews and the 50M+ install base; specific uptime SLAs are not
      publicly disclosed. Support runs through in-app channels with collections outsourcing
      that absorbed Rs 196.6 crore of FY25 expense. The product roadmap, inferred from FY25
      launches (credit cards, earned wage access) and DRHP context, points toward broader
      cross-sell into adjacent retail-finance categories rather than into B2B / wholesale
      lending. Home loans and LAP are distributed via referral today; whether they become
      direct on-book products depends on WFPL's capital adequacy headroom (RBI 15% CAR
      floor) and post-IPO equity injection.
    claimRefs:
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
    tableRefs:
      - TE005
  - id: differentiation-and-trust
    title: Differentiation, trust posture, and product / technical risks
    body: >-
      Moneyview's technology differentiation rests on four pillars. (1) The proprietary
      thin-file credit-scoring model, which sits on top of Account-Aggregator-fed bank-
      statement data and SMS / device signals; (2) the cross-sell stack, which lifts LTV at
      near-zero CAC across eleven modules on a single KYC; (3) regulatory and trust posture
      — ISO 27001:2022 certified ISMS, IRDAI corporate-agent licence CA0925, RBI Digital
      Lending Guidelines compliance for the LSP perimeter; and (4) distribution scale —
      18,400+ pincode coverage and 4.8-star Play rating. Product / technical risks are
      threefold. First, AA commoditisation: as bank-statement data becomes universally
      programmable via the AA framework, the underwriting edge narrows because competitors
      can build similar models on the same data primitives. Second, DLG-linked credit cost
      — the LSP capital-light claim is partially undone by Rs 321.7 crore of DLG expense in
      FY25 against a Rs 847 crore DLG outstanding at 9M FY26, which connects platform
      credit performance directly to balance-sheet outcomes. Third, the closed-stack
      disclosure surface — Moneyview does not publish a developer SDK or API documentation,
      so independent verification of architectural claims is limited to ISO certifications,
      RBI compliance attestations, and the public app surface. The Glassdoor employee
      review surface is the closest publicly available developer / engineering signal on
      organisational maturity.
    claimRefs:
