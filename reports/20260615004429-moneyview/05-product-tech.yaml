company:
  name: Moneyview
chapter:
  number: 5
  title: Product and Technology
  summary: >-
    Moneyview's product is a mobile-first, multi-product consumer financial platform — personal
    loans, business loans, credit cards (launched FY25), BNPL, insurance distribution under
    IRDAI corporate-agent licence CA0925, digital gold, UPI, free CIBIL score check, earned
    wage access (launched FY25), and a home-loan referral channel — running on an Android-first
    app with 50M+ installs and a 4.8-star rating. The technology stack is anchored by a
    proprietary credit-scoring model for thin-file / new-to-credit borrowers, Account
    Aggregator (AA) integration for consented bank-statement data, UPI/NPCI rails, 256-bit
    encryption with an ISO 27001:2022 certified ISMS, and RBI Digital Lending Guidelines
    (Sep 2022 + Nov 2024) compliance for the LSP perimeter. Differentiation rests on cross-
    sell breadth, thin-file underwriting, regulatory certifications, and a 18,400+ pincode
    coverage; product/technical risks include AA commoditisation of the underwriting edge,
    DLG-driven credit-cost exposure, and a closed-stack disclosure surface that limits
    independent verification of architecture choices.
sections:
  - id: product-definition
    title: Product definition in customer workflow terms
    body: >-
      A typical Moneyview user journey starts with an Android app install (the Android
      install base is 50 million+ per Indian press and Moneyview product disclosures), a
      free CIBIL credit-score check, identity and bank-account KYC, and a soft-quote for one
      of the lending products. The platform then routes the application either to Whizdm
      Finance Private Limited (WFPL), Moneyview's wholly-owned NBFC, for an on-book loan, or
      to one of 15+ partner lenders (Aditya Birla Capital, Northern Arc, Vivriti Capital,
      Oxyzo and others) under the Lending Service Provider (LSP) framework prescribed by the
      RBI Digital Lending Guidelines of September 2022 and reinforced by the November 2024
      update. The personal-loan product offers tickets of Rs 5,000-Rs 10 lakh on tenures of
      3-60 months at a published starting APR of 16%; the business-loan product offers up to
      Rs 5 lakh; the credit-card product launched in FY25; BNPL / Smart Pay covers small-
      ticket revolving credit; insurance is distributed under IRDAI corporate-agent licence
      CA0925; digital gold and UPI payments run inside the same app shell; the earned wage
      access product launched in FY25 routes salary advances. Home loans and loans against
      property are offered through a referral / distribution model rather than direct
      origination. The app surface unifies these flows under a single login and unified KYC,
      which is the customer-workflow definition of the product.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    tableRefs:
      - TE002
    figureRefs:
      - FE002
  - id: module-map
    title: Module, SKU, and product-line map
    body: >-
      Moneyview's product surface decomposes into eleven modules. (1) Personal loan — the
      anchor module, Rs 5K-Rs 10L at 16%+ APR. (2) Business loan — up to Rs 5L for sole
      proprietors. (3) Credit card — co-branded / own, launched FY25. (4) BNPL / Smart Pay
      — revolving short-tenure credit. (5) Insurance distribution — IRDAI CA0925 corporate-
      agent composite licence for life / health / motor. (6) Digital gold — in-app gold
      accumulation. (7) UPI payments — in-app UPI rails via NPCI. (8) CIBIL credit-score
      check — free, included as an acquisition surface. (9) Earned wage access — launched
      FY25 for salary-linked advances. (10) Home loans / LAP — distributed via referral, not
      direct origination. (11) Account-Aggregator-driven bank-statement aggregation — the
      data layer that underlies underwriting for several of the lending modules. Across the
      eleven modules, the company runs an internal proprietary credit-scoring engine for
      thin-file borrowers as a horizontal capability, plus shared KYC, eKYC video, and
      collections workflows. Each module shares the same login, KYC, and Account Aggregator
      consent surface — which is what makes the product a platform rather than a portfolio
      of disjoint apps.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
