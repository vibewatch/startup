      - TE001
    figureRefs:
      - FE004
  - id: architecture-and-operating-model
    title: Operating architecture — credit scoring, AA rails, UPI, security
    body: >-
      The operating architecture is mobile-first Android with API integrations into credit
      bureaus (CIBIL / TransUnion India and others), the Account Aggregator framework
      (governed by Sahamati and RBI master directions), and NPCI for UPI rails. Underwriting
      runs through a proprietary credit-scoring model trained on alternative data — bank-
      statement transactions, SMS / device signals, bill-payment history — to extend credit
      to thin-file and new-to-credit borrowers who fail traditional bureau-only models. The
      AA framework, which makes consented bank-statement data programmatically available to
      regulated entities, is integrated to lower the friction of pre-AA bank-statement
      uploads. UPI payments and disbursements run over NPCI rails — UPI is currently the
      dominant retail payment system in India. The security control surface is a 256-bit
      encryption layer plus an ISO 27001:2022 certified Information Security Management
      System (ISMS), which is the international standard for ISMS controls maintained by
      ISO/IEC. RBI compliance covers the Digital Lending Guidelines (Sep 2022 + Nov 2024) for
      LSP-NBFC contractual perimeter, fee pass-through and cooling-off period rules, and the
      DLG framework that defines how much partner-lender credit risk the LSP can warehouse.
      IRDAI compliance covers the corporate-agent composite licence CA0925 for insurance
      distribution. NBFC compliance covers the RBI Microfinance Directions of March 2022 for
      the smallest-ticket cohorts (although Moneyview's product mix sits above the MFI
      perimeter). The full architecture is closed-source and the company does not publish a
      developer SDK or API spec for third-party integrators.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
