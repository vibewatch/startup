        title: Milestone chronology and headline scale metrics
        blocks:
          - type: paragraph
            body: >-
              The Moneyview chronology runs from a 2014 founding as a personal-finance-tracking app (Whizdm), through a
              2017–2019 pivot into lending under the Moneyview brand, into a 2022 dual Series D / Series E build-out,
              the FY22 turn to profitability, the FY23–FY25 revenue compounding from ₹648.1 crore to ₹2,339 crore at
