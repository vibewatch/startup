      - number: '6.3'
        title: Named customer proof — borrower archetypes and partner-lender roster
        blocks:
          - type: paragraph
            body: >-
              Moneyview does not publish individually named borrower case studies in the DRHP or on its public website,
              which is normal for a high-volume consumer lender. Customer proof therefore takes three forms. First,
              aggregator-listed borrower eligibility on BankBazaar specifies minimum age 21, maximum age 57, minimum
              monthly income Rs 13,500 (Rs 25,000 in metros for some products), with personal-loan tickets from Rs 5,000
              to Rs 10 lakh and tenures 3-60 months — defining the upper / lower envelope of who the platform serves.
              Second, the Google Play review base of 36 lakh+ reviews at 4.8 stars across 50M+ installs is the largest
              single piece of customer evidence: it is anonymised but volume-validated, with the rating dominantly
              positive against KreditBee (~4.6★), Fibe (~4.5★) and other peers. Third, on the enterprise side, the named
              partner-lender roster (Aditya Birla Capital, Northern Arc, Vivriti Capital, Oxyzo, plus 11+ others not
              individually disclosed) and the insurer relationships under IRDAI corporate-agent licence CA0925 provide
              institutional customer proof — these are paying counterparties whose contractual presence is mentioned in
              the DRHP. No individually named borrower testimonial with verifiable outcome is in the public record;
              testimonials on the moneyview.in/about-us page are first-party and unverifiable.
