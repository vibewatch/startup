  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base, segmentation, and buyer / user / payer mapping
        blocks:
          - type: paragraph
            body: >-
              Moneyview operates a retail-only, B2C credit-distribution business. The product user is an Indian consumer
              who installs the Moneyview Android app, runs a free CIBIL credit-score check, and applies for a personal
              loan, business loan, credit card, BNPL line, insurance policy, digital-gold purchase, earned-wage advance,
              or home-loan referral. The payer is either the end borrower (who pays interest plus fees to the lender) or
              the partner lender / insurer (who pays Moneyview a sourcing fee or commission). The buyer of Moneyview's
              enterprise-side product — sourcing-and-underwriting as a service — is the partner lender (15+ lenders
              including Aditya Birla Capital, Northern Arc, Vivriti Capital, Oxyzo) and the insurer (IRDAI
              corporate-agent composite CA0925). Borrower segmentation as disclosed in the DRHP and aggregator pages
              tilts heavily to small-town India: 79% of users sit in Tier II / III / beyond, the platform claims 18,400+
              pincode coverage (~99.55% of India's pincodes), and 60%+ of sanctioned loan value goes to borrowers under
              35. Women borrowers account for ~18% of digital-NBFC sanctions industry-wide per RBI / FACE data, which is
              the closest available benchmark for Moneyview's mix. Geographic, age, and channel skew are corroborated
              across the DRHP, Inc42 profile, BankBazaar product review, and the IBEF / digital-NBFC market data; no
              SKU-level revenue mix by segment is publicly disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
