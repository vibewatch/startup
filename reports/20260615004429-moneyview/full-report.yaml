              Moneyview platform stood at ₹19,814 crore and WFPL disbursals in the nine months to December 2025 reached
              ₹5,429.6 crore, up 38 percent year-on-year. Adverse signals coexist with this scale: harro.com flagged in
              March 2026 that RBI regulatory uncertainty and rising loan defaults (impairment expense up roughly
