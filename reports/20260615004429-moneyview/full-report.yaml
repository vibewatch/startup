      - number: '4.5'
        title: Financial verdict — revenue quality, capital intensity, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is mixed. Approximately 63% of FY25 revenue is fees and commissions from third-party
              partner lenders — recurring with each origination but exposed to partner-concentration risk (top 10
              partners = 37.31% in 9M FY26, 46.82% in FY25, no exclusive contracts). The 34% interest-income stream is
              partly own-balance-sheet but partly DLG-backed pseudo-on-book risk. The 3% adjacency stream (insurance,
              digital gold, UPI) is incremental but small. Margin path is healthy at the EBITDA line (31.5% in 9M FY26
              vs ~30% in FY25) but pressured at the net line by the threefold jumps in finance and impairment costs.
              Capital intensity is moderate-and-rising: Rs 1,201 crore of non-current borrowings supports a Rs 19,814
              crore platform loan book (December 2025), implying significant off-balance-sheet leverage via partner
              lenders and DLG cover. Diligence blockers for IPO-grade financial conviction are (a) the lack of
              cohort-level LTV-to-CAC disclosure that would calibrate the Rs 426 crore ad spend against borrower
              lifetime value; (b) the lack of detailed disclosure on the renewal calendar and revenue-share schedule for
              the top-10 partner lenders; (c) opacity around the precise DLG drawdown trigger and historical realisation
              rates; and (d) the absence of a published gross-margin equivalent for cross-comparison with bank PL
              economics. The harro.com adverse analysis is the public-record adverse signal against an otherwise
              improving financial profile.
