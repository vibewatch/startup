              Capital, Internet Fund III, Crimson Winter, Lok Capital, Evolvence India Fund IV, NLI Strategic Venture
              Investment, TI JPNIN India Holdco, TI Platform SMRS SMA, and DI Investment, paired with a ₹1,500 crore
