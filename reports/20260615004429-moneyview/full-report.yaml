        blocks:
          - type: paragraph
            body: >-
              Moneyview has raised in excess of US$230 million across five priced equity rounds since inception,
              anchored by Accel India and Nexus Venture Partners in the early years and joined by Tiger Global
              Management, Apis Partners, Winter Capital, Evolvence India, Ribbit Capital, and Lok Capital in the growth
