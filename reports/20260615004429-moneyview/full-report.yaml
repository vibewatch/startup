      - number: '6.2'
        title: Adoption trajectory — registered users, monetised users, downloads, and disbursals
        blocks:
          - type: paragraph
            body: >-
              The adoption funnel runs from app install / registration → CIBIL score check → loan application →
              monetisation. As of December 2025 (9M FY26 cutoff), registered users / unique visitors reached 125.49
              million, up from 109.59 million in FY25 (14% nine-month growth, ~36% annualised). Monetised users (those
              who have purchased at least one product) reached 9.73 million in 9M FY26 from 7.45 million in FY25 (31%
              nine-month growth, ~41% annualised). Cumulative Google Play installs cross 50 million with 36 lakh+
              reviews at a 4.8-star average, the highest among India's top-five digital-lender apps. WFPL's own NBFC
              disbursals reached Rs 5,429.6 crore in 9M FY26 (38% over the full FY25 disbursal of Rs 3,933 crore). The
              loan-book outstanding on the Moneyview platform was Rs 19,814 crore in December 2025 across both WFPL
              on-book and partner-lender off-book exposure. Industry-average ticket size in Q1-Q3 FY26 ran Rs 15,493 (up
              18% YoY) and digital NBFCs as a category booked 10.9 crore loans worth Rs 1.06 lakh crore in FY25,
              providing the denominator for Moneyview's roughly 8-9% volume share of the digital-NBFC personal-loan
              pool. The monetisation-rate proxy — monetised / registered users — sits at ~7.8% in 9M FY26, a meaningful
              efficiency improvement from ~6.8% in FY25.
