      - number: '6.4'
        title: Retention, repeat usage, satisfaction, and durability of the cohort
        blocks:
          - type: paragraph
            body: >-
              Explicit retention disclosure is the largest single evidence gap for Moneyview's customer chapter. The
              DRHP does not publish net-revenue retention (NRR), gross-revenue retention (GRR), 30 / 60 / 90 / 180 day
              repeat-loan rates, or monthly-cohort repayment curves at the granularity an institutional investor would
              expect. What is reported is directional. (1) Monetised-user growth from 7.45 million (FY25) to 9.73
              million (9M FY26) implies a meaningful repeat-monetisation behavior because gross adds against the
              registered base are only 15.9 million in nine months, so a portion of the 2.28 million net-new monetised
              users are repeat buyers moving across categories. (2) 90-day DPD at the industry level fell to 1.9% in
              December 2025 from 3.3% in March 2023, indicating the cohort Moneyview underwrites has become more durable
              on the credit side. (3) The Google Play 4.8-star rating across 36 lakh+ reviews is a satisfaction proxy —
              high relative to peers, but reviews are inflated by post-disbursal survey nudges typical of
              consumer-fintech apps. (4) Average ticket size rising 18% YoY to Rs 15,493 suggests increasing wallet
              capture per borrower. (5) Adverse review themes (harro.com surfaces concerns over regulatory uncertainty
              and loan defaults) call out residual NPA volatility even with the FY25 write-off of Rs 246 crore behind
              the company. No cohort-level repeat-loan or NRR data is published.
            claimRefs:
              - CU022
