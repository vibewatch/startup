      - number: '4.3'
        title: Cost structure, margin drivers, and impairment
        blocks:
          - type: paragraph
            body: >-
              The FY25 expense base of Rs 2,059.3 crore breaks down as follows. The single largest line is advertising
              and promotional spend at Rs 426.5 crore (~21% of expenses). Finance costs were Rs 370 crore —
              approximately tripling from FY24 levels — reflecting higher borrowings to fund the WFPL on-book book that
              disbursed Rs 5,429.6 crore in 9M FY26 (a 38% jump over FY25's Rs 3,933 crore). Impairment on portfolio
              loans and write- offs totalled Rs 346 crore in FY25 — again roughly tripling YoY — including Rs 246 crore
              of explicit write-offs. Default Loss Guarantee (DLG) expense, the cash outflow Moneyview books against
              credit performance of partner-lender originations, was Rs 321.7 crore in FY25 with DLG outstanding of Rs
              847 crore by 9M FY26. Employee benefit expenses were Rs 222.5 crore (up 42%), and outsourcing service
              costs were Rs 196.6 crore. Despite the tripling of finance and impairment costs, FY25 net profit reached
              Rs 240.3 crore (up from Rs 171.1 crore in FY24, Rs 162.6 crore in FY23, and Rs 17.7 crore in FY22 — the
              company's first profitable year after a Rs 47 crore loss in FY21). Net margin in FY25 was approximately
              10.3%, compressed from approximately 12.7% in FY24 because impairment and finance costs grew faster than
              revenue. EBITDA margin in 9M FY26 was approximately 31.5% (Rs 748.6 crore on Rs 2,373 crore), indicating
              margin expansion despite continued growth investment. Gross margin in a strict accounting sense is not
              separately reported because Moneyview is not a goods company; the closest analogue is revenue less
              impairment and DLG expense, which gives an inferred ~50-60% lend-margin in FY25.
