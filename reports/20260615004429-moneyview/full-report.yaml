  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              A typical Moneyview user journey starts with an Android app install (the Android install base is 50
              million+ per Indian press and Moneyview product disclosures), a free CIBIL credit-score check, identity
              and bank-account KYC, and a soft-quote for one of the lending products. The platform then routes the
              application either to Whizdm Finance Private Limited (WFPL), Moneyview's wholly-owned NBFC, for an on-book
              loan, or to one of 15+ partner lenders (Aditya Birla Capital, Northern Arc, Vivriti Capital, Oxyzo and
              others) under the Lending Service Provider (LSP) framework prescribed by the RBI Digital Lending
              Guidelines of September 2022 and reinforced by the November 2024 update. The personal-loan product offers
              tickets of Rs 5,000-Rs 10 lakh on tenures of 3-60 months at a published starting APR of 16%; the
              business-loan product offers up to Rs 5 lakh; the credit-card product launched in FY25; BNPL / Smart Pay
              covers small- ticket revolving credit; insurance is distributed under IRDAI corporate-agent licence
              CA0925; digital gold and UPI payments run inside the same app shell; the earned wage access product
              launched in FY25 routes salary advances. Home loans and loans against property are offered through a
              referral / distribution model rather than direct origination. The app surface unifies these flows under a
              single login and unified KYC, which is the customer-workflow definition of the product.
