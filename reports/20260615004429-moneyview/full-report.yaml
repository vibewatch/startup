            body: >-
              Moneyview's go-to-market is app-first and performance-marketing-led. The Android app with 50 million+
              cumulative installs and a 4.8-star Google Play rating is the dominant acquisition surface, supplemented by
              SEM, partner referrals from BankBazaar and Paisabazaar-style aggregators, and 18,400+ pincode coverage
              that allows organic Tier II/III discovery. FY25 advertising and promotional spend was approximately Rs
              426.5 crore — about 20% of total expenses — anchoring a high-velocity, low-touch acquisition motion that
              compares with KreditBee and Fibe's playbook. Unit economics ran at approximately Rs 0.88 of expense per Rs
              1 of revenue in FY25 (Rs 2,059.3 crore total expense against Rs 2,339 crore revenue), giving an operating
              margin band that supports the reported Rs 698 crore EBITDA. Sales-efficiency proxies in the absence of a
              disclosed CAC include the monetised-user conversion (9.73 million monetised users out of 125.49 million
              registered, ~7.8% conversion as of December 2025) and the user growth rate of 36.20% annually; the Rs 426
              crore ad spend translates to roughly Rs 187 per registered user incremental in FY25. Channel economics for
              the LSP stream are advantaged by the lack of own balance-sheet capital requirement on each origination;
              for the WFPL on-book stream, channel economics are bounded by the NBFC capital adequacy floor of 15% that
              RBI mandates. Cross-sell economics across cards, insurance, digital gold, BNPL, and EWA lift LTV on
              already-acquired users at near-zero incremental CAC, but a disclosed cohort LTV-to-CAC has not been
