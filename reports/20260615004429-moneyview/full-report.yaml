      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Moneyview is no longer a pure venture-style story stock
            body: >-
              The company’s revenue, profit, and DRHP put it in a stronger position than many private fintech IPO
              candidates. That is why the call is fair / track rather than stretched / pass.
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV024
          - type: callout
            title: The multiple must discount DLG and partner concentration
            body: >-
              Even if public markets accept the growth and profit story, they are unlikely to pay premium-lender
              valuations while DLG and counterparty concentration still shadow the equity case.
            calloutType: risk
            claimRefs:
              - CV022
              - CV025
              - CV035
          - type: callout
            title: Best setup is disciplined watchlisting, not chasing upside
            body: >-
              The right upgrade path is better price or better disclosure. Without one of those, a fair company can
              still be an indifferent stock.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV037
