      - number: '6.5'
        title: Expansion, cross-sell, partner concentration, and channel risk
        blocks:
          - type: paragraph
            body: >-
              Expansion has two engines. The first is cross-sell within the existing user base — the addition of credit
              cards and earned wage access in FY25, on top of personal loans, business loans, BNPL, insurance, digital
              gold, UPI payments, and home-loan referrals, lifts revenue per monetised user without proportional CAC.
              The second is geographic widening — the 18,400+ pincode footprint already covers ~99.55% of pincodes, so
              further geographic expansion within India is largely depth (deeper Tier IV / V penetration) rather than
              breadth. Concentration risk on the customer side is structurally low because the book is granular retail —
              no single borrower exceeds a meaningful share of the Rs 19,814 crore loan book. Concentration risk on the
              partner-lender side is material: the top 10 financial partners contributed 37.31% of revenue in 9M FY26
              (down from 46.82% in FY25), and no exclusive contracts are in place. Channel risk is single-vector —
              almost all monetisation funnels through the Android app, with no meaningful web-app, branch, or DSA-driven
              volume reported; if Google Play ranking, app-store trust signals, or Android-platform policy shift
              adversely, monetisation volume is directly at risk. Adverse — partner-lender contractual renewals and
              DLG-cap changes (the RBI restored DLG framework for NBFCs in February 2026 but retained tighter coverage
              caps) are the most monitorable concentration kill triggers for the customer-economic engine.
            claimRefs:
