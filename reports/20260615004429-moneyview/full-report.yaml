    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Moneyview Limited is a Bengaluru-headquartered consumer fintech company that operates a capital-light
              digital lending platform. The legal entity, originally incorporated in 2014 as Whizdm Innovations Private
              Limited and later renamed Moneyview Private Limited, converted to a public limited company called
              Moneyview Limited in June 2025 in preparation for its initial public offering. The registered office is at
              17/1, 1st and 2nd Floor, The Address Building, Outer Ring Road, Marathahalli, Kadubeesanahalli, Bangalore
              – 560103, Karnataka, as disclosed in the company's own terms and conditions page. Moneyview positions
              itself primarily as a Lending Service Provider (LSP) that originates and services credit on behalf of 15+
              partner lenders such as Aditya Birla Capital, Northern Arc, Vivriti Capital, and Oxyzo, and also operates
              its own RBI-licensed NBFC arm, Whizdm Finance Private Limited (WFPL), for direct on-balance-sheet lending.
              The company is ISO 27001:2022 certified and holds an IRDAI corporate-agent (composite) licence under
              registration number CA0925, which underpins its insurance-distribution business. The product surface today
              covers personal loans, business loans, home loans, credit cards, Buy Now Pay Later, insurance, digital
              gold, UPI payments, and free CIBIL credit-score monitoring.
