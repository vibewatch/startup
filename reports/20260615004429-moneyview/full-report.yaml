  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing model, and revenue mix
        blocks:
          - type: paragraph
            body: >-
              Moneyview earns revenue through three primary streams. The first and largest is fees and commissions
              earned as a Lending Service Provider (LSP) — origination fees, processing fees, and revenue-share
              commissions paid by 15+ partner lenders (Aditya Birla Capital, Northern Arc, Vivriti Capital, Oxyzo and
              others) for personal loans, business loans, and adjacent products that Moneyview originates on its
              platform; this stream contributed approximately Rs 1,486.8 crore of FY25 revenue (~63% of the Rs 2,339
              crore total). The second is interest income earned on the on-book loan portfolio held by Moneyview's
              wholly- owned NBFC, Whizdm Finance Private Limited (WFPL); FY25 interest income was approximately Rs 789
              crore (~34%). The third is fee revenue from insurance distribution (under IRDAI corporate-agent licence
              CA0925), digital-gold accumulation, UPI payments adjacency, and credit-score services, totalling
              approximately Rs 63.3 crore in FY25 (~3%). The pricing model is hybrid: LSP fees scale with disbursement
              volume and partner-specific revenue- share schedules; WFPL on-book yields are governed by published APR
              bands starting at 16% per annum for personal loans on tenures of 3-60 months. Total income (revenue from
              operations plus other income of Rs 399.4 crore) reached approximately Rs 2,738.5 crore in FY25 per Inc42's
              financial summary, while Entrackr and The Head and Tale corroborated the Rs 2,339 crore operating revenue
              print. The 9M FY26 print of Rs 2,373 crore operating revenue effectively matches the entire FY25 print in
              nine months — a run-rate that annualises to approximately Rs 3,164 crore.
