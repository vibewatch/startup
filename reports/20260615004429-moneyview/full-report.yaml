      - number: '2.4'
        title: Growth drivers, adoption constraints, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The two-sided growth story is set against meaningful constraints. On the driver side: rising smartphone
              and UPI penetration, the account-aggregator framework that makes consented bank statement data
              programmatically available, India's large under-35 cohort, and the systematically lower per-ticket
              cost-to-serve of mobile origination versus bank branches. On the constraint side: the RBI Digital Lending
              Guidelines of September 2022 (and the November 2024 reiteration) tightened pass-through of fees, mandated
              cooling-off periods, and formalised the LSP-NBFC contractual perimeter, raising compliance overhead for
              app-only lenders; the RBI Microfinance Directions of March 2022 set the household-income and EMI-
              to-income caps that bound entry into the smallest-ticket segments; and the February 2026 RBI decision
              restoring the Default Loss Guarantee framework for NBFCs after a period of tightening creates structural
              uncertainty about how much risk LSPs like Moneyview can warehouse on behalf of partner lenders. Adverse
              adoption signals include FACE-reported 90-day DPD (delinquency) of 1.9% as of December 2025 — improved
              from 3.3% in March 2023 but still meaningful — and the harro.com analysis of Moneyview's DRHP, which flags
              regulatory uncertainty and loan defaults as direct headwinds. Fintech-led credit deepening (IBEF) and 80%
              online-market share of digital loans (Business Today) underscore that the share-of-flow battle for new
              loan originations is already digital-first, not pending digital adoption.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
