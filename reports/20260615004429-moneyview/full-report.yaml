      - Threshold / event
      - Action implication
    rows:
      - - DLG stress
        - DLG outstanding / fresh issue ratio
        - Remains above 1.0x after IPO cash is deployed
        - Move to pass or demand much lower entry multiple
      - - Partner concentration
        - Top-ten partner revenue share
        - Returns above 40% or a top partner exits
        - Underwrite lower growth and higher counterparty discount
      - - Asset quality
        - Annualized bad-loan rate vs industry
        - Moves above industry benchmark or worsens sharply for two quarters
        - Assume higher DLG and impairment drag
      - - Regulatory change
        - RBI circular / guidance
        - Any tightening of LSP outsourcing, BNPL fund flows, or DLG treatment
        - Cut valuation range and reassess adjacency TAM
      - - Operational control
        - Disclosed security/fraud events
        - Another material incident or unexplained control loss
        - Increase governance discount and pause underwriting
      - - IPO quality
        - Price band / subscription outcome
        - Needs aggressive discounting or weak institutional book
        - Treat public-market appetite as a negative read-through
      - - Disclosure quality
        - Quarterly cohort / partner transparency
        - No better post-IPO disclosure on DLG realization or partner concentration
        - Keep recommendation at track rather than upgrade
