  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Unicorn mark evidence and quality of the valuation signal
        blocks:
          - type: paragraph
            body: >-
              The best current private-market anchor for Moneyview is the September 2024 funding round that pushed the
              company to roughly Rs 10,086 crore, or about $1.2 billion, after the issue of 60,23,382 shares at Rs 64.15
              each. Entrackr, Entrepreneur India, and The Times of India all point to the same post-allotment number and
              to the same principal round participants, Accel India and Nexus Ventures. That is strong enough to treat
              the unicorn mark as real, but not strong enough to treat it as fully discovered fair value. The round
              itself was small—only about Rs 38.64 crore, or $4.65 million—which means the valuation uplift was
              established on a limited amount of primary capital rather than a large, price-setting institutional
              financing. The step-up from the roughly $900 million 2022 / 2023 context to the $1.2 billion 2024 mark is
              also meaningful but not euphoric; it implies a one-third move, not a moonshot. In practice that makes the
              signal more credible than a hype-round but less authoritative than a large crossover or a completed IPO
              book. Investors should therefore use the unicorn mark as a central reference point, but not as a
              ceiling-defying proof that public markets must pay more.
