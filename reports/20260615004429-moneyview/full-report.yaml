      - - Repayment cohorts
        - Vintage loss curves, repeat-borrow rates, and segment-level credit performance
        - Separates temporary profit from cycle-tested unit economics
        - Credit-diligence pack from management
      - - Channel economics
        - CAC, LTV, and Android / performance-marketing dependence
        - Public investors will care about growth quality, not just volume
        - Marketing analytics diligence
      - - Public-company controls
        - Security remediation, incident response, and governance process maturity
        - Post-listing risk events can compress multiples quickly
        - Security / governance workstream review
