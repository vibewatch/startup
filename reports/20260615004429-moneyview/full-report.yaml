  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The market in scope is the digital, mobile-first, RBI-regulated consumer-credit market in India,
              comprising unsecured personal loans, small-ticket Buy Now Pay Later (BNPL), app-originated credit cards,
              micro and small business loans, and the distribution layer for consumer insurance and digital gold that
              runs alongside lending apps. Included spend covers every loan disbursed through a digital interface to
              retail and self-employed borrowers, plus commission-earning insurance and gold distribution that
              piggybacks on the lending product. Excluded from the boundary are wholesale corporate lending,
              RBI-regulated microfinance loans that follow MFI Directions, traditional bank branch-originated personal
              loans, secured retail lending such as auto and gold loans that depend on physical collateral handling, and
              informal moneylending. Status-quo substitutes for Moneyview's product set are traditional banks (HDFC,
              ICICI, SBI personal-loan branches), the credit-card arms of large banks, salary advances from employers,
              gold loans (a long-standing substitute in small towns), and informal lenders; adjacencies that the same
              Moneyview user might switch to include cards-only fintechs such as Slice, account-aggregator-led credit
              lines from neobanks, and PPI-led wallets such as MobiKwik.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
