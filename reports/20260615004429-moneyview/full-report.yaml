  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and thesis-breaker conditions
        blocks:
          - type: paragraph
            body: >-
              Moneyview is no longer a proof-of-concept fintech; it is a scaled lender-orchestrator with real profits,
              real partner distribution, and a filed IPO. That changes the risk frame. The core question is not whether
              consumers want digital credit, but whether Moneyview’s capital-light architecture can remain capital-light
              once DLG obligations, partner concentration, and RBI rule changes are fully stressed. The fresh issue
              itself makes the point: more than two-thirds of primary proceeds are earmarked for DLG support and NBFC
              capital rather than purely offensive growth. That is not fatal—many successful lenders periodically
              reinforce the balance sheet—but it means the public-market thesis is sensitive to cost of risk and funding
              structure in a way a software marketplace is not. The practical thesis-breakers are visible and
              measurable: DLG outstanding that does not normalize after the IPO, top-ten partner concentration moving
              back above 40%, bad-loan rates moving above the industry, non-exclusive partners shifting share to larger
              fintechs, or RBI tightening LSP and BNPL rules again. The strongest mitigants are the company’s current
              profitability, official filings, and the fact that some credit metrics are still better than the industry
              average. Even so, the residual exposure is unquestionably higher than the headline “capital-light fintech”
              label suggests.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
