  - id: TR002
    title: Regulatory / legal risk register
    columns:
      - Date
      - Event
      - What changed
      - Moneyview transmission path
      - Residual risk
    rows:
      - - 2022-09
        - RBI digital-lending guidelines
        - Borrower disclosures, direct fund flows, and lender accountability tightened
        - Reduced room for gray-zone fintech structures and tightened LSP conduct requirements
        - Legacy product assumptions can no longer be relied on
      - - 2023-06
        - RBI DLG guidelines
        - Formalized DLG provider eligibility, cap structure, and disclosure expectations
        - Moneyview could keep using DLG but under more explicit limits and reporting norms
        - DLG remains legally permitted but economically bounded
      - - 2025-05
        - RBI Digital Lending Directions, 2025
        - Consolidated DLG, RE-LSP, DLA reporting, and data rules into one operative framework
        - Moves compliance from patchwork interpretation to enforceable operating manual
        - Any future tightening lands directly on economics and controls
      - - 2025-2026
        - BNPL / wallet-flow enforcement
        - Borrower-to-RE disbursal and repayment discipline became less optional
        - Raises cost and friction for loosely structured credit-adjacent products
        - Adjacency monetization can be slower or smaller than product marketing suggests
      - - 2025-2026
        - DPDP and data-governance regime hardening
        - Consent, purpose limitation, and misuse penalties became more material
        - Apps using device, behavioral, or bureau-linked scoring face higher process burden
        - Data incidents can become governance and reputational events
      - - 2026-03 onward
        - Public-company disclosure standard
        - IPO and post-IPO scrutiny raise expectations around DLG, partner, and incident disclosure
        - Risk events that were once private become valuation and governance questions
        - Public-market multiple can compress on disclosure surprises
    notes: >-
      Timeline-style register of the highest-signal regulatory and legal shifts affecting Moneyview’s RE-LSP, DLG, BNPL,
      and disclosure obligations.
