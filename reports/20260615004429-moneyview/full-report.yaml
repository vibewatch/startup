              - CV023
              - CV025
              - CV027
              - CV028
              - CV030
              - CV040
      - number: '8.4'
        title: Bear, base, and bull scenario framework
        blocks:
          - type: paragraph
            body: >-
              The right scenario frame begins with the existing unicorn mark and then asks what the public market is
              likely to reward or punish. In a bear case, the market treats Moneyview more like a regulated,
              credit-bearing fintech with opaque cohort durability and insists on an IPO discount because DLG and
              partner concentration look like hidden leverage. That produces a roughly $0.9-1.1 billion outcome. In a
              base case, the market accepts the 2024 unicorn mark as directionally valid because FY25 profit, 9M FY26
              run-rate, and the filed IPO all show that the business is more mature than a typical venture-backed
              lender; that supports something like $1.1-1.4 billion. The bull case requires more than momentum. It needs
              evidence that FY26 profit stays strong, that DLG intensity moderates, and that public investors view the
              company as closer to a scaled credit franchise than to a re-rating candidate. That can justify $1.4-1.7
              billion, but not much beyond it without a materially different growth and disclosure story. In all three
              cases, the market is likely to look at revenue quality, not just revenue scale, which is why the valuation
              range is fairly tight around the current mark instead of exploding upward into bubble-era territory.
            claimRefs:
              - CV008
              - CV022
