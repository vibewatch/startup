      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Digital-NBFC channel has crossed industry-defining share
            body: >-
              FACE data show digital NBFCs are responsible for ~78% of personal-loan volumes and ~19% of personal-loan
              value, and Business Today reports digital captured ~80% of the online lending market in Q3 FY26. The
              share-of-flow battle for new originations is already digital-first, which underwrites Moneyview's
              mobile-only positioning rather than its requiring it.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM027
          - type: callout
            title: Account-aggregator rails plus thin-file scoring widens the funnel
            body: >-
              India's account-aggregator framework gives Moneyview consented programmatic access to bank statement data,
              which combined with its proprietary credit-scoring model for thin-file borrowers lets the company
              underwrite a much wider funnel than legacy bank personal-loan processes can.
            calloutType: strength
            claimRefs:
              - CM020
              - CM021
              - CM014
          - type: callout
            title: RBI rule changes and rising delinquencies are the binding constraints
            body: >-
              The 2022 RBI digital-lending rules, the 2022 MFI Directions, and the February 2026 DLG framework reset
              combine with a 1.9% DPD90 print and a tripling of Moneyview's FY25 impairment charge to make regulatory
              and credit-quality risk the binding constraint on market-share capture, even as the underlying market
              continues to grow.
            calloutType: risk
            claimRefs:
              - CM022
              - CM023
              - CM025
              - CM024
              - CM026
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — direct peers, incumbents, adjacents, substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for Moneyview spans five tiers. Direct digital-lending peers are the LSP/NBFC
              apps that originate small-ticket personal loans through mobile flows to retail borrowers: KreditBee
              (multi-product loans Rs 6,000-Rs 10 lakh, 12-28.5% APR, strong new-to-credit focus), Fibe (formerly
              EarlySalary; 39 million app downloads, Rs 40,000 crore+ disbursed, loans Rs 500-Rs 5 lakh at 16.75-45%
              APR), CASHe (short-term app-only personal loans), MoneyTap / Freo (credit-line product Rs 3,000-Rs 5 lakh
              from 13% APR), Navi Technologies (Sachin Bansal-founded fintech with personal loans, home loans, and a
              bank-licence ambition), and Axio (formerly Capital Float). Incumbent banks — HDFC, ICICI, SBI, Axis, Kotak
              — distribute personal loans through branches, relationship managers, and mobile banking, and their card
              arms substitute for BNPL. Adjacent fintechs include LazyPay (PayU group BNPL), Indifi (SME-focused),
              PaySense (PayU), and superapps like PhonePe, Paytm, and Cred that have layered credit on top of payment
              and rewards rails. Status-quo substitutes — gold loans, employer salary advances, informal moneylenders —
              still account for a meaningful share of small-ticket borrowing in Tier II/III India. Likely entrants over
              the five-year horizon include bank-licensed neobanks, Account Aggregator-led products from PSU banks, and
              embedded- credit offerings inside e-commerce checkouts.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
