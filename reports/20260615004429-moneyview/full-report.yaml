      - number: '3.2'
        title: Competitor profiles, scale, funding, and positioning
        blocks:
          - type: paragraph
            body: >-
              Among direct peers, scale and funding differ markedly. Moneyview reports 125.49 million registered users,
              9.73 million monetised users, 50 million+ Android installs, a 4.8-star Google Play rating across 36 lakh+
              reviews, FY25 revenue of Rs 2,339 crore, FY25 net profit of Rs 240.3 crore, and a March 2026 DRHP for a Rs
              3,000 crore IPO at a unicorn- class (~$1.2 billion) post-Series E base. Fibe discloses 39 million app
              downloads, Rs 40,000 crore+ in cumulative disbursals, and 8,500+ partner tie-ups; it has been profitable
              in recent fiscal years per industry coverage but has not filed a DRHP. KreditBee operates as both an LSP
              and an NBFC with a multi-product personal-loan stack and explicitly markets to new-to-credit customers.
              Navi differs from the pure-LSP cohort: it is publicly listed via parent Navi Technologies, runs a
              balance-sheet-heavy NBFC, and is pursuing a small-finance-bank licence — so its cost of capital and
              capital adequacy story is materially different. CASHe focuses on salary-linked short-tenure loans.
              MoneyTap / Freo runs a credit-line construct rather than a single-disbursal loan, which is a structurally
              different revenue model. LazyPay is positioned around merchant-checkout BNPL rather than standalone
              personal loans. Wikipedia, the Fibe about page, the CASHe about page, and KreditBee's own marketing site
              corroborate each peer's product surface and target customer. The combination of scale, app rating,
              multi-product surface, and capital-light LSP economics gives Moneyview a defensible position among
              pure-play digital lenders, but the spread on price and ticket size against KreditBee and Fibe is narrow.
