      - number: '2.3'
        title: Buyer, user, and payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The Indian digital-lending buyer is also the user and the payer: an individual consumer or
              micro-entrepreneur who downloads an app, completes KYC, and consumes a loan in their own bank account.
              There is no separate enterprise procurement step. Three buyer segments matter for Moneyview's positioning.
              The first is salaried urban borrowers — typically aged 25 to 35, with one or more existing credit lines,
              seeking ticket sizes in the Rs 50,000 to Rs 5 lakh range, willing to pay 16-30% APR for speed and
              convenience over a bank branch. The second is the new-to-credit and thin-file borrower, often in Tier
              II/III towns, seeking ticket sizes from Rs 5,000 to Rs 50,000, for whom Moneyview's proprietary
              credit-scoring model is the primary qualification path; FACE data show 39% of disbursed value going to
              Tier III+ cities and over 60% of sanctioned value going to borrowers under age 35. The third is the
              micro-entrepreneur taking small business loans up to Rs 5 lakh for working capital. The adoption path is
              mobile-first: download (Google Play, where Moneyview holds a 4.8-star rating), credit-score check (free
              CIBIL via Moneyview), KYC, soft-quote, hard-pull, partner assignment, disbursal — typically end-to-end
              within minutes for repeat customers. Women borrowers account for roughly 18% of sanctioned value,
              indicating a still-male-skewed adoption mix that doubles as a growth lever.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
