      - number: '7.5'
        title: Operational, competitive, channel, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Operational and competitive risks are less existential than the DLG / partner / regulatory stack, but they
              can easily trigger second-order damage. The distribution engine is still overwhelmingly app-led, which
              means Android platform policies, app-store trust signals, or ranking deterioration could hit origination
              volume faster than most B2B lenders would expect. The peer set is also upgrading. PhonePe’s push into
              secured lending, its huge payments distribution, and its regulatory breadth show how quickly a payments
              super-app can become a lending competitor. Mint and Business Standard’s reporting on PhonePe, CRED, and
              Paytm also demonstrates that product formats can be redesigned or pulled back under regulatory pressure,
              making category competition more dynamic and less predictable than static market-share tables imply.
              Internally, Moneyview remains visibly founder-led, so the governance and execution load still concentrates
              around Puneet Agarwal and Sanjay Aggarwal. Finally, product breadth is a double-edged sword: cards,
              insurance, digital gold, and payments create cross-sell upside, but every additional rail or license is
              one more source of compliance, security, and partner-process risk. This is why the right way to watch the
              company is through a dashboard of partner retention, DLG trend, app health, and disclosed incident
              intensity—not through top-line growth alone.
            claimRefs:
              - CR014
              - CR025
              - CR026
              - CR027
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR041
