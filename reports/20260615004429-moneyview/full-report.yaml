            body: >-
              Moneyview was co-founded in 2014 by Puneet Agarwal (CEO) and Sanjay Aggarwal (CTO). Puneet Agarwal is an
              IIT alumnus who previously worked at McKinsey, at Capital One in the United States where he led
              credit-risk modelling, and at Google's early Google Pay (Tez) effort in the US before returning to India
              to build Moneyview. Sanjay Aggarwal has more than two decades of technology experience including stints at
              Infosys and Yahoo, and previously founded the edtech startup Minglebox; at Moneyview he owns the
              technology stack, the proprietary credit-scoring model, and the underwriting platform. Both founders are
              listed among the offeror selling shareholders in the March 2026 draft red-herring prospectus alongside
              family member Chitra Agarwal, signalling that the founder family retains material economic and governance
              influence even after the IPO. The published leadership surface beyond the two founders is thin in the open
              record, and no independent board roster, audit-committee chair, or non-executive-director list has been
              disclosed in reviewed public sources, which leaves a high key-person dependency on Puneet Agarwal as the
              public-facing CEO and primary capital-raising voice through the IPO window.
