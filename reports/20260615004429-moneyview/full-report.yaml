      - - DLG realization history
        - Cash drawdowns, recoveries, and timing by partner cohort
        - Best way to calibrate whether headline DLG outstanding is conservative or not
        - Management + lender data room request
      - - Partner renewal economics
        - Revenue-share ladders, non-compete, and termination terms
        - Needed to judge durability of fee income and concentration risk
