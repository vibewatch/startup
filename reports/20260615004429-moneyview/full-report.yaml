      - number: '2.2'
        title: TAM, SAM, SOM, and constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Three independent sizing lenses anchor the addressable opportunity. The broadest lens is the Indian
              personal-loan TAM, sized by IMARC Group at roughly US$157 billion in 2025 and projected to reach US$576
              billion by 2034 at a ~15% CAGR, covering bank and non-bank personal loans across digital and physical
              channels. A tighter SAM is the digital-lending slice as reported by 6W Research, which projects 22.1% CAGR
              for India's digital lending market through 2030 driven by digital infrastructure, smartphone penetration,
              and policy tailwinds. The narrowest, most directly relevant lens is the Fintech Association for Consumer
              Empowerment (FACE) data summarised by Economic Times and Business Today: digital NBFC personal-loan stock
              reached Rs 1.39 lakh crore (~US$16 billion) across 6.47 crore live accounts by December 2025, up 53% over
              21 months, with digital NBFCs accounting for 78% of personal-loan volumes and 19% of total personal-loan
              value in the system. Quarterly sanction data show 10.9 crore digital NBFC loans worth Rs 1,06,548 crore in
              FY25, and FY26 nine-month data report fresh sanctions of Rs 97,381 crore. The average ticket size has
              moved up modestly to Rs 15,493 (up 18% year-on-year), indicating a mix shift toward slightly larger
              durations and ticket bands rather than ever-thinner credit. IBEF separately reports that fintech-led
              credit reached more than 11 crore loans in FY25, corroborating volume-led growth at the lower ticket
              bands.
            claimRefs:
              - CM006
              - CM007
