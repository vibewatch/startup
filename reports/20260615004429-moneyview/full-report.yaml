            body: >-
              Deployment is consumer-facing Android-first via Google Play. The customer downloads the app, completes
              KYC, consents to Account Aggregator data sharing, applies for credit, and receives a disbursal into a bank
              account — typically end-to-end within minutes for repeat customers. Integration depth covers credit
              bureaus (CIBIL et al.), partner NBFC lenders for the LSP rail, AA framework for bank-statement
              aggregation, NPCI for UPI disbursements and collections, IRDAI insurers for insurance attach, and
              digital-gold providers for the gold module. Reliability is implied by the 4.8-star Google Play rating
              across 36 lakh+ reviews and the 50M+ install base; specific uptime SLAs are not publicly disclosed.
              Support runs through in-app channels with collections outsourcing that absorbed Rs 196.6 crore of FY25
              expense. The product roadmap, inferred from FY25 launches (credit cards, earned wage access) and DRHP
              context, points toward broader cross-sell into adjacent retail-finance categories rather than into B2B /
              wholesale lending. Home loans and LAP are distributed via referral today; whether they become direct
              on-book products depends on WFPL's capital adequacy headroom (RBI 15% CAR floor) and post-IPO equity
