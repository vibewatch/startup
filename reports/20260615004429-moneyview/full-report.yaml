      - number: '4.4'
        title: Capital adequacy, balance sheet, and IPO financing trigger
        blocks:
          - type: paragraph
            body: >-
              As of 31 March 2025 (FY25 close), Moneyview reported total current assets of Rs 4,198.4 crore including
              cash and bank balances of Rs 1,067.7 crore, against non-current borrowings of Rs 1,201 crore. The WFPL
              NBFC arm must hold the RBI-mandated 15% capital adequacy ratio (CAR), bounding the on-book lending pace.
              The capital-light LSP segment requires no own balance-sheet capital per origination — but the DLG
              arrangements with partner lenders create a contingent cash claim against Moneyview if portfolio credit
              deteriorates; this is the structural reason finance and impairment costs tripled in FY25 even as the LSP
              revenue stream grew. Moneyview filed its DRHP with SEBI in March 2026 for a Rs 3,000 crore IPO, comprising
              a Rs 1,500 crore fresh issue and an Offer for Sale of 136,095,900 shares by founders, Accel, Apis
              Partners, Ribbit Capital, Lok Capital, Evolvence India Fund IV, and other early investors; a Rs 300 crore
              pre-IPO placement was also disclosed. The fresh-issue proceeds are destined for general corporate
              purposes, regulatory capital infusion into WFPL, and product development — the typical post-IPO use of
              funds for an Indian fintech NBFC. The next financing trigger after the IPO is debt issuance to fund
              continued growth in WFPL disbursals, scheduled around the November 2025 most-recent debt funding cadence.
              The harro.com adverse analysis of the DRHP specifically flags regulatory uncertainty (RBI DLG framework
              reset February 2026, BNPL rule churn) and loan-default rates as direct risks to the post-IPO financial
              trajectory.
