- id: credit-quality-and-partner-concentration
  title: Credit quality, DLG cash exposure, and partner-lender concentration
  body: 'The underwriting risk is a blend of borrower quality and counterparty structure. On the borrower side, Moneyview’s own disclosed annualized bad-loan rate of 6.9% is still below the 9.35% industry benchmark cited in IPO coverage, which is a positive signal. But CRIF’s data show exactly where the danger sits: small-ticket unsecured personal loans under Rs 10,000 saw a 44% increase in delinquencies in the relevant recent cohort window, and thin-file or no-score borrowers are becoming a larger share of the digital-lending funnel. That matters because Moneyview explicitly serves inclusion-heavy, Tier-II/III, new-to-credit segments. On the counterparty side, the DLG architecture converts borrower stress into direct company cost. The firm disclosed Rs 847 crore of DLG outstanding, facilitated Rs 9,165.7 crore under DLG partnerships, and booked Rs 318.8 crore of DLG expense in 9M FY26 alone. Partner concentration compounds that credit risk: the top ten partners still contributed 37.31%
    of 9M FY26 revenue and 46.82% in FY25, and those relationships are non-exclusive. The DLG disclosure page adds another concentration lens by showing several very large partner buckets. Put simply, Moneyview does not need a systemic credit shock for this risk stack to matter; a few underperforming cohorts or a few partner-share losses could be enough to re-rate the equity story materially.'
