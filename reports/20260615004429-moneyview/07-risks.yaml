company:
  name: Moneyview
chapter:
  number: 7
  title: Risks
  summary: 'Moneyview’s risk stack is not the usual pre-profit fintech story. The company is profitable and already scale-proven, but the combination of Default Loss Guarantee exposure, partner-lender concentration, RBI rule sensitivity, thin-file borrower credit risk, and a partially de-risking IPO means the main debate is whether a capital-light lender is quietly carrying pseudo-on-book risk. The March 2026 DRHP, RBI Digital Lending Directions, and CRIF default data all point to the same conclusion: the business can keep compounding if regulation stays stable and partner credit performs, but even modest deterioration in DLG realization, partner concentration, or regulatory treatment can hit growth, margins, and public-market appetite quickly.'
sections:
- id: risk-overview-and-thesis-breakers
  title: Risk overview and thesis-breaker conditions
  body: 'Moneyview is no longer a proof-of-concept fintech; it is a scaled lender-orchestrator with real profits, real partner distribution, and a filed IPO. That changes the risk frame. The core question is not whether consumers want digital credit, but whether Moneyview’s capital-light architecture can remain capital-light once DLG obligations, partner concentration, and RBI rule changes are fully stressed. The fresh issue itself makes the point: more than two-thirds of primary proceeds are earmarked for DLG support and NBFC capital rather than purely offensive growth. That is not fatal—many successful lenders periodically reinforce the balance sheet—but it means the public-market thesis is sensitive to cost of risk and funding structure in a way a software marketplace is not. The practical thesis-breakers are visible and measurable: DLG outstanding that does not normalize after the IPO, top-ten partner concentration moving back above 40%, bad-loan rates moving above the industry, non-exclusive
    partners shifting share to larger fintechs, or RBI tightening LSP and BNPL rules again. The strongest mitigants are the company’s current profitability, official filings, and the fact that some credit metrics are still better than the industry average. Even so, the residual exposure is unquestionably higher than the headline “capital-light fintech” label suggests.'
