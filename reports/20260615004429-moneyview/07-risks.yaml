  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: dlg-realization-history
    missingEvidence: Historical DLG cash drawdown, recovery, and invocation data by partner cohort.
    whyItMatters: Without draw history, investors cannot tell whether current DLG reserves are conservative or already structurally insufficient.
    diligencePath: Request partner-level DLG invocation history, recovery curves, and realized cash loss ratios from management and lenders.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: partner-contracts
    missingEvidence: Renewal calendar, pricing ladders, exclusivity terms, and termination rights for the largest lending partners.
    whyItMatters: Counterparty churn or repricing could hit fee revenue before credit quality visibly deteriorates.
    diligencePath: Request top-partner contract summaries, renewal cadence, and revenue-share ladders under NDA.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: cohort-durability
    missingEvidence: Public repayment cohorts, repeat-loan curves, and NRR-style customer durability metrics.
    whyItMatters: The market can see current scale and profit, but not how durable those economics are through a full credit cycle.
    diligencePath: Request monthly vintage curves, repeat-borrow rates, renewal rates, and loss emergence by borrower segment.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR005
  - type: conflicting-data
    severity: minor
    topic: cyber-incident-detail
    missingEvidence: Primary source detail for the reported Rs 48.3 crore cyber-loss event beyond secondary coverage.
    whyItMatters: The event is material enough to matter, but exact remediation cost and insurance offsets remain unclear in public.
    diligencePath: Trace the relevant DRHP risk-factor section and request incident postmortem, loss netting, and control-remediation summary.
    relatedQuestionRefs:
    - QR007
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: TR002 regulatory register timeline remains partial because supervisory interactions and partner-specific legal correspondence are not public
    missingEvidence: Partner-specific supervisory feedback, internal compliance remediation timelines, and any regulator correspondence not captured in public circulars.
    whyItMatters: The public timeline is decision-useful, but non-public supervisory interactions could still change how quickly Moneyview must adapt products or controls.
    diligencePath: Request internal compliance tracker, external legal summaries, and board risk-committee materials covering RBI, BNPL, DLG, and data-governance remediation.
    relatedTableRefs:
    - TR002
