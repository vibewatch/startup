callouts:
- calloutType: risk
  title: The capital-light label is directionally true but economically incomplete
  body: Moneyview’s DLG structure and partner model still create real company-level cash exposure. Public investors should underwrite it closer to a partially credit-bearing lender than to a pure marketplace.
  claimRefs:
  - CR004
  - CR021
  - CR029
- calloutType: risk
  title: Regulation is not just a compliance cost; it is a product-economics variable
  body: RBI changes to DLG, BNPL, fund flows, or outsourcing rules can directly alter what Moneyview is allowed to sell, how quickly it can sell it, and who bears the cash burden when borrowers default.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
- calloutType: insight
  title: Credit quality and counterparty quality are now the same debate
  body: Because Moneyview sits between thin-file borrowers and non-exclusive lending partners, deterioration can appear on either side first and still transmit into public-market valuation through the DLG channel.
  claimRefs:
  - CR005
  - CR018
  - CR020
  - CR024
