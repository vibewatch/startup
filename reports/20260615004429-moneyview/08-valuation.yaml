  - CV023
  - CV025
  - CV027
  - CV028
  - CV030
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Final IPO price band
    - Bookbuild range, anchor demand, and institutional feedback
    - Determines whether fair becomes stretched or attractive
    - Review RHP / roadshow materials when released
  - - DLG realization history
    - Cash drawdowns, recoveries, and timing by partner cohort
    - Best way to calibrate whether headline DLG outstanding is conservative or not
    - Management + lender data room request
  - - Partner renewal economics
    - Revenue-share ladders, non-compete, and termination terms
    - Needed to judge durability of fee income and concentration risk
    - Legal diligence with top partner contract summaries
  - - Repayment cohorts
    - Vintage loss curves, repeat-borrow rates, and segment-level credit performance
    - Separates temporary profit from cycle-tested unit economics
    - Credit-diligence pack from management
  - - Channel economics
    - CAC, LTV, and Android / performance-marketing dependence
    - Public investors will care about growth quality, not just volume
    - Marketing analytics diligence
  - - Public-company controls
    - Security remediation, incident response, and governance process maturity
    - Post-listing risk events can compress multiples quickly
    - Security / governance workstream review
  notes: These are the highest-value follow-up items for moving from track to conviction rather than a general data-room wish list.
