- id: entry-discipline-and-final-recommendation
  title: Entry discipline, thesis-break triggers, and recommendation
  body: 'The most defensible stance is track with medium confidence and high risk. That recommendation is not bearish on the company’s operating proof; it is price-sensitive. Moneyview has enough substance to matter—a real IPO, real profits, a meaningful customer base, and better evidence than many private fintechs ever provide. But the public investor still lacks a final price band, detailed cohort and DLG realization history, and full visibility into partner renewal economics. Those gaps are exactly the kind that stop a fair company from being a clear buy. Entry discipline should therefore be explicit. Investors can upgrade the case if the final IPO band implies only a modest premium to the current unicorn mark, if post-listing quarters improve partner and credit transparency, and if DLG intensity trends down relative to origination scale. Conversely, the thesis breaks if pricing stretches above what mid-single-digit sales can support, if partner concentration worsens, or if fresh RBI
    or credit-performance surprises reveal that the company was carrying more hidden risk than the IPO narrative implied. Fair is the right word here: not cheap enough for a buy, not fragile enough for a pass, and not opaque enough for research-more.'
