- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO pricing too aggressive
    - Public price band implies materially above ~5x FY25 sales without new disclosure
    - Moves the deal from fair to stretched quickly
    - Do not chase; keep only watchlist status
  - - DLG intensity fails to normalize
    - Post-IPO DLG outstanding or DLG expense remains stubbornly elevated
    - Reinforces pseudo-on-book risk discount
    - Cut valuation range toward bear case
  - - Partner concentration worsens
    - Top-ten partner share rises back above 40% or a large partner exits
    - Lowers fee durability and raises bargaining risk
    - Increase discount to SBI-cards-like comp
  - - Asset quality slips
    - Bad-loan rate rises above industry or loss cohorts deteriorate sharply
    - Market will haircut the multiple on quality concerns
    - Shift stance from fair to stretched
  - - Regulatory shock
    - RBI changes DLG or LSP economics materially
    - Directly hits core business architecture
    - Re-run scenario table immediately
  - - Disclosure disappoints
    - No better cohort / partner / DLG transparency after listing
    - Keeps the company in track rather than buy territory
    - Hold off on rating upgrade
  notes: Triggers are chosen for monitorability rather than completeness and can be checked against post-listing quarterly disclosure or RBI circulars.
  claimRefs:
