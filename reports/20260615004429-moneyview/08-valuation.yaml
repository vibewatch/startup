  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: final-ipo-pricing
    missingEvidence: Final IPO price band, anchor orders, and institutional demand quality.
    whyItMatters: These inputs determine whether the current fair stance is actually attractive, neutral, or stretched in the market.
    diligencePath: Review the RHP, price band announcement, and any roadshow or anchor-book disclosures before investment committee approval.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cohort-durability
    missingEvidence: Repayment vintage curves, repeat-borrow rates, renewal mix, and DLG cash realization by partner cohort.
    whyItMatters: Without durability data, investors can price current profit but not the quality or repeatability of that profit.
    diligencePath: Request management cohort deck and partner-level credit-performance summaries under NDA.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: partner-contracts
    missingEvidence: Revenue-share ladders, renewal schedules, and termination rights for the largest lending partners.
    whyItMatters: Public comps will discount valuation if fee durability is uncertain even when current volumes look strong.
    diligencePath: Legal and commercial diligence on top-partner agreements plus side-letter review.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: minor
    topic: post-ipo-controls
    missingEvidence: Detailed public-company control framework, security remediation disclosure, and audit-readiness evidence.
    whyItMatters: Governance and control surprises are a classic source of multiple compression in newly listed fintechs.
    diligencePath: Review board committee charters, governance policy updates, and post-listing disclosure cadence.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable set remains partial because several Indian private fintechs lack clean public multiple disclosure
    missingEvidence: More disclosed Indian digital-lending and fintech IPO comps with reliable revenue and valuation data.
    whyItMatters: The current table is decision-useful, but a broader comp set would tighten the discount or premium range around Moneyview.
    diligencePath: Refresh the comparable table after final IPO filings from peers such as Fibe or new market-data coverage expands.
    relatedTableRefs:
    - TV004
