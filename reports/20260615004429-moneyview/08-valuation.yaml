- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - 2026 metric
  - Multiple / valuation status
  - Relevance to Moneyview
  - Limitation
  rows:
  - - Moneyview implied at unicorn mark
    - FY25 revenue ~Rs 2,339 crore
    - ~4-5x price-to-sales implied
    - Best current private anchor for the actual company
    - Private-round mark with limited depth and no public price band
  - - Bajaj Finance
    - June 2026 public snapshot
    - 17.2x EV/Revenue; 26.3x P/E; 4.37x P/B
    - Shows premium public lender ceiling
    - Too strong a franchise / disclosure base to be a fair direct multiple
  - - SBI Cards
    - June 15 2026 public snapshot
    - 5.5x EV/Revenue
    - Useful mid-single-digit listed consumer-credit anchor
    - Credit-card issuer economics differ from LSP + NBFC mix
  - - Paytm
    - FY26 rerating memo
    - ~8.9x revenue
    - Fintech IPO cautionary multiple after public re-rating
    - Payments / commerce mix differs from digital lending
  - - PhonePe
    - FY26 rerating memo
    - ~11-12x revenue
    - Shows how scale and ecosystem breadth can hold higher private / crossover framing
    - Not a pure lender and has much larger payments distribution
  - - Fibe
    - Planned 2026 IPO
    - Targeting >$1B valuation
    - Indian digital-lending peer with public-market ambition
    - No completed price discovery yet
  - - Lending & Credit sector average
    - Finro Q1 2026
    - 11.8x EV/Revenue average
    - Frames broader global comp backdrop
    - Average is skewed above what risk-adjusted Indian deals may clear
  notes: Comparables are used for bounding logic rather than for a single mechanical target price. Moneyview is neither a pure card issuer nor a pure SaaS-style fintech.
