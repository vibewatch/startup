- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Valuation signal
    - The 2024 unicorn mark is recent and backed by known investors
    - The round was small, so price discovery was not especially deep
    - A well-supported public price band would sharpen confidence
  - - Financial proof
    - FY25 and 9M FY26 numbers show real scale and profit
    - Durability by cohort and partner is still not disclosed well enough
    - Post-IPO vintage, cohort, and DLG disclosure would improve the quality of the multiple
  - - Public comp framing
    - 4-5x sales is below premium-lender ranges and near SBI Cards territory
    - DLG and concentration risk justify discounting versus cleaner public lenders
    - Demonstrated de-risking of DLG and partner mix would narrow the discount
  - - Market backdrop
    - 2026 IPO market is open again for stronger fintechs
    - That same market is far stricter than the 2021 bubble era
    - Strong institutional demand at disciplined pricing would improve sentiment
  - - Strategic position
    - Moneyview has broader product breadth and stronger profitability than many private lending peers
    - PhonePe, CRED, and other large platforms still compress upside multiple potential
    - Evidence of sustained competitive advantage and lower CAC pressure would help
  - - Recommendation
    - The company belongs on the active watchlist
    - The current signal is not cheap enough for a conviction buy
    - Better price or better disclosure is the unlock
  notes: Anti-thesis items focus on valuation quality and disclosure rather than on denial of Moneyview’s operating traction.
