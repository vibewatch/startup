  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Wait for final IPO pricing and early public disclosure before moving to buy
  - - Confidence
    - Medium
    - Primary-source financial anchors are solid but durability data are incomplete
  - - Risk rating
    - High
    - DLG, concentration, and regulatory exposure remain central to valuation
  - - Valuation stance
    - Fair
    - The existing unicorn mark is usable, but not obviously cheap
  - - Best current private anchor
    - ~$1.2B unicorn mark (Sep 2024)
    - Use as central reference, not as a guaranteed public-clearing price
  - - FY25 revenue anchor
    - Rs 2,339 crore (~$280M)
    - Supports a low-to-mid 4x sales view at the unicorn mark
  - - Public-market comp anchor
    - Closer to SBI Cards than to Bajaj Finance
    - Mid-single-digit sales is easier to defend than premium-lender multiples
  - - Upgrade trigger
    - Disciplined price band plus improving DLG / concentration disclosure
    - Could justify moving from track to buy
  - - Downgrade trigger
    - Aggressive pricing or worsening DLG / partner / credit metrics
    - Would move the case toward watch or pass
  notes: The recommendation is explicitly price-sensitive and risk-sensitive, not a generic verdict on company quality.
