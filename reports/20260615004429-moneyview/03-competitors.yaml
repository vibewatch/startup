company:
  name: Moneyview
chapter:
  number: 3
  title: Competitors
  summary: >-
    Moneyview competes against a crowded set of digital consumer-lending apps in India: direct
    LSP/NBFC peers (KreditBee, Fibe, CASHe, MoneyTap/Freo, Navi, LazyPay, Axio, Indifi),
    incumbent banks and bank credit cards, status-quo substitutes (gold loans, salary
    advances, informal lenders), and emergent superapp entrants (PhonePe, Paytm, Cred). Among
    digital direct peers, Moneyview shows the broadest cross-sell product surface (loans +
    credit cards + insurance + gold + UPI), the highest published Google Play rating (4.8
    stars across 36 lakh+ reviews), and one of the larger install bases (50 million+) — but
    differentiation on price and ticket size is narrow, partner dependence is high (top 10
    lenders = 37-47% of revenue), and incumbent banks plus rapidly scaling Navi remain the
    biggest displacement threats over a five-year horizon.
sections:
  - id: landscape
    title: Competitive landscape — direct peers, incumbents, adjacents, substitutes
    body: >-
      The competitive landscape for Moneyview spans five tiers. Direct digital-lending peers
      are the LSP/NBFC apps that originate small-ticket personal loans through mobile flows
      to retail borrowers: KreditBee (multi-product loans Rs 6,000-Rs 10 lakh, 12-28.5% APR,
      strong new-to-credit focus), Fibe (formerly EarlySalary; 39 million app downloads,
      Rs 40,000 crore+ disbursed, loans Rs 500-Rs 5 lakh at 16.75-45% APR), CASHe (short-term
      app-only personal loans), MoneyTap / Freo (credit-line product Rs 3,000-Rs 5 lakh from
      13% APR), Navi Technologies (Sachin Bansal-founded fintech with personal loans, home
      loans, and a bank-licence ambition), and Axio (formerly Capital Float). Incumbent
      banks — HDFC, ICICI, SBI, Axis, Kotak — distribute personal loans through branches,
      relationship managers, and mobile banking, and their card arms substitute for BNPL.
      Adjacent fintechs include LazyPay (PayU group BNPL), Indifi (SME-focused), PaySense
      (PayU), and superapps like PhonePe, Paytm, and Cred that have layered credit on top
      of payment and rewards rails. Status-quo substitutes — gold loans, employer salary
      advances, informal moneylenders — still account for a meaningful share of small-ticket
      borrowing in Tier II/III India. Likely entrants over the five-year horizon include
      bank-licensed neobanks, Account Aggregator-led products from PSU banks, and embedded-
      credit offerings inside e-commerce checkouts.
