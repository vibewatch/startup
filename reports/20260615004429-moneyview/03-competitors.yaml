callouts:
  - calloutType: strength
    title: Broadest cross-sell surface among pure-digital lenders
    body: >-
      Moneyview offers eight distinct retail product lines (PL, BL, credit cards, BNPL,
      insurance, digital gold, UPI, free CIBIL) — more than KreditBee (4), Fibe (3), or
      Freo (4) — supported by an IRDAI corporate-agent licence and ISO 27001:2022. The cross-
      sell stack lifts LTV at near-zero CAC and is the most durable differentiator against pure
      personal-loan peers.
    claimRefs:
      - CP019
      - CP020
      - CP026
  - calloutType: risk
    title: Incumbent and bank-licensed peers can compress prime-segment yields
    body: >-
      Incumbent bank pre-approved personal loans at ~10.5% APR and Navi's 9.9% starting APR
      (driven by lower cost of funds and a bank-licence path) can drain prime salaried
      borrowers from Moneyview's 16% starting band. Combined with the RBI DLG framework reset
      in February 2026, this caps pricing flexibility on Moneyview's higher-margin cohorts.
    claimRefs:
      - CP025
      - CP028
      - CP030
  - calloutType: risk
    title: Partner concentration is the most concrete moat risk
    body: >-
      Top-10 financial partners contribute 37-47% of Moneyview's revenue (37.31% in 9M FY26,
      46.82% in FY25), and there are no exclusive contracts. Harro.com's DRHP analysis flags
      this as one of two leading risk factors. A single major-partner exit would compress
      origination volume materially in the short run.
    claimRefs:
      - CP031
      - CP032
