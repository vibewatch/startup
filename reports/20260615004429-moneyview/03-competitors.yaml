  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-ad-spend
      missingEvidence: >-
        Public reviewed sources do not quantify KreditBee's or Fibe's FY25 advertising and
        promotional spend in a directly comparable form to Moneyview's Rs 426.5 crore (~20% of
        expenses) print.
      whyItMatters: >-
        Without comparable ad-spend numbers, the GTM differentiation claim relies on
        Moneyview's own disclosure and indirect inference rather than peer-anchored
        benchmarking.
      diligencePath: >-
        Request KreditBee, Krazybee, and Fibe MCA / RoC filings to extract advertising and
        promotional spend lines; cross-check against TRAI / Kantar fintech-category ad spend
        estimates.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: blocking
      topic: partner-renewal-calendar
      missingEvidence: >-
        Moneyview's top-10 financial-partner renewal calendar and the revenue share per
        partner are not publicly disclosed in the press summaries reviewed; they are private
        to the DRHP appendices and partner contracts.
      whyItMatters: >-
        Without the renewal calendar, the partner-concentration risk cannot be timed and a
        diligence call cannot precisely stress-test a major-partner exit scenario.
      diligencePath: >-
        Request the redacted top-10 partner-contract renewal schedule and revenue share per
        partner from Moneyview management; cross-check against the IPO RHP partner-disclosure
        section once filed.
      relatedQuestionRefs:
        - QP026
      relatedTableRefs:
        - TP004
    - type: enumeration-incomplete
      severity: minor
      topic: capability-matrix-unknowns
      missingEvidence: >-
        Several feature-breadth-matrix cells for KreditBee, Fibe, Freo/MoneyTap, CASHe, and
        Navi are marked unknown — particularly insurance-distribution licences, digital-gold
        availability, and ISO 27001:2022 status — because the competitors' own marketing
        pages do not disclose them.
      whyItMatters: >-
        The matrix understates competitor capability where competitors hold the certifications
        privately or behind a login, which could narrow Moneyview's apparent cross-sell moat.
      diligencePath: >-
        Pull each competitor's IRDAI corporate-agent registration from the IRDAI public
        registry; query the ISO certification body registries for KreditBee, Fibe, Freo, and
        CASHe; refresh the matrix on each release.
      relatedQuestionRefs:
        - QP008
        - QP023
      relatedTableRefs:
        - TP002
        - TP003
