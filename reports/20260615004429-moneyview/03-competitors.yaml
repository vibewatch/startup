  - id: capability-and-pricing
    title: Capability comparison, pricing, and GTM differentiation
    body: >-
      On capability, Moneyview offers the broadest product surface among direct LSP/NBFC peers:
      personal loans, business loans, credit cards (launched FY25), BNPL/Smart Pay, insurance
      distribution (IRDAI CA0925), digital gold, UPI payments, free CIBIL score check, earned
      wage access, and home loans via referral. KreditBee offers personal loans (multiple
      tickets), e-commerce financing, and an in-house BNPL but lacks insurance breadth. Fibe
      offers personal loans, salary advance, and partner-card distribution but has not
      published an IRDAI insurance licence. Navi covers personal loans, home loans, health
      insurance, and a mutual-fund product set — the closest functional superset of Moneyview
      on the bank side. On pricing, the four largest pure-digital peers (Moneyview, KreditBee,
      Fibe, MoneyTap/Freo) cluster in the 13-30% APR range for prime customers, with
      KreditBee and Fibe stretching to 28.5-45% for thinner-file cohorts; Moneyview's
      published 16% starting APR (BankBazaar) sits at the lower end of that range. On
      go-to-market, Moneyview relies heavily on organic Play Store discovery (4.8 stars,
      36 lakh+ reviews), search-led acquisition, and a Rs 426 crore FY25 advertising and
      promotional spend (about 20% of total expenses). KreditBee and Fibe similarly invest
      in performance marketing; Navi piggybacks on the Sachin Bansal brand and the larger
      Navi Technologies marketing budget. Trust posture differs: Moneyview holds ISO 27001:2022
      certification and an IRDAI corporate-agent licence; KreditBee and Fibe disclose less
      explicitly about ISO security certifications in their public marketing.
