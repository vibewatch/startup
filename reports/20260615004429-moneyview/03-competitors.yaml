      basis: >-
        Covers the largest publicly known digital LSP/NBFC peers, the top-five Indian
        incumbent banks by personal-loan stock, and the headline status-quo substitutes;
        excludes regional NBFCs without national app distribution and unregistered
        moneylenders without disclosure footprint.
    rows:
      - - Direct digital LSP/NBFC peers
        - KreditBee, Fibe (EarlySalary), CASHe, MoneyTap/Freo, Navi, Axio (Capital Float)
        - App-first personal loans, BNPL, credit-line, salary advance
        - Direct contest for the same Moneyview borrower funnel
        - Price, ticket-size, multi-homing, channel overlap
      - - Incumbent banks (credit + cards)
        - HDFC Bank, ICICI Bank, SBI, Axis Bank, Kotak Mahindra Bank
        - Pre-approved mobile personal loans; bank credit cards; salary overdrafts
        - Substitutes for Moneyview's salaried urban segment at lower APR
        - Cost-of-funds advantage; trust premium
      - - Adjacent BNPL / wallet credit
        - LazyPay (PayU), PaySense (PayU), Cred (revenue-circle credit), Slice
        - Merchant-checkout BNPL, revolving credit lines
        - Compete for the small-ticket revolving-credit wallet
        - Embedded distribution at checkout
      - - Superapp credit entrants
        - PhonePe, Paytm Lending, Google Pay rewards-led credit
        - Payments-led credit layered on UPI rails
        - Compete for app-real-estate share with the same user
        - Distribution and free-to-acquire UPI base
      - - Status-quo substitutes
        - Gold loans (Muthoot, Manappuram), employer salary advance, informal lenders
        - Secured / collateral-anchored or relationship-led small-ticket loans
        - Substitutes for borrower's primary credit-need event
        - Lower trust friction in Tier III; collateral-only product
      - - SME / business-loan adjacents
        - Indifi, Axio (SME), Lendingkart, FlexiLoans
        - Working capital and merchant credit
        - Compete with Moneyview's business-loan extension up to Rs 5 lakh
        - Underwriting depth and merchant data
      - - Likely entrants (5-year horizon)
        - PSU bank neobank arms, account-aggregator-native lenders, e-commerce embedded credit
        - Mobile lending atop bank or marketplace rails
        - Could compress yields on prime borrowers; widen distribution
        - Distribution advantage and lower cost-of-funds
    notes: >-
      Tiers map to RBI's LSP/NBFC taxonomy plus product-level competitor categories used in
