  - id: moat-and-displacement-risk
    title: Moat durability, switching cost, and displacement risk
    body: >-
      Moneyview's moat rests on four pillars: a proprietary credit-scoring model tuned for
      thin-file and Tier II/III borrowers; a multi-product cross-sell surface that lifts
      lifetime value at near-zero CAC; a regulatory-licensed insurance and lending stack
      (IRDAI CA0925, RBI LSP compliance, ISO 27001:2022); and scale economics on a 50 million+
      install base with 4.8-star reputation. Switching cost for individual borrowers is low —
      apps are free to download, KYC is portable, and there is no contract lock-in — so the
      moat is primarily distribution-and-data rather than contractual. Multi-homing is the
      norm: Paisabazaar-style aggregators and the 8,500+ partner tie-ups disclosed by Fibe
      indicate borrowers commonly compare offers across two or three apps before drawing down.
      Displacement risk comes from three directions. First, incumbent banks — HDFC, ICICI, SBI,
      Axis, Kotak — increasingly offer pre-approved mobile personal loans to their existing
      account holders at lower APR, eroding the salaried-urban segment from the rate side.
      Second, Navi's bank-licence path could give it a structural funding-cost advantage that
      pure LSPs cannot match. Third, the RBI Digital Lending Guidelines (Sep 2022 / Nov 2024)
      and the February 2026 DLG framework reset constrain how much risk LSPs can warehouse for
      partner lenders, which limits Moneyview's ability to widen spreads through DLG cover. The
      harro.com analysis of Moneyview's DRHP specifically flags partner concentration (top 10 =
      37-47% of revenue, no exclusive contracts) and DLG-led credit cost as durability risks.
      Commoditisation risk on the underwriting layer is real: as bank-statement-aggregator data
      becomes universally programmable via Account Aggregator, the thin-file edge narrows.
