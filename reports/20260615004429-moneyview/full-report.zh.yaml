  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价模型和收入结构
        blocks:
          - type: paragraph
            body: >-
              Moneyview 通过三条主要收入流赚钱。第一条也是最大的一条，是作为 Lending Service Provider（LSP）获得的费用和佣金——由 15+ 家合作贷款机构（Aditya Birla
              Capital、Northern Arc、Vivriti Capital、Oxyzo 等）为 Moneyview 在平台上发起的个人贷款、商业贷款和相邻产品支付的获客费、处理费和收入分成佣金；该收入流贡献
              FY25 收入约 Rs 1,486.8 crore（约占 Rs 2,339 crore 总收入的 ~63%）。第二条是 Moneyview 全资 NBFC Whizdm Finance Private
              Limited（WFPL）持有表内贷款组合产生的利息收入；FY25 利息收入约 Rs 789 crore（~34%）。第三条是保险分销（基于 IRDAI corporate-agent 牌照
              CA0925）、数字黄金积累、UPI 支付相邻业务和信用分服务带来的费用收入，FY25 合计约 Rs 63.3 crore（~3%）。定价模型是混合式：LSP 费用随放款量和各合作伙伴收入分成表扩张；WFPL
              表内收益率受公布 APR 区间约束，个人贷款期限 3-60 个月，年化 APR 16% 起。按 Inc42 财务摘要，FY25 总收入（经营收入加其他收入 Rs 399.4 crore）约 Rs 2,738.5
              crore；Entrackr 和 The Head and Tale 也印证了 Rs 2,339 crore 的经营收入数据。9M FY26 经营收入 Rs 2,373 crore，九个月几乎追平 FY25
              全年；年化后约 Rs 3,164 crore。
