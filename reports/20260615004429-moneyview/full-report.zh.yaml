              一个典型 Moneyview 用户旅程从安装 Android App 开始（按印度媒体和 Moneyview 产品披露，Android 安装基数 50 million+），随后免费查询 CIBIL
              信用分，完成身份和银行账户 KYC，并为某个借贷产品获得软报价。平台随后按 RBI Digital Lending Guidelines（2022 年 9 月发布、2024 年 11 月强化）规定的
              Lending Service Provider（LSP）框架，把申请路由给 Moneyview 全资 NBFC Whizdm Finance Private Limited（WFPL）做表内贷款，或路由给
              15+ 家合作贷款机构之一（Aditya Birla Capital、Northern Arc、Vivriti Capital、Oxyzo 等）。个人贷款产品提供 Rs 5,000-Rs 10 lakh
              票据、3-60 个月期限，公布 APR 16% 起；商业贷款最高 Rs 5 lakh；信用卡产品 FY25 推出；BNPL / Smart Pay 覆盖小额循环信用；保险基于 IRDAI
              corporate-agent 牌照 CA0925 分销；数字黄金和 UPI 支付在同一个 App 壳内运行；FY25 推出的 earned wage access
              产品负责工资预支。住房贷款和抵押物业贷款通过转介 / 分销模式提供，而不是直接获客和放款。App 界面把这些流程统一到单一登录和统一 KYC 下，这就是按客户工作流定义的产品。
