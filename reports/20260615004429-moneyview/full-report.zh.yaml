        title: 能力对比、定价和 GTM 差异化
        blocks:
          - type: paragraph
            body: >-
              从能力看，Moneyview 在直接 LSP/NBFC 同行中产品界面最宽：个人贷款、商业贷款、信用卡（FY25 推出）、BNPL/Smart Pay、保险分销（IRDAI CA0925）、数字黄金、UPI
              支付、免费 CIBIL 分数查询、earned wage access，以及通过转介提供住房贷款。KreditBee 提供个人贷款（多个票据区间）、电商融资和自有 BNPL，但保险广度不足。Fibe
              提供个人贷款、工资预支和合作卡分销，但未公布 IRDAI 保险牌照。Navi 覆盖个人贷款、住房贷款、健康保险和共同基金产品——在银行侧是最接近 Moneyview
              的功能超集。定价上，四家最大纯数字同行（Moneyview、KreditBee、Fibe、MoneyTap/Freo）对优质客户集中在 13-30% APR 区间，KreditBee 和 Fibe 对更薄信用
              cohort 拉高到 28.5-45%；Moneyview 公布的 16% 起始 APR（BankBazaar）位于该区间低端。GTM 上，Moneyview 高度依赖 Play Store 自然发现（4.8
              星、36 lakh+ 评论）、搜索获客，以及 FY25 Rs 426 crore 广告和促销开支（约占总费用 20%）。KreditBee 和 Fibe 同样投入效果营销；Navi 借力 Sachin
              Bansal 品牌和更大的 Navi Technologies 营销预算。信任姿态不同：Moneyview 持有 ISO 27001:2022 认证和 IRDAI corporate-agent
              牌照；KreditBee 和 Fibe 在公开营销中对 ISO 安全认证披露不那么明确。
