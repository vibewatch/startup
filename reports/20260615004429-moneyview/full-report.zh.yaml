              既有银行约 ~10.5% APR 的预审批个人贷款，以及 Navi 9.9% 的起始 APR（由更低资金成本和银行牌照路径驱动），会把优质工薪借款人从 Moneyview 16% 起始区间抽走。叠加 2026 年
              2 月 RBI DLG 框架重置，Moneyview 高利润 cohort 的定价弹性被封顶。
