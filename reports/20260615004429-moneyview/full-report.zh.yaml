      - number: '2.2'
        title: TAM、SAM、SOM 和受约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              三个独立测算口径锚定可触达机会。最宽口径是印度个人贷款 TAM：IMARC Group 估算 2025 年约 US$157 billion，并预计到 2034 年达到 US$576 billion，CAGR 约
              ~15%，覆盖数字和线下渠道中的银行与非银个人贷款。更收窄的 SAM 是 6W Research 报告的数字借贷切片；该机构预计印度数字借贷市场到 2030 年 CAGR 为
              22.1%，由数字基础设施、智能手机渗透和政策顺风推动。最窄、也最直接相关的口径来自 Economic Times 和 Business Today 汇总的 Fintech Association for
              Consumer Empowerment（FACE）数据：截至 2025 年 12 月，数字 NBFC 个人贷款存量达到 Rs 1.39 lakh crore（约 US$16 billion），覆盖 6.47
              crore 个活跃账户，21 个月增长 53%；数字 NBFC 占系统内个人贷款笔数的 78%，占总个人贷款金额的 19%。季度审批数据显示，FY25 数字 NBFC 发放 10.9 crore 笔贷款，金额
              Rs 1,06,548 crore；FY26 前九个月新增审批 Rs 97,381 crore。平均票据规模小幅升至 Rs 15,493（同比增长
              18%），说明组合在向略大期限和票据区间迁移，而不是不断下沉到更薄信用。IBEF 另称，金融科技主导信贷在 FY25 超过 11 crore 笔贷款，印证低票据区间由数量驱动增长。
