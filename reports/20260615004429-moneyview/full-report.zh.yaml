  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接同行、既有机构、相邻玩家、替代品
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的竞争版图分为五层。直接数字借贷同行是通过移动流程向零售借款人发起小额个人贷款的 LSP/NBFC App：KreditBee（多产品贷款 Rs 6,000-Rs 10
              lakh，12-28.5% APR，强新入信贷定位）、Fibe（原 EarlySalary；39 million App 下载、Rs 40,000 crore+ 放款、Rs 500-Rs 5 lakh
              贷款，APR 16.75-45%）、CASHe（纯 App 短期个人贷款）、MoneyTap / Freo（Rs 3,000-Rs 5 lakh 信用额度产品，APR 13% 起）、Navi
              Technologies（Sachin Bansal 创办的金融科技，覆盖个人贷款、住房贷款，并有银行牌照抱负）和 Axio（原 Capital
              Float）。既有银行——HDFC、ICICI、SBI、Axis、Kotak——通过网点、客户经理和手机银行分销个人贷款，其信用卡部门也替代 BNPL。相邻金融科技包括 LazyPay（PayU 旗下
              BNPL）、Indifi（聚焦 SME）、PaySense（PayU），以及 PhonePe、Paytm、Cred 等把信贷叠加到支付和奖励轨道上的
              superapp。现状替代品——黄金贷款、雇主工资预支、非正规放贷——在印度二、三线小额借款中仍占有可观份额。未来五年可能进入者包括持银行牌照的 neobank、PSU 银行基于 Account
              Aggregator 的产品，以及电商结账场景内的嵌入式信贷。
