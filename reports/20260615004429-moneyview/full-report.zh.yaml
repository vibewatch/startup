      - number: '4.5'
        title: 财务结论——收入质量、资本强度和尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              收入质量好坏参半。FY25 约 63% 收入来自第三方合作贷款机构的费用和佣金——每笔获客都会重复产生，但暴露于合作伙伴集中风险（前 10 大合作伙伴在 9M FY26 占 37.31%，FY25 占
              46.82%，无排他合同）。34% 的利息收入流部分来自自有资产负债表，但也部分带有 DLG 支撑的准表内风险。3% 的相邻业务收入（保险、数字黄金、UPI）是增量但规模小。利润率路径在 EBITDA
              层面健康（9M FY26 为 31.5%，FY25 约 ~30%），但净利层面受到财务和减值成本三倍跳升压迫。资本强度中等且上升：Rs 1,201 crore 非流动借款支撑 Rs 19,814 crore
              平台贷款簿（2025 年 12 月），意味着通过合作贷款机构和 DLG cover 存在显著表外杠杆。若要形成 IPO 级财务确信，尽调阻塞点包括：（a）缺少 cohort 级 LTV-to-CAC
              披露，无法用借款人生命周期价值校准 Rs 426 crore 广告开支；（b）前 10 大合作贷款机构的续约日历和收入分成表缺少详细披露；（c）具体 DLG 触发提款条件和历史实现率不透明；（d）缺少可与银行
              PL 经济性横向比较的公开毛利率等价口径。harro.com 的负面分析，是公开记录中与整体改善财务画像相对的负面信号。
            claimRefs:
              - CI031
              - CI032
              - CI033
              - CI034
              - CI035
              - CI036
              - CI037
