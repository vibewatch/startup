  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与论点破裂条件
        blocks:
          - type: paragraph
            body: >-
              Moneyview 已不再是概念验证阶段的金融科技公司；它是有规模的贷款编排方，有真实利润、真实合作分发，也已递交 IPO 文件。风险框架因此变了。核心问题不再是消费者是否需要数字信贷，而是 DLG
              义务、合作方集中度和 RBI 规则变化被充分压力测试之后，Moneyview 的轻资本架构还能否保持轻资本。新股发行本身说明了这一点：超过三分之二的一手募资将用于 DLG 支持和 NBFC
              资本，而不是纯进攻性增长。这并不致命——许多成功贷款机构会周期性补强资产负债表——但它意味着公开市场论点对风险成本和融资结构敏感，这与软件市场平台不同。实际的论点破裂点清晰且可测：IPO 后 DLG
              余额没有正常化，前十合作方集中度回升到 40% 以上，不良贷款率高于行业，非排他合作方把份额转向更大金融科技公司，或 RBI 再次收紧 LSP 和 BNPL
              规则。最强缓释因素是公司当前盈利、正式申报文件，以及部分信用指标仍好于行业平均。即便如此，剩余敞口无疑高于“轻资本金融科技”这个标题标签暗示的水平。
