      - number: '1.4'
        title: 里程碑时间线和核心规模指标
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的时间线从 2014 年作为个人财务追踪 App（Whizdm）创立开始，2017–2019 年转向 Moneyview 品牌下的借贷业务，2022 年完成 Series D / Series
              E 双轮扩张，FY22 转正盈利，FY23–FY25 收入从 ₹648.1 crore 复合增长至 ₹2,339 crore，约 75% 同比增长；2025 年 6 月改制为公众有限公司，并在 2026 年 3
              月提交 ₹3,000 crore DRHP，Axis Capital、BofA Securities、IIFL Capital 和 Kotak Investment Banking 担任 book-running
              lead managers。按 DRHP 采用的 2025 年 12 月截止日，平台已有 125.49 million 注册用户、9.73 million 变现用户、50 million+ Google Play
              下载量、36 lakh+ Google Play 评论且评分 4.8★，覆盖印度 99.55% 的 pin code 和 18,400+ 个活跃 pin code，79% 用户来自小城镇。Moneyview
              平台活跃贷款簿达到 ₹19,814 crore，WFPL 在截至 2025 年 12 月的九个月发放 ₹5,429.6 crore，同比增长 38%。规模之下也有负面信号：harro.com 2026 年 3
              月指出，RBI 监管不确定性和贷款违约上升（FY25 减值费用约增至三倍）可能在 IPO 窗口压迫运营模式。
