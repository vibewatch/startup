      - number: '7.5'
        title: 运营、竞争、渠道与关键人风险
        blocks:
          - type: paragraph
            body: >-
              运营和竞争风险没有 DLG / 合作方 / 监管栈那样生死攸关，但很容易触发二阶损害。分发引擎仍高度依赖 App，这意味着 Android 平台政策、应用商店信任信号或排名下滑，可能比多数 B2B
              贷款机构预期更快地打到获客量。同业也在升级。PhonePe 推进抵押贷款、拥有庞大支付分发和更宽监管覆盖，显示支付超级 App 多快就能变成贷款竞争者。Mint 和 Business Standard 关于
              PhonePe、CRED、Paytm 的报道也说明，在监管压力下产品形态可能被重做或收缩，品类竞争比静态市场份额表暗示的更动态、更难预测。内部看，Moneyview 仍明显由创始人驱动，因此治理和执行负荷仍集中在
              Puneet Agarwal 和 Sanjay Aggarwal
              身上。最后，产品宽度是双刃剑：信用卡、保险、数字黄金和支付带来交叉销售上行，但每增加一条轨道或一张牌照，就多一处合规、安全和合作方流程风险。因此观察这家公司，正确方式是看合作方留存、DLG 趋势、App
              健康度和披露事件强度组成的仪表盘，而不是只看收入增速。
