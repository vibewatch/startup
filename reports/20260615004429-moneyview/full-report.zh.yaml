  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础、分层，以及买方 / 用户 / 付款方映射
        blocks:
          - type: paragraph
            body: >-
              Moneyview 经营的是纯零售、B2C 的信贷分发业务。产品用户是印度消费者：安装 Moneyview Android App，免费查询 CIBIL 信用分，再申请个人贷款、商业贷款、信用卡、BNPL
              额度、保险、数字黄金、已赚工资预支或房贷转介。付款方要么是终端借款人（向贷款方支付利息和费用），要么是合作贷款方 / 保险公司（向 Moneyview 支付获客费或佣金）。Moneyview
              企业侧产品——获客与承保即服务——的买方是合作贷款方（15+ 家，包括 Aditya Birla Capital、Northern Arc、Vivriti Capital、Oxyzo）和保险公司（IRDAI
              复合公司代理 CA0925）。DRHP 和聚合平台页面披露的借款人分层明显偏向小镇印度：79% 用户位于 Tier II / III 及以下地区，平台声称覆盖 18,400+ 个邮编（约占印度邮编
              99.55%），60%+ 获批贷款金额流向 35 岁以下借款人。按 RBI / FACE 数据，女性借款人在数字 NBFC 放款行业中约占 18%，这是目前最接近 Moneyview
              结构的公开基准。DRHP、Inc42 画像、BankBazaar 产品评测、IBEF / 数字 NBFC 市场数据相互印证了地域、年龄和渠道偏斜；公开资料没有按客群披露 SKU 级收入结构。
