      - number: '1.3'
        title: 资本基础、估值路径和利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Moneyview 自成立以来已完成五轮定价股权融资，累计超过 US$230 million；早期由 Accel India 和 Nexus Venture Partners 领投，增长轮引入 Tiger
              Global Management、Apis Partners、Winter Capital、Evolvence India、Ribbit Capital 和 Lok Capital。2022 年 3 月
              Series D 中，Tiger Global、Winter Capital、Evolvence 和 Accel 合计投入 $75 million，公司估值约 $625 million。2022 年 12
              月，Apis Partners 领投、Tiger Global、Winter Capital 和 Evolvence 参投的 $75 million Series E 将投后估值推至 $900
              million；2023 年的后续交易把公司推过独角兽门槛，估值约 $1.2 billion。2026 年 3 月提交给 SEBI 的 DRHP 确认，本次交易包括 Sanjay Aggarwal、Puneet
              Agarwal、Chitra Agarwal、Accel、Apis Partners、Ribbit Capital、Internet Fund III、Crimson Winter、Lok
              Capital、Evolvence India Fund IV、NLI Strategic Venture Investment、TI JPNIN India Holdco、TI Platform SMRS
              SMA 和 DI Investment 出售的 136,095,900 股 OFS，同时配套 ₹1,500 crore 新股发行，总交易规模 ₹3,000 crore。公司最近一次已披露债务融资发生在 2025
              年 11 月 26 日，用营运资金授信补充股本，支持 WFPL 表内放款。
