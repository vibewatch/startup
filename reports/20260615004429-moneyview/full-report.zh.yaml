            title: 财务、减值和 DLG 成本在 FY25 增至三倍
            body: >-
              财务成本（Rs 370 cr）、减值和核销（Rs 346 cr，其中 Rs 246 cr 为核销）以及 DLG 费用（Rs 321.7 cr）在 FY25 均约增至同比三倍。这三项合计吞掉 Rs 1,038
              cr，约占 FY25 收入 44%，也是净利率从 FY24 约 ~12.7% 压缩到 FY25 约 ~10.3% 的结构性原因。
