      - number: '8.3'
        title: IPO 定价含义与公开市场准备度
        blocks:
          - type: paragraph
            body: >-
              相比许多印度金融科技候选公司，Moneyview 已明显更适合进入公开市场，因为公司已经展示真实收入、真实利润，并递交 DRHP。这一点重要。市场不再只被要求承保增长或 TAM。不过，IPO
              质量不只看经审计收入。募资用途很能说明问题：Rs 650 crore 将投向 DLG 支持，Rs 450 crore 投向 NBFC
              资本。这意味着一手募资一部分是进攻性增长资金池，另一部分则是为仍会把借款人损失传导为公司现金消耗的架构补强资产负债表。OFS 结构提供了第二个估值信号。成熟 IPO
              中，创始人和早期投资者获得流动性很正常，但公开市场买方会注意到出售名单很宽，且部分早期投资者正在变现非常大的年份收益。Paytm 过高定价争议和 2026 年更宽金融科技 IPO
              评论的教训因此直接相关：公开市场投资者现在更看重盈利、治理、风险吸收和定价纪律，而不是标题式用户数。Moneyview 比过去的故事股金融科技更好地跨过许多门槛，但还没有强到可以让投资者在没有上市折价和 IPO
              后执行证明的情况下，支付溢价贷款机构倍数。
