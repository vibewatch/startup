  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 独角兽估值证据与估值信号质量
        blocks:
          - type: paragraph
            body: >-
              Moneyview 当前最好的私募市场锚点，是 2024 年 9 月一轮融资：公司以每股 Rs 64.15 发行 60,23,382 股后，估值被推至约 Rs 10,086 crore，即约 $1.2
              billion。Entrackr、Entrepreneur India 和 The Times of India 都指向同一个配售后数值，也指向同一批主要参投方 Accel India 和 Nexus
              Ventures。这足以把独角兽估值视为真实，但不足以把它视为充分发现的公允价值。该轮本身规模很小——只有约 Rs 38.64 crore，或 $4.65
              million——这意味着估值抬升建立在有限一手资本之上，而不是大额、定价意义强的机构融资。相较 2022 / 2023 年约 $900 million 的背景，2024 年升至 $1.2 billion
              也有意义，但并不狂热；它意味着约三分之一上调，而不是登月式跃迁。实际看，这个信号比炒作轮更可信，但不如大型 crossover 轮或已完成 IPO
              簿记权威。投资者因此应把独角兽估值作为中心参考点，而不是证明公开市场一定支付更高价格的破顶证据。
