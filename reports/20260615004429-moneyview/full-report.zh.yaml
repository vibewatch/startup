      - number: '3.4'
        title: 护城河耐久性、转换成本和替代风险
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的护城河落在四根支柱上：面向薄信用档案和二、三线借款人调校的自研信用评分模型；能以接近零 CAC 提升生命周期价值的多产品交叉销售界面；受监管牌照支撑的保险和借贷栈（IRDAI
              CA0925、RBI LSP 合规、ISO 27001:2022）；以及 50 million+ 安装基数和 4.8 星口碑带来的规模经济。个人借款人的转换成本很低——App 免费下载、KYC
              可迁移、没有合同锁定——所以护城河主要来自分销和数据，而不是合同。多栖使用是常态：Paisabazaar 式聚合器和 Fibe 披露的 8,500+ 合作伙伴关系表明，借款人通常在提款前跨两三个 App
              比价。替代风险来自三端。第一，既有银行——HDFC、ICICI、SBI、Axis、Kotak——越来越多向现有账户持有人提供预审批移动个人贷款，APR 更低，从利率端侵蚀城市工薪客群。第二，Navi
              的银行牌照路径可能给它带来结构性资金成本优势，纯 LSP 难以匹配。第三，RBI Digital Lending Guidelines（2022 年 9 月 / 2024 年 11 月）和 2026 年 2 月
              DLG 框架重置限制 LSP 能为合作贷款机构承接多少风险，从而限制 Moneyview 借 DLG cover 扩大息差的能力。harro.com 对 Moneyview DRHP
              的分析特别点出合作伙伴集中度（前 10 大 = 收入 37-47%，无排他合同）和 DLG 驱动的信用成本是耐久性风险。承保层商品化风险真实存在：随着 Account Aggregator
              让银行流水聚合数据变成普遍可编程，薄信用优势会收窄。
