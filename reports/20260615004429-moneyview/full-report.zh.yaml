  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 2026 年指标
      - 倍数 / 估值状态
      - 与 Moneyview 的相关性
      - 局限
    rows:
      - - Moneyview 按独角兽估值隐含
        - FY25 收入约 Rs 2,339 crore
        - 隐含约 4-5x 市销率
        - 目前最贴近公司本身的私人市场锚点
        - 私募轮估值，深度有限，且没有公开价格区间
      - - Bajaj Finance
        - 2026 年 6 月公开快照
        - 17.2x EV/收入；26.3x P/E；4.37x P/B
        - 显示高溢价上市贷款机构的天花板
        - 其品牌和披露基础太强，不适合作为公平的直接倍数
      - - SBI Cards
        - 2026 年 6 月 15 日公开快照
        - 5.5x EV/收入
        - 有用的中个位数上市消费信贷锚点
        - 信用卡发行商经济模型不同于 LSP + NBFC 组合
      - - Paytm
        - FY26 重估备忘
        - 约 8.9x 收入
        - 公开重估后的金融科技 IPO 警示性倍数
        - 支付 / 商业组合不同于数字借贷
      - - PhonePe
        - FY26 重估备忘
        - 约 11-12x 收入
        - 显示规模和生态宽度如何支撑更高的私人 / crossover 框架
        - 并非纯贷款机构，且支付分发能力大得多
      - - Fibe
        - 计划 2026 年 IPO
        - 目标估值 >$1B
        - 有公开市场雄心的印度数字借贷同行
        - 尚未完成价格发现
      - - Lending & Credit 板块平均
        - Finro 2026 年 Q1
        - 11.8x EV/Revenue 平均
        - 勾勒更广泛的全球可比背景
        - 平均值高于经风险调整后的印度交易可能出清水平
    notes: 可比对象用于给区间定边界，而不是机械推导单一目标价。Moneyview 既不是纯信用卡发行商，也不是纯 SaaS 式金融科技公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most decision-relevant public and private valuation references surfaced in the reviewed 2026
        source set; several Indian private peers remain too opaque for a defensible apples-to-apples multiple transfer.
    claimRefs:
