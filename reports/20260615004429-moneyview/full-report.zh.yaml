      - number: '4.3'
        title: 成本结构、利润率驱动和减值
        blocks:
          - type: paragraph
            body: >-
              FY25 费用基础 Rs 2,059.3 crore 的拆分如下。最大单项是广告和促销开支，Rs 426.5 crore（约占费用 ~21%）。财务成本 Rs 370 crore，约为 FY24
              的三倍，反映出公司增加借款为 WFPL 表内贷款簿融资；该贷款簿在 9M FY26 放款 Rs 5,429.6 crore，较 FY25 的 Rs 3,933 crore 跳增 38%。组合贷款减值和核销在
              FY25 合计 Rs 346 crore，同样约为同比三倍，其中明确核销 Rs 246 crore。Default Loss Guarantee（DLG）费用是 Moneyview
              针对合作贷款机构获客信用表现计提的现金流出，FY25 为 Rs 321.7 crore，9M FY26 DLG 未偿余额达到 Rs 847 crore。员工福利费用 Rs 222.5 crore（增长
              42%），外包服务成本 Rs 196.6 crore。尽管财务和减值成本增至三倍，FY25 净利润仍达到 Rs 240.3 crore（高于 FY24 的 Rs 171.1 crore、FY23 的 Rs
              162.6 crore 和 FY22 的 Rs 17.7 crore；FY22 是公司在 FY21 亏损 Rs 47 crore 后首次盈利）。FY25 净利率约 10.3%，低于 FY24 约
              12.7%，原因是减值和财务成本增速快于收入。9M FY26 EBITDA 利润率约 31.5%（Rs 748.6 crore / Rs 2,373
              crore），说明在持续增长投入下利润率仍扩张。严格会计意义上的毛利率未单独报告，因为 Moneyview 不是商品公司；最接近的口径是收入扣除减值和 DLG 费用，据此 FY25 推断借贷利润率约
              ~50-60%。
