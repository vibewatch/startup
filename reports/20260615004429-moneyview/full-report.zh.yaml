      - number: '5.3'
        title: 运营架构——信用评分、AA 轨道、UPI、安全
        blocks:
          - type: paragraph
            body: >-
              运营架构是移动优先 Android，并通过 API 接入征信机构（CIBIL / TransUnion India 等）、Account Aggregator 框架（由 Sahamati 和 RBI master
              directions 管辖）以及 NPCI 的 UPI 轨道。承保通过自研信用评分模型运行，模型基于替代数据训练——银行流水交易、SMS /
              设备信号、账单支付历史——向传统纯征信模型无法覆盖的薄信用档案和新入信贷借款人提供信用。AA 框架让受监管实体在用户同意后以程序化方式取得银行流水数据；Moneyview 接入该框架，以降低 AA
              之前上传银行流水的摩擦。UPI 支付和放款跑在 NPCI 轨道上——UPI 目前是印度主导的零售支付系统。安全控制界面包括 256-bit 加密层和 ISO 27001:2022 认证的 Information
              Security Management System（ISMS），后者是 ISO/IEC 维护的 ISMS 控制国际标准。RBI 合规覆盖 Digital Lending Guidelines（2022 年 9
              月 + 2024 年 11 月）中关于 LSP-NBFC 合同边界、费用传递和冷静期的规则，以及定义 LSP 可承接多少合作贷款机构信用风险的 DLG 框架。IRDAI 合规覆盖保险分销
              corporate-agent composite 牌照 CA0925。NBFC 合规覆盖 2022 年 3 月 RBI Microfinance Directions 下最小票据 cohort（尽管
              Moneyview 产品组合高于 MFI 边界）。完整架构闭源，公司未向第三方集成商发布开发者 SDK 或 API 规格。
