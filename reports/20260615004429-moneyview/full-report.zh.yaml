      - number: '4.2'
        title: GTM 动作、销售效率和单位经济性
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的 go-to-market 是 App 优先、效果营销驱动。Android App 累计安装 50 million+、Google Play 评分 4.8 星，是主要获客界面；SEM、来自
              BankBazaar 和 Paisabazaar 式聚合器的合作伙伴转介，以及 18,400+ pin code 覆盖补充获客，后者支持二、三线城市自然发现。FY25 广告和促销开支约 Rs 426.5
              crore，约占总费用 20%，支撑高速度、低接触的获客动作，与 KreditBee 和 Fibe 的打法相近。FY25 单位经济性约为每 Rs 1 收入对应 Rs 0.88 费用（总费用 Rs 2,059.3
              crore，对应收入 Rs 2,339 crore），给出可支撑已报告 Rs 698 crore EBITDA 的经营利润率区间。在未披露 CAC 的情况下，销售效率代理指标包括变现用户转化率（截至 2025 年
              12 月，125.49 million 注册用户中 9.73 million 为变现用户，转化率 ~7.8%）和 36.20% 年用户增长率；Rs 426 crore 广告开支折算为 FY25 每新增注册用户约
              Rs 187。LSP 收入流的渠道经济性受益于每笔获客不需要自有资产负债表资本；WFPL 表内收入流则受 RBI 要求的 NBFC 15% 资本充足率底线约束。信用卡、保险、数字黄金、BNPL 和 EWA
              的交叉销售经济性，在已获客用户上以接近零增量 CAC 提升 LTV，但公司尚未公布 cohort LTV-to-CAC。
