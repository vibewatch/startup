    rows:
      - - 数字无抵押个人贷款
        - 通过 App 发起、发放至零售银行账户的 Rs 5,000-Rs 10 lakh 个人贷款，包括 LSP 获客和 NBFC 表内放款。
        - 银行网点发起的个人贷款；抵押贷款；Rs 5 lakh 以上 SME 定期贷款。
        - 个人零售借款人（买方 = 用户 = 付款方）；合作 NBFC 或 WFPL 是登记贷款方。
        - 核心产品：Moneyview FY25 约 63% 收入来自费用 / 佣金，多数来自该细分。
      - - 小额商业贷款
        - 面向微型创业者、数字化发放的营运资金和商户贷款，额度最高 Rs 5 lakh。
        - Rs 5 lakh 以上的 MSME 定期贷款；设备融资；黄金抵押经营贷款。
        - 个体经营者 / 自雇个人。
        - 复用同一套 KYC 和信用评分栈的相邻增长产品。
      - - 数字 BNPL 和轻信用卡产品
        - 循环短期信贷产品（BNPL、Smart Pay）以及 App 发起的信用卡。
        - 通过网点分销的银行联名信用卡；签账卡。
        - 个人零售借款人；部分 BNPL 模式下商户支付交换费。
        - Moneyview 在 FY25 推出信用卡，并运营 BNPL/Smart Pay；这是叠在个人贷款之上的交叉销售层。
      - - 保险分销
        - 在 IRDAI 企业代理牌照 CA0925 下，通过借贷 App 销售寿险、健康险和车险产品。
        - 团体企业保险；通过银行网点开展的银保业务。
        - 零售消费者支付保费；保险公司向 Moneyview 支付佣金。
        - 手续费收入多元化；复用同一 KYC 客群；零 CAC 附加销售。
      - - 数字黄金和 UPI 支付
        - Moneyview App 内可使用的数字黄金积累和 UPI 支付通道。
        - 实物黄金贷款；商户侧银行卡收单。
        - 零售用户；支付通道通过间接方式变现。
        - 把用户导入借贷引擎、支撑参与度指标的相邻业务。
      - - 小额金融贷款（范围外）
        - RBI《2022 年小额金融指引》监管下的 MFI 联保和个人贷款。
        - 不纳入本章边界；按 RBI 行业数据单独测算。
        - 农村 / 低收入家庭；SHG。
        - Moneyview 目前不经营小额金融；列入这里只是为了划清排除边界。
    notes: 定义沿用 FACE/RBI 对数字借贷的分类，并以 2026 年中 Moneyview 的产品面为准。保险和数字黄金虽然不是信贷产品，但 Moneyview 通过借贷 App 将其变现，因此纳入本章。
