      - number: '1.2'
        title: 创始人、领导层和关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Moneyview 由 Puneet Agarwal（CEO）和 Sanjay Aggarwal（CTO）于 2014 年共同创立。Puneet Agarwal 是 IIT 校友，曾任职
              McKinsey；之后在美国 Capital One 负责信用风险建模，并参与 Google 早期 Google Pay（Tez）在美国的工作，随后回到印度创办 Moneyview。Sanjay Aggarwal
              拥有二十多年技术经验，曾在 Infosys、Yahoo 任职，也曾创办 edtech 初创公司 Minglebox；在 Moneyview，他负责技术栈、自研信用评分模型和承保平台。2026 年 3 月
              draft red-herring prospectus 将两位创始人与家庭成员 Chitra Agarwal 一同列为要约出售股东，说明创始人家族即便在 IPO
              后仍保留实质经济和治理影响力。两位创始人之外，公开记录中的领导层披露很薄；已审阅的公开来源未披露独立董事名单、审计委员会主席或非执行董事名单，因此在 IPO 窗口期，公司对作为公众 CEO 和主要融资发声人的
              Puneet Agarwal 仍有较高关键人物依赖。
