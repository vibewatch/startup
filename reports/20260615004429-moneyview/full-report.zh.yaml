  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 维度
      - 看多论点
      - 反论点
      - 哪些变化会改变判断
    rows:
      - - 估值信号
        - 2024 年独角兽估值较新，且有已知投资方背书
        - 该轮融资规模小，价格发现并不充分
        - 有充分支撑的公开价格区间会提升判断信心
      - - 财务证明
        - FY25 和 9M FY26 数据显示公司已有真实规模和利润
        - 按 cohort 和合作伙伴拆分的持续性披露仍不够
        - IPO 后披露 vintage、cohort 和 DLG，会提升估值倍数质量
      - - 公开可比框架
        - 4-5x 销售额低于高溢价贷款机构区间，接近 SBI Cards
        - DLG 和集中度风险使其相较更干净的上市贷款机构应有折价
        - DLG 和合作伙伴组合若持续去风险，折价会收窄
      - - 市场背景
        - 2026 年 IPO 市场重新向更强的金融科技公司打开
        - 同一个市场也比 2021 年泡沫期严苛得多
        - 在纪律性定价下获得强劲机构需求，会改善情绪
      - - 战略位置
        - Moneyview 的产品宽度和盈利能力强于许多私人借贷同行
        - PhonePe、CRED 以及其他大型平台仍会压缩上行估值倍数空间
        - 若能证明竞争优势可持续、CAC 压力更低，会有帮助
      - - 建议
        - 公司应进入主动观察名单
        - 当前信号还不够便宜，不足以支撑高确信买入
        - 更好的价格或更充分的披露才是解锁点
    notes: 反论点聚焦估值质量和披露，而不是否认 Moneyview 的经营牵引力。
    claimRefs:
