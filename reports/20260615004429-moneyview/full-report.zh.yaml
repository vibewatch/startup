            body: >-
              直接同行之间，规模和融资差异明显。Moneyview 披露 125.49 million 注册用户、9.73 million 变现用户、50 million+ Android 安装、Google Play 4.8
              星评分且 36 lakh+ 评论，FY25 收入 Rs 2,339 crore、FY25 净利润 Rs 240.3 crore，并在 2026 年 3 月为 Rs 3,000 crore IPO 提交
              DRHP，基于 Series E 后约 ~$1.2 billion 的独角兽级估值。Fibe 披露 39 million App 下载、累计放款 Rs 40,000 crore+、8,500+
              合作伙伴；行业报道显示其近几个财年已盈利，但尚未提交 DRHP。KreditBee 同时作为 LSP 和 NBFC 运营，拥有多产品个人贷款栈，并明确面向新入信贷客户。Navi 与纯 LSP
              阵营不同：它通过母公司 Navi Technologies 公开上市，运营更重资产负债表的 NBFC，并在申请 small-finance-bank 牌照，因此其资金成本和资本充足叙事实质不同。CASHe
              聚焦与工资挂钩的短期限贷款。MoneyTap / Freo 运行信用额度结构，而非单笔放款贷款，收入模型在结构上不同。LazyPay 定位在商户结账 BNPL，而非独立个人贷款。Wikipedia、Fibe
              about 页面、CASHe about 页面和 KreditBee 自有营销网站共同印证了各同行的产品界面和目标客户。规模、App 评分、多产品界面和轻资本 LSP 经济性组合，让 Moneyview
              在纯数字贷款机构中处于可防守位置，但相较 KreditBee 和 Fibe，价格与票据规模的差距并不宽。
