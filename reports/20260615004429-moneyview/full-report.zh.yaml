  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时点
      - 对 Moneyview 的含义
      - 尽调问题
    rows:
      - - UPI 和智能手机渗透率
        - 驱动
        - 至 2030 年
        - 继续扩大 Tier II/III 城镇的可触达用户基数，并降低每个 PIN 码地区的获客成本。
        - 跟踪 Moneyview PIN 码覆盖从 18,400+ 往上的增长，以及自然安装占比。
      - - 账户聚合器框架
        - 驱动
        - 近期
        - 降低风控摩擦，提高薄档案借款人的批准率，并加快从软报价到放款的路径。
        - 核实 Moneyview 与合作贷款方的 AA 集成深度；量化批准率提升。
      - - 35 岁以下人群
        - 驱动
        - 5-10 年视角
        - 支撑小额个人贷款的量增长；FACE 报告称，批准金额中超过 60% 流向 35 岁以下借款人。
        - 衡量分 cohort 的复借率；核实用户是否留存并进入更高票面区间。
      - - RBI《数字借贷指南》（2022 年 9 月）
        - 约束
        - 已经生效
        - 强制费用穿透、冷静期和 LSP-NBFC 合同边界，抬高合规开销。
        - 按 RBI 规则审计 Moneyview 的 LSP 合同和客户费用披露。
      - - RBI《小额金融指引》（2022 年 3 月）
        - 约束
        - 已经生效
        - 对最小票面细分市场设置家庭收入和 EMI/收入上限；限制向 MFI 重叠地带激进扩张。
        - 确认 Moneyview 的产品组合仍在 MFI 边界之外（目前如此）。
      - - RBI DLG 框架重置（2026 年 2 月）
        - 约束
        - 正在成形
        - 合作贷款方名义下，LSP 到底能承接多少风险变得不确定；Moneyview FY25 DLG 费用为 Rs 321.7 crore。
        - 量化 Moneyview DLG 敞口占总放款的比例，并压力测试新规则情景。
      - - 90 天 DPD 轨迹（FACE）
        - 约束
        - 实时信号
        - DPD90 从 2023 年 3 月的 3.3% 改善到 2025 年 12 月的 1.9%，但仍然不可忽视；Moneyview FY25 减值同比增至三倍。
        - 用 50-100bps 的 DPD 冲击压力测试 Moneyview 信贷成本。
      - - 第三方负面分析（harro.com）
        - 约束
        - 当前
        - Harro 将监管不确定性和贷款违约上升列为直接影响 Moneyview IPO 经济性的风险。
        - 作为已保留的负面信号处理；待 SEBI 最终 RHP 风险因素章节后复核。
      - - 线上渠道获取（约 80% 份额）
        - 驱动
        - 当前
        - Business Today 报道称，数字渠道拿下线上借贷市场约 80% 份额；新增业务流量已是数字优先。
        - 测算 Moneyview 在 Q1-Q3 FY26 批准 Rs 97,381 crore 资金池中的流量份额。
    notes: 驱动和约束逐项对应 RBI 通知及 FACE/IBEF 数据；负面行内嵌在表里，避免本章显得一边倒乐观。每个约束都带有具名尽调问题，Moneyview 的 IPO 承销商应逐项压力测试。
