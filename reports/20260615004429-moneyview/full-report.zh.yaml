      - number: '6.5'
        title: 扩张、交叉销售、合作方集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              扩张有两台引擎。第一台是在既有用户中做交叉销售——FY25 在个人贷款、商业贷款、BNPL、保险、数字黄金、UPI 支付、房贷转介之外增加信用卡和已赚工资预支，能在 CAC
              不按比例增加的情况下抬高单变现用户收入。第二台是地理下沉——18,400+ 个邮编的覆盖已经触达约 99.55% 邮编，因此印度境内后续地理扩张更多是深度（更深打进 Tier IV /
              V），不是广度。客户侧集中度风险结构上较低，因为账本是颗粒化零售——没有单一借款人占 Rs 19,814 crore 贷款账本的显著比例。合作贷款方侧集中度风险则实质存在：前 10 大金融合作方在 FY26 前
              9 个月贡献 37.31% 收入（低于 FY25 的 46.82%），且没有排他合同。渠道风险是单向量的——几乎所有变现都经 Android App 漏斗，没有披露有意义的 Web App、网点或 DSA
              驱动量；如果 Google Play 排名、应用商店信任信号或 Android 平台政策转差，变现量会直接受冲击。反向触发项——合作贷款方续约和 DLG 上限变化（RBI 2026 年 2 月恢复 NBFC 的
              DLG 框架，但保留更紧覆盖上限）——是客户经济引擎最值得监控的集中度致命触发器。
