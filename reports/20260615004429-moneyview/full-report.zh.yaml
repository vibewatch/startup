        title: 图表
        blocks:
          - type: callout
            title: 轻资本收入基础叠加多年盈利
            body: >-
              Moneyview 自 FY22 起盈利（Rs 17.7 cr），FY25 净利润增至 Rs 240.3 cr，9M FY26 达 Rs 209.7 cr，同时 FY25 收入约 ~74% 同比增长。63%
              LSP 费用结构说明，核心业务轻资本，随获客和放款量扩张，而不为每笔贷款消耗自身资产负债表股本。
