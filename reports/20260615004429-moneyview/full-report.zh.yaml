              采用漏斗从 App 安装 / 注册 → CIBIL 查分 → 贷款申请 → 变现。到 2025 年 12 月（FY26 前 9 个月截止），注册用户 / 独立访客达到 125.49 百万，高于 FY25 的
              109.59 百万（9 个月增长 14%，年化约 36%）。变现用户（至少购买过一项产品）从 FY25 的 7.45 百万增至 FY26 前 9 个月的 9.73 百万（9 个月增长 31%，年化约
              41%）。Google Play 累计安装超过 50 百万，评论 36 lakh+，平均 4.8 星，在印度前五大数字贷款 App 中最高。WFPL 自有 NBFC 放款在 FY26 前 9 个月达到 Rs
              5,429.6 crore，比 FY25 全年 Rs 3,933 crore 高 38%。2025 年 12 月，Moneyview 平台贷款余额为 Rs 19,814 crore，覆盖 WFPL
              表内和合作贷款方表外敞口。FY26 Q1-Q3 行业平均票额为 Rs 15,493（同比增长 18%），数字 NBFC 品类在 FY25 发放 10.9 crore 笔贷款、金额 Rs 1.06 lakh
              crore，这给 Moneyview 在数字 NBFC 个人贷款池中约 8-9% 的量份额提供了分母。变现率代理指标——变现用户 / 注册用户——FY26 前 9 个月约为 7.8%，较 FY25 约 6.8%
