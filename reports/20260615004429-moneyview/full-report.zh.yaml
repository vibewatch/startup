      - number: '6.4'
        title: 留存、复购、满意度与队列耐久性
        blocks:
          - type: paragraph
            body: >-
              明确留存披露是 Moneyview 客户章节最大的一处证据缺口。DRHP 没有披露机构投资者通常会要求的净收入留存（NRR）、总收入留存（GRR）、30 / 60 / 90 / 180
              天复贷率，或月度队列还款曲线。已有披露只能给方向。（1）变现用户从 7.45 百万（FY25）增至 9.73 百万（FY26 前 9 个月），说明复购变现行为有一定规模；同期注册基数仅净增 15.9 百万，因此
              2.28 百万净新增变现用户中，一部分是跨品类购买的复购用户。（2）行业层面 90 天 DPD 从 2023 年 3 月的 3.3% 降至 2025 年 12 月的 1.9%，显示 Moneyview
              承保的队列在信用侧更耐久。（3）Google Play 上 36 lakh+ 评论、4.8 星评分可作为满意度代理——相对同业较高，但消费金融科技 App 常在放款后引导评价，评分会被抬高。（4）平均票额同比增长
              18% 至 Rs 15,493，意味着单借款人钱包份额在提升。（5）负面评论主题（harro.com 指出监管不确定性和贷款违约担忧）提示剩余 NPA 波动仍在，即便公司已在 FY25 核销 Rs 246
              crore。公开资料没有队列级复贷或 NRR 数据。
