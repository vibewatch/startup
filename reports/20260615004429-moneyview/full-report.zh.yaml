        - 现有独角兽标记可用，但并不显然便宜
      - - 当前最佳私募锚点
        - ~$1.2B 独角兽标记（2024 年 9 月）
        - 作为中心参照，而不是保证能在公开市场出清的价格
      - - FY25 收入锚点
        - Rs 2,339 crore（~$280M）
        - 在独角兽标记下，支持 4 倍出头到 4 倍中段的销售倍数视角
      - - 公开市场可比锚点
        - 更接近 SBI Cards，而不是 Bajaj Finance
        - 中个位数销售倍数比优质贷款机构倍数更站得住
      - - 上调触发
        - 纪律性的价格区间，加上 DLG / 集中度披露改善
        - 可能支持从跟踪转为买入
      - - 下调触发
        - 激进定价，或 DLG / 合作伙伴 / 信用指标恶化
        - 会把判断推向观察或放弃
    notes: 该建议明确受价格和风险约束，并非对公司质量的泛泛定论。
