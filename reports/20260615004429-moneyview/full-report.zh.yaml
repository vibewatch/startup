  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和运营模式
        blocks:
          - type: paragraph
            body: >-
              Moneyview Limited 是一家总部位于 Bengaluru 的消费金融科技公司，运营轻资本数字借贷平台。法律实体最初于 2014 年以 Whizdm Innovations Private
              Limited 成立，后更名为 Moneyview Private Limited，并在 2025 年 6 月为筹备首次公开募股改制为名为 Moneyview Limited
              的公众有限公司。根据公司自有条款与条件页面披露，注册办公室位于 17/1, 1st and 2nd Floor, The Address Building, Outer Ring Road,
              Marathahalli, Kadubeesanahalli, Bangalore – 560103, Karnataka。Moneyview 主要把自己定位为 Lending Service
              Provider（LSP），代表 Aditya Birla Capital、Northern Arc、Vivriti Capital、Oxyzo 等 15+ 家合作贷款机构获客并服务信用产品，同时也运营自有
              RBI 持牌 NBFC 子公司 Whizdm Finance Private Limited（WFPL），用于直接表内放贷。公司获得 ISO 27001:2022 认证，并持有注册号 CA0925 的 IRDAI
              corporate-agent（composite）牌照，支撑保险分销业务。当前产品界面覆盖个人贷款、商业贷款、住房贷款、信用卡、Buy Now Pay Later、保险、数字黄金、UPI 支付和免费 CIBIL
              信用分监测。
