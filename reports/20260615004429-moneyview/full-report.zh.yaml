      - number: '7.2'
        title: 监管、RBI 与 DLG 结构性风险
        blocks:
          - type: paragraph
            body: >-
              监管栈是最结构性的单一风险，因为它不仅管合规成本，也管 Moneyview 核心产品设计的经济性。RBI 2025 年 Digital Lending Directions 整合了 RE-LSP
              安排、报告、数据处理和 DLG 结构规则，并明确覆盖 DLG 安排的上限、NPA 确认、调用、期限和披露。相较 2022–2023 年，这减少了模糊地带，但也几乎不给产品即兴创新留空间。Moneyview 自身
              IPO 相关评论坦承，RBI 围绕 DLG 上限、BNPL 规范和核心贷款职能外包的干预，可能改变产品策略和单位经济。AMLEGALS 的 BNPL 分析把实际含义讲清楚：借款人到 RE
              的资金流、正式披露和直接合同关系变成强制要求，曾经让金融科技比受监管资产负债表扩得更快的灰区灵活性大多被拿掉。Moneyview
              向信用卡、保险、支付和其他邻近品类扩张，拓宽了变现面，也拓宽了受审查边界。Whizdm Finance
              的网络损失披露强调了二阶监管点：公司上市后，技术和数据事件不只是运营问题，也会成为治理和合规事件，并可能带来资本后果。
