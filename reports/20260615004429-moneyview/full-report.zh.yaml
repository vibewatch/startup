        title: 资本充足率、资产负债表和 IPO 融资触发
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 3 月 31 日（FY25 期末），Moneyview 报告流动资产总额 Rs 4,198.4 crore，其中现金和银行余额 Rs 1,067.7 crore；非流动借款 Rs 1,201
              crore。WFPL 这个 NBFC 子公司必须维持 RBI 要求的 15% 资本充足率（CAR），限制表内放贷速度。轻资本 LSP 分部每笔获客不需要自有资产负债表资本，但与合作贷款机构的 DLG
              安排在组合信用恶化时会对 Moneyview 形成或有现金索偿；这就是 FY25 财务和减值成本即便在 LSP 收入流增长时仍增至三倍的结构性原因。Moneyview 于 2026 年 3 月向 SEBI 提交
              DRHP，计划 Rs 3,000 crore IPO，包括 Rs 1,500 crore 新股发行，以及创始人、Accel、Apis Partners、Ribbit Capital、Lok
              Capital、Evolvence India Fund IV 和其他早期投资者出售 136,095,900 股的 Offer for Sale；公司也披露了 Rs 300 crore pre-IPO
              placement。新股发行所得将用于一般公司用途、向 WFPL 注入监管资本和产品开发——这是印度金融科技 NBFC 上市后典型资金用途。IPO 后的下一个融资触发点，是围绕 2025 年 11
              月最近一次债务融资节奏发行债务，以支持 WFPL 放款继续增长。harro.com 对 DRHP 的负面分析特别指出，监管不确定性（2026 年 2 月 RBI DLG 框架重置、BNPL
              规则变化）和贷款违约率是 IPO 后财务轨迹的直接风险。
