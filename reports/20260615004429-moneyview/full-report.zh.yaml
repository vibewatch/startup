      - number: '8.5'
        title: 入场纪律、论点破裂触发项与建议
        blocks:
          - type: paragraph
            body: >-
              最有防御力的立场是以中等信心、高风险继续跟踪。这个建议并不是看空公司运营证明；它对价格敏感。Moneyview 有足够实质：真实
              IPO、真实利润、有意义的客户基础，以及比许多私有金融科技更好的证据。但公开市场投资者仍缺最终价格区间、详细队列和 DLG
              实现历史，以及合作方续约经济性的完整可见度。这些缺口正是让一家尚可的公司难以成为明确买入的因素。因此入场纪律应明确。如果最终 IPO
              区间只比当前独角兽估值有温和溢价，如果上市后季度披露改善合作方和信用透明度，并且 DLG 强度相对放款规模下行，投资者可以上调判断。反过来，如果定价超出中个位数销售倍数所能支撑的范围，如果合作方集中度恶化，或新的
              RBI / 信用表现意外揭示公司承担的隐藏风险高于 IPO 叙事，论点就会破裂。这里“合理”是准确用词：不够便宜，不能买入；不够脆弱，不能放弃；也没有不透明到只能继续研究。
