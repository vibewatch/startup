      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 仅使用运行日期可取得的公开证据，按 IC 口径对市场、验证、护城河、经济性、风险和估值支撑打 1–5 分。
    data:
      items:
        - id: market
          label: 市场机会
          value: 4/5
          detail: 印度数字借贷市场仍然很大，许多消费者细分领域渗透率依旧偏低。
          tone: positive
          claimRefs:
            - CV011
            - CV016
        - id: proof
          label: 运营验证
          value: 4/5
          detail: FY25 和 FY26 前 9 个月的收入与利润都是真实数据，证明力强于多数私有金融科技公司。
          tone: positive
          claimRefs:
            - CV006
            - CV007
        - id: moat
          label: 护城河耐久性
          value: 3/5
          detail: 产品宽度和分发有意义，但合作伙伴依赖和大型同业限制了防御力。
          tone: neutral
          claimRefs:
            - CV016
            - CV017
            - CV026
        - id: economics
          label: 经济性质量
          value: 3/5
          detail: 利润真实存在，但 DLG 和集中度削弱了倍数干净度的可信度。
          tone: neutral
          claimRefs:
            - CV022
            - CV025
        - id: risk
          label: 风险画像
          value: 2/5
          detail: 监管、合作伙伴和信贷质量风险让风险评分保持高位。
          tone: negative
          claimRefs:
            - CV025
            - CV039
        - id: valuation
          label: 估值支撑
          value: 3/5
          detail: 独角兽估值站得住，但相对公允价值折让不够，难以形成明确的上行不对称。
          tone: neutral
          claimRefs:
            - CV001
            - CV008
            - CV037
        - id: evidence
          label: 证据质量
          value: 3/5
          detail: 申报文件和财务证据尚可，但最终定价和耐久性数据仍待补齐。
          tone: neutral
          claimRefs:
            - CV021
            - CV040
    approximationNotes: 评分是定性的，只用于 IC 相对框架，不是机械模型输出。
    claimRefs:
      - CV006
      - CV007
      - CV016
      - CV022
      - CV025
      - CV037
      - CV039
      - CV040
