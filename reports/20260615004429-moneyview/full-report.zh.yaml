  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻品类和现状替代品
        blocks:
          - type: paragraph
            body: >-
              本报告覆盖的市场是印度受 RBI 监管、数字化、移动优先的消费信贷市场，包括无抵押个人贷款、小额 Buy Now Pay Later（BNPL）、App 获客信用卡、微型和小型商业贷款，以及与借贷 App
              并行的消费保险和数字黄金分销层。纳入的支出包括通过数字界面发放给零售和自雇借款人的每一笔贷款，也包括依附于借贷产品赚取佣金的保险和黄金分销。边界之外包括批发企业贷款、遵循 MFI Directions 的 RBI
              监管小额信贷、传统银行网点获客个人贷款、依赖线下抵押品处理的汽车贷款和黄金贷款等有抵押零售贷款，以及非正规放贷。Moneyview 产品组合的现状替代品包括传统银行（HDFC、ICICI、SBI
              个人贷款网点）、大型银行信用卡部门、雇主工资预支、黄金贷款（小城镇长期替代品）和非正规贷款人；同一 Moneyview 用户可能转向的相邻产品包括 Slice 等仅做卡的金融科技、neobank 基于
              account aggregator 的信用额度，以及 MobiKwik 等 PPI 钱包。
