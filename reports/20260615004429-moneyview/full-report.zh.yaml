      - number: '7.4'
        title: IPO 时点、稀释与公开市场解读风险
        blocks:
          - type: paragraph
            body: >-
              Moneyview 正试图在已经达到独角兽地位、拥有真实收入和利润之后进入公开市场；这个底盘比 2021
              年投机性金融科技上市强得多。但执行风险不会因此消失。募资用途质量很关键，因为公开市场会看到一手募资中很大一部分用于支持 DLG 覆盖和 NBFC
              资本，而不是纯产品或分发燃料。供给结构也重要：创始人和多名早期投资者通过 OFS 出售股份，MediaNama
              对投资年份分布的分析说明了为什么市场会审视这一点——部分投资者的入场价格远低于后期持有人。市场背景也比周期高点更严苛。Paytm IPO
              后的经历仍是典型警示：如果治理、盈利路径或定价纪律受到质疑，规模和品牌也无法让金融科技公司免于估值压缩。Moneyview
              自身利润和规模强于那个案例，但公司仍缺少部分公开耐久性数据——还款队列、收入分成阶梯、已实现 DLG 提取历史——这些通常是 IPO
              投资者在支付完整成长型贷款机构倍数前会要的材料。因此建议应转向紧密跟踪簿记建档纪律，而不是假设上市后单向重估。
