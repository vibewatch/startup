      - number: '7.3'
        title: 信用品质、DLG 现金敞口与合作贷款方集中度
        blocks:
          - type: paragraph
            body: >-
              承保风险混合了借款人质量和交易对手结构。借款人侧，Moneyview 自行披露的年化坏账率为 6.9%，仍低于 IPO 报道引用的 9.35% 行业基准，这是正面信号。但 CRIF
              数据也准确指出风险位置：在相关近期队列窗口中，Rs 10,000 以下小额无抵押个人贷款逾期增加 44%，薄档案或无评分借款人在数字贷款漏斗中的占比正在上升。这一点重要，因为 Moneyview
              明确服务普惠属性更强、Tier-II/III、新入信用体系的客群。交易对手侧，DLG 架构会把借款人压力转化为公司直接成本。公司披露 DLG 余额 Rs 847 crore，通过 DLG 合作促成 Rs
              9,165.7 crore，并仅在 FY26 前 9 个月确认 Rs 318.8 crore 的 DLG 费用。合作方集中度进一步放大信用风险：前十大合作方仍贡献 FY26 前 9 个月收入的
              37.31%，FY25 为 46.82%，且这些关系非排他。DLG
              披露页还通过若干很大的合作方桶给出另一层集中度视角。简单说，这组风险不需要系统性信用冲击才会显性化；几个表现不佳的队列，或几个合作方份额流失，就可能足以让股权故事大幅重估。
