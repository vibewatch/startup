      - number: '8.4'
        title: 熊 / 基准 / 牛情景框架
        blocks:
          - type: paragraph
            body: >-
              合适的情景框架从现有独角兽估值开始，再问公开市场可能奖励或惩罚什么。熊情景下，市场把 Moneyview 更像受监管、承担信用风险的金融科技公司来定价，认为其队列耐久性不透明，并因 DLG
              和合作方集中度像隐藏杠杆而坚持 IPO 折价。结果大约是 $0.9-1.1 billion。基准情景下，市场接受 2024 年独角兽估值大体有效，因为 FY25 利润、FY26 前 9 个月运行率和已递交 IPO
              都显示这家公司比典型风投支持贷款机构更成熟；这支撑约 $1.1-1.4 billion。牛情景需要的不只是动量。它需要证据证明 FY26 利润保持强劲、DLG
              强度下降，并且公开市场投资者把公司视为更接近有规模信用特许权，而不是重估候选标的。这可以支撑 $1.4-1.7
              billion，但如果增长和披露故事没有实质不同，很难再高出太多。三种情景下，市场很可能看收入质量，而不只是收入规模；因此估值区间围绕当前估值相对紧，而不是向泡沫时期区间爆炸上行。
