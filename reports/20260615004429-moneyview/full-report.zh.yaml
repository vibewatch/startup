      - number: '6.3'
        title: 具名客户证明——借款人画像和合作贷款方名单
        blocks:
          - type: paragraph
            body: >-
              Moneyview 没有在 DRHP 或官网公开点名的借款人案例，这对高频消费贷款机构来说正常。因此客户证明分三类。第一，BankBazaar 列出的借款人准入条件规定最低年龄 21 岁、最高 57
              岁、最低月收入 Rs 13,500（部分产品在大城市为 Rs 25,000），个人贷款票额 Rs 5,000 至 Rs 10 lakh，期限 3-60 个月——这界定了平台服务人群的上下边界。第二，Google
              Play 上 50M+ 安装、36 lakh+ 评论、4.8 星评分，是最大的一块客户证据：匿名，但有规模验证；评分明显高于 KreditBee（约 4.6★）、Fibe（约
              4.5★）等同业。第三，企业侧的具名合作贷款方名单（Aditya Birla Capital、Northern Arc、Vivriti Capital、Oxyzo，以及另外 11+ 家未逐一披露机构）和
              IRDAI 公司代理牌照 CA0925 下的保险合作关系，提供了机构客户证明——这些付费交易对手的合同存在见于 DRHP。公开记录没有具名借款人推荐语及可核验结果；moneyview.in/about-us
