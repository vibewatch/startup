      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: Moneyview 不再是纯风投式故事股
            body: 公司的收入、利润和 DRHP 让它比许多私有金融科技 IPO 候选公司位置更强。因此结论是合理 / 跟踪，而不是过高 / 放弃。
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV024
          - type: callout
            title: 倍数必须折价 DLG 和合作方集中度
            body: 即便公开市场接受增长和利润故事，只要 DLG 和交易对手集中度仍笼罩股权案例，市场就不太可能支付溢价贷款机构估值。
            calloutType: risk
            claimRefs:
              - CV022
              - CV025
              - CV035
          - type: callout
            title: 最好的设置是有纪律地列入观察，而不是追逐上行
            body: 上调路径要么来自更好价格，要么来自更好披露。没有其中之一，一家合理的公司仍可能是一只平庸股票。
            calloutType: recommendation
            claimRefs:
