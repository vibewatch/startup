      - CV026
      - CV036
      - CV037
  - id: TV003
    title: 看空 / 基准 / 看多情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 关键假设
      - 主要下行 / 上行
    rows:
      - - 看空
        - 30%
        - $0.9B-$1.1B
        - IPO 因 DLG、集中度和 Paytm 式情绪记忆而大幅折价
        - 任何薄弱簿记或更严 RBI 口径都会把案例推到这里
      - - 基准
        - 50%
        - $1.1B-$1.4B
        - 收入、利润和 IPO 准备度抵消风险，独角兽估值大体守住
        - 前提是 DLG、合作伙伴组合或最终定价没有重大负面意外
      - - 看多
        - 20%
        - $1.4B-$1.7B
        - FY26 利润延续，DLG 强度缓和，市场按成熟放贷平台给 Moneyview 定价
        - 需要有纪律但支持性的机构簿记，以及更强披露
    notes: 区间有意留宽，反映公开证据，而不是管理层指引或卖方首发目标价。
    claimRefs:
      - CV008
      - CV024
