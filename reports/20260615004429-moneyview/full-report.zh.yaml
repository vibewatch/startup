      - number: '2.4'
        title: 增长驱动、采用约束和负面信号
        blocks:
          - type: paragraph
            body: >-
              双边增长故事背后有实质约束。驱动端包括：智能手机和 UPI 渗透率上升；account aggregator 框架让经同意的银行流水数据可被程序化调用；印度庞大的 35
              岁以下人群；以及移动获客相较银行网点系统性更低的单票服务成本。约束端包括：2022 年 9 月 RBI Digital Lending Guidelines（及 2024 年 11
              月重申）收紧费用传递、强制冷静期，并正式划定 LSP-NBFC 合同边界，提高纯 App 贷款机构合规成本；2022 年 3 月 RBI Microfinance Directions 设定家庭收入和
              EMI-to-income 上限，限制进入最小票据区间；2026 年 2 月 RBI 在一段收紧期后恢复 NBFC Default Loss Guarantee 框架，给 Moneyview 这类 LSP
              能代表合作贷款机构承接多少风险带来结构性不确定。负面采用信号包括 FACE 报告截至 2025 年 12 月 90 天 DPD（逾期）为 1.9%——较 2023 年 3 月 3.3% 改善但仍有分量——以及
