  - id: TV005
    title: 论点破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - IPO 定价过于激进
        - 公开价格区间在没有新披露的情况下显著高于约 5x FY25 销售额
        - 交易会很快从公平变成偏贵
        - 不追高；只保留观察名单状态
      - - DLG 强度未能正常化
        - IPO 后 DLG 余额或 DLG 费用仍居高不下
        - 强化类似表内风险的折价
        - 将估值区间下调到看空情景
      - - 合作伙伴集中度恶化
        - 前十大合作伙伴占比重新升至 40% 以上，或大型合作伙伴退出
        - 降低费用持续性，并提高议价风险
        - 相对 SBI Cards 式可比对象加大折价
      - - 资产质量下滑
        - 不良贷款率升至行业以上，或损失 cohort 急剧恶化
        - 市场会因质量担忧削减估值倍数
        - 立场从公平转向偏贵
      - - 监管冲击
        - RBI 实质性改变 DLG 或 LSP 经济模型
        - 直接打击核心业务架构
        - 立即重跑情景表
      - - 披露令人失望
        - 上市后 cohort / 合作伙伴 / DLG 透明度没有改善
        - 公司仍停留在跟踪而非买入区间
        - 暂缓上调评级
    notes: 这些触发因素按可监测性而非完整性筛选，可用上市后季度披露或 RBI 通告核对。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV027
      - CV028
      - CV030
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 最终 IPO 价格区间
        - 簿记区间、基石需求和机构反馈
        - 决定公平估值会变成偏贵还是有吸引力
        - 发布后审阅 RHP / 路演材料
      - - DLG 实现历史
        - 按合作伙伴 cohort 拆分的现金动用、回收和时点
        - 校准账面 DLG 余额是否保守的最佳方式
        - 管理层 + 贷款方数据室请求
      - - 合作伙伴续约经济条款
        - 收入分成阶梯、非竞争和终止条款
        - 判断费用收入持续性和集中度风险所必需
        - 对头部合作伙伴合同摘要做法律尽调
      - - 还款 cohort
        - Vintage 损失曲线、重复借款率和分客群信用表现
        - 区分短期利润和经周期检验的单位经济模型
        - 管理层提供的信用尽调包
      - - 渠道经济模型
        - CAC、LTV，以及对 Android / 效果营销的依赖
        - 公开市场投资者会关注增长质量，而不只是规模
        - 营销分析尽调
      - - 上市公司控制
        - 安全整改、事件响应和治理流程成熟度
        - 上市后风险事件会快速压缩估值倍数
        - 安全 / 治理工作流审阅
    notes: 这些是从跟踪走向高确信最有价值的后续问题，而不是一般性数据室愿望清单。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV037
      - CV038
      - CV040
