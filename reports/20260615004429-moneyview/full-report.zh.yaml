      - number: '8.2'
        title: 可比分析：印度金融科技、上市贷款机构与全球数字贷款可比公司
        blocks:
          - type: paragraph
            body: >-
              Moneyview 位于多个公开可比公司组之间，每组讲出的故事略有不同。Bajaj Finance 和 SBI Cards
              等印度传统上市贷款机构显示，公开市场愿意为已披露盈利和有规模信用业务支付什么价格。Bajaj 2026 年快照——26.3x P/E、4.37x P/B、17.2x EV/Revenue——是溢价端，对今天的
              Moneyview 明显过高，因为 Bajaj 披露更深、品牌耐久性更强、融资多元化更干净。SBI Cards 更适合作为收入倍数锚：5.5x EV/Revenue
              更接近一个盈利但承担风险的消费信贷平台能拿到的水平。更宽的金融科技背景则更混杂。Finro Q1 2026 数据库显示 Lending & Credit 平均 11.8x EV/Revenue，但 Painted
              Stork 的印度重估备忘录解释了为什么这些平均值会误导：FY22 至 FY26，印度金融科技收入倍数大幅压缩，Paytm、PhonePe、CRED 和 PB Fintech
              都较泡沫时期被下调定价。Upstart、Blend 和 LendingClub 等全球可比公司对精确倍数迁移意义较小，更重要的是提醒我们：上市数字贷款机构每个季度都按披露质量接受评判。因此，Moneyview
              最适合用混合公开可比组估值，从接近 SBI Cards 的位置起步，再为 DLG 和合作方集中度打折；而不是从行业均值出发再向上论证。
