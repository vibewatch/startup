        title: 差异化、信任姿态和产品 / 技术风险
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的技术差异化建立在四根支柱上。（1）自研薄信用档案信用评分模型，位于 Account-Aggregator 输入的银行流水数据和 SMS / 设备信号之上；（2）交叉销售栈，在单一 KYC
              上横跨十一个模块，以接近零 CAC 提升 LTV；（3）监管和信任姿态——ISO 27001:2022 认证 ISMS、IRDAI corporate-agent 牌照 CA0925、LSP 边界上的 RBI
              Digital Lending Guidelines 合规；（4）分销规模——18,400+ pin code 覆盖和 4.8 星 Play 评分。产品 / 技术风险有三类。第一，AA 商品化：随着 AA
              框架让银行流水数据普遍可编程，竞争者可基于同一数据原语搭建类似模型，承保优势随之收窄。第二，DLG 关联信用成本——LSP 轻资本叙事被 FY25 Rs 321.7 crore DLG 费用和 9M FY26
              Rs 847 crore DLG 未偿余额部分削弱，因为平台信用表现直接连到资产负债表结果。第三，封闭栈披露界面——Moneyview 不发布开发者 SDK 或 API 文档，因此独立验证架构主张只能依赖 ISO
              认证、RBI 合规证明和公开 App 界面。Glassdoor 员工评价界面是目前可公开取得、最接近开发者 / 工程组织成熟度的信号。
