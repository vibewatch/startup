      - number: '2.3'
        title: 买方、用户、付费方分层和采用路径
        blocks:
          - type: paragraph
            body: >-
              印度数字借贷的买方同时也是用户和付费方：个人消费者或微型企业主下载 App、完成 KYC，并把贷款打入自己的银行账户。这里没有单独的企业采购环节。对 Moneyview
              定位最重要的买方有三类。第一类是城市工薪借款人，通常 25 至 35 岁，已有一条或多条信用线，寻求 Rs 50,000 至 Rs 5 lakh 的票据规模，愿意为速度和便利支付 16-30%
              APR，而不是去银行网点。第二类是新入信贷和薄信用档案借款人，常在二、三线城镇，寻求 Rs 5,000 至 Rs 50,000 票据规模，Moneyview 自研信用评分模型是其主要准入路径；FACE
              数据显示，39% 放款金额流向 Tier III+ 城市，超过 60% 审批金额流向 35 岁以下借款人。第三类是拿最高 Rs 5 lakh
              小企业贷款补充营运资金的微型企业主。采用路径移动优先：下载（Google Play 上 Moneyview 评分 4.8 星）、查信用分（Moneyview 免费
              CIBIL）、KYC、软报价、硬查询、分配合作伙伴、放款——复贷客户通常几分钟内端到端完成。女性借款人约占审批金额的 18%，说明当前采用结构仍偏男性，也因此留下增长杠杆。
