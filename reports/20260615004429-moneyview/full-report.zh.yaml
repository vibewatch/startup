      - number: '5.2'
        title: 模块、SKU 和产品线地图
        blocks:
          - type: paragraph
            body: >-
              Moneyview 的产品界面可拆成十一个模块。（1）个人贷款——锚定模块，Rs 5K-Rs 10L，APR 16%+。（2）商业贷款——面向独资经营者，最高 Rs 5L。（3）信用卡——联名 / 自有，FY25
              推出。（4）BNPL / Smart Pay——短期限循环信用。（5）保险分销——IRDAI CA0925 corporate-agent composite 牌照，覆盖寿险 / 健康 /
              车险。（6）数字黄金——App 内黄金积累。（7）UPI 支付——经 NPCI 的 App 内 UPI 轨道。（8）CIBIL 信用分查询——免费，作为获客界面。（9）Earned wage
              access——FY25 推出，面向工资挂钩预支。（10）住房贷款 / LAP——通过转介分销，不直接获客放款。（11）Account-Aggregator
              驱动的银行流水聚合——支撑多个借贷模块承保的数据层。横跨十一个模块，公司运行一个面向薄信用档案借款人的内部自研信用评分引擎作为横向能力，并共享 KYC、eKYC 视频和催收工作流。每个模块共用同一登录、KYC 和
