callouts:
  - calloutType: strength
    title: Granular retail book with near-saturated pincode reach
    body: >-
      Moneyview reaches ~99.55% of Indian pincodes with 18,400+ pincodes served
      and a 79% Tier II / III / beyond user mix — a distribution moat that few
      digital-NBFC peers approach at this scale, and one that mechanically caps
      customer-side concentration risk because the book is granular retail.
    claimRefs:
      - CU002
      - CU004
      - CU029
  - calloutType: risk
    title: Partner-lender concentration and Android-only channel concentration
    body: >-
      Top 10 financial partners contributed 37.31% of revenue in 9M FY26 (down
      from 46.82% in FY25) under non-exclusive contracts; almost all monetisation
      runs through the Android app. Loss of a top-3 partner or a Google Play
      policy shift would directly impact 15-20% of revenue.
    claimRefs:
      - CU032
      - CU035
  - calloutType: insight
    title: Retention disclosure is the single largest customer-side evidence gap
    body: >-
      NRR, GRR, repeat-loan rates, monthly-cohort repayment curves, and
      cross-sell-attach rates are not in the DRHP or any public source.
      Satisfaction proxies (Google Play 4.8★ over 36 lakh+ reviews, BankBazaar
      eligibility data) are first-pass only.
    claimRefs:
      - CU022
      - CU023
      - CU026
      - CU028
