artifact: customers
slug: moneyview
runDate: '2026-06-15'
company:
  name: Moneyview
chapter:
  number: 6
  title: Customers
  summary: >-
    Moneyview's customer base is a retail-only Indian borrower / saver / payer
    cohort skewed to thin-file, sub-35-year-old, Tier II / III / IV consumers —
    125.49 million registered users (9M FY26), 9.73 million monetised users, 79%
    from small towns, with 60%+ of sanctioned loan value going to under-35 borrowers
    and 39% of disbursals routed to Tier III+ cities at an industry-average ticket
    of Rs 15,493. Named customer proof is limited to anonymous archetypes (BankBazaar
    review eligibility data, Google Play review base of 36 lakh+ at 4.8 stars across
    50M+ installs, and aggregator-listed product attributes); B2B customer proof comes
    from partner lenders rather than borrowers. Retention proof is partial — repeat-
    loan and cross-sell uplift are implied by monetised-user growth (7.45M to 9.73M
    in nine months) but no explicit NRR, churn, or repayment cohort is published.
    Concentration risk sits on the partner-lender side (top-10 lenders contributed
    37.31% of revenue in 9M FY26, 46.82% in FY25) and on a single distribution
    channel (Android app); customer-side concentration is functionally absent because
    the book is granular and retail.
sections:
  - id: segmentation-and-payer-map
    title: Customer base, segmentation, and buyer / user / payer mapping
    body: >-
      Moneyview operates a retail-only, B2C credit-distribution business. The
      product user is an Indian consumer who installs the Moneyview Android app,
      runs a free CIBIL credit-score check, and applies for a personal loan,
      business loan, credit card, BNPL line, insurance policy, digital-gold
      purchase, earned-wage advance, or home-loan referral. The payer is either the
      end borrower (who pays interest plus fees to the lender) or the partner
      lender / insurer (who pays Moneyview a sourcing fee or commission). The
      buyer of Moneyview's enterprise-side product — sourcing-and-underwriting as a
      service — is the partner lender (15+ lenders including Aditya Birla Capital,
      Northern Arc, Vivriti Capital, Oxyzo) and the insurer (IRDAI corporate-agent
      composite CA0925). Borrower segmentation as disclosed in the DRHP and aggregator
      pages tilts heavily to small-town India: 79% of users sit in Tier II / III /
      beyond, the platform claims 18,400+ pincode coverage (~99.55% of India's
      pincodes), and 60%+ of sanctioned loan value goes to borrowers under 35. Women
      borrowers account for ~18% of digital-NBFC sanctions industry-wide per RBI
      / FACE data, which is the closest available benchmark for Moneyview's mix.
      Geographic, age, and channel skew are corroborated across the DRHP, Inc42
      profile, BankBazaar product review, and the IBEF / digital-NBFC market data;
      no SKU-level revenue mix by segment is publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption trajectory — registered users, monetised users, downloads, and disbursals
    body: >-
      The adoption funnel runs from app install / registration → CIBIL score check
      → loan application → monetisation. As of December 2025 (9M FY26 cutoff),
      registered users / unique visitors reached 125.49 million, up from 109.59
      million in FY25 (14% nine-month growth, ~36% annualised). Monetised users
      (those who have purchased at least one product) reached 9.73 million in 9M FY26
      from 7.45 million in FY25 (31% nine-month growth, ~41% annualised). Cumulative
      Google Play installs cross 50 million with 36 lakh+ reviews at a 4.8-star
      average, the highest among India's top-five digital-lender apps. WFPL's own
      NBFC disbursals reached Rs 5,429.6 crore in 9M FY26 (38% over the full FY25
      disbursal of Rs 3,933 crore). The loan-book outstanding on the Moneyview
      platform was Rs 19,814 crore in December 2025 across both WFPL on-book and
      partner-lender off-book exposure. Industry-average ticket size in Q1-Q3
      FY26 ran Rs 15,493 (up 18% YoY) and digital NBFCs as a category booked 10.9
      crore loans worth Rs 1.06 lakh crore in FY25, providing the denominator for
      Moneyview's roughly 8-9% volume share of the digital-NBFC personal-loan pool.
      The monetisation-rate proxy — monetised / registered users — sits at ~7.8%
      in 9M FY26, a meaningful efficiency improvement from ~6.8% in FY25.
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-customer-proof
    title: Named customer proof — borrower archetypes and partner-lender roster
    body: >-
      Moneyview does not publish individually named borrower case studies in the
      DRHP or on its public website, which is normal for a high-volume consumer
      lender. Customer proof therefore takes three forms. First, aggregator-listed
      borrower eligibility on BankBazaar specifies minimum age 21, maximum age 57,
      minimum monthly income Rs 13,500 (Rs 25,000 in metros for some products),
      with personal-loan tickets from Rs 5,000 to Rs 10 lakh and tenures 3-60
      months — defining the upper / lower envelope of who the platform serves.
      Second, the Google Play review base of 36 lakh+ reviews at 4.8 stars across
      50M+ installs is the largest single piece of customer evidence: it is
      anonymised but volume-validated, with the rating dominantly positive against
      KreditBee (~4.6★), Fibe (~4.5★) and other peers. Third, on the enterprise
      side, the named partner-lender roster (Aditya Birla Capital, Northern Arc,
      Vivriti Capital, Oxyzo, plus 11+ others not individually disclosed) and the
      insurer relationships under IRDAI corporate-agent licence CA0925 provide
      institutional customer proof — these are paying counterparties whose
      contractual presence is mentioned in the DRHP. No individually named borrower
      testimonial with verifiable outcome is in the public record; testimonials
      on the moneyview.in/about-us page are first-party and unverifiable.
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-and-durability
    title: Retention, repeat usage, satisfaction, and durability of the cohort
    body: >-
      Explicit retention disclosure is the largest single evidence gap for
      Moneyview's customer chapter. The DRHP does not publish net-revenue
      retention (NRR), gross-revenue retention (GRR), 30 / 60 / 90 / 180 day
      repeat-loan rates, or monthly-cohort repayment curves at the granularity an
      institutional investor would expect. What is reported is directional. (1)
      Monetised-user growth from 7.45 million (FY25) to 9.73 million (9M FY26)
      implies a meaningful repeat-monetisation behavior because gross adds
      against the registered base are only 15.9 million in nine months, so a
      portion of the 2.28 million net-new monetised users are repeat buyers
      moving across categories. (2) 90-day DPD at the industry level fell to
      1.9% in December 2025 from 3.3% in March 2023, indicating the cohort
      Moneyview underwrites has become more durable on the credit side. (3) The
      Google Play 4.8-star rating across 36 lakh+ reviews is a satisfaction
      proxy — high relative to peers, but reviews are inflated by post-disbursal
      survey nudges typical of consumer-fintech apps. (4) Average ticket size
      rising 18% YoY to Rs 15,493 suggests increasing wallet capture per
      borrower. (5) Adverse review themes (harro.com surfaces concerns over
      regulatory uncertainty and loan defaults) call out residual NPA volatility
      even with the FY25 write-off of Rs 246 crore behind the company. No
      cohort-level repeat-loan or NRR data is published.
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-and-concentration
    title: Expansion, cross-sell, partner concentration, and channel risk
    body: >-
      Expansion has two engines. The first is cross-sell within the existing
      user base — the addition of credit cards and earned wage access in FY25,
      on top of personal loans, business loans, BNPL, insurance, digital gold,
      UPI payments, and home-loan referrals, lifts revenue per monetised user
      without proportional CAC. The second is geographic widening — the
      18,400+ pincode footprint already covers ~99.55% of pincodes, so further
      geographic expansion within India is largely depth (deeper Tier IV / V
      penetration) rather than breadth. Concentration risk on the customer
      side is structurally low because the book is granular retail — no
      single borrower exceeds a meaningful share of the Rs 19,814 crore loan
      book. Concentration risk on the partner-lender side is material: the top
      10 financial partners contributed 37.31% of revenue in 9M FY26 (down
      from 46.82% in FY25), and no exclusive contracts are in place. Channel
      risk is single-vector — almost all monetisation funnels through the
      Android app, with no meaningful web-app, branch, or DSA-driven volume
      reported; if Google Play ranking, app-store trust signals, or
      Android-platform policy shift adversely, monetisation volume is directly
      at risk. Adverse — partner-lender contractual renewals and DLG-cap
      changes (the RBI restored DLG framework for NBFCs in February 2026 but
      retained tighter coverage caps) are the most monitorable concentration
      kill triggers for the customer-economic engine.
    claimRefs:
