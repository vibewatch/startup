      - TO002
  - id: capital-base-and-investors
    title: Capital base, valuation path, and stakeholder map
    body: >-
      Moneyview has raised in excess of US$230 million across five priced equity rounds since
      inception, anchored by Accel India and Nexus Venture Partners in the early years and joined by
      Tiger Global Management, Apis Partners, Winter Capital, Evolvence India, Ribbit Capital, and
      Lok Capital in the growth rounds. The March 2022 Series D priced the company at roughly $625
      million when Tiger Global, Winter Capital, Evolvence, and Accel deployed $75 million combined.
      In December 2022 a $75 million Series E led by Apis Partners and joined by Tiger Global, Winter
      Capital, and Evolvence took the post-money valuation to $900 million, and follow-on
      transactions during 2023 carried the company past unicorn status to a roughly $1.2 billion
      valuation. The DRHP filed with SEBI in March 2026 confirms an offer-for-sale tranche of
      136,095,900 shares from Sanjay Aggarwal, Puneet Agarwal, Chitra Agarwal, Accel, Apis Partners,
      Ribbit Capital, Internet Fund III, Crimson Winter, Lok Capital, Evolvence India Fund IV, NLI
      Strategic Venture Investment, TI JPNIN India Holdco, TI Platform SMRS SMA, and DI Investment,
      paired with a ₹1,500 crore fresh issue for a total deal size of ₹3,000 crore. The company also
      drew its most recent disclosed debt financing on 26 November 2025, supplementing equity with
      working-capital lines to fund WFPL on-balance-sheet disbursals.
