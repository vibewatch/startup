  - id: milestones-and-scale
    title: Milestone chronology and headline scale metrics
    body: >-
      The Moneyview chronology runs from a 2014 founding as a personal-finance-tracking app
      (Whizdm), through a 2017–2019 pivot into lending under the Moneyview brand, into a 2022 dual
      Series D / Series E build-out, the FY22 turn to profitability, the FY23–FY25 revenue
      compounding from ₹648.1 crore to ₹2,339 crore at roughly 75 percent year-on-year growth, the
      June 2025 conversion to a public limited company, and the March 2026 ₹3,000 crore DRHP filing
      with Axis Capital, BofA Securities, IIFL Capital, and Kotak Investment Banking as book-running
      lead managers. By the December 2025 cut-off date used in the DRHP, the platform had reached
      125.49 million registered users, 9.73 million monetised users, 50 million+ Google Play
      downloads, 36 lakh+ Google Play reviews at a 4.8★ rating, coverage of 99.55 percent of Indian
      pincodes and 18,400+ active pincodes, with 79 percent of users sourced from small towns. The
      live loan book across the Moneyview platform stood at ₹19,814 crore and WFPL disbursals in the
      nine months to December 2025 reached ₹5,429.6 crore, up 38 percent year-on-year. Adverse
      signals coexist with this scale: harro.com flagged in March 2026 that RBI regulatory
      uncertainty and rising loan defaults (impairment expense up roughly threefold in FY25) could
      pressure the operating model into the IPO window.
