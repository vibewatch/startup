      A high-level KPI snapshot that situates Moneyview as a profitable, mass-scale digital lender
      heading into IPO pricing with concentrated founder ownership and adverse credit-quality
      signals to manage.
    data:
      items:
        - label: Founded
          value: '2014'
          detail: Bangalore-headquartered; legal entity Moneyview Limited (formerly Whizdm Innovations).
          tone: neutral
        - label: Latest valuation milestone
