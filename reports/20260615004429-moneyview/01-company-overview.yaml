callouts:
  - calloutType: strength
    title: Capital-light LSP model with four consecutive profitable years
    body: >-
      Moneyview turned profitable in FY22 with ₹17.7 crore net profit, then compounded to ₹240.3
      crore in FY25 while growing revenue at roughly 74 percent year-on-year. The capital-light
      LSP-plus-NBFC architecture lets the company scale loan originations without taking the entire
      asset onto its own balance sheet.
    claimRefs:
      - CO005
      - CO018
      - CO026
      - CO027
  - calloutType: insight
    title: Investor coalition signals strategic exit positioning
    body: >-
      The DRHP OFS list combines founder selling shareholders, the earliest institutional backers
      (Accel, Nexus, Lok), the 2022 growth investors (Tiger Global, Apis Partners, Winter Capital,
      Evolvence India), and Ribbit Capital — a coalition consistent with a tier-one BRLM-led IPO
      and partial-exit secondary for early holders.
    claimRefs:
      - CO017
      - CO019
      - CO021
      - CO024
      - CO025
  - calloutType: risk
    title: Founder concentration and credit-quality questions remain live
    body: >-
      Public materials disclose two co-founders and one family selling shareholder; no independent
      board or audit-committee roster appears in the reviewed sources. At the same time, FY25
      impairment-on-portfolio-loans expense tripled to ₹346 crore (including ₹246 crore of
      write-offs) and harro.com flags RBI DLG-framework uncertainty as a near-term IPO risk.
    claimRefs:
      - CO014
      - CO015
      - CO034
      - CO035
