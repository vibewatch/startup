          detail: Fourth consecutive year of net profitability; 40% growth over FY24.
          tone: positive
        - label: Registered users (9M FY26)
          value: 125.49M
          detail: DRHP-disclosed reach figure as of 31 December 2025.
          tone: positive
        - label: Monetised users (9M FY26)
