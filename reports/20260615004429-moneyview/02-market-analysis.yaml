callouts:
  - calloutType: insight
    title: Digital-NBFC channel has crossed industry-defining share
    body: >-
      FACE data show digital NBFCs are responsible for ~78% of personal-loan volumes and ~19% of
      personal-loan value, and Business Today reports digital captured ~80% of the online lending
      market in Q3 FY26. The share-of-flow battle for new originations is already digital-first,
      which underwrites Moneyview's mobile-only positioning rather than its requiring it.
    claimRefs:
      - CM007
      - CM008
      - CM027
  - calloutType: strength
    title: Account-aggregator rails plus thin-file scoring widens the funnel
    body: >-
      India's account-aggregator framework gives Moneyview consented programmatic access to bank
      statement data, which combined with its proprietary credit-scoring model for thin-file
      borrowers lets the company underwrite a much wider funnel than legacy bank personal-loan
      processes can.
    claimRefs:
      - CM020
