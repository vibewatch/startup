    title: Market definition table
    columns:
      - segment / category
      - included spend
      - excluded spend
      - buyer / payer
      - relevance to Moneyview
    rows:
      - - Digital unsecured personal loans
        - >-
          App-originated personal loans of Rs 5,000-Rs 10 lakh disbursed to retail bank accounts,
          including LSP-sourced and NBFC on-book originations.
        - >-
          Branch-originated bank personal loans; secured loans; SME term loans above Rs 5 lakh.
        - >-
          Individual retail borrower (buyer = user = payer); partner NBFC or WFPL is the lender of
          record.
        - >-
          Core product: ~63% of Moneyview's FY25 revenue is fees/commissions, the majority from this
          segment.
      - - Small-ticket business loans
        - >-
          Working-capital and merchant loans up to Rs 5 lakh for micro-entrepreneurs originated
          digitally.
        - >-
          MSME term loans above Rs 5 lakh; equipment finance; gold-secured business loans.
        - >-
          Sole proprietor / self-employed individual.
        - >-
          Adjacent growth product on the same KYC and credit-scoring stack.
      - - Digital BNPL and credit-card-light products
        - >-
          Revolving short-tenure credit products (BNPL, Smart Pay) and app-originated credit cards.
        - >-
          Co-branded bank credit cards distributed in branches; charge cards.
        - >-
          Individual retail borrower; merchant pays interchange in some BNPL models.
        - >-
          Moneyview launched credit cards in FY25 and operates BNPL/Smart Pay; cross-sell layer
          on top of personal loans.
      - - Insurance distribution
        - >-
          Sale of life, health, and motor insurance products through the lending app under IRDAI
          corporate-agent licence CA0925.
        - >-
          Group-corporate insurance; bancassurance through bank branches.
        - >-
          Retail consumer pays premium; insurer pays commission to Moneyview.
        - >-
          Fee revenue diversification; same KYC base; CAC-free attach.
      - - Digital gold and UPI payments
        - >-
          Digital-gold accumulation and UPI payment rails accessible inside the Moneyview app.
        - >-
          Physical gold loans; merchant-side card acquiring.
        - >-
          Retail user; payment rails monetised indirectly.
        - >-
          Adjacency that funnels users into the lending engine and supports engagement metrics.
      - - Microfinance loans (out of scope)
        - >-
          MFI joint-liability and individual loans regulated under RBI Microfinance Directions
          2022.
        - >-
          Excluded from this chapter's perimeter; sized separately by RBI sector data.
        - >-
          Rural/low-income household; SHG.
        - >-
          Moneyview does not currently operate in microfinance; included only to clarify the
          excluded perimeter.
    notes: >-
      Definition follows the FACE/RBI taxonomy for digital lending and the Moneyview product
      surface as of mid-2026. Insurance and digital gold are included because Moneyview
      monetises them through the lending app, even though they are not credit products.
