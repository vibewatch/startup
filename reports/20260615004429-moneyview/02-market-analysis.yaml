  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Public reviewed sources do not reconcile FACE's Rs 1.39 lakh crore digital NBFC
        outstanding (Dec 2025) with IMARC's US$157 billion India personal-loan TAM (2025); the
        two numbers describe different perimeters (digital NBFC stock vs all personal loans) and
        cannot be merged into a single TAM/SAM/SOM stack without methodology adjustment.
      whyItMatters: >-
        Without a reconciled definition, share-of-market read for Moneyview against the broader
        TAM remains an approximation and any single-number TAM claim risks being misleading.
      diligencePath: >-
        Source the FACE methodological appendix and reconcile against IMARC's personal-loan
        segmentation; cross-check against CIBIL TransUnion / Equifax retail-credit reports.
      relatedQuestionRefs:
        - QM003
        - QM004
        - QM022
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: aa-uplift
      missingEvidence: >-
        Reviewed public sources do not quantify the underwriting-approval-rate uplift that the
        account-aggregator framework specifically provides to Moneyview versus pre-AA bank-
        statement upload flows.
      whyItMatters: >-
        Without a quantified uplift, the adoption-driver claim for AA rails relies on inference
        rather than measured impact.
      diligencePath: >-
        Request Moneyview's pre-AA vs post-AA approval-rate, time-to-decision, and approval-
        cost data during diligence; cross-check against RBI/Sahamati AA adoption statistics.
      relatedQuestionRefs:
        - QM014
      relatedTableRefs:
        - TM004
    - type: stale
      severity: minor
      topic: 6w-baseline
      missingEvidence: >-
        The 6W Research public excerpt cites a 22.1% digital-lending CAGR through 2030 but
        does not publish a 2025 baseline value in the excerpt that was retrieved.
      whyItMatters: >-
        Without an explicit baseline, the implied 2030 absolute value used in the sizing range
        figure is approximate rather than precise.
      diligencePath: >-
        Subscribe to or request the full 6W Research India digital-lending report to obtain
        the baseline and methodology behind the 22.1% CAGR forecast.
      relatedQuestionRefs:
        - QM006
      relatedTableRefs:
