  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - driver / constraint
      - direction
      - timing
      - implication for Moneyview
      - diligence ask
    rows:
      - - UPI and smartphone penetration
        - driver
        - Through 2030
        - >-
          Continues to expand the addressable user base in Tier II/III towns and lowers
          cost-to-acquire per pincode.
        - >-
          Track Moneyview's pincode-coverage growth from 18,400+ and the share of organic
          installs.
      - - Account aggregator framework
        - driver
        - Near-term
        - >-
          Reduces underwriting friction, lifts approval rates for thin-file borrowers, and
          accelerates the soft-quote to disbursal path.
        - >-
          Verify AA-integration depth at Moneyview vs partner lenders; quantify approval-rate
          uplift.
      - - Under-35 demographic cohort
        - driver
        - 5-10 year horizon
        - >-
          Sustains volume growth for small-ticket personal loans; FACE reports >60% of
          sanctioned value to under-35 borrowers.
        - >-
          Measure cohort-level repeat-borrowing rates; verify retention into higher ticket bands.
      - - RBI Digital Lending Guidelines (Sep 2022)
        - constraint
        - Already binding
        - >-
          Mandated fee pass-through, cooling-off periods, and LSP-NBFC contractual perimeter
          raise compliance overhead.
        - >-
          Audit Moneyview's LSP contracts and customer-fee disclosures against the RBI rule.
      - - RBI Microfinance Directions (Mar 2022)
        - constraint
        - Already binding
        - >-
          Caps household-income and EMI-to-income for the smallest-ticket segments; bounds
          aggressive expansion into the MFI-overlap zone.
        - >-
          Confirm Moneyview's product mix stays outside the MFI perimeter (it does today).
      - - RBI DLG framework reset (Feb 2026)
        - constraint
        - Crystallising
        - >-
          Creates uncertainty about how much risk LSPs can warehouse on behalf of partner
          lenders; Moneyview FY25 DLG expense was Rs 321.7 crore.
        - >-
          Quantify Moneyview's DLG exposure to total disbursals and stress-test new rule
          scenarios.
      - - 90-day DPD trajectory (FACE)
        - constraint
        - Live signal
        - >-
          DPD90 improved to 1.9% in Dec 2025 from 3.3% in Mar 2023 but remains material;
          Moneyview's FY25 impairment tripled YoY.
        - >-
          Stress-test Moneyview's credit costs against a 50-100bps DPD shock.
      - - Adverse third-party analysis (harro.com)
        - constraint
        - Current
        - >-
          Harro flags regulatory uncertainty and rising loan defaults as direct risks to
          Moneyview's IPO economics.
        - >-
          Treat as preserved adverse signal; revisit after SEBI-final RHP risk-factor section.
      - - Online channel capture (~80% share)
        - driver
        - Current
        - >-
          Business Today reports digital channels captured ~80% of online lending market share;
          flow-of-new business is already digital-first.
        - >-
          Map Moneyview's share-of-flow within the Rs 97,381 crore sanctioned Q1-Q3 FY26 pool.
    notes: >-
      Drivers and constraints map to specific RBI notifications and FACE/IBEF data; adverse rows
      are inline so the chapter does not appear uniformly positive. Each constraint carries a
      named diligence ask Moneyview's IPO underwriters should pressure-test.
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM023
