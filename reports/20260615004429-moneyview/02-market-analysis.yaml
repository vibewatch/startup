runDate: '2026-06-15'
company:
  name: Moneyview
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Moneyview competes in India's digital consumer-credit market — bounded by RBI-regulated digital
    personal loans, small-ticket BNPL, credit cards, business loans, and adjacent insurance and gold
    distribution. The digital NBFC personal-loan stock crossed Rs 1.39 lakh crore (~$16 billion)
    across 6.47 crore accounts by December 2025, growing 53% in 21 months, while the broader Indian
    personal-loan market is projected to rise from US$157 billion in 2025 to US$576 billion by 2034
    at a 15% CAGR. Adoption is driven by smartphone penetration, UPI rails, account-aggregator
    data, and Tier II/III demand for thin-ticket credit, but it is constrained by RBI digital
    lending guidelines, the DLG framework reset of February 2026, and rising 90-day delinquencies.
sections:
  - id: market-boundary
    title: Market boundary, adjacencies, and status-quo substitutes
    body: >-
      The market in scope is the digital, mobile-first, RBI-regulated consumer-credit market in
      India, comprising unsecured personal loans, small-ticket Buy Now Pay Later (BNPL),
      app-originated credit cards, micro and small business loans, and the distribution layer for
      consumer insurance and digital gold that runs alongside lending apps. Included spend covers
      every loan disbursed through a digital interface to retail and self-employed borrowers, plus
      commission-earning insurance and gold distribution that piggybacks on the lending product.
      Excluded from the boundary are wholesale corporate lending, RBI-regulated microfinance loans
      that follow MFI Directions, traditional bank branch-originated personal loans, secured retail
      lending such as auto and gold loans that depend on physical collateral handling, and informal
      moneylending. Status-quo substitutes for Moneyview's product set are traditional banks (HDFC,
      ICICI, SBI personal-loan branches), the credit-card arms of large banks, salary advances from
      employers, gold loans (a long-standing substitute in small towns), and informal lenders;
      adjacencies that the same Moneyview user might switch to include cards-only fintechs such as
      Slice, account-aggregator-led credit lines from neobanks, and PPI-led wallets such as MobiKwik.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
  - id: market-sizing
    title: TAM, SAM, SOM, and constrained sizing lenses
    body: >-
      Three independent sizing lenses anchor the addressable opportunity. The broadest lens is the
      Indian personal-loan TAM, sized by IMARC Group at roughly US$157 billion in 2025 and
      projected to reach US$576 billion by 2034 at a ~15% CAGR, covering bank and non-bank
      personal loans across digital and physical channels. A tighter SAM is the digital-lending
      slice as reported by 6W Research, which projects 22.1% CAGR for India's digital lending
      market through 2030 driven by digital infrastructure, smartphone penetration, and policy
      tailwinds. The narrowest, most directly relevant lens is the Fintech Association for
      Consumer Empowerment (FACE) data summarised by Economic Times and Business Today: digital
      NBFC personal-loan stock reached Rs 1.39 lakh crore (~US$16 billion) across 6.47 crore live
      accounts by December 2025, up 53% over 21 months, with digital NBFCs accounting for 78% of
      personal-loan volumes and 19% of total personal-loan value in the system. Quarterly sanction
      data show 10.9 crore digital NBFC loans worth Rs 1,06,548 crore in FY25, and FY26 nine-month
      data report fresh sanctions of Rs 97,381 crore. The average ticket size has moved up modestly
      to Rs 15,493 (up 18% year-on-year), indicating a mix shift toward slightly larger durations
      and ticket bands rather than ever-thinner credit. IBEF separately reports that fintech-led
      credit reached more than 11 crore loans in FY25, corroborating volume-led growth at the lower
      ticket bands.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
