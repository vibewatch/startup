companyProfile:
  summary: "ByteDance is a Beijing-headquartered private technology group founded in 2012 and led by co-founder Liang Rubo, with founder Zhang Yiming still reported as a major governance influence through super-voting control. Its product portfolio spans TikTok, Douyin, Toutiao, CapCut, Lark, TikTok Shop, Seed AI, and related enterprise and creator tools, giving it unusually broad monetization coverage across advertising, commerce, productivity, and AI. The company has extraordinary scale, but private-company opacity, conflicting funding estimates, and ongoing U.S. privacy litigation make governance, cash, and regulatory verification central diligence items."
