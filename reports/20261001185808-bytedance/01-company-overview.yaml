company:
  name: "ByteDance"
chapter:
  number: 1
  title: "Company Overview"
  summary: "ByteDance is a Beijing-headquartered private technology group founded in 2012, with a broad content-and-AI product portfolio and company-reported scale of more than 150,000 employees. Its private-company opacity, concentrated founder voting control, conflicting total-funding figures, and active U.S. privacy litigation make governance and financial verification central diligence issues."
sections:
  - id: "identity-business-and-scale"
    title: "Identity, Business Model, and Reported Scale"
    body: >-
      ByteDance was founded in 2012 by Zhang Yiming and Liang Rubo, and independent
      profiles locate its headquarters in Beijing. It remains privately held rather
      than exchange-listed. The official company site describes a portfolio spanning
      content discovery, short-form video, editing, commerce, collaboration, gaming,
      and other services, including TikTok, CapCut, TikTok Shop, Lark, Pico, Toutiao,
      and Douyin. ByteDance reports more than 150,000 employees across nearly 120
      cities; EBSCO separately reports approximately 150,000 employees. Secondary
      profiles report $155 billion of 2024 revenue, but ByteDance does not publish
      public audited financial statements. That figure should therefore be treated as
      reported revenue, not ARR, cash availability, or an audited run-rate.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-governance-and-control"
    title: "Leadership, Governance, and Control"
    body: >-
      ByteDance's official board page names Rubo Liang as chair and lists Arthur
      Dantchik, William E. Ford, Xavier Niel, and Neil Shen as directors. Independent
      sources report that Zhang Yiming served as chief executive until 2021, when
      co-founder Liang Rubo took over, while Julie Gao became chief financial officer
      in 2022. Economic ownership and voting control appear materially different:
      RevenueMemo and Wikipedia report an approximate 60% institutional, 20% employee,
      and 20% founder-and-leadership equity split, while both report majority voting
      control for Zhang through super-voting rights. These are secondary estimates,
      not an audited cap table. Investors therefore need the current shareholder
      register, voting-right schedule, board reserved matters, and key-person
      succession plan before relying on the reported ownership percentages.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "funding-valuation-and-disclosure-limits"
    title: "Funding, Valuation, and Disclosure Limits"
    body: >-
      Assigned secondary sources place ByteDance's early-2026 private-market value
      near $550 billion, but this is a negotiated secondary-market indication rather
      than a public-market capitalization or new cash raised by the company. The total
      funding record is not decision-grade: Silicon Valley Invest Club displays both
      "$19B+" and approximately $9.8 billion on the same page, while RevenueMemo says
      more than $10 billion. The chapter therefore leaves total raised unresolved
      rather than manufacturing a precise value. Funding raised is not cash available,
      and valuation is not liquidity. The absence of public audited financials also
      prevents a reliable bridge from reported 2024 revenue to profit, free cash flow,
      debt capacity, or current balance-sheet cash.
    claimRefs:
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO013"
  - id: "milestones-and-regulatory-exposure"
    title: "Milestones and Regulatory Exposure"
    body: >-
      The official history traces ByteDance from Toutiao in August 2012 to Douyin in
      September 2016, TikTok's international launch roughly a year later, and the
      November 2017 Musical.ly acquisition that was subsequently merged into TikTok.
      Leadership changed in 2021 and 2022, while the Seed site shows an active 2026
      release cadence across image, video, and multimodal model work. Scale has also
      produced material legal exposure. In August 2024 the FTC said the Department of
      Justice sued TikTok, ByteDance, and affiliates, alleging violations of the
      Children's Online Privacy Protection Act and a 2019 consent order. Those are
      allegations in a filed complaint, not adjudicated findings; current case status,
      potential remedies, and compliance costs remain diligence items.
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO014"
      - "CO015"
      - "CO016"
callouts:
  - calloutType: "risk"
    title: "Private-company control and disclosure risk"
    body: >-
      Reported institutional economic ownership does not equate to voting control, and
      no audited cap table or public financial statements were available in the
      assigned evidence. Confirm voting rights, liquidity preferences, debt, and cash
      directly rather than inferring them from valuation or funding headlines.
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO012"
  - calloutType: "risk"
    title: "Regulatory claims remain live diligence items"
    body: >-
      The FTC source documents allegations and requested penalties, not a final
      judgment. Counsel should verify the current docket, any settlement discussions,
      remediation obligations, and whether related privacy controls apply across the
      wider ByteDance portfolio.
    claimRefs:
      - "CO016"
