  - calloutType: "risk"
    title: "TikTok USDS Governance Restructuring and Profit Attribution"
    body: "Under the January 2026 finalized TikTok USDS Joint Venture LLC structure, ByteDance holds only a 19.9% direct equity interest, with an independent majority-American board and Oracle overseeing data architecture. Although ByteDance is projected to capture 50% or more of net economic profit through algorithm licensing and retained equity, investors face structural governance dilution and operational ring-fencing of U.S. assets."
