    title: "Disciplined Underwriting: Maintain Track Posture at $330B Benchmark"
    body: "While ByteDance's $186B revenue base demonstrates world-class operating scale, institutional investors should avoid chasing secondary market trades marked at $480B to $550B. The company-sponsored August 2025 buyback price of $200.41 per share (implying >$330B valuation) provides a more prudent baseline, especially given the >70% year-over-year contraction in 2025 net profit resulting from tens of billions in AI hardware procurement."
    claimRefs:
