  - id: "scenarios-comparables-and-diligence-path"
    title: "Scenario Analysis, Comparable Multiples, and Diligence Asks"
    body: "Evaluating ByteDance across comparable global mega-cap advertising and cloud platforms requires adjusting for private holding company discounts, geopolitical restructuring penalties, and heavy capital expenditure cycles. In public markets, peers such as Meta Platforms, Alphabet, and Tencent trade at forward enterprise value-to-revenue multiples between 5.0x and 7.5x and price-to-earnings multiples between 20x and 28x. At an estimated 2025 revenue base of $186B, ByteDance's August 2025 employee buyback valuation of $330B reflects an implied trailing revenue multiple of approximately 1.77x, whereas secondary marks at $480B to $550B imply 2.58x to 2.96x revenue. These multiples represent a substantial optical discount to Western public comps, justified by earnings volatility, the loss of direct majority operational control over TikTok U.S., and regulatory overhang.\n\nScenario modeling indicates three distinct paths: (1) Bull Case ($600B–$700B valuation; 25% probability), where TikTok Shop sustains global hypergrowth, Doubao monetizes enterprise agentic workflows across Asian markets, and U.S. algorithm licensing margins exceed 50% without further geopolitical erosion; (2) Base Case ($330B–$420B valuation; 55% probability), where digital ad revenue stabilizes at 12–15% growth, AI capex moderates by 2027 to restore operating profit above $30B, and COPPA civil litigation settles within manageable statutory limits; and (3) Bear Case ($200B–$250B valuation; 20% probability), where aggressive AI chip procurement fails to generate accretive software returns, European DSA and COPPA penalties impair ad targeting, and cross-border trade friction forces further asset write-downs. Key thesis-break triggers include a total operational shutdown of international TikTok operations, statutory regulatory judgments exceeding $5B, or severe export control enforcement blocking access to domestic and foreign AI compute clusters."
