  - id: TV002
    title: 正向与反向投资逻辑表
    columns:
      - 视角
      - 核心论点
      - 实证支撑依据
      - 核心脆弱点
      - 何种情况会改变观点
    rows:
      - - 正向逻辑：规模与商业化变现
        - 算法视频变现与直播社交电商领域的全球领导者
        - 估计 2025 年收入达 $186B（同比增长 20%）；国际收入占总收入 >30%
        - 中国本土数字广告增长趋于成熟（同比约 20%）
        - 欧洲与拉美地区的 TikTok 业务持续保持 >30% 的增长
      - - 正向逻辑：AI 基础设施与创新
        - 快速从社交媒体运营商转型为全栈 AI 生态领军者
        - Doubao 以 382M 用户领跑中国 AI 应用；Seed2.0 与 Seedance 2.5 已推出
        - 庞大的资本支出需求（2026 年计划达 ¥160B）挤压净利润
        - 通过 Volcano Engine 与 BytePlus 验证了商业化软件与 API 变现能力
      - - 反向逻辑：盈利能力收缩
        - 激进的算力投资严重侵蚀了造血能力与利润率
        - 尽管截至第三季度净利润达 $40B，但 2025 年净利润较 2024 年的 $33B 同比暴跌 >70%
        - 自研芯片与高端加速算力集群的回本周期存在不确定性
        - 全年净利润率回升至历史 >20% 水平
      - - 反向逻辑：地缘政治与法律风险暴露
        - 旗舰级美国资产面临结构性失去直接所有权及法定法律责任
        - ByteDance 在 TikTok USDS 合资企业中仅保留 19.9% 股权；DOJ/FTC COPPA 诉讼悬而未决
        - 面临平台封禁及每次违规每天最高 $51,744 民事罚款的持续风险
        - COPPA 违规主张达成明确法院和解，且美国授权业务的经济效益平稳运行
    notes: 对比结构性运营驱动因素与资本支出拖累及多司法管辖区法律责任。
