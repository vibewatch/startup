  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              ByteDance 的核心投资逻辑立足于其无可争议的全球消费者注意力垄断地位、无出其右的算法推荐飞轮，以及向全栈人工智能与社交电商巨头的快速跃迁。行业数据显示，ByteDance 在 2025 年实现 $186B
              营收，相较 2024 年的 $155B 同比增长约 20%，其中海外业务增长近 50%，占合并总营收比重突破 30%。公司核心变现支柱——高毛利的数字视频广告，以及 Douyin 与 TikTok
              Shop（2024 年美国 GMV 达 $9B，2025 年中销售增速同比飙升 120%）爆发式增长的直播电商——源源不断创造着极其强劲的经营现金流。此外，包括 Seed 研究团队与 Volcano Engine
              在内的 AI 业务部门在消费级 AI 领域确立了领先地位，Doubao 在中国市场的活跃用户数达到 382 million，并推出了 Seed2.0 与 Seedance 2.5 等前沿多模态模型。


              反向逻辑则直指其结构性盈利恶化、前所未有的资本开支重负，以及关乎生死存亡的地缘政治与监管脆弱性。尽管营收端势头强劲，但由于 ByteDance 掀起激进的 AI 基础设施投资浪潮，2025 年净利润较 2024
              年的 $33B 暴跌逾 70%；公司计划在 2026 年投入 ¥160B（~$23B）的算力资本开支，其中包括潜在采购 20,000 张 Nvidia H200 芯片。与此同时，美国的地缘政治指令迫使其在
              2026 年 1 月将 TikTok 美国业务剥离成立 TikTok USDS Joint Venture LLC，其中 ByteDance 仅保留 19.9%
              的直接股权，将美国市场的利润获取严格限定在算法授权与少数股权收益范围内。监管层面，美国司法部与 FTC 已起诉 ByteDance，指控其公然违反《儿童在线隐私保护法》（COPPA）并违背 2019
              年同意令，使其面临单项违规每天最高达 $51,744 的法定民事罚款。在缺乏对未受限离岸现金与各业务分部真实盈利水平的审计披露之前，其风险调整后收益要求投资者保持极为严苛的投资纪律。
