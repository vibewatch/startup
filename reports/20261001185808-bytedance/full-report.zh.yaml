            body: >-
              已审阅证据池中最清晰的近期采用率信号，来自 Bismarck Analysis 的报告：Doubao 于 2025 年 10 月在中国市场的月活跃用户数（MAU）突破 170
              million。其余规模指标虽然庞大，但时效性偏弱或统计分母不一：Britannica 报道 Toutiao 月活跃用户超过 300 million、CapCut 月活跃用户超过 200 million，而
              TikTok 累计下载量超过 3.5 billion。上述指标无法直接相加，也无法当作同一队列分析，因为它们将单月活跃度与全生命周期下载量混杂在一起，且缺乏统一的统计基准日期。一篇 2022
              年的学术论文通过社区问卷调查提供了更为微观的用户行为数据，但其样本局限于特定地域，不足以作为推断 ByteDance 整体渗透率的依据。
