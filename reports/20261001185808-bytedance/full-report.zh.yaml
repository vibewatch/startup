      - number: '6.4'
        title: 信任阻力与尽调边界
        blocks:
          - type: paragraph
            body: >-
              客户留存的持续性面临法律、声誉以及地缘层面的严峻制约。FTC 与司法部提交的诉状指控 TikTok 和 ByteDance 在知情情况下放任数百万 13
              岁以下儿童使用其服务，并在未取得法定家长同意的情况下收集其信息；这些属于等待法院审理的指控，并非经司法判决确认的既成事实。《Nature》期刊一篇关于 ByteDance 2020
              年危机公关的独立研究发现，Toutiao 与 Weibo 用户呈现出截然不同的舆情态度，说明信任反馈因受众群体与渠道而异。Britannica 还记载，政府禁令使得印度市场上数以百万计的用户彻底脱离了
              ByteDance 产品矩阵的覆盖范围。综合上述信息，获客与留存面临切实阻力，而具体企业客户名单与长周期客户留存指标的缺失，依然是本次尽调的核心证据局限。
            claimRefs:
              - CU011
