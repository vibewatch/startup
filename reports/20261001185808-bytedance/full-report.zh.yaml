      - number: '2.4'
        title: 增长引擎、地缘摩擦与监管瓶颈
        blocks:
          - type: paragraph
            body: >
              推动 ByteDance 市场扩张的是几大结构性驱动力：广告预算从传统展示广告加速向算法视频流迁移、直播带货在社交信息流中实现无缝结算，以及自研 AI
              硬件与基础模型的深度垂直整合。然而，严苛的监管与地缘政治壁垒严重制约了潜在市场的获取。在美国，国家安全与儿童隐私层面的执法行动——包括 FTC 与司法部指控其系统性违反 COPPA
              的联邦诉讼——迫使其接受结构性重组指令，并与 Oracle、Silver Lake 及 MGX 组建 TikTok USDS Joint Venture LLC，以竭力保住美国市场准入。


              在欧洲，《数字服务法》（DSA）的监管审查与基于 GDPR 的数据出境调查，对无限滚动和个性化推荐等核心算法互动机制构成了直接威胁。与此同时，AI 基础设施资本开支激增，每年已超过
              $30B；加之半导体出口管制与存储芯片价格飞涨，即使总营收保持扩张，全年净利率也持续承压，凸显出极其尖锐的资本密集度与管辖权风险。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 地缘剥离与合规成本压制市场规模
            body: >
              ByteDance 虽坐拥庞大的全球体量，但监管执法正在带来日常运营摩擦与利润率压缩。美国因 COPPA 儿童隐私违规展开的联邦执法、欧洲针对算法机制设计的 DSA 调查，以及与 Oracle
              和私募股权投资方重组成立的 TikTok USDS Joint Venture LLC，在稀释直接运营控制权的同时，也强加了极为严苛的数据治理要求。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM015
          - type: callout
            title: 激进的 AI 资本开支重塑公司变现重心
            body: >
              ByteDance 计划在 2026 年向 AI 基础设施投入超过 200 billion yuan（~$30B），资本开支强度直逼 Meta 和 Microsoft
              等西方超大规模云厂商。这一激进布局正在吞噬短期利润率——据报道，即便 2025 年营收仍增长 20%，全年净利润却大跌 70%——印证公司正全力从广告聚合平台转型为垂直整合的 AI 与基础模型巨头。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 产品矩阵的综合对抗，而非单点较量
        blocks:
          - type: paragraph
            body: >-
              客户的具体采购诉求不同，ByteDance 面临的竞争对手版图也随之切换。TikTok 与 Douyin 遭遇 Meta、YouTube 等老牌注意力和广告巨头；Seedance 对标 Kling、Sora
              等专业视频生成系统；Doubao 与 Volcano Engine 既要抗衡 Alibaba 旗下 Qwen 这类云模一体化布局，也要直面 DeepSeek 等开源权重路线。已有证据显示，ByteDance
              的独特身位在于贯通消费级应用、底层模型与基础设施的垂直整合，而 Qwen 与 DeepSeek
              更侧重模型调用的广泛接入或部署灵活性。因此，维持现状或自建方案同样是强劲替代选项：买方完全可以沿用既有媒体技术栈、拼接多家模型
              API，或私有化部署开源权重模型，而不必绑定任何专有生态。因此，竞争格局按买方采购诉求切分；在所分配证据未予证实的环节，竞对体量或融资金额均标记为未知。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP014
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
