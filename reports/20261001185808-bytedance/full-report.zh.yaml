  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 直观呈现分析决策链：从经营规模与 AI 资本承诺出发，穿透监管风险，最终得出观察（track）建议。
    data:
      nodes:
        - id: commercial-scale
          label: 商业规模（$186B 收入）
          detail: 收入同比增长 20%，且国际业务贡献超过 30% 顶线收入
        - id: profit-compression
          label: 利润承压（净利润下滑 >70%）
          detail: 2026 年 ¥160B（约 $23B）的大举 AI 算力与基础设施资本支出承诺
        - id: usds-carveout
          label: TikTok USDS 业务分拆（19.9% 股权）
          detail: 对美国业务直接运营控制权的结构性剥离
        - id: regulatory-exposure
          label: 监管负债（FTC/COPPA 诉讼）
          detail: 每次违规法定民事责任上限达 $51,744/天
        - id: valuation-synthesis
          label: 估值分歧（$330B 回购 vs $480B 老股交易）
          detail: 缺少经审计的财务透明度，支撑了非上市公司的非流动性折价
        - id: investment-decision
          label: 最终立场：观察 / 估值合理
          detail: 持续监测未来 AI 资本支出的投资回报率及经审计的分部现金流
    approximationNotes: 流程图展示了对基本面经营规模、算力再投资及法律风险的综合归纳。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
