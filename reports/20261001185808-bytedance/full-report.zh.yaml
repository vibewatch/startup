            body: 报道中的机构经济所有权并不等同于实际投票控制权，且所分配的证据中未包含经审计的股权结构表或公开财务报表。投资人应直接核实投票权、清算优先权、债务及现金真实情况，切忌仅凭估值或融资新闻推断。
