      - number: '3.3'
        title: 渠道分发是核心壁垒，但多供应商接入切实可行
        blocks:
          - type: paragraph
            body: >-
              ByteDance 最深的护城河并非孤立的模型跑分，而是将 AI 无缝嵌入其庞大的创作、推荐、广告、电商与协同办公工作流的能力。历史报道披露其 2023 年第三季度营收达到 $30.9
              billion，加之后续未经审计的 2026 年上半年约 $120 billion 收入报道，印证了其足以持续反哺产品迭代的资金体量，尽管这两个数据均不能代表具体业务分部的竞争份额。一份招聘备考资料将
              TikTok 的产品管理机制描述为节奏极快且高度数据驱动，可作为组织执行力的方向性信号，而非标准基准。然而，灵活的 API
              接入、开放权重模型以及竞对差异化的视频特长，让多供应商接入（multi-homing）切实可行。买方可以根据质量、价格、掌控力或合规管辖权分发任务负载，从而削弱锁定效应，除非 ByteDance
              能证明其一体化数据与工作流带来的收益远胜系统可迁移性。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: 模式复制、开源生态与信任危机限制护城河韧性
        blocks:
          - type: paragraph
            body: >-
              反向逻辑同样明确。一份投资市场分析指出，Meta、YouTube 和 Snap 均已成功复刻短视频形态，缩小了 ByteDance
              的算法领先差距；这属于带有倾向性的二手研报而非独立基准评测，但指出了老牌巨头切实的反扑路径。在模型层，开源分发机制正将价值中心从专有模型调用权推向私有数据、系统整合与垂直应用。信任同样是核心采购决策指标，而非仅仅合规注脚：FTC
              与司法部的诉讼指控其在收集儿童信息前未取得法定家长同意，并依据 COPPA 诉请民事罚金。这些均属等待法院判决的指控，并非生效的过错责任裁定。综合现有证据，ByteDance
              的护城河在渠道分发与跨产品协同上最为稳固；但在买方看重开放透明、本地部署、监管确定性或单点极致能力的场景下，防线则相对脆弱。
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP016
