      - number: '1.3'
        title: 融资历程、估值水平与信息披露局限
        blocks:
          - type: paragraph
            body: >-
              所分配的二手信源测算 ByteDance 在 2026 年初的一级市场估值接近 $550
              billion，但这只是私下协商的老股交易参考价，既非公开市场市值，也不是公司募集到的新增现金。累计融资记录未达到决策级精度：Silicon Valley Invest Club 在同一页面上同时列出
              “$19B+” 与约 $9.8 billion，而 RevenueMemo 则称超过 $10
              billion。因此本章将累计融资额列为待定，而非人为拼凑出一个精确数值。融资金额不等于可用现金，估值更不等于流动性。公开审计财报的缺失，同样导致外界无法从报道的 2024
              年收入可靠推导出利润、自由现金流、举债能力或资产负债表上的当前现金余额。
            claimRefs:
              - CO003
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: 发展里程碑与监管风险敞口
        blocks:
          - type: paragraph
            body: >-
              官方发展历程清晰可溯：从 2012 年 8 月推出 Toutiao，到 2016 年 9 月上线 Douyin，约一年后 TikTok 开启国际化拓展，再到 2017 年 11 月收购 Musical.ly
              并随后并入 TikTok。管理层在 2021 年和 2022 年相继变动；Seed 官网则显示其在 2026 年保持高频发布节奏，密集推出图像、视频及多模态模型成果。庞大体量同样带来了实质法律风险。2024 年
              8 月，FTC 称司法部已对 TikTok、ByteDance 及其关联方提起诉讼，指控其违反《儿童在线隐私保护法》（COPPA）及 2019
              年同意令。上述指控仅为已提交起诉书中的指称，并非司法裁决；案件最新进展、潜在救济方案与合规成本仍属尽调核实项。
            claimRefs:
              - CO007
              - CO008
              - CO014
              - CO015
              - CO016
