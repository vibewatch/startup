      - number: '5.3'
        title: 基础 AI 战略、自主软件智能体与开发者生态号召力
        blocks:
          - type: paragraph
            body: >-
              在消费级应用之外，ByteDance 正通过其 Seed 智能团队与软件工程实验室（SE Lab），将自身打造为前沿 AI 研究与开发者工具的提供商。Seed
              团队聚焦前沿多模态大模型的演进，发布了全双工音视频交互架构、Seed Audio 1.0 以及用于真实环境学习的 EdgeBench 基准测试。与此同时，ByteDance SE Lab
              针对自动化软件工程开展应用型 AI 研究，开发的代码生成智能体与评估框架已被 ICSE 2026、FSE 2026 及 NeurIPS 2025 等顶会收录。核心研究成果包括在 SWE-bench Lite
              上实现 AI 原生自动化缺陷修复的 MarsCode Agent、面向测试时扩展（test-time scaling）软件工程的 Trae Agent、用于自动化可执行环境构建的
              Repo2Run，以及支持仓库级代码补全的 ContextModule。此外，公司通过对 ICSE 和 FSE 的学术赞助、举办 AI IDE 研讨会、在 GitHub 上线开源基准，以及设立招揽顶级 AI
              研究员的全球人才计划，持续放大在开发者群体中的技术影响力。
