      - number: '8.3'
        title: 情景分析、可比倍数与尽调要点
        blocks:
          - type: paragraph
            body: >-
              将 ByteDance 置于全球超大市值广告与云平台可比矩阵中审视，必须扣除未上市控股公司折价、地缘重组折价以及重资本开支周期的影响。公开市场上，Meta Platforms、Alphabet、Tencent
              等同行远期 EV/Revenue 倍数在 5.0x 至 7.5x 之间，市盈率在 20x 至 28x 之间。按 2025 年预估 $186B 的收入规模测算，ByteDance 2025 年 8
              月员工回购价对应的 $330B 估值，隐含历史市销率仅约 1.77x；而二级市场 $480B 至 $550B 的报价则对应 2.58x 至 2.96x
              市销率。相比欧美上市可比公司，这些倍数在账面上折价显著，但盈利波动、TikTok U.S. 失去直接多数运营控制权以及持续的监管阴霾，证明上述折价具备合理性。


              情景推演指向三条路径：（1）乐观情景（估值 $600B–$700B；概率 25%）：TikTok Shop 维持全球超高速增长，Doubao 在亚洲市场跑通企业级智能体工作流变现，且美国算法授权净利率超 50%
              并不再受地缘冲击侵蚀；（2）基准情景（估值 $330B–$420B；概率 55%）：数字广告收入增速稳定在 12%–15%，AI 资本开支在 2027 年前回落，带动营业利润恢复至 $30B 以上，COPPA
              民事诉讼在可控法定限额内和解；（3）悲观情景（估值 $200B–$250B；概率 20%）：激进采购 AI 芯片未能转化为增量软件回报，欧洲 DSA 与 COPPA
              处罚重创广告精准投放，跨境贸易摩擦迫使资产进一步减值。核心投资逻辑破坏触发点包括：TikTok 国际业务彻底停摆、法定监管判决金额超过 $5B，或出口管制从严阻断境内外 AI 算力集群获取渠道。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
