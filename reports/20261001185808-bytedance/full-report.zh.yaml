      - number: '6.3'
        title: 商业变现、客单扩张与收入韧性
        blocks:
          - type: paragraph
            body: >-
              集团商业化体量清晰可见，但客户数的具体构成仍看不清。The Wall Street Journal 报道称其 2023 年第三季度营收达 $30.9 billion，同比增长 43%；但这属于总营收而非
              ARR，且未揭示具体是由哪些个人用户、广告主、商家或企业账户所贡献。客户价值扩张路径大致沿着从内容发现延伸至内容创作、电商交易，再到新型 AI
              与企业级产品。然而，所分配的证据未披露任何净留存率（NRR）、总留存率（GRR）、流失率、续约率、合同周期、队列分析曲线或前大客户集中度数据。即便 FTC 指控 TikTok
              借助第三方服务对活跃度较低的儿童模式（Kids Mode）用户进行再定向召回，这充其量只是重新促活机制的证据，绝非合规且有效的留存证明。
