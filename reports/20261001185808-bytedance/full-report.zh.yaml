              ByteDance 高度依赖有能力制约其渠道分发或底层基建的外部合作方与公共权力部门。美国财政部的历史命令表明，能否保留美国市场准入，可能会以股权结构剥离救济为前置条件。GlobalData 报道称
              ByteDance 曾与 Iluvatar CoreX 接洽采购处理器以扩充 AI 基础设施，这指明了一条具名的硬件采购路径，但不代表已签署正式供货协议，亦未落实交付量或供应商集中度。两家第三方目录还分发了
              ByteDance 发布的开源 skill，并说明了从其 GitHub 仓库拉取安装的方法。这虽然属于较小的风险敞口，却展现了公司开发的软件如何流经 ByteDance 无法完全掌控的渠道。The Wall
              Street Journal 报道的三季度营收同比增长 43% 至 $30.9 billion 仅能提供体量背景参考：营收不等于可用现金，无法反映现金消耗，更未能衡量禁令、诉讼、AI
