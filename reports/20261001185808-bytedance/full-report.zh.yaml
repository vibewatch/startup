  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收来源、变现机制与区域结构
        blocks:
          - type: paragraph
            body: >-
              ByteDance 依托短视频算法互动、内容分发以及旗舰平台的数字广告，驱动着一台高周转的变现引擎。行业研报估算，ByteDance 在 2025 年创造了约 $186B 营收，相较 2024 年的 $155B
              同比增长 20%。一个关键的结构性蜕变在于其商业基本盘的快速全球化：2025 年海外收入同比激增近 50%，推动国际业务收入首次在公司历史上突破合并总营收的 30%，高于 2024 年约
              25%（$39B）的比重。在北美以外的区域市场中，TikTok 在欧洲、英国、拉美及非洲的合计营收于 2025 年攀升至 $9.1B（同比增长 45.7%），较 2022 年报道的 $2.6B
              增长超过两倍。平台广告仍是基石现金牛，与此同时，中国大陆 Douyin 与海外 TikTok Shop 的直播电商与闭环交易迎来爆发式放量——其中 TikTok Shop 2024 年美国 GMV 达到
              $9B，2025 年中销售额同比增速更飙升至 120% 以上。
