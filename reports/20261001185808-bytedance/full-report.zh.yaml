      - number: '3.2'
        title: 技术领先优势取决于具体应用场景
        blocks:
          - type: paragraph
            body: >-
              现有证据并不支持存在任何全方位的绝对赢家。一项针对六款视频模型的横向评测明确断言，没有任何单一模型能在全部类别中拔得头筹；评测排名显示，画面保真度、运镜动态、角色一致性、长时长生成以及生产工作流适配的榜首分别花落不同系统。ByteDance
              官方 Seed 页面在发布模型更新时同步列出 BytePlus、Lark、Dreamina 及 CapCut，凸显出相邻产品矩阵带来的战略协同。权衡的关键在于掌控权：一份供应商分析将 Seed 2.1 Turbo
              归类为闭源权重且仅限 API 调用，而另一份对比评测则将 DeepSeek
              的开放权重路线定性为支持本地或私有化部署与定制。由于定价证据仅来自第三方横评和供应商公开网页，对比表格严格保留其原始单位与字段，未将公开挂牌价直接视为最终履约的合同商业条款。
