  - id: FM001
    title: ByteDance 目标市场机会金字塔
    type: pyramid
    summary: 市场测算金字塔对比了 ByteDance 的总可用市场边界、可服务机会及当前实际运营捕获规模。
    data:
      nodes:
        - label: 全球电商与零售 TAM（$5,000B+）
          detail: 社交购物与电商平台整合瞄准的最广泛零售交易资金池
          tone: neutral
        - label: 企业云与 AI 基础设施 TAM（$500B+）
          detail: Volcano Engine、Seed 与 Doubao 所覆盖的超大规模云与基础模型市场
          tone: neutral
        - label: 全球数字广告 SAM（$250B+）
          detail: Douyin 与 TikTok 生态捕获的高意向移动视频与效果广告
          tone: positive
        - label: ByteDance 监测收入 SOM（$186B）
          detail: 涵盖国内与国际业务的 2025 年实际预估合并公司收入
          tone: positive
        - label: TikTok Shop 商业化规模（$100B GMV）
          detail: 借助社交电商整合达成的 2025 年全球商品交易总额
          tone: positive
        - label: 2026 年 AI 基础设施资本支出（$30B）
          detail: 为确立 AI 市场领先地位而在芯片与算力基础设施上部署的资本预算
          tone: warning
    approximationNotes: 市场规模测算层级结合了自上而下的全球行业基准、Sacra 2025 年收入预估以及据报道的 2026 年 AI 基础设施资本支出数据。
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM008
      - CM016
  - id: FP001
    title: 按分发能力与部署开放度的竞争定位
    type: quadrant
    summary: 分析师序数评分显示 ByteDance 在一体化分发维度得分较高，但在部署开放度维度偏低；开源权重与内部自建方案则呈现相反的权衡。
    data:
      points:
        - label: ByteDance
          x: 5
          'y': 1
          detail: 一体化分发能力强；据报道 Seed 2.1 Turbo 采用闭源权重且仅提供 API。
        - label: Meta / YouTube
          x: 5
          'y': 2
          detail: 既有分发能力获得支撑；部署开放度尚未确立且评分保守。
        - label: Alibaba / Qwen
          x: 4
          'y': 5
          detail: 所留存分析中显示具备依托云的分发能力以及开源模型可用性。
        - label: DeepSeek
          x: 2
          'y': 5
          detail: 消费端分发证据较少，但开源权重与本地部署姿态鲜明。
        - label: Kuaishou / Kling
          x: 3
          'y': 2
          detail: 视频领域的直接竞品且提供 API；未见开源权重证据。
        - label: 内部自建
          x: 1
          'y': 5
          detail: 无原生受众分发能力，但在选用开源组件时可获得最大的架构控制权。
    approximationNotes: 两轴均采用 1（低）至 5（高）的分析师序数评分，而非实测市场数据；x 代表一体化分发能力，y 代表部署开放度，评分依据锚定于指派证据，未知项打分偏保守。
    claimRefs:
      - CP016
  - id: FI001
    title: ByteDance 商业化变现与现金流转路径
    type: flow
    summary: 直观展示将短视频算法用户注意力转化为广告收入、平台佣金及毛利润池的端到端机制。
    data:
      nodes:
        - id: attention-capture
          label: 算法注意力捕获
          detail: Douyin 与 TikTok 信息流中每日数十亿次的活跃视频播放量
        - id: commercial-ad-inventory
          label: 信息流广告竞价引擎
          detail: 动态程序化竞价与品牌广告曝光展示
        - id: marketplace-transactions
          label: 社交电商交易结算
          detail: TikTok Shop 上的原生直播带货与商家商品订单
        - id: enterprise-ai-cloud
          label: 企业级 AI 与云服务
          detail: 通过 BytePlus 开展的商业化 API token 用量与企业订阅
        - id: consolidated-gross-revenue
          label: 合并营业总收入（$186B）
          detail: 跨全球数字广告与电商业务的顶线现金生成
        - id: infrastructure-ai-reinvestment
          label: AI 基础设施与算力资本支出
          detail: 数百亿美元投向数据中心、GPU 集群及 Seed 模型
        - id: net-earnings-pool
          label: 净利润池
          detail: 大举投资硬件与网络基础设施后受挤压的净利润池
      edges:
        - from: attention-capture
          to: commercial-ad-inventory
        - from: attention-capture
          to: marketplace-transactions
        - from: commercial-ad-inventory
          to: consolidated-gross-revenue
        - from: marketplace-transactions
          to: consolidated-gross-revenue
        - from: enterprise-ai-cloud
          to: consolidated-gross-revenue
        - from: consolidated-gross-revenue
          to: infrastructure-ai-reinvestment
        - from: consolidated-gross-revenue
          to: net-earnings-pool
    approximationNotes: 流转架构图映射了源自平台功能披露与金融市场情报的高层商业化变现机制。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI008
  - id: FE001
    title: ByteDance 技术运营架构栈
    type: stack
    summary: 分层架构展示了从底层算力与基础模型到中台服务及前端应用界面的层级体系。
    data:
      layers:
        - label: 消费级与企业级应用界面
          detail: 跨移动端、桌面端及网页端的 TikTok、Douyin、CapCut、Lark、BytePlus、Dreamina 与 Dola 客户端界面。
        - label: 开发者与智能体工具层
          detail: ByteDance SE Lab 开发的 MarsCode Agent、Trae Agent、Repo2Run 以及自动代码补全引擎。
        - label: AI 基础底座与多模态引擎
          detail: Seed 基础模型（Seed2.1、Seedance 2.5、Seedream 5.0 Pro、Seed Audio 1.0）及全双工 LLM。
        - label: 推荐与数据中台
          detail: 高并发精排服务、DCAI 数据处理流水线、Schema 演进及特征库缓存。
        - label: 分布式计算基础设施
          detail: 异构算力集群、低成本高性能存储引擎及跨端网络互联。
        - label: 硬件与加速芯片底座
          detail: GPU/NPU 集群、高带宽互联网络架构、分布式参数服务器及专用训练节点。
    approximationNotes: 架构分层系对官方技术实验室披露、招聘岗位规范及产品平台公开信息的概念化梳理。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: ByteDance 可将用户参与度延伸至内容、创作、电商、AI 及企业级应用场景，但现有证据未能证实各环节转化率。
    data:
      items:
        - stage: 发现
          label: 算法内容入口
          detail: 用户通过 TikTok、Douyin 或 Toutiao 的内容信息流进入。
          touchpoints:
            - TikTok / Douyin
            - Toutiao
        - stage: 互动
          label: 持续内容消费
          detail: 调研证据显示了在有限 TikTok 用户样本中的使用时长。
          touchpoints:
            - 短视频浏览
            - 个性化内容
        - stage: 创作
          label: 创作者生产
          detail: CapCut 将用户关系从内容浏览延伸至视频创作。
          touchpoints:
            - CapCut
            - 创作者工作流
        - stage: 电商交易
          label: 商家与交易场景
          detail: Douyin 的电商地位开辟了面向商家的业务扩张路径。
          touchpoints:
            - Douyin 电商
            - 商家分发
        - stage: 产品拓展
          label: AI 与企业级延伸
          detail: Doubao、BytePlus 和 Lark 拓宽了产品层面的合作关系。
          touchpoints:
            - Doubao
            - BytePlus
            - Lark
        - stage: 长期留存
          label: 信任、留存与准入
          detail: 监管指控、特定渠道情绪及封禁禁令可能打断持续使用。
          touchpoints:
            - 隐私合规
            - 危机沟通
            - 地域可用性
    approximationNotes: 仅为概念性路径；各阶段混合了消费端与企业端场景，且不具备共同的统计总体、时间基准或实测转化率。
    claimRefs:
      - CU001
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
      - CU015
  - id: FR001
    title: 风险热力图：基于证据的残留风险评估
    type: matrix
    summary: 基于所留存证据，对发生可能性、影响程度及缓解成熟度作出定序评估；此类评估并非模型推导出的发生概率。
    data:
      columns:
        - label: 可能性信号
          detail: 表明风险敞口已发生或处于活跃状态的证据强度，并非预测概率。
        - label: 影响程度
          detail: 若记录的机制产生不利后果时的潜在影响。
        - label: 缓解成熟度
          detail: 仅涵盖指定信源中可见的控制措施；未知不等于不存在。
      rows:
        - label: 儿童隐私执法
          note: 基于 2024 年 8 月 FTC 公告；当前案件处置情况属于证据缺口。
          values:
            - label: 高
              tone: critical
              detail: 已提起联邦诉讼。
            - label: 高
              tone: critical
              detail: 诉请民事罚款与永久禁令。
            - label: Unknown
              tone: warning
              detail: 未留存关于当前有效性的证据。
        - label: 美国国家安全救济措施
          note: 财政部证据属于历史信息，需要核查当前状态。
          values:
            - label: 重大前例
              tone: warning
              detail: 2020 年的一项指令要求剥离资产并采取其他措施。
            - label: 极高
              tone: critical
              detail: 所有权或市场准入可能受到影响。
            - label: Unknown
              tone: warning
              detail: 当前救济措施及合规状态未纳入证据池。
        - label: 国际市场限制
          note: 二手信源报道了多个国家的行动，但缺少当前的收入分母。
          values:
            - label: 高前例
              tone: critical
              detail: 曾发生过调查与大规模封禁。
            - label: 在主要市场中偏高
              tone: critical
              detail: 分发与变现渠道可能被切断。
            - label: Unknown
              tone: warning
              detail: 未留存针对特定国家的应急指标。
        - label: AI 运营与分发
          note: 结合了产品广度、据报道的处理器探讨以及第三方 skill 分发。
          values:
            - label: 中
              tone: warning
              detail: 业务扩张与外部渠道分发增大了管控暴露面。
            - label: 中至高
              tone: warning
              detail: 算力、版权、安全或技术溯源失误可能延缓产品推进。
            - label: 建设中
              tone: neutral
              detail: 其中一个 skill 记录了非信任内容控制机制；全企业范围覆盖未经证实。
        - label: 财务下行风险不透明
          note: 所留存的收入指标提供了规模，但没有现金、烧钱速度、法律准备金或集中度分母。
          values:
            - label: 确定的信息缺口
              tone: warning
              detail: 指定证据池中没有当前的现金或风险敞口明细表。
            - label: 可能偏高
              tone: warning
              detail: 无法从收入推算流动性影响。
            - label: Unknown
              tone: warning
              detail: 需要开展非公开财务尽职调查。
        - label: 下游软件代码溯源
          note: 两个第三方页面展示了 ByteDance 编写的开源 skill。
          values:
            - label: 中
              tone: warning
              detail: 镜像与安装程序形成了版本控制暴露面。
            - label: 中
              tone: neutral
              detail: 核心公司财务重大性尚未确立。
            - label: 建设中
              tone: neutral
              detail: 存在非信任内容指引；签名与吊销机制未见证据。
    approximationNotes: 定序标签为分析师根据所引用事件和已披露实践综合归纳；未获得发生概率、损失金额或缓解成效评分。
