              - CV016
      - number: '8.4'
        title: 核心展品
        blocks:
          - type: callout
            title: 严守投资纪律：以 $330B 基准保持观察姿态
            body: >-
              尽管 ByteDance $186B 的收入基数展现出世界级运营体量，机构投资者仍应避免追高二级市场标记在 $480B 至 $550B 的交易。考虑到数百亿美元 AI 硬件采购导致 2025 年净利润同比收缩
              >70%，公司 2025 年 8 月出资回购确定的每股 $200.41 价格（对应 >$330B 估值），提供了更审慎的基准线。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
          - type: callout
            title: TikTok USDS 治理重组与利润归属
            body: >-
              按照 2026 年 1 月最终确立的 TikTok USDS Joint Venture LLC 架构，ByteDance 仅直接持有 19.9% 股权，董事会由占多数的独立美籍董事主导，Oracle
              负责监管数据架构。尽管预计 ByteDance 凭借算法授权与留存股权可分得 50% 或更多的净经济利润，投资者仍面临结构性治理权稀释，以及美国资产在运营上与公司主体切割的现实。
            calloutType: risk
            claimRefs:
              - CV007
              - CV015
