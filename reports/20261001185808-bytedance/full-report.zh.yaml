    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、商业模式与披露体量
        blocks:
          - type: paragraph
            body: >-
              ByteDance 由 Zhang Yiming 与 Liang Rubo 于 2012
              年创立，独立资料均显示其总部设于北京。公司目前仍为未上市私有状态，未在任何交易所挂牌。官方网站披露的业务版图涵盖内容发现、短视频、剪辑制作、电商、协同办公、游戏等多个领域，旗下产品包括
              TikTok、CapCut、TikTok Shop、Lark、Pico、Toutiao 和 Douyin。ByteDance 官方公布其在近 120 座城市拥有超过 150,000 名员工；EBSCO
              独立报告的员工数同样约为 150,000 人。第三方资料报道其 2024 年收入为 $155 billion，但 ByteDance 并未发布公开的经审计财务报表。因此该数据只能视为披露收入，不能等同于
              ARR、实际可用现金或经审计的收入运行率。
