companyProfile:
  summary: >-
    ByteDance 成立于 2012 年，总部位于北京，是一家未上市科技巨头。公司现由联合创始人 Liang Rubo 执掌；据报道，创始人 Zhang Yiming 仍凭借超级投票权对治理结构拥有重大影响。其产品矩阵横跨
    TikTok、Douyin、Toutiao、CapCut、Lark、TikTok Shop、Seed AI 以及相关的企业和创作者工具，形成了覆盖广告、电商、协同办公和 AI
    的极宽变现版图。公司业务体量巨大，但未上市企业的低透明度、各方分歧严重的融资估算，以及持续发酵的美国隐私诉讼，让治理结构、现金真实储备和监管合规成为尽调的核心核实项。
