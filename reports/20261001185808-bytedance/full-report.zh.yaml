      - number: '7.2'
        title: 内控机制失效与 AI 扩张拉大运营暴露面
        blocks:
          - type: paragraph
            body: >-
              FTC 起诉书揭示的是系统性内控失效，而非偶发孤立的技术故障：指控的违规包括家长同意缺失、账户注销未执行、数据最小化原则落空，以及通过第三方账号绕过年龄核验门槛。Britannica
              同样报道，公司高管在最初否认监控声称与指控后，最终承认员工曾获取过包含记者在内的美国用户数据。上述信源强化了外界对数据权限治理与合规运营的担忧，尽管这并不能证明当前整改的有效性。ByteDance 官方 Seed
              页面展现出庞大且高频更新的 AI 产品矩阵，覆盖音频、视觉、前沿研究与应用工具。如此宽阔的业务线，大幅增加了质量把控、版权合规、内容安全以及发布管理等需要严格核验的环节。Wikipedia 提及针对
              Seedance 2.0 的批评属于二手线索，并非司法判决的侵权认定。尽调应主动索取故障事件台账、审计范围界定、模型发布流程和可量化的整改凭据，切忌仅因预取材料未见其他事故报告就推论其运转安全。
