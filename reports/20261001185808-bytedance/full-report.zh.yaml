        - 既往先例较多；未来各国监管行动存在不确定性
        - 严重：若限制措施切断某一主要市场
        - 所指派证据池中未记录
        - 碎片化的规则可能推高合规成本与分发波动
        - 建立分国别的法律登记簿，涵盖最新状态、用户规模、收入、上诉进展及所有权应急预案
      - - 监控与审查指控
        - 美国及国际市场
        - Britannica 报道了针对记者数据调取指控与相关调查；Wikipedia 汇总了更广泛的监管审视
        - 重大：存在多起公开指控与监管审查
        - 若控制措施持续失效，将造成严重的声誉与监管冲击
        - 所留存的一手材料未证实员工解雇与整改成效
        - 数据访问与治理风险仍未解决
        - 审查特免调查结论、访问日志、处分记录、数据本地化控制及与监管机构的往来函件
    notes: 分析师的可能性与严重程度标签属于定性判断，锚定于记录在案的行动；当前法律处置结果与缓释成效未包含在指派证据池中。
