  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出类别与相邻赛道
        blocks:
          - type: paragraph
            body: >
              ByteDance
              涉足三大主要商业市场：移动数字广告、社交电商以及企业级人工智能基础设施。在核心移动数字广告领域，纳入统计的支出包括短视频（Douyin、TikTok）与资讯聚合（Toutiao）平台上的效果营销预算、品牌视频广告及算法信息流推荐展示；剔除的支出则涵盖传统线性广播电视的前期预售广告、桌面端展示广告网络与印刷出版渠道。


              在电商赛道，ByteDance 捕获的支出包括交易佣金、借助 GMV Max 与 Smart+ 投放的商家广告，以及直播打赏虚拟礼物；传统线下零售 POS 系统与企业库存 ERP 软件则在其直接业务边界之外。在
              AI 基础设施领域，纳入支出包括基础模型 Token（Seed、Doubao）、Volcano Engine
              提供的云端算力，以及生成式开发者工具（Trae、Coze）；企业本地部署的数据库硬件则被排除在外。当前主要存量替代品包括 Baidu 等成熟搜索平台，Meta（Instagram、Reels）与
              Alphabet（YouTube Shorts）等横向社交巨头，以及 Alibaba 和 Amazon 等传统电商交易平台。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
      - number: '2.2'
        title: 潜在市场空间测算、TAM/SAM/SOM 视角与 AI 资本开支
        blocks:
          - type: paragraph
            body: >
              评估 ByteDance 的市场空间，需要对其核心广告变现以及高增长的企业级 AI 与社交电商前沿业务进行分部拆解。在全球数字广告与短视频领域，ByteDance 占据领先份额，2023 年拿下短视频内容市场超过
              63% 的份额，并带动公司 2025 年整体营收预估达到 $186B，同比增长 20%。电商赛道对应 $5T+ 的全球电商 TAM，其中 TikTok Shop 于 2025 年实现约 $100B 全球
              GMV，在东南亚、欧洲和美洲展现出快速规模化扩张。


              与此同时，企业级 AI 软件与云基础设施市场的潜在 TAM 超过 $500B。ByteDance 正激进扩张该业务，计划在 2026 年投入超过 200 billion yuan（约 $30 billion）的
              AI 资本开支，以将 Seed2.1 和 Doubao
              等基础模型推广至消费级与企业级应用。市场空间测算因而呈现明显分化：一端是高毛利的国内广告现金流创造，另一端则是资本密集、受制于不同区域变现天花板的国际化运营。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM012
              - CM013
              - CM016
