  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口主导下行空间
        blocks:
          - type: paragraph
            body: >-
              最明确的下行风险信号源自政府监管行动，而非泛泛的舆论批评。2024 年 8 月，FTC 称司法部已对 TikTok、ByteDance 及其关联方提起诉讼，指控其违反 COPPA 并违背 2019
              年达成的一项同意令；起诉书要求处以民事罚款并申请永久禁令。此外，美国财政部在 2020 年的一份声明中称，一项总统行政令要求 ByteDance 和 TikTok 就针对 Musical.ly
              的收购案完成指定资产剥离并采取其他补救措施。这些记录证实了政府在历史上曾进行强力干预，但已预取的网页材料均无法确认截至 2026 年尽调基准日的最终执行状态。Britannica 与 Wikipedia
              报道的多国禁令与调查表明，市场准入风险绝不限于单一司法辖区。因此，投资判断应是：残留监管风险极高，必须专项核查最新诉讼案卷，不能断言历史命令或指控至今未变。
