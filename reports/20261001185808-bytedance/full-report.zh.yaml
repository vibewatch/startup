      - number: '2.3'
        title: 买方画像细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >
              ByteDance 旗下产品生态的客户采用逻辑截然不同，横跨消费者使用、企业广告采购与开发者 AI 工具消费。效果类广告的核心买方为首席营销官（CMO）或增长副总裁，预算出自数字效果广告池；一旦 Smart+
              等自动化投放流程展现出更低行动成本与更高转化率，即可促成采购。在社交电商领域，品牌商家与 D2C 零售商则划拨平台营销及渠道佣金预算，受爆款社交发现与达人直播转化的拉动而采用。


              在企业级 AI 与云服务板块，采购决策由首席信息官（CIO）及工程副总裁主导，预算来自企业软件与基础设施资金。促成采购的核心诉求在于低延迟推理、借助 Doubao 编程工具及 Trae
              实现的开发者生产力提效，以及相较超大规模云厂商更优的成本效率。普通消费者则扮演零边际成本的受众库存，其极高的使用粘性（日均使用超过 52 minutes）为平台沉淀出底层广告展示量，进而变现为各商业板块的收入。
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
