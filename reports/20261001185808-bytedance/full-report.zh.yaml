  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品生态版图、SKU 矩阵与核心用户流
        blocks:
          - type: paragraph
            body: >-
              ByteDance 构筑了一个紧密互联的数字产品生态，涵盖消费级应用、开发者工具与企业级软件，旨在锁定用户注意力、实现内容自动化生产并极致优化内容分发。在消费级短视频与社交场景中，TikTok 及其国内对应产品
              Douyin 提供基于算法的内容推荐流、直播以及社交电商闭环，将用户的浏览行为转化为实际商业交易。面向创作者工作流，CapCut 与 Dreamina
              提供移动端、桌面端及网页端音视频与图像编辑工具，通过整合生成式视觉模型，将内容创作周期从数小时压缩至数分钟。在企业协同与生产力场景中，Lark（Feishu）与 BytePlus 为 B2B
              企业客户提供统一通信协作、云端软件基础设施以及算法推荐应用程序编程接口（API）。支撑上述所有产品前端的，是成立于 2023 年的 Seed 基础模型部门；该部门研发了包括 Seed2.1、Seedance
              2.5 视频生成与 Seedream 5.0 Pro 设计生成在内的多模态生成式大模型，将 AI 智能全面注入消费级与企业级应用层。
