      - number: '4.2'
        title: 成本结构、AI 基础设施投入与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              尽管 ByteDance 在历史上曾取得丰厚的营业利润，但由于在基础人工智能大模型和数据中心算力集群上实施了史无前例的巨额资本开支，其未来的盈利预期正面临剧烈挤压。外部报道显示，2025 年全年净利润相比
              2024 年的 $33B 同比暴跌超过 70%，彻底逆转了此前市场预期约 $50B 年化净利润的乐观判断。虽然 ByteDance 在 2025 年前九个月依然保持极高的盈利节奏（截至 2025 年 Q3
              累计录得约 $40B 净利润），但下半年集中涌现的 AI 算力基建与 GPU 采购潮急剧拉低了全年净利润。以 ByteDance Seed 前沿研究部门及 BytePlus 企业级基础设施服务为锚点的 AI
              战略，对算力规模有着极高胃口。独立行业分析指出，ByteDance 正在直接划拨约 ¥160B（~$23B）投入 AI 基础设施，其中包括高端加速卡集群的硬件采购；更有报道称其更长期的资本开支规划高达
              $70B（~4,760B CNY），用于全球数据中心建设与算力设施扩张。
