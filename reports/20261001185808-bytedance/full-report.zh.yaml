        title: 图表
        blocks:
          - type: callout
            title: 护城河立于模型层之上
            body: 当大模型持续赋能其既有的创作、推荐、广告与电商商业闭环时，ByteDance 的防线最为坚固；单纯提供独立的模型调用 API 则面临更大的价格战与客户迁移压力。
