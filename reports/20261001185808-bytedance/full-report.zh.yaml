      - number: '4.3'
        title: 资本充足度、监管风险敞口与尽调核实缺口
        blocks:
          - type: paragraph
            body: >-
              ByteDance 自身账面流动性充裕，历史上主要将资金用于激进的员工及内部人流动性激励，而非依赖外部稀释性新股融资。公司接连推行员工持股要约收购与公司回购，2024 年 11 月确立了 $300B
              的隐含估值，2025 年 3 月推升至 $312B–$315B，2025 年 8 月又以每股 $200.41 的对价让估值突破 $330B；而机构间老股大宗交易定价则在 $400B 到 $480B
              之间波动。然而，ByteDance 的投资评估面临极为严峻的定性与定量阻力。监管与法律层面，美国司法部与 FTC 发起联邦诉讼，指控其公然违反 COPPA 规定及 2019
              年已达成的同意令，使其面临单项违规每天最高 $51,744 的法定民事罚款风险，且未成年人数据商业化或遭运营限制。更关键的是，作为非上市民营企业，ByteDance
              从未披露各业务分部的审计资产负债表、未受限制的离岸现金储备，亦未披露 TikTok 与 Douyin 的各自毛利率；这些未公开的核心指标缺口，导致机构投资者根本无法核验跨国资金流动性以及底层的单客/单品贡献价值。
