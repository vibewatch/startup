      - number: '8.2'
        title: 融资历程、内部回购与老股交易估值参考
        blocks:
          - type: paragraph
            body: >-
              ByteDance 资本结构与估值走势表明，公司主导的内部流动性安排与场外二级市场机构估值差距极大。ByteDance 历经 12 至 13 轮私募融资，累计募资 $9.4B 至 $9.5B，背后资方包括
              Sequoia Capital China (HongShan)、SoftBank Vision Fund、KKR & Co.、General Atlantic 与 Susquehanna
              International Group (SIG) 等全球顶尖机构。总股权分布大致为：国际机构投资者占约 60%，创始人与本土支持者占 20%，员工持股占
              20%；创始人张一鸣则凭超级表决权牢牢掌握多数投票权（>50%）。


              为替代正式 IPO，ByteDance 一贯靠定期回购股份向员工提供流动性。2025 年 8 月，公司批准员工以每股 $200.41 回购股份，对应估值超过 $330B；相较 2025 年 3 月的每股
              $189.90（估值 $312B–$315B）与 2024 年的每股 $171.00 稳步上行。场外第三方二级市场上，估值标记中枢更高且离散度极大：2025 年 11 月 Capital Today 向 Bank
              of China Group Investment 收购股份时对应估值达 $480B；资管机构 Fidelity Investments 与 T. Rowe Price 分别将 ByteDance 估值标在
              $410B 和 $450B 以上；SoftBank 亦重新估值至 $400B 以上。到 2026 年初，场外交易意向报价甚至冲至 $550B，与 2025 年 1 月记录的 $215B 估值低点以及 2023 年
              3 月 G42 入局时的 $220B 形成强烈反差。上述估值分歧凸显出非公开市场流动性溢价极高，且缺乏统一的公开市场定价机制。
