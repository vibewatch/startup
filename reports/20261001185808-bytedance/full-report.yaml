      - number: '7.3'
        title: Market access, compute, and distribution are material dependencies
        blocks:
          - type: paragraph
            body: >-
              ByteDance depends on counterparties and public authorities that can constrain distribution or
              infrastructure. Treasury's historical order demonstrates that U.S. market access can become conditional on
              ownership remedies. GlobalData reports that ByteDance was in talks with Iluvatar CoreX to acquire
              processors for expanding AI infrastructure, indicating a named hardware procurement path but not a signed
              supply agreement, delivery volume, or supplier concentration. Two third-party directories also distribute
              a ByteDance-published open-source skill and describe installation from its GitHub repository. That is a
              comparatively small exposure, but it illustrates how company-authored software can travel through channels
              ByteDance does not fully control. The Wall Street Journal's reported 43% year-over-year third-quarter
              revenue growth to $30.9 billion provides scale context only: revenue is not cash available, does not
              measure burn, and does not quantify the earnings or liquidity impact of bans, litigation, AI compute, or
              partner disruption.
