      - number: '6.4'
        title: Trust friction and the diligence boundary
        blocks:
          - type: paragraph
            body: >-
              Customer durability is exposed to legal, reputational, and geographic constraints. The FTC and Justice
              Department complaint alleges that TikTok and ByteDance knowingly allowed millions of children under 13 on
              the service and collected information without required parental consent; these are allegations to be
              decided by a court, not adjudicated facts. An independent Nature study of ByteDance's 2020 crisis
              communications also found materially different sentiment across Toutiao and Weibo, indicating that trust
              responses vary by channel and audience. Britannica further records that bans removed millions of users
              from ByteDance products' reach in India. Together, these sources show plausible acquisition and retention
              friction, while the absence of named enterprise buyers and longitudinal customer metrics remains the
              central evidence limitation.
            claimRefs:
              - CU011
              - CU013
              - CU014
              - CU016
