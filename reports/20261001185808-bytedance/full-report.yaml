chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Reported Scale
        blocks:
          - type: paragraph
            body: >-
              ByteDance was founded in 2012 by Zhang Yiming and Liang Rubo, and independent profiles locate its
              headquarters in Beijing. It remains privately held rather than exchange-listed. The official company site
              describes a portfolio spanning content discovery, short-form video, editing, commerce, collaboration,
              gaming, and other services, including TikTok, CapCut, TikTok Shop, Lark, Pico, Toutiao, and Douyin.
              ByteDance reports more than 150,000 employees across nearly 120 cities; EBSCO separately reports
              approximately 150,000 employees. Secondary profiles report $155 billion of 2024 revenue, but ByteDance
              does not publish public audited financial statements. That figure should therefore be treated as reported
              revenue, not ARR, cash availability, or an audited run-rate.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO013
