      - number: '7.4'
        title: Mitigation evidence, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned pool is stronger on risk events than on mitigation effectiveness. The
              skill-reviewer instructions show one security-aware practice for a ByteDance open-source project: treat
              reviewed packages as untrusted and prevent embedded instructions from changing verdicts, executing
              scripts, installing dependencies, fetching URLs, or requesting secrets. That control is narrow and cannot
              be extrapolated to TikTok privacy, corporate data access, AI model governance, or hardware sourcing.
              Investors should monitor the current FTC/DOJ docket, any operative CFIUS or successor ownership
              requirements, additional country-level bans, verified child-account and deletion-control metrics, material
              AI copyright claims, and binding processor supply commitments. Thesis-break triggers are a final order
              that materially removes access to a major market, repeated verified failure of child-data controls after
              remediation, an unmitigated loss of critical AI compute supply, or evidence that regulatory penalties and
              remediation costs materially impair liquidity. No precise penalty, cash-burn, or concentration threshold
              is supportable from this pool, so those quantities remain diligence gaps rather than modeled facts.
            claimRefs:
              - CR002
