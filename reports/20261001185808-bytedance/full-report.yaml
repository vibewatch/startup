    columns:
      - Perspective
      - Core Argument
      - Empirical Supporting Proof
      - Key Vulnerability
      - What Would Change the View
    rows:
      - - 'Thesis: Scale & Monetization'
        - Global leader in algorithmic video monetization and live social commerce
        - Estimated $186B revenue in 2025 (up 20% YoY); international revenue >30% of total
        - Maturing digital advertising growth in domestic China market (~20% YoY)
        - Sustained >30% growth in European and Latin American TikTok operations
      - - 'Thesis: AI Infrastructure & Innovation'
        - Rapid transition from social media operator to full-stack AI ecosystem leader
        - Doubao leads Chinese AI apps with 382M users; Seed2.0 and Seedance 2.5 rolled out
        - Massive capex requirements (¥160B planned for 2026) compressing net earnings
        - Demonstrated commercial software and API monetization via Volcano Engine and BytePlus
      - - 'Anti-Thesis: Profitability Contraction'
        - Aggressive compute investments have severely eroded cash generation and margins
        - 2025 net profit plunged >70% YoY from $33B in 2024 despite $40B net income through Q3
        - Uncertain payback horizon for custom chips and high-end accelerator clusters
        - Recovery of full-year net margins toward historical >20% levels
      - - 'Anti-Thesis: Geopolitical & Legal Exposure'
        - Structural loss of direct ownership over flagship U.S. asset and statutory liabilities
        - ByteDance retains only 19.9% in TikTok USDS JV; DOJ/FTC COPPA lawsuit pending
        - Ongoing risk of platform bans and civil penalties up to $51,744 per violation per day
        - Definitive court settlement of COPPA claims and stable operation of U.S. licensing economics
