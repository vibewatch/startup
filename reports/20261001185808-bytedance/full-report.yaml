      - number: '7.2'
        title: Control failures and AI expansion widen the operating surface
        blocks:
          - type: paragraph
            body: >-
              The FTC complaint describes control weaknesses rather than a single isolated technical event: alleged
              failures included parental consent, account deletion, data minimization, and age-gate bypasses through
              third-party credentials. Britannica also reports that company officials acknowledged employees had
              obtained data from U.S. users, including journalists, after initially rejecting surveillance claims. These
              sources support heightened concern about access governance and compliance operations, although they do not
              prove the present effectiveness of remediation. ByteDance's own Seed page shows a broad and actively
              updated AI product surface spanning audio, visual, research, and application categories. That breadth
              increases the number of quality, copyright, safety, and release-management controls requiring
              verification. Wikipedia's account of criticism directed at Seedance 2.0 is a secondary signal, not an
              adjudicated infringement finding. Diligence should seek incident registers, audit scope, model-release
              controls, and measurable remediation evidence rather than infer safety from the absence of another
              prefetched incident report.
