        title: Exhibits
        blocks:
          - type: callout
            title: Adoption scale is not customer economics
            body: >-
              ByteDance's disclosed and reported metrics establish broad product use, but monthly active users,
              cumulative downloads, a local survey, and group revenue have different denominators. None directly
              supplies retention, enterprise contract quality, payer concentration, or product-level revenue.
            calloutType: insight
            claimRefs:
