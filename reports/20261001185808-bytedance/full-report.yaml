  summary: >-
    ByteDance is a Beijing-headquartered private technology group founded in 2012 and led by co-founder Liang Rubo, with
    founder Zhang Yiming still reported as a major governance influence through super-voting control. Its product
    portfolio spans TikTok, Douyin, Toutiao, CapCut, Lark, TikTok Shop, Seed AI, and related enterprise and creator
