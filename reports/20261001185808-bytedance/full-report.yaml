      - number: '6.2'
        title: Adoption proof and metric comparability
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption signal in the pool is Bismarck Analysis's report that Doubao exceeded 170
              million monthly active users in China in October 2025. Other scale indicators are substantial but less
              current or use different denominators: Britannica reports more than 300 million monthly active users for
              Toutiao, more than 200 million monthly active users for CapCut, and more than 3.5 billion cumulative
              TikTok downloads. These figures cannot be added or read as a cohort because they mix monthly activity with
              lifetime downloads and do not share a measurement date. A 2022 academic paper supplies narrower behavioral
              evidence from a community questionnaire, but its local sample is not a basis for extrapolating
              ByteDance-wide penetration.
