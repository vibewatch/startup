          - type: callout
            title: Regulatory action can disrupt the customer funnel
            body: >-
              The FTC complaint and prior country-level restrictions show that user access and re-engagement practices
              can become legal or geographic constraints. The complaint's assertions remain allegations, and the
              assigned sources do not quantify resulting churn or revenue loss.
            calloutType: risk
