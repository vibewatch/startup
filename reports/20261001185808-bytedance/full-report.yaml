      - number: '6.3'
        title: Monetization, expansion, and durability
        blocks:
          - type: paragraph
            body: >-
              Commercial scale is visible at the group level, but not at the customer level. The Wall Street Journal
              reported $30.9 billion of third-quarter 2023 revenue, up 43% year over year; that is revenue rather than
              ARR and does not reveal which users, advertisers, merchants, or enterprise accounts generated it.
              Expansion pathways appear to run from content discovery to creation, commerce, and newer AI or enterprise
              products. Yet the assigned evidence discloses no NRR, GRR, churn, renewal rate, contract duration, cohort
              curve, or top-customer share. Even the FTC's allegation that TikTok used third-party services to retarget
              less active Kids Mode users is evidence of a re-engagement mechanism, not proof of successful or compliant
              retention.
            claimRefs:
              - CU008
