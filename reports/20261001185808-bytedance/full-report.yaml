  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure dominates the downside
        blocks:
          - type: paragraph
            body: >-
              The clearest downside signals come from government action rather than generalized criticism. In August
              2024, the FTC said the Department of Justice had sued TikTok, ByteDance, and affiliates, alleging COPPA
              violations and infringement of a 2019 consent order; the complaint sought civil penalties and a permanent
              injunction. Separately, Treasury's 2020 statement said a presidential order required ByteDance and TikTok
              to make specified divestments and take other measures over the Musical.ly acquisition. These records
              establish serious historical intervention, but neither prefetched page establishes the disposition as of
              the 2026 run date. International bans and investigations reported by Britannica and Wikipedia show that
              market-access risk is not confined to one jurisdiction. The investment implication is therefore high
              residual regulatory exposure with a required current-docket check, not a claim that any historical order
              or allegation remains unchanged.
            claimRefs:
