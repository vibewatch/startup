  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for ByteDance centers on its undisputed global consumer attention monopoly,
              unparalleled algorithmic recommendation flywheel, and rapid transformation into a full-stack artificial
              intelligence and social commerce powerhouse. Industry data indicates ByteDance generated $186B in revenue
              in 2025, expanding roughly 20% year-over-year from $155B in 2024, with international revenue expanding
              nearly 50% to surpass 30% of consolidated turnover. The company's core monetization pillars—high-margin
              digital video advertising and explosive live-stream e-commerce across Douyin and TikTok Shop (which
              generated $9B in U.S. GMV in 2024 with mid-2025 sales accelerating 120% YoY)—generate immense operating
              cash flow. Furthermore, ByteDance's dedicated AI divisions, including the Seed research team and Volcano
              Engine, have established leadership in consumer AI with Doubao reaching 382 million active users in China
              and advancing multimodal models like Seed2.0 and Seedance 2.5.


              Conversely, the anti-thesis highlights structural earnings deterioration, unprecedented capital
              expenditure burdens, and existential geopolitical and regulatory vulnerabilities. Despite top-line
              momentum, 2025 net profit contracted by more than 70% year-over-year from $33B in 2024 as ByteDance
              initiated an aggressive AI infrastructure investment surge, planning ¥160B (~$23B) in 2026 compute capital
              expenditure, including a potential purchase of 20,000 Nvidia H200 chips. Concurrently, U.S. geopolitical
              mandates forced the corporate carve-out of TikTok's U.S. operations into TikTok USDS Joint Venture LLC in
              January 2026, wherein ByteDance retains only a 19.9% direct equity interest, capping U.S. profit capture
              to algorithm licensing and minority equity. On regulatory fronts, the U.S. Department of Justice and
              Federal Trade Commission have sued ByteDance alleging flagrant violations of the Children's Online Privacy
              Protection Act (COPPA) and breach of a 2019 consent order, exposing the firm to statutory civil penalties
              of up to $51,744 per violation per day. Without audited disclosure of unencumbered offshore cash and
              segment profitability, the risk-adjusted return profile warrants strict investor discipline.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.2'
        title: Financing History, Internal Buybacks, and Secondary Valuation Marks
        blocks:
          - type: paragraph
            body: >-
              ByteDance's capital structure and valuation trajectory demonstrate a substantial divergence between
              company-sponsored internal liquidity transactions and unlisted secondary market institutional valuations.
              Across its lifecycle, ByteDance has raised $9.4B to $9.5B in total funding over 12 to 13 private
              investment rounds, backed by major global institutions including Sequoia Capital China (HongShan),
              SoftBank Vision Fund, KKR & Co., General Atlantic, and Susquehanna International Group (SIG). Total equity
              ownership remains distributed roughly 60% with international institutional investors, 20% with founders
              and domestic Chinese backers, and 20% with employees, while founder Zhang Yiming maintains majority voting
              control (>50%) through super-voting equity rights.


              In corporate liquidity transactions, ByteDance has consistently executed share buybacks to provide
              liquidity to employees in lieu of a formal initial public offering. In August 2025, ByteDance authorized
              an employee share repurchase at $200.41 per share, implying a corporate valuation above $330B,
              representing an increase from $189.90 per share ($312B–$315B valuation) in March 2025 and $171.00 per
              share in 2024. In third-party secondary markets, valuation marks have trended higher with significant
              dispersion: institutional blocks traded at a $480B valuation via Capital Today's purchase of shares from
              Bank of China Group Investment in November 2025, while asset managers Fidelity Investments and T. Rowe
              Price marked ByteDance equity above $410B and $450B, respectively, and SoftBank revalued the firm above
              $400B. Outside private registries, secondary indications reached $550B by early 2026, contrasting sharply
              with depressed secondary valuations of $215B recorded in January 2025 and $220B transactions executed by
              G42 in March 2023. These divergent valuation marks underscore substantial private market liquidity premia
              and the absence of a unified public market pricing mechanism.
            claimRefs:
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
