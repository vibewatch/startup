      - number: '8.3'
        title: Scenario Analysis, Comparable Multiples, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating ByteDance across comparable global mega-cap advertising and cloud platforms requires adjusting
              for private holding company discounts, geopolitical restructuring penalties, and heavy capital expenditure
              cycles. In public markets, peers such as Meta Platforms, Alphabet, and Tencent trade at forward enterprise
              value-to-revenue multiples between 5.0x and 7.5x and price-to-earnings multiples between 20x and 28x. At
              an estimated 2025 revenue base of $186B, ByteDance's August 2025 employee buyback valuation of $330B
              reflects an implied trailing revenue multiple of approximately 1.77x, whereas secondary marks at $480B to
              $550B imply 2.58x to 2.96x revenue. These multiples represent a substantial optical discount to Western
              public comps, justified by earnings volatility, the loss of direct majority operational control over
              TikTok U.S., and regulatory overhang.


              Scenario modeling indicates three distinct paths: (1) Bull Case ($600B–$700B valuation; 25% probability),
              where TikTok Shop sustains global hypergrowth, Doubao monetizes enterprise agentic workflows across Asian
              markets, and U.S. algorithm licensing margins exceed 50% without further geopolitical erosion; (2) Base
              Case ($330B–$420B valuation; 55% probability), where digital ad revenue stabilizes at 12–15% growth, AI
              capex moderates by 2027 to restore operating profit above $30B, and COPPA civil litigation settles within
              manageable statutory limits; and (3) Bear Case ($200B–$250B valuation; 20% probability), where aggressive
              AI chip procurement fails to generate accretive software returns, European DSA and COPPA penalties impair
              ad targeting, and cross-border trade friction forces further asset write-downs. Key thesis-break triggers
              include a total operational shutdown of international TikTok operations, statutory regulatory judgments
              exceeding $5B, or severe export control enforcement blocking access to domestic and foreign AI compute
              clusters.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Underwriting: Maintain Track Posture at $330B Benchmark'
            body: >-
              While ByteDance's $186B revenue base demonstrates world-class operating scale, institutional investors
              should avoid chasing secondary market trades marked at $480B to $550B. The company-sponsored August 2025
              buyback price of $200.41 per share (implying >$330B valuation) provides a more prudent baseline,
              especially given the >70% year-over-year contraction in 2025 net profit resulting from tens of billions in
              AI hardware procurement.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV012
              - CV014
          - type: callout
            title: TikTok USDS Governance Restructuring and Profit Attribution
            body: >-
              Under the January 2026 finalized TikTok USDS Joint Venture LLC structure, ByteDance holds only a 19.9%
              direct equity interest, with an independent majority-American board and Oracle overseeing data
              architecture. Although ByteDance is projected to capture 50% or more of net economic profit through
              algorithm licensing and retained equity, investors face structural governance dilution and operational
              ring-fencing of U.S. assets.
            calloutType: risk
            claimRefs:
              - CV007
              - CV015
