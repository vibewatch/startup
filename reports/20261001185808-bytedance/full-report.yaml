      - number: '5.3'
        title: Foundational AI Strategy, Autonomous Software Agents, and Developer Signal
        blocks:
          - type: paragraph
            body: >-
              Beyond consumer application delivery, ByteDance has positioned itself as an advanced AI research and
              developer tooling provider through its Seed intelligence group and Software Engineering Lab (SE Lab). Seed
              focuses on advancing frontier multimodal models, releasing full-duplex audio-visual interaction
              architectures, Seed Audio 1.0, and EdgeBench benchmarks for real-world environmental learning.
              Concurrently, the ByteDance SE Lab conducts applied AI research on automated software engineering,
              developing code generation agents and evaluation frameworks accepted at peer-reviewed venues including
              ICSE 2026, FSE 2026, and NeurIPS 2025. Key research assets include MarsCode Agent for AI-native automated
              bug fixing on SWE-bench Lite, Trae Agent for test-time scaling software engineering, Repo2Run for
              automated executable environment compilation, and ContextModule for repository-level code completion.
              Developer signal is reinforced through academic sponsorships at ICSE and FSE, AI IDE workshops,
              open-source benchmarks on GitHub, and global talent programs targeting advanced artificial intelligence
              researchers.
            claimRefs:
