      - number: '1.2'
        title: Leadership, Governance, and Control
        blocks:
          - type: paragraph
            body: >-
              ByteDance's official board page names Rubo Liang as chair and lists Arthur Dantchik, William E. Ford,
              Xavier Niel, and Neil Shen as directors. Independent sources report that Zhang Yiming served as chief
              executive until 2021, when co-founder Liang Rubo took over, while Julie Gao became chief financial officer
              in 2022. Economic ownership and voting control appear materially different: RevenueMemo and Wikipedia
              report an approximate 60% institutional, 20% employee, and 20% founder-and-leadership equity split, while
              both report majority voting control for Zhang through super-voting rights. These are secondary estimates,
              not an audited cap table. Investors therefore need the current shareholder register, voting-right
              schedule, board reserved matters, and key-person succession plan before relying on the reported ownership
              percentages.
