callouts:
  - calloutType: risk
    title: Geopolitical Carve-outs and Compliance Overheads Constrain Market Scale
    body: >
      While ByteDance commands enormous global scale, regulatory enforcement creates operational friction and margin compression. Federal enforcement in the United States over COPPA children's privacy violations, European DSA investigations into algorithmic design, and the restructuring of TikTok USDS Joint Venture LLC with Oracle and private equity investors dilute direct operational control while imposing strict data governance standards.
    claimRefs:
      - CM005
      - CM006
      - CM010
      - CM015
  - calloutType: insight
    title: Aggressive AI Capex Deployment Rebalances Corporate Monetization
    body: >
      ByteDance is committing over 200 billion yuan (~$30B) to AI infrastructure in 2026, rivaling the capital intensity of Western hyperscalers like Meta and Microsoft. This aggressive deployment compresses near-term profit margins—evidenced by a reported 70% drop in 2025 net income despite 20% revenue growth—as the company aggressively pivots from an advertising aggregator into a vertically integrated AI and foundation model powerhouse.
    claimRefs:
      - CM001
      - CM004
      - CM014
