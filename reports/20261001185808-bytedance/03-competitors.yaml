figures:
  - id: FP001
    title: Competitive positioning by distribution and deployment openness
    type: quadrant
    summary: >-
      Analyst ordinal scores place ByteDance high on integrated distribution but low on deployment
      openness, while open-weight and internal-build alternatives reverse that tradeoff.
    data:
      points:
        - label: ByteDance
          x: 5
          y: 1
          detail: "High integrated distribution; Seed 2.1 Turbo is reported closed-weight and API-only."
        - label: "Meta / YouTube"
          x: 5
          y: 2
          detail: "Incumbent distribution is supported; deployment openness is not established and scored conservatively."
        - label: "Alibaba / Qwen"
          x: 4
          y: 5
          detail: "Cloud-linked distribution plus open-source model availability in the retained analysis."
        - label: DeepSeek
          x: 2
          y: 5
          detail: "Less consumer distribution evidence but strong open-weight and local-deployment posture."
        - label: "Kuaishou / Kling"
          x: 3
          y: 2
          detail: "Direct video competition with API availability; open-weight evidence is absent."
        - label: "Internal build"
          x: 1
          y: 5
          detail: "No native audience distribution but maximum architectural control when open components are selected."
    approximationNotes: >-
      Both axes use analyst ordinal scores from 1 (low) to 5 (high), not measured market data;
      x represents integrated distribution and y represents deployment openness, with rationales
      tied to the assigned evidence and unknowns scored conservatively.
    claimRefs: [CP016]
callouts:
  - calloutType: insight
    title: The moat sits above the model layer
    body: >-
      ByteDance's defensible position is strongest when models improve its existing creation,
      recommendation, advertising, and commerce loops; standalone model access faces stronger
      price and portability pressure.
    claimRefs: [CP001, CP002, CP003, CP016]
  - calloutType: risk
    title: Trust can force architectural switching
    body: >-
      Active privacy allegations and jurisdiction-specific deployment requirements can make
      governance and data location decisive even when ByteDance is technically competitive.
    claimRefs: [CP009, CP010, CP016]
