      - ["Kling 2 Master", "$0.10/sec highest and $0.04/sec standard", "$30/month for 600 credits in comparison", "Text, image, video-to-video, and camera controls", "Discounts and realized enterprise rate unknown", "Benchmark actual workflow quality and credit consumption"]
      - ["Sora 2", "$0.15/sec highest and $0.08/sec standard", "ChatGPT Plus at $20/month with limits in comparison", "Text and image-to-video; limited video-to-video", "Usage limits and enterprise terms unknown", "Compare total iteration cost, not headline unit price"]
      - ["DeepSeek open-weight approach", "Exact price not retained", "Local or on-premises deployment described", "Customization and deployment control", "Hardware, labor, and model-specific cost unknown", "Model access may commoditize while operations remain costly"]
      - ["Internal build / multi-model routing", "No comparable public unit", "Buyer-operated integration", "Best-of-breed routing and governance control", "Full TCO and switching cost unknown", "Request workload volumes, evaluation scores, and operating cost"]
