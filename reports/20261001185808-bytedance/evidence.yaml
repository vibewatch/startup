evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing ledger covering primary equity, debt, secondary transactions, and any continuation
      vehicles.
    whyItMatters: >-
      Published totals conflict, and neither cumulative funding nor private-market valuation establishes current cash
      availability.
    diligencePath: >-
      Obtain the audited cap table, financing schedule, debt register, and transaction-level cash-flow bridge from
      management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-customers
    missingEvidence: Audited revenue, profitability, cash, debt, segment economics, and companywide customer definitions and counts.
    whyItMatters: Reported revenue cannot establish ARR, margins, cash generation, leverage, or customer concentration.
    diligencePath: Request audited statements, quality-of-earnings materials, segment schedules, and customer cohort exports.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-table
    missingEvidence: A complete current executive roster, committee assignments, succession coverage, and delegated authorities.
    whyItMatters: The public source pool identifies only a subset of group leadership and cannot establish full functional coverage.
    diligencePath: Request the organization chart, executive biographies, board committee charters, and succession plan.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: The complete shareholder register, holder-level rights, option pool, preferences, and board appointment rights.
    whyItMatters: The stakeholder table is a public-evidence sample and cannot establish the full control or economic waterfall.
    diligencePath: Review the cap table, shareholder agreement, option plan, voting agreements, and board appointment documents.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: consolidated-financial-disclosure
    missingEvidence: >-
      Audited consolidated financial statements detailing segment-by-segment gross margins, Douyin vs TikTok revenue
      splits, and exact domestic China profit contribution.
    whyItMatters: >-
      As a private Cayman Islands holding entity, ByteDance does not publish audited SEC or public stock exchange
      filings; financial figures rely on secondary market share buyback leaks and third-party analyst estimates.
    diligencePath: >-
      Review internal investor quarterly presentations, private placement memorandums, or regulatory filings submitted
      in connection with joint venture transactions.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: Comparable audited revenue, funding, segment share, and customer metrics for each material competitor.
    whyItMatters: >-
      Without like-for-like denominators, relative scale and ability to sustain price competition cannot be
      underwritten.
    diligencePath: Obtain audited filings where available and management-approved segment data for private competitors.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current official price sheets, enterprise discounts, minimum commitments, and realized workload costs across the
      compared offers.
    whyItMatters: Third-party list rates do not establish contract economics or total cost for a comparable workload.
    diligencePath: Run a standardized request-for-quote and benchmark using identical quality, duration, and volume assumptions.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: Independent, reproducible evaluation of ByteDance, Kling, Sora, Qwen, and DeepSeek on buyer-specific workloads.
    whyItMatters: Vendor and comparison-page rankings do not prove production quality, safety, latency, or reliability.
    diligencePath: Commission blinded evaluations with frozen prompts, disclosed versions, failure rates, latency, and cost.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: switching-and-multi-homing
    missingEvidence: Customer-level renewal, workload-routing, migration-cost, and multi-homing evidence.
    whyItMatters: Architecture permits multi-homing, but actual switching friction and buyer behavior remain unmeasured.
    diligencePath: >-
      Interview enterprise buyers and inspect contracts, data-egress terms, model-evaluation logs, and migration
      histories.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited segment income statements and balance sheets disclosing standalone margins for Douyin vs TikTok.
    whyItMatters: >-
      Without segmented audited financials, institutional underwriters cannot isolate international TikTok profitability
      from domestic advertising cash flows.
    diligencePath: >-
      Request confidential audited jurisdictional financial statements and intercompany transfer pricing documentation
      during institutional diligence.
    relatedQuestionRefs:
      - QI001
      - QI002
  - type: private-evidence-only
    severity: material
    topic: capex-commitments
    missingEvidence: >-
      Binding contract disclosures for AI chip procurement, data center leases, and multi-year cloud compute
      commitments.
    whyItMatters: >-
      Reported capex estimates between $23B and $70B create major operating leverage variance and uncertain near-term
      cash burn.
    diligencePath: >-
      Obtain management disclosure of executed hardware procurement contracts and multi-year data center lease
      schedules.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: material
    topic: hardware-infrastructure
    missingEvidence: >-
      Official disclosures on total GPU cluster sizing, internal data center locations, and specialized AI silicon
      deployments for Seed models.
    whyItMatters: >-
      Directly affects underwriting of capital expenditure intensity, foundation model training scalability, and
      sensitivity to semiconductor export controls.
    diligencePath: >-
      Request confidential infrastructure capex schedules, cloud compute contracts, and semiconductor supplier
      agreements during technical diligence.
    relatedQuestionRefs:
      - QE003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named paying enterprise customers, contract status, deployment scale, outcomes, and referenceable customer
      testimony for BytePlus, Lark, or other B2B products.
    whyItMatters: >-
      Product users and company-listed offerings do not establish enterprise production adoption, contract durability,
      or reference quality.
    diligencePath: >-
      Request a customer roster and contract sample, then verify deployments directly with customer references and
      procurement records.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: >-
      NRR, GRR, churn, renewal rate, contract duration, paid conversion, and cohort retention by product, geography, and
      customer segment.
    whyItMatters: >-
      Snapshot MAU, downloads, survey use, and retargeting mechanics cannot establish durable customer relationships or
      recurring economics.
    diligencePath: >-
      Obtain board cohort reporting and billing data, reconcile active and paying users, and test retention by
      acquisition vintage and product.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue concentration across top advertisers, merchants, enterprise accounts, app stores, distribution partners,
      and major geographies.
    whyItMatters: >-
      Group revenue growth does not show whether a small number of payers, channels, or jurisdictions creates material
      downside exposure.
    diligencePath: >-
      Request top-10 and top-100 customer and channel concentration schedules with revenue, gross profit, contract term,
      and renewal history.
    relatedQuestionRefs:
      - QU010
  - type: stale
    severity: minor
    topic: adoption-metric-vintage
    missingEvidence: >-
      Current, consistently defined active-user and paid-user metrics for TikTok, Toutiao, CapCut, Douyin, and
      ByteDance's enterprise products.
    whyItMatters: Several assigned metrics omit an as-of date or are historical, preventing a reliable current adoption trajectory.
    diligencePath: Obtain dated product analytics with metric definitions and compare monthly cohorts over at least eight quarters.
    relatedQuestionRefs:
      - QU004
  - type: stale
    severity: material
    topic: current-legal-status
    missingEvidence: >-
      Current dockets, final orders, settlements, appeals, and operative ownership or transaction restrictions for the
      cited U.S. matters.
    whyItMatters: >-
      Historical complaints and orders establish precedent but cannot support a current legal-status or probability
      conclusion as of 2026-10-01.
    diligencePath: >-
      Obtain counsel-prepared litigation and regulatory schedules, verify every cited docket and order with the issuing
      authority, and reconcile pending obligations to board reporting.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-and-concentration-exposure
    missingEvidence: >-
      Cash, burn, remediation costs, penalties accrued, revenue and users by jurisdiction, supplier shares, customer
      concentration, and binding processor commitments.
    whyItMatters: >-
      Revenue scale does not reveal cash availability, downside liquidity, concentration, or the financial effect of a
      ban, supplier failure, or adverse judgment.
    diligencePath: >-
      Review audited statements, management liquidity bridge, legal reserves, product and jurisdiction contribution
      margins, supplier spend, contracts, and concentration schedules.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-segment-profitability
    missingEvidence: >-
      Audited segment income statements separating Douyin domestic Chinese operations from TikTok international
      operations and Volcano Engine cloud revenue.
