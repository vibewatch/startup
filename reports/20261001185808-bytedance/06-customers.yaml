company:
  name: "ByteDance"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    ByteDance has strong product-level adoption proof across Doubao, Toutiao, CapCut,
    and TikTok, but the assigned evidence is much stronger on users than on paying
    customers. Public retention, contract, enterprise-customer, and concentration
    data remain material diligence gaps, while privacy enforcement and country-level
    restrictions can impair durable access to user cohorts.
sections:
  - id: "customer-and-payer-segments"
    title: "Customer and payer segments"
    body: >-
      ByteDance serves several economically distinct populations that should not be
      collapsed into a single customer count. Consumers use TikTok and Douyin for
      short-form video, Toutiao for personalized content, CapCut for creation, and
      Doubao for AI assistance; the company also presents BytePlus and Lark as
      business-facing products. Douyin's reported position as China's third-largest
      e-commerce platform adds merchants and commerce participants to the mix, while
      BytePlus provides a route to enterprise software buyers. The available sources
      identify these surfaces but do not disclose the split between users, creators,
      advertisers, merchants, paying subscribers, and contracted enterprises. The
      segmentation table therefore treats product reach as adoption evidence, not as
      a proxy for revenue contribution or customer retention.
    claimRefs:
      - "CU001"
      - "CU008"
      - "CU009"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "adoption-proof-and-comparability"
    title: "Adoption proof and metric comparability"
    body: >-
      The clearest current adoption signal in the pool is Bismarck Analysis's report
      that Doubao exceeded 170 million monthly active users in China in October 2025.
      Other scale indicators are substantial but less current or use different
      denominators: Britannica reports more than 300 million monthly active users for
      Toutiao, more than 200 million monthly active users for CapCut, and more than
      3.5 billion cumulative TikTok downloads. These figures cannot be added or read
      as a cohort because they mix monthly activity with lifetime downloads and do not
      share a measurement date. A 2022 academic paper supplies narrower behavioral
      evidence from a community questionnaire, but its local sample is not a basis
      for extrapolating ByteDance-wide penetration.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "monetization-expansion-and-durability"
    title: "Monetization, expansion, and durability"
    body: >-
      Commercial scale is visible at the group level, but not at the customer level.
      The Wall Street Journal reported $30.9 billion of third-quarter 2023 revenue,
      up 43% year over year; that is revenue rather than ARR and does not reveal which
      users, advertisers, merchants, or enterprise accounts generated it. Expansion
      pathways appear to run from content discovery to creation, commerce, and newer
      AI or enterprise products. Yet the assigned evidence discloses no NRR, GRR,
      churn, renewal rate, contract duration, cohort curve, or top-customer share.
      Even the FTC's allegation that TikTok used third-party services to retarget less
      active Kids Mode users is evidence of a re-engagement mechanism, not proof of
      successful or compliant retention.
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU015"
    figureRefs:
      - "FU001"
  - id: "trust-friction-and-diligence-boundary"
    title: "Trust friction and the diligence boundary"
    body: >-
      Customer durability is exposed to legal, reputational, and geographic
      constraints. The FTC and Justice Department complaint alleges that TikTok and
      ByteDance knowingly allowed millions of children under 13 on the service and
      collected information without required parental consent; these are allegations
      to be decided by a court, not adjudicated facts. An independent Nature study of
      ByteDance's 2020 crisis communications also found materially different
      sentiment across Toutiao and Weibo, indicating that trust responses vary by
      channel and audience. Britannica further records that bans removed millions of
      users from ByteDance products' reach in India. Together, these sources show
      plausible acquisition and retention friction, while the absence of named
      enterprise buyers and longitudinal customer metrics remains the central
      evidence limitation.
    claimRefs:
      - "CU011"
      - "CU013"
      - "CU014"
      - "CU016"
callouts:
  - calloutType: "insight"
    title: "Adoption scale is not customer economics"
    body: >-
      ByteDance's disclosed and reported metrics establish broad product use, but
      monthly active users, cumulative downloads, a local survey, and group revenue
      have different denominators. None directly supplies retention, enterprise
      contract quality, payer concentration, or product-level revenue.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU010"
  - calloutType: "risk"
    title: "Regulatory action can disrupt the customer funnel"
    body: >-
      The FTC complaint and prior country-level restrictions show that user access
      and re-engagement practices can become legal or geographic constraints. The
      complaint's assertions remain allegations, and the assigned sources do not
      quantify resulting churn or revenue loss.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU016"
