  evidenceGaps:
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: >-
        Named paying enterprise customers, contract status, deployment scale, outcomes,
        and referenceable customer testimony for BytePlus, Lark, or other B2B products.
      whyItMatters: >-
        Product users and company-listed offerings do not establish enterprise
        production adoption, contract durability, or reference quality.
      diligencePath: >-
        Request a customer roster and contract sample, then verify deployments directly
        with customer references and procurement records.
      relatedQuestionRefs:
        - "QU003"
      relatedTableRefs:
        - "TU003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-and-renewal"
      missingEvidence: >-
        NRR, GRR, churn, renewal rate, contract duration, paid conversion, and cohort
        retention by product, geography, and customer segment.
      whyItMatters: >-
        Snapshot MAU, downloads, survey use, and retargeting mechanics cannot establish
        durable customer relationships or recurring economics.
      diligencePath: >-
        Obtain board cohort reporting and billing data, reconcile active and paying
        users, and test retention by acquisition vintage and product.
      relatedQuestionRefs:
        - "QU006"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Revenue concentration across top advertisers, merchants, enterprise accounts,
        app stores, distribution partners, and major geographies.
      whyItMatters: >-
        Group revenue growth does not show whether a small number of payers, channels,
        or jurisdictions creates material downside exposure.
      diligencePath: >-
        Request top-10 and top-100 customer and channel concentration schedules with
        revenue, gross profit, contract term, and renewal history.
      relatedQuestionRefs:
        - "QU010"
    - type: "stale"
      severity: "minor"
      topic: "adoption-metric-vintage"
      missingEvidence: >-
        Current, consistently defined active-user and paid-user metrics for TikTok,
        Toutiao, CapCut, Douyin, and ByteDance's enterprise products.
      whyItMatters: >-
        Several assigned metrics omit an as-of date or are historical, preventing a
        reliable current adoption trajectory.
      diligencePath: >-
        Obtain dated product analytics with metric definitions and compare monthly
        cohorts over at least eight quarters.
      relatedQuestionRefs:
        - "QU004"
