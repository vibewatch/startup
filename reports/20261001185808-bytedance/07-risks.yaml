figures:
  - id: "FR001"
    title: "Risk heatmap: evidence-based residual assessment"
    type: "matrix"
    summary: "Ordinal likelihood, impact, and mitigation-maturity assessments based on the retained evidence; they are not modeled probabilities."
    data:
      columns:
        - label: "Likelihood signal"
          detail: "Strength of evidence that the exposure has occurred or is active, not a forecast probability."
        - label: "Impact"
          detail: "Potential effect if the documented mechanism produces an adverse outcome."
        - label: "Mitigation maturity"
          detail: "Only controls visible in the assigned sources; unknown does not mean absent."
      rows:
        - label: "Children's privacy enforcement"
          note: "Based on the August 2024 FTC announcement; current case disposition is a gap."
          values:
            - label: "High"
              tone: "critical"
              detail: "A federal complaint was filed."
            - label: "High"
              tone: "critical"
              detail: "Civil penalties and a permanent injunction were requested."
            - label: "Unknown"
              tone: "warning"
              detail: "No current effectiveness evidence was retained."
        - label: "U.S. national-security remedy"
          note: "Treasury evidence is historical and requires a current-status check."
          values:
            - label: "Material precedent"
              tone: "warning"
              detail: "A 2020 order required divestments and other measures."
            - label: "Critical"
              tone: "critical"
              detail: "Ownership or market access could be affected."
            - label: "Unknown"
              tone: "warning"
              detail: "Current remedy and compliance status are not in the pool."
        - label: "International market restrictions"
          note: "Secondary sources report multiple country actions without current revenue denominators."
          values:
            - label: "High precedent"
              tone: "critical"
              detail: "Investigations and large-scale bans have occurred."
            - label: "High in a major market"
              tone: "critical"
              detail: "Distribution and monetization can be removed."
            - label: "Unknown"
              tone: "warning"
              detail: "No country contingency metrics were retained."
        - label: "AI operations and distribution"
          note: "Combines product breadth, a reported processor discussion, and third-party skill distribution."
          values:
            - label: "Medium"
              tone: "warning"
              detail: "Expansion and external distribution increase the control surface."
            - label: "Medium to high"
              tone: "warning"
              detail: "Compute, copyright, safety, or provenance failures could delay products."
            - label: "Developing"
              tone: "neutral"
              detail: "One skill documents untrusted-content controls; enterprise-wide coverage is unproven."
        - label: "Financial downside opacity"
          note: "The retained revenue metric supplies scale but no cash, burn, legal-reserve, or concentration denominator."
          values:
            - label: "Certain information gap"
              tone: "warning"
              detail: "No current cash or exposure schedule is in the assigned pool."
            - label: "Potentially high"
              tone: "warning"
              detail: "Liquidity impact cannot be sized from revenue."
            - label: "Unknown"
              tone: "warning"
              detail: "Private financial diligence is required."
        - label: "Downstream software provenance"
          note: "Two third-party pages expose a ByteDance-authored open-source skill."
          values:
            - label: "Medium"
              tone: "warning"
              detail: "Mirrors and installers create a version-control surface."
            - label: "Medium"
              tone: "neutral"
              detail: "Core-company financial materiality is not established."
            - label: "Developing"
              tone: "neutral"
              detail: "Untrusted-content guidance exists; signing and revocation are not evidenced."
    approximationNotes: "Ordinal labels are analyst synthesis from cited events and disclosed practices; no probability, loss amount, or mitigation-effectiveness score was available."
