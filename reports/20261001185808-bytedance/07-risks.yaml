company:
  name: "ByteDance"
chapter:
  number: 7
  title: "Risks"
  summary: "ByteDance's highest-evidence risks are regulatory: a 2024 U.S. complaint alleged repeated children's-privacy violations, while a 2020 CFIUS order required divestments and other measures over national-security concerns. International restrictions, expanding AI infrastructure, and third-party distribution add operational and dependency exposure, but the assigned public evidence does not establish current case outcomes, quantified product concentration, cash exposure, or mitigation effectiveness."
sections:
  - id: "regulatory-legal"
    title: "Regulatory and legal exposure dominates the downside"
    body: >-
      The clearest downside signals come from government action rather than
      generalized criticism. In August 2024, the FTC said the Department of
      Justice had sued TikTok, ByteDance, and affiliates, alleging COPPA
      violations and infringement of a 2019 consent order; the complaint sought
      civil penalties and a permanent injunction. Separately, Treasury's 2020
      statement said a presidential order required ByteDance and TikTok to make
      specified divestments and take other measures over the Musical.ly
      acquisition. These records establish serious historical intervention, but
      neither prefetched page establishes the disposition as of the 2026 run
      date. International bans and investigations reported by Britannica and
      Wikipedia show that market-access risk is not confined to one
      jurisdiction. The investment implication is therefore high residual
      regulatory exposure with a required current-docket check, not a claim
      that any historical order or allegation remains unchanged.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-technical"
    title: "Control failures and AI expansion widen the operating surface"
    body: >-
      The FTC complaint describes control weaknesses rather than a single
      isolated technical event: alleged failures included parental consent,
      account deletion, data minimization, and age-gate bypasses through
      third-party credentials. Britannica also reports that company officials
      acknowledged employees had obtained data from U.S. users, including
      journalists, after initially rejecting surveillance claims. These sources
      support heightened concern about access governance and compliance
      operations, although they do not prove the present effectiveness of
      remediation. ByteDance's own Seed page shows a broad and actively updated
      AI product surface spanning audio, visual, research, and application
      categories. That breadth increases the number of quality, copyright,
      safety, and release-management controls requiring verification.
      Wikipedia's account of criticism directed at Seedance 2.0 is a secondary
      signal, not an adjudicated infringement finding. Diligence should seek
      incident registers, audit scope, model-release controls, and measurable
      remediation evidence rather than infer safety from the absence of another
      prefetched incident report.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-model"
    title: "Market access, compute, and distribution are material dependencies"
    body: >-
      ByteDance depends on counterparties and public authorities that can
      constrain distribution or infrastructure. Treasury's historical order
      demonstrates that U.S. market access can become conditional on ownership
      remedies. GlobalData reports that ByteDance was in talks with Iluvatar
      CoreX to acquire processors for expanding AI infrastructure, indicating a
      named hardware procurement path but not a signed supply agreement,
      delivery volume, or supplier concentration. Two third-party directories
      also distribute a ByteDance-published open-source skill and describe
      installation from its GitHub repository. That is a comparatively small
      exposure, but it illustrates how company-authored software can travel
      through channels ByteDance does not fully control. The Wall Street
      Journal's reported 43% year-over-year third-quarter revenue growth to
      $30.9 billion provides scale context only: revenue is not cash available,
      does not measure burn, and does not quantify the earnings or liquidity
      impact of bans, litigation, AI compute, or partner disruption.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR006"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
  - id: "mitigation-monitoring"
    title: "Mitigation evidence, monitoring indicators, and thesis-break triggers"
    body: >-
      Public evidence in the assigned pool is stronger on risk events than on
      mitigation effectiveness. The skill-reviewer instructions show one
      security-aware practice for a ByteDance open-source project: treat reviewed
      packages as untrusted and prevent embedded instructions from changing
      verdicts, executing scripts, installing dependencies, fetching URLs, or
      requesting secrets. That control is narrow and cannot be extrapolated to
      TikTok privacy, corporate data access, AI model governance, or hardware
      sourcing. Investors should monitor the current FTC/DOJ docket, any
      operative CFIUS or successor ownership requirements, additional
      country-level bans, verified child-account and deletion-control metrics,
      material AI copyright claims, and binding processor supply commitments.
      Thesis-break triggers are a final order that materially removes access to
      a major market, repeated verified failure of child-data controls after
      remediation, an unmitigated loss of critical AI compute supply, or
      evidence that regulatory penalties and remediation costs materially
      impair liquidity. No precise penalty, cash-burn, or concentration
      threshold is supportable from this pool, so those quantities remain
      diligence gaps rather than modeled facts.
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR010"
      - "CR012"
      - "CR014"
      - "CR016"
