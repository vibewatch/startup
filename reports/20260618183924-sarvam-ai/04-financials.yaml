- id: monetization-and-public-traction
  title: Monetization surfaces exist, but public traction is usage-led rather than revenue-quality transparent
  body: 'Sarvam does have visible monetization surfaces. Its public pricing pages list pay-as-you-go charges for chat tokens,
    speech hours, document pages, translation, and text-to-speech, plus annual Pro and Business plans that mainly appear to
    package rate limits and support. That suggests a commercial model built around metered API consumption with a smaller
    subscription overlay and higher-value enterprise deployments off the catalog. Public operating proxies are strong enough
    to show demand: Sarvam says its inference platform handles 10 million API calls per day, its conversational platform exceeds
    2 million interactions per day, speech models transcribe more than 500,000 hours each month, and document workflows have
    processed more than 35 million pages. Those are meaningful throughput signals, especially because the company also advertises
    forward-deployed engineers, SLA-backed support, and private-cloud or air-gapped deployment options. Still, none of those
    proxies disclose how much usage is free, subsidized, pilot-stage, or low-margin services work, so public traction is better
    understood as evidence of workload intensity than of durable software economics.'
  claimRefs:
