- id: unit-economics-and-disclosure-gaps
  title: Unit economics remain largely un-underwritten from public materials
  body: 'The most important financial fact in public filings is not the unicorn valuation; it is the starting level of revenue
    against the capex-heavy plan. HCLTech''s filing says Sarvam reported ₹45.10 crore of FY2026 turnover after ₹1.50 crore
    in FY2025 and nil in FY2024, which confirms extremely fast scaling from a very small base. What remains missing is the
    information needed to convert that growth into a financeable margin story. None of the reviewed public materials disclosed
    cash on hand, monthly burn, runway, gross margin, customer concentration, net revenue retention, CAC, payback, or the
    share of revenue that is recurring software versus services, pilots, or government projects. Even Sarvam''s own pricing
    surfaces are not fully aligned: the marketing pricing page says every plan starts with ₹1,000 of free credits, while the
    documentation page says new users receive ₹100 of credits. That inconsistency is small in absolute rupees but large as
    a signal, because it shows that even introductory monetization terms are not presented through a single canonical public
    surface. The result is a company with real demand signals but still-open unit-economics diligence.'
  claimRefs:
