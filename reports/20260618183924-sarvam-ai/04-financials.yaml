- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why the gap matters
  - Public evidence status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash balance and runway
    - Determines whether the first close covers model-training and GTM plans
    - Not disclosed in reviewed public materials
    - Cannot size financing urgency or downside buffer
    - Request latest management accounts, cash waterfall, and committed spend
  - - Gross margin by workload
    - Separates software-like economics from services-heavy delivery
    - Not disclosed publicly
    - Cannot judge quality of revenue or contribution margin
    - Request gross margin by API, enterprise deployment, and government program
  - - Realized pricing / discounts
    - List prices rarely equal net realized revenue
    - Only list pricing is public; onboarding credits conflict across pages
    - Hard to map usage proxies into revenue quality
    - Request top-20 contracts with list-to-net bridge and discount policy
  - - CAC, payback, and HCLTech channel conversion
    - Tests whether strategic distribution improves unit economics
    - No public sales-efficiency disclosure
    - Cannot tell if growth is efficient or subsidy-led
    - Request pipeline attribution, win rates, and payback by direct vs partner motion
  - - Customer concentration and renewals
    - Large sovereign deployments can create lumpy economics
    - Only named-customer examples are public
    - Cannot assess durability of revenue or renegotiation risk
    - Request cohort retention, top-customer share, and renewal data
  - - Independent model-performance verification
    - Capability claims affect willingness to pay and capex scale
    - Public critiques say benchmark evidence is still largely self-reported
    - Model-performance uncertainty can distort both revenue and capex planning
    - Request third-party evals, system cards, and customer benchmark reports
  notes: 'These are chapter-level diligence blockers: each missing field directly changes the confidence one can place on
    revenue quality, burn, and future financing need.'
