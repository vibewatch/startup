callouts:
- calloutType: insight
  title: HCLTech changes the financing story from venture-only to channel-backed capital
  body: The most important financial development is not merely the unicorn valuation but the arrival of a strategic investor
    that can originate regulated-industry demand. If HCLTech converts that position into repeatable joint wins, Sarvam's revenue
    quality can improve faster than a standalone AI lab's would.
  claimRefs:
  - CI002
  - CI004
  - CI030
  - CI041
  - CI050
- calloutType: risk
  title: Public traction is ahead of public disclosure
  body: Sarvam has disclosed convincing workload proxies and a rapid revenue ramp, but the chapter still cannot underwrite
    burn, margin, or runway. For a sovereign-AI company explicitly spending on model training and compute, that disclosure
    gap is itself a financing risk.
