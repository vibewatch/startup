- id: TI004
  title: Capital adequacy table
  columns:
  - Capital line
  - Public figure / status
  - Public implication
  - Financing significance
  - Diligence ask
  rows:
  - - Series A base
    - $41 million in 2023
    - Early venture funding built the initial stack before the current scale-up
    - Historical capital was meaningful locally but small for frontier-model competition
    - Cap-table by round and remaining insider reserves
  - - Series B first close
    - $234 million at $1.5 billion post-money
    - Provides large near-term war chest for Indian AI standards
    - Large enough for acceleration, not obviously enough for frontier parity
    - Cash receipt schedule and any tranche conditions
  - - HCLTech strategic cheque
    - $150 million cash for 10.46% and 41,421 shares
    - Adds distribution, enterprise access, and strategic validation beyond cash
    - Round quality depends heavily on HCLTech commercial follow-through
    - Commercial agreement terms, exclusivity, rebates, and joint-sell governance
  - - Use of proceeds
    - Next frontier models, agentic/coding/cybersecurity R&D, and compute access at scale
    - Capital is being directed into capex-heavy layers, not only software sales
    - Raises the threshold for future margin discipline and next-round timing
    - Detailed 24-month spend plan across research, compute, hiring, and GTM
  - - Capital sufficiency
    - Co-founder says current raise is a good start but not enough for bigger models
    - Management itself signals continued financing dependency
    - Next round risk is structural rather than hypothetical
    - Internal base / upside / downside runway model
  - - Cash, burn, runway
    - Not publicly disclosed
    - Public investors cannot tell how long the first close lasts
    - Underwriting cannot clear without balance-sheet detail
    - Current cash, monthly burn, committed capex, and minimum cash covenant
  - - Debt / project finance
    - No public debt or project-finance obligation identified in reviewed materials
    - Absence of evidence is not evidence of absence
    - Need to rule out off-balance-sheet compute or facility commitments
    - Schedule of GPU leases, cloud commits, debt, guarantees, and state-project obligations
  notes: The table focuses on cash adequacy and financing dependency, not on reproducing the broader company-overview funding
    chronology.
