  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway-disclosure
    missingEvidence: Current cash balance, monthly burn, committed compute spend, and a management runway forecast.
    whyItMatters: Without balance-sheet and burn data, the chapter cannot determine whether the first close covers the stated
      model-training and deployment plan or merely delays another financing event.
    diligencePath: Request the latest board deck, monthly cash flow, capex commitments, and a 24-month base/upside/downside
      runway model.
    relatedQuestionRefs:
    - QI003
    - QI019
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: Realized net pricing, discount schedules, gross margin by workload, and direct-versus-partner sales efficiency
      metrics.
    whyItMatters: List prices and usage proxies cannot show whether Sarvam is building a scalable software margin structure
      or funding growth through low-margin services and subsidized workloads.
    diligencePath: Collect top-customer contracts, pricing override logs, margin by product family, and CAC/payback by direct
      and HCLTech-sourced channel.
    relatedQuestionRefs:
    - QI019
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: pricing-surface-consistency
    missingEvidence: A single canonical public statement of free-credit policy and plan packaging.
    whyItMatters: Even small onboarding-credit inconsistencies make it harder to trust that public pricing pages are synchronized
      with the actual billing and go-to-market policy.
    diligencePath: Ask Sarvam to reconcile the marketing pricing page and docs pricing page, then verify the live billing
      policy in customer onboarding materials.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI002
