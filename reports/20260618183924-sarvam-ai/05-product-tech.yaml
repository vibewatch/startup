- id: section-e4
  title: Security, compliance, and enterprise readiness
  body: |-
    Sarvam's enterprise-readiness story improved materially once the Trust Center went live. Publicly, the company now claims India-only data residency, ISO 27001 and SOC 2 Type II certification, customer-data isolation, MFA, RBAC, encryption at rest and in transit, BYOK or CMEK, pen testing, and 99.9% enterprise SLAs. For many Indian enterprise and government deployments, the public articulation of data residency and the promise not to use one customer's data to train another customer's models are strategically important because they speak directly to the sovereignty pitch. The Trust Center also lines up with what Arya and Edge are trying to sell: private deployment surfaces, audit trails, and policy control for regulated workflows rather than just faster prompts.

    That said, the public diligence depth still stops early. Sarvam explicitly says most detailed reports are available only under mutual NDA, which is normal for enterprise software but still means an outside investor cannot validate the operational detail behind many controls from the website alone. ISO 42001 is still presented as in progress, and CERT-In alignment is described only at a summary level. This creates a familiar pattern: the public surface is now good enough to show intent and a baseline compliance posture, but not yet good enough to close diligence without direct access to customer references, uptime history, security reports, and architecture reviews. In other words, Sarvam has moved meaningfully beyond marketing-only claims, but it is not yet at the point where a public buyer could complete security diligence without a private data room or a security pack.
