  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: A current price book or packaging memo for Arya, Edge, Studio, and Akshar enterprise deployments.
    whyItMatters: Without pricing and packaging detail, it is hard to underwrite conversion economics or gross-margin quality across the workflow products.
    diligencePath: Request the current enterprise SKU sheet, sample MSAs, and one recent proposal for each major product family.
    relatedQuestionRefs:
    - QE003
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: security-artifacts
    missingEvidence: Downloadable SOC 2 report, ISO certificates, uptime history, DPA terms, and architecture-level evidence behind the Trust Center summary.
    whyItMatters: The public trust surface is useful but still summary-level, which leaves enterprise diligence and downside-risk analysis incomplete without private artifacts.
    diligencePath: Request Sarvam's security pack under NDA, including SOC 2 bridge letter, pen-test summary, uptime history, and data-retention or deletion workflow evidence.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: product-maturity-proof
    missingEvidence: More named GA customers and architecture references for Edge, Akshar, and Studio, plus independent benchmark replication for flagship models.
    whyItMatters: Sarvam's product breadth is attractive, but uneven external proof makes it hard to distinguish broadly proven surfaces from promising but still self-reported ones.
    diligencePath: Ask for three reference calls across Arya, Edge, and Akshar; request third-party evaluation results or reproducible benchmark harnesses for 30B, 105B, and Saaras.
