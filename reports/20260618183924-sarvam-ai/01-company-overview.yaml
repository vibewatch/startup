- id: founders-and-governance-surface
  title: Founders, Leadership Surface, and Governance Visibility
  body: The public founder story is one of the strongest parts of Sarvam’s profile. Vivek Raghavan’s background in Aadhaar-scale digital public infrastructure and Pratyush Kumar’s AI4Bharat / IIT Madras credentials give the company an unusually credible founder-market-fit narrative for India-focused language AI. Those biographies are repeated across company, investor, and independent reporting and help explain why Sarvam can credibly pursue both public-sector and enterprise deployments. The weaker side of the leadership picture is breadth and governance disclosure. In the fetched official pages, the visible narrative remains heavily founder-centric, with limited transparency on broader executive depth, board composition, committee structure, or control rights. That does not negate founder strength, but it does increase key-person dependence and makes later-stage governance diligence a required workstream rather than a box already checked by public evidence.
  claimRefs:
  - CO003
  - CO004
  - CO018
  - CO019
  - CO020
  - CO021
  - CO044
  tableRefs:
  - TO002
- id: capital-base-and-stakeholders
  title: Funding History and Stakeholder Map
  body: 'Funding history is comparatively well documented. Sarvam announced a $41 million Series A in December 2023 led by Lightspeed with support from Peak XV Partners and Khosla Ventures, and TechCrunch’s contemporaneous coverage framed the company as a five-month-old Bengaluru startup building a full-stack generative AI stack for India. On 15 June 2026, Sarvam disclosed a $234 million first close of a planned $300 million Series B at a $1.5 billion post-money valuation, with HCLTech as lead strategic investor and Bessemer also participating alongside existing backers. That round is important not only for size but for stakeholder mix: it adds a large Indian IT services partner with enterprise distribution and implementation depth to a cap table that already included top venture firms. The available evidence supports a strong capital-access narrative, but not yet a transparency narrative on ownership concentration, liquidation preferences, or secondaries.'
  claimRefs:
