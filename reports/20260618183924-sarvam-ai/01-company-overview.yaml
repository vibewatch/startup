  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited or management-provided revenue, ARR, gross margin, burn, runway, and customer concentration metrics.
    whyItMatters: A $1.5B valuation and strategic-national positioning cannot be underwritten on operating-surface metrics alone.
    diligencePath: Request the latest board pack, cohort revenue bridge, gross-margin waterfall, and customer concentration schedule.
    relatedQuestionRefs:
    - QO020
    - QO025
  - type: missing-source
    severity: material
    topic: governance visibility
    missingEvidence: A current board list, executive roster, committee structure, and investor control-rights summary.
    whyItMatters: Founder strength is visible, but investors still need to understand governance quality, succession depth, and control mechanics.
    diligencePath: Request cap-table governance summary, board observer list, reserved matters schedule, and executive org chart.
    relatedQuestionRefs:
    - QO018
    - QO019
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: commercial scale disclosure
    missingEvidence: A complete customer list or segmented customer counts plus an exact current headcount.
    whyItMatters: Named proofs and large usage claims do not reveal concentration, repeatability, or organizational capacity.
    diligencePath: Request top-20 customer list by ARR, logo retention, sales-pipeline by vertical, and HR headcount snapshot.
    relatedQuestionRefs:
    - QO021
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: independent model evaluation
    missingEvidence: Independent benchmark replication, red-team results, and deployment-quality evaluations separate from company-controlled tests.
    whyItMatters: The sovereign-model thesis depends on trust in performance, safety, and multilingual quality under real workloads.
    diligencePath: Commission third-party benchmark replication and request deployment QA reports from major regulated customers.
