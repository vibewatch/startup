        - 按 token 计费的模型访问、主权推理、应用构建 API
        - 本地化和数据驻留不重要的通用全球文本 API
        - 开发者、平台团队、企业 AI 负责人
        - 印度特定用例的核心平台切入点
      - - 语音 AI 工作流
        - 语音转文本、文本转语音、语音代理、呼叫分析、本土语言 CX 自动化
        - 单纯传统 IVR、纯人工呼叫运营、英语优先语音工具
        - CX 负责人、联络中心所有者、分销负责人、政府外联团队
        - 高容量需求面，ROI 可衡量
      - - 文档和记录智能
        - 数字化、OCR / vision、结构化抽取、印度语言记录工作流
        - 没有语言智能的通用 RPA 或扫描服务
        - 运营、后台、保险公司、医疗管理员、gov-tech 团队
        - 在受监管和公共记录环境中很重要
      - - 公民服务和公共项目接口
        - 多语言热线、受益人核验、申诉收集、农业或福利外联
        - 没有 AI 或没有本土语音层的通用政务软件
        - 邦级部门、部委、公共服务项目所有者
        - 主权 AI 和人口级需求中心
      - - 受监管企业 copilots 和 agents
        - 保险、贷款、医疗和合规敏感工作流代理
        - 不受控消费聊天机器人或广义生产力套件
        - 数字化转型、运营、合规、业务单元 sponsors
        - 数据驻留和可审计性能够支撑溢价价值
      - - 排除 / 相邻支出
        - 全国 AI 市场标题、原始 GPU capex、通用企业软件、全球前沿模型使用
        - —
        - 投资人和市场分析师
        - 这些桶太宽，不能当作 Sarvam SAM
    notes: 边界放在多语言、主权和受监管 AI 工作流，而不是整个印度 AI 或云市场。
