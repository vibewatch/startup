      - number: '8.2'
        title: 可比公司显示 Sarvam 比前沿领导者便宜，但相对已披露规模仍偏贵
        blocks:
          - type: paragraph
            body: >-
              可比组两面都能解释。乐观面看，独立 LLM 和主权 AI 构建者显然能拿到高溢价：AI21 估值越过 $1.4 billion，Mistral 进入约 $6 billion 区间，Cohere 在强调安全企业
              AI 的同时达到 $6.8 billion，Aleph Alpha 围绕欧洲主权叙事融资 $500 million，Anthropic 则在全球前沿层面达到 $61.5
              billion。这些先例重要，因为它们说明，投资人愿意为稀缺模型构建者和可信战略定位支付重价。但同一组可比公司也暴露了 Sarvam 当前缺口。按公开商业证明，Sarvam 更接近 AI21 的估值层级，而不是
              Mistral 或 Cohere；公开 AI 软件可比公司更不宽容：Multiples.vc 给 AI 软件约 3.9x NTM revenue，C3.ai 只有 3.77x EV/sales，即便
              Palantir 的极端溢价，也有数十亿美元收入和流动市场披露支撑。因此，Sarvam 处在一个尴尬中间地带：战略重要性太高，不能像普通软件估值；披露又太少，不能毫无保留给前沿实验室溢价。
