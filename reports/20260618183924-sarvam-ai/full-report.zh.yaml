        title: 客户基础分层和具名证明
        blocks:
          - type: paragraph
            body: >-
              Sarvam 的公开客户证据现在明显不止一个标杆客户标识。已抓取的故事中心和客户页面显示，BFSI、医疗、教育 /
              公益数字化和公共服务语音工作流中都有具名证明；合作伙伴界面还增加了商业、咨询和基础设施伙伴。这种广度很重要，因为它说明 Sarvam
              不只在销售一个主权模型叙事；它正在多个行业变现一组多语言工作流能力，而这些行业重视本地语言处理和部署灵活性。证明质量仍因细分市场而差异很大。Tata Capital 和 SBI Life
              是最清晰的受监管企业客户证明，HealthPlix 是医疗领域最强的工作流深度证明，Ekatra 很有辨识度但商业价值可能小得多，Listen at Scale 证明了公共系统内部触达，但没有完整披露
              Sarvam 的直接经济性。买方、用户和付款方关系也随细分市场变化：保险公司和软件平台似乎是直接企业买方，EkStep 是生态承载方，邦级合作更像战略基础设施关系，其预算机制和变现时间仍不透明。
