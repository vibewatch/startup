        title: 融资结构和 HCLTech 战略叠加
        blocks:
          - type: paragraph
            body: >-
              Sarvam 2026 年 6 月融资改变公司财务画像，更多来自出资方是谁，而不只是表面估值。首次交割带来 $234 million，投后估值 $1.5 billion；HCLTech 以现金出资 $150
              million，获得 41,421 股和 10.46% 股权。这给 Sarvam 的不只是风险投资跑道：HCLTech 明确把该投资定位为进入受监管企业和政府买方主权 AI 工作负载的通道，Sarvam
              则表示资金将用于前沿模型研究、大规模推理和算力获取。关键承销含义是，该轮同时扮演资产负债表资本和分销伙伴关系。但同一公开记录也说明，为什么本章不应把它视为自足融资：管理层表示更大模型仍需要更多资本，完整 $300
              million 轮次在公开材料中尚未完全关闭，而相对其基础设施雄心，业务仍处早期。
