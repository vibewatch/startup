      - - 实际定价 / 折扣
        - 标价很少等于实际净收入
        - 只有标价公开；入门 credit 在不同页面之间互相冲突
        - 难以把使用量代理指标映射到收入质量
        - 要求提供前 20 大合同、标价到净价桥接和折扣政策
      - - CAC、回本周期和 HCLTech 渠道转化
