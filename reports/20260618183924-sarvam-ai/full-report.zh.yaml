  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 战略溢价真实存在，但公开证明仍落后于价格
        blocks:
          - type: paragraph
            body: >-
              Sarvam 当前价格有真实支撑，但性质异常战略化。2026 年 6 月融资给公司带来 $1.5 billion 投后估值、$234 million 首次关闭，以及高度可见的领投方 HCLTech。这很关键，因为
              HCLTech 并未把持股描述成被动风险投资头寸，而是明确把投资连接到面向政府和企业买家的主权 AI 解决方案。IndiaAI 又加了一层溢价：它选择 Sarvam 承担主权 LLM
              工作，并扩展有补贴的国家算力基础设施。换言之，本轮价格不只是押注模型质量，而是押注 Sarvam 会成为印度受监管 AI 工作负载的执行层。问题在于，公开估值支撑远薄于战略故事。BSE
              备案只给出一个重要收入数据点，更广泛的来源集合仍没有披露 ARR、gross margin、burn、retention 或 cap-table
              preferences。因此，按当前价格，市场是在完整运营证明之前先给期权价值承销。
