        title: 融资历史和利益相关方版图
        blocks:
          - type: paragraph
            body: >-
              融资历史相对有据可查。Sarvam 于 2023 年 12 月宣布完成 $41 million Series A，由 Lightspeed 领投，Peak XV Partners 和 Khosla
              Ventures 参与；TechCrunch 同期报道把公司描述为一家成立五个月、位于班加罗尔、为印度构建全栈生成式 AI 栈的创业公司。2026 年 6 月 15 日，Sarvam 披露计划 $300
              million Series B 中已首次交割 $234 million，投后估值 $1.5 billion，HCLTech 担任战略领投方，Bessemer
              也与既有支持者一起参与。该轮重要的不只是规模，还有利益相关方组合：它把一家拥有企业分销和实施深度的大型印度 IT
              服务伙伴加入股东名册，而股东名册此前已经包括顶级风投。现有证据支撑强资本获取叙事，但还不能支撑关于所有权集中度、清算优先权或老股转让的透明度叙事。
