      - number: '2.4'
        title: 驱动因素、约束和需求形态
        blocks:
          - type: paragraph
            body: >-
              几股力量正在拉动需求提前释放。IndiaAI 降低了主权模型实验成本，Bhashini 及相关公共倡议让多语言 AI 在公民服务中正常化，印度企业也似乎特别愿意大规模试用 AI。Sarvam
              自身披露和客户故事显示，当产品直接触及收入、合规或劳动效率时，语音和文档工作流可以推进很快。约束同样重要。BCG 的采用总结显示，许多组织仍难以实现价值，这意味着采购委员会会要求 ROI 和工作流证明，而不是泛泛
              AI 雄心。印度语言上的算力和 token
              经济性仍比英语更难，挤压利润率和定价。开源模型和全球云为更简单场景设定了低成本替代。最后，公共部门和受监管部署通常需要本地化控制、人在回路审核、采购耐心和长集成周期。合在一起，这些因素指向一个需求强劲的市场，但
              Sarvam 的上行空间取决于能否证明持久部署结果，而不只是从主权 AI 叙事中受益。
