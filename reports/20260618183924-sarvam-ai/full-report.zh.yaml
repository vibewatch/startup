      - number: '7.2'
        title: 资本开支强度、模型质量竞争和变现不透明会一起出现
        blocks:
          - type: paragraph
            body: >-
              第二组风险更偏经济性，而不只是叙事。Sarvam 自家材料称，公司在同时建设训练与推理基础设施、前沿研究和产品层；NVIDIA
              的技术文章显示，仅把语音代理延迟目标高效跑出来，就已经需要大量工程投入；公开批评者反复追问同一个商业问题：在开放模型和全球对手缩小价值差之前，Sarvam 能否足够快地变现？证据并不单向。Sarvam 现在在
              Hugging Face 上有开放权重的 30B 和 105B 模型，近期下载活跃度也明显好过早期围绕 Sarvam-M 的尖锐批评。但即便在基础 onboarding credits
              上，定价页面也不一致；公开材料仍未披露 burn、margin、NRR 或客户集中度；旗舰基准声明的独立验证仍很薄。关键在于，Sarvam 同时要面对前沿闭源模型、快速进步的开源模型，以及有
              hyperscaler 支撑的组件。现实风险不只是模型在学术上失败，而是推理经济性、定价纪律和企业真实付费意愿，可能弱于工作负载增长或爱国热情所暗示的水平。
