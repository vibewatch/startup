      - number: '3.4'
        title: 护城河耐久性、锁定和替代风险
        blocks:
          - type: paragraph
            body: >-
              Sarvam 护城河最耐久的部分并不明显是模型独占。公开证据反而指向部署可信度：隔离和本地部署选项、合规与审计控制、前置部署实施支持、UIDAI 和 NITI Aayog 等具名机构，以及 IndiaAI
              主权模型授权。这些信号在印度公共部门和受监管企业采购中很重要，因为它们降低采购风险。相比一个模型 API 端点，它们更难快速复制，尤其当买方关心数据驻留、可追踪性和本地语言行为时。


              风险在于，多类竞争者会同时从不同部位削弱这条护城河。Krutrim 可以攻击基础设施和开发者层；CoRover 可以攻击分发和工作流层；公共倡议可以通过 IndiaAI 和 AIKosh
              发布模型与基准，降低独占性；超大规模云厂商可以继续改进底层翻译、语音和通用模型服务。公开定价不透明让外部更难判断战局，因为买方可能在做总拥有成本决策，而这些不会体现在标价里。近期结论是，当买方想要一个负责到底、能安全进入生产的印度语言平台时，Sarvam
              优势最强。弱点在于，成熟买方仍可多归属、替换模型，或在 Sarvam 执行溢价不够大时组装替代方案。
