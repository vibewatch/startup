      - number: '3.2'
        title: 印度同业对比：Sarvam、Krutrim 和 CoRover
        blocks:
          - type: paragraph
            body: >-
              在印度私营竞争对手中，Sarvam、Krutrim 和 CoRover 解决的是相邻但不同的问题。Sarvam 的公开证据在主权部署、具名机构和政府背书的基础模型工作上最深。Krutrim
              的证据在底层栈上最深：本土 GPU 云、开发者工具，以及同时拥有算力、模型和基础设施的雄心。CoRover 当前拥有最清晰的工作流分发公开证据：其自有资产和 Google 案例研究指向 100+ 家企业、超过
              10 亿用户、主要出行和受监管工作流部署，以及一种能通过语音、视频、文本、WhatsApp、IVR 和网页直接站在客户面前的产品架构。


              这意味着主要竞争轴不是单维的。Krutrim 从下方挤压 Sarvam，把算力和开发者原语打包，可能压缩平台利润率。CoRover 从上方挤压
              Sarvam，凭已经部署的助手和大流量占住应用和客户成功层。基于公开证据，Sarvam 的回应是把自己放在两极之间：比 CoRover 以超大规模云厂商为中心的交付模式更主权、更可隔离；又比 Krutrim
              公开的开发者优先云姿态更适合政府和企业工作流部署。这在战略上有吸引力，但也意味着 Sarvam 必须持续证明，其中间层编排值得客户购买，而不是自建。
