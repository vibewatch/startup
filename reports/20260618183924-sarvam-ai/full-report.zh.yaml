            body: >-
              因此，财务争论的核心不是 Sarvam 是否有动能，而是主权 AI 经济性能否在被商品化之前更快获得融资。多个独立来源强调，训练和服务大模型需要昂贵 GPU
              基础设施、持续性能改进，以及推理端成本控制。它们也指出，印度全栈主权仍不完整，因为即便公共项目以折扣提供数万块 GPU 访问，生态仍依赖外国 GPU、云层和研究基础设施。这很重要，因为 HCLTech
              的支票缓解了近期资本压力，但如果 Sarvam 想继续构建更大模型、赢得企业部署，并抵御全球前沿和开源替代，持续融资需求并未消失。承销结论是：战略相关性和需求创造为正，但收入质量和资本效率需谨慎。Sarvam
              看起来可作为主权 AI 基础设施项目融资，但尚不能被承销为显然高效的软件业务。任何下一轮融资都应以已实现定价、按工作负载拆分的利润率，以及 HCLTech 带来的部署能否转化为可重复高质量收入为门槛。
