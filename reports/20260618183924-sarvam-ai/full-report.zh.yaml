        - 以独立服务提供，而不是印度专属打包栈
      - - 安全部署选项
        - 私有云、本地部署、混合部署、气隙部署、BYO model
        - 本土云和预留基础设施；本地部署姿态未明确说明
        - 托管在 GCP；有主权 / 数据在印度叙事，但抓取案例研究没有本地部署证据
        - 公共品和研究栈；企业部署打包不清楚
        - 客户可以安全构建，但主权和集成负担落在买方身上
      - - 已点名公共部门 / 受监管证明
        - UIDAI、Ministry of Skill Development、NITI Aayog、IndiaAI 奖项
        - 融资和云野心公开；抓取来源中看不到已点名受监管客户
        - 公开来源提到 IRCTC、DigiSaathi、银行和监管机构
        - 公共研究和联盟可信度，而非已点名企业部署
        - 通过客户和伙伴间接体现，而不是印度专属主权授权
      - - 开发者平台信号
        - 官网有 API 和平台定位
        - GitHub 组织有 SDK、Terraform provider，2026 年仍有活跃 repo
        - 模型卡、demo 和平台集成
        - 开放 GitHub repo、数据集、标注工具、模型制品
        - API 和文档丰富，但默认是通用型，不是印度专属
      - - 锁定形态
        - 工作流集成 + 安全部署 + 已点名机构
        - 算力 + 模型 + 云捆绑
