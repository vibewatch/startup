  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Sarvam 当作面向整个印度 AI
              市场销售的公司来分析。它自己的产品和定价界面显示出一个更窄的商业层：语音转文本、文本转语音、翻译、对话智能体、文档数字化，以及为印度语言和受监管部署优化的模型访问。这很重要，因为真实替代集合不只是其他 AI
              创业公司，还包括全球超大规模云厂商 API、开源模型、企业自建开发者栈，以及传统呼叫中心或文档处理工作流。买方需要代码混合语音准确率、仅在印度处理、审计轨迹、隔离或本地部署，以及工作流级支持时，Sarvam
              的切入点更强；买方只需要便宜的通用文本 API 时，切入点更弱。因此，市场边界最好定义为面向受监管、面向公民或高频印度工作流的主权与多语言 AI 基础设施加应用，而不是企业软件或前沿模型支出的全集。
