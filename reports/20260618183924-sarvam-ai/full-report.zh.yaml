      - number: '6.2'
        title: 部署规模和政府案例研究
        blocks:
          - type: paragraph
            body: >-
              最强的可支撑规模信号来自工作流触达，而不是收入披露。SBI Life 是最清晰的企业级证明点：Sarvam 称该部署覆盖超过 8 crore 客户，并支持超过 3.5 lakh 分销商，通过 WhatsApp
              和语音界面提供多语言产品查询和销售赋能。HealthPlix 增加了更窄但运营更深的证明，显示语音转文本嵌入真实医生问诊，并量化节省时间和处方准确率主张。最重要的公共部门证据来自
              EkStep-AI4Bharat-Sarvam Listen at Scale 项目，已抓取来源一致描述 20 个组织、约 50 lakh 独立用户，以及 31 天内 74+ lakh 分钟语音 AI。该项目还为
              National Health Authority、残障画像和 Odisha 农业监测产出结果级案例研究。相比之下，Odisha 和 Tamil Nadu
              邦级合作具有战略意义，但仍应归类为已宣布部署路径，而不是完全验证的生产使用；它们显示强管线和政治触达，但还没有达到 Listen at Scale 或 SBI Life 那样的落地证明水平。
