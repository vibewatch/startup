              BFSI；人口级叙事里，相当一部分又依赖政府相关项目或已宣布的邦级基础设施。主要负面证据不是某个客户失败案例，而是执行摩擦：MediaNama 提到 Tamil Nadu 主权 AI
              园区没有清晰落地时间表，并引用政策分析称，资格与采购摩擦会拖慢采用，IndiaAI 算力容量可能用不满。尽调上，Sarvam 的客户章节支持“采用动能可观”的判断，但还支撑不起“收入质量耐久”的结论。
