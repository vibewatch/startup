  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 主权叙事跑在经济性前面
        - 付费企业部署落后于工作负载增长，或 HCLTech 来源需求仍主要停留在试点阶段
        - 连续两个尽调周期仍看不到付费生产组合、毛利和渠道转化
        - 将公司视为基础设施研发暴露，而不是软件式成长股权
      - - 资本开支和算力依赖
        - 管理层再次表示需要更多资本，却没有拿出更清晰的收入质量桥梁
        - 在毛利、烧钱和付费用量质量改善前，又发生融资事件或提出算力扩张需求
        - 重切估值假设，并要求与商业里程碑绑定的分阶段融资计划
      - - 基准可信度缺口
        - 开放权重发布后，独立复现或公开排行榜证据仍未出现
        - 没有可信第三方评估包或独立基准确认
        - 下调对模型质量护城河的信心，只按服务 / 部署执行承销
      - - 隐私 / 安全控制失误
        - 公共或受监管部署中出现重大事件、监管投诉，或未履行删除 / 同意义务
        - 任何泄露、执法信号，或重复同意控制失败，且没有迅速拿出证据支持的补救
        - 暂停投资案例，直到重新验证控制、披露质量和客户影响
      - - 开源护城河侵蚀
        - 可比开放模型或超大规模云厂商组件缩小性能差距，而 Sarvam 定价仍不透明
        - 客户证据反复显示，买方可以用更便宜的开放或外国模型替代，且不丢失关键功能
        - 下调定价权，并假设长期差异化更低
      - - 人员集中
        - 创始人离任、关键研究员流失，或持续无法招聘高级合规 / 市场拓展负责人
        - 失去核心创始人，或关键岗位反复空缺
        - 升级关键人尽调，并在进一步承销前要求更宽的运营团队证据
    notes: 这些否决标准把本章转化为可观察阈值；它们不是预测，而是界定乐观应在何处停止、重新承销应在何处开始。
