  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 已签约 ARR 和组合
        - 按客户、产品，以及服务与经常性软件组合拆分 ARR
        - 区分真正平台收入和实施密集型工作
        - 管理层资料室加已执行合同样本
      - - 按工作负载拆分毛利
        - 按产品线拆分模型、语音、文档和部署毛利
        - 判断规模带来软件经济性，还是带来算力拖累
        - 财务工作流配合队列贡献分析
      - - 股权结构和优先权
        - 清算顺位、期权池、附函，以及任何二级权利
        - 改变真实进入价格和普通股回报计算
        - 对完整股权结构和董事会同意进行法律尽调
      - - HCLTech 转化
        - 具名管线、已签约客户、续约条款和收入归因
        - 检验战略溢价是合同化的，还是仅仅主题化的
        - 与 HCLTech 和 Sarvam 销售团队做联合商业复核
      - - 独立验证
        - 第三方复现基准测试，并访谈受监管客户作为背调
        - 补上模型质量和企业就绪度的可信度缺口
        - 外部技术尽调加客户访谈
    notes: 每个问题都挂在仍会影响估值的变量上，而不是泛泛的尽调清单；哪怕只解决其中两个，本章判断也可能明显改变。
