        title: 展示材料
        blocks:
          - type: callout
            title: 切入点是主权加工作流，不只是语言模型
            body: 只有印度语言性能必要但不充分时，Sarvam 看起来最强。语言支持与数据驻留控制、可审计性、部署灵活性，以及面向政府或受监管企业的工作流集成打包之后，才形成可变现边际。
