  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支撑性公开证据
      - 主要威胁
      - 严重性
      - 重要性
      - 尽调问题
    rows:
      - - 安全主权部署
        - Sarvam 公开提供私有、混合、本地和气隙选项
        - Krutrim 可能增加类似托管部署；超大规模云厂商能支持定制安全构建
        - 高
        - 主权和可审计性成为采购门槛时，Sarvam 的胜面最清晰
        - 索要实时参考架构、安全审查材料和从部署到投产的时间
      - - 政府信任和授权
        - IndiaAI 选择 Sarvam 承担主权 LLM 工作；UIDAI 和 NITI Aayog 被点名为信任机构
        - 公共计划可能在 AIKosh 发布替代方案，从而削弱排他性
        - 高
        - 政府授权和参考机构拉动采购的速度可能超过模型基准本身
        - 确认当前销售管线中有多少依赖主权模型品牌，而非独立 ROI
      - - 本土基础设施深度
        - Krutrim 营销 GPUaaS、1000+ 集群和活跃开发者工具
        - Krutrim 能把基础设施和模型打包进一个本土栈
        - 高
        - 如果买方偏好云 + 模型 + 工具由同一厂商提供，算力所有权会挤压 Sarvam
        - 索要 Krutrim 参与供应商比选时的客户流失和赢 / 输数据
      - - 工作流分发
        - CoRover 公开提到 100+ 企业、1B+ 用户、IRCTC 和受监管客户
        - CoRover 可能比 Sarvam 更贴近终端用户工作流
        - 高
        - 即便底层模型可替换，已安装助手也会带来数据、集成和采购优势
        - 询问 Sarvam 是落地全新工作流，还是替换已扎根的助手厂商
      - - 开放基准和公共品替代
        - AI4Bharat 和 BharatGen 正在扩展开放模型、数据和评测资产
        - 模型商品化，跟随者进入门槛降低
        - 中高
        - Sarvam 不能永远依赖印度语言模型基础能力的独占所有权
        - 跟踪 Sarvam 在开放资产之外，是否保有专有评测、安全或企业数据优势
      - - 模型层多归属
        - Sarvam 营销 BYO model / 可替换厂商；CoRover 将 Gemini 作为 LLM 选择之一
        - 买方可以替换底层模型，同时保留工作流层
        - 中
        - 如果换模型很容易，Sarvam 必须从编排和部署结果中变现
        - 验证买方换用另一模型系列后，Sarvam 集成还剩多少粘性
    notes: 严重性反映未来 24 个月对 Sarvam 竞争位置的预期影响，而非绝对公司风险；实际定价和生产量大多私有，未知项仍高。
