  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合和开放与企业包装
        blocks:
          - type: paragraph
            body: >-
              Sarvam 的公开产品面远宽于一次单一模型发布。公司现在展示了一条清晰阶梯：从开放权重模型，到托管 API，再到工作流软件和设备部署。开放侧，模型目录和 30B/105B
              发布显示可下载主权模型权重，以及开放权重翻译和推理资产。商业侧，产品组合扩展为 Arya（智能体企业工作流）、Akshar（文档数字化）、Studio（多语言配音和文档翻译），以及 Edge（OEM
              或离线设备部署）。这种包装很重要，因为 Sarvam 试图变现的不只是模型访问，也包括编排、工作流集成，以及分发到受监管或带宽受限的印度场景。


              产品销售方式也能看出这种包装分层。文档、SDK、cookbook 和公开 API
              页面显然为自助实验设计，而大多数企业界面则把用户推向演示、联系或销售主导入口。这与公司销售更高接触度集成相一致，尤其是在部署包含隔离工作流、企业数据或 OEM 硬件验证时。独立报道确实显示，Arya 和
              Samvaad 至少有一个通过 SBI Life 落地的具名生产部署，但高价值工作流产品的公开定价仍很薄。因此，Sarvam
              已经更像一家全栈产品公司，而不是纯模型实验室；但投资人仍需要直接定价、参考架构和客户尽调，才能按产品理解转化经济性。
