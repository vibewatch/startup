      - number: '5.3'
        title: 部署、推理和开发者工具
        blocks:
          - type: paragraph
            body: >-
              Sarvam 的部署故事现在有两条很不同的轨道。一条是主权云和 API 轨道，公司发布开放权重模型卡，暴露 Hugging Face 和 SGLang 推理模式，并与 NVIDIA 合作，为大模型服务做激进的
              kernel 和 scheduler 优化。另一条是 Edge 轨道，试图把 ASR、翻译和合成推到 1GB 以下设备上，并做芯片组特定验证和印度托管溢出。合在一起，这两条轨道显示 Sarvam
              想覆盖从数据中心级智能体推理，到离线消费和企业硬件的全范围。技术挑战在于，这些是实质不同的优化问题；公开材料显示，Sarvam 在高端服务部署上仍依赖 NVIDIA 等特定伙伴生态，在设备侧执行上则依赖
              Qualcomm 或其他硅供应商。


              开发者工具优于许多面向印度的 AI 创业公司。Sarvam 提供官方 SDK 文档、PyPI package、Vercel AI SDK adapter、cookbook 示例，以及把多项 API 变成一等工具的
              MCP server。公司明确称 Python 和 JavaScript 是唯二一等 SDK，这很诚实，但也意味着更广的企业语言支持仍依赖原始 HTTP 集成或生成片段。开放权重侧，最大部署注意事项是 vLLM
              支持还不像 Hugging Face 或 SGLang 那样开箱即用；模型卡仍提到
              PR、自定义分支或热补丁路径。这不抵消技术进展，但意味着最复杂的开放权重部署路径仍假设团队具备较强基础设施能力，而不是面向即插即用的企业管理员。
