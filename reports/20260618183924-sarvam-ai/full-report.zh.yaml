  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 下轮降价风险
        - 任何新一级融资轮明显低于当前 $1.5B 标题价格
        - 将证明战略溢价跑在证明创造前面
        - 从新价格重新承销，而不是摊低成本
      - - 渠道转化失败
        - 12 个月后，HCLTech 管线仍主要是试点或服务密集型工作
        - 击穿最强的战略溢价论据
        - 将 HCLTech 视为营销伙伴，而非估值溢价
      - - 模型验证失败
        - 独立评估方无法复现旗舰性能或客户证明
        - 护城河从主权前沿叙事缩成供应商自我报告
        - 下调乐观情景概率并压缩倍数
      - - 收入质量失败
        - 披露后毛利或付费留存低于预期
        - 把工作负载强度变成低质量服务故事
        - 向悲观情景估值区间移动
      - - 政策支持滑坡
        - IndiaAI 支持不如预期有用，或经济意义不如预期
        - 削弱一个明确的溢价支撑
        - 按更接近普通私有 AI 软件可比公司的方式给 Sarvam 估值
    notes: 这些不是抽象风险；每一项都直接攻击当前支撑其高于公开 AI 软件估值锚点溢价的少数事实。
