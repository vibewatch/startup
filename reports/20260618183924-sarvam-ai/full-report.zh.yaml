      - number: '5.4'
        title: 安全、合规和企业就绪度
        blocks:
          - type: paragraph
            body: >-
              Trust Center 上线后，Sarvam 的企业就绪叙事显著改善。公开层面，公司现在声称印度境内数据驻留、ISO 27001 和 SOC 2 Type II
              认证、客户数据隔离、MFA、RBAC、静态和传输中加密、BYOK 或 CMEK、渗透测试，以及 99.9% 企业
              SLA。对许多印度企业和政府部署而言，公开阐明数据驻留，并承诺不使用某一客户数据训练另一客户模型，具有战略重要性，因为这直接回应主权叙事。Trust Center 也与 Arya 和 Edge
              试图销售的内容对齐：面向受监管工作流的私有部署界面、审计轨迹和策略控制，而不只是更快提示词。


              但公开尽调深度仍止步较早。Sarvam 明确表示，多数详细报告只在双方 NDA 下提供；这对企业软件很正常，但也意味着外部投资人无法仅凭网站验证许多控制背后的运营细节。ISO 42001
              仍被表述为进行中，CERT-In
              对齐也只在摘要层面描述。由此形成一个熟悉模式：公开界面已经足以显示意图和基线合规姿态，但尚不足以在没有直接访问客户证明、正常运行时间历史、安全报告和架构审查的情况下关闭尽调。换句话说，Sarvam
              已经明显超越纯营销主张，但还没有达到公开买方无需私有数据室或安全包就能完成安全尽调的程度。
