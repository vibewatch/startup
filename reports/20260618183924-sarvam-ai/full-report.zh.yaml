      - 融资意义
      - 尽调要求
    rows:
      - - Series A 基础
        - 2023 年 $41 million
        - 早期风险资金在当前扩张前搭起初始技术栈
        - 历史资本在本地市场有分量，但相对前沿模型竞争仍偏小
        - 按轮次拆分的股权结构，以及内部人士剩余可投储备
      - - Series B 首次交割
        - 投后估值 $1.5 billion，融资 $234 million
        - 按印度 AI 标准，提供了规模较大的近期弹药
        - 足够加速，但未必足以追平前沿阵营
        - 现金到账时间表及任何分期条件
      - - HCLTech 战略支票
        - $150 million 现金，换取 10.46% 和 41,421 股
        - 现金之外，还带来分销、企业客户触达和战略背书
        - 轮次质量高度取决于 HCLTech 后续商业落地
        - 商业协议条款、排他性、返利和联合销售治理
      - - 资金用途
        - 下一代前沿模型、agentic / coding / cybersecurity 研发，以及规模化算力获取
        - 资本投向重 capex 层，而不只是软件销售
        - 抬高了未来利润率纪律和下一轮融资时点的门槛
        - 覆盖研究、算力、招聘和 GTM 的 24 个月详细支出计划
      - - 资本充足性
        - 联合创始人称当前融资是好的起点，但不足以支撑更大模型
        - 管理层自己也释放出持续依赖融资的信号
        - 下一轮融资风险是结构性的，不是假设性的
        - 内部基准 / 上行 / 下行 runway 模型
      - - 现金、烧钱、runway
        - 未公开披露
        - 公开投资人无法判断首次交割能撑多久
        - 缺少资产负债表细节，承销无法过关
        - 当前现金、月度 burn、已承诺 capex，以及最低现金 covenant
      - - 债务 / 项目融资
        - 所审材料中未发现公开债务或项目融资义务
        - 没有证据不等于不存在
        - 需要排除表外算力或设施承诺
        - GPU 租赁、云承诺、债务、担保和州级项目义务清单
    notes: 本表聚焦现金充足性和融资依赖，不复述更宽泛的公司融资时间线。
