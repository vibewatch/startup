      - number: '7.3'
        title: 政策、隐私和监管姿态只有落到运营里才算优势
        blocks:
          - type: paragraph
            body: >-
              Sarvam 在法律和信任层面比许多 AI 创业公司更成熟，但这些表面也意味着沉重的合规负担。官网和 trust center 主打数据驻留、隔离部署、审计轨迹和认证。隐私政策比营销文案走得更深，点名 DPDPA
              义务、撤回权、删除时间表、儿童数据处理，以及克隆语音的同意要求。服务条款也露出这套栈更硬的一面：Sarvam 可以暂停服务、自动续订价格方案、要求赔偿，并把争议落到
              Bengaluru。外部法律评论把问题拉得更宽。Bar & Bench 强调，印度隐私制度下，自动化决策、公共利益处理和跨境传输成本仍有模糊地带；IndiaLaw 则认为，2025 AI Governance
              Guidelines 会把 AI 供应商推向审计轨迹、合法数据集来源和影响评估。风险因此是双面的。积极面是，Sarvam 看起来知道合规议程。消极面是，大多数信任文件仍需 NDA
              才能看到；公司也承认互联网传输不可能完全安全；一旦语音、生物识别或公共服务部署出问题，外界会按远高于普通开发者工具创业公司的隐私与治理门槛来审视。
