companyProfile:
  summary: >
    Sarvam AI 是一家总部位于班加罗尔的主权 AI 公司，面向印度打造全栈平台，覆盖大语言模型、语音识别、文本转语音、翻译、文档 AI 和智能体工作流。公司由 Vivek Raghavan 和 Pratyush Kumar 于
    2023 年创立，把自己放在国家 AI 基础设施、受监管企业部署和印度语种性能的交叉点上。公开证据确认了 IndiaAI Mission 入选、2026 年 6 月 Series B 首次交割并获得 $1.5 billion
    投后估值，以及企业和政府场景中的部署主张增长；但收入质量、治理深度、客户集中度和利润率韧性仍存在重大披露不足。
  founders:
    - name: Vivek Raghavan
      role: 联合创始人
      background: 公开来源显示，他与 Aadhaar 级数字公共基础设施、EkStep，以及面向印度的数字公共产品工作有关。
      claimRefs:
