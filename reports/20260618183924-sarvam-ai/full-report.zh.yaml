      - number: '3.3'
        title: 公共倡议、开放资产和超大规模云厂商替代
        blocks:
          - type: paragraph
            body: >-
              AI4Bharat 和 BharatGen 很重要，因为即便它们不是直接企业供应商，也会改变竞争经济性。AI4Bharat 的 IndicTrans2 工作声称开放支持全部 22
              种宪法附表语言，并发布了数据集和基准；BharatGen 联盟则把以印度为中心的数据集、评估框架、隐私保护训练和多模态公共产品基础设施定义为国家资产。这些努力与 Sarvam
              的商业产品并不相同，但会削弱“单一私营厂商能独占印度语种模型资产”的论点。它们也创造了人才和基准公地，未来进入者可以在其上构建。


              超大规模云厂商是另一类主要替代。威胁不在于它们显然胜过 Sarvam 的印度特定定位；而在于它们可作为“足够好”的组件，支撑内部自建策略。已抓取文档显示，各层支持并不均衡：Google Cloud Natural
              Language 在已抓取支持页上只列出 Hindi，而 Google Cloud Translation 暴露出更广的印度语种列表，包括
              Assamese、Dogri、Konkani、Maithili、Manipuri、Sanskrit 和 Sindhi；Azure Speech 支持许多印度区域设置；AWS Polly 已抓取页面显示支持
              Hindi，但没有同等广度。CoRover 自己的案例研究展示了实际替代路径：组合 Gemini、语音、翻译、NLP 和云基础设施，再把它们包进工作流产品。因此，Sarvam
              不只与供应商竞争，也与第三方组件组装竞争。
