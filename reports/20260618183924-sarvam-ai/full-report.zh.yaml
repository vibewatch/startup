            body: >-
              Sarvam 确实拥有可见变现界面。其公开定价页列出聊天 token、语音小时、文档页、翻译和文本转语音的按量付费费用，并提供年度 Pro 和 Business
              计划，后者主要像是在打包速率限制和支持。这说明商业模式围绕按量 API 消费构建，并叠加较小订阅层，以及目录外更高价值的企业部署。公开运营代理指标足以显示需求：Sarvam 称其推理平台每天处理 1000 万次
              API 调用，对话平台每天超过 200 万次交互，语音模型每月转录超过 500,000 小时，文档工作流已处理超过 3500 万页。这些是有意义的吞吐量信号，尤其因为公司还宣传前置部署工程师、SLA
              支持，以及私有云或隔离部署选项。不过，这些代理指标都没有披露有多少使用是免费、补贴、试点阶段或低利润率服务工作，因此公开牵引更适合理解为工作负载强度证据，而不是持久软件经济性的证据。
