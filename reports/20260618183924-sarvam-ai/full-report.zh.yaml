        - $155M 后又完成 $208M Series C；估值 $1.4B
        - 定价接近 Sarvam 规模的独立 LLM 厂商
        - 围绕企业推理工具的有用全球 LLM 低端锚点
        - 2023 年市场背景不同于 2026 年
      - - Mistral
        - 融资约 €600M / $640-645M
        - 2024 年估值约 $6B
        - 显示投资者愿意为可信前沿模型势头支付什么价格
        - 欧洲规模和融资深度目前超过 Sarvam
      - - Cohere
        - $500M 融资轮，估值 $6.8B，另有 $100M 追加融资
        - 企业安全 LLM 可比公司
        - 安全企业 AI 叙事下最相关的可比对象
        - Cohere 披露的规模信号多于 Sarvam
      - - Aleph Alpha
        - 获企业和国家支持的 $500M 主权 AI 融资轮
        - 欧洲主权 / 安全 AI 类比对象
        - 支持印度以外存在主权溢价这一判断
        - 估值不是主要披露指标
      - - C3.ai
        - FY2026 收入 $250.3M；EV/Sales 3.77x
        - 增长弱且亏损的公开 AI 软件可比公司
        - 没有前沿稀缺性时，市场愿意支付价格的有用地板
        - 产品组合和上市公司约束差异很大
      - - Palantir
        - 收入 $5.22B；EV/Sales 57.64x
        - 披露和毛利强劲的公开 AI 相邻异常值
        - 显示规模和证明都真实时，溢价可以有多大
        - 不是早期私有 LLM 建设者的公平直接可比对象
