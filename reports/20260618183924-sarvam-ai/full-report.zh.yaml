        - 模型性能不确定性会扭曲收入和 capex 规划
        - 要求提供第三方评测、system cards 和客户基准报告
    notes: 这些是章节级尽调阻塞项：每个缺失字段都会直接改变投资人对收入质量、burn 和未来融资需求的信心。
