              又不同：它是战略基础设施验证项目，具有潜在长期信号价值，但不是当前客户收入证明。合并来看，已抓取合作伙伴页面显示 Sarvam
              正围绕企业转型伙伴、商业平台、开发者生态和主权基础设施伙伴构建分销网络。上行空间是更宽的先落地再扩张界面；下行在于公开材料仍未量化伙伴来源管线、收入分成条款，或这些关系中有多少已从公告走向可衡量经常性支出。
