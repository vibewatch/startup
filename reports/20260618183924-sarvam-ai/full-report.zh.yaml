        title: 创始人、领导层外显面和治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开创始人故事是 Sarvam 画像中最强的一块。Vivek Raghavan 的 Aadhaar 级数字公共基础设施背景，以及 Pratyush Kumar 的 AI4Bharat / IIT Madras
              资历，让公司在面向印度语言 AI 上拥有罕见可信的创始人-市场匹配叙事。这些履历反复出现在公司、投资人和独立报道中，也解释了为什么 Sarvam
              能同时追求公共部门和企业部署。领导层图景较弱的一面在于广度和治理披露。已抓取的官方页面中，可见叙事仍高度围绕创始人展开，对更广泛高管深度、董事会构成、委员会结构或控制权的透明度有限。这并不抵消创始人优势，但会提高关键人依赖，并把后续阶段治理尽调变成必须推进的工作流，而不是公开证据已经打勾的事项。
