      - 公开可见指标
      - 估值 / 状态
      - 对 Sarvam 的意义
      - 主要局限
    rows:
      - - Sarvam AI
        - FY2026 营业额披露为 INR 45.10 crore；HCLTech 战略持股
        - 2026 年融资轮，投后估值 $1.5B
        - 显示价格有多大部分压在主权和渠道可选性上
        - 只有一个公开营业额数据点，且没有披露毛利结构
      - - Krutrim
        - Business Standard 称已融资接近 $280M；较早的印度 AI 独角兽标记
        - 获得新出资方资本的印度主权 AI 同业
