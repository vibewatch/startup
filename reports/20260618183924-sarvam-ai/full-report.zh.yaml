        - 覆盖 22 种语言的全栈平台，支持私有、混合、本地和气隙部署
        - 公开定价和商业规模指标仍未披露
      - - Krutrim
        - 本土全栈 AI 算力 + 模型栈
        - 以 $1B 估值融资 $50M；印度首家 AI 独角兽
        - 开发者、企业、未来消费者助手
        - 本土 GPU 云、1000+ 集群扩容、全 AI 计算栈叙事
        - 企业部署和受监管客户背书的公开证据弱于 Sarvam
      - - CoRover / BharatGPT
        - 工作流和对话式 AI 平台
        - 100+ 企业；1B+ 用户；20+ 渠道
        - 政府、旅行、BFSI、企业支持工作流
        - 已有分发、多模态智能体、14+ 印度语音语言和 22+ 印度文本语言
        - 公开证据中没有本地部署叙事；对 Google Cloud 的依赖明确
      - - AI4Bharat
        - 开放模型 / 基准生态
        - 在数据集、标注、翻译和资源上有大规模开源足迹
        - 研究者、模型构建者、公共利益开发者
        - 公开支持 22 种宪法附表语言的翻译和基准资产
        - 定位不是托管式企业部署平台
      - - BharatGen
        - 政府支持的公共品基础模型联盟
        - DST 支持的国家级计划；模型在 IndiaAI Impact Summit 2026 发布
        - 政府、学术界、创业公司、研究生态
        - 印度中心数据集、基准评测、多模态公共品定位
        - 商业 SLA、打包工作流和买方支持未公开
      - - Google Cloud AI
        - 超大规模云厂商组件栈
        - 全球云规模；翻译 + Gemini + 语音组合很广
        - 组装定制栈的企业
        - 顶级云分发和丰富组件生态
        - 各产品的印度语言支持不均；默认没有印度专属主权叙事
      - - Microsoft Azure AI
        - 超大规模云厂商组件栈
        - 语音地区覆盖广，企业分发强
        - 大型企业和受监管 IT 买方
        - 企业渠道强，支持许多印度语音地区
        - 抓取证据最强的是语音，不是本地化端到端印度语言 AI 工作流栈
      - - AWS AI
        - 超大规模云厂商组件栈
        - 全球云规模；企业触达广
        - 组装 API 和基础设施的构建者
        - 可信云分发和组件广度
        - 抓取到的 Polly 证据显示，可见印度语言语音覆盖窄于 Azure，也窄于 Sarvam 的 22 语言叙事
