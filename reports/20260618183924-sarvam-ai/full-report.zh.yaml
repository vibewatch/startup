            body: >-
              公开申报中最重要的财务事实不是独角兽估值，而是资本开支密集计划对应的起始收入水平。HCLTech 申报显示，Sarvam FY2026 营业额为 ₹45.10 crore，此前 FY2025 为 ₹1.50
              crore，FY2024
              为零；这确认公司从极小基数极快扩张。缺失的是把这种增长转化为可融资利润率故事所需的信息。已审阅公开材料均未披露现金余额、月度现金消耗、跑道、毛利率、客户集中度、净收入留存、CAC、回本周期，或收入中经常性软件相对服务、试点或政府项目的占比。即便
              Sarvam 自己的定价界面也未完全一致：营销定价页称每个计划起始都有 ₹1,000 免费额度，而文档页称新用户获得 ₹100
              额度。按绝对卢比看，这一不一致很小；作为信号却很大，因为它显示连入门变现条款都没有通过单一权威公开界面呈现。结果是一家公司有真实需求信号，但单位经济性尽调仍未闭合。
