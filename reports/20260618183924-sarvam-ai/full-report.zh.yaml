      - number: '5.5'
        title: 技术限制和尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              最大的产品技术风险不是缺乏雄心，而是 Sarvam 主张的广度与每一层可得独立证明之间的差距。模型侧，Forbes
              的批评具有方向性重要性，因为它区分了交付技术上可信的开放权重，与在第三方生态中证明基准优越性。工具侧，开放权重部署路径仍有一些粗糙边缘，尤其是 vLLM 支持，以及复现 Sarvam
              偏好服务部署栈所需的运营成熟度。应用侧，公开证据在语音 API 和至少一个具名 Arya 部署上最强，但 Edge 生产客户证明、Akshar
              准确率基准，以及有助于承销企业级采用的详细安全或正常运行时间材料仍较薄。


              这些缺口并不抵消栈的质量。事实上，恰恰相反：Sarvam 现在看起来足够可信，因此证明缺口比在纯投机创业公司上更重要。正确的尽调姿态应是有针对性，而不是否定。要求提供主权 LLM 的独立评估输出、Edge 和
              Akshar 的具名 GA 客户、工作流产品的详细定价或包装，以及 Trust Center 背后受 NDA 限制的安全材料。如果这些材料站得住，Sarvam 可能拥有市场上最有防御力的印度优先 AI
              产品组合之一。如果站不住，主要风险不是产品缺失，而是同时横跨太多技术要求很高的界面造成过度延展。
