          - type: callout
            title: 自上而下的印度 AI TAM 明显高估 Sarvam 的实际 SAM
            body: >-
              BCG、IMARC 和 IndiaAI 都支持一个庞大且增长中的国家 AI 市场，但没有任何一方隔离出更小的那一块：Sarvam 能在全球 API、开源栈和服务密集型既有厂商面前守住定价。投资人不应把宏观 AI
              热情直接换算成 Sarvam 收入假设。
