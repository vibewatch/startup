        title: 里程碑、公开牵引信号和未决风险
        blocks:
          - type: paragraph
            body: >-
              Sarvam 的里程碑曲线推进很快：2023 年创立，2025 年 4 月入选 IndiaAI Mission，2025 年 5 月围绕 Sarvam-M 引发产品讨论，2026 年初发布前沿 /
              开放权重模型，到 2026 年中成为独角兽。最强的正向公开信号来自具体产品和部署主张：具名产品族、与 Tata Capital 的公开客户故事，以及公司宣布的围绕交互、API
              调用、文档页数、音频小时和人口规模工作流的运营指标。主要提醒是，这些仍大多是运营表层信号，而不是经审计的业务质量信号。独立评论仍有分歧：部分来源把 Sarvam
              的主权模型努力视为重大本土能力里程碑，另一些来源则质疑，一个非开源主权模型获得公共资金、自报基准主张，以及早期对基于 Mistral 的 Sarvam-M
              的依赖，是否足以支撑如此规模的资本和政策支持。就尽调而言，Sarvam 已经具备战略重要性；尚不清楚的是，这种重要性有多少能转化为持久经济性和可验证的性能领先。
