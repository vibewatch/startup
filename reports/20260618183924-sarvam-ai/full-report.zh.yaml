            body: >-
              Sarvam 的客户动作越来越由伙伴协助，而不是纯直接销售。YCP India 被明确描述为咨询和执行层，可帮助企业从碎片化 AI 试点走向组织级部署；这是有用渠道证据，也提示实施复杂度仍不可小看。Swiggy
              和 Razorpay 展示了第二条扩张路径：Sarvam 正把多语言语音和智能体基础设施推入商业界面，终端用户可能永远不知道底层供应商是
