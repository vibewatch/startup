      - number: '5.2'
        title: 模型谱系、语音栈和翻译能力
        blocks:
          - type: paragraph
            body: >-
              Sarvam 公开材料中最深的技术实质在模型谱系。旗舰 30B 和 105B 主权模型不再被描述为包装器或只做后训练的产物；Sarvam 2026 年 3 月发布描述了从头训练、内部 RL 基础设施，以及针对稀疏
              MoE 推理的明确架构选择。30B 模型针对实际部署、多语言语音或工具使用应用调优；105B 模型则定位为更重的推理和智能体层。在该核心周围，Sarvam 组装了专用模态模型：Saaras 做
              STT，Bulbul 做 TTS，Sarvam Translate 做正式多语言翻译，Shuka 是音频原生语言模型，Vision 做文档理解，此外还有 Sarvam 1 和 Sarvam-M 等较早谱系节点。


              语音和翻译是 Sarvam 栈最显差异化的地方。Saaras V3 暴露多种输出模式和流式支持，同时面向印度语言、电话音频、代码混合语音和带印度口音的英语。Bulbul V3 增加多传输
              TTS、更大的声音库，以及比多数印度语言语音产品更明确的质量权衡。Sarvam Translate 则优化正式、结构化长文本翻译，而不是日常口语灵活性，这也是文档仍把部分场景导回 Mayura
              的原因。这种专业化在战略上是连贯的：Sarvam 并不声称拥有通用基础模型垄断，而是在策划一组模态专用系统，对应真实印度企业工作流。取舍在于，若干基准和质量主张仍是自报，尤其是主权 LLM，因此独立评估负担仍高。
