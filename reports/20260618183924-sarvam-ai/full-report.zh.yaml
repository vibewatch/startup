      - 方向
      - 为什么重要
      - 时点
      - 尽调问题
    rows:
      - - IndiaAI 算力补贴和主权模型政策
        - 正向
        - 缓解基础设施瓶颈，也为本土模型开发背书
        - 当前
        - Sarvam 需求中，有多少直接来自补贴下的主权算力使用？
      - - 多语种公民服务需求
        - 正向
        - 为语音、翻译和智能体系统带来公共部门拉动
        - 当前
        - 哪些邦级和中央政府用例是反复采购，而不是试点驱动？
      - - BFSI 和医疗领域的企业 AI 采用
        - 正向
        - 客户互动、销售运营和工作流自动化已有预算
        - 当前
        - 各垂直行业的 ACV 和续约率是多少？
      - - 数据本地化和合规要求
        - 对 Sarvam 正向，对通用厂商反向
        - 只在印度处理、审计轨迹和本地部署选项因此具备商业价值
        - 当前
        - 哪些胜单主要由合规或数据驻留要求驱动？
      - - 开源模型和超大规模云厂商 API
        - 反向
        - 买方不需要本地化或部署支持时，会压低价格
        - 当前
        - Sarvam 多大程度上靠集成和控制胜出，而不只是靠核心模型质量？
      - - 印度语言算力和 token 强度
        - 反向
        - 推理或训练成本更高，可能挤压毛利率和定价
        - 当前
        - 语音、TTS、智能体和模型 API 各产品线的毛利率是多少？
      - - ROI 审查和试点疲劳
        - 反向
        - 采用面很广，但许多买方仍难证明可衡量价值
        - 近期
        - 哪些部署在 12 个月内从试点转为付费规模化上线？
      - - 采购和实施周期
        - 反向
        - 政府和受监管企业合同可能很大，但周期慢、服务含量高
        - 当前至中期
        - 有多少待交付订单取决于漫长招标或系统集成周期？
    notes: 最强的多头叙事是政策支持叠加多语种需求；主要空头叙事是部署仍重集成、利润率受压。
