      - number: '2.2'
        title: 规模测算视角和可变现 SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据可提供背景，但不足以给出干净的 Sarvam 式 TAM 或 SOM。政府和分析机构来源确实证明，印度正在把真金白银投向 AI 基础设施和采用。IndiaAI 的任务预算和补贴算力供给显示，国家把主权
              AI 视作战略基础设施；BCG 和 IMARC 也显示，印度企业已经在一个预计本十年快速增长的市场中投入开支。但这些视角仍会高估 Sarvam 的实际收入池，因为它们包含 Sarvam
              无法完整捕获的类别：广义企业 AI 软件、通用自动化、非印度语言场景，以及相邻硬件或服务。更有决策价值的框架，是一个受约束的
              SAM：由多语言语音、文档、智能体和主权模型工作流组成，买方关心本地化、数据控制或受监管生产部署。公开数字证明自上而下市场很大；它们尚未证明其中有多少能以类软件经济性结构性地归 Sarvam 可得。
