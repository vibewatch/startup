  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Sarvam 所处竞争场域，比“印度 LLM 创业公司”这个简单标签更宽。对受监管印度买方而言，可信替代方案横跨五类：Krutrim 等本土全栈同行；CoRover/BharatGPT
              等已部署工作流厂商；AI4Bharat 领衔的开放基准和模型生态；BharatGen 和 Bhashini 等公共产品倡议；以及让企业用云 AI
              组件自行组装栈的全球超大规模云厂商。关键结论是，买方并不只是在前沿模型之间选择。他们在打包部署模式、托管保障、集成深度和政府信任信号之间做选择。


              Sarvam 的公开定位在采购问题是“Indic AI 加受控部署”时最强。其官网和主权模型公告强调语音、翻译、智能体工作流、私有云或本地上线、隔离选项和数据驻留控制。这让 Sarvam
              看起来不像纯模型实验室，更像面向人口规模或受监管工作负载的执行层。相比之下，Krutrim 主打本土算力和开发者基础设施，CoRover 主打已经落地的企业和政府对话界面，AI4Bharat/BharatGen
              则通过扩大所有人可用的开放印度语种能力来影响市场。
