  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主权 AI 叙事和伙伴集中度抬高了执行门槛
        blocks:
          - type: paragraph
            body: >-
              Sarvam 最强的商业故事，也是第一块主要风险暴露面。公司明确把主权 AI 栈卖给企业、政府和受监管行业；2026 年 6 月融资又让 HCLTech
              成为战略股东，而不是被动财务投资人。公开来源解释了这点为什么重要：HCLTech 应带来企业入口、政府信用和集成能力，IndiaAI 相关算力支持则帮助 Sarvam
              训练并服务更大的模型。但同一组证据也显示，这套叙事高度依赖集中资源。Raghavan 说本轮融资仍不足以支撑更大模型；Business Standard 称，海外司法辖区可以一夜之间掐住关键 AI
              技术入口；Forbes India 则认为印度栈仍不完整，因为 GPU、云层和研究深度仍有一部分受海外控制。换句话说，Sarvam
              卖的不只是模型质量，还在卖一个承诺：本土栈能在关键任务场景里保持可用、可融资、可信任。如果 HCLTech 的需求创造不及预期、政府采购放慢，或 Sarvam
              在拓宽商业底盘前先被海外算力依赖卡住，主权叙事会很快从护城河变成预期缺口。
