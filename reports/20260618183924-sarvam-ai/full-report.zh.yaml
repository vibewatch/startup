chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命和产品栈
        blocks:
          - type: paragraph
            body: >-
              Sarvam AI 展示的不是单一模型实验室，而是印度优先的全栈主权 AI 平台。公开材料始终把公司锚定在班加罗尔、2023 年成立，以及为企业、开发者和政府用户打造在印度开发、部署和治理的 AI
              这一使命上。目前的公开产品面覆盖前沿语言模型、语音、翻译、视觉、文档数字化和智能体平台，部署方式包括私有云、混合、本地和隔离环境。Sarvam 还披露了多项核心服务的按次 API
              定价；这对一家私有前沿模型创业公司并不常见，也显示公司希望开发者从哪里进入这套栈。本章核心结论是，Sarvam 卖的不是单一主权 LLM
              故事；它把主权算力、印度语种模型性能和工作流产品打包成更宽的市场进入系统。这也带来一个重要尽调区分：Sarvam
              已经证明自己能拼出连贯的公开平台叙事，但投资人仍需验证这些产品界面能否清晰映射到可重复收入、客户留存和有防御力的服务成本经济性。
