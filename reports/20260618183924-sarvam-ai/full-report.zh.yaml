              情景视角能把证据转成承销纪律。牛市情形假设：HCLTech 带来的分销转化为已签约、经常性的政府和受监管企业合同；IndiaAI
              支持让主权叙事在经济上仍有意义；独立评估缩小今天的可信度缺口。在这组假设下，Sarvam 有机会拿到 $1.8-2.4 billion 的估值区间。基准情形更保守，也更符合公开记录：Sarvam
              仍有战略重要性，但市场仍缺少收入质量、利润率，以及需求中合同而非试点占比的验证证据。这一视角支持今天约 $1.0-1.3 billion。若主权 AI
