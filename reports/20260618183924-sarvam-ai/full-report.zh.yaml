      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方证据比 TAM 证据具体得多。Sarvam 的客户故事和部署披露指向四个可重复需求中心。第一是公共部门服务交付，多语言语音界面帮助邦或部委规模化触达公民。第二是 BFSI，保险公司、贷款机构和金融科技公司用
              AI 做客户互动、续保、催收和销售赋能。第三是医疗工作流自动化，尤其是多语言临床环境中的转录和文档。第四是直接购买 API 或推理能力的开发者和平台层。这些账户里的日常用户包括运营团队、CX
              负责人、销售与分销团队、医生、坐席和项目经理。付款方更可能是数字化转型负责人、平台或 IT 预算、业务单元负责人、由合规背书的运营团队，以及政府服务交付发起方。采用通常从 API
              或工作流试点开始，但生产扩展取决于集成、延迟、可审计性和可衡量业务结果，而不只是模型新鲜感。
