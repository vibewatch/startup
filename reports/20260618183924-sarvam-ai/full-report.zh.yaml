            body: >-
              正确立场不是否认 Sarvam 的战略相关性，而是把公司质量和价格纪律分开。Sarvam 未来可能证明自己是印度最重要的 AI
              资产之一，因为它结合了国家优先级定位、模型野心和一个看似可行的分销伙伴。但当前公开材料仍要求投资人在看到合同层面经济性、cap-table 现实和旗舰模型声明的独立证明之前，先承销太多。因此，在 $1.5
              billion 标价下，最干净的建议是只接受结构化条款，或继续研究。实务上，投资人应要求硬披露：ARR 构成、按工作负载拆分的 gross margin、清算优先级栈，以及 HCL 来源需求的转化，再把它当作标准
              growth-equity 进入点。可能退出路径也仍更像战略出售或二级转让，而不是近期 IPO。如果 Sarvam 通过哪怕一部分尽调关口，牛市情形就更容易辩护；如果通不过，当前轮次价格很可能老化得不好。
