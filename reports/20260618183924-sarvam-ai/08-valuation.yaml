- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Strategic channel
    - HCLTech can turn sovereign AI into enterprise and government distribution
    - No exclusivity plus unclear conversion means the channel premium may be more narrative than contract
    - Show signed pipeline conversion and renewal cohorts
  - - Policy support
    - IndiaAI lowers compute friction and confers national-priority credibility
    - Subsidized compute does not solve foreign-stack dependence or commercialization risk
    - Disclose realized economics on subsidized workloads
  - - Product position
    - Sarvam has a scarce Indian full-stack narrative across models, speech, and documents
    - Independent evaluation remains sparse, so benchmark claims are still partly self-reported
    - Third-party benchmark replication and reference deployments
  - - Revenue model
    - Usage and regulated-workload demand can compound fast if deployments stick
    - Public evidence still lacks ARR, margin, and contract-quality disclosure
    - Provide cohort-level paid usage and gross-margin data
  - - Valuation context
    - $1.5B can work if Sarvam becomes the default sovereign AI layer for India
    - Today it still prices years of execution before public proof exists
    - Either lower price or prove revenue quality faster
  notes: The thesis becomes investable only when the strategic premium is translated into contract, margin, and validation evidence rather than left as policy or channel narrative.
