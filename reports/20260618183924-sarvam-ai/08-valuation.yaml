  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-overhang
    missingEvidence: A current cap table showing liquidation preferences, option pool, investor side letters, and any secondary rights above common equity.
    whyItMatters: The headline post-money valuation is not the same as true entry economics; hidden preference overhang can compress returns even if enterprise value holds.
    diligencePath: Request the full cap table, charter, financing documents, and board approvals in the legal data room.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Contracted ARR, gross margin by product line, customer concentration, and HCL-originated pipeline conversion data.
    whyItMatters: This is the missing bridge between strategic premium and underwritten software-like economics.
    diligencePath: Ask finance and GTM teams for cohort revenue, margin, and contract-level pipeline reviews.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: independent-model-validation
    missingEvidence: Independent replication of flagship model benchmarks and third-party reference calls from regulated customers using Sarvam in production.
    whyItMatters: Without external validation, a meaningful part of the sovereign frontier premium rests on self-reported performance claims.
    diligencePath: Run external technical diligence, benchmark replication, and customer-reference calls before final investment committee approval.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: Non-public private secondary marks and undisclosed regional sovereign-AI financings that could further refine the comparable set.
    whyItMatters: The current comparable table is sufficient for directional discipline but not exhaustive across opaque private markets.
    diligencePath: Supplement public sourcing with broker checks and private-market databases during live transaction work.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
