- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Publicly visible metric
  - Valuation / status
  - Why it matters for Sarvam
  - Main limitation
  rows:
  - - Sarvam AI
    - FY2026 turnover disclosed at INR 45.10 crore; HCLTech strategic stake
    - 2026 round at $1.5B post-money
    - Shows how much of the price rests on sovereign and channel optionality
    - Only one public turnover datapoint and no disclosed margin stack
  - - Krutrim
    - Close to $280M raised per Business Standard; earlier Indian AI unicorn marker
    - Indian sovereign-AI peer with fresh sponsor capital
    - Tests how Indian capital prices domestic AI narratives
    - Capital mix and commercial traction are still opaque
  - - AI21
    - $155M then $208M Series C; $1.4B valuation
    - Independent LLM vendor priced near Sarvam scale
    - Useful lower-end global LLM anchor around enterprise reasoning tools
    - 2023 market backdrop differs from 2026
  - - Mistral
    - ~€600M / $640-645M raise
    - ~$6B valuation in 2024
    - Shows what investors pay for credible frontier-model momentum
    - European scale and funding depth exceed Sarvam today
  - - Cohere
    - $500M round at $6.8B plus $100M extension
    - Enterprise-security LLM comp
    - Most relevant comp for secure enterprise AI narrative
    - Cohere discloses more scale signals than Sarvam
  - - Aleph Alpha
    - $500M sovereign-AI round with enterprise and state backing
    - European sovereign/secure AI analogue
    - Supports the existence of a sovereignty premium outside India
    - Valuation was not the main disclosed metric
  - - C3.ai
    - FY2026 revenue $250.3M; EV/Sales 3.77x
    - Public AI software comp with weak growth and losses
    - Useful floor for what the market pays without frontier scarcity
    - Very different product mix and public-company constraints
  - - Palantir
    - Revenue $5.22B; EV/Sales 57.64x
    - Public AI-adjacent outlier with strong disclosure and margins
    - Shows how large the premium can be when scale and proof are real
    - Not a fair direct comp for an early private LLM builder
  notes: 'The comp set is intentionally partial: it spans Indian peers, sovereign-AI analogues, independent LLM companies, and public AI software anchors that bracket how much of Sarvam’s price comes from scarcity versus disclosed execution.'
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant sovereign-AI, independent-LLM, and public AI software references needed to judge Sarvam’s 2026 round price; excludes undisclosed private transactions, regional secondaries, and non-public cap-table marks.
