- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round risk
    - Any new primary round materially below the current $1.5B headline price
    - Would prove that strategic premium outran proof creation
    - Re-underwrite from the new price instead of averaging in
  - - Channel conversion failure
    - HCLTech pipeline remains mostly pilots or services-heavy work after 12 months
    - Breaks the strongest strategic-premium argument
    - Treat HCLTech as a marketing partner, not a valuation premium
  - - Model-validation failure
    - Independent evaluators cannot reproduce flagship performance or customer proof
    - Shrinks moat from sovereign frontier narrative to vendor self-report
    - Cut bull-case probability and compress multiple
  - - Revenue-quality failure
    - Gross margin or paid retention underwhelm once disclosed
    - Turns workload intensity into a low-quality services story
    - Move toward bear-case valuation range
  - - Policy-support slippage
    - IndiaAI support becomes less useful or less economically meaningful than expected
    - Reduces one of the explicit premium supports
    - Value Sarvam closer to ordinary private AI software comps
  notes: These are not abstract risks; each one directly attacks the small set of facts currently carrying the premium above public AI software valuation anchors.
  claimRefs:
  - CV029
  - CV030
  - CV036
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Contracted ARR and mix
    - ARR by customer, product, and services vs recurring software mix
    - Separates true platform revenue from implementation-heavy work
    - Management data room plus sample executed contracts
  - - Gross margin by workload
    - Model, speech, document, and deployment margin by product line
    - Determines whether scale creates software economics or compute drag
    - Finance workstream with cohort contribution analysis
  - - Cap table and preferences
    - Liquidation stack, option pool, side letters, and any secondary rights
    - Changes true entry price and common-equity return math
    - Legal diligence on full cap table and board consents
  - - HCLTech conversion
    - Named pipeline, signed wins, renewal terms, and revenue attribution
    - Tests whether strategic premium is contractual or merely thematic
    - Joint commercial review with HCLTech and Sarvam sales
  - - Independent proof
    - Third-party benchmark replication and reference calls from regulated customers
    - Closes the credibility gap on model quality and enterprise readiness
    - External technical diligence plus customer calls
  notes: Each ask is linked to a live valuation variable rather than a generic diligence checklist; clearing even two of them could change the chapter stance materially.
