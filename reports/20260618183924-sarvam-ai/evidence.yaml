evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited or management-provided revenue, ARR, gross margin, burn, runway, and customer concentration metrics.
    whyItMatters: A $1.5B valuation and strategic-national positioning cannot be underwritten on operating-surface metrics alone.
    diligencePath: Request the latest board pack, cohort revenue bridge, gross-margin waterfall, and customer concentration schedule.
    relatedQuestionRefs:
      - QO020
      - QO025
  - type: missing-source
    severity: material
    topic: governance visibility
    missingEvidence: A current board list, executive roster, committee structure, and investor control-rights summary.
    whyItMatters: >-
      Founder strength is visible, but investors still need to understand governance quality, succession depth, and
      control mechanics.
    diligencePath: Request cap-table governance summary, board observer list, reserved matters schedule, and executive org chart.
    relatedQuestionRefs:
      - QO018
      - QO019
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: commercial scale disclosure
    missingEvidence: A complete customer list or segmented customer counts plus an exact current headcount.
    whyItMatters: Named proofs and large usage claims do not reveal concentration, repeatability, or organizational capacity.
    diligencePath: Request top-20 customer list by ARR, logo retention, sales-pipeline by vertical, and HR headcount snapshot.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: independent model evaluation
    missingEvidence: >-
      Independent benchmark replication, red-team results, and deployment-quality evaluations separate from
      company-controlled tests.
    whyItMatters: The sovereign-model thesis depends on trust in performance, safety, and multilingual quality under real workloads.
    diligencePath: Commission third-party benchmark replication and request deployment QA reports from major regulated customers.
    relatedQuestionRefs:
      - QO022
      - QO023
      - QO024
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A buyer-segmented revenue bridge or independent market study that isolates multilingual sovereign workflow spend
      within the much larger India AI and GenAI markets.
    whyItMatters: >-
      Without a segment-specific spend baseline, Sarvam’s true SAM and SOM cannot be defended from public market reports
      alone, so top-down valuation arguments remain loose.
    diligencePath: >-
      Request Sarvam’s pipeline and revenue split by product family, buyer type, and deployment model, then reconcile
      that against top-20 accounts and procurement or contract values for public-sector programs.
    relatedQuestionRefs:
      - QM005
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Current mix of recurring API or platform revenue versus forward-deployed services, implementation work, and
      one-time public-sector projects.
    whyItMatters: >-
      The multiple investors should pay depends heavily on whether Sarvam behaves like a scalable software platform or a
      services-assisted deployment business with slower margin expansion.
    diligencePath: >-
      Request product-line gross margins, ARR bridge, renewal or retention metrics, and the services share of booked
      revenue for BFSI, healthcare, government, and developer accounts.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: buyer-concentration
    missingEvidence: >-
      Net revenue concentration across central or state government accounts, regulated enterprises, and developer or
      self-serve customers, including collection cycles and contract duration.
    whyItMatters: >-
      A sovereign-AI narrative can hide lumpy exposure to a small number of government or enterprise accounts, which
      would materially change revenue durability and cash-conversion assumptions.
    diligencePath: >-
      Request the top-20 account list with annual contract value, renewal timing, implementation dependencies, payment
      cycle, and share of usage-based revenue versus committed minimums.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: krutrim-production-adoption
    missingEvidence: >-
      Named production customers, live workload volumes, and reference deployments for Krutrim Cloud and Krutrim
      enterprise model usage in 2026.
    whyItMatters: >-
      Krutrim is the most direct sovereign-stack rival to Sarvam, but public sources show infrastructure ambition more
      clearly than actual regulated-customer production usage.
    diligencePath: >-
      Request customer references, workload metrics, and renewal evidence from Krutrim or channel partners; check future
      public case studies or procurement disclosures.
    relatedQuestionRefs:
      - QP007
      - QP025
  - type: missing-source
    severity: material
    topic: commercial-pricing-transparency
    missingEvidence: >-
      Comparable public rate cards or realized contract benchmarks for Sarvam, Krutrim enterprise model services, and
      CoRover/BharatGPT deployments.
    whyItMatters: >-
      Without pricing transparency, it is difficult to know whether Sarvam wins primarily on product fit or whether
      buyers are paying a material premium for sovereign deployment and implementation support.
    diligencePath: >-
      Collect RFP responses, channel quotes, and customer procurement documents; ask each vendor for reference
      architectures tied to indicative commercial terms.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: bharatgen-commercial-substitutability
    missingEvidence: >-
      Public roadmap detail on when BharatGen or Bhashini-linked assets become directly substitutable for
      enterprise-managed platforms with support, security reviews, and SLAs.
    whyItMatters: >-
      Public initiatives clearly expand underlying model and data availability, but the timeline for those assets to
      displace managed enterprise platforms remains uncertain.
    diligencePath: >-
      Monitor BharatGen, Bhashini, and IndiaAI announcements for API access, production case studies, and governance
      documentation; interview system integrators building on those public assets.
    relatedQuestionRefs:
      - QP014
      - QP015
      - QP025
  - type: private-evidence-only
    severity: minor
