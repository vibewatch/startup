  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Sarvam AI sits inside a fast-growing India AI market, but its monetizable wedge is narrower than a generic TAM slide suggests: multilingual, sovereign, and regulated workflows where data residency, deployment support, and Indian-language speech or document accuracy matter more than lowest-cost generic model access. Public lenses such as BCG's $17 billion 2027 AI projection, IMARC's $1.5 billion 2025 India generative AI estimate, and the IndiaAI Mission's compute budget all confirm demand. The buyer evidence is stronger still: state governments, BFSI distribution and CX teams, healthcare workflow owners, and population-scale service programs are already adopting voice, document, and agent systems. The main constraints are compute economics, ROI scrutiny, open-source and hyperscaler substitutes, and long procurement or implementation cycles."
  },
  "sections": [
    {
      "id": "market-boundary-and-substitutes",
      "title": "Market Boundary and Status-Quo Substitutes",
      "body": "Sarvam should not be analyzed as if it sells into the whole India AI market. Its own product and pricing surfaces show a narrower commercial layer: speech-to-text, text-to-speech, translation, conversational agents, document digitisation, and model access that are optimized for Indian languages and regulated deployments. That matters because the real substitute set is not only other AI startups. It also includes global hyperscaler APIs, open-source models, in-house developer stacks, and traditional call-center or document-processing workflows. Sarvam's wedge gets stronger when a buyer needs code-mixed speech accuracy, India-only processing, audit trails, air-gapped or on-prem deployment, and workflow-level support. It gets weaker when a buyer only needs a cheap generic text API. The market boundary is therefore best defined as sovereign and multilingual AI infrastructure plus applications for regulated, citizen-facing, or high-volume Indian workflows, not as the full universe of enterprise software or frontier-model spending.",
