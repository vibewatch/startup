    {
      "id": "drivers-constraints-and-demand-shape",
      "title": "Drivers, Constraints, and Demand Shape",
      "body": "Several forces are pulling demand forward. IndiaAI lowers the cost of sovereign-model experimentation, Bhashini and related public initiatives normalize multilingual AI in citizen services, and Indian enterprises appear unusually willing to try AI at scale. Sarvam's own disclosures and customer stories suggest that voice and document workflows can move quickly when the product directly touches revenue, compliance, or labor efficiency. The constraints are equally important. BCG's adoption summary shows many organizations still struggle to realize value, meaning buying committees will ask for ROI and workflow proof rather than generic AI ambition. Compute and token economics remain harder in Indian languages than in English, which pressures margins and pricing. Open-source models and global clouds set a low-cost alternative for simpler use cases. Finally, public-sector and regulated deployments often require localization controls, human-in-the-loop review, procurement patience, and long integration cycles. Together, these factors imply a market with strong demand, but one where Sarvam's upside depends on proving durable deployment outcomes rather than merely benefiting from the sovereign-AI narrative.",
