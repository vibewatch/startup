  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: krutrim-production-adoption
    missingEvidence: Named production customers, live workload volumes, and reference deployments for Krutrim Cloud and Krutrim enterprise model usage in 2026.
    whyItMatters: Krutrim is the most direct sovereign-stack rival to Sarvam, but public sources show infrastructure ambition more clearly than actual regulated-customer production usage.
    diligencePath: Request customer references, workload metrics, and renewal evidence from Krutrim or channel partners; check future public case studies or procurement disclosures.
    relatedQuestionRefs:
    - QP007
    - QP025
  - type: missing-source
    severity: material
    topic: commercial-pricing-transparency
    missingEvidence: Comparable public rate cards or realized contract benchmarks for Sarvam, Krutrim enterprise model services, and CoRover/BharatGPT deployments.
    whyItMatters: Without pricing transparency, it is difficult to know whether Sarvam wins primarily on product fit or whether buyers are paying a material premium for sovereign deployment and implementation support.
    diligencePath: Collect RFP responses, channel quotes, and customer procurement documents; ask each vendor for reference architectures tied to indicative commercial terms.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: bharatgen-commercial-substitutability
    missingEvidence: Public roadmap detail on when BharatGen or Bhashini-linked assets become directly substitutable for enterprise-managed platforms with support, security reviews, and SLAs.
    whyItMatters: Public initiatives clearly expand underlying model and data availability, but the timeline for those assets to displace managed enterprise platforms remains uncertain.
    diligencePath: Monitor BharatGen, Bhashini, and IndiaAI announcements for API access, production case studies, and governance documentation; interview system integrators building on those public assets.
    relatedQuestionRefs:
    - QP014
    - QP015
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: sarvam-model-mix-in-production
    missingEvidence: Production split between Sarvam-owned models, third-party models, and bring-your-own-model deployments inside Sarvam customer environments.
    whyItMatters: If Sarvam frequently wins the workflow and deployment layer while buyers swap model families underneath, the economic moat is services and orchestration rather than exclusive model IP.
    diligencePath: Ask management for anonymized workload mix, migration data, and attach rates for Sarvam-owned models versus partner or customer-supplied models.
    relatedQuestionRefs:
    - QP020
    - QP022
    - QP023
