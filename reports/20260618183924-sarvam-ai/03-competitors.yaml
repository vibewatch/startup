- id: public-initiatives-and-hyperscalers
  title: Public Initiatives, Open Assets, and Hyperscaler Substitutes
  body: 'AI4Bharat and BharatGen matter because they change the economics of competition even when they are not direct enterprise vendors. AI4Bharat''s IndicTrans2 work claims open support for all 22 scheduled languages and released both datasets and benchmarks, while BharatGen''s consortium frames India-centric datasets, evaluation frameworks, privacy-preserving training, and multimodal public-good infrastructure as national assets. Those efforts do not look identical to Sarvam''s commercial offering, but they weaken the argument that one private vendor alone can monopolize Indic-language model assets. They also create a talent and benchmark commons that future entrants can build on.


    Hyperscalers are the other major substitute. Their threat is not that they obviously beat Sarvam on India-specific positioning; it is that they can be "good enough" components for internal-build strategies. The fetched documentation shows support is uneven by layer: Google Cloud Natural Language names only Hindi on the fetched support page, while Google Cloud Translation exposes a far broader Indic list including Assamese, Dogri, Konkani, Maithili, Manipuri, Sanskrit, and Sindhi; Azure Speech supports many Indian locales; and AWS Polly''s fetched page shows Hindi but not the same breadth. CoRover''s own case study illustrates the substitute route in practice: combine Gemini, speech, translation, NLP, and cloud infrastructure, then wrap that into a workflow product. Sarvam therefore competes not only against vendors, but against assembly of third-party pieces.'
