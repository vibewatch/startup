- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Supporting public evidence
  - Principal threat
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Secure sovereign deployment
    - Sarvam publicly offers private, hybrid, on-prem, and air-gapped options
    - Krutrim could add comparable managed deployment; hyperscalers can support custom secure builds
    - High
    - Sarvam wins most clearly when sovereignty and auditability are procurement gates
    - Ask for live reference architecture, security review artifacts, and deployment time-to-production
  - - Government trust and mandate
    - IndiaAI selected Sarvam for sovereign LLM work; UIDAI and NITI Aayog named as trusted institutions
    - Public initiatives can narrow exclusivity by publishing alternatives on AIKosh
    - High
    - Mandates and reference institutions can accelerate procurement more than model benchmarks alone
    - Confirm how much of current pipeline depends on sovereign-model branding versus standalone ROI
  - - Domestic infrastructure depth
    - Krutrim markets GPUaaS, 1000+ clusters, and active developer tooling
    - Krutrim can bundle infra and models under one domestic stack
    - High
    - Compute ownership can pressure Sarvam if buyers prefer one vendor for cloud + model + tooling
    - Request customer churn and win/loss data where Krutrim is in the bake-off
  - - Workflow distribution
    - CoRover publicly cites 100+ enterprises, 1B+ users, IRCTC, and regulated clients
    - CoRover can sit closer to end-user workflow than Sarvam
    - High
    - Installed assistants create data, integration, and procurement advantages even when underlying models can be swapped
    - Ask whether Sarvam is landing net-new workflows or replacing entrenched assistant vendors
  - - Open benchmark and public-good substitutes
    - AI4Bharat and BharatGen are expanding open models, data, and evaluation assets
    - Model commoditization and lower entry barriers for followers
    - Medium-High
    - Sarvam cannot rely on exclusive ownership of Indic-language model primitives forever
    - Track whether Sarvam retains proprietary evaluation, safety, or enterprise data advantages beyond open assets
  - - Multi-homing at the model layer
    - Sarvam markets BYO model / swap vendors; CoRover exposes Gemini as an LLM choice
    - Buyer can swap underlying models while retaining workflow layer
    - Medium
    - If model swapping is easy, Sarvam must monetize orchestration and deployment outcomes
    - Verify how sticky Sarvam integrations remain if the buyer substitutes another model family
  notes: Severity reflects expected impact on Sarvam's competitive position over the next 24 months, not absolute company risk; unknowns remain elevated because realized pricing and production volumes are mostly private.
