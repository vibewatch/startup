- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Sovereign narrative outruns economics
    - Paid enterprise deployments lag workload growth or HCLTech-sourced demand remains mostly pilot-stage
    - Two consecutive diligence cycles without visibility into paid production mix, margin, and channel conversion
    - Treat the company as infrastructure R&D exposure rather than software-like growth equity
  - - Capex and compute dependence
    - Management again says more capital is needed without showing a clearer revenue-quality bridge
    - Another financing event or compute-expansion ask before margin, burn, and paid-usage quality improve
    - Re-cut valuation assumptions and require a staged financing plan tied to commercial milestones
  - - Benchmark credibility gap
    - Independent replication or public leaderboard evidence still does not arrive after open-weight release
    - No credible third-party evaluation package or independent benchmark confirmation
    - Downgrade conviction on model-quality moat and underwrite as services/deployment execution only
  - - Privacy / security control miss
    - Material incident, regulator complaint, or missed deletion / consent obligations in a public or regulated deployment
    - Any breach, enforcement signal, or repeat consent-control failure without prompt evidence-backed remediation
    - Pause investment case until controls, disclosure quality, and customer impact are re-verified
  - - Open-source moat erosion
    - Comparable open models or hyperscaler components close the performance gap while Sarvam pricing remains opaque
    - Repeated customer evidence that buyers can substitute cheaper open or foreign models without losing key functionality
    - Haircut pricing power and assume lower long-term differentiation
  - - People concentration
    - Founder departure, key-researcher churn, or persistent inability to hire senior compliance / GTM leaders
    - Loss of a core founder or repeated unfilled critical roles
    - Escalate key-person diligence and require broader operating-bench evidence before further underwriting
  notes: These kill criteria convert the chapter into observable thresholds; they are not forecasts, but they define when optimism should stop and re-underwriting should begin.
