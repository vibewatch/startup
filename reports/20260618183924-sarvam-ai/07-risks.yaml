- id: policy-privacy-and-regulatory-exposure
  title: Policy, privacy, and regulatory posture are strengths only if Sarvam can operationalize them
  body: 'Sarvam looks more mature than many AI startups on legal and trust surfaces, but those same surfaces define a large compliance burden. Its homepage and trust center market data residency, air-gapped deployment, audit trails, and certifications. Its privacy policy goes much further than marketing copy by naming DPDPA obligations, withdrawal rights, deletion timelines, child-data handling, and consent requirements for cloned voices. The terms of service also show the harder edge of the stack: Sarvam can suspend service, auto-renew pricing plans, demand indemnification, and localize disputes to Bengaluru. External legal commentary broadens the issue. Bar & Bench highlights ambiguity around automated decision-making, public-interest processing, and cross-border transfer costs under India''s privacy regime, while IndiaLaw argues that the 2025 AI Governance Guidelines push AI vendors toward audit trails, lawful dataset provenance, and impact assessments. The risk is therefore two-sided.
    On the positive side, Sarvam appears aware of the compliance agenda. On the negative side, most trust documents remain NDA-gated, the company itself says no internet transmission is perfectly secure, and any failure in voice, biometric, or public-service deployments would be judged against a much higher privacy-and-governance bar than that faced by a generic developer tool startup.'
