company:
  name: Sarvam AI
chapter:
  number: 7
  title: Risks
  summary: 'Sarvam AI''s risk profile is dominated by dependency stacks rather than a single flaw: the company is trying to turn a sovereign-AI and government narrative into durable enterprise revenue while still relying on HCLTech distribution, IndiaAI-linked compute support, NVIDIA-centered optimization, and self-reported model-quality claims. Public legal and privacy surfaces are more mature than most startups'', but they also show meaningful obligations, NDA-gated assurance documents, and contract terms that shift operating risk back to customers. The chapter''s main conclusion is that Sarvam is strategically important and better financed than before, yet still exposed to capex intensity, verification gaps, monetization opacity, and moat erosion from open models and global rivals.'
sections:
- id: sovereign-narrative-and-partner-concentration
  title: Sovereign-AI narrative and partner concentration create a high-bar execution risk
  body: 'Sarvam''s strongest commercial story is also its first major risk surface. The company is explicitly selling a sovereign-AI stack into enterprises, government, and regulated sectors, and the June 2026 financing makes HCLTech a strategic owner rather than a passive investor. Public sources show why that matters: HCLTech is supposed to bring enterprise access, government credibility, and integration muscle, while IndiaAI-linked compute support helps Sarvam train and serve larger models. But the same evidence shows that this narrative is concentration-heavy. Raghavan says the current raise is still not enough for bigger models, Business Standard says foreign jurisdictions can throttle access to critical AI technology overnight, and Forbes India argues that India''s stack is still incomplete because GPUs, cloud layers, and research depth remain partly foreign-controlled. In other words, Sarvam is not only selling model quality; it is selling the promise that a domestic stack can stay
    available, financeable, and trustworthy for mission-critical use. If HCLTech demand creation disappoints, if government procurement slows, or if foreign-compute dependence bites before Sarvam broadens its commercial base, the sovereign narrative turns from moat into expectation gap very quickly.'
