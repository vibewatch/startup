- id: capex-competition-and-monetization-opacity
  title: Capex intensity, model-quality competition, and monetization opacity travel together
  body: 'The second risk cluster is economic rather than merely narrative. Sarvam''s own materials say the company is building training and inference infrastructure, frontier research, and product layers at once; NVIDIA''s technical write-up shows how much work is already required just to hit voice-agent latency targets efficiently; and public critics keep returning to the same commercial question: can Sarvam monetize fast enough before open and global rivals narrow the value gap? The evidence is mixed. Sarvam now has open-weight 30B and 105B models on Hugging Face, and recent download activity is materially better than the hostile early commentary around Sarvam-M. Yet the pricing surfaces remain inconsistent on even basic onboarding credits, public materials still do not disclose burn, margin, NRR, or customer concentration, and independent validation of flagship benchmark claims is still thin. This matters because Sarvam is competing against frontier closed models, rapidly improving open-source
    models, and hyperscaler-backed components at the same time. The practical risk is not simply that the models fail academically; it is that inference economics, pricing discipline, and real enterprise willingness to pay may prove weaker than workload growth or patriotic enthusiasm suggests.'
