  evidenceGaps:
  - type: missing-source
    severity: material
    topic: indiaai-support-durability
    missingEvidence: Official grant terms, equity mechanics, GPU-allocation duration beyond the cited six months, and any performance conditions attached to IndiaAI-backed support.
    whyItMatters: Public reporting shows Sarvam benefited from mission-backed compute support, but investors still cannot tell how durable or conditional that support is once model scale and serving demand increase.
    diligencePath: Request the IndiaAI award letter, GPU-allocation schedule, cost-sharing mechanics, and any milestone or clawback provisions tied to public support.
    relatedQuestionRefs:
    - QR004
    - QR026
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-revenue-quality
    missingEvidence: Monthly burn, gross margin by workload, paid conversion, partner-sourced vs direct revenue mix, and customer concentration.
    whyItMatters: Without revenue-quality and margin evidence, investors cannot tell whether sovereign-AI demand is becoming durable software economics or simply expensive workload growth.
    diligencePath: Request the board KPI pack, top-customer contracts, margin bridge by product family, and a 24-month base/upside/downside financing plan.
    relatedQuestionRefs:
    - QR012
    - QR026
    - QR027
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: independent-benchmark-verification
    missingEvidence: A credible third-party evaluation package, public leaderboard placement, or independent red-team results for Sarvam's flagship 30B and 105B models.
    whyItMatters: Sarvam's policy and enterprise positioning makes benchmark credibility central to procurement confidence; self-reported superiority claims are not enough for high-consequence deployments.
    diligencePath: Commission an external benchmark run across global and Indic tasks, require methodology disclosure, and compare results to open and closed alternatives buyers actually use.
    relatedQuestionRefs:
    - QR015
    - QR024
    relatedTableRefs:
    - TR002
  - type: conflicting-data
    severity: minor
    topic: open-source-posture
    missingEvidence: A precise statement reconciling the proprietary-government-funding narrative with the later Apache-licensed weight releases, including what remains closed.
    whyItMatters: Contradictory public posture on what is open versus proprietary affects moat analysis, public-benefit arguments, and developer trust.
    diligencePath: Ask Sarvam to spell out which assets are open, which remain closed, whether training data and code are public, and how government-funded components are licensed.
    relatedQuestionRefs:
    - QR016
    - QR017
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-assurance-and-control-maturity
    missingEvidence: SOC 2 report, certificate scopes, penetration-test results, incident history, and regulator or customer audit findings for major deployments.
    whyItMatters: Sarvam is courting government and regulated buyers; headline trust claims are useful, but investors need operating evidence to judge whether control maturity matches the marketing surface.
    diligencePath: Open the NDA diligence room, review the last 12 months of incidents and remediation logs, and verify control ownership for deletion, consent, and model-safety obligations.
    relatedQuestionRefs:
    - QR021
    - QR025
    relatedTableRefs:
    - TR001
    - TR004
