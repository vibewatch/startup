- id: people-open-source-and-thesis-breakers
  title: People concentration and open-source posture keep the residual exposure high
  body: 'The final residual risk is execution concentration. Sarvam''s public identity is still unusually founder-centric: Pratyush Kumar and Vivek Raghavan supply much of the company''s credibility across AI4Bharat, Aadhaar, Bhashini, and enterprise/government AI. Forbes describes a 40-researcher effort behind the scratch-built frontier models, and BusinessLine says Sarvam is still ramping hiring in India and the US. That is impressive, but it is also a reminder that the company is trying to scale research depth, compliance operations, customer success, and enterprise go-to-market simultaneously. Open-source posture adds another wrinkle. Sarvam now has Apache-licensed weights and visible Hugging Face adoption, which helps ecosystem reach, but it also lowers switching costs and makes the moat depend more on deployment quality, latency, safety, and distribution than on raw model exclusivity. The most realistic underwriting stance is therefore conditional. Sarvam can work if it converts HCLTech
    and government relevance into repeatable paid deployments while broadening leadership bench strength and proving independent model quality. If instead it remains primarily a policy symbol, a wrapper around expensive compute, or a founder-branded showcase with opaque economics, the chapter''s kill criteria should trigger quickly rather than be rationalized away.'
