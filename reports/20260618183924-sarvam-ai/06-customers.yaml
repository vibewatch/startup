- id: durability-retention-and-concentration-risk
  title: Durability, Retention, and Concentration Risk
  body: 'Public evidence on durability is much weaker than public evidence on deployment. The fetched materials do not disclose NRR, GRR, logo churn, contract duration, renewal timing, or top-customer revenue mix. That means the best available renewal proxies are indirect: repeat public proof in BFSI, multiple public-service use cases inside Listen at Scale, and the fact that Sarvam is layering channels such as YCP and Razorpay on top of direct product sales. None of those proxies substitute for real retention data. Concentration is therefore a material open question. The most visible enterprise proof is still clustered in BFSI, while a substantial share of the population-scale narrative depends on government-linked programmes or announced state infrastructure. The main adverse evidence is not a failed customer story but execution friction: MediaNama noted that Tamil Nadu’s sovereign AI park had no clear implementation timeline and cited policy analysis warning that IndiaAI compute capacity
    could be underused because qualification and procurement frictions can slow uptake. For diligence purposes, Sarvam’s customer chapter supports meaningful adoption momentum, but not yet durable-revenue quality.'
