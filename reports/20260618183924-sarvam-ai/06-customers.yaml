- id: deployment-scale-and-government-case-studies
  title: Deployment Scale and Government Case Studies
  body: 'The strongest supportable scale signals come from workflow reach rather than revenue disclosure. SBI Life is the clearest enterprise-scale proof point: Sarvam says the deployment reaches more than 8 crore customers and supports over 3.5 lakh distributors, with multilingual product queries and sales enablement delivered through WhatsApp and voice surfaces. HealthPlix adds narrower but operationally deeper proof, showing speech-to-text embedded into live doctor consultations with quantified time savings and prescription-accuracy claims. The most material public-sector evidence comes from the EkStep-AI4Bharat-Sarvam Listen at Scale programme, where fetched sources consistently describe 20 organisations, roughly 50 lakh unique users, and 74+ lakh voice AI minutes over 31 days. That programme also produced outcome-level case studies for the National Health Authority, disability profiling, and Odisha agriculture monitoring. By contrast, the Odisha and Tamil Nadu state partnerships are
    strategically significant but should still be classified as announced deployment pathways rather than fully verified production utilisation; they show strong pipeline and political access, not yet the same level of on-the-ground proof as Listen at Scale or SBI Life.'
