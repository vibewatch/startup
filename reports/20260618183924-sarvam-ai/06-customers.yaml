chapter:
  number: 6
  title: Customers
  summary: Sarvam AI now has credible public customer proof across Indian financial services, healthcare, education/public-good digitisation, and population-scale government workflows, with the clearest production evidence coming from SBI Life, Tata Capital, HealthPlix, and the EkStep-led Listen at Scale programme. The public record is strongest on deployment reach and workflow outcomes, but still weak on revenue concentration, retention, contract duration, and the exact share of announced public-sector partnerships that have converted into durable paid usage.
sections:
- id: customer-base-and-named-proof
  title: Customer Base Segmentation and Named Proof
  body: 'Sarvam’s public customer evidence is now meaningfully broader than a single marquee logo. The fetched stories hub and customer pages show named proof in BFSI, healthcare, education/public-good digitisation, and public-service voice workflows, while the partnerships surface adds commerce, consulting, and infrastructure partners. That breadth matters because it suggests Sarvam is not selling only one sovereign-model narrative; it is monetising a set of multilingual workflow capabilities across sectors where local language handling and deployment flexibility matter. The quality of proof still varies sharply by segment. Tata Capital and SBI Life are the clearest regulated-enterprise references, HealthPlix is the strongest workflow-depth proof in healthcare, Ekatra is distinctive but likely much smaller in commercial value, and Listen at Scale proves reach inside public systems without fully disclosing Sarvam’s direct economics. The buyer-user-payer relationship also changes by segment:
    insurers and software platforms appear to be direct enterprise buyers, EkStep is an ecosystem host, and state partnerships look more like strategic infrastructure relationships whose budget mechanics and monetisation timing remain opaque.'
