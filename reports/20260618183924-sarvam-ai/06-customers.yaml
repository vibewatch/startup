figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Sarvam’s visible customer motion typically starts with a localized workflow problem, integrates into an existing system, and then expands through scale, additional languages, or partner distribution.
  data:
    items:
    - label: Localized workflow identified
      detail: A regulated enterprise, public programme, or partner identifies a workflow where Indian-language voice or document handling is the constraint.
    - label: Proof-of-value integration
      detail: Sarvam integrates speech, OCR, or orchestration APIs into the customer’s existing product or service workflow.
    - label: Controlled production rollout
      detail: The customer launches into a bounded but live surface such as agent enablement, doctor documentation, or beneficiary outreach.
    - label: Scale through users or minutes
      detail: Public proof becomes visible through end-user reach, consultation volume, voice minutes, or process outcomes rather than disclosed contract value.
    - label: Expansion through languages and surfaces
      detail: The same account or partner adds languages, channels, adjacent workflows, or new user groups.
    - label: Ecosystem or infrastructure layer
      detail: Sarvam then tries to deepen the relationship through channels, developer surfaces, or sovereign-infrastructure projects.
  claimRefs:
