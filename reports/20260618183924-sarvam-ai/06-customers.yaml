- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale signal
  - Strategic value
  - Gap
  rows:
  - - BFSI enterprises
    - 'Buyer: insurer/lender digital teams; Users: agents, call-center staff, borrowers, policyholders; Payer: enterprise software budget'
    - Multilingual customer engagement, collections/sales support, distributor enablement
    - Tata Capital case study plus SBI Life reaching 8Cr+ customers and 3.5L distributors
    - Strongest regulated-industry proof and clear fit for multilingual voice workflows
    - No contract values, contract terms, or renewal data disclosed
  - - Healthcare software / providers
    - 'Buyer: HealthPlix product and operations teams; Users: doctors and clinic staff; Payer: HealthPlix platform budget'
    - Speech-to-text and real-time clinical documentation inside HALO
    - HealthPlix says its EMR serves 14,000+ doctors and 1.5 lakh outpatient consultations per day; Sarvam-backed HALO crossed 50,000+ consultations
    - Shows product depth in a workflow where latency and accuracy matter
    - No disclosed commercial scope between Sarvam and HealthPlix
  - - Education / cultural digitisation
    - 'Buyer: Ekatra Foundation and collaborators; Users: archivists, proofreaders, readers; Payer: foundation/project funding'
    - OCR, layout understanding, and text recovery for Gujarati literature
    - 50,000-book / 10 million-page ambition with major accuracy improvement claims
    - Extends proof beyond voice into document AI and Indic-language preservation
    - Likely smaller-ticket and not enough to infer enterprise-scale ARR
  - - Public-service programme operators
    - 'Buyer: government departments or nonprofits; Users: citizens and beneficiaries; Payer: programme budgets / grants'
    - Voice outreach, verification, grievance capture, and policy feedback
    - 'Listen at Scale: 20 organisations, 74+ lakh minutes, ~50 lakh users'
    - Strongest population-scale application proof in the public sector
    - Programme economics and Sarvam take-rate are not disclosed
  - - State governments / sovereign infrastructure
    - 'Buyer: Odisha and Tamil Nadu; Users: agencies, citizens, and potentially other states; Payer: public-sector capex / procurement'
    - Compute hubs, citizen-service AI, agricultural and industrial workflows
    - Odisha 50MW facility and Tamil Nadu 20MW Digital Sangam announcements
    - Could create sticky public-sector infrastructure relationships and compute demand
    - Most evidence is announced roadmap, not verified recurring usage
  - - Channel and commerce partners
    - 'Buyer: Swiggy, Razorpay, YCP, Pixxel; Users: shoppers, enterprise clients, developers, operators; Payer: partner budgets / joint programmes'
    - Voice-led commerce, enterprise transformation, ecosystem distribution, infrastructure validation
    - 11-language commerce claims, Agent Studio integration, and pilot-to-scale advisory
    - Broadens distribution beyond direct sales and embeds Sarvam into partner ecosystems
    - Revenue-sharing, exclusivity, and conversion rates are undisclosed
  notes: Rows distinguish direct enterprise customers, ecosystem hosts, public-sector relationships, and channel partners because the public Sarvam surface mixes all four.
