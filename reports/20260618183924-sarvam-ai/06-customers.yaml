- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - BFSI voice-led engagement success
    - Public enterprise proof is most visible in BFSI
    - Could mean healthy vertical focus or hidden dependency on a small set of insurers/lenders
    - Request ARR and pipeline split by BFSI vs non-BFSI
  - - Population-scale public-sector programmes
    - Government-linked use cases anchor the largest scale claims
    - Budget cycles, policy shifts, or slow procurement could delay monetisation
    - Request booked vs pilot vs grant-backed public-sector revenue
  - - Partner-led delivery through YCP
    - Implementation partner helps enterprises move beyond fragmented pilots
    - Dependence on services partners can compress margins or weaken direct account control
    - Request partner-sourced pipeline, attach rates, and margin split
