- id: partner-led-expansion-and-channel-evidence
  title: Partner-Led Expansion and Channel Evidence
  body: 'Sarvam’s customer motion is increasingly partner-assisted rather than purely direct. YCP India is explicitly framed as the consulting and execution layer that can help enterprises move from fragmented AI pilots to organisation-wide deployment, which is useful channel evidence but also a clue that implementation complexity remains non-trivial. Swiggy and Razorpay show a second expansion path: Sarvam is pushing multilingual voice and agent infrastructure into commerce surfaces where end users may never know Sarvam is the underlying vendor. That is important because it broadens the company beyond contact-centre or document workflows into transactional commerce and developer ecosystems. Pixxel is different again: it is a strategic infrastructure validation project with potential long-term signalling value, but not current customer-revenue proof. Taken together, the fetched partnership pages show Sarvam trying to build a distribution web around enterprise transformation partners, commerce
    platforms, developer ecosystems, and sovereign-infrastructure partners. The upside is a wider land-and-expand surface; the downside is that public materials still do not quantify partner-sourced pipeline, revenue-sharing terms, or how many of these relationships have moved from announcement to measurable recurring spend.'
