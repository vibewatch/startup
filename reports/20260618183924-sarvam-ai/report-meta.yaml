  topStrengths:
    - Sarvam combines sovereign-AI narrative, IndiaAI Mission support, and HCLTech distribution leverage in a way few Indian peers can match.
    - The company already exposes a broad product surface across language, speech, document, and agent workflows rather than relying on a single model story.
    - Public deployment signals such as 10 million daily API calls, 2 million daily interactions, and large government-adjacent workflows suggest real usage momentum.
  topRisks:
    - Public disclosure still does not show ARR, recognized revenue quality, gross margins, burn, or cap-table terms needed to underwrite a $1.5B price cleanly.
    - Sarvam's strategic premium depends heavily on government alignment, subsidized compute access, and HCLTech channel execution, all of which can underperform narrative expectations.
    - Model differentiation and sovereign positioning face pressure from Krutrim, AI4Bharat, BharatGen, hyperscalers, and fast-moving open-weight ecosystems.
  unresolvedGaps:
    - Current cap table, preference stack, and investor rights for the 2026 Series B and any associated secondaries
    - Audited or board-grade revenue breakdown showing usage vs services mix, gross margin, and renewal quality
    - Named customer concentration, contract duration, and independent validation of flagship deployment and benchmark claims
