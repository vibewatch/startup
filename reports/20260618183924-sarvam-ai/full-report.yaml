  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding structure and the HCLTech strategic overlay
        blocks:
          - type: paragraph
            body: >-
              Sarvam's June 2026 financing changes the company's financial profile more through who funded it than
              through headline valuation alone. The first close brought in $234 million at a $1.5 billion post-money
              valuation, with HCLTech contributing $150 million in cash for 41,421 shares and a 10.46 percent stake.
              That gives Sarvam much more than venture runway: HCLTech is explicitly positioning the investment as a
              route into sovereign-AI workloads for regulated enterprises and government buyers, while Sarvam says the
              proceeds will fund frontier-model research, large-scale inference, and compute access. The key
              underwriting implication is that the round acts as both balance-sheet capital and a distribution
              partnership. But the same public record also shows why the chapter should not treat this as
              self-sufficient financing: management says larger models will still require more capital, the full $300
              million round was not yet completely closed in public materials, and the business remains early relative
