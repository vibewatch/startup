        title: Founders, Leadership Surface, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The public founder story is one of the strongest parts of Sarvam’s profile. Vivek Raghavan’s background in
              Aadhaar-scale digital public infrastructure and Pratyush Kumar’s AI4Bharat / IIT Madras credentials give
              the company an unusually credible founder-market-fit narrative for India-focused language AI. Those
              biographies are repeated across company, investor, and independent reporting and help explain why Sarvam
              can credibly pursue both public-sector and enterprise deployments. The weaker side of the leadership
              picture is breadth and governance disclosure. In the fetched official pages, the visible narrative remains
              heavily founder-centric, with limited transparency on broader executive depth, board composition,
              committee structure, or control rights. That does not negate founder strength, but it does increase
              key-person dependence and makes later-stage governance diligence a required workstream rather than a box
              already checked by public evidence.
