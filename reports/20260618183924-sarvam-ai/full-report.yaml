companyProfile:
  summary: >
    Sarvam AI is a Bengaluru-based sovereign AI company building a full-stack platform for India across large language
    models, speech recognition, text-to-speech, translation, document AI, and agentic workflows. Founded in 2023 by
    Vivek Raghavan and Pratyush Kumar, the company has positioned itself at the intersection of national AI
    infrastructure, regulated-enterprise deployment, and Indic-language performance. Public evidence confirms IndiaAI
    Mission selection, a June 2026 Series B first close at a $1.5 billion post-money valuation, and growing deployment
    claims across enterprise and government settings, but still leaves revenue quality, governance depth, customer
    concentration, and margin durability materially under-disclosed.
