            body: >-
              Sarvam’s milestone arc moves quickly from a 2023 founding to IndiaAI Mission selection in April 2025,
              product debate around Sarvam-M in May 2025, frontier/open-weight model publication in early 2026, and
              unicorn status by mid-2026. The strongest positive public signals are specific product and deployment
              claims: named product families, a published customer story with Tata Capital, and company-announced
              operating metrics around interactions, API calls, document pages, audio hours, and population-scale
              workflows. The main caution is that these are still mostly operating-surface signals rather than audited
