      - number: '8.3'
        title: Scenario underwriting points to a valuation range below the round price in the base case
        blocks:
          - type: paragraph
            body: >-
              A scenario view helps translate the evidence into underwriting discipline. The bull case assumes that
              HCLTech-originated distribution converts into signed, recurring government and regulated-enterprise
              contracts; that IndiaAI support keeps the sovereign narrative economically relevant; and that independent
              evaluation narrows today’s credibility gap. Under that set of assumptions, Sarvam can plausibly earn a
              $1.8-2.4 billion valuation range. The base case is more conservative and also more consistent with the
              public record: Sarvam remains strategically important, but the market still lacks verified evidence on
              revenue quality, margins, and the proportion of demand that is contracted rather than pilot-led. That view
              supports roughly $1.0-1.3 billion today. The bear case drops further, toward $0.6-0.9 billion, if the
              sovereign-AI stack proves capital intensive, services-heavy, and more dependent on imported layers than
              the valuation narrative currently assumes. Probability-weighting those scenarios still leaves the headline
              round looking full on public evidence, even if not irrational.
