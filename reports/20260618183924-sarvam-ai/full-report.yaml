      - number: '8.2'
        title: Comparable context says Sarvam is cheaper than frontier leaders but rich versus disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The comp set cuts both ways. On the bullish side, independent LLM and sovereign-AI builders can clearly
              command large premiums: AI21 crossed a $1.4 billion valuation, Mistral moved into the roughly $6 billion
              bracket, Cohere reached $6.8 billion while emphasizing secure enterprise AI, Aleph Alpha raised $500
              million around a European sovereignty narrative, and Anthropic reached $61.5 billion on the global
              frontier. Those precedents matter because they show investors will pay heavily for scarce model builders
              with credible strategic positioning. But the same comp set also exposes Sarvam’s current gap. Sarvam is
              closer to AI21’s valuation tier than to Mistral or Cohere on public commercial proof, while public AI
              software comps are far less forgiving: Multiples.vc places AI software around 3.9x NTM revenue, C3.ai
              screens at only 3.77x EV/sales, and even Palantir’s extreme premium is backed by multi-billion-dollar
              revenue and liquid-market disclosure. Sarvam therefore sits in an awkward middle zone: too strategically
              important to value like ordinary software, but too undisclosed to grant a frontier-lab premium without
              reservation.
