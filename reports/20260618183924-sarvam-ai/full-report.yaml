      - number: '5.3'
        title: Deployment, inference, and developer tooling
        blocks:
          - type: paragraph
            body: >-
              Sarvam's deployment story now has two very different tracks. One is the sovereign-cloud and API track,
              where the company publishes open-weight model cards, exposes Hugging Face and SGLang inference patterns,
              and collaborates with NVIDIA on aggressive kernel and scheduler optimization for large-model serving. The
              other is the Edge track, which tries to push ASR, translation, and synthesis onto devices under 1GB with
              chipset-specific validation and India-hosted overflow. Together, those tracks suggest Sarvam wants
              coverage from datacenter-grade agentic reasoning down to offline consumer and enterprise hardware. The
              technical challenge is that these are materially different optimization problems, and the public materials
              show Sarvam still leaning on specific partner ecosystems such as NVIDIA for high-end serving and Qualcomm
              or other silicon vendors for device-side execution.


              Developer tooling is better than many India-focused AI startups. Sarvam exposes official SDK docs, a PyPI
              package, a Vercel AI SDK adapter, cookbook examples, and an MCP server that turns many APIs into
              first-class tools. The company is explicit that Python and JavaScript are the only first-class SDKs, which
              is honest but also means broader enterprise language support still depends on raw HTTP integration or
              generated snippets. On the open-weight side, the biggest deployment caveat is that vLLM support is not yet
              as turnkey as Hugging Face or SGLang; the model cards still talk about a PR, a custom fork, or a hotpatch
              path. That does not negate the technical progress, but it does mean the most sophisticated open-weight
              deployment paths still assume relatively capable infrastructure teams rather than plug-and-play enterprise
              admins.
