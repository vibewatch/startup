      - number: '3.2'
        title: 'Indian Peer Comparison: Sarvam, Krutrim, and CoRover'
        blocks:
          - type: paragraph
            body: >-
              Among private Indian competitors, Sarvam, Krutrim, and CoRover solve adjacent but distinct problems.
              Sarvam's public evidence is deepest on sovereign deployment, named institutions, and government-backed
              foundational-model work. Krutrim's evidence is deepest on the underlying stack: domestic GPU cloud,
              developer tooling, and the ambition to own compute, models, and infrastructure together. CoRover has the
              clearest public evidence of workflow distribution today: its own properties and Google's case study point
              to 100+ enterprises, 1 billion-plus users, major travel and regulated-workflow deployments, and a product
              architecture that can sit directly in front of customers across voice, video, text, WhatsApp, IVR, and
              web.


              This means the main rival axis is not one-dimensional. Krutrim pressures Sarvam from below by bundling
              compute and developer primitives that can compress platform margins. CoRover pressures Sarvam from above
              by occupying the application and customer-success layer with already-deployed assistants and large traffic
              volumes. Sarvam's response, based on public evidence, is to position itself between those poles: more
              sovereign and air-gappable than CoRover's hyperscaler-centered delivery model, and more deployment-ready
              for government and enterprise workflows than Krutrim's public developer-first cloud posture. That is
              strategically attractive, but it also means Sarvam must keep proving that its middle-layer orchestration
              is worth buying rather than building.
