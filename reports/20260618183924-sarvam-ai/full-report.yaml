chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Stack
        blocks:
          - type: paragraph
            body: >-
              Sarvam AI presents itself as an India-first, full-stack sovereign AI platform rather than a single-model
              lab. Public materials consistently anchor the company in Bengaluru, a 2023 founding, and a mission to
              build AI that is developed, deployed, and governed in India for enterprises, developers, and government
              users. The current public surface spans frontier language models, speech, translation, vision, document
              digitisation, and agent platforms, with deployment modes that include private cloud, hybrid, on-premise,
              and air-gapped environments. Sarvam also discloses pay-per-use API pricing for several core services,
              which is unusual for a private frontier-model startup and helps show where the company wants developers to
              enter the stack. The core chapter takeaway is that Sarvam is not selling a single sovereign-LLM story; it
              is packaging sovereign compute, Indic-language model performance, and workflow products into a broader
              go-to-market system. It also creates an important diligence distinction: Sarvam has already proven it can
              assemble a coherent public platform narrative, but investors still need to test whether those surfaces map
              cleanly onto repeatable revenue, customer retention, and defensible cost-to-serve economics.
