      - number: '1.3'
        title: Funding History and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Funding history is comparatively well documented. Sarvam announced a $41 million Series A in December 2023
              led by Lightspeed with support from Peak XV Partners and Khosla Ventures, and TechCrunch’s contemporaneous
              coverage framed the company as a five-month-old Bengaluru startup building a full-stack generative AI
              stack for India. On 15 June 2026, Sarvam disclosed a $234 million first close of a planned $300 million
              Series B at a $1.5 billion post-money valuation, with HCLTech as lead strategic investor and Bessemer also
              participating alongside existing backers. That round is important not only for size but for stakeholder
              mix: it adds a large Indian IT services partner with enterprise distribution and implementation depth to a
              cap table that already included top venture firms. The available evidence supports a strong capital-access
              narrative, but not yet a transparency narrative on ownership concentration, liquidation preferences, or
              secondaries.
