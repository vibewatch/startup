  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Sovereign-AI narrative and partner concentration create a high-bar execution risk
        blocks:
          - type: paragraph
            body: >-
              Sarvam's strongest commercial story is also its first major risk surface. The company is explicitly
              selling a sovereign-AI stack into enterprises, government, and regulated sectors, and the June 2026
              financing makes HCLTech a strategic owner rather than a passive investor. Public sources show why that
              matters: HCLTech is supposed to bring enterprise access, government credibility, and integration muscle,
              while IndiaAI-linked compute support helps Sarvam train and serve larger models. But the same evidence
              shows that this narrative is concentration-heavy. Raghavan says the current raise is still not enough for
              bigger models, Business Standard says foreign jurisdictions can throttle access to critical AI technology
              overnight, and Forbes India argues that India's stack is still incomplete because GPUs, cloud layers, and
              research depth remain partly foreign-controlled. In other words, Sarvam is not only selling model quality;
              it is selling the promise that a domestic stack can stay available, financeable, and trustworthy for
              mission-critical use. If HCLTech demand creation disappoints, if government procurement slows, or if
              foreign-compute dependence bites before Sarvam broadens its commercial base, the sovereign narrative turns
              from moat into expectation gap very quickly.
            claimRefs:
