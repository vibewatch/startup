            body: >-
              Public evidence on durability is much weaker than public evidence on deployment. The fetched materials do
              not disclose NRR, GRR, logo churn, contract duration, renewal timing, or top-customer revenue mix. That
              means the best available renewal proxies are indirect: repeat public proof in BFSI, multiple
              public-service use cases inside Listen at Scale, and the fact that Sarvam is layering channels such as YCP
