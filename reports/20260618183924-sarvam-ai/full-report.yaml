      - number: '2.2'
        title: Sizing Lenses and the Monetizable SAM
        blocks:
          - type: paragraph
            body: >-
              The public market data is useful for context but insufficient for a clean Sarvam-style TAM or SOM.
              Government and analyst sources do establish that India is investing real money in AI infrastructure and
              adoption. IndiaAI's mission outlay and subsidized compute supply show that the state is treating sovereign
              AI as strategic infrastructure, while BCG and IMARC show that Indian enterprises are already spending
              against a market projected to grow rapidly through the decade. But those lenses still overstate Sarvam's
              practical revenue pool because they include categories Sarvam does not fully capture: broad enterprise AI
              software, generic automation, non-Indian-language use cases, and adjacent hardware or services. The more
              decision-useful framing is a constrained SAM made up of multilingual voice, document, agent, and
              sovereign-model workflows for buyers that care about localization, data control, or regulated production
              deployment. Public figures prove that the top-down market is large; they do not yet prove how much of that
              market is structurally available to Sarvam at software-like economics.
