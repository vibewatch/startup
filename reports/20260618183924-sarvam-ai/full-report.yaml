      - number: '5.2'
        title: Model lineage, speech stack, and translation capabilities
        blocks:
          - type: paragraph
            body: >-
              The deepest technical substance in Sarvam's public materials sits in the model lineage. The flagship 30B
              and 105B sovereign models are no longer described as wrappers or post-training-only artifacts; Sarvam's
              March 2026 release describes from-scratch training, in-house RL infrastructure, and explicit architectural
              choices for sparse MoE reasoning. The 30B model is tuned for practical deployment and multilingual voice
              or tool-using applications, while the 105B model is positioned as the heavier reasoning and agentic tier.
              Around that core, Sarvam has assembled specialized modality models: Saaras for STT, Bulbul for TTS, Sarvam
              Translate for formal multilingual translation, Shuka as an audio-native language model, Vision for
              document understanding, and older lineage points such as Sarvam 1 and Sarvam-M.


              Speech and translation are where Sarvam's stack looks most differentiated. Saaras V3 exposes multiple
              output modes and streaming support while targeting Indian languages, telephony audio, code-mixed speech,
              and Indian-accented English. Bulbul V3 adds multi-transport TTS, larger voice libraries, and more explicit
              quality trade-offs than most Indian-language voice products disclose publicly. Sarvam Translate in turn is
              optimized for formal, structured long-form translation rather than everyday colloquial flexibility, which
              is why the docs still route some use cases back to Mayura. This specialization is strategically coherent:
              Sarvam is not claiming a universal foundation-model monopoly; it is curating a family of modality-specific
              systems that map onto real Indian enterprise workflows. The trade-off is that several benchmark and
              quality claims remain self-reported, especially for the sovereign LLMs, which keeps the burden of
              independent evaluation high.
