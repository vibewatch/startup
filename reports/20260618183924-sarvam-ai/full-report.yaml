  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Strategic premium exists, but public proof still lags the price
        blocks:
          - type: paragraph
            body: >-
              Sarvam’s current price support is real, but it is unusually strategic in character. The June 2026 round
              gives the company a $1.5 billion post-money valuation, a $234 million first close, and a highly visible
              lead investor in HCLTech. That matters because HCLTech is not describing the position as a passive venture
              mark; it is explicitly connecting the investment to sovereign-AI solutions for government and enterprise
              buyers. IndiaAI adds a second premium layer by selecting Sarvam for the sovereign-LLM effort and by
              expanding subsidized national compute infrastructure. In other words, the round price is not just a bet on
              model quality; it is a bet that Sarvam becomes an execution layer for Indian regulated AI workloads. The
              problem is that public valuation support remains much thinner than the strategic story. The BSE filing
              gives only one material revenue datapoint, and the broader source set still lacks public disclosure on
              ARR, gross margin, burn, retention, and cap-table preferences. At the current price, the market is
              therefore underwriting option value ahead of full operating proof.
            claimRefs:
