              effort as a major domestic capability milestone, while others question whether public funding of a
              non-open-source sovereign model, self-reported benchmark claims, and earlier dependence on Mistral-based
              Sarvam-M justify the scale of capital and policy support. For diligence, Sarvam already looks
              strategically important; what remains unclear is how much of that importance converts into durable
              economics and verifiable performance leadership.
