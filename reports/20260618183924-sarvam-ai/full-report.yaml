      - number: '5.5'
        title: Technical limitations and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The largest product-tech risk is not a lack of ambition; it is the gap between the breadth of Sarvam's
              claims and the amount of independent proof available for each layer. On the model side, Forbes' critique
              is directionally important because it distinguishes between shipping technically credible open weights and
              proving benchmark superiority in a third-party ecosystem. On the tooling side, the open-weight deployment
              path still shows some rough edges, especially around vLLM support and the operational sophistication
              needed to reproduce Sarvam's preferred serving stack. On the application side, public evidence is
              strongest for speech APIs and at least one named Arya deployment, but thinner for Edge production
              references, Akshar accuracy benchmarks, and detailed security or uptime artifacts that would help
              underwrite enterprise-scale adoption.


              These gaps do not negate the quality of the stack. In fact, the opposite is true: Sarvam now looks
              credible enough that proof gaps matter more than they would for a purely speculative startup. The right
              diligence posture is therefore targeted rather than dismissive. Ask for independent evaluation outputs on
              the sovereign LLMs, named GA customers for Edge and Akshar, detailed pricing or packaging for workflow
              products, and the NDA-gated security artifacts behind the Trust Center. If those materials hold up, Sarvam
              may have one of the most defensible India-first AI product portfolios in market. If they do not, then the
              main risk is not product absence but overextension across too many technically demanding surfaces at once.
            claimRefs:
