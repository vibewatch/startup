  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Sarvam competes in a broader field than a simple "Indian LLM startup" label suggests. For a regulated
              Indian buyer, the credible alternatives span five buckets: domestic full-stack peers such as Krutrim;
              deployed workflow vendors such as CoRover/BharatGPT; open benchmark and model ecosystems led by AI4Bharat;
              public-good initiatives such as BharatGen and Bhashini; and global hyperscalers that let enterprises
              assemble their own stacks from cloud AI components. The important takeaway is that buyers are not choosing
              only among frontier models. They are choosing among packaged deployment models, hosting guarantees,
              integration depth, and government trust signals.


              Sarvam's public positioning is strongest where the procurement problem is "Indic AI plus controlled
              deployment". Its homepage and sovereign-model announcement emphasize speech, translation, agent workflows,
              private-cloud or on-prem rollouts, air-gapped options, and data-residency controls. That makes Sarvam look
              less like a pure model lab and more like an execution layer for population-scale or regulated workloads.
              By contrast, Krutrim leads with domestic compute and developer infrastructure, CoRover leads with
              already-deployed enterprise and government conversational surfaces, and AI4Bharat/BharatGen influence the
              market by expanding the amount of open Indic-language capability available to everyone.
            claimRefs:
