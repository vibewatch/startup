  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Sarvam should not be analyzed as if it sells into the whole India AI market. Its own product and pricing
              surfaces show a narrower commercial layer: speech-to-text, text-to-speech, translation, conversational
              agents, document digitisation, and model access that are optimized for Indian languages and regulated
              deployments. That matters because the real substitute set is not only other AI startups. It also includes
              global hyperscaler APIs, open-source models, in-house developer stacks, and traditional call-center or
              document-processing workflows. Sarvam's wedge gets stronger when a buyer needs code-mixed speech accuracy,
              India-only processing, audit trails, air-gapped or on-prem deployment, and workflow-level support. It gets
              weaker when a buyer only needs a cheap generic text API. The market boundary is therefore best defined as
              sovereign and multilingual AI infrastructure plus applications for regulated, citizen-facing, or
              high-volume Indian workflows, not as the full universe of enterprise software or frontier-model spending.
