            body: >-
              The financial debate is therefore less about whether Sarvam has momentum and more about whether
              sovereign-AI economics can be financed faster than they are commoditized. Multiple independent sources
              stress that training and serving large models requires expensive GPU infrastructure, continuous
              performance improvement, and cost control at inference. They also argue that India's full-stack
              sovereignty remains incomplete because the ecosystem still depends on foreign GPUs, cloud layers, and
              research infrastructure, even as public programs discount access to tens of thousands of GPUs. That
              matters because HCLTech's check reduces near-term capital pressure, but it does not remove the need for
              ongoing financing if Sarvam wants to keep building larger models, win enterprise deployments, and defend
              against global frontier and open-source alternatives. The underwriting verdict is positive on strategic
              relevance and demand creation, but cautious on revenue quality and capital efficiency: Sarvam looks
              financeable as a sovereign-AI infrastructure play, not yet underwritten as a self-evidently efficient
              software business. Any next round should be gated by evidence on realized pricing, margin by workload, and
