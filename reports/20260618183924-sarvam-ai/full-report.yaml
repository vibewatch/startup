      - number: '8.4'
        title: 'Recommendation: structured only at $1.5B, with explicit diligence gates'
        blocks:
          - type: paragraph
            body: >-
              The right stance is not to deny Sarvam’s strategic relevance; it is to separate company quality from price
              discipline. Sarvam may yet prove to be one of the most important Indian AI assets because it combines
              national-priority positioning, model ambition, and a plausible distribution partner. But the current
              public package still asks investors to underwrite too much before seeing contract-level economics,
              cap-table reality, and independent proof on flagship model claims. That makes the cleanest recommendation
              structured only or research more at the current $1.5 billion headline price. In practical terms, an
              investor should want hard disclosure on ARR mix, gross margin by workload, the liquidation stack, and
              HCL-originated conversion before treating this as a standard growth-equity entry. The likely exit path
              also remains strategic or secondary rather than near-term IPO. If Sarvam clears even a subset of those
              diligence gates, the bull case becomes much easier to defend; if it does not, the current round price
              risks aging poorly.
