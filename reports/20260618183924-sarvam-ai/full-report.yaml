        title: Product portfolio and open-vs-enterprise packaging
        blocks:
          - type: paragraph
            body: >-
              Sarvam's public product surface is much broader than a single model release. The company now exposes an
              explicit ladder from open-weight models to managed APIs to workflow software and device deployment. On the
              open side, the models catalog and the 30B/105B release show downloadable sovereign model weights, plus
              open-weight translation and reasoning assets. On the commercial side, the portfolio fans out into Arya for
              agentic enterprise workflows, Akshar for document digitisation, Studio for multilingual dubbing and
              document translation, and Edge for OEM or offline device deployment. This packaging matters because Sarvam
              is trying to monetize not only model access but also orchestration, workflow integration, and distribution
              into regulated or bandwidth-constrained Indian use cases.


              The packaging split is also visible in how products are sold. The docs, SDKs, cookbook, and public API
              pages are clearly designed for self-serve experimentation, while most enterprise surfaces push the user
              toward demo, contact-us, or sales-led entry points. That is consistent with a company selling higher-touch
              integration, especially where deployment includes air-gapped workflows, enterprise data, or OEM hardware
              validation. Independent reporting does show that at least one named production deployment exists for Arya
              and Samvaad through SBI Life, but public pricing remains thin for the higher-value workflow products. That
              means Sarvam already looks more like a full-stack product company than a pure model lab, but investors
              still need direct pricing, reference architecture, and customer diligence to understand conversion
              economics product by product.
