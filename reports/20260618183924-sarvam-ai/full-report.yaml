      - number: '3.4'
        title: Moat Durability, Lock-In, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              The most durable part of Sarvam's moat is not obviously model exclusivity. Public evidence points instead
              to deployment credibility: air-gapped and on-prem options, compliance and audit controls, forward-deployed
              implementation support, named institutions such as UIDAI and NITI Aayog, and the IndiaAI sovereign-model
              mandate. Those signals matter in Indian public-sector and regulated-enterprise buying because they reduce
              procurement risk. They are harder to replicate quickly than a model API endpoint, especially when the
              buyer cares about data residency, traceability, and local-language behavior.


              The risk is that multiple rivals chip away at different parts of that moat at once. Krutrim can attack the
              infrastructure and developer layer; CoRover can attack the distribution and workflow layer; public
              initiatives can reduce exclusivity by publishing models and benchmarks through IndiaAI and AIKosh; and
              hyperscalers can continue improving underlying translation, speech, and general-purpose model services.
              Public pricing opacity makes the battle even harder to judge externally, because buyers may be making
              total-cost-of-ownership decisions that are not visible in list prices. The near-term conclusion is that
              Sarvam's advantage is strongest where a buyer wants one accountable Indian-language platform that can ship
              securely into production. Its weakness is that sophisticated buyers can still multi-home, swap models, or
              assemble alternatives if Sarvam's execution premium is not large enough.
