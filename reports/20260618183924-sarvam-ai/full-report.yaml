  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: The investment score is strongest on strategic positioning and weakest on public economic proof.
    data:
      items:
        - label: Strategic channel quality
          value: 4 / 5
          detail: HCLTech and IndiaAI create unusually strong sovereign-distribution support for an Indian AI startup.
        - label: Product / sovereignty narrative
          value: 4 / 5
          detail: Sarvam has a real full-stack and sovereign story, especially for regulated buyers.
        - label: Public revenue proof
          value: 1 / 5
          detail: Only one turnover datapoint is public and no public margin stack exists.
        - label: Comparable support
          value: 3 / 5
          detail: Private LLM comps justify premium narratives, but public AI software comps argue for discipline.
        - label: Execution / validation risk
          value: 2 / 5
          detail: Independent benchmark validation and cap-table clarity are both still missing.
        - label: Exit readiness
          value: 2 / 5
          detail: Near-term IPO readiness is weak; strategic or structured liquidity paths look more realistic.
