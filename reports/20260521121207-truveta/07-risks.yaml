  claims:
    - id: CR001
      statement: >-
        The HHS OCR de-identification guidance explicitly acknowledges that HIPAA Safe Harbor's
        18-identifier removal provides no specific protection for genetic data and that genomic data
        re-identification risk must be separately assessed; legal scholars at Harvard's Petrie-Flom
        Center published in January 2026 that genomic data combined with healthcare records creates
        re-identification risks that current HIPAA de-identification standards cannot adequately address.
      type: third-party-reported
      topic: "HIPAA genomic de-identification risk"
      sourceRefs: [SR014, SR004]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR001, QR002]
    - id: CR002
      statement: >-
        The FTC's March 2026 healthcare enforcement review documents its first-ever enforcement action
        against a genetic data company in 2025, an intensifying pattern of FTC actions against
        health-data platforms including the BetterHelp $7.8 million settlement in 2023, and ongoing
        FTC investigations into data-broker platforms handling health data.
      type: third-party-reported
      topic: "FTC health data enforcement"
      sourceRefs: [SR002, SR007]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR003]
    - id: CR003
      statement: >-
        At least eight states introduced new genetic-privacy bills in early 2026, with at least three
        requiring explicit consumer consent for secondary commercial use of genomic data, creating
        potential compliance conflicts with Truveta's health system consent architecture.
      type: third-party-reported
      topic: "state genetic privacy legislation"
      sourceRefs: [SR003, SR004]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR004, QR025]
    - id: CR004
      statement: >-
