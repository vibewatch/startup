        The AccountableHQ analysis of whole-genome sequencing privacy confirms that WGS data is
        inherently re-identifiable and that even standard de-identification cannot fully protect
        genomic privacy due to the uniqueness of each individual's genome, a direct limitation
        of Truveta's de-identification standard for the Genome Project.
      type: third-party-reported
      topic: "WGS re-identification risk"
      sourceRefs: [SR006, SR004]
