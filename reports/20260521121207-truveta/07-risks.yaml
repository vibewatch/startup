        data-sharing arrangements with technology partners — directly applicable to Truveta's Microsoft
        Azure architecture — as key OCR enforcement focus areas for 2026.
      type: third-party-reported
      topic: "OCR business associate enforcement"
      sourceRefs: [SR001, SR014]
      confidence: high
      freshness: current
      answersQuestionRefs: [QR005]
    - id: CR005
