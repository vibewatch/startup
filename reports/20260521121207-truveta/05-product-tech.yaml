chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Truveta operates a four-layer platform—Truveta Data (130M+ de-identified EHR records from 30 health
    systems), the Truveta Language Model (TLM, a proprietary clinical LLM achieving >90% NLP accuracy),
    Truveta Studio/Evidence (the regulatory-grade analytics workspace), and Truveta Intelligence (an AI
    natural-language query layer launched April 2026). The platform converts raw, heterogeneous EHR data
    into research-usable evidence through a multi-stage de-identification pipeline (HIPAA Expert
    Determination, k-anonymity, AI redaction, watermarking) and TLM normalization to standard medical
    ontologies. HITRUST r2, SOC 2 Type 2, ISO 27001/27701/27018 certifications affirm the compliance
    posture. The Truveta Genome Project—targeting 10 million consented exomes via the Regeneron Genetics
    Center on Microsoft Azure—extends the technical moat into linked genotypic-phenotypic data, though it
    remains pre-commercial as of May 2026. Key limitations include causal-inference boundaries on all
    outputs, subscriber-only access with no public API, single-cloud dependency on Azure, and company-
    asserted (not independently peer-reviewed) TLM accuracy benchmarks.

sections:
  - id: "platform-portfolio"
    title: "Platform Portfolio and Data Architecture"
    body: >-
      Truveta operates a tightly integrated four-layer product platform built entirely on Microsoft Azure.
      At the foundation is Truveta Data: a continuously updated, de-identified dataset covering more than
      130 million patients from 30 US health systems, representing 18% of daily clinical care nationwide
      across 800-plus hospitals and 20,000 clinics in all 50 states. Truveta Data is distinguished by its
      direct EHR provenance (no claims normalization bias), daily refresh cadence, and linkage to closed
      claims for more than 200 million patients across 100-plus payers, 45 SDOH attributes per patient via
      LexisNexis Risk Solutions, mortality data, pharmacy dispensing data via Surescripts, and—since March
      2025—administrative ADT and billing data. Underlying the dataset is the Truveta Language Model
      (TLM), the proprietary clinical large-language AI model that normalizes billions of daily EHR data
      points into a unified Truveta Data Model (TDM) using standard medical ontologies including SNOMED CT,
      LOINC, RxNorm, ICD-10, CPT, HCPCS, CVX, NDC, and UDI. Atop Truveta Data sits Truveta Studio,
      the cloud-hosted analytics environment, which contains Truveta Evidence, the regulatory-grade
      sub-layer providing audit-ready workflows aligned with FDA real-world evidence guidance. Finally,
      Truveta Intelligence, launched April 28, 2026, provides a natural language AI query interface that
      enables subscribers to generate real-time insights from the full patient corpus in minutes. Together
      these four components define the Truveta product surface: one governed de-identified dataset, one
      clinical AI normalization engine, one regulatory-grade analytics workspace, and one AI insight layer.
      All products are subscriber-only; no public API, self-service trial, or open-access research tier
      exists. The Truveta Genome Project is a fifth layer in early build-out, targeting 10 million linked
      genotypic-phenotypic records.
