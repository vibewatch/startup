  claims:
    - id: CE001
      statement: >-
        Truveta's platform stack as of May 2026 consists of four interconnected products: Truveta Data
        (de-identified EHR dataset, 130M patients), the Truveta Language Model (clinical AI normalization
        engine), Truveta Studio/Evidence (regulatory-grade analytics workspace), and Truveta Intelligence
        (AI natural-language query layer, launched April 2026).
      type: company-claimed
      topic: "product portfolio"
      sourceRefs: [SE001, SE002, SE009, SE010, SE011]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001]

    - id: CE002
      statement: >-
        Truveta Data covers more than 130 million patients from 30 US health systems as of May 2026,
        representing 18% of daily clinical care across 800-plus hospitals and 20,000 clinics in all
        50 US states.
      type: company-claimed
      topic: "data scale"
      sourceRefs: [SE001, SE012, SE018, SE023]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001]

    - id: CE003
      statement: >-
        The Truveta Language Model (TLM) achieves above 90% accuracy on diagnoses, medications, lab
        results, lab values, and clinical observations, outperforming GPT-4 and ontology-mapping tools
        LogMap and AML on clinical data extraction benchmarks.
      type: company-claimed
      topic: "TLM accuracy"
      sourceRefs: [SE003, SE004, SE025, SE026]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE003, QE022]

    - id: CE004
      statement: >-
        TLM is a large-language, multi-modal AI model trained on complete medical records from more
        than 100 million patients, including 5.5 billion diagnoses, 3.1 billion clinical encounters,
        and 2.4 billion medication orders; it combines pre-trained open LLMs with deep training on
        de-identified healthcare data.
      type: company-claimed
      topic: "TLM training scale"
      sourceRefs: [SE004, SE015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE022]

    - id: CE005
      statement: >-
        Truveta Data contains more than 7 billion clinical notes as of mid-2026, including progress
        notes, nursing evaluations, procedure/operative reports, referral notes, and discharge summaries,
        with TLM extracting structured clinical concepts from all note types at scale.
      type: company-claimed
      topic: "clinical notes scale"
      sourceRefs: [SE003, SE023]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE012]

    - id: CE006
      statement: >-
        TLM normalizes all raw EHR data to the Truveta Data Model (TDM) using standard medical ontologies
        including SNOMED CT, RxNorm, LOINC, UCUM, ICD-10, CPT, HCPCS, CVX, NDC, and UDI, mapping
        disparate coding systems into a unified research-ready schema.
      type: observed
      topic: "TLM ontology mapping"
      sourceRefs: [SE003, SE026, SE001]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE002, QE009]

    - id: CE007
      statement: >-
        Truveta uses the HIPAA Expert Determination method (45 CFR 164.514(b)(1)) for de-identification,
        working with qualified statistical experts in compliance with HHS OCR standards, enabling greater
        data richness than the Safe Harbor method while maintaining formally documented very-small
        re-identification risk.
      type: observed
      topic: "de-identification method"
      sourceRefs: [SE006, SE007, SE029]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE004]

    - id: CE008
      statement: >-
        Truveta's de-identification pipeline operates in four stages: (1) AI-based PHI redaction in a
        controlled PHI zone for structured data, notes, and images; (2) k-anonymity across all 30 health
        systems simultaneously; (3) structured data de-identification of dates, geographic data, and
        regulated fields; and (4) watermarking and fingerprinting of all exported de-identified snapshots.
      type: company-claimed
      topic: "de-identification pipeline"
      sourceRefs: [SE006, SE007]
      confidence: high
      freshness: current
