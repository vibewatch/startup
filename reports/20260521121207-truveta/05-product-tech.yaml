  - id: "truveta-language-model"
    title: "Truveta Language Model — Clinical NLP and Data Normalization"
    body: >-
      The Truveta Language Model (TLM) is Truveta's central technical asset and the primary mechanism by
      which raw, heterogeneous EHR data becomes research-usable evidence. TLM is a large-language,
      multi-modal AI model trained on complete medical records from more than 100 million patients,
      including 5.5 billion diagnoses, 3.1 billion clinical encounters, 2.4 billion medication orders,
      and more than 7 billion clinical notes. Unlike general-purpose LLMs trained on public internet text,
      TLM combines pre-trained open large-language models with deep training on de-identified healthcare
      data and clinical-expert annotation of tens of thousands of raw clinical terms, producing accuracy
      exceeding 90% across diagnoses, medications, lab results, lab values, and clinical
      observations—outperforming GPT-4 and ontology-mapping tools such as LogMap and AML on clinical
      extraction tasks. TLM's clinical-expert annotators label raw terms and check model outputs as the
      model runs, creating a human-in-the-loop accuracy pipeline. TLM performs normalization across two
      data categories: semi-structured data (lab tests, diagnoses, procedures, medications, devices) and
      fully unstructured free-text clinical notes. For notes, TLM extracts clinical concepts including
      disease staging, adverse events, medication-rationale changes, and complex treatment relationships
      (e.g., linking an adverse drug reaction across a medication and a subsequent diagnosis) that are
      absent from structured EHR fields and claims data. TLM also detects linguistic modifiers critical
      to clinical research: negation ("patient denies fatigue"), hypotheticals ("will consider starting
      glipizide if A1C still elevated"), and family history references—all mapped to the correct clinical
      context rather than the patient's own record. The Truveta Data Model (TDM) is the internal schema
      into which all TLM-normalized data is mapped. TLM won the 2024 SXSW Innovation Award in AI.
      Limitations include dependency on clinical-expert annotators, ongoing retraining requirements for
      rare codes and specialty-specific terminology, and the absence of independent peer-reviewed benchmark
      validation—all published accuracy figures are company-reported.
