  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "TLM accuracy independent validation"
      missingEvidence: >-
        Independent peer-reviewed benchmark validation of TLM accuracy on clinical concept extraction;
        all published accuracy figures (>90%) are company-reported against company-defined benchmarks.
      whyItMatters: >-
        Without independent validation, claims that TLM outperforms GPT-4 and clinical experts cannot
        be externally verified; this limits the credibility of regulatory-grade evidence claims for
        life-sciences customers seeking to use Truveta Data in FDA submissions.
      diligencePath: >-
        Request peer-reviewed or third-party benchmarking studies; ask for external validation of TLM
        against gold-standard clinical expert annotations from an independent research institution.

    - type: private-evidence-only
      severity: material
      topic: "re-identification risk rate"
      missingEvidence: >-
        Quantitative re-identification risk rate for the de-identified Truveta dataset; no independent
        third-party audit of the Expert Determination process or its outputs has been publicly disclosed.
      whyItMatters: >-
        Regulatory customers and health system partners require confidence that de-identification is
        robust; the absence of a published risk rate makes it impossible for external parties to verify
        HIPAA compliance claims beyond the existence of Expert Determination procedures.
      diligencePath: >-
        Request a summary of re-identification risk documentation from the most recent Expert
        Determination assessment; ask whether an independent statistical auditor has reviewed the
        k-anonymity equivalence class sizes and suppression rates.
      relatedQuestionRefs: [QE017]

    - type: private-evidence-only
      severity: material
      topic: "Genome Project sequencing milestones and commercial timeline"
      missingEvidence: >-
        No public disclosure of Genome Project sequencing progress (e.g., exomes completed), milestone
        targets, commercial data-access launch timeline, or pricing for the genomic data tier as of
        May 2026.
      whyItMatters: >-
        The Genome Project is the primary long-term differentiation narrative; without milestones or a
        commercial timeline, it is impossible to assess when—or whether—linked genomic data will become
        a revenue-generating product.
      diligencePath: >-
        Request sequencing throughput data from RGC, consent enrollment rates across health systems,
        projected completion dates for first 1M and 10M exomes, and commercial pricing framework for
        genomic data access.

    - type: private-evidence-only
      severity: blocking
      topic: "public developer API or programmatic data access interface"
      missingEvidence: >-
        No evidence of a public REST API, SDK, or self-service data access mechanism for external
        developers or researchers outside the Truveta Studio subscriber environment.
      whyItMatters: >-
        The absence of a developer API limits Truveta's addressable market to organizations able to
        negotiate enterprise subscription agreements; developer community adoption (a proxy for ecosystem
        moat) cannot be independently measured, and no developer-signal data is available from GitHub,
        Stack Overflow, or HuggingFace. Note: for a regulated healthcare data company, the absence of
        a public API is consistent with HIPAA obligations and not necessarily a commercial weakness.
      diligencePath: >-
        Ask Truveta whether a programmatic data access API, federated query interface, or partner
        developer sandbox exists or is on roadmap; monitor Azure Marketplace for new SKU additions.
      relatedQuestionRefs: [QE024]

