  - id: "FE003"
    title: "Truveta Critical Dependency Map"
    type: dag
    layout: wide
    insight: >-
      Microsoft Azure and the Regeneron Genetics Center are the two highest-criticality external
      dependencies. Azure disruption would halt all platform operations; RGC disruption would freeze
      the entire Genome Project. LexisNexis and Surescripts are high-criticality data enrichment
      dependencies. Member health system data governance is the ultimate foundation—withdrawal of
      multiple members would erode the dataset's representativeness.
