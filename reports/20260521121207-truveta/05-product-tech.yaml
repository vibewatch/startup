callouts:
  - calloutType: "strength"
    title: "TLM is the core IP moat: clinical NLP outperforming GPT-4 on medical extraction"
    body: >-
      TLM's above-90% accuracy on clinical concept extraction from unstructured notes—validated against
      human clinical expert reviewers and outperforming GPT-4 on medical domain tasks—is the hardest
      element of Truveta's stack to replicate. Training requires billions of de-identified clinical
      records, clinical-expert annotator pipelines, and years of iteration. No competitor currently
      combines provider-governed EHR scale with equivalent clinical NLP depth.
    claimRefs:
      - CE003
      - CE004
      - CE035
      - CE039

  - calloutType: "risk"
    title: "Single-cloud and single-sequencing-partner dependencies create concentration risk"
    body: >-
      Truveta's exclusive reliance on Microsoft Azure for all data storage, AI compute, and Genome Project
      infrastructure creates a high-switching-cost single-cloud dependency. Separately, the Regeneron
      Genetics Center is the sole sequencing partner for the 10M-exome Genome Project—a sequencing
      throughput concentration risk with no disclosed backup. Any disruption to either partnership would
      materially impair platform operations or the genomics product roadmap.
    claimRefs:
      - CE016
      - CE023
      - CE018

  - calloutType: "risk"
    title: "All platform outputs disclaim causal inference; observational design limits regulatory use"
    body: >-
      Truveta Intelligence and all platform outputs explicitly do not establish causality and do not replace
      clinical judgment. Observational EHR studies remain subject to confounding, selection bias, missing
      data, and documentation variability across health systems. FDA has not formally pre-authorized or
      validated Truveta Data for regulatory submissions; Truveta's alignment with FDA RWE guidance is
      self-asserted. Regulatory customers must conduct independent validation before relying on Truveta
      outputs in submissions.
    claimRefs:
      - CE015
      - CE027
      - CE032
      - CE040

