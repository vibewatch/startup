callouts:
  - calloutType: "strength"
    title: "CDC contract confirms regulatory-grade revenue legitimacy"
    body: >-
      The $10.3 million CDC contract is the only publicly verifiable, third-party-confirmed revenue contract
      for Truveta. Its award via a competitive process with five bidders confirms that Truveta's data quality
      and compliance posture were independently evaluated, providing a signal of product legitimacy that
      supports the commercial pharma pricing claim.
    claimRefs:
      - CI001
      - CI019
  - calloutType: "risk"
    title: "Financial opacity blocks independent underwriting"
    body: >-
      No ARR, burn, gross margin, NRR, or customer concentration data are publicly available for Truveta as
      of May 2026. The company's financial opacity is typical for a private unicorn but constitutes a material
      diligence blocker. Investors and strategic partners cannot assess revenue quality or capital adequacy
      without non-public data room access.
    claimRefs:
      - CI014
      - CI025
      - CI042
  - calloutType: "risk"
    title: "Genome Project capital intensity could strain runway"
    body: >-
      The $320 million Series C is primarily allocated to Genome Project infrastructure. With 10 million exomes
      to sequence at $50–200 per exome and an ongoing Azure cloud and staffing cost structure, the capital
      intensity is high. If commercial revenue growth does not accelerate materially, the company will need
      additional financing before reaching operational cash flow breakeven.
    claimRefs:
      - CI016
      - CI017
      - CI023
      - CI039
  - calloutType: "risk"
    title: "Government revenue is fragile under policy volatility"
    body: >-
      The DOGE-related partial termination of the CDC contract in 2025, leaving only $120,000 of backlog,
      illustrates that federal revenue—while commercially validating—is operationally unreliable under
      shifting US executive branch priorities.
    claimRefs:
      - CI002
      - CI020
      - CI030

