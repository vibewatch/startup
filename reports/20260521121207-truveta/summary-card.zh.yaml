    - 去标识化 EHR 商业化一旦扩展到基因组数据和对同意更敏感的工作流，隐私与监管暴露会上升。
    - Genome Project 的经济性可能需要远超披露水平的资本，并取决于伙伴执行、成员稳定性和公众信任。
  unresolvedGaps:
