  topStrengths:
    - 由医疗服务方治理的 30 家系统网络，覆盖 130M+ 患者并每日刷新，拼出难以复制的临床数据护城河。
    - Genome Project 叠加 Regeneron、Illumina 和 Azure 支持，把 Truveta 从 EHR 证据延伸到关联基因组智能。
    - 具名药企、公共卫生和学术用户验证了创始医疗系统之外的需求。
  topRisks:
