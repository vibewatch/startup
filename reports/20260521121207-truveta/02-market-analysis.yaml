callouts:
  - calloutType: insight
    title: FDA 2026 Guidance Creates Structural Demand Catalyst
    body: >
      The January and March 2026 FDA guidance updates represent the single most important near-term demand
      driver for Truveta. The de-identified data pathway for medical devices and the ICH M14 adoption for
      drugs together validate the regulatory legitimacy of EHR-linked, de-identified RWD platforms — the
      exact product type Truveta offers. Pharma teams that previously could not justify RWE platform spend
      now face a regulatory incentive to standardise on credentialed platforms before their next NDA or
      label-expansion submission.
    claimRefs:
      - CM020
      - CM021
      - CM022

  - calloutType: risk
    title: Analyst TAM Divergence Signals Unresolved Market Boundary Risk
    body: >
      RWE market estimates from five reputable analyst firms diverge by more than 4× for the same year
      (2026: $2.7B to $5.4B, depending on scope). This is not random noise but a systematic disagreement
      about whether the market includes data assets, analytics services, or both. If the narrower
      definition prevails, Truveta's TAM is closer to $3B than to $10B+, and penetration assumptions
      must be re-calibrated. Truveta's investors and management should not use any single analyst number
      without clarifying scope alignment.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM036

  - calloutType: risk
    title: Incumbent Competition and Procurement Barriers Cap Near-Term SAM Capture
    body: >
      IQVIA, Optum, Oracle, and Flatiron hold long-standing relationships with the largest pharma buyers,
      creating high switching costs even when Truveta's dataset is technically superior. Combined with
      12–24 month health-system procurement cycles, MFN-driven pharma budget compression, and the
      heightened compliance burden of ICH M14, Truveta's near-term SAM penetration may be significantly
      below the aggregate RWE market growth rate.
    claimRefs:
      - CM031
      - CM033
      - CM034
      - CM028

