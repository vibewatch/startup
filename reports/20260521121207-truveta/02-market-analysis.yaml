  - id: growth-drivers
    title: Growth Drivers
    body: >
      Six reinforcing forces are accelerating Truveta's addressable market in 2026. First, the FDA's
      January 2026 updated RWE framework explicitly positions real-world evidence alongside traditional
      clinical trial data for regulatory submissions, label expansions, and post-market surveillance. The
      companion March 2026 adoption of ICH M14 sets explicit standards for non-interventional pharmacoepidemiological
      studies, raising the methodological bar and creating demand for platforms with credentialled data
      lineage—precisely Truveta's product position. Second, the FDA's single-trial standard now allows one
      adequately designed study supported by confirmatory RWE to serve as the basis for drug approval,
      potentially halving late-stage trial spend and creating powerful substitution demand for RWE platforms.
      Third, AI adoption in healthcare hit 85% of organisations by end 2024 and the AI-in-healthcare market
      is projected to compound at 38.6% annually to $110.61 billion by 2030; Truveta Intelligence directly
      monetises this AI demand by wrapping real-time RWD queries in a generative-AI interface. Fourth, the
      globalisation of evidence standards—particularly the EU's Joint Clinical Assessment requiring a single
      clinical dossier across member states as of January 2025—raises the evidentiary bar and incentivises
      access to large, representative real-world patient cohorts. Fifth, biopharma dealmaking is accelerating
      in 2026 with a strong emphasis on data-linked assets and pipeline quality, per PwC's 2026 deals
      outlook, which increases both acquirer interest in RWE-capable platforms and the demand for portfolio
      rationalisation using RWD analytics. Sixth, the Truveta Genome Project, with $320 million in funding
      from Regeneron, Illumina, and seventeen health systems, targets the clinical genomics adjacency
      ($13.93 billion in 2026) by pairing EHR data with exome sequences—a differentiator that incumbents
      cannot replicate without comparable health-system networks.
    claimRefs:
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
    tableRefs:
      - TM004

  - id: constraints
    title: Adoption Constraints and Adverse Evidence
    body: >
      Truveta faces several structural headwinds that could limit or delay market penetration. Data-quality
      and methodological standards have risen sharply: the FDA's March 2026 ICH M14 adoption means that an
      EHR export alone is no longer sufficient as regulatory evidence—pre-specified study protocols, data
      provenance documentation, and statistical analysis plans reviewed by FDA before study initiation are
      now required. This raises compliance cost for buyers, potentially extending sales cycles and limiting
      buyers to larger, better-resourced pharma teams. Privacy regulation is intensifying globally: more than
      80% of the world's population is now covered by some form of privacy regulation, and data-localisation
      requirements in China and parts of the EU complicate cross-border RWD flows. Healthcare data breaches
      cost an average of $7.42 million per incident in 2025, raising sensitivity around sharing de-identified
      records. The STAT News critique highlighted by bioethicists that health data companies profit from
      patient records without explicit consent creates reputational risk and could trigger future legislative
      restrictions. Incumbent competition is intense: IQVIA, Optum (UnitedHealth), Oracle Health, Flatiron
      (Roche), and Tempus collectively hold large customer relationships, data licenses, and regulatory
      track records. Procurement cycle length in health systems is typically 12–24 months due to security
      review, legal, and IT governance processes. Finally, most-favoured-nation drug pricing under executive
      order implementation in 2025–2026 compresses pharma R&D budgets, potentially deferring discretionary
      RWE platform spend. Analyst estimates for market size diverge by over 4× depending on scope, raising
      the risk that Truveta investors price in an overly optimistic TAM.
    claimRefs:
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034

