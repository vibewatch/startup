      whyItMatters: "A dated customer count is not enough to underwrite revenue durability, enterprise penetration, or concentration risk."
      diligencePath: "Request current ARR bridge by segment, logo list, top-10 customer share, and last-twelve-month net-new logo data."
      relatedQuestionRefs: [QO021]
      relatedTableRefs: [TO001]
    - type: "private-evidence-only"
      severity: "material"
      topic: "headcount"
      missingEvidence: "Precise current employee count and hiring plan by product, commercial, operations, science, and compliance functions."
      whyItMatters: "Headcount is a proxy for burn, execution capacity, and operating leverage in a private data-platform business."
      diligencePath: "Request HRIS export or latest board headcount deck with function-level breakdown and twelve-month trend."
