      whyItMatters: "Lifetime capital and preference stack affect dilution, runway, and the credibility of any valuation discussion."
      diligencePath: "Request the cap table, round-by-round closing memo, and any debt or secondary summary from management."
      relatedQuestionRefs: [QO014]
      relatedTableRefs: [TO001, TO003]
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-count"
