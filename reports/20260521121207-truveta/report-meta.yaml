      background: "Physician-executive who bridges clinical research, product development, and life-sciences partnerships."
      claimRefs: [CO010]
  foundingLocation: "Bellevue / Providence-led Seattle region"
  headquarters: "Bellevue, WA"
  productSummary: >-
    Truveta combines Truveta Data, the Truveta Language Model, Truveta Studio/Evidence, and Truveta Intelligence to turn de-identified EHR, claims, notes, and emerging genomic data into regulatory-grade evidence and real-time analytics for enterprise buyers.
  customerFocus: "Pharma and biotech, health systems, public health agencies, academic researchers, and medical-device manufacturers"
  businessModel: "Enterprise subscription access to de-identified clinical/genomic data, evidence-generation tools, and AI intelligence, with member health systems sharing in commercialization economics."
