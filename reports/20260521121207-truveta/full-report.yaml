      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Buyer Lock-In
        blocks:
          - type: paragraph
            body: >-
              Pharma RWD procurement in 2026 is characterized by deliberate multi-homing: buyers maintain relationships
              with two to four vendors to hedge against data coverage gaps, therapeutic area specialization needs, and
              regulatory requirement changes. ZS Associates' benchmarking confirms that while most large pharma have a
              clear RWD and RWE platform vision, they continue to source from multiple vendors. This behavior limits
              Truveta's ability to be a sole-source vendor and means that multi-homing with IQVIA (for global claims),
              Flatiron or Tempus (for deep oncology curation), and Truveta (for multi-condition EHR breadth) is a
              rational procurement strategy. Switching costs do exist but operate differently from traditional software
              lock-in. Scientific switching costs arise when a pharma team has published peer-reviewed studies or
              submitted regulatory dossiers using a specific platform's data model and methodology: re-running those
              studies on a new platform requires re-validation, regulatory re-review, and methodological justification
              that can take 12–24 months and significant budget. Contractual switching costs are moderate: ZS data shows
              a shift toward three-to-five year strategic data platform partnerships from older one-off purchase models.
              Truveta's provider governance creates a trust-based switching cost specific to its model: pharma teams who
              rely on Truveta's provider-certified de-identification for regulatory submissions have a credibility
              incentive to remain on the platform for replication and longitudinal extension studies. The ADVI 2026
              analysis finds that RWE is now embedded in Medicare reimbursement decision logic, creating recurring
              evidence refresh mandates that reinforce ongoing platform relationships rather than one-time purchases.
              Multi-homing does reduce Truveta's potential revenue per pharma customer, but the platform's
              differentiated EHR provenance means it is unlikely to be displaced entirely by any single
              competitor—instead it competes for share of wallet within multi-vendor portfolios.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Displacement Signals
        blocks:
          - type: paragraph
            body: >-
              Truveta's moat rests on three reinforcing structural advantages: (1) direct co-ownership and governance by
              30+ US health systems, creating data-access and ethical-provenance attributes that commercial
              intermediaries cannot replicate without re-building provider relationships from scratch; (2) a nationally
              representative de-identified EHR asset covering 130 million+ patients across all care settings with daily
              refresh; and (3) the Genome Project, which links biospecimen- derived genomic data from Regeneron
              sequencing and Illumina infrastructure to the clinical record— an asset no pure RWD vendor currently
              offers at national scale. The primary structural threat to this moat is IQVIA's distribution: 93,000
              employees, multi-year enterprise agreements, and integrated CRO services mean that mid-market and
              large-pharma commercial teams default to IQVIA unless a buyer explicitly differentiates on data
              provenance. Tempus AI's 36% revenue growth (Q1 2026) and active partnerships with Merck, Gilead, and
              AstraZeneca show that a well-funded multimodal oncology data platform can win pharma wallet share at
              speed. Commoditization risk is elevated for claims-focused pure-play vendors (Komodo, HealthVerity) as
              FHIR interoperability mandates and AI-powered de-identification lower the marginal cost of building EHR
              data feeds, but provider governance—the specific claim Truveta makes—is not replicable by standard API
              integration. The Roche-Flatiron divestiture signal is adverse evidence for the pharma-owned- platform
              thesis in general; independent operators with explicit provider co-governance appear structurally better
              positioned for broad pharma partnership than parent-pharma subsidiaries. Truveta's US-only coverage
              remains an adverse structural gap for multinational pharma buyers who need EU or APAC cohorts in their
              global regulatory filings. Internal build at large pharma (Roche, AstraZeneca, Novartis in-house RWE
              teams) and federated alternatives like TriNetX provide cost-effective status-quo options for buyers with
              strong data-science capabilities. Big-tech latent entrants (Microsoft, Google, Amazon) each hold
              health-system cloud partnerships that could be converted into competing data products, though provider
              co-governance as an explicit network structure creates a meaningful barrier.
