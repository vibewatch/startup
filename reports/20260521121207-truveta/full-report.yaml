      - number: '5.6'
        title: Differentiation, Dependencies, and Limitations
        blocks:
          - type: paragraph
            body: >-
              Truveta's differentiation relative to claims-based competitors (IQVIA, Optum, Komodo) and oncology-
              focused platforms (Flatiron, Tempus AI) rests on five pillars: (1) provider-governed, unbiased EHR data
              sourced directly from 30 member health systems, without commercial billing normalization; (2) TLM-driven
              clinical NLP enabling unstructured note extraction unavailable from pure claims or structured EHR
              providers; (3) daily data refresh versus monthly or quarterly updates at competitors; (4) national
              representativeness across all 50 states, specialties, payers, and age groups including pediatric and
              maternal health; and (5) the Genome Project, which is the only known effort to build a
              10-million-participant linked EHR-genomic database within a single research ecosystem. The ISPOR 2024
              conference presentation and adoption by academic institutions including Penn LDI and JHU HBHI document
              practitioner recognition of Truveta's research utility beyond life-sciences commercial use. Key
              dependencies that could materially impair the platform if disrupted include: Microsoft Azure (exclusive
              cloud provider; migration costs are high); Regeneron Genetics Center (sole sequencing partner for 10M
              exomes); Illumina (sequencing technology supply); LexisNexis Risk Solutions (SDOH and mortality data); and
              Surescripts (pharmacy dispensing data). Critical platform limitations are: (1) all Truveta Intelligence
              and Evidence outputs explicitly disclaim causal inference capability—the platform produces associations,
              not causation; (2) the subscriber-only model with no public API or trial tier restricts academic,
              government, and small-team access; (3) data quality and completeness vary across health system EHR
              documentation practices; (4) interoperability with customer internal data requires bespoke integration;
              (5) the Genome Project remains pre-commercial and carries consent logistics, throughput, and regulatory
              complexity risks; and (6) all published TLM accuracy benchmarks are company-reported rather than
              independently peer-reviewed.
