companyProfile:
  summary: >-
    Truveta is a Bellevue, Washington healthcare data company founded in 2020 by a coalition of U.S. health systems and
    led by former Microsoft executive Terry Myerson. It sells enterprise access to de-identified clinical data,
    evidence-generation workflows, and an AI intelligence layer to life sciences, healthcare, public-health, and
    academic users, while extending its moat through the Truveta Genome Project with Regeneron, Illumina, and Microsoft
    Azure. The company's differentiation comes from provider governance, daily-refresh EHR provenance, and linked
    evidence workflows, but underwriting remains constrained by opaque economics and rising privacy sensitivity around
    genomic data commercialization.
