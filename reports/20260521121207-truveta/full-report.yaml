  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    notes: >-
      Observable events or threshold crossings that would cause the investment thesis to break, requiring immediate
      reassessment and likely decline of the investment.
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
      - Current Signal
    rows:
      - - HIPAA / FTC enforcement action
        - Formal investigation or civil monetary penalty citing Truveta's genomic-EHR de-identification
        - Consent architecture reform required; TAM of monetizable data reduced; customer trust damage
        - Immediate decline; thesis permanently impaired
        - None identified; risk elevated by FTC genetic-data precedents in 2025
      - - Member health system departures
        - Two or more member systems withdraw from consortium
        - Data supply gap; revenue loss; cap-table disruption; moat erosion
        - Decline unless exits are small and replaced quickly
        - No withdrawals disclosed; but contractual exit terms not public
      - - Cybersecurity breach
        - Confirmed breach exposing de-identified patient records across multiple health systems
        - BAA liability; OCR investigation; customer trust impairment across all pharma accounts
        - Decline; operational and legal recovery cost could exceed capital raise
        - No incidents disclosed; HITRUST R2 certified but not breach-proof
      - - Genome Project 12-month milestone slip
        - No commercial genomic data contracts signed by January 2027
        - Bull case delayed or eliminated; multi-round dilution becomes likely
        - Reassess; downgrade to base case; require evidence of ramp before investing
        - Genome Project launched April 2025; no commercial milestones disclosed as of May 2026
      - - Revenue below $60M in data room
        - Actual ARR disclosed at less than $60M (below bear-case proxy)
        - Current $1B+ valuation implies >16x ARR; return math breaks for any reasonable exit
        - Decline unless genomics revenue ramp is imminent and credible
        - Proxy is $80M; confidence interval is $60–100M
      - - Down-round or secondary at discount to Series C
        - New financing or secondary transaction below $1B post-money
        - Valuation mark impaired; preference overhang increases; Series C investors' anti-dilution triggers
        - Full reassessment required; likely decline unless event is isolated
        - No down-round signals as of May 2026; 16 months since Series C without financing
