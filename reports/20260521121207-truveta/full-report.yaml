      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >
              Six reinforcing forces are accelerating Truveta's addressable market in 2026. First, the FDA's January
              2026 updated RWE framework explicitly positions real-world evidence alongside traditional clinical trial
              data for regulatory submissions, label expansions, and post-market surveillance. The companion March 2026
              adoption of ICH M14 sets explicit standards for non-interventional pharmacoepidemiological studies,
              raising the methodological bar and creating demand for platforms with credentialled data lineage—precisely
              Truveta's product position. Second, the FDA's single-trial standard now allows one adequately designed
              study supported by confirmatory RWE to serve as the basis for drug approval, potentially halving
              late-stage trial spend and creating powerful substitution demand for RWE platforms. Third, AI adoption in
              healthcare hit 85% of organisations by end 2024 and the AI-in-healthcare market is projected to compound
              at 38.6% annually to $110.61 billion by 2030; Truveta Intelligence directly monetises this AI demand by
              wrapping real-time RWD queries in a generative-AI interface. Fourth, the globalisation of evidence
              standards—particularly the EU's Joint Clinical Assessment requiring a single clinical dossier across
              member states as of January 2025—raises the evidentiary bar and incentivises access to large,
              representative real-world patient cohorts. Fifth, biopharma dealmaking is accelerating in 2026 with a
              strong emphasis on data-linked assets and pipeline quality, per PwC's 2026 deals outlook, which increases
              both acquirer interest in RWE-capable platforms and the demand for portfolio rationalisation using RWD
              analytics. Sixth, the Truveta Genome Project, with $320 million in funding from Regeneron, Illumina, and
              seventeen health systems, targets the clinical genomics adjacency ($13.93 billion in 2026) by pairing EHR
              data with exome sequences—a differentiator that incumbents cannot replicate without comparable
              health-system networks.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
          - type: table
            tableRef: TM004
            claimRefs:
