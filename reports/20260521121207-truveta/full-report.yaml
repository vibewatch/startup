  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Portfolio and Data Architecture
        blocks:
          - type: paragraph
            body: >-
              Truveta operates a tightly integrated four-layer product platform built entirely on Microsoft Azure. At
              the foundation is Truveta Data: a continuously updated, de-identified dataset covering more than 130
              million patients from 30 US health systems, representing 18% of daily clinical care nationwide across
              800-plus hospitals and 20,000 clinics in all 50 states. Truveta Data is distinguished by its direct EHR
              provenance (no claims normalization bias), daily refresh cadence, and linkage to closed claims for more
              than 200 million patients across 100-plus payers, 45 SDOH attributes per patient via LexisNexis Risk
              Solutions, mortality data, pharmacy dispensing data via Surescripts, and—since March 2025—administrative
              ADT and billing data. Underlying the dataset is the Truveta Language Model (TLM), the proprietary clinical
              large-language AI model that normalizes billions of daily EHR data points into a unified Truveta Data
              Model (TDM) using standard medical ontologies including SNOMED CT, LOINC, RxNorm, ICD-10, CPT, HCPCS, CVX,
              NDC, and UDI. Atop Truveta Data sits Truveta Studio, the cloud-hosted analytics environment, which
              contains Truveta Evidence, the regulatory-grade sub-layer providing audit-ready workflows aligned with FDA
              real-world evidence guidance. Finally, Truveta Intelligence, launched April 28, 2026, provides a natural
              language AI query interface that enables subscribers to generate real-time insights from the full patient
              corpus in minutes. Together these four components define the Truveta product surface: one governed
              de-identified dataset, one clinical AI normalization engine, one regulatory-grade analytics workspace, and
