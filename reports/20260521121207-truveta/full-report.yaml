  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Truveta's commercial model is organized around three product pillars—Truveta Data, Truveta
              Studio/Evidence, and Truveta Intelligence—each of which layers incremental access and analytical value on
              top of the same underlying de-identified EHR and genomic dataset. The primary revenue driver is an
              enterprise data subscription, sold directly to life-sciences companies, health systems, and government
              agencies. Named customers include Moderna, UCB, and Boehringer Ingelheim, all of which use Truveta Data
              for real-world research on safety, effectiveness, and disease natural history. As of October 2023, Truveta
              disclosed more than 50 customer organizations, but no updated customer count has been publicly released as
              of May 2026, making concentration risk difficult to assess.

              Pricing is not publicly listed. Analyst intelligence and government contract evidence provide the best
              available proxies: the CDC contract awarded in January 2024 was valued at up to $10.3 million over roughly
              2.5 years for data access and analytical support, implying a roughly $4 million annual rate for a single
              institutional customer. Broader enterprise pharma contracts in the RWD segment are estimated at $500,000
              to $3 million per year depending on scope. Microsoft Azure Marketplace lists Truveta Studio Usage
              Reservation tiers at $95,000, $245,000, and $495,000 per reservation period—these are analytics
              environment usage add-ons that require an active underlying Truveta Data subscription.

              Truveta Intelligence, launched in April 2026, is available to existing Truveta Data subscribers and
              represents a natural language AI layer on top of the existing data product. The company has not disclosed
              a separate list price for Intelligence, indicating it may be included within existing subscriptions or
              charged as an upsell at undisclosed rates. The genomics stream, underpinned by the Truveta Genome Project
              and the Regeneron Genetics Center partnership, is in active build-out as of May 2026 and will introduce
              linked genotypic-phenotypic data access as an additional revenue tier once sequencing milestones are
              reached.

              A structurally distinctive element of the revenue model is provider revenue-sharing: Truveta's health
              system members receive financial reimbursement when commercial customers pay to access de-identified
              patient data. The Series A announcement stated that "earnings health providers receive from Truveta will
              be invested back into the communities they serve." This profit-sharing mechanism distinguishes Truveta's
              model from pure-play commercial data platforms but also creates a cost of revenue obligation toward 30
              member health systems that is not present in a standard SaaS construct.
