      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Truveta's commercial buyers cluster into five well-defined segments, each with distinct use cases, budget
              ownership, and procurement triggers. Pharmaceutical and biotech companies represent the primary buyer
              class: their R&D and medical-affairs functions spend $75,000–$5,000,000 per year on individual RWD
              datasets according to CB Insights, with oncology and rare-disease programmes commanding the highest
              outlays. Medical device companies are an emerging buyer: the FDA's December 2025 guidance creating a
              conditional pathway for de-identified RWD in device submissions directly activates this segment's
              procurement. Health systems are simultaneously suppliers of underlying data to Truveta and potential
              buyers of analytics returned to them from the platform—a dual relationship that can accelerate deal
              closure. Academic and public-health researchers constitute a smaller but strategically important segment
              that builds credibility through peer-reviewed publications and regulatory pilot programmes. Payers (health
              insurers) are growing rapidly as value-based contracts require richer clinical evidence to adjudicate
              outcomes-based drug reimbursements. Adoption path varies materially: large pharma typically starts with a
              pilot RWE study, negotiates a multi-year data subscription, then expands to platform services; health
              systems follow a slower IT-governance cycle, often requiring compliance review of de-identification
              methodology before signing. Budget ownership in pharma usually sits with chief medical officers,
              evidence-generation directors, or data-science heads—not procurement—which allows faster cycles than
              capital-budget processes.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
