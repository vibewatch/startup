      - number: '5.5'
        title: De-identification, Privacy Architecture, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Truveta's privacy architecture is designed to satisfy the most demanding requirements in healthcare
              research while maximizing data utility. For HIPAA de-identification, Truveta uses the Expert Determination
              method (45 CFR 164.514(b)(1)) rather than Safe Harbor, working with qualified statistical experts
              certified under HHS OCR standards. Expert Determination permits greater data richness than Safe Harbor
              while requiring formal documentation of a very small re-identification risk. The de-identification
              pipeline operates in four stages: (1) a controlled PHI redaction zone where AI models trained on PHI
              detect and remove direct identifiers from structured data, clinical notes, and medical images; (2)
              quasi-identifier management and k-anonymity enforcement across all 30 health systems simultaneously,
              building large equivalence classes that minimize data suppression while reducing re-identification risk;
              (3) structured data de-identification of dates, geographic data, and other regulated fields; and (4)
              watermarking and fingerprinting of all de-identified data exports to enable Truveta to detect misuse and
              trace the provenance of any exported snapshot. Truveta also operates an "embassy" model in which patient
              matching is executed within each health system's own infrastructure before any records are transmitted
              centrally, so PHI never leaves the originating health system. Researchers can configure de-identification
              parameters within Truveta Studio for their specific study goals, enabling tradeoffs between data fidelity
              and privacy protection. Certified compliance controls include HITRUST r2 Certification (encompassing NIST
              Cybersecurity Framework v1.1), SOC 2 Type 2 attestation, ISO 27001, ISO 27701, and ISO 27018, all
              externally assessed by Schellman & Company, LLC. The platform operates on Azure DevOps with mandatory
              change-management approvals, multi-ring deployment (DEV/INT/PROD), and automated validation suites.
              Ethical concerns have been raised by patient advocates regarding the commercial monetization of
              de-identified patient data, noting that patients may not fully appreciate how their records are used for
              commercial research.
