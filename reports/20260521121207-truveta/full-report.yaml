      - number: '6.2'
        title: Named Customer Proof and Production-Level Use Cases
        blocks:
          - type: paragraph
            body: >-
              The depth of named customer evidence varies materially across segments, ranging from detailed co-authored
              case studies with named executives and outcome metrics (pharma segment) to logo-level disclosure with no
              project description (some device and academic cases). The strongest proof comes from the pharmaceutical
              and biotech segment.

              Pfizer's use case is the most senior in tenure. Signed in June 2022 as Truveta's first major pharma
              customer, Pfizer uses Truveta Data to identify, monitor, and evaluate potential safety signals in
              near-real time across its product portfolio, including COVID-19 vaccine Comirnaty. Pfizer's Chief Medical
              Officer publicly quoted Truveta as providing "one of the most timely and complete datasets available in
              the United States," enabling the company to "learn directly from de-identified patient data at an
              unprecedented pace and scale." This is a production-level safety surveillance deployment, not a pilot.

              Boston Scientific signed a strategic collaborative agreement with Truveta in September 2022 to study
              post-procedure patient outcomes and healthcare disparities in peripheral artery disease (PAD), venous
              thromboembolic disease, and interventional oncology. An initial PAD analysis using Truveta Data found that
              Black or African American patients with PAD were less likely to undergo revascularization procedures (1.0%
              vs. 2.6% for white patients) and less likely to receive drug-eluting stents. The collaboration also
              underpins the REAL-PE Analysis, a published real-world study of ultrasound-assisted catheter-directed
              thrombolysis in pulmonary embolism presented at JSCAI in 2023. Medcomp, a dialysis device manufacturer,
              published a case study using Truveta Data to compare hemodialysis catheter designs and uncover product
              safety and development insights. In September 2025, Truveta expanded its device data capabilities by
              integrating unique device identifier (UDI) data with minute-level ADT and chargemaster data, citing more
              than 300,000 UDIs across 27,000-plus brands, with device records and clinical notes for more than 10
              million patients.

              Moderna's use case was publicly co-presented at ISPOR in May 2024, with Moderna's own Director of
              Epidemiology for Rare Disease presenting. Moderna uses Truveta Data to study ornithine transcarbamylase
              deficiency (OTCD), a rare genetic enzyme deficiency, specifically to understand patient burden, treatment
              patterns, and potential clinical trial endpoints where limited traditional data sources are available. UCB
              uses Truveta Data to study the patient journey in hidradenitis suppurativa (HS), an underdiagnosed chronic
              inflammatory skin disease, gaining insight into sites of care, time to diagnosis, and intervention
              history. Boehringer Ingelheim is using Truveta Data to study NASH biomarkers extracted from pathology
              reports and clinician notes, accelerating diagnosis and treatment pathway identification.

              Johns Hopkins HBHI represents the highest-documented academic adoption. The 2025 pilot program attracted
              more than 40 applications from across Johns Hopkins, awarded 25 Phase I pilots with modest feasibility
              grants, and progressed 11 projects to Phase II with awards of up to $25,000 each including Truveta data
              fee coverage. Research projects span autoimmune disease, dementia, oncology, maternal health, substance
              use, and health services research—all using Truveta as the primary data infrastructure. A monthly
              HBHI-Truveta User Community meeting consolidates learnings.

              The DIA Real World Evidence Conference 2025 featured a Truveta-hosted case study session presenting two
              production examples: a GLP-1 comparative effectiveness study that produced results more than a year ahead
              of a major clinical trial and was later validated by that trial, and a device manufacturer study
              replicating registry outcomes with a larger, more contemporary patient cohort. These conference
              presentations confirm that Truveta's customers are achieving research timelines significantly faster than
              traditional methods.
