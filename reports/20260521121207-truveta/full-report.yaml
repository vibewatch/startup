      - number: '3.3'
        title: Adjacent and Network Data Competitors — Komodo, Datavant, HealthVerity, Veeva, TriNetX
        blocks:
          - type: paragraph
            body: >-
              Komodo Health has raised $514 million at a $3.3 billion valuation (Series E) and operates the "Healthcare
              Map," which aggregates 330 million+ US patient journeys primarily from claims, EHR feeds, lab, and
              specialty data. Its October 2024 National Drug Projections product delivers real-time prescription trend
              analytics across 10,000+ therapies—a commercial intelligence capability with minimal overlap with
              Truveta's clinical EHR research angle. Komodo targets life-sciences market access and commercial teams
              rather than the RWE and regulatory evidence generation buyers who are Truveta's primary market. Datavant
              is a $7 billion network infrastructure play formed by the merger of Datavant and Ciox Health, now enhanced
              with the acquisition of Aetion. Its tokenization technology links patient records across 80,000+
              hospitals, clinics, and 350+ RWD partners without centralizing identifiable data. Datavant's moat is the
              breadth of its linkage network, not primary-source EHR governance—a complementary rather than
              substitutable model for Truveta. The Datavant-Aetion merger does create an integrated evidence network
              that covers data linkage plus regulatory-grade study design, which overlaps more directly with Truveta's
              evidence layer. HealthVerity operates a marketplace model: it licenses HIPAA-compliant claims, pharmacy,
              lab, EHR, and consumer data from multiple third-party sources with strong provenance tracking and
              transparency, targeting pharma and life- sciences buyers who want flexibility in data sourcing. Its
              absence of direct EHR provider governance is similar to Komodo's limitation relative to Truveta. Veeva
              Compass (Patient, Prescriber, National modules) is a commercial and prescriber analytics platform, not a
              clinical EHR evidence platform; it competes for pharma commercial team budgets rather than R&D and
              medical-affairs RWE budgets where Truveta operates. TriNetX operates the world's largest federated
              real-world data network with 230+ healthcare organizations and 300 million patients. Its federated model
              keeps data at source institutions, enhancing privacy compliance and institutional trust but limiting
              cross-institution record linkage and centralized study design flexibility compared with Truveta's
              de-identified centralized model.
