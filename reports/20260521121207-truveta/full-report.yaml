  - id: TR001
    title: Regulatory / legal risk register
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal identified regulatory, privacy, and legal risk vectors for Truveta as of May 2026. Does not
        include all conceivable legal risks; focuses on publicly evidenced or structurally inherent risks based on the
        Genome Project launch and enforcement landscape.
    columns:
      - Risk
      - Category
      - Likelihood (2026)
      - Potential Impact
      - Mitigation Evidence
      - Residual Exposure
      - Diligence Ask
    rows:
      - - HIPAA de-identification insufficient for genomic data
        - Regulatory
        - Medium — HHS guidance and legal scholarship confirm risk; no current action
        - High — could require halting Genome Project commercial data access or restructuring consent architecture
        - HITRUST R2; self-described de-identification protocols; no OCR guidance specific to genomic-EHR linkage
        - Medium-high — genomic data re-identification is structurally difficult under current HIPAA framework
        - Obtain Truveta's legal opinion on genomic de-identification standard; confirm OCR informal guidance sought
      - - FTC enforcement action — health data secondary use
        - Regulatory
        - Low-medium — FTC filed first genetic data enforcement action in 2025; Truveta not yet named
        - High — FTC orders have required platform shutdowns and consumer notification (e.g. BetterHelp $7.8M)
        - HITRUST R2; public-utility framework advocacy; no FTC complaint identified as of May 2026
        - Medium — FTC's expanded health-data enforcement posture covers research platforms; consent architecture is key
        - Review Truveta consent framework for genomic data; confirm opt-out mechanism for health system patients
      - - State genetic privacy legislation — new consent requirements
        - Legal
        - Medium — 8+ states filed genetic privacy bills in early 2026; 3 require explicit secondary-use consent
        - >-
          Medium — could require architecture changes for patient data from those states; health system members may face
          compliance burden
        - >-
          Truveta's public-utility framework advocacy targets federal preemption; no state law yet enacted that affects
          Truveta
        - Medium — patchwork state-law risk creates compliance complexity and potential data-coverage gaps by state
        - >-
          Monitor state legislative calendars; confirm which member health systems are in states with pending
          legislation
      - - OCR business associate investigation
        - Regulatory
        - Low — no OCR BAA investigation disclosed; Microsoft as primary BA is a focus area per Foley Hoag analysis
        - Medium — OCR BAA enforcement can require policy changes, breach notification, and civil monetary penalties
        - Microsoft Azure HIPAA BAA in place; HITRUST R2 includes BAA controls; no disclosed investigation
        - Low-medium — BAA risk is standard for cloud-hosted health platforms; mitigated by HITRUST certification
        - >-
          Request BAA terms between Truveta and Microsoft; confirm BAA scope includes Truveta Intelligence and Genome
          Project data
      - - IP — competitor data network effects and consortium replication
        - Legal
        - Medium — IQVIA, Komodo, Tempus each operate competing RWD platforms; no Truveta-specific IP identified
        - Medium — if competitors build comparable health system consortia, Truveta's differentiation reduces
        - Network effects from 30 member systems create switching cost; no major IP litigation disclosed
        - >-
          Medium — Truveta's moat is relational and data-scale, not IP; replication by well-capitalized competitors is
          plausible
        - >-
          Confirm whether Truveta holds trade-secret protections or exclusivity provisions in health system data
          agreements
      - - Patient privacy litigation risk — class action
        - Legal
        - Low — no class action disclosed; genomic data adds litigation surface
        - High if materialized — class actions in health data have resulted in settlements exceeding $100M
        - HIPAA exemption for de-identified data limits plaintiff standing in most circuits; no disclosed litigation
        - >-
          Low-medium — structural risk increases with genomic data addition; state privacy statutes create additional
          standing pathways
        - >-
          Review insurance coverage for privacy litigation; confirm whether health system members carry shared
          indemnification obligations
      - - Export controls and foreign access to genomic data
        - Regulatory
        - Low-medium — genomic data of US patients is a national security concern under emerging CFIUS guidance
        - >-
          Medium — restrictions on genomic data export or access by non-US entities could limit international pharma
          customer access
        - >-
          No disclosed foreign customer relationships that require specific export clearance; Regeneron and Illumina are
          US-listed
        - Low-medium — risk increases if international pharma customers access US genomic data
        - >-
          Confirm data residency requirements; assess whether any non-US entities have access to raw or linked genomic
          data
      - - DOGE policy risk — government contract restrictions on health data platforms
        - Regulatory
        - Medium — CDC contract terminated under DOGE in January 2026; broader executive health-data policy unclear
        - >-
          Low-medium — loss of government segment already partially materialized; risk of additional restrictions on NIH
          funded use
        - >-
          CDC contract already terminated; Truveta has diversified to commercial pharma; government is now a minor
          segment
        - Low — government segment small and already impaired; limited incremental risk beyond what has materialized
        - >-
          Assess whether any pending federal grants cite Truveta data; confirm no executive order restricts health data
          use in commercial research
    notes: >-
      Likelihood and impact ratings are qualitative assessments based on publicly available regulatory and legal
      context. No Truveta enforcement action or litigation has been identified as of May 2026. Residual exposure
      reflects risk after existing mitigations. All ratings should be revisited with access to Truveta's legal opinions
      and compliance documentation.
