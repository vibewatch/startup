      - number: '8.5'
        title: Final Recommendation, Confidence, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is a conditional pass at the current valuation level, contingent on data- room
              disclosure of the following: (1) audited or management-certified ARR by product segment, with net revenue
              retention and customer concentration by revenue; (2) Genome Project sequencing milestone progress versus
              plan and commercial launch timeline; (3) capital runway analysis through 2027 including all committed and
              contingent Genome Project expenditures; (4) member health system contractual terms including exit
              provisions, data contribution obligations, and revenue reimbursement mechanics; and (5) Regeneron's
              data-access rights, exclusivity terms, and any rights-of-first-refusal or acquisition options embedded in
              the $119.5M Series C investment. Without these disclosures, precise underwriting of a $1B+ entry is not
              supportable; the valuation is defensible in a base case but the margin of safety against a bear scenario
              is thin given the current entry price.

              Confidence in the recommendation is low-to-medium: the investment case is logically compelling and the
              strategic differentiation is genuine, but the financial opacity prevents assignment of high confidence to
              any specific price. The risk rating is high: the combination of regulatory risk (genomic data HIPAA
              exposure), capital intensity (Genome Project multi-round need), and platform concentration (Microsoft
              Azure sole-cloud, Regeneron sole-genomic-partner) creates a multi-factor risk profile that is uncommon
              even in health technology. The valuation stance is fair-to-slightly-rich at the $1.0–1.4B mark given the
              revenue proxy: reasonable in a bull case, stretched in a bear case.

              What evidence would change the recommendation to a strong pass: (a) Revenue disclosed in the $100– 150M+
              range with 20%+ growth and high gross margin; (b) Genome Project sequencing milestones on or ahead of plan
              with signed commercial genomic data contracts; (c) a new member health system joining after the Series C,
              demonstrating consortium expansion; (d) a competitive M&A offer from a strategic acquirer that serves as a
              floor price signal. What evidence would change the recommendation to a decline: (a) Revenue disclosed
              below $60M or with high customer concentration above 30% in a single account; (b) Genome Project
              milestones more than 12 months behind plan; (c) disclosure of any outstanding regulatory inquiry or
              litigation; (d) health system governance conflict disclosed in board minutes or member correspondence.

              The exit pathway analysis reinforces the conditional pass: at a $1.5–2.0B strategic M&A exit in the
              2028–2030 period—consistent with the Flatiron precedent and below Komodo Health's private valuation mark—a
              $1.0–1.4B entry with 30–40% dilution generates a 0.8–1.2x net return, which is insufficient for the risk
              profile. The minimum required exit to generate a 2x net return at 30% dilution is approximately $2.5–3.5B,
              which requires the Genome Project to be commercially productive and revenue to grow to $250–350M by the
              exit date. This return math makes the Genome Project not merely a strategic optionality feature but a
              financial necessity for the investment case to work.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
