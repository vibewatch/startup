            title: 'TLM is the core IP moat: clinical NLP outperforming GPT-4 on medical extraction'
            body: >-
              TLM's above-90% accuracy on clinical concept extraction from unstructured notes—validated against human
              clinical expert reviewers and outperforming GPT-4 on medical domain tasks—is the hardest element of
              Truveta's stack to replicate. Training requires billions of de-identified clinical records,
              clinical-expert annotator pipelines, and years of iteration. No competitor currently combines
              provider-governed EHR scale with equivalent clinical NLP depth.
