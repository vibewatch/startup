      - number: '7.2'
        title: Operational, Data Quality, and Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >-
              Health data platforms face the highest rates of ransomware attack and data breach of any sector. Truveta's
              architecture creates specific cybersecurity risk: data from 30 health systems is aggregated, normalized,
              and stored in a centralized platform on Microsoft Azure. A breach at the platform layer would expose the
              de-identified records of 130 million-plus patients simultaneously—creating potential HIPAA Business
              Associate Agreement liability across all 30 member health systems plus commercial customers. The Cloud
              Security Alliance's 2026 analysis of health cloud security identifies multi-tenant health data aggregators
              as priority targets for state-sponsored actors seeking population-level health intelligence. Truveta's
              HITRUST R2 certification provides strong evidence of security process maturity but cannot guarantee breach
              prevention; the Truveta blog on HITRUST certification acknowledges that certification is an ongoing
              process requiring annual maintenance.

              Data quality and completeness risk is a significant operational concern. EHR data from 30 health systems
              is inherently heterogeneous: different Epic configurations, varying coding practices, and coverage gaps in
              particular disease areas or patient demographics create systematic bias risks in the research outputs.
              Truveta's own data quality whitepaper describes a multi-layer quality assurance process including
              normalization, de-duplication, and bias monitoring—but these are self-disclosed without independent
              third-party audit results cited. The Truveta blog on real-world data quality approach documents the
              specific dimensions of data completeness, timeliness, accuracy, and provenance that Truveta tracks.
              However, no independent accuracy audit comparing Truveta's curated data against source records has been
              published, and systematic completeness rates by disease area or patient population are not disclosed.

              The SIIT.co analysis of Truveta's genomic database notes that linking genomic sequences to clinical
              records amplifies data quality requirements: a genomic variant of uncertain significance in the WGS data
              paired with an incomplete medication or diagnosis record creates compounded error risk in downstream
              research. Customer churn risk due to data quality issues is plausible but unconfirmed; no customer
              defection citing data quality has been publicly documented. Truveta's reliance on EHR data from
              contributing health systems creates a structural dependency: if health systems reduce data contribution
              quality or coverage to protect competitive sensitivity, Truveta's data advantage erodes. Operational
              staffing risk is moderate given leadership continuity (CEO Terry Myerson's tenure since founding) and the
              company's Seattle-area base competing for data science and clinical informatics talent with Amazon,
              Microsoft, and other major employers.
