              clinical judgment. Observational EHR studies remain subject to confounding, selection bias, missing data,
              and documentation variability across health systems. FDA has not formally pre-authorized or validated
              Truveta Data for regulatory submissions; Truveta's alignment with FDA RWE guidance is self-asserted.
