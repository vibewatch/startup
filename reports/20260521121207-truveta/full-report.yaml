      - number: '3.2'
        title: Direct Incumbents — IQVIA, Flatiron, Tempus, and ConcertAI
        blocks:
          - type: paragraph
            body: >-
              IQVIA is the largest and most broadly entrenched competitor. Its $16.31 billion in annual revenue (TTM
              2026), 93,000 employees, and integrated CRO plus data-plus-analytics stack make it the default choice for
              large-pharma RWE procurement. IQVIA's data asset mixes licensed claims feeds, pharmacy data, and
              structured EHR data from commercial partnerships rather than direct provider governance, which limits
              de-identification provenance transparency versus a provider-owned model. Its distribution
              advantage—multi-year enterprise agreements, regulatory consulting depth, and a global salesforce—is the
              most durable competitive threat Truveta faces. Flatiron Health operates as an independent Roche Group
              affiliate following the 2018 $1.9 billion acquisition. Its competitive strength is deep oncology curation:
              5 million+ patient journeys across 4,700+ providers and 1,600 sites, with longitudinal data in the US, UK,
              Germany, and Japan. The May 2026 Flatiron Telescope launch added natural-language AI cohort generation for
              life-sciences teams, directly competing with Truveta Intelligence. However, Roche's reported evaluation of
              a strategic divestiture of Flatiron signals that pharma-parent ownership creates a channel conflict that
              deters non-Roche pharma partners—a structural drag that benefits Truveta's independent positioning.
              Flatiron is oncology-only; non-oncology conditions, primary care, and cardiology are evidence gaps. Tempus
              AI is the fastest-growing direct competitor. As a NASDAQ-listed company (TEM), Tempus reported Q1 2026
              revenue of $348.1 million (+36% YoY), with Data and Applications (the RWD licensing segment) at $87.0
              million (+41% YoY). Its 2026 guidance of $1.59–$1.60 billion and strategic partnerships with Merck,
              Gilead, and AstraZeneca position it as a substantial multimodal data provider for oncology. Like Flatiron,
              Tempus is anchored in oncology diagnostics; its non-oncology RWD reach is limited. ConcertAI offers an
              AI-powered oncology RWD suite (claims, EHR, genomics) with CARAai, SmartLinQ, and the new Precision Suite
              for clinical trial recruitment and evidence generation, but its public scale and funding disclosures are
              thinner than IQVIA or Tempus.
