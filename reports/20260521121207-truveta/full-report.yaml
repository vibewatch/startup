      - number: '2.2'
        title: Market Sizing — TAM, SAM, and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              Analyst estimates for Truveta's primary market (RWE solutions) vary markedly depending on scope
              definitions, geographic coverage, and inclusion of services versus data-only revenues. The Business
              Research Company pegs the RWE solutions market at $2.33 billion in 2025 and $4.81 billion by 2030 at 15.6%
              CAGR. Global Market Insights is considerably more optimistic at $3.1 billion in 2026, growing to $11.9
              billion by 2035 at 16.3% CAGR. Grand View Research takes a more conservative view at $3.04 billion in 2025
              and $6.04 billion by 2033 at 9.08% CAGR. The Roots Analysis 2030 target of $4.5 billion sits below the GMI
              estimate by more than $2 billion. This four-source spread of $2.7 billion–$3.1 billion for the 2026 RWE
              solution market reflects genuine boundary disagreements: broader scopes include data licensing, CRO
              services, and post-market safety contracts that narrower definitions exclude. The adjacent RWD market
              (data assets only) is smaller and more tightly estimated: TBRC and Coherent Market Insights both project
              $2.0–$2.7 billion for 2025–2026, with a 14–16% CAGR to 2030. The parent healthcare analytics market
              reaches $166.65 billion by 2030 according to MarketsandMarkets (24.6% CAGR), while Mordor Intelligence
              sizes clinical data analytics at $125.73 billion in 2026 alone—numbers that illustrate how inclusion of
              hospital IT and operational analytics inflates totals. Truveta's serviceable addressable market (SAM) is
              substantially narrower: pharma and biotech R&D buyers who need EHR-linked, de-identified, multi-system US
              data for evidence generation. No public analyst separates this precisely, making SAM estimation a
              diligence gap.
