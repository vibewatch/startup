      - number: '7.4'
        title: Thesis-Break Triggers, Mitigations, and Monitoring Framework
        blocks:
          - type: paragraph
            body: >-
              A thesis break is a risk event whose occurrence or credible probability would materially impair the
              investment case for Truveta as currently understood. Five thesis-break categories are identified based on
              the risk inventory in this chapter.

              The first is regulatory action: an OCR enforcement action, state AG lawsuit, or FTC investigation citing
              Truveta's genomic data handling or consent architecture would directly threaten the Genome Project's
              commercial viability and could require operational restructuring. Monitoring indicators: any HHS OCR
              resolution agreement involving genomic data or EHR aggregation platforms; any state AG civil investigative
              demand mentioning Truveta; any FTC 6(b) study targeting health-data platforms that names Truveta.

              The second is data breach or security incident: a confirmed breach of Truveta's platform affecting
              de-identified patient records would trigger business associate liability across member health systems,
              regulatory investigation, and potential customer churn. Monitoring indicators: HHS OCR breach portal
              notifications from Truveta or member health systems referencing a third-party service provider;
              cybersecurity incident disclosure via member health system public filings; HITRUST certification lapse.

              The third is member health system attrition: loss of two or more member health systems, especially
              Providence (a founding member) or CommonSpirit Health, would simultaneously reduce data scale (reducing
              commercial value) and signal governance conflict. Monitoring indicators: health system merger or
              acquisition activity, competitive EHR-data platform announcements by health systems, board-level personnel
              changes at Truveta.

              The fourth is partner strategy shift: Microsoft announcing a competing health-data aggregation offering or
              Regeneron publicly confirming an internal database strategy that displaces the Truveta collaboration would
              each represent material thesis-break events. Monitoring indicators: Microsoft Health and Life Sciences
              product announcements; Regeneron genomic database disclosures in SEC filings or investor presentations.

              The fifth is commercial stagnation: failure to disclose meaningful ARR growth from the Genome Project's
              commercial genomic data segment by end-2026, or ARR remaining below $50M by mid-2027, would signal
              product-market fit failure at scale. Monitoring indicators: Truveta press releases announcing commercial
              genomic data customers; CHAUSA member health system reports on Truveta governance; vctavern.com and
              tracxn.com funding or valuation updates.

              Mitigations already in place include: HITRUST R2 certification for security controls; the public-utility
              framework advocacy signaling proactive regulatory engagement; the consortium governance structure that
              aligns health system incentives; and the multi-year Genome Project commitment from Illumina, Regeneron,
              and member health systems that provides structural lock-in. Key diligence asks: (1) Request Truveta's
              legal opinions on genomic data de-identification sufficiency under HIPAA Safe Harbor; (2) request member
              health system contractual commitment terms including exit clauses; (3) confirm Regeneron's data
              exclusivity or preferential access terms in the Genome Project; (4) obtain cybersecurity incident history
              and BAA terms with member health systems; (5) review ARR by segment and government revenue concentration;
              (6) obtain HITRUST certification scope documentation.
