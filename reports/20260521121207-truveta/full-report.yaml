  - id: FV004
    title: Investment KPIs — IC-Ready Scoring Across Eight Dimensions
    type: kpi
    layout: wide
    summary: >-
      Qualitative investment committee scoring of Truveta across market, proof, moat, economics, risk, valuation,
      evidence quality, and exit dimensions as of 2026-05-21. Ratings are derived from sourced evidence across all eight
      chapters and are not quantitative scores.
    approximationNotes: >-
      Ratings (Strong / Moderate / Weak / High Risk) are qualitative assessments based on synthesized evidence from
      Chapters 1–8. Evidence quality rating reflects the degree of public-information uncertainty. All assessments are
      as of the research date (2026-05-21).
    data:
      items:
        - label: Market Opportunity
          value: Strong
          note: RWE + genomics market large, growing, and structurally favorable to integrated data platforms
        - label: Product-Technology Proof
          value: Moderate-Strong
          note: >-
            50+ customers; named pharma accounts; Genome Project launched; TLM deployed — strong proof points but
            limited revenue disclosure
        - label: Competitive Moat
          value: Moderate-Strong
          note: >-
            Provider-governance moat is unique; durable vs. IQVIA on data quality; at risk from IQVIA on commercial
            scale
        - label: Unit Economics / Financials
          value: Weak (Opacity)
          note: ~$80M ARR proxy only; no margin, NRR, or churn data; single biggest constraint on investment confidence
        - label: Risk Profile
          value: High Risk
          note: >-
            HIPAA genomic exposure; Genome Project capital intensity; platform concentration; government revenue
            fragility
        - label: Valuation
          value: Fair to Slightly Rich
          note: $1.0–1.4B at ~12–18x proxy ARR; base case return is modest; bull requires Genome Project commercial success
        - label: Evidence Quality
          value: Low-Medium
          note: >-
            Revenue proxy only; governance terms not public; Regeneron data-access terms unknown; regulatory opinion
            absent
        - label: Exit Readiness
          value: Moderate
          note: M&A pathway viable (Flatiron precedent, pharma appetite); IPO unlikely near-term; complex cap table
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
      - CV001
      - CV002
      - CV003
      - CV004
