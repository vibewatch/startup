      - number: '4.5'
        title: Financial Gaps and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The fundamental challenge in underwriting Truveta's financial profile is information asymmetry: the
              company presents a compelling strategic narrative with confirmed capital, confirmed partner relationships,
              and confirmed product launches, but provides no verified operating financial data. This is normal for a
              private unicorn with no regulatory filing obligation, but it creates diligence blockers that are material
              for any investor or commercial partner making capital or commitment decisions.

              The primary private metric gaps are: (1) exact ARR and revenue mix across Data, Evidence, Intelligence,
              and government streams; (2) gross margin and cost of revenue by segment, especially the genome sequencing
              cost allocation; (3) monthly cash burn and runway; (4) net revenue retention, which is the single best
              indicator of whether existing pharma customers are expanding or churning; (5) customer count beyond the
              "50+" disclosure from October 2023; and (6) the financial terms of the health system revenue-sharing
              obligation.

              The adverse evidence picture includes: financial opacity that makes independent revenue quality assessment
              impossible; bioethicist and privacy expert concerns about re-identification risk as genomic data is added
              at scale; the DOGE-related CDC contract partial termination demonstrating government revenue fragility;
              and the structural complexity of a 30-member health system consortium that dilutes governance and could
              slow commercial decision-making or create competing interests in revenue distribution.

              The financial verdict is that Truveta is well-capitalized for its current phase (Series C runway is likely
              2–4 years depending on burn) and has a credible revenue engine anchored in an asset that is genuinely
              difficult to replicate. However, without access to audited financials, the revenue quality, margin
              durability, and capital adequacy cannot be independently verified. Any material investment or strategic
              partnership decision should require access to a data room with at minimum: audited revenue and ARR, gross
              margin by product segment, NRR, customer concentration by revenue, and the health system revenue-sharing
              rate and obligation schedule.
