      - number: '4.3'
        title: Unit Economics Proxies and Sales Motion
        blocks:
          - type: paragraph
            body: >-
              Truveta has not disclosed any formal unit economics metrics—no ARR, net revenue retention, LTV, CAC, or
              gross margin figures are available in public channels as of May 2026. The following analysis relies on
              analyst intelligence estimates, public-company peer data, and first-principles derivation.

              Revenue per employee provides the most accessible proxy. At an estimated $80 million annual revenue (2024
              analyst proxy) and approximately 400 employees, Truveta operates at roughly $186,000–$200,000 revenue per
              employee. This is below the $250,000–$350,000 range typical of pure SaaS platforms at comparable scale but
              consistent with a data services business that blends proprietary data subscriptions with scientific
              advisory and evidence generation services.

              Gross margins for the subscription data layer are likely high—industry benchmarks for healthcare RWD/RWE
              SaaS platforms suggest 75–80%+ on pure software/data access revenue—but are materially compressed by the
              provider revenue-sharing obligation, data operations costs (curation, de-identification, normalization),
              and the genomics sequencing cost layer. An estimated blended gross margin of 50–70% is plausible, but this
              is inferential and sensitive to the revenue-sharing rate and sequencing cost allocation that Truveta does
              not disclose.

              Sales cycle and CAC estimates reflect the enterprise life-sciences procurement context. RWE platform deals
              typically require 6–18 months from initial contact to contract close, involve clinical operations,
              regulatory affairs, and legal teams on both sides, and often require proof-of-concept study data before a
              full subscription commitment. CAC in this segment is high; industry benchmarks for enterprise B2B
              healthcare SaaS put payback periods at 15+ months. Truveta's differentiated network asset should command
              premium pricing and reduce competitive pressure during renewal, but the short public history of the
              company limits empirical retention data.

              The publicly comparable proxy is Tempus AI's Data and Applications segment, which grew 40.5%
              year-over-year to $87 million in Q1 2026 alone (annualized $350 million), suggesting strong demand for
              clinical data platforms with AI layers. Truveta lacks Tempus's diagnostic revenue pillar but has a deeper
              EHR data breadth; its data segment alone appears to operate at a fraction of Tempus's data segment scale,
              though the genomics addition may change this trajectory materially.
