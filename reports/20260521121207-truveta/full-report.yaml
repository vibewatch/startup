  - id: TV006
    title: Final Diligence Asks Table
    notes: >-
      Specific evidence items required from the data room before an investment decision can be made with confidence.
      Absent these items, the conditional pass recommendation cannot be converted to a proceed decision.
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Diligence Path / Owner
    rows:
      - - ARR and revenue quality
        - Audited or certified ARR by segment; NRR; gross margin; customer concentration
        - Revenue proxy ($80M) is analyst-estimated; actual figure determines whether valuation is fair or rich
        - Financial data room; audited financials or management accounts
      - - Genome Project commercial milestone
        - Sequencing volume to date; signed commercial genomic data contracts; revenue timeline
        - Determines whether bull-case upside is accessible within the return horizon
        - Truveta management; Regeneron collaboration terms disclosure
      - - Capital adequacy
        - Cash position as of Q1 2026; Genome Project expenditure to date; committed spend schedule
        - Determines whether Truveta can execute without another dilutive raise before exit
        - CFO financial model; Series C use-of-proceeds analysis
      - - Regeneron data-access terms
        - Scope of Regeneron's data-access rights; exclusivity provisions; acquisition options
        - $119.5M investment may carry data exclusivity or ROFR provisions that constrain acquirer optionality
        - Legal data room; Series C transaction documents
      - - Member health system contracts
        - Exit provisions; data contribution obligations; reimbursement mechanics; minimum tenure terms
        - Contractual durability of the 30-system consortium is the foundational moat; gaps are thesis-breaks
        - Legal data room; member system representative interviews
      - - Legal and regulatory status
        - HIPAA legal opinion on genomic de-identification; any regulatory inquiries; litigation docket
        - Regulatory risk is the single largest binary risk; absence of public action ≠ no exposure
        - Outside regulatory counsel review; OCR inquiry search; litigation docket
      - - Competitive win rate
        - Win/loss rate against IQVIA, Komodo, Tempus in competitive RFPs; churn analysis
        - Commercial durability against well-funded competitors is a key unknown
        - Sales leadership interview; CRM data review
    claimRefs:
