      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Terry Myerson serves as chief executive officer and co-founder and is the most visible executive face of
              Truveta. The leadership page and company history connect him directly to the company’s formative period:
              he joined the mission in March 2020 as Truveta’s first employee after a 21-year Microsoft career and later
              advisory roles with Madrona and Carlyle. The other named co-founders are chief technology officer Jay
              Nanduri and chief medical officer Ryan Ahern, giving the company a blended software, AI, and
              clinical-research founding profile. Public 2026 leadership disclosures further show Deb Nielsen as chief
              people officer, Simonne Lawrence as general counsel, Michael Simonov as senior vice president of product,
              Fabien Mousseau as chief financial officer, and Johnathan Lancaster—hired from Regeneron in January
              2026—as president and chief scientific officer. Governance also remains unusually provider-centric:
              Truveta’s board is populated primarily by executives from member health systems, with a Pfizer safety
              executive also listed. That structure strengthens alignment with provider data contributors and ethics
              oversight, but it leaves outside investors with less visible governance influence than in a typical
              venture-backed software company.
