      - number: '1.4'
        title: Genome project, traction, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The Truveta Genome Project is the company’s boldest strategic move and the clearest reason the Series C
              mattered. Public descriptions say Truveta will obtain patient consent to use leftover biospecimens from
              routine lab tests, sequence and store those samples, link the resulting genomic data to de-identified
              medical records, and make the combined resource available for research, AI model development, drug
              discovery, and trial optimization. Regeneron Genetics Center is the core sequencing partner and Microsoft
              Azure is the exclusive cloud provider. The company frames the program as a diversity and health-equity
              asset because it is being assembled through a broad U.S. health-system network rather than a narrower
              academic cohort. On traction, Truveta said in October 2023 that more than 50 organizations were already
              using the platform, and in April 2026 it launched Truveta Intelligence to speed natural- language analysis
              for existing data subscribers. The main adverse context is ethical rather than litigated: STAT highlighted
              Truveta as part of a market in which hospitals hand over de-identified patient data for AI and research,
              while bioethicists questioned whether patients meaningfully understand the downstream commercialization of
              those data. There is no public evidence here of a named enforcement action against Truveta, but the
              privacy optics are a real diligence issue because genomic data intensify the re-identification stakes.
            claimRefs:
              - CO020
