  - id: FE001
    title: Truveta Product Architecture Stack — From Health System EHR to Research Intelligence
    type: stack
    layout: wide
    summary: >-
      Six-layer stack from cloud infrastructure through de-identified data to AI analytics, showing the dependency chain
      and the Truveta product that sits at each layer.
    approximationNotes: >-
      Architecture described from company-published documentation and platform announcements. Internal technical
      architecture details (microservices topology, API design, data partition strategy) are not publicly disclosed.
    data:
      layers:
        - label: Layer 1 — Cloud Infrastructure (Microsoft Azure)
          detail: >-
            All storage, AI/ML compute, and hosting; exclusive cloud provider; Azure DevOps for CI/CD; multi-ring
            deployment (DEV/INT/PROD).
          items:
            - Azure compute and GPU clusters (TLM training and inference)
            - Azure Storage (petabyte-scale EHR + genomic data)
            - Azure Key Vault, Active Directory, Security Center (compliance controls)
            - Azure DevOps (change management; mandatory approvals)
        - label: Layer 2 — Data Ingestion and Privacy (Embassy + De-identification)
          detail: >-
            Patient matching within each health system's embassy; PHI never leaves member walls; AI-based redaction in a
            controlled PHI zone.
          items:
            - Per-health-system embassy model (patient matching on-site)
            - AI PHI redaction (structured data, notes, images)
            - k-anonymity across 30 health systems (equivalence classes)
            - Watermarking and fingerprinting of all exports
        - label: Layer 3 — Truveta Language Model (TLM)
          detail: >-
            Proprietary clinical LLM normalizing billions of daily EHR data points to standard ontologies; >90%
            accuracy; human expert annotation pipeline.
          items:
            - Semi-structured normalization (SNOMED CT, LOINC, RxNorm, ICD-10, CPT, CVX, NDC, UDI)
            - Unstructured note extraction (disease staging, adverse events, medication rationale)
            - Negation, hypothetical, and family-history detection
            - Truveta Data Model (TDM) — internal unified schema
        - label: Layer 4 — Truveta Data (Dataset Product)
          detail: >-
            De-identified, TLM-normalized EHR dataset; 130M patients; daily refresh; linked claims, SDOH, mortality,
            pharmacy, ADT data.
          items:
            - EHR data from 30 health systems (130M patients)
            - Closed claims (200M+ patients, 100+ payers, back to 2016)
            - 45 SDOH attributes per patient (LexisNexis Risk Solutions)
            - Mortality, pharmacy (Surescripts), ADT/billing administrative data
            - Genomic exome data (in build-out; Genome Project)
        - label: Layer 5 — Truveta Studio / Evidence (Analytics Workspace)
          detail: >-
            Regulatory-grade cohort building, query execution, feature-table generation, and audit-ready research
            workflows for life-sciences and health-system subscribers.
          items:
            - Prose (SQL-like query language for cohort definition)
            - Snapshots, Notebooks, Truveta Library (validated code sets)
            - Feature table builder (minutes vs. weeks); eligibility filters
            - Audit-ready workflows and data provenance for FDA-aligned RWE
        - label: Layer 6 — Truveta Intelligence (AI Insight Layer)
          detail: >-
            NL query interface on live data; launched April 28, 2026; minutes-to-insight; full transparency into code
            sets and methodology; no causal inference.
          items:
            - Natural language query → structured analysis → real-time results
            - Fully inspectable code sets and methodology for validation
            - Available to all Truveta Data subscribers
            - Explicitly does not establish causality or replace clinical judgment
    claimRefs:
