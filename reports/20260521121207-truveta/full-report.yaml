      - number: '6.4'
        title: Concentration Risk, Procurement Friction, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Truveta faces at least three distinct concentration-risk vectors. The first is structural: the thirty
              member health systems function as Truveta's largest and most durable customer cohort, but they are also
              the sole source of the de-identified clinical data on which all external commercial revenue depends.
              Member attrition therefore creates a dual shock—simultaneously reducing data supply quality and removing a
              paying subscriber. No member has publicly departed, but no public contractual commitment duration has been
              disclosed. The CHAUSA reporting confirms that member systems "get access to [Truveta data] as part of
              their paid membership," and the health-systems page describes a revenue-reimbursement model for data
              contributors. The financial terms of this arrangement—membership fees, revenue shares, minimum
              contribution obligations—are not public.

              The second concentration risk is on the external commercial side. As of May 2026, no customer contributes
              a known share of revenue, since ARR, customer revenue distribution, and ACV data are not disclosed.
              Truveta's last public customer count is 100+ organizations (November 2024). With no update for six months
              as of May 2026, the count could be higher or stable but cannot be confirmed. Even if the count is
              materially larger, the revenue distribution among a small number of large pharma accounts versus a long
              tail of smaller academic and device customers is unknown. Pharma mega-cap customers (Pfizer, Eli Lilly,
              Novartis, Bayer) likely represent a disproportionate share of commercial revenue if they hold enterprise
              licenses, creating concentration risk that is entirely opaque from public disclosures.

              The third concentration risk is government revenue. The CDC contract termination reduces government
              revenue contribution to essentially zero for the near term and illustrates that federal contracts cannot
              be relied upon for durable base revenue in the current US policy environment. The broader DOGE-driven
              federal contract disruption in 2025–2026 suggests this is a category-level risk rather than
              Truveta-specific.

              On procurement friction, enterprise pharma deals require 6–18 months from initial contact to contract
              close, involve clinical operations, regulatory affairs, and legal teams on both sides, often require a
              proof-of-concept study before full subscription commitment, and carry high customer acquisition costs with
              payback periods exceeding 15 months by industry benchmark. Academic procurement at Johns Hopkins required
              applicants to identify Truveta data fee budget lines in grant proposals, satisfy IRB oversight, and
              demonstrate Phase I feasibility before qualifying for Phase II funding—a multi-step procurement friction
              that limits rapid adoption. The ISPOR and DIA conference presentations indicate that Truveta invests
              significantly in conference-sponsored sessions (hosted non-CE case studies) as customer engagement, which
              is consistent with a high-touch, relationship-driven sales model.

              On adverse evidence, bioethicists cited in AIBrew News compared Truveta's model of monetizing
              de-identified patient data for commercial research to "Soylent Green," raising consent and commodification
              concerns. While Truveta applies HIPAA Expert Determination de-identification and additional technical
              controls, critics argue that the combination of EHR, claims, SDOH, and genomic data at scale creates
              re-identification risks that are not fully addressed by current legal standards. Corporate pharmaceutical
              customers and academic IRBs are sensitive to reputational risk from patient-privacy incidents; a future
              de-identification failure could trigger customer-review processes and procurement delays even if no legal
              violation occurs. Truveta has not publicly disclosed the results of any independent third-party
              de-identification audit against re-identification attack vectors.
