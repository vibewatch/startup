      - number: '1.3'
        title: Funding, capital formation, and milestone arc
        blocks:
          - type: paragraph
            body: >-
              Truveta’s capital history shows a fast scale-up but not full economic transparency. The company disclosed
              nearly $100 million of Series A capital in July 2021, expanded that same year through a strategic
              Microsoft investment and exclusive Azure cloud partnership, and said by November 2021 that it had secured
              nearly $200 million in funding. The largest public financing came in January 2025, when Truveta raised
              $320 million in Series C capital from 17 health systems, Regeneron, and Illumina at a valuation above $1
              billion. Regeneron alone invested $119.5 million and Illumina invested $20 million. Truveta and GeekWire
              described lifetime capital at nearly $500 million after that round, while Tracxn reports $515 million
              across four rounds; the difference likely reflects an undisclosed Microsoft tranche and private round
              bookkeeping rather than a substantive contradiction. Operationally, the milestone pattern is clear even if
              exact cumulative cash is not: a founding pandemic-era data collaboration in 2020, commercial platform
              expansion in 2021, broader customer adoption by 2023, a genomics step-change in 2025, and a real-time AI
              intelligence product plus deeper scientific leadership in 2026.
