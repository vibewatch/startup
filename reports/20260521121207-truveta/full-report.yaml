  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              Truveta's addressable market spans four overlapping but analytically distinct segments. The core segment
              is the real-world evidence (RWE) solutions market, which covers software platforms, data-management
              services, and analytics that generate clinical evidence from electronic health records (EHRs), insurance
              claims, patient registries, and wearable data outside of controlled trials. Adjacent to this is the
              broader real-world data (RWD) market, which includes the underlying data assets—EHR exports, claims
              datasets, pharmacy records, and patient registries—sold on a subscription or licence basis. A third
              segment, clinical data analytics, encompasses all computational tools used to transform clinical records
              into actionable operational and research intelligence, of which RWE is a sub-component. Finally, Truveta's
              Genome Project places it in the clinical genomics and pharmacogenomics adjacency, where EHR-linked genomic
              databases command separate buyer budgets. Excluded spend includes general-purpose hospital EHR software
              (Epic, Cerner), claims-processing systems, payer adjudication platforms, and raw genomic sequencing
              instruments. Status-quo substitutes are bespoke in-house data science teams, traditional contract research
              organisations (CROs) running manual chart reviews, and academic research collaborations. Buyers
              distinguishing included versus excluded spend matter because procurement cycles and budget holders differ
              sharply: RWE platforms are typically funded from pharma R&D or medical-affairs budgets, whereas EHR
              systems are IT capital expenditure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
