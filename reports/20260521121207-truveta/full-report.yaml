      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              All scenario analysis is based on explicitly labeled assumptions. Truveta's financial opacity means these
              scenarios are investor-diligence orientation tools, not financial models. Revenue assumptions use the
              GetLatka/Growjo analyst proxy of approximately $80M (2024) as the base-year anchor, consistent with
              Chapter 4 analysis. Exit valuation uses a five-year holding period to 2030–2031, assuming a liquidity
              event through strategic M&A, growth equity round, or IPO.

              Bull scenario assumes: (1) The Truveta Genome Project successfully sequences 3–5M exomes by 2028 and
              generates a new genomic data subscription revenue tier priced at a premium to the EHR data tier; (2) core
              EHR data subscription revenue grows at 25–30% annually, reaching $200–250M by 2028; (3) the AI analytics
              layer (Truveta Intelligence) converts to a margin-accretive upsell; (4) the health system consortium
              expands from 30 to 35–40 members, deepening the moat; (5) a strategic acquirer—large pharma, major health
              system consortium, or biotech platform—pays a premium multiple of 10–15x forward revenue. Implied bull
              valuation at exit: $3.0–5.0B. Return on a $1.0–1.4B entry with 30–40% dilution: 1.5–3.0x net. The bull
              scenario requires the Genome Project to become commercially productive, which is the critical binary
              assumption.

              Base scenario assumes: (1) Core EHR data subscription revenue grows at 15–20% annually, reaching $140–180M
              by 2028; (2) Genome Project adds modest genomic data revenue ($20–30M by 2028) but does not materially
              reprice the company before a liquidity event; (3) Truveta Intelligence converts to a 10–15% revenue
              uplift; (4) health system membership is stable at 30 members; (5) exit at 7–10x forward revenue through
              strategic M&A. Implied base valuation at exit: $1.2–2.0B. Return on a $1.0–1.4B entry with 30–40%
              dilution: 0.7–1.2x net—a modest to flat return reflecting the current entry price relative to execution
              uncertainty. The base scenario validates the current valuation but does not generate compelling return for
              risk taken.

              Bear scenario assumes: (1) Core revenue growth compresses to 5–10% due to pharma RWD budget cuts,
              competitive displacement by IQVIA's bundled contracts, or customer concentration loss; (2) Genome Project
              delays reduce commercial genomic revenue to negligible levels by 2028; (3) a HIPAA or FTC enforcement
              action requiring consent-architecture restructuring reduces the TAM of monetizable data; (4) a major
              health system exits the consortium, simultaneously reducing data supply and revenue; (5) exit at 3–5x
              revenue (compressed multiple) or a down-round. Implied bear valuation: $300–600M. Return on a $1.0–1.4B
              entry: 0.2–0.6x (capital-destructive). The bear scenario is not the base case but is not remote—the CDC
              partial contract termination, the pending Genome Project capital need, and revenue opacity collectively
              make it a non-trivial tail.

              Probability-weighted valuation analysis: Assigning rough probability weights of 20% bull, 55% base, and
              25% bear yields a probability-weighted exit enterprise value of approximately $1.3–1.6B— modestly above
              the $1.0–1.4B current valuation mark, suggesting the current price reflects much of the upside in a base
              case. The margin of safety is thin; entry at a forward pre-money that implies meaningful step-up from
              current valuation would be preferred. Adverse evidence that would shift weight toward bear: revenue
              disclosed below $60M in data-room diligence, any health system departure, any regulatory inquiry involving
              Truveta's data, or Genome Project sequencing milestone slip of more than 12 months relative to plan.
            claimRefs:
