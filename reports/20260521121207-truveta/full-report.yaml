      - number: '5.3'
        title: Truveta Studio, Evidence, and Intelligence
        blocks:
          - type: paragraph
            body: >-
              Truveta Studio is the cloud-hosted, subscriber-only analytics environment through which customers access
              Truveta Data. It provides four core tools: Prose, a SQL-like domain-specific query language for defining
              patient cohorts; Snapshots, which freeze and export cohort data at a specified point in time; Notebooks,
              for advanced statistical analysis and model development; and Truveta Library, a repository of validated
              clinical data definitions from which researchers can pull pre-built code sets. In March 2025, Truveta
              added two significant capabilities: feature table generation (reducing cohort-building from weeks to
              minutes by enabling rapid variable selection with row-level previews and summary statistics) and
              eligibility filters (allowing researchers to select care sites by patient diversity, rare disease volumes,
              or medical device usage). Truveta Evidence is the regulatory-grade layer of Studio, providing audit-ready
              workflows, data provenance documentation, and process controls aligned with FDA real-world evidence
              guidance for post-market surveillance, comparative effectiveness research, and regulatory submissions.
              Administrative data (admission- discharge-transfer records, billing linkage, provider resource
              allocation), added in March 2025, deepens longitudinal study capabilities including second-by-second
              patient movement tracking within facilities. Truveta Intelligence, the newest product (April 28, 2026),
              overlays a natural language AI query interface on the entire 130M-patient corpus, allowing researchers to
              ask questions in plain English and receive answers within minutes with fully inspectable underlying code
              sets and methodology. Intelligence explicitly does not establish causality and does not replace clinical
              judgment. Access to all products requires an enterprise Data subscription; no self-service trial or public
              API is available, limiting access to organizations with the budget and legal capacity to navigate the
              enterprise sales process.
