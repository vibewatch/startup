          - type: callout
            title: Single-cloud and single-sequencing-partner dependencies create concentration risk
            body: >-
              Truveta's exclusive reliance on Microsoft Azure for all data storage, AI compute, and Genome Project
              infrastructure creates a high-switching-cost single-cloud dependency. Separately, the Regeneron Genetics
              Center is the sole sequencing partner for the 10M-exome Genome Project—a sequencing throughput
