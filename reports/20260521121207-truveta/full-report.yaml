      - number: '4.4'
        title: Capital Adequacy and Funding Dependence
        blocks:
          - type: paragraph
            body: >-
              Truveta's capital formation is described in detail in the Company Overview chapter. As context for forward
              financial assessment: the company had raised approximately $515 million in total capital by April 2026,
              anchored by a $320 million Series C in January 2025 that was explicitly designated for the Truveta Genome
              Project infrastructure build-out.

              Cash position and monthly burn are not publicly disclosed. Applying a conservative scenario—annual
              operating expense of $120–$160 million (personnel, Azure, compliance, G&A) against estimated revenue of
              $80–100 million—implies a net cash burn of $20–$80 million per year before considering the Genome Project
              capex. The Series C alone, if primarily genome-dedicated, could be substantially consumed within 3–5 years
              at projected sequencing scale. A more optimistic scenario where commercial revenue grows to $150 million
              and cost discipline is maintained would extend runway further, but this requires sustained enterprise
              sales execution that is unverifiable from public information.

              The investor base creates both strengths and risks for capital adequacy. The 17 health system investors,
              Regeneron, Illumina, and Microsoft provide patient long-term capital aligned to strategic data access
              rather than short-term liquidity. However, Truveta has no confirmed path to an IPO or secondary liquidity
              event as of May 2026, and the absence of traditional VC lead investors with fund lifecycle pressures may
              reduce urgency to reach profitability or pursue a near-term exit.

              Government revenue from the CDC contract represents a real but modest diversification. The original $10.3
              million contract was partially terminated under DOGE directives in 2025, with subsequent modifications
              extending the contract to July 2026 at a reduced backlog. Total remaining backlog was only $120,000 as of
              the contract record review. This episode illustrates that government revenue—while legitimizing for
              commercial pharma customers—is operationally fragile given federal budget and policy volatility.
