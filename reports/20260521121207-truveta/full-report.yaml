  - id: FV001
    title: Recommendation Logic Flow — From Evidence to Conditional Pass
    type: flow
    layout: wide
    summary: >-
      Chain from scale/proof/risks/valuation evidence synthesized across all eight chapters to the conditional pass
      recommendation. Shows how each evidence pillar flows into the final investment decision with key gating
      conditions.
    data:
      nodes:
        - id: n1
          label: Market Opportunity
          description: $3B RWE market + $5-10B clinical genomics; 15-20% CAGR; confirmed by Chapters 1-2
        - id: n2
          label: Product Differentiation
          description: 30-health-system consortium; HITRUST R2; TLM; genomic linkage — confirmed Chapter 5
        - id: n3
          label: Customer Validation
          description: 50+ named organizations including Moderna, UCB, Boehringer Ingelheim — confirmed Chapter 6
        - id: n4
          label: Financial Opacity
          description: ~$80M ARR proxy (unconfirmed); no margin/burn/NRR disclosure — Chapter 4
        - id: n5
          label: Competitive Moat
          description: Provider-governance moat holds vs. IQVIA/Komodo/Tempus — confirmed Chapter 3
        - id: n6
          label: Risk Profile
          description: HIPAA/genomic risk HIGH; cyber HIGH; capital intensity HIGH — Chapter 7
        - id: n7
          label: Valuation Mark
          description: $1.0-1.4B (Series C Jan 2025); ~12-18x estimated ARR; fair-to-slightly-rich
        - id: n8
          label: Data Room Required
          description: ARR, Genome milestones, capital adequacy, Regeneron terms — gating conditions
        - id: n9
          label: CONDITIONAL PASS
          description: Proceed to data room; do not invest without financial disclosure; thesis breaks defined
      edges:
        - from: n1
          to: n9
          label: Market confirms TAM
        - from: n2
          to: n9
          label: Product confirms moat
        - from: n3
          to: n9
          label: Customers confirm PMF
        - from: n4
          to: n8
          label: Revenue opacity creates gate
        - from: n5
          to: n9
          label: Moat confirms durability
        - from: n6
          to: n8
          label: Risk profile creates gate
        - from: n7
          to: n8
          label: Valuation requires confirmation
        - from: n8
          to: n9
          label: Conditional on data room
    approximationNotes: >-
      Flow represents analytical logic, not causal mechanism. Evidence from prior chapters is cited directionally;
      specific chapter references are noted in node descriptions. The conditional pass recommendation requires data-room
      confirmation before proceeding.
    claimRefs:
      - CV039
      - CV040
      - CV001
      - CV004
      - CV007
