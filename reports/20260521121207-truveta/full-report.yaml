      - number: '8.2'
        title: Comparable Set — Public Companies, Private Rounds, and M&A References
        blocks:
          - type: paragraph
            body: >-
              Truveta's comparable set spans three categories: public market health-data platforms, private competitors
              at similar stages, and M&A references from health-data acquisitions. No single comparable is perfect;
              Truveta's provider-governance model, genomics layer, and revenue opacity collectively make it an outlier.
              The analysis below reflects 2026 data wherever available.

              Public comps — nearest analogs in terms of business model and revenue scale: Tempus AI (NASDAQ: TEM) is
              the closest public comp to Truveta in terms of strategy. Tempus combines clinical-genomic data from cancer
              patients with an AI analytics layer, sells to pharma and health systems, and has a stated data and
              applications segment that mirrors Truveta's commercial motion. Tempus reported Q1 2026 revenue of
              approximately $322 million and guided to $1.59–1.60 billion for full-year 2026—a revenue scale roughly
              15–20x Truveta's estimated ARR. Its enterprise value of approximately $8.9B implies a 2026E EV/Revenue of
              approximately 5.6x. This multiple includes an AI premium for a company growing over 30% annually. At a
              Tempus-equivalent 5.6x EV/Revenue multiple, Truveta's $80M proxy ARR implies an enterprise value of
              approximately $448M—below its current $1B+ valuation, which reflects the implicit market expectation that
              Truveta's revenue will ramp toward $200–300M+ before a liquidity event. Tempus's gross margin of
              approximately 63–64% also provides a benchmark for evaluating whether Truveta's revenue share to health
              systems meaningfully compresses margin below peer levels.

              IQVIA Holdings (NYSE: IQV), with 2026E revenue of approximately $17.2B and EV/Revenue of approximately
              2.6x, represents the large-cap diversified healthcare data and CRO benchmark. Its lower multiple reflects
              scale, diversification, and modest growth rates rather than high-growth SaaS characteristics. IQVIA's
              $16.3B TTM revenue (as of early 2026) and $42.6B enterprise value anchor the floor for what healthcare
              data platforms trade at when growth is predictable but not exceptional. Truveta's premium to this floor is
              justified by its growth profile, but also reflects the risk premium for revenue opacity and execution.

              Veeva Systems (NYSE: VEEV) at approximately 8.0x EV/Revenue (FY2026 revenue ~$3.2B, market cap ~$25.8B) is
              the life-sciences software premium benchmark. Veeva commands its multiple through very high recurring
              revenue retention, deep workflow lock-in in pharma, and a track record of sustained 30%+ growth before
              scale compression. Truveta does not yet demonstrate the same retention metrics or revenue visibility, but
              the Veeva multiple provides an aspirational ceiling if the Genome Project unlocks a new data-subscription
              revenue tier with comparable stickiness.

              Definitive Healthcare (DH), taken private by Advent International in 2024 after trading near $238M TTM
              revenue at approximately 0.5x EV/Revenue, is the adverse multiple-compression reference. DH suffered from
              slower growth, customer churn pressure, and competitive displacement—a cautionary analog for Truveta's
              risk scenario if pharma budget compression reduces RWD investment broadly. The DH privatization also
              illustrates the risk that public market multiples can compress rapidly for health-data platforms where
              growth and margins disappoint.

              Private comps: Komodo Health, at an estimated $3.3B valuation and approximately $200M ARR, implies a
              roughly 16.5x ARR multiple as of 2022–2024 marks. Komodo's healthcare claims data network—a different data
              source than Truveta's EHR consortium—has not generated a public exit, but secondary market pricing tracked
              by Forge Global and pre-IPO databases suggests the valuation has held. Komodo serves as a precedent that
              health-data platforms with $200M ARR can command $3B+ valuations in private markets even without near-term
              IPO catalysts. ConcertAI, with approximately $1.9B valuation and $150M raised through its 2022 Series C,
              is a closer oncology-focused analog; its August 2025 $1.3B partnership with Eli Lilly for AI-driven drug
              development—disclosed by Parsers.vc—illustrates the pharma M&A appetite for clinical AI platforms.

              M&A reference: The Roche acquisition of Flatiron Health for $1.9B in 2018 remains the canonical
              health-data M&A benchmark. Flatiron, which had raised approximately $300M in venture funding, was acquired
              for a multiple of roughly 12x revenue on a reported revenue base of approximately $150–160M. Roche's
              stated rationale was regulatory-grade real-world oncology evidence for drug development—directly analogous
              to Truveta's value proposition. A critical difference is that Flatiron had deep clinical workflow
              integration with community oncology practices (OncotypeDx electronic records), while Truveta's integration
              with health system EHRs is broader but potentially shallower per disease area. The HLTH.com analysis of
              Roche's strategic options for Flatiron in 2024 noted that channel conflict—rival pharma reluctant to share
              data with a Roche subsidiary—could suppress Flatiron's strategic value to pharma buyers, while
              simultaneously benefiting independent platforms like Truveta. A potential Flatiron divestiture could
