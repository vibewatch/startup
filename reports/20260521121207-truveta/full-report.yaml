  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Architecture
        blocks:
          - type: paragraph
            body: >-
              Truveta operates a four-segment buyer architecture that is structurally unusual in the enterprise software
              market. The first and most distinctive segment is the thirty member health systems— Providence, Advocate
              Health, Trinity Health, Tenet Healthcare, Northwell Health, AdventHealth, CommonSpirit Health, and
              twenty-three others—who function simultaneously as data contributors, platform governors, equity
              investors, and paid subscribers. According to the CHAUSA reporting and Truveta's own health systems page,
              member systems receive access to the platform as part of their paid membership and receive revenue
              reimbursement when commercial customers access their de-identified data. This dual-role structure means
              the line between "customer" and "supplier" is deliberately blurred, making straightforward customer
              concentration analysis impossible from public disclosures alone.

              The second and primary commercial segment is life sciences, encompassing pharmaceutical companies, biotech
              companies, and medical device manufacturers. Pfizer was the first confirmed major pharma customer, signing
              in June 2022 for near-real-time pharmacovigilance and COVID-19 vaccine safety monitoring. Boston
              Scientific signed in September 2022 for post-market surveillance of peripheral artery disease devices and
              healthcare-disparities research. By October 2023, Truveta disclosed more than 50 organizations across life
              sciences, government, academic medical centers, and research institutes, naming Boehringer Ingelheim (NASH
              biomarker research), Moderna (rare disease—OTCD natural history), UCB (hidradenitis suppurativa patient
              journey), Alpine Immune Sciences, Reprieve Cardiovascular, SK Life Sciences, MedComp, and Mathematica as
              members of this cohort. By November 2024, Truveta disclosed 100-plus partner organizations and named
              additional expansions to include Bayer, Eli Lilly and Co., Novartis, Stryker, American Heart Association,
              Edwards Lifesciences, GORE, Impulse Dynamics, and Gates Ventures.

              The third segment is academic and public-health research institutions. Johns Hopkins' Hopkins Business of
              Health Initiative (HBHI) represents the deepest documented academic engagement: as of 2025 it funded 25
              Phase I pilot projects from more than 40 applications and 11 Phase II projects from the Hopkins research
              community, covering autoimmune disease, metabolic risk, cancer care, maternal health, dementia, and
              substance use. Duke University was confirmed as a Truveta Data customer in October 2023. The University of
              Pennsylvania's Leonard Davis Institute hosted a 2026 fellows workshop on Truveta capabilities and research
              use cases. The University of Michigan Institute for Healthcare Policy and Innovation, the University of
              Texas Health Science Center at San Antonio, and Indiana University are among other named academic users.

              The fourth segment is government and public health. The CDC is the sole publicly confirmed government
              customer, having contracted with Truveta in January 2024 for $10.3 million over approximately 2.5 years
              for data gathering and reporting on COVID-19, maternal health, and pediatrics. That contract was partially
              terminated under DOGE directives in January 2026, leaving only $120,000 in backlog—a sharp illustration of
              government revenue fragility.
