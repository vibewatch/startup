      - number: '6.3'
        title: Retention, Durability, and Expansion Signals
        blocks:
          - type: paragraph
            body: >-
              No NRR, GRR, churn rate, cohort retention curve, or median contract length has been publicly disclosed by
              Truveta for its commercial segment as of May 2026. The company does not publish financial metrics or
              subscriber economics, and the private nature of enterprise subscription agreements means independent
              reconstruction is not possible from available evidence. This is a material diligence gap.

              Proxy evidence for retention quality does exist and is moderately encouraging for the pharma segment.
              Pfizer, signed in June 2022, is still referenced as an active Truveta customer in November 2024
              disclosures. Boston Scientific, also signed in 2022, produced new clinical research outputs from Truveta
              Data through at least 2023 and is cited in Truveta's September 2025 device data expansion announcement.
              Moderna, which joined in October 2023, continued its engagement through at least ISPOR May 2024. UCB,
              Boehringer Ingelheim, MedComp, and Mathematica, all named in October 2023, are still referenced in
              subsequent Truveta communications. The absence of any public churn announcement for any named customer
              through May 2026 suggests at minimum no prominent public departures from the pharma and device
              segments—but this is an absence of negative evidence rather than affirmative retention proof.

              The CDC contract provides the clearest evidence of contract structure: a fixed-price 2.5-year government
              contract (January 2024 through July 2026) at a value of up to $10.3 million. This is the only publicly
              verified contract term length. DOGE placed the contract on its termination list in July 2025 and it was
              partially terminated for convenience in January 2026, demonstrating government revenue is not inherently
              durable. The remaining backlog after partial termination is approximately $120,000 out of the original
              $10.3 million potential value.

              Microsoft Azure Marketplace lists Truveta Studio usage reservation tiers at $95,000, $245,000, and
              $495,000 per reservation period—these are analytics workspace usage add-ons and are not the underlying
              Truveta Data subscription price. Their existence on an enterprise marketplace suggests a structured,
              recurring commercial model rather than one-off project fees.

              Truveta Intelligence, launched April 28, 2026, is exclusively available to existing Truveta Data
              subscribers, not as a standalone product. This cross-sell-only availability is a deliberate expansion
              strategy: it deepens value within the existing subscriber base rather than broadening the top of the
              funnel. Similarly, the Truveta Genome Project targets existing pharma customers (Regeneron, Illumina as
              investors) as the primary buyers of genotypic-phenotypic linked data for drug discovery, though that
              product remains pre-commercial as of May 2026.

              Johns Hopkins HBHI's Phase II grant structure reveals a key academic retention mechanism: projects that
              demonstrate feasibility in Phase I compete for up to $25,000 in Phase II funding to support expanded data
              access fees and personnel. The requirement that budgets include Truveta data fee estimates confirms a
              fee-for-data model in the academic segment, creating a grant-cycle dependency that could introduce
              cohort-level churn as individual research projects conclude.
