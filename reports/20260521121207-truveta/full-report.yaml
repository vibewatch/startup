chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, data asset, and business model
        blocks:
          - type: paragraph
            body: >-
              Truveta is a Bellevue, Washington healthcare data company whose stated mission is “Saving Lives with
              Data.” The company began as a provider-led effort to convert fragmented electronic health record data into
              continuously updated, de-identified intelligence that could be used by researchers, clinicians,
              public-health teams, and life-sciences organizations. That provider-led origin remains central to the
              pitch: Truveta says it was built with and is governed by U.S. health systems, rather than by an insurer,
              ad-tech platform, or single academic medical center. By 2026 the company advertises a data asset spanning
              more than 130 million patients, one in three Americans, all care settings, more than ten years of history,
              and daily refreshes. The commercial model is enterprise access to Truveta Data, Truveta Evidence, and now
              Truveta Intelligence for workflows such as safety and effectiveness research, label expansion,
              clinical-trial design, therapy-adoption tracking, public-health analysis, and healthcare operations.
              Public disclosures are notably strong on platform scale, product positioning, and member-health-system
              coverage, but weak on pricing, revenue, contract structure, and current customer count beyond company
              marketing claims.
