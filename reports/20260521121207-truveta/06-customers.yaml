company:
  name: "Truveta"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Truveta serves four distinct buyer segments as of May 2026: (1) thirty member health systems that
    are simultaneously data contributors, governors, investors, and paid subscribers; (2) life-sciences
    companies—pharma, biotech, and medical-device manufacturers—who pay for data access and analytics;
    (3) academic and public-health research organizations; and (4) government agencies, principally the
    CDC. Named external customers with production-level use cases include Pfizer (first big pharma,
    June 2022), Boston Scientific (Sept 2022), Moderna, UCB, Boehringer Ingelheim, Bayer, Eli Lilly,
    Novartis, Stryker, Edwards Lifesciences, GORE, and the American Heart Association. On the academic
    side, Johns Hopkins HBHI funded 25 Phase I and 11 Phase II pilot projects; Duke University, the
    University of Pennsylvania Leonard Davis Institute, and the University of Michigan Institute for
    Healthcare Policy and Innovation are among confirmed academic users. The CDC contract ($10.3 million,
    Jan 2024–July 2026) was partially terminated under DOGE directives in January 2026, leaving only
    $120,000 in backlog. Customer count grew from 50+ (October 2023) to 100+ organizations (November
    2024); no updated count has been disclosed as of May 2026. No NRR, GRR, churn, or contract-length
    data is publicly available for the commercial segment. Truveta Intelligence (launched April 2026) is
    exclusively cross-sold to existing Truveta Data subscribers, not offered as a standalone product.
    Structural concentration risks include the dual role of member health systems (both data supply and
    revenue), the absence of granular customer economics, and demonstrated government revenue fragility.
    Privacy and patient-data ethics concerns raised by bioethicists remain an ongoing reputational risk
    that could affect corporate customer procurement decisions.

sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and Buyer Architecture"
    body: >-
      Truveta operates a four-segment buyer architecture that is structurally unusual in the enterprise
      software market. The first and most distinctive segment is the thirty member health systems—
      Providence, Advocate Health, Trinity Health, Tenet Healthcare, Northwell Health, AdventHealth,
      CommonSpirit Health, and twenty-three others—who function simultaneously as data contributors,
      platform governors, equity investors, and paid subscribers. According to the CHAUSA reporting and
      Truveta's own health systems page, member systems receive access to the platform as part of their
      paid membership and receive revenue reimbursement when commercial customers access their
      de-identified data. This dual-role structure means the line between "customer" and "supplier" is
      deliberately blurred, making straightforward customer concentration analysis impossible from
      public disclosures alone.

      The second and primary commercial segment is life sciences, encompassing pharmaceutical companies,
      biotech companies, and medical device manufacturers. Pfizer was the first confirmed major pharma
      customer, signing in June 2022 for near-real-time pharmacovigilance and COVID-19 vaccine safety
      monitoring. Boston Scientific signed in September 2022 for post-market surveillance of peripheral
      artery disease devices and healthcare-disparities research. By October 2023, Truveta disclosed
      more than 50 organizations across life sciences, government, academic medical centers, and research
      institutes, naming Boehringer Ingelheim (NASH biomarker research), Moderna (rare disease—OTCD
      natural history), UCB (hidradenitis suppurativa patient journey), Alpine Immune Sciences, Reprieve
      Cardiovascular, SK Life Sciences, MedComp, and Mathematica as members of this cohort. By November
      2024, Truveta disclosed 100-plus partner organizations and named additional expansions to include
      Bayer, Eli Lilly and Co., Novartis, Stryker, American Heart Association, Edwards Lifesciences,
      GORE, Impulse Dynamics, and Gates Ventures.

      The third segment is academic and public-health research institutions. Johns Hopkins' Hopkins
      Business of Health Initiative (HBHI) represents the deepest documented academic engagement: as of
      2025 it funded 25 Phase I pilot projects from more than 40 applications and 11 Phase II projects
      from the Hopkins research community, covering autoimmune disease, metabolic risk, cancer care,
      maternal health, dementia, and substance use. Duke University was confirmed as a Truveta Data
      customer in October 2023. The University of Pennsylvania's Leonard Davis Institute hosted a
      2026 fellows workshop on Truveta capabilities and research use cases. The University of Michigan
      Institute for Healthcare Policy and Innovation, the University of Texas Health Science Center at
      San Antonio, and Indiana University are among other named academic users.

      The fourth segment is government and public health. The CDC is the sole publicly confirmed
      government customer, having contracted with Truveta in January 2024 for $10.3 million over
      approximately 2.5 years for data gathering and reporting on COVID-19, maternal health, and
      pediatrics. That contract was partially terminated under DOGE directives in January 2026,
      leaving only $120,000 in backlog—a sharp illustration of government revenue fragility.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU008, CU020, CU021]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: "named-customer-proof"
    title: "Named Customer Proof and Production-Level Use Cases"
    body: >-
      The depth of named customer evidence varies materially across segments, ranging from detailed
      co-authored case studies with named executives and outcome metrics (pharma segment) to logo-level
      disclosure with no project description (some device and academic cases). The strongest proof comes
      from the pharmaceutical and biotech segment.

      Pfizer's use case is the most senior in tenure. Signed in June 2022 as Truveta's first major
      pharma customer, Pfizer uses Truveta Data to identify, monitor, and evaluate potential safety
      signals in near-real time across its product portfolio, including COVID-19 vaccine Comirnaty.
      Pfizer's Chief Medical Officer publicly quoted Truveta as providing "one of the most timely and
      complete datasets available in the United States," enabling the company to "learn directly from
      de-identified patient data at an unprecedented pace and scale." This is a production-level safety
      surveillance deployment, not a pilot.

      Boston Scientific signed a strategic collaborative agreement with Truveta in September 2022 to
      study post-procedure patient outcomes and healthcare disparities in peripheral artery disease (PAD),
      venous thromboembolic disease, and interventional oncology. An initial PAD analysis using Truveta
      Data found that Black or African American patients with PAD were less likely to undergo
      revascularization procedures (1.0% vs. 2.6% for white patients) and less likely to receive
      drug-eluting stents. The collaboration also underpins the REAL-PE Analysis, a published real-world
      study of ultrasound-assisted catheter-directed thrombolysis in pulmonary embolism presented at
      JSCAI in 2023. Medcomp, a dialysis device manufacturer, published a case study using Truveta
      Data to compare hemodialysis catheter designs and uncover product safety and development insights.
      In September 2025, Truveta expanded its device data capabilities by integrating unique device
      identifier (UDI) data with minute-level ADT and chargemaster data, citing more than 300,000 UDIs
      across 27,000-plus brands, with device records and clinical notes for more than 10 million patients.

      Moderna's use case was publicly co-presented at ISPOR in May 2024, with Moderna's own Director of
      Epidemiology for Rare Disease presenting. Moderna uses Truveta Data to study ornithine
      transcarbamylase deficiency (OTCD), a rare genetic enzyme deficiency, specifically to understand
      patient burden, treatment patterns, and potential clinical trial endpoints where limited traditional
      data sources are available. UCB uses Truveta Data to study the patient journey in hidradenitis
      suppurativa (HS), an underdiagnosed chronic inflammatory skin disease, gaining insight into sites
      of care, time to diagnosis, and intervention history. Boehringer Ingelheim is using Truveta Data
      to study NASH biomarkers extracted from pathology reports and clinician notes, accelerating
      diagnosis and treatment pathway identification.

      Johns Hopkins HBHI represents the highest-documented academic adoption. The 2025 pilot program
      attracted more than 40 applications from across Johns Hopkins, awarded 25 Phase I pilots with
      modest feasibility grants, and progressed 11 projects to Phase II with awards of up to $25,000
      each including Truveta data fee coverage. Research projects span autoimmune disease, dementia,
      oncology, maternal health, substance use, and health services research—all using Truveta as the
      primary data infrastructure. A monthly HBHI-Truveta User Community meeting consolidates learnings.

      The DIA Real World Evidence Conference 2025 featured a Truveta-hosted case study session presenting
      two production examples: a GLP-1 comparative effectiveness study that produced results more than a
      year ahead of a major clinical trial and was later validated by that trial, and a device
      manufacturer study replicating registry outcomes with a larger, more contemporary patient cohort.
      These conference presentations confirm that Truveta's customers are achieving research timelines
      significantly faster than traditional methods.
    claimRefs: [CU009, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU022, CU023, CU024]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]

  - id: "retention-durability-expansion"
    title: "Retention, Durability, and Expansion Signals"
    body: >-
      No NRR, GRR, churn rate, cohort retention curve, or median contract length has been publicly
      disclosed by Truveta for its commercial segment as of May 2026. The company does not publish
      financial metrics or subscriber economics, and the private nature of enterprise subscription
      agreements means independent reconstruction is not possible from available evidence. This is a
      material diligence gap.

      Proxy evidence for retention quality does exist and is moderately encouraging for the pharma
      segment. Pfizer, signed in June 2022, is still referenced as an active Truveta customer in
      November 2024 disclosures. Boston Scientific, also signed in 2022, produced new clinical research
      outputs from Truveta Data through at least 2023 and is cited in Truveta's September 2025 device
      data expansion announcement. Moderna, which joined in October 2023, continued its engagement
      through at least ISPOR May 2024. UCB, Boehringer Ingelheim, MedComp, and Mathematica, all named
      in October 2023, are still referenced in subsequent Truveta communications. The absence of any
      public churn announcement for any named customer through May 2026 suggests at minimum no prominent
      public departures from the pharma and device segments—but this is an absence of negative evidence
      rather than affirmative retention proof.

      The CDC contract provides the clearest evidence of contract structure: a fixed-price 2.5-year
      government contract (January 2024 through July 2026) at a value of up to $10.3 million. This is
      the only publicly verified contract term length. DOGE placed the contract on its termination list
      in July 2025 and it was partially terminated for convenience in January 2026, demonstrating
      government revenue is not inherently durable. The remaining backlog after partial termination is
      approximately $120,000 out of the original $10.3 million potential value.

      Microsoft Azure Marketplace lists Truveta Studio usage reservation tiers at $95,000, $245,000,
      and $495,000 per reservation period—these are analytics workspace usage add-ons and are not the
      underlying Truveta Data subscription price. Their existence on an enterprise marketplace suggests
      a structured, recurring commercial model rather than one-off project fees.

      Truveta Intelligence, launched April 28, 2026, is exclusively available to existing Truveta Data
      subscribers, not as a standalone product. This cross-sell-only availability is a deliberate
      expansion strategy: it deepens value within the existing subscriber base rather than broadening
      the top of the funnel. Similarly, the Truveta Genome Project targets existing pharma customers
      (Regeneron, Illumina as investors) as the primary buyers of genotypic-phenotypic linked data for
      drug discovery, though that product remains pre-commercial as of May 2026.

      Johns Hopkins HBHI's Phase II grant structure reveals a key academic retention mechanism: projects
      that demonstrate feasibility in Phase I compete for up to $25,000 in Phase II funding to support
      expanded data access fees and personnel. The requirement that budgets include Truveta data fee
      estimates confirms a fee-for-data model in the academic segment, creating a grant-cycle dependency
      that could introduce cohort-level churn as individual research projects conclude.
    claimRefs: [CU007, CU010, CU020, CU021, CU022, CU025, CU026, CU027, CU028, CU029, CU030, CU033, CU034]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: "concentration-procurement-adverse"
    title: "Concentration Risk, Procurement Friction, and Adverse Evidence"
    body: >-
      Truveta faces at least three distinct concentration-risk vectors. The first is structural: the
      thirty member health systems function as Truveta's largest and most durable customer cohort, but
      they are also the sole source of the de-identified clinical data on which all external commercial
      revenue depends. Member attrition therefore creates a dual shock—simultaneously reducing data
      supply quality and removing a paying subscriber. No member has publicly departed, but no public
      contractual commitment duration has been disclosed. The CHAUSA reporting confirms that member
      systems "get access to [Truveta data] as part of their paid membership," and the health-systems
      page describes a revenue-reimbursement model for data contributors. The financial terms of this
      arrangement—membership fees, revenue shares, minimum contribution obligations—are not public.

      The second concentration risk is on the external commercial side. As of May 2026, no customer
      contributes a known share of revenue, since ARR, customer revenue distribution, and ACV data
      are not disclosed. Truveta's last public customer count is 100+ organizations (November 2024).
      With no update for six months as of May 2026, the count could be higher or stable but cannot be
      confirmed. Even if the count is materially larger, the revenue distribution among a small number
      of large pharma accounts versus a long tail of smaller academic and device customers is unknown.
      Pharma mega-cap customers (Pfizer, Eli Lilly, Novartis, Bayer) likely represent a
      disproportionate share of commercial revenue if they hold enterprise licenses, creating
      concentration risk that is entirely opaque from public disclosures.

      The third concentration risk is government revenue. The CDC contract termination reduces
      government revenue contribution to essentially zero for the near term and illustrates that
      federal contracts cannot be relied upon for durable base revenue in the current US policy
      environment. The broader DOGE-driven federal contract disruption in 2025–2026 suggests this
      is a category-level risk rather than Truveta-specific.

      On procurement friction, enterprise pharma deals require 6–18 months from initial contact to
      contract close, involve clinical operations, regulatory affairs, and legal teams on both sides,
      often require a proof-of-concept study before full subscription commitment, and carry high
      customer acquisition costs with payback periods exceeding 15 months by industry benchmark.
      Academic procurement at Johns Hopkins required applicants to identify Truveta data fee budget
      lines in grant proposals, satisfy IRB oversight, and demonstrate Phase I feasibility before
      qualifying for Phase II funding—a multi-step procurement friction that limits rapid adoption.
      The ISPOR and DIA conference presentations indicate that Truveta invests significantly in
      conference-sponsored sessions (hosted non-CE case studies) as customer engagement, which is
      consistent with a high-touch, relationship-driven sales model.

      On adverse evidence, bioethicists cited in AIBrew News compared Truveta's model of monetizing
      de-identified patient data for commercial research to "Soylent Green," raising consent and
      commodification concerns. While Truveta applies HIPAA Expert Determination de-identification and
      additional technical controls, critics argue that the combination of EHR, claims, SDOH, and
      genomic data at scale creates re-identification risks that are not fully addressed by current
      legal standards. Corporate pharmaceutical customers and academic IRBs are sensitive to
      reputational risk from patient-privacy incidents; a future de-identification failure could
      trigger customer-review processes and procurement delays even if no legal violation occurs.
      Truveta has not publicly disclosed the results of any independent third-party de-identification
      audit against re-identification attack vectors.
    claimRefs: [CU003, CU006, CU031, CU032, CU035, CU036, CU037, CU038, CU039, CU040]
    tableRefs: [TU005]

callouts:
  - calloutType: "strength"
    title: "Named pharma customer roster spans early movers plus 2024 mega-cap expansion — strong proof of concept"
    body: >-
      Truveta's named customer list has evolved from early adopters (Pfizer, Boston Scientific in 2022,
      Moderna/UCB/Boehringer Ingelheim in 2023) to include major pharma cap-table names—Bayer, Eli Lilly,
      Novartis—and medical device leaders including Stryker and Edwards Lifesciences by November 2024.
      The progression demonstrates both product maturation and broadening segment penetration. Pfizer's
      continued presence from 2022 through at least 2024 in Truveta's public disclosures, and the
      ISPOR conference co-presentation with Moderna, provide the highest-quality bilateral evidence of
      production-level use. The GLP-1 study at DIA 2025 that anticipated trial results by a year and
      was subsequently validated by the trial is the strongest outcome proof yet published.
    claimRefs: [CU011, CU013, CU016, CU017]

  - calloutType: "risk"
    title: "No NRR, GRR, or customer count update in 6 months — financial opacity blocks retention underwriting"
    body: >-
      The absence of any updated customer count since November 2024, combined with zero publicly
      disclosed NRR, GRR, or churn data, means investors and strategic partners cannot independently
      underwrite the durability of Truveta's revenue base. The proxy evidence—continued naming of
      2022-2023 cohort customers and absence of public churn—is encouraging but not analytically
      sufficient. The CHAUSA article confirms that member health systems get access "as part of their
      paid membership" but the financial terms of that membership are undisclosed. Enterprise pharma
      contracts of 6–18 month sales cycles imply multi-year lock-in, but contract length and
      auto-renewal terms are not public. Retention underwriting requires a non-public data room.
    claimRefs: [CU025, CU030, CU031, CU033]

  - calloutType: "risk"
    title: "CDC contract partial termination demonstrates government revenue is not durable"
    body: >-
      The $10.3 million CDC contract—Truveta's only publicly confirmed government customer—was placed
      on the DOGE termination list in July 2025 and partially terminated for convenience in January 2026,
      leaving only $120,000 of backlog. This outcome eliminates government revenue as a reliable base
      in the near term and illustrates that federal contracts in health data analytics are vulnerable to
      policy-driven disruption. While the CDC contract was commercially legitimizing (competitive
      procurement with 5 bids), its abrupt termination demonstrates a risk category—government revenue
      fragility—that is structural in the current US regulatory and executive-branch environment.
    claimRefs: [CU020, CU021, CU022, CU032]

  - calloutType: "risk"
    title: "Patient data ethics concerns from bioethicists could complicate enterprise procurement"
    body: >-
      Bioethicists cited in AIBrew News described Truveta's model of monetizing linked EHR and genomic
      data for commercial research as raising consent, commodification, and re-identification concerns.
      Corporate pharmaceutical compliance teams and academic IRBs are sensitive to vendor reputational
      risk. While Truveta applies HIPAA Expert Determination de-identification and additional technical
      controls, the absence of a published independent third-party re-identification audit creates a
      diligence gap that could surface during corporate procurement reviews. A future privacy incident—
      even if legally compliant—could trigger reviews and procurement delays at existing customers.
    claimRefs: [CU037, CU038, CU039]

