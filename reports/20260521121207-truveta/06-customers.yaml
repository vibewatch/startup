figures:
  - id: "FU001"
    title: "Truveta Customer Journey Map — Segments, Touchpoints, and Expansion Loops"
    type: journey-map
    layout: wide
    summary: >-
      Four customer segments (member health systems, pharma/biotech, academic/public health, government)
      mapped across their discovery, procurement, onboarding, use, and expansion touchpoints with
      Truveta's product suite as of May 2026.
    approximationNotes: >-
      Journey constructed from public announcements, RFP documentation, and conference presentations.
      Internal CRM, sales-cycle lengths, and conversion rates are not public. Member health system
      journey is structurally distinct because members are also governors and data contributors.
    data:
      nodes:
        - id: "seg-a"
          label: "Pharma / Biotech"
          description: "Large pharma (Pfizer, Lilly, Novartis) and biotech (Moderna, UCB); use Truveta for safety surveillance, label expansion, rare disease natural history, and regulatory RWE generation."
        - id: "seg-b"
          label: "Medical Device"
          description: "Boston Scientific, Stryker, Medcomp, GORE, Edwards; use Truveta for post-market surveillance, UDI-level outcomes research, HEOR, and disparity analysis."
        - id: "seg-c"
          label: "Academic / Public Health"
          description: "Johns Hopkins, Duke, UPenn LDI, Indiana University, AHA; use Truveta for comparative effectiveness, health services research, AI model training, and grant-funded clinical studies."
        - id: "seg-d"
          label: "Member Health Systems"
          description: "30 founding/joined health systems; contribute data daily, receive revenue reimbursement, and access platform for internal research and quality benchmarking."
        - id: "touch-1"
          label: "Discovery & Qualification"
          description: "Conference presentations (ISPOR, DIA, HLTH), press releases, peer-reviewed publications citing Truveta Data; inbound demo requests via truveta.com."
        - id: "touch-2"
          label: "Proof of Concept"
          description: "Pilot study design; Truveta partner success team support; academic: competitive RFP (e.g., HBHI Phase I); pharma: in-house feasibility study using trial data."
        - id: "touch-3"
          label: "Enterprise Contract"
          description: "Legal, clinical, regulatory, and IT review; 6–18 month cycle for pharma; academic: grant award covers Truveta data fees; government: competitive procurement."
        - id: "touch-4"
          label: "Production Use"
          description: "Truveta Studio/Evidence cohort builds; Prose queries; feature table generation; audit-ready provenance; safety surveillance pipelines."
        - id: "touch-5"
          label: "Expansion"
          description: "Truveta Intelligence cross-sell (launched Apr 2026); additional therapeutic area licenses; Genome Project data access (pre-commercial); new use cases within same organization."
    claimRefs: [CU001, CU002, CU003, CU004, CU011, CU012, CU014, CU027, CU034]

