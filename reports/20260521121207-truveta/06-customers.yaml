          values:
            - value: 95
              label: "~95% estimated; all 2022-2023 named customers still referenced in 2024 disclosures; no public churn"
            - value: 85
              label: "~85% estimated; multi-year enterprise contracts expected; no confirmed churns but 2+ year proxy window limited"
        - label: "Academic / public health segment"
          values:
            - value: 80
              label: "~80% estimated; grant-funded projects complete in 12 months; new cycle required for continuation"
            - value: 60
              label: "~60% estimated; grant-cycle dependency creates material churn risk at project completion; not all projects renew"
        - label: "Government segment (CDC proxy)"
          values:
            - value: 75
              label: "~75% estimated; CDC contract ran full Year 1 (2024); partially terminated in early Year 2 under DOGE (2025)"
            - value: 10
              label: "~10% estimated; DOGE partial termination reduced CDC backlog to $120K; effectively zero renewal revenue"
    claimRefs: [CU025, CU026, CU030, CU031, CU032, CU033]

