  - id: "FU004"
    title: "Estimated Retention Cohort by Segment — Proxy Based on Public Evidence (May 2026)"
    type: cohort
    layout: standard
    summary: >-
      Proxy retention cohort for three Truveta customer segments across Year 1 and Year 2 post-contract,
      estimated from publicly observable signals (continued naming in announcements, published outputs,
      contract records). Actual NRR/GRR are not publicly disclosed. Values are analyst estimates and
      should not be taken as company-reported retention figures.
    approximationNotes: >-
      No Truveta retention data is publicly disclosed. Pharma/biotech values are estimated from the
      observation that all named pharma customers from 2022-2023 continue to be referenced in 2024-2025
      disclosures with no public churn events. Academic values reflect grant-cycle dependency and project
      conclusion risk. Government value reflects actual CDC contract partial termination under DOGE.
      All values are analyst proxies; request actual NRR and GRR from Truveta in diligence.
    data:
      columns:
