  claims:
    - id: CV001
      statement: >-
        Truveta completed a $320 million Series C financing in January 2025 at a post-money valuation
        explicitly described as above $1 billion, making it Seattle's newest unicorn at the time of the
        raise; total lifetime funding is approximately $500–515 million across all rounds.
      type: observed
      topic: "Series C financing and unicorn valuation"
      sourceRefs: [SV016, SV017, SV018]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV001, QV002]
    - id: CV002
      statement: >-
        The seventeen health system investors, Regeneron ($119.5M), and Illumina ($20M) in Truveta's
        Series C are strategic investors whose data-access rights, exclusivity provisions, and potential
        acquisition options embedded in the investment terms are not publicly disclosed, creating a
        governance and preference-stack uncertainty for prospective investors.
      type: observed
      topic: "Series C investor rights and governance opacity"
      sourceRefs: [SV016, SV030, SV026]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV004, QV024]
    - id: CV003
      statement: >-
        The GetLatka analyst database estimates Truveta's 2024 ARR at approximately $80 million, with
        a capital efficiency ratio of approximately 2.72x relative to total funding; this estimate is
        not confirmed by Truveta and represents the best available public proxy for financial diligence
        orientation.
      type: estimated
      topic: "ARR proxy and capital efficiency"
      sourceRefs: [SV003, SV004]
      confidence: low
      freshness: current
      answersQuestionRefs: [QV003]
    - id: CV004
      statement: >-
        Premier Alternatives' private market valuation tracker cites a $1.4B valuation mark for
        Truveta as of 2026, consistent with the $1B+ Series C post-money but suggesting modest step-up
        in secondary market pricing; this is a third-party estimate, not a confirmed transaction.
      type: estimated
      topic: "Secondary market valuation mark 2026"
      sourceRefs: [SV004, SV017]
      confidence: low
      freshness: current
      answersQuestionRefs: [QV001]
    - id: CV005
      statement: >-
        Truveta's investment thesis is grounded in five mutually reinforcing pillars: large and
        growing market, provider-governance moat, validated customer base, genomics optionality, and
        strong management team — each individually compelling, collectively constituting a strategic
        case for investment that has attracted 17 health systems, Regeneron, and Illumina as co-investors.
      type: inferred
      topic: "Investment thesis synthesis"
      sourceRefs: [SV016, SV028, SV026]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV001]
    - id: CV006
      statement: >-
        The core anti-thesis is revenue opacity: no ARR, gross margin, net revenue retention, customer
        concentration, or operating cash flow has been publicly disclosed by Truveta since its founding
        in 2020, making precise underwriting of the $1B+ valuation impossible without non-public data.
      type: observed
      topic: "Revenue opacity — primary investment constraint"
      sourceRefs: [SV003, SV022]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV026, QV027]
    - id: CV007
      statement: >-
        Entry discipline requires acknowledging that the $1.0–1.4B valuation at an estimated $80M ARR
        implies approximately 12–18x ARR — above the median for private health-data platforms but
        consistent with the Komodo Health implied ARR multiple (~16.5x ARR at $3.3B valuation and $200M ARR)
        and below the Flatiron Health M&A multiple (~12x revenue at $1.9B acquisition price).
      type: inferred
      topic: "Entry ARR multiple analysis"
      sourceRefs: [SV005, SV008, SV018]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV017]
    - id: CV008
      statement: >-
        The Truveta Genome Project's target of 10 million exome sequences requires capital intensity
        that substantially exceeds the $320M Series C; at sequencing costs of $50–200 per exome and a
        full sequencing program cost estimate of $500M to $2B over the project lifetime, multi-round
        financing is likely, creating dilution risk for investors entering at the current Series C
        valuation.
      type: inferred
      topic: "Genome Project multi-round capital requirement"
      sourceRefs: [SV028, SV029, SV031]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002]
    - id: CV009
      statement: >-
        The partial CDC contract termination in January 2026 under DOGE, reducing the backlog from
        $10.3M to approximately $120K remaining, demonstrated that government revenue is not durable
        for health-data platforms in the current federal budget environment and should not be included
        in base-case revenue growth projections.
      type: observed
