          label: "Competitive Moat"
          description: "Provider-governance moat holds vs. IQVIA/Komodo/Tempus — confirmed Chapter 3"
        - id: "n6"
          label: "Risk Profile"
          description: "HIPAA/genomic risk HIGH; cyber HIGH; capital intensity HIGH — Chapter 7"
        - id: "n7"
