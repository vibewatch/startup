      - number: '7.2'
        title: 运营、数据质量与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              健康数据平台是勒索软件攻击和数据泄露率最高的行业之一。Truveta 的架构制造了具体网络安全风险：来自 30 家卫生系统的数据被汇聚、标准化，并存储在 Microsoft Azure
              上的中心化平台中。平台层一旦被攻破，将同时暴露 130 million 以上患者的去标识化记录，并可能在全部 30 家成员卫生系统和商业客户之间触发 HIPAA 业务伙伴协议（Business Associate
              Agreement）责任。Cloud Security Alliance 2026 年健康云安全分析把多租户健康数据聚合方列为国家支持行为体寻求人群级健康情报的重点目标。Truveta 的 HITRUST R2
              认证有力证明了安全流程成熟度，但不能保证不会发生泄露；Truveta 关于 HITRUST 认证的博客也承认，认证是需要年度维护的持续过程。

              数据质量和完整性风险是重大的运营问题。来自 30 家卫生系统的 EHR 数据天然异构：不同 Epic 配置、编码实践差异，以及特定疾病领域或患者人群覆盖缺口，都会给研究输出带来系统性偏差风险。Truveta
              自己的数据质量白皮书描述了多层质量保证流程，包括标准化、去重和偏差监测；但这些都是公司自述，没有引用独立第三方审计结果。Truveta
              关于真实世界数据质量方法的博客记录了公司追踪的数据完整性、及时性、准确性和来源等具体维度。不过，没有独立准确性审计把 Truveta 的整理后数据与源记录进行比较；按疾病领域或患者人群拆分的系统性完整率也未披露。

              SIIT.co 对 Truveta 基因组数据库的分析指出，把基因组序列与临床记录相连会放大数据质量要求：WGS
              数据中的意义未明基因组变异，如果配上不完整的用药或诊断记录，会在下游研究中形成叠加错误风险。因数据质量问题导致客户流失是可能的，但尚未确认；公开资料中没有客户因数据质量流失的记录。Truveta
              依赖贡献卫生系统的 EHR 数据，这形成结构性依赖：如果卫生系统为保护竞争敏感性而降低数据贡献质量或覆盖范围，Truveta 的数据优势会被侵蚀。运营人员风险中等，因为领导层连续性较强（CEO Terry
              Myerson 自创立以来任职），但公司位于 Seattle 地区，需要与 Amazon、Microsoft 和其他大型雇主争夺数据科学和临床信息学人才。
