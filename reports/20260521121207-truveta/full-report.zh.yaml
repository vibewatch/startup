          - type: callout
            title: 分析师 TAM 分歧提示市场边界风险未解
            body: >
              五家知名分析机构对同一年（2026 年）的 RWE 市场估计相差超过 4×：从 $2.7B 到
              $5.4B，取决于范围。这不是随机噪音，而是市场是否包括数据资产、分析服务或二者的系统性分歧。如果更窄定义胜出，Truveta 的总可用市场（TAM）更接近 $3B，而不是
              $10B+，渗透率假设必须重新校准。Truveta 的投资者和管理层不应在未明确范围口径匹配前使用任何单一分析师数字。
