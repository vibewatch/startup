        - 确认首批商业基因组数据客户承诺；评估 Regeneron 是否保留优先访问条款
      - - 高校机构模式复制扩张
        - 扩张驱动因素
        - JHU HBHI 模式可复制到其他 R1 大学；每所机构都可能成为多 PI 企业级订阅方
        - 中 — JHU 试点已成熟；尚未披露向其他高校扩展的具名案例
        - 统计正在评估中的 R1 大学数量；确认是否已有机构许可证定价
      - - 医疗器械数据扩展（Sept 2025）
        - 扩张驱动因素
        - 新增 UDI/ADT/chargemaster 能力面向完整器械制造商市场，不止现有 BSci 和 Stryker 客户
        - 高 — 官方产品公告披露了具体技术能力
        - 跟踪 Sept 2025 扩展公告后的新增器械客户签约
      - - 成员医疗系统流失
        - 集中度风险
        - 即便只流失一家大型成员，也会同时拿走数据供给和收入；供给冲击会波及所有客户细分
        - 中 — 治理结构中可见的结构性风险；迄今未见公开退出
        - 索取成员合同承诺条款；评估董事会一致性和退出条款
      - - 大型药企收入集中
        - 集中度风险
        - Pfizer、Eli Lilly、Novartis、Bayer 合计可能占收入的过高比例；没有披露证实或否认
        - 低 — 属推测；没有公开 ACV 数据
        - 索取前 10 大客户收入占总 ARR 的比例
      - - 政府收入的政策脆弱性
        - 集中度风险
        - CDC 合同已终止；2025–2026 年更广泛的联邦预算环境对健康数据研究支出不友好
        - 高 — USASpending 和 HigherGov 记录确认已终止
        - 评估剩余联邦管线，以及若没有新政府合同落地，商业业务能否抵消
      - - 隐私 / 声誉风险影响客户采购
        - 集中度风险
        - 生物伦理学者批评和患者数据商业化媒体报道，可能触发企业客户隐私审查
        - 中 — AIBrew 报道确认负面报道；迄今没有客户流失归因于隐私顾虑
        - 跟踪隐私相关媒体报道；评估新增基因组数据是否触发药企客户新的 IRB 或采购审查
    notes: 扩张与集中度评估基于可获得的公开证据。所有财务集中度指标都需要非公开客户数据。尽调路径反映标准企业 SaaS 尽调请求，并按 Truveta 的联盟结构做了调整。
