        - IQVIA 拥有 93K 名员工的销售网络，并捆绑 CRO 服务，在制药企业级合同中占优
        - IQVIA 在竞争性 RFP 中对 Truveta 的胜率（未公开）
      - - 收入质量
        - 企业级制药订阅模式，切换成本高（数据验证周期 12–24 个月）
        - 收入完全不透明；制药企业的 RWD 预算可自由裁量，也容易被压缩
        - 数据室披露的 ARR、NRR 和流失率
      - - 基因组学可选性
        - Regeneron 的 $119.5M 和 Illumina 的 $20M 战略投资，从最高层面验证 Genome Project 逻辑
        - Genome Project 全周期需要 $500M–2B 资本；$320M Series C 可能不够；存在多轮稀释风险
        - 到 2027 年 1 月的 Genome Project 测序里程碑和已签商业合同
      - - 退出路径
        - 战略买方对医疗健康数据平台的并购需求很强；Flatiron（$1.9B，2018）和 Komodo（$3.3B 私有市场估值）提供先例
        - 由 17+ 家医疗系统投资人支撑的医疗系统治理型股权结构，让治理变复杂，可能削弱 M&A 可选性
        - 任何高于当前估值的 M&A 接洽或老股交易
      - - 监管风险
        - HITRUST R2 认证和公共事业框架倡议，显示其合规姿态主动
        - 基因组数据与 EHR 关联后，会产生当前安全港标准无法完全覆盖的 HIPAA 重新识别风险
        - HHS OCR 针对基因组数据去标识化的指引；未披露执法行动
