            title: FDA 2026 指南创造结构性需求催化
            body: >
              2026 年 1 月和 3 月 FDA 指南更新，是 Truveta 近期最重要的单一需求驱动因素。医疗器械去标识化数据路径与药物 ICH M14 采纳合在一起，验证了 EHR 关联、去标识化 RWD
              平台的监管合法性——正是 Truveta 提供的产品类型。此前无法为 RWE 平台支出找到理由的制药团队，现在面对监管激励，需要在下一次 NDA 或适应症扩展申报前，标准化采用具备可信资质的平台。
