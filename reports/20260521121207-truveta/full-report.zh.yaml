      - number: '2.2'
        title: 市场规模——TAM、SAM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              分析师对 Truveta 主要市场（RWE 解决方案）的估计差异很大，取决于范围定义、地域覆盖，以及是否纳入服务收入而非仅数据收入。The Business Research Company 将 RWE
              解决方案市场估为 2025 年 $2.33B、2030 年 $4.81B，CAGR 15.6%。Global Market Insights 乐观得多：2026 年 $3.1B，到 2035 年增至
              $11.9B，CAGR 16.3%。Grand View Research 更保守，估计 2025 年 $3.04B、2033 年 $6.04B，CAGR 9.08%。Roots Analysis 对 2030
              年的 $4.5B 目标比 GMI 估计低逾 $2B。四个来源对 2026 年 RWE 解决方案市场给出的 $2.7B–$3.1B 区间，反映的是边界分歧：更宽口径纳入数据授权、CRO
              服务和上市后安全合同，更窄定义则排除这些项。相邻 RWD 市场（仅数据资产）更小，估计也更集中：TBRC 和 Coherent Market Insights 均预计 2025–2026 年为
              $2.0–$2.7B，并以 14–16% CAGR 增至 2030 年。母市场医疗分析更大，MarketsandMarkets 预计到 2030 年达 $166.65B（24.6% CAGR），Mordor
              Intelligence 则仅 2026 年临床数据分析就估为 $125.73B——这些数字说明，一旦纳入医院 IT 和运营分析，总额会被放大。Truveta 的可服务市场（SAM）窄得多：需要 EHR
              关联、去标识化、多系统美国数据来生成证据的制药和生物科技研发买方。没有公开分析师精确拆分这一口径，构成尽调缺口。
