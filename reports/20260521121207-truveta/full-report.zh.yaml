      - number: '3.2'
        title: 直接现有玩家——IQVIA、Flatiron、Tempus 和 ConcertAI
        blocks:
          - type: paragraph
            body: >-
              IQVIA 是规模最大、扎根最深的竞争者。其年收入 $16.31B（TTM 2026）、93,000 名员工，以及 CRO 加数据加分析的一体化栈，使其成为大型药企 RWE 采购的默认选择。IQVIA
              的数据资产混合授权理赔数据流、药房数据，以及来自商业合作的结构化 EHR
              数据，而不是直接由医疗服务机构治理；相比医疗服务机构拥有的模型，这限制了去标识化来源透明度。它的分销优势——多年期企业协议、深厚监管咨询能力和全球销售队伍——是 Truveta
              面临的最持久竞争威胁。Flatiron Health 在 2018 年以 $1.9B 被收购后，作为 Roche Group 的独立关联公司运营。它的竞争强项是深度肿瘤数据整理：覆盖美国、英国、德国和日本的
              4,700+ 医疗服务机构、1,600 个站点，累计 500 万+患者历程，并拥有纵向数据。2026 年 5 月推出的 Flatiron Telescope 为生命科学团队加入自然语言 AI 队列生成，直接与
              Truveta Intelligence 竞争。不过，Roche 据称评估战略剥离 Flatiron，说明药企母公司所有权会制造渠道冲突，令非 Roche 药企伙伴望而却步；这是一项结构性拖累，反而有利于
              Truveta 的独立定位。Flatiron 只覆盖肿瘤；非肿瘤疾病、初级护理和心脏病学都是证据缺口。Tempus AI 是增长最快的直接竞争者。作为 NASDAQ 上市公司（TEM），Tempus 报告
              2026 年 Q1 收入 $348.1M（同比 +36%），Data and Applications（RWD 授权细分）收入 $87.0M（同比 +41%）。其 2026 年 $1.59B–$1.60B
              指引，以及与 Merck、Gilead、AstraZeneca 的战略合作，使其成为肿瘤领域重要的多模态数据提供商。与 Flatiron 类似，Tempus 锚定肿瘤诊断；非肿瘤 RWD
              触达有限。ConcertAI 提供 AI 驱动的肿瘤 RWD 套件（理赔、EHR、基因组学），产品包括 CARAai、SmartLinQ 和用于临床试验招募及证据生成的新 Precision
              Suite，但其公开规模和融资披露弱于 IQVIA 或 Tempus。
