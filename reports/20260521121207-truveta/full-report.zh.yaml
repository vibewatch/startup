  - id: TR001
    title: 监管 / 法律风险登记表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal identified regulatory, privacy, and legal risk vectors for Truveta as of May 2026. Does not
        include all conceivable legal risks; focuses on publicly evidenced or structurally inherent risks based on the
        Genome Project launch and enforcement landscape.
    columns:
      - 风险
      - 类别
      - 发生可能性（2026）
      - 潜在影响
      - 缓释证据
      - 剩余敞口
      - 尽调事项
    rows:
      - - HIPAA 去标识化不足以覆盖基因组数据
        - 监管
        - 中 — HHS 指引和法律研究确认风险；当前没有执法行动
        - 高 — 可能要求暂停 Genome Project 商业数据访问，或重构同意架构
        - HITRUST R2；自述去标识化协议；没有针对基因组-EHR 关联的 OCR 指引
        - 中-高 — 在现行 HIPAA 框架下，基因组数据再识别风险结构性难解
        - 获取 Truveta 对基因组去标识化标准的法律意见；确认是否寻求过 OCR 非正式指引
      - - FTC 执法行动 — 健康数据二次使用
        - 监管
        - 低-中 — FTC 在 2025 年发起首起基因数据执法行动；Truveta 尚未被点名
        - 高 — FTC 命令曾要求平台关停并通知消费者（如 BetterHelp $7.8M）
        - HITRUST R2；倡导公共事业框架；截至 May 2026 未发现 FTC 投诉
        - 中 — FTC 扩大后的健康数据执法姿态覆盖研究平台；同意架构是关键
        - 审查 Truveta 的基因组数据同意框架；确认成员医疗系统患者是否有退出机制
      - - 州级基因隐私立法 — 新同意要求
        - 法律
        - 中 — 8+ 个州在 early 2026 提出基因隐私法案；其中 3 个要求明确的二次使用同意
        - 中 — 可能要求来自这些州的患者数据改架构；成员医疗系统可能承担合规负担
        - Truveta 倡导公共事业框架，目标是联邦优先适用；尚无已生效州法影响 Truveta
        - 中 — 各州拼图式法律风险增加合规复杂度，也可能按州制造数据覆盖缺口
        - 跟踪州立法日程；确认哪些成员医疗系统位于有待审法案的州
      - - OCR 商业伙伴调查
        - 监管
        - 低 — 未披露 OCR BAA 调查；据 Foley Hoag 分析，Microsoft 作为主要 BA 是关注点
        - 中 — OCR 的 BAA 执法可能要求改政策、做泄露通知并缴纳民事罚款
        - 已签 Microsoft Azure HIPAA BAA；HITRUST R2 覆盖 BAA 控制；未披露调查
        - 低-中 — BAA 风险是云托管健康平台的常规风险；HITRUST 认证有所缓释
        - 索取 Truveta 与 Microsoft 之间的 BAA 条款；确认 BAA 范围是否覆盖 Truveta Intelligence 和 Genome Project 数据
      - - IP — 竞争对手数据网络效应与联盟复制
        - 法律
        - 中 — IQVIA、Komodo、Tempus 均运营竞争性 RWD 平台；未发现 Truveta 专属 IP
        - 中 — 如果竞争对手搭起可比的医疗系统联盟，Truveta 差异化会减弱
        - 30 个成员系统形成网络效应和切换成本；未披露重大 IP 诉讼
        - 中 — Truveta 的护城河在关系和数据规模，不在 IP；资金充足的竞争对手有可能复制
        - 确认 Truveta 是否在医疗系统数据协议中持有商业秘密保护或排他条款
      - - 患者隐私诉讼风险 — 集体诉讼
        - 法律
        - 低 — 未披露集体诉讼；基因组数据增加诉讼暴露面
        - 若发生则为高 — 健康数据集体诉讼曾产生超过 $100M 的和解
        - HIPAA 对去标识化数据的豁免在多数巡回法院限制原告起诉资格；未披露诉讼
        - 低-中 — 新增基因组数据抬高结构性风险；州隐私法规提供额外起诉资格路径
        - 审查隐私诉讼保险覆盖；确认成员医疗系统是否承担共同赔偿义务
      - - 出口管制与境外访问基因组数据
        - 监管
        - 低-中 — 按新兴 CFIUS 指引，美国患者基因组数据属于国家安全关切
        - 中 — 对基因组数据出口或非美国实体访问的限制，可能限制国际药企客户访问
        - 未披露需要特定出口许可的外国客户关系；Regeneron 和 Illumina 均为美国上市公司
        - 低-中 — 若国际药企客户访问美国基因组数据，风险会升高
        - 确认数据驻留要求；评估是否有任何非美国实体能访问原始或关联基因组数据
      - - DOGE 政策风险 — 政府合同限制健康数据平台
        - 监管
        - 中 — CDC 合同在 January 2026 因 DOGE 终止；更广泛的行政部门健康数据政策不清晰
        - 低-中 — 政府细分流失已部分兑现；NIH 资助用途还可能受更多限制
        - CDC 合同已终止；Truveta 已多元化至商业药企；政府现在只是小细分
        - 低 — 政府细分规模小且已受损；已兑现之外的增量风险有限
        - 评估是否有待批联邦资助引用 Truveta 数据；确认没有行政令限制健康数据用于商业研究
    notes: 可能性和影响评级是基于公开可得的监管与法律背景作出的定性评估。截至 May 2026，未发现 Truveta 执法行动或诉讼。剩余敞口反映现有缓释措施后的风险。所有评级都应在取得 Truveta 法律意见和合规文档后重新评估。
