      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              六股相互强化的力量正在 2026 年加速 Truveta 的可寻址市场。第一，FDA 2026 年 1 月更新后的 RWE
              框架明确把真实世界证据与传统临床试验数据并列，用于监管申报、适应症扩展和上市后监测。配套的 2026 年 3 月 ICH M14
              采纳，为非干预性药物流行病学研究设定明确标准，抬高方法学门槛，也创造了对具备可信数据血缘平台的需求——这正是 Truveta 的产品位置。第二，FDA 的单一试验标准现在允许一项设计充分的研究，在确认性 RWE
              支撑下作为药物批准基础，可能把后期试验支出减半，并为 RWE 平台创造强替代需求。第三，截至 2024 年底，医疗机构 AI 采用率已达 85%，医疗 AI 市场预计到 2030 年以 38.6% 年复合增速达到
              $110.61B；Truveta Intelligence 用生成式 AI 界面封装实时 RWD 查询，直接变现这股 AI 需求。第四，证据标准全球化——尤其是 EU Joint Clinical
              Assessment 自 2025 年 1 月起要求成员国共用单一临床资料包——抬高证据门槛，激励买方获取大规模、具代表性的真实世界患者队列。第五，PwC 2026 deals outlook 称，生物制药交易在
              2026 年加速，重点放在数据关联资产和管线质量；这既提高收购方对具备 RWE 能力平台的兴趣，也增加了用 RWD 分析做组合优化的需求。第六，Truveta Genome Project 获
              Regeneron、Illumina 和 17 家健康系统 $320M 资助，瞄准 2026 年 $13.93B 的临床基因组学邻域，通过把 EHR
              数据与外显子序列配对，形成现有玩家没有可比健康系统网络就无法复制的差异化。
