  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Truveta 的商业模式围绕三大产品支柱组织——Truveta Data、Truveta Studio/Evidence 和 Truveta Intelligence——每个支柱都在同一底层去标识化 EHR
              和基因组数据集上叠加增量访问和分析价值。主要收入驱动因素是企业数据订阅，直接卖给生命科学公司、健康系统和政府机构。具名客户包括 Moderna、UCB 和 Boehringer Ingelheim，它们都使用
              Truveta Data 做安全性、有效性和疾病自然史的真实世界研究。截至 2023 年 10 月，Truveta 披露超过 50 家客户组织；但截至 2026 年 5
              月，公司未公开更新客户数，集中度风险难以评估。

              定价未公开列示。分析师调研信息和政府合同证据提供了目前可用的最佳代理：2024 年 1 月授予的 CDC 合同价值最高 $10.3M，期限约 2.5 年，内容是数据访问和分析支持，意味着单个机构客户年费约
              $4M。更广泛的 RWD 领域企业药企合同，估计每年 $500,000 到 $3M，取决于范围。Microsoft Azure Marketplace 列出的 Truveta Studio Usage
              Reservation 档位为每个预留期 $95,000、$245,000 和 $495,000——这些是分析环境使用附加项，需要有效的底层 Truveta Data 订阅。

              Truveta Intelligence 于 2026 年 4 月推出，面向现有 Truveta Data 订阅者，是叠加在现有数据产品之上的自然语言 AI 层。公司未披露 Intelligence
              的单独标价，说明它可能包含在现有订阅中，也可能以未披露费率作为增购收费。基因组学收入流由 Truveta Genome Project 和 Regeneron Genetics Center 合作支撑，截至
              2026 年 5 月仍在积极建设；一旦测序里程碑达成，公司将把关联基因型-表型数据访问作为额外收入层推出。

              收入模式中一个结构性独特点，是医疗服务机构收入分成：商业客户付费访问去标识化患者数据时，Truveta 的健康系统成员获得财务补偿。Series A 公告称，“医疗服务提供者从 Truveta
              获得的收益将再投入其服务的社区”。这一利润分成机制使 Truveta 的模式不同于纯商业数据平台，但也对 30 家成员健康系统形成收入成本义务；标准 SaaS 结构中不存在这一项。
