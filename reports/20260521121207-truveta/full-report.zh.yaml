      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: IQVIA 的分销护城河是近期最持久威胁
            body: >-
              Truveta 的数据来源优于 IQVIA，但 IQVIA 的 93,000 人全球组织、一体化 CRO 服务和长期企业协议，形成近期极难替代的商业飞轮。在 IQVIA 是现有供应商默认选择的制药 RFP
              中，新进入者若没有已验证的监管级概念验证，通常很难胜出。Truveta 在与 IQVIA 正面竞争 RFP 中的商业胜率，是未解的尽调问题。
            calloutType: risk
            claimRefs:
              - CP033
              - CP007
              - CP044
          - type: callout
            title: Roche 可能剥离 Flatiron，验证 Truveta 的独立定位
            body: >-
              2024–2026 年多家独立来源报道称，Roche 正评估 Flatiron 的战略选项，包括潜在出售。据称驱动因素是渠道冲突：竞争药企不愿与 Roche 子公司共享竞争性数据。如果 Flatiron
              被剥离，它会在肿瘤 RWE 上成为 Truveta 更强的直接竞争者。不过，这一事件也验证了一个结论：由医疗服务机构治理的独立数据平台，比药企子公司替代方案更能赢得买方信任；这是 Truveta
              相对任何药企母公司拥有的 RWD 实体的结构性优势。
            calloutType: insight
            claimRefs:
              - CP010
              - CP011
              - CP034
          - type: callout
            title: AI 分析能力正在快速趋同
            body: >-
              Truveta 于 2026 年 4 月推出 Truveta Intelligence；Flatiron 于 2026 年 5 月推出 Telescope；TriNetX 和 Tempus 也在
              2025–2026 年宣布基于 LLM 的证据工具。AI 分析功能比底层数据资产更容易复制，分析层的功能平价窗口可能只有 12–18 个月。Truveta
              的持久优势必须建立在数据来源和治理上，而不能只靠分析外壳。
