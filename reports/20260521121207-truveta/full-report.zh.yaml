  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台产品组合与数据架构
        blocks:
          - type: paragraph
            body: >-
              Truveta 运营着一个紧密集成的四层产品平台，全部搭在 Microsoft Azure 上。底层是 Truveta Data：一个持续更新、去标识化的数据集，覆盖来自 30 家美国卫生系统的 130
              million 以上患者，代表全美 18% 的日常临床护理，横跨 50 个州的 800 多家医院和 20,000 家诊所。Truveta Data 的差异点在于直接来自
              EHR（没有理赔归一化偏差）、每日刷新，并接入 100 多家支付方覆盖 200 million 以上患者的封闭理赔数据、LexisNexis Risk Solutions 提供的每位患者 45 项 SDOH
              属性、死亡数据、Surescripts 提供的药房配药数据，以及自 March 2025 起加入的行政 ADT 和计费数据。支撑数据集的是 Truveta Language
              Model（TLM），这是一套自研临床大语言 AI 模型，使用 SNOMED CT、LOINC、RxNorm、ICD-10、CPT、HCPCS、CVX、NDC、UDI 等标准医学本体，把每天数十亿个 EHR
              数据点归一化到统一的 Truveta Data Model（TDM）。在 Truveta Data 之上是 Truveta Studio，即云托管分析环境；其中包含 Truveta
              Evidence，这个监管级子层提供审计就绪的工作流，并对齐 FDA 真实世界证据指南。最后，April 28, 2026 发布的 Truveta Intelligence 提供自然语言 AI
              查询界面，让订阅者能在几分钟内从完整患者语料中生成实时洞察。这四个组件共同定义了 Truveta 的产品边界：一个受治理的去标识化数据集、一个临床 AI 归一化引擎、一个监管级分析工作区，以及一个 AI
              洞察层。所有产品只面向订阅者；公司没有公开 API、自助试用或开放访问研究层。Truveta Genome Project 是仍处于早期建设的第五层，目标是形成 10 million 条相连的基因型-表型记录。
