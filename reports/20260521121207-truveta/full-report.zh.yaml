  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁 / 替代路径
      - 严重性（1–5）
      - 缓解措施或尽调问题
    rows:
      - - 医疗服务方共同所有权和治理（30+ 家医疗系统）形成伦理和合同层面的数据访问壁垒
        - 竞争对手收购或结盟竞争性医疗系统网络；大型科技公司把云合作转成共同治理交易；Truveta 网络中的医疗系统流失
        - 3——中等。搭建 30 家系统共同治理网络需要 5 年以上；没有既有厂商大规模尝试过。
        - 跟踪医疗系统合同续约条款；核实成员股权和治理权在重大 M&A 后是否延续；评估 Microsoft/Azure 医疗系统云交易结构
      - - 130M+ 患者的全国代表性 EHR 广度（每 3 个美国人中 1 个）
        - IQVIA 或 Komodo 扩大 EHR 合作覆盖；联邦式替代方案（TriNetX）不用集中化也能覆盖广度
        - 2——低至中等。以理赔为主的竞争者难以匹配 EHR 叙事厚度和来源透明度。
        - 核实当前成员医疗系统在美国患者就诊中的份额；将地域和人口代表性与 Komodo、IQVIA 理赔数据对比
      - - 每日 EHR 数据刷新支持实时临床智能
        - 竞争对手借 FHIR API 标准化（21st Century Cures Act 要求）匹配刷新频率；Veeva 已提供每日商业数据
        - 3——中等。FHIR 强制要求确实会随时间降低实时数据交付门槛。
        - 评估 FHIR 互操作标准化之后，Truveta 的刷新优势能否延续；确认当前 FHIR R4 集成状态
      - - Regeneron Genetics Center 提供基因组链接（Truveta Genome Project）
        - Tempus AI 和 Flatiron 已经在肿瘤场景大规模提供基因组链接；IQVIA 搭建基因组合作；基因测序成本快速下降
        - 4——高。基因组链接今天是强差异点，但需要持续测序量，才能在广度上顶住肿瘤专科竞争者。
        - 跟踪 Genome Project 测序运行率与 Tempus、Flatiron 基因组患者数的对比；核实同意授权和生物样本采集的规模化能力
      - - AI / 证据层（Truveta Intelligence，2026 年 4 月）支持自然语言 RWE 查询
        - 主要竞争对手都在 2025–2026 年推出 AI 分析：Flatiron Telescope（2026 年 5 月）、Tempus Lens、TriNetX LIVE；功能趋同风险真实存在
        - 4——高。AI 分析层比底层数据资产更容易复制；功能优势可能在 12–18 个月内被削弱。
        - 评估 AI 与数据治理的融合深度（不只是查询界面）；跟踪研究质量指标与竞争性 AI 证据平台的对比
      - - 医疗服务方治理的信任和去标识化认证，相比商业数据经纪商降低监管风险
        - FDA 调整去标识化标准，偏向联邦式或令牌化模型；TriNetX 或 Datavant 在 RWE 申报中积累监管记录
        - 2——低至中等。医疗服务方治理是监管方过去重视的战略信任优势；公开渠道未见对 Truveta 模式的监管挑战。
        - 跟踪 FDA 对去标识化 EHR 数据商业化的执法行动；审阅 ICH M14 合规缺口分析
      - - 美国全国覆盖所有疾病（不只肿瘤），让 Truveta 区别于肿瘤专科厂商
        - Tempus AI 大规模扩展到肿瘤以外；TriNetX 的广泛联邦网络无需中心治理约束也覆盖非肿瘤
        - 3——中等。肿瘤专科厂商复制全疾病广度会遇到结构性成本壁垒；TriNetX 覆盖广度真实存在，但联邦式架构也有边界。
        - 跟踪 Tempus 非肿瘤扩张策略；比较 TriNetX 与 Truveta 平台的非肿瘤研究数量
      - - 独立治理（无药企母公司）避免 Flatiron/Roche 面临的渠道冲突
        - Roche 剥离 Flatiron，移除渠道冲突壁垒；其他药企收购 RWD 平台后进入市场，却未触发类似母公司冲突
        - 2——低。Flatiron 剥离会强化 Flatiron 的竞争力，但执行需要时间；2026 年未宣布其他药企收购大型 RWD 平台。
        - 跟踪 Roche-Flatiron 剥离流程；评估剥离是否打开 Flatiron 与此前回避它的前 20 大药企买家的合作
    notes: 严重性评级是截至 2026-05-21 基于来源证据给出的定性评估（1=低，5=关键）。它们不是量化分数，只能作方向判断。
