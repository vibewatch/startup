  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与买方架构
        blocks:
          - type: paragraph
            body: >-
              Truveta 采用四类买方架构，在企业软件市场中结构上并不常见。第一类也是最有辨识度的一类，是 30 家成员卫生系统——Providence、Advocate Health、Trinity
              Health、Tenet Healthcare、Northwell Health、AdventHealth、CommonSpirit Health 以及另外 23
              家——它们同时扮演数据贡献方、平台治理方、股权投资方和付费订阅者。根据 CHAUSA 报道和 Truveta
              自己的卫生系统页面，成员系统作为付费会员的一部分获得平台访问权，并在商业客户访问其去标识化数据时获得收入补偿。这种双重角色结构意味着「客户」和「供应方」之间的边界被有意模糊，仅靠公开披露无法做直接的客户集中度分析。

              第二类，也是主要商业板块，是生命科学客户，包括制药公司、生物技术公司和医疗器械制造商。Pfizer 是首个确认的主要药企客户，于 June 2022 签约，用于近实时药物警戒和 COVID-19
              疫苗安全监测。Boston Scientific 于 September 2022 签约，用于外周动脉疾病器械的上市后监测和医疗差异研究。到 October 2023，Truveta
              披露生命科学、政府、学术医学中心和研究机构中已有 50 多家组织，并点名 Boehringer Ingelheim（NASH 生物标志物研究）、Moderna（罕见病——OTCD
              自然史）、UCB（化脓性汗腺炎患者旅程）、Alpine Immune Sciences、Reprieve Cardiovascular、SK Life Sciences、MedComp 和 Mathematica
              属于这一客户群。到 November 2024，Truveta 披露 100 多家合作组织，并点名新增扩展至 Bayer、Eli Lilly and Co.、Novartis、Stryker、American
              Heart Association、Edwards Lifesciences、GORE、Impulse Dynamics 和 Gates Ventures。

              第三类是学术和公共卫生研究机构。Johns Hopkins 的 Hopkins Business of Health Initiative（HBHI）是记录最完整的学术合作：截至 2025 年，它资助了
              Johns Hopkins 研究社区的 25 个 Phase I 试点项目（来自 40 多份申请）和 11 个 Phase II 项目，覆盖自身免疫病、代谢风险、癌症护理、孕产健康、痴呆和物质使用。Duke
              University 于 October 2023 被确认为 Truveta Data 客户。University of Pennsylvania 的 Leonard Davis Institute 在 2026
              年举办了一场关于 Truveta 能力和研究用例的研究员工作坊。University of Michigan Institute for Healthcare Policy and
              Innovation、University of Texas Health Science Center at San Antonio 和 Indiana University 也是已点名的学术用户。

              第四类是政府和公共卫生。CDC 是唯一公开确认的政府客户，January 2024 与 Truveta 签订为期约 2.5 年、金额 $10.3 million 的合同，用于
              COVID-19、孕产健康和儿科的数据收集与报告。该合同在 January 2026 按 DOGE 指令被部分终止，待履约金额仅剩 $120,000，直观展示了政府收入的脆弱性。
