      - number: '3.3'
        title: 相邻和网络型数据竞争者——Komodo、Datavant、HealthVerity、Veeva、TriNetX
        blocks:
          - type: paragraph
            body: >-
              Komodo Health 已以 $3.3B 估值（Series E）融资 $514M，运营 “Healthcare Map”，主要聚合来自理赔、EHR 数据流、实验室和专科数据的 330M+ 美国患者历程。其
              2024 年 10 月 National Drug Projections 产品提供 10,000+ 疗法的实时处方趋势分析；这是一种商业智能能力，与 Truveta 的临床 EHR
              研究角度重叠很少。Komodo 面向生命科学市场准入和商业团队，而非 Truveta 主攻的 RWE 和监管证据生成买方。Datavant 是由 Datavant 与 Ciox Health 合并形成、估值
              $7B 的网络基础设施型公司，现在又通过收购 Aetion 增强能力。其令牌化技术可在 80,000+ 医院、诊所和 350+ RWD 伙伴之间链接患者记录，而无需集中可识别数据。Datavant
              的护城河是链接网络广度，不是一手 EHR 治理；对 Truveta 来说，它更像互补模型，而非可替代模型。Datavant-Aetion 合并确实创造了一个整合证据网络，覆盖数据链接和监管级研究设计，与
              Truveta 的证据层更直接重叠。HealthVerity 运营市场模型：从多家第三方来源授权 HIPAA 合规理赔、药房、实验室、EHR
              和消费者数据，并提供强来源追踪和透明度，面向想灵活配置数据来源的制药和生命科学买方。它没有直接 EHR 医疗服务机构治理，这一点与 Komodo 相似，也构成相对 Truveta 的限制。Veeva
              Compass（Patient、Prescriber、National 模块）是商业和处方者分析平台，不是临床 EHR 证据平台；它争夺的是制药商业团队预算，而非 Truveta 所在的研发和医学事务 RWE
              预算。TriNetX 运营全球最大的联邦式真实世界数据网络，覆盖 230+ 医疗机构和 300M 患者。它的联邦模型让数据留在源机构，增强隐私合规和机构信任，但相较 Truveta
              的去标识化集中模型，会限制跨机构记录链接和集中式研究设计灵活性。
