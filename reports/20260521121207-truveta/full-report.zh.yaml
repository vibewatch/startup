      - number: '5.5'
        title: 去标识化、隐私架构与合规
        blocks:
          - type: paragraph
            body: >-
              Truveta 的隐私架构旨在满足医疗研究中最严苛的要求，同时尽量保留数据效用。针对 HIPAA 去标识化，Truveta 采用 Expert Determination 方法（45 CFR
              164.514(b)(1)），而不是 Safe Harbor；公司与符合 HHS OCR 标准认证的合格统计专家合作。Expert Determination 相比 Safe Harbor
              允许保留更丰富的数据，但也要求以正式文档证明重识别风险非常低。去标识化管线分四个阶段：（1）受控 PHI 删除区，由在 PHI 上训练的 AI
              模型从结构化数据、临床笔记和医学图像中检测并移除直接标识符；（2）在全部 30 家卫生系统上同时管理准标识符并执行
              k-anonymity，构建大型等价类，以减少数据抑制并降低重识别风险；（3）对日期、地理数据和其他受监管字段做结构化数据去标识化；（4）对全部去标识化数据导出加水印和指纹，让 Truveta
              能发现误用，并追踪任何导出数据快照的来源。Truveta 还运营一种「embassy」模式：患者匹配在各卫生系统自己的基础设施内完成，之后记录才会传往中心端，因此 PHI 不会离开原始卫生系统。研究人员可在
              Truveta Studio 内按具体研究目标配置去标识化参数，在数据保真度和隐私保护之间取舍。已认证的合规控制包括 HITRUST r2 Certification（覆盖 NIST Cybersecurity
              Framework v1.1）、SOC 2 Type 2 证明、ISO 27001、ISO 27701 和 ISO 27018，均由 Schellman & Company, LLC 外部评估。平台运行在
              Azure DevOps 上，强制变更管理审批、多环部署（DEV/INT/PROD）和自动化验证套件。患者倡导者已经就去标识化患者数据商业变现提出伦理担忧，指出患者可能并不完全理解自己的记录会如何用于商业研究。
