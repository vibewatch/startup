      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Terry Myerson 担任 CEO 兼联合创始人，是 Truveta 最常出现在台前的高管。领导层页面和公司历史直接把他与公司形成期绑定：他在 Microsoft 工作 21 年、随后担任 Madrona
              和 Carlyle 顾问后，于 2020 年 3 月以 Truveta 首位员工身份加入这项使命。其他具名联合创始人为 CTO Jay Nanduri 和 CMO Ryan
              Ahern，使公司创始画像同时具备软件、AI 和临床研究背景。2026 年公开领导层披露还显示 Deb Nielsen 担任首席人力官，Simonne Lawrence 担任总法律顾问，Michael
              Simonov 担任产品高级副总裁，Fabien Mousseau 担任 CFO，Johnathan Lancaster——2026 年 1 月从 Regeneron
              加入——担任总裁兼首席科学官。治理结构也异常以医疗服务机构为中心：Truveta 董事会主要由成员健康系统高管组成，另列一名 Pfizer
              安全事务高管。这一结构强化了与贡献数据的医疗服务机构和伦理监督的对齐，但相比典型 VC 支持的软件公司，外部投资者的治理影响力更不透明。
