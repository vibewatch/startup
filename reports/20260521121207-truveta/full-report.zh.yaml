              等医疗器械龙头。这一演进说明产品在成熟，板块渗透也在扩大。Pfizer 从 2022 年到至少 2024 年持续出现在 Truveta 公开披露中，以及与 Moderna 在 ISPOR
              会议上共同展示，提供了质量最高的双边生产级使用证据。DIA 2025 的 GLP-1 研究提前一年预判试验结果，并随后被试验验证，是迄今发布的最强结果证明。
