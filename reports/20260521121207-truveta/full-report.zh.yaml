      - number: '5.7'
        title: 证据
        blocks:
          - type: callout
            title: TLM 是核心 IP 护城河：临床 NLP 在医学抽取上超过 GPT-4
            body: >-
              TLM 从非结构化笔记中抽取临床概念的准确率超过 90%，经人类临床专家审阅者验证，并在医学领域任务上超过 GPT-4；这是 Truveta
              技术栈中最难复制的部分。训练需要数十亿条去标识化临床记录、临床专家标注员管线和多年迭代。当前没有竞争者同时具备由服务方治理的 EHR 规模和同等深度的临床 NLP。
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE035
              - CE039
          - type: callout
            title: 单一云和单一测序伙伴依赖带来集中风险
            body: >-
              Truveta 所有数据存储、AI 计算和 Genome Project 基础设施都独家依赖 Microsoft Azure，形成切换成本很高的单一云依赖。另一边，Regeneron Genetics
              Center 是 10M 外显子组 Genome Project 的唯一测序伙伴，形成测序吞吐量集中风险，且没有披露备份方案。任一合作关系受扰动，都会实质性削弱平台运营或基因组产品路线图。
            calloutType: risk
