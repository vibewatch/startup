chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、数据资产与商业模式
        blocks:
          - type: paragraph
            body: >-
              Truveta 是位于华盛顿州 Bellevue 的医疗数据公司，公开使命是 “Saving Lives with
              Data”。公司最初由医疗服务机构牵头，试图把碎片化电子健康记录数据转成持续更新、去标识化的智能洞察，供研究人员、临床医生、公卫团队和生命科学组织使用。这一医疗服务机构牵头的起点仍是公司叙事核心：Truveta
              称，公司由美国健康系统共同建设并治理，而不是由保险公司、广告技术平台或单一学术医学中心主导。到 2026 年，公司宣传的数据资产覆盖超过 1.3
              亿患者、约三分之一美国人，横跨所有护理场景，历史超过十年，并每日刷新。商业模式是向企业开放 Truveta Data、Truveta Evidence，以及现在的 Truveta
              Intelligence，用于安全性和有效性研究、适应症扩展、临床试验设计、疗法采用追踪、公卫分析和医疗运营等工作流。公开披露在平台规模、产品定位和成员健康系统覆盖上相当强，但在定价、收入、合同结构，以及除公司营销口径外的当前客户数上很弱。
