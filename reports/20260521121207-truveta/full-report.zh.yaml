    rows:
      - - Microsoft Azure（云平台）
        - 技术依赖
        - 关键 — 所有平台数据、计算和 AI 基础设施都在 Azure 上；Truveta Intelligence 是 Azure 原生
        - 低 — Microsoft 是战略投资方；中断会反噬 Microsoft 自身
        - 灾难性 — 平台下线、数据不可访问，所有订阅客户发生合同违约
        - Microsoft 自 Sept 2021 起为战略伙伴；已签 Azure HIPAA BAA；HITRUST R2 覆盖 Azure 托管数据
        - 确认 SLA 承诺和 DR 故障切换架构；评估若 Microsoft 关系变化时的合同退出条款
      - - Regeneron（Genome Project 锚定方）
        - 商业与科研依赖
        - 高 — Regeneron 锚定基因组测序投资，也是早期基因组数据的主要客户
        - 中 — Regeneron 可能建设内部基因组数据库，从而降低与 Truveta 合作的必要性
        - 高 — 失去 Regeneron 合作会削弱 Genome Project 的商业可信度，并压低基因组数据规模
        - 与成员医疗系统联合公告；biospace.com 确认合作仍在推进；Regeneron 投资持股 $139.5M
        - 获取 Regeneron 的数据访问和排他条款；确认 Regeneron 自身基因组数据库战略是否与 Truveta 竞争
      - - 30 个成员医疗系统（数据供给）
        - 结构性数据依赖
        - 关键 — 所有去标识化 EHR 数据都由成员系统提供；未发现替代数据源
        - 低-中 — 成员系统既是股东也是治理方；财务利益与 Truveta 成功绑定
        - 灾难性至严重 — 多个成员流失会击垮数据网络；单个大型系统流失也会显著降低覆盖
        - 30 个系统持股形成治理锁定；5 年无公开退出；创始成员包括 Providence 和 CommonSpirit
        - 审查成员系统数据贡献协议；识别续约日期；评估是否有成员已启动数据共享限制
      - - Illumina（基因组测序技术）
        - 技术依赖
        - 高 — Illumina 是主要测序技术伙伴；Truveta Genome Project 需要规模化高通量 WGS
        - 低 — Illumina 是商业测序市场领导者；短期技术中断可能性低
        - 中 — Illumina 涨价或技术迁移会抬高测序成本，或要求重新验证
        - Illumina 投资持股形成财务对齐；未披露替代测序供应商
        - 确认测序定价条款和合同承诺；评估 PacBio 或 Oxford Nanopore 是否已具备备份供应商资格
      - - 生命科学商业客户（收入集中度）
        - 收入依赖
        - 高 — 药企和生物科技是主要收入细分；Pfizer、Eli Lilly、Novartis 各自都可能贡献重要 ARR
        - 中 — 单个药企客户的预算周期、管线变化或安全信号可能降低使用量
        - 中等 — 客户集中会带来收入波动；已有 100+ 家组织，失去单一客户不至于灾难性
        - 截至 Nov 2024 有 100+ 家组织；具名客户覆盖大型药企、器械、生物科技和学术机构；多样性限制集中度
        - 索取前 10 大客户 ARR 集中度；确认最大具名客户的续约日期，包括 Pfizer、Moderna、Eli Lilly
    notes: >-
      合作伙伴与依赖风险评级反映关于 Truveta 已公告合作关系和架构的公开信息。所有合作的财务条款均未披露。Microsoft 战略合作有新闻来源记录；Regeneron 合作见 biospace.com 公告以及
      geekwire.com 对 Genome Project 的报道。
