            title: 现有玩家竞争和采购壁垒限制近期 SAM 获取
            body: >
              IQVIA、Optum、Oracle 和 Flatiron 与最大药企买方拥有长期关系，即使 Truveta 的数据集在技术上更优，切换成本仍高。再叠加 12–24 个月健康系统采购周期、MFN
