      - number: '5.4'
        title: Genome Project 技术管线与基因组数据护城河
        blocks:
          - type: paragraph
            body: >-
              Truveta Genome Project 于 January 13, 2025 启动，是公司资本强度最高的技术项目，也是最清晰的长期差异化押注。项目计划为 Truveta 30
              家成员卫生系统中同意参与的志愿者测序最多 10 million 个外显子组，规模超过此前项目 10
              倍以上，目标是建成全球最大且最多元的基因型-表型关联数据库。技术管线是：（1）卫生系统站点取得患者同意，使用常规实验室检查留下的生物样本，并将其与患者去标识化 EHR 记录相连；（2）样本送往 Regeneron
              Genetics Center（RGC），后者运营高通量外显子组测序管线（DRAGEN 生物信息套件）；（3）去标识化基因组序列数据返回 Truveta；（4）TLM 在 Microsoft Azure 上的
              Truveta Data 内，把基因组数据与临床 EHR 记录标准化并整合；（5）剩余生物样本存档，用于未来潜在的多组学测序。项目资金来自 $320 million Series C 轮（January
              2025），其中 Regeneron 作为战略技术投资方出资 $119.5 million，Illumina 出资 $20 million。17
              家卫生系统也与这些伙伴共同投资。最终形成的关联数据集计划支持生物制药药物发现（遗传靶点识别）、临床试验优化（纳入基因型响应者数据做富集）和人群健康管理。截至 May
              2026，测序正在推进，但公司没有公开里程碑、吞吐量数据或商业数据访问的上线时间表。关键技术依赖包括 RGC 的测序吞吐能力、Illumina 的测序技术平台、30 家卫生系统大规模获取患者同意的执行能力，以及
              Azure 用于 PB 级基因组数据存储和访问的基础设施。
