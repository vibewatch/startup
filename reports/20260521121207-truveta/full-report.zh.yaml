      - number: '6.3'
        title: 留存、韧性与扩张信号
        blocks:
          - type: paragraph
            body: >-
              截至 May 2026，Truveta 没有公开披露商业板块的
              NRR、总留存率（GRR）、流失率、队列留存曲线或合同期限中位数。公司不公布财务指标或订阅者经济性，企业订阅协议又是私有合同，外部无法用现有证据独立还原。这是实质性尽调缺口。

              留存质量的代理证据确实存在，对药企板块而言中等偏正面。June 2022 签约的 Pfizer，在 November 2024 披露中仍被列为活跃 Truveta 客户。同样在 2022 年签约的 Boston
              Scientific，至少到 2023 年仍在基于 Truveta Data 产出新临床研究，并出现在 Truveta September 2025 器械数据扩展公告中。October 2023 加入的
              Moderna，至少持续合作到 ISPOR May 2024。UCB、Boehringer Ingelheim、MedComp 和 Mathematica 都在 October 2023 被点名，并仍出现在后续
              Truveta 通讯中。到 May 2026，任何具名客户都没有公开流失公告，至少说明药企和器械板块没有显眼的公开离场；但这只是缺少负面证据，不是正面的留存证明。

              CDC 合同提供了最清楚的合同结构证据：一份固定价格、2.5 年期的政府合同（January 2024 至 July 2026），最高价值 $10.3 million。这是唯一公开验证的合同期限。DOGE 于
              July 2025 将该合同列入终止名单，并在 January 2026 以便利终止方式部分终止，说明政府收入并不天然耐久。部分终止后剩余待履约金额约为 $120,000，相比原始 $10.3 million
              潜在价值极低。

              Microsoft Azure Marketplace 列出 Truveta Studio 使用预留层级，价格为每个预留期 $95,000、$245,000 和
              $495,000——这些是分析工作区使用附加项，不是底层 Truveta Data 订阅价格。它们出现在企业市场平台上，说明商业模式更像结构化、经常性的模式，而非一次性项目费。

              April 28, 2026 发布的 Truveta Intelligence 只面向现有 Truveta Data
              订阅者提供，不作为独立产品销售。这种仅限交叉销售的可用性是一种刻意的扩张策略：它加深现有订阅者基础内的价值，而不是扩大销售漏斗顶部。同样，Truveta Genome Project
              把现有药企客户（Regeneron、Illumina 作为投资方）视为基因型-表型关联数据用于药物发现的主要买方，尽管截至 May 2026 该产品仍未商业化。

              Johns Hopkins HBHI 的 Phase II 资助结构揭示了一项关键学术留存机制：Phase I 证明可行的项目，会竞争最高 $25,000 的 Phase II
              资金，用于支持扩大数据访问费和人员投入。预算必须包含 Truveta 数据费估算，确认学术板块是按数据收费模式；这也带来对资助周期的依赖，单个研究项目结束时可能出现队列级流失。
