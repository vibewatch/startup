  - id: FE001
    title: Truveta 产品架构栈——从卫生系统 EHR 到研究智能
    type: stack
    layout: wide
    summary: 从云基础设施、去标识化数据到 AI 分析的六层栈，展示依赖链以及每一层对应的 Truveta 产品。
    approximationNotes: 架构描述来自公司发布的文档和平台公告。内部技术架构细节（微服务拓扑、API 设计、数据分区策略）未公开披露。
    data:
      layers:
        - label: 第 1 层——云基础设施（Microsoft Azure）
          detail: 所有存储、AI/ML 计算和托管；独家云提供商；Azure DevOps 用于 CI/CD；多环部署（DEV/INT/PROD）。
          items:
            - Azure 计算和 GPU 集群（TLM 训练与推理）
            - Azure Storage（PB 级 EHR + 基因组数据）
            - Azure Key Vault、Active Directory、Security Center（合规控制）
            - Azure DevOps（变更管理；强制审批）
        - label: 第 2 层——数据摄取与隐私（Embassy + 去标识化）
          detail: 患者匹配在各卫生系统的 embassy 内完成；PHI 从不离开成员边界；AI 脱敏在受控 PHI 区域内进行。
          items:
            - 单个卫生系统 embassy 模型（现场患者匹配）
            - AI PHI 脱敏（结构化数据、病历备注、图像）
            - 跨 30 家卫生系统的 k-匿名（等价类）
            - 所有导出的水印和指纹
        - label: 第 3 层——Truveta Language Model（TLM）
          detail: 自研临床 LLM，将每天数十亿个 EHR 数据点归一化到标准本体；准确率 >90%；有人类专家标注流水线。
          items:
            - 半结构化归一化（SNOMED CT、LOINC、RxNorm、ICD-10、CPT、CVX、NDC、UDI）
            - 非结构化病历备注提取（疾病分期、不良事件、用药依据）
            - 否定、假设和家族史检测
            - Truveta Data Model（TDM）——内部统一模式
        - label: 第 4 层——Truveta Data（数据集产品）
          detail: 去标识化、经 TLM 归一化的 EHR 数据集；130M 名患者；每日刷新；链接理赔、SDOH、死亡、药房、ADT 数据。
          items:
            - 来自 30 家卫生系统的 EHR 数据（130M 名患者）
            - 封闭式理赔（200M+ 名患者、100+ 个支付方，回溯至 2016 年）
            - 每名患者 45 项 SDOH 属性（LexisNexis Risk Solutions）
            - 死亡、药房（Surescripts）、ADT/账单行政数据
            - 基因组外显子数据（建设中；Genome Project）
        - label: 第 5 层——Truveta Studio / Evidence（分析工作区）
          detail: 监管级队列构建、查询执行、特征表生成，以及面向生命科学和卫生系统订阅者、可供审计的研究工作流。
          items:
            - Prose（用于队列定义的类 SQL 查询语言）
            - Snapshots、Notebooks、Truveta Library（经验证的代码集）
            - 特征表构建器（分钟级，而非数周）；入组资格过滤器
            - 面向 FDA 对齐 RWE 的可审计工作流和数据来源
        - label: 第 6 层——Truveta Intelligence（AI 洞察层）
          detail: 面向实时数据的自然语言查询接口；2026 年 4 月 28 日推出；从问题到洞察只需数分钟；代码集和方法完全透明；不做因果推断。
          items:
            - 自然语言查询 → 结构化分析 → 实时结果
            - 代码集和方法可完全检查，便于验证
            - 向所有 Truveta Data 订阅者开放
            - 明确不建立因果关系，也不取代临床判断
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE011
      - CE013
      - CE019
      - CE023
      - CE026
