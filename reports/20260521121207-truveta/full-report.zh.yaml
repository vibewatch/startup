  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Truveta
              的可寻址市场跨越四个彼此重叠但分析上不同的细分领域。核心领域是真实世界证据（RWE）解决方案市场，覆盖软件平台、数据管理服务和分析工具，从受控试验之外的电子健康记录（EHR）、保险理赔、患者登记和可穿戴数据生成临床证据。相邻的是更广义的真实世界数据（RWD）市场，包括底层数据资产——EHR
              导出、理赔数据集、药房记录和患者登记——通常按订阅或许可出售。第三个领域是临床数据分析，涵盖把临床记录转成可执行运营和研究智能的所有计算工具，RWE 是其中子项。最后，Truveta Genome Project
              把公司带入临床基因组学和药物基因组学邻域；在这里，与 EHR 关联的基因组数据库对应独立买方预算。排除在外的支出包括通用医院 EHR
              软件（Epic、Cerner）、理赔处理系统、支付方裁决平台和原始基因组测序仪器。现状替代方案包括定制化内部数据科学团队、传统合同研究组织（CRO）做手工病历审查，以及学术研究合作。买方能否区分纳入与排除支出很重要，因为采购周期和预算所有者差异很大：RWE
              平台通常由制药研发或医学事务预算支持，而 EHR 系统属于 IT 资本开支。
