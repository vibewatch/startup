      - number: '8.3'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              所有情景分析都基于明确标注的假设。Truveta 财务不透明，因此这些情景是投资人尽调的定位工具，不是财务模型。收入假设以 GetLatka/Growjo 分析师代理值约 $80M（2024）为基准年锚点，并与第
              4 章分析一致。退出估值采用五年持有期至 2030–2031 年，假设通过战略并购、成长股权轮或 IPO 实现流动性事件。

              乐观情景假设：（1）Truveta Genome Project 到 2028 年成功测序 3–5M 个外显子，并形成新的基因组数据订阅收入层，定价高于 EHR 数据层；（2）核心 EHR 数据订阅收入年增
              25–30%，到 2028 年达到 $200–250M；（3）AI 分析层（Truveta Intelligence）转化为增厚利润率的增购；（4）医疗系统联盟从 30 家扩至 35–40
              家，护城河加深；（5）战略收购方——大型药企、主要医疗系统联盟或生物技术平台——支付 10–15x 远期收入的溢价倍数。乐观情景隐含退出估值：$3.0–5.0B。以 $1.0–1.4B 入场并承担 30–40%
              稀释，净回报为 1.5–3.0x。乐观情景要求 Genome Project 产生商业产出，这是关键的二元假设。

              基准情景假设：（1）核心 EHR 数据订阅收入年增 15–20%，到 2028 年达到 $140–180M；（2）Genome Project 增加适度基因组数据收入（到 2028 年
              $20–30M），但在流动性事件前不足以显著重估公司；（3）Truveta Intelligence 转化为 10–15% 收入增量；（4）医疗系统会员稳定在 30 家；（5）通过战略并购以 7–10x
              远期收入退出。基准情景隐含退出估值：$1.2–2.0B。以 $1.0–1.4B 入场并承担 30–40% 稀释，净回报为
              0.7–1.2x——回报温和到持平，反映当前入场价格相对执行不确定性并不便宜。基准情景能验证当前估值，但不能为所承担风险创造有吸引力的回报。

              悲观情景假设：（1）药企 RWD 预算削减、IQVIA 捆绑合同竞争替代，或客户集中度损失，使核心收入增长压缩至 5–10%；（2）Genome Project 延迟，到 2028
              年商业基因组收入降至可忽略水平；（3）HIPAA 或 FTC 执法行动要求重构同意架构，压缩可变现数据的 TAM；（4）一家主要医疗系统退出联盟，同时削弱数据供给和收入；（5）以 3–5x
              收入（压缩倍数）退出，或出现估值下调轮。悲观情景隐含估值：$300–600M。以 $1.0–1.4B 入场，回报为 0.2–0.6x（毁灭资本）。悲观情景不是基准，但也并不遥远——CDC
              合同被部分终止、Genome Project 尚待资本投入、收入不透明，合在一起构成不可忽视的尾部风险。

              概率加权估值分析：粗略赋予 20% 乐观、55% 基准、25% 悲观权重，得到约 $1.3–1.6B 的概率加权退出企业价值，只略高于当前 $1.0–1.4B
              估值标记，说明当前价格已经反映了基准情景中的大部分上行。安全边际很薄；更理想的入场点，是远期 融资前估值不要较当前估值显著上调。会把权重推向悲观的反向证据包括：资料室尽调披露收入低于
              $60M；任何医疗系统退出；任何涉及 Truveta 数据的监管问询；或 Genome Project 测序里程碑较计划滑坡超过 12 个月。
