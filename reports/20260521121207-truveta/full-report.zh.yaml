      - number: '1.4'
        title: 基因组项目、牵引力与反向背景
        blocks:
          - type: paragraph
            body: >-
              Truveta Genome Project 是公司最大胆的战略动作，也是 Series C 重要性的最清晰原因。公开描述称，Truveta
              将取得患者同意，使用常规实验室检测后的剩余生物样本，对样本测序并存储，将生成的基因组数据与去标识化病历关联，再把这一组合资源开放给研究、AI 模型开发、药物发现和试验优化。Regeneron Genetics
              Center 是核心测序伙伴，Microsoft Azure 是独家云提供商。公司把该项目定位为多样性和健康公平资产，因为资源来自广泛的美国健康系统网络，而非更窄的学术队列。牵引力方面，Truveta 2023
              年 10 月称已有 50 多家组织使用平台，2026 年 4 月又推出 Truveta Intelligence，为现有数据订阅者加速自然语言分析。主要反向背景不是诉讼，而是伦理：STAT 将 Truveta
              置于医院向 AI 和研究交出去标识化患者数据的市场中，生物伦理学家质疑患者是否真正理解这些数据的下游商业化。这里没有公开证据显示 Truveta
              遭遇具名执法行动，但隐私观感是真实尽调问题，因为基因组数据会放大再识别风险。
