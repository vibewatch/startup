      - number: '3.4'
        title: 切换成本、多供应商并用与买方锁定
        blocks:
          - type: paragraph
            body: >-
              2026 年制药 RWD 采购的特征是有意多供应商并用：买方维持与两到四家供应商的关系，以对冲数据覆盖缺口、治疗领域专长需求和监管要求变化。ZS Associates 的基准研究确认，尽管大多数大型药企已有清晰的
              RWD 和 RWE 平台愿景，仍会继续从多家供应商采购。这一行为限制了 Truveta 成为唯一来源供应商的能力，也意味着同时使用 IQVIA（全球理赔）、Flatiron 或 Tempus（深度肿瘤整理）和
              Truveta（多病种 EHR
              广度）是理性的采购策略。切换成本确实存在，但运作方式不同于传统软件锁定。科学切换成本来自药企团队已经用特定平台的数据模型和方法发表同行评议研究，或提交监管资料包；在新平台上重跑这些研究，需要重新验证、监管再审查和方法学论证，可能耗时
              12–24 个月并花费大量预算。合同切换成本中等：ZS 数据显示，市场正从较旧的一次性购买模型，转向三到五年的战略数据平台合作。Truveta 的医疗服务机构治理，创造了其模型特有的信任型切换成本：依赖
              Truveta 医疗服务机构认证去标识化来做监管申报的制药团队，有信用激励留在平台上完成复现和纵向扩展研究。ADVI 2026 分析认为，RWE 现在已嵌入 Medicare
              报销决策逻辑，带来反复更新证据的要求，强化持续平台关系，而非一次性购买。多供应商并用确实降低了 Truveta 对单个制药客户的潜在收入，但平台差异化的 EHR
              来源意味着它不太可能被任何单一竞争者完全替代；更可能是在多供应商组合中争夺预算份额。
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
      - number: '3.5'
        title: 护城河耐久性、商品化风险与替代信号
        blocks:
          - type: paragraph
            body: >-
              Truveta 的护城河建立在三项相互强化的结构性优势上：（1）由 30+ 美国健康系统直接共同拥有并治理，形成数据访问和伦理来源属性；商业中介若要复制，必须从零重建医疗服务机构关系；（2）覆盖 130M+
              患者、横跨所有护理场景、每日刷新的全国代表性去标识化 EHR 资产；（3）Genome Project，把来自 Regeneron 测序和 Illumina
              基础设施的生物样本衍生基因组数据与临床记录相连——这是纯 RWD 供应商目前无法在全国规模提供的资产。对这一护城河的主要结构性威胁是 IQVIA 的分销能力：93,000 名员工、多年期企业协议和一体化 CRO
              服务，使中端市场和大型药企商业团队默认选择 IQVIA，除非买方明确把数据来源作为差异点。Tempus AI 2026 年 Q1 36% 的收入增长，以及与 Merck、Gilead、AstraZeneca
              的活跃合作，显示资金充足的多模态肿瘤数据平台可以快速赢得制药钱包份额。以理赔为中心的纯玩家（Komodo、HealthVerity）商品化风险更高，因为 FHIR 互操作性要求和 AI 驱动去标识化降低了构建
              EHR 数据流的边际成本；但 Truveta 所主张的医疗服务机构治理，无法通过标准 API 集成复制。Roche-Flatiron
              剥离信号是药企拥有平台逻辑的一项反向证据；相比药企母公司子公司，具备明确医疗服务机构共同治理的独立运营商，似乎在广泛制药合作上结构性位置更好。Truveta 仅覆盖美国，对需要 EU 或 APAC
              队列进入全球监管申报的跨国药企买方来说，仍是结构性缺口。大型药企内部自建（Roche、AstraZeneca、Novartis 内部 RWE 团队）和 TriNetX
              这类联邦替代方案，为数据科学能力强的买方提供成本有效的现状选择。大型科技潜在进入者（Microsoft、Google、Amazon）各自握有健康系统云合作，可能转成竞争性数据产品，尽管把医疗服务机构共同治理明确做成网络结构，仍构成有意义的壁垒。
