          - type: callout
            title: 所有平台输出都否认因果推断；观察性设计限制监管用途
            body: >-
              Truveta Intelligence 和所有平台输出都明确不建立因果关系，也不替代临床判断。观察性 EHR 研究仍会受到混杂、选择偏差、缺失数据以及各卫生系统记录差异的影响。FDA 尚未正式预授权或验证
              Truveta Data 可用于监管申报；Truveta 与 FDA RWE 指南的对齐来自公司自述。监管客户在申报中依赖 Truveta 输出前，必须先做独立验证。
