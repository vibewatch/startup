  - id: FU001
    title: Truveta 客户旅程图——细分客群、触点与扩张循环
    type: journey-map
    layout: wide
    summary: 截至 2026 年 5 月，四类客户（成员卫生系统、制药 / 生物技术、学术 / 公共卫生、政府）在发现、采购、上线、使用和扩张各环节的触点，都对应到 Truveta 的产品套件。
    approximationNotes: 旅程基于公开公告、RFP 文件和会议演示拼出。内部 CRM、销售周期长度和转化率不公开。成员卫生系统的旅程在结构上不同，因为成员同时也是治理方和数据贡献方。
    data:
      nodes:
        - id: seg-a
          label: 制药 / 生物技术
          description: 大型药企（Pfizer、Lilly、Novartis）和生物技术公司（Moderna、UCB）；用 Truveta 做安全性监测、标签扩展、罕见病自然史研究和监管级 RWE 生成。
        - id: seg-b
          label: 医疗器械
          description: Boston Scientific、Stryker、Medcomp、GORE、Edwards；用 Truveta 做上市后监测、UDI 级结局研究、HEOR 和差异分析。
        - id: seg-c
          label: 学术 / 公共卫生
          description: Johns Hopkins、Duke、UPenn LDI、Indiana University、AHA；用 Truveta 做比较效果、卫生服务研究、AI 模型训练和赠款资助的临床研究。
        - id: seg-d
          label: 成员卫生系统
          description: 30 家创始 / 加入的卫生系统；每天贡献数据，获得收入返还，并使用平台做内部研究和质量基准。
        - id: touch-1
          label: 发现与资格判断
          description: 会议演示（ISPOR、DIA、HLTH）、新闻稿、引用 Truveta Data 的同行评议论文；通过 truveta.com 提交的入站演示请求。
