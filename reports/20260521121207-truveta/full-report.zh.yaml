      - number: '8.5'
        title: 最终建议、置信度与尽调路径
        blocks:
          - type: paragraph
            body: >-
              最终建议是在当前估值水平下有条件通过，前提是资料室披露以下信息：（1）经审计或管理层认证的分产品板块 ARR，以及净收入留存和按收入划分的客户集中度；（2）Genome Project
              测序里程碑相对计划的进展，以及商业发布时间表；（3）贯穿 2027 年的现金跑道分析，包括所有已承诺和或有的 Genome Project
              支出；（4）成员医疗系统合同条款，包括退出条款、数据贡献义务和收入返还机制；（5）Regeneron 的数据访问权、排他性条款，以及 $119.5M Series C
              投资中嵌入的任何优先购买权或收购选择权。没有这些披露，就无法对 $1B+ 入场进行精确承销；基准情景下估值可以辩护，但按当前入场价，抵御悲观情景的安全边际很薄。

              对建议的置信度为低到中：投资逻辑在逻辑上有吸引力，战略差异也真实存在，但财务不透明使任何具体价格都无法获得高置信度。风险评级为高：监管风险（基因组数据的 HIPAA 暴露）、资本强度（Genome Project
              需要多轮融资）和平台集中度（Microsoft Azure 单一云、Regeneron 单一基因组合作伙伴）叠加，形成即便在健康技术领域也不常见的多因素风险画像。按收入代理值看，$1.0–1.4B
              估值标记属于合理到略偏高：乐观情景下合理，悲观情景下偏紧。

              哪些证据会把建议改为强烈通过：（a）披露收入处于 $100–150M+ 区间，增长超过 20%，且毛利率高；（b）Genome Project
              测序里程碑达到或领先计划，并已签署商业基因组数据合同；（c）Series C
              后有新的成员医疗系统加入，证明联盟在扩张；（d）来自战略收购方的竞争性并购报价，提供底价信号。哪些证据会把建议改为拒绝：（a）披露收入低于 $60M，或单一账户客户集中度超过 30%；（b）Genome
              Project 里程碑落后计划超过 12 个月；（c）披露任何未决监管问询或诉讼；（d）董事会会议纪要或成员往来文件披露医疗系统治理冲突。

              退出路径分析强化了有条件通过：如果 2028–2030 年以 $1.5–2.0B 完成战略并购退出——与 Flatiron 先例一致，且低于 Komodo Health 私有估值标记——那么 $1.0–1.4B
              入场并承担 30–40% 稀释，只能产生 0.8–1.2x 净回报，不足以匹配风险画像。在 30% 稀释下，要产生 2x 净回报，最低退出估值约需 $2.5–3.5B；这要求 Genome Project
              产生商业产出，并在退出日前把收入推至 $250–350M。这组回报数学说明，Genome Project 不只是战略可选项，而是投资逻辑成立所必需的财务条件。
