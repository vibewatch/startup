      - number: '6.4'
        title: 集中风险、采购摩擦与反向证据
        blocks:
          - type: paragraph
            body: >-
              Truveta 至少面对三类不同的集中风险。第一类是结构性风险：30 家成员卫生系统是 Truveta
              最大且最耐久的客户群，但也是所有外部商业收入所依赖的去标识化临床数据的唯一来源。因此，成员流失会造成双重冲击——既削弱数据供给质量，又拿走一个付费订阅者。没有成员公开退出，但也没有公开披露合同承诺期限。CHAUSA
              报道确认，成员系统「作为付费会员的一部分获得 [Truveta 数据] 访问权」，卫生系统页面则描述了面向数据贡献方的收入补偿模式。该安排的财务条款——会员费、收入分成、最低贡献义务——均未公开。

              第二类集中风险来自外部商业侧。截至 May 2026，没有客户贡献了已知收入占比，因为 ARR、客户收入分布和年合同价值（ACV）数据都未披露。Truveta 最后一次公开客户数是 100+
              家组织（November 2024）。截至 May 2026 已 6
              个月没有更新，客户数可能更高，也可能稳定，但无法确认。即便客户数已经显著增加，收入在少数大型药企账户与长尾小型学术和器械客户之间如何分布仍未知。若 Pfizer、Eli Lilly、Novartis、Bayer
              等超大药企客户持有企业许可证，它们很可能贡献了不成比例的商业收入，形成完全被公开披露遮蔽的集中风险。

              第三类集中风险是政府收入。CDC 合同终止使近期政府收入贡献基本归零，也说明在当前美国政策环境下，联邦合同不能被视为耐久基础收入。2025–2026 年更广泛的 DOGE
              驱动联邦合同扰动表明，这是一类行业风险，而非 Truveta 独有风险。

              采购摩擦方面，企业药企交易从初次接触到签约通常需要 6–18 个月，牵涉双方临床运营、监管事务和法务团队，往往要先做概念验证研究，再承诺完整订阅；获客成本高，按行业基准回本周期超过 15 个月。Johns
              Hopkins 的学术采购要求申请人在资助申请中列明 Truveta 数据费预算，满足 IRB 监督，并证明 Phase I 可行性后才能获得 Phase II
              资金资格——这种多步骤采购摩擦限制了快速采用。ISPOR 和 DIA 会议展示说明，Truveta 在会议赞助环节（主办的非 CE 案例研究）上投入明显，用于客户触达；这符合高接触、关系驱动的销售模式。

              反向证据方面，AIBrew News 引用的生物伦理学家把 Truveta 将去标识化患者数据用于商业研究变现的模式比作「Soylent Green」，提出同意和商品化担忧。虽然 Truveta 采用 HIPAA
              Expert Determination 去标识化和额外技术控制，批评者认为 EHR、理赔、SDOH 和基因组数据的大规模组合会制造重识别风险，而现有法律标准并未充分覆盖。企业药企客户和学术 IRB
              对患者隐私事件带来的声誉风险敏感；未来即便没有法律违规，一次去标识化失败也可能触发客户审查流程和采购延迟。Truveta 尚未公开任何针对重识别攻击向量的独立第三方去标识化审计结果。
