      收入代理值来自 GetLatka / Growjo 分析师情报（2024 年 $80M 基准）。倍数来自公开和私有可比公司：3x（熊市，Definitive Healthcare 压缩）、5x（基准，Tempus
      隐含）、8x（牛市，高留存 SaaS 的 Veeva 等价）、12x（M&A 溢价，Flatiron 参照）。所有数字均为估算；Truveta 未披露财务指引。
