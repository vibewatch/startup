      - number: '4.5'
        title: 财务缺口与尽调结论
        blocks:
          - type: paragraph
            body: >-
              评估 Truveta
              财务画像的根本难点是信息不对称：公司讲出了一个有吸引力的战略故事，融资、合作伙伴关系和产品发布都有确认依据，但没有提供经过验证的经营财务数据。作为没有监管披露义务的私人独角兽，这很正常；但任何投资人或商业伙伴要做资本和承诺决策时，这都会构成实质性的尽调障碍。

              主要的私有指标缺口包括：（1）Data、Evidence、Intelligence
              和政府业务的准确年经常性收入（ARR）及收入结构；（2）按板块拆分的毛利率和收入成本，尤其是基因组测序成本分摊；（3）月度烧钱速度和现金跑道；（4）净留存率（NRR），这是判断既有药企客户是在扩张还是流失的最佳单一指标；（5）2023
              年 10 月披露的「50+」之外的客户数；（6）卫生系统收入分成义务的财务条款。

              反向证据也很清楚：财务不透明，让外部无法独立判断收入质量；基因组数据大规模加入后，生物伦理学家和隐私专家担心重识别风险；CDC 合同因 DOGE 因素被部分终止，暴露政府收入的脆弱性；30
              家成员卫生系统组成的联盟结构复杂，稀释治理权，也可能拖慢商业决策，或在收入分配上制造利益冲突。

              财务结论是：按当前阶段看，Truveta 资本充足（Series C 现金跑道大概率为 2–4
              年，取决于烧钱速度），收入引擎也可信，核心资产确实难以复制。但如果拿不到经审计财务数据，外部无法独立验证收入质量、毛利率韧性和资本充足性。任何重大投资或战略合作决策，都应至少要求进入数据室查看：经审计收入和
              ARR、按产品板块拆分的毛利率、NRR、按收入计的客户集中度，以及卫生系统收入分成比例和义务时间表。
