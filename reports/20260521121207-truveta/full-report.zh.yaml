      - number: '7.4'
        title: 投资逻辑破裂触发因素、缓释措施和监测框架
        blocks:
          - type: paragraph
            body: >-
              投资逻辑破裂，指某个风险事件已经发生，或其发生概率变得可信，从而会实质损害当前对 Truveta 的投资判断。本章风险清单识别出五类投资逻辑破裂情形。

              第一类是监管行动：OCR 执法行动、州总检察长诉讼，或 FTC 调查如果点名 Truveta 的基因组数据处理或同意架构，将直接威胁 Genome Project
              的商业可行性，并可能要求公司重组运营。监测指标：任何涉及基因组数据或 EHR 聚合平台的 HHS OCR 和解协议；任何提到 Truveta 的州总检察长民事调查令；任何点名 Truveta 的 FTC 6(b)
              健康数据平台研究。

              第二类是数据泄露或安全事件：如果 Truveta 平台确认发生影响去标识化患者记录的泄露，将在成员医疗系统之间触发 BAA 责任、监管调查，并可能导致客户流失。监测指标：HHS OCR 泄露门户中来自
              Truveta 或成员医疗系统、且提到第三方服务商的通知；成员医疗系统公开文件中的网络安全事件披露；HITRUST 认证失效。

              第三类是成员医疗系统流失：失去两家或更多成员医疗系统，尤其是 Providence（创始成员）或 CommonSpirit
              Health，会同时削弱数据规模（降低商业价值）并释放治理冲突信号。监测指标：医疗系统并购活动；医疗系统宣布竞争性的 EHR 数据平台；Truveta 董事会层面的人事变化。

              第四类是合作伙伴战略转向：Microsoft 宣布推出竞争性的健康数据聚合产品，或 Regeneron 公开确认内部数据库战略将取代 Truveta
              合作，任一事件都会构成实质性投资逻辑破裂。监测指标：Microsoft Health and Life Sciences 产品公告；Regeneron 在 SEC 文件或投资者演示中的基因组数据库披露。

              第五类是商业停滞：到 2026 年底仍未披露 Genome Project 商业基因组数据板块的有意义 ARR 增长，或到 2027 年中 ARR 仍低于
              $50M，都将说明大规模产品市场匹配失败。监测指标：Truveta 发布商业基因组数据客户的新闻稿；CHAUSA 成员医疗系统关于 Truveta 治理的报告；vctavern.com 和 tracxn.com
              的融资或估值更新。

              已有缓释措施包括：用于安全控制的 HITRUST R2 认证；倡导公共事业框架，显示公司在主动参与监管沟通；医疗系统激励相互绑定的联盟治理结构；Illumina、Regeneron 和成员医疗系统对 Genome
              Project 的多年承诺带来的结构性锁定效应。关键尽调事项：（1）索取 Truveta 关于基因组数据去标识化是否满足 HIPAA Safe Harbor
              的法律意见；（2）索取成员医疗系统的合同承诺条款，包括退出条款；（3）确认 Regeneron 在 Genome Project 中的数据排他性或优先访问条款；（4）取得网络安全事件历史以及与成员医疗系统的
              BAA 条款；（5）审阅分业务 ARR 与政府收入集中度；（6）取得 HITRUST 认证范围文件。
