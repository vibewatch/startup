      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Truveta 的资本形成已在公司概况章节详细说明。作为前瞻财务评估的背景：截至 2026 年 4 月，公司累计融资约 $515M，其中锚定项是 2025 年 1 月 $320M Series
              C，该轮明确指定用于 Truveta Genome Project 基础设施建设。

              现金头寸和月度烧钱速度未公开披露。按保守情景——每年运营费用 $120–$160M（人员、Azure、合规、G&A），对估计收入 $80–100M——意味着在考虑 Genome Project
              资本开支前，每年净现金消耗 $20–$80M。如果 Series C 主要专用于基因组项目，按预计测序规模，可能在 3–5 年内被大幅消耗。更乐观情景下，如果商业收入增至 $150M
              且成本纪律得以维持，现金跑道会进一步延长，但这要求持续企业销售执行，而公开信息无法验证。

              投资者基础同时带来优势和风险。17 家健康系统投资者、Regeneron、Illumina 和 Microsoft 提供耐心长期资本，目标是战略数据访问，而非短期流动性。不过，截至 2026 年 5
              月，Truveta 没有已确认的 IPO 或二级市场流动性事件路径；缺少带基金周期压力的传统 VC 领投方，可能降低公司走向盈利或追求近期退出的紧迫感。

              CDC 合同带来的政府收入是真实但有限的多元化。原始 $10.3M 合同在 2025 年根据 DOGE 指令被部分终止，随后修改将合同延至 2026 年 7
              月，但未履约金额降低。合同记录审查显示，剩余未履约金额只有 $120,000。这一事件说明，政府收入虽然能为商业制药客户背书，但在联邦预算和政策波动下，运营上很脆弱。
