  - id: FV004
    title: 投资 KPI——围绕八个维度的 IC 审议就绪评分
    type: kpi
    layout: wide
    summary: 截至 2026-05-21，投资委员会从市场、验证、护城河、经济性、风险、估值、证据质量和退出八个维度对 Truveta 做定性评分。评级来自八个章节的有来源证据汇总，不是定量分数。
    approximationNotes: 评级（强 / 中等 / 弱 / 高风险）是基于第 1–8 章综合证据的定性判断。证据质量评级反映公开信息的不确定程度。所有判断截至研究日期（2026-05-21）。
    data:
      items:
        - label: 市场机会
          value: Strong
          note: RWE + 基因组学市场规模大、增长快，结构上利好一体化数据平台
        - label: 产品技术验证
          value: Moderate-Strong
          note: 50+ 客户；具名药企账户；Genome Project 启动；TLM 已部署——验证点很强，但收入披露有限
        - label: 竞争护城河
          value: Moderate-Strong
          note: 医疗机构治理护城河独特；相对 IQVIA，在数据质量上耐久；但商业规模上受 IQVIA 威胁
        - label: 单位经济性 / 财务
          value: Weak (Opacity)
          note: 只有 ~$80M ARR 代理值；没有利润率、NRR 或流失数据；这是投资信心的最大约束
        - label: 风险画像
          value: High Risk
          note: HIPAA 基因组敞口；Genome Project 资本强度；平台集中度；政府收入脆弱性
        - label: 估值
          value: Fair to Slightly Rich
          note: $1.0–1.4B，对应约 12–18x 代理 ARR；基准情形回报有限；牛市需要 Genome Project 商业化成功
        - label: 证据质量
          value: Low-Medium
          note: 只有收入代理值；治理条款不公开；Regeneron 数据访问条款未知；缺少监管意见
        - label: 退出准备度
          value: Moderate
          note: M&A 路径可行（Flatiron 先例、药企有胃口）；短期 IPO 可能性低；股权结构复杂
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
