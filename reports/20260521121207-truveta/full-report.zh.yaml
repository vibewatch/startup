      - number: '1.3'
        title: 融资、资本形成与里程碑
        blocks:
          - type: paragraph
            body: >-
              Truveta 的融资历史显示公司快速扩张，但经济透明度不完整。公司 2021 年 7 月披露近 $100M Series A，同年通过 Microsoft 战略投资和 Azure 独家云合作继续扩展，并在
              2021 年 11 月称已获得近 $200M 融资。公开金额最大的一轮发生在 2025 年 1 月，Truveta 从 17 家健康系统、Regeneron 和 Illumina 获得 $320M Series
              C，估值高于 $1B。Regeneron 单独投资 $119.5M，Illumina 投资 $20M。该轮之后，Truveta 和 GeekWire 将累计资本描述为接近 $500M，而 Tracxn
              报告四轮合计 $515M；差异很可能来自未披露的 Microsoft 分批投资和私募轮记账，而非实质矛盾。即便精确累计现金不明，运营里程碑仍清晰：2020 年疫情期创立的数据协作，2021
              年商业平台扩张，2023 年更广泛客户采用，2025 年基因组学阶跃，2026 年实时 AI 智能产品和更深入的科学领导层。
