      - number: '5.2'
        title: Truveta Language Model——临床 NLP 与数据标准化
        blocks:
          - type: paragraph
            body: >-
              Truveta Language Model（TLM）是 Truveta 的核心技术资产，也是原始、异构 EHR 数据变成可用于研究证据的主要机制。TLM 是一套大语言、多模态 AI 模型，训练数据来自 100
              million 以上患者的完整医疗记录，包括 5.5 billion 条诊断、3.1 billion 次临床就诊、2.4 billion 条用药医嘱和 7 billion
              以上临床笔记。不同于在公开互联网文本上训练的通用 LLM，TLM
              把预训练开放大语言模型与去标识化医疗数据的深度训练、数万条原始临床术语的临床专家标注结合起来，在诊断、用药、实验室结果、实验室数值和临床观察等维度上准确率超过 90%，并在临床抽取任务上超过 GPT-4 以及
              LogMap、AML 等本体映射工具。TLM 的临床专家标注员会标注原始术语，并在模型运行时检查模型输出，形成有人在环的准确率管线。TLM
              处理两类数据的标准化：半结构化数据（实验室检查、诊断、手术、用药、器械）和完全非结构化的自由文本临床笔记。对于笔记，TLM
              会抽取疾病分期、不良事件、用药理由变化、复杂治疗关系等临床概念，例如把某次药物不良反应与后续诊断关联起来；这些信息在结构化 EHR 字段和理赔数据中不存在。TLM
              还识别临床研究关键的语言修饰：否定（「患者否认乏力」）、假设（「如果 A1C 仍然升高，将考虑启用 glipizide」）和家族史引用，并把它们映射到正确的临床语境，而不是误放进患者自身记录。Truveta
              Data Model（TDM）是所有 TLM 标准化数据映射进入的内部数据架构。TLM 获得了 2024 SXSW Innovation Award in
              AI。局限包括依赖临床专家标注员、罕见编码和专科术语需要持续再训练，以及缺少独立同行评审基准验证——所有已发布准确率数据都由公司披露。
