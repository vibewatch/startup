      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Truveta 的商业买方可归入五个清晰细分，每个细分的用例、预算归属和采购触发点都不同。制药和生物科技公司是主要买方：CB Insights 称，其研发和医学事务职能每年在单个 RWD 数据集上花费
              $75,000–$5,000,000，肿瘤和罕见病项目支出最高。医疗器械公司是新兴买方：FDA 2025 年 12 月指南为器械申报中的去标识化 RWD 打开有条件路径，直接激活这一细分的采购。健康系统既是
              Truveta
              底层数据供应方，也是平台返还分析能力的潜在买方；这种双重关系可加快成交。学术和公卫研究者规模较小，但战略上重要，可通过同行评议发表和监管试点提升可信度。支付方（健康保险公司）增长很快，因为基于价值的合同需要更丰富临床证据来裁定基于结果的药品报销。采用路径差异显著：大型药企通常先做一个
              RWE 试点研究，再谈多年数据订阅，随后扩展到平台服务；健康系统遵循较慢的 IT
              治理周期，签约前通常要求对去标识化方法进行合规审查。制药侧预算所有权通常在首席医学官、证据生成负责人或数据科学负责人手中，而非采购部门，因此周期比资本预算流程更快。
