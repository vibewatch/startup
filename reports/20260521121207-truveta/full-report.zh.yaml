            - 早期 / 刚推出（2026 年 4 月）
            - 高——RWE 市场里首个在这一 EHR 规模上接入实时数据的自然语言查询产品
            - 没有采用指标；自然语言准确率未经独立基准测试；仅面向订阅用户
        - label: Genome Project（EHR-外显子组联结）
          values:
