    rows:
      - - 平台层勒索软件或数据泄露
        - 网络安全
        - 中 — 健康平台被高频攻击；30 个系统聚合带来集中敞口
        - 高 — 130M+ 份患者记录泄露会触发 HIPAA 通知、30 个系统范围内的潜在 BAA 责任和声誉损害
        - HITRUST R2 认证；Microsoft Azure 安全控制；迄今未披露泄露
        - 索取平台上线以来的事件历史；确认网络保险覆盖和保额；核验泄露响应计划
      - - EHR 数据质量缺口引发研究有效性担忧
        - 数据质量
        - 中 — 30 个系统带来的 EHR 数据异质性是内生问题；Truveta 承认数据质量是重点领域
        - 中 — 研究客户若发现系统性偏差或完整性缺口，可能压低续约率或引发负面发表
        - Truveta 白皮书描述了多层质量保证流程；未披露独立审计结果
        - 索取独立数据质量审计结果；取得按疾病领域和患者人群划分的完整性统计；询问已知偏差刻画
      - - 基因组数据质量与 WGS 错误率
        - 数据质量
        - 低-中 — 人群规模下 WGS 错误率属常规问题；与 EHR 关联会放大下游错误影响
        - 中 — 系统性的基因组-临床数据错配可能削弱 Genome Project 的研究价值主张
        - Illumina 和 Regeneron 作为测序伙伴带来规模和流程成熟度；未披露关联数据准确率
        - 索取 WGS 质量指标，包括覆盖深度和错误率；确认是否有基因组-EHR 关联准确性的验证研究
      - - 成员医疗系统撤回数据贡献
        - 运营
        - 低 — 股权和治理结构对齐；未披露退出
        - 高 — 流失一个大型成员会同时压缩数据规模和收入；数据网络效应反转
        - 30 个成员系统既是股东也是董事会治理方；切换成本高；5 年内无公开退出
        - 审查成员系统合同中的数据贡献义务；识别是否存在退出条款；评估董事会一致性
      - - EHR 互操作标准的监管扰动
        - 运营
        - 低 — ONC 21st Century Cures 规则支持互操作；逆转可能性低，但政策风险存在
        - 中 — FHIR 或 HL7 互操作要求变化可能需要大规模重构
        - Truveta 基于 FHIR 的 ETL 架构与 ONC 标准一致；未见监管逆转信号
        - 确认 FHIR 版本覆盖和未来 ONC 更新准备度；评估重大标准变化所需的重构成本
    notes: >-
