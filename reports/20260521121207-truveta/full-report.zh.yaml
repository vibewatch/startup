  - id: FV003
    title: 估值与回报区间——熊市、基准和牛市退出场景
    type: range
    layout: wide
    summary: 三种场景下的低、中、高退出企业价值，以及在当前 $1.0-1.4B 进入估值、假设 30-40% 稀释时对应的净回报。除非另有说明，所有数值单位为百万美元。收入代理值为分析师估算；未经 Truveta 确认。
    approximationNotes: 所有数值都是基于收入代理值、可比公司分析和退出倍数假设的场景估算。净回报对按比例进入投资应用 35% 示意性稀释。Truveta 未提供财务指引，也未确认收入指标。
