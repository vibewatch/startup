  - id: FE004
    title: 产品成熟度与差异化图——Truveta 平台能力（2026 年 5 月）
    type: matrix
    layout: wide
    summary: 评估 Truveta 每项主要能力在两个轴上的位置：商业成熟度（GA 到商业化前）和竞争差异化强度（低到非常高）。单元格给出相对于 RWD/RWE 市场可比产品的有证据支持定位。
    approximationNotes: 成熟度等级基于公司产品公告和市场证据。差异化评级是研究者基于第 3 章竞争者分析和获取来源做出的评估，不是厂商自评。Genome Project 差异化评级是潜力（预测），不是当前商业位置。
    data:
      columns:
        - 商业成熟度
        - 相对竞争者的差异化
        - 关键风险
      rows:
        - label: Truveta Data（EHR 广度 + 每日刷新）
          values:
            - GA / 成熟
            - 高——130M 名患者、直接 EHR、每日刷新，超过大多数竞争者
            - EHR 系统之间数据完整性不一；部分专科有广度但缺深度
        - label: TLM 临床 NLP（非结构化病历备注提取）
          values:
            - GA / 成熟
            - 非常高——临床备注准确率 >90%；在这一 EHR 规模上没有可比竞争者
            - 只有公司报告的准确率；没有独立同行评议基准
        - label: Truveta Studio / Evidence（监管工作流）
          values:
            - GA / 成熟
            - 中-高——审计追踪和 FDA 对齐工作流；并非独有，但文档充分
            - 未获得 FDA 预授权；监管有效性需要逐项研究验证
        - label: SDOH + 理赔关联（45 项属性、200M 理赔）
          values:
            - GA / 成熟
            - 高——45 项患者级 SDOH 属性与 EHR 关联，在这一规模上并不常见
            - LexisNexis 授权连续性；SDOH 覆盖可能因地区而异
        - label: Truveta Intelligence（自然语言 AI 查询）
