      - number: '6.2'
        title: 具名客户证据与生产级用例
        blocks:
          - type: paragraph
            body: >-
              具名客户证据的深度在不同板块之间差异很大：有的药企案例是与具名高管共同发布、并带有结果指标的详细案例研究；有的器械和学术案例只披露标识，没有项目描述。最强证据来自制药和生物技术板块。

              Pfizer 的用例资历最久。作为 Truveta 在 June 2022 签下的首个大型药企客户，Pfizer 使用 Truveta Data 在其产品组合中近实时识别、监测并评估潜在安全信号，包括
              COVID-19 疫苗 Comirnaty。Pfizer 首席医学官公开称 Truveta
              提供了「美国最及时、最完整的数据集之一」，让公司能够「以前所未有的速度和规模直接从去标识化患者数据中学习」。这是生产级安全监测部署，不是试点。

              Boston Scientific 于 September 2022 与 Truveta 签署战略合作协议，研究外周动脉疾病（PAD）、静脉血栓栓塞性疾病和介入肿瘤学中的术后患者结果与医疗差异。使用
              Truveta Data 的初步 PAD 分析发现，患有 PAD 的黑人或非裔美国患者接受血运重建手术的概率更低（1.0% vs. 白人患者的 2.6%），接受药物洗脱支架的概率也更低。该合作也支撑了
              REAL-PE Analysis；这是一项关于肺栓塞超声辅助导管定向溶栓的真实世界研究，已发表并在 2023 年 JSCAI 上展示。透析设备制造商 Medcomp 发布案例研究，使用 Truveta Data
              比较血液透析导管设计，并挖掘产品安全和开发洞察。September 2025，Truveta 通过整合唯一器械标识（UDI）数据、分钟级 ADT
              和收费主数据（chargemaster），扩大器械数据能力；公司称覆盖 27,000 多个品牌的 300,000 多个 UDI，并拥有 10 million 以上患者的器械记录和临床笔记。

              Moderna 的用例于 May 2024 在 ISPOR 上公开联合展示，演讲者包括 Moderna 自己的罕见病流行病学总监。Moderna 使用 Truveta Data
              研究鸟氨酸氨甲酰转移酶缺乏症（OTCD），这是一种罕见遗传性酶缺陷；研究重点是在传统数据源有限的情况下理解患者负担、治疗模式和潜在临床试验终点。UCB 使用 Truveta Data
              研究化脓性汗腺炎（HS）患者旅程；这种慢性炎症性皮肤病诊断不足，Truveta 帮助其理解护理地点、确诊时间和干预历史。Boehringer Ingelheim 使用 Truveta Data
              研究从病理报告和临床医生笔记中抽取的 NASH 生物标志物，加速诊断和治疗路径识别。

              Johns Hopkins HBHI 是记录最充分的学术采用案例。2025 年试点项目吸引了 Johns Hopkins 内部 40 多份申请，授予 25 个 Phase I 试点小额可行性资助，并将 11
              个项目推进到 Phase II，每个项目最高 $25,000，且包括 Truveta 数据费覆盖。研究项目横跨自身免疫病、痴呆、肿瘤学、孕产健康、物质使用和卫生服务研究，全部把 Truveta
              用作主要数据基础设施。每月一次的 HBHI-Truveta User Community 会议用于沉淀经验。

              DIA Real World Evidence Conference 2025 设置了 Truveta 主办的案例研究环节，展示两个生产级案例：一项 GLP-1
              比较效果研究，比一项大型临床试验提前一年多得出结果，后续被该试验验证；以及一家器械制造商研究，用更大、更当代的患者队列复现注册登记结果。这些会议展示确认，Truveta 客户实现的研究周期明显快于传统方法。
