              $10.3 million CDC 合同——Truveta 唯一公开确认的政府客户——于 July 2025 被列入 DOGE 终止名单，并在 January 2026 以便利终止方式部分终止，只剩
              $120,000 待履约金额。该结果在近期消除了政府收入作为可靠基础的可能，也说明健康数据分析中的联邦合同容易受到政策驱动的扰动。虽然 CDC 合同曾验证商业可信度（5
