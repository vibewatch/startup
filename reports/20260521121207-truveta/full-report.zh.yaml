      - number: '4.3'
        title: 单位经济代理指标与销售动作
        blocks:
          - type: paragraph
            body: >-
              Truveta 未披露任何正式单位经济指标——截至 2026 年 5 月，公开渠道没有年经常性收入（ARR）、净留存率、LTV、CAC 或毛利率数字。以下分析依赖分析师调研信息估计、上市同业数据和第一性原理推导。

              每员工收入是最容易取得的代理指标。按估计 $80M 年收入（2024 年分析师代理）和约 400 名员工计算，Truveta 每员工收入约为 $186,000–$200,000。低于同等规模纯 SaaS
              平台常见的 $250,000–$350,000 区间，但与混合自有数据订阅、科学顾问和证据生成服务的数据服务业务相符。

              订阅数据层的毛利率可能较高——医疗 RWD/RWE SaaS 平台行业基准显示，纯软件 / 数据访问收入可达
              75–80%+——但会被医疗服务机构收入分成义务、数据运营成本（整理、去标识化、标准化）和基因组测序成本层显著压缩。估计综合毛利率 50–70% 是合理的，但这是推断值，对 Truveta
              未披露的收入分成比例和测序成本分摊敏感。

              销售周期和 CAC 估计反映企业生命科学采购语境。RWE 平台交易通常从初次接触到签约需 6–18 个月，涉及双方临床运营、监管事务和法律团队，且常在完整订阅承诺前要求概念验证研究数据。该细分 CAC 高；企业
              B2B 医疗 SaaS 行业基准显示回本周期为 15+ 个月。Truveta 差异化网络资产应能支撑溢价定价，并在续约时降低竞争压力，但公司公开历史较短，限制了实证留存数据。

              公开可比代理是 Tempus AI 的 Data and Applications 细分，仅 2026 年 Q1 就同比增长 40.5% 至 $87M（年化 $350M），显示市场对带 AI
              层临床数据平台需求强劲。Truveta 缺少 Tempus 的诊断收入支柱，但 EHR 数据广度更深；其数据细分本身似乎只有 Tempus 数据细分规模的一小部分，不过基因组学加入可能实质性改变这一轨迹。
