      - number: '2.5'
        title: 采用约束与反向证据
        blocks:
          - type: paragraph
            body: >
              Truveta 面临几类结构性逆风，可能限制或延缓市场渗透。数据质量和方法学标准已大幅提高：FDA 2026 年 3 月采纳 ICH M14，意味着单独的 EHR
              导出不再足以作为监管证据；研究启动前，现在需要预先指定的研究方案、数据来源证明文件，以及由 FDA
              审阅的统计分析计划。这抬高买方合规成本，可能拉长销售周期，并把买方限制在规模更大、资源更足的药企团队。全球隐私监管正在加码：全球超过 80% 人口已受到某种隐私法规覆盖，中国和部分 EU
              地区的数据本地化要求让跨境 RWD 流动更复杂。2025 年每起医疗数据泄露平均成本为 $7.42M，提高了市场对共享去标识化记录的敏感度。STAT News
              引述生物伦理学家批评，健康数据公司在没有明确同意的情况下从患者记录获利，这带来声誉风险，并可能触发未来立法限制。现有玩家竞争激烈：IQVIA、Optum（UnitedHealth）、Oracle
              Health、Flatiron（Roche）和 Tempus 合计握有大型客户关系、数据许可和监管记录。健康系统采购周期通常为 12–24 个月，因为要走安全审查、法律和 IT 治理流程。最后，2025–2026
              年行政命令推动的最惠国药价压缩制药研发预算，可能推迟可选 RWE 平台支出。不同分析师对市场规模估计因范围不同相差超过 4×，提高了 Truveta 投资者把过于乐观 TAM 定价进去的风险。
            claimRefs:
              - CM027
