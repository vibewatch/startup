      - number: '5.3'
        title: Truveta Studio、Evidence 与 Intelligence
        blocks:
          - type: paragraph
            body: >-
              Truveta Studio 是云托管、仅面向订阅者的分析环境，客户通过它访问 Truveta Data。它提供四个核心工具：Prose，一种类 SQL
              的领域专用查询语言，用来定义患者队列；Snapshots，用来在指定时点冻结并导出队列数据；Notebooks，用于高级统计分析和模型开发；以及 Truveta
              Library，一个已验证临床数据定义仓库，研究人员可从中提取预置代码集。March 2025，Truveta
              新增两项重要能力：特征表生成（借助快速变量选择、行级预览和汇总统计，把队列构建从数周压缩到数分钟）和资格筛选器（允许研究人员按患者多样性、罕见病量或医疗器械使用情况选择护理站点）。Truveta Evidence
              是 Studio 的监管级层，提供审计就绪工作流、数据来源文档和流程控制，对齐 FDA 真实世界证据指南，服务于上市后监测、比较效果研究和监管申报。March 2025
              加入的行政数据（入院-出院-转院记录、计费链接、服务方资源分配）加深了纵向研究能力，包括在院内按秒追踪患者移动。最新产品 Truveta Intelligence（April 28, 2026）在完整 130M
              患者语料之上叠加自然语言 AI 查询界面，让研究人员能用日常英语提问，并在几分钟内得到答案，底层代码集和方法学可完全检查。Intelligence 明确不建立因果关系，也不替代临床判断。所有产品都需要企业级
              Data 订阅；没有自助试用或公开 API，这把访问限制在有预算且有法务能力走完企业销售流程的组织内。
