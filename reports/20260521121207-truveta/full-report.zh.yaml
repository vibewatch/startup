      - number: '5.6'
        title: 差异化、依赖与局限
        blocks:
          - type: paragraph
            body: >-
              相比基于理赔的竞争者（IQVIA、Optum、Komodo）和聚焦肿瘤的平台（Flatiron、Tempus AI），Truveta 的差异化建立在五根支柱上：（1）由服务方治理、直接来自 30
              家成员卫生系统的无偏 EHR 数据，不经过商业账单归一化；（2）TLM 驱动的临床 NLP，能从非结构化笔记中抽取纯理赔或结构化 EHR
              服务商无法提供的信息；（3）每日数据刷新，优于竞争者的月度或季度更新；（4）覆盖 50 个州、专科、支付方和年龄组，并包括儿科和孕产健康，具备全国代表性；（5）Genome
              Project，这是已知唯一在单一研究生态内建设 10 million 参与者 EHR-基因组关联数据库的项目。ISPOR 2024 会议展示，以及 Penn LDI、JHU HBHI 等学术机构采用
              Truveta，都记录了从业者对其研究效用的认可，且不局限于生命科学商业场景。若中断会实质性削弱平台的关键依赖包括：Microsoft Azure（独家云服务商；迁移成本高）、Regeneron Genetics
              Center（10M 外显子组的唯一测序伙伴）、Illumina（测序技术供应）、LexisNexis Risk Solutions（SDOH 和死亡数据）以及
              Surescripts（药房配药数据）。关键平台局限包括：（1）Truveta Intelligence 和 Evidence
              的所有输出都明确否认因果推断能力——平台产出相关性，不产出因果性；（2）仅订阅模式且没有公开 API 或试用层，限制了学术、政府和小团队访问；（3）数据质量和完整性会随卫生系统 EHR
              记录实践而变化；（4）与客户内部数据互操作需要定制集成；（5）Genome Project 仍处于商业化前阶段，带有同意获取、吞吐量和监管复杂性风险；（6）所有已发布 TLM
              准确率基准均由公司披露，而非独立同行评审。
