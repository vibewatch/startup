  - id: "moat-durability-displacement-risk"
    title: "Moat Durability, Commoditization Risk, and Displacement Signals"
    body: >-
      Truveta's moat rests on three reinforcing structural advantages: (1) direct co-ownership and
      governance by 30+ US health systems, creating data-access and ethical-provenance attributes
      that commercial intermediaries cannot replicate without re-building provider relationships from
      scratch; (2) a nationally representative de-identified EHR asset covering 130 million+ patients
      across all care settings with daily refresh; and (3) the Genome Project, which links biospecimen-
      derived genomic data from Regeneron sequencing and Illumina infrastructure to the clinical record—
      an asset no pure RWD vendor currently offers at national scale. The primary structural threat
      to this moat is IQVIA's distribution: 93,000 employees, multi-year enterprise agreements, and
      integrated CRO services mean that mid-market and large-pharma commercial teams default to IQVIA
      unless a buyer explicitly differentiates on data provenance. Tempus AI's 36% revenue growth
      (Q1 2026) and active partnerships with Merck, Gilead, and AstraZeneca show that a well-funded
      multimodal oncology data platform can win pharma wallet share at speed. Commoditization risk
      is elevated for claims-focused pure-play vendors (Komodo, HealthVerity) as FHIR interoperability
      mandates and AI-powered de-identification lower the marginal cost of building EHR data feeds,
      but provider governance—the specific claim Truveta makes—is not replicable by standard API
      integration. The Roche-Flatiron divestiture signal is adverse evidence for the pharma-owned-
      platform thesis in general; independent operators with explicit provider co-governance appear
      structurally better positioned for broad pharma partnership than parent-pharma subsidiaries.
      Truveta's US-only coverage remains an adverse structural gap for multinational pharma buyers
      who need EU or APAC cohorts in their global regulatory filings. Internal build at large pharma
      (Roche, AstraZeneca, Novartis in-house RWE teams) and federated alternatives like TriNetX
      provide cost-effective status-quo options for buyers with strong data-science capabilities.
      Big-tech latent entrants (Microsoft, Google, Amazon) each hold health-system cloud partnerships
      that could be converted into competing data products, though provider co-governance as an
      explicit network structure creates a meaningful barrier.
