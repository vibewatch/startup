    title: "Competitive Positioning Map — US Clinical EHR Depth vs. AI/Analytics Capability (2026)"
    type: quadrant
    layout: wide
    summary: >-
      Evidence-backed ordinal positioning of nine competitors on two axes: US clinical EHR data depth
      (1=claims-only, 5=provider-governed multi-system EHR at scale) and AI/analytics capability
      (1=basic query, 5=LLM-powered evidence generation with regulatory-grade output).
    data:
      points:
        - label: "Truveta"
          x: 5
          y: 4
        - label: "IQVIA"
          x: 3
          y: 5
        - label: "Flatiron (Roche)"
          x: 4
          y: 4
        - label: "Tempus AI"
          x: 4
          y: 4
        - label: "Komodo Health"
          x: 2
          y: 3
        - label: "Datavant"
          x: 2
          y: 3
        - label: "HealthVerity"
          x: 2
          y: 2
        - label: "TriNetX"
          x: 3
          y: 2
    approximationNotes: >-
      Axes use evidence-backed ordinal scores (1–5), not continuous numeric measurements. X-axis
      (EHR depth) reflects source data type (provider-governed EHR = 5, claims-primary = 2, mixed = 3);
      Y-axis (AI capability) reflects maturity of AI analytics layer in 2026 (LLM + regulatory-grade = 4–5,
      basic query = 2). Flatiron and Tempus are oncology-restricted; their high scores reflect depth within
      oncology, not all-condition breadth.
    claimRefs:
      - CP007
      - CP008
      - CP012
      - CP016
      - CP020
      - CP024
      - CP032

  - id: "FP002"
    title: "Feature Breadth / Capability Map — Competitor Coverage by Key Buying Criterion"
    type: matrix
    layout: wide
    summary: >-
      Evidence-based capability matrix comparing Truveta and six primary competitors across eight
      buying criteria central to pharma RWE procurement in 2026.
    data:
      columns:
        - "Truveta"
        - "IQVIA"
        - "Flatiron"
        - "Komodo"
        - "Tempus AI"
        - "Datavant"
        - "TriNetX"
      rows:
        - label: "Provider-governed EHR"
          values: ["Full ✓", "No", "Oncology only", "No", "No", "No", "Federated only"]
        - label: "National US breadth (130M+)"
          values: ["Yes ✓", "Yes", "Partial", "Yes", "Partial", "Yes", "Yes"]
        - label: "Genomics linkage"
          values: ["Yes ✓", "Partial", "Partial", "No", "Yes (onco)", "Partial", "No"]
        - label: "Daily data refresh"
          values: ["Yes ✓", "Partial", "Unknown", "Yes", "Partial", "Partial", "Unknown"]
        - label: "AI evidence generation layer"
          values: ["Yes ✓", "Yes", "Yes (2026)", "Partial", "Yes", "Partial", "Partial"]
        - label: "Regulatory-grade RWE"
          values: ["Yes ✓", "Yes", "Yes", "Partial", "Partial", "Yes (Aetion)", "Partial"]
        - label: "Non-oncology coverage"
          values: ["Yes ✓", "Yes", "No", "Yes", "Limited", "Yes", "Yes"]
        - label: "No pharma-parent conflict"
          values: ["Yes ✓", "Yes", "No (Roche)", "Yes", "Yes", "Yes", "Yes"]
    approximationNotes: >-
      Matrix cells use evidence-backed ordinal labels: Yes = confirmed by public source; Partial = some
      capability confirmed but scope limited; No = confirmed absent or primary business model excludes it;
      Unknown = no public evidence found. Cells are not vendor self-reports; they are researcher assessments
      based on fetched URLs as of 2026-05-21.
    claimRefs:
      - CP007
      - CP008
      - CP010
      - CP011
      - CP014
      - CP022
      - CP024
      - CP032

  - id: "FP003"
    title: "Moat / Readiness KPIs — Truveta Competitive Durability Indicators"
    type: kpi
    layout: compact
    summary: >-
      Six competitive durability indicators assessing strength of Truveta's core moat attributes
      relative to the competitive landscape as of 2026-05-21.
    data:
      items:
        - label: "Provider-governance moat"
          value: "High"
          note: "30+ health-system co-owners; no replicable competitor structure in 2026"
        - label: "Genomics linkage advantage"
          value: "High (today) / At risk"
          note: "Regeneron + Illumina backing; Tempus and Flatiron eroding oncology genomics gap"
        - label: "AI evidence layer differentiation"
          value: "Medium"
          note: "Truveta Intelligence (Apr 2026) vs. Flatiron Telescope (May 2026) and Tempus Lens — fast-follower risk"
        - label: "Distribution / commercial reach vs. IQVIA"
          value: "Low"
          note: "IQVIA 93K employees and multi-year enterprise contracts remain dominant distribution moat"
        - label: "US-only data coverage gap"
          value: "Adverse"
          note: "No EU or APAC cohorts; structural limitation for multinational pharma regulatory filings"
        - label: "Multi-homing lock-in durability"
          value: "Medium"
          note: "Scientific switching costs (12–24 months re-validation) plus provider-governance trust offset pharma multi-homing behavior"
    approximationNotes: >-
      KPI ratings (High / Medium / Low / Adverse) are qualitative assessments derived from sourced evidence
      and reflect the research-date view (2026-05-21). They are directional and not quantitative scores.
    claimRefs:
      - CP031
      - CP033
      - CP035
      - CP038
      - CP039
      - CP040

callouts:
  - calloutType: "risk"
    title: "IQVIA's Distribution Moat Is the Most Durable Near-Term Threat"
    body: >-
      Truveta's data provenance is superior to IQVIA's, but IQVIA's 93,000-person global organization,
      integrated CRO services, and long-standing enterprise agreements create a commercial flywheel that
      is very difficult to displace in the near term. Pharma RFPs where IQVIA is the incumbent vendor
      default rarely go to a new entrant without a demonstrated regulatory-grade proof-of-concept. Truveta's
      commercial win rate against IQVIA in head-to-head RFPs is an unresolved diligence question.
    claimRefs:
      - CP033
      - CP007
      - CP044
  - calloutType: "insight"
    title: "Roche's Potential Flatiron Divestiture Validates Truveta's Independent Positioning"
    body: >-
      Multiple independent sources in 2024–2026 report Roche evaluating strategic options for Flatiron,
      including a potential sale. The reported driver is channel conflict: rival pharma companies have been
      reluctant to share competitive data with a Roche subsidiary. If Flatiron is divested, it becomes a
      stronger direct competitor for Truveta in oncology RWE. However, the episode validates that
      provider-governed independent data platforms command higher buyer trust than pharma-subsidiary
      alternatives—a structural advantage Truveta holds over any pharma-parent-owned RWD entity.
    claimRefs:
      - CP010
      - CP011
      - CP034
  - calloutType: "risk"
    title: "AI Analytics Parity Is Approaching Rapidly"
    body: >-
      Truveta launched Truveta Intelligence in April 2026; Flatiron launched Telescope in May 2026;
      TriNetX and Tempus both announced LLM-based evidence tools in 2025–2026. AI analytics features
      are replicable faster than the underlying data assets, and the feature-parity window for the
      analytics layer may be 12–18 months. Truveta's durable advantage must rest on data provenance
      and governance, not the analytics wrapper alone.
    claimRefs:
      - CP009
      - CP014
      - CP031

