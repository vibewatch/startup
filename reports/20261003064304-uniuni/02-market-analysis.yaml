callouts:
  - calloutType: "insight"
    title: "The Margin Dynamics of the Crowdsourced Parcel Model"
    body: "Alternative last-mile carriers disrupt legacy couriers by replacing fixed capital infrastructure—such as unionized vehicle fleets and heavy depreciation—with algorithmic dispatch and gig-economy drivers. Operating at less than half the price of legacy carriers enables explosive volume acquisition from price-sensitive global marketplaces, though sustaining this advantage requires maintaining high package density and avoiding labor reclassification."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM011"
      - "CM015"
  - calloutType: "risk"
    title: "Labor Reclassification and Client Concentration Vulnerability"
    body: "While crowdsourced delivery networks achieve unparalleled cost efficiency, they operate under substantial regulatory and operational risk. Driver misclassification class-action lawsuits in the United States and heavy dependence on a small group of fast-fashion cross-border e-commerce giants present structural threats to sustained margin expansion."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM012"
      - "CM014"
