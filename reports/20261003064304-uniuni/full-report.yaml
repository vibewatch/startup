              - CV015
              - CV016
      - number: '8.5'
        title: Comparable Multiples Benchmark, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Benchmarking UniUni against public courier networks, freight logistics providers, and private last-mile
              peers demonstrates that headline revenue multiples in logistics are tightly tethered to operating margin
              stability and asset intensity. Listed regional and intra-city logistics peers trade across a wide multiple
              spectrum: intra-city delivery operator Hangzhou SF Intra-City trades at 0.2x revenue and 12.8x EBITDA,
              while dedicated trucking and transport firms Heartland Express and Marten Transport trade at 1.1x to 1.3x
              revenue and 6.6x to 9.7x EBITDA. Specialized air cargo carrier Cargojet trades at 2.0x to 2.2x revenue
              reflecting high capital moats. UniUni's valuation of US$1.0B at ~0.91x 2026 revenue appears unanchored
              from audited cash flows given its US$70M net loss in 2025. Institutional participation requires definitive
              diligence verification: resolving the legal status and closing timeline of the MAK Acquisition
              transaction, obtaining audited customer revenue concentration schedules for Shein and Temu, inspecting
              independent contractor legal opinions across key state operating jurisdictions, and validating net
              per-stop contribution margins.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV014
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: research-more at Proposed Valuation'
            body: >-
              We recommend institutional investors adopt a research-more stance on UniUni. While top-line growth is
              among the fastest in North American logistics, the US$1.0 billion valuation benchmark is clouded by the
              reported breakdown of its TSX reverse takeover, heavy customer reliance on discount cross-border
              marketplaces, and ongoing labor misclassification litigation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV011
          - type: callout
            title: Transaction Fragility and Imminent Peak Season Liquidity Needs
            body: >-
              UniUni's announcement in September 2026 of a new private funding term sheet alongside reported breach
              allegations in the MAK Acquisition merger underscores acute financing dependency. Failure to consummate
              adequate capital ahead of the Q4 holiday delivery peak could constrain operations or trigger aggressive
              down-round dilution.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV011
