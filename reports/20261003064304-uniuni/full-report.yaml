      - number: '7.4'
        title: 'Financial and Transaction Execution Risk: SPAC Trust Redemptions, Burn Rate, and Dilution'
        blocks:
          - type: paragraph
            body: >-
              While UniUni projects rapid top-line growth to exceed $1.0 billion in 2026 revenue and targets pre-tax
              profitability by 2027, the company reported a net loss of US$70 million in fiscal year 2025 during
              aggressive geographic warehouse expansion. Closing the business combination with MAK Acquisition Corp.
              remains subject to customary closing conditions, including TSX listing clearance and raising a minimum of
              $60 million in aggregate capital between escrowed trust funds, a $15 million convertible note, and a
              brokered private placement of up to $100 million. If public shareholders of MAK Acquisition exercise
              redemption rights at higher-than-anticipated rates, New UniUni could receive substantially lower net cash
              proceeds than planned. Insufficient post-combination cash reserves would restrict planned capital
              expenditure for next-generation automated super-sorting facilities, force additional dilutive equity
              financings or secondary market borrowings, and compress working capital margins during peak retail
              delivery seasons.
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Binary Regulatory Vulnerability of Crowdsourced Last-Mile Unit Economics
            body: >-
              UniUni's core competitive thesis rests on delivering parcels at rates significantly below legacy carriers
              by utilizing independent gig-economy drivers. The active class action litigation alleging worker
              misclassification in the United States represents an asymmetric threat to company margins. If judicial
              rulings or regulatory actions enforce statutory employment classification, the resulting wage, overtime,
              payroll tax, and vehicle expense obligations would permanently compress operating unit economics.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
