      - number: '1.4'
        title: Scale Milestones, Network Expansion, and Operational Controversies
        blocks:
          - type: paragraph
            body: >-
              UniUni's physical footprint scaled dramatically from 1,000 local deliveries daily in 2019 to over 1
              million parcels processed daily by late 2025 across more than 100 distribution centers. To sustain unit
              economics while expanding handling volume, UniUni deployed robotic sortation systems in partnership with
              Global Robotics Services, reporting a 99.99% sorting accuracy and enabling plans to scale capacity up to 3
              million parcels daily. However, this hyper-expansion has been accompanied by intense operational friction
              and adverse regulatory scrutiny. In December 2024, investigative reports revealed that UniUni faces
              multiple federal and state lawsuits in the United States, including two proposed class actions alleging
              driver misclassification and systematic failure to pay minimum and overtime wages. Furthermore, in May
              2024, local law enforcement in Connecticut discovered warehouse workers sleeping in an unpermitted company
              sorting facility under hazardous conditions, highlighting severe human-capital vulnerabilities
              underpinning its low-cost courier delivery structure.
