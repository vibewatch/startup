  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Service Boundaries, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The last-mile delivery market encompasses the transportation and final handover of parcels from regional
              fulfillment hubs, sortation centers, or airport gateways to residential and commercial doorsteps. UniUni
              specifically targets the business-to-consumer (B2C) e-commerce parcel delivery segment, concentrating on
              lightweight parcels weighing under 25 pounds generated by online merchants, digital marketplaces, and
              cross-border platforms. The market excludes palletized freight, heavy bulk cargo, perishable food
              fulfillment, and specialized temperature-controlled pharmaceutical transit. In North America, the status
              quo has historically been dominated by national postal monopolies such as Canada Post and the United
              States Postal Service (USPS), alongside integrated legacy express couriers including United Parcel Service
              (UPS), FedEx, and DHL. These legacy carriers operate capital-intensive hub-and-spoke networks with
              unionized labor, rigid route structures, and elevated overhead costs that drive up baseline parcel rates
              and impose extensive ancillary fuel, residential, and seasonal surcharges on shippers. In contrast,
              alternative carrier entrants leverage algorithmic route planning and crowdsourced gig-economy driver
              networks to achieve high delivery density and drastically lower per-package handling costs. Shippers
              evaluate these services as direct substitutes for standard ground parcel delivery, balancing aggressive
              per-parcel cost savings against service reliability and geographic coverage limits across secondary and
              rural markets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
