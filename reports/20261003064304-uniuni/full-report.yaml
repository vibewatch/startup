      - number: '5.2'
        title: Technology Stack, Dispatch Algorithms, and Warehouse Robotics
        blocks:
          - type: paragraph
            body: >-
              UniUni's core software infrastructure is built upon a hybrid cloud architecture spanning AWS and
              multi-region microservices engineered for high-concurrency event processing. Backend services rely on
              Node.js and serverless AWS Lambda execution environments, complemented by PHP and Laravel services for
              core domain processing and order life-cycle tracking. Data persistence and analytical pipelines utilize
              relational databases including MySQL and PostgreSQL alongside AWS Redshift and Amazon S3 for telemetry and
              data lake storage, enabling end-to-end ETL provisioning for operational reporting and BI. The platform's
              dynamic routing engine applies graph theory algorithms, Vehicle Routing Problem (VRP) heuristics, and
              K-Means clustering machine-learning models to optimize delivery routes, minimizing driver transit time and
              mileage. At physical distribution centers, UniUni pairs its algorithmic routing with robotic sortation
              equipment deployed in collaboration with Global Robotics Services (GLP), automating parcel classification
              across multi-level hub facilities to reduce manual touchpoints and lower per-parcel sorting costs.
