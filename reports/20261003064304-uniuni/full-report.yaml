      - number: '8.2'
        title: Institutional Recommendation Framework, Confidence Assessment, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign UniUni an institutional recommendation of research-more with medium confidence, a high risk
              rating, and a stretched valuation stance at the proposed US$1.0 billion transaction valuation. Although a
              headline enterprise value of US$1.0 billion equates to approximately 0.91x projected 2026 revenue of
              US$1.1 billion—ostensibly appearing conservative compared to asset-heavy legacy couriers and high-margin
              logistics platforms—this price multiple is distorted by unverified earnings quality and extreme
              transaction contingency. The qualifying acquisition via MAK Acquisition Corp. entered definitive
              documentation in May 2026 with a US$10.00 per share equity consideration, but by September 2026 the SPAC
              combination confronted breach allegations and potential termination. UniUni was forced to announce a term
              sheet for a new private funding round led by an existing investor to fortify its balance sheet ahead of
              the holiday peak season. Until definitive audited financials verify gross margins, net cash burn, and the
              post-merger capital structure, committing equity capital at a US$1.0 billion valuation exposes investors
              to down-round repricing, private placement dilution, or liquidity lockups.
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
