      - number: '8.3'
        title: Current Capitalization Context, Financing Evolution, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              UniUni's capitalization context reflects extensive late-stage private capital accumulation preceding the
              proposed public listing. Between its 2019 founding and late 2024, UniUni raised over US$120 million,
              including a US$50 million Series C in April 2024 and an oversubscribed US$30 million Series C2 in November
              2024 led by Bessemer Venture Partners. In mid-2025, the company closed an all-equity US$70 million Series
              D co-led by Bessemer Venture Partners and Sinovation Ventures, followed in March 2026 by an $85 million
              USD financing package comprising $30 million USD in equity led by Rockets Capital and a $55 million USD
              credit facility from Royal Bank of Canada (RBC). The May 2026 reverse takeover agreement with MAK
              Acquisition Corp. structured New UniUni ownership such that existing UniUni shareholders would retain
              approximately 78%, MAK shareholders 12%, and new private placement investors 10%, contingent on raising at
              least US$60 million including escrowed capital and a concurrent US$15 million convertible note. However,
              because the SPAC transaction faced potential termination amid breach allegations in September 2026, the
              status of the $100 million equity financing and convertible note remains unresolved, leaving potential
              liquidation preference overhang from Series D and private bridge investors.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 'Scenario Analysis: Bull, Base, and Bear Underwriting Outcomes'
        blocks:
          - type: paragraph
            body: >-
              To quantify return asymmetry, we model bull, base, and bear scenarios across operating milestones,
              customer durability, and exit paths. In the bull case, UniUni successfully resolves transaction disputes,
              completes its public listing on the TSX with a subsequent Nasdaq cross-listing, diversifies domestic
              enterprise merchants via its PUDO network and small business shipping solutions, and achieves management's
              projection of US$1.5 billion in revenue and US$125 million in pre-tax profits by 2027. Under this outcome,
              margin expansion yields an implied valuation of US$1.8B to US$2.2B (1.2x to 1.5x 2027E revenue). In the
              base case, the public merger falters or is renegotiated at a reduced valuation, forcing UniUni to rely on
              private equity rounds; revenue expands to US$1.1B in 2026 but slows in 2027 due to plateauing discount
              marketplace imports and warehouse automation capex, sustaining break-even operating margins with an
              implied fair valuation of US$750M to US$900M (0.7x to 0.8x 2026 revenue). In the bear case, acute customer
              volume loss from Temu or Shein combines with adverse legal rulings that reclassify drivers as statutory
              employees, ballooning delivery operating expenses and triggering down-round restructuring at US$350M to
              US$500M.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
