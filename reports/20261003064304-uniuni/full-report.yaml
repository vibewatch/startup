      - number: '5.3'
        title: Ecosystem Integrations, Information Security, and Operational Gaps
        blocks:
          - type: paragraph
            body: >-
              Ecosystem interoperability and information security form the operational backbone of UniUni's commercial
              expansion. To streamline onboarding for third-party sellers, UniUni provides open RESTful APIs and carrier
              connections with popular third-party logistics software and multi-channel ERP platforms. Multi-carrier
              systems such as ShipHero incorporate automated rate-shopping engines that dynamically route domestic
              Canadian and U.S. parcels to UniUni based on pricing rules, while incorporating automated fallback
              mechanisms to secondary carriers when destination addresses fall outside UniUni's regional delivery
              boundaries. For information security and governance, UniUni encrypts customer and order data in transit
              using TLS 1.2 protocols and isolates sensitive merchant data from public networks under documented risk
              management procedures. However, material product and technical diligence gaps remain, including absent
              third-party SOC 2 Type II or ISO 27001 audit certifications, reliance on crowdsourced contractor devices
              for final proof-of-delivery data capture, and operational bottlenecks across multi-level sorting
              facilities during unexpected volume surges.
            claimRefs:
              - CE012
