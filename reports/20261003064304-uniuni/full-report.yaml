      - number: '6.4'
        title: Retention Durability, Client Concentration, and Adverse Counterparty Risks
        blocks:
          - type: paragraph
            body: >-
              Despite remarkable headline volume growth, UniUni's customer architecture harbors acute concentration and
              durability vulnerabilities. Cross-border volume from a handful of mega-merchants—predominantly Shein and
              Temu—accounts for an overwhelming majority of total freight volume. This exposes UniUni to structural
              counterparty and regulatory risks, including potential legislative crackdowns on the Section 321 de
              minimis tariff exemption in the United States and consumer customs scrutiny. The fragility of this
              commercial model surfaced prominently in late September 2026, when SPAC sponsor MAK Acquisition Corp.
              issued a formal notice of breach under their definitive reverse-takeover merger agreement. The breach
              notice alleged material deterioration in UniUni's business and financial performance during the interim
              transaction period, activating a contractual cure period. If UniUni fails to remedy the operational and
              financial breaches, MAK Acquisition has signaled its intent to terminate the business combination. This
              dispute underscores that rapid transaction growth has generated severe margin compression, driver wage
              disputes, and customer operational friction that threaten long-term enterprise value.
            claimRefs:
              - CU001
              - CU009
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Counterparty Concentration and SPAC Breach Notice Vulnerability
            body: >-
              UniUni's hyper-growth has been driven by concentrated freight allocation from discount marketplaces like
              Shein, Temu, and TikTok Shop. The September 2026 breach notice delivered by MAK Acquisition Corp. alleging
              business deterioration demonstrates the operational instability and financial volatility of relying on
              asset-light, ultra-low-margin cross-border courier volumes.
            calloutType: risk
