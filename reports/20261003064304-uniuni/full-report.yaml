chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Last-Mile Business Model
        blocks:
          - type: paragraph
            body: >-
              Uni Express Inc., known commercially as UniUni, is a North American logistics technology provider founded
              in 2019 and headquartered at 10271 Shellbridge Way in Richmond, British Columbia, near the Vancouver
              International Airport. The company originally launched as a local restaurant food-delivery mobile platform
              before pivoting swiftly into cross-border e-commerce parcel fulfillment after securing a delivery
              agreement with fast-fashion titan Shein in 2019. UniUni operates an asset-light, crowdsourced logistics
              architecture that pairs proprietary algorithmic dispatch and route optimization with a variable-cost fleet
              of over 100,000 registered independent contractor drivers operating personal vehicles. By routing parcels
              from international entry hubs through a network of more than 100 regional warehouses and automated sorting
              centers, UniUni provides high-density last-mile delivery across more than 500 cities in North America,
              reaching 65% of the United States population and 80% of Canada's population.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
