      - number: '6.2'
        title: Adoption Trajectory, Operating Throughput, and Delivery Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of UniUni reflects unprecedented delivery volume expansion fueled by North
              American consumer appetite for discount cross-border goods. Founded in 2019 as a Vancouver food-delivery
              service handling roughly 1,000 packages daily, UniUni's commercial volume scaled to 300,000 packages daily
              and $52 million in fiscal 2023 revenue as reported to The Logic, before surging to over 1 million parcels
              processed daily by late 2025. Annual revenues increased from $113 million in 2023 to $295 million in 2024
              and $683 million in 2025, with management projecting revenue to surpass $1.1 billion in 2026. This rapid
              throughput adoption has been enabled by the physical expansion of UniUni's sorting infrastructure to over
              100 regional warehouses and automated sorting centers, alongside an asset-light crowdsourced network
              exceeding 100,000 registered independent delivery drivers. Geographically, UniUni's network reaches 65% of
              the United States population and 80% of Canada's population across more than 500 cities, offering
              cross-border shippers unified pickup in the U.S. and direct delivery to Canadian doorsteps without
              third-party handoffs.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
