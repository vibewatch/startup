      - number: '4.3'
        title: Reported Growth and Profitability
        blocks:
          - type: paragraph
            body: >-
              Stockhouse reports annual revenue of US$113 million in 2023, US$295 million in 2024, and US$683 million in
              2025, followed by management projections above US$1.1 billion for 2026 and US$1.5 billion for 2027. These
              figures come from an independent article drawing on company and investor materials, not audited financial
              statements in the retained evidence. The same article reports a US$70 million net loss for 2025 and a
              management expectation of net profitability by year-end 2026 and up to US$125 million of pre-tax profit in
              2027. Revenue is therefore not a proxy for cash generation, and the forecast margin inflection requires
              direct verification of gross margin, operating expenses, working capital, and forecast assumptions.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Capital Adequacy and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              A May 2026 reverse-takeover agreement contemplated a US$1 billion valuation and a concurrent private
              placement of up to US$100 million, but Stockhouse stated that the transaction remained subject to
              shareholder and regulatory approvals. In September, UniUni announced a separate private-funding term sheet
              led by an existing investor, without disclosing its amount, binding status, closing date, or proceeds
              received. These are financing events, not evidence of cash available. Commercial databases add chronology
              but do not resolve liquidity: Tracxn reports total funding, Caplight's open view omits round amounts, and
              EquityZen gates financial data. Until management provides cash, burn, runway, debt, working-capital,
              customer-concentration, and closed-financing schedules, the financial verdict is growth with unverified
              revenue quality, margins, and capital sufficiency.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing activity does not establish available liquidity
            body: >-
              The contemplated private placement and September funding term sheet show active financing work, but
              neither funding raised nor announced transaction size equals cash on hand. Closing status, proceeds
              received, burn, debt, working-capital needs, and runway require direct confirmation.
            calloutType: risk
            claimRefs:
              - CI014
