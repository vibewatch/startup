  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Contractor Classification, Labor Standards, and Securities Compliance'
        blocks:
          - type: paragraph
            body: >-
              UniUni's asset-light crowdsourced delivery architecture relies extensively on over 100,000 registered
              independent contract drivers who operate their own personal vehicles to perform last-mile parcel
              distribution. This operating structure creates existential regulatory exposure under federal and state
              labor standards across North America. In December 2024, investigative reports revealed that UniUni was hit
              with multiple lawsuits in the United States, including two proposed class actions alleging that the
              company systematically underpaid drivers and misclassified workers as independent contractors rather than
              statutory employees. A mandatory legal reclassification of drivers under stringent state statutes, such as
              California's ABC test under Assembly Bill 5 or Department of Labor independent contractor standards, would
              immediately inflate variable labor expenses with statutory overtime, minimum wage guarantees, payroll tax
              contributions, workers' compensation insurance, and vehicle expense reimbursements, eroding the pricing
              advantage that allowed UniUni to undercut legacy couriers. In addition, local law enforcement in
              Connecticut investigated an unpermitted UniUni warehouse facility in May 2024 where sorting personnel were
              discovered sleeping inside the building under severe physical conditions, indicating acute municipal code,
              zoning, and workplace safety compliance vulnerabilities during rapid regional facility rollouts. Finally,
              the proposed qualifying acquisition by MAK Acquisition Corp. exposes UniUni to multi-jurisdictional
              securities scrutiny across Canadian provincial regulators, the Toronto Stock Exchange, and planned future
              U.S. Securities and Exchange Commission registration for a Nasdaq cross-listing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR014
