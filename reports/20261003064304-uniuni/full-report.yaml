  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and E-Commerce Merchant Workflows
        blocks:
          - type: paragraph
            body: >-
              UniUni provides tech-driven last-mile parcel shipping services customized for high-volume cross-border
              e-commerce merchants, marketplace sellers, and domestic retailers across Canada and the United States.
              Rather than operating traditional asset-heavy fleet networks with fixed courier routes, the service
              workflow captures merchant parcel orders via direct RESTful APIs and pre-built integrations with
              e-commerce platforms and multi-carrier ERPs such as 4Seller and ShipHero. When a shopper completes an
              order on marketplaces like Temu, TikTok Shop, or Shopify storefronts, the merchant's logistics software
              automatically matches order parameters—including destination postal codes and package dimensions—against
              UniUni's network coverage rules. The platform instantly generates standardized shipping labels and assigns
              real-time tracking numbers. Merchant packages are picked up or inducted into regional fulfillment hubs,
              inducted through automated optical scanners, sorted by destination zone, and dispatched to crowdsourced
              drivers who complete final doorstep delivery with photographic proof-of-delivery.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
