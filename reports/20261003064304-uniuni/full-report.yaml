  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Counter-Thesis, and Fundamental Risk Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              UniUni's investment thesis centers on its structural cost advantage in residential direct-to-consumer
              e-commerce parcel delivery across Canada and the United States. By replacing heavy vehicle fleet
              depreciation, unionized wage agreements, and legacy terminal networks with crowdsourced gig-economy
              drivers operating personal vehicles alongside automated robotic sorting hubs, UniUni offers flat rates
              that undercut legacy ground tariffs by three to five dollars per piece. This operational framework has
              catalyzed hyper-scaling parcel volume, expanding network coverage to 65% of the United States and 80% of
              Canada across more than 500 cities. However, the fundamental anti-thesis rests on high customer
              concentration, legal exposure, and capital fragility. The company's expansion has been overwhelmingly
              propelled by bargain e-commerce cross-border platforms Shein and Temu, exposing terminal volumes to
              international trade tariffs, customs de minimis rule changes, and platform routing shifts. Simultaneously,
              active class action lawsuits in the United States alleging gig worker misclassification threaten to erode
              its flexible labor cost basis, while a recorded net loss of US$70 million in 2025 highlights ongoing
              operational cash burn that requires continuous external liquidity injections.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
