      - number: '7.3'
        title: 'Partner and Commercial Dependency Risk: Marketplace Concentration and Cross-Border Trade Policy'
        blocks:
          - type: paragraph
            body: >-
              UniUni's multi-year revenue expansion—growing from $113 million in 2023 to $295 million in 2024, $683
              million in 2025, and over $1.0 billion projected in 2026—has been predominantly driven by cross-border
              bargain e-commerce marketplaces originating in China, most notably Shein, Temu, TikTok Shop, and
              AliExpress. This commercial posture creates an extreme customer concentration profile where volume
              downturns, logistical re-tendering, or direct insourcing by either Shein or Temu would severely impair
              UniUni's network parcel density and gross margins. Moreover, cross-border e-commerce shipping into the
              United States operates under complex customs clearance frameworks, air freight trunk-line handoffs, and
              Section 321 de minimis tariff exemptions. Rising geopolitical tensions, potential legislative or
              administrative reforms tightening U.S. de minimis import limits, or intensified customs documentation
              inspections on incoming small packages could create extensive terminal delays, tariff clawbacks, and
              increased customs handling friction. On the carrier side, UniUni remains reliant on regional Delivery
              Service Partners (DSPs) to recruit, maintain, and administer contractor driver pools, leaving regional
              coverage vulnerable to partner attrition, vehicle fleet unavailability, or local contractor churn.
            claimRefs:
              - CR008
