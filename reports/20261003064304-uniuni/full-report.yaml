              - CO006
              - CO011
      - number: '1.3'
        title: Capitalization History, Private Placements, and Public Listing Transaction
        blocks:
          - type: paragraph
            body: >-
              Between its 2019 inception and 2025, UniUni raised over US$200 million in private venture funding across
              multiple financing rounds. The investor syndicate comprises institutional North American venture funds,
              Canadian scaleup investors, and international cross-border trade institutions, including Bessemer Venture
              Partners, Sinovation Ventures, Celtic House Venture Partners, Redpoint Ventures, DCM Ventures, LFX Venture
              Partners, and Alibaba's venture investment arm. On May 15, 2026, UniUni entered into a definitive purchase
              agreement to merge with MAK Acquisition Corp. (TSX: MAK.U) in a qualifying reverse takeover transaction
              that values UniUni at an enterprise value of approximately US$1.0 billion (C$1.37 billion). The
              transaction is supported by a best-efforts private placement of up to US$100 million in non-voting common
              shares of Finco at $10.00 per share, brokered by Canaccord Genuity, and includes a $15 million convertible
              note issued by UniUni. Following completion, existing UniUni shareholders are projected to hold roughly
              78% of the resulting issuer, New UniUni, with MAK Acquisition shareholders holding 12% and private
              placement investors holding 10%.
