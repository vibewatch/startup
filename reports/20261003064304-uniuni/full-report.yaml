      - number: '2.2'
        title: Market Sizing, Sizing Lenses, and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for alternative e-commerce last-mile logistics requires analyzing
              multiple structural lenses rather than relying on a single top-down total addressable market figure.
              Across North America, the broader courier, express, and parcel logistics market represents a
              multi-hundred-billion-dollar expenditure ecosystem, with tens of thousands of operating transportation and
              logistics providers competing across varied regional and national niches. However, the serviceable
              addressable market directly relevant to asset-light alternative carriers is defined by lightweight B2C
              e-commerce parcel volume destined for urban and suburban residential addresses. This segment has expanded
              dramatically following the post-pandemic surge in cross-border digital retail, exemplified by high-volume
              ultra-fast-fashion and direct-from-manufacturer platforms such as Shein, Temu, and AliExpress, alongside
              domestic small and mid-sized merchants utilizing multi-carrier shipping management software. UniUni's
              rapid revenue trajectory—projecting approximately $1.1 billion in revenue for 2026 and delivering over 1
              million parcels daily across its network—demonstrates that high-density alternative delivery models have
              transitioned from regional experiments into major volume contenders. Sustained market expansion is
              propelled by structural shifts in merchant fulfillment strategies, where retail brands seek multi-carrier
              diversification to avoid single-carrier margin squeeze and holiday volume caps imposed by legacy carriers.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM010
              - CM012
