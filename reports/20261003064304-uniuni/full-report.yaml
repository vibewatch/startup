  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              UniUni segments its commercial demand across three distinct buyer categories: global cross-border bargain
              marketplaces, domestic direct-to-consumer (DTC) brands, and regional third-party logistics (3PL)
              fulfillment warehouses. The cornerstone of UniUni's volume consists of Asian cross-border e-commerce
              platforms—specifically Shein, Temu, AliExpress, and TikTok Shop—which require cost-optimized, high-density
              last-mile delivery from airport entry gateways directly to consumer residences across the United States
              and Canada. To broaden its revenue base and reduce reliance on single mega-accounts, UniUni has developed
              targeted offerings for mid-market merchants and small-to-medium businesses (SMBs), notably through
              software-enabled rate-shopping integrations with warehouse management platforms like ShipHero. These
              merchant integrations allow high-volume Shopify sellers and multi-channel retailers shipping hundreds to
              thousands of packages daily to automatically select UniUni based on package weight and delivery zone
              parameters. However, UniUni operates primarily as an enterprise contract carrier rather than a self-serve
              retail postal storefront, meaning client acquisition cycles depend heavily on API integrations with
              commercial warehouse management software and enterprise rate agreements.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
              - CU011
