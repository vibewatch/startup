      - number: '3.3'
        title: Moat Durability, Platform Switching Friction, and Intermediary Conflict
        blocks:
          - type: paragraph
            body: >-
              UniUni's moat relies on geographic delivery density, crowdsourced driver network effects, proprietary
              route optimization, and deep integration into high-volume cross-border discount merchants including Shein
              and Temu. However, durability is constrained by low switching barriers among multi-carrier third-party
              logistics platforms, absence of proprietary physical lock-in, and operational friction with logistics
              intermediaries. In mid-2026, logistics provider Point2Point Global filed suit in California federal court
              accusing UniUni of suspending delivery on over 16,000 packages and marking over 4,100 holiday parcels as
              undeliverable following a commercial dispute involving a third-party logistics account. While UniUni
              strongly denied the claims, asserted that Point2Point failed to pay substantial invoices totaling nearly
              two million dollars, and announced plans for a counterclaim, the public dispute underscores the
              operational vulnerability and channel counterparty risks inherent in non-asset carrier partnerships.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Intermediary Counterparty Friction and Legal Vulnerability
            body: >-
              UniUni's expansion across North American 3PL channels exposes it to contract disputes with intermediary
              aggregators. The California federal court litigation with Point2Point Global demonstrates that payment
              disputes or account re-allocations can quickly trigger package delivery suspensions, threatening merchant
              brand reputations and highlighting operational risks during peak holiday volume.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Motion
        blocks:
          - type: paragraph
            body: >-
              UniUni's public offering is a logistics service, not a disclosed software-subscription model: it provides
              e-commerce parcel delivery, cross-border transport, and a Canadian small-business shipping product. The
              retained pages do not publish a rate card or identify whether realized contracts are priced per parcel,
