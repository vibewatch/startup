      - number: '6.3'
        title: Named Customer Proof, Production Deployments, and Channel Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Empirical customer validation demonstrates deep production deployment across North American cross-border
              e-commerce corridors. Fast-fashion retailer Shein represents UniUni's foundational enterprise anchor
              client, having contracted with the company in 2019 to handle high-density parcel delivery across Canadian
              and U.S. metropolitan hubs. E-commerce giant Temu (owned by PDD Holdings) and TikTok Shop likewise rely on
              UniUni's low-cost carrier network to fulfill thousands of daily orders generated through social commerce
              and gamified retail platforms. In the software ecosystem, ShipHero maintains a certified carrier
              integration with UniUni, enabling multi-carrier warehouse operators such as Webster Fulfillment and 247
              Fulfillment to utilize automated rate shopping and smart routing across U.S. and Canadian delivery zones.
              Furthermore, corporate filings and financial reporting confirm commercial logistics relationships with
              Alibaba's venture and cross-border commerce divisions, integrating AliExpress shipments directly into
              Canadian customs sorting facilities. Despite these high-profile production relationships, public net
              retention rates and account-level volume breakdowns remain closely guarded private operational data.
            claimRefs:
              - CU001
