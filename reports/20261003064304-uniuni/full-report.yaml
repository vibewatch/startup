      - number: '4.2'
        title: Delivery Economics and Cost Base
        blocks:
          - type: paragraph
            body: >-
              The operating model combines a variable delivery layer with meaningful physical infrastructure. UniUni
              recruits Delivery Service Partners that supply networks of independent contract drivers, while its website
              reports more than 100 warehouses and sorting centres. That combination may reduce owned-fleet intensity,
              but it does not establish low capital intensity or attractive contribution margins: driver payments,
              linehaul, sorting labor and automation, facility leases, failed-delivery costs, claims, and peak-season
              capacity all remain unquantified. Public scale claims of hundreds of millions of annual packages and more
              than one million daily parcels provide useful denominator context, but no retained source discloses
              revenue per package, cost per stop, gross margin, utilization, or working-capital timing.
            claimRefs:
              - CI006
