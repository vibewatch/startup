        - Base rate with stacked fuel, residential, DAS, and dimensional adjustments
        - Flat-rate model inclusive of fuel and residential delivery surcharges
        - UniUni yields $3-$5 average cost advantage per lightweight ground package in metro zones
      - - Expedited & Guaranteed Air Tiers
        - Comprehensive guaranteed overnight, 2-day, and 3-day air service levels
        - No expedited air tiers available; ground-only delivery framework
        - Shippers cannot utilize UniUni for time-sensitive, emergency, or perishable shipments
      - - Geographic & Rural Coverage
        - Universal national coverage including remote, rural, and island locations
        - Focused on urban and suburban metro areas; limited rural coverage
        - Rural shipments face sharp transit time degradation or non-delivery through UniUni
      - - Tracking Fidelity & Scan Density
        - High-frequency scan checkpoints across transit, sorting, and dispatch stages
        - Fewer scan updates with longer intervals between hub arrival and out-for-delivery
        - Elevates customer support inquiry volume for e-commerce brands utilizing UniUni
      - - Delivery Workforce Model
        - Dedicated professional drivers, unionized workforce (UPS) or contracted routes (FedEx)
        - Crowdsourced independent contract drivers utilizing personal vehicles
        - Drives lower variable unit costs but increases exposure to driver churn and misclassification scrutiny
      - - Proof of Delivery Mechanism
        - Electronic signature, geo-tagged delivery confirmation, established claims SLA
        - Mandatory driver photo proof of delivery accessible via customer portal
        - Mitigates porch-piracy disputes but customer chatbot required for redelivery scheduling
