            body: >-
              UniUni relies heavily on third-party shipping aggregators and marketplace ERP integrations like 4Seller
              and ShipHero to capture volume from sellers on platforms like Temu and TikTok Shop. Changes in marketplace
              carrier qualification policies or API partner terms represent an external vulnerability to platform
