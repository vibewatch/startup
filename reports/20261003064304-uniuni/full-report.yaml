      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              UniUni was founded by British Columbia-based technology entrepreneurs Peter Lu and Kevin Wang, who
              identified an structural pricing and agility gap between legacy national postal operators and fast-growing
              cross-border e-commerce marketplaces. Peter Lu serves as Chief Executive Officer, spearheading
              fundraising, strategic automation investments, and expansion across North American metropolitan markets.
              In 2025, the company expanded its executive bench by appointing Sheila Berry as Chief Revenue Officer to
              oversee enterprise merchant acquisition, retail carrier integrations, and commercial diversification away
              from single-account dependency. The proposed reverse takeover with MAK Acquisition Corp. introduces
              institutional public market governance led by SPAC Chairman and CEO Matt Proud, formerly chief executive
              officer of legal software provider Dye & Durham. Key-person dependence remains concentrated in founder
              Peter Lu's customer relationships with Chinese cross-border e-commerce conglomerates and execution of
              sorting automation.
            claimRefs:
              - CO002
              - CO006
              - CO011
