evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-investor-cap-table
    missingEvidence: >-
      Audited historical income statements and complete cap table shareholding schedule confirming precise ownership
      percentages for venture investors prior to TSX non-offering prospectus filing.
    whyItMatters: >-
      Reported net loss estimates of US$70 million in 2025 and exact shareholding percentages across Bessemer,
      Sinovation, Alibaba, and Celtic House cannot be verified until MAK Acquisition files its formal prospectus on
      SEDAR+.
    diligencePath: Review SEDAR+ non-offering prospectus filing and TSX listing disclosure package upon public release.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: labor-litigation-status
    missingEvidence: >-
      Docket entries, settlement filings, or class certification rulings for the late 2024 US driver misclassification
      class action lawsuits.
    whyItMatters: >-
      Worker reclassification liabilities could materially increase variable delivery costs, driver pay rates, and
      payroll taxes across US sorting regions.
    diligencePath: >-
      Perform PACER search across federal district courts in California, New York, and Connecticut to inspect active
      claims and class certification motions.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: granular-addressable-market-sizing
    missingEvidence: >-
      Audited industry segmentation isolating the exact total addressable market dollar value for sub-25 lb cross-border
      e-commerce parcels across North America.
    whyItMatters: >-
      Without distinct third-party market data for alternative gig-economy parcel logistics, market sizing relies on
      broad courier industry aggregates and company-reported projections.
    diligencePath: >-
      Acquire specialized logistics analyst datasets (e.g., Armstrong & Associates or Pitney Bowes Parcel Shipping
      Index) breaking down private alternative carrier market shares.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-pricing
    missingEvidence: >-
      Direct volume-discount pricing schedules, minimum parcel commitments, and realized net yields across enterprise
      accounts like Shein, Temu, and domestic 3PL partners.
    whyItMatters: >-
      Understanding contract profitability and margin vulnerability is critical to determining whether UniUni's $3-$5
      per parcel discount undercuts incumbents sustainably or compresses operating margins.
    diligencePath: >-
      Examine customer commercial master service agreements (MSAs) or audited unit revenue per delivery segment during
      TSX/Nasdaq public disclosure filings.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: pricing-and-contracts
    missingEvidence: >-
      Executed customer contracts, current rate cards, discount schedules, surcharge rules, SLA credits, renewal terms,
      and realized revenue per package.
    whyItMatters: >-
      Public positioning does not show whether volume growth produces durable price realization or exposes UniUni to
      customer and discount pressure.
    diligencePath: >-
      Review a representative contract sample and reconcile billed revenue to parcels by customer, service, zone,
      weight, and month.
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Revenue per package, driver and DSP cost per stop, linehaul cost, sortation cost, claims cost, gross margin, CAC,
      payback, and cohort contribution margin.
    whyItMatters: >-
      Without these inputs, parcel scale and revenue growth cannot establish positive unit contribution or a credible
      margin path.
    diligencePath: >-
      Obtain monthly 2023-2026 unit-economics bridges by service, customer cohort, geography, route density, and
      facility.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue recognition policy, gross-to-net bridge, customer concentration, retention, minimum-volume
      commitments, bad debt, and related-party exposure.
    whyItMatters: >-
      The retained revenue series is third-party reported and does not establish audit status, concentration risk, or
      cash conversion.
    diligencePath: >-
      Review audited financial statements, customer-level revenue cohorts, invoicing terms, receivables aging, churn,
      and contract liabilities.
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: >-
      Current cash, restricted cash, monthly cash burn, working-capital seasonality, debt facilities, covenants, lease
      obligations, and downside runway.
    whyItMatters: >-
      A reported accounting loss and announced financing activity do not disclose cash consumption or capital available
      to fund peak-season obligations.
    diligencePath: >-
      Obtain the latest balance sheet, 13-week cash forecast, monthly burn bridge, debt and lease schedules, and
      downside liquidity scenarios.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: financing-closing
    missingEvidence: >-
      Definitive closing documents, approvals, proceeds received, dilution, fees, covenants, and use-of-funds schedules
      for the reverse takeover, private placement, and September term sheet.
    whyItMatters: >-
      Announced, contemplated, or term-sheet financing cannot be treated as cash available until conditions close and
      proceeds are received.
    diligencePath: >-
      Confirm transaction status through executed agreements, board and shareholder approvals, regulatory filings, bank
      statements, and capitalization schedules.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: >-
      Third-party compliance certifications including formal SOC 2 Type II reports, ISO/IEC 27001 certificates, or
      PCI-DSS attestation of compliance.
    whyItMatters: >-
      Enterprise retailers and domestic brand partners require independent validation of information security controls
      before routing confidential shopper order data through carrier APIs.
    diligencePath: >-
      Request UniUni's latest independent SOC 2 Type II audit report, vulnerability assessment results, and data
      governance policies from security leadership.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: api-performance-slas
