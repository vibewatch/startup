              - CO011
      - number: '1.3'
        title: 股本演变、私募配售与公开上市交易
        blocks:
          - type: paragraph
            body: >-
              从 2019 年成立至 2025 年，UniUni 通过多轮一级市场风险投资累计募资超 US$200 million。投资方阵容涵盖北美主流风投、加拿大成长期基金以及国际跨境贸易产业资本，包括 Bessemer
              Venture Partners、Sinovation Ventures、Celtic House Venture Partners、Redpoint Ventures、DCM Ventures、LFX
              Venture Partners 以及阿里巴巴旗下风险投资机构。2026 年 5 月 15 日，UniUni 签订正式收购协议，拟通过合资格反向收购与 MAK Acquisition Corp.（TSX:
              MAK.U）合并，对 UniUni 的企业价值估值约为 US$1.0 billion（C$1.37 billion）。该交易由 Canaccord Genuity 经办的一笔最高达 US$100 million
              的 Finco 无投票权普通股（每股 $10.00）尽最大努力私募配售提供支持，并包含 UniUni 发行的 $15 million 可转债。交易完成后，UniUni 原有股东预计将持有合并后新主体 New
              UniUni 约 78% 的股权，MAK Acquisition 股东持股 12%，私募配售投资者持股 10%。
            claimRefs:
              - CO007
