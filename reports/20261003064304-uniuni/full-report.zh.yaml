        title: 报道披露的增长与盈利表现
        blocks:
          - type: paragraph
            body: >-
              Stockhouse 报道称，公司 2023 年年收入为 US$113 million，2024 年为 US$295 million，2025 年达到 US$683 million；管理层预计 2026
              年收入将突破 US$1.1 billion，2027 年达到 US$1.5 billion。上述数据源自一篇基于公司及投资人材料撰写的第三方独立报道，而非留存证据中的审计财务报表。该报道同时披露公司 2025
              年净亏损达 US$70 million，管理层预期将在 2026 年底实现净扭亏，并在 2027 年实现最高 US$125 million
              的税前利润。因此，收入增长不能等同于现金流造血能力，预期中的利润拐点仍需直接核实毛利率、运营支出、营运资金及预测假设。
            claimRefs:
              - CI010
              - CI011
