    claimRefs:
      - CP001
      - CP006
      - CP007
      - CP009
  - id: FI001
    title: 从商家需求到未披露毛利的盈利模型路径
    type: flow
    summary: 公开业务操作流程清晰可见，但定价与成本披露不足以支持定量测算收入到毛利的转化路径。
    data:
      nodes:
        - id: merchant-demand
          label: 商家包裹需求
          detail: 电商发货方交付境内或跨境包裹。
        - id: pickup
          label: 揽收或口岸接收
          detail: 包裹进入 UniUni 的配送网络。
        - id: sort-and-route
          label: 分拣与排线
          detail: 仓库与分拣中心进行派送路线规划分拣。
        - id: last-mile
          label: 独立司机派送
          detail: 外包合同司机与配送服务合作伙伴完成最后一公里投递。
        - id: shipping-revenue
          label: 物流服务收入
          detail: 计价单位、折扣以及单票实际确认收入均未披露。
        - id: gross-profit
          label: 毛利
          detail: 司机、干线、分拣、场地及理赔主张成本未见公开测算路径。
    approximationNotes: 仅为概念性业务流程；未对具体金额、利润率或转化率进行估算。
    claimRefs:
      - CI001
      - CI006
      - CI009
  - id: FE001
    title: UniUni 端到端技术与运营架构体系
    type: stack
    summary: 涵盖客户对接、算法派单、云端数据管道、仓库自动化及众包司机履约的分层架构体系。
    data:
      layers:
        - label: 商家对接层
          detail: 开放式 REST API、Webhook 以及预构建的电商 ERP 插件（4Seller、ShipHero、Shopify）
        - label: 核心应用与计算层
          detail: 运行于 Linux 上的 Node.js 微服务、AWS Lambda 无服务器函数、PHP Laravel 领域服务
        - label: 算法路径规划与智能层
          detail: 面向动态路线派单的车辆路径问题（VRP）求解器、图算法及 K-Means 聚类
        - label: 数据湖与分析基础设施
          detail: AWS Redshift 数据仓库、Amazon S3 数据湖、PostgreSQL/MySQL 关系型数据库以及 ETL 数据管道
        - label: 枢纽自动化与实体机器人
          detail: 多层仓库自动化分拣设施及 GLP AI 移动分拣机器人
        - label: 现场执行与移动端层
          detail: 具备条码扫描、路线导航与拍照送达凭证功能的众包快递员移动端 App
    approximationNotes: 架构组件综合自技术招聘需求、管理层披露信息及合作伙伴平台技术文档。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程全景图
    type: journey-map
    summary: 从大型电商平台入驻到自动化末端居民区派送的结构化客户采纳历程与业务扩展生命周期。
    data:
      items:
        - label: 1. 大型商家接入
          detail: 跨境电商平台（Shein、Temu）与第三方物流软件平台（ShipHero）经由 API 接入，实现自动化订单路由与运费比选。
          touchpoints:
            - API 密钥与凭据配置
            - 分区与重量准入规则
            - 海关拆箱分流映射
        - label: 2. 枢纽入库交接
          detail: 包裹从机场入境口岸及本土履约中心运抵 UniUni 遍布北美的 100+ 处分拣仓库。
          touchpoints:
            - 机场进港货运拆箱
            - 自动化条码扫描
            - 托盘化供件上线
        - label: 3. 机器人自动化分拣
          detail: 自动化分拣设备结合专有 AI 算法按本地派送路区对包裹进行组织，宣称准确率达 99.99%。
          touchpoints:
            - 机器人分拣台
            - 动态路线生成
            - 司机派单优化
        - label: 4. 众包末端派送
          detail: 已注册的独立合同司机提取分拣好的包裹，借助 UniUni 司机端 App 进行动态路线导航并完成住宅派送。
          touchpoints:
            - 移动端司机 App 派单
            - 车辆装载与出发
            - 门前拍照送达凭证
        - label: 5. 实时追踪与结算
          detail: 商家与零售终端消费者获取自动化物流跟踪更新及签收照片，并实现统一账单结算。
          touchpoints:
            - 实时追踪 Webhook
            - 签收照片确认
            - 合并账单结算
        - label: 6. 业务拓展与多渠道扩张
          detail: 优良的履约表现促使发货方扩大配额，从试点路线拓展至全美境内及跨境区域。
          touchpoints:
            - 阶梯货量费率调整
            - 跨境线路拓展
            - 中小企业门户接入
    approximationNotes: 流程阶段根据 UniUni 服务架构、承运商对接规范及管理层运营说明建模。
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU010
      - CU011
  - id: FR001
    title: 企业风险严重程度与残留风险敞口热力图
    type: matrix
    summary: 从发生概率、影响程度、缓解措施成熟度及残留严重程度评估 UniUni 的主要法律、运营、商业与财务风险。
    data:
      columns:
        - label: 发生概率
          detail: 当前运营轨迹下实质性发生的评估概率
        - label: 影响程度
          detail: 对盈利、单票利润率、网络运力或法律地位的潜在冲击
        - label: 缓解措施成熟度
          detail: 当前组织、法律与技术风控措施的完备程度
        - label: 残留严重程度
          detail: 采取缓解措施后对投资逻辑和业务连续性的威胁程度
      rows:
        - label: 独立承包商误分类
          note: 美国司机劳工诉讼以及工时工资合规审查
          values:
            - label: 高
              tone: risk
            - label: 危急
              tone: critical
            - label: 发展中
              tone: warning
            - label: 危急
              tone: critical
        - label: 客户过度集中
          note: 高度依赖亚洲跨境电商巨头 Shein 与 Temu
          values:
            - label: 高
              tone: risk
            - label: 危急
              tone: critical
            - label: 发展中
              tone: warning
            - label: 高
              tone: risk
        - label: 跨境海关政策变动
          note: 小额豁免（Section 321）条款调整及关税严格审查
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: risk
            - label: 中等
              tone: opportunity
            - label: 高
              tone: risk
        - label: SPAC 信托赎回
          note: MAK Acquisition RTO 合并中的公众投资者赎回
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 已建立
              tone: positive
            - label: 中
              tone: warning
        - label: 分拣自动化故障
          note: 超级分拣中心内的机器人与机械故障
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 已建立
              tone: positive
            - label: 中
              tone: warning
        - label: 仓储安全与许可审批
          note: 地方市政分区与设施规范执法行动
          values:
            - label: 低
              tone: low
            - label: 高
              tone: risk
            - label: 中等
              tone: opportunity
            - label: 中
              tone: warning
    approximationNotes: 可能性与影响等级依据经审计的诉讼披露、交易条款、客户依赖度数据及运营历史综合评定。
