      - number: '1.4'
        title: 规模里程碑、网络扩张与运营争议
        blocks:
          - type: paragraph
            body: >-
              UniUni 的物理网点实现跨越式扩张，从 2019 年的日均 1,000 单同城配送，激增至 2025 年底依托 100 多个配送中心实现日处理包裹超 1 million
              件。为在放量同时维持单票经济模型，UniUni 联手 Global Robotics Services 引入机器人分拣系统，自报分拣准确率达 99.99%，并计划将日处理运力推升至 3 million
              件。但在超常规扩张背后，运营摩擦与监管风波接踵而至。2024 年 12 月，调查报道披露 UniUni
              在美国面临多起联邦与州法院诉讼，其中包括两起拟议集体诉讼，指控其司机用工性质分类不当，并存在系统性拖欠最低工资和加班费的情况。此外，2024 年 5
              月，康涅狄格州当地执法部门在一处未获许可的公司分拣网点中，发现仓库工人居住在环境危险的设施内，暴露出其低成本快递配送架构底层脆弱的人力资本隐患。
            claimRefs:
