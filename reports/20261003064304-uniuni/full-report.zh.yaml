      - number: '5.3'
        title: 生态集成、信息安全与运营短板
        blocks:
          - type: paragraph
            body: >-
              生态互通性与信息安全构成了 UniUni 商业扩张的运营底座。为简化第三方卖家的接入流程，UniUni 提供开放 RESTful API，并与主流第三方物流软件和全渠道 ERP
              平台建立承运商直连。ShipHero 等多承运商系统内置自动化比价引擎，能够依据费率规则动态将加拿大和美国境内包裹分流至 UniUni；一旦目的地超出 UniUni
              的区域派送范围，系统会自动触发备用承运商兜底机制。信息安全与治理层面，UniUni 在传输过程中采用 TLS 1.2
              协议对客户及订单数据进行加密，并根据既定风险管理规程将敏感商家数据与公网隔离。然而，产品与技术尽调仍存在重大缺失：缺乏第三方 SOC 2 Type II 或 ISO 27001
              审计认证，终端妥投证明数据采集过度依赖众包司机的个人手机设备，且在突发货量高峰时，多层分拣设施容易出现运营瓶颈。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
