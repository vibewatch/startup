  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定、业务边界与替代品
        blocks:
          - type: paragraph
            body: >-
              最后一公里配送市场涵盖包裹从区域履约中心、分拣中心或机场口岸运出，并最终交付至住宅及商业门牌的全过程。UniUni 专门切入企业对消费者（B2C）电商包裹配送赛道，主攻在线商家、数字平台和跨境电商产生的 25
              磅以下轻型包裹。该市场不包含托盘整车货运、大宗重货、易腐生鲜履约以及专业的温控医药冷链。在北美，市场格局长期由 Canada Post 和美国邮政（USPS）等国家邮政垄断机构，以及 UPS、FedEx 和
              DHL
              等综合性传统快递巨头主导。传统承运商依赖重资产的轴辐式网络运转，受制于工会劳工、僵化的路线结构与高昂的固定开销，推高了基础运价，并向托运方加收大额燃油附加费、住宅配送费和旺季附加费。相比之下，新兴承运商依靠算法路径规划和零工众包司机网络，实现了高配送密度并大幅摊薄单件处理成本。托运人在权衡标准陆运包裹的直接替代方案时，既看重激进的单件成本降幅，也要承受下沉和偏远地区服务稳定性及覆盖范围受限的代价。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM010
      - number: '2.2'
        title: 市场规模测算视角与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              评估替代型电商最后一公里物流的市场空间，需要从多个结构性视角切入，而非依赖单一自上而下的总可用市场数字。在北美，广义的快递、速递及包裹物流属于数千亿美元级的支出生态，数万家运输和物流服务商分散在各个区域与细分赛道中竞争。然而，与轻资产替代承运商直接相关的可服务市场，主要限定在送往城市及郊区住宅地址的轻量级
              B2C 电商包裹。疫情后跨境数字零售爆发式增长，以 Shein、Temu、AliExpress
              等海量发货的超快时尚和工厂直销平台为代表，叠加使用多承运商物流软件的本土中小商家，推动该细分市场体量急剧膨胀。UniUni 迅猛的收入走势——预计 2026 年收入约 $1.1 billion，全网日派件超 1
              million
              件——表明高密度替代配送模式已从区域试点蜕变为承接大货量的主力。商家履约策略发生结构性转变，零售品牌普遍寻求多承运商组合，以规避传统巨头施加的利润挤压与节假日运力配额限制，这一动向持续拉动了市场扩张。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM010
              - CM012
              - CM013
