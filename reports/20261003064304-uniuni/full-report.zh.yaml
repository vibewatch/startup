  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与电商商家工作流
        blocks:
          - type: paragraph
            body: >-
              UniUni 为美加两国走量型跨境电商商家、平台卖家和本土零售商提供定制化的科技驱动型最后一公里包裹配送服务。该业务流程并未采用路线固定的传统重资产车队，而是通过开放 RESTful API，以及预置对接
              4Seller、ShipHero 等电商平台和多承运商 ERP 系统来抓取商家订单。当消费者在 Temu、TikTok Shop 或 Shopify
              独立站下单后，商家的物流软件会自动将目的邮编、包裹尺寸等订单参数与 UniUni
              的网络覆盖规则进行匹配。系统瞬时生成标准化面单并分配实时运单号。商家包裹经由上门揽收或自行送交进入区域履约中心，经过自动化光学扫描设备入库，按目的区域分拣，最后派发给众包司机完成门到门交付并上传拍照妥投证明。
