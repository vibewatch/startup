          - type: callout
            title: 交易脆弱性与迫近的旺季流动性需求
            body: >-
              UniUni 在 2026 年 9 月宣布新一轮私募融资投资意向书，叠加据报道 MAK Acquisition 合并交易中出现的违约指控，突显出公司对外部融资的极度依赖。若未能在 Q4
              假日配送高峰前筹措充足资金，不仅可能掣肘业务运转，还可能引发剧烈的下调轮稀释。
            calloutType: risk
