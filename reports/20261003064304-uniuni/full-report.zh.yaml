  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与基本面风险权衡
        blocks:
          - type: paragraph
            body: >-
              UniUni 的核心投资逻辑在于其在美加两国住宅 DTC 电商包裹配送中建立的结构性成本优势。以私家车众包零工司机与自动化机器人分拣枢纽，取代重资产车队折旧、工会工资协议及传统转运网点，UniUni
              提供的单一平价费率较传统陆运单件便宜 3 至 5 美元。该运营体系撬动了爆发式的包裹量增长，网络覆盖扩展至 500 多个城市，触达 65% 的美国人口和 80%
              的加拿大人口。然而，其反向逻辑根植于极高的客户集中度、法律诉讼风险及资本脆弱性。公司的扩张绝大部分由 Shein 和 Temu 等跨境平价电商平台驱动，终端件量直接暴露于国际贸易关税、海关小额豁免（de
              minimis）规则调整以及平台路由算法调整的冲击之下。与此同时，美国正在进行的指控零工定性不当的集体诉讼，随时可能瓦解其弹性用工成本优势；而 2025 年录得的 US$70 million
              净亏损，则表明其运营层面的持续失血仍需不断依赖外部流动性输血。
