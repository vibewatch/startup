              - CM014
      - number: '2.4'
        title: 普及驱动因素与行业结构性瓶颈
        blocks:
          - type: paragraph
            body: >-
              宏观电商包裹量攀升、零售商对多承运商备选方案的需求，以及人工智能与仓储机器人分拣的技术突破，共同加速了零工众包最后一公里物流的渗透。替代承运商部署自动化分拣设备和动态路径优化算法，最大限度减少人工干预并压低单件边际成本，据报道其运费价格不到传统快递巨头的一半。然而，多项关键瓶颈正在抑制市场扩张并威胁其运营的可持续性。首要阻力来自针对司机用工定性的法律与监管审查。众包承包商模式已引发监管问询和拟议集体诉讼，被指控存在拖欠司机工资和用工性质错分类问题；一旦劳动法强制要求提供法定员工福利或加班补偿，将引发结构性成本上涨。此外，当货量过度依赖少数几家超大跨境平台时，替代承运商面临极高的合作方集中度风险，极易受海关政策调整、关税执行趋严或小额豁免（de
              minimis）门槛变动的冲击。最后，要在本土主流商家中建立品牌信任，还必须具备持续稳定的履约表现、健全的客服响应以及可核验的妥投证明机制，以扭转外界历来认为众包网络包裹安全性差的固有偏见。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 众包包裹模式的利润率动态
            body: >-
              新兴最后一公里承运商颠覆传统快递公司的核心逻辑，是用算法调度与零工司机替代工会车队和高额资产折旧等固定重资产。以不到传统巨头一半的运价运行，使其能够从价格敏感的全球电商平台中爆发式攫取货量；但要维持这一优势，前提是守住极高的包裹密度并避免劳工性质被强制重分类。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM011
              - CM015
          - type: callout
            title: 用工重分类与客户集中度风险
            body: 众包配送网络虽然实现了极高的成本效率，却伴随着巨大的监管与运营风险。在美国面临的司机用工定性集体诉讼，加上对少数跨境快时尚电商巨头的极度依赖，对公司利润率的持续扩张构成了结构性威胁。
            calloutType: risk
            claimRefs:
