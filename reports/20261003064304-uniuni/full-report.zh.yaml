  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：承包商用工性质分类、劳工标准与证券合规
        blocks:
          - type: paragraph
            body: >-
              UniUni 的轻资产众包配送体系高度依赖超过 100,000 名注册独立承包商司机，这些司机自备私家车完成最后一公里包裹配送。这一运营架构在北美联邦及州级劳工标准下面临生死存亡级别的监管风险敞口。2024 年
              12 月的调查报道披露，UniUni 在美国遭到多起诉讼，其中包括两起拟议集体诉讼，指控该公司系统性压低司机薪酬，并违法将劳工定性为独立承包商而非法定正式雇员。一旦在加州第 5 号法案（AB 5）的 ABC
              测试或美国劳工部独立承包商标准等严苛法规下被强制重分类为正式雇员，法定加班费、最低工资保障、薪酬税分摊、工伤赔偿保险以及车辆费用报销将立刻推高可变用工成本，从而侵蚀 UniUni
              低于传统快递的运价优势。此外，2024 年 5 月康涅狄格州当地执法部门调查了 UniUni
              一处未取得许可的仓储设施，发现分拣人员在恶劣生活条件下直接留宿设施内部，暴露出公司在快速扩张区域网点时，在市政条例、土地规划和工作场所安全合规上存在严重漏洞。最后，拟议中由 MAK Acquisition
              Corp. 进行的合资格收购，使 UniUni
              面临横跨加拿大各省证券监管机构、多伦多证券交易所（TSX），以及未来计划为纳斯达克（Nasdaq）两地上市而需向美国证券交易委员会（SEC）递交注册申请的多法域证券监管审查。
            claimRefs:
