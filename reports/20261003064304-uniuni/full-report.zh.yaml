  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与交付模式分化
        blocks:
          - type: paragraph
            body: >-
              北美包裹配送市场从根本上分化为两大阵营：全国性传统综合物流集成商，以及新兴的电商最后一公里专业服务商。老牌承运商 UPS 与 FedEx
              运营着跨越航空、陆运、大宗货运的多层级综合网络，全面覆盖北美偏远地区及国际航线。这类传统网络能够保障可预期的时效并提供加急保障服务，但承担着沉重的固定资产折旧、工会制或专属车队架构，以及由基础运费叠加燃油、住宅和偏远地区附加费的繁复计价体系。相比之下，UniUni
              属于专为 5 磅以下轻型 DTC 电商包裹打造的轻资产众包最后一公里配送网络。UniUni
              不涉足长途干线运输或航空机队资产，而是直接在区域分拣中心及机场口岸接货，依托自动化分拣机器人和自备私家车的众包司机完成门到门最终交付。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
