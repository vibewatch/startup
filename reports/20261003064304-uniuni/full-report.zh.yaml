              - CM012
              - CM013
      - number: '2.3'
        title: 买方客群分层、工作流整合与采购机制
        blocks:
          - type: paragraph
            body: >-
              现代最后一公里包裹配送的买方格局主要分为三类客群：大型跨境电商平台、走量型本土零售品牌与第三方物流（3PL）服务商，以及独立直面消费者（DTC）小微商家。日发数万单的大型电商平台中，物流采购由供应链副总裁、首席营收官或首席物流官把关，其核心诉求是压降单票包裹成本，并压缩从海关口岸到消费者家门的时效。这类买方要求与自动化分拣枢纽实现定制化电子数据交换（EDI）与应用程序接口（API）直连，以支持实时打单、运单追踪及批量路由。本土零售品牌与腰部
              3PL 聚合商则借助 EasyPost、ShipStation 等多承运商打单引擎，或 Shopify
              原生集成接入替代承运商网络。这类托运方的采购决策需要在运费折扣与承运商稳定性、扫描轨迹可见度及妥投承诺达标率之间权衡，毕竟派送延误或错投引发的消费者不满会直接损耗商家的品牌资产。初创小商家和区域卖家则使用网页端自服务门户以及线下的自提/代寄（PUDO）代收点，以此避开成本高昂的传统预约上门揽件。
            claimRefs:
              - CM002
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
