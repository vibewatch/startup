      - number: '7.3'
        title: 合作伙伴与商业依赖风险：平台集中度与跨境贸易政策
        blocks:
          - type: paragraph
            body: >-
              UniUni 的多年营收高增长——从 2023 年的 $113 million 增至 2024 年的 $295 million、2025 年的 $683 million，以及 2026 年预计突破 $1.0
              billion——主要由源自中国的跨境平价电商平台驱动，最突出的代表是 Shein、Temu、TikTok Shop 和 AliExpress。这种商业结构造成了极端的客户集中度；一旦 Shein 或 Temu
              任一家出现单量下滑、物流重新招标或转向自营，都将沉重打击 UniUni 的全网包裹密度与毛利率。此外，进入美国的跨境电商货物依赖复杂的清关框架、空运干线转运以及 Section 321 小额豁免关税（de
              minimis）。地缘政治紧张局势加剧、美国收紧小额免税进口政策的潜在立法或行政改革，或是对入境小包裹加大清关单据核查力度，都可能造成严重的口岸延误、关税追缴以及更高的通关摩擦成本。在运力端，UniUni
              依赖区域配送服务合作伙伴（DSP）招募、维系和管理承包商司机队伍，这使得区域网络极易受合作方流失、车队运力不足或本地承包商频繁流失的冲击。
