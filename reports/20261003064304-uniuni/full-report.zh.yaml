  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与买方经济学
        blocks:
          - type: paragraph
            body: >-
              UniUni 将其商业客群划分为三类买方：全球跨境折扣电商平台、本土直面消费者（DTC）品牌，以及区域第三方物流（3PL）履约仓。UniUni 运量的基石来自亚洲出海电商巨头——特别是
              Shein、Temu、AliExpress 和 TikTok
              Shop，这些平台亟需将货物从机场入境口岸直接高密度配送至美加两国家庭地址的极具成本优势的方案。为了拓宽收入来源并降低对少数超级客户的依赖，UniUni
              针对腰部商家及中小企业（SMB）推出了定制服务，尤其是通过与 ShipHero 等仓储管理平台集成软件智能比价。日发数百至数千件包裹的放量型 Shopify
              卖家及多渠道零售商，可依据包裹重量和派送分区规则自动指派 UniUni 承运。然而，UniUni
              本质上依然属于面向企业的大客户合同制承运商，而非自助式零售邮政网点，其获客周期在很大程度上仍取决于同商用仓储管理软件的 API 对接以及企业级运价协议的谈判。
