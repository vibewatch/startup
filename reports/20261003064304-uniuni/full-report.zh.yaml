      - number: '8.4'
        title: 情景分析：乐观、基准与悲观情景下的投资评估结果
        blocks:
          - type: paragraph
            body: >-
              为量化收益的不对称性，我们围绕运营里程碑、客户留存度与退出路径，分别搭建了乐观、基准和悲观情景模型。在乐观情景下，UniUni 妥善化解交易纠纷，完成 TSX 上市并随后在 Nasdaq 挂牌，借助 PUDO
              网络及小微企业物流方案拓展本土企业客户，并达成管理层设定的 2027 年收入 US$1.5 billion、税前利润 US$125 million 预期。在此情形下，利润率扩张将带来 US$1.8B 至
              US$2.2B 的隐含估值（对应 2027E 收入的 1.2x 至 1.5x）。在基准情景下，公开合并受挫或被迫以更低估值重新谈判，迫使 UniUni 继续依赖私募股权融资；公司收入在 2026 年增至
              US$1.1B，但受平价跨境电商进口放缓及仓储自动化资本开支拖累，2027 年增速回落，维持盈亏平衡的营业利润率，隐含合理估值为 US$750M 至 US$900M（对应 2026 年收入的 0.7x 至
              0.8x）。在悲观情景下，来自 Temu 或 Shein 的单量急剧萎缩，叠加司机被裁定为法定雇员的不利司法判决，导致配送运营费用大幅膨胀，触发 US$350M 至 US$500M 估值的下调轮重组。
