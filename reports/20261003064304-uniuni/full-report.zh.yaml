      - CR003
      - CR004
      - CR005
      - CR008
      - CR009
      - CR012
      - CR014
  - id: FV001
    title: 机构投资建议推导逻辑链
    type: flow
    summary: 分步决策框架，串联运营规模、财务表现、交易摩擦与最终投资建议。
    data:
      nodes:
        - id: N1
          label: 1. 运营规模与增长
          detail: 营收从 2023 年的 $113M 预计扩张至 2026 年的 $1.1B；100K+ 名司机覆盖 500+ 座城市，日均配送包裹 1M+ 件。
        - id: N2
          label: 2. 盈利质量与单位经济模型
          detail: 2025 年录得净亏损 US$70M；单票利润率、司机履约成本及分拨中心干线运输费用均未披露。
        - id: N3
          label: 3. 结构性与法律逆风
          detail: 客户高度集中于 Shein/Temu；美国联邦及州法院有多起司机劳动关系定性集体诉讼在审。
        - id: N4
          label: 4. 资本结构与上市风险
          detail: US$1.0B 的 SPAC 合并面临违约指控与潜在终止风险；另有 2026 年 9 月紧急私募融资条款清单。
        - id: N5
          label: 5. 机构投资建议立场
          detail: 投资建议：继续研究；估值立场：按 1.0x 2026E Rev 偏高；风险：高；置信度：中（待交易走向明朗）。
        - id: N6
          label: 6. 跟踪催化剂与交易终止触发条件
          detail: 在做出出资承诺前，需跟踪 TSX MAK.U 股东通函、正式合并终止或违约补救进展，以及经审计的毛利率申报文件。
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: 系对投资判断里程碑与公司治理障碍的定性综合梳理。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV010
      - CV011
