figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: UniUni 自 2019 年在温哥华成立至计划于 2026 年在 TSX 上市期间的关键历史里程碑。
    data:
      items:
        - label: 2019 年 - 创立与业务初次转型
          detail: 在温哥华作为外卖餐饮配送平台创立；随后与 Shein 签订首份主要包裹合同，日处理配送量达 1,000 单。
          tone: neutral
        - label: 2020 年 - 加拿大省际业务扩张
          detail: 快递业务扩展至阿尔伯塔省与安大略省，日派送量增至 10,000 件包裹。
          tone: positive
        - label: 2021 年 - 加拿大东部网络布局
          detail: 业务拓展至蒙特利尔及加拿大 30 座城市；在 100 名员工支撑下，日包裹派送量达 50,000 件。
          tone: positive
        - label: 2022 年 - 进入美国市场与质量认证
          detail: 首次进入美国市场，获得 PIP 与 ISO9001 认证，末端完结签收率达到 99.68%。
          tone: positive
        - label: 2023 年 - 北美高速扩张
          detail: 北美注册司机网络突破 10,000 名，全职员工总数超过 300 人。
          tone: positive
        - label: 2024 年 - 劳工合规审查与机器人自动化
          detail: 日派送量突破 600,000 件；面临康涅狄格州仓库劳工调查以及美国独立承包商误分类集体诉讼。
          tone: negative
        - label: 2025 年 - D 轮融资与网络覆盖
          detail: 完成由 Bessemer 领投的 US$70M D 轮融资；收购 Shippie，将网络覆盖拓展至美国 65% 与加拿大 80% 区域。
          tone: positive
        - label: 2026 年 - 签署 TSX 上市协议
          detail: 与 MAK Acquisition Corp. 达成作价 $1.0B 企业价值的反向收购交易，目标在 2026 年实现超 $1.0B 营收。
          tone: positive
    approximationNotes: 里程碑日期与规模指标摘自官方企业历史披露、新闻通稿及调查性报道。
