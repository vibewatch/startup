      - CM010
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 物流承运商竞争定位象限
    type: quadrant
    summary: 各包裹承运商在轻量级居民区电商件领域地理覆盖广度与单票成本效率的综合评估。
    data:
      points:
        - label: UPS Ground
          x: 4
          'y': 9
          note: 覆盖全国及农村地区，网络完善，但叠加各类高额附加费
        - label: FedEx Ground
          x: 4
          'y': 9
          note: 庞大的多层级一体化网络，每年综合基准费率上调 5.9%
        - label: UniUni Last-Mile
          x: 9
          'y': 6
          note: 在人口稠密城区及近郊成本效率高（单票节省 $3-$5），但偏远农村覆盖有限
        - label: USPS Ground Advantage
          x: 7
          'y': 10
          note: 实现居民住宅全覆盖，成本效率适中，独占邮政信箱投递权限
        - label: Canada Post Regular Parcel
          x: 6
          'y': 9
          note: 覆盖加拿大全境，执行标准无折扣的居民住宅陆运费率
        - label: Regional Courier Services
          x: 6
          'y': 4
          note: 成本效率适中，业务局限于特定大都市圈或省份市场
      xAxis:
        label: 成本效率（轻量级住宅配送）
        min: 0
        max: 10
      yAxis:
        label: 地理覆盖广度
        min: 0
