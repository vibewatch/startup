          - type: paragraph
            body: >-
              尽管表面单量增长惊人，UniUni 的客群结构却暗藏严重的集中度与留存脆弱性。来自少数超大客户（主要是 Shein 和 Temu）的跨境货量占据了公司总体货运量的绝大部分。这使 UniUni
              面临巨大的对手方与监管结构性风险，包括美国可能针对 Section 321 小额豁免关税（de minimis）收紧立法，以及对跨境电商加强海关监管。这一商业模式的脆弱性在 2026 年 9
              月底暴露无遗：SPAC 发起方 MAK Acquisition Corp. 依据双方签订的具有法律约束力的反向收购合并协议，向 UniUni 正式发出了违约通知。违约通知指控 UniUni
              在交易过渡期间的业务与财务表现出现实质性恶化，从而触发了合同约定的补救期。MAK Acquisition 已表明态度，若 UniUni
              未能就运营及财务违约完成补救，将终止此项业务合并。这起纠纷表明，过往单量的迅猛扩张引发了剧烈的利润挤压、司机工资纠纷以及客户运营摩擦，正对公司的长期企业价值构成严重威胁。
            claimRefs:
              - CU001
              - CU009
              - CU012
      - number: '6.5'
        title: 图表
        blocks:
