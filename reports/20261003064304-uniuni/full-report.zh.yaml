              - CI013
      - number: '4.4'
        title: 资本充足度与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月签署的反向收购协议拟定估值为 US$1 billion，并附带最高 US$100 million 的同期私募配售，但 Stockhouse 指出该交易仍有待股东及监管机构批准。9
              月，UniUni 宣布由现有投资方牵头签署了一份新的私募股权投资意向书（term
              sheet），但未披露具体金额、法律约束力、交割时间或到账资金。这些仅为融资动态，而非实际可用现金的证明。商业数据库补充了时间线，却无法厘清流动性底牌：Tracxn 仅记录总融资金额，Caplight
              公开页面省略了轮次金额，而 EquityZen
              则对财务数据设置了准权限。在管理层正式提供现金储备、烧钱速度、现金跑道、负债、营运资金、客户集中度以及已交割融资明细之前，本尽调的财务结论是：规模高速增长，但收入质量、利润率及资本充足度均未经证实。
