  - id: TP001
    title: 各承运商组织架构与运营画像对比
    columns:
      - 承运商类型
      - 代表性企业
      - 运营模式与运力机队
      - 网络覆盖广度
      - 核心目标客群
      - 核心竞争优势
      - 关键短板与战略权衡
    rows:
      - - 传统全国性综合物流巨头
        - UPS, FedEx
        - 全品类自营或专包运力网络（航空、陆运、货运），配备专属机队与自营车队
        - 全美及全加网络，完整覆盖偏远农村线路及国际物流目的地
        - 企业级 B2B、全渠道零售以及极度敏感的限时特快件
        - 承诺次日达与隔日达航空特快服务、成熟严苛的 SLA 履约体系、经受时间检验的企业级稳定性
        - 基础资费高昂、层层叠加附加费（燃油费、住宅费、偏远地区附加费 DAS），且每年固定上调 5.9% 综合基础运费
      - - 轻资产电商专线物流商
        - UniUni
        - 区域转运中心、自动化机器人，以及由 100,000+ 独立众包司机组成的配送网络
        - 覆盖 65% 美国人口、80% 加拿大人口、500+ 座城市；重兵布局高密度核心城区与近郊
        - 大规模跨境电商与本土 DTC 消费电商订单（5 磅以下轻型小件包裹）
        - 一口价计费模式、单票陆运成本节省 $3-$5，轻量包裹无隐藏附加费
        - 无航空特快产品、轨迹打卡更新间隔长、离开核心都市圈后时效稳定性明显下降
      - - 国家邮政与普遍服务网络
        - USPS, Canada Post
        - 法定普遍服务网络，依托按既定线路每日巡回派送的邮政投递基础设施
        - 100% 覆盖住宅与商业投递地址、PO Box 邮政邮箱及偏远特殊区域
        - 大众消费包裹、轻型商业平信、小微商户标准快递
        - 全天候全域覆盖，独享专属信箱与 PO Box 投递准入特权
        - 处理单量受限、投递班次僵化、商用运价持续上调，受制于沉重的历史退休金福利与刚性用工成本
    notes: 数据综合自 Nice Commerce 承运商对标研究报告与 UniUni 官方披露的运营数据。
