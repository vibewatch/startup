  - id: TP002
    title: 功能与服务能力对比矩阵
    columns:
      - 评估维度 / 考量指标
      - UPS 与 FedEx
      - UniUni
      - 权衡取舍与战略启示
    rows:
      - - 定价机制与附加费结构
        - 基础分区计费，叠加大额燃油费、住宅派送费、偏远地区附加费（DAS）及体积重系数
        - 包含燃油与住宅派送费的一口价打包模式
        - UniUni 在大都市核心区单票轻量陆运包裹平均享有 $3-$5 的显著成本优势
      - - 时效承诺与航空特快分层
        - 覆盖完善的承诺次日达、隔日达及三日达航空特快服务矩阵
        - 不提供航空特快产品；纯陆运网络架构
        - 发件人无法使用 UniUni 寄递紧急高时效、突发应急或易腐生鲜货物
      - - 地理版图与乡村覆盖深度
        - 全国无死角覆盖，深入偏远乡村与离岛
        - 集中覆盖一二线都市核心及近郊，乡村覆盖十分薄弱
        - 乡村件若走 UniUni 配送，时效会断崖式拉长，甚至面临无法妥投
      - - 物流轨迹清晰度与打卡节点密度
        - 在干线中转、转运分拨与末端派送各环节均有高密度的扫码打卡节点
        - 扫码更新节点较少，包裹从到达转运中心至派件上门之间的状态真空期较长
