      - number: '3.3'
        title: 护城河韧性、平台切换壁垒与中介商冲突
        blocks:
          - type: paragraph
            body: >-
              UniUni 的护城河依托区域配送密度、众包司机网络效应、自研路径优化算法，以及与 Shein、Temu 等大件量跨境折扣电商的深度绑定。然而，多承运商 3PL
              平台的低切换成本、缺乏自营物理资产壁垒，以及与物流中介之间的业务摩擦，制约了其护城河的韧性。2026 年中，物流服务商 Point2Point Global 在加州联邦法院起诉
              UniUni，指控其在涉及一笔第三方物流账户的商业纠纷后，扣停了超过 16,000 件包裹的派送，并将 4,100 多件节假日包裹标注为无法送达。尽管 UniUni 坚决否认指控，坚称 Point2Point
              拖欠了总计近 200 万美元的巨额账单未付，并宣布计划提出反诉，但这场公开纠纷充分暴露了非资产型承运合作背后固有的运营脆弱性与渠道对手方风险。
            claimRefs:
