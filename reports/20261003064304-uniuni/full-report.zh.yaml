  - id: FM001
    title: 市场潜在规模与货量捕获层级
    type: pyramid
    summary: 从北美整体快递市场向轻量级电商包裹细分赛道及 UniUni 运营规模过渡的层级拆解。
    data:
      items:
        - label: 北美快递与配送总体市场
          value: 31,274 Competitors
          detail: 2024 年全北美在营快递与配送服务实体总量（IBISWorld 普查数据）。
        - label: B2C 轻量级电商包裹细分市场
          value: Sub-25 lb Parcels
          detail: 替代型众包司机网络主攻的高密度居民区电商配送市场。
        - label: 承运商区域基础设施布局
          value: 100+ Warehouses
          detail: 支撑自动化物流运作的北美在营分拣与配送枢纽。
        - label: 新兴承运商日均运营规模
          value: 1.0M+ Parcels / Day
          detail: UniUni 依托 100+ 处分拣仓库已确认的日均包裹处理与派送运行规模。
        - label: 北美基准派送业务量
          value: 300,000+ Parcels
          detail: 2023 财年跨加拿大与美国完成的高增长初期实际派送业务量。
        - label: 远期营收规模里程碑
          value: $1.1B Projected (2026)
          detail: 向加拿大证券监管机构提交的初步招股书文件中记录的预计年度收入。
    approximationNotes: 货量数据反映招股说明书及财经媒体报道中披露的运营基准。
    claimRefs:
      - CM004
