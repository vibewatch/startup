      - number: '8.2'
        title: 机构评级框架、置信度评估与估值立场
        blocks:
          - type: paragraph
            body: >-
              在拟议的 US$1.0 billion 交易估值下，我们给予 UniUni“继续研究”（research-more）的机构建议，置信度为中，风险评级为高，估值立场偏高。虽然 US$1.0 billion
              的账面企业价值约合 2026 年预期收入 US$1.1 billion 的 0.91x——相比重资产传统快递与高利润物流平台，表面看似保守——但由于盈利质量未经核实且交易存在极大变数，这一估值倍数严重失真。与
              MAK Acquisition Corp. 的合格收购交易于 2026 年 5 月签署正式协议，股权对价为每股 US$10.00；但到 2026 年 9 月，这桩 SPAC
              合并遭遇违约指控并面临潜在终止。为在年末假日旺季前充实资产负债表，UniUni 被迫宣布一份由老股东领投的新一轮私募融资投资意向书。在最终审计财务数据核实其毛利率、净现金消耗和合并后资本结构之前，以 US$1.0
              billion 估值投入股权资本，将使投资者直接暴露于下调估值重定价、私募配售稀释或流动性锁定的风险中。
