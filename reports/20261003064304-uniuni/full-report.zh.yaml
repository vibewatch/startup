      - number: '7.4'
        title: 财务与交易执行风险：SPAC 信托赎回、烧钱速度与股权稀释
        blocks:
          - type: paragraph
            body: >-
              尽管 UniUni 预计收入将迅猛增长，2026 年突破 $1.0 billion，并设定了 2027 年实现税前盈利的目标，但公司在激进推进异地仓网扩张的 2025 财年录得 US$70 million
              净亏损。完成与 MAK Acquisition Corp. 的业务合并仍取决于常规交割条件，包括多伦多证券交易所（TSX）的上市批准，以及通过信托托管资金、$15 million 可转债和最高 $100
              million 的券商经办私募配售，合计募得至少 $60 million 资金。若 MAK Acquisition 的公众股东以高于预期的比例行使赎回权，合并后的 New UniUni
              实际到手净现金可能大幅缩水。合并后现金储备若不足，将严重制约下一代自动化超级分拣中心的资本开支规划，倒逼公司进行更多稀释股权的再融资或二级市场举债，并在零售旺季进一步挤压营运资金流动性。
            claimRefs:
