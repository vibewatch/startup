      - number: '1.2'
        title: 创始人、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              UniUni 由不列颠哥伦比亚省科技创业者 Peter Lu 和 Kevin Wang 创办。两人敏锐捕捉到传统国家邮政与高速增长的跨境电商平台之间，在定价和灵活性上存在结构性断层。Peter Lu
              担任首席执行官，主导融资、自动化战略投资以及北美核心都市圈的扩张。2025 年，公司扩充管理层梯队，任命 Sheila Berry
              担任首席营收官，统筹大客户拓展、零售承运商对接，并推进商业多元化以摆脱对单一客户的依赖。拟与 MAK Acquisition Corp. 进行的反向收购引入了机构化公开市场治理，由 SPAC 董事长兼 CEO
              Matt Proud 牵头，其此前曾任法律科技软件商 Dye & Durham 首席执行官。不过，公司的关键人物依赖依然高度集中在创始人 Peter Lu
              身上，主要在于其维系中国跨境电商巨头的客户关系，以及主导分拣自动化的执行推进。
            claimRefs:
              - CO002
              - CO006
              - CO011
