            title: 对手方集中度与 SPAC 违约通知暴露的脆弱性
            body: >-
              UniUni 的超常规增长主要由 Shein、Temu 和 TikTok Shop 等折扣电商平台的高度集中派单驱动。MAK Acquisition Corp. 于 2026 年 9
              月发出违约通知，指控其业务表现恶化，这印证了高度依赖轻资产、极低毛利的跨境快递运量所带来的运营不稳定性与财务高波动性。
