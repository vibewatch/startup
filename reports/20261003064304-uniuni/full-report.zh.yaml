      - number: '8.5'
        title: 可比倍数对标、尽调核查项与逻辑证伪触发点
        blocks:
          - type: paragraph
            body: >-
              将 UniUni
              与上市快递网络、货运物流商以及同处最后一公里的未上市同行横向对标可以看出，物流行业的标称市销率与营业利润率稳定性及资产轻重紧密绑定。上市区域物流与同城即时配送同行的估值倍数跨度极大：同城即时配运营商杭州顺丰同城（Hangzhou
              SF Intra-City）交易在 0.2x 收入和 12.8x EBITDA；专线卡车与干线运输公司 Heartland Express 和 Marten Transport 处于 1.1x 至 1.3x
              收入和 6.6x 至 9.7x EBITDA；特种航空货运承运商 Cargojet 凭借极高的资本护城河，估值达 2.0x 至 2.2x 收入。鉴于 UniUni 在 2025 年净亏损 US$70M，其按约
              0.91x 2026 年预期收入对应的 US$1.0B 估值，缺乏经审计现金流的有效支撑。机构投资者进场前，必须完成几项关键尽调核实：厘清 MAK Acquisition
              并购交易的法律状态与交割时间表、调取经审计的 Shein 与 Temu 客户收入集中度明细、核查核心展业州针对独立承包商用工的法律意见书，并校验单站点净贡献毛利。
