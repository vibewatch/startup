      - number: '8.3'
        title: 当前资本化背景、融资演进与清算优先权负担
        blocks:
          - type: paragraph
            body: >-
              UniUni 的资本化格局表明，在拟议公开上市前，公司在后期私募市场吸收了大量资本。自 2019 年创立至 2024 年底，UniUni 累计融资超过 US$120 million，包括 2024 年 4 月的
              US$50 million Series C，以及 2024 年 11 月由 Bessemer Venture Partners 领投、获超额认购的 US$30 million Series C2。2025
              年中，公司完成由 Bessemer Venture Partners 和 Sinovation Ventures 联合领投的全股权 US$70 million Series D 轮；随后在 2026 年 3
              月敲定一套 $85 million USD 融资包，包含 Rockets Capital 领投的 $30 million USD 股权，以及来自 Royal Bank of Canada (RBC) 的 $55
              million USD 信贷额度。2026 年 5 月与 MAK Acquisition Corp. 达成的反向收购协议对 New UniUni 的股权架构作出规划：UniUni 现有股东保留约 78%，MAK
              股东占 12%，新私募配售投资者占 10%，生效前提是包含托管资金在内至少募资 US$60 million，并同步发行 US$15 million 可转债。然而，随着该 SPAC 交易在 2026 年 9
              月因违约指控面临潜在终止，这项 $100 million 股权融资与可转债的推进状态仍未确定，也给 Series D 和私募过桥投资者留下了潜在清算优先权负担。
            claimRefs:
