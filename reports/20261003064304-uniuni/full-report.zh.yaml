      - number: '5.2'
        title: 技术栈、调度算法与仓储机器人
        blocks:
          - type: paragraph
            body: >-
              UniUni 核心软件基础设施基于横跨 AWS 的混合云架构，采用面向高并发事件处理的多区域微服务设计。后端服务依赖 Node.js 和无服务器 AWS Lambda 执行环境，辅以 PHP 和 Laravel
              服务处理核心业务逻辑并跟踪订单全生命周期。数据持久化与分析流水线结合了 MySQL、PostgreSQL 等关系型数据库，以及用于遥测与数据湖存储的 AWS Redshift 和 Amazon
              S3，为运营分析与商业智能（BI）提供端到端 ETL 能力。平台的动态路径引擎应用图论算法、车辆路径问题启发式算法以及 K-Means
              聚类机器学习模型来优化配送路线，最大程度缩短司机的在途时间与行驶里程。在实体配送中心，UniUni 将算法调度与联手 Global Robotics
              Services（GLP）部署的机器人分拣设备相结合，实现多层立体枢纽设施内的包裹自动化分拣，减少人工触点并压低单件分拣成本。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
