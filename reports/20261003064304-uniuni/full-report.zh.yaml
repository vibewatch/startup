chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与最后一公里商业模式
        blocks:
          - type: paragraph
            body: >-
              Uni Express Inc.（商业名称 UniUni）成立于 2019 年，是一家北美物流科技服务商，总部设在不列颠哥伦比亚省列治文 Shellbridge Way 10271
              号，紧邻温哥华国际机场。公司起步于本地餐饮外卖移动平台；2019 年拿下快时尚巨头 Shein 的配送合作后，迅速转型为跨境电商包裹履约服务商。UniUni
              运行一套轻资产、众包型物流架构，以自研算法调度与路径优化为核心，搭配可变成本的弹性车队，注册独立承包商司机超 100,000 名，均自备私家车配送。包裹由国际口岸入境后，经由 100
              多个区域仓库和自动化分拣中心构成的网络完成流转。UniUni 目前在北美 500 多个城市提供高密度最后一公里配送，覆盖 65% 的美国人口与 80% 的加拿大人口。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO010
