      - number: '3.2'
        title: 履约能力、计价体系与多承运商博弈
        blocks:
          - type: paragraph
            body: >-
              托运商在评估包裹承运商时，越来越综合权衡单件净配送成本、时效、覆盖广度及履约确定性。在计价体系上，FedEx 与 UPS 于 2026 年推行了 5.9%
              的基础运价普调，且层层叠加住宅配送费与偏远地区附加费，使实际面单成本越发不透明。UniUni 则以打包了燃油及住宅附加费的单一平价费率针锋相对，在核心都市圈高密度区域，单票陆运成本估计可比传统承运商节省 3 至
              5 美元。然而，该成本优势是以牺牲部分服务确定性为代价的：UniUni 不提供保证时效的次日达或隔日航空达服务，物流轨迹更新间隔偏长，且一旦目的地超出核心转运辐射半径，运输时效就会出现波动，从 3 天以内拉长至
              6 到 10 天以上。因此，大型托运商通常将 UniUni 视作处理非紧急、轻型住宅件的补充性二级承运商，而非对全国性传统主干网络的完全替代。
