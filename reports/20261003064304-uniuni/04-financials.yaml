company:
  name: "UniUni"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence points to a high-growth last-mile delivery service with reported revenue rising from US$113 million in 2023 to US$683 million in 2025, but the same reporting cites a US$70 million 2025 net loss. Pricing, gross margin, cash, burn, runway, debt terms, customer concentration, and transaction proceeds remain unavailable, making capital adequacy and the path from volume growth to durable free cash flow the central financial diligence blockers."
sections:
  - id: "revenue-model-and-commercial-motion"
    title: "Revenue Model and Commercial Motion"
    body: >-
      UniUni's public offering is a logistics service, not a disclosed software-subscription
      model: it provides e-commerce parcel delivery, cross-border transport, and a Canadian
      small-business shipping product. The retained pages do not publish a rate card or
      identify whether realized contracts are priced per parcel, per route, by weight, or
      through minimum-volume commitments. The website instead routes merchants shipping
      more than 100 packages a day to sales and markets "transparent pricing" with "zero
      surprise surcharges." Management's own buyer framework emphasizes coverage, speed,
      reliability, quality, cost, and capacity flexibility, suggesting an enterprise sale
      won on a combined service-and-price proposition rather than price alone.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "delivery-economics-and-cost-base"
    title: "Delivery Economics and Cost Base"
    body: >-
      The operating model combines a variable delivery layer with meaningful physical
      infrastructure. UniUni recruits Delivery Service Partners that supply networks of
      independent contract drivers, while its website reports more than 100 warehouses and
      sorting centres. That combination may reduce owned-fleet intensity, but it does not
      establish low capital intensity or attractive contribution margins: driver payments,
      linehaul, sorting labor and automation, facility leases, failed-delivery costs, claims,
      and peak-season capacity all remain unquantified. Public scale claims of hundreds of
      millions of annual packages and more than one million daily parcels provide useful
      denominator context, but no retained source discloses revenue per package, cost per
      stop, gross margin, utilization, or working-capital timing.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "reported-growth-and-profitability"
    title: "Reported Growth and Profitability"
    body: >-
      Stockhouse reports annual revenue of US$113 million in 2023, US$295 million in 2024,
      and US$683 million in 2025, followed by management projections above US$1.1 billion
      for 2026 and US$1.5 billion for 2027. These figures come from an independent article
      drawing on company and investor materials, not audited financial statements in the
      retained evidence. The same article reports a US$70 million net loss for 2025 and a
      management expectation of net profitability by year-end 2026 and up to US$125 million
      of pre-tax profit in 2027. Revenue is therefore not a proxy for cash generation, and
      the forecast margin inflection requires direct verification of gross margin, operating
      expenses, working capital, and forecast assumptions.
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
  - id: "capital-adequacy-and-underwriting-verdict"
    title: "Capital Adequacy and Underwriting Verdict"
    body: >-
      A May 2026 reverse-takeover agreement contemplated a US$1 billion valuation and a
      concurrent private placement of up to US$100 million, but Stockhouse stated that the
      transaction remained subject to shareholder and regulatory approvals. In September,
      UniUni announced a separate private-funding term sheet led by an existing investor,
      without disclosing its amount, binding status, closing date, or proceeds received.
      These are financing events, not evidence of cash available. Commercial databases add
      chronology but do not resolve liquidity: Tracxn reports total funding, Caplight's open
      view omits round amounts, and EquityZen gates financial data. Until management provides
      cash, burn, runway, debt, working-capital, customer-concentration, and closed-financing
      schedules, the financial verdict is growth with unverified revenue quality, margins,
      and capital sufficiency.
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
