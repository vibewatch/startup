chapter:
  number: 1
  title: "Company Overview"
  summary: "Uni Express Inc. (operating as UniUni) is a Richmond, British Columbia-based technology-enabled logistics company founded in 2019 that specializes in e-commerce last-mile parcel delivery across Canada and the United States. Propelled by high-volume partnerships with cross-border retail giants such as Shein and Temu, the company announced an enterprise-value $1.0 billion reverse-takeover agreement with TSX-listed MAK Acquisition Corp. in May 2026, targeting over $1.0 billion in 2026 revenue while confronting material labor misclassification lawsuits and warehouse working-condition allegations."
sections:
  - id: "identity-business-model"
    title: "Company Identity and Last-Mile Business Model"
    body: "Uni Express Inc., known commercially as UniUni, is a North American logistics technology provider founded in 2019 and headquartered at 10271 Shellbridge Way in Richmond, British Columbia, near the Vancouver International Airport. The company originally launched as a local restaurant food-delivery mobile platform before pivoting swiftly into cross-border e-commerce parcel fulfillment after securing a delivery agreement with fast-fashion titan Shein in 2019. UniUni operates an asset-light, crowdsourced logistics architecture that pairs proprietary algorithmic dispatch and route optimization with a variable-cost fleet of over 100,000 registered independent contractor drivers operating personal vehicles. By routing parcels from international entry hubs through a network of more than 100 regional warehouses and automated sorting centers, UniUni provides high-density last-mile delivery across more than 500 cities in North America, reaching 65% of the United States population and 80% of Canada's population."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "leadership-governance"
    title: "Founders, Executive Leadership, and Governance Structure"
    body: "UniUni was founded by British Columbia-based technology entrepreneurs Peter Lu and Kevin Wang, who identified an structural pricing and agility gap between legacy national postal operators and fast-growing cross-border e-commerce marketplaces. Peter Lu serves as Chief Executive Officer, spearheading fundraising, strategic automation investments, and expansion across North American metropolitan markets. In 2025, the company expanded its executive bench by appointing Sheila Berry as Chief Revenue Officer to oversee enterprise merchant acquisition, retail carrier integrations, and commercial diversification away from single-account dependency. The proposed reverse takeover with MAK Acquisition Corp. introduces institutional public market governance led by SPAC Chairman and CEO Matt Proud, formerly chief executive officer of legal software provider Dye & Durham. Key-person dependence remains concentrated in founder Peter Lu's customer relationships with Chinese cross-border e-commerce conglomerates and execution of sorting automation."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-public-listing"
    title: "Capitalization History, Private Placements, and Public Listing Transaction"
    body: "Between its 2019 inception and 2025, UniUni raised over US$200 million in private venture funding across multiple financing rounds. The investor syndicate comprises institutional North American venture funds, Canadian scaleup investors, and international cross-border trade institutions, including Bessemer Venture Partners, Sinovation Ventures, Celtic House Venture Partners, Redpoint Ventures, DCM Ventures, LFX Venture Partners, and Alibaba's venture investment arm. On May 15, 2026, UniUni entered into a definitive purchase agreement to merge with MAK Acquisition Corp. (TSX: MAK.U) in a qualifying reverse takeover transaction that values UniUni at an enterprise value of approximately US$1.0 billion (C$1.37 billion). The transaction is supported by a best-efforts private placement of up to US$100 million in non-voting common shares of Finco at $10.00 per share, brokered by Canaccord Genuity, and includes a $15 million convertible note issued by UniUni. Following completion, existing UniUni shareholders are projected to hold roughly 78% of the resulting issuer, New UniUni, with MAK Acquisition shareholders holding 12% and private placement investors holding 10%."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "operational-scale-controversies"
    title: "Scale Milestones, Network Expansion, and Operational Controversies"
    body: "UniUni's physical footprint scaled dramatically from 1,000 local deliveries daily in 2019 to over 1 million parcels processed daily by late 2025 across more than 100 distribution centers. To sustain unit economics while expanding handling volume, UniUni deployed robotic sortation systems in partnership with Global Robotics Services, reporting a 99.99% sorting accuracy and enabling plans to scale capacity up to 3 million parcels daily. However, this hyper-expansion has been accompanied by intense operational friction and adverse regulatory scrutiny. In December 2024, investigative reports revealed that UniUni faces multiple federal and state lawsuits in the United States, including two proposed class actions alleging driver misclassification and systematic failure to pay minimum and overtime wages. Furthermore, in May 2024, local law enforcement in Connecticut discovered warehouse workers sleeping in an unpermitted company sorting facility under hazardous conditions, highlighting severe human-capital vulnerabilities underpinning its low-cost courier delivery structure."
    claimRefs:
      - "CO004"
      - "CO009"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
