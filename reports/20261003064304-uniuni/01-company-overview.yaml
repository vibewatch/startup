callouts:
  - calloutType: "insight"
    title: "The Asset-Light Arbitrage of Cross-Border E-Commerce Logistics"
    body: "UniUni's hyper-growth from $113 million in 2023 revenue to an anticipated $1 billion in 2026 demonstrates the structural scale of Chinese ultra-fast fashion and marketplace exports to North America. By deploying a crowdsourced network of independent contractor drivers and automating central super-sorting hubs, UniUni claims to deliver at half the cost of legacy couriers. However, this cost structure remains heavily exposed to ongoing U.S. worker misclassification litigation and warehouse labor scrutiny."
    claimRefs:
      - "CO003"
      - "CO008"
      - "CO014"
      - "CO015"
