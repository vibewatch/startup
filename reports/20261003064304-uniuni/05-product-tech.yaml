chapter:
  number: 5
  title: "Product & Technology"
  summary: "UniUni operates an asset-light, algorithmically dispatched last-mile parcel logistics platform designed for cross-border and domestic e-commerce fulfillment across Canada and the United States. Its technology architecture integrates automated warehouse robotic sorting systems, vehicle routing problem (VRP) algorithms, and open REST APIs with major merchant ERPs and 3PL platforms, while relying on variable-capacity crowdsourced delivery drivers managed through mobile applications."
sections:
  - id: "service-definition-workflows"
    title: "Product Definition and E-Commerce Merchant Workflows"
    body: "UniUni provides tech-driven last-mile parcel shipping services customized for high-volume cross-border e-commerce merchants, marketplace sellers, and domestic retailers across Canada and the United States. Rather than operating traditional asset-heavy fleet networks with fixed courier routes, the service workflow captures merchant parcel orders via direct RESTful APIs and pre-built integrations with e-commerce platforms and multi-carrier ERPs such as 4Seller and ShipHero. When a shopper completes an order on marketplaces like Temu, TikTok Shop, or Shopify storefronts, the merchant's logistics software automatically matches order parameters—including destination postal codes and package dimensions—against UniUni's network coverage rules. The platform instantly generates standardized shipping labels and assigns real-time tracking numbers. Merchant packages are picked up or inducted into regional fulfillment hubs, inducted through automated optical scanners, sorted by destination zone, and dispatched to crowdsourced drivers who complete final doorstep delivery with photographic proof-of-delivery."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-operating-model"
    title: "Technology Stack, Dispatch Algorithms, and Warehouse Robotics"
    body: "UniUni's core software infrastructure is built upon a hybrid cloud architecture spanning AWS and multi-region microservices engineered for high-concurrency event processing. Backend services rely on Node.js and serverless AWS Lambda execution environments, complemented by PHP and Laravel services for core domain processing and order life-cycle tracking. Data persistence and analytical pipelines utilize relational databases including MySQL and PostgreSQL alongside AWS Redshift and Amazon S3 for telemetry and data lake storage, enabling end-to-end ETL provisioning for operational reporting and BI. The platform's dynamic routing engine applies graph theory algorithms, Vehicle Routing Problem (VRP) heuristics, and K-Means clustering machine-learning models to optimize delivery routes, minimizing driver transit time and mileage. At physical distribution centers, UniUni pairs its algorithmic routing with robotic sortation equipment deployed in collaboration with Global Robotics Services (GLP), automating parcel classification across multi-level hub facilities to reduce manual touchpoints and lower per-parcel sorting costs."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "integrations-security-risks"
    title: "Ecosystem Integrations, Information Security, and Operational Gaps"
    body: "Ecosystem interoperability and information security form the operational backbone of UniUni's commercial expansion. To streamline onboarding for third-party sellers, UniUni provides open RESTful APIs and carrier connections with popular third-party logistics software and multi-channel ERP platforms. Multi-carrier systems such as ShipHero incorporate automated rate-shopping engines that dynamically route domestic Canadian and U.S. parcels to UniUni based on pricing rules, while incorporating automated fallback mechanisms to secondary carriers when destination addresses fall outside UniUni's regional delivery boundaries. For information security and governance, UniUni encrypts customer and order data in transit using TLS 1.2 protocols and isolates sensitive merchant data from public networks under documented risk management procedures. However, material product and technical diligence gaps remain, including absent third-party SOC 2 Type II or ISO 27001 audit certifications, reliance on crowdsourced contractor devices for final proof-of-delivery data capture, and operational bottlenecks across multi-level sorting facilities during unexpected volume surges."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
