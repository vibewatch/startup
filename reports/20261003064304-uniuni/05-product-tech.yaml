callouts:
  - calloutType: "insight"
    title: "Algorithmic Density Versus Asset-Heavy Infrastructure"
    body: "UniUni's core technological defensibility stems from substituting fixed vehicle fleets with algorithmic routing and crowdsourced labor. By applying Vehicle Routing Problem heuristics and K-Means clustering, the system optimizes package density per route. This enables competitive unit pricing for high-volume merchants, though it shifts operational reliability onto gig-driver availability and mobile application compliance."
    claimRefs:
      - "CE003"
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "Technical Dependency on Marketplace ERP Ecosystems"
    body: "UniUni relies heavily on third-party shipping aggregators and marketplace ERP integrations like 4Seller and ShipHero to capture volume from sellers on platforms like Temu and TikTok Shop. Changes in marketplace carrier qualification policies or API partner terms represent an external vulnerability to platform transaction volume."
    claimRefs:
      - "CE001"
      - "CE012"
      - "CE013"
