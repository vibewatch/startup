    claimRefs: [CV002, CV003, CV005, CV006, CV009, CV014]
callouts:
  - calloutType: recommendation
    title: Price is the gating variable
    body: >-
      Product credibility and strategic investors do not resolve the valuation question. Move from research-more only
      after audited operating metrics and fully diluted financing terms support an acceptable downside-adjusted return.
    claimRefs: [CV009, CV013, CV014]
