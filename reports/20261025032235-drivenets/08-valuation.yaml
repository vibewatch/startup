      - [Confidence, "Multiple independent sources corroborate the financing, but key economics remain private", Medium, "Use milestones and documentary conditions rather than a conviction premium"]
      - [Risk rating, "Inventory funding, backlog conversion, concentration, and preference terms are unresolved", High, "Require downside protection and explicit thesis-break triggers"]
      - [Valuation stance, "Reported $8.5B mark versus a $2.5B 2022 financing level without a verified sales multiple", Stretched, "Do not underwrite the reported mark without audited growth and margin evidence"]
    notes: "Assessments are analytical judgments based on retained public evidence; they are not an offer price or a verified cap-table valuation."
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Argument, Evidence, What would change the view]
    rows:
      - [Thesis, "Strategic capital supports scale-up", "$410M Series D included AMD and established venture investors", "Confirm proceeds, runway, and whether inventory commitments are customer-backed"]
      - [Thesis, "Open AI fabric has a credible ecosystem route", "DriveNets and AMD published a validated reference architecture", "Independent production benchmarks and repeat deployments would raise confidence"]
      - [Anti-thesis, "The private mark outran disclosed fundamentals", "Reported value rose about 3.4x from the 2022 mark while revenue and margins remain undisclosed", "Audited recurring revenue, growth, margins, and retention could justify the step-up"]
      - [Anti-thesis, "Scaling may be more capital intensive than a pure-software model", "DriveNets said part of the round would support ready inventory for AI deployments", "Customer deposits, non-cancellable orders, and inventory turns would reduce working-capital risk"]
    notes: "Company and partner claims are identified as such; the table does not treat issued benchmark or backlog statements as independently audited."
    claimRefs: [CV001, CV004, CV006, CV007, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Audited growth and margins are strong; backlog converts; AI deployments diversify", "Reported $8.5B mark may be supportable only with a credible path to an exit return", "Execution at scale and incumbent response", "Independent production wins plus audited cohort economics"]
      - [Base, "Technology is credible but financial and concentration evidence remains incomplete", "Seek a discount, staged entry, or structural protection rather than accept the reported mark", "Multiple compression, dilution, and slower conversion", "Documented revenue quality and customer expansion are still pending"]
      - [Bear, "Inventory grows ahead of cash conversion or deployments remain concentrated", "Defer investment because no public denominator supports a downside valuation floor", "Working-capital strain, down round, or failed commercialization", "Cancellable backlog, weak margins, or refusal to disclose cap-table terms"]
    notes: "No numeric probabilities or valuation ranges are assigned because public evidence lacks verified revenue, margin, retention, and preference inputs."
    claimRefs: [CV005, CV006, CV009, CV013, CV015, CV016]
