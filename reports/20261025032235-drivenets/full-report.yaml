  - id: FE001
    title: Product architecture map
    type: stack
    summary: DriveNets connects customer networking workloads to a disaggregated software and hardware fabric.
    data:
      layers:
        - label: Carrier routing and peering
          detail: Network Cloud supports core, edge, aggregation, and access use cases.
          modules:
            - Network Cloud
        - label: AI fabric
          detail: Network Cloud-AI targets Ethernet networking for large heterogeneous GPU clusters.
          modules:
            - Network Cloud-AI
        - label: DNOS
          detail: Container- and microservice-based network operating system.
          modules:
            - Containers
            - microservices
            - routing services
        - label: Operations and automation
          detail: Configuration, monitoring, troubleshooting, telemetry, and provisioning surfaces.
          modules:
            - Management
            - telemetry
            - provisioning
        - label: White-box switching
          detail: Standard hardware from multiple vendors rather than one integrated appliance.
          modules:
            - Distributed chassis
            - leaf and spine
        - label: Silicon and optics ecosystem
          detail: Merchant silicon, coherent pluggables, and partner hardware such as Ciena, Broadcom, and Accton.
          modules:
