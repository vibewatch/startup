  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              DriveNets sells networking software rather than a fixed router appliance. Its Network Cloud model
              separates the network operating system from hardware and lets operators assemble a shared infrastructure
              from standard white boxes. The operating model is visible in the KDDI deployment: Network Cloud was used
              as an internet-gateway peering router after several years of lab testing, with additional applications
              planned. DriveNets also describes Network Cloud-AI as an Ethernet fabric for AI infrastructure, positioned
              around higher GPU utilization and faster deployment. These are distinct workflows: carrier routing and
              peering are a more mature proof surface than the newer AI-fabric use case, whose customer breadth and
              realized outcomes are not fully disclosed.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE006
              - CE013
              - CE015
          - type: table
