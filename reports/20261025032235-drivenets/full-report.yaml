            - Economic case
        - id: technical-evaluation
          label: Technical evaluation
          detail: Lab trial, benchmark, or proof of concept on the customer's workload
          touchpoints:
            - Interoperability
            - Reliability
        - id: initial-deployment
          label: Initial deployment
          detail: First production domain or regional rollout after acceptance
          touchpoints:
            - Integration
            - Operational readiness
        - id: production-scale
          label: Production scale
          detail: Traffic, locations, services, or cluster capacity expands
          touchpoints:
            - AT&T core traffic
            - Comcast nationwide plan
        - id: commercial-expansion
          label: Commercial expansion
          detail: Multi-year scope, added capacity, or broader network functions
          touchpoints:
