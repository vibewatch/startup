    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              DriveNets is consistently described in the assigned evidence as an Israeli business-software company
              headquartered in Ra'anana and founded in 2015 by Ido Susan and Hillel Kobrinsky. Its core Network Cloud
              product separates networking software from standard white-box hardware, using a cloud-native architecture
              for communications service providers and cloud operators. The company-issued solution description says the
              platform provides shared compute and networking infrastructure, supports services from core to edge, and
              separates its control and data planes. The same material describes DNOS as containerized, distributed
              networking software and DNOR as the orchestration layer. The assigned evidence also indicates a later
              Network Cloud-AI direction for Ethernet-based AI fabrics. These are product and company descriptions, not
              independent proof of performance, cost savings, or customer-wide deployment.
            claimRefs:
              - CO001
              - CO002
              - CO003
