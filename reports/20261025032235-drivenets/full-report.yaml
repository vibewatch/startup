  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision chain separates the verified financing from the unverified valuation denominator and resulting entry
      discipline.
    data:
      nodes:
        - id: financing
          label: $410M Series D
          detail: Financing amount corroborated by independent reporting
        - id: private-mark
          label: Reported $8.5B mark
          detail: Third-party estimate; Reuters says DriveNets did not disclose the valuation
        - id: operating-signal
          label: Positive operating claims
          detail: Company says cash-flow positive with more than $1B in orders and backlog
        - id: denominator-gap
          label: No verified valuation denominator
          detail: Revenue, ARR, margins, retention, and free cash flow are not disclosed in retained evidence
        - id: execution-risk
          label: Inventory and conversion risk
          detail: Fresh capital is partly intended to support deployment inventory
        - id: recommendation
          label: Research more
          detail: Price-sensitive entry only after financial, customer, and cap-table diligence
      edges:
        - from: financing
          to: private-mark
          label: round context
        - from: private-mark
          to: operating-signal
          label: requires support
        - from: operating-signal
          to: denominator-gap
          label: not independently audited
        - from: denominator-gap
          to: execution-risk
          label: limits downside analysis
        - from: execution-risk
          to: recommendation
          label: drives entry discipline
    approximationNotes: This flow expresses decision dependencies, not magnitude, timing, or probability.
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV006
      - CV009
      - CV014
