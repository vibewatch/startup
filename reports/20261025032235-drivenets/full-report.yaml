    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public sales motion runs from concentrated technical evaluation to production scaling and strategic expansion,
      with retention economics remaining unreported.
    data:
      nodes:
        - id: target-account
          label: Target account
          detail: Tier-1 telecom, broadband, cloud, or AI-infrastructure operator
          touchpoints:
