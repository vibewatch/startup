        title: Financing, valuation, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The current financing evidence agrees that DriveNets completed a $410 million Series D in June 2026, with
              Bessemer Venture Partners and Atreides Management leading and AMD, Red Dot Capital Partners, Pitango, and
              D1 Capital Partners participating or being named as investors. Valuation evidence is not fully aligned:
