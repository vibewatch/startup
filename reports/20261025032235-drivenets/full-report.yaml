          detail: Capacity growth is the backdrop, not a DriveNets revenue estimate.
        - label: Addressed network categories
          value: Carrier routing and AI back-end fabrics
          detail: These categories have different buyers, budgets and substitutes.
        - label: Architectural opportunity
          value: Open, disaggregated and software-controlled networking
          detail: TIP requirements show a wider industry move beyond monolithic systems.
        - label: Serviceable buyer groups
          value: CSPs, cloud providers and large AI operators
          detail: The assigned sources name these groups, but not their aggregate spend.
        - label: Adoption-qualified deployments
          value: Validated production networks and AI clusters
          detail: Certification, reliability and operational responsibility narrow the reachable set.
        - label: Obtainable DriveNets share
          value: Not publicly quantifiable
          detail: Pricing, win rates, segment revenue and backlog conversion are unavailable.
    approximationNotes: >-
