  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible boundary is narrower than total networking or AI-infrastructure spend. For carrier and
              cloud networks, it includes network operating software, disaggregated routing and fabric hardware,
              orchestration, integration and support needed to run core, aggregation, edge and peering workloads. For AI
              infrastructure, it includes the back-end Ethernet fabric, compatible switching systems and the software
              that schedules traffic among accelerators. It excludes GPUs and other accelerators, model software,
              storage, general data-center construction and unrelated enterprise LAN equipment. The status quo is also
              different by segment: carrier buyers can retain monolithic, vendor-locked routers, while AI buyers can
              retain InfiniBand or another vertically integrated GPU-network stack. Telecom Infra Project requirements
              show that disaggregation is an industry architecture rather than a DriveNets-only category, while the
              APNIC article describes both single-chassis and leaf-spine choices for AI fabrics. DriveNets therefore
              competes for specific network-control and fabric budgets, not every dollar attached to an operator or AI
              cluster.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: Evidence-constrained sizing and demand signals
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a conventional top-down TAM/SAM/SOM stack with common geography,
              period and spend denominator. A company-issued release quotes 650 Group forecasting that AI networking
              will surpass $200 billion by the end of the decade, but the release supplies neither the market definition
              nor methodology needed to translate that number into DriveNets' addressable revenue. More reliable
              boundary checks come from operating evidence. Telecom Infra Project specifies disaggregated aggregation
              routers from 0.3-1.0 Tbps at the XSmall tier through 12 Tbps or more at Large, showing that deployments
              span materially different capacity and budget classes. Telstra International separately reported an
              incremental 200 Tbs and a 30% increase in capacity across key Asia-Pacific routes in October 2025. The
              Fast Mode reported that more than 52% of AT&T's North American core traffic was already transported by
              DriveNets-powered infrastructure. Those data points support demand and production adoption, but they are
              capacity and penetration signals, not interchangeable market values.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
              - CM013
      - number: '2.3'
        title: Buyers, users, payers and adoption path
        blocks:
          - type: paragraph
            body: >-
              Communications service providers and cloud providers form the established buyer group. Network
              architecture and procurement leaders sponsor the decision, engineering and operations teams use the
              system, and core, aggregation or transport budgets pay for capacity and lifecycle support. The AI-fabric
              buyer set is newer and includes foundation-model labs, hyperscalers, NeoClouds and large enterprises,
              according to the company release; cluster, network and performance engineers are the users, while the
              AI-infrastructure owner controls the budget. Across both segments, adoption is likely to begin with design
              and interoperability validation, proceed through a controlled production deployment, and expand only after
              reliability and operational responsibility are proven. The economic trigger differs by segment. Carrier
              buyers seek incremental scaling, faster provisioning and less proprietary lock-in, whereas AI buyers seek
              higher accelerator utilization, resilient scale and a multi-vendor alternative. Public sources do not
              disclose standardized pricing, buyer conversion rates or the software share of total deployment spend.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, adoption constraints and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Capacity growth, network cloudification and the cost of idle accelerators create a credible demand
              backdrop. Telstra's shorter provisioning cycle illustrates why operators value software-controlled
              capacity, and AT&T's reported production penetration shows that disaggregated routing can move beyond a
              pilot. The counterweight is execution. DriveNets' own operations FAQ acknowledges the perceived risk of a
              multi-vendor blame game and the need for clear end-to-end responsibility. The APNIC article, written by an
              Arista engineer, explains that large leaf-spine AI fabrics require advanced congestion and flow-control
              mechanisms; it is useful technical context, not an independent competitive benchmark. These constraints
              can lengthen certification, migration and support cycles even when the architecture is attractive. For
              valuation, the key issue is conversion rather than theoretical market breadth: investors need segment
              revenue, gross margin, pricing, win rates, backlog conversion and customer concentration before treating
              the broad AI-networking forecast as DriveNets' obtainable market.
            claimRefs:
              - CM007
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity signals are not market size
            body: >-
              Operator traffic share, network capacity and router throughput establish need and deployment scale, but
              none is a revenue denominator. A defensible sizing model must keep those metrics separate.
            calloutType: insight
            claimRefs:
