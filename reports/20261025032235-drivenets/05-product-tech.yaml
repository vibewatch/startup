  evidenceGaps:
    - type: missing-source
      severity: material
      topic: AI-fabric
      missingEvidence: Independent customer references showing production AI-fabric deployments, workload mix, utilization, and realized cost or throughput outcomes.
      whyItMatters: AI-fabric expansion is central to the product thesis, but current public proof is mainly company-led positioning and reported benchmarks.
      diligencePath: Obtain reference calls, deployment acceptance reports, workload definitions, and before-and-after utilization data from at least two production AI customers.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: DriveNets-specific security certifications, penetration-test scope, vulnerability disclosures, and incident history.
      whyItMatters: TIP requirements describe a useful control baseline but do not prove that DriveNets implements or certifies every control.
      diligencePath: Request current SOC 2 or ISO reports, penetration-test summaries, secure-development evidence, and customer incident metrics under NDA.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Hardware compatibility matrix, software release policy, service-level commitments, failure recovery metrics, and support escalation data.
      whyItMatters: A disaggregated architecture can increase vendor choice while also increasing integration and operational coordination risk.
      diligencePath: Review supported bill-of-materials, release notes, mean-time-to-repair data, field failure records, and representative support contracts.
      relatedQuestionRefs: [QE004, QE008]
