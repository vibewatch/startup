company:
  name: DriveNets
chapter:
  number: 5
  title: Product & Technology
  summary: DriveNets delivers cloud-native networking software on disaggregated white-box infrastructure, with Network Cloud serving carrier routing and Network Cloud-AI targeting large heterogeneous GPU fabrics. Public evidence supports a technically specific architecture and real operator deployments, but independent validation of AI performance, security controls, and roadmap maturity remains limited.
sections:
  - id: product-workflow
    title: Product and customer workflow
    body: >-
      DriveNets sells networking software rather than a fixed router appliance. Its Network Cloud
      model separates the network operating system from hardware and lets operators assemble a
      shared infrastructure from standard white boxes. The operating model is visible in the KDDI
      deployment: Network Cloud was used as an internet-gateway peering router after several years
      of lab testing, with additional applications planned. DriveNets also describes Network
      Cloud-AI as an Ethernet fabric for AI infrastructure, positioned around higher GPU utilization
      and faster deployment. These are distinct workflows: carrier routing and peering are a more
      mature proof surface than the newer AI-fabric use case, whose customer breadth and realized
      outcomes are not fully disclosed.
    claimRefs: [CE001, CE003, CE004, CE006, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, integration, and maturity
    body: >-
      The technical proposition is a distributed, disaggregated chassis: DNOS is described as
      container- and microservice-based software that runs across white boxes from multiple
      vendors, while TIP's aggregation-router requirements show the surrounding ecosystem's
      expectations for open hardware, routing, telemetry, automation, and security. DriveNets has
      also demonstrated an integration path beyond basic packet forwarding: the Ciena collaboration
      covered configuration, monitoring, troubleshooting, and 400ZR/ZR+ coherent pluggables in a
      tested open-line-system environment. This suggests a product that can absorb optical and
      management dependencies, but public material does not establish uniform support across every
      hardware combination or quantify operational reliability at scale.
    claimRefs: [CE002, CE005, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-risks
    title: Differentiation, trust, and diligence risks
    body: >-
      DriveNets' differentiation is the combination of software/hardware disaggregation, shared
      infrastructure, and an Ethernet-based AI-fabric thesis that can span multiple accelerator and
      networking vendors. The company reports a 512-GPU benchmark advantage over InfiniBand, while
      third-party coverage repeats claims of fabrics designed for up to 32,000 GPUs; neither source
      is an independent production audit. The strongest public maturity evidence remains carrier
      deployment and interoperability work, not a broad, independently documented AI installed
      base. TIP's requirements provide a useful external checklist for management interfaces,
      provisioning, authentication, logging, and data-plane protections, but they are not proof that
      DriveNets complies with every requirement. Diligence should therefore focus on customer-level
      AI production references, failure and recovery data, supported hardware matrices, security
      attestations, and the boundary between current capability and roadmap.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE014, CE015]
