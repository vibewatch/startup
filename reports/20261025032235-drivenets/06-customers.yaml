        - Open, disaggregated network architecture
        - "KDDI is named by multiple secondary sources"
        - "Adds geographic breadth; production status and contract value are not public"
      - - AI infrastructure operators
        - AI-infrastructure leader / cluster engineering / infrastructure owner
        - Ethernet fabric for GPU clusters
        - "Leading-hyperscaler trials and large-cluster PoCs are claimed"
        - "Potential growth segment; no retained named production AI customer"
    notes: >-
      Segments synthesize the retained public evidence; customer counts are rounded secondary
      reports, and trial, production, footprint, and contract-value measures are not comparable.
