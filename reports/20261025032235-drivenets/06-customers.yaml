        - "More than 52%"
        - Company-issued and repeated on a company profile
        - "Scaled use; not revenue share, account concentration, or retention"
      - - March 2025
        - Comcast Janus expansion
        - "Nationwide expansion after Atlanta trial; 63 million-location target footprint"
        - Independent industry reporting
        - "Expansion proof; live-site count, timetable, and measured outcome missing"
      - - 2023-2026
        - AI-fabric evaluations
        - "Leading-hyperscaler trials and very-large-cluster PoCs"
        - Company claims reported directly and by industry media
        - "Evaluation traction; named production customer and repeat order missing"
    notes: >-
      Periods and values preserve each source's time basis. Comcast's 63 million locations are
      its target service footprint, not confirmed DriveNets deployments; AI trials are not sales.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU015]
  - id: TU003
