    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Maturity
      - Outcome
      - Limitation
    rows:
      - - AT&T
        - Tier-1 telecom
        - North American core routing
        - Production since 2020
        - "DriveNets reported >52% of core traffic in January 2023"
        - "No public contract value, renewal, or revenue concentration"
      - - Comcast
        - Cable and broadband
        - Janus software-based nationwide network
        - Expansion from Atlanta trial
        - "Reported nationwide rollout path and AIOps use"
        - "No verified live-site count, completion date, or realized savings"
      - - KDDI
        - Tier-1 telecom
        - Open network architecture
        - Named customer
        - "Confirms customer and geographic breadth"
        - "Retained evidence lacks production scope and quantified outcome"
    notes: >-
      This is a sample of named customers found in the assigned source pool, not an exhaustive
      customer list; production status is stated only where the retained evidence supports it.
    enumerationScope:
      coverage: sample
      basis: >-
        Named customer references available in the assigned prefetched evidence through the
        2026-10-25 report date.
    claimRefs: [CU003, CU004, CU005, CU006]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The public sales motion runs from concentrated technical evaluation to production scaling
      and strategic expansion, with retention economics remaining unreported.
    data:
      nodes:
        - id: target-account
          label: Target account
          detail: Tier-1 telecom, broadband, cloud, or AI-infrastructure operator
          touchpoints:
            - Architecture fit
            - Economic case
        - id: technical-evaluation
          label: Technical evaluation
          detail: Lab trial, benchmark, or proof of concept on the customer's workload
          touchpoints:
            - Interoperability
            - Reliability
        - id: initial-deployment
          label: Initial deployment
          detail: First production domain or regional rollout after acceptance
          touchpoints:
            - Integration
            - Operational readiness
        - id: production-scale
          label: Production scale
          detail: Traffic, locations, services, or cluster capacity expands
          touchpoints:
            - AT&T core traffic
            - Comcast nationwide plan
        - id: commercial-expansion
          label: Commercial expansion
          detail: Multi-year scope, added capacity, or broader network functions
          touchpoints:
            - Backlog conversion
            - Additional workloads
        - id: strategic-relationship
          label: Strategic relationship
          detail: Customer influence deepens, but renewal and concentration remain diligence items
          touchpoints:
            - AT&T equity relationship
            - Cohort retention review
    approximationNotes: >-
      This is a qualitative journey, not a conversion funnel; public sources do not disclose
      stage conversion rates, typical sales-cycle duration, or cohort retention.
    claimRefs: [CU003, CU005, CU007, CU008, CU010, CU016]
callouts:
  - calloutType: strength
    title: Production proof is strongest in telecom
    body: >-
      AT&T's multi-year production use and Comcast's reported expansion show that DriveNets can
      progress beyond trials in demanding carrier environments.
    claimRefs: [CU003, CU004, CU005]
  - calloutType: risk
    title: Public durability evidence is missing
    body: >-
      Rounded customer counts and secured-business claims do not disclose NRR, GRR, churn,
      renewals, customer concentration, backlog cancellation rights, or realized cash.
    claimRefs: [CU002, CU009, CU011, CU012]
  - calloutType: recommendation
    title: Gate AI traction on named production evidence
    body: >-
      Require a named AI-fabric reference, deployment acceptance evidence, utilization outcomes,
      and repeat-order history before underwriting AI trials as durable customer adoption.
    claimRefs: [CU007, CU008, CU014]
