schemaVersion: "report-v2"
artifact: customers
slug: drivenets
runDate: 2026-10-25
company:
  name: DriveNets
chapter:
  number: 6
  title: Customers
  summary: >-
    DriveNets has credible production proof in large telecom networks: AT&T has used Network
    Cloud in its core since 2020, and DriveNets reported that the platform carried more than
    52% of AT&T's North American core traffic in January 2023. Comcast adds a second scaled
    deployment path, but public evidence still does not disclose retention, concentration,
    renewal, or named production AI-customer metrics.
sections:
  - id: customer-base-and-segmentation
    title: Customer base and segmentation
    body: >-
      The public customer footprint splits into two commercially different groups. The
      established base is communications-service and broadband operators buying core, edge,
      and network-virtualization software; named examples include AT&T, Comcast, and KDDI.
      Independent secondary profiles report roughly 100 customers, but that rounded count has
      no disclosed definition, date-consistent denominator, or split between production,
      pilot, and evaluation accounts. The newer group comprises hyperscalers, neoclouds,
      enterprises, and other AI-infrastructure operators evaluating Ethernet fabric for GPU
      clusters. That segment is strategically attractive but public proof remains mostly
      company-described trials and proofs of concept rather than named production references.
      Buyers therefore appear concentrated among technically sophisticated, high-scale network
      operators, while users are network engineering and operations teams and the economic
      payer is the infrastructure owner.
    claimRefs: [CU001, CU002, CU006, CU007, CU008]
    tableRefs: [TU001]
  - id: production-adoption-and-expansion
    title: Production adoption and expansion
    body: >-
      AT&T is the strongest public adoption proof. DriveNets says its software has provided
      AT&T's production core-routing layer since 2020 and carried more than 52% of North
      American core traffic by January 2023; a separate company profile repeats the traffic
      share, while an independent profile characterizes the deployment as production rather
      than pilot. Comcast broadens the evidence: Futuriom reported that DriveNets supported the
      initial Janus trial in Atlanta and would help expand the software-based network
      nationwide. Futuriom also reported that Janus is intended to support Comcast's 63 million
      locations, but that is Comcast's addressable network footprint, not a count of live
      DriveNets sites. KDDI is repeatedly named, although the retained evidence does not expose
      deployment scale or outcome metrics.
    claimRefs: [CU003, CU004, CU005, CU006, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-economics
    title: Durability, expansion, and customer economics
    body: >-
      The evidence indicates unusually deep strategic relationships but does not quantify
      durability. A secondary data provider says DriveNets sells software and systems under
      multi-year contracts, and Olam reports that AT&T later bought shares from existing
      holders; neither item substitutes for renewal, churn, gross-retention, or net-retention
      data. Futuriom described the Comcast opportunity as reportedly worth hundreds of millions
      of dollars, while two sources repeated DriveNets' statement that secured business
      exceeded $1 billion. Those figures signal commercial demand but are not recognized
      revenue, ARR, or cash and do not reveal customer concentration. Diligence should therefore
      reconcile signed backlog to deployment milestones, acceptance terms, cancellations, and
      cash collections, then obtain revenue concentration and cohort renewal schedules.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU016]
    figureRefs: [FU001]
  - id: ai-customer-proof-and-friction
    title: AI customer proof and procurement friction
    body: >-
      DriveNets' AI-customer evidence remains earlier-stage than its telecom record. The company
      said leading hyperscalers validated AI Fabric in trials and reported up to a 30% reduction
      in idle time, while TelecomTV described participation in proofs of concept in very large
      AI clusters. These claims establish evaluation activity, not named production adoption,
      recurring consumption, or realized customer savings. TelecomTV also identifies a material
      commercial hurdle: AI-factory operators must be persuaded to choose DriveNets' Ethernet
      fabric over Nvidia's proprietary InfiniBand. The resulting sales motion likely requires
      technical benchmarking, interoperability validation, and procurement confidence before
      production rollout. A named production AI customer, measured utilization outcome, and
      renewal or expansion record are therefore the most important missing customer proofs.
    claimRefs: [CU007, CU008, CU014]
