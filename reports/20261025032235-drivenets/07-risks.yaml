  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["AI-fabric deployment fails to meet performance or reliability requirements at scale", Medium, Critical, "Architecture and reference-architecture evidence; limited independent production validation", High, "Obtain acceptance tests, incident data, and customer SLO performance."]
      - ["Multivendor integration or hardware supply issue delays deployment", Medium, High, "Open architecture and solution-engineering process are evidenced", "Medium-High", "Map approved hardware, second-source coverage, lead times, and failure substitutions."]
      - ["Configuration, telemetry, or automation defect causes service disruption", Medium, High, "DNOS containers, microservices, and telemetry are described", "Medium-High", "Review change control, rollback, observability, and post-incident records."]
      - ["Security vulnerability or breach creates customer, regulatory, or reputational loss", Unknown, Critical, "No DriveNets-specific control or incident evidence in assigned pool", High, "Request SOC 2/ISO evidence, vulnerability disclosure process, and breach register."]
    notes: "Likelihood and residual exposure are qualitative risk assessments anchored to the assigned evidence; no source establishes that any listed failure has occurred."
    claimRefs: [CR001, CR006, CR007, CR009, CR011, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["AI accelerator and NIC compatibility", "AMD, Broadcom, NVIDIA and other silicon ecosystems", "A key vendor changes interfaces, priorities, or commercial terms", High, "FSE/ESE are described as multivendor; AMD strategic participation", "Medium-High"]
      - ["White-box and ODM supply", "DriveNets and selected ODMs", "Component shortage or qualification issue blocks an accepted deployment", High, "Customers can source hardware independently according to company materials", "Medium-High"]
      - ["Strategic customer concentration", "AT&T and other tier-1 operators", "A major customer delays renewal, expansion, or reference use", High, "Carrier production history and named operator references", High]
      - ["Specialist deployment and support talent", "Solution engineering, support, partners", "Hiring, travel, or field execution limits implementation throughput", Medium, "Role includes deployment, training, troubleshooting, and customer work", "Medium-High"]
    notes: "The assigned evidence identifies ecosystem and implementation dependencies but does not disclose customer concentration, supplier shares, renewal rates, or staffing capacity."
    claimRefs: [CR002, CR011, CR012, CR013, CR014, CR015]
