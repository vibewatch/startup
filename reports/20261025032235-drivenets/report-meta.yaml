  topStrengths:
    - Production carrier deployments provide credible reference evidence, including AT&T and Comcast.
    - The disaggregated architecture and AI-fabric strategy align with open, multi-vendor infrastructure demand.
    - A $410 million Series D and reported cash-flow positivity indicate substantial strategic and investor support.
  topRisks:
    - Revenue, gross margin, retention, backlog conversion, and preference terms are not publicly disclosed.
    - The reported $8.5 billion valuation is disputed or unconfirmed and lacks a disclosed operating denominator.
    - AI-fabric expansion increases execution, inventory, ecosystem, and customer-concentration risk.
  unresolvedGaps:
    - Revenue by segment, gross margin, and backlog-conversion timing are not publicly disclosed.
    - Top-customer concentration, renewals, and expansion economics remain private.
    - Named production AI customer breadth beyond WhiteFiber is still thin in public evidence.
    - Preference stack, dilution history, and current balance-sheet detail are not publicly available.
