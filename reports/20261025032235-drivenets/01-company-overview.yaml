company:
  name: DriveNets
chapter:
  number: 1
  title: Company Overview
  summary: DriveNets is a Ra'anana-based private networking-software company founded in 2015 by Ido Susan and Hillel Kobrinsky. Current evidence supports a cloud-native, disaggregated networking model and a June 2026 $410 million Series D, but reported valuation figures conflict and private-company scale, revenue, margins, and governance remain incompletely disclosed.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      DriveNets is consistently described in the assigned evidence as an Israeli
      business-software company headquartered in Ra'anana and founded in 2015 by
      Ido Susan and Hillel Kobrinsky. Its core Network Cloud product separates
      networking software from standard white-box hardware, using a cloud-native
      architecture for communications service providers and cloud operators.
      The company-issued solution description says the platform provides shared
      compute and networking infrastructure, supports services from core to edge,
      and separates its control and data planes. The same material describes DNOS
      as containerized, distributed networking software and DNOR as the
      orchestration layer. The assigned evidence also indicates a later Network Cloud-AI
      direction for Ethernet-based AI fabrics. These are product and company
      descriptions, not independent proof of performance, cost savings, or
      customer-wide deployment.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-dependence
    title: Founders, leadership, and key-person dependence
    body: >-
      Public profiles identify Susan as co-founder and CEO and Kobrinsky as
      co-founder and chief strategy officer. The founders' prior exits are part
      of the company's external narrative: the assigned AIWiki profile says
      Susan previously co-founded Intucell, acquired by Cisco for $475 million,
      while Kobrinsky founded Interwise, acquired by AT&T for $121 million.
      Startup Nation Central's profile also lists CFO Mike Lilo, CMO Inbar
      Lasser-Raab, and VP R&D Tali Izhar, providing evidence of functional
      coverage beyond the founders. No assigned source supplies a board roster,
      ownership register, executive tenure history, succession plan, or a
      verified leadership change during the current refresh period. The
      combination of founder-led positioning and missing governance detail makes
      founder dependence a diligence item rather than a quantified conclusion.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and disclosed scale
    body: >-
      The current financing evidence agrees that DriveNets completed a $410
      million Series D in June 2026, with
      Bessemer Venture Partners and Atreides Management leading and AMD, Red Dot
      Capital Partners, Pitango, and D1 Capital Partners participating or being
      named as investors. Valuation evidence is not fully aligned: Calcalist and
      Startup Nation Central report $8.5 billion, 650 Group states $8 billion,
      and Reuters says the company did not disclose the round valuation. Current
      sources place total primary capital at approximately $1 billion, while the
      2025 AT&T transaction is described as a $650
      million secondary purchase from existing holders rather than primary
      company financing. Public scale indicators conflict: assigned profiles
      range from roughly 350 to 643 employees, and one profile reports 201–500
      employees. The company-related sources state cash-flow positivity and
      more than $1 billion in orders or project backlog, but these are not
      audited revenue, ARR, margin, or cash-available disclosures. Valuation
      therefore has a clear financing-event anchor but neither a fully consistent
      reported figure nor a public operating denominator.
    claimRefs: [CO004, CO009, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones, strategic relationships, and unresolved diligence
    body: >-
      The evidence supports a milestone arc from the 2015 founding, through
      early financing and the September 2020 AT&T core-network deployment, to
      the 2023 Network Cloud-AI announcement, the 2025 AT&T secondary
      transaction, and the 2026 Series D. The company-issued product material
      quotes an AT&T network-services executive saying more than 50% of AT&T
      traffic was running on an open disaggregated architecture where the
      network operating system was DriveNets; this is customer-attributed and
      should not be treated as independently audited market share. The 650
      Group article describes the strategic logic of AMD reference designs and
      heterogeneous AI infrastructure, while the assigned sources do not
      independently establish broad customer counts, current revenue, gross
      margin, or the full investor/control structure. The practical company
      overview is consequently positive on product identity and financing
      momentum, but conditional on verifying commercial conversion, customer
      concentration, governance, and the distinction between backlog and
      recognized revenue.
    claimRefs: [CO003, CO014, CO015, CO016]
    figureRefs: [FO001]
