callouts:
  - calloutType: strength
    title: Strategic product identity is clear
    body: "The retained evidence consistently identifies DriveNets as a cloud-native, disaggregated networking-software vendor serving carrier and AI-infrastructure use cases."
    claimRefs: [CO001, CO002, CO003]
  - calloutType: risk
    title: Valuation lacks a public operating denominator
    body: "The June 2026 valuation is reported as $8.5B by two sources and $8B by another, while Reuters says DriveNets did not disclose it; assigned evidence also lacks revenue, ARR, gross margin, or a verified cash balance."
    claimRefs: [CO004, CO010, CO013]
  - calloutType: assumption
    title: Backlog is not revenue
    body: "Company-related sources mention more than $1B in orders or project backlog, but the assigned evidence does not establish recognized revenue, timing, margin, or conversion."
    claimRefs: [CO012, CO013]
