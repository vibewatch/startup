evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete current board, executive-tenure, ownership, and succession record.
    whyItMatters: Founder dependence and investor control cannot be assessed reliably without governance and cap-table evidence.
    diligencePath: >-
      Request the current cap table, board minutes or roster, executive biographies, and succession or key-person
      coverage from management.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-verified employee count with a date, geography, and inclusion rule.
    whyItMatters: Conflicting headcount estimates affect scale, operating leverage, and comparisons with the valuation.
    diligencePath: Obtain a dated HR headcount schedule split by function and geography, reconciled to payroll or audited financials.
    relatedQuestionRefs:
      - QO005
      - QO008
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Revenue, ARR or contracted recurring revenue, gross margin, cash balance, and backlog-conversion schedule.
    whyItMatters: >-
      The $8.5 billion valuation and cash-flow-positive claim cannot be judged without a denominator and
      quality-of-revenue evidence.
    diligencePath: >-
      Request monthly management accounts, revenue-recognition policy, ARR bridge, gross-margin schedule, bank
      statements, and signed-backlog aging.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: The complete investor, lender, strategic-partner, and customer concentration map.
    whyItMatters: >-
      The retained stakeholder list does not establish control rights, dilution, preference seniority, or commercial
      concentration.
    diligencePath: >-
      Obtain the fully diluted cap table, financing documents, debt schedule, major-customer list, and material
      partnership agreements.
    relatedQuestionRefs:
      - QO004
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-evidence
    missingEvidence: >-
      A direct, independent current-year record covering litigation, regulatory actions, outages, sanctions, or material
      leadership churn.
    whyItMatters: >-
      The assigned pool does not provide a strong adverse primary source, so the absence of a recorded event is not
      proof that none exists.
    diligencePath: >-
      Run a legal, regulatory, sanctions, incident, and executive-departure search against authoritative registries and
      company disclosures.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      A segment-specific market model with common geography, period, spend boundary, customer population and
      independently documented methodology.
    whyItMatters: >-
      Without a consistent denominator, capacity, traffic, hardware, software and services can be mixed into a
      misleading TAM or SOM.
    diligencePath: >-
      Obtain management's bottom-up model and reconcile it to independent carrier-routing and AI-fabric spending data by
      segment.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion
    missingEvidence: >-
      Segment revenue, pricing, gross margin, win rates, sales-cycle duration, backlog conversion and customer
      concentration.
    whyItMatters: >-
      Production deployments and capacity demand do not establish how much value DriveNets captures or how repeatable
      the sales motion is.
    diligencePath: >-
      Review audited financials, contracts, pipeline cohorts, renewal data and deployment-level contribution margins
      under confidentiality.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: ai-adoption
    missingEvidence: Independent production benchmarks and named customer references across multiple AI-fabric deployments.
    whyItMatters: >-
      Company claims and competitor-authored technical context do not independently establish broad commercial adoption
      or comparative performance.
    diligencePath: >-
      Obtain customer-approved references and reproduce workload-specific benchmarks with disclosed cluster, topology
      and failure conditions.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Competitor-specific list prices, realized contract prices, software license metrics, discounts, and support terms.
    whyItMatters: >-
      Without buyer-level economics, the claimed openness and scaling benefits cannot be translated into switching ROI
      or competitive win probability.
    diligencePath: >-
      Obtain anonymized DriveNets and competitor proposals, including hardware, software, support, implementation, and
      renewal line items.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competition
    missingEvidence: >-
      Comparable win/loss data, production deployment counts, reference customers, and independently measured
      performance for Nvidia, Cisco, Juniper, Nokia, and Arista.
    whyItMatters: >-
      The landscape can identify alternatives but cannot yet distinguish market share, buyer preference, or durable
      product superiority.
    diligencePath: >-
      Request a competitor win/loss cohort, named reference calls, deployment-size distribution, and independently
      reproducible benchmark results.
    relatedQuestionRefs:
      - QP003
      - QP005
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Audited or management revenue by product, customer cohort, geography, and recurring-versus-services mix.
    whyItMatters: >-
      Without a revenue denominator, backlog and valuation cannot be translated into growth, quality, or
      revenue-multiple underwriting.
    diligencePath: >-
      Request monthly management accounts, revenue-recognition policy, ARR bridge, bookings, backlog aging, and customer
      concentration under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Cash balance, monthly burn, runway, debt, covenants, inventory commitments, and working-capital schedule.
    whyItMatters: >-
      A financing round and cash-flow-positive claim do not establish current liquidity or the cash burden of inventory
      expansion.
    diligencePath: Request the latest balance sheet, 24-month cash forecast, debt schedule, purchase commitments, and financing plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Realized pricing, CAC, payback, renewal, expansion, support cost, and gross-margin evidence by product.
    whyItMatters: >-
      These inputs determine whether the infrastructure model produces durable software-like economics or remains
      capital-intensive systems delivery.
    diligencePath: >-
      Request anonymized customer cohorts, ACV and discount bands, implementation hours, support burden, and product
      gross-margin reporting.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: AI-fabric
    missingEvidence: >-
      Independent customer references showing production AI-fabric deployments, workload mix, utilization, and realized
      cost or throughput outcomes.
    whyItMatters: >-
      AI-fabric expansion is central to the product thesis, but current public proof is mainly company-led positioning
      and reported benchmarks.
    diligencePath: >-
      Obtain reference calls, deployment acceptance reports, workload definitions, and before-and-after utilization data
      from at least two production AI customers.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      DriveNets-specific security certifications, penetration-test scope, vulnerability disclosures, and incident
      history.
    whyItMatters: >-
      TIP requirements describe a useful control baseline but do not prove that DriveNets implements or certifies every
      control.
    diligencePath: >-
      Request current SOC 2 or ISO reports, penetration-test summaries, secure-development evidence, and customer
      incident metrics under NDA.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Hardware compatibility matrix, software release policy, service-level commitments, failure recovery metrics, and
      support escalation data.
    whyItMatters: >-
      A disaggregated architecture can increase vendor choice while also increasing integration and operational
      coordination risk.
    diligencePath: >-
      Review supported bill-of-materials, release notes, mean-time-to-repair data, field failure records, and
      representative support contracts.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rates, contract duration distribution, and customer cohorts split by
      telecom and AI products.
    whyItMatters: >-
      Without cohort retention, public deployment wins cannot establish durable recurring economics or distinguish
      expansion from one-time infrastructure projects.
    diligencePath: >-
      Obtain board-approved cohort schedules and reconcile them to contract, billing, and revenue records for the last
      eight quarters.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-one, top-five, and top-ten customer shares of revenue, ARR, backlog, receivables, and gross profit, including
      AT&T and Comcast.
    whyItMatters: >-
      Deep strategic deployments may create renewal strength while also exposing DriveNets to procurement leverage,
      deployment timing, and account-specific volatility.
    diligencePath: >-
      Review anonymized account concentration schedules, cancellation rights, acceptance milestones, and sensitivity to
      a one-year delay by each top customer.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete customer roster with deployment stage, geography, product, contract start, renewal status, and measured
      outcome for each named account.
    whyItMatters: >-
      Publicly named examples cannot establish the breadth, production mix, or geographic distribution of the
      approximately 100 customers reported by secondary sources.
    diligencePath: >-
      Reconcile management's customer roster to signed contracts and obtain permissioned reference calls across telecom,
      cable, cloud, and AI-infrastructure cohorts.
    relatedQuestionRefs:
      - QU001
      - QU002
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: ai-customer-adoption
    missingEvidence: >-
      A named production AI-fabric customer with accepted deployment scale, measured GPU utilization or job-completion
      outcome, repeat order, and renewal or expansion evidence.
    whyItMatters: >-
      Company-described trials and proofs of concept do not establish production conversion, referenceability, realized
      economics, or durability in the AI segment.
    diligencePath: >-
      Request a customer-authorized reference, acceptance certificate, benchmark methodology, production telemetry
      summary, invoices, and subsequent capacity order.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, gross margin, backlog conversion, working capital, and cash-flow reconciliation for the reported
      orders.
    whyItMatters: >-
      Reported orders and cash-flow-positive status cannot establish durable economics or liquidity without denominators
      and reconciliation.
    diligencePath: >-
      Request monthly management accounts, backlog aging, contract acceptance milestones, gross-margin bridge, cash
      forecast, and customer payment history.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: missing-source
    severity: material
    topic: legal-security
    missingEvidence: >-
      DriveNets-specific litigation, enforcement, incident, certification, privacy, export-control, and
      vulnerability-response records.
    whyItMatters: The absence of an assigned record is not proof that legal or security exposure is absent.
    diligencePath: >-
      Obtain counsel letter, litigation docket search, current certifications, security attestations, incident register,
      vulnerability disclosure process, and export-control policy.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Complete customer, supplier, ODM, chip, partner, renewal, and deployment population with concentration percentages
      and contract status.
    whyItMatters: Named references do not quantify dependency or show whether one account or partner can impair the investment case.
    diligencePath: >-
      Request customer and supplier concentration schedules, renewal cohorts, partner revenue attribution, deployment
      acceptance status, and single-source exception list.
    relatedQuestionRefs:
      - QR005
      - QR006
      - QR010
    relatedTableRefs:
      - TR003
  - type: access-blocked
    severity: minor
    topic: operational-controls
    missingEvidence: Independent production reliability, security, and incident metrics for AI-fabric deployments.
    whyItMatters: Architecture descriptions and job requirements show intended controls, not realized service performance.
    diligencePath: Request anonymized SLOs, outage history, postmortems, deployment acceptance tests, and customer reference calls.
    relatedQuestionRefs:
      - QR001
      - QR009
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, growth, gross margin, retention, free cash flow, and backlog-conversion schedules.
    whyItMatters: >-
      These denominators are required to select a valuation method and test whether the reported private mark supports
      an acceptable return.
    diligencePath: >-
      Obtain audited statements, monthly cohort data, backlog aging, cancellation terms, and a revenue-to-cash bridge
      from management.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Fully diluted capitalization, option pool, debt, liquidation preferences, participation rights, and prior-round
      seniority.
    whyItMatters: >-
      Headline valuation does not determine investor ownership or downside recovery when preference and dilution terms
      are unknown.
    diligencePath: >-
      Review the capitalization table, charter, financing documents, side letters, debt agreements, and pro forma
      ownership model.
    relatedQuestionRefs:
      - QV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Board-approved exit plan, public-company readiness assessment, customer concentration, and independently verified
      secondary pricing.
    whyItMatters: >-
      A strategic secondary transaction does not establish a repeatable liquidity path or a realizable return at the
      latest reported mark.
    diligencePath: >-
      Request board materials, banker feedback, IPO-readiness workstreams, shareholder transfer data, and top-customer
      concentration schedules.
    relatedQuestionRefs:
      - QV009
