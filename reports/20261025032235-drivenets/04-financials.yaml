  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or value, Public status, Quality, Diligence ask]
    rows:
      - [Network Cloud, "Cloud-native networking software on standard white-box hardware", "Not disclosed", "Production network deployments are described", "Third-party/company descriptions; revenue not disclosed", "ARR, recognized revenue, contract term, renewal and services mix"]
      - [Network Cloud-AI, "Ethernet fabric and end-to-end AI-network optimization", "Not disclosed", "Pipeline and deployments are described", "Company-claimed demand; no realized revenue denominator", "Bookings-to-revenue conversion and gross margin by product"]
      - [Hardware and inventory-linked delivery, "White-box and systems-partner delivery around software", "Not disclosed", "Financing proceeds intended partly for inventory", "Company-issued use-of-funds signal", "Inventory ownership, turns, purchase commitments and working-capital terms"]
      - [Services and deployment, "Integration, support, and technical delivery implied by enterprise deployments", "Not disclosed", "No public mix or margin disclosure", "Inference from operating model; not quantified", "Implementation attach rate, utilization, support cost and contribution margin"]
    notes: "Sources describe products and financing use, but no retained source discloses recognized revenue or mix; null-like values mean unavailable, not zero."
    claimRefs: [CI001, CI002, CI006, CI010]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Public value, Basis, Confidence, Why it matters, Diligence ask]
    rows:
      - [List price, null, "No public price list retained", "Low", "Prevents gross-to-net and contract-value analysis", "Price book by product, port, site, or cluster"]
      - [Realized price, null, "No contracts or customer invoices retained", "Low", "Determines revenue quality and discounting", "Cohort-level ACV, discounts, renewals, expansion"]
      - [Sales cycle, null, "Enterprise deployment context only", "Low", "Drives working-capital timing and CAC payback", "Stage-to-close duration and implementation milestones"]
      - [CAC/payback, null, "No acquisition-cost or contribution data retained", "Low", "Tests whether growth is economically scalable", "Fully loaded CAC, gross-margin payback, channel fees"]
    notes: "Official product descriptions and the sponsored Heavy Reading survey provide market context, not DriveNets realized pricing or unit economics."
    claimRefs: [CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Cash-flow status, "Company says cash-flow positive since 2025", "Medium", "May reduce immediate external financing dependency", "Monthly cash-flow bridge and definition of cash flow"]
      - [Secured business, "More than $1B", "Medium", "Signals demand but not recognized revenue or cash collection", "Backlog aging, cancellation terms and conversion schedule"]
      - [Employees, "643 as of March 2026", "Low-to-medium", "Proxy for operating cost and delivery capacity", "Payroll, contractor spend, allocation by product and geography"]
      - [Cash on hand and runway, null, "Unavailable", "Core liquidity and financing-risk inputs are missing", "Latest balance sheet, burn, debt, covenants and runway case"]
    notes: "The $1B figure is secured business/backlog language and the employee figure is a third-party workforce estimate; neither is a cash balance, revenue, or audited cost measure."
    claimRefs: [CI003, CI010, CI011, CI013, CI014]
