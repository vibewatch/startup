          value: null
          unit: "USD"
          detail: "Gross margin and cost allocation are not publicly disclosed."
          claimRefs: [CI015, CI016]
        - id: liquidity
          label: "Cash and runway"
          value: null
          unit: "USD / months"
          detail: "Cash balance, burn, debt and runway are not publicly disclosed."
          claimRefs: [CI012, CI013]
      edges:
        - [demand, contracts]
        - [contracts, delivery]
        - [delivery, revenue]
        - [revenue, gross-profit]
    approximationNotes: "This is an evidence map, not a quantitative forecast; unavailable values remain unavailable."
    claimRefs: [CI003, CI004, CI010, CI015, CI016]
callouts:
  - calloutType: strength
    title: Capitalized demand signal
    body: "The June 2026 financing release combines a $410M Series D with more than $1B in secured business and a stated cash-flow-positive position since 2025."
    claimRefs: [CI001, CI003]
  - calloutType: risk
    title: Missing underwriting denominator
    body: "Revenue, gross margin, cash balance, burn, backlog conversion, realized pricing, and customer concentration remain unavailable in the retained public evidence."
    claimRefs: [CI004, CI012, CI015, CI016]
  - calloutType: recommendation
    title: Request the operating bridge
    body: "Before underwriting valuation, obtain a product-level revenue bridge, backlog aging, margin waterfall, liquidity schedule, and cohort unit economics."
    claimRefs: [CI004, CI009, CI013, CI015]
