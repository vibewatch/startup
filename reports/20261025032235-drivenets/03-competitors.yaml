    rows:
      - [Multi-vendor white-box operation, "Supported by cited architecture", "Unknown in assigned sources", "Unknown in assigned sources", "Unknown in assigned sources", "DriveNets has a disclosed architectural position; peers require direct product evidence"]
      - [Ethernet AI fabric, "Disclosed AI Fabric and FSE", "Disclosed Ethernet and InfiniBand portfolio in cited comparison", "Unknown in assigned sources", "Unknown in assigned sources", "Do not infer parity or superiority from category membership"]
      - [Carrier-scale routing, "AT&T and service-provider deployment evidence", "Unknown in assigned sources", "Incumbent category only", "Unknown in assigned sources", "DriveNets has named deployment evidence; competitor details are not in this pool"]
      - [Open management and integration interfaces, "CLI, gRPC/gNMI, NETCONF/YANG and related interfaces disclosed", "Unknown in assigned sources", "Unknown in assigned sources", "Unknown in assigned sources", "Technical openness is documented only for DriveNets here"]
      - [Single-vendor accountability option, "Company says end-to-end or shared responsibility can be selected", "Unknown in assigned sources", "Unknown in assigned sources", "Unknown in assigned sources", "Operational model needs contract and SLA verification"]
      - [Independent benchmark against alternatives, "Company-reported claims exist; independent comparable benchmark unavailable", "Unknown in assigned sources", "Unknown in assigned sources", "Unknown in assigned sources", "Performance claims need test design and customer references"]
    notes: "Cells labeled Unknown mean the assigned successful prefetched sources did not establish the capability; they are not claims that the competitor lacks it."
    claimRefs: [CP005, CP006, CP007, CP013]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Price or contract model, Included capability, Discount or uncertainty, Strategic implication]
    rows:
      - [DriveNets Network Cloud, null, "NOS, disaggregated routing, orchestration, and white-box model", "Realized price and contract terms not disclosed", "Potential lower lock-in and incremental scaling, subject to integration cost"]
      - [DriveNets AI Fabric, null, "Ethernet fabric, orchestration, and multi-vendor accelerator positioning", "Realized price, software license, and hardware margin not disclosed", "Potential alternative to vertically integrated AI networking"]
      - [Nvidia InfiniBand or Spectrum-X, null, "Integrated AI-networking ecosystem", "Comparable price and discount evidence unavailable", "Integration and performance may command a premium"]
      - [Incumbent router stack, null, "Integrated support and installed-base procurement", "Competitor-specific terms unavailable", "Switching cost may favor renewal or incremental expansion"]
      - [Internal build, null, "Buyer-selected hardware, silicon, software, and operations", "Engineering and lifecycle cost unavailable", "Avoids vendor dependence but transfers execution burden to buyer"]
    notes: "Null price cells are deliberate: no assigned source provides a list price, realized contract price, license metric, or discount schedule that can be compared without invention."
    claimRefs: [CP006, CP008, CP012, CP015]
