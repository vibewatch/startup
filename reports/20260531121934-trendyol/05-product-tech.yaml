  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: platform-architecture
      missingEvidence: >-
        No official public architecture diagram, system design document, or engineering
        whitepaper from Trendyol describes the full microservice topology, data flow, or
        infrastructure configuration. The 7,000+ microservice count and TBP architecture
        are derived solely from third-party conference presentations, not first-party
        documentation.
      whyItMatters: >-
        Without a verified architecture diagram, diligence cannot fully assess single points
        of failure, infrastructure concentration risks, or whether the engineering capabilities
        claimed publicly align with the actual system.
      diligencePath: >-
        Request architecture documentation and infrastructure overview from Trendyol engineering
        leadership; ask for access to TBP dashboards and microservice dependency maps during
        technical due diligence.
      relatedQuestionRefs: [QE007, QE021]
      relatedTableRefs: [TE003]

    - type: private-evidence-only
      severity: material
      topic: ai-governance
      missingEvidence: >-
        No public AI ethics policy, hallucination-control framework, or external AI audit has
        been disclosed for Trendyol LLM (60M+ req/day) or the AI Agent Platform (500M+
        decisions/day). Model cards on HuggingFace acknowledge risks but provide no production
        safeguard SLAs.
      whyItMatters: >-
        At 500M+ autonomous decisions per day affecting inventory, pricing, and order routing,
        uncontrolled AI hallucination or bias could cause material consumer and business harm.
        AI governance disclosure is increasingly a regulatory expectation in both Turkey and the EU.
      diligencePath: >-
        Request AI governance policy, hallucination-rate benchmarks, and bias testing reports
        for all production models; ask whether EU AI Act compliance (as applicable to Turkey
        EU operations) has been assessed.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE004]

    - type: private-evidence-only
      severity: material
      topic: PCI-DSS-Trendyol-Pay
      missingEvidence: >-
        Trendyol Pay's PCI-DSS certification status has not been publicly confirmed. The
        pending fintech JV with Ant International introduces additional compliance architecture
        for payment and lending services that has not been detailed.
      whyItMatters: >-
        Payment processing for 40M+ buyers without confirmed PCI-DSS compliance is a material
        regulatory and reputational risk, particularly for EU operations subject to PSD2.
      diligencePath: >-
        Request PCI-DSS Attestation of Compliance (AoC) for Trendyol Pay from management;
        clarify BDDK regulatory approval timeline and compliance architecture for the Ant
        International JV.
      relatedQuestionRefs: [QE024, QE026]
      relatedTableRefs: [TE004]

    - type: limited-disclosure
      severity: informational
      topic: GDPR-transfer-mechanism
      missingEvidence: >-
        Trendyol has not publicly disclosed the specific GDPR transfer mechanism (Standard
        Contractual Clauses, Binding Corporate Rules, or adequacy decision) used for
        Turkey-to-EU or EU-to-Turkey personal data flows for its Germany, Netherlands,
        and Luxembourg operations.
      whyItMatters: >-
        An undisclosed or inadequate GDPR transfer mechanism exposes Trendyol's EU operations
        to regulatory enforcement action from German or EU data protection authorities.
      diligencePath: >-
        Request copies of Data Processing Agreements and SCCs in use; verify GDPR
        representative appointment for EU operations; check for any DPA correspondence or
        investigations.
      relatedQuestionRefs: [QE020]
      relatedTableRefs: [TE004]

    - type: limited-disclosure
      severity: informational
      topic: dolap-commission-seller-liquidity
      missingEvidence: >-
        No official data on post-acquisition Dolap commission changes, seller churn rates, or
        platform liquidity metrics has been published by Trendyol. Google Play reviews cite
        commission fees reportedly up to 25% but Trendyol has not issued a public response or
        disclosed seller participation trends.
      whyItMatters: >-
        If elevated commissions post-acquisition have materially reduced active supply-side
        seller participation, Dolap's GMV growth and network-effect advantages could be impaired.
      diligencePath: >-
        Request Dolap seller cohort retention data, commission rate history since the 2018
        acquisition, and active seller/listing growth metrics broken down by category.
      relatedQuestionRefs: [QE023]
      relatedTableRefs: [TE004]

  coverageAssessment: >-
    Content requirements are substantially met across all six dimensions: product suite definition
    (CE001–CE006, TE001), architecture/operating model (CE007–CE013, TE003, FE001), AI/ML
    differentiation (CE014–CE023, TE005), logistics technology (CE004–CE005, FE002, FE003),
    developer signals (CE024–CE027, SE001, SE002, SE004), and trust/compliance (CE033–CE035,
    TE004). Primary gaps are AI governance disclosure, PCI-DSS certification for Trendyol Pay,
    and GDPR transfer mechanism for EU operations — all private-evidence gaps standard for a
    company at this stage of diligence. The developer-signal source type requirement is satisfied
    by GitHub (SE001), HuggingFace (SE007), Google Play/Dolap reviews (SE014), and PlatformCon
    (SE009). All 8+ net-new sources (vs. prior chapters) requirement is met by SE001–SE015 and
    SE024–SE025. Official source type is confirmed via SE002 (developers.trendyol.com), SE012
    (trendyolexpress.com), and SE016 (corporate.trendyol.com). Technical-docs requirement is
    met by SE003 (Google Cloud case study), SE009 (PlatformCon 2025), and SE010 (Temporal
