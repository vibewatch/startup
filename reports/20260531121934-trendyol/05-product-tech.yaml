company:
  name: Trendyol
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Trendyol is a vertically integrated e-commerce super-app whose product portfolio spans a
    core marketplace (40M+ buyers, 250K+ sellers, 170M+ SKUs), a proprietary logistics arm
    (Trendyol Express, 75+ DCs, 2.5M daily deliveries), an embedded fintech wallet (Trendyol Pay),
    a secondhand C2C platform (Dolap), international storefronts (Germany, CEE, Gulf), and
    a home-built AI/ML platform anchored by a Turkish-language LLM (7 versions, 60M+ requests/day)
    and an autonomous AI Agent system (500M+ decisions/day). The engineering backbone is a
    microservice architecture of 7,000+ services across 150+ teams, operated via the Trendyol
    Builder Platform (TBP) on KubeVela, and anchored by Google Cloud BigQuery and Looker for
    near-real-time analytics. Developer openness is genuine: 175+ GitHub repositories, an
    OAuth2-based seller API at developers.trendyol.com, three open-sourced vision AI models
    on HuggingFace, and conference presentations at PlatformCon 2025 and Temporal Replay 2025
    all confirm active external engineering engagement. Compliance is governed by KVKK (Turkey)
    and GDPR (EU operations), with multi-entity data separation enforced via Looker access
    controls. Diligence priorities include: no public AI governance policy, unconfirmed PCI-DSS
    certification for Trendyol Pay, cross-border GDPR transfer mechanism disclosure, adverse
    Dolap user sentiment on commission fees, and the fintech JV (Baykar/ADQ/Ant) pending
    regulatory approval as of May 2026.

sections:
  - id: product-suite-vertical-architecture
    title: Product Suite & Vertical Architecture
    body: >-
      Trendyol Group operates six principal product verticals, unified through a shared user
      identity, Trendyol Pay wallet, and the Trendyol Express logistics backbone. The core
      marketplace — Trendyol.com — is a two-sided platform serving over 40 million active
      customers and 250,000+ sellers across 30+ product categories with a catalogue exceeding
      170 million SKUs as of 2025. The marketplace integrates proprietary advertising (Trendyol
      Ads), seller analytics tooling, and the Trendyol Express logistics rail to create a
      closed-loop commerce ecosystem.

      Trendyol Express (TEX) is the group's proprietary logistics vertical, covering all 81
      Turkish provinces through 75+ distribution centres and delivering approximately 2.5 million
      packages per day. The Istanbul flagship DC spans 72,078 m² with 120 loading docks and a
      5-storey automated warehouse completed in 2022. Trendyol Pay is an embedded digital wallet
      used across all group verticals for checkout, including instalment payment (taksit) support
      for Turkish consumers. Dolap is a standalone C2C secondhand marketplace with 1.6M+ active
      sellers and 70M+ listings across fashion, electronics, and home goods — Trendyol acquired
      Dolap to capture the resale economy. International storefronts operate in Germany (launched
      2022, targeting €3B revenue), the Gulf region (GMV ~$1B in first full year), and Central
      and Eastern European markets with a logistics hub planned in Poland. Trendyol Go, the
      quick-commerce delivery vertical, was sold to Uber for approximately $700M (85% stake,
      May 2025) and is therefore excluded from the current group product perimeter.

      The group's product strategy centres on ecosystem lock-in: sellers enter through the
      marketplace API, are served by TEX logistics, pay commissions and advertising fees, and
      are financed through Trendyol's seller credit products. Buyers are retained through
      personalized recommendations, next-day delivery guarantees, and Trendyol Pay's instalment
      options. This multi-sided integration is structurally difficult to replicate and is the
      primary source of Trendyol's 34–40% Turkish e-commerce market share.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE028, CE031, CE032]
    tableRefs: [TE001]
    figureRefs: [FE002]

  - id: platform-engineering-infrastructure
    title: Platform Engineering & Infrastructure
    body: >-
      Trendyol's engineering backbone is a microservice architecture comprising 7,000+ services
      managed across 150+ product and platform teams. To address the cognitive load this creates,
      the company built the Trendyol Builder Platform (TBP) — an Internal Developer Platform (IDP)
      powered by KubeVela and the Open Application Model (OAM), integrated with Argo Rollouts
      for progressive deployment (canary and blue-green strategies), FluxCD for GitOps-driven
      configuration, and Prometheus for observability. TBP was publicly presented at PlatformCon
      2025, where the team reported improved DORA metrics and reduced cognitive load for developers
      deploying to production. Separately, Trendyol uses Temporal — an open-source durable
      workflow orchestration engine — for long-running, fault-tolerant processes such as order
      fulfilment flows and database automation. The company's Temporal use was shared at Replay
      2025 by a Senior Software Engineer on the Internal Developer Platform Database Team.

      The data infrastructure rests on Google Cloud: Trendyol migrated from on-premises data
      warehousing to BigQuery around 2019 when peak-period scaling failures created missed revenue
      opportunities. The migration introduced Looker as the enterprise BI layer, empowering
      1,500+ employees with near-real-time self-service analytics. During the Black Friday 2023
      peak, the system processed over 260,000 Looker queries in a single day (vs. a daily average
      of 110,000). Google Cloud Consulting optimized Looker's caching mechanism, improving data
      refresh times by 38%. Access controls are enforced via Looker's role-based policies to
      prevent cross-entity data leakage across Trendyol's group companies, a legal requirement
      under Turkish regulatory frameworks.

      The core technology stack includes Go for CDC systems and Kafka wrappers, Kotlin for JVM
      back-end services and Android development, TypeScript for the frontend (including the Baklava
      design system), and Python for ML/AI workloads. Persistence layers span PostgreSQL, Couchbase,
      and Redis; Elasticsearch handles search indexing. This is a mature, polyglot stack consistent
      with large-scale global marketplace operators.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE024, CE034, CE035]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: ai-machine-learning-recommendation
    title: AI, Machine Learning & Recommendation Engine
    body: >-
      Trendyol's AI platform is a material competitive asset and the most technically documented
      dimension of the business. The company's Large Language Model (Trendyol LLM) was first
      publicly showcased at the February 2024 World Governments Summit in Dubai — the only Turkish
      company represented in the AI panel alongside Jensen Huang (NVIDIA CEO), Werner Vogels (Amazon
      CTO), and Yann LeCun (Meta). The original model was built on Meta's LLaMA2 architecture using
      a corpus of approximately 10 billion tokens for Turkish-language specialization and 180,000
      curated question-answer pairs for instruction tuning. As of February 2026, the LLM has reached
      version 7, with the current production variant being Trendyol-LLM-Asure-12B — a 12-billion-
      parameter multimodal model built on Gemma 3-12B, optimized for Turkish and English e-commerce
      tasks including summarization, question-answering, structured extraction, and controlled
      generation. The model is published as open-source on HuggingFace. At scale, the LLM handles
      60+ million requests per day, enabling multi-language product description generation for
      international sellers and real-time customer inquiry translation.

      Trendyol's AI Agent Platform (Trendyol AI Agent) extends beyond LLM use cases into autonomous
      system management. As of the February 2026 AI/ML Summit, the platform generated over 500 million
      automated predictions and decisions daily across recommendation systems, search, and ML
      infrastructure management. Over a 6-month period ending February 2026, more than 4,000 software
      engineering tasks were autonomously developed and deployed to live production by AI agents —
      accelerating software delivery 9×. Applied outcomes: product listing speed for international
      sellers improved 60% through AI-based matching algorithms; logistics process efficiency improved
      20%. These figures were stated by CTO Cenk Çivici at the AI/ML Summit and reported via
      Anadolu Ajansı (official Turkish state news agency).

      For catalogue management and visual search, Trendyol open-sourced three production AI vision
      models on HuggingFace in August 2025: (1) DinoV2 Image Similarity — for visual product matching
      and recommendations; (2) E-Commerce Product Image Encoder (ConvNeXt architecture) — for
      catalogue de-duplication and search relevancy; (3) Background Removal (IS-Net architecture) —
      for automatic product photo background removal. These models were developed by Trendyol's Data
      Science team led by Dr. Tolga Ahmet Kalaycı and are deployed in live production environments
      processing millions of daily transactions. For personalization and ranking, Trendyol employs
      Two-Tower neural architectures combining user and product embeddings, and hybrid ranking systems
      blending statistical scoring, sentiment analysis, and deep learning.
    claimRefs: [CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE023, CE036, CE037]
    tableRefs: [TE005]
    figureRefs: []

  - id: logistics-technology-trendyol-express
    title: Logistics Technology — Trendyol Express
    body: >-
      Trendyol Express (TEX) is the group's proprietary last-mile logistics arm and one of the
      most operationally differentiated assets in the Turkish e-commerce landscape. TEX covers
      all 81 Turkish provinces through a network of 75+ distribution centres and handles
      approximately 2.5 million package deliveries daily. This logistics density is functionally
      impossible to replicate quickly and has become a key structural moat against competitors
      whose delivery speeds are constrained by third-party carrier dependency.

      The Istanbul flagship facility, completed in 2022, spans 72,078 m² and was designed with
      Building Information Modelling (BIM) from the earliest planning stages to optimize the
      integration of automation systems with physical structure. The facility includes two principal
      volumes: a distribution centre with 120 loading docks capable of handling 150 trucks
      simultaneously, and an integrated 5-storey automated warehouse. TEX serves over 1,800 staff
      at this single facility. Technology integration at the facility level spans an AI-driven
      Warehouse Management System (WMS) for optimized picking, packing, and barcode-based QC;
      AI-powered route optimization reducing per-delivery time; and near-real-time operational
      data fed into the group's BigQuery analytics platform via Kafka event streaming.

      Commercially, TEX charges sellers a desi-based per-parcel fee schedule: 77.54 TL for 0–2
      desi parcels, rising to approximately 192.81 TL for 11–15 desi parcels (2026 published
      rates). TEX's dual role — as internal logistics for Trendyol marketplace orders and as a
      potential logistics-as-a-service for third parties — creates both synergies and disclosure
      ambiguity: internal TEX cost versus revenue is not separately disclosed. As of May 2026,
      same-day delivery is available in major Turkish cities and TEX provides next-day delivery
      guarantees for most of Turkey. The international logistics buildout includes a planned
      65,000+ m² European fulfillment centre to serve Germany and CEE markets.
    claimRefs: [CE004, CE005]
    tableRefs: []
    figureRefs: [FE003]

  - id: developer-surface-integrations-external-signals
    title: Developer Surface, Integrations & External Signals
    body: >-
      Trendyol's external developer surface is one of the stronger signals of technical maturity
      among emerging-market marketplace operators. The developer portal at developers.trendyol.com
      provides comprehensive API documentation in both Turkish and English for the Seller Integration
      API, which uses OAuth2 (Client ID / Client Secret) for authentication and exposes RESTful
      endpoints for product listing and update, stock and price management, order fetching and
      status updates, shipment label generation, return processing, invoice submission, and customer
      query management. The API enables sellers to connect ERPs, CRMs, and third-party commerce
      tools to Trendyol programmatically, with Postman collections and rate-limit documentation
      available. This positions Trendyol's marketplace as a platform accessible to mid-market
      and enterprise sellers via integration partners rather than solely through the UI panel.

      On GitHub, the Trendyol organization (github.com/Trendyol) hosts 175+ repositories with
      active maintenance and public contributions. Key open-source projects include: Baklava
      (design system in TypeScript, ~1.4k stars, 136 contributors), Medusa (Android fragment
      stack controller in Kotlin, 495 stars, 59 contributors), android-guidelines (architecture
      and coding standards, 435 stars, 33 contributors), kink (Kubernetes KinD cluster management
      CLI in Go, 382 stars, 29 contributors), and Stove (JVM end-to-end testing framework in
      Kotlin, ~309 stars, 21 contributors). This open-source portfolio demonstrates active
      engineering community engagement across backend, mobile, DevOps, and frontend disciplines.
      The Trendyol Tech landing page (trendyol.github.io) documents engineering culture
      emphasizing TDD, CI/CD, pair programming, and continuous learning.

      Conference presentations further evidence engineering maturity: TBP was presented at
      PlatformCon 2025 (KubeVela/OAM IDP talk), Temporal workflow orchestration at Temporal
      Replay 2025, and the AI/ML Summit at Trendyol Campus in February 2026 reached industry
      engineers through Anadolu Ajansı coverage. Trendyol's AI models are published and
      downloadable on HuggingFace (Trendyol organization), providing quantifiable developer
      adoption signals. The engineering team numbers approximately 2,000+ engineers as of 2026,
      per CTO Cenk Çivici's public statements.
    claimRefs: [CE024, CE025, CE026, CE027, CE033, CE036]
    tableRefs: []
    figureRefs: []

  - id: trust-security-privacy-compliance
    title: Trust, Security, Privacy & Compliance
    body: >-
      Trendyol's compliance architecture spans Turkish domestic law (KVKK), EU data protection
      (GDPR) for European operations, and Turkish e-commerce-specific regulations from the Turkish
      Competition Authority (TCA). Under KVKK (Law No. 6698 and its 2025 amendments), Trendyol
      is registered as a data controller in the VERBIS registry maintained by the Personal Data
      Protection Authority (KVKK Board). The 2025 KVKK amendments tighten cross-border data
      transfer rules, introducing a tiered mechanism (adequacy decisions, standard contractual
      clauses, and exceptional transfers), which creates incremental compliance obligations for
      Trendyol's EU-facing data flows. For German and EU operations, GDPR compliance is required;
      Trendyol publishes a data protection notice but has not publicly disclosed the specific
      cross-border transfer mechanism used for EU→Turkey data handling.

      Multi-entity data isolation is enforced via Looker's role-based access policies within
      Google Cloud, preventing group companies (marketplace, Dolap, international entities) from
      accessing each other's data on the shared BigQuery platform — a requirement highlighted
      publicly by Trendyol's BI team. The group maintains a public KVKK/GDPR data protection
      page at trendyol.com/s/kisisel-verilerin-korunmasi covering data categories, legal bases,
      and data subject rights.

      TCA obligations from the 2025 self-preferencing investigation commitments require Trendyol
      to maintain data portability for sellers, including the ability to export their analytics
      and customer interaction data — a structural concession that modestly reduces seller
      switching costs and is a legal constraint on the data moat. Trendyol Pay's PCI-DSS
      compliance posture has not been publicly confirmed; the fintech JV with Ant International
      (pending regulatory approval as of May 2026) will introduce additional Central Bank of
      Turkey (BDDK) and regulatory requirements for the combined payment and lending platform.

      Adverse signal: Dolap user reviews on Google Play (May 2026) indicate sustained seller
      dissatisfaction with commission fees reaching up to approximately 25% combined with elevated
      shipping costs. This represents a product quality risk: supply-side liquidity on Dolap
      depends on sellers finding economics viable, and the adverse sentiment trend post-Trendyol
      acquisition is a monitored risk. No major public data breach affecting Trendyol Group has
      been reported as of the report date.
    claimRefs: [CE029, CE033, CE034, CE035]
    tableRefs: [TE002, TE004]
    figureRefs: [FE004]

