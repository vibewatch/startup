figures:
  - id: FE001
    title: Product Architecture Map — Trendyol Technology Stack
    type: stack
    summary: >-
      Six-layer technology stack reconstructed from public developer conference presentations,
      Google Cloud case study, GitHub repository analysis, and HuggingFace model cards. No
      official architecture diagram published; layers represent best-available public inference.
    data:
      layers:
        - label: "Consumer Layer"
          detail: >-
            Buyer app (iOS/Android, 40M+ customers); Seller Panel and Seller App; Dolap app
            (iOS/Android, 1.6M+ active sellers); International web storefronts (Germany, CEE, Gulf);
            Baklava design system (TypeScript, ~1.4k GitHub stars) for UI/UX consistency.
        - label: "API & Integration Layer"
          detail: >-
            Seller Integration API (OAuth2 REST, developers.trendyol.com) — product, stock, order,
            invoice, shipment endpoints; internal gRPC service mesh across 7,000+ microservices;
            authentication and rate-limiting gateway.
        - label: "Core Microservices (7,000+ services, 150+ teams)"
          detail: >-
            Catalogue service; Order management; Payment / Trendyol Pay; User and identity;
            Trendyol Express logistics orchestration; Search and discovery; Recommendation engine;
            Trendyol Ads; Dolap marketplace services. Go (CDC, Kafka wrappers), Kotlin (JVM),
            TypeScript (frontend). Progressive deployment via TBP (canary, blue-green).
        - label: "AI / ML Platform"
          detail: >-
            Trendyol LLM v7 (Asure-12B on Gemma 3-12B; 60M+ req/day; Turkish/English); AI Agent
            Platform (500M+ decisions/day; 4,000+ autonomous engineering tasks in 6 months);
            Two-Tower recommendation neural models (user × product embeddings); DinoV2 Image
            Similarity, Product Image Encoder (ConvNeXt), Background Removal (IS-Net) — all
            open-sourced on HuggingFace. Python ML stack.
        - label: "Data Platform"
          detail: >-
            Google Cloud BigQuery (data warehouse, migrated from on-premises ~2019); Looker
            (near-real-time BI, 1,500+ employee users, 260K+ peak daily queries); Apache Kafka
            (event streaming — order, logistics, catalogue events); Temporal (durable workflow
            orchestration for long-running processes). Looker caching improved 38% via GCC.
        - label: "Infrastructure Layer"
          detail: >-
            Trendyol Builder Platform (TBP) on KubeVela + OAM — manages 7,000+ microservice
            deployments; Argo Rollouts (progressive delivery); FluxCD (GitOps); Prometheus
            (observability); Docker/Kubernetes. Persistence: PostgreSQL, Couchbase, Redis cache,
            Elasticsearch (170M+ SKU search index).
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE017, CE018, CE024, CE025]

  - id: FE002
    title: Customer Workflow / Operating Flow — From Listing to Delivery
    type: flow
    summary: >-
      End-to-end flow of a Trendyol marketplace transaction from seller listing through
      AI enrichment, buyer discovery, checkout, logistics dispatch, and feedback capture.
      All nodes represent production flows documented via official and corroborated sources.
    data:
      nodes:
        - label: "Seller creates listing (panel or API)"
          detail: >-
            Seller uploads via Seller Panel UI or via OAuth2 REST API (developers.trendyol.com);
            fields: title, description, barcode, category, price, stock quantity. API supports
            bulk upload and webhook-style polling for order status.
        - label: "AI enrichment pipeline"
          detail: >-
            Trendyol LLM generates multi-language product descriptions; E-Commerce Product Image
            Encoder (ConvNeXt) de-duplicates against catalogue; Background Removal (IS-Net) cleans
            product photo; AI-based category matching assigns taxonomy. 60% faster international
            listing via AI matching.
        - label: "Search index & ML ranking"
          detail: >-
            Listing indexed in Elasticsearch; Two-Tower neural model scores product-user affinity
            (product embeddings × user embeddings); hybrid ranking blends statistical scoring,
            sentiment data, and neural relevance signals.
        - label: "Buyer discovers via personalized feed / search"
          detail: >-
            Buyer opens Trendyol app; Two-Tower recommendation engine serves personalized results;
            visual search (DinoV2 Image Similarity) allows image-based product discovery; 170M+
            SKU catalogue available across 30+ categories.
        - label: "Order placed — Trendyol Pay processes payment"
          detail: >-
            Checkout via Trendyol Pay (embedded wallet); instalment (taksit) options for Turkish
            buyers; order event emitted to Kafka; order management microservice triggers fulfilment
            workflow via Temporal.
        - label: "Trendyol Express DC assignment and dispatch"
          detail: >-
            AI routing assigns order to nearest of 75+ TEX distribution centres; WMS picks and
            packs via barcode QC; 120-dock Istanbul hub or equivalent regional hub dispatches; 2.5M
            daily deliveries across all 81 provinces.
        - label: "Last-mile delivery & buyer receipt"
          detail: >-
            Same-day in major cities; next-day standard; courier scan events stream via Kafka to
            near-real-time Looker dashboards for operations teams. 20% efficiency gain from AI
            route optimization (company-stated).
        - label: "Post-purchase: review, sentiment analysis, model retraining"
          detail: >-
            Buyer submits rating/review; AI sentiment analysis ingests structured feedback; signals
            feed back into recommendation ranking and seller quality score; Looker analytics capture
            conversion, margin, and campaign-performance metrics for sellers and ops teams.
      edges:
        - from: "Seller creates listing (panel or API)"
          to: "AI enrichment pipeline"
          label: "Listing submission triggers AI enrichment"
        - from: "AI enrichment pipeline"
          to: "Search index & ML ranking"
          label: "Enriched listing indexed and ranked"
        - from: "Search index & ML ranking"
          to: "Buyer discovers via personalized feed / search"
          label: "Ranked results served to buyer"
        - from: "Buyer discovers via personalized feed / search"
          to: "Order placed — Trendyol Pay processes payment"
          label: "Buyer selects and checks out"
        - from: "Order placed — Trendyol Pay processes payment"
          to: "Trendyol Express DC assignment and dispatch"
          label: "Order event triggers TEX fulfilment workflow"
        - from: "Trendyol Express DC assignment and dispatch"
          to: "Last-mile delivery & buyer receipt"
          label: "Package dispatched from DC"
        - from: "Last-mile delivery & buyer receipt"
          to: "Post-purchase: review, sentiment analysis, model retraining"
          label: "Delivery confirmed; feedback loop initiated"
        - from: "Post-purchase: review, sentiment analysis, model retraining"
          to: "Search index & ML ranking"
          label: "Sentiment signals feed back into ranking model"
    claimRefs: [CE001, CE012, CE017, CE021, CE022, CE023, CE027, CE037]

