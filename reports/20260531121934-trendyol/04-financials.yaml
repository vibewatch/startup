  - id: FI002
    title: Unit Economics Bridge — Transaction-Level P&L Proxy
    type: flow
    layout: standard
    summary: >-
      Illustrative flow of how a Trendyol marketplace transaction converts from gross selling price
      to estimated contribution margin; all margins are estimated ranges, not disclosed figures.
    data:
      nodes:
        - label: "Gross Selling Price (100%)"
          detail: >-
            Consumer-facing price collected at point of sale. TRY-denominated; USD
            equivalent affected by lira depreciation. No returned/cancelled order adjustment shown.
          tone: neutral
        - label: "Marketplace Commission Retained (est. 12–16%)"
          detail: >-
            Trendyol retains commission at transaction close; rate varies 5–28% by category.
            Realized rate after volume discounts and promotional programs is not disclosed.
          tone: neutral
        - label: "Logistics Cost Absorbed (est. 5–10% of selling price)"
          detail: >-
            Free consumer delivery means Trendyol absorbs or subsidises last-mile; seller-paid
            TEX fee partially offsets this. Labor = 50–60% of last-mile logistics cost per
            industry benchmarks. International routes are significantly more expensive.
          tone: neutral
        - label: "Platform OpEx Overhead (marketing, technology, G&A)"
          detail: >-
            Includes seller acquisition costs, campaign subsidies, technology infrastructure,
            international market entry costs, and G&A. Not disaggregated publicly. International
            expansion substantially increases this layer and is the primary group loss driver.
          tone: negative
        - label: "Estimated Contribution (Turkey domestic: low positive; international: negative)"
          detail: >-
            Turkey domestic reached operational profitability in 2023 per company claim and
            Alibaba FY2025 confirmation. International markets (Gulf, Europe) are investment-phase
            and contribute negatively at segment level per AIDC loss widening data. No numeric
            margin confirmed for any individual market.
          tone: neutral
      edges:
        - from: "Gross Selling Price (100%)"
          to: "Marketplace Commission Retained (est. 12–16%)"
          label: "Revenue retained by Trendyol"
        - from: "Marketplace Commission Retained (est. 12–16%)"
          to: "Logistics Cost Absorbed (est. 5–10% of selling price)"
          label: "Logistics cost deducted"
        - from: "Logistics Cost Absorbed (est. 5–10% of selling price)"
          to: "Platform OpEx Overhead (marketing, technology, G&A)"
          label: "Platform overhead deducted"
        - from: "Platform OpEx Overhead (marketing, technology, G&A)"
          to: "Estimated Contribution (Turkey domestic: low positive; international: negative)"
          label: "Net contribution margin"
    approximationNotes: >-
      All margin estimates are inferred from Hepsiburada benchmarks, published logistics rates, and
      Alibaba AIDC disclosures. International market margins inferred as negative from widening AIDC
      segment loss despite Turkey domestic improvement. Trendyol's actual transaction-level economics
      are private and may differ materially.
    claimRefs: [CI008, CI009, CI011, CI015, CI016, CI030, CI031, CI032, CI034, CI042]

