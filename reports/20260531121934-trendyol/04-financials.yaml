company:
  name: Trendyol
chapter:
  number: 4
  title: Financials
  summary: >-
    Trendyol's revenue model is marketplace-commission-led (5–28% by category), layered with
    Trendyol Express logistics fees, Trendyol Ads, and an embedded payments wallet. The company
    does not publish standalone financials, but Alibaba's AIDC FY2025 annual disclosure confirms
    Trendyol is a material driver of the segment's 33% revenue growth and that domestic Turkish
    operations reached operational profitability in 2023. Cross-border and European investments
    widened the AIDC segment loss to USD 2.09B in FY2025 (vs. USD 1.1B in FY2024). The $16.5B
    valuation dates from August 2021; no public equity raise has closed as of May 2026. Capital
    demands are real: a $2B Gulf commitment, ongoing CEE logistics buildout, and a new fintech JV
    with Baykar, ADQ, and Ant International all represent deployment priorities without confirmed
    revenue returns.

sections:
  - id: revenue-streams-monetization
    title: Revenue Streams & Monetization Model
    body: >-
      Trendyol operates a hybrid revenue model anchored on a marketplace take rate, augmented by
      logistics revenue, advertising, and nascent fintech services. The core revenue stream is the
      category commission charged to third-party sellers: rates range from 5% to 28% depending on
      category, with apparel at approximately 21.5%, accessories at 21.5–22.5%, electronics at 5–28%
      (phones ~7%, accessories up to 28%), cosmetics at 15–18%, and supermarket products at 12–20%
      as of 2025. In addition to the percentage commission, sellers pay a fixed per-order platform
      service fee of approximately ₺8.49 plus VAT per order. Since Trendyol does not publish a
      blended take rate or standalone revenue figure, the implied GMV-to-revenue conversion must be
      estimated: applying a 12–16% blended commission to the 2024 GMV of approximately $12.5 billion
      implies marketplace revenue in the $1.5–2.0 billion range — but this is an estimate, not a
      disclosed figure, and realized rates after volume discounts and new-seller programs may differ
      materially.

      Beyond the commission layer, Trendyol Express charges sellers desi-based logistics fees — 77.54 TL
      for 0–2 desi, rising to approximately 192.81 TL for 11–15 desi packages as of 2026 — and
      functions as a logistics service provider whose revenue is embedded within the group but not
      separately disclosed. Trendyol Ads provides sponsored search, banner placements, and campaign
      management tools to sellers and brands; this is a high-margin incremental stream that scales
      with seller count and GMV, consistent with Alibaba's and Amazon's advertising economics, but
      no revenue figure is disclosed. Trendyol Pay is an embedded digital wallet across all group
      verticals that drives ecosystem stickiness and reduces payment processing costs; its monetization
      model is under development.

      Alibaba's AIDC fiscal year 2025 annual results (year ending March 31, 2025) represent the only
      primary-tier public financial disclosure capturing Trendyol. They confirm that AIDC's
      international commerce retail segment generated RMB 108,465 million (approximately USD 14.9
      billion) in FY2025, up 33% year-over-year, "primarily driven by the increase in revenue
      contributed by AliExpress and Trendyol." This figure cannot isolate Trendyol's standalone
      contribution and cannot be used as a Trendyol-only revenue proxy.

      In July 2025, Trendyol Group, Baykar, Abu Dhabi's ADQ, and Ant International signed an MoU to
      establish a next-generation fintech platform in Turkey offering digital payments, SME and retail
      loans, deposits, investment products, and insurance — pending regulatory approval. This JV
      represents a future revenue stream with no current financial contribution and uncertain
      capitalization terms.
    claimRefs: [CI001, CI002, CI003, CI007, CI018, CI019, CI020, CI032]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: unit-economics-cost-structure
    title: Unit Economics, Cost Structure & Margin Visibility
    body: >-
      Trendyol's gross margin structure is opaque given its private status. The closest public proxy
      is Hepsiburada (NASDAQ: HEPS), which discloses IAS-29 inflation-adjusted financials. Hepsiburada
      reported a gross contribution margin of approximately 12.4% on GMV in Q3 2024 and an IAS-29
      unadjusted EBITDA margin of 2.2% of GMV — a meaningful recovery from negative 7.2% in 2022.
      Trendyol's Turkey domestic operation achieved operational profitability in 2023, suggesting a
      comparable or superior unit economics trajectory, supported by its roughly 5× GMV scale
      advantage relative to Hepsiburada that provides substantial operational leverage on fixed costs.

      Trendyol's cost structure is dominated by three drivers: logistics (Trendyol Express
      infrastructure with 75 distribution centres and 2.5 million daily deliveries), technology
      (AI investment, proprietary LLM, platform infrastructure), and seller-acquisition and
      marketing subsidies (free delivery programs, campaign incentives). Last-mile delivery
      represents approximately 53% of total e-commerce logistics costs, with labor accounting for
      50–60% of last-mile expenses per industry benchmark data. Trendyol's proprietary Express
      model gives it greater cost control than third-party logistics users but concentrates capital
      intensity.

      Seller payment timing (7–28 days by category after order completion) creates a structural
      working capital float: Trendyol collects consumer payments immediately but remits to sellers
      up to four weeks later. At 2.5 million daily deliveries and an average basket estimated in
      the low tens of USD, this float is material — representing a genuine economic advantage not
      captured in GMV or revenue metrics.

      International expansion significantly compresses unit economics. Trendyol's cross-border
      and European operations have been characterised by analysts as "costly with unproven long-term
      ROI," consistent with the widening AIDC segment loss from USD 1.1B in FY2024 to USD 2.09B in
      FY2025 — which Alibaba explicitly attributes to "investments in AliExpress and Trendyol's
      cross-border businesses." Building warehousing, fulfilment, and brand awareness in Germany,
      Romania, and the Gulf from scratch is structurally more expensive than the Turkey domestic
      operation that benefited from an established brand and logistics network.
    claimRefs: [CI008, CI009, CI011, CI015, CI016, CI017, CI030, CI031, CI032, CI033, CI034, CI036, CI042]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: capital-structure-adequacy
    title: Capital Structure, Adequacy & Financing Dependency
    body: >-
      Trendyol's last publicly disclosed valuation is $16.5 billion from the August 2021 round,
      which raised $1.5 billion co-led by General Atlantic, SoftBank Vision Fund 2, and Gulf
      sovereign wealth funds. Total capital raised across all disclosed rounds is approximately
      $2.65 billion, with Alibaba holding approximately 70% of the company. The round-by-round
      funding chronology is documented in the Company Overview chapter; this chapter focuses on
      current capital adequacy.

      Cash on hand and monthly burn rate are not disclosed. Key signals on capital adequacy are:
      (1) Bloomberg reported in November 2024 that Trendyol was informally exploring a ~$1 billion
      fundraise; no transaction was confirmed by May 2026, suggesting either valuation expectations
      diverge from investor offers or Alibaba backstop is sufficient; (2) the Gulf investment
      commitment of approximately $2 billion over three years from late 2024 implies continued
      large capital deployment; (3) the Uber acquisition of 85% of Trendyol Go for $700 million
      in May 2025 — confirmed by Uber's SEC 8-K — provided a capital event at the Trendyol Go
      entity level, with allocation to the parent group not publicly disclosed.

      Given no new equity raise since 2021 and continued investment in international expansion,
      Trendyol is plausibly funded by some combination of Turkey operating cash flow, Alibaba
      intercompany support, and remaining reserves from the 2021 round. The Alibaba relationship
      creates Trendyol-specific financing dependency: intercompany terms, if any, are undisclosed
      and represent a material transfer-pricing risk for standalone investors. Trendyol's IPO
      remains conditional on reaching 50% international revenue share — currently approximately
      20% — making the earliest realistic IPO window post-2028 on current growth trajectories.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI026, CI035, CI038]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: public-traction-metrics-gaps
    title: GMV, Public Traction & Private-Metric Gaps
    body: >-
      Trendyol's most reliably corroborated public traction metric is GMV: approximately $12.5
      billion in FY2024 (up ~30–35% year-over-year) and exceeding $14 billion in FY2025. Order
      volume grew approximately 47% in 2024 and surpassed 1 billion orders in 2023. The platform
      serves 40 million customers (company-stated) across 250,000+ sellers. Gulf GMV of $1 billion
      in the first full year of Gulf operations and Trendyol Go's $2 billion in gross bookings
      pre-Uber sale are company-communicated figures consistent with the platform's operational scale.

      Revenue, gross margin, EBITDA, net income, cash flow from operations, capital expenditure,
      and segment-level unit economics at any granularity are all private. The Alibaba AIDC
      disclosure is the sole public primary-tier financial window; it bundles Trendyol with
      AliExpress, Lazada, and others, preventing disaggregation of Trendyol's standalone contribution.
      An investor assessing Trendyol as a standalone asset has no access to audited financial
      statements, management accounts, or debt/credit-facility terms.

      Turkish lira depreciation creates comparability risk. Hepsiburada applies IAS 29 inflation
      accounting, restating historical figures in current price units; Trendyol's GMV figures are
      primarily stated in USD but denominated in TRY, which depreciated approximately 50–60%
      cumulatively against the dollar in 2021–2024. Real GMV growth in constant-currency terms is
      likely lower than USD-stated figures suggest — a material consideration for underwriting models.

      Export momentum is notable: Trendyol targeted $2 billion in export GMV for 2024 and $10
      billion by 2026 via 300,000 seller micro-exporters. Turkey's e-commerce exports grew from
      $2.2 billion in 2022 to $6.4 billion in 2024. However, cross-border exports typically carry
      lower effective take rates than domestic transactions, due to international logistics costs,
      customs considerations, and currency conversion friction.
    claimRefs: [CI004, CI005, CI006, CI013, CI027, CI028, CI029, CI036, CI037, CI038, CI040]
    tableRefs: [TI005]
    figureRefs: [FI003]

  - id: financial-verdict
    title: Financial Verdict — Revenue Quality, Margin Path & Diligence Blockers
    body: >-
      Trendyol's financial thesis is strategically coherent but substantially unverified. Revenue
      quality is underpinned by a high-frequency, recurring transaction model: commissions on
      250,000+ sellers' transactions, logistics fees per parcel, and an advertising overlay that
      scales with GMV. The seller payment float creates cash generation not visible in headline
      metrics. Turkey domestic operational profitability since 2023 is the most important verified
      financial milestone, corroborated by Alibaba's AIDC FY2025 disclosure.

      The margin path risk is material. Cross-border and European expansion is consuming capital
      at a rate that widened the AIDC segment loss nearly 2× in FY2025. The unit economics of the
      Gulf, Germany, Romania, and other international markets remain unproven at sustainable scale.
      The fintech JV with Baykar, ADQ, and Ant International is pre-revenue and adds execution
      risk at a time when Trendyol is already juggling multiple simultaneous international
      investment-phase commitments. Capital intensity risk is the most underappreciated dimension:
      the $2 billion Gulf commitment, CEE logistics buildout, and forthcoming fintech infrastructure
      represent concurrent pre-profitability deployments that must be funded from Turkey operating
      cash flow, Alibaba intercompany support, or new equity — none of which is publicly confirmed
      at adequate scale.

      The blocking diligence items are: (1) audited standalone financial statements for Trendyol
      Group for at least three fiscal years; (2) segment-level EBITDA by market (Turkey, Gulf,
      Europe, other); (3) confirmed Alibaba intercompany transfer-pricing and service agreement
      terms; (4) current cap table with minority stake percentages and any secondary transaction
      prices since 2021; (5) detailed unit economics for at least one non-Turkey market on a
      path to profitability. Without these, Trendyol cannot be underwritten as a standalone asset
      and must be assessed as an embedded Alibaba AIDC exposure with Turkish e-commerce growth as
      the primary value driver.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI034, CI035, CI037, CI038, CI043]
    tableRefs: []
    figureRefs: []

