            Approximately $12.5B GMV in FY2024; corroborated by analyst estimates and Alibaba
            AIDC growth signals; not audited. Stated in USD; underlying transactions in TRY.
          tone: neutral
        - label: "Marketplace commission revenue (est. 12–16% blended take)"
          value: 1625
          type: increase
