            Estimated at midpoint of 12–16% blended take rate applied to domestic GMV; range is
            $1.5B–2.0B. Includes category commissions and per-order platform fees. Not disclosed.
          tone: neutral
        - label: "Trendyol Express logistics fee revenue (est.)"
