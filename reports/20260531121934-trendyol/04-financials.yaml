            fulfilment — cost vs. revenue split unknown.
          tone: neutral
        - label: "Trendyol Ads revenue (est.)"
          value: 150
          type: increase
          detail: >-
            Estimated high-margin advertising revenue consistent with ~1–2% of GMV at comparable
            marketplace scale (Amazon, Alibaba domestic patterns); no disclosed figure exists.
          tone: neutral
        - label: "Total estimated gross revenue (illustrative, excl. COGS and logistics cost)"
          value: 1975
          type: subtotal
          detail: >-
            Illustrative sum of commission + logistics fee + advertising estimates. Does not deduct
            seller subsidies, campaign discounts, return processing costs, or international losses.
            All values estimated; material uncertainty applies.
          tone: neutral
    approximationNotes: >-
      All values except the $12.5B GMV base are estimates derived from published commission rates,
      logistics fee schedules, and industry advertising benchmarks. Trendyol does not disclose revenue
      by stream. USD millions. Realized take rate, discount impact, and international market mix may
