callouts:
  - calloutType: risk
    title: "AIDC Segment Loss Nearly Doubled to $2.09B in FY2025 Despite Turkey Domestic Improvement"
    body: >-
      Alibaba's FY2025 annual press release (BusinessWire, May 2025) confirms that the AIDC
      adjusted EBITA loss widened from USD 1.1B in FY2024 to USD 2.09B in FY2025, explicitly
      attributed to "investments in AliExpress and Trendyol's cross-border businesses." While
      Trendyol's domestic Turkish profitability improved, international expansion is a significant
      and growing financial drag that any investor must underwrite as a separate risk from the
      Turkey domestic business.
    claimRefs: [CI008, CI009]

  - calloutType: insight
    title: "No Audited Standalone Financials — AIDC Disclosure Is the Only Primary-Tier Public Window"
    body: >-
      Trendyol has never published standalone audited financial statements. The only primary-tier
      public disclosure is bundled within Alibaba's consolidated AIDC segment results, which
      aggregate Trendyol, AliExpress, Lazada, and other businesses. An investor cannot independently
      reconstruct Trendyol's revenue, margins, or cash position without management-provided accounts.
      This is the single most important constraint on any independent financial assessment of the company.
    claimRefs: [CI003, CI038]

  - calloutType: strength
    title: "Turkey Domestic Operational Profitability — Corroborated by Alibaba Filing"
    body: >-
      Trendyol's achievement of operational profitability in Turkey in 2023 is the most important
      verified financial milestone, corroborated by Alibaba's FY2025 AIDC disclosure explicitly
      noting "improvements in profitability of Trendyol's domestic businesses." Combined with
      Hepsiburada's publicly disclosed 2.2% EBITDA/GMV demonstrating the achievable economics
      of Turkish marketplace scale, this milestone validates that the core domestic revenue
      architecture works at scale. The international replication question remains open.
    claimRefs: [CI009, CI011, CI030, CI031]

