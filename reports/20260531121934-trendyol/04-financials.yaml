        Without audited financials, investors cannot confirm the take rate, revenue mix, margin
        structure, or cash position; all financial estimates carry wide uncertainty bands and the
        entire underwriting model rests on unverified assumptions.
      diligencePath: >-
        Request audited IFRS financial statements for DSM Grup Danışmanlık İletişim ve Satış
        Ticaret A.Ş. for at least three fiscal years directly from Trendyol management; seek any
        available Alibaba AIDC sub-segment disclosures in Alibaba annual 20-F SEC filings.
