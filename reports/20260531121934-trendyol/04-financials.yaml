  - id: FI004
    title: Capital Intensity & Cash-Flow Map
    type: flow
    layout: standard
    summary: >-
      Structural map of Trendyol's capital sources and deployment across domestic operations,
      international expansion, and the planned fintech JV; all flows are inferred from public
      announcements, not confirmed financial statements.
    data:
      nodes:
        - label: "Turkey domestic marketplace (cash generator since 2023)"
          detail: >-
            Achieved operational profitability in Turkey in 2023; confirmed via Alibaba FY2025
            AIDC disclosure. Primary source of internally generated cash for the group. Scale
            (~$12.5B FY2024 GMV) provides operating leverage. The sole confirmed profitable segment.
          tone: positive
        - label: "Alibaba AIDC (majority shareholder ~70%)"
          detail: >-
            Strategic capital access and potential intercompany support; exact terms undisclosed.
            Alibaba's AIDC FY2025 segment loss (USD 2.09B) reflects investments in Trendyol and
            AliExpress cross-border. Intercompany funding, if any, is not disclosed.
          tone: neutral
        - label: "Gulf expansion ($2B committed over 3 years from late 2024)"
          detail: >-
            Marketing, logistics, technology investments across all 6 GCC countries; Saudi Arabia
            is second-largest market globally. Gulf GMV exceeded $1B in year one. None of the
            Gulf markets are confirmed profitable as of May 2026.
          tone: negative
        - label: "CEE logistics buildout (Germany, Romania, Czech Republic, Greece, Hungary)"
          detail: >-
            Bucharest warehouse under construction; Germany as EU gateway. Costly pre-profitability
            investments with unproven long-term ROI per analyst assessment. Investment amounts undisclosed.
          tone: negative
        - label: "Fintech JV (Trendyol / Baykar / ADQ / Ant International, pending approval)"
          detail: >-
            MoU signed July 2025; digital payments, SME loans, insurance, investment products
