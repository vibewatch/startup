      - number: '5.2'
        title: Platform Engineering & Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Trendyol's engineering backbone is a microservice architecture comprising 7,000+ services managed across
              150+ product and platform teams. To address the cognitive load this creates, the company built the
              Trendyol Builder Platform (TBP) — an Internal Developer Platform (IDP) powered by KubeVela and the Open
              Application Model (OAM), integrated with Argo Rollouts for progressive deployment (canary and blue-green
              strategies), FluxCD for GitOps-driven configuration, and Prometheus for observability. TBP was publicly
              presented at PlatformCon 2025, where the team reported improved DORA metrics and reduced cognitive load
              for developers deploying to production. Separately, Trendyol uses Temporal — an open-source durable
              workflow orchestration engine — for long-running, fault-tolerant processes such as order fulfilment flows
              and database automation. The company's Temporal use was shared at Replay 2025 by a Senior Software
              Engineer on the Internal Developer Platform Database Team.

              The data infrastructure rests on Google Cloud: Trendyol migrated from on-premises data warehousing to
              BigQuery around 2019 when peak-period scaling failures created missed revenue opportunities. The migration
              introduced Looker as the enterprise BI layer, empowering 1,500+ employees with near-real-time self-service
              analytics. During the Black Friday 2023 peak, the system processed over 260,000 Looker queries in a single
              day (vs. a daily average of 110,000). Google Cloud Consulting optimized Looker's caching mechanism,
              improving data refresh times by 38%. Access controls are enforced via Looker's role-based policies to
              prevent cross-entity data leakage across Trendyol's group companies, a legal requirement under Turkish
              regulatory frameworks.

              The core technology stack includes Go for CDC systems and Kafka wrappers, Kotlin for JVM back-end services
              and Android development, TypeScript for the frontend (including the Baklava design system), and Python for
              ML/AI workloads. Persistence layers span PostgreSQL, Couchbase, and Redis; Elasticsearch handles search
              indexing. This is a mature, polyglot stack consistent with large-scale global marketplace operators.
