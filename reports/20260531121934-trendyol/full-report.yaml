      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Turkey's e-commerce buyer base is mobile-first, marketplace-native, price-sensitive, and increasingly
              concentrated in the 25–44 age band. TurkStat's 2025 survey reports 55.7% of the population aged 16–74
              purchased goods or services online (up from 51.7% in 2024), with women aged 25–34 as the modal Turkish
              e-commerce shopper. Despite 90.9% internet penetration, the 55.7% online-shopping rate leaves meaningful
              headroom compared to Europe's approximately 73% penetration, implying continued double-digit growth in
              active buyer count through 2026–2028 without requiring new technology adoption. Budget ownership in Turkey
              is individual or household rather than institutional (unlike enterprise SaaS); the payment stack relies
              heavily on credit card installment plans (taksit), BNPL, and the Trendyol Pay wallet for financing large
              purchases. Q1 2026 Cloudflare Radar telemetry confirms that 56% of Turkish HTTP traffic is mobile, making
              app experience the primary purchase surface. The seller-side buyer (SMEs using Trendyol's marketplace) is
              an important second buyer class—170,000+ active sellers pay listing fees, advertising spend, and
              fulfillment costs. Cross-border buyers in the Gulf represent a higher-income, fashion-forward segment with
              4+ million active users on Trendyol's Gulf marketplace, attracted by Turkish fashion's price-quality
              positioning and proximity logistics advantages. The consumer adoption path follows: mobile discovery
              (social/app) → comparison and review on Trendyol → installment payment or wallet checkout → next-day or
              scheduled delivery → repeat purchase via loyalty and notification. Delivery dissatisfaction is the primary
              churn trigger; TurkStat found 29% of online shoppers reported problems, with slow delivery cited most
              often.
            claimRefs:
              - CM005
              - CM006
