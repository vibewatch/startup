      - number: '5.3'
        title: AI, Machine Learning & Recommendation Engine
        blocks:
          - type: paragraph
            body: >-
              Trendyol's AI platform is a material competitive asset and the most technically documented dimension of
              the business. The company's Large Language Model (Trendyol LLM) was first publicly showcased at the
              February 2024 World Governments Summit in Dubai — the only Turkish company represented in the AI panel
              alongside Jensen Huang (NVIDIA CEO), Werner Vogels (Amazon CTO), and Yann LeCun (Meta). The original model
              was built on Meta's LLaMA2 architecture using a corpus of approximately 10 billion tokens for
              Turkish-language specialization and 180,000 curated question-answer pairs for instruction tuning. As of
              February 2026, the LLM has reached version 7, with the current production variant being
              Trendyol-LLM-Asure-12B — a 12-billion- parameter multimodal model built on Gemma 3-12B, optimized for
              Turkish and English e-commerce tasks including summarization, question-answering, structured extraction,
              and controlled generation. The model is published as open-source on HuggingFace. At scale, the LLM handles
              60+ million requests per day, enabling multi-language product description generation for international
              sellers and real-time customer inquiry translation.

              Trendyol's AI Agent Platform (Trendyol AI Agent) extends beyond LLM use cases into autonomous system
              management. As of the February 2026 AI/ML Summit, the platform generated over 500 million automated
              predictions and decisions daily across recommendation systems, search, and ML infrastructure management.
              Over a 6-month period ending February 2026, more than 4,000 software engineering tasks were autonomously
              developed and deployed to live production by AI agents — accelerating software delivery 9×. Applied
              outcomes: product listing speed for international sellers improved 60% through AI-based matching
              algorithms; logistics process efficiency improved 20%. These figures were stated by CTO Cenk Çivici at the
              AI/ML Summit and reported via Anadolu Ajansı (official Turkish state news agency).

              For catalogue management and visual search, Trendyol open-sourced three production AI vision models on
              HuggingFace in August 2025: (1) DinoV2 Image Similarity — for visual product matching and recommendations;
              (2) E-Commerce Product Image Encoder (ConvNeXt architecture) — for catalogue de-duplication and search
              relevancy; (3) Background Removal (IS-Net architecture) — for automatic product photo background removal.
              These models were developed by Trendyol's Data Science team led by Dr. Tolga Ahmet Kalaycı and are
              deployed in live production environments processing millions of daily transactions. For personalization
              and ranking, Trendyol employs Two-Tower neural architectures combining user and product embeddings, and
              hybrid ranking systems blending statistical scoring, sentiment analysis, and deep learning.
