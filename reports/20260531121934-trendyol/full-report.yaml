      - number: '6.5'
        title: Retention Proxies, Expansion Loops & Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Trendyol's retention model is built on ecosystem integration rather than a standalone loyalty programme.
              The combination of Trendyol Express (same/next-day delivery), Trendyol Pay (embedded wallet with
              instalment support), personalised AI recommendations, and the breadth of 170M+ SKUs creates compounding
              switching costs: a user embedded in three or more Trendyol products faces the cost of replacing five
              simultaneous habits. The clearest published retention proxy is Romania: 47% of Romanian customers placed
              multiple orders in 2024 — a strong signal for a platform launched in CEE only in early 2024. No equivalent
              cohort data is disclosed for Turkey or Gulf segments.

              The NPS of 34 and 82% loyalty rate (Comparably, 2026) are indicative but methodologically weak:
              Comparably's NPS is a voluntary opt-in survey and its "loyalty" metric definition is not publicly
              disclosed. No NRR, GRR, churn rate, or retention cohort data has been published by Trendyol or Alibaba for
              any customer segment. This is a material diligence gap.

              Expansion is primarily geographic (Gulf, CEE, Germany) and ecosystem-vertical (TrendyolMilla private label
              recovery, TrendFinance embedded banking, Dolap secondhand). The IPO-trigger metric — 50% international
              revenue — implies Trendyol must roughly double its international revenue share from ~20% today. Gulf GMV
              crossing $1 billion in 2024 and CEE reaching 2.2M buyers by end-2024 indicate that the trajectory is
              positive, but the speed remains uncertain.

              Concentration risk is material at two levels. First, geographic: Turkey accounts for approximately 80% of
              total GMV, exposing the business to Turkish lira volatility, domestic inflation, and Turkish regulatory
              actions (see antitrust chapter). Second, within international markets, Saudi Arabia drives approximately
              75% of Gulf orders, meaning the Gulf segment is itself highly concentrated. Fashion — the
              highest-return-rate category — represents 31% of Turkey GMV and disproportionately drives customer
              complaints in international markets where return logistics infrastructure is immature.
