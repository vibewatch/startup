      - number: '7.5'
        title: Alibaba Parent Dependency & Geopolitical Overhang
        blocks:
          - type: paragraph
            body: >-
              Alibaba's approximately 70% ownership of Trendyol creates structural dependency and geopolitical risk that
              is distinct from operational execution. Technology dependency is direct: Trendyol's logistics
              optimization, AI-driven personalization, LLM infrastructure (Turkey's first proprietary large language
              model developed with Alibaba's chip and ML stack), and payment backbone leverage AIDC/Alibaba platforms.
              Should Alibaba face Western sanctions, technology-transfer restrictions, or a strategic refocusing away
              from international commerce, Trendyol would need to rebuild or acquire these capabilities independently —
              a multi-year and multi-billion-dollar undertaking. Geopolitical risk is institutionally relevant: Western
              institutional investors (EU/US pension funds, sovereign wealth funds) increasingly apply scrutiny to
              Chinese-owned technology platforms in emerging markets. In Gulf markets, where Trendyol is expanding with
              sovereign wealth fund backing (ADQ, QIA), any deterioration of China's diplomatic standing in the region
              could create commercial friction. Transfer-pricing arrangements, intercompany IP licensing, and
              capital-return mechanisms between Trendyol and Alibaba are not publicly disclosed, creating governance
              opacity for minority shareholders. The partial divestiture of Trendyol Go to Uber in May 2025 (85% for
              $700 million) demonstrates Alibaba's willingness to restructure the group, but also raises the question of
              which assets could be carved out or reprioritized in future strategic pivots. Any scenario in which
              Alibaba seeks to reduce its stake below 50% through an IPO or secondary sale could create board-control
              transition risk without adequate governance protocols for the transition period.
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Live TCA Scrutiny and December 2025 Seller-Complaint Inquiry Is Not a Clean Bill of Health
            body: >-
              The TCA's December 2025 assessment of nine public seller complaints — while declining a full new
              investigation — explicitly acknowledged Trendyol's dominant position and competitive impact. This is not
              an exoneration; it is a documented baseline that lowers the threshold for a future full investigation. Any
              recurrence of algorithmic favoritism, pricing coercion, or data misuse would very likely cross into
              investigation territory given the established evidentiary framework. Investors should treat TCA compliance
              as a recurring operating expense, not a resolved historical matter.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: 'No Standalone Audited Financials: The Single Most Important Diligence Constraint'
            body: >-
              Trendyol has never published standalone audited financial statements. The AIDC segment loss of $2.09
              billion in FY2025 is the only primary public financial signal, and it aggregates Trendyol with AliExpress
              and Lazada. Any investment decision at scale without NDA-protected management accounts and a Big 4
              standalone audit is an informed bet on the business model, not a verified financial diligence exercise.
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
              - CR017
          - type: callout
            title: Gulf Investment Commitment Runs Ahead of Proven Unit Economics
            body: >-
              The $2 billion Gulf investment commitment was announced in late 2024 against a backdrop of only one full
              year of Gulf operations ($1B Gulf GMV, Saudi Arabia at 75%). The unit economics of cross-border
              fulfillment, local warehousing, and Arabic-language customer service have not been independently verified.
              A $2B capital deployment at this stage of market development is a high-conviction strategic bet that must
              be underwritten as such — not as a validated operational plan.
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR028
          - type: callout
            title: Turkey Domestic Operational Profitability Is the Value-Preservation Floor
            body: >-
              Amid the risk landscape, Turkey domestic operational profitability since 2023 — corroborated by Alibaba's
              FY2025 AIDC disclosure — is the critical value-preservation anchor. If international expansion
              underperforms, Trendyol's domestic Turkish business (34–40% market share, operationally profitable, 40M+
              customers) represents a defensible asset base that could sustain a standalone valuation significantly
              above zero. This does not eliminate cross-border and capital-market risks, but it provides a meaningful
              downside floor.
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Financing History
        blocks:
          - type: paragraph
            body: >-
              Trendyol's last external valuation mark is $16.5 billion, established in August 2021 when the company
              raised $1.5 billion in a Series C round co-led by General Atlantic, SoftBank Vision Fund 2, ADQ (Abu Dhabi
              Developmental Holding Company), and Qatar Investment Authority (QIA), with Princeville Capital also
              participating. Alibaba, which acquired an approximately 70% controlling stake in 2018, was not part of the
              2021 round but retained its controlling interest. The 2021 round was executed at the peak of a global
              growth-equity re-rating cycle characterised by zero-rate monetary policy and record EM e-commerce
              multiples — conditions that have materially reversed by 2026. In November 2024 Bloomberg reported that
              Trendyol was exploring a roughly $1 billion raise that would imply an unchanged or slightly lower
              valuation; as of May 2026, no closing has been confirmed. The absence of a new round means the $16.5
              billion mark is a stale reference point, now nearly five years old. Trendyol has not published standalone
              audited financial statements; the primary public financial window is Alibaba's AIDC (Alibaba International
              Digital Commerce) segment, which bundles Trendyol with AliExpress and Lazada. AIDC recorded a loss of
              approximately $2.09 billion in FY2025. However, Alibaba's Q4 FY2026 AIDC results show the segment loss
              narrowing by approximately 96% year-on-year to RMB 138 million (near-breakeven), signalling improving unit
              economics. TrendyolGo, the quick-commerce subsidiary, was divested to Uber in May 2025 for approximately
              $700 million (85% stake, implying a ~$824 million total entity value for that arm). FX context is
              material: USD/TRY has depreciated to the 50–52 range as of early 2026, compressing dollar-denominated
              metrics even as lira-denominated GMV grows nominally.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV032
      - number: '8.2'
        title: Comparable Company Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              The most relevant publicly traded comparables for Trendyol are Hepsiburada (HEPS), Coupang (CPNG), Sea
              Limited / Shopee (SE), and MercadoLibre (MELI), covering the spectrum from direct Turkish peer to EM
              multi-category marketplace. As of May 2026, Hepsiburada trades at approximately $809 million enterprise
              value, implying an EV/Revenue of roughly 0.47x and EV/GMV of roughly 0.16x on FY2025 GMV of approximately
              TRY 257.5 billion (~$5 billion at current USD/TRY). Hepsiburada is the only direct listed peer but is
              significantly smaller and less internationalised, making it a downside-anchor comparable rather than a
              central case. Coupang trades at an EV of approximately $29–38 billion on FY2025 revenue of approximately
              $35.1 billion, implying an EV/Revenue of roughly 0.82x; its superior logistics infrastructure and Korean
              market dominance justify a modest premium to Hepsiburada. Sea Limited's e-commerce segment (Shopee)
              delivered Q1 2026 GMV of $9.3 billion (annualised ~$37 billion) and trade at an e-commerce EV/Revenue of
              approximately 1.2x, warranted by consistent profitability recovery. MercadoLibre commands a premium at
              2.3–3.2x EV/Revenue, reflecting its fintech integration (Mercado Pago) and dominant LatAm network effects;
              it represents a long-term bull trajectory for Trendyol if SuperApp ambitions fully materialise. The peer
              median EV/Revenue is approximately 1.0x. Applying 0.8–1.2x to Trendyol's estimated revenue of $1.8–2.5
              billion yields an implied enterprise value of $1.4–3.0 billion — well below the $16.5 billion mark. Even a
              generous 3x EV/Revenue MELI-comparable premium yields $5.4–7.5 billion. The 2021 mark implied EV/Revenue
              of 6.6–9.2x on current revenue estimates; current EM e-commerce multiples have compressed 40–60% from 2021
              peaks according to multiple data providers.
