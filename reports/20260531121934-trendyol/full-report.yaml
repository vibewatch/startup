      - number: '7.4'
        title: Cross-Border, IPO & Strategic Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Trendyol's international expansion — 27+ European countries since 2020 and the Gulf since August 2023 — is
              the primary strategic thesis but also the primary execution risk. Gulf GMV crossed $1 billion in the first
              full year of Gulf operations (end-2024), with Saudi Arabia representing approximately 75% of regional
              orders. However, a $2 billion Gulf investment commitment announced in late 2024 is a capital-intensive bet
              ahead of proven local unit economics: fulfillment infrastructure buildout, Arabic-language localization,
              local regulatory compliance, and competition from Amazon, Noon, and local champions (Jarir, Namshi) all
              create sustained negative carry. Cross-border regulatory risk is material: Saudi e-commerce regulations on
              data residency, product standards, and digital payments evolve rapidly, and Turkey's February 2026
              abolishment of duty-free thresholds (benefiting domestic Turkey GMV) has no equivalent in GCC markets
              where Trendyol is the entrant, not the incumbent. IPO execution risk is acute: the stated pre-condition of
              50% international revenue is approximately 20–30 percentage points away from the ~20% international share
              reported in 2025, and no IPO timeline has been publicly committed. Financial investors from the 2021 round
              (General Atlantic, SoftBank Vision Fund 2, Princeville Capital, ADQ, QIA) face growing time-to-exit
              pressure as the IPO timeline remains open-ended. A forced secondary transaction or down-round fundraise at
              a valuation materially below $16.5 billion would impair investor returns and reputational positioning.
              Key-person execution risk is elevated: Demet Mutlu (founder-CEO) and Çağlayan Çetin (Group President,
              international strategy) have no announced successors and their departures would materially disrupt
              investor confidence and operational continuity.
