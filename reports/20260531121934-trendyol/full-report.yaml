  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters & Product Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Trendyol (legal entity: DSM Grup Danışmanlık İletişim ve Satış Ticaret A.Ş.) is headquartered in Istanbul,
              Turkey, and operates as Turkey's largest multi-category e-commerce marketplace. Founded in 2010, the
              platform began as a fashion-focused online retailer and evolved into a full-stack superapp combining
              marketplace retail, proprietary logistics, instant delivery, digital payments, and secondhand commerce.
              Its core product is the Trendyol marketplace, where over 250,000 sellers offer goods across fashion,
              electronics, home goods, FMCG, and beauty — with fashion accounting for roughly 31% of total GMV. The
              marketplace is supported by Trendyol Express, an own-logistics arm handling 2.5 million package deliveries
              per day across 35 countries, and Trendyol Pay, an embedded digital wallet layered across all verticals.
              Trendyol Go provided food and grocery delivery through 19,000 couriers and 90,000 restaurant and grocery
              partners, but an 85% stake was sold to Uber in May 2025. Dolap, a secondhand fashion marketplace hosting
              1.4 million individual sellers, rounds out the ecosystem. Following Turkish e-commerce law amendments
              effective January 2024, Trendyol's private-label (PL) brands were separated into a standalone app and
              website called TrendyolMilla. The company holds an estimated 34–40% share of Turkey's total e-commerce
              market and is part of Alibaba International Digital Commerce Group (AIDC). International revenue
              represents approximately 20% of total business as of 2025, with the Gulf and Europe as the primary growth
              corridors. Trendyol operates in all six GCC countries and 27+ European countries, with Saudi Arabia as its
              second-largest market globally.
