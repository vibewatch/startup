      - number: '8.4'
        title: Investment Thesis, Kill Triggers, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              At the $16.5 billion last mark, Trendyol does not present a risk-adjusted entry point for new investors in
              May 2026. The implied multiples (EV/Revenue 6.6–9.2x) are 5–8x the current EM e-commerce peer median, the
              last mark is nearly five years stale, and the company carries a 30-percentage-point gap to its own IPO
              pre-condition. The absence of standalone audited financials makes independent financial verification
              impossible. Accordingly, the overall recommendation is Hold/Watch, with a threshold for re-entry at a
              meaningfully reset valuation — specifically, a new primary round priced at $5–9 billion range or lower.
              The core bull thesis — Turkey's dominant e-commerce platform with real Gulf optionality — remains
              structurally intact; the question is price, not business quality. The kill triggers that would cause a
              thesis break are: (1) a fundraise that reaffirms the $16.5B mark without credible international revenue
              progress, implying continued overvaluation; (2) Alibaba de-prioritising AIDC capital allocation causing a
              liquidity gap in Gulf operations; (3) TCA regulatory escalation that structurally impairs the algorithmic
              advantage; and (4) international revenue still below 25% by end of 2027. Legal infrastructure for a
              Turkish IPO is established under CMB regulations and Capital Markets Law, but a domestic listing is
              unlikely at current valuations given Turkey's equity market depth constraints. A dual-listing (Borsa
              Istanbul + an international exchange) remains the likeliest path if IPO conditions are met.
            claimRefs:
