  - id: FE002
    title: Customer Workflow / Operating Flow — From Listing to Delivery
    type: flow
    summary: >-
      End-to-end flow of a Trendyol marketplace transaction from seller listing through AI enrichment, buyer discovery,
      checkout, logistics dispatch, and feedback capture. All nodes represent production flows documented via official
      and corroborated sources.
    data:
      nodes:
        - label: Seller creates listing (panel or API)
          detail: >-
            Seller uploads via Seller Panel UI or via OAuth2 REST API (developers.trendyol.com); fields: title,
            description, barcode, category, price, stock quantity. API supports bulk upload and webhook-style polling
            for order status.
        - label: AI enrichment pipeline
          detail: >-
            Trendyol LLM generates multi-language product descriptions; E-Commerce Product Image Encoder (ConvNeXt)
            de-duplicates against catalogue; Background Removal (IS-Net) cleans product photo; AI-based category
            matching assigns taxonomy. 60% faster international listing via AI matching.
        - label: Search index & ML ranking
          detail: >-
            Listing indexed in Elasticsearch; Two-Tower neural model scores product-user affinity (product embeddings ×
            user embeddings); hybrid ranking blends statistical scoring, sentiment data, and neural relevance signals.
        - label: Buyer discovers via personalized feed / search
          detail: >-
            Buyer opens Trendyol app; Two-Tower recommendation engine serves personalized results; visual search (DinoV2
            Image Similarity) allows image-based product discovery; 170M+ SKU catalogue available across 30+ categories.
        - label: Order placed — Trendyol Pay processes payment
          detail: >-
            Checkout via Trendyol Pay (embedded wallet); instalment (taksit) options for Turkish buyers; order event
            emitted to Kafka; order management microservice triggers fulfilment workflow via Temporal.
        - label: Trendyol Express DC assignment and dispatch
          detail: >-
            AI routing assigns order to nearest of 75+ TEX distribution centres; WMS picks and packs via barcode QC;
            120-dock Istanbul hub or equivalent regional hub dispatches; 2.5M daily deliveries across all 81 provinces.
        - label: Last-mile delivery & buyer receipt
          detail: >-
            Same-day in major cities; next-day standard; courier scan events stream via Kafka to near-real-time Looker
            dashboards for operations teams. 20% efficiency gain from AI route optimization (company-stated).
        - label: 'Post-purchase: review, sentiment analysis, model retraining'
          detail: >-
            Buyer submits rating/review; AI sentiment analysis ingests structured feedback; signals feed back into
            recommendation ranking and seller quality score; Looker analytics capture conversion, margin, and
            campaign-performance metrics for sellers and ops teams.
      edges:
        - from: Seller creates listing (panel or API)
          to: AI enrichment pipeline
          label: Listing submission triggers AI enrichment
        - from: AI enrichment pipeline
          to: Search index & ML ranking
          label: Enriched listing indexed and ranked
        - from: Search index & ML ranking
          to: Buyer discovers via personalized feed / search
          label: Ranked results served to buyer
        - from: Buyer discovers via personalized feed / search
          to: Order placed — Trendyol Pay processes payment
          label: Buyer selects and checks out
        - from: Order placed — Trendyol Pay processes payment
          to: Trendyol Express DC assignment and dispatch
          label: Order event triggers TEX fulfilment workflow
        - from: Trendyol Express DC assignment and dispatch
          to: Last-mile delivery & buyer receipt
          label: Package dispatched from DC
        - from: Last-mile delivery & buyer receipt
          to: 'Post-purchase: review, sentiment analysis, model retraining'
          label: Delivery confirmed; feedback loop initiated
        - from: 'Post-purchase: review, sentiment analysis, model retraining'
          to: Search index & ML ranking
          label: Sentiment signals feed back into ranking model
