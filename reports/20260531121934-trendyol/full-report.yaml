      - number: '1.2'
        title: Founders, Leadership & Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Trendyol was co-founded by Demet Mutlu, Evren Üçok, and Begüm Tekin. Demet Mutlu, born 1981, graduated cum
              laude from New York University with a degree in Economics and attended Harvard Business School, which she
              left after her first year to return to Istanbul and address what she identified as a
              trust-and-distribution gap in Turkish fashion e-commerce. She bootstrapped the company with $300,000 of
              personal savings and has been recognized by Fortune magazine, the World Economic Forum's Young Global
              Leaders program, and as one of Europe's most inspiring women in technology. Mutlu is also a co-founder of
              Peak Games, subsequently acquired by Zynga for $1.8 billion. Evren Üçok, co-founder from inception, serves
              as Chairman. Begüm Tekin, the third co-founder, serves as Managing Partner. Day-to-day operational
              leadership is held by Erdem İnanç (CEO) and Çağlayan Çetin (Group President), who manages international
              strategy and investor relations. Çetin has publicly stated the company's IPO criterion: reaching 50%
              international revenue before listing. Alibaba, as the ~70% majority shareholder, has influence over
              strategic direction through its board representation and technology partnership. Key-person risk is
              concentrated in the founder-CEO Mutlu and Group President Çetin given their prominence in public
              communications and investor relations. No material leadership changes have been publicly reported as of
              May 2026.
