      - number: '2.5'
        title: Sizing Gaps and Diligence Questions
        blocks:
          - type: paragraph
            body: >-
              Several important market boundaries are either private, conflicting, or methodologically incompatible.
              First, Trendyol's SAM by category—the specific portion of Turkey's e-commerce that the platform's current
              product mix can address—is not publicly disclosed. Management targets for category expansion (into
              fintech, insurance, cloud) imply growing SAM, but no independent sizing validates a SAM figure distinct
              from total Turkey e-commerce. Second, the Gulf and European cross-border SOM is backed only by company
              announcements (the $2 billion Gulf investment plan and a $10 billion export target by 2026), not by
              independently verifiable GMV breakdowns; the 4 million active Gulf users is company-reported and not
              corroborated. Third, the multiple e-commerce market forecasts (Mordor $102.63B versus IMARC's much higher
              trajectory, versus ETBİS's TL-denominated administrative figure) use incompatible scope and currency
              conventions; any valuation model that picks one forecast without acknowledging the others is
              methodologically weak. Fourth, the TCA's Trendyol commitments constrain certain monetization pathways, but
              the specific ceiling on achievable take rates from those commitments is not disclosed in public regulatory
              filings—this is a material regulatory diligence ask. For the Trendyol case, the strongest evidence
              supports Turkey domestic e-commerce TAM in the $100–110 billion range for 2026 and Trendyol's captured GMV
              of approximately $14 billion, implying 13–14% of total market GMV and 34–40% of the marketplace B2C
              sub-segment.
            claimRefs:
              - CM001
              - CM003
              - CM018
              - CM025
              - CM033
              - CM038
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Turkey is a marketplace-first market where Trendyol captures the structural position
            body: >-
              Unlike most e-commerce markets where brand websites compete with platforms, Turkey's e-commerce is
              overwhelmingly marketplace-native. This makes Trendyol's 34–40% GMV share more durable than the number
              suggests—it is not 34% of a fragmented market but 34–40% of a marketplace-dominated pool where the top two
              players take the majority of volume. The structural position has significant pricing-power implications
              and makes customer acquisition economics different from markets with strong direct-to-consumer
              competition.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM022
              - CM040
          - type: callout
            title: Regulatory retreat of Temu and SHEIN creates a $1.5B near-term volume opportunity
            body: >-
              Turkey's progressive tightening of cross-border duty-free thresholds—culminating in a full abolishment
              effective February 6, 2026—has effectively forced Temu and SHEIN to exit or severely restrict Turkey
              operations. Industry estimates place the redirected annual transaction volume at approximately $1.5
              billion. This is a rare event where regulation acts as a moat-building mechanism for domestic incumbents,
              and Trendyol and Hepsiburada are the primary beneficiaries.
            calloutType: strength
            claimRefs:
              - CM027
              - CM028
              - CM035
          - type: callout
            title: Turkish lira depreciation and inflation are structural margin and measurement risks
            body: >-
              With annual inflation at 33–38% and the lira depreciating over 20% since mid-2024, Trendyol faces a dual
              risk: consumer purchasing power erosion that softens nominal demand growth, and import-linked logistics
              cost inflation that squeezes take rates. For investors reviewing USD-denominated metrics, lira weakness
              can simultaneously inflate TL-based growth rates and deflate USD-equivalent scale. The adverse interaction
              between platform economics and macro volatility is not publicly disclosed in any financial detail, and is
              a material diligence area before any underwriting at the reported $16.5 billion peak valuation.
            calloutType: risk
            claimRefs:
              - CM031
              - CM032
          - type: callout
            title: TCA antitrust commitments create an unquantified ceiling on platform monetization
            body: >-
              Trendyol's self-preferencing and data portability commitments, accepted by the Turkish Competition
              Authority in 2024 and under active monitoring per Q1 2026 regulatory reporting, constrain specific
              promotional and algorithmic practices. The monetary impact of these constraints is not publicly disclosed.
              Any valuation model that assumes take-rate expansion above current levels should assess regulatory
              tolerance—the TCA's Law No. 7416 framework explicitly targets large-platform self-preferencing, and
              Trendyol is the primary named target in Turkey's regulatory record.
            calloutType: risk
            claimRefs:
              - CM030
              - CM033
              - CM037
              - CM039
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Turkey's online retail economy is structurally marketplace-native: individual brand storefronts capture
              minimal share, and the top three platforms (Trendyol, Hepsiburada, Amazon Turkey) account for an estimated
              60% of total e-commerce volume. Trendyol leads by a wide margin with $14B+ GMV in 2025 and an estimated
              34–40% share of B2C marketplace transactions. Hepsiburada (NASDAQ: HEPS) follows at roughly one-fifth
              Trendyol's scale on a USD GMV basis, recording FY2025 GMV of TRY 257.5B (IAS 29-adjusted, ~$5B USD at
              average 2025 FX) and Q1 2026 GMV of TRY 57.8B (+28.4% YoY). Amazon Turkey, despite global brand equity and
              logistics infrastructure, ranks third by monthly traffic (~34.6M visits vs. Trendyol's ~120M and
              Hepsiburada's ~59.7M in April 2026) and has not disclosed Turkey GMV. N11 (Doğuş Planet) is a distant
              fourth with ~12.6M monthly visits and estimated annual revenue in the low tens of millions. The landscape
              also includes Sahibinden (classifieds/used goods, distinct segment) and ÇiçekSepeti (gifting/lifestyle
              niche). The two most consequential competitive events of the past twelve months are the Temu/SHEIN
              regulatory retreat and the Uber consolidation of Getir plus Trendyol GO—each of which restructured
              Trendyol's threat environment more than any organic competitor move.
