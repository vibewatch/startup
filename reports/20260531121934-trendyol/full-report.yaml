      - number: '5.4'
        title: Logistics Technology — Trendyol Express
        blocks:
          - type: paragraph
            body: >-
              Trendyol Express (TEX) is the group's proprietary last-mile logistics arm and one of the most
              operationally differentiated assets in the Turkish e-commerce landscape. TEX covers all 81 Turkish
              provinces through a network of 75+ distribution centres and handles approximately 2.5 million package
              deliveries daily. This logistics density is functionally impossible to replicate quickly and has become a
              key structural moat against competitors whose delivery speeds are constrained by third-party carrier
              dependency.

              The Istanbul flagship facility, completed in 2022, spans 72,078 m² and was designed with Building
              Information Modelling (BIM) from the earliest planning stages to optimize the integration of automation
              systems with physical structure. The facility includes two principal volumes: a distribution centre with
              120 loading docks capable of handling 150 trucks simultaneously, and an integrated 5-storey automated
              warehouse. TEX serves over 1,800 staff at this single facility. Technology integration at the facility
              level spans an AI-driven Warehouse Management System (WMS) for optimized picking, packing, and
              barcode-based QC; AI-powered route optimization reducing per-delivery time; and near-real-time operational
              data fed into the group's BigQuery analytics platform via Kafka event streaming.

              Commercially, TEX charges sellers a desi-based per-parcel fee schedule: 77.54 TL for 0–2 desi parcels,
              rising to approximately 192.81 TL for 11–15 desi parcels (2026 published rates). TEX's dual role — as
              internal logistics for Trendyol marketplace orders and as a potential logistics-as-a-service for third
              parties — creates both synergies and disclosure ambiguity: internal TEX cost versus revenue is not
              separately disclosed. As of May 2026, same-day delivery is available in major Turkish cities and TEX
              provides next-day delivery guarantees for most of Turkey. The international logistics buildout includes a
              planned 65,000+ m² European fulfillment centre to serve Germany and CEE markets.
