  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Competition-Law & Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Trendyol operates under persistent and multi-layered regulatory exposure. The Turkish Competition
              Authority (TCA) concluded in July 2023 that Trendyol abused its dominant position in multi-category online
              marketplaces by (i) algorithmically favoring its private-label (PL) products and (ii) misusing third-party
              seller data for its own retail benefit, resulting in a TRY 61.3 million administrative fine (approximately
              EUR 2–6 million depending on conversion date). Trendyol appealed portions of the interim measures and
              committed to structural remedies, including the separation of PL products onto a dedicated platform
              (TrendyolMilla), implemented under Turkey's amended E-Commerce Law effective January 2024. In its July
              2024 re-evaluation, the TCA found algorithm-related obligations largely obsolete given PL separation but
              upheld data-related obligations as competitive concerns persisted. In November 2024 the TCA accepted
              Trendyol's commitments regarding automatic pricing mechanisms (no mandating, no incentivization,
              transparent communication, competition training for sellers), closing one investigation. However, in
              December 2025 a TCA bulletin confirmed that nine public and six confidential seller complaints were
              assessed under a new inquiry — the TCA declining a full new investigation but explicitly noting Trendyol's
              dominant position and competitive impact as ongoing concerns. Turkish competition law developments in 2025
              reflect a markedly more assertive posture toward digital platforms, with the TCA deploying commitments,
              re-evaluations, and multi-cycle behavioral remedies as preferred instruments. Beyond Turkey, Trendyol's
              Gulf expansion exposes it to Saudi data residency and e-commerce regulatory requirements, and any EU
              market deepening would bring potential Digital Markets Act (DMA) pre-assessment. Data-privacy risk under
              Turkey's KVKK (Law No. 6698) and its 2024 Law No. 7499 amendments (aligning cross-border transfer
              mechanisms with GDPR) is structural: Trendyol is a data controller over 40 million+ consumer records and
              250,000+ seller accounts, with fines for data breaches reaching up to TRY 10 million under 2026 KVKK
              penalty tables. GDPR-mirror obligations apply in the EU countries where Trendyol operates. Failure to
              maintain VERBIS registration or breach-notification deadlines would trigger material penalties and
              reputational damage.
