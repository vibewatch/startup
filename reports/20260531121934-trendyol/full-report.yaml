      - number: '3.5'
        title: Competitive Risk Register and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Several adverse signals temper the moat analysis. Hepsiburada's Kaspi.kz backing introduces a
              well-capitalised, operationally sophisticated super-app player into Turkish e-commerce. Kaspi has
              successfully built marketplace, payments, and lending integrations in Kazakhstan; applying the same model
              to Hepsiburada's 11.6M active customer base could accelerate financial services depth and seller tools.
              The widening of Hepsiburada's Q1 2026 net loss to TRY 992M reflects accelerated investment, not retreat.
              Amazon Turkey's primary long-term risk to Trendyol is not head-to-head GMV competition but a potential
              shift in cross-border and premium electronics categories where global supply chain efficiency and
              Prime-tier fulfilment quality could erode Trendyol's premium-product positioning. Multi-homing risk is
              real and structural: sellers on both Trendyol and Hepsiburada can divert incremental inventory to the
              lower-commission platform during fee negotiations, limiting Trendyol's pricing power over sellers. The
              Uber quick-commerce consolidation is a double-edged development: while Trendyol's core marketplace is
              unaffected, the bundled Uber+Getir+TrendyolGO delivery ecosystem now competes with Trendyol for
              time-of-day consumer engagement in food and impulse categories. Finally, the Turkish Competition Authority
              published its Q1 2026 regulatory monitoring bulletin confirming active oversight of Trendyol's data-use
              and algorithmic practices; any escalation of commitments—particularly toward algorithmic transparency or
              mandatory interoperability—would represent an unquantified monetisation ceiling.
            claimRefs:
