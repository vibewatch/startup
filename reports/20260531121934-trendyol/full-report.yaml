  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams & Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Trendyol operates a hybrid revenue model anchored on a marketplace take rate, augmented by logistics
              revenue, advertising, and nascent fintech services. The core revenue stream is the category commission
              charged to third-party sellers: rates range from 5% to 28% depending on category, with apparel at
              approximately 21.5%, accessories at 21.5–22.5%, electronics at 5–28% (phones ~7%, accessories up to 28%),
              cosmetics at 15–18%, and supermarket products at 12–20% as of 2025. In addition to the percentage
              commission, sellers pay a fixed per-order platform service fee of approximately ₺8.49 plus VAT per order.
              Since Trendyol does not publish a blended take rate or standalone revenue figure, the implied
              GMV-to-revenue conversion must be estimated: applying a 12–16% blended commission to the 2024 GMV of
              approximately $12.5 billion implies marketplace revenue in the $1.5–2.0 billion range — but this is an
              estimate, not a disclosed figure, and realized rates after volume discounts and new-seller programs may
              differ materially.

              Beyond the commission layer, Trendyol Express charges sellers desi-based logistics fees — 77.54 TL for 0–2
              desi, rising to approximately 192.81 TL for 11–15 desi packages as of 2026 — and functions as a logistics
              service provider whose revenue is embedded within the group but not separately disclosed. Trendyol Ads
              provides sponsored search, banner placements, and campaign management tools to sellers and brands; this is
              a high-margin incremental stream that scales with seller count and GMV, consistent with Alibaba's and
              Amazon's advertising economics, but no revenue figure is disclosed. Trendyol Pay is an embedded digital
              wallet across all group verticals that drives ecosystem stickiness and reduces payment processing costs;
              its monetization model is under development.

              Alibaba's AIDC fiscal year 2025 annual results (year ending March 31, 2025) represent the only
              primary-tier public financial disclosure capturing Trendyol. They confirm that AIDC's international
              commerce retail segment generated RMB 108,465 million (approximately USD 14.9 billion) in FY2025, up 33%
              year-over-year, "primarily driven by the increase in revenue contributed by AliExpress and Trendyol." This
              figure cannot isolate Trendyol's standalone contribution and cannot be used as a Trendyol-only revenue
              proxy.

              In July 2025, Trendyol Group, Baykar, Abu Dhabi's ADQ, and Ant International signed an MoU to establish a
              next-generation fintech platform in Turkey offering digital payments, SME and retail loans, deposits,
              investment products, and insurance — pending regulatory approval. This JV represents a future revenue
              stream with no current financial contribution and uncertain capitalization terms.
            claimRefs:
