    Trendyol is Turkey's dominant multi-category e-commerce marketplace, founded in 2010 in Istanbul and majority-owned
    by Alibaba Group (~70%). The platform connects over 250,000 sellers with more than 40 million customers and commands
    an estimated 34–40% of Turkey's total GMV. Trendyol's vertically integrated model includes its own logistics arm
