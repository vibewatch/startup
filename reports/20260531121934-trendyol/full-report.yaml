      - number: '6.2'
        title: International Customer Segments — Gulf, CEE & Germany
        blocks:
          - type: paragraph
            body: >-
              Trendyol's international customer base exceeded 9 million by late 2025, concentrated across three growth
              corridors: the Gulf Cooperation Council (GCC), Central and Eastern Europe (CEE), and Germany as the
              Western European flagship.

              In the Gulf, Trendyol crossed 3.7 million active customers and 9 million app downloads across the UAE,
              Saudi Arabia, Bahrain, Kuwait, Oman, and Qatar as of October 2025. The platform attracted over 1 million
              monthly orders during peak periods, with Saudi Arabia alone generating approximately 75–80% of all Gulf
              orders. Saudi Arabia is now Trendyol's second-largest market globally. Consumer behaviour in the Gulf is
              described as "discovery-driven" rather than intent-based: Gulf shoppers browse for inspiration and seek
              curated collections, informing Trendyol's investment in 15,000+ creator partnerships across Instagram,
              Snapchat, and TikTok. Delivery infrastructure investments (local warehouses, last-mile partners Aramex and
              Saudi Post) reduced delivery times from up to nine days to approximately four days. Trendyol targets Iraq
              as the next expansion market.

              In CEE, Trendyol launched localised platforms in Romania, Greece, Hungary, Czech Republic, Slovakia,
              Poland, and Bulgaria in early 2024. By December 2024, the region had 2.2 million active shoppers, 7
              million app downloads, and approximately 27,000 daily orders. Romania leads the region with 1.5 million
              active shoppers (70% of CEE total), over 16 million items sold, 6,600 active sellers, and a 47%
              repeat-purchase rate in 2024 — the strongest published retention proxy available. A 50,000 m² Romanian
              fulfillment centre opened in Ștefănești in February 2025, enabling two-day delivery.

              In Germany — Trendyol's first international market, launched in 2022 — the platform passed one million
              customers within its first 12 months and now ranks among the most downloaded fashion apps in the country.
              German customers are attracted primarily to Turkish fashion labels (LC Waikiki, Koton, Mavi, Defacto) and
              global brands (Valentino, Puma, Skechers). The company targets €3 billion in German revenue by 2025–2026.
              International revenue overall represents approximately 20% of total group business as of 2025, against a
              publicly stated IPO threshold of 50% international revenue.
