  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite & Vertical Architecture
        blocks:
          - type: paragraph
            body: >-
              Trendyol Group operates six principal product verticals, unified through a shared user identity, Trendyol
              Pay wallet, and the Trendyol Express logistics backbone. The core marketplace — Trendyol.com — is a
              two-sided platform serving over 40 million active customers and 250,000+ sellers across 30+ product
              categories with a catalogue exceeding 170 million SKUs as of 2025. The marketplace integrates proprietary
              advertising (Trendyol Ads), seller analytics tooling, and the Trendyol Express logistics rail to create a
              closed-loop commerce ecosystem.

              Trendyol Express (TEX) is the group's proprietary logistics vertical, covering all 81 Turkish provinces
              through 75+ distribution centres and delivering approximately 2.5 million packages per day. The Istanbul
              flagship DC spans 72,078 m² with 120 loading docks and a 5-storey automated warehouse completed in 2022.
              Trendyol Pay is an embedded digital wallet used across all group verticals for checkout, including
              instalment payment (taksit) support for Turkish consumers. Dolap is a standalone C2C secondhand
              marketplace with 1.6M+ active sellers and 70M+ listings across fashion, electronics, and home goods —
              Trendyol acquired Dolap to capture the resale economy. International storefronts operate in Germany
              (launched 2022, targeting €3B revenue), the Gulf region (GMV ~$1B in first full year), and Central and
              Eastern European markets with a logistics hub planned in Poland. Trendyol Go, the quick-commerce delivery
              vertical, was sold to Uber for approximately $700M (85% stake, May 2025) and is therefore excluded from
              the current group product perimeter.

              The group's product strategy centres on ecosystem lock-in: sellers enter through the marketplace API, are
              served by TEX logistics, pay commissions and advertising fees, and are financed through Trendyol's seller
              credit products. Buyers are retained through personalized recommendations, next-day delivery guarantees,
              and Trendyol Pay's instalment options. This multi-sided integration is structurally difficult to replicate
              and is the primary source of Trendyol's 34–40% Turkish e-commerce market share.
