      - number: '6.4'
        title: Customer Satisfaction, App Ratings & Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Customer satisfaction data for Trendyol is bifurcated by channel and geography. The Turkish domestic app
              has strong standing in both major app marketplaces. On Google Play, the Trendyol app holds a 4.2-star
              rating from approximately 2.3 million reviews and has been downloaded 100 million or more times — the
              largest single-app download count for a Turkish e-commerce platform. On the Apple App Store, the rating is
              4.7 stars from over 105,000 reviews. These scores are consistent with strong operational execution in
              Turkey, where Trendyol Express's same-day and next-day delivery capacity, established brand trust, and
              seamless Trendyol Pay integration deliver a high-quality end-to-end experience.

              International customer experience is materially weaker. Trendyol's international profile on Trustpilot
              carries a 2.5/5 "Poor" rating as of February 2026, with the dominant complaint themes being: items not
              delivered or delivered to wrong addresses, order-level product substitution (receiving different items
              than ordered), refund and return collection failures (Trendyol declining to collect returns and refusing
              refunds), and customer service responses characterised as unhelpful, scripted, or dismissive. A sample
              Gulf customer review (January 2026): "Selling fake products and not taking back. Pay 20 AED extra and buy
              from a trusted platform like Amazon." A European customer (December 2025): "Requested a return over a
              month ago. Until today no one has come to collect the items. They are blaming me for not answering calls."
              PissedConsumer logged 469+ Trendyol complaints as of May 2026, with recurrent delivery, refund, and CS
              resolution failures. This review divergence suggests a domestic–international logistics quality gap that
              has not been fully bridged despite the infrastructure investments described in the Gulf section.

              At the brand level, Comparably tracked Trendyol's NPS at 34 (55% promoters, 24% passives, 21% detractors),
              a company-reported 82% customer loyalty rate, product quality rating of 3.6/5, pricing 3.8/5, and customer
              service 3.7/5 as of 2026. These metrics suggest moderate advocacy and room for improvement in quality
              perception.
