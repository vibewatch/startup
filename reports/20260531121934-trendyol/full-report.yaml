  - id: FM003
    title: Buyer / segment map
    type: flow
    layout: wide
    summary: >-
      Turkey's e-commerce adoption path is mobile-first and marketplace-native; consumers move from social/app discovery
      through marketplace comparison to installment-financed checkout and repeat purchase.
    data:
      nodes:
        - id: n1
          label: Social / App Discovery
          detail: >-
            Turkish consumers discover products via Instagram, TikTok, and influencer marketing; 56% of HTTP traffic is
            mobile (Q1 2026). Awareness is driven by platform campaigns and November campaign (11/11) advertising.
          tone: neutral
        - id: n2
          label: Marketplace Search and Comparison
          detail: >-
            Trendyol's search-dominated interface surfaces competing sellers; price, seller rating, and delivery speed
            are primary comparison factors. Marketplace dominance means most consumers stay within Trendyol or
            Hepsiburada.
          tone: positive
        - id: n3
          label: Installment / Wallet Checkout
          detail: >-
            Taksit (credit installment) and Trendyol Pay BNPL remove affordability barriers for high-value items;
            digital wallet growing at 12.34% CAGR (Mordor). Consumer price sensitivity is high; promotions materially
            drive conversion.
          tone: positive
        - id: n4
          label: Delivery and Fulfillment
          detail: >-
            Next-day and scheduled delivery is the primary quality differentiator. 29% of online shoppers reported
            delivery problems (TurkStat 2025); slow delivery is the #1 churn trigger. Trendyol Express logistics is the
            key moat.
          tone: warning
        - id: n5
          label: Repeat Purchase and Loyalty
          detail: >-
            Push notifications, loyalty programs, and Trendyol Pay cashback drive repeat visits. Platform stickiness is
            high once payment methods are enrolled; switching cost is primarily habitual rather than contractual.
          tone: positive
        - id: n6
          label: Gulf/MENA Parallel Path
          detail: >-
            Cross-border Gulf buyers follow same mobile-app → marketplace → payment path but face higher delivery lead
            times and currency/customs considerations. 4M+ active Gulf users (company-reported) validate path viability.
          tone: neutral
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n1
          to: n6
