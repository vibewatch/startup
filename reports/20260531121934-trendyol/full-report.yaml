      - number: '1.4'
        title: Scale, Key Metrics & Market Position
        blocks:
          - type: paragraph
            body: >-
              Trendyol is the dominant force in Turkish e-commerce, holding an estimated 34–40% of total online market
              share in the country as of 2024. The company served 40 million customers and delivered 2.5 million
              packages per day across 35 countries as of 2025 — figures the company has communicated publicly. Its 2024
              GMV reached $12.5 billion, representing year-over-year growth of 30–35% per analyst estimates; Alibaba's
              fiscal year 2024 results confirmed Trendyol order growth exceeded 20% year-over-year. The company crossed
              a major operational threshold in 2023 by achieving its first operational profitability in Turkey. Trendyol
              Go, prior to the Uber transaction, generated $2 billion in gross bookings in 2024 on 200 million+ orders —
              a 50%+ year-over-year increase. Employee headcount is estimated at 10,885–11,504 globally across group
              entities, though the range varies across data sources and may reflect different entity perimeters.
              Trendyol's Gulf operations launched in August 2023 and surpassed $1 billion in Gulf GMV by end-2024, with
              Saudi Arabia accounting for approximately 75% of regional orders. In Turkey, electronics (41%) and fashion
              (31%) dominate category mix. The platform hosts 600,000+ daily visitors in Saudi Arabia alone as of late
              2024. Revenue per se is not publicly disclosed; the company is private and does not release audited
              financial statements. Trendyol had developed Turkey's first proprietary large language model, in
              collaboration with Alibaba's chip and machine-learning infrastructure.
