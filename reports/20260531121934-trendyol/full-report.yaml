      - number: '5.5'
        title: Developer Surface, Integrations & External Signals
        blocks:
          - type: paragraph
            body: >-
              Trendyol's external developer surface is one of the stronger signals of technical maturity among
              emerging-market marketplace operators. The developer portal at developers.trendyol.com provides
              comprehensive API documentation in both Turkish and English for the Seller Integration API, which uses
              OAuth2 (Client ID / Client Secret) for authentication and exposes RESTful endpoints for product listing
              and update, stock and price management, order fetching and status updates, shipment label generation,
              return processing, invoice submission, and customer query management. The API enables sellers to connect
              ERPs, CRMs, and third-party commerce tools to Trendyol programmatically, with Postman collections and
              rate-limit documentation available. This positions Trendyol's marketplace as a platform accessible to
              mid-market and enterprise sellers via integration partners rather than solely through the UI panel.

              On GitHub, the Trendyol organization (github.com/Trendyol) hosts 175+ repositories with active maintenance
              and public contributions. Key open-source projects include: Baklava (design system in TypeScript, ~1.4k
              stars, 136 contributors), Medusa (Android fragment stack controller in Kotlin, 495 stars, 59
              contributors), android-guidelines (architecture and coding standards, 435 stars, 33 contributors), kink
              (Kubernetes KinD cluster management CLI in Go, 382 stars, 29 contributors), and Stove (JVM end-to-end
              testing framework in Kotlin, ~309 stars, 21 contributors). This open-source portfolio demonstrates active
              engineering community engagement across backend, mobile, DevOps, and frontend disciplines. The Trendyol
              Tech landing page (trendyol.github.io) documents engineering culture emphasizing TDD, CI/CD, pair
              programming, and continuous learning.

              Conference presentations further evidence engineering maturity: TBP was presented at PlatformCon 2025
              (KubeVela/OAM IDP talk), Temporal workflow orchestration at Temporal Replay 2025, and the AI/ML Summit at
              Trendyol Campus in February 2026 reached industry engineers through Anadolu Ajansı coverage. Trendyol's AI
              models are published and downloadable on HuggingFace (Trendyol organization), providing quantifiable
              developer adoption signals. The engineering team numbers approximately 2,000+ engineers as of 2026, per
              CTO Cenk Çivici's public statements.
