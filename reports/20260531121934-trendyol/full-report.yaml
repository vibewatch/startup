      - number: '6.3'
        title: Seller & Brand Partner Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Trendyol's seller base of 250,000+ active merchants is the supply-side foundation of the marketplace. The
              vast majority are Turkish SMEs and independent brands operating through Trendyol's self-serve Seller
              Centre, which provides real-time performance analytics, demand forecasting, pricing recommendations, and
              inventory management. Integration with the platform is programmable via a documented OAuth2 Seller API
              (developers.trendyol.com), enabling direct ERP and CRM connectivity — a feature that attracts mid-market
              and larger brand partners. ChannelEngine and other multi-channel commerce platforms list Trendyol as a
              primary Turkish marketplace integration, a signal of its institutionalisation within global seller
              workflows.

              International brand partnerships are a key strategic lever for Trendyol's Gulf and European ambitions. In
              2025, Alshaya Group — the MENA franchise operator for over 75 global brands — brought American Eagle, Bath
              & Body Works, and H&M onto Trendyol's GCC platform, providing Gulf consumers with direct online access to
              brands already trusted in physical retail. In the Gulf SME segment, Trendyol partnered with Zid (Saudi
              Arabia's leading e-commerce enablement platform) in May 2025 to onboard thousands of Saudi and UAE
              merchants who were already operating on Zid infrastructure, dramatically lowering the seller activation
              barrier. As of October 2025, 5,000+ local Gulf sellers are live on the platform, contributing 35% of all
              Gulf product sales. Romanian sellers number 6,600 with an ongoing target to grow local brand content from
              10% to 30% of sales by end-2025.

              Seller economics are structurally challenging. Trendyol's 2026 commission schedule ranges from 8–12% for
              electronics to 18–25% for fashion, with additional per-order service fees of approximately ₺8.49 plus VAT.
              MercanWorks' 2026 P&L analysis for Turkish sellers found that after commissions, logistics fees, return
              provisions (fashion return rates of 20–30%), and advertising spend, average net margins in fashion can
              compress to as low as 11.5% on selling price — with total deductions consuming 20–35% of gross revenue.
              This seller-economics pressure is both a platform friction risk (seller attrition if alternatives emerge)
              and an adverse signal regarding the platform's extractive pricing power over its supply base.
