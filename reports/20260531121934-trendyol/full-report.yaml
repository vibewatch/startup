      - number: '5.6'
        title: Trust, Security, Privacy & Compliance
        blocks:
          - type: paragraph
            body: >-
              Trendyol's compliance architecture spans Turkish domestic law (KVKK), EU data protection (GDPR) for
              European operations, and Turkish e-commerce-specific regulations from the Turkish Competition Authority
              (TCA). Under KVKK (Law No. 6698 and its 2025 amendments), Trendyol is registered as a data controller in
              the VERBIS registry maintained by the Personal Data Protection Authority (KVKK Board). The 2025 KVKK
              amendments tighten cross-border data transfer rules, introducing a tiered mechanism (adequacy decisions,
              standard contractual clauses, and exceptional transfers), which creates incremental compliance obligations
              for Trendyol's EU-facing data flows. For German and EU operations, GDPR compliance is required; Trendyol
              publishes a data protection notice but has not publicly disclosed the specific cross-border transfer
              mechanism used for EU→Turkey data handling.

              Multi-entity data isolation is enforced via Looker's role-based access policies within Google Cloud,
              preventing group companies (marketplace, Dolap, international entities) from accessing each other's data
              on the shared BigQuery platform — a requirement highlighted publicly by Trendyol's BI team. The group
              maintains a public KVKK/GDPR data protection page at trendyol.com/s/kisisel-verilerin-korunmasi covering
              data categories, legal bases, and data subject rights.

              TCA obligations from the 2025 self-preferencing investigation commitments require Trendyol to maintain
              data portability for sellers, including the ability to export their analytics and customer interaction
              data — a structural concession that modestly reduces seller switching costs and is a legal constraint on
              the data moat. Trendyol Pay's PCI-DSS compliance posture has not been publicly confirmed; the fintech JV
              with Ant International (pending regulatory approval as of May 2026) will introduce additional Central Bank
              of Turkey (BDDK) and regulatory requirements for the combined payment and lending platform.

              Adverse signal: Dolap user reviews on Google Play (May 2026) indicate sustained seller dissatisfaction
              with commission fees reaching up to approximately 25% combined with elevated shipping costs. This
              represents a product quality risk: supply-side liquidity on Dolap depends on sellers finding economics
              viable, and the adverse sentiment trend post-Trendyol acquisition is a monitored risk. No major public
              data breach affecting Trendyol Group has been reported as of the report date.
