  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Turkey Domestic Consumer Segment & Adoption
        blocks:
          - type: paragraph
            body: >-
              Trendyol's core customer base is the Turkish domestic consumer. As of 2025, the company reports more than
              30 million active users in Turkey, out of approximately 40 million globally. Independent web traffic data
              confirms the scale: Trendyol.com receives 120–163 million monthly visits (SimilarWeb, April 2026), making
              it the highest-traffic e-commerce destination in Turkey and one of the most visited platforms in the
              country. The audience skews male (62%) and is concentrated in the 25–34 age bracket, consistent with
              Turkey's young internet population. Over 90% of transactions occur via mobile app, a figure reflecting
              Turkey's mobile-first commerce culture driven by high smartphone penetration.

              Product category mix in the Turkish domestic market is led by electronics (approximately 41% of GMV) and
              fashion/apparel (approximately 31%), with home goods, personal care, food and grocery (via the integrated
              Fast Market feature), and pet supplies making up the balance. This category breadth — in a single app — is
              a primary structural driver of session depth (average 7–9 minutes, 4–7 pages per session) and repeat-visit
              frequency. Trendyol processed over one billion orders in Turkey in calendar year 2023 and delivered 2.5
              million packages per day across all 81 Turkish provinces by 2025. The platform's $12.5 billion GMV in 2024
              implies a transaction density of roughly $415 per active user per year in Turkey — a figure consistent
              with comparable middle-income marketplace economies. Operational profitability was achieved in Turkey in
              2023, confirming that unit economics are positive at scale in the home market.
