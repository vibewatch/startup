  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and E-Commerce Ecosystem Scope
        blocks:
          - type: paragraph
            body: >-
              Trendyol's primary addressable market is Turkey's domestic B2C and C2C online marketplace economy, which
              is structurally unusual in that individual brand storefronts are largely absent—marketplaces (Trendyol,
              Hepsiburada, N11) capture the overwhelming share of online retail transactions. This makes Trendyol's
              market boundary unusually wide within e-commerce while also making market share concentration unusually
              high. The relevant spend pool for underwriting Trendyol includes: consumer purchases of fashion,
              electronics, home goods, beauty, and groceries through the marketplace; the third-party seller ecosystem
              (170,000+ sellers) which generates take-rate revenue; payment and wallet services (Trendyol Pay); and the
              cross-border export marketplace targeting Gulf and European consumers. Excluded from Trendyol's
              consolidated boundary as of mid-2025 is quick-commerce and food delivery (Trendyol GO), which was divested
              to Uber for $700 million in May 2025. B2B enterprise procurement and traditional offline retail are
              excluded from the direct opportunity. Adjacencies—Gulf fashion retail, European cross-border, and
              fintech/payments—are real but materially smaller than the domestic marketplace today. Turkey's e-commerce
              export market (growing from $2.2 billion in 2022 to $6.4 billion in 2024 with a government target of $8
              billion in 2025) represents the most important near-term adjacency. Status-quo substitutes for Turkish
              consumers include physical retail (still the dominant spending channel with e-commerce at 6.9% of GDP
              versus Europe's ~17%), direct-brand websites (minimal in Turkey), and legacy offline bazaar and chain
              retail. The structural marketplace dominance means consumer switching cost within the category is
              relatively low but switching out of the marketplace format is high.
