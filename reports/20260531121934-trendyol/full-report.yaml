      - number: '4.4'
        title: GMV, Public Traction & Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Trendyol's most reliably corroborated public traction metric is GMV: approximately $12.5 billion in FY2024
              (up ~30–35% year-over-year) and exceeding $14 billion in FY2025. Order volume grew approximately 47% in
              2024 and surpassed 1 billion orders in 2023. The platform serves 40 million customers (company-stated)
              across 250,000+ sellers. Gulf GMV of $1 billion in the first full year of Gulf operations and Trendyol
              Go's $2 billion in gross bookings pre-Uber sale are company-communicated figures consistent with the
              platform's operational scale.

              Revenue, gross margin, EBITDA, net income, cash flow from operations, capital expenditure, and
              segment-level unit economics at any granularity are all private. The Alibaba AIDC disclosure is the sole
              public primary-tier financial window; it bundles Trendyol with AliExpress, Lazada, and others, preventing
              disaggregation of Trendyol's standalone contribution. An investor assessing Trendyol as a standalone asset
              has no access to audited financial statements, management accounts, or debt/credit-facility terms.

              Turkish lira depreciation creates comparability risk. Hepsiburada applies IAS 29 inflation accounting,
              restating historical figures in current price units; Trendyol's GMV figures are primarily stated in USD
              but denominated in TRY, which depreciated approximately 50–60% cumulatively against the dollar in
              2021–2024. Real GMV growth in constant-currency terms is likely lower than USD-stated figures suggest — a
              material consideration for underwriting models.

              Export momentum is notable: Trendyol targeted $2 billion in export GMV for 2024 and $10 billion by 2026
              via 300,000 seller micro-exporters. Turkey's e-commerce exports grew from $2.2 billion in 2022 to $6.4
              billion in 2024. However, cross-border exports typically carry lower effective take rates than domestic
              transactions, due to international logistics costs, customs considerations, and currency conversion
              friction.
