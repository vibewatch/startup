      - number: '4.2'
        title: Unit Economics, Cost Structure & Margin Visibility
        blocks:
          - type: paragraph
            body: >-
              Trendyol's gross margin structure is opaque given its private status. The closest public proxy is
              Hepsiburada (NASDAQ: HEPS), which discloses IAS-29 inflation-adjusted financials. Hepsiburada reported a
              gross contribution margin of approximately 12.4% on GMV in Q3 2024 and an IAS-29 unadjusted EBITDA margin
              of 2.2% of GMV — a meaningful recovery from negative 7.2% in 2022. Trendyol's Turkey domestic operation
              achieved operational profitability in 2023, suggesting a comparable or superior unit economics trajectory,
              supported by its roughly 5× GMV scale advantage relative to Hepsiburada that provides substantial
              operational leverage on fixed costs.

              Trendyol's cost structure is dominated by three drivers: logistics (Trendyol Express infrastructure with
              75 distribution centres and 2.5 million daily deliveries), technology (AI investment, proprietary LLM,
              platform infrastructure), and seller-acquisition and marketing subsidies (free delivery programs, campaign
              incentives). Last-mile delivery represents approximately 53% of total e-commerce logistics costs, with
              labor accounting for 50–60% of last-mile expenses per industry benchmark data. Trendyol's proprietary
              Express model gives it greater cost control than third-party logistics users but concentrates capital
              intensity.

              Seller payment timing (7–28 days by category after order completion) creates a structural working capital
              float: Trendyol collects consumer payments immediately but remits to sellers up to four weeks later. At
              2.5 million daily deliveries and an average basket estimated in the low tens of USD, this float is
              material — representing a genuine economic advantage not captured in GMV or revenue metrics.

              International expansion significantly compresses unit economics. Trendyol's cross-border and European
              operations have been characterised by analysts as "costly with unproven long-term ROI," consistent with
              the widening AIDC segment loss from USD 1.1B in FY2024 to USD 2.09B in FY2025 — which Alibaba explicitly
              attributes to "investments in AliExpress and Trendyol's cross-border businesses." Building warehousing,
              fulfilment, and brand awareness in Germany, Romania, and the Gulf from scratch is structurally more
              expensive than the Turkey domestic operation that benefited from an established brand and logistics
              network.
