        - from: Gross Selling Price (100%)
          to: Marketplace Commission Retained (est. 12–16%)
          label: Revenue retained by Trendyol
        - from: Marketplace Commission Retained (est. 12–16%)
          to: Logistics Cost Absorbed (est. 5–10% of selling price)
          label: Logistics cost deducted
        - from: Logistics Cost Absorbed (est. 5–10% of selling price)
          to: Platform OpEx Overhead (marketing, technology, G&A)
          label: Platform overhead deducted
        - from: Platform OpEx Overhead (marketing, technology, G&A)
          to: 'Estimated Contribution (Turkey domestic: low positive; international: negative)'
          label: Net contribution margin
