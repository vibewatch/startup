      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The 2021 Mark Is Five Years Stale and Set in a Different Macro Regime
            body: >-
              The $16.5 billion Trendyol valuation mark dates from August 2021, when global growth-equity multiples were
              near their all-time highs driven by zero-rate monetary policy. EM e-commerce EV/Revenue multiples have
              since compressed 40–60%. Applying current Coupang/Sea median multiples (~1x EV/Revenue) to Trendyol's
              estimated revenue of $1.8–2.5 billion yields an implied enterprise value of $1.4–3.0 billion. Any investor
              referencing the 2021 mark as current fair value is using a benchmark that reflects a macro regime that no
              longer exists.
            calloutType: risk
            claimRefs:
              - CV001
              - CV023
              - CV024
              - CV034
          - type: callout
            title: No Standalone Audited Financials Means Valuation Is an Informed Estimate, Not a Verified Number
            body: >-
              Trendyol has never published standalone audited financial statements. All revenue and profitability
              estimates — including the $1.8–2.5 billion revenue range used in this chapter — are derived from take-rate
              assumptions applied to third-party GMV estimates and Alibaba AIDC segment disclosures. The AIDC segment
              bundles Trendyol, AliExpress, and Lazada. Any valuation analysis of Trendyol is necessarily an informed
              approximation until standalone Big 4 audited accounts are made available under NDA or as part of an IPO
              prospectus process.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV032
          - type: callout
            title: AIDC Near-Breakeven in Q4 FY2026 Is the Most Significant Positive Valuation Signal in Years
            body: >-
              Alibaba's Q4 FY2026 AIDC segment loss narrowed by approximately 96% year-on-year to RMB 138 million
              (approximately $19 million), signalling near-breakeven for the segment that includes Trendyol. If Trendyol
              is driving or contributing to this improvement, it is the first credible signal of combined international
              profitability since the AIDC segment was created. This improves the Base case ($5–9B) and nudges the Bull
              case probability upward, provided the trend is sustained through FY2027.
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV038
          - type: callout
            title: 'The Reset Entry Point: What Would Make Trendyol Investable'
            body: >-
              A new primary round at $5–9 billion would price Trendyol at 2.0–3.5x EV/Revenue on $2.0–2.5 billion
              estimated revenue — a premium to Coupang/Sea median (~1x) that could be justified by Turkey market
              dominance, Gulf option value, and SuperApp potential. At $5–7 billion with NDA-verified financials showing
              positive Turkish EBITDA and international revenue >30%, a risk-adjusted entry would be viable. At the 2021
              mark of $16.5 billion, it is not. The threshold is a documented, verified reset — not a rumoured
              unconfirmed $1 billion raise at the same implied value.
            calloutType: insight
            claimRefs:
              - CV026
              - CV032
              - CV033
              - CV038
