      - number: '3.3'
        title: Regulatory Entrants and Adjacent Competitors
        blocks:
          - type: paragraph
            body: >-
              The most significant adjacent competitive event is the regulatory exit of Temu and SHEIN from Turkey's
              cross-border direct-import segment. Turkey abolished all duty-free thresholds for low-value e-commerce
              parcels effective February 6, 2026, following a phased reduction from 150 EUR to zero over 2024–2026. Temu
              suspended all cross-border sales in Turkey after a regulatory inspection and has since pivoted to a model
              that only features goods sourced from Turkish-registered sellers—effectively becoming a domestic
              marketplace rather than a Chinese cross-border platform. SHEIN temporarily halted all sales. Bazaar Times,
              Kr-Asia, and Hürriyet Daily News estimate the annual transaction volume redirected from Temu and SHEIN to
              domestic platforms at approximately $1.5B. Trendyol and Hepsiburada are the primary beneficiaries, given
              their dominant share in the fashion and general merchandise categories that Temu and SHEIN had served.
              AliExpress also faces restrictions. The exit creates near-term volume uplift for incumbents and a
              medium-term product-quality moat: domestic sellers on regulated platforms are subject to Turkish consumer
              protection law, product safety standards, and post-sale warranty obligations that Chinese cross-border
              sellers did not face, raising the compliance cost of any future re-entry. In quick commerce, the Uber
              consolidation of Getir (February 2026, $335M food delivery + $100M for 15% grocery stake) combined with
              Trendyol GO (Uber-acquired May 2025, $700M) creates a dominant Uber-led rapid-delivery ecosystem in
              Turkey. Getir's food delivery recorded $1B+ in 2025 gross bookings (50% YoY growth). N11, while still
              present, faces structural scale limits. Sahibinden and ÇiçekSepeti operate in largely adjacent,
              non-overlapping segments (classifieds and gifting respectively) and are not considered direct competitive
              threats to Trendyol's general marketplace.
