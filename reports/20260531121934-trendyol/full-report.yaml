  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Trendyol customer adoption path from initial awareness through first purchase, repeat engagement, ecosystem
      embedding, and expansion or churn decision — mapped across the Turkey domestic, Gulf, and CEE consumer segments.
    data:
      items:
        - id: stage-awareness
          label: Awareness & Discovery
          actor: Prospective buyer (Turkey, Gulf, or CEE consumer)
          description: >-
            Turkey: organic search, social media, TV and digital advertising, word-of-mouth; brand is category-dominant
            with top-of-mind awareness. Gulf: influencer content on Instagram/Snapchat/TikTok (15,000+ creator
            partnerships), paid app installs, word-of-mouth among diaspora. CEE/Germany: paid digital campaigns,
            influencer partnerships (1,000+ German influencers), brand awareness low at entry.
          channels:
            - App Store / Google Play search
            - Social media (Instagram, TikTok, Snapchat)
            - Digital advertising
            - Word of mouth / diaspora network
        - id: stage-first-purchase
          label: First Purchase
          actor: New buyer; Trendyol Pay or local card
          description: >-
            Consumer downloads app (100M+ installs on Google Play Turkey), registers account, and completes first order.
            Trendyol Express handles same/next-day delivery in Turkey; Gulf delivery now ~4 days. Promotional coupons
            and first-order discounts typical at acquisition. Payment via Trendyol Pay (embedded wallet), instalment
            card (taksit in Turkey), or local payment methods.
          channels:
            - Trendyol mobile app (iOS/Android)
            - Trendyol.com web
            - Trendyol Pay / local bank cards
        - id: stage-repeat-engagement
          label: Repeat Engagement & Cross-Category Adoption
          actor: Active buyer (returning)
          description: >-
            AI-powered personalised recommendations and price-alert notifications drive repeat visits. Cross-category
            expansion: a fashion buyer discovers electronics, home goods, or grocery (Fast Market). Dolap secondhand
            marketplace provides additional re-engagement surface. Average session 7–9 minutes, 4–7 pages; high
            browse-to-basket intent in Gulf.
          channels:
            - Push notifications (price alerts, campaign reminders)
            - Trendyol AI recommendation engine
            - Dolap secondhand app (cross-sell)
            - Email / SMS campaigns
        - id: stage-ecosystem-embedding
          label: Ecosystem Embedding
          actor: Loyal buyer + potential seller/reseller
          description: >-
            Consumer embeds into multiple Trendyol products: uses Trendyol Pay as primary wallet (TrendFinance banking
            features in Turkey), recycles fashion via Dolap, uses price alerts and campaign coupons. Seller-pathway:
            consumer becomes micro-seller on Dolap (1.6M+ active Dolap sellers). Switching cost escalates with each
            additional product used.
          channels:
            - Trendyol Pay / TrendFinance
            - Dolap secondhand marketplace
            - Subscription to campaign alerts
        - id: stage-renewal-or-churn
          label: Renewal, Loyalty or Churn
          actor: Established buyer
          description: >-
            Turkey: high retention via ecosystem lock-in; NPS 34; 82% company-reported loyalty. Gulf: mixed — positive
            domestic Turkish cohort but international Trustpilot 2.5/5 signals delivery/service churn risk. CEE/Romania:
            47% repeat rate in 2024 — strong early signal. Churn triggers: unresolved delivery failure, return
            rejection, competitive price matching by Amazon or Hepsiburada.
          channels:
            - Auto-renewal (app-based purchasing habits)
            - Trendyol loyalty campaigns
