              The Turkish Competition Authority's ongoing monitoring of Trendyol's data-use practices (confirmed active
              in Q1 2026 bulletin) includes data-portability requirements that could, if enforced strictly, allow
              sellers to migrate their transaction and analytics histories to competing platforms. The algorithmic and
              historical data advantage that constitutes a core element of seller switching cost would be directly
