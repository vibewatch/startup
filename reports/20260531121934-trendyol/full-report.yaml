      - number: '4.3'
        title: Capital Structure, Adequacy & Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Trendyol's last publicly disclosed valuation is $16.5 billion from the August 2021 round, which raised
              $1.5 billion co-led by General Atlantic, SoftBank Vision Fund 2, and Gulf sovereign wealth funds. Total
              capital raised across all disclosed rounds is approximately $2.65 billion, with Alibaba holding
              approximately 70% of the company. The round-by-round funding chronology is documented in the Company
              Overview chapter; this chapter focuses on current capital adequacy.

              Cash on hand and monthly burn rate are not disclosed. Key signals on capital adequacy are: (1) Bloomberg
              reported in November 2024 that Trendyol was informally exploring a ~$1 billion fundraise; no transaction
              was confirmed by May 2026, suggesting either valuation expectations diverge from investor offers or
              Alibaba backstop is sufficient; (2) the Gulf investment commitment of approximately $2 billion over three
              years from late 2024 implies continued large capital deployment; (3) the Uber acquisition of 85% of
              Trendyol Go for $700 million in May 2025 — confirmed by Uber's SEC 8-K — provided a capital event at the
              Trendyol Go entity level, with allocation to the parent group not publicly disclosed.

              Given no new equity raise since 2021 and continued investment in international expansion, Trendyol is
              plausibly funded by some combination of Turkey operating cash flow, Alibaba intercompany support, and
              remaining reserves from the 2021 round. The Alibaba relationship creates Trendyol-specific financing
              dependency: intercompany terms, if any, are undisclosed and represent a material transfer-pricing risk for
              standalone investors. Trendyol's IPO remains conditional on reaching 50% international revenue share —
              currently approximately 20% — making the earliest realistic IPO window post-2028 on current growth
              trajectories.
