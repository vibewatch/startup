      - number: '7.2'
        title: Macro, FX, Inflation & Financial-Disclosure Risk
        blocks:
          - type: paragraph
            body: >-
              Turkey's macroeconomic environment is the single most pervasive risk for Trendyol's dollar-denominated
              valuation. Inflation peaked above 75% in mid-2024 and is projected by the Central Bank of the Republic of
              Turkey (CBRT) to moderate to 31–33% by end-2025 and 13–19% by end-2026 — well above any developed-market
              benchmark. The Turkish lira depreciated approximately 15–20% against the US dollar in 2024–2025, with
              USD/TRY forecast in the 42–46 range by end-2026, implying continued erosion of dollar-denominated GMV and
              revenue even as lira-denominated topline expands nominally. The IMF's 2025 Article IV consultation
              projects Turkish GDP growth of approximately 3–4% for 2025–2026, but highlights persistent FX volatility
              and inflation expectations as key risks. For Trendyol, structural FX exposure arises on multiple axes:
              imported goods in the electronics and apparel categories are priced in lira but sourced in hard currency;
              Gulf and European revenue accrues in AED/SAR/EUR but must be translated at depreciating-lira-equivalent
              rates for consolidated reporting; and any hard-currency debt financing would create balance-sheet
              mismatches. Compounding macro risk is the complete absence of standalone audited financial statements.
              Trendyol is a private company that discloses no audited accounts; the only primary-tier public financial
              window is Alibaba's AIDC consolidated segment, which bundles Trendyol with AliExpress, Lazada, and others.
              The AIDC adjusted EBITA loss widened from USD 1.1 billion in FY2024 to USD 2.09 billion in FY2025,
              attributed explicitly to cross-border investments in AliExpress and Trendyol. While AIDC losses are
              narrowing toward breakeven as of early FY2026, an investor cannot independently verify Trendyol's
              standalone revenue, margins, or cash position. The last disclosed valuation of $16.5 billion dates from
              August 2021, a period of near-zero interest rates; current mark-to-market using higher discount rates and
              a compressed multiple environment could yield a substantially lower figure. In November 2024, Bloomberg
              reported Trendyol was informally gauging interest in a $1 billion fundraise — unconfirmed as of May 2026 —
              suggesting potential capital needs to fund the $2 billion Gulf investment commitment. Capital-market and
              refinancing risk is elevated if the IPO pre-condition (50% international revenue) is not met before
              financial investor lock-up periods expire.
