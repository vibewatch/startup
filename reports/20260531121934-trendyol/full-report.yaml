      - number: '1.5'
        title: Milestones, Regulatory History & Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Trendyol's corporate history spans a founding phase defined by rapid consumer trust-building, a strategic
              pivot enabled by the Alibaba partnership in 2018, a decacorn fundraise in 2021, persistent antitrust
              scrutiny from 2021 onwards, and an international expansion push from 2020 through 2026. The Turkish
              Competition Authority (TCA) launched a preliminary investigation in September 2021 into allegations that
              Trendyol abused its dominant position in multi-category online marketplaces by manipulating algorithms to
              favour its private-label (PL) brands and using third-party seller data for its own retail advantage. In
              July 2023 the TCA issued its final decision, finding Trendyol dominant in multi-category e-marketplaces
              and finding two specific abuses: algorithmic manipulation to favour PL products, and improper use of
              third-party seller data. The Board imposed a TRY 61.3 million administrative fine (approximately EUR 2–5.8
              million depending on conversion date) and ongoing obligations including versioned retention of algorithm
              changes for three years. Trendyol appealed parts of the interim measures, and in 2022 committed to a
              separate package regarding data portability obligations related to its subsidiary Dolap. Under Turkey's
              amended e-commerce law (effective January 2024), Trendyol was prohibited from selling its PL products on
              its main marketplace, which it addressed by launching the TrendyolMilla platform. In July 2024 the TCA
              re-evaluated the obligations: algorithmic obligations were deemed moot given the PL separation, while
              data-related obligations were upheld. No new formal TCA investigation against Trendyol was reported in Q1
              2026. On the positive milestone side: Trendyol launched Trendyol Express in 2018, entered 27 European
              countries in October 2020, achieved decacorn status in August 2021, turned operationally profitable in
              Turkey in 2023, and in May 2025 reached an agreement for Uber to acquire 85% of Trendyol Go at a $700
              million valuation for that arm.
