      - number: '1.3'
        title: Funding History, Investors & Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              Trendyol has completed a series of landmark funding rounds since 2010. Tiger Global made the first
              institutional investment in July 2010, followed by a $26 million Series A co-led by Kleiner Perkins
              Caufield & Byers and Tiger Global in 2011 — the first top-tier Silicon Valley VC bet on Turkish tech. The
              European Bank for Reconstruction and Development also invested in a subsequent round circa 2014. The
              pivotal transaction came in June 2018 when Alibaba Group acquired a majority stake for approximately $728
              million, the largest internet-sector investment in Turkey at the time. Alibaba then invested a further
              $350 million in April 2021 at a $9.4 billion valuation, bringing its stake to approximately 86.5% before
              subsequent secondary activity. The defining milestone followed in August 2021: Trendyol raised $1.5
              billion led by General Atlantic, SoftBank Vision Fund 2, and Princeville Capital, alongside sovereign
              wealth funds ADQ (Abu Dhabi) and Qatar Investment Authority, valuing the company at $16.5 billion and
              making it Turkey's first decacorn. Total capital raised across all rounds is estimated at approximately
              $2.65 billion. Alibaba's stake has since settled at approximately 70% as of 2024–2026. Exact minority
              shareholder percentages for financial investors are not publicly disclosed. In November 2024, Bloomberg
              reported Trendyol was informally gauging interest for a $1 billion fundraise, though no transaction was
              confirmed as of May 2026. The sale of 85% of Trendyol Go to Uber for $700 million in May 2025 constituted
              a partial capital event for the group, though the proceeds are primarily within the Trendyol Go entity.
              Trendyol targets a dual listing in Istanbul plus London or New York once international revenue exceeds 50%
              of total sales.
