      - number: '7.3'
        title: Operational, Logistics & Cybersecurity Risk
        blocks:
          - type: paragraph
            body: >-
              Trendyol's operational risk is concentrated in its proprietary logistics infrastructure (Trendyol Express)
              and its technology platform. Trendyol Express handles 2.5 million parcel deliveries per day across 35
              countries as of 2025; at this volume, any sustained logistics disruption — infrastructure outage, labor
              action, extreme weather, customs process failure — would immediately degrade customer experience and
              seller economics. The logistics sector globally experienced a 48% increase in cybersecurity incidents over
              the five years to 2025, with ransomware and supply-chain attacks ranked among the top three threats by
              frequency. For a platform with 40 million+ registered customers, a breach of payment, identity, or order
              data would trigger KVKK notification obligations (72-hour timeline in practice, mirroring GDPR), fines up
              to TRY 10 million, and potential mass consumer churn — industry benchmarks suggest a 3.5–4× churn
              multiplier following major data-breach events. Third-party supply chain attacks, which accounted for
              approximately 30% of all breaches by 2025, are especially relevant given Trendyol's deep integration with
              250,000+ seller APIs, courier subcontractors, and cloud providers. Customer trust risk is empirically
              documented: Trendyol carries a low average review score (approximately 1.9/5 on consumer-complaint
              platforms) with persistent patterns of delivery failure, refund delays, empty-box scams, and unresponsive
              customer service cited across 2025–2026 reviews. While low Trustpilot scores are common for high-volume
              marketplaces, persistent patterns create attrition and seller-confidence risk at scale. On the labor side,
              no large-scale strikes were confirmed at Trendyol in 2025–2026, but courier and warehouse workforce
              conditions in Turkey's gig economy remain under government and union scrutiny, and any sudden labor action
              affecting Trendyol Express operations would materially disrupt the logistics moat.
