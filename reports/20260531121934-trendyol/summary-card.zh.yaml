summary:
  headline: >-
    Trendyol 是土耳其占主导地位的电商平台，GMV 已达 decacorn 量级且土耳其本土实现盈利；但 $16.5B 最近估值已过时五年，隐含 EV/Revenue 达新兴市场同业的 6.6–9.2x
    溢价，在退出机制未确认前，以 2021 年价格买入并不具吸引力。
