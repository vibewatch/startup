  title: Valuation
  summary: Trendyol carries a $16.5 billion last valuation mark set in August 2021,
    when a $1.5 billion Series C co-led by General Atlantic, SoftBank Vision Fund
    2, ADQ, and QIA was executed in a zero-interest-rate environment at peak growth-tech
    multiples. As of May 2026, no new financing round has closed, Bloomberg reported
    in November 2024 that Trendyol was exploring a roughly $1 billion raise — still
    unconfirmed. Applying current emerging-market e-commerce multiples to FY2025 GMV
    (>$14B) and estimated revenue ($1.8–2.5B) yields a base-case implied valuation
    of $5–9B, a bear case of $2–4B, and a bull case of $10–16B contingent on IPO execution.
    The 2021 mark implies an EV/Revenue of 6.6–9.2x — roughly 5–8x the Coupang/Sea
    comparable median of ~1x. Public peer medians have compressed 40–60% from 2021
    peaks. Material valuation uncertainty is compounded by the absence of standalone
    audited financial statements, an unmet IPO pre-condition (50% international revenue
    vs. ~20% current), and an Alibaba parent whose AIDC segment recorded a $2.09B
    loss in FY2025, though AIDC Q4 FY2026 showed the loss narrowing 96% year-on-year
    to near-breakeven. A reset to fair value, if and when a new round or IPO occurs,
    implies a material markdown from the 2021 mark for growth-oriented investors who
    entered at that level.
sections:
- id: valuation-context
  title: Valuation Context and Financing History
  body: 'Trendyol''s last external valuation mark is $16.5 billion, established in
    August 2021 when the company raised $1.5 billion in a Series C round co-led by
    General Atlantic, SoftBank Vision Fund 2, ADQ (Abu Dhabi Developmental Holding
    Company), and Qatar Investment Authority (QIA), with Princeville Capital also
    participating. Alibaba, which acquired an approximately 70% controlling stake
    in 2018, was not part of the 2021 round but retained its controlling interest.
    The 2021 round was executed at the peak of a global growth-equity re-rating cycle
    characterised by zero-rate monetary policy and record EM e-commerce multiples
    — conditions that have materially reversed by 2026. In November 2024 Bloomberg
    reported that Trendyol was exploring a roughly $1 billion raise that would imply
    an unchanged or slightly lower valuation; as of May 2026, no closing has been
    confirmed. The absence of a new round means the $16.5 billion mark is a stale
    reference point, now nearly five years old. Trendyol has not published standalone
    audited financial statements; the primary public financial window is Alibaba''s
    AIDC (Alibaba International Digital Commerce) segment, which bundles Trendyol
    with AliExpress and Lazada. AIDC recorded a loss of approximately $2.09 billion
    in FY2025. However, Alibaba''s Q4 FY2026 AIDC results show the segment loss narrowing
    by approximately 96% year-on-year to RMB 138 million (near-breakeven), signalling
    improving unit economics. TrendyolGo, the quick-commerce subsidiary, was divested
    to Uber in May 2025 for approximately $700 million (85% stake, implying a ~$824
    million total entity value for that arm). FX context is material: USD/TRY has
    depreciated to the 50–52 range as of early 2026, compressing dollar-denominated
    metrics even as lira-denominated GMV grows nominally.'
