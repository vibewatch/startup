- id: comparable-valuation
  title: Comparable Company Valuation Framework
  body: The most relevant publicly traded comparables for Trendyol are Hepsiburada
    (HEPS), Coupang (CPNG), Sea Limited / Shopee (SE), and MercadoLibre (MELI), covering
    the spectrum from direct Turkish peer to EM multi-category marketplace. As of
    May 2026, Hepsiburada trades at approximately $809 million enterprise value, implying
    an EV/Revenue of roughly 0.47x and EV/GMV of roughly 0.16x on FY2025 GMV of approximately
    TRY 257.5 billion (~$5 billion at current USD/TRY). Hepsiburada is the only direct
    listed peer but is significantly smaller and less internationalised, making it
    a downside-anchor comparable rather than a central case. Coupang trades at an
    EV of approximately $29–38 billion on FY2025 revenue of approximately $35.1 billion,
    implying an EV/Revenue of roughly 0.82x; its superior logistics infrastructure
    and Korean market dominance justify a modest premium to Hepsiburada. Sea Limited's
    e-commerce segment (Shopee) delivered Q1 2026 GMV of $9.3 billion (annualised
    ~$37 billion) and trade at an e-commerce EV/Revenue of approximately 1.2x, warranted
    by consistent profitability recovery. MercadoLibre commands a premium at 2.3–3.2x
    EV/Revenue, reflecting its fintech integration (Mercado Pago) and dominant LatAm
    network effects; it represents a long-term bull trajectory for Trendyol if SuperApp
    ambitions fully materialise. The peer median EV/Revenue is approximately 1.0x.
    Applying 0.8–1.2x to Trendyol's estimated revenue of $1.8–2.5 billion yields an
    implied enterprise value of $1.4–3.0 billion — well below the $16.5 billion mark.
    Even a generous 3x EV/Revenue MELI-comparable premium yields $5.4–7.5 billion.
    The 2021 mark implied EV/Revenue of 6.6–9.2x on current revenue estimates; current
    EM e-commerce multiples have compressed 40–60% from 2021 peaks according to multiple
    data providers.
