  evidenceGaps:
  - id: EGV001
    topic: Comparable company valuation table — excluded peers
    description: 'The comparable valuation analysis (TV004) excludes several potentially
      relevant peers: Pinduoduo/Temu (fundamentally different model — cross-border
      discount, not marketplace), Lazada (private, unlisted, Alibaba-owned — circular),
      and Amazon (scale differential of 20x+ makes multiples non-comparable). JD.com
      is excluded as China-domestic with significant state-sector dynamics. Including
      these would not materially change the median multiple conclusion but could affect
      the high end of the range.'
    impact: medium
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV017
    - QV020
    - QV038
    - QV010
  - id: EGV002
    topic: Trendyol standalone audited financials — absence of primary financial evidence
    description: 'All revenue and profitability estimates for Trendyol are derived
      from third-party take-rate assumptions and Alibaba AIDC segment disclosures
      that aggregate Trendyol, AliExpress, and Lazada. The absence of standalone audited
      financial statements means that no primary financial evidence is available.
      This is the single most material gap in this chapter: the $1.8–2.5B revenue
      range is an estimate, and all EV/Revenue multiples are therefore estimates applied
      to estimates.'
    impact: high
    relatedTableRefs:
    - TV001
    - TV003
    - TV004
    relatedQuestionRefs:
    - QV007
    - QV009
    - QV040
    - QV008
    - QV014
    - QV035
    - QV003
    - QV039
