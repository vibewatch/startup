- id: scenario-analysis
  title: Bull, Base, and Bear Scenario Analysis
  body: 'Three scenarios bracket the credible valuation range as of May 2026, each
    anchored to a distinct set of assumptions about GMV growth, international revenue
    trajectory, and the timing of a liquidity event. Bear case ($2–4B): Multiple compression
    to Hepsiburada-like levels (EV/GMV 0.10–0.16x) driven by failure to attract fresh
    capital above the 2021 mark, worsening FX, and continued international revenue
    stagnation. This scenario assumes a down-round or distressed secondary at $2–3
    billion, or a trade sale at strategic value of $3–4 billion. The TrendyolGo divestiture
    precedent ($824M total value for a segment) and Alibaba''s AIDC profitability
    pressure support this floor. Base case ($5–9B): Coupang/Sea-like multiples (EV/Revenue
    0.8–1.2x) applied to $1.8–2.5 billion estimated FY2026 revenue plus a Gulf growth
    premium. This scenario assumes a primary round closes at $5–7 billion (materially
    below the 2021 mark) or a dual-listing IPO at $7–9 billion in 2027–2028 contingent
    on reaching 35–40% international revenue. Turkey domestic operational profitability
    is the floor anchor in this case. Bull case ($10–16B): MercadoLibre-like trajectory
    (EV/Revenue 2.0–3.0x) triggered by successful Gulf market penetration to $3–5B
    GMV, international revenue reaching 45–50%, SuperApp monetisation of TrendyolPay
    and financial services, and an IPO at a $12–16B range. This scenario requires
    the 50% international revenue IPO pre-condition to be met or formally waived,
    and assumes continued Turkish inflation stabilisation per CBRT''s 13–19% end-2026
    target.'
