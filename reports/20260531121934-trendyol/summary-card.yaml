  headline: >-
    Trendyol is the dominant Turkish e-commerce platform with decacorn GMV scale and domestic profitability, but its
    $16.5B last mark is five years stale, implying a 6.6–9.2x EV/Revenue premium to emerging-market peers, making it
    unattractive at the 2021 price with no confirmed exit mechanism.
