        - Request FX hedging policy; assess USD vs. TL revenue mix; quantify logistics cost inflation impact on take rate.
      - - E-commerce regulatory complexity (Law No. 7416 and 2025–2026 amendments)
        - down
        - current and escalating
        - Mandatory local representative (Apr 2025), annual seller verification, distance contract amendments (Jan 2026), advertising budget caps
        - Request compliance roadmap and estimated incremental legal/operational spend; assess impact on advertising take rate.
      - - TCA antitrust commitments and ongoing monitoring
        - down
        - current
        - Self-preferencing and data portability commitments limit certain promotional and algorithmic practices; Q1 2026 bulletin confirms active monitoring
        - Obtain full written commitments text; assess which monetization strategies are constrained and by how much.
