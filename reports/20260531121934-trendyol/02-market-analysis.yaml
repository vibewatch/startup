        - Fashion, electronics, home goods, beauty, grocery, and general merchandise purchased
          through Trendyol's online marketplace; third-party seller GMV plus take rate and advertising revenue
        - B2B enterprise wholesale, physical retail, services outside the marketplace, offline transactions
        - Individual consumers (primarily 25–44, urban, mobile); household budget, credit installment plans
        - Core primary market; Trendyol captures 34–40% of this segment by GMV (2025)
      - - Quick-commerce and food delivery
        - On-demand grocery (sub-2 hours), restaurant delivery, last-mile instant orders
        - Planned/scheduled e-commerce, traditional grocery delivery, non-instant categories
        - Urban mobile users seeking convenience; higher-income segments for premium restaurants
        - Divested to Uber (May 2025 for $700M); now outside Trendyol's consolidated GMV boundary
      - - Cross-border fashion export (Gulf/MENA)
        - Turkish fashion, apparel, home goods, and beauty sold to KSA, UAE, Kuwait, Qatar, and Bahrain
          shoppers via Trendyol's international marketplace
        - Non-Turkish-sourced goods, physical in-market Gulf retail, non-fashion categories without Turkey supply-chain origin
        - Fashion-forward and modest-wear consumers in Gulf; Turkish diaspora; price-sensitive expats
        - Active expansion market; 4M+ active users in Gulf (company-reported); $2B investment plan announced
      - - Cross-border export to Europe
        - Turkish fashion, apparel, and home goods sold to European consumers (Germany, Netherlands, others)
        - EU-domiciled retail (Amazon EU, Zalando), non-Turkish-made goods, physical EU retail
        - Turkish diaspora in Europe; fashion-curious European consumers attracted by price/quality
        - Smaller than Gulf; higher regulatory and logistics complexity; adjacency rather than core
      - - Third-party seller ecosystem
        - Marketplace listing fees, advertising CPM/CPC, fulfillment fees, and Trendyol Pay processing fees paid by 170,000+ sellers
        - Direct-to-consumer off-platform sales by sellers, independent storefronts
        - Turkish SMEs, brands, and importers using Trendyol as their primary e-commerce channel
        - Take-rate revenue is primary monetization; seller growth directly drives TAM penetration
      - - Financial services and payments (Trendyol Pay)
        - Digital wallet transactions, BNPL, installment payment facilitation within Trendyol ecosystem
        - External banking, third-party POS, off-platform payment flows
        - Trendyol marketplace buyers using wallet for faster checkout; sellers receiving payouts
        - Adjacent fintech opportunity; bundled into super-app strategy; size not separately disclosed publicly
    notes: >-
      Market boundary defined by Trendyol's current monetization surfaces as of May 2026.
      Quick-commerce (Trendyol GO) excluded from consolidated boundary following May 2025 Uber acquisition.
      Cross-border GMV breakdowns are company-disclosed, not independently verified.
