  - id: section-5
    title: Sizing Gaps and Diligence Questions
    body: >-
      Several important market boundaries are either private, conflicting, or methodologically
      incompatible. First, Trendyol's SAM by category—the specific portion of Turkey's e-commerce
      that the platform's current product mix can address—is not publicly disclosed. Management
      targets for category expansion (into fintech, insurance, cloud) imply growing SAM, but no
      independent sizing validates a SAM figure distinct from total Turkey e-commerce. Second,
      the Gulf and European cross-border SOM is backed only by company announcements (the $2 billion
      Gulf investment plan and a $10 billion export target by 2026), not by independently verifiable
      GMV breakdowns; the 4 million active Gulf users is company-reported and not corroborated. Third,
      the multiple e-commerce market forecasts (Mordor $102.63B versus IMARC's much higher trajectory,
      versus ETBİS's TL-denominated administrative figure) use incompatible scope and currency
      conventions; any valuation model that picks one forecast without acknowledging the others
      is methodologically weak. Fourth, the TCA's Trendyol commitments constrain certain monetization
      pathways, but the specific ceiling on achievable take rates from those commitments is not
      disclosed in public regulatory filings—this is a material regulatory diligence ask. For
      the Trendyol case, the strongest evidence supports Turkey domestic e-commerce TAM in the
      $100–110 billion range for 2026 and Trendyol's captured GMV of approximately $14 billion,
      implying 13–14% of total market GMV and 34–40% of the marketplace B2C sub-segment.
