figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      The addressable opportunity narrows from Turkey's broad e-commerce TAM to the marketplace-
      dominated B2C segment to Trendyol's captured GMV, with meaningful headroom between each layer.
    data:
      nodes:
        - label: "Turkey total e-commerce TAM: $102–108B (2025–2026)"
          detail: >-
            Mordor Intelligence (B2C net, $102.63B in 2026) and ETBİS administrative data
            (4.57T TL ≈$108B in 2025) define the outer boundary; scope and FX differences prevent exact reconciliation.
          tone: neutral
        - label: "B2C marketplace sub-segment (Trendyol's primary competitive arena): ~$50–70B est."
          detail: >-
            Marketplaces dominate Turkey's e-commerce; excluding B2B procurement (11% CAGR per Mordor)
            and C2C leaves an estimated 60–70% of total market in Trendyol's primary competitive set.
            This SAM band is approximated and not publicly sourced at this precision.
          tone: neutral
        - label: "Trendyol captured GMV 2025: >$14B (34–40% B2C marketplace share)"
          detail: >-
            Company-reported 2025 GMV exceeding $14B; independent estimates corroborate
            34–40% market share within the B2C marketplace segment.
          tone: positive
        - label: "Gulf/MENA cross-border GMV: 4M+ active users; size undisclosed"
          detail: >-
            Trendyol's international Gulf marketplace is growing (4M+ users per company disclosure)
            but GMV is not publicly broken out; represents the primary upside adjacency beyond domestic TAM.
          tone: neutral
    approximationNotes: >-
      The B2C marketplace sub-segment band ($50–70B) is an approximated range derived from applying
      the Mordor B2C total and removing B2B procurement (cited at 11% CAGR/smaller share) and C2C
      segments; it is not a published figure and should be treated as illustrative only. Trendyol's
      domestic-only share within that band is not separately disclosed.
