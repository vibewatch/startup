        - down (mixed)
        - medium-term
        - Amazon trails domestic leaders but holds global supply chain and brand trust; Hepsiburada received TRY 4.17B Kaspi.kz capital injection (Dec 2025)
        - Track Amazon Turkey GMV/seller count; monitor Hepsiburada's technology and logistics investment trajectory post-Kaspi.
      - - Macro instability (inflation, FX, political risk)
        - down
        - current and 2026
        - Political events (e.g., Istanbul mayor arrest Mar 2025) cause TRY volatility; CBRT spent $50B+ in reserves defending lira; business uncertainty rises
        - Monitor CBRT path, political stability indicators, and Trendyol management commentary on macro risk mitigation.
    notes: >-
      Drivers and constraints are directional assessments based on public evidence;
