  evidenceGaps:
    - id: EG001
      type: private-evidence-only
      severity: material
      description: >-
        Trendyol's domestic SAM by category (QM005) and Gulf/MENA SOM (QM006) are not publicly
        disclosed. Company announcements (4M+ Gulf users, $2B Gulf investment plan, $10B export
        target) are directional but not independently verifiable GMV breakdowns. Any valuation
        model requiring a SAM/SOM below the platform-level GMV must commission primary research
        or rely on management disclosure in a diligence setting.
      relatedQuestionRefs:
        - QM005
        - QM006
      relatedTableRefs: []
    - id: EG002
      type: conflicting-data
      severity: minor
      description: >-
        Mordor Intelligence's $102.63B 2026 estimate (B2C net, USD) and IMARC's higher trajectory
        (broader scope, 24%+ CAGR) cannot be directly reconciled without full methodology access
        (QM009). ETBİS's 4.57T TL 2025 figure (QM021) uses a different scope and currency
        denomination that varies by FX assumption. The three are methodologically incompatible
        and should not be averaged; a single underwriting assumption requires a source selection
        rationale rather than a blended figure.
      relatedQuestionRefs:
        - QM009
        - QM021
      relatedTableRefs:
        - TM002
    - id: EG003
      type: missing-source
      severity: material
      description: >-
        The TCA's published Trendyol commitment package does not specify a numerical ceiling on
        achievable take rates or monetization strategies (QM014). The regulatory impact on
        Trendyol's long-term monetization ceiling is a diligence ask that requires obtaining the
        full written commitments text and a legal analysis of their scope—neither of which is
        available in public regulatory filings reviewed for this chapter.
      relatedQuestionRefs:
