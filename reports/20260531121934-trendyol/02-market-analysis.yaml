      - CM002
      - CM003
      - CM008
      - CM024
  - id: FM003
    title: Buyer / segment map
    type: flow
    layout: wide
    summary: >-
      Turkey's e-commerce adoption path is mobile-first and marketplace-native; consumers move from
      social/app discovery through marketplace comparison to installment-financed checkout and repeat purchase.
    data:
      nodes:
        - id: n1
          label: Social / App Discovery
          detail: >-
            Turkish consumers discover products via Instagram, TikTok, and influencer marketing;
            56% of HTTP traffic is mobile (Q1 2026). Awareness is driven by platform campaigns
            and November campaign (11/11) advertising.
          tone: neutral
        - id: n2
          label: Marketplace Search and Comparison
          detail: >-
            Trendyol's search-dominated interface surfaces competing sellers; price,
            seller rating, and delivery speed are primary comparison factors.
            Marketplace dominance means most consumers stay within Trendyol or Hepsiburada.
          tone: positive
        - id: n3
          label: Installment / Wallet Checkout
          detail: >-
            Taksit (credit installment) and Trendyol Pay BNPL remove affordability barriers
            for high-value items; digital wallet growing at 12.34% CAGR (Mordor).
            Consumer price sensitivity is high; promotions materially drive conversion.
          tone: positive
        - id: n4
          label: Delivery and Fulfillment
          detail: >-
            Next-day and scheduled delivery is the primary quality differentiator.
            29% of online shoppers reported delivery problems (TurkStat 2025);
            slow delivery is the #1 churn trigger. Trendyol Express logistics is the key moat.
          tone: warning
        - id: n5
          label: Repeat Purchase and Loyalty
          detail: >-
            Push notifications, loyalty programs, and Trendyol Pay cashback drive
            repeat visits. Platform stickiness is high once payment methods are enrolled;
            switching cost is primarily habitual rather than contractual.
          tone: positive
        - id: n6
          label: Gulf/MENA Parallel Path
          detail: >-
            Cross-border Gulf buyers follow same mobile-app → marketplace → payment path
            but face higher delivery lead times and currency/customs considerations.
            4M+ active Gulf users (company-reported) validate path viability.
          tone: neutral
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n1
          to: n6
    approximationNotes: null
    claimRefs:
      - CM005
      - CM009
      - CM018
      - CM019
      - CM020
      - CM021
  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      Turkey's e-commerce adoption funnel shows strong top-of-funnel conversion from internet users
      to online shoppers, with Trendyol capturing a dominant share of active marketplace buyers.
    data:
      items:
        - label: Turkish internet users (age 16–74)
          value: 77000000
          detail: >-
            Approximately 77 million internet users based on 90.9% penetration rate applied
            to Turkey's addressable 16–74 population (approx. 85M). TurkStat 2025 survey.
          tone: neutral
        - label: Online shoppers (purchased goods/services online in 2025)
          value: 30000000
          detail: >-
            55.7% online shopping penetration of the 16–74 age group implies approximately
            30–31 million active online shoppers; up from 51.7% in 2024 (TurkStat).
          tone: positive
        - label: Marketplace shoppers (vs. direct-brand websites)
          value: 28000000
          detail: >-
            Marketplace-first structure means ~90%+ of online shoppers transact through
            platforms like Trendyol or Hepsiburada rather than individual brand sites;
            estimated ~28M in marketplace funnel. Approximated.
          tone: positive
        - label: Trendyol active users (Turkey; company-reported)
          value: 30000000
          detail: >-
            Trendyol reports 30M+ active users in Turkey as of 2025; this figure
            may exceed the overall marketplace shopper estimate because of
            app downloads and passive accounts; should be validated against active-purchase metric.
          tone: positive
    approximationNotes: >-
      Internet user count is derived from TurkStat 90.9% penetration applied to approximate
      addressable population; exact base varies by TurkStat methodology. Marketplace shopper
      estimate (~28M) is approximated using marketplace dominance patterns, not a published figure.
      Trendyol's 30M+ user figure is company-reported and may include inactive accounts.
      Repeat-purchase rate and loyalty cohort size are not publicly disclosed; this funnel
      stops at active-user count rather than showing a retention layer with an invented figure.
    claimRefs:
      - CM005
      - CM006
      - CM008
      - CM022
      - CM023
callouts:
  - calloutType: insight
    title: Turkey is a marketplace-first market where Trendyol captures the structural position
    body: >-
      Unlike most e-commerce markets where brand websites compete with platforms, Turkey's
      e-commerce is overwhelmingly marketplace-native. This makes Trendyol's 34–40% GMV share
      more durable than the number suggests—it is not 34% of a fragmented market but 34–40%
      of a marketplace-dominated pool where the top two players take the majority of volume.
      The structural position has significant pricing-power implications and makes customer
      acquisition economics different from markets with strong direct-to-consumer competition.
    claimRefs:
      - CM004
      - CM007
      - CM009
      - CM022
      - CM040
  - calloutType: strength
    title: Regulatory retreat of Temu and SHEIN creates a $1.5B near-term volume opportunity
    body: >-
      Turkey's progressive tightening of cross-border duty-free thresholds—culminating in a
      full abolishment effective February 6, 2026—has effectively forced Temu and SHEIN to
      exit or severely restrict Turkey operations. Industry estimates place the redirected
      annual transaction volume at approximately $1.5 billion. This is a rare event where
      regulation acts as a moat-building mechanism for domestic incumbents, and Trendyol
      and Hepsiburada are the primary beneficiaries.
    claimRefs:
      - CM027
      - CM028
      - CM035
  - calloutType: risk
    title: Turkish lira depreciation and inflation are structural margin and measurement risks
    body: >-
      With annual inflation at 33–38% and the lira depreciating over 20% since mid-2024,
      Trendyol faces a dual risk: consumer purchasing power erosion that softens nominal
      demand growth, and import-linked logistics cost inflation that squeezes take rates. For
      investors reviewing USD-denominated metrics, lira weakness can simultaneously inflate
      TL-based growth rates and deflate USD-equivalent scale. The adverse interaction between
      platform economics and macro volatility is not publicly disclosed in any financial detail,
      and is a material diligence area before any underwriting at the reported $16.5 billion
      peak valuation.
    claimRefs:
      - CM031
      - CM032
  - calloutType: risk
    title: TCA antitrust commitments create an unquantified ceiling on platform monetization
    body: >-
      Trendyol's self-preferencing and data portability commitments, accepted by the Turkish
      Competition Authority in 2024 and under active monitoring per Q1 2026 regulatory
      reporting, constrain specific promotional and algorithmic practices. The monetary impact
      of these constraints is not publicly disclosed. Any valuation model that assumes take-rate
      expansion above current levels should assess regulatory tolerance—the TCA's Law No. 7416
      framework explicitly targets large-platform self-preferencing, and Trendyol is the
      primary named target in Turkey's regulatory record.
    claimRefs:
      - CM030
      - CM033
      - CM037
      - CM039
