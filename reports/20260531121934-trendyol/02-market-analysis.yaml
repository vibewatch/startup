        - Quantify Trendyol's vs. Hepsiburada's share of redirected demand; monitor for consumer price inflation in affected categories.
      - - Rising internet penetration and mobile-first infrastructure
        - up
        - current and ongoing through 2028
        - Each penetration point adds ~1M potential shoppers; Turkey at 55.7% online shopping vs. Europe's ~73% implies multi-year runway
        - Track annual TurkStat ICT usage survey; note gender and regional (urban/rural) penetration gaps.
      - - Quick commerce 50%+ annual growth (now outside Trendyol core)
        - mixed
        - current
        - QC is Turkey's fastest-growing e-commerce subcategory; Trendyol partly exited via Trendyol GO divestiture to Uber
        - Assess whether Trendyol's core logistics retains QC-adjacent capability; monitor Uber-Trendyol GO competitive posture.
      - - E-commerce export growth and government support
        - up
        - medium-term (2026–2028)
        - Turkish e-commerce exports grew from $2.2B (2022) to $6.4B (2024); government targets $8–10B by 2025–2026; cross-border SAM is additive
        - Request Trendyol's export GMV breakdown by geography; verify Gulf vs. Europe split and unit economics.
      - - Turkish lira depreciation and persistent inflation
        - down
        - current and persistent
