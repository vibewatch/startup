  - id: section-2
    title: Market Sizing and Contradictory Estimates
    body: >-
      Turkey's e-commerce TAM is large and growing but shows significant methodology-driven
      variation across sources. Mordor Intelligence sizes Turkey's market at $102.63 billion in
      2026, using a net-B2C-transaction-value approach excluding VAT and shipping with consistent
      spot FX treatment, and projects 9.24% CAGR to 2031. ETBİS—Turkey's official Ministry of
      Trade electronic commerce information system—recorded 4.57 trillion TL in 2025 transactions;
      at average 2025 exchange rates this implies approximately $108 billion, broadly consistent
      with Mordor but not directly comparable because ETBİS includes all virtual POS activity
      across B2C, B2B, and certain B2B categories. IMARC Group forecasts a far higher CAGR
      (24%+ from 2026 to 2034) from a broader definition that includes B2B procurement and service
      categories; no IMARC 2026 standalone dollar figure is publicly disclosed, but their
      trajectory implies a higher 2026 base. These contradictory estimates should be preserved
      rather than averaged: the Mordor B2C-only lens ($102.63B in 2026) is the most comparable
      to Trendyol's GMV reporting; the ETBİS administrative data is the most authoritative total
      for regulatory and benchmarking purposes; and the IMARC higher CAGR should be treated as an
      upper-bound scenario. Against Turkey's broad e-commerce market, Trendyol's 2025 GMV of $14+
      billion implies 13–14% of total market value at Mordor's scope, or 34–40% of the marketplace-
      dominated B2C segment that Trendyol actually competes in (consistent with independent reports).
      The company's own technology-traffic share is higher (technologychecker.io Q1 2026 analysis
      citing ETBİS and Cloudflare Radar data reports Trendyol at nearly five times the domestic
      number-two by net sales), but web-traffic share and GMV share use different methodologies and
      should not be conflated. SAM isolation below platform level—for instance, the share of Turkey's
      e-commerce that Trendyol could theoretically address if it fully expanded every category—is not
      publicly available and is a material diligence gap.
