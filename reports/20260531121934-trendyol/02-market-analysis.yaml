  - id: section-4
    title: Growth Drivers and Adoption Constraints
    body: >-
      The most potent near-term growth catalyst is the regulatory-forced exit of Temu and SHEIN
      from the Turkish market. Turkey progressively tightened cross-border import thresholds
      (from €150 in 2023 to €30 in August 2024, then to €27 in December 2024, and abolished
      duty-free exemptions entirely from February 6, 2026). As a result, SHEIN suspended Turkish
      sales and Temu restricted its marketplace to locally stocked goods. Industry estimates put
      the redirected annual volume at approximately $1.5 billion, most of which flows to domestic
      platforms. This eliminates the lowest-price tier of competition from Chinese cross-border
      platforms, allowing domestic leaders to exercise modest pricing power in fashion and
      electronics—though industry voices warn this may produce mild inflationary effects that
      could soften consumer demand in certain price-sensitive categories. Structural drivers include
      rising internet penetration (90.9% in 2025, up from 88.8% in 2024), growing e-commerce
      share of retail (6.9% of GDP in 2024 versus 2.7% in 2019), mobile-first infrastructure, and
      the government's active export promotion program (targeting $8–10 billion in e-commerce
      exports). Adverse constraints are material. Turkey's inflation—still approximately 33–38% in
      mid-2025 despite aggressive CBRT tightening, with a projected 29% for end-2025—erodes
      consumer purchasing power and creates price-setting volatility. Turkish lira depreciation
      (over 20% since mid-2024) increases Trendyol's import-linked logistics costs (fuel,
      vehicles, technology) and creates FX risk on USD-denominated metrics reported to international
      investors. TCA antitrust commitments (self-preferencing and data portability concessions
      accepted in 2024) constrain certain promotional and algorithmic practices on the platform.
      Law No. 7416 and 2025 amendments impose escalating compliance obligations on large
      marketplaces, including mandatory local representative requirements (effective April 2025),
      annual seller-data verification, new distance-contract consumer rights (effective January
      2026), and advertising-budget caps. Amazon Turkey trails domestic leaders but retains global
      supply chain and brand trust that could support gradual share gain if it invests in local
      logistics. Hepsiburada received TRY 4.17 billion ($97.6 million) in Kaspi.kz capital in
      December 2025 to accelerate SME digital tools, signaling competitive investment intensity.
      Quick commerce's 50%+ annual growth represents a category risk for Trendyol after the
      Trendyol GO divestiture, since fast grocery and meal delivery may increasingly cannibalize
      time-sensitive shopping from the core marketplace.
