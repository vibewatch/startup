company:
  name: Trendyol
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Trendyol operates at the center of Turkey's dominant marketplace-first e-commerce economy, which
    Mordor Intelligence sizes at $102.63 billion in 2026 (9.24% CAGR to 2031) while ETBİS official
    transaction data recorded 4.57 trillion TL (≈$108 billion) in 2025—a level of agreement that
    validates the market is large and growing, even as methodology differences prevent exact
    reconciliation. Trendyol's $14+ billion GMV in 2025 at 34–40% share is the most widely
    corroborated market-position figure. Growth drivers include Temu and SHEIN's regulatory-forced
    retreat (redirecting ~$1.5 billion in annual volume to domestic platforms), accelerating mobile
    penetration, quick-commerce momentum, and cross-border export expansion. Adverse constraints
    include persistent Turkish lira depreciation, inflation above 30%, TCA antitrust commitments
    limiting certain promotional practices, evolving e-commerce law compliance burden, and Amazon
    Turkey's latent competitive capacity. The TAM is well-established; SAM and SOM below platform
    level lack independent public verification and are key diligence gaps.
sections:
  - id: section-1
    title: Market Boundary and E-Commerce Ecosystem Scope
    body: >-
      Trendyol's primary addressable market is Turkey's domestic B2C and C2C online marketplace
      economy, which is structurally unusual in that individual brand storefronts are largely
      absent—marketplaces (Trendyol, Hepsiburada, N11) capture the overwhelming share of online
      retail transactions. This makes Trendyol's market boundary unusually wide within e-commerce
      while also making market share concentration unusually high. The relevant spend pool for
      underwriting Trendyol includes: consumer purchases of fashion, electronics, home goods,
      beauty, and groceries through the marketplace; the third-party seller ecosystem (170,000+
      sellers) which generates take-rate revenue; payment and wallet services (Trendyol Pay); and
      the cross-border export marketplace targeting Gulf and European consumers. Excluded from
      Trendyol's consolidated boundary as of mid-2025 is quick-commerce and food delivery (Trendyol
      GO), which was divested to Uber for $700 million in May 2025. B2B enterprise procurement and
      traditional offline retail are excluded from the direct opportunity. Adjacencies—Gulf fashion
      retail, European cross-border, and fintech/payments—are real but materially smaller than the
      domestic marketplace today. Turkey's e-commerce export market (growing from $2.2 billion in
      2022 to $6.4 billion in 2024 with a government target of $8 billion in 2025) represents the
      most important near-term adjacency. Status-quo substitutes for Turkish consumers include
      physical retail (still the dominant spending channel with e-commerce at 6.9% of GDP versus
      Europe's ~17%), direct-brand websites (minimal in Turkey), and legacy offline bazaar and chain
      retail. The structural marketplace dominance means consumer switching cost within the category
      is relatively low but switching out of the marketplace format is high.
