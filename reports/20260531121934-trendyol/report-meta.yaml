  foundingLocation: Istanbul, Turkey
  headquarters: Istanbul, Turkey
  productSummary: >-
    Multi-category online marketplace (fashion, electronics, home, FMCG) with proprietary last-mile
    logistics (Trendyol Express, 2.5M packages/day across 35 countries), a quick-commerce arm
    (Trendyol Go, acquired by Uber in 2025), an integrated ad platform (Trendyol Ads), and a
    digital wallet (Trendyol Pay). The international platform serves GCC and CEE markets via
    en.trendyol.com and dedicated regional apps.
  customerFocus: >-
    Turkish digital consumers (core), Gulf Cooperation Council shoppers (growth), and Central and
    Eastern European online buyers (early-stage expansion). Primary demographic is 25–34-year-old
    mobile-first buyers.
  businessModel: >-
    Marketplace commission (5–28% category-specific take rate), per-order service fees,
    logistics fees via Trendyol Express, advertising revenue (Trendyol Ads), and financial
    services (Trendyol Pay). No standalone blended take rate or gross margin has been disclosed.
  stage: Late Stage / Pre-IPO
  fundingStatus: >-
    Last primary round: $1.5B Series C at $16.5B valuation (August 2021), co-led by General
    Atlantic, SoftBank Vision Fund 2, ADQ, and QIA. Prior Alibaba strategic investment of $350M
    at $9.4B valuation (April 2021). Total disclosed capital raised approximately $2.65B.
    Bloomberg reported an informal $1B exploratory process in November 2024; no round confirmed
    as of May 2026.
