companyProfile:
  summary: >-
    Trendyol is Turkey's dominant multi-category e-commerce marketplace, founded in 2010 in Istanbul
    and majority-owned by Alibaba Group (~70%). The platform connects over 250,000 sellers with more
    than 40 million customers and commands an estimated 34–40% of Turkey's total GMV. Trendyol's
    vertically integrated model includes its own logistics arm (Trendyol Express), a quick-commerce
    service (Trendyol Go, 85% of which was sold to Uber in May 2025 for $700M), an ad network
    (Trendyol Ads), and a digital wallet (Trendyol Pay). The company generated approximately $12.5B
    in GMV in FY2024 and exceeded $14B in FY2025. Domestic operations turned operationally profitable
    in 2023. International expansion into the Gulf (launched August 2023) and Central and Eastern
    Europe is underway, though international revenue stands at approximately 20% versus the
    company-stated IPO pre-condition of 50%.
  foundedDate: "2010-01-01"
  founders:
    - name: Demet Mutlu
      role: Founder
      background: >-
