  evidenceGaps:
    - id: EGR001
      topic: "Trendyol security certification (ISO 27001 / SOC 2) — no public attestation confirmed"
      description: >-
        No public ISO 27001 or SOC 2 Type II certification for Trendyol's platform or logistics
        systems has been identified as of May 2026. This prevents independent assessment of
        Trendyol's cyber-risk residual exposure and leaves the security posture claim unverifiable.
      relatedQuestionRefs: [QR027]
      diligenceAsk: >-
        Request security certification portfolio from Trendyol management; confirm SOC 2 Type II
        or ISO 27001 audit scope, auditor identity, and most recent certification date; verify
        whether Trendyol Express logistics systems are in scope.

    - id: EGR002
      topic: "Regulatory / legal risk register (TR001) — Saudi PDPL and EU DMA rows are prospective"
      description: >-
        The regulatory risk register TR001 covers six risk rows. The Saudi PDPL and EU DMA entries
        are prospective exposures based on expansion trajectory, not confirmed enforcement actions.
        Partial coverage reflects that Saudi and EU enforcement posture cannot be fully verified
        from public sources as of May 2026.
      relatedTableRefs: [TR001]
      diligenceAsk: >-
        Retain specialist Gulf and EU regulatory counsel; request Trendyol's Saudi PDPL compliance
        roadmap; model EU GMV trajectory against Digital Markets Act designation thresholds annually.

