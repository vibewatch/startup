callouts:
  - calloutType: risk
    title: "Live TCA Scrutiny and December 2025 Seller-Complaint Inquiry Is Not a Clean Bill of Health"
    body: >-
      The TCA's December 2025 assessment of nine public seller complaints — while declining a
      full new investigation — explicitly acknowledged Trendyol's dominant position and competitive
      impact. This is not an exoneration; it is a documented baseline that lowers the threshold
      for a future full investigation. Any recurrence of algorithmic favoritism, pricing coercion,
      or data misuse would very likely cross into investigation territory given the established
      evidentiary framework. Investors should treat TCA compliance as a recurring operating expense,
      not a resolved historical matter.
    claimRefs: [CR001, CR003, CR004]

  - calloutType: risk
    title: "No Standalone Audited Financials: The Single Most Important Diligence Constraint"
    body: >-
      Trendyol has never published standalone audited financial statements. The AIDC segment loss
      of $2.09 billion in FY2025 is the only primary public financial signal, and it aggregates
      Trendyol with AliExpress and Lazada. Any investment decision at scale without NDA-protected
      management accounts and a Big 4 standalone audit is an informed bet on the business model,
      not a verified financial diligence exercise.
    claimRefs: [CR015, CR016, CR017]

  - calloutType: risk
    title: "Gulf Investment Commitment Runs Ahead of Proven Unit Economics"
    body: >-
      The $2 billion Gulf investment commitment was announced in late 2024 against a backdrop of
      only one full year of Gulf operations ($1B Gulf GMV, Saudi Arabia at 75%). The unit economics
      of cross-border fulfillment, local warehousing, and Arabic-language customer service have not
      been independently verified. A $2B capital deployment at this stage of market development
      is a high-conviction strategic bet that must be underwritten as such — not as a validated
      operational plan.
    claimRefs: [CR026, CR027, CR028]

  - calloutType: insight
    title: "Turkey Domestic Operational Profitability Is the Value-Preservation Floor"
    body: >-
      Amid the risk landscape, Turkey domestic operational profitability since 2023 — corroborated
      by Alibaba's FY2025 AIDC disclosure — is the critical value-preservation anchor. If
      international expansion underperforms, Trendyol's domestic Turkish business (34–40% market
      share, operationally profitable, 40M+ customers) represents a defensible asset base that
      could sustain a standalone valuation significantly above zero. This does not eliminate
      cross-border and capital-market risks, but it provides a meaningful downside floor.
    claimRefs: [CR013, CR014, CR015]

