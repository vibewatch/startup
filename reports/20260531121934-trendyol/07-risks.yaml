company:
  name: Trendyol
chapter:
  number: 7
  title: Risks
  summary: >-
    Trendyol's risk profile is dominated by five overlapping exposure clusters. First, regulatory and
    competition-law risk is live and structural: the Turkish Competition Authority (TCA) found
    dominant-position abuse in July 2023, upheld data-related obligations in its 2024 re-evaluation,
    and in December 2025 assessed nine additional seller complaints — creating a baseline of ongoing
    behavioral scrutiny. Second, macro-FX and financial-disclosure risk is material: Turkish
    inflation is projected to remain 31–33% at end-2025 and 13–19% at end-2026 per CBRT, the lira
    is forecast at USD/TRY 42–46 by end-2026, and Trendyol publishes no standalone audited
    financials, making independent valuation impossible. Third, cross-border and Gulf execution risk
    is rising as a $2 billion Gulf investment commitment accelerates ahead of demonstrated local
    unit economics. Fourth, Alibaba (~70%) creates a concentrated parent dependency and geopolitical
    overhang for Western and Gulf investors. Fifth, cyber, data-privacy, and seller-trust risk
    compound the platform's dual role as marketplace operator and data controller over 250,000+
    sellers and 40 million+ customers. Capital-market and IPO risk is elevated by a $16.5 billion
    last mark from 2021 and the unmet 50%-international-revenue IPO pre-condition.

sections:
  - id: regulatory-legal-risk
    title: Regulatory, Competition-Law & Legal Risk
    body: >-
      Trendyol operates under persistent and multi-layered regulatory exposure. The Turkish
      Competition Authority (TCA) concluded in July 2023 that Trendyol abused its dominant
      position in multi-category online marketplaces by (i) algorithmically favoring its
      private-label (PL) products and (ii) misusing third-party seller data for its own retail
      benefit, resulting in a TRY 61.3 million administrative fine (approximately EUR 2–6 million
      depending on conversion date). Trendyol appealed portions of the interim measures and
      committed to structural remedies, including the separation of PL products onto a dedicated
      platform (TrendyolMilla), implemented under Turkey's amended E-Commerce Law effective
      January 2024. In its July 2024 re-evaluation, the TCA found algorithm-related obligations
      largely obsolete given PL separation but upheld data-related obligations as competitive
      concerns persisted. In November 2024 the TCA accepted Trendyol's commitments regarding
      automatic pricing mechanisms (no mandating, no incentivization, transparent communication,
      competition training for sellers), closing one investigation. However, in December 2025 a
      TCA bulletin confirmed that nine public and six confidential seller complaints were assessed
      under a new inquiry — the TCA declining a full new investigation but explicitly noting
      Trendyol's dominant position and competitive impact as ongoing concerns. Turkish competition
      law developments in 2025 reflect a markedly more assertive posture toward digital platforms,
      with the TCA deploying commitments, re-evaluations, and multi-cycle behavioral remedies as
      preferred instruments. Beyond Turkey, Trendyol's Gulf expansion exposes it to Saudi data
      residency and e-commerce regulatory requirements, and any EU market deepening would bring
      potential Digital Markets Act (DMA) pre-assessment. Data-privacy risk under Turkey's KVKK
      (Law No. 6698) and its 2024 Law No. 7499 amendments (aligning cross-border transfer
      mechanisms with GDPR) is structural: Trendyol is a data controller over 40 million+
      consumer records and 250,000+ seller accounts, with fines for data breaches reaching
      up to TRY 10 million under 2026 KVKK penalty tables. GDPR-mirror obligations apply in
      the EU countries where Trendyol operates. Failure to maintain VERBIS registration or
      breach-notification deadlines would trigger material penalties and reputational damage.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
    figureRefs: [FR001]

  - id: macro-fx-financial-risk
    title: Macro, FX, Inflation & Financial-Disclosure Risk
    body: >-
      Turkey's macroeconomic environment is the single most pervasive risk for Trendyol's
      dollar-denominated valuation. Inflation peaked above 75% in mid-2024 and is projected
      by the Central Bank of the Republic of Turkey (CBRT) to moderate to 31–33% by end-2025
      and 13–19% by end-2026 — well above any developed-market benchmark. The Turkish lira
      depreciated approximately 15–20% against the US dollar in 2024–2025, with USD/TRY
      forecast in the 42–46 range by end-2026, implying continued erosion of dollar-denominated
      GMV and revenue even as lira-denominated topline expands nominally. The IMF's 2025
      Article IV consultation projects Turkish GDP growth of approximately 3–4% for 2025–2026,
      but highlights persistent FX volatility and inflation expectations as key risks.
      For Trendyol, structural FX exposure arises on multiple axes: imported goods in the
      electronics and apparel categories are priced in lira but sourced in hard currency;
      Gulf and European revenue accrues in AED/SAR/EUR but must be translated at
      depreciating-lira-equivalent rates for consolidated reporting; and any hard-currency
      debt financing would create balance-sheet mismatches. Compounding macro risk is the
      complete absence of standalone audited financial statements. Trendyol is a private
      company that discloses no audited accounts; the only primary-tier public financial
      window is Alibaba's AIDC consolidated segment, which bundles Trendyol with AliExpress,
      Lazada, and others. The AIDC adjusted EBITA loss widened from USD 1.1 billion in FY2024
      to USD 2.09 billion in FY2025, attributed explicitly to cross-border investments in
      AliExpress and Trendyol. While AIDC losses are narrowing toward breakeven as of early
      FY2026, an investor cannot independently verify Trendyol's standalone revenue, margins,
      or cash position. The last disclosed valuation of $16.5 billion dates from August 2021,
      a period of near-zero interest rates; current mark-to-market using higher discount rates
      and a compressed multiple environment could yield a substantially lower figure. In
      November 2024, Bloomberg reported Trendyol was informally gauging interest in a
      $1 billion fundraise — unconfirmed as of May 2026 — suggesting potential capital needs
      to fund the $2 billion Gulf investment commitment. Capital-market and refinancing risk
      is elevated if the IPO pre-condition (50% international revenue) is not met before
      financial investor lock-up periods expire.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR015, CR016, CR017, CR018]
    tableRefs: [TR002, TR006]
    figureRefs: [FR002]

  - id: operational-cyber-risk
    title: Operational, Logistics & Cybersecurity Risk
    body: >-
      Trendyol's operational risk is concentrated in its proprietary logistics infrastructure
      (Trendyol Express) and its technology platform. Trendyol Express handles 2.5 million
      parcel deliveries per day across 35 countries as of 2025; at this volume, any sustained
      logistics disruption — infrastructure outage, labor action, extreme weather, customs
      process failure — would immediately degrade customer experience and seller economics.
      The logistics sector globally experienced a 48% increase in cybersecurity incidents over
      the five years to 2025, with ransomware and supply-chain attacks ranked among the top
      three threats by frequency. For a platform with 40 million+ registered customers, a
      breach of payment, identity, or order data would trigger KVKK notification obligations
      (72-hour timeline in practice, mirroring GDPR), fines up to TRY 10 million, and
      potential mass consumer churn — industry benchmarks suggest a 3.5–4× churn multiplier
      following major data-breach events. Third-party supply chain attacks, which accounted
      for approximately 30% of all breaches by 2025, are especially relevant given Trendyol's
      deep integration with 250,000+ seller APIs, courier subcontractors, and cloud providers.
      Customer trust risk is empirically documented: Trendyol carries a low average review
      score (approximately 1.9/5 on consumer-complaint platforms) with persistent patterns
      of delivery failure, refund delays, empty-box scams, and unresponsive customer service
      cited across 2025–2026 reviews. While low Trustpilot scores are common for high-volume
      marketplaces, persistent patterns create attrition and seller-confidence risk at scale.
      On the labor side, no large-scale strikes were confirmed at Trendyol in 2025–2026,
      but courier and warehouse workforce conditions in Turkey's gig economy remain under
      government and union scrutiny, and any sudden labor action affecting Trendyol Express
      operations would materially disrupt the logistics moat.
    claimRefs: [CR019, CR020, CR021, CR022, CR023, CR024, CR025]
    tableRefs: [TR003]
    figureRefs: [FR003]

  - id: strategic-execution-risk
    title: Cross-Border, IPO & Strategic Execution Risk
    body: >-
      Trendyol's international expansion — 27+ European countries since 2020 and the Gulf since
      August 2023 — is the primary strategic thesis but also the primary execution risk. Gulf GMV
      crossed $1 billion in the first full year of Gulf operations (end-2024), with Saudi Arabia
      representing approximately 75% of regional orders. However, a $2 billion Gulf investment
      commitment announced in late 2024 is a capital-intensive bet ahead of proven local unit
      economics: fulfillment infrastructure buildout, Arabic-language localization, local
      regulatory compliance, and competition from Amazon, Noon, and local champions (Jarir, Namshi)
      all create sustained negative carry. Cross-border regulatory risk is material: Saudi e-commerce
      regulations on data residency, product standards, and digital payments evolve rapidly, and
      Turkey's February 2026 abolishment of duty-free thresholds (benefiting domestic Turkey GMV)
      has no equivalent in GCC markets where Trendyol is the entrant, not the incumbent. IPO
      execution risk is acute: the stated pre-condition of 50% international revenue is
      approximately 20–30 percentage points away from the ~20% international share reported in
      2025, and no IPO timeline has been publicly committed. Financial investors from the 2021
      round (General Atlantic, SoftBank Vision Fund 2, Princeville Capital, ADQ, QIA) face
      growing time-to-exit pressure as the IPO timeline remains open-ended. A forced secondary
      transaction or down-round fundraise at a valuation materially below $16.5 billion would
      impair investor returns and reputational positioning. Key-person execution risk is elevated:
      Demet Mutlu (founder-CEO) and Çağlayan Çetin (Group President, international strategy)
      have no announced successors and their departures would materially disrupt investor
      confidence and operational continuity.
    claimRefs: [CR026, CR027, CR028, CR029, CR030, CR031, CR032, CR033]
    tableRefs: [TR004, TR005]
    figureRefs: []

  - id: parent-dependency-risk
    title: Alibaba Parent Dependency & Geopolitical Overhang
    body: >-
      Alibaba's approximately 70% ownership of Trendyol creates structural dependency and
      geopolitical risk that is distinct from operational execution. Technology dependency is
      direct: Trendyol's logistics optimization, AI-driven personalization, LLM infrastructure
      (Turkey's first proprietary large language model developed with Alibaba's chip and ML
      stack), and payment backbone leverage AIDC/Alibaba platforms. Should Alibaba face Western
      sanctions, technology-transfer restrictions, or a strategic refocusing away from
      international commerce, Trendyol would need to rebuild or acquire these capabilities
      independently — a multi-year and multi-billion-dollar undertaking. Geopolitical risk is
      institutionally relevant: Western institutional investors (EU/US pension funds, sovereign
      wealth funds) increasingly apply scrutiny to Chinese-owned technology platforms in emerging
      markets. In Gulf markets, where Trendyol is expanding with sovereign wealth fund backing
      (ADQ, QIA), any deterioration of China's diplomatic standing in the region could create
      commercial friction. Transfer-pricing arrangements, intercompany IP licensing, and
      capital-return mechanisms between Trendyol and Alibaba are not publicly disclosed,
      creating governance opacity for minority shareholders. The partial divestiture of
      Trendyol Go to Uber in May 2025 (85% for $700 million) demonstrates Alibaba's willingness
      to restructure the group, but also raises the question of which assets could be carved
      out or reprioritized in future strategic pivots. Any scenario in which Alibaba seeks
      to reduce its stake below 50% through an IPO or secondary sale could create board-control
      transition risk without adequate governance protocols for the transition period.
    claimRefs: [CR034, CR035, CR036, CR037, CR038]
    tableRefs: []
    figureRefs: []

