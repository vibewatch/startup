  - id: TU003
    title: Named customer proof table
    notes: "Representative sample only; individual buyer names are not disclosed; brand-partner commercial terms (exclusivity, commission, minimum volumes) are confidential and not reflected here."
    enumerationScope:
      coverage: sample
      basis: >-
        Enumeration is a representative sample of publicly verifiable named customers and named
        segments drawn from official press releases, brand partnership announcements, third-party
        app store data, and independent news sources. Exhaustive enumeration of 40M+ individual
        consumers and 250K+ seller accounts is not feasible; this table covers material named
        brand partners and regionally significant segment milestones with the strongest
        source corroboration available as of May 2026.
    columns:
      - customer/segment
      - segment type
      - deployment/use case
      - production vs pilot
      - outcome
      - limitation
    rows:
      - - Alshaya Group brands (American Eagle, Bath & Body Works, H&M)
        - B2B brand partner — GCC franchise operator
        - Distribution of Alshaya-franchised global brands through Trendyol GCC marketplace (KSA, UAE)
        - Production (2025 live launch confirmed)
        - Adds established international brands to Trendyol GCC catalogue; increases GMV quality and brand credibility in Gulf
        - Terms of partnership (exclusivity, commission, minimum volumes) not disclosed; no GMV contribution data
      - - Turkish domestic consumer base (core Turkey market)
        - B2C consumer segment — domestic
        - Multi-category marketplace shopping via Trendyol app (fashion, electronics, home, grocery)
        - Production (15 years of operation; operationally profitable 2023)
        - 30M+ active users; 1B+ orders 2023; 34–40% Turkish e-commerce market share; $12.5B GMV 2024
        - Active-purchase definition not audited; no public cohort retention or NRR disclosed
      - - Gulf consumer base (Saudi Arabia, UAE, GCC)
        - B2C consumer segment — international (Gulf)
        - Cross-border and locally sourced fashion/lifestyle purchasing via Trendyol GCC app
        - Production (launched Aug 2023; active scale by end-2024)
        - 3.7M+ active customers; $1B+ Gulf GMV 2024; Saudi Arabia = 2nd-largest market globally
        - Platform launched <3 years ago in region; Trustpilot rating 2.5/5 flagging unresolved logistics issues
      - - Romanian consumer market (CEE flagship)
        - B2C consumer segment — international (CEE)
        - Affordable fashion and home goods shopping via Trendyol Romania localised platform
        - Production (launched early 2024; 50K m² fulfilment centre opened Feb 2025)
        - 1.5M active shoppers; 16M+ items sold; 47% repeat-purchase rate in 2024; 27,000 daily orders (CEE Q4 2024)
        - Revenue contribution not disclosed; limited international brand depth vs. local alternatives
      - - German consumer market (Western Europe flagship)
        - B2C consumer segment — international (Western Europe)
        - Turkish fashion brand discovery (LC Waikiki, Koton, Mavi, Defacto) alongside global labels
        - Production (launched 2022; Berlin office opened; e-exports centre near Istanbul Airport established)
        - 1M+ customers within 12 months; ranked top fashion apps in Germany
        - Revenue not disclosed; €3B target implies current GMV is a fraction of target; unit economics unconfirmed
      - - SME sellers via Zid partnership (KSA/UAE)
        - B2B seller-customer (supply side) — international
        - Enabling KSA and UAE SMEs to list and sell through Trendyol GCC via Zid merchant platform integration
        - Production (partnership signed May 2025; Zid merchants being onboarded)
        - Dramatically lowers seller onboarding barrier; expected to grow Gulf seller base beyond 5,000
        - Total activated Zid-sourced sellers not yet disclosed; volume contribution not reported
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU020, CU021, CU022, CU033, CU039, CU040]

