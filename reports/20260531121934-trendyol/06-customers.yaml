company:
  name: Trendyol
chapter:
  number: 6
  title: Customers
  summary: >-
    Trendyol serves a two-sided customer base: approximately 40 million active shoppers globally
    (30M+ domestic Turkey) and 250,000+ marketplace sellers. Turkish domestic consumers are
    demographically young (25–34 age group dominant), mobile-first (90%+ transactions), and
    skewed toward electronics (41%) and fashion (31%). International customers now exceed 9 million
    across the Gulf (3.7M+), CEE (2.2M), and Germany (1M+ within 12 months of launch), with Saudi
    Arabia emerging as the second-largest market globally and accounting for 75% of Gulf orders. Named
    brand partner Alshaya Group (American Eagle, Bath & Body Works, H&M) joined the GCC platform in
    2025, alongside 5,000+ local SME sellers enabled via Zid. Customer satisfaction signals are
    bifurcated: the Turkish domestic app holds strong Google Play (4.2★, 2.3M reviews) and App Store
    (4.7★, 105K reviews) ratings, but Trustpilot international ratings are "Poor" at 2.5/5, with
    widespread complaints about delivery failures, return refusals, and customer service quality in
    Gulf and European markets. NPS is 34 and a company-reported customer loyalty rate of 82% are
    tracked by Comparably, though no audited cohort or NRR data is publicly available. Revenue
    concentration risk is high — Turkey represents ~80% of total GMV; Saudi Arabia contributes ~75%
    of all Gulf-region orders. The IPO trigger (50% international revenue) remains distant at ~20%
    today.

sections:
  - id: turkey-consumer-segment-adoption
    title: Turkey Domestic Consumer Segment & Adoption
    body: >-
      Trendyol's core customer base is the Turkish domestic consumer. As of 2025, the company
      reports more than 30 million active users in Turkey, out of approximately 40 million globally.
      Independent web traffic data confirms the scale: Trendyol.com receives 120–163 million
      monthly visits (SimilarWeb, April 2026), making it the highest-traffic e-commerce destination
      in Turkey and one of the most visited platforms in the country. The audience skews male (62%)
      and is concentrated in the 25–34 age bracket, consistent with Turkey's young internet
      population. Over 90% of transactions occur via mobile app, a figure reflecting Turkey's
      mobile-first commerce culture driven by high smartphone penetration.

      Product category mix in the Turkish domestic market is led by electronics (approximately 41%
      of GMV) and fashion/apparel (approximately 31%), with home goods, personal care, food and
      grocery (via the integrated Fast Market feature), and pet supplies making up the balance.
      This category breadth — in a single app — is a primary structural driver of session depth
      (average 7–9 minutes, 4–7 pages per session) and repeat-visit frequency. Trendyol processed
      over one billion orders in Turkey in calendar year 2023 and delivered 2.5 million packages
      per day across all 81 Turkish provinces by 2025. The platform's $12.5 billion GMV in 2024
      implies a transaction density of roughly $415 per active user per year in Turkey — a figure
      consistent with comparable middle-income marketplace economies. Operational profitability
      was achieved in Turkey in 2023, confirming that unit economics are positive at scale in
      the home market.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU036, CU037]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001, FU002]

  - id: international-customer-segments
    title: International Customer Segments — Gulf, CEE & Germany
    body: >-
      Trendyol's international customer base exceeded 9 million by late 2025, concentrated across
      three growth corridors: the Gulf Cooperation Council (GCC), Central and Eastern Europe (CEE),
      and Germany as the Western European flagship.

      In the Gulf, Trendyol crossed 3.7 million active customers and 9 million app downloads across
      the UAE, Saudi Arabia, Bahrain, Kuwait, Oman, and Qatar as of October 2025. The platform
      attracted over 1 million monthly orders during peak periods, with Saudi Arabia alone
      generating approximately 75–80% of all Gulf orders. Saudi Arabia is now Trendyol's
      second-largest market globally. Consumer behaviour in the Gulf is described as
      "discovery-driven" rather than intent-based: Gulf shoppers browse for inspiration and seek
      curated collections, informing Trendyol's investment in 15,000+ creator partnerships across
      Instagram, Snapchat, and TikTok. Delivery infrastructure investments (local warehouses,
      last-mile partners Aramex and Saudi Post) reduced delivery times from up to nine days to
      approximately four days. Trendyol targets Iraq as the next expansion market.

      In CEE, Trendyol launched localised platforms in Romania, Greece, Hungary, Czech Republic,
      Slovakia, Poland, and Bulgaria in early 2024. By December 2024, the region had 2.2 million
      active shoppers, 7 million app downloads, and approximately 27,000 daily orders. Romania
      leads the region with 1.5 million active shoppers (70% of CEE total), over 16 million
      items sold, 6,600 active sellers, and a 47% repeat-purchase rate in 2024 — the strongest
      published retention proxy available. A 50,000 m² Romanian fulfillment centre opened in
      Ștefănești in February 2025, enabling two-day delivery.

      In Germany — Trendyol's first international market, launched in 2022 — the platform passed
      one million customers within its first 12 months and now ranks among the most downloaded
      fashion apps in the country. German customers are attracted primarily to Turkish fashion
      labels (LC Waikiki, Koton, Mavi, Defacto) and global brands (Valentino, Puma, Skechers).
      The company targets €3 billion in German revenue by 2025–2026. International revenue
      overall represents approximately 20% of total group business as of 2025, against a
      publicly stated IPO threshold of 50% international revenue.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU040, CU041]

  - id: seller-brand-partner-ecosystem
    title: Seller & Brand Partner Ecosystem
    body: >-
      Trendyol's seller base of 250,000+ active merchants is the supply-side foundation of the
      marketplace. The vast majority are Turkish SMEs and independent brands operating through
      Trendyol's self-serve Seller Centre, which provides real-time performance analytics, demand
      forecasting, pricing recommendations, and inventory management. Integration with the platform
      is programmable via a documented OAuth2 Seller API (developers.trendyol.com), enabling
      direct ERP and CRM connectivity — a feature that attracts mid-market and larger brand partners.
      ChannelEngine and other multi-channel commerce platforms list Trendyol as a primary Turkish
      marketplace integration, a signal of its institutionalisation within global seller workflows.

      International brand partnerships are a key strategic lever for Trendyol's Gulf and European
      ambitions. In 2025, Alshaya Group — the MENA franchise operator for over 75 global brands
      — brought American Eagle, Bath & Body Works, and H&M onto Trendyol's GCC platform, providing
      Gulf consumers with direct online access to brands already trusted in physical retail. In the
      Gulf SME segment, Trendyol partnered with Zid (Saudi Arabia's leading e-commerce enablement
      platform) in May 2025 to onboard thousands of Saudi and UAE merchants who were already
      operating on Zid infrastructure, dramatically lowering the seller activation barrier. As of
      October 2025, 5,000+ local Gulf sellers are live on the platform, contributing 35% of all
      Gulf product sales. Romanian sellers number 6,600 with an ongoing target to grow local brand
      content from 10% to 30% of sales by end-2025.

      Seller economics are structurally challenging. Trendyol's 2026 commission schedule ranges
      from 8–12% for electronics to 18–25% for fashion, with additional per-order service fees of
      approximately ₺8.49 plus VAT. MercanWorks' 2026 P&L analysis for Turkish sellers found
      that after commissions, logistics fees, return provisions (fashion return rates of 20–30%),
      and advertising spend, average net margins in fashion can compress to as low as 11.5% on
      selling price — with total deductions consuming 20–35% of gross revenue. This seller-economics
      pressure is both a platform friction risk (seller attrition if alternatives emerge) and an
      adverse signal regarding the platform's extractive pricing power over its supply base.
    claimRefs: [CU013, CU020, CU021, CU022, CU023, CU024, CU025, CU039]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: customer-satisfaction-ratings
    title: Customer Satisfaction, App Ratings & Adverse Evidence
    body: >-
      Customer satisfaction data for Trendyol is bifurcated by channel and geography. The Turkish
      domestic app has strong standing in both major app marketplaces. On Google Play, the
      Trendyol app holds a 4.2-star rating from approximately 2.3 million reviews and has been
      downloaded 100 million or more times — the largest single-app download count for a Turkish
      e-commerce platform. On the Apple App Store, the rating is 4.7 stars from over 105,000
      reviews. These scores are consistent with strong operational execution in Turkey, where
      Trendyol Express's same-day and next-day delivery capacity, established brand trust, and
      seamless Trendyol Pay integration deliver a high-quality end-to-end experience.

      International customer experience is materially weaker. Trendyol's international profile on
      Trustpilot carries a 2.5/5 "Poor" rating as of February 2026, with the dominant complaint
      themes being: items not delivered or delivered to wrong addresses, order-level product
      substitution (receiving different items than ordered), refund and return collection failures
      (Trendyol declining to collect returns and refusing refunds), and customer service responses
      characterised as unhelpful, scripted, or dismissive. A sample Gulf customer review (January
      2026): "Selling fake products and not taking back. Pay 20 AED extra and buy from a trusted
      platform like Amazon." A European customer (December 2025): "Requested a return over a month
      ago. Until today no one has come to collect the items. They are blaming me for not answering
      calls." PissedConsumer logged 469+ Trendyol complaints as of May 2026, with recurrent
      delivery, refund, and CS resolution failures. This review divergence suggests a
      domestic–international logistics quality gap that has not been fully bridged despite
      the infrastructure investments described in the Gulf section.

      At the brand level, Comparably tracked Trendyol's NPS at 34 (55% promoters, 24% passives,
      21% detractors), a company-reported 82% customer loyalty rate, product quality rating of
      3.6/5, pricing 3.8/5, and customer service 3.7/5 as of 2026. These metrics suggest moderate
      advocacy and room for improvement in quality perception.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032]
    tableRefs: [TU004]

  - id: retention-expansion-concentration
    title: Retention Proxies, Expansion Loops & Concentration Risk
    body: >-
      Trendyol's retention model is built on ecosystem integration rather than a standalone loyalty
      programme. The combination of Trendyol Express (same/next-day delivery), Trendyol Pay
      (embedded wallet with instalment support), personalised AI recommendations, and the
      breadth of 170M+ SKUs creates compounding switching costs: a user embedded in three or
      more Trendyol products faces the cost of replacing five simultaneous habits. The clearest
      published retention proxy is Romania: 47% of Romanian customers placed multiple orders
      in 2024 — a strong signal for a platform launched in CEE only in early 2024. No equivalent
      cohort data is disclosed for Turkey or Gulf segments.

      The NPS of 34 and 82% loyalty rate (Comparably, 2026) are indicative but methodologically
      weak: Comparably's NPS is a voluntary opt-in survey and its "loyalty" metric definition is
      not publicly disclosed. No NRR, GRR, churn rate, or retention cohort data has been
      published by Trendyol or Alibaba for any customer segment. This is a material diligence gap.

      Expansion is primarily geographic (Gulf, CEE, Germany) and ecosystem-vertical (TrendyolMilla
      private label recovery, TrendFinance embedded banking, Dolap secondhand). The IPO-trigger
      metric — 50% international revenue — implies Trendyol must roughly double its international
      revenue share from ~20% today. Gulf GMV crossing $1 billion in 2024 and CEE reaching 2.2M
      buyers by end-2024 indicate that the trajectory is positive, but the speed remains uncertain.

      Concentration risk is material at two levels. First, geographic: Turkey accounts for
      approximately 80% of total GMV, exposing the business to Turkish lira volatility, domestic
      inflation, and Turkish regulatory actions (see antitrust chapter). Second, within
      international markets, Saudi Arabia drives approximately 75% of Gulf orders, meaning the
      Gulf segment is itself highly concentrated. Fashion — the highest-return-rate category —
      represents 31% of Turkey GMV and disproportionately drives customer complaints in
      international markets where return logistics infrastructure is immature.
    claimRefs: [CU033, CU034, CU035, CU037, CU042, CU030, CU031, CU015, CU019]
    tableRefs: [TU005]
    figureRefs: [FU004]

