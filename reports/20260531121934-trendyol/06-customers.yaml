callouts:
  - calloutType: risk
    title: Trustpilot 2.5/5 international rating signals an unresolved domestic-to-international service quality gap
    body: >-
      While the Turkish domestic app delivers a high-quality experience (Google Play 4.2★ from 2.3M
      reviews), Trendyol's international Trustpilot profile carries a 2.5/5 "Poor" rating with
      recurring themes of delivery failures, return refusals, and dismissive customer service.
      This gap is most pronounced in the Gulf and CEE markets — precisely the two corridors
      where Trendyol must win to reach the 50% international revenue IPO threshold. If the
      service quality gap is not closed, customer acquisition spend in these markets risks
      being structurally offset by churn from first-order negative experiences.
    claimRefs: [CU026, CU028, CU029, CU019, CU042]

