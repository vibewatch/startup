  - id: TU005
    title: Expansion and concentration risk table
    notes: "Concentration percentages (Turkey GMV ~80%, KSA Gulf share ~75%) are company-stated or third-party derived; not independently audited. Impact ratings are analyst assessments based on available evidence."
    columns:
      - expansion driver
      - concentration risk
      - impact
      - diligence path
    rows:
      - - International customer growth (Gulf, CEE, Germany)
        - Turkey = ~80% of group GMV; international ~20% as of 2025
        - "High: any domestic macro shock (inflation, TRY depreciation, regulatory) disproportionately hits revenue; IPO trigger (50% international) is distant"
        - Track international GMV quarterly; model sensitivity to Turkish lira at various depreciation scenarios
      - - Gulf expansion — Saudi Arabia dependency
        - Saudi Arabia = ~75% of all Gulf orders; single-country risk within international
        - "Medium-high: Gulf operations are structurally concentrated; KSA regulatory risk (CITC, ZATCA) not fully mapped"
        - Obtain KSA revenue split; review compliance posture with KSA e-commerce regulations
      - - Fashion category volume
        - Fashion 31% of Turkey GMV with 20–30% return rate; highest complaint driver internationally
        - "Medium: high return rate compresses margins and generates adverse reviews; disproportionate CS load"
        - Separate fashion return rate by market; model return cost impact on EBITDA per market
      - - Seller base concentration
        - ~250K sellers; top-seller share of GMV not disclosed; Alshaya and global brands are strategic but small in count
        - "Medium: if top-50 seller accounts represent disproportionate GMV, seller defection risk is material"
        - Request top-10 seller GMV concentration ratio; understand exclusivity/exclusion terms with Alshaya
      - - Alibaba majority ownership
        - Alibaba ~70% owner; AIDC segment reporting limits standalone visibility; IPO dependent on Alibaba consent
        - "High: Chinese geopolitical risk, Alibaba regulatory or strategic shifts could affect Trendyol's independence, access to capital, and investor perception at IPO"
        - Review intercompany agreements; model IPO path with and without Alibaba consent; assess technology licensing dependency
    claimRefs: [CU019, CU034, CU035, CU024, CU033, CU042]

figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Trendyol customer adoption path from initial awareness through first purchase, repeat
      engagement, ecosystem embedding, and expansion or churn decision — mapped across the
      Turkey domestic, Gulf, and CEE consumer segments.
    data:
      items:
        - id: stage-awareness
          label: Awareness & Discovery
          actor: Prospective buyer (Turkey, Gulf, or CEE consumer)
          description: >-
            Turkey: organic search, social media, TV and digital advertising, word-of-mouth;
            brand is category-dominant with top-of-mind awareness. Gulf: influencer content
            on Instagram/Snapchat/TikTok (15,000+ creator partnerships), paid app installs,
            word-of-mouth among diaspora. CEE/Germany: paid digital campaigns, influencer
            partnerships (1,000+ German influencers), brand awareness low at entry.
          channels:
            - App Store / Google Play search
            - Social media (Instagram, TikTok, Snapchat)
            - Digital advertising
            - Word of mouth / diaspora network
        - id: stage-first-purchase
          label: First Purchase
          actor: New buyer; Trendyol Pay or local card
          description: >-
            Consumer downloads app (100M+ installs on Google Play Turkey), registers account,
            and completes first order. Trendyol Express handles same/next-day delivery in Turkey;
            Gulf delivery now ~4 days. Promotional coupons and first-order discounts typical at
            acquisition. Payment via Trendyol Pay (embedded wallet), instalment card (taksit in
            Turkey), or local payment methods.
          channels:
            - Trendyol mobile app (iOS/Android)
            - Trendyol.com web
            - Trendyol Pay / local bank cards
        - id: stage-repeat-engagement
          label: Repeat Engagement & Cross-Category Adoption
          actor: Active buyer (returning)
          description: >-
            AI-powered personalised recommendations and price-alert notifications drive repeat
            visits. Cross-category expansion: a fashion buyer discovers electronics, home goods,
            or grocery (Fast Market). Dolap secondhand marketplace provides additional re-engagement
            surface. Average session 7–9 minutes, 4–7 pages; high browse-to-basket intent in Gulf.
          channels:
            - Push notifications (price alerts, campaign reminders)
            - Trendyol AI recommendation engine
            - Dolap secondhand app (cross-sell)
            - Email / SMS campaigns
        - id: stage-ecosystem-embedding
          label: Ecosystem Embedding
          actor: Loyal buyer + potential seller/reseller
          description: >-
            Consumer embeds into multiple Trendyol products: uses Trendyol Pay as primary
            wallet (TrendFinance banking features in Turkey), recycles fashion via Dolap,
            uses price alerts and campaign coupons. Seller-pathway: consumer becomes micro-seller
            on Dolap (1.6M+ active Dolap sellers). Switching cost escalates with each additional
            product used.
          channels:
            - Trendyol Pay / TrendFinance
            - Dolap secondhand marketplace
            - Subscription to campaign alerts
        - id: stage-renewal-or-churn
          label: Renewal, Loyalty or Churn
          actor: Established buyer
          description: >-
            Turkey: high retention via ecosystem lock-in; NPS 34; 82% company-reported loyalty.
            Gulf: mixed — positive domestic Turkish cohort but international Trustpilot 2.5/5
            signals delivery/service churn risk. CEE/Romania: 47% repeat rate in 2024 — strong
            early signal. Churn triggers: unresolved delivery failure, return rejection, competitive
            price matching by Amazon or Hepsiburada.
          channels:
            - Auto-renewal (app-based purchasing habits)
            - Trendyol loyalty campaigns
            - Customer service resolution (churn reduction)
    claimRefs: [CU003, CU006, CU012, CU015, CU026, CU028, CU030, CU031, CU037]

