company:
  name: Trendyol
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Trendyol is Turkey's dominant e-commerce platform, founded in 2010 by Demet Mutlu (Harvard Business School dropout) and co-founders Evren Üçok and Begüm Tekin in Istanbul. Alibaba acquired a majority stake in 2018 for approximately $728 million and now holds roughly 70% of the company. In August 2021 Trendyol raised $1.5 billion at a $16.5 billion valuation — becoming Turkey's first decacorn — from General Atlantic, SoftBank Vision Fund 2, and Gulf sovereign wealth funds. By 2024 the company delivered $12.5 billion in GMV, served 40 million customers across 35 countries, and achieved operational profitability in Turkey. In May 2025 Uber acquired 85% of Trendyol Go for $700 million, while Turkish antitrust authorities have maintained ongoing compliance obligations following a 2023 dominant-position abuse finding.

sections:
  - id: identity-business-model
    title: Identity, Headquarters & Product Ecosystem
    body: >-
      Trendyol (legal entity: DSM Grup Danışmanlık İletişim ve Satış Ticaret A.Ş.) is headquartered in Istanbul, Turkey, and operates as Turkey's largest multi-category e-commerce marketplace. Founded in 2010, the platform began as a fashion-focused online retailer and evolved into a full-stack superapp combining marketplace retail, proprietary logistics, instant delivery, digital payments, and secondhand commerce. Its core product is the Trendyol marketplace, where over 250,000 sellers offer goods across fashion, electronics, home goods, FMCG, and beauty — with fashion accounting for roughly 31% of total GMV. The marketplace is supported by Trendyol Express, an own-logistics arm handling 2.5 million package deliveries per day across 35 countries, and Trendyol Pay, an embedded digital wallet layered across all verticals. Trendyol Go provided food and grocery delivery through 19,000 couriers and 90,000 restaurant and grocery partners, but an 85% stake was sold to Uber in May 2025. Dolap, a secondhand fashion marketplace hosting 1.4 million individual sellers, rounds out the ecosystem. Following Turkish e-commerce law amendments effective January 2024, Trendyol's private-label (PL) brands were separated into a standalone app and website called TrendyolMilla. The company holds an estimated 34–40% share of Turkey's total e-commerce market and is part of Alibaba International Digital Commerce Group (AIDC). International revenue represents approximately 20% of total business as of 2025, with the Gulf and Europe as the primary growth corridors. Trendyol operates in all six GCC countries and 27+ European countries, with Saudi Arabia as its second-largest market globally.
    claimRefs: [CO001, CO003, CO011, CO012, CO013, CO035, CO036, CO037, CO038]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]

  - id: founders-leadership-governance
    title: Founders, Leadership & Corporate Governance
    body: >-
      Trendyol was co-founded by Demet Mutlu, Evren Üçok, and Begüm Tekin. Demet Mutlu, born 1981, graduated cum laude from New York University with a degree in Economics and attended Harvard Business School, which she left after her first year to return to Istanbul and address what she identified as a trust-and-distribution gap in Turkish fashion e-commerce. She bootstrapped the company with $300,000 of personal savings and has been recognized by Fortune magazine, the World Economic Forum's Young Global Leaders program, and as one of Europe's most inspiring women in technology. Mutlu is also a co-founder of Peak Games, subsequently acquired by Zynga for $1.8 billion. Evren Üçok, co-founder from inception, serves as Chairman. Begüm Tekin, the third co-founder, serves as Managing Partner. Day-to-day operational leadership is held by Erdem İnanç (CEO) and Çağlayan Çetin (Group President), who manages international strategy and investor relations. Çetin has publicly stated the company's IPO criterion: reaching 50% international revenue before listing. Alibaba, as the ~70% majority shareholder, has influence over strategic direction through its board representation and technology partnership. Key-person risk is concentrated in the founder-CEO Mutlu and Group President Çetin given their prominence in public communications and investor relations. No material leadership changes have been publicly reported as of May 2026.
    claimRefs: [CO002, CO016, CO017, CO018, CO030, CO041]
    tableRefs: [TO002]
    figureRefs: []

  - id: funding-investors-ownership
    title: Funding History, Investors & Ownership Structure
    body: >-
      Trendyol has completed a series of landmark funding rounds since 2010. Tiger Global made the first institutional investment in July 2010, followed by a $26 million Series A co-led by Kleiner Perkins Caufield & Byers and Tiger Global in 2011 — the first top-tier Silicon Valley VC bet on Turkish tech. The European Bank for Reconstruction and Development also invested in a subsequent round circa 2014. The pivotal transaction came in June 2018 when Alibaba Group acquired a majority stake for approximately $728 million, the largest internet-sector investment in Turkey at the time. Alibaba then invested a further $350 million in April 2021 at a $9.4 billion valuation, bringing its stake to approximately 86.5% before subsequent secondary activity. The defining milestone followed in August 2021: Trendyol raised $1.5 billion led by General Atlantic, SoftBank Vision Fund 2, and Princeville Capital, alongside sovereign wealth funds ADQ (Abu Dhabi) and Qatar Investment Authority, valuing the company at $16.5 billion and making it Turkey's first decacorn. Total capital raised across all rounds is estimated at approximately $2.65 billion. Alibaba's stake has since settled at approximately 70% as of 2024–2026. Exact minority shareholder percentages for financial investors are not publicly disclosed. In November 2024, Bloomberg reported Trendyol was informally gauging interest for a $1 billion fundraise, though no transaction was confirmed as of May 2026. The sale of 85% of Trendyol Go to Uber for $700 million in May 2025 constituted a partial capital event for the group, though the proceeds are primarily within the Trendyol Go entity. Trendyol targets a dual listing in Istanbul plus London or New York once international revenue exceeds 50% of total sales.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO032, CO039, CO043]
    tableRefs: [TO003]
    figureRefs: []

  - id: scale-metrics-market-position
    title: Scale, Key Metrics & Market Position
    body: >-
      Trendyol is the dominant force in Turkish e-commerce, holding an estimated 34–40% of total online market share in the country as of 2024. The company served 40 million customers and delivered 2.5 million packages per day across 35 countries as of 2025 — figures the company has communicated publicly. Its 2024 GMV reached $12.5 billion, representing year-over-year growth of 30–35% per analyst estimates; Alibaba's fiscal year 2024 results confirmed Trendyol order growth exceeded 20% year-over-year. The company crossed a major operational threshold in 2023 by achieving its first operational profitability in Turkey. Trendyol Go, prior to the Uber transaction, generated $2 billion in gross bookings in 2024 on 200 million+ orders — a 50%+ year-over-year increase. Employee headcount is estimated at 10,885–11,504 globally across group entities, though the range varies across data sources and may reflect different entity perimeters. Trendyol's Gulf operations launched in August 2023 and surpassed $1 billion in Gulf GMV by end-2024, with Saudi Arabia accounting for approximately 75% of regional orders. In Turkey, electronics (41%) and fashion (31%) dominate category mix. The platform hosts 600,000+ daily visitors in Saudi Arabia alone as of late 2024. Revenue per se is not publicly disclosed; the company is private and does not release audited financial statements. Trendyol had developed Turkey's first proprietary large language model, in collaboration with Alibaba's chip and machine-learning infrastructure.
    claimRefs: [CO003, CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO019, CO021, CO022, CO031, CO033, CO040]
    tableRefs: []
    figureRefs: []

  - id: milestones-regulatory-adverse
    title: Milestones, Regulatory History & Adverse Events
    body: >-
      Trendyol's corporate history spans a founding phase defined by rapid consumer trust-building, a strategic pivot enabled by the Alibaba partnership in 2018, a decacorn fundraise in 2021, persistent antitrust scrutiny from 2021 onwards, and an international expansion push from 2020 through 2026. The Turkish Competition Authority (TCA) launched a preliminary investigation in September 2021 into allegations that Trendyol abused its dominant position in multi-category online marketplaces by manipulating algorithms to favour its private-label (PL) brands and using third-party seller data for its own retail advantage. In July 2023 the TCA issued its final decision, finding Trendyol dominant in multi-category e-marketplaces and finding two specific abuses: algorithmic manipulation to favour PL products, and improper use of third-party seller data. The Board imposed a TRY 61.3 million administrative fine (approximately EUR 2–5.8 million depending on conversion date) and ongoing obligations including versioned retention of algorithm changes for three years. Trendyol appealed parts of the interim measures, and in 2022 committed to a separate package regarding data portability obligations related to its subsidiary Dolap. Under Turkey's amended e-commerce law (effective January 2024), Trendyol was prohibited from selling its PL products on its main marketplace, which it addressed by launching the TrendyolMilla platform. In July 2024 the TCA re-evaluated the obligations: algorithmic obligations were deemed moot given the PL separation, while data-related obligations were upheld. No new formal TCA investigation against Trendyol was reported in Q1 2026. On the positive milestone side: Trendyol launched Trendyol Express in 2018, entered 27 European countries in October 2020, achieved decacorn status in August 2021, turned operationally profitable in Turkey in 2023, and in May 2025 reached an agreement for Uber to acquire 85% of Trendyol Go at a $700 million valuation for that arm.
    claimRefs: [CO020, CO023, CO024, CO025, CO026, CO027, CO028, CO034, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001]

