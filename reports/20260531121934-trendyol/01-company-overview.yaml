callouts:
  - calloutType: strength
    title: Decacorn Scale with Operational Profitability
    body: Trendyol achieved $12.5B in 2024 GMV, 40M+ customers, and became operationally profitable in Turkey in 2023 — a rare combination for an emerging-market e-commerce platform. The superapp architecture creates cross-vertical switching costs that sustain its 34–40% market share leadership.
    claimRefs: [CO003, CO013, CO014]

  - calloutType: risk
    title: Antitrust Compliance Obligations & Ongoing TCA Scrutiny
    body: The TCA's July 2023 finding of dominant-position abuse — including algorithm manipulation and third-party seller data misuse — resulted in a TRY 61.3M fine and ongoing obligations. Data-related compliance requirements were upheld in the TCA's 2024 re-evaluation. These obligations impose operational constraints and reputational risk, and the TCA continues active enforcement in digital markets in 2026.
    claimRefs: [CO023, CO024, CO025, CO026]

  - calloutType: risk
    title: Valuation Opacity & IPO Pre-condition Not Yet Met
    body: The last publicly disclosed valuation of $16.5B dates to August 2021. The company is private with no audited public financials. The stated IPO criterion — 50% international revenue — is approximately 20 percentage points away as of 2025. A new funding round or IPO will surface current valuation, but timing and conditions remain uncertain.
    claimRefs: [CO029, CO030, CO039, CO043]

  - calloutType: insight
    title: Alibaba Majority Ownership Creates Both Opportunity and Structural Risk
    body: Alibaba's ~70% stake provides Trendyol with technology, logistics, and capital resources that competitors cannot replicate independently. However, it also creates Alibaba's geopolitical and Chinese regulatory overhang as a risk factor for international investors, particularly in the EU and Gulf markets where Trendyol is expanding.
    claimRefs: [CO005, CO035]

