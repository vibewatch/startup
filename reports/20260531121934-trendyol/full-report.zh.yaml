      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              近期最强增长催化剂，是监管迫使 Temu 和 SHEIN 退出土耳其市场。土耳其逐步收紧跨境进口门槛：从 2023 年 €150 降至 2024 年 8 月 €30，再到 2024 年 12 月 €27，并从
              2026 年 2 月 6 日起完全取消免税额度。结果是 SHEIN 暂停土耳其销售，Temu 将平台限制为本地备货商品。行业估计，被重新分流的年交易量约
              $1.5B，其中大部分流向本土平台。这相当于清除了来自中国跨境平台的最低价竞争层，让本土龙头在时尚和电子品类获得温和定价权；不过行业人士警告，这也可能带来轻微通胀效应，削弱部分价格敏感品类的消费者需求。结构性驱动因素包括互联网渗透率上升（2025
              年 90.9%，2024 年 88.8%）、电商占零售比重提高（2024 年占 GDP 6.9%，2019 年为 2.7%）、移动优先基础设施，以及政府积极推动出口的项目（目标电商出口
              $8–10B）。反向约束也很实质。土耳其通胀在 CBRT 激进收紧后仍于 2025 年中约为 33–38%，2025 年底预测为 29%；这会侵蚀消费者购买力，并制造定价波动。土耳其里拉 自 2024
              年中以来贬值超过 20%，推高 Trendyol 与进口挂钩的物流成本（燃油、车辆、技术），也让向国际投资者报告的美元指标暴露在汇率风险中。TCA 反垄断承诺（2024
              年接受的自我优待和数据可携带让步）限制了平台部分促销和算法做法。Law No. 7416 以及 2025 年修订案对大型平台施加递增合规义务，包括强制本地代表要求（2025 年 4
              月生效）、年度卖家数据核验、新的远程合同消费者权利（2026 年 1 月生效）以及广告预算上限。Amazon Turkey
              落后于本土龙头，但仍有全球供应链和品牌信任；若投入本地物流，可能逐步拿份额。Hepsiburada 2025 年 12 月获得 Kaspi.kz TRY
              4.17B（$97.6M）资金，用于加速中小企业数字工具，显示竞争投资强度。即时零售年增长 50%+，在 Trendyol GO
              剥离后构成品类风险，因为快速杂货和餐饮配送可能越来越多地从核心平台蚕食时效敏感购物。
