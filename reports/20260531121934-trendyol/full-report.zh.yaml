        - 通过 Trendyol 在线市场购买的时尚、电子、家居、美妆、杂货和综合商品；第三方卖家 GMV，以及抽佣和广告收入
        - B2B 企业批发、实体零售、市场平台外服务、线下交易
        - 个人消费者（以 25–44 岁、城市、移动端为主）；家庭预算、信用分期计划
        - 核心主市场；Trendyol 按 GMV 捕获该细分市场 34–40%（2025）
      - - 即时零售和餐饮配送
        - 按需杂货（2 小时内）、餐厅配送、最后一公里即时订单
        - 计划 / 预约式电商、传统杂货配送、非即时品类
        - 追求便利的城市移动端用户；高收入客群购买高端餐厅
        - 已出售给 Uber（2025 年 5 月，$700M）；现已不在 Trendyol 合并 GMV 边界内
      - - 跨境时尚出口（海湾 / MENA）
        - 通过 Trendyol 国际市场平台，向沙特、阿联酋、科威特、卡塔尔和巴林购物者销售的土耳其时尚、服饰、家居和美妆
        - 非土耳其货源商品、海湾本地实体零售、没有土耳其供应链源头的非时尚品类
        - 追潮流和偏保守着装的海湾消费者；土耳其侨民；价格敏感外籍人士
        - 活跃扩张市场；海湾 4M+ 活跃用户（公司披露）；已宣布 $2B 投资计划
      - - 对欧洲跨境出口
        - 销往欧洲消费者（德国、荷兰等）的土耳其时尚、服饰和家居商品
        - EU 注册零售（Amazon EU、Zalando）、非土耳其制造商品、EU 实体零售
        - 欧洲土耳其侨民；被价格 / 质量吸引的欧洲时尚消费者
        - 小于海湾；监管和物流复杂度更高；是相邻市场而非核心
      - - 第三方卖家生态
        - 170,000+ 卖家支付的市场平台上架费、广告 CPM/CPC、履约费和 Trendyol Pay 处理费
        - 卖家在平台外的 DTC 销售、独立店铺
        - 把 Trendyol 作为主要电商渠道的土耳其 SME、品牌和进口商
        - 抽佣收入是主要变现方式；卖家增长直接推动 TAM 渗透
