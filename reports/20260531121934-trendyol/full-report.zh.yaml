            body: >-
              土耳其线上零售经济在结构上原生依附平台：单个品牌自营店拿到的份额极小，前三大平台（Trendyol、Hepsiburada、Amazon Turkey）估计占电商总量 60%。Trendyol
              以较大优势领先，2025 年 GMV 超过 $14B，并估计占 B2C 平台交易 34–40%。Hepsiburada（NASDAQ: HEPS）位居其后，按美元 GMV 约为 Trendyol
              规模的五分之一；FY2025 GMV 为 TRY 257.5B（IAS 29 调整后，按 2025 年平均汇率约 $5B），2026 年 Q1 GMV 为 TRY 57.8B（同比 +28.4%）。Amazon
              Turkey 尽管拥有全球品牌资产和物流基础设施，按月流量仍排第三（2026 年 4 月约 34.6M 次访问，Trendyol 约 120M，Hepsiburada 约 59.7M），且未披露土耳其
              GMV。N11（Doğuş Planet）是遥远第四，月访问量约 12.6M，估计年收入为低数千万美元。竞争格局还包括 Sahibinden（分类广告 / 二手商品，属于不同细分）和 ÇiçekSepeti（礼品
              / 生活方式垂直）。过去十二个月最重要的两个竞争事件，是 Temu/SHEIN 的监管退场，以及 Uber 整合 Getir 与 Trendyol GO；两者对 Trendyol
