      - number: '5.4'
        title: 物流技术——Trendyol Express
        blocks:
          - type: paragraph
            body: >-
              Trendyol Express (TEX) 是集团自营末端物流部门，也是土耳其电商格局中最具运营差异化的资产之一。TEX 通过 75+ 个配送中心组成的网络覆盖土耳其全部 81 个省份，每天处理约 2.5
              million 个包裹配送。这种物流密度短期内几乎无法复制，已经成为相对于依赖第三方承运商、配送速度受限的竞争对手的一道关键结构性护城河。

              伊斯坦布尔旗舰设施于 2022 年完工，面积 72,078 m²，从最早规划阶段就使用 Building Information Modelling
              (BIM)，以优化自动化系统与实体结构的整合。该设施包含两个主要体量：一个拥有 120 个装卸口、可同时处理 150 辆卡车的配送中心，以及一个集成式 5 层自动化仓库。仅这一设施就服务超过 1,800
              名员工。设施层面的技术整合包括 AI 驱动的 Warehouse Management System (WMS)，用于优化拣货、打包和基于条码的 QC；AI 路线优化以减少单次配送时间；以及通过 Kafka
              事件流将近实时运营数据接入集团 BigQuery 分析平台。

              商业上，TEX 按 desi 对卖家收取单包裹费用：0–2 desi 包裹为 77.54 TL，11–15 desi 包裹升至约 192.81 TL（2026 年公开费率）。TEX 的双重角色——既服务
              Trendyol 交易平台订单的内部物流，也可能向第三方提供物流即服务——同时带来协同和披露模糊性：内部 TEX 成本与收入未单独披露。截至 2026 年 5 月，土耳其主要城市支持当日达，TEX
              为土耳其大部分地区提供次日达承诺。国际物流建设包括计划中的 65,000+ m² 欧洲履约中心，用来服务德国和 CEE 市场。
