      - number: '8.2'
        title: 可比公司估值框架
        blocks:
          - type: paragraph
            body: >-
              Trendyol 最相关的上市可比公司是 Hepsiburada（HEPS）、Coupang（CPNG）、Sea Limited / Shopee（SE）和 MercadoLibre（MELI），
              覆盖从土耳其直接同业到新兴市场多品类市场平台的谱系。截至 2026 年 5 月，Hepsiburada 企业价值约 $809 million， 基于 FY2025 约 TRY 257.5 billion（按当前
              USD/TRY 约 $5 billion）GMV，隐含 EV/Revenue 约 0.47x、EV/GMV 约 0.16x。 Hepsiburada
              是唯一直接上市同业，但规模小得多，国际化程度也低得多，因此更适合作为下行锚，而不是中枢情景。 Coupang 的 EV 约 $29–38 billion，FY2025 收入约 $35.1 billion，隐含
              EV/Revenue 约 0.82x；更强的物流基础设施和韩国市场主导地位， 支持其相对 Hepsiburada 有小幅溢价。Sea Limited 的电商分部（Shopee）Q1 2026 GMV 为 $9.3
              billion（年化约 $37 billion）， 电商 EV/Revenue 约 1.2x，持续恢复盈利支撑了这个倍数。MercadoLibre 以 2.3–3.2x EV/Revenue
              享有溢价，反映其金融科技整合 （Mercado Pago）和拉美主导网络效应；如果 Trendyol 的超级 App 目标完全落地，MELI 代表长期乐观路径。同业 EV/Revenue 中位数约 1.0x。把
              0.8–1.2x 套用到 Trendyol 估计收入 $1.8–2.5 billion，隐含企业价值为 $1.4–3.0 billion，远低于 $16.5 billion 标记。 即便给到慷慨的 3x
              EV/Revenue、按 MELI 可比溢价计算，也只有 $5.4–7.5 billion。以当前收入估计倒推，2021 年标记隐含 EV/Revenue
              6.6–9.2x；多家数据提供商显示，当前新兴市场电商倍数已较 2021 年峰值压缩 40–60%。
