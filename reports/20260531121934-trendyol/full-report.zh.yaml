            title: 土耳其里拉贬值与通胀是结构性利润率和计量风险
            body: >-
              年通胀处于 33–38%，里拉自 2024 年中以来贬值超过 20%，Trendyol 面临双重风险：消费者购买力被侵蚀，名义需求增长被削弱；与进口挂钩的物流成本通胀挤压抽佣率。对查看美元指标的投资者来说，里拉
              走弱可能同时抬高以 TL 计的增长率，又压低折算成美元后的规模。平台经济性与宏观波动之间的不利相互作用没有任何公开财务细节披露；在按报道的 $16.5B 峰值估值承保前，这是重大尽调领域。
