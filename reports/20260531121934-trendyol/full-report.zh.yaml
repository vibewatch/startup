      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 2021 年标记已经过时五年，且来自另一个宏观周期
            body: >-
              Trendyol 的 $16.5 billion 估值标记来自 2021 年 8 月，当时零利率货币政策把全球成长股倍数推到接近历史高位。新兴市场电商 EV/Revenue 倍数此后已压缩 40–60%。把当前
              Coupang/Sea 中位数倍数（约 1x EV/Revenue）套用到 Trendyol 估计收入 $1.8–2.5 billion，隐含企业价值为 $1.4–3.0 billion。 任何把 2021
              年标记当作当前公允价值的投资人，都在使用一个反映已不存在宏观周期的基准。
            calloutType: risk
            claimRefs:
              - CV001
              - CV023
              - CV024
              - CV034
          - type: callout
            title: 没有独立经审计财报，估值只能是知情估算，不是经验证数字
            body: >-
              Trendyol 从未发布独立经审计财务报表。所有收入和盈利估计——包括本章使用的 $1.8–2.5 billion 收入区间——都来自把抽佣率假设套用到第三方 GMV 估计， 再结合 Alibaba AIDC
              分部披露。AIDC 分部把 Trendyol、AliExpress 和 Lazada 打包在一起。在 NDA 下提供独立 Big 4 审计账目，或进入 IPO 招股说明书流程之前， 任何 Trendyol
              估值分析都只能是知情近似。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV032
          - type: callout
            title: Q4 FY2026 AIDC 接近盈亏平衡，是多年里最重要的正向估值信号
            body: >-
              Alibaba Q4 FY2026 AIDC 分部亏损同比收窄约 96% 至 RMB 138 million（约 $19 million），表明包含 Trendyol 的该分部接近盈亏平衡。如果 Trendyol
              是这轮改善的驱动方或贡献方， 这就是 AIDC 分部成立以来第一个可信的综合国际盈利信号。只要这一趋势延续到 FY2027，基准情景（$5–9B）会改善，乐观情景概率也会小幅上移。
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV038
          - type: callout
            title: 重置进入点：什么会让 Trendyol 值得投资
            body: >-
              如果新一轮新股融资估值在 $5–9 billion，按 $2.0–2.5 billion 估计收入计算，Trendyol 定价为 2.0–3.5x EV/Revenue；这高于 Coupang/Sea 中位数（约
              1x）， 但土耳其市场主导地位、海湾期权价值和超级 App 潜力可以支撑这份溢价。若估值为 $5–7 billion，且 NDA 核验财务显示土耳其 EBITDA 为正、国际收入 >30%，
              风险调整后的进入点就具备可行性。2021 年 $16.5 billion 标记不具备。门槛是有记录、经验证的估值重置，而不是传闻中未确认的 $1 billion 同估值融资。
            calloutType: insight
            claimRefs:
              - CV026
              - CV032
              - CV033
              - CV038
