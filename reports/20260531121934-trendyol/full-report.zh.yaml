    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品生态
        blocks:
          - type: paragraph
            body: >-
              Trendyol（法律实体：DSM Grup Danışmanlık İletişim ve Satış Ticaret A.Ş.）总部位于土耳其 Istanbul，是土耳其最大的多品类电商平台。公司创立于
              2010 年，平台最初是聚焦时尚的线上零售商，之后演化为全栈超级 App，把平台零售、自有物流、即时配送、数字支付和二手交易放进同一套生态。核心产品是 Trendyol 平台：超过 250,000
              名卖家在上面销售时尚、电子、家居、FMCG 和美妆等商品，其中时尚约占整体 GMV 的 31%。平台背后有 Trendyol Express 支撑，这一自有物流部门覆盖 35 个国家，每天处理 2.5M
              个包裹配送；Trendyol Pay 则是嵌入所有垂直业务的数字钱包。Trendyol Go 通过 19,000 名骑手和 90,000 家餐厅及杂货伙伴提供餐饮和生鲜配送，但 85% 股权已于 2025 年 5
              月出售给 Uber。Dolap 是二手时尚平台，承载 1.4M 名个人卖家，补齐了生态。土耳其电商法修订案于 2024 年 1 月生效后，Trendyol 的自有品牌（PL）被拆分到独立 App 和网站
              TrendyolMilla。公司估计占土耳其整体电商市场 34–40%，隶属于 Alibaba International Digital Commerce Group（AIDC）。截至 2025
              年，国际收入约占总业务 20%；海湾与欧洲是主要增长走廊。Trendyol 覆盖全部 6 个 GCC 国家和 27+ 个欧洲国家，Saudi Arabia 是其全球第二大市场。
