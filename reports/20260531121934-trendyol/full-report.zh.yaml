      - number: '4.3'
        title: 资本结构、充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Trendyol 最近一次公开披露估值来自 2021 年 8 月融资轮，为 $16.5 billion；该轮由 General Atlantic、SoftBank Vision Fund 2
              和海湾主权财富基金共同领投，募资 $1.5 billion。所有已披露融资轮累计募资约 $2.65 billion，Alibaba 持有公司约 70%
              股权。逐轮融资时间线已在公司概况章节列示；本章聚焦当前资本充足性。

              现金余额和月度烧钱速度未披露。资本充足性的关键信号包括：（1）Bloomberg 2024 年 11 月报道，Trendyol 正在非正式试探约 ~$1 billion 融资；截至 2026 年 5
              月未确认交易，说明估值预期可能与投资者报价不一致，或 Alibaba 后盾已足够；（2）2024 年底起三年内约 $2 billion 的海湾投资承诺，意味着公司仍会持续大规模投放资本；（3）Uber 2025
              年 5 月以 $700 million 收购 Trendyol Go 85% 股权——该交易已由 Uber 的 SEC 8-K 确认——在 Trendyol Go
              实体层面形成一次资本事件，但流向母集团的资金分配未公开披露。

              自 2021 年以来没有新股权融资，同时国际扩张仍在继续，Trendyol 可能由土耳其经营现金流、Alibaba 集团内支持，以及 2021 年融资剩余储备共同供血。Alibaba 关系带来 Trendyol
              特有的融资依赖：若存在集团内条款，其具体安排未披露，对独立投资者构成重大的转让定价风险。Trendyol 的 IPO 仍以国际收入占比达到 50% 为条件——目前约 20%——按当前增长轨迹，最早现实窗口也在
              2028 年之后。
