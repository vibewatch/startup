      - number: '1.2'
        title: 创始人、领导层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Trendyol 由 Demet Mutlu、Evren Üçok 和 Begüm Tekin 联合创立。Demet Mutlu 生于 1981 年，以优等成绩毕业于 New York University
              经济学专业，之后就读 Harvard Business School；第一年结束后，她离校回到 Istanbul，想解决她看到的土耳其时尚电商信任与分发缺口。她用 $300,000 个人积蓄自举创办公司，并曾获
              Fortune magazine、World Economic Forum Young Global Leaders 项目认可，也被评为欧洲最具启发性的科技女性之一。Mutlu 还是 Peak Games
              的联合创始人；Peak Games 后来以 $1.8B 被 Zynga 收购。Evren Üçok 自公司创立起就是联合创始人，目前担任董事长。第三位联合创始人 Begüm Tekin 担任管理合伙人。日常经营由
              Erdem İnanç（CEO）和 Çağlayan Çetin（集团总裁）负责；Çetin 管国际战略和投资者关系。Çetin 公开说明过公司的 IPO 门槛：上市前国际收入需达到 50%。Alibaba
              作为约 70% 多数股东，通过董事会席位和技术合作影响战略方向。关键人物风险集中在创始人兼 CEO Mutlu 和集团总裁 Çetin，两人在公开沟通和投资者关系中都非常突出。截至 2026 年 5
              月，未见公开报道的重大领导层变动。
