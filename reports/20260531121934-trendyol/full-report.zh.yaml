      - number: '8.3'
        title: 乐观、基准、悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，三个情景框定可信估值区间，每个情景都锚定 GMV 增长、国际收入轨迹和流动性事件时点的不同假设。 悲观情景（$2–4B）：倍数压缩到 Hepsiburada 类水平（EV/GMV
              0.10–0.16x），驱动因素包括无法在 2021 年标记以上吸引新资本、 FX 继续恶化以及国际收入持续停滞。该情景假设出现 $2–3 billion 的估值下调融资或压力老股交易，或以 $3–4
              billion 战略价值出售。 TrendyolGo 剥离先例（某分部整体价值 $824M）和 Alibaba 的 AIDC 盈利压力支撑这条底线。基准情景（$5–9B）：把 Coupang/Sea 类倍数
              （EV/Revenue 0.8–1.2x）套用到 FY2026 估计收入 $1.8–2.5 billion，再加上海湾增长溢价。该情景假设新股融资在 $5–7 billion 估值交割 （显著低于 2021
              年标记），或 2027–2028 年以 $7–9 billion 双重上市 IPO，前提是国际收入达到 35–40%。土耳其国内运营盈利能力是此情景的底线锚。 乐观情景（$10–16B）：MercadoLibre
              类路径（EV/Revenue 2.0–3.0x），触发条件包括海湾市场成功渗透至 $3–5B GMV、国际收入达到 45–50%、 TrendyolPay 与金融服务的超级 App 变现，以及在 $12–16B
              区间 IPO。该情景要求 50% 国际收入的 IPO 前提达成或被正式豁免，并假设土耳其通胀继续按 CBRT 13–19% 的 2026 年底目标稳定。
