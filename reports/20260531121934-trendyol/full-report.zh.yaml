  - id: FE002
    title: 客户工作流 / 运营流程 — 从上架到配送
    type: flow
    summary: Trendyol 市场平台交易的端到端流程：从卖家上架，经 AI 丰富、买家发现、结账、物流调度，到反馈捕捉。所有节点都代表由官方和交叉验证来源记录的生产流程。
    data:
      nodes:
        - label: 卖家创建商品（面板或 API）
          detail: >-
            卖家通过 Seller Panel UI 或 OAuth2 REST API（developers.trendyol.com）上传；字段包括标题、描述、条码、品类、价格、库存数量。API 支持批量上传和
            webhook 式订单状态轮询。
        - label: AI 丰富流水线
          detail: >-
            Trendyol LLM 生成多语言商品描述；E-Commerce Product Image Encoder（ConvNeXt）对照目录去重；Background Removal（IS-Net）清理商品照片；基于
            AI 的品类匹配分配分类。AI 匹配让国际上架速度提升 60%。
        - label: 搜索索引与 ML 排序
          detail: 商品进入 Elasticsearch 索引；Two-Tower 神经模型为商品 - 用户亲和度打分（商品向量嵌入 × 用户向量嵌入）；混合排序融合统计评分、情绪数据和神经相关性信号。
        - label: 买家通过个性化信息流 / 搜索发现
          detail: 买家打开 Trendyol App；Two-Tower 推荐引擎提供个性化结果；视觉搜索（DinoV2 Image Similarity）支持按图发现商品；170M+ SKU 目录覆盖 30+ 品类。
        - label: 下单 — Trendyol Pay 处理支付
          detail: 通过 Trendyol Pay（嵌入式钱包）结账；为土耳其买家提供分期（taksit）选项；订单事件发送到 Kafka；订单管理微服务通过 Temporal 触发履约工作流。
        - label: Trendyol Express 配送中心分配与发运
          detail: AI 路由将订单分配给 75+ TEX 配送中心中最近的一个；WMS 通过条码质检拣货和打包；由拥有 120 个装卸口的伊斯坦布尔枢纽或同等区域枢纽发运；覆盖全部 81 个省，每天配送 2.5M 单。
        - label: 最后一公里配送与买家收货
          detail: 主要城市当日达；标准为次日达；快递扫描事件通过 Kafka 流入近实时 Looker 仪表盘，供运营团队使用。AI 路线优化带来 20% 效率提升（公司披露）。
        - label: 购后：评价、情绪分析、模型再训练
          detail: 买家提交评分 / 评价；AI 情绪分析摄取结构化反馈；信号回流到推荐排序和卖家质量评分；Looker 分析为卖家和运营团队捕捉转化、利润率和活动表现指标。
      edges:
        - from: Seller creates listing (panel or API)
          to: AI enrichment pipeline
          label: 商品提交触发 AI 丰富
        - from: AI enrichment pipeline
          to: Search index & ML ranking
          label: 丰富后的商品进入索引并排序
        - from: Search index & ML ranking
          to: Buyer discovers via personalized feed / search
          label: 买家看到排序后的结果
        - from: Buyer discovers via personalized feed / search
          to: Order placed — Trendyol Pay processes payment
          label: 买家选择商品并结账
        - from: Order placed — Trendyol Pay processes payment
          to: Trendyol Express DC assignment and dispatch
          label: 订单事件触发 TEX 履约流程
        - from: Trendyol Express DC assignment and dispatch
          to: Last-mile delivery & buyer receipt
          label: 包裹从配送中心发出
        - from: Last-mile delivery & buyer receipt
          to: 'Post-purchase: review, sentiment analysis, model retraining'
          label: 确认送达，启动反馈闭环
        - from: 'Post-purchase: review, sentiment analysis, model retraining'
          to: Search index & ML ranking
          label: 情绪信号回流排名模型
