      - number: '6.2'
        title: 国际客户分群——海湾、CEE 与德国
        blocks:
          - type: paragraph
            body: >-
              到 2025 年底，Trendyol 国际客户超过 9 million，集中在三条增长走廊：海湾合作委员会（GCC）、中东欧（CEE）和作为西欧旗舰的德国。

              在海湾，截至 2025 年 10 月，Trendyol 在 UAE、Saudi Arabia、Bahrain、Kuwait、Oman 和 Qatar 合计超过 3.7 million 名活跃客户、9
              million 次应用下载。高峰期平台月订单超过 1 million，其中 Saudi Arabia 单独贡献约 75–80% 的海湾订单。Saudi Arabia 现已成为 Trendyol
              全球第二大市场。海湾消费者行为被描述为“发现驱动”而非基于明确意图：海湾购物者会浏览灵感、寻找策划式集合，这推动 Trendyol 在 Instagram、Snapchat 和 TikTok 上投入
              15,000+ 个创作者合作。配送基础设施投入（本地仓库、末端合作伙伴 Aramex 和 Saudi Post）把配送时间从最长九天缩短到约四天。Trendyol 将 Iraq 作为下一个扩张市场。

              在 CEE，Trendyol 于 2024 年初在 Romania、Greece、Hungary、Czech Republic、Slovakia、Poland 和 Bulgaria 上线本地化平台。到 2024
              年 12 月，该地区拥有 2.2 million 名活跃购物者、7 million 次应用下载，日订单约 27,000。Romania 以 1.5 million 名活跃购物者领跑该地区（占 CEE 总量
              70%），售出超过 16 million 件商品，拥有 6,600 名活跃卖家，2024 年复购率为 47%——这是目前最强的公开留存代理指标。一个 50,000 m² 的罗马尼亚履约中心于 2025 年 2
              月在 Ștefănești 开业，支持两日达。

              在德国——Trendyol 2022 年上线的第一个国际市场——平台在前 12 个月内突破 1 million 名客户，如今已跻身德国下载量最高的时尚应用之列。德国客户主要被土耳其时尚品牌（LC
              Waikiki、Koton、Mavi、Defacto）和全球品牌（Valentino、Puma、Skechers）吸引。公司目标是在 2025–2026 年实现德国收入 €3 billion。截至 2025
              年，国际收入整体约占集团总业务的 20%，距离公开披露的 IPO 门槛——国际收入占比 50%——仍有明显差距。
