  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、竞争法与法律风险
        blocks:
          - type: paragraph
            body: >-
              Trendyol 长期处在多层监管敞口之下。Turkish Competition Authority (TCA) 于 2023 年 7 月认定，Trendyol
              在多品类在线交易平台中滥用主导地位，方式包括（i）通过算法偏向其自有品牌（PL）产品，以及（ii）为自营零售利益滥用第三方卖家数据，因此处以 TRY 61.3 million 行政罚款（约 EUR 2–6
              million，取决于换算日期）。Trendyol 对部分临时措施提出上诉，并承诺结构性补救，包括把 PL 产品拆分到专门平台（TrendyolMilla）；该安排按 2024 年 1 月生效的土耳其修订版
              E-Commerce Law 落地。TCA 在 2024 年 7 月重新评估时认为，鉴于 PL 已拆分，算法相关义务基本不再适用，但由于竞争担忧仍在，数据相关义务被维持。2024 年 11 月，TCA 接受了
              Trendyol 关于自动定价机制的承诺（不强制、不激励、透明沟通、为卖家提供竞争培训），并结束一项调查。不过，2025 年 12 月的 TCA
              公告确认，九起公开和六起保密卖家投诉已在一项新询问中被评估——TCA 拒绝启动完整新调查，但明确指出 Trendyol 的主导地位和竞争影响仍是持续关注点。土耳其 2025
              年竞争法进展显示，监管对数字平台的姿态明显更强硬，承诺、重新评估和多轮行为补救成为偏好的工具。土耳其之外，Trendyol 的海湾扩张使其面对 Saudi 数据驻留和电商监管要求；若 EU
              市场进一步加深，还可能触发 Digital Markets Act (DMA) 预评估。KVKK（Law No. 6698）及其 2024 年 Law No. 7499 修正案（使跨境传输机制与 GDPR
              对齐）下的数据隐私风险是结构性的：Trendyol 是 40 million+ 消费者记录和 250,000+ 卖家账户的数据控制者，2026 年 KVKK 罚则表下，数据泄露罚款最高可达 TRY 10
              million。Trendyol 运营所在 EU 国家适用 GDPR 镜像义务。若未维持 VERBIS 注册或错过违规通知期限，将触发重大罚款和声誉损害。
