      - number: '7.4'
        title: 跨境、IPO 与战略执行风险
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的国际扩张——自 2020 年进入 27+ 个欧洲国家，2023 年 8 月进入海湾——是最核心的战略逻辑， 也是最大的执行风险。海湾业务完整运营第一年（截至 2024 年底）GMV 已突破
              $1 billion，其中沙特约占区域订单 75%。不过，2024 年底宣布的 $2 billion 海湾投资承诺，是在本地单位经济模型被证明前就先下注的重资本策略：
              履约基础设施建设、阿拉伯语本地化、本地监管合规，以及 Amazon、Noon 和本土强手（Jarir、Namshi）的竞争，
              都会持续形成负持有成本。跨境监管风险也很实质：沙特电商规则围绕数据驻留、产品标准和数字支付快速变化；土耳其 2026 年 2 月取消免税门槛会利好国内 GMV，但在 GCC 市场没有对应红利，Trendyol
              在那里是新进入者，不是既有龙头。 IPO 执行风险很尖锐：公司设定的前提是国际收入占 50%，而 2025 年披露的国际收入占比约 20%，仍差约 20–30 个百分点； 公司也没有公开承诺 IPO
              时间表。2021 年轮次的财务投资人（General Atlantic、SoftBank Vision Fund 2、Princeville Capital、ADQ、QIA）在 IPO
              时间表无限期打开的情况下，退出时间压力越来越大。如果被迫做老股交易，或以显著低于 $16.5 billion 的估值下轮融资，投资人回报和声誉定位都会受损。关键人物执行风险也高：Demet Mutlu（创始人兼
              CEO） 和 Çağlayan Çetin（集团总裁，国际战略）均未宣布继任者，一旦离任，将显著冲击投资人信心和运营连续性。
