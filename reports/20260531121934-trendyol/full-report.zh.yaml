      - number: '6.3'
        title: 卖家与品牌伙伴生态
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的 250,000+ 名活跃商家是电商平台的供给侧基础。绝大多数是土耳其中小企业和独立品牌，通过 Trendyol 自助 Seller Centre
              运营；该中心提供实时表现分析、需求预测、定价建议和库存管理。平台集成可通过有文档的 OAuth2 Seller API（developers.trendyol.com）编程完成，支持直接连接 ERP 和
              CRM——这一功能吸引中端市场和更大型品牌伙伴。ChannelEngine 等多渠道电商平台把 Trendyol 列为主要土耳其电商平台集成，说明它已进入全球卖家工作流的制度化环节。

              国际品牌合作是 Trendyol 海湾和欧洲雄心的关键战略杠杆。2025 年，Alshaya Group——75+ 个全球品牌在 MENA 的加盟运营商——把 American Eagle、Bath & Body
              Works 和 H&M 带入 Trendyol 的 GCC 平台，让海湾消费者可在线直接购买已在实体零售中建立信任的品牌。在海湾 SME 分群，Trendyol 于 2025 年 5 月与 Zid（Saudi
              Arabia 领先电商赋能平台）合作，导入数千名已经在 Zid 基础设施上运营的 Saudi 和 UAE 商家，大幅降低卖家激活门槛。截至 2025 年 10 月，5,000+
              名海湾本地卖家已上线平台，贡献海湾全部商品销售的 35%。Romania 卖家数量为 6,600，平台持续推进本地品牌内容占销售比例从 10% 提升到 2025 年底的 30%。

              卖家经济性结构上承压。Trendyol 2026 年佣金表从电子产品的 8–12% 到时尚品类的 18–25% 不等，另有每单约 ₺8.49 加 VAT 的服务费。MercanWorks 针对土耳其卖家的
              2026 年 P&L 分析发现，扣除佣金、物流费、退货准备金（时尚品类退货率 20–30%）和广告支出后，时尚品类平均净利率可被压缩到售价的低至 11.5%——总扣减吃掉总收入的
              20–35%。这种卖家经济性压力既是平台摩擦风险（若替代方案出现，卖家可能流失），也是关于平台对供给侧抽租式定价权的反向信号。
