      - number: '5.6'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的合规架构覆盖土耳其本土法律（KVKK）、欧洲业务适用的 EU 数据保护规则（GDPR），以及 Turkish Competition Authority (TCA) 针对电商的具体监管。根据
              KVKK（Law No. 6698 及其 2025 年修正案），Trendyol 已在 Personal Data Protection Authority（KVKK Board）维护的 VERBIS
              登记簿中注册为数据控制者。2025 年 KVKK 修正案收紧跨境数据传输规则，引入分层机制（充分性决定、标准合同条款和例外传输），为 Trendyol 面向 EU 的数据流增加了合规义务。德国和 EU
              业务必须遵守 GDPR；Trendyol 发布了数据保护声明，但未公开披露 EU→Turkey 数据处理所使用的具体跨境传输机制。

              多实体数据隔离通过 Google Cloud 内 Looker 的基于角色访问策略执行，防止集团公司（交易平台、Dolap、国际实体）在共享 BigQuery 平台上相互访问数据——这是 Trendyol BI
              团队公开强调的一项要求。集团在 trendyol.com/s/kisisel-verilerin-korunmasi 维护公开 KVKK/GDPR 数据保护页面，覆盖数据类别、法律依据和数据主体权利。

              2025 年自我优待调查承诺带来的 TCA 义务，要求 Trendyol
              为卖家维持数据可携带性，包括导出分析数据和客户互动数据的能力——这是一项结构性让步，温和降低卖家切换成本，也对数据护城河形成法律约束。Trendyol Pay 的 PCI-DSS 合规状态尚未公开确认；与 Ant
              International 的 fintech JV（截至 2026 年 5 月仍待监管批准）将为合并后的支付和借贷平台引入额外的土耳其中央银行（BDDK）及监管要求。

              反向信号：Dolap 在 Google Play 的用户评论（2026 年 5 月）显示，卖家持续不满佣金费用，最高约 25%，且配送成本偏高。这构成产品质量风险：Dolap
              的供给侧流动性取决于卖家是否认为经济性可行，而 Trendyol 收购后持续的负面情绪趋势是需要监测的风险。截至报告日期，未有影响 Trendyol Group 的重大公开数据泄露事件被报道。
