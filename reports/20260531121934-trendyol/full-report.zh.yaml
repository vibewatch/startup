              监管报告处于积极监控中；这些承诺限制了特定促销和算法做法。约束带来的金额影响并未公开披露。任何假设抽佣率高于当前水平继续扩张的估值模型，都应评估监管容忍度——TCA 的 Law No. 7416
              框架明确针对大型平台自我优待，Trendyol 是土耳其监管记录中被点名的主要对象。
