  - id: FM003
    title: 买家 / 分部地图
    type: flow
    layout: wide
    summary: 土耳其电商采用路径以移动端为先、天然依赖市场平台；消费者从社交 / App 发现商品，进入平台比价，再通过分期融资结账并复购。
