      - number: '3.2'
        title: 直接竞争对手——Hepsiburada 与 Amazon Turkey
        blocks:
          - type: paragraph
            body: >-
              在完整综合平台品类中，Hepsiburada 是 Trendyol 最可信的本土竞争对手。其 2026 年 Q1 财务数据（TRY 57.8B GMV、20.3M 订单、11.6M 活跃客户、101.6K
              活跃商户）确认增长延续，但盈利压力也持续存在——2026 年 Q1 净亏损扩大至 TRY 992M，2025 全年净亏损达到 TRY 5.7B。公司平台 GMV 占比在 2026 年 Q1 保持在 68.9%，与
              Trendyol 模型一致。Hepsiburada 的战略变量，是被 Kaspi.kz 收购：Kaspi.kz 是 Kazakhstan 在 NASDAQ 上市的超级 App，并在 2025 年 12 月获得
              TRY 4.17B 资本注入。Kaspi 带来经过验证的超级 App 方法论（支付、借贷、平台）和耐心资本，使 Hepsiburada 成为比当前盈利情况显示的更危险的长期挑战者。Amazon Turkey 于
              2018 年进入，采用直采进口和第三方平台模型。它受益于全球供应链接入、Prime 会员计划、支持土耳其商户跨境出口的国际卖家关系，以及 25
              年全球纪录积累的品牌信任。核心限制在于本地化深度较低（语言、支付方式、taksit 分期结构）、本土卖家池更小，也没有等同于 Trendyol Express 自有最后一公里覆盖的能力。Amazon Turkey
              月流量约 34.6M，明显低于 Trendyol 约 120M 和 Hepsiburada 约 59.7M，且没有披露土耳其特定 GMV
              或收入。更合适的理解是：它是一个持续存在、资本充足的第三名威胁，而不是马上挑战领导地位的玩家。
