      - number: '5.5'
        title: 开发者触点、集成与外部信号
        blocks:
          - type: paragraph
            body: >-
              在新兴市场电商平台运营商中，Trendyol 的外部开发者触点是技术成熟度较强的信号之一。developers.trendyol.com 开发者门户以土耳其语和英语提供完整 API 文档，覆盖 Seller
              Integration API；该 API 使用 OAuth2（Client ID / Client Secret）认证，并开放 RESTful
              端点，用于商品上架与更新、库存和价格管理、订单抓取与状态更新、发货标签生成、退货处理、发票提交和客户咨询管理。API 让卖家能够以程序化方式把 ERP、CRM 和第三方电商工具连接到 Trendyol，并提供
              Postman 集合和速率限制文档。这使 Trendyol 交易平台不只依赖 UI 面板，也能通过集成伙伴触达中端和企业级卖家。

              在 GitHub 上，Trendyol 组织（github.com/Trendyol）托管 175+ 个仓库，并保持活跃维护和公开贡献。关键开源项目包括：Baklava（TypeScript 设计系统，约
              ~1.4k 星标，136 名贡献者）、Medusa（Kotlin Android fragment 栈控制器，495 星标，59 名贡献者）、android-guidelines（架构与编码标准，435
              星标，33 名贡献者）、kink（Go Kubernetes KinD 集群管理 CLI，382 星标，29 名贡献者）和 Stove（Kotlin JVM 端到端测试框架，约 ~309 星标，21
              名贡献者）。这组开源组合显示，工程社区参与覆盖后端、移动、DevOps 和前端。Trendyol Tech 落地页（trendyol.github.io）记录了强调
              TDD、CI/CD、结对编程和持续学习的工程文化。

              会议分享进一步证明工程成熟度：TBP 在 PlatformCon 2025 展示（KubeVela/OAM IDP 演讲），Temporal 工作流编排在 Temporal Replay 2025 分享，2026
              年 2 月 Trendyol Campus 的 AI/ML Summit 通过 Anadolu Ajansı 报道触达行业工程师。Trendyol 的 AI 模型在 HuggingFace（Trendyol
              组织）发布并可下载，提供了可量化的开发者采用信号。根据 CTO Cenk Çivici 的公开表述，截至 2026 年，工程团队约有 2,000+ 名工程师。
