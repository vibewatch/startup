      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 土耳其是平台优先市场，Trendyol 占据结构性位置
            body: >-
              多数电商市场里，品牌网站会与平台竞争；土耳其不同，电商几乎原生依附平台。这使 Trendyol 34–40% 的 GMV 份额比数字本身更耐久：它不是分散市场里的 34%，而是在平台主导池子里拿下
              34–40%，且前两大玩家吃掉大部分交易量。这个结构性位置带来显著定价权含义，也让获客经济性不同于强 DTC 竞争市场。
