  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >-
              Trendyol 最近一次外部估值标记是 $16.5 billion，来自 2021 年 8 月的 $1.5 billion Series C 轮；该轮由 General Atlantic、 SoftBank
              Vision Fund 2、ADQ（Abu Dhabi Developmental Holding Company）和 Qatar Investment Authority（QIA）共同领投，
              Princeville Capital 也参与。Alibaba 于 2018 年收购约 70% 控股权，未参与 2021 年轮次，但保留了控制权。2021 年融资发生在
              全球成长股估值重估周期的峰值，当时零利率货币政策和创纪录的新兴市场电商倍数共同推高估值；到 2026 年，这些条件已实质逆转。 2024 年 11 月，Bloomberg 报道 Trendyol 正在探索约 $1
              billion 融资，隐含估值持平或略低；截至 2026 年 5 月，尚未确认交割。 没有新轮融资，意味着 $16.5 billion 标记已经是近五年前的过时参考。Trendyol
              没有发布独立经审计财报；主要公开财务窗口是 Alibaba 的 AIDC（Alibaba International Digital Commerce）分部，它把 Trendyol 与
              AliExpress、Lazada 打包在一起。AIDC 在 FY2025 录得约 $2.09 billion 亏损。不过，Alibaba Q4 FY2026 AIDC 结果显示，分部亏损同比收窄约 96% 至
              RMB 138 million （接近盈亏平衡），释放出单位经济模型改善的信号。TrendyolGo 这家即时零售子公司于 2025 年 5 月出售给 Uber，价格约 $700 million（85%
              股权，隐含该业务整体实体价值约 $824 million）。外汇背景很关键：截至 2026 年初，USD/TRY 已贬至 50–52 区间，即便里拉计价 GMV 名义增长，美元口径指标仍被压缩。
