          - type: callout
            title: 土耳其国内运营盈利能力是价值保全底线
            body: >-
              在这组风险里，土耳其国内业务自 2023 年以来实现运营盈利——Alibaba FY2025 AIDC 披露也给出佐证——是关键的价值保全锚。 如果国际扩张不及预期，Trendyol
              的土耳其国内业务（34–40% 市场份额、运营盈利、40M+ 客户）仍是一块有防御性的资产底座， 足以支撑显著高于零的独立估值。这不能消除跨境和资本市场风险，但能提供有意义的下行底线。
