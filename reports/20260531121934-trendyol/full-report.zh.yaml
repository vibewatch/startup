  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 牌照 / 案件
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 缓释措施
      - 残余敞口
      - 尽调路径
    rows:
      - - TCA 2023 年滥用支配地位案（算法自我优待）
        - 土耳其
        - 已缴纳罚款；关于数据使用的行为义务维持有效（2024 年 7 月复评）
        - 中 — 若违反数据义务，可能重新调查
        - 高 — 可能下达运营禁令或强制结构性整改
        - 通过 TrendyolMilla 分离自有品牌；TCA 关于定价机制的承诺（2024 年 11 月）
        - 数据使用义务仍在；2025 年 12 月评估新的卖家投诉
        - 审阅 TCA 决定全文；获取合规官证明；审计数据隔离架构
      - - TCA 2024 年 11 月定价机制承诺
        - 土耳其
        - 承诺获接纳；调查在附条件下关闭
        - 低 — 遵守承诺期间案件关闭
        - 中 — 若自动定价激励再次出现，有重启风险
        - 承诺：不强制动态定价、透明披露、卖家培训、定期向 TCA 报告
        - 监控义务持续多年；任何偏离都会迅速触发重启
        - 索取承诺文本和监控时间表；核验卖家沟通记录
      - - TCA 2025 年 12 月卖家投诉问询（9 起公开、6 起保密投诉）
        - 土耳其
        - 未启动全面调查；承认支配地位和竞争影响
        - 中 — 若模式持续，可能成为未来调查依据
        - 高 — 若升级为全面调查，行为性整改会增多
        - 提升平台透明度；为被停用卖家提供申诉流程；算法文档化
        - 承认支配地位担忧，但并未就所有问题以调查结案
        - 获取 TCA 公告细节；将卖家投诉类别映射到合规缺口
      - - KVKK / 第 7499 号法（2024 修正案）数据隐私合规
        - 土耳其
        - 合规义务生效中；需完成 VERBIS 注册
        - 中低 — 监管方会主动关注 Trendyol 规模的数据控制者
        - 高 — 罚款最高 TRY 10M；泄露通知会带来声誉损害
        - 隐私政策对齐 KVKK/GDPR 标准；依第 7499 号法使用跨境 SCC/BCR
        - 截至 2026 年 5 月，未确认针对 Trendyol 的公开 KVKK 执法行动
        - 获取 VERBIS 证书；审计跨境传输机制；审查泄露通知预案
      - - 沙特电商数据驻留与监管要求
        - 沙特阿拉伯 / GCC
        - 生效中；沙特 PDPL 执法正在加速
        - 中 — 海湾监管环境快速演进
        - 高 — 在 Trendyol 第二大市场可能失去经营牌照或被罚款
        - 按 $2B 海湾投资承诺规划本地数据中心
        - 数据中心建设时间表与执法日期之间的缺口尚未确认
        - 确认 PDPL 合规状态；审计沙特订单的本地数据驻留
      - - 随着海湾 / 欧洲规模扩大，EU GDPR / 潜在数字市场法（DMA）适用性
        - EU
        - 尚未触发——Trendyol 未被指定为 EU 守门人
        - 当前低；若 EU GMV 跨过 DMA 门槛则上升
        - 高 — DMA 指定意味着互操作、数据共享和非自我优待义务
