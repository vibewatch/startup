      - number: '1.3'
        title: 融资历史、投资人与股权结构
        blocks:
          - type: paragraph
            body: >-
              Trendyol 自 2010 年以来完成多轮标志性融资。Tiger Global 于 2010 年 7 月进行了第一笔机构投资；随后 2011 年，Kleiner Perkins Caufield &
              Byers 和 Tiger Global 共同领投 $26M Series A，这是顶级 Silicon Valley 风投首次押注土耳其科技公司。European Bank for Reconstruction
              and Development 也在约 2014 年的后续轮次中投资。关键交易发生在 2018 年 6 月：Alibaba Group 以约 $728M 收购多数股权，这是当时土耳其互联网领域最大投资。之后
              Alibaba 又在 2021 年 4 月以 $9.4B 估值追加 $350M 投资，使其在后续二级交易前持股升至约 86.5%。决定性里程碑出现在 2021 年 8 月：Trendyol 融资 $1.5B，由
              General Atlantic、SoftBank Vision Fund 2 和 Princeville Capital 领投，ADQ（Abu Dhabi）和 Qatar Investment
              Authority 等主权财富基金跟投，公司估值达到 $16.5B，成为土耳其首个十角兽。各轮累计融资估计约 $2.65B。2024–2026 年，Alibaba 持股已稳定在约
              70%。金融投资人的确切少数股比例未公开披露。2024 年 11 月，Bloomberg 报道 Trendyol 曾非正式试探 $1B 融资兴趣，但截至 2026 年 5 月没有交易确认。2025 年 5
              月，Trendyol Go 85% 股权以 $700M 出售给 Uber，构成集团的一次部分资本事件，不过所得主要留在 Trendyol Go 实体内。Trendyol 的目标是，当国际收入超过总销售额 50%
              后，在 Istanbul 以及 London 或 New York 双重上市。
