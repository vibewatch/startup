              Trendyol 从未发布独立经审计财务报表。唯一的一手公开披露被打包在 Alibaba 合并口径的 AIDC 分部业绩中，后者聚合了 Trendyol、AliExpress、Lazada
              和其他业务。没有管理层提供的账目，投资者无法独立重建 Trendyol 的收入、利润率或现金状况。这是任何独立财务评估中最关键的约束。
