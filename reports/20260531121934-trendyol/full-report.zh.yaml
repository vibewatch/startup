          to: Seller / customer attrition
          label: 数据可携带义务降低卖家切换成本
        - from: TCA enforcement (data-use obligations)
          to: Regulatory escalation (further TCA/KVKK action)
          label: 合规违约触发新调查
        - from: Turkish lira / macro shock
          to: Revenue impairment (GMV compression)
          label: 里拉贬值侵蚀美元 GMV
        - from: Turkish lira / macro shock
          to: Valuation mark-down / refinancing cost
          label: 更高折现率压缩估值倍数
        - from: Alibaba strategic / capital pivot
          to: Capital shortfall (Gulf investment gap)
          label: 若 AIDC 战略变化，资本供给撤回
        - from: Alibaba strategic / capital pivot
          to: Valuation mark-down / refinancing cost
          label: 母公司降低优先级，压低隐含企业价值
        - from: Cyber breach / consumer data loss
          to: Seller / customer attrition
          label: 泄露后消费者流失放大 3.5–4x
        - from: Cyber breach / consumer data loss
          to: Regulatory escalation (further TCA/KVKK action)
          label: 触发 KVKK / Saudi PDPL 执法
        - from: Gulf execution failure
          to: Capital shortfall (Gulf investment gap)
          label: 海湾收入变慢，延长资本开支需求
        - from: Gulf execution failure
          to: IPO delay / investor exit impairment
          label: 国际收入占比停在 50% 门槛以下
        - from: Revenue impairment (GMV compression)
          to: Valuation mark-down / refinancing cost
          label: 收入下降压低 DCF 终值
        - from: Seller / customer attrition
          to: Revenue impairment (GMV compression)
          label: 流失叠加 GMV 下滑（反馈回路）
        - from: Regulatory escalation (further TCA/KVKK action)
          to: IPO delay / investor exit impairment
          label: 监管阴影阻碍公开市场上市
        - from: Capital shortfall (Gulf investment gap)
          to: IPO delay / investor exit impairment
          label: 资本缺口迫使折价老股交易
