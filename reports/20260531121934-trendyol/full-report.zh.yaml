      - number: '1.5'
        title: 里程碑、监管历史与反向事件
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的公司历史经历了几个阶段：早期靠快速建立消费者信任起家，2018 年借 Alibaba 合作完成战略转向，2021 年融资成为十角兽，2021 年起持续受到反垄断审查，并在 2020–2026
              年推进国际扩张。土耳其竞争管理局（TCA）于 2021 年 9 月启动初步调查，指控 Trendyol 在多品类线上平台中滥用主导地位：操纵算法偏向自有品牌（PL），并使用第三方卖家数据谋取自营零售优势。2023
              年 7 月，TCA 发布最终决定，认定 Trendyol 在多品类电商平台中具有主导地位，并认定两项具体滥用：算法操纵以偏向 PL 产品，以及不当使用第三方卖家数据。委员会处以 TRY 61.3M
              行政罚款（按换算日期不同约为 EUR 2–5.8M），并施加持续义务，包括对算法变更保留三年版本记录。Trendyol 对部分临时措施提出上诉，并在 2022 年 围绕子公司 Dolap
              的数据可携带义务作出另一套承诺。土耳其修订后的电商法于 2024 年 1 月生效后，Trendyol 被禁止在主平台销售自有品牌产品，公司以推出 TrendyolMilla 平台应对。2024 年 7 月，TCA
              重新评估这些义务：由于 PL 已拆分，算法义务被认为不再适用；数据义务则维持。截至 2026 年 Q1，未见针对 Trendyol 的新正式 TCA 调查。正向里程碑包括：Trendyol 2018 年推出
              Trendyol Express，2020 年 10 月进入 27 个欧洲国家，2021 年 8 月成为十角兽，2023 年在土耳其实现运营层面盈利，并在 2025 年 5 月达成协议，由 Uber 以该业务
              $700M 估值收购 Trendyol Go 85% 股权。
