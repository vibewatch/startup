      - number: '1.4'
        title: 规模、关键指标与市场地位
        blocks:
          - type: paragraph
            body: >-
              Trendyol 是土耳其电商的主导力量，截至 2024 年，估计占该国线上市场总份额 34–40%。公司公开沟通过的 2025 年数据包括：服务 40M 客户、在 35 个国家每天配送 2.5M
              个包裹。2024 年 GMV 达到 $12.5B，按分析师估计同比增长 30–35%；Alibaba FY2024 业绩确认，Trendyol 订单同比增长超过 20%。公司在 2023
              年跨过重要运营门槛，首次在土耳其实现运营层面盈利。Uber 交易前，Trendyol Go 2024 年总预订额为 $2B，订单数超过 200M，同比增长 50%+。集团全球员工数估计为
              10,885–11,504 人，但不同数据源口径不同，可能反映了不同实体边界。Trendyol 海湾业务于 2023 年 8 月启动，到 2024 年底海湾 GMV 已超过 $1B，其中 Saudi Arabia
              约占区域订单 75%。在土耳其，电子（41%）和时尚（31%）主导品类结构。截至 2024 年末，平台仅在 Saudi Arabia 就有 600,000+
              日访客。严格意义上的收入未公开披露；公司为私营企业，不发布经审计财务报表。Trendyol 已与 Alibaba 的芯片和机器学习基础设施合作，开发出土耳其首个自研大语言模型。
