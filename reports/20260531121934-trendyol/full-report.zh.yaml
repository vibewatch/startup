          detail: 推送通知、忠诚计划和 Trendyol Pay 返现拉动重复访问。支付方式绑定后，平台粘性较高；切换成本主要来自习惯，而非合同。
          tone: positive
        - id: n6
          label: 海湾 / MENA 平行路径
          detail: 海湾跨境买家遵循同样的移动 App → 市场平台 → 支付路径，但面临更长配送提前期，以及汇率 / 海关因素。4M+ 海湾活跃用户（公司披露）验证了路径可行性。
