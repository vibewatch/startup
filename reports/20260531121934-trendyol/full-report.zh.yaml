  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与电商生态范围
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的主要可服务市场，是土耳其国内 B2C 与 C2C
              线上平台经济。这个市场结构很特殊：单个品牌自营网站基本缺席，平台（Trendyol、Hepsiburada、N11）拿走线上零售交易的绝大部分份额。因此，Trendyol
              在电商里的市场边界异常宽，同时市场份额集中度也异常高。为 Trendyol 承保时，相关支出池包括：消费者通过平台购买时尚、电子、家居、美妆和杂货；第三方卖家生态（170,000+
              名卖家）贡献的抽佣收入；支付和钱包服务（Trendyol Pay）；以及面向海湾和欧洲消费者的跨境出口平台。截至 2025 年中，不再纳入 Trendyol 合并边界的是即时零售和餐饮配送（Trendyol
              GO），该业务已于 2025 年 5 月以 $700M 剥离给 Uber。B2B 企业采购和传统线下零售不属于直接机会。相邻市场——海湾时尚零售、欧洲跨境、金融科技 /
              支付——是真实机会，但今天远小于国内平台业务。土耳其电商出口市场从 2022 年 $2.2B 增至 2024 年 $6.4B，政府 2025 年目标为
              $8B，这是近期最重要的相邻机会。土耳其消费者的现状替代品包括实体零售（仍是主导支出渠道，电商占 GDP 6.9%，欧洲约
              17%）、品牌自营网站（土耳其很少见）以及传统线下集市和连锁零售。平台主导的结构意味着，消费者在品类内切换平台成本相对低，但离开平台型购物形态的成本高。
