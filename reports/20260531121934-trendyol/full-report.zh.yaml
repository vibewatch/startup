            title: 尽管土耳其本土业务改善，AIDC 分部亏损在 FY2025 仍几乎翻倍至 $2.09B
            body: >-
              Alibaba FY2025 年度新闻稿（BusinessWire，2025 年 5 月）确认，AIDC 调整后 EBITA 亏损从 FY2024 的 USD 1.1B 扩大到 FY2025 的 USD
              2.09B，并明确归因于“对 AliExpress 和 Trendyol 跨境业务的投入”。虽然 Trendyol
              土耳其本土盈利能力改善，但国际扩张已经成为显著且仍在扩大的财务拖累；任何投资者都必须把它作为有别于土耳其本土业务的单独风险来承销。
