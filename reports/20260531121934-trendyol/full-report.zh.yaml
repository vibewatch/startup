  - id: FV001
    title: 推荐逻辑
    type: dag
    summary: 有向无环图展示从 Trendyol 业务基本面和可比公司分析到「持有 / 观察」建议的逻辑链，捕捉核心分支条件。
    approximationNotes: 所有节点反映截至 2026 年 5 月的公开证据。未获得内部管理层指引或审计财务。
    data:
      nodes:
        - label: 土耳其基本盘强
          detail: GMV 份额 34–40%；40M+ 客户；自 2023 年起经营层面盈利
        - label: 海湾扩张期权
          detail: $2B 承诺；海湾首年 GMV $1B；沙特阿拉伯占海湾 75%
        - label: 超级应用 / 金融科技期权
          detail: TrendyolPay、金融服务；TrendyolGo 于 2025 年 5 月剥离给 Uber
        - label: 2021 年 $16.5B 估值已陈旧（5 年）
          detail: 估值设在零利率倍数峰值；截至 2026 年 5 月未确认新一轮融资
        - label: EV/Revenue 6.6–9.2x，对比同业中位数 ~1x
          detail: 较 Coupang / Sea 可比公司溢价 5–8x；新兴市场倍数压缩 40–60%
        - label: 无单体审计财务
          detail: 结构性约束；AIDC 分部是唯一公开窗口；未披露四大审计
        - label: IPO 前置条件缺口：30pp
          detail: ~20% 国际收入占比，对比 50% 要求；未承诺时间表
        - label: 乐观情景（$10–16B）
          detail: 类 MELI 轨迹；海湾突围；IPO；EV/Revenue 2.0–3.0x
        - label: 基准情景（$5–9B）
          detail: Coupang / Sea 倍数；新股融资重设；2027–2028 年按 0.8–1.2x IPO
        - label: 悲观情景（$2–4B）
          detail: 类 HEPS EV/GMV；降价轮或困境出售；Alibaba AIDC 转向
        - label: 建议：持有 / 观察
          detail: 若新股融资重设至 $5–9B 可重新进入；$16.5B 上轮标记需回避
      edges:
        - from: Strong Turkey fundamentals
          to: Bull case ($10–16B)
          label: 本土护城河 + 国际化突围
        - from: Gulf expansion optionality
          to: Bull case ($10–16B)
          label: 海湾 GMV ×3–5，国际占比 45–50%
        - from: SuperApp / fintech optionality
          to: Bull case ($10–16B)
          label: TrendyolPay 规模化变现
        - from: Strong Turkey fundamentals
          to: Base case ($5–9B)
          label: 本土盈利底线
        - from: Gulf expansion optionality
          to: Base case ($5–9B)
          label: 海湾推进有限；国际占比 25–35%
        - from: 2021 mark $16.5B stale (5yr)
          to: Bear case ($2–4B)
          label: 未重设；倍数压缩；降价轮
        - from: EV/Revenue 6.6–9.2x vs. peer median ~1x
          to: 'Recommendation: Hold / Watch'
          label: 当前进入价严重高估
        - from: No standalone audited financials
          to: 'Recommendation: Hold / Watch'
          label: 财务基本面未经尽调
        - from: 'IPO pre-condition gap: 30pp'
          to: 'Recommendation: Hold / Watch'
          label: 退出能见度受限；2021 年投资人难以退出
        - from: Base case ($5–9B)
          to: 'Recommendation: Hold / Watch'
          label: 若轮次重设至基准情景，作为重新进入门槛
        - from: Bear case ($2–4B)
          to: 'Recommendation: Hold / Watch'
          label: 若 Alibaba 转向或宏观恶化，则落入下行情景
    claimRefs:
      - CV001
      - CV010
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV002
    title: 估值敏感性
    type: range
    summary: 柱状图展示 Trendyol 在 EV/Revenue 倍数（0.5x–3.0x）和收入估计（$1.8B–$2.5B）矩阵下的隐含企业价值，并以 2021 年最后估值标记（$16.5B）作为参考线。
    approximationNotes: 收入估计来自对 FY2025 GMV >$14B 套用 12–16% 抽佣率。Trendyol 未披露收入数据。倍数区间基于上市可比公司分析（Hepsiburada、Coupang、Sea、MercadoLibre）。
    data:
      items:
        - label: 0.5x（HEPS 底线）
          low: 0.9
          mid: 1
          high: 1.25
          displayValue: $0.9–1.3B
          detail: Hepsiburada 水平倍数；困境可比公司底线
          tone: negative
        - label: 0.8x（类 Coupang）
          low: 1.44
          mid: 1.6
          high: 2
          displayValue: $1.4–2.0B
          detail: Coupang 中位数；相较 2021 年估值标记隐含 88–91% 折价
          tone: negative
        - label: 1.2x（Sea / Shopee）
          low: 2.16
          mid: 2.4
          high: 3
          displayValue: $2.2–3.0B
          detail: Sea Limited 可比；相较 2021 年估值标记折价 82–87%
          tone: negative
        - label: 2.0x（MELI 折价）
          low: 3.6
          mid: 4
          high: 5
          displayValue: $3.6–5.0B
          detail: MercadoLibre 折价情景；乐观情景基准
          tone: neutral
        - label: 3.0x（MELI 平价）
          low: 5.4
          mid: 6
          high: 7.5
          displayValue: $5.4–7.5B
          detail: 完全达到 MELI 平价——需要 SuperApp 得到验证 + IPO
          tone: neutral
        - label: 6.6–9.2x（2021 年估值标记隐含）
          low: 11.88
          mid: 14.4
          high: 16.5
          displayValue: $12–16.5B
          detail: 2021 年估值标记隐含倍数——ZIRP 高峰期；当前可比公司不支持
          tone: negative
