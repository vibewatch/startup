          detail: 50% 国际收入前置条件未满足；2021 年投资者流动性缺口延长
        - label: 资本缺口（海湾投资缺口）
          detail: 海湾承诺 $2B 投入；2024 年 11 月 $1B 融资未确认；AIDC 亏损兜底不确定
      edges:
