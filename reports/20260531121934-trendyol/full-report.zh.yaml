      - number: '3.4'
        title: 结构性护城河与切换成本分析
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的竞争耐力靠三根结构性支柱撑住，且各自都有独立佐证；复制它们需要大量资本和时间。第一，Trendyol Express 这一自有物流部门截至 2026 年 5 月在土耳其全部 81 个省运营
              75 个配送中心，可在 Istanbul、Ankara 和 Izmir 当日达，在多数主要城市次日达，高峰期日处理能力超过 1.5M
              个包裹。竞争对手主要依赖第三方承运商（PTT、Aras、Yurtiçi），造成可衡量的速度和成本差距。第二，170,000+ 卖家生态（比 Hepsiburada 约 102K 商户多
              67%）产生自有行为数据，支撑 Trendyol 的搜索排序、动态定价和推荐算法。卖家投入资源接入 Trendyol 的
              API、目录工具和广告系统；这种沉没集成成本在佣金压力上升时，也会降低自愿离开的比例。第三，嵌入式金融科技层（Trendyol Pay
              钱包、BNPL、卖家信贷）把商户营运资金和消费者支付行为绑到平台上。多平台经营——卖家同时在 Trendyol 和 Hepsiburada 上架——很常见，但不能消除 Trendyol
              的交易量优势；客户基数不对称（Trendyol 35M+ 活跃用户，Hepsiburada 约 12M）意味着，离开 Trendyol 就会失去触达土耳其电商最大可服务受众的入口。TCA 2024
              年承诺（TrendyolMilla 自有品牌产品与主平台分离、数据可携带义务）限制了部分算法做法，但尚未实质改变平台规模或卖家参与度。TCA
              持续监测数据可携带，是长期卖家锁定效应的主要监管风险：若严格执行，卖家把历史分析数据迁移到竞争平台的成本可能下降。
