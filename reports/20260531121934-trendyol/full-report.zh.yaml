          detail: Trendyol 以搜索为主的界面展示竞争卖家；价格、卖家评分和配送速度是主要比较因素。市场平台占主导，意味着多数消费者留在 Trendyol 或 Hepsiburada 内。
          tone: positive
        - id: n3
          label: 分期 / 钱包结账
          detail: Taksit（信用分期）和 Trendyol Pay BNPL 降低高客单商品支付门槛；数字钱包以 12.34% CAGR 增长（Mordor）。消费者价格敏感度高；促销实质性拉动转化。
          tone: positive
        - id: n4
          label: 配送与履约
          detail: 次日达和预约配送是主要质量差异点。29% 的网购者报告过配送问题（TurkStat 2025）；慢配送是第一大流失触发因素。Trendyol Express 物流是关键护城河。
