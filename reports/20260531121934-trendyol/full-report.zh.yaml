companyProfile:
  summary: >-
    Trendyol 是土耳其占主导地位的多品类电商平台，2010 年创立于 Istanbul，由 Alibaba Group 持有多数股权（约 70%）。平台连接超过 250,000 名卖家和 40M+ 客户，估计占土耳其整体 GMV
    的 34–40%。Trendyol 的纵向一体化模型包括自有物流部门 Trendyol Express、即时零售服务 Trendyol Go（其中 85% 已于 2025 年 5 月以 $700M 出售给 Uber）、广告网络
    Trendyol Ads，以及数字钱包 Trendyol Pay。公司 FY2024 GMV 约 $12.5B，FY2025 超过 $14B。国内业务于 2023 年实现运营层面盈利。公司正在向海湾地区（2023 年 8
    月启动）以及中东欧扩张，但国际收入约占 20%，距离公司所称 IPO 前置条件 50% 仍有差距。
