      - number: '4.4'
        title: GMV、公开牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Trendyol 最可靠、可交叉印证的公开牵引指标是商品交易总额（GMV）：FY2024 约 $12.5 billion（同比增长约 ~30–35%），FY2025 超过 $14 billion。2024
              年订单量约增长 47%，2023 年已超过 1 billion 单。平台覆盖 40 million 名客户（公司口径）和 250,000+ 名卖家。海湾业务首个完整年度实现 $1 billion
              GMV，Trendyol Go 在出售给 Uber 前实现 $2 billion 总预订额；这些公司披露数据与平台运营规模相互匹配。

              收入、毛利率、EBITDA、净利润、经营现金流、资本开支，以及任何粒度的分部单位经济全部未公开。Alibaba AIDC 披露是唯一的一手公开财务窗口；它把 Trendyol 与
              AliExpress、Lazada 等业务打包披露，无法拆出 Trendyol 的独立贡献。若投资者把 Trendyol 作为独立资产评估，无法取得经审计财务报表、管理账或债务 / 授信条款。

              土耳其里拉贬值带来可比性风险。Hepsiburada 采用 IAS 29 通胀会计，以现价单位重述历史数据；Trendyol 的 GMV 主要以 USD 表述，但底层以 TRY 计价，而 2021–2024 年
              TRY 兑美元累计贬值约 50–60%。按恒定汇率看，真实 GMV 增长可能低于 USD 口径数字显示的水平——这是投资模型中的重要变量。

              出口动能值得关注：Trendyol 的目标是 2024 年出口 GMV 达到 $2 billion，并在 2026 年通过 300,000 名卖家微型出口商做到 $10 billion。土耳其电商出口额从
              2022 年的 $2.2 billion 增至 2024 年的 $6.4 billion。不过，跨境出口通常有效抽佣率低于本土交易，因为国际物流成本、清关因素和货币兑换摩擦会吃掉一部分收益。
