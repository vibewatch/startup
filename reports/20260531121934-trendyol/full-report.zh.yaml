      - number: '5.2'
        title: 平台工程与基础设施
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的工程骨干是微服务架构，150+ 个产品和平台团队管理 7,000+ 个服务。为了降低由此带来的认知负荷，公司搭建了 Trendyol Builder Platform (TBP)——一个由
              KubeVela 和 Open Application Model (OAM) 驱动的内部开发者平台（IDP），并集成 Argo Rollouts 做渐进式部署（canary 和 blue-green
              策略）、FluxCD 做 GitOps 配置管理、Prometheus 做可观测性。TBP 在 PlatformCon 2025 公开展示，团队称 DORA
              指标改善，开发者部署到生产环境的认知负荷下降。另一个独立信号是 Trendyol 使用 Temporal——一个开源持久化工作流编排引擎——处理订单履约流和数据库自动化等长周期、容错流程。公司在 Temporal
              的使用由内部开发者平台数据库团队的一名高级软件工程师于 Replay 2025 分享。

              数据基础设施落在 Google Cloud 上：约 2019 年，Trendyol 从本地部署的数据仓库迁移到 BigQuery，原因是高峰期扩容失败导致收入机会流失。迁移同时引入 Looker 作为企业 BI
              层，让 1,500+ 名员工获得近实时自助分析能力。Black Friday 2023 高峰当天，系统处理了超过 260,000 次 Looker 查询（平日均值为 110,000 次）。Google Cloud
              Consulting 优化了 Looker 缓存机制，使数据刷新时间改善 38%。访问控制通过 Looker 的基于角色策略执行，防止 Trendyol 集团内公司之间在共享 BigQuery
              平台上发生跨实体数据泄漏；这是土耳其监管框架下的法律要求。

              核心技术栈包括：Go 用于 CDC 系统和 Kafka 封装，Kotlin 用于 JVM 后端服务和 Android 开发，TypeScript 用于前端（包括 Baklava 设计系统），Python 用于
              ML/AI 工作负载。持久化层覆盖 PostgreSQL、Couchbase 和 Redis；Elasticsearch 负责搜索索引。这是一套成熟的多语言技术栈，符合大型全球电商平台运营商的规模特征。
