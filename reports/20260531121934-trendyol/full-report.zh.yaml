      - number: '8.4'
        title: 投资逻辑、终止触发点与建议
        blocks:
          - type: paragraph
            body: >-
              以 $16.5 billion 最近估值标记看，2026 年 5 月 Trendyol 对新投资人并不是一个风险调整后合适的进入点。隐含倍数（EV/Revenue 6.6–9.2x）
              是当前新兴市场电商同业中位数的 5–8x，最近标记已接近五年，且公司距离自己设定的 IPO 前提仍有 30 个百分点差距。没有独立经审计财报， 独立财务核验无法完成。因此，整体建议是持有 /
              观察，重新进入的门槛是估值被有意义地重置——具体来说，新一轮新股融资定价在 $5–9 billion 区间或更低。
              核心乐观逻辑——土耳其主导电商平台叠加真实海湾可选性——结构上仍成立；问题是价格，不是业务质量。会导致投资逻辑破裂的终止触发点包括： (1) 在没有可信国际收入进展的情况下，融资重新确认 $16.5B
              标记，意味着估值继续偏高；(2) Alibaba 降低 AIDC 资本配置优先级，导致海湾业务出现流动性缺口； (3) TCA 监管升级，结构性削弱算法优势；(4) 到 2027 年底国际收入仍低于
              25%。土耳其 IPO 的法律基础设施已在 CMB regulations 和 Capital Markets Law 下建立， 但考虑土耳其股票市场深度约束，按当前估值在本土上市的可能性不高。如果 IPO
              条件满足，双重上市（Borsa Istanbul + 国际交易所）仍是最可能路径。
            claimRefs:
              - CV001
              - CV010
              - CV024
              - CV028
              - CV029
              - CV030
              - CV032
