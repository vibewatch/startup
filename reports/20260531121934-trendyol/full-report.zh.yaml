  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 土耳其本土消费者分群与采用
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的核心客户群是土耳其本土消费者。截至 2025 年，公司报告土耳其活跃用户超过 30 million，全球约 40 million。独立网站流量数据确认了这一规模：Trendyol.com
              每月访问量为 120–163 million（SimilarWeb，2026 年 4 月），是土耳其流量最高的电商目的地，也是全国访问量最高的平台之一。受众男性占比偏高（62%），集中在 25–34
              岁年龄段，与土耳其年轻互联网人口结构一致。超过 90% 的交易发生在移动应用上，反映出高智能手机渗透率驱动下，土耳其电商文化天然移动优先。

              土耳其本土市场的品类结构由电子产品（约占 GMV 的 41%）和时尚 / 服饰（约占 31%）领跑，家居用品、个护、食品杂货（通过集成的 Fast Market
              功能）和宠物用品构成剩余部分。单一应用内的品类宽度，是会话深度（平均 7–9 分钟、每次 4–7 页）和重复访问频率的主要结构性驱动。Trendyol 在 2023 日历年处理了超过 1 billion
              笔土耳其订单，并在 2025 年前覆盖土耳其全部 81 个省份、每天配送 2.5 million 个包裹。平台 2024 年 $12.5 billion 的 GMV，意味着土耳其每名活跃用户每年交易密度约
              $415——这一数字与可比中等收入平台经济体一致。土耳其业务 2023 年实现经营层面盈利，确认本土市场在规模化后单位经济为正。
