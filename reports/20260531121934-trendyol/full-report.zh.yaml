      - number: '4.5'
        title: 财务结论——收入质量、利润率路径与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的财务逻辑在战略上自洽，但大部分仍未经验证。收入质量靠高频、重复交易模型支撑：250,000+ 名卖家交易产生佣金，每个包裹产生物流费，广告层随 GMV
              扩大而放大。卖家款项浮存带来现金生成能力，却不会出现在头部指标里。自 2023 年起，土耳其本土业务实现经营层面盈利，这是最重要的已验证财务里程碑，并得到 Alibaba FY2025 AIDC 披露佐证。

              利润率路径风险很重。跨境和欧洲扩张的资本消耗速度，已经让 AIDC 分部亏损在 FY2025 扩大近 2×。海湾、德国、罗马尼亚和其他国际市场在可持续规模下的单位经济仍未跑通。与 Baykar、ADQ 和 Ant
              International 的 fintech JV 尚无收入，在 Trendyol 已同时承担多个国际投资期承诺时，又增加了执行风险。资本密集度风险最容易被低估：$2 billion 海湾承诺、CEE
              物流建设，以及即将到来的 fintech 基础设施，是一组并行的盈利前投入，必须由土耳其经营现金流、Alibaba 集团内支持或新股权融资来供血——而这些来源没有一项在公开层面确认具备足够规模。

              阻断性尽调事项包括：（1）Trendyol Group 至少三个财年的独立经审计财务报表；（2）按市场划分的分部 EBITDA（土耳其、海湾、欧洲、其他）；（3）已确认的 Alibaba
              集团内转让定价和服务协议条款；（4）当前股权结构表，包括少数股东持股比例，以及 2021 年以来任何老股交易价格；（5）至少一个非土耳其市场走向盈利的详细单位经济。没有这些信息，Trendyol
              不能作为独立资产建模，只能被视为嵌入 Alibaba AIDC 的风险敞口，主要价值驱动来自土耳其电商增长。
