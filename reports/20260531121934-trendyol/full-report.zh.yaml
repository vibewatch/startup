      - number: '3.3'
        title: 监管入局者与相邻竞争对手
        blocks:
          - type: paragraph
            body: >-
              最重要的相邻竞争事件，是 Temu 和 SHEIN 从土耳其跨境直采进口细分中因监管退出。土耳其在 2024–2026 年分阶段把低价值电商包裹免税门槛从 150 EUR 降到零，并自 2026 年 2 月 6
              日起取消所有免税门槛。Temu 在一次监管检查后暂停土耳其所有跨境销售，此后转向只展示土耳其注册卖家货源的模式——实际从中国跨境平台变成了本土平台。SHEIN 暂时停止所有销售。Bazaar
              Times、Kr-Asia 和 Hürriyet Daily News 估计，从 Temu 和 SHEIN 转向本土平台的年度交易量约 $1.5B。Trendyol 和 Hepsiburada
              是主要受益者，因为它们在 Temu 和 SHEIN 原先服务的时尚及综合商品品类中占主导份额。AliExpress
              也面临限制。退出给在位者带来近期交易量抬升，也形成中期产品质量护城河：受监管平台上的本土卖家适用土耳其消费者保护法、产品安全标准和售后保修义务，而中国跨境卖家此前不承担这些义务；未来任何重新进入的合规成本因此被抬高。在即时零售中，Uber
              整合 Getir（2026 年 2 月，$335M 餐饮配送 + $100M 换取 15% 杂货股权）并叠加 Trendyol GO（2025 年 5 月被 Uber 收购，$700M），在土耳其形成 Uber
              主导的快速配送生态。Getir 餐饮配送 2025 年总预订额超过 $1B（同比增长 50%）。N11 虽仍存在，但面临结构性规模限制。Sahibinden 和 ÇiçekSepeti
              运营在大体相邻且不重叠的细分（分别是分类广告和礼品），不被视为 Trendyol 综合平台业务的直接竞争威胁。
