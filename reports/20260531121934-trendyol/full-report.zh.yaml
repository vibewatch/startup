      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              土耳其电商买家以移动端为先、原生使用平台、价格敏感，并越来越集中在 25–44 岁年龄段。TurkStat 2025 年调查显示，16–74 岁人口中有 55.7% 在线购买商品或服务（2024 年为
              51.7%），25–34 岁女性是土耳其最典型的电商购物者。尽管互联网渗透率达到 90.9%，55.7% 的线上购物率相比欧洲约 73% 的渗透率仍有明显空间，意味着 2026–2028
              年活跃买家数无需依赖新技术采用，也能保持双位数增长。土耳其的预算归属在个人或家庭，而不是机构（不同于企业 SaaS）；支付栈高度依赖信用卡分期（taksit）、BNPL 和 Trendyol Pay
              钱包，为大额购买提供融资。2026 年 Q1 Cloudflare Radar 遥测确认，土耳其 HTTP 流量 56% 来自移动端，App 体验因此成为主要购买界面。卖家侧买家（使用 Trendyol
              平台的中小企业）是重要的第二类买家：170,000+ 活跃卖家支付上架费、广告费和履约成本。海湾跨境买家收入更高、偏好时尚；Trendyol 海湾平台拥有 4M+
              活跃用户，吸引力来自土耳其时尚的性价比定位和邻近物流优势。消费者采用路径是：移动端发现（社交 / App）→ 在 Trendyol 比价和查看评价 → 分期支付或钱包结账 → 次日或预约配送 →
              通过会员忠诚和通知复购。配送不满是主要流失触发点；TurkStat 发现 29% 线上购物者报告过问题，最常被提到的是配送慢。
