      - number: '7.2'
        title: 宏观、汇率、通胀与财务披露风险
        blocks:
          - type: paragraph
            body: >-
              土耳其宏观环境是 Trendyol 以美元计价估值中最广泛的单一风险。通胀在 2024 年中见顶于 75% 以上，Central Bank of the Republic of Turkey (CBRT) 预计到
              2025 年底降至 31–33%，到 2026 年底降至 13–19%——仍远高于任何发达市场基准。2024–2025 年土耳其里拉兑美元约贬值 15–20%，USD/TRY 被预测到 2026 年底位于
              42–46 区间，意味着即便利拉计价收入名义增长，以美元计价的 GMV 和收入仍会继续被侵蚀。IMF 2025 Article IV consultation 预计土耳其 2025–2026 年 GDP 增长约
              3–4%，但强调持续 FX 波动和通胀预期是关键风险。对 Trendyol 而言，结构性 FX 敞口来自多个轴线：电子产品和服饰品类中的进口商品以里拉定价，但采购来自硬通货；海湾和欧洲收入以
              AED/SAR/EUR 形成，但合并报表需要按贬值里拉等值汇率折算；任何硬通货债务融资都会制造资产负债表错配。宏观风险之上，还叠加了完全缺失的独立经审计财务报表。Trendyol
              是私营公司，不披露经审计账目；唯一的一手公开财务窗口是 Alibaba 的 AIDC 合并分部，它把 Trendyol 与 AliExpress、Lazada 等业务打包。AIDC 调整后 EBITA 亏损从
              FY2024 的 USD 1.1 billion 扩大到 FY2025 的 USD 2.09 billion，并明确归因于 AliExpress 和 Trendyol 的跨境投入。虽然截至 FY2026 初
              AIDC 亏损正向盈亏平衡收窄，但投资者无法独立验证 Trendyol 的独立收入、利润率或现金状况。最后一次披露估值 $16.5 billion 来自 2021 年 8
              月，当时接近零利率；在当前更高折现率和倍数压缩环境下重新按市场计价，结果可能显著更低。2024 年 11 月，Bloomberg 报道 Trendyol 正在非正式试探 $1 billion 融资兴趣——截至
              2026 年 5 月未确认——暗示公司可能需要资本来支持 $2 billion 海湾投资承诺。若 IPO 前置条件（国际收入占比 50%）无法在财务投资人锁定期到期前满足，资本市场和再融资风险将升高。
