      - number: '3.5'
        title: 竞争风险登记与反向证据
        blocks:
          - type: paragraph
            body: >-
              几个反向信号削弱了护城河分析。Hepsiburada 获得 Kaspi.kz 支持，把一个资本充足、运营成熟的超级 App 玩家带入土耳其电商。Kaspi 已在 Kazakhstan
              成功搭建平台、支付和借贷整合；若把同一模型用于 Hepsiburada 的 11.6M 活跃客户群，可能加速金融服务深度和卖家工具建设。Hepsiburada 2026 年 Q1 净亏损扩大到 TRY
              992M，反映的是加速投资，而不是撤退。Amazon Turkey 对 Trendyol 的主要长期风险，不是正面 GMV 竞争，而是跨境和高端电子品类可能发生的迁移：全球供应链效率和 Prime
              级履约质量，可能侵蚀 Trendyol 的高端产品定位。多平台经营风险真实且结构性存在：同时在 Trendyol 和 Hepsiburada 上架的卖家，可在费用谈判时把增量库存转向佣金更低的平台，从而限制
              Trendyol 对卖家的定价权。Uber 即时零售整合是一把双刃剑：Trendyol 核心平台不受影响，但捆绑后的 Uber+Getir+TrendyolGO 配送生态，现在会在餐饮和冲动消费品类与
              Trendyol 争夺一天中不同时段的消费者注意力。最后，土耳其竞争管理局发布 2026 年 Q1 监管监控公告，确认正积极监督 Trendyol
              的数据使用和算法做法；任何承诺升级——尤其是走向算法透明或强制互操作——都会构成未量化的变现上限。
