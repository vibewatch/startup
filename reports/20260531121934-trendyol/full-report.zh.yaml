  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与垂直架构
        blocks:
          - type: paragraph
            body: >-
              Trendyol Group 经营六个主要产品垂直，靠统一用户身份、Trendyol Pay 钱包和 Trendyol Express 物流骨干串起来。核心交易平台——Trendyol.com——是双边平台，截至
              2025 年覆盖超过 40 million 名活跃客户、250,000+ 名卖家、30+ 个商品品类，目录超过 170 million 个 SKU。该交易平台集成自有广告（Trendyol
              Ads）、卖家分析工具和 Trendyol Express 物流轨道，形成闭环电商生态。

              Trendyol Express (TEX) 是集团自营物流垂直，通过 75+ 个配送中心覆盖土耳其全部 81 个省份，每天配送约 2.5 million 个包裹。伊斯坦布尔旗舰配送中心面积 72,078
              m²，拥有 120 个装卸口和 2022 年完工的 5 层自动化仓库。Trendyol Pay 是嵌入式数字钱包，覆盖所有集团垂直的结账流程，并支持土耳其消费者使用分期支付（taksit）。Dolap 是独立
              C2C 二手交易平台，拥有 1.6M+ 名活跃卖家和 70M+ 条上架商品，覆盖时尚、电子和家居用品——Trendyol 收购 Dolap 是为了捕捉转售经济。国际店面覆盖德国（2022 年上线，目标收入
              €3B）、海湾地区（首个完整年度 GMV 约 ~$1B）以及中东欧市场，并计划在波兰建设物流枢纽。Trendyol Go 是即时零售配送垂直，2025 年 5 月以约 $700M（85% 股权）出售给
              Uber，因此不再纳入当前集团产品边界。

              集团产品策略围绕生态锁定效应展开：卖家通过交易平台 API 接入，由 TEX 物流服务，支付佣金和广告费，并通过 Trendyol 的卖家信贷产品获得融资。买家则被个性化推荐、次日达承诺和 Trendyol
              Pay 分期选项留住。这种多边整合结构上难以复制，是 Trendyol 在土耳其电商市场拿到 34–40% 份额的主要来源。
