  - id: FE001
    title: 产品架构图 — Trendyol 技术栈
    type: stack
    summary: 基于公开开发者大会演示、Google Cloud 案例研究、GitHub 仓库分析和 HuggingFace 模型卡，重构六层技术栈。官方未发布架构图；各层代表公开信息下的最佳推断。
    data:
      layers:
        - label: 消费者层
          detail: >-
            买家 App（iOS/Android，40M+ 客户）；Seller Panel 和 Seller App；Dolap App（iOS/Android，1.6M+
            活跃卖家）；国际网页店面（德国、CEE、海湾）；Baklava 设计系统（TypeScript，约 1.4k GitHub 星标）保证 UI/UX 一致性。
        - label: API 与集成层
          detail: >-
            Seller Integration API（OAuth2 REST，developers.trendyol.com）——产品、库存、订单、发票、发货端点；覆盖 7,000+ 微服务的内部 gRPC
            服务网格；认证和限流网关。
        - label: 核心微服务（7,000+ 服务，150+ 团队）
          detail: >-
            目录服务；订单管理；支付 / Trendyol Pay；用户与身份；Trendyol Express 物流编排；搜索与发现；推荐引擎；Trendyol Ads；Dolap 市场服务。Go（CDC、Kafka
            封装）、Kotlin（JVM）、TypeScript（前端）。通过 TBP 做渐进式部署（金丝雀、蓝绿）。
        - label: AI / ML 平台
          detail: >-
            Trendyol LLM v7（基于 Gemma 3-12B 的 Asure-12B；每天 60M+ 请求；土耳其语 / 英语）；AI Agent Platform（每天 500M+ 决策；6 个月内 4,000+
            自主工程任务）；Two-Tower 推荐神经模型（用户 × 商品向量嵌入）；DinoV2 Image Similarity、Product Image Encoder（ConvNeXt）、Background
            Removal（IS-Net）——全部在 HuggingFace 开源。Python ML 技术栈。
        - label: 数据平台
          detail: >-
            Google Cloud BigQuery（数据仓库，约 2019 年从本地部署迁移）；Looker（近实时 BI，1,500+ 员工用户，峰值日查询 260K+）；Apache
            Kafka（事件流——订单、物流、目录事件）；Temporal（长运行流程的持久工作流编排）。通过 GCC，Looker 缓存提升 38%。
        - label: 基础设施层
          detail: >-
            基于 KubeVela + OAM 的 Trendyol Builder Platform（TBP）——管理 7,000+ 微服务部署；Argo
            Rollouts（渐进式交付）；FluxCD（GitOps）；Prometheus（可观测性）；Docker/Kubernetes。持久化层：PostgreSQL、Couchbase、Redis
            缓存、Elasticsearch（170M+ SKU 搜索索引）。
