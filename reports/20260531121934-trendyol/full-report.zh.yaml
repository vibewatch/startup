      - number: '5.3'
        title: AI、机器学习与推荐引擎
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的 AI 平台是重要竞争资产，也是业务中技术文档最充分的一环。公司的大语言模型（Trendyol LLM）首次公开亮相于 2024 年 2 月迪拜 World Governments
              Summit——它是 AI 圆桌中唯一出席的土耳其公司，与 Jensen Huang（NVIDIA CEO）、Werner Vogels（Amazon CTO）和 Yann
              LeCun（Meta）同场。原始模型基于 Meta 的 LLaMA2 架构，使用约 10 billion 个 token 做土耳其语专门化，并用 180,000 个精选问答对进行指令微调。截至 2026 年 2
              月，LLM 已迭代到第 7 版，当前生产版本为 Trendyol-LLM-Asure-12B——一个基于 Gemma 3-12B 的 12-billion
              参数多模态模型，针对土耳其语和英语电商任务优化，包括摘要、问答、结构化抽取和可控生成。该模型以开源形式发布在 HuggingFace。规模化运行后，LLM 每天处理 60+ million
              次请求，支持国际卖家的多语言商品描述生成和实时客户咨询翻译。

              Trendyol 的 AI Agent Platform（Trendyol AI Agent）把能力从 LLM 用例延伸到自主系统管理。截至 2026 年 2 月 AI/ML
              Summit，该平台每天在推荐系统、搜索和 ML 基础设施管理中生成超过 500 million 个自动预测和决策。在截至 2026 年 2 月的 6 个月里，AI agents
              自主开发并部署到线上生产环境的软件工程任务超过 4,000 项，将软件交付加速 9×。落地结果包括：国际卖家通过 AI 匹配算法将商品刊登速度提升 60%；物流流程效率提升 20%。这些数据由 CTO Cenk
              Çivici 在 AI/ML Summit 披露，并经 Anadolu Ajansı（土耳其官方国家通讯社）报道。

              在目录管理和视觉搜索方面，Trendyol 于 2025 年 8 月在 HuggingFace 开源了三个生产级 AI 视觉模型：（1）DinoV2 Image
              Similarity——用于视觉商品匹配和推荐；（2）E-Commerce Product Image Encoder（ConvNeXt 架构）——用于目录去重和搜索相关性；（3）Background
              Removal（IS-Net 架构）——用于自动商品图背景移除。这些模型由 Dr. Tolga Ahmet Kalaycı 领导的 Trendyol
              数据科学团队开发，并已部署在线上生产环境，每天处理数百万笔交易。个性化和排序方面，Trendyol 使用 Two-Tower
              神经网络架构结合用户和商品向量嵌入，并采用混合排序系统，把统计评分、情感分析和深度学习混合起来。
