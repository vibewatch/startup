              土耳其逐步收紧跨境免税门槛，并最终于 2026 年 2 月 6 日完全取消，实际上迫使 Temu 和 SHEIN 退出或大幅限制土耳其运营。行业估计，被重新分流的年度交易量约
              $1.5B。这是少见的监管直接为本土在位者筑护城河的事件，Trendyol 和 Hepsiburada 是主要受益者。
