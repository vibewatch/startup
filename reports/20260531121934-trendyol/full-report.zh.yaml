  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Trendyol 客户从初次认知到首次购买、复购互动、嵌入生态，再到扩张或流失决策的采用路径；覆盖土耳其本土、海湾和中东欧消费者分群。
    data:
      items:
        - id: stage-awareness
          label: 认知与发现
          actor: 潜在买家（土耳其、海湾或中东欧消费者）
          description: >-
            土耳其：自然搜索、社交媒体、电视和数字广告、口碑；品牌在品类中占主导，消费者第一提及时容易想到。海湾：Instagram / Snapchat / TikTok 上的创作者内容（15,000+
            个创作者合作）、付费应用安装、侨民群体口碑。中东欧 / 德国：付费数字营销、KOL 合作（1,000+ 名德国 KOL），进入市场时品牌认知度低。
          channels:
            - App Store / Google Play 搜索
            - 社交媒体（Instagram、TikTok、Snapchat）
            - 数字广告
            - 口碑 / 侨民网络
        - id: stage-first-purchase
          label: 首次购买
          actor: 新买家；Trendyol Pay 或本地银行卡
          description: >-
            消费者下载应用（Google Play 土耳其 100M+ 安装）、注册账号并完成首单。Trendyol Express 在土耳其承接当日 / 次日达；海湾配送现在约 4
            天。获客时通常使用促销券和首单折扣。支付方式包括 Trendyol Pay（嵌入式钱包）、分期卡（土耳其 taksit）或本地支付方式。
          channels:
            - Trendyol 移动应用（iOS / Android）
            - Trendyol.com 网页端
            - Trendyol Pay / 本地银行卡
        - id: stage-repeat-engagement
          label: 复购互动与跨品类采用
          actor: 活跃买家（回访）
          description: >-
            AI 驱动的个性化推荐和价格提醒通知拉动复访。跨品类扩张路径是：时尚买家发现电子产品、家居用品或生鲜杂货（Fast Market）。Dolap 二手电商平台提供额外的再互动入口。平均会话 7–9 分钟、4–7
            页；海湾市场从浏览到加购的意图强。
          channels:
            - 推送通知（价格提醒、活动提醒）
            - Trendyol AI 推荐引擎
            - Dolap 二手应用（交叉销售）
            - 邮件 / SMS 营销
        - id: stage-ecosystem-embedding
          label: 生态嵌入
          actor: 忠诚买家 + 潜在卖家 / 转售者
          description: >-
            消费者嵌入多个 Trendyol 产品：把 Trendyol Pay 当主要钱包（土耳其有 TrendFinance 银行业功能），通过 Dolap 回收时尚商品，使用价格提醒和活动券。卖家路径是：消费者成为
            Dolap 微型卖家（1.6M+ 活跃 Dolap 卖家）。每多用一个产品，切换成本就上升一层。
          channels:
            - Trendyol Pay / TrendFinance
            - Dolap 二手电商平台
            - 订阅活动提醒
        - id: stage-renewal-or-churn
          label: 续留、忠诚或流失
          actor: 成熟买家
          description: >-
            土耳其：生态锁定带来高留存；NPS 34；公司披露忠诚度 82%。海湾：信号混合——土耳其本土客群正向，但国际 Trustpilot 2.5/5 暗示配送 / 服务流失风险。中东欧 / 罗马尼亚：2024 年复购率
            47%，早期信号强。流失触发因素包括配送失败未解决、退货被拒、Amazon 或 Hepsiburada 进行价格匹配。
          channels:
            - 自动续留（基于应用的购买习惯）
            - Trendyol 忠诚度活动
            - 客服解决问题（降低流失）
    claimRefs:
