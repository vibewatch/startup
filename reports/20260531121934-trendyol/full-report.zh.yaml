            title: Trustpilot 2.5/5 国际评分显示，国内到国际的服务质量缺口仍未解决
            body: >-
              土耳其本土应用交付高质量体验（Google Play 4.2★，来自 2.3M 条评论），但 Trendyol 的国际 Trustpilot 档案只有 2.5/5
              的“Poor（差）”评级，配送失败、拒绝退货和客服敷衍反复出现。缺口在海湾和 CEE 市场最明显——这恰恰是 Trendyol 必须赢下，才能达到 50% 国际收入 IPO
              门槛的两条走廊。如果服务质量缺口无法补上，这些市场的获客支出可能会被首单负面体验带来的流失结构性抵消。
