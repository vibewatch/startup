        - 约 $1.5B 年交易量转向本土平台；时尚 / 电子品类的超低价竞争减弱
        - 量化回流需求中 Trendyol 与 Hepsiburada 的份额；监测受影响品类的消费者价格通胀。
      - - 互联网渗透率上升和移动优先基础设施
        - 上行
        - 当前并持续到 2028 年
        - 每提升 1 个百分点增加约 1M 潜在购物者；土耳其网购率 55.7%，欧洲约 73%，意味着多年增长空间
        - 跟踪 TurkStat 年度 ICT 使用调查；注意性别和地区（城市 / 农村）渗透差距。
      - - 即时零售年增长 50%+（现不在 Trendyol 核心内）
        - 混合
        - 当前
        - 即时零售（QC）是土耳其增长最快的电商子类；Trendyol 已通过将 Trendyol GO 出售给 Uber 部分退出
        - 评估 Trendyol 核心物流是否保留即时零售相邻能力；监测 Uber-Trendyol GO 竞争姿态。
      - - 电商出口增长和政府支持
        - 上行
        - 中期（2026–2028）
        - 土耳其电商出口从 $2.2B（2022）增至 $6.4B（2024）；政府目标到 2025–2026 年达到 $8–10B；跨境 SAM 是增量
        - 要求 Trendyol 按地域拆分出口 GMV；核验海湾与欧洲拆分和单位经济。
      - - 土耳其里拉贬值和持续通胀
        - 下行
        - 当前且持续
        - 自 2024 年中以来里拉下跌 20%+；2025 年中通胀约 33–38%；侵蚀消费者购买力，并推高与进口相关的物流成本
        - 要求提供外汇对冲政策；评估 USD 与 TL 收入组合；量化物流成本通胀对抽佣率的影响。
      - - 电商监管复杂度（第 7416 号法及 2025–2026 修订）
        - 下行
        - 当前且加剧
        - 强制本地代表（2025 年 4 月）、年度卖家核验、远程合同修订（2026 年 1 月）、广告预算上限
        - 要求提供合规路线图和增量法务 / 运营支出估计；评估对广告抽佣率的影响。
      - - TCA 反垄断承诺和持续监测
        - 下行
        - 当前
        - 自我优待和数据可携承诺限制某些促销和算法实践；2026 年 Q1 公报确认仍在主动监测
        - 获取完整书面承诺文本；评估哪些货币化策略受限、幅度多大。
      - - Amazon Turkey 和 Hepsiburada 竞争强度
        - 下行（混合）
        - 中期
        - Amazon 落后于本土龙头，但拥有全球供应链和品牌信任；Hepsiburada 获得 Kaspi.kz TRY 4.17B 注资（2025 年 12 月）
        - 跟踪 Amazon Turkey GMV / 卖家数量；监测 Kaspi 之后 Hepsiburada 的技术和物流投资轨迹。
      - - 宏观不稳定（通胀、外汇、政治风险）
        - 下行
        - 当前和 2026 年
        - 政治事件（如 2025 年 3 月伊斯坦布尔市长被捕）引发 TRY 波动；CBRT 动用 $50B+ 外汇储备保卫里拉；商业不确定性上升
        - 监测 CBRT 路径、政治稳定指标，以及 Trendyol 管理层对宏观风险缓释的表述。
    notes: 驱动因素和约束是基于公开证据的方向性评估；实际幅度取决于 Trendyol 具体敞口，而这些敞口未公开。“下行”表示对市场增长或 Trendyol 可触达机会的约束，不一定代表市场层面收缩。
