      - CU037
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 消费者采用漏斗从土耳其互联网人口总量开始，经过线上购物人群到 Trendyol 电商平台活跃买家，并附加国际扩张层。
    data:
      items:
        - label: 土耳其互联网用户（16–74 岁）
          value: 77000000
          detail: 以 90.9% 渗透率套用可触达的土耳其 16–74 岁人口，得到约 77M 互联网用户。TurkStat 2025。TurkiyeToday 显示土耳其互联网接入率超过 90%。
          tone: neutral
        - label: 线上购物者（在线购买商品 / 服务）
          value: 30000000
          detail: 16–74 岁人群线上购物渗透率约 55.7%，意味着土耳其活跃线上购物者约 30–31M；TurkStat 显示该比例高于 2024 年的 51.7%。土耳其移动优先的人口结构推动快速转化。
          tone: positive
        - label: 电商平台买家（相对于品牌直营站）
          value: 28000000
          detail: 土耳其是平台型电商主导的市场；约 90%+ 线上购买流向平台，而不是品牌直营站。估计约 28M 人处在电商平台漏斗中。
          tone: positive
        - label: Trendyol 本土活跃用户
          value: 30000000
          detail: 公司披露截至 2025 年在土耳其有 30M+ 活跃用户；因口径更宽（应用安装 vs. 活跃购买），略高于市场估计。Trendyol 占土耳其电商 GMV 的 34–40%。
          tone: positive
        - label: 国际活跃客户（海湾 + 中东欧 + 德国 + 其他）
          value: 9000000
          detail: 截至 2025 年底，海湾 3.7M+、中东欧 2.2M、德国及其他市场 ~3M+，合计约 9M 国际活跃客户；2020 年几乎为零。
          tone: positive
    approximationNotes: >-
      土耳其互联网用户数来自 TurkStat 90.9% 渗透率。线上购物者估计使用 TurkStat 55.7% 占比并套用可触达人口。电商平台买家数（~28M）为估计值，未披露。Trendyol 的 30M
      本土数字可能包含非活跃账户。国际 9M 数字来自 IndexBox（海湾 3.7M）、Business Review EU（中东欧 2.2M）和 Lucidity Insights /
      TheIndustry.fashion（德国 1M+）；其余为近似估计。
