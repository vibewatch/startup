      - CV007
      - CV023
      - CV024
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 分组柱状图展示三种情景（悲观、基准、乐观）下的企业价值区间，覆盖三种估值方法：EV/GMV、EV/Revenue 和定性战略价值。
    approximationNotes: >-
      所有区间均为估计。EV/GMV 使用 Hepsiburada（0.10–0.16x）、Coupang-Sea 加权（0.20–0.25x）和 MELI 加权（0.20–0.25x）的可比公司中位数。EV/Revenue 使用
      0.5–0.8x（悲观）、0.8–1.5x（基准）、2.0–3.0x（乐观）。战略价值纳入海湾主权投资者溢价和 SuperApp 选择权。
    data:
      items:
        - label: 悲观情景
          low: 2
          mid: 3
          high: 4
          displayValue: $2–4B
          detail: EV/Revenue ≤1x；无 IPO；宏观承压；Alibaba 退出风险
          tone: negative
        - label: 基准情景
          low: 5
          mid: 7
          high: 9
          displayValue: $5–9B
          detail: EV/Revenue 2–3x；IPO 有部分进展；新兴市场估值继续压缩
          tone: neutral
        - label: 乐观情景
          low: 10
          mid: 13
          high: 16
          displayValue: $10–16B
          detail: 以 MELI 水平倍数 IPO；国际收入 ≥50%；SuperApp 溢价
          tone: positive
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV025
      - CV026
      - CV027
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: KPI 仪表盘跟踪判断 Trendyol 投资逻辑是否跑在轨道上的关键指标，包括当前状态和基准情景目标门槛。
    approximationNotes: 当前值为截至 2026 年 5 月来自公开来源（Alibaba AIDC 披露、第三方分析）的估计。Trendyol 未单独披露数据。
    data:
      items:
        - label: FY2025 GMV（USD）
          value: '>$14B'
          detail: 第三方估计；Alibaba AIDC 披露；Hepsiburada GMV 约 $5B 作为参照
          tone: positive
        - label: 国际收入占比
          value: ~20%
          detail: IPO 前置条件要求 ≥50%；基准情景 2027 年目标：30–35%
          tone: negative
        - label: AIDC 分部亏损（FY2026 Q4 同比）
          value: −96%
          detail: FY2026 Q4 亏损 RMB 138M（同比口径）——接近盈亏平衡轨迹
          tone: positive
        - label: TrendyolGo 剥离价值
          value: ~$824M
          detail: Uber 以约 $700M 收购 85% 股权；隐含整体实体价值约 $824M（2025 年 5 月）
          tone: neutral
        - label: 土耳其电商市场份额
          value: ~30%
          detail: 2025 年估计；Hepsiburada 约 18%；Trendyol 占据本土主导地位
          tone: positive
        - label: USD/TRY（2026 年 5 月）
          value: ~50–52
          detail: TRY 名义增长折算成 USD 指标时，被汇率逆风压缩
          tone: negative
