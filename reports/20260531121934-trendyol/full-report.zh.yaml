      - number: '6.5'
        title: 留存代理指标、扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的留存模型靠生态整合，而不是独立忠诚度计划。Trendyol Express（当日 / 次日达）、Trendyol Pay（嵌入式钱包与分期支持）、个性化 AI 推荐，以及 170M+ 个
              SKU 的宽度，叠加出复合切换成本：当用户嵌入三个或更多 Trendyol 产品时，要替换的是五个同时存在的使用习惯。最清晰的公开留存代理指标来自 Romania：2024 年有 47% 的 Romania
              客户下过多次订单——对于一个 2024 年初才在 CEE 上线的平台，这是强信号。Turkey 或海湾分群没有披露同等队列数据。

              NPS 34 和 82% 忠诚度（Comparably，2026 年）具有指示意义，但方法论较弱：Comparably 的 NPS 是自愿参与调查，其“忠诚度”指标定义未公开。Trendyol 或 Alibaba
              均未发布任何客户分群的净留存率（NRR）、总留存率（GRR）、流失率或留存队列数据。这是重大尽调缺口。

              扩张主要沿两条线推进：地理扩张（海湾、CEE、德国）和生态垂直扩张（TrendyolMilla 自有品牌恢复、TrendFinance 嵌入式银行、Dolap 二手）。触发 IPO 的指标——国际收入占比
              50%——意味着 Trendyol 必须把国际收入占比从当前约 ~20% 大致翻倍。海湾 GMV 2024 年突破 $1 billion，CEE 到 2024 年底达到 2.2M
              买家，说明轨迹为正，但速度仍不确定。

              集中度风险体现在两个层面。第一是地理：Turkey 约占总 GMV 的 80%，使业务暴露于土耳其里拉波动、本土通胀和土耳其监管行动（见反垄断章节）。第二是在国际市场内部，Saudi Arabia 贡献约 75%
              的海湾订单，意味着海湾分部本身也高度集中。时尚——退货率最高的品类——占 Turkey GMV 的 31%，并在退货物流基础设施尚不成熟的国际市场中，对客户投诉贡献不成比例。
