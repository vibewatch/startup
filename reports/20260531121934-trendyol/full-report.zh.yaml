      - number: '4.2'
        title: 单位经济、成本结构与利润率可见度
        blocks:
          - type: paragraph
            body: >-
              Trendyol 是非上市公司，毛利率结构不透明。最接近的上市参照是 Hepsiburada (NASDAQ: HEPS)，后者披露按 IAS-29 通胀调整后的财务数据。Hepsiburada 报告，2024
              Q3 毛贡献利润率约为 GMV 的 12.4%，IAS-29 未调整 EBITDA 利润率为 GMV 的 2.2%——较 2022 年 -7.2% 明显修复。Trendyol 的土耳其本土业务 2023
              年实现经营层面盈利，说明其单位经济轨迹至少可比、甚至可能更优；相对 Hepsiburada 约 5× 的 GMV 规模优势，也在固定成本上提供了显著经营杠杆。

              Trendyol 的成本结构由三项主导：物流（Trendyol Express 基础设施，75 个配送中心、每日 2.5 million 单配送）、技术（AI 投入、自研
              LLM、平台基础设施），以及卖家获取和营销补贴（免配送费计划、活动激励）。行业基准数据显示，末端配送约占电商物流总成本的 53%，人工占末端配送费用的 50–60%。自营 Express 模式让 Trendyol
              比使用第三方物流的平台更能控制成本，但也把资本密集度集中到自己身上。

              卖家结算节奏（订单完成后按品类 7–28 天）形成结构性营运资金浮存：Trendyol 立即收取消费者款项，但最晚四周后才向卖家打款。按每日 2.5 million 单配送、客单价估计在低两位数 USD
              区间计算，这笔浮存规模可观——是真实经济优势，却不会体现在 GMV 或收入指标里。

              国际扩张明显挤压单位经济。分析师把 Trendyol 的跨境和欧洲业务描述为“成本高、长期 ROI 尚未验证”，这与 AIDC 分部亏损从 FY2024 的 USD 1.1B 扩大到 FY2025 的 USD
              2.09B 一致——Alibaba 明确将其归因于“对 AliExpress 和 Trendyol
              跨境业务的投入”。在德国、罗马尼亚和海湾从零建设仓储、履约和品牌认知，结构上比土耳其本土业务更贵；后者已经有成熟品牌和物流网络打底。
