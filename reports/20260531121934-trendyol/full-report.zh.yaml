      - number: '2.2'
        title: 市场规模与相互冲突的估计
        blocks:
          - type: paragraph
            body: >-
              土耳其电商 TAM 很大且仍在增长，但不同来源的方法论差异很大。Mordor Intelligence 估算土耳其市场 2026 年规模为 $102.63B，采用净 B2C 交易额口径，剔除 VAT
              和运费，并以一致的即期汇率处理；其预计到 2031 年 CAGR 为 9.24%。ETBİS——土耳其 Ministry of Trade 官方电子商务信息系统——记录 2025 年交易额为 4.57T TL；按
              2025 年平均汇率折算约为 $108B，与 Mordor 大体一致，但不可直接比较，因为 ETBİS 包含 B2C、B2B 及部分 B2B 品类的全部虚拟 POS 活动。IMARC Group
              从更宽定义出发，纳入 B2B 采购和服务品类，预测 2026–2034 年 CAGR 高得多（24%+）；其未公开披露 2026 年单独美元规模，但轨迹意味着 2026
              年基数更高。这些相互冲突的估计应保留，而不是取平均：Mordor 的仅 B2C 视角（2026 年 $102.63B）最接近 Trendyol 的 GMV 报告；ETBİS
              行政数据对监管和基准比较最权威；IMARC 更高的 CAGR 应作为上行情景。相对于土耳其广义电商市场，Trendyol 2025 年 $14B+ GMV 意味着按 Mordor 口径占总市场价值
              13–14%，或占 Trendyol 实际竞争的、由平台主导的 B2C 细分市场 34–40%（与独立报告一致）。公司自身技术流量份额更高（technologychecker.io 2026 年 Q1 分析引用
              ETBİS 和 Cloudflare Radar 数据，称 Trendyol 净销售额接近土耳其第二名的 5 倍），但网站流量份额和 GMV 份额使用不同方法，不应混同。平台层级以下的 SAM 隔离——例如，若
              Trendyol 充分扩展所有品类，理论上可覆盖土耳其电商的哪一部分——并无公开数据，是重要尽调缺口。
