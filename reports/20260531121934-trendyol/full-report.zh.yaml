      - number: '2.5'
        title: 规模测算缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              几个重要市场边界要么是私有数据，要么互相冲突，要么方法论不可兼容。第一，Trendyol 按品类划分的
              SAM——也就是平台当前产品组合可覆盖的土耳其电商具体部分——未公开披露。管理层对品类扩张（金融科技、保险、云）的目标意味着 SAM 会扩大，但没有独立测算验证一个区别于土耳其电商总量的 SAM
              数字。第二，海湾和欧洲跨境 SOM 只由公司公告支撑（$2B 海湾投资计划和 2026 年 $10B 出口目标），没有可独立验证的 GMV 拆分；4M
              海湾活跃用户也是公司披露，未获佐证。第三，多套电商市场预测（Mordor $102.63B、IMARC 高得多的轨迹、ETBİS 以 TL
              计价的行政数字）在范围和币种约定上不可兼容；任何估值模型若只选一个预测而不承认其他口径，方法论都很弱。第四，TCA 对 Trendyol
              的承诺限制了部分变现路径，但这些承诺对可实现抽佣率的具体上限，并未在公开监管文件中披露——这是重大监管尽调问题。就 Trendyol 而言，最强证据支持 2026 年土耳其国内电商 TAM 处于
              $100–110B 区间，Trendyol 已捕获 GMV 约 $14B，意味着占总市场 GMV 13–14%，占平台型 B2C 子细分 34–40%。
