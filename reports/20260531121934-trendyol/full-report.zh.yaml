      - number: '6.4'
        title: 客户满意度、App 评分与反向证据
        blocks:
          - type: paragraph
            body: >-
              Trendyol 的客户满意度数据按渠道和地域明显分化。土耳其本土应用在两大应用商店表现强劲。在 Google Play 上，Trendyol 应用基于约 2.3 million 条评论获得 4.2
              星评分，下载量达到 100 million 或以上——这是土耳其电商平台中单一应用最大下载量。在 Apple App Store 上，评分为 4.7 星，评论超过 105,000
              条。这些分数与土耳其强执行力相一致：Trendyol Express 的当日达和次日达能力、已经建立的品牌信任，以及顺滑的 Trendyol Pay 集成，共同交付了高质量端到端体验。

              国际客户体验明显更弱。截至 2026 年 2 月，Trendyol 的国际 Trustpilot 档案为 2.5/5
              的“Poor（差）”评级，主要投诉主题包括：商品未送达或送错地址、订单层面的商品替换（收到与下单不同的商品）、退款和退货揽收失败（Trendyol
              拒绝揽收退货并拒绝退款），以及客服回复被形容为无用、照本宣科或敷衍。一个海湾客户样本评论（2026 年 1 月）称：“卖假货还不退。多付 20 AED，去 Amazon 这种可信平台买。”一位欧洲客户（2025
              年 12 月）称：“一个多月前申请退货。到今天还没人来取件。他们反过来怪我不接电话。”截至 2026 年 5 月，PissedConsumer 记录了 469+ 条 Trendyol
              投诉，反复出现配送、退款和客服解决失败。评论分化说明，尽管海湾章节描述了基础设施投入，国内到国际的物流质量缺口仍未完全补上。

              品牌层面，Comparably 追踪的 Trendyol NPS 为 34（55% 推荐者、24% 中立者、21% 贬损者），公司报告客户忠诚度为 82%，产品质量评分 3.6/5，定价 3.8/5，客服
              3.7/5（截至 2026 年）。这些指标显示口碑推荐程度中等，质量感知仍有改善空间。
