  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现模型
        blocks:
          - type: paragraph
            body: >-
              Trendyol 采用混合收入模型，以平台抽佣率为锚，再叠加物流收入、广告和早期金融科技服务。核心收入流是向第三方卖家收取的品类佣金：截至 2025 年，费率按品类从 5% 到 28% 不等，服装约
              21.5%，配饰 21.5–22.5%，电子 5–28%（手机约 7%，配件最高 28%），美妆 15–18%，超市商品 12–20%。除百分比佣金外，卖家每单还需支付约 ₺8.49 加 VAT
              的固定平台服务费。由于 Trendyol 不发布综合抽佣率或独立收入数字，GMV 到收入的转化只能估算：若对 2024 年约 $12.5B GMV 套用 12–16% 综合佣金，意味着平台收入在
              $1.5–2.0B 区间——但这是估计，不是披露数字；扣除规模折扣和新卖家项目后，实际费率可能有实质差异。

              佣金层之外，Trendyol Express 向卖家收取按 desi 计费的物流费——截至 2026 年，0–2 desi 为 77.54 TL，11–15 desi 包裹升至约 192.81
              TL——并作为物流服务提供商运营，其收入嵌在集团内部，但未单独披露。Trendyol Ads 为卖家和品牌提供赞助搜索、横幅广告位和活动管理工具；这是一条高利润率的增量收入流，会随卖家数和 GMV 放大，逻辑与
              Alibaba、Amazon 的广告经济性一致，但未披露收入数字。Trendyol Pay 是嵌入集团所有垂直业务的数字钱包，提升生态黏性并降低支付处理成本；其变现模型仍在发展。

              Alibaba AIDC 2025 财年年报（截至 2025 年 3 月 31 日）是唯一覆盖 Trendyol 的一线公开财务披露。报告确认，AIDC 国际商业零售分部 FY2025 收入为 RMB
              108,465M（约 USD 14.9B），同比增长 33%，「主要由 AliExpress 和 Trendyol 贡献收入增加推动」。这个数字无法拆出 Trendyol 的独立贡献，也不能作为 Trendyol
              单独收入代理。

              2025 年 7 月，Trendyol Group、Baykar、Abu Dhabi 的 ADQ 和 Ant International 签署
              MoU，拟在土耳其设立下一代金融科技平台，提供数字支付、中小企业和零售贷款、存款、投资产品和保险，仍待监管批准。这个 JV 代表未来收入流，目前没有财务贡献，资本化条款也不确定。
