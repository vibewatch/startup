  - id: FR003
    title: 依赖图
    type: dag
    summary: 有向无环图梳理截至 2026 年 5 月，Trendyol 在资本、技术、监管、物流和市场准入上的关键外部依赖。
    data:
      nodes:
        - label: Trendyol 电商平台
          detail: 核心平台：电商平台、Trendyol Express、Trendyol Pay、Dolap；40M+ 客户；250K+ 卖家
        - label: Alibaba / AIDC
          detail: ~70% 股东；技术栈（AI/ML、LLM 基础设施、Alibaba Cloud）；为 AIDC 亏损提供资本兜底
        - label: 土耳其竞争局（TCA）
          detail: 仍生效的行为义务：数据使用限制、定价机制承诺、持续报告；2025 年 12 月投诉问询
        - label: CBRT / 土耳其宏观环境
          detail: 里拉贬值（2024–25 年 15–20%）；2025 年底通胀 31–33%；2026 年 USD/TRY 42–46 预测
        - label: 海湾主权财富基金（ADQ、QIA）
          detail: 共同投资者（2021 年轮次）；海湾扩张合法性背书；可能共同投资 $2B 海湾承诺
        - label: 250,000+ 第三方卖家
          detail: GMV 供给；电商平台流动性；受 TCA 数据可携带义务约束，切换成本降低
        - label: Trendyol Express 物流网络
          detail: 2.5M 包裹 / 日；35 个国家；自有最后一公里；持续中断时未确认 3PL 兜底
        - label: Alibaba Cloud / 技术基础设施
          detail: 为电商平台、物流路线、AI/ML 提供实时计算；依赖范围未公开确认
        - label: KVKK / Saudi PDPL 监管方
          detail: 数据处理许可；Law 7499（2024）下的跨境传输规则；VERBIS 注册
        - label: 40M+ 消费者基础
          detail: 主要需求驱动；平均评分 1.9/5；2025–2026 年投诉模式持续存在
      edges:
        - from: Alibaba / AIDC
          to: Trendyol Marketplace
          label: ~70% 股权；技术栈；资本供给（AIDC 亏损兜底）
        - from: Turkish Competition Authority (TCA)
          to: Trendyol Marketplace
          label: 行为义务；数据使用限制；定价承诺；报告要求
        - from: CBRT / Turkish Macro Environment
          to: Trendyol Marketplace
          label: FX / 通胀侵蚀美元 GMV、抬高进口成本、压缩估值倍数
        - from: Gulf SWFs (ADQ, QIA)
          to: Trendyol Marketplace
          label: 共同投资者背书；海湾监管和商业准入
        - from: 250,000+ Third-Party Sellers
          to: Trendyol Marketplace
          label: GMV 供给；电商平台流动性；卖家满意度影响平台经济性
        - from: Trendyol Express Logistics Network
          to: Trendyol Marketplace
          label: 履约 SLA；消费者信任的主要信号；单点故障风险
        - from: Alibaba Cloud / Technology Infrastructure
          to: Trendyol Marketplace
          label: 为电商平台和物流 AI 路线提供实时计算
        - from: KVKK / Saudi PDPL Regulators
