      - number: '7.5'
        title: Alibaba 母公司依赖与地缘政治阴影
        blocks:
          - type: paragraph
            body: >-
              Alibaba 持有 Trendyol 约 70%，这种控股带来结构性依赖和地缘政治风险，与运营执行风险不同。技术依赖很直接： Trendyol 的物流优化、AI 驱动个性化、LLM
              基础设施（土耳其首个自研大语言模型，基于 Alibaba 芯片和 ML 技术栈开发） 以及支付底座，都借助 AIDC/Alibaba 平台。一旦 Alibaba
              面临西方制裁、技术转移限制，或战略重心从国际商业撤离， Trendyol 就需要独立重建或收购这些能力——这是多年、数十亿美元级工程。地缘政治风险对机构资金同样关键： 西方机构投资者（EU/US
              养老基金、主权财富基金）正越来越严格审视新兴市场里的中资科技平台。在海湾市场， Trendyol 借助主权财富基金（ADQ、QIA）支持扩张；如果中国在当地的外交地位恶化，商业摩擦可能随之出现。 Trendyol
              与 Alibaba 之间的转让定价安排、集团内 IP 授权和资本回流机制均未公开披露，少数股东面临治理不透明。 2025 年 5 月将 Trendyol Go 部分出售给 Uber（85% 股权，$700
              million），证明 Alibaba 愿意重组集团，但也留下一个问题： 未来战略转向时，哪些资产可能被剥离或重新排序。任何 Alibaba 试图通过 IPO 或老股出售把持股降至 50% 以下的情景，
              如果过渡期没有足够治理协议，都会带来董事会控制权交接风险。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: TCA 仍在现场审视，2025 年 12 月卖家投诉问询不是无风险证明
            body: >-
              TCA 2025 年 12 月评估了 9 起公开卖家投诉，虽然没有启动完整新调查，但明确承认 Trendyol 的支配地位及其竞争影响。
              这不是洗清嫌疑，而是形成了有记录的基线，降低了未来完整调查的触发门槛。只要算法偏袒、价格胁迫或数据滥用再次出现， 在既有证据框架下，很可能会进入调查区间。投资人应把 TCA
              合规视为经常性运营支出，而不是已经解决的历史问题。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: 没有独立经审计财报：最重要的尽调约束
            body: >-
              Trendyol 从未发布独立经审计财务报表。FY2025 AIDC 分部亏损 $2.09 billion 是唯一一项公开的一手财务信号， 但它把 Trendyol 与 AliExpress、Lazada
              合并在一起。没有 NDA 保护下的管理账和 Big 4 独立审计，就做大额投资决策， 本质上是在基于商业模式下注，而不是完成经验证的财务尽调。
            calloutType: risk
            claimRefs:
              - CR015
              - CR016
              - CR017
          - type: callout
            title: 海湾投资承诺跑在已验证单位经济模型前面
            body: >-
              $2 billion 海湾投资承诺发布于 2024 年底，当时海湾业务只完整运营了一年（海湾 GMV $1B，沙特占 75%）。跨境履约、
              本地仓储和阿拉伯语客服的单位经济模型尚未被独立验证。在这个市场发展阶段部署 $2B 资本，是高信念战略下注， 必须按这种性质承销，而不是当作已经验证的运营计划。
            calloutType: risk
