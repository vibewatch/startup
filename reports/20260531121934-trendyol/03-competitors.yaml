company:
  name: Trendyol
chapter:
  number: 3
  title: Competitors
  summary: >-
    Trendyol commands Turkey's e-commerce with $14B+ GMV (2025) and 34–40% B2C marketplace share—
    roughly 5× the scale of its nearest domestic rival, Hepsiburada (TRY 257.5B FY2025 GMV,
    ~$5B USD). Amazon Turkey ranks third by traffic but remains constrained by weaker localization.
    N11 is a distant fourth. The competitive map shifted materially in early 2026: Turkey abolished
    all duty-free thresholds in February 2026, forcing Temu to suspend cross-border sales and SHEIN
    to halt Turkey operations, redirecting an estimated $1.5B in annual volume to domestic platforms
    such as Trendyol and Hepsiburada. Concurrently, Uber acquired Getir's Turkish food delivery
    business (February 2026, $335M) and merged it with Trendyol GO (acquired May 2025, $700M),
    consolidating quick-commerce outside Trendyol Group's balance sheet. Trendyol's structural moat
    rests on three reinforcing pillars: a proprietary logistics network (Trendyol Express, 75
    distribution centres, all 81 provinces), a 170,000+ seller ecosystem with proprietary analytics
    lock-in, and an embedded fintech layer (Trendyol Pay, seller financing). Material vulnerabilities
    include Amazon Turkey's latent global-logistics advantage, Hepsiburada's Kaspi.kz-backed capital
    reinvestment, TCA data-portability obligations that could reduce seller switching costs, and
    multi-homing risk as sellers list across multiple platforms simultaneously.

sections:
  - id: section-1
    title: Competitive Landscape Overview
    body: >-
      Turkey's online retail economy is structurally marketplace-native: individual brand storefronts
      capture minimal share, and the top three platforms (Trendyol, Hepsiburada, Amazon Turkey) account
      for an estimated 60% of total e-commerce volume. Trendyol leads by a wide margin with $14B+ GMV
      in 2025 and an estimated 34–40% share of B2C marketplace transactions. Hepsiburada (NASDAQ: HEPS)
      follows at roughly one-fifth Trendyol's scale on a USD GMV basis, recording FY2025 GMV of TRY
      257.5B (IAS 29-adjusted, ~$5B USD at average 2025 FX) and Q1 2026 GMV of TRY 57.8B (+28.4% YoY).
      Amazon Turkey, despite global brand equity and logistics infrastructure, ranks third by monthly
      traffic (~34.6M visits vs. Trendyol's ~120M and Hepsiburada's ~59.7M in April 2026) and has not
      disclosed Turkey GMV. N11 (Doğuş Planet) is a distant fourth with ~12.6M monthly visits and
      estimated annual revenue in the low tens of millions. The landscape also includes Sahibinden
      (classifieds/used goods, distinct segment) and ÇiçekSepeti (gifting/lifestyle niche). The two
      most consequential competitive events of the past twelve months are the Temu/SHEIN regulatory
      retreat and the Uber consolidation of Getir plus Trendyol GO—each of which restructured Trendyol's
      threat environment more than any organic competitor move.
    claimRefs:
      - CP001
      - CP004
      - CP009
      - CP011
      - CP012
      - CP027
