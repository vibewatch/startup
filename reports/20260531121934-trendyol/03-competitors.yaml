      - FP001

  - id: section-2
    title: Direct Competitors — Hepsiburada and Amazon Turkey
    body: >-
      Hepsiburada is Trendyol's most credible domestic competitor across the full general marketplace
      category. Its Q1 2026 financials (TRY 57.8B GMV, 20.3M orders, 11.6M active customers, 101.6K
      active merchants) confirm sustained growth but also persistent profitability pressure—Q1 2026 net
      loss widened to TRY 992M and full-year 2025 net loss reached TRY 5.7B. The company's marketplace
      GMV share held at 68.9% in Q1 2026, matching Trendyol's model. The strategic game-changer for
      Hepsiburada is its acquisition by Kaspi.kz, Kazakhstan's NASDAQ-listed super-app that received a
      TRY 4.17B capital injection in December 2025. Kaspi brings a proven super-app playbook (payments,
      lending, marketplace) and patient capital, making Hepsiburada a more dangerous long-run challenger
      than its current profitability suggests. Amazon Turkey entered in 2018 with a direct-import and
      third-party marketplace model. It benefits from global supply-chain access, the Prime membership
      programme, international seller relationships enabling cross-border exports for Turkish merchants,
      and brand trust built on a 25-year global track record. Its core limitations are lower localization
      depth (language, payment modalities, taksit installment structure), a smaller domestic seller pool,
      and no equivalent to Trendyol Express's proprietary last-mile coverage. Amazon Turkey's monthly
      traffic of ~34.6M compares unfavourably to Trendyol's ~120M and Hepsiburada's ~59.7M, and no
      Turkey-specific GMV or revenue figures have been disclosed. The platform is best understood as a
      persistent, well-capitalised third-place threat rather than an imminent leadership challenger.
