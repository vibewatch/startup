  evidenceGaps:
    - id: EG001
      type: private-evidence-only
      severity: material
      description: >-
        Trendyol's active customer count (stated 35M+ in corporate materials) is not
        independently audited and has no filed equivalent to Hepsiburada's NASDAQ-reported
        11.6M active customers. Any competitive scale comparison relying on this number
        should treat it as directional; a diligence request should ask for verified cohort
        data including annual active buyers and repeat purchase rates.
      relatedQuestionRefs:
        - QP024
      relatedTableRefs:
        - TP001
    - id: EG002
      type: missing-source
      severity: material
      description: >-
        Amazon Turkey has not disclosed Turkey-specific GMV, revenue, seller count, or
        logistics capacity. All competitive assessments of Amazon Turkey's scale and strategic
        threat are inferred from traffic data (Similarweb), global Amazon filings, and
        third-party market analysis. A diligence setting should request Amazon Turkey
        seller count, fulfilment volume, and Prime subscriber data.
      relatedQuestionRefs:
        - QP003
        - QP013
        - QP020
      relatedTableRefs:
        - TP001
        - TP002
    - id: EG003
      type: missing-source
      severity: moderate
      description: >-
        The scope of Trendyol's remaining TCA data-portability commitments has not been
        fully published. The ACTECON analysis and Q1 2026 Mondaq bulletin confirm obligations
        remain active but do not specify what data categories are subject to portability,
        the enforcement calendar, or the penalties for non-compliance. This is a material
        gap for any moat assessment that relies on seller switching costs as a durable
        competitive advantage.
      relatedQuestionRefs:
        - QP008
        - QP010
        - QP018
      relatedTableRefs:
        - TP004
    - id: EG004
      type: missing-source
      severity: moderate
      description: >-
        Multi-homing rates (the share of Trendyol sellers also active on Hepsiburada or
        Amazon Turkey) are not publicly disclosed by any platform. Estimates of seller
        lock-in durability rely on qualitative assessments rather than quantified churn
        or multi-listing rates. Primary research or a seller survey would be required to
        quantify this risk.
      relatedQuestionRefs:
        - QP008
        - QP016
      relatedTableRefs:
        - TP004
    - id: EG005
      type: private-evidence-only
      severity: moderate
      description: >-
        Kaspi.kz's product integration roadmap for Hepsiburada has not been publicly
        detailed as of May 2026. The Kaspi super-app competitive threat relies on
        extrapolating Kazakhstan product playbook to Turkey; actual integration timelines,
        product priorities, and regulatory constraints in Turkey are unknown without
        Kaspi/Hepsiburada primary disclosure.
      relatedQuestionRefs:
        - QP027
      relatedTableRefs:
        - TP004
    - id: EG006
      type: missing-source
      severity: moderate
      description: >-
        Comparable engagement metrics (visit duration, pages-per-visit, bounce rate) for
        Trendyol versus Hepsiburada and Amazon Turkey are not available from a single
        authoritative source; Similarweb estimates vary by measurement period and panel
        methodology. Trendyol's disclosed take-rate (commission + advertising as % of GMV)
        has not been independently verified and cannot be precisely compared to Hepsiburada's
        disclosed revenue-to-GMV ratio without additional company disclosure.
      relatedQuestionRefs:
        - QP026
        - QP029
      relatedTableRefs:
        - TP001
        - TP002
