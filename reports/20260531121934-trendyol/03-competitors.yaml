callouts:
  - calloutType: strength
    title: Trendyol's logistics moat is the highest-capital barrier in Turkish e-commerce
    body: >-
      Trendyol Express covers all 81 provinces with 75 distribution centres and capacity
      for 1.5M+ daily parcels. Replicating this in Turkey would cost hundreds of millions
      of dollars and years of operational build. Hepsiburada and Amazon Turkey rely primarily
      on third-party carriers for last-mile delivery, creating measurable speed and reliability
      gaps in the most price-sensitive delivery-speed segment. The logistics asset also enables
      next-day free shipping economics that are structurally unavailable to pure marketplace
      models without owned infrastructure.
    claimRefs:
      - CP021
      - CP022
      - CP028
      - CP029

  - calloutType: strength
    title: Temu and SHEIN exit redirects $1.5B annually to domestic incumbents
    body: >-
      Turkey's February 2026 abolishment of duty-free import thresholds has created a
      regulatory moat for domestic platforms. Temu—formerly a major price-comparison threat
      in fashion and home goods—has pivoted to a fully domestic seller model, while SHEIN
      halted sales. Industry estimates place the redirected annual spend at approximately
      $1.5B. Trendyol, as the dominant domestic fashion and general merchandise platform,
      is the primary beneficiary, particularly in the budget-fashion category where cross-border
      Chinese platforms had previously competed on aggressive pricing.
    claimRefs:
      - CP013
      - CP014
      - CP015
      - CP016
      - CP034

  - calloutType: risk
    title: Hepsiburada's Kaspi.kz backing elevates competitive threat materially
    body: >-
      Kaspi.kz's December 2025 capital injection and control of Hepsiburada introduces a
      proven super-app operator with deep fintech, payments, and marketplace experience.
      Hepsiburada's FY2025 net loss of TRY 5.7B reflects investment, not fundamentals;
      with patient Kaspi capital, the company could sustain or increase competitive spending
      without the quarterly earnings pressure of a typical listed company. The primary channel
      of disruption is financial services: if Kaspi replicates its BNPL, credit scoring, and
      embedded-finance playbook on Hepsiburada's platform, it could close Trendyol Pay's
      head start in seller and consumer fintech.
    claimRefs:
      - CP005
      - CP007
      - CP036

  - calloutType: risk
    title: TCA data-portability obligations represent an unquantified seller lock-in risk
    body: >-
      The Turkish Competition Authority's ongoing monitoring of Trendyol's data-use practices
      (confirmed active in Q1 2026 bulletin) includes data-portability requirements that could,
      if enforced strictly, allow sellers to migrate their transaction and analytics histories
      to competing platforms. The algorithmic and historical data advantage that constitutes
      a core element of seller switching cost would be directly weakened by stringent
      portability enforcement. The full scope of the remaining commitments has not been
      publicly quantified, making this a material diligence gap for any underwriting that
      relies on seller retention moat durability.
    claimRefs:
      - CP025
      - CP026
      - CP038

