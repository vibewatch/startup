chapter:
  number: 1
  title: "Company Overview"
  summary: "Platform Science is a San Diego-based enterprise IoT and telematics software provider founded in 2015 that delivers an open connected vehicle platform for commercial fleets. The company has raised over $300 million from growth equity and strategic commercial transportation leaders, establishing OEM factory-fit integrations with major truck manufacturers while leaving detailed private operating margins and financial performance undisclosed."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Platform Architecture, and Founding Stage"
    body: |
      Platform Science was founded in 2015 in San Diego, California, to modernize commercial vehicle telematics and enterprise fleet IoT technology. Rather than relying on rigid, fragmented aftermarket hardware installations and proprietary protocols, Platform Science built an open, cloud-based fleet optimization platform designed to connect commercial vehicles, mobile devices, telematics data, and enterprise back-office applications on a unified software layer. The company is headquartered in San Diego, operating from facilities located along Towne Centre Drive, and has scaled its organization to between 500 and 1,000 employees according to industry directories and organizational records, with technical and engineering staff representing its largest single workforce segment.

      The company's core technological offering centers on its connected vehicle architecture and Virtual Vehicle platform, an initiative developed in close collaboration with leading commercial vehicle original equipment manufacturers (OEMs) including Daimler Truck North America (DTNA), PACCAR, and Navistar. Virtual Vehicle facilitates direct real-time access to vehicle telematics data by integrating hardware directly during factory production, eliminating costly aftermarket shop downtime. The software suite integrates electronic logging devices (ELD), driver workflow tools, Hours of Service (HOS) compliance, navigation, safety applications, and back-office fleet management tools on an open platform. Through a curated application marketplace and enterprise software development kits, fleet managers can customize application suites while software vendors access commercial vehicle distribution channels.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Key-Person Alignment"
    body: |
      Platform Science is led by Chief Executive Officer Jack Kennedy and Co-Founder and Chief Technology Officer Jake Fields, who established the enterprise in 2015 with an operating thesis that commercial trucking technology required an open computing environment similar to modern mobile operating systems. The executive team features senior operational leaders spanning key C-level and functional leadership roles, including commercial operations, finance, technology, strategy, and engineering. The engineering and product organizations form the operational backbone of the company, employing roughly 284 technical staff members focused on telematics infrastructure, device integration, and API services.

      Governance and strategic alignment are heavily anchored by a syndicate of tier-one venture investors and commercial trucking strategic partners. Major financial backers include 8VC, NewRoad Capital Partners, Prologis Ventures, and SoftBank Vision Fund 2, which led the company's Series C round in 2022. Platform Science's governance network is uniquely reinforced by equity and commercial partnerships with premier heavy-duty trucking OEMs and supply chain corporations, including Daimler Truck North America, PACCAR, Cummins, RyderVentures, and Schneider National. While this corporate backing provides deep industry access and co-development commitments, it introduces operational and strategic dependence on OEM assembly line integration schedules and joint roadmap governance.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO005"
