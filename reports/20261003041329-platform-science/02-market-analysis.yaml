callouts:
  - calloutType: "risk"
    title: "Do not treat acquired-unit ARR as market size"
    body: "The approximately $200 million Q2 2024 ARR figure belongs to the Trimble telematics businesses and follows Trimble's annualization definition. It is not accounting revenue, Platform Science ARR, available cash, or a TAM / SAM / SOM estimate."
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM015"
  - calloutType: "insight"
    title: "Adoption is an integration and migration decision"
    body: "The platform can reduce fragmentation and aftermarket installation burden, but consultative deployment, systems integration, and post-acquisition migration create timing and retention risk. Buyer diligence should focus on implementation capacity and active-unit conversion rather than partner counts alone."
    claimRefs:
      - "CM008"
      - "CM011"
      - "CM013"
      - "CM016"
