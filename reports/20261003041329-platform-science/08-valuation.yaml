callouts:
  - calloutType: "recommendation"
    title: "Diligence Call: Research-More"
    body: "Platform Science represents an extraordinarily unique distribution asset in commercial mobility due to its factory-level OEM integrations. However, the secondary market valuation reset to $473.55M in February 2025 and total lack of public disclosure regarding standalone organic ARR and gross margin demand strict investment discipline. We recommend holding off on equity participation until management provides full cap-table preference terms and audited post-acquisition financials."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV011"
  - calloutType: "risk"
    title: "Cap Table Preference and Dilution Overhang"
    body: "With $425.7M raised to date and a Series D-1 round marked down to $473.55M, existing common and early preferred shareholders face substantial liquidation preference overhang. Trimble's receipt of a 32.5% equity stake for its telematics business further dilutes financial sponsors, emphasizing the need for comprehensive cap table analysis."
    claimRefs:
      - "CV005"
      - "CV008"
      - "CV010"
