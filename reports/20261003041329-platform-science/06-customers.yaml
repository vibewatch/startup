chapter:
  number: 6
  title: "Customers"
  summary: "Platform Science delivers connected vehicle telematics and in-cab workflow software to commercial motor vehicle fleets through a differentiated OEM factory-installed model alongside enterprise retrofits. Real adoption is demonstrated by major carrier deployments including Cargo Transporters, C.R. England, Schneider National, Averitt, and Cheema Freightlines, alongside thousands of fleet accounts transitioning through the Trimble telematics acquisition, yet overall fleet retention rates, net revenue retention, and customer concentration metrics remain undisclosed private data."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Segmentation, Buyer Personas, and Commercial Structure"
    body: "Platform Science organizes its customer base across enterprise long-haul carriers, regional mid-market commercial fleets, and specialized private fleets operating Class 7 and Class 8 commercial vehicles. The economic buying decision is typically owned by VP-level fleet executives, Chief Operating Officers, or Chief Technology Officers seeking to modernize fleet mobility and automate regulatory compliance workflows. Daily operational users include commercial truck drivers navigating in-cab tablet environments and dispatch personnel monitoring routing, driver hours of service, and vehicle health. Commercial billing operates on a recurring subscription structure where fleets pay on a per-active-device basis for units deployed on the road. This variable usage approach lowers deployment friction during phased rollouts but concentrates revenue exposure directly to carrier fleet utilization rates and macro freight capacity fluctuations."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU007"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-adoption-trajectory"
    title: "Named Customer Proof, Deployment Scale, and Workflow Automation"
    body: "Enterprise carrier adoption provides verifiable evidence of Platform Science's operational utility across commercial transportation networks. Regional freight carrier Cargo Transporters implemented the Platform Science environment across its fleet and subsequently rolled out Trucker Path's in-cab navigation and trip planning tools fleet-wide following driver demos. Major truckload carriers including Schneider National, C.R. England, Averitt, and Cheema Freightlines have deployed Platform Science or partnered strategically around factory telematics. On operational efficiency, Platform Science asserts measurable automation outcomes across deployed fleets, citing that PS Fleet automates at least 80% of routine data entry, saves an average of 5 minutes per stop through Transportation Management System workflow integrations, eliminates over 60% of data errors via PS Workflow and PS Forms, and reduces time spent on unidentified driving time by 60% with PS HOS. Despite these operational benchmarks, verified aggregate customer counts and total active tractor counts remain unquantified in public disclosures."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU009"
      - "CU010"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-and-concentration-vulnerabilities"
    title: "Retention Dynamics, Account Expansion, and Channel Concentration Risks"
    body: "Platform Science's growth model relies on account expansion through its Virtual Vehicle Marketplace, where deployed fleets add modular third-party applications including commercial truck navigation, vehicle health intelligence, and driver productivity tools without requiring secondary aftermarket hardware installations. Dedicated Regional Account Managers conduct periodic business reviews to mitigate account churn, drive application cross-selling, and ensure platform renewal across mid-market accounts. However, contract durability faces significant transparency constraints: net revenue retention, gross revenue retention, annual logo churn, and contract duration metrics are not publicly disclosed. Customer and partner concentration is heavily tied to primary OEM relationships with Daimler Truck North America, PACCAR, and Volvo Group, as well as anchor carrier investors. Any friction during fleet management transitions or OEM telematics standardizations presents concentration risks that cannot be independently audited from external filings."
    claimRefs:
      - "CU007"
      - "CU011"
      - "CU012"
      - "CU015"
      - "CU016"
