callouts:
  - calloutType: "risk"
    title: "Undisclosed Unit Economics and Macro Capacity Sensitivity"
    body: "Platform Science's flexible commercial billing structure charges fleets only for active units and devices on the road. While this structure removes friction during phased implementations, it creates operational exposure to freight market downturns where carriers park tractors or scale down active capacity. Without public visibility into net revenue retention, gross revenue retention, or contract durations, investors cannot independently determine the revenue resilience of its customer base."
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU015"
  - calloutType: "strength"
    title: "Marketplace Cross-Selling Unlocks In-Cab Software Expansion"
    body: "By enabling third-party developers such as Trucker Path and major powertrain OEMs like Cummins to deploy software natively onto in-cab hardware, Platform Science creates a sticky software distribution marketplace. Deployed fleets can expand software capabilities without taking tractors out of service for hardware retrofits, enhancing platform durability and increasing customer lifetime value."
    claimRefs:
      - "CU003"
      - "CU007"
      - "CU012"
