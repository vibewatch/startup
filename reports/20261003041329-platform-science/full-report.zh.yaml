      - number: '1.2'
        title: 管理层、公司治理与关键人物利益绑定
        blocks:
          - type: paragraph
            body: >
              Platform Science 由首席执行官 Jack Kennedy 与联合创始人兼首席技术官 Jake Fields 掌舵。两人于 2015
              年创立公司，其经营理念在于商用卡车技术需要一套类似现代移动操作系统的开放计算环境。高管团队汇集了覆盖商业化运营、财务、技术、战略和工程研发等核心管理与职能岗位的资深运营人才。工程与产品部门构成公司运营支柱，雇佣了约
              284 名技术员工，主攻车联网基础设施、设备集成及 API 服务。


              公司治理与战略利益绑定深度依托一线风投机构与商用卡车产业资本财团。主要财务投资方包括 8VC、NewRoad Capital Partners、Prologis Ventures 以及领投了公司 2022 年 C
              轮融资的 SoftBank Vision Fund 2。Platform Science 的治理网络还获得重卡主流 OEM 和供应链巨头的股权投资与商业合作背书，包括 Daimler Truck North
              America、PACCAR、Cummins、RyderVentures 及 Schneider National。尽管产业方的加持带来了深厚的行业资源与联合研发承诺，但也让公司在运营与战略上受制于 OEM
              产线集成进度与联合技术路线图治理。
