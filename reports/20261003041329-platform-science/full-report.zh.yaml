        title: 买方、用户、付费方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              证据表明采购决策涉及多方博弈，而非单一通用的车队买方。Werner
              公告指出车队系统与技术主管是落地实施的发起人，而驾驶员与后台人员是客户和公司资料中所述的日常用户；具体合同付费方与预算科目仍未披露。客户采纳可以始于车队替换碎片化应用与设备、OEM
              在出厂阶段嵌入车联网，或是应用提供商寻求应用市场分发渠道。Platform Science 表示其计费挂钩在途活跃设备与车辆单元，但未公布单价或最低合同金额。投资回报率（ROI）证据同样受限：Vnomics
              并非独立基准评测机构，其自述旗下 True Fuel 应用可将年燃油开支降低 3% 至 10%，并带来立竿见影的正向 ROI。该单一产品的说法或许能促进采纳，但无法证实全平台的客户经济模型。
