      - number: '5.3'
        title: 驾驶员工作流、法规合规与企业后台系统
        blocks:
          - type: paragraph
            body: >-
              运行在驾驶室硬件与 Virtual Vehicle 运行时之上的，是 Platform Science 旗下品牌为 PS Fleet
              的企业级软件应用层。该套件囊括核心运营服务，包括服务时间（HOS）法规合规、驾驶员车辆检查报告（DVIR）、驾驶员即时通讯、商用逐向导航以及用于行程自动化执行的 PS Workflow。PS Workflow
              依托地理围栏自动触发机制并与承运商运输管理系统（TMS）保持实时同步，将驾驶员日常手动数据录入工作减少了高达 80%，消除了约 60% 的常见调度差错，并将每次配送停靠耗时平均缩短了 5 分钟。


              合规模块专为北美跨境与欧洲车队运营打造，严格遵循美国 FMCSA §396.11 标准、加拿大 CCMTA
              要求以及欧盟智能数字行驶记录仪规范。后台车队管理驾驶舱接入实时车联网数据流，提供不间断的车辆位置追踪、地理围栏状态告警、安全事件评分及行车轨迹回放。为使平台收费契合货运市场的周期性运力波动，Platform
              Science 采用了灵活的计费架构：仅针对在途服役的在运营牵引车及移动设备向汽车承运商开具账单，而非采用全车队固定的静态软件席位许可模式。
