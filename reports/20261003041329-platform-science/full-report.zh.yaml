      - number: '3.2'
        title: 竞对画像、业务规模与市场定位
        blocks:
          - type: paragraph
            body: >-
              评估竞争态势需要横向对比直接竞对与传统老牌厂商的业务规模、目标车队层级、硬件策略及平台覆盖范畴。Samsara
              作为高增长的企业级车联网领军企业，提供覆盖行车记录仪、资产追踪、车辆维保和车队调度的端到端自研硬件与云端 SaaS
              套件；其一体化封闭架构具备极高的稳定性与快速部署能力，却将大型承运商牢牢锁定在其专有网关硬件与封闭应用目录之中。Motive 凭借即插即用安装、激进的定价策略和一体化 AI
              行车记录仪安全功能，在小型、中型及部分大型车队市场展开激进争夺，但缺少工厂产线级别的 OEM 原厂合作。作为车队移动出行领域资历最老的前辈之一，Omnitracs
              在传统卡车承运商中坐拥庞大的存量客户群，却持续承受老旧硬件架构与高昂切换成本带来的逆风阻力。Platform Science 则精准卡位大型企业级市场，允许承运商利用原厂预装车联网连接，直接在驾驶舱内的
              Samsung Galaxy Active 平板上运行顶尖的第三方应用，例如用于过磅免检的 Drivewyze、用于移动单据扫描的 Transflo/Vector 以及各类专业路线规划工具。
