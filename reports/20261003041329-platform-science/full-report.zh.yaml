      - number: '5.2'
        title: Virtual Vehicle 平台与 OEM 原厂伙伴关系
        blocks:
          - type: paragraph
            body: >-
              Platform Science 最核心的技术差异化优势在于其 Virtual Vehicle 平台。这是一个与 Daimler Truck North America（DTNA）、PACCAR（旗下拥有
              Kenworth 和 Peterbilt）以及 Navistar
              等一级原始设备制造商（OEM）战略联合研发的开放式车联网运行环境。传统车队车联网架构历来要求承运商在整车交付后，拆开仪表盘加装后装线缆、破线接入原厂线束并固定外挂车联网设备；而 Virtual Vehicle
              在整车初始出厂组装线上，便直接嵌入了车联网网关硬件与边缘操作系统固件。


              这种原厂集成使软件平台无需加装二次传感器，即可直接原生获取高保真车辆遥测数据。OEM
              借助该平台运行时交付原厂品牌的车辆健康与诊断软件工具，实现自动化故障预警与预测性维护建模。与此同时，第三方开发者、车联网服务商（TSP）和车队运营团队可直接通过 OTA
              空中下载技术向车载计算单元部署软件。该平台分发架构将物理商用卡车转化为可通过软件升级的边缘终端，大幅削减了车队部署摩擦、物理改装停运时间以及现场硬件的后续维护成本。
            claimRefs:
