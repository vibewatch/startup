  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式挂钩使用量但商业细节不透明
        blocks:
          - type: paragraph
            body: >-
              最明确的公开商业化证据是 Platform Science
              声明客户仅按在途活跃设备和车辆单元付费。这支持了其收入为挂钩使用量的经常性软件模式的判断，但并未明确单车单价、最低采购承诺、合同期限、收入确认方式或实际折扣水平。公司还将 PS Fleet 和 Virtual
              Vehicle 作为具备应用生态的集成式车队平台对外推广；然而现存材料并未披露 OEM
              准入、第三方应用、硬件、网络连接、实施交付或运维支持是按项单独收费还是打包计价。因此，单凭产品架构无法充分评估收入质量，必须获取合同样本、发票、递延收入明细表及按业务线拆分的收入数据，方能将经常性软件收入与硬件、专业服务和代收代付的网络流量费用准确区隔开来。
