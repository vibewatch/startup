  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              本报告界定的可投资市场边界为面向商用车队的企业级车联网软件，具体涵盖：车载信息服务、驾驶舱工作流与合规应用、应用及设备管理、车辆数据访问，以及打通驾驶员、车辆、后台系统与第三方应用的集成中间层。实际替代方案不仅来自其他车联网厂商，还包括碎片化的移动应用、老旧的专用车载系统以及车队自建的集成方案。根据
              Samsung 合作伙伴案例说明，车队先是受制于第一代系统，随着移动端工具剧增，又面临数据与用户体验割裂的困境。Platform Science 将自身定位为统一整合层，而 Trimble 交易明确排除了
              Trimble 旗下的 Enterprise、Maps、Vusion 和 Transporeon
              业务。因此，通用的运输管理、地图测绘、货运采购、货运经纪、整车制造及燃油开支，除非依托车联网软件层交付，否则均归于本章核心市场范畴之外。
