              Platform Science 的 Virtual Vehicle 平台具备较传统后装车联网厂商更持久的结构性优势：软件直接在 Daimler Truck 和 PACCAR 的 OEM
              产线上与边缘硬件完成集成，省去了后装硬件安装成本与驾驶室拆装困扰。
