chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、平台架构与创立阶段
        blocks:
          - type: paragraph
            body: >
              Platform Science 于 2015
              年在加利福尼亚州圣迭戈成立，旨在推进商用车辆车联网及企业级车队物联网（IoT）技术现代化。公司摒弃僵化、割裂的后市场硬件加装与私有专有协议，构建了一套基于云端的开放式车队优化平台，在统一软件层上打通商用车辆、移动设备、车联网数据及企业后台应用。公司总部位于圣迭戈
              Towne Centre Drive 办公区。根据行业名录与组织记录，公司人员规模已扩充至 500 到 1,000 人之间，其中技术与工程研发人员是占比最大的单一员工群体。


              公司的核心技术产品立足于车联网架构及 Virtual Vehicle 平台，该项目是与 Daimler Truck North America（DTNA）、PACCAR 和 Navistar
              等商用车辆原始设备制造商（OEM）深度联合研发的成果。Virtual Vehicle
              借助在整车出厂生产环节直接集成硬件，实现对车辆远程通信数据的直接实时读取，彻底省去成本高昂的后市场改装停运时间。该软件套件在开放平台上整合了电子记录设备（ELD）、驾驶员工作流工具、服务时间（HOS）合规、导航、安全应用及后台车队管理工具。依托精选应用市场与企业级软件开发套件（SDK），车队管理者得以灵活定制应用套件，软件供应商也能顺畅切入商用车辆分发渠道。
