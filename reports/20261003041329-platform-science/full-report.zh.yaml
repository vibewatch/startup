      - number: '8.4'
        title: 图表与要点
        blocks:
          - type: callout
            title: 尽调结论：继续研究（Research-More）
            body: >-
              凭借主机厂车规级出厂集成能力，Platform Science 在商用移动出行领域构成了极其独特的分发资产。然而，2025 年 2 月二级市场估值重置为 $473.55M，且独立内生 ARR
              与毛利率完全没有公开披露，要求投资执行严格纪律。建议在管理层提供完整的股权结构表优先条款以及收购后经审计财务数据之前，暂缓参与股权投资。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
          - type: callout
            title: 股权结构表优先权与稀释悬顶
            body: >-
              截至目前累计融资 $425.7M，且 D-1 轮估值下调至 $473.55M，现有普通股及早期优先股股东面临沉重的清算优先权悬顶压力。Trimble 出让车联网业务换取 32.5%
              股权，进一步稀释了财务投资人，突显深入分析股权结构表的必要性。
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV010
