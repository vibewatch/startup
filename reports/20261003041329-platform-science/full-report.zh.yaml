      - number: '4.4'
        title: 财务结论：具备经常性特征，但当前无法完成投资评估
        blocks:
          - type: paragraph
            body: >-
              按活跃单元计费的机制配合 OEM 原厂分发渠道，构建了一套看似合理、后装摩擦较低的经常性收入模型，但现有证据不足以支撑对收入持续性与边际贡献率的研判。拟推进的 Trimble 并购案原定在交割后向 Trimble
              出让 32.5% 的股权及一个董事会席位，但手头证据仅能证实 2024 年提出的交易方案、预期的 2025
              年上半年交割窗口及交割先决条件，无法确认截至报告生成日该交易的最新推进状态、最终股本结构或整合落地表现。因此，在获取经审计的单体与备考财务报表、ARR 明确口径与变动桥接表、客群队列留存率、毛利率拆解、OEM
              商业条款、客户集中度、现金与债务状况、月度烧钱速度及最新股权结构表之前，针对该标的的投资判断依然受阻。
