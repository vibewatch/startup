      - number: '1.3'
        title: 融资历程、企业规模与发展里程碑
        blocks:
          - type: paragraph
            body: >
              Platform Science 保持着克制的成长性股权融资节奏，自 2017 年以来历经 7 轮及以上融资，累计筹集超 $300M 股权与战略成长资本。公司的融资历程始于 2017 至 2018 年间由 8VC
              和 NewRoad Capital Partners 领投的早期可转债与 A 轮融资；随后于 2020 年 5 月完成由 Prologis Ventures 领投的 $54M B 轮融资。2022 年 2
              月，SoftBank Vision Fund 2 领投其 $115M C 轮融资，据报道投后估值达到 $575M。2024 年 4 月，Platform Science 获得 $125M
              业务扩张成长轮融资，由老股东 8VC、NewRoad Capital Partners 和 Prologis Ventures 继续加持，新投资方 Activant Capital、Manhattan
              Ventures Partners 和 BDT & MSD Partners 参投，战略盟友 Cummins、PACCAR 与 C.R. England 亦跟投。


              企业级落地里程碑验证了真实车队需求，其中标杆项目为 Werner Enterprises 于 2020 年 9 月选定 Platform Science，为其近 8,000
              辆卡车组成的车队全量装配定制平板车联网设备。战略合作亦不断突破 OEM 集成节点：2020 年 5 月 Daimler Truck North America 率先推出原厂预装 Virtual Vehicle
              车联网；2023 年与 PACCAR 及 Cummins 扩大结盟；随后接连拿下 Averitt 和 Cheema Freightlines 等区域车队大单；并于 2026 年启动 Connected
              Vehicle Lab 北美巡展。然而，鉴于 Platform Science
              仍属非上市软件企业，年经常性收入（ARR）、净留存率与毛利率等关键财务数据均未披露，仍需针对其单车经济模型与渠道分成比例保持深入尽调。
