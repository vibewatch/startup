  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 决策树展示从 OEM 分销验证、Trimble 资产整合规模，到得出“继续研究”（Research-More）投资建议的推导脉络。
    data:
      nodes:
        - label: OEM 前装分销获得验证（DTNA、PACCAR）
        - label: 并购带动规模跨越式跃升（来自 Trimble 的 $300M 收入 / $200M ARR）
        - label: 估值重置风险（Series D-1 轮降至 $473.55M）
        - label: 财务透明度缺失（未披露独立 ARR 或留存数据）
        - label: 最终尽调结论：有待完成财务尽调，维持“继续研究”
        - label: 执行推进要点：跟踪整合进展，要求提供经审计的 P&L
      edges:
        - from: OEM Factory Distribution Validated (DTNA, PACCAR)
          to: M&A Scale Step-Function ($300M Rev / $200M ARR from Trimble)
        - from: M&A Scale Step-Function ($300M Rev / $200M ARR from Trimble)
          to: Valuation Reset Risk (Series D-1 down to $473.55M)
        - from: Valuation Reset Risk (Series D-1 down to $473.55M)
          to: Financial Transparency Deficit (No Standalone ARR or Retention Data)
        - from: Financial Transparency Deficit (No Standalone ARR or Retention Data)
          to: 'Final Diligence Call: Research-More Pending Financial Diligence'
        - from: 'Final Diligence Call: Research-More Pending Financial Diligence'
          to: 'Execution Tranche: Track Integration and Require Audited P&L'
    approximationNotes: 该逻辑推导将战略优势与财务不透明度对照权衡，据此确立投资立场。
