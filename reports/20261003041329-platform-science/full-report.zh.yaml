            body: >-
              FreightWaves 及其雅虎财经（Yahoo Finance）转载报道称，Platform Science 于 2024 年 4 月获得 $125M 成长轮投资，自 2017 年以来累计融资金额达
              $309M。该数据与 Tracxn 统计的 8 轮共计 $293M 以及 Clay 统计的 7 轮共计 $322.7M
              无法完全对齐。上述指标仅为累计融资额，并非账面现金余额，无法反映历次交割以来的资金消耗、负债情况、受限现金、烧钱速度或现金跑道。此外，2024 年 9 月的披露文件说明了拟收购 Trimble
              全球运输车联网业务的计划；据报道，标的业务创造了约 $300M 的 TTM 收入、约 $30M 的 TTM 营业利润以及 2024 年 Q2 约 $200M 的
