      - number: '4.2'
        title: OEM 渠道分发或可减少部署摩擦，但不必然降低获客成本
        blocks:
          - type: paragraph
            body: >-
              FreightWaves 报道称，Virtual Vehicle 在车辆生产过程中直接集成车联网硬件，避免了成本高昂的后装改装。这降低了原厂配置车辆的实际部署摩擦，并为 Platform Science 打开了
              OEM 渠道分发通路；按活跃单元计费的模式也使收费与车队实际利用率相匹配。然而，这两点均无法证明其获客成本（CAC）低廉、回本周期短、渠道分成具备吸引力或享有高毛利率。现存材料并未提供任何 OEM
              收入分成条款、直销费用、交付实施负担、蜂窝流量与云基础设施成本、支持服务成本、硬件补贴或续约数据。至于公开宣传的运营提效成果（包括至少 80%
              的数据录入实现自动化），均属公司自述口径，未披露样本量、测算周期或独立第三方验证，应作为销售宣传材料对待，而非单车经济模型的有效佐证。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI015
              - CI016
