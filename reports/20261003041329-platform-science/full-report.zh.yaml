  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 商用车队车联网行业格局与架构分层
        blocks:
          - type: paragraph
            body: >-
              商用车队车联网与网联车生态呈现两极分化格局：一类是自研封闭技术栈的车联网供应商，另一类是模块化开放软件平台。Omnitracs 和 Trimble
              等传统老牌厂商在历史上依靠专有硬件终端与僵化的私有协议，长期垄断大型长途干线承运商。以 Samsara 和 Motive 为代表的新一代云原生厂商，通过部署自研即插即用车联网网关，并紧密绑定合规、安全和 GPS
              追踪等统一自营软件应用，赢得了可观的市场份额。与此相对，Platform Science 奉行以 Virtual Vehicle 平台为核心的开放生态战略，该平台最初与 Daimler Truck North
              America（DTNA）联合研发，随后被 PACCAR 及其他主流商用车制造商采用。Virtual Vehicle
              无需强迫车队安装第三方后装线路和二次加装车联网单元，而是在整车生产线上直接集成至出厂电子控制模块（ECM）。在驾驶室内，Platform Science 携手 Samsung Electronics 部署搭载标准
              Android 操作环境的商用三防平板，使承运商得以灵活配置模块化车载应用，而不必受制于单一厂商封闭的产品迭代规划。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
