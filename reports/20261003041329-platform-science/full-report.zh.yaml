  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 驾驶舱硬件与边缘车联网架构
        blocks:
          - type: paragraph
            body: >-
              Platform Science 采用专为 6 至 8 级（Class 6–8）大型商用车辆及专业车队设备量身定制的混合式“硬件-边缘-云端”架构。在物理层，驾驶室内边缘计算底座以 Instinct
              车载网关为核心，通过标准 J1939 及早期 J1708 CAN 总线接口，与车辆电子控制单元（ECU）建立持久的有线硬连线集成。Instinct 网关内置 4G LTE 蜂窝调制解调器、多模卫星导航 GPS
              接收机及本地固态存储器。网关与车辆供电总线保持带保险丝的有线硬连接，而非采用安全性较差的诊断接口扩展头（dongle），从而确保不间断采集发动机故障代码、车速、燃油消耗率以及满足美国 FMCSA 和加拿大
              CCMTA 电子记录设备（ELD）法规所必需的防篡改里程表数据。


              驾驶舱内的人机交互通过专用的 Android 三防平板实现，这些平板依照 OEM 驾驶舱环境固定安装在驾驶员视线范围内，如 A 柱、仪表板或车顶控制台。边缘硬件生态采用模块化拓展，囊括 Video
              Intelligence 安全套件——由安装在雨刮器清扫区域内的前视行车记录仪、四通道车载数字录像机（DVR）以及 Cabin Intelligent Monitor
              面向驾驶员的监测传感器组成。机器学习推理直接在边缘传感器数据流上运行，用于区分驾驶员正常动作与疲劳、分心状态；同时根据急刹车、急转弯和猛烈加速等车辆动态触发视频事件抓拍。辅助输入接口还将挂车追踪车联网、冷链货运温度传感器及取力器（PTO）监控进一步整合至中央网关数据流中。
