              纳入约 $300M 往期收入与 $200M 订阅制年经常性收入（ARR）。相反，反向投资逻辑直指其极低的非公开披露透明度、对主机厂渠道的高度依赖及资本结构稀释。该公司独立运营业务从未披露独立
