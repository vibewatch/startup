  - id: FU001
    title: 客户生命周期与平台扩张循环
    type: journey-map
    summary: 阐释商用车队从初步评估到 OEM 原厂预装配置、实际远程信息处理部署以及应用市场扩张的全生命周期。
    data:
      items:
        - label: 1. OEM 规格选定与评估
          stage: 采购
          actor: 车队运营副总裁与 OEM 经销商
          touchpoints:
            - 评估 Class 8 卡车订单上的 Virtual Vehicle 原厂预装选配项
            - 审核 FMCSA 注册 ELD 合规性及统一车载平板集成方案
            - 协商按活跃设备计费的商业订阅条款
        - label: 2. 初始车辆配置
          stage: 初始启用
          actor: 车队实施团队与调度部门
          touchpoints:
            - 启用原厂预装远程信息处理系统或执行后装平板安装
            - 将 PS Workflow 及表单与承运人的运输管理系统（TMS）对接配置
            - 建立司机档案与电子在岗时长名册
        - label: 3. 全车队上线运营
          stage: 正式运营
          actor: 商用车司机与安全经理
          touchpoints:
            - 借助符合 FMCSA 规范的自动化 PS HOS 管理司机每日行车日志
            - 执行调度路线，减少人工录入行政数据
            - 监控实时 GPS 位置与自动化车辆检查报告
        - label: 4. 客户管理与健康度评估
          stage: 留存
          actor: 区域大客户经理与车队管理层
          touchpoints:
            - 开展定期业务复盘，重点评估车队可量化的 ROI
            - 化解续约风险，处理日常运营异常工单
            - 评估司机利用率，跟进未分配驾驶时间的缩减指标
        - label: 5. 应用市场生态拓展
          stage: 扩张
          actor: 车队技术主管与第三方应用开发者
          touchpoints:
            - 在 Virtual Vehicle Marketplace 上启用 Trucker Path 导航工具
            - 部署 Cummins Vehicle Health Intelligence 用于远程发动机诊断
            - 交叉销售安全、节油与路线规划等更多模块化应用
        - label: 6. 平台多年期续约
          stage: 续约
          actor: 承运商高管层与销售副总裁
          touchpoints:
            - 审阅车队车联网多年期订阅协议
            - 对比传统后装方案，评估总拥有成本
            - 评估后续扩大 OEM 前装车辆的交付规模
    approximationNotes: 阶段划分为概念示意，综合归纳自区域大客户经理的客户生命周期职责记录，以及经核实的 Marketplace 集成流程。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU011
      - CU012
