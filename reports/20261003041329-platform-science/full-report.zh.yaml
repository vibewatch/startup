figures:
  - id: FO001
    title: Platform Science 公司与融资里程碑时间线
    type: timeline
    summary: 按时间顺序展示 2015 年至 2026 年间关键融资轮次、OEM 合作伙伴关系、企业级客户部署与产品发布历程。
    data:
      items:
        - label: 公司创立
          date: '2015'
          detail: Jack Kennedy 与 Jake Fields 于圣迭戈创立 Platform Science，旨在开发开放式车队软件。
          tone: positive
        - label: 早期种子轮与 A 轮融资
          date: 2017 - 2018
          detail: 完成由 8VC 和 NewRoad Capital Partners 领投的早期融资轮，用以开发网联车辆软件。
          tone: positive
        - label: B 轮融资（$54M）
          date: May 2020
