    title: "Do not combine target ARR with Platform Science revenue"
    body: "The approximately $200 million ARR figure is a Q2 2024 performance measure for Trimble's proposed divested telematics units. It is not Platform Science stand-alone ARR, recognized revenue, deferred revenue, or proof of current combined ARR."
    claimRefs:
      - "CI010"
      - "CI012"
      - "CI013"

  - calloutType: "recommendation"
    title: "Financial underwriting requires a private data room"
    body: "Proceed only after reconciling audited stand-alone and pro forma statements, recurring-revenue definitions, gross margin, retention, customer concentration, OEM economics, cash, debt, burn, transaction status, and the post-transaction cap table."
