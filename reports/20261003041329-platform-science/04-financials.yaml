company:
  name: "Platform Science"
chapter:
  number: 4
  title: "Financials"
  summary: "Platform Science publicly describes active-device billing, but does not disclose stand-alone revenue, ARR, gross margin, cash, burn, runway, retention, or sales-efficiency metrics. A 2024 proposed acquisition targeted Trimble telematics units with approximately $300 million of trailing revenue, $30 million of operating profit, and $200 million of Q2 2024 ARR; those metrics belong to the proposed acquired units, not to Platform Science's stand-alone or current combined results."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model is usage-aligned but commercially opaque"
    body: "The clearest public monetization evidence is Platform Science's statement that customers pay only for active devices and units on the road. That supports a usage-aligned recurring software interpretation, but it does not establish price per unit, minimum commitments, contract duration, revenue recognition, or realized discounts. The company also markets PS Fleet and Virtual Vehicle as an integrated fleet platform with an application ecosystem; however, the retained sources do not disclose whether OEM access, third-party applications, hardware, connectivity, implementation, or support are separately charged or included in a bundle. Revenue quality therefore cannot be underwritten from product architecture alone. Contract samples, invoices, deferred-revenue schedules, and revenue by stream are required to distinguish recurring software revenue from hardware, services, and pass-through connectivity."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"

  - id: "gtm-and-unit-economics"
    title: "OEM distribution may reduce deployment friction, not necessarily CAC"
    body: "FreightWaves reports that Virtual Vehicle integrates telematics hardware during vehicle production, avoiding costly aftermarket installation. This can reduce physical deployment friction for factory-equipped vehicles and gives Platform Science access to OEM distribution, while the active-unit billing claim may align charges with fleet utilization. Neither fact proves low customer acquisition cost, short payback, attractive channel economics, or high gross margin. The retained evidence provides no OEM revenue-share terms, direct-sales expense, implementation burden, cellular and cloud cost, support cost, hardware subsidy, or renewal data. Public operating-benefit claims, including at least 80% automation of data entry, are company claims without disclosed sample size, measurement period, or independent validation, so they should be treated as sales evidence rather than unit-economics proof."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI015"
      - "CI016"

  - id: "capital-and-proposed-transaction"
    title: "Financing signals scale, while reported totals conflict"
    body: "FreightWaves and its Yahoo Finance syndication reported a $125 million growth investment in April 2024 and $309 million raised since 2017. That figure does not reconcile with Tracxn's $293 million across eight rounds or Clay's $322.7 million across seven rounds. These are funding-raised figures, not cash balances, and they do not reveal spending since each close, debt, restricted cash, burn, or runway. Separately, September 2024 disclosures described a proposed acquisition of Trimble's global transportation telematics units. The target units reportedly produced approximately $300 million of trailing revenue, $30 million of trailing operating profit, and $200 million of Q2 2024 ARR. Those are target-unit metrics with distinct periods and definitions; they must not be presented as Platform Science stand-alone revenue, current combined revenue, or cash generation."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"

  - id: "underwriting-verdict"
    title: "Financial verdict: potentially recurring, presently ununderwritable"
    body: "The active-unit billing mechanism and OEM-native distribution create a plausible recurring-revenue model with lower installation friction, but the available evidence is insufficient to assess revenue durability or contribution margin. The proposed Trimble transaction would have transferred a 32.5% stake and a board seat to Trimble upon closing, yet the assigned evidence only establishes the 2024 proposal, its expected first-half 2025 closing window, and closing contingencies; it does not establish the transaction's current status, final capitalization, or integration performance as of the run date. The investment case therefore remains blocked on audited stand-alone and pro forma financials, ARR definitions and bridge, cohort retention, gross-margin decomposition, OEM economics, customer concentration, cash and debt, monthly burn, and an updated cap table."
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"

