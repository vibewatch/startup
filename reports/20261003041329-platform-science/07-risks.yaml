callouts:
  - calloutType: risk
    title: Dual-Edged OEM Governance and Counterparty Alignment
    body: >-
      Platform Science's most durable competitive advantage—OEM-native factory installation across Daimler Truck, PACCAR, and Volvo Group—is simultaneously its most acute strategic risk.
      While OEM equity stakes align economic incentives, vehicle manufacturers retain asymmetric leverage over factory software slots, hardware telematics configurations, and in-cab data access policies.
      Any strategic pivot by an OEM partner toward a captive proprietary software stack or a multi-platform environment would immediately erode Platform Science's pipeline conversion and terminal valuation.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR013
  - calloutType: insight
    title: Integration Liabilities of the Trimble Telematics Transaction
    body: >-
      Acquiring Trimble's global telematics business introduces an unprecedented scaling challenge: integrating $300 million in trailing revenue and $200 million in ARR while granting Trimble a 32.5% equity stake and a board seat.
      The transaction shifts Platform Science from an agile software disruptor into an asset-heavy enterprise telematics steward responsible for legacy hardware migrations, diverse global carrier commitments, and complex cross-border closing conditions.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR011
