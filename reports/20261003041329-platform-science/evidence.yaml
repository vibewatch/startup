evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements confirming Annual Recurring Revenue (ARR), gross software margins, and net revenue
      retention rates.
    whyItMatters: >-
      Without audited operating revenue and margin metrics, SaaS valuation multiples and unit economic sustainability
      cannot be conclusively validated.
    diligencePath: >-
      Obtain confidential financial disclosures or audited financial packages from company management under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: series-d-valuation
    missingEvidence: >-
      Official or verified secondary reporting of the post-money equity valuation negotiated during the April 2024 $125
      million growth financing round.
    whyItMatters: >-
      The post-money valuation determines the implied share price trajectory from the $575 million valuation established
      at Series C in 2022.
    diligencePath: Request capitalization table summary and Series D financing term sheet details during investor diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: >-
      Comprehensive listing of smaller syndication participants, secondary share transaction holders, and OEM royalty
      terms.
    whyItMatters: >-
      Minority shareholders and OEM commercial revenue-share schedules impact net software margins and cap table voting
      thresholds.
    diligencePath: Inspect cap table register and master OEM commercial distribution agreements during legal review.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      A current independent market study with a reproducible category definition, geography, vehicle or account
      denominator, market value, CAGR, and Platform Science share.
    whyItMatters: >-
      Without a common denominator, the chapter cannot quantify TAM, SAM, SOM, growth, penetration, or obtainable share
      without false precision.
    diligencePath: >-
      Obtain the underlying methodology and data tables from a reputable fleet-telematics market study, then reconcile
      its scope to the chapter's included and excluded spend.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-procurement
    missingEvidence: >-
      Current price per active unit, platform and marketplace fees, minimum commitments, contract term, procurement
      authority, and budget owner by fleet and OEM segment.
    whyItMatters: >-
      These inputs determine attainable revenue per vehicle, sales-cycle friction, buyer concentration, and whether
      active-unit billing improves or weakens revenue durability.
    diligencePath: >-
      Review representative customer and OEM contracts, pricing schedules, renewal cohorts, sales-stage data, and
      procurement interview notes.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM001
      - TM003
