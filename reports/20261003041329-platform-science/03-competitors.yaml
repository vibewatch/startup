callouts:
  - calloutType: "insight"
    title: "Architectural Moat: Factory OEM Pre-Installation"
    body: "Platform Science's primary defensive moat against Samsara and Motive is its factory OEM integration on Freightliner (DTNA) and PACCAR trucks. By pre-installing the Virtual Vehicle telematics environment on the production line, Platform Science eliminates aftermarket vehicle downtime, technician installation labor, and secondary hardware costs for commercial fleets."
    claimRefs:
      - "CP001"
      - "CP002"
  - calloutType: "risk"
    title: "Software Trade-off: In-Cab Navigation Deficiencies"
    body: "Customer feedback consistently identifies native PS Nav accuracy issues, such as inappropriate residential routing and missed truck clearance restrictions. Fleets often must license dedicated third-party truck navigation tools such as CoPilot from the marketplace, adding recurring software licensing expense to fleet operating budgets."
    claimRefs:
      - "CP013"
      - "CP014"
