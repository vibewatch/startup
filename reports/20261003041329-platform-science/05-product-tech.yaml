callouts:
  - calloutType: "strength"
    title: "Structural Defensibility Through Factory-Installed OEM Telematics"
    body: "Platform Science's partnership model with Tier-1 commercial truck OEMs—including Daimler Truck North America, PACCAR, and Navistar—represents a significant structural barrier to entry against traditional aftermarket telematics vendors. By embedding Virtual Vehicle hardware and firmware onto the production line, Platform Science eliminates labor-intensive aftermarket cable splicing and vehicle downtime, establishing a native distribution channel directly into new Class 8 tractor deliveries."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE008"
  - calloutType: "risk"
    title: "Edge Hardware Installation Precision and Calibration Vulnerability"
    body: "Despite cloud-based management, system data fidelity remains strictly bound to physical edge hardware installation standards. Improper gateway wiring into the vehicle's J1939 CAN-bus risks data dropouts that violate federal ELD logging rules, while forward camera placement outside the wiper sweep path or driver-monitoring camera misalignment creates excessive false safety alerts that undermine driver trust and safety program adoption."
    claimRefs:
      - "CE002"
      - "CE004"
