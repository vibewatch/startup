      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              OEM-native installation is the clearest distribution driver in the retained evidence: FreightWaves reports
              that factory integration avoids costly aftermarket telematics installation, and the 2024 funding round was
              described as supporting more OEM and application partners. The open-app model can also broaden utility
              after deployment. Countervailing frictions are substantial. Samsung's account says integrations among
              apps, IoT devices, vehicle sensors, and back-end databases require significant work, and Platform
              Science's co-founder describes the consultative process as requiring time and effort. That makes
              implementation capacity, migration quality, and customer retention material adoption variables. ABI
              Research's call for value-proposition clarity after the Trimble acquisition reinforces the risk that
              greater scope does not automatically translate into realized value. A low-reputation AI-generated profile
              points directionally to cloud and real-time analytics demand, but it is not suitable for quantifying
              growth or independently validating adoption.
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM013
              - CM014
