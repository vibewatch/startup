          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI015
              - CI016
      - number: '4.2'
        title: OEM distribution may reduce deployment friction, not necessarily CAC
        blocks:
          - type: paragraph
            body: >-
              FreightWaves reports that Virtual Vehicle integrates telematics hardware during vehicle production,
              avoiding costly aftermarket installation. This can reduce physical deployment friction for
              factory-equipped vehicles and gives Platform Science access to OEM distribution, while the active-unit
              billing claim may align charges with fleet utilization. Neither fact proves low customer acquisition cost,
              short payback, attractive channel economics, or high gross margin. The retained evidence provides no OEM
              revenue-share terms, direct-sales expense, implementation burden, cellular and cloud cost, support cost,
              hardware subsidy, or renewal data. Public operating-benefit claims, including at least 80% automation of
              data entry, are company claims without disclosed sample size, measurement period, or independent
              validation, so they should be treated as sales evidence rather than unit-economics proof.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI015
              - CI016
      - number: '4.3'
        title: Financing signals scale, while reported totals conflict
        blocks:
          - type: paragraph
            body: >-
              FreightWaves and its Yahoo Finance syndication reported a $125 million growth investment in April 2024 and
              $309 million raised since 2017. That figure does not reconcile with Tracxn's $293 million across eight
              rounds or Clay's $322.7 million across seven rounds. These are funding-raised figures, not cash balances,
              and they do not reveal spending since each close, debt, restricted cash, burn, or runway. Separately,
              September 2024 disclosures described a proposed acquisition of Trimble's global transportation telematics
              units. The target units reportedly produced approximately $300 million of trailing revenue, $30 million of
              trailing operating profit, and $200 million of Q2 2024 ARR. Those are target-unit metrics with distinct
              periods and definitions; they must not be presented as Platform Science stand-alone revenue, current
              combined revenue, or cash generation.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI009
