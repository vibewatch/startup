chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Architecture, and Founding Stage
        blocks:
          - type: paragraph
            body: >
              Platform Science was founded in 2015 in San Diego, California, to modernize commercial vehicle telematics
              and enterprise fleet IoT technology. Rather than relying on rigid, fragmented aftermarket hardware
              installations and proprietary protocols, Platform Science built an open, cloud-based fleet optimization
              platform designed to connect commercial vehicles, mobile devices, telematics data, and enterprise
              back-office applications on a unified software layer. The company is headquartered in San Diego, operating
              from facilities located along Towne Centre Drive, and has scaled its organization to between 500 and 1,000
              employees according to industry directories and organizational records, with technical and engineering
              staff representing its largest single workforce segment.


              The company's core technological offering centers on its connected vehicle architecture and Virtual
              Vehicle platform, an initiative developed in close collaboration with leading commercial vehicle original
              equipment manufacturers (OEMs) including Daimler Truck North America (DTNA), PACCAR, and Navistar. Virtual
              Vehicle facilitates direct real-time access to vehicle telematics data by integrating hardware directly
              during factory production, eliminating costly aftermarket shop downtime. The software suite integrates
              electronic logging devices (ELD), driver workflow tools, Hours of Service (HOS) compliance, navigation,
              safety applications, and back-office fleet management tools on an open platform. Through a curated
              application marketplace and enterprise software development kits, fleet managers can customize application
              suites while software vendors access commercial vehicle distribution channels.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
