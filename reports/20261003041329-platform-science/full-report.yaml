              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Edged OEM Governance and Counterparty Alignment
            body: >-
              Platform Science's most durable competitive advantage—OEM-native factory installation across Daimler
              Truck, PACCAR, and Volvo Group—is simultaneously its most acute strategic risk. While OEM equity stakes
              align economic incentives, vehicle manufacturers retain asymmetric leverage over factory software slots,
              hardware telematics configurations, and in-cab data access policies. Any strategic pivot by an OEM partner
              toward a captive proprietary software stack or a multi-platform environment would immediately erode
              Platform Science's pipeline conversion and terminal valuation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: Integration Liabilities of the Trimble Telematics Transaction
            body: >-
              Acquiring Trimble's global telematics business introduces an unprecedented scaling challenge: integrating
              $300 million in trailing revenue and $200 million in ARR while granting Trimble a 32.5% equity stake and a
              board seat. The transaction shifts Platform Science from an agile software disruptor into an asset-heavy
              enterprise telematics steward responsible for legacy hardware migrations, diverse global carrier
              commitments, and complex cross-border closing conditions.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Platform Science's core investment thesis centers on its structural moat as an OEM-native connected
              vehicle platform. By embedding its Virtual Vehicle software directly onto factory assembly lines with
              Daimler Truck North America, PACCAR, Navistar, and Cummins, Platform Science circumvents the traditional
              friction, hardware expense, and downtime of aftermarket telematics retrofits. The platform benefits from
              powerful multi-sided network effects across fleets, telematics service providers, and third-party software
              developers. Enterprise fleet commitments, including Werner Enterprises deploying across nearly 8,000
              trucks, demonstrate proven production scalability. Furthermore, the transformative September 2024
              agreement to acquire Trimble's global telematics business units—yielding Trimble a 32.5% equity
              stake—transfers approximately $300M of trailing revenue and $200M of recurring subscription ARR into
              Platform Science's orbit. Conversely, the anti-thesis highlights severe private disclosure opacity, heavy
              OEM channel dependency, and capital-structure dilution. The standalone business has never disclosed
              standalone ARR, gross margins, or retention metrics, and secondary transaction data shows a severe reset
              from earlier valuations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
      - number: '8.2'
        title: Recommendation Stance, Risk Rating, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Our formal recommendation for Platform Science remains Research-More with medium confidence, accompanied
              by a high risk rating and a fair valuation stance. Although the company raised $125M in an April 2024
              growth round and boasts cumulative historical equity funding exceeding $425M, secondary market data from
              Forge reveals that the February 2025 Series D-1 round was priced at $3.33 per share, valuing the company
              post-money at $473.55M. This represents an explicit 17.6% nominal contraction from the $575M valuation
              established during its Series C round in 2022 led by SoftBank Vision Fund 2, and a 39.6% drop from
              intermediate growth marks. This valuation compression occurred despite expanding strategic OEM
              capitalization from Cummins, PACCAR, Daimler Truck, and RyderVentures. Because standalone software
              margins, customer acquisition unit economics, and churn rates remain tightly guarded private trade
              secrets, underwriting an aggressive buy stance is mathematically unsupportable without primary financial
              disclosures.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: Bull, Base, and Bear Scenarios with Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Evaluating Platform Science across operating scenarios reveals wide dispersion driven by the integration
              of Trimble's telematics units and OEM activation velocity. In the bull case, closing and digesting the
              Trimble telematics business establishes over $200M in consolidated ARR, while factory activations on
              PACCAR and Daimler trucks ramp rapidly, commanding a software re-rating toward 5.0x to 7.0x ARR ($1.5B to
              $2.1B enterprise value) on an eventual IPO trajectory. In the base case, integration costs and OEM
              adoption cycles prove protracted, sustaining ARR around $220M to $250M with valuation anchored around
              $1.0B to $1.2B (roughly 4.5x ARR). In the bear case, OEM partners assert margin pressure or build captive
              alternatives, Trimble migration suffers attrition, and valuation contracts toward asset-backed multiples
              of 1.5x to 2.0x ARR ($350M to $450M), mirroring the Series D-1 secondary mark. Diligence must focus on
              audited standalone financial statements, post-merger net retention, and cap-table liquidation preferences
              before capital commitment.
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Call: Research-More'
            body: >-
              Platform Science represents an extraordinarily unique distribution asset in commercial mobility due to its
              factory-level OEM integrations. However, the secondary market valuation reset to $473.55M in February 2025
              and total lack of public disclosure regarding standalone organic ARR and gross margin demand strict
              investment discipline. We recommend holding off on equity participation until management provides full
              cap-table preference terms and audited post-acquisition financials.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
          - type: callout
            title: Cap Table Preference and Dilution Overhang
            body: >-
              With $425.7M raised to date and a Series D-1 round marked down to $473.55M, existing common and early
              preferred shareholders face substantial liquidation preference overhang. Trimble's receipt of a 32.5%
              equity stake for its telematics business further dilutes financial sponsors, emphasizing the need for
              comprehensive cap table analysis.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV010
