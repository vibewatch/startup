      - number: '5.3'
        title: Driver Workflow, Regulatory Compliance, and Enterprise Back-Office
        blocks:
          - type: paragraph
            body: >-
              Operating atop the in-cab hardware and Virtual Vehicle runtime is Platform Science's enterprise software
              application layer, branded as PS Fleet. This suite encompasses core operational services including Hours
              of Service (HOS) regulatory compliance, Driver Vehicle Inspection Reporting (DVIR), driver messaging,
              turn-by-turn commercial navigation, and PS Workflow for automated trip execution. By capturing automated
              geofencing triggers and synchronizing with carrier Transportation Management Systems (TMS), PS Workflow
              automates up to 80% of routine driver manual data entry, eliminating approximately 60% of common dispatch
              errors and reducing driver stop turnaround duration by an average of five minutes per delivery stop.


              Regulatory compliance modules are engineered for cross-border North American and European fleet
              operations, adhering to strict United States FMCSA §396.11 standards, Canadian CCMTA requirements, and
              European Union smart digital tachograph standards. Back-office fleet management dashboards ingest
              real-time telematics streams to provide continuous vehicle location tracking, geofence status alerts,
              safety incident scoring, and route playback. To align platform consumption with cyclical freight market
              capacity, Platform Science structures platform monetization around a flexible billing framework where
              enterprise motor carriers are invoiced solely for active in-service tractors and active mobile devices on
              the road rather than fixed static fleet-wide software seat licenses.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
              - CE015
          - type: table
            tableRef: TE002
