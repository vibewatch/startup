      - number: '7.2'
        title: Regulatory, Legal, and Compliance Mandates
        blocks:
          - type: paragraph
            body: >-
              Commercial telematics and fleet management operations operate under non-negotiable regulatory scrutiny
              enforced by the Federal Motor Carrier Safety Administration (FMCSA) and international transport
              authorities. Platform Science's Virtual Vehicle and PS Fleet platforms deliver electronic logging device
              (ELD) functions, electronic driver vehicle inspection reports (eDVIR), and Hours of Service (HOS)
              compliance logging for enterprise motor carriers. Under federal regulations (49 CFR Appendix B to Part
              386), HOS compliance failures carry acute financial and operational penalties, exposing motor carriers to
              statutory fines of up to $19,246 per violation and individual drivers to fines up to $4,812 per violation.
              Because compliance errors or logging discrepancies can trigger DOT audit intervention, carrier safety
              rating downgrades, or roadside out-of-service orders, platform reliability in recording driver duty status
              is a mission-critical legal safeguard. Furthermore, the pending acquisition of Trimble's telematics units
              involves complex regulatory reviews across multiple international jurisdictions, introducing closing
              condition risks and foreign regulatory clearance contingencies.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
