              - CI012
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: 'Financial verdict: potentially recurring, presently ununderwritable'
        blocks:
          - type: paragraph
            body: >-
              The active-unit billing mechanism and OEM-native distribution create a plausible recurring-revenue model
              with lower installation friction, but the available evidence is insufficient to assess revenue durability
              or contribution margin. The proposed Trimble transaction would have transferred a 32.5% stake and a board
              seat to Trimble upon closing, yet the assigned evidence only establishes the 2024 proposal, its expected
              first-half 2025 closing window, and closing contingencies; it does not establish the transaction's current
              status, final capitalization, or integration performance as of the run date. The investment case therefore
              remains blocked on audited stand-alone and pro forma financials, ARR definitions and bridge, cohort
              retention, gross-margin decomposition, OEM economics, customer concentration, cash and debt, monthly burn,
              and an updated cap table.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
