      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Alignment
        blocks:
          - type: paragraph
            body: >
              Platform Science is led by Chief Executive Officer Jack Kennedy and Co-Founder and Chief Technology
              Officer Jake Fields, who established the enterprise in 2015 with an operating thesis that commercial
              trucking technology required an open computing environment similar to modern mobile operating systems. The
              executive team features senior operational leaders spanning key C-level and functional leadership roles,
              including commercial operations, finance, technology, strategy, and engineering. The engineering and
              product organizations form the operational backbone of the company, employing roughly 284 technical staff
              members focused on telematics infrastructure, device integration, and API services.


              Governance and strategic alignment are heavily anchored by a syndicate of tier-one venture investors and
              commercial trucking strategic partners. Major financial backers include 8VC, NewRoad Capital Partners,
              Prologis Ventures, and SoftBank Vision Fund 2, which led the company's Series C round in 2022. Platform
              Science's governance network is uniquely reinforced by equity and commercial partnerships with premier
              heavy-duty trucking OEMs and supply chain corporations, including Daimler Truck North America, PACCAR,
              Cummins, RyderVentures, and Schneider National. While this corporate backing provides deep industry access
              and co-development commitments, it introduces operational and strategic dependence on OEM assembly line
              integration schedules and joint roadmap governance.
