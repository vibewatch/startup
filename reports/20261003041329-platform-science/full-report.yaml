  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: In-Cab Hardware and Edge Telematics Architecture
        blocks:
          - type: paragraph
            body: >-
              Platform Science operates a hybrid hardware-edge-cloud architecture purpose-built for Class 6 through
              Class 8 enterprise commercial vehicles and specialized fleet equipment. At the physical layer, the in-cab
              edge foundation centers on the Instinct vehicle gateway, which establishes persistent, hardwired
              integration into the vehicle's electronic control units (ECU) via standard J1939 and legacy J1708 CAN-bus
              interfaces. The Instinct gateway houses internal 4G LTE cellular modems, dedicated multi-constellation GPS
              receivers, and localized solid-state storage. By maintaining a hardwired, fused electrical connection to
              the vehicle power bus rather than an unsecured diagnostic port dongle, the gateway ensures uninterrupted
              collection of engine fault codes, road speeds, fuel consumption rates, and tamper-resistant odometer data
              required for FMCSA and Canadian CCMTA electronic logging device (ELD) mandates.


              In-cab interaction is driven through dedicated ruggedized Android display tablets mounted in fixed driver
              line-of-sight configurations across OEM cab environments, such as A-pillar, dashboard, and overhead
              console installations. The edge hardware ecosystem expands modularly to include the Video Intelligence
              safety suite—comprising forward-facing dashcams positioned within the windshield wiper sweep zone,
              four-channel mobile digital video recorders (DVR), and Cabin Intelligent Monitor driver-facing sensors.
              Machine learning inference runs across edge sensor streams to distinguish normal driver movements from
              fatigue or distraction, while triggering video event capture from vehicle dynamics including hard braking,
              sharp cornering, and rapid acceleration. Auxiliary inputs further integrate trailer tracking telematics,
              cargo temperature sensors for refrigerated freight, and power take-off (PTO) monitoring into the
              centralized gateway datastream.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
