            title: Do not combine target ARR with Platform Science revenue
            body: >-
              The approximately $200 million ARR figure is a Q2 2024 performance measure for Trimble's proposed divested
              telematics units. It is not Platform Science stand-alone ARR, recognized revenue, deferred revenue, or
              proof of current combined ARR.
            calloutType: risk
            claimRefs:
              - CI010
              - CI012
              - CI013
