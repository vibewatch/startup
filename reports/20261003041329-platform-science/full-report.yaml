      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a multi-party buying process rather than a single generic fleet buyer. Werner's
              announcement identifies fleet systems and technology leadership as an implementation sponsor, while
              drivers and back-office staff are the daily users described across the customer and company materials; the
              exact contractual payer and budget line remain undisclosed. Adoption can begin with a fleet replacing
              fragmented apps and devices, an OEM embedding telematics during production, or an application provider
              seeking distribution through the marketplace. Platform Science says its billing follows active devices and
              units on the road, but publishes no unit price or contract minimum. ROI evidence is similarly bounded:
              Vnomics, not an independent benchmark, claimed its True Fuel application could reduce annual fuel spend by
              3% to 10% and deliver immediate positive ROI. That product-specific claim may motivate adoption, but it
              cannot establish platform-wide customer economics.
