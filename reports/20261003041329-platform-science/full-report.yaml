      - number: '5.2'
        title: Virtual Vehicle Platform and Factory OEM Partnerships
        blocks:
          - type: paragraph
            body: >-
              The core technical differentiator of Platform Science is its Virtual Vehicle platform, an open telematics
              operating environment developed in strategic collaboration with Tier-1 original equipment manufacturers
              (OEMs), including Daimler Truck North America (DTNA), PACCAR (Kenworth and Peterbilt), and Navistar. While
              legacy fleet telematics architectures have historically required carriers to pull aftermarket cabling
              through finished vehicle dashboards, splice into factory wiring harnesses, and mount external telematics
              boxes after delivery, Virtual Vehicle embeds connected vehicle gateway hardware and edge operating
              firmware directly onto the OEM assembly line during initial production.


              Factory integration grants the software platform direct, native access to high-fidelity vehicle telemetry
              without secondary sensor taps. OEMs utilize the platform runtime to deliver factory-branded vehicle health
              and diagnostic software tools, enabling automated prognostics and predictive maintenance modeling.
              Simultaneously, third-party developers, telematics service providers (TSPs), and fleet operations teams
              deploy software over-the-air directly to vehicle compute instances. This platform distribution
              architecture converts physical commercial trucks into software-upgradable edge endpoints, dramatically
              reducing fleet deployment friction, physical installation downtime, and recurring field hardware
              maintenance overhead.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE012
