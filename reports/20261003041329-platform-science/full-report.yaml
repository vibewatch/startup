            title: Financial underwriting requires a private data room
            body: >-
              Proceed only after reconciling audited stand-alone and pro forma statements, recurring-revenue
              definitions, gross margin, retention, customer concentration, OEM economics, cash, debt, burn, transaction
              status, and the post-transaction cap table.
