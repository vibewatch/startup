      - number: '1.3'
        title: Capitalization History, Enterprise Scale, and Evolutionary Milestones
        blocks:
          - type: paragraph
            body: >
              Platform Science has executed a disciplined growth financing trajectory, raising over $300 million in
              aggregate equity and strategic growth capital across seven or more financing rounds since 2017. The
              capitalization history includes early convertible notes and Series A funding led by 8VC and NewRoad
              Capital Partners between 2017 and 2018, followed by a $54 million Series B round led by Prologis Ventures
              in May 2020. In February 2022, SoftBank Vision Fund 2 led a $115 million Series C round at a reported
              post-money valuation of $575 million. In April 2024, Platform Science secured a $125 million growth
              expansion round backed by existing investors 8VC, NewRoad Capital Partners, and Prologis Ventures,
              alongside new investors Activant Capital, Manhattan Ventures Partners, and BDT & MSD Partners, plus
              strategic allies Cummins, PACCAR, and C.R. England.


              Enterprise deployment milestones demonstrate real-world fleet validation, led by enterprise contracts such
              as Werner Enterprises, which selected Platform Science in September 2020 to outfit its fleet of nearly
              8,000 trucks with custom tablet-based telematics devices. Strategic milestones also encompass OEM
              integration milestones, beginning with Daimler Truck North America launching factory-installed Virtual
              Vehicle telematics in May 2020, followed by expanded alliances with PACCAR and Cummins in 2023, regional
              fleet wins with carriers such as Averitt and Cheema Freightlines, and the 2026 launch of its Connected
              Vehicle Lab North American roadshow. However, because Platform Science remains a privately held software
              entity, critical financial metrics including annual recurring revenue (ARR), net retention, and gross
              margins remain undisclosed, necessitating continued diligence around unit economics and channel margin
              splits.
