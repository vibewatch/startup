      - number: '6.3'
        title: Retention Dynamics, Account Expansion, and Channel Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Platform Science's growth model relies on account expansion through its Virtual Vehicle Marketplace, where
              deployed fleets add modular third-party applications including commercial truck navigation, vehicle health
              intelligence, and driver productivity tools without requiring secondary aftermarket hardware
              installations. Dedicated Regional Account Managers conduct periodic business reviews to mitigate account
              churn, drive application cross-selling, and ensure platform renewal across mid-market accounts. However,
              contract durability faces significant transparency constraints: net revenue retention, gross revenue
              retention, annual logo churn, and contract duration metrics are not publicly disclosed. Customer and
              partner concentration is heavily tied to primary OEM relationships with Daimler Truck North America,
              PACCAR, and Volvo Group, as well as anchor carrier investors. Any friction during fleet management
              transitions or OEM telematics standardizations presents concentration risks that cannot be independently
              audited from external filings.
            claimRefs:
              - CU007
              - CU011
              - CU012
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Undisclosed Unit Economics and Macro Capacity Sensitivity
            body: >-
              Platform Science's flexible commercial billing structure charges fleets only for active units and devices
              on the road. While this structure removes friction during phased implementations, it creates operational
              exposure to freight market downturns where carriers park tractors or scale down active capacity. Without
              public visibility into net revenue retention, gross revenue retention, or contract durations, investors
              cannot independently determine the revenue resilience of its customer base.
            calloutType: risk
            claimRefs:
              - CU001
              - CU011
              - CU015
          - type: callout
            title: Marketplace Cross-Selling Unlocks In-Cab Software Expansion
            body: >-
              By enabling third-party developers such as Trucker Path and major powertrain OEMs like Cummins to deploy
              software natively onto in-cab hardware, Platform Science creates a sticky software distribution
              marketplace. Deployed fleets can expand software capabilities without taking tractors out of service for
              hardware retrofits, enhancing platform durability and increasing customer lifetime value.
            calloutType: strength
            claimRefs:
              - CU003
              - CU007
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risks and Governance Overview
        blocks:
          - type: paragraph
            body: >-
              Evaluating Platform Science's risk posture requires distinguishing between structural platform
              dependencies and operational compliance exposures. The company's primary strategic vulnerability lies in
              partner and channel concentration: by anchoring distribution to tier-one truck OEMs such as Daimler Truck
              North America, PACCAR, and Volvo Group, Platform Science ties its deployment velocity directly to new
              commercial vehicle production cycles and OEM software governance decisions. Simultaneously, the proposed
              acquisition of Trimble's global transportation telematics business units—generating approximately $300
              million in revenue and $200 million in ARR—introduces massive migration and operational execution risk, as
              Platform Science must absorb legacy hardware fleets while maintaining customer retention across hundreds
              of thousands of active commercial trucks. Secondary exposures include stringent regulatory obligations
              under federal Hours of Service rules where carrier fines can reach $19,246 per violation, alongside
              capital intensity and valuation risk following $309 million to $323 million in cumulative equity funding
              without publicly audited standalone financial disclosures.
            claimRefs:
