        - Stable USB/wireless link to Instinct gateway and FMCSA-compliant cab mount
        - Driver application crashes or tablet battery thermal limits under extreme cab temperatures
      - - Cloud Ingestion Layer
        - Microservices (Java, Node.js), message queues, REST/JSON APIs
        - Ingests high-frequency telematics data streams, decodes fault codes, and enforces access
        - Public cloud infrastructure scalability and high-availability ingress gateways
        - Cloud service latency or outage impairs real-time fleet dispatch visibility
