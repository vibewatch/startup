  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market boundary is enterprise connected-vehicle software for commercial fleets: telematics,
              in-cab workflow and compliance applications, app and device administration, vehicle-data access, and the
              integration layer connecting drivers, vehicles, back-office systems, and third-party applications. The
              practical substitute is not only another telematics vendor; it also includes fragmented mobile apps,
              legacy proprietary in-vehicle systems, and fleet-built integrations. Samsung's partner account describes
              fleets becoming constrained by first-generation systems and then confronting fragmented data and user
              experience as mobile tools multiplied. Platform Science positions its platform as the unifying layer,
              while the Trimble transaction explicitly excluded Trimble's Enterprise, Maps, Vusion, and Transporeon
              businesses. Accordingly, generic transportation-management, mapping, freight-procurement, brokerage,
              vehicle manufacturing, and fuel spend sit outside this chapter's core market unless they are delivered
              through the connected-vehicle software layer.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
