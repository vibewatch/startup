            body: >-
              公开证据显示，市场胜负同样取决于商业结构，而不只是化学体系。Tesla 给 Sunwoda 的订单之所以重要，是因为它不是照搬既有龙头模式：Tesla 直接从 Sunwoda
              采购电芯，自行组装模组和电池包；此前与 CATL 的关系则包含更多打包供货。价值由此被推向 OEM，也让外部电芯供应商更像可替换投入，除非它们仍能在服务或性能上做出差异。CnEVPost 明确把 Sunwoda
              的胜出与有竞争力的价格和优质服务挂钩；Tesla 的利润率压力也解释了为什么另一家中国供应商变得有吸引力。BYD 的 FinDreams 展示了相反商业逻辑：它能接受激进外部定价，因为 2026 年 4 月仍有
              58% 产量留在 BYD 自己的整车生态内，而一笔 Tesla 储能订单据称以近成本价拿下。Gasgoo 的电池包和 BMS 排名说明替代威胁真实存在：Tesla、Leapmotor、Changan
