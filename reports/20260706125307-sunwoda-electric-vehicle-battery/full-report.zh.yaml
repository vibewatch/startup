      - number: '1.3'
        title: 融资历史、估值与资本策略
        blocks:
          - type: paragraph
            body: >
              Sunwoda EVB 已通过多轮 IPO 前融资引入大量外部资本。最近一轮在 2026 年 5 月从 13 家投资方融资 CNY 1.68 billion（约 $232 million USD），投前估值
              CNY 25 billion（约 $3.5 billion USD）。这个估值较此前约 CNY 36.4 billion
              明显下降，反映中国动力电池行业整体估值压缩。为在低估值环境中保护既有股东利益，Sunwoda 在完成投资前先将资本公积转增股本。


              2026 年 5 月这轮投资人以国资背景为主，包括 Gongrong Jintou No. 2、ABC Financial Asset Investment
              Co.、来自深圳和四川的地方政府基金，以及产业战略投资人。投资人结构显示，政府对 Sunwoda 在中国战略电池供应链中的位置支持较强。


              公司于 2025 年 7 月向香港主板递交独立 IPO 申请，Goldman Sachs 和 CITIC Securities 担任保荐人。IPO
              目标是募集国际资本、支持海外扩张（泰国和匈牙利工厂）、推进固态电池商业化，并争取比中国 A 股市场可能给出的估值更高。CATL 等同行已在港交所验证了溢价估值。报告日时 IPO 尚未定价。
