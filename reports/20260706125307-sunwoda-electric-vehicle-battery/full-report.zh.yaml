            body: >-
              最重要的公开结论是，规模尚未转化为舒适的 EV 电池经济性。动力电池板块毛利率从 2024 年 8.80% 降至 2025 年 4.86%，而消费电池为 19.42%，储能系统为
              23.34%。这个差距是最清楚的已披露证据，说明集团盈利的传统业务仍在托举 EV 扩张。独立分析进一步强化这一点：Bamboo Works 和 Benzinga
              都称，动力电池板块虽有增长但仍亏损，并指出此前深圳分拆材料显示截至 2023 年仍亏损，当年亏损 RMB 1.56 billion。母公司 2026 年一季度数据同样警示。收入同比增长 31.1%，但净利润下降
              70.5%，扣非利润小幅转负，经营现金流骤降至仅 RMB 72.4 million。质量成本已经实质化：产品质量准备金升至 RMB 1.80 billion，年报还明确称，Sunwoda
              在动力电池和储能合同承诺服务期内承担维修义务。业务能展示增长，但利润率压缩、一季度现金转换偏弱和可见保修拖累，都支持谨慎判断。
