        - 覆盖广泛 OEM 的既有模组和电芯供应商
        - 审阅样本中份额最大、客户多元性最广
        - 即便必须跟价，规模仍给 CATL 带来议价力和学习曲线优势
      - - BYD / FinDreams
        - 据称给了 Tesla「最佳价格」，接近成本线
        - 以内供需求为主，加上选择性外部和储能合同
        - 58% 内供份额意味着 BYD 比纯独立厂商更容易承受激进外部定价
        - 母公司 OEM 帮忙吸收产能利用风险，外部投标可以打得更进攻
      - - Gotion
        - 确切价格未披露
        - 2026 至 2032 年向 Volkswagen 供应标准化统一电芯
        - 标准电芯架构降低大型 OEM 客户的集成摩擦
        - 如果能锁定未来出货量，多年平台定点比现货价格头条更重要
      - - EVE
        - 未见经审阅的公开 EV 价格披露；固态定价未披露
        - 商用和乘用项目，加上早期固态试点线
        - 技术选择权已公开，但当前 EV 固态规模很小
        - 选择权可能有助于未来投标，但还不是近期价格或产量护城河
      - - 内部自建 / OEM 电池包组装
        - 未披露外部转移价格
        - OEM 购买电芯，或内部控制电池包 / BMS
        - 消除部分供应商利润层，并提高对外部电芯供应商的谈判力
        - 随着更多 OEM 内部化电池包层级，外部供应商可能被推向价值更低的仅电芯角色
