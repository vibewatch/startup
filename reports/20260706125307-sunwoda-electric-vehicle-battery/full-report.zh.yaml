  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类、排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              公开记录指向的是五层风险栈，而不是单一的头条问题。第一，质量和法律敞口已经落地， 不再是假设：VREMT 纠纷从宁波法院立案走到 2026 年 2 月和解，直接拖累当期收益，
              还留下开放式的共担更换或测试费用。第二，Sunwoda 仍处在一个行业里，中国监管部门自己 也称该行业存在低于成本的价格战和无序扩产；关键在于，二线电池厂通常靠价格和
              服务守份额，而不是靠压倒性规模。第三，公司同时推进多项资本开支很重的外部动作： 欧洲电池护照合规、获国家援助支持的匈牙利工厂、获 BOI 支持的泰国项目，以及媒体称为 应对行业压力融资安排的香港 IPO
              进程。第四，申报文件仍显示客户集中，合同通常也不是 长期合同，因此拿到订单并不能消除依赖风险。第五，技术野心仍高，5-6C 产品已量产，
              固态电池主张也在验证中；但如果实地表现不及预期，上述进展也会放大质保、可制造性和 资本配置风险。投资含义是：Sunwoda 仍可能获得融资，但前提是投资者持续跟踪风险传导， 而不是只凭出货增长做判断。
