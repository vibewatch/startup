      - number: '8.5'
        title: 最终立场、终止触发点与尽调
        blocks:
          - type: paragraph
            body: >-
              最终立场是以中等置信度跟踪，风险评级高。该判断对价格敏感，而不是看空公司： Sunwoda EVB 在规模、客户和战略重要性上证据足够，值得留在观察名单；但在清晰独立经济性
              或投资者保护方面证据不足，不足以支持按披露价格热情承销。下一步尽调很直接。投资者需要 经审计的独立 EVB 财务报表、投后股权结构和优先权条款、更明确的 IPO 募资用途框架，以及
              客户层面的定价或利润率证据。在此之前，正确的监控姿态是盯住论断失效信号，而不是外推 母公司更宽泛的叙事。再次估值重置、看不到利润率修复、融资压力持续，或 IPO 进程无解释
              停滞，都应迫使投资者下调估值锚。反过来，已经验证的利润率改善，或明显更好的入场价格， 才是重新审视建议的最清晰理由。
