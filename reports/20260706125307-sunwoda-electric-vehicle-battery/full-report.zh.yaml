  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与相邻需求池
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 面对的市场是 EV 动力电池栈：被导入 BEV、PHEV 和 HEV
              车型平台的电芯、模组和电池包。核心视角比“全部电池”更窄，因为它排除了消费电子、多数固定式储能项目收入，以及位于价值链中电芯厂之前的上游采矿或冶炼收入。它也比部分电池包市场估算更窄，后者把更宽的集成范围纳入其中。市场边界很关键：Sunwoda
              卖进的是重资格认证的汽车采购流程，不是所有与电池沾边的需求美元。


              同时，本章不能忽视相邻市场。电池储能已成为增长最快的电力技术，中国电池厂越来越把 ESS 当作产能第二出口，尤其是 LFP 化学体系已经主导中国 EV
              市场。买方的现状替代方案也不只有竞争电芯供应商；燃油车平台、自研电池项目，以及自有或合作型采购安排，都会压缩独立供应商可拿到的角色。
