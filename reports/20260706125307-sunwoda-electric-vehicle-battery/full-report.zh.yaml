      - CV043
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 隐含估值（CNY bn）
      - 相对 25bn 投前估值的回报
      - 概率信号
    rows:
      - - 乐观
        - 份额扩大、毛利率修复至高个位数，香港融资顺利落地
        - 30-38
        - +20% 至 +52%
        - 需要多个有利事件同时发生
      - - 基准
        - 增长延续、份额仍处二线、利润率偏薄，融资到位且没有重大重置
        - 20-28
        - '-20% 至 +12%'
        - 公开证据下最站得住脚的路径
      - - 悲观
        - IPO 延迟、价格再降、营运资本趋紧，把业务推向更低同业倍数
        - 12-18
        - '-52% 至 -28%'
        - 若证据质量不改善，这是最相关的下行情景
    notes: 估值区间来自公开轮次数据、同业市值 / 销售额映射和情景假设的估算，而非完整 DCF 或管理层指引。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 市值 / 估值
      - 收入基准
      - 隐含倍数
      - 参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers Sunwoda EVB, its public parent read-through, and the most useful listed Chinese battery peers with
        accessible July 2026 market-value or valuation data. It is partial because not every global battery company has
        directly comparable business mix or transparent current revenue on a like-for-like basis.
    rows:
      - - Sunwoda EVB 2026 年私募轮
        - CNY 25bn 投前
        - 2025 年 EV 电池收入 RMB 18.908bn
        - ~1.3x 历史销售额
        - 当前入场最直接锚点
        - 私募轮；未公开优先权结构或独立现金流披露
      - - Sunwoda EVB 前轮估值口径
        - 约 CNY 30bn
        - 2024 年 EV 电池收入 RMB 15.1bn
        - ~2.0x 历史销售额
        - 显示到 2026 年出现降级重估
        - 前轮价值来自媒体口径，而非完整 cap-table 申报
      - - CATL
        - $255.40bn 市值
        - $63.65bn TTM 收入
        - ~4.0x
        - 规模和盈利能力的溢价基准
        - 品类龙头，经济性远强于 Sunwoda
      - - BYD
        - $117.64bn 市值
        - $107.28bn TTM 收入
        - ~1.1x
        - 中国电池—汽车一体化基准
        - 汽车一体化和内部需求让该可比偏保守
      - - EVE Energy
        - $19.01bn 市值
        - $9.26bn TTM 收入
        - ~2.1x
        - 最接近的高倍数二线上市同业
        - 产品组合更宽，经济性略好
      - - Gotion High-tech
        - $7.15bn 市值
        - $6.61bn TTM 收入
        - ~1.1x
        - 按简单销售额倍数最接近的二线上市可比
        - 业务组合和 VW 关系不同于 Sunwoda
      - - CALB
        - HK$42.8-43.6bn，约 $5.47bn 市值
        - Yahoo 关键统计显示 0.85x 市销率和 1.83x EV/收入
        - Yahoo 显示 P/S 低于 1x
        - 有用的香港上市二线可比
        - 收入快照和比率来源不是同一数据集
    notes: 倍数是粗略公开市场映射，使用 2026 年 7 月市值快照和引用市场数据页上可得收入基准。它们不是按企业价值标准化的严格同口径可比，只宜作为方向参考。
