            body: >-
              Sunwoda 最强的公开信任叙事，是把质量和合规工业化为产品特性，而不是事后补丁。闪充材料提到五层安全设计体系和 367 项安全设计专利，2025 年里程碑页面称闪充电池取得 GB 38031-2025
              认证。公司还发布了面向欧盟法规的电池护照栈，包含 6 个模块、15 个数据系统和 78 项指标；HKEX 申报称，护照平台使用区块链、IoT 和 AI 做端到端数据管理。制造侧，Sunwoda 关于 CT
              检测的文章是本章最清楚的运营证据之一，因为它点名 4 个已部署生产基地，并声称从产后抽检转向在线预防。即便如此，信任表面仍不完整。公开来源没有披露缺陷逃逸率、良率曲线、证书 ID
              或护照试点的外部审计结果。因此，Geely/Vremt 和解是重要产品证据：它说明 Sunwoda 的质量叙事有实质内容，但仍不足以在尽调中消除现场执行风险。
