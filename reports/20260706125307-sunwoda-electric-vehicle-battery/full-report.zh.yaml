        - from: d3
          to: d1
          label: 新增但价格敏感的需求
        - from: d4
          to: d1
          label: 市场准入条件
        - from: d5
          to: d1
          label: 海外工厂经济性
        - from: d6
          to: d1
          label: 东南亚产能扩张
        - from: d7
          to: d1
          label: 材料与质量连续性
        - from: d8
          to: d1
          label: 融资弹性
        - from: d1
