      - number: '8.4'
        title: 情景分析与 IPO 前景
        blocks:
          - type: paragraph
            body: >-
              情景框架比点估值更重要，因为估值结果高度路径依赖。牛市情景取决于三件事同时发生： Sunwoda 在 CATL 和 BYD 高集中格局下守住或扩大份额，EV 电池利润率从当前低个位数区间
              正常化，香港上市或等效融资在没有再次估值重置的情况下落地。基准情景更克制：增长延续， 份额仍居二线，价格压力只会逐步缓解，市场接受围绕当前估值大致持平到小幅上行的区间。
              熊市情景最容易理解，因此也最该被投资者严肃定价。如果 IPO 延后，如果供应商和营运资本 压力在 60 天付款承诺之后仍然可见，或如果下一轮价格低于当前估值，Sunwoda 很快会滑向
              上市可比公司低倍数区间。CATL 和 EVE 证明 2026 年 IPO 窗口真实存在，但窗口也拥挤且 挑剔。Sunwoda 仍需要靠结果赢得重估，而不是预设重估会发生。
