    layout: standard
    summary: 仅使用公开证据估算悲观、基准、乐观和当前入场估值区间，单位为 CNY 十亿。
    approximationNotes: 这些区间不是 DCF。它们是公开市场与私募轮次映射，用来显示围绕当前 25bn 入场锚的回报不对称。
