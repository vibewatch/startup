              抬高标题数字，但第三方报道也指出，这个数字是峰值而非全流程平均值，且没有点名公开量产应用。与同行比较时，这个细节很关键。BYD、CATL 和 SVOLT 的公开材料显示，行业正向超快充护城河收敛，因此
              Sunwoda 参加的是拥挤技术赛跑，而不是无人竞争的细分市场。固态电池方面，Sunwoda 的 400 Wh/kg 叙事和 0.2 GWh 中试线计划意味着确有进展，但公开规模看起来仍早于 Gotion
