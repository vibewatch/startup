      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险不只是拿到工厂许可。在欧洲，核心问题是 Regulation (EU) 2023/1542 会逐步 提高碳足迹披露、尽职调查、再生材料含量、可追溯性和数字电池护照等要求。Sunwoda 已
              用电池护照、可追溯性和 GBA 试点等公开叙事回应，但其材料仍写的是试点、分阶段接入 数据、2026 年 6 月生命周期验证里程碑，说明执行风险仍未消失。海外制造方面， 匈牙利不只是建设故事；European
              Commission 明确根据国家援助规则批准项目，并称若 没有该方案，投资很可能不会在 EU 落地。泰国也批准了一项大型电芯投资，该批准对增长有利， 但也确认公司依赖东道国政策和本地化执行。法律风险面也不止
              EV 电池诉讼。Sunwoda 的 香港申报文件披露自有和租赁物业存在产权证缺陷；Geely/VREMT 质量纠纷则说明，一起 商业销售合同索赔可以很快升级为法院受理诉讼、利润冲击和下游召回审查。风险可以管理，
              但需要拿出证据，证明合规体系、设施文件和客户质保治理比当前公开记录显示得更强。
