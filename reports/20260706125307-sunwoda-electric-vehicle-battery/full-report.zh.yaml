            body: >-
              Sunwoda 的护城河存在，但脆弱。故事中耐久的一面是，公司有盈利的消费电池底盘、宽产品菜单，以及足够多 OEM
              关系，能够进入严肃采购讨论。这比一个只有单一产品、没有资产负债表缓冲的挑战者更好。但反向证据强于管理层表层叙事。Bamboo Works 称，EV 电池板块在 2025 年初毛利率仍只有 12.9%，且
              2020-2023 年持续亏损，意味着消费业务正在补贴这场竞争。Reuters 另行描述了一个价格战和需求走弱压缩利润率、甚至挤压现金转换周期的行业。2026 年 Q1 产量与装机量之比只有
              19%，这是典型过剩供给信号。同时，既有龙头反应很快：CATL 同时进攻 LFP 快充和钠离子，BYD 把 Blade 2.0 绑定到庞大充电桩铺设，二线同行则在欧洲本地化或绑定大型 OEM
              项目。实际结论是，Sunwoda 目前的差异化来自执行，而非结构。它能拿到定点，但证据尚未显示它拥有能摆脱行业商品化定价重力的护城河。
