      - 公开价格信号
      - 封装 / 合同模式
      - 议价力信号
      - 含义
    rows:
      - - Sunwoda
        - 确切价格未披露；公开说法称定价「高度有竞争力」
        - Tesla 仅电芯定点；OEM 负责下游电池包组装
        - Tesla 寻求更多议价筹码时，Sunwoda 凭价格加高强度服务拿到席位
        - 这是进入客户的有用切入口，但除非服务或性能保持差异化，否则会把 Sunwoda 推向更可替代的电芯供应商角色
      - - CATL
