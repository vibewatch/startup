      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              EV 电池买方结构不是一条简单销售线。OEM
              会在自研、合作、系统集成和外包模式之间选择，选择随产品细分、性能目标和垂直控制偏好而变。高端项目通常能容忍更高成本，以守住续航和性能；大众市场平台则更用力优化可负担性和化学体系实用性。因此，商业买方通常是跨职能团队：采购和供应链团队负责商务谈判，工程和平台团队负责资格认证，制造团队负责爬坡准备。


              Sunwoda
              还要面对更复杂的采购动作，因为汽车不是唯一下游需求池。公用事业级储能开发商、充电站运营商和集成商构成了另一个相邻需求基础；他们更关注循环工况、时长、安全和交付系统经济性，而不是整车品牌定位。横跨汽车和储能，采用路径都要经过资格认证、试点验证、平台或项目定点，再进入重复量产——这拉长销售周期，也奖励规模、信任和既有客户关系。
