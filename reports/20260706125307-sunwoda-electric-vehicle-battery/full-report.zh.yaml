  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 再次估值重置
        - 下一次披露融资低于当前 25bn 投前估值
        - 确认当前轮次不是底部，削弱任何公允价值辩护
        - 下调基准情景，避免追加资本
      - - IPO 融资无进展
        - 到下一融资周期仍无披露时间表、价格区间或重大更新
        - 说明资本市场可选性弱于假设
        - 除非入场条款改善，否则立场从跟踪转为回避
      - - 利润率没有修复
        - 再过一个报告周期，EV 毛利率仍在低个位数附近
        - 说明出货增长没有转化为可用经济性
        - 将该私募估值视为相对风险过满
      - - 供应商付款压力持续
        - 尽管有 60 天承诺，仍出现延迟付款或新的营运资本干预证据
        - 指向持续现金转换压力
        - 要求更强下行保护，否则退出
      - - 新的质量责任冲击
        - 再次出现与 EV 电池相关的重大质保或和解费用
        - 同时打击可信度和现金需求
        - 用更低倍数重新测算业务
    notes: 否决触发项聚焦可从公开申报、市场数据服务或融资披露监控的可观察事件，而不是不可观察的管理层叙事。
    claimRefs:
      - CV007
      - CV008
      - CV018
      - CV029
      - CV041
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - EVB 独立审计财务
        - EV 电池子公司的收入桥、毛利率、EBITDA、capex 和经营现金流
        - 没有独立报表，本轮倍数无法绑定真实盈利能力
        - 管理层 data room 或香港上市申报更新
      - - 轮后 cap table 与优先权
        - 2026 年 5 月轮次的优先权结构、反稀释、清算条款和投资者保护
        - 仅凭表观投前估值无法测算下行
        - 对融资文件做法律尽调
      - - IPO 经济性
        - 计划融资规模、募资用途、基石支持和定价区间
        - IPO 可选性是乐观情景和稀释分析的核心
        - 跟踪 HKEX 申报和投行营销材料
      - - 客户定价与盈利能力
        - 按 EV 平台拆分的客户级 ASP、毛利率、返利和质保条款
        - 只有这样才能知道份额增长是否创造价值
        - 与管理层和客户背调开展商业尽调
      - - 海外工厂利用率与资金
        - 泰国和匈牙利 capex 计划、利用率爬坡和资金分担
        - 海外执行资本密集，会很快吃掉股权价值
        - 项目级尽调和贷款方文件
    notes: 这些问题刻意保持简短且贴近投资。五项都重要，但前三项是在把当前估值视作经尽调支撑，而非只是一个观察值之前所需的最低集合。
    claimRefs:
      - CV011
      - CV028
      - CV031
      - CV040
