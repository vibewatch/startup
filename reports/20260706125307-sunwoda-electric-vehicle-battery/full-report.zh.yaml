      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              需求驱动仍然真实存在。监管压力继续支撑电动化，电池成本下降继续扩大可触达的大众市场，ESS 正成为电池需求的第二引擎。关注中国的分析师也预计，2025-2026 年 EV
              与储能增长都会支撑电池需求，其中公用事业级“能量时移”承担储能需求的大头。即便 2026 年 Q1 全球使用量增速低于上一全年，这些力量仍解释了品类为何继续增长。


              约束不是周期性噪声，而是结构性问题。中国电池行业仍有实质过剩产能，监管层也公开警告不要低于成本销售和无序扩产。这种格局压低利润率，也更偏向资本最厚的玩家。出口经济性同样变得更难。美国关税已经抬高中国产电池进口成本，欧洲电池法规则在
              2026-2027 年增加碳足迹声明、标签、QR 码和电池护照义务。Sunwoda 必须把这些约束看得和原始 TAM 增长同样重要，因为它们直接影响资格认证成本、合规支出和海外扩张可获得的利润率。
