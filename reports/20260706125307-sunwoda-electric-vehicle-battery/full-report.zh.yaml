  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 当前规模信号
      - 客户 / 渠道锚点
      - 差异化
      - 局限
    rows:
      - - Sunwoda
        - 2024 年全球第 10；2026 年快照中中国份额约 2%-3%
        - 已披露为 Li Auto、XPeng、Leapmotor、GAC、SAIC、Renault、Nissan 供应商，近期又获 Volvo / VW 定点
        - 化学体系和形态选择广；服务重投入形成切入口；消费电池现金流支撑
        - 没有规模护城河；仍在二线竞争，暴露于价格驱动的定点
      - - CATL
        - 2026 年快照中中国份额 46%-50%；2026 Q1 三元份额 81.6%
        - 覆盖 Geely、Changan、Xiaomi、Li Auto、Nio 等多元客户
        - 最大规模、宽化学体系覆盖、最强外部渠道多元性，并快速响应 Shenxing / 钠离子
        - 体量引来价格审查；也难免受国内产能过剩影响
      - - BYD / FinDreams
        - 中国份额 17%-21%；2026 年 4 月出货量中 58% 仍由 BYD 内部消化
        - BYD 内部生态，加上 Tesla 储能等选择性外部订单
        - 垂直整合、内部需求、Blade 2.0，以及充电网络铺开
        - 外部份额多元性较低；很大优势来自母公司 OEM 体系
      - - CALB
        - 中国份额约 5%-6%；部分月度榜单排第 3 或第 4
        - 乘用与商用客户混合，包括 GAC-Toyota、Xpeng、Leapmotor 和 SinoTruk
        - 借 15 GWh 葡萄牙工厂推进欧洲本地化
        - 公开产品差异化弱于 CATL 或 BYD；仍是二线卖方
      - - Gotion
        - 中国份额约 4%-6%；面向 VW 的 20 GWh 统一电芯产线
        - Volkswagen 标准电芯合同，加上广泛覆盖中国平台
        - 主张全链条整合，并有面向欧洲的标准电芯叙事
        - 国内装机份额仍远小于 CATL / BYD
      - - EVE Energy
        - 2025 年全球份额 2.6%；4 月口径下中国份额为中个位数百分比
        - 覆盖商用和乘用，包括 Xpeng 以及全球 OEM 关系
        - 固态选择权和更广商用车触达
        - 当前固态产出仍是试点规模，未进入大众市场
      - - SVOLT
        - 2026 Q1 和 1-2 月口径下中国份额 2.5%-2.9%
        - 审阅的快充发布材料未披露客户名称
        - 快充脉冲方法、800V 短刀电池包、半固态路线图
        - 公开渠道证明弱于 Sunwoda、CATL、BYD 或 Gotion
      - - 内部自建 / OEM 内供替代
        - Tesla、Leapmotor、Changan 等在电池包和 BMS 环节占据重要位置
        - OEM 想更紧地控制集成和成本时会采用
        - 剥离外部供应商利润层，并提高对电芯供应商的切换议价力
        - 主要只有工程规模足够的大型 OEM 能做
    notes: 规模信号混合了中国月度份额快照、2024 年全球排名，以及已披露合同或工厂里程碑；各行突出最贴近的竞争视角，而不是穷尽所有相邻赛道。
