  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公共证据下，Sunwoda EVB 只有在严格价格纪律下才可投。业务有真实规模、可见客户名单， 也披露了足够收入，能证明它不是 PPT 子公司。但同一组证据也显示，该板块仍以二线市场
              位置卷入严酷价格战，经济性看起来远弱于上市母公司标题数字。2026 年 5 月轮次的投前估值 为 250 亿元人民币，因此更像战略可选性和未解决执行风险之间的现场谈判，而不是便宜入口。
              简单按历史销售额看，该轮约为 2025 年 EV 电池收入的 1.3x， 相对中国上市可比公司并不荒唐；但对于一个规模更小、透明度更低且大概率亏损的资产， 该价格也谈不上明显便宜。上述组合支持跟踪 /
              继续研究，而不是直接买入。投资者应等到 披露更充分、条款更好，或利润率修复可见之后，再把当前估值标记视为有吸引力。
