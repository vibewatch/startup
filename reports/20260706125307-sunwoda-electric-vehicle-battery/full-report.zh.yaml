  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: Sunwoda 的剩余风险按公开证据显示的发生可能性和影响定位，而不是按出货增长表象定位。
    approximationNotes: 单元格是基于公开申报、官方文件和反向报道的定性位置；未获得私人风险登记册。
    data:
      columns:
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 供应商现金周转紧张与价格战压力
            - 客户集中且合同非长期
            - 质量争议重演或质保升级
        - label: 中高可能性
          values:
            - 电池护照执行延误
            - 泰国或匈牙利海外爬坡延误
            - 毛利率挤压叠加融资依赖
        - label: 中等可能性
          values:
            - 产权 / 设施文件摩擦
            - Tesla 定点主要被用作压价筹码
            - 固态商业化延误
        - label: 低中可能性
          values:
            - 贸易政策冲击出口项目
            - 从试点到量产的数字合规缺口
            - 大额国家补贴或政策假设逆转
    claimRefs:
      - CR004
      - CR011
      - CR014
      - CR017
      - CR023
      - CR028
      - CR037
      - CR042
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 法律、定价、合规和执行冲击如何传导至毛利率、客户信任、融资弹性和投资逻辑。
    approximationNotes: 边只表示定性传导方向；公开数据无法给出量化因果模型。
    data:
      nodes:
        - id: n1
          label: 质量争议 / 召回事件
        - id: n2
          label: 客户信任受损
        - id: n3
          label: 销量或定价让步
        - id: n4
          label: 毛利率压缩
        - id: n5
          label: 融资依赖
        - id: n6
          label: 海外爬坡 / 合规支出
        - id: n7
          label: 估值下行 / 投资逻辑破裂
      edges:
        - from: n1
          to: n2
          label: 声誉与质保负担
        - from: n2
          to: n3
          label: 份额流失或条款变硬
        - from: n3
          to: n4
          label: 价格 / 利用率下降
        - from: n6
          to: n4
          label: 固定成本吸收压力上升
        - from: n4
          to: n5
          label: 内部资金变弱
        - from: n5
          to: n7
          label: IPO / 资本敏感度
        - from: n6
          to: n7
          label: 增长情景滑坡
        - from: n1
          to: n7
          label: 若反复发生，直接伤害投资逻辑
    claimRefs:
      - CR010
      - CR014
      - CR023
      - CR032
      - CR037
      - CR039
      - CR042
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Sunwoda 获取市场、守住工厂经济性和需求耐久度，依赖的关键交易对手与系统。
    approximationNotes: 该图突出战略依赖，而不是合同层级；未公开的合同条款不可得。
    data:
      nodes:
        - id: d1
