      - number: '7.4'
        title: 财务、市场、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              财务和依赖风险是各项风险开始相互放大的地方。公开申报文件显示，Sunwoda 即使有所改善， 客户集中度仍然不低；公司也明确提醒，客户合同通常不是长期合同。也就是说，Tesla 出口供货
              此类新订单可以分散客户名单，但不能消除采购重新定价或订单量重新分配的敞口。行业层面， 负面信号持续存在：中国监管部门就低于成本竞争约谈包括 Sunwoda 在内的头部电池企业， CRU
              描述结构性产能过剩，Reuters 报道供应商现金流压力严重到触发 60 天付款承诺， S&P 则强调中国背景电池出口仍暴露在波动的美国贸易动作下。在上述背景下，Sunwoda 自身 2025
              年报指标显示杠杆上升、流动性转弱、扣非后利润为负、利息覆盖极低。外部报道随后 认为 EV 电池业务本身仍在亏损，或至少利润率远低于消费电池板块，也让计划中的香港 IPO
              不只是一个简单的增长选项。从传导链看，价格战压缩利润率，弱利润率抬高融资依赖，融资 依赖又提高公司对 IPO 时点和国家支持的敏感度；任何新的质量事件都会让客户和资本提供方 同时变得更谨慎。
