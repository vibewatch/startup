  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、结构与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 的公开财务图景仍必须透过上市母公司读取，但已披露结构足以确认收入引擎。动力电池业务 2025 年收入 RMB 18.91 billion，高于 2024 年 RMB 15.14
              billion，板块在母公司收入中的占比从 27.0% 升至 29.9%，成为集团增长最快的大型业务线。管理层还披露，2025 年电池出货量为 42.72
              GWh，包含储能电芯；这至少给收入桥接提供了粗略分母，即便还不足以做精确 ASP 分析。收入确认采用常规硬件会计：国内收入在客户验收时确认，出口通常按 VMI 提货模式确认。缺失的是价格透明度。Sunwoda
              既不披露标价，也不披露已实现 OEM 合同价格；公司也没有把海外 EV 电池收入从集团更宽的海外销售中拆出，而后者仍高度偏向消费电池。因此，投资人能看到增长和结构扩张，却看不到 EV
              收入质量是在改善，还是靠更低实际价格换量。
