  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与对手类别
        blocks:
          - type: paragraph
            body: >-
              竞争集合不是一张平铺的电池厂名单，而是分层结构：顶部是强势双寡头，其下是拥挤的二线梯队，另一条替代路径则是大型 OEM 把更多电池包和控制功能内化。从 2026 年 1 月、Q1 和 4 月快照看，CATL
              在中国电池市场约占 46% 到 50%，BYD 约占 17% 到 21%，Sunwoda 则按月份和统计口径不同维持在约 2% 到 3%。Bamboo Works 对结果说得很直白：CATL 和 BYD
              拿走大部分市场，像 Sunwoda、CALB、Gotion、EVE、SVOLT 这样的二线玩家只能争夺更小的剩余份额。Sunwoda 自己的申报文件也从另一个角度支持同一判断：即便已经成为全球销量前十的 NEV
              制造商中 8 家的供应商，2024 年它在全球也只排第十。这意味着 Sunwoda 最直接的战场不是直接取代
              CATL，而是在客户适配、执行和资本纪律上跑赢二线，同时活过一个技术差距收窄、买方越来越习惯多供应商并行的市场。
