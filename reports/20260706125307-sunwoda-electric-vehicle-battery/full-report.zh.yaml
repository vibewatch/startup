      - number: '1.2'
        title: 管理层、创始人与关键人员
        blocks:
          - type: paragraph
            body: >
              Sunwoda 集团由王氏家族控制。王明旺和王威于 1997 年在深圳共同创办 Sunwoda Electronic。王明旺在 2011-2016 年担任母公司 CEO，之后转向动力电池子公司并担任董事长。王威于
              2016 年 10 月接任 Sunwoda Electronic CEO 和董事长，并持续任职，持有母公司约 7.2% 股份。


              EVB 子公司的管理团队包括多名有电池行业经验的高管。母公司董事会设有具备审计、提名和薪酬专长的独立董事，管理层平均任期约 9 年，董事会成员平均任期约 6
              年。关键人依赖度中等——王氏兄弟提供战略方向和行业关系，但随着公司规模扩大，运营管理团队已经明显加厚。


              Rong Bo Liu 担任高级治理职务。Jie Liu 任财务总监 / CFO，Di Ceng 任公司秘书。稳定的高管团队和家族控制型治理结构符合成功中国民营企业的常见模式，但也带来继任和控制权集中风险。
