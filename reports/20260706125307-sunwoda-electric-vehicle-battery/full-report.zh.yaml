            body: >-
              运营架构围绕分层电池栈搭建，而不是纯材料玩法。公开申报和产品页面显示，Sunwoda 把多材料电芯开发与模组、BMS、PACK 集成结合起来；更早的快充发布还给出了公司对架构的理解：低钴或 LFP
              化学体系选择、多孔电极设计、CT 检测和 3D 液冷，都被用作平衡功率、密度和安全的杠杆。2026
              年技术日披露把这套架构拓宽为组合：包括面向成本敏感或固定式场景的钠离子电芯、面向下一代密度的固态项目，以及加入船舶专用 BMS、液冷和控制策略的船舶系统。依赖关系在这里很关键。固态进展绑定 XTC
              等外部材料伙伴，以及新宣布的松山湖公共研发平台；船舶和 ESS 供给则依赖系统级适配，而不只是化学体系标题。结果是一套确有宽度的产品架构，但也依赖材料、系统软件、制造和客户集成多线执行。
