        blocks:
          - type: paragraph
            body: >-
              Sunwoda 的 EV 电池客户基础应被看作三类重叠客户，而不是一面同质化标志墙。第一，公司拥有可见的中国新能源车 OEM 和新势力名单。香港上市文件点名 Li
              Auto、XPeng、Leapmotor、GAC、SAIC、Renault 和 Nissan，并称 Sunwoda 供货全球 2024 年销量前十的新能源车制造商中的 8 家。第二，公开记录显示，在纯 BEV
              业务之上，还有混动和增程细分楔子：管理层材料和媒体摘要反复把 HEV 与 EREV 电池表述为核心切入点，混动装机超过 1.5 million 台，并披露海外 HEV 批量交付，尽管具体外国 OEM
              名称仍未公开。第三，2025-2026 年最新证据来自新增或扩大的账户入口：Nio Firefly、Tesla 上海出口供应链，以及 Xiaomi 规划中的 EREV 平台。这个组合意味着买方通常是 OEM
              采购和电池工程团队，使用者是车型平台组织，付款方是车企而非终端驾驶者。同一申报文件还称，Sunwoda 以客户为中心做本地化产能规划，拥有 25 个主要生产基地和 11
              个海外营销及服务中心来支持这些账户；这很重要，因为许多订单看起来是从二供或特定项目位置起步，而不是排他性单一来源授权。
