              Sunwoda 比单纯低端补位者更可信，因为公开产品覆盖面广，OEM 名单也真实。申报文件称，公司支持三元和 LFP 化学体系、三种电芯形态，以及从 BEV 到混动的所有主要乘用 EV 架构。公司还披露了 8C
