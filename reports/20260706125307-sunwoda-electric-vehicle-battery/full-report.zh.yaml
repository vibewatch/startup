        - 真实 OEM 敞口，且在中国和全球都有足够体量值得关注
        - 仍是二线供应商，远落后于 CATL 和 BYD
        - 持续份额提升或客户突破，把 Sunwoda 带出低个位数份额区间
      - - 单位经济性
        - 规模最终可抬升利用率和议价权
        - 2025 年 EV 毛利率只有 4.86%，独立报道仍提示经济性偏弱或亏损
        - EVB 独立毛利率进入可持续更高区间的证据
      - - 母公司支持
        - 消费电池提供经营压舱石，提升存活能力
        - 交叉补贴可能掩盖 EV 真实回报，并推迟纪律约束
        - EVB 独立审计报表显示，不靠母公司缓冲也有可接受经济性
      - - 融资路径
        - 香港上市加近期私募资本，显示仍能拿到钱
        - 2026 年轮次重置估值，IPO 条款仍未披露
        - 公开申报融资规模、募资用途和基石支持，且不再重置估值
      - - 退出路径
        - 电池 IPO 窗口仍开，战略买家理解该行业
        - 窗口拥挤且挑剔，可能只奖励经济性更强的公司
        - 可营销的 IPO 区间或战略条款清单，验证更高倍数
    notes: 反论点不是泛泛怀疑，而是一组具体公开证据缺口，使当前披露估值下无法给出买入判断。
    claimRefs:
