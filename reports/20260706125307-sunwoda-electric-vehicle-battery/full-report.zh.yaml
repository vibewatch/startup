      - number: '7.5'
        title: 缓释措施、监控项与论断失效触发点
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 确实有真实缓释措施，但公开记录只能支撑有条件的安心感。积极的一面是，公司已 投入电池护照工具、GBA 试点工作、本地化制造扩张，以及围绕生命周期、生态、责任和伙伴
              关系搭建的可持续框架。公司也持续拿到新的 OEM 切入口，说明 Geely 纠纷之后市场并未 对它关闭。但留存证据还没有证明投资者在把缓释措施视为成熟前想看到的四件事：第一， VREMT
              和召回型质量敞口在和解公告之外已经经审计闭环；第二，有具名客户证明电池护照栈 已经规模化通过客户验收，而不只是试点；第三，招股书层面对 IPO 时间、融资规模，以及资本市场
              转弱时备用融资方案给出清晰说明；第四，从出货增长通向可持续 EV 电池盈利之间有硬运营 桥梁。因此，正确姿态是把缓释视为正在改善但尚未验证。论断失效触发点也应基于事件且可
              衡量：再发生重大客户质量纠纷、海外爬坡出现实质性延误、面向欧洲项目的护照验证失败， 或在行业价格战仍然尖锐时出现迫使 Sunwoda 为扩张融资的资金压力。
