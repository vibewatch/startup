      - number: '4.5'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 提供的公开证据足以支持谨慎财务结论，但不足以干净承销动力电池业务。已知事实方向清楚：EV 收入真实且增长，板块具有战略重要性，资本开支沉重，流动性收紧，集团不断回到外部资本市场，而独立分析师仍称
              EV 电池亏损。公开材料中未知的部分同样重要。上市文件没有量化当前 EV 板块亏损，公开申报没有披露月度烧钱或跑道，也没有公开视角能看到已实现 EV
              ASP、平台重新定价、客户层面收入集中度，或泰国和匈牙利的资金分担。即使 RMB 1.803 billion 质量准备金，也无法在公开资料中与 Geely
              纠纷对账。因此，承销结论是混合的：收入动能存在，但利润质量弱、资本强度高、披露太薄，不能把业务视为能自我造血。任何投资人都应把香港 IPO 和 2026 年 5
              月融资视作必要融资步骤，而不是动力电池板块已跨入耐久独立盈利的证明。
