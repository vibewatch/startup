  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从规模证明、薄弱经济性、资本渠道和同业估值映射，推导最终观察 / 继续研究建议。
    data:
      nodes:
        - id: scale
          label: 真实规模：42.72 GWh 和 RMB 18.9bn EV 收入
          type: input
        - id: position
          label: 仍是二线：全球份额 2.5%
          type: input
        - id: economics
          label: 经济性薄：2025 EV 毛利率 4.86%
          type: input
        - id: capital
          label: 有资本渠道，但条款仍不完整
          type: input
        - id: comps
          label: 本轮约 1.3x 销售额，接近上市二线梯队区间
          type: process
        - id: risk
          label: 价格战和营运资本压力仍在
          type: process
        - id: decision
          label: 建议：观察 / 继续研究
          type: output
      edges:
        - to: comps
          label: 支撑
          from: scale
        - to: comps
          label: 限制溢价
          from: position
        - to: decision
          label: 约束
          from: economics
        - to: decision
          label: 保留可选性
          from: capital
        - to: decision
          label: 锚定价格纪律
          from: comps
        - to: decision
          label: 抬高门槛
          from: risk
    approximationNotes: 仅为关系图，不是评分模型。标签把更复杂的投资研判简化为公开来源可见的主要证据路径。
