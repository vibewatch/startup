        title: 留存、重复使用与采购耐久性
        blocks:
          - type: paragraph
            body: >-
              公开留存证据明显少于公开获客证据。Sunwoda 招股书不披露 NRR、GRR、客户留存、续约率或 OEM
              层面保修表现指标，并明确称客户合同通常不是长期合同。因此，耐久性只能从较弱代理变量推断。正向代理变量存在：公司持续出现在相邻客户场景里，从较早的 XPeng 和 Li Auto 证据点，到 2025 年
              Firefly、2026 年 Tesla 和 Xiaomi 公告；其本地化制造和海外服务中心足迹也说明，公司试图贴近 OEM
              工程和采购团队来降低切换摩擦。即便如此，这些仍是代理变量，不是经审计留存统计。最强的负向代理变量是声誉：Geely 纠纷公开后，据称 Li Auto 买家即便获得额外保修也抵触搭载 Sunwoda 电池的 i6
              车型。这种反应说明，在供应商真正丢掉合同之前，感知质量就可能影响采购和购买转化。正确尽调姿态是区分真实重复项目连续性和在多供应商名单中的简单存活。Sunwoda
              能指向重复进入账户和平台存在，但公开材料仍未证明这些位置会扩展为耐久的多平台份额，还是只停留在战术性二供配额。
