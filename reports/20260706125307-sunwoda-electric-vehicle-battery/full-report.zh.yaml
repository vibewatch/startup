      - CV004
      - CV016
      - CV023
      - CV029
      - CV032
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 相对于当前 25bn 估值标记，在公开估值驱动因素中选取杠杆最高项，估算 CNY 十亿级方向性变化。
    approximationNotes: 敏感性数值是基于同业倍数映射和情景假设的分析师方向性估计，并非管理层指引。
    data:
      items:
        - label: 香港上市成功，募资用途清晰
          value: 4
        - label: EV 毛利率修复约 300 bps
          value: 5
        - label: 中国和全球份额小幅提升
          value: 3
        - label: IPO 延后且融资清晰度不足
          value: -5
        - label: 价格战迫使估值再次重置
          value: -6
        - label: 出现新的质量或质保费用
          value: -4
