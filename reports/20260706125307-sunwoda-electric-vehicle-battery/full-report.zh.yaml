              按装机量计，公司约占中国 EV 电池市场 3.2%（2025 全年），占全球市场 2.5%（2026 年 Q1）。公司供货全球前十大 NEV 制造商中的 8 家。关键里程碑包括：2026 年进入 Tesla
              供应链，2025 年拿下 NIO Firefly 电池合同，2026 年 2 月以 CNY 608 million 和解 Geely/VREMT 质量诉讼，以及 2025 年 10 月发布 400 Wh/kg
              固态电池。


              海外扩张已加速：泰国电池工厂投入 $1.5 billion（一期 2025 年投产，二期规划 17.4 GWh），匈牙利工厂投入 $1.7 billion（首个欧洲工厂，2025 年底投产）。公司海外收入在
              2024 年已占总收益 40.5%。
