      - number: '7.3'
        title: 运营、质量与技术风险
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 的运营风险耦合度异常高，因为制造质量、合规数据质量和产品路线图野心必须 同时过关。最具体的运营警讯是 Geely/VREMT 事件：指控覆盖 2021 至 2023 年供应的
              电芯，严重到形成数十亿元人民币索赔，最后以大额和解加共担未来更换成本收场。公开报道 随后把问题与电池健康计划、更换活动，甚至 Volvo EX30 召回报道联系起来，说明一个现场
              问题可以从单一客户谈判扩散成更广泛的信任和安全讨论。与此同时，Sunwoda 一边爬坡海外 工厂和数字护照栈，一边宣传 5-6C 快充产品、大尺寸 ESS 电芯和固态产品；上述产品的
              设计或工艺验证已经完成，但在留存记录中，规模化现场表现仍缺少独立证明。上述组合会 带来几种实际失效模式：工厂投产期良率漂移、快充性能在使用中衰减引发质保索赔、上游
              数据不完整导致合规滑坡、技术商业化跑在质量控制能力前面造成管理分心。运营层面， Sunwoda 确实有可见缓释措施，例如可追溯性工具和质量叙事，但公开证据仍更能证明已宣布 的能力，而不是经审计的闭环指标。
