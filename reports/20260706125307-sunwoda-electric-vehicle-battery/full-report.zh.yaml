  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流看产品表面
        blocks:
          - type: paragraph
            body: >-
              从公开产品面看，Sunwoda 不像在卖单一电池 SKU 目录，更像在交付一套 OEM 工作流。公司称覆盖电芯、模组、BMS 和 PACK 系统；解决方案页面也展示电芯、模组、PACK、BMS
              和固定式储能测试能力。落到实践里，车辆或船舶客户可以从化学体系和工况匹配开始，进入系统集成，按性能和安全要求验证电池包，再把关系延伸到生命周期追溯。可见产品地图覆盖乘用 EV
              快充电池、混动电池、储能电芯、船舶系统和轻型电动出行电池，因此工作流会随场景变化，但系统逻辑相似：Sunwoda 试图从电芯设计到电池包交付和质量证明拿住整条路径。历史发布材料也显示出清晰的充电速度路线图：从
              SFC480，到闪充 1.0 Plus、6C Flash Charging Battery 3.0，再到 2026 年 Xingchi 2.0 发布。公开证据较薄的是最新 15C
              平台的具名量产车型部署，因此运营叙事强于公开披露的 SOP 清单。
