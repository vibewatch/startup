        title: 资本强度、流动性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Sunwoda 的资产负债表说明，即便不考虑进一步海外建厂，动力电池策略也仍然吃融资。2025 年底，集团固定资产 RMB 23.61 billion，在建工程 RMB 10.56 billion，存货 RMB
              10.76 billion。2025 年投资现金流出达到 RMB 9.33 billion，取得借款合计 RMB 29.66 billion，偿还债务仍消耗 RMB 19.58
              billion。账面现金及现金等价物 RMB 10.47 billion 看起来不少，但拆开受限部分后并不宽松：货币资金合计 RMB 21.75 billion，其中约 RMB 10.98 billion
              被保证金和类似受限余额占用。债务仍然可观，包括短期借款 RMB 14.74 billion、一年内到期的长期债务 RMB 5.60 billion，以及长期借款 RMB 9.02
              billion。招股书明确指出短期流动性恶化：流动比率从 2023 年底的 1.3 降至 2024 年底的 1.1，主因是现金减少 RMB 4.20 billion，同时设施和研发资本开支增加。2026 年 5
              月 RMB 1.68 billion 融资、持续推进的香港 IPO，以及额外 RMB 5.0 billion 项目融资担保，更像是维持工厂扩张运转的桥，而不是 EV 运营可以自我造血的信号。
