      - number: '8.3'
        title: 可比公司比较与倍数传导
        blocks:
          - type: paragraph
            body: >-
              公开可比公司不支持把当前私人估值标记视为显然便宜。CATL 仍享有接近 4x 销售额的溢价 倍数，因为它把规模领导力、盈利能力和资本市场深度放在一起。EVE 的销售倍数约 2x，BYD 和 Gotion 则更接近
              1.1x；按 Yahoo 和 MarketCapOf 口径推读，CALB 更便宜。因此， Sunwoda EVB 约 1.3x 历史销售额落在一个尴尬的中间地带：高于几家上市二线同行，低于
              更强的溢价公司，而且独立披露远少于上述公司。价格并非因此不理性：该板块有重要 OEM 关系、正在扩大的海外足迹，母公司也有更强的消费电池业务。但投资者
              正在支付接近上市二线公司的价格，却拿不到上市二线公司的透明度。正确结论不是 Sunwoda 必须按同行底部交易，而是当前定价已经假设该业务应获得比 CALB 或 Gotion 更好的待遇。
              该假设需要比现有公开证据更多的证明。
