      - number: '4.4'
        title: 工厂承诺与不利财务证据
        blocks:
          - type: paragraph
            body: >-
              海外扩张在战略上有逻辑，但财务负担很重。公开来源指向泰国春武里 50-billion-baht、两座工厂项目，以及匈牙利 HUF 580 billion 项目，其中仅一期就为 HUF 93
              billion。HKEX 招股书确认了更宽的足迹：截至 2025 年 9 月，Sunwoda 已有 25 个运营或在建生产基地，其中 6
              个在海外。这个足迹有助于客户本地化，但也放大投产、营运资本和质量控制风险。Geely/Vremt 纠纷是最清楚的反向证据。Reuters 和其他媒体报道，2026 年 2 月和解预计会减少 2025 年净利润
              RMB 500 million 至 RMB 800 million；此前 Vremt 因所谓缺陷电芯索赔 RMB 2.31 billion。和解还要求 Sunwoda
              分担受影响电池包的更换成本。叠加扩大的保修准备，这个案件说明财务压力不是纯理论：产品质量问题可以直接进入利润表和现金需求。再加上 Reuters 2026 年 1
              月报道中国工信部警告电池厂价格战和过剩产能，资本开支计划同时暴露在外部价格压力和内部执行风险之下。
