      - number: '6.4'
        title: 扩张、集中度与不利客户信号
        blocks:
          - type: paragraph
            body: >-
              最大客户风险结论是，Sunwoda 同时展示了宽度和集中度。宽度体现在招股书客户名单，以及 2025-2026 年围绕 Nio、Tesla、Xiaomi、Li Auto、XPeng 和传统 OEM
              渠道的新证据。集中度体现在申报文件财务披露：前五大客户收入占比 2022 年 58.1%、2023 年 47.7%、2024 年 44.3%、9M25 为 37.4%；最大单一客户在 9M25 仍占
              15.4%，2022 年曾为 28.6%。披露口径是集团层面，不是 EV 板块专项口径，因此精确电池业务结构仍是尽调缺口。独立评论让风险更尖锐，称 2024 年 EV 电池出货约 40% 流向 Li
              Auto，尽管该数字未获招股书确认。反向证据更强。Geely 旗下 Vremt 因 2021-2023 年供应的电芯起诉 Sunwoda，Zeekr 001 用户报告充电和电池健康问题，最终和解给 2025
              年利润造成大额冲击，并要求分担未来更换成本。另一篇关于 Li Auto 客户抵触的报道显示，一起公开质量事件会越过直接诉讼客户向外传导。因此，Sunwoda
              的扩张故事可信，但投资人应把集中度和现场质量执行视为仍在发生的客户耐久性风险，而不是回头看的脚注。
