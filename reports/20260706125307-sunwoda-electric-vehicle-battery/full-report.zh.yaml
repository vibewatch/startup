    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与公司治理
        blocks:
          - type: paragraph
            body: >
              Sunwoda Electric Vehicle Battery Co., Ltd.（也称 Sunwoda EVB 或 Sunwoda Mobility Energy
              Technology）是一家总部位于中国广东深圳的未上市动力电池制造商。公司作为 Sunwoda Electronic Co., Ltd. (SZSE: 300207)
              旗下独立资本化子公司运营；后者在深圳证券交易所上市。Sunwoda Electronic 由王明旺和王威兄弟于 1997 年创立，起初生产消费电子电池。动力电池子公司约在 2014-2015
              年正式成立，抓住中国新能源车市场快速增长的窗口。


              截至 2026 年中，经过多轮外部融资、最近一次为 2026 年 5 月注资，母公司在 Sunwoda EVB 的持股已从最初约 40% 稀释至约
              27%。子公司拥有自己的投资人基础、治理架构和资本市场策略——正推进独立香港 IPO（H 股上市），与母公司深圳上市平台分开。王明旺担任 EVB 子公司董事会董事长，王威仍任母公司 Sunwoda
              Electronic 董事长兼 CEO。


              公司生产面向电动车和储能系统的锂离子电芯、模组和电池包。制造基地分布在中国（深圳、惠州、南京、四川眉山）、泰国（春武里）和匈牙利（尼赖吉哈佐），同时服务国内与国际供应链。
