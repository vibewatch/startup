      - number: '2.2'
        title: 规模口径：全球价值、中国销量与可观察份额
        blocks:
          - type: paragraph
            body: >-
              公开市场规模测算都指向一个大品类，但没有收敛到单一数字。面向 2026 年，开放摘要显示全球 EV 电池市场大致落在 $86.5 billion 到 $107.6 billion
              的中低区间；如果采用更宽的电池包口径，数字会高得多。正确结论不是机械取平均，而是保留区间，并判断哪一种定义最匹配 Sunwoda 可销售市场。本章里，中国装机量和全球使用量数据比任何单一 TAM
              标题数字更有运营意义。


              中国仍是最重要的可服务需求池。2025 年中国 EV 电池装机量达到 769.7 GWh，同比增长 40.4%，市场结构由 LFP 压倒性主导。全球 EV 电池使用量在 2026 年 Q1 达到 244.6
              GWh，中国供应商仍控制全球约 71% 到 72% 份额。Sunwoda 已在这组公司中可见——2026 年 1-4 月以 8.7 GWh、2.5% 份额位列全球第十——但相较 CATL 和 BYD，它的可观察
              SOM 仍然很小。
