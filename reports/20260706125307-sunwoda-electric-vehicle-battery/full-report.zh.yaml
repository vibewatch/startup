      - number: '8.2'
        title: 当前估值背景与融资信号
        blocks:
          - type: paragraph
            body: >-
              融资信号并非纯正面，而是喜忧参半。一方面，Sunwoda EVB 在 2026 年 5 月仍吸引到新资金， 并继续与 Goldman Sachs 和 CITIC Securities
              推进香港上市，确认外部资本仍看见该业务的 战略价值。另一方面，披露的轮次伴随关于估值下降的明确表述，也配有保护早期投资者的资本 公积转增安排。该安排很关键，因为业务正在同时消化重资产地域扩张，却仍只发布有限的独立
              EV 电池财务细节。招股书也说明，为什么流动性必须进入估值：随着资本开支加速，流动比率 从 1.3 降至 1.1；2025 年报还显示一笔大额质量保证负债，已经影响资产负债表解读。
              换句话说，该轮融资证明公司仍能获得资本，但并不能证明 EVB 可以自我融资，也不能证明 下行保护很轻。IPO 路径可能有帮助，但市场仍缺少交易规模、时间表、基石需求和投后优先权 的公开条款。
