      - number: '2.5'
        title: 规模与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              两个缺口让本章无法给出干净的单点 SAM 或 SOM。第一，公开市场研究机构口径不一致：有的报 EV
              电池收入，有的报电池包收入，有的把更广泛生态活动打包进去。这解释了公开估算为何分化很大。第二，开放来源对中国已实现 GWh 装机量和化学体系份额较强，但对可直接引用的 2026
              年中国市场收入，以及能绑定到同一定义的前瞻装机预测较弱。


              公司层面的缺口同样重要。公开数据给出了 Sunwoda 的全球排名和份额快照，但无法按细分、地区、化学体系或买方类型清晰拆出公司的可寻址份额。因此，尽调应优先核查 OEM
              项目组合、储能客户管线、资格认证胜率，以及关税和电池护照合规对合同层面毛利率的影响。在这些数据可得之前，本章应被视为有区间约束的市场地图，而不是精确的自上而下收入模型。
