  rows:
  - - EV battery products
    - Cells, modules, and packs sold to automakers through direct sales contracts
    - RMB revenue
    - RMB 18.91B in FY2025; 29.9% of group revenue
    - High for total revenue; low for mix within EV battery line
    - Obtain BEV/PHEV/low-voltage/storage split and revenue by customer/platform
  - - Consumer batteries
    - Legacy handset, notebook, and consumer-device batteries sold at scale
    - RMB revenue
    - RMB 31.41B in FY2025; still largest cash engine
    - High for disclosed total; indirect support to EV segment
    - Measure how much consumer gross profit is reallocated to EV R&D and capex
  - - Energy storage systems
    - Cells and system products sold into ESS channels
    - RMB revenue
    - RMB 2.31B in FY2025; gross margin above EV batteries
    - High for total, low for intra-segment mix
    - Request storage revenue split between utility, C&I, and home storage
  - - Other businesses
    - Residual group businesses outside the three disclosed battery buckets
    - RMB revenue
    - RMB 10.62B in FY2025; composition opaque
    - Medium — disclosed only as residual category
    - Request component-level bridge so investors can isolate pure battery economics
  - - Overseas direct sales
    - Geographic channel rather than standalone product stream
    - RMB revenue
    - RMB 24.44B in FY2025, but company says mix is mainly consumer batteries
    - Medium — group-level only, EV share undisclosed
    - Break out overseas EV revenue by region and customer to test localization thesis
  notes: Public sources disclose product-line totals, not EV battery sub-mix or customer revenue. Overseas sales are reported at group level and remain heavily influenced by consumer batteries.
