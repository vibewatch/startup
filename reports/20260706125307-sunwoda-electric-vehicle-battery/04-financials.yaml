- id: TI002
  title: Pricing / monetization table
  columns:
  - Pricing item
  - Price / unit / contract model
  - List vs realized pricing
  - Discounts or unknowns
  - Source basis
  rows:
  - - EV battery cells / packs
    - Direct OEM supply contracts; likely negotiated per platform or pack architecture
    - No public list price; realized ASP undisclosed
    - Unknown repricing clauses and rebate structure
    - Annual report, prospectus, and disclosure-gap review
  - - Export EV battery sales
    - Generally recognized through VMI withdrawal for export customers
    - No public list price; recognized on inventory withdrawal or control transfer
    - Unknown whether overseas contracts price in localization or freight offsets
    - 2025 annual report revenue-recognition note
  - - Consumer batteries
    - High-volume OEM supply contracts for handset, notebook, and device makers
    - No public list price; company discloses only segment totals
    - Unknown realized pricing and customer rebates
    - 2025 annual report and quarterlies
  - - Warranty economics on power batteries
    - Contracts include repair obligations during promised service periods
    - Not a price line; a monetization offset to gross profit
    - Unknown cost pass-through or reserve methodology by OEM
    - 2025 annual report warranty note and reserve table
  - - IPO / external capital
    - Hong Kong IPO plus private rounds support plant buildout rather than operating revenue
    - Capital, not customer pricing
    - Amount and timing still partially open on IPO side
    - HKEX prospectus and May 2026 financing coverage
  notes: Sunwoda does not publish list pricing or realized EV ASPs. The only hard public monetization mechanics are direct sales, VMI export recognition, and the existence of warranty obligations that can erode realized gross profit.
