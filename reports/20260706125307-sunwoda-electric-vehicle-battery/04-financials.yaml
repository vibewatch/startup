- id: factory-commitments-and-risk
  title: Factory commitments and adverse financial evidence
  body: |-
    The overseas expansion story is strategically logical but financially heavy. Public sources point to a 50-billion-baht, two-factory Thailand project in Chonburi and a HUF 580 billion Hungary project whose first phase alone is HUF 93 billion. The HKEX prospectus confirms the broader footprint: as of September 2025 Sunwoda already had 25 production bases in operation or under construction, including six overseas. That footprint helps customer localization, but it also multiplies commissioning, working-capital, and quality-control risk. The Geely/Vremt dispute is the clearest adverse proof point. Reuters and other outlets report that the February 2026 settlement is expected to cut 2025 net profit by RMB 500 million to RMB 800 million after Vremt sought RMB 2.31 billion in damages over alleged defective cells. The settlement also requires Sunwoda to share replacement costs for affected battery packs. Combined with the expanded warranty provision, the case shows that financial pressure is not purely theoretical: product-quality issues can travel directly into earnings and cash needs. Add Reuters' January 2026 report that China's industry ministry was warning battery makers about price wars and overcapacity, and the capex program starts to look exposed to both external price pressure and internal execution risk.
