  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized EV battery ASPs, pack-versus-cell mix, and customer repricing clauses by platform or OEM.
    whyItMatters: Without realized pricing and repricing terms, it is impossible to quantify margin resilience or downside from further industry discounting.
    diligencePath: Request signed sample OEM contracts, price-adjustment clauses, and monthly realized ASP by major platform.
    relatedQuestionRefs:
    - QI004
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-and-profitability
    missingEvidence: Standalone EV battery monthly burn, runway, EBITDA, and operating loss for 2024-2026.
    whyItMatters: Capital adequacy cannot be underwritten from group-level filings alone when the EV battery business is explicitly described as loss-making and still scaling plants overseas.
    diligencePath: Obtain subsidiary management accounts, board reporting packs, and the latest twelve-month cash waterfall for the EV battery unit.
    relatedQuestionRefs:
    - QI010
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: enumeration-incomplete
    severity: material
    topic: overseas-capex-schedule
    missingEvidence: Phase-by-phase capex, subsidies, debt packages, and commissioning milestones for Thailand and Hungary.
    whyItMatters: The headline factory commitments are public, but the funding split between equity, bank debt, and government support determines future cash needs and dilution risk.
    diligencePath: Request plant budgets, subsidy letters, local incentive agreements, debt term sheets, and quarter-by-quarter commissioning milestones.
    relatedQuestionRefs:
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by OEM, receivable aging by customer, and platform-level mix for EV batteries.
    whyItMatters: The Geely dispute shows that a single quality issue can create a large earnings hit; concentration and receivable exposure determine how repeatable that risk is.
    diligencePath: Request top-10 customer revenue and gross profit bridge, receivable aging, warranty claims by OEM, and platform-level shipment mix.
    relatedQuestionRefs:
    - QI021
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: quality-liability-split
    missingEvidence: A reconciliation between the RMB 1.803 billion quality reserve, ordinary warranty accruals, and any Geely/Vremt-specific cash obligations.
    whyItMatters: Underwriting cash needs requires knowing whether the published reserve already absorbs the lawsuit economics or whether additional cash leakage remains ahead.
    diligencePath: Request the settlement payment schedule, reserve roll-forward, actuarial assumptions, and after-sales claim history by business line.
    relatedQuestionRefs:
    - QI021
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
