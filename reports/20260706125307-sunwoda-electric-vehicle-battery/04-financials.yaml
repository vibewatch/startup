company:
  name: Sunwoda Electric Vehicle Battery Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: 'Sunwoda''s EV battery business is growing fast but still shows weak public economics: EV battery revenue rose to RMB 18.91 billion in 2025, yet segment gross margin fell to 4.86%, 2026 first-quarter cash conversion collapsed, and the group keeps leaning on debt, private capital, and a pending Hong Kong IPO to fund Thailand and Hungary expansion. Consumer batteries remain the higher-margin financial backstop, while warranty costs, the Geely/Vremt settlement, and multiple disclosure gaps still block clean underwriting of standalone EV battery profitability or runway.'
sections:
- id: revenue-model
  title: Revenue model, mix, and pricing visibility
  body: |-
    Sunwoda's public financial picture still has to be read through the listed parent, but the disclosed mix is enough to establish the revenue engine. The EV battery business generated RMB 18.91 billion in 2025 after RMB 15.14 billion in 2024, taking the segment from 27.0% to 29.9% of parent revenue and making it the fastest-growing large business line in the group. Management also disclosed 42.72 GWh of battery shipments in 2025 including storage cells, which at least provides a rough denominator for a revenue bridge, even if it is not clean enough for precise ASP analysis. Revenue recognition is conventional hardware accounting: domestic revenue is booked on customer acceptance, while exports are generally recognized under a VMI withdrawal model. What is missing is price transparency. Sunwoda discloses neither list pricing nor realized OEM contract pricing, and it does not separate overseas EV battery revenue from the group's broader overseas sales, which remain heavily weighted to consumer batteries. That means investors can see growth and mix expansion, but not whether EV revenue quality is improving or simply buying volume with lower realized prices.
