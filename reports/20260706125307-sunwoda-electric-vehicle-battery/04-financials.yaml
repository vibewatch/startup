- id: profitability-unit-economics
  title: Profitability and unit-economics signals
  body: |-
    The most important public takeaway is that scale has not yet translated into comfortable EV-battery economics. The EV battery segment's gross margin fell from 8.80% in 2024 to 4.86% in 2025, while consumer batteries held 19.42% and storage systems delivered 23.34%. That spread is the clearest disclosed evidence that the group's profitable legacy franchise is still carrying the EV push. Independent analyses sharpen the point further: Bamboo Works and Benzinga both describe the EV battery segment as loss-making despite growth and note that earlier Shenzhen spin-off materials showed losses through 2023, including a RMB 1.56 billion loss in that year. The parent's 2026 first-quarter numbers are also cautionary. Revenue rose 31.1% year over year, but net profit fell 70.5%, ex-one-off profit turned slightly negative, and operating cash flow collapsed to just RMB 72.4 million. Quality costs are already material: product-quality provisions rose to RMB 1.80 billion, and the annual report explicitly says Sunwoda bears repair obligations under power-battery and storage contracts during the promised service period. The business can show growth, but margin compression, weak first-quarter cash conversion, and visible warranty drag all argue for caution.
