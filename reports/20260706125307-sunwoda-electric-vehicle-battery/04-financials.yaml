- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Standalone EV battery EBITDA / operating loss for 2024-2026
    - Cannot test whether the segment is approaching breakeven or still requires heavy group subsidy
    - Request monthly management P&L and spin-off workpapers showing segment EBIT bridge
  - - Monthly burn and runway by EV battery subsidiary
    - Capital adequacy cannot be underwritten from group cash alone
    - Request rolling 18-month cash forecast with capex, debt service, and downside cases
  - - Realized ASP and repricing clauses by OEM / platform
    - Cannot quantify price-war downside or customer bargaining power
    - Request sample customer contracts, realized ASP bridge, and monthly price-change log
  - - Customer revenue concentration and receivable aging
    - Cannot size single-customer risk or collections exposure after quality incidents
    - Request top-10 customer revenue, gross profit, AR aging, and warranty claims by OEM
  - - Overseas EV battery revenue split by geography
    - Cannot test whether Thailand/Hungary capex is matched to monetized regional demand
    - Request EV-only revenue split for Europe, Southeast Asia, and China export channels
  - - Thailand and Hungary capex funding mix
    - Cannot size future dilution, subsidy reliance, or bank-debt dependence
    - Request project budgets, subsidy letters, debt term sheets, and commissioning plan
  - - Reserve split between ordinary warranty and Geely/Vremt dispute
    - Cannot tell whether published reserves already absorb the largest known quality case
    - Request reserve roll-forward and settlement accounting memo
  - - Customer acquisition cost, sales cycle, and payback
    - Cannot judge GTM efficiency for new OEM programs or overseas plants
    - Request program win funnel, launch costs, and contribution margin by customer platform
  notes: These are not cosmetic omissions. Each missing metric directly affects underwriting of margin path, capital adequacy, or downside protection.
