- id: capital-intensity-liquidity
  title: Capital intensity, liquidity, and financing dependency
  body: |-
    Sunwoda's balance sheet shows why the EV battery strategy remains finance-hungry even before considering further overseas buildout. At year-end 2025 the group carried RMB 23.61 billion of fixed assets, RMB 10.56 billion of construction in progress, and RMB 10.76 billion of inventories. Investment cash outflow reached RMB 9.33 billion in 2025, while borrowings received totaled RMB 29.66 billion and debt repayments still consumed RMB 19.58 billion. Reported cash and cash equivalents of RMB 10.47 billion look substantial until the restricted portion is unpacked: monetary funds totaled RMB 21.75 billion, but roughly RMB 10.98 billion was tied up in margin deposits and similar restricted balances. Debt remained meaningful, with RMB 14.74 billion of short-term borrowings, RMB 5.60 billion of current maturities of long-term debt, and RMB 9.02 billion of long-term borrowings. The prospectus makes the deterioration in short-term liquidity explicit: current ratio fell from 1.3 at the end of 2023 to 1.1 at the end of 2024, mainly because cash fell by RMB 4.20 billion while capex on facilities and R&D increased. The May 2026 RMB 1.68 billion fundraise, the continuing Hong Kong IPO process, and an additional RMB 5.0 billion of project-finance guarantees all read like bridges to keep plant expansion moving rather than signs that EV operations can self-fund.
