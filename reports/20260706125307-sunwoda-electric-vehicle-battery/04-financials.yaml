- id: TI004
  title: Capital adequacy table
  columns:
  - Line item
  - Public value / status
  - Runway or obligation signal
  - Planned use / dependency
  - Diligence ask
  rows:
  - - Cash and cash equivalents FY2025
    - RMB 10.47B
    - Primary liquid buffer, but not enough alone to underwrite multiyear plant rollouts
    - Supports working capital and capex
    - Request subsidiary cash-by-entity and unrestricted cash bridge
  - - Total monetary funds FY2025
    - RMB 21.75B
    - Looks large until restrictions are removed
    - Includes deposits tied to trade finance and guarantees
    - Disclose unrestricted versus restricted balances by jurisdiction
  - - Restricted cash component
    - RMB 10.98B mainly margins for bank acceptance bills and letters of credit
    - Reduces practical liquidity available for discretionary capex
    - Supports procurement and trade-finance mechanics rather than free runway
    - Provide maturity ladder and release conditions for restricted balances
  - - Short-term borrowings
    - RMB 14.74B
    - Material refinancing burden inside twelve months
    - Funds operations and near-term expansion
    - Provide lender, collateral, and covenant schedule
  - - Current maturities of long-term borrowings
    - RMB 5.60B
    - Adds to near-term cash calls
    - Requires rollover or repayment from operating/financing cash
    - Provide repayment calendar and refinancing plan
  - - Long-term borrowings
    - RMB 9.02B
    - Shows expansion is already debt-supported
    - Backs longer-dated assets and projects
    - Break out plant-level debt allocation
  - - Net investment cash outflow FY2025
    - RMB -9.33B
    - Direct sign of capex burden
    - Driven by long-term asset spending
    - Provide asset-level capex schedule and expected commissioning payback
  - - May 2026 Series C round
    - RMB 1.6798B at RMB 25B pre-money from 13 investors
    - Bridge financing, not a full solution for overseas buildout
    - Supports balance sheet and ownership diversification
    - Request use-of-proceeds schedule and valuation cap table
  - - Additional 2026 project-finance guarantees
    - RMB 5.0B authorized for Zhejiang subsidiary
    - Potential off-balance funding support obligation
    - Could unlock plant financing while increasing contingent risk
    - Provide guarantee beneficiaries, tenor, and collateral package
  - - Thailand and Hungary projects
    - Thailand 50B baht; Hungary HUF 580B with HUF 93B first phase
    - Large multi-year capital commitments outside core domestic base
    - Depend on equity, debt, subsidies, and execution discipline
    - Request phase budgets, subsidy awards, and debt sources for each plant
  - - Hong Kong IPO
    - Filed; sponsors are Goldman Sachs and CITIC
    - Likely next major capital-market bridge if market window stays open
    - Supports overseas expansion and valuation reset ambitions
    - Request target proceeds, dilution, and timetable sensitivities
  - - Geely/Vremt settlement impact
    - RMB 500M-RMB 800M expected hit to 2025 net profit
    - Consumes earnings capacity and possibly cash if not fully reserved
    - May crowd out internally generated funding for expansion
    - Request payment schedule and interaction with warranty reserves
  notes: Public disclosures provide large balance-sheet and financing totals but not standalone EV subsidiary runway. Burn and months of runway remain unreported, so capital adequacy must be interpreted through group proxies and visible external funding events.
