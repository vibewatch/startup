- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Sunwoda solution
  - Measurable benefit
  - Limitation
  rows:
  - - Recharge passenger EVs quickly without sacrificing pack safety
    - OEM selects chemistry, pack voltage, and thermal architecture for high-power charging
    - Flash-charge battery roadmap from SFC480 to Xingchi 2.0
    - Public claims move from 5 minutes / 200 km to 5–95% in 9 minutes for the newest pack
    - Newest 15C program lacks named SOP vehicle and independent field validation
  - - Deliver durable high-power batteries for hybrids
    - OEM needs high power, long life, and low-temperature operability in smaller packs
    - HEV / hybrid battery line with prismatic and cylindrical pathways
    - Mass production to overseas automakers is publicly disclosed
    - Public customer names and field-return data are not disclosed
  - - Electrify vessels with system-level adaptation
    - Shipyard integrates propulsion, thermal, safety, and charging into vessel design
    - 314Ah endurance cells and 268Ah power cells with BMS and liquid cooling
    - 268Ah system is claimed to reach 10–80% charging in about 15 minutes
    - Commercial scale remains early and deployment evidence is sparse
  - - Meet EU-style traceability and supply-chain diligence requirements
    - Battery suppliers must collect lifecycle and compliance data across the value chain
    - Battery Passport platform plus ESS passport pilots
    - Six modules, 15 systems, and 78 indicators create structured lifecycle data
    - Pilot-completion and independent audit outcomes are not yet public
  - - Reduce downtime for light electric mobility
    - Two-wheeler operators need fast recharge and swap-station compatibility
    - Motorcycle ultra-fast charging battery with alliance ecosystem
    - 80% SOC in 20 minutes, 2,000+ cycles, and >90% swap-station compatibility are claimed
    - Design-in validation is public, but fleet-scale rollout is still limited
  notes: Benefits come from public launch and portfolio disclosures; limits identify where the public evidence stops short of audited operating proof.
