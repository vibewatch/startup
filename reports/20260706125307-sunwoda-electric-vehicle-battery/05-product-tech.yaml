- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Cell chemistry and materials stack
    - Sets power, density, cycle life, and cost envelope across LFP, NCM, semi-solid, solid-state, and sodium-ion products
    - Materials innovation plus partner input such as XTC and public-lab collaboration
    - Chemistry breakthroughs can remain pilot-only if scale-up or cost targets slip
  - - Module / BMS / PACK integration
    - Turns cell performance into vehicle or vessel systems with thermal, electrical, and safety logic
    - Customer packaging requirements, control software, and pack-level validation
    - Integration defects can create field liabilities even when cell chemistry is promising
  - - Manufacturing and inspection
    - Uses CT, CCD, and process controls to improve consistency before shipment
    - High-throughput production bases and in-line data collection
    - Public sources do not disclose yields or escape-rate baselines
  - - Lifecycle and compliance data layer
    - Captures battery-passport, carbon-footprint, and due-diligence information across the chain
    - Supplier data quality, digital identifiers, and permissioned data sharing
    - Incomplete upstream data can weaken global market-access claims
  notes: This table maps the visible operating architecture only; internal software services, exact line yields, and proprietary algorithms are not publicly enumerated.
