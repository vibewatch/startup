  evidenceGaps:
  - type: missing-source
    severity: material
    topic: 15c-commercialization
    missingEvidence: A named production vehicle launch, independent charge curve, and customer SOP timeline for Xingchi Supercharge Battery 2.0.
    whyItMatters: Without a named vehicle or third-party validation, the 15C pack could still be closer to a showcase configuration than a broadly shippable product.
    diligencePath: Request OEM launch references, charge-curve data, certification filings, and warranty terms for the first commercial 15C program.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE005
  - type: stale
    severity: material
    topic: ess-passport-validation
    missingEvidence: A post-June 2026 update confirming whether the ESS battery-passport pilot completed lifecycle validation and produced external audit results.
    whyItMatters: The compliance stack is more valuable if it has moved from pilot status into evidence that customers and regulators can actually rely on.
    diligencePath: Fetch post-summit updates, customer case studies, or auditor statements tied to the 588Ah and 684Ah ESS passport pilots.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
    - TE005
  - type: enumeration-incomplete
    severity: minor
    topic: marine-deployment-scale
    missingEvidence: A public list of vessel deployments, installed MWh, class approvals, and service intervals for the marine system portfolio.
    whyItMatters: Marine product breadth is visible, but without fleet-scale references it is hard to distinguish repeatable commercial traction from showcase projects.
    diligencePath: Collect shipyard references, operator testimonials, and class-society records for vessels already using 142Ah, 268Ah, or 314Ah solutions.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
