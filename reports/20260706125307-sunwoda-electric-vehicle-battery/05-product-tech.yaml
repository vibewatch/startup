- id: trust-quality-compliance
  title: Trust, quality, compliance, and lifecycle controls
  body: 'Sunwoda''s strongest public trust story is that it tries to industrialize quality and compliance as product features rather than afterthoughts. Flash-charging materials cite a five-layer safety design system and 367 safety-design patents, while the 2025 milestones page says the flash-charging battery achieved GB 38031-2025 certification. The company also publishes a battery-passport stack aimed at EU regulation, with six modules, 15 data systems, and 78 indicators, and the HKEX filing says that passport platform uses blockchain, IoT, and AI for end-to-end data management. On the manufacturing side, Sunwoda''s CT inspection article is one of the clearest operational proofs in the chapter because it names four deployed production bases and claims a shift from post-production sampling to in-line prevention. Even so, the trust surface is still incomplete. Public sources do not disclose defect escape rates, yield curves, certificate IDs, or external audit outcomes for the passport pilots.
    The Geely/Vremt settlement is therefore important product evidence: it shows Sunwoda''s quality narrative is substantial, but not yet enough to remove field-execution risk from diligence.'
