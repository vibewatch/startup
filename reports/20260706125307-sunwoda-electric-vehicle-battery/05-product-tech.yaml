    - TE002
  - type: missing-source
    severity: material
    topic: post-settlement-quality-proof
    missingEvidence: Independent post-settlement data on defect rates, replacement completion, return trends, or customer audits after the Geely/Vremt dispute.
    whyItMatters: Sunwoda’s disclosed quality systems may be substantial, but diligence still needs evidence that those controls have translated into better field performance.
    diligencePath: Request warranty-return data, replacement-program closure metrics, and follow-on audits from affected OEM programs.
