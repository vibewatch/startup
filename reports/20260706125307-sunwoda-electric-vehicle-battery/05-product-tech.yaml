tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Flash-charge BEV battery line (SFC480 → Flash 3.0 → Xingchi 2.0)
    - Passenger-EV OEM platform teams
    - Commercial base plus next-gen announced
    - Fast-charge roadmap spans 480 kW, 6C, 12C, and 15C headlines with system thermal-management emphasis
    - Need named series-production vehicle launches and independent charge curves for the 15C pack
  - - HEV / PHEV / EREV battery line
    - Hybrid OEM engineering and sourcing teams
    - Mass production / mature
    - Publicly tied to high-power HEV delivery and broader chemistry coverage for hybrid architectures
    - Need named overseas programs, warranty data, and customer mix disclosure
  - - Solid-state battery program
    - Advanced-EV OEM R&D teams
    - Pilot / pre-scale
    - Combines internal chemistry work, XTC materials collaboration, and Songshan Lake public R&D platform
    - Need audited pilot-output, cost, and vehicle-validation evidence
  - - Marine battery systems
    - Shipyards and vessel operators
    - Early commercialization
    - 314Ah and 268Ah cells are packaged with BMS, liquid cooling, and vessel-specific control strategies
    - Need fleet-scale deployment metrics beyond announced projects
  - - Battery passport / ESS compliance stack
    - ESS developers, OEMs, and regulators
    - Commercial surface with pilots in progress
    - Traceability software is paired with 588Ah and 684Ah ESS cells and carbon-footprint workflows
    - Need third-party audit results and customer adoption evidence
  notes: Rows summarize publicly exposed product families and adjacent assets; they are not a full internal SKU list or program-by-program revenue map.
