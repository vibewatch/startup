  - - Legacy / global OEM relationships
    - Buyer = legacy OEM sourcing; user = regional vehicle engineering; payer = OEM group
    - Renault, Nissan, SAIC, GAC
    - HEV, PHEV, and BEV supply programs
    - Shows ability to serve beyond startup logos and China-only brands
    - Named overseas model and volume detail is sparse
  - - Hybrid / range-extended accounts
    - Buyer = hybrid platform teams; user = range-extender and HEV programs; payer = OEM
    - Li Auto, Xiaomi planned EREV, unnamed overseas HEV automakers
    - High-power HEV and EREV battery systems
    - Differentiated niche where Sunwoda claims scale leadership
    - Installed base is disclosed, but customer-by-customer mix is not
  - - New 2025-2026 qualification wins
    - Buyer = sourcing teams testing new vendors; user = first vehicle program teams; payer = OEM
    - Nio Firefly, Tesla Shanghai exports, Xiaomi Kunlun / Skynomad
    - Initial program qualification or pre-SOP allocation
    - Proof that customer acquisition continues in 2025-2026
