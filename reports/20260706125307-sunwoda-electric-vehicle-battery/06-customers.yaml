- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Secondary-supplier wedge into leading OEMs
    - Wins may remain tactical and price-led rather than sole-source relationships
    - Useful for acquiring logos but weaker for durable account economics
    - Request share-of-wallet trend by OEM after first nomination
  - - Localized manufacturing and 11 overseas service centers
    - Support footprint helps win global programs but increases execution and service-cost burden
    - Can improve design-in velocity and response time for cross-border customers
    - Map which centers directly support named EV accounts and with what staffing
  - - Li Auto concentration rumor
    - Local media says about 40% of 2024 EV-battery shipments went to Li Auto
    - If accurate, EV-segment concentration is much higher than group-level disclosure implies
    - Get EV-battery revenue and shipment mix by top customer for 2024 and 9M25
  - - Tesla export qualification
    - High-brand validation can be overinterpreted before volume scales
    - Positive signal for acquisition, but not yet evidence of large installed share
    - Request awarded volume, quality KPIs, and domestic-China rollout criteria
  - - Xiaomi EREV allocation
    - Pre-SOP quota may shift before launch or be split across future variants
    - Important growth option if program launches on schedule
    - Verify SOP timing, pack volumes, and whether Sunwoda keeps primary-share status
  - - Geely / Vremt litigation
    - Quality failures can reverse customer economics and trigger replacement liabilities
    - Largest proof that field quality can damage repeat demand and margins
    - Review cell-level root-cause analysis, PPM, recall history, and remediation results
  notes: Risk rows blend positive expansion levers with the customer-durability risks that could limit monetization of those wins.
