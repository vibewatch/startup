- id: concentration-and-adverse-signals
  title: Expansion, concentration, and adverse customer signals
  body: 'The biggest customer-risk takeaway is that Sunwoda shows both breadth and concentration at the same time. Breadth is visible in the prospectus roster and in fresh 2025-2026 proofs across Nio, Tesla, Xiaomi, Li Auto, XPeng, and legacy OEM channels. Concentration is visible in the filing''s financial disclosure: the top five customers accounted for 58.1% of revenue in 2022, 47.7% in 2023, 44.3% in 2024, and 37.4% in 9M25, while the largest customer alone still represented 15.4% in 9M25 after being 28.6% in 2022. That disclosure is group-level, not EV-segment specific, so the precise battery-business mix remains a diligence gap. Independent commentary makes the risk sharper by claiming roughly 40% of 2024 EV-battery shipments went to Li Auto, although that figure is not prospectus-confirmed. The adverse evidence is stronger. Geely''s Vremt unit sued Sunwoda over battery cells supplied between 2021 and 2023, Zeekr 001 users reported charging and battery-health issues, and the eventual
    settlement imposed a large 2025 earnings hit and shared future replacement costs. Separate coverage of Li Auto customer resistance shows how one public quality event can travel beyond the direct litigating customer. As a result, Sunwoda''s expansion story is credible, but investors should treat concentration and field-quality execution as live customer-durability risks rather than backward-looking footnotes.'
