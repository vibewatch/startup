- id: named-customer-proof-and-adoption
  title: Named customer proof and adoption trajectory
  body: 'The highest-quality customer proof in this chapter is not a generic logo list but a stack of named deployments with different levels of maturity. Firefly is the cleanest direct proof because two MIIT-derived filing reports show Sunwoda as the LFP battery supplier for Nio''s first Firefly model and provide battery-pack, range, and launch-detail evidence. XPeng is older but still important proof because Sunwoda''s own 2024 article ties its mass-produced flash-charging battery to the XPeng G9, while independent coverage links that program to the company''s breakthrough into fast-charging BEV supply. The 2026 Tesla and Xiaomi items are meaningful for acquisition momentum but need careful weighting: Tesla currently looks like a qualification and export-vehicle entry rather than a broad installed-volume win, and Xiaomi''s 60/40 Sunwoda-CALB quota belongs to a not-yet-launched EREV platform. The overseas HEV story is also real but incomplete. Official and trade-media disclosures say Sunwoda
    has achieved mass HEV production for renowned overseas automakers and has surpassed 1.5 million HEV units of installed capacity, yet they stop short of publishing the named model-level foreign volume mix. Overall, Sunwoda''s adoption trajectory is strongest where public sources can pin the battery to a named vehicle or platform and weakest where the company discloses roster breadth without program economics.'
