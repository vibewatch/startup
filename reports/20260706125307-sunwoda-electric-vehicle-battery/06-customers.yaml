company:
  name: Sunwoda Electric Vehicle Battery Co., Ltd.
chapter:
  number: 6
  title: Customers
  summary: 'Sunwoda''s public customer proof is strongest where a named vehicle, regulatory filing, or prospectus-backed OEM list exists: the HKEX filing names Li Auto, XPeng, Leapmotor, GAC, SAIC, Renault, and Nissan; Firefly''s MIIT filings show Sunwoda entering Nio''s supply chain; and 2026 coverage shows Tesla export qualification and a Xiaomi EREV quota win. The same record also shows meaningful durability risk because group-level customer concentration remains high, contracts are typically not long-term, and the Geely/Vremt dispute plus Li Auto buyer resistance indicate that quality reputation can affect repeat demand and supplier mix.'
sections:
- id: customer-composition-and-segmentation
  title: Customer composition and segmentation
  body: 'Sunwoda''s EV-battery customer base should be read as a mix of three overlapping segments rather than one homogeneous logo wall. First, the company has a visible roster of Chinese new-energy vehicle OEMs and startups. Its Hong Kong listing document names Li Auto, XPeng, Leapmotor, GAC, SAIC, Renault, and Nissan, and says Sunwoda supplied eight of the world''s top ten new-energy vehicle manufacturers by 2024 sales volume. Second, the public record shows a hybrid and range-extended niche layered on top of the pure-BEV business: management-linked and media summaries repeatedly frame HEV and EREV batteries as a core wedge, with hybrid installed capacity above 1.5 million units and overseas HEV mass deliveries disclosed even though the exact foreign OEM names remain undisclosed. Third, the freshest 2025-2026 proofs come from new or expanding account entry points: Nio Firefly, Tesla''s Shanghai export supply chain, and Xiaomi''s planned EREV platform. That mix implies the buyer is usually
    an OEM purchasing and battery-engineering team, the user is the vehicle platform organization, and the payer is the automaker rather than the end driver. The same filing also says Sunwoda uses customer-centric localized capacity planning, 25 major production bases, and 11 overseas marketing and service centers to support those accounts, which matters because many of its wins appear to start as secondary-supplier or program-specific positions rather than exclusive sole-source mandates.'
