  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Audited OEM-level renewal, logo retention, NRR/GRR, contract renewal, and warranty-claim continuation data for EV-battery accounts.
    whyItMatters: Without renewal or retention metrics, the chapter can only infer durability from weaker program-continuity and sentiment proxies.
    diligencePath: Request account-level renewal cohorts, framework-agreement duration, repeat-order history, and warranty-performance dashboards from management or lead OEM customers.
    relatedQuestionRefs:
    - QU019
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: li-auto-concentration
    missingEvidence: EV-battery revenue, shipment, and gross-profit mix by top customer, including whether Li Auto actually represented about 40% of 2024 EV-battery shipments.
    whyItMatters: The prospectus proves group-level concentration but does not reveal how concentrated the EV-battery business is inside that total.
    diligencePath: Obtain management-prepared EV-segment concentration tables, top-customer shipment share, and any covenant or minimum-volume commitments from major OEMs.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: overseas-hev-customer-names
    missingEvidence: Named overseas HEV automakers, model programs, start-of-production dates, and field-performance metrics for the overseas HEV business.
    whyItMatters: The overseas HEV story is strategically important but remains too anonymous to underwrite customer quality, geography, and repeat-order depth.
    diligencePath: Ask for named foreign HEV customers, SOP timelines, unit shipments, warranty performance, and whether those accounts are direct or through JV structures.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: tesla-volume
    missingEvidence: Awarded volume, domestic-China rollout decision criteria, and quality KPI disclosure for the Tesla relationship.
    whyItMatters: Tesla is a high-signal logo, but the market may overread an export-qualification win if no scale or domestic rollout follows.
    diligencePath: Request awarded annual volume, export-model scope, qualification milestones, and any expansion criteria tied to field-quality performance.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TU003
    - TU005
