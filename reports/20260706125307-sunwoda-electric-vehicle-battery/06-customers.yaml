  - - Adverse or at-risk relationships
    - Buyer = existing OEM customer; user = after-sales and quality teams; payer = supplier/OEM cost sharing
    - Geely Vremt / Zeekr program
    - Existing supplied battery cells with post-sale quality disputes
    - Most concrete proof that field quality can reshape customer economics
    - Future share, remediation quality, and relationship reset are unclear
  notes: Segmentation reflects public OEM and vehicle-program evidence only; it is not a complete internal customer ledger and does not reveal exact revenue share by account.
