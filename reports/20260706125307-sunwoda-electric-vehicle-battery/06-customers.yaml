  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Typical OEM journey from first qualification to repeat programs and durability testing in Sunwoda's EV-battery accounts.
  data:
    nodes:
    - id: u1
      label: Qualification wedge
      description: Sunwoda usually enters with a price / fast-charge / hybrid niche rather than as an undisputed sole-source incumbent.
    - id: u2
      label: Named first program
      description: A single platform or filing-based proof point appears first, such as Firefly, XPeng G9, Tesla export supply, or Xiaomi Kunlun.
    - id: u3
      label: Localized engineering support
      description: Customer-centric capacity planning, nearby manufacturing, and overseas service centers are used to reduce response time for OEM teams.
    - id: u4
      label: Multi-program expansion attempt
      description: Sunwoda then tries to convert the first nomination into additional models, hybrid programs, or export variants.
    - id: u5
      label: Economics and concentration test
      description: The account only becomes attractive if share of wallet expands rather than staying a low-margin secondary-supplier slot.
    - id: u6
      label: Durability / quality test
      description: Repeat demand depends on field quality, warranty outcomes, and whether procurement teams still trust Sunwoda after issues emerge.
