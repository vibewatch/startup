- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Another valuation reset
    - Next disclosed financing below the current 25bn pre-money mark
    - Confirms the current round was not the floor and weakens any fair-value defense
    - Reset base case lower and avoid adding capital
  - - No IPO financing progress
    - No disclosed timetable, price range, or material update through the next financing cycle
    - Suggests capital-market optionality is weaker than assumed
    - Move stance from track to avoid unless entry terms improve
  - - No margin repair
    - EV gross margin stays around low single digits through another reporting cycle
    - Shows volume growth is not translating into usable economics
    - Treat the private mark as too full for the risk
  - - Supplier-payment stress persists
    - Evidence of delayed payments or new working-capital interventions despite the 60-day pledge
    - Signals ongoing cash conversion strain
    - Require stronger downside protection or step away
  - - New quality-liability shock
    - Another material warranty or settlement charge tied to EV batteries
    - Hits both credibility and cash needs at once
    - Re-underwrite the business on a lower multiple
  notes: Kill triggers focus on observable events that can be monitored from public filings, market-data services, or financing disclosures rather than on unobservable management narratives.
  claimRefs:
  - CV007
  - CV008
  - CV018
  - CV029
  - CV041
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Standalone EVB audited financials
    - Revenue bridge, gross margin, EBITDA, capex, and operating cash flow for the EV-battery subsidiary
    - Without standalone statements the round multiple cannot be tied to true earnings power
    - Management data room or Hong Kong listing filing updates
  - - Post-round cap table and preferences
    - Preference stack, anti-dilution, liquidation terms, and investor protections from the May 2026 round
    - Downside cannot be underwritten from headline pre-money alone
    - Legal diligence on financing documents
  - - IPO economics
    - Intended raise size, use of proceeds, cornerstone support, and pricing range
    - IPO optionality is central to the bull case and to dilution analysis
    - Watch HKEX filings and banker marketing materials
  - - Customer pricing and profitability
    - Customer-level ASP, gross margin, rebate, and warranty terms by EV platform
    - This is the only way to know whether share growth creates value
    - Commercial diligence with management and customer references
  - - Overseas plant utilization and funding
    - Thailand and Hungary capex schedule, utilization ramp, and funding split
    - Overseas execution is capital-intensive and can absorb equity value quickly
    - Project-level diligence and lender documentation
  notes: These asks are intentionally short and investment-specific. All five matter, but the first three are the minimum set required before treating the current valuation as underwritten rather than merely observed.
  claimRefs:
  - CV011
  - CV028
  - CV031
  - CV040
