runDate: '2026-07-06'
company:
  name: Sunwoda Electric Vehicle Battery Co., Ltd.
chapter:
  number: 8
  title: Valuation
  summary: Sunwoda EVB is real enough to watch but not cheap enough to underwrite aggressively on public evidence alone. The May 2026 round at CNY 25 billion pre-money implies roughly 1.3x trailing EV-battery sales, which sits near or above several listed second-tier Chinese battery peers even though Sunwoda still shows thin EV margins, incomplete standalone disclosure, and a financing case that depends heavily on a not-yet-priced Hong Kong IPO. The resulting stance is track with medium confidence, high risk, and a stretched-to-fair valuation view until the company proves better standalone economics or offers materially better entry terms.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: The public-evidence case for Sunwoda EVB is investable only with price discipline. The business has real scale, a visible customer list, and enough disclosed revenue to prove the franchise is not a slideware subsidiary. Yet the same evidence set shows a unit still fighting a punishing price war from a second-tier market position, with economics that look far weaker than the listed parent headline implies. The May 2026 round at CNY 25 billion pre-money therefore reads less like a bargain entry and more like a live negotiation between strategic optionality and unresolved execution risk. On simple trailing sales, the round implies roughly 1.3x 2025 EV-battery revenue, which is not absurd relative to listed Chinese peers, but it is also not obviously cheap for a smaller, less transparent, and likely loss-making asset. That combination supports a track-or-research-more stance rather than a buy call. Investors should wait for either better disclosure, better terms, or visible margin repair
    before treating the current mark as attractive.
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV009
  - CV023
  - CV032
  - CV034
  - CV039
  - CV043
  tableRefs:
