- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Market value / valuation
  - Revenue basis
  - Implied multiple
  - Relevance
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Covers Sunwoda EVB, its public parent read-through, and the most useful listed Chinese battery peers with accessible July 2026 market-value or valuation data. It is partial because not every global battery company has directly comparable business mix or transparent current revenue on a like-for-like basis.
  rows:
  - - Sunwoda EVB 2026 private round
    - CNY 25bn pre-money
    - RMB 18.908bn EV-battery revenue in 2025
    - ~1.3x trailing sales
    - Best direct anchor for current entry
    - Private round; no public preference stack or standalone cash-flow disclosure
  - - Sunwoda EVB prior-round framing
    - About CNY 30bn
    - RMB 15.1bn EV-battery revenue in 2024
    - ~2.0x trailing sales
    - Shows de-rating into 2026
    - Prior-round value comes from media framing rather than a full cap-table filing
  - - CATL
    - $255.40bn market cap
    - $63.65bn TTM revenue
    - ~4.0x
    - Premium benchmark for scale and profitability
    - Category leader with far stronger economics than Sunwoda
  - - BYD
    - $117.64bn market cap
    - $107.28bn TTM revenue
    - ~1.1x
    - Integrated China battery-auto benchmark
    - Auto integration and internal demand make the comp conservative
  - - EVE Energy
    - $19.01bn market cap
    - $9.26bn TTM revenue
    - ~2.1x
    - Closest higher-multiple second-tier listed peer
    - Broader product mix and somewhat better economics
  - - Gotion High-tech
    - $7.15bn market cap
    - $6.61bn TTM revenue
    - ~1.1x
    - Closest listed second-tier comp on simple sales multiple
    - Business mix and VW relationship differ from Sunwoda
  - - CALB
    - HK$42.8-43.6bn or about $5.47bn market cap
    - Yahoo key statistics show 0.85x price-to-sales and 1.83x EV/revenue
    - Sub-1x P/S on Yahoo
    - Useful listed second-tier Hong Kong comp
    - Revenue snapshot and ratio source are not identical datasets
  notes: Multiples are rough public-market read-throughs using July 2026 market-cap snapshots and the revenue bases available on the cited market-data pages. They are not enterprise-value-normalized apples-to-apples comps and should be used directionally.
