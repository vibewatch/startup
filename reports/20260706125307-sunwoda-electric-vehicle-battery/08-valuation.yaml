tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more at current disclosed private price
    - 1.3x implied trailing sales is not obviously cheap for a smaller private unit with thin economics
    - Wait for better disclosure, better terms, or visible margin repair
  - - Confidence
    - Medium
    - Revenue, shipments, market share, and sponsor data are public, but standalone EVB profitability and cap-table terms are not
    - Use scenario ranges, not a single target price
  - - Risk rating
    - High
    - Price war, quality-liability history, liquidity pressure, and capital needs still matter
    - Underwrite downside first
  - - Valuation stance
    - Stretched to fair
    - Current mark screens above several second-tier listed peers and below only stronger premium names
    - Avoid treating the round as a margin-of-safety entry
  - - Best near-term catalyst
    - Disclosure upgrade rather than volume growth alone
    - Standalone EVB auditeds, IPO terms, or verified margin repair would change the call faster than incremental share data
    - Reassess only when evidence quality improves
  notes: This table is valuation-led rather than company-quality-led. Assessments are based only on public evidence available by the run date and assume no access to a management data room.
