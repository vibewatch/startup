- id: final-stance-and-diligence
  title: Final stance, kill triggers, and diligence
  body: 'The final stance is track with medium confidence and a high risk rating. That call is price-sensitive rather than anti-company: Sunwoda EVB has enough evidence of scale, customers, and strategic relevance to stay on the list, but not enough evidence of clean standalone economics or investor protection to justify enthusiastic underwriting at the disclosed price. The next diligence step is straightforward. Investors need audited standalone EVB statements, the post-round cap table and preference terms, a more explicit IPO use-of-proceeds framework, and customer-level pricing or margin evidence. Until then, the correct monitoring posture is to watch for thesis-break signals instead of extrapolating the parent company’s broader narrative. Another valuation reset, no visible margin repair, sustained financing stress, or an IPO process that stalls without explanation should all force a lower valuation anchor. Conversely, proven margin improvement or a meaningfully better entry price would
    be the clearest reasons to revisit the recommendation.'
  claimRefs:
