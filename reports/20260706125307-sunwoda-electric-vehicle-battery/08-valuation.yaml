- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market position
    - Real OEM exposure and enough volume to matter in China and globally
    - Still a second-tier supplier far behind CATL and BYD
    - Sustained share gains or customer wins that move Sunwoda out of the lower single-digit share band
  - - Unit economics
    - Scale can eventually lift utilization and bargaining power
    - 2025 EV gross margin was only 4.86% and independent coverage still flags weak or loss-making economics
    - Proof of standalone EVB gross margin moving into a sustainably higher band
  - - Parent support
    - Consumer batteries provide operational ballast and improve survivability
    - Cross-subsidy can hide true EV returns and delay discipline
    - Standalone EVB auditeds showing acceptable economics without parent cushion
  - - Financing path
    - HK listing plus recent private capital show access to money
    - The 2026 round reset valuation and IPO terms remain undisclosed
    - Public filing of raise size, use of proceeds, and cornerstone support without another reset
  - - Exit path
    - Battery IPO window is open and strategic buyers understand the sector
    - Window is crowded, selective, and may reward only stronger economics
    - A marketed IPO range or strategic term sheet that validates a higher multiple
  notes: The anti-thesis is not generic skepticism. It is the specific set of public-evidence gaps that prevent a buy call at the current disclosed valuation.
