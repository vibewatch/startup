  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ipo-terms
    missingEvidence: Public deal size, timetable, cornerstone orders, and use-of-proceeds detail for the Hong Kong listing.
    whyItMatters: The bull case depends on financing optionality, but the current market still cannot see whether the IPO will be large, well supported, or dilutive.
    diligencePath: Monitor the next HKEX filing set and request banker or company marketing materials once available.
    relatedQuestionRefs:
    - QV010
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Post-round cap table, preference stack, anti-dilution, liquidation preference, and other investor-rights terms from the May 2026 financing.
    whyItMatters: Headline pre-money valuation is not enough to underwrite downside or true entry economics for new investors.
    diligencePath: Obtain financing documents or a legal cap-table schedule directly from management or counsel.
    relatedQuestionRefs:
    - QV024
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation
    missingEvidence: Cleaner like-for-like revenue and net cash data for CALB and other second-tier battery peers, plus a direct standalone EVB balance sheet for Sunwoda.
    whyItMatters: The comparable table is directionally strong, but exact EV-based comp work still suffers from mixed datasets and private-company opacity.
    diligencePath: Refresh the public comp pack with full annual-report datasets and seek EVB standalone financials before committing to a tighter target range.
    relatedQuestionRefs:
    - QV021
    - QV027
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: standalone-profitability
    missingEvidence: Standalone EVB EBITDA, operating cash flow, and customer-level gross margin disclosures.
    whyItMatters: The biggest remaining debate is whether the EV battery business is merely thin-margin or still structurally loss-making after corporate allocations.
    diligencePath: Request subsidiary-level audited statements or the next IPO filing chapter that breaks out EVB economics more explicitly.
    relatedQuestionRefs:
    - QV005
    - QV025
    - QV029
