company:
  name: "Sunwoda Electric Vehicle Battery Co., Ltd."
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sunwoda EVB is a private EV battery subsidiary of Shenzhen-listed Sunwoda Electronic, valued at CNY 25 billion (~$3.5B) following a May 2026 fundraise of CNY 1.68 billion, and is pursuing an independent Hong Kong IPO while supplying major OEMs including Tesla, NIO, and Volkswagen."

sections:
  - id: "identity-and-structure"
    title: "Identity, Structure, and Corporate Governance"
    body: |
      Sunwoda Electric Vehicle Battery Co., Ltd. (also referred to as Sunwoda EVB or Sunwoda Mobility Energy Technology) is a private Chinese EV battery manufacturer headquartered in Shenzhen, Guangdong Province, China. The company operates as a separately capitalized subsidiary of Sunwoda Electronic Co., Ltd. (SZSE: 300207), which is listed on the Shenzhen Stock Exchange. Sunwoda Electronic was founded in 1997 by brothers Wang Mingwang and Wang Wei, initially as a consumer electronics battery manufacturer. The EV battery subsidiary was formally established around 2014-2015 to capitalize on China's rapidly growing new energy vehicle market.

      As of mid-2026, the parent company's ownership stake in Sunwoda EVB has diluted from an original ~40% to approximately 27% following multiple external fundraising rounds, most recently the May 2026 capital injection. The subsidiary maintains its own investor base, governance structure, and capital markets strategy — it is pursuing an independent Hong Kong IPO (H-share listing) separate from the parent's Shenzhen listing. Wang Mingwang serves as Chairman of the EVB subsidiary board, while Wang Wei remains Chairman and CEO of the parent Sunwoda Electronic.

      The company produces lithium-ion battery cells, modules, and packs for electric vehicles and energy storage systems. It has manufacturing facilities in China (Shenzhen, Huizhou, Nanjing, Meishan in Sichuan), Thailand (Chonburi), and Hungary (Nyíregyháza), positioning it for both domestic and international supply chains.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO001]

  - id: "leadership-and-governance"
    title: "Leadership, Founders, and Key Personnel"
    body: |
      The Sunwoda group is controlled by the Wang family. Wang Mingwang and Wang Wei co-founded Sunwoda Electronic in 1997 in Shenzhen. Wang Mingwang transitioned from CEO of the parent (2011-2016) to focus on the EV battery subsidiary, where he serves as Chairman. Wang Wei took over as CEO and Chairman of Sunwoda Electronic in October 2016 and continues in this role, holding approximately 7.2% of the parent company's shares.

      The leadership team for the EVB subsidiary includes experienced battery industry executives. The parent company's board includes independent directors with audit, nomination, and compensation specialties, with average tenures of approximately 9 years for management and 6 years for board members. Key-person dependence is moderate — while the Wang brothers provide strategic direction and industry relationships, the operational management team has deepened considerably as the company has scaled.

      Rong Bo Liu serves in a senior governance role. Jie Liu serves as Finance Director/CFO, and Di Ceng acts as Corporate Secretary. The stable executive team and family-controlled governance structure is typical of successful Chinese private enterprises but carries succession and concentration risks.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO002]

  - id: "funding-and-valuation"
    title: "Funding History, Valuation, and Capital Strategy"
    body: |
      Sunwoda EVB has raised significant external capital through multiple pre-IPO funding rounds. The most recent round in May 2026 raised CNY 1.68 billion (~$232 million USD) from 13 investors at a pre-money valuation of CNY 25 billion (~$3.5 billion USD). This valuation represents a notable decrease from a prior valuation of approximately CNY 36.4 billion, reflecting broader market compression in the Chinese EV battery sector. To protect existing shareholder interests amid the lower valuation, Sunwoda implemented a capital reserve conversion into equity before completing the investment.

      The investor base for the May 2026 round is predominantly state-backed, including Gongrong Jintou No. 2, ABC Financial Asset Investment Co., local government funds from Shenzhen and Sichuan, and industrial strategic investors. This investor composition signals strong government support for Sunwoda's position in China's strategic battery supply chain.

      The company filed for an independent Hong Kong IPO on the main board in July 2025, with Goldman Sachs and CITIC Securities as sponsors. The IPO aims to raise international capital, facilitate overseas expansion (Thailand and Hungary factories), advance solid-state battery commercialization, and potentially achieve a higher market valuation than possible in China's A-share market. Peers like CATL have demonstrated premium valuations on the Hong Kong Exchange. The IPO has not yet priced as of the report date.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO003]
    figureRefs: [FO002]

  - id: "milestones-and-scale"
    title: "Key Milestones and Current Scale"
    body: |
      Sunwoda EVB has achieved significant scale, generating revenue of CNY 15.14 billion (~$2.1B) in 2024 and CNY 18.91 billion (~$2.6B) in 2025, representing 24.9% year-over-year growth. The EV battery segment accounted for approximately 27% of parent revenue in 2024 and 30% in 2025, demonstrating its increasing importance within the group.

      The company holds approximately 3.2% of China's EV battery market by installations (2025 full year) and 2.5% of the global market (Q1 2026). It supplies 8 of the top 10 global NEV manufacturers. Key milestones include entering Tesla's supply chain in 2026, winning the NIO Firefly battery contract in 2025, settling the Geely/VREMT quality lawsuit in February 2026 for CNY 608 million, and unveiling a 400 Wh/kg solid-state battery in October 2025.

      Overseas expansion has accelerated with $1.5 billion invested in Thailand battery plants (Phase I operational 2025, Phase II at 17.4 GWh planned) and $1.7 billion invested in a Hungary factory (first European plant, operational end-2025). The company's overseas revenue already represented 40.5% of total earnings in 2024.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029]
    tableRefs: [TO004]
    figureRefs: [FO003]

