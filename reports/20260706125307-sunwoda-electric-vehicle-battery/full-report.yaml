          - type: callout
            title: Compliance and tariffs can tax overseas growth even if demand stays healthy
            body: >-
              US tariffs and EU battery-passport requirements do not kill demand, but they do raise landed cost, data
              burden, and qualification friction for Chinese suppliers expanding abroad.
            calloutType: risk
