        title: Exhibits
        blocks:
          - type: callout
            title: Large TAM does not translate into easy share capture
            body: >-
              Sunwoda participates in a large and still-growing market, but concentration, long qualification cycles,
              and dominant incumbents mean observable SOM is far narrower than the headline TAM suggests.
            calloutType: insight
            claimRefs:
