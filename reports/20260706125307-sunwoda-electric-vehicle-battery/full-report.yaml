      - number: '2.2'
        title: 'Sizing Lenses: Global Value, China Volume, and Observable Share'
        blocks:
          - type: paragraph
            body: >-
              Public market sizing converges on a large category but not on a single number. For 2026, open-access
              summaries show a low-to-mid range of roughly $86.5 billion to $107.6 billion for the global EV battery
              market, while a broader battery-pack lens reaches much higher levels because it uses a wider scope. The
              right conclusion is not to average the numbers mechanically; it is to preserve the range and ask which
              definition best matches Sunwoda’s sellable market. For this chapter, China installation volume and global
              usage data are more operationally useful than any one headline TAM.


              China remains the most important serviceable demand pool. Installed EV battery volume reached 769.7 GWh in
              2025, up 40.4% year over year, and the market mix is overwhelmingly LFP. Globally, EV battery usage
              reached 244.6 GWh in Q1 2026, while Chinese suppliers still controlled roughly 71% to 72% of world share.
              Sunwoda is visible within that set—10th globally at 8.7 GWh and 2.5% share in January-April 2026—but its
              observable SOM remains small relative to CATL and BYD.
