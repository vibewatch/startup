  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public-evidence case for Sunwoda EVB is investable only with price discipline. The business has real
              scale, a visible customer list, and enough disclosed revenue to prove the franchise is not a slideware
              subsidiary. Yet the same evidence set shows a unit still fighting a punishing price war from a second-tier
              market position, with economics that look far weaker than the listed parent headline implies. The May 2026
              round at CNY 25 billion pre-money therefore reads less like a bargain entry and more like a live
              negotiation between strategic optionality and unresolved execution risk. On simple trailing sales, the
              round implies roughly 1.3x 2025 EV-battery revenue, which is not absurd relative to listed Chinese peers,
              but it is also not obviously cheap for a smaller, less transparent, and likely loss-making asset. That
              combination supports a track-or-research-more stance rather than a buy call. Investors should wait for
              either better disclosure, better terms, or visible margin repair before treating the current mark as
              attractive.
            claimRefs:
