      - number: '6.3'
        title: Retention, repeat usage, and procurement durability
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is materially thinner than public customer-acquisition evidence. Sunwoda's
              prospectus does not publish NRR, GRR, logo retention, renewal rates, or OEM-level warranty performance
              metrics, and it explicitly says customer contracts are typically not long-term contracts. That means
              durability has to be inferred from weaker proxies. Positive proxies exist: the company keeps surfacing in
              adjacent customer contexts over time, from earlier XPeng and Li Auto proof points to 2025 Firefly and 2026
              Tesla and Xiaomi announcements, while its localized manufacturing and overseas service-center footprint
              suggests it is trying to reduce switching friction by staying close to OEM engineering and sourcing teams.
              Even so, these are still proxies, not audited retention statistics. The strongest negative proxy is
              reputational: after the Geely dispute became public, Li Auto buyers reportedly resisted Sunwoda-equipped
              i6 vehicles even when offered extra warranty coverage. That reaction suggests perceived quality can
              influence procurement and take rates before a supplier loses a contract outright. The right diligence
              posture is therefore to separate real repeat-program continuity from simple survival in a multi-supplier
              roster. Sunwoda can point to repeated account entry and platform presence, but public materials still do
              not show whether those positions expand into durable multi-platform share or simply remain tactical
              secondary-supplier allocations.
            claimRefs:
