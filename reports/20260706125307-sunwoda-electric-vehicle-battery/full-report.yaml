      - number: '4.5'
        title: Disclosure gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Sunwoda offers enough public evidence to support a cautious financial conclusion but not enough to
              underwrite the EV battery business cleanly. What is knowable is directionally clear: EV revenue is real
              and growing, the segment is strategically important, capex is heavy, liquidity has tightened, and the
              group keeps returning to external capital while independent analysts still describe EV batteries as
              loss-making. What remains unknowable from public materials is equally important. The listing document does
              not quantify current EV-segment losses, public filings do not disclose monthly burn or runway, and there
              is no public view on realized EV ASPs, platform repricing, customer-level revenue concentration, or the
              funding split for Thailand and Hungary. Even the RMB 1.803 billion quality reserve cannot be reconciled
              publicly against the Geely dispute. The underwriting verdict is therefore mixed: revenue momentum exists,
              but margin quality is weak, capital intensity is high, and disclosure remains too thin to treat the
              business as self-funding. Any investor should view the HK IPO and May 2026 raise as necessary financing
              steps, not proof that the EV battery segment has crossed into durable standalone profitability.
