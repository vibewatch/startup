      - number: '1.3'
        title: Funding History, Valuation, and Capital Strategy
        blocks:
          - type: paragraph
            body: >
              Sunwoda EVB has raised significant external capital through multiple pre-IPO funding rounds. The most
              recent round in May 2026 raised CNY 1.68 billion (~$232 million USD) from 13 investors at a pre-money
              valuation of CNY 25 billion (~$3.5 billion USD). This valuation represents a notable decrease from a prior
              valuation of approximately CNY 36.4 billion, reflecting broader market compression in the Chinese EV
              battery sector. To protect existing shareholder interests amid the lower valuation, Sunwoda implemented a
              capital reserve conversion into equity before completing the investment.


              The investor base for the May 2026 round is predominantly state-backed, including Gongrong Jintou No. 2,
              ABC Financial Asset Investment Co., local government funds from Shenzhen and Sichuan, and industrial
              strategic investors. This investor composition signals strong government support for Sunwoda's position in
              China's strategic battery supply chain.


              The company filed for an independent Hong Kong IPO on the main board in July 2025, with Goldman Sachs and
              CITIC Securities as sponsors. The IPO aims to raise international capital, facilitate overseas expansion
              (Thailand and Hungary factories), advance solid-state battery commercialization, and potentially achieve a
              higher market valuation than possible in China's A-share market. Peers like CATL have demonstrated premium
              valuations on the Hong Kong Exchange. The IPO has not yet priced as of the report date.
