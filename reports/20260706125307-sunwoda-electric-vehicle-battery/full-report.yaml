        title: Leadership, Founders, and Key Personnel
        blocks:
          - type: paragraph
            body: >
              The Sunwoda group is controlled by the Wang family. Wang Mingwang and Wang Wei co-founded Sunwoda
              Electronic in 1997 in Shenzhen. Wang Mingwang transitioned from CEO of the parent (2011-2016) to focus on
              the EV battery subsidiary, where he serves as Chairman. Wang Wei took over as CEO and Chairman of Sunwoda
              Electronic in October 2016 and continues in this role, holding approximately 7.2% of the parent company's
              shares.


              The leadership team for the EVB subsidiary includes experienced battery industry executives. The parent
              company's board includes independent directors with audit, nomination, and compensation specialties, with
              average tenures of approximately 9 years for management and 6 years for board members. Key-person
              dependence is moderate — while the Wang brothers provide strategic direction and industry relationships,
              the operational management team has deepened considerably as the company has scaled.


              Rong Bo Liu serves in a senior governance role. Jie Liu serves as Finance Director/CFO, and Di Ceng acts
              as Corporate Secretary. The stable executive team and family-controlled governance structure is typical of
              successful Chinese private enterprises but carries succession and concentration risks.
