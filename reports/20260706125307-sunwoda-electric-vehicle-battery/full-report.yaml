        - Named supplier to Li Auto, XPeng, Leapmotor, GAC, SAIC, Renault, Nissan, plus recent Volvo / VW appointments
        - Broad chemistry and form-factor menu; service-heavy wedge; consumer battery cash support
        - No scale moat; still competing from the second tier and exposed to price-led awards
