  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Rival Classes
        blocks:
          - type: paragraph
            body: >-
              The competitive set is not a flat list of battery makers. It is a layered structure with a dominant
              duopoly at the top, a crowded second tier beneath it, and a substitute path in which large OEMs
              internalize more pack and control functions. Across January, Q1, and April 2026 snapshots, CATL held
              roughly 46% to 50% share of China’s battery market and BYD held about 17% to 21%, while Sunwoda stayed
              around 2% to 3% depending on the month and measurement lens. Bamboo Works described the result bluntly:
              CATL and BYD take most of the market, leaving second-tier players like Sunwoda, CALB, Gotion, EVE, and
              SVOLT to compete for a much smaller residue. Sunwoda’s own filing supports the same reading from a
              different angle: it ranked only tenth globally in 2024, even after becoming a supplier to eight of the top
              ten NEV makers by sales volume. That means Sunwoda’s most relevant battleground is not displacing CATL
              outright, but outperforming the second tier on customer fit, execution, and capital discipline while
              surviving a market where technology gaps are narrowing and buyers are increasingly comfortable running
              multiple suppliers.
            claimRefs:
              - CP001
              - CP002
              - CP008
