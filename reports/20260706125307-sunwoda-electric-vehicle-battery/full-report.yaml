  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Adjacent Pools
        blocks:
          - type: paragraph
            body: >-
              Sunwoda’s relevant market is the EV traction-battery stack: cells, modules, and packs that are designed
              into BEV, PHEV, and HEV vehicle platforms. That core lens is narrower than “all batteries,” because it
              excludes consumer electronics, most stationary-storage project revenue, and upstream mining or refining
              revenue that sits before the cell-maker in the value chain. It is also narrower than some pack-market
              estimates that embed broader integration scope. The distinction matters because Sunwoda sells into a
              qualification-heavy automotive procurement process, not every battery-adjacent dollar of demand.


              At the same time, the chapter cannot ignore adjacency. Battery storage is now the fastest-growing power
              technology, and Chinese battery makers increasingly use ESS as a second outlet for capacity, especially
              for LFP chemistries that have already become dominant in China’s EV market. For buyers, the status-quo
              substitutes are not only rival cell suppliers; they also include incumbent internal-combustion platforms,
              in-house battery programs, and captive or partnership-based sourcing arrangements that reduce the role
              available to an independent supplier.
            claimRefs:
              - CM001
              - CM002
              - CM003
