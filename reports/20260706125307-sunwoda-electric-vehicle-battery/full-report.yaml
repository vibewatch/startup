      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Sunwoda does have real mitigations, but the public record supports only a conditional comfort level. On
              the constructive side, the company has invested in battery-passport tooling, GBA pilot work, localized
              manufacturing expansion, and a sustainability framework built around lifecycle, ecology, accountability,
              and partnership. It also continues to win new OEM entry points, which means the market has not closed to
              it after the Geely dispute. But the retained evidence does not yet show four things an investor would want
              before treating the mitigations as mature: first, audited closure of the VREMT and recall-type quality
              exposure beyond the settlement headline; second, named-customer proof that the battery-passport stack is
              accepted at scale rather than in pilot form; third, prospectus-level clarity on IPO timing, raise size,
              and fallback financing if capital markets weaken; and fourth, a hard operating bridge from shipment growth
              to sustainable EV-battery profitability. As a result, the right posture is to treat mitigation as
              improving but unproven. Thesis-break triggers should therefore be event-based and measurable: another
              major customer quality dispute, a material overseas-ramp slip, passport-validation failure for
              Europe-facing programs, or financing stress that forces Sunwoda to fund expansion while sector price wars
              remain acute.
