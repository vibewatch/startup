    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Structure, and Corporate Governance
        blocks:
          - type: paragraph
            body: >
              Sunwoda Electric Vehicle Battery Co., Ltd. (also referred to as Sunwoda EVB or Sunwoda Mobility Energy
              Technology) is a private Chinese EV battery manufacturer headquartered in Shenzhen, Guangdong Province,
              China. The company operates as a separately capitalized subsidiary of Sunwoda Electronic Co., Ltd. (SZSE:
              300207), which is listed on the Shenzhen Stock Exchange. Sunwoda Electronic was founded in 1997 by
              brothers Wang Mingwang and Wang Wei, initially as a consumer electronics battery manufacturer. The EV
              battery subsidiary was formally established around 2014-2015 to capitalize on China's rapidly growing new
              energy vehicle market.


              As of mid-2026, the parent company's ownership stake in Sunwoda EVB has diluted from an original ~40% to
              approximately 27% following multiple external fundraising rounds, most recently the May 2026 capital
              injection. The subsidiary maintains its own investor base, governance structure, and capital markets
              strategy — it is pursuing an independent Hong Kong IPO (H-share listing) separate from the parent's
              Shenzhen listing. Wang Mingwang serves as Chairman of the EVB subsidiary board, while Wang Wei remains
              Chairman and CEO of the parent Sunwoda Electronic.


              The company produces lithium-ion battery cells, modules, and packs for electric vehicles and energy
              storage systems. It has manufacturing facilities in China (Shenzhen, Huizhou, Nanjing, Meishan in
              Sichuan), Thailand (Chonburi), and Hungary (Nyíregyháza), positioning it for both domestic and
              international supply chains.
