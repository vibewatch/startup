      - number: '2.5'
        title: Sizing and Adoption Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Two gaps keep this chapter from producing a clean single-number SAM or SOM. First, public market-research
              houses do not use the same scope. Some quote EV-battery revenue, some quote battery-pack revenue, and some
              bundle in wider ecosystem activity. Those differences explain why public estimates diverge so sharply.
              Second, open sources are strong on China’s realized GWh installations and chemistry share, but weak on
              directly citable 2026 China market revenue and forward installation forecasts that can be tied to the same
              definition.


              The company-specific gap is just as important. Public data shows Sunwoda’s global rank and share snapshot,
              but it does not cleanly isolate the company’s addressable share by segment, geography, chemistry, or buyer
              type. Diligence should therefore prioritize OEM program mix, storage-customer pipeline, qualification
              win-rate, and contract-level gross-margin impact from tariffs and battery-passport compliance. Until those
              data are available, this chapter should be read as a range-bound market map rather than a precision
              top-down revenue model.
            claimRefs:
              - CM036
              - CM037
              - CM038
