      - number: '7.3'
        title: Operational, quality, and technology risk
        blocks:
          - type: paragraph
            body: >-
              Sunwoda’s operating risk is unusually coupled because manufacturing quality, compliance data quality, and
              product-roadmap ambition all matter simultaneously. The most concrete operational warning is the
              Geely/VREMT episode: the allegations covered cells supplied from 2021 to 2023, were serious enough to
              produce a multibillion-yuan claim, and ended with a large settlement plus shared future replacement costs.
              Public reports then tied the issue to battery-health programs, replacement activity, and even Volvo EX30
              recall reporting, indicating that a field issue can spread from one customer negotiation into a wider
              trust and safety discussion. At the same time, Sunwoda is ramping overseas factories and a digital
              passport stack while advertising 5-6C fast-charging products, large-format ESS cells, and solid-state
              products whose design or process validation is complete but whose scaled field performance is still not
              independently demonstrated in the retained record. That combination creates several practical failure
              modes: yield drift during plant commissioning, warranty claims if fast-charge performance degrades in use,
              compliance slippage if upstream data are incomplete, and management distraction if technology
              commercialization outruns quality-control capacity. Operationally, Sunwoda does have visible mitigations
              such as traceability tooling and quality messaging, but public evidence is still stronger on announced
              capability than on audited closure metrics.
