      - number: '8.4'
        title: Scenario analysis and IPO prospects
        blocks:
          - type: paragraph
            body: >-
              Scenario framing matters more than point estimates because the valuation outcome is highly path dependent.
              The bull case depends on three things happening together: Sunwoda holds or expands share despite CATL and
              BYD concentration, EV-battery margins normalize away from the current low-single-digit zone, and the Hong
              Kong listing or equivalent financing lands without another valuation reset. The base case is more modest:
              growth continues, share stays second tier, pricing pressure eases only gradually, and the market accepts a
              roughly flat-to-slightly-up range around the current mark. The bear case is the simplest to understand and
              therefore the one investors should underwrite hardest. If the IPO slips, if supplier and working-capital
              pressure remain visible despite the 60-day pledge, or if another round prices below the current mark,
              Sunwoda can quickly drift toward the lower-multiple part of the listed peer set. The 2026 IPO window is
              real, as CATL and EVE prove, but it is also crowded and selective. Sunwoda still needs to earn its
              re-rating rather than assume it.
            claimRefs:
              - CV014
