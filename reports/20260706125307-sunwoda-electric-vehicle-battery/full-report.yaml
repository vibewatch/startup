      - number: '5.2'
        title: Architecture, integration, and operating model
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is built around a layered battery stack rather than a pure materials play.
              Public filings and product pages show Sunwoda combining multi-material cell development with module, BMS,
              and PACK integration, and older fast-charge releases add detail on how the company thinks about
              architecture: low-cobalt or LFP chemistry choices, porous-electrode design, CT inspection, and 3D liquid
              cooling were all presented as levers for balancing power, density, and safety. The 2026 technology-day
              disclosures broadened that architecture into a portfolio that now includes sodium-ion cells for
              cost-sensitive or stationary use cases, solid-state programs for next-generation density, and marine
              systems that add vessel-specific BMS, liquid cooling, and control strategies. Dependencies matter here.
              Solid-state progress is tied to external materials partners such as XTC and to the newly announced
              Songshan Lake public R&D platform, while marine and ESS offerings depend on system-level adaptation rather
              than chemistry headlines alone. The result is a product architecture with real breadth, but also one that
              relies on execution across materials, system software, manufacturing, and customer integration.
