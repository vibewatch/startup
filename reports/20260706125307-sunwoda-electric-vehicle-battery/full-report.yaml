  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk taxonomy, ranking, and investment implication
        blocks:
          - type: paragraph
            body: >-
              The public record supports a five-part risk stack rather than a single headline problem. First, quality
              and legal exposure is already realized rather than hypothetical: the VREMT dispute moved from a Ningbo
              court filing to a February 2026 settlement that imposed an immediate earnings hit and open-ended shared
              replacement or testing costs. Second, Sunwoda still operates in an industry that China’s own regulators
              describe as suffering from below-cost price wars and disorderly capacity buildout, which matters because
              second-tier battery makers usually defend share with price and service rather than dominant scale. Third,
              the company is trying to execute multiple capital-heavy external moves at once: battery-passport
              compliance for Europe, a state-aid-backed Hungary plant, a BOI-backed Thailand project, and a Hong Kong
              IPO process that is framed by media as a funding response to sector stress. Fourth, filings still show
              customer concentration and typically non-long-term contracts, so volume wins do not eliminate dependency
              risk. Fifth, technology ambition remains high, with 5-6C products in mass production and solid-state
              claims moving through validation, but those achievements also widen warranty, manufacturability, and
              capital-allocation risk if field performance disappoints. The investment implication is that Sunwoda
              remains potentially financeable only if investors track risk transmission continuously instead of
              underwriting from shipment growth alone.
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR014
              - CR026
              - CR028
              - CR042
              - CR046
