          - type: callout
            title: ESS is a real adjacency for an LFP-heavy industry base
            body: >-
              The same industrial system serving China’s EV market is also supplying a fast-growing storage market,
              which gives suppliers a secondary demand outlet when auto pricing weakens.
            calloutType: strength
            claimRefs:
