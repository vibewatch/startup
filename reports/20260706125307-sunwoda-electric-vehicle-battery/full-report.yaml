  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Standalone EVB audited financials
        - Revenue bridge, gross margin, EBITDA, capex, and operating cash flow for the EV-battery subsidiary
        - Without standalone statements the round multiple cannot be tied to true earnings power
        - Management data room or Hong Kong listing filing updates
      - - Post-round cap table and preferences
        - Preference stack, anti-dilution, liquidation terms, and investor protections from the May 2026 round
        - Downside cannot be underwritten from headline pre-money alone
        - Legal diligence on financing documents
      - - IPO economics
        - Intended raise size, use of proceeds, cornerstone support, and pricing range
        - IPO optionality is central to the bull case and to dilution analysis
        - Watch HKEX filings and banker marketing materials
      - - Customer pricing and profitability
        - Customer-level ASP, gross margin, rebate, and warranty terms by EV platform
        - This is the only way to know whether share growth creates value
        - Commercial diligence with management and customer references
      - - Overseas plant utilization and funding
        - Thailand and Hungary capex schedule, utilization ramp, and funding split
        - Overseas execution is capital-intensive and can absorb equity value quickly
        - Project-level diligence and lender documentation
    notes: >-
      These asks are intentionally short and investment-specific. All five matter, but the first three are the minimum
      set required before treating the current valuation as underwritten rather than merely observed.
