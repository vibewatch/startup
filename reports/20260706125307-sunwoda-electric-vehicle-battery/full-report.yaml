        - About 4%-6% China share; 20 GWh unified-cell line for VW
        - Volkswagen standard-cell contract plus broad China platform exposure
        - Full-chain integration claim and strong Europe-facing standard-cell story
        - Still far smaller than CATL / BYD in domestic installed share
