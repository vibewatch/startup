        title: Maturity, roadmap, and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The roadmap shows both credible iteration and a tendency toward ambitious headline numbers. SFC480
              established a 2022 fast-charging baseline, 2023 materials pushed flash charging into prismatic and
              cylindrical formats, CIBF 2024 formalized 6C Flash Charging Battery 3.0, and the 2025 milestones page
              moved the narrative to 12C Flash Charging Battery 4.0. In April 2026, Sunwoda raised the headline again
              with the 15C Xingchi 2.0 disclosure, but third-party coverage also noted that the figure is peak rather
              than full-process average and that no public series application was named. That nuance matters when
              comparing Sunwoda with peers. Public BYD, CATL, and SVOLT materials show the sector converging on
              ultra-fast charging as a moat, so Sunwoda is competing in a crowded technology race rather than an
              uncontested niche. On solid-state batteries, Sunwoda's 400 Wh/kg narrative and 0.2 GWh pilot-line plan
              imply genuine progress, yet public scale still looks earlier than Gotion's industrialized Volkswagen cell
              program and closer to pilot-stage efforts such as EVE's 2026 rollout. Sunwoda's differentiation is
              therefore breadth, integration, patents, and manufacturing know-how, while its biggest product diligence
              questions are commercialization timing and field proof for the newest platforms.
