  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Another valuation reset
        - Next disclosed financing below the current 25bn pre-money mark
        - Confirms the current round was not the floor and weakens any fair-value defense
        - Reset base case lower and avoid adding capital
      - - No IPO financing progress
        - No disclosed timetable, price range, or material update through the next financing cycle
        - Suggests capital-market optionality is weaker than assumed
        - Move stance from track to avoid unless entry terms improve
      - - No margin repair
        - EV gross margin stays around low single digits through another reporting cycle
        - Shows volume growth is not translating into usable economics
        - Treat the private mark as too full for the risk
      - - Supplier-payment stress persists
        - Evidence of delayed payments or new working-capital interventions despite the 60-day pledge
        - Signals ongoing cash conversion strain
        - Require stronger downside protection or step away
      - - New quality-liability shock
        - Another material warranty or settlement charge tied to EV batteries
        - Hits both credibility and cash needs at once
        - Re-underwrite the business on a lower multiple
    notes: >-
      Kill triggers focus on observable events that can be monitored from public filings, market-data services, or
      financing disclosures rather than on unobservable management narratives.
