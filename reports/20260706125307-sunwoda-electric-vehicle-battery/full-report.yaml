      - number: '7.4'
        title: Financial, market, customer, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The financial and dependency picture is where individual risks start to reinforce each other. In public
              filings, Sunwoda still showed meaningful customer concentration even after some improvement, and it
              explicitly warned that customer contracts are typically not long-term. That means new wins like Tesla
              export supply diversify the roster but do not eliminate exposure to procurement repricing or volume
              reallocation. At the industry level, adverse signals are persistent: China’s regulators convened leading
              battery firms including Sunwoda over below-cost competition, CRU described structural overcapacity,
              Reuters reported supplier cash-flow strain severe enough to trigger 60-day payment pledges, and S&P
              highlighted how China-linked battery exports remain exposed to volatile US trade actions. Against that
              backdrop, Sunwoda’s own 2025 annual-report ratios showed rising leverage, weaker liquidity, negative
              profit after deducting non-recurring items, and very low interest coverage. External reporting then argued
              that the EV-battery business itself was still loss-making or at least much lower margin than the
              consumer-battery segment, making the planned Hong Kong IPO more than a simple growth option. In
              transmission terms, price wars compress margin, weak margin raises financing dependence, financing
              dependence raises sensitivity to IPO timing and state support, and any fresh quality event makes customers
              and capital providers more cautious at the same time.
