      - number: '8.3'
        title: Peer comparison and multiple read-through
        blocks:
          - type: paragraph
            body: >-
              Public comps argue against treating the current private mark as an obvious bargain. CATL still commands a
              premium multiple near 4x sales because it pairs scale leadership with profitability and capital-market
              depth. EVE screens around 2x, while BYD and Gotion sit much closer to 1.1x, and CALB is even cheaper on
              Yahoo and MarketCapOf read-throughs. Sunwoda EVB at roughly 1.3x trailing sales therefore lands in an
              awkward middle ground. It is above several listed second-tier peers, below the stronger premium names, and
              backed by much less standalone disclosure than any of them. That does not make the price irrational: the
              unit has meaningful OEM relationships, a widening overseas footprint, and a parent with a stronger
              consumer-battery franchise. But it does mean investors are paying close to public second-tier territory
              without public-second-tier transparency. The right conclusion is not that Sunwoda must trade at the bottom
              of the peer set, but that current pricing already assumes the business deserves something better than
              CALB-or-Gotion treatment. That assumption needs more proof than is currently available in public.
            claimRefs:
              - CV003
