        title: Key Milestones and Current Scale
        blocks:
          - type: paragraph
            body: >
              Sunwoda EVB has achieved significant scale, generating revenue of CNY 15.14 billion (~$2.1B) in 2024 and
              CNY 18.91 billion (~$2.6B) in 2025, representing 24.9% year-over-year growth. The EV battery segment
              accounted for approximately 27% of parent revenue in 2024 and 30% in 2025, demonstrating its increasing
              importance within the group.


              The company holds approximately 3.2% of China's EV battery market by installations (2025 full year) and
              2.5% of the global market (Q1 2026). It supplies 8 of the top 10 global NEV manufacturers. Key milestones
              include entering Tesla's supply chain in 2026, winning the NIO Firefly battery contract in 2025, settling
              the Geely/VREMT quality lawsuit in February 2026 for CNY 608 million, and unveiling a 400 Wh/kg
              solid-state battery in October 2025.


              Overseas expansion has accelerated with $1.5 billion invested in Thailand battery plants (Phase I
              operational 2025, Phase II at 17.4 GWh planned) and $1.7 billion invested in a Hungary factory (first
              European plant, operational end-2025). The company's overseas revenue already represented 40.5% of total
              earnings in 2024.
