        - 2.6% global share in 2025; mid-single-digit China share in April lens
        - Commercial and passenger exposure including Xpeng plus global OEM relationships
        - Solid-state optionality and broader commercial-vehicle reach
        - Current solid-state output is still pilot-scale, not mass-market
      - - SVOLT
        - 2.5%-2.9% China share in Q1 and Jan-Feb 2026 lenses
        - Customer names not disclosed in reviewed fast-charge launch materials
