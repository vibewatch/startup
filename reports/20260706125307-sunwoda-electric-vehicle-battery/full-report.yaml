  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Sunwoda's public product surface reads less like a single battery SKU catalog and more like an OEM
              delivery workflow. The company says it covers battery cells, modules, BMS, and PACK systems, while its
              solutions page also exposes cell, module, PACK, BMS, and stationary-storage testing capabilities. In
              practice that means a vehicle or vessel customer can start with chemistry and duty-cycle matching, move
              into system integration, validate the pack against performance and safety requirements, and then extend
              the relationship into lifecycle traceability. The visible product map spans passenger-EV fast-charging
              batteries, hybrid batteries, energy-storage cells, marine systems, and light-electric-mobility batteries,
              so the workflow varies by scenario but the system logic is similar: Sunwoda tries to own the path from
              cell design through pack delivery and quality proof. Historical launch materials also show a clear
              charging-speed roadmap from SFC480 to flash-charging 1.0 Plus, 6C Flash Charging Battery 3.0, and the 2026
              Xingchi 2.0 announcement. What remains thinner in public evidence is named series-vehicle deployment for
              the newest 15C platform, so the operating story is stronger than the publicly disclosed SOP list.
