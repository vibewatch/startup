        - >-
          Largest scale, wide chemistry coverage, strongest external channel diversity, fast Shenxing / sodium-ion
          response
        - Size invites pricing scrutiny; not immune to domestic overcapacity
      - - BYD / FinDreams
        - 17%-21% China share; 58% of April 2026 volume still captive to BYD
        - Internal BYD ecosystem plus selective external wins such as Tesla storage
        - Vertical integration, captive demand, Blade 2.0 plus charging-network rollout
        - External share is less diversified; much strength comes from parent OEM ownership
      - - CALB
        - About 5%-6% China share; third or fourth in some monthly tables
        - Mixed passenger and commercial base including GAC-Toyota, Xpeng, Leapmotor, and SinoTruk
        - European localization via 15 GWh Portugal plant
        - Less public product differentiation than CATL or BYD; still a second-tier seller
