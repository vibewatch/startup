      - number: '3.3'
        title: Pricing, Packaging, and Switching Power
        blocks:
          - type: paragraph
            body: >-
              The public evidence says the market is being won through commercial structure as much as through
              chemistry. Tesla’s Sunwoda award matters because it was not a standard copy of the incumbent model: Tesla
              is buying cells directly from Sunwoda and assembling modules and packs itself, whereas the prior CATL
              relationship included more packaged supply. That shift pushes value toward the OEM and turns external cell
              vendors into more interchangeable inputs unless they can still differentiate on service or performance.
              CnEVPost explicitly tied Sunwoda’s win to competitive pricing and premium service, while Tesla’s margin
              pressure explains why another Chinese supplier became attractive. BYD’s FinDreams illustrates the opposite
              commercial logic: it can accept aggressive external pricing because 58% of its April 2026 volume still sat
              inside BYD’s own vehicle ecosystem, and a Tesla storage order was reportedly won at a near-cost price.
              Gasgoo’s pack and BMS rankings show the substitute threat is real: automakers including Tesla, Leapmotor,
              and Changan already appear as meaningful internal players in adjacent layers of the battery stack. In
              other words, Sunwoda does not only face other cell makers; it also faces OEM efforts to keep more
              integration margin in-house.
            claimRefs:
              - CP006
