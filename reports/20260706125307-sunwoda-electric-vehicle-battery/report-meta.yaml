companyProfile:
  summary: "Sunwoda Electric Vehicle Battery Co., Ltd. is a private Chinese EV battery manufacturer headquartered in Shenzhen, operating as a separately capitalized subsidiary of listed Sunwoda Electronic Co., Ltd. (SZSE: 300207). Founded around 2014-2015, the EVB unit produces lithium-ion battery cells, modules, and packs for electric vehicles and energy storage systems. It supplies 8 of the top 10 global NEV manufacturers including Tesla, NIO, Volkswagen, Li Auto, and XPeng. The company generated CNY 18.91 billion in revenue in 2025 (+24.9% YoY) and holds 3.2% of China's EV battery market. It is pursuing an independent Hong Kong IPO and has invested over $3 billion in overseas manufacturing facilities in Thailand and Hungary."
