  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: qualification-stickiness
    missingEvidence: OEM qualification scorecards, defect ppm data, field-failure rates, and requalification timelines by supplier.
    whyItMatters: Switching costs and moat durability depend on whether approvals are genuinely sticky or can be reopened after small price cuts.
    diligencePath: Request PPAP / validation summaries from Sunwoda and at least two OEMs, plus recall or warranty dashboards by platform.
    relatedQuestionRefs:
    - QP019
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: contracted-overseas-demand
    missingEvidence: Customer-by-customer contracted volume, take-or-pay commitments, and reserved capacity for Sunwoda, CALB, and Gotion overseas plants.
    whyItMatters: Overseas localization only improves moat if capacity is already tied to demand rather than speculative expansion.
    diligencePath: Ask for plant-level nomination letters, long-term supply agreements, or lender diligence packs for Thailand, Hungary, Portugal, and Hefei exports.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ASPs, rebate schedules, indexation clauses, and gross margins by OEM platform across Sunwoda and peer contracts.
    whyItMatters: Without customer-level pricing economics, it is impossible to separate healthy share gains from uneconomic volume bought with discounts.
    diligencePath: Request customer contract excerpts, management-accounts bridge by platform, or banker materials used in the Hong Kong IPO process.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
    - TP004
