tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Current scale signal
  - Customer / channel anchor
  - Differentiation
  - Limitation
  rows:
  - - Sunwoda
    - 10th globally in 2024; ~2%-3% China share in 2026 snapshots
    - Named supplier to Li Auto, XPeng, Leapmotor, GAC, SAIC, Renault, Nissan, plus recent Volvo / VW appointments
    - Broad chemistry and form-factor menu; service-heavy wedge; consumer battery cash support
    - No scale moat; still competing from the second tier and exposed to price-led awards
  - - CATL
    - 46%-50% China share across 2026 snapshots; 81.6% ternary share in Q1 2026
    - Diversified across Geely, Changan, Xiaomi, Li Auto, Nio and many others
    - Largest scale, wide chemistry coverage, strongest external channel diversity, fast Shenxing / sodium-ion response
    - Size invites pricing scrutiny; not immune to domestic overcapacity
  - - BYD / FinDreams
    - 17%-21% China share; 58% of April 2026 volume still captive to BYD
    - Internal BYD ecosystem plus selective external wins such as Tesla storage
    - Vertical integration, captive demand, Blade 2.0 plus charging-network rollout
    - External share is less diversified; much strength comes from parent OEM ownership
  - - CALB
    - About 5%-6% China share; third or fourth in some monthly tables
    - Mixed passenger and commercial base including GAC-Toyota, Xpeng, Leapmotor, and SinoTruk
    - European localization via 15 GWh Portugal plant
    - Less public product differentiation than CATL or BYD; still a second-tier seller
  - - Gotion
    - About 4%-6% China share; 20 GWh unified-cell line for VW
    - Volkswagen standard-cell contract plus broad China platform exposure
    - Full-chain integration claim and strong Europe-facing standard-cell story
    - Still far smaller than CATL / BYD in domestic installed share
  - - EVE Energy
    - 2.6% global share in 2025; mid-single-digit China share in April lens
    - Commercial and passenger exposure including Xpeng plus global OEM relationships
    - Solid-state optionality and broader commercial-vehicle reach
    - Current solid-state output is still pilot-scale, not mass-market
  - - SVOLT
    - 2.5%-2.9% China share in Q1 and Jan-Feb 2026 lenses
    - Customer names not disclosed in reviewed fast-charge launch materials
    - Fast-charge pulse method, 800V short-blade packs, semi-solid roadmap
    - Lower public distribution proof than Sunwoda, CATL, BYD, or Gotion
  - - Internal build / OEM captive substitutes
    - Meaningful pack and BMS positions held by Tesla, Leapmotor, Changan, and others
    - Used where OEMs want tighter control of integration and cost
    - Removes external supplier margin layers and raises switching leverage over cell vendors
    - Mostly available only to large OEMs with enough engineering scale
  notes: Scale signals mix monthly China-share snapshots, 2024 global rank, and disclosed contract or plant milestones; rows emphasize the closest competitive lens rather than every possible adjacency.
