- id: capability-and-customer-comparison
  title: Capability and Customer Comparison
  body: Sunwoda is more credible than a pure low-end filler because its public product scope is broad and its OEM list is real. The filing says the company supports ternary and LFP chemistries, three cell form factors, and all major passenger-EV architectures from BEV to hybrid. It also disclosed an 8C hybrid battery and a soft solid-state roadmap item, which matters because the leading incumbents are also pushing hard on charging speed and next-generation chemistries. CATL’s Shenxing 2.0 and sodium-ion Naxtra launches show that the market leader is not standing still. BYD’s Blade 2.0 split into short-blade and long-blade variants, plus its charging-network buildout, shows the number-two player can pair battery architecture with vehicle and infrastructure deployment. Gotion is deepening the standard-cell path through Volkswagen, EVE is advancing solid-state optionality, CALB is localizing in Europe, and SVOLT is pitching fast-charge and semi-solid upgrades. Relative to that field, Sunwoda’s
    best factual strengths are breadth, named customer access, and service intensity rather than a uniquely public technology lead.
