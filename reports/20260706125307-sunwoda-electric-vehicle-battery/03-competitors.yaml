- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Supporting evidence
  - Threat
  - Severity
  - Diligence ask
  rows:
  - - Consumer-battery cash engine
    - Sunwoda remains profitable at group level while EV peers often are not
    - Cash support can fade if EV losses persist or overseas capex accelerates
    - Medium
    - Obtain segment cash-flow and capex bridge for EVB versus consumer batteries
  - - Broad chemistry and form-factor menu
    - Sunwoda discloses ternary, LFP, three form factors, and multiple vehicle architectures
    - Incumbents are also broad and are moving faster on public charging-performance marketing
    - Medium
    - Request customer win-loss records by chemistry and vehicle architecture
  - - OEM coverage and service wedge
    - Eight-of-top-ten NEV coverage plus Tesla win tied to service and pricing
    - Coverage does not guarantee pricing power if customers multi-source aggressively
    - High
    - Ask for revenue split, re-bid rates, and engineering headcount stationed at top OEMs
  - - Price-war commoditization
    - Reuters and Bamboo Works both describe margin pressure and brutal price wars
    - Second-tier share gains may be uneconomic volume bought with discounts
    - Critical
    - Review customer-level ASP waterfalls and rebate clauses
  - - Incumbent technology response
    - CATL Shenxing / sodium-ion and BYD Blade 2.0 / FLASH charging are already public
    - Sunwoda may not hold a durable public technology narrative
    - High
    - Compare product roadmaps, SOP dates, and customer nominations by chemistry
  - - Internal-build substitution
    - Tesla cell-only sourcing plus pack/BMS rankings show OEMs keeping more integration in-house
    - Suppliers can lose pack-margin layers even when cell volume is retained
    - High
    - 'Map OEM insourcing by layer: cells, modules, packs, BMS, and drive systems'
  - - Localization race
    - Gotion and CALB have clearer Europe-facing localization proof in the reviewed set
    - Regionalization and tariffs could favor rivals with earlier localized contracts
    - Medium
    - Verify committed customer volumes for Thailand, Hungary, Portugal, and VW-linked exports
  - - Execution and quality risk
    - Sunwoda is later than CATL, and its EV business is still loss-making despite growth
    - Any quality event or delayed ramp could erase the service-led wedge quickly
    - High
    - Review warranty reserves, claims history, and qualification attrition by OEM program
  notes: Severity reflects underwriting impact on moat durability rather than probability alone. The register mixes offensive moats and disconfirming evidence because this market is currently defined by both.
