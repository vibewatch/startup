- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Rival / model
  - Public price signal
  - Packaging / contract model
  - Leverage signal
  - Implication
  rows:
  - - Sunwoda
    - Exact price undisclosed; described as “highly competitive pricing”
    - Tesla cell-only award; OEM assembles downstream pack
    - Won slot with price plus premium service while Tesla sought leverage
    - Useful wedge for entry, but pushes Sunwoda toward a more interchangeable cell-supplier role unless service or performance stays differentiated
  - - CATL
    - Exact price undisclosed
    - Incumbent module and cell supplier across broad OEM set
    - Largest share and broadest customer diversity in reviewed set
    - Scale gives CATL bargaining power and learning-curve advantages even if it must respond on price
  - - BYD / FinDreams
    - Reportedly gave Tesla the “best price,” close to cost line
    - Mostly captive internal demand plus selective external and storage contracts
    - 58% captive share means BYD can sustain aggressive external pricing more easily than pure independents
    - External bids can be used offensively because the parent OEM helps absorb utilization risk
  - - Gotion
    - Exact price undisclosed
    - Standardized unified-cell supply to Volkswagen from 2026 to 2032
    - Standard-cell architecture lowers integration friction for a large OEM customer
    - Multi-year platform awards matter more than spot price headlines if they lock future volume
  - - EVE
    - No reviewed public EV price disclosure; solid-state pricing undisclosed
    - Commercial and passenger programs plus early solid-state pilot line
    - Technology optionality is public, but current EV solid-state scale is tiny
    - Optionality may help in future bids, but it is not yet a near-term price or volume moat
  - - Internal build / OEM pack assembly
    - No external transfer price disclosed
    - OEM buys cells or controls pack / BMS internally
    - Eliminates some supplier margin layers and increases negotiation leverage over external cell vendors
    - As more OEMs internalize pack layers, external suppliers may be pushed toward lower-value, cell-only roles
  notes: The reviewed public record contains very little transparent list pricing; the table therefore compares commercial structure, disclosed pricing signals, and where value capture is likely to sit.
