- id: growth-drivers-and-constraints
  title: Growth Drivers and Constraints
  body: |-
    Demand drivers remain real. Regulatory pressure still supports electrification, lower battery costs continue to widen the reachable mass market, and ESS is emerging as a second engine of battery demand. China-focused analysts also expect both EV and storage growth to support battery demand in 2025-2026, with utility-scale “energy shifting” carrying a large share of storage demand. These forces explain why the category is still growing even after a slower Q1 2026 global usage growth rate than the prior full year.

    The constraints, however, are structural rather than cyclical noise. China’s battery sector still sits on material overcapacity, and regulators are openly warning against below-cost selling and disorderly capacity build-out. That dynamic pressures margins and tends to favor the best-capitalized players. Export economics are also getting harder. US tariffs already raise the cost of Chinese battery imports, while Europe’s battery regulation adds carbon-footprint declarations, labelling, QR-code, and passport obligations in 2026-2027. For Sunwoda, those constraints matter as much as raw TAM growth because they directly affect qualification cost, compliance spend, and the margin available on overseas expansion.
