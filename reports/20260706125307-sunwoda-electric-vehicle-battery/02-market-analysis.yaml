  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - ZEV mandates and tighter CO2 rules
    - Driver
    - Current / ongoing
    - Sustain EV demand visibility and platform electrification roadmaps
    - Which end-markets still have regulatory pull after subsidy changes?
  - - Lower LFP and NMC cell costs
    - Driver
    - Current / ongoing
    - Improve affordability for mass-market EV programs
    - How much of Sunwoda’s share opportunity depends on LFP cost leadership?
  - - ESS deployment growth
    - Driver
    - Near-term 2026-2030
    - Creates a second demand outlet for battery factories and LFP-heavy lines
    - What share of Sunwoda’s pipeline is auto vs. storage?
  - - China EV + ESS demand resilience
    - Driver
    - Near-term 2025-2026
    - Supports utilization even if export demand weakens
    - Can domestic demand absorb enough capacity to protect margins?
  - - Chinese overcapacity
    - Constraint
    - Current / ongoing
    - Keeps pricing pressure high and favors scale leaders
    - What utilization and margin level can Sunwoda sustain in a weak-price market?
  - - Below-cost price wars
    - Constraint
    - Current / ongoing
    - Undercuts profitability and increases consolidation pressure
    - Is Sunwoda winning business on product merit or on price concessions?
  - - US tariff escalation
    - Constraint
    - Current / ongoing
    - Raises landed cost for Chinese battery imports and pushes localization
    - Which Sunwoda programs remain exposed to direct China-origin content?
  - - EU battery passport and carbon-footprint rules
    - Constraint
    - 2026-2027 ramp
    - Adds compliance cost, data burden, and procurement gating for exports
    - How ready is Sunwoda’s traceability and carbon-accounting stack for EU buyers?
  notes: 'Several factors are double-edged: falling costs and strong demand help adoption, but overcapacity and compliance burdens determine whether suppliers capture that demand profitably.'
