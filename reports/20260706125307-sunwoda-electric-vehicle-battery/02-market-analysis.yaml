company:
  name: Sunwoda Electric Vehicle Battery Co., Ltd.
chapter:
  number: 2
  title: Market Analysis
  summary: 'Sunwoda sells into a large but definition-sensitive EV battery market: public 2026 global estimates range from roughly $86.5B to $107.6B, China installed 769.7 GWh in 2025 with LFP at 81.2%, and Chinese suppliers still control about 71-72% of global share in 2026. The key investment question is less whether demand exists than whether Sunwoda can win profitable share through concentration, price-war, tariff, and battery-passport friction while using ESS as a complementary outlet.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Adjacent Pools
  body: |-
    Sunwoda’s relevant market is the EV traction-battery stack: cells, modules, and packs that are designed into BEV, PHEV, and HEV vehicle platforms. That core lens is narrower than “all batteries,” because it excludes consumer electronics, most stationary-storage project revenue, and upstream mining or refining revenue that sits before the cell-maker in the value chain. It is also narrower than some pack-market estimates that embed broader integration scope. The distinction matters because Sunwoda sells into a qualification-heavy automotive procurement process, not every battery-adjacent dollar of demand.

    At the same time, the chapter cannot ignore adjacency. Battery storage is now the fastest-growing power technology, and Chinese battery makers increasingly use ESS as a second outlet for capacity, especially for LFP chemistries that have already become dominant in China’s EV market. For buyers, the status-quo substitutes are not only rival cell suppliers; they also include incumbent internal-combustion platforms, in-house battery programs, and captive or partnership-based sourcing arrangements that reduce the role available to an independent supplier.
