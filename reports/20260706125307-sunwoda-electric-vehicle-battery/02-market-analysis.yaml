  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sunwoda-sam-som
    missingEvidence: Public disclosure that splits Sunwoda battery revenue, capacity, and wins by geography, chemistry, and customer segment.
    whyItMatters: Without that split, the chapter can show only observable market-share snapshots rather than a clean company-specific SAM or SOM.
    diligencePath: Request management or IPO-filing detail on EV vs. ESS mix, customer concentration, and booked capacity by region.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: material
    topic: china-2026-forecast
    missingEvidence: A directly citable open-source 2026 China EV battery forecast for installed GWh or market revenue using a clearly stated methodology.
    whyItMatters: The chapter can size the realized market in 2025 but cannot cleanly extend that into a valuation-grade 2026 domestic forecast without relying on rough or proprietary lenses.
    diligencePath: Source CABIA-aligned forecast material, a bank research note, or an OEM-facing industry forecast that publishes the 2026 base case openly.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: material
    topic: market-size-scope
    missingEvidence: Scope-normalized reconciliation across EV-battery, battery-pack, and broader battery-ecosystem market reports.
    whyItMatters: Headline TAM numbers differ by tens of billions of dollars depending on whether the provider measures cells, packs, or a wider revenue stack, which affects valuation framing.
    diligencePath: Obtain the paid methodology sections from Fortune, MarketsandMarkets, Research and Markets, and Mordor and normalize them to the same boundary.
  - type: private-evidence-only
    severity: minor
    topic: qualification-cycle
    missingEvidence: Program-level evidence on qualification timing, rejection rates, and pricing concessions for Sunwoda at named OEMs or storage customers.
    whyItMatters: Public sourcing-model evidence shows the structure of buying decisions, but not Sunwoda’s actual win-rate or gross-margin trade-offs inside the funnel.
    diligencePath: Request customer case studies, program timelines, and cohort win/loss data during diligence.
