- id: buyers-and-procurement
  title: Buyer Segmentation, Budget Ownership, and Adoption Path
  body: |-
    Buyer structure in EV batteries is not a simple one-line sales motion. OEMs choose among in-house, partnership, system-integration, and outsourcing models, and the choice varies by product segment, performance target, and appetite for vertical control. Premium programs usually tolerate higher cost to protect range and performance, while mass-market platforms optimize harder for affordability and chemistry pragmatism. That means the commercial buyer is typically a cross-functional group: procurement and supply-chain teams own commercial negotiations, engineering and platform teams own qualification, and manufacturing teams own ramp-readiness.

    For Sunwoda, that buying motion is further complicated by the fact that automotive is not the only downstream pool. Utility-scale storage developers, charging-site operators, and integrators form a separate adjacent demand base, and they care about cycling profile, duration, safety, and delivered system economics more than vehicle-brand positioning. Across both auto and storage, the adoption path runs through qualification, pilot validation, platform or project nomination, and then repeat volume—creating long sales cycles that reward scale, trust, and incumbent relationships.
