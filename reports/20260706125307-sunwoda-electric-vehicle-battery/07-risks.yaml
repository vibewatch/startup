- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Regulatory risk is not limited to obtaining a simple plant permit. For Europe, the governing problem is that Regulation (EU) 2023/1542 progressively raises the burden across carbon-footprint disclosure, due diligence, recycled content, traceability, and the digital battery passport. Sunwoda has responded with public battery-passport, traceability, and GBA-pilot messaging, but its own materials still describe pilots, staged data onboarding, and June 2026 lifecycle validation milestones, which implies execution risk remains live. For overseas manufacturing, Hungary is not just a construction story; the European Commission explicitly approved the project under state-aid rules and said the investment likely would not proceed in the EU without the package. Thailand likewise approved a large cell investment, which is positive for growth but confirms dependence on host-country policy and localization execution. The legal surface is also broader than the EV-battery lawsuit itself. Sunwoda’s
    Hong Kong filing disclosed title-certificate defects on owned and leased properties, and the Geely/VREMT quality dispute shows how a commercial sales-contract claim can quickly escalate into court-accepted litigation, profit impact, and downstream recall scrutiny. These are manageable risks, but only with evidence that compliance systems, facility documentation, and customer warranty governance are stronger than the current public record proves.
