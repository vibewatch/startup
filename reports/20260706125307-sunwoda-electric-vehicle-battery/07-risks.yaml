  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: battery-passport-execution
    missingEvidence: Named-customer acceptance letters, independent audit output, and completed June 2026 validation evidence for Sunwoda's battery-passport deployment were not available in public sources.
    whyItMatters: Without third-party acceptance evidence, investors cannot tell whether the compliance stack is production-ready for revenue-bearing European programs or still mainly a pilot narrative.
    diligencePath: Request customer qualification records, assurance reports, and program-level go-live evidence for Europe-facing products.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: recall-risk
    missingEvidence: A full official recall dossier or audited replacement-cost bridge tying the VREMT dispute, Zeekr replacement activity, and any Volvo-market recall exposure to booked reserves was not found in retained sources.
    whyItMatters: The settlement headline proves cost, but investors still need to know whether future warranty or recall liabilities could remain open beyond what was reserved in 2025.
    diligencePath: Request warranty-reserve methodology, customer settlement annexes, recall correspondence, and post-settlement field-quality dashboards.
    relatedQuestionRefs:
    - QR020
  - type: stale
    severity: material
    topic: ipo-dependency
    missingEvidence: Public reporting still does not show exact 2026 Hong Kong IPO size, timing, valuation range, or contingency financing if market conditions deteriorate.
    whyItMatters: Sunwoda is expanding abroad during a stressed pricing environment, so financing timing can directly affect capex pacing, dilution, and risk tolerance.
    diligencePath: Monitor updated prospectus filings, underwriter materials, and management disclosures on alternative funding plans.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: material
    topic: overseas-ramp-risk
    missingEvidence: Public sources do not disclose OEM-by-OEM committed utilization, pricing, or start-of-production volumes for the Hungary and Thailand projects.
    whyItMatters: Without named-customer volume backing, investors cannot separate strategic optionality from true de-risked overseas capacity demand.
    diligencePath: Request customer nomination letters, SOP schedules, utilization bridges, and site-level business cases under NDA.
    relatedQuestionRefs:
    - QR029
