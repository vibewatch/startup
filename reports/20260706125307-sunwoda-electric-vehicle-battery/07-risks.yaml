- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Quality relapse after Geely/VREMT
    - New lawsuit, recall, or major OEM field campaign
    - Any new top-tier OEM quality dispute over battery cells or packs
    - Pause commitment or re-underwrite warranty reserves, customer trust, and volume continuity.
  - - EU compliance slippage
    - Battery-passport or due-diligence milestone misses
    - Pilot completion slips beyond 2026 or named customer acceptance cannot be shown
    - Treat Europe-facing growth assumptions as impaired until audited proof exists.
  - - Overseas ramp slippage
    - Hungary or Thailand commissioning misses
    - Material delay to SOP or utilization ramp relative to management plan
    - Cut growth assumptions and increase capex contingency.
  - - Financing stress during price wars
    - IPO delay plus weak balance-sheet metrics
    - HK listing slips materially while leverage stays elevated and adjusted profit remains negative
    - Require alternative funding proof or slow deployment pace.
  - - Industry margin collapse
    - New regulator warnings or worsening payment stress
    - Below-cost competition persists and supplier-cycle strain worsens despite 60-day pledges
    - Assume deeper margin compression and avoid valuing EV-battery growth on headline shipments alone.
  notes: Kill criteria are designed to be externally monitorable from filings, regulator releases, project updates, and major customer or recall news rather than from private monthly dashboards.
