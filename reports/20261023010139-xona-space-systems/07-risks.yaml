      - ["Radio-navigation policy and sovereign GNSS dependence", "United States and international", "Commercial signal designed to operate alongside GPS and other sovereign systems", "medium", "high", "Xona positions Pulsar as complementary to legacy infrastructure", "Cross-border licensing and policy acceptance remain unverified", "Map country-by-country spectrum and market-access requirements before commercial expansion"]
      - ["Export-control and security-clearance constraints", "United States, Canada, and United Kingdom", "Employment material states eligibility and clearance requirements by jurisdiction", "medium", "medium", "Role controls reference ITAR, Controlled Goods, and UK security clearance processes", "Company-wide licensing posture and customer restrictions are not established", "Request export-control classification, controlled-technology procedures, and government-customer compliance review"]
      - ["Litigation, enforcement, and IP disputes", "Not established", "No case or enforcement record was identified in the assigned evidence", "unknown", "medium", "No public mitigation evidence in the assigned pool", "Absence of a recorded case is not proof of absence", "Run a legal docket, IP ownership, freedom-to-operate, and indemnity review"]
    notes: Public web evidence is partial and mixes a reported FCC milestone with company and third-party summaries; unknown means the retained pool did not establish the status, not that no issue exists.
    enumerationScope:
      coverage: partial
      basis: Publicly accessible regulatory and legal evidence retained for Xona as of the 2026-10-23 run date
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR013, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Scaling from demonstrator to multi-satellite service", "high", "high", "Factory and deployment plan are reported; test role describes structured integration and environmental campaigns", "Production yield and fleet availability are unverified", "Obtain launch manifests, production throughput, yield, anomaly, and availability data"]
      - ["Launch or early-orbit failure", "medium", "high", "Six additional satellites are reported as beginning deployment", "A partial deployment could delay service and consume capital", "Review launch-provider contract, insurance, replacement plan, and on-orbit acceptance criteria"]
      - ["Flight-software fault, update, or recovery failure", "medium", "high", "Test procedures cover off-nominal scenarios, safing, recovery, telemetry, and dashboards", "Actual defect escape and recovery metrics are unavailable", "Review verification coverage, change control, incident history, and signed flight-readiness evidence"]
      - ["Spoofing, jamming, or cryptographic-key compromise", "medium", "high", "Claimed cryptographic watermark and stronger LEO signals are reported", "Key-management design and independent security testing are not disclosed", "Obtain threat model, key lifecycle controls, penetration-test scope, and incident-response plan"]
    notes: The register distinguishes described controls from demonstrated outcomes; likelihood and severity are analytical ratings anchored to the documented failure modes and the absence of operating metrics is retained as a gap.
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Residual severity]
    rows:
      - ["Launch access", "SpaceX and launch ecosystem", "Delay or failed launch slows constellation deployment and customer-service timing", "high", "Multiple spacecraft are planned and the company reports a production/deployment program", "Contract terms, manifest priority, insurance, and replacement cadence are not public", "high"]
      - ["Spectrum and regulatory approval", "FCC and other national regulators", "Additional conditions or jurisdictional limits constrain service footprint", "high", "Full-constellation authorization is reported and coexistence was part of the approval case", "Authorization scope outside the reported US milestone is unverified", "high"]
      - ["Receiver and industrial integration", "Existing receiver and industrial partners", "Slow firmware adoption or integration friction limits the addressable installed base", "medium", "Sources report backwards-compatible or software/firmware-updatable receiver integration and industrial applications", "Paid contracts, conversion rates, and support obligations are not disclosed", "medium"]
      - ["Venture financing and strategic investors", "Future Ventures and other investors", "Capital-market tightening forces a down round or slows manufacturing", "high", "Public financing announcements and investor participation are reported", "Cash balance, burn, runway, and covenants are unavailable", "high"]
    notes: Counterparties are identified only where the retained sources name a role or investor; commercial dependence and concentration are not quantified.
    claimRefs: [CR009, CR010, CR011, CR012, CR015, CR016]
