callouts:
  - calloutType: risk
    title: The scale-up is the investment-critical risk
    body: Xona has reported authorization and additional satellite deployment, but the retained evidence does not establish repeatable production yield, constellation availability, cash runway, or contracted service revenue.
    claimRefs: [CR005, CR006, CR009, CR012, CR015, CR016]
  - calloutType: assumption
    title: Public absence is not a clean bill of health
    body: No litigation, enforcement, outage, or customer-concentration record was established by this assigned pool; these are diligence gaps rather than findings that such events do not exist.
    claimRefs: [CR004, CR012]
