chapter:
  number: 7
  title: Risks
  summary: "Xona has obtained reported FCC authorization for a large commercial LEO navigation constellation, but its principal risks are now executional: scaling spacecraft manufacturing and service operations, securing spectrum coexistence and cyber controls, and financing a capital-intensive deployment. Public sources do not establish operating reliability, customer concentration, or cash runway, so those remain diligence gaps rather than quantified conclusions."
sections:
  - id: regulatory-and-legal
    title: Regulatory, spectrum, and legal exposure
    body: Xona's reported FCC authorization is a meaningful regulatory milestone, but it is not equivalent to proof that a full constellation will operate without interference, policy constraints, or future compliance work. A syndicated company announcement on SatNews says that authorization covers a planned network of more than 250 satellites and adjacent L-band operation, while also describing scrutiny around harmful interference to aviation, defense, and commercial GPS users. The same announcement says Pulsar-0 completed more than 350 transmission passes; this company-issued evidence does not establish fleet-wide performance. J16 Finance lists four Form D filings from 2022 through 2026, but its aggregator page does not provide the full legal record. Defence Finance Monitor says its paid analysis addresses capability gaps and dependencies, while the public page withholds the underlying conclusions. The assigned pool therefore does not establish license conditions, enforcement history, litigation, environmental review, or the full export-control posture. Regulatory permission lowers one gating risk while leaving continuing spectrum, safety, and jurisdictional diligence necessary.
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR013, CR014]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-and-cyber
    title: Deployment, reliability, and cyber execution
    body: The transition from a demonstrator to a continuously operated constellation is the central operational risk. Xona's own financing announcement says that building hundreds of spacecraft, operating a global network, and delivering reliable service to billions of potential users is an entirely different challenge from proving an architecture on orbit. It also says six additional satellites have begun deployment, with four intended to provide customer service in 2027 and two manufactured entirely in-house. A flight-software test-engineer posting describes testing nominal and off-nominal scenarios, fault responses, safing, recovery, telemetry, and environmental campaigns, which is evidence of a serious verification process but not evidence that production reliability targets have been met. Cyber reporting identifies cryptographic watermark key management and software/firmware updates as security surfaces. Investors should therefore monitor launch cadence, on-orbit availability, fault recovery, update assurance, and independently verifiable service-level performance.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: capital-and-dependency
    title: Capital intensity, counterparties, and thesis-break triggers
    body: Public profiles show a financing model that depends on continued access to venture capital while the company builds satellites, a factory, and a global service. Dealroom reports a March 2026 Series C of $170 million at a $680 million valuation, while a separate August 2026 profile reports a $767.94 million post-money figure for that round; the differing labels and values require cap-table reconciliation. A later company announcement reports a $250 million Series D at a $2.45 billion valuation and more than $570 million of cumulative capital, but funding raised is not cash available. The company also says its Burlingame factory is operational and the new funding will accelerate manufacturing and deployment. Toyota Ventures' 2021 investor article framed operational scalability and the path to revenue and earnings as core diligence questions, which is historical partner evidence rather than independent proof that those questions have closed. Exact cash, burn, runway, customer contracts, supplier concentration, and insurance remain undisclosed. Thesis-break triggers include a material 2027 service slip, failed spectrum or security milestones, or financing that materially dilutes investors before recurring service revenue is demonstrated.
    claimRefs: [CR009, CR010, CR011, CR012, CR015, CR016]
    tableRefs: [TR003]
