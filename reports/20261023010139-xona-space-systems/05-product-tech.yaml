company:
  name: Xona Space Systems
chapter:
  number: 5
  title: Product & Technology
  summary: Xona is developing Pulsar, a low-Earth-orbit positioning, navigation, and timing service designed to augment or operate independently from legacy GNSS. The available evidence supports a technically ambitious satellite-and-software product with meaningful integration and cybersecurity dependencies, but public proof of operational scale, customer performance, and production maturity remains limited.
sections:
  - id: product-and-user-workflow
    title: Product and customer workflow
    body: >-
      Xona's product is a positioning, navigation, and timing service rather than a
      conventional end-user application. The company describes Pulsar as a robust,
      high-integrity service for defense, agriculture, telecom, transportation,
      infrastructure, maritime, aviation, financial systems, fleets, mining, and
      autonomous robotics. Its workflow is therefore signal delivery into existing
      receivers and downstream systems: the service must be acquired, authenticated,
      integrated into a device or platform, and converted into a location or timing
      decision. The official site claims centimeter-level certainty and backward
      compatibility, while external reporting describes software and firmware updates
      rather than dedicated receiver silicon. That lowers retrofit friction in theory,
      but the evidence does not establish realized accuracy, coverage, latency,
      service-level commitments, or customer production deployment.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: system-architecture
    title: System architecture and engineering model
    body: >-
      The disclosed architecture spans a space segment, a radio-navigation payload,
      embedded and flight software, ground or cloud services, and user receivers.
      FCC authorization reporting says the planned network contains more than 250
      LEO satellites and that Pulsar broadcasts in L-band alongside legacy GPS
      frequencies. The same account describes signal power up to 100 times stronger
      than traditional medium-Earth-orbit GPS broadcasts and a dynamic cryptographic
      watermark. Engineering recruiting material corroborates a cross-layer build:
      payload software must communicate with embedded software and the spacecraft bus,
      while integration testing runs across simulated and hardware-integrated
      environments. A separate flight-software test role describes requirements and
      interface-control-document driven procedures, hardware-in-the-loop and
      software-in-the-loop campaigns, telemetry validation, fault response, safe-mode,
      and recovery testing. These are credible architecture signals, but they are
      job requirements and company-issued descriptions, not independent verification
      of delivered system performance.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    figureRefs: [FE001]
  - id: maturity-deployment-and-differentiation
    title: Maturity, deployment, and differentiation
    body: >-
      The strongest maturity marker in the pool is regulatory and flight history
      rather than a published customer KPI. SatNews reports that the FCC granted
      full constellation authorization on August 3, 2026, and that the Pulsar-0
      demonstration satellite had completed more than 350 live transmission passes
      across four continents. The same report says Xona planned an initial block of
      six production-class spacecraft for October 2026. Cybernews independently
      repeats the six-satellite initial deployment and the more-than-250-satellite
      full-constellation plan, while Dealroom lists open roles spanning flight
      software, cloud architecture, cloud security, satellite harness, mechanical
      engineering, quality inspection, materials, and production operations. The
      differentiators are therefore a stronger LEO signal, cryptographic
      authentication, and backward-compatible receiver integration; the main gap is
      evidence that these capabilities have reached repeatable commercial service at
      constellation scale.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: [TE002]
  - id: trust-security-and-gaps
    title: Trust, security, and diligence gaps
    body: >-
      Pulsar's trust proposition is also its largest technical diligence surface.
      The reported cryptographic watermark is intended to resist spoofing, but
      Cybernews explicitly identifies key management and the watermark scheme as
      areas requiring security analysis. Software and firmware update compatibility
      expands addressable hardware, yet it also creates an update and supply-chain
      attack surface. Xona's flight-test role emphasizes fault-focused scenarios,
      limit monitoring, safe-mode entry, recovery logic, telemetry, logs, dashboards,
      and time-correlated test data, which indicates a serious verification model;
      it does not disclose pass rates, independent certification, incident history,
      or security-audit results. Export-control and security-clearance requirements
      in the recruiting material may constrain staffing and international deployment.
      Before underwriting product maturity, diligence should obtain receiver
      interoperability results, coverage and availability targets, key-management
      controls, independent penetration or spectrum testing, launch and commissioning
      evidence, and customer acceptance data.
    claimRefs: [CE014, CE015, CE016]
    tableRefs: [TE003]
