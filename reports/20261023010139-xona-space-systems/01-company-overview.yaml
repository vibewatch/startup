chapter:
  number: 1
  title: Company Overview
  summary: Xona Space Systems is a privately held Burlingame-area aerospace company founded in 2019 to commercialize Pulsar, a low-Earth-orbit positioning, navigation, and timing service. Public evidence shows a transition from demonstration hardware to regulated constellation deployment and large-scale manufacturing, but private-company scale metrics and the latest financing record are inconsistent across sources.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: >-
      Xona Space Systems is described by multiple sources as a privately held
      aerospace company founded in 2019 and headquartered in Burlingame,
      California. Its core product is Pulsar, a low-Earth-orbit positioning,
      navigation, and timing service intended to complement or provide a
      resilient alternative to legacy GPS/GNSS. The product thesis is
      infrastructure-led: encrypted, high-power signals are delivered from
      satellites and are intended to support autonomous vehicles, drones,
      defense, critical infrastructure, and other applications that need
      precise positioning or timing. The evidence supports an operating
      manufacturing and test footprint, including a Burlingame facility and
      international offices or team presence, but does not establish recurring
      revenue, commercial customer counts, or cash runway. Headcount is also
      unresolved: an August profile lists 41 employees, while Dealroom reports
      137 and a separate funding profile does not provide a current count.
      Those numbers should not be treated as interchangeable.
    claimRefs: [CO001, CO002, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The named leadership evidence identifies Brian Manning as co-founder and
      chief executive officer and Bryan Chan as co-founder. An investor
      account describes an eight-engineer founding group formed from Stanford's
      Aero and Astro community, with experience spanning SpaceX, Ford, Blue
      Origin, Maxar, BAE Systems, and the U.S. Air Force; that background is
      relevant to the company's engineering-heavy product, but it remains a
      company-aligned narrative rather than a complete independently verified
      executive register. Clay reports that Craft Ventures general partner Sky
      Dayton joined the board, providing one disclosed governance datapoint.
      No assigned source provides a complete board roster, voting control,
      option pool, succession plan, or key-person mitigation. The leadership
      record therefore supports strong founder-market fit and technical
      coverage, while leaving governance depth and dependence on the founding
      team as material diligence questions.
    claimRefs: [CO005, CO007]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and scale transition
    body: >-
      Xona's financing history is substantial but not cleanly reconciled by
      the assigned sources. The official Series A announcement records an
      oversubscribed $19 million round on May 8, 2024 led by Future Ventures
      and Seraphim Space. The company-aligned August profile records a $170
      million Series C on March 26, 2026 and a $767.94 million post-money
      valuation, alongside $209 million of total funding as of August. Clay
      independently reports at least $305 million across seven disclosed
      rounds through September 2026, while a later October 22 SatNews item
      reports a $250 million Series D at a $2.45 billion post-money valuation
      and cumulative funding of $570 million. These are different reporting
      snapshots and issuer relationships, not a basis for adding the numbers
      together. The latest financing, valuation, ownership, revenue, and cash
      availability should remain explicit diligence items until primary
      financing documentation is obtained.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-questions
    title: Milestones, regulatory progress, and unresolved diligence
    body: >-
      The milestone record shows a progression from an early demonstration
      payload to commercial infrastructure. The assigned sources place the
      first privately funded navigation payload launch in 2022, Pulsar-0 in
      orbit in June 2025, FCC authorization for a planned constellation of
      more than 250 satellites on August 3, 2026, and an initial block of six
      production-class satellites on SpaceX's Bandwagon-5 mission on October
      20, 2026. The FCC-related evidence describes authorization to operate
      alongside GPS, while the company-aligned account says the company is
      targeting commercial navigation services in 2027 and production capacity
      of 50 satellites annually by the end of 2027. Partner and government
      signals include the $20 million SpaceWERX grant, a $4.6 million Air
      Force Research Laboratory contract, and work with receiver and timing
      companies. Independent cyber analysis highlights cryptographic
      key-management and software-update attack surfaces, so regulatory
      approval is not equivalent to operational or cybersecurity proof.
    claimRefs: [CO013, CO014, CO015, CO016, CO018]
    figureRefs: [FO001]
