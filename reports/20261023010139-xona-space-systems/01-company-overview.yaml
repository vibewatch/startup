callouts:
  - calloutType: strength
    title: Engineering-to-infrastructure transition
    body: "The combination of Pulsar-0 on-orbit evidence, FCC authorization, production-facility scaling, and a planned six-satellite deployment supports a credible transition from technical demonstration toward constellation execution."
    claimRefs: [CO013, CO014, CO015, CO016]
  - calloutType: risk
    title: Financing and scale data are not reconciled
    body: "Public sources disagree on cumulative funding, valuation, and headcount; the latest financing report is materially different from the August and September snapshots, so investment judgment should not treat any single private-company database figure as ground truth."
    claimRefs: [CO004, CO010, CO011, CO012]
  - calloutType: assumption
    title: Regulatory clearance is not commercial proof
    body: "FCC authorization establishes a regulatory pathway, but it does not by itself verify service revenue, constellation completion, cybersecurity resilience, or customer retention."
    claimRefs: [CO015, CO018]
