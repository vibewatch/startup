      - [NextNav, Adjacent alternative, Indoor positioning for enterprises, "Tracxn identifies it as a public provider of indoor positioning", "Indoor scope may not substitute for global outdoor LEO PNT"]
      - [Internal build or sensor fusion, Substitute/status quo extension, Autonomy and industrial navigation stacks, "TechCrunch describes cameras, lidar, and radar as existing navigation components", "No retained source quantifies build cost, accuracy, or buyer willingness to add Pulsar"]
    notes: "Categories are analytical classifications based on the retained descriptions; competitor names and scopes come from Tracxn or Dealroom, while the status-quo description comes from TechCrunch. Unsupported direct substitutability is marked unknown."
    claimRefs: [CP001, CP002, CP003, CP004]
  - id: TP002
    title: Capability and distribution comparison
    columns: [Buying criterion, Xona/Pulsar, Incumbent GNSS or correction stack, Evidence status, Commercial implication]
    rows:
      - [Signal strength and interference resilience, "Company-issued coverage claims up to 100x GPS signal strength", "Legacy GPS is described as weak at the receiver", "Reported company claim; independent benchmark coverage is limited in this pool", "Potential premium for contested or obstructed environments"]
      - [Positioning precision, "Several-centimeter target described by TechCrunch; company materials describe centimeter-level positioning", "TechCrunch characterizes GPS as meter-level for the cited automotive context", "Different sources and use cases; not a like-for-like benchmark", "Requires customer validation by application and environment"]
      - [Authentication and anti-spoofing, "Encrypted/authenticated or cryptographic-watermark design is described", "Civilian GPS is described as open and vulnerable to spoofing", "Technical design is reported; operational security evidence is not retained", "Security posture may support defense and critical-infrastructure sales"]
      - [Receiver adoption, "Backward-compatible with many receivers; firmware/software update path", "Installed GNSS hardware has incumbent coverage", "Reported compatibility, not universal compatibility", "Could lower hardware switching cost but raises certification and update obligations"]
      - [Coverage scale, "Planned more than 250 satellites; six-satellite initial block planned for October 2026", "GPS is globally deployed and mature", "Xona figures are planned milestones, not realized coverage", "Coverage gaps may delay broad commercial substitution"]
      - [Pricing and packaging, null, null, "No retained source discloses list or realized prices", "Pricing power and payback remain diligence gaps"]
    notes: "The comparison preserves reported claims, planned milestones, and unavailable commercial terms separately; it does not imply that unlike metrics are directly comparable."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP015, CP016]
  - id: TP003
    title: Pricing, packaging, and switching evidence
    columns: [Dimension, Public evidence, What is unknown, Switching implication]
    rows:
      - [Service model, "Dealroom describes advanced navigation services and both GNSS enhancement and independent-navigation positioning", "Contract form, recurring versus usage pricing, and service tiers", "Buyer procurement path cannot yet be modeled"]
      - [Hardware requirement, "Sources describe compatibility with existing receivers and software/firmware enablement", "Receiver-by-receiver certification, antenna requirements, and retrofit cost", "Potentially lower than a full hardware replacement, but unproven"]
      - [Channel, "New Space Economy describes relationships with Trimble, NovAtel, Septentrio, and QinetiQ; Dealroom lists open technical and manufacturing roles", "Partner conversion, exclusivity, and channel economics", "Distribution leverage may be strong but partner-dependent"]
      - [Incumbent bundle, "GPS/GNSS is embedded across devices and workflows", "Incremental price buyers will pay over free GNSS or correction services", "Free baseline creates a high proof burden"]
      - [Contracted outcomes, "Retained sources describe demonstrations, authorization, and planned launches", "Paid customer count, retention, SLA performance, and realized accuracy by environment", "No evidence yet for durable customer lock-in"]
      - [Operational scale, "Series C funding is described as supporting constellation deployment and manufacturing scale", "Cash available, burn, launch cadence, and cost per operational satellite", "Execution and capital intensity remain central displacement risks"]
    notes: "Unknown cells are deliberate evidence gaps, not zero values. Company-issued statements and third-party summaries are not treated as independent customer proof."
    claimRefs: [CP009, CP010, CP011, CP013, CP014]
