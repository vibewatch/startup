callouts:
  - calloutType: strength
    title: Distribution can be an adoption wedge
    body: "Firmware-oriented compatibility and receiver partnerships could reduce the largest practical switching hurdle: replacing certified navigation hardware."
    claimRefs: [CP006, CP008]
  - calloutType: risk
    title: Free GPS sets a high proof bar
    body: "Xona must prove paid value against a mature, globally embedded baseline while financing and operating a large constellation."
    claimRefs: [CP004, CP013, CP014, CP016]
  - calloutType: assumption
    title: Comparable pricing is not public
    body: "No retained source supports a price, contract value, customer retention rate, or realized payback period; those remain underwriting gaps."
    claimRefs: [CP009, CP014]
