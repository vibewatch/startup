evidenceGaps:
  - type: conflicting-data
    severity: blocking
    topic: funding
    missingEvidence: >-
      A primary financing ledger or term-sheet-backed cap table that reconciles the reported Series C, Series D,
      cumulative funding, grants, and valuation figures.
    whyItMatters: >-
      Funding and valuation determine dilution, runway interpretation, ownership concentration, and the credibility of
      the current scale narrative.
    diligencePath: >-
      Request the latest financing announcement, capitalization table, investor rights summary, and grant accounting
      treatment under confidentiality.
    relatedQuestionRefs:
      - QO005
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR or contract value, active customer count, backlog, gross margin, and cash runway.
    whyItMatters: >-
      The chapter can establish technical and regulatory progress but cannot establish commercial traction or financing
      sufficiency without operating metrics.
    diligencePath: >-
      Obtain monthly financial statements, revenue-recognition notes, customer concentration, backlog, and cash forecast
      from management.
    relatedQuestionRefs:
      - QO006
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive and board roster, ownership, voting rights, and succession coverage.
    whyItMatters: Founder and investor concentration can materially affect execution risk and governance protections.
    diligencePath: Request the current board deck, cap table, charter, investor-rights agreement, and organization chart.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: cybersecurity
    missingEvidence: >-
      Independent security testing, key-management controls, software-update governance, and incident history for
      Pulsar.
    whyItMatters: >-
      A resilient PNT service creates a high-consequence attack surface; authorization does not validate security
      operations.
    diligencePath: >-
      Request a third-party penetration-test summary, secure-development lifecycle evidence, key-rotation policy, and
      incident-response record.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: customers
    missingEvidence: >-
      Signed customer contracts and deployment evidence distinguishing pilots, MoUs, paid production service, and
      government awards.
    whyItMatters: Partner names and test access indicate ecosystem interest but do not prove recurring commercial adoption.
    diligencePath: >-
      Request a customer pipeline and contract schedule with paid status, deployment stage, renewal terms, and
      concentration.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A buyer-level, geography-specific SAM and SOM with service pricing, adoption assumptions, and independently
      verified customer or early-access counts.
    whyItMatters: >-
      The available installed-base and constellation figures mix devices, sectors, satellites, and deployment stages, so
      they cannot support a comparable dollar market or share calculation.
    diligencePath: >-
      Obtain executed customer or early-access agreements, pricing and packaging, target geographies, receiver attach
      assumptions, and a bottom-up segment model from management and channel partners.
    relatedQuestionRefs:
      - QM003
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: stale
    severity: material
    topic: constellation-stages
    missingEvidence: >-
      Current 2026 evidence reconciling the older approximately 40/70/several-hundred satellite phases with the newer
      more-than-250-satellite plan and commercial service timing.
    whyItMatters: >-
      Deployment stage determines coverage, reliability, and the timing of paid adoption; stale stages can materially
      overstate near-term serviceability.
    diligencePath: >-
      Verify the current constellation manifest, launch schedule, coverage commitments, service-level targets, and
      commercial activation date.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedFigureRefs:
      - FM001
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: Customer-level evidence of who signs, pays, integrates, and renews Pulsar service in each priority application.
    whyItMatters: >-
      Named use cases demonstrate relevance but do not prove budget ownership, willingness to pay, or repeatable sales
      motion.
    diligencePath: >-
      Request anonymized pipeline and contract data by segment, including integrator role, end-user role, pricing unit,
      qualification stage, and renewal terms.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Signed or published pricing and packaging for Pulsar services by customer segment.
    whyItMatters: >-
      Without realized pricing and contract terms, the premium over free GNSS and the switching economics cannot be
      underwritten.
    diligencePath: Request current price sheets, contract templates, paid-pilot conversion, and renewal data.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-scope
    missingEvidence: Primary product and pricing evidence for the named PNT, mapping, and precision-equipment alternatives.
    whyItMatters: Taxonomy lists do not prove direct substitutability or reveal buyer tradeoffs.
    diligencePath: Collect competitor product, pricing, receiver, and customer-reference materials for each material alternative.
    relatedQuestionRefs:
      - QP002
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: execution-risk
    missingEvidence: >-
      Independent operating evidence for constellation deployment cadence, coverage, receiver certification, and service
      reliability.
    whyItMatters: The moat depends on scaling from demonstrations to dependable coverage, not only on the signal design.
    diligencePath: >-
      Obtain launch manifests, manufacturing yield, coverage forecasts, certification status, and service-level test
      results.
    relatedQuestionRefs:
      - QP007
      - QP010
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: blocking
    topic: revenue
    missingEvidence: Signed customer contracts, service start dates, price schedules, and recognized revenue by stream.
    whyItMatters: >-
      Without realized pricing and revenue, the service model cannot be translated into a forecast or quality
      assessment.
    diligencePath: Request executed contracts, billing records, backlog, and revenue-recognition policies.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, runway, debt, project-finance commitments, and planned use of proceeds.
    whyItMatters: Funding raised does not establish cash available or whether another round is required before service scale.
    diligencePath: Obtain the latest management accounts, cash forecast, cap table, debt schedule, and board-approved budget.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding
