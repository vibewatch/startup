        - {id: build, label: "Spacecraft and manufacturing", detail: "R&D, production, testing, and compliance"}
        - {id: launch, label: "Launch and constellation deployment", detail: "Six production spacecraft planned for October 2026"}
        - {id: signal, label: "Pulsar navigation signal", detail: "LEO PNT service authorized for planned constellation"}
        - {id: customer, label: "Commercial, government, and defense users", detail: "Target segments and early-access ecosystem"}
        - {id: revenue, label: "Service revenue", detail: "Pricing, contracts, utilization, and margin not publicly disclosed"}
