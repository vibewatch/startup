callouts:
  - calloutType: risk
    title: Financial visibility is the principal blocker
    body: Public evidence establishes financing and deployment milestones, but does not establish revenue, cash, burn, runway, pricing, or unit economics.
    claimRefs: [CI005, CI010, CI015]
  - calloutType: recommendation
    title: Underwrite only after contract and cash verification
    body: Treat the financing record as capacity evidence, not proof of financial sustainability; require signed demand, realized pricing, cash runway, and constellation cost data before valuation underwriting.
    claimRefs: [CI011, CI015, CI016]
