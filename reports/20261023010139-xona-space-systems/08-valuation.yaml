  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Six-satellite deployment proceeds; full constellation scales; paid contracts and recurring service economics are verified; Series D proceeds are confirmed", "Potentially supports a higher infrastructure value, but no numeric range is defensible without revenue, margin, and cap-table inputs", "Launch cadence, capital intensity, receiver adoption, security, spectrum coexistence", "Low-to-medium until contracts and financing documents are available"]
      - ["Base", "Deployment is achieved but commercialization and financial disclosure remain staged; reported Series C mark is not independently reconciled", "Research-more / wait for milestone evidence; avoid applying a software multiple to undisclosed revenue", "Funding needs, delayed adoption, preference structure, operational reliability", "Most defensible pending diligence"]
      - ["Bear", "Launch or authorization conditions delay service; security or interference remediation is required; customer conversion disappoints; new financing resets terms", "Downside cannot be quantified publicly; assume dilution and/or lower mark risk until cap table and preferences are reviewed", "Schedule slip, regulatory limits, cyber incident, weak contracts, multiple compression", "Material downside signal"]
    notes: "These are conditional decision scenarios, not forecasts. Numeric valuation ranges are omitted because the assigned evidence does not disclose revenue, ARR, margin, retention, cash burn, or a reconciled capitalization table."
    claimRefs:
      - CV003
      - CV006
