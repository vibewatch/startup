              - CU006
              - CU011
              - CU014
      - number: '6.4'
        title: Retention, expansion economics, and concentration remain unobservable
        blocks:
          - type: paragraph
            body: >-
              The assigned sources disclose neither gross nor net revenue retention, churn, renewals, contract length,
              cohort behavior, satisfaction, pricing, nor expansion revenue. They also do not identify the share of
              revenue attributable to any customer, government program, hardware partner, or channel. This is a material
              diligence gap because a technically validated satellite service can still face long procurement cycles,
              integration delays, and dependence on a small number of strategic counterparties. Compatibility through
              receiver software or firmware updates could lower deployment friction, but independent security analysis
              notes that over-the-air updates and cryptographic key management create additional attack surfaces.
              Investment underwriting should therefore treat retention and land-and-expand economics as unproven until
              contracts, invoices, usage telemetry, renewal cohorts, and concentration schedules are reviewed.
            claimRefs:
              - CU009
              - CU010
