  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified deployment and regulatory milestones improve the case, while unresolved commercial and valuation evidence
      keeps the decision at research-more.
    data:
      nodes:
        - id: scale-proof
          label: Scale and technical proof
          detail: >-
            Planned >250-satellite LEO network; six production spacecraft planned for October 2026; >350 reported live
            Pulsar-0 passes
        - id: regulatory-proof
          label: Regulatory proof
          detail: FCC authorization is reported for full constellation deployment
        - id: risk-adjustment
          label: Risk adjustment
          detail: Launch, security/update, interference, adoption, and financing risks remain
        - id: price-evidence
          label: Price evidence
          detail: Series C and Series D records are not reconciled; revenue and cap-table inputs are missing
        - id: commercial-proof
          label: Commercial proof
          detail: Paid contracts, backlog, customer concentration, and recurring service economics remain to be verified
        - id: recommendation
          label: Research-more
          detail: Wait for signed financing, paid-contract, and deployment evidence
      edges:
        - from: scale-proof
          to: regulatory-proof
        - from: regulatory-proof
          to: risk-adjustment
        - from: risk-adjustment
          to: price-evidence
        - from: price-evidence
          to: commercial-proof
        - from: commercial-proof
          to: recommendation
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV009
      - CV011
