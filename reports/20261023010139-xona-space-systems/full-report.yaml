              - CU008
              - CU012
              - CU014
              - CU017
      - number: '6.2'
        title: Technical validation has advanced faster than disclosed commercial adoption
        blocks:
          - type: paragraph
            body: >-
              The evidence shows a progression from an automotive-range prototype test reported in 2021, through an
              operational-class demonstrator and more than 350 live transmission passes, to full-constellation
              authorization and a planned first block of six production-class spacecraft. Xona's own research page also
              lists 2025-2026 work on receiver compatibility, watermark verification, convergence, and single-satellite
              validation. This sequence reduces technical and regulatory uncertainty, but it is not a customer-growth
              curve: no source supplies active users, paid deployments, locations, utilization, repeat purchases, or
              comparable period-over-period adoption data. The October 2026 Canadian facility commitment further
              supports capacity-building, while remaining prospective rather than evidence of realized service demand.
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU014
      - number: '6.3'
        title: Named relationships are meaningful but mostly pre-production
        blocks:
          - type: paragraph
            body: >-
              The strongest named commercial signals are a compiled record of Topcon early access, Furuno signal
              reception and industrial-timing work, and a Murata memorandum of understanding. Toyota Ventures also
              reported a successful prototype test at an automotive range, but that 2021 investor account is historical
              and does not establish a current customer contract. Flow Engineering presents Xona as a customer of Flow,
              which is evidence about Xona's internal engineering workflow rather than demand for Pulsar. Canada's
              investment is a substantial government partnership and sovereign-capacity signal, not proof that Canada is
              buying a production navigation service. Public labels therefore support collaboration, testing, and early
              access; they do not yet support recurring production revenue or independently measured customer outcomes.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
