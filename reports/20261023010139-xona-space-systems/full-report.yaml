          - type: callout
            title: Public absence is not a clean bill of health
            body: >-
              No litigation, enforcement, outage, or customer-concentration record was established by this assigned
              pool; these are diligence gaps rather than findings that such events do not exist.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Xona's investment case is an infrastructure wedge rather than a conventional software multiple story. The
              company is building Pulsar as a low-Earth-orbit positioning, navigation, and timing service intended to
              complement or operate independently of legacy GNSS, and a syndicated company release describes FCC
              authorization for a planned constellation of more than 250 satellites. The same company-issued evidence
              reports that Pulsar-0 completed more than 350 live transmission passes across four continents and that the
              first block of six production-class spacecraft was planned for October 2026. These milestones improve
              technical and regulatory credibility, but they are not evidence of recurring revenue, customer conversion,
              or cash-generation capacity. The anti-thesis is therefore execution and financing risk: a
              capital-intensive constellation must translate authorization and demonstrations into repeatable launches,
              service availability, receiver adoption, and contracted economics. A security-intelligence source
              specifically notes that cryptographic watermarking and software/firmware compatibility create security and
              update attack surfaces, so the product moat is not equivalent to low operating risk. Because the assigned
              public evidence contains no audited revenue, ARR, gross margin, NRR, or customer-count disclosure, a buy
              recommendation would require unsupported assumptions.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record is not sufficiently clean to support a single entry valuation. Silicon Valley
              Investment Club reports a $170 million Series C on March 26, 2026, a $767.94 million post-money valuation,
              and $209 million cumulative funding; Dealroom instead displays a $170 million Series C at a $680 million
              valuation and identifies a $20 million June 2025 grant. Tracxn reports $320 million across 10 rounds,
              while FundedIQ reports $39.0 million across three recorded rounds and explicitly says undisclosed rounds
              are excluded from its total. Fundz separately records a $250 million Series D on October 22, 2026, but its
              page is a commercial funding database rather than a primary company filing. These are not interchangeable
              measurements: grants, disclosed equity, database coverage, post-money valuation, and a newly recorded
              round may use different scopes and dates. The correct price discipline is to avoid treating any one mark
              as verified fair value until the company or lead investors provide the round documents, capitalization
              table, liquidation preferences, and the status of the reported Series D. The $170 million / $767.94
              million pairing implies roughly 22% of post-money equity if treated as a simple division, but that is an
              estimate, not a disclosed cap-table result.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: Recommendation, scenarios, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more with medium confidence: the authorization and deployment path are
              meaningful positives, but valuation support is conflicting and operating metrics are largely private. The
              base case is conditional on the six-satellite deployment occurring, continued regulatory compliance, and
              conversion of technical performance into paid commercial or government contracts; it does not assign a
              numeric valuation because the required revenue and capitalization inputs are absent. The bull case
              requires verified Series D proceeds, successful constellation scaling, receiver compatibility at
              commercial volumes, and customer contracts that demonstrate recurring service economics. The bear case is
              a delayed launch or service rollout, security or interference remediation, customer adoption below plan,
              or a financing event that reveals a lower mark or preference overhang. Exit readiness is therefore
              milestone-based rather than multiple-based. Before investing, request the signed financing package and cap
              table, audited or management revenue and backlog by customer segment, launch and service milestones,
              satellite replacement and insurance assumptions, and independent validation of security and coexistence
              claims. A thesis break occurs if the October 2026 deployment slips materially without a funded recovery
              plan, if authorization conditions constrain commercial service, or if customer contracts fail to support a
              repeatable revenue model.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not a price-supported buy
            body: >-
              Xona has credible technical and regulatory milestones, but the assigned public evidence does not reconcile
              valuation marks or disclose the operating metrics needed to underwrite entry price, dilution, or return.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV009
              - CV011
          - type: callout
            title: Financing data is the immediate gating item
            body: >-
              Reported funding totals range from $39.0M to $320M, and a $250M Series D was recorded after the reported
              Series C; these records require primary-document reconciliation before valuation judgment.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
