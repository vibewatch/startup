  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target customers span commercial autonomy and sovereign infrastructure
        blocks:
          - type: paragraph
            body: >-
              Xona's addressable customer set is broad but not yet quantified. Government material identifies
              transportation, defence, telecommunications, critical infrastructure, emergency response, and Arctic
              operations as relevant applications, while Dealroom categorizes the company as B2B and describes
              commercial, governmental, and defence clients. Historical investor material adds aerial mobility, smart
              agriculture, and all-weather autonomy. These sources establish plausible buyer and user groups, not
              segment revenue or active-account counts. The likely economic buyers range from vehicle and equipment
              manufacturers to public agencies and critical-infrastructure operators; receiver makers and integrators
              are an enabling channel because adoption may occur through software or firmware updates rather than
              wholesale hardware replacement.
            claimRefs:
              - CU001
              - CU008
              - CU014
              - CU017
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
