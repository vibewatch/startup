  - id: FE001
    title: Pulsar product architecture map
    type: stack
    summary: >-
      Pulsar depends on a layered space-to-receiver system in which signal, software, and verification interfaces must
      work together.
    data:
      layers:
        - label: Space segment
          detail: Orbital assets that generate the service footprint.
          items:
            - name: LEO constellation
              detail: Planned network of more than 250 satellites; six production spacecraft planned for October 2026.
            - name: Pulsar-0
              detail: Demonstration satellite reported to have completed more than 350 live transmission passes.
        - label: Signal and security
          detail: RF and authentication functions that distinguish the service.
          items:
            - name: L-band navigation signal
              detail: >-
                Broadcast alongside legacy GPS frequencies; received power is reported up to 100 times stronger than
                traditional MEO GPS broadcasts.
            - name: Cryptographic watermark
              detail: Dynamic watermark intended to protect against spoofing; key management remains an open diligence item.
        - label: Flight and ground software
          detail: Embedded, operational, and telemetry software across the system.
          items:
            - name: Embedded and flight software
              detail: Interfaces payload systems, embedded software, and spacecraft hardware.
            - name: Operations and telemetry
              detail: >-
                Provisioning, monitoring, command, logs, dashboards, and data processing are described in engineering
                roles.
        - label: User integration
          detail: Receiver updates and downstream application consumption.
          items:
            - name: Receiver software or firmware
              detail: Existing navigation hardware is described as compatible through software or firmware updates.
            - name: Downstream applications
              detail: >-
                Target applications include autonomy, transport, infrastructure, defense, agriculture, telecom, and
                robotics.
        - label: Verification and operations
          detail: Integration, regression, fault, and environmental test campaigns.
          items:
            - name: Test procedures
              detail: Requirements, ICDs, pass/fail criteria, telemetry, and runbooks.
        - label: Regulatory and spectrum interface
          detail: Authorization and coexistence controls for L-band broadcasts.
          items:
            - name: FCC coexistence
              detail: Authorization requires demonstrating no harmful interference to incumbent users.
    approximationNotes: >-
      Layer order is an analytical synthesis of source-described components, not a published Xona reference
      architecture.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE015
