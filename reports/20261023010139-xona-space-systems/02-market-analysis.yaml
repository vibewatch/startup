  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A buyer-level, geography-specific SAM and SOM with service pricing, adoption assumptions, and independently verified customer or early-access counts.
      whyItMatters: The available installed-base and constellation figures mix devices, sectors, satellites, and deployment stages, so they cannot support a comparable dollar market or share calculation.
      diligencePath: Obtain executed customer or early-access agreements, pricing and packaging, target geographies, receiver attach assumptions, and a bottom-up segment model from management and channel partners.
      relatedQuestionRefs: [QM003, QM009]
      relatedTableRefs: [TM002, TM003]
    - type: stale
      severity: material
      topic: constellation-stages
      missingEvidence: Current 2026 evidence reconciling the older approximately 40/70/several-hundred satellite phases with the newer more-than-250-satellite plan and commercial service timing.
      whyItMatters: Deployment stage determines coverage, reliability, and the timing of paid adoption; stale stages can materially overstate near-term serviceability.
      diligencePath: Verify the current constellation manifest, launch schedule, coverage commitments, service-level targets, and commercial activation date.
      relatedQuestionRefs: [QM004, QM008]
      relatedFigureRefs: [FM001]
    - type: private-evidence-only
      severity: material
      topic: buyer-segmentation
      missingEvidence: Customer-level evidence of who signs, pays, integrates, and renews Pulsar service in each priority application.
      whyItMatters: Named use cases demonstrate relevance but do not prove budget ownership, willingness to pay, or repeatable sales motion.
      diligencePath: Request anonymized pipeline and contract data by segment, including integrator role, end-user role, pricing unit, qualification stage, and renewal terms.
      relatedQuestionRefs: [QM005, QM006, QM007]
      relatedTableRefs: [TM003]
