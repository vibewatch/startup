evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership bench
    missingEvidence: A current group-level board roster and fuller executive-team page were not found in the reviewed public sources.
    whyItMatters: >-
      Founder dependence, governance quality, and succession risk cannot be fully judged from regulated-entity filings
      alone.
    diligencePath: Request a current org chart, board list, and committee structure directly from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding mix
    missingEvidence: >-
      Public sources do not reconcile exactly how much of lifetime funding is primary equity, convertible debt, or other
      debt facilities.
    whyItMatters: >-
      Cap-table dilution and valuation-step-up analysis depend on separating true equity proceeds from debt-backed
      capital.
    diligencePath: >-
      Request a round-by-round capitalization schedule showing instrument type, gross proceeds, and secondary
      components.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current operating metrics
    missingEvidence: >-
      No reviewed official source provides one canonical current ARR figure or a single company-verified current
      headcount number at runDate.
    whyItMatters: >-
      Later financial and valuation work needs clean denominators rather than a mix of run-rate, turnover, and dated
      workforce signals.
    diligencePath: Obtain a current KPI pack covering ARR, revenue, headcount by geography, and product-level mix.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: regulatory perimeter
    missingEvidence: >-
      The reviewed set lacks a strong primary-source regulator document corroborating the UKTN-reported 2024 Gibraltar
      fine and clarifying the current carrier-versus-broker perimeter.
    whyItMatters: Regulatory exposure and control obligations matter more once the company expands products and jurisdictions.
    diligencePath: >-
      Pull the primary Gibraltar regulator notice, carrier filings, and any FCA correspondence that define the regulated
      perimeter.
    relatedQuestionRefs:
      - QO023
  - type: enumeration-incomplete
    severity: minor
    topic: public chronology TO004
    missingEvidence: >-
      Public sources do not disclose exact dates for every product launch, internal governance action, or customer
      milestone relevant to Marshmallow's evolution.
    whyItMatters: >-
      The chapter can ship with a public chronology, but later diligence should not mistake it for a full internal
      operating timeline.
    diligencePath: Ask management for a detailed private timeline covering launches, governance changes, and financing documentation.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: newcomer-sam
    missingEvidence: >-
      A public dataset linking foreign-born residents or recent immigrants to licence status, car ownership, and private
      motor policy purchase.
    whyItMatters: >-
      Without that join, any newcomer SAM is directional rather than investment-grade, and foreign-born population
      counts overstate immediate addressability.
    diligencePath: >-
      Request Marshmallow cohort data on quote requests, binds, and renewals by arrival tenure, nationality bucket, and
      licence status; cross-check against PCW distribution performance.
    relatedQuestionRefs:
      - QM011
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: migration-revisions
    missingEvidence: >-
      A stable post-revision time series for 2024-2025 net migration that does not shift materially between ONS
      releases.
    whyItMatters: >-
      The public narrative around UK newcomer inflow can change materially when ONS revises its comparison base, which
      affects any market-growth story built on the latest headline.
    diligencePath: >-
      Use the latest ONS bulletin as the anchor and keep a revision log for earlier provisional releases rather than
      averaging them together.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: newcomer-unit-economics
    missingEvidence: Quote-win, claims, retention, and loss-ratio data for newcomer cohorts versus mainstream UK drivers.
    whyItMatters: >-
      The public record proves the niche exists but does not show whether Marshmallow's underwriting advantage remains
      durable after claims inflation, theft, and complaints costs.
    diligencePath: >-
      Ask for cohort-level underwriting and retention data, including foreign-NCD verification rates, geography mix,
      monthly-payment mix, and complaint/FOS referral rates.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: private-evidence-only
    severity: material
    topic: renewal-retention-economics
    missingEvidence: Cohort-level renewal conversion, retention, and loss-ratio data for newcomers versus mainstream cohorts.
    whyItMatters: >-
      Without cohort economics, the chapter cannot test whether Marshmallow’s underwriting wedge translates into
      durable, profitable customer retention.
    diligencePath: >-
      Request channel-level renewal win rates, retention by tenure, and loss ratios for newcomer cohorts from
      management.
  - type: missing-source
    severity: material
    topic: peer-complaints-benchmark
    missingEvidence: >-
      Comparable public complaints and ombudsman-normalised benchmarks for Admiral, Hastings, Churchill, Cuvva, and
      Marshmallow on the same basis.
    whyItMatters: >-
      The chapter can show Marshmallow-specific operational risk, but it cannot prove whether that risk is better or
      worse than major rivals on a clean like-for-like basis.
    diligencePath: Assemble FCA, ombudsman, and company-disclosed complaint datasets on a common period and per-policy denominator.
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current consolidated cash balance, monthly burn, and a 12-month liquidity forecast.
    whyItMatters: >-
      Solvency coverage and fresh financing do not tell an investor how much runway remains or when the next fundraise
      could be required.
    diligencePath: Request the latest consolidated balance sheet, monthly management accounts, and board liquidity pack.
    relatedQuestionRefs:
      - QI020
      - QI021
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      A bridge from carrier premium, broker turnover, reinsurance commissions, investment income, and adjacent products
      to consolidated revenue.
    whyItMatters: >-
      Public top-line metrics currently mix incompatible scopes, which makes revenue quality and margin durability hard
      to underwrite.
    diligencePath: Request FY2024 and FY2025 management P&Ls by entity and product line with intercompany eliminations.
