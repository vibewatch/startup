- id: scenarios-and-exit-readiness
  title: Bull / Base / Bear Scenarios and Exit Readiness
  body: |-
    The bear case is not a zero, but it is painful. If Marshmallow rerates closer to listed insurers while debt, redress, or reinsurance pressure rises, a plausible value range is roughly $0.9 billion to $1.4 billion. That outcome would still credit the company for a real niche, but it would assume markets stop paying near-Lemonade multiples for a private UK-focused platform with mixed capital and conduct baggage. The base case is roughly $1.7 billion to $2.2 billion: Marshmallow continues growing, complaints do not metastasize, and investors keep giving it a premium to incumbents without paying more than today's mark. The bull case of roughly $2.8 billion to $3.4 billion needs more than storytelling. It needs audited revenue moving decisively above $600 million, evidence that customer outcomes are improving, and proof that home, finance, or international expansion can grow without breaking controls.

    Those ranges also shape exit thinking. The most credible near-term path is continued private funding or structured strategic capital, not an immediate IPO. Public comps are available, but Marshmallow's disclosure quality still trails public-market standards on cash, preference overhang, and consolidated profitability. That does not kill the investment; it just means current holders are paying for optionality that has not yet been fully underwritten by public evidence.
  claimRefs:
  - CV048
  - CV053
  - CV054
  - CV055
  - CV057
