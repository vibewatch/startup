- id: comparable-set-and-multiple-gap
  title: Comparable Set and Multiple Gap
  body: |-
    The simplest public comp exercise does not support calling Marshmallow cheap. On the company's own run-rate disclosure, the current mark is about 4.0x valuation-to-turnover; on Sacra's 2024 revenue estimate it is about 5.4x. That is materially above Admiral at roughly 2.3x and far above Aviva at roughly 0.33x. Hippo, a listed insurtech with a very different line mix but a public market check on digital-insurance sentiment, trades around 1.5x. Only Lemonade, the closest app-first insurtech reference in this set, sits in the same neighborhood, at about 5.2x market-cap-to-revenue and roughly $4 billion of EV on $923 million of LTM revenue per Multiples.vc.

    That comp picture matters because Marshmallow is still private and less liquid than any of these names. Private investors should normally demand a discount to public comps unless the company has obviously stronger growth, governance, and disclosure. Marshmallow does have better niche-fit economics than an ordinary incumbent, but the reviewed record still shows secured debt, conduct noise, and incomplete capital-structure disclosure. The public comp set therefore frames the 2025 mark as stretched rather than egregiously impossible: it can hold if execution keeps improving, but the evidence today does not justify assuming a premium re-rating from here.
