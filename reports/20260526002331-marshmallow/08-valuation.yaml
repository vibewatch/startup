- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Evidence basis
  - What would change the view
  rows:
  - - Real scale and underwriting proof
    - 1M+ drivers, $500M run-rate claim, first-time 2024 profitability, 216% solvency coverage
    - Need audited consolidated cash flow and margin bridge to treat scale as durable quality rather than just fast growth
  - - Expansion optionality is credible
    - Home insurance, car finance, and explicit international ambitions are already public
    - Need attachment rates, cross-sell margins, and new-market economics rather than product-page existence alone
  - - Current price already bakes in premium execution
    - $2B+ valuation equals ~4.0x run-rate or ~5.4x Sacra 2024 revenue estimate
    - A lower entry price or new audited evidence could make the same company more investable
  - - Service and conduct are valuation risks, not footnotes
    - FOS losses, 53% uphold rate in Finder, and poor review-site scores point to real customer-outcome drag
    - Sustained improvement in complaints, retention, and redress reserves would weaken the anti-thesis
  notes: Rows pair upside and downside arguments so the recommendation stays price-sensitive rather than company-quality-only.
