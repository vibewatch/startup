company:
  name: Marshmallow
chapter:
  number: 8
  title: Valuation
  summary: Marshmallow's 2025 Series C at just over $2 billion implies roughly 4.0x valuation-to-turnover on the company's own $500 million run-rate claim and about 5.4x on Sacra's 2024 revenue estimate—well above listed incumbents such as Admiral and Aviva and closer to Lemonade's public insurtech multiple. The company has stronger proof than a typical niche insurer, including one million-plus insured drivers, first-time 2024 profitability, and 216% group solvency coverage, but mixed debt/equity financing, an outstanding 2025 secured charge, ombudsman losses, and incomplete cash/preference disclosure keep the recommendation at track with a stretched valuation stance.
sections:
- id: recommendation-and-thesis
  title: Recommendation, Thesis, and Anti-Thesis
  body: |-
    Marshmallow is no longer a fragile concept stock. Public evidence supports a real underwriting platform with more than one million insured drivers, a disclosed $500 million turnover run rate at the time of the 2025 round, first-time group profitability in 2024, and a 216% solvency coverage ratio at year-end. The company has also shown it can keep widening the product perimeter: van insurance, home insurance, and direct car finance are already live, while the 2025 round was explicitly sold as fuel for broader product and geographic expansion. Those facts make the pro-investment case credible.

    The anti-thesis is about price and fragility, not whether Marshmallow has a wedge. The disclosed valuation of just over $2 billion already prices the business at roughly 4.0x the company's own $500 million run-rate claim and about 5.4x Sacra's 2024 revenue estimate. That sits far above listed incumbents such as Admiral and Aviva and closer to Lemonade's public insurtech multiple even though Marshmallow is private, more opaque, and carrying mixed debt/equity financing plus an outstanding 2025 secured charge. Ombudsman losses, customer-redress risk, and bifurcated review data further weaken the case for paying up today. The result is a track call: good company-quality signals, but not enough public proof to justify aggressive entry at the disclosed price.
