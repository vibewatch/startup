  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current consolidated cash balance, monthly burn, and 12-month liquidity forecast.
    whyItMatters: Without cash and runway, investors cannot test whether the 2025 financing solved durability or just delayed the next raise.
    diligencePath: Request the latest monthly management accounts, treasury dashboard, and board liquidity model.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Cap-table summary showing liquidation preferences, seniority, and dilution overhang from all rounds plus debt instruments.
    whyItMatters: The $2bn headline valuation may overstate value available to new capital if preferences or debt absorb a large share of downside outcomes.
    diligencePath: Request a board-approved cap-table summary and term-sheet abstracts for the 2025 financing and earlier preferred rounds.
    relatedQuestionRefs:
    - QV023
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Facility agreement, covenant package, collateral definitions, and amortization schedule for the 2025 secured debt.
    whyItMatters: Secured leverage can change equity downside far more than the headline valuation suggests if performance or claims costs weaken.
    diligencePath: Review lender documents directly with finance leadership and compare covenant headroom to management forecasts.
    relatedQuestionRefs:
    - QV006
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: reinsurance-economics
    missingEvidence: Quota-share percentages, ceding commissions, counterparty limits, and renewal pricing for Marshmallow's reinsurance program.
    whyItMatters: Reinsurance concentration can make reported underwriting improvement less durable than it appears in summary public numbers.
    diligencePath: Request treaty summaries, reinsurance committee materials, and sensitivity analysis on ceded terms.
    relatedQuestionRefs:
    - QV012
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Cohort-level renewal, claims severity, complaints, and redress leakage by tenure and newcomer segment.
    whyItMatters: Review scores and ombudsman outcomes only affect valuation if they translate into churn, loss adjustment expense, or weaker LTV.
    diligencePath: Request cohort dashboards covering acquisition channel, renewal, loss ratio, complaints, and redress reserve releases.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV009
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: minor
    topic: TV004 comparable-set coverage
    missingEvidence: Additional public or private insurtech valuation references for UK and European motor-heavy peers beyond the reviewed comp set.
    whyItMatters: TV004 is intentionally partial because Marshmallow lacks one perfect listed peer, and a broader peer basket would improve confidence in the chosen multiple range.
    diligencePath: Add more region- and model-appropriate peers, especially any disclosed private UK/EU insurtech marks or secondaries, before using TV004 as a tight pricing anchor.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
