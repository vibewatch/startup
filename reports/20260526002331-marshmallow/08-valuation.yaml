- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table and preferences
    - Current share classes, liquidation preferences, and dilution overhang
    - The private headline valuation may overstate value available to new common-equivalent investors
    - Request board-approved cap-table summary and 2025 term-sheet economics
  - - Cash and runway
    - Current cash balance, burn, and 12-month liquidity forecast
    - Needed to judge whether growth is funded from operations or still consumes debt/equity quickly
    - Request latest management accounts and treasury pack
  - - Debt covenants and security
    - Facility agreement, covenant definitions, collateral package, amortization schedule
    - Secured debt can cap upside even if revenue keeps growing
    - Review lender docs and CFO covenant model
  - - Reinsurance economics
    - Quota-share percentage, ceding commissions, counterparty concentration, renewal terms
    - Reinsurance structure determines retained margin and capital efficiency
    - Request treaty summary and reinsurance committee materials
  - - Customer outcomes by cohort
    - Renewal, claims severity, complaint, and redress data by tenure or newcomer segment
    - Public review noise is only useful if it connects to economics
    - Request retention and complaint dashboards with cohort cuts
  - - Expansion proof
    - Home, finance, and international unit economics plus attachment rates
    - The bull case depends on adjacent products and geographies carrying real margin
    - Request cross-sell funnel data and post-launch KPI pack
  notes: These asks are ordered by how directly they can change valuation confidence rather than by ease of collection.
