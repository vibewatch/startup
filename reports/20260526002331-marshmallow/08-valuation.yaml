- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round or flat-insider extension
    - New primary financing below the 2025 $2bn+ mark
    - Confirms current private price was too optimistic for the risk taken
    - Move from track toward avoid until the cap table resets
  - - Capital flexibility weakens
    - Group solvency or debt headroom visibly deteriorates; new security package tightens lender control
    - Raises odds that growth is debt-supported rather than value-accretive
    - Require full covenant and treasury review before any fresh capital
  - - Complaint / redress pressure persists
    - Ombudsman losses, complaint rates, or redress reserves stay elevated or worsen
    - Cuts LTV, increases leakage, and undermines premium pricing power
    - Treat service metrics as underwriting variables, not brand noise
  - - Expansion fails to monetize
    - Home, finance, or international launches add cost without visible attachment or margin proof
    - Removes the main reason to pay near-Lemonade multiples
    - Re-rate toward lower incumbent-like multiple bands
  - - Disclosure remains thin
    - Still no audited consolidated cash, runway, or preference visibility through the next diligence cycle
    - Keeps downside impossible to underwrite tightly
    - Hold the call at track or step aside
  notes: Triggers are intentionally monitorable and tied to observable financing, solvency, complaints, expansion, or disclosure events.
