  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              Marshmallow’s core offering remains fully comprehensive motor insurance rather than a broad menu of cover
              types: the official site says it does not sell third-party-only policies and instead packages cover into
              four direct-purchase tiers — Lightest, Essential, Original, and Plus. The product is tuned to newcomers,
              with pricing inputs built around overseas driving history, proof of claim-free driving from any country,
              and licence acceptance from outside the UK. That newcomer-specific underwriting proposition is then
              wrapped in conventional motor-insurance features such as courtesy-car options, windscreen cover, breakdown
              cover, legal protection, and Europe cover. [CE001] [CE002] [CE003] [CE004] [CE005] [CE006] [CE007] [CE008]

              The customer workflow is explicitly digital-first. Marshmallow’s app-store descriptions say policyholders
              can manage all their policies in one account, download documents, make changes, claim from their phone,
              use emergency guides, and reach live chat quickly. The official help surface mirrors that positioning: the
              help centre and Intercom collection pages expose self-serve flows for buying, document upload, policy
              updates, payment changes, claims, renewals, and cancellations. Specific help articles show that adding a
              driver is app-native for car policies, incident reporting has a prescribed FNOL checklist, and even
              “notification only” accidents still need to be logged quickly if another party is involved. [CE009]
