  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and recognition mechanics
        blocks:
          - type: paragraph
            body: >-
              Marshmallow’s public financial story starts with the fact that it is a vertically integrated
              insurer-broker, not a SaaS company. The group’s Gibraltar carrier, Marshmallow Insurance Limited,
              underwrites the risk, while Marshmallow Financial Services Limited distributes policies and related
              add-ons into the UK market via large price comparison sites. That structure matters because public “top
              line” can refer to different things: broker turnover, carrier gross written premium, net retained premium
              after reinsurance, investment income on insurer float, or analyst-estimated consolidated revenue. Pricing
              is also individualized rather than list-priced. Marshmallow’s homepage is transparent about the commercial
              proposition—pricing based on overseas driving history, fully comprehensive cover only, multiple plan
              tiers, and flexible monthly payments—but it does not publish a static tariff card or realized premium mix.
              The strongest public value signal is not average premium; it is the company’s claim that UK newcomers
              saved an average of £392 versus the second-cheapest Confused.com quote in a January-to-June 2025 cohort.
              Financially, the key recognition issue is that reinsurance commissions and float income are material
              enough that gross premium alone overstates how much risk and profit Marshmallow retains on balance sheet.
