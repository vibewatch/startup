      - number: '1.3'
        title: Funding history, investor map, and scale disclosure
        blocks:
          - type: paragraph
            body: >-
              Marshmallow's capital story is now clear at the headline level even if some finer points remain private.
              Public round reporting shows a $30 million Series A in 2020, an $85 million Series B in 2021 at a $1.25
              billion valuation, and a $90 million Series C in April 2025 at just over a $2 billion valuation. The
              latest investor set is also well corroborated: company, investor, and press sources all point to Portage,
              BlackRock, and Columbia Lake Partners in the 2025 round, while 2021 coverage repeatedly names Passion
              Capital, Investec, and Scor among earlier backers. TechCrunch adds an important nuance by saying the 2025
              deal was roughly half equity and half debt, with a convertible element dating back to 2023, which helps
              explain why total-raised figures are not perfectly consistent across public sources.


              Scale signals are strong, but they do not all use the same denominator. The 2025 company and investor
              announcements say Marshmallow had insured more than one million drivers and was running above $500 million
              of annual turnover. Earlier official pages said the company had sold over half a million policies and
              served hundreds of thousands of app users annually, while UKTN reported audited 2023 turnover of £184
              million, near-breakeven losses, and 310 staff. Portage then claimed 700 employees across London and
              Budapest in 2025. Together these signals support a growth-stage, late-stage private company that is
              materially larger than a niche MGA, but they are still not a substitute for a full current data-room
              package on ARR, consolidated revenue, and headcount.
