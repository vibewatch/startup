      - number: '5.2'
        title: Operating Architecture and Delivery Model
        blocks:
          - type: paragraph
            body: >
              Marshmallow’s product is not just an app; it is an insurer-broker operating stack. The 2024 SFCR says
              Marshmallow Insurance Limited underwrites the motor risk while Marshmallow Financial Services Limited
              distributes the product via major UK price-comparison sites. The same filing says the group IT operation
              and broker cover pricing, underwriting, data management, counter-fraud, claims management, and complaints
              handling, which means the customer-facing experience sits on top of a multi-entity control model rather
              than a single software business. The SFCR also records a joint Product Oversight and Governance Committee
              between insurer and broker, reinforcing that product changes and customer outcomes are overseen as a
              regulated co-manufacturing process. [CE019] [CE020] [CE022] [CE023] [CE024]

              The claims path is also partner-heavy. Marshmallow’s repair FAQ routes validated vehicles into Motor
              Repair Network, while WNS publicly says it was selected to provide 24/7/365 end-to-end claims management
              from first notification of loss through resolution. In parallel, public engineering roles show Marshmallow
              trying to internalise more of this stack: the Claims Tech team says it is building an internal Claims
              Management System covering internal, external, and customer-facing flows plus partner integrations and
              financial reporting. Those same roles expose a materially modern platform footprint — Java/Spring
              microservices on AWS for claims and data, and a SwiftUI-heavy iOS app with modular packages, automated
              tests, Bitrise, Fastlane, SwiftLint/SwiftFormat, Danger, and Tuist. [CE016] [CE018] [CE034] [CE035]
