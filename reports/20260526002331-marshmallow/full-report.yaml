      - number: '3.4'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Marshmallow’s strongest public moat claim is informational rather than distributive. Its official pages,
              investor materials, and independent coverage all describe a model built around foreign driving histories,
              newcomer documentation, pricing data, and fraud signals that mainstream insurers historically underused.
              That gives Marshmallow a real wedge. But the durability of that wedge is not guaranteed. TechCrunch
              explicitly described data science and AI as becoming table stakes across insurance startups, and adjacent
              entrants such as Ominimo show that underwriting innovation can spread quickly if the economics are
              attractive.


              The more immediate weakness is trust and service execution. Marshmallow’s own complaints policy discloses
              meaningful complaint volumes, and the two Financial Ombudsman Service decisions reviewed for this chapter
              both found against the company on operational matters: one on incorrect cancellation messaging and one on
              unfair claim rejection and policy voidance. Those are not existential on their own, but they matter in a
              category where buyers can return to scaled incumbents at renewal. Marshmallow’s future expansion into
              lending, broader insurance products, and new geographies may create more upside, but it also broadens the
              number of incumbents and fintechs that can meet it on overlapping ground.
