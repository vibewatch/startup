  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Overview and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Marshmallow does not face one neat peer set. For a UK newcomer trying to insure a car, the practical
              alternatives are broad incumbent insurers, temporary-cover apps, and price-comparison sites that make
              annual shopping easy. Marshmallow’s positioning is unusually explicit: it markets annual fully
              comprehensive motor cover to people who have moved to the UK, says it can price on driving experience from
              any country, and says it accepts proof of claim-free driving from any insurer in any language. That is a
              narrower and more specific promise than the mass-market language used by Admiral, Hastings, Churchill, or
              QuoteMeHappy.


              The real status quo is still annual quote-shopping through comparison portals and mainstream insurers, not
              a specialist migrant-only stack. Marshmallow’s own marketing indirectly proves this, because its pricing
              claims are benchmarked against Confused.com and wider price-comparison-website data. That means the
              company wins only when its underwriting advantage survives side-by-side quote comparison. There is also no
              meaningful internal-build equivalent for this consumer job; the substitute is staying with an incumbent,
              using a short-term insurer for occasional driving, or renewing through a comparison site. This makes
              distribution power and switching friction almost as important as underwriting sophistication.
