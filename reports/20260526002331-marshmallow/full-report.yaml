      - number: '2.2'
        title: Multi-lens Sizing and Addressable Reach
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports several useful sizing lenses, but not one clean Marshmallow SAM. First, the
              broad paid-premium lens: ABI says its tracker covers nearly 28 million policies sold a year, and both ABI
              and Which place recent paid private-motor premiums around £560 to £562. That implies a customer-paid
              premium flow of roughly £15.7 billion, but it is only an upper-bound market-flow estimate because the
              policy-count and premium snapshots come from different periods and do not isolate in-force risks or
              Marshmallow's newcomer slice. Second, the population-stock lens: the Migration Observatory says 10.7
              million UK residents were born abroad at the 2021/22 Census, equal to 16% of the population, with 47% of
              that foreign-born base concentrated in London and the South East and over 40% of London residents born
              abroad. Third, the annual inflow lens: ONS's latest year-ending December 2025 bulletin puts long-term
              immigration at 813,000 and long-term net migration at 171,000, with 77% of immigrants coming from non-EU+
              countries and work-related arrivals down 47% year on year. These are not interchangeable numbers. A stock
              of foreign-born residents is not the same thing as annual arrivals, and either one is still not the same
              as insured drivers who own or use a vehicle. Fourth, Marshmallow's own observed niche proof points say 79%
              of its customers are new to the UK and that a 4,304-policy newcomer sample produced a £392 average quote
              advantage versus the second-cheapest alternative. Together these lenses show a meaningful market with real
              premium spend and real newcomer density, but also show why Marshmallow's monetisable SAM is narrower than
              simple “foreign-born population” math would suggest.
