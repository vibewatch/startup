  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer / budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - Newly arrived worker
        - Primary driver who has just relocated for work
        - Same individual commuting or travelling for work and errands
        - Usually the driver paying from salary cash flow
        - >-
          Confirm residency and address, validate licence status, quote with foreign history, choose monthly or annual
          payment
        - Needs a car quickly and gets poor quotes from insurers using UK-only history
      - - Family migrant or spouse-visa household
        - Named driver plus spouse or sponsoring household
        - Driver and household dependants
        - Household budget rather than purely individual spending
        - Assemble residency and address proof, compare cover levels, coordinate who is named and who pays
        - Needs family mobility and cares about payment timing and documentation friction
      - - International graduate / early-career migrant
        - Young working-age driver transitioning from study to employment
        - Same driver
        - Personal budget, sometimes with family support
        - Licence eligibility, quote comparison, emphasis on affordability and instalments
        - Thin UK file plus limited cash buffer makes standard quotes expensive
      - - Settled migrant with foreign no-claims history
        - Resident driver with years of safe driving abroad
        - Same driver
        - Same household
        - Upload claim-free evidence, convert foreign history into UK discount, then renew on a mainstream-like basis
        - Wants to stop being treated like a new UK driver
      - - Adjacent high-premium urban driver
        - Younger or thin-file driver in expensive cities
        - Same driver
        - Same household or parent-supported payer
        - Compare premiums across geography and age bands, evaluate whether underwriting differentiation helps
        - Very high incumbent pricing creates room for non-standard underwriting approaches
    notes: >-
      Buyer, user, and payer often collapse into the same person in personal motor insurance, but family migration and
      early-career cases add budget-owner complexity even before employer or relocation support is considered.
