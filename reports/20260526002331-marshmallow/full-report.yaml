      - number: '6.3'
        title: Named customer proof and service quality
        blocks:
          - type: paragraph
            body: >-
              Because Marshmallow sells to consumers rather than enterprises, named customer proof comes mostly from
              review platforms and Ombudsman cases instead of marquee logos. The evidence is therefore anecdotal but
              still decision-useful. Positive evidence exists: one App Store reviewer said they joined after a friend
              recommendation and found the app smooth and easy to use. But the adverse record is much richer. App Store
              reviewers describe five-week claim limbo after a vehicle fire, three-month repairs without a courtesy car,
              and compensation only after complaint escalation. Reviews.io includes a named reviewer, R Kad, alleging
              that a do-not-renew request produced cancellation fees, and the broader Reviews.io page is full of
              complaints about automated communication, lack of phone support, claim delays, and policy cancellation
              handling. The two Financial Ombudsman decisions are especially important because they go beyond sentiment
              into adjudicated failures: one required £660 compensation after erroneous cancellation messaging during
              validation, and another required Marshmallow to settle a claim, refund unused premium, remove cancellation
              markers, and pay £300 for distress. This mix means Marshmallow clearly has real customers and real usage,
              but the public named evidence is disproportionately concentrated in service-quality disputes and recovery
              moments, not in durable long-term loyalty stories.
