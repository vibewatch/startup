      - number: '7.5'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Marshmallow does have visible mitigations, which is why the recommendation impact is cautionary rather
              than outright negative. Solvency headroom improved materially in 2024; the quota-share panel diversified;
              counterparties are described as A-rated; internal audit is outsourced to a known firm; and the company’s
              own surfaces emphasise live chat, 24/7 claims response, anti-fraud controls, and fast product iteration.
              Governance is also moving incrementally from pure founder control toward a more formal regulated-entity
              board structure.


              The problem is that the same evidence base suggests the mitigations are incomplete rather than fully
              mature. The complaint and FOS record shows controls still fail in customer-critical moments. The capital
              structure is more complex than a cash-rich private company with no encumbrances. And a large part of the
              public case for Marshmallow still depends on management narrative rather than fully disclosed treaty
              economics, current cash, debt covenants, cyber-control evidence, or executive succession depth.


              The right monitoring posture is therefore explicit. Marshmallow should be treated as broken if regulator
              action recurs, if complaints intensity or adverse ombudsman outcomes worsen from the current baseline, if
              solvency coverage or treaty support materially deteriorate, or if management expands products/geographies
              faster than service quality stabilises. If those triggers stay contained, Marshmallow can still look like
              a disciplined migrant-focused insurer broadening into a larger fintech platform. If they do not, the
              company’s operational leverage cuts the wrong way.
