      - number: '7.2'
        title: Operational, Claims, and Customer-Experience Risk
        blocks:
          - type: paragraph
            body: >-
              Public operating evidence suggests Marshmallow works best when customer journeys remain standardised and
              digitally self-serve. The 2024 SFCR says the insurer relies on Group IT and MFSL for pricing,
              underwriting, data management, counter-fraud, and claims management including complaints handling, while
              internal audit is outsourced. That architecture can be efficient, but it also means execution risk is
              distributed across shared systems, outsourced oversight, and customer-facing workflows rather than
              isolated in one tightly controlled insurer function.


              The failure mode that shows up repeatedly is not catastrophic system outage; it is poor handling of
              exceptions. FOS decisions describe delayed communication, mistaken cancellation letters, disputed fraud
              markers, and unfair claim declinatures or voidance outcomes. External review platforms split sharply:
              Trustpilot is still strong at 4.2 from 39,738 reviews, but Smart Money People is 1.80/5 with 79% one-star
              reviews, and Reviews.io is 3.1/5. That spread is consistent with a company whose acquisition and simple
              servicing motions are attractive, but whose claims, cancellation, renewal, or validation journeys can
              deteriorate when the case becomes complex.


              Marshmallow’s own app and marketing surfaces reinforce the dependence on digital support, live chat, and
              anti-fraud automation. Those are real strengths for a migrant-focused insurer, yet the same model raises
              operational risk if staffing, chat escalation, or supplier handoffs lag policy growth. Privacy and
              data-handling obligations add another layer: Marshmallow processes claims data, retains policy data for
              years, and relies on legitimate-interest logic for parts of incident handling. That is normal for
              insurance, but it heightens the cost of any control failure.
