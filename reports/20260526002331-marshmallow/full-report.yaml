      - number: '8.5'
        title: Final Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining work is concentrated, not vague. First, investors need a cap-table and preference summary
              that shows how much of a down-case would belong to common equity after debt and liquidation preferences.
              Second, they need current consolidated accounts with cash, runway, and a bridge from carrier underwriting
              economics to group free cash flow. Third, they need the actual debt documents and covenant package behind
              the 2025 facility, plus clarity on reinsurance concentration and ceding-commission dependence. Fourth,
              they need customer-outcome evidence that goes beyond isolated anecdotes: complaint cohorts, renewal
              retention, loss-adjustment leakage, and whether redress exposure is stabilizing or widening.


              The valuation thesis breaks if any of the following happens: a down-round below the 2025 mark; solvency or
              capital flexibility deteriorates materially; complaint/redress metrics keep worsening; or the business
              fails to convert its one-million-driver proof into better economics from finance, home, or international
              expansion. Conversely, the view can improve if Marshmallow produces audited consolidated growth, cleaner
              customer-outcome data, and a balance-sheet package that looks less debt-assisted than the public record
              implies today.
