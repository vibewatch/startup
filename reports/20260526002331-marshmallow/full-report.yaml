      - number: '2.3'
        title: Buyer Segments, Budget Ownership, and Adoption Mechanics
        blocks:
          - type: paragraph
            body: >-
              Marshmallow's buyer map is broader than a simple “immigrant driver” stereotype. The most obvious core
              buyer is a newly arrived working-age resident who needs a car for commuting or family logistics and who
              holds either a foreign licence or a recently exchanged UK licence. A second segment is the
              family-migration household, where a spouse or sponsor may influence budget timing even if the named driver
              is the policyholder. A third segment is the student-to-worker or early-career migrant cohort: not every
              international student drives, but the market's working-age bias and Marshmallow's historical average
              customer age of 20 to 40 fit that progression. A fourth segment is the settled migrant who has years of
              safe driving abroad but still gets treated like a new UK risk. Across all of these groups, the buyer,
              user, and payer often sit in the same household, but the adoption path is unusually document-heavy.
              Customers need a qualifying residency/address status, a usable licence, and ideally proof of claim-free
              driving history. The company then competes on whether it recognises that history, how quickly it can
              produce a quote, whether monthly instalments fit household cash flow, and whether claims or complaints
              support feels trustworthy. That is why foreign-licence acceptance, foreign no-claims recognition, and
              flexible payment timing are not small feature details — they are market-shaping conversion mechanics. The
              adjacent opportunity beyond the core immigrant segment is younger or more thin-file urban drivers, where
              current UK quote data show very high premiums and where an insurer willing to underwrite outside standard
              scorecards can still win share.
