      - number: '5.3'
        title: Trust, Privacy, and Compliance Controls
        blocks:
          - type: paragraph
            body: >
              Public trust controls are strongest at the entity and governance layer. The GFSC register says Marshmallow
              Insurance Limited is authorised to effect and carry out land-vehicle and motor-liability insurance into
              the UK, while Marshmallow’s solvency disclosures identify Marshmallow Financial Services Limited as the
              FCA-authorised broker under FRN 797672. The SFCR adds governance detail that is unusually specific for a
              private insurtech: a three-lines-of-defence model, board-level oversight through risk and underwriting
              committees, and a joint Product Oversight and Governance Committee spanning broker and carrier. [CE022]
              [CE023] [CE025] [CE026]

              Privacy and fraud controls are visible, but mostly through legal disclosures rather than a dedicated trust
              centre or security-certification page. Marshmallow’s privacy policy says it collects call recordings,
              live-chat messages, device and usage telemetry, and it names CIFAS, the Insurance Fraud Bureau, Ravelin,
              LexisNexis, Onfido, price-comparison sites, and OEM vehicle-data providers as external data sources. It
              also says OEM vehicle data can include mileage, location, speed, trip duration, and other usage metrics.
              That is enough to confirm a meaningful anti-fraud and identity-verification layer, but not enough to
              validate public security certifications, uptime commitments, or incident-management discipline. [CE021]
              [CE027] [CE028] [CE029] [CE044]
