      - number: '4.2'
        title: Public traction, underwriting economics, and scope-mismatch in the numbers
        blocks:
          - type: paragraph
            body: >-
              Public traction is now strong enough to support the view that Marshmallow has moved beyond early
              experimentation, but the disclosed metrics still require scope discipline. UKTN reported £184m of 2023
              turnover, losses cut to roughly £0.2m, and first-year EBITDA positivity since the insurer launch. The 2024
              SFCR then moved the story forward materially: Marshmallow said the group and insurer became profitable for
              the first time, gross written premiums rose 49% year on year to £248.693m, gross earned premiums reached
              £202.895m, and underwriting profit turned positive at £4.075m. Those insurer metrics are more
              decision-useful than generic growth claims because they also show what reinsurance leaves behind: just
              £56.650m of net written premium and £40.576m of net earned premium, against £29.931m of net claims
              incurred. That picture supports a business that is becoming more disciplined, but still depends heavily on
              treaty structure and claims execution. External sources add scale signals rather than clean financial
              statements. By 2025 Marshmallow was disclosing more than one million insured drivers and a run rate above
              $500m, while Sacra estimated 2024 group revenue at £289.4m and said broker-entity EBITDA was positive. The
              result is a credible but mixed-quality public model: real growth, real underwriting improvement, but still
              no clean consolidated bridge.
