      - number: '4.3'
        title: Capital adequacy, financing package, and regulatory drag
        blocks:
          - type: paragraph
            body: >-
              Marshmallow’s balance-sheet picture is directionally stronger than most private insurtechs because it now
              has both disclosed solvency resources and fresh external capital, but the structure is more complex than a
              simple equity cushion. The 2024 SFCR says MTL contributed £10.2m of capital to the insurer during 2024 and
              that Swiss Re added £5m of Tier 2 subordinated debt in September 2024 at 11% interest, maturing in 2034.
              As of year-end, the group reported 216% solvency coverage, £70.945m of eligible own funds, and £32.823m of
              SCR. After year-end, the same filing said MTL raised £30m of Series C equity at just over $2bn valuation
              and that MFSL separately received £40m of debt funding from BlackRock/CLP, with part of the proceeds
              refinancing TriplePoint. External coverage rounded that package to roughly $90m, split about evenly
              between equity and debt. That is enough to support product expansion, but it also means Marshmallow’s
              growth is now explicitly debt-assisted. The adverse side is equally important. The SFCR records a 2024
              GFSC settlement over uncontrolled premium growth, UKTN reported a £200k fine, Companies House shows a new
              secured charge with fixed and floating charges plus a negative pledge, and customer-service risk remains
              visible through Ombudsman decisions and high uphold rates cited by Finder. Capital looks adequate today;
              conduct, leverage, and reinsurance concentration are the reasons it still needs careful underwriting.
