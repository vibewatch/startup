companyProfile:
  summary: >-
    Marshmallow is a London-based late-stage private insurtech founded in 2017 by Oliver and Alexander Kent-Braham. It
    built a differentiated UK motor-insurance wedge by underwriting newcomers and other thin-file drivers more fairly
    than mainstream incumbents, then expanded the relationship into van insurance, home insurance, and direct car
    finance. By 2025-2026, public evidence supported real scale — over one million insured drivers, a $500M turnover run
    rate, 700 employees across London and Budapest, first-time 2024 profitability, and 216% group solvency coverage —
    but conduct, capital-structure, and disclosure risk still matter.
