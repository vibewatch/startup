      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Marshmallow's market has a durable driver and a stubborn constraint set. The durable driver is that the UK
              continues to receive large migrant inflows even after the post-2023 slowdown, and incumbent underwriting
              still struggles with foreign driving history. TechCrunch's 2025 reporting on Marshmallow's one million
              insured drivers and profitable run rate suggests the wedge is commercially real, not just mission
              branding. At the same time, sector economics remain difficult. EY expects UK motor insurers to move from a
              97% net combined ratio in 2024 to 101% in 2025 and 111% in 2026, meaning the industry can be loss-making
              even while customers feel prices are still high. ABI, FCA, the Taskforce, and Which all point to the same
              culprits: labour and parts inflation, theft severity, more complex vehicles, hire and repair friction, and
              persistent claims-cost growth. Complaints pressure is also not trivial. FCA market-level complaints still
              show motor and transport among the biggest complaint groups, FOS logged 2,843 car or motorcycle insurance
              complaints in one quarter, and Marshmallow's own complaints policy escalates unresolved matters to the
              Ombudsman after eight weeks. The strongest open diligence gap is not whether a market exists. It is
              whether public data can isolate the subset of foreign-born residents who both need a car and clear
              licensing, documentation, affordability, and underwriting hurdles. Without Marshmallow cohort data on
              quote requests, conversion, loss ratios, and retention by newcomer tenure or nationality, investors can
              describe the niche convincingly but cannot publish a clean public SAM or SOM with high confidence.
