  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Conduct/regulatory recurrence and claims-service quality are the highest-likelihood/highest-impact risks; routine
      litigation and historical IP disputes sit lower.
    data:
      columns:
        - Critical impact
        - High impact
        - Moderate impact
      rows:
        - label: High likelihood
          values:
            - tone: negative
              label: Repeat conduct or complaint-driven regulator action
            - tone: negative
              label: Claims-service breakdown and cancellation / marker disputes
            - tone: neutral
              label: Ongoing hiring and governance transition strain
        - label: Medium likelihood
          values:
            - tone: negative
              label: Treaty repricing or debt-structure tightening
            - tone: negative
              label: Expansion outpaces controls across lending / new geographies
            - tone: neutral
              label: Employment-litigation drag or data-handling control gap
        - label: Low likelihood
          values:
            - tone: neutral
              label: Historical IP / TOBA dispute re-escalates materially
            - tone: neutral
              label: Routine bodily-injury litigation becomes unusual
            - tone: positive
              label: Complaint intensity improves while reinsurance diversification continues
    approximationNotes: >-
      Heatmap positions are synthesis judgments derived from public evidence and are intended for prioritisation, not
      actuarial probability estimates.
