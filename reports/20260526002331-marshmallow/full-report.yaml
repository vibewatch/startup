      - number: '8.2'
        title: Current Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The current entry point is defined by two disclosed marks. First, Marshmallow's 2021 Series B made the
              company a unicorn at just over $1.25 billion. Second, the 2025 Series C took that mark to just over $2
              billion, with Portage and the company both describing the round as mixed equity and debt. That means
              investors are not buying a clean equity-only growth story: the same period also produced a new outstanding
              secured charge at Marshmallow Financial Services and, per both the SFCR and Sacra, meaningful debt
              financing that refinanced older borrowings.


              Entry discipline therefore depends on what investors think the $2 billion mark is buying. It is buying
              genuine scale, but not full transparency. Public sources still do not disclose current cash, runway,
              liquidation preferences, or a clean consolidated bridge from carrier underwriting to group revenue and
              free cash flow. Sacra's 2024 estimate and UKTN's 2023 turnover report are directionally useful, yet they
              are not substitutes for audited group accounts and a cap-table summary. A disciplined investor should
              treat the headline valuation as an upper bound for today's public-evidence case, not as proof that
              downside is limited. The price can only be defended if Marshmallow keeps compounding growth while proving
              that conduct, debt, and reinsurance risks are not eroding the quality of that growth.
