      - number: '6.2'
        title: Adoption trajectory and evidence of real usage
        blocks:
          - type: paragraph
            body: >-
              Public adoption proof is materially stronger than the company retention proof. Multiple third-party
              sources published around the April 2025 financing say Marshmallow had already insured roughly one million
              drivers or customers, versus only 100,000 people in 2021. Those same sources paired the customer-scale
              claim with a turnover run rate above $500 million, which makes the adoption claim look commercially
              meaningful rather than cosmetic. Sacra gives a similar growth narrative, estimating that Marshmallow
              crossed one million insured drivers by 2024. The company own acquisition proof is narrower but still
              useful. Its official pricing notes say UK newcomers saved an average of £392 versus the second-cheapest
              Confused.com quote across 4,304 policies sold in January to June 2025, and that a 2024 survey of 619
              newcomer policyholders found Marshmallow cheapest for 83% of respondents. The mobile surface reinforces
              that there is real post-purchase engagement: the iPhone app listing says to join over 50,000
              Marshmallowers, while the App Store reviews page showed a 4.9 out of 5 rating from 30,000 ratings on the
              run date. The dedicated claims page also says Marshmallow has paid £66 million or more in accident
              support, which strengthens the case that customer activity is not just quoting volume but a real
              claims-servicing book. Still, these are not the same metric. One million insured drivers, 50,000 app
              users, 30,000 ratings, and comparison-site pricing cohorts all show adoption from different angles, but
              they do not cleanly answer how many policies renew, how many households buy more than one product, or how
              much of growth is concentrated in price-comparison channels.
