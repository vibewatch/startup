      - number: '7.3'
        title: Capital, Reinsurance, and Partner Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Marshmallow’s financial risk is now more nuanced than “can it raise money?” because the company has both
              improved solvency and introduced more explicit partner dependency. The 2024 SFCR shows group solvency
              coverage at 216% with £70.945m of eligible own funds against a £32.823m SCR, plus a £10.2m capital
              contribution into the insurer during 2024. That is meaningful headroom. But the same filing makes clear
              that Marshmallow’s underwriting model is structurally tied to quota-share and excess-of-loss reinsurance.
              Net written premium is negative because treaty costs exceed gross premium, with economics partly restored
              through ceding commission. Put differently: the business model works with reinsurance, not without it.


              The concentration story is improving, not disappearing. Marshmallow moved from adding a second quota-share
              partner in 2023 to adding a fourth partner in 2024, and the panel is described as A-rated with pay-as-paid
              mechanics and cash-call rights. That reduces counterparty concentration risk, but it still leaves the
              company dependent on reinsurer appetite, pricing, and claims-payment reliability. Swiss Re is both a
              positive and a dependency: it provided £5m of Tier 2 subordinated debt at 11% and is itself well
              capitalised, yet the presence of subordinated debt inside the capital stack means growth is already being
              supported by external balance-sheet partners rather than pure internal cash generation.


              The 2025 financing package reinforced this point. TechCrunch reported the fresh $90m raise was roughly
              half equity and half debt, and Companies House shows a new fixed-and-floating-charge package with a
              negative pledge in favour of GLAS as security agent. That is not a distress signal by itself, but it does
              mean Marshmallow is now both regulated and leveraged in ways that make complaints leakage, reserve
              pressure, or treaty repricing more consequential.
