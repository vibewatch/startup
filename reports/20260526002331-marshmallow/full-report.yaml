  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Marshmallow should not be sized against a vague “all insurance” or even an undifferentiated “all motor”
              TAM. The relevant market is UK private motor insurance for residents who need legally valid cover and who
              are priced using information about the driver rather than just the vehicle. Marshmallow's own product
              pages make the commercial wedge explicit: it focuses on UK newcomers, accepts licences from all countries
              for a period, recognises foreign claim-free driving evidence, and sells only fully comprehensive cover.
              That means the included spend is recurring private motor premium paid by UK residents who can legally
              drive and who need underwriting, claims service, and complaints handling that fits a non-standard or
              thin-file profile. The excluded spend is just as important. Short-stay visitors and non-residents sit
              outside Marshmallow's own residency gate, and adjacent products such as unsecured lending, home insurance,
              mobility subscriptions, or commercial fleet are not this chapter's core market. The main substitute is not
              “no insurance,” because insurance is mandatory. The real substitute is buying standard cover from an
              incumbent that prices the customer as if their useful driving history began only after arrival in the UK,
              plus the lowest-cover options offered elsewhere to buyers under acute budget stress. Marshmallow's
              category therefore sits inside the broader UK motor market but outside the broadest personal-lines frame:
              it is regulated, compulsory, price-sensitive insurance sold to residents whose underwriting files are
              unusually incomplete by UK market standards.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM031
              - CM041
