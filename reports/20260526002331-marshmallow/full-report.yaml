      - number: '5.4'
        title: Maturity, Expansion Signals, and Risks
        blocks:
          - type: paragraph
            body: >
              Routine product quality signals are good. The App Store listing showed a 4.9/5 score from 30k ratings at
              fetch time, the listing claims 50,000+ “Marshmallowers,” and the Trustpilot archive showed a 4.2/5 score
              from nearly 40,000 reviews. Live engineering roles also suggest real organisational maturity: the company
              now describes dedicated Acquisition, Retention, and Claims tribes, serves tens of thousands of policies
              through the mobile surface, and says it has insured more than one million drivers while scaling beyond its
              original car-insurance product. External reviews add corroborating evidence that Marshmallow now spans van
              insurance and adjacent financial products, not just one migrant motor policy. [CE030] [CE033] [CE038]
              [CE039] [CE040] [CE041] [CE042]

              The main risk is that edge-case servicing appears weaker than routine servicing. Reviews.io and review
              articles repeatedly describe claims delays, overreliance on live chat or email after FNOL, limited
              escalation by phone, and frustration when documentation or liability is disputed. Those complaints line up
              with the operating model visible in public sources: outsourced claims handling, outsourced repair
              fulfilment, broker/carrier handoffs, and a product that still lacks public status pages, API docs, or
              independently disclosed security certifications. The result is a chapter verdict of “mature digital
              workflow, but still partner- and process-dependent in the hard parts of the journey.” [CE031] [CE032]
