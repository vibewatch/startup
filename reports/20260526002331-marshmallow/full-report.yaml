      - number: '4.4'
        title: Financial verdict, revenue quality, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The investable takeaway is positive on direction and incomplete on proof. Marshmallow has crossed several
              public thresholds that matter: first-time profitability in 2024, large enough premium scale to matter in
              UK motor, disclosed solvency headroom, and a 2025 financing package that gives it room to launch adjacent
              products. Revenue quality also looks better than a pure lead-gen broker because the group captures
              underwriting economics, float income, and some ancillary distribution margin. But the public record is
              still not underwriter-ready. It does not disclose consolidated cash, monthly burn, runway, realized
              revenue mix across carrier versus broker economics, or the cohort-level CAC and payback data needed to
              judge whether rapid growth is genuinely capital efficient. Even the strongest published revenue numbers
              come from different scopes: company-quoted run rate, broker turnover, insurer premium, and analyst
              estimates. The right conclusion is that Marshmallow appears better funded and operationally stronger than
              many private insurtech peers, but still requires private-diligence work on liquidity, margin composition,
              complaints-cost leakage, reinsurance dependency, and debt covenants before the financial case can be
              called fully underwritten.
