artifact: financials
slug: marshmallow
runDate: '2026-05-26'
company:
  name: Marshmallow
chapter:
  number: 4
  title: Financials
  summary: >-
    Marshmallow now looks like a real underwriting business, not just a growth story: the 2024 SFCR says the group became profitable for the first time, the insurer wrote £248.7m of gross premium, and group solvency coverage stood at 216%. But the public record still mixes broker turnover, carrier premium, analyst-estimated group revenue, and 2025 run-rate claims, leaving cash, burn, revenue mix, and CAC/payback too opaque for full underwriting.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing surfaces, and recognition mechanics
    body: >-
      Marshmallow’s public financial story starts with the fact that it is a vertically integrated insurer-broker, not a SaaS company. The group’s Gibraltar carrier, Marshmallow Insurance Limited, underwrites the risk, while Marshmallow Financial Services Limited distributes policies and related add-ons into the UK market via large price comparison sites. That structure matters because public “top line” can refer to different things: broker turnover, carrier gross written premium, net retained premium after reinsurance, investment income on insurer float, or analyst-estimated consolidated revenue. Pricing is also individualized rather than list-priced. Marshmallow’s homepage is transparent about the commercial proposition—pricing based on overseas driving history, fully comprehensive cover only, multiple plan tiers, and flexible monthly payments—but it does not publish a static tariff card or realized premium mix. The strongest public value signal is not average premium; it is the company’s claim that UK newcomers saved an average of £392 versus the second-cheapest Confused.com quote in a January-to-June 2025 cohort. Financially, the key recognition issue is that reinsurance commissions and float income are material enough that gross premium alone overstates how much risk and profit Marshmallow retains on balance sheet.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI038, CI046, CI049]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-traction-and-unit-economics
    title: Public traction, underwriting economics, and scope-mismatch in the numbers
    body: >-
      Public traction is now strong enough to support the view that Marshmallow has moved beyond early experimentation, but the disclosed metrics still require scope discipline. UKTN reported £184m of 2023 turnover, losses cut to roughly £0.2m, and first-year EBITDA positivity since the insurer launch. The 2024 SFCR then moved the story forward materially: Marshmallow said the group and insurer became profitable for the first time, gross written premiums rose 49% year on year to £248.693m, gross earned premiums reached £202.895m, and underwriting profit turned positive at £4.075m. Those insurer metrics are more decision-useful than generic growth claims because they also show what reinsurance leaves behind: just £56.650m of net written premium and £40.576m of net earned premium, against £29.931m of net claims incurred. That picture supports a business that is becoming more disciplined, but still depends heavily on treaty structure and claims execution. External sources add scale signals rather than clean financial statements. By 2025 Marshmallow was disclosing more than one million insured drivers and a run rate above $500m, while Sacra estimated 2024 group revenue at £289.4m and said broker-entity EBITDA was positive. The result is a credible but mixed-quality public model: real growth, real underwriting improvement, but still no clean consolidated bridge.
    claimRefs: [CI014, CI015, CI025, CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038, CI039, CI042, CI043, CI051]
    tableRefs: [TI003]
    figureRefs: [FI002, FI003]
  - id: capital-adequacy-and-financing
    title: Capital adequacy, financing package, and regulatory drag
    body: >-
      Marshmallow’s balance-sheet picture is directionally stronger than most private insurtechs because it now has both disclosed solvency resources and fresh external capital, but the structure is more complex than a simple equity cushion. The 2024 SFCR says MTL contributed £10.2m of capital to the insurer during 2024 and that Swiss Re added £5m of Tier 2 subordinated debt in September 2024 at 11% interest, maturing in 2034. As of year-end, the group reported 216% solvency coverage, £70.945m of eligible own funds, and £32.823m of SCR. After year-end, the same filing said MTL raised £30m of Series C equity at just over $2bn valuation and that MFSL separately received £40m of debt funding from BlackRock/CLP, with part of the proceeds refinancing TriplePoint. External coverage rounded that package to roughly $90m, split about evenly between equity and debt. That is enough to support product expansion, but it also means Marshmallow’s growth is now explicitly debt-assisted. The adverse side is equally important. The SFCR records a 2024 GFSC settlement over uncontrolled premium growth, UKTN reported a £200k fine, Companies House shows a new secured charge with fixed and floating charges plus a negative pledge, and customer-service risk remains visible through Ombudsman decisions and high uphold rates cited by Finder. Capital looks adequate today; conduct, leverage, and reinsurance concentration are the reasons it still needs careful underwriting.
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI040, CI041, CI045, CI047, CI048, CI050, CI052]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: verdict-and-diligence-blockers
    title: Financial verdict, revenue quality, and diligence blockers
    body: >-
      The investable takeaway is positive on direction and incomplete on proof. Marshmallow has crossed several public thresholds that matter: first-time profitability in 2024, large enough premium scale to matter in UK motor, disclosed solvency headroom, and a 2025 financing package that gives it room to launch adjacent products. Revenue quality also looks better than a pure lead-gen broker because the group captures underwriting economics, float income, and some ancillary distribution margin. But the public record is still not underwriter-ready. It does not disclose consolidated cash, monthly burn, runway, realized revenue mix across carrier versus broker economics, or the cohort-level CAC and payback data needed to judge whether rapid growth is genuinely capital efficient. Even the strongest published revenue numbers come from different scopes: company-quoted run rate, broker turnover, insurer premium, and analyst estimates. The right conclusion is that Marshmallow appears better funded and operationally stronger than many private insurtech peers, but still requires private-diligence work on liquidity, margin composition, complaints-cost leakage, reinsurance dependency, and debt covenants before the financial case can be called fully underwritten.
    claimRefs: [CI013, CI038, CI040, CI041, CI042, CI043, CI045, CI047, CI048, CI051, CI052]
    tableRefs: [TI005]
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Entity / scope, Current public value or status, Revenue quality, Diligence ask]
    rows:
      - [Carrier premium revenue, "Motor policies underwritten by MIL and earned over the coverage period", "Marshmallow Insurance Limited", "2024 gross written premium £248.693m; gross earned premium £202.895m", "High-quality insurance top-line signal, but insurer-only scope", "Request audited consolidated bridge from carrier premium to group revenue"]
      - [Retained premium after reinsurance, "Net premium left after quota-share and excess-of-loss treaties", "MIL", "2024 net written premium £56.650m; net earned premium £40.576m", "Critical for retained economics, but not enough alone to infer margin", "Request treaty terms, ceded rate, and ceding-commission mechanics"]
      - [Reinsurance commissions, "Quota-share partners pay ceding commission back to MIL", "MIL", "Explicitly described as economically important; public narrative amount undisclosed", "Material but opaque; can offset negative-looking net premium optics", "Request treaty-level commission percentages and sliding-scale structure"]
      - [Investment income on float, "Bond and money-market returns on insurer assets", "MIL", "£1.751m in 2024 investment returns", "Useful but interest-rate sensitive rather than core underwriting revenue", "Request investment portfolio size, duration, and yield sensitivity"]
      - [Broker and arrangement revenue, "MFSL distributes Marshmallow policies and related add-ons", "MFSL / group", "UKTN reported £184m of 2023 turnover; Sacra says FY2024 MFSL turnover was £81.3m", "Important but entity scope differs from carrier premium and analyst revenue estimates", "Request FY2024/FY2025 broker accounts plus intercompany eliminations"]
      - [Adjacency and cross-sell, "Van cover today; lending, motor finance, and home insurance funded for expansion", "Group", "2025 financing materials say new products are a key use of funds", "Potentially attractive for future monetization, but current contribution undisclosed", "Request 2025-2026 revenue mix by product line and cohort attachment"]
    notes: Public top-line disclosure mixes insurer premium, broker turnover, analyst estimates, and company-quoted run rate. Rows separate those scopes rather than forcing a single revenue number.
    claimRefs: [CI010, CI011, CI013, CI021, CI022, CI027, CI033, CI034, CI037, CI038, CI042, CI043, CI045]
  - id: TI002
    title: Pricing / monetization table
    columns: [Public pricing signal, Value or status, What it implies, Revenue-quality implication, Source / gap]
    rows:
      - ["Newcomer savings claim", "Average £392 versus the second-cheapest Confused.com quote in Jan-Jun 2025 cohort", "Marshmallow competes on value for new-to-UK drivers rather than on brand legacy", "Marketing proof of demand, not realized average premium or margin", "Homepage claim; need quoted-premium distribution and bind-rate by cohort"]
      - ["Alternative-data underwriting", "Whole driving history from any country and non-UK licences accepted for 12 months", "Pricing engine is designed to widen the eligible pool and change risk selection", "Could improve conversion and selection quality if fraud and claims models hold", "Homepage and Finder corroborate product positioning; need loss ratio by migrant cohort"]
      - ["Payment model", "Flexible monthly payments and user-selected payment dates", "Instalment options may support conversion and affordability", "Economics depend on APR, fee load, and missed-payment behavior, which are undisclosed", "Need financing-fee take rate, arrears data, and monthly-plan mix"]
      - ["Cover architecture", "Fully comprehensive only; multiple plans and optional extras", "Marshmallow is not competing as a bare-minimum third-party product", "Higher expected premium and add-on mix, but realized plan mix is undisclosed", "Need policy count and premium by Lightest/Essential/Original/Plus or current equivalents"]
      - ["Claims friction pricing", "Finder cited up to £75 cancellation fees and a typical £250 claims excess", "Some economics are protected through fees and customer cost-sharing", "Useful for loss sharing, but conduct risk rises if service quality is weak", "Need fee revenue, excess distribution, and complaint incidence by fee type"]
    notes: Marshmallow does not publish a static tariff table. Public pricing evidence is therefore limited to value claims, coverage tiers, fees, and structural underwriting cues rather than realized premiums.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI046]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value / status, Confidence, Why it matters, Diligence ask]
    rows:
      - [2024 gross written premium, "£248.693m", Medium, "Best disclosed measure of insurer top-line scale", "Reconcile to consolidated revenue and split by policy cohort"]
      - [2024 gross earned premium, "£202.895m", Medium, "Closer than written premium to income statement timing", "Bridge earned premium to underwriting result by accident year"]
      - [2024 net earned premium, "£40.576m", Medium, "Shows how much premium Marshmallow actually retains after reinsurance", "Request ceded-premium and ceding-commission waterfall"]
      - [2024 gross claims incurred, "£158.766m", Medium, "Claims burden is the core determinant of underwriting profitability", "Request loss ratio by cohort, channel, and renewal status"]
      - [2024 net claims incurred, "£29.931m", Medium, "Highlights the extent to which treaties absorb volatility", "Request treaty attachments, limits, and counterparty mix"]
      - [2024 underwriting result, "£4.075m profit", Medium, "Confirms that 2024 was a real underwriting inflection point", "Request quarterly trend and sensitivity to claims inflation"]
      - [2024 investment returns, "£1.751m", Medium, "Float income supports profitability but is less durable than underwriting margin", "Request portfolio composition, unrealized gains, and rate sensitivity"]
      - [2024 estimated group revenue, "£289.4m (Sacra estimate)", Low, "Useful directional benchmark because consolidated revenue is not otherwise published", "Request audited group revenue and entity elimination schedule"]
      - [FY2024 MFSL turnover / EBITDA / gross margin, "£81.3m / £4.63m / 83% (Sacra read-through)", Low, "Suggests broker economics can be positive even before full group consolidation", "Request filed MFSL 2024 accounts or management accounts extract"]
      - [Public CAC / payback, null, Low, "Scale and run-rate claims do not answer capital efficiency", "Request channel-level CAC, renewal rates, and payback by cohort"]
      - [Cash / runway, null, Low, "Essential to underwrite financing dependency", "Request current cash balance, monthly burn, and 12-month liquidity forecast"]
    notes: Rows intentionally separate carrier metrics, broker read-through, and analyst estimates. Null rows mark material economics that remain private rather than absent because they do not matter.
    claimRefs: [CI014, CI015, CI026, CI033, CI034, CI035, CI036, CI037, CI042, CI043, CI051]
  - id: TI004
    title: Capital adequacy table
    columns: [Item, Value / status, As of, Confidence, Implication / gap]
    rows:
      - [Group solvency coverage, "216% with £70.945m eligible own funds and £32.823m SCR", '2024-12-31', Medium, "Clear evidence of regulatory headroom at year-end, though not a substitute for consolidated cash"]
      - [Equity support into insurer, "£10.2m capital contribution from MTL", '2024-12-31', Medium, "Shows insurer growth still needed shareholder support during 2024"]
      - [Tier 2 insurer debt, "£5m Swiss Re subordinated debt at 11%, due 2034-09-04", '2024-09-04', Medium, "Adds regulatory capital but also introduces expensive fixed-cost funding"]
      - [Series C equity, "£30m raised at just over $2bn valuation", '2025-05', Medium, "Fresh equity supports adjacent-product investment and capital flexibility"]
      - [Broader 2025 financing package, "~$90m total per external coverage, roughly half equity and half debt", '2025-04-14', Medium, "Useful shorthand for investors, but entity-level allocation still matters more than headline size"]
      - [MFSL debt funding, "£40m from BlackRock/CLP; part used to refinance TriplePoint", '2025-05', Medium, "Growth is now partly debt-assisted rather than equity-only"]
      - [Security package, "2025 Companies House charge includes fixed charge, floating charge, and negative pledge", '2025-03-10', High, "Lender controls may matter if growth, complaints costs, or reinsurance terms worsen"]
      - [Current cash balance, null, '2026-05-26', Low, "No public cash balance disclosed in the sources reviewed"]
      - [Monthly burn / runway, null, '2026-05-26', Low, "No public burn or runway disclosure despite better solvency visibility"]
    notes: The table focuses on forward capital adequacy rather than replaying the whole funding chronology. It separates insurer capital support, holding-company equity, and broker debt because those are not interchangeable.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023, CI040, CI041, CI051]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing metric, Why it matters, Current public substitute, Exact diligence path]
    rows:
      - [Consolidated cash on hand, "Without current cash the solvency ratio cannot be translated into runway or refinancing risk", "Year-end solvency coverage and fresh 2025 financing headlines", "Request latest consolidated balance sheet and weekly treasury dashboard"]
      - [Monthly burn and 12-month runway, "Needed to test how quickly debt and equity proceeds are being consumed", "2025 financing package plus 2024 profitability milestone", "Request monthly management accounts and board liquidity model"]
      - ["Revenue mix across carrier, broker, float, and new products", "The public record mixes incompatible scopes and masks revenue quality", "Broker turnover, insurer premium, analyst estimates, and company run rate", "Request entity-by-entity P&L bridge with elimination schedule"]
      - ["Cohort CAC, payback, and channel economics", "Price-comparison distribution can be efficient or extremely expensive depending on renewal behavior", "1m drivers and $500m run-rate are scale proxies only", "Request acquisition cost by channel plus 12/24-month cohort retention"]
      - [Reinsurance treaty economics and concentration, "Quota-share structure drives retained premium, margin, and balance-sheet volatility", "Narrative disclosure that ceding commissions matter, plus analyst concentration warning", "Request treaty terms, ceding commission formulas, and counterparty limits"]
      - [Complaints-cost and redress reserve detail, "Conduct leakage can erase thin underwriting gains and create regulatory overhang", "Ombudsman case, Finder uphold-rate data, and analyst-reported redress reserve", "Request FCA complaint returns, reserve memo, and audited note supporting any provision"]
      - [Debt covenants and borrowing-base mechanics, "Security package and lender controls matter in a downside case", "Charge registration and narrative debt disclosure only", "Request full facility agreement, covenant model, and amortization profile"]
    notes: Public disclosure is now strong enough to show scale, profitability direction, and capital support, but still not strong enough to replace private diligence on liquidity, margin composition, and lender constraints.
    claimRefs: [CI038, CI040, CI041, CI047, CI048, CI051, CI052]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Marshmallow’s revenue bridge runs from migrant-focused digital acquisition into broker placement, carrier premium, reinsurance-adjusted retention, and float income, with adjacent products widening monetization over time.
    data:
      nodes:
        - id: quote
          label: Migrant-focused quote acquisition
          detail: New-to-UK customers are acquired through direct digital funnels and comparison sites with pricing based on whole driving history.
          claimRefs: [CI001, CI002, CI012]
        - id: broker
          label: MFSL broker placement
          detail: FCA-regulated MFSL places Marshmallow-branded policies and related add-ons.
          claimRefs: [CI008, CI011]
        - id: carrier
          label: MIL underwriting
          detail: Gibraltar-based MIL writes the risk and records written and earned premium.
          claimRefs: [CI009, CI010, CI013, CI033]
        - id: reins
          label: Reinsurance and ceding commission
          detail: Quota-share and XOL treaties reduce retained premium but generate ceding-commission income.
          claimRefs: [CI034, CI038]
        - id: float
          label: Float investment income
          detail: Insurer assets are invested mainly in low-risk fixed-income and money-market assets.
          claimRefs: [CI013, CI037]
        - id: adj
          label: Adjacency monetization
          detail: Van cover exists today and 2025 funding is aimed at lending, motor finance, home insurance, and expansion.
          claimRefs: [CI045]
      edges:
        - from: quote
          to: broker
          label: converts into
        - from: broker
          to: carrier
          label: places policy with
        - from: carrier
          to: reins
          label: transfers risk through
        - from: carrier
          to: float
          label: creates premium float for
        - from: broker
          to: adj
          label: can cross-sell into
    approximationNotes: This is a qualitative operating-model bridge. It shows where revenue and gross profit can originate, not the realized share of each stream in consolidated accounts.
    claimRefs: [CI001, CI002, CI008, CI009, CI011, CI012, CI013, CI033, CI034, CI037, CI038, CI045]
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: Public insurer metrics suggest Marshmallow’s 2024 profit inflection ran from higher premium scale and better pricing into improved claims performance, then through a reinsurance-heavy retained-premium model into underwriting and investment profit.
    data:
      nodes:
        - id: altdata
          label: Alternative-data pricing
          detail: Overseas driving history and migrant-focused pricing broaden the quote funnel.
          claimRefs: [CI002, CI003]
        - id: scale
          label: Higher written premium scale
          detail: Gross written premium rose 49% and reached £248.693m in 2024.
          claimRefs: [CI032, CI033]
        - id: retained
          label: Lower retained premium after treaties
          detail: Net earned premium was only £40.576m after reinsurance.
          claimRefs: [CI034, CI038]
        - id: claims
          label: Claims and fraud improvement
          detail: Management tied 2024 profitability to pricing, claims-handling, and fraud-intelligence upgrades.
          claimRefs: [CI015]
        - id: uw
          label: Underwriting profit
          detail: MIL moved from a 2023 loss to £4.075m of 2024 underwriting profit.
          claimRefs: [CI036]
        - id: invest
          label: Float contribution
          detail: Investment returns added £1.751m in 2024.
          claimRefs: [CI037]
        - id: profit
          label: First-time 2024 profitability
          detail: The group and insurer said they became profitable for the first time in 2024.
          claimRefs: [CI014]
      edges:
        - from: altdata
          to: scale
          label: supports growth in
        - from: scale
          to: retained
          label: is filtered by
        - from: retained
          to: claims
          label: must cover
        - from: claims
          to: uw
          label: improves into
        - from: uw
          to: invest
          label: is supplemented by
        - from: invest
          to: profit
          label: contributes to
    approximationNotes: The bridge uses public insurer metrics and management commentary rather than private cohort data. It should be read as causal direction, not a full statutory income statement.
    claimRefs: [CI002, CI003, CI014, CI015, CI032, CI033, CI034, CI036, CI037, CI038]
  - id: FI003
    title: Financial estimate range
    type: range
    layout: standard
    summary: The visible top line, financing, and valuation bands are wide because public numbers come from different scopes—insurer premium, analyst-estimated group revenue, and company-quoted financing headlines.
    data:
      items:
        - label: 2024 public top-line band
          low: 202.895
          mid: 248.693
          high: 289.4
          unit: GBP m
          note: Low is gross earned premium, mid is gross written premium, and high is Sacra’s estimated 2024 group revenue.
        - label: 2025 financing package band
          low: 30
          mid: 40
          high: 70
          unit: GBP m
          note: Low is disclosed Series C equity, mid is MFSL debt funding, and high is the simple GBP sum of those disclosed components.
        - label: 2021-2025 valuation band
          low: 1.25
          mid: 2.0
          high: 2.05
          unit: USD bn
          note: Low is the 2021 Series B valuation and the upper band reflects repeated 2025 reporting that the company was worth just over or above $2bn.
    approximationNotes: The range figure is intentionally scope-aware. It does not claim that the low and high points are interchangeable definitions of revenue or value; it shows the public band investors must reconcile during diligence.
    claimRefs: [CI021, CI023, CI026, CI033, CI042, CI050]
  - id: FI004
    title: Capital intensity / cash-flow map
    type: flow
    layout: wide
    summary: Marshmallow’s cash-flow map combines insurer capital support, subordinated debt, holding-company equity, and broker leverage, while regulatory and complaints drag act as potential claimants on that capital.
    data:
      nodes:
        - id: eq24
          label: 2024 insurer equity support
          detail: MTL contributed £10.2m to MIL during 2024.
          claimRefs: [CI018]
        - id: swissre
          label: 2024 Tier 2 debt
          detail: Swiss Re added £5m of subordinated debt at 11% to support insurer growth.
          claimRefs: [CI019, CI020]
        - id: seriesc
          label: 2025 Series C equity
          detail: MTL raised £30m at just over $2bn valuation.
          claimRefs: [CI021]
        - id: debt25
          label: 2025 MFSL debt facility
          detail: MFSL received £40m of BlackRock/CLP debt and granted new security.
          claimRefs: [CI022, CI041]
        - id: refinance
          label: Refinancing use
          detail: Part of the new debt was used to repay TriplePoint.
          claimRefs: [CI022, CI023]
        - id: solvency
          label: Solvency buffer
          detail: Year-end group solvency coverage was 216% with £70.945m of eligible own funds.
          claimRefs: [CI040]
        - id: drag
          label: Regulatory and redress drag
          detail: GFSC settlement, Ombudsman outcomes, and complaint leakage can consume capital and management bandwidth.
          claimRefs: [CI016, CI017, CI047, CI048, CI052]
        - id: expansion
          label: Growth reinvestment
          detail: New capital is earmarked for home insurance, lending, motor finance, and international expansion.
          claimRefs: [CI045]
      edges:
        - from: eq24
          to: solvency
          label: supports
        - from: swissre
          to: solvency
          label: adds Tier 2 capital to
        - from: seriesc
          to: expansion
          label: funds
        - from: debt25
          to: refinance
          label: partly used for
        - from: debt25
          to: expansion
          label: also supports
        - from: solvency
          to: expansion
          label: enables
        - from: drag
          to: solvency
          label: can erode
    approximationNotes: The map is directional. It highlights where capital comes from and where it may be consumed, not a period-by-period cash waterfall.
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI040, CI041, CI045, CI047, CI048, CI052]
