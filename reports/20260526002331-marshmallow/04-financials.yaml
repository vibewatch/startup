  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: liquidity
      missingEvidence: Current consolidated cash balance, monthly burn, and a 12-month liquidity forecast.
      whyItMatters: Solvency coverage and fresh financing do not tell an investor how much runway remains or when the next fundraise could be required.
      diligencePath: Request the latest consolidated balance sheet, monthly management accounts, and board liquidity pack.
      relatedQuestionRefs: [QI020, QI021, QI025]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: A bridge from carrier premium, broker turnover, reinsurance commissions, investment income, and adjacent products to consolidated revenue.
      whyItMatters: Public top-line metrics currently mix incompatible scopes, which makes revenue quality and margin durability hard to underwrite.
      diligencePath: Request FY2024 and FY2025 management P&Ls by entity and product line with intercompany eliminations.
      relatedQuestionRefs: [QI001, QI004, QI024]
      relatedTableRefs: [TI001, TI005]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Channel-level CAC, renewal rates, payback periods, and cohort performance for new-to-UK customers.
      whyItMatters: Scale and run-rate claims do not answer whether Marshmallow’s price-comparison distribution is capital efficient.
      diligencePath: Pull acquisition-cost and retention cohorts from CRM and finance systems for direct and comparison-site channels.
      relatedQuestionRefs: [QI006, QI007, QI025]
      relatedTableRefs: [TI003, TI005]
    - type: missing-source
      severity: material
      topic: conduct-cost
      missingEvidence: Audited support for any customer redress provision and a complete FCA or Ombudsman complaints time series.
      whyItMatters: Complaint leakage and redress cost can erase thin underwriting gains and create further regulatory drag.
      diligencePath: Obtain the audited accounts note supporting any provision, FCA complaints returns, and Marshmallow’s internal reserve memo.
      relatedQuestionRefs: [QI023, QI024]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: debt-covenants
      missingEvidence: Facility agreement, covenants, amortization schedule, and any borrowing-base mechanics for the 2025 debt.
      whyItMatters: The registered security package suggests lender controls that could materially affect downside flexibility.
      diligencePath: Request the signed facility documents, covenant model, and any waiver or amendment history.
      relatedQuestionRefs: [QI018, QI025]
      relatedTableRefs: [TI004, TI005]
