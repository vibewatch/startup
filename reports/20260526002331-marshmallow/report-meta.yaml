companyProfile:
  summary: >-
    Marshmallow is a London-based late-stage private insurtech founded in 2017 by
    Oliver and Alexander Kent-Braham. It built a differentiated UK motor-insurance
    wedge by underwriting newcomers and other thin-file drivers more fairly than
    mainstream incumbents, then expanded the relationship into van insurance, home
    insurance, and direct car finance. By 2025-2026, public evidence supported
    real scale — over one million insured drivers, a $500M turnover run rate,
    700 employees across London and Budapest, first-time 2024 profitability, and
    216% group solvency coverage — but conduct, capital-structure, and disclosure
    risk still matter.
  foundedDate: '2017-10-10'
  founders:
    - name: Oliver Kent-Braham
      role: Co-founder & Co-CEO
      background: >-
        Co-founder and public-facing leader; founder coverage says he handled more
        external work including fundraising and partnerships.
      claimRefs: [CO004, CO012, CO014]
    - name: Alexander Kent-Braham
      role: Co-founder & Co-CEO
      background: >-
        Co-founder and internal product/culture leader; he was an original
        director of the regulated broker entity incorporated in 2017.
      claimRefs: [CO004, CO012, CO014, CO015]
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: >-
    Digital-first UK insurance and financial-services stack: direct car insurance
    sold through multiple cover tiers, adjacent van and home insurance, and
    direct car finance, all wrapped in app-based self-service, live chat, and a
    24/7 claims intake workflow.
  customerFocus: >-
    UK newcomers and other drivers underserved by mainstream insurers because
    their prior driving or credit history is thin in the UK; newer products also
    target van drivers, renters/homeowners, and finance borrowers from the same
    relationship base.
  businessModel: >-
    Recurring insurance revenue through Marshmallow's broker/carrier structure,
    with digitally led acquisition and servicing, plus cross-sell into home
    insurance and direct lending. The operating model still depends on
    reinsurance, debt-backed capital, and outsourced claims/repair/distribution
    partners for parts of the service chain.
  stage: Late-stage private (Series C)
  fundingStatus: >-
    Latest disclosed financing was the April 2025 $90M Series C at just over a
    $2B valuation, backed by Portage, BlackRock, and Columbia Lake Partners.
    Public sources describe the round as a mix of equity and debt and do not yet
    cleanly reconcile Marshmallow's lifetime funding total or full debt/preference
    stack.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO006, CO009, CO012, CO014, CO015, CO022, CO026, CO027, CO032, CU002, CU034, CU036, CE010, CE033, CV001, CV002, CV004, CV009]
summary:
  headline: >-
    Marshmallow has a real and differentiated UK-newcomer insurance franchise
    with credible scale and a 2024 profitability inflection, but the >$2B 2025
    mark still outruns the public disclosure needed for a buy call.
