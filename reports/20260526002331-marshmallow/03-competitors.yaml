- id: incumbents-and-adjacent-brands
  title: Incumbents, Adjacent Brands, and Short-Term Challengers
  body: 'The biggest competitive pressure on Marshmallow still comes from scaled incumbents. Admiral says it covers more than
    five million vehicles and accepted 98.9% of single-car claims in the first eleven months of 2025, while Hastings says
    it has more than three million car customers and accepted 99% of motor claims in 2024. Churchill and its parent Direct
    Line Group add another mass-market brand family with millions of customers, meaningful premium volume, telematics for
    young drivers, and broad add-on packaging. These companies are not newcomer specialists, but they bring the trust signals,
    service depth, and brand familiarity that many buyers still prefer once they can obtain a mainstream quote.


    Adjacent brands matter too. Admiral’s Veygo and app-first rival Cuvva attack specific moments in the driving journey:
    learner practice, borrowed-car use, short-term need, and fast mobile purchase. They do not replicate Marshmallow’s annual
    newcomer-underwriting wedge, but they do capture many situations where the buyer just needs legal, instant, or flexible
    cover. QuoteMeHappy shows that even mainstream digital brands now productise cover tiers cleanly enough to look modern
    and low-friction. Marshmallow therefore competes in a laddered market, not a single-category market.'
  claimRefs:
  - CP007
  - CP008
