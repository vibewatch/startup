- id: pricing-distribution-and-switching
  title: Pricing Signals, Distribution Power, and Switching Costs
  body: 'Public pricing transparency is uneven across the field. Marshmallow publishes no universal list premium, but it does
    publish a newcomer-specific benchmark: average savings of £392 versus the second-cheapest Confused.com quote for qualifying
    UK newcomers in early 2025. Hastings publishes an entry-point claim that 10% of new customers paid £291 or less in March
    2025. Cuvva is the most transparent on short-term cover, showing sample prices from £12.55 for one hour, £18.18 for one
    day, and £43.47 for one week. MoneySuperMarket, meanwhile, publishes wider market averages and argues that paying annually
    can save up to 31% versus monthly instalments.


    These signals matter because Marshmallow’s biggest commercial risk is not that a shopper cannot find alternatives; it
    is that shoppers can find them too easily. Comparison services position themselves as the default route to the cheapest
    policy, and annual motor insurance renewals are structurally shop-around moments. Marshmallow reduces friction with monthly
    instalments and a digital account, but on-demand options from Veygo and Cuvva also lower commitment for many drivers.
    In other words, Marshmallow’s underwriting edge has to overcome both incumbent scale and a market structure designed to
    make switching normal.'
  claimRefs:
  - CP003
