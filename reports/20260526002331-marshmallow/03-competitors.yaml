  - Limitation versus Marshmallow
  rows:
  - - Marshmallow
    - Direct specialist insurer
    - $2B+ valuation; 1M+ insured drivers; ~$500M run rate
    - UK newcomers and drivers with non-UK history
    - Accepts licences and claim-free proof from any country; annual primary cover
    - Much smaller service and brand footprint than top incumbents
  - - Admiral
    - Mass-market incumbent
    - 5M+ cars and vans covered; 98.9% single-car claims acceptance claim
    - Mainstream annual motor customers
    - Broad cover menu and major claims infrastructure
    - No explicit newcomer-underwriting proposition on public page
  - - Veygo
    - Short-term sub-brand
    - Part of Admiral Group
    - Learners, new drivers, and short-duration drivers
    - Hourly to monthly rolling cover with fast digital purchase
    - UK resident / full UK licence constraint narrows newcomer fit
  - - Hastings Direct
    - Mass-market incumbent
    - 3M+ car customers; 99% motor claims accepted in 2024
    - Mainstream annual motor customers
    - Scale, claims support, app, and YouDrive telematics
    - No public newcomer-specific underwriting angle
  - - Churchill / Direct Line Group
    - Incumbent brand family
    - Millions of UK customers; £3,732m gross written premium and fees at group level
    - Mainstream motorists and young drivers
    - Brand depth, multiple products, and telematics via DriveSure
    - No public migrant or overseas-history pricing wedge
  - - QuoteMeHappy
    - Digital incumbent brand
    - Multi-tier digital packaging under a mainstream insurer brand
    - Price-sensitive digital buyers
    - Clear digital segmentation across Essentials to Premier
    - No explicit newcomer narrative or foreign-history underwriting
  - - Cuvva
    - App-first adjacent insurer
    - 15M+ policies sold; 3M+ cars insured; 5M+ app downloads
    - Temporary, borrowed-car, and flexible-use drivers
    - Short-term fully comprehensive cover with public sample pricing
    - Not an annual primary-cover specialist for migrant drivers
  - - MoneySuperMarket
    - Status-quo substitute / distributor
    - 51% of consumers could save up to £506.99 in Mar 2026
    - Renewal shoppers comparing annual policies
    - Makes switching normal and compresses insurer differentiation at quote time
    - Not an insurer and cannot underwrite Marshmallow’s niche directly
  notes: Rows combine insurer competitors, adjacent temporary-cover apps, and the comparison-site status quo because each
    can solve the same buyer job in a different way.
