  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: renewal-retention-economics
    missingEvidence: Cohort-level renewal conversion, retention, and loss-ratio data for newcomers versus mainstream cohorts.
    whyItMatters: Without cohort economics, the chapter cannot test whether Marshmallow’s underwriting wedge translates into
      durable, profitable customer retention.
    diligencePath: Request channel-level renewal win rates, retention by tenure, and loss ratios for newcomer cohorts from
      management.
  - type: missing-source
    severity: material
    topic: peer-complaints-benchmark
    missingEvidence: Comparable public complaints and ombudsman-normalised benchmarks for Admiral, Hastings, Churchill, Cuvva,
      and Marshmallow on the same basis.
    whyItMatters: The chapter can show Marshmallow-specific operational risk, but it cannot prove whether that risk is better
      or worse than major rivals on a clean like-for-like basis.
    diligencePath: Assemble FCA, ombudsman, and company-disclosed complaint datasets on a common period and per-policy denominator.
