      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：观察
            body: Marshmallow 看起来是一家真实、已规模化的细分市场保险公司，承保证明扎实，但披露的 $2bn+ 私募估值已经计入大量未来执行。要么等更好的进场价，要么等显著更好的经审计披露。
