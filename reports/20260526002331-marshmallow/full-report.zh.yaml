      - number: '2.3'
        title: 买方细分、预算归属与采用机制
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              的买方地图比简单的“移民司机”刻板印象更宽。最明显的核心买方，是刚到英国、处于工作年龄的居民；他们需要开车通勤或照顾家庭物流，并持有海外驾照或刚换发的英国驾照。第二类是家庭迁移户：配偶或担保人可能影响预算时点，即便具名司机才是投保人。第三类是从学生转为工作者、或处于职业早期的移民群体：不是每个国际学生都会开车，但市场的工作年龄偏向和
              Marshmallow 历史平均客户年龄 20–40
              岁相吻合。第四类是在英国定居的移民：他们在海外有多年安全驾驶记录，却仍被当作新的英国风险。所有这些人群中，买方、使用者和付款人往往在同一个家庭里，但采用路径异常依赖文件。客户需要符合条件的居住 /
              地址状态、可用驾照，最好还要无理赔驾驶历史证明。公司竞争的关键在于：是否认可这段历史、出报价速度多快、月付安排是否适配家庭现金流，以及理赔或投诉支持是否可信。因此，接受海外驾照、认可海外无理赔、灵活付款时点都不是小功能细节——它们是塑造市场转化的机制。核心移民细分之外的相邻机会，是更年轻或记录更薄的城市司机；当前英国报价数据显示这类人保费很高，而愿意在标准评分卡之外承保的保险公司仍能赢得份额。
