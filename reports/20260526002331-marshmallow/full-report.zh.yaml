      - number: '5.4'
        title: 成熟度、扩张信号与风险
        blocks:
          - type: paragraph
            body: >
              常规产品质量信号不错。App Store 列表在抓取时显示 30k 个评分、4.9/5 分；列表称有 50,000+ “Marshmallowers”；Trustpilot 存档显示近 40,000
              条评论、4.2/5
              分。开放工程岗位也显示真实的组织成熟度：公司现在描述了专门的获客、留存和理赔三个团队，通过移动端服务数万份保单，并称已承保超过一百万名司机，同时扩展到原始车险产品之外。外部评论进一步佐证，Marshmallow
              现在覆盖厢式货车保险和相邻金融产品，而不只是一个移民车险保单。[CE030] [CE033] [CE038] [CE039] [CE040] [CE041] [CE042]

              主要风险是，边缘情形服务看起来弱于常规服务。Reviews.io 和评论文章反复描述理赔延误、FNOL
              之后过度依赖在线聊天或邮件、电话升级有限，以及在文件或责任有争议时的挫败感。这些投诉与公开来源中的运营模型相吻合：外包理赔处理、外包维修履约、经纪 / 承保载体交接，以及仍缺少公开状态页、API
              文档或独立披露安全认证的产品。结果是本章结论：“成熟的数字流程，但旅程中的难点仍依赖合作伙伴和流程。”[CE031] [CE032] [CE043] [CE044] [CE045]
