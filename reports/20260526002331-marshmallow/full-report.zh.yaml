  customerFocus: 面向新来英国者，以及其他因为过往驾驶或信用记录在英国较薄而被主流保险公司服务不足的司机；新产品也触达同一关系基础上的厢式货车司机、租房者 / 房主和金融借款人。
  businessModel: 通过 Marshmallow 的经纪 / 承保载体结构获得经常性保险收入，获客和服务以数字化为主，并向房屋保险和直接放贷交叉销售。运营模型在服务链的部分环节仍依赖再保险、债务支持资本，以及外包理赔、维修和分销合作伙伴。
