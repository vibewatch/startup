      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景和退出准备度
        blocks:
          - type: paragraph
            body: >-
              悲观情景不是归零，但会很痛。如果 Marshmallow 的估值回到更接近上市保险公司的水平，同时债务、补救或再保险压力上升，一个合理价值区间大约是 $0.9 billion 到 $1.4
              billion。这个结果仍承认公司有真实细分市场，但也假设市场不再愿意为一家聚焦英国、资本混合且带经营行为包袱的私营平台支付接近 Lemonade 的倍数。基准情景大约是 $1.7 billion 到 $2.2
              billion：Marshmallow 继续增长，投诉没有扩散，投资人继续给它相对传统险企的溢价，但不愿高于今天估值。乐观情景大约 $2.8 billion 到 $3.4
              billion，需要的不只是故事。它需要经审计收入果断越过 $600 million，需要客户结果改善的证据，也需要证明家财险、金融或国际扩张能增长且不打穿控制。


              这些区间也塑造退出判断。最可信的近中期路径，是继续私募融资或结构化战略资本，而不是马上 IPO。公开可比公司存在，但 Marshmallow
              在现金、优先权悬顶和合并盈利能力上的披露质量，仍低于公开市场标准。这并不杀死投资，只意味着当前持有人在为一项尚未被公开证据充分承保的期权价值付费。
