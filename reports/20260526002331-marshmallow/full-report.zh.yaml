      - number: '1.2'
        title: 创始人、治理边界与领导层可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑最强的创立叙事是：Marshmallow 由双胞胎兄弟 Oliver 和 Alexander Kent-Braham 在 2017 年创立，多个独立来源也将软件工程师 David Goaté
              列为创始团队成员。官方公司材料把时间线稍微复杂化，称 Marshmallow 在 2018 年推出；更合理的读法是，这是商业上线标记，而不是否定 2017
              年创立日期。这个区分会影响后续时间线分析，因为它同时保留了法律 / 公司形成窗口和商业化 起点。


              公开角色可见度高度由创始人主导。官方页面仍把 Kent-Braham 双胞胎放在 Co-CEO 前台，较早的创始人报道描述了一个有意分工：Oliver 负责融资和外部事务，Alexander
              更聚焦内部文化和产品。更广的治理图景则更薄。Companies House 对受监管的英国经纪实体提供了有用窗口：Alexander 在公司成立时获任董事，两位创始人都在 2025 年卸任 Marshmallow
              Financial Services Limited 董事，Neil Hodges、Tanis Crosby 和 Samuel Butler 出现在当前董事记录中。同一套备案显示，Marshmallow
              Technology Ltd 是经纪实体的重大控制人。这意味着尽调可以验证受监管边界，但无法验证完整集团董事会或高管名册。因此，即便法律治理边界正在更专业化，关键人依赖仍然有意义。
