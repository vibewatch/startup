  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与谁为产品付费
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              是消费保险公司，因此买方、使用者和付款人通常是同一个家庭投保人，而不是企业账户。这让细分更取决于生活状态和产品需求，而不是具名企业客户。公司的核心细分仍是搬到英国、因本地信用档案薄或本地驾驶历史短而处于不利位置的人。官网、车险页面和新来者页面反复说，Marshmallow
              认可任何国家的驾驶历史，接受海外无理赔证据，并在抵达英国后最多 12 个月内覆盖所有国家的驾照。同一批材料还说，2018 年至 2024 年活跃 Marshmallow 车险投保人中 79%
              是新来英国者，这强烈暗示新来者驾驶者仍锚定当前客户基础。但公开界面也显示公司在拓宽。Finder 指出，一些英国出生司机现在也符合条件；Marshmallow
              已为工作车辆使用场景推出厢式货车保险，并正向同一新来者人群营销房屋保险和汽车金融。这个进展重要，因为它把客户质量从单一产品报价引擎，改造成更广的关系栈。即便如此，已披露细分在营销信息层面仍远强于收入组合层面：Marshmallow
              说明了自己想服务谁，但不公布按产品线、存续期段或获客渠道拆分的客户数量。
