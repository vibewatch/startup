  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑和反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 已不再是脆弱的概念型标的。公开证据支持它是一套真实的承保平台：超过 1 million 名投保司机，2025 年融资时披露的 $500 million 营业额运行率，2024
              年集团首次盈利，以及年末 216% 的偿付能力覆盖率。公司也证明了自己能持续扩宽产品边界：厢式货车险、家财险和直接汽车金融已经上线，2025 年融资也明确被包装为更广产品和地域扩张的燃料。这些事实让买入理由可信。


              反向逻辑不在于 Marshmallow 有没有切入点，而在于价格和脆弱性。披露的略高于 $2 billion 估值，已经把公司定价到约为自称 $500 million 运行率的 4.0x、约为 Sacra
              2024 年收入估计的 5.4x。这远高于 Admiral 和 Aviva 等上市传统险企，也更接近 Lemonade 的公开保险科技倍数；但 Marshmallow 仍是私营公司，更不透明，还带着债务 /
              股权混合融资和一项未解除的 2025 年担保押记。Ombudsman
              败诉、客户补救风险和分裂的评价数据，又进一步削弱了今天支付高价的理由。结论是观察：公司质量信号不错，但公开证据还不足以支撑在披露价格上激进进场。
