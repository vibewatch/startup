  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Marshmallow 放进模糊的“全部保险”甚至无差别的“全部车险” TAM 里估算。相关市场是英国私人车险：居民需要合法有效保障，定价依据是司机信息，而不只是车辆信息。Marshmallow
              自己的产品页面把商业切口说得很清楚：聚焦英国新来者，在一段时期内接受所有国家的驾照，认可海外无理赔驾驶证据，并且只销售全险。这意味着，纳入范围的支出是英国居民支付的经常性私人车险保费；这些居民可以合法驾驶，需要适配非标准或记录薄画像的承保、理赔服务和投诉处理。排除范围同样重要。短期访客和非居民落在
              Marshmallow
              自己的居住门槛之外；无抵押贷款、房屋保险、出行订阅或商用车队等相邻产品，也不是本章核心市场。主要替代方案不是“不买保险”，因为保险是强制的。真正的替代方案是向既有公司购买标准保障，而对方把客户定价成仿佛有用驾驶历史从抵达英国后才开始；另一个替代是预算极度紧张的买家在别处购买最低保障选项。因此，Marshmallow
              的类别位于更广的英国车险市场内部，但落在最宽泛的个人险框架之外：这是卖给居民的受监管、强制、价格敏感型保险，而这些居民的承保档案按英国市场标准异常不完整。
