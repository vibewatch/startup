  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调问题
    rows:
      - - 持续移民流入和海外出生人口存量
        - 正向
        - 当前且持续
        - 不断补充一批客户，他们的海外驾驶记录具备经济意义
        - 要求 Marshmallow 按到达年限和国籍提供队列级报价率、成单率和续保率
      - - 承认外国驾照和无赔款记录
        - 正向
        - 即时
        - 只用英国记录的承保模型会错定价，承认海外记录可提高这类客户转化
        - 要求提供海外 NCD 证明提交后报价胜出率提升的硬数据
      - - 按月分期和灵活付款日
        - 正向
        - 即时
        - 即便必须购买年度保障，也能转化现金受限的家庭
        - 量化按月付款人和按年付款人的采用率与赔付率差异
      - - 维修、人工、零件和盗窃通胀
        - 负向
        - 当前
        - 即便竞争压低费率，保费仍居高不下，保险公司利润率也被挤压
        - 要求 Marshmallow 按维修类型和盗窃严重度提供赔付成本趋势
      - - 信用租车和维修流程摩擦
        - 负向
        - 当前
        - 推高赔案严重度，拉长结案周期
        - 询问 Marshmallow 的信用租车敞口、赔案周期和车库渠道结构
      - - 驾照、居留和文件规则
        - 负向
        - 当前
        - 降低移民到达后能立即转化为有效保单的比例
        - 询问地址、身份或驾照核验失败带来的流失率
      - - 投诉和理赔服务负担
        - 负向
        - 当前
        - 信任、处理速度和救济路径会成为真实竞争变量，而不只是品牌卫生项
        - 对照市场基准，审查 Marshmallow 的投诉量、申诉维持率和 FOS 转介
      - - 行业承保经济性偏弱
        - 负向
        - 2025-2026
        - 在高成本市场里，任何保险公司补贴获客的激进程度都会受限
        - 用长期 100%+ NCR 环境压力测试 Marshmallow 的新移民细分市场
    notes: 各行把公开市场驱动因素和明确尽调问题放在一起。核心问题不是 Marshmallow 有没有真实细分市场，而是当整体车险市场仍承压时，该细分市场能否带着有吸引力的赔付率放大。
