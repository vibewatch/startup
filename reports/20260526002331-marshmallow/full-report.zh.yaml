      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的市场有一个持久驱动，也有一组顽固约束。持久驱动是：即便 2023 年后增速放缓，英国仍持续接收大量移民流入，而既有公司的承保仍难处理海外驾驶历史。TechCrunch 2025 年关于
              Marshmallow 已承保一百万名司机且年化运营已盈利的报道说明，这个切口在商业上是真实的，不只是使命品牌。与此同时，行业经济性仍然艰难。EY 预计英国车险公司的净综合成本率将从 2024 年的 97% 升至
              2025 年的 101% 和 2026 年的 111%，这意味着即便客户仍觉得价格很高，行业也可能亏损。ABI、FCA、专项工作组 和 Which
              都指向同一批元凶：人工和零部件通胀、盗窃严重度、车辆更复杂、代步车和维修摩擦，以及持续的理赔成本增长。投诉压力也不小。FCA 市场层面投诉仍显示，机动车和交通位居最大投诉组之列；FOS 在一个季度记录了
              2,843 件汽车或摩托车保险投诉；Marshmallow 自己的投诉政策也把八周后仍未解决的事项升级至
              Ombudsman。最强的开放尽调缺口不是市场是否存在，而是公开数据能否隔离出这样一群海外出生居民：既需要车，又能跨过驾照、文件、负担能力和承保门槛。缺少 Marshmallow
              按新来时间或国籍拆分的报价请求、转化、赔付率和留存队列数据，投资人可以有说服力地描述这个小众市场，但不能高置信度发布一个干净的公开 SAM 或 SOM。
