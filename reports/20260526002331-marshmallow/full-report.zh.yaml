      - number: '6.3'
        title: 具名客户证明与服务质量
        blocks:
          - type: paragraph
            body: >-
              因为 Marshmallow 面向消费者而非企业销售，具名客户证明主要来自评论平台和 Ombudsman 案件，而不是标杆客户。因此证据带有轶事性，但仍有决策价值。正面证据存在：一名 App Store
              评论者说自己是经朋友推荐加入，并觉得 App 流畅、好用。但负面记录丰富得多。App Store
              评论者描述了车辆起火后五周理赔悬而未决、三个月维修却没有代步车，以及只有在投诉升级后才获得赔偿。Reviews.io 包含一位具名评论者 R Kad，称一项不续保请求导致了取消费用；更广的 Reviews.io
              页面充满关于自动化沟通、缺少电话支持、理赔延误和保单取消处理的投诉。两份 Financial Ombudsman 裁决尤其重要，因为它们超越了情绪，进入已裁定失败：一起要求在验证期间错误取消信息后赔偿
              £660；另一起要求 Marshmallow 结清理赔、退还未使用保费、删除取消标记，并为精神困扰支付 £300。这种组合意味着 Marshmallow
              明显有真实客户和真实使用，但公开具名证据不成比例地集中在服务质量争议和补救时刻，而不是持久的长期忠诚故事。
