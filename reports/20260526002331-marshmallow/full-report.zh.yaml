chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、客户切口与平台边界
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的公开身份仍锚在一个很具体的英国问题上：搬到英国的人，报价时常常被当作完全没有驾驶历史。官网和核心车险页面反复说，公司定价会使用司机在任何国家的完整驾驶经验，而不只看英国记录，并用自己的
              2025 年比价网站统计来支撑这一说法：英国新来者平均节省 £392。同一批页面还说 79% 的客户是新来英国者，这一点重要，因为它说明公司并不是把移民当作营销主题；它仍是承保论点的中心。


              变化在于产品宽度和使命表述。招聘页面说 Marshmallow 的存在是为了让迁移更容易，并希望打造一家大型科技公司；2025 年融资公告则说，公司目标是成为新来者的一站式金融商店。官方产品页面显示，截至
              runDate，公司已经不只是单一车险公司：它销售车险、厢式货车保险、房屋保险和直接汽车金融。从法律实体看，公开记录也比官网呈现得更有层次。Companies House 将 Marshmallow
              Financial Services Limited 列为活跃的英国经纪实体，地址在伦敦 66 City Road；Marshmallow Credit Services Limited
              则是同一地址的活跃汽车金融贷款方。
