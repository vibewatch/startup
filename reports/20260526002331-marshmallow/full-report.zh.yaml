      - CR049
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 主要传导路径是控制 / 投诉失灵削弱客户信任、推高补偿成本，进而压迫资本或估值。
    data:
      nodes:
        - id: n1
          label: 监管机构 / FOS 压力
          description: GFSC 行动、FCA 投诉可见度和 Ombudsman 补偿
        - id: n2
          label: 理赔 / 服务失败
          description: 取消混乱、沟通不佳和处理延迟
        - id: n3
          label: 数字支持瓶颈
          description: 聊天优先服务，以及外包 / 共享运营控制
        - id: n4
          label: 客户信任侵蚀
          description: 评论平台和正式投诉中的声誉分化
        - id: n5
          label: 利润率 / 补偿压力
          description: 赔偿、外溢和更弱的留存或推荐经济性
        - id: n6
          label: 资本结构压力
          description: 运营表现变弱时，贷方、偿付能力或再保险合约敏感度上升
        - id: n7
          label: 估值下行
          description: 控制跟不上规模时，增长倍数收缩
      edges:
        - from: n1
          to: n4
        - from: n1
          to: n5
        - from: n2
          to: n4
        - from: n2
          to: n5
        - from: n3
          to: n2
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n4
          to: n7
    approximationNotes: 该图展示公开证据下可能的业务传导渠道；它不是管理层披露的模型。
