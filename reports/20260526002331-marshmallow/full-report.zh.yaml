            body: >-
              留存和集中度，是公开章节仍未补齐的部分。Marshmallow 在投诉政策中披露了投诉量和响应时间目标，独立来源也给出了 app 评分、评论平台分数和 Ombudsman
              裁决结果。这些指标能作为耐久性的代理信号：它们显示客户是否不满到需要升级投诉，但替代不了干净的续约、队列或留存披露。审阅的公开材料都没有披露
              NRR、GRR、续约率、保单期限分布，或家财险、厢式货车险、汽车金融相邻产品的产品级客户数。因此，投资人很难高置信度承保客户终身价值，也难以预测交叉销售经济性。扩张潜力确实存在：Marshmallow
              已在营销家财险、厢式货车险和直接汽车金融，多篇融资报道也写到，公司想成为英国新来者的一站式金融商店，最终进入其他国家。但这个业务的集中度风险，更多来自客群和渠道依赖，而不是单一客户账户。公开定价证据主要指向通过
              Confused.com 等比价网站获客的新来者队列，官方分层仍把新来者机动车保险作为主导基本盘。Marshmallow 还做了好友推荐计划，双方在 21
              个无理赔日后获得奖励，说明公司在比价网站流量之外，也想加入口碑获客；但公司仍未披露推荐在获客组合中的权重。因此，客户需求和可见采用度支持投资逻辑，但在用高置信度给耐久性打分前，仍需要私有续约率、组合结构和投诉率数据。
