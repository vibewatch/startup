      - number: '1.3'
        title: 融资历程、投资人图谱与规模披露
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的资本故事在标题层面已经清楚，尽管一些细节仍未公开。公开轮次报道显示：2020 年 $30M Series A，2021 年 $85M Series B、估值 $1.25B，2025 年
              4 月 $90M Series C、估值略高于 $2B。最新投资人组合也有充分交叉印证：公司、投资人和媒体来源都指向 Portage、BlackRock 和 Columbia Lake Partners 参与
              2025 年轮次；2021 年报道则反复提到 Passion Capital、Investec 和 Scor 等早期支持者。TechCrunch 补充了一个重要细节：2025
              年交易大约一半是股权、一半是债务，并带有可转换要素，时间可追溯到 2023 年，这有助于解释为什么公开来源中的累计融资数字并不完全一致。


              规模信号很强，但分母并不统一。2025 年公司和投资人公告称 Marshmallow 已承保超过一百万名司机，年化营收超过 $500M。更早的官方页面称，公司已售出超过 50 万份保单，每年服务数十万 App
              用户；UKTN 则报道 2023 年经审计营收为 £184M、亏损接近收支平衡、员工 310 人。随后 Portage 称，2025 年公司在伦敦和布达佩斯共有 700
              名员工。合起来看，这些信号支撑了一家成长阶段、后期私营公司，规模显著大于小众 MGA；但它们仍不能替代当前完整数据室 中关于 ARR、合并收入和员工数的材料。
