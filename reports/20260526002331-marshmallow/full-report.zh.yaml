      - number: '3.3'
        title: 定价信号、分销能力与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个领域的公开定价透明度并不均衡。Marshmallow 不公布通用保费表，但公布了一个面向新来者的基准：2025 年初，符合条件的英国新来者相对第二便宜的 Confused.com 报价平均节省
              £392。Hastings 发布了一个入门点主张：2025 年 3 月，10% 的新客户支付 £291 或更少。Cuvva 在短期保障上最透明，样例价格为一小时 £12.55、一天 £18.18、一周
              £43.47。与此同时，MoneySuperMarket 发布更广泛的市场平均值，并认为年付相对月付最高可节省 31%。


              这些信号重要，因为 Marshmallow
              最大的商业风险不是购物者找不到替代方案，而是他们太容易找到替代方案。比价服务把自己定位成找到最便宜保单的默认路径，年度车险续保在结构上就是四处比价的时点。Marshmallow 用月付和数字账户降低摩擦，但
              Veygo 和 Cuvva 的按需选项也降低了许多司机的承诺门槛。换句话说，Marshmallow 的承保优势必须同时压过既有公司的规模，以及一个把切换变成常态的市场结构。
