      - number: '8.2'
        title: 当前估值背景和进场纪律
        blocks:
          - type: paragraph
            body: >-
              当前进场点由两个披露估值锚定。第一，Marshmallow 2021 年 Series B 让公司以略高于 $1.25 billion 的估值成为独角兽。第二，2025 年 Series C 把这个估值推到略高于
              $2 billion，Portage 和公司都把该轮描述为股权和债务混合。这意味着投资人买到的不是一个干净的纯股权增长故事：同一时期，Marshmallow Financial Services
              也出现了一项新的未解除担保押记；按 SFCR 和 Sacra 的说法，公司还有有意义的债务融资，用于再融资旧借款。


              因此，进场纪律取决于投资人认为 $2 billion
              估值买到的是什么。它买到的是真实规模，但不是完整透明度。公开来源仍未披露当前现金、现金跑道、清算优先权，也没有从承保实体承保经济性到集团收入和自由现金流的干净合并桥。Sacra 的 2024 年估计和 UKTN
              的 2023 年营业额报道有方向性价值，但替代不了经审计集团账目和股权结构表摘要。纪律严明的投资人应把披露估值当作今天公开证据能支持的上限，而不是下行有限的证明。只有在 Marshmallow
              持续复合增长，同时证明经营行为、债务和再保险风险没有侵蚀增长质量时，这个价格才守得住。
