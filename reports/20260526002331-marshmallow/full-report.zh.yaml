  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 行为 / 监管问题复发和理赔服务质量是发生概率最高、影响最大的风险；常规诉讼和历史 IP 纠纷位置更低。
    data:
      columns:
        - 关键影响
        - 高影响
        - 中等影响
      rows:
        - label: 高概率
          values:
            - tone: negative
              label: 行为问题复发或投诉驱动的监管行动
            - tone: negative
              label: 理赔服务失灵及取消 / 标记争议
            - tone: neutral
              label: 持续招聘与治理过渡压力
        - label: 中等概率
          values:
            - tone: negative
              label: 再保险合约重新定价或债务结构收紧
            - tone: negative
              label: 贷款 / 新地域扩张跑在控制之前
            - tone: neutral
              label: 雇佣诉讼拖累或数据处理控制缺口
        - label: 低概率
          values:
            - tone: neutral
              label: 历史 IP / TOBA 争议显著再升级
            - tone: neutral
              label: 常规人身伤害诉讼变得异常
            - tone: positive
              label: 投诉强度改善且再保险多元化继续推进
    approximationNotes: 热力图位置来自对公开证据的综合判断，用于确定优先级，不是精算概率估计。
    claimRefs:
