      - number: '7.5'
        title: 缓释因素和否决标准
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 确实有可见的缓释因素，所以建议影响是谨慎，而不是直接转负。2024 年偿付能力缓冲显著改善；配额分保名单更分散；交易对手被描述为 A
              级；内审外包给一家知名机构；公司自己的页面强调在线聊天、24/7 理赔响应、反欺诈控制和快速产品迭代。治理也在从纯创始人控制，逐步走向更正式的受监管实体董事会结构。


              问题在于，同一组证据也显示，缓释因素尚未完全成熟，只是部分到位。投诉和 FOS 记录表明，控制在客户关键时刻仍会失灵。资本结构也比一家没有负担、现金充裕的私营公司更复杂。Marshmallow
              的大量公开论据，仍依赖管理层叙事，而不是充分披露的再保险合约经济性、当前现金、债务契约、网络控制证据或高管继任深度。


              因此，正确的监控姿态应当明确。如果监管行动再次发生，如果投诉强度或不利 Ombudsman 结果从当前基线恶化，如果偿付能力覆盖率或再保险支持明显变差，或者如果管理层扩张产品 /
              地域的速度快于服务质量稳定的速度，就应把 Marshmallow 视为逻辑破裂。若这些触发点保持受控，Marshmallow
              仍可能是一家纪律较强、聚焦移民客群的保险公司，并扩展成更大的金融科技平台。若不能受控，公司的运营杠杆就会反向伤人。
