    rows:
      - - 英国私人机动车保险
        - 英国居民为合法有效保障、承保、理赔处理和投诉处理支付的年度个人汽车和厢式货车保费
        - 商业车队、非机动车个人险种、无抵押贷款、家财险，以及受监管机动车保障之外的出行产品
        - 从个人现金流付款的指定驾驶人或家庭
        - 这是 Marshmallow 必须抢份额的外层市场
      - - 新来者 / 移民机动车保险
        - 有非英国驾驶历史、外国或近期换发驾照、英国数据档案薄的居民司机
        - 无法通过居住资格门槛的短期访客、游客和非居民
        - 通常是家庭司机；有时受配偶或搬迁家庭单元影响
        - 这是 Marshmallow 在更大市场内部的核心切入点
      - - 已定居且有海外 NCD 历史的移民
        - 已在英国居住足够久、达到居民资格，但仍能受益于海外无理赔证明和全球驾驶历史识别的司机
        - 已完全被主流英国定价吸收、没有海外驾驶历史优势的买方
        - 家庭司机和付款方通常是同一人
        - 这是新到者和普通传统险企转换客之间的重要桥段
      - - 相邻年轻或薄档案城市司机
        - 因年龄、地理位置或有限理赔历史导致报价分散极大的高保费司机
        - 已有便宜保障的退休年龄低风险司机和低里程农村传统险企客户
        - 年轻家庭司机、父母支持的司机，或其他预算敏感付款人
        - 这是相关相邻市场，因为 Marshmallow 的承保方法可以延伸到移民之外
      - - 传统存量保险
        - 从主要按英国本地驾驶历史或传统评分卡定价的保险公司购买的标准机动车保障
        - Marshmallow 的差异化新来者承保、海外历史识别和更定制化引导
        - 与 Marshmallow 目标客群相同的买方和付款方
        - 这是主要替代集合，而不是抽象的“无保险”选项
    notes: 市场范围有意窄于所有机动车相关消费者支出：它是英国居民的强制受监管保障，而 Marshmallow 聚焦其中的新来者和薄档案切片。
