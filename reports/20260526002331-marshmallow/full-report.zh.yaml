    rows:
      - - 新来英司机省钱主张
        - 2025 年 1-6 月队列中，相比 Confused.com 第二低报价平均节省 £392
        - Marshmallow 面向新来英司机靠性价比竞争，而不是靠老牌保险品牌背书
        - 这是需求营销证据，不是已实现平均保费或利润率
        - 官网主张；需要按队列提供报价保费分布和成交率
      - - 替代数据承保
        - 接受任意国家完整驾驶记录，非英国驾照可用 12 个月
        - 定价引擎意在扩大可承保人群，并改变风险筛选
        - 如果欺诈和理赔模型站得住，可能提高转化率和筛选质量
        - 官网和 Finder 相互印证产品定位；需要按移民队列拆分赔付率
      - - 付款模式
        - 灵活月付，用户可自选付款日
        - 分期选项可能提升转化和可负担性
        - 经济性取决于 APR、费用负担和逾期付款行为；这些均未披露
        - 需要融资费用抽成率、逾期数据和月付方案占比
      - - 保障结构
        - 仅提供全面险；有多档计划和可选附加项
        - Marshmallow 不是用最低配第三方责任险竞争
        - 预期保费和附加项占比更高，但实际方案结构未披露
        - 需要按 Lightest/Essential/Original/Plus 或当前对应方案拆分保单数和保费
      - - 理赔摩擦定价
        - Finder 提到取消费最高 £75，典型理赔免赔额 £250
        - 部分经济性靠费用和客户共担成本来保护
        - 有助于分摊损失，但服务质量弱时，行为监管风险会上升
        - 需要按费用类型拆分费用收入、免赔额分布和投诉发生率
    notes: Marshmallow 不公布静态费率表。因此，公开定价证据只覆盖省钱主张、 保障档位、费用和承保结构线索，而不是已实现保费。
