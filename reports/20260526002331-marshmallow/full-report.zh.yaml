      - number: '5.2'
        title: 运营架构与交付模型
        blocks:
          - type: paragraph
            body: >
              Marshmallow 的产品不只是一个 App；它是一套保险公司 / 经纪公司运营栈。2024 年 SFCR 称，Marshmallow Insurance Limited
              承保机动车风险，Marshmallow Financial Services Limited 通过英国主要价格比较网站分销产品。同一份备案称，集团 IT
              职能和经纪实体覆盖定价、承保、数据管理、反欺诈、理赔管理和投诉处理，这意味着面向客户的体验坐在多实体控制模型之上，而不是一个单一软件业务之上。SFCR
              还记录了保险公司和经纪公司之间的联合产品监督与治理委员会，进一步说明产品变更和客户结果是在受监管的共同制造流程中被监督。[CE019] [CE020] [CE022] [CE023] [CE024]

              理赔路径也高度依赖合作伙伴。Marshmallow 的维修 FAQ 会把已验证车辆导入 Motor Repair Network；WNS 公开表示，其被选中提供 24/7/365
              端到端理赔管理，从首次损失通知到解决。与此同时，公开工程岗位显示 Marshmallow
              正在尝试把更多栈内化：理赔技术团队称其正在构建内部理赔管理系统，覆盖内部、外部和面向客户的流程，以及合作伙伴集成和财务报告。同一批岗位还暴露了相当现代的平台足迹——用于理赔和数据的 AWS 上 Java /
              Spring 微服务，以及高度使用 SwiftUI 的 iOS App，配有模块化包、自动化测试、Bitrise、Fastlane、SwiftLint / SwiftFormat、Danger 和
              Tuist。[CE016] [CE018] [CE034] [CE035] [CE036] [CE037] [CE038]
