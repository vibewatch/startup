      - number: '4.4'
        title: 财务结论、收入质量与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              可投资结论是：方向积极，证明不完整。Marshmallow 已跨过几个重要的公开门槛：2024 年首次盈利、英国车险中足够有意义的保费规模、披露的偿付能力冗余，以及给相邻产品上线留出空间的 2025
              年融资组合。收入质量也比纯线索获客型经纪商更好，因为集团捕获了承保经济性、浮存金收入和部分附加分销利润。但公开记录仍未达到承销就绪。它不披露合并现金、月度烧钱、跑道、承保载体和经纪经济之间的实际收入组合，也没有披露判断快速增长是否真正资本高效所需的队列级
              CAC 和回收期数据。即便最强的已发布收入数字，也来自不同口径：公司自称年化收入、经纪营收、保险公司保费和分析师估算。正确结论是，Marshmallow
              看起来比许多私营保险科技同业资金更足、运营更强，但在把财务论点称为完全承销之前，仍需要对流动性、利润构成、投诉成本漏损、再保险依赖和债务契约做私有尽调。
