  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从规模验证、产品广度出发，串到估值和风险证据，最后落到观察建议。
    data:
      nodes:
        - id: scale
          label: 规模验证：1M+ 名司机、$500M 收入运行率
          type: input
        - id: capital
          label: 资本质量：私募估值超过 $2B，但股权 / 债务结构混杂，并有担保押记
          type: input
        - id: ops
          label: 经营验证：2024 年盈利，偿付能力覆盖率 216%
          type: input
        - id: risk
          label: 风险：经营行为、赔付补救和服务质量问题仍有实证
          type: input
        - id: valuation
          label: 估值：隐含倍数 4.0x-5.4x
          type: process
        - id: call
          label: 结论：观察 / 偏高 / 高风险
          type: output
      edges:
        - from: scale
          to: valuation
        - from: capital
          to: valuation
        - from: ops
          to: valuation
        - from: risk
          to: valuation
        - from: valuation
          to: call
    approximationNotes: null
