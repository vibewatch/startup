  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和经营行为风险
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的头号风险不是存在性破产，而是增长再次跑在控制基础设施前面。最清晰的信号，是 2024-07-05 Gibraltar Financial Services Commission
              和解。GFSC 称 Marshmallow Insurance Limited 在未取得必要同意的情况下，让总承保保费增长超过获批商业计划允许的范围，并认定这家保险公司低于有效控制和管理要求。结果是
              £200,000 罚款加董事会培训。这一点重要，因为 Marshmallow 已不再只是一个简单的英国经纪商故事：Gibraltar 承保实体承担风险，英国经纪商和信贷实体落在 FCA
              监管边界内，公司现在又在扩展到贷款和更多产品。


              客户经营行为证据也过于一致，不能当作边缘噪音丢掉。Marshmallow 自己的投诉政策披露了 5,700 起已受理投诉，投诉量 / 业务量比率为 2.11%；多份 FOS
              裁决要求赔偿、重启理赔或移除标记。这些裁决覆盖估值、取消、保单作废以及欺诈标记误导信息。存在一份未支持投诉方的 Ombudsman 裁决，是有帮助的，因为它显示 Marshmallow
              能守住一部分验证判断；但这不能抹掉更广泛的模式：服务和沟通失误已经带来正式补救。


              法律悬而未决的问题还在另外两个层面。Anthony McCartney employment tribunal 事项在 Marshmallow 未能驳回解雇歧视申诉后，实体问题仍未解决；历史上的 Mulsanne
              litigation 也显示 Marshmallow 已经经历过复杂的承保实体启动诉讼。两者看起来都不会立刻打破投资逻辑，但都把文化、控制和法律开支纪律推高为尽调优先项。
