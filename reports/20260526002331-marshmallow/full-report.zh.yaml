    columns:
      - 可比对象
      - 指标 / 口径时间
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Marshmallow B 轮（2021）
        - $85m 融资对应 $1.25bn 估值
        - 此前里程碑定价
        - 显示 2025 年价格较独角兽轮抬升了多少
        - 历史私募轮，不是实时市场出清的公开倍数
      - - Marshmallow C 轮（2025）
        - $90m 混合融资对应 $2.0bn+ 估值
        - ~4.0x 年化收入 / ~5.4x Sacra 2024 年收入
        - 投资者当前入场要接受的基准
        - 私募、流动性弱，且部分靠债务托底
      - - Admiral
        - 2026 年 5 月市值 / 2024 年收入
        - ~2.3x
        - 最接近的英国规模化车险老牌公司参照
        - 成熟分红公司，披露好得多，增长也更低
      - - Lemonade
        - 2026 年 5 月市值 / 2026 年 TTM 收入
        - ~5.2x 市值 / 收入；Multiples.vc 显示 EV 约 $4bn、LTM 收入 $923m
        - 本组里最接近的移动端优先上市保险科技估值上限
        - 地理市场和产品组合不同；公开市场流动性和披露更强
      - - Hippo
        - 2026 年 5 月市值 / 2025 年 TTM 收入
        - ~1.5x
        - 较小保险科技公司的上市数字保险估值地板
        - 业务偏房主保险，不是英国车险 / 新来者平台
      - - Aviva
        - 2026 年 5 月市值 / 2025 年收入
        - ~0.33x
        - 大型老牌保险公司给上市保险风险提供估值下限
        - 业务组合偏综合集团，直接可比性不完美
    notes: 该表混合私募里程碑定价和公开交易参照，因为 Marshmallow 仍是私营公司，也没有一个完美的上市同业。
