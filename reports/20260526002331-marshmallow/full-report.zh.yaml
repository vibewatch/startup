      - number: '6.2'
        title: 采用轨迹与真实使用证据
        blocks:
          - type: paragraph
            body: >-
              公开采用证明明显强于公司留存证明。2025 年 4 月融资前后，多家第三方来源称 Marshmallow 已承保约一百万名司机或客户，而 2021 年只有 100,000 人。同一批来源还把客户规模主张与超过
              $500M 的年化营收绑定，使采用主张看起来有商业意义，而不是表面数字。Sacra 给出了类似增长叙事，估算 Marshmallow 到 2024
              年已跨过一百万名已承保司机。公司自己的获客证明更窄，但仍有用。官方定价说明称，2025 年 1–6 月售出的 4,304 份保单中，英国新来者相对第二便宜的 Confused.com 报价平均节省 £392；一项
              2024 年对 619 名新来者投保人的调查发现，83% 的受访者认为 Marshmallow 最便宜。移动端界面进一步说明购买后有真实互动：iPhone App 列表称已有超过 50,000 名
              Marshmallowers 加入；App Store 评论页在运行日显示 30,000 个评分、4.9/5 分。专门的理赔页面还说，Marshmallow 已支付 £66M
              或更多事故支持，这加强了一个判断：客户活动不只是报价量，而是真实的理赔服务账本。尽管如此，这些并不是同一个指标。一百万已承保司机、50,000 名 App 用户、30,000
              个评分和比价网站定价队列，都从不同角度显示采用，但不能干净回答有多少保单续保、多少家庭购买多个产品，或增长有多少集中在价格比较渠道。
