  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 面对的不是一组整齐的同业。对想在英国给汽车投保的新来者来说，实际替代方案是大型既有保险公司、临时保障 App，以及让年度比价变容易的价格比较网站。Marshmallow
              的定位异常明确：它向搬到英国的人营销年度全险车险，称自己可以根据任何国家的驾驶经验定价，也接受任何保险公司、任何语言的无理赔证明。相比 Admiral、Hastings、Churchill 或
              QuoteMeHappy 的大众市场话术，这个承诺更窄，也更具体。


              真实现状仍是通过比价门户和主流保险公司逐年比价，而不是使用专门的移民保险栈。Marshmallow 自己的营销间接证明了这一点，因为它的定价主张以 Confused.com
              和更广的价格比较网站数据为基准。这意味着，只有当承保优势在并排报价比较中仍能守住时，公司才会赢。这个消费者任务也没有有意义的内部自建等价物；替代方案是留在既有公司、为偶尔驾驶使用短期保险，或通过比价网站续保。因此，分销能力和切换摩擦几乎和承保精细度一样重要。
