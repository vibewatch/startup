      - number: '7.4'
        title: 人才、治理和执行风险
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的执行负担上升速度，快于公开管理层深度变得透明的速度。创始人集中度仍高：这对双胞胎仍站在战略和招聘前台，公开招聘材料则写着要把影响力放大
              10x、扩展产品、进入新行业和国家，并持续每周发布岗位。从增长角度看这有吸引力，但也意味着产品扩张、合规建设和服务质量必须同时成熟。


              治理在专业化，但公开记录仍暗示转型风险。Companies House 显示，创始人董事在 2025 年离开受监管的 MFSL 董事会，外部董事则在 2024-2025
              年间加入。方向上这是正面的，因为它应该能改善受监管实体的纪律；但它也说明，当业务仍在快速增长时，运营模式正从创始人中心化的创业公司治理转向更正式的体系。公开招聘页面还提到，新员工必须接受背景调查，因为
              Marshmallow 获 FCA 授权；这再次提醒人们，规模化带来的是合规很重的用工模型，不只是工程招聘。


              McCartney tribunal 案增加了一个更软但仍有关的执行信号。实体问题尚未解决，因此不应夸大。即便如此，一位前 CFO
              的歧视性解雇申诉挺过驳回申请，已经足以让尽调关注高级团队凝聚力、试用期高管招聘中的决策质量，以及 Marshmallow
              的高管梯队是否足够支撑多产品、国际化规模。公司可能正进入控制要求最高的阶段，而它的公开野心也在加速。
