  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险
      - 影响
      - 尽调路径
    rows:
      - - 家庭保险交叉销售
        - 核心客户基础可能仍以新来英国者汽车保单为主
        - 如果附加购买率真实，钱包份额有上行空间；当前能见度有限
        - 要求按获客队列提供家庭保单数量、附加购买率和理赔表现
      - - 汽车金融交叉销售
        - 薄档案放贷可能拓宽客户关系，但会引入信用敏感性
        - 若核保守得住，可加深 LTV；若违约上升，经济性会变弱
        - 要求提供审批量、违约情况，以及参保驾驶人转化为借款人的比例
      - - 货车保险相邻业务
        - 客群拓宽可能仍处早期，相对核心汽车险组合仍小
        - 有助于扩大 TAM，但还不能证明多元化
        - 要求提供货车险保单数量、续保率，以及英国出生客户与新来英国客户的占比
      - - 国际扩张
        - 公开客户规模仍主要围绕英国新来者业务来表述
        - 可在地域上分散需求，但执行风险高
        - 要求提供上线时间、目标国家试点和早期转化指标
      - - 比价渠道获客
        - 公开定价证明依赖 Confused.com 等比价网站队列
        - 在疲软市场中，渠道依赖可能挤压 CAC 或定价质量
        - 要求按直销、应用、推荐和比价渠道拆分获客结构
      - - 推荐驱动获客
        - 推荐计划存在，但公开资料未披露获客占比
        - 若能规模化，可把获客从比价网站向外分散
        - 要求提供新保单中推荐占比，以及推荐与非推荐客户的留存对比
      - - 客户集中度框架
        - 零售保险的单一账户集中度结构性较低，但客群集中度仍有意义
        - 核保风险不是押注某个企业客户，而是过度暴露于单一人生阶段和产品切入点
        - 要求按新来者来英时间、产品和来源国队列拆分保费与保单结构
    notes: Marshmallow 的集中风险应理解为客群、产品和渠道依赖，而不是企业账户集中度。
