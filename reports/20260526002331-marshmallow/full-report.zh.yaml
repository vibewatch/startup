      - number: '3.4'
        title: 护城河耐久性与负面证据
        blocks:
          - type: paragraph
            body: >-
              Marshmallow
              最强的公开护城河主张是信息优势，而不是分销优势。官方页面、投资人材料和独立报道都把模型描述为围绕海外驾驶历史、新来者文件、定价数据和欺诈信号构建，而这些是主流保险公司过去使用不足的东西。这给了
              Marshmallow 一个真实切口。但这个切口的耐久性并无保证。TechCrunch 明确称，数据科学和 AI 正在成为保险创业公司的入场券；Ominimo
              等相邻进入者也显示，只要经济性有吸引力，承保创新会快速扩散。


              更直接的弱点是信任和服务执行。Marshmallow 自己的投诉政策披露了有意义的投诉量，本章审阅的两份 Financial Ombudsman Service
              裁决都在运营事项上判公司败诉：一起是错误的取消信息，一起是不公平拒赔和保单作废。这些本身不构成生死问题，但在一个买方可以在续保时回到规模化既有公司的类别里，它们很重要。Marshmallow
              未来向贷款、更广保险产品和新地区扩张，可能创造更大上行，但也扩大了会在重叠地面上与其相遇的既有公司和金融科技公司数量。
