      - number: '8.5'
        title: 最终尽调要求和打破逻辑的触发点
        blocks:
          - type: paragraph
            body: >-
              剩余工作很集中，并不模糊。第一，投资人需要股权结构表和优先权摘要，看清扣除债务和清算优先权后，下行情景中普通股还能分到多少。第二，需要当前合并账目，包含现金、现金跑道，以及从承保实体承保经济性到集团自由现金流的桥。第三，需要
              2025 年融资安排背后的实际债务文件和契约包，并厘清再保险集中度和分保佣金依赖。第四，需要超越零散轶事的客户结果证据：投诉队列、续约留存、理赔调整泄漏，以及补救敞口是在稳定还是扩大。


              如果出现以下任一情况，估值逻辑就会破裂：低于 2025 年估值的降价融资；偿付能力或资本灵活性明显恶化；投诉 / 补救指标持续走坏；或者公司无法把 1 million
              名司机的证明转化为汽车金融、家财险或国际扩张的更好经济性。反过来，如果 Marshmallow 能拿出经审计的合并增长、更干净的客户结果数据，以及一套看起来没那么依赖债务辅助的资产负债表安排，观点可以改善。
