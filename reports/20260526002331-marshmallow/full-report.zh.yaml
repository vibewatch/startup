      - number: '8.3'
        title: 可比公司组和倍数差距
        blocks:
          - type: paragraph
            body: >-
              最简单的公开可比公司测算，并不支持说 Marshmallow 便宜。按公司自己的运行率披露，当前估值约为营业额的 4.0x；按 Sacra 的 2024 年收入估计，约为 5.4x。这显著高于 Admiral
              的约 2.3x，也远高于 Aviva 的约 0.33x。Hippo 是一家上市保险科技公司，业务线组合很不同，但能提供公开市场对数字保险情绪的校验，交易倍数约 1.5x。只有 Lemonade
              这个最接近的应用优先保险科技参照，落在同一区间：按 Multiples.vc，市值 / 收入约 5.2x，EV 约 $4 billion，对应 LTM revenue $923 million。


              这个可比图谱重要，因为 Marshmallow 仍是私营公司，流动性低于其中任何一家。除非公司在增长、治理和披露上明显更强，私募投资人通常应要求相对公开可比公司的折价。Marshmallow
              贴合细分客群的经济性确实优于普通传统险企，但审阅记录仍显示担保债务、经营行为噪音和不完整的资本结构披露。因此，公开可比公司组把 2025
              年估值框定为偏高，而不是荒谬到不可能：如果执行继续改善，它可以站住；但今天的证据不足以支持从这里假设一次溢价重估。
