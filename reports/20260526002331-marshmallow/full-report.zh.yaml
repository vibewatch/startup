  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价界面与确认机制
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的公开财务故事首先要从一个事实说起：它是纵向一体化的保险公司 / 经纪公司，不是 SaaS 公司。集团的 Gibraltar 承保载体 Marshmallow Insurance
              Limited 承保风险，Marshmallow Financial Services Limited
              则通过英国大型价格比较网站把保单和相关附加险分销到英国市场。这个结构重要，因为公开的“收入规模”可能指不同东西：经纪营收、承保载体总签单保费、再保险后留存净保费、保险浮存金投资收益，或分析师估算的合并收入。定价也是个体化的，而不是按公开价目表。Marshmallow
              官网对商业命题很透明——基于海外驾驶历史定价、只卖全险、多个计划层级、灵活月付——但它不公布静态费率卡或实际保费组合。最强的公开价值信号不是平均保费，而是公司称在 2025 年 1–6
              月队列中，英国新来者相对第二便宜的 Confused.com 报价平均节省 £392。财务上，关键确认问题是：再保险佣金和浮存金收入足够重要，单看总保费会夸大 Marshmallow
              在资产负债表上留存的风险和利润。
