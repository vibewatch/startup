  - id: TM003
    title: 细分客群 / 买方地图
    columns:
      - 细分客群
      - 买方
      - 用户
      - 付款方 / 预算负责人
      - 工作流
      - 采用触发点
    rows:
      - - 新到英国工作者
        - 刚因工作搬迁的主司机
        - 同一人用于通勤、工作出行和日常办事
        - 通常由司机用工资现金流支付
        - 确认居留和地址，核验驾照状态，把海外驾驶记录纳入报价，再选择按月或按年付款
        - 需要快速用车，但只看英国记录的保险公司给价很差
      - - 家庭移民或配偶签证家庭
        - 指定司机，加上配偶或担保家庭
        - 司机和家庭受扶养人
        - 家庭预算，而不只是个人开支
        - 准备居留和地址证明，比较保障档位，协调谁列名、谁付款
        - 需要家庭出行能力，也在意付款时点和材料摩擦
      - - 国际毕业生 / 职场早期移民
        - 从求学转向工作的年轻劳动年龄司机
        - 同一司机
        - 个人预算，有时获得家庭支持
        - 确认驾照资格、比较报价，重点看可负担性和分期付款
        - 英国信用档案薄、现金缓冲有限，标准报价因此偏贵
      - - 已定居且有海外无赔款记录的移民
        - 在海外有多年安全驾驶记录的常住司机
        - 同一司机
        - 同一家庭
        - 上传无赔款证明，把海外记录转成英国折扣，再按接近主流保单的方式续保
        - 不想继续被当作英国新司机定价
      - - 相邻的高保费城市司机
        - 大城市里的年轻司机或薄档案司机
        - 同一司机
        - 同一家庭，或由父母支持付款
        - 按地区和年龄段比较保费，评估差异化承保是否有帮助
        - 存量玩家定价很高，给非标准承保方法留出空间
    notes: 个人车险里，买方、用户和付款方往往是同一个人；但家庭移民和职场早期人群让预算负责人更复杂，甚至还没算上雇主或搬迁支持。
