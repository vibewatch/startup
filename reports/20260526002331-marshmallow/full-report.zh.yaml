      - number: '4.2'
        title: 公开牵引、承保经济性与数字口径错配
        blocks:
          - type: paragraph
            body: >-
              公开牵引已经强到足以支撑一个判断：Marshmallow 已经走过早期试验阶段，但披露指标仍要求严格区分口径。UKTN 报道 2023 年营收 £184M、亏损降至约 £0.2M，并且自保险公司启动以来第一年
              EBITDA 转正。2024 年 SFCR 进一步明显推进了故事：Marshmallow 称集团和保险公司首次实现盈利，总签单保费同比增长 49% 至 £248.693M，总已赚保费达到
              £202.895M，承保利润转正至 £4.075M。这些保险公司指标比泛泛的增长主张更有决策价值，因为它们也显示再保险之后留下了什么：净签单保费仅 £56.650M，净已赚保费 £40.576M，对应已发生净赔款
              £29.931M。这个图景支撑一家正在变得更自律的公司，但仍高度依赖条约结构和理赔执行。外部来源补充的是规模信号，而不是干净财务报表。到 2025 年，Marshmallow
              披露已承保超过一百万名司机，年化营收超过 $500M；Sacra 则估算 2024 年集团收入为 £289.4M，并称经纪实体 EBITDA
              为正。结果是一个可信但质量混合的公开模型：真实增长、真实承保改善，但仍没有干净的合并桥。
