      - number: '2.2'
        title: 多视角测算与可触达范围
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种有用的测算视角，但不能给出一个干净的 Marshmallow SAM。第一是广义已付保费视角：ABI 称其追踪器覆盖每年近 2800 万份售出保单，ABI 和 Which
              都把近期已付私人车险保费放在约 £560–£562。这意味着客户支付的保费流大约为 £15.7B；但这只是市场流量上限估计，因为保单数量和保费快照来自不同时期，也没有隔离有效风险或 Marshmallow
              的新来者切片。第二是人口存量视角：Migration Observatory 称，2021/22 Census 时英国有 1070 万居民出生在海外，占人口 16%；其中 47%
              集中在伦敦和英格兰东南部，伦敦居民中超过 40% 出生在海外。第三是年度流入视角：ONS 最新截至 2025 年 12 月的年度公告显示，长期移民流入为 813,000，长期净迁移为 171,000；77%
              的移民来自非 EU+ 国家，与工作相关的到达同比下降 47%。这些数字不能互换。海外出生居民存量并不等于年度到达人数，二者也都不等于拥有或使用车辆的已投保司机。第四，Marshmallow
              自己的可观察小众证明点显示，79% 的客户是新来英国者，且一个 4,304 份保单的新来者样本相对第二便宜替代报价平均便宜
              £392。合起来看，这些视角显示了一个有真实保费支出和真实新来者密度的有意义市场；同时也说明，Marshmallow 可变现 SAM 比简单的“海外出生人口”算术更窄。
