      - number: '7.2'
        title: 运营、理赔和客户体验风险
        blocks:
          - type: paragraph
            body: >-
              公开运营证据显示，客户旅程保持标准化、能数字化自助时，Marshmallow 跑得最好。2024 SFCR 称，保险公司依赖 Group IT 和 MFSL
              完成定价、承保、数据管理、反欺诈和理赔管理，包括投诉处理；内审则外包。这种架构可以高效，但也意味着执行风险分散在共享系统、外包监督和面向客户的流程里，而不是隔离在一个严密控制的保险公司职能内。


              反复出现的失败模式不是灾难性系统宕机，而是异常情况处理不佳。FOS 裁决写到了沟通延迟、错误取消函、有争议的欺诈标记，以及不公平的拒赔或作废结果。外部评价平台分化很大：Trustpilot 仍然强，39,738
              条评论给到 4.2；但 Smart Money People 为 1.80/5，79% 是一星评论，Reviews.io 为
              3.1/5。这个分布符合一家公司的画像：获客和简单服务动作有吸引力，但一旦案件变复杂，理赔、取消、续约或验证旅程就可能恶化。


              Marshmallow 自己的 app
              和营销页面也强化了它对数字支持、在线聊天和反欺诈自动化的依赖。这些确实是服务移民客群保险公司的强项，但如果人员配置、聊天升级或供应商交接滞后于保单增长，同一个模式也会抬高运营风险。隐私和数据处理义务又加了一层成本：Marshmallow
              处理理赔数据，保留保单数据多年，并在部分事件处理中依赖合法利益逻辑。这在保险业很正常，但任何控制失败的代价都会更高。
