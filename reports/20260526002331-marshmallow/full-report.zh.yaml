      - number: '1.4'
        title: 里程碑、扩张路径与负面标记
        blocks:
          - type: paragraph
            body: >-
              当前公开图景不只是增长故事，也是一条边界扩大、运营义务累积的故事。2021
              年独角兽估值跃升之后，公开来源显示公司新增布达佩斯枢纽，从单一产品车险公司走向房屋保险和直接汽车金融，并准备把新来者金融命题带出英国。Sifted 称，2025
              年融资后，德国、加拿大和美国是国际扩张的领先候选市场。官方产品页面确认，至少部分平台野心已经在相邻金融产品中落地。


              负面和警示信号足够真实，必须继续跟踪。Marshmallow 自己的投诉页面明确将符合条件的争议导向 Financial Ombudsman Service；已审阅的 Ombudsman 裁决显示，至少两起案件中
              Marshmallow Insurance Limited 被要求赔偿客户或推翻此前立场。UKTN 还报道了 2024 年与未经同意的保费增长有关的 Gibraltar 监管罚款；Companies House
              备案历史则显示，创始人退出受监管经纪董事会，且 2025 年在同一扩张阶段登记了新的押记。单看任何一点都不能推翻商业模式，但合在一起，它们要求尽调理赔处理、监管边界，以及集团能否在不削弱控制的情况下拓宽产品范围。
