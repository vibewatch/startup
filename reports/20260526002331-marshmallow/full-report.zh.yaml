      - number: '5.3'
        title: 信任、隐私与合规控制
        blocks:
          - type: paragraph
            body: >
              公开信任控制在实体和治理层最强。GFSC 登记显示，Marshmallow Insurance Limited 获授权向英国承做和经营陆地车辆及机动车责任保险；Marshmallow 的偿付能力披露将
              Marshmallow Financial Services Limited 识别为 FCA 授权经纪商，FRN 797672。SFCR
              增加了对私营保险科技公司来说异常具体的治理细节：三道防线模型、董事会层面通过风险和承保委员会监督，以及跨经纪和承保载体的联合产品监督与治理委员会。[CE022] [CE023] [CE025] [CE026]

              隐私和欺诈控制可见，但主要通过法律披露体现，而不是专门的信任中心或安全认证页面。Marshmallow 的隐私政策称其收集通话录音、在线聊天消息、设备和使用遥测数据，并将 CIFAS、Insurance
              Fraud Bureau、Ravelin、LexisNexis、Onfido、价格比较网站和 OEM 车辆数据提供商列为外部数据来源。政策还说，OEM
              车辆数据可能包括里程、位置、速度、行程时长和其他使用指标。这足以确认有一层有意义的反欺诈和身份验证，但不足以验证公开安全认证、正常运行时间承诺或事件管理纪律。[CE021] [CE027] [CE028]
              [CE029] [CE044]
