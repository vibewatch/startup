      - number: '3.2'
        title: 既有公司、相邻品牌与短期挑战者
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 最大的竞争压力仍来自规模化既有公司。Admiral 称其覆盖超过 500 万辆车，并在 2025 年前 11 个月接受了 98.9% 的单车理赔；Hastings 称其有超过 300
              万车险客户，并在 2024 年接受了 99% 的机动车理赔。Churchill 及其母公司 Direct Line Group
              又带来一个大众市场品牌家族，拥有数百万客户、有意义的保费规模、面向年轻司机的驾驶行为数据，以及广泛附加险打包。这些公司不是新来者专家，但它们带来许多买家在拿到主流报价后仍偏好的信任信号、服务深度和品牌熟悉度。


              相邻品牌也重要。Admiral 的 Veygo 和 App 优先的竞争对手 Cuvva 攻击驾驶旅程中的具体时刻：学车练习、借车使用、短期需求和快速移动端购买。它们没有复制 Marshmallow
              的年度新来者承保切口，但确实覆盖了许多买方只需要合法、即时或灵活保障的场景。QuoteMeHappy 说明，即便主流数字品牌也已经把保障层级产品化得足够清楚，看起来现代、低摩擦。因此，Marshmallow
              竞争的是一个阶梯式市场，而不是单一类别市场。
