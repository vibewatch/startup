  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户流程
        blocks:
          - type: paragraph
            body: >
              Marshmallow 的核心产品仍是全险车险，而不是覆盖类型的大菜单：官方网站称其不销售仅第三方责任保单，而是把保障打包成四个直购层级——Lightest、Essential、Original 和
              Plus。产品围绕新来者调校，定价输入包括海外驾驶历史、任何国家的无理赔驾驶证明，以及对英国之外驾照的接受。这个面向新来者的承保命题，再被传统车险功能包起来，例如代步车选项、挡风玻璃保障、道路救援保障、法律保障和欧洲保障。[CE001]
              [CE002] [CE003] [CE004] [CE005] [CE006] [CE007] [CE008]

              客户流程明确是数字优先。Marshmallow 的应用商店描述称，投保人可以在一个账户里管理所有保单、下载文件、修改信息、用手机报案、使用应急指南，并快速联系在线聊天。官方帮助界面也呼应了这个定位：帮助中心和
              Intercom 集合页面暴露了购买、文件上传、保单更新、付款变更、理赔、续保和取消的自助流程。具体帮助文章显示，车险保单添加司机在 App 内完成，事故报告有规定的 FNOL
              清单，即便是“仅通知”事故，只要涉及另一方，也仍需快速记录。[CE009] [CE010] [CE011] [CE012] [CE013] [CE014] [CE015]
