companyProfile:
  summary: >-
    Marshmallow 是一家总部在伦敦的后期私营保险科技公司，2017 年由 Oliver 和 Alexander Kent-Braham
    创立。它用一个差异化的英国车险切口起步：比主流既有公司更公平地承保新来英国者和其他记录薄司机，然后把关系延展到厢式货车保险、房屋保险和直接汽车金融。到 2025–2026
    年，公开证据支撑了真实规模——超过一百万已承保司机、$500M 年化营收、伦敦和布达佩斯合计 700 名员工、2024 年首次盈利、集团偿付能力覆盖率 216%——但行为监管、资本结构和披露风险仍然重要。
