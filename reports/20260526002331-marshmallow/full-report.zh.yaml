      - number: '4.3'
        title: 资本充足性、融资组合与监管拖累
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的资产负债表方向上强于多数私营保险科技公司，因为它现在既披露了偿付能力资源，也拿到了新的外部资本；但结构比简单股权垫更复杂。2024 年 SFCR 称，MTL 在 2024
              年向保险公司注资 £10.2M，Swiss Re 则在 2024 年 9 月增加 £5M Tier 2 次级债，利率 11%，2034 年到期。截至年底，集团报告偿付能力覆盖率 216%、合格自有资金
              £70.945M、SCR £32.823M。年末之后，同一份备案称 MTL 以略高于 $2B 的估值完成 £30M Series C 股权融资，MFSL 另从 BlackRock / CLP 获得 £40M
              债务融资，部分款项用于再融资 TriplePoint。外部报道把这套组合四舍五入为约 $90M，股权和债务大致各半。这足以支撑产品扩张，但也意味着 Marshmallow
              的增长现在明确由债务辅助。负面一面同样重要。SFCR 记录了 2024 年关于失控保费增长的 GFSC 和解，UKTN 报道罚款 £200k，Companies House
              显示新的有担保押记，包含固定和浮动押记以及负面承诺，客户服务风险也通过 Ombudsman 裁决和 Finder 引用的高支持投诉率继续可见。资本今天看起来充足；行为、杠杆和再保险集中度，是它仍需谨慎承销的原因。
