      - number: '7.3'
        title: 资本、再保险和合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Marshmallow 的财务风险现在不再只是“还能不能融资”这么简单，因为公司既改善了偿付能力，也引入了更明确的合作伙伴依赖。2024 SFCR 显示，集团偿付能力覆盖率为 216%，合格自有资金
              £70.945m，对应 £32.823m SCR，且 2024 年向保险公司注入了 £10.2m 资本。这是有意义的缓冲。但同一份文件也说清楚，Marshmallow
              的承保模式在结构上绑定配额分保和超额损失再保险。再保险合约成本超过总保费，因此净承保保费为负，经济性部分靠分保佣金修复。换句话说：这个商业模式要靠再保险才成立，离不开它。


              集中度问题在改善，但没有消失。Marshmallow 从 2023 年增加第二个配额分保伙伴，走到 2024 年增加第四个伙伴；这个再保险人名单被描述为 A
              级，并带有按付即付机制和现金追缴权。这降低了交易对手集中度风险，但公司仍依赖再保险人的承保意愿、定价和赔付可靠性。Swiss Re 既是正面因素，也是依赖项：它提供了 £5m、利率 11% 的 Tier 2
              次级债，本身资本也充足；但资本结构里出现次级债，意味着增长已经由外部资产负债表伙伴支撑，而不只是靠内部现金生成。


              2025 年融资组合进一步强化了这一点。TechCrunch 报道，新一轮 $90m 融资大约一半是股权、一半是债务；Companies House 显示，Marshmallow 新增了固定及浮动押记安排，并以
              GLAS 为担保代理人设置负面抵押承诺。单看这不是困境信号，但它意味着 Marshmallow 现在既受监管又带杠杆，投诉泄漏、准备金压力或再保险条款重定价都会更有后果。
