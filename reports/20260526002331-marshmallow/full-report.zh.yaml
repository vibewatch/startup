  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 七维 IC 评分卡采用 1-5 分，5 分最强。
    data:
      items:
        - label: 细分契合度 / 市场切口
          value: 4
          note: 新来者保险定位仍然成立，并且有差异化
        - label: 规模验证
          value: 4
          note: 1M+ 名司机和 $500M 收入运行率，已经撑起有意义的规模
        - label: 经营验证
          value: 4
          note: 2024 年盈利和 216% 偿付能力，比早期保险科技公司的常态更强
        - label: 客户信任 / 行为合规
          value: 2
          note: FOS 败诉和评价数据分化，仍然明显拖后腿
        - label: 资产负债表清晰度
          value: 2
          note: 债务和押记可见，但当前现金和股权结构细节没有披露
        - label: 估值纪律
          value: 2
          note: 当前估值标记已经接近上市保险科技公司的高端倍数
        - label: 证据完整度
          value: 3
          note: 证据足以建议观察，不足以支撑激进买入
    approximationNotes: 评分为定性判断，并按证据权重给出；它们总结的是这份尽调记录，而不是任何公司提供的评级体系。
    claimRefs:
      - CV009
      - CV020
      - CV038
      - CV045
      - CV046
      - CV060
