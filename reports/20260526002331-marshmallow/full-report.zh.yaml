  - id: TV005
    title: 投资论点击穿与叫停触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 如何传导到论点
      - 行动含义
    rows:
      - - 降估融资或内部平价延展轮
        - 新股融资低于 2025 年 $2bn+ 估值标记
        - 确认当前私募价格相对所承担风险过于乐观
        - 从「跟踪」下调到接近「回避」，直到股权结构表重置
      - - 资本灵活性转弱
        - 集团偿付能力或债务余量明显恶化；新担保包强化贷款人控制
        - 增长更可能靠债务支撑，而不是增厚价值
        - 任何新资金进入前，必须完整审查债务契约和资金管理
      - - 投诉 / 补偿压力持续
        - 申诉专员裁决败诉、投诉率或补偿准备金维持高位或恶化
        - 压低 LTV、放大漏损，并削弱保费定价权
        - 把服务指标当成承保变量，而不是品牌噪音
      - - 扩张无法变现
        - 家财险、金融或国际业务上线后只增加成本，看不到附着率或利润率证明
        - 支付接近 Lemonade 倍数的核心理由消失
        - 重估到更低、接近老牌保险公司的倍数带
      - - 披露仍然单薄
        - 到下一轮尽调仍看不到经审计的合并现金、现金续航或优先权细节
        - 下行情景仍无法严密测算
        - 评级停在「跟踪」，或直接退出
    notes: 触发项有意设计成可监控，并与融资、偿付能力、投诉、扩张或披露事件绑定。
    claimRefs:
      - CV011
      - CV013
      - CV014
      - CV016
      - CV025
      - CV026
      - CV049
      - CV052
      - CV058
  - id: TV006
    title: 最终尽调补充清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先权
        - 当前股份类别、清算优先权和潜在稀释压力
        - 私募名义估值可能高估新普通股等价投资者可拿到的价值
        - 索取董事会批准的股权结构表摘要和 2025 年条款清单中的经济条款
      - - 现金与续航
        - 当前现金余额、烧钱速度和未来 12 个月流动性预测
        - 判断增长靠经营现金支撑，还是仍在快速消耗债务 / 股权资金
        - 索取最新管理账和资金管理材料包
      - - 债务契约与担保
        - 授信协议、契约定义、抵押 / 担保包、摊还计划
        - 即便收入继续增长，有担保债务也可能封住上行空间
        - 审阅贷款人文件和 CFO 契约模型
      - - 再保险经济性
        - 比例分保比例、分出佣金、交易对手集中度、续约条款
        - 再保险结构决定留存利润率和资本效率
        - 索取合约摘要和再保险委员会材料
      - - 按客群批次拆分的客户结果
        - 按持有期或新来英国者细分的续保、赔案严重度、投诉和补偿数据
        - 公开评论噪音只有接上经济性才有用
        - 索取带客群批次切分的留存和投诉看板
      - - 扩张证明
        - 家财险、金融和国际业务的单位经济性及附着率
        - 牛市情景靠相邻产品和新地理市场贡献真实利润率
        - 索取交叉销售漏斗数据和上线后 KPI 包
    notes: 这些问题按对估值信心的直接影响排序，而不是按收集难度排序。
    claimRefs:
      - CV045
      - CV046
      - CV048
      - CV052
      - CV057
      - CV058
