        - 英国居民 / 完整英国驾照限制削弱了对新移民的适配
      - - Hastings Direct
        - 大众市场存量玩家
        - 3M+ 车险客户；2024 年受理 99% 车险赔案
        - 主流年度车险客户
        - 规模、理赔支持、App 和 YouDrive 车联网
        - 没有公开的新移民专项承保角度
      - - Churchill / Direct Line Group
        - 存量品牌家族
        - 数百万英国客户；集团层面 £3,732m 毛承保保费和费用
        - 主流车主和年轻司机
        - 品牌深度、多产品线，以及通过 DriveSure 提供车联网
        - 没有公开的移民或海外记录定价楔子
      - - QuoteMeHappy
        - 数字化存量品牌
        - 主流保险品牌下的多层数字化包装
        - 价格敏感的线上买方
        - 从 Essentials 到 Premier 的数字化分层清晰
        - 没有明确的新移民叙事或海外记录承保
      - - Cuvva
        - App 优先的相邻保险公司
        - 已售 15M+ 份保单；承保 3M+ 辆车；App 下载量 5M+
        - 临时用车、借车和灵活用车司机
        - 短期全险保障，并公开样例价格
        - 不是面向移民司机的年度主险专业玩家
      - - MoneySuperMarket
        - 现状替代品 / 分销方
