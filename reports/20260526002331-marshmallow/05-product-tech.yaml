schemaVersion: report-v2
artifact: product-tech
slug: marshmallow
runDate: '2026-05-26'
company:
  name: Marshmallow
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Marshmallow delivers a digital-first, fully comprehensive motor insurance product built for UK newcomers,
    with app-based self-service, live-chat support, and a 24/7 claims intake workflow. Public filings and live
    engineering roles show a maturing internal platform — including an in-house claims management system under
    development and a mobile stack that is now mostly SwiftUI — but the operating model still depends on
    outsourced claims, repair, distribution, and regulatory entity handoffs. The strongest product evidence is the
    breadth of self-serve workflows and app quality signals; the main diligence risks are complex-claim friction,
    limited public security/uptime disclosure, and partner dependency in the claims chain.
sections:
  - id: product-surface
    title: Product Surface and Customer Workflow
    body: >
      Marshmallow’s core offering remains fully comprehensive motor insurance rather than a broad menu of cover
      types: the official site says it does not sell third-party-only policies and instead packages cover into four
      direct-purchase tiers — Lightest, Essential, Original, and Plus. The product is tuned to newcomers, with
      pricing inputs built around overseas driving history, proof of claim-free driving from any country, and
      licence acceptance from outside the UK. That newcomer-specific underwriting proposition is then wrapped in
      conventional motor-insurance features such as courtesy-car options, windscreen cover, breakdown cover,
      legal protection, and Europe cover. [CE001] [CE002] [CE003] [CE004] [CE005] [CE006] [CE007] [CE008]

      The customer workflow is explicitly digital-first. Marshmallow’s app-store descriptions say policyholders
      can manage all their policies in one account, download documents, make changes, claim from their phone,
      use emergency guides, and reach live chat quickly. The official help surface mirrors that positioning: the
      help centre and Intercom collection pages expose self-serve flows for buying, document upload, policy
      updates, payment changes, claims, renewals, and cancellations. Specific help articles show that adding a
      driver is app-native for car policies, incident reporting has a prescribed FNOL checklist, and even
      “notification only” accidents still need to be logged quickly if another party is involved. [CE009] [CE010]
      [CE011] [CE012] [CE013] [CE014] [CE015]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]

  - id: operating-architecture
    title: Operating Architecture and Delivery Model
    body: >
      Marshmallow’s product is not just an app; it is an insurer-broker operating stack. The 2024 SFCR says
      Marshmallow Insurance Limited underwrites the motor risk while Marshmallow Financial Services Limited
      distributes the product via major UK price-comparison sites. The same filing says the group IT operation
      and broker cover pricing, underwriting, data management, counter-fraud, claims management, and complaints
      handling, which means the customer-facing experience sits on top of a multi-entity control model rather
      than a single software business. The SFCR also records a joint Product Oversight and Governance Committee
      between insurer and broker, reinforcing that product changes and customer outcomes are overseen as a
      regulated co-manufacturing process. [CE019] [CE020] [CE022] [CE023] [CE024]

      The claims path is also partner-heavy. Marshmallow’s repair FAQ routes validated vehicles into Motor Repair
      Network, while WNS publicly says it was selected to provide 24/7/365 end-to-end claims management from
      first notification of loss through resolution. In parallel, public engineering roles show Marshmallow trying
      to internalise more of this stack: the Claims Tech team says it is building an internal Claims Management
      System covering internal, external, and customer-facing flows plus partner integrations and financial
      reporting. Those same roles expose a materially modern platform footprint — Java/Spring microservices on
      AWS for claims and data, and a SwiftUI-heavy iOS app with modular packages, automated tests, Bitrise,
      Fastlane, SwiftLint/SwiftFormat, Danger, and Tuist. [CE016] [CE018] [CE034] [CE035] [CE036] [CE037]
      [CE038]
    tableRefs: [TE003]
    figureRefs: [FE002, FE003]

  - id: trust-controls
    title: Trust, Privacy, and Compliance Controls
    body: >
      Public trust controls are strongest at the entity and governance layer. The GFSC register says Marshmallow
      Insurance Limited is authorised to effect and carry out land-vehicle and motor-liability insurance into the
      UK, while Marshmallow’s solvency disclosures identify Marshmallow Financial Services Limited as the
      FCA-authorised broker under FRN 797672. The SFCR adds governance detail that is unusually specific for a
      private insurtech: a three-lines-of-defence model, board-level oversight through risk and underwriting
      committees, and a joint Product Oversight and Governance Committee spanning broker and carrier. [CE022]
      [CE023] [CE025] [CE026]

      Privacy and fraud controls are visible, but mostly through legal disclosures rather than a dedicated trust
      centre or security-certification page. Marshmallow’s privacy policy says it collects call recordings,
      live-chat messages, device and usage telemetry, and it names CIFAS, the Insurance Fraud Bureau, Ravelin,
      LexisNexis, Onfido, price-comparison sites, and OEM vehicle-data providers as external data sources. It
      also says OEM vehicle data can include mileage, location, speed, trip duration, and other usage metrics.
      That is enough to confirm a meaningful anti-fraud and identity-verification layer, but not enough to
      validate public security certifications, uptime commitments, or incident-management discipline. [CE021]
      [CE027] [CE028] [CE029] [CE044]
    tableRefs: [TE004]

  - id: maturity-risks
    title: Maturity, Expansion Signals, and Risks
    body: >
      Routine product quality signals are good. The App Store listing showed a 4.9/5 score from 30k ratings at
      fetch time, the listing claims 50,000+ “Marshmallowers,” and the Trustpilot archive showed a 4.2/5 score
      from nearly 40,000 reviews. Live engineering roles also suggest real organisational maturity: the company
      now describes dedicated Acquisition, Retention, and Claims tribes, serves tens of thousands of policies
      through the mobile surface, and says it has insured more than one million drivers while scaling beyond its
      original car-insurance product. External reviews add corroborating evidence that Marshmallow now spans van
      insurance and adjacent financial products, not just one migrant motor policy. [CE030] [CE033] [CE038]
      [CE039] [CE040] [CE041] [CE042]

      The main risk is that edge-case servicing appears weaker than routine servicing. Reviews.io and review
      articles repeatedly describe claims delays, overreliance on live chat or email after FNOL, limited
      escalation by phone, and frustration when documentation or liability is disputed. Those complaints line up
      with the operating model visible in public sources: outsourced claims handling, outsourced repair
      fulfilment, broker/carrier handoffs, and a product that still lacks public status pages, API docs, or
      independently disclosed security certifications. The result is a chapter verdict of “mature digital
      workflow, but still partner- and process-dependent in the hard parts of the journey.” [CE031] [CE032]
      [CE043] [CE044] [CE045]
    tableRefs: [TE005]
    figureRefs: [FE004]

