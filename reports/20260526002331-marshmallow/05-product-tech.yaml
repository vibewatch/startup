    summary: >
      Public evidence shows strong maturity in routine digital servicing and mobile delivery, with lower
      evidence quality around public trust operations and complex-claim handling.
    layout: wide
    approximationNotes: >
      Ratings reflect only public evidence quality and operating visibility from sources reviewed in this run,
      not internal KPIs.
    claimRefs: [CE010, CE012, CE022, CE030, CE031, CE037, CE043, CE044, CE045]
    data:
      columns:
        - Public evidence strength
        - Operating maturity view
        - Why it lands there
      rows:
        - label: Newcomer quote and plan packaging
          values:
            - High
            - Mature
            - Official pages are detailed on cover structure tiering and newcomer-specific inputs.
        - label: Self-serve policy servicing
          values:
            - High
            - Mature
            - App listings help-centre breadth and in-app driver changes are all directly evidenced.
        - label: Mobile engineering platform
          values:
            - High
            - Growth to mature
            - Live hiring signals expose a modern SwiftUI modular CI/CD stack rather than legacy maintenance.
        - label: Claims workflow orchestration
          values:
            - Medium
            - Growth
