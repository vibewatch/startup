figures:
  - id: FE001
    type: flow
    title: Marshmallow customer insurance workflow
    summary: >
      The public workflow runs from newcomer quote and verification through app-based servicing into a
      partner-heavy claims and repair path.
    layout: wide
    approximationNotes: >
      Flow sequence is assembled from official product pages, app listings, and direct Intercom support articles
      rather than internal process maps.
    claimRefs: [CE007, CE009, CE013, CE014, CE015, CE016, CE017]
    data:
      nodes:
        - id: n1
          label: Get quote
          detail: Driver enters UK address licence and prior driving history; Marshmallow positions overseas experience as a pricing input.
        - id: n2
          label: Choose plan and extras
          detail: Customer selects Lightest / Essential / Original / Plus plus add-ons such as breakdown or legal cover.
        - id: n3
          label: Verify and buy
          detail: Policyholder may need to upload ID proof of address NCD evidence or licence details to keep cover valid.
        - id: n4
          label: Manage in app/account
          detail: Documents detail changes additional-driver updates live chat and emergency guides sit in one digital surface.
        - id: n5
          label: Report incident
          detail: FNOL starts through the 24/7 claims line; claimant gathers photos third-party details and avoids admitting fault.
        - id: n6
          label: Validate and route
          detail: Claims path branches into notification-only handling liability investigation or validated repair / total-loss management.
        - id: n7
          label: Repair / settle / close
          detail: Approved repairers courtesy-car rules and partner-managed fulfilment determine final customer experience.
      edges:
        - {from: n1, to: n2, label: Quote priced}
        - {from: n2, to: n3, label: Cover selected}
        - {from: n3, to: n4, label: Policy live}
        - {from: n4, to: n5, label: Incident occurs}
        - {from: n5, to: n6, label: FNOL logged}
        - {from: n6, to: n7, label: Claim outcome}

