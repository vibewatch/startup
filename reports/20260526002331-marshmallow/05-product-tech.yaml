callouts:
  - calloutType: strength
    title: Digital servicing breadth is real not just marketing copy
    body: >
      Marshmallow has unusually good public evidence for the routine customer journey: app-store descriptions,
      official FAQs, and Intercom articles all line up on document access, in-app policy changes,
      notification-only incidents, and guided claims reporting.
    claimRefs: [CE009, CE011, CE013, CE014, CE015]

  - calloutType: risk
    title: The hard part of the journey still depends on partner and process handoffs
    body: >
      Repair fulfilment, disclosed claims outsourcing, broker-carrier coordination, and digital-first escalation
      all create failure points. Review sources suggest those handoffs are exactly where customer sentiment
      weakens during complex claims.
    claimRefs: [CE016, CE018, CE024, CE031, CE043, CE045]

