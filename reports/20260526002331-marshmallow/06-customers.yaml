- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Home insurance cross-sell
    - Core customer base may still be mostly newcomer motor policies
    - Positive wallet-share upside if attach rates are real; limited visibility today
    - Request home-policy counts, attach rates, and claims performance by acquisition cohort
  - - Car finance cross-sell
    - Thin-file lending may widen the relationship but introduces credit sensitivity
    - Could deepen LTV if underwriting holds; could weaken economics if defaults rise
    - Request approvals, defaults, and conversion from insured driver to borrower
  - - Van insurance adjacency
    - Segment broadening may be early and still small relative to core motor book
    - Useful TAM expansion, but not yet proof of diversification
    - Request van-policy count, renewal rate, and share of UK-born versus newcomer customers
  - - International expansion
    - Public customer scale is still referenced mainly through the UK newcomer franchise
    - Could diversify demand geographically, but execution risk is high
    - Request launch timing, target-country pilots, and early conversion metrics
  - - Price-comparison acquisition
    - Public pricing proof leans on comparison-site cohorts such as Confused.com
    - Channel dependence could pressure CAC or pricing quality in soft markets
    - Request acquisition mix by direct, app, referral, and price-comparison channels
  - - Referral-led acquisition
    - Referral programme exists but public share of acquired customers is unknown
    - Could diversify acquisition beyond price-comparison sites if it scales
    - Request referral share of new policies and retention of referred versus non-referred customers
  - - Customer concentration framing
    - Single-account concentration is structurally low in retail insurance, but segment concentration remains meaningful
    - The underwriting risk is over-exposure to one life-stage and product wedge rather than one logo
    - Request premium and policy mix by newcomer tenure, product, and country-of-origin cohort
  notes: For Marshmallow, concentration risk is best thought of as segment, product, and channel dependence rather than enterprise-account concentration.
