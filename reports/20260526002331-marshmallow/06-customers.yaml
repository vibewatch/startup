- id: TU006
  title: Service channel / support operating model table
  columns:
  - Surface
  - Availability
  - Customer moment
  - Evidence
  - Implication
  - Limitation
  rows:
  - - Web and app quote / onboarding
    - Always-on digital flow
    - Quote, policy purchase, validation uploads
    - Official site and app listings
    - Supports fast self-serve acquisition for newcomers
    - No published abandonment or completion rates
  - - 24/7 accident line
    - 24/7
    - New accident or incident reporting
    - Help page and app listings
    - Claims intake is available outside office hours
    - Does not prove fast downstream resolution
  - - Claims-support scale
    - £66m+ paid out in accident support
    - Claims-servicing proof point
    - Claims page
    - Suggests meaningful claims throughput and not just quote generation
    - No denominator for claims paid relative to policies or claim frequency
  - - Existing-claim live chat
    - Mon-Fri 10am-4pm
    - Claim follow-up after first notice of loss
    - Help page
    - Shows a narrower human-support window once a claim exists
    - No published median response time by claim type
  - - General customer support live chat
    - Mon-Fri 9am-6pm; Sat 10am-4pm
    - Policy changes and account questions
    - Help page
    - Digital-first operating model keeps admin low-friction
    - No phone line for general service on public pages
  - - Self-service policy management
    - In-app / account based
    - Documents, policy changes, claim initiation
    - App Store and Google Play listings
    - Reduces need for agent intervention in normal flows
    - Customer reviews say failures are harder to resolve when exceptions occur
  - - Formal complaints path
    - Email, live chat, post
    - Escalation when service fails
    - Complaints policy and complaint FAQ
    - Clear formal path exists and references FOS escalation
    - Public SLAs do not prove actual compliance or satisfaction
  notes: The support model is clearly digital-first. Customer friction appears mainly when a case leaves the normal self-serve flow and enters claims or complaint resolution.
