company:
  name: Marshmallow
chapter:
  number: 6
  title: Customers
  summary: Marshmallow has real customer scale and clear newcomer-market fit, with public evidence of roughly one million insured drivers and strong app engagement, but most named customer proof is drawn from reviews and Ombudsman cases rather than disclosed retention cohorts. Expansion into home, van, and finance products broadens the relationship thesis, yet public durability and concentration evidence is still materially incomplete.
sections:
- id: section-1
  title: Customer segmentation and who pays for the product
  body: 'Marshmallow is a consumer insurer, so the buyer, user, and payer are usually the same household policyholder rather than a corporate account. That makes segmentation more about life situation and product need than about named enterprise logos. The company core segment remains people who have moved to the UK and are disadvantaged by thin local credit files or short local driving histories. Across the homepage, car-insurance page, and newcomer page, Marshmallow repeatedly says it recognises driving history from any country, accepts overseas no-claims evidence, and covers licences from all countries for up to 12 months after UK arrival. The same materials also say 79% of active Marshmallow car policyholders from 2018 through 2024 are new to the UK, which strongly implies that newcomer motorists still anchor the current base. But the public surface also shows broadening. Finder notes that some UK-born drivers are now eligible, Marshmallow has launched van insurance for work-vehicle
    use cases, and the company is marketing home insurance and car finance to the same newcomer demographic. That progression matters because it changes customer quality from a single-product quote engine into a wider relationship stack. Even so, the disclosed segmentation is still much stronger at the marketing-message level than at the revenue-mix level: Marshmallow explains who it wants to serve, but it does not publish customer counts by product line, tenure band, or acquisition channel.'
