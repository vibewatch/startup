  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Renewal rate, lapse rate, GRR, NRR, and policy-tenure cohorts by acquisition channel and newcomer tenure.
    whyItMatters: Public satisfaction proxies do not show whether customer value persists after the first year or after a claim.
    diligencePath: Request annual renewal, retention, and cancellation cohorts for motor, van, home, and finance products, split by acquisition source and customer tenure.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-mix
    missingEvidence: Product-level customer counts, premium mix, and acquisition-channel mix, plus evidence on whether newcomer motor remains the overwhelming majority of the book.
    whyItMatters: The main concentration risk in Marshmallow appears to be segment and channel dependence, but public disclosures are too thin to size it.
    diligencePath: Request policy count, premium, loss ratio, and CAC mix by product line, acquisition channel, newcomer tenure, and top nationality cohorts.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: complaint-benchmarking
    missingEvidence: A current firm-level FCA or FOS export that directly benchmarks Marshmallow complaint rates and uphold rates against peers on a like-for-like basis.
    whyItMatters: The fetched FCA and FOS pages are mostly market-level summaries, so public benchmarking still relies on secondary summaries or individual cases.
    diligencePath: Pull the latest firm-level FCA complaints spreadsheet and the most recent FOS firm dataset, then normalize by active policy count.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: A broader and more systematic sample of named customer stories spanning positive onboarding, renewal, claims, and multi-product expansion.
    whyItMatters: The public named evidence is skewed toward complaints and review anecdotes, which can overstate service failures relative to silent satisfied users.
    diligencePath: Request anonymized complaint cohorts, review sentiment exports, and any internal case-study pack covering retained and expanded customers.
    relatedQuestionRefs:
    - QU010
    - QU011
    relatedTableRefs:
    - TU003
