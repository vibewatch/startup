- id: section-4
  title: Durability, expansion, and concentration limits
  body: 'Retention and concentration are where the public chapter remains incomplete. Marshmallow does disclose complaint volumes and response-time targets in its complaints policy, and independent sources provide app ratings, review-platform scores, and Ombudsman outcomes. Those are useful proxies for durability because they show whether customers are frustrated enough to escalate, but they are not substitutes for clean renewal, cohort, or retention disclosure. None of the reviewed public materials disclosed NRR, GRR, renewal rates, policy tenure distribution, or product-level customer counts for home, van, or car-finance adjacencies. That limits how confidently an investor can underwrite lifetime value or predict cross-sell economics. Expansion potential is real: Marshmallow is already marketing home insurance, van insurance, and direct car finance, and several financing articles describe the ambition to become a one-stop financial shop for newcomers in the UK and eventually other countries.
    But concentration risk in this business is more about segment and channel dependence than about any one customer account. The public pricing evidence leans heavily on newcomer cohorts sold through comparison sites such as Confused.com, while official segmentation still points back to newcomer motor insurance as the dominant franchise. Marshmallow also runs a refer-a-friend programme that pays both sides after 21 claim-free days, which shows the company is trying to add word-of-mouth acquisition alongside comparison-site traffic, but it still does not disclose how important referrals are in the mix. The thesis therefore strengthens on customer need and visible adoption, but still needs private renewal, mix, and complaint-rate data before durability can be scored with high confidence.'
