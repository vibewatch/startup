  evidenceGaps:
    - type: missing-source
      severity: material
      topic: leadership bench
      missingEvidence: A current group-level board roster and fuller executive-team page were not found in the reviewed public sources.
      whyItMatters: Founder dependence, governance quality, and succession risk cannot be fully judged from regulated-entity filings alone.
      diligencePath: Request a current org chart, board list, and committee structure directly from management.
      relatedQuestionRefs:
        - QO008
      relatedTableRefs:
        - TO002
    - type: conflicting-data
      severity: material
      topic: funding mix
      missingEvidence: Public sources do not reconcile exactly how much of lifetime funding is primary equity, convertible debt, or other debt facilities.
      whyItMatters: Cap-table dilution and valuation-step-up analysis depend on separating true equity proceeds from debt-backed capital.
      diligencePath: Request a round-by-round capitalization schedule showing instrument type, gross proceeds, and secondary components.
      relatedQuestionRefs:
        - QO013
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: current operating metrics
      missingEvidence: No reviewed official source provides one canonical current ARR figure or a single company-verified current headcount number at runDate.
      whyItMatters: Later financial and valuation work needs clean denominators rather than a mix of run-rate, turnover, and dated workforce signals.
      diligencePath: Obtain a current KPI pack covering ARR, revenue, headcount by geography, and product-level mix.
      relatedQuestionRefs:
        - QO024
    - type: missing-source
      severity: material
      topic: regulatory perimeter
      missingEvidence: The reviewed set lacks a strong primary-source regulator document corroborating the UKTN-reported 2024 Gibraltar fine and clarifying the current carrier-versus-broker perimeter.
      whyItMatters: Regulatory exposure and control obligations matter more once the company expands products and jurisdictions.
      diligencePath: Pull the primary Gibraltar regulator notice, carrier filings, and any FCA correspondence that define the regulated perimeter.
      relatedQuestionRefs:
        - QO023
    - type: enumeration-incomplete
      severity: minor
      topic: public chronology TO004
      missingEvidence: Public sources do not disclose exact dates for every product launch, internal governance action, or customer milestone relevant to Marshmallow's evolution.
      whyItMatters: The chapter can ship with a public chronology, but later diligence should not mistake it for a full internal operating timeline.
      diligencePath: Ask management for a detailed private timeline covering launches, governance changes, and financing documentation.
      relatedQuestionRefs:
        - QO020
      relatedTableRefs:
        - TO004
