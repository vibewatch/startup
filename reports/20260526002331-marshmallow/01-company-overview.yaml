  - id: founders-governance
    title: Founders, governance perimeter, and leadership visibility
    body: |-
      The best-supported public founding narrative is that Marshmallow was founded in 2017 by twin brothers Oliver and Alexander Kent-Braham, with multiple independent sources also naming software engineer David Goaté in the founding team. Official company materials complicate the chronology slightly by saying Marshmallow launched in 2018, which is best read as a commercial-launch marker rather than a contradiction of the 2017 founding date. That distinction matters for later chronology work because it lets the report preserve both the legal/company formation window and the go-to-market start.

      Public role visibility is heavily founder-led. Official pages still foreground the Kent-Braham twins as co-CEOs, and older founder coverage describes an intentional split where Oliver handled fundraising and external work while Alexander focused more on internal culture and product. The broader governance picture is thinner. Companies House does provide a useful window into the regulated UK broker entity: Alexander was appointed at incorporation, both founders ceased being directors of Marshmallow Financial Services Limited in 2025, and Neil Hodges, Tanis Crosby, and Samuel Butler appear in the current director record. The same filing set shows Marshmallow Technology Ltd as the person with significant control over the broker entity. That means diligence can verify the regulated perimeter, but not the full group board or executive roster. Key-person dependence therefore remains meaningful even though the legal governance perimeter is becoming more professionalized.
    claimRefs:
      - CO004
      - CO005
