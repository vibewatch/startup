company:
  name: Marshmallow
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Marshmallow is a private UK fintech and insurtech business that public sources consistently place in the UK-newcomer car-insurance niche, with 2017 founding evidence around twin brothers Oliver and Alexander Kent-Braham and a 2025 Series C round at just over a $2 billion valuation. By 2026, official surfaces show the company selling car, van, and home insurance plus car finance, while Companies House records, Ombudsman decisions, and uneven funding-scale disclosures indicate that governance, legal-entity, and risk diligence still matter despite strong growth signals.
sections:
  - id: identity-model
    title: Identity, customer wedge, and platform scope
    body: |-
      Marshmallow's public identity is still anchored in a very specific UK problem: people who move to the country often get quoted as if they have no driving history at all. The homepage and core car-insurance pages repeatedly say the company prices using a driver's full experience from any country, not just UK records, and backs that message with its own 2025 comparison-site statistic claiming average savings of £392 for UK newcomers. The same surfaces also say 79% of customers are new to the UK, which is important because it shows the company has not merely adopted migration as a marketing theme; it is still the center of the underwriting thesis.

      What has changed is the breadth of the product and mission statement. The careers page says Marshmallow exists to make migration easy and wants to build a huge technology company, while the 2025 funding announcement says the business aims to become a one-stop financial shop for newcomers. Official product pages show that by runDate the company is already beyond a single-line motor insurer: it sells car insurance, van insurance, home insurance, and direct car finance. In legal-entity terms, the public record is also more layered than the homepage alone suggests. Companies House lists Marshmallow Financial Services Limited as the active UK broker entity at 66 City Road in London, and Marshmallow Credit Services Limited as the active car-finance lender at the same address.
