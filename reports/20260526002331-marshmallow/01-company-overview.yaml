  - id: milestones-risks
    title: Milestones, expansion path, and adverse markers
    body: |-
      The current public picture is not just a growth story; it is also a story of expanding perimeter and accumulating operational obligations. After the 2021 unicorn step-up, public sources show the business adding a Budapest hub, moving from a single-product motor insurer toward home insurance and direct car finance, and preparing to take the newcomer-finance proposition beyond the UK. Sifted says Germany, Canada, and the US were leading candidates for international expansion after the 2025 raise. Official product pages confirm that at least some of that platform ambition has already been operationalized in adjacent financial products.

      Adverse and cautionary signals are real enough to carry forward. Marshmallow's own complaints page explicitly routes eligible disputes to the Financial Ombudsman Service, and the reviewed Ombudsman decisions show at least two cases where Marshmallow Insurance Limited was ordered to compensate customers or reverse elements of its prior stance. UKTN also reported a 2024 Gibraltar regulatory fine tied to premium growth without consent, while Companies House filing history shows founder exits from the regulated broker board and new charges registered in 2025 around the same expansion phase. None of these points disprove the business model, but together they argue for diligence on claims handling, regulatory perimeter, and whether the group can broaden product scope without weakening controls.
