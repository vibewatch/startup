- id: people-governance-and-execution-risk
  title: People, Governance, and Execution Risk
  body: |-
    Marshmallow’s execution burden is rising faster than its public management depth is becoming transparent. Founder concentration remains high: the twins still front strategy and recruiting, while public careers materials describe an ambition to 10x impact, scale products, enter new sectors and countries, and keep posting roles weekly. That is attractive from a growth perspective, but it also means product expansion, compliance build-out, and service quality all have to mature simultaneously.

    Governance is professionalising, but the public record still implies transition risk. Companies House shows founder directors leaving the regulated MFSL board during 2025 and external directors joining across 2024-2025. That is directionally positive, because it should improve regulated-entity discipline, yet it also signals that the operating model is moving away from founder-centralised startup governance while the business is still growing quickly. Public hiring surfaces also note mandatory background checks for new hires because Marshmallow is FCA-authorised, which is another reminder that scale comes with a compliance-heavy labour model, not just engineering hiring.

    The McCartney tribunal case adds a softer but still relevant execution signal. The merits are unresolved, so it should not be overstated. Even so, a former CFO’s discrimination dismissal claim surviving strike-out is enough to justify diligence on senior-team cohesion, decision quality during probationary hires, and whether Marshmallow’s executive bench is deep enough for multi-product international scale. This is a company that may be entering its most control-intensive phase just as its public ambition is accelerating.
