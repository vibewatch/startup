  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: public-legal-register
    missingEvidence: A complete counsel-verified list of all current regulator inquiries, threatened claims, and material settlements involving Marshmallow group entities.
    whyItMatters: The legal register in TR001 covers what is publicly visible, but private regulator dialogue or settled disputes could change the residual-risk ranking.
    diligencePath: Request legal memo, claims counsel schedule, and regulator-correspondence log covering 2024-01-01 onward.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR029
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: The full 2025 facility agreement, covenant package, security-document set, and borrowing-base mechanics behind the registered charge.
    whyItMatters: The Companies House filing proves secured debt exists but not how quickly lenders can tighten operational flexibility in a downside case.
    diligencePath: Request executed debt agreements, covenant model, monthly compliance certificates, and amendment history.
    relatedQuestionRefs:
    - QR014
    - QR018
    - QR030
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: treaty-economics
    missingEvidence: Named current quota-share and excess-of-loss counterparties, ceded percentages, ceding-commission terms, and renewal-risk commentary.
    whyItMatters: Public SFCRs show dependence on reinsurance but do not disclose the full partner roster or the exact economics that determine retained margin.
    diligencePath: Request treaty schedule, broker renewal pack, counterparty limits, and sensitivity of retained economics to renewal repricing.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR015
    - QR030
    relatedTableRefs:
    - TR003
  - type: access-blocked
    severity: material
    topic: cyber-and-service-controls
    missingEvidence: Independent cyber audits, penetration-test results, major incident log, and service-level data for chat and claims escalation.
    whyItMatters: Digital-only operations are central to Marshmallow’s model, but the public sources do not prove whether security and escalation controls are robust under stress.
    diligencePath: Request ISO/NCSC-aligned control evidence, incident register, uptime / response SLAs, and quarterly control-testing outputs.
    relatedQuestionRefs:
    - QR007
    - QR010
    - QR030
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: management-depth
    missingEvidence: Current group org chart, executive succession plan, senior attrition history, and board reporting cadence for regulated and product teams.
    whyItMatters: Public filings show governance transition, but they do not show whether Marshmallow has enough operating depth for simultaneous product and geographic expansion.
    diligencePath: Request org chart, succession matrix, key-person insurance, executive retention metrics, and latest people-risk paper to the board.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR023
    - QR024
    - QR030
    relatedTableRefs:
    - TR004
