- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Repeat conduct sanction
    - GFSC/FCA/FOS announcements; legal correspondence
    - Any new regulator action or remediation order comparable to or worse than the 2024 GFSC settlement
    - Immediate thesis review; pause any valuation-upside assumptions until remediation is verified
  - - Complaint intensity / redress deterioration
    - Self-published complaints data, FCA tables, FOS decisions
    - Complaints-to-business-volume rises materially above 2.11% or new adverse FOS decisions continue to cluster around cancellations and fraud markers
    - Treat service quality as a board-level operating problem, not a customer-support nuisance
  - - Treaty / counterparty stress
    - SFCR, treaty renewals, rating actions, reinsurer mix
    - Loss of panel diversification, weaker ratings, or materially worse quota-share economics at renewal
    - Re-underwrite retained-margin assumptions and downside capital needs
  - - Capital structure tightening
    - Solvency ratio, lender filings, cash disclosures, covenant packages
    - Group solvency coverage falls meaningfully below the current 216% level or lenders tighten controls / refinancing terms
    - Shift view from growth optionality to financing preservation
  - - Execution stretch from expansion
    - Hiring cadence, launch announcements, control incidents, complaint mix
    - New products / countries launch faster than claims quality, complaints, and control metrics stabilise
    - Discount expansion case until launch governance proves repeatable
  - - Founder / senior-team discontinuity
    - Board filings, tribunal developments, executive turnover
    - Unexpected co-CEO or other core operator departure without clear succession depth
    - Reassess management premium and timeline risk before underwriting further scale
  notes: These are investor monitoring thresholds anchored to currently disclosed complaint, solvency, and financing surfaces. They are not management guidance or probability-weighted forecasts.
