chapter:
  number: 7
  title: Risks
  summary: 'Marshmallow’s risk profile is high but not obviously thesis-breaking: the biggest issues are conduct and complaints intensity, digitally mediated claims operations, and continued dependence on reinsurance and debt-backed capital structure choices. 2024 solvency improvement, broader quota-share diversification, and visible governance professionalisation help, but another regulator action, worsening FOS/complaints metrics, or tighter partner/capital support would quickly change the investment case.'
sections:
- id: regulatory-legal-and-conduct-risk
  title: Regulatory, Legal, and Conduct Risk
  body: |-
    Marshmallow’s top risk is not existential insolvency; it is repeating a pattern where growth runs faster than control infrastructure. The clearest signal is the 2024-07-05 Gibraltar Financial Services Commission settlement. The GFSC said Marshmallow Insurance Limited let gross written premium grow beyond what its approved business plan permitted, without the required consent, and concluded the insurer had fallen below the required standard of effective control and management. The outcome was a £200,000 penalty plus board training. That matters because Marshmallow is no longer a simple UK broker story: its Gibraltar carrier writes the risk, its UK broker and credit entities sit in the FCA perimeter, and the company is now broadening into lending and additional products.

    Customer-conduct evidence is also too consistent to dismiss as edge-case noise. Marshmallow’s own complaints policy discloses 5,700 complaints opened and a 2.11% complaints-to-business-volume ratio, while multiple FOS decisions required compensation, claim reopening, or marker removal. Those decisions span valuation, cancellation, voidance, and misinformation about fraud markers. The existence of one non-upheld ombudsman decision is helpful because it shows Marshmallow can defend some validation judgments, but it does not erase the broader pattern that service and communication failures have already produced formal redress.

    Legal overhang exists on two additional planes. The Anthony McCartney employment tribunal matter remains unresolved on the merits after Marshmallow failed to strike out the dismissal discrimination complaint, and the historical Mulsanne litigation shows Marshmallow has already been through complex carrier-launch litigation. Neither looks immediately thesis-breaking, but both raise diligence priority on culture, controls, and legal spend discipline.
