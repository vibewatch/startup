summary:
  headline: >-
    Marshmallow has a real and differentiated UK-newcomer insurance franchise with credible scale and a 2024
    profitability inflection, but the >$2B 2025 mark still outruns the public disclosure needed for a buy call.
  overallScore: 6.3
