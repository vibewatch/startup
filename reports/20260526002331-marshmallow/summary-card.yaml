  topStrengths:
    - >-
      Marshmallow has a differentiated underwriting wedge in UK newcomers, with 79% of active car-insurance
      policyholders reported as new to the UK.
    - >-
      Public evidence supports real scale: over one million insured drivers, a $500M turnover run rate, and 700
      employees across London and Budapest by 2025.
    - >-
      The 2024 SFCR shows first-time profitability and 216% group solvency coverage, giving the story more substance
      than a pure growth narrative.
    - >-
      Product expansion into van insurance, home insurance, and direct car finance creates a credible cross-sell path
      beyond the original motor niche.
    - >-
      The April 2025 round brought in Portage, BlackRock, and Columbia Lake Partners, showing continued access to
      sophisticated capital.
  topRisks:
    - >-
      Complaints intensity and adverse Ombudsman outcomes show real conduct and claims-handling risk, especially for
      cancellations, communication, and non-standard claims.
    - >-
      The 2025 financing included debt as well as equity, and public disclosures still leave debt covenants, collateral,
      and preference-stack terms opaque.
    - >-
      Marshmallow remains a private company with limited public disclosure on cash, burn, unit economics, retention, and
      consolidated revenue quality.
    - >-
      The operating model still depends materially on reinsurance, partner quality, and outsourced claims/repair
      workflows that can degrade customer outcomes.
    - >-
      Expansion into new products and geographies increases regulatory and execution complexity before governance
      disclosure is fully mature.
  unresolvedGaps:
    - >-
      Consolidated cash, burn, runway, CAC/payback, and audited group revenue detail are not public enough for full
      underwriting.
    - Current debt covenants, collateral terms, and preference-stack mechanics remain unclear from public filings.
    - Renewal, retention, NRR/GRR, and customer-concentration data are not publicly disclosed.
    - Public evidence on claims-quality improvement and current firm-level complaint benchmarking remains incomplete.
    - >-
      Economics and traction by home insurance, van insurance, car finance, and future international expansion are still
      only partially visible.
