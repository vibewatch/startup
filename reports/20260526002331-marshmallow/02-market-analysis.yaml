- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Ongoing migration and foreign-born stock
    - Positive
    - Current and ongoing
    - Creates a replenishing pool of customers whose overseas driving history is economically meaningful
    - Ask Marshmallow for cohort-level quote, bind, and renewal rates by arrival tenure and nationality
  - - Recognition of foreign licence and claim-free history
    - Positive
    - Immediate
    - Improves conversion for customers who are mispriced by UK-only underwriting models
    - Request hard data on quote-win lift when foreign NCD proof is provided
  - - Monthly instalments and flexible payment dates
    - Positive
    - Immediate
    - Helps convert cash-constrained households even when annual cover is compulsory
    - Quantify take-up and loss-rate differences for monthly versus annual payers
  - - Repair, labour, parts, and theft inflation
    - Negative
    - Current
    - Keeps premiums high and compresses insurer margins even when competition softens rates
    - Request Marshmallow loss-cost trends by repair type and theft severity
  - - Credit-hire and repair-process friction
    - Negative
    - Current
    - Inflates claim severity and lengthens settlement cycles
    - Ask for Marshmallow credit-hire exposure, claims duration, and garage-channel mix
  - - Licensing, residency, and documentation rules
    - Negative
    - Current
    - Reduces the share of migrants who can convert into valid policies immediately after arrival
    - Ask for drop-off rates by failed address, ID, or licence checks
  - - Complaints and claims-service burden
    - Negative
    - Current
    - Makes trust, handling speed, and redress pathways a real competitive variable, not just brand hygiene
    - Review Marshmallow complaint volumes, uphold rates, and FOS referrals versus market benchmarks
  - - Weak sector underwriting economics
    - Negative
    - 2025-2026
    - Limits how aggressively any insurer can subsidise acquisition in a high-cost market
    - Stress-test Marshmallow's newcomer niche against a prolonged 100%+ NCR environment
  notes: Rows combine public market drivers with explicit diligence asks. The central question is not whether Marshmallow has a real niche, but whether that niche can scale with attractive loss ratios while the wider motor market remains cost-stressed.
