tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - UK private motor insurance
    - Annual personal car and van premium paid by UK residents for legally valid cover, underwriting, claims handling, and complaints handling
    - Commercial fleet, non-motor personal lines, unsecured lending, home insurance, and mobility products outside regulated motor cover
    - Named driver or household paying from personal cash flow
    - This is the outer market Marshmallow must win share from
  - - Newcomer / immigrant motor insurance
    - Resident drivers with non-UK driving history, foreign or recently exchanged licences, and thin UK data files
    - Short-stay visitors, tourists, and non-residents who fail the residency gate
    - Usually the household driver; sometimes influenced by spouse or relocating family unit
    - This is Marshmallow's core wedge inside the broader market
  - - Settled migrants with foreign NCD history
    - Drivers who have lived in the UK long enough to be residents but still benefit from foreign claim-free evidence and global driving-history recognition
    - Buyers already fully absorbed into mainstream UK pricing with no foreign-history advantage
    - Household driver and payer are usually the same person
    - Important bridge segment between fresh arrivals and ordinary incumbent switchers
  - - Adjacent young or thin-file urban drivers
    - High-premium drivers whose age, geography, or limited claims history makes quote dispersion extreme
    - Retirement-age low-risk drivers and low-mileage rural incumbents with already cheap cover
    - Young household driver, parent-supported driver, or other budget-sensitive payer
    - Relevant adjacency because Marshmallow's underwriting approach can extend beyond migrants
  - - Status-quo incumbent cover
    - Standard motor cover bought from insurers that mainly price on UK-only driving history or conventional scorecards
    - Marshmallow's differentiated newcomer underwriting, foreign-history recognition, and more tailored onboarding
    - Same buyer and payer as Marshmallow targets
    - This is the main substitute set, not an abstract “no insurance” option
  notes: 'Market scope is intentionally narrower than all motor-related consumer spend: it is compulsory regulated cover for UK residents, with Marshmallow focused on the newcomer and thin-file slice inside that spend.'
