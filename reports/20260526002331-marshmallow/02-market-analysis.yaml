company:
  name: Marshmallow
chapter:
  number: 2
  title: Market Analysis
  summary: Marshmallow operates in a real but narrower market than generic UK motor insurance. The top-down opportunity is large enough to matter — roughly 28 million policies are sold annually and foreign-born residents account for 10.7 million people — but the monetisable slice is the subset of UK residents who can legally drive, prove identity and history, and still get overpriced by incumbents that lean on UK-only driving files. That niche is structurally supported by migration flows and concentrated in London and the South East, yet it remains constrained by licensing frictions, repair-cost inflation, complaints pressure, and poor industry underwriting margins.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'Marshmallow should not be sized against a vague “all insurance” or even an undifferentiated “all motor” TAM. The relevant market is UK private motor insurance for residents who need legally valid cover and who are priced using information about the driver rather than just the vehicle. Marshmallow''s own product pages make the commercial wedge explicit: it focuses on UK newcomers, accepts licences from all countries for a period, recognises foreign claim-free driving evidence, and sells only fully comprehensive cover. That means the included spend is recurring private motor premium paid by UK residents who can legally drive and who need underwriting, claims service, and complaints handling that fits a non-standard or thin-file profile. The excluded spend is just as important. Short-stay visitors and non-residents sit outside Marshmallow''s own residency gate, and adjacent products such as unsecured lending, home insurance, mobility subscriptions, or commercial fleet are not this
    chapter''s core market. The main substitute is not “no insurance,” because insurance is mandatory. The real substitute is buying standard cover from an incumbent that prices the customer as if their useful driving history began only after arrival in the UK, plus the lowest-cover options offered elsewhere to buyers under acute budget stress. Marshmallow''s category therefore sits inside the broader UK motor market but outside the broadest personal-lines frame: it is regulated, compulsory, price-sensitive insurance sold to residents whose underwriting files are unusually incomplete by UK market standards.'
