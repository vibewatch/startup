  evidenceGaps:
  - type: missing-source
    severity: material
    topic: newcomer-sam
    missingEvidence: A public dataset linking foreign-born residents or recent immigrants to licence status, car ownership, and private motor policy purchase.
    whyItMatters: Without that join, any newcomer SAM is directional rather than investment-grade, and foreign-born population counts overstate immediate addressability.
    diligencePath: Request Marshmallow cohort data on quote requests, binds, and renewals by arrival tenure, nationality bucket, and licence status; cross-check against PCW distribution performance.
    relatedQuestionRefs:
    - QM011
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: migration-revisions
    missingEvidence: A stable post-revision time series for 2024-2025 net migration that does not shift materially between ONS releases.
    whyItMatters: The public narrative around UK newcomer inflow can change materially when ONS revises its comparison base, which affects any market-growth story built on the latest headline.
    diligencePath: Use the latest ONS bulletin as the anchor and keep a revision log for earlier provisional releases rather than averaging them together.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: newcomer-unit-economics
    missingEvidence: Quote-win, claims, retention, and loss-ratio data for newcomer cohorts versus mainstream UK drivers.
    whyItMatters: The public record proves the niche exists but does not show whether Marshmallow's underwriting advantage remains durable after claims inflation, theft, and complaints costs.
    diligencePath: Ask for cohort-level underwriting and retention data, including foreign-NCD verification rates, geography mix, monthly-payment mix, and complaint/FOS referral rates.
    relatedQuestionRefs:
    - QM019
    - QM025
