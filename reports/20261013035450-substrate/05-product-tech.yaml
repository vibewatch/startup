callouts:
  - calloutType: insight
    title: Wavelength Scaling Beyond EUV Optical Limits
    body: Substrate's primary technical thesis is that particle-accelerator X-rays bypass the 13.5 nm physical diffraction boundary of EUV photolithography, delivering single-exposure pattern definition down to sub-nanometer scales and eliminating multi-patterning overhead.
    claimRefs:
      - CE001
      - CE003
      - CE004
  - calloutType: risk
    title: The High-Volume Manufacturing Scaling Chasm
    body: Demonstrating 30 nm pitch vias in a laboratory setting does not establish high-volume manufacturing viability; historical synchrotron lithography failed commercially because scanner throughput, mask proximity thermal stability, and resist chemistry could not compete with optical scanners.
    claimRefs:
      - CE002
      - CE010
      - CE012
