  - id: TE003
    title: Technology and Operating Architecture Breakdown
    columns:
      - Layer / Component
      - Functional Role
      - Core Dependency
      - Primary Technical Risk
    rows:
      - - RF Cavity Accelerator
        - Accelerates electron pulses to relativistic velocity near speed of light
        - High-power RF sources and ultra-high vacuum infrastructure
        - Cavity arcing and pulse-to-pulse energy stability
      - - Magnetic Undulator / Light Source
        - Alternating magnetic fields extract coherent high-intensity X-ray bursts
        - Precision permanent or superconducting magnet assemblies
        - Flux decay, beam pointing drift, and heat dissipation
      - - Optical Transport Subsystem
        - Shapes, filters, and transports X-ray pulses to wafer stage
        - Specialized grazing-incidence mirrors and vacuum beamlines
        - Mirror surface contamination and alignment vibration sensitivity
      - - Wafer Positioning Stage
        - Controls high-speed mechanical alignment and proximity gap
        - Sub-nanometer interferometric feedback and precision motion control
        - Overlay registration errors under dynamic high-speed wafer stepping
    notes: Architecture components compiled from company technical descriptions and synchrotron lithography literature; commercial sub-assembly suppliers and proprietary tolerances not disclosed.
