  - id: TE002
    title: Workflow and Use-Case Comparison
    columns:
      - User Job
      - Current Industry Workflow
      - Substrate Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Advanced Logic Patterning (2nm)
        - High-NA EUV with multi-patterning masks and tin plasma sources
        - Single-exposure X-ray lithography via accelerator beamline
        - Eliminates multi-patterning masks and extreme optical complexity
        - Unproven high-volume wafer throughput and photoresist sensitivity
      - - Critical Dimension Logic Vias
        - Multiple EUV exposures with aggressive optical proximity correction
        - Direct X-ray exposure printing 30 nm pitch and 12 nm contact arrays
        - High pattern fidelity and tight tip-to-tip spacing (13 nm)
        - Stochastic defect density across full 300 mm wafer area uncharacterized
      - - AI Accelerator Fabrication
        - Offshore foundry allocation (TSMC 2nm / N3P) at $30,000+ per wafer
        - Domestic US vertically integrated fab target at $10,000 per wafer
        - Potentially lower wafer costs and localized supply chain resilience
        - No operating fab exists today; target production date is 2028
      - - Nanofabrication Mask Generation
        - Electron-beam direct write with slow throughput or multi-layer EUV masks
        - High-flux synchrotron-like X-ray beamline exposure
        - Potential resolution reserve well beyond 2nm node design rules
        - Thermal load on proximity masks and specialized resist availability
    notes: Current workflow data reflects commercial TSMC 2nm pricing estimates and ASML High-NA EUV specifications; Substrate benefits reflect company targets and lab benchmark claims.
