evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current revenue or run-rate, paying-customer count, capacity reservations, headcount, cash balance, burn, and
      runway are not disclosed in the assigned evidence pool.
    whyItMatters: >-
      These denominators determine commercial validation, organizational capacity, financing urgency, and whether the
      reported funding remains available.
    diligencePath: >-
      Obtain management accounts, bank statements, payroll census, customer and reservation schedules, and a
      board-approved operating plan as of the run date.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      A complete executive and board roster with titles, biographies, ownership, committee responsibilities, succession
      coverage, and employment status.
    whyItMatters: >-
      The current public record is founder-centered and cannot establish whether manufacturing, process integration,
      finance, and governance have accountable leaders.
    diligencePath: >-
      Request the current organization chart, board minutes, committee charters, employment agreements, equity
      schedules, and succession plan.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      The full capitalization table, security classes, check sizes, voting rights, board rights, liquidation
      preferences, debt, grants, and strategic agreements.
    whyItMatters: >-
      Named investor participation does not establish control, economic seniority, future financing support, or the
      amount of unrestricted cash.
    diligencePath: >-
      Review the signed financing documents, cap table, side letters, debt and grant agreements, and board consents with
      company counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: scale-up-risk
    missingEvidence: >-
      Independently witnessed throughput, overlay, uptime, yield, defect density, wafer-uniformity, and
      process-integration data on production-relevant lots.
    whyItMatters: >-
      Resolution images alone do not establish high-volume manufacturing capability or support the 2028 facility target
      and cost objective.
    diligencePath: >-
      Commission an expert technical review of raw metrology, tool logs, qualification plans, process-control data, and
      repeated full-wafer demonstrations.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A customer- and capacity-based Substrate SAM/SOM model with qualified wafer demand, addressable process nodes,
      price per good wafer, ramp timing, and obtainable share.
    whyItMatters: >-
      Without common denominators, broad equipment and semiconductor market estimates cannot establish revenue potential
      or justify an obtainable-market assumption.
    diligencePath: >-
      Obtain the operating model, customer pipeline, capacity plan, target-node roadmap, pricing assumptions, and signed
      qualification or reservation documents; reconcile them into annual good-wafer capacity and revenue.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: manufacturing-constraints
    missingEvidence: >-
      Third-party full-wafer data for wafers per hour, overlay, defect density, yield, uptime, mask life, resist
      performance, and cost per good wafer.
    whyItMatters: >-
      These variables determine whether technical patterning results translate into an economically adoptable
      high-volume process.
    diligencePath: >-
      Commission an independent process audit and repeatability study on the 300 mm tool, including blinded wafer
      metrology and benchmark runs against incumbent process requirements.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: buyer-demand
    missingEvidence: >-
      Named customer qualifications, paid pilots, letters of intent, capacity reservations, or procurement-stage
      evidence tied to price and production timing.
    whyItMatters: >-
      Segment-level spending and industry growth do not demonstrate that buyers will switch manufacturing workflows or
      finance Substrate's ramp.
    diligencePath: >-
      Review the CRM and customer data room; confirm milestones directly with counterparties and distinguish technical
      evaluations from binding commercial commitments.
    relatedQuestionRefs:
      - QM003
      - QM006
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: >-
      Comparable customer quotes or contracts showing Substrate wafer price, volume tier, yield basis, service
      obligations, and total cost against qualified alternatives.
    whyItMatters: Without common units and yield-adjusted economics, the central cost-disruption claim cannot be underwritten.
    diligencePath: >-
      Request redacted customer proposals, process assumptions, full cost models, and third-party validation for matched
      nodes and volumes.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
