callouts:
  - calloutType: strength
    title: Ambition is backed by a differentiated architecture
    body: >-
      Substrate is not proposing a marginal tool upgrade; it is combining a
      particle-accelerator light source, proprietary X-ray lithography, and an
      integrated foundry model, with substantial institutional backing.
    claimRefs: [CO003, CO004, CO006, CO008]
  - calloutType: risk
    title: Financing and manufacturing proof lag the stated destination
    body: >-
      The disclosed financing is meaningful for a startup but small beside
      management's own multi-billion-dollar capital requirement, while independent
      reporting still flags unresolved mass-production accuracy and speed.
    claimRefs: [CO004, CO011, CO015]
