  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cover-metrics
      missingEvidence: >-
        Current revenue or run-rate, paying-customer count, capacity reservations,
        headcount, cash balance, burn, and runway are not disclosed in the assigned
        evidence pool.
      whyItMatters: >-
        These denominators determine commercial validation, organizational capacity,
        financing urgency, and whether the reported funding remains available.
      diligencePath: >-
        Obtain management accounts, bank statements, payroll census, customer and
        reservation schedules, and a board-approved operating plan as of the run date.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-founder-table
      missingEvidence: >-
        A complete executive and board roster with titles, biographies, ownership,
        committee responsibilities, succession coverage, and employment status.
      whyItMatters: >-
        The current public record is founder-centered and cannot establish whether
        manufacturing, process integration, finance, and governance have accountable
        leaders.
      diligencePath: >-
        Request the current organization chart, board minutes, committee charters,
        employment agreements, equity schedules, and succession plan.
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: stakeholder-or-investor-map
      missingEvidence: >-
        The full capitalization table, security classes, check sizes, voting rights,
        board rights, liquidation preferences, debt, grants, and strategic agreements.
      whyItMatters: >-
        Named investor participation does not establish control, economic seniority,
        future financing support, or the amount of unrestricted cash.
      diligencePath: >-
        Review the signed financing documents, cap table, side letters, debt and grant
        agreements, and board consents with company counsel.
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: scale-up-risk
      missingEvidence: >-
        Independently witnessed throughput, overlay, uptime, yield, defect density,
        wafer-uniformity, and process-integration data on production-relevant lots.
      whyItMatters: >-
        Resolution images alone do not establish high-volume manufacturing capability
        or support the 2028 facility target and cost objective.
      diligencePath: >-
        Commission an expert technical review of raw metrology, tool logs, qualification
        plans, process-control data, and repeated full-wafer demonstrations.
      relatedQuestionRefs: [QO008]
