company:
  name: Substrate
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Substrate is a San Francisco semiconductor startup founded in 2022 by James and
    Oliver Proud to build a vertically integrated U.S. foundry around particle-
    accelerator-driven X-ray lithography. Public reporting supports more than $100
    million raised at roughly a $1 billion valuation, but the underwriting case
    remains constrained by unverified scale-up, customer, revenue, headcount,
    governance, and commercial-fab financing evidence.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Substrate is a San Francisco-based private semiconductor startup founded in
      2022 by brothers James and Oliver Proud. Its stated model is broader than
      selling a lithography tool: the company intends to build a vertically
      integrated U.S. foundry whose internally developed particle accelerator
      supplies X-ray light to proprietary lithography equipment. That integration
      could remove supplier markups and architectural constraints, but it also
      combines tool development, process integration, fab construction, and
      manufacturing execution inside one early-stage organization. Substrate says
      its system has produced patterns comparable in resolution to high-NA EUV and
      that it completed a production-quality 300 mm lithography tool; these remain
      company claims rather than independently published high-volume manufacturing
      results. The public evidence therefore establishes a differentiated technical
      and business thesis, not yet a demonstrated commercial foundry.
    claimRefs: [CO001, CO002, CO003, CO008, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, talent, and governance
    body: >-
      James Proud is consistently identified as co-founder and chief executive,
      while Oliver Proud is identified as co-founder without a more specific
      operating title in the retained evidence. Reporting also says the company has
      recruited scientists and engineers from U.S. National Laboratories, TSMC,
      Applied Materials, AMD, Google, Qualcomm, and IBM. That talent mix is relevant
      to the breadth of the technical mission, but the external narrative,
      fundraising explanation, product claims, and 2028 timetable remain heavily
      centered on James Proud. The founders' reported lack of prior semiconductor
      manufacturing experience makes the depth and authority of the broader
      operating team especially important. No retained source provides a formal
      board roster, committee structure, succession plan, or ownership and voting
      rights, so governance and key-person controls require direct diligence rather
      than inference from investor participation.
    claimRefs: [CO001, CO012, CO013, CO014]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-economics
    title: Funding, scale, and economic ambition
    body: >-
      Independent reports published around the October 2025 disclosure place
      cumulative funding above $100 million and the financing valuation at roughly
      $1 billion; one account says more than $1 billion, while others describe a
      $1 billion valuation. Named backers include Founders Fund, General Catalyst,
      Valor Equity Partners, In-Q-Tel, Allen & Co., and Long Journey Ventures.
      Funding raised should not be read as cash available, and the retained sources
      do not disclose round structure, liquidation preferences, debt, secondaries,
      cash balance, or current runway. The financing is also small relative to the
      stated destination: James Proud said a vertically integrated foundry would
      require many billions of dollars and potentially tens or hundreds of billions
      across multiple facilities. Substrate's cost objective of wafers nearer
      $10,000 rather than $100,000 by decade-end is a company target, not current
      revenue, pricing, or unit economics.
    claimRefs: [CO004, CO005, CO006, CO010, CO011]
  - id: milestones-and-underwriting-boundary
    title: Milestones and underwriting boundary
    body: >-
      The public milestone record moved from a 2022 founding through three years of
      largely private development to a broad October 2025 disclosure of financing,
      technology, investors, and a goal to run wafers in a company facility during
      2028. The official news index shows continued publication activity in April
      2026, but it does not by itself demonstrate a customer, qualification, or
      manufacturing milestone. The most decision-relevant counterweight comes from
      independent reporting: specialists viewed the disclosed images as impressive
      while questioning whether the process can preserve accuracy across larger
      wafer areas at mass-production speeds, and SiliconANGLE judged the three-year
      production timetable unlikely. As of the run date, the assigned evidence pool
      supplies no named paying customer, revenue or run-rate figure, headcount,
      capacity reservation, independently measured throughput, yield, uptime, or
      defect-density result. Those are evidence gaps, not evidence that the metrics
      are zero.
    claimRefs: [CO004, CO005, CO007, CO008, CO009, CO015, CO016]
    figureRefs: [FO001]
