    - type: "private-evidence-only"
      severity: "material"
      topic: "production-metrics"
      missingEvidence: "Independent 300 mm throughput, overlay, defect-density, uptime, yield, and multi-layer repeatability data with periods and denominators."
      whyItMatters: "Resolution images do not establish high-volume manufacturability or foundry economics."
      diligencePath: "Commission an independent technical review of production-representative run logs, metrology, maintenance records, and full-wafer outputs."
      relatedQuestionRefs:
