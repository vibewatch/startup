      whyItMatters: "An external industry fab-cost benchmark is far above disclosed fundraising, but it does not quantify Substrate's actual capital need."
      diligencePath: "Review the board-approved build budget, cash balance, cap table, financing commitments, grant status, customer capital, debt terms, and downside runway."
