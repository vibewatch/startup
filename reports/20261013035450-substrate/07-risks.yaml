company:
  name: "Substrate"
chapter:
  number: 7
  title: "Risks"
  summary: "Substrate's dominant risks are technical scale-up, schedule credibility, capital intensity, and the breadth of a vertically integrated tool-plus-foundry build. Public evidence supports proof-of-concept activity and a capable technical team, but it does not yet establish production throughput, fab financing, customer qualification, or the legal and regulatory readiness needed to de-risk the 2028 operating goal."
sections:
  - id: "technical-scale-and-operating-risk"
    title: "Technical scale and operating risk dominate"
    body: >-
      Substrate has evidence of technical activity rather than evidence of high-volume manufacturing readiness. Reporting says the company demonstrated its approach at U.S. national laboratories and its San Francisco facilities, while its disclosed architecture targets 300 mm wafers. The adverse evidence is more decision-relevant: independent coverage says experts remain unsure whether the printed accuracy can be sustained across full wafers at mass-production speed, and Heise reports that absolute acceleration values and a concrete implementation timeline were not disclosed. The strongest current risk is therefore not whether an X-ray exposure occurred, but whether repeatable throughput, overlay, uptime, and yield can support a commercial foundry. Those metrics should be verified before capital is committed to production-scale construction.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR013"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "capital-schedule-and-dependencies"
    title: "Capital and integration compound the schedule risk"
    body: >-
      The 2028 objective is exposed to both financing and systems-integration risk. Two independent publications reported more than $100 million raised at a $1 billion valuation, but funding raised is not cash available and does not reveal the financing stack for a fab. SiliconANGLE separately cites about $15 billion to construct an advanced fab and hundreds of specialized staff, which is an industry benchmark rather than a Substrate budget. The company seeks to change that cost structure by making lithography tooling in house, yet the same vertical integration expands the execution surface from one machine to tooling, process integration, facility construction, and manufacturing operations. A credible mitigation requires staged technical gates, a disclosed capital plan, and qualified external counterparties rather than reliance on valuation or mission alone.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR003"
  - id: "regulatory-legal-and-security-gaps"
    title: "Regulatory, legal, and security posture remains an evidence gap"
    body: >-
      The assigned evidence describes a particle-accelerator X-ray tool, a domestic foundry ambition, and defense-aligned investment, but it does not establish which site-specific permits, export classifications, safety approvals, intellectual-property opinions, or security controls apply. That is a diligence gap, not evidence of a violation or incident. Risk likelihood cannot be responsibly scored until primary records identify the planned site, accelerator configuration, regulated materials or emissions, customer and technical-data flows, and freedom-to-operate analysis. The practical mitigation is a counsel- and engineering-owned compliance matrix tied to construction and customer milestones. Construction should not receive irreversible capital until the applicable approval path, responsible agencies, expected lead times, and blocking conditions are documented.
    claimRefs:
      - "CR004"
      - "CR008"
      - "CR010"
      - "CR013"
    tableRefs:
      - "TR001"
  - id: "mitigations-and-kill-criteria"
    title: "Mitigations must convert into measurable gates"
    body: >-
      Existing mitigations are credible but early: the team includes national-laboratory and semiconductor-company talent, demonstrations have occurred, and management claims that proprietary tooling can reduce cost. None substitutes for production evidence. The investment case should require an independently witnessed 300 mm data package covering throughput, overlay, defect density, uptime, and multi-layer results; a milestone-linked financing plan that distinguishes committed capital from fundraising; documented customer qualification; and a site-specific regulatory schedule. Thesis-break triggers are failure to produce that technical package before production-facility commitments, material slippage of the 2028 goal without a verified replacement plan, or inability to identify sufficient financing and counterparties for the next gated build phase. These triggers avoid inventing unsupported numeric thresholds while making the decision falsifiable.
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR016"
