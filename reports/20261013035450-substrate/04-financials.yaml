callouts:
  - calloutType: risk
    title: The Multi-Billion-Dollar Fab Capital Expenditure Gap
    body: Although Substrate has secured $100 million in equity funding, state-of-the-art semiconductor fabs cost approximately $15 billion to construct and equip. The company's targeted 2028 operational launch will require massive follow-on capital injections, non-dilutive government grants, or customer prepayments that have not yet been secured.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI015
  - calloutType: insight
    title: Single-Exposure Economics Versus Merchant Equipment Costs
    body: Substrate's core economic advantage rests on eliminating multi-patterning steps through single-exposure X-ray lithography and avoiding $400 million merchant EUV tool purchases. If verified at scale, this model could yield structural gross margin advantages, though volume production yield remains the decisive underwriting unknown.
    claimRefs:
      - CI003
      - CI006
      - CI008
