companyProfile:
  summary: >-
    Substrate is a San Francisco-based private semiconductor startup founded in 2022 by James and Oliver Proud. The
    company is trying to combine accelerator-driven X-ray lithography with a vertically integrated U.S. foundry model,
    but the public record still shows only early technical demonstrations, more than $100 million of reported funding,
    and no named commercial customers, revenue, or verified production-scale metrics.
