  topStrengths:
    - Differentiated accelerator-driven X-ray lithography architecture with a vertically integrated foundry thesis.
    - Reported backing from marquee investors and strategic defense-aligned capital.
    - Clear national-security and domestic capacity relevance if the process scales.
  topRisks:
    - No verified production-scale throughput, yield, overlay, or uptime evidence for the 300 mm process.
    - Capital requirements for a commercial fab remain far above disclosed funding.
    - No named customers, reservations, or recurring revenue evidence.
    - Governance, financing-stack, and qualification milestones remain opaque.
  unresolvedGaps:
    - >-
      Public sources do not disclose wafers per hour, overlay, uptime, yield, or defect-density data for Substrate's 300
      mm tool.
    - >-
      No paying customers, capacity reservations, letters of intent, or qualified pilot programs are publicly named as
      of the run date.
    - >-
      The eventual financing stack for commercial fabs, including debt, project finance, grants, customer prepayments,
      and dilution terms, remains undisclosed.
    - >-
      Open sources do not reconcile Substrate's pre-disclosure seed history, board structure, preference stack, or
      formal governance controls well enough for underwriting.
