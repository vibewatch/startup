      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              大盘需求背景强劲：SIA 报告称，2025 年全球半导体销售额为 $791.7 billion，较 2024 年增长 25.6%，其中逻辑芯片是最大的产品类别。这个数字只是需求背景，不是 Substrate 的
              TAM。当前两项光刻设备市场研究估算无法直接调和。Mordor 估算半导体光刻设备市场 2026 年为 $30.44 billion、2031 年为 $47.63 billion，CAGR 为
              9.37%；Market Research Future 则把更宽泛的光刻设备类别估算为 2025 年 $11.74 billion、2035 年 $17.46 billion，CAGR 为
              4.05%。不同的细分口径、应用、年份和专有方法论，阻止了可辩护的合并估算。Mordor 的结构数据更适合做资格判断：纯代工厂占 2025 年支出的 46.89%，亚太地区占 63.58%，DUV 占
              67.31%，300 mm 基材占 72.67%。这些是彼此独立的分母，不是层层嵌套的 TAM-to-SOM。
            claimRefs:
