        title: 展示项
        blocks:
          - type: callout
            title: 极高的商业采用与惯性风险
            body: >-
              Substrate 面临根深蒂固的行业惯性：领先半导体设计公司已为 ASML 的 High-NA EUV 路线图投入数十亿美元，并承诺到 2030 年。要替代 TSMC，需要在 300 mm 晶圆上证明
              sub-2nm 良率、可靠性和缺陷密度，而不只是实验室线宽分辨率。
