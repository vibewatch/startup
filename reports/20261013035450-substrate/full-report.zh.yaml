      - number: '7.3'
        title: 监管、法律与安全姿态仍是证据缺口
        blocks:
          - type: paragraph
            body: >-
              指定证据描述了粒子加速器 X
              射线设备、国内代工厂目标和与国防相关的投资，但没有确定哪些特定场址许可、出口分类、安全批准、知识产权意见或安全控制适用。这是尽调缺口，不是违规或事故证据。在一手记录确认计划场址、加速器配置、受监管材料或排放、客户和技术数据流以及自由实施分析前，不能负责任地评估风险概率。实际缓解方案应是由法律顾问和工程团队负责、与建设及客户里程碑绑定的合规矩阵。在适用的审批路径、责任机构、预计周期和阻断条件形成文件前，建设不应获得不可逆资本。
            claimRefs:
              - CR004
