      - number: '3.2'
        title: 架构差异化有吸引力，但经济性尚未证明
        blocks:
          - type: paragraph
            body: >-
              核心差异化在于架构：Sacra 描述了一台公司声称的紧凑型粒子加速器，用于生成 X 射线，支持 2 nanometer
              及以下图形化；第三方报道则描述了一种同时拥有设备和制造能力的代工厂模式。这可能缩短从设备到工艺的迭代，并减少供应商加价。但公开经济数据不可比。一篇信誉较低的独立文章重复了 $10,000
              晶圆目标，SiliconANGLE 报道先进 ASML 设备约 $400 million，IEEE Spectrum 转述 Canon
              相对于先进浸没式基准的成本拥有率下降主张。这些数据的单位、配置和成熟度都不同。没有任何一项证明 Substrate
              已实现的晶圆成本、设备价格、经良率调整的成本或服务负担，因此表面的成本优势仍是目标，不是投资判断输入。
            claimRefs:
              - CP001
              - CP002
