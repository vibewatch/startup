  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >
              对 Substrate 做投资判断，需要在大胆的国家安全论点与商业半导体制造残酷的资本和技术现实之间取得平衡。公司的核心论点是，传统光学光刻平台，尤其是 ASML 极紫外系统，受制于 1990
              年代确立的架构选择。Substrate 希望通过设计专用紧凑型粒子加速器，把高亮度 X 射线导入专有光刻设备，跳过传统多重图形化的复杂性，在本土生产 sub-2 nm 图形。


              尽管 Founders Fund、General Catalyst 和 In-Q-Tel 等知名风险投资机构提供了支持，截至 2026
              年末可获得的实证证据只支持“继续研究”的建议，信心为中等，风险评级为高。国家实验室的实验室级束流测试证实了底层物理，但商业芯片制造需要连续高速晶圆吞吐量、接近零的缺陷密度，以及整片 300 mm
              晶圆上的纳米级套刻精度。在取得经验证的商业硅良率前以 $1.0 billion 估值进入，会让投资人暴露于严重的下行风险和里程碑延误。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
      - number: '8.2'
        title: 论点验证与关键反论点风险
        blocks:
          - type: paragraph
            body: >
              严谨的尽调框架必须让 Substrate 的宏大公司叙事面对资深半导体分析师和设备专家提出的运营反论点。正向论点建立在垂直整合上：Substrate 不向设备垄断者 ASML 为每台设备支付约 $400
              million、也不只是做独立代工厂，而是自行设计并在内部制造光刻设备。支持者认为，这种硬件与代工厂合一的模式可以把生产有竞争力芯片所需的前期资本压到标准 $10 billion 门槛以下。


              反过来，反论点强调，鉴于运营复杂度前所未有，极端垂直整合在尖端半导体制造中历来难以持续。ASML 花了二十多年时间，并得到 Intel、TSMC 和 Samsung
              数十亿美元共同投资和复杂的全球供应商网络，才实现 EUV 系统商业化。此外，1980
              年代部署同步辐射光刻的历史尝试最终被放弃，因为光学浸没式光刻的进步速度超出预期。试图同时掌握粒子加速器、光学、真空机械、晶圆台和先进节点化学，会叠加多种执行失败模式。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 估值倍数、融资背景与稀释悬置
        blocks:
          - type: paragraph
            body: >
              Substrate 在 2025 年 10 月末走出隐身状态，已累计获得超过 $100 million 股权资本，名义投后估值为 $1.0 billion。融资吸引了 Founders Fund、General
              Catalyst、Allen & Company、Long Journey Ventures 和 Valor Equity Partners 等一线风险投资机构，以及专注国防的投资人
              In-Q-Tel。虽然这笔资金证明团队水平，并符合两党联邦政府将关键芯片生产迁回本土的优先方向，但相对于当前运营规模，它给公司的定价仍处在极高倍数。


              在商业晶圆收入为零、没有披露付费客户或合格产能预留的情况下，$1.0 billion 估值代表的是对未来技术颠覆的纯期权。建设并调试一座运营中的半导体制造设施，需要巨额资本开支；先进制程晶圆厂通常需要 $10
              billion 至 $15 billion。尽管联邦 CHIPS Act 计划已向 19 家企业拨出 $30.9 billion 直接拨款，Substrate
              尚未获得商业晶圆厂建设补贴。因此，建立商业晶圆厂需要大量后续股权融资、商业项目融资或主权贷款担保，这会给现有股东带来显著的稀释悬置。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV011
      - number: '8.4'
        title: 情景建模：乐观、基准与悲观轨迹
        blocks:
          - type: paragraph
            body: >
              为量化不同开发路径下的风险调整后回报，我们把目标生产节点设在 2028 年，并构建乐观、基准和悲观三种运营情景。乐观情景中，Substrate 在 2027 年前以商业速度实现高良率 300 mm
              晶圆图形化，获得大额非稀释性国防或联邦 CHIPS 联盟资金，并在 2028 年交付首批通过认证的晶圆，推动企业价值达到 $3.0 billion 至 $5.0 billion。


              基准情景假设硬件扩产出现常见延迟：Substrate 在测试片上验证 2 nm 以下图形化，但还需要额外 18 至 24 个月解决 300 mm 晶圆集成和缺陷控制。在这条路径上，公司筹集 $200
              million 至 $400 million 的结构化后续股权融资，估值基本持平或小幅上升（$1.0 billion 至 $1.5 billion），稀释 30% 至
              50%。悲观情景中，物理套刻或吞吐量限制在商业规模上无法克服；最初 $100 million 耗尽后资本市场收紧，公司被迫出售知识产权或清算，重演 1980 年代同步加速器光刻项目的历史轨迹。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.5'
        title: 退出路径、最终尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >
              Substrate
              最终能否实现退出流动性，完全取决于能否跨过从实验室物理演示到可靠工业制造的门槛。鉴于尖端光刻涉及国家安全考量和出口管制敏感性，外国收购实际上已被排除，主要流动性路径只剩国内战略并购（例如大型美国国防主承包商或国内半导体集团）和首次公开募股。不过，在公司拿出有缺陷指标记录、且经过验证的多晶圆批次之前，IPO
              或产业出售都不能纳入投资判断。


              在投入成长资本前，潜在投资者必须要求严格的技术尽调，包括由独立计量报告测量标准 300 mm 硅晶圆上的套刻误差、束流开机率和缺陷密度。明确的论点失效触发条件包括：到 2027
              年底仍无法展示连续自动晶圆曝光；从国家实验室招募的关键加速器物理负责人离职；无法为洁净室建设拿到非稀释性项目融资；或现有光刻巨头实现竞争性跨越。
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV013
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资判断：估值偏高，继续研究
            body: >-
              Substrate 提出了一项以主权规模重建国内先进光刻能力的有吸引力论点，但在未经验证的 300 mm 晶圆吞吐量、缺陷密度和合格试点客户都缺失的情况下，以 $1.0 billion
              投后估值进入，意味着投资者承担了未对冲的投机溢价。成长阶段投资者应暂缓出资，直到技术扩产里程碑经过独立审计。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
          - type: callout
            title: 资本密集度与晶圆厂建设稀释
            body: >-
              历史上建设先进晶圆厂需要 $10 billion 至 $15 billion，因此 Substrate 的 $100 million A
              轮融资只能覆盖初期工具研发。若没有数百亿美元的非稀释性联邦拨款或主权项目债务，现有股东在 2028 年实现商业晶圆生产前，仍会在后续融资中遭遇严重稀释。
            calloutType: risk
            claimRefs:
              - CV002
              - CV008
              - CV009
          - type: callout
            title: 光刻先例：物理学与工业执行
            body: >-
              粒子加速器能够产生强烈且相干的 X 射线束，实现精细间距分辨率；但 1980 年代苏联同步加速器项目等历史先例表明，光学光刻靠持续工程改进（例如浸没式光刻和多重图形化）存活下来。要取代
              ASML，不仅需要更优的光源，还需要精密机械、无缺陷掩模和始终可靠的设备。
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV014
