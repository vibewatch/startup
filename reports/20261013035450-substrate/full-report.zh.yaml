      - number: '4.3'
        title: 商业进展与信息缺口
        blocks:
          - type: paragraph
            body: >-
              公开披露确认 Substrate 截至 2026 年完全处于收入前阶段，没有商业晶圆出货、已确认的代工开票或经常性生产收入。公司在 2025 年末走出隐身状态后获得了大量媒体曝光，并与包括商务部长 Howard
              Lutnick、副总统 JD Vance 和国防方向的风险投资机构 In-Q-Tel 在内的美国政府利益相关方接触，但没有宣布与 Nvidia、Apple 或 AMD
              等商业无晶圆厂芯片设计商开展试点客户合作。行业老兵强调，先进半导体光刻商业化是一场分阶段的技术马拉松：在美国国家实验室的测试样片上实现微观线宽只是一步；要在高速运行的情况下，每月维持数千片 300 mm
              晶圆的纳米级套刻和缺陷控制，通常需要十年打磨。中国政府支持的实体多年来投入数十亿美元试图复制 ASML
              能力，但仍未达到商业生产标准。公开吞吐量、良率曲线和客户认证里程碑完全缺失，使商业可行性成为无法从公开申报文件验证的开放尽调缺口。
