      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素包括创纪录的半导体销售、AI 带来的逻辑芯片需求、小型化制程节点、政府支持的美国晶圆厂建设，以及行业寻找 high-NA EUV
              低成本替代方案的努力。但约束因素对时间判断更关键。独立报道称，专家仍不确定 Substrate 能否在量产速度下把已演示的精度维持在整片晶圆上；公司还必须开发光刻胶、掩模、工艺整合和资本密集型晶圆厂。Canon
              的纳米压印经历说明了采用难度：商业交付是在约二十年开发之后才发生的，潜在用户仍要求更高吞吐量、更长模具寿命和更好的缺陷控制。因此，Substrate 所称接近 $10,000 而非 $100,000
              的晶圆目标是公司目标，不是当前市场证据。估值支撑应绑定第三方良率、套刻、正常运行时间、每小时晶圆数、客户认证和融资里程碑，而不是宽泛的半导体 TAM 或未经验证的成本目标。
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决定性变量是商业证明，而非类别规模
            body: 公开记录支持庞大的半导体需求背景，但没有披露 Substrate 专属 SAM、客户认证产能、良品晶圆成本或可取得份额。在这些分母可获得前，投资判断应继续以里程碑为基础。
            calloutType: risk
            claimRefs:
