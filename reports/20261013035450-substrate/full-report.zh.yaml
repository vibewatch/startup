chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Substrate 是一家总部位于旧金山的私营半导体初创公司，由兄弟 James 和 Oliver Proud 于 2022
              年创立。公司宣称的模式不只是销售光刻设备：它计划建设垂直一体化的美国代工厂，由自主研发的粒子加速器为专有光刻设备提供 X
              射线光源。这种一体化可能削减供应商加价和架构约束，但也把设备开发、工艺整合、晶圆厂建设和制造执行压在同一个早期组织内。Substrate 称其系统已产出分辨率可媲美 high-NA EUV
              的图形，并完成了一台生产级 300 mm 光刻设备；这些仍是公司说法，而非独立发布的高产量制造结果。因此，公开证据证明的是一套有差异化的技术与商业论点，而不是一座尚未被证明跑通的商业代工厂。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
