      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              光刻平台的经济买方是晶圆厂或代工厂的资本委员会；用户是工艺整合、光刻、良率和运营团队；付款方则可能是代工厂、IDM、OSAT、联盟，或在 Substrate
              的一体化模式下负责为自身晶圆厂融资的公司。纯代工厂是披露的最大设备支出群体，但先进封装已经占所引市场的 36.74%，说明下游 OSAT 也掌握图形化预算。Substrate
              的目标路径格外苛刻，因为它要认证的不只是设备，还包括完整制造服务。因此，采用应从技术演示推进到整片晶圆可重复性、客户工艺设计套件和测试晶圆、试产认证、产能预留，最后才是量产。指定来源没有量化已签需求、可服务的美国先进制程产能或
              Substrate 在买方预算中的份额。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM012
