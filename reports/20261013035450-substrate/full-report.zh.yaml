  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这套分阶段尽调框架把实验室物理验证、设备经济性、制造规模化缺口和资本密集度串起来，最终得出 research-more 结论。
    approximationNotes: 这里呈现机构投资判断所需的定性评估依赖关系和实证门槛。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
      - CV011
    data:
      nodes:
        - id: step-1
          label: 实验室技术验证
          detail: 美国国家实验室和旧金山设施已在测试样片上展示 X 射线束加速和小于 2 nm 的图形化能力
        - id: step-2
          label: 工具设备经济性假设
          detail: 初创公司称，自研工具设备可以消除 $400M 的 ASML EUV 资本负担和多重图形化开销
        - id: step-3
          label: 制造规模化缺口
          detail: 大面积晶圆上的 300 mm 整片晶圆吞吐量、缺陷密度、套刻精度和开机率数据仍未解决
        - id: step-4
          label: 商业晶圆厂资本门槛
          detail: 先进制芯晶圆厂需要 $10B-$15B，而截至目前仅募集 $100M；重建本土供应链尚未证明可行
        - id: step-5
          label: 资本结构悬念
          detail: $100M 的投入股权对应 $1.0B 投后估值，未来为晶圆厂融资将面临明显的稀释压力
        - id: step-6
          label: 建议结论
          detail: 结论：research-more；估值判断：偏高；在经过验证的 300 mm 试产数据出来前，暂不投入增长资本
