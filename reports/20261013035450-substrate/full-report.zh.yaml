      - number: '6.3'
        title: 持久性、生态惯性与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              由于 Substrate
              尚未出货商业晶圆或获得付费账户，净收入留存率、毛收入留存率、合同期限和群组扩张率等传统客户健康指标无法从公开证据验证。尽调应转而关注潜在客户采用面临的深层结构性壁垒。把芯片设计迁移到全新的光刻范式会产生巨大的采购摩擦：无晶圆厂客户必须开发定制工艺设计套件、认证电子设计自动化工具，并重新设计过去三十年围绕
              ASML 扫描设备优化的制造工作流。可比项目的证据同时显示了挑战和可能的打法。日本代工挑战者 Rapidus 通过为被 TSMC 降级优先级的买方提供专属支持，赢得了独立 AI 芯片开发商
              Tenstorrent；Canon 则把纳米压印设备部署到 Texas Institute for Electronics 联盟，证明了替代光刻的可行性。对 Substrate
              而言，初始商业爬坡期间客户集中度风险会非常高：任何运营中的工厂都不可避免地依赖极少数政府或 AI 初创锚定客户，由他们承担第一代 X 射线代工厂固有的极端良率和交付风险。
            claimRefs:
