  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术规模与运营风险占主导
        blocks:
          - type: paragraph
            body: >-
              Substrate 有技术活动证据，但没有高产量制造就绪的证据。报道说，公司在美国国家实验室和旧金山设施展示了其方案，披露的架构则以 300 mm
              晶圆为目标。反向证据更关系决策：独立报道称，专家仍不确定打印精度能否在量产速度下维持在整片晶圆上；Heise 报道称，绝对加速值和具体实施时间表尚未披露。因此，当前最大风险不是是否发生过一次 X
              射线曝光，而是可重复的吞吐量、套刻、正常运行时间和良率能否支撑商业代工厂。在投入量产规模建设资本前，应验证这些指标。
            claimRefs:
