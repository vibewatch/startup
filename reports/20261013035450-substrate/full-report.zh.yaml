        title: 粒子加速器光源与光学架构
        blocks:
          - type: paragraph
            body: >-
              Substrate 的核心技术架构彻底偏离现有光刻路线：它用射频粒子加速器取代准分子激光器和锡等离子体极紫外（EUV）光源。在 Substrate
              的设计中，射频腔把电子脉冲加速到接近光速的相对论速度；电子脉冲随后在波荡器结构内穿过交替磁场，发出据称亮度比太阳高数十亿倍的相干 X 射线。系统运行在最低约 0.01 nanometers 的 X
              射线波长下，绕开限制 ASML 13.5 nanometer EUV 扫描设备的光学衍射极限。生成的 X 射线束经过专门的掠入射反射光学元件和高真空束线整形，并直接输送至晶圆台，从而消除复杂 EUV
              反射镜投影系统通常存在的透射吸收和多镜反射损耗。
