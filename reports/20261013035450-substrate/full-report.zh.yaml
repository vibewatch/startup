      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决策关口：不可逆晶圆厂资本投入前先看证据
            body: 除非独立数据证明 300 mm 吞吐量、套刻、缺陷密度、正常运行时间和多层可重复性，下一阶段融资已按披露条款承诺，客户认证已有记录，且特定场址的法律与监管关键路径已经完成，否则暂停量产规模的资本承诺。
            calloutType: risk
