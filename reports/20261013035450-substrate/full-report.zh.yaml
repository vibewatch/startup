  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业推进
        blocks:
          - type: paragraph
            body: >-
              Substrate 围绕运营垂直一体化的美国合同半导体代工厂设计商业模式，而不是充当独立资本设备供应商。荷兰现有厂商 ASML 制造光刻扫描设备并卖给独立芯片制造商；与之不同，Substrate
              计划把专有的粒子加速器 X 射线光刻设备保留在自有工厂内部使用。公司计划通过商业晶圆制造合同变现，目标是在 2028 年生产 2nm 级先进处理器，并把自己定位为 Taiwan Semiconductor
              Manufacturing Co.（TSMC）的国内替代方案。创始人兼 CEO James Proud 提出了激进的商业定价论点，声称 Substrate 的方案可以在本十年末把先进制程晶圆加工成本从约
              $100,000 降至约 $10,000。但独立代工行业基准显示，当前先进晶圆价格通常在每片 $30,000 至 $40,000 之间，因此 Substrate 与 $100,000
              基线的比较是极端理论上限，而非正在执行的独立代工挂牌价。关键是，截至 2026 年尽调日期，Substrate 没有披露付费商业客户、已签意向书或有约束力的产能预留协议，其商业收入上行路径完全未经证明。
