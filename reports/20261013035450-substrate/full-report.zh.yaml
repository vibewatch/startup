  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：光刻切入口与代工厂目标
        blocks:
          - type: paragraph
            body: >-
              Substrate 的相关市场小于全球半导体收入，但大于单独销售光刻设备。近期切入口是 300 mm 晶圆的先进图形化：公司称其加速器驱动的 X 射线工艺可以通过单次图形化打印 12 nm
              线宽，并已建成一台内部生产级 300 mm
              设备。长期边界则是拥有光刻设备和制造工艺的垂直一体化美国代工厂，而不是向现有晶圆厂销售设备的独立供应商。因此，纳入的支出包括先进制程光刻资本开支、工艺整合和未来代工晶圆生产；排除芯片设计、下游封装、不需要拟议工艺的存储器或成熟制程设备，以及半导体终端产品的全部价值。现有替代方案包括
              EUV 和 DUV；纳米压印则是已经进入商业评估的相邻低成本图形化方案。
            claimRefs:
              - CM001
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM014
