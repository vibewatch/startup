      - number: '7.4'
        title: 缓解措施必须转化为可衡量关口
        blocks:
          - type: paragraph
            body: >-
              现有缓解措施可信但仍处早期：团队包含国家实验室和半导体公司的专业人才，已经进行了演示，管理层也声称专有设备可以降低成本。这些都不能替代生产证据。投资论点应要求一套有独立见证的 300 mm
              数据包，覆盖吞吐量、套刻、缺陷密度、正常运行时间和多层结果；一份与里程碑挂钩、区分已承诺资本与募资的融资计划；已记录的客户认证；以及特定场址监管时间表。打破论点的触发条件包括：在承诺生产设施前未能拿出技术数据包、2028
              年目标出现重大延误且没有经验证的替代计划，或无法为下一阶段分关口建设找到足够融资和合作方。这些触发条件避免编造没有依据的数值阈值，同时让决策可以证伪。
            claimRefs:
              - CR002
              - CR005
