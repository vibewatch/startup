        title: 领导层、人才与治理
        blocks:
          - type: paragraph
            body: >-
              James Proud 一贯被认定为联合创始人兼 CEO，Oliver Proud 则被认定为联合创始人；留存证据没有给出后者更具体的运营职务。报道还称，公司从美国国家实验室、TSMC、Applied
              Materials、AMD、Google、Qualcomm 和 IBM 招募了科学家与工程师。这套人才组合与技术使命的广度有关，但对外叙事、融资说明、产品主张和 2028 年时间表仍主要由 James Proud
              主导。报道所称创始人缺乏半导体制造经验，使更广泛运营团队的深度和权威性尤其关键。留存来源没有提供正式董事会名单、委员会架构、继任计划或所有权与投票权信息，因此治理和关键人物控制需要直接尽调，不能从投资人参与中推断。
