      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              Substrate 的核心经济假设是，垂直整合与新物理可以把半导体制造成本结构压缩几个数量级。按当前行业实践，独立代工厂必须从 ASML 采购多套极紫外（EUV）光刻系统，每套价格接近 $400
              million，还要配合复杂的多重图形化流程，反复进行曝光、沉积和刻蚀。Substrate 声称，其由射频粒子加速器驱动的 X 射线光源可以产生高强度短波长辐射，在单次曝光中打印复杂的 24nm pitch 双向
              metal-one 层。公司认为，取消多重图形化步骤可以大幅压缩晶圆周期时间、减少掩模工具数量并降低缺陷传播风险。在运营软件上，Substrate 报告称，2026 年 4 月将 Google DeepMind
              的 AlphaEvolve 集成进计算光刻流水线后，模拟计算费用下降 97%，内存消耗下降 74%，执行速度提升 680%。尽管这些实验室级模拟和图形化突破值得注意，Substrate
              最终的晶圆级毛利率路径仍完全取决于 300 mm 晶圆吞吐量、设备正常运行时间和缺陷密度，而这些指标都尚未在商业量产中得到证明。
