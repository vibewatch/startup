        - 潜在芯片设计商、供应商和战略伙伴
        - 验证工艺、提供输入并承诺需求
        - Unknown
        - 技术里程碑无法转化为经过认证的生产需求
        - 高
        - 可审计的认证计划、明确的交易对手与基于里程碑的承诺
        - 未评估，因为指定来源未能证明客户承诺
    notes: 已募资金不等同于可用现金；$15 billion 的外部晶圆厂基准并非 Substrate 的预算主张，所有未知集中度仍未量化。
