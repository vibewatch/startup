  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合覆盖设备、代工厂和内部自建
        blocks:
          - type: paragraph
            body: >-
              Substrate 面对的不是单一同行类别。其垂直一体化方案把新型 X 射线光刻设备与目标中的美国代工厂结合起来，设备端对标 ASML，制造端则对标 TSMC 式现有厂商。Canon 的纳米压印系统和
              xLight 的自由电子激光光源代表相邻技术路线；Nikon 聚焦成熟制程 DUV、现有代工厂采购体系和内部工艺开发，则构成替代方案。Substrate
              自己的新闻室把目标描述为用一台设备打破两个垄断，但这只是战略表述，并不能证明一个新进入者可以替代两套成熟生态。替代方案广泛意味着买方可以等待、多源采购研发，或采用相邻工艺，而无需承诺 Substrate
              的完整栈。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP009
              - CP012
              - CP016
