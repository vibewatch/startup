      - number: '1.3'
        title: 融资、规模与经济目标
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月披露前后发布的独立报道显示，累计融资超过 $100 million，融资估值约为 $1 billion；一篇报道称超过 $1 billion，其他报道则称估值为 $1
              billion。具名支持者包括 Founders Fund、General Catalyst、Valor Equity Partners、In-Q-Tel、Allen & Co. 和 Long Journey
              Ventures。已筹融资额不等于可用现金，留存来源也没有披露轮次结构、清算优先权、债务、老股转让、现金余额或当前现金跑道。相对于公司的目标终点，这笔融资同样很小：James Proud
              表示，垂直一体化代工厂需要数十亿美元，并可能在多个工厂上累计投入数百亿美元。Substrate 的目标是在本十年末把晶圆成本做到接近 $10,000，而不是
              $100,000；这只是公司目标，不是当前收入、定价或单位经济。
