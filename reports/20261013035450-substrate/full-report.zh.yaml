  - id: TV001
    title: 建议汇总表
    columns:
      - 评估维度
      - 分析重点
      - 评估 / 评级
      - 关键证据与基准阈值
      - 决策含义
    rows:
      - - 总体建议
        - 资本配置立场
        - research-more
        - 在缺乏客户或良率证明的情况下，以 $1.0B 投后估值推进尚未产生收入的早期工具开发
        - 暂缓投入增长资本；只有在 300 mm 晶圆吞吐量得到验证、晶圆厂融资路径清晰后才考虑进入
      - - 信心评分
        - 证据基础
        - 中
        - 已核实知名支持者和国家实验室光束演示，但量产数据未披露
        - 在提高信心前，要求第三方对套刻、缺陷密度和稼动率开展一手审计
      - - 风险评级
        - 执行与资本风险
        - 高
        - 商业晶圆厂的三年目标意味着要重建复杂供应链，而在役晶圆厂资本开支为 $10B-$15B
        - 首次 2028 年生产前发生稀释性下轮融资或里程碑延误的风险很高
      - - 估值立场
        - 定价纪律
        - 偏高
        - 已募 $100M、商业晶圆收入为零，却对应 $1.0B 估值，意味着显著的倍数溢价
        - 限制初始敞口；寻求结构化下行保护或基于里程碑的分批投资
    notes: 评级是作者基于公开融资披露、专家技术报道和半导体行业成本基准作出的综合判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
  - id: TV002
    title: 正题 / 反题表
    columns:
      - 战略支柱
      - 核心正题论点
      - 支持证据
      - 反题风险
      - 哪些事实会改变判断
    rows:
      - - 光刻架构
        - 粒子加速器驱动的 X 射线光源有望取代多重图形化 EUV，降低工具复杂度
        - 已在美国国家实验室和旧金山设施演示光束加速及细间距图形化
        - 同步辐射 X 射线光刻曾屡次失败，且无法在高速下维持整片 300 mm 晶圆面积的精度
        - 独立第三方验证量产吞吐量（片 / 小时）和低缺陷密度
      - - 垂直整合模式
        - 内部制造工具并运营本土晶圆厂，可把晶圆厂资本门槛降至远低于 $10B+
        - Substrate 管理层称，自研工具可压低初创公司资本开支，无需为每台 ASML High-NA 工具支付 $400M
        - 资本密集度极高：先进晶圆厂成本达 $15B，数百个供应链环节都需要专业工程团队
        - 签订具有约束力的商业晶圆厂项目融资协议，或获得覆盖晶圆厂建设的客户预付款
      - - 国家安全与制造回流
        - 美国政府政策优先支持本土先进逻辑制造和供应链自主
        - In-Q-Tel 支持、联邦政府对海外依赖的关注，以及 CHIPS Act 向全行业直接拨款 $30.9B
        - Substrate 尚未获得 CHIPS Act 下的商业晶圆厂直接激励，而 xLight 等竞争对手已拿到 $150M FEL 奖励
        - 正式获得联邦项目资格，或签订具有约束力的国防 / 商业锚定采购合同
      - - 商业执行时间表
        - 目标是在 2028 年前运营一家生产 300 mm 晶圆的美国晶圆厂
        - 从 IBM、TSMC、Applied Materials 和国家实验室招聘工程人才
        - 行业共识认为，鉴于在役厂商已领先数十年，用 3 年建成先进 2 nm 级晶圆厂并不现实
        - 建成可运营的试产线，并向外部芯片设计客户交付合格硅晶圆
    notes: 评估 Substrate 的公司主张与独立半导体行业对商业可行性之间的怀疑，呈现两者的张力。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 主要风险与触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 2027 年前成功演示 300 mm 工具；获得 $150M+ 政府拨款或国防锚定客户预付款；试产线在 2028 年前投入运营
        - B/C 轮估值扩大至 $3.0B-$5.0B；可能被美国大型主承包商收购，或获得大规模主权共同投资
        - 光束稳定性严重延误；光学元件退化；ASML 或 TSMC 激进压价
        - 低（15%）：取决于能否同时解决前所未有的物理学和制造扩产难题
      - - 基准情景
        - 工具在测试片样本上演示亚 2 nm 图形化，但 300 mm 整片晶圆集成推迟至 2029 年或更晚；额外融资 $200M-$400M，稀释 30%-50%
        - 估值持平或温和变化（$1.0B-$1.5B 平轮 / 延长轮）；公司转向工具许可或专业研发晶圆厂
        - 在没有商业晶圆收入的情况下大量烧钱；本土供应链出现执行瓶颈
        - 中（60%）：符合深科技硬件和光刻开发中常见的时间表延长
      - - 悲观情景
        - 无法在商业速度下将光束扩展到生产晶圆面积；烧掉 $100M 后资本市场关闭；晶圆厂建设停滞
        - 估值下调，或以低于投入资本的价格进行困境 IP 收购（企业价值 <$100M）
        - 物理层面的套刻 / 吞吐量限制；关键人才流失；无法筹得晶圆厂洁净室所需的 $1B+
        - 中（25%）：创始人承认初始成功概率为 1%；替代光刻技术曾有失败先例
    notes: 情景假设模拟 2028 财年内可能出现的时间表偏差、稀释敞口和企业估值结果。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV014
