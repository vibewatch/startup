      - number: '7.2'
        title: 资本与整合叠加进度风险
        blocks:
          - type: paragraph
            body: >-
              2028 年目标同时暴露于融资风险和系统整合风险。两篇独立出版物报道称，融资超过 $100 million，估值为 $1
              billion；但已筹融资额不等于可用现金，也没有揭示晶圆厂的融资结构。SiliconANGLE 另称，建设先进晶圆厂约需 $15 billion 和数百名专业员工；这是行业基准，不是 Substrate
              的预算。公司希望通过内部制造光刻设备改变成本结构，但同样的垂直整合也把执行范围从一台机器扩展到设备、工艺整合、设施建设和制造运营。可信的缓解方案需要分阶段技术关口、已披露的资本计划和合格的外部合作方，而不是只依赖估值或使命。
            claimRefs:
              - CR005
