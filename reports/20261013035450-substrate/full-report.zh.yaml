              截至 2026 年 10 月，Substrate 仍是一家从深度隐身状态过渡中的早期企业，没有待售商业产品、付费账户或可证明的客户收入。公司在 2025 年末宣布累计股权融资超过 $100
              million，名义估值为 $1 billion；但公开披露显示，商业晶圆采购订单、意向书和产能预付款均为零。管理层已公开释放信号，目标是在 2028
              年建成运营中的制造工厂并运行硅晶圆，把这一时间表定位为重要的国家安全任务。然而，独立半导体分析师和行业老兵提醒，从零建设先进半导体制造设施通常需要数百亿美元和多年的设备认证周期。相比之下，下一代光刻设备的行业采用窗口到
