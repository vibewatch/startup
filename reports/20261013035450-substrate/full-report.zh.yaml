  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与目标需求
        blocks:
          - type: paragraph
            body: >-
              Substrate 的商业论点建立在一个宏大命题上：说服美国半导体设计商放弃根深蒂固的海外制造供应链，转向未经验证的垂直一体化国内代工厂。公司的潜在客户自然分为三个可触达层级。第一层也是利润最高的一层，是无晶圆厂
              AI 加速器开发商和超大规模云服务商，包括 Nvidia 和 Apple 等知名公司；它们对先进计算芯片的旺盛需求，目前几乎完全依赖 Taiwan Semiconductor Manufacturing
              Company（TSMC）。Substrate 向这些买方承诺大幅降低先进制程晶圆价格，并在地缘上摆脱亚洲供应链要冲。第二层是主权微电子项目、国防承包商和通过 In-Q-Tel
              等实体协调的情报机构；它们对国内供应韧性和安全的本土制造的重视，远高于商业价格弹性。最后，专业边缘计算和高性能计算开发商构成第三个潜在群体；它们在 TSMC
              的一级客户体系中难以获得产能，因此寻求专属产能分配。不过，尽管目标客户画像清楚，Substrate 尚未宣布任何正式商业合作或来自这些细分市场的客户设计胜出。
