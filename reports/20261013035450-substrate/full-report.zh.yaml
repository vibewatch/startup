      - number: '3.3'
        title: 现有厂商认证与既有工作流构成实际护城河
        blocks:
          - type: paragraph
            body: >-
              关键竞争壁垒不只是分辨率。报道称 ASML 是唯一的 EUV 供应商；Canon
              花了约二十年实现纳米压印商业化，如今仍靠演示和原型存储器评估来打开工厂大门。这些历史说明了认证摩擦、积累的工艺配方、正常运行时间预期、掩模与光刻胶整合、服务基础设施，以及客户对良率风险的厌恶。Substrate
              计划垂直整合，可能降低对外部扫描设备供应商的依赖，但也把设备、工艺、晶圆厂、服务和客户爬坡执行集中在一家年轻公司里。因此，买方可以继续使用已认证的代工厂、试点 Canon 或 xLight
              相邻方案，或资助内部工艺工作，在切换生产量前保留选择权。
            claimRefs:
              - CP002
              - CP007
              - CP011
              - CP015
      - number: '3.4'
        title: 护城河是整合式学习与资本化现有体系之间的竞速
        blocks:
          - type: paragraph
            body: >-
              Substrate
              最强的潜在护城河，是贯穿光源、光学、化学、工艺配方和晶圆厂运营的闭环学习。其弱点在于，同样的范围也会成倍放大资本和认证风险。独立报道称，专家对演示图像印象深刻，但质疑整片晶圆精度、生产速度和拟议时间表。与此同时，xLight
              获得了 $150 million 的联邦原型项目拨款，Canon 在长期开发后实现了商业出货，SEMI 则预测前端设备支出将从 2025 年的 $110 billion 增至 2026 年的 $130
              billion，这说明现有厂商和国家项目仍能持续投入。因此，差异化潜力很大，但尚未稳固：防御力取决于经验证的吞吐量、套刻、缺陷密度、良率、正常运行时间、合格客户，以及能扛住现有厂商反应的融资结构。
