            title: 主权与细分 AI 加速器的早期采用路径
            body: Rapidus 等类似的新兴代工厂表明，小型 AI 处理器开发商和主权国防项目是最容易触达的早期采用者，因为它们往往被 TSMC 降低优先级，并寻求国内供应安全。
            calloutType: insight
