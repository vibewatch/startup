              则认为三年投产时间表不太可能实现。截至本报告运行日期，指定证据池没有具名付费客户、收入或营收跑率、员工数、产能预留、独立测量的吞吐量、良率、正常运行时间或缺陷密度结果。这些是证据缺口，不代表这些指标为零。
