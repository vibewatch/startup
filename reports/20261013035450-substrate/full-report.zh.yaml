        title: 里程碑与投资判断边界
        blocks:
          - type: paragraph
            body: >-
              公开里程碑记录从 2022 年成立开始，经历三年大体处于私下开发阶段，直到 2025 年 10 月广泛披露融资、技术、投资人，以及 2028 年在公司工厂运行晶圆的目标。官方新闻索引显示 2026 年 4
