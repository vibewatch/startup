figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Phased adoption and qualification lifecycle for prospective foundry customers navigating Substrate X-ray lithography technology from laboratory validation to commercial wafer volume.
    data:
      nodes:
        - id: laboratory-demonstration
          label: 1. Laboratory Feasibility
          phase: Technology Validation
          description: Demonstration of sub-2nm pattern exposures at US National Laboratories; no customer hardware involved.
          evidenceStatus: Completed in-house demonstration
        - id: prototype-shuttle-run
          label: 2. Test Vehicle Run
          phase: Proof of Concept
          description: Prospective fabless partners submit test structures for multi-project test wafers to evaluate yield and overlay.
          evidenceStatus: Unannounced diligence gap
        - id: pilot-qualification
          label: 3. Pilot Line Qualification
          phase: Pilot Production
          description: Fabrication of full custom test ASICs; customer evaluates defect density, electrical parametric yield, and timing.
          evidenceStatus: Projected for 2028 facility
        - id: initial-commercial-order
          label: 4. Low-Volume Production
          phase: Commercial Onset
          description: Initial production orders of up to half a dozen specialized or sovereign customers under captive pricing.
          evidenceStatus: Pending fab completion
        - id: ecosystem-tooling-lockin
          label: 5. Production Ramp & Tool Integration
          phase: Volume Manufacturing
          description: Integration into production automated material handling systems (AMHS) and electronic design automation (EDA) flows.
          evidenceStatus: Skeptical industry consensus
        - id: multi-source-expansion
          label: 6. Multi-Fab Expansion
          phase: Expansion Loop
          description: Scale-out of secondary accelerator-driven fab modules with commercial land-and-expand volume contracts.
          evidenceStatus: Long-term theoretical horizon
    approximationNotes: Phased lifecycle modeled from standard advanced semiconductor foundry qualification milestones and comparable Rapidus timelines.
