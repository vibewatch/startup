callouts:
  - calloutType: risk
    title: Extreme Commercial Adoption and Inertia Risk
    body: 'Substrate faces entrenched industry inertia: leading semiconductor design firms have committed billions to ASML''s High-NA EUV roadmap through 2030. Displacing TSMC requires proving sub-2nm yield, reliability, and defect density across 300 mm wafers, not merely laboratory feature resolution.'
    claimRefs:
      - CU007
      - CU009
      - CU010
  - calloutType: insight
    title: Sovereign and Niche AI Accelerator Early Adopter Pathway
    body: Analogous upstart foundries like Rapidus demonstrate that smaller AI processor developers and sovereign defense programs represent the primary accessible early adopters, as they are often deprioritized by TSMC and seek domestic supply security.
    claimRefs:
      - CU005
      - CU011
