            title: Sovereign and Niche AI Accelerator Early Adopter Pathway
            body: >-
              Analogous upstart foundries like Rapidus demonstrate that smaller AI processor developers and sovereign
              defense programs represent the primary accessible early adopters, as they are often deprioritized by TSMC
              and seek domestic supply security.
            calloutType: insight
            claimRefs:
              - CU005
