        title: Exhibits
        blocks:
          - type: callout
            title: Comparable economics are not public
            body: >-
              The evidence mixes a wafer-cost objective, equipment price, cost-of-ownership estimate, and prototype
              subsidy; none proves Substrate's yield-adjusted production cost.
            calloutType: risk
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP012
          - type: callout
            title: Qualification is the incumbent advantage
            body: >-
              Canon's roughly 20-year commercialization path and ongoing prototype evaluations show why technical
              resolution alone does not eliminate switching friction.
            calloutType: insight
            claimRefs:
              - CP011
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Motion
        blocks:
          - type: paragraph
            body: >-
              Substrate has architected its business model around operating a vertically integrated U.S. contract
              semiconductor foundry rather than acting as a merchant capital equipment vendor. Unlike Dutch incumbent
              ASML, which manufactures lithography scanners for sale to merchant chipmakers, Substrate plans to retain
              its proprietary particle-accelerator X-ray lithography tools exclusively for internal deployment across
              its own fabrication facilities. The company aims to monetize through commercial wafer manufacturing
              contracts targeting 2nm-class advanced processors by 2028, positioning itself as a domestic alternative to
              Taiwan Semiconductor Manufacturing Co. (TSMC). Founder and CEO James Proud has stated an aggressive
              commercial pricing thesis, asserting that Substrate's approach can reduce leading-edge wafer processing
              costs from approximately $100,000 to roughly $10,000 by the end of the decade. However, merchant foundry
              industry benchmarks indicate that prevailing advanced wafer prices currently range between $30,000 and
              $40,000 per wafer, meaning Substrate's comparison against a $100,000 baseline represents an extreme
              theoretical upper bound rather than an active merchant list price. Crucially, as of the 2026 diligence
              date, Substrate has disclosed no paying commercial customers, signed letters of intent, or binding
              capacity reservation agreements, leaving its top-line commercial revenue trajectory entirely unproven.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI006
      - number: '4.2'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The core economic hypothesis behind Substrate is that vertical integration and novel physics can compress
              semiconductor manufacturing cost structures by orders of magnitude. Under prevailing industry practices,
              merchant foundries must purchase multiple extreme ultraviolet (EUV) lithography systems from ASML at price
              tags approaching $400 million each, alongside complex multi-patterning processes that require repeated
              exposure, deposition, and etch cycles. Substrate claims that its X-ray light source, powered by
              radio-frequency particle accelerators, generates intense, short-wavelength radiation capable of printing
              complex 24nm pitch bidirectional metal-one layers in a single exposure. By eliminating multi-patterning
              steps, the company argues it can dramatically compress wafer cycle times, reduce mask tooling counts, and
              minimize defect propagation risks. On the operational software front, Substrate reported in April 2026
              that integrating Google DeepMind's AlphaEvolve into its computational lithography pipeline reduced
              simulation compute expenses by 97%, lowered memory consumption by 74%, and accelerated execution speeds by
              680%. Despite these laboratory-scale simulation and patterning breakthroughs, Substrate's ultimate
              wafer-level gross margin path depends entirely on 300 mm wafer throughput, tool uptime, and defect
              density, none of which have been demonstrated in commercial volume production.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI006
              - CI008
              - CI009
      - number: '4.3'
        title: Commercial Traction and Information Gaps
        blocks:
          - type: paragraph
            body: >-
              Public disclosures confirm that Substrate is entirely pre-revenue, with zero commercial wafer shipments,
              recognized foundry billings, or recurring production revenue as of 2026. While the company emerged from
              stealth in late 2025 with significant media visibility and has engaged with U.S. government stakeholders
              including Commerce Secretary Howard Lutnick, Vice President JD Vance, and defense-focused venture arm
              In-Q-Tel, it has not announced pilot customer engagements with commercial fabless chip designers like
              Nvidia, Apple, or AMD. Industry veterans emphasize that commercializing advanced semiconductor lithography
              represents a multi-stage technological marathon: achieving microscopic feature resolution on test coupons
              in U.S. national laboratories is only one step, whereas maintaining nanometer-scale overlay and defect
              control across thousands of 300 mm wafers per month running at high speeds typically requires a decade of
              refinement. Chinese state-backed entities have invested billions over multiple years trying to replicate
              ASML's capabilities without matching commercial production standards. The complete absence of public
              throughput, yield curves, and customer qualification milestones leaves commercial viability as an open
              diligence gap that cannot be validated from public filings.
            claimRefs:
              - CI005
              - CI010
              - CI014
      - number: '4.4'
        title: Capital Adequacy and Financial Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Substrate has demonstrated remarkable early capital access, raising over $100 million in cumulative equity
              funding at a $1 billion valuation from Peter Thiel's Founders Fund, General Catalyst, Valor Equity
              Partners, Allen & Company, Long Journey Ventures, and In-Q-Tel. Nevertheless, this balance sheet must be
              evaluated against the unprecedented capital intensity of modern semiconductor fabrication. Industry
              benchmarks establish that constructing an advanced chipmaking facility today demands approximately $15
              billion in capital expenditure, backed by specialized infrastructure and hundreds of highly trained
              cleanroom personnel. Substrate asserts that designing and fabricating its lithography tools internally
              compresses the capital required to reach initial production below traditional $10 billion-plus thresholds.
              Even if that vertical capital compression holds, Substrate's $100 million in equity capital is
              insufficient by more than an order of magnitude to finance the physical construction, cleanroom equipment,
              gas distribution, and operational scale-up required for its stated 2028 operational target. Bridging this
              capital divide will require massive follow-on financing rounds, CHIPS Act Title III grant allocations,
              project finance debt facilities, or substantial customer pre-payments. For late-stage underwriting,
              Substrate's financial profile presents an extraordinary risk-reward skew: compelling theoretical unit
              economics overshadowed by extreme forward capital dependency and unproven volume yield.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Multi-Billion-Dollar Fab Capital Expenditure Gap
            body: >-
              Although Substrate has secured $100 million in equity funding, state-of-the-art semiconductor fabs cost
              approximately $15 billion to construct and equip. The company's targeted 2028 operational launch will
              require massive follow-on capital injections, non-dilutive government grants, or customer prepayments that
              have not yet been secured.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI015
          - type: callout
            title: Single-Exposure Economics Versus Merchant Equipment Costs
            body: >-
              Substrate's core economic advantage rests on eliminating multi-patterning steps through single-exposure
              X-ray lithography and avoiding $400 million merchant EUV tool purchases. If verified at scale, this model
              could yield structural gross margin advantages, though volume production yield remains the decisive
              underwriting unknown.
            calloutType: insight
            claimRefs:
              - CI003
              - CI006
              - CI008
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Particle Accelerator Source and Optical Architecture
        blocks:
          - type: paragraph
            body: >-
              Substrate’s core technological architecture departs radically from incumbent photolithography by replacing
              excimer lasers and tin-plasma extreme ultraviolet (EUV) light sources with radio-frequency particle
              accelerators. In Substrate’s design, radio-frequency cavities accelerate electron pulses to relativistic
              velocities approaching the speed of light, which then navigate alternating magnetic fields within
              undulator structures to emit coherent X-ray light characterized as billions of times brighter than the
              sun. By operating at X-ray wavelengths extending down toward 0.01 nanometers, the system circumvents the
              optical diffraction limitations that restrict ASML’s 13.5 nanometer EUV scanners. The resulting X-ray beam
              is shaped and transported through specialized grazing-incidence reflective optics and high-vacuum
              beamlines directly to the wafer stage, eliminating the transmissive absorption and multi-mirror reflection
              losses typical of complex EUV mirror projection systems.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
