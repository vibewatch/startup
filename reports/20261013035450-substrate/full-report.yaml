  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set spans tools, foundries, and internal build
        blocks:
          - type: paragraph
            body: >-
              Substrate does not face a single peer category. Its vertically integrated proposition combines a novel
              X-ray lithography tool with an intended U.S. foundry, placing it against ASML at the equipment layer and
              TSMC-style incumbents at the manufacturing layer. Canon's nanoimprint system and xLight's
              free-electron-laser source represent adjacent technical routes, while Nikon's mature-node DUV focus,
              incumbent foundry procurement, and internal process development remain substitutes. Substrate's own
              newsroom frames the ambition as killing two monopolies with one tool, but that framing is a strategy
              statement rather than proof that one entrant can displace both established ecosystems. The broad set of
              alternatives means buyers can wait, multi-source R&D, or adopt an adjacent process without committing to
              Substrate's full stack.
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP009
              - CP012
              - CP016
