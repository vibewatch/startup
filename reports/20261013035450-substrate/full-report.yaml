      - number: '5.2'
        title: Patterning Performance and Resolution Scaling
        blocks:
          - type: paragraph
            body: >-
              In laboratory demonstrations conducted across United States National Laboratories and proprietary San
              Francisco facilities, Substrate claims to have demonstrated lithographic feature definitions that match or
              exceed the requirements of advanced 2nm logic nodes. Published test results highlight the printing of
              random logic contact arrays exhibiting 12 nm critical dimensions alongside 13 nm tip-to-tip spacing, as
              well as random vias patterned at a 30 nm center-to-center pitch. Crucially, the short wavelength of X-ray
              radiation provides sufficient intrinsic resolution reserve to print these dense geometries in a single
              exposure pass, eliminating the costly multi-patterning mask sequences and extensive optical proximity
              correction required by High-NA EUV tools. Substrate supplements hardware design with machine learning
              physical models that optimize beamline parameters, claiming to compress complex optics tuning cycles from
              years into days.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE010
      - number: '5.3'
        title: Vertically Integrated Foundry Model and Commercial Economics
        blocks:
          - type: paragraph
            body: >-
              Unlike ASML, which operates as an equipment supplier to merchant foundries, Substrate is pursuing a
              vertically integrated commercial foundry strategy designed to construct and operate its own semiconductor
              manufacturing facilities on American soil. The company emerged from stealth in late 2025 after spending
              three years developing custom in-house lithography tooling, targeting an operational domestic fabrication
              facility processing customer wafers by 2028. Substrate projects that its simplified single-exposure
              architecture and in-house tool manufacturing will reduce edge silicon wafer costs from roughly $100,000 to
              approximately $10,000 by the end of the decade. This economic objective stands in sharp contrast to
              established commercial foundries like TSMC, whose 2nm node begins volume production in 2026 with wafer
              prices projected up to $30,000, reflecting massive capital costs for GAAFET tooling and High-NA EUV
              machinery.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE011
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE009
              - CE011
      - number: '5.4'
        title: Manufacturing Maturity, Physics Hurdles, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Despite encouraging laboratory demonstrations, Substrate faces profound engineering hurdles in
              transitioning particle-accelerator lithography from static physics experiments to high-volume commercial
              semiconductor manufacturing. Historical efforts in synchrotron X-ray lithography during the 1990s stalled
              due to prohibitive facility infrastructure expenses, low wafer throughput, mask thermal distortion, and
              inadequate photoresist sensitivity. Semiconductor industry experts express skepticism that Substrate can
              maintain sub-nanometer overlay accuracy across full 300 mm wafers at commercial scanner velocities within
              its aggressive three-year timeline. To date, Substrate has released no empirical measurements documenting
              wafers-per-hour throughput, defect density, line-edge roughness, or tool uptime. Closing these fundamental
              diligence gaps remains the decisive prerequisite for verifying whether Substrate can bridge the gap
              between national laboratory physics and high-volume merchant foundry operations.
            claimRefs:
              - CE010
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Wavelength Scaling Beyond EUV Optical Limits
            body: >-
              Substrate's primary technical thesis is that particle-accelerator X-rays bypass the 13.5 nm physical
              diffraction boundary of EUV photolithography, delivering single-exposure pattern definition down to
              sub-nanometer scales and eliminating multi-patterning overhead.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: callout
            title: The High-Volume Manufacturing Scaling Chasm
            body: >-
              Demonstrating 30 nm pitch vias in a laboratory setting does not establish high-volume manufacturing
              viability; historical synchrotron lithography failed commercially because scanner throughput, mask
              proximity thermal stability, and resist chemistry could not compete with optical scanners.
            calloutType: risk
            claimRefs:
              - CE002
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Demand
        blocks:
          - type: paragraph
            body: >-
              Substrate has architected its commercial thesis around an ambitious proposition: convincing American
              semiconductor designers to abandon entrenched foreign manufacturing supply chains in favor of an unproven
              vertically integrated domestic foundry. The company's prospective customer universe naturally stratifies
              into three distinct addressable tiers. The first and most lucrative tier consists of fabless AI
              accelerator developers and hyperscale cloud providers—including high-profile firms like Nvidia and
              Apple—whose insatiable appetite for advanced computing silicon currently tethers them almost entirely to
              Taiwan Semiconductor Manufacturing Company (TSMC). For these buyers, Substrate promises a radical
              structural reduction in leading-edge wafer pricing alongside critical geographic diversification away from
              Asian geopolitical choke points. The second tier comprises sovereign microelectronics programs, defense
              contractors, and intelligence community agencies coordinated through entities like In-Q-Tel, which value
              domestic supply resilience and secure onshore fabrication far above commercial price elasticity. Finally,
              specialized edge compute and high-performance computing developers represent a third potential cohort,
              seeking dedicated capacity allocation that they struggle to secure within TSMC's tier-one customer
              hierarchy. However, while target customer profiles are clear, Substrate has yet to announce any formal
              commercial engagements or customer design wins across any of these segments.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
