        title: Exhibits
        blocks:
          - type: callout
            title: 'Decision gate: evidence before irreversible fab capital'
            body: >-
              Pause production-scale capital commitments unless independent data establish 300 mm throughput, overlay,
              defect density, uptime, and multi-layer repeatability; the next financing phase is committed on disclosed
              terms; customer qualification is documented; and the site-specific legal and regulatory critical path is
              complete.
            calloutType: risk
