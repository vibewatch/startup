      - number: '6.2'
        title: Commercial Trajectory and Production Milestones
        blocks:
          - type: paragraph
            body: >-
              As of October 2026, Substrate remains an early-stage enterprise in transition from deep stealth, operating
              without commercial products for sale, paying accounts, or demonstrable customer revenue. While the company
              announced more than $100 million in cumulative equity financing at a headline $1 billion valuation in late
              2025, public disclosures reflect zero signed commercial wafer purchase orders, letters of intent, or
              capacity prepayments. Leadership has publicly signaled an aggressive target of constructing an operational
              fabrication plant and running silicon wafers by 2028, positioning this timeline as a vital national
              security imperative. Nevertheless, independent semiconductor analysts and industry veterans caution that
              building an advanced semiconductor fabrication facility from the ground up typically demands tens of
              billions of dollars and extensive multi-year tool qualification cycles. By comparison, industry adoption
              windows for next-generation lithography tools are already heavily committed to Low-NA and High-NA extreme
              ultraviolet (EUV) systems through 2030. Consequently, prospective customers have adopted a wait-and-see
              stance, withholding commercial commitments until Substrate demonstrates sustained wafer throughput,
              overlay precision, and defect density at commercial scale.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
