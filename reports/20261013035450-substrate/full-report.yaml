              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for a lithography platform is a fab or foundry capital committee; users are
              process-integration, lithography, yield, and operations teams, while the payer is the foundry, IDM, OSAT,
              consortium, or—under Substrate's integrated model—the company financing its own fab. Pure-play foundries
              are the largest disclosed equipment-spending segment, but advanced packaging already accounts for 36.74%
              of the cited market, showing that patterning budgets also sit downstream with OSATs. Substrate's intended
              route is unusually demanding because it must qualify not only a tool but a complete manufacturing service.
              Adoption should therefore progress from technical demonstrations to full-wafer repeatability, customer
              process design kits and test wafers, pilot qualification, capacity reservations, and only then volume
              production. No assigned source quantifies signed demand, serviceable U.S. leading-edge capacity, or
              Substrate's share of buyer budgets.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include record semiconductor sales, AI-related logic intensity, smaller process nodes,
              government-backed U.S. fab construction, and the industry's search for lower-cost alternatives to high-NA
              EUV. The constraints are more decisive for timing. Independent reporting says experts remain unsure
              whether Substrate can sustain demonstrated accuracy across full wafers at mass-production speed; the
              company also must create resists, masks, process integration, and a capital-intensive fab. Canon's
              nanoimprint experience illustrates the adoption burden: commercial delivery followed roughly two decades
              of development, and prospective users still require higher throughput, longer mold life, and better defect
              control. Substrate's stated target of wafers near $10,000 rather than $100,000 is therefore a company
              objective, not current market evidence. Valuation support should be tied to third-party yield, overlay,
              uptime, wafers-per-hour, customer qualification, and financing milestones—not to the broad semiconductor
              TAM or an unverified cost target.
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof, not category size, is the binding variable
            body: >-
              The public record supports a large semiconductor demand backdrop but does not disclose a
              Substrate-specific SAM, customer-qualified capacity, cost per good wafer, or obtainable share.
              Underwriting should remain milestone-based until those denominators are available.
            calloutType: risk
            claimRefs:
