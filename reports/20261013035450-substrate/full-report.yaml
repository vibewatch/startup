      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Extreme Commercial Adoption and Inertia Risk
            body: >-
              Substrate faces entrenched industry inertia: leading semiconductor design firms have committed billions to
              ASML's High-NA EUV roadmap through 2030. Displacing TSMC requires proving sub-2nm yield, reliability, and
              defect density across 300 mm wafers, not merely laboratory feature resolution.
            calloutType: risk
            claimRefs:
              - CU007
              - CU009
              - CU010
