      - number: '3.2'
        title: Differentiation is compelling on architecture but unproven on economics
        blocks:
          - type: paragraph
            body: >-
              The core differentiation is architectural: Sacra describes a company-claimed compact particle accelerator
              that generates X-rays for 2-nanometer-and-below patterning, while third-party accounts describe a foundry
              model that owns both tooling and manufacturing. That could shorten tool-to-process iteration and reduce
              supplier markups. Yet the public economics are not comparable. A low-reputation independent article
              repeats a $10,000 wafer objective, SiliconANGLE reports roughly $400 million for advanced ASML machines,
              and IEEE Spectrum relays Canon's claimed cost-of-ownership reduction against an advanced immersion
              baseline. These are different units, configurations, and maturity levels. None establishes Substrate's
              realized wafer cost, tool price, yield-adjusted cost, or service burden, so the apparent cost advantage
              remains a target rather than an underwriting input.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP012
      - number: '3.3'
        title: Incumbent qualification and installed workflows create the practical moat
        blocks:
          - type: paragraph
            body: >-
              The key competitive barrier is not resolution alone. ASML is reported as the sole EUV supplier, while
              Canon required roughly two decades to commercialize nanoimprint and is still using demonstrations and
              prototype-memory evaluation to open factory doors. Those histories illustrate qualification friction,
              accumulated process recipes, uptime expectations, mask and resist integration, service infrastructure, and
              customer aversion to yield risk. Substrate's planned vertical integration may reduce dependency on an
              external scanner vendor, but it also concentrates tool, process, fab, service, and customer-ramp execution
              inside one young company. Buyers can therefore preserve option value by continuing with qualified
              foundries, piloting Canon or xLight-adjacent approaches, or funding internal process work before switching
              production volumes.
            claimRefs:
              - CP002
              - CP007
              - CP011
              - CP015
      - number: '3.4'
        title: The moat is a race between integrated learning and capitalized incumbency
        blocks:
          - type: paragraph
            body: >-
              Substrate's strongest potential moat is a closed learning loop across source, optics, chemistry, process
              recipes, and fab operations. Its weakness is that the same scope multiplies capital and qualification
              risk. Independent reporting says experts remained impressed by demonstration images but questioned
              full-wafer accuracy, production speed, and the proposed timeline. Meanwhile, xLight has a $150 million
              federal prototype award, Canon has reached a commercial shipment after a long development cycle, and
              SEMI's forecast of $110 billion in 2025 front-end equipment spending rising to $130 billion in 2026
              signals that incumbents and national programs can keep investing. Differentiation is therefore potentially
              large but not yet durable: defensibility depends on verified throughput, overlay, defect density, yield,
              uptime, qualified customers, and a financing stack that can survive incumbent response.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
