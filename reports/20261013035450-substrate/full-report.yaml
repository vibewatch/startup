      - number: '7.2'
        title: Capital and integration compound the schedule risk
        blocks:
          - type: paragraph
            body: >-
              The 2028 objective is exposed to both financing and systems-integration risk. Two independent publications
              reported more than $100 million raised at a $1 billion valuation, but funding raised is not cash available
              and does not reveal the financing stack for a fab. SiliconANGLE separately cites about $15 billion to
              construct an advanced fab and hundreds of specialized staff, which is an industry benchmark rather than a
              Substrate budget. The company seeks to change that cost structure by making lithography tooling in house,
              yet the same vertical integration expands the execution surface from one machine to tooling, process
              integration, facility construction, and manufacturing operations. A credible mitigation requires staged
              technical gates, a disclosed capital plan, and qualified external counterparties rather than reliance on
              valuation or mission alone.
            claimRefs:
