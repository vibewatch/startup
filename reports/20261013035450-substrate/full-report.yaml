      - number: '7.4'
        title: Mitigations must convert into measurable gates
        blocks:
          - type: paragraph
            body: >-
              Existing mitigations are credible but early: the team includes national-laboratory and
              semiconductor-company talent, demonstrations have occurred, and management claims that proprietary tooling
              can reduce cost. None substitutes for production evidence. The investment case should require an
              independently witnessed 300 mm data package covering throughput, overlay, defect density, uptime, and
              multi-layer results; a milestone-linked financing plan that distinguishes committed capital from
              fundraising; documented customer qualification; and a site-specific regulatory schedule. Thesis-break
              triggers are failure to produce that technical package before production-facility commitments, material
              slippage of the 2028 goal without a verified replacement plan, or inability to identify sufficient
              financing and counterparties for the next gated build phase. These triggers avoid inventing unsupported
              numeric thresholds while making the decision falsifiable.
            claimRefs:
