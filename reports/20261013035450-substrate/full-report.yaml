  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: lithography wedge, foundry ambition'
        blocks:
          - type: paragraph
            body: >-
              Substrate's relevant market is narrower than global semiconductor revenue but broader than a standalone
              lithography-tool sale. The immediate wedge is advanced patterning for 300 mm wafers: the company says its
              accelerator-driven X-ray process can print 12 nm features with single patterning and has built an in-house
              production-quality 300 mm tool. The longer-term business boundary is a vertically integrated U.S. foundry
              that owns both lithography equipment and manufacturing process, rather than a merchant tool vendor selling
              into incumbent fabs. Included spend therefore comprises leading-edge lithography capital, process
              integration, and eventual foundry wafer production. Excluded spend includes chip design, downstream
              assembly, memory or mature-node tools that do not require the proposed process, and the full value of
              semiconductor end products. Status-quo substitutes include EUV and DUV, while nanoimprint is an adjacent
              lower-cost patterning alternative already entering commercial evaluation.
            claimRefs:
              - CM001
              - CM012
              - CM014
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The broad demand backdrop is strong: SIA reported $791.7 billion of global semiconductor sales in 2025, up
              25.6% from 2024, with logic the largest product category. That figure is a demand context, not Substrate's
              TAM. Two current market-research estimates for lithography equipment are not directly reconcilable. Mordor
              sizes semiconductor lithography equipment at $30.44 billion in 2026 and $47.63 billion in 2031, a 9.37%
              CAGR, while Market Research Future sizes a broader lithography-equipment category at $11.74 billion in
              2025 and $17.46 billion in 2035, a 4.05% CAGR. Different segmentation, applications, years, and
              proprietary methodologies prevent a defensible blended estimate. Mordor's mix data is more useful for
              qualification: pure-play foundries represented 46.89% of 2025 spending, Asia-Pacific 63.58%, DUV 67.31%,
              and 300 mm substrates 72.67%. These are separate denominators, not nested TAM-to-SOM layers.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
