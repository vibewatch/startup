              - CO006
              - CO011
              - CO013
      - number: '1.3'
        title: Funding, scale, and economic ambition
        blocks:
          - type: paragraph
            body: >-
              Independent reports published around the October 2025 disclosure place cumulative funding above $100
              million and the financing valuation at roughly $1 billion; one account says more than $1 billion, while
              others describe a $1 billion valuation. Named backers include Founders Fund, General Catalyst, Valor
              Equity Partners, In-Q-Tel, Allen & Co., and Long Journey Ventures. Funding raised should not be read as
              cash available, and the retained sources do not disclose round structure, liquidation preferences, debt,
              secondaries, cash balance, or current runway. The financing is also small relative to the stated
              destination: James Proud said a vertically integrated foundry would require many billions of dollars and
              potentially tens or hundreds of billions across multiple facilities. Substrate's cost objective of wafers
              nearer $10,000 rather than $100,000 by decade-end is a company target, not current revenue, pricing, or
              unit economics.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones and underwriting boundary
        blocks:
          - type: paragraph
            body: >-
              The public milestone record moved from a 2022 founding through three years of largely private development
              to a broad October 2025 disclosure of financing, technology, investors, and a goal to run wafers in a
              company facility during 2028. The official news index shows continued publication activity in April 2026,
              but it does not by itself demonstrate a customer, qualification, or manufacturing milestone. The most
              decision-relevant counterweight comes from independent reporting: specialists viewed the disclosed images
              as impressive while questioning whether the process can preserve accuracy across larger wafer areas at
              mass-production speeds, and SiliconANGLE judged the three-year production timetable unlikely. As of the
              run date, the assigned evidence pool supplies no named paying customer, revenue or run-rate figure,
              headcount, capacity reservation, independently measured throughput, yield, uptime, or defect-density
