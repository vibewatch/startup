              - CU008
      - number: '6.3'
        title: Durability, Ecosystem Inertia, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Because Substrate has not yet shipped commercial wafers or secured paying accounts, conventional customer
              health metrics such as net revenue retention, gross revenue retention, contract duration, and cohort
              expansion rates cannot be verified from public evidence. Instead, diligence must focus on the profound
              structural barriers to prospective customer adoption. Transitioning chip designs to an entirely new
              lithography paradigm presents immense procurement friction: fabless customers must develop customized
              process design kits, qualify electronic design automation tooling, and re-engineer manufacturing workflows
              that have been optimized for ASML scanners over three decades. Evidence from comparable initiatives
              underscores both the challenge and the potential playbook. Japanese foundry challenger Rapidus secured
              indie AI chip developer Tenstorrent by offering dedicated support to buyers deprioritized by TSMC, while
              Canon demonstrated alternative lithography feasibility by placing its nanoimprint tool with the Texas
              Institute for Electronics consortium. For Substrate, customer concentration risk will be acute during its
              initial commercial ramp: any operational facility will inevitably depend on a tiny handful of anchor
              government or AI startup customers willing to underwrite the extreme yield and delivery risks inherent in
              a first-generation X-ray foundry.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
