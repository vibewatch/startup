      - number: '7.3'
        title: Regulatory, legal, and security posture remains an evidence gap
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence describes a particle-accelerator X-ray tool, a domestic foundry ambition, and
              defense-aligned investment, but it does not establish which site-specific permits, export classifications,
              safety approvals, intellectual-property opinions, or security controls apply. That is a diligence gap, not
              evidence of a violation or incident. Risk likelihood cannot be responsibly scored until primary records
              identify the planned site, accelerator configuration, regulated materials or emissions, customer and
              technical-data flows, and freedom-to-operate analysis. The practical mitigation is a counsel- and
              engineering-owned compliance matrix tied to construction and customer milestones. Construction should not
              receive irreversible capital until the applicable approval path, responsible agencies, expected lead
              times, and blocking conditions are documented.
            claimRefs:
              - CR004
              - CR008
