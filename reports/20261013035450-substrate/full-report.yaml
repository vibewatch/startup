  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical scale and operating risk dominate
        blocks:
          - type: paragraph
            body: >-
              Substrate has evidence of technical activity rather than evidence of high-volume manufacturing readiness.
              Reporting says the company demonstrated its approach at U.S. national laboratories and its San Francisco
              facilities, while its disclosed architecture targets 300 mm wafers. The adverse evidence is more
              decision-relevant: independent coverage says experts remain unsure whether the printed accuracy can be
              sustained across full wafers at mass-production speed, and Heise reports that absolute acceleration values
              and a concrete implementation timeline were not disclosed. The strongest current risk is therefore not
              whether an X-ray exposure occurred, but whether repeatable throughput, overlay, uptime, and yield can
              support a commercial foundry. Those metrics should be verified before capital is committed to
              production-scale construction.
            claimRefs:
