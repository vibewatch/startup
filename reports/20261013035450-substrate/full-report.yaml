      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Primary Risks & Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Successful 300 mm tool demonstration by 2027; $150M+ government grants or anchor defense customer prepayments;
          pilot line operational by 2028
        - >-
          Valuation expands to $3.0B-$5.0B in Series B/C; potential acquisition by major U.S. prime or massive sovereign
          co-investment
        - Severe delays in beam stability; optic degradation; ASML or TSMC price aggression
        - 'Low (15%): contingent on solving unprecedented physics and manufacturing scaling hurdles simultaneously'
      - - Base Case
        - >-
          Tooling demonstrates sub-2 nm patterning on coupon samples but 300 mm full-wafer integration slips to 2029+;
          additional $200M-$400M raised with 30-50% dilution
        - >-
          Valuation marks flatten or moderate ($1.0B-$1.5B flat/extension rounds); company pivots to tooling licensing
          or specialized R&D foundry
        - Substantial capital burn without commercial wafer revenue; execution bottlenecks in domestic supply chain
        - 'Moderate (60%): mirrors typical timeline expansion for deep-tech hardware and lithography development'
      - - Bear Case
        - >-
          Inability to scale beam over production wafer areas at commercial speeds; capital markets close after $100M
          burn; fab construction stalled
        - Valuation markdown or distressed IP acquisition below invested capital (<$100M enterprise value)
        - >-
          Physics-level overlay/throughput limitations; key talent attrition; inability to secure $1B+ necessary for fab
          cleanroom
        - >-
          Moderate (25%): founder acknowledges 1% initial success odds; historical precedent of alternate lithography
          failure
    notes: >-
      Scenario assumptions model timeline variance, dilution exposure, and enterprise valuation outcomes through fiscal
      year 2028.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV014
