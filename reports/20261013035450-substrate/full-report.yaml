  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic Pillar
      - Core Thesis Argument
      - Supporting Evidence
      - Anti-Thesis Counter-Risk
      - What Would Change the View
    rows:
      - - Lithography Architecture
        - X-ray particle accelerator light source promises to replace multi-patterning EUV and lower tool complexity
        - >-
          Demonstrated beam acceleration and fine-pitch patterning at U.S. National Laboratories and San Francisco
          facility
        - >-
          Historical failures of synchrotron X-ray lithography and inability to maintain accuracy over full 300 mm wafer
          area at high speed
        - >-
          Independent third-party verification of high-volume manufacturing throughput (wafers/hour) and low defect
          density
      - - Vertical Integration Model
        - Building tools in-house and operating a domestic foundry lowers fab capital barrier well below $10B+
        - Substrate leadership claims in-house tooling compresses startup capex vs paying $400M per ASML High-NA tool
        - >-
          Extreme capital intensity: advanced fabs cost $15B and require specialized engineering teams across hundreds
          of supply-chain steps
        - Binding commercial fab project financing agreements or customer prepayments covering fab construction
      - - National Security & Reshoring
        - U.S. government policy prioritizes onshore leading-edge logic fabrication and supply chain autonomy
        - >-
          In-Q-Tel backing, federal attention on overseas dependency, and $30.9B in CHIPS Act direct awards across
          industry
        - >-
          Substrate has not been awarded direct commercial fab incentives under CHIPS Act, while competitors like xLight
          secured $150M FEL awards
        - Formal selection for federal title or binding defense/commercial anchor offtake contracts
      - - Commercial Execution Timeline
        - Aiming for an operational U.S. foundry running 300 mm wafers by 2028
        - Recruiting engineering talent from IBM, TSMC, Applied Materials, and national laboratories
        - >-
          Industry consensus that 3-year timeline to build advanced 2 nm-class foundry is implausible given decades-long
          incumbent lead
        - Demonstrated operational pilot line delivering qualified silicon wafers to external chip design customers
    notes: >-
      Evaluates the tension between Substrate company assertions and independent semiconductor industry skepticism
      regarding commercial feasibility.
