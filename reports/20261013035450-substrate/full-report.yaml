chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Substrate is a San Francisco-based private semiconductor startup founded in 2022 by brothers James and
              Oliver Proud. Its stated model is broader than selling a lithography tool: the company intends to build a
              vertically integrated U.S. foundry whose internally developed particle accelerator supplies X-ray light to
              proprietary lithography equipment. That integration could remove supplier markups and architectural
              constraints, but it also combines tool development, process integration, fab construction, and
              manufacturing execution inside one early-stage organization. Substrate says its system has produced
              patterns comparable in resolution to high-NA EUV and that it completed a production-quality 300 mm
              lithography tool; these remain company claims rather than independently published high-volume
              manufacturing results. The public evidence therefore establishes a differentiated technical and business
              thesis, not yet a demonstrated commercial foundry.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO007
      - number: '1.2'
        title: Leadership, talent, and governance
        blocks:
          - type: paragraph
            body: >-
              James Proud is consistently identified as co-founder and chief executive, while Oliver Proud is identified
              as co-founder without a more specific operating title in the retained evidence. Reporting also says the
              company has recruited scientists and engineers from U.S. National Laboratories, TSMC, Applied Materials,
              AMD, Google, Qualcomm, and IBM. That talent mix is relevant to the breadth of the technical mission, but
              the external narrative, fundraising explanation, product claims, and 2028 timetable remain heavily
              centered on James Proud. The founders' reported lack of prior semiconductor manufacturing experience makes
              the depth and authority of the broader operating team especially important. No retained source provides a
              formal board roster, committee structure, succession plan, or ownership and voting rights, so governance
              and key-person controls require direct diligence rather than inference from investor participation.
            claimRefs:
              - CO001
              - CO012
              - CO013
              - CO014
