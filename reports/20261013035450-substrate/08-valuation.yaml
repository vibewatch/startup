callouts:
  - calloutType: "recommendation"
    title: "Underwriting Stance: Research-More at Stretched Valuation"
    body: "Substrate presents a compelling sovereign-scale thesis to restore domestic advanced lithography, but entering at a $1.0 billion post-money valuation without verified 300 mm wafer throughput, defect density, or qualified pilot customers represents an unhedged speculative premium. Growth-stage investors should withhold capital commitments until technical scaling milestones are independently audited."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
  - calloutType: "risk"
    title: "Capital Intensity and Fab Construction Dilution"
    body: "The historical requirement of $10 billion to $15 billion to construct leading-edge fabs means Substrate's $100 million Series A round covers only initial tooling R&D. Without tens of billions in non-dilutive federal grants or sovereign project debt, existing equity holders face severe dilution across subsequent financing rounds before reaching commercial wafer production in 2028."
    claimRefs:
      - "CV002"
      - "CV008"
      - "CV009"
  - calloutType: "insight"
    title: "Lithography Precedent: Physics vs. Industrial Execution"
    body: "While particle accelerators produce intense, coherent X-ray beams capable of fine-pitch resolution, historical precedents such as the Soviet synchrotron programs of the 1980s illustrate that optical lithography survived through continuous engineering refinement (e.g. immersion and multi-patterning). Displacing ASML requires not just a superior light source, but precision mechanics, defect-free masks, and relentless tool reliability."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV010"
      - "CV014"
