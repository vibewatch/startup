figures:
  - id: FU001
    title: Kirana Merchant Digital Adoption Journey
    type: journey-map
    summary: Six-stage journey mapping kirana onboarding, marketplace ordering, logistics fulfillment, fintech credit adoption, Golden Eye POS deployment, and horizontal category expansion.
    data:
      items:
        - label: 1. Discovery & Merchant Onboarding
          detail: Kirana retailers in Tier-1 to Tier-3 towns discover Jumbotail via field agents or peer referral; self-serve mobile app registration requires basic KYC.
          touchpoints:
            - Jumbotail Android App
            - Field Onboarding Representative
        - label: 2. Wholesale Marketplace Procurement
          detail: Merchant places digital orders for staples, FMCG, and packaged grocery with transparent pricing and SKU selection.
          touchpoints:
            - B2B Catalog Interface
            - In-app Price Discovery
        - label: 3. Last-Mile Storefront Delivery
          detail: Next-day delivery direct to store doorstep handled by Jumbotail's in-house fulfillment centers and dedicated delivery fleet.
          touchpoints:
            - Jumbotail Logistics Fleet
            - Storefront Delivery & POD Verification
        - label: 4. Fintech Working Capital Financing
          detail: Merchants with purchase history unlock short-term credit and invoice financing from NBFC/banking lending partners.
          touchpoints:
            - Jumbotail Payments & Credit Portal
            - Partner Lending Integration
        - label: 5. Golden Eye Retail OS & J24 Modernization
          detail: High-volume retailers adopt Golden Eye cloud POS for inventory management, billing, CRM, and convert to J24 convenience storefronts.
          touchpoints:
            - Golden Eye POS Hardware & Cloud OS
            - J24 Store Transformation Services
        - label: 6. Horizontal Category Expansion (Post-Solv)
          detail: Merchants expand purchasing beyond food/grocery into apparel, footwear, home furnishings, and electronics via the unified Solv network.
          touchpoints:
            - Multi-Category B2B Catalog
            - Cross-Category Credit Line
    approximationNotes: null
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU014
