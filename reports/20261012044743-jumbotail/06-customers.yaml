    title: Customer segmentation table
    columns:
      - Customer Segment
      - Buyer / User / Payer
      - Primary Use Case
      - Reported Scale
      - Strategic & Revenue Value
      - Diligence & Visibility Gap
    rows:
      - - Independent Kirana Grocery Stores
        - Family shop owner (buyer, user, payer)
        - Daily staples and packaged FMCG procurement via digital catalog with next-day doorstep delivery
        - Core historical network (250,000+ kiranas across 50+ cities)
        - High transaction frequency and logistics density; foundational wholesale marketplace volume
        - Merchant churn rate, active monthly purchasing frequency, and order size distribution are undisclosed.
      - - J24 Convenience Store Franchisees
        - Modernizing kirana store entrepreneur
        - Turnkey store modernization, Golden Eye cloud POS billing, inventory management, and CRM
        - High-volume kirana subset converting within 24-48 hours
        - Higher software stickiness, richer transaction telemetry, and private label margin capture
        - Exact count of operational J24 franchise stores and unit economics per store are not public.
      - - Horizontal MSME Retailers (Post-Solv)
        - Non-grocery MSME merchants (fashion, electronics, home goods)
        - Cross-category inventory sourcing and working capital credit access across 400+ cities
        - Combined Solv addition (500,000+ retailers and MSMEs nationwide)
        - Diversified gross margins and higher credit ticket sizes across non-food consumption categories
        - Cross-category retention, active buyer overlap, and organizational friction post-acquisition.
      - - FMCG Brands & Staples Producers
        - National brand managers, regional millers, and FMCG manufacturers
        - Direct digital distribution channel to fragmented mass-market kiranas bypassing intermediaries
        - Thousands of national and regional brand partners
        - Supplier monetisation, advertising, trade promotions, and verified direct manufacturer supply
        - Brand concentration, rebate transparency, and platform counterfeit liability (e.g. Adani Wilmar FIR).
    notes: Segmentation synthesized from company disclosures, Tracxn entity profiles, BharatFast, and Tech in Asia reporting; merchant retention and active buyer counts remain unverified.
