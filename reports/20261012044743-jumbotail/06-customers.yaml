  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Sample of verified commercial and brand counterparty relationships reported across primary news releases and corporate announcements.
    columns:
      - Customer / Counterparty
      - Segment
      - Deployment & Commercial Use Case
      - Production vs Pilot
      - Reported Outcome
      - Limitation & Counterparty Risk
    rows:
      - - NEC Corporation
        - Global Technology Partner & Strategic Retail Integrator
        - Co-development of AI retail solutions and integration of advanced in-store digital tech with Golden Eye Retail OS
        - Production partnership
        - Joint deployment across Kirana network with strategic capital investment announced March 2026
        - Technology integration execution risk across unstructured, low-bandwidth kirana environments
      - - Adani Wilmar
        - Tier-1 National Staples & Edible Oil Brand Partner
        - Distribution of branded staples (Fortune edible oil, flour, packaged foods) via wholesale marketplace
        - Production supplier
        - Large-scale volume distribution to neighbourhood stores across South and West India
        - Supply chain custody risk evidenced by counterfeit product FIR requiring Jumbotail assistance in 2024
      - - Standard Chartered (SC Ventures / Solv)
        - Institutional Financial Partner & B2B Ecosystem Counterparty
        - Fintech lending integration, working capital credit provision, and full platform acquisition of Solv India
        - Production integration
        - Added 220,000 MSME users and $120M Series D funding led by SC Ventures in June 2025
        - Executive turnover during merger (Solv CEO/CFO exit) and credit default risk on MSME loan book
      - - J24 Kirana Store Network
        - Modern Convenience Franchise Store Operators
        - Turnkey store transformation using Golden Eye cloud POS, curated assortment, and daily replenishment
        - Production deployment
        - Highest reported customer NPS in eB2B according to venture profile data
        - Logos and NPS claimed without audited cohort retention or same-store sales growth metrics
    notes: Sample of named commercial counterparties, brand suppliers, and technology partners identified in audited news reporting and corporate disclosures; individual kirana store names are anonymized due to MSME fragmentation.
