companyProfile:
  summary: >-
    Jumbotail is a Bengaluru-based B2B commerce and new retail platform that serves kiranas and MSMEs through wholesale
    procurement, in-house logistics, embedded credit enablement, and the GoldenEye Retail OS / J24 store format. The
    company scaled further in 2025 through the Solv India acquisition and in 2026 through a strategic NEC alliance, but
    public filings still show heavy operating losses and unresolved post-merger integration questions.
