  topStrengths:
    - Large distribution footprint across 500,000+ retailers and MSMEs in 400+ cities.
    - Full-stack logistics, embedded fintech, and GoldenEye / J24 tools create strategic stickiness.
    - SC Ventures, NEC, and other institutional backers validate market relevance.
  topRisks:
    - FY25 standalone losses remain large and consolidated post-Solv economics are still undisclosed.
    - Post-merger integration and executive turnover may slow operating convergence.
    - Counterfeit-supply and marketplace governance exposure can damage brand trust.
    - Merchant retention, cohort quality, and credit performance remain difficult to verify.
  unresolvedGaps:
    - Audited consolidated post-Solv revenue, gross margin, EBITDA, burn, and runway remain undisclosed.
    - Credit-loss, underwriting, and collections detail for partner-originated merchant lending is still unavailable.
    - Merchant retention, active buyer counts, and cohort behavior across J24 and Solv remain unclear.
    - Cap-table preferences and downside-protection terms from the 2025 financing are undisclosed.
