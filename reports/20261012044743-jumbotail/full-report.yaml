      - number: '6.4'
        title: Retention Durability, Merchant Churn, and Counterparty Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite reported top-line customer scale exceeding 500,000 retailers, Jumbotail's customer economics face
              critical transparency gaps and adverse operating headwinds. Audited merchant cohort retention, monthly
              repeat order rates, and customer churn metrics remain entirely undisclosed in public disclosures, making
              it impossible to independently verify long-term buyer durability. While partner profiles claim high
              customer Net Promoter Scores in the eB2B grocery sector, commercial relationships carry noticeable
              friction. In 2024, consumer goods giant Adani Wilmar initiated an FIR regarding counterfeit branded goods
              circulated within wholesale channels, requiring Jumbotail to cooperate with investigations to preserve
              supply integrity. Concurrently, integration friction surfaced during the Solv merger as Solv's chief
              executive officer and chief financial officer departed amid restructuring, while Venture Intelligence
              records reflect persistent net losses of ₹160.56 crore in FY25.
            claimRefs:
              - CU005
              - CU006
              - CU012
              - CU013
              - CU015
