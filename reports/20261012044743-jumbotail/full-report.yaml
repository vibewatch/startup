  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis (Bull Argument)
      - Anti-Thesis (Bear Argument)
      - Thesis-Break / Verification Indicator
    rows:
      - - Network Scale & Sourcing
        - Combined entity serves over 500,000 retailers across 400+ cities with sticky store procurement.
        - Kirana loyalty is transactional and vulnerable to regional wholesale pricing discounts.
        - Merchant retention trends, monthly active ordering rates, and wallet share expansion.
      - - Fintech & Working Capital
        - Solv integration unlocks profitable credit distribution and payment monetization on high GMV.
        - Underwriting wholesale borrowers carries systemic credit loss exposure during liquidity crunches.
        - Gross non-performing asset ratios, lending partner risk-sharing terms, and net interest margins.
      - - Convenience Retail & Tech
        - J24 store format and GoldenEye OS create high-margin software and franchise retail streams.
        - Store modernization is capital-intensive and slow to scale across semi-urban clusters.
        - Unit store economics, payback periods per modernized outlet, and SaaS fee realization.
      - - Financial Trajectory
        - Synergies from horizontal expansion into apparel and electronics accelerate path to EBITDA breakeven.
        - High historical cash burn and declining standalone revenue signal persistent operational drag.
        - Audited consolidated revenue growth, gross margin expansion, and operating cash flow positive inflection.
    notes: Evaluates core investment drivers against counter-arguments and monitorable diligence break points.
