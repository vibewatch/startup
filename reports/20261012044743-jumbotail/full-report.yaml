      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Jumbotail has raised over $263M in lifetime equity capital through mid-2025, crowned by a $120M Series D
              financing round led by SC Ventures that valued the enterprise at over $1.0B post-money alongside the asset
              integration of Solv India. Financial disclosures compiled by Venture Intelligence show stand-alone
              operational revenue of ₹103.76 Cr in FY25, accompanied by an annual net loss after tax (PAT) of ₹160.56
              Cr. While recent equity inflows provide interim runway, the substantial operational burn rate underscores
              an ongoing reliance on external equity and debt capital to support working capital cycles and geographic
              logistics clusters. Key underwriting inputs—including consolidated post-merger audited financials with
              Solv, non-performing asset (NPA) rates across partner-originated credit portfolios, and store-level
              economics for the J24 franchise network—remain confidential and unavailable in public disclosures, posing
              a material hurdle for institutional underwriting [CI009, CI010, CI011, CI012, CI013, CI014].
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Operating Denominator Divergence: Rupee Surplus Over Percentage Margin'
            body: >-
              Evaluating grocery B2B marketplaces using traditional software percentage margins obscures the core
              physics of distribution. A high percentage margin on small baskets fails to absorb physical delivery
              overhead, whereas moving large staple volumes at 6% gross margin generates sufficient rupee gross profit
              to yield a durable truck surplus across high-density urban clusters [CI004, CI005].
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
          - type: callout
            title: Substantial Operational Cash Drain and Private Disclosure Void
            body: >-
              Despite raising over $263M and reaching a $1B valuation, Jumbotail generated a ₹160.56 Cr net loss against
              ₹103.76 Cr in revenue in FY25. With post-merger Solv financials and credit loss provisions undisclosed,
              forward capital adequacy remains heavily contingent on investor balance sheet support [CI009, CI011,
              CI012, CI014].
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform and Service Definition in Kirana Workflows
        blocks:
          - type: paragraph
            body: >-
              Jumbotail fundamentally re-engineers traditional grocery distribution by inserting an integrated digital
              and physical operating layer between unorganized mom-and-pop retailers and packaged goods manufacturers.
              In traditional Indian wholesale workflows, independent kirana proprietors travel multiple times per week
              to congested wholesale mandis, haggle across fragmented intermediaries, negotiate informal credit lines
              under punitive terms, and track inventory manually using paper ledgers. Jumbotail replaces this fragmented
              workflow through a unified mobile marketplace that aggregates thousands of food and grocery stock-keeping
              units (SKUs) alongside non-grocery categories, offering transparent pricing, consolidated order invoicing,
              and next-day storefront fulfillment directly to shopkeepers. Beyond procurement, the platform provides
              Retail-as-a-Service through the J24 convenience store franchise format, equipping neighborhood shops with
              modern retail layouts, consumer-facing Greencard loyalty programs, and integrated digital point-of-sale
              checkout capabilities that enable small independent merchants to compete effectively against organized
              retail chains and rapid quick-commerce delivery alternatives.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE014
