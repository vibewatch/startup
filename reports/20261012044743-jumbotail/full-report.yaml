    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Implied Valuation
      - Key Assumptions & Operating Metrics
      - Downside Triggers & Valuation Logic
      - Probability Signal
    rows:
      - - Bull Case
        - $1.5B – $2.0B
        - Post-merger revenue reaches $180M+ at 15% gross margin; credit monetization scales rapidly with low defaults.
        - Multiple holds at 8x-10x forward revenue supported by proven EBITDA breakeven and IPO pipeline.
        - 15%
      - - Base Case
        - $600M – $800M
        - Revenue stabilizes around $100M-$120M; grocery wholesale remains bulk of volume with low single-digit margins.
        - Valuation compresses to 5x-7x revenue reflecting typical B2B distribution and marketplace economics.
        - 55%
      - - Bear Case
        - $250M – $400M
        - Integration challenges persist; key personnel depart; lending book suffers delinquency spikes amid price wars.
        - Severe multiple compression to 2x-3x revenue; down-round or recapitalization required to fund runway.
        - 30%
