      - number: '6.3'
        title: Commercial Proof, Brand Partnerships, and Ecosystem Integration
        blocks:
          - type: paragraph
            body: >-
              Enterprise-grade commercial proof for Jumbotail encompasses brand manufacturer relationships,
              institutional fintech partnerships, and strategic technology integrations. The platform serves as a
              critical distribution gateway connecting national FMCG manufacturers and agricultural millers directly to
              fragmented mass-market kiranas, bypassing layers of traditional intermediaries. The strategic acquisition
              of Solv India, formally approved by the Competition Commission of India in May 2025 and backed by a $120
              million Series D led by SC Ventures, validated Jumbotail's role as a consolidated B2B commerce and credit
              engine. Furthermore, in March 2026, Jumbotail established a strategic collaboration with NEC Corporation
              to co-develop artificial intelligence and retail technologies tailored for India's unstructured kirana
              environment, enhancing inventory optimization and consumer engagement within the Golden Eye platform.
            claimRefs:
              - CU002
              - CU007
