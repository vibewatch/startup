      - number: '6.2'
        title: Adoption Trajectory, Merchant Scale, and Expansion Post-Solv
        blocks:
          - type: paragraph
            body: >-
              Jumbotail's commercial adoption trajectory exhibits two distinct phases: organic geographic deepening
              followed by an acquisitive step-change. Between 2019 and early 2025, Jumbotail expanded from approximately
              20,000 kirana stores in Bangalore to a core operating footprint of over 250,000 kirana stores across 50
              Indian cities, supported by full-stack fulfillment centers and dedicated storefront delivery routes. In
              June 2025, the acquisition of Solv India from SC Ventures added more than 220,000 registered MSME users,
              abruptly scaling Jumbotail's total reported customer network to over 500,000 small retailers across 400
              cities and towns. This horizontal expansion substantially accelerated geographic reach across Tier-2 and
              Tier-3 urban centers. However, public disclosures do not disaggregate active monthly transacting merchants
              from cumulative signups, creating substantial uncertainty regarding actual repeat utilization rates and
              wallet-share penetration across the enlarged post-merger merchant base.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU014
              - CU015
