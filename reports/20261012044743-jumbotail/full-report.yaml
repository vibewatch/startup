chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Infrastructure, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in November 2015 by Stanford Graduate School of Business alumni S. Karthik Venkateswaran and
              Ashish Jhina, Jumbotail Technologies Private Limited is a Bengaluru-headquartered B2B e-commerce and
              new-retail platform engineered to modernize India's unorganized food and grocery retail sector. The
              company operates full-stack digital and physical commerce infrastructure serving traditional mom-and-pop
              grocery stores, commonly known as kiranas, alongside micro, small, and medium enterprises (MSMEs). Rather
              than attempting to bypass or disintermediate traditional neighbourhood shopkeepers through
              capital-intensive consumer quick-commerce or centralized big-box wholesale stores, Jumbotail positions
              itself as the foundational operating system and supply chain backbone for local retail entrepreneurs.


              The core platform architecture combines four proprietary, vertically integrated platforms: a digital
              wholesale B2B marketplace connecting retailers directly with leading FMCG brands and staple producers; an
              in-house tech-driven logistics and warehousing network providing daily next-day storefront deliveries; an
              embedded fintech engine delivering digital payments and working-capital financing in collaboration with
              regulated lending partners; and the J24 New Retail convenience store network powered by GoldenEye,
              Jumbotail's proprietary cloud-based retail operating system. Through this integrated full-stack
              architecture, kirana entrepreneurs access automated point-of-sale billing, data-driven merchandising,
              automated inventory replenishment, and customer loyalty workflows, transforming legacy convenience shops
              into modern convenience retail destinations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
