      - number: '1.4'
        title: 战略演进、公司里程碑与运营尽调
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的运营历程展现了持续建设基础设施的路径，其间穿插着规模里程碑和商业模式转型。2025 年前，平台主要是食品杂货 B2B 市场，已覆盖 50 个城市的逾 250,000 家 kirana，并披露
              FY23 商品交易总额为 ₹2,262 crore，其中三分之一的区域集群实现经营盈利。2025 年年中收购经印度竞争委员会批准的 Solv India 后，公司转为覆盖多品类的横向商贸平台，服务 400
              个城市的逾 500,000 家零售商和 MSME，并扩展到服装、鞋类、家居用品和消费电子。2026 年 3 月，Jumbotail 宣布与日本 NEC Corporation
              建立战略联盟并进行公司股权投资，把先进 AI 接入 GoldenEye 操作系统。


              尽管完成了这些扩张，尽调仍发现重大的运营和财务脆弱性。法定数据库申报显示盈利问题持续存在：FY25 单体收入仅 ₹103.76 crore，却对应 ₹160.56 crore 的会计净亏损（PAT）；FY24 和
              FY23 的净亏损分别为 ₹275.72 crore 和 ₹261.53 crore。2024 年，平台分销的 Fortune 食用油被指为假货，执法部门因此登记 First Information
              Report，公司需与 Adani Wilmar 正式配合。合并后的整合还带来高管流失，包括 Solv CEO 和 CFO 离任。完整尽调需要验证经审计的 Solv
              合并后财务报表、信贷承保损失率和资本表清算优先权。
            claimRefs:
              - CO007
              - CO013
              - CO014
              - CO015
