        title: 展示项
        blocks:
          - type: callout
            title: Kirana 多平台经营与利润率压缩
            body: 采购来源之间的转换成本接近于零，夫妻店店主会把补货订单拆给本地 mandi 和数字 App，以优化现货价格和贸易信贷，平台定价能力因此受限。
