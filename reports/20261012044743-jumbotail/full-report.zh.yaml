  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构格局
        blocks:
          - type: paragraph
            body: >-
              印度零售格局的根本矛盾，在于非正式社区分销与现代化数字基础设施之间的拉扯。印度食品和杂货零售年支出总额超过 $800 billion，非组织化家族 kirana 店约占全部交易的 90%。2015 年
              Jumbotail 开始运营时，全国杂货交易中组织化部分不足 8%，数百万微型创业者因此被困在低效的多层分销网络里。Jumbotail
              的市场边界明确覆盖高周转主食、包装消费品和现代门店赋能工具，同时有意排除易腐湿货市场和重工业供应链。近期整合 Solv India 后，可服务边界又扩大到服装、消费电子等可选零售品类，让平台得以从商业 MSME
              门店获取更高的钱包份额。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM011
      - number: '2.2'
        title: TAM、SAM 与 SOM 的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              评估 Jumbotail 的商业机会，需要从多个视角测算，不能只看笼统的宏观叙事。印度 $800B+ 杂货市场构成巨大的理论总可服务市场（TAM），但数字化 B2B
              电商杂货批发的可服务市场（SAM）受限于城乡零售集群，约为 $150 billion。长期宏观预测认为，到 2030 年 B2B 电商平台将约占印度预计 $6 trillion 经济体的
              5%，反映商业贸易走廊正在快速数字化。在这一可服务边界内，分析师模型将 Jumbotail 近期至中期可获得市场（SOM）估为 $2 billion 至 $3 billion
              的商品交易总额，核心支撑是区域仓储密度。公司此前的目标是达到年化 Rs 2,500 crore（约 $300 million）的 GMV 跑速，最终服务 400 million 中等收入消费者所在的
              一百万家门店。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
