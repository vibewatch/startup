      - number: '4.3'
        title: 资本充足性、现金消耗与承保判断
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年年中，Jumbotail 累计股权融资超过 $263M，其中包括 SC Ventures 领投的 $120M D 轮融资；该轮在整合 Solv India 资产的同时，把公司投后估值推至
              $1.0B 以上。Venture Intelligence 汇总的财务披露显示，FY25 单体运营收入为 ₹103.76 Cr，税后年度净亏损（PAT）为 ₹160.56
              Cr。近期股权流入提供了过渡期跑道，但高额运营消耗说明公司仍依赖外部股权和债务资本支撑营运资金周期及区域物流集群。关键承保输入——包括含 Solv
              的合并后经审计财务报表、合作伙伴发放信贷组合的不良资产（NPA）率，以及 J24 加盟网络的门店级经济性——仍属机密，公开披露无法取得，构成机构投资判断的重大障碍 [CI009, CI010, CI011,
              CI012, CI013, CI014]。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 展示项
        blocks:
          - type: callout
            title: “运营分母”差异：卢比盈余胜过百分比利润率
            body: >-
              用传统软件百分比利润率评价杂货 B2B 市场，会掩盖分销的核心运行规律。小篮子即便百分比利润率高，也不足以覆盖实体配送开销；而以 6%
              毛利率运输大批量主食，能产生足够的卢比毛利润，在高密度城市集群中形成持久的卡车盈余 [CI004, CI005]。
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
          - type: callout
            title: 巨额运营现金消耗与私人披露空白
            body: >-
              尽管融资超过 $263M、估值达到 $1B，Jumbotail 在 FY25 仍以 ₹103.76 Cr 收入对应 ₹160.56 Cr 净亏损。Solv
              合并后财务数据和信贷损失准备均未披露，未来资本充足性仍高度取决于投资者资产负债表的支持 [CI009, CI011, CI012, CI014]。
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
              - CI012
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Kirana 流程中的核心平台与服务定义
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 在非组织化夫妻店与包装商品制造商之间插入数字与实体一体化运营层，从根本上重构传统杂货分销。传统印度批发流程中，独立 kirana 店主每周多次前往拥挤的批发
              mandi，在分散的中间商之间讨价还价，以苛刻条件协商非正式信贷，并用纸质账本手工追踪库存。Jumbotail 用统一移动市场替代这套割裂流程：市场聚合数千种食品杂货 SKU
              及非杂货品类，提供透明定价、合并订单发票，并直接为店主完成次日门店履约。除采购外，平台通过 J24 便利店加盟模式提供 Retail-as-a-Service，为社区门店配备现代零售布局、面向消费者的
              Greencard 忠诚度计划和一体化数字 POS 结账，让小型独立商户可以与组织化零售连锁及快速即时配送竞争。
