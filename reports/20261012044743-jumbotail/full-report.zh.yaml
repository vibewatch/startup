    notes: 综合公开融资披露、Series D 交易数据中的估值水平和市场倍数分析。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV014
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点（看多）
      - 反论点（看空）
      - 论点失效 / 验证指标
    rows:
      - - 网络规模与采购
        - 合并后的实体覆盖 400 多座城市、超过 500,000 家零售商，门店采购黏性强。
        - kirana 忠诚度属于交易型，容易受到区域批发价格折扣冲击。
        - 商户留存趋势、月度活跃下单率和钱包份额扩张。
      - - 金融科技与营运资金
        - Solv 整合将释放可盈利的信贷分发和支付变现，高 GMV 为其提供基础。
        - 在流动性紧张时，为批发借款人承保会暴露于系统性信用损失。
        - 不良资产总比率、放贷合作方的风险分担条款和净息差。
      - - 便利零售与技术
        - J24 门店模式和 GoldenEye OS 将带来高毛利软件及加盟零售收入流。
        - 门店现代化资本密集，且难以在半城市集群中快速扩张。
        - 单店经济、每家现代化门店的回本周期和 SaaS 费用兑现。
      - - 财务轨迹
        - 横向拓展服装和电子产品带来的协同效应，将加快 EBITDA 盈亏平衡。
        - 历史现金消耗高企、独立收入下滑，说明运营拖累仍将持续。
        - 经审计的合并收入增长、毛利率扩张和经营现金流转正拐点。
    notes: 将核心投资驱动因素与反论点及可监测的尽调失效节点进行对照。
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV011
      - CV014
  - id: TV003
    title: 看多 / 基准 / 看空情景表
    columns:
      - 情景
      - 隐含估值
      - 关键假设与运营指标
      - 下行触发因素与估值逻辑
      - 概率信号
    rows:
      - - 乐观情景
        - $1.5B – $2.0B
        - 合并后收入达到 $180M+，毛利率为 15%；信贷变现在低违约率下快速扩大。
        - 在已证明 EBITDA 盈亏平衡并有 IPO 管线的支撑下，倍数维持在前瞻收入的 8x-10x。
        - 15%
      - - 基准情景
        - $600M – $800M
        - 收入稳定在 $100M-$120M 左右；杂货批发仍占大部分规模，利润率处于个位数低段。
        - 估值压缩至收入的 5x-7x，反映典型 B2B 分销和市场平台经济性。
        - 55%
      - - 悲观情景
        - $250M – $400M
        - 整合难题持续；关键人员离职；价格战期间放贷组合逾期激增。
        - 倍数大幅压缩至收入的 2x-3x；需要折价轮或资本重组来维持资金续航。
        - 30%
    notes: 通过倍数压缩、营收增长和利润率兑现路径，分析估值敏感性。
    claimRefs:
      - CV005
      - CV006
      - CV009
      - CV011
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 覆盖公司成立、风险投资轮次、Solv 收购及 AI 战略合作的关键企业里程碑。
    data:
      items:
        - date: 2015-11
          label: 公司成立
          detail: Stanford MBA 同学 S. Karthik Venkateswaran 和 Ashish Jhina 在 Bengaluru 创办公司。
          tone: positive
        - date: 2020-05
          label: kirana 必需品供应规模
          detail: COVID-19 封锁期间，为社区杂货店维持关键供应链。
          tone: positive
        - date: 2021-12
          label: Series C 融资（$85M）
          detail: Artal Asia / Invus 领投，融资 $85M；加上早期投资人的老股转让，累计股权融资达到 $125M。
          tone: positive
        - date: 2023-05
          label: FY23 规模与区域盈亏平衡
          detail: 在 50 多座城市的 250,000 家 kirana 实现 ₹2,262 Cr GMV，并在三分之一的地区实现盈利。
          tone: positive
        - date: 2024-03
          label: Series C 股权扩展（$18.2M）
          detail: 从 Arkam Ventures、Heron Rock、Invus 等投资人处获得 $18.2M，补充运营流动性。
          tone: neutral
        - date: 2024-05
          label: 假冒食用油 FIR 调查
          detail: 因第三方供应商销售假冒 Fortune 食用油而收到 FIR 后，与 Adani Wilmar 展开合作。
          tone: risk
        - date: 2025-06
          label: Series D（$120M）与 Solv 收购
          detail: SC Ventures 领投 $120M，并完成 Solv India 合并，达到 $1B+ 独角兽地位，覆盖 500,000+ 家 MSME。
          tone: positive
        - date: 2026-03
          label: NEC AI 战略合作
          detail: 与 NEC 建立战略联盟并获得其企业股权投资，将零售 AI 部署到 J24 门店。
          tone: positive
    approximationNotes: 日期和里程碑描述来自官方公司公告及媒体报道。
    claimRefs:
      - CO001
      - CO004
      - CO007
      - CO013
  - id: FM001
    title: 市场规模金字塔视角
    type: pyramid
    summary: 从印度 $800B+ 食品与杂货零售支出，逐层收窄至 Jumbotail 可服务、可获得的目标份额。
    approximationNotes: 数值综合 Value For Startups 的市场情报披露和 Impact Investor 报道的 B2B 宏观预测。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM012
    data:
      nodes:
        - label: 印度食品与杂货零售总额（TAM）
          value: $800B+
          detail: 全国性的大型消费者杂货市场，覆盖 12-19 million 家非组织化零售店
          tone: neutral
        - label: 非组织化 kirana 主导地位（约 90% 份额）
          value: $720B+
          detail: 传统家族经营的 kirana 门店占据日常主食销售的绝大多数
          tone: neutral
        - label: B2B 电商批发可触达市场（SAM）
          value: $150B
          detail: 可触达的杂货与 FMCG 批发采购流正迁移到数字供应链平台
          tone: neutral
        - label: 2030 年宏观 B2B 电商机会
          value: 5% of $6T GDP (~$300B)
          detail: 预计印度整体 GDP 中由数字化 B2B 贸易平台驱动的份额
          tone: positive
        - label: Jumbotail 可服务、可获得目标（SOM）
