      - number: '4.2'
        title: 运营成本结构与物流单位经济
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 能否运营下去，核心取决于履约效率，而不是百分比毛利率。由于杂货主食的毛利率通常只有 3% 至
              6%，管理层用“卡车盈余”以及每公里或每分钟的卢比毛利来评估分销经济性，而不是看城市层面的百分比利润。Bengaluru 等城市枢纽的一辆专用配送卡车，每日固定运营成本约为
              ₹3,000，包括车辆租赁、司机薪酬和燃油。以 6% 毛利率运输 ₹2,00,000 库存，每趟可产生 ₹12,000 毛利，扣除车辆成本后约有 ₹9,000 运营盈余；相反，以 20% 利润率运输
              ₹20,000 的低密度货物只能产生 ₹4,000，几乎刚好覆盖配送开销。活跃复购零售商每月平均交易 10 至 17 次，并贡献约 70% 的商品交易总额；高频订单由此提供维持正向配送贡献利润所需的路线密度
              [CI004, CI005, CI006, CI007]。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
