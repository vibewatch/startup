      - number: '3.3'
        title: 转换成本、多平台经营与商户锁定
        blocks:
          - type: paragraph
            body: >-
              商户黏性是印度 B2B 商贸最难解决的结构性障碍之一。Kirana 店主营运资金有限，却普遍在多个采购渠道上同时经营。单个商户通常会对比 Jumbotail、竞争 B2B App 和本地批发 mandi
              经纪商的每日现货价，再拆分每周订单以获取贸易促销折扣。基础商品采购的转换成本几乎为零，店主可以通过 WhatsApp 或电话改向附近 mandi 下单并立即履约。Jumbotail 试图以
              Retail-as-a-Service 模式构建防御性锁定，把独立零售商转成配备 GoldenEye POS 软硬件的 J24 品牌便利店。一旦创业者用 GoldenEye
              处理店内消费者计费和库存管理，采购摩擦就会增加，补货也会与 Jumbotail 目录绑定。不过，Jumbotail 报告的 500,000 家商户中，绝大多数仍是标准批发买家，而非完全转化的 J24 加盟运营商。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP010
              - CP014
      - number: '3.4'
        title: 护城河持久性、平台风险与下游威胁
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的竞争护城河同时受到平台执行风险和外部零售演进的冲击。Solv India 合并后的整合立即带来管理层动荡：交易完成后不久，Solv CEO 和 CFO 相继离任。多卖家 B2B
              市场还带来品牌保护脆弱性：Adani Wilmar 品牌假冒食用油曾在市场分销渠道中被拦截，并形成 FIR。外部方面，Blinkit、Zepto 和 Instamart
              等面向消费者的即时电商快速普及，把城市冲动型杂货消费从社区 kirana 手中分走，降低了批发补货的可服务交易周转速度。再加上 Jumbotail 仍持续亏损，Venture Intelligence 记录
              FY25 收入为 INR 103.76 crore、净亏损为 INR 160.56 crore。除非 Jumbotail 扩大高毛利非杂货品类和嵌入式金融科技抽成，竞争性折扣将继续侵蚀平台单位经济性。
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
