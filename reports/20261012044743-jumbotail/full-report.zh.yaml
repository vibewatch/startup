        title: 展示项
        blocks:
          - type: callout
            title: 通过收购 Solv India 实现横向扩张
            body: >-
              从 SC Ventures 收购 Solv India，使 Jumbotail 从食品杂货批发分销转向横向多品类 B2B 商贸。合并后平台覆盖服装、鞋类、家居用品和电子产品，并为超过 500,000
              家零售商整合金融科技信贷方案。
            calloutType: insight
