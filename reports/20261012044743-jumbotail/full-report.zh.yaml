  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营覆盖、利润率、整合难题和估值倍数串成一条逻辑链，最终指向跟踪建议。
    data:
      nodes:
        - id: node-1
          label: 运营覆盖
          name: Scale & Distribution
          value: 500k+ MSMEs
          detail: 合并后的平台覆盖 400 多座城市、500,000+ 家 kirana 门店，建立广泛零售分销网络。
        - id: node-2
          label: 财务现实
          name: Unit Economics & Burn
          value: ₹160.6 Cr Loss
          detail: FY25 独立收入 ₹60.3 Cr、净亏损 ₹160.6 Cr，凸显持续的资本密集度和利润率压力。
        - id: node-3
          label: 金融科技引擎
          name: Solv Platform Integration
          value: $120M Series D
          detail: 战略收购 Solv India 增加营运资金和信贷赋能，提升商户变现能力。
        - id: node-4
          label: 整合拖累
          name: Execution Risks
          value: Executive Exits
          detail: 合并后包括 Solv CEO / CFO 离任在内的管理层更替，以及品牌假冒 FIR，均凸显运营摩擦。
        - id: node-5
          label: 估值基准
          name: Multiple Discipline
          value: 11.4x Multiple
          detail: $1B 估值对应 $88M 收入的 11.4x 倍数，即便批发业务承压，估值仍计入近乎无误的执行。
        - id: node-6
          label: 最终结论
          name: Investment Recommendation
          value: Track / Stretched
          detail: 建议加入观察名单并 Track；在投入资金前，要求提供经审计的合并后单位经济和 EBITDA 拐点。
      edges:
        - from: node-1
          to: node-2
        - from: node-2
          to: node-3
        - from: node-3
          to: node-4
        - from: node-4
          to: node-5
        - from: node-5
          to: node-6
    approximationNotes: 将定性和定量尽调输入串联起来，映射至最终投资立场。
