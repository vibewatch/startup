  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖商户门店、运营软件、金融科技放贷、批发商业、物流及合作方 AI 集成的六层功能架构。
    data:
      layers:
        - label: 第 1 层：kirana 门店与现代零售体验
          detail: 面向消费者的触点和品牌化零售即服务执行
          items:
            - J24 现代便利店模式
            - Greencard 消费者忠诚度计划
            - 门店品牌化与商品陈列展示
        - label: 第 2 层：店内操作系统（GoldenEye OS）
          detail: 部署在商户硬件上的专有云 POS 与门店管理套件
          items:
            - 云 POS 结账与钱箱管理
            - SKU 实时库存与缺货提醒引擎
            - 门店级 CRM 与客户购买历史
        - label: 第 3 层：金融科技与营运资金承保
          detail: 连接机构放贷方的嵌入式信用评分与支付结算层
          items:
            - 专有 kirana 信用评分引擎
            - 无抵押循环信用额度
            - 集成式 B2B 支付与 UPI 收款
        - label: 第 4 层：数字批发 B2B 市场平台
          detail: 采购发现、透明目录定价和多品类订单管理
          items:
            - 食品与主食市场平台
            - Solv 多品类 MSME 目录（服装、鞋类、电子产品）
            - 动态制造商促销与品牌广告引擎
        - label: 第 5 层：全栈供应链与物流基础设施
          detail: 技术驱动的实体分销、库存仓储与配送执行
          items:
            - 区域履约与越库中心
            - 自动化仓库管理系统（WMS）
            - 路线优化的次日门店配送车队
        - label: 第 6 层：企业 AI 与数据分析平台
          detail: NEC 战略合作强化的决策科学层
          items:
            - 需求预测与库存补货算法
            - NEC 店内计算机视觉与购物者行为洞察
            - 预测性缺货预防与定价优化
    approximationNotes: 架构层次反映公开平台描述、公司文件和合作披露；内部微服务拓扑尚未验证。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: kirana 商户数字化采用旅程
    type: journey-map
    summary: 展示 kirana 入驻、市场平台下单、物流履约、金融科技信贷采用、GoldenEye POS 部署及横向品类扩展的六阶段旅程。
    data:
      items:
        - label: 1. 发现与商户入驻
          detail: Tier-1 至 Tier-3 城镇的 kirana 零售商通过地推人员或同行推荐发现 Jumbotail；自助移动端注册需要基础 KYC。
          touchpoints:
            - Jumbotail Android 应用
            - 地推入驻代表
        - label: 2. 批发市场平台采购
          detail: 商户以透明价格和 SKU 选择，为主食、FMCG 及包装杂货下达数字订单。
          touchpoints:
            - B2B 目录界面
            - App 内价格发现
        - label: 3. 最后一公里门店配送
          detail: 次日配送直达门店门口，由 Jumbotail 自营履约中心和专属配送车队负责。
          touchpoints:
            - Jumbotail 物流车队
            - 门店配送与 POD 验证
        - label: 4. 金融科技营运资金融资
          detail: 有采购历史的商户可从 NBFC / 银行放贷合作方处获得短期信贷和发票融资。
          touchpoints:
            - Jumbotail 支付与信贷门户
            - 合作方放贷集成
        - label: 5. GoldenEye 零售 OS 与 J24 现代化
          detail: 高交易量零售商采用 GoldenEye 云 POS 管理库存、结账和 CRM，并转型为 J24 便利店。
          touchpoints:
            - GoldenEye POS 硬件与云 OS
            - J24 门店改造服务
        - label: 6. 横向品类扩展（Solv 之后）
          detail: 商户通过统一的 Solv 网络，将采购从食品 / 杂货扩展到服装、鞋类、家居用品和电子产品。
          touchpoints:
            - 多品类 B2B 目录
            - 跨品类信用额度
    approximationNotes: null
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU014
