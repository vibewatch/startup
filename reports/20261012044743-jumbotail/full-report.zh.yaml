      - number: '3.2'
        title: 能力矩阵与定价基准
        blocks:
          - type: paragraph
            body: >-
              平台能力对比显示，纯数字市场与全栈零售基础设施提供商的运营理念差异明显。Udaan 等纯市场最初采用轻资产撮合模式，依赖第三方物流伙伴，导致配送时效不稳定、包装质量不一。Jumbotail
              则重投自有仓储和内部配送车队，提供 24 小时内的门店配送。金融业务上，Jumbotail 通过 NBFC 贷款伙伴提供数字信贷支持，Solv 则带来了专门的 SME 营运资金承保工具。传统 mandi 分销商以
              7 至 21 天的灵活、靠关系维系的非正式信贷周期应对，且无需正式文件。技术产品上，Jumbotail 提供 GoldenEye 云端 Retail Operating System，为夫妻店升级计费、库存和
              CRM。所有渠道的批发定价都受到法定最高零售价（MRP）和主食杂货 3% 至 6% 的微薄分销商利润约束，数字平台因而只能依赖金融科技佣金和品牌促销溢价来补贴物流成本。
