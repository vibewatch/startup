  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现架构
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的收入来自多个商业层：食品和杂货主食的批发市场交易及佣金、仓储与履约费、GoldenEye Retail Operating System
              的软件和服务收入，以及贷款伙伴产生的融资支持费。高销量主食商品的市场交易以薄分销商利润为特征，平台抽成和交易利润率通常只有个位数。为摆脱低利润杂货批发，Jumbotail 收购 Solv India
              后横向扩展到服装、家居用品和消费电子等一般商品，这些品类的名义利润率潜力更高。金融科技层面，公司通过把无银行账户或银行服务不足的 kirana 店主连接到机构资产负债表，赚取转介费和平台发放费；这样既避免在
              Jumbotail 资产负债表上直接承担信贷风险，也把交易留存绑定到流动性可得性 [CI001, CI002, CI003, CI004, CI008]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
