      - number: '2.3'
        title: 买方分层与采购流程
        blocks:
          - type: paragraph
            body: >-
              目标客户生态以印度庞大的“India 2”人群为核心：这一有上升意愿的中产阶级约占全国住户的 42%，日常生活消费主要依靠本地 kirana
              门店。在这张零售网络中，店主同时是唯一的商业买方、预算负责人和信贷付款人。传统采购流程要求店主管理数十家不同分销商，应对无法预测的缺货，并在严重营运资金约束下谈判不透明的价格条款。Jumbotail 通过自有
              GoldenEye Retail OS 和 J24 门店模式，把 App 数字目录采购、可预测的次日门店物流和自动云端 POS 工具整合起来，缓解这一运营摩擦。整合 Solv India 后，Jumbotail
              的活跃商户网络覆盖 400 个城市和城镇的逾 500,000 家零售门店。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              B2B kirana 数字化的采用势头，来自移动连接扩张、数字支付基础设施普及，以及传统零售商为抵御快速配送即时电商而承受的本地客流压力。与此同时，正规银行系统长期系统性地服务不足
              MSME，催生了对替代性、与交易挂钩的营运资金信贷的巨大需求，Jumbotail
              便与机构贷款伙伴共同提供这类信贷。但采用约束和结构性风险仍然明显。扩大嵌入式信贷会带来宏观违约风险：地方经济收缩或零售库存变质，都可能引发连锁贷款逾期并挤压承保资产负债表。此外，从高频杂货横向扩展到非食品
              MSME 品类，会带来运营复杂度、供应链摩擦和组织人员流失，Solv India 整合后的关键高管离任已说明这一点。
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: Kirana 的营运资金断层
            body: 传统印度 kirana 门店现金流紧张，也长期被正规商业银行渠道忽视。Jumbotail 把营运资金信贷承保嵌入日常采购下单流程，将原始交易购买历史转化为自有承保资产，借此提高平台黏性并锁定商户忠诚度。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: callout
            title: 信贷违约与多品类整合风险
            body: >-
              向非组织化微型零售商提供营运资金融资，会暴露在显著的宏观脆弱性下：经济下行或通胀可能迅速推高商户违约率，并令贷款伙伴承压。此外，从杂货扩展到电子产品、服装等多样品类，也会在 Solv India
              整合后带来物流稀释和高管流失风险。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: B2B 批发格局与竞争者画像
        blocks:
          - type: paragraph
            body: >-
              印度食品和杂货分销生态仍主要由约 19 million 家传统社区 kirana 店支撑，它们是数字 B2B 平台与传统供应链争夺的主战场。Jumbotail 在这一市场直接面对风险投资支持的横向市场
              Udaan、传统 mandi 批发商和现代现金自提式零售商的竞争。Udaan 曾在多个消费品类快速扩张，但资本大幅收缩，估值在 2022 至 2024 年间腰斩，随后于 2025 年年中获得 $114
              million G 轮融资。相比之下，Jumbotail 先深耕以杂货为先的垂直密度，再于 2025 年从 SC Ventures 收购 Solv India。该收购把 Jumbotail 的物流基础设施与
              Solv 的 MSME 商贸平台结合起来，触达 500,000 家注册零售商，并把目录扩展至服装、家居用品和消费电子。不过，传统农产品和 FMCG mandi
              仍凭借深厚的本地信贷关系和即时结算机制占据交易量优势。
            claimRefs:
