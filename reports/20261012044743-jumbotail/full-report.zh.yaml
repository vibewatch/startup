            title: 持续的盈利缺口与第三方供应商质量责任
            body: >-
              尽管独角兽估值基准超过 $1.0 billion，单体申报仍显示 FY25 持续发生 ₹160.56 crore 的会计净亏损。叠加 2024 年假冒供应商 FIR 责任，以及 Solv
              整合期间的高管流失，公司估值仍需以经审计的合并后单位经济模型加以验证。
