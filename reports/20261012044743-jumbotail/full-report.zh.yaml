chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、平台基础设施与商业模式
        blocks:
          - type: paragraph
            body: >-
              Jumbotail Technologies Private Limited 由 Stanford Graduate School of Business 校友 S. Karthik Venkateswaran
              和 Ashish Jhina 于 2015 年 11 月创立，总部位于 Bengaluru，是一家旨在改造印度非组织化食品杂货零售业的 B2B
              电商与新零售平台。公司搭建了连接数字与实体的完整商贸基础设施，服务传统夫妻店杂货铺（通常称为 kirana）以及微型、小型和中型企业（MSME）。Jumbotail
              并不试图用高资本消耗的即时消费电商或集中式大型批发店绕开传统社区店主，而是把自己定位为本地零售创业者的底层操作系统和供应链骨干。


              核心架构由四个自有、垂直整合的平台组成：将零售商直接连接到头部 FMCG 品牌和主食生产商的数字批发 B2B
              市场；提供每日次日门店配送的自营技术物流和仓储网络；与受监管贷款伙伴合作、提供数字支付和营运资金融资的嵌入式金融科技引擎；以及由 GoldenEye 驱动的 J24 新零售便利店网络，GoldenEye 是
              Jumbotail 自有的云端零售操作系统。通过这套完整架构，kirana 创业者可以使用自动 POS 计费、数据驱动的商品管理、自动补货和客户忠诚度流程，把传统便利店改造成现代便利零售门店。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO012
      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 由 S. Karthik Venkateswaran 和 Ashish Jhina 联合创办，两人在 Stanford University 读商科研究生时相识。首席执行官 S.
              Karthik Venkateswaran 曾任印度陆军军官，将严格的运营指挥、供应链物流执行和战略领导力带入平台的多城市扩张与资本管理。联合创始人兼首席运营官 Ashish Jhina
              拥有农业种植背景，同时具备咨询和商业教育经历，负责日常仓库运营、分销商合作、商户招募和一线 kirana 履约。


              在 $120 million D 轮融资及 2025 年年中收购 Solv India 后，公司治理显著扩充。SC Ventures 的运营成员、同时担任 Solv India 董事长的 Gautam Jain
              正式加入 Jumbotail 董事会，为 Standard Chartered 创新部门提供直接的机构监督。此任命补充了长期机构伙伴的董事会和投资者代表，包括 Artal Asia（Invus
              Group）及早期投资人 Nexus Venture Partners。关键人物依赖仍集中在两位联合创始人身上，他们继续负责所有运营部门的核心公司战略和日常商业执行。
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
              - CO010
      - number: '1.3'
        title: 资本化历程、估值基准与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Jumbotail 累计股权融资超过 $263 million，总资本超过 $329 million，融资形式包括结构化风险投资轮次、风险债务额度和战略公司融资。公司早期获得 Nexus
              Venture Partners 和 Kalaari Capital 的风险投资，随后于 2021 年 12 月完成 $85 million C 轮融资，由全球常青投资公司 Invus 旗下的新加坡关联机构
              Artal Asia 领投，Ajax Capital 参与。C 轮同时包含新增股权发行和早期风险投资人的部分二级流动性退出。


              2025 年 6 月，Jumbotail 完成由 SC Ventures（Standard Chartered 的风险投资与金融科技投资部门）领投的 $120 million D 轮融资，原有投资人 Artal
              Asia 继续参与。融资与收购 Solv India 同期发生，将 Jumbotail 的投后估值推过 $1.0 billion 门槛，使其成为印度最新的 B2B 电商独角兽；Venture
              Intelligence 则将其企业估值基准定为 ₹12,588 crore。除股权投资者外，Jumbotail 的资本结构还包括 Alteria Capital 和 InnoVen Capital
              提供、合计超过 $13.7 million 的结构化风险债务，用于库存和仓库营运资金。
            claimRefs:
              - CO004
              - CO005
              - CO011
              - CO012
