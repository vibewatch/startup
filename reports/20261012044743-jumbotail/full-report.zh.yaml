              - CU014
      - number: '6.3'
        title: 商业证明、品牌合作与生态整合
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的企业级商业证明包括品牌制造商关系、机构金融科技伙伴关系和战略技术整合。平台作为关键分销入口，把全国 FMCG 制造商和农业磨坊商直接连接到分散的大众市场
              kirana，绕开传统中间商层级。Solv India 的战略收购于 2025 年 5 月获印度竞争委员会正式批准，并由 SC Ventures 领投的 $120 million D 轮融资支持，证明
              Jumbotail 作为整合型 B2B 商贸与信贷引擎的角色。此外，Jumbotail 于 2026 年 3 月与 NEC Corporation 建立战略合作，共同开发适配印度非组织化 kirana 环境的
              AI 和零售技术，提升 GoldenEye 平台的库存优化和消费者互动。
            claimRefs:
              - CU002
              - CU007
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU005
