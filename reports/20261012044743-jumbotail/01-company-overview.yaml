callouts:
  - calloutType: insight
    title: Horizontal Expansion via Solv India Acquisition
    body: >-
      The acquisition of Solv India from SC Ventures represents a decisive strategic transition from food-and-grocery
      wholesale distribution into horizontal multi-category B2B commerce. The combined platform extends across apparel,
      footwear, home furnishings, and electronics while integrating fintech credit solutions for over 500,000 retailers.
    claimRefs:
      - CO004
      - CO005
      - CO007
  - calloutType: risk
    title: Persistent Profitability Gaps and Third-Party Supplier Quality Liabilities
    body: >-
      Despite reaching a unicorn valuation benchmark above $1.0 billion, standalone filings disclose persistent net
      accounting losses of ₹160.56 crore in FY25. Coupled with counterfeit supplier FIR liabilities in 2024 and
      executive churn amid the Solv integration, the company's valuation requires verification of audited consolidated
      unit economics.
    claimRefs:
      - CO012
      - CO013
      - CO014
