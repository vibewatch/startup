callouts:
  - calloutType: "recommendation"
    title: "Discipline on Unicorn Entry Valuation"
    body: "Investors should maintain strict pricing discipline and place Jumbotail on a monitoring watchlist. While the acquisition of Solv India significantly broadens retail distribution to over 500,000 merchants, paying an 11.4x revenue multiple for an unproven post-merger margin structure leaves minimal margin of safety."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV014"
  - calloutType: "risk"
    title: "Post-Merger Governance and Integration Headwinds"
    body: "The abrupt departure of Solv India's CEO and CFO during merger integration, combined with persistent standalone operating deficits, indicates elevated operational drag. Diligence must independently audit cross-sell conversion rates, loan book asset quality, and genuine gross margin expansion before considering equity participation."
    claimRefs:
      - "CV009"
      - "CV011"
      - "CV014"
