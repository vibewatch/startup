callouts:
  - calloutType: "insight"
    title: "Operating Denominator Divergence: Rupee Surplus Over Percentage Margin"
    body: "Evaluating grocery B2B marketplaces using traditional software percentage margins obscures the core physics of distribution. A high percentage margin on small baskets fails to absorb physical delivery overhead, whereas moving large staple volumes at 6% gross margin generates sufficient rupee gross profit to yield a durable truck surplus across high-density urban clusters [CI004, CI005]."
    claimRefs:
      - "CI004"
      - "CI005"
  - calloutType: "risk"
    title: "Substantial Operational Cash Drain and Private Disclosure Void"
    body: "Despite raising over $263M and reaching a $1B valuation, Jumbotail generated a ₹160.56 Cr net loss against ₹103.76 Cr in revenue in FY25. With post-merger Solv financials and credit loss provisions undisclosed, forward capital adequacy remains heavily contingent on investor balance sheet support [CI009, CI011, CI012, CI014]."
    claimRefs:
      - "CI009"
      - "CI011"
      - "CI012"
      - "CI014"
