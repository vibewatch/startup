evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited consolidated post-merger profit and loss statements, gross margin figures, EBITDA, and cash-flow
      statements for the combined Jumbotail and Solv entity for FY25 and FY26.
    whyItMatters: >-
      While standalone entities disclose revenue milestones and venture funding, consolidated unit economics and burn
      rates remain private, obscuring true operating profitability.
    diligencePath: >-
      Request consolidated audited financials, management MIS reports, and statutory filing records from the Ministry of
      Corporate Affairs (MCA) covering Jumbotail Technologies Pvt Ltd and Solv India.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete cap-table breakdown, liquidation preference terms, and voting rights distribution across Series D
      preferred shareholders following the Solv transaction.
    whyItMatters: >-
      Standard Chartered / SC Ventures and Invus hold significant economic control, but precise shareholding percentages
      and protective covenants are undisclosed.
    diligencePath: >-
      Review MCA Form PAS-3 and SH-7 allotment filings along with amended Articles of Association (AoA) for Jumbotail
      Technologies Private Limited.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-post-merger-economics
    missingEvidence: >-
      Audited consolidated revenue, gross margin breakdown by category, EBITDA, and empirical credit-loss rates for the
      combined Jumbotail-Solv lending operations.
    whyItMatters: >-
      Understanding whether Jumbotail can sustain profitability across horizontal non-grocery categories while managing
      MSME credit risk is critical to validating unicorn valuation multiples.
    diligencePath: >-
      Request audited FY25-FY26 consolidated financial statements and lender partner default cohort reporting during
      management diligence.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: Merchant Retention and Multi-Homing
    missingEvidence: >-
      Audited merchant repeat order rates, cohort retention curves, and exclusive kirana wallet-share metrics across the
      combined Jumbotail and Solv India retailer base.
    whyItMatters: >-
      Without cohort retention data, it is impossible to evaluate whether the 500,000 onboarded retailers multi-home
      across traditional mandis and rival platforms or generate sticky recurring volume.
    diligencePath: Request audited monthly active buyer cohorts, kirana churn metrics, and wallet-share survey data from management.
    relatedQuestionRefs:
      - QP009
  - type: conflicting-data
    severity: minor
    topic: B2B Take Rates and Realized Pricing
    missingEvidence: >-
      Granular breakdown of net take rates, delivery fees, and lending facilitation commissions versus gross merchandise
      value across categories.
    whyItMatters: >-
      Public sources report gross funding and headline category scope but lack disclosed commission rates and credit
      underwriting spreads needed to assess pricing power against incumbents.
    diligencePath: >-
      Review vendor master services agreements, distributor commission schedules, and NBFC partner revenue-share
      agreements.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
