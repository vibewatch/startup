callouts:
  - calloutType: insight
    title: The Kirana Working Capital Disconnect
    claimRefs:
      - CM007
      - CM008
      - CM009
    body: >-
      Traditional Indian kirana stores operate with constrained cash flows and face structural neglect from formal
      commercial banking channels. By embedding working capital credit underwriting directly into the daily procurement
      ordering flow, Jumbotail transforms raw transactional purchase history into a proprietary underwriting asset that
      drives platform stickiness and locks in merchant loyalty.
  - calloutType: risk
    title: Credit Default and Multi-Category Integration Hazards
    claimRefs:
      - CM013
      - CM014
    body: >-
      Extending working capital financing to unorganized micro-retailers introduces acute macroeconomic vulnerability,
      as downturns or inflation can quickly elevate merchant default rates and stress lending partners. Furthermore,
      scaling beyond grocery into diverse categories like electronics and apparel risks logistical dilution and
      executive turnover following the Solv India consolidation.
