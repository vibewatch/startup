  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Need
      - Traditional Unorganized Workflow
      - Jumbotail Platform Solution
      - Measurable Operational Benefit
      - Key Operational Limitation
    rows:
      - - Weekly grocery replenishment
        - Physical travel to congested wholesale mandis; fragmented multi-vendor haggling and cash settlement
        - App-based digital ordering with consolidated catalog, transparent pricing, and next-day doorstep delivery
        - Eliminates mandi travel time; reported 98% order fill rate and transparent line-item invoicing
        - Requires digital literacy, smartphone adoption, and reliable regional fulfillment route coverage
      - - In-store inventory & checkout
        - Manual ledger books (khata), unrecorded shrinkage, estimated pricing, and paper billing
        - GoldenEye cloud POS system with barcode scanning, automated restocking alerts, and digital receipts
        - Supermarket-grade operational visibility with automated real-time inventory and profit tracking
        - Hardware installation requirements and merchant reluctance to formalize transaction records
      - - Short-term working capital
        - Informal moneylenders and distributor credit at punitive interest rates or restrictive ties
        - Collateral-free embedded credit lines via Jumbotail Capital powered by platform transactional data
        - Enables larger basket sizes and higher order frequency without upfront cash constraints
        - Credit availability capped by institutional lending partner risk appetite and RBI NBFC guidelines
      - - Store modernization & branding
        - Unbranded, dimly lit traditional store layout with poor merchandising and zero customer loyalty tracking
        - Turnkey conversion to J24 modern convenience store with Greencard loyalty and optimized layout
        - Rapid store conversion executed within 24 to 48 hours to compete directly with modern retail formats
        - Franchise standard adherence, brand consistency across disparate geographies, and operator friction
    notes: Workflow analysis contrasts traditional Indian retail practices against platform-enabled operating mechanics reported in verified company case materials.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE009
      - CE014
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Component
      - Operational Role & Scope
      - Core Technology & Physical Dependency
      - Key Technical or Execution Risk
    rows:
      - - GoldenEye Cloud POS Engine
        - In-store retail transactions, inventory updates, barcode scanning, and merchant analytics
        - Cloud-hosted microservices integrated with low-cost in-store Android tablets and peripherals
        - Network connectivity interruptions in Tier-2/3 towns and localized hardware terminal failures
      - - Automated Supply Chain & WMS
        - Fulfillment center picking, cross-docking, batching, and route dispatch optimization
        - Proprietary Warehouse Management System (WMS) managing regional fulfillment centers and vehicle fleet
        - Supply chain bottleneck during festive demand spikes and vehicle fleet dispatch delays
      - - Fintech Underwriting Core
        - Data ingestion from marketplace orders to generate proprietary risk scores for lending partners
        - Algorithmic decision engine interfacing via secure APIs with partner banks and NBFC platforms
        - Lending partner credit line contraction and regulatory changes regarding digital lending guidelines
      - - Enterprise Retail AI Layer
        - Advanced inventory forecasting, dynamic promotions, and automated in-stock optimization
        - NEC Corporation strategic AI collaboration integrating global retail algorithms and edge vision
        - Integration latency across legacy kirana hardware and algorithm calibration to unorganized retail data
    notes: Architectural components, roles, and dependencies based on company disclosures, technical press releases, and enterprise partnership filings.
