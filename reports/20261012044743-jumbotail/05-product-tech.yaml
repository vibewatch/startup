callouts:
  - calloutType: insight
    title: Full-Stack Logistics and POS Coupling as Defensible Moat
    body: Unlike pure asset-light B2B marketplaces that rely on third-party 3PLs or disintermediated order routing, Jumbotail's coupling of in-house fulfillment centers, storefront delivery, and proprietary GoldenEye POS billing embeds the platform into daily merchant operating routines. This physical-plus-digital integration creates high switching costs for kirana owners who depend on overnight replenishment and real-time inventory reconciliation.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE011
  - calloutType: risk
    title: Multi-Category Expansion Strains Quality and Inventory Controls
    body: The horizontal absorption of Solv India's multi-category footprint introduces operational complexity across disparate supply chains including apparel, footwear, and consumer electronics. The past FIR regarding counterfeit branded goods highlights the ongoing risk of supplier fraud and quality slippage across a marketplace onboarding thousands of third-party MSME vendors.
    claimRefs:
      - CE007
      - CE010
