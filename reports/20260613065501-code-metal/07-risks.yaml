- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance burden outruns delivery speed
    - Evidence of delayed launches or deal slippage tied to AI Act, certification, or security review
    - Two or more flagship deployments slip because trust or compliance work outweighs translation speed gains
    - Re-underwrite product fit in regulated deployments and demand a compliance roadmap before investing
  - - Reliability claims remain unproven
    - Management cannot provide production pass-rate, rollback, or defect-escape data during diligence
    - No deployment-quality scorecard for named customer programs
    - Treat trust claims as marketing-led and reduce conviction on platform scalability
  - - Customer concentration persists
    - Public customer roster remains effectively the same after the next financing cycle
    - No broadening beyond a small set of named defense or industrial logos
    - Assume revenue concentration and lower terminal multiple assumptions
  - - Services burden dominates
    - Implementation or support effort per deployment stays high relative to contract value
    - Forward-deployed or solutions headcount grows as fast as engineering and revenue
    - Model slower margin expansion and question software-platform conversion
  - - Financing resets before metrics catch up
    - Next financing or secondary signal prices the company materially below the implied Series B expectations
    - Down round, flat round, or internal mark pressure without public KPI improvement
    - Avoid price-taking behavior and revisit whether the thesis still works at public-evidence quality
  - - Key-person or research loss
    - Founder, COO, or visible research affiliate departs without succession clarity
    - Departure plus no named technical or commercial successor within a quarter
    - Pause investment or require governance and retention protections
  notes: These are investor monitoring triggers rather than legal obligations. They are designed to surface when trust, delivery, and proof assumptions stop compounding into a scalable platform story.
