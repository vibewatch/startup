- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Covers the material regulatory, legal, and provenance risks visible in retained public sources as of 2026-06-13; it is not a substitute for docket, contract, or patent review.
  columns:
  - Rule / issue
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure
  - Diligence path
  rows:
  - - EU AI Act GPAI and high-risk obligations
    - European Union
    - Active; GPAI rules effective and transparency rules due August 2026
    - Medium-High
    - Critical
    - Medium
    - Documentation, copyright-summary, and labeling obligations can slow deployments into regulated or public-interest use cases
    - Request the compliance workplan, model governance owner, and any planned training-data summaries
  - - Government software certification and assurance burden
    - United States defense / federal
    - Active programmatic burden rather than a one-time approval
    - High
    - High
    - Low-Medium
    - Mission deployments may take longer than commercial pilots because assurance evidence must survive procurement and review workflows
    - Map each named program to required accreditation, test evidence, and approval owners
  - - Training-data provenance and copyright scrutiny
    - United States / global
    - Policy scrutiny is active; no company-specific resolution disclosed
    - Medium
    - High
    - Low
    - Any narrowing of acceptable training-data practice could increase licensing cost or retraining burden
    - Review training-data provenance, licenses, model cards, and indemnity language
  - - Generated-output ownership and AI copyrightability
    - United States / global enterprise contracting
    - Active policy issue; output protection depends on human contribution and contract drafting
    - Medium
    - High
    - Low
    - Buyers may demand explicit ownership, review, and data-rights language before trusting generated mission code or proofs in production
    - Review customer contract terms for authorship, output ownership, data rights, and human sign-off requirements
  - - Privacy and code-handling obligations
    - Global enterprise deployments
    - Public website privacy policy exists, but product-code handling detail is thin
    - Medium
    - Medium-High
    - Low-Medium
    - Buyers may demand more clarity on retention, segregation, and customer-code use than the website policy provides
    - Request the product DPA, retention schedule, and code-isolation architecture
  - - Litigation, patent, and IP-license visibility gap
    - United States / global
    - No public clearance from retained sources
    - Medium
    - Medium-High
    - Low
    - Absence of docket or patent evidence is not the same as absence of exposure, especially with academic lineage and mission software
    - Run docket and patent searches and inspect enterprise contract indemnities
  notes: Severity ranks reflect underwriting impact, not legal certainty. The register emphasizes where public evidence stops short of clearing risk and where management materials would be decisive.
