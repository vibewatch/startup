  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation-and-ip
    missingEvidence: A direct court-docket search, patent search, and contract-language review covering IP indemnity, training-data provenance, generated-output ownership, and any pending disputes.
    whyItMatters: The current public record does not affirmatively clear litigation, patent, licensing, or output-ownership exposure around mission-critical code translation and academic lineage.
    diligencePath: Run docket searches across federal and state courts, search USPTO assignments and patents, and request standard customer MSA/DPA language plus any indemnity, ownership, and human-authorship carve-outs.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: procurement-verification
    missingEvidence: Named contract vehicles, award values, prime-versus-subcontract status, and customer references that tie Code Metal to specific defense or federal procurement records.
    whyItMatters: Programs-of-record language is commercially important, but public search pages alone do not confirm the depth, paper, or economics of government work.
    diligencePath: Ask management for contract numbers, prime/sub relationships, statement-of-work summaries, and references that can be reconciled against procurement systems.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: runway-and-unit-economics
    missingEvidence: Current cash balance, burn, ARR, gross margin, services mix, retention, and next-12-month hiring plan.
    whyItMatters: A $1.25 billion valuation is difficult to underwrite without knowing whether capital is extending a scalable software business or funding expensive bespoke delivery.
    diligencePath: Request full operating model, board deck KPI pages, cohort and revenue-mix data, and a base-case cash runway model.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: leadership-bench
    missingEvidence: Current org chart, board composition, succession planning, and ownership of research, delivery, security, and government programs below the founders.
    whyItMatters: The public record supports founder and scholar quality, but not whether bench depth is sufficient if a key leader departs or growth accelerates.
    diligencePath: Request org chart, board observer list, succession plan, and interviews with the COO, engineering leadership, security leadership, and government-delivery owners.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: production-reliability
    missingEvidence: Measured pass rates, rollback rates, defect escape data, post-translation verification yield, secure-default settings, vulnerability-response artifacts, and SLA terms for production deployments.
    whyItMatters: The company markets trust and verification, but investors still need hard evidence that generated code performs reliably and is operated with secure-by-design discipline outside curated technical examples.
    diligencePath: Request customer scorecards, internal QA metrics, benchmark methodology, redacted incident or remediation logs, and product-security artifacts covering logging, vulnerability management, and secure configuration for production programs.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR002
