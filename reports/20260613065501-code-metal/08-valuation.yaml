- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Snyk
    - Developer security platform with $300M ARR and $278M 2024 revenue
    - Last disclosed private valuation $7.4B; still private and not rushing IPO
    - Useful upper-bound reference for a scaled developer-focused platform with visible revenue.
    - Broader security product, much later stage, and meaningfully more disclosed metrics than Code Metal.
  - - Sonar
    - Code-quality platform with global reach
    - Raised $412M at $4.7B valuation in 2022; explicit ambition toward $1B revenue
    - Shows what a broader clean-code platform can command when scale is visible.
    - Not a mission-critical translation company; valuation is older and category breadth is wider.
  - - Diffblue
    - AI-for-code testing specialist
    - Raised $6.3M in 2024 despite 326% net new ARR growth
    - Useful lower-scale private reference for narrow AI-for-code tooling.
    - Testing workflow is narrower and the round size says more about stage than about Code Metal’s exact economics.
  - - IBM
    - Public modernization incumbent
    - Public enterprise with broad AI and modernization stack; not used as a direct multiple
    - Relevant because large accounts can satisfy similar needs through incumbent platforms.
    - Scale, installed base, and public-company profile make direct valuation comparison inappropriate.
  - - Booz Allen / SAIC
    - Federal AI and mission-IT incumbents
    - Public services-heavy incumbents; directional budget competitors, not direct price comps
    - Important because they can win the same modernization budgets through existing procurement channels.
    - Services economics and federal contracting mix are very different from venture software expectations.
  - - GrammaTech / Galois
    - High-assurance specialists
    - Private specialist references with long assurance track records but no public venture pricing markers
    - Relevant for trust credibility and substitution risk in regulated environments.
    - Lack of disclosed valuation data limits them to qualitative boundary markers.
  notes: This is a directional boundary set, not a clean comp basket. Each row is included for a specific lens—platform scale, AI-for-code narrowness, assurance credibility, or budget ownership.
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant public, private, incumbent, and assurance-style references visible in retained sources for Code Metal’s mission-critical code-translation wedge as of the 2026 run date.
