  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Board-level or audited ARR, recognized revenue, gross margin, and services-versus-software mix for 2025-2026.
    whyItMatters: Without those KPIs, the current $1.25B price cannot be tested against software-quality revenue rather than bespoke delivery activity.
    diligencePath: Request monthly KPI packs plus the last four quarters of board materials showing ARR, revenue recognition, gross margin, and forward guidance.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV019
    - QV020
  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: Series B term sheet detail on liquidation preferences, participation, secondary mix, pro rata, debt, and any structured financing overlays.
    whyItMatters: Economic overhang can materially change realized return even if headline enterprise value keeps rising.
    diligencePath: Review the Series A and Series B financing documents, updated cap table, and any debt or SAFE conversion schedules.
    relatedQuestionRefs:
    - QV008
    - QV028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Active-customer count, top-10 revenue concentration, investor-linked customer share, backlog duration, and pilot-to-production conversion data.
    whyItMatters: A short public logo list can hide concentration or reference-quality issues that would matter directly to valuation durability.
    diligencePath: Request cohort tables by customer, contract type, and funded backlog, plus a split between investor-adjacent and independent accounts.
    relatedQuestionRefs:
    - QV009
    - QV020
    - QV021
    - QV029
  - type: missing-source
    severity: minor
    topic: win-rate-benchmarking
    missingEvidence: Independent benchmark or win-loss evidence against Snyk, Sonar, IBM, services primes, or internal-build alternatives.
    whyItMatters: Comparable positioning is currently directional; real displacement evidence would sharpen both upside and downside range logic.
    diligencePath: Request anonymized win-loss notes, procurement benchmark decks, and reference calls from customers that evaluated incumbent alternatives.
    relatedQuestionRefs:
    - QV012
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
  - type: stale
    severity: minor
    topic: third-party-proof-density
    missingEvidence: More independent 2026 third-party validation on production deployments, realized savings, and verified outcomes.
    whyItMatters: The public bull case still leans heavily on official and investor-authored materials, which lowers confidence in the valuation narrative.
    diligencePath: Look for procurement disclosures, customer conference talks, case studies with metrics, or independent analyst notes published after the Series B.
    relatedQuestionRefs:
    - QV022
    - QV023
    - QV029
