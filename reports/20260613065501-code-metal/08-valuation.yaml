tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Public evidence validates real product, customers, and financing, but not the KPI bridge behind a $1.25B mark.
    - Do not underwrite as a buy from public data alone.
  - - Confidence
    - medium
    - Core financing facts are corroborated, while economics, concentration, and terms remain private.
    - Advance only with management data access.
  - - Risk rating
    - high
    - Valuation opacity, services-mix risk, and concentration risk are still live.
    - Model material downside alongside upside.
  - - Valuation stance
    - expensive
    - Today’s price already assumes platform-like outcomes not yet publicly proven.
    - Require either a lower entry price or stronger KPI proof.
  - - Entry discipline
    - Strict
    - Ask for ARR, gross margin, customer concentration, backlog, and cap-table detail before moving beyond tracking.
    - No lead check at the current mark without that package.
  notes: This table summarizes the investment call, not a marketability score. The judgment is price-sensitive because the current valuation is public while operating metrics are not.
