- id: thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The positive thesis is real. Code Metal appears to occupy a meaningful wedge at the intersection of code modernization, hardware portability, and formal-verification-oriented trust. That wedge matters most in defense, aerospace, industrial, and semiconductor settings where failure costs are high and legacy code is hard to move. Public materials also support more than a pure concept story: the company has named reference accounts, technical depth, and repeated financing from both enterprise and defense-oriented investors. The anti-thesis is just as important. Public evidence still does not prove that verified translation is a budget-defining category rather than a premium feature inside broader modernization or security budgets. Competing routes include adjacent developer-security leaders, established assurance specialists, broad incumbents, and services-heavy federal integrators that already control budget and procurement pathways. If Code Metal cannot turn project-led migrations
    into repeatable software economics, then the right mental model is not a breakout developer platform but a narrower, more labor-intensive modernization vendor. That is why the bull story is understandable but not yet fully underwritten at the current price.'
