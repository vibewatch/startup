chapter:
  number: 8
  title: Valuation
  summary: Code Metal has enough product differentiation, customer relevance, and financing support to merit serious diligence, but not enough public KPI disclosure to justify a buy call at the disclosed $1.25 billion Series B price. The evidence-constrained posture is research-more with medium confidence, high risk, an expensive valuation stance, and strict entry discipline until revenue quality and cap-table terms are visible.
sections:
- id: financing-context-and-public-price-support
  title: Financing context and public price support
  body: 'Code Metal has real financing momentum, but the public support for the price is still incomplete. The strongest hard facts are straightforward: the company disclosed a $36.5 million Series A at a $250 million valuation in November 2025 and then a $125 million Series B at a $1.25 billion valuation in February 2026. That is a roughly fivefold valuation jump in only a few months, with about $177.95 million of visible capital across pre-seed, seed, Series A, and Series B. Named customers and mission-critical positioning make the jump intelligible, and the SEC Form D trail supports a fast financing cadence. The problem is not that the price is impossible; it is that public evidence does not yet show the operating bridge. Retained sources do not disclose ARR, gross margin, burn, cash, retention, customer count, or cap-table overhang terms. Public support therefore comes primarily from investor quality, customer logos, and narrative conviction rather than from the KPI package that would
    normally make a $1.25 billion private mark feel durable. That pushes the chapter toward scenario logic and entry discipline rather than heroic multiple math.'
