  foundingLocation: Boston, MA
  headquarters: Boston, MA
  productSummary: Code Metal sells AI-assisted, proof-backed code translation and optimization software for moving code across programming languages, toolchains, and hardware targets in mission-critical environments.
  customerFocus: Defense programs and primes, plus industrial enterprises in semiconductor, automotive, telecom, and other regulated environments with legacy or hardware-specific code bases.
  businessModel: High-touch enterprise and government software motion with custom pricing, forward-deployed implementation support, and partnership-led expansion rather than self-serve SaaS packaging.
  stage: Series B
  fundingStatus: Code Metal disclosed a $125M Series B at a $1.25B valuation in February 2026 after a $36.5M Series A at a $250M valuation in November 2025; disclosed cumulative financing totals about $177.95M.
