  - id: deployment-integration-support-and-maturity
    title: Deployment, Integration, Support, and Maturity
    body: >-
      Code Metal's strongest public maturity signals are around target breadth and implementation seriousness, not around
      polished self-serve packaging. The product page explicitly names CPUs, GPUs, FPGAs, and multiple toolchains,
      while the NVIDIA-portability research gives one concrete proof point that the portability story is more than
      aspirational: it describes validated translation from CUDA to OpenCL on Qualcomm Adreno GPUs and from serial CPU
      kernels to Hexagon Vector Extension NPUs, with some workloads meeting or exceeding baseline performance. Hiring
      fills in the operating model. Platform DevOps roles for CI/CD and cloud-plus-on-prem, a Solutions Architect,
      a Forward Deployed Engineer, and a Facility Security Officer suggest hands-on integration and government-adjacent
      delivery rather than a pure SaaS motion. Research output spans verified transpilation, workflow orchestration,
      HPC translation, specialized code models, and benchmarking, while official news pages show a steady cadence of
      funding and media moments tied to product development. The limiting factor is disclosure depth: there is still no
      public API reference, supported-runtime matrix, or support-SLA documentation comparable to a mature developer
      platform.
