    title: Product Architecture Map
    type: stack
    layout: wide
    summary: Publicly reconstructable layers from developer intake through proof optimization and hardware-target delivery.
    data:
      layers:
        - label: Developer surface layer
          detail: User-facing entry points that anchor Code Metal in existing engineering workflows.
          items: [IDE plugin, Readable generated code, Version-control-friendly change tracking]
        - label: Context and planning layer
          detail: Transforms source-code and environment constraints into a concrete migration plan.
          items: [Dependency tracking, Low-level equivalent discovery, Runtime and toolchain configuration, Transpilation and deployment plan]
        - label: Translation layer
          detail: Generates target-language or target-backend implementations for the chosen environment.
          items: [LLM-guided translation, Task-specific repair workflows, CPU/GPU/FPGA backend generation]
        - label: Verification layer
          detail: Adds the trust step that separates Code Metal from generic code generation.
          items: [Functional-equivalence proof generation, Safety-violation checks, Validated benchmark outputs]
        - label: Optimization layer
          detail: Searches across output variants for deployable tradeoffs.
          items: [Runtime optimization, Memory optimization, Code-size optimization, Power optimization]
        - label: Delivery and support layer
          detail: Targets the final runtime and the human support surfaces required to operationalize it.
          items: [CPU/accelerator targets, CI/CD and on-prem delivery, Forward-deployed support, Security-cleared operating context]
    approximationNotes: Layer boundaries are reconstructed from product copy research artifacts and hiring. Code Metal has not published a full control-plane or system-design document.
