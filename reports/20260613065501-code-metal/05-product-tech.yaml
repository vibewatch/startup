  evidenceGaps:
    - type: missing-source
      severity: material
      topic: proof-coverage
      missingEvidence: A public or confidential metric showing what share of generated outputs receive full equivalence proofs partial proof obligations or test-only validation.
      whyItMatters: The central investment thesis rests on verified migration for mission-critical code so buyers need to know how often the platform can actually satisfy the proof requirement in production.
      diligencePath: Request architecture review materials benchmark methodology and a customer-facing proof report example that shows pass-fail categories and escalation paths.
      relatedQuestionRefs: [QE011, QE028]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: security-compliance-surface
      missingEvidence: Named security certifications uptime commitments public trust-center materials or a status page tied specifically to the product rather than the marketing site.
      whyItMatters: Defense and regulated buyers will likely require operational controls that go beyond a generic website privacy policy before trusting translation workflows with sensitive code.
      diligencePath: Request SOC 2 or ISO artifacts if they exist ask whether any FedRAMP or IL-aligned environments are available and ask for security architecture documentation covering tenant isolation and model-data handling.
      relatedQuestionRefs: [QE023, QE024]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: deployment-docs
      missingEvidence: Public or private API references CI/CD integration docs on-prem reference architecture and a supported-runtime matrix that names exactly what environments are production-ready.
      whyItMatters: Hiring suggests meaningful implementation support but the absence of product documentation makes it hard to separate mature platform capabilities from services-heavy custom delivery.
      diligencePath: Request solution-architecture decks deployment runbooks and example implementation plans from a recent customer rollout.
      relatedQuestionRefs: [QE019]
      relatedTableRefs: [TE001, TE003]
    - type: missing-source
      severity: material
      topic: benchmark-coverage
      missingEvidence: A broader benchmark suite covering failure rates solver timeouts verification pass rates and performance outcomes across more hardware languages and code complexity classes.
      whyItMatters: Selective success cases are directionally helpful but do not tell an investor or buyer how robust the platform is across the long tail of real legacy or parallel codebases.
      diligencePath: Ask for benchmark methodology negative cases and customer anonymized before-and-after metrics segmented by source language target backend and code complexity.
      relatedQuestionRefs: [QE017, QE025, QE026, QE028]
      relatedTableRefs: [TE002, TE004]
    - type: private-evidence-only
      severity: material
      topic: production-operating-model
      missingEvidence: Reference deployments showing what roles humans still play in prompt engineering proof review optimization override and deployment sign-off for mission-critical programs.
      whyItMatters: The hiring surface implies a non-trivial service and support layer; without seeing that operating model it is difficult to price margin scalability or adoption friction.
      diligencePath: Interview a delivery lead or customer solutions architect and review one completed implementation timeline including human touchpoints and customer staffing requirements.
      relatedQuestionRefs: [QE018, QE019, QE027]
      relatedTableRefs: [TE001, TE005]
