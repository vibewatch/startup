  - id: architecture-lineage-and-operating-model
    title: Architecture, Lineage, and Operating Model
    body: >-
      Public materials support a layered architecture even though Code Metal has not published a full system design.
      The visible layers are developer intake in the IDE, runtime and dependency analysis, a translation planner,
      generation backends for CPU, GPU, and FPGA outputs, a verification layer that claims functional-equivalence or
      safety checks, and an optimization layer that trades among runtime, memory, code size, and power. Series B and
      Salesforce Ventures materials explicitly call the stack neuro-symbolic, which is consistent with the seed-stage
      description of formal-methods-based analysis combined with custom coding models. The research lineage underneath
      that posture is unusually explicit for a startup: current product messaging ties to LLMLift, while company research
      also admits that earlier verified-lifting work such as Tenspiler exposed scaling and manual-rule limits.
      Independent technical pages for Metalift, Alvin Cheung, and Loris D'Antoni reinforce that Code Metal is drawing
      from real program-synthesis and formal-specification traditions rather than relying only on frontier-model
      marketing. The upside is a differentiated trust story; the caution is that solver constraints, specification
      design, and workload scoping probably remain material parts of real deployments.
