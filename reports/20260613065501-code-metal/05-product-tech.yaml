company:
  name: Code Metal
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Code Metal publicly describes a workflow-first code-translation system for mission-critical software: engineers load
    high-level source, define the target runtime, generate a transpilation and deployment plan, verify the output,
    optimize for the target environment, and then track manual changes back to the source. The product and research
    surfaces support a real neuro-symbolic and formal-methods lineage, but public evidence still leaves important open
    questions around proof coverage, security posture, and how much human or solver intervention is required at scale.
sections:
  - id: product-workflow-in-customer-terms
    title: Product Workflow in Customer Terms
    body: >-
      Code Metal's public product surface is unusually specific about workflow. The company does not position itself as
      a generic code assistant that writes snippets on demand. Instead, the product page asks an engineer to start from
      an existing high-level codebase, load that code through a Code Metal IDE plugin, let the system track module and
      library dependencies, and then define the runtime environment that the output must satisfy. Only after the user
      specifies the CPU, accelerator mix, resource constraints, and preferred toolchains does the system generate a
      transpilation and deployment plan. That sequencing matters because the product is really a migration-and-portability
      workflow, not only a model. Translation, verification, optimization, build targeting, and change tracking are
      presented as one loop for teams that cannot accept silent regressions. Official and investor materials keep tying
      this workflow to defense, aerospace, semiconductor, automotive, and other regulated settings where correctness,
      compliance, and hardware portability matter as much as raw coding speed.
