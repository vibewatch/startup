  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: The public workflow runs from high-level source intake through runtime definition generation verification deployment and human change tracking.
    data:
      nodes:
        - id: n1
          label: Load high-level source
          detail: Engineer imports Python Matlab or Julia reference code inside a Code Metal IDE plugin.
        - id: n2
          label: Scan dependencies and equivalents
          detail: System tracks module and library dependencies and finds lower-level language equivalents.
        - id: n3
          label: Define runtime target
          detail: User selects CPU GPU FPGA resources and preferred build toolchains.
        - id: n4
          label: Generate translation plan
          detail: Agentic workflow prepares the transpilation and deployment plan for the chosen environment.
        - id: n5
          label: Produce target variants
          detail: Backends emit C/C++ Rust HDL CUDA HIP or related outputs depending on the target.
        - id: n6
          label: Verify and validate
          detail: Proof or validation layers check behavioral preservation and selected safety properties.
        - id: n7
          label: Build and deploy
          detail: Chosen variant is compiled or synthesized for the target environment.
        - id: n8
          label: Track human edits
          detail: Manual optimization changes are mapped back to the input code and annotations.
      edges:
        - {from: n1, to: n2}
        - {from: n2, to: n3}
        - {from: n3, to: n4}
        - {from: n4, to: n5}
        - {from: n5, to: n6}
        - {from: n6, to: n7}
        - {from: n7, to: n8}
    approximationNotes: This is a direct synthesis of the product-page sequence; public sources do not expose conditional branches such as proof failures solver timeouts or manual review gates.
