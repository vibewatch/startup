- id: TO003
  title: Stakeholder or Investor Map
  columns:
  - Stakeholder
  - Role
  - Control / economic importance
  - Diligence ask
  rows:
  - - Salesforce Ventures
    - Series B lead investor
    - Led the $125M Series B at the $1.25B valuation and likely has meaningful influence on later-stage financing expectations.
    - Confirm ownership, board or observer rights, and whether Salesforce ecosystem access is contractual or purely relational.
  - - Accel
    - Series A lead; Series B participant
    - Anchors the first large-scale institutional round and appears again in the B, signaling continuity and reserve support.
    - Verify current ownership, follow-on behavior, and any governance rights carried from the Series A.
  - - Shield Capital
    - Seed lead investor
    - Early defense-oriented backer that framed the company around national-security and mission-critical software relevance.
    - Clarify pro rata rights, defense-network support, and whether Shield still shapes go-to-market introductions.
  - - J2 Ventures
    - Pre-seed lead; later participant
    - Earliest disclosed institutional sponsor, important for cap-table history and defense-ecosystem connectivity.
    - Request original terms, ownership dilution path, and any special information or protective rights.
  - - RTX / RTX Ventures
    - Strategic investor and named customer overlap
    - Most visible overlap between financing and commercial proof because RTX is both on the cap table and in the public customer list.
    - Test how much customer proof is independent of investor influence and whether RTX has procurement, pilot, or reference constraints.
  - - Bosch Ventures
    - Strategic Series A investor
    - Brings industrial adjacency and could support automotive or embedded-system credibility, but operating overlap is not publicly described.
    - Ask whether Bosch is a customer, design partner, channel, or purely financial investor.
  - - Overmatch VC
    - Defense-focused investor
    - Signals alignment with defense and deep-tech procurement circles rather than only generalist software capital.
    - Clarify whether Overmatch provides customer access, recruiting support, or government-program introductions beyond capital.
  - - Smith Point Capital
    - Enterprise software investor
    - Adds enterprise-operator brand signal to a syndicate otherwise heavy in defense and technical-specialist capital.
    - Determine whether support extends to enterprise go-to-market, hiring, and later-stage financing strategy.
