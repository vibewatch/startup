company:
  name: Code Metal
chapter:
  number: 1
  title: Company Overview
  summary: Code Metal is a Boston-anchored private Series B software company founded in 2023 that sells verifiable code translation for mission-critical systems. Public evidence strongly supports the disclosed financing path from $3.45 million pre-seed and $13 million seed through a $36.5 million Series A and $125 million Series B at a $1.25 billion valuation, but public disclosure is still thin on exact headcount, audited revenue, full governance, and how much of the valuation narrative rests on independent operating proof versus company and investor materials.
sections:
- id: identity-product-and-footprint
  title: Identity, Product, and Operating Footprint
  body: "Code Metal presents itself as a software infrastructure company for environments where correctness matters more than speed alone. Its homepage says the mission is to make AI trustworthy and describes the offering as verifiable code translation for industries where every line of code matters, while the product page shows configuration around CPUs, GPUs, FPGAs, toolchains, and resource limits rather than a generic chat-style coding assistant. The official research pages reinforce that positioning by arguing that testing is insufficient for mission-critical software and that formal methods plus LLMs can produce code that is both generated and proved. Public category messaging shifted over time: the July 2024 seed announcement described AI-powered development workflows for the edge, while the later Series A and Series B materials more clearly framed the company around provably correct or verifiable code translation. The industry focus is also consistent across sources, centering defense,\
    \ automotive, semiconductor, industrial, and robotics workloads. Headquarters evidence is strongest for Boston: the Series B announcement is datelined Boston, Geekwire calls the company Boston-based, and SEC search results show a Boston business address. At the same time, the careers page and investor materials imply a distributed footprint across Boston, San Francisco, remote roles, and possibly Washington, D.C., so the operating organization looks more distributed than a single-office label suggests."
