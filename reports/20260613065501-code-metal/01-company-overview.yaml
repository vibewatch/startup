  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, investor-rights summary, and ownership/control overview.
    whyItMatters: Without formal governance disclosure, it is difficult to assess oversight, control concentration, and how much authority the new COO actually has.
    diligencePath: Request the current board deck, cap-table summary, and any board-observer or protective-provision schedules from the company.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Independent evidence for current revenue, ARR, backlog quality, and how much of the eight-figure claim converted into realized recurring revenue.
    whyItMatters: The valuation case relies in part on growth narrative, but public sources do not show audited or independently checked commercial performance.
    diligencePath: Obtain monthly revenue bridge data, major contract summaries, and auditor or board-reported KPI packs for 2025-2026.
    relatedQuestionRefs:
    - QO018
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An exact current employee count and functional breakdown by engineering, research, go-to-market, and operations.
    whyItMatters: Hiring velocity is visible, but current organizational scale is not, limiting assessment of burn, delivery capacity, and management span.
    diligencePath: Request an HRIS employee census or payroll-backed headcount snapshot as of the diligence date.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: forbes-coverage-timing
    missingEvidence: The underlying Forbes article URL and publication date for the company's retained Forbes landing page.
    whyItMatters: The page is a weaker milestone anchor without metadata, so it should not be used as a dated market-validation event.
    diligencePath: Retrieve the original Forbes article link or CMS metadata directly from Code Metal's communications team.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: financing-structure
    missingEvidence: Any public disclosure of venture debt, secondaries, liquidation-preference terms, or structured financing components beyond the named rounds.
    whyItMatters: Public round sizes alone do not show whether headline capital maps cleanly to primary cash, founder liquidity, or embedded downside protections.
    diligencePath: Request round term sheets, Form D attachments if any, and a capital-stack summary from counsel or finance leadership.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO003
