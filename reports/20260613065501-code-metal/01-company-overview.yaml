- id: public-scale-signals-milestones-and-evidence-gaps
  title: Public Scale Signals, Milestones, and Evidence Gaps
  body: "Public scale evidence is directionally positive but still incomplete. The strongest externally visible customer proof is qualitative rather than quantitative: by February 2026, Code Metal and its BusinessWire release named Toshiba, RTX, L3Harris, and the U.S. Air Force as customers using the product to move between languages and optimize for hardware. At Series A, the company also claimed it was already on contract to deliver eight figures in revenue that year, but there is no public audited revenue, ARR, customer-count, or margin disclosure in the retained sources. Headcount is similarly opaque. A July 2024 launch story said the company employed seven people at that stage, and the current careers page lists at least 17 named openings across engineering, research, operations, finance, and solutions, but there is no verified current employee total. The milestone record is still strong enough to sketch a chronology: a 2023 founding, December 2023 Form D presence, July 2024 seed disclosure,\
    \ a March 2025 USSOCOM-linked hackathon, November 2025 Series A coverage, and February-March 2026 Series B announcement plus Form D filing. The main caution is analytical rather than legal. Wired explicitly noted that methodologies in AI code tooling remain unproven and that investors are making category bets, while Code Metal’s own valuation and growth narrative depends heavily on company announcements, investor theses, and picked-up press. The company also maintains undated landing pages for Forbes and Wired coverage, but the retrieved text does not expose publication metadata, so those are weaker milestone anchors than dated filings and financing stories."
