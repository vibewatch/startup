  - id: evidence-gaps-and-financial-verdict
    title: 'Evidence gaps and financial verdict: analytically positive, still too opaque for clean underwriting'
    body: >-
      The chapter's central evidence gap is straightforward: Code Metal has more public demand proof than public
      financial proof. The retained sources are good enough to support a bullish narrative on value proposition,
      contract relevance, customer quality, and investor appetite, but they stop short of the metrics required for
      conventional underwriting. There is no public ARR, no customer-count denominator behind the named logos, no
      disclosed gross margin, no burn, no cash balance, no contract-value detail, and no revenue split between
      platform, professional services, and government program work. That makes it impossible to tell from public
      evidence whether the company is already converging toward a scalable software model or still monetizing mostly
      through bespoke translation engagements.

      Adverse evidence does not disprove the business, but it does constrain confidence. Wired explicitly noted that
      methodologies in AI code tooling remain unproven and that investors are gambling that some picks-and-shovels
      vendors will work. Public customer proof also remains concentrated in a short disclosed logo list, while one of
      those logos—RTX—sits on both the customer and investor side. Programs-of-record language is encouraging, but no
      retained source quantifies backlog, award dollars, or win rates. The company therefore deserves credit for
      credible traction signals, but not for financial metrics it has not disclosed.

      The evidence-constrained verdict is that Code Metal likely has real early revenue, real enterprise and government
      demand, and real runway support after the $125 million Series B. The margin path could become attractive if
      translation, verification, and hardware-portability workflows are turning into reusable software rather than
      one-off engineering programs. But that upside remains a diligence hypothesis, not a public fact. Until management
      provides revenue mix, realized pricing, gross margin, burn, cash, and cohort-level customer data, the prudent
      financial stance is analytically constructive but underwriting-incomplete.
