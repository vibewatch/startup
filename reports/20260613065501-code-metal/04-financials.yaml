  - id: TI006
    title: Public financial gaps table
    columns:
      - missing private metric or proof
      - impact on judgment
      - exact diligence path
    rows:
      - - ARR and recurring-software revenue split
        - Without this, public contract claims cannot be translated into repeatable software quality
        - Request monthly recurring revenue bridge split among platform, services, and government program revenue
      - - Gross margin by product and services
        - Margin path is the main test of whether Code Metal is becoming software-led
        - Request gross margin by product line, services line, and cohort vintage
      - - Burn and current cash balance
        - Runway cannot be underwritten from raise size alone
        - Request latest balance sheet, 13-week cash forecast, and trailing 12-month cash flow statement
      - - Realized pricing and contract economics
        - No public source discloses ACV, discounts, usage assumptions, or verification uplift
        - Review three representative customer contracts with pricing schedules and renewal terms
      - - Customer concentration and cohort expansion
        - A short public logo list may hide concentration risk or weak pilot-to-platform conversion
        - Request top-10 customer concentration, logo retention, and expansion by cohort
      - - Services-to-platform conversion
        - The biggest business-model risk is staying stuck in labor-heavy custom migration work
        - Request revenue mix by delivery phase and evidence that repeat deployments need less custom engineering
      - - Government backlog and award value
        - Programs-of-record language is encouraging but not financially quantifiable
        - Request funded backlog, remaining performance obligations, and contract vehicle detail
      - - Debt, guarantees, and working-capital obligations
        - Undisclosed financing structure can change true runway and downside risk
        - Request debt schedule, covenants, guarantees, and any customer prepayment or milestone-payment obligations
    notes: >-
      These gaps are the specific blockers preventing a cleaner public-only underwriting case. Every item has a
      concrete diligence path rather than a generic request for more data.
