  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: ARR, revenue mix, realized contract values, and revenue recognized by quarter.
      whyItMatters: Without these numbers, public contract claims cannot be converted into repeatable software-revenue quality.
      diligencePath: Request monthly revenue by product line, services line, and customer cohort under NDA.
      relatedQuestionRefs:
        - QI001
        - QI013
        - QI014
      relatedTableRefs:
        - TI001
        - TI002
        - TI006
    - type: private-evidence-only
      severity: material
      topic: margin-path
      missingEvidence: Gross margin, services gross margin, customer-specific implementation effort, and cohort-level delivery cost trends.
      whyItMatters: The central underwriting debate is whether Code Metal is becoming a scalable software business or staying services-heavy.
      diligencePath: Request gross margin by product and services plus implementation hours by deployment phase.
      relatedQuestionRefs:
        - QI010
        - QI011
        - QI015
        - QI024
      relatedTableRefs:
        - TI004
        - TI006
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, runway, and any debt or customer-prepayment obligations.
      whyItMatters: Raise size alone cannot prove runway or next-round timing.
      diligencePath: Request latest balance sheet, 13-week cash forecast, debt schedule, and trailing 12-month cash flow statement.
      relatedQuestionRefs:
        - QI016
        - QI017
      relatedTableRefs:
        - TI005
        - TI006
    - type: missing-source
      severity: material
      topic: government-backlog-gap
      missingEvidence: Independent public evidence quantifying award dollars, funded backlog, or contract win rates for government programs.
      whyItMatters: Programs-of-record language is encouraging but does not show the financial size or durability of the government book.
      diligencePath: Request contract vehicle detail, funded backlog, remaining performance obligations, and any public procurement references management can share.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI003
        - TI005
        - TI006
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Customer count, top-customer revenue concentration, and pilot-to-production conversion data.
      whyItMatters: A short public logo list can coexist with either strong enterprise traction or fragile concentration risk.
      diligencePath: Request top-10 revenue concentration, logo retention, and cohort expansion by segment.
      relatedQuestionRefs:
        - QI021
        - QI024
      relatedTableRefs:
        - TI003
        - TI006
