figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Public evidence suggests Code Metal turns repository-specific migration and verification work into enterprise or
      government contracts, but the public record stops before realized pricing or recurring-software mix is visible.
    data:
      nodes:
        - id: legacy-codebase
          label: Legacy or AI-generated codebase
          detail: Customer starts with code that must move across languages, architectures, or safety constraints.
          tone: neutral
        - id: translation-plan
          label: Translation and hardware-targeting plan
          detail: Static analysis, target-hardware setup, and repository segmentation define the migration scope.
          tone: positive
        - id: verification-gate
          label: Verification and validation gate
          detail: Proof-oriented checks and production-readiness validation are the trust layer buyers are paying for.
          tone: positive
        - id: customer-deployment
          label: Deployment on customer hardware
          detail: Output must run on CPUs, GPUs, FPGAs, or other target environments with buyer-specific constraints.
          tone: neutral
        - id: contracted-revenue
          label: Enterprise or government contract revenue
          detail: Revenue is visible through named customers and contract claims, but contract values and recurrence are undisclosed.
          tone: positive
        - id: margin-outcome
          label: Margin outcome depends on repeatability
          detail: Gross profit improves only if delivery becomes reusable software rather than repeated bespoke engineering.
          tone: warning
      edges:
        - from: legacy-codebase
          to: translation-plan
        - from: translation-plan
          to: verification-gate
        - from: verification-gate
          to: customer-deployment
        - from: customer-deployment
          to: contracted-revenue
        - from: contracted-revenue
          to: margin-outcome
    approximationNotes: >-
      This is a qualitative bridge, not a quantified waterfall. The retained public record is strong on what buyers
      purchase and weak on what they pay or how revenue is recognized.
