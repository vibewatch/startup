  topStrengths:
    - >-
      Verification-first code translation for mission-critical and hardware-specific software is a clear wedge versus
      generic coding assistants.
    - >-
      Public evidence supports real customer relevance with named accounts including RTX, L3Harris, Toshiba, and the
      U.S. Air Force.
    - Financing momentum is exceptional, moving from seed through a $125M Series B in under two years.
    - Founder-market fit is strong, with technical leadership tied to MIT Lincoln Laboratory and defense software.
  topRisks:
    - >-
      The $1.25B valuation moved far ahead of public operating disclosure, leaving ARR, gross margin, and retention
      opaque.
    - >-
      Public customer proof is concentrated in a short, defense-heavy logo set with limited independent case studies or
      procurement records.
    - >-
      Hiring and role mix imply a high-touch delivery burden, so the services-to-platform transition is not yet clearly
      proven.
    - >-
      Mission-critical deployments face certification, security, and procurement friction that can slow revenue
      recognition and expansion.
  unresolvedGaps:
    - ARR, gross margin, revenue mix, burn, and cash runway remain undisclosed.
    - Customer count, retention, contract duration, and concentration by account are still not public.
    - >-
      Series B terms beyond headline size and valuation, including preferences, secondary mix, and debt, are not
      disclosed.
    - >-
      Independent proof of contract values, programs-of-record status, and repeat deployment economics is still
      incomplete.
