      - number: '4.5'
        title: 证据缺口与财务结论：分析上偏正面，但仍过于不透明，难以干净承销
        blocks:
          - type: paragraph
            body: >-
              本章的核心证据缺口很直接：Code Metal 的公开需求证明多于公开财务证明。保留来源足以支持一个看多价值主张、合同相关性、客户质量和投资人胃口的叙事，但没有达到传统承销所需指标。没有公开 ARR，没有具名
              logo 背后的客户数分母，没有披露毛利率、烧钱速度、现金余额、合同金额细节，也没有平台、专业服务和政府项目工作的收入拆分。因此，仅凭公开证据无法判断公司是否已经向可扩展软件模式收敛，还是主要靠定制翻译项目变现。

              反向证据没有否定业务，但限制了信心。Wired 明确指出，AI 代码工具方法论仍未证明，投资人是在押注某些 picks-and-shovels 供应商会跑出来。公开客户证明也集中在一个很短的披露 logo
              清单中，其中一个 logo——RTX——同时位于客户和投资人两侧。Programs-of-record 语言令人鼓舞，但保留来源没有量化
              backlog、合同金额或胜率。因此，公司应因可信牵引力信号获得认可，但不能因未披露的财务指标获得信用。

              受证据约束的结论是：Code Metal 很可能已有真实早期收入、真实企业和政府需求，并在 $125 million Series B
              后获得真实现金跑道支持。如果翻译、验证和硬件可移植性工作流正在变成可复用软件，而不是一次性工程项目，利润率路径可能变得有吸引力。但这个上行仍是尽调假设，不是公开事实。在管理层提供收入结构、已实现定价、毛利率、烧钱速度、现金和队列级客户数据之前，审慎的财务立场应是分析上建设性，但承销仍不完整。
