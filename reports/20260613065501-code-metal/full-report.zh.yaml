  - id: TR006
    title: 缓解与叫停标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 合规负担跑过交付速度
        - 有证据显示发布延迟或交易滑延与 AI Act、认证或安全审查有关
        - 两个或更多旗舰部署滑延，因为信任或合规工作压过了翻译速度收益
        - 重新承保受监管部署中的产品契合度，并在投资前要求合规路线图
      - - 可靠性主张仍未证明
        - 尽调中管理层无法提供生产通过率、回滚或缺陷逃逸数据
        - 具名客户项目没有部署质量评分卡
        - 将信任主张视为营销驱动，并降低对平台可扩展性的信心
      - - 客户集中度延续
        - 下一轮融资周期之后，公开客户名单实际上没有变化
        - 没有从少数具名国防或工业客户扩展出去
        - 假设收入集中，并下调终局倍数
      - - 服务负担占主导
        - 单次部署需要的实施或支持投入，相对合同价值仍然偏高
        - 前置部署或解决方案团队人数与工程和收入同步增长
        - 放慢毛利率扩张模型，并质疑其能否转成软件平台
      - - 指标追上前融资先重定价
        - 下一轮融资或老股信号把公司价格显著压到 Series B 隐含预期之下
        - 在公开 KPI 没有改善时出现下轮、平轮或内部估值压力
        - 避免被动接受价格，重新检验投资逻辑在公开证据质量下是否仍成立
      - - 关键人物或研究能力流失
        - 创始人、COO 或可见研究关联人离职，且继任安排不清楚
        - 离职后一个季度内没有具名技术或商业继任者
        - 暂停投资，或要求治理与留任保护
    notes: 这些是投资人监控触发项，不是法律义务。它们用来提示：当信任、交付和证明假设不再滚成可扩展平台故事时，风险已经浮出水面。
    claimRefs:
      - CR045
      - CR046
      - CR047
      - CR048
      - CR049
      - CR050
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 视角
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 继续研究
        - 公开证据证明产品、客户和融资真实存在，但还没证明 $1.25B 估值背后的 KPI 桥。
        - 不能只靠公开数据按买入来承销。
      - - 置信度
        - 中
        - 核心融资事实得到交叉验证，但经济性、集中度和条款仍是私有信息。
        - 只有拿到管理层数据后才继续推进。
      - - 风险评级
        - 高
        - 估值不透明、服务收入混合风险和集中度风险仍然存在。
        - 建模时把实质下行情景与上行情景并列。
      - - 估值立场
        - 昂贵
        - 当前价格已经计入平台化结果，但公开证据还没证明这一点。
        - 要么入口价格更低，要么 KPI 证明更强。
      - - 入场纪律
        - 严格
        - 先索取 ARR、毛利率、客户集中度、积压订单和股权结构表细节，再决定是否从跟踪推进。
        - 没有这套材料，就不能在当前估值下做领投支票。
    notes: 本表总结投资判断，不是可销售性评分。当前估值是公开的，运营指标却不公开，因此判断对价格高度敏感。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 市场
        - 任务关键型现代化与验证可以在更大的软件预算里切出一个有意义的楔子。
        - 这个楔子可能太窄，或服务属性太重，撑不起顶级平台估值。
        - 证明公司能在多个独立客户和行业里重复扩张。
      - - 产品
        - 以形式化验证为核心的翻译和硬件可移植性，相比通用编程助手看起来有差异化。
        - 采购触达更强的既有厂商或更宽的平台捆绑，可能会削弱差异化价值。
        - 提供验证能力成为决定性购买标准时的赢单 / 输单数据。
      - - 客户
        - 具名客户表明产品能进入高风险环境。
        - 公开客户名单很短，可能掩盖集中度，也可能让投资人关联证明的质量打折。
        - 披露客户数、头部客户占比，以及试点转生产的转化率。
      - - 财务
        - 八位数合同表述暗示早期已有真实需求。
        - 没有公开 ARR、毛利率、烧钱速度或收入结构，无法判断这是不是可扩展软件。
        - 打开 KPI 包，并展示由软件驱动的毛利率改善。
      - - 竞争
        - 完全对标的同类公司有限，有利于品类领导者出现。
        - 邻近平台、既有厂商和服务型主承包商都可能吸收同一笔预算。
        - 证明公司能明确替换既有厂商和内部自建方案。
      - - 融资
        - 顶级投资人多次以更高价格下注这个故事。
        - 轮次推进很快，也可能意味着叙事跑在公开证据前面，并抬高未来预期。
        - 给出与下一轮融资或现金流拐点挂钩的里程碑。
    notes: 每行把最强的建设性判断与证据支撑最强的反论放在一起。关键问题不是公司好不好，而是当前价格是否已经把好结果计入了。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV023
      - CV024
      - CV036
      - CV041
      - CV042
      - CV044
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间（USD B）
      - 概率信号
      - 下行或验证触发项
    rows:
      - - 乐观
        - 管理层展示经审计增长、软件驱动的毛利率、多元客户，以及翻译工作流被明确复用。
        - 1.5-2.4
        - 可能发生，但不是默认情景；需要新的 KPI 披露和产品杠杆证明。
        - 由经审计 ARR、毛利率和扩张数据验证。
      - - 基准
        - 需求仍然真实，但经济性看起来仍混合了产品和高接触交付。
        - 0.9-1.4
        - 按现有证据最可能，因为融资比变现深度更清楚。
        - 若积压订单增长，但 SaaS 式质量指标仍只部分可见，则该情景成立。
      - - 悲观
        - 市场降温、服务强度仍高，或客户集中度和采购摩擦阻碍规模化。
        - 0.4-0.8
        - 这是实质风险，因为公开投资故事仍比披露经济性更依赖叙事。
        - KPI 披露偏弱、增长持平，或出现平轮 / 下轮融资时触发。
    notes: 这些是按里程碑划分的情景区间，不是直接收入倍数输出。由于公开收入和毛利率数据缺失，区间有意设得较宽。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Snyk
        - 开发者安全平台，ARR 为 $300M，2024 年收入为 $278M
        - 最近披露的私有估值为 $7.4B；仍未上市，也不急于 IPO
        - 可作为有可见收入、已规模化开发者平台的上限参照。
        - 安全产品范围更宽，阶段更晚，披露指标也明显多于 Code Metal。
      - - Sonar
        - 覆盖全球的代码质量平台
        - 2022 年以 $4.7B 估值融资 $412M；明确目标是冲向 $1B 收入
        - 展示更宽的代码清洁平台在规模可见时能拿到什么估值。
        - 不是任务关键型翻译公司；估值较旧，品类宽度也更大。
      - - Diffblue
        - AI 代码测试专门公司
        - 尽管新增 ARR 净增长 326%，2024 年仍只融资 $6.3M
        - 可作为窄 AI 代码工具在较小规模阶段的私有参照。
        - 测试工作流更窄，融资规模更多说明阶段，而不是 Code Metal 的具体经济性。
      - - IBM
        - 上市现代化既有厂商
        - 拥有广泛 AI 与现代化技术栈的上市企业；不作为直接倍数使用
        - 相关性在于，大客户可以通过既有平台满足类似需求。
        - 规模、装机基础和上市公司属性，让直接估值比较不合适。
      - - Booz Allen / SAIC
        - 联邦 AI 和任务 IT 既有厂商
        - 服务属性重的上市既有厂商；是方向性预算竞争者，不是直接价格可比对象
        - 重要性在于，它们可以通过既有采购渠道赢下同一类现代化预算。
        - 服务经济性和联邦合约结构，与风险投资软件预期差异很大。
      - - GrammaTech / Galois
        - 高保障专门公司
        - 长期积累保障记录的私有专门公司，但没有公开风险投资定价标尺
        - 与受监管环境中的信任可信度和替代风险相关。
        - 缺少披露估值数据，只能作为定性边界标记。
    notes: 这是一组方向性边界，不是干净的可比公司篮子。每行都服务一个特定视角——平台规模、AI 代码工具窄度、保障可信度或预算归属。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public, private, incumbent, and assurance-style references visible in retained sources
        for Code Metal’s mission-critical code-translation wedge as of the 2026 run date.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 门槛或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经常性软件收入仍未证明
        - 管理层无法在下一次融资事件前展示 ARR、收入结构或毛利率改善。
        - 乐观情景坍塌，因为产品杠杆仍是假设。
        - 停止推进，或按大幅更低估值重新承销。
      - - 客户集中度过高
        - 一两个账户贡献了过高的收入或积压订单占比。
        - 具名客户证明变得脆弱，估值耐久性下降。
        - 按集中承包商风险处理，而不是平台风险。
      - - 投资人关联证明占主导
        - 大量标杆收入来自 RTX 等投资人邻近客户。
        - 参考客户质量下降，独立需求看起来更薄。
        - 投资前要求更多独立客户证明。
      - - 服务强度仍高
        - 交付仍依赖重度前置部署或定制工程。
        - 毛利率和可扩展性假设转向技术服务结果。
        - 下调上行情景，并扩大悲观情景概率。
      - - 采购转化停滞
        - 试点或正式项目没有转成不断增长的已资助部署。
        - 即便技术相关，商业化逻辑也会削弱。
        - 转为仅跟踪姿态。
      - - 下一轮平轮或防御性融资
        - 后续融资没有越过当前估值，或附带重结构。
        - 证实估值跑在证据前面的担忧。
        - 视为投资逻辑破裂，或对价格预期做硬重置。
    notes: 这些触发项可监控，并直接映射到估值故事。设计它们是为了阻止乐观情绪跑在证据前面。
    claimRefs:
      - CV030
      - CV033
      - CV037
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入质量
        - ARR、确认收入，以及软件与服务拆分后的收入结构
        - 这是客户标识与平台估值之间缺失的桥。
        - 要求 CFO 或董事会报告包，并附样本客户 P&L。
      - - 毛利率路径
        - 当前毛利率，以及按产品和服务拆分的毛利率
        - 决定 Code Metal 是像软件一样扩张，还是像定制交付一样扩张。
        - 与财务负责人复核财务模型和队列经济性。
      - - 现金与烧钱
        - 当前现金、季度烧钱速度和现金跑道假设
        - 说明 Series B 是否买到了足够时间，在下一轮融资前证明可重复性。
        - 要求最新资产负债表、现金预测和董事会现金跑道计划。
      - - 股权结构表与优先权
        - Series A/B 条款、清算优先权、老股交易、债务和 pro rata 权利
        - 如果结构很重，头部估值可能夸大真实回报潜力。
        - 复核融资文件和完整股权结构表。
      - - 客户集中度
        - Top-10 客户占比和投资人关联收入占比
        - 验证当前需求证明的独立性和耐久性。
        - 要求队列表和客户集中度明细。
      - - 积压订单与转化
        - 已资助积压订单、续约情况，以及试点转生产的转化率
        - 把令人鼓舞的客户标识与可持续变现区分开。
        - 按账户复核管线和积压订单。
      - - 竞争替换
        - 相对 IBM、Snyk、Sonar、服务型主承包商和内部自建的赢单 / 输单证据
        - 同时提高上行概率和护城河耐久性的判断精度。
        - 复核采购材料、匿名输单记录和客户推荐。
      - - 复用证明
        - 后续项目比早期项目需要更少定制工程的证据
        - 这是软件杠杆和毛利率扩张的核心。
        - 复核实施周期、可复用模块，以及按部署批次划分的毛利率队列。
    notes: 每个问题都对应具体承销不确定性，而不是泛泛好奇。如果管理层无法回答，当前估值就只能作为跟踪项，而不能形成投资确信。
    claimRefs:
      - CV035
      - CV038
      - CV039
      - CV040
      - CV041
