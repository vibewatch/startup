  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开价格支撑
        blocks:
          - type: paragraph
            body: >-
              Code Metal 确实有融资动能，但公开材料对价格的支撑仍不完整。最强硬事实很直接：公司在 2025 年 11 月披露以 $250 million 估值完成 $36.5 million Series
              A，随后在 2026 年 2 月以 $1.25 billion 估值完成 $125 million Series B。也就是说，仅几个月估值就大约涨了五倍；从 pre-seed、seed、Series A 到
              Series B，可见融资约 $177.95 million。具名客户和任务关键定位让这次跃迁可以理解，SEC Form D
              轨迹也支持快速融资节奏。问题不是价格不可能，而是公开证据尚未展示运营桥梁。保留来源没有披露 ARR、毛利率、烧钱速度、现金、留存、客户数量或股权结构表悬挂条款。因此，公开支撑主要来自投资人质量、客户 logo
              和叙事信念，而不是通常能让 $1.25 billion 私有市场标记显得耐久的 KPI 包。这使本章更应采用情景逻辑和入场纪律，而不是英雄式倍数数学。
