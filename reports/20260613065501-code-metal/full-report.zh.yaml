  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：高保障现代化，不是通用 copilots
        blocks:
          - type: paragraph
            body: >-
              Code Metal 应归入面向任务关键型软件的 AI 驱动代码现代化、翻译和验证市场，而不是宽泛的通用开发者 copilots 市场。它的产品界面要求用户指定
              CPUs、GPUs、FPGAs、工具链和运行时资源限制；研究页面则认为，当软件控制航空电子、半导体工具、自主系统、嵌入式设备或受监管基础设施时，单靠测试不够。公司和投资人叙事在切入点上保持一致：几十年前用
              C、C++、MATLAB、ADA、CUDA 和其他遗留或硬件耦合形式写成的代码，必须迁移到更新架构，同时不能牺牲正确性。


              这个边界比 AI coding
              更窄，也比一般应用现代化更窄。纳入的支出是用于翻译遗留代码、证明或验证行为、集成受限运行时，并生成能被安全、质量和认证相关方接受的证据的软件与工程预算。它包括国防嵌入式系统、航空航天和工业边缘控制器、半导体和加速器软件，以及其他重写失败代价很高的高风险环境。排除的支出包括全新软件开发、轻量代码补全工具，以及能提升编码速度但不能解决硬件可移植性或保障瓶颈的通用聊天式
              copilots。现状替代方案包括手工重写、专门的 kernel / compiler 团队、内部平台工程、静态分析和测试工具，以及既有保障供应商。
