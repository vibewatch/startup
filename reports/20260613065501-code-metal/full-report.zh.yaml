              年 3 月与 USSOCOM 相关的 hackathon、2025 年 11 月 Series A 报道，以及 2026 年 2-3 月 Series B 公告和 Form D
              备案。主要提醒是分析性的，而非法律性的。Wired 明确指出，AI 代码工具的方法论仍未被证明，投资人是在做品类押注；Code Metal 自身估值和增长叙事也高度依赖公司公告、投资人论点和转载媒体。公司还维护
              Forbes 与 Wired 报道的无日期落地页，但检索文本没有暴露出版元数据，因此这些里程碑锚点弱于有日期的备案和融资报道。
