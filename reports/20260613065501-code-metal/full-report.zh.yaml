  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图与最近替代项
        blocks:
          - type: paragraph
            body: >-
              买方不会用一个整齐的同业集合来评估 Code Metal。实际版图分成四类。第一类是高保障或形式化方法取向的同业，如 GrammaTech 和
              Galois，它们向国防和其他受监管环境销售软件保障、安全和高保障解决方案。它们在信任和验证姿态上是最近替代项，公开业绩记录也比 Code Metal 更长。GrammaTech 的公开 learn hub
              同样围绕网络安全和软件保障组织，而不是围绕代码翻译工作流。第二类是相邻 AI 代码质量工具，如 Diffblue、Snyk 和 Sonar。它们争夺同一工程预算的一部分，因为承诺更快生成测试、做静态分析或验证
              AI 时代代码，但其公开定位比 Code Metal 的「现代化加可移植性」叙事更窄。第三类是 IBM 等现代化既有厂商，可以把编码辅助包进更宽的治理型 AI 和应用现代化栈。第四类是 Booz
              Allen、SAIC 和内部工程团队等国防服务替代项，可以通过服务项目或定制构建推进现代化，而不是购买新的产品供应商。横跨这些群体，多数替代方案并不宣传 Code Metal
              强调的代码翻译、目标硬件可移植性和形式化验证组合。反向解读是，市场可能仍然更奖励既有地位、合同入口和装机基础，而不是功能新颖性。
