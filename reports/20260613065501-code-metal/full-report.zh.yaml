      - number: '5.2'
        title: 架构、谱系与运营模型
        blocks:
          - type: paragraph
            body: >-
              虽然 Code Metal 没有发布完整系统设计，公开材料仍支持一个分层架构。可见层包括 IDE 中的开发者输入、运行时和依赖分析、翻译规划器、面向 CPU、GPU 和 FPGA
              输出的生成后端、声称做功能等价或安全检查的验证层，以及在运行时间、内存、代码大小和功耗之间权衡的优化层。Series B 和 Salesforce Ventures 材料明确称这套栈为
              neuro-symbolic，这与种子阶段把形式化方法分析和定制 coding models 结合的描述一致。这种姿态背后的研究谱系，对创业公司来说异常明确：当前产品信息连接到 LLMLift，公司研究也承认
              Tenspiler 等早期 verified-lifting 工作暴露出扩展和手工规则限制。Metalift、Alvin Cheung 和 Loris D'Antoni 的独立技术页面进一步说明，Code
              Metal 来自真实的程序合成和形式化规范传统，而不是只靠 frontier-model 营销。上行是差异化信任故事；需要谨慎的是，solver 约束、规范设计和工作负载界定很可能仍是实际部署中的实质部分。
