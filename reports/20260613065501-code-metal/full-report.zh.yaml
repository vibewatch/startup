  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价姿态：合同可见度真实，但已实现经济性不可见
        blocks:
          - type: paragraph
            body: >-
              Code Metal
              的公开材料支持一种围绕企业和政府代码翻译项目建立的收入模式，而不是自助式开发者订阅。官网和产品页把产品定位为面向任务关键型行业的可验证代码翻译；产品界面强调硬件目标、工具链和部署约束，而不是公开席位价格。最强牵引力表述来自
              2025 年 11 月 Series A
              公告：公司称当年已经签约，将在国防、汽车和半导体部署中交付八位数收入。这是有意义的需求信号，但仍是合同交付主张，不是审计收入披露；公司也没有说明其中多少是经常性平台收入，多少是项目制翻译或集成工作。

              定价姿态因此同样不透明。官网和产品页都没有展示标价、套餐或已实现合同基准，保留来源也没有披露折扣、最低消费或按使用量计费条款。公开证据反而指向协商式企业和政府合同，可能先围绕代码库拆分、目标硬件、验证要求和部署支持做前期范围界定。研究页面和投资人论点也解释了买方为什么可能付费：Code
              Metal 卖的是跨异构硬件的可移植性，以及在软件失败可能触发召回、认证问题或任务失败的环境中以证明为导向的验证。即使定价模式未披露，价值主张仍然可读。

              主要收入质量风险在于结构。公开证据强烈显示客户会为高风险代码迁移和验证付费，但不足以证明这些收入已经像可重复软件收入那样运转。招聘前置部署和解决方案岗位，说明部分合同仍需要有意义的客户特定劳动。如果 Code
              Metal 能把这些工作流标准化成可复用翻译和验证模块，利润率可能显著改善；如果做不到，业务可能更接近包着自研工具的项目制技术服务。
