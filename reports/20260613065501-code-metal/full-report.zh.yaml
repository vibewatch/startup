        title: 参考客户风险：Logo 少、防务占比高、第三方验证薄，集中度风险仍高
        blocks:
          - type: paragraph
            body: >-
              反向情景并不是客户需求造假，而是可见证据狭窄、偏防务，并由利益相关方中介。同样四个名字——U.S. Air Force、L3Harris、RTX 和
              Toshiba——反复出现在官方新闻稿、投资人投资逻辑和二次传播报道中，独立客户证言仍很少。Code Metal 自己的公开表面主要由融资公告、研究文章和媒体放大帖组成，而不是成熟的客户故事库。这很重要，因为
              logo
              本身回答不了承销人最关键的问题：收入有多集中，公司拿的是主合同还是分包合同，续约表现如何，客户关系能否熬过最初迁移项目。采购摩擦也可能很重。政府和防务客户通常要求安全处理、正式保障和漫长采购周期；公开职位和新
              COO 入职都符合这一判断。保留下来的 USAspending 和 SAM 搜索页面提供了官方背景，但仍没有给出合同 ID、实体链条或中标金额，无法验证 Code Metal
              是否直接持有联邦合同。投资方与客户重叠进一步搅浑参考质量：RTX 既出资又是具名客户，J2 Ventures 和 Shield Capital
              又为外部叙事增加了更多伙伴所有的表面材料，却没有提供客户撰写的证明。净结论是：相关性可建设性看待，耐久性需谨慎。公开证据证明 Code Metal 已拿下可信参考客户；尚未证明客户经济分散、经独立验证且续约充足。
