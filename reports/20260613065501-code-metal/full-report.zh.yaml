  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险优先级与反向立场
        blocks:
          - type: paragraph
            body: >-
              Code Metal
              容易让人喜欢，却不容易承销。公开记录支持这样一家公司：它在失败代价很高的环境里解决真实现代化痛点，也显示出一家如此年轻的公司拥有异常强的融资速度。反向观点是，同一画像也集中放大了风险：这里的信任、认证和部署证明，比普通开发者工具更重要；而公司披露的运营证据，远少于
              $1.25 billion 估值所暗示的水平。


              因此，最关键的风险高于普通创业执行噪声。公司卖进任务关键场景，公开具名客户名单很短，并依赖“可验证翻译”的故事；但公开验证主要来自论文、投资人投资逻辑和公司材料，而不是现场可靠性指标。也就是说，最大风险不是没人关心，而是买家非常关心，却仍要求更多证明、更多服务和更多审批工作；当前估值未必充分折价了这些要求。


              因此，本章采取全报告中最强的反向立场：先假设需求存在，再问它能否在真实监管、采购和交付约束下复利成可重复的软件经济。如果尽调无法补上这些证据缺口，融资故事就跑在运营故事前面。
