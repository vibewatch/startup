      - number: '3.2'
        title: 能力宽度与验证姿态
        blocks:
          - type: paragraph
            body: >-
              能力比较的重点不是谁也提到 AI，而是各供应商在工作流中处在哪一环。Code Metal 营销的是面向指定运行环境的可验证代码翻译，包括不同 CPU
              和加速器目标，并用偏形式化验证的研究支撑这个故事。GrammaTech 和 Galois 在保障可信度上最接近，但公开材料以软件分析、网络安全、高保障解决方案和软件保障思想领导力开场，而不是 AI
              主导的异构转译。Diffblue 以企业单元测试生成为核心，公司材料强调自主测试编写和维护。Snyk Code 和 Sonar 面向广泛开发者群体，主打安全代码审查、静态分析和 AI 时代验证；SonarQube
              被营销为 AI 时代的代码验证。IBM 的 AI coding agent 和 watsonx Code Assistant 从相反方向竞争：不是靠深入的 proof-first
              信息，而是靠企业现代化宽度、治理型 AI，以及与既有基础设施的集成。这意味着 Code Metal
              的精确功能组合看起来有差异化，但也意味着公司必须证明买方足够在意翻译正确性和硬件可移植性，愿意选择更专门的产品，而不是接受更宽但不那么专注保障的既有厂商，或更窄的相邻工具。尽调最重要的竞争问题是：验证究竟是决定预算的购买标准，还是分发和采购已经决定后的加分项。
