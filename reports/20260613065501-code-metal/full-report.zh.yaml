            body: >-
              Code Metal 最强的公开成熟度信号在目标宽度和实施严肃性上，而不在精致自助包装上。产品页明确列出 CPUs、GPUs、FPGAs 和多种工具链；NVIDIA
              可移植性研究则给出一个具体证明点，说明可移植性故事不只是愿景：它描述了从 CUDA 到 Qualcomm Adreno GPUs 上 OpenCL 的验证翻译，以及从串行 CPU kernels 到
              Hexagon Vector Extension NPUs 的翻译，部分工作负载达到或超过基线性能。招聘补足了运营模型。面向 CI/CD 和 cloud-plus-on-prem 的 Platform
              DevOps 岗位、Solutions Architect、Forward Deployed Engineer 和 Facility Security Officer，说明公司偏向动手集成和邻近政府交付，而不是纯
              SaaS 动作。研究产出覆盖 verified transpilation、工作流编排、HPC
              翻译、专门代码模型和基准测试；官方新闻页则显示与产品开发绑定的融资和媒体节点保持稳定节奏。限制因素是披露深度：仍没有可比成熟开发者平台的公开 API 参考、支持运行时矩阵或 support-SLA 文档。
