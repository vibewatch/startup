          tone: warning
        - id: step-2
          label: 试点现代化范围
          detail: 供应商和买方选择一个边界清晰的内核、模块或子系统来转换。
          tone: neutral
        - id: step-3
          label: 验证与安全证据
          detail: 输出必须满足质量、信任、内存安全和项目风险方面的要求。
          tone: neutral
        - id: step-4
          label: 接入构建与运行时栈
          detail: 工具链、加速器、测试框架和部署环境都要接通。
          tone: neutral
        - id: step-5
          label: 项目或运营验收
          detail: 国防和受监管买方在规模化发布前要求通过验收关口。
