  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户语言描述的产品工作流
        blocks:
          - type: paragraph
            body: >-
              Code Metal 的公开产品界面对工作流描述得异常具体。公司没有把自己定位成按需写代码片段的通用代码助手。相反，产品页要求工程师从既有高层代码库出发，通过 Code Metal IDE plugin
              载入代码，让系统追踪模块和库依赖，然后定义输出必须满足的运行环境。只有在用户指定
              CPU、加速器组合、资源约束和首选工具链之后，系统才生成转译和部署计划。这个顺序很重要，因为产品本质上是迁移和可移植性工作流，而不只是一个模型。翻译、验证、优化、构建目标和变更追踪被呈现为一个闭环，服务不能接受无声回归的团队。官方和投资人材料持续把这套工作流与国防、航空航天、半导体、汽车和其他受监管场景绑定；这些场景里，正确性、合规和硬件可移植性与原始编码速度同样重要。
