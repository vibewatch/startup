      - number: '1.2'
        title: 创始人、领导层与治理集中度
        blocks:
          - type: paragraph
            body: >-
              领导层披露真实但仍然很窄。Peter Morales 一直被标注为创始人兼 CEO，Alex Showalter-Bucher 为联合创始人，Ryan Aytay 则是在领导 Tableau 后于 2026
              年加入、担任 President 和 COO 的高级运营负责人。创始人与市场匹配的理由可信：发布材料和投资人材料把 Morales、Showalter-Bucher 与 MIT Lincoln
              Laboratory、国防系统工作和 F-35 相关经验联系起来，正好对应 Code Metal 对受监管硬件和邻近国防环境的市场进入重点。技术深度看起来也不只来自两位创始人。公司研究、LLMLift 论文和
              Metalift 生态显示，这家创业公司扎根于形式化方法和 verified lifting 思路；UCSD 教授 Loris D'Antoni 也公开称自己是 Code Metal 的
              Scholar。即便如此，治理透明度仍落后于融资能见度。检索到的 About 页面展示价值观和团队页存在，但文本里没有稳定的具名领导层名单；公开材料也没有披露完整董事会、所有权结构或投资人权利包。Ryan
              Aytay 到来降低了一部分运营侧创始人集中度，但公开叙事仍高度依赖 Morales 作为首席技术和商业发言人。因此，关键人物依赖和治理不透明是实质尽调点，不是文书层面的尾项。
