companyProfile:
  summary: >-
    Code Metal 是一家 Boston 私营软件公司，创立于 2023 年，销售面向任务关键型系统的可验证代码翻译和优化。它的产品叙事把 LLM
    辅助翻译、形式化方法风格的证明生成，以及感知硬件的部署放在一起，瞄准国防和受监管行业里遗留且性能敏感的软件资产。公开证明最强的是融资动能和少数具名账户；核心尽调问题是，今天这种高接触部署能否规模化变成耐久的软件经济性。
