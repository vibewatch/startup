      - number: '7.2'
        title: 监管、法律与来源风险
        blocks:
          - type: paragraph
            body: >-
              监管负担有分量，因为 Code Metal 卖的不是娱乐聊天机器人，也不是通用代码助手。它明确营销面向关键系统的可信翻译，因此更接近 AI Act 的高风险逻辑和政府软件保障预期，而不是消费 AI
              规范。欧盟框架现在把 GPAI 透明度、版权相关义务，以及针对安全相关用例的明确高风险控制放在一起。即便 Code Metal
              在部分部署中能避开最严解释，随着它卖进更敏感的工作流，或发布更多模型能力主张，行政负担仍会增加。


              European Commission 的 FAQ 也把 AI Act 描述成一个全欧盟统一制度：高风险类别和提供方义务处在持续实施过程中，而不是一次性合规备忘录。这很重要，因为 Code Metal
              的任务关键定位，会迫使客户不只问产品是否有效，还要问披露、训练内容摘要、标识和上市后治理能否跟着产品进入受监管项目。


              法律风险不在于已知活跃案件，而在于公开记录没有解决的问题。Copyright Office 已把训练数据审查和输出版权性都列为活跃政策议题：其 2025 年 1 月报告称，纯 AI
              生成材料如果缺乏足够人类控制，则不具备版权性；后续部分则留给训练、许可和责任问题。保留来源仍未披露公司的训练数据来源、授权数据姿态，或任何学术谱系如何转化为生成代码、证明或衍生工件的干净商业 IP
              所有权。隐私政策也只是部分答案，因为它管的是网站数据收集，而不是企业买家会追问的更深层客户代码、留存和模型边界问题。


              结果是典型尽调不对称：公开故事足以解释投资人为什么出资，但不足以在没有管理层直接材料的情况下，关闭诉讼清理、来源或产品特定数据处理问题。
