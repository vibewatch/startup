chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营版图
        blocks:
          - type: paragraph
            body: >-
              Code Metal 把自己定位成服务正确性重于单纯速度场景的软件基础设施公司。官网称使命是让 AI 可信，并把产品描述为面向「每一行代码都重要」行业的可验证代码翻译；产品页展示的配置围绕
              CPUs、GPUs、FPGAs、工具链和资源限制，而不是通用聊天式编码助手。官方研究页面进一步强化这一路线：任务关键型软件只靠测试不够，形式化方法加 LLMs 可以生成并证明代码。公开品类表述曾经变化：2024
              年 7 月种子轮公告称其为面向边缘侧的 AI 驱动开发工作流，后来的 Series A 和 Series B
              材料则更明确地围绕可证明正确或可验证的代码翻译。行业焦点在不同来源中也一致，集中在国防、汽车、半导体、工业和机器人工作负载。总部证据以 Boston 最强：Series B 公告注明
              Boston，Geekwire 称其为 Boston 公司，SEC 搜索结果显示 Boston 营业地址。与此同时，招聘页和投资人材料暗示公司分布在 Boston、San Francisco、远程岗位，并可能包括
              Washington, D.C.，因此实际运营组织比单一办公室标签更分散。
