  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Code Metal 方案
      - 有证据支持的收益
      - 局限
    rows:
      - - 将高层算法移植到边缘硬件
        - 团队否则需要手工把 Python、Matlab 或 Julia 逻辑重写到目标硬件
        - 插件接入，加上面向运行时的转译计划
        - 公开工作流对源语言、目标定义和代码生成顺序描述具体
        - 没有公开客户案例研究完整走完端到端周期
      - - 将 CUDA 工作负载从 NVIDIA 迁出
        - 手工移植和调优 kernel 既慢，又强依赖架构
        - 在保持正确性的同时，把 CUDA kernel 翻译到替代 GPU 或加速器目标
        - Adreno 和 Hexagon 示例显示，至少有一条非 NVIDIA 可移植路径产出已验证结果
        - 基准测试仍早期且有选择性，不是广泛工作负载目录
      - - 将 MATLAB 或信号处理逻辑转成 HDL 或 FPGA
        - MATLAB 到 HDL 工作流脆弱，且大量依赖语法修补
        - MATLAB 到 HDL 研究加上 FPGA 输出说法，指向结构化翻译路径
        - 工作流与智能体研究显示，公司正在迭代这一特定转换问题
        - 没有公开披露 HDL 路径的生产部署案例
      - - 将遗留 C、C++ 或 Java 现代化到新目标
        - 在受监管系统中，手工重写风险高
        - LLMLift 和形式化验证叙事把现代化定义为保持行为的翻译
        - 研究明确把翻译与 Rust 等较新运行时联系起来
        - 公开文档没有穷尽列明支持的遗留语言覆盖范围
      - - 在严格资源限制下探索性能变体
        - 只有可移植性并不能保证性能可部署
        - 优化层提供内存、运行时、代码体积和功耗权衡
        - 可移植性基准显示，部分工作负载达到或超过基线性能
        - 没有公开描述调度器自动调优策略或成本模型
      - - 人工审查后维护生成代码
        - 生成代码一旦被人工编辑，往往偏离源意图
        - 变更跟踪闭环表明，系统会把编辑和批注匹配回输入代码
        - 如果效果符合宣传，改写债务会下降
        - 未展示公开的版本控制集成清单或审计追踪工件
    notes: 收益被拆成明确测量项和工作流主张；在保留证据中，只有 CUDA 可移植性这一行有公开的性能类基准。
