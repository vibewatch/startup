        - id: translation-plan
          label: 转换与硬件目标计划
          detail: 静态分析、目标硬件设置和代码仓库切分，共同界定迁移范围。
          tone: positive
        - id: verification-gate
          label: 验证与确认关口
          detail: 面向证明的检查和生产就绪验证，是买方愿意付费的信任层。
          tone: positive
        - id: customer-deployment
          label: 部署到客户硬件
          detail: 输出必须在 CPU、GPU、FPGA 或其他目标环境中运行，并满足买方特定约束。
          tone: neutral
        - id: contracted-revenue
          label: 企业或政府合同收入
