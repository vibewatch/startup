      - number: '7.4'
        title: 财务风险、缓释因素与投资逻辑破裂点
        blocks:
          - type: paragraph
            body: >-
              财务上，最大风险是在一个已不再容忍太多模糊的价格点上保持不透明。公开来源确认公司连续融资，并从 $250 million 的 Series A 估值快速跃迁到 $1.25 billion 的 Series B
              估值；但没有披露 ARR、毛利率、烧钱速度、留存或收入结构。这让投资人只能依赖强合同和顶级技术差异化叙事，却无法证明这门生意已经像可扩展软件一样运转。


              缓释因素真实存在，但不完整。形式化验证谱系、任务关键定位，以及接触防务导向投资人的能力，降低了 go-to-market
              摩擦，也解释了融资速度。但这些不能替代部署质量指标、客户多元化，或清晰的服务向平台转换。现在的举证责任落在两个问题上：具名参考客户能否扩宽，安装基数增长后支持投入能否下降。


              最干净的监控框架很简单：盯合规摩擦、可靠性证据、客户广度、交付强度，以及下一轮融资或内部标记信号。如果信任工作、服务负载或采购延迟压过速度优势，投资案例会先于技术故事破裂。
