            body: >-
              正向投资逻辑真实存在。Code Metal
              似乎占据了代码现代化、硬件可移植性和形式化验证导向信任的交汇楔子。这个楔子在防务、航空航天、工业和半导体场景最重要：失败成本高，遗留代码难迁移。公开材料也支持它不只是纯概念故事：公司有具名参考客户、技术深度，以及企业和防务导向投资人的反复融资。反向逻辑同样重要。公开证据仍未证明，经验证翻译是一类定义预算的品类，而不是更广泛现代化或安全预算里的高端功能。竞争路径包括相邻开发者安全领导者、既有保障专家、大型
              incumbent，以及已经控制预算和采购通道的服务密集型联邦集成商。如果 Code Metal
              不能把项目驱动的迁移转成可重复软件经济，正确心智模型就不是爆发式开发者平台，而是更窄、更吃人力的现代化供应商。因此，多头故事可以理解，但以当前价格还没有被充分承销。
