      - number: '1.3'
        title: 融资历史、投资人地图与战略重叠
        blocks:
          - type: paragraph
            body: >-
              对一家 2023 年创立的公司来说，已披露融资路径快得异常。2024 年 7 月，Code Metal 宣布由 Shield Capital 领投的 $13 million 种子轮，并披露此前由 J2
              Ventures 领投的 $3.45 million pre-seed。2025 年 11 月，公司宣布由 Accel 领投的 $36.5 million Series A、估值 $250
              million；CNBC 独立报道同一轮融资约 $36 million，说明更可能是媒体四舍五入，而不是另一轮融资。2026 年 2 月，Code Metal 宣布由 Salesforce Ventures
              领投的 $125 million Series B、估值 $1.25 billion，BusinessWire、Wired 和后续行业报道大体匹配这一标题。把已披露轮次相加，公开可见融资约 $177.95
              million，但这是算术合计，不是公司发布的生命周期融资数字。投资人组合有战略意义。Shield、J2、Overmatch、RTX 等国防取向投资人与 Accel、B Capital、Salesforce
              Ventures、Smith Point 等企业软件投资人并列。这个组合有助于招聘、客户进入和采购可信度，但也给尽调带来重叠风险。RTX 在公开材料里既是具名投资人，也是具名客户；Bosch Ventures
              是战略工业投资人，但手头公开来源没有显示 Bosch 是否也是运营客户。因此，股权结构表看起来具备战略价值，但并不能与商业证明点清晰独立开来。
