        title: 切换成本、替代项与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Code Metal
              的护城河有希望，但并不显然永久。如果客户深度采用，切换成本应来自已翻译代码资产、目标硬件配置知识，以及绑定特定现代化项目的验证工作流，而不是经典席位授权锁定。这些成本有意义，但起点可能在项目层，而非公司级平台规模，这给既有厂商留下响应时间。内部自建也是成熟国防或半导体团队的真实替代方案：Metalift
              等公开学术工具和通用 LLM 进步，让资源充足的工程组织有可能原型化自己的翻译加证明流水线，只是集成和维护负担更重。最大的反向证据是结构性的，而非功能性的。GrammaTech 和 Galois
              拥有更长的形式化方法声誉，IBM 拥有更宽的现代化和治理型 AI 触达，Sonar 拥有大得多的开发者覆盖，Booz Allen 或 SAIC
              可以在采购便利性压过产品差异化时获胜。关于已实现定价、具体合同载体和直接基准化胜率的公开证据仍薄，因此今天的护城河论点更多建立在逻辑适配上，而不是大规模替代的充足公开证明上。
