      - number: '4.4'
        title: 资本充足性与融资依赖：Series B 买到时间，但不能证明收入可重复
        blocks:
          - type: paragraph
            body: >-
              Code Metal 的融资节奏是本章最清晰的公开强项。公司在 2024 年 7 月披露 $13 million 种子轮和此前 $3.45 million pre-seed，2025 年 11 月披露 $36.5
              million Series A、估值 $250 million，2026 年 2 月披露 $125 million Series B、估值 $1.25
              billion。这意味着自创立后不到三年，公开可见股权融资约 $177.95 million；SEC EDGAR 结果页显示 2023、2024、2025 年两次和 2026 年均有 Form D
              通知。Series A 到 Series B 仅数月便压缩式跃升，说明投资人在完整公开指标透明前，已经看到足够合同动能和市场紧迫性，愿意提前融资。

              挑战在于，融资速度不等于资本充足性证明。公开来源没有披露当前账上现金、月烧钱速度、现金跑道、债务或营运资本需求。Series B 用途——更多工程、产品开发、商业和政府伙伴关系，以及 GTM
              扩张——读起来像一家仍在激进投入的公司，而不是在收割成熟软件利润率。这意味着 $125 million
              融资可能显著改善了近期现金跑道，但不能消除公司对证明合同胜利可以变成可重复、可扩展收入的依赖，而不是一连串昂贵定制项目。

              战略资本构成也重要。投资人集团显然能帮助客户进入和市场信号，但当 RTX 这样的投资人也出现在公开客户集合中时，会引入重叠风险。换句话说，Code Metal
              看起来为下一运营阶段融资充足，但未来融资条款可能更少取决于验证叙事的新颖性，更多取决于管理层能否证明高接触翻译项目能耐久转化为更可重复的软件和平台业务。
