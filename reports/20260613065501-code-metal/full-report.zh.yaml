      - number: '7.3'
        title: 运营、伙伴与执行风险
        blocks:
          - type: paragraph
            body: >-
              运营上，核心问题是 Code Metal
              的验证和可移植性主张，能否在精选案例之外经济性扩展。产品表面要求用户预先定义目标硬件、工具链和资源限制，而研究记录本身既显示进展也显示边界：已验证提升可以工作，但限于明确域；LLM
              在复杂代码性能推理上仍吃力。这组信号对硬用例很有吸引力，但也意味着翻译质量可能仍需要大量人工审查、按目标调优和针对部署的支持。


              招聘记录强化了这一担忧。Facility Security
              Officer、前线部署岗位，以及高级编译器或形式化方法职位，都像是一门必须逐账户、常常逐项目赢得信任的生意。这与早期成功相容，但还不能证明这是一个轻触平台。如果每个大单都需要重集成、安全处理和定制验证工作，支持负担几乎可以和收入同速增长。GAO
              2026 年对联邦 AI 采购的审查在这里是有用的外部校验：机构称难以获得 AI 技术专家、理解 AI 相关成本，而且经常把 AI
              作为持续服务而非盒装产品来采购。对一家卖任务软件的公司来说，这个背景指向更长评估周期，以及比普通开发者工具采用更深的供应商持续参与。


              伙伴和执行风险会叠加这份负担。增长公开绑定正式项目和一小组标杆客户，而 RTX
              同时站在投资人与客户两侧。面向国家安全的投资人和学术谱系是优势，但也凸显出证明故事仍多大程度依赖一张集中的项目、人员和附属技术可信度网络。同一网络处在这样的政策环境中：GAO 称 DOD 仍需要部门级 AI
              采购指引；CISA 则认为包括 AI 供应商在内的软件生产者，应承担安全设计负担，提供安全默认值、日志和生命周期安全所有权。这些都是合理的客户要求，但会拉长部署工作，并把 Code Metal
              需要提交的证据负担抬到模型质量之上。
