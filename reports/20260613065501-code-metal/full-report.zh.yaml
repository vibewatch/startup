      - - 国防主承包商现代化
        - 公开可见客户标识很少，意味着一两个账户可能主导公开证据
        - 如果主承包商账户仍占订单额的大头，收入集中风险很高
        - 索取前五大客户构成，以及按主承包商划分的销售管线
      - - 半导体可移植性工作流
        - 公开材料仍未出现具名芯片客户
        - 战略邻接性不错，但转化尚未验证
        - 索取未具名芯片平台账户的名称、阶段和部署 KPI
      - - 工业 / 电子账户
        - Toshiba 把叙事扩展到国防之外，但公开具名的电子客户标识只有一个
        - 商业多元化可能比标题里的垂直行业清单更薄
        - 索取更多具名工业客户，以及重复部署证明
      - - 硬件特定集成与验证
        - 定制运行时和工具链一旦落地，部署会更粘
        - 首次部署成功后，留存和扩张可能有上行空间
        - 索取后续模块、硬件目标或业务单元带来的扩张收入
      - - 投资者-客户重叠与 PR 中介证据
        - RTX 和投资人投资逻辑有助于打开通路，但削弱了客户背书样本的独立性；J2 和 Shield 又增加了更多由合作伙伴掌控的叙事表面
        - 增加了夸大无偏客户验证的风险
        - 索取既不是投资者、也不是财务赞助方的直接客户背书
    notes: 本表把扩张上行空间与证据缺口拆开；正是这些缺口让多元化客户经济性无法被公开证据证明。
