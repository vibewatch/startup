      - number: '5.4'
        title: 信任、安全、边界与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              信任论点真实，但比标题更窄。官方和投资人材料反复强调数学证明、验证、合规和生产就绪；公司的形式化方法解释也有用地说明了原因：单靠测试无法证明 bug
              不存在。尽管如此，公开证明边界没有完全说明。保留来源支持关于选定翻译行为保持的主张，也支持基准场景中已验证 kernels 的主张，但没有发布证明覆盖率、solver timeout
              的失败模式分类，或明确说明哪些属性总能被证明、哪些只是启发式测试。研究历史也提供了反向证据。Tenspiler 对复杂度敏感且依赖手工规则构建，说明纯符号方法不会自动扩展。UniPar 和
              gpuFLOPBench 显示，LLM 驱动的代码推理在并行和数学复杂工作负载上仍然脆弱，而这正是 Code Metal
              一开始需要结构化工作流和证明机制的原因。最后，隐私政策是这里浮现的唯一明确公开安全控制；它承诺合理措施但不给绝对保证，已审阅页面也没有披露 SOC 2、ISO 27001、FedRAMP 或公开状态页。
