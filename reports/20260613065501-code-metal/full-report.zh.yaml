  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自差异化技术切口和可信需求信号，但 KPI 不透明、价格已计入强劲结果，把结论压在更谨慎的位置。
    approximationNotes: 这是逻辑链，不是量化估值模型。它刻意说明为什么建议停在继续研究，而不是买入。
    data:
      nodes:
        - id: wedge
          label: 任务关键型产品切口
          detail: 可验证翻译叠加硬件可移植性，比通用编码辅助更有差异化。
        - id: proof
          label: 早期证据已经出现
          detail: 具名客户和多轮融资显示真实市场拉力，不只是研究深度。
        - id: opacity
          label: KPI 仍高度不透明
          detail: ARR、利润率、现金、集中度和股权结构条款大多仍未公开。
        - id: competition
          label: 预算竞争真实存在
          detail: 开发者安全平台、保障供应商、既有厂商和联邦系统集成商，都可能截走预算。
        - id: price
          label: 当前价格已经激进
          detail: $1.25B 的估值假设了公开数据尚未证明的规模。
        - id: call
          label: 建议：继续研究
          detail: 只有尽调更深或入场纪律更好，才继续推进。
      edges:
        - from: wedge
          to: proof
          label: 差异化可以创造需求
        - from: proof
          to: opacity
          label: 需求证据仍需要 KPI 支撑
        - from: opacity
          to: price
          label: 经济性缺失削弱对估值的信心
        - from: competition
          to: price
          label: 替代预算归属压低确定性
        - from: price
          to: call
          label: 估值敏感性决定最终姿态
        - from: wedge
          to: call
          label: 质量让公司仍可投资，只是尚未去风险
