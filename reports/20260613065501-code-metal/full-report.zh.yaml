      - - 开发者接入与上下文层
        - 通过 IDE 插件收集源码依赖和本地工作流上下文
        - 客户代码库加开发者环境
        - 支持的 IDE、代码库形态和依赖边界没有公开文档
      - - 运行时与部署规划器
        - 把硬件资源和工具链选择转成生成与构建计划
        - 目标硬件元数据和构建工具集成
        - 目标建模有多少自动化、多少靠人工维护，外界并不清楚
      - - 转译层
        - 从高层源码生成目标语言或目标后端代码
        - 自定义代码模型，加任务专用提示和修复流程
        - 纯 LLM 生成在更难的代码推理任务上很脆弱，因此编排质量很关键
      - - 验证层
        - 尝试证明功能等价，或证明不存在特定安全违规
        - 规格说明、证明生成和求解器后端
        - 公开来源没有量化生产工作负载中的证明覆盖率或失败率
      - - 优化层
        - 探索内存、运行时、代码体积或功耗上的替代实现
        - 后端专用启发式和基准循环
        - 性能可移植性仍取决于工作负载，可能还需要继续调优
      - - 研究底座
        - 借鉴 LLMLift、Tenspiler、Metalift、UniPar、MonoCoder 及相关基准工作
        - 程序合成、LLVM 分析、Rosette、CVC5 和面向领域的模型
        - 从研究到产品的转移路径在主题上可见，但没有落到具体发布说明里
      - - 支持与集成层
        - 通过平台和前线部署岗位，提供 CI/CD、本地部署和客户交付界面
        - DevOps、解决方案架构和安全运营
        - 公开界面显示，导入更像服务重投入，而不是纯自助平台
      - - 治理与保障语境
        - 把产品映射到国防级和关键基础设施的保障预期
        - 形式化规格、证明证据和 AI 风险控制
        - 产品主张可能跑在当前公开治理工件实际暴露的信息前面
    notes: 这套架构来自公开产品文案、研究页面、投资人评论和招聘信息的重建，而不是供应商发布的系统设计文档。
