  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制或风险领域
      - 公开信号
      - 状态
      - 范围
      - 剩余缺口
    rows:
      - - 形式化等价或安全证明
        - 官方和投资人页面反复宣称数学证明或已验证输出
        - 强营销主张
        - 适用于转译正确性和特定安全属性，但不明显覆盖全部部署行为
        - 没有公开的证明覆盖率指标或总能证明的属性清单
      - - 测试与证明的区别
        - 形式化方法解释文明确说，测试无法证明不存在 bug
        - 明确披露
        - 说明 Code Metal 为何把自己放在通用代码生成之上
        - 没有公开证据说明证明和测试如何在客户流水线中结合
      - - 可移植性基准验证
        - NVIDIA 可移植性文章称生成的内核已验证正确
        - 具体但范围窄
        - 展示至少一条从转译到已验证性能的实测路径
        - 工作负载覆盖是选择性的，且仍被称为初步结果
      - - LLM 可靠性测量
        - UniPar、gpuFLOPBench 和工作流编排研究都在研究模型失败模式
        - 有意义的研究界面
        - 支撑结构化工作流和修复的必要性，而不是一次性提示
        - 没有公开说明生产客户代码库上的通过率
      - - 隐私与数据处理
        - 网站隐私政策描述数据收集权利和合理安全措施
        - 披露了基础控制
        - 覆盖网站数据实践和安全免责声明
        - 没有关于产品本身的数据驻留、租户隔离或训练数据使用的公开说明
      - - 安全认证与服务保障
        - 保留的公开页面没有点名 SOC 2、ISO 27001、FedRAMP 或公开状态页
        - 未披露
        - 缺席本身就是可观察信号
        - 企业和国防买家很可能会要求私下提供信任中心材料
      - - 国防级保障对齐
        - DARPA 和 NIST 材料提供了任务关键型 AI 软件的外部保障语境
        - 仅作语境
        - 支撑形式化方法和保障证据在该市场为何重要
        - 不能证明 Code Metal 已达到某项认证或保障门槛
      - - 人工或求解器兜底
        - Tenspiler 局限和基准限制说明表明，人工专业能力和求解器约束仍是交付现实的一部分
        - 存在反向证据
        - 对界定真实部署风险和人员配置要求很重要
        - 没有公开的兜底分类、超时政策或人工审核手册
    notes: 该表把明确控制、相邻语境和披露缺口分开。缺席类判断仅限于本章审阅过的保留公开页面。
