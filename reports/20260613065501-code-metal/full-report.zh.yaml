      - number: '4.2'
        title: 牵引力与 GTM 代理指标：可见 logo、战略投资人和高接触销售信号
        blocks:
          - type: paragraph
            body: >-
              公开牵引力比典型尚未披露指标的 AI 基础设施公司更可信，但仍不完整。到 2026 年 2 月，公司和 Business Wire 已把 Toshiba、RTX、L3Harris 和 U.S. Air Force
              列为客户，Salesforce Ventures 也称需求已把 Code Metal 拉入 Air Force 和 L3Harris 的 programs of record。这强于泛泛的试点语言，并说明
              Code Metal 已经卖进企业或工业账户，也卖进政府或国防项目。代价是公开客户名单仍短，仅凭公开证据无法排除集中度风险。

              Go-to-market 信号指向长周期、伙伴辅助的企业销售，而不是高效自下而上采用。招聘页列出 Facility Security Officer、Forward Deployed
              Engineer、Principal Solutions Architect 和资深平台岗位，都符合涉及采购审查、安全处理，以及在客户硬件上定制部署的销售动作。官方 Series B
              募资用途声明也优先提到扩展商业和政府伙伴关系；投资人集团则把 Salesforce Ventures、Accel、B Capital 等企业软件支持者，与 RTX、Shield、J2、Overmatch
              等国防和战略取向名称放在一起。即使确切伙伴经济性未披露，这个组合也可能帮助引荐、采购可信度和渠道进入。

              销售效率问题仍然开放，因为 CAC、回本周期、胜率或销售周期指标都没有公开。即便如此，programs-of-record
              语言、国防取向招聘和战略投资人重叠结合在一起，让人可以合理推断销售周期长且昂贵，伙伴关系可能是效率故事的一部分。如果这个判断正确，下一步尽调不是猜 SaaS
              式效率比率，而是判断每个高接触部署在初始迁移完成后能释放、留住并扩张多少收入。
