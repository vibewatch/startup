      - number: '4.3'
        title: 成本结构与利润率路径：今天偏 R&D，只有交付标准化后才有杠杆
        blocks:
          - type: paragraph
            body: >-
              可能的成本结构由专业劳动力主导。Code Metal 的公开研究记录横跨形式化验证、遗留代码迁移、HPC 翻译和领域特定模型；招聘页显示对 compiler tooling、形式化方法、ASIC design
              and verification、platform DevOps、建模仿真和客户面对工程的需求。这个组合意味着公司在稀缺研究员和资深技术人员上重投入，而不是一个轻支持的 consumption
              API。公司也在解决自身材料称为困难的问题：跨架构手工迁移可能需要稀缺 kernel 专家和每个 kernel 数周调优，高保障环境也需要强于 compile-and-test 的保证。

              这种劳动力画像对利润率有两面影响。近期看，它意味着有意义的 R&D
              费用和前置部署负担，因为国防、半导体、汽车和工业系统客户往往需要定制硬件目标、工具链约束和验证标准。公开材料没有披露实施服务和可复用产品之间的拆分。这造成真实风险：即使需求强劲，入门和交付仍可能偏服务化，从而拖慢毛利率扩张。

              上行情景同样可以从第一性原理看见。Code Metal
              的研究栈显示，公司试图把困难的一次性迁移问题转成可重复工作流、领域模型和证明生成技术。如果这种抽象成功，经济模型可能从依赖资深工程师的项目工作，转向由软件放大的可重复性，毛利率更好，每个项目的边际交付成本更低。公开证据还不足以证明这种转型已经发生，因此利润率路径应被描述为合理但未验证，而不是既定事实。
