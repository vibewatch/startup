      - number: '3.3'
        title: 部署、定价与预算所有者
        blocks:
          - type: paragraph
            body: >-
              实际买方地图很碎。Code Metal 最可能卖给工程、现代化或任务软件项目预算，这些预算关心把遗留代码迁到新运行时且不牺牲正确性。相邻工具指向不同所有者：Snyk 指向 AppSec 和
              DevSecOps，Sonar 指向广义开发者平台或质量负责人，Diffblue 指向 QA 或开发者生产力。IBM 可以通过企业架构、应用现代化或 AI 平台预算进入同一账户，Booz Allen 和 SAIC
              则可以追逐服务驱动的项目资金。这一点重要，因为整个品类公开定价稀少。多数公开页面描述能力、治理或服务姿态，但不发布已实现合同金额，限制了标价比较的精度，也让采购渠道分析比名义价格更重要。反向含义是，大型既有厂商可以把相邻功能打包进更宽的现代化栈，从而压缩竞争；国防服务替代项也能借既有关系切入，而不是通过全新软件采购。Code
              Metal 因而不仅需要更强功能，还需要讲清楚：为什么其验证取向工作流应拥有独立预算线，而不是被吸收到更大平台或服务合同中。
