      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              日常用户很可能是工程团队，而不是普通开发者席位：嵌入式软件工程师、平台和 compiler 团队、GPU
              或加速器专家、验证工程师，以及在绑定特定硬件或认证制度的大型代码库中工作的任务软件开发者。国防主承包商是最清晰的早期分层，因为他们已经在交付和验收里程碑下管理软件密集型项目；政府项目办公室和资助方则帮助决定试点能否变成获资助项目。在半导体和平台软件中，买方更可能是需要在异构硬件之间迁移工作负载并保持性能和正确性的
              VP engineering、平台负责人或架构团队。在工业、航空航天和机器人场景中，预算通常在负责长生命周期边缘软件的产品软件、嵌入式平台或现代化负责人手中。


              因此付款方随分层变化，但通常不是个人开发者。它是工程、项目或现代化预算，靠避免重写人力、更快硬件迁移、更低认证摩擦或部署中更少缺陷来论证支出。系统集成商和国防 IT
              承包商也重要，因为它们位于政府需求和实际工程工作之间；Booz Allen 和 SAIC 都向国家安全客户营销 AI
              和数字现代化，验证了这个中介层。采用路径可能从边界明确的试点或最低可行能力版本开始，只有在接入工具链、构建系统、验证工作流和运营验收流程后才扩张。这个动态偏向能支持企业落地的供应商，而不只是自助式产品使用。
