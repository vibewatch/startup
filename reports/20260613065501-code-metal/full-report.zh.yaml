      - number: '2.2'
        title: 用受证据约束的视角估算规模，而不是给一个 TAM 标题数
        blocks:
          - type: paragraph
            body: >-
              公开证据支持相邻预算规模可观，但不支持一个干净发布的 verified AI code modernization TAM。最宽的商业视角是遗留应用现代化：Grand View Research 估计，2023
              年全球市场为 USD 17.8 billion，到 2030 年增至 USD 52.46 billion，部分由遗留应用高维护成本和运营拖累推动。第二个相邻视角是软件保障和代码安全：Mordor
              Intelligence 估计，应用安全市场 2026 年为 USD 14.83 billion，2031 年为 USD 28.11 billion，扫描越来越多地嵌入持续集成流水线。这些数字对 Code
              Metal 的切入点过宽，但说明现代化和验证已经是真实预算类别。


              第三个视角是国防和受监管工程组织内部的任务关键型现代化。DoD 官方文件没有为 Code Metal
              的精确品类发布干净条线，但确实把软件现代化和快速安全交付列为战略优先。由于公开记录缺少可验证代码翻译平台的独立定价、合同量或采购转化数据，最可辩护的估算应是切入点分析，而不是虚假精确：覆盖国防主承包商、政府软件项目、半导体平台团队，以及工业或航空航天
              OEM 软件团队的可服务市场，近期年度支出大约 USD 0.6-1.8 billion 看起来合理；只有当买方愿意在许多架构和项目中同时资助迁移与持续验证时，更宽的 USD 1.8-4.5 billion
              机会才变得合理。不确定性很重要，应保留下来，而不是被平均掉。
