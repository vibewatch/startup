          low: 400
          high: 800
          displayValue: $0.4B to $0.8B
          detail: 假设财务不透明持续存在，市场更像给一家小众高保障承包商那样给 Code Metal 估值。
          tone: warning
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，区分哪些方面看起来强，哪些因素仍挡住清晰的投资判断。
    approximationNotes: 评分是 10 分制序数判断，只基于截至运行日期留存的公开证据。
    data:
      items:
        - label: 市场切口
          value: 7
          unit: /10
          detail: 更大的软件预算里，似乎确实存在任务关键型现代化问题。
          claimRefs:
            - CV013
        - label: 产品差异化
          value: 8
          unit: /10
          detail: 以验证为中心的翻译和硬件可移植性，看起来确实有辨识度。
          claimRefs:
            - CV014
        - label: 客户证据
          value: 6
          unit: /10
          detail: 具名客户有帮助，但公开样本很短，且部分靠近投资人。
          claimRefs:
            - CV008
            - CV037
        - label: 财务透明度
          value: 3
          unit: /10
          detail: 核心 KPI 仍有太多未公开，难以形成干净的承销判断。
          claimRefs:
            - CV010
            - CV011
        - label: 竞争隔离
          value: 5
          unit: /10
          detail: 精确对标的同类公司有限，但既有厂商和替代方案很强。
          claimRefs:
            - CV016
            - CV021
            - CV022
        - label: 融资实力
          value: 8
          unit: /10
          detail: 公司多次在更高估值下吸引强资本。
          claimRefs:
            - CV005
            - CV006
        - label: 估值纪律
          value: 2
          unit: /10
          detail: 当前入场价几乎不给证据缺口带来的下行情景留空间。
          claimRefs:
            - CV034
            - CV035
        - label: 证据质量
          value: 4
          unit: /10
          detail: 证据足够让尽调值得认真推进，但还不足以直接转成信心。
          claimRefs:
            - CV032
            - CV036
    claimRefs:
      - CV013
      - CV014
      - CV016
      - CV032
      - CV034
      - CV036
      - CV037
