              KPI
              透明度。建议姿态是继续研究，置信度为中，风险评级为高，估值姿态为昂贵。也就是说，价格敏感性很重要：下一次接触要么需要实质更好的入场点，要么管理层需要开放数据室，证明经常性软件收入、利润率结构、客户多元化和股权结构表经济性。关键投资逻辑破裂条件很简单。如果公司到下一轮融资里程碑时，仍无法证明具名需求正在转化为可重复软件经济，那么当前独角兽标记应被视为脆弱，而不是自我验证。最终尽调应继续聚焦收入质量、融资条款、客户集中度，以及验证驱动交付正在变成可扩展产品、而非定制服务外壳的证据。
