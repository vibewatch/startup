      - number: '8.3'
        title: 情景区间与可比边界
        blocks:
          - type: paragraph
            body: >-
              Code Metal 不披露收入、利润率或留存，因此可比公司最好用作区间边界，而不是直接定价公式。Snyk 和 Sonar
              展示了后期开发者或代码质量平台在投资人看到数亿美元收入，或看到通往该规模的明确路径后，能拿到什么估值。Diffblue 提供了一个小得多的 AI-for-code 参考点；IBM、Booz Allen 和
              SAIC 的意义不在估值倍数，而在提醒大型 incumbents 可以从不同角度吸收同一预算。GrammaTech 和 Galois 说明信任与保障有价值，但不能证明 Code Metal
              具备风险投资级软件经济。乐观、基准和悲观区间因此应建立在里程碑上，而不是伪确定性：乐观情景需要经审计增长和软件杠杆；基准情景是质量参差但真实的项目动能；悲观情景则是重估到类似小众承包商的结果。以当前披露组合看，基准情景应给最高权重；如果指标在下一轮融资周期仍保持私密，悲观风险真实存在。
