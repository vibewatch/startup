      - number: '2.4'
        title: 增长驱动、认证摩擦与市场上限
        blocks:
          - type: paragraph
            body: >-
              几股力量推动这个市场向前。硬件更替是真实的：Code Metal 自己关于可移植性的文章明确讨论把 CUDA 工作负载从 NVIDIA
              迁出，或把遗留代码迁到更新加速器需要什么；投资人材料也把国防、半导体和航空航天系统中的基础设施债务描述成复利式问题。与此同时，安全和信任要求正在收紧。CISA 和 NSA
              建议国家安全系统与关键基础设施采用内存安全方法，NIST 也在把可信 AI 指引延伸到关键基础设施运营。这些压力提高了工具价值：既能现代化代码，又不牺牲正确性证据。


              约束同样重要。DARPA 的 ARCOS 项目直接指出，当前 DoD 认证实践陈旧且无法规模化，因为它依赖人工评估者和拆分不佳的证据。DoDI 5000.87
              和更广泛的软件现代化计划鼓励迭代交付，但也确认国防采用要穿过项目门、运营验收和持续监督。技术可扩展性也未被证明：Code Metal 自己的翻译论文显示了特定领域收益，但 UniPar
              等更广研究仍报告复杂并行代码翻译的编译和正确率有限，关于 Copilot
              生成代码的实证工作也发现实质安全弱点。结果是，一个有真实需求的市场仍背负未解决的证明负担：接入混乱遗留代码库可能继续重服务化，商业上行取决于能否证明验证经济性可超越定制试点并规模化。
