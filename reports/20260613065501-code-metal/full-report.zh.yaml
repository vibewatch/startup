            body: >-
              公开证据对耐久性的指向偏正面，但直接测量很弱。利好在结构上：Code Metal 卖给的客户似乎重视硬件特定部署、形式化验证，以及受监管或任务关键结果。客户一旦围绕自己的
              CPU、GPU、FPGA、工具链或安全约束配置了翻译计划，再切走就会消耗大量时间、工程注意力和重新验证成本。独立技术与政策来源解释了原因。LLMLift 和 Tenspiler 的工作，以及 DARPA、NIST
              材料，都说明翻译到专用运行时或高保障环境很难、容易出错且验证负担重。首个部署如果跑通，就可能形成长期、高价值账户。但公开记录不足以让投资人从“可能有黏性”跳到“已证明留存”。公司没有公开
              NRR、GRR、流失率、合同期限、续约、扩张率或 cohort 披露。现有最佳代理指标更弱：L3Harris 被描述为多个项目，Air Force 与 L3Harris
              被称为已有正式项目，一篇低等级二级文章转述管理层说法，称每个已部署试点都会进入下一阶段。这些是鼓舞人心的信号，不是留存会计。
