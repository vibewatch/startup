          detail: Verification-centric translation and hardware portability look genuinely distinctive.
          claimRefs:
            - CV014
        - label: Customer proof
          value: 6
          unit: /10
          detail: Named logos help, but the public set is short and partly investor-adjacent.
          claimRefs:
            - CV008
            - CV037
        - label: Financial transparency
          value: 3
          unit: /10
          detail: Too many core KPIs remain private for a clean underwriting case.
          claimRefs:
            - CV010
            - CV011
        - label: Competitive insulation
          value: 5
          unit: /10
          detail: Exact-match peers are limited, but incumbents and substitutes are powerful.
          claimRefs:
            - CV016
            - CV021
            - CV022
        - label: Financing strength
          value: 8
          unit: /10
          detail: The company has repeatedly attracted strong capital at higher marks.
          claimRefs:
            - CV005
            - CV006
        - label: Valuation discipline
          value: 2
          unit: /10
          detail: Current entry price leaves little room for missing-proof downside.
          claimRefs:
            - CV034
            - CV035
        - label: Evidence quality
          value: 4
          unit: /10
          detail: There is enough to take diligence seriously, but not enough to convert directly into conviction.
          claimRefs:
            - CV032
            - CV036
