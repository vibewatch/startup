      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The daily user is likely an engineering team rather than a casual developer seat: embedded-software
              engineers, platform and compiler teams, GPU or accelerator specialists, verification engineers, and
              mission-software developers working inside large codebases that are coupled to specific hardware or
              certification regimes. Defense primes are the clearest early segment because they already manage
              software-intensive programs under delivery and acceptance milestones, while government program offices and
              sponsors help determine whether a pilot can become a funded program. In semiconductors and platform
              software, the buyer is more likely a VP engineering, platform lead, or architecture team that needs to
              move workloads across heterogeneous hardware while preserving performance and correctness. In industrial,
              aerospace, and robotics settings, the budget tends to sit with product-software, embedded-platform, or
              modernization leaders who own long-lived edge software.


              The payer therefore changes by segment, but it is usually not an individual developer. It is an
              engineering, program, or modernization budget that justifies spending through avoided rewrite labor,
              faster hardware migration, lower certification friction, or fewer defects in deployment. Systems
              integrators and defense IT contractors also matter because they sit between government demand and the
              actual engineering work; Booz Allen and SAIC both market AI and digital modernization to national-security
              customers, validating that intermediary layer. Adoption is likely to start with a bounded pilot or minimum
              viable capability release, then expand only after integration into toolchains, build systems, verification
              workflows, and operational-acceptance processes. That dynamic favors vendors who can support enterprise
              onboarding, not just self-serve product usage.
