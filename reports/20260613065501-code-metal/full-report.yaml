  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: high-assurance modernization, not generic copilots'
        blocks:
          - type: paragraph
            body: >-
              Code Metal should be placed in the market for AI-driven code modernization, translation, and verification
              for mission-critical software, not in the broad market for generic developer copilots. Its product surface
              asks users to specify CPUs, GPUs, FPGAs, toolchains, and runtime resource limits, while its research pages
              argue that testing alone is insufficient when software controls avionics, semiconductor tooling,
              autonomous systems, embedded devices, or regulated infrastructure. The company and investor narrative is
              consistent on the wedge: decades-old code written in C, C++, MATLAB, ADA, CUDA, and other legacy or
              hardware-coupled forms must be moved onto newer architectures without giving up correctness.


              That boundary is narrower than AI coding and even narrower than general application modernization.
              Included spend is the software and engineering budget used to translate legacy code, prove or verify
              behavior, integrate with constrained runtimes, and generate evidence acceptable to security, quality, and
              certification stakeholders. It includes defense embedded systems, aerospace and industrial edge
              controllers, semiconductor and accelerator software, and other high-stakes environments where rewrite
              failure is expensive. Excluded spend includes greenfield software development, casual code-completion
              tools, and generic chat-style copilots that improve coding velocity but do not solve hardware-portability
              or assurance bottlenecks. Status-quo substitutes are manual rewrites, specialist kernel/compiler teams,
              internal platform engineering, static-analysis and testing tools, and incumbent assurance vendors.
