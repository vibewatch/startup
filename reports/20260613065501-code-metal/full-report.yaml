  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priority and adverse stance
        blocks:
          - type: paragraph
            body: >-
              Code Metal is easier to like than to underwrite. The public record supports a company solving real
              modernization pain in environments where failure matters, and it supports unusually strong financing
              velocity for such a young business. The adverse view is that this same profile concentrates risk: trust,
              certification, and deployment proof matter more here than in ordinary developer tooling, while the company
              has disclosed far less operating evidence than the $1.25 billion valuation implies.


              The most material risks therefore sit above ordinary startup execution noise. The company sells into
              mission-critical settings, names only a short customer list publicly, and relies on a story of verifiable
              translation whose public validation still comes mainly from papers, investor theses, and company materials
              rather than from field reliability metrics. That means the biggest risk is not that no one cares, but that
              buyers care deeply and still require more proof, more services, and more approval work than the current
              valuation discounts.


              This chapter therefore takes the strongest adverse stance in the report: assume demand exists, then ask
              whether it compounds into repeatable software economics under real regulatory, procurement, and delivery
              constraints. If diligence cannot close those proof gaps, the financing story is ahead of the operating
              story.
            claimRefs:
              - CR001
              - CR002
