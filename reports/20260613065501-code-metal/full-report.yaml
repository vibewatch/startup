  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Nearest Alternatives
        blocks:
          - type: paragraph
            body: >-
              The buyer does not evaluate Code Metal against one neat peer set. The landscape breaks into four practical
              categories. First are high-assurance or formal-methods-oriented peers such as GrammaTech and Galois, which
              sell software-assurance, security, and high-assurance solutions to defense and other regulated
              environments. These are the closest substitutes on trust and verification posture, and both have longer
              public track records than Code Metal. GrammaTech's public learn hub is likewise organized around
              cybersecurity and software assurance rather than around code-translation workflow. Second are adjacent AI
              code-quality tools such as Diffblue, Snyk, and Sonar. They compete for part of the same engineering budget
              because they promise faster test generation, static analysis, or AI-era code verification, but their
              public positioning is narrower than Code Metal's modernization-plus-portability narrative. Third are
              modernization incumbents such as IBM, which can wrap coding assistance into a broader governed AI and
              application-modernization stack. Fourth are defense-services substitutes such as Booz Allen, SAIC, and
              internal engineering teams, which can pursue modernization through services engagements or custom builds
              instead of buying a new product vendor. Across those groups, most alternatives do not advertise the exact
              combination of code translation, target-hardware portability, and formal verification that Code Metal
              emphasizes. The adverse read is that the market may still reward incumbency, contract access, and
              installed base more than feature novelty.
