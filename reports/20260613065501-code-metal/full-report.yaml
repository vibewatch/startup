  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market
        - Mission-critical modernization and verification can support a meaningful wedge inside larger software budgets.
        - The wedge may be too narrow or too services-heavy to support elite platform valuations.
        - Show repeatable expansion across several independent customers and sectors.
      - - Product
        - Formal-verification-centric translation and hardware portability look differentiated versus generic copilots.
        - Differentiation may matter less than incumbent procurement reach or broader platform bundling.
        - Provide win-loss data where verification was the decisive buying criterion.
      - - Customers
        - Named logos suggest relevance in high-stakes environments.
        - A short public logo list can hide concentration and investor-linked proof quality.
        - Disclose customer count, top-customer share, and pilot-to-production conversion.
      - - Financials
        - Eight-figure contract language implies real demand at an early stage.
        - No public ARR, margin, burn, or revenue-mix data shows whether this is scalable software.
        - Open the KPI package and show software-led gross-margin progression.
      - - Competition
        - Exact-match peers are limited, which can help a category leader emerge.
        - Adjacent platforms, incumbents, and services primes can absorb the same budget.
        - Show clear displacement against incumbents and internal-build alternatives.
      - - Financing
        - Top-tier investors repeatedly funded the story at higher prices.
        - Fast round timing can also mean narrative outran public proof and raised future expectations.
        - Provide milestones tied to the next financing or cash-flow inflection.
    notes: >-
      Rows pair the strongest constructive read with the strongest evidence-backed counterargument. The right question
      is not whether the company is good, but whether the current price already discounts the good outcome.
