  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer map: public evidence points to four real buyer buckets, plus one still-unnamed semiconductor class'
        blocks:
          - type: paragraph
            body: >-
              Code Metal's public customer story is not one monolithic enterprise bucket. The retained sources support
              at least five distinct demand surfaces: defense primes such as L3Harris and RTX; direct government buyers
              or programs centered on the U.S. Air Force; semiconductor or platform teams that need code portability
              across chips and toolchains; industrial or electronics accounts represented most clearly by Toshiba; and
              earlier logistics or edge operators represented by X-Press Feeders and HICO-linked testimony. The homepage
              and product pages reinforce why these segments cluster around the company: buyers care about verified
              translation, target-hardware configuration, and production readiness in environments where software
              failure has safety, compliance, or mission consequences. That buyer mix also implies a non-self-serve
