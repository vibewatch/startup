      - number: '4.3'
        title: 'Cost structure and margin path: R&D-heavy today, with leverage only if delivery standardizes'
        blocks:
          - type: paragraph
            body: >-
              The likely cost structure is dominated by specialized labor. Code Metal's public research record spans
              formal verification, legacy-code migration, HPC translation, and domain-specific models, while the careers
              page shows demand for compiler tooling, formal methods, ASIC design and verification, platform DevOps,
              modeling and simulation, and customer-facing engineering. That combination implies a company spending
              heavily on scarce researchers and senior technical staff, not a lightly supported consumption API. The
              company is also solving a problem that its own materials describe as difficult: manual migration across
              architectures can require rare kernel experts and weeks of tuning per kernel, while high-assurance
              environments need stronger guarantees than compile-and-test alone.

              That labor profile cuts two ways for margin. In the near term it suggests meaningful R&D expense and a
              forward-deployed burden, because customers in defense, semiconductor, automotive, and industrial systems
              often need custom hardware targets, toolchain constraints, and verification standards. Public materials do
              not disclose the split between implementation services and reusable product. That creates real risk that
              onboarding and delivery are still services-heavy, which would slow gross-margin expansion even if demand
              is strong.

              The upside case is equally visible from first principles. Code Metal's research stack suggests the company
              is trying to convert hard one-off migration problems into repeatable workflows, domain models, and
              proof-generation techniques. If that abstraction succeeds, the economic model could move from
              senior-engineer-heavy project work toward software-enabled repeatability with better gross margins and
              lower marginal delivery cost per program. Public evidence is not yet strong enough to prove that
              transition has happened, so the margin path should be described as plausible but unverified rather than
              assumed.
