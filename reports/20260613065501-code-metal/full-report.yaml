  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation range (USD B)
      - Probability signal
      - Downside or validation trigger
    rows:
      - - Bull
        - >-
          Management shows audited growth, software-led gross margins, diversified customers, and clear reuse of
          translation workflows.
        - 1.5-2.4
        - Possible but not default; requires new KPI disclosure and proof of product leverage.
        - Validated by audited ARR, margin, and expansion data.
      - - Base
        - Demand remains real, but economics still look mixed between product and high-touch delivery.
        - 0.9-1.4
        - Most likely on current evidence because financing is clearer than monetization depth.
        - Holds if backlog grows but SaaS-style quality metrics remain only partly visible.
      - - Bear
        - >-
          Market cools, services intensity remains high, or customer concentration and procurement friction block
          scaling.
        - 0.4-0.8
        - Material risk because the public case still depends on narrative more than disclosed economics.
        - Triggered by weak KPI disclosure, flat growth, or a flat/down financing round.
    notes: >-
      These are milestone-based scenario ranges rather than direct revenue-multiple outputs. They are intentionally wide
      because public revenue and margin data are not available.
    claimRefs:
