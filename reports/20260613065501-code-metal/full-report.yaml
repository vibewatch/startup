            body: >-
              The adverse case is not that customer demand is fake; it is that the visible proof is narrow,
              defense-heavy, and mediated by interested parties. The same four names—U.S. Air Force, L3Harris, RTX, and
              Toshiba—recur across official releases, investor theses, and recycled secondary coverage, while
              independent customer testimonials remain scarce. Code Metal's own public surface is dominated by funding
              announcements, research essays, and media-amplification posts rather than a mature customer-story library.
              That matters because logos alone do not answer the underwriter's key questions: how concentrated revenue
              is, whether the company sits on prime or subcontract paper, how renewals behave, and whether the customer
              relationship survives the initial migration project. Procurement friction is also likely material.
              Government and defense customers often require security handling, formal assurance, and long buying
              cycles, and the open roles plus new COO hire fit that interpretation. Retained USAspending and SAM search
