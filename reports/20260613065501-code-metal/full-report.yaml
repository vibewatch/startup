      - number: '7.2'
        title: Regulatory, legal, and provenance risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory burden is meaningful because Code Metal is not selling an entertainment chatbot or a
              generic code helper. It is explicitly marketing trustworthy translation for critical systems, which puts
              it closer to the AI Act's high-risk logic and to government software-assurance expectations than to
              consumer AI norms. The EU framework now combines GPAI transparency, copyright-related obligations, and
              explicit high-risk controls for safety-relevant use cases. Even if Code Metal can avoid the harshest
              interpretation in some deployments, the administrative burden still rises as it sells into more sensitive
              workflows or publishes more model capability claims.


              The European Commission's FAQ also frames the AI Act as a uniform EU-wide regime whose high-risk
              categories and provider duties sit inside a living implementation process rather than a one-time
              compliance memo. That matters because Code Metal's mission-critical positioning can force customers to ask
              not only whether the product works, but whether disclosures, training-content summaries, labeling, and
              post-market governance will travel with it into regulated programs.


              The legal risk is less about a known active case and more about what the public record does not settle.
              The Copyright Office has made both training-data scrutiny and output copyrightability active policy
              topics: its January 2025 report says purely AI-generated material is not copyrightable absent sufficient
              human control, while a subsequent part is reserved for training, licensing, and liability questions.
              Retained sources still do not disclose the company's training-data provenance, licensed-data posture, or
              how any academic lineage translates into clean commercial IP ownership for generated code, proofs, or
              derivative artifacts. The privacy policy is also only a partial answer because it governs website data
              collection rather than the deeper customer-code, retention, and model-boundary issues enterprise buyers
              will ask about.


              The result is a classic diligence asymmetry: the public story is good enough to explain why investors
              funded the company, but not good enough to close questions on litigation clearance, provenance, or
              product-specific data handling without direct management materials.
            claimRefs:
