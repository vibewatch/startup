      - number: '8.3'
        title: Scenario ranges and comparable boundaries
        blocks:
          - type: paragraph
            body: >-
              Because Code Metal does not disclose revenue, margin, or retention, comparables are best used as range
              boundaries instead of direct pricing formulas. Snyk and Sonar show what late-stage developer or
              code-quality platforms can command once investors can see hundreds of millions of revenue or explicit
              paths toward that scale. Diffblue offers a much smaller AI-for-code reference point, while IBM, Booz
              Allen, and SAIC matter less as valuation multiples than as reminders that large incumbents can absorb the
              same budget from different angles. GrammaTech and Galois show that trust and assurance have value, but
              they do not prove venture-scale software economics for Code Metal. The bull, base, and bear ranges
              therefore rest on milestones rather than faux certainty: audited growth and software leverage for the bull
              case, mixed-quality but real program momentum for the base case, and a repricing toward niche
              contractor-like outcomes for the bear case. Given the present disclosure mix, the base case deserves the
              highest weight, with real bear risk if metrics remain private into the next financing cycle.
