          - type: paragraph
            body: >-
              Public scale evidence is directionally positive but still incomplete. The strongest externally visible
              customer proof is qualitative rather than quantitative: by February 2026, Code Metal and its BusinessWire
              release named Toshiba, RTX, L3Harris, and the U.S. Air Force as customers using the product to move
