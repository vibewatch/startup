      - number: '3.4'
        title: Switching Costs, Substitutes, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Code Metal's moat is promising but not obviously permanent. If a customer adopts it deeply, the switching
              costs should come from translated code assets, target-hardware configuration knowledge, and verification
              workflows tied to specific modernization programs, rather than from classic seat-license lock-in. Those
              costs are meaningful, but they may begin at the project level instead of at company-wide platform scale,
              which gives incumbents time to respond. Internal build is also a real substitute for sophisticated defense
              or semiconductor teams: public academic tooling such as Metalift and general LLM advances make it possible
              for well-resourced engineering organizations to prototype their own translation-and-proof pipelines,
              albeit with heavier integration and maintenance burden. The biggest adverse evidence is structural rather
              than feature-based. GrammaTech and Galois have longer formal-methods reputations, IBM has broader
              modernization and governed-AI reach, Sonar has a far larger developer footprint, and Booz Allen or SAIC
              can win when procurement convenience outweighs product differentiation. Public evidence on realized
              pricing, specific contract vehicles, and direct benchmarked win rates remains thin, so the moat case today
              rests more on logical fit than on abundant public proof of displacement at scale.
