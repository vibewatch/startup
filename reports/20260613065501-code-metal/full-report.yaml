  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Recurring software revenue still unproven
        - Management cannot show ARR, revenue mix, or gross margin progression before the next financing event.
        - Bull case collapses because product leverage remains hypothetical.
        - Stop progression or re-underwrite at a much lower valuation.
      - - Customer concentration too high
        - One or two accounts drive an outsized share of revenue or backlog.
        - Named-logo proof becomes fragile and valuation durability weakens.
        - Treat as concentrated contractor risk, not platform risk.
      - - Investor-linked proof dominates
        - A large share of marquee revenue comes from investor-adjacent customers such as RTX.
        - Reference quality weakens and independent demand looks thinner.
        - Require more independent customer proof before investing.
      - - Services intensity remains high
        - Delivery still depends on heavy forward-deployed or bespoke engineering.
        - Gross-margin and scalability assumptions move toward technical-services outcomes.
        - Cut upside case and widen bear probability.
      - - Procurement conversion stalls
        - Pilots or programs of record do not turn into growing funded deployments.
        - Go-to-market thesis weakens despite technical relevance.
        - Shift to track-only posture.
      - - Next round is flat or defensive
        - Follow-on financing does not clear above the current mark or includes heavy structure.
        - Validates the concern that valuation outran evidence.
        - Use as a thesis-break or hard reset in price expectations.
    notes: >-
      These triggers are monitorable and map directly to the valuation story. They are designed to stop optimism from
      outrunning evidence.
    claimRefs:
      - CV030
      - CV033
      - CV037
      - CV040
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue quality
        - ARR, recognized revenue, and revenue mix by software versus services
        - This is the missing bridge between customer logos and platform valuation.
        - Request CFO or board reporting package plus sample customer P&Ls.
      - - Gross margin path
        - Current gross margin and margin split by product and services
        - Determines whether Code Metal scales like software or like bespoke delivery.
        - Review financial model and cohort economics with finance leadership.
      - - Cash and burn
        - Current cash, quarterly burn, and runway assumptions
        - Shows whether the Series B bought enough time to prove repeatability before the next raise.
        - Request latest balance sheet, cash forecast, and board runway plan.
      - - Cap table and preferences
        - Series A/B terms, liquidation preferences, secondary, debt, and pro rata rights
        - Headline valuation can overstate true return potential if structure is heavy.
        - Review financing docs and full cap table.
      - - Customer concentration
        - Top-10 customer share and investor-linked revenue share
        - Validates the independence and durability of current demand proof.
        - Request cohort tables and customer concentration schedule.
      - - Backlog and conversion
        - Funded backlog, renewal profile, and pilot-to-production conversion
        - Separates encouraging logos from durable monetization.
        - Request pipeline and backlog review by account.
      - - Competitive displacement
        - Win-loss evidence versus IBM, Snyk, Sonar, services primes, and internal build
        - Sharpens both upside probability and moat durability.
        - Review procurement decks, anonymized loss notes, and references.
      - - Proof of reuse
        - Evidence that later projects need less custom engineering than early ones
        - This is the crux of software leverage and margin expansion.
        - Review implementation timelines, reusable modules, and gross-margin cohorts by deployment vintage.
    notes: >-
      Every ask is tied to a specific underwriting uncertainty rather than generic curiosity. If management cannot
      answer these, the current valuation should remain a tracking item rather than an investment conviction.
    claimRefs:
      - CV035
      - CV038
      - CV039
      - CV040
      - CV041
