      - number: '1.3'
        title: Funding History, Investor Map, and Strategic Overlap
        blocks:
          - type: paragraph
            body: >-
              The disclosed funding path is unusually fast for a company founded in 2023. In July 2024, Code Metal
              announced a $13 million seed led by Shield Capital and disclosed a prior $3.45 million pre-seed led by J2
              Ventures. In November 2025, the company announced a $36.5 million Series A led by Accel at a $250 million
              valuation, while CNBC independently covered the same financing at roughly $36 million, suggesting press
              rounding rather than a different round. In February 2026, Code Metal announced a $125 million Series B led
              by Salesforce Ventures at a $1.25 billion valuation, with BusinessWire, Wired, and follow-on trade
              coverage broadly matching the headline. Summing the disclosed rounds yields about $177.95 million of
              publicly visible financing, although that total is arithmetic rather than a company-published
              lifetime-capital figure. The investor mix matters strategically. Defense-oriented backers such as Shield,
              J2, Overmatch, and RTX sit alongside enterprise-software investors such as Accel, B Capital, Salesforce
              Ventures, and Smith Point. That composition can help hiring, customer access, and procurement credibility,
              but it also introduces overlap risk in diligence. RTX is both a named investor and a named customer in
              public materials; Bosch Ventures is a strategic industrial investor, but public sources in hand do not
              show whether Bosch is also an operating customer. The cap table therefore appears strategically useful,
              but not cleanly independent from commercial proof points.
