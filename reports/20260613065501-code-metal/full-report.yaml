      - number: '4.2'
        title: 'Traction and GTM proxies: visible logos, strategic investors, and high-touch sales indicators'
        blocks:
          - type: paragraph
            body: >-
              Public traction is more credible than a typical pre-metrics AI infrastructure company, but still
              incomplete. By February 2026 the company and Business Wire named Toshiba, RTX, L3Harris, and the U.S. Air
              Force as customers, and Salesforce Ventures said demand had already pulled Code Metal into programs of
              record across the Air Force and L3Harris. That is stronger than generic pilot language and suggests Code
              Metal is already selling into both enterprise or industrial accounts and government or defense programs.
              The tradeoff is that the public customer list is still short, which means concentration risk cannot be
              dismissed from public evidence alone.

              Go-to-market signals point to a long-cycle, partner-assisted enterprise motion rather than efficient
              bottom-up adoption. The careers page lists a Facility Security Officer, Forward Deployed Engineer,
              Principal Solutions Architect, and senior platform roles, all of which fit a motion involving procurement
              review, security handling, and bespoke deployment on customer hardware. The official Series B use-of-funds
              statement also prioritized expanding commercial and government partnerships, while the investor syndicate
              combines enterprise-software backers such as Salesforce Ventures, Accel, and B Capital with defense- and
              strategic-oriented names such as RTX, Shield, J2, and Overmatch. That mix likely helps introductions,
              procurement credibility, and channel access, even if the exact partner economics are undisclosed.

              The sales-efficiency question remains open because no CAC, payback, win-rate, or cycle-time metric is
              public. Still, the combination of programs-of-record language, defense-oriented hiring, and strategic
              investor overlap makes it reasonable to infer that sales cycles are long and expensive, and that partner
              relationships may be part of the efficiency story. If that is correct, then the next step in diligence is
              not to guess SaaS-style efficiency ratios but to determine how much revenue each high-touch deployment can
              unlock, retain, and expand once the initial migration work is complete.
