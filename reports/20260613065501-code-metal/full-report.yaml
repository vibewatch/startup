companyProfile:
  summary: >-
    Code Metal is a Boston-based private software company founded in 2023 that sells verifiable code translation and
    optimization for mission-critical systems. Its product narrative combines LLM-assisted translation with
    formal-methods-style proof generation and hardware-aware deployment, aimed at legacy and performance-sensitive
    software estates across defense and regulated industry. Public proof is strongest on financing momentum and a small
    set of named accounts, while the core diligence question is whether today's high-touch deployments can become
    durable software economics at scale.
