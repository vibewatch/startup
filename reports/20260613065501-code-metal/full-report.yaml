              needed to verify whether Code Metal holds direct federal paper. Investor-customer overlap further muddies
              reference quality: RTX is a funder and a named customer, while J2 Ventures and Shield Capital add more
              partner-owned surface area to the external narrative without supplying customer-authored proof. The net
              conclusion is constructive on relevance but cautious on durability. Public evidence proves that Code Metal
              has landed credible reference accounts; it does not yet prove diversified, independently verified,
