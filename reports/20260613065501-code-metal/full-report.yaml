      - number: '2.4'
        title: Growth drivers, certification friction, and market limits
        blocks:
          - type: paragraph
            body: >-
              Several forces push this market forward. Hardware churn is real: Code Metal’s own portability writing is
              explicitly about what it takes to move CUDA workloads off NVIDIA or move legacy code onto newer
              accelerators, and investor materials frame infrastructure debt in defense, semiconductor, and aerospace
              systems as a compounding problem. At the same time, security and trust requirements are tightening. CISA
              and NSA recommend memory-safe approaches for national security systems and critical infrastructure, while
              NIST is extending trustworthy-AI guidance toward critical infrastructure operations. Those pressures
              increase the value of tooling that can modernize code without sacrificing evidence of correctness.


              The constraints are equally important. DARPA’s ARCOS program states directly that current DoD
              certification practices are antiquated and unable to scale because they rely on human evaluators and
              poorly decomposed evidence. DoDI 5000.87 and the broader software-modernization plan encourage iterative
              delivery, but they also confirm that defense adoption runs through programmatic gates, operational
              acceptance, and ongoing oversight. Technical scalability is not proven either: Code Metal’s own
              translation papers show domain-specific gains, but broader research such as UniPar still reports modest
              compilation and correctness rates for complex parallel-code translation, and empirical work on
              Copilot-generated code finds material security weaknesses. The result is a market with genuine demand but
              unresolved proof burdens: integration into messy legacy repositories may stay services-heavy, and the
              commercial upside depends on proving that verification economics scale beyond bespoke pilots.
