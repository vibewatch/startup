        blocks:
          - type: paragraph
            body: >-
              The trust case is real but narrower than the headline suggests. Official and investor materials repeatedly
              stress mathematical proof, validation, compliance, and production-readiness, and the company's
              formal-methods explainer usefully clarifies why that matters: testing alone cannot establish the absence
              of bugs. Still, the public proof boundary is not fully specified. The retained sources support claims
              about behavioral preservation for selected translations and about validated kernels in benchmark settings,
              but they do not publish a proof-coverage ratio, a failure-mode taxonomy for solver timeouts, or a clear
              explanation of which properties are always proven versus which are only tested heuristically. The research
              history also provides adverse evidence. Tenspiler's complexity sensitivity and manual rule-building burden
              show why purely symbolic methods do not scale automatically. UniPar and gpuFLOPBench show that LLM-driven
              code reasoning remains brittle on parallel and mathematically messy workloads, which is exactly why Code
              Metal needs structured workflows and proof machinery in the first place. Finally, the privacy policy is
              the only explicit public security control surfaced here; it promises reasonable measures but no absolute
              guarantee, and the reviewed pages do not disclose SOC 2, ISO 27001, FedRAMP, or a public status page.
