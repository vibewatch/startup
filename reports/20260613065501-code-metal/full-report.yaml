      - number: '7.4'
        title: Financial risk, mitigations, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Financially, the biggest risk is opacity at a price point that no longer tolerates much ambiguity. Public
              sources confirm repeated capital formation and a rapid move from a $250 million Series A to a $1.25
              billion Series B valuation, but they do not disclose ARR, gross margin, burn, retention, or revenue mix.
              That leaves investors relying on a narrative of strong contracts and elite technical differentiation
              without being able to prove that the business already behaves like scalable software.


              The mitigations are real but incomplete. Formal-verification lineage, mission-critical positioning, and
              access to defense-oriented investors reduce go-to-market friction and help explain the funding pace. They
              do not, however, substitute for deployment-quality metrics, customer diversification, or a clear
              services-to-platform conversion. The burden of proof now sits on whether named reference accounts broaden
              and whether support effort declines as the installed base grows.


              The cleanest monitoring framework is simple: watch compliance friction, reliability evidence, customer
              breadth, delivery intensity, and the next financing or internal-mark signal. If trust work, services load,
              or procurement delay overwhelm the speed advantage, the investment case breaks before the technology story
              does.
