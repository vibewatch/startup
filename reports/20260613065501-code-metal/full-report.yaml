      - number: '8.4'
        title: Recommendation, entry discipline, and final asks
        blocks:
          - type: paragraph
            body: >-
              The evidence-constrained answer is not to reject the company outright, but also not to underwrite the
              current valuation casually. Code Metal has enough technical differentiation, customer relevance, and
              financing support to justify serious diligence. What it does not yet have in public is the KPI
              transparency required for a buy call at $1.25 billion. The recommended posture is research-more with
              medium confidence, a high risk rating, and an expensive valuation stance. That means price sensitivity
              matters: either the next engagement needs a materially better entry point, or management needs to open a
              data room that proves recurring software revenue, margin structure, customer diversification, and
              cap-table economics. The key thesis-break condition is simple. If the company reaches the next financing
              milestone without showing that named demand is turning into repeatable software economics, then the
              current unicorn mark should be treated as fragile rather than self-validating. Final diligence should
              therefore stay focused on revenue quality, financing terms, customer concentration, and proof that
              verification-led delivery is becoming a scalable product rather than a bespoke service wrapper.
