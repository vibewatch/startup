evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, investor-rights summary, and ownership/control overview.
    whyItMatters: >-
      Without formal governance disclosure, it is difficult to assess oversight, control concentration, and how much
      authority the new COO actually has.
    diligencePath: >-
      Request the current board deck, cap-table summary, and any board-observer or protective-provision schedules from
      the company.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Independent evidence for current revenue, ARR, backlog quality, and how much of the eight-figure claim converted
      into realized recurring revenue.
    whyItMatters: >-
      The valuation case relies in part on growth narrative, but public sources do not show audited or independently
      checked commercial performance.
    diligencePath: >-
      Obtain monthly revenue bridge data, major contract summaries, and auditor or board-reported KPI packs for
      2025-2026.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An exact current employee count and functional breakdown by engineering, research, go-to-market, and operations.
    whyItMatters: >-
      Hiring velocity is visible, but current organizational scale is not, limiting assessment of burn, delivery
      capacity, and management span.
    diligencePath: Request an HRIS employee census or payroll-backed headcount snapshot as of the diligence date.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: forbes-coverage-timing
    missingEvidence: The underlying Forbes article URL and publication date for the company's retained Forbes landing page.
    whyItMatters: >-
      The page is a weaker milestone anchor without metadata, so it should not be used as a dated market-validation
      event.
    diligencePath: Retrieve the original Forbes article link or CMS metadata directly from Code Metal's communications team.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: financing-structure
    missingEvidence: >-
      Any public disclosure of venture debt, secondaries, liquidation-preference terms, or structured financing
      components beyond the named rounds.
    whyItMatters: >-
      Public round sizes alone do not show whether headline capital maps cleanly to primary cash, founder liquidity, or
      embedded downside protections.
    diligencePath: >-
      Request round term sheets, Form D attachments if any, and a capital-stack summary from counsel or finance
      leadership.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A public standalone market study that isolates verified code modernization for mission-critical and
      hardware-coupled software.
    whyItMatters: >-
      Without a category-native market study, TAM claims depend on wedges from broader modernization and security
      markets.
    diligencePath: Request analyst reports, procurement datasets, or customer budget disclosures that isolate this workflow category.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-model
    missingEvidence: >-
      Public contract values, ACVs, conversion rates from pilot to scaled deployment, and retention data for Code
      Metal-like programs.
    whyItMatters: Budget-motion and SOM estimates stay low-confidence until commercial conversion data are visible.
    diligencePath: Ask management for anonymized contract ladders, win rates, renewal data, and services-to-software revenue mix.
    relatedQuestionRefs:
      - QM014
      - QM027
  - type: missing-source
    severity: material
    topic: verification-scalability
    missingEvidence: >-
      Independent benchmarks showing proof throughput, defect reduction, and labor savings on very large mixed-language
      repositories.
    whyItMatters: The core moat depends on verification and transpilation scaling beyond narrow demos or case studies.
    diligencePath: >-
      Seek third-party benchmarks, customer references, or audit artifacts covering repo size, architecture breadth, and
      certification outcomes.
    relatedQuestionRefs:
      - QM024
      - QM023
  - type: missing-source
    severity: minor
    topic: procurement-friction
    missingEvidence: >-
      Program-level evidence on how quickly defense pilots move through acceptance and procurement into programs of
      record.
    whyItMatters: >-
      Procurement-cycle length affects revenue timing and whether the market behaves like software or long-duration
      services.
    diligencePath: >-
      Interview prime contractors and program-office users about evaluation timelines, security reviews, and funding
      milestones.
    relatedQuestionRefs:
      - QM022
      - QM010
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public realized pricing, contract values, or TCO case studies for Code Metal, IBM, GrammaTech, Galois, Diffblue,
      Snyk, Sonar, Booz Allen, and SAIC.
    whyItMatters: >-
      Without realized pricing artifacts, public comparison can only judge contract model and price transparency, not
      actual relative cost.
    diligencePath: >-
      Request customer-facing pricing sheets, procurement records, or anonymized contract examples from management and
      compare them to incumbent alternatives.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: procurement-channels
    missingEvidence: >-
      Public documentation naming the specific defense contract vehicles or channel partners that help Booz Allen or
      SAIC compete in the exact workflows Code Metal targets.
    whyItMatters: >-
      Contract-vehicle evidence would convert a plausible procurement threat into a directly documented competitive
      channel risk.
    diligencePath: >-
      Pull agency award notices, GSA schedule references, or customer procurement records for comparable AI
      modernization work.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: benchmarks
