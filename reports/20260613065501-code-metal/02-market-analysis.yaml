  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A public standalone market study that isolates verified code modernization for mission-critical and hardware-coupled software.
    whyItMatters: Without a category-native market study, TAM claims depend on wedges from broader modernization and security markets.
    diligencePath: Request analyst reports, procurement datasets, or customer budget disclosures that isolate this workflow category.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-model
    missingEvidence: Public contract values, ACVs, conversion rates from pilot to scaled deployment, and retention data for Code Metal-like programs.
    whyItMatters: Budget-motion and SOM estimates stay low-confidence until commercial conversion data are visible.
    diligencePath: Ask management for anonymized contract ladders, win rates, renewal data, and services-to-software revenue mix.
    relatedQuestionRefs:
    - QM014
    - QM027
  - type: missing-source
    severity: material
    topic: verification-scalability
    missingEvidence: Independent benchmarks showing proof throughput, defect reduction, and labor savings on very large mixed-language repositories.
    whyItMatters: The core moat depends on verification and transpilation scaling beyond narrow demos or case studies.
    diligencePath: Seek third-party benchmarks, customer references, or audit artifacts covering repo size, architecture breadth, and certification outcomes.
    relatedQuestionRefs:
    - QM024
    - QM023
  - type: missing-source
    severity: minor
    topic: procurement-friction
    missingEvidence: Program-level evidence on how quickly defense pilots move through acceptance and procurement into programs of record.
    whyItMatters: Procurement-cycle length affects revenue timing and whether the market behaves like software or long-duration services.
    diligencePath: Interview prime contractors and program-office users about evaluation timelines, security reviews, and funding milestones.
    relatedQuestionRefs:
    - QM022
    - QM010
