- id: sizing-lenses
  title: Sizing with evidence-constrained lenses rather than one headline TAM
  body: 'Public evidence supports sizeable adjacent budgets but not one clean published TAM for verified AI code modernization. The broadest commercial lens is legacy application modernization: Grand View Research estimates a USD 17.8 billion global market in 2023 growing to USD 52.46 billion by 2030, driven partly by the high maintenance cost and operational drag of legacy applications. A second adjacent lens is software assurance and code security: Mordor Intelligence estimates the application security market at USD 14.83 billion in 2026 and USD 28.11 billion by 2031, with scanning increasingly embedded into continuous integration pipelines. Those figures are too broad for Code Metal’s wedge, but they show that modernization and verification already command real budget categories.


    A third lens is mission-critical modernization inside defense and regulated engineering organizations. Official DoD documents do not publish a clean line item for Code Metal’s exact category, yet they do show software modernization and rapid secure delivery as strategic priorities. Because the public record lacks standalone pricing, contract volumes, or procurement-conversion data for verifiable code-translation platforms, the most defensible estimate is a wedge analysis rather than false precision: roughly USD 0.6-1.8 billion of near-term annual spend appears plausible for the serviceable market spanning defense primes, government software programs, semiconductor platform teams, and industrial or aerospace OEM software groups; a broader USD 1.8-4.5 billion opportunity becomes plausible only if buyers fund both migration and ongoing verification across many architectures and programs. The uncertainty is material and should be preserved, not averaged away.'
