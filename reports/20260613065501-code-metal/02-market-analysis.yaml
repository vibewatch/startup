      label: Legacy code pain
      detail: A program or platform team faces aging code, hardware lock-in, or toolchain debt.
      tone: warning
    - id: step-2
      label: Pilot modernization scope
      detail: Vendor and buyer choose a bounded kernel, module, or subsystem for translation.
      tone: neutral
    - id: step-3
      label: Verification and security evidence
      detail: Outputs must satisfy quality, trust, memory-safety, and program-risk concerns.
      tone: neutral
    - id: step-4
      label: Integration into build and runtime stack
      detail: Toolchains, accelerators, test harnesses, and deployment environments must be wired in.
      tone: neutral
    - id: step-5
      label: Program or operational acceptance
      detail: Defense and regulated buyers require acceptance gates before scaled release.
      tone: warning
    - id: step-6
      label: Scaled roll-out
      detail: Budget expands only after the pilot proves savings, safety, and delivery speed.
