company:
  name: Code Metal
chapter:
  number: 6
  title: Customers
  summary: 'Code Metal''s customer proof is strongest on a short list of defense and industrial logos, not on broad public retention disclosure. Official and investor-linked sources repeatedly name RTX, L3Harris, the U.S. Air Force, Toshiba, and earlier X-Press Feeders/HICO logistics work, while hiring and pricing signals imply a high-touch enterprise/government motion. What remains missing is the evidence that matters for durability underwriting: independent customer case studies, public renewal metrics, disclosed contract values, and procurement records that verify programs-of-record claims beyond company and investor statements. Retained USAspending and SAM search pages still do not tie the Air Force or defense-prime narrative to award-level records, and additional J2 Ventures and Shield Capital surfaces underline how much of the external narrative still flows through aligned backers rather than customer-authored proof.'
sections:
- id: segmenting-buyer-classes-and-proof-surfaces
  title: 'Customer map: public evidence points to four real buyer buckets, plus one still-unnamed semiconductor class'
  body: 'Code Metal''s public customer story is not one monolithic enterprise bucket. The retained sources support at least five distinct demand surfaces: defense primes such as L3Harris and RTX; direct government buyers or programs centered on the U.S. Air Force; semiconductor or platform teams that need code portability across chips and toolchains; industrial or electronics accounts represented most clearly by Toshiba; and earlier logistics or edge operators represented by X-Press Feeders and HICO-linked testimony. The homepage and product pages reinforce why these segments cluster around the company: buyers care about verified translation, target-hardware configuration, and production readiness in environments where software failure has safety, compliance, or mission consequences. That buyer mix also implies a non-self-serve motion. Careers openings for a Facility Security Officer, Forward Deployed Engineer, Principal Solutions Architect, and on-prem or cloud platform roles are far more
    consistent with long, integration-heavy selling than with low-friction PLG adoption. The practical read is that segmentation is visible, but the book of business still appears narrow and specialized rather than broadly diversified.'
