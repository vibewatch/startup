- id: TU006
  title: Customer evidence quality table
  columns:
  - Proof surface
  - Example
  - Source basis
  - What it proves
  - What it does not prove
  - Current read
  rows:
  - - Official named-customer release
    - Series B release naming Toshiba, RTX, L3Harris, and U.S. Air Force
    - Code Metal plus Business Wire
    - The company is willing to attach its name to specific accounts
    - Does not prove renewal, contract size, or production depth
    - Useful baseline proof, not enough for durability underwriting
  - - Investor thesis / portfolio post
    - Salesforce Ventures and B Capital customer writeups
    - Investor / partner sources
    - Sophisticated backers see real adoption and strategic relevance
    - Investors are not disinterested customer witnesses
    - Helpful corroboration but still aligned with financing narrative
  - - Customer-quoted proof
    - HICO-linked quote about logistics network transformation
    - Seed-stage company release
    - At least one outside user-style voice exists in the public pack
    - It is older, not clearly representative of current core defense accounts
    - Best direct testimonial, but thin and stale relative to 2026 scale claims
  - - Independent press
    - Wired and CNBC reporting on customers, pricing, and account mix
    - Independent news
    - Third-party reporters could verify enough to print named customer set and pricing commentary
    - Press still depends heavily on management interviews and does not publish renewal data
    - Good corroboration for existence, weak for account economics
  - - Official web surface
    - Homepage, product, research, and media-amplification posts
    - Company website
    - The company openly markets regulated, hardware-specific use cases
    - The site does not offer a deep customer-story library or review surface
    - Evidence surface is more product- and fundraising-led than case-study-led
  - - Public procurement / operating record
    - USAspending and SAM search pages did not surface a usable award file or direct program documentation in the retained pack
    - Absence across retained public sources plus generic federal search surfaces
    - Shows where diligence still needs primary documents
    - Does not disprove customer activity, only limits external verification
    - Largest remaining gap for government-proof quality
  notes: Rows grade the quality of public customer proof, not the quality of the customers themselves.
