  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Segment-level NRR, GRR, churn, renewal rate, and median contract term.
    whyItMatters: Without these metrics, the customer chapter cannot distinguish sticky platform revenue from project-led services revenue.
    diligencePath: Request cohort retention tables and renewal schedules by defense, government, semiconductor, and industrial segments.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU027
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: independent-customer-proof
    missingEvidence: Independent customer case studies, review surfaces, or direct customer-authored technical talks for current flagship accounts.
    whyItMatters: The current proof set is heavily mediated by company and investor statements, and additional J2 Ventures and Shield Capital surfaces still add backer-owned narrative rather than customer-authored proof.
    diligencePath: Request three current customer references and locate any customer conference talks, review listings, or procurement-facing implementation documents.
    relatedQuestionRefs:
    - QU019
    - QU020
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: government-procurement-record
    missingEvidence: Award IDs, program names, contract vehicles, and prime/subcontract position for U.S. Air Force and defense-prime work; retained USAspending and SAM search pages do not close that gap on their own.
    whyItMatters: Programs-of-record language is important, but even retained USAspending and SAM search pages do not verify contract structure or funded scope.
    diligencePath: Request contract identifiers, search agency award systems with those identifiers, and confirm whether Code Metal is prime, subcontractor, or embedded vendor.
    relatedQuestionRefs:
    - QU004
    - QU010
    - QU024
    relatedTableRefs:
    - TU003
    - TU006
  - type: private-evidence-only
    severity: material
    topic: concentration-mix
    missingEvidence: Top-customer revenue concentration, total active customer count, and revenue split by defense, government, semiconductor, and industrial segments.
    whyItMatters: A short public logo list can coexist with either healthy diversification or extreme concentration; the difference matters directly for underwriting risk.
    diligencePath: Request top-5 customer concentration, number of active accounts, and bookings or ARR by segment.
    relatedQuestionRefs:
    - QU021
    - QU027
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: unnamed-semiconductor-customer
    missingEvidence: Identity and stage of the unnamed large chip company referenced in press coverage.
    whyItMatters: A disclosed chip-platform account would materially strengthen the semiconductor-platform buyer thesis and commercial diversification case.
    diligencePath: Ask management to name the chip-platform customer or provide a referenceable anonymized case study with deployment scope and KPI.
    relatedQuestionRefs:
    - QU013
    - QU025
    relatedTableRefs:
    - TU001
    - TU005
