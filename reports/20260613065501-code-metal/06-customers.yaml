- id: named-proof-and-adoption-proxies
  title: 'Named proof: the logos are real, but most public evidence still comes from company and investor channels'
  body: 'The chapter''s strongest positive signal is that Code Metal does publicly name real accounts rather than relying only on anonymous enterprise references. The February 2026 Series B release and Business Wire version both name Toshiba, RTX, L3Harris, and the U.S. Air Force, while Salesforce Ventures says demand has already pulled the company into programs of record across the Air Force and L3Harris. The November 2025 Series A release adds a more concrete L3Harris performance datapoint, with Shield Capital saying Code Metal sped code translation from weeks to days across several projects. The July 2024 seed announcement adds two older but still relevant proof surfaces: strategic partnerships with L3Harris and X-Press Feeders, plus a direct testimonial from HICO''s Chris Hartnoll about Code Metal changing how intelligence is built into a logistics network. That said, proof quality is uneven. RTX is both investor and named customer, which weakens its value as a clean third-party reference.
    Toshiba is named, but no public user quote, case study, or outcome metric was found. For the Air Force, the public pack supports interest and likely operational relevance, but not contract IDs, award dollars, or direct program documentation; retained USAspending and SAM search pages did not by themselves expose an award trail. Additional J2 Ventures and Shield Capital surfaces reinforce that many accessible third-party channels still sit inside the backer ecosystem rather than inside customer-authored documentation.'
