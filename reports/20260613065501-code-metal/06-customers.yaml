tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / strategic value
  - Revenue or strategic read
  - Gap
  rows:
  - - Defense primes
    - Prime contractor engineering or mission-software team buys; developers and program leads use; program budget pays
    - Porting, validating, and optimizing code for mission systems or edge hardware
    - 'Named proof: L3Harris and RTX'
    - Highest strategic credibility because defense programs are reference-rich if they convert
    - Direct customer quotes, contract size, and prime vs subcontract status are not public
  - - Government buyers / programs
    - Government program office or Air Force-linked buyer pays; operators and software teams use
    - Modernization and verification in mission-critical environments
    - 'Named proof: U.S. Air Force plus programs-of-record language'
    - Potentially large ACVs and long life cycles if system-of-record placement is real
    - No public award IDs, program numbers, or budget lines were retained
  - - Semiconductor / platform teams
    - Platform, compiler, or enablement team would buy; internal developers use; engineering budget pays
    - Port code across chip platforms, accelerators, and toolchains
    - Public evidence shows semiconductor deployments plus talks with a large unnamed chip company
    - Could become sticky because portability and verification tie into target hardware choices
    - No named chip customer or independent semiconductor case study is public
  - - Industrial / electronics enterprises
    - Industrial software team or electronics OEM pays; engineering teams use
    - Move production code across runtimes while preserving safety and performance
    - Named proof is concentrated in Toshiba and generalized industrial positioning
    - Useful for non-defense diversification and commercial credibility
    - No outcome metric, scope detail, or testimonial beyond naming the logo
  - - Logistics / edge operators
    - Operator or incubator-backed deployment owner pays; operations and product teams use
    - Edge-development workflows and intelligence in logistics network
    - Older proof from X-Press Feeders and HICO-linked testimonial
    - Shows the company could serve real industrial workflows before the later defense-heavy narrative
    - It is an early 2024 proof point and may not map cleanly to the later code-translation core motion
  notes: Rows separate who pays, who uses, and what the public proof actually covers so logos are not mistaken for homogeneous customer economics.
