- id: durability-and-expansion-what-is-known
  title: 'Durability: likely sticky if deployments land, but public retention evidence is still mostly absent'
  body: 'Public evidence is directionally positive on durability but weak on direct measurement. The favorable side is structural: Code Metal sells into accounts that appear to care about hardware-specific deployment, formal verification, and regulated or mission-critical outcomes. If a customer has already configured translation plans around its CPUs, GPUs, FPGAs, toolchains, or security constraints, then switching away should be expensive in time, engineering attention, and re-validation. Independent technical and policy sources help explain why. The LLMLift and Tenspiler work, along with DARPA and NIST material, all reinforce that translation into specialized runtimes or high-assurance environments is hard, bug-prone, and validation-heavy. That creates the possibility of long-lived, high-value accounts if the first deployment works. But the public record does not let an investor jump from plausible stickiness to proven retention. There is no public NRR, GRR, churn, contract-length, renewal,
    expansion-rate, or cohort disclosure. The best available proxies are weaker: L3Harris is described as several projects, the Air Force and L3Harris are said to have programs of record, and a low-tier secondary piece relays management''s claim that every deployed pilot moves to the next phase. Those are encouraging signals, not retention accounting.'
