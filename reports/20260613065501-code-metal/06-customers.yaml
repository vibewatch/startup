- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or friction risk
  - Impact
  - Diligence path
  rows:
  - - Government programs of record
    - Procurement cycles may be slow and security-heavy, and retained USAspending/SAM searches do not themselves verify the award trail
    - Can create large durable accounts, but timing and cash conversion may be uneven
    - Obtain award history, buying authority, contract identifiers, and security/compliance steps by account
  - - Defense-prime modernization
    - Few visible logos mean one or two accounts may dominate public proof
    - High revenue concentration risk if prime accounts are still a large share of bookings
    - Request top-5 customer mix and pipeline by prime
  - - Semiconductor portability workflows
    - Named chip customer is still absent from the public pack
    - Good strategic adjacency, but conversion is unproven
    - Request name, stage, and deployment KPI for the unnamed chip-platform account
  - - Industrial / electronics accounts
    - Toshiba broadens the story beyond defense, but only one public electronics logo is named
    - Commercial diversification may be thinner than headline vertical list implies
    - Request additional named industrial customers and proof of repeat deployments
  - - Hardware-specific integration and verification
    - Custom runtimes and toolchains can create sticky deployments once landed
    - Potential upside to retention and expansion if first deployment succeeds
    - Request expansion revenue from follow-on modules, hardware targets, or business units
  - - Investor-customer overlap and PR-mediated proof
    - RTX and investor theses help access but weaken independence of the reference set; J2 and Shield add more partner-owned narrative surface
    - Raises risk of overstating unbiased customer validation
    - Request direct customer references that are not also investors or financial sponsors
  notes: This table separates expansion upside from the evidence gaps that prevent public proof of diversified customer economics.
