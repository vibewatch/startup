evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-disclosure
    missingEvidence: >-
      Audited 2024-2025 revenue, gross margin, burn, cash balance, and NRR figures directly from HiBob management or
      statutory filings.
    whyItMatters: >-
      Current underwriting still depends on third-party ARR estimates and official milestone claims rather than audited
      financial statements.
    diligencePath: >-
      Request management reporting package, board materials, and any jurisdictional statutory accounts that bridge
      revenue growth, margins, and cash burn.
    relatedQuestionRefs:
      - QO006
      - QO016
      - QO024
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: >-
      Current cap table, ownership percentages, liquidation preferences, and committee structure after the 2023
      financing.
    whyItMatters: Investor map and board names are public, but control rights and dilution overhang are not.
    diligencePath: Obtain cap table, financing documents, board observer rights, and side letters from counsel or management.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO023
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A reconciled current customer, user, office-count, and employee baseline as of run date.
    whyItMatters: >-
      Official homepage, 2023 funding release, GetLatka, and Forbes all cite different vintages and values for scale
      metrics.
    diligencePath: >-
      Request a current company fact sheet and reconcile it against CRM account counts, HRIS headcount, and office
      leases.
    relatedQuestionRefs:
      - QO004
      - QO015
      - QO021
    relatedTableRefs:
      - TO002
      - TO004
  - type: missing-source
    severity: minor
    topic: hibob-sam-definition
    missingEvidence: A management-defined SAM or ideal-customer-profile by employee-count band and geography.
    whyItMatters: Public market reports are too broad to directly underwrite HiBob's efficient growth envelope.
    diligencePath: Request internal segmentation by employee band, geography, and current pipeline conversion.
    relatedQuestionRefs:
      - QM006
      - QM021
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Current HiBob list pricing, discount bands, and average contract value by segment.
    whyItMatters: Without pricing disclosure it is hard to bridge TAM to monetizable SAM and estimate win-rate economics.
    diligencePath: Collect recent quotes, order forms, and package matrices across SMB, mid-market, and multinational customers.
    relatedQuestionRefs:
      - QM012
      - QM019
      - QM022
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: One apples-to-apples external market frame that isolates the exact cloud HCM slice relevant to HiBob.
    whyItMatters: Public sources disagree because some include payroll, services, talent, or adjacent workflow categories.
    diligencePath: >-
      Build a bottoms-up SAM from employee-count targets, ACV assumptions, and geographic mix instead of relying on one
      syndicated report.
    relatedQuestionRefs:
      - QM001
      - QM005
  - type: missing-source
    severity: minor
    topic: hibob-public-pricing
    missingEvidence: A public HiBob price sheet or range by seat band and module.
    whyItMatters: Public pricing transparency is one of the clearest practical buyer-side advantages held by smaller rivals.
    diligencePath: Obtain recent HiBob quotes and compare them to BambooHR, CharlieHR, Factorial, and Lattice seat economics.
    relatedQuestionRefs:
      - QP010
      - QP021
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: Segmented win/loss data versus Rippling, Workday, BambooHR, and local payroll-led alternatives.
    whyItMatters: Public pages show positioning but not where HiBob actually wins or loses by company size and geography.
    diligencePath: Review CRM opportunity outcomes and lost-deal reasons by competitor and seat band.
    relatedQuestionRefs:
      - QP014
      - QP020
      - QP022
  - type: private-evidence-only
    severity: material
    topic: integration-usage-depth
    missingEvidence: Active integration usage, payroll attach rates, and Mosaic cross-sell data.
    whyItMatters: Catalog breadth does not prove that integrations or finance linkage are meaningful buying drivers.
    diligencePath: Request module attach, integration activation, and product-qualified pipeline data.
    relatedQuestionRefs:
      - QP012
      - QP019
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited 2024-2025 revenue, gross margin, revenue mix, and services-load data.
    whyItMatters: >-
      The public growth story is plausible but still relies heavily on estimated revenue rather than audited financial
      output.
    diligencePath: Request audited or board-approved P&L plus revenue by module and geography.
    relatedQuestionRefs:
      - QI006
      - QI018
      - QI023
      - QI013
      - QI014
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt, and runway scenario assumptions.
    whyItMatters: Capital raised historically does not prove current financing independence.
    diligencePath: Request management accounts, cash forecast, debt schedule, and board financing plan.
    relatedQuestionRefs:
      - QI015
      - QI019
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing-and-efficiency
    missingEvidence: List pricing, average contract value, discounting, CAC, payback, and NRR by cohort.
    whyItMatters: Without these metrics it is impossible to judge monetization efficiency and growth quality.
    diligencePath: Collect quote books, sales-efficiency dashboards, and retention cohorts.
    relatedQuestionRefs:
      - QI003
      - QI012
      - QI020
    relatedTableRefs:
      - TI002
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
