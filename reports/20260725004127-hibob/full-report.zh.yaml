companyProfile:
  summary: >-
    HiBob 是一家成立于 2015 年的私营 HR 软件公司，已把 Bob 从现代 HRIS 扩展为更宽的人员运营平台，覆盖薪资、分析、薪酬、人力规划以及与财务相邻的工作流。公开证据支持其已有实质规模：客户数以千计，2023 年披露
    ARR 超过 $100M，并通过收购 Pento 和 Mosaic 持续做战略扩张。公司更像高端多模块平台，而不是窄口径 HR 工具；但从公开证据看，当前财务质量和准确公允价值仍只能部分看见。
