      - number: '7.4'
        title: 战略、收购与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              最后一组风险是战略性的。HiBob 在公开讨论中仍按独角兽定价，但这一基准来自 2023 年融资轮，必须经受不同软件市场、更长私有持有期和收购后执行的考验。公司此后收购了 Pento 和
              Mosaic，可能强化薪资和财务定位，但也制造集成、路线图和进入市场复杂度。英国以色列旅行建议页面凸显了影响以色列运营公司的持续区域不确定性；HiBob 自己的子处理方和关联方披露也确认，除全球办公室外，公司在
              Tel Aviv
              仍有重要足迹。这些都不意味着扰动迫在眉睫，但投资人和大买家应把执行连续性、估值耐久性和跨境运营韧性视为现实风险，而不是抽象提示。私有市场持有期变长，也抬高了无瑕执行的门槛，因为产品蔓延、集成工作和估值预期都必须共存更多年，干净流动性事件才会出现。
