      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最大的采用约束不是 HR 科技是否重要，而是哪一个平台能证明昂贵的记录系统切换值得做。迁移员工记录、权限、工作流、组织结构和薪资集成很难；HiBob、BambooHR 和 Rippling
              的评论与平台页面都强调集中化、自动化和集成，因为买家知道碎片化才是默认痛点。合规复杂性也同时制造需求和摩擦：英国薪资、美国就业税和欧盟数据保护规则，都迫使供应商维持本地专业能力或强伙伴生态。这把市场推向更宽的套件和有防御力的集成层，但也提高实施负担和客户锁定。放到估值上，最相关的品类信号不是顶层
              TAM；而是 HiBob 能否在既有巨头和宽平台把 AI 分析、薪资中心和人力规划常态化为基础功能之前，持续赢下现代中端市场套件。因此，品类结构比泛泛的软件热情更重要。
