      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              HiBob 的产品信息把买方地图讲得异常清楚。HR 拥有核心记录系统和日常员工生命周期。薪资负责人关注数据同步、合规、审计准备和本地处理。财务买方关注编制规划、薪酬成本、流失率，以及 HiBob
              现在营销的三大报表和预测挂钩能力。经理需要绩效、团队情绪和工作流可见性；IT 则要 SSO、集成治理和更少系统蔓延。这种组合形成多利益相关方销售：产品可以从 HR
              现代化、薪资痛点或战略性人力规划切入。近期最强细分仍是快速增长的 SMB 和中端市场雇主；他们觉得企业套件太重，但也不再想要碎片化点状工具。BambooHR、Factorial、CharlieHR 和
              Rippling 的官方页面都验证了这个买方细分已多么拥挤，而 Workday、SAP 和 UKG 继续挤压市场高端。
