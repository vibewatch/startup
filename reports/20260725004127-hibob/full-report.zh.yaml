      - number: '8.3'
        title: 投资人为何仍可能支持溢价
        blocks:
          - type: paragraph
            body: >-
              溢价案例仍有可能成立。HiBob 并不是按成熟薪资处理商估值；它被估为一个快速增长的现代人员平台，带有薪资、分析、薪酬、人力规划和财务相邻扩张。公司按自身披露已跨过 $100M+ ARR，拥有数千客户，并收购
              Pento 和 Mosaic 来加深薪资和财务相关性。来自 Rippling 的竞争者证据也很重要：投资人仍愿意为整合多个预算和高切换成本的一体化劳动力平台支付大额私募市场溢价。如果 HiBob
              确实在以可接受留存和改善利润率维持强增长，其估值可以长期高于公开市场中位数。仅有产品宽度还不够；但当宽度与席位数上升、薪资附加和 CFO
              相邻扩张结合时，投资人可以合理化相对狭义公开薪资软件公司显得激进的倍数。当公司正复合成更大的平台身份，而不只是增加相邻功能时，溢价案例最容易令人相信。
