        title: 进入市场耐久性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              实际进入市场图景因此是强 logo 证明与不完整变现数据的混合。HiBob 显然拥有可识别客户，也有足够产品宽度赢下更深部署，但公开语料没有说明客户中低于 1,000
              名员工账户占比多少、多少收入绑定技术行业，或薪资和财务模块是否实质改变 ACV。做投资工作时，下一步尽调要把展示性 logo
              与产生收入的队列拆开：生产部署、多模块附加、续约行为和特定地域胜率。在这些披露之前，本章能支持客户相关性和采用可信度，但不能支持集中度安全或一流留存经济性。客户质量因此方向上不错，但承销仍需要产生收入的队列证据，而不只是展示性故事。收入质量尽调仍不可少。
