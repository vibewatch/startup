      - number: '7.3'
        title: 客户集中度、市场压力与支持风险
        blocks:
          - type: paragraph
            body: >-
              HiBob 的商业风险与它卖给谁、这些买家期待什么有关。公司强力面向现代、快速增长企业营销，而这个细分可能比成熟企业薪资基础更具周期性。Layoffs.fyi
              继续记录广泛科技裁员；即便具体客户集中度未披露，这个背景对一家与技术型 scaleup 紧密关联的供应商也很重要。评论渠道还显示，产品强度不能消除支持、报表和集成摩擦。G2 和 TrustRadius
              总体称赞易用性，但 G2 也提示导出和集成限制，Trustpilot 则包含更多负面的支持和薪资过渡情绪。在买家可以把 HiBob 与 Rippling、Personio、BambooHR、Workday、SAP
              等比较的市场中，任何支持负担或实施失望都会削弱扩张和续约质量。薪资投诉尤其敏感，因为员工会直接感受到，一次负面薪资事件触达高管的速度会远快于小型管理控制台问题。
