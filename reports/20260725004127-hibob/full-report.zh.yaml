      - number: '2.2'
        title: 规模估算口径与增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估计差异很大，因为各自采用不同边界、地域，以及对薪资、人才和相邻工作流支出的定义。Apps Run The World 将 2024 年全球 HCM 软件市场估为 $58.7B，较 2023 年
              $52.6B 同比增长 11.7%。Grand View Research 使用更宽的 HR 软件口径，称市场在 2023 年为 $16.4B，并预计 2030 年达到 $36.6B。Carlsquare 的
              HCM 技术行业更新给出另一条全球 HCM 市场规模预测：从 2022 年 $24.9B 增至 2032 年 $63.6B，CAGR 约
              10%。这些估算区间差异太大，不能机械平均，但支撑同一个结论：品类足够大，能容纳多个赢家；仍在向云迁移；随着买家把分析、员工福祉、学习和合规工作流接到核心员工记录上，品类还在扩张。混合办公和人员分析仍是耐久需求驱动因素；Carlsquare
              引述称，74% 的美国公司正在使用或计划采用永久混合模式，超过 70% 的雇主用人员分析提升绩效。
