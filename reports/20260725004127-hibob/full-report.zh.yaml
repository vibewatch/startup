    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              HiBob 的公开产品页呈现出典型多模块 SaaS 收入模式：围绕核心记录系统构建，再通过付费工作流扩张。官网首页和平台材料把 Bob 定位为连接核心
              HR、薪资、人才、分析、规划和财务的人员平台。薪资页尤其重要，因为它展示了基础 HRIS
              之外的两条变现路径：美国和英国的原生薪资，以及面向集成提供商的薪资中心。人力规划、薪酬和分析页面表明还有更多可变现模块，能随时间抬高
              ACV。公开定价没有披露，意味着市场可以看到产品宽度和品类逻辑，但看不到清单打包如何转化为实际合同价值。这种变现结构重要，因为它降低了对单一工作流的依赖。客户可以从核心 HR
              起步，再加薪资以捕捉薪酬执行，随后在编制复杂度上升时采用分析或规划。即便没有公开价格，架构也指向一场有意为之的迁移：从单一产品 HR 管理，走向服务劳动力成本决策的更宽运营系统。
