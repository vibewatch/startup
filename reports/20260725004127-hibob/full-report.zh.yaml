            body: >-
              评论渠道同时显示产品喜爱和实施摩擦。G2 强调易用性、员工敬业度和广泛数据集中化，但也浮现出关于导出深度和集成限制的抱怨。TrustRadius 和 Trustpilot
              对报表、支持响应和薪资过渡痛点给出混合反馈；第三方购买指南还指出，部分集成或高级数据访问可能取决于高端打包或专业服务。这些问题都不能推翻产品强度，但确实给营销叙事加上限定：Bob
              看起来强大且可扩展，但买家仍需要弄清连接器深度、报表灵活性、数据可迁移性，以及更复杂部署中的支持负载。最重要的技术未知数仍是基础设施内部、硬性 rate limit 数字、AI 模型依赖和经审计的 uptime
              表现。第二个警示是，marketplace 宽度不自动等于实施简单。有些连接器显然是原生且成熟的，另一些则可能需要高端套餐、专业服务或自定义 API
              工作，才能交付买家预期的最后一公里。这个区分很重要，因为「集成存在」和「集成深到足以支撑企业流程设计」之间的差距，往往就是 HR 系统让技术买家失望的地方。
