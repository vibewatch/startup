      - number: '3.2'
        title: 能力宽度与定价姿态
        blocks:
          - type: paragraph
            body: >-
              HiBob 的公开姿态是范围很宽、但以报价驱动。官网首页、薪资页和集成页合在一起，把 Bob 定位成人员、薪资和财务平台，拥有 marketplace
              集成，以及美国和英国原生薪资。相比之下，BambooHR、CharlieHR、Factorial 和 Lattice 都发布了有意义的定价或席位级线索，降低买方摩擦，也让比价更锐利。Workday、SAP、UKG
              和 Rippling 大多仍采用报价驱动或企业谈判，与更大、更定制化的部署相匹配。这制造了一个重要竞争细节：HiBob 试图销售战略性、多利益相关方平台，同时还要和发布更易进入价格的 SMB
              与中端市场供应商竞争。价格发现问题很重要，因为可见席位价格能让供应商在更深产品评估开始前就进入候选名单。公开定价还改变渠道行为：顾问、经纪人和采购团队不用等供应商发现电话或企业打包研讨，就能比较透明的 SMB
              工具。
