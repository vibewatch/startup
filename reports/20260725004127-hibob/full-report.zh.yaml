      - number: '3.3'
        title: 差异化、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              HiBob 最清晰的差异化，是把可配置的人员核心工作流与薪资、分析和新近强调的财务连接组合在一起。这比 Lattice
              的人才导向姿态更宽，也比仍围绕重量级转型项目展开的企业套件更重体验。但护城河并不干净。Rippling 在薪资和运营软件上延伸得更远；Workday 和 SAP 能在企业规模上把 AI
              和人力规划常态化；BambooHR、Factorial 和 CharlieHR
              等低端供应商则靠简化实施、部分情况下公开价格来竞争。切换成本双向作用：一旦装上，带薪资和集成的记录系统可以很粘；但买家也会因为迁移和数据治理工作痛苦，而犹豫是否离开既有系统。实践中，这意味着客户背调、实施速度和模块附加率，比关于灵活性或文化的营销语言更重要。
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
      - number: '3.4'
        title: 负面竞争映射
        blocks:
          - type: paragraph
            body: >-
              最重要的负面映射，是品类功能正在快速收敛。Rippling 公开材料把 AI、HRIS 和薪资放在一起强调；Workday、SAP 和 UKG 都在传播 AI 和自主
              HR；小型工具也开始发布更低摩擦的定价和模块化入口。这意味着 HiBob 不能只靠现代 UX。它必须持续在薪资执行、分析有用性、跨职能规划和实施结果上取胜。公开定价不透明也是战术弱点，因为买家不用找销售就能对标
              CharlieHR、Factorial、Lattice 和 BambooHR，而 HiBob 仍采用报价驱动打法。最后，HiBob 现在通过 Mosaic 推动
              HR-财务集成这一事实，本身就确认了更宽的平台邻接——而不是独立 HR 管理——才是竞争前沿。因此，竞争映射落在运营上：每当买家比较打包替代方案时，HiBob
              必须证明执行，而不只是证明自己会说品类词汇。在这种功能拥挤度下，销售执行和客户背书会变成决定因素。
