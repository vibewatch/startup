      - number: '7.2'
        title: 安全、数据处理与第三方依赖风险
        blocks:
          - type: paragraph
            body: >-
              HiBob 自己的安全材料语气令人安心，但也让依赖面更清楚。公司称其获得 ISO 27001、ISO 27018 和 SOC 2 Type II 认证，使用位于 Ireland 和 Germany 的 AWS
              数据中心，对传输中和静态数据加密，并运行基于角色的访问控制和经审计的支持访问。与此同时，子处理方页面显示交付中嵌入了多少外部方：AWS、SingleStore、Cloudflare、Zendesk、可选 AI
              供应商、SSO 提供商和移动通知提供商都出现在服务链中。AI 信任中心加入零留存和管理员 opt-out 等更强控制，但也确认 AI 供应商治理现在属于平台信任边界。风险结论很直接：HiBob
              看起来重视安全，但买家仍在承销一张处理高度敏感员工数据的复杂供应商图谱。AI 也是如此：即便政策语言很强，也仍需要检查在真实事故或监管调查中，prompt、输出、可审计性和供应商替换会如何运作。
