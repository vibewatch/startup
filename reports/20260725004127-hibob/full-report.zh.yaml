        title: 公开牵引代理指标及含义
        blocks:
          - type: paragraph
            body: >-
              最清晰的牵引标记来自官方披露与第三方估算的组合。HiBob 在 2023 年 9 月称 ARR 已超过 $100M、客户超过 3,500。GetLatka 将这条序列往后延伸，估计 2023 年收入为
              $82.4M、2024 年收入为 $121.7M，意味着 2023 年融资后仍保持快速增长，即使这些数字并未获公司认证。Forbes 又给出另一种规模视角：客户超过 4,500、用户 1.1M，并称 ARR 从
              2020 年 $10M 爬升至 2025 年 $197M；不过较高的 2025 年数字应视为资料估计，而不是披露运行率。HiBob 官网首页还声称客户获得 254% ROI、九个月内回本，但这是营销效率主张，不是
              GAAP 或董事会级 SaaS 指标。来源之间的不匹配，更应理解为不同报告日期下快速变化的证据，而不是直接矛盾。审慎分析师会锚定官方 ARR 下限，再把外部估计当作方向性区间标记，而不是精确审计值。
