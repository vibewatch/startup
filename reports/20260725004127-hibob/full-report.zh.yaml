      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开记录更能支持 land-and-expand 论点，而不是留存模型。HiBob 官网首页、分析页面和案例研究都强调从核心 HR 扩展到薪资、分析、薪酬、Sandbox 或人力规划。Ualá 明确随着时间增加
              Talent、Compensation、Sandbox 和 Workforce Planning；Waves 在 HRIS 基础上叠加 Teams
              集成。这个模式是正面的，因为它指向模块扩张，而不是单点采用。问题是，保留来源没有披露 NRR、GRR、logo 流失、合同期限或客户集中度。评论来源只能间接提供帮助：G2 和 TrustRadius
              显示仍有活跃使用和产品投入，Trustpilot 则包含一些围绕支持和 Pento
              过渡的投诉，可能影响薪资相关账户的留存。这意味着本章可以支持可信的扩张叙事，却还无法证明一流的留存数学。换句话说，公开证据显示客户有很多理由留下并扩张，但尚未量化初始实施年之后他们实际多常这么做。
