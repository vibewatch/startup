  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值锚点及其限制
        blocks:
          - type: paragraph
            body: >-
              最有防御力的起点，是最后一次官方融资事件。HiBob 在 2023 年 9 月宣布 $150M 融资，并称披露融资总额已达到
              $574M。后来的公开资料仍把公司放在独角兽区间，但不能替代一轮新的定价融资。GetLatka 估计 HiBob 估值约 $2.5B；Forbes 则给出 $2.7B，并同时呈现更大的 2025
              年收入画像。这些数字显示地位延续，而不是新的市场出清交易。这个区别重要，因为在公开 SaaS
              倍数重置很久之后，私营公司估值标记仍可能保持黏性。最安全的解读因此是区间，而不是精确点。像「仍估值为」这样的延续标签，即便在方向上为真，底层市场今天给新一轮定价也可能不同。
            claimRefs:
