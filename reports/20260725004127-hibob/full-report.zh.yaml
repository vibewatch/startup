  - id: TV005
    title: 估值尽调缺口表
    columns:
      - 缺失输入
      - 重要性
      - 下一步所需动作
    rows:
      - - 经审计的 2024-2025 年收入
        - 需要用财务级证据替代简介类估算
        - 索取经审计报表或董事会材料包
      - - 按模块拆分的毛利率
        - 判断薪资和服务是否拉低软件质量
        - 索取按模块拆分的毛利率桥表
      - - NRR / 流失率 / 队列扩张
        - 最能说明溢价倍数是否能守住
        - 索取按地区和客群拆分的队列表
      - - 现金 / 烧钱 / 跑道
        - 影响谈判筹码和融资时点压力
        - 索取最新现金预测和融资计划
      - - 当前 409A / 董事会估值桥
        - 说明 2023 年以来内部估值标记是否变化
        - 索取估值备忘录和假设
      - - 股权类别、优先权和二级交易背景
        - 公告估值可能高估普通股权益价值
        - 索取股权结构表和最新交易细节
    notes: 在披露这些输入之前，公开估值只能做区间分析，不能给出最终标记。
