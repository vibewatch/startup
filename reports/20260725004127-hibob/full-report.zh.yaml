            body: >-
              当一个 logo 与运营结果配对时，HiBob 的公开证明最强。Ualá 用 Bob 替换电子表格、集中人员数据、支持远程入职，后来又延伸到 Talent、Compensation、Sandbox 测试和
              Workforce Planning；与此同时，公司扩张到 1,600 名员工并完成多笔收购。Waves 使用 Bob 和 Microsoft Teams 集成，每月自动化超过 100
              小时行政工作，并维持六个站点的远程协同。Xplor 向 2,200 名员工推出 Bob；Kustomer 用 Bob 改善入职和绩效管理体验；Fiverr 在整个员工生命周期使用
              Bob。这些故事由公司撰写，天然带有证实性质，但确实显示 Bob
              已越过试点状态，并部署到多个模块。几个最强案例研究还显示跨职能使用：HR、薪资、经理和领导层都用同一数据模型做决策，而不是维护各自的旁路表格。有规模。很清楚。也持续。
