  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 按竞争者类型划分的格局
        blocks:
          - type: paragraph
            body: >-
              市场分成三大类。第一类是 Workday、SAP SuccessFactors 和 UKG 这类企业套件，带来宽 HR、薪资和工作流深度，以及重量级分销。第二类是 HiBob、Rippling、BambooHR
              和 Factorial 这类现代套件平台，瞄准想要可配置记录系统、但不想承担传统套件负担的买家。第三类是 Lattice 这类人才或工作流相邻产品，以及 CharlieHR
              这种小企业优先工具，它们能赢下更窄用例或更小账户。由此可见，HiBob 很少只在单一功能上竞争；通常比的是套件设计、实施灵活性，以及买家只要
              HR，还是要一个更宽、触达薪资、分析、财务和经理的运营层。买家还会评估一个套件能否直接服务经理，而不只是 HR 管理员，因为这会影响采用和续约。地域同样重要：CharlieHR 以英国为中心，Factorial
              偏欧洲，Workday 或 SAP 则能陪全球账户走到更高端市场。这种分层仍在。仍然。
