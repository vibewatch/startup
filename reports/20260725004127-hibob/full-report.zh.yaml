      - number: '8.2'
        title: 隐含倍数相对当前软件基准
        blocks:
          - type: paragraph
            body: >-
              把 HiBob 过时的估值锚点与可用收入代理指标一比，溢价就很明显。按 GetLatka 对 2024 年收入 $121.7M 的估计，$2.45B 至 $2.7B 估值意味着收入倍数约 20x 至 22x。如果
              Forbes 更高的 2025 年画像方向正确，隐含倍数会显著下降，但仍高于许多公开 HCM 和薪资同行。Workday、Paycom、Paylocity 和 Dayforce
              提供了有用的公开市场参照：它们规模更大、披露更多，且若干公司更盈利，但在当前市场数据中的收入倍数明显更低。更宽的 SaaS
              基准来源也显示，公共云指数处于中个位数，经过流动性和信息折价后，会转化为更低的私下实际定价。这个缺口不自动说明私有估值是错的。它说明 HiBob
              正被另一套预期衡量：更高增长、更少披露，以及投资人希望在流动性到来前逐步长成更大品类位置的战略平台论点。
