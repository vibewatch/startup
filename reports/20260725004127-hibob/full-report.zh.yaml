  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、薪资与就业数据风险
        blocks:
          - type: paragraph
            body: >-
              薪资和就业数据，是 HiBob 产品雄心最直接放大风险的两个区域。公司正在扩张薪资和财务相邻功能，而雇主同时在其服务的每个司法辖区面对严格税务、申报和隐私义务。IRS
              指引显示，美国雇主必须准确、按时缴纳和申报就业税；HMRC 要求不晚于发薪日申报，并可对迟交薪资申报处以罚款。ICO
              就业指引显示，在英国数据保护法下，雇主面对员工监控、健康信息、招聘记录和居家办公数据处理等不同合规义务。因为 Bob 越来越多触达薪资、HR、AI
              功能和财务规划，一次产品或流程失败可能带来法律和运营后果，而不只是界面瑕疵。这一点重要，因为现代 HR
              套件现在被要求像受监管基础设施一样运转。买家购买的不只是工作流便利；他们是在把合规相邻执行委托给系统，而这些系统必须在税务日历、休假政策、生命周期事件和多国记录保存规则中保持准确。
