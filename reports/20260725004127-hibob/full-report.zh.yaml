            body: >-
              HiBob 将 Bob 定位为连接 HR、薪资和财务的人员平台。官网首页和平台概览合在一起，描绘的是以核心 HR 记录系统为中心的完整 HCM 栈，模块覆盖考勤、休假、绩效、学习、薪酬、人力规划、人员分析、薪资和
              Bob AI。公司成立于 2015 年，如今已形成多办公室布局。官方关于我们页面列出 New York、London、Tel Aviv、Sydney、Amsterdam、Berlin、Lisbon 和
              Zagreb 等地点，并明确称 New York 是美国总部。HiBob 当前自身需求信号强于 2023 年融资公告：官网首页现在称 5,000+ 家公司、1,230,200 名员工使用 HiBob，而 2023
              年 9 月融资稿披露的是 3,500+ 客户和超过 $100M 的 ARR。这就是基线身份记录。
