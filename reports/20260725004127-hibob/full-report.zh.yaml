  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              HiBob 的相关市场比传统 HRIS 数据库更宽，但比所有卖给 HR 的企业软件更窄。Bob 自己的平台页把核心 HR、考勤、休假、调研、学习、薪酬、人力规划、分析、薪资和财务连接放进一个连通的 HCM
              产品。这个范围直接与 Workday HCM、SAP SuccessFactors、BambooHR、Rippling、UKG、Factorial、Lattice 相邻人才工具，以及 Charlie 这类更小的
              SMB 套件重叠。现状替代方案仍然重要：较小雇主可以把薪资、ATS、敬业度和基于表格的规划拼在一起；较大雇主可以留在既有套件上，只在需要时加点状工具。因此，尽调中最相关的竞争池，是面向现代
              SMB、中端市场和中高端市场雇主的云 HCM/HRIS：他们想要一个记录系统，再加可配置工作流、集成、分析和薪资连接。预算归属也越来越跨职能。尤其是现在。
