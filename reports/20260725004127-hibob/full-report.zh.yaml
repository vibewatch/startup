    columns:
      - 驱动因素
      - 当前公开证据
      - 缺失证据
      - 若证实，对估值的影响
    rows:
      - - 持续高增长
        - 官方 >$100M ARR 与外部收入估算
        - 经审计的 2024-2025 年收入桥
        - 支撑溢价倍数
      - - 留存和扩张
        - 数千家客户和多模块覆盖
        - NRR / GRR / 队列数据
        - 判断溢价能否持续
      - - 毛利质量
        - 平台广度，以及可比公司软件式毛利率参照
        - HiBob 按模块拆分的毛利率
        - 区分软件溢价和服务拖累
      - - 战略邻接
