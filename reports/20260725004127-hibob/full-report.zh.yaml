  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 套件范围与产品表面
        blocks:
          - type: paragraph
            body: >-
              Bob 已不再只是一个对文化友好的 HR 前端。HiBob 当前材料把它定位为一体化人员平台，覆盖核心
              HR、薪资、福利、招聘、薪酬、分析、人力规划和财务相连规划。官网首页把品类卖成「人员、薪资和财务」；隐私政策则明确点名 Core HR Platform、薪资、福利管理、Hiring Module 和 Bob
              Finance
              Module。分析、薪酬、人力规划和薪资等产品页显示，公司正从员工记录向劳动力成本、绩效和组织规划外扩。这种宽度重要，因为它同时提高实施复杂度和跨模块粘性。模块图还有一点值得注意：同一条员工数据主干在相邻工作流中被反复复用。薪资、分析、薪酬和规划没有被描述成拥有孤立数据存储的外购独立工具；它们呈现为统一人员平台的延伸。即便公开记录没有透露具体实施架构，这也让技术故事比松散集成包更连贯。
