  topStrengths:
    - 多模块产品覆盖 HR、薪资、薪酬、劳动力规划、分析，并延伸到财务邻接场景。
    - 真实市场牵引：平台服务 5,000+ 家公司，2023 年披露 ARR 超过 $100M。
    - 围绕薪资（Pento）和财务规划（Mosaic）的战略收购加强了平台宽度。
    - 现代 API、webhook、移动端和生态接口支持更深嵌入客户工作流。
    - Rippling 等私募市场可比公司显示，投资人仍愿意给一体化劳动力平台溢价估值。
  topRisks:
    - 公开估值锚点仍主要继承自 2023 年 Series D，而不是更新的定价轮。
    - 当前经审计收入、毛利率、留存、CAC、烧钱和现金跑道仍未披露。
    - 薪资、雇佣数据和隐私义务抬高执行风险，一旦产品或支持质量下滑，影响会放大。
    - 按行业划分的客户集中度不清楚，对科技市场疲弱的暴露仍研究不足。
    - 来自 Rippling、Workday、Paycom、Paylocity、Personio 和其他 HCM 平台的竞争依然激烈。
  unresolvedGaps:
    - 经审计的 2024-2025 年收入，以及从官方 ARR 披露到当前规模的干净桥接。
    - 需要毛利率、NRR、流失、CAC 和回本周期指标，验证溢价倍数能否持续。
    - 当前现金余额、烧钱速度、现金跑道，以及盈利前是否还需要融资。
    - 当前 409A 或董事会估值桥接，加上股权结构、优先权和老股流动性细节。
    - 关于客户行业集中度，以及支持或薪资迁移问题在规模化后的严重程度，需要直接证据。
