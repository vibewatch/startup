companyProfile:
  summary: HiBob is a private HR software company founded in 2015 that has expanded Bob from a modern HRIS into a broader people-operations platform covering payroll, analytics, compensation, workforce planning, and finance-adjacent workflows. Public evidence supports meaningful scale, with thousands of customers, more than $100M ARR disclosed in 2023, and continued strategic expansion through the Pento and Mosaic acquisitions. The company looks more like a premium multi-module platform than a narrow HR tool, but its current financial quality and exact fair value remain only partially visible from public evidence.
  foundedDate: '2015-01-01'
  founders:
    - name: Ronni Zehavi
      role: Co-founder & CEO
      background: HiBob co-founder and current chief executive leading the company through its international expansion and funding rounds.
      claimRefs: [CO002, CO008]
    - name: Israel David
      role: Co-founder & CTO
      background: HiBob co-founder and current technology leader, anchoring the platform's product and engineering direction.
      claimRefs: [CO002, CO009]
  foundingLocation: Tel Aviv, Israel
  headquarters: New York, New York, USA
  productSummary: Bob is a multi-module people platform spanning core HR, payroll, employee records, performance, compensation, workforce planning, analytics, engagement, and finance-linked planning.
  customerFocus: Tech-forward SMB and mid-market employers, especially companies scaling across multiple geographies and seeking a modern HR, payroll, and people-data stack.
  businessModel: Subscription SaaS centered on a core HR system of record, with expansion through payroll, analytics, planning, compensation, and adjacent modules.
  stage: Series D private
  fundingStatus: $150M Series D announced in September 2023 with total disclosed funding of $574M; later public profiles still cluster HiBob around a $2.5B-$2.7B valuation corridor, but no newer priced round is publicly confirmed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO015, CO016, CO017, CO020, CV003, CV004, CV005]
summary:
  headline: HiBob has credible scale, broad product ambition, and strong strategic logic, but investors should treat the current unicorn mark as premium and only partially underwritten until newer audited metrics surface.
