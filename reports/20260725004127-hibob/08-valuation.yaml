  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "HiBob still looks like a unicorn, but the current public evidence is a corridor, not a clean mark. The last official financing benchmark is the September 2023 $150M round that brought total disclosed funding to $574M, while external profiles in 2025-2026 still place the company around roughly $2.5B to $2.7B. The challenge is that public operating evidence has moved since then: GetLatka estimates $121.7M of 2024 revenue, Forbes profiles a much larger 2025 scale, and the broader SaaS multiple regime is materially lower than 2021-style peaks. Public HCM comps such as Workday, Paycom, Paylocity, and Dayforce trade at far lower revenue multiples than HiBob's stale private mark implies, while private-market framework sources argue that public cloud indices overstate what private businesses can actually clear. The valuation case therefore depends on whether investors believe HiBob deserves a durable premium for growth, module breadth, and strategic adjacency—and whether those traits will be proven with updated audited metrics before the next liquidity event."
  },
  "sections": [
    {
      "id": "valuation-anchor",
      "title": "Current valuation anchor and its caveats",
      "body": "The most defensible starting point is the last official financing event. HiBob announced a $150M round in September 2023 and said total disclosed capital raised had reached $574M. Later public profiles continue to place the company in unicorn territory, but they do not replace a fresh priced round. GetLatka estimates HiBob at roughly $2.5B, while Forbes places it at $2.7B and also presents a larger 2025 revenue profile. These numbers show continuity of status, not a new market-clearing transaction. That distinction matters because private-company marks can remain sticky long after public SaaS multiples have reset. The safest interpretation is therefore a corridor, not a pinpoint. A continuity label like “still valued at” can be directionally true even when the underlying market would price a new round differently today.",
