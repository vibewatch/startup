    {
      "id": "implied-multiples",
      "title": "Implied multiples versus current software benchmarks",
      "body": "Once HiBob's stale valuation anchor is compared with available revenue proxies, the premium becomes obvious. On GetLatka's 2024 revenue estimate of $121.7M, a $2.45B to $2.7B valuation implies roughly 20x to 22x revenue. If the higher Forbes 2025 profile is directionally right, the implied multiple falls materially, but it still sits above many public HCM and payroll peers. Workday, Paycom, Paylocity, and Dayforce all provide a useful public-market frame: they are larger, more disclosed, and in several cases more profitable, yet trade at markedly lower revenue multiples in current market data. Broader SaaS benchmark sources also suggest that public cloud indices in the mid-single digits translate into lower private realized pricing after liquidity and information discounts. This gap does not automatically mean the private mark is wrong. It means HiBob is being judged against a different set of expectations: higher growth, less disclosure, and a strategic-platform thesis that investors hope will age into a larger category position before liquidity.",
