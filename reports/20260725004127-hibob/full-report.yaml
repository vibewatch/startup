      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              HiBob's product messaging makes the buyer map unusually explicit. HR owns the core system of record and
              the day-to-day employee lifecycle. Payroll leaders care about data synchronization, compliance, audit
              readiness, and local processing. Finance buyers care about headcount planning, compensation costs,
              attrition, and the new three-statement and forecasting hooks that HiBob now markets. Managers need
              performance, team sentiment, and workflow visibility, while IT wants SSO, integration governance, and
              lower system sprawl. This combination creates a multi-stakeholder sale: the product can enter through HR
              modernization, payroll pain, or strategic workforce planning. The strongest near-term segment remains
              fast-growing SMB and mid-market employers that find enterprise suites too heavy but no longer want
              fragmented point tools. Official pages from BambooHR, Factorial, CharlieHR, and Rippling all validate how
              crowded this buyer segment has become, while Workday, SAP, and UKG continue to pressure the upper end of
              the market.
