  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              HiBob's public product pages show a classic multi-module SaaS revenue model built around a core system of
              record and paid workflow expansion. The homepage and platform materials position Bob as a connected people
              platform spanning core HR, payroll, talent, analytics, planning, and finance linkage. The payroll page is
              especially important because it shows two monetization paths beyond basic HRIS: native payroll in the U.S.
              and U.K., plus a payroll hub for integrated providers. The workforce-planning, compensation, and analytics
              pages suggest additional monetizable modules that can raise ACV over time. Public pricing is not
              disclosed, which means the market can observe breadth and category logic but not how list packaging
              translates into realized contract value. That monetization structure matters because it reduces dependence
              on any single workflow. A customer can begin with core HR, then add payroll to capture salary execution,
              and later adopt analytics or planning when headcount complexity rises. Even without published prices, the
              architecture points to a deliberate move from single-product HR administration toward a broader operating
              system for labor cost decisions.
