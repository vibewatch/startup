      - CV040
  - id: TV006
    title: Premium-support checklist
    columns:
      - driver
      - public proof today
      - missing proof
      - valuation effect if confirmed
    rows:
      - - Sustained high growth
        - Official >$100M ARR and external revenue estimates
        - Audited 2024-2025 revenue bridge
        - Supports keeping a premium multiple
      - - Retention and expansion
        - Thousands of customers and multi-module scope
        - NRR / GRR / cohort data
        - Determines whether premium is durable
      - - Margin quality
        - Platform breadth and software-style gross-margin analogs from comps
        - HiBob gross margin by module
        - Separates software premium from service drag
      - - Strategic adjacency
        - Payroll plus finance/workforce planning expansion
        - Attach rates and ACV lift from new modules
        - Supports platform-style valuation
      - - Liquidity posture
        - Large historical capital base
        - Cash, burn, runway, and board valuation bridge
        - Affects urgency discount or patience premium
    notes: This checklist turns the abstract premium thesis into specific proof points investors would need to see.
    claimRefs:
