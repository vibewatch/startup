companyProfile:
  summary: >-
    HiBob is a private HR software company founded in 2015 that has expanded Bob from a modern HRIS into a broader
    people-operations platform covering payroll, analytics, compensation, workforce planning, and finance-adjacent
    workflows. Public evidence supports meaningful scale, with thousands of customers, more than $100M ARR disclosed in
    2023, and continued strategic expansion through the Pento and Mosaic acquisitions. The company looks more like a
    premium multi-module platform than a narrow HR tool, but its current financial quality and exact fair value remain
    only partially visible from public evidence.
