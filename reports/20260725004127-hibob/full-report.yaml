  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              HiBob's relevant market is wider than a legacy HRIS database but narrower than all enterprise software
              sold into HR. Bob's own platform page places core HR, time and attendance, time off, surveys, learning,
              compensation, workforce planning, analytics, payroll, and finance linkage in one connected HCM product.
              That scope overlaps directly with Workday HCM, SAP SuccessFactors, BambooHR, Rippling, UKG, Factorial,
              Lattice-adjacent talent tooling, and smaller SMB suites like Charlie. The status-quo substitute set still
              matters: smaller employers can stitch together payroll, ATS, engagement, and spreadsheet-based planning;
              larger employers can stay on incumbent suites and add point tools only when needed. For diligence
              purposes, the most relevant competitive pool is therefore cloud HCM/HRIS for modern SMB, mid-market, and
              upper-mid-market employers that want one system of record plus configurable workflows, integrations,
              analytics, and payroll connectivity. Budget ownership is increasingly cross-functional. Especially now.
            claimRefs:
              - CM001
