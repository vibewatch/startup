      - number: '1.3'
        title: Funding history, valuation signals, and scale markers
        blocks:
          - type: paragraph
            body: >-
              HiBob's official chronology and third-party trackers together show a company that has remained in unicorn
              territory while still relying on private-market estimation for current economics. The official 19
              September 2023 release says HiBob raised $150M led by Farallon Capital with Alpha Wave Global and existing
              investors, pushing total disclosed capital to $574M and confirming ARR above $100M with more than 3,500
              customers. The official about page separately says HiBob raised a $150M Series C in 2021 at a $1.65B
              valuation and raised an additional $150M Series D in 2022. GetLatka extends the public trajectory by
              estimating 2023 revenue at $82.4M and 2024 revenue at $121.7M, while Forbes reports the September 2023
              round valued HiBob at $2.7B and says the company had over 4,500 customers, 1.1M users, and 1,300+
              employees across seven global offices. Those third-party figures are directionally useful, but they should
              be treated as external estimates rather than company-certified disclosures.
