    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              HiBob positions Bob as a connected people platform linking HR, payroll, and finance. The homepage and
              platform overview together describe a full HCM stack built around a core HR system of record, with modules
              for time and attendance, time off, performance, learning, compensation, workforce planning, people
              analytics, payroll, and Bob AI. The company was founded in 2015 and today operates a multi-office
              footprint. The official about page lists New York, London, Tel Aviv, Sydney, Amsterdam, Berlin, Lisbon,
              and Zagreb locations, while explicitly calling New York the U.S. headquarters. HiBob's own current demand
              signal is stronger than its 2023 financing announcement: the homepage now says 5,000+ companies and
              1,230,200 people use HiBob, versus the September 2023 funding release stating 3,500+ customers and ARR
              above $100M. This is the baseline identity record.
