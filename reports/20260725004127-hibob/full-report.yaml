  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation anchor and its caveats
        blocks:
          - type: paragraph
            body: >-
              The most defensible starting point is the last official financing event. HiBob announced a $150M round in
              September 2023 and said total disclosed capital raised had reached $574M. Later public profiles continue
              to place the company in unicorn territory, but they do not replace a fresh priced round. GetLatka
              estimates HiBob at roughly $2.5B, while Forbes places it at $2.7B and also presents a larger 2025 revenue
              profile. These numbers show continuity of status, not a new market-clearing transaction. That distinction
              matters because private-company marks can remain sticky long after public SaaS multiples have reset. The
              safest interpretation is therefore a corridor, not a pinpoint. A continuity label like “still valued at”
              can be directionally true even when the underlying market would price a new round differently today.
