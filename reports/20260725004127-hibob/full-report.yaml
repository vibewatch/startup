      - number: '8.4'
        title: What still has to be proven for the valuation to hold
        blocks:
          - type: paragraph
            body: >-
              The missing evidence is what prevents a clean conclusion. No public source in the retained corpus provides
              audited 2024-2025 revenue, gross margin, NRR, CAC, burn, or a current board-approved valuation bridge.
              Without those, it is impossible to know whether the 2023 valuation has been earned forward operationally
              or merely carried forward narratively. Market benchmark sources emphasize that private SaaS businesses
              clear below public multiples because of liquidity, scale, and information-risk discounts. That does not
              mean HiBob is overvalued; it means the burden of proof sits on updated metrics. The public verdict is
              therefore conditional: HiBob can plausibly justify a premium private valuation, but the precise multiple
              remains underdetermined until newer financial evidence arrives. That missing package also affects
              negotiation leverage. If management can show audited growth, sticky cohorts, and improving margin shape,
              the premium mark may hold or even strengthen in a future event. If those metrics are weaker than narrative
              sources imply, the headline unicorn label could prove much less informative than it appears.
