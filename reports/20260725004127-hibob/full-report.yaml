  - id: TV004
    title: Valuation scenario table
    columns:
      - scenario
      - revenue belief
      - multiple belief
      - implied view
    rows:
      - - Bear
        - 2024 scale remains closer to ~$120M and private markets demand heavier discount
        - 8x-10x
        - Valuation support below 2023 mark
      - - Base
        - HiBob meaningfully outgrew 2024 estimate and remains high-retention, high-growth private SaaS
        - 10x-14x
        - Valuation can stay near unicorn territory if 2025 revenue stepped up
      - - Bull
        - >-
          Forbes-like 2025 scale is directionally correct and investors keep rewarding integrated HR/payroll/finance
          platforms
        - 14x-18x+
        - 2023 mark can still look reasonable or conservative
      - - Stretch
        - Market treats HiBob more like Rippling than like public HCM peers
        - 18x+
        - Requires unusually strong growth, retention, and strategic narrative
    notes: These are interpretive ranges, not board-approved fair-value marks.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV028
  - id: TV005
    title: Valuation diligence gaps table
    columns:
      - missing input
      - why it matters
      - required next step
    rows:
      - - Audited 2024-2025 revenue
        - Needed to replace profile estimates with finance-grade evidence
        - Request audited statements or board pack
      - - Gross margin by module
        - Determines whether payroll/services dilute software quality
        - Request margin bridge by module
      - - NRR / churn / cohort expansion
        - Best indicator of whether premium multiple is durable
        - Request cohort tables by geography and segment
      - - Cash / burn / runway
        - Affects negotiating leverage and timing pressure
        - Request latest cash forecast and financing plan
      - - Current 409A / board valuation bridge
        - Clarifies whether internal marks have moved since 2023
        - Request valuation memo and assumptions
      - - Share-class, preference, and secondary context
        - Headline valuation can overstate common-equity value
        - Request cap table and latest transaction details
    notes: Until these inputs are disclosed, public valuation work remains a corridor analysis rather than a final mark.
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
