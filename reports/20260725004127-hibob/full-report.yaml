      - number: '3.3'
        title: Differentiation, switching cost, and moat durability
        blocks:
          - type: paragraph
            body: >-
              HiBob's clearest differentiation is the combination of configurable people-core workflows with payroll,
              analytics, and newly emphasized finance linkage. That is broader than Lattice's talent-led posture and
              more experience-led than enterprise suites that still center on heavyweight transformation programs. But
              the moat is not clean. Rippling extends farther into payroll and operational software, Workday and SAP can
              normalize AI and workforce planning at enterprise scale, and lower-end vendors like BambooHR, Factorial,
              and CharlieHR compete by simplifying implementation and, in some cases, publishing prices. Switching costs
              cut both ways: once installed, a system of record with payroll and integrations can be sticky, but buyers
              can also hesitate to move from incumbents because migration and data-governance work is painful. In
              practice, that means reference checks, implementation speed, and module attach rates matter more than
              marketing language about flexibility or culture.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
      - number: '3.4'
        title: Adverse competitive read-through
        blocks:
          - type: paragraph
            body: >-
              The most important adverse read-through is that category features are converging quickly. Rippling public
              materials emphasize AI, HRIS, and payroll together; Workday, SAP, and UKG all message AI and autonomous
              HR; and smaller tools now publish lower-friction pricing and modular entry points. That means HiBob cannot
              rely on modern UX alone. It needs to keep winning on payroll execution, analytics usefulness,
              cross-functional planning, and implementation outcomes. Public pricing opacity is also a tactical weakness
              because buyers can benchmark CharlieHR, Factorial, Lattice, and BambooHR without speaking to sales, while
              HiBob still uses a quote-led motion. Finally, the very fact that HiBob is now pushing HR-finance
              integration via Mosaic confirms that broader platform adjacency—not stand-alone HR admin—is where the
              competitive frontier has moved. The competitive read-through is therefore operational: HiBob must prove
              execution, not just category vocabulary, every time a buyer compares bundled alternatives. Sales execution
              and references become decisive under this level of feature crowding.
