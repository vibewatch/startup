  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, payroll, and employment-data risk
        blocks:
          - type: paragraph
            body: >-
              Payroll and employment data are the two areas where HiBob’s product ambition most directly increases risk.
              The company is expanding payroll and finance-adjacent functionality just as employers face strict tax,
              reporting, and privacy obligations in every jurisdiction they serve. IRS guidance shows U.S. employers
              must deposit and report employment taxes accurately and on time, while HMRC requires on-or-before-payday
              reporting and can impose penalties for late payroll submissions. ICO employment guidance shows employers
              face distinct compliance duties for worker monitoring, health information, recruitment records, and
              work-from-home data handling under UK data protection law. Because Bob increasingly touches payroll, HR,
              AI features, and finance planning, a product or process failure can have consequences that are legal and
              operational, not merely cosmetic. That matters because a modern HR suite is now being asked to behave like
              regulated infrastructure. Buyers are not merely purchasing workflow convenience; they are delegating
              compliance-adjacent execution into systems that must stay accurate across tax calendars, leave policies,
              lifecycle events, and multi-country recordkeeping rules.
