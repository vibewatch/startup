          - type: paragraph
            body: >-
              HiBob's post-2023 strategy has been to broaden the product from HR system of record toward payroll and
              finance-adjacent workflows. The official about page records the February 2024 Pento acquisition and the
              2025 Mosaic acquisition as major milestones; the Pento announcement frames the deal as adding UK payroll
