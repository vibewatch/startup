  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              The market splits into three main classes. First are enterprise suites such as Workday, SAP
              SuccessFactors, and UKG, which bring broad HR, payroll, and workflow depth plus heavyweight distribution.
              Second are modern suite platforms such as HiBob, Rippling, BambooHR, and Factorial that target buyers who
              want a configurable system of record without legacy-suite overhead. Third are talent- or workflow-adjacent
              products like Lattice and small-business-first tools like CharlieHR, which can win narrower use cases or
              smaller accounts. The implication is that HiBob rarely competes on a single feature; it usually competes
              on bundle design, implementation flexibility, and whether the buyer wants HR alone or a broader operating
              layer that touches payroll, analytics, finance, and managers. Buyers also evaluate whether a suite can
              serve managers directly, not just HR administrators, because that shapes adoption and renewal. Geography
              matters too: CharlieHR is UK-centric, Factorial is European, and Workday or SAP can follow global accounts
              much farther up-market. The split persists. Still.
            claimRefs:
