  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Suite scope and product surface
        blocks:
          - type: paragraph
            body: >-
              Bob is no longer just a culture-friendly HR front end. HiBob's current materials position it as an
              integrated people platform spanning core HR, payroll, benefits, hiring, compensation, analytics, workforce
              planning, and finance-linked planning. The homepage sells the category as people, payroll, and finance,
              while the privacy policy explicitly names the Core HR Platform, payroll, benefits administration, the
              Hiring Module, and the Bob Finance Module. Product pages on analytics, compensation, workforce planning,
              and payroll show how the company is building outward from employee records into workforce cost,
              performance, and organizational planning. That breadth matters because it increases both implementation
              complexity and cross-module stickiness. The module map is also notable for how consistently the same
              employee-data spine is reused across adjacent workflows. Payroll, analytics, compensation, and planning
              are not described as separate acquired utilities with isolated data stores; they are presented as
              extensions of a unified people platform. That makes the technical story more coherent than a loose
              integration bundle, even if the public record does not reveal the exact implementation architecture.
