      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              HiBob has raised enough disclosed capital to fund category expansion, but the current balance-sheet
              picture is opaque. The September 2023 financing brought total disclosed capital to $574M, and the business
              has since pursued two acquisitions: Pento in 2024 to deepen payroll and Mosaic in 2025 to extend into
              finance and FP&A. That combination suggests management still prioritizes product breadth and category
              leadership over visible near-term profitability. Yet no retained public source discloses current cash on
              hand, burn, debt, runway, or the specific post-2023 use of funds. The right inference is not that HiBob is
              undercapitalized, but that capital adequacy cannot be fully judged from the public record alone. The same
              opacity applies to acquisition financing: public announcements confirm strategic intent and in Mosaic's
