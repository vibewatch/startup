              visible adverse signal is integration friction after the Pento deal. Trustpilot reviews from late 2024 and
              early 2025 include complaints from former Pento customers about payroll migration pressure, service
              disruption fears, and slow support responses. Those reviews are anecdotal rather than systematic, but they
              are relevant because payroll is exactly the category HiBob chose to expand into via acquisition.
