    {
      "id": "integration-layer",
      "title": "Integration layer and developer surface",
      "body": "The clearest technical proof is in the public API and webhook documentation. HiBob allows customers to build custom integrations without becoming formal partners, and third-party vendors can join a partner program for broader distribution. The API is service-user based, permissioned by field categories, and documented with both browser and markdown forms. The employee-data docs show that Bob exposes search endpoints, employee tables, metadata discovery, and webhook-triggered synchronization paths. Webhook coverage spans employee creation, updates, deletions, table changes, and lifecycle events such as joined, left, activated, and temporary leave. That is meaningful because it suggests Bob can participate in real operational systems rather than serving only as a static HR database. Another useful signal is that the docs anticipate real-world operational edge cases. They explain silent field omission when permissions are missing, historical-table behavior, lifecycle timing, custom-table handling, and large-company read patterns. Those are details normally written only after product teams and solution engineers encounter real integration pain in the field, which makes the developer surface materially more credible.",
      "claimRefs": [
        "CE009",
        "CE010",
        "CE011",
        "CE012",
        "CE013",
        "CE014",
        "CE015",
        "CE016",
        "CE017"
      ],
      "tableRefs": [
