  topStrengths:
    - >-
      Broad multi-module product spanning HR, payroll, compensation, workforce planning, analytics, and finance
      adjacency.
    - Real market traction with 5,000+ companies on the platform and more than $100M ARR disclosed in 2023.
    - Strategic acquisitions in payroll (Pento) and finance planning (Mosaic) strengthen platform breadth.
    - Modern API, webhook, mobile, and ecosystem surfaces support deeper embedding into customer workflows.
    - >-
      Private-market comparables like Rippling show investors still reward integrated workforce platforms with premium
      valuations.
  topRisks:
    - The public valuation anchor is still largely inherited from the 2023 Series D rather than a newer priced round.
    - Current audited revenue, gross margin, retention, CAC, burn, and runway remain undisclosed.
    - Payroll, employment-data, and privacy obligations raise execution risk if product or support quality slips.
    - Customer concentration by sector is unclear, leaving exposure to tech-market weakness underexplored.
    - Competition from Rippling, Workday, Paycom, Paylocity, Personio, and other HCM platforms remains intense.
  unresolvedGaps:
    - Audited 2024-2025 revenue and a clean bridge from official ARR disclosure to current scale.
    - Gross margin, NRR, churn, CAC, and payback metrics needed to validate premium-multiple durability.
    - Current cash balance, burn rate, runway, and any financing need before profitability.
    - Current 409A or board valuation bridge, plus cap-table, preference, and secondary-liquidity details.
    - >-
      Direct evidence on customer sector concentration and the severity of support or payroll-transition issues at
      scale.
