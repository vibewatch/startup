    {
      "id": "capability-pricing",
      "title": "Capability breadth and pricing posture",
      "body": "HiBob's public posture is broad-scope but quote-led. The homepage, payroll page, and integrations page together position Bob as a people, payroll, and finance platform with marketplace integrations and native payroll in the U.S. and U.K. In contrast, BambooHR, CharlieHR, Factorial, and Lattice all publish meaningful pricing or seat-level cues, which lowers buyer friction and sharpens comparison shopping. Workday, SAP, UKG, and Rippling largely stay quote-led or enterprise-negotiated, aligning them with bigger and more customized deployments. This creates a meaningful competitive nuance: HiBob is trying to sell a strategic multi-stakeholder platform while still competing against SMB and mid-market vendors that publish easier entry-point economics. The price-discovery question matters because a visible seat price can get a vendor into the shortlist before deeper product evaluation even starts. Public pricing also changes channel behavior: consultants, brokers, and procurement teams can compare transparent SMB tools without waiting for vendor discovery calls or enterprise packaging workshops.",
