    {
      "id": "differentiation-lockin",
      "title": "Differentiation, switching cost, and moat durability",
      "body": "HiBob's clearest differentiation is the combination of configurable people-core workflows with payroll, analytics, and newly emphasized finance linkage. That is broader than Lattice's talent-led posture and more experience-led than enterprise suites that still center on heavyweight transformation programs. But the moat is not clean. Rippling extends farther into payroll and operational software, Workday and SAP can normalize AI and workforce planning at enterprise scale, and lower-end vendors like BambooHR, Factorial, and CharlieHR compete by simplifying implementation and, in some cases, publishing prices. Switching costs cut both ways: once installed, a system of record with payroll and integrations can be sticky, but buyers can also hesitate to move from incumbents because migration and data-governance work is painful. In practice, that means reference checks, implementation speed, and module attach rates matter more than marketing language about flexibility or culture.",
