  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "HiBob is a 2015-founded HR software company whose Bob platform now spans core HR, talent, payroll, planning, and finance-adjacent workflows. Official company materials confirm a New York commercial hub, a Tel Aviv office, a $150M September 2023 funding round that brought total disclosed capital to $574M, and 2024-2025 acquisitions of Pento and Mosaic. The clearest current scale markers are mixed-source: HiBob's homepage now claims 5,000+ customers and 1,230,200 people on platform, while third-party profiles estimate roughly $121.7M of 2024 ARR and a $2.5B-$2.7B valuation range."
  },
  "sections": [
    {
      "id": "identity-footprint",
      "title": "Identity, product scope, and operating footprint",
      "body": "HiBob positions Bob as a connected people platform linking HR, payroll, and finance. The homepage and platform overview together describe a full HCM stack built around a core HR system of record, with modules for time and attendance, time off, performance, learning, compensation, workforce planning, people analytics, payroll, and Bob AI. The company was founded in 2015 and today operates a multi-office footprint. The official about page lists New York, London, Tel Aviv, Sydney, Amsterdam, Berlin, Lisbon, and Zagreb locations, while explicitly calling New York the U.S. headquarters. HiBob's own current demand signal is stronger than its 2023 financing announcement: the homepage now says 5,000+ companies and 1,230,200 people use HiBob, versus the September 2023 funding release stating 3,500+ customers and ARR above $100M. This is the baseline identity record.",
