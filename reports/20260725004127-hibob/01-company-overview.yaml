    {
      "id": "founders-leadership-governance",
      "title": "Founders, leadership, and governance",
      "body": "HiBob's founding story is now broader than the two-name shorthand often used in secondary profiles. The official about page says the company was founded in 2015 by Ronni Zehavi, Israel David, Andy Bellass, and Amit Knaani, while Forbes summarizes the business as co-founded by Zehavi and David. For current control and operating authority, the official leadership page is the more relevant source: Zehavi remains CEO and Israel David remains CTO and co-founder, while Nirit Peled-Muntz (CPO), David Sussely (CFO), Michal Lewy Harush (CIO), Nadav Goshen (CBO), Paul Zeiter (CRO), Adi Janowitz (CCO), and Sophie Chesters (CMO) fill out the disclosed executive bench. Governance is investor-linked but still private-company opaque. The about page discloses a board roster including Battery Ventures, Farallon Capital Management, Bessemer Venture Partners, Eight Roads Ventures, Seek Ventures, General Atlantic, and independent director Mike Ettling, but does not disclose voting control, ownership percentages, or financing terms.",
