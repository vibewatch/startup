    {
      "id": "acquisitions-milestones-adverse",
      "title": "Milestones, acquisitions, and diligence-relevant adverse signals",
      "body": "HiBob's post-2023 strategy has been to broaden the product from HR system of record toward payroll and finance-adjacent workflows. The official about page records the February 2024 Pento acquisition and the 2025 Mosaic acquisition as major milestones; the Pento announcement frames the deal as adding UK payroll automation to HiBob's HCM footprint, while the Mosaic blog, PRNewswire release, Calcalist, FinTech Global, and DHRMap all describe the 2025 acquisition as connecting HR and FP&A for mid-market companies. The same timeline shows prior expansion steps including a London office in 2016, a New York U.S. headquarters opening in 2018, a Sydney office in 2021, and Berlin plus a Lisbon tech hub in 2022. The main publicly visible adverse signal is integration friction after the Pento deal. Trustpilot reviews from late 2024 and early 2025 include complaints from former Pento customers about payroll migration pressure, service disruption fears, and slow support responses. Those reviews are anecdotal rather than systematic, but they are relevant because payroll is exactly the category HiBob chose to expand into via acquisition.",
