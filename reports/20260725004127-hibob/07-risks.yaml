    },
    {
      "id": "customer-market-and-support",
      "title": "Customer concentration, market pressure, and support risk",
      "body": "HiBob’s commercial risk is tied to who it sells to and what those buyers expect. The company markets strongly to modern, fast-growing businesses, a segment that can be more cyclical than mature enterprise payroll bases. Layoffs.fyi continues to document broad tech layoffs, and even when exact customer concentration is not disclosed, that backdrop matters for a vendor closely associated with tech-forward scaleups. Review channels also show that product strength does not eliminate support, reporting, and integration friction. G2 and TrustRadius generally praise usability, but G2 also flags export and integration limitations while Trustpilot contains more adverse support and payroll-transition sentiment. In a market where buyers can compare HiBob against Rippling, Personio, BambooHR, Workday, SAP, and others, any support burden or implementation disappointment can weaken expansion and renewal quality. Payroll complaints are especially sensitive because employees feel them directly, and a negative payroll event can reach executives faster than a minor admin-console issue ever would.",
