    {
      "id": "strategic-and-geopolitical",
      "title": "Strategic, acquisition, and geopolitical risk",
      "body": "The final risk cluster is strategic. HiBob is still priced in public discourse as a unicorn, but that benchmark comes from a 2023 financing round and has to survive a different software market, longer private holding periods, and post-acquisition execution. The company has since acquired Pento and Mosaic, which may strengthen payroll and finance positioning but also create integration, roadmap, and go-to-market complexity. The UK travel-advice page for Israel underscores the continuing regional unpredictability affecting companies with Israeli operations, while HiBob’s own subprocessor and affiliate disclosures confirm a meaningful footprint in Tel Aviv alongside global offices. None of this implies imminent disruption, but it does mean investors and large buyers should treat execution continuity, valuation durability, and cross-border operating resilience as live risks rather than abstract caveats. Longer private-market duration also raises the bar for flawless execution, because product sprawl, integration work, and valuation expectations all have to coexist for more years before a clean liquidity event becomes available.",
