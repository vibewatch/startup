    {
      "id": "security-and-third-parties",
      "title": "Security, data handling, and third-party dependency risk",
      "body": "HiBob’s own security materials are reassuring in tone, but they also make its dependency surface clearer. The company says it is ISO 27001, ISO 27018, and SOC 2 Type II certified, uses AWS data centers in Ireland and Germany, encrypts data in transit and at rest, and operates role-based access with audited support access. At the same time, the subprocessor page shows how many outside parties are embedded in delivery: AWS, SingleStore, Cloudflare, Zendesk, optional AI vendors, SSO providers, and mobile-notification providers all appear in the service chain. The AI trust center adds stronger controls such as zero-retention and admin opt-outs, yet it also confirms that AI vendor governance is now part of the platform’s trust boundary. The risk conclusion is straightforward: HiBob appears security-aware, but buyers are still underwriting a complex vendor graph handling highly sensitive worker data. The same is true of AI: even strong policy language does not remove the need to inspect how prompts, outputs, auditability, and vendor substitution would behave during a real incident or regulatory inquiry.",
      "claimRefs": [
        "CR009",
