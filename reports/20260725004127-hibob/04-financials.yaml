  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "HiBob's public financial picture is directional rather than fully underwritable. Official sources confirm more than $100M ARR, 3,500+ customers, and $574M of total disclosed capital by September 2023, while GetLatka estimates 2024 revenue at $121.7M after $82.4M in 2023. The revenue model is clearly subscription-led and increasingly multi-module, spanning core HR, payroll, analytics, compensation, and planning. What is missing are the metrics investors need to fully judge quality: realized pricing, gross margin, NRR, CAC, payback, burn, cash, and cohort retention are not publicly disclosed."
  },
  "sections": [
    {
      "id": "revenue-model",
      "title": "Revenue model and monetization",
      "body": "HiBob's public product pages show a classic multi-module SaaS revenue model built around a core system of record and paid workflow expansion. The homepage and platform materials position Bob as a connected people platform spanning core HR, payroll, talent, analytics, planning, and finance linkage. The payroll page is especially important because it shows two monetization paths beyond basic HRIS: native payroll in the U.S. and U.K., plus a payroll hub for integrated providers. The workforce-planning, compensation, and analytics pages suggest additional monetizable modules that can raise ACV over time. Public pricing is not disclosed, which means the market can observe breadth and category logic but not how list packaging translates into realized contract value. That monetization structure matters because it reduces dependence on any single workflow. A customer can begin with core HR, then add payroll to capture salary execution, and later adopt analytics or planning when headcount complexity rises. Even without published prices, the architecture points to a deliberate move from single-product HR administration toward a broader operating system for labor cost decisions.",
