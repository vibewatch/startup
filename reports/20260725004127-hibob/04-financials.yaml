    {
      "id": "public-traction-proxies",
      "title": "Public traction proxies and what they imply",
      "body": "The clearest traction markers are a combination of official disclosure and third-party estimation. HiBob said in September 2023 that it had exceeded $100M ARR and reached more than 3,500 customers. GetLatka extends that series by estimating $82.4M of 2023 revenue and $121.7M of 2024 revenue, implying continued fast growth after the 2023 round even if the figures are not company-certified. Forbes adds another scale view with over 4,500 customers, 1.1M users, and a climb from $10M ARR in 2020 to $197M in 2025, though that higher 2025 number should be treated as a profile estimate rather than a disclosed run rate. HiBob's homepage also claims customers see 254% ROI with payback in under nine months, but that is a marketing efficiency claim, not a GAAP or board-level SaaS metric. The mismatch across sources is better read as evidence of rapid movement across reporting dates than as direct contradiction. The prudent analyst view is to anchor on the official ARR floor and then use external estimates as directional range markers, not as precise audited values.",
      "claimRefs": [
        "CI009",
