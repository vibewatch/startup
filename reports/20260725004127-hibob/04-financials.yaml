    {
      "id": "margin-quality-and-gaps",
      "title": "Margin path, quality signals, and missing underwriting inputs",
      "body": "Public evidence supports a healthy software-style business model, but not a fully proven quality-of-revenue case. Recurring subscription software tied to employee records, payroll workflows, and analytics normally benefits from low incremental delivery cost and sticky customer data, and public comparables like Workday illustrate how mature HCM vendors can scale large software revenue bases. Still, HiBob has not publicly disclosed gross margin, net revenue retention, implementation cost structure, or support burden. Review-site comments about reporting limitations, support response quality, and payroll-transition complaints matter because they can eventually affect renewals or service cost if they show up at scale. The financial verdict is therefore straightforward: public sources support real scale and module-based monetization, but the hardest underwriting questions remain private. This is especially relevant in payroll, where revenue can look attractive while operational and compliance cost absorb a larger share of economics than pure software modules. A strong underwriting process would therefore separate platform software margins from payroll-adjacent service burden before relying on blended top-line growth.",
