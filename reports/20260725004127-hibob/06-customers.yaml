    {
      "id": "gtm-durability",
      "title": "Go-to-market durability and diligence gaps",
      "body": "The practical go-to-market picture is therefore a mix of strong logo proof and incomplete monetization data. HiBob clearly has recognizable customers and enough product breadth to win deeper deployments, but the public corpus does not reveal what share of customers are sub-1000-employee accounts, how much revenue is tied to the technology sector, or whether payroll and finance modules materially change ACV. For investment work, the next diligence step is to separate showcase logos from revenue-bearing cohorts: production deployment, multi-module attach, renewal behavior, and geography-specific win rates. Until those are disclosed, the chapter supports customer relevance and adoption credibility, but not concentration safety or best-in-class retention economics. Customer quality therefore looks directionally good, but underwriting still requires revenue-bearing cohort evidence rather than showcase storytelling alone. Revenue-quality diligence is still essential.",
