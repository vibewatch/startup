    {
      "id": "retention-expansion-concentration",
      "title": "Retention, expansion, and concentration risk",
      "body": "The public record supports a land-and-expand thesis better than a retention model. HiBob's homepage, analytics pages, and case studies all emphasize expanding from core HR into payroll, analytics, compensation, sandbox, or workforce planning. Ualá explicitly added Talent, Compensation, Sandbox, and Workforce Planning over time; Waves added Teams integration on top of the HRIS foundation. That pattern is positive because it suggests module expansion rather than single-point adoption. The problem is that no retained source discloses NRR, GRR, logo churn, contract duration, or concentration by customer. Review sources help only indirectly: G2 and TrustRadius show continued active usage and product investment, while Trustpilot includes some complaints around support and the Pento transition that could matter for retention in payroll-related accounts. That means the chapter can support a credible expansion narrative even though it cannot yet prove best-in-class retention math. Put differently, the public evidence shows many reasons customers could stay and expand, but it does not yet quantify how often they actually do so after the initial implementation year.",
      "claimRefs": [
        "CU019",
        "CU020",
