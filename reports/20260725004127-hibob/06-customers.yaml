  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "HiBob has credible real-world adoption proof, but the public record is much stronger on named logos and workflow outcomes than on hard retention or concentration metrics. Official sources now claim 5,000+ companies and 1,230,200 people on platform, while older financing and profile sources cite 3,500+ to 4,500+ customers and 1.1M users. Case studies show repeat patterns across technology, fintech, media, and global-growth companies: buyers adopt Bob to replace spreadsheets or fragmented HR tools, then expand into onboarding, performance, analytics, payroll, and workforce planning. The main public gap is durability: no retained source provides audited NRR, GRR, churn, or top-customer concentration."
  },
  "sections": [
    {
      "id": "customer-base-segmentation",
      "title": "Customer base and segment focus",
      "body": "The retained customer corpus shows HiBob winning where growth, multi-country coordination, and employee-experience needs meet. Official copy consistently frames Bob for modern, fast-growing, and multinational employers, while the customer page and case studies point to technology, fintech, digital media, and software-heavy organizations such as VaynerMedia, Fiverr, Ualá, Xplor, Kustomer, and Waves. These are not tiny microbusiness examples; they are scale-up or multi-office employers that need a system of record plus workflows for onboarding, time off, org visibility, performance, and analytics. The public customer list is therefore good evidence for segment direction even if it does not disclose revenue concentration or full industry mix. Public proof also skews toward organizations complex enough to care about culture, manager workflows, and cross-border employee records, which is important because it separates HiBob from very small-business admin tools. The logo set is therefore useful not just for marketing, but also for triangulating intended company size and operational complexity.",
