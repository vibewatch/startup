    {
      "id": "adoption-and-proof",
      "title": "Adoption trajectory and named proof",
      "body": "HiBob's public proof is strongest when a logo is paired with an operational outcome. Ualá used Bob to replace spreadsheets, centralize people data, support remote onboarding, and later extend into talent, compensation, sandbox testing, and workforce planning while scaling to 1,600 employees and multiple acquisitions. Waves used Bob and the Microsoft Teams integration to automate more than 100 hours of administrative work per month and maintain remote coordination across six sites. Xplor rolled Bob out to 2,200 employees, Kustomer used Bob to improve onboarding and performance-management experiences, and Fiverr uses Bob across the employee lifecycle. These stories are company-authored and therefore confirming by nature, but they do show Bob deployed beyond pilot status and across multiple modules. Several of the strongest case studies also show cross-functional usage, with HR, payroll, managers, and leadership all using the same data model for decisions instead of maintaining side spreadsheets. At scale. Clearly. Consistently.",
      "claimRefs": [
