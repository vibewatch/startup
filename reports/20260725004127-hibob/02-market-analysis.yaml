    {
      "id": "market-size-growth",
      "title": "Sizing lenses and growth drivers",
      "body": "Public market estimates differ because they use different boundaries, geographies, and definitions of payroll, talent, and adjacent workflow spend. Apps Run The World puts the worldwide HCM software market at $58.7B in 2024, up 11.7% year over year from $52.6B in 2023. Grand View Research, using a broader HR-software framing, says the market was $16.4B in 2023 and projects $36.6B by 2030. Carlsquare's HCM technology sector update shows a separate global HCM market-size forecast growing from $24.9B in 2022 to $63.6B in 2032 at roughly 10% CAGR. Those estimate bands are too different to average mechanically, but they all support the same conclusion: the category is large enough to sustain multiple winners, still moving to cloud, and expanding as buyers attach analytics, wellbeing, learning, and compliance workflows to core employee records. Hybrid work and people analytics remain durable demand drivers; Carlsquare cites 74% of U.S. companies using or planning a permanent hybrid model and over 70% of employers using people analytics to improve performance.",
