  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "HiBob competes in the broad HCM/HR software market, but the most relevant buyer arena is the cloud-based mid-market HRIS stack that combines core HR, payroll coordination, talent workflows, analytics, and increasingly finance-adjacent planning. Public market sources point to a large and still-growing category, though absolute sizing varies materially by methodology: Apps Run The World sizes 2024 HCM software at $58.7B, Grand View puts the broader HR software market at $16.4B in 2023, and Carlsquare cites a global HCM technology market growing from $24.9B in 2022 to $63.6B in 2032. The common through-lines are cloud migration, hybrid work, payroll/compliance complexity, and AI-enabled analytics."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and category definition",
      "body": "HiBob's relevant market is wider than a legacy HRIS database but narrower than all enterprise software sold into HR. Bob's own platform page places core HR, time and attendance, time off, surveys, learning, compensation, workforce planning, analytics, payroll, and finance linkage in one connected HCM product. That scope overlaps directly with Workday HCM, SAP SuccessFactors, BambooHR, Rippling, UKG, Factorial, Lattice-adjacent talent tooling, and smaller SMB suites like Charlie. The status-quo substitute set still matters: smaller employers can stitch together payroll, ATS, engagement, and spreadsheet-based planning; larger employers can stay on incumbent suites and add point tools only when needed. For diligence purposes, the most relevant competitive pool is therefore cloud HCM/HRIS for modern SMB, mid-market, and upper-mid-market employers that want one system of record plus configurable workflows, integrations, analytics, and payroll connectivity. Budget ownership is increasingly cross-functional. Especially now.",
