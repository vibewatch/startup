callouts:
  - calloutType: risk
    title: Hallucinated Remediation Is the Defining Failure Mode
    body: >-
      An AI SRE agent that misclassifies a root cause and executes an automated remediation
      action in production does not merely fail to help—it actively causes harm. Unlike a false-
      positive alert or a missed anomaly, a bad automated action can cascade into a customer-facing
      outage of greater severity than the original event. This failure mode is structurally
      unmitigable without human-in-the-loop approval for all consequential actions, which
      eliminates the autonomous-efficiency claim that underpins the valuation. No third-party
      benchmark validates Resolve AI's root-cause accuracy, and this opacity alone justifies
      underwriting caution at a $1.5B valuation.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR008

  - calloutType: risk
    title: Hyperscaler Bundling Is a Structural, Not Cyclical, Threat
    body: >-
      AWS DevOps Guru, Azure Monitor AIOps, and Google Gemini Cloud Assist are not early-stage
      features Resolve AI can outrun through product iteration—they are strategic platform
      investments by hyperscalers with multi-billion-dollar infrastructure budgets and zero
      incremental procurement friction for existing customers. Every new enterprise account
      Resolve AI pursues requires winning a CIO-level evaluation of whether the hyperscaler's
      bundled AI is "good enough." Resolve AI's differentiation—multi-agent investigation,
      cross-cloud correlation, production autonomy—must remain demonstrably superior to bundled
      alternatives to justify the incremental spend and procurement overhead.
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR028

