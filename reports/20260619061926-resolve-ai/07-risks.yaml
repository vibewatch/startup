  - id: financial-funding-execution
    title: Financial, Funding, and Execution Risk
    body: >-
      Resolve AI has raised approximately $190 million across three rounds in under 18 months,
      most recently at a $1.5 billion valuation in April 2026. No ARR, gross margin, ACV, NRR,
      or burn rate is publicly disclosed, making it impossible to validate the implied revenue
      multiple underpinning the valuation. At an illustrative 20× ARR multiple—aggressive but not
      unprecedented for high-growth AI infrastructure at this stage—the valuation implies
      approximately $75 million in ARR, a figure that, given the company's 18-month age and 20+
      enterprise customer base with no disclosed pricing, appears aspirational rather than current.
      AI inference costs impose gross margin compression on AI-native SaaS platforms relative to
      traditional software peers, and Resolve AI's economics are further burdened by the Resolve
      AI Labs research investment announced in April 2026, which adds R&D capex with an uncertain
      commercial return timeline. Enterprise AI procurement cycles of 90–180 days per account,
      documented at DoorDash and implied by the comprehensive security reviews required for
      production-access AI agents, constrain revenue ramp velocity and create risk that CAC will
      outrun collections. Key person risk is critical: the investment thesis is inseparable from
      founders Spiros Xanthos and Mayank Agarwal, whose technical credibility, enterprise
      relationships, and domain expertise drive both product and customer acquisition. With only
      20+ named enterprise accounts, customer concentration risk is high; the largest three
      customers likely represent a disproportionate share of ARR, and loss of a Coinbase or
      DoorDash renewal would be material to the growth narrative. A market-wide AI valuation
      compression or a Resolve AI-specific growth miss could force a bridge round or a down-round
      below the $1.5B mark, materially impairing equity incentives and recruiting.
