  - id: security-permissions-blast-radius
    title: Security, Permissions, and Blast-Radius Risk
    body: >-
      Resolve AI's standard enterprise integration requires production-grade API access to customers'
      code repositories, infrastructure APIs (AWS, Kubernetes), observability platforms, and
      communication tools (Slack, MS Teams). An agent with read-write access to these systems
      creates a blast-radius risk profile that is materially larger than that of a traditional
      read-only SRE monitoring tool. If a Resolve AI agent is compromised through prompt injection,
      supply-chain attack, or LLM provider misconfiguration, an attacker could use the agent's
      production credentials to exfiltrate telemetry data, modify infrastructure, or execute
      arbitrary code at scale. The OWASP Top 10 for LLMs (2025 edition) explicitly identifies
      "excessive agency," "insecure plugin design," and "prompt injection" as the highest-risk
      vulnerability classes for autonomous AI agents with system access. Resolve AI mitigates
      through SOC 2 Type II certification, RBAC controls, encryption in transit and at rest, and
      the Resolve Satellite on-premises gateway for customers requiring minimal data egress.
      However, SOC 2 Type II attests to organizational control processes, not to the correctness
      of AI agent actions or the completeness of permission scoping for autonomous remediations.
      CISA's AI security guidance recommends that organizations apply the principle of least
      privilege to AI agents and conduct adversarial red-team testing before granting production
      write access—requirements that create additional procurement friction and limit default-on
      configuration of Resolve AI's most powerful autonomous features. Customer security teams
      must independently scope and approve each integration's permission surface before deployment,
      adding weeks to the enterprise onboarding process and increasing CAC.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    figureRefs: [FR003]

  - id: regulatory-legal
    title: Regulatory and Legal Exposure
    body: >-
      Resolve AI operates in a rapidly evolving regulatory environment for artificial intelligence,
      with multiple jurisdictions creating compliance obligations. The EU AI Act (Regulation
      2024/1689), which entered into force in August 2024 and is progressively applicable through
      2026, establishes a risk-based classification framework for AI systems. Autonomous AI agents
      operating in production infrastructure—making decisions that can directly cause service
      disruptions if incorrect—may be classified as high-risk AI systems under Article 6 and
      Annex III, triggering conformity assessment, technical documentation, human-oversight
      mechanism, and EU AI database registration requirements before market placement. This
      classification risk is unresolved for autonomous SRE agents as of June 2026; no EU AI Board
      opinion specific to this product category has been published. The FTC's June 2023 report on
      generative AI identified concentration risks and accountability gaps in AI-powered automated
      decision systems, signaling increasing enforcement attention to AI liability frameworks that
      could affect autonomous remediation vendors. NIST's AI Risk Management Framework (AI RMF
      1.0), while voluntary in the US, is increasingly required by enterprise procurement teams as
      a vendor evaluation baseline, creating compliance-documentation overhead. The GDPR's data
      processing requirements apply to customer telemetry from EU-based customers ingested by
      Resolve AI, creating data-processing-agreement obligations and cross-border transfer
      restrictions. Resolve AI's trust center confirms GDPR compliance but does not publicly
      disclose the cross-border transfer mechanism or whether standard DPAs are available for
      routine enterprise sign-on. No public record of pending litigation, regulatory investigation,
      or enforcement action against Resolve AI was identified as of June 2026, which is consistent
      with the company's early stage and limited public history rather than evidence of clean
      liability exposure.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
    tableRefs: [TR001]

  - id: competitive-displacement
    title: Competitive Displacement and Platform Bundling Risk
    body: >-
      Resolve AI competes against three converging threat vectors: hyperscaler-native AIOps
      features, established observability platform extensions, and emerging AI SRE startups.
      AWS DevOps Guru is an Amazon-native ML-powered operational insight service that integrates
      natively with CloudWatch and CodeGuru; it is available within existing AWS enterprise support
      contracts and faces no separate procurement hurdle for existing AWS customers. Azure Monitor's
      AIOps capabilities deploy machine learning for alert correlation, anomaly detection, and smart
      alert grouping, bundled into existing Azure infrastructure agreements. Google Cloud's Gemini
      Cloud Assist provides conversational AI-driven cloud operations support integrated into the
      Google Cloud Console as a standard platform feature. These hyperscaler offerings are not as
      sophisticated as Resolve AI's multi-agent autonomous investigation, but for enterprise
      accounts with a single dominant cloud provider they represent a "good enough" substitution
      that requires no incremental procurement budget, security review, or vendor onboarding.
      Datadog Bits AI, launched in 2024, embeds a generative-AI DevOps copilot directly into the
      Datadog platform, covering log analysis, alert summarization, and remediation suggestions—
      directly addressing Resolve AI's core use case for the large installed base of Datadog
      enterprise customers. The risk is structural: enterprise CIOs prefer to consolidate vendors,
      and bundled AI features from a platform they already standardize on require no incremental
      procurement cycle. Datadog ($2.68B FY2025 revenue) and PagerDuty ($1.17B+ FY2026 revenue)
      have massive incumbent distribution advantages and can afford to bundle AI features at near-
      zero incremental cost, eroding Resolve AI's addressable market for large accounts already
      standardized on either platform.
    claimRefs:
      - CR024
      - CR025
      - CR026
