  topStrengths:
    - 创始人-市场匹配度顶级：联合创始人打造过 OpenTelemetry，也曾在 Splunk 扩大可观测性产品。
    - Coinbase、DoorDash、Salesforce、Zscaler 等参考客户称解决问题时间明显缩短，说明产品价值真实存在。
    - 两年公司能拿到 Greylock、Lightspeed、DST Global、Salesforce Ventures 背书，投资人质量异常强。
    - 软件发布更快、生产复杂度上升之后，产品切中了真实运营瓶颈。
  topRisks:
    - ARR、毛利率、NRR、烧钱速度和客户集中度都没有公开数据，估值承销高度依赖叙事和投资人信号。
    - 生产环境自主修复带来幻觉、权限和影响半径风险，外部很难独立对标。
    - Datadog、Dynatrace、PagerDuty、AWS 等现有巨头可以把相邻 AI-SRE 能力打包进既有企业合同。
    - 早期客户证据强，但高度由厂商筛选；独立基准和更广泛验证仍有限。
    - $1.5B 估值隐含对未来 ARR 规模和留存的激进假设，公开信息尚未验证。
  unresolvedGaps:
    - 当前 ARR、季度增长、毛利率、NRR 和烧钱速度未公开披露。
    - 当前准确客户数、前十大客户集中度和合同结构仍未知。
    - 没有独立基准数据验证根因定位准确性和安全自主修复。
    - 2024-2026 年融资中的优先权堆叠、稀释和详细治理条款未公开。
    - Resolve AI Labs 路线图、模型评估方法和商业化时间表仍只披露了一部分。
