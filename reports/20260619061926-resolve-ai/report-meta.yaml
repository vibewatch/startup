companyProfile:
  summary: "Resolve AI is a San Francisco-based AI infrastructure startup founded in early 2024 by Spiros Xanthos and Mayank Agarwal, veteran observability builders who co-created OpenTelemetry and previously built Omnition before its sale to Splunk. The company sells an enterprise platform for autonomous incident investigation, on-call delegation, and production operations across code, infrastructure, and telemetry. Resolve AI reached a $1.5B valuation within roughly two years of founding, backed by Greylock, Lightspeed, DST Global, and Salesforce Ventures, and publicly cites customers including Coinbase, DoorDash, Salesforce, Zscaler, and MSCI. Despite the strong investor and customer signal, the company remains financially opaque: ARR, margins, NRR, burn, and verified customer count are undisclosed."
  founders:
    - name: "Spiros Xanthos"
      role: "CEO & Co-Founder"
      background: "Former observability founder and Splunk observability GM; co-created OpenTelemetry and previously co-founded Omnition."
      claimRefs: [CO009, CO011, CO013]
    - name: "Mayank Agarwal"
      role: "CTO & Co-Founder"
      background: "Former Splunk observability chief architect; co-created OpenTelemetry and previously co-founded Omnition."
      claimRefs: [CO010, CO011, CO013]
  foundingLocation: "San Francisco Bay Area, California, USA"
  headquarters: "San Francisco, CA, USA"
  productSummary: "Resolve AI offers a multi-agent platform that connects to observability tooling, code repositories, infrastructure APIs, and collaboration systems to triage alerts, investigate incidents, propose or execute remediations, and automate recurring production tasks. The product emphasizes a production knowledge graph, governed actions, MCP/API extensibility, and enterprise controls such as SOC 2 Type II, SAML SSO, RBAC, encryption, and the Resolve Satellite gateway."
  customerFocus: "Large engineering organizations with complex cloud-native production environments, especially fintech, cybersecurity, enterprise software, and consumer-internet teams running high alert volumes and formal SRE/on-call workflows."
  businessModel: "Enterprise subscription software sold through high-touch annual or multi-year contracts, with pricing gated behind direct sales engagement and integrations/support included in enterprise plans."
  stage: "Early-stage private company with seed, Series A, and Series A extension financing completed by April 2026."
  fundingStatus: "$35M seed (2024), $125M Series A at $1.0B (Feb 2026), and $40M Series A Extension at $1.5B (Apr 2026); total raised exceeds $190M."
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO011, CO017, CO022, CO023, CI005]

