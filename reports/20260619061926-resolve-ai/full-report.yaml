      - number: '6.3'
        title: Deployment Motion and Customer Expansion Patterns
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's customer case studies reveal a consistent deployment arc: customers begin with read-only
              investigation workflows and progressively expand AI agent autonomy as trust is established. The typical
              path begins with alert triage and root cause investigation in observation mode—agents surface findings
              without taking action—before advancing to a co-pilot stage in which agents propose actions for human
              approval. As confidence grows, customers grant supervised autonomous access for predefined incident
              classes, and eventually full autonomous operation for well-understood failure modes.

              The Coinbase deployment is the clearest proxy for the expansion model: starting from an initial pilot, the
              deployment grew to 100+ engineers actively using the platform with 250+ weekly AI sessions—a metric that
              implies daily operational dependency rather than experimental usage. DoorDash's deployment similarly
              scaled to a 50+ engineer team and multi-use-case scope including on-call, investigation, and operational
              workflows. This pilot-to-full-deployment expansion pattern suggests strong product stickiness once
              engineers are integrated into the agent-assisted workflow.

              Resolve AI's product supports multiple workflow entry points: the on-call delegation module for alert
              triage, the incident investigation module for collaborative root cause analysis, and the operational tasks
              module for scheduled or triggered workflows. This modular structure enables land-and-expand within a
              single enterprise: initial deployment in one SRE team's incident workflow can expand to additional teams,
              additional alert sources, and eventually autonomous remediation as risk tolerance increases.

              The April 2026 launch of Resolve AI Labs and the Snowflake Cortex Training partnership signal a strategic
              investment in reinforcement learning–based models trained on production incident data, which would
              increase platform stickiness by making each customer's model incrementally more accurate over time—a
              potential compounding retention advantage. However, no cohort data, ARR expansion metrics, or documented
              land-and-expand revenue trajectories have been disclosed. The expansion story is inferred from usage
              volume proxies (session counts, engineer headcount on platform) rather than from financial retention data.
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
