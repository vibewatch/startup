  - id: FV001
    title: Valuation Multiple Sensitivity to ARR Scenario
    type: bar
    layout: standard
    summary: >
      Implied ARR multiple at $1.5B valuation across ARR assumption scenarios; Datadog's 21.6x TTM multiple is shown as
      the high-growth public benchmark.
    data:
      items:
        - label: $25M ARR
          value: 60
        - label: $50M ARR
          value: 30
        - label: $75M ARR
          value: 20
        - label: $100M ARR
          value: 15
        - label: $150M ARR
          value: 10
    approximationNotes: >
      All ARR figures are hypothetical; Resolve AI has not disclosed revenue. Datadog public benchmark of 21.6x TTM
      revenue is based on June 2026 market capitalization of $79.4B vs TTM revenue of $3.67B.
    claimRefs:
      - CV007
      - CV012
      - CV030
      - CV031
