    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Product Mission
        blocks:
          - type: paragraph
            body: >-
              Resolve AI is an artificial intelligence company headquartered in San Francisco, California, founded in
              early 2024 by Spiros Xanthos and Mayank Agarwal immediately following the $28 billion Cisco acquisition of
              Splunk in March 2024. The company's self-described category is "AI for prod"—AI that runs and operates
              software in production so engineers can focus on building rather than firefighting. The founding thesis is
              that while AI coding assistants have dramatically accelerated software development, the bottleneck has
              shifted to production operations: at many enterprises, engineering teams spend 70–80% of their time
              responding to alerts, debugging incidents, and coordinating across siloed tools rather than creating new
              value. As AI coding agents accelerate code generation, this operational burden is expected to intensify.

              Resolve AI's core product is a multi-agent system that connects to a company's existing production
              stack—observability tools, code repositories, infrastructure management, and communication platforms—and
              constructs a continuously-updated knowledge graph of the production environment. When an alert fires, AI
              agents immediately begin parallel investigation across logs, metrics, traces, infrastructure events, and
              change history, producing a root-cause hypothesis with supporting evidence before the on-call engineer
              even opens their laptop. The platform supports three primary use cases: autonomous on-call delegation
              (agents triage and investigate alerts automatically), collaborative incident resolution (co-working with
              agents in Slack or MS Teams channels), and automated operational workflows (health checks, report
              generation, multi-step investigations on schedule or trigger).

              Enterprise security controls include SOC 2 Type II certification, GDPR and HIPAA compliance, SAML SSO,
              RBAC, encryption in transit and at rest, and a firm commitment that customer data is not used to train
              models for others. Integrations connect via MCP, APIs, and webhooks to AWS, Kubernetes, GitHub, Slack, MS
              Teams, and major observability platforms. The Resolve Satellite provides a secure on-premises gateway for
              data access in the most security-conscious environments.
