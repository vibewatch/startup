  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Typical customer progression from initial evaluation through full autonomous SRE operations, inferred from
      published case study language and standard enterprise AI adoption patterns. Stages are representative and do not
      reflect a contractually defined onboarding path.
    data:
      items:
        - label: Discovery and Evaluation
          description: >-
            Engineering leader identifies AI SRE tool need via peer reference, field network, or alert-fatigue pain.
            Resolve AI evaluated alongside Datadog Bits AI SRE, PagerDuty SRE Agent, and open-source alternatives.
            DoorDash case study notes 2× better RCA accuracy vs. evaluated alternative.
          timeframe: Days 1–30
          tone: neutral
        - label: Read-Only Pilot
          description: >-
            Agents connect to production stack in observation mode. AI surfaces alert investigations, root cause
            hypotheses, and runbook suggestions without taking any production actions. SREs validate quality of AI
            outputs against their own judgments.
          timeframe: Days 31–60
          tone: neutral
        - label: Co-pilot Mode
          description: >-
            Agents draft remediation actions; SREs review and approve before execution. Coinbase and Zscaler deployments
            imply this phase given the documented reduction in investigation time with maintained engineer oversight.
          timeframe: Months 2–4
          tone: positive
        - label: Supervised Autonomous
          description: >-
            Agents execute well-defined remediation classes autonomously; SREs review post-action logs. Trust
            established for defined incident categories. Requires security review and RBAC configuration. Longer cycle
            at regulated financial accounts.
          timeframe: Months 4–8
          tone: positive
        - label: Full Autonomous
          description: >-
            Agents fully own defined incident classes end-to-end. SREs focus on novel or high-severity incidents outside
            the autonomous scope. Represents the maximum efficiency state and highest product stickiness. Blast-radius
            risk requires mature governance model.
          timeframe: Months 8+
          tone: positive
    approximationNotes: >-
      Timeline estimates are inferred from case study context and standard enterprise AI adoption research. No formal
      onboarding timeline has been published by Resolve AI. The DoorDash deployment (mid-2025) and Coinbase deployment
      (2024–2025) are the primary proxies for deployment duration, but stage durations vary significantly by customer
      size and risk tolerance.
    claimRefs:
      - CU024
      - CU025
