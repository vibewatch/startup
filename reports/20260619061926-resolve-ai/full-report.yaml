      - number: '1.5'
        title: Milestones, Growth Path, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's two-year trajectory from founding to a $1.5 billion valuation is notable even by 2024–2026 AI
              funding standards. The milestones reflect both capital-raising velocity and product-market fit signals
              from tier-1 enterprise deployments. The company launched in stealth in early 2024 and emerged publicly
              approximately 16 months before its February 2026 Series A—placing the stealth exit around October 2024.

              The competitive landscape has intensified materially during Resolve AI's operating life. Datadog shipped
              Bits AI SRE to general availability in June 2025; PagerDuty launched its SRE Agent in early access in Q2
              2026; AWS released a DevOps Agent with published case studies claiming 77% MTTR reductions; New Relic
              shipped an SRE Agent preview in February 2026; and incident.io claims its AI SRE handles 80% of initial
              incident response autonomously. These incumbents enter with existing data estates, deeply embedded
              enterprise contracts, and bundled pricing that can undercut standalone AI SRE tools on a
              total-cost-of-ownership basis. A June 2026 independent buyer comparison (Fundesk.io) evaluated six leading
              AI SRE platforms—Datadog, PagerDuty, New Relic, AWS, incident.io, and an open-source option—without
              including Resolve AI, reflecting the startup's limited mindshare relative to established observability
              vendors.

              The April 2026 launch of Resolve AI Labs signals a strategic pivot toward proprietary domain-specific
              models, acknowledging that general-purpose foundation models are insufficient for production environments.
              This increases capital intensity and execution risk but could provide durable competitive moats if the
              research program succeeds. AI accuracy, hallucination, and reliability risks in production environments
              remain material technical concerns for the category as a whole, with no independent benchmark data
              published for Resolve AI's specific models.
