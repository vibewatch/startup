    title: Investment KPI Scorecard (0–10)
    type: kpi
    layout: standard
    summary: >
      IC-ready scoring of Resolve AI across seven investment dimensions; economics score is severely penalized by absent
      financial disclosure.
    data:
      items:
        - label: Market Opportunity
          value: 8
        - label: Product / Technology
          value: 8
        - label: Customer Proof
          value: 6
        - label: Economics / Financials
          value: 2
        - label: Competitive Moat
          value: 6
        - label: Valuation Discipline
          value: 4
        - label: Evidence Quality
          value: 3
    approximationNotes: >
      Scores are author assessments (0=lowest, 10=highest). Economics/Financials scored 2 because no ARR, margin, NRR,
      or burn data is publicly disclosed. Evidence Quality scored 3 because investor entry signal (DST) is the strongest
      available proxy; no financial KPIs corroborate. All scores are as of June 2026 and subject to revision upon
      financial disclosure.
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV006
