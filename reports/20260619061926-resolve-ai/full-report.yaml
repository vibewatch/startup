  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technical and AI Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's core value proposition requires AI agents to autonomously diagnose root causes and, in
              mitigation mode, execute corrective actions in production environments. This creates a direct-consequence
              failure mode absent in traditional SRE monitoring tools: a hallucinated or misclassified root-cause
              hypothesis can trigger a remediation action that worsens an outage rather than resolves it. A 2023 arXiv
              survey of hallucination in large language models (arXiv:2309.01219) documented that LLMs produce confident
              but factually incorrect outputs across multi-step reasoning tasks, and the frequency of such errors in
              complex distributed- systems diagnosis—where causal chains span dozens of interdependent services—has not
              been independently measured for any production AI SRE vendor as of June 2026. Resolve AI's published case
              studies report 60–87% MTTI reductions, but these metrics are self-reported through customer testimonials
              on the company's own website without independent third-party validation or audit. This benchmark opacity
              means investors cannot price root-cause accuracy risk with confidence. Enterprise customers evaluating
              Resolve AI must accept that the AI's accuracy in their specific stack architecture is unknown until a
              pilot is conducted—itself extending the procurement cycle. The OWASP Top 10 for Large Language Model
              Applications identifies "hallucination," "excessive agency," "insecure plugin design," and "prompt
              injection" as the four highest-risk vulnerability classes for agentic AI systems, and Resolve AI's
              autonomous git-commit and infrastructure-change capabilities fall squarely in the "excessive agency" risk
              category. Mitigation through human-in-the-loop approval gates for high-impact actions is documented in
              Resolve AI's product documentation, but the default configuration and the boundary between supervised and
              fully autonomous execution are not publicly specified, creating diligence uncertainty for enterprise
              security teams.
