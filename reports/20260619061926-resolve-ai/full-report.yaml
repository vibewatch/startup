      - number: '7.2'
        title: Security, Permissions, and Blast-Radius Risk
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's standard enterprise integration requires production-grade API access to customers' code
              repositories, infrastructure APIs (AWS, Kubernetes), observability platforms, and communication tools
              (Slack, MS Teams). An agent with read-write access to these systems creates a blast-radius risk profile
              that is materially larger than that of a traditional read-only SRE monitoring tool. If a Resolve AI agent
              is compromised through prompt injection, supply-chain attack, or LLM provider misconfiguration, an
              attacker could use the agent's production credentials to exfiltrate telemetry data, modify infrastructure,
              or execute arbitrary code at scale. The OWASP Top 10 for LLMs (2025 edition) explicitly identifies
              "excessive agency," "insecure plugin design," and "prompt injection" as the highest-risk vulnerability
              classes for autonomous AI agents with system access. Resolve AI mitigates through SOC 2 Type II
              certification, RBAC controls, encryption in transit and at rest, and the Resolve Satellite on-premises
              gateway for customers requiring minimal data egress. However, SOC 2 Type II attests to organizational
              control processes, not to the correctness of AI agent actions or the completeness of permission scoping
              for autonomous remediations. CISA's AI security guidance recommends that organizations apply the principle
              of least privilege to AI agents and conduct adversarial red-team testing before granting production write
              access—requirements that create additional procurement friction and limit default-on configuration of
              Resolve AI's most powerful autonomous features. Customer security teams must independently scope and
              approve each integration's permission surface before deployment, adding weeks to the enterprise onboarding
              process and increasing CAC.
