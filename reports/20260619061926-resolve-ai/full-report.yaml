      - number: '6.4'
        title: Retention Signals and NRR Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's retention and revenue expansion story cannot be independently assessed from public
              information. The company has not disclosed net revenue retention (NRR), gross revenue retention (GRR),
              customer churn rates, logo retention statistics, or any financial metrics related to customer expansion
              over time. As a private company with no regulatory filing requirements, this absence is structurally
              expected—but it remains a material evidence gap for investors evaluating the sustainability of early ARR.

              Several indirect signals suggest product stickiness. Coinbase's 250+ weekly AI sessions across 100+
              engineers indicates deep operational integration unlikely to be reversed in a short-cycle contract
              evaluation. DoorDash's 50+ engineer deployment, sustained since mid-2025, similarly implies renewal-grade
              usage rather than pilot engagement. No case study mentions any customer departing from the platform or
              reverting to manual processes after initial deployment. However, the absence of churn is not equivalent to
              confirmed retention: these case studies are company-curated and inherently survivor-biased—they represent
              deployments the company chose to publicize, not a representative cross-section of outcomes.

              The DORA 2025 State of AI-Assisted Software Development report provides a relevant industry signal: AI
              tools that are deeply integrated into daily engineering workflows— particularly those involved in
              post-deployment safety and reliability—demonstrate significantly higher stickiness than tools used
              episodically or for experimentation. Resolve AI's design as a persistent runtime agent (rather than a
              query-on-demand tool) structurally positions it for high retention once deployed, but this thesis cannot
              be confirmed without ARR cohort data or independent customer surveys.

              Review platform evidence is entirely absent: G2, Gartner Peer Insights, ProductHunt, and Reddit's r/sre
              community yielded no accessible Resolve AI reviews as of June 2026, consistent with the product's October
              2024 launch date and limited time in the market to accumulate third-party review volume. This gap is
              expected rather than alarming at this stage, but it prevents any systematic net promoter score or customer
              satisfaction inference.
