      - number: '5.4'
        title: Enterprise Security and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Resolve AI holds SOC 2 Type II certification and claims HIPAA and GDPR compliance, documented through a
              Drata-powered trust center. Data encryption uses AES-256 at rest and TLS 1.2+ for all traffic in transit
              between customer environments, the Satellite, and Resolve AI cloud. SAML and OIDC SSO (Google, Okta, Azure
              AD) with automatic user provisioning is available; RBAC covers Member and Admin roles with team-level and
              individual-level permission overrides. The platform enforces read-only access to observability data by
              default; write-permission integrations (mitigation execution, PR creation) are explicitly opt-in and
              require separate credential scopes. Customer data never leaves the Satellite perimeter without applying
              regex-based redaction patterns configurable by the customer. Customer data is not used to train models for
              other customers; organization-specific fine-tuning is available exclusively to the owning organization.
              The security architecture has been validated in the most demanding regulated environments in the customer
              base: Coinbase (crypto, financial regulatory exposure), Zscaler (zero-trust network security, SOC-class
              requirements), and Salesforce (enterprise SaaS, global data residency obligations). Gaps include the
              absence of publicly accessible SOC 2 audit reports, undisclosed recertification schedules, and no
              published documentation of SCIM provisioning support or FedRAMP status, which limits adoptability for U.S.
              federal and defense verticals.
