      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Underwriting Caveat — Revenue Undisclosed
            body: >
              No ARR, gross margin, NRR, burn rate, or unit economics have been disclosed by Resolve AI. Any valuation
              stance above "unknown" is speculative without financial verification. The $1.5B valuation is defensible IF
              ARR exceeds $75M with strong growth and NRR — but this is unconfirmable from public evidence. DST Global's
              entry is the strongest indirect signal of revenue health, but is not a substitute for disclosed metrics.
              Investment committees should treat this chapter's valuation range as illustrative, not binding, pending
              formal diligence.
            calloutType: risk
            claimRefs:
              - CV006
              - CV042
              - CV008
          - type: callout
            title: DST Global Entry as Proxy for Revenue Visibility
            body: >
              DST Global's decision to lead the April 2026 Series A Extension at $1.5B is the most informative single
              data point available on Resolve AI's financial health. DST typically invests in companies with
              substantial, verified ARR — their Gong investment was made when Gong had over $100M ARR. The April 2026
              DST entry implies internal financial validation at a threshold likely between $50M and $100M ARR, though
              this remains inferential and does not substitute for direct financial disclosure.
            calloutType: insight
            claimRefs:
              - CV008
              - CV016
              - CV033
              - CV040
          - type: callout
            title: PagerDuty Precedent — Multiple Compression Risk
            body: >
              PagerDuty reached a peak market capitalization above $9B in 2021, then compressed to $654M by June 2026 —
              an 87% decline — as revenue growth decelerated from 30%+ to 5.4% and ARR growth stalled. This precedent
              illustrates how quickly observability and incident management multiples can collapse when growth
              expectations are not met. Resolve AI's $1.5B valuation is not immune to this risk, particularly if Datadog
              Bits AI achieves enterprise traction and reduces the urgency for a specialized AI SRE platform.
            calloutType: risk
            claimRefs:
              - CV015
              - CV017
              - CV035
              - CV029
          - type: callout
            title: Assumption — DST Entry Implies $50M–$100M ARR Floor
            body: >
              The valuation analysis assumes DST Global's participation at $1.5B implies private ARR of $50M–$100M. This
              is an inference, not a confirmed fact. If DST's entry was driven by strategic positioning (e.g., access to
              enterprise production data or pre-emptive positioning ahead of a competitor acquisition) rather than
              revenue-led conviction, the ARR assumption could be materially lower, which would push the valuation
              stance from "stretched" to "expensive."
            calloutType: assumption
            claimRefs:
              - CV008
              - CV033
              - CV040
              - CV041
