            body: >-
              Resolve AI defines its category as "AI for prod"—AI systems that run and operate software in production so
              engineers can build rather than firefight. The platform comprises three core agent product areas, all
              generally available: On-Call agents that participate in every alert rotation and post a root-cause
              hypothesis before the on-call engineer is paged; Incidents agents that launch parallel investigation
              threads across code, infrastructure, and telemetry, building causal timelines inside collaborative Slack
              or MS Teams channels; and Background agents that execute scheduled or trigger-based operational workflows
              such as deployment monitoring, reliability reports, and resource optimization. A fourth surface, Custom
              Agents, exposes the platform via MCP, REST API, and the agentskills.io Skills interface so engineering
              teams and external AI agents can embed Resolve AI capabilities without rebuilding investigation
              primitives. The Workbench UI provides a visual investigation canvas where engineers steer agents during
              live incidents. Resolve AI also offers a sandbox playground environment pre-configured with a live
              19-microservice e-commerce application on AWS EKS, giving prospects a friction-free evaluation path with
              real telemetry and real errors before connecting production data. Customer outcomes across five published
              case studies range from 60% to 87% reductions in investigation time, with DoorDash achieving the headline
              result of compressing a 40-minute investigation to approximately 1 minute, and Blueground reaching 100%
              autonomous alert investigation coverage. All metrics are drawn from company-authored case studies, which
