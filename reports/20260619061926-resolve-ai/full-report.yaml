      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The economic buyer for AI SRE platforms is typically a VP of Engineering, VP of Infrastructure, or Head of
              SRE at an organization with significant production complexity — defined operationally as multi-cloud
              deployments, microservices at scale, and on-call engineering teams experiencing alert fatigue. The end
              user is the on-call SRE or DevOps engineer who interacts daily with monitoring dashboards and paging
              systems. The budget payer is typically the IT Operations or Platform Engineering cost center, not the
              application development budget. LogicMonitor's 2026 survey of 100 VP+ IT decision-makers with
              observability budget authority found that 75% hold final decision-making authority for platform selection.
              Critically, 96% expect observability spending to hold steady or grow, with 62% anticipating budget
              increases — positioning AI SRE within protected infrastructure spend rather than discretionary or
              experimental AI budgets.

              Primary buyer segments include: (1) large enterprises (>1,000 engineers) with complex multi-cloud
              environments and formal SRE practices; (2) high-growth SaaS companies facing rapid release cycles and
              on-call burnout; (3) financial services firms with strict uptime SLAs and compliance requirements; and (4)
              healthcare and regulated industries with patient safety mandates. The adoption trigger in all segments is
              acute — typically a major incident, a pattern of engineer burnout complaints, or a reliability-driven CTO
              mandate following a high-profile outage. The 2024 CrowdStrike outage, estimated at $5B+ in losses to
              Fortune 500 companies, materially elevated executive awareness of reliability tooling across all
              enterprise verticals. Tool consolidation is also a significant demand driver: 84% of organizations are
              actively pursuing or considering platform consolidation, and 74% express openness to a single unified
              platform that meets requirements — a purchasing disposition that favors integrated AI SRE platforms over
              point tools.
