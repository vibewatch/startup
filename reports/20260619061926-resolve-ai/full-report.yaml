  - id: FV002
    title: Valuation Scenario Range (USD Millions)
    type: range
    layout: standard
    summary: >
      Bull, base, and bear valuation ranges for Resolve AI at June 2026; current $1.5B mark shown against
      probability-weighted scenario outcomes.
    data:
      items:
        - label: Bear Case (25% probability)
          low: 300
          high: 450
        - label: Base Case (45% probability)
          low: 800
          high: 2100
        - label: Bull Case (30% probability)
          low: 1200
          high: 1900
    approximationNotes: >
      Valuations derived from ARR assumption ranges and multiple benchmarks from public comps. Probability weights are
      author estimates; no actuarial basis. Probability-weighted midpoint is approximately $1.11B, or ~26% below the
      current $1.5B mark.
