  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and Revenue Run Rate
        - Quarterly ARR progression from product launch to current; current quarterly run rate
        - Cannot assess valuation multiple, growth rate, or Series B target without this
        - CFO; request quarterly revenue waterfall and ARR bridge from inception
      - - Net Revenue Retention
        - Trailing 12-month NRR by cohort and customer segment
        - Determines whether ARR growth is organic expansion or requires expensive new sales
        - CFO/CRO; request cohort-level retention data and gross-revenue retention separately
      - - Gross Margin
        - GAAP and non-GAAP gross margin by quarter with AI inference cost breakdown
        - Evaluates SaaS margin quality; determines if inference/training costs are scalable
        - CFO; request P&L by quarter; break out AI inference, model training, and hosting COGS
      - - Customer Count and Concentration
        - Total active customer count; top-10 customers as percentage of ARR
        - Assesses concentration risk; named logos may represent 80%+ of ARR
        - CRO; customer census with ARR ranges; segment by industry and contract size
      - - Burn Rate and Runway
        - Monthly net burn rate; cash position post Series A Extension close
        - Determines next-round timing; runway signals whether Series B is needed within 12 months
        - CFO; request budget model and bank balance confirmation; confirm deployment plan for $190M
      - - Cap Table and Preference Overhang
        - Full capitalization table; liquidation preference stack and seniority
        - Returns analysis requires understanding preference seniority and anti-dilution provisions
        - CFO/legal; request cap table from counsel; review financing documents for anti-dilution terms
      - - Win-Loss vs Competitors
        - Win-loss data vs Datadog Bits AI, Dynatrace, NeuBird AI in head-to-head deal cycles
        - Validates competitive differentiation and whether the product has demonstrated displacement wins
        - CRO; request deal-level competitive data; interview 3 recent wins and 2 recent losses
    notes: >
      These are the minimum seven disclosures required before any capital deployment at $1.5B or above. All are standard
      pre-investment due diligence requests and would not be extraordinary for a company at this funding stage. The
      absence of public disclosure on these metrics is not unusual for a private company; the lack of investor
      confirmation of financial KPIs in the public record is the evidence gap driving the research-more recommendation.
    claimRefs:
      - CV006
      - CV042
      - CV043
      - CV044
