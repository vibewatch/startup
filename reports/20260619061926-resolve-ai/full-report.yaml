      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: >-
              Resolve AI has raised over $190 million across three distinct financing events in under two years,
              reaching a $1.5 billion post-money valuation by April 2026—making it one of the fastest enterprise AI
              companies to achieve and then exceed unicorn status.

              The $35 million seed round was led by Greylock Partners (Saam Motamedi), representing the firm's largest
              single check issued in 2024, with co-investment from Unusual Ventures. This round drew a remarkable angel
              syndicate including Stanford Professor Fei-Fei Li, Google DeepMind Chief Scientist Jeff Dean, LinkedIn
              co-founder Reid Hoffman, GitHub CEO Thomas Dohmke, AWS CEO Matt Garman, Accenture CTO Paul Daugherty, and
              Stanford professor Christos Kozyrakis, alongside founders and executives from OpenAI, Ramp, Notion, and
              Snowflake.

              The $125 million Series A at a $1 billion valuation, announced February 4, 2026, was led by Lightspeed
              Venture Partners (Sebastian Duesterhoeft, Partner). Existing investors Greylock, Unusual Ventures,
              Artisanal Ventures, and A* all invested above their pro rata, a strong insider conviction signal. The
              round brought total capital to over $150 million, just 16 months after the company emerged from stealth.

              The $40 million Series A Extension at a $1.5 billion valuation, announced April 16, 2026, was led by DST
              Global (Rahul Mehta, Co-founder and Managing Partner) and Salesforce Ventures (Zak Kokosa, Principal) as
              strategic co-investor. Salesforce's dual position as both a named enterprise customer and strategic
              investor is an unusual alignment that validates commercial value while also creating potential dependency
              risk if the relationship changes. Funding proceeds are earmarked for platform development, go-to-market
              expansion, and long-term research through Resolve AI Labs.
