      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >
              The primary structural driver is the mismatch between alert volume and human capacity. Average on-call
              engineers receive roughly 50 alerts per week, of which only 2–5% require real human intervention; 70% of
              SRE teams list alert fatigue as a top-three operational concern. This problem is accelerating: the DORA
              2025 State of AI-Assisted Software Development report found that incidents per PR increased 242.7% as AI
              coding assistants accelerated delivery without a commensurate improvement in incident response capacity.
              Engineers collectively spend 40% of their working time on incident management rather than product
              development per the 2026 State of Production Reliability Report (NeuBird). This productivity tax creates a
              direct and quantifiable ROI case for autonomous SRE tooling.

              Multi-cloud complexity amplifies the structural demand: organizations operate an average of 2.4 public
              cloud providers with 70% running hybrid strategies. Correlating incidents across AWS, Azure, and GCP by
              hand is increasingly impractical as systems grow in scale and interdependency. The analyst community
              codified this shift in 2026: Gartner's Market Guide for AI SRE Tooling projected that 70% of enterprises
              will deploy agentic AI to operate IT infrastructure by 2029, up from less than 5% in 2025. Hyperscaler
              validation came with Microsoft's Azure SRE Agent reaching general availability in March 2026, while
              Datadog launched more than 100 AI features at DASH 2026 to push autonomous AI operations. Both events
              simultaneously validate the category and intensify competitive pressure. Enterprise AI investment broadly
              is forecast to approach $2 trillion globally in 2026 (Dynatrace press release), making AI operations
              tooling a spending priority tied to the broader enterprise AI buildout.
