      - number: '5.3'
        title: Integrations, Extensibility, and the MCP Layer
        blocks:
          - type: paragraph
            body: >-
              Resolve AI ships 60+ pre-built integrations spanning telemetry (Datadog, Grafana, Prometheus, Sentry, New
              Relic, Loki), infrastructure (AWS, GCP, Kubernetes, AlertManager, Kloudfuse), code (GitHub, GitHub
              Enterprise Server, GitLab, Bitbucket, Azure DevOps), knowledge (Notion, Confluence, Google Drive), and
              collaboration (Slack, MS Teams, Linear, Jira). Environment matching—requiring consistent naming (e.g.,
              "production", "us-west") across Satellite configuration and observability tools—is the primary
              configuration dependency. Git integration runs either on Resolve-managed cloud infrastructure or within
              the customer's own Kubernetes or ECS cluster; it supports OAuth-style app installation for GitHub,
              bring-your-own GitHub App for GHE, and personal access tokens for all other providers. The platform
              exposes an MCP server (Beta) at app0.resolve.ai/mcp using stateless Streamable HTTP transport, enabling
              Claude Code, Cursor, and other MCP-compatible agents to call Resolve for investigation queries, historical
              lookups, and telemetry correlation as native tool calls. A REST API provides programmatic access to
              investigation listing (by time range and alert labels), investigation detail retrieval, and investigation
              initiation. The Skills layer implements the agentskills.io open standard—the same format adopted by Claude
              and other agentic tools—so procedural knowledge packaged for Resolve travels to any compatible agent and
              vice versa. AWS Marketplace and Slack Marketplace distribution expand procurement channels for enterprise
              teams with existing agreements.
