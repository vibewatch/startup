  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Landscape
        blocks:
          - type: paragraph
            body: >
              Resolve AI operates at the intersection of three adjacent but analytically distinct market categories:
              AIOps platforms, AI-enhanced observability, and incident response automation. The core value proposition —
              autonomous alert investigation, root cause analysis (RCA), and guided or automated remediation —
              constitutes what Gartner labeled "AI SRE tooling" in its inaugural 2026 Market Guide. This sub-category is
              meaningfully narrower than the broad AIOps platform market, which includes event correlation, anomaly
              detection, ITSM workflow automation, and predictive capacity management. The excluded spend includes
              classical observability infrastructure (metric/log/trace collection tools such as Prometheus, Grafana, or
              raw Datadog ingest), security incident response (SOAR/SIEM), and headcount for traditional SRE teams.

              The market's status-quo substitutes are: (1) human on-call SRE engineers responding manually to paging
              alerts; (2) legacy AIOps correlation tools (BigPanda, Moogsoft) that reduce alert noise but leave
              investigation to humans; (3) AI-assisted copilots that surface suggestions without autonomous action; and
              (4) general-purpose LLM chatbots applied ad-hoc. The emerging AI SRE category crystallized in 2024–2026 as
              agent frameworks matured, LLMs reached sufficient reliability for multi-step tool use, and hyperscalers
              like Microsoft released production-grade offerings (Azure SRE Agent GA: March 10, 2026). Adjacent
              observability and ITSM spend is the upstream data source and distribution channel for AI SRE platforms,
              not a substitute. Vendors such as Dynatrace and Datadog are simultaneously partners (providing telemetry)
              and competitors (bundling AI SRE features into their platforms).
