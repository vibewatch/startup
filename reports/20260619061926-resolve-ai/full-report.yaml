              - CV006
              - CV026
              - CV042
      - number: '8.6'
        title: Exit Readiness and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit readiness is early-stage. An IPO path is plausible in 2027–2028 if ARR scales to $200–$300 million
              with 70%-plus year-over-year growth and 70%-plus gross margins, using Datadog as the high-multiple
              benchmark for AI infrastructure SaaS. At that scale, a 15–20x forward revenue multiple against $250
              million ARR would support a $3.75–$5 billion valuation, delivering meaningful return from the $1.5 billion
              current mark — but only if gross margin is demonstrably above 70% and the company has reduced its
              dependence on a small number of named accounts. An M&A exit is perhaps more likely in the 2025–2027 window
              given the strategic alignment: Datadog, Salesforce, ServiceNow, and Cisco are all expanding AIOps
              capabilities and would benefit from Resolve AI's production-specific training data, customer
              relationships, and proprietary model IP. Historical M&A multiples in AI infrastructure suggest 8–12x
              trailing ARR as a strategic acquisition range with synergy premiums, implying a potential acquisition
              value of $600 million to $1.2 billion at $75 million ARR — lower than the current round price,
              underscoring the importance of growth trajectory verification.


              Thesis-break triggers are defined with measurable thresholds. The most critical is an ARR below $50
              million at the time of any Series B raise, which would imply the current $1.5 billion valuation was
              premature and force a re-rating. Other thesis-break events include: churn at any of the five named anchor
              customers (Coinbase, DoorDash, Salesforce, Zscaler, or MSCI); documented Datadog Bits AI adoption by more
              than 10% of Resolve AI's target ICP; NRR falling below 100% after 12 months; departure of the founding
              team; or a down-round at Series B. Final diligence asks are structured in the diligence table and
              represent the minimum disclosures required before any capital deployment at $1.5 billion or above.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV044
          - type: table
