      - number: '8.5'
        title: Recommendation and Risk Rating
        blocks:
          - type: paragraph
            body: >
              The recommendation for Resolve AI at the current $1.5 billion valuation is research-more, with low
              confidence and a high risk rating. The valuation stance is stretched-to-unknown: the price could be fair
              if ARR exceeds $75 million with strong growth and NRR, but cannot be confirmed without financial
              disclosure. The core underwriting caveat is categorical: no investment decision at $1.5 billion or any
              Series B price is supportable without confirmation of ARR, quarterly growth rate, gross margin, NRR,
              top-10 customer concentration, and monthly burn rate. Without these seven metrics, any positive
              recommendation would be speculative narrative investment, not evidence-based underwriting.


              The company's strengths are genuine and material: the founding team, investor signal, named customers, and
              market timing are all strong. The Resolve AI Labs launch with Dhruv Mahajan — who led post-training for
              Llama foundation models at Meta — represents a serious proprietary model development investment that, if
              successful, could establish a durable technical moat. But these qualitative factors do not substitute for
              financial evidence at a $1.5 billion price. The adverse signal from the competitive landscape — Datadog's
              100-feature DASH 2026 launch targeting autonomous AI ops, NeuBird AI's direct challenge to the category,
              and incident.io's position that AI hype exceeds actual utility — all create margin-compression risk if
              Resolve AI cannot demonstrate measurable differentiation through financial KPIs. The entry price should be
              tracked pending financial disclosure; a defensible entry range of $800 million to $1.4 billion would be
              appropriate if ARR confirms at $50–$80 million with 100%-plus growth and NRR above 120%.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV042
              - CV043
              - CV044
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV019
              - CV008
              - CV006
              - CV026
