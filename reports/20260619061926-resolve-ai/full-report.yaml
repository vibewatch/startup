      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >-
              Resolve AI was founded by Spiros Xanthos (CEO) and Mayank Agarwal (CTO), who have collaborated for over
              two decades since first meeting in graduate school at the University of Illinois Urbana-Champaign and
              working together continuously since 2012. Together they co-created OpenTelemetry, now the dominant
              open-source standard for telemetry data management adopted broadly across the enterprise cloud industry.
              Prior to Resolve AI, they founded Omnition, which Splunk acquired in 2019; they then led Splunk's
              observability business as General Manager and Chief Architect respectively until Cisco's 2024 Splunk
              acquisition prompted their departure to found Resolve AI.

              This founding pedigree represents exceptionally strong founder-market fit. The pair built the tooling
              (OpenTelemetry) whose telemetry data Resolve AI's agents now reason over, operated large-scale
              observability infrastructure at Splunk, and have two prior successful exits validating their capacity to
              build and scale enterprise companies. Xanthos frames the mission as solving the "second half" of software
              engineering: not writing code faster, but running what gets written reliably at the same pace.

              In April 2026, Dhruv Mahajan joined as Chief AI Scientist to lead the newly launched Resolve AI Labs.
              Mahajan previously led post-training efforts for large-scale Llama foundation models at Meta's
              Superintelligence Labs, bringing frontier AI research capability to complement the founders' production
              engineering domain expertise. As of the February 2026 Series A announcement, the company employed
              approximately 120 people, including 14 researchers from Google's DeepMind and contributors from Meta's
              Superintelligence Labs and Google Deep Research teams. Investor-advisors include Greylock's Saam Motamedi
              and Lightspeed's Sebastian Duesterhoeft at the board level. CEO concentration in a single co-founder is a
              key-person risk that warrants governance monitoring.
