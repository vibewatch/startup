  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR below bull-case at Series B
        - ARR <$50M at next primary raise
        - Current $1.5B implies >30x ARR; unsupportable Series B pricing; down-round risk
        - Exit or restructure position; no follow-on investment at higher valuation
      - - Named customer churn
        - Loss of Coinbase, DoorDash, Salesforce, Zscaler, or MSCI
        - Reference-account narrative collapses; raises platform-fit and NRR concerns
        - Immediate diligence on contract terms and retention data; recommend avoid
      - - Datadog Bits AI enterprise displacement
        - Datadog documented in >10% of Resolve AI target ICP competitive deals
        - Erodes differentiation; pricing pressure; integration advantage vs standalone
        - Reassess moat; evaluate whether proprietary models remain defensible at scale
      - - NRR below 100% at 12-month cohort
        - Net Revenue Retention <100% for any 12-month cohort post-Series A
        - Net customer shrinkage; SaaS quality thesis invalidated; expansion story at risk
        - Pause any incremental investment; downgrade recommendation to avoid
      - - Founding team departure
        - CEO or co-founder departure within 24 months of Series B
        - Founder dependency high; product vision and enterprise relationships embedded in founders
        - Flag as near-critical risk event; require retention packages and succession plan confirmation
      - - Down-round at Series B
        - Series B post-money valuation <$1.5B
        - Formal mark-down; confirms prior $1.5B was ahead of revenue; preference stack complexity
        - Write-down position; assess carry-through preference impact on common equity
    notes: >
      Kill triggers are monitoring criteria, not certainties. Each trigger is tied to a measurable threshold or
      verifiable event. Without disclosed ARR, the 'ARR below $50M' trigger cannot be monitored in real time; it becomes
      verifiable only at formal due diligence or Series B announcement. Threshold probabilities for each trigger are not
      independently estimated due to insufficient data.
