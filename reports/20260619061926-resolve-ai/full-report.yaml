      - number: '7.3'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Resolve AI operates in a rapidly evolving regulatory environment for artificial intelligence, with
              multiple jurisdictions creating compliance obligations. The EU AI Act (Regulation 2024/1689), which
              entered into force in August 2024 and is progressively applicable through 2026, establishes a risk-based
              classification framework for AI systems. Autonomous AI agents operating in production
              infrastructure—making decisions that can directly cause service disruptions if incorrect—may be classified
              as high-risk AI systems under Article 6 and Annex III, triggering conformity assessment, technical
              documentation, human-oversight mechanism, and EU AI database registration requirements before market
              placement. This classification risk is unresolved for autonomous SRE agents as of June 2026; no EU AI
              Board opinion specific to this product category has been published. The FTC's June 2023 report on
              generative AI identified concentration risks and accountability gaps in AI-powered automated decision
              systems, signaling increasing enforcement attention to AI liability frameworks that could affect
              autonomous remediation vendors. NIST's AI Risk Management Framework (AI RMF 1.0), while voluntary in the
              US, is increasingly required by enterprise procurement teams as a vendor evaluation baseline, creating
              compliance-documentation overhead. The GDPR's data processing requirements apply to customer telemetry
              from EU-based customers ingested by Resolve AI, creating data-processing-agreement obligations and
              cross-border transfer restrictions. Resolve AI's trust center confirms GDPR compliance but does not
              publicly disclose the cross-border transfer mechanism or whether standard DPAs are available for routine
              enterprise sign-on. No public record of pending litigation, regulatory investigation, or enforcement
              action against Resolve AI was identified as of June 2026, which is consistent with the company's early
              stage and limited public history rather than evidence of clean liability exposure.
