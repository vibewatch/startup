      - number: '8.4'
        title: Scenario Analysis
        blocks:
          - type: paragraph
            body: >
              Valuation scenarios for Resolve AI cannot be precisely anchored without disclosed ARR, but
              probability-weighted framing is possible by combining the DST entry signal, customer depth evidence, and
              the public-market comp range. Three scenarios span the material range of outcomes.


              In the bull case, ARR of $80–$100 million is assumed, consistent with DST Global's historical entry
              criteria and the pace of enterprise adoption suggested by named-customer depth metrics. At 150%-plus
              year-over-year growth and an NRR above 130%, a 15–19x ARR multiple reflects the premium that Datadog-tier
              growth commands in private markets. This implies a fair value of $1.2–$1.9 billion, putting the current
              $1.5 billion within range. Probability assigned: 30%. In the base case, ARR of $40–$70 million is assumed,
              reflecting moderate enterprise ramp with several of the named accounts at early deployment stages. At
              80–120% year-over-year growth and an NRR of 110–120%, a 20–30x ARR multiple implies a valuation of $800
              million to $2.1 billion. The current $1.5 billion sits at the upper end of this range — marginally
              stretched. Probability assigned: 45%. In the bear case, ARR below $30 million is assumed, with growth
              decelerating due to competitive pressure from Datadog Bits AI and extended sales cycles for early-stage
              enterprise AI. A 10–15x ARR multiple under these conditions implies a valuation of $300–$450 million —
              representing a 70–80% impairment from the current mark. Probability assigned: 25%.


              The probability-weighted expected valuation across these three scenarios is approximately (0.30 × $1.6B) +
              (0.45 × $1.2B) + (0.25 × $375M) = $480M + $540M + $94M = approximately $1.11 billion — roughly 26% below
              the current $1.5 billion mark. This gap is not necessarily a buying opportunity; it reflects the
              uncertainty premium baked into the current price. Investors paying $1.5 billion are effectively pricing in
              bull-case execution, which requires financial confirmation that does not currently exist in public
