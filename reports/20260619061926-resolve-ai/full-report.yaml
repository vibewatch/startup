              enterprise production operations, a segment that has historically lacked purpose-built intelligent
              automation. The investment thesis rests on four pillars. First, the founding team is among the strongest
              in the observability category: Spiros Xanthos and Mayank Agarwal co-created OpenTelemetry and ran Splunk's
              observability business, giving them rare insight into both the technical architecture and the enterprise
              sales motion of infrastructure software. Second, the investor syndicate — Greylock at seed, Lightspeed at
              Series A, and DST Global plus Salesforce Ventures at Series A Extension — is category-defining, and DST's
              entry in particular implies meaningful revenue visibility because the fund rarely leads rounds without
              substantial contracted ARR. Third, blue-chip reference customers (Coinbase, DoorDash, Salesforce, Zscaler,
              MSCI) have documented ROI: Coinbase has 100+ engineers on the platform, Zscaler reports 30% fewer
              engineers per incident, and Salesforce's CTIO has publicly endorsed the product. Fourth, the AIOps market
              is large and growing rapidly, valued at approximately $18.95 billion in 2026 and projected to reach $37.79
              billion by 2031 at a 14.8% compound annual growth rate.


              The anti-thesis is equally concrete. No ARR, gross margin, NRR, burn rate, or unit economics have been
              disclosed as of June 2026, making formal valuation underwriting impossible. The $1.5 billion mark implies
              a revenue multiple that ranges from 15x (bull case, $100M ARR) to 50x-plus (bear case, below $30M ARR) — a
              spread too wide for a disciplined price anchor. Competitive risk from Datadog is material: Datadog
              launched more than 100 features at DASH 2026, including major expansion of its Bits AI autonomous
