      - number: '4.3'
        title: Cost Structure and Gross Margin Path
        blocks:
          - type: paragraph
            body: >-
              Resolve AI's cost of revenue includes LLM inference fees, domain-specific model training compute, cloud
              infrastructure hosting, customer success and support staffing, and compliance certification maintenance.
              The company's decision to operate SOC 2 Type II, GDPR, and HIPAA controls adds recurring audit costs above
              those of non-regulated SaaS peers but is a prerequisite for selling into financial services (Coinbase),
              security infrastructure (Zscaler), and enterprise SaaS (Salesforce) accounts where non-compliance would be
              a hard disqualification.

              Comparable mature SaaS platforms benchmark gross margins in the high-70s to mid-80s: PagerDuty reported a
              non-GAAP gross margin of 84.9% in its fiscal year ending January 2026, and Datadog achieved a 22% non-GAAP
              operating margin on $4 billion in annualised revenue run-rate as of Q1 2026. Resolve AI is unlikely to
              reach these margins in its current form. AI-native agentic platforms that process multi-modal telemetry
              (logs, metrics, traces, code) across long context windows incur per-investigation inference costs that
              have no analogue in traditional SaaS; at current OpenAI API list pricing of $5 per million input tokens
              and $30 per million output tokens for GPT-5.5, a single 100,000-token investigation input plus
              20,000-token output costs approximately $1.10 in raw API fees, before orchestration, hosting, and retry
              overhead. Multiplied across thousands of daily investigations for a fleet of enterprise customers,
              inference costs can materially compress gross margins relative to pure-software peers.

              The Resolve AI Labs investment, led by newly hired Chief AI Scientist Dhruv Mahajan from Meta Llama
              post-training, is the company's structural hedge: developing domain-specific production models in-house is
              expected to reduce per-inference costs over time and improve investigation accuracy, but requires
              significant upfront model-training compute capex, delaying gross margin normalisation. Early gross margin
              is estimated at 50–70%, with a path toward 75–80% as in-house models reduce third-party API dependency
              over a 2–4 year horizon. This is a plausible but unverified trajectory; actual gross margin is
              undisclosed.
