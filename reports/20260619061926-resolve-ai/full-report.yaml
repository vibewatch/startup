      - number: '3.3'
        title: Incumbent and Platform Threats
        blocks:
          - type: paragraph
            body: >
              Datadog is the most formidable incumbent threat. The company launched Bits AI SRE as its first generally
              available AI agent at DASH 2026, tested across 2,000+ customer environments before GA. Datadog's 30,500+
              enterprise customers and 2,000+ pre-built integrations create distribution advantages no AI-native startup
