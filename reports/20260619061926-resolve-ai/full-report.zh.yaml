      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的资本形成故事符合强投资人信念和可信企业牵引力，但财务画像几乎完全私有。收入模式适合高 ACV 企业扩张；投资人组合（Lightspeed、DST
              Global、Greylock、Salesforce Ventures）信号很强；客户 ROI 证据既有量化，也可归因到具名 F500 账户。这些都是正向结构特征。财务风险同样是结构性的：早期规模下 LLM
              推理成本会把毛利率压到纯软件 SaaS 同行以下；Resolve AI Labs 的研发投入把 capex 前置；缺少公开收入指标，无法正式评估收入质量或增长率；TechCrunch 关于 Series A
              可能存在多 tranche 结构的担忧，也无法从公开资料独立验证。

              仅凭公开数据，无法承销 Resolve AI 的 Series B 或二级份额。最低披露要求包括：（1）ARR 或收入 run-rate 及季度增长轨迹，（2）毛利率（GAAP 和非 GAAP），（3）ACV
              区间和平均合同期限，（4）NRR 与流失率，（5）客户数量和 top-10 集中度，（6）最近季度全成本月 burn 和现金头寸，（7）Resolve AI Labs
              的资本化方式以及模型训练成本摊销政策。没有这七项指标，任何高于「未知」的估值立场都是推测。$1.5 billion 估值意味着收入倍数取决于 ARR 假设，区间约 15–50x；按当前 AI SaaS
              公开市场可比公司，只有区间低端具备融资可行性。
