    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品使命
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 是一家总部位于 California 州 San Francisco 的人工智能公司，由 Spiros Xanthos 和 Mayank Agarwal 于 2024 年初创立，时间紧接
              2024 年 3 月 Cisco 以 $28 billion 收购 Splunk 之后。公司自称所处品类是「AI for prod」——让 AI
              运行和运营生产环境中的软件，使工程师把精力放在建设，而不是救火。创始假设是：AI 编码助手大幅加速软件开发后，瓶颈已经转向生产运营。许多企业里，工程团队 70–80%
              的时间花在响应告警、调试事故、协调割裂工具上，而不是创造新价值。AI 编码代理继续加快代码生成后，这一运营负担预计会进一步加重。

              Resolve AI 的核心产品是多代理系统，连接公司的现有生产栈——可观测性工具、代码仓库、基础设施管理和通信平台——并为生产环境构建持续更新的知识图谱。告警触发后，AI
              代理立即并行查看日志、指标、链路追踪、基础设施事件和变更历史，在值班工程师打开电脑之前，就产出带证据的根因假设。平台支持三类主要用例：自主值班委派（代理自动分诊和调查告警）、协作式事故解决（在 Slack 或
              MS Teams 频道中与代理协同），以及自动化运营工作流（健康检查、报告生成、按计划或触发器执行多步调查）。

              企业安全控制包括 SOC 2 Type II 认证、GDPR 与 HIPAA 合规、SAML SSO、RBAC、传输与静态加密，并明确承诺不使用客户数据为其他客户训练模型。集成通过 MCP、API 和
              webhook 连接 AWS、Kubernetes、GitHub、Slack、MS Teams 以及主要可观测性平台。Resolve Satellite 为安全要求最高的环境提供安全的本地数据访问网关。
