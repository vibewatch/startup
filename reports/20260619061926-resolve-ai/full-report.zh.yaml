      - number: '6.4'
        title: 留存信号与 NRR 证据缺口
        blocks:
          - type: paragraph
            body: >-
              仅凭公开信息，无法独立评估 Resolve AI 的留存和收入扩张故事。公司未披露 net revenue retention（NRR）、gross revenue
              retention（GRR）、客户流失率、logo retention 统计，或任何与客户随时间扩张有关的财务指标。作为没有监管申报义务的私营公司，这种缺失在结构上符合预期——但投资人评估早期 ARR
              可持续性时，它仍是实质证据缺口。

              几个间接信号显示产品有粘性。Coinbase 100+ 名工程师每周 250+ 次 AI 会话，说明运营集成很深，不太可能在短周期合同评估中被逆转。DoorDash 50+ 名工程师部署自 2025
              年中持续至今，同样说明使用强度已接近续约级，而非试点参与。没有任何案例研究提到客户离开平台或初始部署后回到人工流程。不过，没有流失并不等于确认留存：这些案例由公司筛选，天然存在 survivor
              bias——它们代表公司选择公开的部署，而非结果的代表性横截面。

              DORA 2025 State of AI-Assisted Software Development 报告提供了相关行业信号：深度嵌入日常工程工作流的 AI
              工具——尤其涉及部署后安全和可靠性的工具——粘性显著高于偶发使用或实验用途的工具。Resolve AI 被设计为持久 runtime agent，而非 query-on-demand
              工具；部署后，它在结构上具备高留存条件，但没有 ARR cohort 数据或独立客户调查，无法确认这一判断。

              评测平台证据完全缺席：截至 2026 年 6 月，G2、Gartner Peer Insights、ProductHunt 和 Reddit 的 r/sre 社区都没有可访问的 Resolve AI
              评论，这与产品 2024 年 10 月上线、积累第三方评论时间有限相一致。在这一阶段，该缺口更符合预期，而非令人警惕；但它阻止了任何系统性净推荐值或客户满意度推断。
