        title: 产品定义与使用场景
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 将自身品类定义为「AI for prod」——在生产环境中运行和操作软件的 AI 系统，让工程师把时间用于建设，而不是救火。平台由三个核心智能体产品域组成，且均已 generally
              available：On-Call agents 参与每一轮告警值班，在值班工程师被寻呼前发布根因假设；Incidents agents 围绕代码、基础设施和遥测并行展开调查，在协作式 Slack 或 MS
              Teams 频道中搭建因果时间线；Background agents 执行按计划或触发条件运行的运维工作流，例如部署监控、可靠性报告和资源优化。第四个界面 Custom Agents 通过 MCP、REST
              API 和 agentskills.io Skills 接口开放平台能力，让工程团队和外部 AI agents 无需重建调查 primitives，也能嵌入 Resolve AI 能力。Workbench UI
              提供可视化调查画布，工程师可在实时事故中引导 agents。Resolve AI 还提供 sandbox playground，预先在 AWS EKS 上配置了一个运行中的 19
              个微服务电商应用，让潜在客户在接入生产数据前，用真实遥测和真实错误低摩擦评估。五份已发布案例研究中的客户结果显示，调查时间下降 60% 至 87%；DoorDash 的头条结果是将 40 分钟调查压缩到约 1
              分钟，Blueground 达到 100% 自主告警调查覆盖。所有指标均来自公司自撰案例研究，天然偏正面，且缺少独立控制条件。
