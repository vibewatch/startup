  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Resolve AI 占据了 AI-native
              工具与企业生产运营的交汇点，这是一个过去缺少专用智能自动化产品的赛道，也因此具备可防守的战略位置。投资论点建立在四根支柱上。第一，创始团队是可观测性赛道里最强的一档：Spiros Xanthos 和 Mayank
              Agarwal 共同创建 OpenTelemetry，并负责过 Splunk 的可观测性业务，对基础设施软件的技术架构和企业销售动作都有罕见的一手理解。第二，投资人阵容具备定义品类的信号：Greylock
              领投种子轮，Lightspeed 领投 Series A，DST Global 与 Salesforce Ventures 参与 Series A Extension；尤其是 DST
              入局，通常意味着已有可观收入可见性，因为该基金很少在缺乏大量已签约 ARR 的情况下领投。第三，Coinbase、DoorDash、Salesforce、Zscaler、MSCI 等蓝筹参考客户已经给出 ROI
              证据：Coinbase 有 100+ 名工程师使用该平台，Zscaler 报告每次事故所需工程师减少 30%，Salesforce 的 CTIO 也公开背书产品。第四，AIOps 市场规模大且增长快，2026
              年约 $18.95B，预计到 2031 年达到 $37.79B，复合年增长率 14.8%。


              反论点同样具体。截至 2026 年 6 月，公司未披露 ARR、毛利率、NRR、burn rate 或单位经济，正式估值承销无法开展。$1.5B 估值意味着收入倍数可能从 15x（牛市情景，$100M ARR）到
              50x+（熊市情景，低于 $30M ARR）不等，区间太宽，无法形成有纪律的价格锚。Datadog 带来的竞争风险很实质：Datadog 在 DASH 2026 发布超过 100 项功能，其中大幅扩展 Bits
              AI 自主运营套件，覆盖根因分析、fix-PR 生成和事故调查，直接重叠 Resolve AI 的核心工作流。Dynatrace Davis AI 和 NeuBird 也提供了不同的 AI-native
              路径。PagerDuty 市值从 $9B+ 峰值跌至 $654M，说明事故管理和 AIOps 赛道一旦增长停滞，估值倍数会多快压缩。财务不透明不只是披露不便；它让任何投资人都无法区分真实 traction
              与叙事溢价。
