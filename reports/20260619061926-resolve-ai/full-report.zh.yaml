      - number: '3.2'
        title: AI-native SRE 同行
        blocks:
          - type: paragraph
            body: >
              Traversal 是最直接的已融资同行。公司 2023 年成立，总部位于 New York，2026 年初完成 $53 million Series A，随后获得 Amex Ventures 战略投资。其
              Production World Model™ 和 Causal Search Engine™ 同时评估数千个候选根因，而不是顺序排查——这种并行假设架构在概念上类似 Resolve AI
              的多代理方法。Traversal 披露的企业客户包括 PepsiCo（MTTR 降低 32%）、DigitalOcean（MTTR 降低 70%）和 Cloudways（95%+ 自愈准确率）。公司声称 RCA
              准确率 80–82%，并入选 Redpoint 2026 InfraRed 100。Traversal 明确将自己定位为「第一且唯一在 Fortune 100 内得到验证的 AI SRE」，这直接挑战
              Resolve AI 的企业差异化叙事。Traversal 由 Sequoia 支持。

              NeuBird AI 于 2026 年 4 月完成 $19.3 million 超额认购追加融资，使累计融资达到约 $64 million。投资人包括 Xora
              Innovation（领投）、Mayfield、StepStone Group、Prosperity7 Ventures 和 Microsoft 的风险投资基金 M12。NeuBird 的 Hawkeye
              agent 执行自主根因分析；Falcon agent 引入预测性风险检测，在告警触发前预防事故。该平台据称已解决超过 1 million 个生产告警，MTTR 最高降低 90%，并获得 AWS
              Generative AI Competency 的 Applications 和 Infrastructure 双类别认证。NeuBird 与 Microsoft、AWS
              的合作让其优先触达企业客户网络；Resolve AI 必须在没有同等级 hyperscaler 渠道协议的情况下与之竞争。

              Incident.io 于 2025 年 4 月完成 $62 million Series B（Insight Partners 领投），累计融资超过 $96 million。公司 2021 年由前 Monzo
              工程师创立，服务 Netflix、Linear、Ramp 和 Etsy。Incident.io 的 AI SRE 可自主处理事故响应前 80%——调查告警、浮现根因、从 Slack 生成修复
              PR，并自动生成合规证据。其定价模型（$15–$45/user/month 全包）透明且捆绑，与 PagerDuty 的附加收费和 Resolve AI 未披露的定制价格形成直接对比。Incident.io
              正积极争取因 2027 年 4 月 EOL 而迁出的 Opsgenie 客户。
