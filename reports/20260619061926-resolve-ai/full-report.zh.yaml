  - id: FU004
    title: 各客户供应商报告的成效改善（留存 / 重复队列代理）
    type: bar
    layout: standard
    summary: 条形图展示每个已发布案例客户的主要供应商报告运营改善指标，以调查时间或 MTTR 的百分比下降表示。所有数值均由公司报告，尚未经独立验证。
    data:
      items:
        - label: DoorDash（TTRC 下降）
