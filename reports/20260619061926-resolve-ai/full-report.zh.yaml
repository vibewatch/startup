  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术与 AI 可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的核心价值主张要求 AI agents 自主诊断根因，并在缓解模式下于生产环境执行纠正动作。这带来传统 SRE
              监控工具没有的直接后果型故障模式：幻觉或误分类的根因假设可能触发修复动作，反而扩大宕机而不是解决问题。2023 年一篇关于大语言模型幻觉的 arXiv 综述（arXiv:2309.01219）记录了 LLMs
              在多步骤推理任务中会产出自信但事实错误的输出；截至 2026 年 6 月，在复杂分布式系统诊断中——因果链跨越数十个相互依赖服务——此类错误频率尚未被任何生产 AI SRE 供应商独立测量。Resolve AI
              已发布案例研究报告 MTTI 下降 60–87%，但这些指标通过公司自有网站上的客户 testimonials 自报，缺少独立第三方验证或审计。Benchmark
              不透明意味着，投资人无法有信心地定价根因准确性风险。评估 Resolve AI 的企业客户必须接受：在完成试点前，AI 在其特定 stack architecture
              中的准确性未知；试点本身也会拉长采购周期。OWASP Top 10 for Large Language Model Applications 将「hallucination」「excessive
              agency」「insecure plugin design」和「prompt injection」列为 agentic AI systems 的四类最高风险漏洞，Resolve AI 的自主
              git-commit 和基础设施变更能力正落在「excessive agency」风险类别中。Resolve AI 产品文档记录了通过 human-in-the-loop
              审批门缓解高影响动作，但默认配置以及受监督执行与完全自主执行之间的边界未公开说明，给企业安全团队留下尽调不确定性。
