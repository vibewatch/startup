      - number: '6.2'
        title: 具名客户与已发布案例证据
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的客户证据基础由五份已发布、供应商筛选的案例研究，以及两个没有公开证明的额外具名客户（MongoDB、MSCI）构成；Snowflake 则在 2026 年 6
              月新闻稿中确认是客户，但没有专门案例研究。这五份案例研究给出了对早期企业 AI 供应商而言少见具体的量化运营结果——尽管所有指标均由公司报告，未经过独立审计或第三方验证。

              DoorDash（消费互联网）：2025 年中部署于广告工程团队，该团队管理超过 $1 billion 年广告收入。Resolve AI 将 time-to-resolve-category（TTRC）最多降低
              87%，在 benchmark 事故中把调查时间从 40 分钟降至约 1 分钟。DoorDash 还报告，与评估过的替代方案相比，RCA 准确率高 2x。VP Engineering Alex
              Danilychev 提供了具名高管背书。

              Coinbase（fintech / 加密）：部署于 100+ 名工程师团队，支持 24/7 金融交易所，停机将立即引发财务和声誉风险。调查时间下降 72%，常规事故根因定位时间低于 10 分钟。平台每周记录
              250+ 次 Resolve AI 会话，反映深度运营集成，而非试点级参与。

              Zscaler（网络安全 SaaS）：每月处理 150K+ 告警，约 120 条升级为事故。Resolve AI 将根因识别速度提升 75%，每起事故所需工程师减少
              30%+。这是所有已发布案例研究中记录的最大告警量部署。

              Salesforce（企业 SaaS / CRM）：MTTR 约降低 60%，告警分诊速度提升 70%，其中一个高严重性案例记录了 10 分钟 RCA。Meir Amiel 提供了高管引用。Salesforce
              同时是战略投资人（Salesforce Ventures 共同领投 2026 年 4 月 Series A Extension），这一利益冲突需要独立佐证。

              Blueground（proptech）：已发布 cohort 中唯一的非科技行业具名客户；Blueground 将根因分析时间从 20 分钟降至 5 分钟以内（提升 4x）。其入选显示平台适用性可超出
              hyperscaler fintech，不过其工程规模明显小于其他具名账户。

              Snowflake（数据云，NYSE: SNOW）：在 2026 年 6 月 2 日 Snowflake Summit 新闻稿中确认。Snowflake 工程团队使用 Resolve
              AI「大规模运行和管理生产系统」。另外，Snowflake 与 Resolve AI 签署了一份数百万美元、两年期合同，供 Resolve AI 使用 Snowflake Cortex Training
              训练其生产 AI agents 的强化学习模型，使 Snowflake 同时成为客户和训练基础设施伙伴。
