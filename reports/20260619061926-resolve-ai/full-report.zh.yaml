      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              Resolve AI 自 2024 年底走出 stealth 后不到 18 个月，已通过三次融资拿到超过 $190M。约 $35M 的种子轮由 Greylock Partners 于 2024
              年领投，也是该机构当年开出的最大单笔支票，反映出其在公司成形阶段的异常信心。2026 年 2 月，Lightspeed Venture Partners 领投 $125M Series A，投后估值 $1B；包括
              Greylock、Unusual Ventures、Artisanal Ventures 和 A* 在内的所有既有内部投资人按 pro-rata 参与。所有内部投资人行使 pro-rata，是强佐证信号。2026
              年 4 月 16 日，公司宣布以 $1.5B 投后估值完成 $40M Series A Extension，由 DST Global 领投，Salesforce Ventures 共同领投。


              约 10 周内估值从 $1B 抬升 50% 至 $1.5B，极不寻常。作为参照，TechCrunch tracker 中公开披露的 2026 年
              unicorn，没有哪家公司在没有重大收入披露的情况下，在如此短时间内实现可比的 intra-series 估值上调。这个速度意味着三种可能：合同快速扩张、两次 closing 之间达到重要 contracted
              ARR 里程碑，或投资人看到了 trailing ARR 未反映的 forward bookings 或 pipeline。DST Global 的机构姿态尤其有信息量：该基金历史上投资的是收入高增长、ARR
              已充分验证且资本效率清晰的公司。其以 $1.5B 参与，意味着内部拿到了支撑该价格的指标。另一个信号是，2026 年 6 月 Snowflake Summit 宣布与 Resolve AI
              签署一份为期两年、金额数百万美元的 Cortex Training 合同——这是首个披露合同金额的商业合作，部分证明公司在命名 logo 关系之外确有真实企业收入。新投资人若要以 $1.5B 入场，必须先确认
              ARR、清算优先权结构和 NRR。
