      - number: '2.5'
        title: 采用约束与负面信号
        blocks:
          - type: paragraph
            body: >
              尽管结构性需求强，实际采用仍处早期。LogicMonitor 2025 年调查中，只有 4% 的组织达到完整 AI/AIOps 运营成熟度；22% 完全未在 IT operations 中采用 AI。在已开始
              AI 实施的 62% 中，78%
              仍卡住——原因包括遥测数据碎片化、工具割裂，以及平台无法解释其推理。信任和可解释性缺口是最常被提及的文化障碍：「无法解释自身推理的黑箱系统会侵蚀信任并限制采用」（LogicMonitor）。自主修复还面对额外约束：企业尤其是金融和医疗领域风险厌恶，任何写入生产基础设施的动作之前，都更偏好
              human-in-the-loop 验证。建立信任通常需要「observe → suggest → automate」的多周推进路径，这会拉长销售周期并推迟收入确认。

              大型既有厂商的竞争替代，是尖锐的市场风险。Dynatrace 于 2026 年 1 月发布 Dynatrace Intelligence，这是一个 agentic 系统，基准显示其解决生产问题的次数比单独外部
              AI 代理多 12 倍、速度快三倍。Datadog 于 2026 年 6 月 DASH 发布 100 多项 AI 相关功能，明确推进自主 AI ops 战略。二者都把 AI SRE
              能力捆绑进大型企业已经有合同关系、遥测管道和按席位授权的平台。这种既有厂商扩张会压缩独立 AI SRE TAM，并提高差异化工作流集成的重要性。其他约束包括：大规模 LLM
              推理成本（复杂调查每起事故可能消耗数百次 LLM 调用）、数据质量要求（遥测标签差会限制模型准确性），以及开源替代方案（K8sGPT、HolmesGPT、Aurora），它们在成本敏感或 air-gapped
              部署中以价格竞争。DORA 2025 AI 研究还指出，AI 工具更多是放大既有实践，而不是修复糟糕实践——这意味着 AI SRE 平台在 DevOps 基础成熟的组织中更有效，也收窄了短期可触达装机基础。
