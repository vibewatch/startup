  - id: TV004
    title: 牛市 / 基准 / 熊市情景分析
    columns:
      - 情景
      - ARR 假设
      - 假设 YoY 增长
      - ARR 倍数
      - 隐含估值
      - 关键假设
      - 下行情景触发项
      - 概率信号
    rows:
      - - 牛市
        - $80M–$100M ARR
        - 150%+
        - 15–19x
        - $1.2B–$1.9B
        - DST 收入验证；NRR >130%；毛利率 75%+；AI Labs 推动差异化
        - Datadog Bits AI 在 Series B 前实现对企业 AI SRE 的替代
        - 30%
      - - 基准
        - $40M–$70M ARR
        - 80–120%
        - 20–30x
        - $800M–$2.1B
        - 企业客户爬坡适中；NRR 110–120%；利润率改善路径可见但未确认
        - 客户集中在 2–3 个账户；Datadog 先拿下中端市场；Series B 延迟
        - 45%
      - - 熊市
        - <$30M ARR
        - <60%
        - 10–15x
        - $300M–$450M
        - 企业转化缓慢；Datadog/Dynatrace AI 替代；NRR 低于 100%
        - Series B 时 ACV 不达标；具名客户流失；down round 或 flat round
        - 25%
    notes: >
      所有 ARR 和增长假设均为推断；Resolve AI 未披露任何收入指标。概率信号是作者基于投资者质量、客户证据和竞争动态作出的估计。三个情景的概率加权预期估值约为 $1.11 billion，比当前 $1.5B 标记约低
      26%。ARR 倍数区间以公开可比数据为基准（Datadog 21.6x、Dynatrace 6x、Gong 2021 年峰值约 36x），并按私募市场溢价和阶段调整。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV034
      - CV035
  - id: TV005
    title: 破坏假设与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - Series B 时 ARR 低于牛市情景
        - 下一次主要融资时 ARR <$50M
        - 当前 $1.5B 意味着 >30x ARR；Series B 定价无法支撑；存在 down round 风险
        - 退出或重组持仓；不以更高估值跟投
      - - 具名客户流失
        - 失去 Coinbase、DoorDash、Salesforce、Zscaler 或 MSCI
        - 参考账户叙事坍塌；引发平台适配和 NRR 担忧
        - 立即尽调合同条款和留存数据；建议回避
      - - Datadog Bits AI 替代企业部署
        - 在 Resolve AI 目标 ICP 竞争交易中，Datadog 有记录占比 >10%
        - 差异化被侵蚀；定价承压；单点产品相对集成产品的优势下降
        - 重评护城河；评估专有模型在规模化后是否仍可防守
      - - NRR 在 12 个月 cohort 低于 100%
        - Series A 后任一 12 个月 cohort 的 Net Revenue Retention <100%
        - 净客户收缩；SaaS 质量假设失效；扩张故事面临风险
        - 暂停任何增量投资；将建议下调为回避
      - - 创始团队离任
        - CEO 或联合创始人在 Series B 后 24 个月内离任
        - 创始人依赖高；产品愿景和企业关系嵌在创始人身上
        - 标记为近乎严重风险事件；要求确认留任方案和继任计划
      - - Series B 降价轮
        - Series B 投后估值 <$1.5B
        - 正式下调估值；确认此前 $1.5B 领先于收入；优先权堆栈复杂化
        - 减记持仓；评估优先权延续对普通股的影响
    notes: >
      否决触发项是监测标准，不是确定会发生的事件。每个触发项都绑定可衡量阈值或可验证事件。没有披露 ARR 时，“ARR 低于 $50M”无法实时监测；只能在正式尽调或 Series B
      公告时验证。由于数据不足，各触发项的阈值概率未单独估算。
    claimRefs:
      - CV032
      - CV034
      - CV035
      - CV036
      - CV042
  - id: TV006
    title: 最终尽调事项
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入 run rate
        - 从产品上线至今的季度 ARR 变化；当前季度 run rate
        - 没有这些数据，无法评估估值倍数、增长率或 Series B 目标
        - CFO；索取从成立以来的季度收入 waterfall 和 ARR bridge
      - - Net Revenue Retention
        - 按 cohort 和客户细分披露的过去 12 个月 NRR
        - 决定 ARR 增长来自自然扩张，还是依赖昂贵的新销售
        - CFO/CRO；索取 cohort 级留存数据，并单独披露 gross-revenue retention
      - - 毛利率
        - 按季度披露 GAAP 和 non-GAAP 毛利率，并拆分 AI 推理成本
        - 评估 SaaS 利润率质量；判断推理/训练成本能否规模化
        - CFO；索取按季度 P&L；拆出 AI 推理、模型训练和托管 COGS
      - - 客户数量与集中度
        - 活跃客户总数；前 10 大客户占 ARR 比例
        - 评估集中度风险；具名 logo 可能代表 80%+ ARR
        - CRO；索取带 ARR 区间的客户清单；按行业和合同规模分组
      - - Burn rate 与 runway
        - 月度净 burn rate；Series A Extension 交割后的现金余额
        - 决定下一轮融资时间；runway 表明 12 个月内是否需要 Series B
        - CFO；索取预算模型和银行余额确认；确认 $190M 的部署计划
      - - 股权结构与优先权压力
        - 完整 capitalization table；清算优先权堆栈和优先级
        - 回报分析必须理解优先权顺位和反稀释条款
        - CFO/法律；向律师索取 cap table；审查融资文件中的反稀释条款
      - - 与竞争对手的 win-loss
        - 与 Datadog Bits AI、Dynatrace、NeuBird AI 正面交易周期中的 win-loss 数据
        - 验证竞争差异化，以及产品是否已证明能替代竞品
        - CRO；索取交易级竞争数据；访谈最近 3 个赢单和 2 个输单
    notes: >
      这是在 $1.5B 或更高估值部署任何资本前必须获得的最低七项披露。它们都是标准投前尽调要求，对这一融资阶段的公司并不异常。私营公司不公开这些指标并不罕见；公开记录中没有投资者确认财务
      KPI，正是推动“继续研究”建议的证据缺口。
    claimRefs:
      - CV006
      - CV042
      - CV043
      - CV044
