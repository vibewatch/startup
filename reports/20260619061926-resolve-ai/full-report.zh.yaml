      - number: '1.4'
        title: 客户牵引与运营证据
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年初，Resolve AI 公开列出超过 20
              家企业客户，集中在生产可靠性直接影响收入的行业：金融服务（Coinbase、MSCI）、消费互联网（DoorDash、Blueground）、企业软件（Salesforce、MongoDB）和网络安全（Zscaler）。种子轮时披露了
              DataStax 和 Uni 的早期部署；客户基础在 2025 年显著扩大。

              已发布客户案例给出了量化成效数据。对早期初创公司而言，这些数据异常具体——但所有指标均由公司筛选发布，尚未经过独立审计。DoorDash 广告工程团队将事故调查时间从 40 分钟降至约 1 分钟，改善
              87%，其平台管理超过 $1 billion 年广告收入。Coinbase 报告事故调查快了 72%，根因定位少于 10 分钟，并且每周有 250+ 次 Resolve AI
              会话——反映出深入的日常运营集成。Zscaler 根因识别加快 75%，每起事故所需工程师减少 30%。成为战略投资人的 Salesforce 报告 MTTR 约降低 60%，告警分诊快 70%，调查时间减少
              30%。Salesforce President and Chief Trust and Infrastructure Officer Meir Amiel
              公开证明，过去需要数小时的事项，如今只需一小部分时间即可解决。

              收入集中风险（少数具名企业账户）和缺乏独立审计的性能数据，是重大尽调缺口。定价未公开披露。
