      - number: '3.3'
        title: 既有厂商与平台威胁
        blocks:
          - type: paragraph
            body: >
              Datadog 是最强的既有厂商威胁。公司在 DASH 2026 将 Bits AI SRE 作为首个 GA 的 AI agent 推出，GA 前已在 2,000+ 个客户环境测试。Datadog 的
              30,500+ 企业客户和 2,000+ 预构建集成，带来任何 AI-native 初创公司都难以复制的分发优势。当一家企业已经把所有遥测发送到 Datadog，评估独立 AI SRE
              的内部切换成本并不低：要么把 Datadog 数据连接复制到新平台，要么接受 Bits AI 作为性价比更高的增量升级。Bits AI SRE 包含 RBAC、HIPAA-ready 合规和企业 AI 治理，与
              Resolve AI 的安全姿态相当。主要限制是平台耦合：Bits AI 的调查深度取决于 Datadog 已经观测到的内容；多云或多供应商遥测架构会削弱其效果。

              Dynatrace 在 Perform 2026 大会上推出 Dynatrace Intelligence，把确定性 AI（借助 Smartscape 依赖图和 Grail data lakehouse）与
              agentic AI 融合。Dynatrace 基准显示，确定性 AI 与 agentic AI 结合后，相比纯 agentic 方法，解决问题数量多 12x、解决速度快 3x、成本减半。Cloud SRE
              Agents 产品编排 AWS、Azure 和 GCP 原生代理——并行把事故路由给 hyperscaler 代理，再把发现汇回统一 Dynatrace 视图。全栈标价为
              $0.01/memory-GiB-hour；企业合同通常为每年 $182,000–$250,000。Dynatrace 面向复杂多云企业环境，其实时拓扑图提供了纯 LLM 方法缺乏的因果深度。

              PagerDuty 已服务超过 28,000 个组织，是事实上的值班路由平台。其 Spring 2026 发布将 SRE Agent 直接嵌入升级策略。不过，AI 功能按每月 $699–$1,114
              的固定附加费收费，叠加基础授权（$21–$41/user/month）；一份竞争者定价分析认为，这会制造隐藏成本，可能使 TCO 翻倍。BigPanda 在大型企业 IT Ops 环境中用 ML
              事件关联将告警噪声降低 90–99%，但明确停留在关联和 enrich，不执行自主根因调查。BigPanda 定制价格从小型部署约 $500/month 到企业规模 $40,000+/month 不等。
