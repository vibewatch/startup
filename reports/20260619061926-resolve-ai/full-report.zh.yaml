      - number: '6.3'
        title: 部署路径与客户扩张模式
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的客户案例研究呈现出一致部署弧线：客户先从只读调查工作流开始，信任建立后逐步扩大 AI agent 自主性。典型路径从观察模式下的告警分诊和根因调查开始——agents
              只呈现发现、不采取行动——随后进入 co-pilot 阶段，由 agents 提议行动并交由人类批准。信心提升后，客户会为预定义事故类别授予受监督自主访问，最终在充分理解的故障模式上进入完全自主运行。

              Coinbase 部署是扩张模式最清晰的代理：从初始试点开始，部署增长到 100+ 名工程师活跃使用平台、每周 250+ 次 AI 会话——该指标意味着日常运营依赖，而非实验性使用。DoorDash
              的部署同样扩展到 50+ 名工程师团队，并覆盖 on-call、调查和运维工作流等多个用例。这种从试点到全面部署的扩张模式说明，一旦工程师融入 agent-assisted workflow，产品粘性很强。

              Resolve AI 产品支持多个工作流入口：用于告警分诊的 on-call delegation 模块、用于协作式根因分析的 incident investigation 模块，以及用于计划或触发工作流的
              operational tasks 模块。这种模块化结构支持在单个企业内 land-and-expand：先部署到一个 SRE
              团队的事故工作流，再扩展到更多团队、更多告警来源，并随着风险容忍度提高，最终扩展到自主修复。

              2026 年 4 月推出 Resolve AI Labs，以及 Snowflake Cortex Training
              合作，显示公司正战略性投入基于强化学习、由生产事故数据训练的模型；这会让每个客户的模型随时间逐步提高准确性，从而增强平台粘性，形成潜在复利式留存优势。不过，公司未披露 cohort 数据、ARR
              扩张指标或有记录的 land-and-expand 收入轨迹。扩张故事来自用量代理指标（会话数、平台上的工程师人数），而非财务留存数据。
