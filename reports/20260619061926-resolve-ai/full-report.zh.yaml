      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 幻觉式修复是核心失败模式
            body: >-
              AI SRE agent
              一旦误判根因并在生产环境执行自动修复，问题就不只是「没有帮上忙」——它会主动造成伤害。不同于误报或漏掉异常，糟糕的自动动作可能级联放大，造成比原始事件更严重的客户可见故障。除非所有关键动作都保留
              human-in-the-loop 审批，否则这种失败模式在结构上无法消除；但这又会抽空支撑估值的自主效率主张。没有第三方 benchmark 验证 Resolve AI
              的根因准确率，单是这种不透明，就足以让投资人在 $1.5B 估值上保持审慎。
