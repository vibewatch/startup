  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >
              自主 AI SRE 品类来自三个既有市场的汇合：AIOps（ML 驱动的告警降噪）、可观测性（遥测采集和仪表盘）以及事故管理（值班、升级、复盘）。Resolve AI
              处在最高自主性层级：一个多代理系统，跨代码仓库、基础设施和可观测性工具运行，对多数告警无需人工介入即可调查并解决事故。相邻层级的活跃厂商正从不同进入角度、以不同速度向这一点靠拢。

              直接 AI-native 同行——Traversal、NeuBird AI 和 incident.io——是与 Resolve AI 最相似的竞争者：都在 2025–2026
              年获得可观风险投资，都聚焦自主调查而非单纯关联，都面向拥有复杂分布式系统、由工程团队主导的企业。既有可观测性平台（Datadog、Dynatrace）把自主代理作为平台扩展，利用已有客户关系和遥测摄取，但受其平台中心架构约束。旧式事故管理平台（PagerDuty）和
              AIOps 厂商（BigPanda）增加了 AI 层，但尚未达到真正的根因调查。现状——手工 war room、定制 runbook
              和自建告警路由——仍是最大隐性预算竞争者，尤其在工程成熟度不足、难以评估专用自主 SRE 工具的组织中。

              一个重要品类界定是：真正的 AI SRE agent 必须能自主分诊告警、跨多个遥测源抓取上下文、形成假设、给出因果根因叙事，并草拟或执行修复。只做告警关联（BigPanda）或仪表盘摘要（旧式
              AIOps）的工具达不到这个门槛。
