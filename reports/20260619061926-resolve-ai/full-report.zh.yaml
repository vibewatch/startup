      - CR040
    notes: LLM 提供商身份依据公开产品文档和定价语境推断；Resolve AI 尚未确认其 LLM 供应链。投资者名单来自 Seed 轮、A 轮和 A 轮延伸融资新闻稿。
  - id: TR004
    title: 人员与执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 中断概率
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - CEO（Spiros Xanthos）
        - 核心对外代表、企业客户关系、融资负责人、OpenTelemetry 技术可信度锚点
        - 低——截至 2026 年 6 月未见负面信号；但关键人物风险一旦触发就是二元事件
        - 严重——CEO 离任会引发投资者担忧，拖慢企业交易，并削弱技术可信度叙事
        - 无公开继任计划；董事会和投资者监督提供治理缓冲，但不能替代运营负责人
        - 索取关键人物保险政策、归属 cliff 与加速条款，以及董事会继任应急方案
      - - CTO（Mayank Agarwal）
        - 核心技术架构、AI 智能体系统设计、OpenTelemetry 集成专长、工程团队方向
        - 低——未见负面信号；对工程可信度假设的约束力与 CEO 同等重要
        - 严重——CTO 离任会实质拖慢产品速度，并削弱企业潜在客户对 AI 架构的信任
        - 两位创始人共同持股、共同创建历史带来强绑定；公开信息中看不到具名 VP Engineering 或 VP AI Research
        - 审查创始人之下的工程组织深度；识别具名 VP Engineering 和 VP AI Research；评估核心智能体架构的 bus factor
      - - 企业销售负责人（CRO / VP Sales）
        - 公开信息中未识别具名 CRO 或 VP Sales；招聘页显示正在招企业销售
        - 中——这一阶段没有具名资深销售负责人并不少见，但会限制收入可预测性和管线管理严谨度
        - 高——如果没有具备企业 SRE 销售经验的资深负责人，背 quota 的产能和采购周期管理都会不足
        - Salesforce Ventures 网络以及 Salesforce 作为参考客户提供部分分销能力；招聘页显示招聘正在推进
        - 确认是否已聘任具名 CRO 或 VP Sales；审查背 quota 人数、管线覆盖率和平均客单价
      - - Resolve AI Labs 研发投入
        - 2026 年 4 月推出 Labs，增加研发资本开支，与 GTM 支出争夺资本配置
        - 中——Labs 对差异化总体有利，但如果商业回报周期很长，会造成 burn 波动
        - 中——若短期收入无法抵消，Labs burn 可能加速消耗 runway；也会与 GTM 形成资本配置张力
        - Labs 被定位为企业研发合作，潜在的数据访问和共同开发价值可部分抵消成本
        - 索取 Labs 预算占总运营 burn 的比例；评估商业回报和收入时间线；确认 Labs burn 是否已计入披露的融资用途
