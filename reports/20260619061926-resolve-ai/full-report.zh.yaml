      - number: '5.4'
        title: 企业安全与合规控制
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 持有 SOC 2 Type II 认证，并声称符合 HIPAA 和 GDPR，相关材料通过 Drata 驱动的 trust center 记录。数据加密方面，静态数据采用
              AES-256，客户环境、Satellite 与 Resolve AI 云之间的所有传输流量采用 TLS 1.2+。平台提供 SAML 和 OIDC SSO（Google、Okta、Azure
              AD）以及自动用户配置；RBAC 覆盖 Member 和 Admin 角色，并支持团队级与个人级权限覆盖。平台默认强制对可观测性数据只读访问；写权限集成（缓解执行、PR 创建）必须明确 opt-in，并要求单独
              credential scopes。客户数据离开 Satellite 边界前，必须先应用客户可配置的 regex
              脱敏模式。客户数据不会用于训练其他客户的模型；组织专属微调仅供数据所属组织使用。客户群中最严苛的监管环境已经验证过该安全架构：Coinbase（加密货币、金融监管暴露）、Zscaler（零信任网络安全、SOC-class
              要求）和 Salesforce（企业 SaaS、全球数据驻留义务）。缺口包括：公开不可获取 SOC 2 审计报告、复认证时间表未披露、未发布 SCIM provisioning 支持或 FedRAMP
              状态文件，这限制了美国联邦和国防垂直领域的采用。
