      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              AI SRE 平台的经济买方通常是 VP of Engineering、VP of Infrastructure 或 Head of
              SRE，所在组织具备显著生产复杂度——操作上表现为多云部署、大规模微服务，以及承受告警疲劳的值班工程团队。终端用户是每天与监控仪表盘和 paging 系统交互的值班 SRE 或 DevOps
              工程师。预算付款方通常是 IT Operations 或 Platform Engineering 成本中心，而不是应用开发预算。LogicMonitor 2026 年对 100 名拥有可观测性预算权限的 VP+
              IT 决策者调查发现，75% 对平台选择拥有最终决策权。关键在于，96% 预计可观测性支出持平或增长，其中 62% 预期预算增加——这使 AI SRE 处在受保护的基础设施支出内，而不是可自由裁剪或实验性的 AI
              预算。

              主要买方细分包括：（1）拥有 >1,000 名工程师、复杂多云环境和正式 SRE 实践的大型企业；（2）发布节奏快、值班 burnout 严重的高增长 SaaS 公司；（3）有严格 uptime SLA
              和合规要求的金融服务公司；（4）有患者安全要求的医疗和受监管行业。所有细分中的采用触发因素都很急迫——通常是重大事故、工程师 burnout 投诉反复出现，或高知名度宕机后 CTO 下达可靠性要求。2024 年
              CrowdStrike 事故估计给 Fortune 500 公司造成 $5B+ 损失，显著提高了所有企业垂直行业高管对可靠性工具的认知。工具整合也是重要需求驱动：84% 的组织正在推进或考虑平台整合，74%
              表示愿意接受满足要求的单一统一平台——这种购买倾向更利好集成式 AI SRE 平台，而不是点状工具。
