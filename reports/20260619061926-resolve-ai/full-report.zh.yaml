      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 关键承销前提 — 收入未披露
            body: >
              Resolve AI 未披露 ARR、毛利率、NRR、burn rate 或单位经济。没有财务验证，任何高于「未知」的估值判断都是推测。若 ARR 超过 $75M 且增长与 NRR 强劲，$1.5B
              估值可以防守——但公开证据无法确认这一点。DST Global 入场是收入健康度最强的间接信号，但不能替代已披露指标。投资委员会应把本章估值区间视为示意，而非约束性结论，等待正式尽调。
            calloutType: risk
            claimRefs:
              - CV006
              - CV042
              - CV008
          - type: callout
            title: DST Global 入场作为收入可见性的代理信号
            body: >
              DST Global 决定以 $1.5B 估值领投 2026 年 4 月 Series A Extension，是目前判断 Resolve AI 财务健康度最有信息量的单一数据点。DST 通常投资 ARR
              已充分验证且规模可观的公司——其投资 Gong 时，Gong 的 ARR 已超过 $100M。2026 年 4 月 DST 入场，暗示其内部已验证的财务门槛很可能在 $50M 到 $100M ARR
              之间；但这仍是推断，不能替代直接财务披露。
            calloutType: insight
            claimRefs:
              - CV008
              - CV016
              - CV033
              - CV040
          - type: callout
            title: PagerDuty 先例 — 倍数压缩风险
            body: >
              PagerDuty 在 2021 年市值峰值超过 $9B，到 2026 年 6 月压缩至 $654M——跌幅 87%——原因是收入增长从 30%+ 降至 5.4%，ARR
              增长停滞。这个先例说明，一旦增长预期落空，可观测性和事故管理倍数会多快坍塌。Resolve AI 的 $1.5B 估值并不免疫于这种风险，尤其是在 Datadog Bits AI 获得企业
              traction、降低客户采用专用 AI SRE 平台紧迫性的情况下。
            calloutType: risk
            claimRefs:
              - CV015
              - CV017
              - CV035
              - CV029
          - type: callout
            title: 假设 — DST 入场意味着 $50M–$100M ARR 底线
            body: >
              本估值分析假设，DST Global 以 $1.5B 参与投资，意味着私下 ARR 为 $50M–$100M。这是推断，不是已确认事实。若 DST
              入场是出于战略卡位（例如获取企业生产数据，或在竞争对手收购前预先占位），而非收入驱动的信念，ARR 假设可能显著更低，并会把估值判断从「偏高」推向「昂贵」。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV033
              - CV040
              - CV041
