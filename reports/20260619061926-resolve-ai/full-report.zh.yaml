          detail: 解决类别时间：基准事故 40 分钟 → 约 5 分钟
        - label: Zscaler（RCA 速度）
          value: 75
          detail: 根因识别；每起事故所需工程师也减少 30%+
        - label: Blueground（RCA 时间，估计）
          value: 75
          detail: 20 分钟 → <5 分钟（快 4×；估计约下降 75%）
        - label: Coinbase（调查时间）
          value: 72
          detail: 根因定位低于 10 分钟；每周 250+ 次 AI 会话
        - label: Salesforce（MTTR）
          value: 60
          detail: 近似值；告警分诊也快 70%；适用投资者冲突提示
    approximationNotes: >-
      Blueground 数字（75%）是分析师基于 20 分钟 → <5 分钟披露作出的估计（4× 改善 ≈ 下降
      75%）。其他数字均按公司案例报告。Fundesk.io（SU014）的提示适用：买方自身结果预计会不同于这些供应商基准数字。Snowflake 未发布量化指标，因此未纳入本图。
