      - number: '4.3'
        title: 成本结构与毛利路径
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的收入成本包括 LLM 推理费用、领域专用模型训练算力、云基础设施托管、客户成功与支持人员，以及合规认证维护。公司选择运行 SOC 2 Type II、GDPR 和 HIPAA
              控制，带来高于非监管 SaaS 同行的经常性审计成本，但这是卖进金融服务（Coinbase）、安全基础设施（Zscaler）和企业 SaaS（Salesforce）账户的入场券；不合规会直接出局。

              成熟 SaaS 平台的可比毛利率通常在 70% 后段到 80% 中段：PagerDuty 在截至 2026 年 1 月的财年报告非 GAAP 毛利率为 84.9%；Datadog 截至 2026 年 Q1
              年化收入 run-rate 达 $4 billion，非 GAAP 经营利润率为 22%。Resolve AI 以当前形态不太可能达到这些水平。AI
              原生智能体平台需要在长上下文窗口里处理多模态遥测（日志、指标、追踪、代码），每次调查都会产生传统 SaaS 没有的推理成本；按当前 OpenAI API GPT-5.5 标价，每百万输入 token
              $5、每百万输出 token $30，一次 100,000-token 输入加 20,000-token 输出的调查，仅原始 API 费用就约
              $1.10，尚未计入编排、托管和重试开销。企业客户集群每天跑数千次调查后，推理成本会相对于纯软件同行实质压缩毛利率。

              Resolve AI Labs 是公司的结构性对冲：新任 Chief AI Scientist Dhruv Mahajan 来自 Meta Llama
              后训练团队，他主导的投入旨在自研领域专用生产模型，长期降低单次推理成本并提高调查准确率；代价是前期模型训练算力 capex 很重，毛利率正常化会被推迟。早期毛利率估计为 50–70%；随着内部模型在 2–4
              年内降低对第三方 API 的依赖，毛利率有望走向 75–80%。这一路径合理但未经验证；实际毛利率未披露。
