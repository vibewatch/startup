      - number: '8.6'
        title: 退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >
              退出准备度仍偏早。若 ARR 在 2027–2028 年扩至 $200M–$300M、同比增长 70%+、毛利率 70%+，以 Datadog 作为 AI infrastructure SaaS 高倍数
              benchmark，IPO 路径可行。按 $250M ARR 和 15–20x forward revenue 倍数计算，可支撑 $3.75B–$5B 估值，相较当前 $1.5B
              标记带来有意义回报——但前提是毛利率可验证地高于 70%，且公司已降低对少数命名账户的依赖。2025–2027 年窗口中，M&A
              退出也许更可能，因为战略匹配清晰：Datadog、Salesforce、ServiceNow 和 Cisco 都在扩展 AIOps 能力，都会从 Resolve AI 的生产专用训练数据、客户关系和专有模型 IP
              中获益。AI 基础设施历史 M&A 倍数显示，战略收购区间约为 8–12x trailing ARR，叠加协同溢价；若 ARR 为 $75M，潜在收购价值约 $600M 到
              $1.2B，低于当前轮价格，也凸显增长轨迹验证的重要性。


              Thesis-break 触发点用可衡量阈值定义。最关键的一项，是在任何 Series B 融资时 ARR 低于 $50M，这将意味着当前 $1.5B 估值过早，并迫使重估。其他 thesis-break
              事件包括：五个命名 anchor 客户（Coinbase、DoorDash、Salesforce、Zscaler 或 MSCI）中任何一个流失；Datadog Bits AI 被 Resolve AI 目标
              ICP 中超过 10% 采用并形成记录；12 个月后 NRR 低于 100%；创始团队离开；或 Series B down-round。最终尽调问题已列入尽调表，是在 $1.5B
              或以上价格投入资本前所需的最低披露。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV044
