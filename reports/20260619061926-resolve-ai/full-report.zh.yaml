      - number: '8.3'
        title: 公开可比公司与市场倍数
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，AI 可观测性与事故运营软件的公开市场可比基准大致覆盖 1.3x 到 21.6x trailing revenue，具体取决于增长率、毛利率质量和竞争位置。Datadog 是高倍数
              benchmark：2026 年 Q1 收入 $1.006B，同比增长 32%，non-GAAP 毛利率约 80%，市值约 $79.4B——相当于对 $3.67B trailing twelve months
              revenue 给出 21.6x。Datadog 享有溢价倍数，因为增长重新加速，产品深度嵌入企业云基础设施，且 2026 年 Q1 单季自由现金流就达到 $289M。Dynatrace
              是更保守的参照：FY2026 收入 $2.018B，增长 18.8%，市值约 $12.07B——约 6x revenue。Dynatrace 的倍数反映了更低增长和其核心 AIOps
              领域更激烈的竞争。PagerDuty 是负面警示样本：FY2026 收入 $492.6M，仅增长 5.4%，ARR 同比持平在 $496M，市值已从约 $9B 峰值压缩至
              $654M——五年内因增长减速导致估值受损 93%。


              私募市场里，Gong 在 FY2025 达到 $300M ARR，而其 2021 年 6 月 Series E 估值为 $7.25B，这说明 AI SaaS 私募倍数已从峰值约 36x ARR
              压缩到今天明显更低的隐含价值。MarketsandMarkets 预计 AIOps 平台市场到 2028 年达到 $32.4B，CAGR 22.7%；IDC 预计软件公司在 AI 和 Generative AI
              上的支出到 2028 年达到 $222B，CAGR 约 27%。对照这些可比项，只有当 ARR 超过约 $75M 且增长率处于溢价水平时，Resolve AI 的 $1.5B 估值才说得通。若 ARR 为
              $50M，隐含 30x 倍数已处于私募市场当前可接受高增长 AI infrastructure SaaS 的上限。若 ARR 低于 $30M，则 50x+ 倍数无法在任何符合公开市场证据的情景概率下承销。
