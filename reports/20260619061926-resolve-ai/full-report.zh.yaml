  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 通过企业平台订阅创收，并完全依靠直销动作销售。公司不发布标价；其定价页面只有一个企业联系表单，邀请潜在客户与 Resolve AI 代表讨论方案和集成。这种完全门控的定价姿态符合高 ACV
              企业软件特征：交易结构会按每个客户的事故量、席位数和集成复杂度定制。公司未公开宣传试用、freemium 或 self-serve 层级；这使 Resolve AI 与相邻工具明显区分开，例如
              incident.io 起价为每用户每月 $19，PagerDuty professional 层级起价约为每用户每月 $21。

              收入预计主要由年度或多年期平台订阅费构成，覆盖核心多代理 SRE 平台，另可能包括 onboarding 和定制集成工作的 professional-services 组件。已部署客户的使用深度证明了
              land-and-expand 模式：Coinbase 报告 100 多名工程师使用 Resolve AI，每周会话 250+ 次；DoorDash Ads 在活跃事故期间有 50+
              名工程师使用该平台。两个指标都不是合同席位数，但都显示初始 beachhead 建立后的席位扩张经济性。Resolve AI Labs
              与企业客户的研究合作也可能内嵌数据访问或共同开发价值，在不单列收入线的情况下抵消原始订阅定价。
