      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 由 Spiros Xanthos（CEO）和 Mayank Agarwal（CTO）创立。二人在 University of Illinois Urbana-Champaign
              读研时相识，此后合作超过二十年，并自 2012 年起持续共事。他们共同创建了 OpenTelemetry；该项目如今是企业云行业广泛采用的遥测数据管理开源主导标准。创办 Resolve AI 之前，他们创立
              Omnition，2019 年被 Splunk 收购；随后二人分别担任 Splunk 可观测性业务 General Manager 和 Chief Architect，直到 Cisco 于 2024 年收购
              Splunk 后离职创立 Resolve AI。

              这组创始履历体现出极强的 founder-market fit。二人打造了 Resolve AI 代理现在用来推理的遥测数据工具 OpenTelemetry，在 Splunk
              运营过大规模可观测性基础设施，并有两次成功退出，证明其打造并扩张企业级公司的能力。Xanthos 将使命概括为解决软件工程的「下半场」：不是更快写代码，而是以同样速度可靠运行写出来的代码。

              2026 年 4 月，Dhruv Mahajan 加入并担任 Chief AI Scientist，领导新成立的 Resolve AI Labs。Mahajan 此前在 Meta
              Superintelligence Labs 负责大规模 Llama 基础模型的后训练工作，为创始人的生产工程领域经验补上前沿 AI 研究能力。截至 2026 年 2 月 Series A 公告，公司约有 120
              名员工，其中包括 14 名来自 Google DeepMind 的研究员，以及来自 Meta Superintelligence Labs 和 Google Deep Research
              团队的贡献者。投资人顾问包括董事会层面的 Greylock 的 Saam Motamedi 和 Lightspeed 的 Sebastian Duesterhoeft。CEO
              权力集中于单一联合创始人，是需要持续关注治理的关键人物风险。
