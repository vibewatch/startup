  - id: FR001
    title: 风险严重度热力图——可能性 vs. 投资影响
    type: matrix
    layout: wide
    summary: 七项 Resolve AI 实质风险按评估可能性和投资影响定位；尽管幻觉式修复和 agent 爆炸半径的评估可能性为中等，但两者综合严重度最高；超大云厂商捆绑和采购拖延也同时具备高严重度和高可能性。
    data:
      columns:
        - 很可能（>50%）
        - 可能（20–50%）
        - 有可能（5–20%）
        - 不太可能（<5%）
      rows:
        - label: 严重
          values:
            - ''
            - 幻觉式修复导致宕机
            - Agent 爆炸半径失控
            - ''
        - label: 高
          values:
            - 企业采购拖延
            - 超大云厂商捆绑替代
            - 降估值融资 / 融资悬崖
            - 创始人离职
        - label: 中
          values:
            - 基准不透明
            - EU AI Act 合规成本
            - LLM 供应商锁定 / 价格冲击
            - IP 诉讼
        - label: 低
          values:
            - LLM API 短暂宕机
            - ''
            - 美国各州 AI 法拼图式合规
            - ''
    approximationNotes: 可能性和影响评级是基于行业基准、监管指引、竞争证据和类似 AI SRE 供应商动态作出的定性评估；并非统计推导。
