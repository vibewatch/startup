      - number: '7.5'
        title: 财务、融资与执行风险
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 在不到 18 个月内通过三轮融资约 $190M，最近一轮是 2026 年 4 月以 $1.5B 估值完成。公司未公开 ARR、毛利率、ACV、NRR 或 burn
              rate，无法验证支撑该估值的隐含收入倍数。若按示意性的 20× ARR 倍数计算——对这一阶段高增长 AI 基础设施公司而言激进但并非没有先例——该估值意味着约 $75M ARR。考虑到公司仅成立 18
              个月、企业客户只有 20+ 家且未披露定价，这一数字更像愿景而非当前水平。相较传统软件同业，AI 推理成本会压缩 AI-native SaaS 平台毛利率；Resolve AI 的经济模型还要承担 2026 年
              4 月宣布的 Resolve AI Labs 研究投入，增加研发 capex，而商业回报时间表不确定。DoorDash 案例显示、生产访问型 AI agent 所需全面安全审查也暗示，单个企业 AI 采购周期长达
              90–180 天，这会限制收入爬坡速度，并带来 CAC 跑在回款前面的风险。关键人物风险很高：投资逻辑离不开创始人 Spiros Xanthos 和 Mayank
              Agarwal，他们的技术信誉、企业关系和领域经验同时驱动产品与客户获取。公司只有 20+ 个已命名企业账户，客户集中度偏高；前三大客户很可能贡献了不成比例的 ARR，Coinbase 或 DoorDash
              任何续约流失都会对增长叙事造成实质影响。若全市场 AI 估值压缩，或 Resolve AI 自身增长不达预期，公司可能被迫进行 bridge round，或以低于 $1.5B 的价格
              down-round，严重伤害股权激励和招聘。
