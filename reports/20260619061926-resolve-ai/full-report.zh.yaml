  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与格局
        blocks:
          - type: paragraph
            body: >
              Resolve AI 处在三个相邻但分析上不同的市场交汇处：AIOps 平台、AI 增强可观测性和事故响应自动化。其核心价值主张——自主告警调查、根因分析（RCA）、引导式或自动化修复——构成 Gartner 在
              2026 年首份 Market Guide 中称为「AI SRE tooling」的子品类。该子品类明显窄于广义 AIOps 平台市场，后者包括事件关联、异常检测、ITSM
              工作流自动化和预测性容量管理。被排除的支出包括传统可观测性基础设施（Prometheus、Grafana 或原始 Datadog ingest 等指标 / 日志 /
              链路采集工具）、安全事故响应（SOAR/SIEM），以及传统 SRE 团队人力。

              市场现状替代方案包括：（1）人类值班 SRE 工程师手工响应 paging 告警；（2）旧式 AIOps
              关联工具（BigPanda、Moogsoft），能减少告警噪声，但调查仍留给人；（3）只给建议、不自主行动的 AI 辅助 copilots；（4）临时套用的通用 LLM 聊天机器人。2024–2026
              年，随着代理框架成熟、LLM 可靠性足以支持多步工具使用，以及 Microsoft 等 hyperscaler 发布生产级产品（Azure SRE Agent GA：2026 年 3 月 10 日），新兴 AI
              SRE 品类逐渐成形。相邻可观测性和 ITSM 支出，是 AI SRE 平台的上游数据源和分发渠道，而不是替代品。Dynatrace、Datadog 等厂商同时是合作方（提供遥测）和竞争方（将 AI SRE
              功能捆绑进平台）。
            claimRefs:
              - CM009
