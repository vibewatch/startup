          value: 8
        - label: 客户证据
          value: 6
        - label: 经济性 / 财务
          value: 2
        - label: 竞争护城河
          value: 6
        - label: 估值纪律
          value: 4
        - label: 证据质量
          value: 3
    approximationNotes: >
      分数为作者评估（0=最低，10=最高）。经济性 / 财务得 2 分，因为没有公开披露 ARR、利润率、NRR 或现金消耗数据。证据质量得 3 分，因为投资者进入信号（DST）是最强可得代理；没有财务 KPI 佐证。所有分数截至
      2026 年 6 月，若披露财务数据则可能修订。
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV006
      - CV026
