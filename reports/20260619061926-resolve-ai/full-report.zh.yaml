    notes: 概率和严重性基于 OWASP LLM Top 10、NIST AI RMF、CISA AI 安全指南和 arXiv 幻觉研究作定性评估；Resolve AI 未发布内部风险登记表。
  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖
      - 交易对手
      - 角色
      - 集中度
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - LLM 推理 API
        - OpenAI / Anthropic（组合未披露）
        - 核心智能体推理、根因分析和自然语言交互引擎
        - 极高——没有实时 LLM 推理，多智能体平台无法运转
        - LLM 提供商涨价、限制容量、模型退化或撤销访问
        - 高——收入、产品质量和可用性 SLA 直接取决于 LLM 提供商的性能与定价
        - 产品架构暗示多模型策略；提供商组合尚未确认
        - 高——规模化后，推理成本波动会成为 COGS 风险；未确认多 LLM 故障切换或备用模式
      - - 云基础设施（计算、存储、网络）
        - AWS（推断为主供应商）
        - Resolve AI 平台和智能体编排的核心计算与数据存储
        - 高——未记录多云部署；大概率依赖单一主供应商
        - AWS 涨价或服务降级会直接影响平台可用性和 COGS
        - 高——向客户承诺的 SLA 上限受底层云 SLA 限制
        - 标准企业云协议；除标准透传 SLA 外未作说明
        - 中——标准超大规模云依赖；可通过多区域配置缓释
      - - 可观测性数据访问（Datadog、Splunk、Dynatrace、New Relic、PagerDuty）
        - 多家成熟供应商，其中一部分也是直接竞争对手
        - 遥测信号来源（指标、日志、链路追踪、告警），为智能体调查提供上下文
        - 高——集成深度取决于各合作方 API 的稳定性和商业善意；其中部分供应商是直接竞争对手
        - 可观测性供应商修改 API 造成破坏、商业立场反转（合作方转为对立方）或涨价
        - 中高——Datadog 和 Dynatrace 也是直接 AI SRE 竞争者；利益冲突带来访问风险
        - 通过 MCP 和 API 接入多种集成，降低单一供应商依赖；抽象层提供一定缓冲
        - 中——若竞争定位恶化，“竞争对手兼合作方”的关系会埋下 API 访问风险
      - - 风险投资融资
        - 投资者：Lightspeed、DST Global、Salesforce Ventures、Greylock Partners
        - 运营和研发资金来源；Salesforce Ventures 带来战略分销
        - 高——公司尚未盈利，依赖持续风险融资来支撑运营
        - 投资者情绪转向、AI 估值压缩、组合再平衡，或以更低估值做过桥轮
        - 高——down round 会稀释创始人和员工，并削弱招聘、留任和二级市场流动性
        - Salesforce Ventures 的战略位置提供一定商业缓冲和分销入口
        - 高——$1.5B 估值需要持续高增长叙事支撑，后续融资估值才可能达到或高于当前标记
      - - 企业客户集中度
        - Coinbase、DoorDash、Salesforce、MSCI、Zscaler（披露的头部客户）
        - 收入基础、参考案例和概念验证部署，支撑销售叙事
        - 高——总客户数 20+，前 3–5 家很可能贡献超过 50% ARR
        - 前三大客户之一不续约，会实质削弱 ARR 增长叙事和参考案例管线
        - 高——参考案例流失也会削弱新 logo 管线和投资者信心
        - Coinbase 多产品、多团队部署（100+ 名工程师）降低单一联系人流失概率
        - 高——已披露指标无法确认集中度；这是重大尽调事项
