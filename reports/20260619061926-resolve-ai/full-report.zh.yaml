      - number: '5.3'
        title: 集成、可扩展性与 MCP 层
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 提供 60+ 个预构建集成，覆盖遥测（Datadog、Grafana、Prometheus、Sentry、New
              Relic、Loki）、基础设施（AWS、GCP、Kubernetes、AlertManager、Kloudfuse）、代码（GitHub、GitHub Enterprise
              Server、GitLab、Bitbucket、Azure DevOps）、知识库（Notion、Confluence、Google Drive）和协作（Slack、MS
              Teams、Linear、Jira）。环境匹配是主要配置依赖，要求 Satellite 配置与可观测性工具中的命名一致（例如 "production"、"us-west"）。Git 集成可运行在 Resolve
              托管云基础设施上，也可运行在客户自己的 Kubernetes 或 ECS 集群内；它支持 GitHub 的 OAuth-style app 安装、GHE 的自带 GitHub App，以及其他所有
              provider 的 personal access tokens。平台在 app0.resolve.ai/mcp 暴露 MCP server（Beta），采用无状态 Streamable HTTP
              transport，让 Claude Code、Cursor 和其他 MCP-compatible agents 能把 Resolve 作为原生工具调用，用于调查查询、历史检索和遥测关联。REST API
              提供程序化访问，可按时间范围和告警标签列出调查、获取调查详情并发起调查。Skills 层实现 agentskills.io 开放标准——Claude 和其他 agentic tools 也采用同一格式——因此为
              Resolve 打包的流程知识可以流向任何兼容 agent，反之亦然。AWS Marketplace 和 Slack Marketplace 分发则拓展了已有企业协议团队的采购渠道。
