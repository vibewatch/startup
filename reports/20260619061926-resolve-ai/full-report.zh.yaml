  - id: FV001
    title: ARR 情景下的估值倍数敏感性
    type: bar
    layout: standard
    summary: |
      在 $1.5B 估值下，不同 ARR 假设对应的隐含 ARR 倍数；Datadog 21.6x TTM 倍数作为高增长上市公司基准展示。
