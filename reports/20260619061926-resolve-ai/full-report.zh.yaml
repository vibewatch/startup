      - number: '8.5'
        title: 建议与风险评级
        blocks:
          - type: paragraph
            body: >
              对 Resolve AI 当前 $1.5B 估值的建议是继续研究，信心低，风险评级高。估值判断是「偏高到未知」：若 ARR 超过 $75M 且增长与 NRR
              强劲，价格可能合理；但没有财务披露就无法确认。核心承销前提是硬性的：若不能确认 ARR、季度增长率、毛利率、NRR、前 10 大客户集中度和月 burn rate，就无法支持在 $1.5B 或任何 Series
              B 价格上的投资决策。缺少这七项指标，任何正面建议都只是叙事投机，而非基于证据的承销。


              公司的优势真实且重要：创始团队、投资人信号、命名客户和市场时机都很强。Resolve AI Labs 启动并引入 Dhruv Mahajan——他曾在 Meta 负责 Llama 基础模型
              post-training——代表公司在专有模型研发上投入严肃，若成功，可能建立持久技术 moat。但这些定性因素无法替代 $1.5B 价格所需的财务证据。竞争格局释放的负面信号——Datadog 在 DASH
              2026 发布 100 项功能并瞄准自主 AI ops，NeuBird AI 直接挑战该品类，incident.io 认为 AI 热度高于实际效用——都会在 Resolve AI 不能通过财务 KPI
              证明可衡量差异化时，制造毛利压缩风险。应继续跟踪入场价格，等待财务披露；若 ARR 确认为 $50M–$80M、增长 100%+、NRR 高于 120%，$800M 到 $1.4B 会是更可防守的入场区间。
