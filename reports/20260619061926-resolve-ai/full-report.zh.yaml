  - id: FV003
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: |
      从市场、产品和财务信号推导投资建议的证据链；收入不透明，是阻止建议从「继续研究」上调至「跟踪」的关键约束。
    data:
      nodes:
        - id: market-strength
          label: 大市场：2026 年 AIOps $18.95B；14.8% CAGR
        - id: product-differentiation
          label: 强产品：领域 AI、精英团队、蓝筹客户标识
        - id: investor-signal
          label: DST 以 $1.5B 进入：暗示收入可见度
        - id: revenue-opacity
          label: 收入缺口：未披露 ARR、利润率或 NRR
        - id: competitive-risk
          label: 竞争风险：Datadog Bits AI、Dynatrace、NeuBird
        - id: recommendation
          label: 建议：继续研究；估值：偏高至未知
    claimRefs:
