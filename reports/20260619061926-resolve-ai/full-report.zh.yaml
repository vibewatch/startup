      - number: '4.4'
        title: 资本充足性与融资轨迹
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 自 2024 年末走出隐身模式以来，三轮融资合计超过 $190 million：Greylock Partners 领投的种子和早期融资约 $25 million；2026 年 2 月
              Lightspeed 领投、估值 $1 billion 的 $125 million Series A；以及 2026 年 4 月 DST Global 与 Salesforce Ventures 领投、估值
              $1.5 billion 的 $40 million Series A Extension。约十周内估值从 $1 billion 跳到 $1.5
              billion，按风险投资常态看很罕见，意味着该窗口内合同快速扩张或 ARR 出现实质增长。DST Global 很少在这一阶段以不匹配估值的收入倍数领投，因此可推断签约 ARR 处在与 $1.5 billion
              post-money 下 10–20x 收入倍数相符的区间——但没有具体 ARR 数字得到确认。

              CEO 称 Series A 获得超额认购。TechCrunch 2026 年 2 月援引未具名消息人士报道称，这笔 $125 million Series A 可能包含多个不同价格的
              tranche，实际混合估值可能低于 $1 billion。Resolve AI 公开否认，称 100% 股权均按 $1 billion 购买。该报道构成实质性负面信号，尽调必须直接核查公司的 cap table
              结构和投资人文件。

              公司未披露债务或项目融资义务，资产负债表风险主要取决于 burn rate 与剩余资金。已融资总额意味着现金头寸可观，不过自 2024
              年首笔种子轮交割以来，相当一部分资金应已投入产品开发、上市团队建设、模型训练和团队扩张。Series A Extension 的计划用途覆盖产品开发、上市扩张和 Resolve AI Labs 长期研究。年
              burn rate 估计为 $15–45 million，以 2026 年 4 月交割后计算，估计 runway 明显超过 24 个月，更像为抢占 Series B 条件提前融资，而非短期资本受限。
