      - number: '3.5'
        title: 护城河耐久性、替代风险与负面证据
        blocks:
          - type: paragraph
            body: >
              Resolve AI 的主要护城河主张是同时跨代码、基础设施和遥测进行多域推理——不同于可观测性平台（单一遥测栈）和 AIOps 工具（只做关联）。第二层护城河是平台随时间为每个客户构建的生产模型：随着平台捕捉
              runbook、部落知识和组织特定事故模式，准确性和速度优势会复利。这为现有客户制造切换成本：迁移到竞争者意味着从零开始重新训练组织上下文。Beri.net 分析指出，Resolve AI 聘请 Dhruv
              Mahajan（前 Meta Llama 后训练负责人）担任 Chief AI Scientist，显示其有意训练生产领域专用模型——这是一种竞争对手复制成本很高的护城河策略。

              不过，三类替代风险很重要。第一是 Datadog 和 Dynatrace 的分发优势：当企业已经与可观测性平台签有每年 $200K+ 的合同时，评估独立 SRE agent
              的经济和组织门槛很高。既有厂商可以把自主调查打包进续约对话，无需触发新的采购评估。第二，品类中至少已有三家资金充足的 AI-native 同行（Traversal $53M+、NeuBird
              $64M+、incident.io $96M+）争夺同一批工程团队，并都提出类似的 MTTR
              降低和自主调查主张。在任何一家厂商取得明确企业规模之前，营销层面的差异化有商品化风险。第三，定价不透明是负面信号：如果买方无法将 Resolve AI 成本与 incident.io 公开的
              $15–$45/user/month 定价对标，评估期间可能默认选择透明替代方案。

              负面证据和未知风险：NeuBird AI 的厂商自撰竞争评测将 NeuBird 定位为 production ops AI 的「最强选择」，但没有独立验证 Resolve AI
              的主张，说明分析师群体中存在竞争叙事。AI SRE 平台整体面对稀疏或含混遥测上的幻觉风险——自动化错误修复（例如重启健康服务、回滚非因果部署）可能放大事故，而不是解决事故。包括 Resolve AI
              在内，没有任何厂商发布自主修复准确性或失效模式分析的独立第三方审计，企业买方只能依赖厂商提供的案例研究。
