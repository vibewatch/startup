      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 在不到两年内通过三次不同融资事件累计融资超过 $190 million，并在 2026 年 4 月达到 $1.5 billion 投后估值——即便按 2024–2026 年 AI
              融资标准看，也是最快达到并超过独角兽门槛的企业 AI 公司之一。

              $35 million 种子轮由 Greylock Partners（Saam Motamedi）领投，是该机构 2024 年开出的最大单笔支票，Unusual Ventures
              共同投资。本轮还吸引了极强的天使阵容，包括 Stanford 教授 Fei-Fei Li、Google DeepMind Chief Scientist Jeff Dean、LinkedIn 联合创始人 Reid
              Hoffman、GitHub CEO Thomas Dohmke、AWS CEO Matt Garman、Accenture CTO Paul Daugherty、Stanford 教授 Christos
              Kozyrakis，以及来自 OpenAI、Ramp、Notion 和 Snowflake 的创始人与高管。

              $125 million Series A 于 2026 年 2 月 4 日宣布，估值 $1 billion，由 Lightspeed Venture Partners（Partner Sebastian
              Duesterhoeft）领投。现有投资人 Greylock、Unusual Ventures、Artisanal Ventures 和 A* 全部超比例跟投，是很强的内部人信心信号。该轮使公司总融资超过
              $150 million，距离公司走出隐身期仅 16 个月。

              $40 million Series A Extension 于 2026 年 4 月 16 日宣布，估值 $1.5 billion，由 DST Global（联合创始人兼 Managing Partner
              Rahul Mehta）领投，Salesforce Ventures（Principal Zak Kokosa）作为战略共同投资人参与。Salesforce
              同时是具名企业客户和战略投资人，这种双重位置并不常见：它验证商业价值，但如果关系变化，也会带来潜在依赖风险。融资资金将用于平台开发、市场拓展，以及通过 Resolve AI Labs 开展长期研究。
