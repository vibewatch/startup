      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的上市路径是典型企业级直销，再叠加战略投资人的分发能力。目标买家是工程负责人——VP of Engineering、CTO 或 Head of SRE——所在企业通常运行大规模
              Kubernetes 或微服务栈，SRE 琐事重到足以为平台软件单独编预算。Salesforce Ventures 参与 Series A Extension 有明确商业含义：Salesforce
              同时是付费客户和战略投资人，Resolve AI 因而拿到一个 Salesforce 内部背书，可借此打开其他 Fortune 500 账户中管理类似复杂生产环境的 CIO 大门。DST Global
              共同领投则说明，交易速度和合同指标与其在该估值倍数下的投资组合相匹配。

              公开材料里，销售效率证据只剩客户成效代理指标。DoorDash Ads 评估过自建内部事故平台，判断需要数十名专职工程师和持续微调，最后认为买 Resolve AI
              优于自建——这是一份有记录的自建还是采购测算，既说明价值主张清晰，也说明 Resolve 经历过一段与内部替代方案对比的概念验证。DoorDash 通过全面安全审查（并授予其生产环境中 Ads
              代码库、基础设施和遥测访问权），说明采购流程是结构化的；以此敏感度的平台，销售周期很可能为 90–180 天。CAC、销售周期长度、背负 quota
              的销售人数和胜率都未公开。招聘页面显示，公司正在招聘企业客户经理、解决方案工程和客户成功岗位，符合 Series A 后扩张直销团队的节奏。
