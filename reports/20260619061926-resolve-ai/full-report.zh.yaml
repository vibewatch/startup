        - 严重 — 客户 P0 宕机可归因于 Resolve AI 智能体动作；带来声誉和合同责任
        - 部分 — 高影响动作已记录人工审批门禁；默认配置和自主边界未公开说明
        - 严重 — 无第三方准确率基准；一次误动作就可能摧毁企业客户信任并触发 SLA 赔付
        - 独立根因准确率审计；默认模式与自主模式规范；智能体造成宕机时的 SLA 条款
      - - 恶意日志或遥测内容发起提示注入，借生产凭据操控智能体动作
        - 中低 — 新型攻击，但 OWASP LLM01 已发布攻击向量并有概念验证漏洞利用
        - 高 — 攻击者借智能体获得生产写入权限；可能外泄数据或修改基础设施
        - 低 — Resolve AI 未公开披露提示注入防御架构或对抗测试结果
        - 高 — 若智能体被成功操控，生产写入权限会放大攻击影响
        - 发布提示注入防御架构；在授予生产访问权限前索取第三方对抗红队测试证据
      - - LLM 提供商 API 宕机或容量限制，在客户活跃事故期间拖低 Resolve AI 智能体可用性
        - 中 — OpenAI 和 Anthropic 在 2024–2025 年经历过多小时宕机；按用量计费的推理不保证可用性
        - 高 — Resolve AI 平台恰好在最需要时（活跃事故期间）不可用，削弱核心价值主张
        - 未知——公开资料未说明是否可降级到非 LLM 模式，或切换到第二家 LLM 提供商
        - 高——LLM 提供商冗余和故障切换路径未披露
        - 披露 LLM 提供商冗余架构；确认降级模式下的行为；发布智能体功能的可用性 SLA
      - - SOC 2 Type II 审计范围不覆盖上一个审计期之后新增的自主修复功能
        - 中——产品迭代速度快于年度审计周期；新功能通常顺延到下一周期
        - 中——企业客户可能以为已认证合规覆盖自主 git commit 和基础设施变更功能，但这些功能可能不在范围内
        - 部分——已取得 SOC 2 Type II 认证并每年复审；在这一成长阶段，范围滞后很常见
        - 中——如果新能力在下次续约前未重新认证，合规表述会留下缺口
        - 确认 SOC 2 Type II 范围明确覆盖自主修复和 git commit 动作；索取当前审计期日期和任何已注明的范围排除项
    claimRefs:
