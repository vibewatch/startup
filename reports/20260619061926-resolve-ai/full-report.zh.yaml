      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              首要结构性驱动是告警量与人力容量不匹配。普通值班工程师每周约收到 50 条告警，其中只有 2–5% 需要真人介入；70% 的 SRE 团队将告警疲劳列为前三大运营担忧。问题还在加速：DORA 2025 State
              of AI-Assisted Software Development 报告发现，AI 编码助手加快交付后，事故响应能力没有同步改善，每个 PR 引发的事故增加 242.7%。NeuBird 的 2026
              State of Production Reliability Report 显示，工程师合计将 40% 工作时间花在事故管理，而不是产品开发。这种生产力税，为自主 SRE 工具提供了直接、可量化的 ROI
              论证。

              多云复杂度放大结构性需求：组织平均使用 2.4 个公有云提供商，70% 采用混合策略。随着系统规模和依赖关系扩大，手工关联 AWS、Azure 和 GCP 上的事故越来越不可行。分析师群体在 2026
              年确认了这一转变：Gartner Market Guide for AI SRE Tooling 预计，到 2029 年，70% 的企业将部署 agentic AI 来运营 IT 基础设施，而 2025 年低于
              5%。Hyperscaler 验证来自 Microsoft 的 Azure SRE Agent 于 2026 年 3 月 GA；Datadog 则在 DASH 2026 发布 100 多项 AI 功能，推进自主
              AI operations。两件事同时验证品类，也加剧竞争压力。更广义的企业 AI 投资预计 2026 年全球接近 $2 trillion（Dynatrace 新闻稿），使 AI operations
              工具成为与企业 AI 建设大潮绑定的支出优先项。
