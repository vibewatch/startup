      - number: '2.2'
        title: 市场规模：TAM、相邻细分与矛盾估算
        blocks:
          - type: paragraph
            body: >
              AIOps 平台市场是最常被测算的相邻细分，也是隔离 AI SRE 子品类之前估算 Resolve AI TAM 的主要代理。估算差异很大：Business Research Company（经 GII
              Research）认为 2025 年全球 AIOps 市场为 $11.08B，并以 30.2% CAGR 增至 2026 年 $14.44B；360iResearch 给出明显更高的 $18.24B（2025
              年）和 $21.01B（2026 年），CAGR 为 15.34%；PW Consulting 估算 2025 年为 $22.0B。$11B 至 $22B
              的跨度，反映市场边界定义不一致：一些分析师纳入事件管理、ITSM 和网络性能监控；另一些则将范围限定在 ML 驱动的告警关联平台。所有估算都应视为方向性，而非精确值。

              两个互补子市场提供额外三角校验。TechNavio 预测，AI-in-observability 市场将在 2025 至 2029 年增长 $2.92B，CAGR 为 22.5%，其中 North America
              占增量的 37.3%。事故响应自动化市场估计 2025 年为 $5.89B、2026 年为 $7.2B，CAGR 为 22.2%（Research and
              Markets）；更广义的事故响应市场（包括手工流程和托管服务）在 2025 年达到 $46.45B。截至 2026 年中，AI SRE
              子品类——特指自主调查和修复——尚未由任何公开分析机构单独测算。风险投资给出部分信号：Resolve AI（$125M，估值 $1B）、NeuBird AI（$19.3M）、incident.io（$62M）和
              Traversal（Sequoia 支持）合计已融资数亿美元，说明市场真实存在但仍处早期。AI-native 自主 SRE 的 SAM 和 SOM
              无法从现有公开数据中剥离；通过值班工程师人数自下而上测算（全球大型企业估计有数百万）是一个可行替代视角，但尚未公开建模。
