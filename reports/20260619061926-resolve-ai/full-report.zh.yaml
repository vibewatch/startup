      - number: '7.3'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 所处的人工智能监管环境仍在快速变化，多个司法辖区都在设定合规义务。欧盟《AI 法案》（Regulation 2024/1689）已于 2024 年 8 月生效，并在 2026
              年前逐步适用；该法建立了按风险分级的 AI 系统框架。在生产基础设施中运行、且错误决策可能直接造成服务中断的自主 AI agent，可能依据第 6 条和附录 III 被划为高风险 AI
              系统，从而在投放市场前触发合格评定、技术文档、人类监督机制和欧盟 AI 数据库登记要求。截至 2026 年 6 月，自主 SRE agent 是否落入该分类仍未明确；EU AI Board
              尚未发布针对这一产品类别的意见。FTC 2023 年 6 月关于生成式 AI 的报告指出，AI 驱动的自动化决策系统存在集中度风险和问责缺口，释放出执法机构将更关注 AI
              责任框架的信号，相关框架可能影响自主修复供应商。NIST AI Risk Management Framework（AI RMF
              1.0）在美国虽属自愿框架，却越来越多被企业采购团队列为供应商评估基线，带来合规文档负担。来自欧盟客户的客户遥测数据被 Resolve AI 摄取后，适用 GDPR
              数据处理要求，形成数据处理协议义务和跨境传输限制。Resolve AI 的 trust center 确认其符合 GDPR，但未公开披露跨境传输机制，也未说明标准 DPA 是否可供常规企业签约使用。截至 2026
              年 6 月，未发现针对 Resolve AI 的未决诉讼、监管调查或执法行动公开记录；这更符合公司仍处早期、公开历史有限的事实，并不能证明其责任敞口干净。
