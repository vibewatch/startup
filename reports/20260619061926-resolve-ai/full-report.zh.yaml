  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 幻觉式修复导致生产事故
        - 已发布事故报告；G2/Gartner Peer Insights 评论提到 AI 造成事故；公开复盘点名 Resolve AI
        - 首个有记录的重大事故（P0/P1），可归因于 Resolve AI 在具名企业客户处的自主修复动作
        - 暂停将自主修复作为承保假设支柱；按当前估值重新评估技术风险
      - - 企业采购阻力导致平均账户成交周期超过 180 天
        - 投资者更新中的成交周期数据；销售周期披露；CAC/收入比趋势；管线中 90+ 天 bucket 的老化情况
        - 平均成交周期超过 180 天，或连续两个季度 CAC 回收期超过 36 个月
        - 重新评估 land-and-expand 经济性；判断是否需要免费增值或受限 POC 层来提升管线速度
      - - 超大规模云厂商 AIOps 捆绑产品拿下目标企业 AIOps 市场 >30%
        - Datadog、Dynatrace、AWS、Azure 采用率调查（Gartner、Forrester）；Resolve AI 连续两个或更多季度净新增 logo 停滞
        - 净新增 logo 低于每季度 3 个，或 ARR 增速连续两个季度降至 50% YoY 以下
        - 破坏假设信号：Resolve AI 无法在市场扩张阶段打赢捆绑型 incumbents；重新评估垂直细分转向或被收购选择权
      - - down round 或低于 $1.0B 估值的过桥融资
        - Crunchbase / PitchBook 融资事件；二级市场定价；VC 社群渠道传闻条款
        - 下一次公开或已确认融资事件估值低于 $1.0 billion（较 2026 年 4 月标记折价 33% 或以上）
        - 员工和创始人的股权激励受到实质削弱；重新审视持仓规模和确信度
      - - 创始人离任（Spiros Xanthos 或 Mayank Agarwal）
        - 公开公告；LinkedIn 状态变更；未来任何监管文件中的董事会层面披露
        - 任一联合创始人宣布离任、休假，或在日常产品和商业运营中的角色明显缩小
        - 立即启动破坏假设复盘；在评估具名继任者及整合情况前，暂停新增资本部署
      - - EU AI Act 确认自主生产 AI 智能体属于高风险类别
        - EU AI Board 关于基础设施 AI 的意见或实施法案；CISA 或 NIST 的美国同等 AI 智能体监督要求指南
        - EU AI Office 官方分类指南确认自主 SRE 智能体属于高风险；或美国出台类似监管裁定
        - 需要为人工监督机制承担重大合规成本并重构产品；未来进入或跟投估值谈判需计入合规开销
    claimRefs:
      - CR001
      - CR007
      - CR017
      - CR024
      - CR031
      - CR033
      - CR034
      - CR036
    notes: 否决标准是投资假设指标，不是运营停摆标准。阈值事件代表当前投资模型假设发生实质变化、需要重新审视持仓规模的节点。
  - id: TV001
    title: 投资假设与反假设
    columns:
      - 假设论点
      - 证据基础
      - 什么会改变该观点
    rows:
      - - 顶尖创始团队，曾有两次退出，并具备深厚可观测性经验
        - 共同创建 OpenTelemetry；曾领导 Splunk 可观测性 GM；Greylock 2024 年最大支票
        - 出现商业校准失误证据，或关键高管离任
      - - 蓝筹投资财团意味着其看到了私下收入可见性
        - DST Global 以 $1.5B 估值领投；该基金历史上通常要求 $50M+ ARR 后才进入
        - 如果 DST 进入主要由战略或 LP 驱动，而不是由收入支撑
      - - 具名企业客户且 ROI 有记录
        - Coinbase 100+ 名工程师；Zscaler 每起事故所需工程师减少 30%；Salesforce CTIO 背书
        - 任一具名锚定客户流失或续约失败
      - - AIOps 品类规模大且快速增长，生产运维细分仍未被充分服务
        - Mordor：2026 年 AIOps 市场 $18.95B，CAGR 14.8%；AI coding 正在推高事故量
        - 品类被 Datadog Bits AI 或 Dynatrace 以更低进入成本拿下
      - - 专有领域模型形成持久技术护城河
        - Resolve AI Labs 由 Dhruv Mahajan（前 Meta Llama 后训练负责人）领导；Snowflake 两年合同
        - 基础模型进步弥合领域差距；专有优势被侵蚀
      - - 在这一阶段，早期 AI 独角兽不披露收入是常态
        - 多家 2026 年 AI 独角兽（Render $1.5B、Arena $1.7B、Code Metal $1.3B）也未披露
        - 竞争对手披露带来透明度压力；指标缺口成为尽调阻塞项
    notes: |
      这些论点代表作者基于公开证据对投资假设的评估。ARR、毛利率和单位经济均未获确认。DST Global 的投资时点暗示存在公开记录无法看到的私下收入验证。所有反假设触发项都基于证据，而非臆测。
