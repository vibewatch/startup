      - number: '5.2'
        title: 平台架构与技术设计
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的平台分为三层功能：Context、Models 和 Actions。Context
              层维护一个持续更新、可查询的图，覆盖服务、依赖、近期部署和团队知识（runbooks、wikis、过往调查经验），每个 agent 调查时都会调用。Models
              层把第三方前沿语言模型（GPT-class、Claude-class）与公司在 Resolve AI Labs
              后训练的领域专用模型配对；平台在推理时为每项任务选择最合适模型，并自动处理模型升级编排。Actions 层把写操作放在强制人工审批门之后：生成缓解方案的 AI model 无法直接访问写
              API，独立执行引擎只有在工程师通过 Resolve UI 或 Slack 按钮明确批准后才行动。这种架构隔离意味着，静默告警、回滚 commit 和创建 PR 始终保留
              human-in-the-loop。Resolve Satellite 是部署在客户环境内的容器化 agent（Kubernetes 或 AWS ECS Fargate），负责抓取 Kubernetes
              APIs、DNS tap，并代理可观测性查询；数据发往 Resolve AI 云之前，会先应用基于 regex 的 PII/PHI
              脱敏。原始遥测实时查询、不保留；仅调查摘要和元数据缓存在客户隔离存储中。Playground 环境展示了从自然语言查询到多源证据关联的完整调查流，为评估者提供推理深度的上手机会。
