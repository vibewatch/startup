        - label: 发现与评估
          description: >-
            工程负责人通过同行推荐、现场网络或告警疲劳痛点，识别出 AI SRE 工具需求。评估 Resolve AI 时，会同时比较 Datadog Bits AI SRE、PagerDuty SRE Agent
            和开源替代方案。DoorDash 案例称，其 RCA 准确率比评估过的替代方案高 2×。
          timeframe: Days 1–30
          tone: neutral
        - label: 只读试点
          description: Agents 以观察模式接入生产栈。AI 给出告警调查、根因假设和 runbook 建议，但不执行任何生产动作。SRE 用自己的判断校验 AI 输出质量。
          timeframe: Days 31–60
          tone: neutral
        - label: Copilot 模式
          description: Agents 起草修复动作；SRE 审核并批准后才执行。Coinbase 和 Zscaler 的部署资料显示，在保留工程师监督的同时，调查时间下降，因此可推断会经历这一阶段。
          timeframe: Months 2–4
          tone: positive
        - label: 受监督自主
          description: Agents 自主执行边界清晰的修复类别；SRE 事后审查动作日志。信任已在特定事故类别上建立。该阶段需要安全审查和 RBAC 配置。受监管金融客户的周期更长。
          timeframe: Months 4–8
          tone: positive
        - label: 完全自主
          description: Agents 端到端接管边界清晰的事故类别。SRE 转向处理自主范围之外的新型或高严重度事故。这是效率最高、产品粘性最强的状态；爆炸半径风险要求成熟的治理模型。
          timeframe: Months 8+
          tone: positive
    approximationNotes: >-
      时间线估计来自案例背景和企业 AI 采用研究的一般规律。Resolve AI 尚未发布正式导入时间线。DoorDash 部署（2025 年中）和 Coinbase 部署（2024–2025
      年）是估计部署时长的主要参照，但阶段时长会随客户规模和风险容忍度大幅变化。
    claimRefs:
      - CU024
      - CU025
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 漏斗展示从公司宣称的客户总数，到具名客户、已发布案例、署名高管引述、第三方验证部署的递进，凸显证据金字塔顶端较薄。
    data:
      items:
        - label: 新闻材料宣称客户（20+）
          value: 20
        - label: 公开材料具名（确认 7 家）
          value: 7
        - label: 已发布供应商案例（5）
          value: 5
        - label: 记录在案的具名高管引述（2）
          value: 2
        - label: 第三方验证部署（0）
          value: 0
    approximationNotes: >-
      20+ 数字来自 Resolve AI 2026 年 2 月 Series A 新闻材料；2026 年 4 月 Series A Extension 未更新该数字。具名客户来自截至 2026 年 6 月 19
      日的所有新闻稿和投资者公告。第三方验证定义为独立审计案例，或出现在非公司制作出版物中的客户引述。
    claimRefs:
      - CU006
      - CU028
      - CU029
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 八个公开具名或确认的客户账户，按大致工程规模（x 轴：告警量 / SRE 人数）和证据深度（y 轴：案例完整度、指标具体性、高管署名）绘制。Salesforce 另加利益冲突提示。
    data:
      columns:
        - 工程规模
        - 证据深度
        - 关键指标
        - 利益冲突
      rows:
        - label: DoorDash
          values:
            - 大型（50+ SRE；>$1B 广告收入）
            - 高（完整案例 + 高管引述）
            - TTRC 下降 87%；RCA 准确率 2×
            - None
        - label: Coinbase
          values:
            - 大型（100+ SRE；24/7 交易所）
            - 高（完整案例；使用指标）
            - 快 72%；每周 250+ 次会话
            - None
        - label: Zscaler
          values:
            - 大型（每月 150K+ 告警）
            - 高（完整案例；告警指标）
            - RCA 快 75%；每起事故少 30%+ 工程师
            - None
        - label: Salesforce
          values:
            - 大型（10K+ 企业客户）
            - 中高（案例 + 高管；投资者提示）
            - MTTR 约 60%；分诊快约 70%
            - ⚠ Salesforce Ventures 投资者
        - label: Snowflake
          values:
            - 大型（NYSE 上市；ML 规模）
            - 低（仅新闻稿提及）
            - 未量化
            - 合作伙伴（Cortex Training）
        - label: Blueground
          values:
            - 中型（proptech；较小 SRE 团队）
            - 中（完整案例；无具名高管）
            - RCA 快 4×（20 分钟 → <5 分钟）
            - None
        - label: MongoDB
          values:
            - Unknown
            - 无（仅新闻中具名）
            - 未披露
            - None
        - label: MSCI
          values:
            - Unknown
            - 无（仅新闻中具名）
            - 未披露
            - None
    approximationNotes: 工程规模评估来自案例措辞和公开公司信息；多数账户没有发布权威 SRE 人数或告警量数据。证据深度评级是研究者基于截至 2026 年 6 月 19 日可得证据作出的评估。
