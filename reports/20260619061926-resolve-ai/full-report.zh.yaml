  - id: TV003
    slug: comparable-valuation-table
    title: 可比估值表
    columns:
      - 可比公司
      - 类别
      - 收入 / ARR
      - 收入倍数
      - YoY 增长
      - 与 Resolve AI 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >
        Observability, AIOps, and AI infrastructure companies with disclosed valuations or public financials as of June
        2026; excludes pure-play AI labs without enterprise revenue; private valuations sourced from funding
        announcements; multiples are trailing-revenue-based for public companies.
    rows:
      - - Datadog（DDOG）
        - AI 可观测性 / AIOps
        - $3.67B TTM
        - ~21.6x
        - 32% YoY
        - 增速最高的公开 AIOps 基准；Bits AI 向事故运维扩张
        - 收入规模和护城河远超早期 Resolve AI；设定倍数上限
      - - Dynatrace（DT）
        - 可观测性 / AIOps
        - $2.02B FY2026
        - ~6.0x
        - 18.8% YoY
        - 中速增长的可观测性可比公司；提供更保守的倍数下限
        - 增速较低；利润率路径不同；企业 AIOps 部分重叠
      - - PagerDuty（PD）
        - 事故管理 / AIOps
        - $493M TTM；$496M ARR
        - ~1.3x
        - 5.4% YoY
        - 反向警示可比公司；说明增长停滞后倍数会坍缩
        - 增长减速极端；产品动作不同（告警而非自主解决）
      - - Gong（私有）
        - 收入 AI SaaS
        - $300M ARR（FY2025）
        - 2021 年融资约 36x ARR
        - n/a
