      - number: '8.4'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >
              在未披露 ARR 的情况下，Resolve AI 的估值无法精确锚定，但结合 DST 入场信号、客户深度证据和公开市场可比区间，仍可做概率加权框架。三个情景覆盖主要结果区间。


              牛市情景假设 ARR 为 $80M–$100M，符合 DST Global 的历史入场标准，也与命名客户深度指标所暗示的企业采用速度一致。在同比增长 150%+、NRR 高于 130% 的情况下，15–19x
              ARR 倍数反映了 Datadog 级增长在私募市场能拿到的溢价。这意味着公允价值为 $1.2B–$1.9B，当前 $1.5B 落在区间内。赋予概率：30%。基准情景假设 ARR 为
              $40M–$70M，反映企业爬坡中等、若干命名账户仍处早期部署阶段。在同比增长 80–120%、NRR 为 110–120% 的情况下，20–30x ARR 倍数对应 $800M 到 $2.1B 的估值。当前
              $1.5B 位于该区间上沿——略显拉伸。赋予概率：45%。熊市情景假设 ARR 低于 $30M，且由于 Datadog Bits AI 竞争压力和早期企业 AI 销售周期拉长，增长减速。在这种条件下，10–15x
              ARR 倍数意味着 $300M–$450M 估值——相较当前标记减值 70–80%。赋予概率：25%。


              三个情景的概率加权预期估值约为 (0.30 × $1.6B) + (0.45 × $1.2B) + (0.25 × $375M) = $480M + $540M + $94M = 约 $1.11B，比当前
              $1.5B 标记低约 26%。这个差距不一定是买入机会；它反映的是当前价格内含的不确定性溢价。以 $1.5B 买入的投资人，实质上是在按牛市执行定价，而公开记录中尚无财务确认。
