      - number: '6.5'
        title: 客户集中度与负面采用风险
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的客户证据暴露出几项实质风险，潜在投资人和企业买家都应仔细评估。最重要的是客户集中度：公司声称总客户 20+，但公开具名企业账户只有七个，且没有 ARR
              拆分；收入基础可能危险地集中在两三个锚定 logo 上。如果 Coinbase、DoorDash 或 Salesforce 贡献了不成比例的 ARR——这在早期企业公司中很常见——单一账户 logo churn
              就可能实质冲击收入。

              证明质量风险是第二大担忧。五份已发布案例研究全部由 Resolve AI 制作和筛选，没有来自客户财务或工程团队的独立验证，也没有第三方审计。Fundesk.io 2026
              买家指南明确提醒企业采购团队：「vendor benchmarks are not your benchmarks」——建议买家要求 glass-box
              auditability，并假设客户特定环境中的表现相较供应商发布 benchmark 会下降 30-50%。DORA 2025 报告同样发现，AI 工具放大既有实践的能力强于修正破损流程；这意味着没有成熟
              SRE 基础的企业，未必能复现 Coinbase 或 Zscaler 报告的结果。

              Salesforce 的利益冲突风险在具名客户中独一无二：Salesforce Ventures 于 2026 年 4 月共同投资 Series A Extension，同一时期 Salesforce
              案例研究指标出现在宣传材料中。Meir Amiel 的引用是真实的，但 Salesforce 同时是客户、投资人和 reference，这种复合关系意味着，与独立客户账户相比，Salesforce
              部署中的负面发现更不可能公开浮出水面。

              自主修复接受度是结构性采用障碍。beri.net 分析指出了「trust-and-blast-radius」问题：企业愿意授予 AI agents 只读调查访问权，不代表愿意授予自主生产写权限。从
              co-pilot 转向自主模式，在多数企业中需要监管审查、安全团队签字和高管级批准，这会拉长销售周期，并限制平台在受监管金融服务公司等风险厌恶账户中的采用速度。

              最后，MongoDB 和 MSCI 都在 Resolve AI 新闻材料中被列为企业客户，但截至 2026 年 6
              月，二者均未发布案例研究，公司也未确认任一账户的部署范围或活跃状态。它们出现在具名客户名单中却缺少佐证证据，因此无法从公开来源验证其状态。
