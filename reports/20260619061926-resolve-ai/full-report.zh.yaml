      - number: '3.4'
        title: 功能、定价与分发对比
        blocks:
          - type: paragraph
            body: >
              Resolve AI 的定价未公开披露。基于融资画像（以 $1.5B 估值融资 $190M）和客户基础（Coinbase、Salesforce、Zscaler），产品面向企业级交易，不太可能是
              self-serve 或按席位销售。这种不透明会在竞争评估中制造摩擦：买方比较 incident.io 公开的 $15–$45/user/month 定价，或 Datadog
              的用量计费价目表时，无法在不进入销售周期的情况下对标 Resolve AI。Opsgenie 关闭带来即时机会——数千个迁出团队需要在 2027 年 4 月前找到新的事故管理方案——但多数会先评估价格可见的厂商。

              能力方面，Resolve AI 的多代理跨域架构（代码 + 基础设施 + 可观测性同时推理）是其相对可观测性既有厂商（SRE agent 受限于平台已摄取的遥测）和 AIOps
              关联工具（只浮现降噪后的告警，不跨层因果推理）的核心优势主张。NeuBird AI 的竞争博客承认，「围绕自主调查构建的 AI-native 平台」代表领先层级，但将 NeuBird——而非 Resolve
              AI——定位为品类领导者，说明 AI-native 厂商之间的差异化叙事仍有争议。Traversal 和 NeuBird 均声称 RCA 准确率为 80–92%，而 Resolve AI 声称 MTTR 改善
              >70%，但未发布 RCA 准确率；买方比较厂商时，这可能成为披露缺口。

              分发是重要护城河因素。PagerDuty 和 Datadog 通过成熟企业渠道和续约周期销售；NeuBird 与 AWS、Microsoft 有 hyperscaler 渠道协议；incident.io 在
              Series B 后积极加大销售投入。Resolve AI 的 Lightspeed 和 Greylock 投资人网络能提供 go-to-market 支持，但没有预先存在的装机基础。自主 SRE
              工具的企业买方往往是 VP Engineering 或 Head of SRE，而不是采购买方，这更利好产品驱动评估，而非渠道驱动分发——这是 Resolve AI 的强项。
