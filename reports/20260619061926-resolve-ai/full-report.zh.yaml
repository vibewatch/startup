        title: 技术差异化、研究与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 最持久的差异化从创始团队履历开始：Spiros Xanthos 和 Mayank Agarwal 共同创建了 OpenTelemetry，这一 CNCF
              毕业的开源标准已被全球数千家组织采用，使团队对生产遥测如何埋点、传输和查询具备结构性领域知识。这与设计能跨碎片化遥测推理的 agents 直接相关。2026 年 4 月推出 Resolve AI Labs——由
              Meta Llama 前后训练负责人 Dhruv Mahajan
              领导——说明公司押注自有领域专用模型，瞄准通用前沿模型与生产运维准确性要求之间的缺口（噪声遥测、不完整数据、长链路多步骤工作流）。研究重点包括面向生产推理的后训练、在缺少干净 ground truth
              时评估可靠性的框架、合成数据生成，以及用于 agent 训练的模拟环境。三阶段自治路线图（AI-Assisted → HITL → HOTL）最清晰地说明了今日 HITL-gated remediation
              之外的产品方向：Phase 3 目标是由人类操作员设定政策，agents 在明确 guardrails 内自主执行。独立市场分析（Fundesk，2026）在六个平台 AI SRE 对比矩阵中显著遗漏
              Resolve AI，列入的是 Datadog Bits AI SRE、PagerDuty、New Relic、AWS DevOps Agent、incident.io 和 Tracer-Cloud
              opensre；这说明尽管已有企业牵引力，更广泛市场心智仍落后于可观测性 incumbents。G2 没有公开客户评论，也限制了采购团队做公开尽调时可用的第三方社会证明。
