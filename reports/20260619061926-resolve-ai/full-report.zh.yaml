  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 框架
      - 司法辖区
      - 截至 2026 年 6 月状态
      - Resolve AI 落入范围的可能性
      - 严重性
      - 已有缓释
      - 剩余敞口
      - 尽调路径
    rows:
      - - EU AI Act（Regulation 2024/1689）— Article 6 / Annex III 下自主生产 AI 可能被归为高风险
        - EU / EEA
        - 2024 年 8 月生效；高风险条款到 2026 年逐步适用
        - 中高 — 可在出错时造成服务中断的自主基础设施智能体可能符合条件
        - 高 — 合格评定、技术文档、人类监督要求、EU AI 数据库登记；不合规罚款最高 €30M 或全球收入的 6%
        - Resolve AI 的 RBAC 和审批门禁部分覆盖监督要求；未发布正式合格声明
        - 高 — 合规路线图未披露；先发者分类责任未解决
        - 获取 Article 6 / Annex III 适用性的法律分析；要求 EU AI Act 合规路线图；确认计划合格声明时间表
      - - GDPR — EU 客户遥测摄取的数据处理义务
        - EU / EEA 和跨境
        - 已生效；任何 EU 客户数据立即适用
        - 高 — 客户群中有已确认 EU 客户（MSCI、在 EU 运营的 Zscaler）
        - 中高 — DPA 义务、跨境传输机制（SCCs 或 BCRs）、运营日志数据可能涉及的数据主体访问请求处理
        - 信任中心确认 GDPR 合规；Resolve Satellite 为敏感客户限制数据外流
        - 中 — DPA 模板和跨境传输机制未公开披露；子处理方名单未发布
        - 要求已签署 DPA 模板；验证跨大西洋传输的 SCCs 或 BCRs；索取子处理方名单和数据保留计划
      - - NIST AI Risk Management Framework（AI RMF 1.0）— 企业采购要求
        - 美国（自愿；事实上的采购门槛）
        - 2023 年 1 月发布；企业 CISO 供应商评估中越来越常被要求
        - 高 — 据 CISA 指引，企业安全团队在 AI 供应商评估中引用 NIST AI RMF
        - 中 — 合规文档负担；若 Resolve AI 没有自评，采购可能被卡住
        - Resolve AI 未公开记录 NIST AI RMF 对齐情况；SOC 2 覆盖控制，不覆盖 AI RMF 的 GOVERN/MAP/MEASURE/MANAGE
        - 中 — 缺少公开 NIST AI RMF 自评会拖慢大型账户目标的企业采购
        - 要求 Resolve AI 的 NIST AI RMF 自评或对齐文档；评估与 GOVERN/MAP/MEASURE/MANAGE 功能的差距
      - - FTC AI 监管和自动化决策问责（Section 5 执法姿态）
        - 美国
        - 2023 年 6 月宣布主动执法姿态；FTC 持续监测 AI
        - 中低 — 在出现有记录且规模化的客户损害事件前，暂无直接产品责任
        - 中 — 若自主修复造成重大客户服务中断并引发 FTC 调查，会带来声誉和执法风险
        - 服务条款和 MSA 赔偿框架未公开审阅；自主动作场景下的责任分配未知
        - 中低 — 风险随自主修复采用度扩大而放大，并随更高知名度客户事件而上升
        - 审阅 MSA 赔偿、责任限制和 AI 动作 SLA 条款；确认智能体造成宕机时的合同风险分配
    enumerationScope:
      coverage: partial
      basis: >-
        Regulatory frameworks applicable to autonomous AI production-operations systems operating in US and EU
        jurisdictions, assessed against Resolve AI's June 2026 product surface and public compliance disclosures; does
        not cover all emerging US state AI laws or sector-specific regulations (HIPAA AI, banking AI)
    claimRefs:
