      - number: '7.4'
        title: 竞争替代与平台捆绑风险
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 面对三条正在汇合的威胁：hyperscaler 原生 AIOps 功能、成熟可观测性平台的扩展，以及新兴 AI SRE 初创公司。AWS DevOps Guru 是 Amazon 原生、由
              ML 驱动的运营洞察服务，原生集成 CloudWatch 和 CodeGuru；它可纳入现有 AWS 企业支持合同，对既有 AWS 客户没有单独采购门槛。Azure Monitor 的 AIOps
              能力用机器学习做告警关联、异常检测和智能告警分组，并捆绑在既有 Azure 基础设施协议中。Google Cloud 的 Gemini Cloud Assist 在 Google Cloud Console
              中提供对话式 AI 云运营支持，是标准平台功能。这些 hyperscaler 产品没有 Resolve AI 的多 agent
              自主调查那么成熟，但对主要押注单一云厂商的企业账户而言，它们是「够用」的替代方案，不需要增量采购预算、安全审查或供应商上线。Datadog Bits AI 于 2024 年推出，把生成式 AI DevOps
              copilot 直接嵌入 Datadog 平台，覆盖日志分析、告警总结和修复建议——对 Datadog 庞大企业客户装机盘，直接切入 Resolve AI 的核心用例。风险是结构性的：企业 CIO
              偏好供应商整合，来自既有标准化平台的捆绑 AI 功能不需要增量采购周期。Datadog（FY2025 收入 $2.68B）和 PagerDuty（FY2026 收入 $1.17B+）拥有巨大的 incumbent
              分发优势，也有能力以接近零增量成本捆绑 AI 功能，侵蚀 Resolve AI 在已标准化任一平台的大客户中的可服务市场。
