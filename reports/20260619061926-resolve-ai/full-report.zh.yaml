      - number: '7.2'
        title: 安全、权限与爆炸半径风险
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 的标准企业集成需要生产级 API 权限，接入客户代码仓库、基础设施 API（AWS、Kubernetes）、可观测性平台和通信工具（Slack、MS
              Teams）。一个对这些系统拥有读写权限的 agent，爆炸半径风险显著高于传统只读 SRE 监控工具。若 Resolve AI agent 因提示注入、供应链攻击或 LLM
              提供商配置错误而被攻破，攻击者可能借其生产凭证外泄遥测数据、修改基础设施，或大规模执行任意代码。OWASP 2025 版 LLM Top 10
              明确把「过度代理权」、「不安全插件设计」和「提示注入」列为拥有系统访问权的自主 AI agent 最高风险漏洞类别。Resolve AI 用 SOC 2 Type II 认证、RBAC
              控制、传输和静态加密，以及面向要求最小化数据外流客户的本地网关 Resolve Satellite 来缓解风险。但 SOC 2 Type II 证明的是组织控制流程，不证明 AI agent
              动作正确，也不证明自主修复的权限范围完整。CISA 的 AI 安全指南建议组织对 AI agent 套用最小权限原则，并在授予生产写权限前做对抗性红队测试——这些要求会增加采购摩擦，也限制 Resolve AI
              最强自主功能默认开启。客户安全团队必须在部署前独立界定并批准每个集成的权限面，企业上线流程因此多出数周，CAC 也随之上升。
