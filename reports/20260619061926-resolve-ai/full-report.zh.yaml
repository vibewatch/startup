      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
    notes: 严重性和可能性为定性评估；Resolve AI 未发布正式监管风险登记表。随着 EU AI Act 执行法案在 2026 年最终确定，剩余敞口可能变化。
