            body: >-
              Resolve AI 未公开披露收入、ARR、GMV 或任何财务牵引指标。客户案例提供了运营代理指标，对 ROI 建模有价值，但不能替代经审计财务披露。Coinbase 报告事故调查时间下降
              72%，常规事故找到可能根因的中位时间低于 10 分钟，每周工程师会话超过 250 次。Zscaler 报告每起事故所需工程师减少 30%——这是直接的人力杠杆指标，按每名 SRE 每年
              $300,000–450,000 的全成本，可转化为可释放的 SRE 产能。DoorDash Ads 记录特定事故中根因定位时间最多缩短 87%，其中一个案例将调查从 40 分钟压缩到 1
              分钟以内，并估计每起更快解决的关键事故可保住 $200,000 潜在收入。DoorDash 也评估并放弃自建同类系统，结论是需要数十名专职工程师——这一隐含自建成本锚点，让 Resolve AI
              的订阅相对显得资本效率更高。

              这些结果说明，面向企业买家的 ROI 故事很强，也支撑溢价定价能力，但单位经济仍不透明。ACV、CAC、回收期、LTV 和 NRR 均未披露。Coinbase（100+ 名工程师、每周 250+ 会话）和
              DoorDash（事故期间 50+ 名工程师参与）的扩张信号显示，平台能在账户内带来席位扩张和用量增长——这符合企业软件高 NRR 的特征——但公司没有发布 NRR 数字。客户数量和账户集中度也未披露；若少数
