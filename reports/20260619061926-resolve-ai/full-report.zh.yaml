      - number: '1.5'
        title: 里程碑、增长路径与负面信号
        blocks:
          - type: paragraph
            body: >-
              Resolve AI 从创立到 $1.5 billion 估值只用了两年，即便按 2024–2026 年 AI 融资标准看也很突出。这些里程碑同时反映融资速度和来自一线企业部署的 product-market
              fit 信号。公司于 2024 年初隐身启动，并在 2026 年 2 月 Series A 约 16 个月前公开亮相——意味着其隐身退出大约发生在 2024 年 10 月。

              Resolve AI 运营期间，竞争格局明显升温。Datadog 于 2025 年 6 月将 Bits AI SRE 推向 GA；PagerDuty 于 2026 年 Q2 推出早期访问版 SRE
              Agent；AWS 发布 DevOps Agent，并发布案例研究称 MTTR 降低 77%；New Relic 于 2026 年 2 月推出 SRE Agent 预览版；incident.io 称其 AI
              SRE 可自主处理 80% 的初始事故响应。这些既有厂商带着已有数据资产、深嵌企业合同和捆绑定价入场，在总拥有成本层面可能压低独立 AI SRE 工具。2026 年 6
              月，一份独立买方比较（Fundesk.io）评估了六个领先 AI SRE 平台——Datadog、PagerDuty、New Relic、AWS、incident.io 和一个开源选项——但未纳入 Resolve
              AI，显示这家初创公司的心智占有率相对成熟可观测性厂商仍有限。

              Resolve AI Labs 于 2026 年 4
              月启动，释放出向专有领域模型转向的战略信号，也承认通用基础模型不足以覆盖生产环境。这会提高资本强度和执行风险；但如果研究项目成功，也可能形成更持久的竞争护城河。生产环境中的 AI
              准确性、幻觉和可靠性风险，仍是整个品类的重大技术担忧；Resolve AI 具体模型尚未发布独立基准数据。
