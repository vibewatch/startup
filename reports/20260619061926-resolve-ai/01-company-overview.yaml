  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Revenue, ARR, gross margin, net revenue retention, and unit economics are not
        publicly disclosed by this private company. No regulatory filings exist.
      whyItMatters: >-
        Without revenue metrics, valuation-to-revenue multiples cannot be assessed and
        the sustainability and efficiency of growth cannot be evaluated. The $1.5B valuation
        cannot be grounded without ARR data.
      diligencePath: >-
        Request audited financial statements, revenue cohort data, and NRR metrics
        directly from the company as part of formal due diligence.
      relatedQuestionRefs: [QO010]

    - type: missing-source
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        Independent third-party market sizing of the AI SRE and AI for prod addressable market
        with methodology appropriate to Resolve AI's specific positioning and pricing tier.
      whyItMatters: >-
        Without credible SAM/SOM estimates, it is unclear whether the $1.5B valuation
        implies reasonable multiples relative to the available market.
      diligencePath: >-
        Obtain Gartner, Forrester, or IDC AIOps/SRE market reports and triangulate with
        Resolve AI's disclosed customer count and pricing tier.
      relatedQuestionRefs: [QO010]

    - type: private-evidence-only
      severity: material
      topic: ai-model-accuracy
      missingEvidence: >-
        No independent evaluation of Resolve AI's model accuracy, hallucination rates,
        or reliability metrics in production environments has been published. All performance
        data is company-curated from customer case studies.
      whyItMatters: >-
        AI accuracy in production is a material risk; over-reliance on AI-generated root
        cause analysis without ground-truth validation could create liability and erode
        customer trust. Independently measured error rates are unavailable.
      diligencePath: >-
        Request internal accuracy benchmarks, customer-reported false positive/negative
        rates, any red-team or third-party model evaluation reports, and access to
        post-incident accuracy reviews from the company's enterprise deployments.
      relatedQuestionRefs: [QO019]

    - type: missing-source
      severity: minor
      topic: governance
      missingEvidence: >-
        Full board composition beyond named investor board members is not publicly confirmed.
        Independent board members (if any), governance documents, equity ownership table,
        and co-founder vesting schedules are undisclosed.
      whyItMatters: >-
        Key-person dependency on Xanthos is high; board composition and co-founder vesting
        are material inputs to governance risk assessment.
      diligencePath: >-
        Request capitalization table, board minutes, governance documents, and co-founder
        employment and vesting agreement terms during formal diligence.
      relatedQuestionRefs: [QO018]
      relatedTableRefs: [TO002]

    - type: missing-source
      severity: minor
      topic: investors
      missingEvidence: >-
        Equity ownership percentages, pro-rata rights, and exact investment amounts for
        angel investors (Fei-Fei Li, Jeff Dean, Reid Hoffman, Thomas Dohmke, Matt Garman)
        are not publicly disclosed. The full capitalization table is unavailable.
      whyItMatters: >-
        Without ownership data, the investor map table is incomplete; dilution impact on
        founders and early investors cannot be assessed without the cap table.
      diligencePath: >-
        Request the full capitalization table, side letter terms, and investor rights
        agreement from the company during formal diligence.
      relatedQuestionRefs: [QO002]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: minor
      topic: milestones
      missingEvidence: >-
        Internal product milestones—feature GA dates, specific customer onboarding
        timelines, and headcount inflection points—are not publicly disclosed. Only
        financing and launch events are externally confirmed.
      whyItMatters: >-
        The milestone table covers only publicly announced events; product velocity and
        internal execution cadence cannot be independently verified from available sources.
      diligencePath: >-
        Request internal product roadmap, release notes history, and headcount data
