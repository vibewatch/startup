  - id: customer-traction-evidence
    title: Customer Traction and Operational Evidence
    body: >-
      Resolve AI publicly identifies more than 20 enterprise customers as of early 2026,
      concentrated in sectors where production reliability directly affects revenue:
      financial services (Coinbase, MSCI), consumer internet (DoorDash, Blueground),
      enterprise software (Salesforce, MongoDB), and cybersecurity (Zscaler). Early
      deployments at DataStax and Uni were disclosed at the seed round; the customer base
      expanded significantly through 2025.

      Published customer case studies provide quantified outcome data that is atypically
      specific for an early-stage startup—though all metrics are company-curated and have
      not been independently audited. DoorDash's advertising engineering team reduced
      incident investigation time from 40 minutes to approximately 1 minute, an 87%
      improvement, on a platform managing over $1 billion in annual advertising revenue.
      Coinbase reported 72% faster incident investigations, fewer than 10 minutes to
      root cause, and 250+ Resolve AI sessions per week—reflecting deep day-to-day
      operational integration. Zscaler achieved 75% faster root cause identification
      and a 30% reduction in engineers required per incident. Salesforce, which became
      a strategic investor, reported approximately 60% MTTR reduction, 70% faster alert
      triage, and a 30% reduction in investigation time. Meir Amiel, Salesforce's President
      and Chief Trust and Infrastructure Officer, publicly attested that what previously
      took hours now resolves in a fraction of the time.

      Revenue concentration risk (a small number of named enterprise accounts) and the
      absence of independently audited performance data are material diligence gaps.
      Pricing is not publicly disclosed.
