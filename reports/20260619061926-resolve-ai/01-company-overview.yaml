callouts:
  - calloutType: strength
    title: Elite Founder-Market Fit and Exit Track Record
    body: >-
      Xanthos and Agarwal co-created OpenTelemetry—the dominant open-source observability
      standard—and have two prior exits to VMware and Splunk (via Omnition, acquired 2019).
      They built and led Splunk Observability, precisely the domain their AI platform now
      automates. This rare combination of domain expertise, enterprise network, and verified
      exit track record materially de-risks the product thesis and the team's ability to
      sell and close enterprise contracts.
    claimRefs: [CO011, CO012, CO013]

  - calloutType: risk
    title: Intensifying Incumbent Competition in AI SRE
    body: >-
      All major observability and incident management platforms—Datadog (Bits AI SRE, GA June
      2025), PagerDuty (SRE Agent, EA Q2 2026), AWS (DevOps Agent), New Relic (SRE Agent
      preview), and incident.io—now offer competing AI SRE capabilities. These incumbents
      enter with existing data estates, embedded enterprise contracts, and bundled pricing.
      A June 2026 independent Fundesk.io buyer guide evaluated six leading AI SRE platforms
      without including Resolve AI, signaling limited awareness relative to incumbents.
    claimRefs: [CO033, CO034, CO035]

  - calloutType: insight
    title: Salesforce as Both Customer and Strategic Investor
    body: >-
      Salesforce's simultaneous role as a named enterprise customer (reporting ~60% MTTR
      reduction) and a strategic co-investor in the Series A Extension is structurally
      unusual. It compresses commercial validation into an investor conviction signal, but
      also creates dual dependency: if the vendor relationship deteriorates, the investment
      relationship complicates any competitive re-evaluation by Salesforce. Diligence should
      clarify contractual independence between the commercial and investment relationships.
    claimRefs: [CO025, CO030, CO032]

  - calloutType: assumption
    title: Revenue and ARR Unavailable — Diligence Required
    body: >-
      Resolve AI has not disclosed revenue, ARR, gross margin, net revenue retention, or
      unit economics. All financial analysis in this chapter is based on reported funding
      milestones, valuation, and customer-reported operational metrics. Investors must
      request audited financial statements, revenue cohort data, and NRR trends in formal
      diligence before making valuation judgments.
    claimRefs: [CO043]

