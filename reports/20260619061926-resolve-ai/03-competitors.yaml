  - id: feature-pricing-analysis
    title: Feature, Pricing, and Distribution Comparison
    body: >
      Resolve AI's pricing is not publicly disclosed. Based on the funding profile ($190M raised at
      $1.5B valuation) and customer base (Coinbase, Salesforce, Zscaler), the product targets
      enterprise deals unlikely to be self-serve or per-seat. This opacity creates friction in
      competitive evaluations: buyers comparing incident.io's published $15–$45/user/month pricing
      or Datadog's consumption-based rate card cannot benchmark against Resolve AI without entering
      a sales cycle. The Opsgenie shutdown creates an immediate opportunity—thousands of displaced
      teams need a new incident management solution by April 2027—but most will evaluate vendors
      with visible pricing first.

      On capabilities, Resolve AI's multi-agent cross-domain architecture (code + infrastructure +
      observability simultaneously) is its core claim of superiority over both the observability
      incumbents (whose SRE agents are constrained to the telemetry that platform already ingests)
      and the AIOps correlation tools (which surface noise-reduced alerts but do not reason causally
      across layers). The NeuBird AI competitive blog acknowledges that "AI-native platforms built
      around autonomous investigation" represent the leading tier but positions NeuBird—not Resolve
      AI—as the category leader, suggesting the differentiation narrative remains contested among
      AI-native vendors themselves. Both Traversal and NeuBird claim RCA accuracy metrics of
      80–92%, while Resolve AI claims >70% MTTR improvement but does not publish an RCA accuracy
      rate, a potential disclosure gap when buyers compare vendors.

      Distribution is a material moat factor. PagerDuty and Datadog sell through established
      enterprise channels and renewal cycles; NeuBird has hyperscaler channel agreements with
      AWS and Microsoft; incident.io has aggressive sales investment post-Series B. Resolve AI's
      Lightspeed and Greylock investor networks provide go-to-market support but not a pre-existing
      installed base. The enterprise buyer for autonomous SRE tooling tends to be VP Engineering or
      Head of SRE, not a procurement buyer, which favors product-led evaluation over channel-led
      distribution—Resolve AI's strength.
