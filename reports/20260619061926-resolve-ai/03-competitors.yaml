  - id: ai-native-sre-peers
    title: AI-Native SRE Peers
    body: >
      Traversal is the most direct funded peer. Founded in 2023 and headquartered in New York, Traversal
      raised a $53 million Series A in early 2026, with subsequent strategic investment from Amex Ventures.
      The platform's Production World Model™ and Causal Search Engine™ evaluate thousands of candidate root
      causes simultaneously rather than sequentially—a parallel hypothesis architecture conceptually similar
      to Resolve AI's multi-agent approach. Traversal counts PepsiCo (32% MTTR reduction), DigitalOcean
      (70% MTTR reduction), and Cloudways (95%+ self-healing accuracy) among disclosed enterprise customers.
      The company claims 80–82% RCA accuracy and was named to the Redpoint 2026 InfraRed 100. Traversal
      explicitly positions itself as "the first and only AI SRE validated within the Fortune 100," which
      directly challenges Resolve AI's enterprise differentiation story. Traversal is Sequoia-backed.

      NeuBird AI raised a $19.3 million oversubscribed additional round in April 2026, bringing total
      funding to approximately $64 million. Investors include Xora Innovation (lead), Mayfield, StepStone
      Group, Prosperity7 Ventures, and M12, Microsoft's venture fund. NeuBird's Hawkeye agent performs
      autonomous root cause analysis; its Falcon agent introduces predictive risk detection to prevent
      incidents before alerts fire. The platform has reportedly resolved over 1 million production alerts
      with up to 90% MTTR reduction, and has earned the AWS Generative AI Competency in both Applications
      and Infrastructure categories. NeuBird's Microsoft and AWS partnerships provide preferred access to
      enterprise customer networks that Resolve AI must compete against without equivalent hyperscaler
      channel agreements.

      Incident.io raised $62 million in Series B funding (April 2025, led by Insight Partners) with
      total funding exceeding $96 million. Founded in 2021 by ex-Monzo engineers, it serves Netflix,
      Linear, Ramp, and Etsy. Incident.io's AI SRE handles the first 80% of incident response
      autonomously—investigating alerts, surfacing root causes, generating fix PRs from Slack, and
      auto-generating compliance evidence. Its pricing model ($15–$45/user/month all-in) is transparent
      and bundled, a direct contrast to PagerDuty's add-on pricing and to Resolve AI's undisclosed custom
      pricing. Incident.io is actively targeting Opsgenie customers displaced by the April 2027 EOL.
