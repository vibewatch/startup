  - id: moat-risk-displacement
    title: Moat Durability, Displacement Risk, and Adverse Evidence
    body: >
      Resolve AI's primary moat claim is multi-domain reasoning across code, infrastructure, and
      telemetry simultaneously—distinct from observability platforms (single-telemetry stack) and
      AIOps tools (correlation only). A secondary moat is the per-customer production model it
      builds over time: as the platform captures runbooks, tribal knowledge, and org-specific
      incident patterns, the accuracy and speed advantage compounds. This creates switching cost
      for existing customers: moving to a competitor means retraining on organizational context
      from scratch. The Beri.net analysis notes Resolve AI is hiring Dhruv Mahajan (formerly Meta
      Llama post-training lead) as Chief AI Scientist, signaling intent to train domain-specific
      production models—a moat strategy that would be expensive for competitors to replicate.

      However, three displacement risks are material. First, Datadog's and Dynatrace's distribution
      advantages: when an enterprise already contracts $200K+/year with an observability platform,
      the economic and organizational hurdle to evaluate a standalone SRE agent is high. Incumbents
      can bundle autonomous investigation into renewal conversations without triggering a new
      procurement evaluation. Second, the category has at least three well-funded AI-native peers
      (Traversal $53M+, NeuBird $64M+, incident.io $96M+) all competing for the same engineering
      teams, and all making similar claims about MTTR reduction and autonomous investigation.
      Differentiation at the marketing level risks commoditizing before any vendor achieves
      definitive enterprise scale. Third, pricing opacity is an adverse signal: buyers who cannot
      benchmark Resolve AI's cost against incident.io's published $15–$45/user/month pricing may
      default to the transparent alternative during evaluation.

      Adverse evidence and unknown risks: NeuBird AI's vendor-authored competitive review
      positions NeuBird as "the strongest pick" for production ops AI without independently
      validating Resolve AI's claims, suggesting competing narratives in the analyst community.
      AI SRE platforms broadly face hallucination risk when operating on sparse or ambiguous
      telemetry—automated wrong remediation (e.g., restarting healthy services, rolling back
      non-causal deploys) can compound incidents rather than resolve them. No vendor, including
      Resolve AI, has published an independent third-party audit of autonomous remediation
      accuracy or failure-mode analysis, leaving enterprise buyers to rely on vendor-provided
      case studies.
    claimRefs:
      - CP033
      - CP035
      - CP039
    tableRefs:
      - TP004
    figureRefs:
      - FP003

