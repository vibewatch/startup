company:
  name: Resolve AI
chapter:
  number: 3
  title: Competitors
  summary: >
    The autonomous AI SRE market divides into three tiers: AI-native SRE startups (Traversal, NeuBird AI,
    incident.io) that most directly replicate Resolve AI's thesis; observability incumbents (Datadog Bits AI,
    Dynatrace Davis AI) deploying agentic layers atop existing platform relationships; and legacy alert/on-call
    platforms (PagerDuty, BigPanda) offering AI as expensive add-ons. Resolve AI's multi-agent cross-domain
    reasoning differentiates it from correlation-only AIOps, but Datadog's 30,500-customer distribution and
    Traversal's Fortune 100 validation represent the clearest displacement risks before Resolve achieves scale.

sections:
  - id: competitive-landscape
    title: Competitive Landscape and Category Map
    body: >
      The autonomous AI SRE category emerges from the convergence of three prior markets: AIOps (ML-driven
      alert noise reduction), observability (telemetry collection and dashboarding), and incident management
      (on-call, escalation, postmortem). Resolve AI occupies the highest-autonomy tier: a multi-agent system
      that operates across code repositories, infrastructure, and observability tools to investigate and
      resolve incidents without human intervention for the majority of alerts. Vendors active in adjacent
      tiers are converging toward this point at different speeds and from different entry angles.

      Direct AI-native peers—Traversal, NeuBird AI, and incident.io—are Resolve AI's most analogous
      competitors: all raised material venture funding in 2025–2026, all focus on autonomous investigation
      rather than mere correlation, and all target engineering-led enterprises with complex distributed
      systems. The incumbent observability platforms (Datadog, Dynatrace) add autonomous agents as platform
      extensions, leveraging existing customer relationships and telemetry ingestion but constrained by
      their platform-centric architectures. Legacy incident management platforms (PagerDuty) and AIOps
      vendors (BigPanda) have added AI layers but stop short of true root-cause investigation. The status
      quo—manual war rooms, bespoke runbooks, and custom alert routing—remains the largest implicit
      competitor for budget at organizations that lack the engineering maturity to evaluate dedicated
      autonomous SRE tooling.

      An important category delineation: a genuine AI SRE agent must perform autonomous alert triage,
      context fetch across multiple telemetry sources, hypothesis formation, a causal root-cause narrative,
      and draft or execute remediation. Tools that only perform alert correlation (BigPanda) or dashboard
      summarization (legacy AIOps) do not meet this bar.
    claimRefs:
      - CP001
      - CP016
      - CP027
      - CP028
      - CP032
      - CP033
