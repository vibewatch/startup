  - id: incumbent-platform-threats
    title: Incumbent and Platform Threats
    body: >
      Datadog is the most formidable incumbent threat. The company launched Bits AI SRE as its first
      generally available AI agent at DASH 2026, tested across 2,000+ customer environments before GA.
      Datadog's 30,500+ enterprise customers and 2,000+ pre-built integrations create distribution
      advantages no AI-native startup can replicate. When an enterprise already sends all telemetry to
      Datadog, the internal switching cost to evaluate a standalone AI SRE is non-trivial: it requires
      either replicating the Datadog data connection into a new platform or accepting Bits AI as a
      cost-effective incremental upgrade. Bits AI SRE includes RBAC, HIPAA-ready compliance, and
      enterprise AI governance, matching Resolve AI's security posture. The main limitation is platform
      coupling: Bits AI's depth of investigation depends on what Datadog already observes, and multi-cloud
      or multi-vendor telemetry architectures reduce its effectiveness.

      Dynatrace launched Dynatrace Intelligence at its Perform 2026 conference, fusing deterministic AI
      (via its Smartscape dependency graph and Grail data lakehouse) with agentic AI. Dynatrace benchmarks
      show 12x more problems solved, 3x faster resolution, and half the cost when deterministic and agentic
      AI are combined versus pure agentic approaches. The Cloud SRE Agents product orchestrates AWS, Azure,
      and GCP native agents—routing incidents to hyperscaler agents in parallel and reporting findings back
      to a unified Dynatrace view. The full-stack list price is $0.01/memory-GiB-hour; enterprise contracts
      typically run $182,000–$250,000 per year. Dynatrace targets complex multi-cloud enterprise environments
      where its real-time topology graph provides causal depth that pure-LLM approaches lack.

      PagerDuty has served over 28,000 organizations as the de facto on-call routing platform. Its Spring
      2026 release embedded an SRE Agent directly into escalation policies. However, AI features are charged
      as a flat add-on of $699–$1,114 per month on top of base licensing ($21–$41/user/month), which a
      competitor pricing analysis characterizes as creating hidden costs that can double TCO. BigPanda uses
      ML-based event correlation to reduce alert noise by 90–99% in large enterprise IT Ops environments,
      but explicitly stops at correlation and enrichment rather than performing autonomous root-cause
      investigation. BigPanda custom pricing ranges from approximately $500/month for small deployments to
      $40,000+/month at enterprise scale.
