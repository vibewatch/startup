callouts:
  - calloutType: risk
    title: Platform Bundling Is the Highest-Priority Displacement Risk
    body: >
      Datadog's 30,500-customer base and Dynatrace's consumption-priced observability platform can
      extend autonomous SRE as a contract renewal line item, bypassing competitive evaluation entirely.
      Resolve AI must demonstrate investigation depth superiority that justifies a net-new deployment
      alongside—not instead of—an existing observability platform.
    claimRefs:
      - CP031
      - CP033
  - calloutType: insight
    title: Pricing Opacity Is a Sales-Cycle Liability Against Transparent Competitors
    body: >
      Incident.io's published $15–$45/user/month all-in pricing creates a concrete anchor that
      Resolve AI's undisclosed custom pricing cannot compete with in early-stage enterprise evaluations.
      Buyers displaced by the Opsgenie sunset in April 2027 will tend to shortlist vendors with
      visible pricing first.
    claimRefs:
      - CP020
      - CP034
      - CP037
  - calloutType: strength
    title: Founder Expertise and Production Model Create a Compounding Data Moat
    body: >
      Resolve AI's founders (former Splunk/SignalFx executives) built the observability data category
      the platform now reasons over. Combined with per-customer institutional knowledge capture,
      each new incident processed compounds the organization-specific advantage—a switching cost that
      grows over time if retention is high.
    claimRefs:
      - CP003
      - CP035

