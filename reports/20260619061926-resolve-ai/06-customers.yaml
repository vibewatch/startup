company:
  name: Resolve AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Resolve AI publicly identifies seven confirmed enterprise customers—Coinbase, DoorDash,
    Zscaler, Salesforce, Blueground, Snowflake (confirmed June 2026), and an unnamed cohort—
    with five vendor-curated case studies that document incident investigation speedups of
    60–87%. The ideal customer profile is a mid-to-large enterprise engineering organization
    processing ≥50K monthly alerts across 50–100+ SREs, concentrated in fintech, cybersecurity
    SaaS, and data-intensive platforms. All five published case studies are company-produced
    without independent verification. MongoDB and MSCI are publicly named as customers but
    lack any published case study. No net revenue retention, gross revenue retention, or
    customer churn data is publicly disclosed. Salesforce's dual role as investor and customer
    introduces a material credibility caveat. The most significant go-to-market risk is
    evidence thinness: only seven publicly named logos against a claimed 20+ customer count,
    all benchmark data company-curated, and zero third-party-verified deployments.

sections:
  - id: icp-segmentation
    title: Ideal Customer Profile and Market Segmentation
    body: >-
      Resolve AI's publicly named customer cohort reveals a clear ideal customer profile (ICP):
      large enterprises with high-volume, high-stakes production environments managed by
      substantial SRE organizations. The five published case study customers—DoorDash (consumer
      internet/logistics), Coinbase (crypto exchange), Zscaler (cybersecurity SaaS), Salesforce
      (enterprise CRM/cloud), and Blueground (proptech)—share several structural characteristics:
      operations that generate tens of thousands to hundreds of thousands of monthly alerts,
      engineering teams of 50+ SREs, and business models where production downtime directly
      affects revenue or regulatory compliance. Zscaler's case study explicitly references 150K+
      monthly alerts and ~120 escalating to incidents per month, suggesting a minimum viable
      deployment environment is one generating significant alert noise above which AI triage
      delivers clear ROI.

      The buyer persona is most clearly articulated in the DoorDash and Coinbase deployments:
      a VP or Director of Engineering or Site Reliability Engineering who owns incident response
      SLAs and is looking to reduce mean-time-to-resolve and SRE toil. The DoorDash VP of
      Engineering (Alex Danilychev) is the most prominent named executive reference, attesting
      that Resolve AI "elevated our team's performance beyond what any individual person could
      accomplish alone." The Salesforce President and Chief Trust and Infrastructure Officer
      (Meir Amiel) represents the most senior executive endorsement, though that relationship
      carries a conflict of interest given Salesforce Ventures' co-investment in Resolve AI's
      Series A Extension.

      Vertical distribution across named customers spans fintech (Coinbase, MSCI), consumer
      internet (DoorDash, Blueground), cybersecurity SaaS (Zscaler), enterprise software
      (Salesforce, MongoDB), and data cloud (Snowflake), suggesting a deliberately horizontal
      go-to-market approach rather than vertical specialization. Early seed-stage customers
      included DataStax (data infrastructure), Uni (startup), and Blueground (proptech),
      indicating that the product's applicability was validated across size and vertical before
      scaling to hyperscaler accounts.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs: [TU001]
    figureRefs: [FU003]

  - id: named-customers
    title: Named Customers and Published Case Study Evidence
    body: >-
      Resolve AI's customer evidence base consists of five published, vendor-curated case studies
      and two additional named customers (MongoDB, MSCI) with no published proof, plus Snowflake
      confirmed as a customer in a June 2026 press release without a dedicated case study. The
      five case studies provide quantified operational outcomes that are unusually specific for
      an early-stage enterprise AI vendor—though all metrics are company-reported and have not
      been independently audited or verified by a third party.

      DoorDash (consumer internet): Deployed mid-2025 for the advertising engineering team,
      which manages over $1 billion in annual advertising revenue. Resolve AI delivered up to
      87% reduction in time-to-resolve-category (TTRC), cutting investigation time from 40
      minutes to approximately one minute on benchmark incidents. DoorDash also reports 2x
      higher RCA accuracy compared to an evaluated alternative. VP Engineering Alex Danilychev
      provided an on-record executive endorsement.

      Coinbase (fintech/crypto): Deployed across a team of 100+ engineers operating a 24/7
      financial exchange where downtime triggers immediate financial and reputational risk.
      Investigation time decreased by 72%, with sub-10-minute time to root cause on routine
      incidents. The platform logs 250+ Resolve AI sessions per week, reflecting deep
      operational integration rather than pilot-level engagement.

      Zscaler (cybersecurity SaaS): Processes 150K+ monthly alerts with ~120 escalating to
      incidents per month. Resolve AI reduced root cause identification speed by 75% and
      reduced engineers required per incident by 30%+. This is the largest alert-volume
      deployment documented in any published case study.

      Salesforce (enterprise SaaS/CRM): Achieved approximately 60% MTTR reduction and 70%
      faster alert triage, including a documented 10-minute RCA in one high-severity case.
      Meir Amiel provided an executive quote. Salesforce is simultaneously a strategic investor
      (Salesforce Ventures co-led the April 2026 Series A Extension), a conflict of interest
      that warrants independent corroboration.

      Blueground (proptech): The only non-tech-sector named customer in the published cohort,
      Blueground reduced root cause analysis time from 20 minutes to under 5 minutes (a 4x
      improvement). Its inclusion demonstrates platform applicability beyond hyperscaler fintech,
      though its engineering scale is materially smaller than the other named accounts.

      Snowflake (data cloud, NYSE: SNOW): Confirmed in the June 2, 2026 Snowflake Summit
      press release. Snowflake engineering teams use Resolve AI "to run and manage production
      systems at scale." Separately, Snowflake signed a multi-million-dollar, two-year contract
      for Resolve AI to use Snowflake Cortex Training for reinforcement learning training of
      its production AI agents, making Snowflake simultaneously a customer and a training
      infrastructure partner.
