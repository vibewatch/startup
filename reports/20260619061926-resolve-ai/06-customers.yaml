callouts:
  - calloutType: strength
    title: Unusually Specific Outcome Metrics for an Early-Stage Vendor
    body: >-
      Resolve AI's five published case studies contain quantified, named-customer metrics
      (87% TTRC reduction at DoorDash; 72% investigation time reduction at Coinbase; 75% RCA
      speed at Zscaler) that are rare specificity for a company less than two years from founding.
      Two of the five feature named executive quotes, including a C-level reference from Salesforce.
      The Coinbase deployment—250+ weekly AI sessions across 100+ engineers at a regulated crypto
      exchange—represents the most quantitatively documented enterprise AI SRE deployment on
      record. While all metrics are vendor-curated and unverified, their specificity signals
      genuine operational integration at tier-1 accounts rather than surface-level pilots.
    claimRefs: [CU010, CU012, CU013, CU014, CU015, CU016, CU018]

  - calloutType: risk
    title: Zero Third-Party Verified Deployments and Review Platform Absence
    body: >-
      All five published case studies are company-produced marketing materials. No independent
      audit, third-party case study, or verified customer outcome has been published by any
      analyst firm, enterprise customer's IR team, or neutral publication. G2, Gartner Peer
      Insights, and ProductHunt yielded no accessible Resolve AI reviews as of June 2026.
      Fundesk.io's buyer guide explicitly excluded Resolve AI from its six-platform comparison,
      suggesting limited mindshare in the independent analyst community relative to incumbents
      like Datadog and PagerDuty. Any diligence process must treat all case study metrics
      as company-claimed rather than confirmed, and should assume a 30–50% outcome gap
      relative to vendor-reported benchmarks.
    claimRefs: [CU028, CU031, CU035]

  - calloutType: risk
    title: Salesforce Dual Role Creates Structural Credibility Risk
    body: >-
      Salesforce occupies an unusual dual position as both a named enterprise customer (with an
      executive quote from Meir Amiel, President and Chief Trust and Infrastructure Officer) and
      a strategic co-investor (Salesforce Ventures co-led the April 2026 Series A Extension).
      This compound relationship compresses commercial validation and investment conviction into
      a single reference, but also creates a structural incentive for Salesforce's case study
      metrics to reflect optimistic outcomes. No independent corroboration of the Salesforce
      MTTR or alert triage figures exists. Diligence should include direct conversation with
      Salesforce engineering leadership, independent of the investment relationship, to validate
      the operational improvements cited in the case study.
    claimRefs: [CU019, CU030]

  - calloutType: assumption
    title: '"20+ Customers" Concentration Risk Is Unquantifiable Without ARR Data'
    body: >-
      Resolve AI's claimed "20+ enterprise customers" as of February 2026 cannot be evaluated
      for revenue concentration without ARR data. It is possible that 80%+ of ARR is concentrated
      in two to three anchor accounts (Coinbase, DoorDash, Salesforce), a common pattern at
      early-stage enterprise companies. With seven publicly named accounts and 13+ unnamed,
      and no price-per-seat or annual contract value data disclosed, the revenue distribution
      is entirely opaque. Investors must request cohort ARR data, customer contract sizes, and
      logo-level retention statistics before assessing concentration risk.
    claimRefs: [CU006, CU032]

