  - id: deployment-expansion
    title: Deployment Motion and Customer Expansion Patterns
    body: >-
      Resolve AI's customer case studies reveal a consistent deployment arc: customers begin
      with read-only investigation workflows and progressively expand AI agent autonomy as trust
      is established. The typical path begins with alert triage and root cause investigation in
      observation mode—agents surface findings without taking action—before advancing to a
      co-pilot stage in which agents propose actions for human approval. As confidence grows,
      customers grant supervised autonomous access for predefined incident classes, and eventually
      full autonomous operation for well-understood failure modes.

      The Coinbase deployment is the clearest proxy for the expansion model: starting from an
      initial pilot, the deployment grew to 100+ engineers actively using the platform with 250+
      weekly AI sessions—a metric that implies daily operational dependency rather than
      experimental usage. DoorDash's deployment similarly scaled to a 50+ engineer team and
      multi-use-case scope including on-call, investigation, and operational workflows. This
      pilot-to-full-deployment expansion pattern suggests strong product stickiness once
      engineers are integrated into the agent-assisted workflow.

      Resolve AI's product supports multiple workflow entry points: the on-call delegation
      module for alert triage, the incident investigation module for collaborative root cause
      analysis, and the operational tasks module for scheduled or triggered workflows. This
      modular structure enables land-and-expand within a single enterprise: initial deployment
      in one SRE team's incident workflow can expand to additional teams, additional alert
      sources, and eventually autonomous remediation as risk tolerance increases.

      The April 2026 launch of Resolve AI Labs and the Snowflake Cortex Training partnership
      signal a strategic investment in reinforcement learning–based models trained on production
      incident data, which would increase platform stickiness by making each customer's model
      incrementally more accurate over time—a potential compounding retention advantage.
      However, no cohort data, ARR expansion metrics, or documented land-and-expand revenue
      trajectories have been disclosed. The expansion story is inferred from usage volume
      proxies (session counts, engineer headcount on platform) rather than from financial
      retention data.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
    figureRefs: [FU001, FU002]

  - id: retention-nrr
    title: Retention Signals and NRR Evidence Gaps
    body: >-
      Resolve AI's retention and revenue expansion story cannot be independently assessed from
      public information. The company has not disclosed net revenue retention (NRR), gross
      revenue retention (GRR), customer churn rates, logo retention statistics, or any financial
      metrics related to customer expansion over time. As a private company with no regulatory
      filing requirements, this absence is structurally expected—but it remains a material
      evidence gap for investors evaluating the sustainability of early ARR.

      Several indirect signals suggest product stickiness. Coinbase's 250+ weekly AI sessions
      across 100+ engineers indicates deep operational integration unlikely to be reversed in a
      short-cycle contract evaluation. DoorDash's 50+ engineer deployment, sustained since
      mid-2025, similarly implies renewal-grade usage rather than pilot engagement. No case
      study mentions any customer departing from the platform or reverting to manual processes
      after initial deployment. However, the absence of churn is not equivalent to confirmed
      retention: these case studies are company-curated and inherently survivor-biased—they
      represent deployments the company chose to publicize, not a representative cross-section
      of outcomes.

      The DORA 2025 State of AI-Assisted Software Development report provides a relevant
      industry signal: AI tools that are deeply integrated into daily engineering workflows—
      particularly those involved in post-deployment safety and reliability—demonstrate
      significantly higher stickiness than tools used episodically or for experimentation.
      Resolve AI's design as a persistent runtime agent (rather than a query-on-demand tool)
      structurally positions it for high retention once deployed, but this thesis cannot be
      confirmed without ARR cohort data or independent customer surveys.

      Review platform evidence is entirely absent: G2, Gartner Peer Insights, ProductHunt,
      and Reddit's r/sre community yielded no accessible Resolve AI reviews as of June 2026,
      consistent with the product's October 2024 launch date and limited time in the market
      to accumulate third-party review volume. This gap is expected rather than alarming at
      this stage, but it prevents any systematic net promoter score or customer satisfaction
      inference.
    claimRefs:
      - CU027
      - CU028
      - CU031
      - CU033
      - CU034
    tableRefs: [TU004]

  - id: concentration-adverse-risks
    title: Customer Concentration and Adverse Adoption Risks
    body: >-
      Resolve AI's customer evidence exhibits several material risks that potential investors
      and enterprise buyers should assess carefully. The most significant is customer
      concentration: with only seven publicly named enterprise accounts against a claimed 20+
      total, and no ARR breakdown, the revenue base could be dangerously concentrated in two
      to three anchor logos. If Coinbase, DoorDash, or Salesforce represent a disproportionate
      share of ARR—a common pattern in early-stage enterprise companies—logo churn at a single
      account could materially impact revenue.

      Proof quality risk is the second major concern. All five published case studies are
      produced and curated by Resolve AI, without independent verification from the customers'
      finance or engineering teams, and without third-party audit. Fundesk.io's 2026 buyer
      guide explicitly warns enterprise procurement teams that "vendor benchmarks are not your
      benchmarks"—advising buyers to demand glass-box auditability and assume 30-50% performance
      degradation in customer-specific environments relative to vendor-published benchmarks.
      The DORA 2025 report similarly found that AI tools amplify existing practices more than
      they correct broken processes, suggesting enterprises without mature SRE foundations may
      not replicate the outcomes reported by Coinbase or Zscaler.

      The Salesforce conflict-of-interest risk is unique among the named customer set:
      Salesforce Ventures co-invested in the Series A Extension in April 2026, the same period
      in which Salesforce's case study metrics appeared in promotional materials. While Meir
      Amiel's quote is genuine, the compound relationship—Salesforce as customer, as investor,
      and as reference—means that adverse findings in Salesforce's deployment would be less
      likely to surface publicly than adverse findings at an independent customer account.

      Autonomous remediation acceptance is a structural adoption barrier. The beri.net
      analysis identifies the "trust-and-blast-radius" problem: enterprises willing to grant
      AI agents read-only investigation access are not necessarily willing to grant autonomous
      production write access. The transition from co-pilot to autonomous mode requires
      regulatory review, security team sign-off, and executive-level approval in most
      enterprises, extending sales cycles and limiting the pace of platform adoption at
      risk-averse accounts such as regulated financial services firms.

      Finally, MongoDB and MSCI are both named in Resolve AI's press materials as enterprise
      customers, but neither has a published case study as of June 2026, and the company has
      not confirmed deployment scope or active status for either account. Their inclusion in
      named customer lists without corroborating evidence leaves their status as unverifiable
      from public sources.
    claimRefs:
