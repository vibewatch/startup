  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Net revenue retention (NRR), gross revenue retention (GRR), customer churn rate, logo
        retention statistics, and cohort ARR expansion data are not publicly disclosed. No
        financial retention metric of any kind is available from public sources.
      whyItMatters: >-
        Without NRR or GRR, the sustainability of Resolve AI's ARR growth and the quality of
        its customer relationships cannot be independently assessed. High NRR would validate
        the land-and-expand thesis; low NRR or significant churn would materially change the
        valuation calculus.
      diligencePath: >-
        Request cohort ARR data, NRR trends, logo retention statistics, and customer contract
        renewal rates directly from the company during formal diligence.
      relatedQuestionRefs: [QU010, QU020]
      relatedTableRefs: [TU004]

    - type: missing-source
      severity: material
      topic: customer-proof
      missingEvidence: >-
        No independent, third-party-audited customer case study or deployment verification
        has been published for any Resolve AI account. All five published case studies are
        company-curated and unverified. MongoDB and MSCI have no published case studies at all.
      whyItMatters: >-
        Vendor-curated case study metrics are inherently subject to selection bias and
        optimistic framing. The absence of independent verification means that all quantitative
        claims (87% TTRC, 72% investigation time, etc.) must be treated as company claims
        rather than verified facts.
      diligencePath: >-
        Request permission to speak directly with DoorDash, Coinbase, and Zscaler engineering
        leadership, independent of Resolve AI facilitation. Seek reference calls that include
        specific failure modes, challenges, and areas of underperformance.
      relatedQuestionRefs: [QU011, QU013, QU023]
      relatedTableRefs: [TU003]

    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        No ARR breakdown, contract value range, or logo-level revenue concentration data
        has been disclosed. The 13+ unnamed accounts in the "20+" claimed total are entirely
        opaque; their size, revenue contribution, and deployment status are unknown.
      whyItMatters: >-
        If two or three anchor accounts represent 60–80% of ARR—a common pattern at this
        stage—logo churn at a single enterprise could create a material revenue impact
        disproportionate to the stated customer count.
      diligencePath: >-
        Request cohort ARR by account tier, top-10 customer revenue concentration as a
        percentage of total ARR, and contract term and renewal status for each named account.
      relatedQuestionRefs: [QU009, QU024]
      relatedTableRefs: [TU005]

    - type: missing-source
      severity: minor
      topic: mongodb-msci-deployment
      missingEvidence: >-
        MongoDB and MSCI are named in Resolve AI press materials but have no published case
        studies, executive quotes, or independently verifiable deployment status. Their customer
        pages return placeholder content rather than case study content as of June 2026.
      whyItMatters: >-
        If MongoDB and MSCI are not yet in active deployment (named aspirationally or as
        pilots), the effective enterprise customer count is smaller than implied. Unverified
        named accounts inflate apparent social proof.
      diligencePath: >-
        Request deployment start dates, contract values, and deployment scope for MongoDB
        and MSCI directly from the company during formal diligence.
      relatedQuestionRefs: [QU014]
      relatedTableRefs: [TU003]

