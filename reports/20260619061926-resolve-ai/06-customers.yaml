      severity: minor
      topic: salesforce-independence
      missingEvidence: >-
        No independent corroboration of Salesforce's case study metrics (~60% MTTR, ~70%
        faster triage) exists from any source other than Resolve AI's own marketing materials.
        Salesforce Ventures' investment creates a conflict of interest that standard reference
        checks do not resolve.
      whyItMatters: >-
        If Salesforce's case study metrics are overstated due to the investor relationship,
        the second-most-prominent reference in Resolve AI's public proof kit is compromised.
        The credibility of the highest-profile executive reference (Meir Amiel) would be
