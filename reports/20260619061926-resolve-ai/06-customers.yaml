    - type: private-evidence-only
      severity: minor
      topic: expansion-mechanics
      missingEvidence: >-
        No public documentation from Resolve AI describes the specific product features,
        workflow integrations, or operational milestones that drive expansion from an initial
        pilot deployment to a full cross-team or multi-environment rollout. The blog and
        events pages describe the platform journey at a high level but omit mechanics of
        internal procurement, security review, and governance approval processes.
      whyItMatters: >-
        Understanding expansion mechanics is critical to evaluating land-and-expand ARR
        durability. If expansion is primarily driven by IT/SRE champion relationships rather
