  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-metrics
      missingEvidence: "Quarterly ARR, gross margin by quarter, NRR, burn rate, and customer count with concentration data; these are standard Series B due diligence disclosures not available in public records."
      whyItMatters: "Without these metrics, the $1.5 billion valuation is ununderwritable and the implied revenue multiple spans a 5x range (10x–50x ARR); a formal capital deployment decision cannot be made with confidence."
      diligencePath: "Request from CFO: quarterly ARR waterfall, P&L by quarter with COGS breakdown, 12-month NRR cohort data, top-10 customer ARR list, monthly burn rate, and cap table with preference stack."
      relatedQuestionRefs: [QV007, QV010]

    - type: private-evidence-only
      severity: material
      topic: cap-table
