  - id: comps-and-multiples
    title: Public Comparables and Market Multiples
    body: >
      The observable public-market benchmark range for AI observability and incident operations software
      spans roughly 1.3x to 21.6x trailing revenue as of June 2026, depending on growth rate, gross
      margin quality, and competitive positioning. Datadog is the high-multiple benchmark: Q1 2026 revenue
      of $1.006 billion represented 32% year-over-year growth, non-GAAP gross margin of approximately
      80%, and the market capitalized it at approximately $79.4 billion — implying 21.6x trailing twelve
      months revenue of $3.67 billion. Datadog's multiple is premium because growth is reaccelerating,
      the product is deeply embedded across enterprise cloud infrastructure, and free cash flow is
      substantial at $289 million in Q1 2026 alone. Dynatrace offers a more conservative reference:
      FY2026 revenue of $2.018 billion grew 18.8%, with a market capitalization of approximately
      $12.07 billion — yielding 6x revenue. Dynatrace's multiple reflects lower growth and more
      competition in its core AIOps space. PagerDuty is the adverse cautionary comp: FY2026 revenue
      of $492.6 million grew only 5.4%, ARR was flat year-over-year at $496 million, and the market
      capitalization had compressed to $654 million from a peak of approximately $9 billion — a 93%
      valuation impairment over five years on decelerating growth.


      In private markets, Gong's $300 million ARR milestone (FY2025) against a $7.25 billion Series E
      valuation set in June 2021 illustrates how AI SaaS private multiples have compressed from
      approximately 36x ARR at peak to a much lower implied value today. The AIOps platform market is
      projected to reach $32.4 billion by 2028 at a 22.7% CAGR per MarketsandMarkets, with the AI and
      Generative AI spending across software companies projected to reach $222 billion by 2028 at
      approximately 27% CAGR per IDC. Against these comparables, Resolve AI's $1.5 billion valuation is
      justifiable only if ARR exceeds approximately $75 million at a premium growth rate. At $50 million
      ARR, the implied multiple of 30x is at the upper bound of what private markets currently accept for
      high-growth AI infrastructure SaaS. Below $30 million ARR, the 50x-plus multiple cannot be
      underwritten at any scenario probability consistent with public-market evidence.
