company:
  name: Resolve AI
chapter:
  number: 8
  title: Valuation
  summary: >
    Resolve AI's $1.5 billion post-money valuation, set in April 2026 and supported by DST Global
    and Salesforce Ventures, cannot be formally underwritten because the company has disclosed no
    ARR, gross margin, NRR, or unit economics. Public-comp analysis — anchored by Datadog at 21.6x
    revenue, Dynatrace at 6x, and PagerDuty at 1.3x — reveals that the implied revenue multiple
    at $1.5B spans 10x (bull) to 50x (bear) depending on undisclosed ARR. DST Global's entry is the
    strongest indirect signal of revenue visibility, consistent with $50–$100M ARR, but this remains
    inferential. The recommendation is research-more with a low-confidence, high-risk rating; the
    valuation stance is stretched-to-unknown pending financial disclosure.

sections:
  - id: thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      Resolve AI occupies a defensible strategic position at the intersection of AI-native tooling and
      enterprise production operations, a segment that has historically lacked purpose-built intelligent
      automation. The investment thesis rests on four pillars. First, the founding team is among the
      strongest in the observability category: Spiros Xanthos and Mayank Agarwal co-created OpenTelemetry
      and ran Splunk's observability business, giving them rare insight into both the technical architecture
      and the enterprise sales motion of infrastructure software. Second, the investor syndicate — Greylock
      at seed, Lightspeed at Series A, and DST Global plus Salesforce Ventures at Series A Extension — is
      category-defining, and DST's entry in particular implies meaningful revenue visibility because the
      fund rarely leads rounds without substantial contracted ARR. Third, blue-chip reference customers
      (Coinbase, DoorDash, Salesforce, Zscaler, MSCI) have documented ROI: Coinbase has 100+ engineers
      on the platform, Zscaler reports 30% fewer engineers per incident, and Salesforce's CTIO has
      publicly endorsed the product. Fourth, the AIOps market is large and growing rapidly, valued at
      approximately $18.95 billion in 2026 and projected to reach $37.79 billion by 2031 at a 14.8%
      compound annual growth rate.


      The anti-thesis is equally concrete. No ARR, gross margin, NRR, burn rate, or unit economics have
      been disclosed as of June 2026, making formal valuation underwriting impossible. The $1.5 billion
      mark implies a revenue multiple that ranges from 15x (bull case, $100M ARR) to 50x-plus (bear case,
      below $30M ARR) — a spread too wide for a disciplined price anchor. Competitive risk from Datadog is
      material: Datadog launched more than 100 features at DASH 2026, including major expansion of its
      Bits AI autonomous operations suite covering root-cause analysis, fix-PR generation, and incident
      investigation — directly overlapping with Resolve AI's core workflow. Dynatrace Davis AI and
      NeuBird offer alternative AI-native approaches. PagerDuty's collapse from a $9 billion-plus peak
      market cap to $654 million illustrates how fast valuation multiples compress when growth stalls in
      the incident management and AIOps space. The absence of financial transparency is not merely a
      disclosure inconvenience; it prevents any investor from separating genuine traction from a
      narrative-driven premium.
