  - id: financing-context
    title: Financing and Valuation Context
    body: >
      Resolve AI has raised more than $190 million across three financing events in under 18 months of
      emerging from stealth in late 2024. The seed round of approximately $35 million was led by Greylock
      Partners in 2024 and represented the largest single check written by the firm that year, reflecting
      unusual conviction at formation stage. The Series A of $125 million at a $1 billion post-money
      valuation was led by Lightspeed Venture Partners in February 2026, with pro-rata participation by
      all existing insiders including Greylock, Unusual Ventures, Artisanal Ventures, and A*. Pro-rata
      exercise by all insiders is a strong corroboration signal. The Series A Extension of $40 million
      at a $1.5 billion post-money valuation was announced on April 16, 2026, led by DST Global with
      Salesforce Ventures as co-lead.


      The 50% valuation step-up from $1 billion to $1.5 billion in approximately 10 weeks is exceptional.
      For context, no publicly disclosed 2026 unicorn in the TechCrunch tracker achieved a comparable
      intra-series step-up in that compressed a timeframe without a major revenue disclosure. This pace
      implies either rapid contract expansion, a material contracted ARR milestone reached between the
      two closings, or investor access to forward bookings or pipeline not reflected in trailing ARR.
      DST Global's institutional posture is particularly informative: the fund historically invests in
      high-revenue-growth companies with substantial verified ARR and well-defined capital efficiency.
      Their participation at $1.5 billion implies internal access to metrics supporting the price.
      Separately, the June 2026 Snowflake Summit announced a multi-million dollar, two-year Cortex
      Training contract with Resolve AI — the first disclosed commercial partnership with a contracted
      dollar value, providing partial confirmation that the company generates real enterprise revenue
      beyond named logo relationships. Entry discipline for a new investor at $1.5 billion requires
      confirmation of ARR, preference stack, and NRR before capital deployment is warranted.
