  topStrengths:
    - >-
      Founder-market fit is elite: the co-founders built OpenTelemetry and previously scaled observability products at
      Splunk.
    - >-
      Reference customers such as Coinbase, DoorDash, Salesforce, and Zscaler report material time-to-resolution
      improvements, suggesting real product value.
    - >-
      Investor quality is unusually strong for a two-year-old company, with Greylock, Lightspeed, DST Global, and
      Salesforce Ventures all backing the business.
    - >-
      The product addresses a real operational bottleneck created by faster software shipping and rising production
      complexity.
  topRisks:
    - >-
      No public ARR, gross margin, NRR, burn, or concentration data exists, so valuation underwriting depends heavily on
      narrative and investor signal.
    - >-
      Autonomous remediation in production creates hallucination, permissions, and blast-radius risk that is hard to
      benchmark independently.
    - >-
      Datadog, Dynatrace, PagerDuty, AWS, and other incumbents can bundle adjacent AI-SRE functionality into existing
      enterprise contracts.
    - >-
      Early customer evidence is strong but heavily vendor-curated; independent benchmarks and broader proof remain
      limited.
    - >-
      A $1.5B valuation implies aggressive assumptions about future ARR scale and retention that are not publicly
      validated.
  unresolvedGaps:
    - Current ARR, quarterly growth, gross margin, NRR, and burn rate were not publicly disclosed.
    - Exact current customer count, top-10 customer concentration, and contract structure remain unknown.
    - Independent benchmark data validating root-cause accuracy and safe autonomous remediation is unavailable.
    - Preference stack, dilution, and detailed governance terms across the 2024-2026 financings are not public.
    - >-
      Resolve AI Labs roadmap, model-evaluation methodology, and commercialization timeline remain only partially
      disclosed.
