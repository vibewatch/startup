  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent performance benchmarks
      missingEvidence: >-
        Independent third-party benchmark testing of Resolve AI's MTTR reduction claims,
        conducted with a randomized or controlled methodology, by an organization not
        affiliated with Resolve AI or its customers.
      whyItMatters: >-
        All five published case studies are company-authored with customer quotes but no
        control condition. Independent validation is needed to assess whether 60–87% MTTR
        reductions are reproducible, or reflect selection bias toward the most favorable
        deployments.
      diligencePath: >-
        Commission an independent pilot with pre-agreed MTTR baseline, alert taxonomy,
        and success criteria. Obtain reference calls with at least two customers in a
        comparable infrastructure environment not referenced on the Resolve AI website.
      relatedQuestionRefs: [QE010]

    - type: private-evidence-only
      severity: material
      topic: Resolve AI Labs model timeline and evaluation
      missingEvidence: >-
        Published evaluation methodology, model architecture details, training data
        composition, and committed production deployment timeline for domain-specific
        models being developed at Resolve AI Labs.
      whyItMatters: >-
        The labs research program is the primary long-term moat argument. Without
        published evals or timelines, investors cannot assess whether the domain-specific
        model bet will materially differentiate from frontier model quality improvements.
      diligencePath: >-
        Request an NDA deep-dive with Resolve AI Labs leadership covering evaluation
        benchmarks, preliminary model performance on production telemetry tasks, and
        planned research publication cadence.
      relatedQuestionRefs: [QE012, QE021]

    - type: missing-source
      severity: material
      topic: committed product roadmap timelines
      missingEvidence: >-
        Publicly committed delivery dates for MCP server GA, MS Teams feature parity,
        bundled script execution in Skills, and supervised remediation beyond alert silencing.
      whyItMatters: >-
        Multiple strategic capabilities (MCP server, Teams integration, autonomous remediation
        expansion) are in Beta or on roadmap without committed timelines, creating uncertainty
        for enterprise procurement decisions with multi-year contract horizons.
      diligencePath: >-
        Obtain a product roadmap letter with committed dates for Beta-to-GA transitions
        and specific remediation action types, with contractual service level commitments
        for key integrations.
      relatedQuestionRefs: [QE027]

    - type: missing-source
      severity: minor
      topic: no public GitHub repository or developer community metrics
      missingEvidence: >-
        Public GitHub repository, star count, contributor activity, or package registry
        presence for any Resolve AI platform component; community forum or Discord metrics.
      whyItMatters: >-
        For a platform targeting SRE and platform engineering buyers who evaluate tools
        through developer community health, the absence of any public open-source surface
        or community metrics limits grassroots adoption signals and makes bottom-up adoption
        harder to measure.
      diligencePath: >-
        Ask Resolve AI for any planned open-source contributions from Resolve AI Labs
        (e.g., evaluation frameworks, simulation environments); check agentskills.io
        community adoption metrics for skills authored by Resolve AI teams.
      relatedQuestionRefs: [QE023]

    - type: access-blocked
      severity: minor
      topic: SOC 2 audit report and compliance documentation
      missingEvidence: >-
        Publicly accessible or NDA-gated SOC 2 Type II audit report, auditor name,
        audit period, BAA/DPA template terms, and FedRAMP or CMMC readiness information.
      whyItMatters: >-
        Enterprise security teams in regulated industries (financial services, healthcare,
        government) require audit report review before production credential sharing.
        Absence of accessible documentation lengthens procurement cycles.
      diligencePath: >-
        Request SOC 2 Type II audit report under NDA; confirm BAA availability and terms
        for HIPAA-regulated environments; ask for FedRAMP roadmap for U.S. federal
        or defense customers.
      relatedQuestionRefs: [QE026]

acknowledgedWarnings:
