callouts:
  - calloutType: strength
    title: OpenTelemetry Co-Creator Pedigree Yields Structural Domain Advantage
    body: >-
      Founders Spiros Xanthos and Mayank Agarwal co-created OpenTelemetry—the CNCF-graduated
      open-source telemetry standard adopted across thousands of enterprise environments—
      giving Resolve AI deep, first-principles knowledge of how production telemetry is
      instrumented, transported, and queried. This directly informs the platform's ability
      to reason across fragmented signals and positions the team credibly with the SRE and
      platform engineering audiences who operate OpenTelemetry stacks.
    claimRefs:
      - CE027
      - CE030

  - calloutType: risk
    title: All Quantified Performance Claims Are Company-Authored; No Independent Validation Exists
    body: >-
      Every documented MTTR improvement (60–87% across five customers) derives from
      Resolve AI-authored case studies with no independent control condition, randomized
      methodology, or third-party audit. G2 shows zero published customer reviews as of
      October 2025. The company is absent from independent AI SRE comparison matrices
      (Fundesk, 2026). Any diligence or procurement decision relying on the published
      performance numbers should independently verify outcomes with reference calls
      and pilot-phase measurement against a pre-agreed baseline MTTR.
    claimRefs:
      - CE037
      - CE038

  - calloutType: insight
    title: Three-Phase Autonomy Roadmap Signals Shift from HITL to HOTL Operations
    body: >-
      Resolve AI Labs frames a three-phase autonomy progression: AI-Assisted (engineer in
      driver's seat), HITL (AI proposes, human approves), and HOTL (AI acts within guardrails,
      humans define policy and handle exceptions). The platform is squarely in Phase 2 for
      most enterprise use cases today. The Labs investment in domain-specific model building
      and simulation environments is the technical prerequisite for Phase 3. If Lab research
      produces reliable models with high confidence calibration, the autonomous remediation
      market will shift significantly—from approval-gated to policy-gated actions at scale.
    claimRefs:
      - CE040
      - CE028

  - calloutType: recommendation
    title: Require Reference Calls and Pilot Baseline Before Contract Sign
    body: >-
      Given the absence of independent benchmark validation, any enterprise evaluating
      Resolve AI should: (1) require reference calls with at least two named customers
      in a comparable infrastructure environment, (2) establish a pre-pilot MTTR and
      alert-triage baseline with explicit measurement methodology agreed in writing,
      (3) review the SOC 2 Type II audit report under NDA before sharing production
      credentials, and (4) confirm BAA availability if PHI is present in the telemetry
      environment.
    claimRefs:
      - CE021
      - CE038

