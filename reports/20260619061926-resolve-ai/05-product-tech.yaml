  - id: platform-architecture-technical-design
    title: Platform Architecture and Technical Design
    body: >-
      Resolve AI's platform organizes into three functional layers: Context, Models, and
      Actions. The Context layer maintains a continuously-updated queryable graph of
      services, dependencies, recent deployments, and team knowledge (runbooks, wikis, past
      investigation learnings) that every agent draws from during an investigation. The
      Models layer pairs third-party frontier language models (GPT-class, Claude-class)
      with domain-specialized models the company is post-training at Resolve AI Labs; the
      platform selects the best model for each task at inference time and handles model
      upgrade orchestration automatically. The Actions layer governs write operations
      behind a mandatory human approval gate: the AI model that generates a mitigation
      proposal has no direct access to write APIs, and a separate execution engine only
      acts after an engineer explicitly approves via the Resolve UI or a Slack button. This
      architectural separation means alert silencing, commit reverts, and PR creation are
      always human-in-the-loop. The Resolve Satellite is a containerized agent (Kubernetes
      or AWS ECS Fargate) deployed inside the customer's environment that scrapes Kubernetes
      APIs, DNS tap, and proxies observability queries, applying regex-based PII/PHI
      redaction before transmitting any data to Resolve AI's cloud. Raw telemetry is queried
      live and not retained; only investigation summaries and metadata are cached in
      customer-isolated storage. The playground environment demonstrates a complete
      investigation flow from natural-language query to multi-source evidence correlation,
      offering a hands-on signal of reasoning depth for evaluators.
