company:
  name: Resolve AI

chapter:
  number: 4
  title: Financials
  summary: >-
    Resolve AI operates a private, enterprise-only subscription model with no public pricing and
    zero disclosed revenue metrics as of June 2026. Total capital raised exceeds $190 million across
    three rounds in under 18 months, most recently at a $1.5 billion valuation in April 2026. Customer
    case studies document material MTTI and engineering-labour reductions, providing partial ROI proxies,
    but ARR, gross margin, ACV, NRR, headcount, and burn rate remain fully undisclosed, blocking formal
    underwriting. Peer-benchmark gross margins (PagerDuty 84.9% non-GAAP) set a long-run ceiling; AI
    inference and model-training costs are expected to compress early margins, and the Resolve AI Labs
    investment adds near-term R&D capex with uncertain payback timeline.

sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Resolve AI generates revenue through enterprise platform subscriptions sold exclusively via a
      direct-sales motion. The company does not publish list pricing; its pricing page presents only an
      enterprise contact form inviting prospects to discuss plans and integrations with a Resolve AI
      representative. This fully-gated pricing posture is consistent with high-ACV enterprise software
      where deal structures are customised to each customer's incident volume, seat count, and integration
      complexity. No trial, freemium, or self-serve tiers are publicly advertised, differentiating
      Resolve AI sharply from adjacent tools like incident.io, which begins at $19 per user per month, or
      PagerDuty, whose professional tier starts at approximately $21 per user per month.

      Revenue is expected to consist primarily of annual or multi-year platform subscription fees
      covering the core multi-agent SRE platform, plus potential professional-services components for
      onboarding and custom integration work. The land-and-expand pattern is evidenced by deployed
      customer engagement depth: Coinbase reports more than 100 engineers using Resolve AI across 250+
      weekly sessions, while DoorDash Ads has 50+ engineers engaging the platform during active
      incidents. Neither metric is a contractual seat count, but both signal seat-expansion economics
      once an initial beachhead is established. Resolve AI Labs research partnerships with enterprise
      customers may also carry embedded data-access or co-development value that offsets raw
      subscription pricing without being captured as a separate revenue line.
    claimRefs:
      - CI001
