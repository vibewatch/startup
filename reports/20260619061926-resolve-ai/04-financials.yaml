callouts:
  - calloutType: risk
    title: Valuation Multi-Tranche Reporting — Material Diligence Risk
    body: >-
      TechCrunch reported in February 2026, citing unnamed sources, that Resolve AI's $125 million
      Series A may have been structured in multiple tranches at different prices, potentially putting
      the actual blended valuation below the $1 billion headline figure. Resolve AI's spokesperson
      publicly denied this, and Lightspeed's partner letter confirms the $1 billion valuation as
      non-blended. Nonetheless, the report is an unresolved adverse financial signal that warrants
      primary-source review of the cap table and subscription agreement to confirm single-price
      issuance before any secondary transaction or co-investment at the $1.5 billion Series A
      Extension mark.
    claimRefs:
      - CI017

  - calloutType: insight
    title: Salesforce Ventures as Dual Customer-Investor — Revenue Quality Signal
    body: >-
      Salesforce Ventures' co-lead of the Series A Extension while Salesforce simultaneously operates
      as a paying enterprise customer is a rare dual signal. It implies that Salesforce's internal
      engineering and SRE leadership endorsed the product quality and ROI sufficiently to support a
      strategic investment, and that Salesforce's deal team is comfortable with the $1.5 billion
      valuation relative to observed commercial metrics. For prospective investors, the Salesforce
      relationship provides both a reference customer and an implicit minimum-floor revenue-quality
      signal, though neither the contract ACV nor the expansion trajectory at Salesforce is disclosed.
    claimRefs:
      - CI019
      - CI021

  - calloutType: assumption
    title: Gross Margin Estimate Assumes AI Inference Remains a Material COGS Component
    body: >-
      The estimated 50–70% gross margin range for Resolve AI assumes that LLM API inference costs
      remain a meaningful cost-of-revenue item through at least 2026–2027. The Resolve AI Labs
      programme is explicitly designed to replace third-party inference with in-house domain-specific
      models, which would shift inference costs from variable COGS to capitalised R&D once those models
      are production-grade. If Resolve AI's in-house models reach production quality significantly
      faster than assumed, the gross margin path could converge toward the 80%+ range of pure-SaaS
      peers sooner than the 2–4 year horizon estimated here.
    claimRefs:
      - CI025
      - CI026
      - CI027

