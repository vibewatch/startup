  - id: public-traction-unit-economics
    title: Public Traction and Unit Economics Evidence
    body: >-
      No revenue, ARR, GMV, or financial traction metrics have been publicly disclosed by Resolve AI.
      Customer case studies provide operational proxies that, while valuable for ROI modelling, cannot
      substitute for audited financial disclosure. Coinbase reports a 72% reduction in incident
      investigation time, under-10-minute median time to likely root cause, and 250+ weekly engineer
      sessions. Zscaler reports a 30% reduction in engineers required per incident — a direct headcount-
      leverage metric that translates into recoverable SRE capacity at fully-loaded engineer costs of
      $300,000–450,000 per year per SRE. DoorDash Ads documents up to an 87% reduction in root-cause
      time in specific incidents, with one documented case compressing investigation from 40 minutes to
      under 1 minute, and an estimated $200,000 in potential revenue preservation per critical incident
      resolved more quickly. DoorDash also evaluated but rejected building an internal equivalent,
      concluding it would require tens of dedicated engineers — an implicit build-cost anchor that
      frames Resolve AI's subscription as capital-efficient by comparison.

      These outcomes imply a strong ROI story for enterprise buyers and support premium pricing power,
      but unit economics remain opaque. ACV, CAC, payback period, LTV, and NRR are all undisclosed.
      The expansion signal from Coinbase (100+ engineers, 250+ sessions weekly) and DoorDash (50+
      engineers during incidents) suggests the platform generates seat expansion and usage growth
      within accounts — consistent with high NRR in enterprise software — but no NRR figure has been
      released. Customer count and account concentration are also undisclosed, creating a potential
      hidden concentration risk if a small number of logos account for a disproportionate share of
      contracted ARR.
    claimRefs:
