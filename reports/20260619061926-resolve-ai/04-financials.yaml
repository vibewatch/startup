  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: ARR, revenue run-rate, and quarterly growth trajectory from management accounts or investor reporting
      whyItMatters: Without revenue disclosure, no valuation multiple can be anchored and no revenue-quality judgment is possible
      diligencePath: "Request management accounts from CEO/CFO; obtain LP reporting package from Lightspeed, Greylock, or DST Global; request data room access"
      relatedQuestionRefs:
        - QI004
        - QI009

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: GAAP and non-GAAP gross margin by quarter for the last four reporting periods
      whyItMatters: Gross margin is the primary determinant of capital efficiency and long-run investor returns; without it, AI inference cost risk cannot be quantified
      diligencePath: "Audited financial statements; CFO disclosure with cost-of-revenue breakdown by category (inference, hosting, support, compliance)"
      relatedQuestionRefs:
        - QI007

    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: ACV distribution, NRR, gross revenue retention, customer count, and top-10 revenue concentration
      whyItMatters: Cannot assess sales efficiency, expansion economics, concentration risk, or Series B revenue targets without these metrics
      diligencePath: "Investor data room with cohort analysis; request from CFO or Head of Finance"
      relatedQuestionRefs:
        - QI002
        - QI013
        - QI025
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
