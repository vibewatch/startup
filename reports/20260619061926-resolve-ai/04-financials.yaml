  - id: financial-verdict-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      Resolve AI presents a capital-formation story consistent with strong investor conviction and
      credible enterprise traction, but the financial profile is almost entirely private. The revenue
      model is well-suited to high-ACV enterprise expansion, the investor syndicate (Lightspeed,
      DST Global, Greylock, Salesforce Ventures) carries significant signal, and the customer ROI
      evidence is both quantified and attributable to named F500 accounts. These are positive structural
      attributes. The financial risks are also structural: LLM inference costs at early scale will
      compress margins below pure-software SaaS peers; the Resolve AI Labs R&D investment front-loads
      capex; the absence of disclosed revenue metrics prevents any formal revenue-quality or
      growth-rate assessment; and the TechCrunch-reported concern about possible multi-tranche
      structure in the Series A has not been independently verifiable from public data.

      Underwriting a Series B or secondary position in Resolve AI from publicly available data is not
      feasible. The minimum disclosures required are: (1) ARR or revenue run-rate with quarterly
      growth trajectory, (2) gross margin (GAAP and non-GAAP), (3) ACV range and average contract
      term, (4) NRR and churn, (5) customer count and top-10 concentration, (6) fully-loaded monthly
      burn and cash position as of the most recent quarter, and (7) Resolve AI Labs capitalisation
      and amortisation policy for model-training costs. Without these seven metrics, any valuation
      stance above "unknown" is speculative. The $1.5 billion valuation implies revenue multiples in
      the 15–50x range depending on ARR assumptions — only the lower end of that range is
      financeable at current public-market comps for AI SaaS.
