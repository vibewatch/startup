  - id: gtm-sales-efficiency
    title: GTM Motion and Sales Efficiency Proxies
    body: >-
      Resolve AI's go-to-market model is a classic enterprise direct-sales motion augmented by
      strategic-investor distribution. The company's target buyer is an engineering leader — VP of
      Engineering, CTO, or Head of SRE — at enterprises operating large-scale Kubernetes or
      microservices stacks where SRE toil is material enough to budget for platform software.
      Salesforce Ventures' participation in the Series A Extension is commercially meaningful: Salesforce
      is simultaneously a paying customer and a strategic investor, giving Resolve AI an internal Salesforce
      reference that will open doors to CIOs managing similarly complex production environments at other
      Fortune 500 accounts. DST Global's co-lead signals that deal velocity and contract metrics are
      consistent with their portfolio at this valuation multiple.

      Public evidence of sales efficiency is limited to customer-outcome proxies. DoorDash Ads
      evaluated building an internal incident platform, determined it would require tens of dedicated
      engineers and continuous fine-tuning, and concluded build-versus-buy favoured Resolve AI — a
      documented make-vs-buy calculation that implies both a clear value proposition and a
      proof-of-concept period during which Resolve was evaluated against internal alternatives. The
      passing of comprehensive security reviews at DoorDash (with production access to the Ads codebase,
      infrastructure, and telemetry granted) suggests a structured enterprise procurement cycle, likely
      90–180 days for a platform of this sensitivity. No CAC, sales-cycle length, quota-carrying
      headcount, or win-rate data is publicly disclosed. The careers page indicates active hiring across
      enterprise account executive, solutions engineering, and customer success roles, consistent with
      a scaling direct-sales motion post-Series A.
    claimRefs:
