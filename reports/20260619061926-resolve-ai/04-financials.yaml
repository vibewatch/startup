      - FI002

  - id: capital-adequacy-financing
    title: Capital Adequacy and Financing Trajectory
    body: >-
      Resolve AI has raised more than $190 million across three rounds since emerging from stealth in
      late 2024: approximately $25 million in seed and early-stage funding led by Greylock Partners,
      a $125 million Series A at a $1 billion valuation led by Lightspeed in February 2026, and a
      $40 million Series A Extension at a $1.5 billion valuation led by DST Global and Salesforce
      Ventures in April 2026. The 50% valuation step-up from $1 billion to $1.5 billion in approximately
      ten weeks is exceptional by venture norms and implies rapid contract expansion or meaningful ARR
      growth in that window. DST Global rarely leads rounds at this stage without revenue at multiples
      consistent with the valuation, suggesting contracted ARR in a range consistent with a 10–20x
      revenue multiple at a $1.5 billion post-money — though no specific ARR figure is confirmed.

      The Series A was described by the CEO as oversubscribed. TechCrunch reported in February 2026,
      citing unnamed sources, that the $125 million Series A may have included multiple tranches at
      different prices, potentially placing the actual blended valuation below $1 billion. Resolve AI
      denied this publicly, stating 100% of equity was purchased at $1 billion. This reporting
      represents a material adverse signal that warrants direct diligence with the company's cap-table
      structure and investor documentation.

      With no disclosed debt or project-finance obligations, the balance-sheet risk is primarily a
      function of burn rate versus remaining capital. Total capital raised implies a significant cash
      position, though a material share will have been deployed into product development,
      go-to-market buildout, model training, and team expansion since the first seed closing in 2024.
      Planned use of proceeds from the Series A Extension encompasses product development, go-to-market
      expansion, and long-term Resolve AI Labs research. Burn rate is estimated at $15–45 million per
      year, yielding an estimated runway well in excess of 24 months from the April 2026 close,
      consistent with pre-emptive Series B conditions rather than a near-term capital constraint.
