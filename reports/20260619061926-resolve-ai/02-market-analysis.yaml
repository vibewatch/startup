callouts:
  - calloutType: risk
    title: SAM/SOM Are Unquantifiable from Public Data
    body: >
      No public analyst firm has sized the AI SRE autonomous-investigation sub-category
      independently. The $11B–$22B AIOps TAM figures are for the broader category and overstate
      Resolve AI's immediately addressable market. Until the AI SRE sub-category is independently
      sized, valuation models that apply AIOps-level multiples to nascent AI SRE revenue run-rates
      carry significant sizing risk.
    claimRefs:
      - CM004

  - calloutType: insight
    title: Incumbent Platform Bundling Is the Primary Competitive Threat
    body: >
      Datadog and Dynatrace together serve the majority of large enterprise observability accounts.
      Both launched autonomous AI operations features in 2026 with significant engineering investment
      (Datadog: 100+ features at DASH; Dynatrace Intelligence: 12x RCA improvement benchmark).
      For Resolve AI, the key risk is not losing to another AI SRE startup but being deprioritized
      by enterprises that already have Datadog or Dynatrace contracts and can use bundled AI SRE
      features at no incremental cost.
    claimRefs:
      - CM027
      - CM028

  - calloutType: strength
    title: Protected Observability Budgets Signal Durable Demand
    body: >
      LogicMonitor's 2026 survey — 100 VP+ decision-makers with observability budget authority —
      found 96% expect spending to hold or grow, with 62% anticipating increases. Observability
      has become "protected infrastructure" in enterprise budget cycles, insulating AI SRE vendors
      from the discretionary spending cuts that affect many AI initiatives. This budget protection
