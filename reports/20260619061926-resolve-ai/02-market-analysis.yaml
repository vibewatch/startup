  - id: adoption-constraints
    title: Adoption Constraints and Adverse Signals
    body: >
      Despite strong structural demand, actual adoption remains nascent. Only 4% of organizations
      surveyed by LogicMonitor in 2025 had reached full AI/AIOps operational maturity; 22% had
      not adopted AI in IT operations at all. Of the 62% that have begun AI implementation, 78%
      remain stuck — attributed to fragmented telemetry data, disconnected tools, and platforms
      unable to explain their reasoning. The trust and explainability gap is the most frequently
      cited cultural barrier: "black-box systems that can't explain their reasoning erode trust
      and limit adoption" (LogicMonitor). Autonomous remediation faces the additional constraint
      of risk aversion — enterprises, especially in finance and healthcare, prefer human-in-the-loop
      validation before any write action against production infrastructure. Building that trust
      typically follows a multi-week "observe → suggest → automate" progression, which lengthens
      sales cycles and delays revenue recognition.

      Competitive displacement from large incumbents is an acute market risk. Dynatrace unveiled
      Dynatrace Intelligence in January 2026, an agentic system benchmarked at solving production
      problems 12 times more often and three times faster than external AI agents alone. Datadog
      launched more than 100 AI-related features at DASH in June 2026 under an explicit autonomous
      AI ops strategy. Both are bundling AI SRE capabilities into platforms where large enterprises
      already have contract relationships, telemetry pipelines, and seat-based licenses. This
      incumbent expansion compresses the standalone AI SRE TAM and increases the importance of
      differentiated workflow integrations. Additional constraints include: LLM inference costs at
      scale (complex investigations can consume hundreds of LLM calls per incident), data quality
      requirements (poor telemetry labeling limits model accuracy), and open-source alternatives
      (K8sGPT, HolmesGPT, Aurora) that compete on price in cost-sensitive or air-gapped deployments.
      The DORA 2025 AI research also noted that AI tooling amplifies existing practices more than
      it fixes broken ones — suggesting AI SRE platforms are more effective in organizations with
      mature DevOps foundations, which narrows the immediately addressable installed base.
