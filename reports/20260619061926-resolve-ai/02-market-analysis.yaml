chapter:
  number: 2
  title: Market Analysis
  summary: >
    The addressable market for autonomous AI SRE sits at the intersection of three overlapping
    categories — AIOps platforms (analyst estimates range $11B–$22B in 2025 with CAGR 15–30%),
    AI-in-observability (a $2.9B incremental growth layer through 2029), and incident response
    automation ($5.89B in 2025) — but no single analyst cleanly delineates the AI-native
    autonomous-investigation sub-segment. Gartner formalized AI SRE as a distinct category in its
    2026 Market Guide for AI Site Reliability Engineering Tooling. Demand signals are robust:
    96% of VP+ IT decision-makers expect observability budgets to hold or grow, alert fatigue is
    acute, and incidents per PR rose 242.7% as AI-accelerated development outpaced reliability
    tooling. Key constraints are the trust gap (only 4% of enterprises at full AI ops maturity),
    aggressive incumbent expansion from Datadog and Dynatrace, and regulatory friction in
    finance and healthcare.

sections:
  - id: market-boundary
    title: Market Boundary and Landscape
    body: >
      Resolve AI operates at the intersection of three adjacent but analytically distinct market
      categories: AIOps platforms, AI-enhanced observability, and incident response automation.
      The core value proposition — autonomous alert investigation, root cause analysis (RCA), and
      guided or automated remediation — constitutes what Gartner labeled "AI SRE tooling" in its
      inaugural 2026 Market Guide. This sub-category is meaningfully narrower than the broad AIOps
      platform market, which includes event correlation, anomaly detection, ITSM workflow
      automation, and predictive capacity management. The excluded spend includes classical
      observability infrastructure (metric/log/trace collection tools such as Prometheus, Grafana,
      or raw Datadog ingest), security incident response (SOAR/SIEM), and headcount for
      traditional SRE teams.

      The market's status-quo substitutes are: (1) human on-call SRE engineers responding manually
      to paging alerts; (2) legacy AIOps correlation tools (BigPanda, Moogsoft) that reduce alert
      noise but leave investigation to humans; (3) AI-assisted copilots that surface suggestions
      without autonomous action; and (4) general-purpose LLM chatbots applied ad-hoc. The
      emerging AI SRE category crystallized in 2024–2026 as agent frameworks matured, LLMs
      reached sufficient reliability for multi-step tool use, and hyperscalers like Microsoft
      released production-grade offerings (Azure SRE Agent GA: March 10, 2026). Adjacent
      observability and ITSM spend is the upstream data source and distribution channel for AI SRE
      platforms, not a substitute. Vendors such as Dynatrace and Datadog are simultaneously
      partners (providing telemetry) and competitors (bundling AI SRE features into their
      platforms).
