  evidenceGaps:
    - type: missing-source
      severity: material
      topic: AI SRE standalone market sizing
      missingEvidence: "An independent analyst estimate specifically sizing the AI SRE autonomous-investigation sub-category as distinct from the broader AIOps platform market."
      whyItMatters: "Without a dedicated AI SRE TAM estimate, valuation and market capture analysis must rely on broad AIOps figures that overstate the immediately addressable market."
      diligencePath: "Commission or license a primary research report scoping AI SRE distinctly; alternatively use bottom-up sizing via global on-call engineer headcount at enterprises above 100 engineers."
      relatedQuestionRefs:
        - QM002
      relatedTableRefs:
        - TM002

    - type: conflicting-data
      severity: material
      topic: AIOps market size estimates
      missingEvidence: "Reconciliation methodology for the 2x spread in AIOps TAM estimates ($11B vs $22B for 2025) — requires access to proprietary analyst methodologies to understand which segments are included or excluded."
      whyItMatters: "Contradictory estimates create risk of overstating or understating market opportunity when framing Resolve AI's TAM in investor materials or competitive analysis."
      diligencePath: "License at least one full analyst report (not abstract) to review methodology; triangulate with bottom-up analysis using public enterprise spend data (SEC filings of Datadog, Dynatrace, PagerDuty)."
      relatedQuestionRefs:
        - QM001
        - QM026
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: Resolve AI customer count and ARR
      missingEvidence: "Resolve AI's actual customer count, ARR, and customer verticals are not publicly disclosed; cannot assess actual market penetration or SAM conversion."
      whyItMatters: "Without revenue or customer data, market share cannot be estimated and the TAM-to-SAM translation for Resolve AI specifically is unknowable from public sources."
      diligencePath: "Request customer count, ARR, NRR, and vertical breakdown directly from Resolve AI management in due diligence."
      relatedQuestionRefs:
        - QM002

    - type: missing-source
      severity: minor
      topic: Autonomous remediation production failures and technical prerequisites
      missingEvidence: "Documented cases of AI-driven autonomous remediation causing cascading production failures, and a clear definition of the technical preconditions (telemetry quality, ITSM integration maturity) required for AI SRE to succeed in practice."
      whyItMatters: "The absence of documented failures does not mean they have not occurred; adverse evidence here would affect the trust/regulatory constraint analysis. Technical prerequisite gaps directly limit the addressable market to already-mature DevOps organizations."
      diligencePath: "Search incident post-mortems, SRE forums (SRE Weekly, Google SRE community), and regulatory filings for documented AI ops remediation failures. Review vendor onboarding requirements and time-to-value documentation."
      relatedQuestionRefs:
        - QM012
        - QM016

    - type: missing-source
      severity: minor
      topic: AI SRE vendor win/loss data and DORA stat verification
      missingEvidence: "Competitive win/loss data for Resolve AI versus Dynatrace, Datadog, NeuBird, and incident.io in enterprise evaluations. Also, the primary source and methodology behind the DORA 2025 claim that incidents per PR increased 242.7% with AI coding assistants — the figure is widely cited but the underlying sample size and measurement approach are not detailed in public DORA abstracts."
      whyItMatters: "Win/loss data calibrates SAM and pricing power assumptions. The 242.7% DORA stat is a key ROI narrative for AI SRE vendors; if the methodology is flawed or the sample is non-representative, the demand driver argument weakens."
      diligencePath: "Request win/loss analysis from Resolve AI; supplement with G2/PeerSpot reviews. Access the full DORA 2025 AI-Assisted Software Development report methodology section to verify the 242.7% incidents-per-PR finding."
      relatedQuestionRefs:
        - QM013
        - QM022

