  - id: market-sizing
    title: "Market Sizing: TAM, Adjacent Segments, and Contradictory Estimates"
    body: >
      The AIOps platform market is the most widely sized adjacent segment and serves as the
      primary proxy for Resolve AI's TAM before isolating the AI SRE sub-category. Estimates
      diverge sharply: Business Research Company (via GII Research) places the 2025 global
      AIOps market at $11.08B growing to $14.44B in 2026 at a 30.2% CAGR; 360iResearch
      estimates a materially higher $18.24B in 2025 reaching $21.01B in 2026 at a 15.34% CAGR;
      PW Consulting estimates $22.0B in 2025. The spread — $11B to $22B — reflects inconsistent
      market boundary definitions: some analysts include event management, ITSM, and network
      performance monitoring; others restrict scope to ML-powered alert correlation platforms.
      All estimates should be treated as directional rather than precise.

      Two complementary sub-markets provide additional triangulation. The AI-in-observability
      market is forecast to grow by $2.92B from 2025 to 2029 at a CAGR of 22.5% per TechNavio,
      with North America capturing 37.3% of that increment. The incident response automation
      market is estimated at $5.89B in 2025 and $7.2B in 2026 at a 22.2% CAGR (Research and
      Markets); the broader incident response market (including manual processes and managed
      services) reaches $46.45B in 2025. The AI SRE sub-category — autonomous investigation
      and remediation specifically — is not independently sized by any public analyst as of
      mid-2026. Venture investment provides a partial signal: Resolve AI ($125M, $1B valuation),
      NeuBird AI ($19.3M), incident.io ($62M), and Traversal (Sequoia-backed) have collectively
      raised several hundred million dollars, suggesting the market is real but still nascent.
      SAM and SOM estimates for AI-native autonomous SRE cannot be isolated from available
      public data; bottom-up sizing via the on-call engineering headcount (estimated at several
      million globally in large enterprises) is a plausible alternative lens that has not been
      publicly modeled.
