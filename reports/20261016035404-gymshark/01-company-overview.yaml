figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Gymshark's public milestones show a repeat pattern of founder-led brand bets:
      homemade product in 2012, breakout community traction in 2013, governance and
      funding institutionalization in 2020-2021, then selective retail and control
      updates through 2026.
    data:
      items:
        - label: Gymshark is incorporated
          date: "2012"
          detail: Gymshark begins as a domain-first business with supplement dropshipping before moving into in-house apparel.
          tone: positive
        - label: Founders start hand-making apparel
          period: "Late 2012"
          detail: Francis buys sewing and screen-printing equipment and starts producing fitted gymwear from his parents' garage.
          tone: positive
        - label: BodyPower and Luxe Tracksuit breakout
          date: "2013"
          detail: The BodyPower launch drives a step-change in visibility and roughly £30,000 of sales in about 30 minutes.
          tone: positive
        - label: Community world tour expands the brand
          date: "2016"
          detail: Gymshark turns community meetups into a scaling channel across UK and US cities.
          tone: positive
        - label: Founder steps back from CEO role
          date: "2017"
          detail: Ben Francis moves into a brand-focused role while Steve Hewitt takes the CEO position.
          tone: neutral
        - label: Solihull headquarters move
          period: "April 2018"
          detail: Gymshark moves into Blythe Valley Business Park in Solihull, formalizing its operating base.
          tone: positive
        - label: Gymshark Lifting Club opens
          period: "August 2019"
          detail: The company opens its internal gym-and-content venue, reinforcing the community and content model.
          tone: positive
        - label: General Atlantic invests
          period: "August 2020"
          detail: The first disclosed external round gives General Atlantic a 21 percent stake at a valuation above £1 billion.
          tone: positive
        - label: Ben Francis returns as CEO
          period: "August 2021"
          detail: The founder resumes the top operating role after the Hewitt period.
          tone: neutral
        - label: First permanent flagship store opens
          period: "29 October 2022"
          detail: Regent Street becomes Gymshark's first permanent store while the business stays online-first.
          tone: positive
        - label: FY25 record revenue and restructuring
          period: "FY2025"
          detail: Independent reporting cites £646 million of revenue and about 300 roles cut in a 2025 restructuring.
          tone: warning
        - label: 2026 control and legal watchpoints emerge
          date: "2026"
          detail: Assigned evidence includes buyback talks with General Atlantic and an uncorroborated lawsuit allegation that both merit follow-up.
          tone: adverse
    approximationNotes: "Dates follow the precision available in the assigned evidence; later 2026 items mix one reported control update with one low-tier allegation that remains uncorroborated."
    claimRefs: [CO001, CO003, CO008, CO009, CO010, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Brand-model coherence is unusually strong
    body: >-
      Gymshark's origin story, owned-channel distribution, and current community-led
      positioning still line up as one coherent operating model rather than a patched
      together set of growth experiments.
    claimRefs: [CO001, CO003, CO004, CO005]
  - calloutType: risk
    title: Founder concentration remains a live diligence issue
    body: >-
      The public record shows institutionalization around the founder, not away from
      him: Francis is still CEO, still the symbolic center of the brand, and may
      seek even tighter control if the reported 2026 buyback discussions progress.
    claimRefs: [CO007, CO009, CO011, CO015]
