company:
  name: Gymshark
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gymshark remains a founder-led direct-to-consumer fitness apparel company whose
    public record still anchors on two durable facts: a 2012 Birmingham-area origin
    story and a single disclosed 2020 General Atlantic deal that valued the company
    above £1 billion. Current public scale signals are directionally strong—over 900
    employees, customers in 200+ countries, and reported FY25 revenue of £646 million—
    but board visibility, exact customer count, and any post-2020 valuation remain
    incomplete in the assigned evidence.
sections:
  - id: identity-and-model
    title: Identity, origin, and operating model
    body: >-
      Gymshark's own history pages and multiple independent profiles tell a consistent
      first chapter: the business was incorporated in 2012, started as a lightweight
      ecommerce site, and shifted from supplement dropshipping into self-made apparel
      built around the founders' own training preferences. The brand still frames
      itself less as a wholesale sportswear label than as a direct-to-consumer
      conditioning community that sells apparel, content, and events through its own
      digital surfaces. That identity matters for the rest of the diligence file
      because the company's brand, distribution, and community engine are tightly
      coupled rather than separable business lines. The same origin story also
      explains why later chapters should treat creator marketing and owned-channel
      commerce as core operating infrastructure rather than incidental acquisition
      tactics. [CO001] [CO002] [CO003] [CO004] [CO005] [CO006]
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-control
    title: Leadership, founder dependence, and governance visibility
    body: >-
      Public evidence shows a concentrated leadership structure. Ben Francis remains
      the symbolic and operating center of the company as founder and current CEO,
      supported by a named commercial, technology, people, finance, and brand bench.
      That breadth reduces pure single-executive execution risk, but it does not
      remove founder concentration because the public record still ties the brand's
      identity, product taste, and strategic control unusually closely to Francis.
      The 2017 CEO handoff to Steve Hewitt and Francis's 2021 return suggest Gymshark
      can professionalize around the founder when needed, yet the assigned pool still
      leaves board composition and independent oversight under-disclosed outside one
      board addition tied to the 2020 deal. For diligence, that makes governance
      transparency a live follow-up item rather than a closed fact. [CO007] [CO008]
      [CO009] [CO011] [CO012] [CO015]
    claimRefs: [CO007, CO008, CO009, CO011, CO012, CO015]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding history, current scale signals, and milestone cadence
    body: >-
      Funding disclosure is narrow but clear. The assigned evidence consistently
      points to one first external round in August 2020, when General Atlantic took a
      21% stake at a valuation above £1 billion, leaving Francis with majority
      control. Since then, public scale disclosure has broadened more through company
      operating signals and independent profile updates than through fresh capital
      market events: Gymshark says it has more than 900 employees and customers in
      200+ countries, while an independent 2026 profile cites FY25 revenue of £646
      million and a 2025 restructuring that cut around 300 roles. The milestone arc
      also shows deliberate omnichannel experimentation—especially the 2022 Regent
      Street flagship—without evidence that the company has abandoned its online-first
      model. The only clearly adverse 2026 item in the assigned pool is an
      uncorroborated low-tier allegation about influencer-marketing practices, so it
      should stay in the diligence queue rather than graduate into a settled legal
      fact. [CO010] [CO011] [CO013] [CO014] [CO015] [CO016]
    claimRefs: [CO010, CO011, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
