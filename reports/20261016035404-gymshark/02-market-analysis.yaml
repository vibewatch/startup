company:
  name: Gymshark
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Gymshark's addressable market is narrower than generic athleisure: the brand
    was built for lifters and now broadens into a wider conditioning community
    through women's seamless apparel, app-led engagement, and selective retail.
    Public evidence supports broad category context and realized revenue scale,
    but not a defensible public SAM or SOM, so the valuation question is whether
    US-led omnichannel expansion can widen the served market without breaking
    DTC economics.
sections:
  - id: market-boundary
    title: Market boundary and buyer definition
    body: |-
      The source-backed market boundary is not "all athleisure." Gymshark explicitly
      frames itself around the conditioning community and traces its first wedge to
      fitted gym apparel for lifters who did not want generic sportswear. That matters
      because it narrows the relevant spend to self-directed fitness consumers buying
      performance-led apparel, then widens only where Gymshark has demonstrated
      adjacency: women's seamless products, creator-led content, and owned digital
      channels. Public evidence does not support treating team-sport apparel, general
      fashion basics, or mass wholesale sporting-goods distribution as the same market.
      The practical buyer is still the end consumer spending discretionary wallet share,
      while Gymshark's job-to-be-done combines garment performance, identity signaling,
      and belonging to a fitness community rather than pure price-based apparel demand.
    claimRefs: [CM001, CM002, CM003, CM004, CM012]
    tableRefs: [TM001, TM003]
  - id: sizing-lenses
    title: Sizing lenses show context and realized scale, not a proven SAM
    body: |-
      The strongest public sizing work is a stack of imperfect lenses rather than a
      clean TAM-SAM-SOM bridge. Broad category context exists through third-party
      market summaries, but those figures are wider than Gymshark's lifter/conditioning
      wedge and come through an aggregator rather than directly from the underlying
      analyst reports. The more decision-useful numbers are Gymshark's own realized
      scale and mix: record FY2025 revenue of £646 million, a historically DTC-heavy
      model, and a disclosed FY2024 regional base where the US is already the largest
      geography. Those figures show that the company is not early-stage demand discovery;
      it is monetizing a large niche already. What remains unproven in public evidence is
      how much of the broad athleisure or gym-apparel category is realistically reachable
      for Gymshark by segment, geography, and channel.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers-and-constraints
    title: Adoption still runs through community, but the next leg depends on omnichannel proof
    body: |-
      Gymshark's adoption engine has been community-first from the start: creator
      partnerships, events, and now app-led habit loops pull customers into an owned
      relationship instead of relying on wholesale shelf space. That explains why buyer
      acquisition and retention are tied to motivation, identity, and ongoing engagement
      as much as to technical apparel features. The current market question is different
      from the founding one. Public reporting says the US is the clearest route to the
      billion-dollar sales target, and the company is layering in flagship, experiential,
      and selective wholesale formats to widen reach. That should expand discovery and
      trial, but it also introduces the main constraints: influencer saturation, community
      backlash if authenticity slips, and the risk that omnichannel growth changes the
      economics of a model built on owned-channel intimacy.
    claimRefs: [CM004, CM009, CM012, CM013, CM014]
callouts:
  - calloutType: insight
    title: Boundary is narrower than the headline TAM
    body: >-
      The source-backed core is conditioning-led DTC apparel for lifters and adjacent
      fitness users; broad athleisure figures are context, not a proven served market.
    claimRefs: [CM001, CM002, CM010]
  - calloutType: risk
    title: US-led omnichannel expansion is the market unlock and the proof burden
    body: >-
      Public evidence points to the US as Gymshark's largest disclosed geography and
      the route to $1 billion in sales, but wholesale, flagship, and experiential formats
      also test whether the DTC model scales without margin dilution or brand fatigue.
    claimRefs: [CM008, CM009, CM013, CM014]
