        - label: Narrower functional lens
          displayValue: $111.03B gym-apparel segment in 2026
          valueNote: Projected to $192.45B by 2034 at 6.58% CAGR
          claimRefs: [CM010]
        - label: Realized company scale
          displayValue: £646M FY2025 revenue
          valueNote: +6.4% YoY and a 13th consecutive growth year
          claimRefs: [CM007]
        - label: Largest disclosed geography
          displayValue: US £251.0M FY2024 revenue
          valueNote: Largest disclosed region versus UK £136.4M and Europe ex-UK £145.7M
          claimRefs: [CM008, CM009]
        - label: Current channel boundary
          displayValue: 96% owned-channel sales
          valueNote: Triple Whale separately cites only 3.6% non-DTC revenue
          claimRefs: [CM005, CM006]
        - label: Reachable community layer
          displayValue: 10M+ employees, athletes, and followers
          valueNote: 18M+ social followers and customers in 200+ countries
          claimRefs: [CM015]
        - label: Tracked product concentration
          displayValue: $62.4M of $83.5M sample in bottoms plus tops
          valueNote: "Accio sample: bottoms $40.5M and tops $21.9M in Jan-Nov 2026"
          claimRefs: [CM011]
    approximationNotes: >-
      Layers narrow from broad market context to Gymshark-specific realization and
      concentration; they are directional sizing lenses, not additive TAM/SAM/SOM slices.
    claimRefs: [CM005, CM006, CM007, CM008, CM010, CM011, CM015]
