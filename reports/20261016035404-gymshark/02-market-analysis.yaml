    title: Market sizing lens
    type: pyramid
    summary: >-
      The market narrows from broad category context into Gymshark's current channel,
      geography, and product concentration rather than into a fully proven SAM/SOM.
    data:
      items:
        - label: Broad category context
          displayValue: $368.6B athleisure market in 2026
