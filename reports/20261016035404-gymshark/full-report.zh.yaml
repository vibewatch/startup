    approximationNotes: 各层从宽泛市场背景收窄至 Gymshark 特定的实现规模和集中度；它们是方向性规模视角，不是可相加的 TAM/SAM/SOM 切片。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM010
      - CM011
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于指定证据池，从自有渠道 / 社区控制力和差异化持久度两个维度，对竞争者类别进行序数评分。
    data:
      xAxis:
        label: 自有渠道与社区控制力
        min: 1
        max: 5
        low: 第三方零售或自有受众少
        high: 自有 DTC 加自有社区触点
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      yAxis:
        label: 差异化持久度
        min: 1
        max: 5
        low: 易复制或由价格驱动
        high: 靠产品和品牌深度更难复制
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      points:
        - label: Gymshark
          x: 5
          'y': 4
          detail: 自有 DTC、应用、创作者和社区空间带来较高控制力，但护城河强度如今取决于产品和留存，而非独特的网红打法。
          claimRefs:
            - CP003
            - CP007
            - CP008
            - CP011
            - CP012
        - label: 传统巨头
          x: 2
          'y': 4
          detail: Nike、Adidas 和 Under Armour 拥有庞大预算与全渠道触达，但其模式较少围绕自有、社区优先的分发打造。
          claimRefs:
            - CP005
            - CP006
            - CP012
            - CP015
        - label: Lululemon
          x: 3
          'y': 5
          detail: Lululemon 的高端品牌深度和规模都很强；Gymshark 推进零售，实际上进入了 Lululemon 的地盘，而不是避开它。
          claimRefs:
            - CP015
            - CP016
        - label: 创作者驱动的模仿者
          x: 4
          'y': 2
          detail: 社交优先的挑战者可以迅速复制调性和创作者打法，削弱 Gymshark 最初的渠道套利。
          claimRefs:
            - CP012
            - CP013
        - label: 低价平替
          x: 3
          'y': 1
          detail: 平替可以模仿廓形和审美，但主要靠价格竞争，而非品牌信任。
          claimRefs:
            - CP014
        - label: 邻近健身生态
          x: 4
          'y': 3
          detail: 应用、活动和健身房 / 社区体验能形成更广泛的习惯闭环，但指定资料尚未显示出强锁定经济性。
          claimRefs:
            - CP008
            - CP011
            - CP013
    approximationNotes: 评分是分析师基于指定来源对渠道、规模和护城河的描述作出的序数判断，不是收入份额或市场份额测量。
    claimRefs:
      - CP003
      - CP007
      - CP008
      - CP011
      - CP012
      - CP013
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据支持一种以 DTC 为主、由自有门店和早期批发拓宽的模式；毛利率强劲，但利润被再投资刻意压低。
    data:
      nodes:
        - label: 社区与创作者驱动需求
          detail: 创始人故事和后续行业报道都指向创作者 / 社区驱动流量，而非传统的批发主导分销。
        - label: DTC 在线商店
          detail: Gymshark 称通过 14 家在线商店服务 200 多个国家的客户。
        - label: 自有零售店
          detail: 实体店和旗舰店已扩展至英国、欧洲、中东和美国。
        - label: 选择性批发
          detail: Dick's House of Sport 于 2025 年 10 月成为首个美国批发伙伴，覆盖 12 家门店。
        - label: FY25 收入
          value: £646m
          detail: 收入同比增长 6.4%，将增长周期延长至 13 年。
        - label: FY25 毛利润与再投资
          value: GM 62.3%; EBITDA £53.3m; PBT £7m
          detail: 毛利率保持强劲，但门店、社区和邻近项目投资刻意压低了利润。
    approximationNotes: 该顺序表达商业流和已披露结果，不代表量化渠道组合或数学上平衡的桥接。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI011
      - CI014
  - id: FE001
    title: Gymshark 产品与运营栈
    type: stack
    summary: 创作者驱动的需求生成进入自有数字商业体系，支撑服装发售、内容产品和少量体验式零售资产。
    data:
      layers:
        - label: 社区需求
          detail: 创作者和运动员关系，加上庞大的社交受众，驱动漏斗顶部发现。
          modules:
            - label: Gymshark 运动员
            - label: 社交受众
              displayValue: 18m+ followers
          outputs:
            - label: Brand discovery
            - label: Community participation
        - label: 自有数字商业
          detail: 交易集中在 Gymshark 控制的渠道，而非批发分销。
          modules:
            - label: gymshark.com
            - label: 应用
            - label: 14 家在线商店
          outputs:
            - label: DTC orders
            - label: Global fulfillment reach
        - label: 产品开发
          detail: 产品创意由内部设计能力和 Solihull 创新中心负责。
          modules:
            - label: GSIQ 设计室
            - label: 产品创新中心
          outputs:
            - label: New collection concepts
            - label: Fit and fabric iteration
        - label: 产品系列
          detail: 核心产品是服装，并扩展至女性无缝系列和配件。
          modules:
            - label: 核心服装线
            - label: 无缝系列
          outputs:
            - label: Product drops
            - label: Broader assortment
        - label: 内容与服务
          detail: 训练内容把品牌延伸到购买时刻之外，但不改变核心服装模式。
          modules:
            - label: 训练应用
            - label: 免费与付费训练
          outputs:
            - label: Workout guidance
            - label: Between-purchase engagement
        - label: 体验层
          detail: 实体店和活动加深社区参与，但不取代线上优先模式。
          modules:
            - label: Regent Street 旗舰店
            - label: 社区活动
            - label: 举重空间
          outputs:
            - label: Offline brand proof
            - label: Feedback loop
    approximationNotes: 该运营栈反映来源描述的关系，而不是已披露的内部系统图。
    claimRefs:
      - CE005
      - CE007
      - CE008
      - CE009
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Gymshark 的公开客户旅程叠加了创作者发现、自有 DTC 购买和反复的社区触点。
    data:
      nodes:
        - label: 创作者发现
          actor: Prospective customer
          channels:
            - YouTube
            - Instagram
            - TikTok
          touchpoints:
            - Early product seeding to trusted fitness creators built initial attention without traditional advertising.
            - Platform-native content remains a primary top-of-funnel discovery surface.
        - label: 社区关注
          actor: Follower / fan
          channels:
            - Owned social channels
          touchpoints:
            - Official materials cite over 18 million social followers and a 10 million-plus Gymshark family signal.
            - Reach is large, but public sources do not separate followers from active buyers.
        - label: 自有 DTC 购买
          actor: Buyer = user = payer
          channels:
            - 14 online stores
          touchpoints:
            - The historical moat was direct-to-consumer ownership of the customer relationship.
            - Public sources consistently describe customers in 200+ countries.
        - label: 参与闭环
          actor: Customer / advocate
          channels:
            - Gymshark66
            - Training App
            - UGC
          touchpoints:
            - Gymshark66 turns customers into content producers and creates annual habit-based re-engagement.
            - Thousands of participants globally take part each year, but conversion to purchases is undisclosed.
        - label: 线下品牌体验
          actor: Shopper / community member
          channels:
            - Events
            - Flagships
          touchpoints:
            - Expos, city events, and the Regent Street flagship bring the online community into physical spaces.
            - Official narratives frame these spaces as community moments, not just retail doors.
        - label: 渠道扩张
          actor: Omnichannel shopper
          channels:
            - Dick’s House of Sport
            - Miami gym
          touchpoints:
            - Recent expansion adds wholesale and owned gym touchpoints to the historical DTC model.
            - The move may widen distribution, but public sources do not yet show retention or margin outcomes.
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高剩余风险集中在网红营销合规，以及扩张带来的利润率 / 固定成本后果。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余风险
      rows:
        - label: 网红营销合规
          note: 创作者驱动的 GTM 是指定公开资料中披露最清晰的诉讼主题。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: 固定成本零售加库存
          note: 相对于收入，盈利能力较薄；门店和库存又增加了运营刚性。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 差异化侵蚀
          note: 更大的竞争对手如今采用类似的创作者 / 社区打法，因此执行必须超越旧剧本。
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 低
              tone: low
            - label: 中
              tone: medium
        - label: 创始人与投资者一致性
          note: 品牌仍由创始人主导，而 General Atlantic 仍锚定最后披露的估值基准。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低
              tone: low
            - label: 中
              tone: medium
        - label: 跨境合规复杂度
          note: 遍布 230 个国家的超过 1,000 万名客户，扩大了需要关注的司法辖区和执法点数量。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
            - label: 中
              tone: medium
        - label: 重组与执行带宽
          note: 模式正在变化，而 Gymshark 仍在消化此前重组和持续实体扩张的影响。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低
              tone: low
            - label: 中
              tone: medium
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR012
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模证据真实存在，但价格发现过时且下行风险未解，因此结论仍属于跟踪 / 继续研究。
    data:
      nodes:
        - label: 规模证据
          detail: 200 多个国家、14 家在线商店、900 多名员工和 FY2025 £646 million 收入，显示出真实运营规模。
          claimRefs:
            - CV001
            - CV002
            - CV006
        - label: 创作者驱动的 D2C 护城河
          detail: 社区驱动需求和仍以线上为主的销售模式，守住了品牌控制权和数据所有权。
          claimRefs:
            - CV007
            - CV008
            - CV009
            - CV014
        - label: 过时的价格锚点
          detail: 最后披露的外部估值仍指向 2020 年 General Atlantic 交易。
          claimRefs:
            - CV003
            - CV004
            - CV005
        - label: 控制权集中
          detail: 创始人回购谈判和公开董事会信息稀薄，使治理投资判断仍很重要。
          claimRefs:
            - CV010
            - CV011
        - label: 下行空间可能扩大
          detail: 据报道的法律或品牌争议，可能在任何新价格得到验证前压低买方兴趣。
          claimRefs:
            - CV012
            - CV013
        - label: 建议
          detail: 除非入场价不高于最后披露轮次且新尽调填补缺口，否则继续跟踪 / 深入研究。
          claimRefs:
            - CV015
            - CV016
      edges:
        - from: Scale proof
          to: Creator-led D2C moat
          label: 支持
          relationship: 运营规模得到社区驱动分销的强化。
          claimRefs:
            - CV001
            - CV006
            - CV009
        - from: Creator-led D2C moat
          to: Stale price anchor
          label: 必须纳入定价
          relationship: 好生意在价格不对时仍可能是糟糕的入场。
          claimRefs:
            - CV004
            - CV005
            - CV014
        - from: Stale price anchor
          to: Control concentration
          label: 需要权衡
          relationship: 当价格过时时，治理和卖方激励更为重要。
          claimRefs:
            - CV010
            - CV011
        - from: Control concentration
          to: Downside can widen
          label: 可能压低兴趣
          relationship: 所有权和法律噪音可能降低买方支付溢价的意愿。
          claimRefs:
            - CV010
            - CV013
        - from: Downside can widen
          to: Recommendation
          label: 因此
          relationship: 没有新的价格发现时，纪律比欣赏更重要。
          claimRefs:
            - CV015
            - CV016
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV009
      - CV010
      - CV013
      - CV015
      - CV016
