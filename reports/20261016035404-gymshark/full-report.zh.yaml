        title: 收入模式与公开增长
        blocks:
          - type: paragraph
            body: >-
              现有证据支持一套先以 DTC 电商为核心、随后扩展到自营门店、最近才加入选择性批发的收入引擎。Gymshark 的起源故事称，最初网站以小幅利润代发第三方产品，之后公司才扩大自研服饰；ENEB
              仍将该模式描述为围绕官方线上商店，而非传统批发建立。当前公开规模可观：Gymshark 称通过 14 个线上商店服务 200 多个国家的客户；行业报道称 FY25 收入为 £646 million，同比增
              6.4%，品牌增长已连续 13 年。尽调中的关键区分是：规模可见，但收入组合不可见；公开来源没有拆分电商、自营零售、批发、地域或产品类别贡献。
