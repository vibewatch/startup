            title: 社群如今是分销资产，不只是营销手段
            body: 最重要的竞争变化是，Gymshark 正把社群转化为门店、活动、批发试点和健身房形式等自有触点；这扩大了护城河，也把公司拖入更重资本的战场。
            calloutType: insight
            claimRefs:
              - CP007
