      - number: '3.2'
        title: 到达市场的路径，而不只是品牌知名度，决定买方取舍
        blocks:
          - type: paragraph
            body: >-
              竞争取舍更多由到达市场的路径决定，而不是由单纯知名度决定。Triple Whale 称，在其引用的快照中，非 DTC 收入仅占 3.6%；官方页面和 Wikipedia 则显示，公司不止卖服饰，还拥有 14
              个线上商店、带免费和高级方案的训练 App，以及正在转化为自有分销的社群活动。这让 Gymshark
              比依赖批发的巨头更能控制商品呈现、数据采集和品牌表达，同时也把替代品从普通服饰对手扩展到混合型生活方式和训练生态。公开证据对精确 SKU 价格平价的支持较弱：Latterly 将 Gymshark
              放在平价基础款与奢侈品牌之间的中端区间，但现有材料没有 Gymshark 与 Lululemon、Nike、Adidas 或 Alo 的同款对比页面。因此，竞争问题不在于谁最便宜，而在于 Gymshark
              能否在拓展女性产品深度、App 使用、活动、批发和门店触点的同时守住中端定价。
            claimRefs:
