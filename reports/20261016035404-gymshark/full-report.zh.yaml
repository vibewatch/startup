figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Gymshark 的公开里程碑呈现出反复出现的创始人主导品牌下注：2012 年自制产品，2013 年社区势能爆发，2020-2021 年治理与融资走向机构化，随后至 2026 年持续推进选择性零售和控制权更新。
    data:
      items:
        - label: Gymshark 完成注册
          date: '2012'
          detail: Gymshark 最初以域名为先，开展补剂代发货，之后转向自有服装生产。
          tone: positive
        - label: 创始人开始手工制作服装
          period: Late 2012
          detail: Francis 买来缝纫和丝网印刷设备，在父母家的车库里开始生产修身健身服。
          tone: positive
        - label: BodyPower 与 Luxe Tracksuit 爆发
          date: '2013'
          detail: BodyPower 上市带来曝光度跃升，并在约 30 分钟内实现约 £30,000 销售额。
          tone: positive
        - label: 社区世界巡回扩大品牌
          date: '2016'
          detail: Gymshark 把社区见面会变成覆盖英国和美国城市的规模化渠道。
          tone: positive
        - label: 创始人卸任 CEO
          date: '2017'
          detail: Ben Francis 转向品牌工作，Steve Hewitt 接任 CEO。
          tone: neutral
        - label: 搬迁至 Solihull 总部
          period: April 2018
          detail: Gymshark 搬入 Solihull 的 Blythe Valley Business Park，正式确立运营基地。
          tone: positive
        - label: Gymshark Lifting Club 开业
          period: August 2019
          detail: 公司开设内部健身房和内容场地，进一步强化社区与内容模式。
          tone: positive
        - label: General Atlantic 投资
          period: August 2020
          detail: 首轮披露的外部融资让 General Atlantic 以超过 £1 billion 的估值取得 21% 股份。
          tone: positive
        - label: Ben Francis 回任 CEO
          period: August 2021
          detail: 创始人在 Hewitt 任期后重新担任最高运营职务。
          tone: neutral
        - label: 首家永久旗舰店开业
          period: 29 October 2022
          detail: Regent Street 成为 Gymshark 首家永久门店，而业务仍以线上为先。
          tone: positive
        - label: FY25 创纪录收入与重组
          period: FY2025
          detail: 独立报道称收入达 £646 million，且公司在 2025 年重组中裁减约 300 个岗位。
          tone: warning
        - label: 2026 年控制权与法律观察点出现
          date: '2026'
          detail: 指定证据包括与 General Atlantic 的回购谈判，以及一项未经证实的诉讼指控；两者都值得跟进。
          tone: adverse
    approximationNotes: 日期按指定证据所能提供的精度呈现；2026 年后续事项混合了一项据报道的控制权更新和一项仍未经证实的低等级指控。
    claimRefs:
      - CO001
      - CO003
      - CO008
      - CO009
      - CO010
      - CO013
      - CO014
      - CO015
      - CO016
