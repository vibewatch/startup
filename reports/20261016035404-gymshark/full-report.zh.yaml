      - number: '3.3'
        title: 社群仍是护城河，但背后的打法已经商品化
        blocks:
          - type: paragraph
            body: >-
              持久性喜忧参半。核心护城河仍是社群可信度以及把创作者、活动和内容转成交易的自有渠道飞轮，但多家独立来源认为，最初的打法已经商品化。Business Model Analyst 称 Nike、Adidas 和
              Alo 如今都在运行创作者驱动的打法；Latterly
              则称巨头和数字原生新玩家都在产品、价格和创作者上竞争。证明负担因此从营销新鲜感转向版型、面料和品牌信任的执行。反向证据很具体：平替文化挤压价格溢价，全渠道扩张把 Gymshark 推入 Lululemon
              的线下战场，而较小的规模基础意味着如果线下形式不能复合忠诚度，犯错空间更小。Gymshark 仍可能胜出，但胜出条件比早期 DTC
              阶段更窄：有纪律地推进线下、守得住的产品质量，以及资金更充足的对手难以复制的留存循环。
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
