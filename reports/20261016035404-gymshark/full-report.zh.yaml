        title: 领导层、创始人依赖与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，公司的领导结构高度集中。创始人兼现任 CEO Ben Francis
              仍是公司的象征性和运营核心，身边已有商业、技术、人力、财务和品牌负责人组成的团队。团队覆盖面降低了纯粹的单一高管执行风险，但并未消除创始人集中度：公开记录仍显示，品牌身份、产品品味和战略控制与 Francis
              高度绑定。2017 年 CEO 交接给 Steve Hewitt、以及 Francis 于 2021 年回归，说明 Gymshark 在需要时可以围绕创始人实现职业化；但除一名与 2020
              年交易相关的董事会新增成员外，现有证据对董事会构成和独立监督披露不足。因此，治理透明度仍是待跟进事项，而不是已经关闭的事实。[CO007] [CO008] [CO009] [CO011] [CO012]
