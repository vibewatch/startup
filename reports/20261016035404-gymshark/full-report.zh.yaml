        - 社交发现和创作者内容
        - Gymshark 很早就开创了这条路径，但 Business Model Analyst 表示，创作者驱动打法如今已经商品化
      - - 渠道控制
        - 以自有 DTC 为主；Triple Whale 快照中的非 DTC 占比较低
        - 历史上更依赖批发和百货
        - 通常高度 DTC 化，但指定来源池没有量化其规模和经济性
        - Great Partners 和 Triple Whale 都指向 Gymshark 线上优先的结构
      - - 服饰之外的产品触点
        - Training App、活动、旗舰店及健身房 / 社区空间
        - 指定来源池未持续、完整地说明成熟厂商的 App / 社区组合
        - 指定来源池未持续、完整地说明挑战者的 App / 社区组合
        - Wikipedia 确认 App 提供免费和高级方案；Business Model Analyst 及官方 / 第三方来源确认线下和社区延伸
      - - 女性 / 品类广度
        - 女性产品线占据重要位置；截至 2020 年，女性约占销售额三分之二
