  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局是分层的，而非同类之间的直接对比
        blocks:
          - type: paragraph
            body: >-
              Gymshark
              更适合被理解为一家已具规模的数字原生挑战者，而不是传统运动服饰巨头。官方和第三方来源都认为，公司仍围绕自有电商、创作者和社群触点集中获客与分销；而它面对的传统品牌依靠更大的预算和多渠道零售网络。Great
              Partners 明确表示，Gymshark 更接近 DTC 网店，而非 Nike、Adidas 和 Lululemon；Real Growth Matters 则将 2012 年市场描述为由
              Nike、Adidas 和 Under Armour 主导。由此形成多层竞争：Gymshark 在规模上面对巨头，在高端女性和训练邻近市场上面对
              Lululemon，在语气和社交执行上面对新兴创作者品牌。现有材料不足以有力支持内部自建或自有品牌替代品的独立论点，因此这仍是尽调缺口，而不是已评分的竞争类别。
            claimRefs:
