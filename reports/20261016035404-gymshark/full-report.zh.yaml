      - number: '2.2'
        title: 市场规模视角说明背景和已实现规模，而非已证实的 SAM
        blocks:
          - type: paragraph
            body: >-
              最有价值的公开规模分析是一组并不完美的视角，而不是干净的 TAM-SAM-SOM 桥接。第三方市场摘要提供了广义品类背景，但口径宽于 Gymshark
              的力量训练/体能训练切入点，而且来自聚合平台，并非底层分析报告。更能支持决策的数字是 Gymshark 已实现的规模和组合：FY2025 创纪录收入 £646 million、历史上偏重 DTC
              的模式，以及已披露的 FY2024
              区域基础，其中美国已经是最大地区。这些数字说明公司已不再处于早期需求验证阶段，而是在变现一个已经很大的细分市场。公开证据尚未证明的是，按细分市场、地域和渠道划分，广义运动休闲或健身服饰市场中究竟有多少可被
              Gymshark 现实触达。
