              - CP016
          - type: callout
            title: 最初的网红套利空间已明显收窄
            body: 如果版型、面料和留存循环没有继续变强，Gymshark 的溢价就可能流向更便宜的平替和资金更充足的对手；社交优先打法本身已不再独特。
            calloutType: risk
