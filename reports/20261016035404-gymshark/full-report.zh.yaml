    columns:
      - 论点
      - 证据
      - 哪些事实会改变判断
    rows:
      - - 正论
        - Gymshark 已经具备全球数字化规模，客户覆盖 200+ 个国家，拥有 14 家线上商店，FY2025 收入为 £646 million
        - 核心需求放缓或渠道明显外流的证据，会削弱规模化逻辑
      - - 论点
        - 创作者驱动的 D2C 模式仍具差异化：业务大部分在线上，并持续靠社区驱动的分发复利增长
        - 若新数据表明利润率下滑或获客成本大幅上升，护城河价值会下降
      - - 反论点
        - 公开估值锚点仍是 2020 年 General Atlantic 交易，因此支付新一轮溢价将依赖未经验证的假设
        - 若出现条款同期的新股或老股交易，定价缺口即可厘清
      - - 反论点
        - 如果创始人控制集中和据报道的法律审查扩大，而价格仍停留在旧锚点，买方兴趣可能收缩
        - 更广泛的董事会、经核实的诉讼解决结果和更清晰的治理披露，会提升投资判断的可评估性
