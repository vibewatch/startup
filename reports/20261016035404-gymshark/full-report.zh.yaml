    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与运营模式
        blocks:
          - type: paragraph
            body: >-
              Gymshark 自己的历史页面和多篇独立资料对第一阶段的描述一致：公司 2012 年注册，最初是轻量级电商网站，随后从营养补剂代发转向围绕创始人训练偏好打造自有服饰。品牌如今仍更愿意把自己定义为 DTC
              体能社群，而不是批发型运动服饰品牌；它通过自有数字渠道销售服饰、内容和活动。这一身份对后续尽调很重要，因为品牌、分销和社群引擎彼此紧密耦合，并非可以拆开的业务线。同一套起源也解释了为什么后文应把创作者营销和自有渠道电商视为核心运营基础设施，而非偶然的获客手段。[CO001]
              [CO002] [CO003] [CO004] [CO005] [CO006]
