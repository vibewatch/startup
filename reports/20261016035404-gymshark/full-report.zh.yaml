      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务画像方向上有吸引力，但仅凭公开数据尚不足以完成投资判断。即使公司大举投入，毛利率仍保持强劲，因此收入质量看起来好于纯粹的收入增长故事；近期线下零售和首次批发动作也让渠道多于原先的纯 DTC
              模式。不过，投资判断仍有重大盲区：没有公开披露 DTC、门店和批发收入拆分，没有实际定价或折扣节奏，没有付费获客效率，没有退货数据，没有客户集中度数据，也没有门店四墙经济模型。工作结论是，Gymshark
              像一家已具规模且仍在盈利、靠经营现金流推动有意扩张的消费品牌；但要判断利润率路径、现金续航或下一次融资依赖，仍需要私有运营数据。
