        - FY2025-FY2026 增长重新加速，D2C 模式保持利润率质量，新交易价格达到或超过上次披露的估值
        - 只有这样，才能为相对 2020 年锚点的溢价辩护
        - 竞争投入增速超过社区驱动需求；法律噪音扩大
        - 指定的公开证据尚未显示这一点
      - - 基准
        - 规模保持韧性，销售仍以线上为主，且没有新的定价轮次
        - 在尽调填补信息缺口前，合理价格仅应接近或低于 2020 年最后披露的独角兽估值
        - 若卖方继续围绕品牌高峰叙事营销，旧价格仍可能困住入场者
        - 与当前公开记录最为一致
      - - 悲观
        - 增长或利润率走弱，治理或诉讼风险扩大，而卖方仍要求溢价
        - 任何高于旧锚点的报价都难以辩护，并会提高减值风险
