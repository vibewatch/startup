companyProfile:
  summary: >-
    Gymshark 是一家由创始人主导的 DTC 健身服饰及配件品牌，2012 年成立，总部位于西米德兰兹郡索利赫尔。公开记录显示，公司拥有全球客户覆盖、超过 900 名员工，FY25 收入为 £646
    million；但公司仍为非上市企业，董事会披露有限，2020 年后也没有新的估值重置。
