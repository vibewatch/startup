  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方定义
        blocks:
          - type: paragraph
            body: >-
              有来源支持的市场边界并不是“所有运动休闲服饰”。Gymshark
              明确围绕体能训练社群定位，并将最初切入点追溯到为不想穿普通运动服的力量训练者设计的贴身健身服饰。这一边界把相关支出收窄到购买性能型服饰的自主健身消费者；只有在 Gymshark
              已展示邻近能力时才向外扩展，包括女性无缝产品、创作者驱动内容和自有数字渠道。公开证据不支持把团队运动服、普通时尚基础款或大众批发体育用品分销视为同一市场。实际买方仍是用可支配钱包消费的终端消费者；Gymshark
              要解决的需求同时包括服装性能、身份表达和健身社群归属，而非单纯的价格型服饰需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
