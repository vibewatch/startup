        blocks:
          - type: paragraph
            body: >-
              融资披露有限，但主线清楚。现有证据一致指向 2020 年 8 月的首轮外部融资：General Atlantic 以超过 £1 billion 的估值取得 21% 股份，Francis
              仍保有多数控制权。此后，公司的公开规模披露更多来自运营信号和独立资料更新，而非新的资本市场事件：Gymshark 称员工超过 900 人、客户覆盖 200+ 个国家；一份独立的 2026 年资料称 FY25
              收入为 £646 million，并提到 2025 年重组削减约 300 个岗位。里程碑轨迹也显示公司在有意试验全渠道，尤其是 2022 年 Regent Street
              旗舰店，但没有证据表明公司放弃了线上优先模式。现有材料中唯一明显不利的 2026 年事项，是一项未经佐证、来源层级较低的网红营销指控，因此应留在尽调队列中，不宜升级为既定法律事实。[CO010] [CO011]
