      - number: '8.2'
        title: 公开估值背景
        blocks:
          - type: paragraph
            body: >-
              最强的已披露定价证据仍是历史数据。Tracxn 记录了 2020 年 8 月一轮 $261 million 融资，并给出 $1.3 billion 估值锚点；多篇独立文章则将同一笔 General
              Atlantic 交易描述为出售 21% 股份、估值约 £1 billion。后续公开报道指向创始人回购讨论，而不是新的定价轮；这可以作为控制权信号，却不是新的市场清算价格。换言之，公开记录显示 Gymshark
              已达到独角兽地位并维持收入规模，但尚未显示外部投资者自 2020 年以来将其重新定价上调。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景不应只靠品牌好感：需要证据证明创作者驱动需求、线上优先分销和当前收入规模可以转化为可守住的利润率及新的公平市场价格。基准情景更容易支持，因为公开记录显示持续增长、持久的数字分销和深厚社群，但没有新的价格锚点。悲观情景同样真实，因为竞争强度高、控制仍集中在创始人手中；当外部估值陈旧时，任何真实的法律或品牌争议都可能迅速压缩市场兴趣。因此，估值立场应保持价格敏感，而不是对质量不敏感。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，Gymshark 更像一个耐心资本持有项目，而不是适合 IPO
              投资判断的候选标的。业务拥有支持持续战略选择权的规模和品牌证明，但投资者在评估目标回报前，仍需要最新已提交账目、当前利润率细节、2025 至 2026
              年的任何二手定价、股权表优先权，以及对已报道网红营销诉讼的核实更新。如果管理层能证明 FY2025 至 FY2026
              期间利润率质量保持稳定，同时业务继续在线复合增长，建议可以上调；否则，或者如果交易在没有新的第三方证据时以高于陈旧 2020 年锚点的价格推介，这应是论点失效信号，而不是买入机会。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 持续跟踪/继续研究。公开证据支持质量和规模，但在没有新尽调的情况下，不支持高于陈旧 2020 年外部估值的溢价定价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV015
              - CV016
          - type: callout
            title: 论点失效触发条件
            body: 如果新融资或二手交易要求投资者在缺少当前审计利润率、股权表和诉讼细节的情况下，以高于最近披露轮次的价格出资，投资判断就失去基础。
            calloutType: risk
            claimRefs:
              - CV010
              - CV013
              - CV015
              - CV016
