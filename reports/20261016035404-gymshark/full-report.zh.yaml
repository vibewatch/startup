            body: >-
              公开证据没有显示眼前存在融资危机，但也没有提供足够细节来评估下一轮时点或下行情景韧性。Companies House 显示，FY25 子公司账目和母公司合并账目已于 2026 年 4 月提交，因此 FY25
              指标如今有正式账目锚定，而不只是提交前管理层评论。同一注册记录还显示，自 31 July 2025 起，控制权转移至登记的重大控制人 Gymshark Topco
              Limited；应评估控股公司层面的当前所有权，而不是只看创始人记录。二手分析仍把 2020 年 General Atlantic 交易描述为用于扩张和基础设施的少数股权交易，但现有 2026
              年证据没有披露新的股权轮、债务工具或修订后的估值。
