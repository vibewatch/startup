      - number: '2.3'
        title: 采用仍靠社群驱动，但下一阶段取决于全渠道验证
        blocks:
          - type: paragraph
            body: >-
              Gymshark 从一开始就以社群为采用引擎：创作者合作、活动以及如今由 App
              驱动的习惯循环，把客户带入自有关系，而不是依赖批发货架。这解释了为什么买方获客和留存既取决于动机、身份和持续参与，也取决于服饰的技术属性。当前的市场问题已不同于创立之初。公开报道称，美国是实现
              billion-dollar
              销售目标最清晰的路径，公司也在叠加旗舰店、体验式门店和选择性批发，以扩大触达。这应能扩大发现和试用，但也带来主要约束：网红饱和、真实性下降引发社群反弹，以及全渠道增长改变这一依赖自有渠道亲密度的模式的经济性。
            claimRefs:
              - CM004
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场边界比 headline TAM 更窄
            body: 有来源支持的核心是面向力量训练者及邻近健身用户、由体能训练驱动的 DTC 服饰；广义运动休闲数字只是背景，并非已证明的可服务市场。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: callout
            title: 美国主导的全渠道扩张既是市场突破口，也是验证负担
            body: 公开证据指向美国是 Gymshark 已披露的最大地区，也是通往 $1 billion 销售额的路径；但批发、旗舰店和体验式形式也在检验 DTC 模式能否扩张而不稀释利润率或透支品牌。
            calloutType: risk
