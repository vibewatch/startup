            body: >-
              FY25 看起来盈利，但利润率有意受到约束。独立行业报道显示，税前利润为 £7 million，低于 FY24 的 £11.9 million；EBITDA 仍达到 £53.3 million，毛利率为
              62.3%。这组数据说明，公开记录没有显示毛利引擎失灵，但显示管理层选择吸收扩张成本，而非最大化短期利润。SGI Europe 和 SGB Media 转述的 Ben Francis
              业绩评论，将这一压缩归因于开店、社群投入和一个未披露项目。最新资产负债表信号仍偏正面而非困境状态：年末现金超过 £37 million，库存略高于 £117
              million；但库存规模已足以让周转、折价、过时和退货成为一线尽调主题。
