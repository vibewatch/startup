callouts:
  - calloutType: strength
    title: Community gives Gymshark a real owned-channel moat
    body: Gymshark’s strongest public customer proof is not a named enterprise roster; it is a repeatable system that links creator discovery, owned DTC checkout, and recurring community touchpoints across events, challenges, and flagships.
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU007
      - CU008
  - calloutType: risk
    title: Durability is plausible, but public retention and concentration data are still missing
    body: The brand has enough public adoption proof to show real scale, but not enough disclosed cohort, repeat-purchase, or channel-mix data to prove how durable the customer base is as Gymshark adds wholesale and owned physical infrastructure.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
