figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map scoring competitor classes on owned-channel/community control and differentiation
      durability using the assigned evidence pool.
    data:
      xAxis:
        label: Owned channel and community control
        min: 1
        max: 5
        low: Third-party retail or low owned audience
        high: Owned DTC plus owned community surfaces
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      yAxis:
        label: Differentiation durability
        min: 1
        max: 5
        low: Easy to copy or price-led
        high: Harder to copy through product and brand depth
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      points:
        - label: Gymshark
          x: 5
          y: 4
          detail: >-
            Owned DTC, app, creators, and community spaces create high control, but moat strength
            now depends on product and retention rather than a unique influencer tactic.
          claimRefs: [CP003, CP007, CP008, CP011, CP012]
        - label: Legacy incumbents
          x: 2
          y: 4
          detail: >-
            Nike, Adidas, and Under Armour bring massive budgets and omnichannel reach, but less of
            the model is built around owned community-first distribution.
          claimRefs: [CP005, CP006, CP012, CP015]
        - label: Lululemon
          x: 3
          y: 5
          detail: >-
            Premium brand depth and scale are high; Gymshark’s retail push enters Lululemon’s turf
            rather than avoiding it.
          claimRefs: [CP015, CP016]
        - label: Creator-led copycats
          x: 4
          y: 2
          detail: >-
            Social-first challengers can replicate tone and creator motion quickly, which weakens
            Gymshark’s original channel arbitrage.
          claimRefs: [CP012, CP013]
        - label: Low-cost dupes
          x: 3
          y: 1
          detail: >-
            Dupes can mimic silhouette and aesthetics but compete mainly on price instead of brand
            trust.
          claimRefs: [CP014]
        - label: Adjacent fitness ecosystems
          x: 4
          y: 3
          detail: >-
            Apps, events, and gym/community experiences create broader habit loops, but the
            assigned pool does not show hard lock-in economics yet.
          claimRefs: [CP008, CP011, CP013]
    approximationNotes: >-
      Scores are ordinal analyst judgments anchored to the assigned sources’ channel, scale, and
      moat descriptions; they are not revenue-share or market-share measurements.
    claimRefs: [CP003, CP007, CP008, CP011, CP012, CP013, CP014, CP015, CP016]
callouts:
  - calloutType: insight
    title: Community is now a distribution asset, not just a marketing tactic
    body: >-
      The most important competitive shift is that Gymshark is converting community into owned
      surfaces such as stores, events, wholesale pilots, and gym formats, which broadens the moat
      but also drags the company into more capital-intensive battlegrounds.
    claimRefs: [CP007, CP011, CP016]
  - calloutType: risk
    title: The original influencer arbitrage has narrowed sharply
    body: >-
      If fit, fabrics, and retention loops do not deepen, Gymshark’s premium can leak to cheaper
      dupes and better-capitalized rivals because the social-first tactic itself is no longer unique.
    claimRefs: [CP012, CP013, CP014]
