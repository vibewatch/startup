    rows:
      - [DTC ecommerce, "Owned web stores selling apparel and accessories globally", "Per order / item", "14 online stores serving 200+ countries; no FY25 mix disclosed", "Likely core revenue engine with global reach, but net realization after returns and promotions is undisclosed", "Need FY25 ecommerce revenue share, AOV, repeat rate, return rate, and regional mix"]
      - [Owned retail, "Flagship and destination stores monetizing traffic plus brand/community experience", "Per store sale", "Store expansion accelerated into London, Manchester, Amsterdam, Dubai, Long Island, and New York; no store revenue disclosed", "Useful omnichannel proof point, but 4-wall margins and payback are undisclosed", "Need store count by opening cohort, capex per store, payback, labor model, and same-store sales"]
      - [Selective wholesale, "Sell-in through third-party retailer", "Per wholesale account / SKU", "Dick's House of Sport became first U.S. wholesale partner in 12 stores in Oct 2025", "Could expand reach but likely carries lower gross margin than DTC", "Need wholesale GM, rebates, exclusivity terms, and concentration by account"]
      - [Community / adjacent projects, "Free events and undisclosed side project support brand and future monetization", "Not publicly monetized", "Events clearly funded; direct revenue contribution not disclosed", "Supports demand generation and retention, but current cash-payback is not public", "Need event ROI, secret-project budget, and commercialization plan"]
    notes: "Public evidence shows channel presence, not channel revenue mix; null economics must be closed in diligence."
    claimRefs: [CI007, CI008, CI010, CI011, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Channel / product lens
      - Price / contract basis
      - List vs realized pricing
      - Discounts / unknowns
      - Source implication
    rows:
      - [DTC apparel and accessories, "Per-item consumer pricing on Gymshark storefronts", "List pricing is public in principle, but assigned pool does not retain SKU-level prices or realized net revenue", "Promotional cadence, returns, bundles, taxes, and geography effects are undisclosed", "Public chapter evidence supports reach and channel structure, not net monetization quality"]
      - [Owned retail stores, "Per-item consumer pricing in Gymshark-operated stores", "No evidence in the assigned pool shows whether store pricing equals online pricing after markdowns or local taxes", "Markdown policy and store-specific promotions are undisclosed", "Retail economics cannot be inferred from revenue growth alone"]
      - [U.S. wholesale launch, "Wholesale transfer pricing and partner margin", "No public contract terms or wholesale realization metrics in assigned evidence", "Sell-in discounts, co-op marketing, returns, and replenishment terms are undisclosed", "Wholesale may diversify GTM while lowering blended gross margin"]
      - [Community events / brand activations, "No direct ticket price disclosed", "Evidence points to events as funded brand/community investment rather than explicit paid monetization", "Attendance cost to consumers is described as zero in trade coverage", "Treat as acquisition and retention spend until monetization evidence appears"]
    notes: "Assigned sources do not retain SKU-level list prices or contract terms, so this table separates channel form from monetization unknowns."
    claimRefs: [CI007, CI008, CI011, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY25 revenue", "£646 million", Medium, "Confirms scaled demand and headline growth base", "Reconcile filed accounts to monthly run-rate, geography, and category mix"]
      - ["FY25 revenue growth", "6.4% YoY", Medium, "Shows growth persisted, but at slower mature-brand pace than earlier eras", "Split growth into price, unit volume, and channel expansion"]
      - ["Gross margin", "62.3%", Medium, "Suggests healthy gross-profit structure for an apparel brand", "Provide gross margin bridge by DTC, retail, and wholesale plus returns/write-offs"]
      - ["EBITDA", "£53.3 million", Medium, "Indicates cash earnings capacity before expansion spend below EBITDA", "Provide EBITDA-to-operating-cash-flow bridge and capex schedule"]
      - ["Pre-tax profit", "£7 million", Medium, "Shows profitability remains positive but compressed", "Break out incremental store, event, and project spend depressing profit"]
      - ["Year-end cash", ">£37 million", Medium, "Positive liquidity signal, but insufficient to judge runway without burn and working-capital detail", "Provide monthly cash bridge, revolver/debt capacity, and covenant headroom"]
      - ["Year-end inventory", ">£117 million", Medium, "Large inventory balance can either support growth or mask markdown/working-capital risk", "Provide inventory turns, aged stock, write-down policy, and returns reserve"]
      - ["CAC / payback", null, Low, "Critical to judge whether community-led growth still scales efficiently", "Provide blended and incremental CAC, payback, and paid-vs-organic mix"]
      - ["Store-level contribution margin", null, Low, "Needed to assess whether physical retail is accretive or brand-led only", "Provide store 4-wall margin, payback period, and same-store sales"]
      - ["Customer concentration / wholesale dependency", null, Low, "Needed because new wholesale can improve reach while adding counterparty risk", "Provide top-account share of revenue and terms with Dick's / other partners"]
    notes: "Null rows mark material public-data gaps rather than zero values; confidence reflects source quality and corroboration, not management certainty."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI011]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a DTC-led model widened by owned stores and early wholesale, with strong gross margin but profit intentionally compressed by reinvestment.
    data:
      nodes:
        - label: Community and creator-led demand
          detail: Founder story and later trade coverage point to creator/community-led traffic rather than legacy wholesale-led distribution.
        - label: DTC online stores
          detail: Gymshark says it serves customers in 200+ countries through 14 online stores.
        - label: Owned retail stores
          detail: Physical stores and flagships have expanded across the UK, Europe, Middle East, and U.S.
        - label: Selective wholesale
          detail: Dick's House of Sport became the first U.S. wholesale partner in 12 stores in October 2025.
        - label: FY25 revenue
          value: "£646m"
          detail: Revenue grew 6.4% year on year, extending the growth streak to 13 years.
        - label: FY25 gross profit and reinvestment
          value: "GM 62.3%; EBITDA £53.3m; PBT £7m"
          detail: Gross margins remained strong while profits were intentionally compressed by store, community, and adjacent-project investment.
    approximationNotes: "Sequence expresses commercial flow and disclosed outcomes, not a quantified channel mix or mathematically balanced bridge."
    claimRefs: [CI001, CI002, CI003, CI004, CI007, CI008, CI011, CI014]
