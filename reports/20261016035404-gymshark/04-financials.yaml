company:
  name: Gymshark
chapter:
  number: 4
  title: Financials
  summary: >-
    Public FY25 evidence shows Gymshark still growing at scale, with revenue up to £646 million,
    gross margin reported at 62.3%, and EBITDA at £53.3 million, but with deliberately compressed
    pre-tax profit as management funds stores, community events, and adjacent projects. The model
    still appears DTC-first, with selective wholesale only recently added, while core underwriting
    gaps remain around realized pricing, channel mix, CAC/payback, returns, inventory turns, and
    store-level economics.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Assigned evidence supports a revenue engine built first around direct-to-consumer ecommerce,
      then widened into owned stores, with selective wholesale only added recently. Gymshark's own
      origin story says the initial site drop-shipped third-party products for a small margin before
      the company scaled self-designed apparel, while ENEB still characterizes the model as having
      been built around selling through the official online store rather than legacy wholesale.
      Current public scale is substantial: Gymshark says it serves customers in more than 200
      countries via 14 online stores, and trade coverage reports FY25 revenue of £646 million,
      up 6.4% year on year, extending the brand's growth streak to 13 consecutive years. The
      important underwriting distinction is that scale is visible, but revenue mix is not: public
      sources do not break out ecommerce, owned-retail, wholesale, geography, or product-category
      contribution.
    claimRefs: [CI001, CI002, CI008, CI010, CI011, CI014]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: profitability-and-capital-intensity
    title: Profitability and capital intensity
    body: >-
      FY25 looks profitable but deliberately margin-constrained. Independent trade coverage reports
      pre-tax profit of £7 million, down from £11.9 million in FY24, while EBITDA still reached
      £53.3 million and gross margin was reported at 62.3%. That combination matters: the public
      record does not show a broken gross-profit engine, but it does show management choosing to
      absorb expansion costs rather than maximize near-term earnings. Ben Francis's results
      commentary, as relayed by SGI Europe and SGB Media, ties that compression to store openings,
      community investment, and a separate undisclosed project. The latest reported balance-sheet
      signals are still positive rather than distressed, with year-end cash above £37 million and
      inventory just above £117 million, but inventory is large enough that turns, markdowns,
      obsolescence, and returns become first-order diligence topics.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI003]
  - id: capital-adequacy-and-control
    title: Capital adequacy and ownership context
    body: >-
      Public evidence does not indicate an immediate funding emergency, but it also does not
      provide the detail needed to underwrite next-round timing or downside resilience. Companies
      House shows FY25 subsidiary accounts and parent consolidated accounts were filed in April
      2026, so FY25 metrics are now formally anchored to filed accounts rather than only to
      pre-filing management commentary. The same registry trail also shows control moving to
      Gymshark Topco Limited as the registered person with significant control effective 31 July
      2025, which suggests current ownership should be evaluated at holdco level rather than
      through founder-only records. Secondary analysis still frames the 2020 General Atlantic
      transaction as a minority deal used for expansion and infrastructure, but assigned 2026
      evidence does not disclose any new equity round, debt facility, or revised valuation.
    claimRefs: [CI012, CI013, CI015]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial picture is directionally attractive but not yet underwritable from public data
      alone. Revenue quality appears better than a pure top-line story because gross margin stayed
      strong even as the company invested heavily, and recent physical-retail plus first-wholesale
      moves create more channels than the original DTC-only model. However, the underwriting blind
      spots are still material: there is no public split of DTC versus store versus wholesale
      revenue, no realized pricing or discount cadence, no paid-acquisition efficiency disclosure,
      no returns data, no customer concentration data, and no store-level four-wall economics.
      The working conclusion is that Gymshark looks like a scaled and still-profitable consumer
      brand funding deliberate expansion from operations, but any view on margin path, cash runway,
      or next financing dependency still needs private operating detail.
    claimRefs: [CI004, CI007, CI008, CI011, CI014, CI015]
callouts:
  - calloutType: insight
    title: DTC still appears to be the economic center
    body: >-
      Public evidence points to ecommerce as the core engine, with owned retail and wholesale
      broadening distribution only recently and without disclosed channel-level revenue mix.
    claimRefs: [CI008, CI010, CI011, CI014]
  - calloutType: risk
    title: Public unit economics are still too coarse for underwriting
    body: >-
      Revenue, margin, cash, and inventory are visible, but realized pricing, returns, CAC/payback,
      inventory turns, and store-level profitability remain undisclosed in assigned evidence.
    claimRefs: [CI004, CI005, CI006]
