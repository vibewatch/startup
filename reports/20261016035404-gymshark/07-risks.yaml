  evidenceGaps:
    - type: missing-source
      severity: material
      topic: legal-compliance-oversight
      missingEvidence: Current complaint filings, Gymshark's formal response, creator-disclosure control design, and board or counsel oversight of cross-border ad compliance.
      whyItMatters: Without litigation posture and internal control evidence, the highest-ranked legal risk cannot be sized cleanly or downgraded from a thesis-level issue.
      diligencePath: Obtain the filed complaint and response set, current influencer contract templates, escalation logs, and the executive owner for disclosure compliance.
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: store-economics-and-inventory
      missingEvidence: Store-level contribution margins, lease commitments by site, inventory aging, markdown cadence, returns rates, and post-restructure operating KPIs.
      whyItMatters: The bull case depends on expansion creating durable demand leverage rather than trapping more working capital and fixed costs in a slower-growth business.
      diligencePath: Request FY26 monthly management accounts, store cohort economics, inventory aging reports, and the restructuring scorecard used by finance and operations.
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: governance-and-capital-alignment
      missingEvidence: Shareholder-rights terms, current board composition and committee ownership, and any agreed framework for a General Atlantic stake buyback.
      whyItMatters: Founder concentration can be a moat or a governance risk; the difference depends on minority protections, succession planning, and capital-allocation rights.
      diligencePath: Review the cap-table and shareholders' agreement, inspect board and committee materials, and confirm whether any buyback or secondary transaction is under negotiation.
      relatedTableRefs: [TR003]
