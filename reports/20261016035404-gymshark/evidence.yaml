evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      A post-2020 financing, tender, secondary transaction, or management statement that refreshes Gymshark's current
      valuation.
    whyItMatters: >-
      The last disclosed valuation is the August 2020 General Atlantic deal, so current enterprise value and founder
      mark-to-market are not supportable from assigned evidence.
    diligencePath: >-
      Request the latest board deck, cap table, secondary paperwork, or investor materials covering any 2025-2026
      price-setting event.
  - type: private-evidence-only
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A current active-customer, repeat-purchase, or cohort count rather than country footprint and social reach
      proxies.
    whyItMatters: Coverage and followers do not establish customer density, retention quality, or monetization efficiency.
    diligencePath: Request monthly active customers, repeat-rate, cohort, and geographic revenue split in the data room.
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and any shareholder-rights summary following the 2020 investment.
    whyItMatters: >-
      Public evidence shows executive names and one 2020 board addition, but not the full governance perimeter or
      independent oversight.
    diligencePath: Request current board materials, committee charters, and post-transaction governance documents.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: adverse-legal
    missingEvidence: A court filing, regulator record, or higher-tier report that confirms or refutes the mid-2026 lawsuit allegation.
    whyItMatters: >-
      The only adverse legal item in the assigned pool comes from a low-reputation source, so it is not strong enough to
      treat as a settled company risk.
    diligencePath: >-
      Search court dockets, request counsel summary, and check higher-tier reporting before elevating the allegation
      into the core risk register.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Segment-level spend for weight-training and conditioning apparel by geography and channel, plus a public bridge
      from category totals to the specific audiences Gymshark serves.
    whyItMatters: >-
      Broad athleisure figures overstate the investable market unless they can be narrowed into the segments Gymshark
      can realistically win.
    diligencePath: >-
      Obtain analyst datasets or management segmentation that separate gym-apparel demand, DTC share, and
      target-customer cohorts by region.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Cohort-level repeat purchase, CAC/LTV, app engagement by segment, and omnichannel conversion economics by market.
    whyItMatters: >-
      These metrics determine whether community-led demand is durable and whether US retail or wholesale expansion
      expands the served market or only shifts channel mix.
    diligencePath: >-
      Request cohort retention, paid versus organic mix, and store-to-digital conversion data by geography and customer
      segment.
    relatedQuestionRefs:
      - QM002
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: price-parity
    missingEvidence: >-
      Exact current SKU-level prices and checkout terms for comparable Gymshark, Lululemon, Nike, Adidas, and Alo
      products in the same region and currency.
    whyItMatters: >-
      The chapter can place Gymshark in a mid-market band, but it cannot quantify current premium or discount distance
      without direct product-page evidence.
    diligencePath: >-
      Collect current product pages and checkout screenshots for matched leggings, tops, and training accessories across
      the named brands.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Repeat-purchase cohorts, app retention, paid app conversion, and event-to-purchase conversion data by customer
      segment.
    whyItMatters: >-
      Community is the central moat thesis, but the assigned pool does not show whether it creates durable switching
      costs instead of repeated top-of-funnel spend.
    diligencePath: >-
      Request internal repeat-rate, retention, app engagement, and community event conversion cohorts segmented by
      geography and category.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: status-quo-substitutes
    missingEvidence: >-
      Public evidence on retailer private-label, gym-merchandise, or self-sourced apparel options as low-end substitutes
      for Gymshark buyers.
    whyItMatters: >-
      The chapter can document dupes and incumbents, but it cannot fully score the internal-build or status-quo
      substitute path with the assigned pool.
    diligencePath: >-
      Pull public assortments from gym chains, sports retailers, and private-label activewear sellers in a later refresh
      or customer chapter follow-up.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Detailed CAC, payback, repeat purchase, returns, and markdown data by DTC, retail, and wholesale channel.
    whyItMatters: >-
      These metrics determine whether current growth is being bought efficiently or is masking deteriorating
      contribution economics.
    diligencePath: >-
      Request channel P&Ls, cohort retention, paid-versus-organic acquisition mix, and returns reserve disclosures from
      the data room.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: store-economics
    missingEvidence: Store-level revenue, 4-wall contribution margin, opening capex, labor cost, and payback period by location cohort.
    whyItMatters: >-
      Physical retail is a visible growth lever, but it can either enhance brand economics or dilute them if new stores
      are capital intensive.
    diligencePath: >-
      Request store cohort model, same-store sales bridge, rent terms, and capex schedule for every opened and planned
      site.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: financing-dependency
    missingEvidence: >-
      Current debt facilities, covenant headroom, working-capital financing, and any FY26 fundraising or refinancing
      plan.
    whyItMatters: >-
      Public cash alone is not enough to judge runway or next-round dependency while inventory and store expansion
      remain meaningful.
    diligencePath: Request treasury pack, debt agreements, monthly cash bridge, and board materials describing FY26 capital planning.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: technology-controls
    missingEvidence: >-
