  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technology-controls
      missingEvidence: A current trust center, privacy/security policy bundle, uptime history, or architecture documentation for Gymshark's commerce and app stack.
      whyItMatters: The assigned pool supports the brand and channel thesis but does not show the reliability, integration burden, or control maturity of the digital stack carrying most transactions.
      diligencePath: Request architecture diagrams, incident history, privacy/security policies, and any third-party assurance reports for the website and app.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: product-quality
      missingEvidence: Return-rate, defect-rate, sell-through, and product-test data by major apparel line.
      whyItMatters: The chapter can describe the assortment and innovation assets, but it cannot test whether product quality and repeatability match the growth narrative.
      diligencePath: Request merchandise QA dashboards, returns/defects by collection, and any lab or wear-test standards used before launches.
      relatedQuestionRefs: [QE002, QE006]
      relatedTableRefs: [TE001]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A practitioner proxy such as app-store metrics, public engineering talks, partner integration docs, or other developer/community signal for the digital product layer.
      whyItMatters: Without a practitioner signal, the app/content layer and technical maturity are judged mainly from company and brand narratives rather than external usage or engineering evidence.
      diligencePath: Collect app-store reviews/download proxies, engineering hiring materials, public partner docs, or talks that describe the digital product surface.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: minor
      topic: fitness-expansion
