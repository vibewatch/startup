callouts:
  - calloutType: strength
    title: Creator-to-commerce loop is the clearest moat in the assigned pool
    body: >-
      Across official and independent sources, Gymshark's strongest product
      differentiator is the way creator relationships, community identity, and
      owned digital commerce reinforce one another.
    claimRefs: [CE007, CE008, CE009, CE013]
  - calloutType: risk
    title: Technical-control evidence lags the commercial narrative
    body: >-
      The assigned pool supports scale and product breadth, but it does not
      provide direct evidence on security, privacy, uptime, systems integration,
      or product-quality controls.
    claimRefs: [CE012, CE013, CE016]
