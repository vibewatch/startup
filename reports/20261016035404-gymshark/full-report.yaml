      - number: '2.2'
        title: Sizing lenses show context and realized scale, not a proven SAM
        blocks:
          - type: paragraph
            body: |-
              The strongest public sizing work is a stack of imperfect lenses rather than a
              clean TAM-SAM-SOM bridge. Broad category context exists through third-party
              market summaries, but those figures are wider than Gymshark's lifter/conditioning
              wedge and come through an aggregator rather than directly from the underlying
              analyst reports. The more decision-useful numbers are Gymshark's own realized
              scale and mix: record FY2025 revenue of £646 million, a historically DTC-heavy
              model, and a disclosed FY2024 regional base where the US is already the largest
              geography. Those figures show that the company is not early-stage demand discovery;
              it is monetizing a large niche already. What remains unproven in public evidence is
              how much of the broad athleisure or gym-apparel category is realistically reachable
              for Gymshark by segment, geography, and channel.
