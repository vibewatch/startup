        blocks:
          - type: paragraph
            body: >-
              The most important product/technology risks in the assigned pool come from what is not disclosed and from
              how much the model depends on creator-led marketing. Third-party profiles report commercial disputes with
              influencers and a 2021 copyright lawsuit tied to promotional video music, which both point to compliance
              and governance pressure around the same creator engine that built the brand. A separate 2026 profile says
              Gymshark plans a Miami gym format, but the pool does not include company confirmation or operating
              economics, so underwriting a move into a broader fitness ecosystem would be premature. Until diligence
              gets direct evidence on the commerce/app stack, privacy and security controls, and product-quality KPIs,
              the technical side of the Gymshark story remains materially under-evidenced.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Creator-to-commerce loop is the clearest moat in the assigned pool
            body: >-
              Across official and independent sources, Gymshark's strongest product differentiator is the way creator
              relationships, community identity, and owned digital commerce reinforce one another.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE013
          - type: callout
            title: Technical-control evidence lags the commercial narrative
            body: >-
              The assigned pool supports scale and product breadth, but it does not provide direct evidence on security,
              privacy, uptime, systems integration, or product-quality controls.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and channel model
        blocks:
          - type: paragraph
            body: >-
              Gymshark still presents itself as a consumer brand built for a training community rather than a wholesale
              buyer base. Its official materials describe a broad conditioning audience and pair product with content
              and community, while third-party writeups consistently frame the business as direct-to-consumer and
              globally distributed. The public scale signals are meaningful but imperfect: the company cites customers
              in over 200 countries across 14 online stores, while outside profiles round the reach to 230 countries and
              add large follower and customer-family counts. That is enough to show real international adoption, but not
              enough to distinguish unique buyers from followers, event attendees, or one-time purchasers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption proof comes from participation rather than disclosed cohorts
        blocks:
          - type: paragraph
            body: >-
              Gymshark’s strongest public proof of adoption is not enterprise-style logo evidence or disclosed retention
              curves; it is repeated participation in creator-led and community-led programs. Independent analysis and
              Gymshark’s own history both point to a playbook built around creator partnerships, expos, city events,
              social challenges, and content that keeps customers interacting with the brand between purchases.
              Gymshark66 is the clearest recurring proof surface because it turns customers into content producers and
              returns annually, while official and third-party narratives around expos, flagship openings, and city
              events show the company deliberately investing in physical touchpoints to reinforce online community
              behavior. That is persuasive evidence of engagement, but not a substitute for purchase-frequency, cohort,
              or renewal disclosure.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration risk remain under-documented
        blocks:
          - type: paragraph
            body: >-
              The current customer story is directionally positive but still under-instrumented for diligence. Gymshark
              is extending the model beyond pure e-commerce through flagships, a Miami gym concept, and its first major
              US wholesale placement, which suggests management sees owned or semi-owned physical presence as a way to
              compound loyalty and distribution. But the assigned pool does not disclose net revenue retention, gross
              retention, repeat-purchase rate, or customer concentration by geography or channel partner, so it is
              impossible to quantify whether community engagement is producing durable economics. The one clear adverse
              signal in this pool is a 2026 allegation around deceptive influencer marketing, which matters because
              customer trust is central to a creator-led acquisition model.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Community gives Gymshark a real owned-channel moat
            body: >-
              Gymshark’s strongest public customer proof is not a named enterprise roster; it is a repeatable system
              that links creator discovery, owned DTC checkout, and recurring community touchpoints across events,
              challenges, and flagships.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Durability is plausible, but public retention and concentration data are still missing
            body: >-
              The brand has enough public adoption proof to show real scale, but not enough disclosed cohort,
              repeat-purchase, or channel-mix data to prove how durable the customer base is as Gymshark adds wholesale
              and owned physical infrastructure.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The risk stack is led by creator-marketing compliance because the same influencer engine that powered
              Gymshark's rise is now the subject of a proposed class action over allegedly undisclosed paid
              partnerships. That legal exposure matters more because FY25 profitability was only £7 million on £646
              million of revenue while inventory exceeded £117 million, so operating cushion is narrower than the
              brand's scale might suggest. The next layer is execution: Gymshark is adding stores, events, and a
              gym-adjacent footprint just as independent analysis says the old creator-led differentiation has been
              copied by larger rivals and the cost base is becoming more fixed. The practical underwriting posture is
              therefore to treat compliance discipline, inventory turns, and investor/founder alignment as live go/no-go
              indicators rather than back-office details.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
              - CR014
      - number: '7.2'
        title: Legal and compliance concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to one concrete legal exposure and two adjacent compliance concerns. Inc. reports
              that a proposed U.S./Canada class action alleges Gymshark's influencer partners were not clearly disclosed
              as paid advertisements despite FTC requirements, and the complaint frames the issue as part of the brand's
              long-running growth system rather than a single post gone wrong. That matters because company and
              independent profiles alike describe creator partnerships, community events, and social platforms as
              foundational to Gymshark's commercial model. At the same time, scale now spans more than 10 million
              customers in 230 countries, which raises the stakes for cross-border advertising, consumer-protection, and
              app/data-governance execution even though the assigned public pool does not surface enough primary
              compliance documentation to score those mitigations as proven.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
      - number: '7.3'
        title: Operating and financial execution risk
        blocks:
          - type: paragraph
            body: >-
              The core operating question is whether Gymshark is temporarily depressing profit to buy durable
              omnichannel scale, or whether it is hard-wiring a heavier cost base into a still-single-category apparel
              business. FY25 revenue reached £646 million with 62.3% gross margin and £53.3 million of EBITDA, but
              pretax profit was only £7 million, inventory finished above £117 million, and management said strong
              inventory actions were needed. Independent commentary goes further, arguing that new flagships and related
              physical expansion added multi-year lease obligations and that an April 2025 restructuring put 296 roles
              at risk while 168 new roles were created. The mitigation is not absent—cash was above £37 million and
              management continues to reinvest rather than pay dividends—but the public record still leaves store
              payback, aged inventory, and margin recovery insufficiently disclosed.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR015
      - number: '7.4'
        title: Dependency, mitigation, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Gymshark still depends on three relationships it does not fully control: creator/platform distribution,
              founder-centric brand stewardship, and minority-capital alignment with General Atlantic. Official history
              pages still position the business around the Gymshark family and Ben Francis's brand leadership, while
              independent profiles emphasize that the 2020 General Atlantic investment remains the last disclosed
              valuation benchmark and that 2026 reporting discussed a partial buyback. Those facts do not make the model
              uninvestable, but they do define the diligence bar. A thesis-break should be assumed if the
              influencer-marketing litigation expands, if FY26 growth does not reaccelerate while inventory and fixed
              retail commitments remain elevated, or if governance/investor-rights review shows founder control or
              minority protections are materially misaligned with outside capital.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real business rather than a concept brand: Gymshark says it sells into more
              than 200 countries through 14 online stores, has more than 900 employees, and has built a social audience
              above 18 million. Independent sources also show that revenue kept rising into FY2025 and that the company
              still runs mostly online, which matters because the creator-led direct-to-consumer model remains the
              clearest part of the moat. The problem is not quality but price discovery. The last widely cited external
              mark still points back to the 2020 General Atlantic transaction, while fresh profitability, cap-table, and
              litigation detail remain incomplete. That makes the prudent recommendation track / research more, with any
              serious entry discussion anchored at or below the last disclosed round rather than at a fresh premium.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Public valuation context
        blocks:
          - type: paragraph
            body: >-
              The strongest disclosed pricing evidence is still historical. Tracxn records a $261 million August 2020
              round and presents a $1.3 billion valuation anchor, while multiple independent writeups describe the same
              General Atlantic deal as a 21 percent stake sale at roughly a £1 billion valuation. Later public reporting
              points to founder buyback discussions rather than a new priced round, which is useful as a control signal
              but not a new market-clearing mark. In other words, the public record shows that Gymshark already reached
              unicorn status and has sustained revenue scale, but it does not yet show that outside investors have
              repriced the business upward since 2020.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario framework
        blocks:
          - type: paragraph
            body: >-
              The bull case needs more than brand admiration: it needs evidence that creator-led demand, online-first
              distribution, and current revenue scale can translate into defendable margins and a fresh arm's-length
              price. The base case is easier to support because the public record shows continued growth, durable
              digital distribution, and community depth, but no new price anchor. The bear case is also tangible because
              competitive intensity is high, control remains founder concentrated, and any real legal or brand
              controversy can compress appetite quickly when the external mark is stale. The valuation stance therefore
              stays price-sensitive rather than quality-insensitive.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Gymshark looks more like a patient-capital hold than an IPO-underwriting candidate from public evidence
              alone. The business has the scale and brand proof to support continued strategic optionality, but
              investors still need current filed accounts, current margin detail, any 2025 to 2026 secondary pricing,
              cap-table preferences, and a verified update on the reported influencer-marketing lawsuit before
              underwriting a target return. If management can show that FY2025 to FY2026 margin quality held up while
              the business kept compounding online, the recommendation can move. If not, or if a deal is marketed above
              the stale 2020 anchor without new third-party evidence, that is a thesis-break trigger rather than a
              buying opportunity.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track / research more. Public evidence supports quality and scale, but not a premium valuation above the
              stale 2020 external mark without fresh diligence.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV015
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              If a new financing or secondary process asks investors to pay above the last disclosed round without
              current audited margin, cap-table, and litigation detail, the underwriting case breaks.
            calloutType: risk
            claimRefs:
              - CV010
              - CV013
              - CV015
              - CV016
