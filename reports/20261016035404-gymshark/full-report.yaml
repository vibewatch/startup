      - number: '3.2'
        title: Route-to-market, not only brand awareness, defines the buyer tradeoff
        blocks:
          - type: paragraph
            body: >-
              Competitive tradeoffs follow from route-to-market more than from raw awareness. Triple Whale says only
              3.6% of revenue was non-DTC in the cited snapshot, while official pages and Wikipedia show a wider surface
              than apparel alone, including 14 online stores, a training app with free and premium plans, and community
              activations that are being converted into owned distribution. That matters because it gives Gymshark more
              control over merchandising, data capture, and brand presentation than incumbent wholesale-heavy players,
              while also widening the set of substitutes from simple apparel rivals to hybrid lifestyle and training
              ecosystems. Public evidence is thinner on exact SKU-level price parity: Latterly places Gymshark in a
              mid-market band between value basics and luxury labels, but the assigned pool does not include
              like-for-like product pages for Gymshark versus Lululemon, Nike, Adidas, or Alo. The competitive question
              is therefore less about who is cheapest and more about whether Gymshark can preserve mid-market pricing
              while expanding women’s depth, app usage, events, wholesale, and store surfaces.
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
