  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Gymshark’s public customer journey compounds creator discovery, owned DTC purchase, and repeated community
      touchpoints.
    data:
      nodes:
        - label: Creator discovery
          actor: Prospective customer
          channels:
            - YouTube
            - Instagram
            - TikTok
          touchpoints:
            - Early product seeding to trusted fitness creators built initial attention without traditional advertising.
            - Platform-native content remains a primary top-of-funnel discovery surface.
        - label: Community follow
          actor: Follower / fan
          channels:
            - Owned social channels
          touchpoints:
            - Official materials cite over 18 million social followers and a 10 million-plus Gymshark family signal.
            - Reach is large, but public sources do not separate followers from active buyers.
        - label: Owned DTC purchase
          actor: Buyer = user = payer
          channels:
            - 14 online stores
          touchpoints:
            - The historical moat was direct-to-consumer ownership of the customer relationship.
            - Public sources consistently describe customers in 200+ countries.
        - label: Participation loop
          actor: Customer / advocate
          channels:
            - Gymshark66
            - Training App
            - UGC
          touchpoints:
            - Gymshark66 turns customers into content producers and creates annual habit-based re-engagement.
            - Thousands of participants globally take part each year, but conversion to purchases is undisclosed.
        - label: Offline brand experience
          actor: Shopper / community member
          channels:
            - Events
            - Flagships
          touchpoints:
            - Expos, city events, and the Regent Street flagship bring the online community into physical spaces.
            - Official narratives frame these spaces as community moments, not just retail doors.
        - label: Channel expansion
          actor: Omnichannel shopper
          channels:
            - Dick’s House of Sport
            - Miami gym
          touchpoints:
            - Recent expansion adds wholesale and owned gym touchpoints to the historical DTC model.
            - The move may widen distribution, but public sources do not yet show retention or margin outcomes.
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU008
      - CU009
      - CU010
