              - CI006
              - CI011
      - number: '4.3'
        title: Capital adequacy and ownership context
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not indicate an immediate funding emergency, but it also does not provide the detail
              needed to underwrite next-round timing or downside resilience. Companies House shows FY25 subsidiary
              accounts and parent consolidated accounts were filed in April 2026, so FY25 metrics are now formally
              anchored to filed accounts rather than only to pre-filing management commentary. The same registry trail
              also shows control moving to Gymshark Topco Limited as the registered person with significant control
              effective 31 July 2025, which suggests current ownership should be evaluated at holdco level rather than
              through founder-only records. Secondary analysis still frames the 2020 General Atlantic transaction as a
              minority deal used for expansion and infrastructure, but assigned 2026 evidence does not disclose any new
              equity round, debt facility, or revised valuation.
            claimRefs:
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial picture is directionally attractive but not yet underwritable from public data alone.
              Revenue quality appears better than a pure top-line story because gross margin stayed strong even as the
              company invested heavily, and recent physical-retail plus first-wholesale moves create more channels than
              the original DTC-only model. However, the underwriting blind spots are still material: there is no public
              split of DTC versus store versus wholesale revenue, no realized pricing or discount cadence, no
              paid-acquisition efficiency disclosure, no returns data, no customer concentration data, and no
              store-level four-wall economics. The working conclusion is that Gymshark looks like a scaled and
              still-profitable consumer brand funding deliberate expansion from operations, but any view on margin path,
              cash runway, or next financing dependency still needs private operating detail.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI011
              - CI014
              - CI015
