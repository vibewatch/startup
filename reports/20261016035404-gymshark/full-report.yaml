        title: Operating model and channel architecture
        blocks:
          - type: paragraph
            body: >-
              The operating model in the assigned sources is firmly owned-channel and online-first. Gymshark says it
              serves customers in more than 200 countries through 14 online stores, while third-party profiles describe
              the website and app as the primary transaction layer and frame physical stores as complementary experience
              hubs rather than a wholesale-led expansion. That model is reinforced by named infrastructure around
              product development, such as the Solihull design rooms and product innovation centre, but the public
              record still stops short of disclosing the underlying commerce stack, integration architecture, uptime
              history, or security controls. From a diligence perspective, the evidence supports scale and channel
              concentration, but not the resilience of the systems carrying that concentration.
            claimRefs:
