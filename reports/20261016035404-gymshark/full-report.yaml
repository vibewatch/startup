chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              Gymshark's own history pages and multiple independent profiles tell a consistent first chapter: the
              business was incorporated in 2012, started as a lightweight ecommerce site, and shifted from supplement
              dropshipping into self-made apparel built around the founders' own training preferences. The brand still
              frames itself less as a wholesale sportswear label than as a direct-to-consumer conditioning community
              that sells apparel, content, and events through its own digital surfaces. That identity matters for the
              rest of the diligence file because the company's brand, distribution, and community engine are tightly
              coupled rather than separable business lines. The same origin story also explains why later chapters
              should treat creator marketing and owned-channel commerce as core operating infrastructure rather than
              incidental acquisition tactics. [CO001] [CO002] [CO003] [CO004] [CO005] [CO006]
            claimRefs:
