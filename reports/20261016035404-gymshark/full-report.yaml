      - number: '1.3'
        title: Funding history, current scale signals, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              Funding disclosure is narrow but clear. The assigned evidence consistently points to one first external
              round in August 2020, when General Atlantic took a 21% stake at a valuation above £1 billion, leaving
              Francis with majority control. Since then, public scale disclosure has broadened more through company
              operating signals and independent profile updates than through fresh capital market events: Gymshark says
              it has more than 900 employees and customers in 200+ countries, while an independent 2026 profile cites
              FY25 revenue of £646 million and a 2025 restructuring that cut around 300 roles. The milestone arc also
              shows deliberate omnichannel experimentation—especially the 2022 Regent Street flagship—without evidence
              that the company has abandoned its online-first model. The only clearly adverse 2026 item in the assigned
              pool is an uncorroborated low-tier allegation about influencer-marketing practices, so it should stay in
              the diligence queue rather than graduate into a settled legal fact. [CO010] [CO011] [CO013] [CO014]
