            around owned community-first distribution.
          claimRefs:
            - CP005
            - CP006
            - CP012
            - CP015
        - label: Lululemon
          x: 3
          'y': 5
          detail: >-
            Premium brand depth and scale are high; Gymshark’s retail push enters Lululemon’s turf rather than avoiding
            it.
          claimRefs:
            - CP015
            - CP016
        - label: Creator-led copycats
          x: 4
          'y': 2
          detail: >-
            Social-first challengers can replicate tone and creator motion quickly, which weakens Gymshark’s original
            channel arbitrage.
          claimRefs:
