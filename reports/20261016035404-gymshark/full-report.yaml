      - number: '2.3'
        title: Adoption still runs through community, but the next leg depends on omnichannel proof
        blocks:
          - type: paragraph
            body: |-
              Gymshark's adoption engine has been community-first from the start: creator
              partnerships, events, and now app-led habit loops pull customers into an owned
              relationship instead of relying on wholesale shelf space. That explains why buyer
              acquisition and retention are tied to motivation, identity, and ongoing engagement
              as much as to technical apparel features. The current market question is different
              from the founding one. Public reporting says the US is the clearest route to the
              billion-dollar sales target, and the company is layering in flagship, experiential,
              and selective wholesale formats to widen reach. That should expand discovery and
              trial, but it also introduces the main constraints: influencer saturation, community
              backlash if authenticity slips, and the risk that omnichannel growth changes the
              economics of a model built on owned-channel intimacy.
            claimRefs:
              - CM004
              - CM009
