            - CV005
            - CV014
        - from: Stale price anchor
          to: Control concentration
          label: Tempered by
          relationship: Governance and seller incentives matter more when pricing is old.
          claimRefs:
            - CV010
            - CV011
        - from: Control concentration
          to: Downside can widen
          label: Can compress appetite
          relationship: Ownership and legal noise can reduce willingness to pay up.
          claimRefs:
            - CV010
            - CV013
        - from: Downside can widen
          to: Recommendation
          label: Therefore
          relationship: Without fresh price discovery, discipline matters more than admiration.
          claimRefs:
            - CV015
            - CV016
    approximationNotes: null
