        title: Exhibits
        blocks:
          - type: callout
            title: DTC still appears to be the economic center
            body: >-
              Public evidence points to ecommerce as the core engine, with owned retail and wholesale broadening
              distribution only recently and without disclosed channel-level revenue mix.
            calloutType: insight
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI014
          - type: callout
            title: Public unit economics are still too coarse for underwriting
            body: >-
              Revenue, margin, cash, and inventory are visible, but realized pricing, returns, CAC/payback, inventory
              turns, and store-level profitability remain undisclosed in assigned evidence.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI006
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and portfolio
        blocks:
          - type: paragraph
            body: >-
              Gymshark started as a supplement dropship site, but the product thesis that survived was fitted gym
              apparel made for lifters who felt incumbent sportswear missed their use case. The current public package
              is broader than clothing alone: official and third-party sources describe an offer that combines apparel,
              workout content, community identity, and a training app. The portfolio has also broadened from an initial
              male weight-training base into women's seamless families and a more complete training assortment, which
              matters because the business is now underwriting repeat product drops and brand engagement rather than a
              single hero SKU. What remains thin in the assigned pool is hard evidence on product-level performance,
              defect rates, or sell-through by line.
            claimRefs:
