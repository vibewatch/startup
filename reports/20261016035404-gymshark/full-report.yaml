      - number: '1.2'
        title: Leadership, founder dependence, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a concentrated leadership structure. Ben Francis remains the symbolic and operating
              center of the company as founder and current CEO, supported by a named commercial, technology, people,
              finance, and brand bench. That breadth reduces pure single-executive execution risk, but it does not
              remove founder concentration because the public record still ties the brand's identity, product taste, and
              strategic control unusually closely to Francis. The 2017 CEO handoff to Steve Hewitt and Francis's 2021
              return suggest Gymshark can professionalize around the founder when needed, yet the assigned pool still
              leaves board composition and independent oversight under-disclosed outside one board addition tied to the
              2020 deal. For diligence, that makes governance transparency a live follow-up item rather than a closed
              fact. [CO007] [CO008] [CO009] [CO011] [CO012] [CO015]
