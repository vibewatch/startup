      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - >-
          Gymshark already has global digital scale with customers in 200+ countries, 14 online stores, and FY2025
          revenue of £646 million
        - Evidence of slowing core demand or meaningful channel leakage would weaken the scale case
      - - Thesis
        - >-
          The creator-led D2C model still looks differentiated because the business remains mostly online and kept
          compounding through community-led distribution
        - Fresh data showing margin erosion or sharply rising customer-acquisition costs would reduce the moat value
      - - Anti-thesis
        - >-
          The public valuation anchor is still the 2020 General Atlantic deal, so paying a fresh premium would rely on
          unverified assumptions
        - A new primary or secondary transaction with contemporaneous terms would resolve the pricing gap
      - - Anti-thesis
        - >-
          Founder-control concentration and reported legal scrutiny can compress appetite if they expand while price
          remains stale
        - >-
          A broader board, verified litigation resolution, and cleaner governance disclosure would improve
          underwriteability
    notes: >-
      Evidence rows mix official and independent sources; price sensitivity is driven by the lack of a fresh external
      market mark rather than by weak operating scale.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          FY2025-FY2026 growth reaccelerates, the D2C model sustains margin quality, and a new transaction clears at or
          above the last disclosed mark
        - Only then does a premium to the 2020 anchor become defensible
        - Competitive spend rises faster than community-led demand; legal noise expands
        - Not yet shown in the assigned public evidence
      - - Base
        - Scale remains durable, sales stay majority online, and no new priced round emerges
        - Fair only around or below the last disclosed 2020 unicorn mark until diligence closes the information gap
        - Stale pricing can still trap entry if sellers market to peak-brand narratives
        - Most consistent with the current public record
      - - Bear
        - Growth or margins soften while governance or lawsuit risk widens and sellers still ask for a premium
        - Any ask above the stale mark becomes hard to justify and raises markdown risk
        - Brand sentiment or creator efficiency deteriorates while competitors stay well funded
        - Probability rises if current audited metrics are not shared
    notes: >-
      Scenario logic is intentionally qualitative because the pool lacks current EBITDA, cash-flow, and cap-table data
      needed for precise ranges.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Gymshark's public milestones show a repeat pattern of founder-led brand bets: homemade product in 2012, breakout
      community traction in 2013, governance and funding institutionalization in 2020-2021, then selective retail and
      control updates through 2026.
    data:
      items:
        - label: Gymshark is incorporated
          date: '2012'
          detail: Gymshark begins as a domain-first business with supplement dropshipping before moving into in-house apparel.
          tone: positive
        - label: Founders start hand-making apparel
          period: Late 2012
          detail: >-
            Francis buys sewing and screen-printing equipment and starts producing fitted gymwear from his parents'
            garage.
          tone: positive
        - label: BodyPower and Luxe Tracksuit breakout
          date: '2013'
          detail: The BodyPower launch drives a step-change in visibility and roughly £30,000 of sales in about 30 minutes.
          tone: positive
        - label: Community world tour expands the brand
          date: '2016'
          detail: Gymshark turns community meetups into a scaling channel across UK and US cities.
          tone: positive
        - label: Founder steps back from CEO role
          date: '2017'
          detail: Ben Francis moves into a brand-focused role while Steve Hewitt takes the CEO position.
          tone: neutral
        - label: Solihull headquarters move
          period: April 2018
          detail: Gymshark moves into Blythe Valley Business Park in Solihull, formalizing its operating base.
          tone: positive
        - label: Gymshark Lifting Club opens
          period: August 2019
          detail: The company opens its internal gym-and-content venue, reinforcing the community and content model.
          tone: positive
        - label: General Atlantic invests
          period: August 2020
          detail: >-
            The first disclosed external round gives General Atlantic a 21 percent stake at a valuation above £1
            billion.
          tone: positive
        - label: Ben Francis returns as CEO
          period: August 2021
          detail: The founder resumes the top operating role after the Hewitt period.
          tone: neutral
        - label: First permanent flagship store opens
          period: 29 October 2022
          detail: Regent Street becomes Gymshark's first permanent store while the business stays online-first.
          tone: positive
        - label: FY25 record revenue and restructuring
          period: FY2025
          detail: Independent reporting cites £646 million of revenue and about 300 roles cut in a 2025 restructuring.
          tone: warning
        - label: 2026 control and legal watchpoints emerge
          date: '2026'
          detail: >-
            Assigned evidence includes buyback talks with General Atlantic and an uncorroborated lawsuit allegation that
            both merit follow-up.
          tone: adverse
    approximationNotes: >-
      Dates follow the precision available in the assigned evidence; later 2026 items mix one reported control update
      with one low-tier allegation that remains uncorroborated.
    claimRefs:
      - CO001
      - CO003
      - CO008
      - CO009
      - CO010
      - CO013
      - CO014
      - CO015
      - CO016
