  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer definition
        blocks:
          - type: paragraph
            body: |-
              The source-backed market boundary is not "all athleisure." Gymshark explicitly
              frames itself around the conditioning community and traces its first wedge to
              fitted gym apparel for lifters who did not want generic sportswear. That matters
              because it narrows the relevant spend to self-directed fitness consumers buying
              performance-led apparel, then widens only where Gymshark has demonstrated
              adjacency: women's seamless products, creator-led content, and owned digital
              channels. Public evidence does not support treating team-sport apparel, general
              fashion basics, or mass wholesale sporting-goods distribution as the same market.
              The practical buyer is still the end consumer spending discretionary wallet share,
              while Gymshark's job-to-be-done combines garment performance, identity signaling,
              and belonging to a fitness community rather than pure price-based apparel demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
