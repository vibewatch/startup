              - CP011
              - CP014
              - CP016
      - number: '3.3'
        title: Community remains the moat, but the tactic behind it has commoditized
        blocks:
          - type: paragraph
            body: >-
              Durability is mixed. The core moat remains community credibility and an owned-channel flywheel that
              converts creators, events, and content into commerce, but multiple independent sources argue that the
              original tactic has commoditized. Business Model Analyst says Nike, Adidas, and Alo now run creator-led
              playbooks, while Latterly says incumbents and digital upstarts are all competing on product, price, and
              creators. That shifts the burden of proof from marketing novelty to execution in fit, fabrics, and brand
              trust. The adverse evidence is concrete: dupe culture pressures price premium, omnichannel expansion
              pushes Gymshark into Lululemon’s physical battleground, and the smaller scale base leaves less room for
              error if physical formats do not compound loyalty. Gymshark can still win, but the win condition looks
              narrower than in its early DTC phase: disciplined physical rollout, defensible product quality, and
              retention loops that deeper-pocketed competitors cannot easily copy.
            claimRefs:
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Community is now a distribution asset, not just a marketing tactic
            body: >-
              The most important competitive shift is that Gymshark is converting community into owned surfaces such as
              stores, events, wholesale pilots, and gym formats, which broadens the moat but also drags the company into
              more capital-intensive battlegrounds.
            calloutType: insight
            claimRefs:
              - CP007
              - CP011
              - CP016
          - type: callout
            title: The original influencer arbitrage has narrowed sharply
            body: >-
              If fit, fabrics, and retention loops do not deepen, Gymshark’s premium can leak to cheaper dupes and
              better-capitalized rivals because the social-first tactic itself is no longer unique.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Assigned evidence supports a revenue engine built first around direct-to-consumer ecommerce, then widened
              into owned stores, with selective wholesale only added recently. Gymshark's own origin story says the
              initial site drop-shipped third-party products for a small margin before the company scaled self-designed
              apparel, while ENEB still characterizes the model as having been built around selling through the official
              online store rather than legacy wholesale. Current public scale is substantial: Gymshark says it serves
              customers in more than 200 countries via 14 online stores, and trade coverage reports FY25 revenue of £646
              million, up 6.4% year on year, extending the brand's growth streak to 13 consecutive years. The important
              underwriting distinction is that scale is visible, but revenue mix is not: public sources do not break out
              ecommerce, owned-retail, wholesale, geography, or product-category contribution.
            claimRefs:
