      - number: '4.2'
        title: Profitability and capital intensity
        blocks:
          - type: paragraph
            body: >-
              FY25 looks profitable but deliberately margin-constrained. Independent trade coverage reports pre-tax
              profit of £7 million, down from £11.9 million in FY24, while EBITDA still reached £53.3 million and gross
              margin was reported at 62.3%. That combination matters: the public record does not show a broken
              gross-profit engine, but it does show management choosing to absorb expansion costs rather than maximize
              near-term earnings. Ben Francis's results commentary, as relayed by SGI Europe and SGB Media, ties that
              compression to store openings, community investment, and a separate undisclosed project. The latest
              reported balance-sheet signals are still positive rather than distressed, with year-end cash above £37
              million and inventory just above £117 million, but inventory is large enough that turns, markdowns,
              obsolescence, and returns become first-order diligence topics.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
