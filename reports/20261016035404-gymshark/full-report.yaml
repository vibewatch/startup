      - number: '5.3'
        title: Differentiation and maturity
        blocks:
          - type: paragraph
            body: >-
              Gymshark's clearest differentiator in this pool is execution around creators, community, and direct
              distribution rather than a publicly documented technology moat. The official history and independent
              case-study material all describe the same flywheel: seed product with fitness creators, convert that
              attention into community participation, and route demand into owned commerce and brand events. That
              pattern appears durable because it has extended from the early YouTube/bodybuilding phase into flagship
              stores, training content, and a broad women's assortment. The trade-off is that the company's public
              maturity looks commercial and brand-operational first; the assigned sources do not give equivalent
              evidence on software infrastructure, proprietary materials science, or formal quality-control systems.
