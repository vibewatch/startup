  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a DTC-led model widened by owned stores and early wholesale, with strong gross margin but
      profit intentionally compressed by reinvestment.
    data:
      nodes:
        - label: Community and creator-led demand
          detail: >-
            Founder story and later trade coverage point to creator/community-led traffic rather than legacy
            wholesale-led distribution.
        - label: DTC online stores
          detail: Gymshark says it serves customers in 200+ countries through 14 online stores.
        - label: Owned retail stores
          detail: Physical stores and flagships have expanded across the UK, Europe, Middle East, and U.S.
        - label: Selective wholesale
          detail: Dick's House of Sport became the first U.S. wholesale partner in 12 stores in October 2025.
        - label: FY25 revenue
          value: £646m
          detail: Revenue grew 6.4% year on year, extending the growth streak to 13 years.
        - label: FY25 gross profit and reinvestment
          value: GM 62.3%; EBITDA £53.3m; PBT £7m
          detail: >-
            Gross margins remained strong while profits were intentionally compressed by store, community, and
            adjacent-project investment.
    approximationNotes: >-
      Sequence expresses commercial flow and disclosed outcomes, not a quantified channel mix or mathematically balanced
      bridge.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
