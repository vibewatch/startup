  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map scoring competitor classes on owned-channel/community control and differentiation durability using the
      assigned evidence pool.
    data:
      xAxis:
        label: Owned channel and community control
        min: 1
        max: 5
        low: Third-party retail or low owned audience
        high: Owned DTC plus owned community surfaces
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      yAxis:
        label: Differentiation durability
        min: 1
        max: 5
        low: Easy to copy or price-led
        high: Harder to copy through product and brand depth
        description: Ordinal analyst scoring from assigned evidence; not inferred by the renderer
        scale: ordinal
      points:
        - label: Gymshark
          x: 5
          'y': 4
          detail: >-
            Owned DTC, app, creators, and community spaces create high control, but moat strength now depends on product
            and retention rather than a unique influencer tactic.
          claimRefs:
            - CP003
            - CP007
            - CP008
            - CP011
            - CP012
        - label: Legacy incumbents
          x: 2
          'y': 4
          detail: >-
