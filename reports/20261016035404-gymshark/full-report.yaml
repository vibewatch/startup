  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape is layered rather than peer-to-peer
        blocks:
          - type: paragraph
            body: >-
              Gymshark is best understood as a scaled digital-native challenger rather than a conventional sportswear
              incumbent. Official and third-party sources agree that the company still concentrates demand generation
              and distribution around owned e-commerce, creators, and community touchpoints, while the legacy set it
              competes against was built around far larger budgets and multi-channel retail footprints. Great Partners
              explicitly says Gymshark’s model stays closer to direct-to-consumer webshops than to Nike, Adidas, and
              Lululemon, and Real Growth Matters frames the 2012 market as one dominated by Nike, Adidas, and Under
              Armour. That combination makes the landscape multi-layered: Gymshark faces incumbents on scale, Lululemon
              on premium women’s and training adjacency, and newer creator-led brands on tone and social execution. The
              assigned pool does not support a separate internal-build or private-label substitute thesis strongly
              enough to treat it as a proven peer set, so that remains a diligence gap rather than a scored competitor
              class.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
