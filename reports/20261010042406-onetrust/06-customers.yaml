    title: Mid-Market Procurement Friction and Renewal Vulnerability
    body: Enforcing an annual contract value floor of approximately $10,000, combined with user reports of implementation complexity and aggressive renewal pricing, exposes OneTrust to point-solution displacement in non-enterprise accounts.
