company:
  name: "OneTrust"
chapter:
  number: 8
  title: "Valuation"
  summary: "OneTrust commands a category-defining market position in enterprise privacy, consent, and AI-ready governance, backed by $1.13B in cumulative equity financing. However, its July 2023 Series D down-round mark of $4.5B represents an estimated 8.2x multiple on $550M 2025 revenue that demands disciplined execution, leaving new investment posture firmly at track pending audited financial disclosures and liquidity governance terms."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "OneTrust has established an extensive enterprise footprint across privacy automation, consent management, third-party risk, and emerging AI-ready governance. The investment thesis rests on structural tailwinds from global data protection regulations and rapid enterprise adoption of generative AI systems requiring continuous compliance controls. With over 14,000 customers globally, including more than half of the Fortune 500, the company possesses deep workflow stickiness and broad cross-sell surface across security, risk, privacy, and data engineering teams. Conversely, the anti-thesis centers on valuation overhang, opacity in underlying financial performance, and capital structure complexity. While private revenue estimates suggest top-line scale reaching $550M by late 2025, OneTrust has never publicly disclosed audited GAAP financials, net revenue retention rates, gross margins, or operating cash burn. Furthermore, market reports of a potential leveraged private equity buyout introduce structural transaction risks that could impair common or junior equity holders under downside preference waterfalls."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "recommendation-and-valuation-stance"
    title: "Recommendation Stance and Decision Logic"
    body: "We assign OneTrust an overall recommendation of track with medium confidence, medium risk rating, and a stretched valuation stance. The primary constraint preventing an actionable capital commitment is the complete absence of verified unit economics, audited EBITDA margins, and retention metrics. Although OneTrust demonstrated strong historical top-line expansion—scaling from $70M in 2019 to $200M in 2021, $400M in 2022, and approximately $550M in 2025—its July 2023 Series D funding at a $4.5B valuation reflected an explicit 12% haircut from its peak $5.1B Series C valuation achieved in December 2020. Entering at current secondary marks or proposed private equity recapitalization valuations above $4.0B offers insufficient risk-adjusted margin of safety without contractual visibility into senior liquidation preferences and audited revenue quality."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-modeling-and-exit-readiness"
    title: "Scenario Analysis, Peer Multiples, and Diligence Asks"
    body: "Evaluating OneTrust across bull, base, and bear scenarios demonstrates asymmetric return profiles governed by growth durability and margin realization. In the base case, revenue grows at an annualized 15% to $630M, commanding a normalized 7.0x EV/revenue multiple yielding a $4.41B enterprise valuation that mirrors current marks. In the bull case, enterprise acceleration into enterprise AI governance packages and query-level policy enforcement propels ARR growth to 25%, supporting an 8.5x multiple and a $5.85B exit. In the bear case, privacy point-solution commoditization and slower net expansions compress revenue growth to 5% with multiple contraction to 4.5x, implying an enterprise value of $2.60B. Under this bear scenario, senior preferred liquidation stacks totaling $1.13B would severely dilute common equity distributions. Critical diligence prerequisites include audited FY2023-FY2025 income and cash flow statements, verified cohort Net Revenue Retention (targeting ≥110%), and an exact capitalization table waterfall delineating Series D liquidation seniorities."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs: []
