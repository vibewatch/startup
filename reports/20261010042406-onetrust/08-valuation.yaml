    title: "Valuation Discipline Over Headline Scale"
    body: "While OneTrust is the undisputed market leader in privacy software with over 14,000 customers, investors must not conflate commercial scale with equity return certainty. The July 2023 $4.5B valuation established an explicit down-round benchmark that illustrates sensitivity to valuation multiple compression. Prospective capital should enforce strict entry discipline at ≤6.0x forward revenue until audited profitability and retention metrics are verified."
    claimRefs:
