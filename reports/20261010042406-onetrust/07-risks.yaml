  - calloutType: "risk"
    title: "Supply-Chain OAuth Compromise and Enterprise Salesforce CRM Exposure"
    body: "The June 2026 Klue security incident highlights third-party authorization as a primary operational vulnerability for OneTrust. While the core Trust Intelligence platform was uncompromised, threat actor Icarus utilized stolen OAuth tokens to exfiltrate sales contact and customer business data from OneTrust's enterprise Salesforce CRM, underscoring that SaaS integrations represent critical lateral threat vectors regardless of core encryption defenses."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Implementation Overhead and the Mid-Market Shelfware Dilemma"
    body: "OneTrust's comprehensive multi-module architecture delivers defensible compliance records for Fortune 500 enterprises but imposes substantial operational overhead. Without dedicated administrative owners, taxonomy designers, and continuous workflow maintenance, organizations risk deploying high-cost shelfware. In early 2026, OneTrust's increase in minimum ACV to roughly $10,000 accelerated the bifurcation between enterprise governance suites and agile compliance automation alternatives."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
