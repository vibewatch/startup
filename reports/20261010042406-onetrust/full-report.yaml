    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Strong platform adoption (14,000+ customers) offset by unverified operating margins and financial opacity
        - Do not commit capital until audited GAAP financials and verified NRR metrics are provided
      - - Confidence
        - Medium
        - Priced rounds and customer counts verified; exact ARR and cash burn remain third-party estimates
        - Subject to revision upon independent verification of unit economics and cohort churn
      - - Risk Rating
        - Medium
        - Established category leadership balanced against down-round precedent and PE buyout leverage
        - Monitor debt financing covenants, governance restructuring, and enterprise customer churn
      - - Valuation Stance
        - Stretched
        - July 2023 mark of $4.5B represents ~8.2x multiple on estimated $550M 2025 revenue
        - Seek entry at ≤6.0x forward revenue ($3.3B) to provide adequate downside margin of safety
    notes: >-
      Assessment dimensions synthesize verified funding events, estimated revenue scales, and structural governance
      risks.
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Argument
      - What Would Change The View
    rows:
      - - Market Leadership
        - Over 14,000 customers globally and 50%+ of Fortune 500 rely on OneTrust for enterprise privacy and compliance
        - Core consent management faces commoditization from low-cost niche tools and open-source alternatives
        - Documented enterprise retention stability and expansion of annual contract values beyond $250k
      - - Product & Platform
        - Unification of privacy, data discovery, third-party risk, and AI governance in a single modular platform
        - AI governance and data use governance modules remain early; packaging complexity risks customer fatigue
        - Production reference deployments demonstrating measurable automated policy enforcement at scale
      - - Capital Structure & Valuation
        - Total equity funding of $1.13B demonstrates enduring institutional backing from premier investors
        - July 2023 Series D down round to $4.5B highlights multiple compression and potential preference overhang
        - >-
          Audited FY2023-FY2025 financial disclosures confirming sustained positive free cash flow and EBITDA margin
          expansion
    notes: Core strategic trade-offs derived from primary company releases, funding logs, and industry revenue estimations.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumed Growth & Scale
      - Valuation & Return Logic
      - Key Operating Risks
      - Probability Signal
    rows:
      - - Bull Case
        - 25% YoY growth to $690M revenue via rapid adoption of AI governance and cross-selling into Fortune 500
        - 8.5x multiple yields $5.85B valuation; 30% upside from $4.5B Series D mark
        - Enterprise execution bottlenecks, sales cycle lengthening, and customer resistance to multi-module bundling
        - 25% (Conditional on verified >115% NRR and accelerating AI module conversions)
      - - Base Case
        - 15% YoY growth to $630M revenue with stable renewal rates and modest new logo acquisition
        - 7.0x multiple yields $4.41B valuation; approximately flat vs. July 2023 Series D mark
        - Continued venture market valuation compression and margin pressure from legacy headcount investments
        - 50% (Reflects current market consensus and enterprise software multiple benchmarks)
      - - Bear Case
        - 5% YoY growth to $580M revenue driven by churn in consent management and slower enterprise upsells
        - 4.5x multiple yields $2.60B valuation; 42% downside, threatening common equity under $1.13B preference stack
        - Severe pricing pressure from point competitors, PE recapitalization restructuring, and debt covenant breach
        - 25% (Triggered if audited disclosures reveal sub-100% NRR or persistent negative cash burn)
    notes: >-
      Scenarios model forward performance off estimated $550M 2025 revenue baseline; return logic assumes $1.13B
      cumulative preference hurdle.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
