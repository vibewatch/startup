              - CP010
      - number: '3.3'
        title: Switching Costs, M&A Consolidation, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              OneTrust's enterprise moat is defended by deep operational inertia, extensive pre-built integrations, and
              its proprietary database of over 45 million categorized cookies and trackers. Once deployed across global
              web properties, native mobile applications, and internal IT assets, replacing OneTrust involves
              significant switching costs, including re-architecting consent pipelines, re-mapping data subject access
              workflows, and retraining legal compliance teams. However, switching costs are substantially lower at the
              pure consent tier, where containerized deployments via tag managers allow challengers like Enzuzo to
              migrate customers in hours rather than months.


              The durability of OneTrust's moat is further challenged by an accelerating wave of private equity
              consolidation across privacy technology. Competitors have rapidly scaled via M&A: Didomi acquired
              Sourcepoint following a majority investment from Marlin Equity Partners, Main Capital Partners acquired
              TrustArc in October 2025, and Veeam acquired Securiti AI for $1.73 billion in cash to deliver a unified
              data resilience and AI-trust platform. Furthermore, OneTrust itself was reported to have engaged in
              preliminary private equity buyout talks with firms such as Vista Equity Partners and Thoma Bravo, while
              competitors report that up to one-third of net new clients originate from dissatisfied OneTrust accounts
              migrating away from complex enterprise licensing.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Down-Market Unbundling and Displacement Vulnerability
            body: >
              OneTrust's strategic elevation of minimum contract thresholds to $10,000 has created a major displacement
              vulnerability in its consent management installed base. Mid-market organizations that previously adopted
              OneTrust for basic GDPR or CCPA compliance are actively migrating to agile alternatives like Enzuzo,
              Osano, and Usercentrics, which offer transparent pricing, faster GTM container integration, and lower
              administrative overhead.
            calloutType: risk
            claimRefs:
              - CP003
              - CP007
              - CP014
          - type: callout
            title: The Shift from Regulatory Privacy to AI Data Governance
            body: >
              Enterprise competitive dynamics are increasingly dictated by AI governance capabilities rather than cookie
              compliance. Large-scale transactions, including Veeam's $1.73B acquisition of Securiti AI and OneTrust's
              own platform investments, demonstrate that enterprise buyers prioritize unified systems capable of
              enforcing runtime guardrails and automated data classification across AI models and agents.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP015
