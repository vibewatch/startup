      - number: '3.2'
        title: Capability Matrix, Packaging, and Pricing Models
        blocks:
          - type: paragraph
            body: >
              OneTrust's platform strategy relies on a comprehensive, multi-module suite spanning AI Governance, Consent
              & Preferences, Data Use Governance, Privacy Automation, Tech Risk & Compliance, and Third-Party
              Management. The vendor prices modules via opaque, custom enterprise quotes that vary by metrics such as
              average daily visitors, data subject profiles, user seats, and privacy asset inventories. While this
              packaging enables OneTrust to capture large cross-functional budgets across legal, IT, and marketing
              teams, it creates contract complexity and exposes the company to displacement from buyers who only require
              specific workflows like cookie consent or DSAR intake.


              Point-solution competitors exploit these packaging rigidities by offering flat-rate or transparent
              usage-based tiers that eliminate sales friction. For example, Enzuzo offers self-serve plans starting at
              $9 per month and mid-market plans at $300 per month across 10 domains, contrasting sharply with OneTrust's
              $10,000 minimum threshold. Osano introduces contractual differentiation through a 'No Fines, No Penalties'
              pledge, while Captain Compliance provides a litigation guarantee known as Compliance Shield. In contrast,
              enterprise alternatives like TrustArc match OneTrust's custom quoting and multi-module breadth, competing
              directly for Fortune 500 procurement RFPs.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
