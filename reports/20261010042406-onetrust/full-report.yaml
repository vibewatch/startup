      - number: '1.3'
        title: Capitalization History, Valuation Reset, and Institutional Investors
        blocks:
          - type: paragraph
            body: >-
              OneTrust has raised approximately $1.13 billion in cumulative equity financing across seven institutional
              investment rounds. Early growth was capitalized through a $200 million Series A in 2019 and subsequent
              Series B and C rounds led by Insight Partners, SoftBank Vision Fund 2, and TCV, which elevated the
              company's valuation to a peak between $5.1 billion and $5.3 billion in 2020–2021. In July 2023, OneTrust
              completed a $150 million Series D financing led by Generation Investment Management with participation
              from Sands Capital Ventures at a reset valuation of $4.5 billion. While representing a down-round
              valuation adjustment from peak 2021 multiples, the transaction secured long-term institutional backing and
              growth capital to sustain operations without requiring dilutive emergency debt financing.
            claimRefs:
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO013
      - number: '1.4'
        title: Platform Evolution, Milestones, and Operational Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Since its founding in 2016 to capitalize on European Union General Data Protection Regulation (GDPR)
              mandates, OneTrust has executed an aggressive product roadmap and acquisition strategy to broaden its
              reach into GRC and AI governance. At TrustWeek in September 2026, the company announced its evolution into
              an AI-ready governance platform powered by OneTrust CORIE, an AI Control Plane, and an MCP Gateway for
              headless integrations. However, independent assessments highlight material operational tradeoffs: rapid
              multi-product expansion and acquisitions have introduced software integration complexities and cultural
              friction, following earlier workforce restructuring. Furthermore, competitive benchmarks note that
              OneTrust's runtime AI Guard SDK remains largely scoped to pre-production development and testing workflows
              rather than full-scale inline production enforcement.
            claimRefs:
