  - id: FE001
    title: OneTrust Trust Intelligence Platform Multi-Tier Architecture
    type: stack
    summary: >-
      Six-tier architectural stack of OneTrust platform from enterprise interface down to encrypted cloud
      infrastructure.
    data:
      layers:
        - label: 'Tier 1: Experience & Workflow Layer'
          detail: >-
            Web portals, cookie consent banners, DSR webforms, and Angular single-page applications for compliance
            officers and end consumers.
        - label: 'Tier 2: API Gateway & Integration Orchestration'
          detail: >-
            OAuth 2.0 RSA-256 secured REST gateway, webhook dispatchers, and pre-built enterprise connectors (e.g.,
            Ironclad contract sync).
        - label: 'Tier 3: Distributed Microservices & Event Streaming'
          detail: >-
            Containerized Java Spring, TypeScript, and Python services decoupled via Apache Kafka topics (e.g.,
            consent.updated, dsr.requests).
        - label: 'Tier 4: Policy Engine & AI Control Plane'
          detail: >-
            Regulatory intelligence rules engine, AI Agent Detection, NIST/EU AI Act policy monitoring, and guardrail
            inspection modules.
        - label: 'Tier 5: Data Policy Enforcement & Query Filtering'
          detail: >-
            Programmatic policy translation engine applying dynamic column masking and row-level filtering within
            connected data warehouses.
        - label: 'Tier 6: Storage & Cloud Infrastructure'
          detail: >-
            Microsoft Azure infrastructure, tenant-isolated SQL databases with AES-256 TDE, Azure Key Vault HSM keys,
            and Elasticsearch indices.
    approximationNotes: >-
      Architectural decomposition synthesized from OneTrust security whitepapers, developer documentation, and
      engineering technical job profiles.
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE010
