  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is broader than cookie consent but narrower than all governance, risk, and
              compliance software. OneTrust's current platform joins privacy, consent, data use, AI governance,
              technology risk, and third-party management; adjacent spend such as generic cybersecurity, Kubernetes, and
              enterprise data integration should not be counted unless the purchase is tied to those governance
              workflows. A third-party article relaying a Grand View Research estimate sizes privacy-management software
              at $3.41 billion in 2023 and forecasts $30.15 billion in 2030 at 39.5% CAGR, while forecasting
              Asia-Pacific above 41% CAGR for 2024-2030. These are useful directional TAM markers, not OneTrust's
              serviceable market. Technographic sources illustrate the denominator problem: TechnologyChecker reports
              174,655 active domains and 4.52% consent-and-privacy share, whereas 6sense reports 75,859 current
              customers and 34.35% share in a much broader GRC category. The figures are not contradictory measurements
              of one market; they use different taxonomies, populations, and units. No retained source discloses
              contract-level product mix, eligible enterprise spend, or win rates, so a revenue SAM/SOM remains a
              diligence gap rather than a number to infer from web detections.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
