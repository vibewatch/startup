chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Enterprise Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2016 by CEO Kabir Barday and headquartered in Atlanta, Georgia, OneTrust established itself as
              the category-defining enterprise software platform for privacy compliance, consent management, and data
              governance. The company operates a multi-cloud subscription model spanning privacy automation, third-party
              risk management, GRC security assurance, and artificial intelligence governance. Serving over 14,000
              customers worldwide—including 75 percent of the Fortune 100—OneTrust monetizes via enterprise annual
              recurring software subscriptions tiered by data volume, connected domains, and modular capabilities. While
              the company announced in 2024 that it was on track to surpass $500 million in ARR while maintaining
              positive free cash flow, audited GAAP financial statements remain undisclosed.
            claimRefs:
