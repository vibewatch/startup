  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Governance Modules
        blocks:
          - type: paragraph
            body: >-
              OneTrust delivers an enterprise trust intelligence and compliance software platform designed to manage
              data privacy, user consent, regulatory compliance, and artificial intelligence governance. The platform is
              structured around modular product lines that cater to distinct departmental buyers across legal, privacy,
              security, and technology organizations. Core offerings include the Consent & Preferences module, which
              automates web cookie banners and omnichannel customer preference centers, and the Privacy Automation
              suite, which orchestrates Data Subject Access Requests (DSARs), records of processing activities (RoPA),
              and privacy impact assessments. For broader risk management, the Governance, Risk, and Compliance (GRC)
              module delivers third-party vendor risk tiering and continuous security compliance workflows. Most
              recently, OneTrust expanded into AI Governance, introducing capabilities to inventory AI systems and
              enforce operational guardrails across machine learning models and autonomous agents.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE008
