      - number: '1.2'
        title: Founders, Executive Leadership, and Board Governance
        blocks:
          - type: paragraph
            body: >-
              OneTrust was founded and continues to be guided by Chief Executive Officer Kabir Barday, who has served as
              the strategic and operational leader of the company since its inception. Functional technology and product
              architecture is led by Chief Product and Technology Officer DV Lamba, who oversees core platform
              engineering and the rollout of runtime AI governance layers. To strengthen enterprise financial rigor
              ahead of liquidity events, OneTrust introduced Datadog Chief Financial Officer David Obstler in May 2024
              as its first independent board director and Audit Committee Chair. This addition provides public-company
              accounting governance and independent audit discipline to balance founder-centric executive control.
            claimRefs:
              - CO001
              - CO003
              - CO004
