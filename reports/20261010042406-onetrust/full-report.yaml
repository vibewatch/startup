      - number: '5.2'
        title: Platform Architecture and Cloud Infrastructure
        blocks:
          - type: paragraph
            body: >-
              OneTrust operates as a multi-tenant enterprise Software-as-a-Service (SaaS) platform primarily hosted on
              Microsoft Azure, with supporting deployments across Amazon Web Services and Google Cloud Platform to
              satisfy global data residency mandates. The underlying technical stack comprises Java Spring, TypeScript,
              and Python microservices communicating through Apache Kafka event-streaming pipelines. This decoupled
              messaging topology enables high-throughput processing of asynchronous events, such as web consent updates
              and automated deletion workflows, without introducing synchronous blocking overhead across distributed
              services. For persistence, the platform combines relational SQL databases with NoSQL document stores and
              Elasticsearch clusters. At the data tier, OneTrust enforces Transparent Data Encryption (TDE) with AES-256
              across all storage volumes and tenant databases, with unique per-tenant encryption keys safeguarded within
              Azure Key Vault FIPS-140-2 Level 2 validated Hardware Security Modules. Resilience is reinforced by
              continuous rolling backups and disaster recovery protocols targeting a 1-hour Recovery Point Objective and
              48-hour Recovery Time Objective.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE010
      - number: '5.3'
        title: AI Governance, Agent Observability, and Data Policy Enforcement
        blocks:
          - type: paragraph
            body: >-
              To address the expanding governance challenges introduced by enterprise artificial intelligence adoption,
              OneTrust introduced an enhanced AI-Ready Governance Platform in 2026. This extension shifts compliance
              from static post-hoc questionnaires to continuous operational control. The platform provides automated AI
              Agent Detection & Inventory to catalog models, agentic workflows, and training datasets, capturing data
              lineage and access permissions across cloud AI environments such as Amazon Bedrock, Azure Foundry, and
              Databricks Unity Catalog. Complementing this, OneTrust unveiled Data Policy Enforcement, a solution
              currently in private preview that connects high-level compliance policies directly to runtime data access
              controls. By translating privacy rules into machine-enforceable code, Data Policy Enforcement executes
              automated column masking and row-level filtering directly at the database query layer, ensuring that
              sensitive personal information is shielded from generative AI models without interrupting developer data
              enablement.
            claimRefs:
              - CE005
              - CE006
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
