      - number: '2.2'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer is a committee rather than a single functional owner. Privacy and legal teams own regulatory
              interpretation and evidence; marketing and web teams operate consent experiences; security and risk teams
              manage controls and incidents; data and AI teams need permitted-use policies; and procurement manages
              third-party intake. The platform case is strongest when these groups need shared workflows and a common
              control layer. The adoption evidence also points to two distinct motions. TechnologyChecker finds 2,543
              enriched companies with more than 10,000 employees, yet 73.7% of its size-known records have 200 or fewer
              employees, which it associates partly with self-service consent use. Regulated industries are visible but
              not dominant: finance, insurance, and healthcare total 11.1% of the source's matched base. This supports
              an enterprise cross-sell thesis while warning against treating every detected domain as a full-suite
              customer. Company-controlled statements that more than half of the Fortune 500 choose OneTrust reinforce
              enterprise reach, but do not disclose deployment breadth, contract value, or paid module count.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.3'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Regulation remains the clearest demand catalyst because fragmented privacy rules create recurring
              assessment, consent, and reporting work. AI adoption expands the workflow from privacy compliance into
              model, data, vendor, and runtime governance, while OneTrust's own trend report emphasizes responsible AI,
              privacy-enhancing technologies, continuous monitoring, and connected consent infrastructure. Adoption is
              not frictionless. A competitor-issued comparison says OneTrust is best suited to multi-function governance
              programs and reports a roughly $10,000 minimum annual contract value in early 2026; that source is useful
              as adverse buyer evidence, not as an independent pricing benchmark. Independent technographic analysis
              also summarizes reviewer criticism around setup complexity, training, and learning curve. StayModern
              reports strong ROI and payback from a Forrester study, but the retained page is a secondary synopsis
              rather than the underlying study. For valuation, the strongest conclusion is therefore qualitative:
              expanding regulation and AI governance can widen wallet share, while implementation cost, price-sensitive
              down-market churn, and unavailable company revenue segmentation constrain the confidence of any
              share-capture model.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
