callouts:
  - calloutType: "risk"
    title: "The Critical Architectural Divide: Banner Capture Versus Downstream Enforcement"
    body: "A central technical vulnerability in enterprise privacy implementations is the divergence between front-end consent capture and downstream operational enforcement. While OneTrust provides sophisticated cookie banner customization, recent regulatory actions—such as the CPPA's $632,500 order against Honda regarding its OneTrust-managed configuration—demonstrate that regulatory liability attaches when recorded consent choices fail to propagate faithfully to downstream advertising partners, CDPs, and data pipelines. OneTrust's Data Policy Enforcement initiative directly targets this gap, but its private-preview status leaves current enterprise customers reliant on complex manual and custom API integrations to ensure end-to-end compliance."
    claimRefs:
      - "CE006"
      - "CE009"
      - "CE014"
