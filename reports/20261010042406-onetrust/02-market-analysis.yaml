  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: "Paid account counts, ACV distribution, module mix, eligible-enterprise counts, renewal data, and segment win rates."
      whyItMatters: "Without these inputs, broad market forecasts and domain detections cannot be translated into a defensible revenue SAM or SOM."
      diligencePath: "Request management cohort exports by geography, customer size, product module, ACV band, renewal status, and pipeline stage, then reconcile them to audited revenue."
      relatedQuestionRefs: [QM008]
    - type: conflicting-data
      severity: material
      topic: adoption
      missingEvidence: "A harmonized third-party adoption dataset with one category definition, unit of analysis, and dated customer denominator."
      whyItMatters: "Published market-share and geography percentages vary materially because sources count different populations."
      diligencePath: "Obtain source methodology notes and compare a common sample of paid customer organizations rather than domains or inferred technology detections."
      relatedQuestionRefs: [QM006, QM007]
    - type: missing-source
      severity: minor
      topic: roi
      missingEvidence: "The underlying Forrester Total Economic Impact study and customer-level assumptions behind the reported ROI and payback figures."
      whyItMatters: "The secondary summary cannot establish whether the economics generalize across buyer segments or deployment scopes."
      diligencePath: "Request the full commissioned study, model inputs, implementation costs, and reference-customer profiles from management."
      relatedQuestionRefs: [QM004, QM005]
