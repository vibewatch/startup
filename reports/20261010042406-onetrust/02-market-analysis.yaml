callouts:
  - calloutType: risk
    title: A broad TAM is not a serviceable market
    body: >-
      Privacy-market forecasts, consent-domain detections, and broad GRC category
      shares use incompatible units. A defensible OneTrust SAM/SOM requires paid
      account counts, module mix, contract values, renewal data, and segment win
      rates that are not available in the assigned evidence.
    claimRefs: [CM003, CM005, CM006, CM016]
