      - [Data and AI governance, "Chief data or AI officer with legal/risk", "Model owners, data stewards, and governance teams", "Data, AI, risk, or transformation budget", "Inventory, assessment, permitted use, monitoring, and guardrails", "Production AI deployment or regulatory readiness"]
      - [Third-party management, "Procurement, security, or compliance leader", "Vendor-risk analysts and business owners", "Procurement, security, or compliance budget", "Vendor intake, assessment, mitigation, monitoring, and reporting", "Large vendor estate, customer assurance, or regulatory scrutiny"]
    notes: "Buyer roles and workflows synthesize company product descriptions and competitor-issued buyer guidance; actual OneTrust budget ownership by customer is undisclosed."
