callouts:
  - calloutType: risk
    title: Down-Market Unbundling and Displacement Vulnerability
    body: |
      OneTrust's strategic elevation of minimum contract thresholds to $10,000 has created a major displacement vulnerability in its consent management installed base. Mid-market organizations that previously adopted OneTrust for basic GDPR or CCPA compliance are actively migrating to agile alternatives like Enzuzo, Osano, and Usercentrics, which offer transparent pricing, faster GTM container integration, and lower administrative overhead.
    claimRefs:
      - CP003
      - CP007
      - CP014
  - calloutType: insight
    title: The Shift from Regulatory Privacy to AI Data Governance
    body: |
      Enterprise competitive dynamics are increasingly dictated by AI governance capabilities rather than cookie compliance. Large-scale transactions, including Veeam's $1.73B acquisition of Securiti AI and OneTrust's own platform investments, demonstrate that enterprise buyers prioritize unified systems capable of enforcing runtime guardrails and automated data classification across AI models and agents.
    claimRefs:
      - CP005
      - CP006
      - CP013
      - CP015
