      - number: '5.2'
        title: 平台架构与云基础设施
        blocks:
          - type: paragraph
            body: >-
              OneTrust 是多租户企业 SaaS 平台，主要托管于 Microsoft Azure，并在 Amazon Web Services 和 Google Cloud Platform
              上辅助部署以满足全球数据驻留要求。技术栈由 Java Spring、TypeScript 和 Python 微服务组成，通过 Apache Kafka
              事件流通信；解耦消息架构可高吞吐处理网站同意更新、自动删除等异步事件，避免分布式服务同步阻塞。持久化层结合关系型 SQL、NoSQL 文档存储和 Elasticsearch
              集群。数据层在所有存储卷和租户数据库启用 AES-256 透明数据加密（TDE），每租户独立密钥由 Azure Key Vault 中通过 FIPS-140-2 Level 2
              验证的硬件安全模块保护。持续滚动备份和灾难恢复协议将 RPO 目标设为 1 小时、RTO 目标设为 48 小时。
