      - number: '2.3'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              监管仍是最清晰的需求催化剂：碎片化的隐私规则持续制造评估、同意管理和报告工作。随着 AI 采用扩大，工作流也从隐私合规延伸到模型、数据、供应商和运行时治理；OneTrust 自己的趋势报告还强调负责任
              AI、隐私增强技术、持续监测和互联同意基础设施。采用并非没有摩擦。一份竞争对手发布的比较称，OneTrust 最适合多职能治理项目，并披露 2026 年初最低年度合同价值约为
              $10,000；这份材料可作为买方反向证据，不能当作独立定价基准。独立技术画像分析也总结了评测者对设置复杂度、培训和学习曲线的批评。StayModern 援引 Forrester 研究称 ROI
              和回本周期表现强劲，但现存页面只是二手摘要，并非底层研究。对估值最稳妥的结论仍是定性的：监管和 AI
              治理扩张可能提升钱包份额，但实施成本、对价格敏感的下沉市场流失，以及公司收入分部数据缺失，都会压低份额获取模型的可信度。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 宽泛 TAM 不等于可服务市场
            body: 隐私市场预测、同意域名探测和宽泛 GRC 类别份额使用的单位彼此不兼容。要建立可辩护的 OneTrust SAM/SOM，需要付费账户数、模块组合、合同价值、续约数据和分客群赢单率，但指定证据中均没有这些数据。
            calloutType: risk
            claimRefs:
