  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 企业客户分层与买方画像
        blocks:
          - type: paragraph
            body: >
              OneTrust 的客户基础覆盖全球超过 14,000 家机构，主要分为三层：全球跨国企业、高度受监管行业机构和商业中端市场组织。大型企业层包括《财富》100 强中的 75
              家，采购通常由跨职能委员会决定，成员包括首席信息安全官（CISO）、首席隐私官（CPO）、首席数据官（CDO）和公司法务。这些组织需要一个集中式记录系统，在异构 IT
              基础设施中统筹数据隐私、供应商风险和人工智能治理。


              对受监管的金融服务机构、医疗系统和跨国科技供应商而言，OneTrust
              是基础设施层的治理层。这些买家优先考虑集成式合规自动化，包括自动处理数据主体访问请求（DSAR）、记录跨境数据传输和评估第三方风险。相比之下，商业中端市场过去主要使用 OneTrust 做网站同意管理和
              Cookie 合规。近期定价模式调整后，年度合同价值底线约为 $10,000，中端市场组织正积极评估更轻量、专门化的替代方案。
