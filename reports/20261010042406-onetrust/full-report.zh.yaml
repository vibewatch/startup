      - number: '8.3'
        title: 情景分析、可比倍数与尽调要求
        blocks:
          - type: paragraph
            body: >-
              三种乐观、基准和悲观情景下，OneTrust 的回报结构并不对称，核心取决于增长能否持续以及利润率能否兑现。基准情景下，收入按年化 15% 增长至 $630M，按标准化 7.0x EV/收入倍数计算，企业估值达到
              $4.41B，与当前市场估值相当。乐观情景下，企业加速切入企业级 AI 治理套件并落实查询级策略执行， ARR 增长达到 25%，支撑 8.5x 倍数和 $5.85B
              的退出估值。悲观情景下，隐私单点解决方案走向商品化、净扩张放缓，收入增速压缩至 5%，倍数收缩至 4.5x， 对应企业价值 $2.60B。在这一情景下，总额 $1.13B
              的优先股高级清算层将严重稀释普通股股东可获分配的收益。关键尽调前提包括经审计的 FY2023-FY2025 利润表和现金流量表、经核实的队列净留存率（目标为 ≥110%），以及明确列出 Series D
              清算优先级的完整股权结构表瀑布。
            claimRefs:
              - CV001
