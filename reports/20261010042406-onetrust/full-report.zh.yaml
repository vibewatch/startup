  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分化
        blocks:
          - type: paragraph
            body: >
              围绕 OneTrust 的竞争格局已分成两条运营战线：一边是轻量、透明的点解决方案，挑战其日益商品化的同意管理层；另一边是资本充足的企业级整合者，争夺战略数据治理和 AI 合规预算。OneTrust 成立于
              2016 年，并通过 Optanon 等早期收购扩张，在 GDPR 和 CCPA 工作流中建立了先发优势，客户规模超过 14,000
              家。但随着企业隐私需求成熟，市场逐渐分成两类：追求快速部署的大量自助式买家，以及需要在结构化和非结构化数据环境中实现端到端治理的跨国公司。


              在中端市场和 SMB 层，Enzuzo、Osano、Ketch、Usercentrics 等灵活的挑战者，成功吸引了不满 OneTrust 高进入成本和数月部署周期的客户。OneTrust 决定执行
              $10,000 最低 ACV 后，专业厂商利用买方摩擦，提供透明的自助式定价、更顺畅的 Google Consent Mode v2 迁移，以及合同层面的合规保证。与此同时，TrustArc、BigID 和
              Securiti AI 等企业厂商直接对标 OneTrust 的核心数据智能和隐私自动化模块，依靠原生数据发现与机器学习分类，争夺复杂监管场景。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
