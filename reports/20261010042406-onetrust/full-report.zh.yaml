        title: 产品组合与治理模块
        blocks:
          - type: paragraph
            body: >-
              OneTrust 提供企业信任情报与合规软件平台，管理数据隐私、用户同意、监管合规和人工智能治理。平台按模块服务法务、隐私、安全和技术部门。核心产品包括自动化网站 Cookie 横幅和全渠道偏好中心的
              Consent & Preferences，以及处理数据主体访问请求（DSAR）、处理活动记录（RoPA）和隐私影响评估的 Privacy Automation。GRC
              模块提供第三方供应商风险分级和持续安全合规流程；近期又扩展到 AI 治理，可盘点 AI 系统并为机器学习模型和自主智能体执行运营护栏。
