      - number: '5.4'
        title: 技术约束、集成瓶颈与下游执行风险
        blocks:
          - type: paragraph
            body: >-
              尽管 OneTrust
              在同意收集领域占据主导份额，但前端捕获同意与下游执行脱节，给其架构带来明显风险。现代隐私法规要求消费者的退出选择传递到每个下游标签、客户数据平台和广告网络。监管机构的高调执法，尤其是加州隐私保护局于 2025 年
              3 月因 Honda 使用 OneTrust 管理的 Cookie 配置而处以 $632,500
              罚款，说明前端同意横幅配置错误或无法与后端数据流同步时，会产生严重法律责任。要把治理延伸到外部企业软件生态，还需要稳健的双向集成，例如 OneTrust 通过 API key 与 Ironclad
              集成以管理合同生命周期风险。动态 Schema、第三方 API 速率限制和未经基准测试的查询级数据过滤难以持续同步，给企业工程团队带来长期运营挑战。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE014
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 关键架构分歧：横幅捕获与下游执行
            body: >-
              企业隐私落地中的一项核心技术漏洞，是前端捕获同意与下游运营执行之间存在脱节。OneTrust 虽能精细定制 Cookie 横幅，但近期监管行动——例如 CPPA 针对 Honda 的 OneTrust
              管理配置作出 $632,500 处罚——表明，只要记录的同意选择无法准确传递给下游广告合作伙伴、CDP 和数据管道，就会触发监管责任。OneTrust 的 Data Policy Enforcement
              计划正面向这一缺口，但由于仍处于私有预览阶段，当前企业客户仍依赖复杂的人工和定制 API 集成来确保端到端合规。
            calloutType: risk
            claimRefs:
              - CE006
