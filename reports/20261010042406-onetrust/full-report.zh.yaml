        title: 图表
        blocks:
          - type: callout
            title: 估值纪律优先于表面规模
            body: >-
              OneTrust 拥有超过 14,000 家客户，是隐私软件市场公认的领导者，但投资者不能把商业规模等同于股权回报确定性。2023 年 7 月的 $4.5B 估值确立了明确的下轮融资基准，
              也说明估值倍数收缩会带来多大影响。在经审计的盈利能力和留存指标得到核实前，新增资本应严格执行入场纪律，将价格控制在远期收入的 ≤6.0x。
            calloutType: recommendation
