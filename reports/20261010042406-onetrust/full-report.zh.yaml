      - number: '6.2'
        title: 采用轨迹、规模证明与增长指标
        blocks:
          - type: paragraph
            body: >
              OneTrust 在企业市场的商业化呈现出快速“落地并扩张”的路径，起点是早期监管催化，尤其是 2018 年 GDPR 和 2020 年 CCPA 的执行。公司客户数从早期风险投资阶段增长到超过 14,000
              家，在隐私管理和数据治理领域建立品类领导地位。第三方分析师估计，截至 2025 年末，OneTrust 的年收入运行率约为 $550 million，背后是广泛的企业渗透和大量企业许可协议。


              单个账户的部署规模通常沿模块和用量两个方向扩张。初始采购往往从面向外部的数字信任界面开始，包括 Cookie
              横幅和消费者偏好中心，随后延伸到内部数据发现、隐私影响评估（PIA）以及自动化供应商风险监测。公司通过集中式产品发布列车和权限更新支持这一客户部署生命周期，按客户反馈直接确定优先级，每月推出功能增强。但
              OneTrust 尚未发布经审计财务报表或 GAAP 收入拆分，因此公开记录无法验证客户队列层面的净扩张率。
