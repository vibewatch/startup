  - id: FE001
    title: OneTrust Trust Intelligence Platform 多层架构
    type: stack
    summary: OneTrust 平台从企业界面到底层加密云基础设施的六层架构。
    data:
      layers:
        - label: 第 1 层：体验与工作流层
          detail: 面向合规官和终端消费者的 Web 门户、Cookie 同意横幅、DSR 网页表单和 Angular 单页应用。
        - label: 第 2 层：API 网关与集成编排
          detail: 采用 OAuth 2.0 RSA-256 保护的 REST 网关、Webhook 分发器和预构建企业连接器（例如 Ironclad 合同同步）。
        - label: 第 3 层：分布式微服务与事件流
          detail: 容器化 Java Spring、TypeScript 和 Python 服务通过 Apache Kafka 主题解耦（例如 consent.updated、dsr.requests）。
        - label: 第 4 层：政策引擎与 AI Control Plane
          detail: 监管智能规则引擎、AI Agent Detection、NIST / EU AI Act 政策监测和护栏检查模块。
        - label: 第 5 层：数据政策执行与查询过滤
          detail: 以编程方式翻译政策的引擎，在连接的数据仓库中执行动态列掩码和行级过滤。
        - label: 第 6 层：存储与云基础设施
          detail: Microsoft Azure 基础设施、采用 AES-256 TDE 的租户隔离 SQL 数据库、Azure Key Vault HSM 密钥和 Elasticsearch 索引。
    approximationNotes: 架构拆解综合 OneTrust 安全白皮书、开发者文档和工程技术岗位资料。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE010
