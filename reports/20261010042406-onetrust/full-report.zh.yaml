  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >
              随着全球隐私和人工智能监管框架不断增加，OneTrust 同时扮演合规编排者和受全球严格法定要求约束的实体两种角色。公司的价值主张依赖于在超过 60 个监管框架之间维护自动化控制映射，包括
              GDPR、美国各州隐私法，以及欧盟 AI 法案、NIST AI 风险管理框架和 ISO 42001 等不断演进的人工智能制度。


              但在不同企业架构中把法定合规真正跑起来，会带来尖锐的法律与监管责任。若自动化数据映射、隐私影响评估或同意信号无法反映法域细节，各地监管解释的差异就可能让 OneTrust
              客户面临执法处罚。为应对复杂的违规响应义务，OneTrust 于 2025 年推出 AI 驱动的 Privacy Breach Response Agent，并与 Microsoft Security
              Copilot 集成，自动计算监管时限、法域通知要求和事件审计日志。尽管产品有所增强，监管执法变化和跨境数据传输机制演进仍要求持续维护平台，并让客户承担剩余合规风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
              - CR012
      - number: '7.2'
        title: 运营、网络安全与实施脆弱性
        blocks:
          - type: paragraph
            body: >
              OneTrust 处于企业敏感治理记录、数据映射和第三方风险记录的中心位置，因此容易成为高级威胁行为者的目标。2026 年 6 月，OneTrust 确认其 Salesforce CRM
              环境发生经核实的供应链网络安全漏洞。威胁行为者 Icarus 攻破销售供应商 Klue 的旧凭证并提取 OAuth 访问令牌，随后利用这些令牌访问并外泄 OneTrust
              销售账户记录和客户业务联系人信息。存放客户加密密钥和终端用户隐私同意记录的核心平台数据库未被攻破，但该事件暴露了互联 SaaS 生态带来的运营脆弱性。


              除直接网络安全威胁外，OneTrust 的实施和交付也存在明显摩擦。独立评估强调，平台覆盖同意管理、隐私自动化、数据使用治理、AI 治理、第三方风险和
              GRC，范围广导致管理复杂度很高。部署需要专门的流程负责人、结构化分类配置、持续的数据连接器验证，以及跨职能运营模式。若内部缺少严格的责任归属，企业就会遭遇实施周期拉长、咨询服务支出高企和模块闲置，常见结果是软件“上架不用”，投资回报下降。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
