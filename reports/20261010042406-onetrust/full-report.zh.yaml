  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业模式架构
        blocks:
          - type: paragraph
            body: >-
              OneTrust 以年度经常性订阅为核心经营企业软件业务，没有免费增值获客路径。商业合同覆盖隐私自动化、同意与偏好、数据使用治理和 AI
