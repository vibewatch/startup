      - number: '1.2'
        title: 创始人、高管团队与董事会治理
        blocks:
          - type: paragraph
            body: >-
              OneTrust 由首席执行官 Kabir Barday 创立并持续领导；自公司成立以来，他一直负责战略和运营。首席产品与技术官 DV Lamba 负责技术和产品架构，统筹核心平台工程及运行时 AI
              治理层的推出。为在流动性事件前强化财务管理，OneTrust 于 2024 年 5 月引入 Datadog 首席财务官 David
              Obstler，担任首位独立董事兼审计委员会主席。这一安排引入上市公司会计治理和独立审计纪律，平衡以创始人为中心的高管控制。
