        title: 展示
        blocks:
          - type: callout
            title: 下沉市场拆分与替代风险
            body: >
              OneTrust 将最低合同门槛提高到 $10,000，使其同意管理客户基础面临明显替代风险。此前为基础 GDPR 或 CCPA 合规采用 OneTrust 的中型组织，正转向 Enzuzo、Osano 和
              Usercentrics 等敏捷替代方案；这些方案定价透明、GTM 容器集成更快，管理开销也更低。
            calloutType: risk
            claimRefs:
              - CP003
              - CP007
              - CP014
          - type: callout
            title: 从监管隐私转向 AI 数据治理
            body: >
              企业竞争越来越由 AI 治理能力而非 Cookie 合规主导。Veeam 以 $1.73B 收购 Securiti AI 以及 OneTrust 自身的平台投入，都说明企业买方优先选择能够在 AI
              模型和智能体上执行运行时护栏、自动数据分类的统一系统。
            calloutType: insight
            claimRefs:
              - CP005
