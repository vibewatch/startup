  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              可投资边界比 Cookie 同意管理更宽，但比所有治理、风险和合规软件更窄。OneTrust 当前平台融合隐私、同意、数据使用、AI
              治理、技术风险和第三方管理；通用网络安全、Kubernetes、企业数据集成等相邻支出，只有在采购直接服务这些治理流程时才应计入。转述 Grand View Research 估算的第三方文章称，隐私管理软件市场
              2023 年为 $3.41B，预计 2030 年达 $30.15B，CAGR 为 39.5%；同时预计亚太地区 2024–2030 年 CAGR 超过 41%。这些是方向性的 TAM 参照，不是 OneTrust
              的可服务市场。技术图谱数据暴露了分母问题：TechnologyChecker 报告 174,655 个活跃域名和 4.52% 的同意与隐私份额，而 6sense 在更宽泛的 GRC 类别中报告 75,859
              个当前客户和 34.35% 份额。两组数字不是对同一市场的矛盾测量，而是使用了不同分类法、样本和单位。留存资料没有披露合同层面的产品组合、符合条件的企业支出或赢单率，因此收入 SAM/SOM
              仍是尽调缺口，不能从网页探测数据反推。
