      - number: '1.3'
        title: 资本化历程、估值重置与机构投资者
        blocks:
          - type: paragraph
            body: >-
              OneTrust 通过七轮机构投资累计融资约 $1.13B。公司早期增长由 2019 年 $200M A 轮及后续由 Insight Partners、SoftBank Vision Fund 2 和 TCV
              领投的 B、C 轮资本化，估值在 2020–2021 年升至 $5.1B–$5.3B 峰值。2023 年 7 月，OneTrust 以重置后 $4.5B 估值完成 $150M D 轮融资，由 Generation
              Investment Management 领投，Sands Capital Ventures 参与。虽然这相对 2021
              年峰值倍数构成下调轮，但交易获得了长期机构支持和增长资本，使公司无需依赖稀释性紧急债务融资即可维持运营。
            claimRefs:
              - CO005
              - CO006
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO013
      - number: '1.4'
        title: 平台演进、里程碑与运营取舍
        blocks:
          - type: paragraph
            body: >-
              OneTrust 2016 年成立后抓住欧盟《通用数据保护条例》（GDPR）要求，通过激进的产品路线和收购策略，将业务扩展至 GRC 与 AI 治理。公司在 2026 年 9 月 TrustWeek 宣布，借助
              OneTrust CORIE、AI Control Plane 和用于无头集成的 MCP Gateway，转型为 AI-ready
              治理平台。但独立评估也指出明显的运营取舍：快速扩展多产品并进行收购带来了软件集成复杂度和文化摩擦，此前还经历过人员重组。竞争基准进一步显示，OneTrust 的运行时 AI Guard SDK
              目前主要覆盖生产前开发和测试流程，而非全面的生产内联执行。
            claimRefs:
