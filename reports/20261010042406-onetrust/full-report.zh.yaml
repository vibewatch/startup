      - number: '8.2'
        title: 建议立场与决策逻辑
        blocks:
          - type: paragraph
            body: >-
              我们给予 OneTrust “跟踪”建议，信心中等、风险中等，估值偏高。阻碍采取行动的主要因素，是完全缺乏经验证的单位经济、经审计 EBITDA 利润率和留存指标。OneTrust 历史收入增长强劲：2019 年
              $70M、2021 年 $200M、2022 年 $400M，2025 年约 $550M；但 2023 年 7 月以 $4.5B 估值完成的 D 轮融资，相比 2020 年 12 月达到的 $5.1B C
              轮峰值估值明确下调 12%。若没有合同层面的高级清算优先权和经审计收入质量透明度，以当前二级市场标记或超过 $4.0B 的拟议私募资本重组估值进入，风险调整后的安全边际不足。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
