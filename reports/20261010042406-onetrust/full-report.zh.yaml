    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与企业商业模式
        blocks:
          - type: paragraph
            body: >-
              OneTrust 由 CEO Kabir Barday 于 2016
              年创立，总部位于佐治亚州亚特兰大，已成为隐私合规、同意管理和数据治理领域的代表性企业软件平台。公司采用多云订阅模式，覆盖隐私自动化、第三方风险管理、GRC 安全保障和人工智能治理。OneTrust 服务全球超过
              14,000 家客户，其中包括《财富》100 强的 75%；企业按数据量、接入域名和模块能力分层购买年度经常性软件订阅。公司 2024 年称 ARR 有望超过 $500M，同时保持自由现金流为正，但经审计的
              GAAP 财务报表仍未披露。
