      - number: '3.2'
        title: 能力矩阵、产品打包与定价模式
        blocks:
          - type: paragraph
            body: >
              OneTrust 的平台战略建立在覆盖多模块的完整套件上，包括 AI Governance、Consent & Preferences、Data Use Governance、Privacy
              Automation、Tech Risk & Compliance 和 Third-Party
              Management。厂商采用不透明的企业定制报价，价格取决于日均访客、数据主体画像、用户席位和隐私资产清单等指标。这种打包方式让 OneTrust 能够吃下法务、IT
              和市场团队的跨职能预算，但也增加了合同复杂度，使只需要 Cookie 同意或 DSAR 受理等特定工作流的买家更容易转向其他方案。


              点解决方案竞争者利用这种打包僵化，提供固定费率或透明的按用量分层，从而减少销售摩擦。例如，Enzuzo 的自助方案每月 $9 起，覆盖 10 个域名的中端市场方案每月 $300，和 OneTrust
              $10,000 的最低门槛形成鲜明对比。Osano 以“No Fines, No Penalties”承诺做出合同差异化，Captain Compliance 则提供名为 Compliance Shield
              的诉讼保证。相比之下，TrustArc 等企业替代方案同样采用定制报价，覆盖多模块，直接争夺《财富》500 强采购 RFP。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
