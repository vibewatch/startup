      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方不是单一职能负责人，而是委员会：隐私和法务团队负责监管解释与证据；市场和网站团队运营同意体验；安全和风险团队管理控制与事件；数据和 AI
              团队需要允许使用政策；采购团队负责第三方准入。各团队需要共享流程和统一控制层时，平台价值最强。采用证据也显示两条不同路径。TechnologyChecker 找到 2,543 家员工超过 10,000
              人的增强记录公司，但已知规模记录中 73.7% 的员工数不超过 200 人，该平台认为部分原因是自助式同意管理。受监管行业虽有存在但并非主导：金融、保险和医疗合计占来源匹配样本的
              11.1%。这支持企业交叉销售逻辑，也提醒不要把每个探测到的域名都当作全套客户。公司控制的声明称《财富》500 强中超过半数选择 OneTrust，说明企业触达广，但未披露部署广度、合同价值或付费模块数量。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM015
