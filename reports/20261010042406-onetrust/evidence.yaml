evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited GAAP financial statements covering FY2023 through FY2025 revenue, gross margin, EBITDA, and cash flow.
    whyItMatters: >-
      Without audited financial statements, reported ARR milestones and third-party revenue estimates cannot be verified
      independently for valuation and credit assessments.
    diligencePath: Request confidential historical income statements and balance sheets under NDA during late-stage diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Full operational executive roster including Chief Revenue Officer, Chief Legal Officer, and regional operating
      heads.
    whyItMatters: >-
      Complete executive visibility is required to assess key-person dependence across global go-to-market and
      regulatory operations.
    diligencePath: Review internal organizational chart and key executive employment contracts in data room.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: Complete cap table and ownership ledger reflecting all equityholders following the Series D round.
    whyItMatters: >-
      Detailed equity distribution, liquidation preference stack, and voting control rights are necessary to evaluate
      downside waterfall risk below a $4 billion exit.
    diligencePath: Obtain fully diluted capitalization table and investor rights agreements from company counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Paid account counts, ACV distribution, module mix, eligible-enterprise counts, renewal data, and segment win
      rates.
    whyItMatters: >-
      Without these inputs, broad market forecasts and domain detections cannot be translated into a defensible revenue
      SAM or SOM.
    diligencePath: >-
      Request management cohort exports by geography, customer size, product module, ACV band, renewal status, and
      pipeline stage, then reconcile them to audited revenue.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: adoption
    missingEvidence: >-
      A harmonized third-party adoption dataset with one category definition, unit of analysis, and dated customer
      denominator.
    whyItMatters: Published market-share and geography percentages vary materially because sources count different populations.
    diligencePath: >-
      Obtain source methodology notes and compare a common sample of paid customer organizations rather than domains or
      inferred technology detections.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: minor
    topic: roi
    missingEvidence: >-
      The underlying Forrester Total Economic Impact study and customer-level assumptions behind the reported ROI and
      payback figures.
    whyItMatters: >-
      The secondary summary cannot establish whether the economics generalize across buyer segments or deployment
      scopes.
    diligencePath: >-
      Request the full commissioned study, model inputs, implementation costs, and reference-customer profiles from
      management.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: >-
      Audited GAAP financial statements disclosing gross margin, departmental OPEX, EBITDA margins, and net cash flow
      from operations.
    whyItMatters: >-
      Without audited cost breakdowns, underwriting realized unit economics and long-term operating leverage relies on
      unaudited executive commentary.
    diligencePath: >-
      Request audited historical financial statements and CFO management presentations under NDA during late-stage
      underwriting.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: pricing-dynamics
    missingEvidence: >-
      Direct realized contract ACVs, module-level discounting schedules, and multi-year commitment terms across customer
      cohorts.
    whyItMatters: >-
      Pricing opacity conceals whether growth is driven by expanding contract sizes, aggressive discounting, or platform
      packaging shifts.
    diligencePath: Inspect anonymized enterprise customer billing records and CPQ pricing approval logs across tier sizes.
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: query-level-data-policy-enforcement
    missingEvidence: >-
      Production-scale customer references, latency overhead metrics, and empirical query benchmarks for OneTrust Data
      Policy Enforcement.
    whyItMatters: >-
      Data Policy Enforcement operates at database query runtime and remains in private preview; customer production
      evidence is necessary to confirm query overhead and enforcement reliability at scale.
    diligencePath: >-
      Interview design partner customers participating in the Snowflake and Databricks private preview integrations to
      evaluate database throughput degradation and policy failure rates.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: Net Revenue Retention and Cohort Expansion
    missingEvidence: >-
      Audited Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) cohort expansion data broken down by
      enterprise tier and initial acquisition cohort.
    whyItMatters: >-
      NRR is the critical metric for validating whether OneTrust's land-and-expand thesis from consent into AI
      governance generates durable organic expansion without customer fatigue.
    diligencePath: >-
      Request confidential management presentations or audited IPO/PE acquisition diligence reports verifying trailing
      12-month cohort NRR.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: Production Reference Verification for AI Governance Deployments
    missingEvidence: >-
      Quantitative ROI and deployment scale metrics for enterprise AI Governance deployments beyond vendor-curated
      conference award summaries.
    whyItMatters: >-
      OneTrust's valuation and strategic thesis rely on expanding existing privacy customers into AI governance; absence
      of audited deployment data leaves adoption maturity uncertain.
    diligencePath: >-
      Conduct blind customer reference calls with procurement and CISO leaders across Fortune 500 accounts running AI
      Governance modules.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: Enterprise Revenue Concentration Disclosures
    missingEvidence: >-
      Top 10 customer revenue share and vertical concentration metrics across financial services, healthcare, and
      technology sectors.
    whyItMatters: >-
      Validates whether revenue is highly diversified across 14,000+ accounts or dependent on a small cluster of massive
      Fortune 100 contracts.
    diligencePath: Review future S-1 registration statements or lender syndicate confidential information memorandums (CIM).
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited financial statements confirming FY2023-FY2025 ARR, gross margins, EBITDA, and net cash burn.
    whyItMatters: Without audited financial disclosures, valuation marks and financial durability cannot be independently verified.
    diligencePath: Request confidential audited financials, auditor letters, and board reporting during pre-investment diligence.
    relatedQuestionRefs:
      - QR003
      - QR006
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Comprehensive regulatory enforcement records and litigation dockets across non-US statutory jurisdictions.
    whyItMatters: >-
      Global compliance mandates create variable enforcement liabilities that cannot be fully cataloged from public
      domain data.
    diligencePath: >-
      Review litigation disclosure schedules, regulatory inquiry letters, and customer indemnification claims in virtual
      data room.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: minor
    topic: oauth-token-blast-radius
    missingEvidence: >-
      Detailed technical post-mortem and final confirmed customer victim tally for the June 2026 Klue OAuth supply-chain
      incident.
    whyItMatters: Understanding the exact blast radius informs residual cyber risk and potential customer churn.
    diligencePath: >-
      Request third-party forensic incident report and SOC 2 Type II audit exception reports covering the incident
      period.
    relatedQuestionRefs:
      - QR001
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP financial statements covering FY2023 through FY2025 GAAP revenue, gross margin, operating expenses,
      and cash flow.
    whyItMatters: >-
      Without audited financial statements, enterprise valuation multiples and margin trajectories rely entirely on
      third-party estimates.
    diligencePath: Obtain audited income statements and cash flow statements under NDA from company management or lead sponsors.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: Cohort-level Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) metrics across enterprise customers.
    whyItMatters: >-
      High NRR (>=110%) is essential to justify premium software multiples above 7.0x forward revenue in high-interest
      environments.
    diligencePath: Request customer cohort retention and expansion schedules segmented by contract size.
    relatedQuestionRefs:
      - QV008
  - type: conflicting-data
    severity: material
    topic: cap-table-waterfall
    missingEvidence: Detailed capitalization table and liquidation preference waterfall post-July 2023 Series D down round.
    whyItMatters: >-
      Senior participating preferred rights or cumulative dividends could severely impair common equity value in
      sub-$4.5B exits.
    diligencePath: Review the Series D certificate of incorporation, investor rights agreement, and liquidation preferences.
    relatedQuestionRefs:
      - QV008
