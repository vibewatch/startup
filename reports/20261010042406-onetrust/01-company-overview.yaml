chapter:
  number: 1
  title: "Company Overview"
  summary: "OneTrust is a category-defining enterprise trust and data governance software platform founded in 2016 in Atlanta, scaling to an estimated $500M+ ARR across 14,000 customers with $1.13B in cumulative funding and a $4.5B last-round valuation."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Headquarters, and Enterprise Business Model"
    body: "Founded in 2016 by CEO Kabir Barday and headquartered in Atlanta, Georgia, OneTrust established itself as the category-defining enterprise software platform for privacy compliance, consent management, and data governance. The company operates a multi-cloud subscription model spanning privacy automation, third-party risk management, GRC security assurance, and artificial intelligence governance. Serving over 14,000 customers worldwide—including 75 percent of the Fortune 100—OneTrust monetizes via enterprise annual recurring software subscriptions tiered by data volume, connected domains, and modular capabilities. While the company announced in 2024 that it was on track to surpass $500 million in ARR while maintaining positive free cash flow, audited GAAP financial statements remain undisclosed."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO014"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Board Governance"
    body: "OneTrust was founded and continues to be guided by Chief Executive Officer Kabir Barday, who has served as the strategic and operational leader of the company since its inception. Functional technology and product architecture is led by Chief Product and Technology Officer DV Lamba, who oversees core platform engineering and the rollout of runtime AI governance layers. To strengthen enterprise financial rigor ahead of liquidity events, OneTrust introduced Datadog Chief Financial Officer David Obstler in May 2024 as its first independent board director and Audit Committee Chair. This addition provides public-company accounting governance and independent audit discipline to balance founder-centric executive control."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-stakeholders"
    title: "Capitalization History, Valuation Reset, and Institutional Investors"
    body: "OneTrust has raised approximately $1.13 billion in cumulative equity financing across seven institutional investment rounds. Early growth was capitalized through a $200 million Series A in 2019 and subsequent Series B and C rounds led by Insight Partners, SoftBank Vision Fund 2, and TCV, which elevated the company's valuation to a peak between $5.1 billion and $5.3 billion in 2020–2021. In July 2023, OneTrust completed a $150 million Series D financing led by Generation Investment Management with participation from Sands Capital Ventures at a reset valuation of $4.5 billion. While representing a down-round valuation adjustment from peak 2021 multiples, the transaction secured long-term institutional backing and growth capital to sustain operations without requiring dilutive emergency debt financing."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "evolution-milestones-and-tradeoffs"
    title: "Platform Evolution, Milestones, and Operational Tradeoffs"
    body: "Since its founding in 2016 to capitalize on European Union General Data Protection Regulation (GDPR) mandates, OneTrust has executed an aggressive product roadmap and acquisition strategy to broaden its reach into GRC and AI governance. At TrustWeek in September 2026, the company announced its evolution into an AI-ready governance platform powered by OneTrust CORIE, an AI Control Plane, and an MCP Gateway for headless integrations. However, independent assessments highlight material operational tradeoffs: rapid multi-product expansion and acquisitions have introduced software integration complexities and cultural friction, following earlier workforce restructuring. Furthermore, competitive benchmarks note that OneTrust's runtime AI Guard SDK remains largely scoped to pre-production development and testing workflows rather than full-scale inline production enforcement."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs: []
    figureRefs:
      - "FO001"
