  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Partner concentration
    - Top-10 partner revenue share, renewal terms, and take-rate trends
    - Determines earnings durability and public-market confidence
    - CFO / revenue-ops data room request
  - - Retention / cohorts
    - Consumer engagement cohorts and by-product repeat metrics
    - Tests whether user scale is durable, not just cumulative sign-ups
    - Product analytics review
  - - Embedded-credit performance
    - Default, complaint, fraud, and approval-quality data for car finance and Clearer flows
    - Critical to underwriting adjacency quality
    - Credit-risk and compliance review
  - - Capital structure
    - Debt terms, covenants, preference stack, and secondary-sale history
    - Affects real equity value and IPO-readiness quality
    - Finance + counsel diligence
  - - Regulatory / complaints MI
    - FCA/FOS/ICO complaint metrics and major-incident history
    - Required to bridge strategic story to risk-adjusted public valuation
    - Compliance / legal workstream
  notes: A buy call should wait until these topics are evidenced rather than narrated.
