- id: comp-scenarios
  title: Public comps argue for caution on the rumored range
  body: 'The comparable work is directionally clear even after allowing for imperfect matching. Mature listed credit-data and decisioning businesses such as Experian, Equifax, and TransUnion currently trade around the mid-3x to low-4x revenue range using August 2026 market-cap and revenue pages. MONY Group, a more relevant UK consumer-finance marketplace comp, trades nearer the low-2x range. None of these are perfect mirrors of ClearScore: the bureaus own deeper infrastructure, while MONY has broader savings and switching exposure with better disclosure. But they still provide a public-market discipline anchor. Against those references, ClearScore’s rumored IPO framing implies roughly 10.4x to 17.3x FY2025 revenue and about 13.8x at the midpoint. That is not a small premium; it is a materially different pricing regime. A premium can be argued from growth, earlier monetization runway, and platform breadth. It becomes much harder to defend when public evidence on retention, partner concentration,
    take rates, and credit-loss behavior remains thin. That is why the scenario table sits meaningfully below the top end of rumor unless management can show substantially stronger 2026 revenue progression and cleaner cohort-quality evidence than is currently public. The valuation call is therefore not “ClearScore is overvalued in all cases,” but “the available public data does not yet justify paying rumor multiples with confidence.”'
