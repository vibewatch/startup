- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Partner concentration emerges as high
    - Any single partner meaningfully dominates revenue without long contract protection
    - Scalable marketplace starts to look concentrated and fragile
    - Cut valuation tolerance or move to avoid
  - - Complaints / conduct metrics worsen
    - Material negative trend in FOS/FCA/vertical complaint indicators
    - Damages trust and public-market appetite
    - Pause or downgrade investment case
  - - Embedded-credit economics underperform
    - Weak loss, fraud, or take-rate data in car-finance / consolidation flows
    - Adjacency upside turns into earnings-quality concern
    - Shift to bear case
  - - IPO price remains near top-end rumor without better disclosure
    - No KPI bridge on retention, cohorts, or cap structure
    - Premium cannot be defended against public comps
    - Maintain track or avoid
  - - Competition / exit optionality narrows
    - Strategic alternatives limited by buyer-universe scrutiny
    - Reduces downside support for valuation
    - Demand wider margin of safety
  notes: These are the measurable events most likely to change the recommendation materially.
