  rows:
  - - Bull
    - Revenue trends toward ~£190-200m, EBITDA expands, concentration low, and credit-performance data is clean.
    - ~£1.7-2.3bn supported by ~9x-12x forward-style revenue framing.
    - Still needs successful IPO execution and clean disclosure.
    - Only plausible if diligence closes most current evidence gaps.
  - - Base
    - Growth continues, but disclosure only partially improves and public comps remain the discipline anchor.
    - ~£1.0-1.3bn supported by ~6x-8x revenue.
    - Premium multiple remains capped by transparency limits.
    - Most consistent with current public evidence set.
  - - Bear
    - Partner concentration, complaint trends, or embedded-credit economics disappoint.
    - ~£0.6-0.8bn supported by ~4x-5x revenue.
    - Public-market multiple compression and lower confidence in cash-flow quality.
    - Becomes more likely if rumor pricing outruns disclosure.
  notes: Ranges are analytical scenarios, not management guidance.
