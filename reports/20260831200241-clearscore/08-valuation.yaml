  - - Embedded finance, open banking, car finance, and workflow products create optionality beyond a free-score app.
    - Would strengthen if adjacencies show clean unit economics and not just narrative breadth.
  - - Rumored IPO range screens rich versus public bureaus and UK marketplace comps.
    - Would soften if 2026 revenue growth materially outpaces current public expectations or entry price resets lower.
  - - Public evidence is still too thin on concentration, take rates, complaints, and credit-loss performance.
    - Would improve with an IPO-style KPI pack and by-vertical economics.
