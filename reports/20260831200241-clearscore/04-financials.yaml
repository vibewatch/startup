  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, minimum liquidity thresholds, monthly burn, and downside runway model.
    whyItMatters: A profitable EBITDA profile does not itself prove cash resilience through acquisition integration, regulation shocks, or demand slowdowns.
    diligencePath: Request latest board cash forecast, treasury dashboard, covenant calculations, and monthly actual-versus-budget cash bridge.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: partner-unit-economics
    missingEvidence: Top-lender concentration, commission schedules, realised take rates, CAC by acquisition channel, and repeat-conversion cohorts.
    whyItMatters: These inputs determine whether ClearScore’s scale creates durable marketplace economics or only impressive gross activity.
    diligencePath: Request top-20 partner revenue table, contract terms, cohort conversion reports, channel CAC, and contribution-margin bridge by product line.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: debt-covenants-and-security
    missingEvidence: Active facility documents, charge PDFs for 0019 and 0020, covenant package, collateral scope, and restricted-payment terms.
    whyItMatters: Public filings confirm secured financing activity but not whether lender terms constrain M&A, dividends, or future fundraising flexibility.
    diligencePath: Obtain executed facility agreements, charge instruments, lender consent thresholds, and management memo explaining July 2026 satisfactions and June 2026 new charges.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
