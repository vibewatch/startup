- id: unit-economics-costs
  title: Unit economics, cost structure, and what public evidence cannot show
  body: 'Public evidence supports only a partial view of unit economics. On the positive side, the model appears structurally lighter than a lender because ClearScore routes demand and affordability data rather than typically holding consumer credit risk on its own balance sheet. That helps explain why the company can report profitability at this scale while continuing to invest in product, AI, open banking, embedded finance, and international markets. FY2024 UK results also provide a helpful lower-level signal: revenue rose to £89.7 million and operating profit tripled to £18.8 million, while the group reported more than 1.5 million product sales, over 40 exclusive offers, and significant operating leverage in the core UK business. Public company narratives further point to recurring cost buckets: technology and data infrastructure, product and engineering expansion, partner integrations, regulatory/compliance work, and integration spend tied to acquisitions such as Aro and Acre. Yet the
    real underwriting blind spots remain large. No public source reviewed here discloses gross margin, contribution margin by product line, CAC, payback period, repeat-conversion rate, lender concentration, realised commission take rate, or the split between consumer marketplace revenue and newer B2B / software-adjacent lines. Management claims predictable cohort behaviour and compounding revenue, which is encouraging, but outside investors cannot verify that claim rigorously from current public materials alone.'
