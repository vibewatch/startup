chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a profitable marketplace with expanding adjacencies and debt capacity, but not a fully underwritable unit-economics model. Revenue quality looks directionally strong because the business is broker-led rather than balance-sheet-lending-led, yet key underwriting inputs such as take rates, CAC, margin split, cash, and covenants remain non-public.
sections:
- id: revenue-growth-engine
  title: Revenue streams and the current growth engine
  body: 'The cleanest public financial signal is that ClearScore now discloses itself as a profitable marketplace rather than a growth story sustained only by private capital. Official 2026 investor-facing materials put FY2025 revenue at £144.7 million, adjusted EBITDA at £17.1 million, annual product sales at 2.2 million, partners at 200+, and the user base at roughly 25.2-26 million globally. Those same materials are unusually explicit on mechanism: the marketplace is described as the revenue generator, with a matching engine that combines pre-approved offers, exclusive lender products, permissioned data, and deep partner integrations. Earlier ClearScore consumer pages still explain the original core monetisation simply—users do not pay for the score product, and the company earns commission when approved users take a partner product. The growth engine, however, is broader than cards and unsecured loans alone. Aro added embedded-finance distribution and secured-loan broking in 2025, ClearScore
    Everywhere externalised the matching engine into partner channels, D•One sells open-banking-enriched decisioning capabilities to lenders, Acre expands the group into mortgage software and broker workflows, and DriveScore now experiments with a direct insurance-subscription model. That combination suggests revenue is diversifying by channel and use case even if the public accounts still stop well short of disclosing exact stream-by-stream mix or contribution margins.'
