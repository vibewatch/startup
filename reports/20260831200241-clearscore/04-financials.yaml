callouts:
- calloutType: strength
  title: Profitability is now public enough to matter
  body: The biggest financial upgrade versus an early-stage fintech profile is that ClearScore now discloses profitability alongside revenue scale. That gives the company more strategic freedom around IPO timing, acquisitions, and debt use than a venture-dependent peer would have.
  claimRefs:
  - CI003
  - CI004
  - CI013
  - CI019
  - CI036
- calloutType: risk
  title: The underwriting model is still incomplete
  body: Public top-line and EBITDA figures are not enough to underwrite partner concentration, margin durability, or downside liquidity. Cash, burn, take rates, CAC, and debt covenants remain the key blockers to a full financial verdict.
  claimRefs:
  - CI030
  - CI031
  - CI032
  - CI033
  - CI037
- calloutType: insight
  title: Diversification is real, but mix quality is unproven
  body: Aro, Acre, D•One, ClearScore Everywhere, and DriveScore all suggest a broader revenue surface than a simple lead-generation app. The missing question is whether those adjacencies raise recurring, higher-quality revenue or merely add operational complexity.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI021
  - CI023
  - CI035
