callouts:
- calloutType: strength
  title: Distribution scale is the asset that matters most
  body: Public evidence does not show that ClearScore owns a uniquely scarce feature. What it does show is a large UK audience, a broad partner network, and adjacent mortgage / embedded-finance channels that can turn free consumer attention into monetisable demand.
  claimRefs:
  - CP001
  - CP016
  - CP031
  - CP032
- calloutType: risk
  title: Supplier power limits platform independence
  body: The most durable power in this market still sits with the bureaus. ClearScore depends on Equifax for core UK credit-file visibility, while the MSE-to-TransUnion switch after Experian withdrew access shows that downstream consumer brands can lose data routes or bargaining leverage quickly.
  claimRefs:
  - CP024
  - CP030
  - CP033
- calloutType: insight
  title: Multi-homing is rational, so retention quality matters more than raw downloads
  body: Because UK consumers can check multiple services for free and because each bureau view differs, the true competitive question is not whether a user can sign up elsewhere but whether ClearScore converts repeat engagement into approved products more effectively than peers.
  claimRefs:
  - CP022
  - CP023
  - CP034
  - CP036
