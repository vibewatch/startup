  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Referral take rates, lender concentration, exclusivity terms, and realised conversion economics across top partners.
    whyItMatters: Without partner economics, it is impossible to tell whether ClearScore’s scale advantage converts into superior margin quality or is simply larger top-of-funnel volume.
    diligencePath: Request top-20 partner contracts, cohort conversion dashboards, lender concentration by revenue, and any exclusivity or preferred-placement agreements.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: missing-source
    severity: material
    topic: active-user-market-share
    missingEvidence: Independent, current 2026 active-user or session-share benchmarks across ClearScore, Credit Karma UK, TotallyMoney, Experian, and other UK substitutes.
    whyItMatters: Public claims show point estimates for some players, but not a like-for-like share view strong enough to prove sustained category leadership.
    diligencePath: Obtain app analytics, MAU/WAU by market, Similarweb/app-intelligence exports, and brokered market-share studies with consistent methodology.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP001
    relatedFigureRefs:
    - FP001
  - type: missing-source
    severity: minor
    topic: complaint-volumes
    missingEvidence: Comparable complaint-rate and uphold-rate data by competitor, bureau, and product line.
    whyItMatters: Review platforms show visible friction but are not a reliable denominator for trust quality or regulatory risk across peers.
    diligencePath: Request internal complaint dashboards, CRA dispute volumes, FOS referral counts where applicable, and service-level targets by channel.
