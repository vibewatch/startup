  rows:
  - - ClearScore
    - Free bureau-linked marketplace
    - Nearly 16m UK users; 26m global group users; 200+ partners
    - Mass-market UK consumers needing score visibility and offers
    - Free Equifax-linked weekly reporting plus large referral marketplace and mortgage adjacency
    - Dependent on Equifax in UK core proposition and lacks paid multi-bureau view
  - - Credit Karma UK
    - Free bureau-linked marketplace
    - 11,480 Trustpilot reviews; national free-credit brand
    - Mass-market consumers wanting free TransUnion view and offers
    - Always-free positioning with cards, loans, and mortgage funnels
    - Public complaints cite lagging data updates and customer-support frictions
  - - Experian
    - Incumbent bureau with freemium direct channel
    - 16m users claimed on free-score surface
    - Consumers wanting bureau-direct access, boosts, and premium monitoring
    - Owns bureau data, strong brand, free score, paid CreditExpert and marketplace
    - Long-term full-report access sits behind paid service or slower statutory route
  - - myEquifax
    - Incumbent bureau with freemium direct channel
    - 28.8m myEquifax users globally as of Mar-2025
    - Consumers wanting bureau-direct score, report, and identity tools
    - Free basic/statutory access plus paid identity and family plans
    - Subscription complexity and trial/refund complaints visible on Trustpilot
  - - TotallyMoney
    - Free aggregator / affiliate marketplace
    - 5m customers and counting
    - Consumers wanting live score updates and approval-oriented matching
    - Strong pre-approval and lender-matching message with no-fee core product
    - No bureau ownership and weaker public scale than ClearScore
  - - Checkmyfile
    - Paid multi-bureau monitoring
    - Known mortgage-prep / tri-bureau use case; strong review volume
    - High-intent borrowers wanting full multi-agency picture
    - Experian, Equifax, and TransUnion in one place after trial
    - Charges £14.99 per month after short trial and draws subscription complaints
  - - MoneySuperMarket Credit Score
    - Comparison-led substitute
    - Large comparison-site traffic but no disclosed dedicated credit-member base
    - Consumers wanting free score plus product-shopping in one flow
    - Free TransUnion-linked score and soft-search deal surfacing
    - More of an acquisition funnel than a sticky full-service credit destination
  - - MSE Credit Club
    - Education-led substitute
    - Large MSE brand reach but no standalone bureau ownership
    - Consumers wanting free score context and eligibility education
    - Editorial trust and MSE Eligibility Rating framing
    - Supplier dependence exposed by move away from Experian
