tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Mass-market consumers
    - User=consumer; payer=partners
    - Monitor credit health and browse matched offers
    - Nearly 16m UK users; 25m+ global users
    - Core demand pool for all downstream monetisation
    - No public MAU/WAU or paid-conversion detail
  - - International consumers
    - User=consumer; payer=partners
    - Replicate marketplace model outside UK
    - 9m+ international users and £39m revenue in 2025
    - Validates transferability of the model
    - No market-by-market profitability or retention split
  - - Open-banking-connected consumers
    - User=consumer; payer=lenders/partners indirectly
    - Share transaction data to improve affordability and matching
    - 2.6m to 3.5m connected-user base depending on disclosure date
    - Higher-quality signal and potentially higher conversion
    - Connected-user growth and churn not fully public
  - - Lender partners
    - Buyer/payer=lenders
    - Acquire and price credit demand more accurately
    - 30+ D•One lenders named; 200+ partners group-wide
    - Revenue source and core monetisation engine
    - Partner concentration and contract terms undisclosed
  - - Embedded-finance partners
    - Buyer/payer=retailer or FS partner
    - Embed marketplace into existing customer journeys
    - Named brands include Asda, Co-op, Admiral Group, Vanquis
    - Expands acquisition beyond direct app traffic
    - No public partner revenue split or renewal data
  - - Workflow partners
    - Buyer/payer=lender or partner platform
    - Automated debt consolidation, car finance, or mortgage journeys
    - Named proofs include Zuto, Monzo, Abound
    - Shows deepening utility beyond lead generation
    - Scale by partner and economics not public
  notes: Segmentation distinguishes consumers from monetising counterparties because ClearScore is a two-sided platform.
