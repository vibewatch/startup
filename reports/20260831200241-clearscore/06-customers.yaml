- id: expansion-concentration
  title: Expansion loops and concentration risks
  body: 'The expansion story is credible, but concentration remains under-disclosed. Public sources show several land-and-expand loops: free consumer app usage feeds matched offers; open-banking connections improve affordability and broaden approvals; Clearer can move users from browsing to debt-consolidation execution; Zuto extends into car-finance brokerage; and embedded-finance partnerships put ClearScore inside retailer or lender journeys before the consumer even reaches a traditional comparison flow. That is why the company increasingly looks like a distribution layer serving both end users and financial partners. The risk is that the same architecture increases dependence on counterparties whose economics are not public. Investors do not know from current materials how much revenue is concentrated in top lenders, which partner channels renew on fixed terms, or whether any individual vertical such as car finance or debt consolidation has become strategically essential. Complaints-process
    disclosure also reminds us that user trust can still be disrupted by service or data issues that then escalate to formal redress channels. Overall, customer proof is strong enough to support growth and platform breadth, but not strong enough to dismiss concentration, retention, or partner-dependence risk. That missing concentration detail is the central customer-quality unknown today.'
