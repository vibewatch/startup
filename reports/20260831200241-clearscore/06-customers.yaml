callouts:
- calloutType: strength
  title: Top-of-funnel adoption is one of the strongest public proof points
  body: Few private fintechs disclose a customer surface this clearly. The combination of 16m UK users, 25m+ global users, 2.2m product sales, and named partner deployments provides a credible proof base that ClearScore is already operating at scaled consumer reach.
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU016
  - CU018
  - CU020
- calloutType: risk
  title: Retention and concentration are still mostly opaque
  body: Public materials are much stronger on user counts and named partners than on churn, renewal, or revenue concentration. That is enough to support interest, but not enough to assume durable monetisation quality without partner-level and cohort-level diligence.
  claimRefs:
  - CU026
  - CU027
  - CU030
  - CU038
- calloutType: insight
  title: The best customer proof is downstream, not just in downloads
  body: Zuto, Monzo, Abound, Asda, and Co-op matter because they show ClearScore moving beyond passive credit monitoring into embedded and executable financial workflows. That makes the company’s customer story deeper than app-user counts alone.
  claimRefs:
  - CU016
  - CU018
  - CU020
  - CU022
  - CU037
