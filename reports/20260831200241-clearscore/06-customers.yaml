- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Open-banking-connected user growth
    - Reliance on connected-user consent and partner use of the data
    - Affects lead quality and approval expansion
    - Request connected-user conversion and consent-retention cohorts
  - - Embedded-finance partners
    - Large brands could become disproportionately important acquisition channels
    - Could shift bargaining power away from ClearScore
    - Request revenue mix by embedded partner and renewal terms
  - - Car-finance expansion via Zuto
    - Exclusive vertical partner dependence
    - Could expose one category to partner execution or regulation shocks
    - Review exclusivity scope, performance terms, and backup options
  - - Debt-consolidation flows via Monzo / Abound / others
    - Small set of named lender partners currently visible
    - Could concentrate higher-intent product conversion
    - Request funded-volume by lender and channel
  - - International scale-up
    - Growth may rely on a few strongest countries such as South Africa
    - Could mask uneven cohort quality across markets
    - Request country-level retention, revenue, and marketing efficiency
  notes: The table focuses on concentration risks that public customer proof surfaces but does not quantify.
