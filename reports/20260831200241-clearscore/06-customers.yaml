- id: named-proof-retention
  title: Named customer proof and retention proxies
  body: 'Named customer proof is strongest on the partner side. ClearScore Everywhere is already live with named brands such as Asda, Co-op, Admiral Group, and Vanquis, which helps demonstrate that the embedded-distribution thesis has moved beyond concept. Zuto is an even clearer proof point because the partnership is described as exclusive, serves ClearScore’s 16 million UK users, and has already powered £250 million of loans over four years. Monzo provides a product-led proof of repeat trust: inside the Monzo app, customers can bring borrowing together using ClearScore’s Clearer technology so that existing lenders are repaid automatically. Abound provides the best multi-year proof. Open Banking Expo says it was a launch partner for Clearer in 2024 and has offered Clearer-powered consolidation loans on the ClearScore marketplace for two years before embedding the technology into its wider customer journey, while later D•One coverage says Abound gains earlier access to a 3.5 million connected-user
    pool. Consumer proof also exists, but it is softer. Trustpilot commentary is strongly positive on clarity and support, and the Google Play listing emphasises alerts, Protect, reports, and personalised offers. Those are good stickiness signals, yet they are still proxies for true retention rather than direct churn or cohort disclosure.'
