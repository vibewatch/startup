chapter:
  number: 6
  title: Customers
  summary: ClearScore has unusually strong public adoption proof for a private fintech at the top of funnel—16m UK users, 25m+ global users, 2.2m annual product sales, and a growing open-banking-connected base—but weaker visibility on formal retention, contract length, and partner concentration. Named customer proof is strongest in partner deployments such as Zuto, Monzo, Abound, Asda, and Co-op rather than in classical enterprise case studies.
sections:
- id: segments-adoption
  title: Customer segments and adoption trajectory
  body: 'ClearScore serves more than one customer layer. The obvious front end is the mass-market consumer using the free app to monitor credit health, read a bureau-backed report, receive alerts, and browse matched financial products. But the payer side includes lenders buying matched demand, partner brands embedding ClearScore journeys, and now workflow partners such as Zuto, Monzo, Abound, and mortgage or open-banking counterparties. Public scale evidence is relatively strong. ClearScore says the UK app is trusted by nearly 16 million users, while investor and group pages place the broader user base at roughly 25.2 to 26 million globally, including more than 9 million users internationally and £39 million of international revenue in 2025. Product activity also looks real rather than cosmetic: the group disclosed 2.2 million annual product sales in FY2025, while the UK-results release cited more than 1.5 million product sales in FY2024 and more than 40 exclusive offers. Geography matters
    as well. Moneyweb reported 6.6 million South African users in February 2026 with a target above 7.5 million by year-end, supporting the idea that ClearScore is not only a UK one-off. Adoption is therefore well evidenced at the top of the funnel; the less visible question is how deeply those users convert, repeat, and stay engaged over time.'
