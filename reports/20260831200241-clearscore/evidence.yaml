evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, preference stack, and any liquidation preferences across existing equity holders.
    whyItMatters: IPO valuation quality and downside protection cannot be judged cleanly without ownership and preference overhang.
    diligencePath: >-
      Request current shareholder register, most recent financing documents, and board materials summarising classes and
      preference rights.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: investor-list
    missingEvidence: Authoritative current confirmation of whether TA Associates or Ontario Teachers have direct equity ownership.
    whyItMatters: >-
      Public summaries and prompt background conflict on investor identity, and repeating unverified names would degrade
      overview accuracy.
    diligencePath: >-
      Obtain management-provided cap-table summary or recent shareholder resolution; cross-check with Companies House
      filings and financing announcements.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: 2025-statutory-accounts
    missingEvidence: Full statutory accounts for the year ending 31 December 2025 and segment-level revenue mix.
    whyItMatters: >-
      The overview can confirm top-line growth and EBITDA, but not segment economics or exact legal-entity-to-group
      reconciliation.
    diligencePath: Request FY2025 audited accounts, management bridge from legal entities to group figures, and lender covenant pack.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-definition
    missingEvidence: >-
      A public source that isolates the commission-addressable UK credit-marketplace SAM for cards, loans, car finance,
      insurance, and mortgages combined.
    whyItMatters: Without a clean SAM, valuation work must rely on proxies rather than market-share arithmetic.
    diligencePath: >-
      Request management market-sizing deck or lender-panel gross-profit model that bridges product volumes to
      monetisable referral pools.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: conversion-rates
    missingEvidence: >-
      ClearScore’s current funnel conversion rates from score check to open-banking link to funded product by vertical
      and geography.
    whyItMatters: Public user and borrowing metrics do not reveal monetisation efficiency or payer quality.
    diligencePath: Request internal cohort funnel by product line and market, plus lender take-rates and cancellation data.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: open-banking-denominators
    missingEvidence: Consistent public denominator for active open-banking users versus connected quotes versus connected accounts.
    whyItMatters: Public sources quote 15m+ national users and 2m+ ClearScore-enabled users, but they do not reconcile definitions.
    diligencePath: >-
      Reconcile Open Banking Limited, FCA, and management definitions before using penetration ratios in investment
      models.
    relatedQuestionRefs:
      - QM008
      - QM009
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: >-
      Referral take rates, lender concentration, exclusivity terms, and realised conversion economics across top
      partners.
    whyItMatters: >-
      Without partner economics, it is impossible to tell whether ClearScore’s scale advantage converts into superior
      margin quality or is simply larger top-of-funnel volume.
    diligencePath: >-
      Request top-20 partner contracts, cohort conversion dashboards, lender concentration by revenue, and any
      exclusivity or preferred-placement agreements.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
      - TP004
  - type: missing-source
    severity: material
    topic: active-user-market-share
    missingEvidence: >-
      Independent, current 2026 active-user or session-share benchmarks across ClearScore, Credit Karma UK,
      TotallyMoney, Experian, and other UK substitutes.
    whyItMatters: >-
      Public claims show point estimates for some players, but not a like-for-like share view strong enough to prove
      sustained category leadership.
    diligencePath: >-
      Obtain app analytics, MAU/WAU by market, Similarweb/app-intelligence exports, and brokered market-share studies
      with consistent methodology.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
    relatedFigureRefs:
      - FP001
  - type: missing-source
    severity: minor
    topic: complaint-volumes
    missingEvidence: Comparable complaint-rate and uphold-rate data by competitor, bureau, and product line.
    whyItMatters: >-
      Review platforms show visible friction but are not a reliable denominator for trust quality or regulatory risk
      across peers.
    diligencePath: >-
      Request internal complaint dashboards, CRA dispute volumes, FOS referral counts where applicable, and
      service-level targets by channel.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP004
    relatedFigureRefs:
      - FP002
      - FP003
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, minimum liquidity thresholds, monthly burn, and downside runway model.
    whyItMatters: >-
      A profitable EBITDA profile does not itself prove cash resilience through acquisition integration, regulation
      shocks, or demand slowdowns.
    diligencePath: >-
      Request latest board cash forecast, treasury dashboard, covenant calculations, and monthly actual-versus-budget
      cash bridge.
    relatedQuestionRefs:
      - QI019
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: partner-unit-economics
    missingEvidence: >-
      Top-lender concentration, commission schedules, realised take rates, CAC by acquisition channel, and
      repeat-conversion cohorts.
    whyItMatters: >-
      These inputs determine whether ClearScore’s scale creates durable marketplace economics or only impressive gross
      activity.
    diligencePath: >-
      Request top-20 partner revenue table, contract terms, cohort conversion reports, channel CAC, and
      contribution-margin bridge by product line.
    relatedQuestionRefs:
      - QI016
      - QI017
      - QI025
    relatedTableRefs:
      - TI002
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: debt-covenants-and-security
    missingEvidence: >-
      Active facility documents, charge PDFs for 0019 and 0020, covenant package, collateral scope, and
      restricted-payment terms.
    whyItMatters: >-
