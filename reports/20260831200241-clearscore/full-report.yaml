      - number: '3.2'
        title: Capability, pricing, and distribution comparisons
        blocks:
          - type: paragraph
            body: >-
              On the surface, many products look similar: free score checks, educational tips, lender offers, and
              soft-search eligibility messaging recur across ClearScore, Credit Karma, TotallyMoney, Experian, and
              MoneySuperMarket. The deeper differences sit underneath the UI. ClearScore anchors on free Equifax-backed
              weekly reporting and a commission-funded marketplace; Credit Karma anchors on TransUnion data and free
              monitoring with loan, card, and mortgage funnels; Experian and Equifax combine bureau ownership with
              freemium upsells; and Checkmyfile monetises by charging for cross-bureau visibility after a trial.
              MoneySuperMarket and MSE Credit Club compete less on owning the end-to-end credit relationship and more on
              consumer education, eligibility framing, and product discovery. That means ClearScore's product edge is
              breadth of partner routing and a large installed UK audience, not a unique ability to show a credit score.
              Public competitor evidence repeatedly suggests that the same consumers can and do use multiple services
              because each bureau view differs and because checking one’s own score is generally free and non-damaging.
              In practice, the buyer sees many near-substitutes, so distribution efficiency and trust consistency matter
              more than cosmetic feature claims. That is especially true when consumer acquisition costs rise or bureau
              relationships shift.
