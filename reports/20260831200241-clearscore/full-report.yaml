      - number: '7.2'
        title: Operational risk is really dependency risk at scale
        blocks:
          - type: paragraph
            body: >-
              Operationally, ClearScore looks more mature than a casual “free credit score app” description would
              suggest. The company says it serves roughly 26 million users, has over 200 partners, processes around 75
              million daily events, handles hundreds of terabytes of data monthly, and ships roughly 4,000 production
              releases per month with 99.99% uptime. Those are meaningful operating claims, and they support the idea
              that the platform has real engineering depth. But they also make external dependencies more important, not
              less. AWS, Kafka, Databricks, and Confluent are not optional back-office tools; they are part of the core
              machine. ClearScore Everywhere depends on partner implementation quality. D•One depends on bank
              connectivity, lender integrations, and user consent continuity. Zuto adds a fast-growing but
              conduct-sensitive motor-finance layer, while Clearer integrations with Monzo and Abound push the product
              deeper into execution rather than simple lead referral. The financial risk is similarly indirect. FY2025
              profitability reduces burn anxiety, but public sources still do not show partner concentration, take
              rates, renewal terms, credit losses, or covenant headroom. That means the highest-severity operating risks
              are less about “can the app stay online?” and more about whether external counterparties, data rights, or
              vertical-specific conduct issues can interrupt revenue quality faster than headline growth suggests.
