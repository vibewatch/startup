      - number: '5.3'
        title: Maturity, trust controls, and technology risks
        blocks:
          - type: paragraph
            body: >-
              The maturity profile is uneven in a useful way. Core marketplace, open-banking, and telematics workflows
              look mature: the group claims 99.99% uptime, 4,000 production releases per month, 2.6 million open-banking
              connections, 16% of lending powered by open-banking data, and an exclusive Zuto partnership that has
              already powered £250 million of loans over four years. Protect and Protect Plus also show a fairly
              developed control set around dark-web monitoring, credit alerts, insurance, and fraud support. In
              contrast, ACBP is openly labeled early development, with v0.4 materials intended for technical review and
              prototyping rather than production-stable use. That transparency is positive, but it means investors
              should treat the protocol as option value, not present-day revenue proof. Trust and compliance controls
              are visible but incomplete. ClearScore discloses FCA and ICO identifiers, an Open Banking privacy policy
              with ICO escalation rights, and a complaints path that can reach the Financial Ombudsman Service. However,
              the reviewed public sources do not substantiate formal security certifications, audited incident history,
              or partner SLA metrics. Product diligence should therefore focus on integration reliability, consent
              friction, data-right continuity, and whether the newest AI and embedded-finance layers can scale without
              weakening control quality. Investors should therefore separate proven release discipline from
              still-unverified external assurance and newest-channel adoption.
