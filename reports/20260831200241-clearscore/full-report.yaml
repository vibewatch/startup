      - number: '8.3'
        title: Track is the right call until disclosure improves or price softens
        blocks:
          - type: paragraph
            body: >-
              A buy recommendation would require a better bridge from strategic promise to underwritten valuation.
              Today, the best-supported call is track with medium confidence, high risk, and a stretched valuation
              stance at the rumored IPO range. That is not a dismissal. ClearScore has enough scale, monetization proof,
              profitability, and product breadth to remain a serious candidate for follow-on diligence and to deserve
              attention if the listing window opens. However, the gaps that remain are precisely the gaps public
              investors punish: partner concentration, contract durability, cohort retention, credit-performance by
              embedded vertical, complaints trends, and capital-structure nuance. The recommendation can move positively
              if those items are disclosed and if no single partner or cohort dominates earnings quality. It can also
              deteriorate quickly if motor-finance or debt-consolidation economics prove weaker than expected or if the
              company pushes for a venture-style price without public-market style transparency. In practice, the
              investment committee should use the final diligence table as a gating checklist. If management answers
              those questions well, ClearScore may support a premium entry, particularly at the lower end of rumor or
              below. If the answers remain partial, the right posture is to keep monitoring rather than force precision
              where the evidence still does not support it.
