      - number: '3.3'
        title: Switching costs, supplier power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Competitive durability is therefore mixed. ClearScore has real distribution assets: nearly 16 million UK
              users on the consumer app, a 26 million-user global group footprint, more than 200 partners, and adjacency
              expansion into mortgage software and embedded finance. Those assets should matter to partners deciding
              where to route demand. But the adverse evidence is equally important. User complaints across Trustpilot
              pages for Credit Karma, Equifax, TotallyMoney, and Checkmyfile show that service trust can be lost through
              stale data, billing friction, or support failures; ClearScore's own complaints guidance explicitly says UK
              report disputes are ultimately about data held by Equifax, underlining supplier dependence. The Which?
              report on MSE Credit Club losing Experian access is another warning: bureau relationships can reshape
              downstream distribution economics quickly, and the bureau layer retains structural power over
              consumer-credit rails. ClearScore's moat is therefore better described as scaled distribution plus partner
              integration, not proprietary lock-in. Because multi-homing is cheap and several category features are
              reproducible, underwriting should assume steady competitive pressure unless diligence uncovers stronger
              exclusivity, superior take rates, or partner-preference evidence that public sources do not provide.
              Unless management can prove better repeat conversion or lender preference, public evidence alone supports
              a competitive advantage, but not a monopoly-like one.
