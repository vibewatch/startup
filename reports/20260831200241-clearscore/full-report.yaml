  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Business quality is IPO-worthy, but price support is the issue
        blocks:
          - type: paragraph
            body: >-
              The most important valuation conclusion is that ClearScore has largely graduated from the “interesting
              private fintech” bucket into the “credible public-market candidate” bucket on operating substance. FY2025
              revenue of £144.7 million, adjusted EBITDA of £17.1 million, 2.2 million annual product sales, a 25m+
              global user base, and 200+ partners collectively show a real scaled marketplace, not a thin top-of-funnel
              app. The strategic story is also broader than a free credit score: management has built embedded-finance
              distribution, open-banking data enrichment, car-finance workflows, mortgage adjacencies, and a visible
              data/decisioning infrastructure layer. That is enough to explain why JPMorgan would be advising on
              strategic options and why London IPO discussion is no longer fanciful. The problem is valuation
              discipline. The available 2026 reporting frames a possible £1.5-2.5 billion IPO, or about £2 billion
              centrally, but those are talk-track numbers rather than a completed transaction. At that range, the market
              would be asked to underwrite both operating strength and future proof still missing from the public
              record. That missing bridge matters. Investors can believe ClearScore is a good company and still conclude
              that the current rumored price asks too much from the evidence base. This chapter therefore separates
              business quality from entry attractiveness and treats the recommendation as explicitly price-sensitive.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
