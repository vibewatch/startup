      - number: '7.3'
        title: Execution risk is manageable only with explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              The final risk layer is execution breadth. ClearScore is no longer only a UK comparison surface; it now
              spans five operating markets plus adjacencies in embedded finance, mortgage workflows, telematics,
              open-banking infrastructure, and an early agentic-credit protocol. That breadth can compound value if
              management keeps governance tight, but it also increases the chance that scarce executive attention is
              spread across too many control regimes and partner sets. Founder-CEO Justin Basini remains central to the
              external strategy story, including the London-listing ambition, which is acceptable but does concentrate
              part of the narrative risk in one leader. Importantly, none of the biggest risks are unknowable. Each can
              be translated into monitorable diligence asks: confirm whether any partner accounts for a double-digit
              revenue share; test whether FCA/ICO/FOS complaint metrics are stable; inspect default and charge-off
              behavior in debt-consolidation and car-finance cohorts; review information-security attestations; and
              understand covenants attached to any secured obligations. If those items come back clean, ClearScore’s
              profitability and platform depth can support a more constructive underwriting stance. If not, the downside
              can travel quickly from conduct or partner issues into growth quality, valuation, and exit optionality.
              The chapter’s conclusion is therefore simple: ClearScore is investable only if risk monitoring is treated
              as a first-class workstream, not a post-investment clean-up project.
            claimRefs:
