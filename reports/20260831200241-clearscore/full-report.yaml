          - type: callout
            title: Multi-homing is rational, so retention quality matters more than raw downloads
            body: >-
              Because UK consumers can check multiple services for free and because each bureau view differs, the true
              competitive question is not whether a user can sign up elsewhere but whether ClearScore converts repeat
              engagement into approved products more effectively than peers.
