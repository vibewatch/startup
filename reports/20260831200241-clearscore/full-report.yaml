  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Regulatory and partner risks carry the highest residual severity because they can travel directly into conversion,
      revenue quality, and exit optionality.
    approximationNotes: Labels are evidence-based analyst judgments synthesising the cited sources; they are not company risk ratings.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Competition / M&A scrutiny
          values:
            - label: Medium
              tone: warning
              detail: Historical CMA precedent exists
            - label: Very high
              tone: negative
              detail: Can constrain exit paths
            - label: Low
              tone: warning
              detail: No public remedy planning visible
            - label: High
              tone: negative
              detail: Strategic-sale optionality could narrow
        - label: Consumer Duty / conduct
          values:
            - label: Medium
              tone: warning
              detail: Partner journeys increase complexity
            - label: High
              tone: negative
              detail: Consumer-harm issues hit brand and regulators
            - label: Medium
              tone: warning
              detail: Permissions and complaints process are visible
            - label: High
              tone: negative
              detail: Needs ongoing MI and partner controls
        - label: Partner concentration
          values:
            - label: Medium
              tone: warning
              detail: 200+ partners but no mix disclosure
            - label: Very high
              tone: negative
              detail: Top-partner churn can hit revenue quickly
            - label: Low
              tone: warning
              detail: Public mitigants are thin
            - label: High
              tone: negative
              detail: Unknown economics dominate residual risk
        - label: Security / data-quality event
          values:
            - label: Low-medium
              tone: warning
              detail: No public incident spike seen
            - label: High
              tone: negative
              detail: Large user base raises blast radius
            - label: Medium
