  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              The product surface now spans several linked workflows. The consumer-facing core remains the free
              score-and-report app: users check a bureau-backed credit view, understand their financial position,
              receive alerts, and browse matched offers for cards, loans, car finance, mortgages, and insurance. Open
              Banking adds a second workflow in which users consent to share income-and-spend data to improve
              affordability assessment and product matching. Around that core, the group has assembled several adjacent
              modules: Protect and Protect Plus for identity monitoring; DriveScore for telematics-led car-insurance
              journeys; ClearScore Everywhere for embedded credit distribution inside retailer or financial-service
              partner channels; D•One for lender-facing open-banking connectivity; Acre for mortgage-broker workflow
              software; and ACBP for AI-agent-mediated credit journeys. Official workflow descriptions are unusually
              concrete. ClearScore Everywhere says real-time offers can be embedded in partner sites with
              post-application referrals and 80+ live connections, while the ACBP materials define how a User Agent,
              Credit Broker, and Lender divide responsibilities. That makes the operating model more like a family of
              distribution and decisioning layers than a single consumer app. The important takeaway is that users can
              increasingly start in many surfaces while ClearScore tries to retain the orchestration layer.
