            body: >-
              Public sources are detailed enough to support a specific architectural view, even if they are still
              marketing-adjacent. Strategic-differentiator and partner-event materials describe a modular platform built
              on AWS, Kafka, Databricks, and Confluent, using Server-Driven UI to ship thousands of monthly production
