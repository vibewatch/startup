            title: Distribution scale is the asset that matters most
            body: >-
              Public evidence does not show that ClearScore owns a uniquely scarce feature. What it does show is a large
              UK audience, a broad partner network, and adjacent mortgage / embedded-finance channels that can turn free
              consumer attention into monetisable demand.
            calloutType: strength
            claimRefs:
