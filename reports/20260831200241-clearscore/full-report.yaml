      - number: '4.3'
        title: Capital adequacy, financing dependency, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy looks better than the original startup label might suggest, but it is not fully
              transparent. The company is still private, yet public 2025-2026 materials consistently frame it as
              profitable and strategically optional rather than capital constrained. The best supporting signals are the
              FY2025 EBITDA disclosure, the earlier tripling of UK operating profit, and HSBC Innovation Banking’s £30
              million facility announced in February 2025. Companies House filing history and charges pages add
              important nuance: the business has been actively using secured financing structures, with multiple
              historical charges involving Silicon Valley Bank or HSBC-related entities, widespread satisfactions
              recorded on 10 July 2026, and fresh registrations dated 30 June 2026. That does not imply distress by
              itself—refinancing, collateral reshuffling, or acquisition-related facility updates are all plausible—but
              it does mean covenant packages, security coverage, and lender rights are material open diligence items.
              Market conditions are also not frictionless. Bank of England data show current consumer-credit demand
              remains healthy, but Grant Thornton’s 2026 market update flags motor-finance redress uncertainty and
              BNPL-rule changes that could affect lenders and the monetisation climate around credit distribution.
              Overall, the public evidence supports a verdict of positive revenue quality and manageable capital
              intensity, but not a complete underwriting-ready file: exact cash, burn, runway, debt terms, and
              stream-level margins remain unavailable.
