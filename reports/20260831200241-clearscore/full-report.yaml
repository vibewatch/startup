  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, bureau incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              ClearScore does not face one clean peer set. The nearest direct alternatives are other free
              consumer-credit surfaces that combine score visibility with product matching, especially Credit Karma UK,
              TotallyMoney, MoneySuperMarket Credit Score, and MSE Credit Club. A second class consists of the bureaus
              themselves—Experian and Equifax in particular—which both supply underlying credit data and compete for the
              end consumer with freemium account products, identity features, and their own marketplaces. A third class
              is paid monitoring, led here by Checkmyfile, which appeals to higher-intent consumers who want all three
              major UK bureau files in one place before applying for a mortgage, loan, or card. The market-analysis
              chapter already showed that consumers often need more than one bureau view because data, scales, and
              lender usage differ; that fact makes multi-homing rational and means the real job is not simply “show me a
              score” but “help me understand, improve, and convert my credit profile into an approved product.” In that
              broader frame, affiliate-led comparison pages and even statutory-report portals are credible substitutes
              whenever users only need a one-off check rather than a persistent relationship. That breadth matters
              because a consumer choosing between these tools is often deciding simultaneously where to monitor their
              file, where to learn, and where to apply for credit.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP021
              - CP022
