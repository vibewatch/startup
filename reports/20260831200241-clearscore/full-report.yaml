        title: Leadership, governance, and capital backing
        blocks:
          - type: paragraph
            body: >-
              Leadership is still founder-led. ClearScore Group's 2026 about-us page identifies Justin Basini as group
              CEO and co-founder, supported by executives including CFO Brian Cole, CTO Klaus Thorup, chief data officer
              Michael Woodburn, and chief commercial officer Tom Markham. Companies House officer records show Basini,
              Nigel Morris, Benjamin Tsai, Jerome Reidy, Daniel Cobley, and newly appointed Geeta Gopalan in the active
              governance perimeter, while the 2021 Invus transaction stated that Nigel Morris remained chairman and that
              Benjamin Tsai joined the board. Capital support has come from a mix of equity and non-dilutive financing:
              the 2021 investment valued the company at $700 million, existing investors including QED, Blenheim
              Chalcot, and Lead Edge largely held their positions, and HSBC Innovation Banking extended £30 million of
              debt in 2025. That combination suggests a business able to finance expansion without a forced
              public-market timetable, although accessible public evidence still leaves the precise current cap table
              opaque. Public evidence is still thinner on exact board committees, liquidation preferences, and any
              observer rights attached to lender or investor relationships, so governance interpretation should remain
              conservative until full financing documents are reviewed.
