              nearly 16 million users, while investor and group pages place the broader user base at roughly 25.2 to 26
              million globally, including more than 9 million users internationally and £39 million of international
              revenue in 2025. Product activity also looks real rather than cosmetic: the group disclosed 2.2 million
              annual product sales in FY2025, while the UK-results release cited more than 1.5 million product sales in
              FY2024 and more than 40 exclusive offers. Geography matters as well. Moneyweb reported 6.6 million South
              African users in February 2026 with a target above 7.5 million by year-end, supporting the idea that
              ClearScore is not only a UK one-off. Adoption is therefore well evidenced at the top of the funnel; the
