              repo publishes an early technical specification, schema appendix, and REST/MCP bindings. The dependency
              picture is therefore explicit. ClearScore relies on credit-bureau data, open-banking permissions, partner
              APIs, cloud/data infrastructure, and regulated broker control. That gives it more defensible operating
              know-how than a simple comparison site, but also creates several external points of failure. It also means
