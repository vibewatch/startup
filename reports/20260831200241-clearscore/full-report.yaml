      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The 2026 adoption debate is about trust, data consent, and regulation as much as about demand. The
              whitepaper and FCA research note both argue that open banking, AI, and richer affordability data can
              expand access to underserved or near-prime borrowers, while cited lender case studies show a 14% lift in
              marketplace lending volumes and a 25% approval-rate improvement for one major lender without worse
              arrears. Falling rates and a more growth-oriented regulatory tone also help. But the same evidence base is
              explicit that friction persists: outdated systems, inconsistent standards, low consumer awareness,
              plateaued consent rates near 30%, BNPL regulation, motor-finance redress uncertainty, and the lingering
              fear that regulators or redress bodies will re-judge previously compliant practice. Those constraints
              shape valuation because they limit how quickly a marketplace like ClearScore can convert user reach into
              funded-product volume or software penetration. The buyer/user/payer map also slows adoption in practice:
              consumers must trust data sharing, lenders must accept new underwriting methods, and partners must
              integrate APIs or embedded-finance journeys. ClearScore’s South African traction, retailer adjacency
              through Aro, and mortgage adjacency through Acre show that the model can travel, but the speed of travel
              depends on regulatory clarity and integration economics rather than on brand awareness alone. That dynamic
              is why later financial and valuation work should treat regulatory clarity and lender-integration speed as
              first-order scenario variables, not as background colour.
