            title: Supplier power limits platform independence
            body: >-
              The most durable power in this market still sits with the bureaus. ClearScore depends on Equifax for core
              UK credit-file visibility, while the MSE-to-TransUnion switch after Experian withdrew access shows that
              downstream consumer brands can lose data routes or bargaining leverage quickly.
            calloutType: risk
            claimRefs:
              - CP024
              - CP030
