  topStrengths:
    - >-
      Profitable at scale: FY2025 revenue of £144.7M and adjusted EBITDA of £17.1M remove the most immediate fundraising
      pressure.
    - >-
      Large installed audience and partner network: 26M users across five markets and 200+ partners create real
      distribution leverage.
    - >-
      Product breadth now extends beyond free scores into open banking, embedded finance, car finance, debt
      consolidation, and mortgage adjacencies.
    - >-
      Still-private optionality: JPMorgan advisory work suggests credible strategic and IPO pathways rather than a
      forced liquidity event.
  topRisks:
    - >-
      Rumored IPO pricing of roughly £1.5B-£2.5B implies a revenue multiple well above public bureau and marketplace
      comparables.
    - >-
      Public disclosure remains thin on partner concentration, retention cohorts, take rates, and by-vertical
      credit-performance metrics.
    - >-
      Conduct, privacy, and partner-governance risks can travel quickly through a consumer-credit platform regulated
      around FCA / ICO / FOS boundaries.
    - >-
      Strategic-exit optionality is not unlimited: the failed Experian sale shows UK competition scrutiny can matter
      materially.
  unresolvedGaps:
    - Top-partner revenue concentration, renewal terms, and take-rate history are not publicly disclosed.
    - >-
      Consumer retention cohorts and product-level repeat metrics remain too thin for a confident public-market
      durability assessment.
    - >-
      Debt terms, covenant headroom, secondary-sale history, and full capitalisation-table detail are not publicly
      visible.
    - >-
      Default, complaint, fraud, and redress metrics for car-finance and debt-consolidation workflows are not publicly
      underwritten.
