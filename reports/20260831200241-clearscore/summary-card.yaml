summary:
  headline: >-
    ClearScore is a scaled and profitable UK consumer-fintech platform, but the rumored 2026 IPO range looks stretched
    versus public comparables; track pending fuller disclosure or lower entry pricing.
  overallScore: 6.8
  recommendation: track
