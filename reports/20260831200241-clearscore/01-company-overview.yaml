callouts:
- calloutType: strength
  title: Profitable scale before any IPO is the core strategic asset
  body: 'The strongest evidence in the overview is not the IPO rumor itself but the 2026 results package behind it: profitable FY2025 growth, 26 million users, 200+ partners, and a multi-product platform created by acquisitions and open-banking tooling. That combination gives management room to choose timing rather than raise under duress.'
  claimRefs:
  - CO007
  - CO009
  - CO010
  - CO011
  - CO018
  - CO023
- calloutType: risk
  title: Regulatory concentration risk has precedent
  body: The abandoned Experian transaction remains an important reminder that ClearScore sits in a competition-sensitive part of consumer finance. Any future strategic transaction or platform expansion that concentrates credit-data distribution could attract similar scrutiny, particularly where bureau relationships and consumer-permissioned data overlap.
  claimRefs:
  - CO020
  - CO021
  - CO022
- calloutType: insight
  title: The current story is adjacency expansion, not just credit-score growth
  body: 'Aro, Acre, D•One, DriveScore, and the agentic-credit protocol all point in the same direction: management is trying to turn a UK credit-score brand into a broader financial-marketplace and infrastructure group. That matters more for later valuation work than the legacy “free score app” label alone.'
  claimRefs:
  - CO008
  - CO029
  - CO030
  - CO031
  - CO033
  - CO034
