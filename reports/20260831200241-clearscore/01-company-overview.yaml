  - type: conflicting-data
    severity: minor
    topic: investor-list
    missingEvidence: Authoritative current confirmation of whether TA Associates or Ontario Teachers have direct equity ownership.
    whyItMatters: Public summaries and prompt background conflict on investor identity, and repeating unverified names would degrade overview accuracy.
    diligencePath: Obtain management-provided cap-table summary or recent shareholder resolution; cross-check with Companies House filings and financing announcements.
