- id: overview-scale
  title: Scale, milestones, and path to a potential IPO
  body: 'Official 2026 company disclosures show that ClearScore entered a meaningfully larger scale phase during 2025. Group revenue rose 37% to £144.7 million and adjusted EBITDA rose 101% to £17.1 million, while the company said total users surpassed 25 million globally, product sales exceeded 2.2 million, and partner count topped 200. The 2026 operating narrative is expansionary rather than defensive: Aro Finance brought embedded finance and secured-loan broking in January 2025; Acre moved the group into mortgage technology in January 2026; Cape Town became a second major tech hub in April 2026; and the group launched both a ChatGPT education app and an open agentic-credit protocol. Strategic optionality followed. In 2018 Experian agreed to buy ClearScore for £275 million, but the CMA referred the deal and the transaction was cancelled in February 2019 after competition concerns. In contrast, current 2026 reporting frames JPMorgan''s mandate as preparation for medium-term options, not
    a done deal: Basini publicly confirmed the appointment, said the business had strong growth and profitability, and repeatedly described London as the natural home for any eventual listing. All accessed 2026 IPO sources present valuation expectations around £1.5-2.5 billion with no fixed timetable, so private status remains the verified current state. The sequence also explains why later chapters should analyse ClearScore as a scaled marketplace-and-software group rather than as a single-product comparison app: management is broadening both distribution channels and monetisation surfaces ahead of any listing choice.'
