  name: ClearScore
chapter:
  number: 1
  title: Company Overview
  summary: ClearScore is a London-based private fintech marketplace that remains privately held but is openly preparing for strategic options including a possible IPO. Official 2026 group disclosures show a profitable, multi-product platform with 26 million users, 200+ partners, and revenue expansion accelerated by acquisitions, while the abandoned 2018-2019 Experian sale remains the clearest historical adverse governance event.
sections:
- id: overview-identity
  title: Identity, product scope, and operating footprint
  body: 'Clear Score Technology Limited is an active UK private limited company incorporated on 17 September 2014 and headquartered at Vox Studios in London. The operating brand launched in the UK in July 2015 and offers free access to consumer credit scores and reports while monetising through marketplace referrals rather than subscription fees for the core product. In the UK, the service uses Equifax data and updates user reports weekly, while official company-detail pages identify ClearScore as an FCA-regulated credit broker with ICO registration. By 2026 the broader ClearScore Group described itself as a global financial marketplace spanning the UK, South Africa, Australia, New Zealand, and Canada, with London as headquarters and operations spread across six cities. The product set is no longer only a credit-score app: group pages describe ClearScore, DriveScore, D•One, embedded-finance rails, and now mortgage software as part of a single permissioned-data platform. The geographic evidence
    also matters because it contradicts older summaries that still mention India as an active market: the freshest official 2026 pages consistently name New Zealand instead, so later chapters should treat India as historical rather than current unless newer primary evidence emerges.'
  claimRefs:
