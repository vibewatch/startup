  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, preference stack, and any liquidation preferences across existing equity holders.
    whyItMatters: IPO valuation quality and downside protection cannot be judged cleanly without ownership and preference overhang.
    diligencePath: Request current shareholder register, most recent financing documents, and board materials summarising classes and preference rights.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
