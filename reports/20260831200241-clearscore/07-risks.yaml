- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Conduct / complaints
    - FCA, ICO, or FOS escalation trend
    - Material spike, thematic review, or formal action
    - Pause investment or re-price for regulatory downside
  - - Partner concentration
    - Top partner revenue share
    - Any single lender/partner >15% without durable contract protection
    - Treat growth as concentrated and cut valuation tolerance
  - - Credit-performance opacity
    - Charge-off or redress metrics in debt-consolidation / motor-finance cohorts
    - Losses or complaint rates materially above plan
    - Tighten thesis to distribution-only value or avoid
  - - Operational trust
    - Severe outage / data incident
    - Repeated customer-affecting incidents or weak postmortem controls
    - Escalate diligence on resilience and security before proceeding
  - - Execution sprawl
    - Too many strategic programs without accountable metrics
    - No clear owner, KPI, or payback path for major adjacencies
    - Assume margin dilution and lower confidence in IPO readiness
  notes: Kill criteria convert soft concerns into measurable decision rules.
