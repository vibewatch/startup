chapter:
  number: 7
  title: Risks
  summary: ClearScore’s top risks are not generic startup execution issues; they are scaled-fintech control risks flowing from regulation, partner dependence, and underwriting opacity. Public evidence supports a constructive view on product maturity and profitability, but it also shows that future value can be impaired quickly if conduct, competition, privacy, or partner-concentration issues surface.
sections:
- id: regulatory-conduct
  title: Regulatory and legal risk dominates the downside map
  body: ClearScore sits close to regulated consumer-credit and open-banking activity without being a bank itself, which creates a risk profile built around perimeter, consent, complaints, and distribution controls rather than balance-sheet solvency. Public legal materials make that visible. ClearScore discloses FCA and ICO registrations; its Open Banking terms confirm Account Information Service Provider status and 90-day consent renewal; its complaints materials point dissatisfied users toward the Financial Ombudsman Service; and its privacy policy explicitly acknowledges that transaction data can expose highly sensitive personal patterns. These are legitimate mitigants because they show the company is not hiding the regulated perimeter. They are also reminders that consumer harm, consent failure, or partner mis-selling can escalate externally through well-defined UK redress channels. The competition record matters too. The CMA’s Experian/ClearScore provisional findings did not merely note
    procedural interest; they argued that combining two leading credit-checking firms could reduce innovation and worsen consumer outcomes, and the deal was later abandoned. That history does not block ClearScore from all future exits, but it does mean any sale to a major bureau or adjacent incumbent should be underwritten with competition risk in mind. Add the FCA’s live Consumer Duty framework plus ongoing 2026 car-finance complaint activity, and the legal-regulatory stack becomes the single most important diligence lane.
  claimRefs:
