  topStrengths:
    - 规模化盈利：FY2025 收入 £144.7M，调整后 EBITDA £17.1M，最迫切的融资压力已经解除。
    - 用户与伙伴网络够大：五个市场 26M 用户、200+ 家合作伙伴，带来真实分发杠杆。
    - 产品宽度已从免费信用评分延伸到开放银行、嵌入式金融、汽车金融、债务整合和房贷相邻场景。
    - 仍保有私有市场选择权：JPMorgan 担任顾问，说明战略出售和 IPO 路径都可信，不像被迫流动性事件。
  topRisks:
    - 传闻 IPO 定价约 £1.5B-£2.5B，隐含收入倍数明显高于上市征信局和市场平台可比公司。
    - 公开披露对合作伙伴集中度、留存队列、抽成率和分垂直领域信用表现指标仍偏薄。
    - 行为合规、隐私和伙伴治理风险会沿消费信贷平台快速传导，监管边界涉及 FCA / ICO / FOS。
    - 战略退出选择并非无限：Experian 收购失败说明，英国竞争审查可能产生实质影响。
  unresolvedGaps:
    - 头部合作伙伴收入集中度、续约条款和抽成率历史未公开披露。
    - 消费者留存队列和产品级复用指标仍过于稀薄，难以有把握评估其公开市场耐久性。
    - 债务条款、契约余量、老股交易历史和完整股权结构表细节尚未公开可见。
    - 汽车金融和债务整合流程的违约、投诉、欺诈和赔付指标，公开资料还无法承保式验证。
