companyProfile:
  summary: "ClearScore is a London-based consumer fintech that combines a free credit score-and-report app with a financial marketplace, open-banking data products, and newer embedded-finance and workflow tools. The company launched its UK service in 2015 on top of a legal entity incorporated in 2014, operates across the UK, South Africa, Australia, New Zealand, and Canada, and publicly discloses FCA and ICO registrations. By FY2025, ClearScore reported £144.7 million in revenue and £17.1 million in adjusted EBITDA, positioning it as a profitable growth-stage platform rather than a cash-burning startup. As of August 2026 it remains private, with JPMorgan reportedly advising on strategic options including a possible IPO."
  foundedDate: "2014-09-17"
