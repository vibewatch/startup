  foundingLocation: "London, United Kingdom"
  headquarters: "London, United Kingdom"
  productSummary: "ClearScore offers a free credit score and report service, matched credit and insurance marketplace offers, open-banking-powered affordability tools, embedded-finance distribution, debt-consolidation workflows, car-finance journeys, mortgage software exposure through Acre, and adjacent products including DriveScore and D•One."
  customerFocus: "Mass-market consumers seeking credit visibility and matched financial products, plus lender and partner channels using ClearScore distribution and data workflows."
  businessModel: "Commission and referral income from matched financial-product conversions, partner distribution relationships, and adjacent workflow / infrastructure products."
  stage: "growth / pre-IPO"
  fundingStatus: "2021 Invus investment at a $700M valuation, subsequent 2025 HSBC Innovation Banking debt financing, and 2026 JPMorgan strategic-options mandate; still private."
