            body: >-
              概览中最强的证据不是 IPO 传闻本身，而是背后的 2026 业绩包：FY2025 盈利增长、26 million 用户、200+
              合作伙伴，以及由收购和开放银行工具拼出的多产品平台。这让管理层有空间选择时点，而不是在压力下融资。
