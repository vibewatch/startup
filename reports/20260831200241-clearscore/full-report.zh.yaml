      - number: '6.2'
        title: 具名客户证明与留存代理指标
        blocks:
          - type: paragraph
            body: >-
              具名客户证明在合作伙伴侧最强。ClearScore Everywhere 已与 Asda、Co-op、Admiral Group 和 Vanquis 等具名品牌上线，说明嵌入式分发论点已经超出概念。Zuto
              是更清晰的证明点，因为合作被描述为独家，服务 ClearScore 的 16 million 英国用户，并已在四年内促成 £250 million 贷款。Monzo 提供了产品驱动的重复信任证明：在 Monzo
              app 内，客户可以使用 ClearScore 的 Clearer 技术整合借款，让现有贷款机构自动获偿。Abound 提供了最好的多年证明。Open Banking Expo 称，它是 Clearer 在
              2024 年的启动合作伙伴，并在把这项技术嵌入更广客户旅程之前，已在 ClearScore 撮合平台上提供 Clearer 驱动的整合贷款两年；后来的 D•One 报道则称，Abound 可更早触达一个 3.5
              million 连接用户池。消费者证明也存在，但更软。Trustpilot 评论对清晰度和支持高度正面，Google Play
              列表强调提醒、Protect、报告和个性化报价。这些是好的黏性信号，但仍只是留存代理，而不是直接的流失率或队列披露。
