      - number: '7.3'
        title: 只有设定明确止损标准，执行风险才可控
        blocks:
          - type: paragraph
            body: >-
              最后一层风险是执行宽度。ClearScore 已不只是一个英国比价入口；它现在覆盖五个运营市场，并叠加嵌入式金融、房贷工作流、车联网、开放银行基础设施和早期 agentic-credit
              协议等相邻业务。如果管理层守住治理，这种宽度可以复利；但它也增加了稀缺高管注意力被摊薄到太多控制制度和合作伙伴组合上的概率。创始人 CEO Justin Basini
              仍是外部战略故事的中心，包括伦敦上市抱负，这可以接受，但也把部分叙事风险集中在一位领导者身上。重要的是，最大的风险没有一个不可知。每个都可以转成可监测的尽调问题：确认是否有任何合作伙伴贡献两位数收入占比；测试
              FCA/ICO/FOS 投诉指标是否稳定；检查债务整合和汽车金融队列中的违约与核销行为；审阅信息安全证明；理解任何有担保债务附带的 约束条款。如果这些项目结果干净，ClearScore
              的盈利能力和平台深度可以支撑更建设性的承保立场。若不是，下行可能很快从行为监管或合作伙伴问题传导到增长质量、估值和退出可选性。因此，本章结论很简单：只有把风险监测当成一等工作流，而不是投后清理项目，ClearScore
              才值得投资。
