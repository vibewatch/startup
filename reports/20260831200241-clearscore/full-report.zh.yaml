  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 业务质量够得上 IPO，但问题在价格支撑
        blocks:
          - type: paragraph
            body: >-
              最重要的估值结论是：从经营实质看，ClearScore 基本已经不再只是“有意思的私营金融科技公司”，而是进入“可信的公开市场候选公司”这一档。FY2025 收入 £144.7 million、调整后
              EBITDA £17.1 million、年度产品销售 2.2 million、25m+ 全球用户、200+
              合作伙伴，合在一起说明它是真正有规模的市场平台，不是只有浅层漏斗的应用。战略故事也早已不止免费信用分：管理层已经搭出嵌入式金融分发、开放银行数据增强、汽车金融流程、抵押贷款邻近业务，以及可见的数据 /
              决策基础设施层。这足以解释为什么 JPMorgan 会为战略选项提供建议，也说明伦敦 IPO 讨论不再是异想天开。问题在估值纪律。2026 年已有报道给出可能的 £1.5-2.5 billion IPO，中心值约
              £2 billion，但这些仍是话术数字，不是已完成交易。在这个区间，市场需要同时为经营实力和尚未进入公开记录的未来证明买单。缺失的这座桥很关键。投资者可以认可 ClearScore
              是一家好公司，同时认为当前传闻价格对证据基础要价太高。因此，本章把业务质量和入场吸引力分开，把推荐结论明确处理为价格敏感。
