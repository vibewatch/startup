        - from: N4
          to: N7
          label: 可能削弱单位经济性
        - from: N5
          to: N6
          label: 互动减少 / 授权减少
        - from: N6
          to: N7
          label: 可货币化产品流量下降
        - from: N7
          to: N8
          label: 利润质量下降
        - from: N1
          to: N8
          label: 监管阴影
    claimRefs:
