      - number: '8.2'
        title: 公开可比公司提示传闻区间需要谨慎
        blocks:
          - type: paragraph
            body: >-
              即便承认可比对象并不完美，方向仍然清楚。按 2026 年 8 月市值和收入页面计算，Experian、Equifax、TransUnion 等成熟上市信用数据和决策公司，目前收入倍数大约在 3x 中段到 4x
              低段。MONY Group 作为更贴近的英国消费金融市场平台可比标的，倍数更接近 2x 低段。这些公司都不是 ClearScore 的完美镜像：征信局掌握更深的基础设施，MONY
              覆盖更广的储蓄和切换场景，披露也更充分。但它们仍能提供公开市场定价纪律的锚点。对照这些参照，ClearScore 传闻 IPO 框架隐含 FY2025 收入约 10.4x 到 17.3x，中点约
              13.8x。这不是小幅溢价，而是完全不同的定价区间。增长、更早期的变现空间和平台宽度可以支撑一定溢价；但公开证据在留存、合作伙伴集中度、抽佣率和信用损失表现上仍然很薄，这种溢价就难以辩护。也因此，除非管理层拿出比当前公开信息强得多的
              2026 收入进展和更干净的队列质量证据，情景表的估值会明显低于传闻上沿。估值结论不是“ClearScore 在所有情形下都高估”，而是“现有公开数据还不足以让投资者有信心支付传闻倍数”。
