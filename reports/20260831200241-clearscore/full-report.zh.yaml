      - number: '1.3'
        title: 规模、里程碑与潜在 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              官方 2026 公司披露显示，ClearScore 在 2025 年进入规模显著更大的阶段。集团收入增长 37% 至 £144.7 million，调整后 EBITDA 增长 101% 至 £17.1
              million；公司称全球用户超过 25 million，产品销售超过 2.2 million，合作伙伴超过 200。2026 年运营叙事偏扩张，而非防守：Aro Finance 在 January 2025
              带来嵌入式金融和有担保贷款经纪；Acre 在 January 2026 把集团推进房贷技术；Cape Town 在 April 2026 成为第二个主要技术中心；集团还推出了一个 ChatGPT 教育 app
              和开放式 agentic-credit 协议。战略可选项也随之出现。2018 年 Experian 同意以 £275 million 收购 ClearScore，但 CMA 转介审查，交易在 February
              2019 因竞争担忧取消。相比之下，当前 2026 报道把 JPMorgan 任命描述为中期选项的准备，而不是已敲定交易：Basini
              公开确认该任命，称公司增长和盈利能力强，并多次把伦敦称为任何最终上市的自然归宿。所有已访问的 2026 IPO 来源都给出约 £1.5-2.5 billion
              的估值预期，但没有固定时间表，因此私营状态仍是已验证的当前事实。这一序列也解释了为什么后续章节应把 ClearScore 作为规模化撮合平台与软件集团来分析，而不是单一产品的比价
              app：在任何上市选择之前，管理层都在拓宽分发渠道和变现表面。
