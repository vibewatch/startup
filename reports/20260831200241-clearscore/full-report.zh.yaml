            body: >-
              这个市场最耐久的权力仍在征信局手里。ClearScore 依赖 Equifax 提供英国核心信用档案可见性，而 Experian 撤回访问后 MSE 转向
              TransUnion，说明下游消费者品牌可能很快失去数据路径或议价杠杆。
            calloutType: risk
