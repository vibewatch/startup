      - number: '3.2'
        title: 能力、定价与分发对比
        blocks:
          - type: paragraph
            body: >-
              表面上，许多产品看起来相似：免费查分、教育提示、贷款机构报价和软查询资格信息，在 ClearScore、Credit Karma、TotallyMoney、Experian 和 MoneySuperMarket
              中反复出现。更深的差异藏在 UI 之下。ClearScore 锚定免费、由 Equifax 支撑的每周报告和佣金资助的撮合平台；Credit Karma 锚定 TransUnion
              数据和免费监测，并接入贷款、信用卡和房贷漏斗；Experian 与 Equifax 把征信局所有权和免费增值加购组合在一起；Checkmyfile 则在试用后靠跨征信局可见性收费。MoneySuperMarket
              和 MSE Credit Club 较少争夺端到端信用关系的所有权，更多靠消费者教育、资格框定和产品发现竞争。这意味着，ClearScore
              的产品优势在于合作伙伴路由的宽度和英国已安装受众规模，而不是独有的信用分展示能力。公开竞争证据反复表明，同一批消费者可以、也确实会使用多个服务，因为每个征信局视角不同，而且查询自己的分数通常免费且不会造成损害。实践中，买方眼前有许多近似替代品，因此分发效率和信任一致性比表层功能宣称更重要。当消费者获客成本上升或征信局关系变化时尤其如此。
