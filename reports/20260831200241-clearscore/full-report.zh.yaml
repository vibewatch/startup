      - number: '4.2'
        title: 单位经济、成本结构与公开证据看不到的部分
        blocks:
          - type: paragraph
            body: >-
              公开证据只能支撑一个部分性的单位经济视角。积极一面是，这个模式看起来比贷款机构结构更轻，因为 ClearScore
              路由需求和可负担性数据，通常不在自身资产负债表上持有消费者信用风险。这有助于解释公司为什么能在这一规模报告盈利，同时继续投资产品、AI、开放银行、嵌入式金融和国际市场。FY2024
              英国结果也给出一个有用的低层级信号：收入升至 £89.7 million，经营利润增至三倍、达到 £18.8 million；集团报告超过 1.5 million 产品销售、超过 40
              个独家报价，并在英国核心业务中展现显著经营杠杆。公开公司叙事还指向反复出现的成本桶：技术与数据基础设施、产品和工程扩张、合作伙伴集成、监管 / 合规工作，以及 Aro 和 Acre
              等收购带来的整合支出。但真正的承保盲点仍很大。本文审阅的公开来源没有披露毛利率、按产品线拆分的贡献利润率、CAC、回本周期、重复转化率、贷款机构集中度、实际佣金 抽佣率，也没有披露消费者撮合平台收入与较新的
              B2B / 软件相邻业务之间的拆分。管理层声称队列行为可预测、收入可复利，这令人鼓舞，但外部投资者无法仅凭当前公开材料严谨验证这一说法。
