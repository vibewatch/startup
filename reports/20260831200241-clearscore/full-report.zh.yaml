  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: ClearScore 在规模和货币化上得分高，但估值支撑和证据质量较弱，难以支撑公开市场式买入判断。
    approximationNotes: 分数是综合章节证据后的分析师判断，不是管理层指标。
    data:
      items:
        - label: 规模 / 覆盖
          value: 8/10
          context: 25m+ 用户覆盖五个市场，另有 200+ 合作伙伴
        - label: 货币化证明
          value: 7/10
          context: 已盈利，年度产品销量 2.2m
        - label: 护城河 / 可选性
          value: 7/10
          context: 嵌入式金融、Open Banking 和数据栈宽度
        - label: 风险负担
          value: 4/10
          context: 行为合规、集中度和信贷损失不透明仍是实质问题
        - label: 估值支撑
          value: 3/10
          context: 传闻 IPO 区间相对上市同业偏贵
        - label: 证据质量
          value: 5/10
          context: 顶层证据不错，队列 / 单位经济性细节薄
    claimRefs:
      - CV001
      - CV002
      - CV015
      - CV018
      - CV023
      - CV029
