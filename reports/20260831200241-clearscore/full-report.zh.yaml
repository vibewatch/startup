      - number: '2.3'
        title: 采用驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              2026 年的采用争论，信任、数据同意和监管与需求同样重要。白皮书和 FCA 研究说明都认为，开放银行、AI
              和更丰富的可负担性数据可以扩大服务不足或准优质借款人的信贷可得性；引用的贷款机构案例则显示，一家主要贷款机构在欠款未恶化的情况下，撮合平台 放款量提升 14%、批准率提高
              25%。利率下行和更偏增长的监管口径也有利。但同一组证据也明确指出摩擦仍在：老旧系统、标准不一致、消费者认知低、同意率在约 30% 附近进入平台期、BNPL
              监管、汽车金融赔付不确定性，以及监管机构或赔付机构可能重新评判此前合规做法的持续担忧。这些约束会影响估值，因为它们限制 ClearScore
              这类撮合平台把用户触达转成已放款产品量或软件渗透的速度。买方、用户、付款方在实际中也拖慢采用：消费者必须信任数据共享，贷款机构必须接受新的承保方法，合作伙伴必须集成 API 或嵌入式金融旅程。ClearScore
              在南非的牵引力、通过 Aro 进入零售相邻场景、通过 Acre
              进入房贷相邻场景，都说明模式可以外溢；但外溢速度取决于监管清晰度和集成经济性，而不只是品牌认知。因此，后续财务和估值工作应把监管清晰度和贷款机构集成速度视作一阶情景变量，而不是背景色。
