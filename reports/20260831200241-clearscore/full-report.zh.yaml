        title: 图表与要点
        blocks:
          - type: callout
            title: 真正的市场是服务不足信贷可得性，不是分数小组件
            body: 2026 年公开证据持续指向未满足借款需求和更好决策，二者才是价值驱动。免费信用分只是获客层；当数据、承保和分发汇合时，可变现价值才出现。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM036
          - type: callout
            title: 同意与监管是两个闸门变量
            body: 开放银行和 AI 可以改善转化，但同一批来源也警告，同意率已经平台化，数据标准仍不均衡，赔付或规则变化会压低贷款机构胃口。因此，时点风险是采用和估值的核心。
            calloutType: risk
