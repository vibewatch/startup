  - id: TV005
    title: 投资逻辑破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 合作伙伴集中度显现为高
        - 任一合作伙伴在收入中占据显著主导，且没有长期合同保护
        - 可扩展市场平台开始显得集中且脆弱
        - 下调估值容忍度，或转为回避
      - - 投诉 / 行为合规指标恶化
        - FOS/FCA/垂直业务投诉指标出现实质负面趋势
        - 损害信任和公开市场胃口
        - 暂停或下调投资判断
      - - 嵌入式信贷经济性不达预期
        - 汽车金融 / 整合流程中的损失、欺诈或抽佣率数据偏弱
        - 相邻业务上行空间变成盈利质量担忧
        - 转向悲观情景
      - - IPO 价格仍接近传闻上限，且披露没有改善
        - 没有关于留存、队列或资本结构的 KPI 桥接
        - 相较上市可比公司，溢价无法辩护
        - 维持观察或回避
      - - 竞争 / 退出可选路径收窄
        - 买方范围受审查限制，战略替代方案变少
        - 削弱估值的下行支撑
        - 要求更宽的安全边际
    notes: 这些可衡量事件最可能实质性改变建议。
    claimRefs:
      - CV017
      - CV026
      - CV028
      - CV029
      - CV037
