  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与变现范围
        blocks:
          - type: paragraph
            body: >-
              ClearScore 的相关市场比免费查信用分更宽，但比泛个人理财软件更窄。官方公司页面、应用商店文案和 2026 ClearScore-EY
              白皮书共同指向一个双边市场：消费者免费使用信用报告、可负担性工具和引导式教育；贷款机构、保险公司、经纪商和零售分发伙伴则为匹配需求、更好的风险筛选和软件化承保付费。因此，纳入支出的范围包括卡、贷款、汽车金融、房贷和保险的线索生成与推荐经济，也包括
              D•One、嵌入式金融分发、房贷技术等相邻软件或数据服务层。不纳入的支出包括纯记账
              app、没有信贷分发层的泛预算内容，以及缺乏可规模化数字匹配的线下顾问服务。现状替代品仍包括直接向贷款机构比价、付费征信局产品，以及来自 Experian、Equifax 合作伙伴、TransUnion
              合作伙伴和多征信局订阅提供商的其他免费信用分服务。这组替代品很重要，因为品类竞争不只看谁能给出原始分数，更看每家能在分数界面上叠加多少可行动语境、资格引导和分发触达。估值最终要直接验证的，就是这个运营市场。
