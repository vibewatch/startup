      - number: '2.2'
        title: 规模测算口径与需求强度
        blocks:
          - type: paragraph
            body: >-
              公开市场规模最清晰的锚点不是模糊的 fintech TAM，而是未满足的信贷需求。ClearScore-EY 论文称，16.3 million 英国成年人仍有未满足的信贷需求，总未满足需求约 £7
              billion，其中约 £2 billion 可由更好的决策覆盖。它还把改善信贷可得性与 £6.4 billion 的年度 GDP 机会相连，并认为约 30% 的英国成年人仍未得到充分服务。这些数字比 app
              下载数更能框定机会。宏观数据进一步说明，消费者需求真实存在：Bank of England 报告 2026 年 6 月净消费者信贷借款 £1.8 billion、消费者信贷年增长 9.1%、6 月房贷批准
              58,200 笔，以及 2026 Q1 住宅房贷余额 £1.746 trillion。在这样的背景下，ClearScore 官方材料提到全国 15 million 英国开放银行用户，以及超过 2 million
              位连接到 ClearScore、运行在 D•One
              通道上的开放银行用户，说明公司所在的位置已经同时具备消费者需求、数据可得性和贷款机构转化激励。因此，市场规模可观，但可变现核心最好被描述为服务不足借款人加可数字化匹配的信贷需求，而不是每个有智能手机的英国成年人。
