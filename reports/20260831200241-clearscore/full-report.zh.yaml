        - id: N4
          label: 信贷表现不透明
        - id: N5
          label: 客户信任
        - id: N6
          label: 转化质量
        - id: N7
          label: 收入质量
        - id: N8
          label: 估值 / 退出可选性
      edges:
        - from: N1
          to: N5
          label: 损害信心
        - from: N2
          to: N5
          label: 降低授权信任
        - from: N3
          to: N7
