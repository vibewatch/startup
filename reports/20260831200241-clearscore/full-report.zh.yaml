companyProfile:
  summary: >-
    ClearScore 是一家总部位于伦敦的消费金融科技公司，把免费的信用分和信用报告 app、金融产品撮合平台、开放银行数据产品，以及较新的嵌入式金融和工作流工具组合在一起。公司以 2014 年注册的法律实体为基础，于 2015
    年在英国推出服务，目前覆盖英国、南非、澳大利亚、新西兰和加拿大，并公开披露 FCA 与 ICO 注册。到 FY2025，ClearScore 披露收入 £144.7 million、调整后 EBITDA £17.1
    million，定位已从烧钱初创转为盈利的成长阶段平台。截至 August 2026，公司仍为私营，JPMorgan 据报正就包括潜在 IPO 在内的战略选项提供顾问服务。
