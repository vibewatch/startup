      - number: '3.3'
        title: 转换成本、供应商权力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              因此，竞争耐久性是混合的。ClearScore 确实拥有分发资产：消费者 app 在英国接近 16 million 用户，集团全球覆盖 26 million 用户，合作伙伴超过
              200，并相邻扩张到房贷软件和嵌入式金融。这些资产应会影响合作伙伴决定把需求导向哪里。但反向证据同样重要。Credit Karma、Equifax、TotallyMoney 和 Checkmyfile 的
              Trustpilot 页面上的用户投诉显示，陈旧数据、账单摩擦或支持失败都可能让服务信任流失；ClearScore 自己的投诉指南明确称，英国报告争议最终关乎 Equifax
              持有的数据，凸显供应商依赖。Which? 关于 MSE Credit Club 失去 Experian
              访问权的报道也是另一个警告：征信局关系可以迅速改写下游分发经济性，而征信局层仍掌握消费者信贷通道的结构性权力。因此，ClearScore
              的护城河更适合被描述为规模化分发加合作伙伴集成，而不是专有锁定。由于多平台使用成本低，且多个品类功能可复制，除非尽调发现更强排他性、更高 take
              抽佣率或公开来源未提供的合作伙伴偏好证据，承保应假设竞争压力持续存在。除非管理层能证明更好的重复转化或贷款机构偏好，否则仅靠公开证据能支持竞争优势，但不能支持类似垄断的优势。
