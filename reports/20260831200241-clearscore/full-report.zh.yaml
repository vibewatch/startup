  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 监管和合作伙伴风险的残余严重度最高，因为它们会直接传导到转化、收入质量和退出可选性。
    approximationNotes: 标签是基于证据的分析师判断，综合了引用来源；不是公司风险评级。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 残余暴露
      rows:
        - label: 竞争 / 并购审查
          values:
            - label: 中
              tone: warning
              detail: 已有 CMA 历史先例
            - label: 极高
              tone: negative
              detail: 可能限制退出路径
            - label: 低
              tone: warning
              detail: 未见公开补救方案规划
            - label: 高
              tone: negative
              detail: 战略出售可选性可能收窄
        - label: Consumer Duty / 行为合规
          values:
            - label: 中
              tone: warning
              detail: 合作伙伴旅程增加复杂度
            - label: 高
              tone: negative
              detail: 消费者损害问题会冲击品牌和监管关系
            - label: 中
              tone: warning
              detail: 授权和投诉流程可见
            - label: 高
              tone: negative
              detail: 需要持续 MI 和合作伙伴控制
        - label: 合作伙伴集中度
          values:
            - label: 中
              tone: warning
              detail: 200+ 合作伙伴，但未披露结构
            - label: 极高
              tone: negative
              detail: 头部合作伙伴流失会迅速打击收入
            - label: 低
              tone: warning
              detail: 公开缓释措施薄
            - label: 高
              tone: negative
              detail: 未知经济性主导残余风险
        - label: 安全 / 数据质量事件
          values:
            - label: 中低
              tone: warning
              detail: 未见公开事件激增
            - label: 高
              tone: negative
              detail: 庞大用户基数扩大影响半径
            - label: 中
              tone: warning
              detail: 运营能力表述强，但第三方保证有限
            - label: 中高
              tone: warning
              detail: 认证缺口仍在
        - label: 邻近业务执行 / ACBP
          values:
            - label: 中
              tone: warning
              detail: 业务宽度在增加
            - label: 中
              tone: warning
              detail: 目前主要是期权价值
            - label: 中低
              tone: warning
              detail: 只有早期材料
            - label: 中
              tone: warning
              detail: 可能牵走核心现金引擎的精力
    claimRefs:
      - CR007
      - CR011
      - CR023
      - CR024
      - CR033
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: ClearScore 大多数下行风险不是直接走向资不抵债，而是经由信任、合作伙伴经济性和转化质量传导。
    approximationNotes: 边只展示主导路径。
    data:
      nodes:
        - id: N1
          label: Consumer Duty / 投诉
        - id: N2
