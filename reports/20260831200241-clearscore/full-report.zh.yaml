      - number: '5.3'
        title: 成熟度、信任控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              成熟度不均，但这种不均本身有信息量。核心撮合平台、开放银行和车联网工作流看起来成熟：集团声称 99.99% 可用性、每月 4,000 次生产发布、2.6 million 个开放银行连接、16%
              放款由开放银行数据支撑，以及一个已在四年内促成 £250 million 贷款的独家 Zuto 合作。Protect 和 Protect Plus
              也围绕暗网监测、信用提醒、保险和欺诈支持展示了相当成熟的控制组合。相比之下，ACBP 明确标注为早期开发，v0.4
              材料用于技术评审和原型验证，而不是生产稳定使用。这种透明度是正面的，但它意味着投资者应把该协议视作期权价值，而不是当下收入证明。信任与合规控制可见，但不完整。ClearScore 披露 FCA 和 ICO
              标识符、带有 ICO 升级权利的 Open Banking 隐私政策，以及可通向 Financial Ombudsman Service
              的投诉路径。不过，已审阅的公开来源没有证实正式安全认证、经审计的事故历史或合作伙伴 SLA 指标。产品尽调因此应聚焦集成可靠性、同意摩擦、数据权利连续性，以及最新 AI
              和嵌入式金融层能否在不削弱控制质量的情况下规模化。投资者也应把已经证明的发布纪律，与仍未验证的外部保证和最新渠道采用区分开。
