  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 强规模和盈利能力把建议推向对价格敏感的观察判断；在传闻条款下，披露缺口仍太大，无法给出买入建议。
    approximationNotes: 展示主导决策链，而不是每条尽调分支。
    data:
      nodes:
        - id: L1
          label: 25m+ 用户、200+ 合作伙伴
          detail: 规模化分发证据清楚
        - id: L2
          label: FY2025 盈利 + 2.2m 件产品销量
          detail: 货币化真实存在，不只是流量
        - id: L3
          label: 约 £1.5-2.5bn 的 IPO 传闻
          detail: 可能为 2026 年伦敦上市做准备
        - id: L4
          label: 隐含收入倍数 10.4x-17.3x
          detail: 显著高于当前上市可比公司区间
        - id: L5
          label: 披露缺口
          detail: 留存、集中度、损失率、股权结构表
        - id: L6
          label: 观察 / 偏高
          detail: 保持接触，但暂不支撑买入判断
      edges:
        - from: L1
          to: L2
          label: 支撑质量
        - from: L2
          to: L3
          label: 让 IPO 具备可信度
        - from: L3
          to: L4
          label: 形成估值检验
        - from: L2
          to: L5
          label: 需要更好的证据桥
        - from: L4
          to: L6
          label: 目前太贵
        - from: L5
          to: L6
          label: 信心被压住
