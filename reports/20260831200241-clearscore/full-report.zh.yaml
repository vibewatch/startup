  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在管理层补齐关键尽调缺口前，情景支撑明显低于传闻上沿。
    approximationNotes: 这些数值是按企业价值口径给出的分析师区间，以十亿英镑计，基于情景假设而非市场报价。
