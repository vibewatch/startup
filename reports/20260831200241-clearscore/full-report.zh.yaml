      - number: '4.3'
        title: 资本充足性、融资依赖与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              资本充足性看起来好于最初的初创标签，但并不完全透明。公司仍是私营，不过 2025-2026 公开材料持续把它描述为盈利且具战略可选性，而不是受资本约束。最好的支持信号是 FY2025 EBITDA
              披露、此前英国经营利润增至三倍，以及 HSBC Innovation Banking 在 February 2025 宣布的 £30 million 授信。Companies House 备案历史和抵押 /
              担保登记页面补充了重要细节：公司一直在积极使用有担保融资结构，涉及 Silicon Valley Bank 或 HSBC 相关实体的多笔历史押记，10 July 2026 记录了广泛清偿 / 解除登记，30
              June 2026 又有新登记。这本身并不意味着困境——再融资、抵押物重组或并购相关授信更新都可能解释——但它意味着约束条款组合、担保覆盖和贷款人权利都是重要的未决尽调项。市场条件也并非毫无摩擦。Bank of
              England 数据显示，当前消费者信贷需求仍健康，但 Grant Thornton 的 2026 市场更新提示汽车金融赔付不确定性和 BNPL
              规则变化，可能影响贷款机构及信贷分发周边的变现环境。总体而言，公开证据支持收入质量为正、资本强度可控的判断，但还不足以形成完整可承保文件：精确现金、现金消耗、资金续航、债务条款和逐收入流利润率仍不可得。
