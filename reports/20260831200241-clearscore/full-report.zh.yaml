  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险主导下行情境
        blocks:
          - type: paragraph
            body: >-
              ClearScore 靠近受监管的消费者信贷和开放银行活动，但自身不是银行，因此风险画像围绕边界、同意、投诉和分发控制展开，而不是资产负债表偿付能力。公开法律材料让这一点很清楚。ClearScore 披露 FCA
              和 ICO 注册；其 Open Banking 条款确认账户信息服务提供商身份和 90-day 同意续期；投诉材料把不满意用户指向 Financial Ombudsman
              Service；隐私政策还明确承认，交易数据可能暴露高度敏感的个人模式。这些都是合法缓释因素，因为它们显示公司没有隐藏监管边界。它们也提醒我们，消费者伤害、同意失败或合作伙伴误售，都可能通过定义清楚的英国赔付渠道向外部升级。竞争记录也重要。CMA
              对 Experian/ClearScore 的临时调查结果并非只注意到程序性兴趣；它认为，两家领先信用查询公司合并可能减少创新并恶化消费者结果，该交易后来被放弃。这段历史不会堵死 ClearScore
              的所有未来退出，但它意味着，任何卖给大型征信局或相邻在位者的交易，都应把竞争风险纳入承保。再加上 FCA 正在运行的 Consumer Duty 框架，以及 2026
              年仍在发生的汽车金融投诉活动，法律监管栈就成为最重要的单一尽调通道。
