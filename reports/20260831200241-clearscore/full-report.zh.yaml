chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营版图
        blocks:
          - type: paragraph
            body: >-
              Clear Score Technology Limited 是一家仍在运营的英国私人有限公司，注册于 17 September 2014，总部位于伦敦 Vox Studios。运营品牌于 July 2015
              在英国上线，消费者可免费查看信用分和信用报告，核心产品不收订阅费，而是靠 撮合推荐变现。在英国，该服务使用 Equifax 数据并每周更新用户报告；官方公司详情页把 ClearScore 标示为受 FCA
              监管的信贷经纪商，并列出 ICO 注册。到 2026 年，更广义的 ClearScore Group
              自称是覆盖英国、南非、澳大利亚、新西兰和加拿大的全球金融撮合平台，总部在伦敦，运营分布在六座城市。产品组合已不只是信用分 app：集团页面把
              ClearScore、DriveScore、D•One、嵌入式金融通道，以及现在的房贷软件都放进一个基于授权数据的平台。地理证据也重要，因为它反驳了仍把印度列为活跃市场的旧摘要：最新的 2026
              官方页面始终列出新西兰，因此后续章节应把印度视作历史市场而非当前市场，除非出现更新的一手证据。
