  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              ClearScore 服务的不止一个客户层。最显眼的前端，是使用免费 app 监测信用健康、阅读征信局支撑报告、接收提醒并浏览匹配金融产品的大众消费者。但付款方还包括购买匹配需求的贷款机构、嵌入
              ClearScore 旅程的合作伙伴品牌，以及 Zuto、Monzo、Abound 和房贷或开放银行交易对手等工作流伙伴。公开规模证据相对强。ClearScore 称英国 app 受到接近 16 million
              用户信任；投资者和集团页面则把更广用户基数放在全球约 25.2 到 26 million，包括超过 9 million 国际用户，以及 2025 年 £39 million
              国际收入。产品活动也看起来是真实的，而不是表面数字：集团披露 FY2025 年度产品销售 2.2 million；英国结果发布则引用 FY2024 超过 1.5 million 产品销售和超过 40
              个独家报价。地理也重要。Moneyweb 在 February 2026 报道南非用户 6.6 million，目标是在年底前超过 7.5 million，支持 ClearScore
              不只是英国一次性成功的判断。因此，漏斗顶端采用已有充分证据；更不透明的问题是，这些用户到底多深地转化、重复购买并长期保持互动。
