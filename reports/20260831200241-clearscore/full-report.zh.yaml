      - CV040
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 合作伙伴集中度
        - Top-10 合作伙伴收入占比、续约条款和抽佣率趋势
        - 决定盈利耐久性和公开市场信心
        - CFO / 收入运营数据室请求
      - - 留存 / 队列
        - 消费者参与队列和按产品拆分的复购指标
        - 检验用户规模是否耐久，而不只是累计注册数
        - 产品分析审查
      - - 嵌入式信贷表现
        - 汽车金融和 Clearer 流程的违约、投诉、欺诈和审批质量数据
        - 是承销相邻业务质量的关键
        - 信用风险和合规审查
      - - 资本结构
        - 债务条款、契约、优先股堆叠和老股出售历史
        - 影响真实股权价值和 IPO 准备度质量
        - 财务 + 律师尽调
      - - 监管 / 投诉管理信息（MI）
        - FCA/FOS/ICO 投诉指标和重大事件历史
        - 把战略故事接到风险调整后的公开市场估值，必须有这些数据
        - 合规 / 法务工作流
    notes: 买入判断应等到这些主题有证据支撑，而不是只有叙事。
    claimRefs:
      - CV015
      - CV016
      - CV027
