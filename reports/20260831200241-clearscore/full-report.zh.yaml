            title: 分发规模才是最重要的资产
            body: 公开证据没有显示 ClearScore 拥有独一无二的稀缺功能。它显示的是庞大的英国受众、广泛的合作伙伴网络，以及相邻的房贷 / 嵌入式金融渠道，可以把免费的消费者注意力转成可变现需求。
