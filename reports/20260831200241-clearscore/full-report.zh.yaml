  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与当前增长引擎
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开财务信号是，ClearScore 现在把自己披露为一家盈利撮合平台，而不是一个只靠私人资本续命的增长故事。官方 2026 面向投资者材料列出 FY2025 收入 £144.7 million、调整后
              EBITDA £17.1 million、年度产品销售 2.2 million、合作伙伴 200+、全球用户约 25.2-26 million。同一批材料对机制的描述罕见地具体：撮合平台
              被描述为收入发生器，匹配引擎把预先批准报价、独家贷款机构产品、授权数据和深度合作伙伴集成组合起来。更早的 ClearScore
              消费者页面仍用简单方式解释最初核心变现：用户不为分数产品付费，公司在获批用户选择合作伙伴产品时赚取佣金。但增长引擎已经不只包括信用卡和无抵押贷款。Aro 在 2025
              年加入嵌入式金融分发和有担保贷款经纪，ClearScore Everywhere 把匹配引擎外部化到合作伙伴渠道，D•One 向贷款机构销售开放银行增强的决策能力，Acre
              把集团扩展到房贷软件和经纪人工作流，DriveScore 现在试验直接保险订阅模式。这一组合说明，即使公开账目仍远未披露逐收入流组合或贡献利润率，收入也正在按渠道和使用场景多元化。
