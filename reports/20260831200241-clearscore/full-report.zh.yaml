      - number: '7.2'
        title: 运营风险本质上是规模化后的依赖风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，ClearScore 比随口说的“免费信用分 app”成熟得多。公司称其服务约 26 million 用户，合作伙伴超过 200，每天处理约 75 million 个事件，每月处理数百 TB 数据，并以
              99.99% 可用性每月发布约 4,000 次生产版本。这些是有意义的运营主张，也支持平台具备真实工程深度的判断。但它们也让外部依赖更重要，而不是更不重要。AWS、Kafka、Databricks 和
              Confluent 不是可有可无的后台工具；它们是核心机器的一部分。ClearScore Everywhere 依赖合作伙伴实施质量。D•One 依赖银行连接、贷款机构集成和用户同意连续性。Zuto
              增加了一个增长快但行为监管敏感的汽车金融层；Clearer 与 Monzo 和 Abound 的集成则把产品更深推入执行，而不只是简单线索推荐。财务风险同样是间接的。FY2025
              盈利缓解了现金消耗焦虑，但公开来源仍没有展示合作伙伴集中度、抽佣率、续约条款、信用损失或约束条款余量。这意味着，最高严重度的运营风险，与其说是“app
              能不能保持在线”，不如说是外部交易对手、数据权利或垂直领域特定行为问题，会不会比标题增长暗示得更快地打断收入质量。
