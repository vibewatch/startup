  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              产品表面现在覆盖数个相互连接的工作流。面向消费者的核心仍是免费信用分与信用报告
              app：用户查看由征信局支撑的信用视角，理解自身财务位置，接收提醒，并浏览匹配的信用卡、贷款、汽车金融、房贷和保险报价。开放银行增加了第二条工作流：用户同意共享收入与支出数据，以改善可负担性评估和产品匹配。围绕这一核心，集团拼出了多个相邻模块：用于身份监测的
              Protect 和 Protect Plus；用于车联网驱动车险旅程的 DriveScore；用于把信用分发嵌入零售商或金融服务合作伙伴渠道的 ClearScore
              Everywhere；面向贷款机构开放银行连接的 D•One；用于房贷经纪工作流软件的 Acre；以及用于 AI agent 介导信贷旅程的 ACBP。官方工作流描述罕见地具体。ClearScore
              Everywhere 称实时报价可嵌入合作伙伴网站，带有申请后推荐和 80+ 个实时连接；ACBP 材料则定义了 User Agent、Credit Broker 和 Lender
              如何分工。这让运营模式更像一组分发和决策层，而不是单一消费者 app。关键结论是，用户入口正在增多，而 ClearScore 试图守住编排层。
