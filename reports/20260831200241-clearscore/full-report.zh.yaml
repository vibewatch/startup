      - number: '6.3'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              扩张故事可信，但集中度仍披露不足。公开来源显示出几个落地后扩张循环：免费消费者 app 使用量供给匹配报价；开放银行连接改善可负担性并拓宽批准；Clearer 可把用户从浏览推进到债务整合执行；Zuto
              延伸到汽车金融经纪；嵌入式金融合作则在消费者进入传统比价流程之前，就把 ClearScore
              放进零售商或贷款机构旅程。这就是为什么公司越来越像一个同时服务终端用户和金融合作伙伴的分发层。风险在于，同一套架构会增加对交易对手的依赖，而这些交易对手的经济性并不公开。投资者无法从当前材料知道，收入有多少集中在头部贷款机构，哪些合作伙伴渠道按固定条款续约，或汽车金融、债务整合等单个垂直是否已经变成战略必需。投诉流程披露也提醒我们，用户信任仍可能被服务或数据问题打断，并随后升级到正式赔付渠道。总体而言，客户证明足以支持增长和平台宽度，但不足以排除集中度、留存或合作伙伴依赖风险。缺失的集中度细节，是今天客户质量的核心未知数。
