      - number: '1.2'
        title: 领导层、治理与资本支持
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人主导。ClearScore Group 的 2026 关于我们页面列出 Justin Basini 为集团 CEO 兼联合创始人，并由 CFO Brian Cole、CTO Klaus
              Thorup、首席数据官 Michael Woodburn、首席商务官 Tom Markham 等高管支持。Companies House 高管记录显示，Basini、Nigel Morris、Benjamin
              Tsai、Jerome Reidy、Daniel Cobley 和新任命的 Geeta Gopalan 仍在活跃治理范围内；2021 Invus 交易则称 Nigel Morris
              继续担任董事长，Benjamin Tsai 加入董事会。资本支持来自股权和非稀释融资的组合：2021 年投资把公司估值定在 $700 million，包括 QED、Blenheim Chalcot 和 Lead
              Edge 在内的原有投资者大体维持持股，HSBC Innovation Banking 在 2025 年提供 £30 million
              债务融资。这一组合说明，公司有能力在不被迫接受公开市场时间表的情况下为扩张融资，尽管可取得的公开证据仍让当前精确股权结构不透明。关于具体董事会委员会、清算优先权，以及任何贷款人或投资者关系附带的观察员权利，公开证据仍更薄，因此在查阅完整融资文件之前，治理判断应保持保守。
