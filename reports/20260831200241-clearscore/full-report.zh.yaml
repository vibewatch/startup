  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、在位征信局与替代品
        blocks:
          - type: paragraph
            body: >-
              ClearScore 面对的不是一组干净的可比同业。最近的直接替代品，是其他把分数可见性与产品匹配组合起来的免费消费者信用入口，尤其是 Credit Karma
              UK、TotallyMoney、MoneySuperMarket Credit Score 和 MSE Credit Club。第二类是在位征信局本身，尤其是 Experian 和
              Equifax；它们既供应底层信用数据，也用免费增值账户产品、身份功能和自有撮合平台 争夺终端消费者。第三类是付费监测，这里以 Checkmyfile
              为代表，吸引的是意图更强的消费者，他们希望在申请房贷、贷款或信用卡前，把英国三大主要征信局文件放在同一处查看。市场分析章节已经说明，消费者常常需要不止一个征信局视角，因为数据、量表和贷款机构使用方式不同；这一事实让多平台使用变得理性，也意味着真正任务不是“给我看一个分数”，而是“帮我理解、改善，并把我的信用档案转成获批产品”。在这个更宽框架下，只要用户需要的是一次性查询而非持续关系，联盟营销驱动的比价页面，甚至法定报告门户，都可以成为可信替代品。这个宽度很重要，因为消费者在这些工具之间选择时，往往同时决定在哪里监测档案、在哪里学习、在哪里申请信贷。
