- id: architecture-dependencies
  title: Architecture, integration model, and dependencies
  body: 'Public sources are detailed enough to support a specific architectural view, even if they are still marketing-adjacent. Strategic-differentiator and partner-event materials describe a modular platform built on AWS, Kafka, Databricks, and Confluent, using Server-Driven UI to ship thousands of monthly production releases and personalise experiences in real time. The same pages say the group ingests around 75 million events per day and hundreds of terabytes per month, while an SDK allows new integrations or apps to go live in days rather than weeks. Those claims line up with product surfaces that are integration-heavy by design: D•One has a public developer hub and a GitHub monorepo for embedded connection journeys; ClearScore Everywhere depends on direct partner APIs, open-banking signals, and lender decisioning; Zuto powers the car-finance journey with dozens of lenders and more than 300 products; and the agentic-credit repo publishes an early technical specification, schema appendix,
    and REST/MCP bindings. The dependency picture is therefore explicit. ClearScore relies on credit-bureau data, open-banking permissions, partner APIs, cloud/data infrastructure, and regulated broker control. That gives it more defensible operating know-how than a simple comparison site, but also creates several external points of failure. It also means product quality depends as much on partner implementation discipline as on ClearScore''s internal engineering speed.'
  claimRefs:
