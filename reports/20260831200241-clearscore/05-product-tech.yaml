    severity: material
    topic: security-certifications
    missingEvidence: Independent proof of security certifications, penetration-testing program, SOC/ISO scope, and security incident history.
    whyItMatters: Trust claims are central to a regulated consumer-data platform, but the reviewed public sources do not substantiate external assurance depth.
    diligencePath: Request security overview, certification letters, penetration-test summary, uptime incident log, and third-party risk assessments.
