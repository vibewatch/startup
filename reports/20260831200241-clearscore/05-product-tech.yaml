- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Server-Driven UI
    - Enables fast, real-time front-end updates without waiting for app releases
    - Internal platform tooling and release governance
    - Bad config or weak QA could scale errors quickly
  - - Data platform
    - Processes ~75m daily events and hundreds of TB monthly
    - Cloud data stack and observability
    - High data-quality and cost-control sensitivity
  - - Partner API layer
    - Connects retailers, lenders, and comparison surfaces to real-time offers
    - External partner APIs and lender appetite
    - Partner outages or data mismatch can hurt conversion
  - - Open-banking connection layer
    - Collects permissioned account data and passes enriched data to lenders
    - User consent, bank connectivity, D•One components
    - Consent drop-off and integration failures reduce coverage
  - - Broker control layer
    - Ensures regulated disclosures, suitability, and audit trail across journeys
    - FCA perimeter, product design, compliance operations
    - Weak controls could create advice or conduct risk
  - - AI / protocol layer
    - Supports Caisey and ACBP style agent-mediated workflows
    - Early open standard, internal policy controls, agent ecosystem
    - Premature rollout could create safety, compliance, or trust failures
  notes: Architecture is assembled only from specific public technical statements; hidden internal services are not guessed.
