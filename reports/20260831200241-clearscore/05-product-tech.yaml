callouts:
- calloutType: strength
  title: The differentiator is operating infrastructure, not just UI
  body: The repeated pattern across public sources is modularity, integration speed, and permissioned data depth. ClearScore’s edge appears to come from how fast it can package, personalise, and route journeys across many partners, not from a one-off score display feature.
  claimRefs:
  - CE005
  - CE006
  - CE008
  - CE020
  - CE021
  - CE035
- calloutType: risk
  title: Every new channel also adds a new control boundary
  body: Open banking, embedded finance, telematics, and AI-agent workflows all create growth options, but they also multiply dependency, consent, reliability, and regulatory-failure points. The newest layer—agentic credit—should be treated as controlled experimentation until adoption and oversight are clearer.
  claimRefs:
  - CE013
  - CE015
  - CE024
  - CE026
  - CE036
- calloutType: insight
  title: ClearScore is converging on a credit-distribution operating system
  body: 'Viewed together, D•One, ClearScore Everywhere, Acre, Zuto, Protect, and ACBP all pull toward the same strategic end-state: ClearScore wants to be the orchestration and compliance layer that sits between users, lenders, and partner channels across many credit journeys.'
  claimRefs:
  - CE008
  - CE013
  - CE017
  - CE024
  - CE033
  - CE035
