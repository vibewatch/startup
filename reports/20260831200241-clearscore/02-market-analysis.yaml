callouts:
- calloutType: insight
  title: The real market is underserved-credit access, not score widgets
  body: Public 2026 evidence consistently points to unmet borrowing need and better decisioning as the value driver. Free score access is only the acquisition layer; monetisable value appears when data, underwriting, and distribution converge.
  claimRefs:
  - CM001
  - CM006
  - CM007
  - CM036
- calloutType: risk
  title: Consent and regulation are the two gating variables
  body: Open-banking and AI can improve conversion, but the same sources warn that consent rates have plateaued, data standards remain uneven, and redress or rule changes can chill lender appetite. That makes timing risk central to adoption and valuation.
  claimRefs:
  - CM012
  - CM017
  - CM018
  - CM020
  - CM021
  - CM037
- calloutType: strength
  title: ClearScore is positioned at multiple monetisation points in the value chain
  body: Aro and Acre show that the group is not limited to direct-to-consumer commissions. Embedded-finance distribution, mortgage software, and open-banking decisioning widen the company’s addressable profit pool if integrations scale.
  claimRefs:
  - CM003
  - CM011
  - CM033
  - CM034
  - CM035
