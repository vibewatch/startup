chapter:
  number: 2
  title: Market Analysis
  summary: ClearScore sits inside a broader UK consumer-credit access market rather than a narrow “credit score app” niche. The strongest public 2026 evidence points to a large underserved-credit opportunity, accelerating open-banking infrastructure, and meaningful regulatory friction that shapes adoption timing and marketplace valuation.
sections:
- id: market-boundary
  title: Market boundary, substitutes, and monetisation perimeter
  body: The relevant market for ClearScore is broader than free credit-score checking and narrower than generic personal-finance software. Official company pages, app-store copy, and the 2026 ClearScore-EY whitepaper together show a two-sided market in which consumers use free credit reports, affordability tools, and guided education while lenders, insurers, brokers, and retail-distribution partners pay for matched demand, improved risk selection, and software-enabled underwriting. Included spend therefore covers lead-generation and referral economics for cards, loans, car finance, mortgages, and insurance, plus adjacent software or data-service layers such as D•One, embedded-finance distribution, and mortgage technology. Excluded spend includes pure bookkeeping apps, generic budgeting content with no credit-distribution layer, and offline advisory services without scalable digital matching. Status-quo substitutes remain direct lender shopping, paid bureau products, and alternative free
    credit-score services from Experian, Equifax partners, TransUnion partners, and multi-bureau subscription providers. That substitute set matters because category competition is shaped less by raw score access alone than by how much actionable context, eligibility guidance, and distribution reach each provider can attach to the score surface. That is the operational market the valuation must ultimately underwrite directly.
