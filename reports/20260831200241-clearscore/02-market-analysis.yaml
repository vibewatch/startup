- id: market-sizing
  title: Sizing lenses and demand intensity
  body: 'Public market sizing is clearest when anchored to unmet credit need rather than to a vague fintech TAM. The ClearScore-EY paper says 16.3 million UK adults still have unmet credit needs, that total unmet demand is around £7 billion, and that roughly £2 billion could be addressed with better decisioning. It also links improved access to a £6.4 billion annual GDP opportunity and argues that about 30% of UK adults remain underserved. Those numbers frame the opportunity more usefully than app-download counts. Macro data reinforces the point that consumer demand is real: the Bank of England reported £1.8 billion of net consumer-credit borrowing in June 2026, 9.1% annual consumer-credit growth, 58,200 mortgage approvals in June, and £1.746 trillion of residential mortgage balances in 2026 Q1. Against that backdrop, official ClearScore materials cite 15 million UK open-banking users nationally and more than 2 million ClearScore-connected open-banking users on D•One-enabled rails, suggesting
    the company operates where consumer demand, data availability, and lender conversion incentives already overlap. The market is therefore substantial, but its monetisable core is best described as underserved borrowers plus digitally matchable credit demand, not as every UK adult with a smartphone.'
