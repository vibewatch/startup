tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Hyperscaler-managed AI infrastructure
    - GPU instances, networking, storage, managed training and inference services
    - General-purpose CPU cloud and application-layer SaaS
    - Large enterprise CIO / procurement / platform teams
    - Default substitute when compliance and existing agreements dominate
  - - Tier-one neocloud reserved clusters
    - Dedicated or reserved GPU fleets, InfiniBand fabrics, parallel storage, cluster ops
    - Commodity marketplace spot GPUs
    - Frontier labs, large model builders, advanced enterprises
    - Closest direct alternative on price-performance for large workloads
  - - Specialty neoclouds
    - Mid-scale dedicated deployments, bespoke geography or contract structures, power-first campuses
    - Consumer AI apps and API resale
    - Regional labs, sovereign buyers, niche enterprises
    - Lane where Fluidstack typically competes
  - - On-prem / hybrid / sovereign
    - Private clusters, colocation, behind-the-meter power, compliance-heavy deployments
    - Pure public-cloud elasticity
    - Governments, regulated industries, national champions
    - Important when trust, residency, or control outrank speed
  - - Spot / marketplace GPU supply
    - Burst research compute, short experiments, low-commitment inference
    - Long-term contracted campus capacity
    - Startups, researchers, overflow buyers
    - Status-quo or low-end substitute, not the main Fluidstack lane
  notes: Defines the market around AI compute procurement and delivery, not around every cloud or AI software dollar.
