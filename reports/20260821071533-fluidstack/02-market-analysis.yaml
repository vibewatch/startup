  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: serviceable-market-definition
    missingEvidence: A defensible public estimate for the exact serviceable market slice that matches Fluidstack’s specialty lane rather than the whole neocloud universe.
    whyItMatters: Public reports disagree on definitions, so converting market-wide estimates into a company-specific SAM would otherwise overstate certainty.
    diligencePath: Request management segmentation by geography, cluster size, contract type, and buyer class; reconcile against third-party demand forecasts.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: reserved-capacity-pricing
    missingEvidence: Real reserved-capacity pricing, discount schedules, egress terms, and idle-premium terms across hyperscalers and neocloud peers.
    whyItMatters: Public marketing pages and buyer guides do not reveal the actual landed cost that determines procurement lane choice.
    diligencePath: Collect customer quotes, reseller price sheets, and executed order forms for comparable GPU clusters.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: sovereign-procurement
    missingEvidence: Verified sovereign and government AI infrastructure procurement volumes by region and vendor.
    whyItMatters: Public statements show the segment matters, but without contracted volumes it is hard to size sovereign demand credibly.
    diligencePath: Use public-tender databases, budget documents, and management pipeline disclosure to quantify sovereign demand.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: minor
    topic: google-cloud-general-ai-infrastructure
    missingEvidence: A clean, stable Google Cloud overview page for AI infrastructure comparable to AWS, Azure, and Oracle marketing surfaces.
    whyItMatters: Google clearly participates in the market, but the fetched public documentation path was narrower than equivalent hyperscaler overview pages.
    diligencePath: Review current Google Cloud solution pages or sales collateral directly with the vendor.
    relatedQuestionRefs:
    - QM013
  - type: stale
    severity: material
    topic: regional-power-queues
    missingEvidence: Market-by-market, current-quarter utility queue and transformer-delivery data for the regions most relevant to Fluidstack.
    whyItMatters: Power lead times are now a first-order market variable, and broad national averages can hide major local differences in deployment speed.
    diligencePath: Pull utility filings, interconnection queue updates, and site-specific delivery schedules for target markets.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM004
