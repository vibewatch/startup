chapter:
  number: 2
  title: Market Analysis
  summary: Fluidstack participates in the fast-growing but physically constrained AI infrastructure market where hyperscaler capex, neocloud specialization, and power bottlenecks matter more than generic cloud TAM. Public sources support a market ranging from roughly $25B of 2025 neocloud revenue to hundreds of billions of annual AI infrastructure capex, with power access, procurement friction, and sovereignty needs creating the opening for specialty providers such as Fluidstack.
sections:
- id: section-1
  title: Market boundary and included spend
  body: 'Fluidstack does not sell generic cloud; it sells scarce AI infrastructure capacity. The relevant market boundary therefore starts with GPU-centric training and inference infrastructure and expands outward to the adjacent spend required to make that compute useful: data-center shell and core, high-density power delivery, liquid cooling, networking fabric, storage, cluster orchestration, and the commercial structures that turn those assets into reserved or on-demand capacity. It does not include application-layer AI software, model APIs, or the full universe of public-cloud compute because those are downstream of the infrastructure decision. In practice, buyers choose among a handful of lanes rather than one giant TAM: hyperscaler-managed AI infrastructure for procurement-friendly enterprises, tier-one neoclouds for price-performant reserved clusters, specialty providers such as Fluidstack or Voltage Park for narrower fits, and on-prem or hybrid deployments when sovereignty, trust,
    or custom architecture matters more than elasticity. This market framing matters because Fluidstack’s value is shaped less by generic cloud spending and more by the subset of AI demand that is power-, density-, and deployment-speed constrained.'
  claimRefs:
  - CM001
  - CM002
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  tableRefs:
