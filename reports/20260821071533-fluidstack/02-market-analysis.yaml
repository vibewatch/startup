- id: section-4
  title: Drivers, constraints, and adoption timing
  body: 'Adoption is being accelerated by model-training and inference demand but gated by physical infrastructure realities. JLL and CBRE both describe a market with record occupancy, rent escalation, and power as the primary site-selection criterion. Spheron and Inflect make the same point more bluntly: the scarce resource in 2026 is no longer the GPU, but the grid connection to power it. Spheron calculates roughly 1.76 MW of continuous draw for 1,000 H100-class GPUs and 8.8 MW for 5,000; Inflect describes 24–72 month waits for large-load grid capacity and transformer bottlenecks that stretch build timelines well beyond chip delivery. This shifts the market’s bottleneck from semiconductor procurement to site-control, utility relationships, and financing structures. It also shifts risk: hardware can be bought with money, but grid access requires time, community approvals, and often new generation or behind-the-meter solutions. For Fluidstack, this is both the opportunity and the danger:
    neoclouds win because hyperscalers cannot satisfy every buyer fast enough, but the same power, cooling, and financing constraints can compress margins or strand supply if demand or customer mix changes.'
