- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hyperscaler and frontier-lab capex surge
    - positive
    - current
    - Expands overall demand envelope for AI infrastructure
    - Track whether capex plans translate into live absorption
  - - Inference overtaking training
    - positive
    - 2027-2030
    - Broadens demand from episodic campaigns to steady-state serving
    - Model training vs inference mix by buyer
  - - Sovereignty and compliance demand
    - positive
    - current
    - Pushes some buyers away from generic public cloud
    - Which regions and certifications does each provider support
  - - Deployment-speed premium
    - positive
    - current
    - Creates room for neoclouds and specialty providers
    - Validate real lead times rather than marketing promises
  - - Grid interconnection delays
    - negative
    - current
    - Power becomes the primary gating factor for new campuses
    - Obtain utility status and transformer delivery windows
  - - High occupancy and rent escalation
    - negative
    - 2026-2030
    - Raises cost of leased capacity and preleasing
    - Stress-test unit economics under higher rent assumptions
  - - Hardware obsolescence and short contract tenors
    - negative
    - current
    - Can compress margins if pricing falls faster than depreciation
    - Review depreciation and reservation structures
  - - Construction, permitting, and community opposition
    - negative
    - current
    - Can strand projects even when demand is obvious
    - Map local approvals, water, and energy opposition
  notes: Growth depends on buyer urgency, but conversion depends on power, permitting, and financing more than on generic cloud demand.
