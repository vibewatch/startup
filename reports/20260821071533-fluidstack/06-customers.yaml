chapter:
  number: 6
  title: Customers
  summary: Fluidstack’s public customer story is concentrated around AI-native, high-intensity compute buyers. Anthropic is the strongest independently corroborated anchor, while Mistral, Character.AI, Poolside, and Black Forest Labs appear as vendor-named customer proofs that fit the target workload profile but are not equally validated. The resulting picture is attractive on logo quality but thin on disclosed retention, breadth, and concentration metrics.
sections:
- id: section-1
  title: Customer segmentation and target profile
  body: 'Fluidstack’s customer base appears concentrated in a narrow but valuable part of the AI market: frontier model builders, AI-native application companies, and a smaller set of enterprise or government buyers that need dedicated capacity rather than generic cloud elasticity. The clearest public signal is Fluidstack’s own leadership post, which says the company is powering Mistral, Character.AI, Poolside, and Black Forest Labs, among others, and operating more than 100,000 GPUs. Those customer names cluster around exactly the workloads that benefit from dedicated AI infrastructure: large model training, inference at consumer scale, code-generation infrastructure, and image or multimodal generation. Anthropic sits above even that group as the highest-confidence anchor counterparty because the relationship is corroborated by Anthropic, Hut 8, and TeraWulf. This is not a broad horizontal SMB customer base; it is a concentrated, high-touch strategic account model where a few logos can
    matter disproportionately to revenue quality and brand positioning.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
