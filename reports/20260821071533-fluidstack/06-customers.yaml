- id: section-3
  title: Adoption trajectory, expansion, and concentration
  body: Public adoption signals imply depth rather than breadth. Fluidstack has not published account counts, active-customer counts, NRR, GRR, or cohort statistics. Instead, the most useful public proxies are infrastructure scale, hiring, and repeat counterparties. The 100,000+ GPU claim, the New York expansion and jobs buildout, and the Anthropic-related programs at 245 MW to 2,295 MW all point toward a customer model built around a limited number of high-intensity deployments. That can be attractive if the customers are sticky, creditworthy, and likely to expand; it can be dangerous if one or two accounts dominate bookings or if site-delivery delays interrupt customer ramps. Procurement friction is also segment specific. Frontier labs can move quickly when capacity exists, while enterprise and government buyers require stronger security, compliance, and contracting support. Fluidstack’s hiring of customer reliability and production-engineering roles suggests the company knows service
    quality and deployment support are part of the customer product.
  claimRefs:
  - CU010
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
