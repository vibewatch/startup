  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Public value / status
  - What it implies
  - Diligence ask
  rows:
  - - NRR
    - Not disclosed
    - Expansion quality cannot be measured
    - Provide trailing 12-month NRR by cohort
  - - GRR / churn
    - Not disclosed
    - Base durability cannot be measured
    - Provide logo churn and revenue churn by segment
  - - Renewal rate
    - Not disclosed
    - Contract stickiness is unproven outside Anthropic path
    - Provide renewal calendar and save-rate history
  - - Customer satisfaction / NPS
    - Not disclosed
    - No public proof of service quality from customers
    - Provide customer references, support surveys, and SLA attainment
  - - Repeat purchase evidence
    - Anthropic appears to have expanded; other names unclear
    - Suggests at least one strong land-and-expand relationship
    - Break out which logos have expanded beyond initial cluster size
  - - Public cohort data
    - Absent
    - Retention figure work must use proxies or remain blank
    - Provide cohort tables for top customer segments
  notes: The lack of disclosed retention data is itself one of the main underwriting findings.
