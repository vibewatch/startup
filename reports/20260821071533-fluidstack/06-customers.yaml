- id: section-4
  title: Retention visibility and underwriting limits
  body: 'Retention durability remains the weakest public area. No disclosed NRR, GRR, churn, renewal rate, satisfaction metric, or cohort data appears in the reviewed sources. The best qualitative evidence of repeat or expansion behavior is the Anthropic relationship, which seems to have grown from compute supply into multi-site, partner-backed infrastructure programs. For other named logos, outside observers cannot tell whether the relationship is pilot, production, or legacy reference. That forces a cautious customer verdict: logo quality is strong, reference depth is weak, and concentration risk is likely high until management proves otherwise. The likely commercial pattern is land-and-expand—starting with a cluster or workload and expanding into larger reserved capacity or campus-scale footprints—but the public record does not yet show how often that pattern repeats. Investors should therefore treat the customer story as promising but still thinly evidenced. The absence of customer-authored
    case studies, quantified outcomes, and renewal statistics means even strong logos should be discounted until deeper reference checks are complete.'
