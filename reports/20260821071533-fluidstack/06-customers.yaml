- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk / pattern
  - Direction
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Anthropic concentration
    - negative
    - Anthropic is the strongest independently corroborated customer / counterparty
    - One relationship may dominate bookings and roadmap
    - Quantify revenue, backlog, and capacity share tied to Anthropic
  - - Land-and-expand potential
    - positive
    - MW path grows from initial tranche to optional large-scale expansion
    - A few accounts can scale dramatically if service quality holds
    - Show historical cluster-to-campus expansion rates
  - - Partner-site dependence
    - negative
    - Hut 8 and TeraWulf provide key site context for flagship programs
    - Customer delivery depends partly on partner execution
    - Map each flagship customer to site and partner dependencies
  - - Enterprise expansion
    - positive
    - Hiring and market demand imply enterprise ambitions
    - Could diversify beyond frontier labs
    - Provide pipeline by enterprise segment and sales cycle
  - - Government / sovereign expansion
    - mixed
    - Market opportunity exists but public named proof is limited
    - Could be strategic but slow-moving
    - Provide tenders, pilots, and qualification status
  - - Multi-homing risk
    - negative
    - AI buyers often use multiple compute providers
    - Customers may split or rebalance spend across clouds
    - Show win/loss reasons and share-of-wallet over time
  notes: Customer quality depends on both logo prestige and how diversified the base becomes.
