- id: section-2
  title: Named customer proof and reference quality
  body: 'Named customer proof is uneven in quality. Anthropic is the only customer or counterparty with strong multi-source public evidence: Anthropic’s own infrastructure announcement, Hut 8’s partnership release, and TeraWulf’s Kentucky lease release all place Fluidstack inside production-scale infrastructure programs. By contrast, Mistral, Character.AI, Poolside, and Black Forest Labs are primarily validated as named customers by Fluidstack itself, with each company’s own website used here mostly to confirm buyer type, workload intensity, and likely deployment profile. That means the logos are useful but not equally probative. Still, they fit a coherent pattern: Mistral needs frontier-grade clusters and private deployment options, Character.AI runs a high-scale consumer AI product, Poolside focuses on code-generation systems and hybrid or dedicated deployment, and Black Forest Labs sells API, open-weight, and enterprise generative-media products that likely consume significant GPU capacity.
    The named roster therefore suggests relevance across several top AI workload categories even if direct contract values are missing.'
  claimRefs:
