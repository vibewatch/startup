    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origins, and current product frame
        blocks:
          - type: paragraph
            body: >-
              Fluidstack’s legal entity remains FLUIDSTACK LTD in the UK, incorporated on 28 September 2017 and
              previously named FLARE SOCIAL LTD, while the operating story told on current company-controlled surfaces
              is that the business was founded in 2017 at Oxford University and now runs from New York. The official
              homepage no longer markets a simple GPU-rental marketplace; instead it says the company acquires power,
              designs and builds data centers, and operates them for leading AI labs, governments, and enterprises, with
              a stated goal of delivering gigawatts of compute in about six months versus an 18–24 month industry norm.
              LinkedIn, the December 2025 headquarters-relocation post, and secondary databases all reinforce that the
              company now wants to be understood as an AI infrastructure platform with a U.S. command center, even
              though some databases still lag on HQ location and continue to show older London coordinates. That profile
              drift is important in diligence terms: it suggests the company has pivoted faster than third-party data
              vendors update, so identity and scale facts should be grounded in primary sources first and database
              summaries second.
