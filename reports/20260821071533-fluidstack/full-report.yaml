      - number: '1.4'
        title: Scale signals, milestone chronology, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Fluidstack has accumulated enough public markers to show real scale, but not enough to remove material
              diligence uncertainty. Official posts repeatedly cite more than 100,000 GPUs under management, named
              customers including Mistral, Character.AI, Poolside, Black Forest Labs, and Anthropic, and a jobs surface
              filled with electrical, civil, networking, and capacity-delivery roles across New York, Austin, San
              Francisco, Seattle, and beyond. At the same time, headcount surfaces conflict: LinkedIn says 51–200
              employees while showing 384 employee profiles, Seedtable reports 270 employees, and public databases still
              carry older London HQ data. The timeline is also not uniformly clean. The company’s own blog index shows a
              rapid sequence of 2025–2026 announcements around France, Europe, Macquarie financing, Anthropic,
              headquarters relocation, and Series A. Yet Dawn Liphardt reports that some French project announcements
              disappeared from Fluidstack’s site and may reflect a strategic retreat toward North America after the
              Anthropic contract. External neocloud underwriting analyses add a second layer of caution: customer
              concentration, hardware obsolescence, grid access, and power pricing can all erode the economics of a
              business model that headline valuation alone might overstate. In other words, the company overview is
              impressive on ambition and counterparties, but still incomplete on execution proof and economic
              transparency.
