      - number: '7.4'
        title: People, execution, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              People and execution risk is unusually important because the product is really an operating system for
              capital-heavy infrastructure. Fluidstack’s jobs pages span GPU infrastructure, networking, site
              reliability, power, controls, and modular R&D, implying that the company must scale cloud operations and
              physical engineering at the same time. That creates a broad failure surface: security controls can lag
              customer expectations, rollout schedules can slip, internal tooling can fail to keep up with cluster
              count, and a few key executives can become bottlenecks. The mitigation picture is not empty—Fluidstack has
              strong market tailwinds, top-tier logos, and partner-backed site programs—but most mitigations are still
              in execution rather than in mature disclosure. The investment implication is simple: this is not a
              low-beta infrastructure utility. It is a fast-scaling, capital-intensive operator whose thesis can break
              through power delays, customer concentration, financing strain, security shortcomings, or simple
              operational overreach. Weak visibility on internal metrics increases the chance that investors discover
              thesis breaks late.
            claimRefs:
              - CR035
