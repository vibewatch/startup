      - number: '2.2'
        title: Sizing lenses and growth trajectory
        blocks:
          - type: paragraph
            body: >-
              On almost any lens, the infrastructure wave is large enough to support multiple winners, but the numbers
              operate at different layers. Goldman Sachs estimates around $1 trillion of global AI investment in 2026,
              with just under $600 billion in the U.S.; Futurum estimates the five largest U.S. hyperscale and AI
              infrastructure providers alone will spend $660–690 billion on capex in 2026; JLL projects nearly 100
              gigawatts of new data-center supply between 2026 and 2030 and says the supercycle could require roughly $3
              trillion once tenant fit-out is included. The neocloud slice is smaller but growing far faster: CRN,
              citing Synergy Research Group, says the segment exceeded $25 billion in 2025 and could reach $400 billion
              by 2031, while ABI Research pegs neocloud GPU-as-a-service opportunity at $250 billion by 2030. These are
              not interchangeable metrics, but they all point in the same direction: AI infrastructure spend is now
              large enough that cloud procurement, power development, and balance-sheet engineering are becoming core
              strategic functions rather than back-office utilities.
