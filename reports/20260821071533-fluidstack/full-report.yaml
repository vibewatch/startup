  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and governance risks
        blocks:
          - type: paragraph
            body: >-
              Fluidstack’s risk profile starts with regulation and permitting, even though it is not a regulated bank,
              biotech, or consumer platform. The company is moving into large AI data-center development, which means
              exposure to land use, grid interconnection, construction approvals, environmental scrutiny, workplace
              safety, and data-handling expectations from enterprise and sovereign customers. The reviewed public record
              also shows limited disclosure on legal structure, charges, and control. Companies House says the UK entity
              has no registered charges and no registrable PSC, but that simplifies nothing: it mainly tells investors
              that crucial leverage and control questions may sit elsewhere in the structure. At the same time,
              counterparties such as Anthropic operate inside a tightening frontier-AI governance environment, which
              could alter deployment timing, data handling, or acceptable-use requirements for infrastructure partners.
              Regulatory and legal risk is therefore less about one obvious lawsuit today and more about whether
              Fluidstack can keep scaling physical and customer-facing infrastructure without tripping environmental,
              security, or governance bottlenecks.
