  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              The competitive field around Fluidstack is not one neat peer group. Buyers can solve the same job through
              hyperscalers, large neocloud specialists, smaller specialty providers, private clusters, or sovereign and
              hybrid deployments. That means Fluidstack competes directly with AI-cloud specialists such as CoreWeave,
              Lambda, Crusoe, Voltage Park, and Nebius; indirectly with AWS, Azure, Google Cloud, Oracle, and NVIDIA DGX
              Cloud; and structurally with internal build or colocation when the buyer has the balance sheet and control
              requirements to own capacity outright. The direct peer set is defined less by brand and more by the
              combination of dedicated GPU access, interconnect-rich clusters, and contract flexibility. On that basis
              CoreWeave is the largest scale threat, Lambda is the clearest price-transparency benchmark, Crusoe is the
              closest energy-first strategic analog, Voltage Park competes on transparent H100 reserve packaging and
              enterprise trust, and Nebius competes on cloud-native tooling and cluster ergonomics. Fluidstack’s
              differentiator only matters if its power-access and campus-execution claims convert into faster or better
              availability than those alternatives.
