      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              A scenario approach is more honest than pretending there is a precise multiple. In a bull case, Fluidstack
              proves that Anthropic-linked programs convert into durable revenue, secures additional campuses on time,
              and begins to look more like a power-backed execution story in the Crusoe mold than like a thinly
              documented GPU broker; under that outcome, a low-teens billion valuation is defendable. In a base case,
              the company executes competently but still with limited transparency, which makes the current $7.5 billion
              valuation roughly fair but not obviously cheap. In a bear case, delays, customer concentration, or
              financing strain reveal that the firm is more exposed to project risk than investors assumed; then the
              appropriate value could compress well below the last round. Because revenue is undisclosed, the valuation
              range should be driven by milestone achievement, contract proof, and financing resilience rather than by a
              false precision revenue multiple.
            claimRefs:
              - CV023
