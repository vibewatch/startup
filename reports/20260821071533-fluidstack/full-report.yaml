companyProfile:
  summary: >-
    Fluidstack is a 2017 Oxford-founded AI infrastructure company that now presents itself as a New York-headquartered
    builder and operator of AI data centers rather than only a managed GPU cloud. Public sources show a company centered
    on acquiring power, designing and building data centers, and operating large dedicated compute clusters for frontier
    AI labs, governments, and enterprises. The company announced an $830 million Series A at a $7.5 billion valuation in
    2026, led by Situational Awareness, and appears repeatedly in Anthropic-linked infrastructure programs with Hut 8
    and TeraWulf. The business looks strategically important, but its public disclosure profile remains materially
    thinner than the scale of its ambitions.
