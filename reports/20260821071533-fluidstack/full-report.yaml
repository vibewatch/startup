      - number: '7.3'
        title: Partner, customer, and financial-model risks
        blocks:
          - type: paragraph
            body: >-
              Partner and customer concentration compound the operating risk. Anthropic is the strongest public proof of
              customer quality, but it is also the most obvious concentration risk; the same is true of site partners
              such as Hut 8 and TeraWulf in the company’s best-documented programs. The upside of this model is scale: a
              few strategic relationships can drive hundreds of megawatts of demand. The downside is that any customer
              strategy shift, site delay, credit issue, or renegotiation can have outsized effects on bookings,
              utilization, and fundraising. Financial-model risk is similarly nonlinear. The company raised $830 million
              at a $7.5 billion valuation, yet public partner disclosures describe infrastructure programs whose
              downstream capital needs can quickly dwarf that amount. Without public cash, burn, margin, debt, or
              renewal metrics, outsiders cannot tell whether Fluidstack is prudently sequencing growth or merely
              front-loading capital commitments in hopes that customer demand and project finance keep pace.
            claimRefs:
              - CR024
              - CR025
              - CR026
