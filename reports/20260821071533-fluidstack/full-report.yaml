            body: >-
              Pricing is only partially observable. Unlike Lambda, which publishes self-serve and reserved B200 pricing,
              Fluidstack does not disclose public list rates. CoreWeave and Voltage Park also keep most realized pricing
              private, which suggests that large AI infrastructure deals remain highly bespoke and negotiated around
              duration, volume, egress, storage, and support rather than a single clean sticker price. That matters for
              financial quality because list-price comparisons can overstate actual revenue quality or gross margin. The
              same GPU hour can be sold as burst capacity, a multi-month reserved cluster, or part of a longer
              infrastructure relationship tied to site development and operations. In the best case, Fluidstack
              monetizes higher-quality, longer-duration contracts that begin to resemble infrastructure leasing and
              managed services rather than volatile spot cloud revenue. In the worst case, it bears upfront capex while
