        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The public sources do not disclose Fluidstack’s full internal architecture, but the likely reference
              design is clear from how the market operates. NVIDIA’s HGX and DGX platforms frame the standard multi-GPU
              building blocks; NVLink provides high-bandwidth scale-up within nodes; InfiniBand and related
              high-performance networking underpin scale-out across giant AI clusters; and common cloud patterns pair
              Kubernetes, Slurm, and vendor-specific control planes for scheduling, observability, and lifecycle
              management. CoreWeave’s Mission Control and Nebius’s public compute documentation show what mature peers
              expose around managed Kubernetes, fleet lifecycle, observability, and InfiniBand clustering. Fluidstack
              may implement a different control plane, but the architectural burden is similar: it must turn expensive,
              failure-sensitive hardware into a stable, tenant-usable training and inference service with acceptable
              performance and security.
