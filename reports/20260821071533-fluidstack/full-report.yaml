        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public founder and governance disclosure is uneven but directionally clear. Gary Wu is identified on
              current official materials as CEO and co-founder, while César Maklary is identified as co-founder and
              president. Tracxn adds Jamie Cox as co-founder and chief strategy officer and reports an active
              three-person board including Peixian Wu, César Maklary, and independent director Stephane Fisch, but those
              board details are not reproduced on Fluidstack’s own site and therefore should be treated as
              medium-confidence secondary evidence rather than settled primary fact. What is primary is the February
              2025 operating-bench expansion: Rob Perdue joined as COO from The Trade Desk, Dan Carpenter came in from
              AWS/Omniva to run sales, Mike McDonald came from hyperscaler and Crusoe GPU-cloud roles to lead product
              and engineering, and Katherine Ollerhead joined as general counsel from Canonical. The hiring mix says a
              great deal about where management attention sits: scale delivery, revenue, productization, and regulatory
              and commercial infrastructure rather than pure marketplace experimentation. Key-person dependence remains
              high around Wu and Maklary because they anchor both the frontier-lab narrative and the buildout pace that
              underwrites the valuation.
