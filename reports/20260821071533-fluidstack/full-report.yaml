  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Fluidstack does not sell generic cloud; it sells scarce AI infrastructure capacity. The relevant market
              boundary therefore starts with GPU-centric training and inference infrastructure and expands outward to
              the adjacent spend required to make that compute useful: data-center shell and core, high-density power
              delivery, liquid cooling, networking fabric, storage, cluster orchestration, and the commercial structures
              that turn those assets into reserved or on-demand capacity. It does not include application-layer AI
              software, model APIs, or the full universe of public-cloud compute because those are downstream of the
              infrastructure decision. In practice, buyers choose among a handful of lanes rather than one giant TAM:
              hyperscaler-managed AI infrastructure for procurement-friendly enterprises, tier-one neoclouds for
              price-performant reserved clusters, specialty providers such as Fluidstack or Voltage Park for narrower
              fits, and on-prem or hybrid deployments when sovereignty, trust, or custom architecture matters more than
              elasticity. This market framing matters because Fluidstack’s value is shaped less by generic cloud
              spending and more by the subset of AI demand that is power-, density-, and deployment-speed constrained.
            claimRefs:
              - CM001
              - CM002
