      - number: '1.3'
        title: Funding, counterparties, and strategic positioning
        blocks:
          - type: paragraph
            body: >-
              The capital story is unusually strong for a company still private and relatively opaque. Fluidstack said
              its Series A closed in January 2026 and was announced publicly on 20 July 2026 at $830 million and a $7.5
              billion valuation, led by Situational Awareness, the fund founded by former OpenAI researcher Leopold
              Aschenbrenner. Public announcements do not name the full investor list; secondary databases mention Nat
              Friedman and describe other participants only generically, so the round is well supported on amount,
              timing, and lead but not on ownership detail. Strategic counterparties matter as much as equity investors:
              Anthropic is the anchor workload partner behind the $50 billion U.S. infrastructure announcement; Hut 8
              and TeraWulf expand the power-and-campus footprint; and Macquarie provides a financing template for
              European GPU deployments secured by the hardware itself. This is why Fluidstack should be read less as a
              conventional cloud startup and more as a hybrid of data-center developer, compute operator, and
              structured-finance vehicle. The valuation rests on the belief that this partner web can keep turning land,
              power, GPUs, and customer demand into contracted infrastructure faster than incumbents.
