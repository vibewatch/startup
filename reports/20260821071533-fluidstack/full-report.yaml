      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Moat durability in this market is mixed. Much of the feature vocabulary—H100/H200/B200 access, InfiniBand,
              bare metal, managed Kubernetes, high-performance storage, security compliance—has already converged across
              competitors. That creates commoditization pressure around the same NVIDIA-based building blocks. Durable
              advantages are more likely to come from non-commodity assets: power procurement, shovel-ready sites,
              financing, distribution, enterprise trust, and long-duration customer contracts. For Fluidstack that is
              simultaneously encouraging and dangerous. If it really can secure megawatts, build quickly, and offer
              dedicated capacity ahead of hyperscaler queues, it can win despite smaller ecosystem breadth. If not, it
              risks being squeezed between hyperscalers with better distribution and larger specialists such as
              CoreWeave or Crusoe with more visible platform depth and infrastructure narratives. The competitive
              verdict is therefore not that the market lacks room, but that winning requires proving a specific
              non-commodity edge rather than merely reselling GPUs.
            claimRefs:
