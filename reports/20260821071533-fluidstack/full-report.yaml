  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction evidence
        blocks:
          - type: paragraph
            body: >-
              Fluidstack’s public financial story is dominated by capacity, not classic SaaS metrics. The company sells
              AI infrastructure and therefore likely recognizes revenue through a mix of reserved compute contracts,
              dedicated cluster operations, and campus or partner-site infrastructure services rather than through
              simple monthly software subscriptions. Public evidence supports this framing: the corporate site
              emphasizes acquiring power, building data centers, and operating clusters; the Series A announcement
              frames the company as an infrastructure builder; and partner releases with Hut 8 and TeraWulf tie
              Fluidstack to megawatt-scale deployments and long-duration counterparties. What remains missing is the
              core underwriting data—revenue, gross margin, utilization, burn, cash, and contract concentration. As a
              result, the most defensible revenue view is structural rather than numeric: Fluidstack appears designed to
              monetize committed AI capacity and related operating services, but outside observers cannot yet
              distinguish between high-quality contracted infrastructure revenue and lower-visibility resale or
              transient cloud demand.
