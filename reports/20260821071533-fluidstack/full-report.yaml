      - number: '7.2'
        title: Operational, quality, and security risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Fluidstack is exposed to the most severe bottlenecks in the AI infrastructure chain.
              Spheron and Inflect both argue that grid access, not GPU allocation, is now the binding constraint; JLL
              and CBRE reinforce a market defined by power scarcity, high occupancy, and expensive expansion. That means
              the company must get power, cooling, networking, and site delivery right before customers can realize
              value. Even after power is secured, the stack remains fragile: high-density AI clusters depend on liquid
              cooling, multi-GPU systems, high-bandwidth fabrics, scheduling, and observability all working together.
              NVIDIA dependency adds another layer because much of the market converges on similar HGX- and
              InfiniBand-centered designs. If next-generation hardware cycles, fabric transitions, or thermal
              requirements outrun Fluidstack’s deployment capability, the company could find itself holding costly,
              underperforming assets while customers or capital partners move to alternatives.
