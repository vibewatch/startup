  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Fluidstack’s product is best understood as an AI infrastructure stack rather than as a single software
              SKU. The company’s public site emphasizes acquiring power, building and operating data centers, and
              delivering exa-scale compute; its leadership post says it has more than 100,000 GPUs under management and
              serves multi-thousand-GPU training and inference workloads. In workflow terms, the product begins before
              software: site control, utility capacity, cooling, racks, network fabric, and hardware procurement are all
              part of what the customer is buying. Only after those layers exist does Fluidstack expose the cloud-like
              experience of provisioning and operating clusters. This matters because the “product” should be
              underwritten partly like infrastructure and partly like platform operations. The customer is not only
              buying compute cycles; they are buying time-to-capacity, reliability at scale, and a managed path from
              power to usable AI clusters.
