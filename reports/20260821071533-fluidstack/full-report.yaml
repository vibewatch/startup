  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case for Fluidstack is clear in concept even if it is under-disclosed in numbers. The
              company sits in a large, capacity-constrained AI infrastructure market, has raised a headline-grabbing
              $830 million Series A at a $7.5 billion valuation, and appears repeatedly inside some of the most
              important compute programs in the sector—especially Anthropic-linked projects. That combination supports a
              premium story: if Fluidstack truly converts power access, site delivery, and partner-backed campuses into
              reliable large-cluster deployments, it can occupy a valuable niche between hyperscalers and generic
              neoclouds. The anti-thesis is equally clear. Unlike CoreWeave, Lambda, or Crusoe, Fluidstack does not
              publicly disclose revenue, backlog, margin, or utilization, so investors are being asked to pay for option
              value and strategic positioning rather than for proven cash-generation metrics. The valuation question is
              therefore not whether the market is big enough—it is whether the current price already assumes execution
              proof that has not yet been publicly shown.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
