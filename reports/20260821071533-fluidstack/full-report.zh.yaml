      - number: '2.2'
        title: 规模测算视角与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              几乎按任何视角看，这轮基础设施浪潮都大到足以容纳多个赢家，但各组数字落在不同层级。Goldman Sachs 估计 2026 年全球 AI 投资约 $1 trillion，其中美国略低于 $600
              billion；Futurum 估计，仅美国五大超大规模云和 AI 基础设施提供商在 2026 年的资本开支就会达到 $660–690 billion；JLL 预计 2026–2030 年新增数据中心供给接近
              100 GW，并称若计入租户配套改造，这轮超级周期可能需要大约 $3 trillion。新型云厂商板块更小，但增速快得多：CRN 援引 Synergy Research Group 称，该板块 2025 年已超过
              $25 billion，2031 年可能达到 $400 billion；ABI Research 则把 2030 年新型云厂商 GPU 即服务机会定在 $250
              billion。这些指标不能互相替代，但方向一致：AI 基础设施支出已经大到让云采购、电力开发和资产负债表工程成为核心战略职能，而不再是后台工具。
