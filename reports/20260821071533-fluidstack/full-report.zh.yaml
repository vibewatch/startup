      - number: '5.3'
        title: 部署、支持与信任控制
        blocks:
          - type: paragraph
            body: >-
              部署质量不只取决于 GPU 是否可用。JLL 和 Spheron 都强化了一个事实：现代 AI 设施围绕极高机柜密度和 MW 级电力块设计，这把冷却和场址工程推到产品核心。LiquidStack 自己的 AI
              工厂定位说明了原因：芯片直冷和模块化冷却液分配系统，正在成为支撑下一代 GPU 平台的关键。与此同时，企业客户现在预期供应商具备可与领先 AI 云相比的信任基线。CoreWeave 和 Voltage Park
              公开营销 IAM、单租户隔离、SOC 2 / ISO 27001 对齐和控制平面安全；既有巨头则叠加更成熟的治理模式。Fluidstack
              公开披露的信任细节更薄，因此尽调应把安全、共担责任边界和可审计性视为仍需验证的证明点，而不是已经解决的功能。为关键训练任务做投资判断的买方，关心集群恢复、回滚程序、维护窗口和支持升级，程度不亚于原始
              FLOPS；因为作业失败会浪费研究人员数天时间和昂贵容量。
