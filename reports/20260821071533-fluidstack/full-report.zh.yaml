      - number: '2.4'
        title: 驱动因素、约束与采用节奏
        blocks:
          - type: paragraph
            body: >-
              模型训练和推理需求推着采用加速，但物理基础设施卡着落地。JLL 和 CBRE 都描述了一个租用率创纪录、租金上涨、电力成为首要选址标准的市场。Spheron 和 Inflect 说得更直白：2026
              年真正稀缺的不再是 GPU，而是给 GPU 供电的电网连接。Spheron 测算，1,000 块 H100 级 GPU 需要约 1.76 MW 连续负荷，5,000 块需要 8.8 MW；Inflect
              描述，大负载电网容量要等 24–72
              个月，变压器瓶颈把建设周期拉到远超芯片交付时间。市场瓶颈因此从半导体采购转向场址控制、公用事业关系和融资结构。风险也随之转移：硬件可以用钱买，电网接入却需要时间、社区审批，且往往需要新增发电或表后方案。对
              Fluidstack 来说，这既是机会也是危险：新型云厂商能赢，是因为超大规模云厂商无法足够快地满足每个买方；但如果需求或客户组合变化，同样的电力、冷却和融资约束也会压缩利润率，甚至让供给搁浅。
            claimRefs:
