        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              因此建议是有条件的。Fluidstack
              不是简单回避——公司确实有战略位置、市场时机和交易对手，足以支撑一个出色结果。但以当前价格看，它还不值得盲目信任。投资人应以中低置信度承销，要求对收入质量、集中度和项目融资做异常深入的尽调，并争取能反映执行与披露风险的条款。如果管理层能证明签约收入持久、Anthropic
              之外的客户扩张更多元，并拿出可信的站点交付数据，Series A
              估值最终可能显得保守。若不能，当前标记相对披露更透明的同业可能显得激进。因此估值立场是有选择地参与，而不是热情追高：只有剩余尽调问题按有利于公司的方式解决，或进入条款足以补偿不透明性时才参与。这样既保留上行空间，也尊重不透明基础设施承销的非对称下行。
