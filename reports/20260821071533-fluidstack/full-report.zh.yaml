  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引力证据
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 的公开财务叙事围绕容量，而不是经典 SaaS 指标。公司销售 AI
              基础设施，因此收入很可能来自预留算力合同、专用集群运营，以及园区或伙伴站点基础设施服务的组合，而不是简单的月度软件订阅。公开证据支持这个框架：公司官网强调拿电、建设数据中心和运营集群；Series A
              公告把公司定位为基础设施建设者；与 Hut 8、TeraWulf 的伙伴公告则把 Fluidstack 绑定到 MW
              级部署和长期交易对手上。缺失的仍是核心投资判断数据——收入、毛利率、利用率、烧钱速度、现金和合同集中度。因此，最站得住脚的收入视角是结构性的，而不是数字性的：Fluidstack 看起来就是为了把已承诺 AI
              容量及相关运营服务变现而设计，但外部观察者还无法区分，高质量合同化基础设施收入与可见度较低的转售或短暂云需求各占多少。
