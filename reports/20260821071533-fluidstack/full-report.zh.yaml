      - number: '1.4'
        title: 规模信号、里程碑时间线与反向背景
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 已经积累了足够多的公开标记，足以显示真实规模；但这些标记还不足以消除重大尽调不确定性。官方帖子反复提到公司管理超过 100,000 块 GPU，点名客户包括
              Mistral、Character.AI、Poolside、Black Forest Labs 和 Anthropic；招聘页面则铺满电气、土建、网络和容量交付岗位，地点覆盖 New
              York、Austin、San Francisco、Seattle 等地。与此同时，员工数口径互相打架：LinkedIn 写 51–200 人，却显示 384 个员工档案；Seedtable 报 270
              人；公开数据库仍保留较旧的 London 总部数据。时间线也并不完全干净。公司自己的博客索引显示，2025–2026 年围绕法国、欧洲、Macquarie 融资、Anthropic、总部迁移和 Series A
              连续发布公告。但 Dawn Liphardt 称，部分法国项目公告从 Fluidstack 网站上消失，可能反映公司在 Anthropic
              合同后战略重心转向北美。外部新型云厂商投资分析又加上一层谨慎：客户集中、硬件过时、电网接入和电价，都可能侵蚀一个仅看高估值容易被夸大的商业模式。换句话说，公司概况在野心和交易对手上很亮眼，但执行证明和经济透明度仍不完整。
