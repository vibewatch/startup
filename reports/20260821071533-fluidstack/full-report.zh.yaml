              基础设施交易仍高度定制，谈判围绕期限、规模、出站流量、存储和支持展开，而不是围绕一个干净的标价。财务质量因此受到影响，因为标价对比可能夸大实际收入质量或毛利率。同一 GPU hour
              可以作为突发容量出售，也可以作为数月预留集群出售，还可以成为一段更长期、绑定场址开发和运营的基础设施关系的一部分。最好情况下，Fluidstack
              变现的是质量更高、期限更长的合同，开始接近基础设施租赁和托管服务，而不是波动的 spot 云收入。最坏情况下，它先承担前期资本开支，却仍要在 Lambda
