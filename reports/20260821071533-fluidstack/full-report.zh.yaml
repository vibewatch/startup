              财务结论因此复杂，但可以读懂。需求验证很强：顶级实验室显然愿意承诺大规模、有电力支撑的基础设施项目，Fluidstack
              也不断出现在这些项目里。如果相当一部分收入由长期、信用好的合同支撑，并且园区通电并被使用后公司能吃到运营杠杆，收入质量可能很优秀。但公开投资判断信心仍低，因为公司几乎没有披露验证这一逻辑所需的指标。公开资料没有现金余额、月度烧钱速度、现金跑道、毛利率、利用率或债务画像。英国实体没有登记押记，也没有可登记的重大控制人（PSC）；这增加的是不透明度，而不是降低风险，因为融资和控制可能在结构中的其他位置。简言之，Fluidstack
