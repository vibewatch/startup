      - number: '1.2'
        title: 创始人、管理层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开的创始人和治理披露并不均匀，但方向清楚。Gary Wu 在当前官方材料中被列为 CEO 兼联合创始人，César Maklary 被列为联合创始人兼总裁。Tracxn 还把 Jamie Cox
              列为联合创始人兼首席战略官，并称公司有一个现任三人董事会，成员包括 Peixian Wu、César Maklary 和独立董事 Stephane Fisch；但这些董事会细节没有出现在 Fluidstack
              自有网站上，因此更适合作为中等置信度的二级证据，而不是已经坐实的一手事实。一手证据更扎实的是 2025 年 2 月的运营班底扩张：Rob Perdue 从 The Trade Desk 加入担任 COO，Dan
              Carpenter 从 AWS/Omniva 加入负责销售，Mike McDonald 带着超大规模云厂商和 Crusoe GPU 云经历加入负责产品和工程，Katherine Ollerhead 从
              Canonical 加入担任总法律顾问。这组招聘很能说明管理层注意力放在哪里：规模交付、收入、产品化，以及监管和商业基础设施，而不是单纯试水市场型业务。Wu 和 Maklary
              周围的关键人依赖仍高，因为他们既锚定前沿实验室叙事，也锚定支撑估值的建设速度。
