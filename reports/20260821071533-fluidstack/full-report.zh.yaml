              包装和分销几乎和裸硬件同样重要。Lambda 是最有用的公开标杆，因为它同时公布低端自助价格和预留 B200 集群价格；CoreWeave 和许多其他玩家则把成交价留在销售流程之后。Voltage Park
              披露合同形态、无隐藏费用定位和预留条款，但仍需联系后才给准确价格，部分填补了这个缺口。这种不对称有战略意义：不透明定价可以在定制交易里保住利润率，却会削弱外部对竞争力的验证。买方选择多家供应也有充分理由。超大规模云厂商保住信任边界、IAM、存储和采购默认项；专门供应商提供更快获取、更密集互联、更灵活预留，有时还能给专用工作负载带来更低落地成本。因此，切换成本真实存在，但并非绝对：数据迁移、编排、安全审查和预留承诺都会拖慢迁移；但成熟买方在供给、延迟或价格变化时，确实可以把工作负载拆到多个供应商。
