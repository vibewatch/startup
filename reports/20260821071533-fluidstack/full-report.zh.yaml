  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 的风险画像从监管和许可开始，尽管它不是受监管银行、生物科技公司或消费者平台。公司正在进入大型 AI
              数据中心开发，这意味着它会暴露在土地使用、电网互联、施工审批、环境审查、工作场所安全，以及企业和主权客户的数据处理预期之下。已审阅公开记录也显示，法律结构、押记和控制披露有限。Companies House
              称英国实体没有登记押记，也没有可登记 PSC，但这并没有降低复杂度：它主要告诉投资人，关键杠杆和控制问题可能位于结构中的其他位置。与此同时，Anthropic 等交易对手处在不断收紧的前沿 AI
              治理环境里，这可能改变基础设施伙伴的部署节奏、数据处理或可接受使用要求。因此，监管和法律风险不太是今天是否有一桩明显诉讼，而是 Fluidstack
              能否持续扩张物理基础设施和面向客户的基础设施，同时不被环境、安全或治理瓶颈绊住。
