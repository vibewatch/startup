  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 的投资逻辑在概念上很清楚，哪怕数字披露不足。公司处在容量受限、空间巨大的 AI 基础设施市场，完成了足够吸睛的 $830 million Series A，估值 $7.5
              billion，并反复出现在行业最重要的一些算力项目里，尤其是 Anthropic 相关项目。这个组合撑起了一个高估值故事：如果 Fluidstack
              真能把电力获取、站点交付和伙伴支撑的园区转成可靠的大集群部署，它就能在超大规模云厂商和普通新云厂商之间占住一个有价值的位置。反向逻辑同样清楚。不同于 CoreWeave、Lambda 或
              Crusoe，Fluidstack
              没有公开披露收入、积压订单、利润率或利用率，所以投资人买的是期权价值和战略卡位，而不是已经验证的现金生成指标。因此估值问题不是市场是否足够大，而是当前价格是否已经计入了尚未公开证明的执行证据。
