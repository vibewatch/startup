              资本强度是核心财务变量。$830 million Series A 按创业公司标准很大，但相对 GW 级 AI 建设仍小。Companies House 备案历史显示，2026
              年多次发生股份配发和治理变更，更像一个重融资扩张年，而不是安静的种子轮后运营阶段。TeraWulf 2026 年 7 月公告尤其有信息量：Anthropic 在 Kentucky 401 MW 园区的 20
              年租约，预计在初始期限内产生约 $19 billion 合同收入；TeraWulf 另称，在已投入约 $450 million 后，由 Fluidstack 牵头的投资人集团收购了其在 168 MW
              Abernathy JV 中 50.1% 的权益。随后 Hut 8 又勾勒出一条路径：由 Fluidstack 运营集群，AI 基础设施从 245 MW 扩至最高额外 2,295 MW。这些是生态级数字，不是
