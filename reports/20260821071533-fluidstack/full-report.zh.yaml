  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 周围的竞争场不是一个整齐同质的可比组。买方可以靠超大规模云厂商、大型新型云专门玩家、小型垂直供应商、私有集群，或主权和混合部署来解决同一件事。这意味着 Fluidstack 直接竞争
              CoreWeave、Lambda、Crusoe、Voltage Park、Nebius 等 AI 云专门玩家；间接竞争 AWS、Azure、Google Cloud、Oracle 和 NVIDIA DGX
              Cloud；当买方有资产负债表和控制要求、可以直接拥有容量时，还会与自建或托管机房发生结构性竞争。直接可比组不主要由品牌决定，而由专用 GPU
              获取、互联密集型集群和合同灵活性这三者的组合决定。按这个标准，CoreWeave 是最大的规模威胁，Lambda 是最清晰的价格透明度标杆，Crusoe 是最接近的能源优先战略类比，Voltage Park
              用透明的 H100 预留包装和企业信任竞争，Nebius 则用云原生工具和集群使用体验竞争。只有当 Fluidstack
              的电力获取和园区执行承诺，真正转化成比这些替代方案更快或更好的可用容量时，它的差异化才有意义。
