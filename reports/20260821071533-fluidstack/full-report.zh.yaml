      - number: '2.3'
        title: 买方分层与替代方案
        blocks:
          - type: paragraph
            body: >-
              买方地图同样关键。前沿实验室和超大规模云厂商购买预留集群和园区级电力；企业模型构建者购买专用或半专用训练与推理环境；受监管企业和主权买方更看重可审计性、区域控制和数据处理；创业公司或研究人员通常先用 spot
              型或较小的预留容量，再逐步向上游迁移。WeTheFlywheel
              的买方侧比较很好地抓住了这种分道逻辑：采购现实和合规交给超大规模云厂商，大额预留训练预算交给一线新型云厂商，一家供应商管到底的流程交给全栈厂商，研究突发需求交给 spot
              市场；当地理位置或合同形态比全球足迹更重要时，Fluidstack 这类专门供应商就有位置。超大规模云厂商官网也解释了为什么既有巨头仍是默认替代方案——AWS、Azure、Google、Oracle 和
              NVIDIA 都在营销覆盖算力、存储、网络和工具的端到端 AI 栈。这意味着 Fluidstack 不只是在拼 GPU
              供给；它拼的是部署速度、合同灵活性，以及在不把买方推入超大规模云厂商目录价和排队机制的前提下，解决受电力约束的集群采购。
