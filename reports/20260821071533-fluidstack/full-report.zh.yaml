      - number: '1.3'
        title: 融资、交易对手与战略定位
        blocks:
          - type: paragraph
            body: >-
              对一家仍未上市且相对不透明的公司来说，Fluidstack 的资本叙事异常强。公司称 Series A 于 2026 年 1 月完成，并在 2026 年 7 月 20 日公开宣布：融资 $830
              million，估值 $7.5 billion，由前 OpenAI 研究员 Leopold Aschenbrenner 创办的基金 Situational Awareness
              领投。公开公告没有列出完整投资人名单；二级数据库提到 Nat
              Friedman，对其他参与方只做泛称，因此此轮在金额、时间和领投方上证据扎实，但所有权细节仍不清。战略交易对手与股权投资人同样重要：Anthropic 是 $50 billion
              美国基础设施公告背后的锚定负载伙伴；Hut 8 和 TeraWulf 扩大电力和园区版图；Macquarie 则为以硬件本身作抵押的欧洲 GPU 部署提供融资模板。因此，Fluidstack
              不应只被看成传统云创业公司，更像数据中心开发商、算力运营商和结构化融资载体的混合体。估值押注的是，这张伙伴网络能持续把土地、电力、GPU 和客户需求，比既有巨头更快地转成合同化基础设施。
