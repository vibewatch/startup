companyProfile:
  summary: >-
    Fluidstack 是一家 2017 年从 Oxford 起家的 AI 基础设施公司；现在它不再只把自己描述成托管 GPU 云，而是总部位于 New York、建设并运营 AI
    数据中心的平台。公开资料显示，公司重心放在拿电、设计和建设数据中心，以及为前沿 AI 实验室、政府和企业运营大型专用算力集群。公司在 2026 年宣布完成 $830 million Series A，估值 $7.5
    billion，由 Situational Awareness 领投，并反复出现在 Anthropic 相关、与 Hut 8 和 TeraWulf
    绑定的基础设施项目里。业务看起来具有战略重要性，但公开披露的厚度仍明显跟不上它的野心规模。
