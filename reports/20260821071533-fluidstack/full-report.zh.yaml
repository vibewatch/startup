  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 卖的不是通用云，而是稀缺的 AI 基础设施容量。因此，相关市场边界从以 GPU
              为中心的训练和推理基础设施开始，再向外扩到让这些算力可用所需的相邻支出：数据中心主体和核心、高密度供电、液冷、网络结构、存储、集群编排，以及把这些资产转成预留或按需容量的商业结构。它不包括应用层 AI 软件、模型
              API，也不包括整个公有云算力市场，因为这些都在基础设施决策之后。现实中，买方并不是在一个巨大 TAM 里选择，而是在几条路径中取舍：采购友好型企业选超大规模云厂商托管的 AI
              基础设施；追求性价比预留集群的买方选一线新型云厂商；更窄场景由 Fluidstack 或 Voltage Park
              等专门供应商承接；当主权、信任或定制架构比弹性更重要时，买方会选择本地或混合部署。这个市场框定很关键，因为 Fluidstack 的价值不太由通用云支出决定，而由受电力、密度和部署速度约束的那部分 AI
              需求决定。
