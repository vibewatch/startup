    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起点与当前产品叙事
        blocks:
          - type: paragraph
            body: >-
              Fluidstack 的法律实体仍是英国的 FLUIDSTACK LTD，2017 年 9 月 28 日注册，曾用名 FLARE SOCIAL LTD；但公司自有渠道讲述的运营故事是，业务 2017 年诞生于
              Oxford University，如今从 New York 运营。官网已经不再主推简单的 GPU 租赁市场，而是称公司拿电、设计并建设数据中心，再为领先 AI
              实验室、政府和企业运营这些设施；公司还称目标是在约六个月内交付 GW 级算力，而行业常态是 18–24 个月。LinkedIn、2025 年 12
              月的总部迁移帖以及二级数据库都在强化同一件事：公司希望外界把它理解为一个由美国指挥中心驱动的 AI 基础设施平台，尽管部分数据库在总部地点上仍滞后，继续显示旧的 London
              坐标。对尽调而言，这种画像漂移本身重要：它说明公司的转向速度快过第三方数据供应商更新速度，因此身份和规模事实应先锚定一手来源，再参考数据库摘要。
