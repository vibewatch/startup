        - 在可靠性、网络和设施岗位招聘
        - 正常运行时间、任务成功率、事故严重程度
        - 具名旗舰工作负载持续出现可靠性故障
      - - 安全 / 信任
        - 同业基准存在，可复制
        - 审计完成、客户安全审查
        - 因信任 / 合规缺口丢失重大交易
      - - 竞争
        - 差异化仍可建立在速度和电力获取上
        - 赢单 / 输单原因和价格让步
        - 证据显示电力与速度优势并不真实，或无法货币化
    notes: 放弃触发点针对投资逻辑可能失效的具体路径，而不是泛泛的初创公司波动。
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR038
      - CR039
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 项目
      - 评估
      - 原因
    rows:
      - - 建议
        - 有条件参与 / 精选进入
        - 市场和交易对手强，但披露薄弱
      - - 置信度
        - 中-低
        - 收入、利润率和集中度仍不透明
      - - 风险评级
        - 高
        - 执行、融资和集中度风险呈非线性
      - - 估值立场
        - 上一轮估值合理偏贵
        - 7.5B 可以成立，但前提是拿出强执行证明
      - - 目标回报要求
        - 信息不透明，需要超额回报补偿
        - 当前进入价格依赖里程碑上行，而非公开财务证明
    notes: 建议反映的是战略吸引力被有限财务透明度抵消。
    claimRefs:
      - CV001
      - CV008
      - CV033
      - CV034
      - CV039
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 需要验证什么
    rows:
      - - 市场
        - AI 基础设施需求巨大，容量受限
        - TAM 再大，执行滑坡仍可能摧毁价值
        - 站点通电和已签需求
      - - 产品
        - 电力支撑的部署能力可以成为真实护城河
        - 功能趋同可能让产品商品化
        - 更快部署和更高可靠性的证据
      - - 客户
        - Anthropic 和 AI 原生标杆客户支撑质量
        - 一两个客户可能主导经济性
        - 集中度和续约排期
      - - 财务模型
        - 基础设施合同粘性强、质量高
        - 资本开支强度可能跑过利润率和现金生成
        - 毛利率、利用率、项目融资
      - - 竞争
        - 同业对比显示可以容纳多个赢家
        - 超大规模云厂商和披露更充分的新型云厂商会挤压条款
        - 赢单 / 输单数据和定价纪律
    notes: 反向逻辑主要是经披露折扣调整后的执行风险，而不是市场不存在。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV009
      - CV020
      - CV035
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 概率信号
      - 估值区间
      - 下行触发点
    rows:
      - - 乐观
        - Anthropic 相关项目转化为持久收入；更多园区按时落地；在单一旗舰买方之外开始多元化
        - 需要反复完成站点交付并拿出客户证明
        - 10-14B
        - 延误、集中度或融资压力
      - - 基准
        - 执行稳健，但披露仍有限；增长延续，但敞口集中
        - 与当前公开证据最一致
        - 6.5-8.5B
        - 多元化停滞或收入证明薄弱
      - - 悲观
        - 电力、融资或客户集中问题显示经济性弱于投资人假设
        - 旗舰项目任何重大滑坡都可能触发
        - 3.5-5.5B
        - 通电失败、救助性融资或最大客户走弱
    notes: 情景区间基于判断，并与里程碑达成挂钩，因为公开收入未披露。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类别
      - 估值背景
      - 收入背景
      - 隐含倍数 / 参照含义
      - 对 Fluidstack 的影响
    rows:
      - - CoreWeave
        - 公开市场新型云厂商
        - ~$23B IPO 估值
        - 2025 年收入 ~$5.13B、积压订单 $99.4B，Microsoft 集中度 67%
        - 基于 Sacra 估计，2025 年收入 ~4.5x
        - 显示规模化龙头有很大上行，但也有集中度和资本开支风险
      - - Lambda
        - 大型私有 / IPO 前新型云厂商
        - Sacra 给出的 2026 年估值 ~$5.9B
        - 2025 年收入估计 ~$760M
        - 2025 年收入 ~7.8x
        - 披露更透明、规模较小的同业定价低于 Fluidstack
      - - Crusoe
        - 能源优先的私有 AI 云
        - Sacra 给出的 late-2025 估值 >$10B
        - 2025 年收入估计 ~$500M，另有大规模 Abilene 项目融资
        - 2025 年收入估计 ~20x
        - 如果执行叙事够强，电力支撑的故事可以拿到溢价
      - - Fluidstack
        - 私有专业新型云厂商
        - Jan-2026 Series A 轮，7.5B
        - 收入未披露
        - 无法直接计算倍数
        - 需要按里程碑而不是公式化方式承销
      - - Anthropic 相关项目
        - 战略客户锚点，不是可比公司
        - 交易对手支出和基础设施承诺规模巨大
        - $50B 基础设施项目；合作伙伴站点有 245-2,295 MW 路径
        - 支撑需求，但本身不能直接支撑股权价值
        - 解释为什么投资人愿意为期权价值付费
    notes: 可比组合混合了公开和私有新型云厂商，以及一个战略锚点，因为 Fluidstack 缺少公开收入。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV021
      - CV022
    enumerationScope:
      coverage: sample
      basis: Sample of the most decision-relevant neocloud valuation anchors with public or semi-public valuation context.
  - id: TV005
    title: 投资逻辑破裂和放弃触发点表
    columns:
      - 触发点
      - 重要性
      - 行动
    rows:
      - - 旗舰站点反复延误
        - 电力与速度护城河可能只是幻觉
        - 下调评级或避免跟投
      - - Anthropic 集中度恶化且没有多元化
        - 单一账户依赖变得不可接受
        - 要求拿出新增大客户证明
      - - 主要站点通电前需要纾困融资
        - 暴露资本模型脆弱
        - 要求惩罚性条款，或直接退出
      - - 重大工作负载出现安全或可靠性事故
        - 削弱高端基础设施叙事
        - 控制措施验证前暂停尽调
      - - 无法证明收入质量
        - 高溢价私人市场倍数缺少依据
        - 不为不透明故事支付溢价
    notes: 这些触发点盯的是估值失效的具体路径，而不是一般性的初创公司波动。
    claimRefs:
      - CV030
      - CV031
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调清单
    columns:
      - 尽调问题
      - 重要性
    rows:
      - - 客户集中度与续约安排
        - 用来正确折价 Anthropic 及大客户风险
      - - 各站点已签收入、积压订单与利用率
        - 用来把估值锚定在真实经营证据上
      - - 项目融资与债务结构
        - 用来判断稀释风险和下行追索权
      - - 按园区成熟度拆分的毛利率
        - 用来检验增长是在创造价值还是消耗价值
      - - 旗舰站点部署时间线证据
        - 用来支撑电力获取速度溢价
      - - 旗舰客户之外多元扩张的证据
        - 用来支撑上行情景和估值倍数韧性
    notes: 如果管理层回答不了这些问题，估值应按偏贵处理，而不是视为合理。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV039
