      - number: '8.3'
        title: 乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              用情景分析，比假装存在一个精确倍数更诚实。乐观情景下，Fluidstack 证明 Anthropic 相关项目能转成持久收入，更多园区按时落地，公司开始更像 Crusoe 式的电力支撑执行故事，而不是资料单薄的
              GPU 经纪商；在这种结果下，一百亿美元出头的估值可以辩护。基准情景下，公司执行合格但透明度仍有限，当前 $7.5 billion
              估值大致合理，却谈不上明显便宜。悲观情景下，延期、客户集中或融资压力暴露出公司比投资人假设的更受项目风险牵制；那时合理价值可能压到上一轮以下。由于收入未披露，估值区间应由里程碑达成、合同证据和融资韧性驱动，而不是由看似精确的收入倍数驱动。
