              公开资料没有披露 Fluidstack 的完整内部架构，但从市场运行方式看，可能的参考设计很清楚。NVIDIA 的 HGX 和 DGX 平台构成标准多 GPU 构件；NVLink 支撑节点内高带宽
              scale-up；InfiniBand 及相关高性能网络支撑巨型 AI 集群的 scale-out；常见云模式则把 Kubernetes、Slurm
              和供应商自有控制平面组合起来，用于调度、可观测性和生命周期管理。CoreWeave 的 Mission Control 以及 Nebius 的公开计算文档，展示了成熟同行会围绕托管
              Kubernetes、机群生命周期、可观测性和 InfiniBand 集群公开什么。Fluidstack
              可能采用不同控制平面，但架构负担相似：它必须把昂贵且对故障敏感的硬件，转成稳定、租户可用，并且性能和安全都可接受的训练与推理服务。
