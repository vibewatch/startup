      - number: '8.2'
        title: 可比估值背景
        blocks:
          - type: paragraph
            body: >-
              可比公司分析两边都能讲。一方面，公开和半公开可比公司证明，这个行业能支撑很大的企业价值：CoreWeave 以约 $23 billion 估值上市，按 Sacra 说法，2025 年收入超过 $5
              billion；Crusoe 的 late-2025 估值超过 $10 billion，当时它正扩张能源优先的 AI 工厂模式；Sacra 估计 Lambda 估值接近 $5.9 billion，2025
              年收入约 $760 million。这些可比公司验证了，大型新云厂商在利润干净成熟之前，就可以获得数十亿美元估值。另一方面，这些公司每一家公开的财务背景都比 Fluidstack 现在更多。CoreWeave
              的积压订单和资本开支需求可见，Lambda 的定价和收入估计可分析，Crusoe 由电力支撑的建设直接连到具名项目和融资结构。因此，从头部估值看，Fluidstack 的 $7.5 billion
              标记落在合理同业区间内；但以审慎投资人通常想要的标准看，它应当有更大的披露折价。
