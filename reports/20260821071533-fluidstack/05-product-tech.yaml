  - - Scale-up interconnect
    - NVLink / NVSwitch
    - Needed for multi-GPU training efficiency within nodes
    - NVIDIA NVLink page
    - Exact topology and generation unknown
  - - Scale-out network
    - InfiniBand or equivalent AI fabric
    - Critical for large distributed training clusters
    - NVIDIA InfiniBand and networking pages; Nebius docs
    - Fluidstack fabric choice and oversubscription policy not public
  - - Cluster scheduler
    - Slurm or equivalent job scheduling
    - Coordinates long-running cluster workloads and reservations
    - Slurm overview; Nebius docs
    - Fluidstack scheduler stack not public
  - - Container orchestration
    - Kubernetes or managed variant
    - Supports services, control-plane components, and some workloads
    - Kubernetes overview; CoreWeave Mission Control
    - Exact Fluidstack control-plane design not public
  - - Observability / lifecycle
    - Fleet monitoring, node lifecycle, metrics, logging
    - Needed for reliability and supportability
    - CoreWeave Mission Control, NVIDIA networking software surfaces
    - No public Fluidstack observability detail
  - - Cooling and thermal management
    - Direct-to-chip liquid cooling and modular CDU infrastructure
    - Required for high-density next-gen AI racks
    - LiquidStack and JLL sources
    - Fluidstack’s exact cooling architecture not public
  - - Security / trust controls
    - IAM, network isolation, encryption, compliance process
    - Required for enterprise adoption
    - CoreWeave trust center, Voltage Park security, Azure AI infra
    - Fluidstack public trust detail remains sparse
  notes: The table separates likely market-standard building blocks from the specific design details that still require diligence.
