- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control area
  - Why it matters
  - Public market baseline
  - Fluidstack visibility
  - Diligence ask
  rows:
  - - Identity and access management
    - Limits operator and tenant access to sensitive clusters
    - CoreWeave federation-centric IAM; hyperscaler baseline
    - Low public detail
    - Request RBAC, SSO, and break-glass policies
  - - Tenant isolation
    - Prevents noisy-neighbor or cross-tenant leakage
    - CoreWeave single-tenant nodes; dedicated cluster norms
    - Implicit, not explicitly documented
    - Confirm dedicated vs shared boundaries by product
  - - Encryption and data handling
    - Protects training data and checkpoints
    - CoreWeave storage security and hyperscaler norms
    - Low public detail
    - Request encryption at rest/in transit and key-management model
  - - Compliance posture
    - Supports enterprise and regulated procurement
    - Voltage Park SOC 2 / ISO 27001 / HIPAA-eligible; cloud incumbents richer
    - Low public detail
    - Request audit reports, roadmap, and compensating controls
  - - Operational reliability
    - Long jobs fail expensively
    - Mission-control and observability examples from peers
    - Inferred from customer claims only
    - Request uptime, incident, and job-success metrics
  - - Safety and support model
    - Defines who intervenes when infrastructure degrades
    - Peer managed-service framing
    - Operationally implied but undocumented
    - Review support SLAs, escalation paths, and on-call design
  notes: Trust posture is a hard product requirement in AI infrastructure, not a marketing afterthought.
