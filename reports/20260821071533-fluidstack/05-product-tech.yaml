tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - What it does
  - Who uses it
  - Public evidence
  - Differentiation signal
  rows:
  - - Power and site control
    - Secures utility capacity and physical location for AI campuses
    - Infrastructure and deployment teams; customers indirectly
    - Fluidstack homepage, Anthropic program, NY/TX expansion posts
    - Potential core moat if it materially accelerates deployment
  - - GPU cluster infrastructure
    - Provides raw training and inference compute
    - AI labs and enterprise ML teams
    - Fluidstack public positioning and >100k GPUs under management claim
    - Commodity without speed, reliability, or contract advantage
  - - Network fabric
    - Connects GPUs into high-performance training and inference clusters
    - Platform engineers and distributed training workloads
    - Market-standard NVIDIA networking references; peer docs
    - Critical performance layer, but not unique by itself
  - - Storage and data path
    - Feeds checkpoints, datasets, and inference artifacts
    - Researchers, platform teams, inference ops
    - Peer platform examples such as CoreWeave storage and Nebius docs
    - Operational quality matters more than novelty
  - - Control plane / orchestration
    - Schedules jobs, provisions clusters, and manages lifecycle
    - Platform and infrastructure operators
    - Peer Mission Control, Slurm, Kubernetes, Nebius docs
    - Important product surface; Fluidstack specifics not public
  - - Operations, monitoring, and support
    - Keeps clusters reliable and usable over long jobs
    - Enterprise customers and frontier labs
    - Leadership hires and partner programs imply heavy ops component
    - Service quality is likely a major differentiator
  notes: Fluidstack’s “product” includes physical and software layers because customers buy usable capacity, not just hardware.
