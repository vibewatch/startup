- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer
  - Likely technology / pattern
  - Why it matters
  - Public support
  - Fluidstack-specific gap
  rows:
  - - Compute node
    - NVIDIA HGX/DGX-class multi-GPU systems
    - Defines density and baseline performance
    - NVIDIA HGX and DGX Cloud pages
