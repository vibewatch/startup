  title: Workflow / use-case table
  columns:
  - Use case
  - User
  - Payer
  - Workflow
  - Why Fluidstack fits
  - Operational requirement
  rows:
  - - Frontier-model training
    - Research infrastructure teams
    - Lab CFO / CTO / infra budgets
    - Provision thousands of GPUs, run long distributed jobs
    - Need fast access to large dedicated clusters
    - High-bandwidth fabric, stable scheduling, strong site ops
  - - Large-scale fine-tuning
    - Applied AI platform teams
    - Enterprise or lab platform budgets
    - Spin up reserved clusters for weeks to months
    - Needs dedicated capacity without building internal campuses
    - Reservation flexibility and workload orchestration
  - - Inference at scale
    - Serving and platform teams
    - Product or central infra budget
    - Deploy steady-state or burst model-serving clusters
    - Can use dedicated or semi-dedicated AI capacity
    - Operational reliability, observability, and security
  - - Sovereign or regulated AI deployments
    - Government or regulated enterprises
    - Public-sector or central IT budgets
    - Need region and control assurance plus compute
    - Campus and contract flexibility can matter more than self-serve
    - Compliance, auditability, and clear responsibility boundaries
  - - Enterprise experimentation to production
    - Smaller ML teams expanding usage
    - Innovation / IT budgets
    - Start on smaller footprints then expand into reserved capacity
    - Managed path from prototype to bigger clusters
    - Support, migration, and scheduling ease
  - - Partner-campus deployments
    - Joint development with site or power partners
    - Mixed sponsor and customer economics
    - Integrate partner power, site, and operations into one service
    - Lets Fluidstack scale faster than owning every asset alone
    - Contract management and deployment integration
  notes: Workflow lens keeps the chapter focused on what customers are trying to accomplish, not only on hardware nouns.
