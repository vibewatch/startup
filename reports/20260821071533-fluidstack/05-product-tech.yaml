chapter:
  number: 5
  title: Product & Technology
  summary: Fluidstack’s product is an AI infrastructure operating stack that starts with power and data-center delivery and ends with usable large-scale training and inference clusters. Public evidence supports the broad workflow and market-standard technical dependencies—NVIDIA multi-GPU platforms, high-performance fabrics, orchestration, observability, and liquid cooling—but leaves meaningful gaps around Fluidstack’s exact control plane, topology, and security implementation.
sections:
- id: section-1
  title: Product definition in workflow terms
  body: 'Fluidstack’s product is best understood as an AI infrastructure stack rather than as a single software SKU. The company’s public site emphasizes acquiring power, building and operating data centers, and delivering exa-scale compute; its leadership post says it has more than 100,000 GPUs under management and serves multi-thousand-GPU training and inference workloads. In workflow terms, the product begins before software: site control, utility capacity, cooling, racks, network fabric, and hardware procurement are all part of what the customer is buying. Only after those layers exist does Fluidstack expose the cloud-like experience of provisioning and operating clusters. This matters because the “product” should be underwritten partly like infrastructure and partly like platform operations. The customer is not only buying compute cycles; they are buying time-to-capacity, reliability at scale, and a managed path from power to usable AI clusters.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE016
  - CE017
  tableRefs:
  - TE001
  - TE002
