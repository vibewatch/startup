- id: TI004
  title: Capital adequacy table
  columns:
  - Line item
  - Public value / status
  - Source
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - Not publicly disclosed
    - No cash balance found in reviewed sources
    - low
    - Cannot assess runway without actual cash
    - Provide audited or board-approved cash position
  - - Monthly burn
    - Not publicly disclosed
    - No public burn guidance found
    - low
    - Needed to evaluate financing pace and urgency
    - Provide monthly cash burn with capex separated from opex
  - - Runway months
    - Not publicly disclosed
    - Derived only after cash and burn are known
    - low
    - Critical for underwriting next-round timing
    - Provide base, upside, and downside runway scenarios
  - - Planned use of funds
    - $830M Series A announced for scaling AI infrastructure and deployment capacity
    - Fluidstack Series A announcement
    - medium
    - Indicates equity is funding buildout, not only working capital
    - Provide exact allocation by site, hardware, hiring, and contingencies
  - - Next-round trigger
    - Likely tied to project finance, new site commitments, and customer precommits rather than pure ARR milestones
    - Inferred from partner MW scale and market capex needs
    - medium
    - Infrastructure businesses refinance around construction and utilization milestones
    - Provide financing roadmap, debt targets, and equity backstop
  - - Debt / project-finance obligations
    - No charges registered on the UK entity; broader project-finance obligations undisclosed
    - Companies House charges page and partner disclosures
    - medium
    - Absence of UK charges does not mean absence of debt elsewhere
    - Provide debt structure, SPVs, guarantees, and covenant package
  notes: 'This table stays conservative: the absence of public figures is itself a diligence finding.'
