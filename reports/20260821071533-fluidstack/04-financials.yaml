- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue per deployed GPU / MW
    - 'null'
    - low
    - Defines monetization efficiency of scarce infrastructure
    - Provide monthly revenue by MW and by deployed GPU cohort
  - - Utilization rate
    - 'null'
    - low
    - Underutilization can destroy margins in capital-heavy models
    - Provide booked vs energized vs actively used capacity by month
  - - Power cost per MWh
    - 'null'
    - low
    - Primary variable input for high-density AI campuses
    - Show power contracts, escalation clauses, and behind-the-meter arrangements
  - - GPU depreciation / lease burden
    - 'null'
    - low
    - Determines whether long-term contracts actually earn attractive gross margin
    - Show hardware ownership mix, lease terms, and depreciation schedules
  - - Gross margin
    - 'null'
    - low
    - Core quality metric for any infrastructure business
    - Provide gross margin by product line and by campus maturity
  - - Support and operations cost per MW
    - 'null'
    - low
    - Tests operating leverage of build-operate model
    - Show site labor, maintenance, and remote-ops cost curves
  - - Working capital intensity
    - 'null'
    - low
    - Customer payment timing versus vendor commitments affects cash need
    - Show payment terms, deposits, and capex precommitment schedule
  - - Customer concentration
    - 'null'
    - low
    - A single anchor counterparty can dominate risk
    - Provide revenue share, backlog share, and renewal timing by top account
  notes: Nearly every critical unit-economics metric remains private.
