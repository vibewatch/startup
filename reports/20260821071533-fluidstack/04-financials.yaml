callouts:
- calloutType: insight
  title: Capacity is the clearest public financial proxy
  body: Because Fluidstack does not publish revenue or margin, the best public underwriting anchors are megawatts under program, contract tenor, and the capital implied by partner infrastructure deals.
  claimRefs:
  - CI005
  - CI007
  - CI013
  - CI032
- calloutType: risk
  title: Low disclosure forces project-finance underwriting assumptions
  body: No public cash, burn, margin, or debt data exists, so underwriting should assume meaningful hidden financing dependency until management proves otherwise.
  claimRefs:
  - CI015
  - CI023
  - CI029
  - CI036
- calloutType: risk
  title: Equity alone is unlikely to fund gigawatt ambitions
  body: Even a very large venture round can be small relative to MW-scale campus pipelines once power, construction, and hardware are layered together.
  claimRefs:
  - CI013
  - CI018
  - CI022
  - CI028
