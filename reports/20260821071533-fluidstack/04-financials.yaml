- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  - Implication
  rows:
  - - 'Fluidstack: no public list price observed'
    - Unknown realized pricing
    - Actual contract economics undisclosed
    - Official surfaces / partner announcements
    - Financial diligence must rely on contract review, not website pricing
  - - Lambda self-serve instances from $0.50/hr
    - List price
    - Region, GPU type, storage, and utilization effects remain
    - Lambda pricing
    - Low-end benchmark for commodity or burst capacity
  - - Lambda reserved B200 roughly $8.87-$9.86 per GPU-hour
    - List price for reserved cluster ranges
    - Reserved discounts and broader package still negotiable
    - Lambda pricing
    - Public anchor for premium reserved AI capacity
  - - 'CoreWeave: sales-led pricing page with no simple public unit price'
    - Realized pricing opaque
    - Bespoke contracting likely hides meaningful discounting
    - CoreWeave pricing
    - Large specialist peers may preserve margin through opaque quoting
  - - 'Voltage Park: reserve and on-demand packaging, but exact H100 price gated'
    - Partial list framing
    - No-hidden-fees claim not equal to published rate card
    - Voltage Park pricing
    - Signals TCO competition without full transparency
  - - AWS Capacity Blocks and hyperscaler VM pricing
    - Complex published list prices
    - Reservations, storage, egress, and enterprise discounts drive actual TCO
    - AWS / Azure / Google / Oracle pricing pages
    - Incumbents are financially comparable only through landed-cost modeling
  notes: List price is a weak proxy for realized revenue in AI infrastructure.
