tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Dedicated AI compute contracts
    - Reserved GPU and cluster capacity sold to labs and enterprises
    - GPU-hours / cluster-months / term contracts
    - Publicly implied, but revenue undisclosed
    - Potentially high if contracted and prepaid
    - Request top-10 customer contracts by term, prepayment, and SLA
  - - Data-center build / operate services
    - Design, deployment, and operation of customer or partner campuses
    - MW under management / project fees
    - Publicly implied by company site and partner releases
    - Could be high quality if attached to long-term counterparties
    - Separate pure services revenue from resale compute revenue
  - - Partner-site infrastructure programs
    - Fluidstack-operated clusters at Hut 8 or TeraWulf-linked sites
    - MW / campus / term agreement
    - Publicly validated at ecosystem level, but direct take-rate unknown
    - Quality unknown without contract economics
    - Obtain Fluidstack’s actual revenue share and cost responsibility
  - - Enterprise reserved inference / training
    - Dedicated or semi-dedicated enterprise deployments
    - Cluster reservation / monthly minimums
    - Likely active, but not publicly quantified
    - Quality depends on term, utilization, and expansion rights
    - Show cohort retention and expansion by customer type
  - - Legacy cloud / marketplace style revenue
    - Older self-serve or opportunistic capacity sales
    - Usage revenue
    - Appears strategically de-emphasized
    - Potentially lower quality and more price-sensitive
    - Quantify share of revenue from non-contracted or burst workloads
  notes: Public evidence supports the shape of revenue streams, not the numeric mix.
