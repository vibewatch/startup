- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue and ARR / backlog
    - Prevents valuation sanity check and customer-quality analysis
    - Request audited revenue by product line plus signed backlog by term
  - - Gross margin by campus maturity
    - Prevents testing whether early sites dilute or improve economics
    - Request gross margin by energized site and by customer type
  - - Utilization and ramp curves
    - Prevents testing fixed-cost absorption
    - Review monthly capacity cohort tables from energization to steady state
  - - Cash, burn, runway
    - Prevents financing adequacy assessment
    - Obtain monthly cash waterfall and 18-month liquidity plan
  - - Debt, guarantees, and project finance
    - Prevents understanding downside and recourse
    - Review all debt agreements, SPV structures, and sponsor guarantees
  - - Customer concentration and counterparty quality
    - Prevents assessing dependence on Anthropic or a few labs
    - Provide concentration schedule, credit exposure, and renewal calendar
  - - Capex pipeline by site
    - Prevents estimating future equity need
    - Review site-by-site capex budget, committed spend, and contingency
  - - Collection terms and deposits
    - Prevents understanding working-capital support from customers
    - Review invoice terms, deposits, and prepayment schedule
  notes: The financial blind spots are concentrated exactly where infrastructure underwriting normally needs the most proof.
  claimRefs:
  - CI015
  - CI024
  - CI029
  - CI036
