company:
  name: Fluidstack
chapter:
  number: 4
  title: Financials
  summary: 'Fluidstack’s economics are public only in outline. Official and partner sources support an infrastructure-style revenue model, a January 2026 $830M Series A at $7.5B valuation, repeated 2026 share-allotment filings, and ecosystem programs measured in hundreds of megawatts and potentially billions of contracted downstream revenue. What remains missing are the metrics that decide underwriting quality: revenue, burn, margin, utilization, debt, and customer concentration.'
sections:
- id: section-1
  title: Revenue model and public traction evidence
  body: 'Fluidstack’s public financial story is dominated by capacity, not classic SaaS metrics. The company sells AI infrastructure and therefore likely recognizes revenue through a mix of reserved compute contracts, dedicated cluster operations, and campus or partner-site infrastructure services rather than through simple monthly software subscriptions. Public evidence supports this framing: the corporate site emphasizes acquiring power, building data centers, and operating clusters; the Series A announcement frames the company as an infrastructure builder; and partner releases with Hut 8 and TeraWulf tie Fluidstack to megawatt-scale deployments and long-duration counterparties. What remains missing is the core underwriting data—revenue, gross margin, utilization, burn, cash, and contract concentration. As a result, the most defensible revenue view is structural rather than numeric: Fluidstack appears designed to monetize committed AI capacity and related operating services, but outside
    observers cannot yet distinguish between high-quality contracted infrastructure revenue and lower-visibility resale or transient cloud demand.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI005
  - CI007
  - CI008
  - CI024
  - CI025
  - CI031
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: section-2
  title: Pricing visibility and unit-economics structure
  body: Pricing is only partially observable. Unlike Lambda, which publishes self-serve and reserved B200 pricing, Fluidstack does not disclose public list rates. CoreWeave and Voltage Park also keep most realized pricing private, which suggests that large AI infrastructure deals remain highly bespoke and negotiated around duration, volume, egress, storage, and support rather than a single clean sticker price. That matters for financial quality because list-price comparisons can overstate actual revenue quality or gross margin. The same GPU hour can be sold as burst capacity, a multi-month reserved cluster, or part of a longer infrastructure relationship tied to site development and operations. In the best case, Fluidstack monetizes higher-quality, longer-duration contracts that begin to resemble infrastructure leasing and managed services rather than volatile spot cloud revenue. In the worst case, it bears upfront capex while still competing in a price-sensitive market shaped by transparent
    specialists such as Lambda and by hyperscaler discounting.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI020
  - CI026
  - CI027
  - CI033
  tableRefs:
  - TI002
  - TI003
  figureRefs:
  - FI002
- id: section-3
  title: Capital adequacy and financing dependency
  body: 'Capital intensity is the central financial variable. The $830 million Series A is large in startup terms but small relative to gigawatt-scale AI buildout. Companies House filing history shows repeated 2026 share-allotment events and governance changes, which is consistent with a heavily financed scaling year rather than a quiet post-seed operating phase. TeraWulf’s July 2026 release is especially revealing: Anthropic’s 20-year lease at a 401 MW Kentucky campus is expected to generate about $19 billion of contracted revenue over the initial term, while TeraWulf separately said a Fluidstack-led investor group bought its 50.1% interest in the 168 MW Abernathy JV after approximately $450 million had already been invested. Hut 8 then outlined a path from 245 MW to as much as 2,295 MW of additional AI infrastructure with Fluidstack-operated clusters. These are ecosystem-scale numbers, not proof of Fluidstack’s booked revenue, but they demonstrate the magnitude of capital, counterparty,
    and project-finance exposure surrounding the company’s operating model.'
  claimRefs:
