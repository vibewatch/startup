- id: section-3
  title: Pricing, packaging, and switching behavior
  body: 'Packaging and distribution matter almost as much as raw hardware. Lambda is the most useful public benchmark because it publishes both low-end self-serve pricing and reserved B200 cluster prices, while CoreWeave and many others keep realized pricing behind sales processes. Voltage Park partially bridges that gap by disclosing contract shape, zero-hidden-cost positioning, and reserve terms while still gating exact price behind contact. This asymmetry is strategically important: opaque pricing can preserve margin in bespoke deals but weakens external proof of competitiveness. Buyers also multi-home for good reason. Hyperscalers keep the trust perimeter, IAM, storage, and procurement defaults; specialists offer faster access, denser interconnects, more flexible reservations, and sometimes lower landed cost for dedicated workloads. The switching cost is therefore real but not absolute: data migration, orchestration, security review, and reservation commitments slow movement, yet sophisticated
    buyers can and do split workloads across multiple providers when supply, latency, or price changes.'
