  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Signed quotes, discount schedules, egress terms, and utilization-linked pricing across Fluidstack, CoreWeave, Crusoe, Lambda, and Voltage Park.
    whyItMatters: Public list pages reveal packaging, not the real prices that determine win rates and margins.
    diligencePath: Collect customer proposals and executed order forms for comparable cluster sizes.
    relatedQuestionRefs:
    - QP012
    - QP024
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: time-to-capacity
    missingEvidence: Provider-specific evidence of actual deployment lead times from signed contract to usable cluster.
    whyItMatters: Fluidstack’s power-first moat is only durable if it produces a measurably faster delivery outcome than peers.
    diligencePath: Review deployment timelines for the last ten major customer ramps across peers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: utilization-and-retention
    missingEvidence: Utilization, renewal, and churn data for reserved AI-capacity customers.
    whyItMatters: Competitive durability depends on whether customers stay after capacity becomes more available elsewhere.
    diligencePath: Ask for cohort-level renewal data and attach churn reasons to competitor substitutions.
    relatedQuestionRefs:
    - QP024
  - type: conflicting-data
    severity: minor
    topic: specialist-vs-hyperscaler-tco
    missingEvidence: Independent apples-to-apples TCO benchmark covering storage, egress, idle overhead, and engineering burden.
    whyItMatters: Public comparisons often cherry-pick one SKU or ignore ancillary costs.
    diligencePath: Run a standardized workload benchmark and landed-cost model across at least four providers.
    relatedQuestionRefs:
    - QP012
  - type: missing-source
    severity: minor
    topic: crusoe-public-pricing
    missingEvidence: A public Crusoe pricing surface comparable to Lambda or Voltage Park.
    whyItMatters: Without it, Crusoe can be compared on positioning and architecture but not with equal price granularity.
    diligencePath: Request current rate cards or customer quotes directly.
    relatedQuestionRefs:
    - QP011
