  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: site-level-risk-controls
    missingEvidence: Site-by-site permitting status, utility queue position, power-delivery schedule, environmental reviews, and construction safety metrics.
    whyItMatters: Power and permitting delay are the master risks in the model, yet the public record is coarse.
    diligencePath: Obtain site development tracker, utility correspondence, and HSE reporting by campus.
    relatedQuestionRefs:
    - QR002
    - QR022
    - QR025
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: critical
    topic: capital-structure-and-finance
    missingEvidence: Debt, project-finance, covenant, guarantee, and liquidity documentation across the full operating structure.
    whyItMatters: Financing opacity can turn operational slippage into existential risk before outsiders can see it.
    diligencePath: Review all debt documents, SPV structures, cash balances, and base-case runway models.
    relatedQuestionRefs:
    - QR011
    - QR023
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-and-partner-concentration
    missingEvidence: Revenue, backlog, and capacity concentration by customer and by site partner.
    whyItMatters: A few programs likely dominate the risk profile, but public disclosures do not quantify that dominance.
    diligencePath: Map top customers and top partners to revenue share, MW share, and renewal timing.
    relatedQuestionRefs:
    - QR005
    - QR006
    - QR025
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-and-reliability-metrics
    missingEvidence: Incident history, uptime, job-success, audit results, and customer security-review outcomes.
    whyItMatters: Operational maturity and trust are central risk mitigants, but public proof is sparse.
    diligencePath: Request SLO dashboards, incident postmortems, and recent customer security questionnaires.
    relatedQuestionRefs:
    - QR010
    - QR017
    - QR021
    - QR025
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: people-and-tooling-maturity
    missingEvidence: Org-chart depth, attrition, internal tooling coverage, and escalation ownership across network, compute, and facilities teams.
    whyItMatters: Execution failure can arise from team structure as much as from market conditions.
    diligencePath: Review operating cadence, staffing plans, on-call rotations, and tooling roadmap.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR025
    relatedTableRefs:
    - TR004
