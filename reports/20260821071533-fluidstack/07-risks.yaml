    - Repeated multi-quarter power slippage on flagship programs
  - - Customer concentration
    - Potential to diversify into enterprise and sovereign buyers
    - Share of backlog from top customer
    - Top-customer slowdown or renegotiation without replacement demand
  - - Capital adequacy
    - Large Series A and staging of legal financings
    - Cash runway, project-finance closings, site-level capex
    - Need for rescue financing before flagship sites energize
  - - Operational maturity
    - Hiring across reliability, networking, and facilities
    - Uptime, job success, incident severity
    - Persistent reliability failures on named flagship workloads
  - - Security / trust
    - Peer baselines exist and can be copied
    - Audit completion, customer security reviews
    - Loss of material deal due to trust/compliance gap
  - - Competition
    - Differentiation can still rest on speed and power access
    - Win/loss reasons and price concessions
    - Evidence that power-speed advantage is not real or not monetizable
  notes: Kill triggers are designed to catch the specific ways the thesis can fail, not generic startup volatility.
