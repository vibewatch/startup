evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-a-cap-table
    missingEvidence: >-
      Full Series A syndicate, ownership percentages, liquidation preferences, board rights, and any secondary-sale
      component.
    whyItMatters: >-
      The public round headline is clear, but governance and dilution cannot be underwritten from lead-investor
      disclosure alone.
    diligencePath: Request the post-close cap table, financing documents, and board consents from management.
