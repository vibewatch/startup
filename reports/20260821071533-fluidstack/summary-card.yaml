  topStrengths:
    - Powerful market timing inside the AI infrastructure and power-constrained compute buildout.
    - Strong strategic counterparty evidence through Anthropic, Hut 8, and TeraWulf-linked programs.
    - Public positioning has clearly evolved beyond brokered GPU capacity toward owned or controlled infrastructure.
    - The $830M Series A provides meaningful balance-sheet support and validates investor demand for the story.
    - Named AI-native logos suggest relevance to some of the most compute-intensive workloads in the market.
  topRisks:
    - Public sources still do not disclose revenue, gross margin, utilization, burn, runway, or debt structure.
    - Anthropic and a small number of flagship accounts may represent outsized customer concentration.
    - The model is capital intensive and highly exposed to power delivery, construction, and financing execution.
    - Hyperscalers and better-disclosed neocloud peers can pressure pricing and contract terms.
    - Current valuation already assumes meaningful execution proof that the public record does not yet fully show.
  unresolvedGaps:
    - Direct revenue, backlog, utilization, gross margin, burn, and liquidity data.
    - Customer concentration, renewal timing, and share-of-wallet by flagship account.
    - Debt, SPV, covenant, guarantee, and project-finance structure for major campuses.
    - Verified energization and go-live timelines for flagship sites.
    - Full board, ownership, and investor-rights visibility after the 2026 financing.
