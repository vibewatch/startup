  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-a-cap-table
    missingEvidence: Full Series A syndicate, ownership percentages, liquidation preferences, board rights, and any secondary-sale component.
    whyItMatters: The public round headline is clear, but governance and dilution cannot be underwritten from lead-investor disclosure alone.
    diligencePath: Request the post-close cap table, financing documents, and board consents from management.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Full official board roster, observer rights, committee structure, and confirmed founder role titles beyond the current executive bench.
    whyItMatters: Public governance visibility is thin, so key-person dependence and control analysis cannot rely only on secondary databases.
    diligencePath: Request the current board deck, board and observer list, signed consents, and an org chart showing founder and executive responsibilities.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current ARR, gross margin, utilization, debt load, and customer concentration by revenue.
    whyItMatters: Capital intensity and valuation cannot be judged rigorously without operating economics and balance-sheet leverage.
    diligencePath: Request management financials, cluster utilization by campus, debt schedules, and top-customer concentration.
    relatedQuestionRefs:
    - QO017
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A reconciled employee count including full-time staff, contractors, and site-development personnel.
    whyItMatters: Public signals conflict and obscure whether operating scale matches the company’s buildout claims.
    diligencePath: Obtain HR roster, monthly headcount bridge, and contractor census by function and geography.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: europe-project-status
    missingEvidence: Current status of the French and broader European projects referenced in early 2025 announcements.
    whyItMatters: If Europe was slowed or abandoned, execution risk and geographic strategy look materially different from the announcement layer.
    diligencePath: Request campus-by-campus status, capital committed, and reasons for any paused or cancelled projects.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: anthropic-buildout-ownership
    missingEvidence: Site-by-site ownership, financing, chip mix, and commissioning status for the Anthropic-related buildout.
    whyItMatters: The company’s valuation is heavily tied to a multi-year infrastructure plan whose economics and control points remain only partly public.
    diligencePath: Review signed customer MSAs or leases, SPV structures, site budgets, utility agreements, and live commissioning trackers.
    relatedQuestionRefs:
