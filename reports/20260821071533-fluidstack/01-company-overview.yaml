- id: section-2
  title: Founders, leadership bench, and governance visibility
  body: 'Public founder and governance disclosure is uneven but directionally clear. Gary Wu is identified on current official materials as CEO and co-founder, while César Maklary is identified as co-founder and president. Tracxn adds Jamie Cox as co-founder and chief strategy officer and reports an active three-person board including Peixian Wu, César Maklary, and independent director Stephane Fisch, but those board details are not reproduced on Fluidstack’s own site and therefore should be treated as medium-confidence secondary evidence rather than settled primary fact. What is primary is the February 2025 operating-bench expansion: Rob Perdue joined as COO from The Trade Desk, Dan Carpenter came in from AWS/Omniva to run sales, Mike McDonald came from hyperscaler and Crusoe GPU-cloud roles to lead product and engineering, and Katherine Ollerhead joined as general counsel from Canonical. The hiring mix says a great deal about where management attention sits: scale delivery, revenue, productization,
    and regulatory and commercial infrastructure rather than pure marketplace experimentation. Key-person dependence remains high around Wu and Maklary because they anchor both the frontier-lab narrative and the buildout pace that underwrites the valuation.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO023
  tableRefs:
  - TO002
- id: section-3
  title: Funding, counterparties, and strategic positioning
  body: 'The capital story is unusually strong for a company still private and relatively opaque. Fluidstack said its Series A closed in January 2026 and was announced publicly on 20 July 2026 at $830 million and a $7.5 billion valuation, led by Situational Awareness, the fund founded by former OpenAI researcher Leopold Aschenbrenner. Public announcements do not name the full investor list; secondary databases mention Nat Friedman and describe other participants only generically, so the round is well supported on amount, timing, and lead but not on ownership detail. Strategic counterparties matter as much as equity investors: Anthropic is the anchor workload partner behind the $50 billion U.S. infrastructure announcement; Hut 8 and TeraWulf expand the power-and-campus footprint; and Macquarie provides a financing template for European GPU deployments secured by the hardware itself. This is why Fluidstack should be read less as a conventional cloud startup and more as a hybrid of data-center
    developer, compute operator, and structured-finance vehicle. The valuation rests on the belief that this partner web can keep turning land, power, GPUs, and customer demand into contracted infrastructure faster than incumbents.'
  claimRefs:
