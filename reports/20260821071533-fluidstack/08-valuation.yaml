- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Action
  rows:
  - - Flagship site delays slip repeatedly
    - Power-speed moat may be illusory
    - Re-rate downward or avoid follow-on
  - - Anthropic concentration worsens without diversification
    - Single-account dependence becomes unacceptable
    - Require proof of new large customers
  - - Rescue financing before major sites energize
    - Signals capital model weakness
    - Demand punitive terms or step away
  - - Security or reliability incident on major workload
    - Undercuts premium infrastructure claim
    - Pause diligence until controls proven
  - - Revenue quality cannot be demonstrated
    - No basis for premium private multiple
    - Do not pay up for opaque story
  notes: These triggers focus on the specific ways the valuation can fail, not on general startup volatility.
  claimRefs:
  - CV030
  - CV031
  - CV036
  - CV037
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Why it matters
  rows:
  - - Customer concentration and renewal schedule
    - Needed to discount Anthropic and top-customer risk properly
  - - Booked revenue, backlog, and utilization by site
    - Needed to tie valuation to real operating evidence
  - - Project-finance and debt structure
    - Needed to understand dilution and downside recourse
  - - Gross margin by campus maturity
    - Needed to test whether growth creates or destroys value
  - - Deployment timeline proof for flagship sites
    - Needed to justify power-speed premium
  - - Evidence of diversified expansion beyond flagship logos
    - Needed to support upside case and multiple resilience
  notes: If management cannot answer these asks, the valuation should be treated as rich rather than fair.
