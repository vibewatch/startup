    - Feature convergence may commoditize the offer
    - Proof of faster deployment and better reliability
  - - Customers
    - Anthropic and AI-native logos support quality
    - One or two customers may dominate economics
    - Concentration and renewal schedule
  - - Financial model
    - Infrastructure contracts can be sticky and high quality
    - Capex intensity can outrun margin and cash generation
    - Gross margin, utilization, project finance
  - - Competition
    - Peer comps show room for multiple winners
    - Hyperscalers and better-disclosed neoclouds can squeeze terms
    - Win/loss data and pricing discipline
  notes: The anti-thesis is primarily about disclosure-adjusted execution risk, not about market absence.
