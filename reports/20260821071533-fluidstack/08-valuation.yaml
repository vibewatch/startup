- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Category
  - Valuation context
  - Revenue context
  - Implied multiple / read-through
  - Implication for Fluidstack
  rows:
  - - CoreWeave
    - Public neo-cloud
    - ~$23B IPO valuation
    - ~$5.13B 2025 revenue, $99.4B backlog, 67% Microsoft concentration
    - ~4.5x 2025 revenue on Sacra estimates
    - Shows large upside for scaled leaders but also concentration and capex risk
  - - Lambda
    - Large private / pre-IPO neo-cloud
    - ~$5.9B 2026 valuation on Sacra
    - ~$760M 2025 revenue estimate
    - ~7.8x 2025 revenue
    - A more transparent sub-scale peer prices below Fluidstack
  - - Crusoe
    - Private energy-first AI cloud
    - '>$10B late-2025 valuation on Sacra'
    - ~$500M 2025 revenue estimate and massive Abilene project financing
    - ~20x 2025 revenue estimate
    - Power-backed story can command premium if execution narrative is strong
  - - Fluidstack
    - Private specialty neocloud
    - 7.5B Jan-2026 Series A
    - Revenue undisclosed
    - Direct multiple not possible
    - Requires milestone-based rather than formulaic underwriting
  - - Anthropic-linked program
    - Strategic customer anchor, not a comp
    - Counterparty spending and infrastructure commitments are enormous
    - $50B infrastructure program; partner sites with 245-2,295 MW path
    - Supports demand but not direct equity value alone
    - Explains why investors pay for option value
  notes: Comparable set mixes public and private neoclouds plus one strategic anchor because Fluidstack lacks public revenue.
