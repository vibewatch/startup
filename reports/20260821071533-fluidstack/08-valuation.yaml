- id: section-2
  title: Comparable valuation context
  body: 'Comparable analysis cuts both ways. On one hand, public and semi-public comparables show that the sector can support very large enterprise values: CoreWeave went public around $23 billion and, according to Sacra, generated over $5 billion of 2025 revenue; Crusoe’s late-2025 valuation exceeded $10 billion as it scaled an energy-first AI-factory model; and Sacra places Lambda near a $5.9 billion valuation on roughly $760 million of 2025 revenue. These comparables validate that large neoclouds can command multibillion-dollar values well before they become cleanly profitable. On the other hand, each of those comps also had more public financial context than Fluidstack currently does. CoreWeave’s backlog and capex needs are visible, Lambda’s pricing and revenue estimates are analyzable, and Crusoe’s power-backed buildout is directly linked to named projects and funding structures. Fluidstack’s $7.5 billion mark therefore sits in a reasonable peer band on headline valuation, but at a
    weaker disclosure discount than a cautious investor would normally want.'
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
