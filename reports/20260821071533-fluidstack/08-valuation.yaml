  - TV003
  figureRefs:
  - FV003
- id: section-4
  title: Recommendation and final diligence asks
  body: 'The recommendation is therefore conditional. Fluidstack is not a simple avoid—the company has genuine strategic position, market timing, and counterparties that could support an exceptional outcome. But it also does not yet merit blind trust at its current price. Investors should underwrite it with medium-to-low confidence, require unusually deep diligence on revenue quality, concentration, and project finance, and seek terms that recognize execution and disclosure risk. If management can show durable contracted revenue, diversified customer expansion beyond Anthropic, and credible site-delivery data, the Series A valuation may ultimately prove conservative. If not, the current mark could look aggressive relative to less opaque peers. The valuation stance is therefore selective rather than enthusiastic: participate only if the remaining diligence asks resolve in the company’s favor or if entry terms compensate for the opacity. That keeps upside open while still respecting the asymmetric
    downside of opaque infrastructure underwriting.'
