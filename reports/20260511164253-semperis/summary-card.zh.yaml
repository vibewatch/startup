summary:
  headline: >
    Semperis 是 Active Directory 与 Entra ID 领域最成熟的身份韧性平台，ARR 已超 $100M、企业客户逾 1,000 家，且在 AD 场景有深厚护城河；但按约 10x ARR 计的 $1B+
    估值已经押注后续高增长，再叠加 Microsoft 捆绑、财务不透明，以及 CrowdStrike 和 SentinelOne 的平台整合压力，现阶段更适合继续研究，而非直接买入。
