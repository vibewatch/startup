      - [Document extraction and matching, "Yes; PDFs, scans, bank statements, matching", "Document Intelligent Agent and testing agents presented", "Manual or custom", "CurateSuite; Caseware"]
      - [Source-linked traceability, "Yes; official release says every value links to evidence", "Reviewable and defensible output claimed", "Manual links or custom controls", "DataSnipper official; Caseware"]
      - [Disclosure review against IFRS or GAAP, "Disclosure Agents announced", "Disclosure Checklist Agent listed", "Manual checklist or custom", "DataSnipper PR; Caseware"]
      - [Full engagement context, "Not established as an end-to-end system of record", "Yes; full engagement and four phases presented", "Depends on internal architecture", "Caseware; DataSnipper comparison"]
      - [Human review and governance, "Review-and-approve workflow described", "Governed architecture and explicit authority described", "Depends on controls and staffing", "Toolradar; Caseware; PCAOB"]
      - [Public list pricing, "No; custom pricing reported", "Not retained in assigned evidence", "Labor and build costs are buyer-specific", "CurateSuite; Toolradar"]
      - [Data residency or privacy controls, "Regional data residency described for UpLink; scope of all products unknown", "Governed architecture claimed; detailed residency not retained", "Buyer-controlled but costly to implement", "IDP Software; Caseware; PCAOB"]
      - [Documented independent accuracy benchmark, "Not found in assigned evidence", "Vendor time savings only", "Would require buyer test", "DataSnipper official; Caseware; PCAOB"]
    notes: "Cells state documented capabilities or unknowns from assigned sources; blank or unavailable performance benchmarks are not inferred."
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Option, Price or contract model, Included capabilities or workflow, Discount or unknowns, Competitive implication]
    rows:
      - [DataSnipper Start, Custom; no public list price, "Core extraction, matching, version comparison, comments, SSO described", "Realized price, seat minimums, and discounts unknown", "Low-friction entry can preserve Excel workflow but pricing cannot be benchmarked"]
      - [DataSnipper Accelerate, Custom; no public list price, "Start plus Excel Agents, Agent Builder, Agent Templates, DocuMine, AI Extractions, integrations", "AI usage limits and overages unknown", "AI upsell creates expansion path but increases cost uncertainty"]
      - [DataSnipper Elevate, Contact sales, "Accelerate plus export, templates, retention, directory sync, external guest access, premium support", "Enterprise terms and implementation services unknown", "Governance features target larger deployments and may raise switching cost"]
      - [Caseware Verity, Contact or enterprise sale; public price not retained, "Agents across prepare, plan, evaluate, and report; methodology-native workflow", "Vendor-reported savings are not a price or TCO comparison", "Broader platform scope can justify higher contract value if context reduces tool sprawl"]
      - [Internal build, Internal budget and labor, "Buyer-defined extraction, controls, and workflow", "Ongoing maintenance, model, security, and audit costs unknown", "Avoids vendor lock-in but shifts execution and compliance burden to buyer"]
    notes: "Public pricing is mostly custom or undisclosed; this is a packaging comparison, not a realized-price or total-cost benchmark."
figures:
  - id: FP001
    title: Competitive positioning by workflow fit and engagement breadth
    type: quadrant
    summary: DataSnipper leads on Excel and workflow fit, while Caseware leads on engagement breadth and governance; other alternatives occupy trade-off positions.
    data:
      xAxis: "Excel and workflow fit (ordinal 1–5)"
      yAxis: "Engagement breadth (ordinal 1–5)"
      points:
        - {label: DataSnipper, x: 5, y: 3, detail: "Excel-native evidence automation; breadth beyond audit tasks is less established", tone: positive}
        - {label: Caseware Verity, x: 3, y: 5, detail: "End-to-end engagement phases and methodology-native agents", tone: neutral}
        - {label: Internal build, x: 4, y: 4, detail: "Potentially broad and tailored, but governance depends on buyer execution", tone: neutral}
        - {label: Manual status quo, x: 5, y: 2, detail: "Familiar workflow with little automation", tone: warning}
        - {label: Specialist document tool, x: 2, y: 2, detail: "Extraction focus with uncertain audit workflow coverage", tone: warning}
        - {label: Broader finance suite, x: 2, y: 4, detail: "Broader context with uncertain Excel-native evidence fit", tone: neutral}
    notes: "Ordinal scores are analyst synthesis from the cited capability evidence, not market-share or performance measurements; they should be re-tested in a controlled buyer bake-off."
    approximationNotes: "Scores are bounded ordinal judgments, not measured performance or a claim of ranking."
    claimRefs: [CP001, CP005, CP007, CP013]
callouts:
  - calloutType: strength
    title: Workflow-native differentiation
    body: DataSnipper's clearest moat is the combination of Excel-native adoption and source-linked evidence, which reduces migration friction for audit teams already working in spreadsheets.
    claimRefs: [CP001, CP005]
  - calloutType: risk
    title: Platform and trust risk
    body: Microsoft dependency, opaque pricing, absent independent accuracy benchmarks, and the category's privacy and reliability concerns make durable differentiation unproven.
    claimRefs: [CP009, CP011, CP012]
  - calloutType: recommendation
    title: Diligence through a controlled bake-off
    body: Compare DataSnipper, a full-platform incumbent, and an internal-build baseline on identical audit samples, traceability, reviewer time, exceptions, residency, implementation effort, and total contract cost.
    claimRefs: [CP013, CP014]
