      - [Manual Excel and document review, Status quo substitute, "No vendor funding or seat price; labor cost is buyer-specific", "Any audit or finance team", "No migration and familiar professional judgment process", "Slow, repetitive, and exposed to inconsistent evidence handling at scale"]
    notes: "Profiles combine official, independent, and competitor surfaces; scale and funding are source-specific signals, not normalized comparable metrics."
