evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, ownership table, executive roster, and key-person succession plan.
    whyItMatters: >-
      Governance rights and dependence on a small leadership group affect control, execution continuity, and financing
      risk.
    diligencePath: Request the latest cap table, board minutes, executive organization chart, and succession disclosures under NDA.
    relatedQuestionRefs:
      - QO002
      - QO009
  - type: enumeration-incomplete
    severity: material
    topic: TO002 leadership
    missingEvidence: A complete current executive and board roster beyond the named people in the assigned sources.
    whyItMatters: The partial leadership enumeration limits assessment of functional coverage and key-person dependence.
    diligencePath: Request the current leadership directory, board roster, and organization chart from management.
    relatedQuestionRefs:
      - QO002
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A dated metric dictionary reconciling customers, users, professionals, employees, and active accounts.
    whyItMatters: >-
      The current source set uses different populations and periods, so scale cannot safely be converted into valuation
      or productivity assumptions.
    diligencePath: >-
      Obtain management's KPI definitions, cohort basis, current customer count, active-user count, and headcount
      report.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: productivity
    missingEvidence: The methodology, denominator, and independent validation behind the reported $1.4B 2025 productivity savings.
    whyItMatters: >-
      A large outcome number can materially influence perceived product-market fit while remaining non-comparable
      without a disclosed calculation basis.
    diligencePath: Request the underlying savings model, customer sample, counterfactual assumptions, and third-party validation.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: blocking
    topic: adverse-events
    missingEvidence: >-
      A targeted legal, regulatory, outage, and security-incident search with primary records or management
      confirmation.
    whyItMatters: >-
      Absence of a disclosed incident in the assigned pool cannot establish absence, especially for software handling
      audit and financial documents.
    diligencePath: >-
      Search court and regulator databases, review incident disclosures and trust-center history, and request
      management's litigation and incident schedule.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: Current cap table, debt or credit facilities, liquidation preferences, and any secondary transactions.
    whyItMatters: Reported funding and valuation do not establish cash available, ownership dilution, or investor economics.
    diligencePath: Obtain the latest financing documents, capitalization table, debt schedule, and board-approved financing summary.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: TO003 stakeholders
    missingEvidence: A complete cap table and contract register covering investors, partners, and customer concentration.
    whyItMatters: >-
      The public stakeholder map identifies relationships but does not establish control rights, economic exposure, or
      revenue concentration.
    diligencePath: >-
      Request the current cap table, investor-rights schedule, strategic partnership agreements, and top-customer
      concentration report.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Audited current revenue, ARR, NRR, gross margin, and customer concentration by segment.
    whyItMatters: >-
      The historical ARR figure is not a current audited revenue run-rate and does not establish retention or unit
      economics.
    diligencePath: >-
      Request audited financial statements, KPI bridge, ARR cohort table, NRR calculation, gross-margin bridge, and
      top-customer concentration.
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A market model with auditable counts of target firms, eligible users, software spend, geography, and penetration
      assumptions.
    whyItMatters: >-
      Without a common denominator, user counts and productivity savings cannot support a comparable TAM, SAM, or SOM or
      a valuation conclusion.
    diligencePath: >-
      Obtain management's segmented pipeline, paid-seat counts, contract values, renewal data, and a bottom-up market
      model by geography and buyer segment.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: users
    missingEvidence: >-
      A dated, first-party definition and reconciliation of active users, professionals, auditors, countries, and
      customer accounts.
    whyItMatters: >-
      Reported populations range from 400,000-plus auditors in 125 countries to 600,000-plus professionals in 175-plus
      countries and may represent different denominators.
    diligencePath: Request a metric dictionary and monthly active, paid, and deployed-seat cohorts for the last three fiscal years.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: monetization
    missingEvidence: Segmented pricing, average contract value, seat utilization, gross retention, and expansion data.
    whyItMatters: >-
      Workflow value does not establish that the addressable population converts into durable recurring revenue or that
      pricing supports the reported valuation.
    diligencePath: >-
      Review anonymized bookings and renewal cohorts by external audit, internal audit, corporate finance, and
      public-sector segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable realized price, seat minimum, discount, and implementation-cost data for DataSnipper and at least one
      full-platform competitor.
    whyItMatters: >-
      Opaque pricing prevents a buyer-level total-cost comparison and weakens conclusions about expansion economics and
      switching costs.
    diligencePath: Request anonymized order forms and implementation estimates, then run a same-scope procurement comparison.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: accuracy
    missingEvidence: >-
      Independent, task-level accuracy and exception-rate benchmark using matched audit samples across DataSnipper,
      Caseware, and an internal baseline.
    whyItMatters: >-
      Marketing claims about speed or traceability do not establish whether output quality is superior under
      professional review.
    diligencePath: Run a blinded bake-off with source-linked scoring, reviewer adjudication, and repeatability checks.
    relatedQuestionRefs:
      - QP009
      - QP010
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: Audited or consistently defined user, customer, employee, and funding metrics with dates and denominators.
    whyItMatters: >-
      Directory records report different user, funding, and valuation figures, making scale-based competitive rankings
      unreliable.
    diligencePath: Reconcile company disclosures, investor materials, and dated third-party records before underwriting scale.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Retention, multi-homing, replacement rates, and partner-sourced pipeline by customer segment.
    whyItMatters: >-
      Excel familiarity and distribution may create adoption, but public evidence does not show whether customers stay
      or expand against bundled alternatives.
    diligencePath: Request cohort retention, competitive win/loss, channel mix, and displacement data under NDA.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP010
  - type: stale
    severity: minor
    topic: regulation
    missingEvidence: Current 2026 evidence on audit-firm GenAI policies, regulatory expectations, and accepted use cases.
    whyItMatters: The PCAOB source is a July 2024 snapshot and category governance may have changed before the run date.
    diligencePath: Refresh with current PCAOB, major-firm policy, and procurement evidence before an investment decision.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: underwriting-gaps
    missingEvidence: Current ARR bridge, gross margin, retention cohorts, cash flow, cash balance, debt, and runway.
    whyItMatters: >-
      Without these inputs, an investor cannot test revenue quality, AI cost absorption, financing dependency, or
      downside resilience.
    diligencePath: >-
      Request monthly management accounts, ARR bridge, cohort retention, gross-margin waterfall, cash and debt schedule,
      and a 24-month operating plan.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing schedule reconciling the reported total raised, round dates, investors, valuation, and use of
      proceeds.
    whyItMatters: Conflicting public financing records can distort dilution, valuation, and capital-adequacy analysis.
    diligencePath: Obtain the cap table, signed financing announcements, and board-approved use-of-proceeds schedule.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Representative contracts or a price card showing seat tiers, minimum commitments, discounts, renewals, and AI
      feature attach rates.
    whyItMatters: >-
      List-versus-realized pricing and expansion economics determine whether reported adoption converts into durable
      revenue.
    diligencePath: Review anonymized customer contracts, renewal cohorts, discount schedules, and product-level bookings.
    relatedQuestionRefs:
      - QI004
  - type: missing-source
    severity: material
    topic: accuracy
    missingEvidence: >-
      Independent precision, recall, exception, and hallucination benchmarks for AI Extractions, Excel Agents, and
      Disclosure Agents by document type and language.
    whyItMatters: >-
      Audit workflows require professional-grade accuracy and a quantified error budget before automation can be relied
      on for regulated work.
    diligencePath: >-
      Request task-level benchmark results, test-set composition, error taxonomy, and customer acceptance thresholds
      under NDA.
    relatedQuestionRefs:
      - QE008
  - type: access-blocked
    severity: material
    topic: reliability
    missingEvidence: Public or customer-verifiable uptime, incident, disaster-recovery, and model-change records.
    whyItMatters: >-
      A workflow embedded in audit evidence processing can create operational and compliance exposure when unavailable
      or changed unexpectedly.
    diligencePath: >-
      Obtain the current trust package, SOC reports, service-level commitments, incident history, and rollback
      procedure.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: privacy
    missingEvidence: >-
