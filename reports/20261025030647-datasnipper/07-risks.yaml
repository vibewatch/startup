      - [Sensitive client-document privacy and retention, EU and customer-specific data jurisdictions, medium, high, "Medium: GDPR/SOC 2, encryption, SSO, and deletion claims are published", "Medium-high because contract and subprocessor terms are not public", "Review SOC report, DPA, subprocessors, retention controls, regional residency, and breach-notification terms"]
      - [AI governance and regulatory compliance, EU and other customer jurisdictions, medium, high, "Medium: company describes transparency, explainability, and EU AI Act alignment", "Medium because independent testing and governance artifacts are not public", "Request AI risk classification, evaluation protocol, model-change controls, and customer audit rights"]
      - [Contractual or IP dispute exposure, Global enterprise contracts, unknown, medium, "Low-to-medium: no case evidence in the assigned pool", "Unknown; absence of a recorded case is not proof of absence", "Run counsel-backed litigation, IP, indemnity, and limitation-of-liability checks"]
    notes: "Public source descriptions and independent reviews are not substitutes for current SOC, DPA, legal, or regulator records; unknown means the assigned evidence did not establish the fact."
    enumerationScope:
      coverage: partial
      basis: "Partial register synthesized from assigned public product, review, company-release, and profile sources available for the 2026-10-25 refresh."
    claimRefs: [CR001, CR006, CR007, CR008, CR011, CR012]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Extraction errors on poor scans or complex layouts, medium, high, "Medium: human review and source links", "Medium-high for edge cases", "No independent accuracy benchmark or error-rate series"]
      - [Latency or workflow friction on large files, medium, medium, "Low-to-medium: review evidence reports lag on exceptionally large PDFs", "Medium for high-volume engagements", "Need percentile latency and failure data by file size"]
      - [Microsoft Excel or Azure dependency disruption, medium, high, "Medium: native integration and Azure infrastructure are core strengths", "High if a critical API, add-in, or commercial term changes", "Obtain dependency map, portability plan, SLA, and change-notice terms"]
      - [Pricing or licensing blocks smaller and occasional users, medium, medium, "Low-to-medium: custom or quote-based pricing and per-seat model", "Medium for bottom-up expansion and customer mix", "Review realized price, discounting, renewal, utilization, and downgrade data"]
    notes: "Likelihood and residual exposure are bounded judgments from the cited evidence; they are not incident frequencies. The table preserves unknowns where the pool lacks operational metrics."
    claimRefs: [CR002, CR003, CR004, CR010, CR011, CR012]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration or exposure, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Spreadsheet distribution surface, Microsoft Excel, Primary user interface and workflow context, High product dependence, Excel changes or reduced add-in support impair adoption and workflow continuity, high, "Excel-native positioning and direct workflow integration", "High until portability and change-management evidence are reviewed"]
      - [Cloud and AI infrastructure, Microsoft Azure, "Hosting and stated extraction backbone", "Material technical dependence", "Azure service change or outage affects processing or economics", high, "Azure hosting plus regional data-residency claims", "Medium-high without tested failover and SLA evidence"]
      - [Enterprise audit relationships, Big Four and large firms, "Distribution, validation, and reference channel", "Customer and channel concentration not quantified", "Procurement or renewal loss reduces credibility and expansion", medium-high, "Broad stated customer footprint and partner motion", "Medium-high because contract terms and customer concentration are undisclosed"]
      - [Seat-based commercial model, Enterprise and smaller audit teams, Revenue collection and expansion mechanism, Full-seat cost burdens occasional users, low-volume customers may not renew or expand, medium, "Tiered plans and free-trial or sales-assisted evaluation", "Medium until cohort and utilization data are available"]
      - [Public funding record, Financial-data aggregators, Financing history used in runway analysis, "Conflicting total-raised figures of $100M and $200M", "Using funding raised as a proxy for cash available misstates runway", medium, "Reconcile cap table, bank cash, debt, and uses of funds", "Medium until primary financing records and current cash are reviewed"]
    notes: "Counterparties and roles are drawn from the assigned sources; concentration is marked as unquantified where no denominator or contract-level disclosure was found."
    claimRefs: [CR003, CR004, CR010, CR013, CR014, CR015, CR016]
