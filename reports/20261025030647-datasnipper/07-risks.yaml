callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: "A material customer or regulator finding that AI-generated audit work is not reliably traceable to source evidence would challenge both product differentiation and the regulated-workflow expansion thesis."
    claimRefs: [CR001, CR005]
  - calloutType: assumption
    title: Evidence limitation
    body: "The assigned public pool contains product descriptions and reviews but no current customer contracts, independent model benchmark, incident register, or complete litigation search; unresolved exposure should not be read as a confirmed incident."
    claimRefs: [CR008, CR012, CR014]
