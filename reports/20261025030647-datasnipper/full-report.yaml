  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's addressable market is best bounded as software and workflow automation for external audit,
              internal audit and SOX work, tax and advisory procedures, corporate finance evidence review, and
              government audit. The included spend is the budget for extracting, matching, validating, documenting, and
              reviewing financial evidence in spreadsheet- heavy workflows. General-purpose conversational AI, generic
              RPA, standalone practice-management systems, and labor retained for manual copy/paste are adjacent or
              substitute spend rather than interchangeable market revenue. CheckThat describes the product as an
              Excel-based automation platform for audit and finance professionals that extracts information from
              invoices, PDFs, and websites and matches it against spreadsheets; the platform therefore competes for
              workflow time and assurance-oriented automation budgets rather than all enterprise AI spend. Dealroom
              independently describes the same Excel-native, subscription-based SaaS model and identifies external
              auditors, finance teams, Fortune 500 companies, and government agencies as user groups. The status quo
              remains Excel plus manual evidence handling, internal tools, or general automation, especially where a
              buyer cannot tolerate migration away from established workpapers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports multiple sizing lenses but not a single additive market number. A
              user-population lens is large: sources report either over 500,000 professionals in 85-plus countries or
              over 600,000 users in 175-plus countries, while a separate directory describes 400,000-plus auditors in
              125 countries. These figures use different populations, dates, and definitions, so they should not be
              summed or converted into revenue. A workflow-value lens is also material: DataSnipper reports $1.4 billion
              of 2025 productivity savings, but the methodology is not disclosed; the SEC-hosted panel materials instead
              describe the broader control problem, including inaccurate or incomplete AI output, hallucinations,
              reliability, explainability, and governance requirements. A company-revenue lens has a reported $45
              million ARR in 2023 from one market-data profile, but that is company ARR rather than market size and is
              not a substitute for TAM. These lenses imply room for expansion, yet the lack of a consistent denominator,
              buyer spend pool, geography, and pricing schedule prevents an evidence-constrained SAM or SOM calculation.
              The correct valuation implication is sensitivity to conversion of workflow value into recurring software
              spend, not a headline market multiple.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM008
              - CM009
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buying center is segmented by workflow rather than by a single generic finance persona. Senior
              auditors and controllers are end users; audit practice leaders, CFOs, finance operations, and
              government-audit leaders are budget owners or sponsors; engagement managers and security teams influence
              rollout. Adoption is most plausible where teams already use Excel workpapers, process high document
              volumes, and can measure cycle-time or review-quality improvement. The 2025 AI-agent release reinforces
              this path by embedding disclosure review and testing inside Excel and linking outputs to evidence, while
              the company's platform page emphasizes traceability, governance, and regulated workflows. The constraint
              set is equally important: switching cost from established workpapers, privacy and residency requirements,
              model accuracy, explainability, reviewer accountability, and undisclosed enterprise pricing can slow
              procurement. Independent user-market material flags high licensing costs and variable OCR accuracy as
              limitations, while PwC's SEC panel materials identify automation bias, hallucinations, changing outputs,
              and limited AI governance maturity as audit-specific risks. Microsoft distribution and Excel dependency
              can lower adoption friction, but they also make DataSnipper's long-term control of the workflow sensitive
              to platform policy and competing native AI features.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Attractive workflow wedge, unproven market conversion
            body: >-
              DataSnipper has a credible wedge into regulated, Excel-dependent audit workflows, but public evidence does
              not establish a comparable TAM/SAM/SOM or prove that reported productivity value converts into durable
              software revenue.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM014
          - type: callout
            title: Governance and pricing can cap adoption
            body: >-
              AI assurance requirements, variable extraction quality, and undisclosed enterprise pricing may constrain
              the pace at which large user populations become paying seats.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's direct arena is audit and finance automation inside Excel: document extraction, matching,
              reconciliation, disclosure review, and evidence-linked testing. Independent directory and comparison
              surfaces describe a three-tier product with core matching and extraction in Start, AI features and
              integrations in Accelerate, and governance, retention, directory synchronization, external guest access,
              and premium support in Elevate. The buyer can instead select an end-to-end audit platform such as
              Caseware, a broader finance automation suite, a specialist document-processing tool, an internal build, or
              the status quo of manual Excel and document work. The alternatives are not interchangeable on every
              workflow: an Excel-native add-in minimizes migration, while an engagement system can own more context and
              methodology. DataSnipper therefore wins where the job is evidence-heavy and spreadsheet-centered, but its
              addressable scope is narrower than a full audit system.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs: []
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's product case is strongest where audit teams need a reviewable chain from extracted value to
              source document without leaving Excel. Its official AI Extractions release says every extracted value is
              connected to underlying evidence, and its AI Agents launch positions prompt-driven testing and disclosure
              review inside familiar workflows. Those are meaningful switching advantages for teams already standardized
              on Excel, but they are not the same as owning the full engagement record. Caseware's official surface
              presents context-aware agents across preparation, planning, evaluation, and reporting, with
              methodology-native execution and a governed system of record. PCAOB staff observations provide an
              independent constraint on the whole category: firms remain focused on privacy, reliability, human review,
              and controls, and many are developing tools internally or with third parties. The competitive question is
              thus not just feature count; it is whether a buyer values local traceability and low disruption more than
              broad engagement context and governance.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs: []
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: Pricing opacity, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is directional rather than comparable. CurateSuite and Toolradar both report
              custom or undisclosed pricing, while Toolradar describes paid Start, Accelerate, and Elevate tiers and
              says the higher tiers add AI and enterprise controls. This supports a packaging comparison but not a
              price-per-seat benchmark or realized discount. DataSnipper's likely lock-in comes from user familiarity
              with Excel, evidence links embedded in workpapers, templates, training, and distribution through audit
              firms and partners; that lock-in is valuable but exposed to Microsoft platform decisions and to incumbent
              suites that can bundle AI into a broader system. The company's own partner and launch materials are
              confirming rather than independent proof. Adverse category evidence is clearer: PCAOB staff record that
              some firms restrict GenAI use because of privacy and reliability concerns, while Caseware markets a
              competing governed, end-to-end architecture. Durability therefore depends on measurable accuracy,
              controls, retention, and workflow coverage that public sources do not fully disclose.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs: []
      - number: '3.4'
        title: Evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The comparison is constrained by uneven public disclosure. DataSnipper and competitor marketing pages
              describe capabilities and selected customer or productivity outcomes, but they do not provide a consistent
              price list, retention data, accuracy benchmark, win-rate history, or like-for-like implementation cost.
              Directory estimates also disagree on user counts, funding totals, and valuation ranges, so those fields
              are retained as source-specific observations rather than normalized facts. The practical diligence
              priority is a controlled bake-off using the same audit samples, with evidence traceability, exception
              rates, reviewer time, implementation effort, data residency, and total contract cost measured against an
              internal-build baseline and a full-platform alternative.
            claimRefs:
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow-native differentiation
            body: >-
              DataSnipper's clearest moat is the combination of Excel-native adoption and source-linked evidence, which
              reduces migration friction for audit teams already working in spreadsheets.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: Platform and trust risk
            body: >-
              Microsoft dependency, opaque pricing, absent independent accuracy benchmarks, and the category's privacy
              and reliability concerns make durable differentiation unproven.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
              - CP012
          - type: callout
            title: Diligence through a controlled bake-off
            body: >-
              Compare DataSnipper, a full-platform incumbent, and an internal-build baseline on identical audit samples,
              traceability, reviewer time, exceptions, residency, implementation effort, and total contract cost.
            calloutType: recommendation
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              DataSnipper's publicly described model is subscription software sold to audit and finance organizations,
              with tiered seat-based annual recurring revenue subscriptions reported by Dealroom. The product is
              delivered as an Excel add-in, which makes workflow fit a commercial asset but also ties adoption to
              Microsoft's platform. The company has expanded from document extraction and matching into Excel Agents,
              Disclosure Agents, AI Extractions, and DocuMine, creating potential land-and-expand paths across audit,
              internal controls, tax, advisory, and corporate finance. Public sources describe customer and user counts,
              but no source in the assigned pool discloses contract value, realized price per seat, renewal rate,
              discounting, usage-based fees, or revenue recognition policy. The evidence therefore supports the
              monetization mechanism, not a precise revenue forecast.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI006
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI005
