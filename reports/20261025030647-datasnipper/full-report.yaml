              2017 that embeds intelligent automation inside Microsoft Excel for audit and finance professionals. Its
              core workflow links extracted numbers, text, or tables to source documents so reviewers can trace
              evidence. The product has expanded from document snipping and matching into AI Extractions, DocuMine,
              Excel Agents, and Disclosure Agents. The evidence supports a subscription SaaS model and broad
              international use, but the exact current legal entity, ownership structure, and audited operating metrics
              are not public in these sources.
