    claimRefs: [CI001, CI002, CI003, CI012]

callouts:
  - calloutType: strength
    title: Commercial proof is visible
    body: DataSnipper has evidence of broad professional adoption, Big Four customer coverage, product expansion, and partner-led growth, although most operating metrics are company-reported or third-party estimates rather than audited financial disclosure.
    claimRefs: [CI005, CI006, CI009]
  - calloutType: risk
    title: Underwriting remains data-constrained
    body: The assigned evidence does not establish current ARR, retention, gross margin, cash runway, debt, customer concentration, or realized pricing, so valuation and financing-dependency conclusions should remain provisional.
    claimRefs: [CI012, CI013, CI015]

