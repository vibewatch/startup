      - [Revenue growth, "150% in 2023, from $18M to $45M", "Medium; third-party profile", "Indicates historical acceleration but not current growth quality", "Reconcile bookings, revenue recognition, and cohorts"]
      - [Gross margin, null, "Unavailable", "Determines whether AI inference and support costs scale economically", "Provide gross-margin waterfall by product and customer segment"]
      - [CAC / payback / NRR, null, "Unavailable", "Required to distinguish efficient expansion from logo-led growth", "Provide cohort CAC, payback, GRR, NRR, and churn"]
      - ["Cash, burn, runway, debt", null, "Unavailable", "Determines financing dependency and downside resilience", "Provide monthly cash flow, debt schedule, facilities, and runway case"]
    notes: "Null means the metric was not disclosed in the assigned successful prefetched sources; no null should be interpreted as zero."
    claimRefs: [CI009, CI012, CI013, CI014, CI015]

