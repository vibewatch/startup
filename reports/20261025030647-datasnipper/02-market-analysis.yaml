    title: Evidence-constrained sizing lenses
    columns: [Publisher/source, Year or period, Geography, Value or metric, Methodology, Confidence, Limitation]
    rows:
      - ["CheckThat.ai", null, "Global", "600,000+ professionals", "Company/product profile aggregation", "Medium", "Population definition and date are not independently reconciled"]
      - ["Dealroom", null, "Global", "175 countries; 150K monthly visits", "Company profile and traffic intelligence", "Medium", "Traffic is not users, spend, or revenue"]
      - ["IDP Software", "2025", "Global", "$1.4B reported productivity savings", "Company/product profile summary", "Low", "Methodology and denominator are not disclosed"]
      - ["IDP Software citing Sacra", "2023", "Global", "$45M ARR; 150% YoY growth", "Market-data profile", "Medium", "Company ARR is not TAM/SAM/SOM and source method is not fully public"]
      - ["AIFI Map", null, "Global", "400K+ auditors in 125 countries", "Directory profile", "Low", "Conflicts with other user and geography definitions"]
      - ["Indexed.vc", "2024", "Global", "600,000 users in 175+ countries", "Directory profile", "Low", "User count and funding record require reconciliation with other sources"]
    notes: "Values are not additive: populations, traffic, productivity savings, and company ARR have different units and denominators; public sources do not isolate a defensible SAM or SOM."
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer or budget owner, User, Payer, Workflow, Adoption trigger]
    rows:
      - ["External audit firms", "Audit practice leader", "Senior auditor and engagement manager", "Firm technology or practice budget", "Testing and evidence reconciliation", "High document volume and compressed deadlines"]
      - ["Internal audit and SOX teams", "Chief audit executive or CFO", "Internal auditor and controls owner", "Enterprise finance or audit budget", "Controls testing and disclosure review", "Need for traceability and repeatable controls"]
      - ["Corporate finance departments", "CFO or finance transformation leader", "Controller and finance analyst", "Corporate software budget", "Document extraction and close support", "Faster close and fewer manual reconciliations"]
      - ["Tax and advisory", "Advisory practice leader", "Tax professional and deal team", "Practice or project budget", "Source-backed extraction and review", "Repetitive document-heavy engagements"]
      - ["Government audit", "Procurement and audit leadership", "Government auditor", "Public-sector technology budget", "Evidence processing and review", "Approved procurement path and data-residency fit"]
    notes: "Buyer roles and workflows are inferred from the product's stated use cases and the market's regulated operating context; public sources do not disclose standard contract size or budget conversion rates."
    claimRefs: [CM010, CM011, CM014]
