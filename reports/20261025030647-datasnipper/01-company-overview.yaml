company:
  name: DataSnipper
chapter:
  number: 1
  title: Company Overview
  summary: DataSnipper is an Amsterdam-founded, Excel-native automation company focused on audit and finance workflows. Public evidence supports a 2017 founding, a $100 million 2024 Series B at a $1 billion valuation, expanding AI-agent products, and strong customer reach, but current revenue quality, governance breadth, and the methodology behind productivity claims remain incompletely disclosed.
sections:
  - id: identity-and-business-model
    title: Identity, product, and operating model
    body: >-
      DataSnipper is described across the retained evidence as an Amsterdam-headquartered company founded in 2017 that embeds intelligent automation inside Microsoft Excel for audit and finance professionals. Its core workflow links extracted numbers, text, or tables to source documents so reviewers can trace evidence. The product has expanded from document snipping and matching into AI Extractions, DocuMine, Excel Agents, and Disclosure Agents. The evidence supports a subscription SaaS model and broad international use, but the exact current legal entity, ownership structure, and audited operating metrics are not public in these sources.
    claimRefs: [CO001, CO002, CO003, CO004]
    figureRefs: [FO001]
    tableRefs: [TO001]
  - id: leadership-funding-and-scale
    title: Leadership, financing, and scale
    body: >-
      The public record supports a financing step-up from an earlier Series A to a $100 million Series B in 2024 led by Index Ventures, with a reported $1 billion valuation. Dealroom identifies Maarten Alblas, Jonas Ruyter, and Kai Bakker as founders, while independent review and company releases identify Vidya Peters as CEO in the current product-expansion period. Sources report materially different user and employee measures, and some directory figures are ranges or platform estimates. Those differences make the financing history more usable than the current scale metrics for diligence, and leave governance, board composition, secondary transactions, and debt as open questions today for diligence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-quality
    title: Milestones and evidence quality
    body: >-
      DataSnipper's trajectory is visible through product and partnership milestones: founding in Amsterdam, early audit workflow adoption, a 2022 Series A reported by Dealroom, the 2024 Series B and unicorn valuation, the 2025 DocuMine and agent launches, and the 2026 reporting of productivity and adoption outcomes. The strongest corroboration is for identity, product direction, and the Series B. By contrast, the $1.4 billion productivity-savings figure is company-reported through syndicated material and lacks a disclosed methodology, while the retained independent review flags quote-only pricing and feature limitations. No retained source establishes a material lawsuit, outage, or regulatory enforcement event; that is an evidence boundary, not proof that none exists.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
callouts:
  - calloutType: strength
    title: Defensible workflow position
    body: DataSnipper's strongest identifiable asset is its Excel-native, source-linked audit trail, reinforced by Big Four customer references and Microsoft collaboration.
    claimRefs: [CO002, CO003, CO010]
  - calloutType: risk
    title: Current scale is not one clean metric
    body: User, customer, employee, ARR, and productivity measures vary by source and period; diligence should reconcile definitions before using them in valuation or underwriting.
    claimRefs: [CO008, CO009, CO011, CO014]
