  evidenceGaps:
    - type: missing-source
      severity: material
      topic: accuracy
      missingEvidence: Independent precision, recall, exception, and hallucination benchmarks for AI Extractions, Excel Agents, and Disclosure Agents by document type and language.
      whyItMatters: Audit workflows require professional-grade accuracy and a quantified error budget before automation can be relied on for regulated work.
      diligencePath: Request task-level benchmark results, test-set composition, error taxonomy, and customer acceptance thresholds under NDA.
      relatedQuestionRefs: [QE008]
    - type: access-blocked
      severity: material
      topic: reliability
      missingEvidence: Public or customer-verifiable uptime, incident, disaster-recovery, and model-change records.
      whyItMatters: A workflow embedded in audit evidence processing can create operational and compliance exposure when unavailable or changed unexpectedly.
      diligencePath: Obtain the current trust package, SOC reports, service-level commitments, incident history, and rollback procedure.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: privacy
      missingEvidence: Tenant isolation, retention, encryption, access-control, and regional-processing details for DataSnipper and Azure-connected components.
      whyItMatters: Source documents can contain confidential financial and personal information, making control boundaries central to deployment approval.
      diligencePath: Review architecture diagrams, subprocessors, data-flow maps, retention settings, and customer security questionnaires.
      relatedQuestionRefs: [QE005, QE008]
