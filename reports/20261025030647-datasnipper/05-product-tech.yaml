callouts:
  - calloutType: strength
    title: Workflow-native wedge
    body: Embedding automation inside Excel reduces workflow change for audit teams and makes source-linked evidence part of the user interaction rather than a separate review step.
    claimRefs: [CE001, CE002, CE009]
  - calloutType: risk
    title: Technical proof gap
    body: Public materials describe capabilities and adoption, but the assigned evidence does not establish independent accuracy, uptime, security attestations, or model-change governance.
    claimRefs: [CE011, CE012, CE014]
  - calloutType: insight
    title: Platform dependency is strategic
    body: Microsoft collaboration expands distribution and infrastructure reach, while also making product continuity and differentiation partly dependent on Microsoft's Excel, Azure, and Copilot decisions.
    claimRefs: [CE005, CE006, CE014]

