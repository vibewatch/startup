    notes: "Benefits are not directly comparable: the National Audit Office figure is a deployment-specific external citation, while usage growth and feature claims are company or directory reporting."
    claimRefs: [CE003, CE004, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - ["Excel interface", "User interaction and audit workpaper context", "Microsoft Excel desktop or online", "Product continuity if Microsoft changes APIs or distribution"]
      - ["Agent layer", "Prompt-driven analysis, testing, and disclosure workflows", "DataSnipper agents and Azure services", "Hallucination, authorization, and human-review controls"]
      - ["Extraction layer", "Convert unstructured documents into structured values", "AI Extractions and OCR/LLM capabilities", "Precision, recall, language, and document-layout variance"]
      - ["Evidence layer", "Link outputs back to source material", "DataSnipper workflow and document storage", "Evidence retention, provenance, and tamper resistance"]
      - ["Collaboration and data layer", "Multi-user workflow and regional processing", "Excel Online and described regional data centers", "Tenant isolation, residency, and availability"]
      - ["Governance layer", "Support review and compliance-heavy use", "Audit-specific controls and customer processes", "Public control attestations and incident data are incomplete"]
    notes: This is a public-evidence operating model, not a vendor-confirmed reference architecture; unspecified components are recorded as diligence gaps rather than inferred.
    claimRefs: [CE005, CE006, CE007, CE008, CE012]

