      - [Waterschap review duration, "About one hour versus a full day", Undated customer example, "DataSnipper secure-AI resource", medium, "Workflow efficiency is concrete in one public-sector case", "Baseline process, sample size, and independent measurement are not disclosed"]
      - [Waterschap audit speed, "About two times as fast", Undated customer quote, "DataSnipper secure-AI resource", medium, "Named user reports repeatable speed benefit", "Single-customer testimonial; no cohort denominator"]
    notes: "Values mix company-reported adoption, survey results, a company-reported aggregate savings estimate, and one named customer example; they are not a comparable funnel or retention cohort."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
