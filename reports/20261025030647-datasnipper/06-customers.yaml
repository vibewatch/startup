    columns: [Customer, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Publicly documented customer examples located in the assigned 2026 search pool; not a complete customer population or logo census."
    rows:
      - ["EY", "External audit", "Early support, feedback, and referrals", "Production relationship indicated", "EY describes early customer support as instrumental to growth", "No contract or renewal data"]
      - ["KPMG", "External audit", "Early audit workflow support", "Production relationship indicated", "EY interview names KPMG among early customers", "No workflow outcome or contract data"]
      - ["Deloitte and PwC", "External audit", "Early customer and referral relationships", "Production relationship indicated", "EY interview names both firms among early customers", "No separate deployment scope or outcome data"]
      - ["Waterschap Scheldestromen", "Public-sector audit", "Invoice matching, financial statement review, and compliance checklists", "Production use described", "Review about one hour versus a full day; advisor reports audit about two times faster", "Company-authored case; no independent measurement"]
      - ["Celsius", "Internal audit and finance", "Evidence management and review in Excel", "Embedded production use described", "Celsius says DataSnipper is embedded in how teams manage and review evidence", "No retention, spend, or deployment-size data"]
    notes: "Rows are a partial public-evidence sample; named relationships and testimonials do not establish customer count, paid status, renewal, or revenue concentration."
    claimRefs: [CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from workflow entry to expansion
    summary: Public evidence traces a customer path from familiar Excel workflows through AI adoption and broader audit or finance use cases, with retention and concentration remaining unverified.
    type: journey-map
    data:
      nodes:
        - id: entry
          label: Excel-native audit work
          detail: "Teams begin with document extraction, matching, and evidence review inside Excel."
          touchpoints: [external audit, internal audit, tax]
        - id: proof
          label: Named deployment
          detail: "Public examples include EY, Celsius, and Waterschap Scheldestromen."
          touchpoints: [reference workflow, customer testimonial]
        - id: ai
          label: AI-package adoption
          detail: "DataSnipper reported that 58% of new customers favored packages with AI products in 2025."
          touchpoints: [Excel Agents, Disclosure Agents, AI Extractions]
        - id: expansion
          label: Adjacent finance workflows
          detail: "The stated expansion surface includes internal audit, tax, advisory, corporate finance, and government audit."
          touchpoints: [controls, compliance, public sector]
        - id: durability
          label: Renewal and concentration
          detail: "NRR, GRR, churn, contract length, top-customer share, and multi-product penetration are not publicly disclosed in the assigned pool."
          touchpoints: [retention gap, concentration gap]
        - id: diligence
          label: Evidence needed
          detail: "Management data room evidence is needed to validate cohort durability, concentration, and expansion economics."
          touchpoints: [cohort schedule, customer concentration, pricing]
    claimRefs: [CU002, CU005, CU008, CU015]
callouts:
  - calloutType: strength
    title: Reference-quality proof exists
    body: Named users and workflow-specific outcomes provide stronger adoption evidence than logo counts alone.
    claimRefs: [CU008, CU011, CU012]
  - calloutType: risk
    title: Retention is not public
    body: Customer count, AI-package adoption, and review ratings do not substitute for cohort retention, renewal, or concentration data.
    claimRefs: [CU014]
