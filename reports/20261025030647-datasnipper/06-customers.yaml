company:
  name: DataSnipper
chapter:
  number: 6
  title: Customers
  summary: DataSnipper's customer proof is strongest where named audit and public-sector users describe Excel-native workflows and measurable time savings. Public evidence supports broad reach and growing AI-package demand, but retention, revenue concentration, and enterprise pricing remain undisclosed.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      DataSnipper targets audit and finance professionals whose work already occurs in
      Microsoft Excel. The evidence spans external audit, internal audit and SOX,
      tax and advisory, corporate finance, private equity, and public-sector audit.
      EY describes the company as having evolved from an Excel plug-in into a global
      AI platform, while the company describes its product as serving audit and finance
      teams in 175 countries and all four largest global auditing firms. These are
      materially different buying motions: Big Four and enterprise audit contracts
      provide reference value and distribution, whereas government and mid-market
      channels add procurement and security requirements. The available sources do
      not disclose segment-level revenue, seat counts, contract values, or payer/user
      splits, so customer breadth should not be treated as revenue diversification.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and usage trajectory
    body: >-
      Adoption evidence shows product expansion rather than a verified retention
      cohort. DataSnipper's July 2025 collaboration announcement said 58% of new
      customers favored packages with AI products; IDP Software's vendor profile
      says DataSnipper reported more than $1.4 billion in 2025 productivity savings,
      but notes that the calculation method was not disclosed. Fintech Global
      separately reported 58% AI-package adoption and 78% trust in AI among surveyed
      audit and finance professionals.
      Customer proof is more concrete in public-sector use: DataSnipper reports that
      Waterschap Scheldestromen reduced a review from a full day to about an hour,
      while the customer quote says the audit was about two times faster and review
      five times faster. These outcomes are useful workflow signals, not evidence of
      recurring revenue, renewal, or causal attribution across the customer base.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof and durability
    body: >-
      Named proof is strongest when the source identifies the organization, workflow,
      and outcome. EY's account of early support from EY, KPMG, Deloitte, and PwC
      describes customer feedback and referrals as contributors to growth, but it is
      an executive interview rather than an independently audited customer cohort.
      The public-sector example identifies a named organization, a risk-management
      advisor, specific invoice matching and compliance-check workflows, and a
      time comparison. Celsius is quoted as having DataSnipper embedded in audit and
      finance evidence review, which supports production use but not renewal economics.
      The sources do not provide NRR, GRR, churn, renewal rates, contract length,
      cohort retention, or customer concentration. Toolradar's review aggregation
      reports 4.8/5 across 221 G2 reviews, but its pricing assessment says prices
      are opaque and may be a barrier for smaller teams; this is a market signal,
      not a representative retention study.
    claimRefs: [CU010, CU011, CU012, CU014]
    tableRefs: [TU003]
  - id: expansion-and-concentration
    title: Expansion and concentration risk
    body: >-
      The customer motion appears to expand from external audit into internal audit,
      tax, advisory, corporate finance, and government workflows while remaining
      anchored to Excel. Microsoft and Azure are strategic enablers for the AI-agent
      motion, and the public-sector security material describes a separate channel
      for sensitive government evidence. That breadth can increase wallet share, but
      the same Excel and Microsoft dependency can concentrate platform risk and
      make migration economics difficult to assess. No source in the assigned pool
      discloses the top-customer share, partner-sourced revenue, channel commissions,
      implementation time, expansion rate, or the proportion of customers using more
      than one product. Until those denominators are supplied, the customer thesis
      is adoption-positive but durability- and concentration-unproven.
    claimRefs: [CU013, CU015, CU016, CU017]
