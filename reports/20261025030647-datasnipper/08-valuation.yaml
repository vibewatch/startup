schemaVersion: "report-v2"
artifact: valuation
slug: datasnipper
runDate: 2026-10-25
company:
  name: DataSnipper
chapter:
  number: 8
  title: Valuation
  summary: "DataSnipper's last public private-company mark is $1 billion, about 22.2x a third-party 2023 ARR estimate, while Workiva's 3.91x EV/revenue multiple is only a non-comparable discipline reference. The evidence supports track/research more with medium-low confidence and medium-high risk until current audited ARR, retention, margins, capitalization, and investor terms are available."
sections:
  - id: decision
    title: Recommendation and price discipline
    body: >-
      The recommendation is track/research more, not buy. Dealroom reports a $100 million
      Series B in February 2024 at a $1 billion valuation, while IDP Software reports
      $45 million of 2023 ARR. Those figures imply roughly 22.2x the stale 2023 ARR
      denominator, not a current entry multiple. Funding databases also disagree:
      AIFI Map reports $100 million total funding, whereas Indexed.vc reports $200 million
      across three rounds. Workiva's 3.91x EV/revenue multiple supplies public-market
      discipline but is not a direct comparable. Applying it mechanically to the 2023
      ARR estimate produces about $176 million, not a fair-value conclusion. The gap
      between that reference and the private mark makes price, structure, and primary
      financial diligence decisive. Confidence is medium-low, risk is medium-high, and
      no target return is supportable from the retained public evidence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on workflow adoption and expansion signals rather than verified
      economics. A company-issued release says more than 600,000 professionals in 175
      countries use DataSnipper. Another company release reports nearly 100% year-over-year
      growth in new corporate customers and more than 1,100% growth in active DocuMine
      usage during 2025. These are useful demand indicators, but they are not ARR,
      retention, revenue, or cash. The anti-thesis is that the most prominent value claim,
      more than $1.4 billion of 2025 customer productivity gains, lacks a disclosed
      methodology according to IDP Software. Windows Forum also identifies dependence
      on the Microsoft ecosystem as a potential lock-in and negotiating-leverage risk.
      Atherobase reports quote-based annual enterprise pricing rather than a public price
      card, which limits independent testing of monetization and renewal economics.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear cases
    body: >-
      Public data supports scenario logic but not precise valuation ranges or probabilities.
      The bull case requires current audited ARR to have materially outgrown the 2023
      estimate, strong cohort retention, durable gross margins after AI costs, and paid
      conversion behind customer and usage growth. The base case assumes the 2024 mark
      remains the negotiating reference, but permits no premium without current operating
      evidence and protective terms. The bear case combines weak monetization, multiple
      compression, Microsoft dependence, or a financing below the prior mark. Workiva's
      multiple illustrates how far public-market discipline can sit below a private
      headline multiple, but business-model and scale differences prevent direct
      translation. Scenario probabilities should remain qualitative until management
      supplies a current revenue-quality bridge and capitalization waterfall.
    claimRefs: [CV004, CV005, CV006, CV007, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence
    title: Exit readiness and final diligence
    body: >-
      Exit readiness cannot be established from product reach alone. The retained evidence
      shows a recognizable public workflow-software reference, substantial company-reported
      user reach, and recent product usage momentum, but it does not supply an IPO-quality
      current financial package, investor rights, secondary marks, or a preference
      waterfall. Final diligence should obtain monthly ARR and revenue bridges by product,
      NRR and logo churn by cohort, gross margin including AI inference costs, customer
      concentration, cash runway, the fully diluted cap table, liquidation preferences,
      and Microsoft commercial and termination terms. The view should improve only when
      verified growth and retention compress the effective entry multiple or price and
      structure compensate for uncertainty. Thesis-break triggers include a material
      renewal shortfall, AI-driven margin deterioration, loss of a major Microsoft-linked
      channel, or a down round without offsetting operating improvement.
    claimRefs: [CV002, CV003, CV008, CV009, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Current assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Track / research more", "The $1B private mark is about 22.2x the reported 2023 ARR estimate", "Do not make a price-insensitive entry"]
      - [Confidence, "Medium-low", "Current audited ARR, NRR, margins, cash, and investor terms are unavailable in retained evidence", "Require primary data-room evidence"]
      - [Risk rating, "Medium-high", "Funding records conflict and public/private multiple comparability is weak", "Use milestone and structure protections"]
      - [Valuation stance, "Unproven at the $1B reference", "Workiva's 3.91x EV/revenue is a discipline reference, not a direct comparable", "No premium to the last mark without verified acceleration"]
      - [Return target, "Not supportable publicly", "Entry price, dilution, preferences, and exit timing are not established", "Model returns only after cap-table and scenario diligence"]
    notes: "Private valuation and ARR use different 2024 and 2023 periods; the Workiva comparison is a mechanical, non-comparable reference rather than a fair-value estimate."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Position, Evidence, Limitation, What would change the view]
    rows:
      - [Thesis, "Company reports more than 600,000 professionals in 175 countries", "User reach is not customer count or revenue", "Contracted seats, customer count, and ARR concentration"]
      - [Thesis, "New corporate customers reportedly grew nearly 100% year over year in 2025", "The release does not provide the starting denominator or revenue contribution", "Audited new-logo ARR and cohort retention"]
      - [Thesis, "Active DocuMine usage reportedly rose more than 1,100% in 2025", "Usage is not paid expansion or margin", "Paid conversion, expansion ARR, and inference cost"]
      - [Thesis, "A release cites GBP400,000 of NAO savings and routine work up to three times faster", "The retained item is still a company-issued account of the hearing", "Direct customer evidence and normalized ROI methodology"]
      - [Anti-thesis, "The $1.4B productivity-gain methodology is not disclosed", "Headline value cannot be reconciled to revenue or cash benefit", "Auditable calculation, sample definition, and customer-level validation"]
      - [Anti-thesis, "Microsoft ecosystem dependence can reduce optionality and negotiating leverage", "Commercial terms and platform contingency are private", "Partner economics, termination rights, and a tested contingency plan"]
    notes: "All adoption and productivity quantities retain their issuer, period, and denominator; company-issued releases are not treated as independent validation."
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Current audited ARR materially exceeds the 2023 estimate; NRR and gross margin are strong; AI usage converts to paid expansion", "At or above the $1B reference is considered only after verified metrics; no public numeric range is supportable", "Improves with audited growth and cohort proof", "Usage growth fails to convert into paid retention"]
      - [Base, "Adoption continues but current revenue quality and investor terms remain private", "Use the $1B mark only as a negotiation reference and require price or structure protection", "Most plausible while core data is unavailable", "Current ARR or margin misses management plan"]
      - [Bear, "Monetization slows, AI costs compress margins, Microsoft dependence rises, or financing resets", "Value falls below the last mark; magnitude is not quantifiable from public evidence", "Rises with weak renewals or adverse financing", "Down round without offsetting operating improvement"]
      - [Decision gate, "Primary financial, cohort, capitalization, and partner evidence is delivered", "Recalculate the entry multiple, dilution, preference waterfall, and target return", "Mandatory before invest", "Management cannot reconcile funding or operating records"]
    notes: "Scenario ranges remain directional because unsupported current ARR, NRR, gross margin, cash, and preference quantities are recorded as gaps rather than estimated."
    claimRefs: [CV004, CV005, CV006, CV007, CV011, CV012, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "A historic private mark and stale ARR baseline pass through public-market discipline and evidence discounts to a track/research-more decision."
    data:
      nodes:
        - id: private-mark
          label: "2024 private mark: $1B"
        - id: arr-baseline
          label: "2023 ARR estimate: $45M"
        - id: implied-multiple
          label: "Implied mark / ARR: about 22.2x"
        - id: public-reference
          label: "Workiva reference: 3.91x EV/revenue"
        - id: evidence-discount
          label: "Discount: stale metrics, ROI-method gap, private terms"
        - id: decision
          label: "Decision: track / research more"
      edges:
        - [private-mark, arr-baseline]
        - [arr-baseline, implied-multiple]
        - [implied-multiple, public-reference]
        - [public-reference, evidence-discount]
        - [evidence-discount, decision]
    approximationNotes: "The 22.2x and $176M references are arithmetic using a 2024 private mark, a third-party 2023 ARR estimate, and Workiva's September 2026 multiple; neither is a current fair-value estimate."
    claimRefs: [CV001, CV004, CV005, CV006, CV009, CV016]
callouts:
  - calloutType: recommendation
    title: Track, with price as the gating variable
    body: "Product adoption supports continued diligence, but the public record does not support a buy or a target return at the $1 billion reference."
    claimRefs: [CV001, CV005, CV016]
  - calloutType: risk
    title: Do not convert productivity into revenue
    body: "The company-reported $1.4 billion of productivity gains is neither ARR nor cash available, and the retained evidence does not disclose its calculation methodology."
    claimRefs: [CV008, CV009]
