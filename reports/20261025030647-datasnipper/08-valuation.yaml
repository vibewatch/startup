    - type: private-evidence-only
      severity: blocking
      topic: revenue-quality
      missingEvidence: "Current audited or board-certified ARR, revenue, NRR, logo churn, gross margin by product, customer concentration, and cash runway."
      whyItMatters: "The 2023 ARR estimate is too stale to support a current entry multiple, probability-weighted valuation range, or target return."
      diligencePath: "Obtain monthly management accounts, an ARR bridge, cohort schedules, gross-margin build including AI costs, concentration data, and the board-approved cash forecast."
      relatedQuestionRefs: [QV002, QV009, QV010]
    - type: conflicting-data
      severity: material
      topic: capitalization
      missingEvidence: "Reconciled funding history, fully diluted cap table, liquidation preferences, option pool, investor rights, and any secondary or down-round pricing."
      whyItMatters: "Conflicting total-funding records and absent preference terms prevent translation of the headline valuation into common-equity value or investor proceeds."
      diligencePath: "Reconcile executed financing documents, investor closing statements, the legal capitalization ledger, preference waterfall, and recent secondary or 409A records."
