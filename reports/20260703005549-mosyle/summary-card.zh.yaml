  topStrengths:
    - 只服务 Apple 生态的一体化平台，覆盖 MDM、安全、身份、隐私和补丁。
    - 低端价格透明、直销模式清晰，公开评测普遍认为性价比高。
    - 商业、学校和 MSP 渠道都有显著公开采用信号，管理设备达数百万台。
  topRisks:
    - 公开经济数据、股权结构表和 2026 年融资历史仍严重披露不足，且内部口径不一致。
    - Mosyle 处理深层设备遥测、过滤和 K-12 / 家长侧工作流，隐私与合规敞口偏高。
    - 对 Apple 平台依赖很重；一旦 OS 变更或服务事故削弱产品可靠性，支持质量摩擦可能迅速放大。
  unresolvedGaps:
    - 当前 ARR、毛利率、烧钱速度、现金跑道、债务和留存指标未公开披露。
    - 没有经核对的 2026 年融资材料、投资人名单或清算 waterfall 支撑公开估值故事。
    - 公开客户数披露混用组织、客户、账户、学校和设备等口径。
