evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2026-funding-valuation-conflict
    missingEvidence: >-
      Definitive 2026 financing documentation covering round date, primary versus secondary proceeds, investor list, and
      valuation.
    whyItMatters: >-
      The public record currently conflicts on Mosyle’s latest round size, total capital raised, and valuation, which
      directly affects dilution, return math, and the credibility of any Warburg/$1B framing.
    diligencePath: >-
      Request signed financing documents, shareholder letter, or board-approved cap-table summary for any 2026
      transaction.
    relatedQuestionRefs:
      - QO010
      - QO011
      - QO012
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: customer-scale-definition-conflict
    missingEvidence: A single dated definition of customers, organizations, schools, accounts, and managed devices.
    whyItMatters: >-
      Current public sources cite 42k, 47k, 50k-ish, 52k, 65k, 20k schools, and 7M devices without harmonized
      definitions, which makes topline traction easy to overstate.
    diligencePath: >-
      Ask management for a current KPI pack that defines accounts, active customers, paying customers, schools, and
      devices on one as-of date.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-gap
    missingEvidence: Exact ARR, revenue run rate, current headcount, margin profile, and profitability definition.
    whyItMatters: >-
      Public rhetoric around growth and profitability is not enough to assess valuation support, operating leverage, or
      execution quality without the underlying numeric base.
    diligencePath: >-
      Request current operating metrics by month or quarter, including ARR, revenue, headcount, burn, and margin
      definitions.
    relatedQuestionRefs:
      - QO014
      - QO015
      - QO016
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: A current board roster, finance leadership map, and committee structure for the core Mosyle company.
    whyItMatters: >-
      The leadership table can only enumerate the public-facing founder, COO, and adjacency leaders today, which leaves
      governance depth and succession planning materially underexplained.
    diligencePath: Request board materials, executive org chart, and a list of committee and observer assignments.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
