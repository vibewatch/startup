  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Apple device management first, security and identity second'
        blocks:
          - type: paragraph
            body: >-
              Mosyle should be bounded first as an Apple-first device-management control plane and only then expanded
              into adjacent security and identity budgets. Apple's own deployment documentation defines the core job
              clearly: a device-management service remotely configures devices, updates software and settings, monitors
              compliance, and can lock or wipe endpoints across iPhone, iPad, Mac, Apple TV, Apple Watch, and Vision
              Pro. Automated Device Enrollment through Apple Business or Apple School Manager is the standard path for
              organization-owned devices, and Microsoft Intune documents the same architecture from the substitute side.


              That core MDM layer is not the whole Mosyle story. Apple Platform SSO makes macOS login and local-account
              lifecycle dependent on both an IdP extension and device management. Research and Markets explicitly models
              UEM as the umbrella that bundles MDM, IAM, and endpoint security, which matches Mosyle's own positioning
              as a unified Apple platform rather than a narrow profile-pushing tool. The included spend is therefore
              Apple-specific MDM subscriptions, Mac identity and SSO, Apple endpoint security, app and patch management,
              and MDM-linked privacy or filtering modules. Excluded spend is just as important: Apple hardware
              purchases, generic enterprise IAM unrelated to managed Apple devices, broad SIEM or SOC budgets, and
              standalone professional services do not belong in Mosyle's practical core TAM. The main substitutes are
              native Apple admin plus scripting, cross-platform suites like Intune, Apple-first incumbents like Jamf and
              Addigy, and outsourced MSP administration.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
