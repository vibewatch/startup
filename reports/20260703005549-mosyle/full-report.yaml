  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Mosyle's recommendation depends on real product and pricing proof being netted against disclosure gaps, comp
      discipline, and financing ambiguity.
    approximationNotes: >-
      The flow is qualitative rather than probabilistic and reflects the decision chain supported by retained public
      evidence as of the run date.
    data:
      nodes:
        - id: n1
          label: Commercial proof
          detail: Transparent pricing, direct-sales claims, and strong review scores show real product-market fit.
        - id: n2
          label: Capital access
          detail: A fresh ~2026 $100M event is visible in filings and market-data sources.
        - id: n3
          label: Disclosure gap
          detail: No public ARR, margin, cash, debt, or full liquidation waterfall.
        - id: n4
          label: Comp discipline
          detail: Jamf is audited, larger, and only ~2x Mosyle's visible mark.
        - id: n5
          label: Price tension
          detail: Current evidence can support a live company, but not an automatic $1B+ conclusion.
        - id: n6
          label: Recommendation
          detail: Research-more / track with a stretched valuation stance.
      edges:
        - from: n1
          to: n5
          label: supports upside
        - from: n2
          to: n5
          label: confirms market access
        - from: n3
          to: n5
          label: caps conviction
        - from: n4
          to: n5
          label: limits multiple
        - from: n5
          to: n6
          label: drives call
