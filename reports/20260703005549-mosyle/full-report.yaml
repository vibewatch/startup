      - number: '6.4'
        title: Expansion is visible; concentration risk is still opaque
        blocks:
          - type: paragraph
            body: >-
              Mosyle's public record does show credible expansion loops. For schools, the company is extending beyond
              device control into parent-governed after-hours management through Mosyle@Home, effectively widening the
              relationship from IT administrator to household. For businesses, migration programs, free onboarding,
              extended trials, and Apple OS 26 migration support reduce switching friction and create land-and-expand
              opportunities once devices are enrolled. For MSPs, Mosyle offers centralized billing, per-customer
              reporting, and first-year commission economics that deliberately subsidize partner acquisition and
              downstream seat expansion. The downside is that these visible expansion paths do not disclose how revenue
              concentration actually behaves. Public sources do not break out ARR by schools versus businesses versus
              MSPs, do not identify the share of revenue coming from large districts or channel-led subaccounts, and do
              not reveal whether the aggressive first-year MSP incentives produce healthy multi-year retention. Mosyle's
              intentional refusal to publish customer logos reinforces the blind spot: the company may be protecting
              customer privacy, but it also forces investors to underwrite concentration and durability with much weaker
              external proof than the headline scale claims imply.
