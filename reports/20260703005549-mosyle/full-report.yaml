        title: Satisfaction signals are positive, but retention proof remains thin
        blocks:
          - type: paragraph
            body: >-
              Independent review platforms support the idea that Mosyle delivers real day-to-day value, especially on
              price-to-value and onboarding. GetApp and Software Advice both show 86-review samples with 4.6 overall
              ratings, and both surfaces point to strong value-for-money readings around the $1-per-device entry point.
              Review text also supports a pattern that matters operationally: customers praise responsiveness,
              onboarding help, and straightforward Apple-device management. The same evidence set also flags friction.
              GetApp mentions app-deployment retries, confusing navigation, support delays, and a need for better
              self-service resources; G2 includes comments about weak documentation, load times, missing tvOS depth, and
              update/app integration gaps. Those are meaningful satisfaction qualifiers, but they still do not translate
              into true durability metrics. No reviewed public source discloses NRR, GRR, logo churn, renewal rates,
              contract length, cohort behavior, or top-customer dependence, and the public status page provides only a
