        - Apple hardware purchases, carrier services, help-desk labor, generic PC management
        - IT admin, workplace IT, endpoint team; payer is IT or operations budget
        - Core monetization layer defined by Apple and substitute MDM docs
      - - Apple endpoint security
        - >-
          Mac and mobile threat protection, compliance hardening, content or web protection, zero-trust policy
          enforcement on Apple devices
        - Full SIEM/SOC budgets, network firewalls, broad MDR unrelated to endpoints
        - Security leader, CISO delegate, endpoint security manager; payer is security budget
