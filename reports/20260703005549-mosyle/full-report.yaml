  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Mosyle layers its own automation, agents, and identity workflows on top of Apple enrollment and device-management
      primitives.
    data:
      layers:
        - label: Apple provisioning layer
          detail: >-
            Apple Business / Apple School, ADE, supervision, and configuration profiles establish enrollment and
            baseline device control.
        - label: Mosyle control plane
          detail: >-
            Admin UI, policies, reporting, automation, billing logic, and segmentation for business, school, and MSP
            workflows.
        - label: Endpoint execution layer
          detail: >-
            Lightweight macOS agent, iOS and iPadOS apps, app catalog, package handling, and update workflows enforce
            desired state.
        - label: Identity and security services
          detail: >-
            Auth 2, hardening/compliance, AV, Zero Trust, encrypted DNS, privilege management, and audit-oriented
            reporting.
        - label: User and operator experience
          detail: >-
            IT admins, teachers, MSP technicians, and parents consume role-specific workflows on top of the same
            Apple-only foundation.
