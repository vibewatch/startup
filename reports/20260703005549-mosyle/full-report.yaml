  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module / SKU map
        blocks:
          - type: paragraph
            body: >-
              Mosyle’s product is easiest to understand as an Apple-admin workflow compressor rather than as a generic
              UEM catalog. For businesses, the job is to enroll Macs, iPhones, iPads, Apple TVs, and watches; enforce
              baseline security; bind login to the company identity provider; push apps and patches; and keep support
              volume low enough that a small IT team can still scale. For schools, the workflow widens into teacher
              controls, Shared iPad, parent-facing after-hours supervision, and student-safe web access. For MSPs, the
              job is different again: create reusable policy templates once, then selectively override Apple Push
              Certificate, IdP, VPN, or Exchange settings at each customer without rebuilding the stack from scratch.
              Across these surfaces, Mosyle repeats the same five-pillar module story—device management, endpoint
              security, privacy, identity, and app management—then wraps it in segment-specific packaging. The newest
              adjacency layer matters too: Assetbots adds asset lifecycle and sync workflows, while AccessMule reaches
              beyond endpoint control into access and password management. That makes the current product map broader
              than plain Apple MDM, but still anchored in the same Apple-only operating problem.
