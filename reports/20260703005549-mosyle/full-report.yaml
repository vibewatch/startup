      - number: '8.2'
        title: Investment thesis, anti-thesis, and comp bridge
        blocks:
          - type: paragraph
            body: >-
              The bullish side of Mosyle's case is easy to understand. Current pricing is unusually transparent for a
              private infrastructure vendor, with business plans from free to $3 per device per month, school pricing
              from $0.46, migration credits that can make year one free for switchers, and MSP economics that
              deliberately trade near-term margin for partner acquisition. The business page also claims that more than
              90% of customers buy direct, suggesting a potentially leaner CAC structure than channel-heavy peers.
              Independent reviews broadly support that price-to-value story with 4.6 out of 5 ratings and strong
              value-for-money marks. The anti-thesis is that public proof degrades precisely where valuation discipline
              matters most. Mosyle's own customer counts conflict across pages, review sites still flag support and
              documentation friction, and PeerSpot continues to place Jamf ahead on market presence and support depth.
              Jamf is also the only clean audited comp in the retained set: it disclosed 76,500 customers and 33.2
              million devices, while market-data sources still value it at roughly $1.74 to $1.75 billion and about 2.5x
              sales. That makes Mosyle's visible $898.96 million mark roughly half of Jamf's public value even though
              Mosyle discloses none of the revenue, margin, or retention detail that Jamf does.
