          conviction.
        - 0.75-0.95
        - Anchored around Forge's ~$0.899B mark and below any automatic $1B+ assumption.
        - Current public evidence never upgrades from partial to complete.
      - - Bull
        - 20%
        - >-
          Private diligence proves strong retention, software-like margin, low churn, and a clean cap table while growth
          stays healthy.
        - 1.00-1.20
        - >-
          Requires investors to pay a scarcity premium above the current visible mark, but still below aggressive hype
          values.
        - Operational proof or waterfall terms fail to validate the premium.
      - - Probability-weighted view
