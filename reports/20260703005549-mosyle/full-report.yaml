  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and public scale signals
        blocks:
          - type: paragraph
            body: >-
              Mosyle's customer footprint is visibly segmented rather than monolithic. The public web separates school,
              business, and MSP offers with distinct pricing, workflow language, and onboarding motions, which is strong
              evidence that buyer, user, and payer patterns differ by segment. Education pages emphasize K-12 classroom
              control, Apple School Manager, and teacher workflows; business pages emphasize endpoint security,
              identity, patching, and migration from incumbent Apple-management stacks; MSP pages emphasize multi-tenant
              policy control, centralized billing, and commission economics. Public scale signals are directionally
              strong but not numerically clean. Historical sources move from 32,000 organizations in 2022 to 42,000
