        title: Exhibits
        blocks:
          - type: callout
            title: Boundary discipline is the real work in this market
            body: >-
              Mosyle spans Apple MDM, Apple endpoint security, and Mac identity, but those budgets should not be swapped
              interchangeably when someone says the market is “large.”
            calloutType: insight
            claimRefs:
