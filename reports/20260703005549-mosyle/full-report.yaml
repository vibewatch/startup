      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers are structural. First, zero-touch enrollment and remote policy control are
              now table stakes across Apple, Microsoft, and Addigy documentation, which means buyers increasingly expect
              hands-off provisioning rather than manual imaging or desk-side setup. Second, identity and security
              attachment broaden wallet share: Apple Platform SSO, analyst UEM definitions, and Jamf's product stack all
              connect enrollment to access control, privilege, and endpoint defense. Third, remote work, BYOD, and
              mobile workforces continue to support MDM and endpoint-security budgets, even when a vendor like Mosyle
              focuses on organization-managed Apple fleets. Fourth, education and MSP remain real submarkets, not
              speculative adjacencies, because Apple, Research and Markets, Mosyle, and Addigy all explicitly publish
              school or multi-tenant operating models.


              Constraints are equally important. Apple-only scope narrows the practical market whenever a buyer wants
              one cross-platform UEM suite for mixed Windows, Android, and Apple fleets. Operational switching is not
              trivial either: Apple Business or School Manager, MDM push certificates, MDM server assignments, and
              locked-enrollment policies create deployment friction even when they do not create permanent lock-in.
              Public review surfaces also show that pricing alone does not eliminate execution risk; buyers still report
              issues with app deployment, update behavior, navigation, or missing self-service resources. Finally,
              market-growth rhetoric should be used carefully. MDM's published 26.1% growth rate is faster than IAM or
              endpoint-security growth, which helps the upside narrative, but Mosyle still lacks public segment mix and
              attach-rate disclosure, so rapid category growth does not automatically translate into clean SOM
              conversion.
