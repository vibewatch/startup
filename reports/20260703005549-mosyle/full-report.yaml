      - number: '8.3'
        title: Recommendation, scenarios, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The resulting investment call should be research-more rather than buy. Public evidence is strong enough to
              say Mosyle is not an immature science project: there is a real installed base, transparent list pricing, a
              direct-sales motion, a recent financing event, and a visible secondary-market mark. But price support is
              still thinner than the company-quality narrative. There is no public ARR, no gross margin, no cash or burn
              disclosure, and no full preference stack. The cleanest public comp, Jamf, commands only about twice
              Mosyle's visible mark despite meaningfully larger customer, device, and revenue disclosure. That makes the
              base case a hold-or-track stance around roughly $0.75 billion to $0.95 billion, with the visible Forge
              mark near the upper half of that band. A bear case of about $0.55 billion to $0.70 billion fits any
              scenario where comp discipline, support friction, or a down-round resets expectations. A bull case above
              $1.0 billion exists only if private diligence proves strong retention, software-like margins, and a cap
              table that does not leak most upside to senior securities. Until that packet exists, >$1 billion should be
              treated as expensive, not confirmed.
