      - number: '1.4'
        title: Milestones, Expansion, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Mosyle’s milestone record shows deliberate expansion rather than a static MDM business. The chronology
              starts with a 2012 founding story and a 2015 to 2016 U.S. expansion, then moves into a 2021 partnership
              milestone when Mosyle added Okta and Ping Identity support to Mosyle Auth 2, and a September 2021
              governance milestone when Donlan joined as first COO. The 2022 Apple Unified Platform launch is the
              inflection point where Mosyle stops sounding like a feature vendor and starts sounding like a multi-module
              Apple IT platform. From there the product and channel roadmap keeps broadening: 2023 added AI-powered Zero
              Trust; 2024 launched a dedicated MSP offering with unusually aggressive channel economics; 2024 also
              brought the Assetbots acquisition; 2025 created the AccessMule subsidiary; and 2026 added Mosyle@Home for
              parent controls on school devices. That sequence is important because it shows adjacent product logic
              around the Apple endpoint, not random diversification.


              The caution is that scale and maturity claims run ahead of disclosure quality. Current pages and recent
              releases cite customer counts ranging from 42,000 to 65,000 organizations, more than 20,000 schools, and 7
              million devices, but they do not harmonize the definition or as-of date for those metrics. Public
              materials claim profitability and free cash flow while leaving ARR, revenue run rate, and headcount
              undisclosed. Independent review sources are constructive on value and support but still point to recurring
              execution friction: occasional deployment or update issues, slow or awkward console navigation, thin
              documentation, notification fatigue, and limited community resources. So the public story supports a
              credible, expanding, late-stage private Apple IT vendor, but it also leaves real diligence work
              outstanding on governance, financial depth, exact scale, and the true economics of any 2026 financing or
              secondary event.
