        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Mosyle provides several positive but imperfect sales-efficiency proxies. The strongest are transparent
              list pricing, free-to-paid entry paths, complimentary onboarding, and the claim that direct web-led
              selling dominates the mix. Independent review marketplaces add some support: both GetApp and Software
              Advice show a 4.6 out of 5 rating from 86 reviews, with especially strong value-for-money scores and
              public starting-price signals around $1 per month. Those are useful proxies for price-to-value fit.
              Official traction numbers, however, are messy. Different Mosyle properties variously claim over 47,000
              organizations, almost 50,000 customers, more than 52,000 customer accounts, over 60,000 organizations, and
              over 65,000 organizations worldwide. That inconsistency does not prove inflation, but it does mean public
              scale should be treated as directional rather than precise. The MSP motion adds another efficiency clue:
              Mosyle is willing to sacrifice near-term margin through first-year 100% commissions, ACN credits, and
              centralized billing/reporting because it appears to value partner acquisition and downstream retention
              more than first-year gross profit. At the same time, adverse review signals do exist. GetApp mentions
              app-deployment retries, navigation confusion, and support delays, while PeerSpot's 2026 comparison still
              places Jamf well ahead on support depth and overall market position. So the GTM read is favorable but not
              frictionless.
