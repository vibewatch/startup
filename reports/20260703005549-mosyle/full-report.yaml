      - number: '3.2'
        title: Capability, Packaging, and Entry Pricing
        blocks:
          - type: paragraph
            body: >-
              Mosyle’s strongest surface-level wedge is simple: it still presents unusually low public Apple-device
              pricing relative to better-known peers. Mosyle Business is listed at $1 per device per month, K-12 plans
              are listed at $5.50 to $9.00 per device per year, and Mosyle Fuse MSP advertises aggressive effective
              pricing after commissions. Against that, Jamf’s public starting point in Software Advice is $3.67 per
              month and Jamf’s own pricing page routes larger customers toward demos, localized pricing, and reseller
              quotes. Microsoft Intune starts from a different commercial logic entirely: Intune Plan 1 is $8 per user
              per month, Plan 2 is a $4 add-on, and the $10 Intune Suite pushes the product toward a broader
              endpoint-and-security bundle rather than an Apple-first tool. Hexnode publishes a $4.7 per device per
              month Essentials entry tier, while JumpCloud’s comparison surface shows a $3 monthly starting point. Price
              alone does not settle the buying decision because the bundles differ. Jamf packages Apple management,
              protection, and identity across Jamf Pro, Connect, and Protect. Iru pushes hardest on the
              endpoint-plus-identity-plus-compliance story and adds free migration support. Addigy differentiates with
              live remote control, compliance reporting, and MSP workflows. Workspace ONE emphasizes self-service,
              conditional access, per-app VPN, and patching across every major OS. JumpCloud and Rippling both broaden
              the frame beyond Apple: JumpCloud through identity and directory control, Rippling through HR-led device
              lifecycle orchestration. In short, Mosyle is usually the cheapest credible Apple-first option in public
              entry pricing, but several rivals justify higher spend with broader platform control or stronger
              enterprise distribution.
