companyProfile:
  summary: >-
    Mosyle is a private Apple-focused cybersecurity and IT management vendor headquartered in Winter Park, Florida, with
    operational ties to Brazil. Its Apple Unified Platform combines device management, endpoint security, identity and
    authentication workflows, online privacy/filtering, and app/patch management for businesses, K-12 schools, and Apple
    MSPs. Public sources support strong product coherence, transparent entry pricing, and meaningful scale, but they
    also show inconsistent public customer-count disclosures and limited financial transparency.
