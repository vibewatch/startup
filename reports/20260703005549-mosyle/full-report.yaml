          - type: callout
            title: 'Conviction threshold: current economics plus the full waterfall'
            body: >-
              The minimum package for a constructive buy case near the visible private-market mark is current ARR or
              revenue, gross margin, retention, cash and debt, and a full liquidation waterfall. Without those
              documents, Mosyle can still be good while the price remains under-evidenced.
