            title: Form D history points closer to Forge than to the homepage narrative
            body: >-
              Mosyle's five visible Form D offering notices add up to about $313.6M, close to Forge's $310.63M
              total-funding figure and well above the homepage's $215M story. That does not prove cash actually closed
              at those amounts, but it does prove the public financing narrative still needs reconciliation.
            calloutType: insight
            claimRefs:
              - CV002
              - CV025
