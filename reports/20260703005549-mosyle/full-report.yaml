      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is much narrower than product visibility. Public sources repeatedly identify Alcyr
              Araujo as founder and chief executive officer, and he is the voice attached to the major funding, product,
              and partnership announcements reviewed here. That founder centrality can be a strength because the
              company’s strategic logic is coherent across product, pricing, and go-to-market messaging, but it also
              creates key-person concentration in the external story. The most visible operating-bench upgrade in the
              public record is September 2021, when Mosyle appointed Michael Donlan as its first chief operating officer
              after senior roles at Apple and Microsoft. That hire matters because it signals a deliberate attempt to
              professionalize operations before the larger 2022 scale round and before Mosyle started broadening into
              MSP and adjacent-security motions.


              Beyond that, governance disclosure is thin. The reviewed official pages do not publish a current board
              roster, committee structure, or finance-lead bench, and the market-data sources do not resolve control
              rights or board seats cleanly enough to substitute for official governance materials. What does surface
              publicly is leadership around adjacency businesses: 2024 acquisition coverage says Chad Burggraf continues
              to lead Assetbots, and 2025 AccessMule coverage names Sergio Sousa as executive leader of the new
              subsidiary. That is enough to show Mosyle building separate operating benches for new products, but not
              enough to clear diligence on the core company’s board structure, cap-table control, or succession depth.
              The right reading is that public leadership disclosure is functional and founder-led, not institutionally
              transparent.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
