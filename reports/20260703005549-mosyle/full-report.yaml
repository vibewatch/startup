      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is still provisional. On one hand, the Apple-device-management category is strategic enough
              that Jamf itself has already moved from public-company comp to Francisco Partners-owned asset, which shows
              that strategic or sponsor outcomes are plausible. On the other hand, Mosyle has not published the
              disclosure package that would let outside investors decide whether a sponsor-backed exit, a new preferred
              round, or long-duration independence creates the best risk-adjusted return. The missing items are not
              cosmetic. Investors still need current revenue and gross margin, retention by customer segment, cash and
              runway, debt, and the full liquidation waterfall. They also need a reconciled financing history that
              explains why the company homepage still emphasizes $215 million, Form D filings imply roughly $313.6
              million of offering notices, Forge shows $310.63 million total funding and an $898.96 million valuation,
              and CB Insights shows $348.34 million. Without that package, Mosyle may still be a good company, but the
              price remains under-evidenced.
