          - type: callout
            title: Apple-only focus fits standardized Apple fleets unusually well
            body: >-
              For Apple-dense SMBs, school districts, and MSP-managed fleets, specialization is a product advantage
              because deployment, identity, and security workflows can be tuned to one platform family.
            calloutType: strength
