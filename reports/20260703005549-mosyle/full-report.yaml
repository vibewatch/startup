  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - 2026 price reset
        - Next priced event lands below or only flat to the visible Forge mark
        - Would show that current market participants do not support a premium expansion story.
        - Re-cut the case into the bear band and stop treating ~$899M as stable support.
      - - Revenue proof
        - Management cannot show current ARR or revenue materially validating the present mark
        - Breaks the idea that pricing transparency and customer-count claims convert into monetization quality.
        - Pause underwriting until revenue and retention data are produced.
      - - Support / product quality
        - Support delays, deployment retries, or documentation friction worsen materially
        - Compresses retention and lowers the right multiple for a lower-price vendor.
        - Apply a heavier haircut to the base case and revisit customer references.
      - - Preference stack
        - Senior liquidation rights absorb most proceeds near the base-case band
        - Means enterprise-value upside does not convert into common-equity upside.
        - Do not proceed without a full waterfall model.
      - - Financing clarity
        - Management cannot reconcile official copy, Form D history, and third-party market data
        - Leaves the price anchor itself under question even before economics are tested.
        - Keep the recommendation at research-more and require documentary reconciliation.
    notes: Each trigger is tied directly to valuation transmission, not just generic operating risk.
    claimRefs:
      - CV032
      - CV033
      - CV037
      - CV039
      - CV048
      - CV049
      - CV055
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR / revenue
        - Monthly ARR or revenue bridge through the latest available month
        - Without a live top-line anchor, the public mark cannot be translated into a justified multiple.
        - Request CFO reporting pack and monthly revenue bridge.
      - - Gross margin and support burden
        - Gross margin by segment plus hosting, onboarding, and support-cost detail
        - Needed to judge whether a low-price, high-service strategy still earns software-quality economics.
        - Finance and customer-success diligence backed by QA or QoE review.
      - - Retention quality
        - Logo churn, gross revenue retention, net retention, and downgrades by cohort
        - Determines whether review-site value signals convert into durable cash flow.
        - Cohort retention deck and sampled contract renewals.
      - - Cash, burn, runway, and debt
        - Current cash balance, burn pace, runway model, and debt schedule
        - Changes downside protection and urgency of any new capital raise.
        - Board package, cash-flow statement, and lender documents.
      - - Cap table and liquidation waterfall
        - Preferred stack, option pool, side letters, and modeled waterfall
        - Determines who captures value across all scenario bands.
        - Legal data room plus independently rebuilt waterfall model.
      - - Financing reconciliation
        - Documented explanation of why official copy, Form D notices, Forge, and CB Insights do not match
        - Investors need to know which price anchor is real before negotiating entry.
        - Corporate counsel, finance, and lead-investor diligence session.
    notes: >-
      These are the minimum missing packets before a committee should consider paying anywhere near a premium
      private-market valuation.
    claimRefs:
      - CV019
      - CV025
      - CV026
