      - number: '2.5'
        title: What public evidence still cannot isolate
        blocks:
          - type: paragraph
            body: >-
              The biggest risk in this chapter is false precision. Public sources are good enough to define the
              boundary, show that Mosyle spans at least four buyer segments, and demonstrate that Apple-first management
              sits inside a real software stack with security and identity adjacencies. They are not good enough to
              isolate Mosyle's true Apple-only TAM, SAM, or SOM. No public source in this chapter provides segment-level
              revenue, device mix, region mix, or attach-rate by module.


              Public adoption disclosures are also inconsistent enough that they should be treated as directional rather
              than canonical until management reconciles them. For diligence, the next step is not another public TAM
              page; it is a management evidence pack covering current customer counts, managed-device counts, revenue by
              SMB versus enterprise versus school versus MSP, and attach rates for identity, security, and patch
              modules. Until then, market sizing should be used to bound narratives, not to overfit one exact
              multiple-ready TAM.
            claimRefs:
              - CM041
              - CM042
              - CM045
