      - number: '6.2'
        title: Named customer proof is real but skews toward public-sector and campus operations
        blocks:
          - type: paragraph
            body: >-
              Mosyle does have named, public proof of live deployment, but most of the strongest references come from
              higher-education or school IT-support surfaces rather than enterprise brand-marketing pages. Lafayette
              College says all college-owned Apple devices have been enrolled in MDM since spring 2022 and explicitly
              names Mosyle as its provider. West Chester University says it is moving Apple devices from Workspace ONE
              to Mosyle, including lab and cart workflows. Lane Community College documents both Mosyle Admin On-Demand
              and Mosyle Auth processes for staff and faculty Macs. Western Kentucky University uses Mosyle-backed
              enrollment to automate printer access, and a Penn State MacAdmins session documents Gateway School
              District's migration from Jamf Pro to Mosyle Manager for district Macs and iPads. Landbase adds a
              separate, lower-confidence but still useful independent layer by listing named Mosyle users such as
              Walmart, Stanford University, UC San Francisco, The Nature Conservancy, Yelp, and Press Ganey. The catch
              is that Landbase does not prove production depth, outcomes, or retention, so the highest-quality named
              proof remains operational documentation from education customers.
