company:
  name: Mosyle
chapter:
  number: 1
  title: Company Overview
  summary: Mosyle is a Winter Park, Florida-centered private Apple device management and security vendor whose public materials
    show a coherent Apple-only platform strategy, a founder-led leadership profile, and steady expansion into MSP, asset management,
    and access-management adjacencies. Official sources cleanly disclose a $196M 2022 Series B, but 2026 public databases
    conflict on later financing, investor mix, and valuation, while ARR, headcount, board composition, and the prompt’s Warburg/$1B
    framing remain unresolved in the public record.
sections:
- id: identity-business-model-stage
  title: Identity, Business Model, and Stage
  body: |-
    Mosyle’s core identity is unusually consistent even if some of its operating metrics are not. Across its homepage, business site, and school site, the company describes itself as an Apple-only platform that brings device management, security, privacy, identity, and application control together for organizations that use Macs, iPhones, iPads, Apple TVs, and related Apple endpoints. The business site leans heavily into the claim that Mosyle is more than a conventional MDM tool: it highlights integrated endpoint security, encrypted DNS filtering, macOS identity workflows, and application patching, while the school site shows the same Apple-first architecture adapted to K-12 workflows and pricing. Pricing and packaging reinforce that product identity. Mosyle Business advertises a free entry point for up to 30 devices, a $1 per-device-per-month premium business plan, and separate Mosyle Fuse pricing, while the education site publishes annual per-device tiers.

    Multiple sources support Winter Park, Florida as the company’s current headquarters, but the longer origin story is more complex. TechCrunch says Alcyr Araujo started Mosyle in Brazil in 2012, pushed into the U.S. market in 2015, and moved operations to the United States in 2016. The school site adds that Mosyle began as an iPad-first learning management system before pivoting into Apple MDM for schools, while the MSP site frames 2016 as the start of the current growth era. Careers pages then show present-day hiring tied to Florida and Brazil, which suggests the company’s real operating model is a Winter Park-centered but geographically distributed organization. Taken together, the public record supports a late-stage private Apple IT platform company with clear product identity and legal footprint, but not one that discloses a full company profile with audited operating facts.
