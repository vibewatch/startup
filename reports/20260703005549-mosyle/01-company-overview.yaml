- id: funding-valuation-stakeholders
  title: Funding, Valuation, and Stakeholders
  body: |-
    The cleanest fully disclosed financing event in the public record remains the official May 2022 Series B. Business Wire, 9to5Mac, TechCrunch, and CRN all align on the headline facts: Mosyle raised $196 million, Insight Partners led, StepStone Group and prior investors including Elephant and Album VC participated, and the company tied that capital event to the launch of its Apple Unified Platform. Those same 2022 sources support a picture of meaningful scale at the time, with more than 32,000 clients, more than 5 million managed devices, and triple-digit sales growth since 2020. What they do not provide is a valuation or a durable set of audited operating metrics. That omission matters because later 2026 market-data sources introduce a conflicting funding history rather than simply extending the official 2022 narrative.

    Specifically, CB Insights shows a $99.99 million Series B-III dated 2026-04-30 and $348.34 million in lifetime funding, while Forge shows a $100 million Series B-3 dated 2026-03-09, $310.63 million in total funding, and an $898.96 million post-money valuation. Those two databases also keep Album VC and Elephant visible in the investor base, alongside references to Insight, StepStone, and Broadview. That reviewed public evidence does not support the prompt’s Warburg Pincus and $1 billion framing. Instead, it suggests that if a 2026 financing or secondary event occurred, the public record still needs reconciliation on round date, size, investor mix, and valuation. The company’s own current business pages further complicate the capital story by saying the previously disclosed $215 million was used partly to facilitate exits for short-term shareholders rather than to fund survival, which implies secondary liquidity but still does not provide formal transaction detail.
