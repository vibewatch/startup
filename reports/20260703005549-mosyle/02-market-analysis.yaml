- id: public-gaps
  title: What public evidence still cannot isolate
  body: |-
    The biggest risk in this chapter is false precision. Public sources are good enough to define the boundary, show that Mosyle spans at least four buyer segments, and demonstrate that Apple-first management sits inside a real software stack with security and identity adjacencies. They are not good enough to isolate Mosyle's true Apple-only TAM, SAM, or SOM. No public source in this chapter provides segment-level revenue, device mix, region mix, or attach-rate by module.

    Public adoption disclosures are also inconsistent enough that they should be treated as directional rather than canonical until management reconciles them. For diligence, the next step is not another public TAM page; it is a management evidence pack covering current customer counts, managed-device counts, revenue by SMB versus enterprise versus school versus MSP, and attach rates for identity, security, and patch modules. Until then, market sizing should be used to bound narratives, not to overfit one exact multiple-ready TAM.
  claimRefs:
  - CM041
  - CM042
  - CM045
tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Apple device management core
    - Enrollment, policies, compliance, remote actions, inventory, app deployment, OS updates, lock/wipe for managed Apple endpoints
    - Apple hardware purchases, carrier services, help-desk labor, generic PC management
    - IT admin, workplace IT, endpoint team; payer is IT or operations budget
    - Core monetization layer defined by Apple and substitute MDM docs
  - - Apple endpoint security
    - Mac and mobile threat protection, compliance hardening, content or web protection, zero-trust policy enforcement on Apple devices
    - Full SIEM/SOC budgets, network firewalls, broad MDR unrelated to endpoints
    - Security leader, CISO delegate, endpoint security manager; payer is security budget
    - Important expansion layer that lifts ACV above base MDM
  - - macOS identity and SSO
    - Mac login, local-account lifecycle, password sync, privilege management, IdP-backed access workflows
    - General workforce IAM or CIAM not tied to managed Apple devices
    - Identity, security, or workplace engineering; payer is security or IT budget
    - Adjacency where Mosyle competes with Jamf Connect or broader IAM stacks
  - - Apple app, patch, and privacy tooling
    - App distribution, patch catalogs, update deadlines, Apple-specific filtering or privacy controls
    - Generic software asset management, telecom charges, non-Apple patching suites
    - Endpoint or IT operations; payer is IT operations budget
    - Common attach motion after MDM lands
  - - MSP multi-tenant Apple admin
    - Centralized tenant management, inherited policies, per-customer reporting, migration support, automated billing support
    - Labor-only managed services without software control plane
    - MSP owner or service manager; payer is the MSP, then rebilled to end customers
    - Channel-specific layer that broadens distribution into smaller business fleets
  - - Excluded broad adjacencies
    - Broader UEM, IAM, and endpoint-security ceilings are useful reference points only
    - Treating all UEM, IAM, or endpoint-security spend as Mosyle-reachable TAM
    - Analyst or investor framing, not an operational buyer budget
    - Prevents inflated TAM claims that ignore Apple-only scope
  notes: Rows separate Mosyle's Apple-only monetization core from broader UEM, IAM, and endpoint-security adjacencies. Included and excluded spend are analytical synthesis grounded in Apple, Microsoft, analyst, and competitor materials.
