- id: buyers-and-segments
  title: Buyer, user, and payer split across SMB, enterprise, K-12, and MSP
  body: |-
    Mosyle's buyer map is segmented more by operating model than by a single universal IT persona. In SMB, the economic buyer is often an owner, office manager, or lean IT admin who wants low-cost remote setup, inventory, passcodes, encryption, and patching without enterprise overhead. Review sites and Jamf's SMB positioning both support a price-sensitive, operations-first motion. In enterprise, the buyer shifts toward endpoint, workplace, or security leadership that cares about zero-touch enrollment, compliance, identity-backed access, and deployment of new or wiped devices through Apple Business and MDM policy.

    K-12 looks different again. Apple and Mosyle both frame school IT around Apple School Manager, shared-device workflows, roster or identity sync, bulk app distribution, content filtering, and district-scale remote control. The everyday users are teachers, students, and education IT teams, but the budget owner is usually district or school technology administration. MSPs are a fourth segment, not just a channel detail: both Mosyle and Addigy position MSP value around multi-tenancy, inherited policies, migration support, per-tenant reporting, and centralized billing. Jamf adds a fifth nuance through channel economics, disclosing that roughly 62% of ARR is channel-facilitated. Across all four Mosyle-relevant segments, the payer tends to be the organization rather than the end user, but the adoption trigger changes sharply: low-cost automation in SMB, zero-touch governance in enterprise, classroom-scale deployment in K-12, and labor leverage in MSPs.
