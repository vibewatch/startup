callouts:
- calloutType: insight
  title: Boundary discipline is the real work in this market
  body: Mosyle spans Apple MDM, Apple endpoint security, and Mac identity, but those budgets should not be swapped interchangeably when someone says the market is “large.”
  claimRefs:
  - CM005
  - CM040
  - CM045
- calloutType: strength
  title: Apple-only focus fits standardized Apple fleets unusually well
  body: For Apple-dense SMBs, school districts, and MSP-managed fleets, specialization is a product advantage because deployment, identity, and security workflows can be tuned to one platform family.
  claimRefs:
  - CM029
  - CM033
  - CM034
- calloutType: risk
  title: Mixed-fleet consolidation is the main strategic headwind
  body: Buyers that want one suite across Windows, Android, and Apple can rationalize on broader UEM stacks, which narrows Mosyle's practical share even if broad cyber or identity TAMs look attractive.
  claimRefs:
  - CM030
  - CM040
  - CM046
- calloutType: recommendation
  title: Ask management for the KPI bridge before underwriting share
  body: Public market pages are enough to bound the opportunity, but not enough to size Mosyle's segment mix or attach-rate economics. Reconciled device, customer, and ARR bridges are the next diligence step.
  claimRefs:
  - CM041
  - CM042
  - CM045
