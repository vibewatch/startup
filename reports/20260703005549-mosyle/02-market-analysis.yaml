  evidenceGaps:
  - type: missing-source
    severity: material
    topic: apple-only-tam
    missingEvidence: An independent public estimate for the Apple-only device-management, identity, and endpoint-security market that separates Apple-first spend from broader UEM or IAM spend.
    whyItMatters: Without an Apple-only TAM or SAM, public market numbers can only bound Mosyle's opportunity rather than size it precisely.
    diligencePath: Request management's internal TAM model, or obtain paid IDC/Gartner/Canalys Apple-device management research with methodology disclosure.
    relatedQuestionRefs:
    - QM011
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-attach
    missingEvidence: Segment-level customer, device, and revenue mix across SMB, enterprise, K-12, and MSP, plus attach rates for security, identity, and patch modules.
    whyItMatters: Public positioning shows breadth, but valuation depends on which segments and modules actually monetize at scale.
    diligencePath: Ask management for a segment bridge showing devices, logos, ARR, and module attach by SMB, enterprise, K-12, and MSP cohorts.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: public-kpi-reconciliation
    missingEvidence: A current reconciled KPI table that explains why Mosyle cites 52k, 60k, and 65k organization or account counts and 7 million versus unspecified millions of managed devices.
    whyItMatters: Conflicting public adoption counts weaken confidence in vendor-scale proxies and can distort bottom-up category sizing.
    diligencePath: Request the latest board or operating-review KPI bridge with definitions for organizations, accounts, schools, and devices.
