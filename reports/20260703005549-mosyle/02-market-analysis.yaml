- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Zero-touch enrollment and remote policy control
    - Tailwind
    - Current
    - Makes Apple-first management easier to justify because IT can deploy new devices without desk-side setup
    - Measure how much of Mosyle's new-logo motion depends on ADE-ready devices versus manual enrollment
  - - Identity and security attachment
    - Tailwind
    - Current to near-term
    - Expands wallet share beyond base MDM into login, privilege, and endpoint-protection modules
    - Request attach rates for identity, security, and privacy modules by segment
  - - Remote work, BYOD, and mobile workforce growth
    - Tailwind
    - Current to near-term
    - Supports continued budget for MDM and endpoint protection even outside classic office settings
    - Quantify the share of Mosyle deployments that are user-owned versus company-owned Apple devices
  - - Education deployment complexity
    - Tailwind
    - Current
    - School IT needs shared-device, roster, and content workflows that generic MDM products may under-serve
    - Request school retention and expansion metrics by district size and device mix
  - - MSP multi-tenancy and channel leverage
    - Tailwind
    - Current
    - Allows one software control plane to reach many smaller end customers through intermediaries
    - Request MSP contribution to ARR, device count, and churn compared with direct business customers
  - - Apple-only scope in mixed fleets
    - Headwind
    - Persistent
    - Mixed Windows or Android environments can consolidate on a broader UEM suite instead of buying a separate Apple-first tool
    - Segment pipeline by Apple-only versus mixed-fleet accounts
  - - Operational execution friction
    - Headwind
    - Persistent
    - Review-site complaints about app deployment, updates, navigation, or support resources can slow expansion despite strong pricing
    - Request support SLAs, deployment success metrics, and product-gap roadmap for large fleets
  - - Lack of public Apple-only TAM and inconsistent vendor KPIs
    - Headwind
    - Immediate diligence issue
    - Weakens confidence in clean top-down valuation narratives and bottom-up adoption proxies
    - Request a reconciled KPI bridge and management TAM methodology before underwriting market-share assumptions
  notes: Direction is relative to Mosyle's market opportunity. The table mixes demand creation and adoption friction because both shape how quickly Apple-first management, identity, and security budgets can monetize.
