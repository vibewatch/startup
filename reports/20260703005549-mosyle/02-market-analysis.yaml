- id: sizing-lenses
  title: 'Multiple sizing lenses: preserve the spread, do not force one TAM'
  body: |-
    Public market data supports a healthy Apple-management narrative, but it does not support one clean TAM sentence. The narrowest broad-market anchor is mobile device management: MarketsandMarkets places MDM at USD 6.9 billion in 2022 growing to USD 22.0 billion by 2027. That is the closest public category to Mosyle's device-management core, but it is still too broad because it includes Android and Windows vendors and services. The next layer up is endpoint security, where MarketsandMarkets shows a USD 17.76 billion 2026 market and Research and Markets shows USD 21.9 billion in 2025 rising to USD 47.1 billion by 2034. Identity is broader again: MarketsandMarkets sizes IAM at USD 25.96 billion in 2025 and USD 42.61 billion in 2030.

    Those figures are not contradictions in the sense that one must be wrong; they are contradictions if used interchangeably in a Mosyle memo. Research and Markets makes the inflation path explicit by defining UEM to include MDM, IAM, and endpoint security together. The best public floor for Apple-only monetization is not an analyst TAM but Jamf's operating scale: 76,500 customers, 33.2 million deployed devices, and USD 646.0 million of ARR at year-end 2024. Mosyle's own disclosures prove demand breadth but not a canonical market size, because its public counts vary from 52,000 customer accounts to over 60,000 or 65,000 organizations and from 7 million devices to vaguer “millions.” The honest framing is therefore layered: Apple-first MDM is the core, identity and endpoint security are monetizable adjacencies, and broader UEM or IAM numbers are ceiling lenses rather than a direct TAM.
