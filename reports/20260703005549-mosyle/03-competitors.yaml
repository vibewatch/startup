chapter:
  number: 3
  title: Competitors
  summary: Mosyle competes best as a low-cost, Apple-only integrated platform for SMB, K-12, and MSP buyers, but Jamf, Iru, Addigy, Intune, Workspace ONE, JumpCloud, Hexnode, and Rippling each threaten it through stronger distribution, broader platform control, or identity and channel lock-in. The competitive moat looks durable in Apple-first niches and much less durable in mixed-OS enterprise environments where bundling and ecosystem control outweigh raw Apple feature depth.
sections:
- id: landscape-overview
  title: Direct and Adjacent Competitive Landscape
  body: 'Mosyle competes first against Apple-specialist platforms, not against generic endpoint management in the abstract. Jamf remains the most entrenched direct incumbent, with a deeper enterprise reputation, more third-party review volume, and materially higher mindshare in MDM research. Iru, the platform formerly known as Kandji, is now positioning more broadly around endpoint, identity, and compliance, which pushes it closer to Microsoft-style platform breadth while retaining Apple credibility. Addigy is the most MSP-native Apple alternative: it leads with live control, continuous compliance, and single-account multi-tenancy rather than K-12 or broad enterprise bundling. A second ring of competition comes from mixed-OS suites such as Microsoft Intune, Workspace ONE, Hexnode, and JumpCloud. These products are not as Apple-pure in messaging as Mosyle, but they solve the same buyer job when IT wants one control plane across Windows, macOS, mobile, identity, and access. Rippling is adjacent
    rather than directly Apple-specialized: its appeal is HR-to-IT lifecycle automation, device logistics, and offboarding rather than best-in-class Apple administration. The practical status quo substitute is Apple Business plus internal scripting and point tools. That path can work for small fleets, but Apple’s own deployment guidance still assumes a separate device-management service, which leaves integration and compliance work on the customer.'
