  rows:
  - - Mosyle
    - Apple-only direct peer
    - 65,000+ organizations claimed; 20,000+ schools; 52,000 accounts / 7M devices claimed
    - SMB, K-12, Apple-focused IT teams, MSPs
    - Lowest public Apple-device pricing plus integrated Apple security, identity, filtering, and patching
    - Cross-platform breadth is limited versus Intune, Workspace ONE, JumpCloud, and Rippling
  - - Jamf
    - Apple-only incumbent
    - 545 Software Advice reviews; 12.3% PeerSpot MDM mindshare; enterprise-heavy install base
    - Enterprise, education, larger Apple programs
    - Deep Apple administration brand, support motion, and mature management/security stack
    - Higher public starting price and quote-led services motion can widen TCO
  - - Iru (formerly Kandji)
    - Apple-first expanding to broader platform
    - 6,000+ companies claimed; 700+ G2 reviews claimed; 487 Software Advice reviews
    - SMB to mid-market security-conscious teams
    - Unified endpoint, identity, and compliance narrative with migration tooling
    - Public list pricing is still opaque in retained sources
  - - Addigy
    - Apple-first MSP specialist
    - Scale undisclosed in retained sources
    - MSPs and lean IT teams managing many Apple fleets
    - Live remote control, continuous compliance, single-account multi-tenancy, overlay option via Amplify
    - Quote-based pricing and narrower direct education narrative than Mosyle
  - - Microsoft Intune
    - Cross-platform incumbent
    - Included in many Microsoft 365 enterprise licenses
    - Mixed-OS enterprises already standardized on Microsoft
    - Powerful bundle with Entra identity, endpoint security add-ons, and broad OS coverage
    - Apple-specific depth is secondary to Microsoft-wide standardization
  - - Workspace ONE UEM
    - Cross-platform enterprise incumbent
    - Official case studies cite 60,000-employee deployment and 12,000-device iOS migration
    - Large enterprise and regulated environments
    - Multi-tenant architecture, self-service, conditional access, per-app VPN, patching
    - Public list pricing was not confirmed in retained official materials
  - - Hexnode UEM
    - Cross-platform challenger
    - 153 Software Advice reviews; public $4.7/device/month Essentials tier
    - SMB and mid-market UEM buyers
    - Broad OS coverage, kiosk/geofencing/web filtering, MSP billing option
    - Apple-only specialization is not the core story
  - - JumpCloud
    - Identity-led adjacent competitor
    - 289 Software Advice reviews; official MSP and reseller ecosystem
    - SMBs and MSPs wanting one directory-plus-device stack
    - Directory, MFA, passwordless access, device management, partner ecosystem
    - Apple depth is subordinated to broader identity-control agenda
  - - Rippling
    - HRIT-led adjacent competitor
    - Scale not disclosed on retained device-management page
    - Companies that want HR, device logistics, and IT unified
    - Automated purchase, provisioning, warehousing, offboarding, and cross-OS controls
    - Not positioned as an Apple-specialist administration leader
  - - Apple-native status quo / internal build
    - Status quo substitute
    - Apple provides deployment primitives, not a full stack
    - Small fleets or teams willing to assemble tools internally
    - Low vendor spend and direct use of Apple deployment model
    - Internal IT absorbs integration, compliance, patch, and support burden
  notes: Scale signals mix official company claims and independent review-marketplace footprints. Unknown means the retained public sources did not provide a reliable figure during this run.
