- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Diligence ask
  rows:
  - - Low Apple-only list pricing is Mosyle’s main wedge
    - Larger buyers may still prefer bundle economics from Intune or identity-led suites
    - High
    - Mosyle public list pricing is far below Intune, JumpCloud, Jamf, and Hexnode entry points
    - Request win-rate by segment and competitor to see whether low list price actually changes close rates
  - - Apple-first product depth protects Mosyle in specialist workflows
    - Cross-platform standardization can outweigh Apple depth in mixed estates
    - High
    - Intune, Workspace ONE, JumpCloud, Hexnode, and Rippling all lead with broader OS or lifecycle coverage
    - Break pipeline by Apple-only versus mixed-OS customer to test where Mosyle really wins
  - - K-12 specialization is a durable niche
    - Jamf and Microsoft still compete where districts want larger communities or broader existing contracts
    - Medium
    - Mosyle’s education pricing and 20,000-school claim are strong, but Jamf remains deeply entrenched in education procurement
    - Request renewal and expansion data by district size and competitor replacement history
  - - MSP economics can create a protected channel
    - Addigy and JumpCloud also push MSP-native multi-tenancy and partner ecosystems
    - High
    - Mosyle MSP commissions are aggressive, but Addigy and JumpCloud both market multi-tenant MSP operations explicitly
    - Compare partner count, gross margin, and attach rates for MSP channel versus direct sales
  - - Integrated Apple modules increase switching cost
    - Addigy Amplify and Iru migration tooling make partial migration or overlay adoption easier
    - Medium
    - Addigy openly supports overlaying incumbent MDMs; Iru advertises migration within days
    - Ask how many competitive losses are full rip-and-replace versus partial multi-home outcomes
  - - Independent review sentiment supports value-for-money positioning
    - Review volume and mindshare still favor Jamf and Iru, while G2 exposes product-support gaps
    - High
    - Jamf leads 2026 PeerSpot mindshare; Iru review base is much larger; G2 mentions screen-sharing and KB gaps for Mosyle
    - Review cohort-level NPS, ticket response metrics, and community/KB investment roadmap before underwriting moat durability
  notes: Severity is a qualitative underwriting judgment based on retained sources as of the run date. Unknown contract economics and private win/loss data remain open diligence items.
