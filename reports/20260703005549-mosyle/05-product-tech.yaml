- id: architecture-deployment-and-dependencies
  title: Architecture, deployment model, and dependencies
  body: 'The architecture is partly Mosyle-owned and partly inherited from Apple. Apple’s deployment model still provides the base primitives: Automated Device Enrollment through Apple Business or Apple School Manager, enrollment and configuration profiles, APNs-backed command delivery, and device reachability to Apple hosts. Mosyle layers its own cloud control plane, lightweight macOS agent, iOS and iPadOS apps, policy automation, app catalog, and identity workflows on top of those primitives. That is why the business site can credibly claim it augments Apple’s MDM protocol rather than replacing it. Identity is similarly layered. Mosyle Auth 2 promises local-account creation, SSO, device 2FA, and support for Google, Microsoft, Okta, Ping, and multiple AD variants, but Apple’s own Platform SSO documentation makes clear that these experiences still depend on IdP-compatible extensions, network reachability, and device-management support at the OS level. The practical implication is that Mosyle’s
    automation can simplify deployment and day-two operations, yet critical reliability and login behavior still depend on Apple framework changes, APNs health, IdP integrations, and customer network design. The product therefore looks tightly integrated, but not self-sufficient in the way a fully vertically owned endpoint stack would be.'
