  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-compliance-attestations
    missingEvidence: A public trust-center page or downloadable SOC 2, ISO 27001, privacy, or audit-assurance artifact tied directly to Mosyle.
    whyItMatters: Without third-party assurance artifacts, security buyers must rely mainly on product-feature claims and sales follow-up rather than published proof.
    diligencePath: Request Mosyle’s latest SOC 2 / ISO package, DPA, subprocessor list, and any external audit summaries from the security or legal team.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: public-reliability-history
    missingEvidence: Historical uptime, incident archive, SLA commitments, and recovery-performance metrics for the Mosyle control plane.
    whyItMatters: A green status page snapshot does not show whether outages, degraded Apple integrations, or login incidents are rare or chronic.
    diligencePath: Request 12-24 months of uptime reports, incident postmortems, SLA terms, and support-response metrics segmented by product surface.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: architecture-depth
    missingEvidence: Detailed public or customer-shareable architecture documentation covering agent behavior, update channels, data flow, and security boundaries.
    whyItMatters: The product clearly depends on Apple, IdP, and Mosyle-owned components, but public material is too marketing-led to fully underwrite technical isolation and failure domains.
    diligencePath: Request architecture diagrams, data-flow diagrams, platform dependency maps, and sample admin runbooks from product engineering.
    relatedQuestionRefs:
    - QE007
    - QE011
    relatedTableRefs:
    - TE003
  - type: stale
    severity: minor
    topic: new-module-maturity
    missingEvidence: Post-launch adoption, attach, retention, and support metrics for newer surfaces such as Fuse MSP, Assetbots integration, AccessMule, and Mosyle@Home.
    whyItMatters: Launch cadence is visible, but investors still cannot tell which newer modules are strategic growth engines versus experimental adjacency.
    diligencePath: Request cohort-level adoption dashboards, attach rates, churn, roadmap milestones, and customer references for each newer module.
    relatedQuestionRefs:
    - QE015
    - QE016
    - QE024
    relatedTableRefs:
    - TE001
