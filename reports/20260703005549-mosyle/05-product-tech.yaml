tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Apple device management core
    - IT admin / endpoint team
    - Mature and core across all surfaces
    - Apple-only workflow density plus automated ongoing management
    - Need module-level usage mix and attach by segment
  - - Endpoint security (Fuse / OneK12 security set)
    - Security admin / IT generalist
    - Mature on business and school surfaces; still expanding through 2023-2025 launches
    - Integrated with device management instead of sold as a separate console
    - Need efficacy data, detection rates, and paid attach by module
  - - Online privacy and DNS security
    - Security admin / school IT
    - Mature feature family; marketed as always-on native encrypted DNS
    - Apple-specific deployment and filtering without extra appliance setup
    - Need public evidence on policy granularity, false positives, and renewal rates
  - - Auth 2 / identity management
    - IT admin / IAM admin
    - Mature for supported IdPs; deployment caveats remain OS and IdP dependent
    - macOS login-window control plus Apple-specific SSO workflow
    - Need proof of large-scale deployments and failure-recovery behavior
  - - Apps & patch management
    - Endpoint admin / help desk
    - Mature and broadly packaged
    - App Store, PKG, DMG, temporary apps, and app catalog in one workflow
    - Need patch coverage statistics and third-party app success rates
  - - Education workflows / OneK12 / Mosyle@Home
    - School IT / teacher / parent
    - Mature for core classroom flows; 2026 family controls are newer
    - Purpose-built K-12 controls, Shared iPad, teacher tools, and parent layer
    - Need adoption split between legacy school MDM and newer home features
  - - Fuse MSP control plane
    - MSP owner / technician
    - Newer but commercially aggressive since 2024 launch
    - MSP-level policies plus per-customer exceptions and centralized billing
    - Need churn, reseller uptake, and margin durability by MSP cohort
  - - Assetbots adjacency
    - Ops / asset owner / IT admin
    - New adjacency since 2024 acquisition
    - Two-way sync with devices, users, and assignments broadens workflow beyond endpoint policy
    - Need roadmap timing for deeper native integration into Mosyle admin flows
  - - AccessMule adjacency
    - SMB admin / ops / security
    - New adjacency since 2025 launch
    - Extends Mosyle adjacency into access governance and shared credential workflows
    - Need evidence of cross-sell, unified billing, and shared identity roadmap
  notes: Rows distinguish core Mosyle modules from newer adjacent assets; maturity labels reflect retained public evidence, not internal usage or revenue contribution.
