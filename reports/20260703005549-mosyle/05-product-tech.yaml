- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Apple Business / Apple School enrollment
    - Assign organization-owned devices into a management flow
    - Apple portals, reseller assignment, ADE support
    - Apple-side changes or token issues can block zero-touch setup
  - - Enrollment and configuration profiles
    - Deliver device and user settings to Apple endpoints
    - Apple profile model and supervision state
    - Mis-scoped profiles or removable profiles weaken policy consistency
  - - APNs communication path
    - Carries commands and state transitions to devices
    - Apple Push Notification service plus network reachability
    - Certificate expiry or blocked Apple hosts reduces command reliability
  - - Mosyle cloud control plane
    - Admin UI, policy orchestration, reporting, and automation
    - Mosyle SaaS availability and backend operations
    - Limited public SLA history makes resilience hard to benchmark
  - - Lightweight macOS agent and iOS/iPadOS apps
    - Augment Apple-native controls and automate endpoint actions
    - Mosyle client software plus OS compatibility
    - Agent regressions or OS changes can affect feature parity across platforms
  - - IdP and SSO integration layer
    - Maps work credentials into Mac login and device trust workflows
    - Okta, Ping, Microsoft 365, Google, AD variants, Apple Platform SSO behavior
    - Login experience can fail if IdP, network, or extension support is incomplete
  - - App catalog and package management
    - Installs, scopes, hosts, and patches applications
    - App Store, PKG/DMG workflows, hosting, package metadata
    - Third-party apps and update workflows can still require retries or support help
  - - MSP policy and billing plane
    - Applies shared policies and automates monthly license billing
    - Customer tenant separation and billing exports
    - Over-centralization can break tenant-specific requirements if exceptions are missed
  notes: This architecture table separates Apple-owned primitives from Mosyle-owned control layers to show where integration benefit and dependency risk sit.
