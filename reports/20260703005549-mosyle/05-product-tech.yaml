- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Mosyle solution
  - Measurable benefit
  - Limitation
  rows:
  - - Enroll new Apple devices
    - Use Apple Business or School Manager plus an MDM to supervise devices from first boot
    - Mosyle layers zero-touch enrollment, policy assignment, and ongoing management on Apple enrollment primitives
    - Lower setup labor and faster time to managed state
    - Still depends on Apple enrollment and APNs prerequisites
  - - Secure Macs and mobile devices continuously
    - Coordinate MDM, AV, compliance scripts, and web filtering separately
    - Mosyle packages hardening, AV, zero trust, DNS filtering, and privilege controls beside MDM
    - Fewer tools and less policy drift for Apple-only estates
    - Independent assurance and efficacy disclosures are limited
  - - Bind device login to company identity
    - Rely on separate IdP tooling and manual Mac account management
    - Auth 2 and Platform-SSO-style flows tie Mac login to supported IdPs
    - Reduces password sprawl and can standardize login behavior
    - Network and IdP dependencies remain material at login and FileVault stages
  - - Patch apps and OS versions
    - Mix App Store, package scripts, and manual follow-up
    - Mosyle combines App Store, app catalog, PKG, DMG, and patch workflows
    - Centralized patching for Apple fleets with less scripting overhead
    - Third-party reviews still cite occasional app deployment retries
  - - Run classroom or district device operations
    - Piece together generic MDM with school-specific routines
    - Mosyle adds teacher controls, Shared iPad, parental controls, and school-safe filtering
    - Closer fit to K-12 operating routines
    - Public proof on advanced-school-feature adoption is limited
  - - Onboard many small MSP customers
    - Recreate policies and billing logic per tenant
    - Fuse MSP applies MSP-level profiles across tenants while leaving exceptions where needed
    - Faster customer setup and consolidated billing
    - Critical integrations still need customer-specific handling
  - - Migrate from another Apple MDM
    - Often unenroll and re-enroll, with trial friction and possible downtime
    - Mosyle offers free trials, migration help, and markets Apple OS 26 migration assistance
    - Lower switching friction and better side-by-side testing
    - The no-wipe migration promise is still mostly company-claimed public evidence
  - - Extend control after devices go home
    - School IT either keeps strict control or loses visibility after hours
    - Mosyle@Home transfers approved control to parents after school hours
    - Adds parent visibility without abandoning school supervision
    - The 2026 feature is new and long-term adoption is not yet public
  notes: Benefits are workflow outcomes implied by retained materials and reviews; they are not audited performance claims.
