- id: deployment-reliability-support-and-roadmap
  title: Deployment, reliability, support, and roadmap
  body: 'Public deployment and support signals are unusually explicit for a private endpoint vendor. Mosyle repeatedly markets complimentary onboarding, free trials, migration credits, and fast support as integral to product success, not peripheral services. The 2026 business surface further claims Apple OS 26 native migration can reduce wipe and downtime when switching MDMs, which matters because Microsoft’s own Intune documentation still describes unenroll-and-reenroll as the normal baseline when devices move between providers. On reliability, the retained status page was green at fetch time, but the public evidence does not extend much further: no incident history, uptime trend, or SLA reporting surfaced in retained materials. Roadmap visibility is better than operational transparency. The newsroom and launch set show a steady cadence from AI scripting and Automated Zero Trust in 2023, to Fuse MSP and Assetbots in 2024, to AccessMule and beta support for Apple’s fall management updates
    in 2025, and Mosyle@Home in 2026. That pattern suggests a product organization willing to expand the surface area quickly across adjacent workflows. The trade-off is that launch volume is easier to verify than maturity, attach rates, or enterprise-hardening depth for each new module.'
