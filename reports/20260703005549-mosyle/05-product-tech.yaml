- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Automated hardening and compliance scanning
    - Publicly marketed as available
    - Business and school Apple endpoints
    - No public benchmark coverage map or remediation efficacy data retained
  - - Next-generation Mac antivirus / Zero Trust
    - Publicly marketed; Zero Trust launched in private beta in 2023
    - macOS security layer
    - No independent test results or broad GA date surfaced
  - - Encrypted DNS filtering and web security
    - Publicly marketed as integrated and always-on
    - iOS, iPadOS, and macOS privacy/security workflows
    - No public false-positive or threat-blocking metrics surfaced
  - - Privilege management / Admin On-Demand
    - Publicly marketed as part of security set
    - macOS local admin and elevation control
    - Need role-policy detail and audit export examples
  - - Audit-oriented logs and security reports
    - Publicly marketed on school and review surfaces
    - Compliance and reporting workflows
    - No public example pack or attestation mapping retained
  - - Complimentary onboarding and support
    - Repeatedly marketed and praised in reviews
    - Deployment success and day-two support
    - Support depth versus Jamf still looks weaker in practitioner comparison
  - - Operational status visibility
    - Public status page was green at fetch time
    - Current service-health signal
    - No retained incident history, uptime trend, or SLA reporting surfaced
  - - Central trust and compliance surface
    - Fragmented across microsites; several generic top-level pages 404ed
    - Buyer due diligence and assurance review
    - No retained public SOC 2, ISO 27001, or unified trust-center artifact
