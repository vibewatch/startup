  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway model, and any debt or credit agreements.
    whyItMatters: Without balance-sheet and burn data, investors cannot test whether Mosyle truly controls its own destiny or needs another financing despite the optimistic narrative.
    diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, and 18-24 month operating plan from management.
    relatedQuestionRefs:
    - QI015
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Actual contracts showing discounts, billing cadence, implementation fees, renewal uplift, and revenue-recognition treatment by product line.
    whyItMatters: List pricing and promotional credits are not enough to determine revenue quality, realized ARPU, or the durability of Mosyle's low-price strategy.
    diligencePath: Review a sample of recent SMB, enterprise, school, and MSP agreements plus an internal pricing waterfall.
    relatedQuestionRefs:
    - QI006
    - QI023
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-conflict
    missingEvidence: A management-confirmed cap table or financing schedule reconciling official copy, SEC Form D, CB Insights, and Forge for 2026 total capital raised and valuation.
    whyItMatters: Public databases disagree on lifetime funding totals, round timing, and valuation, which directly affects any capital-adequacy or dilution view.
    diligencePath: Request the board financing history, Form D backup, and latest cap-table summary and reconcile them line by line with public data providers.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: ARR, current revenue growth, gross margin, CAC payback, NRR, churn, customer concentration, and support cost by segment.
    whyItMatters: These are the core metrics needed to judge whether Mosyle's low-price, high-support strategy scales into durable software economics.
    diligencePath: Obtain a monthly KPI pack, cohort tables, support cost allocations, and a segment-level P&L bridge.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
