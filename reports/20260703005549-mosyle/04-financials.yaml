- id: cost-structure-margin-drivers-and-capital-adequacy
  title: Cost structure, margin drivers, and capital adequacy
  body: 'Mosyle''s own narrative is that cost discipline is structural: the company says it develops software in-house on an integrated cloud-native stack, sells mostly direct, avoids heavy field-sales expense, and uses prepaid billing mechanics that help working capital. Those are real positives if true. But the same public record also shows costs that are easy to underappreciate. Free onboarding and high-touch support imply customer-success expense. The MSP channel explicitly gives away first-year economics through 100% commission and ACN credits. Assetbots and AccessMule show continued expansion into adjacent workflows, which can expand wallet share but also add integration, support, and product-investment burden. Because Mosyle does not publish a gross margin bridge, the cleanest public proxy comes from Jamf''s 2024 10-K: a scaled Apple-management peer still spends heavily on customer success, third-party hosting, commissions, and marketing despite being overwhelmingly subscription-driven.
    Capital adequacy is even harder to pin down. Official copy still says Mosyle has raised over $215 million and did not need the money for survival, while the 2026 Form D discloses an offering amount of just under $100 million and public databases disagree sharply on total lifetime capital raised. CB Insights says $348.34 million; Forge says $310.63 million and provides a March 2026 valuation signal of $898.96 million. No reviewed public source discloses cash, burn, runway, or debt, so the balance-sheet story is more narrative than verified.'
