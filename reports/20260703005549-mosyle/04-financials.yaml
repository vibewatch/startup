- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Customer-count scale
    - Official claims range from 47,000 organizations to 65,000 organizations or ~52,000 customer accounts
    - Medium
    - Installed base is the best public proxy for recurring seat density and renewal opportunity
    - Reconcile active paying accounts, free accounts, schools, MSP subaccounts, and managed-device counts
  - - Value-for-money signal
    - 4.6/5 overall and ~4.8/5 value-for-money across 86 review-site ratings
    - Medium
    - Suggests pricing is attractive relative to perceived product value
    - Provide win-rate, discount-rate, and renewal data by segment
  - - Direct-sales share
    - '>90% of customers buy directly, per Mosyle'
    - Low
    - If true, could reduce CAC and reseller leakage
    - Show sourced pipeline, direct-vs-channel bookings, and CAC by route to market
  - - MSP commission design
    - 100% first-year commission, 30% later, plus ACN credits
    - High
    - Shows how much gross profit Mosyle is willing to sacrifice to acquire channel-led customers
    - Quantify lifetime value, churn, and net contribution margin of MSP cohorts
  - - Historical growth proof
    - Triple-digit revenue growth since 2020 at the 2022 financing date
    - Medium
    - Positive momentum indicator, but stale for 2026 underwriting
    - Provide 2023-2026 revenue bridge and current growth rate
  - - Working-capital proxy
    - Annual-in-advance business billing and prepaid monthly MSP billing
    - Medium
    - Upfront cash collection can offset growth investment needs
    - Provide deferred-revenue balance, DSO, and cash-conversion metrics
  - - Gross margin
    - null
    - Low
    - Central metric for judging whether low-price, high-support selling still yields software-quality economics
    - Provide GAAP and non-GAAP gross margin plus cost-of-service split
  - - CAC payback / NRR / churn
    - null
    - Low
    - Without these metrics, sales efficiency and retention durability remain proxy judgments only
    - Provide CAC payback, logo and dollar retention, and downgrade reasons by segment
  notes: Nulls represent genuine public-data gaps; visible proxies are mostly pricing, reviews, and billing mechanics rather than audited unit-economics metrics.
