- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The public record supports a constructive but incomplete verdict. On the positive side, Mosyle looks better than many private SMB and education software vendors on pricing transparency, GTM creativity, and working-capital mechanics. Public pages show how the company acquires customers, how plans are packaged, where channel incentives sit, and how adjacent products could expand revenue mix. On the negative side, virtually every underwriting metric that matters after first interest is still missing: current ARR or revenue, post-2022 growth, realized discounting, gross margin, CAC payback, net retention, churn, customer concentration, cash burn, runway, and debt. The financing history is also not clean enough to underwrite at face value because official copy, SEC Form D, CB Insights, and Forge do not reconcile to a single 2026 total-funding or valuation number. That leaves Mosyle in a familiar but important category: a company with credible monetization logic and plausible capital
    efficiency, yet insufficient audited disclosure to move from promising story to high-confidence financial underwriting. A diligence process should therefore focus less on more marketing proof and more on a segment-level P&L, contract samples, and a reconciled financing history.'
