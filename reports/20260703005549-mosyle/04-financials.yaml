- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public best available proxy
  - Why it matters
  - Exact diligence path
  rows:
  - - Current ARR / revenue and 2023-2026 growth bridge
    - 2022 claim of triple-digit growth since 2020 plus current customer-count and review proxies
    - Needed to judge scale, growth durability, and valuation support
    - Request monthly ARR, recognized revenue, and bookings bridge from 2022 through current month
  - - Realized pricing and discount waterfall
    - Public list prices, free tier, migration credits, and MSP commissions
    - List price alone cannot show realized ARPU or revenue quality
    - Review recent business, school, and MSP agreements plus pricing committee materials
  - - Gross margin and cost-of-revenue split
    - Jamf 10-K offers only a comparable cost structure proxy
    - Margin path is central to underwriting a low-price, high-support strategy
    - Request gross margin by segment and cost buckets for hosting, support, commissions, and onboarding
  - - CAC payback, NRR, and churn
    - Direct-sales share, review scores, and free onboarding are only directional proxies
    - These metrics determine whether efficient acquisition actually converts into durable economics
    - Request channel-level CAC, payback, cohort retention, and downgrade reasons
  - - Cash, burn, runway, and debt
    - 2026 Form D plus conflicting funding databases show capital activity but not current liquidity
    - Capital-adequacy analysis is impossible without live balance-sheet data
    - Request latest board package with cash, burn, runway, and debt schedule
  - - Customer concentration and segment mix
    - Official sites mention businesses, schools, government entities, and MSPs but not revenue contribution
    - A few large districts or channel accounts could skew revenue quality
    - Request ARR by segment, top-20 customer exposure, and MSP share of bookings
  - - Acquisition / subsidiary contribution
    - Assetbots and AccessMule expansion is public, but revenue and cost impact are not
    - Adjacencies can improve growth yet hide integration cost or margin dilution
    - Request post-acquisition P&L, attach rate, and integration-cost tracking for adjacent products
  notes: These are the minimum missing disclosures needed to move from a promising public story to a fully underwriteable financial model.
  enumerationScope:
    coverage: partial
    basis: Captures the highest-value underwriting gaps for this chapter rather than every missing private-company metric.
