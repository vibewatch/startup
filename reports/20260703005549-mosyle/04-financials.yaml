    - District-specific service terms and attach rates are undisclosed
    - Education is a low-price, scale-seeking segment
  - - MSP program
    - $0.00 first-year effective macOS price after special commission; $2.33 regular macOS; $1.17 iOS/iPadOS
    - Channel economics are public at headline level
    - True net take rate after credits, support, and churn is undisclosed
    - Partner motion trades near-term margin for distribution and retention potential
  - - Promotional acquisition offers
    - FREE up to 30 devices plus six-month extended trial and first-year migration credit
    - Acquisition economics, not steady-state pricing
    - Qualification rules, conversion rates, and realized CAC are undisclosed
    - Mosyle is willing to use aggressive promotional economics to land or switch accounts
