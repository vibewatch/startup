chapter:
  number: 4
  title: Financials
  summary: Mosyle publishes unusually clear list pricing and a forceful story of direct-sales efficiency, prepaid billing, and self-funded profitability, but it still withholds the operating metrics needed for full underwriting. Public 2026 financing evidence is materially inconsistent across official copy, SEC Form D, CB Insights, and Forge, so the financial verdict is positive on monetization discipline but only medium confidence on capital adequacy and margin durability.
sections:
- id: revenue-model-pricing-and-gtm
  title: Revenue model, pricing, and GTM motion
  body: 'Mosyle''s public file supports a straightforward but segmented recurring-revenue model. The company sells per-device subscriptions across business, school, and MSP channels, then layers integrated security, identity, privacy, and app-management functionality on top of Apple device management. The business pricing surface is unusually explicit for a private software vendor: Business Premium is $1.00 per device per month, Fuse for macOS is $3.00, Fuse for iOS/iPadOS/visionOS is $1.50, and a free tier exists up to 30 devices. School pricing is even lower at an advertised $0.46 per device per month entry point, while the MSP program uses a distinct wholesale-style structure with channel commissions and prepaid monthly billing. Just as important, Mosyle claims more than 90% of customers buy direct and frames its commercial model as ''no middleman'' plus ''no sales,'' implying a website-led, low-touch acquisition engine reinforced by free onboarding, extended trials, and migration credits.
    That combination makes the top-of-funnel and list-price story clearer than the realized-economics story: the public web shows what Mosyle wants buyers to see, but not the discounting, bundling, or revenue-recognition detail that would convert list pricing into underwriteable revenue quality.'
