- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / signal
  - Public list price or contract signal
  - List vs. realized pricing
  - Discounts / unknowns
  - Implication
  rows:
  - - Mosyle Business Premium
    - $1.00 per device per month
    - List pricing is public
    - Enterprise discounts, contract minimums, and bundle attach are undisclosed
    - Mosyle is comfortable publishing entry pricing for core business management
  - - Mosyle Fuse for macOS
    - $3.00 per device per month; billed annually; 30-license minimum
    - List pricing is public
    - No public evidence on realized macOS security bundle discounting
    - High-feature business offer still carries contract-like structure
  - - Mosyle Fuse for iOS/iPadOS/visionOS
    - $1.50 per device per month
    - List pricing is public
    - No public enterprise uplift or blended seat mix
    - Mobile security/management is priced below macOS but above free tier
  - - School plans
    - As low as $0.46 per device per month
