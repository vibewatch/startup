callouts:
- calloutType: risk
  title: The public record does not validate a clean $1B+ or Warburg-backed story
  body: Retained primary and market-data sources support a fresh 2026 capital event and a visible ~$898.96M Forge valuation signal, but they do not corroborate a clean Warburg-backed $1B-plus framing. Investors should preserve that gap instead of rounding it away.
  claimRefs:
  - CV019
  - CV026
  - CV029
  - CV030
  - CV033
- calloutType: insight
  title: Form D history points closer to Forge than to the homepage narrative
  body: Mosyle's five visible Form D offering notices add up to about $313.6M, close to Forge's $310.63M total-funding figure and well above the homepage's $215M story. That does not prove cash actually closed at those amounts, but it does prove the public financing narrative still needs reconciliation.
  claimRefs:
  - CV002
  - CV025
  - CV029
  - CV032
- calloutType: recommendation
  title: 'Conviction threshold: current economics plus the full waterfall'
  body: The minimum package for a constructive buy case near the visible private-market mark is current ARR or revenue, gross margin, retention, cash and debt, and a full liquidation waterfall. Without those documents, Mosyle can still be good while the price remains under-evidenced.
