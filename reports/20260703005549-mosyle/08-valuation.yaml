  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-conflict
    missingEvidence: Signed financing timeline that reconciles 2022 official announcements, all Form D notices, CB Insights, Forge, and any secondary liquidity components.
    whyItMatters: Round size, date, investor mix, and valuation directly drive dilution math and whether the visible price anchor is reliable.
    diligencePath: Request the board-approved financing chronology, securities purchase agreements, and a cap-table bridge for 2022 through 2026.
    relatedQuestionRefs:
    - QV013
    - QV016
    relatedTableRefs:
    - TV001
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: Current ARR or revenue run rate, gross margin, retention, and segment mix for business, education, and MSP motions.
    whyItMatters: A valuation call above or even around the visible secondary mark cannot be underwritten without the revenue and margin quality that the public record omits.
    diligencePath: Obtain a monthly ARR and revenue bridge, gross-margin walk, and cohort retention deck from management.
    relatedQuestionRefs:
    - QV026
    - QV029
    - QV030
    - QV031
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, burn, runway, debt schedule, and any off-balance-sheet financing obligations.
    whyItMatters: Whether Mosyle needs fresh capital or can self-fund materially changes downside protection and round pricing discipline.
    diligencePath: Review the latest board package, bank covenant schedule, and trailing-twelve-month cash flow statements.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Full cap table, liquidation waterfall, option pool, and any side-letter or participation features beyond the limited Forge summary.
    whyItMatters: Visible enterprise value can overstate actual common-equity returns if senior preferences absorb most proceeds.
    diligencePath: Request the current cap table, security terms summary, and a modeled liquidation waterfall across bear, base, and bull outcomes.
    relatedQuestionRefs:
    - QV028
    - QV030
    - QV034
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: peer-valuations
    missingEvidence: Current disclosed valuations or financials for private Apple-first peers such as Kandji, JumpCloud, and Hexnode.
    whyItMatters: Jamf is the only clean public valuation anchor in the retained set, so peer scarcity makes the comp bridge less precise.
    diligencePath: Pull investor decks, tender documents, or current market-data profiles for private peer rounds before final IC pricing.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV004
