    - $1.74-$1.75B market cap; 2.47x PS; 2.89x EV/Sales
    - Cleanest audited Apple-first management comp with disclosed customer, device, revenue, and margin data.
    - Larger scale and deeper disclosure than Mosyle; acquired by Francisco Partners, so the live public comp set is thinner.
  - - Iru / Kandji
    - Peer-set presence in retained comparison sources
    - Private peer; no current disclosed valuation in retained set
