- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Core assumptions
  - Valuation range (US$B)
  - Valuation logic
  - Key risks
  rows:
  - - Bear
    - 30%
    - Comp discipline tightens, support friction persists, and the next priced event resets below the visible secondary mark.
    - 0.55-0.70
    - Roughly one-third to two-fifths of Jamf's July 2026 public value with no premium for missing disclosure.
    - Down-round, weaker retention, or preference overhang.
  - - Base
    - 50%
    - The visible ~2026 mark remains directionally right, but missing ARR, margin, and waterfall data cap conviction.
    - 0.75-0.95
    - Anchored around Forge's ~$0.899B mark and below any automatic $1B+ assumption.
    - Current public evidence never upgrades from partial to complete.
  - - Bull
    - 20%
    - Private diligence proves strong retention, software-like margin, low churn, and a clean cap table while growth stays healthy.
    - 1.00-1.20
    - Requires investors to pay a scarcity premium above the current visible mark, but still below aggressive hype values.
    - Operational proof or waterfall terms fail to validate the premium.
  - - Probability-weighted view
    - 100%
    - Public evidence supports a live premium story but not a fully de-risked one.
    - 0.77-0.90
    - Weighted toward the base case with meaningful downside for disclosure failure.
    - Any adverse financing or support-quality surprise skews realized value lower.
  notes: Ranges are public-evidence estimates anchored to the visible 2026 secondary mark, Jamf's public valuation, and Mosyle's missing economic disclosures rather than a formal DCF.
