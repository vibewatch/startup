chapter:
  number: 8
  title: Valuation
  summary: Mosyle looks like a real, scaled Apple-management platform with transparent pricing and a visible 2026 financing event, but the public record still does not reconcile total capital, round mechanics, or current economics well enough to support a casual $1B+ story. The cleanest visible mark is Forge's ~$898.96M; relative to Jamf's audited scale and July 2026 market value, that leaves Mosyle as a research-more name with a stretched valuation stance and medium confidence rather than a buy.
sections:
- id: financing-context-and-public-price-anchors
  title: Financing context and public price anchors
  body: 'Mosyle''s valuation conversation starts with two very different kinds of public evidence. The company''s current copy says it achieved record profitability and free cash flow, raised $215 million for long-term alignment rather than survival, and now serves tens of thousands of organizations. Primary filings show something narrower but more reliable: a 2026 Form D for $99.99996 million with two investors, a 2022 Form D for $162.5 million with twelve investors, and older 2020, 2019, and 2017 Form D notices that together sum to about $313.6 million of filed offering amounts. That cumulative filing trail sits much closer to Forge''s $310.63 million total-funding figure than to the company''s current $215 million narrative, while CB Insights is still higher at $348.34 million. Public evidence therefore supports a fresh 2026 capital event near $100 million, but it does not support a clean, fully reconciled funding history or a user-provided Warburg-backed $1 billion-plus framing. The
    visible 2026 valuation mark in retained sources is Forge''s $898.96 million, not an official Mosyle disclosure.'
