- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: transparent list pricing, migration credits, and direct-sales claims suggest a potentially efficient CAC model.'
    - Show realized net revenue, CAC payback, and renewal behavior by business, school, and MSP cohorts.
  - - 'Thesis: review sites broadly support price-to-value fit with 4.6/5 ratings and strong value-for-money scores.'
    - Prove those satisfaction signals translate into durable retention and low support burden at scale.
  - - 'Thesis: a fresh ~2026 $100M financing event suggests capital access remains open.'
    - Provide final closing docs, investor list, and use-of-funds detail to confirm this was not just a partial or mixed primary-secondary event.
  - - 'Anti-thesis: official customer-scale claims conflict across current properties, so public traction should be treated as directional.'
    - Reconcile paying accounts, free accounts, schools, MSP subaccounts, and managed-device counts in one dated KPI sheet.
  - - 'Anti-thesis: review and comparison sources still point to documentation, support, and deployment friction relative to Jamf.'
    - Demonstrate lower churn, faster support resolution, and high expansion despite those criticisms.
  - - 'Anti-thesis: a visible ~$899M mark is already roughly half of Jamf''s public value without Jamf-like disclosure quality.'
    - Produce audited economics and a clean cap table that justify a premium scarcity multiple.
  notes: The table separates company-quality arguments from price-support arguments so the final call remains valuation-sensitive rather than purely product-sensitive.
