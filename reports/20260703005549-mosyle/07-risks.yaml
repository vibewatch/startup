- id: people-execution-and-financial-risk
  title: People, execution, and financial-model risk
  body: 'Execution and financing risk sit just behind privacy and platform dependence. Public evidence shows a company that keeps adding scope: AI-powered zero trust in 2023, a new MSP product in 2024, the AccessMule subsidiary in 2025, and Mosyle@Home in 2026. The careers page simultaneously shows hiring across engineering, onboarding, support, payroll, security, and design with material activity split between Brazil and Florida. That is not inherently negative, but it does imply cross-border operating complexity and sustained support demand at a moment when the company is broadening from core MDM into identity, access, and family-facing school tooling. Leadership depth is only partly visible in public: Mosyle highlighted its first COO hire in 2021, yet the retained set still leaves the broader bench, board, and finance-org depth opaque. The financial risk is even less settled. Mosyle''s own homepage says the company achieved profitability and free cash flow and raised $215 million for
    long-term alignment rather than survival, but the 2026 SEC Form D, CB Insights, and Forge do not reconcile to one clear view of total capital raised or current capitalization. The SEC filing shows a fresh ~$100 million exempt offering and declines to disclose revenue range, while no reviewed source discloses burn, cash, runway, or debt. That makes the residual underwriting risk less about near-term insolvency and more about paying through unresolved ambiguity.'
