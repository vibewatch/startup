chapter:
  number: 7
  title: Risks
  summary: Mosyle's highest risks are privacy and regulatory exposure from deep device telemetry and new parent-facing school workflows, Apple-platform dependence that can degrade product functionality outside Mosyle's control, and execution strain from rapid product expansion across MSP, identity, access, and K-12 surfaces. Operational review evidence is not catastrophic, but independent outage and support-friction signals combine with conflicting 2026 capital narratives to keep residual risk high and conviction below buy-quality.
sections:
- id: legal-regulatory-and-privacy-risk
  title: Legal, regulatory, and privacy risk
  body: 'Mosyle''s top risk is not a public lawsuit already on file; it is the breadth of sensitive data and control flows the platform openly says it can handle. The business privacy policy says Mosyle can process administrator identity data, extensive device telemetry, DNS-filtering request logs, and on macOS even arbitrary information gathered through customer-authored scripts that Mosyle itself does not control. The school and Mosyle@Home surfaces widen that exposure: Mosyle markets parental controls, web filtering, and school credentials for K-12 fleets, while the 2026 home product lets parents review app usage, screen time, and potentially internet-usage history after hours. That creates a real compliance burden under FERPA- and COPPA-adjacent frameworks even if no public enforcement action was found in this run. Mosyle''s legal terms help define the posture but do not eliminate the risk. The company says customers and administrators are responsible for obtaining required consents
    and using the service lawfully, and it limits liability, pushes disputes to arbitration, and disclaims uninterrupted service. Mitigations do exist: written breach-response language, disclosed subprocessors, and stated Data Privacy Framework participation. But those are baseline controls, not evidence that district-by-district parental-consent, student-record, or cross-border transfer obligations have been fully pressure-tested in public.'
