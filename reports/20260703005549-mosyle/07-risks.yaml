  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Complete district contract terms, DPAs, and any state- or country-specific privacy obligations not visible in public terms.
    whyItMatters: Without contract packs and jurisdiction-specific disclosures, the legal register can only cover the highest-severity public issues rather than the full compliance perimeter.
    diligencePath: Request representative business, school, and MSP MSAs/DPAs plus any state student-privacy addenda and international transfer annexes.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: litigation-enforcement-history
    missingEvidence: A complete court, arbitration, AG, insurer, and regulator docket sweep for Mosyle and key subsidiaries.
    whyItMatters: Public website and regulator guidance pages do not prove a clean legal history; unresolved litigation could change contract, reserve, or reputation risk quickly.
    diligencePath: Run paid CourtListener/PACER/state docket searches and ask management and counsel for current and historical litigation schedules.
    relatedQuestionRefs:
    - QR006
  - type: private-evidence-only
    severity: material
    topic: leadership-bench-depth
    missingEvidence: Current executive roster, board materials, succession plan, and finance/security leadership structure.
    whyItMatters: Product breadth and cross-border execution are hard to underwrite without seeing who actually owns finance, security, support, and adjacent products.
    diligencePath: Request org chart, board list, and resumes for finance, product, support, and security leaders.
    relatedQuestionRefs:
    - QR022
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, burn, runway, debt, and use-of-proceeds bridge for the 2026 round.
    whyItMatters: Conflicting public capital totals cannot be converted into underwriting confidence without direct liquidity metrics.
    diligencePath: Request board-approved budget, monthly cash bridge, debt schedule, and 2026 financing memo.
    relatedQuestionRefs:
    - QR027
  - type: missing-source
    severity: material
    topic: service-reliability-kpis
    missingEvidence: Official incident postmortems, uptime by product, ticket backlog metrics, and support staffing trends.
    whyItMatters: Independent outage and review evidence suggests real operational load, but public status snapshots do not show whether those issues are isolated or systemic.
    diligencePath: Request the last 12 months of incident logs, SLA attainment, and support KPI dashboards by product and segment.
    relatedQuestionRefs:
    - QR008
    - QR010
    - QR011
    - QR023
