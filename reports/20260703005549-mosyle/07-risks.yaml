  title: The privacy surface expanded beyond classic MDM
  body: Mosyle is no longer just a back-office Apple admin tool. Home-use controls, app-usage visibility, DNS history, and configurable scripts push it into more sensitive governance territory where schools and employers may demand tighter defaults and clearer consent evidence.
  claimRefs:
  - CR007
  - CR008
  - CR013
  - CR014
  - CR045
  - CR047
- calloutType: risk
  title: Apple dependence is strategic focus and strategic fragility
  body: Apple-only focus keeps the product differentiated, but it also means a bad Apple platform transition can hit enrollment, login, patching, and security workflows all at once. Mosyle's own terms expressly reserve that possibility.
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR048
- calloutType: insight
  title: Financial ambiguity limits the upside case more than a visible balance-sheet crisis
  body: Nothing in the public set proves imminent capital distress, but the 2026 round, total capital raised, and current liquidity narrative still do not reconcile tightly enough for high-confidence underwriting.
