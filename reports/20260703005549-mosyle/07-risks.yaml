  rows:
  - - Student privacy / child privacy exposure
    - U.S. K-12 districts, parents, students
    - Mosyle markets parental controls, web filtering, screen time, and school credential workflows across student devices.
    - High
    - High
    - District-level consent processes, policy configuration, and stated privacy controls.
    - High because public proof of district-by-district compliance is absent.
    - Review district DPAs, parental notice templates, FERPA/COPPA mappings, and default logging settings for OneK12 and Mosyle@Home.
  - - Broad telemetry and DNS-filter logging
    - Workplace and school devices; U.S. and cross-border users
    - Mosyle says it can collect device identifiers, security posture, GPS in some modes, and DNS request logs when configured.
    - High
    - High
    - Terms mention safeguards, DPF participation, and breach-response obligations.
    - High because administrators can enable expansive collection and custom scripts.
    - Obtain data-flow diagrams, retention policies, and a default-vs-optional field inventory by product.
  - - Contract remedies / liability limits
    - Commercial and MSP customers
    - Business and MSP terms disclaim uninterrupted or error-free service and cap aggregate liability at six months of fees.
    - Medium
    - High
    - Refund of unused prepaid fees on some termination scenarios; Mosyle indemnifies for IP claims.
    - Medium-high because remedies may not match customer loss if a major outage or privacy event occurs.
    - Review enterprise MSAs, negotiated caps, SLA credits, and exceptions for security breaches or student-data incidents.
  - - Data transfer and subprocessors
    - EU/UK/Swiss data; third-party infrastructure
    - Mosyle cites Data Privacy Framework participation and lists Azure, Cloudflare, Pipedrive, Mailgun, and Stripe subprocessors.
    - Medium
    - Medium-high
    - Published subprocessors, confidentiality commitments, and written agreements.
    - Medium because transfer and vendor-risk controls are asserted but not independently attested in the retained set.
    - Request current subprocessor list, DPF registration evidence, and security assessments or attestations for critical vendors.
  - - Public litigation / enforcement visibility
    - Regulators, courts, enterprise procurement
    - No public Mosyle-specific enforcement or lawsuit was retained in this run, but the search evidence is incomplete.
    - Low to medium
    - Medium
    - No adverse docket found in reviewed public set.
    - Medium because absence of retained public dockets is not the same as a clean legal history.
    - Run paid court, state AG, and insurance-claims searches; ask management for litigation and breach schedules.
  notes: Rows rank the clearest legal and regulatory exposures visible from public sources; absence of a retained docket is treated as an evidence gap, not exoneration.
