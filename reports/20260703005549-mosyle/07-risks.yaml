- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Student/privacy compliance drift
    - Regulator complaint, district pushback, or product change expanding parent visibility
    - Any documented FERPA/COPPA dispute, or a major district requiring default logging changes before rollout
    - Pause K-12 expansion underwriting until compliance design, notices, and contract exceptions are validated.
  - - Apple platform dependence
    - Material functionality break after a major Apple OS or enrollment change
    - Login, patching, or policy enforcement breaks that last more than one business cycle for a large cohort
    - Discount durability assumptions and require evidence of rapid remediation cadence and platform contingency planning.
  - - Operational quality erosion
    - Independent outage or support-friction trend
    - Repeated multi-product incidents, or review sentiment turning from isolated complaints into recurring deployment/support failure
    - Raise churn and support-cost assumptions; avoid premium valuation until reliability KPIs improve.
  - - MSP channel economics
    - Partner complaints, failed collections, or reduced program generosity
    - Commission cuts, ACN credit pullback, or visible MSP non-payment / frozen-account pressure
    - Lower MSP expansion contribution and re-test channel profitability under less promotional economics.
  - - Execution stretch from product sprawl
    - Delayed launches, reversals, or support backlog growth
    - AccessMule / home-management roadmap slip combined with more support complaints or hiring gaps
    - Require product-level ownership and support-capacity data before crediting adjacent-module upside.
  - - Financing opacity
    - Capital narrative remains inconsistent or cash metrics stay undisclosed in diligence
    - Management cannot reconcile the 2026 round, total raised, and current runway with hard numbers
    - Move from trackable upside to research-more / wait-for-data posture and tighten entry price.
  notes: Triggers are framed so an investor can monitor them post-meeting; they are not forecasts of failure, but thresholds where the underwriting stance should worsen.
