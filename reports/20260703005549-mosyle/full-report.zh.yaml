  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准和乐观区间显示，留存公开证据把 Mosyle 聚在可见估值标记以下或附近，而不是明显高于 $1B。
    approximationNotes: 区间是分析师估计，锚定留存公开价格锚点和可比公司稀缺性，不是管理层指引或正式公平性意见。
    data:
      items:
        - label: 悲观情景 — 可比公司约束和披露失败
          low: 550
          high: 700
          unit: $M
        - label: 基准情景 — 可见估值标记大体站得住
          low: 750
          high: 950
          unit: $M
        - label: 乐观情景 — 尽调验证溢价经济性
          low: 1000
          high: 1200
          unit: $M
    claimRefs:
      - CV030
      - CV040
      - CV041
      - CV050
      - CV051
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分显示，业务故事站得住，但估值支撑和退出清晰度偏弱。
    approximationNotes: 分数使用 1-5 编辑评分，基于截至运行日期留存公开证据；不是管理层披露的 KPI。
    data:
      items:
        - label: 产品 / 定价证据
          value: 4
          unit: /5
          note: 透明定价、评论评分和迁移激励支撑真实市场匹配。
        - label: 客户规模证据
          value: 3
          unit: /5
          note: 可见规模存在，但各资产上的官方口径相互冲突。
        - label: 资本可得性
          value: 3
          unit: /5
          note: 可见一笔约 2026 年的新融资事件，但轮次细节仍有冲突。
        - label: 披露质量
          value: 2
          unit: /5
          note: 未公开 ARR、毛利率、现金、债务或完整清算顺位。
        - label: 可比公司支撑
          value: 2
          unit: /5
          note: Jamf 是唯一干净的估值锚，让 Mosyle 的可见估值标记看起来偏满，而不是便宜。
        - label: 执行 / 支持风险
          value: 3
          unit: /5
          note: 评论网站整体正面，但仍暴露文档和支持摩擦。
        - label: 退出准备度
          value: 2
          unit: /5
          note: 战略退出说得通，但投资人仍缺少能够放心发现价格的一整套材料。
    claimRefs:
      - CV019
      - CV033
      - CV036
      - CV037
      - CV047
      - CV049
      - CV050
      - CV054
