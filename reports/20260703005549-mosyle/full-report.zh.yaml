      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个正面但不完整的结论。积极面是，相比许多私营 SMB 和教育软件供应商，Mosyle
              在定价透明度、获客打法和营运资本机制上看起来更好。公开页面展示了公司如何获客、如何打包计划、渠道激励放在哪里，以及相邻产品如何扩大收入组合。消极面是，买方产生初步兴趣之后真正重要的几乎每个投资判断指标仍然缺失：当前
              ARR 或收入、2022 年后增长、实际折扣、毛利率、CAC 回本周期、净留存、流失、客户集中度、现金消耗、现金跑道和债务。融资历史也不够干净，无法按表面值投资，因为官方文案、SEC Form D、CB
              Insights 和 Forge 无法调和成一个 2026 年累计融资或估值数字。这让 Mosyle
              落入一个熟悉但重要的类别：公司有可信变现逻辑和看似合理的资本效率，却缺少足够的审计级披露，无法从有吸引力的故事推进到高置信财务判断。尽调流程因此应少看更多营销证明，多看分细分 P&L、合同样本和调和后的融资历史。
