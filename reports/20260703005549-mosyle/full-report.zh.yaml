              - CV041
              - CV050
              - CV051
              - CV053
      - number: '8.4'
        title: 退出准备和最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备仍是暂定。一方面，Apple 设备管理品类具备足够战略性，Jamf 自身已经从上市可比公司变为 Francisco Partners 持有资产，说明战略买方或财务买方结果都有可能。另一方面，Mosyle
              尚未发布一套披露包，让外部投资者判断由财务买方支持的退出、新优先股轮，还是长期独立，哪一种能创造最佳风险调整回报。缺失项不是表面文章。投资者仍需要当前收入和毛利率、按客户细分的留存、现金和
              现金跑道、债务，以及完整清算瀑布。还需要一条对账后的融资历史，解释为什么公司首页仍强调 $215M，Form D 文件暗示约 $313.6M 的发行通知，Forge 显示 $310.63M 累计融资和
              $898.96M 估值，而 CB Insights 显示 $348.34M。没有这套材料，Mosyle 仍可能是一家好公司，但价格证据不足。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV029
              - CV030
              - CV044
              - CV048
              - CV049
              - CV056
          - type: table
            tableRef: TV006
            claimRefs:
              - CV019
              - CV025
              - CV026
              - CV029
              - CV031
              - CV049
              - CV056
      - number: '8.5'
        title: 展项
        blocks:
          - type: callout
            title: 公开记录没有验证干净的 $1B+ 或 Warburg 支持故事
            body: >-
              保留的一手和市场数据来源支持 2026 年新资本事件，以及约 $898.96M 的 Forge 可见估值信号，但没有证实一条干净的 Warburg 支持、$1B+
              框架。投资者应保留这一缺口，而不是把它四舍五入抹掉。
            calloutType: risk
            claimRefs:
              - CV019
              - CV026
              - CV029
              - CV030
              - CV033
          - type: callout
            title: Form D 历史更接近 Forge，而非首页叙事
            body: >-
              Mosyle 五份可见 Form D 发行通知合计约 $313.6M，接近 Forge 的 $310.63M 累计融资数字，明显高于首页 $215M
              的说法。这不能证明现金确实按这些金额到账，但确实证明公开融资叙事仍需要对账。
            calloutType: insight
            claimRefs:
              - CV002
              - CV025
              - CV029
              - CV032
          - type: callout
            title: 信心门槛：当前经济性加完整瀑布
            body: 在可见私有市场标记附近形成建设性买入案例，最低材料包是当前 ARR 或收入、毛利率、留存、现金和债务，以及完整清算瀑布。没有这些文件，Mosyle 可以仍是一家好公司，但价格证据仍不足。
            calloutType: recommendation
            claimRefs:
