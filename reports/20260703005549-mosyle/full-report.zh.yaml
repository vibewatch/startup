      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层能见度远低于产品能见度。公开来源反复把 Alcyr Araujo 标为创始人兼
              CEO；本报告审阅的主要融资、产品和合作公告，也都由他发声。创始人叙事高度居中可以是优势，因为公司的产品、定价和获客逻辑彼此一致；但这也让外部故事出现关键人集中。公开记录里最明显的运营班底升级发生在 2021 年
              9 月：Mosyle 任命曾在 Apple 和 Microsoft 担任高管的 Michael Donlan 为首任 COO。这个任命重要，是因为它显示公司在 2022 年更大规模融资之前、也在拓展 MSP
              和相邻安全业务之前，已经有意推动运营专业化。


              再往外看，治理披露很薄。已审阅的官方页面没有公布当前董事会名单、委员会结构或财务负责人梯队；市场数据来源也无法把控制权或董事席位说清楚，不能替代正式治理材料。公开浮出水面的，是相邻业务领导层：2024
              年收购报道显示 Chad Burggraf 继续负责 Assetbots；2025 年 AccessMule 报道则提到 Sergio Sousa 担任新子公司执行负责人。这足以说明 Mosyle
              正在为新产品搭建独立运营班底，但不足以完成对核心公司董事会结构、股权结构控制或接班深度的尽调。正确读法是：公开领导层披露能支撑日常判断，且明显由创始人主导，但还谈不上制度化透明。
