      - number: '8.2'
        title: 投资论点、反面论点和可比桥
        blocks:
          - type: paragraph
            body: >-
              Mosyle 多头逻辑很容易理解。对一家私有基础设施供应商来说，当前定价异常透明：企业计划从免费到每设备每月 $3，学校定价从 $0.46 起，迁移抵扣可让切换客户第一年免费，MSP
              经济性则有意用短期利润率换合作伙伴获客。企业页面还称，超过 90% 的客户直接购买，暗示获客成本结构可能比重渠道同行更轻。独立评论大体支持这一性价比故事：评分 4.6/5，性价比
              标记也强。反面逻辑是，公开证明恰恰在估值纪律最重要的地方变弱。Mosyle 自己的客户数在不同页面冲突，评论网站仍指出支持和文档摩擦，PeerSpot 继续把 Jamf 放在市场存在感和支持深度前面。Jamf
              也是保留材料中唯一干净的审计可比公司：它披露 76,500 名客户和 33.2M 台设备，而市场数据来源仍给它约 $1.74B 至 $1.75B、约 2.5x 销售额的估值。由此看，Mosyle 可见的
              $898.96M 标记约为 Jamf 公开价值的一半，但 Mosyle 没有披露 Jamf 已披露的收入、利润率或留存细节。
