      - number: '7.2'
        title: 运营、产品质量与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Mosyle 聚焦很有效，但这种窄焦点也形成尖锐依赖栈。公司销售仅服务 Apple 的控制平面，自己的条款明确表示 Apple 改动操作系统时功能可能实质下降。这一点重要，因为 Mosyle 不只把
              MDM，而是把身份、零信任、DNS 过滤、补丁、屏幕共享、MSP 流程和如今面向家长的控制都叠在 Apple 行为之上。披露的生态还依赖
              Azure、Cloudflare、Stripe、Mailgun、Pipedrive，以及 Okta、Ping 等外部身份提供商。独立证据显示，堆栈不错但并非无摩擦：GetApp
              评论者提到应用部署或更新需要反复尝试；G2 评论者指出社区资源不足和功能缺口；Software Advice 摘录批评技术文档；PeerSpot 仍认为 Jamf
              在支持深度上更强。因此，运营风险不太是已知灾难性泄露，更像复杂性慢性失血：产品宽度、合作伙伴集成和价格敏感用户群，会把小的可靠性或支持失误放大成流失、利润率压力或安全盲区。本轮保留的最强独立宕机证据是 2026
              年 1 月一次事件，影响 Mosyle Fuse、Mosyle Business 和 Mosyle Fuse MSP 约三小时。事件不能证明长期不稳定，但说明即便当前状态页干净，平台也并非免疫于服务中断。
