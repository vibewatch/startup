  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: Mosyle 的建议结论取决于真实产品和定价证据，能否抵消披露缺口、可比公司约束和融资模糊性。
    approximationNotes: 该流程偏定性而非概率化，反映截至运行日期留存公开证据支持的决策链。
    data:
      nodes:
        - id: n1
          label: 商业验证
          detail: 透明定价、直营销售说法和强评论评分显示，产品市场匹配真实存在。
        - id: n2
          label: 资本可得性
          detail: 备案和市场数据源可见一笔约 2026 年 $100M 的新融资事件。
        - id: n3
          label: 披露缺口
          detail: 未公开 ARR、利润率、现金、债务或完整清算顺位。
        - id: n4
          label: 可比公司约束
          detail: Jamf 已审计、规模更大，市值却只有 Mosyle 可见估值标记的约 2 倍。
        - id: n5
          label: 价格张力
          detail: 现有证据能支撑它是一家持续经营的公司，但不能自动推出 $1B+ 结论。
        - id: n6
          label: 建议
          detail: 继续研究 / 跟踪，并按估值偏高处理。
      edges:
        - from: n1
          to: n5
          label: 支撑上行
        - from: n2
          to: n5
          label: 证实市场触达
        - from: n3
          to: n5
          label: 压低确信度
        - from: n4
          to: n5
          label: 限制倍数
        - from: n5
          to: n6
          label: 推动结论
    claimRefs:
      - CV015
      - CV019
      - CV036
      - CV046
      - CV049
      - CV054
