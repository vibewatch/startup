      - number: '8.3'
        title: 建议、情景和终止触发器
        blocks:
          - type: paragraph
            body: >-
              由此得出的投资结论应是继续研究，而不是买入。公开证据足以说明 Mosyle 不是不成熟的科研项目：它有真实装机基础、透明标价、直销动作、近期融资事件和可见二级市场标记。但价格支撑仍比公司质量叙事更薄。公开材料没有
              ARR，没有毛利率，没有现金余额或现金消耗披露，也没有完整优先权结构。最干净的公开可比 Jamf，尽管客户、设备和收入披露显著更大，其估值也只约为 Mosyle 可见标记的两倍。这使基准情形更像在约 $0.75B
              至 $0.95B 区间持有或跟踪，Forge 可见标记接近区间上半部。熊市情形约 $0.55B 至 $0.70B，适用于可比公司纪律、支持摩擦或降估值融资 重置预期的场景。牛市情形可以超过
              $1.0B，但前提是私下尽调证明强留存、软件式利润率，且股权结构表不会把大部分上行收益漏给优先证券。在这套材料出现前，>$1B 应被视为昂贵，而不是已确认。
