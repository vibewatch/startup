  - id: FU004
    title: 公开采用信号区间
    type: range
    layout: standard
    summary: Mosyle 的公开采用叙事明确在增长，但公司使用多个分母，准确客户规模只能按区间判断，而不是干净的单点估计。
    approximationNotes: 中点仅用于展示不一致的公开披露，不是管理层确认总数。
    data:
      items:
        - label: 2026 年组织 / 客户 / 账户说法
          low: 47000
          mid: 52000
          high: 65000
          unit: accounts or organizations
          description: 2026 年官方页面分别提到超过 47,000 个组织、近 50,000 个客户、超过 52,000 个账户、超过 60,000 个组织和超过 65,000 个组织。
        - label: 历史信任背书说法
          low: 32000
          mid: 42000
          high: 47000
          unit: organizations or businesses-and-schools
