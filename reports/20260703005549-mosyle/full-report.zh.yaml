    title: 风险传导图
    type: dag
    layout: wide
    summary: 多数下行情景不是靠单一法律事件触发，而是沿着信任、支持成本、流失和估值传导。
    data:
      nodes:
        - id: n1
          label: 隐私 / 同意缺口
          detail: 遥测、DNS 或家长可见性做法带来合规摩擦
        - id: n2
          label: Apple 平台变动
          detail: OS 或 MDM 行为变化削弱产品功能
        - id: n3
          label: 质量 / 支持摩擦
          detail: 更新、文档或事件响应跟不上节奏
        - id: n4
          label: 客户信任受损
          detail: 管理员、学区或 MSP 扩张时变得犹豫
        - id: n5
          label: 支持和补救成本上升
          detail: 上线、工单和工程救火增多
        - id: n6
          label: 流失 / 扩张放慢
          detail: 续约、增购或合作伙伴增长走弱
        - id: n7
          label: 利润率和现金流承压
          detail: 促销和服务负荷吃掉价格优势
        - id: n8
