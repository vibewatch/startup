      - number: '5.2'
        title: 架构、部署模型与依赖
        blocks:
          - type: paragraph
            body: >-
              架构一部分由 Mosyle 自己掌握，一部分继承自 Apple。Apple 的部署模型仍提供基础原语：通过 Apple Business 或 Apple School Manager 做自动设备注册、注册和配置
              Profile、由 APNs 支撑的命令投递，以及设备与 Apple 主机的可达性。Mosyle 在这些原语之上叠加自己的云控制平面、轻量 macOS agent、iOS 和 iPadOS
              app、策略自动化、应用目录和身份工作流。因此，企业站可以可信地宣称它增强的是 Apple 的 MDM 协议，而不是取代它。身份层同样是叠加出来的。Mosyle Auth 2 承诺本地账户创建、SSO、设备
              2FA，并支持 Google、Microsoft、Okta、Ping 和多种 AD 变体；但 Apple 自己的 Platform SSO 文档明确说明，这些体验仍依赖兼容 IdP 的扩展、网络可达性，以及 OS
              层面的设备管理支持。实际含义是，Mosyle 的自动化可以简化部署和上线后的日常运营，但关键可靠性和登录行为仍取决于 Apple 框架变化、APNs 健康、IdP
              集成和客户网络设计。因此，产品看起来高度集成，但不像完全垂直自有的终端栈那样自给自足。
