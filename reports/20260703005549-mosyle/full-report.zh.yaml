      - number: '1.4'
        title: 里程碑、扩张与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的里程碑记录显示的是有意扩张，而不是一个静态 MDM 业务。时间线从 2012 年创立故事和 2015 至 2016 年美国扩张开始，随后进入 2021 年合作里程碑：Mosyle Auth 2
              增加对 Okta 和 Ping Identity 的支持；同年 9 月又出现治理里程碑，Donlan 加入并成为首任 COO。2022 年 Apple Unified Platform 发布是拐点，Mosyle
              从一个功能供应商的口吻，转向多模块 Apple IT 平台的叙事。此后产品和渠道路线图继续扩宽：2023 年加入 AI 驱动的零信任；2024 年推出专门的 MSP 产品，并给出异常激进的渠道经济；2024
              年还收购 Assetbots；2025 年成立 AccessMule 子公司；2026 年推出 Mosyle@Home，为学校设备增加家长控制。这一序列重要，因为它显示围绕 Apple
              终端展开的是相邻产品逻辑，而不是随机多元化。


              需要警惕的是，规模和成熟度说法跑在披露质量前面。当前页面和近期发布稿引用的客户数从 42,000 到 65,000 个组织不等，还包括超过 20,000 所学校和 7 million
              台设备，但没有统一这些指标的定义或截至日期。公开材料称公司盈利且拥有自由现金流，却没有披露
              ARR、收入运行率或员工数。独立评论来源对价值和支持总体正面，但仍指出反复出现的执行摩擦：偶发部署或更新问题、控制台导航慢或别扭、文档偏薄、通知疲劳、社区资源有限。因此，公开故事支持 Mosyle
              是一家可信、扩张中的后期私营 Apple IT 供应商，但治理、财务深度、精确规模，以及任何 2026 年融资或老股交易的真实经济性，仍有实质尽调工作未完成。
