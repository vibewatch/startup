      - number: '3.3'
        title: 分销力量、锁定效应与切换成本
        blocks:
          - type: paragraph
            body: >-
              对 Mosyle 来说，最重要的竞争问题不是对手能否匹配基础 MDM 功能，而是谁在部署后控制周边系统。Microsoft 可以把 Intune 锚定在许多企业已经拥有的许可里，也锚定在 Entra
              驱动的身份策略里。JumpCloud 把 Apple 管理与目录、MFA、无密码访问，以及可见的 MSP 和经销商生态耦合起来。Workspace ONE
              同样把设备状态与自助访问、基于角色的控制、条件访问和按应用 VPN 绑定。Jamf 的锁定更多来自管理员熟悉度、企业信任和成熟的支持 / 服务动作，而不是捆绑经济。这些控制点重要，是因为替换 MDM
              往往意味着同时重做入职、策略基线、补丁规则、应用目录和合规证据。Mosyle 在特定细分中也有真实切换优势。K-12 包装、Apple 专属工作流密度和专门打造的 MSP
              产品，减少了外挂工具需求。但证据也显示，一些竞争者在刻意降低整套替换摩擦。Iru 宣传迁移工具和人工支持；Addigy 称 macOS 迁移不必恢复出厂设置，并明确销售 Amplify，服务那些想要 Addigy
              远程与合规层、但又不想立刻放弃 Jamf、Intune、Kandji / Iru 或 Mosyle 的买方。这一点重要，因为多栖部署可以放慢直接席位流失，同时仍然压住 Mosyle 的钱包份额。结果是，Apple
              专家深度有助于赢得评估，但身份耦合、渠道触达和迁移易用性，才决定部署能否留住并扩张。
