  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景和公开价格锚点
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的估值讨论从两类很不同的公开证据开始。公司当前文案称，公司实现创纪录盈利和自由现金流，为长期一致性而非生存融资 $215M，如今服务数万家组织。官方申报给出的范围更窄但更可靠：2026 年 Form
              D 金额 $99.99996M、两名投资者；2022 年 Form D 金额 $162.5M、十二名投资者；更早 2020、2019 和 2017 年 Form D 通知合计约 $313.6M
              的申报发行金额。这条累计申报轨迹更接近 Forge 的 $310.63M 累计融资数字，而不是公司当前的 $215M 叙事；CB Insights 则更高，为 $348.34M。因此，公开证据支持 2026 年约
              $100M 的新资本事件，但不支持一条干净、完全对账后的融资历史，也不支持用户给出的 Warburg 支持、超过 $1B 的框架。保留来源中可见的 2026 年估值标记是 Forge 的 $898.96M，而非
              Mosyle 官方披露。
