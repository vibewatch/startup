      - number: '1.3'
        title: 融资、估值与利益相关方
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净、披露最完整的融资事件，仍是 2022 年 5 月官方宣布的 Series B。Business Wire、9to5Mac、TechCrunch 和 CRN 对核心事实口径一致：Mosyle 融资
              $196 million，Insight Partners 领投，StepStone Group 以及 Elephant、Album VC 等既有投资方参与，公司把这笔融资与 Apple Unified
              Platform 发布绑定在一起。同一批 2022 年来源也支撑了当时已有可观规模的图景：超过 32,000 个客户、超过 5 million 台托管设备，并且自 2020
              年以来销售增长达到三位数。它们没有给出的，是估值，或一组可持续复核、经审计的经营指标。这个缺口重要，因为后续 2026 年市场数据来源引入的是相互冲突的融资历史，而不是简单延展 2022 年官方叙事。


              具体看，CB Insights 显示一笔日期为 2026-04-30 的 $99.99 million Series B-III，并给出 $348.34 million 累计融资；Forge 则显示一笔日期为
              2026-03-09 的 $100 million Series B-3、$310.63 million 累计融资，以及 $898.96 million 投后估值。两个数据库还都把 Album VC 和
              Elephant 留在投资方名单中，并提到 Insight、StepStone 和 Broadview。已审阅的公开证据并不支持提示里的 Warburg Pincus 和 $1 billion
              表述。相反，它说明即便 2026 年确有融资或老股交易，公开记录仍需要在轮次日期、规模、投资方组合和估值上做调和。公司当前企业页面又进一步让资本故事变复杂：页面称此前披露的 $215 million
              部分用于帮助短期股东退出，而不是用于维持生存。这暗示存在老股流动性，但仍没有提供正式交易细节。
