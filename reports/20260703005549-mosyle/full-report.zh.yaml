      - - 带集中计费和报告的 MSP 渠道
        - 子账户规模可能高估终端客户广度，也可能让收入集中在少数伙伴手里
        - 若渠道健康，杠杆很强；若不健康，伙伴集中度会被藏起来
        - 按 MSP、终端客户和前 20 大账户索取 ARR 与 logo 集中度
      - - Mosyle@Home 与 OneK12 邻近产品
        - 面向家庭的新功能可能提升粘性，但尚未披露采用率或使用数据
