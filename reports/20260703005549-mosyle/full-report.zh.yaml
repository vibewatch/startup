      - number: '2.3'
        title: 买方、用户和付费方横跨 SMB、企业、K-12 与 MSP
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的买方地图更多按运营模式分段，而不是围绕一个通用 IT 人设。SMB 场景里，经济买方往往是业主、办公室经理或精简 IT
              管理员，他们想要低成本远程配置、资产盘点、密码、加密和补丁能力，又不想承担企业级复杂度。评论站点和 Jamf 的 SMB
              定位都支持这一价格敏感、运营优先的打法。企业场景里，买方转向终端、办公场所或安全负责人；他们关心零接触注册、合规、身份支撑的访问，以及通过 Apple Business 和 MDM 策略部署新设备或已抹除设备。


              K-12 又不同。Apple 和 Mosyle 都把学校 IT 放在 Apple School
              Manager、共享设备工作流、花名册或身份同步、批量应用分发、内容过滤和学区级远程控制上。日常用户是教师、学生和教育 IT 团队，但预算所有者通常是学区或学校技术管理部门。MSP
              是第四个细分，不只是渠道细节：Mosyle 和 Addigy 都把 MSP 价值放在多租户、继承策略、迁移支持、按租户报告和集中账单上。Jamf 又通过渠道经济补上一层细节，披露约 62% 的 ARR
              由渠道促成。在 Mosyle 相关的四个细分中，付费方通常是组织而不是终端用户，但采用触发点差异很大：SMB 是低成本自动化，企业是零接触治理，K-12 是课堂规模部署，MSP 是人效杠杆。
