  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Mosyle 方案
      - 可衡量收益
      - 限制
    rows:
      - - 注册新的 Apple 设备
        - 用 Apple Business 或 School Manager 加一个 MDM，从首次开机起监管设备
        - Mosyle 在 Apple 注册原语上叠加零接触注册、策略分配和持续管理
