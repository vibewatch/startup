  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 核心假设
      - 估值区间（US$B）
      - 估值逻辑
      - 关键风险
    rows:
      - - 悲观
        - 30%
        - 可比公司估值纪律收紧，支持摩擦持续，下一次定价事件重置到可见二级市场标记之下。
        - 0.55-0.70
        - 约为 Jamf 2026 年 7 月公开价值的三分之一到五分之二；缺失披露不给溢价。
        - 下轮降价、留存转弱，或优先权压顶。
      - - 基准
        - 50%
        - 可见的 ~2026 标记方向上仍合理，但 ARR、利润率和清算分配数据缺失压低置信度。
        - 0.75-0.95
        - 围绕 Forge 的 ~$0.899B 标记锚定，低于任何自动 $1B+ 假设。
        - 当前公开证据始终无法从部分升级为完整。
      - - 乐观
        - 20%
        - 私下尽调证明留存强、利润率像软件、流失低、股权结构表干净，同时增长保持健康。
        - 1.00-1.20
        - 要求投资者在当前可见标记之上支付稀缺性溢价，但仍低于激进炒作估值。
        - 运营证据或清算分配条款无法验证溢价。
      - - 概率加权判断
        - 100%
        - 公开证据支持一个仍在运转的溢价故事，但还不是完全去风险的故事。
        - 0.77-0.90
        - 权重偏向基准情景；披露失败带来有意义下行。
        - 任何融资或支持质量上的负面意外，都会把实现价值向下拉。
    notes: 区间是以可见 2026 二级市场标记、Jamf 公开估值和 Mosyle 缺失的经济性披露为锚的公开证据估算，而不是正式 DCF。
    claimRefs:
