      - number: '3.2'
        title: 能力、包装与入门价格
        blocks:
          - type: paragraph
            body: >-
              Mosyle 最强的表层切入点很简单：相对于更知名的同行，它仍展示出异常低的公开 Apple 设备定价。Mosyle Business 标价 $1 / 设备 / 月，K-12 计划标价 $5.50 至 $9.00
              / 设备 / 年，Mosyle Fuse MSP 在佣金后宣传激进的有效价格。相比之下，Jamf 在 Software Advice 的公开起点是 $3.67 / 月，Jamf
              自己的定价页则把更大客户导向演示、本地化定价和经销商报价。Microsoft Intune 的商业逻辑完全不同：Intune Plan 1 是 $8 / 用户 / 月，Plan 2 是 $4 附加项，$10
              Intune Suite 则把产品推向更宽的终端与安全捆绑，而不是 Apple 优先工具。Hexnode 发布 $4.7 / 设备 / 月的 Essentials 入门档；JumpCloud
              的对比页面显示月费起点为 $3。单靠价格不能决定购买，因为捆绑包不同。Jamf 通过 Jamf Pro、Connect 和 Protect 打包 Apple 管理、保护和身份。Iru 最强调终端 + 身份 +
              合规叙事，并加入免费迁移支持。Addigy 用实时远程控制、合规报告和 MSP 工作流做差异化。Workspace ONE 强调覆盖各主要 OS 的自助服务、条件访问、按应用 VPN 和补丁。JumpCloud
              和 Rippling 都把框架扩到 Apple 之外：JumpCloud 靠身份和目录控制，Rippling 靠 HR 驱动的设备生命周期编排。简言之，在公开入门价上，Mosyle 通常是最便宜且可信的
              Apple 优先选择；但若干竞争对手也能用更宽的平台控制或更强的企业分销来证明更高支出的合理性。
