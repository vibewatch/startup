      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动都是结构性的。第一，Apple、Microsoft 和 Addigy
              文档都把零接触注册和远程策略控制当作标配，这意味着买方越来越期待免接触开通，而不是手工镜像或桌边配置。第二，身份和安全附加销售扩大钱包份额：Apple Platform SSO、分析师对 UEM 的定义，以及
              Jamf 产品栈，都把注册与访问控制、权限和终端防护连在一起。第三，远程办公、BYOD 和移动劳动力继续支撑 MDM 与终端安全预算，即便 Mosyle 这类厂商聚焦的是组织托管的 Apple
              设备群。第四，教育和 MSP 仍是真实子市场，不是臆想相邻业务，因为 Apple、Research and Markets、Mosyle 和 Addigy 都明确发布了学校或多租户运营模式。


              约束同样重要。一旦买方希望用一套跨平台 UEM 覆盖 Windows、Android 和 Apple 混合设备群，Apple 专属范围就会缩窄 Mosyle 的实际市场。运营切换也不轻：Apple
              Business 或 School Manager、MDM 推送证书、MDM
              服务器分配和锁定式注册策略，即便不造成永久锁定，也会制造部署摩擦。公开评论页面还显示，低价本身不能消除执行风险；买方仍会报告应用部署、更新行为、导航或缺少自助资源等问题。最后，市场增长话术必须谨慎使用。MDM
              公布的 26.1% 增速快于 IAM 或终端安全增长，这有助于上行叙事；但 Mosyle 仍缺少公开细分结构和附加率披露，所以品类快速增长不会自动转化为清晰的 SOM 转化。
