  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与获客动作
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的公开材料支持一个直接但分段的经常性收入模式。公司在企业、学校和 MSP 渠道按设备销售订阅，再把集成安全、身份、隐私和应用管理功能叠加到 Apple
              设备管理之上。对一家私营软件供应商来说，企业定价页面异常明确：Business Premium 为 $1.00 / 设备 / 月，Fuse for macOS 为 $3.00，Fuse for iOS /
              iPadOS / visionOS 为 $1.50，最多 30 台设备还有免费层。学校定价更低，广告入口价为 $0.46 / 设备 / 月；MSP
              计划则采用不同的批发式结构，包含渠道佣金和预付月度账单。同样重要的是，Mosyle 声称超过 90% 的客户直接购买，并把商业模式描述为「no middleman」加「no
              sales」，暗示一个由网站驱动、低接触的获客引擎，并由免费上线导入、延长试用和迁移抵扣强化。这个组合让漏斗顶部和标价故事比真实经济性更清楚：公开网站展示了 Mosyle
              希望买方看到的内容，但没有披露折扣、捆绑或收入确认细节，无法把标价转成可支撑投资判断的收入质量。
