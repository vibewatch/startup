      - number: '4.3'
        title: 成本结构、利润率驱动与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Mosyle
              自己的叙事是，成本纪律具有结构性：公司称其在集成云原生栈上自研软件，主要直销，避免沉重的外勤销售费用，并使用有助于营运资本的预付账单机制。如果属实，这些都是实质正面因素。但同一份公开记录也显示了一些容易被低估的成本。免费上线导入和高接触支持意味着客户成功支出。MSP
              渠道明确通过 100% 佣金和 ACN 抵扣让出首年经济性。Assetbots 和 AccessMule 显示公司继续扩张到相邻工作流，这可以扩大钱包份额，也会增加集成、支持和产品投入负担。Mosyle
              不公布毛利率桥，所以最干净的公开代理来自 Jamf 的 2024 年 10-K：即便是已经成规模的 Apple
              管理同行，尽管收入几乎全由订阅驱动，仍在客户成功、第三方托管、佣金和营销上投入很重。资本充足性更难钉住。官方文案仍称 Mosyle 已融资超过 $215 million，且公司不是为生存才需要这笔钱；而 2026
              年 Form D 披露的发行额略低于 $100 million，公开数据库对累计融资的分歧很大。CB Insights 称 $348.34 million；Forge 称 $310.63 million，并给出
              2026 年 3 月 $898.96 million 的估值信号。没有任何已审阅公开来源披露现金、烧钱速度、现金跑道或债务，所以资产负债表故事更像叙事，而不是经过验证的事实。
