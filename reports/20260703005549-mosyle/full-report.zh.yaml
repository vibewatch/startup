  - id: TV005
    title: 打破论点和否决触发点表
    columns:
      - 触发点
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 2026 价格重置
        - 下一次定价事件低于或仅持平于可见 Forge 标记
        - 会显示当前市场参与者并不支持溢价扩张故事。
        - 把案例重切到悲观区间，并停止把 ~$899M 当作稳定支撑。
      - - 收入证明
        - 管理层无法展示当前 ARR 或收入，实质性验证当前标记
        - 打破“定价透明和客户数量说法能转化为变现质量”的假设。
        - 暂停承销，直到收入和留存数据给出。
      - - 支持 / 产品质量
        - 支持延迟、部署重试或文档摩擦实质恶化
        - 压缩留存，并降低低价供应商应得倍数。
        - 对基准情景加更重折扣，并重访客户推荐。
      - - 优先权堆栈
        - 高级清算权在基准情景区间附近吸收大部分退出回款
        - 意味着企业价值上行无法转化为普通股上行。
        - 没有完整清算分配模型就不要推进。
      - - 融资清晰度
        - 管理层无法对齐官方文案、Form D 历史和第三方市场数据
        - 即使在测试经济性之前，价格锚本身也存疑。
        - 把建议维持在继续研究，并要求用文件对账。
    notes: 每个触发点都直接绑定估值传导，而不只是泛泛的运营风险。
    claimRefs:
      - CV032
      - CV033
      - CV037
      - CV039
      - CV048
      - CV049
      - CV055
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前 ARR / 收入
        - 截至最近可用月份的月度 ARR 或收入桥
        - 没有实时收入锚，公开标记就无法换算成有依据的倍数。
        - 索取 CFO 汇报包和月度收入桥。
      - - 毛利率和支持负担
        - 按细分客群拆分毛利率，以及托管、入驻和支持成本明细
        - 需要判断低价、高服务策略是否仍能赚到软件质量的经济性。
        - 财务和客户成功尽调，并由 QA 或 QoE 审查支撑。
      - - 留存质量
        - 按客户群组拆分客户数流失、总收入留存、净留存和降级
        - 决定评论网站上的价值信号能否转化为持久现金流。
        - 客户群组留存资料包和抽样合同续约。
      - - 现金、烧钱、现金续航和债务
        - 当前现金余额、烧钱节奏、现金续航模型和债务时间表
        - 改变下行保护和任何新融资的紧迫性。
        - 董事会材料、现金流量表和贷款文件。
      - - 股权结构表和清算分配
        - 优先股堆栈、期权池、附属协议和建模清算分配
        - 决定所有情景区间里谁拿走价值。
        - 法律资料室，加独立重建的清算分配模型。
      - - 融资对账
        - 用文件解释为什么官方文案、Form D 通知、Forge 和 CB Insights 对不上
        - 投资者谈入场前，需要知道哪个价格锚是真的。
        - 公司法律顾问、财务和领投方尽调会。
    notes: 这些是委员会考虑支付接近溢价私有市场估值前，最低限度缺失资料包。
    claimRefs:
      - CV019
      - CV025
      - CV026
      - CV029
      - CV031
      - CV049
      - CV056
