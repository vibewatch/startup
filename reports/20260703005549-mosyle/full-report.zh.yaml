  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法务、监管与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的头号风险不是已经进入公开案卷的诉讼，而是平台公开声称可处理的敏感数据和控制流范围太宽。企业隐私政策称，Mosyle 可以处理管理员身份数据、大量设备遥测、DNS 过滤请求日志；在 macOS
              上，甚至包括客户自写脚本采集的任意信息，而 Mosyle 自身并不控制这些脚本。学校和 Mosyle@Home 页面进一步扩大敞口：Mosyle 面向 K-12 设备群销售家长控制、网页过滤和学校凭据；2026
              年家庭产品让家长在课后查看应用使用、屏幕时间，并可能查看互联网使用历史。即便本轮未发现公开执法行动，这也在 FERPA 和 COPPA 相邻框架下形成真实合规负担。Mosyle
              的法律条款有助于界定姿态，但不能消除风险。公司称，客户和管理员负责取得必要同意并合法使用服务；同时限制责任、将争议推向仲裁，并拒绝承诺服务不中断。缓释措施存在：书面的数据泄露响应表述、披露的子处理方，以及声明参与
              Data Privacy Framework。但这些只是基础控制，不是公开证据，不能证明逐学区的家长同意、学生记录或跨境传输义务已经被充分压力测试。
