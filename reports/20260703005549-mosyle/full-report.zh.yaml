      - number: '7.3'
        title: 团队、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              执行和融资风险排在隐私与平台依赖之后。公开证据显示，公司持续加范围：2023 年 AI 驱动的零信任、2024 年新 MSP 产品、2025 年 AccessMule 子公司、2026 年
              Mosyle@Home。招聘页面同时显示，工程、上手、支持、薪资、安全和设计岗位都在招聘，且大量活动分布在巴西和佛罗里达。这本身不是负面，但意味着跨境运营复杂度和持续支持需求；同时，公司正从核心 MDM
              拓宽到身份、访问和面向家庭的学校工具。领导层深度在公开材料里只部分可见：Mosyle 2021 年强调首次任命 COO，但保留材料仍让更广管理梯队、董事会和财务组织深度不透明。财务风险更未定。Mosyle
              自己的首页称，公司已实现盈利和自由现金流，并为长期一致性而非生存融资 $215M；但 2026 年 SEC Form D、CB Insights 和 Forge
              没有拼出关于累计融资或当前资本结构的一致图景。SEC 文件显示新近约 $100M
              豁免发行，并拒绝披露收入区间；审阅来源也没有披露现金消耗、现金余额、现金跑道或债务。因此，剩余投资判断风险不太是短期破产，而是要在未解的模糊性下付价。
