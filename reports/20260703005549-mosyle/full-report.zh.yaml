        title: 满意度信号偏正面，但留存证明仍薄
        blocks:
          - type: paragraph
            body: >-
              独立评论平台支持这样的判断：Mosyle 在日常使用中确实有价值，尤其体现在性价比和上手。GetApp 和 Software Advice 都有 86 条评论样本，总评分 4.6；两个页面都指向约
              $1/设备的入门价位附近有较强性价比。评论文本也呈现一个对运营重要的模式：客户称赞响应速度、上手帮助和直观的 Apple 设备管理。同一组证据也指出摩擦。GetApp
              提到应用部署重试、导航混乱、支持延迟，以及需要更好的自助资源；G2 包含文档薄弱、加载时间、tvOS 深度不足，以及更新 /
              应用集成缺口的评论。这些都是有意义的满意度限定，但仍不能转化为真正的耐久性指标。审阅过的公开来源没有披露 NRR、GRR、客户 logo
              流失、续约率、合同期限、分群行为或大客户依赖；公开状态页也只是某一时点的运营快照，不是历史正常运行时间或留存序列。
