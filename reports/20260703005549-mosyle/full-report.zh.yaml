      - number: '2.5'
        title: 公开证据仍无法拆清的部分
        blocks:
          - type: paragraph
            body: >-
              本章最大的风险是伪精确。公开来源足以定义边界，说明 Mosyle 至少横跨四类买方，并证明 Apple 优先管理位于一个带有安全和身份相邻业务的真实软件栈中。它们不足以拆出 Mosyle 真实的 Apple 专属
              TAM、SAM 或 SOM。本章没有任何公开来源提供分细分收入、设备组合、区域组合，或按模块划分的附加率。


              公开采用披露也足够不一致，在管理层调和之前，只能当作方向性证据，而不能当作标准口径。尽调下一步不是再找一页公开 TAM，而是向管理层索取证据包：当前客户数、托管设备数、按 SMB / 企业 / 学校 / MSP
              划分的收入，以及身份、安全和补丁模块的附加率。在那之前，市场规模只能给叙事画边界，不能硬拟合出一个可直接套倍数的精确 TAM。
            claimRefs:
              - CM041
              - CM042
              - CM045
