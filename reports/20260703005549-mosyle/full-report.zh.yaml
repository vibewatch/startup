      - number: '2.2'
        title: 多重规模口径：保留区间，不要硬凑一个 TAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持 Apple 管理赛道健康增长的叙事，但支撑不了一句干净的 TAM 结论。最窄的广义市场锚点是移动设备管理：MarketsandMarkets 估计 MDM 从 2022 年 USD 6.9
              billion 增长到 2027 年 USD 22.0 billion。这是最接近 Mosyle 设备管理核心的公开类别，但仍然太宽，因为它包含 Android、Windows
              厂商和服务。再往上一层是终端安全，MarketsandMarkets 给出 2026 年 USD 17.76 billion 市场，Research and Markets 则给出 2025 年 USD 21.9
              billion、到 2034 年升至 USD 47.1 billion。身份市场更宽：MarketsandMarkets 估计 IAM 在 2025 年为 USD 25.96 billion，2030 年为
              USD 42.61 billion。


              这些数字并不是非此即彼的矛盾；如果在 Mosyle 备忘录里混用，它们才会变成矛盾。Research and Markets 把 MDM、IAM 和终端安全一起纳入 UEM，正好把口径膨胀路径讲明白。Apple
              专属变现的最佳公开下限，不是分析师 TAM，而是 Jamf 的经营规模：76,500 个客户、33.2 million 台已部署设备，以及截至 2024 年底 USD 646.0 million
              ARR。Mosyle 自己的披露能证明需求广度，但不能给出标准市场规模，因为其公开口径在 52,000 个客户账户、超过 60,000 或 65,000 个组织之间变化，设备口径也从 7 million
              台到更模糊的「数百万」。诚实的表述应当分层：Apple 优先 MDM 是核心，身份和终端安全是可变现相邻业务，更宽的 UEM 或 IAM 数字只是天花板视角，不是直接 TAM。
