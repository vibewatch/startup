  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：先看 Apple 设备管理，再看安全和身份
        blocks:
          - type: paragraph
            body: >-
              界定 Mosyle 时，第一层应是 Apple 优先的设备管理控制平面，然后才扩展到相邻的安全和身份预算。Apple 自己的部署文档把核心任务说得很清楚：设备管理服务远程配置设备，更新软件和设置，监控合规，并能在
              iPhone、iPad、Mac、Apple TV、Apple Watch 和 Vision Pro 上锁定或抹除终端。通过 Apple Business 或 Apple School Manager
              做自动设备注册，是组织自有设备的标准路径；Microsoft Intune 从替代品侧也记录了同样架构。


              这个核心 MDM 层并不是 Mosyle 的全部故事。Apple Platform SSO 让 macOS 登录和本地账户生命周期同时依赖 IdP 扩展和设备管理。Research and Markets 明确把
              UEM 定义为捆绑 MDM、IAM 和终端安全的伞形类别，这与 Mosyle 自己把产品定位为统一 Apple 平台、而不是狭义配置下发工具相吻合。因此，应纳入的支出包括 Apple 专属 MDM 订阅、Mac
              身份和 SSO、Apple 终端安全、应用和补丁管理，以及与 MDM 绑定的隐私或过滤模块。排除项同样重要：Apple 硬件采购、与托管 Apple 设备无关的通用企业 IAM、宽泛 SIEM 或 SOC
              预算、独立专业服务，都不属于 Mosyle 的实际核心 TAM。主要替代方案是 Apple 原生管理加脚本、Microsoft Intune 这类跨平台套件、Jamf 和 Addigy 这类 Apple
              优先老牌厂商，以及外包 MSP 管理。
