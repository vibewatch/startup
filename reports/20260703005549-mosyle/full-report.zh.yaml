companyProfile:
  summary: >-
    Mosyle 是一家聚焦 Apple 的私营网络安全和 IT 管理供应商，总部位于 Florida 州 Winter Park，并与 Brazil 运营团队保持联系。其 Apple Unified Platform
    将设备管理、终端安全、身份和认证流程、在线隐私 / 过滤、应用和补丁管理整合起来，服务企业、K-12 学校和 Apple MSP。公开来源支持产品一致性强、入门价格透明、规模可观，但也显示公开客户数披露不一致，财务透明度有限。
