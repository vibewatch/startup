  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the public and peer-set valuation anchors visible in retained July 2026 sources; only Jamf has a current
        disclosed valuation in the reviewed set.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 限制
    rows:
      - - Jamf
        - 2026 年 7 月市值和已披露上市公司指标
        - $1.74-$1.75B 市值；2.47x PS；2.89x EV/Sales
        - 最干净的经审计 Apple 优先管理软件上市可比，披露客户、设备、收入和利润率数据。
        - 规模更大、披露深度高于 Mosyle；已被 Francisco Partners 收购，实时公开可比集变薄。
      - - Iru / Kandji
        - 保留对比来源中的同业存在感
        - 私有同业；保留材料中没有当前披露估值
        - CB Insights 竞争对手列表点名的专注 Apple 的设备和身份管理同业。
        - 保留来源未提供当前收入、股权结构表或轮次估值。
      - - JumpCloud
        - 保留对比来源中的同业存在感
        - 私有同业；保留材料中没有当前披露估值
        - 评论对比页面上相关的跨平台身份和设备管理参照物。
        - 产品范围更宽，且保留材料没有估值锚，倍数比较很弱。
      - - Hexnode / Mitsogo
        - 保留对比来源中的同业存在感
        - 私有同业；保留材料中没有当前披露估值
        - 用于判断定价压力和 SMB 或中端市场替代品的有用 UEM 基准。
        - 保留来源显示竞争存在感，不给当前财务或估值。
    notes: 可比篮子刻意保持部分，因为保留的公开证据只给出一个干净估值锚：Jamf。私有同业行展示战略相关性，但不给当前价格。
    claimRefs:
      - CV034
      - CV035
