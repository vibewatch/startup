    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 正方论点：透明标价、迁移抵扣和直销说法，指向一个 CAC 可能较高效的模型。
        - 按企业、学校和 MSP 客户群组展示已实现净收入、CAC 回收期和续约行为。
      - - 正方论点：评论网站总体支持价格 / 价值匹配，评分为 4.6/5，性价比得分强。
        - 证明这些满意度信号能转化为持久留存，并在规模化后不带来高支持负担。
      - - 正方论点：新的 ~2026 年 $100M 融资事件显示资本通道仍然打开。
        - 提供最终交割文件、投资方名单和资金用途细节，确认这不只是部分成交或一笔一二级混合交易。
      - - 反方论点：官方客户规模说法在当前资产之间互相冲突，因此公开牵引力只能作为方向性信号。
        - 在一张注明日期的 KPI 表里对齐付费账户、免费账户、学校、MSP 子账户和受管设备数。
      - - 反方论点：评论和对比来源仍指向相较 Jamf 的文档、支持和部署摩擦。
        - 证明尽管有这些批评，公司仍能降低流失、加快支持响应并保持高扩张。
      - - 反方论点：可见的 ~$899M 标记已经大约是 Jamf 公开价值的一半，但披露质量并不像 Jamf。
        - 给出经审计的经济性和干净股权结构表，证明稀缺性溢价倍数站得住。
    notes: 本表把公司质量论点和价格支撑论点拆开，确保最终判断对估值敏感，而不是只看产品。
