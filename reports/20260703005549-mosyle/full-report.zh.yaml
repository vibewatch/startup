  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块 / SKU 地图
        blocks:
          - type: paragraph
            body: >-
              与其把 Mosyle 理解成通用 UEM 目录，不如把它看作一个 Apple 管理工作流压缩器。对企业来说，任务是注册 Mac、iPhone、iPad、Apple TV
              和手表；执行基础安全；把登录绑定到公司身份提供商；推送应用和补丁；并把支持量压到足够低，让小型 IT 团队也能扩张。对学校来说，工作流扩展到教师控制、Shared
              iPad、面向家长的课后监督，以及对学生安全的网页访问。对 MSP 来说，任务又不同：先一次性创建可复用策略模板，再在每个客户处有选择地覆盖 Apple Push Certificate、IdP、VPN 或
              Exchange 设置，而不必从零重建整套栈。跨这些界面，Mosyle 反复讲同一个五支柱模块故事——设备管理、终端安全、隐私、身份和应用管理——再用分细分包装包起来。最新的相邻层也很重要：Assetbots
              增加资产生命周期和同步工作流；AccessMule 则越过终端控制，进入访问和密码管理。这让当前产品地图比普通 Apple MDM 更宽，但仍锚定在同一个 Apple 专属运营问题上。
