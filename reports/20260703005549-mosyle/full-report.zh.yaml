      - number: '5.3'
        title: 部署、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              对一家私营终端供应商来说，公开部署和支持信号异常明确。Mosyle 反复把免费上线导入、免费试用、迁移抵扣和快速支持作为产品成功的组成部分来营销，而不是边缘服务。2026 年企业页面进一步声称，Apple OS
              26 原生迁移可以在切换 MDM 时减少抹机和停机；这一点重要，因为 Microsoft 自己的 Intune
              文档仍把取消注册再重新注册描述为设备在供应商之间迁移时的常规基线。可靠性方面，保留的状态页在抓取时是绿色，但公开证据没有再往前延伸：保留材料中没有出现事故历史、正常运行时间趋势或 SLA
              报告。路线图能见度强于运营透明度。新闻室和发布集合显示，公司从 2023 年 AI 脚本和 Automated Zero Trust，到 2024 年 Fuse MSP 和 Assetbots，再到 2025 年
              AccessMule 以及对 Apple 秋季管理更新的 beta 支持，最后到 2026 年
              Mosyle@Home，保持了稳定节奏。这个模式说明产品组织愿意围绕相邻工作流快速扩大产品面。代价是，相比每个新模块的成熟度、附加率或企业级加固深度，发布数量更容易验证。
