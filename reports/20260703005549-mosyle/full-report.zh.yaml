  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 最佳公开可得代理指标
      - 重要性
      - 精确尽调路径
    rows:
      - - 当前 ARR / 收入和 2023-2026 年增长桥
        - 2022 年称自 2020 年以来三位数增长，外加当前客户数量和评论代理指标
        - 需要它判断规模、增长耐久性和估值支撑
        - 索取从 2022 年到当前月份的月度 ARR、确认收入和 bookings 桥
      - - 成交定价和折扣瀑布
        - 公开标价、免费层、迁移抵扣和 MSP 佣金
        - 仅靠标价看不出实际 ARPU 或收入质量
        - 审阅近期业务、学校和 MSP 协议，以及定价委员会材料
      - - 毛利率和收入成本拆分
        - Jamf 10-K 只能提供可比成本结构代理
        - 利润率路径是判断低价、高支持策略的核心
        - 索取按细分市场拆分的毛利率，以及托管、支持、佣金和导入成本项
      - - CAC 回收期、NRR 和流失
        - 直销占比、评论分数和免费导入只是方向性代理指标
        - 这些指标决定高效获客是否真正转化为耐久经济性
        - 索取渠道层面的 CAC、回收期、cohort 留存和降级原因
      - - 现金、消耗、现金跑道和债务
        - 2026 Form D 和相互冲突的融资数据库显示有资本活动，但不显示当前流动性
        - 没有实时资产负债表数据，就无法分析资本充足性
        - 索取最新董事会材料，包含现金、消耗、现金跑道和债务表
      - - 客户集中度和细分组合
        - 官方网站提到企业、学校、政府实体和 MSP，但没有收入贡献
        - 少数大型学区或渠道账户可能扭曲收入质量
        - 索取按细分市场的 ARR、前 20 大客户敞口和 MSP bookings 占比
      - - 收购 / 子公司贡献
        - Assetbots 和 AccessMule 扩张公开可见，但收入和成本影响不可见
        - 周边业务可以改善增长，也可能隐藏整合成本或利润率稀释
        - 索取周边产品的收购后 P&L、附加率和整合成本跟踪
    notes: 这些是把有希望的公开故事推进到可完整投资测算的财务模型所需的最低缺失披露。
    enumerationScope:
      coverage: partial
      basis: Captures the highest-value underwriting gaps for this chapter rather than every missing private-company metric.
    claimRefs:
