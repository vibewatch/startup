      - number: '4.2'
        title: 公开牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Mosyle 提供了几个正面但不完美的销售效率代理指标。最强的是透明标价、免费到付费入口、免费上线导入，以及直接网站销售主导收入组合的说法。独立评论市场也提供了一些支持：GetApp 和 Software
              Advice 都显示 86 条评论给出 4.6 / 5 评分，其中性价比分数尤其强，并有约 $1 / 月的公开起步价信号。这些都是价格与价值匹配的有用代理。官方牵引力数字却很混乱。不同 Mosyle
              页面分别声称超过 47,000 个组织、近 50,000 个客户、超过 52,000 个客户账户、超过 60,000 个组织，以及全球超过 65,000
              个组织。这个不一致不能证明夸大，但意味着公开规模只能当作方向，而不是精确数。MSP 动作又提供了另一个效率线索：Mosyle 愿意通过首年 100% 佣金、ACN 抵扣和集中账单 /
              报告牺牲近期利润率，因为它看起来更看重合作伙伴获客和下游留存，而不是首年毛利。同时，反向评论信号也确实存在。GetApp 提到应用部署重试、导航困惑和支持延迟；PeerSpot 的 2026 年对比仍把 Jamf
              在支持深度和整体市场位置上放在明显前面。因此，获客解读偏正面，但并非没有摩擦。
