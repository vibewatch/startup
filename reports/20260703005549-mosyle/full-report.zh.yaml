chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与阶段
        blocks:
          - type: paragraph
            body: >-
              即便部分经营指标前后不齐，Mosyle 的核心定位反而异常一致。无论主页、企业站还是学校站，公司都把自己描述为一个 Apple 专属平台，把设备管理、安全、隐私、身份和应用控制整合起来，服务使用
              Mac、iPhone、iPad、Apple TV 及相关 Apple 终端的组织。企业站尤其强调 Mosyle 不只是传统 MDM 工具：它突出集成的终端安全、加密 DNS 过滤、macOS
              身份工作流和应用补丁；学校站则展示同一套 Apple 优先架构如何适配 K-12 工作流和定价。定价和包装也强化了这一产品定位。Mosyle Business 为最多 30 台设备提供免费入口，企业高级计划按
              $1 / 设备 / 月计费，Mosyle Fuse 另行定价；教育站则公布按设备计费的年费档位。


              多个来源支持 Florida 州 Winter Park 是公司当前总部，但更长的起源故事更复杂。TechCrunch 称 Alcyr Araujo 2012 年在 Brazil 创办 Mosyle，2015
              年切入美国市场，2016 年把运营迁到美国。学校站补充说，Mosyle 最初是 iPad 优先的学习管理系统，之后转向面向学校的 Apple MDM；MSP 站则把 2016
              年定义为当前增长阶段的起点。招聘页面又显示，今天的招聘同时连着 Florida 和 Brazil，这说明公司真实运营模式是以 Winter Park 为中心、但地理上分布式的组织。合在一起，公开记录支持
              Mosyle 是一家后期私营 Apple IT 平台公司，产品身份和法律落点清晰，但它并未披露带有审计级经营事实的完整公司画像。
