        title: 扩张路径可见；集中度风险仍不透明
        blocks:
          - type: paragraph
            body: >-
              Mosyle 的公开记录能看到可信的扩张回路。学校场景里，公司正借 Mosyle@Home 从设备控制延伸到家长管理的课后使用，把关系从 IT 管理员拓宽到家庭。企业场景里，迁移计划、免费上手、延长试用和
              Apple OS 26 迁移支持降低切换摩擦；设备一旦注册，就有先落地再扩张的 机会。MSP 场景里，Mosyle
              提供集中计费、按客户报告和首年佣金经济性，有意补贴合作伙伴获客和后续席位扩张。短板是，这些可见扩张路径没有披露收入集中度实际如何变化。公开来源没有按学校、企业、MSP 拆分
              ARR，没有说明大型学区或渠道带来的子账户贡献多少收入，也没有说明激进的首年 MSP 激励是否带来健康的多年留存。Mosyle 有意不发布客户
              logo，进一步放大盲区：公司可能是在保护客户隐私，但也迫使投资者用比头部规模说法弱得多的外部证据来判断集中度和耐久性。
