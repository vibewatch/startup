      - CI042
  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - Apple 设备管理核心
        - IT 管理员 / 端点团队
        - 在各产品界面都已成熟且处于核心位置
        - Apple 专属工作流密度高，并支持自动化持续管理
        - 需要按模块拆出的使用结构，以及各客群的附加购买率
      - - 端点安全（Fuse / OneK12 安全集）
        - 安全管理员 / IT 通才
        - 商业和学校场景已成熟；仍在借 2023-2025 年发布继续扩展
        - 与设备管理集成，而不是作为独立控制台销售
        - 需要有效性数据、检测率，以及按模块拆出的付费附加购买率
      - - 在线隐私与 DNS 安全
        - 安全管理员 / 学校 IT
        - 功能族已成熟；对外主打始终在线的原生加密 DNS
        - 面向 Apple 的部署和过滤，无需额外硬件设备配置
        - 需要关于策略粒度、误报和续约率的公开证据
      - - Auth 2 / 身份管理
        - IT 管理员 / IAM 管理员
        - 在支持的 IdP 上已成熟；部署限制仍取决于 OS 和 IdP
        - macOS 登录窗口控制，加上 Apple 专属 SSO 工作流
        - 需要大规模部署证据和故障恢复表现
      - - 应用与补丁管理
        - 端点管理员 / 服务台
        - 成熟，并已广泛打包进产品
        - App Store、PKG、DMG、临时应用和应用目录放在同一条工作流里
        - 需要补丁覆盖率统计和第三方应用成功率
      - - 教育工作流 / OneK12 / Mosyle@Home
        - 学校 IT / 教师 / 家长
        - 核心课堂流程已成熟；2026 年家庭控制功能仍较新
        - 专为 K-12 打造的控制、Shared iPad、教师工具和家长层
        - 需要传统学校 MDM 与较新家庭功能之间的采用拆分
      - - Fuse MSP 控制平面
        - MSP 业主 / 技术员
        - 较新，但 2024 年发布后商业推进激进
        - MSP 级策略，加上按客户设置例外和集中计费
        - 需要按 MSP 客群批次拆出的流失、经销商采用和利润率韧性
      - - Assetbots 邻近业务
        - 运营 / 资产负责人 / IT 管理员
        - 2024 年收购后新增的邻近业务
        - 与设备、用户和分配关系双向同步，把工作流从端点策略扩到更外层
        - 需要更深度原生接入 Mosyle 管理流程的路线图时间表
      - - AccessMule 邻近业务
        - SMB 管理员 / 运营 / 安全
        - 2025 年发布后新增的邻近业务
        - 把 Mosyle 的邻近业务延伸到访问治理和共享凭证工作流
        - 需要交叉销售、统一计费和共享身份路线图的证据
    notes: 各行区分 Mosyle 核心模块与较新的邻近资产；成熟度标签基于保留的公开证据， 而不是内部使用或收入贡献。
