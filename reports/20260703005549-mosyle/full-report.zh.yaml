  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接与相邻竞争格局
        blocks:
          - type: paragraph
            body: >-
              Mosyle 首先竞争的是 Apple 专属平台，而不是抽象意义上的通用终端管理。Jamf 仍是最根深蒂固的直接老牌厂商，企业声誉更深，第三方评论量更大，在 MDM 研究里的心智份额也明显更高。Iru 这个原名
              Kandji 的平台，如今围绕终端、身份和合规做更宽定位；它在保留 Apple 可信度的同时，更接近 Microsoft 式的平台宽度。Addigy 是最具 MSP 原生属性的 Apple
              替代方案：它主打实时控制、持续合规和单账户多租户，而不是 K-12 或宽泛企业捆绑。第二圈竞争来自 Microsoft Intune、Workspace ONE、Hexnode 和 JumpCloud 这类混合
              OS 套件。这些产品在信息传递上不如 Mosyle 那样纯粹 Apple，但当 IT 想用一个控制平面覆盖 Windows、macOS、移动端、身份和访问时，它们解决的是同一项买方任务。Rippling
              是相邻竞争者，而不是直接 Apple 专家：它的吸引力在 HR 到 IT 的生命周期自动化、设备物流和离职流程，而不是一流 Apple 管理。现实中的现状替代方案，是 Apple Business
              加内部脚本和点状工具。小规模设备群可以走这条路，但 Apple 自己的部署指引仍假设需要单独的设备管理服务，因此集成和合规工作会留给客户。
