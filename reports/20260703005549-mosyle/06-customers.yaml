chapter:
  number: 6
  title: Customers
  summary: Mosyle clearly serves schools, businesses, and MSPs, and public proof of live adoption is strongest in education and IT-help surfaces rather than glossy enterprise logo walls. Adoption claims trend materially upward across 2022-2026 sources, but the company uses inconsistent denominators for organizations, customers, accounts, and devices, while retention, concentration, and renewal metrics remain undisclosed.
sections:
- id: segmentation-and-public-scale
  title: Segmentation and public scale signals
  body: Mosyle's customer footprint is visibly segmented rather than monolithic. The public web separates school, business, and MSP offers with distinct pricing, workflow language, and onboarding motions, which is strong evidence that buyer, user, and payer patterns differ by segment. Education pages emphasize K-12 classroom control, Apple School Manager, and teacher workflows; business pages emphasize endpoint security, identity, patching, and migration from incumbent Apple-management stacks; MSP pages emphasize multi-tenant policy control, centralized billing, and commission economics. Public scale signals are directionally strong but not numerically clean. Historical sources move from 32,000 organizations in 2022 to 42,000 businesses and schools in 2023, 47,000 organizations in 2024, and a 2026 mix of more than 47,000 organizations, almost 50,000 customers, more than 52,000 customer accounts, over 60,000 organizations, and over 65,000 organizations. That trajectory supports real adoption
    momentum, but the mixed denominators mean public scale should be treated as a range rather than a single auditable customer-count KPI.
