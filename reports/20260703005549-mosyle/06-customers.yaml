  rows:
  - - K-12 schools and districts
    - District IT, school admins, teachers / students / school budget
    - Classroom management, Apple MDM, student device security, parent controls
    - Over 20,000 schools and millions of devices on Mosyle Manager
    - Foundational installed base and strongest named public proof
    - Public revenue mix by district size and renewal cohort is not disclosed
  - - Higher education
    - Campus IT / faculty, staff, students / institutional budget
    - Mac and iPad fleet management, identity, admin rights, software distribution
    - Named public references include Lafayette, West Chester, LaneCC, and WKU
    - High-quality public production proof on institutional domains
    - No public higher-ed ARR, seat count, or contract-duration disclosure
  - - Businesses and organizations
    - IT, security, operations / employees / employer
    - Apple endpoint management, identity, patching, zero-trust, onboarding
    - Business site claims over 65,000 organizations globally and almost 50,000 customers
    - Largest monetization surface and strongest pricing transparency
    - Direct named enterprise proof is much thinner than education proof
  - - MSPs and Apple consultants
    - MSP owner / MSP admins / MSP economic buyer
    - Multi-tenant policy management, centralized billing, customer reporting
    - Mosyle Fuse MSP is purpose-built for MSPs with first-year commissions and ACN credits
    - Channel leverage can widen distribution without direct-sales headcount
    - Public data does not show what share of bookings or ARR comes from MSPs
  - - Parents / households around school devices
    - School IT enables; parent or guardian uses; school remains payer
    - After-hours screen-time, app controls, web filtering, passcode help
    - Mosyle@Home launched in 2026 as a no-extra-fee extension for supported school customers
    - Extends relationship beyond campus into the household and may improve district stickiness
    - No public adoption or engagement numbers for parent accounts yet
  notes: Rows describe externally visible buyer, user, and payer patterns from Mosyle's public surfaces and named proof set; they do not represent a management-confirmed revenue segmentation waterfall.
