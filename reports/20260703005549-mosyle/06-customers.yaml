  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table
    missingEvidence: A broader set of business-domain or customer-authored enterprise references that explicitly name Mosyle in production use.
    whyItMatters: Current named proof is real but skewed toward higher-education and K-12 operations, which may understate or distort enterprise concentration.
    diligencePath: Request a reference pack of current business customers, anonymized top accounts, and at least three enterprise-admin interviews.
    relatedQuestionRefs:
    - QU009
    - QU021
    - QU022
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: Renewal and contract duration
    missingEvidence: Segment-level renewal rates, standard contract terms, downgrade reasons, and logo churn history.
    whyItMatters: Review scores are not a substitute for true durability metrics, especially when promotional acquisition tactics are visible.
    diligencePath: Request cohort retention tables, standard order forms, renewal notices, and churn analysis by school, business, and MSP segment.
    relatedQuestionRefs:
    - QU014
    - QU015
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: Customer concentration
    missingEvidence: ARR by segment, ARR by top-20 customers, and MSP-channel share of revenue or bookings.
    whyItMatters: The company may be diversified, but public evidence cannot rule out meaningful dependence on a handful of districts, campus accounts, or channel partners.
    diligencePath: Request segment ARR bridge, top-account concentration schedule, and partner concentration by managed devices and billings.
