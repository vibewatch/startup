- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Diligence path
  rows:
  - - Migration program, free onboarding, and six-month trials
    - Promotional economics can win switches but may mask payback quality
    - Helps land accounts quickly, especially against incumbent Apple-management vendors
    - Request free-to-paid conversion, assisted-close rate, CAC payback, and post-migration retention
  - - MSP channel with centralized billing and reporting
    - Subaccount scale may overstate end-customer breadth and could concentrate revenue in a small number of partners
    - Strong channel leverage if healthy; hidden partner concentration if not
    - Request ARR and logo concentration by MSP, end customer, and top-20 accounts
  - - Mosyle@Home and OneK12 adjacency
    - New household-facing features may improve stickiness but have no disclosed adoption or usage data yet
    - Could deepen school relationships beyond the school day
    - Request attach rate, parent activation, and impact on school renewals
  - - No-logo policy and thin enterprise references
    - External diligence cannot easily verify how many large brands are active production customers
    - Raises diligence burden on referenceability and concentration
    - Request customer-reference pack, top-account list, and anonymized cohort segmentation
  - - First-year 100% MSP commissions and ACN credits
    - Aggressive incentives may create channel growth while suppressing near-term unit economics or attracting price-sensitive partners
    - Good for expansion, but durability depends on year-two retention
    - Request multi-year gross margin and retention by MSP cohort created under the commission program
  notes: This table focuses on the visible land-and-expand motions and the specific concentration blind spots that remain unsolved by public evidence.
