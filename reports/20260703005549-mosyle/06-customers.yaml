- id: satisfaction-retention-and-friction
  title: Satisfaction signals are positive, but retention proof remains thin
  body: 'Independent review platforms support the idea that Mosyle delivers real day-to-day value, especially on price-to-value and onboarding. GetApp and Software Advice both show 86-review samples with 4.6 overall ratings, and both surfaces point to strong value-for-money readings around the $1-per-device entry point. Review text also supports a pattern that matters operationally: customers praise responsiveness, onboarding help, and straightforward Apple-device management. The same evidence set also flags friction. GetApp mentions app-deployment retries, confusing navigation, support delays, and a need for better self-service resources; G2 includes comments about weak documentation, load times, missing tvOS depth, and update/app integration gaps. Those are meaningful satisfaction qualifiers, but they still do not translate into true durability metrics. No reviewed public source discloses NRR, GRR, logo churn, renewal rates, contract length, cohort behavior, or top-customer dependence,
    and the public status page provides only a point-in-time operational snapshot rather than a historical uptime or retention series.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU036
  - CU037
  tableRefs:
  - TU004
- id: expansion-loops-and-concentration-risk
  title: Expansion is visible; concentration risk is still opaque
  body: 'Mosyle''s public record does show credible expansion loops. For schools, the company is extending beyond device control into parent-governed after-hours management through Mosyle@Home, effectively widening the relationship from IT administrator to household. For businesses, migration programs, free onboarding, extended trials, and Apple OS 26 migration support reduce switching friction and create land-and-expand opportunities once devices are enrolled. For MSPs, Mosyle offers centralized billing, per-customer reporting, and first-year commission economics that deliberately subsidize partner acquisition and downstream seat expansion. The downside is that these visible expansion paths do not disclose how revenue concentration actually behaves. Public sources do not break out ARR by schools versus businesses versus MSPs, do not identify the share of revenue coming from large districts or channel-led subaccounts, and do not reveal whether the aggressive first-year MSP incentives produce
    healthy multi-year retention. Mosyle''s intentional refusal to publish customer logos reinforces the blind spot: the company may be protecting customer privacy, but it also forces investors to underwrite concentration and durability with much weaker external proof than the headline scale claims imply.'
