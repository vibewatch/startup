companyProfile:
  summary: Mosyle is a private Apple-focused cybersecurity and IT management vendor headquartered in Winter Park, Florida, with operational ties to Brazil. Its Apple Unified Platform combines device management, endpoint security, identity and authentication workflows, online privacy/filtering, and app/patch management for businesses, K-12 schools, and Apple MSPs. Public sources support strong product coherence, transparent entry pricing, and meaningful scale, but they also show inconsistent public customer-count disclosures and limited financial transparency.
  foundedDate: '2012-01-01'
  founders:
    - name: Alcyr Araujo
      role: Founder and CEO
      background: Public sources identify Araujo as the founder who started Mosyle in Brazil in 2012 and led the company into the U.S. market before establishing its Winter Park base.
      claimRefs: [CO007, CO011]
  foundingLocation: Florianópolis, Brazil
  headquarters: Winter Park, FL
  productSummary: Apple MDM, endpoint security, macOS identity and SSO, encrypted DNS/privacy, app and patch management, and MSP tooling for Mac, iPhone, iPad, Apple TV, and related Apple fleets.
  customerFocus: Businesses, K-12 school districts, higher-education Apple environments, and Apple-focused managed service providers.
  businessModel: SaaS subscription with free entry tiers, direct sales for most customers, and channel expansion through Mosyle Fuse MSP.
  stage: Series B
  fundingStatus: Officially disclosed $196M Series B in 2022 plus public 2026 market-data evidence of an additional roughly $100M Series B-III event; public sources do not reconcile total capital, investor mix, or valuation cleanly.
  disclosureProfile: private-undisclosed
  claimRefs: [CO006, CO007, CO011, CO015, CO025, CO026, CO028]

summary:
  headline: Mosyle appears to be a credible, scaled Apple-only management and security platform, but public evidence is still too incomplete and internally inconsistent to underwrite a confident buy case at or above a unicorn valuation.
