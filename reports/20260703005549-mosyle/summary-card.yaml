  topStrengths:
    - Apple-only integrated platform across MDM, security, identity, privacy, and patching.
    - Transparent low-end pricing and direct-sales model that public reviews broadly rate as high value for money.
    - Meaningful public adoption signals across business, school, and MSP channels with millions of managed devices.
  topRisks:
    - >-
      Public economics, cap table, and 2026 financing history remain materially under-disclosed and internally
      inconsistent.
    - >-
      Privacy and compliance exposure is elevated because Mosyle handles deep device telemetry, filtering, and K-12 /
      parent-facing workflows.
    - >-
      Apple-platform dependence and support-quality friction could compound quickly if OS changes or service incidents
      impair product reliability.
  unresolvedGaps:
    - Current ARR, gross margin, burn, runway, debt, and retention metrics are not publicly disclosed.
    - No reconciled 2026 financing packet, investor list, or liquidation waterfall supports the public valuation story.
    - >-
      Public customer-count disclosures use conflicting denominators such as organizations, customers, accounts,
      schools, and devices.
