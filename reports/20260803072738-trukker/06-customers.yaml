  figureRefs:
  - FU003
- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: 'The main weakness in TruKKer’s public customer story is not adoption; it is retention visibility. None of the retained sources disclose NRR, GRR, churn, renewal rates, contract lengths, or top-customer concentration. We can infer some expansion logic: Omnilog suggests a path to cross-sell from road freight into sea, air, warehousing, and customs services; RTA/Logisty shows reuse of dispatch and pricing capabilities in adjacent categories; and the financial chapter suggests that institutional working-capital financing is easier to arrange when customer invoices are real and collections are sufficiently dependable. But these are indirect signals, not retention metrics. The carrier-side product surfaces and app-store freshness suggest active supply-side engagement, yet they do not reveal repeat frequency or supplier churn. As a result, TruKKer’s customer durability should be treated as promising but under-disclosed, and concentration risk should be assumed material until top-account
    mix and renewal data are produced.'
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU032
  - CU033
  - CU034
  - CU035
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer Verdict
  body: On public evidence alone, TruKKer has crossed the threshold from narrative startup to real networked logistics platform. The combination of large carrier counts, repeated enterprise-customer milestones, named customer mentions, and supply-side testimonials is too dense to dismiss as empty marketing. The more conservative conclusion is that customer breadth is better evidenced than customer depth. TruKKer appears to have real adoption across both the shipper and carrier sides of the marketplace, plus a plausible path to wallet-share expansion through forwarding and adjacent services. However, the investment case would be much stronger with customer-authored case studies, retention and concentration data, and clearer segmentation of active versus registered participants. For diligence, the right stance is that customer existence and category fit are validated, while durability and account economics are still private-evidence questions.
  claimRefs:
  - CU011
  - CU015
  - CU016
  - CU025
  - CU030
  - CU035
