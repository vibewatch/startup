chapter:
  number: 6
  title: Customers
  summary: TruKKer’s customer story is strongest on breadth of enterprise and carrier participation, with public growth anchors from 200 clients in 2019 to 700+ in 2022 and 1,200+ by 2025-2026. Public proof of named enterprise customers exists but is still thin relative to the headline network scale, while retention, concentration, and account-level economics remain largely private.
sections:
- id: customer-segmentation
  title: Customer Segmentation by Buyer, User, and Payer
  body: TruKKer serves at least three visible customer groups. First are enterprise shippers and procurement teams that need predictable domestic and cross-border road freight across verticals such as FMCG, retail and e-commerce, construction, manufacturing, metals, mining, oil and gas, and petrochemicals. Second are the carrier-side users—single truck owners, brokers, fleet owners, drivers, inspectors, and HSE teams—who supply capacity and use the Partner App or inspection workflows day to day. Third are adjacency customers in moving and multimodal forwarding, where Logisty and Omnilog broaden the buyer base beyond core enterprise land freight. This matters because the payer, user, and beneficiary are not always the same. In the core business, enterprises are usually the payers, logistics managers the users, and carrier fleets the fulfillment counterparties. In the carrier app, the supply side becomes the primary product user while TruKKer monetizes through freight economics rather than
    a visible app subscription.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU019
  - CU020
  - CU029
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory
  title: Adoption Trajectory and Marketplace Liquidity
  body: 'Public scale markers are directionally strong even if they are unevenly refreshed. The 2019 Series A announcement said TruKKer had more than 15,000 member trucks and more than 200 clients. By 2022, Wamda and Investcorp described the business as serving 700+ enterprises with 40,000+ trucks across eight countries. By 2025 and 2026, Wamda, Waya, AGBI, and InforCapital all pointed to 1,200+ enterprise clients and a network somewhere between 60,000 and 75,000 trucks or transporters across roughly nine countries. The 2025 owned-media ecosystem post adds another useful but company-reported operating marker: about 1,000 trucks deployed daily. Taken together, these figures support a live marketplace with meaningful liquidity on both sides. What they do not show is customer retention, revenue concentration, cohort durability, or how much of the network is truly active rather than merely registered.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU021
  - CU030
