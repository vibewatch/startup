  figureRefs:
  - FU002
- id: named-customer-proof
  title: Named Customer Proof and Evidence Quality
  body: 'Named customer proof exists, but it is much thinner than the broad customer-count narrative. Independent 2026 sources identify PepsiCo and Borouge as enterprise customers, and both AGBI and InforCapital place them inside TruKKer’s current corporate base. The official Partner App page also provides named supply-side testimonials from Mukesh Kumar, Muntasir Ahmed, and Mithun Jha, which are valuable because they speak to product use, payment visibility, and day-to-day workflow experience. Still, the public record falls short of a robust enterprise case-study library: there are few customer-authored references, quantified shipper outcomes, or disclosed contract structures. That means public diligence can confirm customer existence and some deployment reality, but not the durability or strategic depth of most accounts. The current proof base is therefore better at establishing “real customers exist” than at proving TruKKer has deep, sticky share in those customers’ logistics budgets.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU030
  - CU031
  - CU022
  - CU023
  - CU024
  - CU031
