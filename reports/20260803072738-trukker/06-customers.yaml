  rows:
  - - Enterprise shippers
    - 'Buyer: logistics/procurement; User: transport managers; Payer: enterprise accounts'
    - Domestic and cross-border FTL procurement, vendor bidding, execution, documentation
    - 1,200+ enterprises by 2025-2026 public claims
    - Core revenue base and receivables source
    - No vertical revenue mix disclosed
  - - Carrier / fleet partners
    - 'Buyer: N/A; User: fleet owner, broker, driver; Payer: TruKKer via freight settlement'
    - Load discovery, bidding, trip execution, documents, earnings
    - 60,000-75,000 trucks/transporters claimed publicly
    - Supply liquidity and service quality driver
    - No active-supply ratio disclosed
  - - Inspection / HSE stakeholders
    - 'Buyer: enterprise / TruKKer ops; User: inspectors, HSE officers, auditors'
    - Safety checks and compliance evidence
    - Embedded into freight operations
    - Trust and compliance layer supporting enterprise sales
    - No audit coverage stats
  - - Multimodal forwarding customers
    - 'Buyer/payer: enterprise shippers; User: logistics teams'
    - Air, sea, warehousing, customs via Omnilog
    - Publicly visible but depth unclear
    - Cross-sell wallet-share opportunity
    - No standalone customer count
  - - Moving customers
    - 'Buyer/user/payer: households or relocation buyers'
    - Digital booking, pricing, tracking, installation services
    - Visible in Dubai adjacency surface
    - Proof of reuse beyond B2B freight
    - Strategic importance to core thesis unclear
  notes: Segments distinguish paying enterprises from supply-side users and adjacency customers because TruKKer operates a multi-sided marketplace rather than a one-sided SaaS sale.
