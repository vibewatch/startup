  rows:
  - - Cross-sell from road freight into Omnilog
    - Large accounts may dominate multimodal attach
    - Wallet-share upside may mask concentration
    - Request top-10 account share by product line
  - - Carrier-side network effects
    - Supply may be broad but shallowly active
    - Fulfillment quality can degrade if active supply is thinner than registered supply
    - Request active carrier and repeat-trip cohorts
  - - Receivables-backed financing
    - Collections quality may rely on a concentrated enterprise base
    - Credit availability could amplify customer concentration risk
    - Request AR aging by top customer
  - - RTA / Logisty adjacency
    - Public-sector or city-linked deployments can become anchor reference accounts
    - Brand halo may exceed revenue relevance
    - Request revenue contribution from regulated/adjacent products
  - - Named enterprise logos
    - Very few public case studies relative to 1,200+ headline accounts
    - Public proof depth may overstate defensibility
    - Request 10 recent customer references with usage metrics
  notes: Expansion is visible in narrative form, but concentration cannot be underwritten from public evidence alone.
