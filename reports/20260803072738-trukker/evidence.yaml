evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      Authoritative legal-entity and headquarters disclosure that distinguishes domicile, operating HQ, and major office
      network.
    whyItMatters: Jurisdiction and governance affect regulatory review, tax structuring, and IPO readiness.
    diligencePath: >-
      Request incorporation documents, cap-table/legal-entity chart, and management certification of principal place of
      business.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: Current board list, board committees, observer rights, and governance documents.
    whyItMatters: >-
      A late-stage company with sovereign and pre-IPO investors should have visible governance; absence impairs control
      assessment.
    diligencePath: Request latest board deck cover, shareholders agreement summary, and governance chart.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current audited or management-certified employee count split by country and function.
    whyItMatters: Headcount is used as a proxy for operating scale, cost base, and organizational maturity.
    diligencePath: Request latest HR census and payroll summary by entity.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: operating-countries
    missingEvidence: A definitive list of active revenue-generating markets versus representative offices or support hubs.
    whyItMatters: Source counts vary from seven countries to ten markets to eleven office countries, affecting scale interpretation.
    diligencePath: Request current country-by-country revenue footprint and operating-status map.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: Latest post-money valuation, liquidation preference stack, and major shareholding breakdown.
    whyItMatters: Without valuation and security terms, investors cannot judge ownership dilution, exit waterfall, or IPO realism.
    diligencePath: Request latest financing docs, cap table, and board-approved valuation memo.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: digital-penetration
    missingEvidence: A credible GCC-specific statistic for the share of road-freight transactions already mediated digitally.
    whyItMatters: Without a penetration baseline, TAM-to-SAM conversion remains directional rather than underwritten.
    diligencePath: Request management cohort data, industry survey results, or third-party transaction-share studies by corridor.
    relatedQuestionRefs:
      - QM015
  - type: missing-source
    severity: material
    topic: digital-brokerage-revenue
    missingEvidence: >-
      Published GCC digital freight brokerage revenue or GMV data segmented from broader logistics software or brokerage
      markets.
    whyItMatters: This is the cleanest missing input for building a public-source SAM for TruKKer.
    diligencePath: Seek proprietary analyst data, marketplace transaction benchmarks, or management GMV disclosure.
    relatedQuestionRefs:
      - QM016
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: buyer-budget-ownership
    missingEvidence: >-
      Segment-level public evidence that cleanly allocates budget authority across procurement, logistics, operations,
      and finance.
    whyItMatters: >-
      Go-to-market design depends on the true buyer, but most public sources describe workflows rather than budget
      signatures.
    diligencePath: Review customer case studies, procurement job postings, and sales-cycle notes by segment.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: sam-construction
    missingEvidence: >-
      A corridor-by-corridor breakdown that isolates full-truck-load, cross-border, and enterprise-contracted trucking
      from the wider road market.
    whyItMatters: >-
      True serviceable opportunity depends on which road-freight lanes are digitalizable and brokerable rather than
      captive or asset-owned.
    diligencePath: Request management lane mix, top corridor GMV, and contracted-vs-spot split.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM001
      - TM002
  - type: stale
    severity: minor
    topic: ecommerce-demand
    missingEvidence: A fresh 2026 official government release on Saudi address accuracy, failed-delivery rates, and parcel density.
    whyItMatters: >-
      Addressability and failed-delivery friction are central to last-mile economics but remain partly inferred from
      analyst summaries.
    diligencePath: Pull official CST, SAMA, or transport authority updates on parcel and address-system performance.
    relatedQuestionRefs:
      - QM019
      - QM024
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized pricing, discounts, or gross-margin data for TruKKer, NAQEL, AJEX, Shipa, and Logexa in comparable
      road-freight lanes.
    whyItMatters: >-
