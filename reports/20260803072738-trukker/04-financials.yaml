  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current revenue (2025–2026)
    - Cannot assess growth durability after 2022 anchor
    - Request audited or board-level monthly revenue bridge by market
  - - Gross margin / take rate
    - Cannot determine whether economics resemble brokerage, managed marketplace, or software-enabled logistics
    - Request lane-level gross margin and contribution margin
  - - Cash balance and monthly burn
    - Cannot estimate true runway or next-round trigger
    - Request latest treasury pack and cash forecast
  - - DSO, dilution, and default rates on receivables
    - Cannot price the securitisation or test collections quality
    - Request receivables aging and lender reporting deck
  - - Revenue mix by spot, contracted, and workflow products
    - Cannot judge revenue quality or software-like leverage
    - Request segment mix and renewal / repeat-rate data
  - - Cohort retention and top-customer concentration
    - Cannot assess stability of enterprise wallet share
    - Request top-20 customer revenue share and cohort retention by segment
  notes: The largest blockers are not narrative questions; they are missing private metrics directly needed to test margin path, capital intensity, and runway.
