- id: unit-economics-and-working-capital-logic
  title: Unit Economics and Working-Capital Logic
  body: 'The public evidence suggests that working capital, not capex, is the core financial pressure point. TruKKer does not appear to own a large truck fleet; instead, it coordinates external capacity. That should reduce asset capex relative to an owned-fleet carrier, but it does not eliminate cash intensity. The platform still needs to source freight, settle carriers, collect from enterprise shippers, manage disputes, and maintain a network dense enough to reduce empty returns and failed fulfilment. The 2026 securitisation facility makes this explicit: receivables are now financeable collateral, meaning growth can be funded against invoice assets rather than only against equity expectations. AGBI’s description of a reverse-auction model also implies that gross margin is operationally thin and depends on finding the lowest qualified supplier while still preserving service quality. Because current gross margin, take rate, DSO, payment terms, and default rates are not public, the right conclusion
    is not that unit economics are weak; it is that public evidence is insufficient to verify them. The financing structure is a clue that the company is solving a real working-capital problem at scale.'
  claimRefs:
  - CI014
  - CI021
  - CI022
  - CI023
  - CI027
