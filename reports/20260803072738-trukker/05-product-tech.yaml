  rows:
  - - Core freight marketplace / shipper surface
    - Enterprise shipper / logistics manager
    - Live and strongly evidenced on official surfaces
    - Handles demand capture, bidding, execution, invoices, and payments in one flow
    - No public API or admin-permission model disclosure
  - - Procure Co procurement layer
    - Enterprise procurement / transport managers
    - Live and strongly evidenced
    - Lets enterprises onboard own vendors alongside TruKKer network
    - No public pricing split between workflow software and freight margin
  - - TruKKer Partner App
    - Fleet owners, brokers, solo drivers
    - Live and corroborated by official page plus app stores
    - Load board, bidding, trip tracking, driver/fleet management, earnings, docs
    - Android install base and MAU are not public
  - - TruKKer Safe
    - Drivers, inspectors, HSE officers, clients/auditors
    - Live and clearly described
    - QR-linked inspections with photo/video proof and audit trail
    - No public certification of inspection methodology or audit coverage
  - - Omnilog
    - Large shippers with multimodal needs
    - Launched adjacency
    - Adds sea, air, warehousing, customs and forwarding to land base
    - Public adoption depth and P&L contribution are unclear
  - - Logisty / home moving
    - Consumers and relocation customers
    - Live adjacency
    - Turns dispatch, pricing, tracking, and installation into managed move workflow
    - Relationship to core B2B economics is not disclosed
  - - ATOMIX / MoXey ecosystem
    - Enterprise decarbonization buyers / fleets / drivers
    - Marketing-visible but externally thin
    - Extends platform into EV logistics and freight-fintech workflows
    - Public proof of deployment scale remains sparse
  notes: Rows distinguish strongly evidenced live modules from newer ecosystem adjacencies whose public maturity is less corroborated.
