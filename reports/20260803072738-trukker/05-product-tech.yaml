- id: trust-safety-and-control-systems
  title: Trust, Safety, and Control Systems
  body: 'Trust is a core product feature in freight, and TruKKer’s public materials reflect that. Official surfaces repeatedly emphasize verified vendors, HSE-compliant operations, digital documentation, and 48-hour payment workflows. TruKKer Safe is the most concrete trust-control product visible in public: it standardizes inspections, stores photo and video proof, generates QR-based reports, and allows HSE officers and even clients or auditors to review status. The RTA-linked moving product and official moving pages extend this same trust posture into consumer relocation through quoted pricing, real-time tracking, and managed service bundles. What remains missing is the classic enterprise trust package expected by large software buyers: TruKKer does not publicly expose a SOC 2 report, ISO certification page, public status page, or detailed security architecture documentation in the retained source set. For diligence, that means operational controls look more visible than information-security
    controls.'
  claimRefs:
  - CE005
  - CE008
  - CE017
  - CE018
  - CE021
  - CE022
  - CE025
  - CE027
  - CE028
  - CE034
