callouts:
- calloutType: insight
  title: The strongest product proof is operational, not developer-facing
  body: TruKKer’s public record is unusually strong on real-world workflows—bidding, inspections, payouts, and regulator-linked deployment—but weak on public APIs, changelogs, and security documentation. That is consistent with an ops-led freight platform serving fragmented fleets rather than a classic developer-first SaaS product.
  claimRefs:
  - CE003
  - CE008
  - CE019
  - CE026
  - CE027
- calloutType: risk
  title: Adjacency breadth may be running ahead of public proof depth
  body: Omnilog, Logisty, ATOMIX, and MoXey widen the strategic story, but the retained evidence is much richer for core road-freight orchestration than for these newer layers. Diligence should separate proven operating modules from ecosystem aspiration.
  claimRefs:
  - CE015
  - CE016
  - CE018
  - CE035
  - CE036
