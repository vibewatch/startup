    - Public customer proof for multimodal expansion is limited
  - - Move homes with predictable pricing
    - Offline quotes and fragmented mover coordination
    - Digital booking, plan selection, tracking, installation add-ons
    - Faster quoting and more transparent service bundle
    - This adjacency is less relevant to core freight moat
