company:
  name: TruKKer
chapter:
  number: 5
  title: Product & Technology
  summary: TruKKer's product is not a single shipper marketplace screen; it is an operating stack spanning enterprise procurement workflows, carrier-side execution apps, inspection tooling, and adjacent multimodal and moving products. Public evidence strongly supports real workflow depth in road freight and safety/compliance operations, but public documentation is still thin on APIs, uptime, security certification, and the maturity of newer ecosystem bets such as ATOMIX and MoXey.
sections:
- id: product-definition-and-surfaces
  title: Product Definition and Customer-Facing Surfaces
  body: 'TruKKer sells workflow certainty across fragmented road freight rather than a simple directory of trucks. Official shipper and Procure Co pages show a buyer-facing control plane that captures demand, runs vendor bidding, manages execution, and surfaces invoices and payments. On the supply side, the Partner App gives carriers a live load board, trip management, earnings visibility, document handling, and multilingual access. That combination matters because it means the product is designed for both buyer orchestration and carrier compliance, which is more defensible than a one-sided load board alone. The operating model is also notably multi-channel: official pages say freight requests can begin via WhatsApp, email, calls, voice notes, or dashboard entry, with TruKKer’s AI converting those inputs into RFQs. Public evidence therefore supports an operations-heavy digital marketplace with enterprise workflow tooling, not a pure self-serve SaaS product.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
