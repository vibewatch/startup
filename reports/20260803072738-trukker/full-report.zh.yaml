companyProfile:
  summary: >
    TruKKer 是一家后期私营数字货运市场，2016 年由 Gaurav Biswas 和 Pradeep Mallavarapu
    创立。公司销售轻资产物流工作流，把企业货主的货运预订、匹配、追踪、单证、检验和付款串起来，同时协调横跨沙特、UAE 及相邻走廊的大型承运网络。公开证据支撑其已有实质规模——1,200+ 企业客户、60,000 至 75,000
    辆卡车或运输商，以及 >US$200 million 的历史收入锚点——但当前经审计经济性、留存、股权结构表条款和应收账款质量仍未公开。
