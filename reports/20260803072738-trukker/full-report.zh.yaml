  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: TruKKer 当前最关键风险簇的剩余严重度。
    claimRefs:
      - CR008
      - CR009
      - CR018
      - CR026
      - CR039
      - CR040
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 运输 / 牌照合规
          values:
            - label: 中
              tone: warning
              detail: 规则明确，但牌照清单的公开证据偏薄。
            - label: 高
              tone: risk
              detail: 线路或监管动作都可能实质扰乱运营。
            - label: 中
              tone: neutral
              detail: 条款和工作流存在，但审计深度未披露。
            - label: 高
              tone: risk
              detail: 文件拿出来之前，剩余风险仍高。
        - label: 隐私 / 数据治理
          values:
            - label: 中
              tone: warning
              detail: 数据足迹广、跨境处理多，敞口上升。
            - label: 高
              tone: risk
              detail: 会同时牵动监管、客户和付款。
            - label: 中
              tone: neutral
              detail: 有政策和 SDAIA 指引，但公开审计证据有限。
            - label: 高
              tone: risk
              detail: 控制成熟度没有独立验证。
        - label: 地缘政治货运冲击
          values:
            - label: 中
              tone: warning
              detail: 2026 年已证明冲击可能很快发生。
            - label: 高
              tone: risk
              detail: 路由、定价和服务水平可能同时波动。
            - label: 中
              tone: neutral
              detail: 有陆桥打法和危机定价。
            - label: 高
              tone: risk
              detail: 冲击一旦拖长，仍会挤压利润率和伙伴运力。
        - label: 营运资本 / 融资依赖
          values:
            - label: 中
              tone: warning
              detail: 近期资本结构显示公司依赖机构信贷。
            - label: 高
              tone: risk
              detail: 回款或 covenant 问题会直接伤害增长。
            - label: 中
              tone: neutral
              detail: 融资渠道可见，但底层资产质量仍属非公开信息。
            - label: 高
              tone: risk
              detail: 公开逾期和损失率数据缺失。
        - label: 执行宽度 / 组织摊子过大
          values:
            - label: 中-高
              tone: warning
              detail: 大网络叠加多个相邻业务，协调负荷上升。
            - label: 中-高
              tone: warning
              detail: 问题可能跨产品和地区扩散。
            - label: 中
              tone: neutral
              detail: 后续投资者和工作流工具有帮助，但不能证明控制深度。
            - label: 中-高
              tone: warning
              detail: 只有运营指标和治理证据更强后，剩余风险才会下降。
