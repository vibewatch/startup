  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 新股权融资或二级交易低于独角兽门槛
        - 低于 US$1.0B 的价格发现
        - 表明公开论点高估了当前股权价值
        - 立即下调，并按下行情景重新承保
      - - 应收账款或证券化疲软
        - 损失率、逾期或契约压力浮现
        - 削弱“结构化融资证明质量耐久”的判断
        - 按资产负债表和回款风险重估
      - - 合规或运营控制失效
        - 重大监管行动、宕机或服务事件
        - 把执行风险变成直接估值损害
        - 除非补救异常有力，否则暂停或退出
      - - 优先权结构让股权回报失去吸引力
        - 清算优先权或优先债权吞噬上行空间
        - 即使名义估值很强，也可能无法转化为投资人回报
        - 要求修订入场价，否则放弃
    notes: 这些触发因素聚焦会直接把不确定性转化为新投资者已实现下行的事件。
