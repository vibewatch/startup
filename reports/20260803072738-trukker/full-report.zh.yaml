    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 改变判断的证据
    rows:
      - - 正论点：TruKKer 拥有足够网络规模和机构交易对手，足以获得低位独角兽估值可信度。
        - 经审计的当前收入、应收账款质量和利润率披露，会显著增强该论点。
      - - 反论点：2022 年后公开融资大多由债务驱动，因此当前股权价值已经陈旧，且可能被高估。
        - 一轮具备可信外部定价的新普通股融资会削弱该反论点。
      - - 正论点：多国规模、1,200+ 客户和 60,000-75,000 辆卡车，意味着这是一个真实平台，而不是纸面市场。
        - 留存、集中度、活跃与注册参与者数据，将验证这种规模到底多耐久。
      - - 反论点：当经济性或披露令人失望时，公开市场会严厉惩罚物流科技公司，Freightos 就是例子。
        - 持续盈利，或更接近成熟上市同业的经审计增长质量，会缩小这种惩罚差距。
    notes: 只有价格或证据变化，建议才应改变；仅有公司质量不足以支撑估值判断。
