      - number: '4.4'
        title: 单位经济性与营运资本逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，核心财务压力点是营运资本，而不是资本开支。TruKKer
              看起来并不拥有大型卡车车队；它协调外部运力。相较自有车队承运商，这应当降低资产资本开支，但不会消除现金强度。平台仍需要获取货源、结算承运商、向企业货主收款、管理争议，并维持足够密集的网络，以减少空载返程和履约失败。2026
              年证券化额度把这一点说得很明白：应收账款现在是可融资抵押品，意味着增长可以用发票资产支持，而不只用股权预期支持。AGBI
              对反向竞价模式的描述也暗示，毛利率在运营上偏薄，取决于能否找到最低价合格供应商，同时守住服务质量。由于当前毛利率、抽成率、DSO、付款条款和违约率都未公开，正确结论不是单位经济性弱，而是公开证据不足以验证。融资结构是一条线索：公司正在规模化解决真实的营运资本问题。
