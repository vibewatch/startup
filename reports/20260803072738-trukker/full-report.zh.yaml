      - number: '7.5'
        title: 风险结论与击穿条件
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个更有层次的结论。TruKKer 不像空泛 PPT
              式市场平台：它有真实运营规模、可见的危机响应手册、明确的平台条款，以及至少承认自身模式所带义务的数据治理框架。核心问题是，控制深度不如网络宽度透明。因此投资人其实在同时承销两层风险：一个暴露在地缘政治和执行波动中的物流市场平台；一个数据和应收账款负担很重的操作系统，其融资叙事越来越依赖有纪律的回款和持续服务质量。最重要的尽调问题因此很具体。管理层能否拿出牌照台账、隐私合规材料、违规
              / 事件日志、坏账数据、头部客户集中度和契约余量？如果不能，正确框架不是「低信心放弃」，而是「业务真实，控制证据不完整」。击穿条件应聚焦可衡量的合规失败、服务崩盘、应收账款压力，以及生态宽度跑赢组织控制的证据。
