          - type: paragraph
            body: >-
              TruKKer 背后的直接数据足迹，比很多市场平台描述暗示的更宽。隐私政策覆盖客户、司机、运输服务商、供应商和 LoadBoard
              用户，明确提到个人身份文件、支付信息、税务与结算记录、实时行程位置数据。政策还预设跨境传输、向金融机构和监管方披露，以及可能持续到货运完成的位置追踪。关键在于，平台不只在搬货；它还处理金融结算、身份验证、保险 /
              合规流程和运营遥测。TruKKer 自有产品材料同时称，平台是货运网络的「运营骨干」。如果属实，这是优势；但也意味着宕机、访问控制薄弱或隐私失误，会直接传导到匹配质量、付款时点和货主信心。公开缓释措施存在——AI
              标准化、成文流程、与 PDPL 对齐的措辞——但第三方审计可见度仍然偏薄。
