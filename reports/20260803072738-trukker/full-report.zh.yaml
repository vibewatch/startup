      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 正确边界是公路货运，不是全部物流
            body: 最常见的尽调错误，是把 TruKKer 锚定在 USD 89 billion 的 GCC 物流 TAM 上，却不扣除仓储、海运、空运、铁路和自有车队经济。更相关的可服务层，是以公路为核心的企业货运编排。
