      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              依据现有证据，TruKKer 在 2026
              年看起来比典型区域初创公司更具财务可信度，但仅凭公开材料仍无法完整承销。正面因素清楚：强历史增长信号、可信机构支持、已展示出把债务和结构化融资叠加到股权结构表上的能力，以及一种似乎能产生足够大应收账款、支撑银行可融资证券化的运营模式。谨慎点同样清楚：当前收入未公开，实际成交价格未知，货运价差与软件式收入的准确组合未披露，也没有可靠公开视角能看到烧钱速度、现金余额或现金跑道。这意味着投资案例更多依赖资本市场验证和运营规模代理指标，而不是经审计财务报表。因此，正确结论是混合但建设性：企业工作流深度和应收账款复杂度提升后，收入质量可能在改善；但在毛利和现金生成指标更清楚披露前，公司仍对资本和执行敏感。
