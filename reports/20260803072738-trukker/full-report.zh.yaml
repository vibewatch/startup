            body: >-
              公开规模标记方向上很强，即便更新不均。2019 年 Series A 公告称 TruKKer 拥有 15,000 多辆会员卡车和 200 多名客户。到 2022 年，Wamda 和 Investcorp
              描述公司在八个国家服务 700+ 家企业、拥有 40,000+ 辆卡车。到 2025 年和 2026 年，Wamda、Waya、AGBI 和 InforCapital 都指向 1,200+
              企业客户，以及大约九个国家、介于 60,000 到 75,000 辆卡车或运输商之间的网络。2025 年自有媒体生态文章又增加了一个有用但由公司报告的运营标记：每天部署约 1,000
              辆卡车。合在一起，这些数字支撑了一个两侧都有实质流动性的活跃市场。它们没有显示的是客户留存、收入集中度、队列耐久性，或网络中有多少是真正活跃而不只是注册。
