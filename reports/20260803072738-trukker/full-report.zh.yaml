  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买方、用户与付款方划分客户
        blocks:
          - type: paragraph
            body: >-
              TruKKer 至少服务三类可见客户。第一类是企业货主和采购团队，它们横跨
              FMCG、零售和电商、建筑、制造、金属、采矿、油气和石化等垂直行业，需要可预测的国内和跨境公路货运。第二类是承运侧用户——单车车主、经纪人、车队所有者、司机、检验员和 HSE 团队——他们供给运力，并在日常使用
              Partner App 或检验工作流。第三类是搬家和多式联运货代中的邻近客户；Logisty 和 Omnilog
              把买方基础扩展到核心企业陆路货运之外。这一点重要，因为付款方、用户和受益方并不总是同一方。在核心业务中，企业通常是付款方，物流经理是用户，承运车队是履约交易对手。在承运商 app 中，供给侧成为主要产品用户，而
              TruKKer 靠货运经济变现，不靠可见的 app 订阅费。
