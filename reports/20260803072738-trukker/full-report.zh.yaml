      - number: '1.2'
        title: 创始人、领导层与地理身份
        blocks:
          - type: paragraph
            body: >-
              公司的公开叙事始终围绕创始人兼 CEO Gaurav Biswas 展开；联合创始人兼 CTO Pradeep Mallavarapu
              则在早期融资报道中出现，被描述为匹配和数据平台背后的技术架构师。一个实质尽调问题是，不同来源给 TruKKer 的地理身份贴上了不同标签。官方联系页面列出
              Dubai、Riyadh、Muscat、Amman、Bahrain、Cairo、Istanbul、Almaty、Warsaw 和 Bengaluru 的运营办公室；独立数据库和新闻报道则轮流称其总部在
              Dubai、总部在 Abu Dhabi、总部在沙特或以沙特为基地。分歧不推翻核心业务，但会影响法律住所、监管监督、劳动力组合和 IPO 准备度。创始人之外的领导层也有公开线索，包括 CFO Amit
              Agarwal 和 CDO Muataz Alsafi；但相对于公司规模，董事会、正式治理结构和完整高管名单仍披露不足。
