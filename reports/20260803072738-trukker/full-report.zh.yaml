        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以拼出一条可信的公司时间线，但几项尽调红旗仍在。TruKKer 明确完成了多次关键扩张：GCC 启动，大额 Series A 和 B 融资，收购 TruckSher，2022 年 pre-IPO
              轮，2024 年 Omnilog 分拆，迪拜 RTA 合作，2025 年 Ruya 私募信贷融资，以及 2026 年 ADCB 证券化。不过，公开披露在累计融资、总部归属和当前员工数上仍不一致。2026
              年的反向报道不是法律问题，而是运营问题：Semafor 和 AGBI 显示，Hormuz
              危机挤压运力、拉长行程、推高柴油成本、扭曲现货价格，也暴露出即便是大型数字经纪商，也无法瞬间创造物理卡车供给。这些来源重要，因为它们证明 TruKKer
              的核心价值主张在扰动中有效；同时也证明，模式仍暴露于司机短缺、拥堵和边境监管摩擦。本章因此把 TruKKer 定位为有规模、可信，但披露仍偏轻。
