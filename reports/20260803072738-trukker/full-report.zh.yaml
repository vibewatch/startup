  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、价格发现与核心建议
        blocks:
          - type: paragraph
            body: >-
              第一个估值问题不是规模，而是价格发现。公开来源显示，TruKKer 在 2019 年、2022 年完成大额股权融资，并在 2022 年完成由 Investcorp 领投的 US$100 million
              Pre-IPO 轮；但 2025-2026 年的公开融资叙事转向债务、私人信贷和应收账款支持的证券化。结构化融资可以验证可融资性，却不会给普通股设定新的价格标记。Hurun 2026
              年独角兽方法论有用，但只能作为门槛标记：它告诉我们榜单公司至少值 US$1 billion，而不是准确告诉我们公司应在这条线上方交易多少。公开规模标记——1,200+ 家企业客户、60,000 到 75,000
              辆卡车、覆盖九国，以及某职场资料来源中的年收入 >US$200 million——支持 TruKKer
              不是只有叙事的初创公司。但它们不能替代经审计的当前收入、毛利率、烧钱、留存或股权结构披露。因此，正确的核心判断是跟踪 / 继续研究，并围绕独角兽门槛严守价格纪律，而不是按动量给溢价报价。
