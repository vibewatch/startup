      - number: '5.4'
        title: 信任、安全与控制系统
        blocks:
          - type: paragraph
            body: >-
              信任是货运产品的核心功能，TruKKer 的公开材料也体现了这一点。官方页面反复强调已验证供应商、符合 HSE 的运营、数字单证和 48 小时付款工作流。TruKKer Safe
              是公开可见、最具体的信任控制产品：它标准化检验，存储照片和视频证明，生成基于 QR 的报告，并允许 HSE 官员甚至客户或审计员查看状态。与 RTA
              相连的搬家产品和官方搬家页面，通过报价、实时追踪和托管服务包，把同一套信任姿态延伸到消费者搬迁。仍缺的是大型软件买方期待的经典企业信任包：在保留来源集中，TruKKer 没有公开 SOC 2 报告、ISO
              认证页面、公共状态页或详细安全架构文档。对尽调来说，这意味着运营控制比信息安全控制更可见。
