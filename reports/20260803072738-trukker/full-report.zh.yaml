  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊
        - 债务驱动增长没有得到股权价格支撑；应收账款、留存或合规担忧浮现；下一轮融资偏防御。
        - US$0.6-0.9B；估值跌破独角兽门槛，以反映证据缺口和下行压力。
        - 回款疲软、集中度或低于门槛的股权定价。
        - 如果数据室不能弥补当前披露缺口，风险显著。
      - - 基准
        - 规模标志大体可信；机构融资延续；应收账款或合规没有重大负面意外，但也没有溢价证明。
        - US$1.0-1.3B；大致处于或略高于独角兽门槛。
        - 仍取决于缺失的经审计收入、利润率和股权结构证据。
        - 在当前公开证据下最可辩护的区间。
      - - 牛
        - 管理层展示干净的当前经济性、强回款、可控优先权结构，并通过新股权融资或接近股权的定价获得资本市场验证。
        - US$1.4-1.8B；高于门槛的溢价变得可支撑。
        - 需要尚未公开的证明，因此过早定价可能买贵。
        - 只有高质量披露或新一轮证据出现后才可信。
    notes: 这些是分析师构建的情景区间，旨在避免虚假精确。它们是估值假设，不是市场报价。
