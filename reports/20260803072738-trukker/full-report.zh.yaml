      - number: '4.3'
        title: 资本结构与融资演进
        blocks:
          - type: paragraph
            body: >-
              TruKKer 最重要的公开财务故事，是从经典初创股权融资转向越来越复杂的信贷结构。早期轮次包括种子轮和 pre-Series A 股权，随后是 2019 年 US$23 million Series A，以及
              2022 年 US$96 million 股债混合 Series B，后者已经包含实质风险债。Investcorp 2022 年 pre-IPO 轮随后加入新增长资本，并公开铺垫未来进入资本市场的可能性。2025
              年，Ruya Partners 提供 US$15 million 私募信贷；2026 年，ADCB 安排了最高 US$300 million 的无追索贸易应收账款证券化额度，覆盖
              UAE、沙特和土耳其。这条融资路径重要，因为它显示机构对 TruKKer
              应收账款账簿质量和可融资性的信心在上升。它也把资本讨论从「公司能不能融股权」转向「它能多高效地为营运资本和增长融资，同时尽量降低稀释」。代价是，金融复杂度越高，对回款质量、法律结构和纪律化资金管理的依赖也越强。
