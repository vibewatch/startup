      - number: '7.4'
        title: 伙伴、资本与执行依赖
        blocks:
          - type: paragraph
            body: >-
              TruKKer 近年的演进从两方面提高依赖风险。第一，融资不再是单纯股权故事。到 2025 和 2026
              年，公开叙事已转向私人信贷和证券化；执行得好可以提高网络运力，但可信度也更紧地绑在发票质量、回款和运营纪律上。第二，公司同时拓宽产品和地域。TruckSher 收购、Omnilog 推出、与监管方相关的
              Logisty 部署，以及 MoXey、AI 助手等生态品牌，都扩大可讲的空间，但每一项也带来整合成本、伙伴依赖和管理复杂度。来源集合里有一些安慰：STV
              继续支持，企业客户和卡车数量里程碑反复出现，也有危机改线证据，都说明平台是真的。但规模本身不是缓释措施。500+ 名员工、1,200+ 家企业客户、数万辆卡车之下，流程薄弱会很快反噬服务质量、应收账款和声誉。
