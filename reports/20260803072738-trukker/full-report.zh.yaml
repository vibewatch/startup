      - number: '3.3'
        title: 综合既有玩家与混合运营商
        blocks:
          - type: paragraph
            body: >-
              NAQEL、Aramex 和 AJEX 重要，是因为它们靠服务宽度和运营控制竞争，而不是靠纯市场抽象。NAQEL 公开称每年处理 20 million 票货，覆盖 16 个国家，拥有 5,000+ 员工和
              4,000+ 车辆，并打包电商、国际公路服务、货代、仓储、冷链、工业解决方案和清关。Aramex 规模更大，拥有 16,000+ 员工、600+ 办公室，业务覆盖 70 个国家，2025 年收入 USD 1.73
              billion。其 2025 年业绩显示，物流、货代和国内快递都在增长，国际快递下滑，意味着 Aramex 正把资源重新投向区域内和电商密集流量，而这些流量同样利好 GCC 公路运营商。AJEX
              成立较晚，但战略上有威胁，因为它结合了沙特本地覆盖、SF International 运营经验，以及现在来自 DHL eCommerce 的资本和董事会入口。简言之，这些玩家的产品包更宽，对物理网络的控制强于
              TruKKer，即便它们的公开信息较少围绕市场式采购工作流展开。
