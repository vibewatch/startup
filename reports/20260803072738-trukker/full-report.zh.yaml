  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与政策背景
        blocks:
          - type: paragraph
            body: >-
              尽调时，不能把 TruKKer 直接对标整个 GCC
              物流栈，仿佛仓储、港口、包裹、铁路或海运的每一美元都能被它变现。更合适的市场边界从货运运输开始，再收窄到公路为核心、企业协调、跨境、重货的工作流；在这些场景里，碎片化卡车供给制造了软件和经纪问题。沙特政策是主要加速器。交通与物流服务部和国家交通与物流战略都明确把沙特定位为连接三大洲的物流枢纽，目标包括物流绩效排名进入前
              10、公路基础设施排名第
              6。政策背景重要，因为它同时扩张硬基础设施，以及平台可在其上扩张的数字运营层——海关、电子服务、车联网和控制塔。实际结论是，可触达市场很大，但边界必须围绕依赖公路的工作流编排，而不是全部物流支出。
