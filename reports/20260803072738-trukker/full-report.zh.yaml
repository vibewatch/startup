      - number: '8.4'
        title: 最终尽调清单、上调触发器与论点击穿事件
        blocks:
          - type: paragraph
            body: >-
              最后一步，是把估值模糊性翻译成决策纪律。即时清单很直接：经审计的当前收入、抽佣率或净收入桥、毛利率、EBITDA 或烧钱、应收账款账龄、坏账损失率、契约余量、头部客户集中度，以及精确的股权结构 /
              优先权结构。没有这些，投资人就无法把企业规模转成可靠回报模型。上调触发器同样清晰：高于独角兽门槛的新股权轮、可信证据证明证券化和私人信贷背后是强回款而非隐藏压力，以及留存和集中度披露改善。论点击穿事件也看得见。新一轮或老股转让低于
              US$1 billion，应收账款质量意外恶化，或出现重大合规失败，都会迅速削弱投资理由。由于这些决策闸门可跟踪，建议不是软弱耸肩，而是价格敏感的观察姿态。TruKKer
              可以作为动态尽调目标进入投资视野，但前提是下一个资料室拿出的证明多于当前公开记录。
