chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              TruKKer 将自己定位为 AI 赋能的数字货运市场，组织海湾及周边走廊高度碎片化的陆路货运供给。当前官网强调的不是简单货源板，而是企业货运控制层：Procure Co
              集中捕捉需求、竞价、执行和付款；Partner app 向承运商提供已验证货源、返程货、多语言工作流和按里程碑付款；TruKKer Safe 将检验、合规和基于 QR
              的状态证明数字化。经济模型仍是轻资产。管理层多次把 TruKKer 称为区域「卡车版
              Uber」，收入来自货主定价与供应商成本之间的价差，以及围绕执行、可视性和单证叠加的服务层。官方和独立来源一致认为，TruKKer
              扩张不需要直接拥有卡车；价值在于把碎片化卡车供给匹配到货主需求，减少空驶，让大型企业跨境运输更可预测。
