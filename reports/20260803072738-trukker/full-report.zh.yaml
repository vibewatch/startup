  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与竞争原型
        blocks:
          - type: paragraph
            body: >-
              TruKKer 周围的竞争范围，比「其他订卡车 app」更宽。对货主来说，同一项任务至少可以由四类方案解决：TruKKer 这样的数字公路货运市场；NAQEL、Aramex、AJEX 这样的区域综合 3PL
              和快递运营商；Shipa Freight 这样的数字货代和跨境贸易工具；以及 Sary/SILQ、Logexa
              这样的相邻采购、仓储或批发平台。在这些正式供应商之外，现状仍是直接电话经纪，以及与碎片化承运商的双边关系；最大型企业还可以尝试内部自建，自己导入承运商，在内部管理费率、单证和结算。这一点重要，因为竞争不只是软件功能对功能的替代。它也是一场争夺：谁拥有采购工作流、海关能力、承运商入口、库存邻近性，以及在高摩擦
              GCC 物流环境中的信任。
