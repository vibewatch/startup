      - number: '2.3'
        title: 买方、用户与垂直需求
        blocks:
          - type: paragraph
            body: >-
              从 TruKKer 的定位看，GCC 公路货运的买方地图更受企业采购驱动，而不是消费者配送驱动。已发布的 GCC
              市场数据中，制造业仍是最大终端用户类别；批发与零售贸易增速最快，因为全渠道履约、前置仓和跨境电商让网络中的发运更频繁。TruKKer 自身产品设计与这一模式吻合：Procure Co 面向每月货运支出超过 USD
              100,000 的企业，货主侧信息则集中在 FMCG、汽车、零售 /
              电商、建筑、制造、金属与采矿、油气和石化。在这些工作流里，经济买方通常是采购或供应链负责人，日常用户是物流运营，财务审批人看重结算、合规和营运资本效率。这一点关键，因为采用触发点很少是「我们需要一个
              app」；真正触发的是复杂工业走廊中的运力确定性、跨境执行、货运支出可视性和更快单证周转。
