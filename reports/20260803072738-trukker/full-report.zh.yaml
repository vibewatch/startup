  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              TruKKer 同时落在几张受监管的界面里。它自己的法律文件说明，LoadBoard
              不是轻量获客网站，而是由合同约束的运营环境：用户必须遵守运输、安全和劳动法律；承运商应维持许可、牌照和保险；争议导向阿联酋法律和迪拜法院。足迹窄时还能管理，但 TruKKer
              公开宣传业务覆盖沙特阿拉伯、阿联酋和其他 GCC 市场，真实合规工作量就是跨司法辖区的。沙特官方材料又加一层：王国明确把道路运输放在安全、智能集成和物流体系现代化框架下，SDAIA 的 PDPL
              也对处理王国内个人数据的公司施加控制者义务。投资人真正要看，不是监管是否重要——答案显然重要——而是 TruKKer 的内部控制、牌照台账和数据治理项目，是否跟商业版图一样成熟。
