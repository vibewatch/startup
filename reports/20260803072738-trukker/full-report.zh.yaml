      - number: '7.3'
        title: 运营与地缘政治冲击风险
        blocks:
          - type: paragraph
            body: >-
              留存记录里最清晰的外部压力测试，是 2026 年 Hormuz 中断。独立来源和公司自写材料都显示，货运市场能多快从正常路线切换到紧急陆路应变。海运确定性破裂时，卡车运输更值钱，TruKKer
              的相关性随之上升；但公司也处在一个运力尖峰、费率不透明、经纪链条拉长和伙伴瓶颈都可能在几天内冒出来的区域。TruKKer
              的应对——启用陆桥、提供固定费率、给承运商支付支持——看起来商业执行到位，但同一事件也暴露毛利和服务连续性的脆弱。公司关于 AI 和 Partner App
              的叙事也承认，传统货运流程会漏细节、配车错位、单证缺口、付款争议。换句话说，运营风险不只是宏观冲击；日常要协调数千趟运输，车队质量参差、边境条件变化、单证纪律不一，才是真正难题。
