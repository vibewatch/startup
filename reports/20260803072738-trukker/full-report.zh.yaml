        title: 规模、足迹与产品宽度
        blocks:
          - type: paragraph
            body: >-
              最强的可交叉验证规模叙事，是网络随时间扩张。TruKKer 称 2019 年拥有 15,000 多辆会员卡车和 200 名客户；2022 年在八个国家拥有 40,000+ 辆卡车和 700+ 企业客户；2025
              年在九个国家拥有 60,000+ 运输商和 1,200+ 企业客户；到 2026 年达到 75,000+ 辆卡车和约 1,200 名企业客户。运营足迹也从核心 GCC
              车道扩展到土耳其、埃及、巴基斯坦、哈萨克斯坦、波兰，以及与印度相连的支持职能。产品范围同样变宽。除核心公路货运外，TruKKer 现在还营销大型企业采购软件、司机 /
              承运商工作流软件、安全检验工具、跨境路由、消费者搬家服务，以及面向多式联运货代的 Omnilog。宽度能加深账户黏性，但也让分层更难，因为公开披露没有拆出经纪、软件、搬家或 Omnilog 分别贡献多少活动。
