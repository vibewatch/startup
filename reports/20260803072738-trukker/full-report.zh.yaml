              一些最重要的竞争是间接竞争。Sary/SILQ 不是卡车货运市场，但它把商业、物流和嵌入式金融合在一起，越来越靠近同一批商户和 SME 工作流。Redseer 对 Sary
              演进的描述尤其重要，因为它展示了一条路径：从简单市场软件，转向混合物流基础设施，再转向围绕 POS、融资和商户操作系统的更轻数字轨道。Logexa
              则从另一个角度切入：先仓储、后运输，在沙特经营仓库市场和库存管理平台。这些邻近玩家未必能直接赢下重型长途
              FTL，但能在上游占住货主注意力、数据和钱包份额。它们也提高了多平台并用风险，因为货主和承运商看起来都没有被锁在一条轨道上。以报价为主的货运采购、碎片化车队和非排他网络意味着，客户可以比较多个供应商，承运商也可以从任何利用率更高或付款更快的平台接单。
