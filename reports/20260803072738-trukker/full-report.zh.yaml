      - number: '1.3'
        title: 资本基础与投资者历史
        blocks:
          - type: paragraph
            body: >-
              TruKKer 已从早期风险投资轮，走向更机构化、更结构化的融资。Menabytes 报道，公司在 2017 年底完成 $1.4 million 种子轮，2018 年完成 $2.7 million
              pre-Series A；Wamda 随后记录了 2019 年由 STV 领投、IFC、Endeavor Catalyst、MEVP 和既有区域投资者参与的 $23 million Series A。IFC
              的项目披露另行确认，计划股权投资最高 $3 million。之后公司叠加了信贷：The National 在 TruKKer 2022 年 $96 million Series B 股债混合融资之前提到过 $10
              million Partners for Growth 额度；Series B 由 ADQ 和 STV 领投，Mubadala 参与。Investcorp 2022 年 pre-IPO 轮又加入 $100
              million，其中首关 $51 million，管理层也把公司包装成未来上市候选。到 2025-2026 年，新资本转为 Ruya 私募信贷和 $300 million ADCB
              应收账款证券化，显示公司从纯风险投资转向营运资本和结构化信贷基础设施。
