  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              TruKKer 的公开材料支撑的是交易驱动、轻资产货运模式，而不是重资产承运商模式。官方页面描述了一个控制层，为大型企业管理货运需求捕捉、供应商竞价、执行、发票和付款流；Partner App
              则强调已验证货源、返程货，以及给运输商更快结算。两者合起来强烈暗示，核心变现引擎不是纯订阅 SaaS，而是在现货和合同公路货运中赚取货运价差、佣金或采购利润。Procure Co
              把这拓宽成企业工作流产品：客户买的是可预测性、履约保证、费率纪律，以及对车道和供应商的控制，不只是进入货源板。公开来源没有披露收入中有多少来自现货交易、合同车道或平台式工作流费用。因此，从财务上看，TruKKer
              更像一个带软件杠杆的经纪物流网络，而不是纯 SaaS 公司；收入质量更多取决于网络流动性、货主重复使用和执行纪律，而不是标价。
