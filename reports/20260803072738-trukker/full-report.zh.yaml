      - number: '8.2'
        title: 可比信号与溢价估值的反论点
        blocks:
          - type: paragraph
            body: >-
              反对激进私募估值的逻辑很简单：公开市场目前不会慷慨对待缺乏经审计、品类领先财务质量的物流科技公司。Freightos 是最刺眼的警告信号，因为它是上市数字货运玩家，持续向 SEC 报告，截至 2026 年 8
              月公开市值只有约 US$59 million。Freightos 不能一对一对标
              TruKKer——它小得多——但它说明，当规模、盈利或投资人热情不及预期时，市场定价可以多么严苛。光谱另一端，GXO、XPO、C.H. Robinson 等成熟上市物流运营商交易区间为 US$5.8
              billion 到 US$23.5
              billion，但这些是高度披露、已达上市公司规模的业务。它们更适合作为公开市场上限基准，而不是直接替代私募估值。放在一起，这些信号都反对照单全收过时的私募独角兽头条。TruKKer
              可能高于公开数字货运底部，但若按它已经配得上成熟上市物流地位来付价，以当前证据集看并不成立。
