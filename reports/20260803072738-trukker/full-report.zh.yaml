      - number: '2.2'
        title: 自上而下的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              已发布的市场估算虽未干净隔离数字公路经纪，但足以搭出分层测算框架。Mordor、ResearchAndMarkets、GII 和 MarketResearch 的判断大体收敛：GCC 货运与物流市场将从 2025
              年约 USD 83.24 billion 增至 2026 年 USD 89.32 billion，并在 2031 年达到 USD 120.21 billion，对应 6.12% CAGR。在这套栈里，货运运输占
              2025 年收入的 52.12%，公路又贡献货运运输收入的 39.05%。把这些比例方向性套到 2026 年总额上，可得到约 USD 46.6 billion 的货运运输粗略估算，以及约 USD 18.2
              billion 的公路货运粗略估算。即便如此，仍高估了 TruKKer 这类平台能实际触达的空间，因为相当一部分公路支出是自用、资产自有，或运营上不适合平台匹配。第二个视角来自沙特电商物流，预计将从 2025 年
              USD 2.20 billion 增至 2026 年 USD 2.38 billion，并在 2031 年达到 USD 3.66 billion。这个细分小于 GCC
              公路货运，但说明数字化密度高的需求口袋，可以比基础物流市场更快复合增长。
