          - type: callout
            title: 数字化真实存在，但渗透率数据仍弱
            body: 公开来源强力支撑物流数字化这一方向性趋势，但没有给出干净、权威的 GCC 数字化中介公路货运渗透率。因此只能用代理值测算，采用速度风险也仍未解决。
