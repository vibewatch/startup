  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户触点
        blocks:
          - type: paragraph
            body: >-
              TruKKer 卖的不是简单卡车名录，而是在碎片化公路货运中提供工作流确定性。官方货主页面和 Procure Co 页面展示了一个面向买方的控制平面：捕捉需求、运行供应商竞价、管理执行，并呈现发票和付款。供给侧的
              Partner App
              给承运商提供实时货源板、行程管理、收入可视性、单证处理和多语言入口。这个组合重要，因为它说明产品同时服务买方编排和承运商合规，比单边货源板更可防守。运营模式也明显多渠道：官方页面称，货运请求可以从
              WhatsApp、email、电话、语音留言或仪表盘录入开始，再由 TruKKer 的 AI 把这些输入转成 RFQ。因此，公开证据支撑的是一个运营较重、带企业工作流工具的数字市场，而不是纯自助 SaaS 产品。
