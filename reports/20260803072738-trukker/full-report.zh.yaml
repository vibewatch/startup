      - number: '2.5'
        title: 对 TruKKer 的含义
        blocks:
          - type: paragraph
            body: >-
              对 TruKKer 来说，市场含义有利但需要细分。可触达需求在扩张：公路货运仍是 GCC 不可或缺的内陆模式；沙特和 UAE
              政策继续投资数字化物流走廊；电商、工业项目和海运冲击都提高了灵活卡车运力的价值。同时，公司的真实可服务市场（SAM）比头条物流市场数字暗示的更窄。它所在的工作流通常公路占比高、由企业控制、单证密集，且足够碎片化，让软件加经纪能增加可衡量价值。这指向工业、FMCG、零售分销、港口到内陆和跨境走廊，而不是泛化的最后一公里或港口所有权经济。最大未解尽调问题是渗透率：公开来源对市场规模和定性数字化趋势支撑较强，但缺少一个干净的
              GCC 统计，说明多少卡车支出已由数字化中介撮合。这个缺口要求分析使用有边界的代理值，而不是假装精确；这也是看待这个市场的正确姿态。
            claimRefs:
