      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前财务
        - 经审计收入、抽佣率、毛利率、EBITDA / 现金消耗
        - 缺少这些，估值仍由门槛驱动，而不是经济性驱动
        - 财务尽调和审计师资料包
      - - 应收账款质量
        - AR 账龄、坏账损失率、契约余量、证券化服务数据
        - 债务驱动资金必须转化为耐久股权价值
        - 资金 / 贷款方资料包
      - - 客户耐久度
        - 头部客户集中度、续约、流失、活跃与注册定义
        - 规模如果没有耐久度，仍可能需要折价
        - 收入运营和客户分析
      - - 股权结构 / 优先权
        - 优先权结构、清偿顺位、稀释条款、可转债或认股权证
        - 不理解分配顺序，入场价没有意义
        - 法务和融资记录
      - - 运营控制
        - 许可证清单、事件日志、合规审计、安全态势
        - 估值溢价需要确信规模可治理
        - COO / 合规 / 安全尽调
    notes: 这些要求是从跟踪姿态转向有价格承保建议所需的最低资料包。
