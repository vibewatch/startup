      - number: '5.2'
        title: 执行架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开架构是流程架构，而不是源代码架构。TruKKer 首页描述了一个 AI 层：把进入的货主请求结构化为 RFQ，将机会路由给已验证供应商，并支持通过 WhatsApp、电话或 Partner App
              竞价。承运商界面随后处理报价、行程追踪、单证和付款；TruKKer Safe 则增加检验、照片和视频证据、QR 编码状态以及 HSE
              验证。这些组件指向一种混合运营架构：软件协调大量现实世界中的调度、检验和回款活动。因此，产品更适合被看成带人在回路执行的货运操作系统，而不是纯自主交易所。在 GCC
              卡车运输中，这个选择有战略合理性，因为车道复杂、边境摩擦和车队所有权碎片化，让完全自动化不现实。它也意味着，产品质量不仅取决于 UI，也同样取决于现场运营、安全工作流和合作伙伴采用。
