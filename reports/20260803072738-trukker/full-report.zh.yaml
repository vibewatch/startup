      - number: '8.3'
        title: 情景区间与价格纪律
        blocks:
          - type: paragraph
            body: >-
              缺少新的公开股权定价时，最好的估值方法不是伪精确，而是用门槛逻辑和可比公司分散度锚定情景区间。熊市情景假设债务驱动增长没有转化为干净的股权价值：回款、损失率或集中度弱于预期，或未来一级 / 二级交易落在
              Hurun 线以下。这样，低于独角兽的 US$0.6-0.9 billion 结果是可能的。基准情景假设 Hurun
              门槛大方向正确，规模指标大体真实，机构融资继续支撑网络增长，且没有暴露重大应收账款弱点；因此可支撑约 US$1.0-1.3
              billion。牛市情景需要的不只是叙事动能延续。它需要经审计或近似经审计的收入质量、利润率改善、股权结构干净度和回款纪律证明，还要证明 TruKKer
              能把结构化融资转成持久股权价值。证据强到这一步，US$1.4-1.8 billion 区间才站得住。今天若高于约 US$1.5 billion，公开记录其实是在要求投资人为尚未看到的证明买单。
