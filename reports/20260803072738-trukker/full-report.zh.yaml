            body: >-
              TruKKer 公开客户故事的主要弱点不是采用，而是留存可视性。保留来源没有披露 NRR、GRR、流失、续约率、合同期限或头部客户集中度。可以推断出一些扩张逻辑：Omnilog
              暗示可从公路货运交叉销售到海运、空运、仓储和海关服务；RTA/Logisty
              显示调度和定价能力可在相邻品类复用；财务章节也说明，当客户发票真实、回款足够可靠时，机构营运资本融资更容易安排。但这些都是间接信号，不是留存指标。承运侧产品页面和应用商店新鲜度暗示供给侧参与活跃，却没有揭示重复频率或供应商流失。因此，TruKKer
              的客户耐久性应被视为有希望但披露不足；在拿到头部账户组合和续约数据之前，集中风险应假设为实质性。
