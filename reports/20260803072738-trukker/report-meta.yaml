companyProfile:
  summary: |
    TruKKer is a late-stage private digital freight marketplace founded in 2016 by Gaurav Biswas and Pradeep Mallavarapu. The company sells an asset-light logistics workflow that combines freight booking, matching, tracking, documentation, inspection, and payments for enterprise shippers while coordinating a large carrier network across Saudi Arabia, the UAE, and adjacent corridors. Public evidence supports meaningful scale—1,200+ enterprise clients, 60,000 to 75,000 trucks or transporters, and >US$200 million historical revenue anchor—but current audited economics, retention, cap-table terms, and receivables quality remain private.
  foundedDate: '2016-01-01'
  founders:
    - name: Gaurav Biswas
      role: Co-founder & CEO
      background: Public face of the company across funding, crisis-routing, and scaling narratives.
      claimRefs: [CO002]
    - name: Pradeep Mallavarapu
      role: Co-founder & CTO
      background: Earlier funding coverage identifies him as the technical co-founder and CTO.
      claimRefs: [CO003]
  headquarters: Riyadh, Saudi Arabia / Dubai, UAE public-footprint conflict
  productSummary: |
    TruKKer sells a digital workflow for road freight and adjacent logistics services: enterprise freight booking, reverse-auction style procurement, truck matching, tracking, documentation, inspection, and payment orchestration, supported by carrier-side apps and newer multimodal or financing adjacencies.
  customerFocus: Enterprise shippers and procurement teams across GCC freight-intensive sectors, plus a large carrier / fleet / driver supply network.
  businessModel: Asset-light digital freight marketplace earning economics from matching and orchestrating truck capacity, with increasing use of structured working-capital and receivables finance around the operating model.
  stage: Late-stage private
  fundingStatus: Latest public financing signals are debt, private credit, and securitisation rather than a newly disclosed common-equity round; the last visible equity-era anchors remain 2022-vintage.
