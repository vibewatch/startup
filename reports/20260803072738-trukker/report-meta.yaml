  topStrengths:
    - Real two-sided marketplace scale is supported by repeated public signals on enterprise clients, truck network breadth, and regional footprint.
    - TruKKer has attracted multiple credible institutional backers and lenders, including major 2022 equity capital and 2025-2026 private-credit / securitisation counterparties.
    - The product surface appears operationally substantive, spanning booking, procurement, tracking, documentation, inspection, and payouts rather than a narrow lead-gen layer.
    - Crisis-period reporting suggests TruKKer can become more strategically relevant when GCC trade corridors are disrupted.
    - Asset-light marketplace structure can scale faster than an owned-fleet model if collections, supply quality, and compliance remain under control.
  topRisks:
    - No fresh public common-equity valuation mark exists in 2025-2026, so current price discovery is weak.
    - Audited current revenue, gross margin, EBITDA / burn, and receivables-quality data are not publicly disclosed.
    - The cap-table preference stack and dilution terms are undisclosed, limiting return underwriting even if the headline valuation is attractive.
    - Multi-jurisdiction transport, labor, privacy, and data-governance obligations create a large compliance surface relative to public control disclosures.
    - Public market signals from Freightos and other logistics names warn that logistics-tech multiples can reset sharply when profitability or disclosure disappoints.
    - Headquarters attribution, active-vs-registered network definitions, and customer durability remain under-disclosed.
  unresolvedGaps:
    - Audited current revenue, take rate, gross margin, EBITDA, burn, and cash runway.
    - AR aging, bad-debt loss rates, covenant headroom, and securitisation servicing performance.
    - Top-customer concentration, renewal, churn, and active-vs-registered customer definitions.
    - Preference stack, seniority, warrants, and other terms that determine actual new-investor returns.
    - Security, compliance, and incident-history artifacts needed to prove that scale is governable.
    - Management's explicit exit path and IPO readiness status.
