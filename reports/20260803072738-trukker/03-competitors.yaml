callouts:
- calloutType: insight
  title: TruKKer’s hardest competition comes from bundling, not cloning
  body: No reviewed competitor matches TruKKer exactly. The real threat is that incumbents and adjacents can surround the same shipper budget with road, customs, parcel, warehousing, or finance services.
  claimRefs:
  - CP001
  - CP031
  - CP033
  - CP036
  - CP040
- calloutType: risk
  title: Marketplace multi-homing keeps switching costs lower than they look
  body: Public evidence does not show strong carrier exclusivity or shipper lock-in. That means pricing pressure and multi-homing are likely persistent unless workflow, compliance, and payment rails become deeply embedded.
  claimRefs:
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
