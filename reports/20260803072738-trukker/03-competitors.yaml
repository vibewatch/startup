  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Carrier-network density and verified capacity
    - Carriers multi-home across platforms and direct brokers
    - High
    - Request carrier exclusivity, repeat-load, and utilization data by corridor
  - - Enterprise procurement workflow depth
    - Large 3PLs add better dashboards and sourcing workflows
    - High
    - Request product adoption depth, lane penetration, and buyer-role retention evidence
  - - Cross-border compliance and road specialization
    - Incumbents bundle customs, warehousing, and freight in one account
    - High
    - Test whether TruKKer wins on ROI against integrated bundle providers
  - - Transparent pricing and reverse-load logic
    - Quote competition compresses spreads and turns matching into a commodity
    - Medium-High
    - Request gross-margin by lane and evidence of pricing power in constrained corridors
  - - Regional crisis responsiveness
    - Incumbents and sovereign-backed operators copy land-bridge playbooks
    - Medium
    - Validate how much crisis traffic persisted after sea lanes normalized
  - - Adjacency insulation from wholesale / warehousing platforms
    - Commerce and storage platforms own shipper workflow upstream
    - Medium
    - Map overlap in customer accounts between TruKKer, SILQ/Sary, and Logexa
  notes: The main risk is not a single cloned competitor; it is bundling pressure from incumbents plus multi-homing by both sides of the marketplace.
