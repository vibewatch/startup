  - - NAQEL Express
    - Integrated regional 3PL / express / road operator
    - 20M shipments; 16 countries; 5,000+ employees; 4,000+ vehicles
    - B2B and B2C regional logistics, e-commerce, regulated and cold-chain sectors
    - End-to-end bundling across road, warehousing, customs, cold chain, parcel
    - Public materials emphasize network breadth more than procurement-marketplace depth
  - - Aramex
    - Public global logistics and transportation group
    - USD 1.73B 2025 revenue; 16,000+ employees; 600+ offices; 70 countries
    - Regional and global freight, domestic express, e-commerce, logistics buyers
    - Brand trust, multimodal scale, public balance-sheet visibility, broad product suite
    - Less specialized publicly in heavy long-haul truck marketplace behavior
  - - AJEX
    - Saudi hybrid parcel, road, and freight operator
    - 60+ facilities; 1,200 vehicles; 2,000 professionals; DHL strategic stake
    - Saudi and regional e-commerce, road services, freight, cold-chain customers
    - Saudi local density plus SF International and DHL backing
    - Newer platform with less disclosed financial scale than Aramex
  - - Shipa Freight
    - Digital freight forwarder
    - Powered by Agility; 20,000+ trade lanes quoted online
    - SMEs and import/export buyers needing air and ocean booking
    - Instant online quoting, customs, insurance, tracking, credit
    - Air/ocean-first; not a core GCC trucking network
  - - Sary / SILQ
    - Adjacent B2B commerce and logistics platform
    - $110M merger financing; 600,000 retailers served; 100M shipments
    - Retailers, HORECA, wholesalers, SME procurement buyers
    - Combines commerce, logistics, and embedded finance near the shipper wallet
    - Not a direct heavy-freight marketplace
  - - Logexa
    - Adjacent warehousing and transport platform
    - 50+ warehouses; 380+ customers inside Saudi Arabia
    - Storage-led logistics and inventory customers
    - Warehouse network plus inventory-management platform and transport services
    - Storage-first rather than carrier-marketplace-led
  notes: This profile table covers the most relevant regional direct, incumbent, and adjacent players rather than every Saudi logistics company. Rows summarize publicly visible positioning, not audited private segment economics.
