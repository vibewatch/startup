- id: risk-verdict-and-kill-criteria
  title: Risk Verdict and Kill Criteria
  body: 'Public evidence supports a nuanced conclusion. TruKKer does not look like
    a flimsy slideware marketplace: it has real operational scale, visible crisis-response
    playbooks, explicit platform terms, and a data-governance framework that at least
    acknowledges the obligations created by its model. The main issue is that control
    depth is less transparent than network breadth. Investors are therefore underwriting
    two layers at once: a logistics marketplace exposed to geopolitical and execution
    volatility, and a data- and receivables-heavy operating system whose financing
    story increasingly depends on disciplined collections and sustained service quality.
    That makes the most important diligence questions very specific. Can management
    produce license inventories, privacy compliance artifacts, breach/incident logs,
    bad-debt data, top-customer concentration, and covenant headroom? If not, the
    right framing is not “low conviction pass” but “real business, incomplete control
    proof.” The kill criteria should therefore focus on measurable compliance failures,
    service breakdowns, receivables stress, and evidence that ecosystem breadth is
    outpacing organizational control.'
  claimRefs:
