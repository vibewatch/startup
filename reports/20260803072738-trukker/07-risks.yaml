  rows:
  - - Transport licensing, permits, and carrier insurance compliance
    - Saudi Arabia / UAE / GCC
    - Platform terms require it; public license inventory not disclosed
    - Medium-High
    - High
    - Carrier onboarding rules, account suspension rights, regulator-linked products
    - A documentation lapse can halt lanes or expose the platform to enforcement
    - Request entity-by-entity license register, carrier compliance SOPs, and exception
      logs
  - - PDPL and cross-border personal-data processing
    - Saudi Arabia plus cross-border transfers
    - PDPL obligations clearly apply to KSA-linked processing; public implementation
      artifacts are thin
    - Medium
    - High
    - Privacy policy, controller obligations, breach handling, possible DPO / registry
      rules
    - Data misuse or weak transfer controls would hit regulators and enterprise trust
      together
    - Request RoPA, transfer-risk assessment, DPO appointment status, and breach-notification
      policy
  - - Contractual liability, indemnity, and Dubai-court dispute concentration
    - UAE
    - Terms are explicit, but actual claims history is undisclosed
    - Medium
    - Medium-High
    - Centralized governing law and contractual controls
    - Disputes could cluster in one forum and stress counterpart relationships
    - Request template MSAs, key SLA carve-outs, claims history, and liability caps
      by segment
  - - Multi-jurisdiction labor and safety compliance
    - Saudi Arabia / UAE / cross-border lanes
    - Terms reference labor and safety obligations; public workforce-compliance metrics
      are absent
    - Medium
    - Medium-High
    - Partner App structure, driver-support programs, and onboarding controls
    - A large carrier network can hide uneven labor or safety practices
    - Request Saudization / localization metrics, driver audit cadence, and safety-incident
      reporting
  notes: Residual exposure is driven by missing public proof of licenses, compliance
    audits, and legal-claims history rather than by evidence that regulations are
    unimportant.
