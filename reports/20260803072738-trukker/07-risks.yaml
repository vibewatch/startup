- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance breakdown
    - Material regulator notice, operating suspension, or missing license pack
    - Any unresolved notice in a core market or inability to produce license inventory
    - Escalate to thesis-break unless quickly remediated with documentary proof
  - - Data / platform-control failure
    - Breach, prolonged outage, or major enterprise complaint linked to data or payout
      controls
    - Named breach, recurring outage, or inability to show incident logs / security
      program
    - Reprice for control risk or pause diligence
  - - Receivables / financing stress
    - Facility tightening, rising overdue invoices, or weak collections
    - Meaningful covenant pressure or loss-rate deterioration
    - Move from growth-underwrite to downside-protection posture
  - - Execution sprawl
    - Adjacency launches outpace operating discipline
    - New products added without clear owners, KPIs, or integration proof
    - Require product-by-product profitability and governance before underwriting
      expansion premium
  notes: These kill criteria prioritize risks that can move from narrative concern
    to investment impairment on short notice.
