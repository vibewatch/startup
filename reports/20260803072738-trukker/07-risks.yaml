  evidenceGaps:
  - type: missing-source
    severity: material
    topic: license-inventory
    missingEvidence: Jurisdiction-by-jurisdiction operating licenses, carrier permit
      controls, and compliance audit history.
    whyItMatters: The most severe operational risk is regulatory non-compliance across
      multiple transport jurisdictions.
    diligencePath: Request legal-entity map, permit register, audit schedule, and
      exception log by market.
    relatedTableRefs:
    - TR001
    relatedQuestionRefs:
    - QR021
  - type: missing-source
    severity: material
    topic: security-audit
    missingEvidence: Independent security certifications, penetration-test summaries,
      incident log, uptime history, and disaster-recovery evidence.
    whyItMatters: The platform appears mission-critical for matching, tracking, and
      settlement, so control failure would transmit directly into service quality
      and enterprise trust.
    diligencePath: Request ISO / SOC posture, latest pen test, incident register,
      RTO/RPO targets, and public/private status-management process.
    relatedQuestionRefs:
    - QR022
  - type: missing-source
    severity: medium
    topic: litigation-enforcement
    missingEvidence: Public lawsuit, enforcement, or claims-history pack across UAE,
      Saudi Arabia, and other operating markets.
    whyItMatters: Contractual liability, cargo disputes, employment matters, or regulator
      actions could be economically meaningful even if they are not visible in media
      coverage.
    diligencePath: Run counsel-led litigation search and request management representation
      letter plus claims reserve history.
    relatedQuestionRefs:
    - QR023
  - type: missing-source
    severity: material
    topic: receivables-quality
    missingEvidence: Bad-debt loss rates, overdue AR buckets, covenant headroom, borrowing-base
      rules, and securitisation performance metrics.
    whyItMatters: Credit-backed growth depends on invoice quality and collections,
      not just top-line GMV or truck count.
    diligencePath: Request facility agreements, monthly servicing reports, AR aging,
      and concentration by debtor and geography.
    relatedQuestionRefs:
    - QR024
    - QR029
  - type: missing-source
    severity: medium
    topic: workforce-localization
    missingEvidence: Saudization / localization metrics, driver employment mix, and
      safety-incident or driver-turnover reporting.
    whyItMatters: Marketplace scale is operationally fragile if the carrier network
      or local compliance programs are thinner than public growth claims imply.
    diligencePath: Request workforce mix, contractor vs employee split, localization
      compliance dashboards, and safety KPIs.
    relatedQuestionRefs:
    - QR021
