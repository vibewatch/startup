- id: partner-capital-and-execution-dependencies
  title: Partner, Capital, and Execution Dependencies
  body: 'TruKKer’s recent evolution increases dependency risk in two ways. First,
    financing is no longer a simple equity story. By 2025 and 2026 the public narrative
    had shifted toward private credit and securitisation, which should improve network
    capacity if executed well but also ties credibility more tightly to invoice quality,
    collections, and operational discipline. Second, the company is broadening across
    products and geographies at the same time. The TruckSher acquisition, Omnilog
    launch, regulator-linked Logisty deployment, and ecosystem brands such as MoXey
    or AI assistants all expand the addressable story, but each adds integration overhead,
    partner dependence, and management complexity. The source set does contain some
    comfort: STV’s follow-on support, recurring enterprise and truck-count milestones,
    and evidence of crisis routing all suggest the platform is real. But scale itself
    is not a mitigation. With 500+ employees, 1,200+ enterprise clients, and tens
    of thousands of trucks, weak processes can reverberate quickly across service
    quality, receivables, and reputation.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
