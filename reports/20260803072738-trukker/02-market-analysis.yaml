- id: implications-for-trukker
  title: Implications for TruKKer
  body: 'For TruKKer, the market implication is favorable but nuanced. The addressable demand is expanding because road freight remains the GCC’s indispensable inland mode, because Saudi and UAE policy continue to invest in digitalized logistics corridors, and because e-commerce, industrial projects, and maritime shocks all increase the value of flexible truck capacity. At the same time, the company’s real SAM is narrower than headline logistics-market figures imply. It lives in workflows where freight transport is road-heavy, enterprise-controlled, documentation-intensive, and fragmented enough for software-plus-brokerage to add measurable value. That points to industrial, FMCG, retail distribution, port-to-inland, and cross-border corridors rather than generic last-mile or port ownership economics. The major unresolved diligence question is penetration: public sources are strong on market size and strong on qualitative digitalization, but weak on a clean GCC statistic for how much trucking
    spend is already digitally mediated. That gap pushes analysis toward bounded proxies rather than false precision, which is the correct posture for this market.'
