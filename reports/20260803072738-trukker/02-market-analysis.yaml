callouts:
- calloutType: insight
  title: Road freight is the right market boundary, not all logistics
  body: The most common diligence mistake would be to anchor TruKKer to a USD 89 billion GCC logistics TAM without subtracting warehousing, maritime, air, rail, and captive-fleet economics. The more relevant serviceable layer is road-centric enterprise freight orchestration.
  claimRefs:
  - CM004
  - CM007
  - CM035
  - CM036
- calloutType: risk
  title: Digitization is real, but penetration data is still weak
  body: Public sources strongly support logistics digitization as a directional trend, but they do not provide a clean, authoritative GCC figure for digitally mediated road-freight penetration. That forces proxy-based sizing and leaves adoption-speed risk unresolved.
  claimRefs:
  - CM027
  - CM037
  - CM038
