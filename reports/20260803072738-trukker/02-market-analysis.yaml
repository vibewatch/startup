  rows:
  - - Total GCC freight & logistics
    - All freight transport, forwarding, warehousing, CEP, and auxiliary services
    - None at the top-down TAM level
    - National economies, enterprise shippers, 3PLs
    - Useful outer TAM only; too broad for underwriting TruKKer directly
  - - Freight transport core
    - Road, rail, air, sea, and pipeline transport revenue
    - Storage-only and non-transport service layers
    - Shippers, distributors, industrial operators
    - Closer to operational freight demand but still broader than TruKKer's lane
  - - Road freight / trucking
    - Domestic and cross-border highway haulage, FTL/LTL, industrial and retail movements
    - Pure maritime, air, rail, and static warehousing revenue
    - Procurement and logistics directors
    - Best broad proxy for the backbone mode TruKKer digitizes
  - - Enterprise digital road orchestration
    - Matched truck capacity, control towers, rate visibility, documentation, and compliance workflows
    - Captive private fleets with no third-party dispatch need
    - Large enterprises with recurring freight budgets
    - Closest serviceable lens for TruKKer
  - - Saudi e-commerce logistics niche
    - Transportation, warehousing, returns, and value-added logistics tied to online retail
    - Non-e-commerce industrial haulage
    - Retail/e-commerce operators
    - High-growth adjacency that demonstrates digitization-rich demand pockets
  notes: The market boundary narrows from all logistics spend to road-centric orchestration, which is materially more relevant to TruKKer than broad freight-and-logistics TAM headlines.
