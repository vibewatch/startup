- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: TruKKer has enough network scale and institutional counterparties to
      deserve low-end unicorn credibility.'
    - Audited current revenue, AR quality, and margin disclosure would strengthen
      this materially.
  - - 'Anti-thesis: most post-2022 public financing has been debt-led, so current
      equity value is stale and potentially overstated.'
    - A fresh common-equity round with credible outside pricing would weaken the anti-thesis.
  - - 'Thesis: multi-country scale, 1,200+ clients, and 60,000-75,000 trucks imply
      a real platform rather than a paper marketplace.'
    - Retention, concentration, and active-vs-registered participant data would confirm
      how durable that scale really is.
  - - 'Anti-thesis: public markets punish logistics-tech names harshly when economics
      or disclosure disappoint, as Freightos demonstrates.'
    - Sustained profitability or audited growth quality closer to mature public peers
      would narrow that penalty gap.
  notes: The recommendation should move only when price or proof changes; company
    quality alone is not enough for a valuation call.
