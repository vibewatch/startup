company:
  name: TruKKer
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports TruKKer as a real late-stage logistics platform
    with low-end unicorn credibility, but not a precise premium valuation. Hurun’s
    2026 methodology confirms only that unicorn-status implies at least a US$1 billion
    threshold, while TruKKer’s post-2022 public financing has been mostly debt, private
    credit, and securitisation rather than fresh equity price discovery. Against that
    backdrop, a disciplined 2026 range is roughly US$0.6-0.9bn bear, US$1.0-1.3bn
    base, and US$1.4-1.8bn bull, with the correct recommendation being track / research
    more unless entry is at or below the unicorn threshold with strong economics and
    preference protection disclosed.
sections:
- id: valuation-context-and-recommendation
  title: Valuation Context, Price Discovery, and Headline Recommendation
  body: 'The first valuation problem is not scale but price discovery. Public sources
    show that TruKKer raised major equity rounds in 2019, 2022, and a US$100 million
    pre-IPO round led by Investcorp in 2022, but the 2025-2026 public financing narrative
    shifted toward debt, private credit, and receivables-backed securitisation. That
    matters because structured financing can validate bankability without setting
    a new common-equity mark. Hurun’s 2026 unicorn methodology is useful, but only
    as a threshold marker: it tells us that a company on the list is worth at least
    US$1 billion, not exactly how much above that line it deserves to trade. Public
    scale markers—1,200+ enterprise clients, 60,000 to 75,000 trucks, nine-country
    presence, and >US$200 million annual revenue in a workplace-profile source—support
    the idea that TruKKer is not a narrative-only startup. They do not, however, replace
    audited current revenue, margin, burn, retention, or cap-table disclosure. The
    right headline call is therefore track / research more, with strict price discipline
    around the unicorn threshold rather than a momentum-style premium bid.'
