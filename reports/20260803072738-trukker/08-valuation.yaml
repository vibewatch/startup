- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financials
    - Audited revenue, take rate, gross margin, EBITDA / burn
    - Without them, valuation remains threshold- rather than economics-driven
    - Finance diligence and auditor package
  - - Receivables quality
    - AR aging, bad-debt loss rates, covenant headroom, securitisation servicing data
    - Debt-led funding must convert into durable equity value
    - Treasury / lender pack
  - - Customer durability
    - Top-customer concentration, renewal, churn, active-vs-registered definitions
    - Scale without durability can still deserve a discount
    - Revenue operations and customer analytics
  - - Cap table / preferences
    - Preference stack, seniority, dilution terms, convertibles or warrants
    - Entry price is meaningless without understanding payout order
    - Legal and fundraising records
  - - Operational controls
    - License inventory, incident logs, compliance audits, security posture
    - Valuation premium requires confidence that scale is governable
    - COO / compliance / security diligence
  notes: These asks are the minimum pack required to move from a track posture to
    a priced underwriting recommendation.
