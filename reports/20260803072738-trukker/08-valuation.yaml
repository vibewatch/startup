  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-financial-pack
    missingEvidence: Audited current revenue, take rate / net-revenue bridge, gross
      margin, EBITDA, burn, and cash runway.
    whyItMatters: Without current financials, valuation remains threshold-driven rather
      than economics-driven.
    diligencePath: Request CFO pack, auditor-ready monthly financials, and board reporting
      extracts.
    relatedQuestionRefs:
    - QV007
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: cap-table-preferences
    missingEvidence: Preference stack, seniority, conversion terms, warrants, and
      any side letters affecting new-investor returns.
    whyItMatters: Headline valuation is not sufficient if preferred economics absorb
      most equity upside.
    diligencePath: Request latest cap table, security terms, and full financing history
      ledger.
    relatedQuestionRefs:
    - QV019
  - type: missing-source
    severity: material
    topic: receivables-quality
    missingEvidence: AR aging, bad-debt loss rates, covenant headroom, borrowing-base
      rules, and securitisation servicing performance.
    whyItMatters: A credit-backed growth model can justify or destroy equity value
      depending on collections quality.
    diligencePath: Request lender reporting, servicing data, and debtor concentration
      by geography and segment.
    relatedQuestionRefs:
    - QV020
  - type: missing-source
    severity: medium
    topic: customer-durability
    missingEvidence: Top-customer concentration, renewal, churn, active-vs-registered
      definitions, and cohort data.
    whyItMatters: Marketplace breadth does not automatically translate into durable
      or high-quality revenue.
    diligencePath: Request customer cohort pack, AR by top accounts, and active-customer
      definitions.
    relatedQuestionRefs:
    - QV021
  - type: missing-source
    severity: medium
    topic: exit-readiness
    missingEvidence: Management’s explicit exit plan, IPO readiness status, and any
      banker or strategic-process materials.
    whyItMatters: Late-stage valuation depends partly on whether liquidity pathways
      are credible on a two-to-four year horizon.
    diligencePath: Request fundraising / exit timeline, banker discussions, and public-company
      readiness workstreams.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: medium
    topic: comparable-fit-tv004
    missingEvidence: Cleaner private-market logistics-tech comparable set with disclosed revenue, margins, and transaction terms closer to TruKKer’s stage and geography.
    whyItMatters: The current comparable table intentionally mixes one closer digital-freight peer with several much larger mature public operators, which is directionally useful but not perfect for point pricing.
    diligencePath: Build a tighter private-comp deck with latest logistics-tech rounds, secondary marks, and audited public-peer revenue multiple bridges.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV027
