summary:
  headline: >
    Research-more in 2026: TruKKer appears to be a real GCC freight platform with low-end unicorn credibility, but the
    public record does not justify paying a premium above the US$1B threshold without audited economics,
    receivables-quality proof, and cap-table clarity.
