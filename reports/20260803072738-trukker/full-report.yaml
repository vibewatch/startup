      - number: '1.2'
        title: Founders, Leadership, and Geographic Identity
        blocks:
          - type: paragraph
            body: >-
              The company’s public narrative consistently centers on founder and CEO Gaurav Biswas, while co-founder and
              CTO Pradeep Mallavarapu appears in earlier fundraising coverage as the technical architect behind the
              matching and data platform. A material diligence issue is that TruKKer’s geographic identity is described
              differently depending on the source. The official contact page lists operational offices in Dubai, Riyadh,
              Muscat, Amman, Bahrain, Cairo, Istanbul, Almaty, Warsaw, and Bengaluru, while independent databases and
              news reports alternately call the business Dubai-based, Abu Dhabi-based, Saudi-headquartered, or
              Saudi-based. That divergence does not invalidate the core business, but it matters for legal domicile,
              regulatory oversight, labor mix, and IPO preparedness. Leadership depth outside the founders is visible
              through public references to CFO Amit Agarwal and CDO Muataz Alsafi, yet the board, formal governance
              structure, and full executive roster remain under-disclosed relative to the company’s scale.
