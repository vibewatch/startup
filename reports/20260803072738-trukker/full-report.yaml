      - number: '4.2'
        title: Operating Scale and Traction Proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are meaningful but unevenly refreshed. The 2019 Series A announcement cited more
              than 15,000 member trucks and 200 clients. By the 2022 Series B and Investcorp pre-IPO materials, the
              business had more than 40,000 trucks, 700-plus enterprise customers, and was on track to cross US$200
              million in revenue that year. Later 2025 and 2026 sources move the operating story further: Wamda’s Ruya
              coverage cites 60,000-plus transporters and 1,200-plus enterprise clients across nine countries, while
              AGBI and official surfaces continue to describe a large cross-border freight network serving complex
              industrial lanes. The financial importance of these operating metrics is twofold. First, they imply the
              network has enough density to support lane-level price discovery and reverse-auction procurement. Second,
              they suggest that enterprise wallet share and receivables volume are large enough to underwrite structured
              financing rather than relying only on venture equity. The gap is recency and consistency: public sources
              show growth, but not a clean time series for 2023–2026 revenue, GMV, or gross margin.
