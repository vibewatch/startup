chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              TruKKer presents itself as an AI-enabled digital freight marketplace that organizes highly fragmented land
              freight supply across the Gulf and adjacent corridors. The current official site emphasizes an enterprise
              freight control layer rather than a simple load board: Procure Co centralizes demand capture, bidding,
              execution, and payments; the Partner app gives carriers verified loads, reverse trips, multilingual
              workflows, and milestone-based payouts; and TruKKer Safe digitizes inspection, compliance, and QR-based
              proof of condition. The economic model remains asset-light. Management repeatedly describes TruKKer as the
              region’s “Uber for trucks,” with revenue generated from the spread between shipper pricing and vendor cost
              plus service layers wrapped around execution, visibility, and documentation. Official and independent
              sources agree that TruKKer does not need to own trucks directly to scale; its value is matching fragmented
              truck supply to shipper demand, reducing empty miles, and making cross-border movements more predictable
              for large enterprises.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO034
              - CO035
