companyProfile:
  summary: >
    TruKKer is a late-stage private digital freight marketplace founded in 2016 by Gaurav Biswas and Pradeep
    Mallavarapu. The company sells an asset-light logistics workflow that combines freight booking, matching, tracking,
    documentation, inspection, and payments for enterprise shippers while coordinating a large carrier network across
    Saudi Arabia, the UAE, and adjacent corridors. Public evidence supports meaningful scale—1,200+ enterprise clients,
    60,000 to 75,000 trucks or transporters, and >US$200 million historical revenue anchor—but current audited
    economics, retention, cap-table terms, and receivables quality remain private.
