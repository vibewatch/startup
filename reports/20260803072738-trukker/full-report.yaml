      - number: '2.5'
        title: Implications for TruKKer
        blocks:
          - type: paragraph
            body: >-
              For TruKKer, the market implication is favorable but nuanced. The addressable demand is expanding because
              road freight remains the GCC’s indispensable inland mode, because Saudi and UAE policy continue to invest
              in digitalized logistics corridors, and because e-commerce, industrial projects, and maritime shocks all
              increase the value of flexible truck capacity. At the same time, the company’s real SAM is narrower than
              headline logistics-market figures imply. It lives in workflows where freight transport is road-heavy,
              enterprise-controlled, documentation-intensive, and fragmented enough for software-plus-brokerage to add
              measurable value. That points to industrial, FMCG, retail distribution, port-to-inland, and cross-border
              corridors rather than generic last-mile or port ownership economics. The major unresolved diligence
              question is penetration: public sources are strong on market size and strong on qualitative
              digitalization, but weak on a clean GCC statistic for how much trucking spend is already digitally
              mediated. That gap pushes analysis toward bounded proxies rather than false precision, which is the
              correct posture for this market.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM031
              - CM033
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Road freight is the right market boundary, not all logistics
            body: >-
              The most common diligence mistake would be to anchor TruKKer to a USD 89 billion GCC logistics TAM without
              subtracting warehousing, maritime, air, rail, and captive-fleet economics. The more relevant serviceable
              layer is road-centric enterprise freight orchestration.
            calloutType: insight
            claimRefs:
              - CM004
              - CM007
              - CM035
              - CM036
          - type: callout
            title: Digitization is real, but penetration data is still weak
            body: >-
              Public sources strongly support logistics digitization as a directional trend, but they do not provide a
              clean, authoritative GCC figure for digitally mediated road-freight penetration. That forces proxy-based
              sizing and leaves adoption-speed risk unresolved.
            calloutType: risk
            claimRefs:
              - CM027
              - CM037
              - CM038
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitive Archetypes
        blocks:
          - type: paragraph
            body: >-
              The competitive set around TruKKer is broader than “other truck-booking apps.” For the shipper, the same
              job can be solved through at least four archetypes: a digital road-freight marketplace such as TruKKer;
              integrated regional 3PL and express operators such as NAQEL, Aramex, and AJEX; digital forwarding and
              cross-border trade tools such as Shipa Freight; and adjacent procurement, warehousing, or wholesale
              platforms such as Sary/SILQ and Logexa. Beyond those formal vendors, the status quo remains direct phone
              brokerage and bilateral relationships with fragmented carriers, while the largest enterprises can also
              attempt an internal-build model by onboarding their own carriers and managing rates, documentation, and
              settlements in-house. This matters because the competition is not only feature-for-feature software
              substitution. It is also a contest over who owns procurement workflow, customs competence, carrier access,
              inventory adjacency, and trust in a high-friction GCC logistics environment.
            claimRefs:
              - CP001
              - CP029
              - CP033
              - CP034
              - CP035
