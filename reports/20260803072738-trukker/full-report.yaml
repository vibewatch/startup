      - number: '3.2'
        title: TruKKer and Digital-Platform Challengers
        blocks:
          - type: paragraph
            body: >-
              TruKKer’s most defensible public differentiation is not simply that it is digital, but that it is deeply
              opinionated about enterprise inland freight workflow. Official pages emphasize guaranteed access to
              verified capacity, transparent pricing, real-time visibility, lower counterparty risk, vendor bidding,
              digital onboarding of existing suppliers, and unified control of execution and payment flows. On the
              supply side, the Partner App markets 1000s of loads posted daily, reverse trips, transparent rates, and
              milestone payments within 48 hours—clear signals that the product is designed to reduce empty miles and
              broker opacity. AGBI’s 2026 reporting reinforces that positioning by describing TruKKer as a long-haul and
              large-vehicle specialist rather than a last-mile van network. Shipa Freight is digital too, but it is
              solving a different job: online air and ocean forwarding for SMEs and import/export workflows. That makes
              Shipa more of a cross-border digital-forwarding adjacent than a like-for-like GCC trucking marketplace
              rival.
