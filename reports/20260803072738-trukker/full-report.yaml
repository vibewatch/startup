        title: Customer Segmentation by Buyer, User, and Payer
        blocks:
          - type: paragraph
            body: >-
              TruKKer serves at least three visible customer groups. First are enterprise shippers and procurement teams
              that need predictable domestic and cross-border road freight across verticals such as FMCG, retail and
              e-commerce, construction, manufacturing, metals, mining, oil and gas, and petrochemicals. Second are the
              carrier-side users—single truck owners, brokers, fleet owners, drivers, inspectors, and HSE teams—who
              supply capacity and use the Partner App or inspection workflows day to day. Third are adjacency customers
              in moving and multimodal forwarding, where Logisty and Omnilog broaden the buyer base beyond core
              enterprise land freight. This matters because the payer, user, and beneficiary are not always the same. In
              the core business, enterprises are usually the payers, logistics managers the users, and carrier fleets
              the fulfillment counterparties. In the carrier app, the supply side becomes the primary product user while
              TruKKer monetizes through freight economics rather than a visible app subscription.
