      - number: '8.3'
        title: Scenario Range and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Given the absence of a fresh public equity mark, the best valuation method is a scenario bracket anchored
              to threshold logic and comparator dispersion rather than false precision. The bear case assumes that
              debt-led growth does not translate into clean equity value: collections, loss rates, or concentration
              prove weaker than expected, or a future primary / secondary event lands below the Hurun line. In that
              case, a sub-unicorn US$0.6-0.9 billion outcome is plausible. The base case assumes Hurun’s threshold
              remains directionally correct, scale metrics are broadly real, and institutional financing continues to
              support network growth without revealing major receivables weakness; that supports roughly US$1.0-1.3
              billion. The bull case requires more than continued narrative momentum. It needs audited or near-audited
              proof of revenue quality, margin progression, cap-table cleanliness, and collections discipline, plus
              evidence that TruKKer can convert structured finance into durable equity value. Under that stronger proof
              set, a US$1.4-1.8 billion range becomes defensible. Above roughly US$1.5 billion today, the public record
              asks investors to pay for proof they have not yet seen.
            claimRefs:
