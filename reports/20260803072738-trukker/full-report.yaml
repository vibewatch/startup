      - number: '4.5'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              On the available evidence, TruKKer looks more financially credible in 2026 than a typical regional
              startup, but still not fully underwritable from public materials alone. The positives are clear: strong
              historical growth signals, credible institutional backers, a demonstrated ability to layer debt and
              structured finance onto the cap table, and an operating model that appears to generate receivables large
              enough for bankable securitisation. The caution points are equally clear: current revenue is not public,
              realized pricing is unknown, the exact mix between freight spread and software-like revenue is
              undisclosed, and there is no reliable public view of burn, cash balance, or runway. That means the
              investment case depends on trusting capital-market validation and operating-scale proxies more than on
              audited financial statements. The right verdict is therefore mixed but constructive: revenue quality is
              likely improving with enterprise workflow depth and receivables sophistication, yet the company remains
              capital- and execution-sensitive until margin and cash-generation metrics are disclosed more clearly.
