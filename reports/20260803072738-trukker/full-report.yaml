  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context, Price Discovery, and Headline Recommendation
        blocks:
          - type: paragraph
            body: >-
              The first valuation problem is not scale but price discovery. Public sources show that TruKKer raised
              major equity rounds in 2019, 2022, and a US$100 million pre-IPO round led by Investcorp in 2022, but the
              2025-2026 public financing narrative shifted toward debt, private credit, and receivables-backed
              securitisation. That matters because structured financing can validate bankability without setting a new
              common-equity mark. Hurun’s 2026 unicorn methodology is useful, but only as a threshold marker: it tells
              us that a company on the list is worth at least US$1 billion, not exactly how much above that line it
              deserves to trade. Public scale markers—1,200+ enterprise clients, 60,000 to 75,000 trucks, nine-country
              presence, and >US$200 million annual revenue in a workplace-profile source—support the idea that TruKKer
              is not a narrative-only startup. They do not, however, replace audited current revenue, margin, burn,
              retention, or cap-table disclosure. The right headline call is therefore track / research more, with
              strict price discipline around the unicorn threshold rather than a momentum-style premium bid.
            claimRefs:
