  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: How threshold evidence, scale proof, and missing disclosure combine into the track recommendation.
    data:
      nodes:
        - id: h1
          label: Hurun threshold >= US$1B
          detail: Confirms low-end unicorn floor, not a precise mark.
        - id: s1
          label: Real operating scale
          detail: 1,200+ clients, 60k-75k trucks, >US$200m revenue proxy.
        - id: f1
          label: Debt-led 2025-2026 financing
          detail: Bankability signal but no fresh common-equity pricing.
        - id: c1
          label: Public comp reset risk
          detail: Freightos low cap; mature peers much larger and more disclosed.
        - id: g1
          label: Missing proof set
          detail: Audited revenue, AR quality, preferences, retention.
        - id: r1
          label: 'Recommendation: Track / research more'
          detail: Only buy with price discipline and better proof.
        - id: u1
          label: Upgrade path
          detail: Fresh equity, audited economics, clean collections.
        - id: d1
          label: Downgrade path
          detail: Sub-threshold pricing or control deterioration.
      edges:
        - from: h1
          to: r1
        - from: s1
          to: r1
        - from: f1
          to: r1
        - from: c1
          to: r1
        - from: g1
          to: r1
        - from: r1
          to: u1
        - from: r1
          to: d1
    approximationNotes: This is an analyst-constructed decision flow, not management guidance.
    claimRefs:
      - CV001
      - CV009
      - CV014
      - CV019
      - CV024
      - CV034
      - CV035
      - CV042
