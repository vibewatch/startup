      - number: '3.4'
        title: Adjacents, Substitutes, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Some of the most important competition is indirect. Sary/SILQ is not a trucking marketplace, but it
              increasingly sits near the same merchant and SME workflows by combining commerce, logistics, and embedded
              finance. Redseer’s account of Sary’s evolution is especially important because it shows a shift from
              simple marketplace software into hybrid logistics infrastructure and then into lighter digital rails
              around POS, financing, and merchant operating systems. Logexa plays yet another adjacent angle: storage
              first, transport second, with a warehouse marketplace and inventory-management platform inside Saudi
              Arabia. These adjacents may not win heavy long-haul FTL directly, but they can own shipper attention,
              data, and wallet share upstream. They also increase multi-homing risk, because neither shippers nor
              carriers appear locked into one rail. Quote-led freight procurement, fragmented fleets, and non-exclusive
              networks mean customers can compare several providers, while carriers can accept loads from any platform
              that gives them better utilization or faster payment.
