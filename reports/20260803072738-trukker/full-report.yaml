          detail: Core shipper, carrier, inspection, and payment workflows.
          tone: neutral
        - id: carriers
          label: Carrier / fleet participation
          detail: App adoption and supply density are essential to bids, coverage, and trip execution.
          tone: risk
        - id: ops
          label: Operations teams
          detail: Human dispatch, customer support, inspection review, and exceptions handling remain important.
          tone: risk
        - id: regulators
          label: Regulators / authorities
          detail: RTA and cross-border transport rules shape product rollout and lane economics.
          tone: risk
        - id: finance
          label: Finance / settlement systems
          detail: Payout speed and receivables discipline affect trust and repeat supply participation.
          tone: risk
        - id: adj
          label: Adjacency brands
          detail: Omnilog, Logisty, ATOMIX, and MoXey expand breadth but add integration and focus risk.
          tone: neutral
      edges:
        - from: carriers
          to: platform
          label: capacity and app usage
        - from: ops
          to: platform
          label: exception handling
        - from: regulators
          to: platform
          label: licensing and service rules
        - from: finance
          to: platform
          label: settlement performance
        - from: adj
          to: platform
          label: cross-sell / integration complexity
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: Relative maturity of TruKKer capabilities based on public evidence quality.
    claimRefs:
      - CE008
      - CE009
      - CE015
      - CE018
      - CE027
      - CE036
    data:
      columns:
        - Public evidence strength
        - Operational maturity signal
        - Main gap
      rows:
        - label: Enterprise procurement / bidding
          values:
            - label: Strong
              tone: positive
              detail: Official pages are detailed and workflow-specific.
            - label: Strong
              tone: positive
              detail: Procure Co and shipper pages show concrete process depth.
            - label: Pricing and API detail
              tone: warning
              detail: No public connector or pricing transparency.
        - label: Carrier execution app
          values:
            - label: Strong
              tone: positive
              detail: Official page plus app stores corroborate features and active updates.
            - label: Moderate-Strong
              tone: positive
              detail: Real product with rating and version evidence.
            - label: Adoption metrics
              tone: warning
              detail: MAU, installs, and retention are not public.
        - label: Safety inspection tooling
          values:
            - label: Strong
              tone: positive
              detail: TruKKer Safe page is concrete and process-rich.
            - label: Moderate-Strong
              tone: positive
              detail: Inspection app appears embedded in operations.
            - label: External assurance
              tone: warning
              detail: No retained third-party audit or certification proof.
        - label: Multimodal forwarding via Omnilog
          values:
            - label: Moderate
              tone: neutral
              detail: Launch coverage exists across multiple outlets.
            - label: Moderate
              tone: neutral
              detail: Service expansion looks real but less evidenced than core freight.
            - label: Customer proof depth
              tone: warning
              detail: Few public case studies or usage metrics.
        - label: Moving / Logisty adjacency
          values:
            - label: Moderate
              tone: neutral
              detail: Official booking and partner narratives are visible.
            - label: Moderate
              tone: neutral
              detail: Workflow appears operational in Dubai context.
            - label: Strategic relevance
              tone: warning
              detail: Relationship to core enterprise moat is uncertain.
        - label: EV / fintech ecosystem bets
          values:
            - label: Weak-Moderate
              tone: warning
              detail: Mostly supported by owned-media narrative.
            - label: Developing
              tone: warning
              detail: Public maturity trails the core freight stack.
            - label: Independent corroboration
              tone: risk
              detail: Deployment scale is not well evidenced publicly.
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: How TruKKer typically connects enterprise demand, carrier supply, execution, and expansion.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU022
    data:
      items:
        - label: Demand appears
          detail: A shipper or procurement team needs domestic or cross-border capacity for a lane or project.
        - label: Request capture and quote workflow
          detail: Demand enters via dashboard or assisted channels and moves into bidding / structured pricing workflows.
        - label: Carrier match and execution
          detail: Verified fleets receive opportunities and execute trips through carrier-facing operational tools.
        - label: Inspection, proof, and settlement
          detail: Documentation, inspections, payout visibility, and audit trails increase trust for both sides.
        - label: Repeat use or cross-sell
          detail: >-
            Successful accounts may deepen into recurring lanes, multimodal forwarding, or adjacent services such as
            moving / Logisty.
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public proof narrows sharply from headline customer counts to named deployments and retention visibility.
    claimRefs:
      - CU011
      - CU015
      - CU025
      - CU035
    data:
      items:
        - label: Publicly claimed enterprise customer base
          value: 1200
        - label: Approx. daily truck deployments (company-reported)
          value: 1000
        - label: Named enterprise customers in retained public sources
          value: 2
        - label: Named carrier-side testimonial cluster
          value: 1
        - label: Public retention / concentration disclosures
          value: 0
    approximationNotes: >-
      This is a proof-visibility funnel, not a literal sales-conversion funnel. It shows how the public record thins
      from broad scale claims to account-level durability evidence.
