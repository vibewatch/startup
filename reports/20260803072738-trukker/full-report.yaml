  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              TruKKer’s public materials support a transaction-led, asset-light freight model rather than an asset-heavy
              carrier model. Official pages describe a control layer that manages freight demand capture, vendor
              bidding, execution, invoices, and payment flows for large enterprises, while the Partner App emphasizes
              verified loads, reverse trips, and faster settlements for transporters. That combination strongly suggests
              the core monetization engine is freight spread, commission, or procurement-margin capture on spot and
              contracted road freight rather than subscription-only SaaS. Procure Co broadens that into an enterprise
              workflow product: customers are buying predictability, fulfilment assurance, rate discipline, and control
              over lanes and vendors, not just access to a load board. Public sources do not disclose how much revenue
              comes from spot transactions versus contracted lanes or platform-style workflow fees. As a result, TruKKer
              looks financially closer to a brokered logistics network with software leverage than to a pure SaaS
              company, and revenue quality depends on network liquidity, repeat shipper usage, and execution discipline
              more than list pricing.
