      - number: '7.2'
        title: Data Governance and Platform Control Risk
        blocks:
          - type: paragraph
            body: >-
              The direct-data footprint behind TruKKer is broader than many marketplace descriptions imply. The privacy
              policy covers customers, drivers, transport providers, vendors, and LoadBoard users, and it explicitly
              references personal IDs, payment details, tax and settlement records, and real-time trip location data.
              The policy also contemplates cross-border transfers, disclosures to financial institutions and regulators,
              and location tracking that may continue for shipment completion. That matters because the platform is not
              only moving loads; it is also handling financial settlement, identity verification, insurance/compliance
              workflows, and operational telemetry. In the same breath, TruKKer’s owned product material argues that the
              platform is the “operating backbone” of the freight network. That is a strength if true, but it also means
              outages, weak access controls, or privacy missteps can cascade directly into matching quality, payout
              timing, and shipper confidence. Public mitigations exist—AI normalization, documented workflows, and
              PDPL-aligned language—but third-party audit visibility remains thin.
