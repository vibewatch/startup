      - number: '1.4'
        title: Scale, Footprint, and Product Breadth
        blocks:
          - type: paragraph
            body: >-
              The strongest corroborated scale story is network growth over time. TruKKer claimed more than 15,000
              member trucks and 200 clients in 2019, 40,000+ trucks and 700+ enterprise customers across eight countries
              in 2022, 60,000+ transporters and 1,200+ enterprise clients across nine countries in 2025, and 75,000+
              trucks with about 1,200 enterprise clients by 2026. The operating footprint similarly widened from core
              GCC lanes into Turkey, Egypt, Pakistan, Kazakhstan, Poland, and India-linked support functions. Product
              scope has also broadened. Beyond core road freight, TruKKer now markets large-enterprise procurement
              software, driver/carrier workflow software, safety inspection tooling, cross-border routing, consumer
              moving services, and Omnilog for multimodal forwarding. That breadth can deepen account stickiness, but it
              also makes segmentation difficult because public disclosures do not break out what percentage of activity
              comes from brokerage, software, home-moving, or Omnilog.
