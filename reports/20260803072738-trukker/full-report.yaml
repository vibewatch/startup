  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Residual severity of TruKKer’s most material current risk clusters.
    claimRefs:
      - CR008
      - CR009
      - CR018
      - CR026
      - CR039
      - CR040
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Transport / licensing compliance
          values:
            - label: Medium
              tone: warning
              detail: Rules are explicit but public evidence of license inventory is thin.
            - label: High
              tone: risk
              detail: Lane or regulator action can disrupt operations materially.
            - label: Medium
              tone: neutral
              detail: Terms and workflows exist, audit depth is undisclosed.
            - label: High
              tone: risk
              detail: Residual risk remains high until documentation is produced.
        - label: Privacy / data governance
          values:
            - label: Medium
              tone: warning
              detail: Broad data footprint and cross-border processing increase exposure.
            - label: High
              tone: risk
              detail: Would affect regulators, customers, and payouts at once.
            - label: Medium
              tone: neutral
              detail: Policies and SDAIA guidance exist, public audit proof is limited.
            - label: High
              tone: risk
              detail: Control maturity is not independently verified.
        - label: Geopolitical freight shocks
          values:
            - label: Medium
              tone: warning
              detail: 2026 already demonstrated this can happen quickly.
            - label: High
              tone: risk
              detail: Routing, pricing, and service levels can all move at once.
            - label: Medium
              tone: neutral
              detail: Land-bridge playbook and crisis pricing exist.
            - label: High
              tone: risk
              detail: A prolonged shock still strains margins and partner capacity.
        - label: Working capital / financing dependence
          values:
            - label: Medium
              tone: warning
              detail: Recent capital stack points to institutional credit dependence.
            - label: High
              tone: risk
              detail: Collections or covenant issues would directly impair growth.
            - label: Medium
              tone: neutral
              detail: Funding access is visible but underlying asset quality is private.
            - label: High
              tone: risk
              detail: Public delinquency and loss-rate data are missing.
        - label: Execution breadth / organizational sprawl
          values:
            - label: Medium-High
              tone: warning
              detail: Large network plus multiple adjacencies raises coordination load.
            - label: Medium-High
              tone: warning
              detail: Issues can spread across products and geographies.
            - label: Medium
              tone: neutral
              detail: Follow-on investors and workflow tooling help but do not prove control depth.
            - label: Medium-High
              tone: warning
              detail: Residual risk falls only with stronger operating metrics and governance proof.
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How control failures or external shocks propagate through TruKKer’s platform economics.
    claimRefs:
      - CR006
      - CR017
      - CR026
      - CR033
      - CR034
      - CR037
      - CR040
    data:
      nodes:
        - id: reg
          label: Compliance / regulatory event
          detail: License, PDPL, or labor issue surfaces in a core market.
          tone: risk
        - id: data
          label: Data / platform incident
          detail: Breach, outage, or degraded matching / payout control.
          tone: risk
        - id: shock
          label: Geopolitical freight shock
          detail: Port disruption or sudden rerouting demand surge.
          tone: risk
        - id: ops
          label: Operational execution
          detail: Trip matching, documentation, tracking, and settlement performance.
          tone: neutral
        - id: cust
          label: Customer service levels
          detail: Enterprise shipper reliability and carrier trust.
          tone: neutral
        - id: wc
          label: Receivables / working capital
          detail: Collections, invoice quality, and financing confidence.
          tone: warning
        - id: rev
          label: Revenue / margin
          detail: Fulfilment, pricing discipline, and dispute leakage.
          tone: warning
        - id: val
          label: Valuation / investability
          detail: Whether investors will underwrite expansion and control risk.
          tone: risk
      edges:
        - from: reg
          to: ops
          label: lane restrictions or remediation burden
        - from: data
          to: ops
          label: matching / payout / tracking disruption
        - from: shock
          to: ops
          label: capacity and routing stress
        - from: ops
          to: cust
          label: service reliability
        - from: ops
          to: wc
          label: documentation and invoice quality
        - from: cust
          to: rev
          label: retention and pricing
        - from: wc
          to: rev
          label: cash conversion and loss leakage
        - from: rev
          to: val
          label: growth and margin credibility
        - from: wc
          to: val
          label: financing confidence
  - id: FR003
    title: Dependency map
