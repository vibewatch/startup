  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - >-
          Debt-led growth is not matched by equity price support; receivables, retention, or compliance concerns
          surface; next financing is defensive.
        - US$0.6-0.9B; valuation resets below the unicorn threshold to reflect missing proof and downside stress.
        - Collections weakness, concentration, or sub-threshold equity pricing.
        - Meaningful risk if data room does not close current disclosure gaps.
      - - Base
        - >-
          Scale markers remain broadly credible; institutional financing continues; no major negative surprise on
          receivables or compliance, but no premium proof either.
        - US$1.0-1.3B; roughly at or modestly above the unicorn threshold.
        - Still depends on missing audited revenue, margin, and cap-table evidence.
        - Most defensible range on current public evidence.
      - - Bull
        - >-
          Management shows clean current economics, strong collections, manageable preference stack, and capital-market
          validation through fresh equity or near-equity pricing.
        - US$1.4-1.8B; premium above threshold becomes supportable.
        - Requires proof not yet public, so premature pricing can overpay.
        - Only credible after high-quality disclosure or new round evidence.
    notes: >-
      These are analyst-constructed scenario bands designed to avoid false precision. They are valuation hypotheses, not
      quoted market marks.
