      - number: '1.3'
        title: Capital Base and Investor History
        blocks:
          - type: paragraph
            body: >-
              TruKKer has progressed from early venture rounds into increasingly institutional and structured funding.
              Menabytes reported a $1.4 million seed round in late 2017 and a $2.7 million pre-Series A in 2018; Wamda
              then documented a $23 million Series A in 2019 led by STV with IFC, Endeavor Catalyst, MEVP, and existing
              regional investors. IFC’s project disclosure separately confirms a planned equity investment of up to $3
              million. The company then layered in credit: The National referenced a $10 million Partners for Growth
              facility before TruKKer’s $96 million 2022 Series B mix of equity and debt led by ADQ and STV, with
              Mubadala participating. Investcorp’s 2022 pre-IPO round added another $100 million, including a $51
              million initial close, and management framed the company as a future listing candidate. By 2025-2026, new
              capital came as Ruya private credit and a $300 million ADCB receivables securitisation, underscoring a
              shift from pure venture funding toward working-capital and structured-credit infrastructure.
