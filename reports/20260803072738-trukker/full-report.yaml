      - number: '4.3'
        title: Capital Stack and Financing Evolution
        blocks:
          - type: paragraph
            body: >-
              TruKKer’s most important public financial story is the transition from classic startup equity into
              progressively more sophisticated credit structures. Early rounds included seed and pre-Series A equity,
              followed by a US$23 million Series A in 2019 and a mixed US$96 million Series B in 2022 that already
              incorporated material venture debt. Investcorp’s 2022 pre-IPO round then added fresh growth capital and
              publicly framed potential future capital-markets access. In 2025, Ruya Partners added US$15 million of
              private credit, and in 2026 ADCB arranged a non-recourse trade-receivables securitisation facility of up
              to US$300 million spanning the UAE, Saudi Arabia, and Turkey. That financing path matters because it
              indicates rising institutional confidence in the quality and financeability of TruKKer’s receivables book.
              It also shifts the capital debate away from “can the company raise equity?” toward “how efficiently can it
              fund working capital and growth while minimizing dilution?” The trade-off is that greater financial
              sophistication increases dependence on collections quality, legal structure, and disciplined treasury
              operations.
