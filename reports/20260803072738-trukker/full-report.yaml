      - number: '7.3'
        title: Operational and Geopolitical Shock Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest external stress test in the retained record is the 2026 Hormuz disruption. Both independent
              and company-authored sources show how quickly the freight market can move from normal routing into
              emergency overland improvisation. That is encouraging for TruKKer’s relevance because trucking becomes
              more valuable when maritime certainty breaks down; it is also a warning that the company operates in a
              region where capacity spikes, rate opacity, broker chaining, and partner bottlenecks can emerge within
              days. TruKKer’s response—land-bridge activation, fixed-rate offers, and carrier-focused payment
              support—looks commercially competent, but the same episode demonstrates margin and service-continuity
              fragility. The company’s own AI and Partner App narratives also admit that legacy freight workflows suffer
              from missed details, truck mismatches, documentation gaps, and payout disputes. In other words, the
              operating risk is not just macro shock; it is the day-to-day challenge of coordinating thousands of trips
              with uneven fleet quality, changing border conditions, and variable documentation discipline.
            claimRefs:
