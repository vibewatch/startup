  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Policy Context
        blocks:
          - type: paragraph
            body: >-
              For diligence purposes, TruKKer should not be benchmarked against the entire GCC logistics stack as if it
              could monetize every warehousing, port, parcel, rail, or maritime dollar. The relevant market boundary
              begins with freight transport and then narrows further toward road-centric, enterprise-coordinated,
              cross-border, and heavy-freight workflows where fragmented trucking supply creates a software and
              brokerage problem. Saudi policy is a major accelerator. The Ministry of Transport and Logistics Services
              and the National Transport and Logistics Strategy explicitly frame the Kingdom as a three-continent
              logistics hub, with target improvements such as a top-10 logistics performance ranking and a sixth-place
              road infrastructure ranking. That policy backdrop matters because it expands both hard infrastructure and
              the digital operating layer — customs, e-services, telematics, and control towers — on top of which
              platforms like TruKKer can scale. The practical takeaway is that the addressable market is large, but it
              must be bounded around road-dependent workflow orchestration rather than all logistics spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM020
              - CM021
              - CM022
