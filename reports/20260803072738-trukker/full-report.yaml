  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: The public datapoints most relevant to a valuation decision.
    data:
      items:
        - label: Hurun unicorn threshold
          value: '>=US$1B'
          score: Anchor
          detail: Useful floor marker, not precise fair value.
        - label: Latest fresh equity era
          value: '2022'
          score: Stale
          detail: Publicly visible equity pricing is old.
        - label: 2025-2026 financing mix
          value: Debt / credit / securitisation
          score: Watchpoint
          detail: Validates bankability more than common-equity price.
        - label: Enterprise clients
          value: 1,200+
          score: Strength
          detail: Scale marker supports real platform relevance.
        - label: Truck / transporter network
          value: 60k-75k
          score: Strength
          detail: Large network but active-vs-registered split is unclear.
        - label: Current audited revenue
          value: Undisclosed
          score: Gap
          detail: Core blocker for premium underwriting.
        - label: Receivables quality / loss rates
          value: Undisclosed
          score: Gap
          detail: Critical because financing is credit-linked.
        - label: Cap-table preference stack
          value: Undisclosed
          score: Gap
          detail: Return math cannot be finalized without it.
    approximationNotes: KPI labels mix direct public facts with analyst scoring of evidence quality.
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV024
      - CV025
      - CV026
      - CV035
