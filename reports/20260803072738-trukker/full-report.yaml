            body: >-
              The main weakness in TruKKer’s public customer story is not adoption; it is retention visibility. None of
              the retained sources disclose NRR, GRR, churn, renewal rates, contract lengths, or top-customer
              concentration. We can infer some expansion logic: Omnilog suggests a path to cross-sell from road freight
              into sea, air, warehousing, and customs services; RTA/Logisty shows reuse of dispatch and pricing
              capabilities in adjacent categories; and the financial chapter suggests that institutional working-capital
              financing is easier to arrange when customer invoices are real and collections are sufficiently
              dependable. But these are indirect signals, not retention metrics. The carrier-side product surfaces and
              app-store freshness suggest active supply-side engagement, yet they do not reveal repeat frequency or
              supplier churn. As a result, TruKKer’s customer durability should be treated as promising but
              under-disclosed, and concentration risk should be assumed material until top-account mix and renewal data
