      - number: '3.5'
        title: Moat Durability and Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              The moat question for TruKKer is therefore about depth rather than breadth. Compared with incumbents,
              TruKKer seems stronger on the digital control layer: freight procurement workflow, carrier-marketplace
              behavior, reverse-load logic, transparent rates, and enterprise command-center positioning. Compared with
              adjacents, it is more purpose-built for road-freight execution rather than wholesale or warehousing. But
              compared with large integrated operators, its public surface appears narrower in customs, cold chain,
              warehousing, parcel, and multimodal bundling. Competitive durability will depend on whether enterprises
              value a specialized road-freight operating system enough to keep it beside broader providers instead of
              consolidating spend into one 3PL. The public record supports a constructive but cautious conclusion:
              TruKKer can defend a differentiated lane in enterprise road freight, but it operates in a field where
              incumbents can bundle more services and where switching costs are meaningful only when workflow,
              compliance, and payment rails become embedded.
