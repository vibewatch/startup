      - number: '2.3'
        title: Buyers, Users, and Vertical Demand
        blocks:
          - type: paragraph
            body: >-
              The buyer map in GCC road freight is more enterprise-procurement led than consumer-delivery led when
              viewed through TruKKer’s positioning. Manufacturing remains the largest end-user category in published GCC
              market data, while wholesale and retail trade is the fastest-growing segment because omnichannel
              fulfillment, dark stores, and cross-border e-commerce push more frequent shipments through the network.
              TruKKer’s own product design aligns with that pattern: Procure Co is targeted at enterprises spending more
              than USD 100,000 per month on freight, while shipper messaging concentrates on FMCG, automotive,
              retail/e-commerce, construction, manufacturing, metals and mining, oil and gas, and petrochemicals. In
              these workflows, the economic buyer is usually procurement or supply-chain leadership, the daily user is
              logistics operations, and the financial approver values settlements, compliance, and working-capital
              efficiency. That matters because the adoption trigger is rarely “we need an app”; it is instead capacity
              certainty, cross-border execution, freight-spend visibility, and faster documentation turnaround in
              complex industrial corridors.
            claimRefs:
              - CM005
              - CM006
              - CM013
              - CM019
              - CM031
              - CM032
              - CM033
