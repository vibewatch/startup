  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              TruKKer sits inside several regulated surfaces at once. Its own legal documents make clear that the
              LoadBoard is a contract-governed operating environment rather than a lightweight lead-generation site:
              users must comply with transport, safety, and labor laws; carriers are expected to maintain permits,
              licenses, and insurance; and disputes are funneled to UAE law and Dubai courts. That is manageable in a
              narrow footprint, but TruKKer publicly markets operations across Saudi Arabia, the UAE, and other GCC
              markets, which means the real compliance workload is multi-jurisdictional. Saudi official material adds
              another layer because the Kingdom explicitly frames road transport around safety, smart integration, and
              logistics-system modernization, while SDAIA’s PDPL imposes controller duties on companies processing data
              about individuals in the Kingdom. For investors, the key issue is not whether regulation matters—it
              obviously does—but whether TruKKer’s internal controls, licensing inventory, and data-governance programs
              are as mature as its commercial footprint suggests.
            claimRefs:
              - CR001
