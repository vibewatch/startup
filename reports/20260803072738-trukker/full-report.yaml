      - number: '8.4'
        title: Final Diligence Asks, Upgrade Triggers, and Thesis-Break Events
        blocks:
          - type: paragraph
            body: >-
              The last step is to translate valuation ambiguity into decision hygiene. The immediate ask list is
              straightforward: audited current revenue, take rate or net-revenue bridge, gross margin, EBITDA or burn,
              AR aging, bad-debt loss rates, covenant headroom, top-customer concentration, and the exact cap-table /
              preference structure. Without those, an investor cannot convert enterprise scale into a reliable return
              model. Upgrade triggers are equally clear: a fresh equity round above the unicorn threshold, credible
              evidence that securitisation and private credit are backed by strong collections rather than hidden
              stress, and better disclosure on retention and concentration. Thesis-break events are also visible. A new
              round or secondary below US$1 billion, unexpected deterioration in receivables quality, or material
              compliance failures would all weaken the case quickly. Because those decision gates are monitorable, the
              recommendation is not a soft shrug; it is a price-sensitive watch posture. TruKKer is investable as a live
              diligence target, but only if the next data room proves more than the current public record can.
