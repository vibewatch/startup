      - number: '8.2'
        title: Comparable Signals and the Anti-Thesis to a Premium Mark
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis to an aggressive private valuation is simple: public markets are not currently generous to
              logistics-tech names without audited, category-leading financial quality. Freightos is the sharpest
              warning sign because it is a listed digital-freight player with active SEC reporting and a public market
              cap of only about US$59 million as of August 2026. That is not a one-for-one TruKKer comparable—Freightos
              is much smaller—but it shows how punishing the market can be when scale, profitability, or investor
              enthusiasm disappoint. At the other end of the spectrum, mature public logistics operators such as GXO,
              XPO, and C.H. Robinson trade in the US$5.8 billion to US$23.5 billion range, but those are heavily
              disclosed, public-company-scale businesses. They are better interpreted as upper-bound public benchmarks
              than direct private-mark substitutes. Together, those signals argue against taking stale private-unicorn
              headlines at face value. TruKKer may be worth more than the public digital-freight floor, but paying as
              though it already deserves mature public logistics status would be unjustified on the current evidence
              set.
            claimRefs:
