  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Freightos
        - Public market cap + active SEC reporting
        - US$59.43M market cap (Aug 2026)
        - Closest public digital-freight pure-play cautionary anchor
        - Much smaller than TruKKer and not a private MENA marketplace
      - - GXO Logistics
        - Public market cap + latest 10-K
        - US$5.77B market cap (Aug 2026)
        - Shows public value attainable for scaled logistics operators
        - Mature contract-logistics business, not a venture-stage freight marketplace
      - - XPO, Inc.
        - Public market cap + latest 10-K
        - US$23.53B market cap; US$27.28B enterprise value (Jul 2026)
        - Upper-end public freight / logistics benchmark
        - Far larger and more disclosed than TruKKer
      - - C.H. Robinson
