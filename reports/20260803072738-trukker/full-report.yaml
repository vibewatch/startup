  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh equity or secondary below unicorn threshold
        - Sub-US$1.0B price discovery
        - Shows the public thesis overstated current equity value
        - Downgrade immediately and re-underwrite from downside case
      - - Receivables or securitisation weakness
        - Loss-rate, delinquency, or covenant stress emerges
        - Undermines the idea that structured finance proves durable quality
        - Reprice for balance-sheet and collections risk
      - - Compliance or operational control failure
        - Material regulator action, outage, or service incident
        - Turns execution risk into direct valuation impairment
        - Pause or walk unless remediation is exceptional
      - - Preference stack turns equity returns unattractive
        - Liquidation preferences or senior claims consume upside
        - Even a strong headline valuation may not convert into investor returns
        - Require revised entry price or pass
    notes: These triggers focus on events that directly convert uncertainty into realized downside for new investors.
    claimRefs:
      - CV025
      - CV026
      - CV031
      - CV035
      - CV038
      - CV040
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current financials
        - Audited revenue, take rate, gross margin, EBITDA / burn
        - Without them, valuation remains threshold- rather than economics-driven
        - Finance diligence and auditor package
      - - Receivables quality
        - AR aging, bad-debt loss rates, covenant headroom, securitisation servicing data
        - Debt-led funding must convert into durable equity value
        - Treasury / lender pack
      - - Customer durability
        - Top-customer concentration, renewal, churn, active-vs-registered definitions
        - Scale without durability can still deserve a discount
        - Revenue operations and customer analytics
      - - Cap table / preferences
        - Preference stack, seniority, dilution terms, convertibles or warrants
        - Entry price is meaningless without understanding payout order
        - Legal and fundraising records
      - - Operational controls
        - License inventory, incident logs, compliance audits, security posture
        - Valuation premium requires confidence that scale is governable
        - COO / compliance / security diligence
    notes: These asks are the minimum pack required to move from a track posture to a priced underwriting recommendation.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV037
      - CV040
      - CV041
      - CV042
