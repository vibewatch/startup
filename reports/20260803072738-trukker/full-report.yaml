      - number: '2.2'
        title: Top-Down Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Published market estimates provide enough evidence for a layered sizing framework even if they do not
              isolate digital road brokerage cleanly. Mordor, ResearchAndMarkets, GII, and MarketResearch all converge
              around a GCC freight-and-logistics market moving from roughly USD 83.24 billion in 2025 to USD 89.32
              billion in 2026 and USD 120.21 billion by 2031, a 6.12% CAGR. Within that stack, freight transport
              represented 52.12% of 2025 revenue and road contributed 39.05% of freight-transport revenue. Applying
              those shares directionally to the 2026 total yields a rough freight-transport proxy of about USD 46.6
              billion and a road-freight proxy of about USD 18.2 billion. That still overstates what a TruKKer-like
              platform can realistically touch, because a meaningful part of road spend is captive, asset-owned, or
              operationally unsuited to platform matching. A second lens comes from Saudi e-commerce logistics, which is
              expected to grow from USD 2.20 billion in 2025 to USD 2.38 billion in 2026 and USD 3.66 billion by 2031.
              That niche is smaller than GCC road freight, but it shows how digitization-rich demand pockets can
              compound faster than the base logistics market.
