company:
  name: TruKKer
chapter:
  number: 1
  title: Company Overview
  summary: TruKKer is a Saudi/UAE-centered digital road-freight marketplace founded in 2016 by Gaurav Biswas and Pradeep Mallavarapu. Public evidence shows clear scale growth from roughly 15,000 trucks and 200 clients in 2019 to 75,000+ trucks and about 1,200 enterprise clients by 2026, but the company still discloses headquarters, headcount, total capital raised, and valuation inconsistently across official and third-party sources.
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: 'TruKKer presents itself as an AI-enabled digital freight marketplace that organizes highly fragmented land freight supply across the Gulf and adjacent corridors. The current official site emphasizes an enterprise freight control layer rather than a simple load board: Procure Co centralizes demand capture, bidding, execution, and payments; the Partner app gives carriers verified loads, reverse trips, multilingual workflows, and milestone-based payouts; and TruKKer Safe digitizes inspection, compliance, and QR-based proof of condition. The economic model remains asset-light. Management repeatedly describes TruKKer as the region’s “Uber for trucks,” with revenue generated from the spread between shipper pricing and vendor cost plus service layers wrapped around execution, visibility, and documentation. Official and independent sources agree that TruKKer does not need to own trucks directly to scale; its value is matching fragmented truck supply to shipper demand, reducing empty miles,
    and making cross-border movements more predictable for large enterprises.'
  claimRefs:
  - CO001
  - CO002
  - CO004
  - CO005
  - CO034
  - CO035
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership-and-geographic-identity
  title: Founders, Leadership, and Geographic Identity
  body: The company’s public narrative consistently centers on founder and CEO Gaurav Biswas, while co-founder and CTO Pradeep Mallavarapu appears in earlier fundraising coverage as the technical architect behind the matching and data platform. A material diligence issue is that TruKKer’s geographic identity is described differently depending on the source. The official contact page lists operational offices in Dubai, Riyadh, Muscat, Amman, Bahrain, Cairo, Istanbul, Almaty, Warsaw, and Bengaluru, while independent databases and news reports alternately call the business Dubai-based, Abu Dhabi-based, Saudi-headquartered, or Saudi-based. That divergence does not invalidate the core business, but it matters for legal domicile, regulatory oversight, labor mix, and IPO preparedness. Leadership depth outside the founders is visible through public references to CFO Amit Agarwal and CDO Muataz Alsafi, yet the board, formal governance structure, and full executive roster remain under-disclosed relative
    to the company’s scale.
  claimRefs:
  - CO002
  - CO003
  - CO006
  - CO007
  - CO008
  - CO014
  - CO016
  tableRefs:
  - TO002
- id: capital-base-and-investor-history
  title: Capital Base and Investor History
  body: 'TruKKer has progressed from early venture rounds into increasingly institutional and structured funding. Menabytes reported a $1.4 million seed round in late 2017 and a $2.7 million pre-Series A in 2018; Wamda then documented a $23 million Series A in 2019 led by STV with IFC, Endeavor Catalyst, MEVP, and existing regional investors. IFC’s project disclosure separately confirms a planned equity investment of up to $3 million. The company then layered in credit: The National referenced a $10 million Partners for Growth facility before TruKKer’s $96 million 2022 Series B mix of equity and debt led by ADQ and STV, with Mubadala participating. Investcorp’s 2022 pre-IPO round added another $100 million, including a $51 million initial close, and management framed the company as a future listing candidate. By 2025-2026, new capital came as Ruya private credit and a $300 million ADCB receivables securitisation, underscoring a shift from pure venture funding toward working-capital and structured-credit
    infrastructure.'
  claimRefs:
