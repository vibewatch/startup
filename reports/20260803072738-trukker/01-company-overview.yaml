- id: milestones-contradictions-and-adverse-signals
  title: Milestones, Contradictions, and Adverse Signals
  body: 'The milestone record is strong enough to reconstruct a credible corporate chronology, but several diligence flags remain. TruKKer has clearly executed major expansion steps: GCC launch, large Series A and B financings, the TruckSher acquisition, a 2022 pre-IPO round, the 2024 Omnilog spinout, the RTA partnership in Dubai, a 2025 Ruya private-credit raise, and the 2026 ADCB securitisation. Yet public disclosures still disagree on total capital raised, headquarters attribution, and current headcount. Adverse 2026 reporting is operational rather than legal: Semafor and AGBI show that the Hormuz crisis strained capacity, lengthened trip times, raised diesel costs, distorted spot pricing, and exposed how even a large digital broker cannot instantly create physical truck supply. Those sources matter because they show TruKKer’s core value proposition works in disruption, but they also prove the model remains exposed to driver shortages, congestion, and regulatory friction at border crossings.
    This chapter therefore establishes TruKKer as scaled and credible, but still disclosure-light.'
