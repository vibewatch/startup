chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports an enterprise security platform with premium functionality, meaningful large-enterprise adoption, and $325M of reported cumulative funding. It does not disclose current revenue, ARR, pricing, gross margin, retention, cash, burn, or runway, so revenue quality and capital adequacy remain data-room questions rather than underwritten conclusions."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing evidence"
    body: >-
      Aqua presents a broad enterprise platform rather than a publicly priced
      point product. Its container-security page describes a premium version of
      the open-source Trivy scanner, while the platform page describes deployment
      across public cloud, private cloud, and disconnected environments and
      support for regulated workloads. Those pages establish plausible commercial
      value pools in scanning, runtime control, compliance, and regulated
      deployment, but they do not establish billing units, contract duration,
      list prices, realized discounts, or services mix. The financial model should
      therefore be treated as enterprise software monetization with unknown
      packaging and economics; per-node, per-workload, usage-based, and multi-year
      assumptions require contracts or management data rather than inference from
      product breadth.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-sales-efficiency-proxies"
    title: "Traction and sales-efficiency proxies"
    body: >-
      The strongest public commercial signals are customer-scale claims, not
      current financial statements. Aqua reported in 2021 that it had doubled
      paying customers and had six customers above $1M of ARR, while its current
      homepage reports more than 40 Fortune 100 customers as of August 2026.
      These disclosures indicate an enterprise buyer base and demonstrate that
      seven-figure accounts existed historically, but they do not reveal current
      consolidated ARR, average contract value, renewal rates, expansion, customer
      concentration, sales-cycle length, or CAC payback. Open-source-to-premium
      conversion is a reasonable diligence hypothesis because the company markets
      premium Trivy functionality, yet the retained evidence supplies no conversion
      rate or channel attribution. Sales efficiency therefore remains unmeasured.
    claimRefs:
      - "CI001"
      - "CI010"
      - "CI011"
      - "CI012"
  - id: "cost-structure-and-capital-adequacy"
    title: "Cost structure and capital adequacy"
    body: >-
      Public records provide scale proxies but no cash bridge. Tracxn reports 469
      employees in August 2026, Aqua's careers page advertises many open positions
      worldwide, and Aqua reports more than 17 patents as of August 2026. Together
      these facts point to a material engineering, research, sales, and support
      organization, but they do not quantify payroll, cloud hosting, support cost,
      professional services, capex, or gross margin. Funding is likewise not cash:
      the 2021 company release reported $265M raised at that time, and Tracxn now
      reports $325M across eight rounds, including $60M in January 2024. Without
      cash balances, debt terms, burn, or working-capital data, neither remaining
      runway nor the next financing trigger can be calculated.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI014"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-adverse-evidence"
    title: "Financial verdict and adverse evidence"
    body: >-
      The public record supports enterprise relevance but not an investable
      financial forecast. The March 2021 round placed the company above a $1B
      valuation; Tracxn reports another $60M Series E financing at a $1B post-money
      valuation in January 2024. These points are financing observations, not
      evidence of revenue growth, profitability, or available cash. The assigned
      adverse legal source records Aqua's voluntary dismissal of a federal case in
      March 2024, but it does not disclose damages, settlement, or legal expense,
      so no quantified liability should be inferred. The underwriting verdict is
      therefore conditional: product breadth and enterprise adoption may support
      recurring revenue quality, while margin path, capital intensity, financing
      dependency, and legal cost remain unverified until primary financial and
      contractual records are reviewed.
    claimRefs:
      - "CI004"
      - "CI007"
      - "CI013"
      - "CI015"
