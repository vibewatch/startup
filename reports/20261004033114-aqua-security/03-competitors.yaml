chapter:
  number: 3
  title: "Competitors"
  summary: "Aqua Security's strongest competitive distinction is inline container runtime enforcement, reinforced by Trivy-led open-source distribution. That position faces pressure from agentless CNAPP platforms, developer-first application-security tools, and new scrutiny after the March 2026 Trivy supply-chain compromise."
sections:
  - id: "competitive-landscape-segmentation"
    title: "Competitive Landscape and Architectural Divergence"
    body: "The cloud-native security landscape has fractured into distinct architectural archetypes rather than a homogeneous competitive field. Snyk anchors developer-first pre-deployment security across IDEs, pull requests, and software composition analysis, commanding over 4,500 organizational customers and 400,000 developers. Conversely, Wiz leads agentless cloud security posture management and side-scanning breadth across multi-cloud infrastructure, capturing an estimated 12.5% CNAPP mindshare on PeerSpot compared to Aqua's 3.0%. Aqua Security concentrates its primary defensibility on enterprise container runtime security, eBPF-based inline workload monitoring via Tracee, and policy-based Kubernetes admission control. While developer-focused platforms shift security left and agentless platforms optimize for rapid asset discovery, Aqua focuses on day-two runtime enforcement for regulated production environments running Kubernetes at scale."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "peer-profiles-and-capability-matrix"
    title: "Peer Profiles, Capabilities, and Feature Tradeoffs"
    body: "Evaluating alternatives against Aqua Security reveals substantial architectural and functional tradeoffs across core buying criteria. Snyk provides static application security testing (SAST) and developer workflow gating, but the allocated comparison says it lacks in-container runtime protection and Kubernetes pod admission enforcement. Sysdig Secure shares Aqua's eBPF runtime heritage through Falco and emphasizes cloud detection and response (CDR), while PeerSpot reports 3.3% mindshare for Sysdig Monitor in container monitoring. Safeguard's competitor-authored comparison focuses on build provenance, attestations, and build-time software bills of materials (SBOMs), contrasting with Aqua's runtime center of gravity; it is useful for product positioning but is not an independent benchmark. AppSec Santa reports that Aqua holds FedRAMP High authorization, SOC 2 Type II, and ISO 27001 certification, while also noting that agent-based deployment requires DaemonSet privileges that some platform teams resist."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
    tableRefs:
      - "TP002"
  - id: "commercial-packaging-and-procurement"
    title: "Pricing Models, Packaging, and Enterprise Total Cost of Ownership"
    body: "Commercial models across CNAPP and application security create different entry points. A 2026 comparison lists Snyk's Team plan at $25 per developer per month, whereas Aqua publishes no standard price list. The same comparison estimates Aqua entry deployments at $25,000-$40,000 annually and says pricing commonly scales by nodes or workloads; these are third-party estimates, not disclosed Aqua contracts or realized revenue. RFP.wiki separately identifies per-cluster or per-node charges, add-on modules, professional services, and renewal uplifts as category-level procurement watchouts, but its generic checklist does not establish Aqua's actual terms. Trivy provides a no-cost open-source scanning entry point, while centralized policy, runtime enforcement, and audit reporting are commercial-platform value propositions whose realized pricing remains a diligence gap."
    claimRefs:
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
    tableRefs:
      - "TP003"
  - id: "moat-durability-and-supply-chain-risk"
    title: "Moat Durability, Displacement Hazards, and Supply Chain Risk"
    body: "Aqua's competitive moat is anchored by open-source stewardship: AppSec Santa reports 36,500 GitHub stars for Trivy and material adoption for kube-bench, kube-hunter, and Tracee. The same profile repeats Aqua's claim of more than 500 enterprise customers but explicitly labels that count vendor-published rather than independently verified. The distribution flywheel suffered an adverse event in March 2026 when TeamPCP exploited a GitHub Actions misconfiguration and malicious Trivy v0.69.4 artifacts and action tags were distributed. The allocated sources establish the compromise and secret-exposure mechanism, but not a verified victim denominator: Cybersecurity Times alleges exposure across thousands of organizations, while BreachHistory says no attested victim count had been published. The incident increases diligence pressure on Aqua's build controls and gives supply-chain-focused competitors a concrete challenge to its open-source-led trust advantage."
    claimRefs:
      - "CP014"
      - "CP015"
      - "CP016"
