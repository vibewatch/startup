callouts:
  - calloutType: "insight"
    title: "Runtime Enforcement vs. Agentless Convenience"
    body: "The core commercial battleground for Aqua Security is the tension between agentless visibility and inline runtime enforcement. Platforms like Wiz have expanded rapidly by offering agentless API side-scanning that deploys across multi-cloud environments in hours without host privileges. While Aqua provides agentless inventory scanning, its technical differentiation relies on kernel-level DaemonSets and Tracee eBPF agents to actively block unauthorized process execution and fileless exploits in real time. Organizations prioritizing deep compliance and runtime defense choose Aqua, whereas teams prioritizing frictionless onboarding often lean toward agentless alternatives."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP008"
  - calloutType: "risk"
    title: "Ecosystem Repercussions of the 2026 Trivy Supply Chain Attack"
    body: "The March 2026 compromise of Trivy v0.69.4 by TeamPCP highlights the strategic risk attached to an open-source product-led motion in cybersecurity. The sources agree that malicious artifacts and action tags exposed pipeline credentials, but disagree on scope: Cybersecurity Times alleges exposure across thousands of organizations, while BreachHistory says no attested victim count had been published. The event gives build-time supply-chain competitors a concrete trust objection, but the allocated evidence does not quantify customer losses or commercial impact."
    claimRefs:
      - "CP015"
      - "CP016"
