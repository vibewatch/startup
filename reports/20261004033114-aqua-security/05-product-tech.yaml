schemaVersion: "report-v2"
artifact: product-tech
slug: aqua-security
runDate: 2026-10-04
company:
  name: Aqua Security
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Aqua presents a cloud-native security platform that joins build-time scanning and
    policy gates to workload-local runtime enforcement, with partner documentation
    supporting deployability on Amazon EKS and log ingestion into Google SecOps.
    The public evidence is detailed enough to map components and workflows, but
    independent performance, reliability, certification, and product-roadmap proof
    remains unavailable in the assigned source set.
sections:
  - id: product-workflow-and-maturity
    title: Product workflow and maturity
    body: >-
      Aqua's public product surface is organized around a development-to-production
      control loop rather than a single scanner. The container-security page describes
      image analysis for vulnerabilities, malware, secrets, misconfiguration, and
      open-source risk; it then adds sandbox analysis, deployment acceptance policies,
      runtime controls, and compliance reporting. The homepage extends that workflow
      with behavior-informed prioritization and local enforcement, while describing
      Secure AI as generally available. These are company claims, not independent
      efficacy findings. The strongest external deployment evidence is narrower and
      older: AWS's 2020 implementation guide documents the console, gateway, database,
      scanner, and node-level enforcers on Amazon EKS. Consequently, the module map
      distinguishes marketed availability from demonstrated architecture and leaves
      accuracy, overhead, and uptime as diligence gaps.
    claimRefs: [CE001, CE002, CE006, CE007, CE008, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-deployment-and-integration
    title: Architecture, deployment, and integration
    body: >-
      The available materials indicate a hybrid architecture built to place enforcement
      near protected workloads while centralizing policy, audit, and management. AWS
      documents Aqua Enforcers as Kubernetes DaemonSets on worker nodes, communicating
      through a gateway to a console backed by PostgreSQL; Aqua's current engineering
      repost separately describes a multi-component management console using Go,
      SQL-backed processing, REST APIs, Vue.js, containers, and both on-premises and
      SaaS components. Google Cloud documents a webhook path that normalizes Aqua
      events into its Unified Data Model, demonstrating one operational integration
      rather than broad interoperability. The sources support the component boundaries,
      but they do not establish current scale limits, upgrade behavior, availability
      targets, or cross-version support. The architecture should therefore be tested
      under representative customer topology before underwriting its operational
      simplicity.
    claimRefs: [CE008, CE009, CE010, CE011, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-trust-and-roadmap-risk
    title: Differentiation, trust, and roadmap risk
    body: >-
      Aqua's asserted differentiation is runtime context and enforcement: prioritize
      exposure using observed workload behavior, block actions locally, and apply
      compensating controls without waiting for a patch. Its current homepage reports
      more than 17 patents, more than 577,000 blocked runtime threats across 146
      production environments, and adoption by more than 40% of the Fortune 100, all
      expressly labeled as company-reported metrics as of August 2026. Secure AI adds
      model inventory, policy enforcement, prompt inspection, and production response,
      while an AI-architecture hiring repost indicates continued investment across
      SaaS and on-premises delivery. None of the assigned evidence independently
      verifies those metrics, detection quality, false-positive rates, latency,
      certifications, incident history, or GA feature completeness. The product thesis
      is plausible and technically specific, but trust and maturity should remain
      conditional on customer telemetry, security attestations, and roadmap readback.
    claimRefs: [CE003, CE004, CE005, CE012, CE013, CE015]
callouts:
  - calloutType: strength
    title: Workload-local enforcement is the clearest architectural distinction
    body: >-
      AWS's deployment guide places enforcers on each managed EKS worker node, while
      Aqua says its agent-based controls can operate in disconnected or air-gapped
      environments. That combination supports a control-plane plus local-enforcement
      model, although only the AWS configuration is externally documented here.
    claimRefs: [CE002, CE009]
  - calloutType: risk
    title: Public evidence describes capability, not measured efficacy
    body: >-
      No retained source provides independent detection accuracy, false-positive rate,
      runtime overhead, service availability, recovery performance, or certification
      scope. Technical diligence should treat these as open acceptance criteria rather
      than infer them from product breadth or company-reported adoption.
    claimRefs: [CE004, CE005, CE013]
tables:
  - id: TE001
    title: Product module and maturity matrix
    columns:
      - Module or product line
      - Primary user
      - Public status and evidence
      - Asserted differentiation
      - Diligence gap
    rows:
      - - Image and artifact risk analysis
        - Application security and DevSecOps teams
        - Marketed as available; product page describes vulnerability, malware, secret, misconfiguration, and open-source checks
        - Contextual prioritization plus Trivy-based scanning
        - No independent accuracy, coverage, or scan-time benchmark in the assigned evidence
      - - Dynamic threat analysis and deployment assurance
        - Security engineering and release teams
        - Marketed as available; container page describes sandbox execution and policy gates
        - Tests behavior before production and blocks unapproved images
        - No false-positive rate, evasion test, or policy-override data
      - - Runtime detection, response, and compensating controls
        - Cloud security operations
        - Current company product claim; historical AWS guide documents node-level enforcers
        - Workload-local controls informed by observed behavior
        - Current overhead, platform coverage, and disconnected-mode test results are undisclosed
      - - Secure AI
        - AI platform, security, and governance teams
        - Company labels the product generally available in 2026
        - Model governance, prompt inspection, and runtime response in one control model
        - GA scope, model coverage, evaluation quality, pricing, and production references are not independently verified
    notes: >-
      Status is based on current Aqua product pages and assigned partner documentation;
      marketed availability is not an independent maturity or efficacy assessment.
    claimRefs: [CE002, CE006, CE007, CE008, CE013]
  - id: TE002
    title: Workflow and use-case map
    columns:
      - User job
      - Existing workflow problem
      - Aqua-supported step
      - Publicly stated benefit
      - Limitation of evidence
    rows:
      - - Triage image risk before release
        - Long undifferentiated vulnerability and configuration queues
        - Scan artifacts and prioritize by exploitability, severity, and running-workload context
        - Focus remediation on exposed risk
        - No independent precision, recall, or time-saved result
      - - Prevent risky deployment
        - Unapproved or malicious images can advance through delivery pipelines
        - Apply assurance policies and sandbox suspicious images
        - Block threats and rogue images before production
        - No public bypass rate or representative adversarial benchmark
      - - Enforce runtime policy
        - Production exploitation can outpace patch cycles
        - Place enforcers near workloads and apply runtime or network controls
        - Local action and compensating protection without waiting for a patch
        - AWS evidence is from 2020 and does not establish current performance
      - - Route findings into security operations
        - Product-specific events require normalization for investigation
        - Send image-scan results by authenticated webhook to Google SecOps UDM
        - Standardized event fields and security context
        - One documented integration does not establish breadth or maintenance quality
    notes: >-
      Benefits are vendor or partner descriptions; the table preserves missing
      denominators and does not convert workflow claims into measured outcomes.
    claimRefs: [CE002, CE006, CE007, CE009, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Documented dependency
      - Principal technical risk
    rows:
      - - Management console
        - Policy definition, audit review, status, APIs, user interface, and background processing
        - SQL data stores, REST APIs, web UI, and distributed services
        - Backward compatibility, data growth, and control-plane availability are not quantified
      - - Scanner and analysis services
        - Static image analysis, sandbox analysis, and prioritized findings
        - Artifact access, vulnerability intelligence, policies, and compute capacity
        - Detection coverage and resource consumption lack independent benchmarks
      - - Gateway and workload enforcers
        - Aggregate security data and apply policy near running workloads
        - Cluster connectivity, node-level deployment, and policy synchronization
        - Upgrade safety, disconnected-state reconciliation, and runtime overhead are undisclosed
      - - SIEM integration surface
        - Export Aqua events for normalized security operations analysis
        - Authenticated webhook, Google SecOps feed, and parser mappings
        - Parser compatibility and event-delivery service levels are not stated
    notes: >-
      The AWS topology is a historical 2020 deployment example; the current stack signal
      comes from company-issued 2026 job reposts and should be confirmed in architecture diligence.
    claimRefs: [CE008, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Product architecture and control loop
    type: stack
    summary: >-
      Public evidence supports a six-layer path from development inputs through
      centralized policy and workload-local enforcement to security-operations output.
    data:
      layers:
        - label: Development and delivery inputs
          detail: CI/CD pipelines, registries, images, and application artifacts enter the security workflow.
        - label: Static and dynamic analysis
          detail: Image scanning and sandbox execution identify vulnerabilities, malware, secrets, and behavior risk.
        - label: Policy and management plane
          detail: The console defines controls, processes background work, exposes APIs, and stores policy and audit data.
        - label: Gateway and distribution
          detail: The gateway aggregates security data and connects centralized management to protected environments.
        - label: Workload-local enforcement
          detail: Node-level enforcers observe workloads and apply container, host, and network policies.
        - label: Security operations outputs
          detail: Findings and events can be normalized into Google SecOps through an authenticated webhook feed.
    approximationNotes: >-
      This is a synthesized logical stack, not a representation of network placement or
      current service boundaries; AWS topology evidence is historical and Google documents one integration.
    claimRefs: [CE001, CE008, CE009, CE010, CE011, CE014]
