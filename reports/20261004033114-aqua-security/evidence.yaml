    whyItMatters: >-
      Stand-alone CNAPP vendors face intense margin pressure from hyperscalers and consolidated suites like Palo Alto
      Networks and Wiz; without audited burn metrics, cash runway cannot be confirmed.
    diligencePath: Request audited financial statements, board decks, and cohort retention tables during formal investor diligence.
    relatedQuestionRefs:
      - QR005
  - type: private-evidence-only
    severity: material
    topic: operating-financials
    missingEvidence: Audited financial statements detailing ARR, revenue growth rate, gross margin, operating loss, and cash burn rate.
