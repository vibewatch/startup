    severity: minor
    topic: deployment-architecture
    missingEvidence: A current independently authored deployment reference replacing the 2020 AWS EKS implementation topology.
    whyItMatters: >-
      The documented component relationships may not reflect the current platform, supported installation modes, or
      upgrade process.
    diligencePath: >-
