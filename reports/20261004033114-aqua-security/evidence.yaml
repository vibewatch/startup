evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements, ARR, gross margin, net revenue retention (NRR), and cash burn figures.
    whyItMatters: >-
      Essential to assess current financial viability, capital efficiency, and growth trajectory following late-stage
      funding extensions.
    diligencePath: >-
      Request confidential management accounts, subscription cohort ARR schedules, and audited financial statements
      under NDA.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capitalization-terms
    missingEvidence: Complete cap table detailing liquidation preference stack, senior liquidation multiples, and option pool sizing.
    whyItMatters: Determines common shareholder dilution, downside protection hurdles, and economic returns in M&A or IPO scenarios.
    diligencePath: Obtain official stock ledger and Series E/Extension certificate of incorporation from company legal counsel.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: global-headcount
    missingEvidence: Comprehensive global employee headcount across US, Israel, and international subsidiaries.
    whyItMatters: Enables productivity analysis (revenue per FTE) and evaluation of organizational sizing post-restructuring.
    diligencePath: Verify HR census data and active payroll counts during management diligence sessions.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance-enumeration
    missingEvidence: >-
      Complete unredacted roster of corporate officers, board directors, and advisory board members across global
      operating entities.
    whyItMatters: >-
      Validates corporate governance oversight, fiduciary independence, and key-person coverage across international
      legal entities.
    diligencePath: >-
      Review full statutory registers of directors and board committee composition minutes from corporate secretarial
      files.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent CNAPP, container-security, or runtime-security market estimate with geography, period, inclusions,
      exclusions, and transparent methodology.
    whyItMatters: >-
      Without a comparable market denominator, public company-scale signals cannot establish TAM, SAM, SOM, penetration,
      or valuation headroom.
    diligencePath: >-
      Obtain current analyst market models and reconcile their category definitions against Aqua's product modules and
      target geographies.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-gap
    missingEvidence: >-
      Contract-level evidence identifying economic buyers, budget owners, procurement thresholds, sales-cycle length,
      and open-source-to-paid conversion by segment.
    whyItMatters: >-
      User interest and repository popularity do not establish willingness to pay, sales efficiency, or a serviceable
      obtainable market.
    diligencePath: >-
      Review anonymized CRM opportunity data, win-loss records, contracts, and customer interviews segmented by buyer
      role and acquisition channel.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: revenue-estimate
    missingEvidence: >-
      Audited revenue and ARR schedules that reconcile GetLatka's page title with body text describing estimated annual
      revenue.
    whyItMatters: >-
      Revenue and ARR have different recognition and valuation implications, so the public estimate cannot safely be
      used as an ARR multiple denominator.
    diligencePath: >-
      Request audited financial statements and an ARR bridge defining contracted recurring revenue, recognized revenue,
      churn, and expansion.
  - type: private-evidence-only
    severity: material
    topic: pricing-models
    missingEvidence: >-
      Audited enterprise discount schedules, average contract values (ACV), and realized per-node pricing tiers for Aqua
      Security.
    whyItMatters: >-
      Without private contract disclosures, the third-party $25,000-$40,000 entry estimate cannot establish realized
      enterprise economics.
    diligencePath: >-
      Request anonymized enterprise customer contract schedules and net retention metrics across node tiers during
      formal diligence.
    relatedQuestionRefs:
      - QP002
  - type: missing-source
    severity: minor
    topic: competitive-win-loss
    missingEvidence: Direct enterprise win/loss telemetry between Aqua Security and Wiz in greenfield multi-cloud procurement cycles.
    whyItMatters: >-
      Determines whether agentless convenience consistently displaces runtime protection in mid-market versus large
      enterprise segments.
    diligencePath: Interview enterprise CISOs who evaluated both Aqua Security and Wiz within the past 12 months.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: competitor-scale-and-funding
    missingEvidence: Comparable current funding, revenue, and customer-scale evidence for Aqua, Snyk, Wiz, Sysdig, and Safeguard.
    whyItMatters: >-
      The assigned pool supports positioning and selected adoption signals but cannot establish financial scale or
      endurance across the shortlist.
    diligencePath: >-
      Collect current company filings, financing announcements, and independently corroborated customer metrics for each
      shortlisted vendor.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: Audited revenue, ARR, gross margin, retention, cash, burn, runway, debt, and working-capital records.
    whyItMatters: >-
      These records are necessary to judge revenue quality, operating leverage, liquidity, financing dependency, and
      capital intensity.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, ARR and cohort bridges, cash forecasts, debt schedules,
      and board-approved operating plans.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI009
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Price books, billing metrics, signed customer contracts, discount history, term distribution, and services mix.
    whyItMatters: >-
      Without realized pricing and contract structure, expansion behavior, revenue recognition, pricing power, and
      gross-margin resilience cannot be tested.
    diligencePath: >-
      Review current SKU schedules and anonymized contracts, then reconcile bookings, billings, revenue, deferred
      revenue, discounts, and renewals by cohort.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: Free-to-paid conversion, channel-sourced pipeline, sales-cycle cohorts, CAC, and CAC payback.
    whyItMatters: >-
      Public product adoption and customer logos do not establish efficient acquisition or repeatable enterprise
      conversion.
    diligencePath: >-
      Obtain funnel, pipeline, win-rate, sales-cycle, new-logo ARR, sales-and-marketing spend, and attribution data by
      channel.
    relatedQuestionRefs:
      - QI003
  - type: missing-source
    severity: minor
    topic: legal-cost-gap
    missingEvidence: Any settlement, damages, insurance recovery, or legal-expense impact associated with the dismissed federal case.
    whyItMatters: The docket proves legal activity but does not support a quantified liability or cost adjustment.
    diligencePath: Request the legal matters schedule, outside-counsel spend, settlement records, and insurance correspondence.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: product-performance
    missingEvidence: >-
      Independent current benchmarks for detection accuracy, false positives, analysis latency, runtime overhead,
      uptime, and recovery behavior.
    whyItMatters: Product breadth does not establish efficacy or operating cost in representative customer environments.
    diligencePath: >-
      Obtain recent benchmark reports, service-level history, incident summaries, and three customer telemetry exports
      under representative workload profiles.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: product-assurance
    missingEvidence: >-
      Current certification scope, penetration-test results, secure-development controls, vulnerability-disclosure
      metrics, and material incident history.
    whyItMatters: >-
      A security-control vendor requires stronger trust evidence than product-page assertions and integration
      documentation provide.
    diligencePath: >-
      Review the trust-center package, current SOC 2 report, penetration-test remediation log, disclosure policy, and
      board-level incident register.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: missing-source
    severity: material
    topic: ai-roadmap
    missingEvidence: >-
      Feature-level GA scope, supported models and environments, evaluation results, pricing, adoption, and production
