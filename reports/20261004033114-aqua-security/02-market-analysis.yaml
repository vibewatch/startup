runDate: "2026-10-04"
company:
  name: "Aqua Security"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Aqua addresses a broad cloud-native security boundary spanning build-time scanning, container and Kubernetes controls, and runtime enforcement, with open-source distribution and Fortune 100 penetration providing adoption signals. The retained evidence does not support a numeric TAM, SAM, or SOM; the strongest public scale proxies are company-reported enterprise penetration, developer activity, and a low-confidence third-party annual-revenue estimate, while the 2026 Trivy compromise is a material trust constraint."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      Aqua's evidenced market boundary begins with cloud-native application and workload
      security rather than the whole cybersecurity budget. Its public materials span
      clouds, CI/CD pipelines, registries, containers, serverless platforms, orchestration,
      and security tooling, while the container product combines pre-production image
      analysis with production runtime controls. Included spend therefore covers image
      vulnerability and malware scanning, secret and misconfiguration detection, policy
      gates, workload monitoring, and runtime enforcement across hybrid and multi-cloud
      environments. Broad identity, endpoint, network, and general-purpose observability
      spend is excluded from this evidence-constrained boundary. Status-quo substitutes
      include stand-alone scanning, free developer tooling such as Trivy, manual
      remediation, and fragmented point products; the retained sources do not establish
      their relative spend or market shares.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Sizing Lenses and Evidence Limits"
    body: >-
      No successful source allocated to this chapter provides an independent, methodology-
      transparent estimate of the relevant CNAPP, container-security, or runtime-security
      market. A numeric TAM, SAM, or SOM would therefore create false precision. The
      available evidence instead supports three company-scale lenses. Aqua reports that
      more than 40% of the Fortune 100 trust its platform and separately dates a count of
      more than 40 Fortune 100 customers to August 2026. GitHub shows substantial activity
      around Trivy and adjacent Aqua projects, indicating developer reach but not paid
      conversion. GetLatka estimates $89.9 million of 2024 annual revenue versus $56.3
      million in 2023; its page does not disclose an auditable methodology, and its title's
      ARR wording should not override body text that labels the metric annual revenue.
      These are penetration and company-scale proxies, not measures of addressable market.
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Users, Adoption Path, and Expansion Drivers"
    body: >-
      The product evidence identifies security teams, application and platform security
      practitioners, and developers as users across an adoption path that can begin with
      repository or image scanning and extend into production workload control. CI/CD,
      registries, Kubernetes, serverless, SIEM, and analytics integrations place the
      product inside both development and security operations. Aqua's risk prioritization
      based on live workload behavior addresses alert overload, while local enforcement
      in disconnected or air-gapped environments broadens applicability to operationally
      constrained buyers. The company's August 2026 launch language for generally available
      AI runtime controls adds an adjacency around model behavior, prompt inspection, and
      AI usage policy. Public materials do not identify the contractual payer, budget
      owner, procurement thresholds, or conversion rate from open-source use to commercial
      deployments, so those fields remain explicit diligence gaps.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM008"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "constraints-and-geography"
    title: "Adoption Constraints, Trust, and Geographic Reach"
    body: >-
      Aqua maintains a visible operating footprint in the United States, Israel, India,
      and Singapore and advertises worldwide hiring, which is consistent with serving
      distributed enterprise deployments but does not quantify regional revenue or demand.
      The more consequential adoption constraint is trust. Cybersecurity Times reported
      that attackers force-pushed 75 of 76 trivy-action tags and all seven setup-trivy tags,
      then distributed a poisoned Trivy v0.69.4 binary through multiple channels before
      removal roughly three hours later. The same report relayed Aqua's statement that its
      commercial platform was isolated and unaffected; that is company attribution, not
      independent verification. BreachHistory records one Aqua-linked incident and notes
      that no attested victim count was published. Buyers must therefore weigh open-source
      reach against software-supply-chain governance, credential-rotation cost, and the
      unresolved blast radius rather than treating reach as frictionless acquisition.
    claimRefs:
      - "CM009"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
