      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 资本配置总结：维持“观察”立场
            body: >-
              Aqua Security 具备真实的企业客户落地验证——凭借 17 项专利为超过 40 家 Fortune 100 企业提供安全防护，但也伴随着显著的非上市企业风险，包括自 2021
              年以来公开估值长期走平，以及开源供应链风险严重暴露。在通过保密协议核实经审计的单元经济模型、ARR 增速及清晰的股权结构表之前，成长股权投资者应避免按 $1.0B 投后估值或接近该估值出价 [CV004,
              CV005, CV009, CV014]。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV009
              - CV014
          - type: callout
            title: 估值悬顶与优先股堆叠动态
            body: >-
              Aqua 在 2021 年 3 月 Series E 轮与 2024 年 1 月追加轮之间，估值始终持平于 $1.0B，表明后期投资方要求结构性下行保护以度过融资周期。鉴于累计融资约
              $325M，普通股股东与员工期权池在获得正向股权回报前，面临极高的清算优先权偿付门槛 [CV005, CV007, CV010]。
            calloutType: risk
