  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构分歧
        blocks:
          - type: paragraph
            body: >-
              云原生安全格局已分化为截然不同的架构流派，而非同质化的竞争市场。Snyk 凭借对 IDE、代码拉取请求（PR）和软件成分分析（SCA）的覆盖，确立了开发者优先的预部署安全定位，拥有超过 4,500 家企业客户与
              400,000 名开发者。相反，Wiz 在多云基础设施中引领无代理云安全姿态管理与旁路扫描，在 PeerSpot 上占据估计 12.5% 的 CNAPP 用户心智份额，相比之下 Aqua 为 3.0%。Aqua
              Security 将核心护城河押在企业级容器运行时安全、基于 Tracee 的 eBPF 内联工作负载监控以及基于策略的 Kubernetes
              准入控制上。当以开发者为中心的平台强调安全“左移”、无代理平台专注于快速资产发现时，Aqua 则深耕规模化运行 Kubernetes 的受监管生产环境第二阶段（Day-2）运行时阻断。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
