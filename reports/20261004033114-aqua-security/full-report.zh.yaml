      - number: '1.5'
        title: 展件
        blocks:
          - type: callout
            title: 开源供应链攻击加剧治理审视
            body: >-
              2026 年 3 月 TeamPCP 对 Trivy 发起的供应链攻击，暴露了开源开发者工作流中严重的运营敞口 [CO010, CO011]。攻击者利用 GitHub Actions 工作流缺陷窃取 CI/CD
              凭据，并投毒官方发布标签 [CO011]。尽管 Aqua 的商业平台保持了架构隔离，客户尽调仍须重点评估其内部软件供应链控制与开发者凭据治理机制 [CO011]。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
          - type: callout
            title: 运行时阻断让 Aqua 与纯可观测性 CNAPP 形成区隔
            body: >-
              Aqua 明确将其定位转向运行时暴露面管理，主张仅靠部署前扫描（“左移”）无法阻止正在发生的活跃攻击利用 [CO006, CO008]。凭借专利 vShield 技术以及在 146 个受监控生产环境中基于
              Agent 的本地阻断，Aqua 与无代理（agentless）扫描竞品拉开了差距，但也带来了更高的部署运维开销 [CO006, CO008]。
            calloutType: insight
            claimRefs:
              - CO006
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              有证据支持的 Aqua 市场边界始于云原生应用与工作负载安全，而非全部网络安全预算。其公开材料涵盖多云、CI/CD
              流水线、镜像仓库、容器、无服务器平台、容器编排及安全工具链，容器产品则兼具投产前镜像分析与生产环境运行时控制。因此，纳入统计的支出包括混合云与多云环境下的镜像漏洞及恶意软件扫描、凭据与配置漂移检测、策略准入关卡、工作负载监控及运行时阻断。广泛的身份认证、端点安全、网络安全和通用可观测性支出均排除在这一受限边界之外。现有替代方案包括单点独立扫描工具、以
              Trivy 为代表的免费开发者工具、人工修复以及碎片化的单点产品；现有材料无法确定各方案的相对支出规模或市场份额。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
