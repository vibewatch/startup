  - id: FP001
    title: 云原生安全架构定位图
    type: quadrant
    summary: 横跨部署前开发者集成度与运行时及基础设施阻断深度，评估各云原生安全方案的架构定位。
    data:
      xAxis:
        label: 部署前开发者集成度
        min: 0
        max: 10
        low: 开发者工作流集成相关的支撑证据有限
        high: IDE、PR 或构建流水线集成相关的支撑证据充分
        scale: Analyst-authored ordinal score
      yAxis:
        label: 运行时与基础设施阻断深度
        min: 0
        max: 10
        low: 活跃工作负载阻断相关的支撑证据有限
        high: 运行时或基础设施阻断相关的支撑证据充分
        scale: Analyst-authored ordinal score
      points:
        - label: Snyk
          x: 9
          'y': 2
          detail: 以开发者为中心的 IDE 与 PR 工作流；对照证据显示其缺乏运行时阻断能力。
        - label: Aqua Security
          x: 5
          'y': 9
          detail: 具备 CI/CD 与镜像管控以及内联运行时阻断；开发者中心属性弱于 Snyk。
        - label: Sysdig Secure
          x: 4
          'y': 8
          detail: 基于 Falco 的运行时定位证据充分；开发者集成方面的公开记载仍显不足。
        - label: Wiz
          x: 4
          'y': 5
          detail: 无 Agent 云端覆盖证据充分；容器内阻断能力则未见证据。
        - label: Safeguard
          x: 8
          'y': 3
          detail: 竞品发布的证据强调构建期门禁与代码溯源，而非运行时防护。
        - label: 现状（云原生 DIY）
          x: 3
          'y': 4
          detail: 内部自建的分析基准线；实际表现取决于采购方所选工具。
    approximationNotes: 坐标为分析师编写的序数评分，非市场基准或实测性能指标。坐标仅概括了开发者集成与运行时阻断两方面的归属证据；未经验证的能力会相应降低置信度。
