      - number: '1.4'
        title: 业务演进、产品创新与安全事件历史
        blocks:
          - type: paragraph
            body: >-
              Aqua Security 的演进轨迹始于最初的容器运行时隔离，后拓展为集成了 vShield 运行时虚拟补丁等功能的完整云原生应用保护套件 [CO001, CO006]。在扩大企业级版图期间，公司于 2026
              年 3 月遭遇了严重的供应链安全危机：威胁行为体 TeamPCP 利用 GitHub Actions CI/CD 工作流漏洞（apidiff.yaml），攻陷了开源 Trivy 漏洞扫描器生态 [CO010,
              CO011]。攻击者利用失窃的服务账户（aqua-bot），向 aquasecurity/trivy-action 的 76 个发布标签中的 75 个强行推送恶意信息窃取代码，并发布带毒的 Trivy
              v0.69.4 二进制文件，直到约 3 小时后漏洞才被修复 [CO011]。独立威胁遥测证实，虽然 Aqua 的商业平台运行在架构隔离的基础设施上避开了直接攻击，但开源侧遭到入侵，导致下游用户的 CI/CD
              凭据泄露，并使 44 个内部代码库遭到临时篡改 [CO010, CO011]。这一事件促使 Aqua 进一步强化运行时遏制能力宣传，并着手规范合作伙伴保障计划 [CO006, CO008, CO011]。
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO011
