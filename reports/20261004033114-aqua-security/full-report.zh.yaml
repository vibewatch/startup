      - number: '3.3'
        title: 定价模式、产品打包与企业总体拥有成本
        blocks:
          - type: paragraph
            body: >-
              CNAPP 与应用安全领域的商业模式切入点各不相同。一份 2026 年的对比显示，Snyk 的 Team 方案定价为每位开发者每月 $25，而 Aqua 并未公布官方标准价目表。该对比估计 Aqua
              入门级部署年费在 $25,000-$40,000 之间，并指出其定价通常按节点或工作负载规模阶梯计费；这些均为第三方估计，并非 Aqua 披露的实际合同金额或确认收入。RFP.wiki
              另外列出了按集群或按节点收费、附加模块、专业服务和续约涨价等行业采购风险点，但其通用核对清单无法反映 Aqua 的真实条款。Trivy
              提供了零成本的开源扫描切入点，而统一策略、运行时阻断与审计报告属于商业平台的核心价值主张，其实际成交价格仍是尽调缺口。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
