              轮融资推进过程中，迅速斩获了全球 1000 强企业的早期订单，包括全球前十大金融服务公司中的两家和前十大软件公司中的三家。截至 2026 年，公司披露其产品已被全球超过 500 家企业采用，在 Fortune
              100 中的渗透率经独立画像分析核实超过 40%。有据可查的企业客户及标杆部署案例涵盖 PayPal、Netflix、Samsung、Audi、Alma 等知名跨国品牌，以及一家在 Azure 和 AWS
              工作负载上部署容器安全的美国联邦民事机构。在生产环境中的采纳主要集中于利用 eBPF 探针进行内联运行时阻断、细粒度基于角色的访问控制（RBAC）、自动化 CI/CD 流水线集成，以及通过 Microsoft
              Teams 发送自动化告警通知，从而助力大型组织在数以千计的生产工作负载中维持最小权限访问。
