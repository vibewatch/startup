  - id: FO001
    title: Aqua Security 公司、融资与运营里程碑时间线
    type: timeline
    summary: 梳理公司创立、风险投资、开源发布、合作伙伴计划及供应链事件等关键演进里程碑。
    data:
      items:
        - label: 公司创立
          detail: Dror Davidoff 与 Amir Jerbi 于 2015 年创立 Aqua Security，开拓容器安全领域。
          tone: positive
        - label: 成立印度子公司
          detail: 2019 年 6 月 7 日注册成立 Aqua Security Software India Pvt Ltd，在班加罗尔建立工程研发中心。
          tone: neutral
        - label: Series E 轮独角兽融资
          detail: 2021 年 3 月完成由 ION Crossover Partners 领投的 $135M Series E 轮融资，投后估值达 $1.0B。
          tone: positive
        - label: Series E 轮扩展融资
          detail: 2024 年 1 月获得 $60M 扩展轮融资，守住 $1B 估值上限并延长现金跑道。
          tone: neutral
        - label: 推出 Trivy Partner Connect
          detail: 2025 年 7 月推出 Trivy Partner Connect，推进与 Echo 及 Minimus 的开源集成商业化。
          tone: positive
        - label: 管理层与运营重组
          detail: 2026 年 2 月宣布以客户为中心的精细化运营模式，加速消除运行时风险。
          tone: neutral
        - label: Trivy 供应链失陷
          detail: 黑客组织 TeamPCP 于 2026 年 3 月入侵 GitHub Actions 工作流，发布含有信息窃取后门的恶意 Trivy v0.69.4 二进制文件。
          tone: critical
        - label: 聚焦企业级运行时与 GA 正式版发布
          detail: 2026 年拓展具备专利的 vShield 与 Secure AI 运行时防护能力，保护 146 个企业生产环境。
          tone: positive
    approximationNotes: 时间线事件摘自官方公告、监管申报文件及已归档的安全事件披露材料。
