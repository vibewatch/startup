      - number: '2.4'
        title: 采纳阻力、信任问题与业务地域分布
        blocks:
          - type: paragraph
            body: >-
              Aqua 在美国、以色列、印度和新加坡设有清晰的运营网点，并开展全球招聘，这符合其服务分布式大型企业部署的定位，但无法据此量化区域收入或需求。更为关键的采纳阻力在于信任度。据 Cybersecurity
              Times 报道，攻击者强行推送了 76 个 trivy-action 标签中的 75 个以及全部 7 个 setup-trivy 标签，随后通过多个渠道分发带毒的 Trivy v0.69.4 二进制文件，直到约
              3 小时后才被清除。该报道同时转述了 Aqua 的声明，称其商业平台保持隔离且未受影响；但这属于公司口径，未经独立验证。BreachHistory 记录了一起与 Aqua
              关联的事件，并指出从未公布过经证实的受害实体数量。因此，买方必须在开源触达广度与软件供应链治理、凭据轮换成本及尚未明确的影响范围之间权衡，而不能将开源触达直接等同于零摩擦的客户获取。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
