      - number: '3.4'
        title: 护城河韧性、替代风险与供应链安全隐患
        blocks:
          - type: paragraph
            body: >-
              Aqua 的竞争护城河依托于其开源生态维护：AppSec Santa 披露 Trivy 拥有 36,500 个 GitHub Star，kube-bench、kube-hunter 及 Tracee
              亦获得实质性采用。该画像转述了 Aqua 拥有超过 500 家企业客户的说法，但明确标注该数字属于厂商自行披露，未经独立核实。这一分发飞轮在 2026 年 3 月遭遇重创：TeamPCP 利用 GitHub
              Actions 配置缺陷，分发了恶意的 Trivy v0.69.4 制品和 Action 标签。现有材料证实了入侵和密钥泄露机制，但缺乏经核实的受害企业基数：Cybersecurity Times
              声称波及数千家机构，而 BreachHistory 指出从未公布经证实的受害者数量。该事件加大了对 Aqua 构建流程控制的尽调压力，也让主打供应链安全的竞品对其开源信任优势构成了实质性挑战。
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展件
        blocks:
          - type: callout
            title: 运行时内联阻断与无代理便捷性的权衡
            body: >-
              Aqua Security 的核心商业战场在于无代理可观测性与内联运行时阻断之间的取舍。Wiz 等平台通过提供无需主机特权、数小时内即可跨多云环境部署的无代理 API 旁路扫描实现了快速扩张。虽然 Aqua
              也提供无代理资产扫描，但其技术差异化壁垒在于依靠内核级 DaemonSet 与 Tracee eBPF 探针，实时主动阻断未授权进程执行与无文件攻击。注重深度合规与运行时防御的机构会选择
              Aqua，而看重零摩擦接入体验的团队往往倾向于无代理方案。
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP008
          - type: callout
            title: 2026 年 Trivy 供应链攻击对生态的深远影响
            body: >-
              2026 年 3 月 TeamPCP 攻陷 Trivy v0.69.4 的事件，凸显了网络安全领域依托开源产品驱动增长模式（PLG）的战略风险。各来源一致确认恶意制品与 Action
              标签泄露了流水线凭据，但在波及范围上存在分歧：Cybersecurity Times 声称波及数千家组织，而 BreachHistory
              指出从未公布经证实的受害者统计。该事件为构建期供应链竞品提供了直接质疑其信任度的依据，但现有证据未能对客户实际损失或商业影响进行量化。
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
