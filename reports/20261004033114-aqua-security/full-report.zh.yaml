  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 增长与运营假设
      - 估值与倍数逻辑
      - 核心执行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 运行时差异化成功转化 Trivy 用户；ARR 同比增速升至 >30%；AI 工作负载治理成为核心新增收驱动力。
        - 若在纳斯达克 IPO 或引发超大规模云厂商竞购，按 8.0x-10.0x 远期 ARR 倍数计，远期估值可达 $1.5B-$1.8B。
        - 全套件安全老牌厂商带来激烈的销售阻力；静态漏洞扫描面临潜在同质化风险。
        - 20%（要求商业化执行得到验证且科技股估值倍数回暖）
      - - 基准情景
        - 企业容器采用保持稳定，支撑 ARR 维持中十位数的稳健增长；以色列、美国和印度中心严格控制招聘节奏。
        - 按 $900M-$1.1B（5.5x-6.5x 远期 ARR）实施战略收购或资本重组，以保障 Series E 轮投入资本安全。
        - 市场估值倍数停滞；企业向多云迁移放缓；财富 500 强客户销售周期拉长。
        - 55%（与 2024 年平价扩展轮及竞争压力现状相符）
      - - 悲观情景
        - CrowdStrike 与 Palo Alto 捆绑运行时防护；Trivy 供应链失陷导致客户流失；增速跌至 <10%。
        - 以 $450M-$600M（3.0x-4.0x 远期 ARR）进行困境整合或下调估值重组（down-round），损害劣后股权益。
        - 巨额清算优先权堆叠吞噬普通股价值；高管更迭；持续的运营现金消耗。
        - 25%（受到行业整合趋势与失陷历史印证）
    notes: 情景模型模拟了不同潜在退出路径下的远期回报态势；估值倍数参照企业网络安全行业常模。
    claimRefs:
