      - number: '3.2'
        title: 同行画像、核心能力与功能权衡
        blocks:
          - type: paragraph
            body: >-
              将各备选方案与 Aqua Security 对比，可以发现在核心采购标准上存在显著的架构与功能取舍。Snyk 提供静态应用安全测试（SAST）和开发者工作流卡点，但对比资料指出其缺乏容器内运行时防护与
              Kubernetes Pod 准入阻断能力。Sysdig Secure 依托 Falco 共享了 Aqua 的 eBPF 运行时技术渊源，主打云检测与响应（CDR），而 PeerSpot 显示 Sysdig
              Monitor 在容器监控领域占有 3.3% 的心智份额。竞品 Safeguard 出具的对比重点聚焦构建可信源、签名证明及构建期软件物料清单（SBOM），与 Aqua
              偏向运行时的重心形成对照；该材料对产品定位有参考价值，但并非独立评测基准。AppSec Santa 报道称 Aqua 拥有 FedRAMP High 认证、SOC 2 Type II 及 ISO 27001
              认证，同时也指出基于 Agent 的部署需要 DaemonSet 特权，部分平台团队对此有所抵触。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
