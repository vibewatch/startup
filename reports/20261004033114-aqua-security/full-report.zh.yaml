              现有材料表明，其采用混合架构设计，将阻断执行端尽可能靠近受保护的工作负载，同时实现策略、审计与管理的集中化。AWS 文档将 Aqua Enforcer 记录为工作节点上的 Kubernetes
              DaemonSet，通过网关与由 PostgreSQL 支撑的控制台通信；Aqua 当前转发的工程博客则描述了一个由 Go 语言开发的多组件管理控制台，结合 SQL 驱动的数据处理、REST
