      - number: '2.2'
        title: 市场测算视角与证据边界
        blocks:
          - type: paragraph
            body: >-
              分配给本章的有效来源中，没有一家能为相关 CNAPP、容器安全或运行时安全市场提供独立且方法论透明的测算。因此，给出一个具体的 TAM、SAM 或 SOM
              数值只会制造虚假的精确感。相反，现有证据支持从三个公司规模维度进行观察：Aqua 披露超过 40% 的 Fortune 100 企业信任其平台，并单独列出截至 2026 年 8 月拥有超过 40 家
              Fortune 100 客户；GitHub 数据显示 Trivy 及相关 Aqua 项目保持活跃，反映了开发者触达广度，但无法证明付费转化；GetLatka 估计其 2024 年年度收入为 $89.9M，2023
              年为 $56.3M，但该平台并未披露可审计的方法论，其标题中的 ARR 措辞也不应推翻正文将该指标定性为年度收入的事实。这些只是市场渗透率和公司规模的替代指标，并非可触达市场总量的衡量标准。
