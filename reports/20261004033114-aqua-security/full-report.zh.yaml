      - number: '2.3'
        title: 用户群体、采纳路径与扩张驱动力
        blocks:
          - type: paragraph
            body: >-
              产品证据表明，其用户涵盖安全团队、应用及平台安全专员和开发者；采纳路径通常始于代码仓库或镜像扫描，随后延伸至生产环境工作负载控制。依托与 CI/CD、镜像仓库、Kubernetes、Serverless、SIEM
              及分析工具的集成，该产品得以同时嵌入研发与安全运维流程。Aqua 基于实时工作负载行为的风险优先级排序缓解了告警过载难题，而在断网或物理隔离环境中的本地阻断能力，拓宽了对运维受限客户的适用性。公司在 2026 年
              8 月宣布正式商用（GA）AI 运行时控制功能，围绕模型行为、提示词检测及 AI
              使用策略开辟了新的相邻场景。公开材料未能明确合同买方、预算负责人、采购门槛或从开源到商业化部署的转化率，因此这些领域仍是明确的尽调缺口。
            claimRefs:
