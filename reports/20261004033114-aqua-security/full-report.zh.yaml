            body: >-
              Aqua
              的公开产品架构以从研发到生产的全流程控制为核心，而非单一扫描器。容器安全页面介绍了针对漏洞、恶意软件、敏感凭据、配置缺陷及开源风险的镜像分析能力；此外还补充了沙箱分析、部署准入策略、运行时控制与合规审计报告。官网首页进一步延伸了该工作流，引入基于行为洞察的优先级排序与本地阻断，并宣称
              Secure AI 已正式商用（GA）。这些均属公司声明，而非经过独立验证的有效性结论。最坚实的外部部署证据范围更窄且时间更早：AWS 在 2020 年的实施指南中记录了在 Amazon EKS
              上运行的控制台、网关、数据库、扫描器及节点级 Enforcer。因此，模块功能图将市场宣传的可用性与已证实的架构区隔开来，而准确率、系统开销及可用率仍属尽调缺口。
