      - number: '1.2'
        title: 高管团队、公司治理与生态扩张
        blocks:
          - type: paragraph
            body: >-
              Aqua Security 的管理层汇聚了来自美国、以色列及全球业务单元的网络安全资深人士 [CO002, CO005]。2026 年 2 月，Aqua
              宣布更新运营模式并调整领导架构，重点压缩企业暴露在攻击利用下的窗口，优先强化运行时暴露面管理与生产级补偿性控制 [CO008]。开源生态战略由开源副总裁 Itay Shakury 统筹，他在 2025 年 7
              月主导推出了 Trivy Partner Connect Program，与 Echo、Minimus 等安全设计（secure-by-design）容器伙伴建立商业及 OEM 合作层级
              [CO007]。印度法定申报文件显示，Amir Gerebe 与 Anekar Noorullah Javeed Ahmed 等关键高管和董事负责企业合规及离岸研发监管
              [CO005]。公司的治理框架在开发者主导的开源社区信任与商业企业安全承诺之间持续寻求平衡 [CO003, CO007, CO008]。关键人员仍集中在核心运行时工程研究（由 Nautilus
              研究团队带队）以及开源项目维护上 [CO006, CO007]。
            claimRefs:
