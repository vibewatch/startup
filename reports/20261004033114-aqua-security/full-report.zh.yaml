      - number: '1.3'
        title: 资本结构、投资方图谱与核心概览指标
        blocks:
          - type: paragraph
            body: >-
              Aqua Security 累计完成了约 $325M 的股权融资，其中以 2021 年的 $135M Series E 轮融资为核心锚点，确立了 $1.0B 投后估值的独角兽基准；随后在 2024 年初完成
              $60M 追加融资以维持企业现金跑道 [CO004, CO012]。公司股权结构表中包含多家机构风投和战略投资方，包括 ION Crossover Partners、M12（微软风投基金）、Lightspeed
              Venture Partners、Insight Partners、TLV Partners 以及 Greenspring Associates
              [CO004]。然而，详细的股权结构表条款、清算优先权、受偿顺位堆叠及老股交易定价均未在公开记录中披露 [CO012]。运营概览指标显示，Aqua 披露拥有 17+ 项已获批专利，超过 40% 的 Fortune
              100 企业为其商业客户；截至 2026 年 8 月，其在 146 个受监控生产环境中已拦截超过 577,000 次运行时威胁 [CO006, CO009]。相反，整体
              ARR、净留存率（NRR）、合并员工数及现金跑道仍属未经核实的私有信息缺口，需在数据室直接验证 [CO012]。
            claimRefs:
              - CO004
              - CO006
              - CO009
              - CO012
