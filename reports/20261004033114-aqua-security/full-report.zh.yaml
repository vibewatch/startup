  - id: FE001
    title: 产品架构与控制闭环
    type: stack
    summary: 公开证据支撑起一条自开发输入端起，经由集中策略与工作负载本地阻断，最终输出至安全运营的六层防护路径。
    data:
      layers:
        - label: 开发与交付输入
          detail: CI/CD 流水线、镜像仓库、容器镜像及应用制品进入安全工作流。
        - label: 静态与动态分析
          detail: 镜像扫描与沙箱执行共同识别漏洞、恶意软件、敏感凭据及行为风险。
        - label: 策略与管理面
          detail: 控制台统一定义防护策略、处理后台任务、开放 API 并存储策略与审计数据。
        - label: 网关与分发
          detail: 网关汇聚安全数据，并将集中管理端与受保护环境打通。
        - label: 工作负载本地阻断
          detail: 节点级执行器（enforcer）监控工作负载，并下发执行容器、主机与网络策略。
        - label: 安全运营输出
          detail: 安全发现与告警事件可通过经认证的 Webhook 馈送规范化接入 Google SecOps。
    approximationNotes: 本架构为综合归纳的逻辑技术栈，不代表实际网络拓扑或当前的微服务边界；所引用的 AWS 拓扑证据属于历史资料，Google 文档仅记录了其中一项集成。
