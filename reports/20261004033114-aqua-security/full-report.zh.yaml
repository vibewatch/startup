chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、业务版图与法律实体结构
        blocks:
          - type: paragraph
            body: >-
              Aqua Security 是一家处于后期阶段的企业级云原生应用保护平台（CNAPP）厂商，核心产品根植于容器安全、运行时防护及开源漏洞扫描 [CO001]。公司成立于 2015
              年，在美国马萨诸塞州伯灵顿与以色列拉马特甘设立双总部，并在全球拥有多家运营子公司，包括位于班加罗尔的 Aqua Security Software India Private Limited [CO002,
              CO005]。作为非上市实体，Aqua 处于未披露财务数据的私有状态，经审计的收入、ARR、毛利率、烧钱速度及资产负债表流动性均未公开 [CO004, CO012]。Aqua
              依靠企业级平台订阅将技术商业化，覆盖云工作负载保护、容器运行时防御与软件供应链保障 [CO001, CO008]。为配合自研企业级平台，公司赞助并变现开源开发者工具，其中最著名的当属 Trivy 漏洞扫描器
              [CO003, CO007]。其印度研发实体的监管申报文件显示，公司合规运营，法定及实缴资本为 ₹1L，截至 2025 年 1 月有 84 名注册员工，FY2025 本地收入在 ₹50 Cr 至 ₹100 Cr
              之间，是观察 Aqua 离岸软件研发团队运作的重要窗口 [CO005]。
            claimRefs:
              - CO001
              - CO002
              - CO003
