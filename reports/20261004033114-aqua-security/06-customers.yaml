chapter:
  number: 6
  title: "Customers"
  summary: "Aqua Security demonstrates extensive enterprise customer penetration across regulated verticals, claiming adoption by over 500 enterprises and more than 40 percent of the Fortune 100 alongside a Department of Education-sponsored FedRAMP High authorization. However, procurement remains opaque and sales-led, while significant operational complexity in cluster-agent maintenance, alert tuning, and recent 2026 supply-chain breaches in the open-source Trivy ecosystem expose customers to friction and third-party risk."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Profiles"
    body: "Aqua Security segments its commercial customer base primarily across large enterprises operating complex multi-cloud and hybrid containerized environments, with prominent customer concentration in financial services, telecommunications, government, and software engineering. While the company's open-source scanner Trivy provides broad practitioner and developer-level top-of-funnel reach across thousands of organizations globally, commercial monetization is strictly sales-led and negotiated around the unified Aqua Platform and specialized Aqua U.S. Gov offerings. The primary commercial buyers are centralized enterprise security and DevSecOps leadership teams navigating strict compliance mandates such as NIST 800-53, PCI DSS, SOC 2, and FedRAMP High, who require active runtime enforcement alongside build-time scanning. In contrast, operational practitioners often experience friction from the heavy cluster-by-cluster agent deployment requirements and ongoing anomaly baseline tuning necessary to separate genuine attacks from benign container workload scaling events."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-proof"
    title: "Adoption Trajectory and Named Enterprise Proof"
    body: "Aqua's customer adoption trajectory reflects consistent penetration among Tier-1 regulated enterprises since its 2015 founding as Scalock. Following its initial platform launch in May 2016, Aqua secured early adoption across Global 1000 accounts including two of the top ten financial services firms and three of the top ten software companies worldwide, expanding its footprint through its Series B financing. By 2026, the company reported adoption by over 500 enterprise organizations worldwide and verified penetration exceeding 40 percent of the Fortune 100, corroborated across independent profile analyses. Documented enterprise customer accounts and reference deployments include major multinational brands such as PayPal, Netflix, Samsung, Audi, and Alma, alongside a dedicated U.S. Federal Civilian Agency deploying container security across Azure and AWS workloads. Production adoption centers on inline runtime enforcement using eBPF sensors, granular role-based access control, automated CI/CD pipeline integration, and automated alert notifications via Microsoft Teams, enabling large organizations to maintain least privilege access across thousands of production workloads."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "retention-expansion-and-operational-risks"
    title: "Retention, Operational Friction, and Concentration Risks"
    body: "Despite Aqua's entrenched footprint in Fortune 100 accounts, public disclosures omit audited Net Retention Rate (NRR), Gross Retention Rate (GRR), customer churn cohorts, and ACV distribution schedules. Customer durability and expansion are constrained by significant operational overhead associated with managing host-level agents and persistent false positives generated by behavioral anomaly detection engines. Competitive evaluations by industry peers such as Aikido Security indicate enterprise teams increasingly explore agentless alternatives to avoid the multi-month onboarding timelines, professional services dependencies, and cluster maintenance burdens intrinsic to Aqua's architecture. Furthermore, severe customer trust and supply-chain headwinds emerged in March 2026 when threat actor TeamPCP compromised Aqua's Trivy ecosystem via stolen CI/CD credentials, poisoning release tags across trivy-action and setup-trivy to distribute malicious binaries that exfiltrated cloud and Kubernetes credentials from thousands of downstream user pipelines. Although Aqua maintained that its commercial platform operates on architecturally isolated infrastructure, the incident highlighted acute third-party supply-chain exposure across enterprise customer environments relying on Aqua's open-source toolchain."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU013"
      - "CU015"
      - "CU016"
    callouts: []
