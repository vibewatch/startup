companyProfile:
  summary: >-
    Aqua Security is a late-stage private CNAPP vendor focused on container security, workload runtime enforcement, and
    software supply-chain protection. The company pairs an enterprise subscription platform with Trivy-led open-source
    distribution, which supports broad developer reach while keeping the commercial model anchored in runtime control,
    compliance, and regulated-workload deployments. Public evidence points to meaningful enterprise adoption and a large
    historical funding base, but current revenue quality, margins, cash efficiency, and capital structure remain opaque.
