company:
  name: "Aqua Security"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Aqua Security is a cloud-native application protection platform (CNAPP) pioneer specializing in container and runtime workload security, reinforced by developer-facing open-source adoption through Trivy. Operating out of Burlington, Massachusetts, Ramat Gan, Israel, and international subsidiaries including an engineering base in Bangalore, India, the company raised over $325M in funding at a $1B valuation ceiling but faces private financial disclosure gaps and heightened supply-chain governance scrutiny following a March 2026 open-source ecosystem compromise."
sections:
  - id: "corporate-identity-and-operating-profile"
    title: "Corporate Identity, Operating Footprint, and Legal Structure"
    body: "Aqua Security operates as a late-stage enterprise cloud-native application protection platform (CNAPP) vendor, with core product roots in container security, runtime protection, and open-source vulnerability scanning [CO001]. Founded in 2015, the company maintains its dual corporate footprint between Burlington, Massachusetts in the United States and Ramat Gan, Israel, augmented by international operating subsidiaries including Aqua Security Software India Private Limited in Bangalore [CO002, CO005]. As a private entity, Aqua operates under a private-undisclosed profile where audited revenue, ARR, gross margin, cash burn, and balance-sheet liquidity are not made public [CO004, CO012]. Aqua commercializes its technology through enterprise platform subscriptions covering cloud workload protection, container runtime defense, and software supply chain assurance [CO001, CO008]. To complement its proprietary enterprise platform, the company sponsors and monetizes open-source developer tools, most notably the Trivy vulnerability scanner [CO003, CO007]. Regulatory filings for its Indian engineering entity reveal active statutory compliance with ₹1L authorized and paid-up capital, 84 registered employees as of January 2025, and FY2025 local revenue between ₹50 Cr and ₹100 Cr, serving as an indicative operational anchor for Aqua's offshore software development workforce [CO005]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO007"
      - "CO008"
      - "CO012"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Ecosystem Expansion"
    body: "Aqua Security's corporate leadership combines cybersecurity veterans across its US, Israeli, and international operating units [CO002, CO005]. In February 2026, Aqua announced a renewed operating model and leadership alignment aimed at closing the enterprise exploitation window by prioritizing runtime exposure management and production-level compensating controls [CO008]. Open-source ecosystem strategy is guided by VP of Open Source Itay Shakury, who spearheaded the July 2025 launch of the Trivy Partner Connect Program to establish commercial and OEM tiers with secure-by-design container partners such as Echo and Minimus [CO007]. Statutory filings in India list key executive and director signatories including Amir Gerebe and Anekar Noorullah Javeed Ahmed for corporate compliance and offshore development oversight [CO005]. The company's governance framework continues to balance developer-led open-source community trust with commercial enterprise security commitments [CO003, CO007, CO008]. Key-person dependencies remain concentrated in core runtime engineering research (led by the Nautilus research team) and open-source stewardship [CO006, CO007]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization Structure, Investor Map, and Cover Metrics"
    body: "Aqua Security has raised approximately $325M in cumulative equity financing, anchored by a $135M Series E round in 2021 that established a $1.0B post-money unicorn valuation benchmark, followed by a $60M funding extension in early 2024 to preserve enterprise runway [CO004, CO012]. The company's cap table features institutional venture and strategic investors including ION Crossover Partners, M12 (Microsoft's Venture Fund), Lightspeed Venture Partners, Insight Partners, TLV Partners, and Greenspring Associates [CO004]. However, detailed cap-table terms, liquidation preferences, seniority stacks, and secondary pricing are withheld from the public record [CO012]. In operational cover metrics, Aqua reports 17+ issued patents and more than 40% of the Fortune 100 as enterprise customers, having blocked over 577,000 runtime threats across 146 monitored production environments as of August 2026 [CO006, CO009]. Conversely, top-line ARR, net revenue retention (NRR), consolidated headcount, and cash runway remain unverified private gaps, requiring direct data-room validation [CO012]."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO009"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-adverse-events"
    title: "Operational Evolution, Product Innovations, and Incident History"
    body: "Aqua Security's developmental trajectory spans initial container runtime isolation to an integrated cloud-native application protection suite with runtime virtual patching capabilities such as vShield [CO001, CO006]. While expanding its enterprise footprint, the company faced significant supply-chain adversity in March 2026 when threat actor TeamPCP compromised the open-source Trivy vulnerability scanner ecosystem via a GitHub Actions CI/CD workflow flaw (`apidiff.yaml`) [CO010, CO011]. The attacker weaponized a compromised service account (`aqua-bot`) to force-push malicious infostealer code to 75 of 76 `aquasecurity/trivy-action` release tags and publish poisoned Trivy v0.69.4 binaries before remediation occurred ~3 hours later [CO011]. Independent threat telemetry confirmed that while Aqua's commercial platform runs on an architecturally isolated infrastructure that avoided direct compromise, the open-source breach exposed CI/CD secrets across downstream users and led to temporary defacement of 44 internal repositories [CO010, CO011]. This event prompted Aqua to intensify its runtime containment messaging and formalize partner assurance programs [CO006, CO008, CO011]."
    claimRefs:
      - "CO001"
      - "CO006"
      - "CO008"
      - "CO010"
      - "CO011"
    figureRefs:
      - "FO001"
