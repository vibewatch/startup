callouts:
  - calloutType: "risk"
    title: "Open-Source Supply-Chain Attack Elevates Governance Scrutiny"
    body: "The March 2026 supply-chain attack on Trivy by TeamPCP highlighted severe operational exposure in open-source developer workflows [CO010, CO011]. Attackers leveraged a GitHub Actions workflow flaw to steal CI/CD secrets and poison official release tags [CO011]. While Aqua's commercial platform was isolated, customer diligence must evaluate internal software supply chain controls and developer credential governance [CO011]."
    claimRefs:
      - "CO010"
      - "CO011"
  - calloutType: "insight"
    title: "Runtime Enforcement Positions Aqua Against Pure-Visibility CNAPPs"
    body: "Aqua has explicitly shifted its positioning toward runtime exposure management, arguing that pre-deployment scanning ('shift left') fails to stop active exploitation [CO006, CO008]. With patented vShield technology and agent-based local enforcement across 146 production environments, Aqua differentiates against agentless scanning competitors, though at the expense of higher deployment overhead [CO006, CO008]."
    claimRefs:
      - "CO006"
      - "CO008"
