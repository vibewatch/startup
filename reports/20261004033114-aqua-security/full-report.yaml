  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and maturity
        blocks:
          - type: paragraph
            body: >-
              Aqua's public product surface is organized around a development-to-production control loop rather than a
              single scanner. The container-security page describes image analysis for vulnerabilities, malware,
              secrets, misconfiguration, and open-source risk; it then adds sandbox analysis, deployment acceptance
              policies, runtime controls, and compliance reporting. The homepage extends that workflow with
              behavior-informed prioritization and local enforcement, while describing Secure AI as generally available.
              These are company claims, not independent efficacy findings. The strongest external deployment evidence is
              narrower and older: AWS's 2020 implementation guide documents the console, gateway, database, scanner, and
              node-level enforcers on Amazon EKS. Consequently, the module map distinguishes marketed availability from
              demonstrated architecture and leaves accuracy, overhead, and uptime as diligence gaps.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
              - CE013
          - type: table
