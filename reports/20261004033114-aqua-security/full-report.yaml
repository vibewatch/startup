              - CU012
      - number: '6.2'
        title: Adoption Trajectory and Named Enterprise Proof
        blocks:
          - type: paragraph
            body: >-
              Aqua's customer adoption trajectory reflects consistent penetration among Tier-1 regulated enterprises
              since its 2015 founding as Scalock. Following its initial platform launch in May 2016, Aqua secured early
              adoption across Global 1000 accounts including two of the top ten financial services firms and three of
              the top ten software companies worldwide, expanding its footprint through its Series B financing. By 2026,
              the company reported adoption by over 500 enterprise organizations worldwide and verified penetration
              exceeding 40 percent of the Fortune 100, corroborated across independent profile analyses. Documented
              enterprise customer accounts and reference deployments include major multinational brands such as PayPal,
              Netflix, Samsung, Audi, and Alma, alongside a dedicated U.S. Federal Civilian Agency deploying container
              security across Azure and AWS workloads. Production adoption centers on inline runtime enforcement using
              eBPF sensors, granular role-based access control, automated CI/CD pipeline integration, and automated
              alert notifications via Microsoft Teams, enabling large organizations to maintain least privilege access
              across thousands of production workloads.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
              - CU014
