  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Divergence
        blocks:
          - type: paragraph
            body: >-
              The cloud-native security landscape has fractured into distinct architectural archetypes rather than a
              homogeneous competitive field. Snyk anchors developer-first pre-deployment security across IDEs, pull
              requests, and software composition analysis, commanding over 4,500 organizational customers and 400,000
              developers. Conversely, Wiz leads agentless cloud security posture management and side-scanning breadth
              across multi-cloud infrastructure, capturing an estimated 12.5% CNAPP mindshare on PeerSpot compared to
              Aqua's 3.0%. Aqua Security concentrates its primary defensibility on enterprise container runtime
              security, eBPF-based inline workload monitoring via Tracee, and policy-based Kubernetes admission control.
              While developer-focused platforms shift security left and agentless platforms optimize for rapid asset
              discovery, Aqua focuses on day-two runtime enforcement for regulated production environments running
              Kubernetes at scale.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
