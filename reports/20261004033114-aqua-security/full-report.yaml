chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Legal Structure
        blocks:
          - type: paragraph
            body: >-
              Aqua Security operates as a late-stage enterprise cloud-native application protection platform (CNAPP)
              vendor, with core product roots in container security, runtime protection, and open-source vulnerability
              scanning [CO001]. Founded in 2015, the company maintains its dual corporate footprint between Burlington,
              Massachusetts in the United States and Ramat Gan, Israel, augmented by international operating
              subsidiaries including Aqua Security Software India Private Limited in Bangalore [CO002, CO005]. As a
              private entity, Aqua operates under a private-undisclosed profile where audited revenue, ARR, gross
              margin, cash burn, and balance-sheet liquidity are not made public [CO004, CO012]. Aqua commercializes its
              technology through enterprise platform subscriptions covering cloud workload protection, container runtime
              defense, and software supply chain assurance [CO001, CO008]. To complement its proprietary enterprise
              platform, the company sponsors and monetizes open-source developer tools, most notably the Trivy
              vulnerability scanner [CO003, CO007]. Regulatory filings for its Indian engineering entity reveal active
              statutory compliance with ₹1L authorized and paid-up capital, 84 registered employees as of January 2025,
              and FY2025 local revenue between ₹50 Cr and ₹100 Cr, serving as an indicative operational anchor for
              Aqua's offshore software development workforce [CO005].
