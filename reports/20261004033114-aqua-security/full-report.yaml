      - number: '3.3'
        title: Pricing Models, Packaging, and Enterprise Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Commercial models across CNAPP and application security create different entry points. A 2026 comparison
              lists Snyk's Team plan at $25 per developer per month, whereas Aqua publishes no standard price list. The
              same comparison estimates Aqua entry deployments at $25,000-$40,000 annually and says pricing commonly
              scales by nodes or workloads; these are third-party estimates, not disclosed Aqua contracts or realized
              revenue. RFP.wiki separately identifies per-cluster or per-node charges, add-on modules, professional
              services, and renewal uplifts as category-level procurement watchouts, but its generic checklist does not
              establish Aqua's actual terms. Trivy provides a no-cost open-source scanning entry point, while
              centralized policy, runtime enforcement, and audit reporting are commercial-platform value propositions
              whose realized pricing remains a diligence gap.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Displacement Hazards, and Supply Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Aqua's competitive moat is anchored by open-source stewardship: AppSec Santa reports 36,500 GitHub stars
              for Trivy and material adoption for kube-bench, kube-hunter, and Tracee. The same profile repeats Aqua's
              claim of more than 500 enterprise customers but explicitly labels that count vendor-published rather than
              independently verified. The distribution flywheel suffered an adverse event in March 2026 when TeamPCP
              exploited a GitHub Actions misconfiguration and malicious Trivy v0.69.4 artifacts and action tags were
              distributed. The allocated sources establish the compromise and secret-exposure mechanism, but not a
              verified victim denominator: Cybersecurity Times alleges exposure across thousands of organizations, while
              BreachHistory says no attested victim count had been published. The incident increases diligence pressure
              on Aqua's build controls and gives supply-chain-focused competitors a concrete challenge to its
              open-source-led trust advantage.
            claimRefs:
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Runtime Enforcement vs. Agentless Convenience
            body: >-
              The core commercial battleground for Aqua Security is the tension between agentless visibility and inline
              runtime enforcement. Platforms like Wiz have expanded rapidly by offering agentless API side-scanning that
              deploys across multi-cloud environments in hours without host privileges. While Aqua provides agentless
              inventory scanning, its technical differentiation relies on kernel-level DaemonSets and Tracee eBPF agents
              to actively block unauthorized process execution and fileless exploits in real time. Organizations
              prioritizing deep compliance and runtime defense choose Aqua, whereas teams prioritizing frictionless
              onboarding often lean toward agentless alternatives.
            calloutType: insight
            claimRefs:
              - CP003
              - CP004
              - CP008
          - type: callout
            title: Ecosystem Repercussions of the 2026 Trivy Supply Chain Attack
            body: >-
              The March 2026 compromise of Trivy v0.69.4 by TeamPCP highlights the strategic risk attached to an
              open-source product-led motion in cybersecurity. The sources agree that malicious artifacts and action
              tags exposed pipeline credentials, but disagree on scope: Cybersecurity Times alleges exposure across
              thousands of organizations, while BreachHistory says no attested victim count had been published. The
              event gives build-time supply-chain competitors a concrete trust objection, but the allocated evidence
              does not quantify customer losses or commercial impact.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
