      - number: '5.2'
        title: Architecture, deployment, and integration
        blocks:
          - type: paragraph
            body: >-
              The available materials indicate a hybrid architecture built to place enforcement near protected workloads
              while centralizing policy, audit, and management. AWS documents Aqua Enforcers as Kubernetes DaemonSets on
              worker nodes, communicating through a gateway to a console backed by PostgreSQL; Aqua's current
              engineering repost separately describes a multi-component management console using Go, SQL-backed
              processing, REST APIs, Vue.js, containers, and both on-premises and SaaS components. Google Cloud
              documents a webhook path that normalizes Aqua events into its Unified Data Model, demonstrating one
              operational integration rather than broad interoperability. The sources support the component boundaries,
              but they do not establish current scale limits, upgrade behavior, availability targets, or cross-version
              support. The architecture should therefore be tested under representative customer topology before
              underwriting its operational simplicity.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
          - type: table
            tableRef: TE003
