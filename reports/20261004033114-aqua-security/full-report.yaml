      - number: '2.3'
        title: Users, Adoption Path, and Expansion Drivers
        blocks:
          - type: paragraph
            body: >-
              The product evidence identifies security teams, application and platform security practitioners, and
              developers as users across an adoption path that can begin with repository or image scanning and extend
              into production workload control. CI/CD, registries, Kubernetes, serverless, SIEM, and analytics
              integrations place the product inside both development and security operations. Aqua's risk prioritization
              based on live workload behavior addresses alert overload, while local enforcement in disconnected or
              air-gapped environments broadens applicability to operationally constrained buyers. The company's August
              2026 launch language for generally available AI runtime controls adds an adjacency around model behavior,
              prompt inspection, and AI usage policy. Public materials do not identify the contractual payer, budget
              owner, procurement thresholds, or conversion rate from open-source use to commercial deployments, so those
              fields remain explicit diligence gaps.
