      - number: '2.4'
        title: Adoption Constraints, Trust, and Geographic Reach
        blocks:
          - type: paragraph
            body: >-
              Aqua maintains a visible operating footprint in the United States, Israel, India, and Singapore and
              advertises worldwide hiring, which is consistent with serving distributed enterprise deployments but does
              not quantify regional revenue or demand. The more consequential adoption constraint is trust.
              Cybersecurity Times reported that attackers force-pushed 75 of 76 trivy-action tags and all seven
              setup-trivy tags, then distributed a poisoned Trivy v0.69.4 binary through multiple channels before
              removal roughly three hours later. The same report relayed Aqua's statement that its commercial platform
              was isolated and unaffected; that is company attribution, not independent verification. BreachHistory
              records one Aqua-linked incident and notes that no attested victim count was published. Buyers must
              therefore weigh open-source reach against software-supply-chain governance, credential-rotation cost, and
              the unresolved blast radius rather than treating reach as frictionless acquisition.
