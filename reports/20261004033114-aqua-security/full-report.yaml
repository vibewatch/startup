      - number: '1.3'
        title: Capitalization Structure, Investor Map, and Cover Metrics
        blocks:
          - type: paragraph
            body: >-
              Aqua Security has raised approximately $325M in cumulative equity financing, anchored by a $135M Series E
              round in 2021 that established a $1.0B post-money unicorn valuation benchmark, followed by a $60M funding
              extension in early 2024 to preserve enterprise runway [CO004, CO012]. The company's cap table features
              institutional venture and strategic investors including ION Crossover Partners, M12 (Microsoft's Venture
              Fund), Lightspeed Venture Partners, Insight Partners, TLV Partners, and Greenspring Associates [CO004].
              However, detailed cap-table terms, liquidation preferences, seniority stacks, and secondary pricing are
              withheld from the public record [CO012]. In operational cover metrics, Aqua reports 17+ issued patents and
              more than 40% of the Fortune 100 as enterprise customers, having blocked over 577,000 runtime threats
              across 146 monitored production environments as of August 2026 [CO006, CO009]. Conversely, top-line ARR,
              net revenue retention (NRR), consolidated headcount, and cash runway remain unverified private gaps,
              requiring direct data-room validation [CO012].
