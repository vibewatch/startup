              - CE010
              - CE011
              - CE014
      - number: '5.3'
        title: Differentiation, trust, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Aqua's asserted differentiation is runtime context and enforcement: prioritize exposure using observed
              workload behavior, block actions locally, and apply compensating controls without waiting for a patch. Its
              current homepage reports more than 17 patents, more than 577,000 blocked runtime threats across 146
              production environments, and adoption by more than 40% of the Fortune 100, all expressly labeled as
              company-reported metrics as of August 2026. Secure AI adds model inventory, policy enforcement, prompt
              inspection, and production response, while an AI-architecture hiring repost indicates continued investment
              across SaaS and on-premises delivery. None of the assigned evidence independently verifies those metrics,
              detection quality, false-positive rates, latency, certifications, incident history, or GA feature
              completeness. The product thesis is plausible and technically specific, but trust and maturity should
              remain conditional on customer telemetry, security attestations, and roadmap readback.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workload-local enforcement is the clearest architectural distinction
            body: >-
              AWS's deployment guide places enforcers on each managed EKS worker node, while Aqua says its agent-based
              controls can operate in disconnected or air-gapped environments. That combination supports a control-plane
              plus local-enforcement model, although only the AWS configuration is externally documented here.
            calloutType: strength
            claimRefs:
              - CE002
              - CE009
          - type: callout
            title: Public evidence describes capability, not measured efficacy
            body: >-
              No retained source provides independent detection accuracy, false-positive rate, runtime overhead, service
              availability, recovery performance, or certification scope. Technical diligence should treat these as open
              acceptance criteria rather than infer them from product breadth or company-reported adoption.
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Aqua Security segments its commercial customer base primarily across large enterprises operating complex
              multi-cloud and hybrid containerized environments, with prominent customer concentration in financial
              services, telecommunications, government, and software engineering. While the company's open-source
              scanner Trivy provides broad practitioner and developer-level top-of-funnel reach across thousands of
              organizations globally, commercial monetization is strictly sales-led and negotiated around the unified
              Aqua Platform and specialized Aqua U.S. Gov offerings. The primary commercial buyers are centralized
              enterprise security and DevSecOps leadership teams navigating strict compliance mandates such as NIST
              800-53, PCI DSS, SOC 2, and FedRAMP High, who require active runtime enforcement alongside build-time
              scanning. In contrast, operational practitioners often experience friction from the heavy
              cluster-by-cluster agent deployment requirements and ongoing anomaly baseline tuning necessary to separate
              genuine attacks from benign container workload scaling events.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
