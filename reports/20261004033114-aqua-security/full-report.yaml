      - number: '1.2'
        title: Executive Leadership, Governance, and Ecosystem Expansion
        blocks:
          - type: paragraph
            body: >-
              Aqua Security's corporate leadership combines cybersecurity veterans across its US, Israeli, and
              international operating units [CO002, CO005]. In February 2026, Aqua announced a renewed operating model
              and leadership alignment aimed at closing the enterprise exploitation window by prioritizing runtime
              exposure management and production-level compensating controls [CO008]. Open-source ecosystem strategy is
              guided by VP of Open Source Itay Shakury, who spearheaded the July 2025 launch of the Trivy Partner
              Connect Program to establish commercial and OEM tiers with secure-by-design container partners such as
              Echo and Minimus [CO007]. Statutory filings in India list key executive and director signatories including
              Amir Gerebe and Anekar Noorullah Javeed Ahmed for corporate compliance and offshore development oversight
              [CO005]. The company's governance framework continues to balance developer-led open-source community trust
              with commercial enterprise security commitments [CO003, CO007, CO008]. Key-person dependencies remain
              concentrated in core runtime engineering research (led by the Nautilus research team) and open-source
              stewardship [CO006, CO007].
