          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU008
              - CU012
              - CU014
      - number: '6.3'
        title: Retention, Operational Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite Aqua's entrenched footprint in Fortune 100 accounts, public disclosures omit audited Net Retention
              Rate (NRR), Gross Retention Rate (GRR), customer churn cohorts, and ACV distribution schedules. Customer
              durability and expansion are constrained by significant operational overhead associated with managing
              host-level agents and persistent false positives generated by behavioral anomaly detection engines.
              Competitive evaluations by industry peers such as Aikido Security indicate enterprise teams increasingly
              explore agentless alternatives to avoid the multi-month onboarding timelines, professional services
              dependencies, and cluster maintenance burdens intrinsic to Aqua's architecture. Furthermore, severe
              customer trust and supply-chain headwinds emerged in March 2026 when threat actor TeamPCP compromised
              Aqua's Trivy ecosystem via stolen CI/CD credentials, poisoning release tags across trivy-action and
              setup-trivy to distribute malicious binaries that exfiltrated cloud and Kubernetes credentials from
              thousands of downstream user pipelines. Although Aqua maintained that its commercial platform operates on
              architecturally isolated infrastructure, the incident highlighted acute third-party supply-chain exposure
              across enterprise customer environments relying on Aqua's open-source toolchain.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Entrenched Footprint in High-Assurance and Federal Accounts
            body: >-
              Aqua's market position is strongly anchored by its Department of Education-sponsored FedRAMP High
              authorization and validated deployment across more than 40 percent of the Fortune 100. This regulatory and
              compliance depth creates substantial switching friction in federal and heavily audited enterprise accounts
              where uncertified competitors face severe procurement hurdles.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU008
          - type: callout
            title: Operational Friction and Supply-Chain Vulnerabilities in Customer Workflows
            body: >-
              Enterprise customers face mounting operational costs from agent-based cluster maintenance, baseline alert
              tuning, and lengthy onboarding cycles. Compounding these friction points, the March 2026 supply-chain
              attack on Trivy release tags demonstrated that open-source toolchain dependencies can introduce severe
              credential exposure risks into customer CI/CD environments.
            calloutType: risk
            claimRefs:
              - CU010
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Summary & Strategic Exposure
        blocks:
          - type: paragraph
            body: >-
              Aqua Security faces a dual-faceted risk profile shaped by its positioning as an independent cloud-native
              application protection platform vendor. While the company demonstrates enterprise traction with runtime
              protection across more than 40 Fortune 100 customers and over 17 patents, its commercial model remains
              vulnerable to external ecosystem shocks and aggressive platform consolidation. The catastrophic March 2026
              supply-chain attack on Trivy highlighted the acute operational and reputational dangers inherent in
              relying on open-source projects for developer acquisition. Simultaneously, repeated restructuring rounds
              and persistent pricing opacity create friction in enterprise sales cycles against integrated competitors
              such as Palo Alto Networks and CrowdStrike. Investors must weigh Aqua differentiated runtime enforcement
              against structural threats to its stand-alone viability.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR007
              - CR009
              - CR011
      - number: '7.2'
        title: Regulatory Posture, DORA Mandates & Compliance Assurance
        blocks:
          - type: paragraph
            body: >-
              Regulatory and compliance frameworks represent both a commercial tailwind and an operational exposure for
              Aqua Security. The European Union Digital Operational Resilience Act, effective January 2025, mandates
              stringent information and communication technology risk management and third-party oversight for financial
              institutions. Aqua positions its container security capabilities as an automated audit engine across NIST,
              PCI DSS, GDPR, and CIS benchmarks. However, under DORA, critical ICT third-party service providers face
              direct regulatory scrutiny and audit mandates. Enterprise customers in highly regulated sectors require
              documented assurance that security tooling does not itself introduce supply-chain vulnerabilities or
              operational disruptions, making compliance verification an ongoing gating item in sales diligence.
            claimRefs:
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.3'
        title: Operational Execution, Product Security & Supply Chain Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Operational and software supply chain risks materialized severely in March 2026 when threat actors
              compromised release infrastructure for Aqua widely adopted open-source scanner Trivy. Attackers
              force-pushed poisoned release tags and binaries to exfiltrate CI/CD secrets across thousands of
              organizations globally. Although Aqua stated that its commercial CNAPP platform operates on
              architecturally isolated infrastructure with separate CI/CD pipelines, the breach inflicted substantial
              reputational damage and underscored the difficulty of securing multi-stage open-source build workflows.
              Furthermore, enterprise practitioners report that implementing deep runtime workload protection demands
              significant deployment effort and rigorous policy tuning to avoid false-positive alert fatigue or
              unintended production container blocking.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
          - type: table
