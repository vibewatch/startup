      - number: '3.2'
        title: Peer Profiles, Capabilities, and Feature Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Evaluating alternatives against Aqua Security reveals substantial architectural and functional tradeoffs
              across core buying criteria. Snyk provides static application security testing (SAST) and developer
              workflow gating, but the allocated comparison says it lacks in-container runtime protection and Kubernetes
              pod admission enforcement. Sysdig Secure shares Aqua's eBPF runtime heritage through Falco and emphasizes
              cloud detection and response (CDR), while PeerSpot reports 3.3% mindshare for Sysdig Monitor in container
              monitoring. Safeguard's competitor-authored comparison focuses on build provenance, attestations, and
              build-time software bills of materials (SBOMs), contrasting with Aqua's runtime center of gravity; it is
              useful for product positioning but is not an independent benchmark. AppSec Santa reports that Aqua holds
              FedRAMP High authorization, SOC 2 Type II, and ISO 27001 certification, while also noting that agent-based
              deployment requires DaemonSet privileges that some platform teams resist.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
