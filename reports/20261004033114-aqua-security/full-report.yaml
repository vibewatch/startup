  - id: FE001
    title: Product architecture and control loop
    type: stack
    summary: >-
      Public evidence supports a six-layer path from development inputs through centralized policy and workload-local
      enforcement to security-operations output.
    data:
      layers:
        - label: Development and delivery inputs
          detail: CI/CD pipelines, registries, images, and application artifacts enter the security workflow.
        - label: Static and dynamic analysis
          detail: Image scanning and sandbox execution identify vulnerabilities, malware, secrets, and behavior risk.
        - label: Policy and management plane
          detail: The console defines controls, processes background work, exposes APIs, and stores policy and audit data.
        - label: Gateway and distribution
          detail: The gateway aggregates security data and connects centralized management to protected environments.
        - label: Workload-local enforcement
          detail: Node-level enforcers observe workloads and apply container, host, and network policies.
        - label: Security operations outputs
          detail: Findings and events can be normalized into Google SecOps through an authenticated webhook feed.
    approximationNotes: >-
      This is a synthesized logical stack, not a representation of network placement or current service boundaries; AWS
      topology evidence is historical and Google documents one integration.
