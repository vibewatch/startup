              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO012
      - number: '1.4'
        title: Operational Evolution, Product Innovations, and Incident History
        blocks:
          - type: paragraph
            body: >-
              Aqua Security's developmental trajectory spans initial container runtime isolation to an integrated
              cloud-native application protection suite with runtime virtual patching capabilities such as vShield
              [CO001, CO006]. While expanding its enterprise footprint, the company faced significant supply-chain
              adversity in March 2026 when threat actor TeamPCP compromised the open-source Trivy vulnerability scanner
              ecosystem via a GitHub Actions CI/CD workflow flaw (`apidiff.yaml`) [CO010, CO011]. The attacker
              weaponized a compromised service account (`aqua-bot`) to force-push malicious infostealer code to 75 of 76
              `aquasecurity/trivy-action` release tags and publish poisoned Trivy v0.69.4 binaries before remediation
              occurred ~3 hours later [CO011]. Independent threat telemetry confirmed that while Aqua's commercial
              platform runs on an architecturally isolated infrastructure that avoided direct compromise, the
              open-source breach exposed CI/CD secrets across downstream users and led to temporary defacement of 44
              internal repositories [CO010, CO011]. This event prompted Aqua to intensify its runtime containment
              messaging and formalize partner assurance programs [CO006, CO008, CO011].
            claimRefs:
              - CO001
              - CO006
              - CO008
              - CO010
              - CO011
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Open-Source Supply-Chain Attack Elevates Governance Scrutiny
            body: >-
              The March 2026 supply-chain attack on Trivy by TeamPCP highlighted severe operational exposure in
              open-source developer workflows [CO010, CO011]. Attackers leveraged a GitHub Actions workflow flaw to
              steal CI/CD secrets and poison official release tags [CO011]. While Aqua's commercial platform was
              isolated, customer diligence must evaluate internal software supply chain controls and developer
              credential governance [CO011].
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
          - type: callout
            title: Runtime Enforcement Positions Aqua Against Pure-Visibility CNAPPs
            body: >-
              Aqua has explicitly shifted its positioning toward runtime exposure management, arguing that
              pre-deployment scanning ('shift left') fails to stop active exploitation [CO006, CO008]. With patented
              vShield technology and agent-based local enforcement across 146 production environments, Aqua
              differentiates against agentless scanning competitors, though at the expense of higher deployment overhead
              [CO006, CO008].
            calloutType: insight
            claimRefs:
              - CO006
              - CO008
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Aqua's evidenced market boundary begins with cloud-native application and workload security rather than
              the whole cybersecurity budget. Its public materials span clouds, CI/CD pipelines, registries, containers,
              serverless platforms, orchestration, and security tooling, while the container product combines
              pre-production image analysis with production runtime controls. Included spend therefore covers image
              vulnerability and malware scanning, secret and misconfiguration detection, policy gates, workload
              monitoring, and runtime enforcement across hybrid and multi-cloud environments. Broad identity, endpoint,
              network, and general-purpose observability spend is excluded from this evidence-constrained boundary.
              Status-quo substitutes include stand-alone scanning, free developer tooling such as Trivy, manual
              remediation, and fragmented point products; the retained sources do not establish their relative spend or
              market shares.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
              - CM015
