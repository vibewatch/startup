    title: Cloud-Native Security Architectural Positioning Map
    type: quadrant
    summary: >-
      Evaluation of cloud-native security alternatives mapped across pre-deployment developer integration versus runtime
      and infrastructure enforcement depth.
    data:
      xAxis:
        label: Pre-Deployment Developer Integration
        min: 0
        max: 10
        low: Limited allocated evidence of developer-workflow integration
        high: Strong allocated evidence of IDE, PR, or build-pipeline integration
        scale: Analyst-authored ordinal score
      yAxis:
        label: Runtime and Infrastructure Enforcement Depth
        min: 0
        max: 10
        low: Limited allocated evidence of live-workload enforcement
        high: Strong allocated evidence of runtime or infrastructure enforcement
        scale: Analyst-authored ordinal score
      points:
        - label: Snyk
          x: 9
          'y': 2
          detail: Developer-first IDE and PR workflow; allocated comparison says no runtime enforcement.
        - label: Aqua Security
          x: 5
          'y': 9
          detail: CI/CD and image controls plus inline runtime enforcement; less developer-centric than Snyk.
        - label: Sysdig Secure
          x: 4
          'y': 8
          detail: Falco-based runtime positioning is evidenced; developer integration remains under-documented.
        - label: Wiz
          x: 4
          'y': 5
          detail: Agentless cloud coverage is evidenced; in-container enforcement is not.
        - label: Safeguard
          x: 8
          'y': 3
          detail: Competitor-issued evidence emphasizes build-time gates and provenance, not runtime.
        - label: Status Quo (Cloud Native DIY)
          x: 3
          'y': 4
          detail: Analytical baseline for internal assembly; performance depends on the buyer's chosen tools.
