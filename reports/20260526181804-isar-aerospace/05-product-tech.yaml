  claims:
    - id: CE001
      statement: "Spectrum is a two-stage launch vehicle that is 28 meters tall, 2 meters in diameter, and is marketed for up to 1,000 kilograms to LEO and 700 kilograms to SSO."
      type: company-claimed
      topic: "spectrum-vehicle"
      sourceRefs: [SE003, SE024]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001]
    - id: CE002
      statement: "Spectrum uses nine in-house Aquila engines on the first stage and one vacuum-optimized Aquila engine on the second stage."
      type: company-claimed
      topic: "propulsion"
      sourceRefs: [SE003, SE024]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001, QE003]
    - id: CE003
      statement: "Isar says Spectrum burns liquid oxygen and propane, a propellant choice it presents as high-performing and lower-emissions than more classical carbon-based rocket propellants."
      type: company-claimed
      topic: "propulsion"
      sourceRefs: [SE003, SE010]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE003]
    - id: CE004
      statement: "Isar publicly attributes Spectrum's mission flexibility to a multi-ignition second-stage engine and markets dedicated, lead, and rideshare configurations around that capability."
      type: company-claimed
      topic: "service-workflow"
      sourceRefs: [SE003, SE001]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QE002, QE004]
    - id: CE005
      statement: "Isar markets Spectrum as a launch service product with dedicated, lead, and rideshare booking modes for small and medium satellites and constellations."
      type: company-claimed
      topic: "service-workflow"
      sourceRefs: [SE001, SE003]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE002]
    - id: CE006
      statement: "Isar states that Spectrum is designed, developed, built, and tested almost entirely in-house under a vertically integrated operating model."
