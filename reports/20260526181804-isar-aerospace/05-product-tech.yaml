company:
  name: "Isar Aerospace"

chapter:
  number: 5
  title: "Product & Technology"
  summary: |
    Spectrum is a 28-meter, two-stage small-launch vehicle with 1,000 kg LEO and 700 kg SSO capacity, powered by ten in-house Aquila engines using LOX and propane and delivered through a vertically integrated production-test-launch stack spanning Vaterstetten, Esrange, and Andøya. The strongest technical differentiators are deep in-house control of propulsion, structures, software, and operations plus exclusive access to the current orbital pad at Andøya, while the main unresolved risk is that factory and test capacity claims are still pre-orbit and pre-cadence until Spectrum vehicle #2 reaches orbit and repeatable launch tempo is demonstrated.

sections:
  - id: spectrum-product-definition-and-architecture
    title: "Spectrum product definition and vehicle architecture"
    body: |
      Isar Aerospace sells access-to-orbit rather than propulsion components: Spectrum is marketed as a flexible launch service for small and medium satellites and constellations, with dedicated, lead, and rideshare booking modes that let customers trade schedule control against shared-flight economics. Public specs place Spectrum at 28 meters tall and 2 meters in diameter, with 1,000 kg payload capability to LEO and 700 kg to SSO. The vehicle uses a straightforward two-stage architecture with nine in-house Aquila engines on the first stage and one vacuum-optimized Aquila on the second stage. Isar also highlights LOX/propane as the propellant set, a differentiator versus kerosene-heavy peers and a choice the company frames as both high-performing and cleaner than more classical hydrocarbon combinations. The technical posture is intentionally simple at the system level: no public kick stage, no public reusability subsystem, and no complicated multi-vehicle family yet. That simplicity supports a more manufacturable product definition, but it also means Spectrum's differentiation depends heavily on execution quality, second-stage flexibility, and the company's ability to convert in-house control into reliable flight operations.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001, FE002]

  - id: industrial-footprint-and-test-system
    title: "Industrial footprint, production system, and engine test stack"
    body: |
      The technical heart of Isar's thesis is not just the rocket but the production system around it. The company repeatedly describes Spectrum as almost entirely designed, manufactured, and tested in-house, pairing additive manufacturing, carbon-composite know-how, software, avionics, structures, and propulsion inside one vertically integrated stack. That stack now spans three specialized sites: a Vaterstetten campus near Munich for development and series production, Esrange in Sweden for engine and stage acceptance testing, and Andøya in Norway for launch operations. Public evidence on Aquila is stronger on endurance testing than on full performance disclosure: before first flight, Isar reported 260-second integrated hotfires and six firings of one engine without refurbishment, and in February 2026 it added a second Esrange facility designed for more than 30 engine tests per month plus integrated stage acceptance tests. The VGP-backed Vaterstetten campus adds more than 40,000 square meters for production, development, and headquarters functions. Together, these disclosures make Isar's manufacturing footprint unusually concrete for a European launcher startup, although actual recurring throughput remains unproven in commercial operations.
    claimRefs: [CE006, CE007, CE010, CE011, CE012, CE013, CE014, CE039]
    tableRefs: [TE003]

  - id: launch-operations-safety-and-readiness
    title: "Launch operations, safety controls, and readiness evidence"
    body: |
      Launch operations are a meaningful part of Isar's product because Spectrum is bundled with a specific European range configuration rather than sold as a launcher abstracted from infrastructure. Isar has exclusive access to the current orbital launch pad at Andøya Spaceport, and the first pad was built to Isar's specifications with payload integration facilities and mission control. The site geometry supports polar and sun-synchronous missions, which fits Spectrum's small-satellite target market. Regulatory readiness is visible but exacting: the Civil Aviation Authority Norway notes that the spaceport has an operating permit and can eventually support up to 30 launches per year as more pads are built, but today only one pad exists and Isar must obtain a permit for each launch. The regulator also imposes secure-area and access controls around testing, fueling, transport, and launch operations. The March 2025 first flight therefore mattered operationally even though it did not reach orbit: Spectrum cleared the pad, flew for roughly 30 seconds, validated the flight-termination system, and left the launch pad intact. That de-risked ground systems and range integration more than mission assurance, because the public record still lacks a root-cause writeup for the loss of control during ascent.
    claimRefs: [CE008, CE015, CE016, CE017, CE018, CE019, CE020, CE035, CE036]
    tableRefs: [TE004]

  - id: roadmap-to-cadence-and-serviceization
    title: "Roadmap to cadence and serviceization"
    body: |
      The near-term roadmap is clearly oriented around shortening the gap between first-flight learning and a repeatable launch service. After the March 2025 test flight, Isar said vehicles #2 and #3 were already in production; by December 2025 it reported both stages of the second vehicle had passed 30-second integrated static-fire tests and were ready for final integration and launch operations. In parallel, the February 2026 Esrange expansion added more acceptance-test capacity, while ESA stated its Boost support would continue into second-flight preparation and scale-up of the new Vaterstetten production system. This creates a recognizable launch-service workflow: build and integrate in Germany, qualify engines and stages in Sweden, transport to Norway, complete launch-campaign licensing and pad integration at Andøya, then execute a mission on the dedicated launch complex. Public demand signals also clarify what serviceization must support after orbit insertion is proven: SEOPS markets recurring access through a broker-managed LaunchLock Prime workflow, Astroscale frames ELSA-M around precise target-orbit delivery for debris-removal operations, and R-Space has already described repeat flights in 2026 and 2027 from the same Andøya stack. Maritime Launch Services widens the roadmap with a Nova Scotia letter of intent, but that path is still prospective because MLS says construction is underway. Andøya's own orbital-launch page still frames the completed range as a 30-mission-per-year, 90°-110.6° inclination service, underscoring that range evolution—not just vehicle performance—sits on the cadence path. The dependency structure is equally clear. Factory square meters and engine-test cells do not automatically create cadence if per-mission licensing, single-pad availability, unresolved flight anomalies, or the immaturity of any second-range option slow the launch campaign. The product roadmap therefore looks credible in infrastructure terms, but still contingent on vehicle #2 proving orbit insertion and post-flight turnaround discipline.
    claimRefs: [CE009, CE021, CE022, CE023, CE024, CE025, CE037, CE040, CE041, CE042, CE043, CE044, CE045, CE046]
    tableRefs: [TE005]
    figureRefs: [FE003]

  - id: differentiation-versus-european-peers
    title: "Technical differentiation versus European peers"
    body: |
      Spectrum sits in a crowded but heterogeneous European launcher field. Relative to Rocket Factory Augsburg, Isar fields a simpler two-stage system instead of a three-stage vehicle with a separate orbital transfer stage and oxygen-rich staged-combustion engines. Relative to Maia, Spectrum forgoes reusability and methane in favor of an expendable propane launcher with fewer public subsystems to qualify. Relative to HyImpulse, it avoids hybrid propulsion and the aggressive cadence claims attached to that architecture. Against global small-launch references, Spectrum offers materially more payload than Rocket Lab Electron and roughly the same class as Firefly Alpha, but without Electron's kick-stage heritage or Firefly's already demonstrated operational responsiveness. Against Europe's incumbent path, Vega C is larger, more institutional, and operationally more mature. The result is a differentiated but narrow wedge: Spectrum is best understood as a high-payload European microlauncher built around vertical integration and continental-European range access rather than around reusability, kick-stage precision, or institutional flight heritage. That could be a strong position if Isar reaches orbit and stabilizes cadence quickly; if not, the crowded peer set and Europe's still-limited launch demand compress the time available for Spectrum to convert technical promise into durable launch economics.
    claimRefs: [CE026, CE027, CE028, CE029, CE030, CE031, CE032, CE033, CE034, CE038, CE039]
    tableRefs: [TE006]
    figureRefs: [FE004]

