companyProfile:
  summary: Isar Aerospace is a private European launch-services company founded in 2018 and based in Ottobrunn, Bavaria, Germany. The company is led by founders Daniel Metzler, Josef Fleischmann, and Markus Brandl and centers on Spectrum, a two-stage orbital launch vehicle targeting up to 1,000 kg to LEO and 700 kg to SSO for small and medium satellite missions. Public evidence shows more than €500 million of private capital raised, an Eldridge €150 million convertible in June 2025, institutional and commercial launch demand, and exclusive use of Andøya's current orbital pad. At the same time, Isar remains pre-orbit after a March 2025 first flight that ended around T+30 seconds, and public disclosure on revenue, margins, backlog economics, and financing mechanics remains limited.
