    {
      "id": "range-and-legal-dependence",
      "title": "Licensing, legal conditions, and Andøya concentration remain first-order dependencies",
      "body": "The launch-site story is strategically strong and operationally concentrated. CAA Norway says Andøya Spaceport can support up to 30 launches per year and currently has one pad exclusively used by Isar, but the same regulator also says Isar must obtain a permit for each launch. That means launch cadence depends not only on vehicle readiness but also on recurring regulator, range, and maritime-safety execution. The legal stack is still evolving as well. Norwegian authorities presently run launch permissions under the existing framework, while public legal analysis says the revised Space Act is expected to formalize permission requirements, operator duties, liability, and insurance, and to preserve discretion for extra conditions or outright refusal. State ownership of Andøya lowers counterparty risk versus a fragile private range, yet it also means Isar remains tied to a single sovereign infrastructure and oversight regime. The March 2026 visit to Andøya by German Chancellor Friedrich Merz and Norwegian Prime Minister Jonas Gahr Støre reinforces that this is now a politically salient sovereign-capability asset, which is supportive but also makes the programme more exposed to state-priority shifts than a purely commercial pad relationship. The Nova Scotia partnership is directionally useful, but today it is still a diversification option rather than a live capacity release valve for Andøya or the Norwegian licensing process.",
