    "number": 7,
    "title": "Risks",
    "summary": "Isar Aerospace has moved beyond a paper launcher thesis, but its risk stack is still dominated by execution after a terminated first flight. The core adverse chain runs from qualification slippage and per-launch licensing dependence at Andøya into customer conditionality, policy-backed funding reliance, and a crowded European launcher market. Rapid iteration and vertical integration are real mitigants, yet they also concentrate manufacturing, quality, and capital-intensity risk until Spectrum completes an orbital qualification mission."
  },
  "sections": [
    {
      "id": "post-flight-technical-execution",
      "title": "Post-flight technical execution is improving, but not yet de-risked",
      "body": "Isar has moved the technical question from “can the vehicle leave the pad?” to “can the company repeatedly complete an orbital qualification campaign?” The first Spectrum flight on 30 March 2025 achieved liftoff and pad clearance, but the vehicle was terminated at T+30 seconds after control was lost. Public reporting later tied the failure to an unintended vent-valve opening at the start of the roll manoeuvre, so the anomaly is no longer a pure black box. That matters because the company has shown real iteration speed: vehicles #2 and #3 were already in production, both stages for the next vehicle passed 30-second integrated static fires by December 2025, and the Esrange expansion adds engine and integrated-stage acceptance capacity. The adverse point is that none of those milestones substitutes for a completed orbital mission. Isar first targeted the second qualification flight for not earlier than 21 January 2026, then reset the available launch window to not earlier than 19 March after resolving a pressurization-valve issue from the first launch attempt. Even after that reset, the 2026 campaign still suffered a scrub caused by a range intrusion and temperature drift, followed by another stand-down over a COPV leak. Vertical integration helps Isar learn quickly, but it also concentrates defect escape, acceptance-testing, and mission-assurance risk inside the same operating stack.",
