  topStrengths:
    - >-
      Exclusive access to Andøya's current orbital pad plus explicit ESA, European Commission, and Norwegian support
      create a real sovereign-launch wedge.
    - >-
      Spectrum has moved beyond concept stage: first-flight liftoff, rapid post-failure iteration, and vertically
      integrated production and test infrastructure show real technical progress.
    - >-
      More than €500 million of private capital raised and a 400+ employee footprint give Isar more scale and staying
      power than many European launcher startups.
    - >-
      Named institutional and commercial missions stretching into 2026-2028 provide credible early demand before full
      commercial cadence is proven.
  topRisks:
    - >-
      Spectrum has not yet reached orbit; the March 2025 first flight ended around T+30 seconds and return-to-flight
      remains the key de-risking milestone.
    - >-
      Revenue, cash, gross margin, backlog value, and customer economics are not publicly disclosed, making underwriting
      highly assumption-driven.
    - >-
      The 2025 Eldridge financing was a convertible rather than a clean equity mark, leaving valuation and dilution
      mechanics opaque.
    - Launch operations are concentrated on a single Andøya pad and mission-specific Norwegian licensing process.
    - >-
      Competition from Vega C rideshare, Rocket Lab Electron, SpaceX rideshare, and other European launchers can
      pressure price and share before cadence is proven.
  unresolvedGaps:
    - Audited or lender-grade cash, burn, revenue, and gross-margin data are still unavailable publicly.
    - Eldridge convert terms, cap-table stack, and dilution outcomes are not disclosed.
    - Contract-level backlog economics, deposits, cancellation rights, and payment milestones remain private.
    - A public root-cause and corrective-action package plus successful return-to-flight evidence is still needed.
    - Insurance, liability, and per-launch regulatory cost structure across Andøya operations remain under-disclosed.
