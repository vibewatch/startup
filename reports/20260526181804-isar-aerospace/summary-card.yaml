summary:
  headline: >-
    Isar Aerospace combines unusual strategic relevance, capital access, and real launch progress for a European private
    launcher, but without orbital success, clean commercial disclosure, or transparent convert terms, it remains a
    research-more story rather than an underwritable buy.
  overallScore: 5.9
  recommendation: research-more
