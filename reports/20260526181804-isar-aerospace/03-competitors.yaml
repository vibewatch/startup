- id: substitutes-and-distribution
  title: Substitutes, packaging, and distribution power
  body: |-
    The commercial default alternative to Spectrum is not another pre-orbit European startup. It is a proven provider with a clearer queue. Electron remains the dedicated small-launch benchmark because it combines real cadence, multiple launch pads, and kick-stage-enabled orbit control. Falcon 9 rideshare is even harder to ignore because it publishes a list price, publishes cadence guidance, and offers an online reservation and rebooking flow. In contrast, none of the reviewed public pages for Isar, RFA, HyImpulse, Maia, Vega C, or Electron disclosed a directly comparable list price for a dedicated mission. That matters because buyers can model Falcon 9 immediately, while most European startup pricing still requires sales discovery.

    Vega C is the European status-quo substitute. It is heavier than Spectrum and not a dedicated taxi for every mission, but it is operational, it now sits under Avio's direct commercial control, and it already won three Flight Ticket auxiliary-passenger missions while Isar won two dedicated missions. That split is revealing: Europe is deliberately funding both a new entrant and the incumbent adjacent option in parallel. For Isar, distribution risk therefore comes less from HyImpulse or Orbex than from the combination of Avio's institutional access, Electron's operational proof, and Falcon 9's transparent rideshare economics.
