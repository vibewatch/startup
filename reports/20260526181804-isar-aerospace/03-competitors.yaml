- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - evidence from reviewed sources
  - severity
  - mitigation / diligence ask
  rows:
  - - Exclusive Andøya pad access
    - More European pads come online or Andøya throughput stays below ambition
    - Andøya currently has one operational pad and it is exclusively used by Isar, but the 30-launch permit assumes additional future pads
    - Medium
    - Track Andøya throughput, launch-slot allocation, and whether exclusivity survives pad expansion
  - - Early institutional traction
    - Europe keeps splitting smallsat procurement between Isar and incumbent rideshares
    - Flight Ticket awarded Isar two dedicated missions and Avio three auxiliary-passenger missions
    - Medium
    - Ask how many follow-on sovereign missions convert after the first two Spectrum institutional flights
  - - Vertical integration and factory scale
    - Factory ambition does not convert into reliable orbit-capable cadence
    - Isar publicly targets 30-40 vehicles per year, but Spectrum has not yet reached orbit
    - High
    - Request engine yield, stage-test throughput, and unit-cost curve evidence from the Munich facility
  - - Larger payload than Electron
    - Falcon 9 rideshare and Vega C absorb missions that do not need a dedicated taxi
    - SpaceX publishes transparent rideshare economics and Vega C already serves institutional small payloads
    - High
    - Segment the addressable market by missions that truly require dedicated orbit control or European range control
  - - First integrated flight experience
    - Failure-to-orbit still scares customers toward proven substitutes
    - Spectrum flew and returned data, but lost control after liftoff and was terminated at T+30 seconds
    - High
    - Request root-cause closeout, corrective actions, and date confidence for a successful orbital mission
  - - European challenger field breadth
    - Too many European projects chase too little demand, compressing price and subsidy support
    - Multiple 2025-26 reviews openly expect consolidation across the microlauncher field
    - Medium
    - Model 2027-2030 demand versus announced supply and test whether Isar remains viable without further public anchor demand
  notes: Severity is qualitative. The register focuses on whether Isar’s current advantages survive once customers compare against rideshare substitutes and once sovereign procurement shifts from pilot support to repeat buying behavior.
