  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Dedicated-launch pricing transparency across European peers
    missingEvidence: The reviewed public sources do not disclose negotiated price cards, discounting, or realized contract values for Isar, RFA, HyImpulse, Maia, Vega C, or Electron. Only SpaceX rideshare publishes a clear benchmark list price.
    whyItMatters: Without comparable public pricing, the chapter can compare package structures and transparency but cannot underwrite whether Spectrum is truly cost-competitive against European peers or proven substitutes.
    diligencePath: Request current quote sheets or recent signed launch term sheets for a representative 150-300 kg and 500-700 kg mission across Isar, RFA, Avio, Rocket Lab, and SpaceX.
    relatedQuestionRefs:
    - QP017
    - QP025
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: minor
    topic: Orbex Prime official product refresh
    missingEvidence: Orbex's official Prime product page returned a 502 / access-blocked result during review, so current payload and schedule specifics could not be refreshed directly from Orbex.
    whyItMatters: Orbex remains relevant because it is in ESA's challenger set, but the inability to refresh official product detail lowers confidence in any direct comparison versus better-documented peers.
    diligencePath: Re-fetch Orbex official product materials from a whitelisted environment or request the latest Prime payload user guide and current launch timetable from the company.
    relatedQuestionRefs:
    - QP009
    - QP025
    relatedTableRefs:
    - TP001
  - type: stale
    severity: material
    topic: 2026 launch cadence and manifest certainty across European challengers
    missingEvidence: Independent market articles give useful snapshots of launch timing, but firm 2026-27 manifest dates for Isar, RFA, Orbex, HyImpulse, and PLD remain fluid and are not consistently published in audited schedule form.
    whyItMatters: The real competitive question is cadence, not concept art. Without firm manifest and range-access data, substitute risk from Vega C, Electron, and Falcon 9 may still be underestimated or overestimated.
    diligencePath: Request current range bookings, vehicle-complete dates, and launch-readiness milestones from each European challenger; cross-check against spaceport operators and regulator notices.
