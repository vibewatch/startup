- id: direct-peer-comparison
  title: Direct peer profiles and capability comparison
  body: |-
    On disclosed vehicle performance, Spectrum is one of Europe's larger startup small launchers: Isar states 1,000 kg to LEO and 700 kg to SSO, larger than Electron and HyImpulse SL1 and roughly in the same strategic band as RFA ONE and Maia's reusable-mode offering. Unlike Maia or PLD, though, Isar's public differentiation does not currently rest on reuse. It rests on vertical integration, in-house engines, and a production system that management says can scale to 30-40 vehicles per year. That is an industrialisation thesis rather than a cost-down-through-reuse thesis.

    Among direct peers, RFA is the closest like-for-like threat on payload class and mission tailoring, especially because it openly markets rideshare ports and an orbital transfer vehicle. PLD is the cleanest European alternative for buyers who want explicit shared, piggyback, and dedicated packaging options. Maia is the strongest long-run strategic challenger if reusable economics matter more than startup purity, because ArianeGroup gives it industrial depth and a reusable narrative closer to Falcon-style logic. HyImpulse and Orbex matter less in the immediate commercial window because their publicly evidenced readiness lags behind Isar's. Isar's first-flight failure therefore paradoxically helps and hurts: it is still unproven on orbit, but it has at least completed the kind of integrated launch campaign most European peers have not yet demonstrated.
