callouts:
- calloutType: strength
  title: Why Isar is ahead of the European startup pack right now
  body: Isar is not operational yet, but it has already completed a real launch campaign, holds exclusive access to the only current orbital pad at Andøya, and secured two institutional missions under Flight Ticket. That makes it more than a slide-deck contender.
  claimRefs:
  - CP005
  - CP007
  - CP030
- calloutType: risk
  title: Why Isar can still lose the market before reaching orbit
  body: Dedicated-launch demand is contestable. Customers can fall back to Vega C auxiliary rides, Electron’s proven taxi service, or Falcon 9 rideshare pricing and cadence if Spectrum slips. Isar therefore needs repeat orbital success, not just sovereign support.
