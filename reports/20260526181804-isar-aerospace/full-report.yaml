  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Spectrum product definition and vehicle architecture
        blocks:
          - type: paragraph
            body: >
              Isar Aerospace sells access-to-orbit rather than propulsion components: Spectrum is marketed as a flexible
              launch service for small and medium satellites and constellations, with dedicated, lead, and rideshare
              booking modes that let customers trade schedule control against shared-flight economics. Public specs
              place Spectrum at 28 meters tall and 2 meters in diameter, with 1,000 kg payload capability to LEO and 700
              kg to SSO. The vehicle uses a straightforward two-stage architecture with nine in-house Aquila engines on
              the first stage and one vacuum-optimized Aquila on the second stage. Isar also highlights LOX/propane as
              the propellant set, a differentiator versus kerosene-heavy peers and a choice the company frames as both
              high-performing and cleaner than more classical hydrocarbon combinations. The technical posture is
              intentionally simple at the system level: no public kick stage, no public reusability subsystem, and no
              complicated multi-vehicle family yet. That simplicity supports a more manufacturable product definition,
              but it also means Spectrum's differentiation depends heavily on execution quality, second-stage
              flexibility, and the company's ability to convert in-house control into reliable flight operations.
            claimRefs:
