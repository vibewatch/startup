      - - 'THESIS: Isar is still the best-funded independent European launcher startup'
        - 2023 and 2024 financings plus the 2025 Eldridge convert built a large capital base
        - A flat or down financing after 2025 would weaken the claim that capital access is durable.
      - - 'THESIS: industrial build-out could become an advantage if cadence follows'
        - Munich HQ, Esrange testing, and vertical integration all point to a scaled operating ambition
        - If infrastructure spend rises faster than launch cadence, the same build-out becomes a value trap.
      - - 'ANTI-THESIS: the first launch did not prove orbit or cadence'
        - Spectrum flew for roughly 30 seconds and did not reach orbit
        - Successful return-to-flight and follow-on commercial launches would narrow the discount.
      - - 'ANTI-THESIS: the latest price signal is structurally messy'
        - The 2025 Eldridge round was a convertible rather than a clean equity mark
        - Full convert terms and a clean next priced round would make the valuation anchor more useful.
      - - 'ANTI-THESIS: public peers show proof and disclosure, not just optimism, drive value'
        - Rocket Lab has large public value and filing cadence, while Avio is a smaller incumbent public anchor
        - If Isar adds filing-grade disclosure or audited economics, peer-based framing becomes more credible.
