      - number: '6.2'
        title: Institutional backlog quality is stronger than commercial proof
        blocks:
          - type: paragraph
            body: >-
              The best-documented part of Isar's customer story is its institutional backlog. The Norwegian Space Agency
              contract identifies the payload family, orbit, launch site, and outer time window through 2028. The Flight
              Ticket awards identify both missions—CASSINI by ISISpace and Tom & Jerry by Infinite Orbits—and tie them
              to the ESA and European Commission procurement stack. ΣYNDEO-3 goes further by naming Redwire as prime
              contractor, describing the payload count, and disclosing a Q4 2026 launch window. ESA's separate Boost
              support also matters because it underwrites the supply side that those customers depend on: test-flight
              preparation, production scale-up, and second-flight readiness.


              This institutional quality stands out because Isar's first Spectrum flight was not a customer mission. The
              March 2025 launch was a data-gathering test, carried no customer payload, and ended after roughly 30
              seconds, yet the pad stayed intact and ESA publicly framed the result as a meaningful step. That sequence
              matters for backlog quality: Europe was still willing to place institutional work with Isar after a failed
              first orbital attempt, suggesting that public buyers are purchasing optionality and strategic launch
              capacity, not just near-term proven cadence. Still, those same sources do not disclose pricing,
              milestone-payment structure, or what remedies customers have if the second and later flights slip.
