      - number: '6.3'
        title: Commercial counterparties show segment breadth but limited durability proof
        blocks:
          - type: paragraph
            body: >-
              The commercial agreements in the public record are credible but mostly early-stage in economic disclosure.
              SEOPS booked a dedicated mission for 2028 under LaunchLock Prime, a program built around pre-secured
              capacity and launch-vehicle choice for downstream customers. That suggests Isar can sell to intermediaries
              that bundle downstream payload demand. Astroscale's ELSA-M award shows another niche: customers that need
              precise orbit insertion for rendezvous and debris-removal missions rather than generic rideshare access.
              R-Space adds an IOD platform operator that intends to fly its own satellites for customers demonstrating
              technologies in orbit.


              What these commercial examples do not yet prove is durability. Only R-Space publicly mentions further
              flights planned for 2026 and 2027, giving Isar one visible land-and-expand signal. None of the reviewed
              commercial announcements disclosed contract value, deposits, rebooking behavior, on-time launch service
              levels, or cancellation provisions. Maritime Launch Services also sits outside the normal customer bucket
              because its announcement is a letter of intent around Canadian launch readiness and future orbit coverage
              rather than a disclosed launch booking. In other words, Isar has enough named commercial proof to show
              segment resonance, but not enough public data to demonstrate recurring revenue quality or multi-mission
              retention at scale.
