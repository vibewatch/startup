  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - payload / architecture
      - current status
      - launch / customer model
      - differentiation
      - material limitation vs Isar
    rows:
      - - Isar Spectrum
        - Direct European small launcher
        - 1,000 kg LEO / 700 kg SSO; 28 m; LOX / propane; 2 stages
        - Flew once in Mar 2025; vehicle 2 static-fired Dec 2025
        - Dedicated smallsat and constellation missions; 2 Flight Ticket missions from 2026 onward
        - Exclusive current Andøya pad access; vertical integration; larger payload than Electron
        - No orbital success yet; no public list price; cadence still unproven
      - - RFA ONE
        - Direct European small launcher
        - 1,300 kg to 500 km SSO; 3 stages; Redshift OTV
        - Still pre-orbit after 2024 static-fire loss
        - Dedicated or rideshare with Redshift and multiple port sizes
        - Largest disclosed payload among direct European startup peers reviewed
        - Launch readiness slipped after stage loss; no orbital heritage
      - - HyImpulse SL1
        - Direct European small launcher
        - 600 kg LEO; 3 stages; hybrid propulsion
        - Independent 2026 overview still places first orbital flight after immediate wave
        - Dedicated responsive launch service
        - Safety / affordability narrative built around hybrid architecture
        - Later readiness than Isar; no orbital service history
      - - Orbex Prime
        - Direct European small launcher
        - Official product page blocked during review; third-party reports place it in the small-launch class
        - ELC-shortlisted; 2026 timeline described as uncertain
        - Dedicated smallsat focus
        - Still in ESA challenger pool and therefore remains funding-relevant
        - Current official payload / schedule detail could not be refreshed
      - - PLD MIURA 5
        - Direct European reusable small launcher
        - Reusable 2-stage launcher; dedicated / shared / piggyback modes
        - Program in development with qualification and Kourou pad progress updates
        - Dedicated, shared, and piggyback missions
        - Most explicit public packaging options among direct European peers
        - No orbital service yet; public launch price undisclosed
      - - Maia
        - European reusable entrant / adjacent
        - 1,500 kg SSO expendable / 500 kg reusable; methalox
        - Preparing maiden flight in 2026 per independent overview
        - Dedicated launcher with reusable and expendable versions
        - ArianeGroup / Prometheus heritage and larger payload class
        - Not yet operational; more incumbent-linked than startup-pure
      - - Avio Vega C
        - Adjacent incumbent European launcher
        - ~2,200-2,300 kg polar orbit; 4 stages
        - Operational after return to flight; Avio now commercial provider
        - Institutional missions and auxiliary-passenger rideshares
        - Existing service record and three Flight Ticket auxiliary missions
        - Heavier class than Spectrum; not always a dedicated taxi
      - - Rocket Lab Electron
        - Global dedicated small-launch benchmark
        - 300 kg LEO; Kick Stage; 2 + Kick Stage
        - Operational; 88 launches to date
        - Dedicated or rideshare with tailored orbits
        - Proven cadence, kick-stage flexibility, three pads
        - Smaller payload than Spectrum; not a European sovereign option
      - - SpaceX Falcon 9 rideshare
        - Global substitute / incumbent class
        - 22,800 kg LEO Falcon 9; rideshare slots from 50 kg
        - Operational at very high cadence
        - Shared manifests with online booking and rebooking
        - Transparent list pricing and frequent SSO missions
        - Shared-manifest orbit tradeoffs; not like-for-like dedicated service
    notes: >-
