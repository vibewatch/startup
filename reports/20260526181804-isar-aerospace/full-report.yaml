    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it matters
      - Current public proxy
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Recognized revenue by quarter
        - Needed to separate contract headlines from earned launch revenue
        - Named launch agreements and mission schedule only
        - Backlog quality and timing cannot be converted into a revenue model
        - Request quarterly recognized revenue, bookings, backlog, and revenue-recognition policy
      - - Realized launch price by configuration
        - Needed to know what dedicated, lead, and rideshare actually sell for
        - Website mentions “pricing options”; no public rate card
        - Cannot test price premium versus rideshare or estimate gross profit per flight
        - Request signed term sheets or order forms by launch type
      - - Gross margin by launch configuration
        - Needed to evaluate whether cadence can ever yield attractive economics
        - Only qualitative “cost-efficient” language is public
        - Margin path is entirely speculative without unit cost disclosure
        - Request gross margin waterfall by dedicated, lead, and rideshare mission
      - - Cash on hand and monthly burn
        - Needed for a runway and next-round assessment
        - Funding history and losses are public, current liquidity is not
        - Capital adequacy remains incomplete despite large historic raises
        - Request latest balance sheet, monthly burn, and downside runway model
      - - Bond terms and debt service
        - Needed to understand non-equity claims on future cash flows
        - Public description stops at “convertible bond”
        - Debt-like overhang may alter downside protection and next-round dynamics
        - Request coupon, maturity, conversion triggers, covenants, and any collateral package
      - - Customer deposits and cancellation rights
        - Needed to judge whether backlog converts to cash and how fragile the manifest is
        - Named missions and “manifest filling rapidly” commentary
        - A booked mission is not the same as secure cash inflow
        - Request deposit schedule, cancellation penalties, and reflight obligations
      - - Insurance and launch-failure reserve
        - Needed after a failed first flight and before commercial cadence ramps
        - Pad intact and rapid return-to-flight messaging only
        - Unknown liability, rework, and premium burden after anomalies
        - Request insurance programme, deductibles, reserve policy, and post-flight cost impact
      - - Working capital for engines and stages
        - Needed to test how much inventory must be funded before launch revenue arrives
        - '>30 engines/month testing and 30-40 vehicles/year output targets'
        - Inventory intensity could absorb capital faster than launch cadence recovers it
        - Request inventory turns, raw-material commitments, and supplier payment terms
      - - Capex split across sites
        - Needed to know which industrial build-out costs sit with Isar versus landlords or public partners
        - VGP build-to-suit, Esrange expansion, Andøya exclusivity, Nova Scotia LOI
        - Factory and site ambition cannot be translated into true capital need from public sources
        - Request capex ownership and lease-versus-own schedule by site
      - - Customer concentration and backlog value
        - Needed to judge revenue durability and mission concentration risk
        - Publicly named contracts without value disclosure
        - A few large institutional missions could dominate the visible pipeline
        - Request backlog by customer, top-10 concentration, and schedule slippage sensitivity
    notes: >-
      Each missing metric maps directly to a live underwriting blocker; the issue is not lack of narrative, but lack of
