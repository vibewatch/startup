      - number: '7.3'
        title: Customer demand is real, but conversion remains conditional on service proof
        blocks:
          - type: paragraph
            body: >-
              The good news is that Isar has accumulated a visibly real customer pipeline rather than a generic “market
              interest” story. The Norwegian Space Agency, ESA and the European Commission, SEOPS, and Astroscale have
              all publicly announced missions, with windows running from 2026 onward to 2028. The bad news is that these
              are still forward contracts on a launch system that has not yet completed an orbital qualification
              mission. The first Spectrum launch did not carry customer payloads, the most visible institutional awards
              are modest in value, and public disclosures still do not reveal deposits, cancellation rights, delay
              remedies, or milestone-payment schedules. That matters because in launch, backlog quality depends on both
              technical reliability and contractual durability. AOS, Flight Ticket, ΣYNDEO-3, and ELSA-M strengthen
              strategic credibility, but they do not yet prove repeatable revenue conversion. If qualification slips
              continue, customers have options: institutional missions can be reassigned inside Europe, and commercial
              missions can push right, rebook, or demand new terms. This makes customer conditionality a timing and
              cash-collection risk, not just a sales risk.
