  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Dedicated European small launch
        - >-
          Launcher operations, range integration, payload processing, and orbit delivery for small/medium payloads from
          European soil
        - Satellite manufacturing, ground segment, deep-space transport
        - Institutional agencies, sovereign missions, integrators, constellation operators
        - Core monetization surface for Isar.
      - - Global dedicated small launch
        - Dedicated smallsat missions outside Europe where schedule control and orbit precision matter
        - Heavy-lift GEO missions and bulk rideshare-only demand
        - Commercial operators, brokers, allied agencies
        - Expands the opportunity beyond sovereign Europe but keeps the same service model.
      - - Institutional sovereign-access missions
        - ESA, EC, national-agency, and security-related launch procurement for European-built services
        - Generic research grants with no launch-service component
        - Public programme offices and ministry budgets
        - Key driver of early market formation.
      - - Constellation / integrator missions
        - Capacity reservations and bespoke launches for SEOPS-, ISISpace-, or Redwire-type payload aggregation
        - Pure software, satellite manufacturing, or downlink contracts
        - Constellation operators, mission-service firms, payload primes
        - Important commercial bridge to scale.
      - - Rideshare and medium-lift substitutes
        - >-
          Vega-C rideshare, Ariane 6 for larger missions, and comparable non-European options when dedicated timing is
          not essential
        - Missions needing mission-specific rendezvous geometry or sovereign launch rules
        - Buyers optimizing for lower price per kg
        - Real substitute set, but not a perfect replacement.
      - - Excluded adjacencies
        - None; this row exists to make the exclusions explicit
        - >-
          In-orbit servicing revenue, debris-removal service revenue, spaceport civil works, and general
          space-applications spend
        - Adjacent programmes and infrastructure owners
        - Prevents market-size inflation.
    notes: >-
      Defines the market around launch services rather than the full space economy and preserves both rideshare
      substitutes and non-launch adjacencies.
