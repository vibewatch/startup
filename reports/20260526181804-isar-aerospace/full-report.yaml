      - number: '2.5'
        title: Constraints, substitutes, and open sizing questions
        blocks:
          - type: paragraph
            body: >-
              The biggest constraint is that Europe may not have enough small-launch demand to support every would-be
              provider. SpaceNews quotes industry voices arguing the European market is only about one-fifth or
              one-sixth of the U.S. equivalent, and that consolidation is likely. That is not just a demand problem; it
              is a pricing problem. If many launchers chase a small sovereign and commercial opportunity set while
              heavier vehicles and rideshare remain available, price pressure arrives before reliability and cadence are
              fully proven.


              Reliability and operational risk remain material. Isar's first Spectrum flight cleared the pad and
              generated useful data, but it still lost control and was terminated after about 30 seconds. RFA suffered a
              destructive stage incident in static fire, and other European entrants were still pre-orbital when ESA
              chose its Launcher Challenge shortlist. For institutional buyers this does not kill demand—Europe is
              intentionally trying to build a service market—but it does mean procurement can stay milestone-driven,
              cautious, and concentrated in lower-consequence technology demonstrations until repeated flights work.


              The remaining market-sizing uncertainty is not a modelling flaw; it is an evidence gap. Public sources do
              not reveal Spectrum mission prices, take-rate by buyer segment, utilization assumptions, or how many
              manifest items are firm contracts versus options or policy-backed pilots. They also do not provide
              comparable public price cards across dedicated European small launch, rideshare, and medium-lift
              alternatives. The right conclusion is therefore not a speculative TAM, but a diligence ask: investors need
              private pipeline, pricing, and repeat-order data before turning today's demand signals into a real SAM or
              SOM.
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track procurement recurrence, not a generic space TAM
            body: >-
              The cleanest market insight is that Isar should be tracked through procurement recurrence and cadence, not
              through a grandiose space-economy TAM. The public numbers that matter are award counts, institutional
              programme rules, range throughput, and repeat missions, because those are the evidence-backed signals that
              tell you whether Europe is actually building a service market for commercial launch.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM014
              - CM042
          - type: callout
            title: The market can form before it becomes economically comfortable
            body: >-
              Europe may successfully create a sovereign small-launch market before it creates a comfortably profitable
              one. Demand signals are real, but prices are opaque, reliability is still being proven, and several
              providers are chasing a market that credible observers already describe as small relative to the United
              States. That combination can create strategic relevance without near-term pricing power.
            calloutType: risk
