      - number: '7.5'
        title: Europe wants new launch capacity, but the field is now crowded and unforgiving
        blocks:
          - type: paragraph
            body: >-
              The strategic backdrop is favorable for Isar because Europe still wants more sovereign launch capacity,
              yet the competitive backdrop is no longer empty. Ariane 6 and Vega are back in the market, Arianespace
              continues to ramp a backlog-heavy manifest, and ESA is explicitly sponsoring a broader field that includes
              RFA, MaiaSpace, PLD Space, and Orbex. Outside Europe, Electron already shows the flight-heritage bar for
              dedicated small launch. That means Isar does not just need “a market”; it needs to win a market where
              institutional support, manufacturing throughput, and trust are contested. The company’s own
              vertical-integration strategy partially reduces supplier dependence, but it also means launch, test, and
              production bottlenecks can show up inside Isar’s own system rather than at an external vendor boundary.
              The correct risk framing is therefore not that Europe lacks need for launch services. It is that too many
              programmes may be chasing too little near-term profitable cadence, while incumbents and better-proven
              challengers set the benchmark for reliability. The thesis breaks if Isar keeps slipping qualification,
              needs fresh capital before customer service begins, or fails to convert policy momentum into repeatable
              operational proof.
