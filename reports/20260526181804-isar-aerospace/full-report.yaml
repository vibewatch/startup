  summary: >-
    Isar Aerospace is a private European launch-services company founded in 2018 and based in Ottobrunn, Bavaria,
    Germany. The company is led by founders Daniel Metzler, Josef Fleischmann, and Markus Brandl and centers on
    Spectrum, a two-stage orbital launch vehicle targeting up to 1,000 kg to LEO and 700 kg to SSO for small and medium
