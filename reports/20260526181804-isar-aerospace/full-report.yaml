      - number: '5.4'
        title: Roadmap to cadence and serviceization
        blocks:
          - type: paragraph
            body: >
              The near-term roadmap is clearly oriented around shortening the gap between first-flight learning and a
              repeatable launch service. After the March 2025 test flight, Isar said vehicles #2 and #3 were already in
              production; by December 2025 it reported both stages of the second vehicle had passed 30-second integrated
              static-fire tests and were ready for final integration and launch operations. In parallel, the February
              2026 Esrange expansion added more acceptance-test capacity, while ESA stated its Boost support would
              continue into second-flight preparation and scale-up of the new Vaterstetten production system. This
              creates a recognizable launch-service workflow: build and integrate in Germany, qualify engines and stages
              in Sweden, transport to Norway, complete launch-campaign licensing and pad integration at Andøya, then
              execute a mission on the dedicated launch complex. Public demand signals also clarify what serviceization
              must support after orbit insertion is proven: SEOPS markets recurring access through a broker-managed
              LaunchLock Prime workflow, Astroscale frames ELSA-M around precise target-orbit delivery for
              debris-removal operations, and R-Space has already described repeat flights in 2026 and 2027 from the same
              Andøya stack. Maritime Launch Services widens the roadmap with a Nova Scotia letter of intent, but that
              path is still prospective because MLS says construction is underway. Andøya's own orbital-launch page
              still frames the completed range as a 30-mission-per-year, 90°-110.6° inclination service, underscoring
              that range evolution—not just vehicle performance—sits on the cadence path. The dependency structure is
              equally clear. Factory square meters and engine-test cells do not automatically create cadence if
              per-mission licensing, single-pad availability, unresolved flight anomalies, or the immaturity of any
              second-range option slow the launch campaign. The product roadmap therefore looks credible in
              infrastructure terms, but still contingent on vehicle #2 proving orbit insertion and post-flight
              turnaround discipline.
