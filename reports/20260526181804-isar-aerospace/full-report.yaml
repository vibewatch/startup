  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Primary buyer
      - Primary user
      - Payer / budget owner
      - Adoption trigger
      - Why dedicated European launch matters
    rows:
      - - ESA / EC tech-demo missions
        - ESA or EC programme office
        - Payload prime / mission integrator
        - Public R&D / innovation budget
        - Ready-to-fly IOD/IOV payload needing launch slot
        - European-launcher eligibility and policy support are explicit.
      - - National agency / defense / security
        - Space agency or ministry
        - Government operator or defence prime
        - Sovereign security / resilience budget
        - Surveillance, secrecy, or national-capability requirement
        - Launch from European soil can reduce dependency and information-sharing risk.
      - - EO / science / climate missions
        - Agency, weather organization, or science mission prime
        - Mission operator / scientific consortium
        - Public mission budget plus institutional co-funding
        - Orbit-specific sensing mission and schedule commitment
        - Polar / SSO access and dedicated timing can outweigh low price per kg.
      - - Constellation / integrator bookings
        - Constellation operator or launch broker / integrator
        - Operator and payload customers
        - Commercial capex and launch budget
        - Need for schedule control, deployment timing, or bespoke mission design
        - Dedicated launch can reduce waiting time and configuration compromise.
      - - In-orbit servicing / debris removal
        - Mission operator
        - Rendezvous / servicing team
        - Operator capital plus public-private support
        - Target orbit and phasing must match mission geometry
        - Dedicated insertion is more valuable than generic rideshare economy.
      - - Telecom / secure connectivity
        - Constellation operator or public connectivity programme
        - Network operator
        - Commercial telecom capex or sovereign-connectivity budget
        - Constellation deployment / replenishment
        - Often served by larger launchers today, but still a demand driver for the broader market.
    notes: >-
      Separates who signs the contract from who uses the mission and who ultimately funds it; that distinction is
