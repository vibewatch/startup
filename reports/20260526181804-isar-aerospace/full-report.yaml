    rows:
      - - Dedicated launch missions
        - Single-customer mission with negotiated orbit and launch date
        - Per mission
        - Publicly marketed and supported by named missions such as NOSA AOS, SEOPS, and Astroscale
        - Likely highest ASP and strongest customer lock-in, but no public price or margin disclosure
        - Provide signed contract value, milestone payments, cancellation rights, and recognition policy by mission
      - - Lead launch missions
        - Primary customer sets destination and schedule while secondary payloads share capacity
        - Per lead mission
        - Publicly offered on the website, but no named economics disclosed
        - Potentially monetizes schedule control while improving utilization, but realized pricing is opaque
        - Disclose lead-launch ASP versus dedicated and rideshare equivalents
      - - Rideshare missions
        - Shared flight to a predetermined orbit with standardized integration
        - Per slot / per kg
        - Publicly offered on the website, but no Isar rate card is posted
        - Could lift utilization and cost absorption if cadence is real, but public evidence is pricing-blind
        - Provide standard rideshare price card, minimum booking size, and integration fees
      - - Institutional launch contracts
        - Mission contracts with ESA, EC, and national agencies, sometimes with co-funding
        - Per contract / mission
        - AOS, Flight Ticket, and ΣYNDEO-3 establish a clear government and EU demand lane
        - Strong reference-customer value, but subsidy versus pure commercial mix is undisclosed
        - Separate launch-service revenue from subsidy income and show institutional gross margin
      - - Commercial constellation / mission contracts
        - Negotiated launch services for commercial payload operators needing orbit specificity
        - Per contract / mission
        - SEOPS, Astroscale, and R-Space show a commercial manifest into 2028
        - Useful backlog signal, but contract value and customer concentration remain private
