      - number: '4.3'
        title: Cost structure, manufacturing intensity, and scale requirements
        blocks:
          - type: paragraph
            body: >-
              The public record makes Isar’s cost structure look unmistakably hardware-heavy. The company is building a
              roughly 40,000 square-meter production and headquarters site near Munich, targeting more than 30 and in
              some official materials up to 40 Spectrum vehicles per year, while simultaneously expanding its Esrange
              footprint to test more than 30 engines per month and perform integrated stage acceptance tests. That sits
              on top of an exclusive first launch pad at Andøya and the working-capital burden of engines, tanks,
              structures, avionics, and launch-operations readiness. The first Spectrum flight also failed after roughly
              30 seconds, which is not unusual for a new launcher but still matters financially because failed or
              incomplete test flights consume engineering labor, hardware, range time, and insurance or contingency
              capacity before they generate revenue. ESA’s Boost! rules sharpen the point further: civil works and
              general-purpose infrastructure are not eligible for Boost! 1 co-funding, so the biggest industrial assets
              still have to be funded privately or through site-specific counterparties. Even before current cash burn
              is disclosed, the business reads like a classic scale-manufacturing launch company whose unit economics
              depend on volume and learning curves, not a lightly capitalized services platform.
