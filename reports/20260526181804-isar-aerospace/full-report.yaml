  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: dedicated small-launch services, not all space spending'
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace's direct market boundary starts with dedicated orbital launch services for small and medium
              satellites, not with the full space economy. Spectrum is published as a 28 m, two-stage launcher aimed at
              small and medium satellites and constellations, with about 1,000 kg to LEO and 700 kg to SSO. That places
              Isar in the lane where buyers care about orbit choice, schedule control, and not being relegated to a
              secondary rideshare slot. Included spend therefore centers on launch-vehicle operations, range and mission
              integration, and orbit delivery for payloads that fit this class. Excluded spend should include satellite
              manufacturing, ground segment, pure in-orbit servicing revenue, deep-space transportation, and heavy-lift
              launch markets that rely on much larger vehicles.


              Geography matters because Isar is building around Andøya Spaceport rather than a generic global launch
              abstraction. The Norwegian regulator says the site has a permit for up to 30 launches per year at full
              build-out, but also notes that it currently has a single pad used exclusively by Isar. Andøya positions
              itself around polar and sun-synchronous missions, which is a particularly relevant orbit set for Earth
              observation, surveillance, climate, and technology-demonstration payloads. That means the market boundary
              is partly technical and partly sovereign: launch from Europe, on a European launcher, into the
              high-latitude orbital regimes many public and security-sensitive customers actually need.


              The boundary also has to preserve substitutes. Buyers that do not need dedicated Spectrum service can
              choose Vega-C rideshare, Ariane 6 for larger missions, or non-European providers. But those alternatives
              are not perfect substitutes when the mission needs a dedicated manifest, precise rendezvous or
              debris-removal geometry, or launch from European soil for security, resilience, or institutional-programme
              reasons. In other words, Isar does not sell against all launch supply equally; it competes in the narrower
              decision zone where dedicated small launch is worth paying for.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
