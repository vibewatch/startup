      - number: '6.4'
        title: Durability, concentration, and cancellation risk remain the key customer unknowns
        blocks:
          - type: paragraph
            body: >-
              The public customer set is concentrated by both count and infrastructure. All visible launch demand in the
              reviewed sources is attached to a small number of named counterparties, and every mission-specific
              agreement points to Andøya except the Maritime Launch expansion path. Norway's regulator says the
              spaceport can ultimately support up to 30 launches per year, but there is only one pad today and it is
              used exclusively by Isar. That exclusivity is commercially helpful because it gives the company a
              dedicated range position; it is also a single-point failure because regulatory interruption, pad damage,
              or delayed readiness can affect the whole visible backlog.


              Cancellation and durability evidence is even thinner. No public source reviewed disclosed NRR, GRR, churn,
              launch-service renewal rate, backlog share by customer, or contract economics for the named customers. The
              first test flight failure does not appear to have driven a public customer exodus, but it does keep
              execution risk front and center until Spectrum reaches orbit and begins serving real payloads on schedule.
              SpaceNews and other industry analysis also warn that the European microlauncher field may consolidate
              because demand may not support every entrant. That makes Isar's customer concentration risk two-layered:
              near term it must prove that its handful of named counterparties actually convert into launches, and
              longer term it must prove that those references can compound into repeat business before competitive
              shakeout compresses the market.
