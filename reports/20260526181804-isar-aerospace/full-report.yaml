      - number: '8.4'
        title: Scenario Ranges, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases are separated less by TAM rhetoric than by milestones. In the bull case,
              the next Spectrum flights work, Flight Ticket missions translate into repeat institutional procurement,
              and sovereign-launch policy turns Isar into a semi-strategic infrastructure asset with another supportive
              financing on cleaner terms. In the base case, Isar remains one of Europe's best-funded independent
              launchers and keeps strategic relevance, but the valuation mostly treads around the 2025 unicorn line
              because disclosure and economics still lag the narrative. In the bear case, more launch delay meets
              continuing factory and test spend, pushing the company into a financing reset where the convertible
              re-prices on less favorable terms.


              That is why today's range should stay broad. A public-only €0.8 billion to €1.6 billion band is more
              defensible than treating the latest >€1 billion mark as a fully cleared fair value: the lower end captures
              failed-milestone and funding-risk downside, while the upper end preserves strategic option value if Europe
              keeps rewarding new sovereign launch capacity. The band is intentionally humble because audited revenue
              and cash data are unavailable.


              The diligence list is therefore simple and decisive. Before moving from research-more to buy, investors
              need audited or lender-grade cash and burn data, the Eldridge convert terms and cap-table stack,
              contract-level backlog economics, insurance and liability structure, and a clearer cost-per-flight path
              after return to flight. Without that package, the right stance remains strategic curiosity rather than
              aggressive underwriting.
