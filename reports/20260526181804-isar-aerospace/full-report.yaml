    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace was founded in 2018 to build a privately financed European launch-services company around
              small and medium satellite missions. Current official copy describes the business as a launch service
              provider headquartered near Munich, while older company releases and TUM-linked coverage place that
              headquarters more specifically in Ottobrunn near Munich; those phrasings are consistent enough to treat
              Ottobrunn-near-Munich as the canonical location. The core product is Spectrum, a two-stage orbital launch
              vehicle designed for small and medium satellites and constellations. Official and third-party technical
              descriptions converge on payload targets of up to 1,000 kilograms to low Earth orbit and 700 kilograms to
              sun-synchronous orbit, with Isar stressing in-house design, manufacturing, and testing as its main cost
              and schedule lever. The company’s public footprint is also no longer just a workshop-scale startup story:
              current materials say it has more than 400 employees from more than 50 nations across five international
              locations, and they pair that scale claim with a future serial-production target of up to 40 Spectrum
              vehicles per year once the new Munich-area facility and associated test infrastructure are fully online.
