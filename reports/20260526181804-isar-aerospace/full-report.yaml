  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No clean return to flight in 2026
        - Second Spectrum campaign slips materially or fails to restore confidence
        - Turns sovereign optionality into a longer-dated hope asset instead of an investable milestone story
        - Move to bear-case underwriting and assume the next financing prices urgency, not strength.
      - - Institutional wins do not compound
        - Flight Ticket missions remain one-off references instead of opening repeat ESA / EC / national demand
        - Weakens the strategic-value argument that supports Isar above pure near-term cash metrics
        - Cut the sovereign optionality premium in the valuation range.
      - - Factory and test build-out outruns funding capacity
        - New sites and production assets expand while cash, burn, or working-capital visibility stays poor
        - Converts vertical integration from moat narrative into capital overhang
        - Assume higher dilution risk and lower common-equity value capture.
      - - Peer field keeps crowding the market
        - RFA, Maia, HyImpulse, Avio, Ariane, or other providers absorb Europe's marginal demand
        - Prevents Isar from translating policy support into pricing power or slot scarcity
        - Use lower-end peer anchors and wider downside haircuts.
      - - Convert terms prove investor-friendly to new money
        - The Eldridge instrument or next round introduces heavy dilution, seniority, or reset pricing
        - Changes who captures enterprise value even if the business survives strategically
        - Do not rely on enterprise-value headlines without cap-table underwriting.
    notes: >-
      These are monitorable kill criteria rather than generic risks. Each one changes the valuation case directly, not
      just narrative sentiment.
