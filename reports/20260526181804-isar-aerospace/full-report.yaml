      - number: '7.4'
        title: Capital intensity remains high even after large financing rounds
        blocks:
          - type: paragraph
            body: >-
              Isar has raised substantial capital by European launcher standards, but the funding history does not
              eliminate financing risk; it proves how capital hungry the model still is. The company raised more than
              €310 million by 2023, more than €400 million by mid-2024, and then added a €150 million convertible bond
              from Eldridge in 2025. Public reporting put total private funding above €550 million after that
              transaction. At the same time, Isar is building a new Munich production campus, scaling test capacity,
              carrying multiple vehicles in work-in-process, and trying to move from prototype cadence to industrial
              cadence before recurring launch revenue is visible. Management has responded by elevating former VP
              Production Björn Dressler to COO with an explicit mandate over output, quality, cost efficiency,
              automation, and the move into the new Munich headquarters. That is a sensible mitigation, but it also
              underlines how much operating-system buildout is still in front of the company. ESA’s Boost! money and
              NATO-backed investment improve credibility and help bridge specific milestones, but ESA describes its
              programme as co-funding and procurement support, not full-stack launcher financing. The practical
              implication is that Isar’s balance sheet still has to absorb the period between qualification flights and
              reliable commercial service. Without public visibility on burn, unit economics, or the bond’s conversion
              terms, investors cannot assume that current capital is enough to get to self-sustaining cadence without
              another financing event.
            claimRefs:
