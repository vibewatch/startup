      - number: '4.5'
        title: Financial verdict, margin path, and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The public verdict should be constructive on financing access and demand formation, but conservative on
              revenue quality and margin path. Isar clearly has a real product, visible contract momentum, major public
              and private backers, and a manufacturing and testing footprint far beyond slideware. Historical filing-
              derived losses also confirm the company is spending at industrial scale rather than operating as a thinly
              staffed R&D shell. At the same time, the chapter does not support underwriting current revenue, cash burn,
              or launch profitability. There is no public recognized-revenue series, no public launch-level ASP, no
              public gross margin by configuration, no public insurance-cost view, and no public cash or runway
              disclosure. The company may still be the best-capitalized independent launcher in Europe, but that is not
              the same as proving attractive unit economics. My read is therefore positive on backlog formation,
              strategic relevance, and access to funding, but cautious on realized margins and financing dependence
              until management opens the data room on backlog value, launch pricing, deposits, gross margin, cash burn,
              and bond terms.
