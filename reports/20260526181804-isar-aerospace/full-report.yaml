  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, contract mix, and the private-disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Isar is selling launch services, not a software subscription and not a pure government-R&D program. Its
              homepage offers dedicated, lead, and rideshare configurations, while the public contract set now spans the
              Norwegian Space Agency’s Arctic Ocean Surveillance satellites, ESA and European Commission Flight Ticket
              missions, the ΣYNDEO-3 programme, SEOPS, Astroscale, and R-Space. That mix shows a clear likely revenue
              model: negotiated mission contracts tied to orbit, schedule, payload integration, and launch execution,
              with some institutional flights benefiting from public co-funding. What the company does not disclose is
              just as important. The website references “pricing options” but no posted rate card; there is no public
              backlog value, no deposit schedule, no cancellation framework, no recognized-revenue bridge, and no
              disclosure of customer concentration. North Data exposes that filing-derived financial indicators exist,
              but even there current revenue remains censored. The result is a company that is plainly commercial and
              visibly winning missions, yet still private-undisclosed on the metrics needed to judge revenue quality the
              way an investor would judge a transparent launch operator or a public industrial company.
