      - number: '5.2'
        title: Industrial footprint, production system, and engine test stack
        blocks:
          - type: paragraph
            body: >
              The technical heart of Isar's thesis is not just the rocket but the production system around it. The
              company repeatedly describes Spectrum as almost entirely designed, manufactured, and tested in-house,
              pairing additive manufacturing, carbon-composite know-how, software, avionics, structures, and propulsion
              inside one vertically integrated stack. That stack now spans three specialized sites: a Vaterstetten
              campus near Munich for development and series production, Esrange in Sweden for engine and stage
              acceptance testing, and Andøya in Norway for launch operations. Public evidence on Aquila is stronger on
              endurance testing than on full performance disclosure: before first flight, Isar reported 260-second
              integrated hotfires and six firings of one engine without refurbishment, and in February 2026 it added a
              second Esrange facility designed for more than 30 engine tests per month plus integrated stage acceptance
              tests. The VGP-backed Vaterstetten campus adds more than 40,000 square meters for production, development,
              and headquarters functions. Together, these disclosures make Isar's manufacturing footprint unusually
              concrete for a European launcher startup, although actual recurring throughput remains unproven in
              commercial operations.
