      - number: '5.3'
        title: Launch operations, safety controls, and readiness evidence
        blocks:
          - type: paragraph
            body: >
              Launch operations are a meaningful part of Isar's product because Spectrum is bundled with a specific
              European range configuration rather than sold as a launcher abstracted from infrastructure. Isar has
              exclusive access to the current orbital launch pad at Andøya Spaceport, and the first pad was built to
              Isar's specifications with payload integration facilities and mission control. The site geometry supports
              polar and sun-synchronous missions, which fits Spectrum's small-satellite target market. Regulatory
              readiness is visible but exacting: the Civil Aviation Authority Norway notes that the spaceport has an
              operating permit and can eventually support up to 30 launches per year as more pads are built, but today
              only one pad exists and Isar must obtain a permit for each launch. The regulator also imposes secure-area
              and access controls around testing, fueling, transport, and launch operations. The March 2025 first flight
              therefore mattered operationally even though it did not reach orbit: Spectrum cleared the pad, flew for
              roughly 30 seconds, validated the flight-termination system, and left the launch pad intact. That
              de-risked ground systems and range integration more than mission assurance, because the public record
              still lacks a root-cause writeup for the loss of control during ascent.
