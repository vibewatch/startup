      - number: '5.5'
        title: Technical differentiation versus European peers
        blocks:
          - type: paragraph
            body: >
              Spectrum sits in a crowded but heterogeneous European launcher field. Relative to Rocket Factory Augsburg,
              Isar fields a simpler two-stage system instead of a three-stage vehicle with a separate orbital transfer
              stage and oxygen-rich staged-combustion engines. Relative to Maia, Spectrum forgoes reusability and
              methane in favor of an expendable propane launcher with fewer public subsystems to qualify. Relative to
              HyImpulse, it avoids hybrid propulsion and the aggressive cadence claims attached to that architecture.
              Against global small-launch references, Spectrum offers materially more payload than Rocket Lab Electron
              and roughly the same class as Firefly Alpha, but without Electron's kick-stage heritage or Firefly's
              already demonstrated operational responsiveness. Against Europe's incumbent path, Vega C is larger, more
              institutional, and operationally more mature. The result is a differentiated but narrow wedge: Spectrum is
              best understood as a high-payload European microlauncher built around vertical integration and
              continental-European range access rather than around reusability, kick-stage precision, or institutional
              flight heritage. That could be a strong position if Isar reaches orbit and stabilizes cadence quickly; if
              not, the crowded peer set and Europe's still-limited launch demand compress the time available for
              Spectrum to convert technical promise into durable launch economics.
