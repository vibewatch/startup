    data:
      nodes:
        - id: n1
          label: 2025 financing anchor
          detail: €150m Eldridge convertible; independent coverage says >€1bn unicorn value
        - id: n2
          label: Strategic upside
          detail: Europe wants independent launch capacity and has already started buying commercial missions
        - id: n3
          label: Launch-risk discount
          detail: First Spectrum flight ended after ~30 seconds without orbit
        - id: n4
          label: Capital intensity
          detail: Factory, test, and range build-out still require large pre-scale spending
        - id: n5
          label: Disclosure gap
          detail: No audited revenue, cash, or margin evidence in the public packet
        - id: n6
          label: Comp dispersion
          detail: Rocket Lab and Avio show that proof and disclosure dominate value
        - id: n7
          label: Current recommendation
          detail: Research more / track; valuation stance stretched
      edges:
        - from: n1
          to: n7
          label: Provides anchor
        - from: n2
          to: n7
          label: Supports option value
        - from: n3
          to: n7
