      - number: '3.4'
        title: Moat durability, switching costs, and adverse risk
        blocks:
          - type: paragraph
            body: >-
              Isar's moat is real but moderate. The strongest defensible asset in the reviewed record is not a secret
              propulsion breakthrough or a public price advantage; it is access and positioning. Isar has exclusive use
              of the only currently active orbital pad at Andøya, and European institutions have already attached two
              Flight Ticket missions to Spectrum. That combination matters because sovereign customers often care about
              range control, political alignment, and future European autonomy, not just sticker price. In the short
              run, that can keep Isar relevant before it has an orbital success.


              The adverse case is equally clear. Exclusive pad access does not solve the hardest commercial questions:
              whether Spectrum can reach orbit reliably, how fast Isar can convert factory ambition into flown cadence,
              and whether customers will pay for a dedicated European launcher when Vega C, Electron, or Falcon 9 can
              already carry the mission. Switching costs in launch are mostly schedule and integration costs, not true
              lock-in. Buyers can multi-home procurement, rebook manifests, or redesign toward rideshare if the
              dedicated launcher slips. That means Isar's moat will harden only after repeated orbital successes and
              visible cadence. Until then, it benefits from sovereign procurement support, but it remains exposed to
              substitute capture and a likely European consolidation cycle.
