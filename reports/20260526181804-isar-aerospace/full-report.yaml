        - ESA and company materials emphasize capable light satellites and constellation deployment
        - Keeps dedicated-launch value proposition relevant
        - Ask for customer pipeline split between single sats, batches, and replenishment.
      - - Too many providers for limited European demand
        - Constraint
        - 2026-now
        - Industry commentary points to likely consolidation
        - Could compress price and delay profitability
        - Demand backlog by provider and win-rate by mission type are critical diligence asks.
