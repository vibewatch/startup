summary:
  headline: Isar Aerospace 对欧洲私人运载火箭来说兼具罕见战略价值、融资能力和真实发射进展，但在尚未入轨、商业披露不清、可转债条款不透明之前， 它更像继续研究标的，而不是可承销的买入。
