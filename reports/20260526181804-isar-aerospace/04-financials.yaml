- id: capital-stack-and-adequacy
  title: Capital stack, funding structure, and adequacy for the next phase
  body: 'Isar’s capital stack is the strongest part of the public file, but it is not simple. The company
    disclosed a $165 million (€155 million) Series C in March 2023, then extended that round by more than
    €65 million in June 2024 to more than €220 million, taking total funding above €400 million at that
    point. The next leg was different in character: Eldridge’s €150 million instrument was framed as a
    convertible bond, adding a debt-like layer that can later convert to equity. ESA has also contributed
    more than €15 million through Boost!, and the company is shortlisted for a European Launcher Challenge
    process that could allocate up to €169 million, though that funding is not guaranteed. This is enough
    public evidence to say Isar has much better financing access than most European launcher peers. It
    is not enough to say the company is fully financed. The current cash balance, monthly burn, runway,
    debt service burden, customer prepayment profile, and security terms on the Eldridge instrument are
    all undisclosed. Given the ongoing return-to-flight work, factory ramp, testing expansion, and possible
    multi-range footprint, the right conclusion is robust capital access but still incomplete capital-adequacy
    visibility.'
  claimRefs:
