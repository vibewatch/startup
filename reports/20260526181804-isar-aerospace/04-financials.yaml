- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public reading
  - Evidence quality
  - Implication
  - Diligence ask
  rows:
  - - Series C (2023)
    - $165M / €155M disclosed in March 2023
    - Medium
    - Established a large private financing base before commercial launch operations
    - Confirm close date, tranche timing, and post-close cash balance
  - - Series C extension (2024)
    - '>€65M extension took Series C above €220M'
    - Medium
    - Added material scale-up capital ahead of first flight and series production
    - Provide exact cap table impact and investor rights for the extension
  - - Total funding floor by mid-2024
    - Company said funding exceeded €400M since foundation
    - Medium
    - Supports the view that Isar is unusually well funded for a European launcher
    - Provide reconciled lifetime equity and grant schedule
  - - Homepage latest funding claim
    - Website later states €500M+ private capital raised
    - Low
    - Suggests another updated funding floor, but the exact bridge to earlier figures is not public
    - Provide dated funding ledger showing what is included in the €500M+ claim
  - - Eldridge financing (2025)
    - €150M announced as a convertible bond / financing agreement
    - High on amount / medium on terms
    - Adds major growth capital but also potential debt-like obligations before conversion
    - Disclose coupon, maturity, conversion price, security, covenants, and ranking
  - - ESA Boost! support
    - '>€15M contract to support first/second flight prep, series production, and next-generation engines'
    - High
    - Helpful non-dilutive support, but not enough to finance the full industrial base alone
    - Show grant accounting treatment and cash receipt schedule
  - - European Launcher Challenge
    - Up to €169M available if member states approve a later award
    - Medium
    - Could extend runway or finance vehicle upgrades, but should not be treated as cash today
    - Provide probability-weighted funding plan with and without ELC support
  - - Industrial footprint versus funding need
    - 40,000 sqm production site, >30 engines/month test capacity, exclusive Andøya pad, and potential
      Nova Scotia expansion all sit in front of cash generation
    - High on footprint / low on cost detail
    - Capital access is proven, but capital sufficiency is not yet observable
    - Provide capex split, landlord commitments, and 24-month financing plan
  - - Cash, burn, and runway
    - No public disclosure found
    - High on absence of disclosure
    - This is the core blocker preventing a true solvency or runway judgment
    - Provide latest cash balance, monthly burn, and base/downside runway
  notes: Public sources establish round sizes and support mechanisms, but not the current balance-sheet
    position or full financing obligations.
