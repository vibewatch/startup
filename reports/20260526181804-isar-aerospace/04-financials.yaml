company:
  name: Isar Aerospace
chapter:
  number: 4
  title: Financials
  summary: Isar Aerospace’s public financial file supports a credible launch-services business model and
    unusually strong capital access, but it remains private-undisclosed on current revenue, cash, burn,
    realized pricing, and margins. Public evidence shows more than €400 million raised by mid-2024, a
    €150 million Eldridge convertible bond in 2025, more than €15 million of ESA Boost! support, and possible
    but not guaranteed eligibility for up to €169 million from ESA’s European Launcher Challenge, while
    the company is simultaneously funding a 40,000 square-meter production site, a >30-engines-per-month
    test expansion, and a return-to-flight campaign after a failed first launch. The right underwriting
    read is positive on backlog formation, sovereign-demand relevance, and access to capital, but cautious
    on unit economics and runway because launch pricing is opaque and the public record still does not
    disclose recognized revenue, gross margin, or current liquidity.
sections:
- id: revenue-model-and-private-disclosure-gap
  title: Revenue model, contract mix, and the private-disclosure gap
  body: 'Isar is selling launch services, not a software subscription and not a pure government-R&D program.
    Its homepage offers dedicated, lead, and rideshare configurations, while the public contract set now
    spans the Norwegian Space Agency’s Arctic Ocean Surveillance satellites, ESA and European Commission
    Flight Ticket missions, the ΣYNDEO-3 programme, SEOPS, Astroscale, and R-Space. That mix shows a clear
    likely revenue model: negotiated mission contracts tied to orbit, schedule, payload integration, and
    launch execution, with some institutional flights benefiting from public co-funding. What the company
    does not disclose is just as important. The website references “pricing options” but no posted rate
    card; there is no public backlog value, no deposit schedule, no cancellation framework, no recognized-revenue
    bridge, and no disclosure of customer concentration. North Data exposes that filing-derived financial
    indicators exist, but even there current revenue remains censored. The result is a company that is
    plainly commercial and visibly winning missions, yet still private-undisclosed on the metrics needed
    to judge revenue quality the way an investor would judge a transparent launch operator or a public
    industrial company.'
