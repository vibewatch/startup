- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / benchmark
  - Public price clue
  - Contract model
  - What is disclosed
  - What is not disclosed
  - Interpretation
  rows:
  - - Isar dedicated launch
    - No public list price
    - Negotiated mission contract
    - Customer controls orbit and launch timing
    - List price, discounts, insurance, deposits, and realized ASP
    - Likely where Isar captures its biggest sovereignty and schedule premium
  - - Isar lead launch
    - No public list price
    - Negotiated primary-payload contract
    - Primary customer sets destination and timing while others share capacity
    - Lead-customer premium versus dedicated or rideshare pricing
    - Middle ground between dedicated economics and rideshare utilization
  - - Isar rideshare
    - No public list price
    - Standardized shared mission
    - Predetermined orbit with shared capacity
    - Per-kilogram tariff, booking minimums, and integration surcharge
    - Useful for utilization, but public data does not show whether it is margin accretive
  - - ESA Flight Ticket missions
    - €5M maximum award per launch opportunity
    - Competitive institutional procurement
    - Co-funded access for ready-to-fly IOD/IOV missions
    - Whether the award approximates, subsidizes, or only partially covers a commercial Spectrum flight
    - A public subsidy ceiling, not a clean Isar price card
  - - Deeptech.Build estimate
    - ≈ €10,000/kg to orbit
    - Secondary pricing estimate
    - Directional media estimate for Isar economics
    - Methodology, utilization assumption, and actual booked price
    - Useful as a ceiling-like signal only; not an official quote
  - - SpaceX rideshare benchmark
    - $350k for 50kg to SSO plus $7k/kg additional mass
    - Standardized rideshare purchase
    - Official price for non-dedicated launch access
    - Dedicated orbit control, exact schedule, and sovereign-access premium
    - Shows why Isar must sell schedule/orbit control and not just cheap kilograms
  - - HyImpulse cost claim
    - “Half the current launch cost” for dedicated 600kg LEO missions
    - Competitor self-description
    - Another European launcher is already positioning explicitly on price
    - Actual list price and customer adoption
    - Reinforces that European small-launch pricing pressure will intensify as peers commercialize
  notes: Isar itself discloses packaging but no public list price; external rows are signals that bracket
    likely monetization rather than evidence of Isar’s realized ASP.
