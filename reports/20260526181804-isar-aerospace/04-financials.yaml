- id: TI003
  title: Unit economics table
  columns:
  - Metric / proxy
  - Public value or signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Payload ceiling
    - 1,000 kg to LEO / 700 kg to SSO
    - High
    - Sets the revenue ceiling per flight and frames which payload classes justify dedicated launch economics
    - Provide realized payload mix and average sold kilograms per mission
  - - Visible manifest depth
    - Named missions extend from 2026 through 2028 across ESA, NOSA, SEOPS, Astroscale, and R-Space
    - Medium
    - Supports backlog formation, but not contract value or conversion certainty
    - Provide signed backlog €, deposits, and probability-adjusted launch schedule
  - - Site capacity ceiling
    - Andøya permit allows up to 30 launches per year at full build-out; one Isar-exclusive pad exists
      today
    - High
    - Distinguishes theoretical operations capacity from actual near-term single-pad cadence
    - Provide pad expansion plan, marginal launch cost, and range-availability assumptions
  - - Factory throughput target
    - Official statements range from >30 to 40 Spectrum vehicles per year
    - High
    - Implies a large fixed-cost base that only pays off at volume
    - Provide breakeven launches per year and required utilization for positive gross margin
  - - Engine test throughput
    - '>30 engines per month at Esrange plus integrated stage acceptance testing'
    - Medium
    - Signals industrial-scale test spending and future cadence ambition
    - Provide engine unit cost, acceptance yield, and test cost per engine
  - - Historical loss trend
    - North Data lists losses of €10.7M (2020), €21.3M (2021), €66.6M (2022), and €61.3M (2023)
    - Medium
    - Confirms scale-up burn and heavy pre-revenue industrial spending
    - Provide 2024-2026 burn, cash runway, and burn split between R&D, production, and launch ops
  - - External price floor signal
    - SpaceX rideshare is $350k for 50kg to SSO plus $7k/kg additional mass
    - High for benchmark / low for transferability
    - Shows what customers can buy when schedule control and sovereign access are less important
    - Provide Isar win-loss analysis versus rideshare and premium justified per mission type
  - - Public revenue opacity
    - No public recognized revenue, gross margin, or realized launch-price disclosure found
    - High
    - Prevents conventional CAC, payback, or gross-margin underwriting
    - Provide recognized revenue by quarter, launch-level ASP, gross margin, and insurance cost per mission
  - - Competitor capacity band
    - Electron 300 kg LEO; RFA ONE 1,300 kg SSO; SL1 600 kg LEO; Alpha 1,030 kg LEO; Maia 1,500 kg SSO
      expendable
    - Medium
    - Frames where Spectrum sits in the dedicated-launch decision set
    - Provide actual win-rate by payload class and orbit versus named competitors
  notes: Because Isar is private-undisclosed on revenue and margins, public unit economics are mostly
    capacity, cadence, and market-benchmark proxies.
