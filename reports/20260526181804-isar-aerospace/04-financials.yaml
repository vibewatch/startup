- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: The public file shows cash demand concentrated in industrial capacity, testing, launch infrastructure,
    and reliability iteration rather than in software-like opex.
  approximationNotes: This matrix is directional and evidence-backed; it does not assign undisclosed euro
    values to internal capex or burn buckets.
  claimRefs:
  - CI025
  - CI030
  - CI031
  - CI032
  - CI036
  - CI037
  - CI038
  - CI054
  - CI057
  data:
    columns:
    - Public signal
    - Cash effect
    - Margin effect
    - Underwriting readout
    rows:
    - label: Munich series-production facility
      values:
      - label: 40,000 sqm HQ and production build-out with automation
        tone: neutral
      - label: Requires tooling, fit-out, and working capital before launch cash arrives
        tone: warning
      - label: Can dilute unit cost only if cadence gets high enough
        tone: warning
      - label: Need lease terms, fit-out split, and breakeven volume
        tone: warning
    - label: Esrange testing expansion
      values:
      - label: '>30 engines/month plus integrated stage acceptance capability'
        tone: neutral
      - label: Adds test-equipment and specialized staffing cost
        tone: warning
      - label: Could shorten iteration cycles and improve throughput
        tone: positive
      - label: Need engine test cost, yield, and scrap data
        tone: warning
    - label: Andøya launch infrastructure
      values:
      - label: Exclusive first pad with permit path to 30 launches/year at full build-out
        tone: neutral
      - label: Pad operations, range, and maintenance cost scale with cadence
        tone: warning
      - label: Site control can support premium dedicated missions
        tone: positive
      - label: Need marginal launch cost and pad expansion timing
        tone: warning
    - label: First-flight failure and iteration
      values:
      - label: 'First launch ended at T+30 seconds; pad intact; vehicle #2 advanced'
        tone: warning
      - label: Consumes engineering time and possible reserve cash before revenue ramps
        tone: warning
      - label: Rapid return-to-flight can improve the learning curve
        tone: positive
      - label: Need failure reserve, insurance cost, and rework budget
        tone: warning
    - label: Mixed funding stack
      values:
      - label: Equity rounds, convertible bond, ESA co-funding, and possible ELC support
        tone: positive
      - label: Provides more funding sources than most European peers
        tone: positive
      - label: Bond terms and subsidy reliance are still opaque
        tone: warning
      - label: Need debt schedule, grant accounting, and covenant detail
        tone: warning
    - label: Potential Nova Scotia expansion
      values:
      - label: LOI opens a new range and orbit-access path
        tone: neutral
      - label: Could add future site integration and business-development spend
        tone: warning
      - label: May widen addressable orbits and government demand
        tone: positive
      - label: Need capex responsibility and first-revenue timing before underwriting
        tone: warning
