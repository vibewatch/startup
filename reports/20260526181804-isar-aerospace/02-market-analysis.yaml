callouts:
- calloutType: insight
  title: Track procurement recurrence, not a generic space TAM
  body: |-
    The cleanest market insight is that Isar should be tracked through procurement recurrence and cadence, not through a grandiose space-economy TAM. The public numbers that matter are award counts, institutional programme rules, range throughput, and repeat missions, because those are the evidence-backed signals that tell you whether Europe is actually building a service market for commercial launch.
  claimRefs:
  - CM007
  - CM008
  - CM011
  - CM014
  - CM042
- calloutType: risk
  title: The market can form before it becomes economically comfortable
  body: |-
    Europe may successfully create a sovereign small-launch market before it creates a comfortably profitable one. Demand signals are real, but prices are opaque, reliability is still being proven, and several providers are chasing a market that credible observers already describe as small relative to the United States. That combination can create strategic relevance without near-term pricing power.
  claimRefs:
  - CM036
  - CM037
  - CM039
  - CM041
  - CM043
