  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-gaps
    missingEvidence: A public revenue TAM for European small launch that cleanly separates launch-service spend from subsidies, range infrastructure, and broader space-economy spending.
    whyItMatters: Without a clean market boundary in revenue terms, broad space-economy or sovereign-space narratives can easily overstate what Isar can monetize.
    diligencePath: Request management's internal market-definition memo showing which mission types, buyer classes, and geographies are included in pipeline sizing and which are excluded.
    relatedQuestionRefs:
    - QM004
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: blocking
    topic: sam-som-gap
    missingEvidence: Customer-level manifest data with firm contracts, options, indicative pricing, and expected cadence by buyer segment.
    whyItMatters: Public data cannot isolate SAM or SOM without knowing how many of the visible missions are real backlog, what price customers pay, and how much of Andøya's theoretical capacity is usable.
    diligencePath: Obtain closed-book pipeline data covering institutional, defence, EO, telecom, servicing, and integrator demand plus expected utilization by launch year.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: Comparable public or customer-confirmed price cards for dedicated European small launch versus rideshare and medium-lift substitutes.
    whyItMatters: Price pressure is central to adoption, but current public evidence is mostly qualitative and does not reveal willingness-to-pay or elasticity by mission type.
    diligencePath: Ask management for recent quote data, lost-deal analysis, and pricing versus rideshare, Vega-C, Electron, and other relevant alternatives.
    relatedQuestionRefs:
    - QM025
    - QM026
    relatedTableRefs:
    - TM004
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segments
    missingEvidence: Revenue or backlog split by institutional, defence, EO, constellation, telecom, and servicing customer classes.
    whyItMatters: The buyer map is evidence-backed qualitatively, but valuation depends on which segments recur and which are merely strategic references.
    diligencePath: Request a segment-level bookings and backlog breakdown, including mission criticality, repeat-order frequency, and expected contract duration.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
