- id: buyer-segmentation
  title: Buyer, user, and payer segmentation
  body: |-
    The clearest buyer cluster is institutional. Isar's visible customer and programme set already includes ESA, the European Commission, the Norwegian Space Agency, and missions linked to DLR, the UK Space Agency, and European IOD/IOV programmes. In these cases, the buyer is often an agency or programme office, the payload integrator or prime contractor is the operational user, and the economic payer is a public R&D, security, or industrial-policy budget. This matters because adoption is governed by procurement logic rather than consumer demand: who owns the programme, who signs the launch contract, and whether the mission requires a European launcher.

    The second cluster is commercial or quasi-commercial mission aggregation. SEOPS is buying capacity for LaunchLock Prime customers; ISISpace and Redwire aggregate or integrate multi-payload missions; and dedicated launch is part of how these intermediaries give end customers control over timing and target orbit. The third cluster is missions where orbital precision and sovereignty are especially valuable: debris removal, in-orbit servicing, Arctic surveillance, and other missions that do not fit comfortably into generic rideshare slots. Astroscale's ELSA-M and Infinite Orbits' Tom & Jerry are good examples because their mission success depends on specific rendezvous geometry rather than just cheap kilograms to orbit.

    A fourth cluster sits in the broader market even when Isar is not yet the dominant provider: EO, climate, telecom, and secure-connectivity missions. GapMap-1, Pluto+, SMILE, Kuiper, and IRIS² illustrate that the underlying buyer jobs are diverse—surveillance, weather, climate sensing, broadband, and secure communications. That diversity helps demand quality, but it also means Isar's served market depends on which of those jobs genuinely need dedicated small launch instead of heavier or cheaper shared alternatives.
