- id: growth-drivers
  title: Growth drivers and policy tailwinds
  body: |-
    The strongest driver is Europe's policy shift from funding rocket development in the abstract to buying transportation services competitively. ESA's Boost! programme is designed to stimulate commercially viable launch and in-space transport services, while Boost! 3 and Flight Ticket specifically co-fund European launch services for ready-to-fly IOD/IOV missions. The European Launcher Challenge extends that logic by linking future launch services and upgrade demonstrations to competitive selection. Together these programmes are trying to create recurring procurement behaviour, not just one-off grants.

    The second driver is sovereign-access politics. European officials increasingly describe launch autonomy in the language of security, resilience, and technological sovereignty. The 2022-2024 launcher crisis sharpened this by forcing Europe to confront what happens when Ariane is delayed, Vega-C is grounded, and Soyuz access disappears. Norway's Arctic surveillance contract, NATO Innovation Fund's investment rationale, and the framing around IRIS² and other government missions all show that launch is no longer treated purely as a commercial convenience.

    Third, the technical-market backdrop is favorable to dedicated launch where orbit and timing matter. ESA explicitly links commercial opportunities to the deployment of capable light satellites, while Andøya creates a new European polar and SSO node. Isar is also building around industrial scale—up to 40 Spectrum vehicles per year in the disclosed future production plan—suggesting management expects demand to reward cadence and repeatability. Competitor messaging from Electron, HyImpulse, and Firefly similarly emphasizes responsiveness and mission tailoring, which reinforces that schedule control is a real buying criterion, not just marketing language.
