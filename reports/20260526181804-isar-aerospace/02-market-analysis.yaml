- id: evidence-constrained-sizing
  title: "Evidence-constrained sizing: public programmes, site ceilings, and payload-class lanes"
  body: |-
    Public data do not support a clean TAM/SAM/SOM stack for Isar Aerospace. The visible numbers are mostly programme caps, site throughput ceilings, and adjacent-launcher backlogs. Flight Ticket gives the clearest institutional demand marker: five initial missions, two awarded to Isar and three to Vega-C, with ESA previously noting that each launch opportunity carries a maximum award of €5 million. Isar also disclosed a separate Boost! contract of over €15 million in late 2024. The European Launcher Challenge is materially larger at up to €169 million per selected company, but that is still a contingent public-support envelope rather than a realized market-size number.

    The larger European launch system provides context but not a direct TAM for Isar. Ariane 6 has roughly 30 launches in backlog and aims for cadence ten later this decade, while Avio's Vega-C sits around the 2.2-tonne polar class and already captured three Flight Ticket rideshares. Those facts show that Europe does have launch demand, especially for heavier institutional, navigation, weather, and constellation missions, but much of that demand sits above Spectrum's class or uses rideshare economics that do not translate cleanly into Isar revenue. Public support programmes are therefore demand signals, not revenue pools.

    The most decision-useful sizing lens is the service lane itself. Spectrum's 700 kg SSO / 1,000 kg LEO envelope sits above Rocket Lab Electron and HyImpulse SL1, below Vega-C and Ariane 6, and in the same broad band as Firefly Alpha, RFA ONE, and Maia's reusable or expendable options. Andøya's published 30-launch ceiling and 1,500 kg payload-capability framing show what the site might support, but not what buyers will actually buy or what price they will accept. Because mission prices, utilization, and customer mix remain undisclosed, SAM and SOM should stay explicitly uncertain rather than invented.
