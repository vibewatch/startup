- id: constraints-and-open-questions
  title: Constraints, substitutes, and open sizing questions
  body: |-
    The biggest constraint is that Europe may not have enough small-launch demand to support every would-be provider. SpaceNews quotes industry voices arguing the European market is only about one-fifth or one-sixth of the U.S. equivalent, and that consolidation is likely. That is not just a demand problem; it is a pricing problem. If many launchers chase a small sovereign and commercial opportunity set while heavier vehicles and rideshare remain available, price pressure arrives before reliability and cadence are fully proven.

    Reliability and operational risk remain material. Isar's first Spectrum flight cleared the pad and generated useful data, but it still lost control and was terminated after about 30 seconds. RFA suffered a destructive stage incident in static fire, and other European entrants were still pre-orbital when ESA chose its Launcher Challenge shortlist. For institutional buyers this does not kill demand—Europe is intentionally trying to build a service market—but it does mean procurement can stay milestone-driven, cautious, and concentrated in lower-consequence technology demonstrations until repeated flights work.

    The remaining market-sizing uncertainty is not a modelling flaw; it is an evidence gap. Public sources do not reveal Spectrum mission prices, take-rate by buyer segment, utilization assumptions, or how many manifest items are firm contracts versus options or policy-backed pilots. They also do not provide comparable public price cards across dedicated European small launch, rideshare, and medium-lift alternatives. The right conclusion is therefore not a speculative TAM, but a diligence ask: investors need private pipeline, pricing, and repeat-order data before turning today's demand signals into a real SAM or SOM.
