evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, observer rights, founder ownership, and major investor control terms.
    whyItMatters: Governance concentration and liquidation economics materially affect control, hiring resilience, and refresh risk.
    diligencePath: Request current board deck, cap table summary, and shareholder-rights overview from management or data room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Exact post-Eldridge valuation, conversion price, discounts, maturity, and any anti-dilution or security package
      terms.
    whyItMatters: >-
      The headline unicorn threshold is investable context, but not enough to judge dilution, downside protection, or
      true current valuation.
    diligencePath: Obtain the convertible bond term sheet and board materials approving the Eldridge transaction.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure-gap
    missingEvidence: Current revenue, launch backlog value, customer count, contract stage mix, and payment timing by mission.
    whyItMatters: >-
      Later valuation and financial chapters need these metrics to distinguish funded technical progress from durable
      commercial conversion.
    diligencePath: Request customer and backlog schedule, signed mission list, revenue bridge, and launch-payment milestones.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: TO004 milestone chronology gap
    missingEvidence: >-
      A public root-cause report for the March 2025 failure, an exact return-to-flight date, and any undisclosed
      milestone events between the public chronology points in TO004.
    whyItMatters: >-
      The milestone table is sufficient for chapter-level grounding, but missing between-point events limit precision on
      how quickly risk is actually being retired.
    diligencePath: >-
      Request the post-flight investigation summary, the current flight-two schedule, and any internal milestone tracker
      that fills the chronology gaps.
    relatedQuestionRefs:
      - QO021
      - QO024
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing-gaps
    missingEvidence: >-
      A public revenue TAM for European small launch that cleanly separates launch-service spend from subsidies, range
      infrastructure, and broader space-economy spending.
    whyItMatters: >-
      Without a clean market boundary in revenue terms, broad space-economy or sovereign-space narratives can easily
      overstate what Isar can monetize.
    diligencePath: >-
      Request management's internal market-definition memo showing which mission types, buyer classes, and geographies
      are included in pipeline sizing and which are excluded.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: sam-som-gap
    missingEvidence: >-
      Customer-level manifest data with firm contracts, options, indicative pricing, and expected cadence by buyer
      segment.
    whyItMatters: >-
      Public data cannot isolate SAM or SOM without knowing how many of the visible missions are real backlog, what
      price customers pay, and how much of Andøya's theoretical capacity is usable.
    diligencePath: >-
      Obtain closed-book pipeline data covering institutional, defence, EO, telecom, servicing, and integrator demand
      plus expected utilization by launch year.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Comparable public or customer-confirmed price cards for dedicated European small launch versus rideshare and
      medium-lift substitutes.
    whyItMatters: >-
      Price pressure is central to adoption, but current public evidence is mostly qualitative and does not reveal
      willingness-to-pay or elasticity by mission type.
    diligencePath: >-
      Ask management for recent quote data, lost-deal analysis, and pricing versus rideshare, Vega-C, Electron, and
      other relevant alternatives.
    relatedQuestionRefs:
      - QM025
      - QM026
    relatedTableRefs:
      - TM004
  - type: enumeration-incomplete
    severity: material
    topic: buyer-segments
    missingEvidence: Revenue or backlog split by institutional, defence, EO, constellation, telecom, and servicing customer classes.
    whyItMatters: >-
      The buyer map is evidence-backed qualitatively, but valuation depends on which segments recur and which are merely
      strategic references.
    diligencePath: >-
      Request a segment-level bookings and backlog breakdown, including mission criticality, repeat-order frequency, and
      expected contract duration.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: Dedicated-launch pricing transparency across European peers
    missingEvidence: >-
      The reviewed public sources do not disclose negotiated price cards, discounting, or realized contract values for
      Isar, RFA, HyImpulse, Maia, Vega C, or Electron. Only SpaceX rideshare publishes a clear benchmark list price.
    whyItMatters: >-
      Without comparable public pricing, the chapter can compare package structures and transparency but cannot
      underwrite whether Spectrum is truly cost-competitive against European peers or proven substitutes.
    diligencePath: >-
      Request current quote sheets or recent signed launch term sheets for a representative 150-300 kg and 500-700 kg
      mission across Isar, RFA, Avio, Rocket Lab, and SpaceX.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: minor
    topic: Orbex Prime official product refresh
    missingEvidence: >-
      Orbex's official Prime product page returned a 502 / access-blocked result during review, so current payload and
      schedule specifics could not be refreshed directly from Orbex.
    whyItMatters: >-
      Orbex remains relevant because it is in ESA's challenger set, but the inability to refresh official product detail
