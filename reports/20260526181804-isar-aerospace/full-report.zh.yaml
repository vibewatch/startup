        title: 资本结构、融资架构与下一阶段资金充足性
        blocks:
          - type: paragraph
            body: >-
              Isar 的资本结构是公开档案中最强的一部分，但并不简单。公司在 2023 年 3 月披露 $165 million（€155 million） Series C，随后在 2024 年 6 月把该轮延展超过
