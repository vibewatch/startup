    rows:
      - - 载荷上限
        - 1,000 kg 至 LEO / 700 kg 至 SSO
        - 高
        - 设定单次飞行收入上限，也界定哪些载荷类别能支撑专属发射经济性
        - 提供实际载荷组合和每次任务平均售出 kg
      - - 可见发射清单深度
        - 具名任务从 2026 年延伸至 2028 年，覆盖 ESA、NOSA、SEOPS、Astroscale 和 R-Space
        - 中
        - 支撑积压订单形成，但不证明合同金额或转化确定性
        - 提供已签积压订单 €、定金和按概率调整后的发射日程
      - - 场址容量上限
        - Andøya 许可在完全建成后每年最多 30 次发射；目前有一个 Isar 专用发射台
        - 高
        - 区分理论运营容量和近期实际单台发射节奏
