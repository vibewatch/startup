        - 把机会扩展到主权欧洲之外，但保持同一服务模式。
      - - 机构主权进入任务
        - ESA、EC、国家机构和安全相关的欧洲制造服务发射采购
        - 不包含发射服务成分的普通研究赠款
        - 公共项目办公室和部委预算
        - 早期市场形成的关键驱动。
      - - 星座 / 集成商任务
        - 面向 SEOPS、ISISpace 或 Redwire 类型载荷聚合的运力预留和定制发射
        - 纯软件、卫星制造或下行链路合同
        - 星座运营商、任务服务公司、载荷主承包商
        - 通往规模化的重要商业桥梁。
      - - 拼车和中型运力替代
        - 当专用时间安排并非必要时，Vega-C 拼车、面向更大任务的 Ariane 6，以及可比的非欧洲选项
        - 需要任务特定交会几何或主权发射规则的任务
        - 优化每 kg 更低价格的买家
        - 真实替代集合，但不是完美替代。
      - - 排除的相邻领域
        - 无；本行用于明确排除项
        - 在轨服务收入、碎片清除服务收入、航天港土建工程和一般空间应用支出
        - 相邻项目和基础设施所有方
        - 防止市场规模膨胀。
    notes: 围绕发射服务而非整个空间经济定义市场，同时保留拼车替代和非发射相邻领域。
