      - number: '2.4'
        title: 增长驱动与政策顺风
        blocks:
          - type: paragraph
            body: >-
              最强驱动来自欧洲政策转向：不再抽象资助火箭研发，而是以竞争方式购买运输服务。ESA 的 Boost! 计划旨在刺激具备商业可行性的发射和在轨运输服务； Boost! 3 和 Flight Ticket
              则专门为已准备飞行的 IOD/IOV 任务共同资助欧洲发射服务。European Launcher Challenge
              进一步延续这套逻辑，把未来发射服务和升级演示与竞争性遴选挂钩。合在一起，这些项目想创造的是反复发生的采购行为， 而不是一次性拨款。


              第二个驱动是主权进入太空的政治。欧洲官员越来越多地用安全、韧性和技术主权语言描述发射自主权。 2022-2024 年的发射器危机让这一点更尖锐：欧洲被迫面对 Ariane 延迟、Vega-C 停飞、Soyuz
              通道消失时会发生什么。 挪威的北极监视合同、NATO Innovation Fund 的投资理由，以及围绕 IRIS² 和其他政府任务的表述都显示， 发射不再只是商业便利。


              第三，技术市场背景对在意轨道和时间的专属发射有利。ESA 明确把商业机会同高能力轻型卫星部署联系起来，而 Andøya 创造了一个新的欧洲极地和 SSO 节点。Isar
              也围绕工业规模建设——披露的未来生产计划中，Spectrum 年产量最高 40 枚—— 说明管理层预期需求会奖励节奏和可重复性。Electron、HyImpulse 和 Firefly
              的竞争对手叙事同样强调响应速度和任务定制， 进一步说明排期控制是真实购买标准，不只是营销语言。
