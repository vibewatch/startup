    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 成立于 2018 年，目标是围绕中小型卫星任务，打造一家由私人资本融资的欧洲发射服务公司。 当前官方文案称其为总部靠近慕尼黑的发射服务商；更早的公司公告和 TUM
              相关报道把总部更具体地放在慕尼黑附近的 Ottobrunn。 这些表述足够一致，可以把“慕尼黑附近的 Ottobrunn”作为标准地点。核心产品是 Spectrum，一款面向中小型卫星和星座的两级入轨运载火箭。
              官方和第三方技术描述都指向同一组载荷目标：低地球轨道最高 1,000 kg、太阳同步轨道最高 700 kg。 Isar
              强调自研设计、制造和测试，并把它视为压低成本、压缩周期的主要抓手。公司的公开足迹也不再只是作坊式创业故事： 当前材料称，Isar 在五个国际地点拥有来自 50 多个国家的 400
              多名员工；同一套材料还给出未来量产目标， 即新的慕尼黑周边工厂和配套测试基础设施完全上线后，Spectrum 年产能最高可达 40 枚。
