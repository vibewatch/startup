        - 如果执行验证改善，而欧洲愿意为稀缺主权发射期权价值买单，€1.4bn-€2.0bn 可以成立
        - 需要可见复飞，并证明 Flight Ticket 正在打开更大的政府渠道
        - 若复飞延期，或主权支持仍停留在象征层面而未进入预算，情景失效。
      - - 基准
        - Isar 仍具战略意义且资金充足，但入轨、发射节奏和经济性仍在成形
        - 约 €1.0bn-€1.4bn，大致围绕独角兽锚点，但仍要因发射和披露风险打折
        - 最符合当前公开证据：战略价值真实，运营验证不完整
        - 若下一轮融资以明显偏向新投资人的重置条款完成，情景失效。
      - - 悲观
        - 在清晰收入验证前，进一步发射延期叠加工厂、测试和营运资本需求
        - 如果下一轮融资围绕资本需求而非主权野心重新定价，估值落在 €0.6bn-€1.0bn
        - 如果发射延期、合同经济性继续不透明，或市场拥挤加剧，这一情景概率上升
        - 复飞延期、机构后续乏力或惩罚性资本重组会确认这一情景。
    notes: 这些区间是情景带，不是按市价报价；它们刻意反映了经审计收入和现金数据缺失。
