      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方集群是机构客户。Isar 可见的客户和项目组合已经包括 ESA、European Commission、 Norwegian Space Agency，以及与 DLR、UK Space Agency
              和欧洲 IOD/IOV 项目相关的任务。 在这些案例中，买方通常是机构或项目办公室，载荷集成商或主承包商是运营用户，经济付款方则是公共研发、安全或产业政策预算。
              这一点很重要，因为采用逻辑由采购机制决定，而不是消费者需求决定：谁拥有项目、谁签署发射合同、任务是否需要欧洲火箭。


              第二个集群是商业或准商业任务聚合。SEOPS 为 LaunchLock Prime 客户购买运力；ISISpace 和 Redwire 聚合或集成多载荷任务；
              专属发射也是这些中介帮助终端客户控制时间和目标轨道的方式之一。第三个集群是特别看重轨道精度和主权属性的任务： 碎片清除、在轨服务、北极监视，以及其他难以舒服塞进通用拼车舱位的任务。Astroscale 的
              ELSA-M 和 Infinite Orbits 的 Tom & Jerry 是好例子，因为任务成功依赖具体交会几何，而不只是便宜地把公斤数送上轨道。


              第四个集群位于更广义市场，即便 Isar 还不是主导供应商：EO、气候、电信和安全连接任务。GapMap-1、Pluto+、SMILE、 Kuiper 和 IRIS²
              说明，底层买方任务很多元——监视、气象、气候感知、宽带和安全通信。这种多元性有助于需求质量， 但也意味着 Isar 的可服务市场取决于哪些任务真正需要专属小型发射，而不是更重或更便宜的共享替代方案。
