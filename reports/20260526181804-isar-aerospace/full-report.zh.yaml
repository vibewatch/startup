          detail: 故障分析和复飞决定商业可信度
        - id: backlog
          label: 已订任务
          detail: 机构和商业合同形成未来需求
        - id: cadence
          label: 发射节奏
          detail: 只有运营成功爬坡，更高发射节奏才会摊薄固定成本
        - id: price
          label: 定价权
          detail: 取决于排期控制、轨道特异性和主权准入价值
        - id: unitcost
          label: 单次飞行成本
          detail: 制造、测试、发射场、保险和发射运营成本未披露
        - id: margin
          label: 利润率结果
          detail: 只有发射节奏和定价跑赢工业烧钱，利润率才会转正
        - id: diligence
          label: 数据室需求
          detail: 收入、现金、烧钱速度、预付款和毛利率必须在私下核验
      edges:
        - from: capital
          to: fixed
          label: 为建设出资
        - from: fixed
          to: cadence
