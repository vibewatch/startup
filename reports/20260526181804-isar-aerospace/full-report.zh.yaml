      - number: '8.2'
        title: 融资锚、发射风险折价与资本强度
        blocks:
          - type: paragraph
            body: >-
              2025 年 6 月融资应当作为本章锚点，但只能谨慎使用。它是 Isar
              目前可得的最佳直接市场出清信号；不过，融资形式是可转债，而且发生在公司已经为运载火箭开发、发射场建设和工业生产连续多年融资之后。这很关键，因为资本密集型发射公司通常不是融资一次，而是反复融资，用来在可靠飞行节奏出现之前支付硬件、测试基础设施、生产工装、保险和营运资本。Isar
              自己的披露也强化了这一点：它在 2023 年融资 $165 million，2024 年把 Series C 延长到超过 €220 million，在 Munich 附近签下新的大型总部和生产基地，随后又在
              2026 年初扩大 Esrange 的发动机和级段测试能力。


              首次 Spectrum 飞行解释了为什么折价必须保持有意义。Isar、ESA 和 SpaceNews 都认同，2025 年 3 月任务离开发射台并产出了数据；但它们也认同，运载火箭没有入轨，并在约 30
              秒后被终止。这是有用的工程里程碑，本身不是可投资的证明点。正确的承销立场，是假设发射风险折价在 Spectrum 重返飞行、并开始把测试成功转化为可靠商业节奏之前，仍然很重。


              由于没有经审计财务，情景表和敏感性图比精确计算更重要。它们展示了今天真正驱动价值的东西：下一次发射是否成功、基础设施支出是否带来真实吞吐、下一轮融资是出于优势还是必要。
