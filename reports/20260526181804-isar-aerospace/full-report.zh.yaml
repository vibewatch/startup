      - number: '4.3'
        title: 成本结构、制造强度与规模要求
        blocks:
          - type: paragraph
            body: >-
              公开记录让 Isar 的成本结构呈现出明确的硬件重资产特征。公司正在慕尼黑附近建设约 40,000 平方米的生产和总部基地， 目标每年生产超过 30 枚、在部分官方材料中最高 40 枚 Spectrum；同时扩大
              Esrange 足迹， 以每月测试 30 多台发动机并执行集成级段验收测试。这叠加在 Andøya 专属首个发射台，以及发动机、贮箱、结构、航电和发射运营准备所需的营运资本负担之上。 首次 Spectrum
              飞行也在约 30 秒后失败；这对新火箭并不罕见，但在财务上仍然重要，因为失败或未完成的试飞会在产生收入前消耗工程人力、 硬件、靶场时间，以及保险或应急能力。ESA 的 Boost!
              规则进一步强化了这一点：土建工程和通用基础设施不符合 Boost! 1 共同资助资格，因此最大的工业资产仍必须由私人资本或场地特定交易对手出资。即便当前现金消耗尚未披露，
              这门生意读起来也像典型的规模制造型发射公司，单位经济性取决于产量和学习曲线，而不是轻资本服务平台。
