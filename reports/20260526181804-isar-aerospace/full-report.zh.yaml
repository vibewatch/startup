      - number: '2.2'
        title: 受证据约束的规模测算：公共项目、场地上限与载荷级别通道
        blocks:
          - type: paragraph
            body: >-
              公开数据不足以为 Isar Aerospace 搭出干净的 TAM/SAM/SOM 框架。可见数字大多是项目上限、场地吞吐上限和相邻火箭订单积压。 Flight Ticket
              给出了最清晰的机构需求标记：首批五个任务中，两个授予 Isar、三个授予 Vega-C；ESA 此前还指出， 每次发射机会最高奖励 €5 million。Isar 也披露了 2024 年底另一份超过 €15
              million 的 Boost! 合同。 European Launcher Challenge 规模大得多，每家入选公司最高 €169 million，但那仍是或有公共支持额度， 不是已经实现的市场规模数字。


              更大的欧洲发射系统提供了背景，但不是 Isar 的直接 TAM。Ariane 6 约有 30 次发射订单积压，并计划在本十年后期达到 10 次节奏；Avio 的 Vega-C 位于约 2.2
              吨极地轨道级别，且已经拿下三次 Flight Ticket 拼车任务。 这些事实说明欧洲确实有发射需求，尤其是更重的机构、导航、气象和星座任务；但其中很多需求高于 Spectrum 的级别， 或采用无法干净转化为
              Isar 收入的拼车经济性。因此，公共支持项目是需求信号，不是收入池。


              最有决策价值的规模视角是服务通道本身。Spectrum 的 700 kg SSO / 1,000 kg LEO 包线高于 Rocket Lab Electron 和 HyImpulse SL1，低于 Vega-C
              和 Ariane 6，并与 Firefly Alpha、RFA ONE、Maia 的可复用或一次性方案处在同一宽频段。 Andøya 公开的 30 次发射上限和 1,500 kg
              载荷能力表述，说明场地可能支撑什么，但不说明买方实际会买什么、愿意接受什么价格。 由于任务价格、利用率和客户组合仍未披露，SAM 和 SOM 应明确保持不确定，而不是凭空编造。
