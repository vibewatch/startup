        - 缺少流动性可见度，估值和下一轮融资时间都只能猜
        - 索取经审计 FY2025 现金流，以及董事会版流动性桥，覆盖至复飞。
      - - 可转债条款和股权结构表
        - 未公开转换价格机制、折扣、优先级或优先股堆叠
        - 普通股价值可能与企业价值标题数字大幅偏离
        - 索取 Eldridge 可转债、当前股权结构表，以及最新章程 / 优先权摘要。
      - - 订单储备和发射合同经济性
        - 发射合同未公开保证金、里程碑时间表、延期救济或取消权
        - 战略需求不等于可变现现金价值
        - 审阅发射服务协议样本和按年份拆分的客户订单储备瀑布。
      - - 保险与责任框架
        - 发射保险、赔偿安排或载荷责任结构没有公开可见度
        - 任务经济性和下行严重性取决于失败后谁承担风险
        - 索取保险塔、赔偿安排和失败后补救流程。
      - - 单次飞行单位成本和贡献毛利
        - 未公开单次飞行成本、学习曲线或毛利率数据
        - 工业规模只有改善经济性才创造价值，单靠吞吐量野心不够
        - 索取标准成本模型、贡献毛利桥，以及对发射节奏的敏感性。
      - - 机构支持依赖
        - 未来需求有多大依赖补贴、主权合同或政策支持，公开信息不清楚
        - 只有政策需求转化为持久商业位置，战略价值才可持续
        - 梳理截至 2028 年预期 ESA / EC / 国家任务与纯商业发射的对比。
    notes: 这些尽调事项按对推荐结论的影响排序。前四项是门槛问题，不是锦上添花。
