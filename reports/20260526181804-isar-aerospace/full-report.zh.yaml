      - number: '7.3'
        title: 客户需求真实，但转化仍取决于服务证明
        blocks:
          - type: paragraph
            body: >-
              好消息是，Isar 已经积累了一条可见且真实的客户管线，而不是泛泛的“市场兴趣”故事。挪威航天局、ESA 和欧盟委员会、SEOPS、Astroscale 都公开宣布了任务，窗口从 2026 年以后延伸到 2028
              年。坏消息是，这些仍是围绕一个尚未完成入轨资格任务的发射系统签下的远期合同。Spectrum
              首飞没有携带客户载荷，最可见的机构授标金额不大，公开披露仍没有给出定金、取消权、延误补救或里程碑付款安排。这很关键，因为在发射行业，订单积压质量同时取决于技术可靠性和合同耐久性。AOS、Flight
              Ticket、ΣYNDEO-3 和 ELSA-M
              强化了战略可信度，但尚未证明收入能重复转化。如果资格验证继续滑期，客户有选择：机构任务可以在欧洲内部重新分配，商业任务可以右移、重订或要求新条款。因此，客户条件性不仅是销售风险，也是时间和现金回收风险。
