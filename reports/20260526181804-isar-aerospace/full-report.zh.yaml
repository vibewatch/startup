      - number: '5.2'
        title: 工业足迹、生产体系与发动机测试栈
        blocks:
          - type: paragraph
            body: >
              Isar 技术逻辑的核心不只是火箭，而是围绕火箭搭建的生产体系。公司反复称 Spectrum 几乎完全在内部设计、制造和测试，
              把增材制造、碳纤维复合材料工艺能力、软件、航电、结构和推进放进同一个垂直整合栈。该栈现在横跨三处专业场地： 慕尼黑附近 Vaterstetten 校区用于开发和批量生产，瑞典 Esrange
              用于发动机和级段验收测试，挪威 Andøya 用于发射运营。 Aquila 的公开证据在耐久测试上强于完整性能披露：首飞前，Isar 报告了 260 秒集成热试车，以及同一台发动机不翻修连续点火 6 次；
              2026 年 2 月，公司又增加了第二座 Esrange 设施，设计能力为每月 30 多次发动机测试，并可做集成级段验收测试。 VGP 支持的 Vaterstetten 校区为生产、开发和总部功能增加超过
              40,000 平方米。合在一起，这些披露让 Isar 的制造足迹在欧洲火箭创业公司中异常具体，尽管实际重复吞吐能力还没有在商业运营中证明。
