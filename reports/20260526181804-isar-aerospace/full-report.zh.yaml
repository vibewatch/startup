      - number: '5.3'
        title: 发射运营、安全控制与准备度证据
        blocks:
          - type: paragraph
            body: >
              发射运营是 Isar 产品的重要组成部分，因为 Spectrum 绑定的是具体欧洲靶场配置，而不是脱离基础设施抽象出售的火箭。 Isar 独家使用 Andøya Spaceport 当前的轨道发射台，首个发射台按
              Isar 规格建设，配有载荷集成设施和任务控制。 场地几何支持极地和太阳同步任务，契合 Spectrum 的小卫星目标市场。监管准备度可见但要求严格：Civil Aviation Authority Norway
              指出，该发射场拥有运营许可，未来随着更多发射台建成，最多可支持每年 30 次发射；但今天只有一个发射台， Isar 每次发射都必须取得许可。监管机构还围绕测试、加注、运输和发射运营施加安全区域和准入控制。
              因此，2025 年 3 月首飞虽未入轨，但在运营上很重要：Spectrum 离开发射台、飞行约 30 秒、验证了飞行终止系统，
              并让发射台保持完好。这比任务保证更能降低地面系统和靶场集成风险，因为公开记录仍缺少上升段失控的根因说明。
