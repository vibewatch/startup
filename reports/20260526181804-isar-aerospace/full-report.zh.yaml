      - 对投资测算的影响
      - 精确尽调路径
    rows:
      - - 按季度确认的收入
        - 需要把合同头条数字和已赚取的发射收入拆开
        - 只有具名发射协议和任务排期
        - 积压订单质量和时间点无法转成收入模型
        - 索取季度确认收入、预订额、积压订单和收入确认政策
      - - 按配置划分的实际发射价格
        - 需要知道专享、主导和拼车发射到底卖多少钱
        - 网站提到“定价选项”；没有公开价目表
        - 无法测试相对拼车发射的价格溢价，也无法估算单次飞行毛利
        - 索取按发射类型划分的已签条款清单或订单表
      - - 按发射配置划分的毛利率
        - 需要评估发射节奏最终能否跑出有吸引力的经济性
        - 公开资料只有“成本效率高”的定性表述
        - 不披露单位成本，毛利率路径完全是猜测
        - 索取按专享、主导和拼车任务拆分的毛利率瀑布
      - - 账面现金和月度烧钱
        - 需要判断现金跑道和下一轮融资
        - 融资历史和亏损公开，但当前流动性未公开
        - 即便历史融资规模大，资本是否够用仍无法判断
        - 索取最新资产负债表、月度烧钱和下行情景现金跑道模型
      - - 债券条款和债务偿付
        - 需要理解未来现金流上的非股权索取权
        - 公开描述只到“可转债”
        - 类债务负担可能改变下行保护和下一轮融资博弈
        - 索取票息、到期日、转股触发条件、契约条款及任何抵押安排
      - - 客户预付款和取消权
        - 需要判断积压订单能否变现，以及任务清单有多脆弱
        - 具名任务和“任务清单正在快速填满”的表述
        - 已预订任务不等于稳妥现金流入
        - 索取预付款节奏、取消罚金和复飞义务
      - - 保险和发射失败准备金
        - 首飞失败之后、商业发射节奏爬坡之前必须核实
        - 只有发射台完好和快速复飞的信息
        - 异常之后的责任、返工和保费负担未知
        - 索取保险方案、免赔额、准备金政策和飞后成本影响
      - - 发动机和级段营运资金
        - 需要测试发射收入到账前必须垫付多少库存
        - '>30 台发动机 / 月测试，以及 30-40 枚运载器 / 年产出目标'
        - 库存强度可能比发射节奏恢复更快地吃掉资本
        - 索取库存周转、原材料承诺和供应商付款条款
      - - 各场址资本开支拆分
        - 需要知道工业化建设成本哪些由 Isar 承担，哪些由房东或公共伙伴承担
        - VGP 定制建设、Esrange 扩建、Andøya 独家使用权、Nova Scotia 意向书
        - 公开资料无法把工厂和场址雄心换算成真实资金需求
        - 索取按场址划分的资本开支归属以及租赁 / 自有安排
      - - 客户集中度和积压订单价值
        - 需要判断收入耐久性和任务集中风险
        - 公开具名合同但未披露价值
        - 少数大型机构任务可能主导可见管线
        - 索取按客户划分的积压订单、前 10 大集中度和排期延误敏感性
    notes: 每个缺失指标都直接对应仍在卡住承销判断的问题；问题不在叙事不够，而在公开硬数字不够。
