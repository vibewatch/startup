      - number: '4.2'
        title: 定价信号、发射打包与市场位置
        blocks:
          - type: paragraph
            body: >-
              Isar 的公开打包方式可见，但变现方式不可见。公司告诉客户可以购买专属、主载或拼车通道，并提供“定价选项”， 但它不公布单次发射或每公斤标价。这迫使投资者依赖价格信号，而不是直接披露。最强官方基准是
              SpaceX 的拼车页面： 50 kg 送入 SSO 标价 $350,000，之后每增加 1 kg 加 $7,000。European Spaceflight 补充称，ESA Flight Ticket
              方案中每次发射机会最高奖励 €5 million；这看起来更像补贴上限，而不是完整商业 Spectrum 价格。 Deeptech.Build 引用了 Isar 约 €10,000/kg
              的数字，但这是二手估计，不是公司发布的价目表。战略含义与更广泛的欧洲市场评论一致： 微型发射器很难在绝对每公斤价格上打赢大型拼车方案。Isar 看起来是在出售轨道特异性、排期控制、专属欧洲通道和主权采购相关性。
              这些价值可以成立，但前提是发射可靠性和节奏足够快地成熟，能够证明相对拼车替代方案的溢价。
