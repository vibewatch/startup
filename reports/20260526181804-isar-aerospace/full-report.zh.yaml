        title: 图表
        blocks:
          - type: callout
            title: 跟踪采购复现，而不是泛泛的太空 TAM
            body: >-
              最清晰的市场洞察是，应该用采购复现和发射节奏来跟踪 Isar，而不是用宏大的太空经济 TAM。 真正重要的公开数字是授标次数、机构项目规则、靶场吞吐和重复任务，因为这些有证据支撑的信号能告诉你，
              欧洲是否真的在为商业发射建设服务市场。
            calloutType: insight
