  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方分层与公开客户验证
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 公开可见的客户集合，比成熟发射商的任务清单小得多，但买方类型已经拉开。最清晰的一类是主权和机构需求：挪威航天局为两颗北极海洋监视卫星选择了 Spectrum，ESA 和欧盟委员会授予
              Flight Ticket 任务，并另行在 IOD/IOV 计划下签约 ΣYNDEO-3。这些客户重要，是因为它们有实名、有具体任务，也挂在公共项目上，而不是只有 logo 的市场宣传。


              公共订单积压中的商业部分更窄，但战略上有用。SEOPS 代表发射经纪或任务管理买方，能汇聚下游载荷需求；Astroscale 代表对精度敏感的在轨服务客户；R-Space
              则是示范平台客户，它自己的客户是想获取飞行履历的技术开发者。Maritime Launch Services 拓宽了渠道图景，但它是意向书下的发射场扩张伙伴，不是付费发射客户。因此，Isar
              的客户基础是用例宽于数量：主权监视、机构技术示范、发射聚合、碎片清除服务和 IOD 平台运营商都已出现，但整个公开需求叙事只由少数实名交易对手支撑。
