      - number: '6.3'
        title: 商业交易对手显示了分段宽度，但耐久性证据有限
        blocks:
          - type: paragraph
            body: >-
              公开记录里的商业协议可信，但经济披露大多还处早期。SEOPS 在 LaunchLock Prime 下预订了一次 2028 年专用任务，这个项目围绕预先锁定的运力和面向下游客户的运载火箭选择权搭建。这说明
              Isar 能卖给把下游载荷需求打包的中介。Astroscale 的 ELSA-M 授标显示了另一个细分场景：客户需要为交会和碎片清除任务精准入轨，而不是普通拼车发射。R-Space 又补上一类 IOD
              平台运营商，它计划为在轨验证技术的客户发射自有卫星。


              这些商业案例尚未证明的是耐久性。只有 R-Space 公开提到 2026 年和 2027 年还计划后续飞行，给了 Isar
              一个可见的落地后扩张信号。已审阅的商业公告没有披露合同金额、定金、重订行为、准时发射服务水平或取消条款。Maritime Launch Services
              也不属于正常客户篮子，因为它宣布的是围绕加拿大可发射准备和未来轨道覆盖的意向书，而不是已披露的发射预订。换句话说，Isar
              已有足够实名商业证据来证明细分市场有共鸣，但公开数据还不足以证明经常性收入质量，或规模化多任务留存。
