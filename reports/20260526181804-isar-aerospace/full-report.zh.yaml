            body: >-
              公开结论应对融资通道和需求形成保持建设性，但对收入质量和利润率路径保持保守。Isar 显然拥有真实产品、可见合同动能、
              重要公共和私人支持者，以及远超幻灯片阶段的制造和测试足迹。基于历史备案的亏损也确认，公司是在以工业规模花钱， 而不是作为轻人员研发空壳运营。与此同时，本章并不支持承保当前收入、现金消耗或发射盈利能力。
              公开材料没有已确认收入序列，没有公开发射级 ASP，没有按配置拆分的公开毛利率，没有公开保险成本视角，
              也没有公开现金或现金跑道披露。公司可能仍是欧洲资本最充足的独立发射商，但这不等于已经证明有吸引力的单位经济性。
