        - id: first-flight-risk
          label: 首飞后的执行风险
          detail: Spectrum 离开发射台，但首次尝试未入轨。
        - id: schedule-confidence
          label: 客户排期信心
          detail: 任务团队必须决定是保留载荷排期还是重新排期。
        - id: repeat-buying
          label: 复购与扩张
          detail: 除 R-Space 计划后续任务外，公开信号很少。
        - id: backlog-quality
          label: 订单积压变现质量
          detail: 公开来源没有披露合同价值、定金或取消条款。
      edges:
        - from: institutional-bias
          to: backlog-quality
          label: 公开证据依赖少数买方
        - from: single-pad
          to: schedule-confidence
          label: 任何靶场或发射台问题都会影响大多数具名任务
        - from: first-flight-risk
          to: schedule-confidence
          label: 客户等待入轨证明
        - from: schedule-confidence
          to: repeat-buying
          label: 准时执行才能支撑复订决策
        - from: repeat-buying
          to: backlog-quality
          label: 复购订单会增强持续性证据
        - from: single-pad
          to: backlog-quality
          label: 集中度放大取消风险
    claimRefs:
      - CU015
      - CU033
      - CU035
      - CU037
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险集中在高影响角落：资质可靠性、逐次发射许可和资本强度相互强化。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高 / 关键影响
      rows:
        - label: 很可能
          values:
            - 轻微合同时间噪音
            - 替代发射场路径仍未运营
            - 又一次发射活动取消或许可驱动延期
        - label: 可能性高
          values:
            - 竞争营销压力逐步增加
            - 机构项目授予仍有帮助但规模小
            - 可靠商业服务前仍需新资本
        - label: 可能
          values:
            - 次级发射场执行上出现伙伴争议
            - 制造良率和验收摩擦
            - 若继续延期，客户任务改签或重谈
        - label: 较低概率
          values:
            - 重大安全执法行动
            - 欧洲主权发射兴趣彻底消失
            - 永久失去 Andøya 发射场准入
    claimRefs:
      - CR016
      - CR017
      - CR028
      - CR030
      - CR034
      - CR041
      - CR050
      - CR052
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要反向链条从未解决的资质问题出发，传导至许可时点、客户转化、融资需求，最后压到估值。
    data:
      nodes:
        - id: anomaly_closure
          label: 首飞异常闭环仍需要飞行证明
        - id: campaign_scrubs
          label: 资质验证活动取消
        - id: permit_timing
          label: 逐次发射许可和靶场时点
        - id: customer_conversion
          label: 订单积压转化放慢
        - id: institutional_support
          label: 机构支持仍附带条件
        - id: capital_need
          label: 需要追加资本
        - id: cadence_gap
          label: 工业化节奏仍未验证
        - id: margin_pressure
          label: 经济性和定价走弱
        - id: valuation_pressure
          label: 稀释或估值压缩
      edges:
        - from: anomaly_closure
          to: campaign_scrubs
          label: 传导至
        - from: campaign_scrubs
          to: permit_timing
          label: 推高
        - from: permit_timing
          to: customer_conversion
          label: 拖延
        - from: campaign_scrubs
          to: cadence_gap
          label: 拉长
        - from: customer_conversion
          to: capital_need
          label: 抬高
        - from: cadence_gap
          to: capital_need
          label: 拉长
        - from: institutional_support
          to: capital_need
          label: 只能部分抵消
        - from: customer_conversion
          to: margin_pressure
          label: 削弱
        - from: capital_need
          to: valuation_pressure
          label: 可能触发
        - from: margin_pressure
          to: valuation_pressure
          label: 反馈
    claimRefs:
      - CR013
      - CR017
      - CR028
      - CR030
      - CR034
      - CR037
      - CR050
      - CR052
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Isar 的发射主张依赖少数监管方、场地、项目和客户；它们全都位于已证明入轨可靠性之前。
    data:
      nodes:
        - id: isar
          label: Isar / Spectrum 项目
        - id: andoya
          label: Andøya Spaceport 发射场
        - id: caa
          label: CAA Norway
        - id: space_act
          label: 挪威现行及修订后航天法
        - id: esrange
          label: SSC Esrange 测试场
        - id: institutional
          label: ESA / EC / NOSA 项目
        - id: customers
          label: SEOPS / Astroscale / 其他任务
        - id: capital
          label: 私人资本提供方
        - id: mls
          label: Maritime Launch / Nova Scotia
        - id: rivals
          label: 欧洲运载火箭竞争对手
      edges:
        - from: andoya
          to: isar
          label: 承接发射
        - from: caa
          to: isar
          label: 许可发射
        - from: space_act
          to: caa
          label: 设定条件
        - from: esrange
          to: isar
          label: 支持验收测试
        - from: institutional
          to: isar
          label: 资助并采购任务
        - from: isar
          to: customers
          label: 必须为其交付
        - from: capital
          to: isar
          label: 资助扩产
        - from: mls
          to: isar
          label: 提供未来靶场多元化
        - from: rivals
          to: institutional
          label: 争夺支持
        - from: rivals
          to: customers
          label: 提供替代选项
    claimRefs:
      - CR016
      - CR017
      - CR019
      - CR021
      - CR024
      - CR031
      - CR036
      - CR043
      - CR050
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 决策链从战略主权可选性和独角兽融资锚点出发，穿过发射失败、资本强度和缺失的审计经济性，最后落到“继续研究”建议。
    approximationNotes: 这是分析流程，不是概率树或股权结构模型。
    data:
      nodes:
        - id: n1
          label: 2025 融资锚点
          detail: €150m Eldridge 可转债；独立报道称 >€1bn 独角兽估值
        - id: n2
          label: 战略上行空间
          detail: 欧洲需要独立发射能力，并已开始采购商业任务
        - id: n3
          label: 发射风险折价
          detail: 首次 Spectrum 飞行约 30 秒后结束，未入轨
        - id: n4
          label: 资本强度
          detail: 工厂、测试和发射场建设仍需要达到规模化前的大额支出
        - id: n5
          label: 披露缺口
          detail: 公开材料中没有经审计的收入、现金或利润率证据
        - id: n6
          label: 可比公司分化
          detail: Rocket Lab 和 Avio 表明，证明和披露主导价值
        - id: n7
          label: 当前建议
          detail: 继续研究 / 观察；估值判断偏高
      edges:
        - from: n1
          to: n7
          label: 提供锚点
        - from: n2
          to: n7
          label: 支撑期权价值
        - from: n3
          to: n7
          label: 需要折价
        - from: n4
          to: n7
          label: 抬高融资风险
        - from: n5
          to: n7
          label: 阻碍精确定价
        - from: n6
          to: n7
          label: 阻止倍数直接迁移
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV018
      - CV021
      - CV024
      - CV035
      - CV043
      - CV047
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 用十亿欧元口径列出的纯公开估值锚点显示，当下里程碑证明比 TAM 叙事更重要。
    approximationNotes: 柱状条是来自情景讨论的分析锚点，不是报价交易价格。
    data:
      items:
        - label: 悲观：返飞延迟
          value: 0.8
        - label: 基准：承压战略价值底
          value: 1
        - label: 2025 独角兽标记
          value: 1
        - label: 基准：运营后续执行更清晰
          value: 1.3
        - label: 乐观：入轨 + 主权客户复购
          value: 1.7
        - label: 乐观：入轨 + 披露更干净 + 融资支持
          value: 2
    claimRefs:
      - CV018
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV050
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 仅基于公开资料、以十亿欧元计的估值区间视图；区间仍然很宽，因为公司具备战略价值，但没有经审计的经营披露。
    approximationNotes: 这些区间是投资测算区间，不是市场报价；已纳入发射风险折价、资本密集度和主权选择权价值。
    data:
      items:
        - label: 当前悲观情景
          low: 0.6
          high: 1
          unit: €bn
        - label: 当前基准情景
          low: 1
          high: 1.4
          unit: €bn
        - label: 当前乐观情景
          low: 1.4
          high: 2
          unit: €bn
        - label: 若 2026 里程碑落地，下一轮定价
          low: 1.2
          high: 2.4
          unit: €bn
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: standard
    summary: 按 IC 的打分口径，主权可选性和融资能力加分；发射验证、披露质量和下行保护拖后腿。
    data:
      items:
        - label: 主权可选性
          value: 8
          detail: 机构采购和欧洲政策支持确实存在。
        - label: 融资能力
          value: 7
          detail: Isar 多次融到大额轮次，2025 年还有一笔可转债。
        - label: 发射验证
          value: 3
          detail: 首飞产生了数据，但没有入轨。
        - label: 资本效率可见度
          value: 2
          detail: 公开资料缺少现金、烧钱速度和毛利率证据。
        - label: 可比公司支撑
          value: 4
          detail: 上市可比公司的估值可用于框定边界，不能直接套倍数。
        - label: 披露质量
          value: 2
          detail: 上市可比公司会提交报告；Isar 没有。
        - label: 下行保护
          value: 3
          detail: 可转债结构和资本开支需求可能把价值从普通股权益中挤走。
    claimRefs:
      - CV009
      - CV021
      - CV024
      - CV031
      - CV033
      - CV035
      - CV036
      - CV043
      - CV052
