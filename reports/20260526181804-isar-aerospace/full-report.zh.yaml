      - number: '2.5'
        title: 约束、替代品与待解规模问题
        blocks:
          - type: paragraph
            body: >-
              最大约束在于，欧洲的小型发射需求可能不足以支撑每一个潜在供应商。SpaceNews 援引行业人士称， 欧洲市场只有美国同类市场约五分之一或六分之一，整合很可能发生。这不只是需求问题，也是定价问题。
              如果很多发射商追逐一个较小的主权和商业机会集，而更重型火箭和拼车方案仍然可用，那么在可靠性和节奏完全证明前，价格压力就会先到。


              可靠性和运营风险仍然重要。Isar 的首次 Spectrum 飞行离开发射台并生成有用数据，但它仍失控，并在约 30 秒后被终止。 RFA 在静态点火中遭遇破坏性级段事故；ESA 选择 Launcher
              Challenge 入围名单时，其他欧洲新进入者也仍未入轨。 对机构买方而言，这不会扼杀需求——欧洲有意建设服务市场——但它确实意味着采购可以继续由里程碑驱动、保持谨慎，
              并集中在后果较低的技术演示上，直到多次飞行跑通。


              剩余的市场规模不确定性不是建模缺陷，而是证据缺口。公开来源没有披露 Spectrum 任务价格、各买方细分的获取率、
              利用率假设，也没有说明有多少清单项目是确定合同、期权还是政策支持试点。它们也没有提供欧洲专属小型发射、 拼车和中型运力替代品之间可比的公开价格卡。因此，正确结论不是一个投机性的 TAM，而是一项尽调要求：
              投资者需要私有管线、定价和复购数据，才能把今天的需求信号转化为真实的 SAM 或 SOM。
            claimRefs:
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
