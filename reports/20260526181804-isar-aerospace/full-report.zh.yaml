        - 1300kg 至 500km SSO；仍未入轨
        - 按任务级别看，是接近的欧洲小型发射同行
        - 未披露公开估值，自身执行路径也仍不确定。
      - - HyImpulse SL1
        - 私营同行状态 / 载荷级别
        - 600kg 至 LEO 混合动力运载火箭
        - 显示即便在 Isar 以下规模，赛道也很拥挤
        - 阶段更早、规模小于 Isar，因此更像拥挤度参照，而不是估值可比。
      - - Firefly Alpha
