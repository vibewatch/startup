      - number: '1.2'
        title: 创始人、现任领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人叙事仍是 Isar 身份的核心。官方和 TUM 相关来源持续把 Daniel Metzler、Josef Fleischmann、 Markus Brandl 列为三位创始人；当前官方领导层文案也仍显示
              Metzler 担任首席执行官，Fleischmann 担任首席技术官。 Stella Guillen 是官方材料中另一位明确具名的现任高管，负责商业拓展；更早的融资和发射材料则补充了顾问委员会层面的治理信号，
              而不是完整披露董事会结构。具体来说，2023 年融资披露称 Porsche SE 和 HV Capital 将加入顾问委员会， 7-Industries Holding 将获得观察员席位；首飞报道仍称
              Bulent Altan 为董事长。这足以说明创始人之外存在治理安排， 但还不足以细致还原当前董事会组成、投票控制或投资者权利。从尽调角度看，Isar 仍像一家创始人主导、依赖关键人物的公司： Metzler
              是公开运营者，Fleischmann 锚定技术连续性，而公开记录对他们之下的梯队披露远少于资本形成和发射里程碑。
