      - number: '3.3'
        title: 替代方案、打包方式与分销权力
        blocks:
          - type: paragraph
            body: >-
              Spectrum 的商业默认替代品不是另一家尚未入轨的欧洲创业公司，而是排队更清楚的成熟供应商。 Electron 仍是专属小型发射标杆，因为它结合了真实发射节奏、多座发射台和由末级推进段支撑的轨道控制。
              Falcon 9 拼车更难忽视，因为它公布标价、公布节奏指引，并提供在线预订和改签流程。相比之下， 审阅到的 Isar、RFA、HyImpulse、Maia、Vega C 或 Electron
              公开页面，没有任何一家披露了可直接比较的专属任务标价。 这很重要，因为买方可以立即建模 Falcon 9，而大多数欧洲创业公司的定价仍需要和销售团队摸底。


              Vega C 是欧洲现状替代方案。它比 Spectrum 更重，也不是每个任务的专属出租车，但它已经运营，当前由 Avio 直接商业控制，并且在 Isar 获得两个专属任务的同时，已经拿下三次 Flight
              Ticket 辅助载荷任务。 这种分配很有启发：欧洲有意同时资助新进入者和相邻既有选项。对 Isar 来说，分销风险与其说来自 HyImpulse 或 Orbex，不如说来自 Avio
              的机构通道、Electron 的运营验证，以及 Falcon 9 透明拼车经济性的组合。
