      - number: '1.3'
        title: 融资历史、估值门槛与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Isar 的资本故事已经足够扎实，可以在后续章节中作为可复用的公司事实。2023 年 3 月，公司宣布 $165 million / €155 million 的 Series C，并称累计融资已超过 $330
              million / €310 million。2024 年 6 月，公司又增加超过 €65 million，使 Series C 总额超过 €220 million、累计融资超过 €400
              million；NATO Innovation Fund 则强调发射通道的战略安全维度。决定性一步出现在 2025 年 6 月 25 日，Isar 宣布获得 Eldridge Industries 的 €150
              million 可转债。随后 2025 年 6 月的独立报道给出超过 €1 billion 的估值，事实上把公司推入独角兽行列； Isar 当前官网也称私人资本融资已超过 €500
              million。上述组合足以把两个标准事实带入报告其余部分： Eldridge 之后估值超过 €1 billion，累计融资超过 €500 million。但公开材料没有给出精确转股价格、稀释路径或实时股权估值。
              公开具名的利益相关方横跨风险投资者、战略产业资本、ESA 相关机构客户、Norwegian Space Agency， 以及 Andøya Spaceport、SSC Space 等发射场和测试合作伙伴。
