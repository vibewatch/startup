      - number: '3.2'
        title: 直接同业画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              从披露的火箭性能看，Spectrum 是欧洲较大的创业公司小型发射器之一：Isar 称其可将 1,000 kg 送入 LEO、 700 kg 送入 SSO，高于 Electron 和 HyImpulse
              SL1，大体与 RFA ONE、Maia 可复用模式产品处在同一战略频段。 不过，与 Maia 或 PLD 不同，Isar 当前公开差异化并不建立在复用上，而是建立在垂直整合、自研发动机，以及管理层称可扩至每年
              30-40 枚火箭的生产体系上。这是一套工业化逻辑，而不是通过复用降本的逻辑。


              在直接同业中，RFA 是载荷级别和任务定制上最接近的一对一威胁，尤其是它公开营销拼车接口和轨道转移飞行器。 如果买方想要明确的共享、搭载和专属打包选项，PLD
              是最干净的欧洲替代方案。若可复用经济性比创业纯度更重要， Maia 是长期最强战略挑战者，因为 ArianeGroup 给了它工业纵深，复用叙事也更接近 Falcon 式逻辑。 HyImpulse 和 Orbex
              在当前商业窗口中的重要性较低，因为公开证据显示它们的准备度落后于 Isar。 因而 Isar 的首飞失败反而既加分也扣分：它仍未证明入轨，但至少已经完成了大多数欧洲同业尚未展示的集成发射活动。
