        - 削弱支撑 Isar 高于纯近期现金指标的战略价值论点
        - 下调估值区间中的主权选择权溢价。
      - - 工厂和测试建设超出资金承受力
        - 新场地和生产资产继续扩张，但现金、烧钱或营运资本可见度仍差
        - 垂直整合从护城河叙事变成资本压力
        - 假设更高稀释风险和更低普通股价值捕获。
