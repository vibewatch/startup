      - number: '6.4'
        title: 耐久性、集中度和取消风险仍是客户侧关键未知数
        blocks:
          - type: paragraph
            body: >-
              公开客户集合在数量和基础设施上都集中。已审阅来源中所有可见发射需求都连着少数实名交易对手；除 Maritime Launch 扩张路径外，每一项具体任务协议都指向
              Andøya。挪威监管机构称，该航天港最终最多可支持每年 30 次发射，但今天只有一个发射台，且由 Isar
              独家使用。这种排他性在商业上有帮助，因为它给了公司专属靶场位置；它也是单点故障，因为监管中断、发射台受损或准备延后，都可能影响整个可见订单积压。


              取消和耐久性证据更薄。已审阅的公开来源没有披露实名客户的 NRR、GRR、流失、发射服务续约率、按客户划分的订单积压占比或合同经济性。第一次试飞失败似乎没有引发公开客户出走，但在 Spectrum
              入轨并开始按期服务真实载荷之前，执行风险仍会压在台前。SpaceNews 和其他行业分析也警告，欧洲微型发射器赛道可能整合，因为需求未必能支撑每个进入者。由此，Isar
              的客户集中风险有两层：短期要证明少数实名交易对手确实会转化为发射；长期要证明这些引用客户能在竞争出清压缩市场之前，复利成重复业务。
