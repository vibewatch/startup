      - number: '3.4'
        title: 护城河耐久性、切换成本与反向风险
        blocks:
          - type: paragraph
            body: >-
              Isar 的护城河真实存在，但强度中等。审阅记录中最强的可防御资产不是秘密推进突破，也不是公开价格优势， 而是通道和定位。Isar 独家使用 Andøya 当前唯一活跃的轨道发射台，欧洲机构也已经把两次
              Flight Ticket 任务绑定到 Spectrum。 这个组合重要，因为主权客户往往在意靶场控制、政治一致性和未来欧洲自主权，而不只是标价。短期内， 这能让 Isar 在还没有入轨成功前保持相关性。


              反向情景同样清楚。专属发射台通道并不能解决最难的商业问题：Spectrum 能否可靠入轨，Isar 多快能把工厂雄心转化为实际发射节奏， 以及当 Vega C、Electron 或 Falcon 9
              已能承载任务时，客户是否愿意为专属欧洲火箭付费。发射领域的切换成本主要是排期和集成成本， 不是真正的锁定效应。买方可以多家采购、重新预订清单，或者在专属发射器滑期时改向拼车设计。也就是说， Isar
              的护城河只有在多次入轨成功和可见节奏之后才会变硬。在此之前，它受益于主权采购支持，但仍暴露在替代品截流和欧洲很可能发生的整合周期之下。
