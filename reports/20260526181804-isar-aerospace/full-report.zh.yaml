        - '>30 台发动机 / 月（Esrange），另有一体化级验收测试'
        - 中
        - 显示工业级测试开支和未来发射节奏雄心
        - 提供发动机单位成本、验收良率和单台发动机测试成本
      - - 历史亏损趋势
        - North Data 列示亏损：€10.7M（2020）、€21.3M（2021）、€66.6M（2022）和 €61.3M（2023）
        - 中
        - 确认扩张期烧钱和收入前重工业投入很重
        - 提供 2024-2026 年烧钱速度、现金跑道，以及 R&D、生产和发射运营之间的烧钱拆分
      - - 外部价格底部信号
