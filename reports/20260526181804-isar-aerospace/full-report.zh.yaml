              工具被表述为可转债，增加了一层可日后转为股权的类债务结构。 ESA 也通过 Boost! 贡献了超过 €15 million；公司还入围 European Launcher Challenge，理论上最高可获得
              €169 million， 但这笔资金并不保证。公开证据足以说明，Isar 比多数欧洲火箭同业拥有好得多的融资通道；但不足以说明公司资金已经完全到位。
              当前现金余额、月度烧钱速度、现金跑道、债务服务负担、客户预付款画像，以及 Eldridge 工具的担保条款均未披露。
