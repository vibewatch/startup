      - number: '5.4'
        title: 走向节奏化与服务化的路线图
        blocks:
          - type: paragraph
            body: >
              近期路线图明确指向缩短首飞学习和可重复发射服务之间的距离。2025 年 3 月试飞后，Isar 称 #2 和 #3 火箭已经投产； 到 2025 年 12 月，公司报告第二枚火箭两级都已通过 30
              秒集成静态点火测试，并准备进入最终集成和发射运营。 与此同时，2026 年 2 月 Esrange 扩张增加了更多验收测试能力；ESA 表示，其 Boost 支持将继续用于第二次飞行准备， 并扩展新的
              Vaterstetten 生产体系。这构成了一条可识别的发射服务流程：在德国建造和集成，在瑞典验证发动机和级段， 运到挪威，在 Andøya
              完成发射活动许可和发射台集成，然后在专属发射综合体执行任务。公开需求信号也说明， 入轨得到证明后，服务化必须支撑什么：SEOPS 通过经纪人管理的 LaunchLock Prime 流程营销重复通道；
              Astroscale 围绕碎片清除操作所需的精确目标轨道交付来描述 ELSA-M；R-Space 已经描述了 2026 和 2027 年从同一 Andøya 栈重复飞行。Maritime Launch
              Services 以 Nova Scotia 意向书拓宽路线图，但这条路径仍是前瞻性的， 因为 MLS 称建设正在进行。Andøya 自己的轨道发射页面仍把已完成靶场描述为每年 30 次任务、倾角
              90°-110.6° 的服务， 强调节奏路径上不只是火箭性能，靶场演进同样重要。依赖结构也同样清楚。工厂面积和发动机测试台不会自动创造节奏；
              如果单次任务许可、单一发射台可用性、未解决飞行异常或任何第二靶场选项的不成熟拖慢发射活动，节奏就会受阻。 因此，产品路线图在基础设施层面可信，但仍取决于 #2 火箭证明入轨，以及飞后周转纪律跑通。
