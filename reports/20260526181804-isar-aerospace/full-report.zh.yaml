  - id: TE006
    title: 欧洲和全球小型发射对比
    columns:
      - 发射器
      - 已公布载荷等级
      - 架构 / 推进剂
      - 技术差异点
      - 引用资料中的当前状态
      - 对 Spectrum 的含义
    rows:
      - - Spectrum (Isar)
        - 载荷：1,000 kg LEO / 700 kg SSO
        - 2 级，LOX / 丙烷，9+1 Aquila
        - 深度垂直整合，加 Andøya 发射台独家使用权
        - 一次失败但数据丰富的测试飞行；第二枚运载器已完成静态资格验证
        - 需要入轨成功，才能把制造深度转成护城河
      - - RFA ONE
        - 1,300 kg 至 500 km SSO
        - 3 级，RP-1/LOX，富氧分级燃烧，Redshift OTV
        - 能量更高的发动机循环，另有独立 OTV 提供灵活性
        - 开发 / 测试中
        - RFA 的轨道交付看起来更灵活，但需要验证的架构也更多
      - - Maia
        - 1,500 kg SSO 一次性 / 500 kg 可复用
        - 2 级，甲烷 / LOX，可复用或一次性
        - 从第一天起押注可复用和甲烷
        - 开发中
        - Maia 强调长期成本曲线和复用，而不是 Spectrum 更简单的一次性路径
      - - HyImpulse SL1
        - 600 kg LEO
        - 3 级混合动力发射器
        - 混合动力安全叙事和激进发射节奏目标
        - 开发中
        - Spectrum 提供更高载荷和更成熟的发射场就绪度；HyImpulse 卖点是简单性 / 安全性
      - - Electron
        - 300 kg LEO
        - 2 级 + 末级推进段，LOX / 煤油，电泵
        - 运营履历和末级推进段精度
        - 已运营
        - Spectrum 更大，但缺少 Electron 已验证的轨道灵活性和发射履历
      - - Firefly Alpha
        - 载荷：1,030 kg LEO / 630 kg SSO
        - 2 级，LOX/RP-1，抽气循环发动机
        - 响应式发射定位和碳复合材料箭体
        - 已运营
        - Firefly 是全球运力最接近的同行，且已有重复飞行证据
      - - Vega C
        - ~2,200-2,300 kg 至极轨（引用资料）
        - 4 级，主体为固体，液体上面级
        - 机构项目履历和更大的载荷包线
        - 以 Avio 为发射服务商的运营爬坡
        - Vega C 不是完全同类的微型发射器同行，但仍是欧洲更成熟的主权选项
    notes: 同行行使用各运营商自有公开规格和独立市场评论；比较的是架构和商业化姿态，不是报价。
