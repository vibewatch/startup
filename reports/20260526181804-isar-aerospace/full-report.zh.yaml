        - 降低对仅依赖 Andøya 运营模型的信心，并按更低的可达发射节奏承保
      - - 客户条件性
        - 订单储备耐久性信号
        - 已点名任务再次后延，且没有新的保证金披露，或可见地改订到其他供应商
        - 对订单储备质量打折，把客户合同从需求证明降为附条件选择权
      - - 资本强度
