  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：专属小型发射服务，而不是所有太空支出
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的直接市场边界始于面向中小型卫星的专属入轨发射服务，而不是整个太空经济。 公开资料把 Spectrum 描述为一款 28 m、两级发射器，面向中小型卫星和星座，载荷约为低地球轨道
              1,000 kg、 太阳同步轨道 700 kg。这把 Isar 放进了一个特定赛道：买方在意轨道选择、排期控制，也不想被降格为二级拼车载荷。
              因此，纳入市场的支出应围绕适配这一载荷级别的运载火箭运营、靶场和任务集成、以及有效载荷入轨交付。 排除项应包括卫星制造、地面段、纯在轨服务收入、深空运输，以及依赖更大型火箭的重型发射市场。


              地理位置很关键，因为 Isar 是围绕 Andøya Spaceport 建设，而不是抽象地进入一个通用全球发射市场。 挪威监管机构称，该场地完全建成后获准每年最多 30 次发射，但也指出当前只有一个发射台，并由
              Isar 独家使用。 Andøya 把自身定位在极地和太阳同步任务上，这组轨道尤其适合地球观测、监视、气候和技术验证有效载荷。
              这意味着市场边界一半是技术问题，一半是主权问题：在欧洲发射，使用欧洲火箭，进入许多公共部门和安全敏感客户实际需要的高纬度轨道。


              市场边界还必须保留替代品。买方如果不需要专属 Spectrum 服务，可以选择 Vega-C 拼车、面向更大型任务的 Ariane 6，
              或非欧洲供应商。但当任务需要专属清单、精确交会或碎片清除几何，或者出于安全、韧性、机构项目原因需要从欧洲土地发射时， 这些替代方案就不完美。换句话说，Isar
              并不是无差别地同所有发射供给竞争；它竞争的是更窄的决策区间， 即专属小型发射值得付费的场景。
            claimRefs:
