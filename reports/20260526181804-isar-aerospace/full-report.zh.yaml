companyProfile:
  summary: >-
    Isar Aerospace 是一家欧洲私营发射服务公司，2018 年成立，总部位于德国巴伐利亚州 Ottobrunn。 公司由 Daniel Metzler、Josef Fleischmann 和 Markus Brandl
    三位创始人领导，核心围绕 Spectrum 展开； 这是一款两级入轨运载火箭，面向中小型卫星任务，目标载荷为低地球轨道最高 1,000 kg、太阳同步轨道最高 700 kg。 公开证据显示，公司已募集超过 €500 million
    私人资本，2025 年 6 月获得 Eldridge 的 €150 million 可转债，也拥有机构和商业发射需求，并独家使用 Andøya 当前的轨道发射台。与此同时，Isar 仍未完成入轨； 2025 年 3 月首飞在约
    T+30 秒结束，收入、利润率、订单积压经济性和融资机制的公开披露仍然有限。
