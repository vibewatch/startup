  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：主权需求可能先于公开市场经济性发挥作用
        - ESA Flight Ticket 中标、Boost! 支持和 Andøya 国家关联基础设施，都让 Isar 具备战略意义
        - 若机构重复采购且披露经济条款，这条逻辑会从期权价值升级为可承保价值。
      - - 投资逻辑：Isar 仍是欧洲资金最充足的独立运载火箭创业公司
        - 2023、2024 年融资加上 2025 年 Eldridge 可转债，搭出庞大资本基础
        - 如果 2025 年之后出现平轮或下轮融资，资本获取能力持久这一判断会被削弱。
      - - 投资逻辑：如果发射节奏跟上，工业化建设可能成为优势
        - Munich 总部、Esrange 测试和垂直整合，都指向规模化运营野心
        - 如果基础设施投入增长快过发射节奏，同一套建设会变成价值陷阱。
      - - 反向逻辑：首次发射没有证明入轨或节奏
        - Spectrum 飞行约 30 秒，未能入轨
        - 成功复飞和后续商业发射会收窄折价。
      - - 反向逻辑：最新价格信号结构复杂
        - 2025 年 Eldridge 轮是可转债，不是干净的股权定价
        - 完整可转债条款和下一轮干净定价轮，会让估值锚更有用。
      - - 反向逻辑：公开可比公司显示，价值靠验证和披露驱动，不只靠乐观预期
        - Rocket Lab 拥有较高公开市值和持续申报节奏，Avio 则是规模较小的现有上市锚点
        - 如果 Isar 增加监管文件级披露或经审计经济性，可比公司框架会更可信。
    notes: 每行都写成可证伪条件。对一家价值仍受里程碑牵动的私营运载火箭公司，这才是合适框架。
