      - number: '7.5'
        title: 欧洲想要新增发射能力，但赛道已经拥挤且容错很低
        blocks:
          - type: paragraph
            body: >-
              战略背景对 Isar 有利，因为欧洲仍想要更多主权发射能力；但竞争背景已经不再空白。Ariane 6 和 Vega 已重回市场，Arianespace 继续提升任务清单执行，ESA
              也明确赞助一个更宽的玩家群，里面包括 RFA、MaiaSpace、PLD Space 和 Orbex。欧洲之外，Electron 已经展示了专用小型发射需要跨过的飞行履历门槛。这意味着 Isar
              需要的不只是“一个市场”；它要赢下的是一个机构支持、制造吞吐和信任都被争夺的市场。公司自身的垂直整合策略部分降低了供应商依赖，但也意味着发射、测试和生产瓶颈可能出现在 Isar
              自己的系统里，而不是外部供应商边界上。因此，正确的风险框架不是欧洲缺少发射服务需求，而是太多项目可能在追逐太少的近期盈利节奏，同时既有玩家和验证更充分的挑战者设定可靠性基准。如果 Isar
              继续拖延资格验证、在客户服务开始前需要新资本，或无法把政策动能转化为可重复的运营证明，投资逻辑就会破裂。
