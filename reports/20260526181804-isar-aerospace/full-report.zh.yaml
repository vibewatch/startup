      - number: '6.2'
        title: 机构订单积压质量强于商业验证
        blocks:
          - type: paragraph
            body: >-
              Isar 客户故事中记录最充分的部分，是机构订单积压。挪威航天局合同写明了载荷系列、轨道、发射场和到 2028 年为止的外部时间窗口。Flight Ticket 授予同时点名两个任务——ISISpace 的
              CASSINI 和 Infinite Orbits 的 Tom & Jerry——并把它们接到 ESA 和欧盟委员会的采购栈上。ΣYNDEO-3 更进一步，不仅点名 Redwire
              为主承包商，还描述了载荷数量，并披露 2026 年第四季度发射窗口。ESA 另行提供 Boost 支持也很重要，因为它资助了这些客户依赖的供给侧：试飞准备、产能爬坡和第二次飞行就绪。


              这种机构质量之所以突出，是因为 Isar 第一次 Spectrum 飞行并不是客户任务。2025 年 3 月的发射是一次数据采集测试，没有携带客户载荷，并在大约 30 秒后结束，但发射台保持完好，ESA
              公开把结果定义为有意义的一步。这个顺序影响订单积压质量：首次入轨尝试失败后，欧洲仍愿意把机构任务交给
              Isar，说明公共买家买的不只是短期已验证的发射节奏，也是在购买选择权和战略发射能力。不过，同样这些来源没有披露定价、里程碑付款结构，也没有披露第二次及后续飞行延误时客户拥有的补救权。
