      - number: '7.2'
        title: 许可、法律条件和 Andøya 集中度仍是一阶依赖
        blocks:
          - type: paragraph
            body: >-
              发射场故事在战略上很强，运营上却很集中。CAA Norway 称 Andøya Spaceport 最多可支持每年 30 次发射，目前有一个发射台由 Isar 独家使用；但同一个监管机构也表示，Isar
              每次发射都必须取得许可。这意味着发射节奏不仅取决于运载火箭就绪，还取决于监管机构、靶场和海事安全的反复执行。法律栈也仍在演进。挪威当局目前按现有框架发放发射许可，而公开法律分析称，修订后的 Space Act
              预计会正式规定许可要求、运营方义务、责任和保险，并保留附加条件或直接拒绝的裁量权。Andøya 的国有属性降低了相对脆弱私人靶场的交易对手风险，但也意味着 Isar 仍绑在单一主权基础设施和监督制度上。德国总理
              Friedrich Merz 和挪威首相 Jonas Gahr Støre 在 2026 年 3 月访问
              Andøya，进一步说明它已经是政治上显眼的主权能力资产；这有支持作用，也让项目比纯商业发射台关系更容易受国家优先级变化影响。Nova Scotia 伙伴关系方向上有用，但今天仍只是一个多元化选项，还不是
              Andøya 或挪威许可流程的实时产能泄压阀。
