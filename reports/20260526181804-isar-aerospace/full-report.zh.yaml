      - number: '8.3'
        title: 欧洲主权选择权与可比发射同业
        blocks:
          - type: paragraph
            body: >-
              Isar 今天最重要的估值支撑是战略性的，而非财务性的。ESA、欧盟委员会和各国机构现在明确用商业采购来拓宽欧洲发射基础，Isar 已经赢得了 2026 年以后开始的两个 Flight Ticket
              任务。Boost! 旨在共同资助商业发射服务，甚至包括相关航天港和测试能力；European Launcher Challenge 的结构，是在成员国支持的前提下，把可观后续资本投向多个挑战者。挪威围绕
              Andøya 的国家支持角色又加了一层：欧洲买的不只是一枚火箭，而是在建设一个自己控制的北方发射节点。


              这种战略选择权真实存在，但不会创造垄断经济性。同一轮采购转向也在支持更宽的玩家群。欧洲在重型和中型端仍有 Ariane 和 Vega；RFA、HyImpulse、MaiaSpace
              和其他公司也都在试图在微型发射器或相邻发射栈中站住位置。SpaceNews 和 NewSpaceEconomy 都指向一个正在恢复并多元化的市场，而不是一个保证每个进入者都能拿到有吸引力份额的市场。


              公开可比公司凸显了证明缺口。Rocket Lab 的公开市值远高于 Avio，但 Rocket Lab 也拥有多得多的飞行履历和公开披露，包括当前的 10-K 申报记录。Avio
              则提供了一个带既有玩家身份的较低欧洲公开锚。教训不是 Isar 应得这个倍数还是那个倍数；而是发射公司的市场价值高度取决于证明、披露和机构定位，这三项对 Isar 仍不完整。
