      - number: '8.4'
        title: 情景区间、逻辑破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              区分乐观、基准和悲观情景的，不是 TAM 叙事，而是里程碑。乐观情景下，接下来的 Spectrum 飞行成功，Flight Ticket 任务转化为重复机构采购，主权发射政策把 Isar
              变成半战略基础设施资产，并以更干净条款获得又一轮支持性融资。基准情景下，Isar 仍是欧洲资金最充足的独立发射公司之一，并保持战略相关性，但由于披露和经济性仍落后于叙事，估值大体围绕 2025
              年独角兽线横盘。悲观情景下，更多发射延误撞上持续的工厂和测试支出，把公司推入融资重置，可转债按更不利条款重新定价。


              因此，今天的区间应该保持宽。仅基于公开信息，€0.8 billion 到 €1.6 billion 的区间，比把最新 >€1 billion
              标记视为完全厘清的公允价值更站得住：低端吸收里程碑失败和融资风险下行，高端则保留欧洲继续奖励新增主权发射能力时的战略选择权价值。这个区间有意谦逊，因为经审计收入和现金数据都不可得。


              因此，尽调清单简单但关键。从继续研究走向买入之前，投资者需要看到经审计或达到贷款人级别的现金和烧钱数据、Eldridge
              可转条款和股权结构栈、合同层面的订单积压经济性、保险和责任结构，以及重返飞行后的单次飞行成本路径。没有这套材料，正确姿态仍是战略好奇，而不是激进承销。
