  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Isar 比较容易让人关心，却不容易承销。正面逻辑是真实的：2025 年 6 月融资通过可转工具从 Eldridge 又引入 €150 million，多家独立媒体称该轮把 Isar 推到超过 €1
              billion
              的独角兽估值，公司也继续把自己包装为欧洲的主权进入平台，而不只是另一家小型发射创业公司。这个战略框架重要，因为过去几年，欧洲重新意识到独立发射能力在政治和军事上有多重要。一家公司如果能成为可重复的主权发射供应商，可能在赚到公开市场式财务倍数之前，先赚到战略价值。


              反向逻辑比庆祝性标题更强。最新工具是可转债，而不是干净的新股定价；2025 年 3 月的首次 Spectrum 飞行在大约 30
              秒后结束；公开材料仍没有提供经审计收入、现金余额、毛利率或单位经济性披露。换句话说，投资者能看到战略重要性和资本可得性，但仍看不到足够运营证据来主张 2025 年独角兽标记有现金流支撑。


              这组事实指向的是价格敏感的建议，而不是对公司质量的背书。仅基于公开信息的结论是继续研究 / 观察，而不是买入：保持跟进，因为主权和机构选择权价值真实存在；但在 Isar
              证明重返飞行、节奏和更干净经济性之前，应假设当前标记偏高。
