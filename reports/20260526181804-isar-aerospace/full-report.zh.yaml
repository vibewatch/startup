      - 证据
      - 含义
      - 尽调问题
    rows:
      - - Boost! / Flight Ticket / ELC 采购转向
        - 驱动
        - 2025-至今
        - ESA 项目现在以竞争方式购买服务或共同出资
        - 为商业发射商搭建经常性欧洲需求渠道
        - 核查有多少后续任务能转化为确定发射订单。
      - - 主权进入与安全叙事
        - 驱动
        - 2024-至今
        - ESA、挪威及与 NATO 关联的表述强调韧性和自主
        - 支撑公共部门扶持欧洲发射供给的意愿
        - 验证叙事是否变成经常性预算，而不是一次性授标。
      - - Andøya 极地 / SSO 发射场
        - 驱动
        - 2025-至今
        - 新的欧洲大陆发射场贴合 EO 和监视需求
        - 提升北向轨道任务的市场匹配度
        - 核实实际档期可用性、周转时间和发射窗口利用率。
      - - 小卫星和星座增长
        - 驱动
        - 2025-至今
        - ESA 和公司材料强调高能力轻型卫星与星座部署
        - 让专用发射价值主张继续成立
        - 索取客户管线中单星、批量和补网任务的拆分。
      - - 欧洲需求有限，供应商过多
        - 约束
        - 2026-至今
        - 行业评论指向可能整合
        - 可能压低价格并推迟盈利
        - 按供应商拆分的需求积压、按任务类型拆分的胜率，是关键尽调问题。
      - - 可靠性和飞行履历不成熟
        - 约束
        - 2025-至今
        - Spectrum 首飞约 30 秒后结束；同行也出现延期或硬件受损
        - 机构买方可能谨慎分阶段下单
        - 索取复飞里程碑，以及保险 / 客户重新定向条款。
      - - 拼车和重型发射的价格压力
        - 约束
        - 持续
        - 与大型运载火箭相比，微型发射商难以在每公斤价格上竞争
        - Spectrum 必须靠控制权、轨道和主权赢，而不是单纯靠成本
        - 比较实际任务报价与拼车、Vega-C 同类方案。
      - - 单位经济性和任务定价未披露
        - 约束
        - 持续
        - 公开来源缺少发射价格和利用率披露
        - 阻碍公开 SAM / SOM 和利润率建模
        - 获取保密发射清单、定价和工厂利用率数据。
    notes: 本表把每个驱动因素或约束都钉到时间点和下一步尽调问题，而不是把「太空需求」泛泛当成顺风。
