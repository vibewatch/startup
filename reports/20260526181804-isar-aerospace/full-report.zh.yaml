  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、合同组合与私有披露缺口
        blocks:
          - type: paragraph
            body: >-
              Isar 卖的是发射服务，不是软件订阅，也不是纯政府研发项目。官网提供专属、主载和拼车配置； 公开合同组合目前覆盖 Norwegian Space Agency 的 Arctic Ocean
              Surveillance 卫星、ESA 和 European Commission 的 Flight Ticket 任务、ΣYNDEO-3 项目、SEOPS、Astroscale 和
              R-Space。这一组合显示出清晰的潜在收入模式： 围绕轨道、排期、载荷集成和发射执行谈判任务合同，部分机构航班受益于公共共同资助。公司没有披露的内容同样重要。
              网站提到“定价选项”，但没有公布费率卡；没有公开订单积压价值，没有定金时间表，没有取消框架， 没有已确认收入桥，也没有披露客户集中度。North Data 暴露出基于备案的财务指标确实存在，但即便在那里，
              当前收入仍被遮蔽。结果是，公司显然商业化、也明显在赢得任务，但衡量收入质量所需的指标仍处于私有未披露状态； 投资者会用这些指标评估透明发射运营商或上市工业公司。
