  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Spectrum 产品定义与火箭架构
        blocks:
          - type: paragraph
            body: >
              Isar Aerospace 销售的是入轨通道，而不是推进组件：Spectrum 被营销为面向中小型卫星和星座的灵活发射服务，
              提供专属、主载和拼车三种预订模式，让客户在排期控制和共享飞行经济性之间取舍。公开规格显示， Spectrum 高 28 m、直径 2 m，LEO 载荷能力 1,000 kg，SSO 载荷能力 700
              kg。火箭采用直接的两级架构： 一级使用 9 台自研 Aquila 发动机，二级使用 1 台真空优化 Aquila。Isar 也强调 LOX/丙烷推进剂组合；
              相比以煤油为主的同业，这是一个差异点，公司把它表述为高性能，也比更经典的碳氢组合更清洁。 技术姿态在系统层面有意保持简单：没有公开末级推进段，没有公开复用子系统，也还没有复杂的多火箭家族。
              这种简单性支撑了更易制造的产品定义，但也意味着 Spectrum 的差异化高度依赖执行质量、二级灵活性， 以及公司把内部控制转化为可靠飞行运营的能力。
