      - number: '5.5'
        title: 相对欧洲同业的技术差异化
        blocks:
          - type: paragraph
            body: >
              Spectrum 处在拥挤但异质的欧洲发射器赛道。相对 Rocket Factory Augsburg，Isar 采用更简单的两级系统， 而不是带独立轨道转移级、采用富氧分级燃烧发动机的三级火箭。相对
              Maia，Spectrum 放弃复用和甲烷， 转向一次性丙烷火箭，公开待验证子系统更少。相对 HyImpulse，它避开混合推进，以及该架构附带的激进节奏主张。 对照全球小型发射参照物，Spectrum
              的载荷显著高于 Rocket Lab Electron，并大致与 Firefly Alpha 同级， 但没有 Electron 的末级推进段传承，也没有 Firefly
              已经展示过的运营响应能力。对照欧洲既有路线， Vega C 更大、更机构化，运营成熟度也更高。结果是一个差异化但狭窄的切口：Spectrum 最适合被理解为一款高载荷欧洲微型发射器，
              围绕垂直整合和欧洲大陆靶场通道建设，而不是围绕复用、末级推进段精度或机构飞行履历建设。 如果 Isar 入轨并快速稳定节奏，这可能是强位置；否则，拥挤的同业集合和欧洲仍有限的发射需求，会压缩 Spectrum
              把技术承诺转化为持久发射经济性的时间。
