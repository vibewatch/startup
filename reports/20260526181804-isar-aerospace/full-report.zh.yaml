      - number: '7.4'
        title: 大额融资后，资本强度仍然很高
        blocks:
          - type: paragraph
            body: >-
              按欧洲发射公司标准，Isar 已筹集大量资本，但融资历史没有消除融资风险；它反而证明这个模式仍然吃资本。公司到 2023 年已融资超过 €310 million，到 2024 年中超过 €400
              million，随后在 2025 年从 Eldridge 获得 €150 million 可转债。公开报道称，该交易后私人融资总额超过 €550 million。与此同时，Isar 正在建设新的 Munich
              生产园区、扩张测试能力、在制多枚运载火箭，并试图在经常性发射收入可见之前，从原型节奏切到工业节奏。管理层的回应，是把前生产副总裁 Björn Dressler 提升为
              COO，并明确授权他负责产出、质量、成本效率、自动化以及搬入新的 Munich 总部。这是合理的缓释动作，但也凸显公司前方还有大量运营系统要搭建。ESA 的 Boost! 资金和 NATO
              支持的投资提升了可信度，也帮助桥接具体里程碑，但 ESA 把其项目描述为共同资助和采购支持，而不是全栈发射器融资。实际含义是，Isar
              的资产负债表仍必须吸收从资格飞行到可靠商业服务之间的这段周期。若公开层面看不到烧钱速度、单位经济性或债券转换条款，投资者不能假设当前资本足以在没有又一轮融资事件的情况下跑到自我维持的发射节奏。
