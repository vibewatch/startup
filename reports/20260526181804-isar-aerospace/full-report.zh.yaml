        - 复飞后已运营；Avio 现在是商业提供方
        - 机构任务和附加乘客拼车
        - 已有服务记录，并拿到 3 次 Flight Ticket 辅助任务
        - 级别重于 Spectrum；并不总是专用出租车
      - - Rocket Lab Electron
        - 全球专用小型发射基准
        - 300 kg LEO；Kick Stage；2 级 + Kick Stage
        - 已运营；截至目前 88 次发射
        - 提供定制轨道的专用或拼车发射
        - 发射节奏已验证，Kick Stage 灵活，拥有 3 个发射台
        - 载荷小于 Spectrum；不是欧洲主权选项
      - - SpaceX Falcon 9 拼车
