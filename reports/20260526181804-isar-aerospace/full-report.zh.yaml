  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 已审阅来源中的证据
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - Andøya 发射台独家使用权
        - 更多欧洲发射台上线，或 Andøya 吞吐量低于目标
        - Andøya 目前有一个运营中的发射台，由 Isar 独家使用；但 30 次发射许可假设未来会增加发射台
        - 中
        - 跟踪 Andøya 吞吐量、发射窗口分配，以及扩建发射台后独家权能否保住
      - - 早期机构牵引
        - 欧洲继续把小卫星采购分给 Isar 和既有拼单发射
        - Flight Ticket 授予 Isar 两个专属任务、Avio 三个辅助载荷任务
        - 中
        - 询问前两次 Spectrum 机构飞行后，后续主权任务有多少转化
      - - 垂直整合和工厂规模
        - 工厂雄心未转化为可靠的入轨发射节奏
        - Isar 公开目标是每年 30-40 枚火箭，但 Spectrum 尚未入轨
        - 高
        - 要求 Munich 工厂提供发动机良率、级测试吞吐量和单位成本曲线证据
      - - 载荷能力大于 Electron
        - Falcon 9 拼单和 Vega C 吸收不需要专属“出租车”的任务
        - SpaceX 公布透明的拼单经济性，Vega C 已服务机构小载荷
        - 高
        - 按真正需要专属轨道控制或欧洲发射场控制的任务切分可服务市场
      - - 首次综合飞行经验
        - 入轨失败仍会把客户推向已验证替代品
        - Spectrum 完成飞行并回传数据，但升空后失去控制，在 T+30 秒被终止
        - 高
        - 要求提供根因结案、纠正措施，以及成功轨道任务日期的可信度
      - - 欧洲挑战者阵营宽度
        - 欧洲项目太多、需求太少，价格和补贴支持都会被挤压
        - 多份 2025-26 年评论公开预计微型发射器领域会整合
        - 中
        - 建模比较 2027-2030 年需求与已宣布供给，并测试没有更多公共锚定需求时 Isar 是否仍可行
    notes: 严重性为定性判断。该登记表关注：当客户对比拼单替代方案、主权采购从试点支持转向重复购买后，Isar 当前优势能否延续。
