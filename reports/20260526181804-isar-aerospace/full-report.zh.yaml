          label: 影响转化
        - from: backlog
          to: cadence
          label: 填充档期
        - from: price
          to: margin
          label: 单次发射收入
        - from: cadence
          to: unitcost
          label: 稀释或闲置成本
        - from: unitcost
          to: margin
          label: 成本负担
        - from: margin
          to: diligence
          label: 无法公开核验
