  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局概览——直接同业、既有玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 处在欧洲发射堆栈复苏中最拥挤的位置：亚轨道和小型入轨发射商承诺为小卫星提供专属通道， 同时 Ariane 6 和 Vega C 正在恢复欧洲既有运力，Falcon 9 和
              Electron 也持续吸收真实任务。直接欧洲同业包括 Rocket Factory Augsburg、HyImpulse、Orbex、PLD Space 和 MaiaSpace。这个阵营在战略上并不均质。
              RFA 和 Isar 都主打相对大型的欧洲小型发射器；HyImpulse 主打混合推进的可负担性；PLD 和 Maia 更强调复用叙事； Orbex 仍然相关，是因为它仍在 ESA
              挑战者池中，即便其近期时间表证据较弱。


              更重要的竞争框架是，客户不必等待某一家欧洲创业公司成熟。他们可以继续作为辅助载荷搭乘 Vega C， 从 Electron 购买已验证的专属小型发射服务，或者接受 Falcon 9
              的拼车经济性和较低轨道定制能力。 欧洲设立 Flight Ticket 和 Boost，本来就是为了摆脱单一垄断模式；但这些项目也确认，既有玩家和替代品仍深嵌采购。 因此，Isar
              同时在两个市场竞争：一边和欧洲直接火箭创业公司争夺未来主权需求，一边和已经可运营的替代方案争夺今天对排期敏感的任务。
