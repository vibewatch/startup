        - 聚焦专用小卫星
        - 仍在 ESA 挑战者池内，因此仍牵动资金支持
        - 无法刷新当前官方载荷 / 进度细节
      - - PLD MIURA 5
        - 欧洲直接可复用小型发射商
        - 可复用 2 级火箭；专用 / 共享 / 搭载模式
        - 项目仍在研发，披露了资质认证和 Kourou 发射台进展
        - 专用、共享和搭载任务
        - 在欧洲直接同行中，公开打包选项最明确
