      - number: '1.4'
        title: 里程碑、执行状态与反向因素
        blocks:
          - type: paragraph
            body: >-
              和纸面火箭创业公司相比，Isar 的运营时间线已经实质性降险，但仍有一个核心反向事件。到 2023 年底， Andøya Spaceport 已开放其首个轨道发射场，Isar
              独家使用当前唯一发射台。随后挪威监管机构在 2025 年 3 月批准 Spectrum 首次试飞；3 月 30 日，火箭起飞、离台，并在终止前飞行了约 30 秒。该事件构成反向证据：
              火箭没有入轨，本章审阅的公开来源也仍未披露根因报告。与此同时，官方、ESA 和媒体报道都一致认为， 任务交付了大量飞行数据，且发射台保持完好。此后，Isar 增加了机构和商业需求信号：Norwegian
              Space Agency 合同、ESA 和 European Commission 的 Flight Ticket 工作、后续 ESA ΣYNDEO-3 任务、SEOPS 发射协议， 以及 Astroscale
              碎片清除任务。公司还披露了快速回归测试节奏、第二枚火箭进展，以及一个每月可完成 30 多次发动机测试的 Esrange
              第二测试场。因此，这家公司技术上在推进、融资厚实、商业相关性明确，但仍未完全证明入轨可靠性，商业透明度也不足。
