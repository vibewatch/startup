  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 试飞后的技术执行在改善，但风险尚未解除
        blocks:
          - type: paragraph
            body: >-
              Isar 已把技术问题从“运载火箭能不能离开发射台？”推进到“公司能不能反复完成入轨资格验证？”2025 年 3 月 30 日的 Spectrum 首飞完成点火升空并离开发射台，但车辆在 T+30
              秒失控后被终止。后续公开报道把失败归因于滚转机动开始时排气阀意外打开，因此异常已经不再是纯黑箱。这很重要，因为公司展示了真实迭代速度：#2 和 #3 号箭已经在生产中，下一发火箭的两级到 2025 年 12
              月均通过 30 秒一体化静态点火，Esrange 扩张又增加了发动机和一体化级段验收能力。反向点在于，这些里程碑都不能替代一次完成的入轨任务。Isar 最初把第二次资格飞行目标定为不早于 2026 年 1 月
              21 日，随后在解决首次发射尝试中的增压阀问题后，把可用发射窗口重置为不早于 3 月 19 日。即便重置后，2026 年任务仍因靶场侵入和温度漂移而取消发射，随后又因 COPV 泄漏再次暂停。垂直整合帮助
              Isar 快速学习，但也把缺陷逃逸、验收测试和任务保证风险集中在同一个运营栈里。
