          - type: callout
            title: 市场可以先形成，再变得经济上舒服
            body: >-
              欧洲可能先成功创造一个主权小型发射市场，然后才创造一个利润率舒适的市场。需求信号真实存在，但价格不透明， 可靠性仍在验证，多家供应商还在追逐一个可信观察者已经认为相对美国偏小的市场。这种组合可以带来战略相关性，
              但不必然带来近期定价权。
