- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Named proof
  - Primary use case
  - Strategic value
  - Key gap
  rows:
  - - Sovereign national agency
    - Norwegian Space Agency / Norwegian government / Norwegian maritime-security users
    - AOS contract for two satellites through 2028
    - National maritime surveillance from a Norwegian launch site
    - High-reference sovereign customer and anchor for Andøya-based government demand
    - Contract value, milestone schedule, and cancellation rights not disclosed
  - - ESA / EU institutional buyer
    - ESA, European Commission, mission primes, IOD/IOV payload owners
    - Flight Ticket missions (CASSINI, Tom & Jerry) and ΣYNDEO-3
    - Technology demonstration, qualification, and sovereign access procurement
    - Most verifiable part of backlog; missions and programme structure are named
    - Public sources do not show launch-price economics or rebooking behavior
  - - Launch aggregator / mission-management platform
    - SEOPS / downstream LaunchLock Prime customers / payload operators
    - Dedicated mission scheduled for 2028
    - Dedicated launch capacity procured on behalf of multiple payload customers
    - Broadens Isar beyond direct satellite OEM selling
    - Underlying end-customer count and firm commitments are opaque
  - - In-orbit servicing / ADR operator
    - Astroscale / mission team / end client Eutelsat OneWeb
    - ELSA-M in-orbit demonstration mission
    - Orbit-precision launch for active debris removal and rendezvous operations
    - Shows fit for complex, high-precision payloads
    - Launch date, contract value, and repeat-booking path are not public
  - - IOD platform operator
    - R-Space / demonstration customers / technology developers
    - Two satellites in 2026 with further flights planned
    - Flying in-orbit demonstrations for R-Space customers
    - Only public commercial example with explicit follow-on language
    - Repeat flights are planned, but no economics or signed quantity is disclosed
  - - Launch-site / expansion partner
    - Maritime Launch Services / Canadian government and commercial users / Isar
    - Nova Scotia letter of intent
    - Potential future mid- to high-inclination launch capability from North America
    - Could expand geographic reach and sovereign-buyer relevance
    - LOI is not the same as booked launch demand and the site is still under construction
  notes: Rows reflect publicly named counterparties only; Maritime Launch is included as a launch-demand channel partner, not as confirmed launch revenue.
