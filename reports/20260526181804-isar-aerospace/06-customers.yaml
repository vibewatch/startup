company:
  name: Isar Aerospace
chapter:
  number: 6
  title: Customers
  summary: 'Isar Aerospace''s public customer proof is real but narrow: the clearest backlog is institutional and sovereign, anchored by the Norwegian Space Agency''s AOS contract, ESA and European Commission Flight Ticket awards, and ESA''s ΣYNDEO-3 mission, while commercial evidence is limited to a handful of named launch agreements with SEOPS, Astroscale, and R-Space plus a non-binding Maritime Launch LOI. Public sources support launch demand across 2026-2028, but they do not disclose contract values, renewal behavior, backlog revenue mix, or cancellation terms, and all visible demand remains concentrated on a single Andøya pad after a first Spectrum test flight that ended after roughly 30 seconds. The customer thesis is therefore credible on mission specificity and institutional support, but still unproven on durability, monetization quality, and concentration risk.'
sections:
- id: buyer-segmentation-and-public-proof
  title: Buyer segmentation and public customer proof
  body: |-
    Isar Aerospace's visible customer set is much smaller than a scaled launcher incumbent's manifest, but it is already diversified by buyer type. The clearest segment is sovereign and institutional demand: the Norwegian Space Agency selected Spectrum for two Arctic Ocean Surveillance satellites, while ESA and the European Commission awarded Flight Ticket missions and separately contracted ΣYNDEO-3 under the IOD/IOV programme. These customers matter because they are named, mission-specific, and attached to public programmes rather than logo-only marketing.

    The commercial side of the public backlog is narrower but strategically useful. SEOPS represents a launch-broker or mission-management buyer that can aggregate downstream payload demand; Astroscale represents a precision-sensitive in-orbit servicing customer; and R-Space represents a demonstration-platform customer whose own clients are technology developers seeking flight heritage. Maritime Launch Services broadens the channel picture, but it is a launch-site expansion partner under a letter of intent rather than a paying launch customer. The result is a customer base that is broader by use case than by count: sovereign surveillance, institutional technology demonstration, launch aggregation, debris-removal servicing, and IOD platform operators are all present, but only a handful of named counterparties support the entire public demand narrative.
