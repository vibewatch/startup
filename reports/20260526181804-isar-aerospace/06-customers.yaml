  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer-level NRR, GRR, churn, renewal, and rebooking metrics by segment.
    whyItMatters: Durability is a core customer chapter requirement and is currently unsupported by public evidence.
    diligencePath: Request a cohort table showing launches booked, flown, deferred, cancelled, and rebooked by customer and mission type.
    relatedQuestionRefs:
    - QU016
    - QU023
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Contract values, deposits, milestone-payment schedules, cancellation clauses, and liquidated-damages terms for named launch agreements.
    whyItMatters: Backlog quality cannot be converted into revenue confidence without understanding economic commitment and termination rights.
    diligencePath: Obtain at least one institutional contract and one commercial contract or summary sheet with economics and termination provisions.
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Backlog share and expected revenue contribution by customer, by programme, and by launch site.
    whyItMatters: Public customer count alone understates how exposed the business may be to one programme, sovereign buyer, or site.
    diligencePath: Request a backlog bridge that splits signed demand across sovereign, institutional, and commercial customers and across Andøya versus future sites.
    relatedQuestionRefs:
    - QU018
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table coverage
    missingEvidence: A complete list of all signed launch customers, including any undisclosed or unannounced commercial buyers.
    whyItMatters: The public named-customer table is only a partial sample and may overstate concentration if hidden customers exist or understate it if few do.
    diligencePath: Reconcile the public list against the internal launch manifest and disclose which public rows are signed, planned, or merely pipeline.
    relatedQuestionRefs:
    - QU002
    - QU003
    relatedTableRefs:
    - TU003
