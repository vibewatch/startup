- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / cancellation risk
  - Impact
  - Current evidence
  - Diligence path
  rows:
  - - Institutional procurement shift toward commercial launch
    - Too much public proof depends on ESA / EU / Norway demand
    - High — loss of one public channel would remove most visible backlog credibility
    - Flight Ticket, ΣYNDEO-3, AOS, and Boost all reinforce the institutional lane
    - Break down backlog by sovereign, institutional, and commercial revenue share
  - - Andøya single-pad exclusivity
    - One pad and one range can delay every named mission
    - High — range outage or licensing slippage can propagate through all visible customers
    - CAA Norway says only one pad exists today and it is used exclusively by Isar
    - Request pad redundancy, range-availability assumptions, and recovery-time plans
  - - Mission-specific proof after failed first flight
    - Customers may defer or re-time launches until Spectrum reaches orbit
    - High — schedule credibility matters more than logos at this stage
    - First flight carried no customer payload and ended after ~30 seconds; second-flight readiness is improving
    - Request customer communications and any post-failure contract amendments
  - - Commercial intermediary model
    - SEOPS and R-Space can hide weak end-customer depth behind one contract
    - Medium — one counterparty can aggregate several payloads, or very few
    - Both commercial examples point to downstream customers behind the immediate buyer
    - Request payload counts, deposits, and minimum committed launch volume
  - - European microlauncher market shakeout
    - Weak demand or overcapacity could compress pricing and increase cancellations
    - Medium to high — small public backlog leaves little buffer
    - SpaceNews and IndustryExaminer both frame the market as competitive and performance-driven
    - Request win/loss data versus Avio, PLD, RFA, and other European launchers
  - - North American expansion via Maritime Launch
    - LOI may not convert if Nova Scotia construction or licensing slips
    - Medium — orbit diversification is strategic but not bankable yet
    - Maritime Launch still describes Spaceport Nova Scotia as under construction
    - Track Canadian site readiness milestones before underwriting any revenue from this path
  notes: Impact ratings are analytical judgments based on disclosed backlog concentration and site dependence, not on disclosed contract values.
