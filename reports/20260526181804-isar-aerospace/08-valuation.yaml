chapter:
  number: 8
  title: Valuation
  summary: 'Isar Aerospace''s last visible price signal is the June 2025 Eldridge convertible that independent coverage said pushed the company above a €1 billion unicorn valuation, but public evidence still does not provide audited revenue, cash, or margin data. The right frame is therefore scenario-driven and option-like rather than cash-flow-underwritten: Europe may pay for sovereign launch redundancy, yet first-flight failure, industrial capex, and a convertible structure justify a meaningful discount to the headline private mark today.'
sections:
- id: SV001
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: |-
    Isar is easier to care about than to underwrite. The positive case is real: June 2025 financing brought in another €150 million from Eldridge through a convertible instrument, multiple independent outlets said the round pushed Isar above a €1 billion unicorn valuation, and the company continues to market itself as a sovereign-access platform for Europe rather than just another small-launch startup. That strategic framing matters because Europe has spent the last several years rediscovering how politically and militarily important independent launch capability is. A company that can become a repeatable sovereign launch supplier can earn strategic value before it earns public-market-style financial multiples.

    The anti-thesis is stronger than the celebratory headlines. The latest instrument was a convertible bond rather than a clean primary equity price, the first Spectrum flight in March 2025 ended after roughly 30 seconds, and public materials still do not provide audited revenue, cash balance, gross margin, or unit-economics disclosure. In other words, investors can see strategic importance and capital access, but they still cannot see enough operating evidence to claim that the 2025 unicorn mark is cash-flow backed.

    That combination points to a price-sensitive recommendation rather than a company-quality endorsement. The public-only call is research-more / track, not buy: stay engaged because the sovereign and institutional option value is real, but assume the current mark is stretched until Isar proves return-to-flight, cadence, and cleaner economics.
