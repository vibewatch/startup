- id: SV002
  title: Financing Anchor, Launch-Risk Discount, and Capital Intensity
  body: |-
    The June 2025 financing should anchor the chapter, but only cautiously. It is the best direct market-clearing signal available for Isar, yet it came as convertible debt after the company had already spent years raising capital for vehicle development, launch-site buildout, and industrial production. That matters because capital-intensive launcher companies usually raise not once but repeatedly as they fund hardware, test infrastructure, production tooling, insurance, and working capital ahead of reliable flight cadence. Isar's own disclosures reinforce that point: it raised $165 million in 2023, extended Series C past €220 million in 2024, signed a large new HQ and production site near Munich, and then expanded engine and stage-testing capacity again at Esrange in early 2026.

    The first Spectrum flight is why the discount must remain meaningful. Isar, ESA, and SpaceNews all agree the March 2025 mission cleared the pad and produced data, but they also agree the vehicle did not reach orbit and was terminated after about 30 seconds. That is a useful engineering milestone, not an investable proof point on its own. The right underwriting stance is to assume that launch-risk discount remains heavy until Spectrum returns to flight and then begins converting test success into reliable commercial cadence.

    Because audited financials are unavailable, the scenario table and sensitivity chart matter more than precision math. They show what is really driving value today: whether the next launch works, whether infrastructure spending produces actual throughput, and whether the next financing happens from strength rather than necessity.
