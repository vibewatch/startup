- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Isar 2025 Eldridge financing
    - Latest private financing signal
    - '>€1bn unicorn valuation implied, but via convertible bond'
    - Best direct price signal for Isar itself
    - Convertible structure and absent audited financials make the mark hard to treat as clean common equity value.
  - - Rocket Lab
    - Public market value + filing cadence
    - $82.41bn market cap in May 2026; 2026 10-K listed by Stocklight and SEC filing page
    - Shows what a highly de-risked public launch platform can command
    - Far more flight-proven and disclosed than Isar, so the multiple is not transferable.
  - - Avio
    - Public European incumbent anchor
    - €1.82bn market cap in May 2026
    - Provides a listed European comparison tied to launcher capability
    - Different business mix, maturity, and institutional role than Isar.
  - - RFA ONE
    - Private peer status / payload class
    - 1300kg to 500km SSO; still pre-orbit
    - Close European small-launch peer by mission class
    - No public valuation disclosed and its own execution path remains uncertain.
  - - HyImpulse SL1
    - Private peer status / payload class
    - 600kg to LEO hybrid launcher
    - Shows the field is crowded even below Isar scale
    - Earlier stage and smaller than Isar, so it is a crowding reference more than a value comp.
  - - Firefly Alpha
    - Private U.S. peer status / payload class
    - 1030kg LEO / 630kg SSO launcher
    - Useful operating-category comparison in small launch
    - Private economics are undisclosed and U.S. ecosystem support differs from Europe.
  - - Maia
    - Adjacent sovereign-European option
    - 1500kg to 700km SSO expendable / 500kg reusable
    - Shows Europe is also backing other sovereign launch options
    - Not a stand-alone public comp and sits in a different industrial structure.
  enumerationScope:
    coverage: partial
    basis: 'This comp set captures the most decision-useful reference points in the reviewed record: Isar’s latest private mark, two public anchors, and several source-backed launch peers by status and payload class.'
  notes: The table mixes valuation anchors with status anchors because no perfect public comp exists for a private European launcher at Isar's stage. The right use is triangulation, not multiple transfer.
