  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited or lender-grade revenue, cash balance, burn, gross margin, and working-capital reporting for 2025 and 2026.
    whyItMatters: The chapter cannot move from option-value framing to cash-flow underwriting without seeing whether the business is funded and economically improving.
    diligencePath: Request audited FY2025 statements plus a board-approved 12-month liquidity bridge.
    relatedQuestionRefs:
    - QV005
  - type: private-evidence-only
    severity: material
    topic: convertible-terms
    missingEvidence: Conversion mechanics, discounts, valuation cap if any, seniority, collateral, and any investor protections attached to the Eldridge instrument.
    whyItMatters: Enterprise value headlines can overstate common-equity value if the convert prices on investor-friendly terms.
    diligencePath: Request the executed convertible note, board approvals, and an updated fully diluted cap table.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: launch-contract-economics
    missingEvidence: Representative launch service agreements showing deposits, milestone schedule, cancellation rights, delay remedies, and insurance allocation.
    whyItMatters: Strategic demand only deserves valuation credit if it converts into protected, monetizable backlog.
    diligencePath: Review signed customer agreements and a backlog waterfall by launch year.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cost per flight, contribution margin, and learning-curve evidence after return to flight.
    whyItMatters: Vertical integration and industrial scale are only valuable if they improve unit economics instead of consuming capital.
    diligencePath: Request program-level standard-cost and contribution-margin bridges for the first three post-return flights.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: cap-table-downside
    missingEvidence: Publicly corroborated information about common-share dilution, liquidation preferences, and scenario outcomes under a flat or down financing.
    whyItMatters: The valuation range could be directionally right while the security-level return outcome is still poor.
    diligencePath: Obtain the latest charter, preference schedule, option pool, and pro forma dilution cases.
    relatedQuestionRefs:
    - QV022
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable set remains intentionally partial because no perfect public comp exists for a private European launcher at Isar's stage.
    missingEvidence: Additional source-backed private transaction marks or secondary data for European launch peers beyond the public anchors included here.
    whyItMatters: The comparable table is useful for triangulation, but its partial coverage means valuation should remain scenario-based rather than comp-mechanical.
    diligencePath: Add new peer funding disclosures or verified secondary marks in the next refresh when they become public.
    relatedTableRefs:
    - TV004
