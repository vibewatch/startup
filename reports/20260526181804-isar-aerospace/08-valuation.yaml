- id: SV003
  title: European Sovereign Optionality and Comparable Launch Peers
  body: |-
    Isar's most important valuation support today is strategic rather than financial. ESA, the European Commission, and national institutions are now explicitly using commercial procurement to widen Europe's launch base, and Isar has already won two Flight Ticket missions from 2026 onward. Boost! is designed to co-fund commercial launch services and even associated spaceport and testing capabilities, while the European Launcher Challenge is structured to put substantial follow-on capital behind multiple challengers if member states support them. Norway's state-backed role around Andøya adds another layer: Europe is not just buying a rocket, but building a northern launch node it controls.

    That strategic optionality is real, but it does not create monopoly economics. The same procurement shift is supporting a wider field. Europe still has Ariane and Vega at the heavy and medium end, while RFA, HyImpulse, MaiaSpace, and others are all trying to establish their own places in the microlauncher or adjacent launcher stack. SpaceNews and NewSpaceEconomy both point to a market that is recovering and diversifying, not one that guarantees every entrant an attractive share.

    Public comparables underline the proof gap. Rocket Lab's public value is dramatically larger than Avio's, but Rocket Lab also has far more flight heritage and public disclosure, including a current 10-K filing record. Avio offers a lower European public anchor with incumbent status. The lesson is not that Isar deserves one multiple or the other; it is that market value in launch depends heavily on proof, disclosure, and institutional positioning, all of which remain incomplete for Isar.
