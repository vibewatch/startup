- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited cash and burn
    - No public audited cash balance, monthly burn, runway, or covenant view
    - Without liquidity visibility, valuation and timing of the next financing are guesswork
    - Request audited FY2025 cash flow plus board liquidity bridge through return to flight.
  - - Convertible terms and cap table
    - No public conversion price mechanics, discounts, seniority, or preference stack disclosure
    - Common-equity value can diverge sharply from enterprise-value headlines
    - Request the Eldridge convert, current cap table, and latest charter / preference summary.
  - - Backlog and launch-contract economics
    - No public deposits, milestone schedule, delay remedies, or cancellation rights for launch contracts
    - Strategic demand is not equal to monetizable cash value
    - Review sample launch service agreements and customer backlog waterfall by year.
  - - Insurance and liability framework
    - No public visibility on launch insurance, indemnification, or payload-liability structure
    - Mission economics and downside severity depend on who carries risk after failure
    - Request insurance tower, indemnity arrangements, and post-failure remediation process.
  - - Unit cost and contribution margin by flight
    - No public cost-per-flight, learning-curve, or gross-margin data
    - Industrial scale only creates value if it improves economics, not just throughput ambition
    - Request standard-cost model, contribution margin bridge, and sensitivity to cadence.
  - - Institutional support dependency
    - No public clarity on how much future demand depends on subsidies, sovereign contracts, or policy support
    - Strategic value is durable only if policy demand converts into durable commercial position
    - Map expected ESA / EC / national missions versus purely commercial launches through 2028.
  notes: These asks are prioritized by how much they would move the recommendation. Items one through four are gating issues, not nice-to-have diligence.
