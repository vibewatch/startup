- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Indicative valuation logic
  - Probability signal
  - Key downside / trigger
  rows:
  - - Bull
    - Second Spectrum flights succeed, institutional awards convert into repeat procurement, and the next financing is supportive rather than rescue capital
    - €1.4bn-€2.0bn can be justified as Europe pays for scarce sovereign launch option value with improving execution proof
    - Needs visible return-to-flight plus evidence that Flight Ticket is opening a larger government channel
    - Breaks if return-to-flight slips or if sovereign support remains symbolic rather than budgeted.
  - - Base
    - Isar remains strategically relevant and well-funded, but orbit, cadence, and economics are still developing
    - Around €1.0bn-€1.4bn, roughly around the unicorn anchor but still haircut for launch and disclosure risk
    - 'Most consistent with current public evidence: real strategic value, incomplete operating proof'
    - Breaks if another financing happens on clearly investor-friendly reset terms.
  - - Bear
    - Further launch delay combines with continued factory, test, and working-capital needs before clean revenue proof
    - €0.6bn-€1.0bn if the next financing re-prices the business around capital needs rather than sovereign ambition
    - Becomes more likely if launches slip, contract economics stay opaque, or market crowding worsens
    - Confirmed by delayed return-to-flight, weak institutional follow-through, or a punitive recap.
  notes: These ranges are scenario bands, not mark-to-market quotes. They deliberately reflect missing audited revenue and cash data.
