- id: milestones-execution-and-adverse-factors
  title: Milestones, Execution Status, and Adverse Factors
  body: 'The operating chronology is materially de-risked compared with a paper-rocket startup, but it still contains one central adverse event. By late 2023 Andøya Spaceport had opened its first orbital launch site, with Isar holding exclusive access to the only current launch pad. Norwegian regulators then licensed the first Spectrum test flight in March 2025, and on 30 March the rocket lifted off, cleared the pad, and flew for roughly 30 seconds before termination. That event is adverse because the vehicle did not reach orbit and because public sources reviewed for this chapter still do not disclose a root-cause report; at the same time, official, ESA, and press coverage all agree that the mission delivered substantial flight data and left the pad intact. Since then, Isar has added institutional and commercial demand signals: the Norwegian Space Agency contract, ESA and European Commission flight-ticket work, a later ESA ΣYNDEO-3 mission, a SEOPS launch agreement, and an Astroscale debris-removal
    mission. It also disclosed a rapid return-to-test cadence, second-vehicle progress, and a second Esrange test site capable of more than 30 engine tests per month. The business therefore reads as technically advancing, heavily financed, and commercially relevant, but still short of fully proven orbital reliability and public commercial transparency.'
