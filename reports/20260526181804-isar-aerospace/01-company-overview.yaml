- id: capital-base-and-stakeholder-map
  title: Funding History, Valuation Thresholds, and Stakeholders
  body: 'Isar’s capital story is now strong enough to be a reusable company fact for later chapters. In March 2023 the company announced a $165 million / €155 million Series C and said lifetime capital had passed $330 million / €310 million. In June 2024 it added more than €65 million, taking the Series C total above €220 million and lifetime funding above €400 million, with the NATO Innovation Fund highlighting the strategic-security dimension of launch access. The decisive step came on 25 June 2025, when Isar announced a €150 million Eldridge Industries convertible bond. Independent June 2025 coverage then attached a valuation above €1 billion and effectively moved the company into unicorn status, while Isar’s current homepage now states that private capital raised exceeds €500 million. That combination is enough to carry two canonical facts into the rest of the report: post-Eldridge valuation is above €1 billion, and total capital is above €500 million. What it does not provide is the
    exact conversion price, dilution path, or precise live equity valuation. Publicly named stakeholders now span venture investors, strategic industrial capital, ESA-linked institutional customers, the Norwegian Space Agency, and launch-site/testing partners such as Andøya Spaceport and SSC Space.'
