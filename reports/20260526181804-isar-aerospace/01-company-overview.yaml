- id: leadership-and-governance
  title: Founders, Current Leadership, and Governance Signals
  body: 'The founder narrative remains central to Isar’s identity. Official and TUM-adjacent sources consistently name Daniel Metzler, Josef Fleischmann, and Markus Brandl as the founding trio, with current official leadership copy still placing Metzler in the chief executive role and Fleischmann in the chief technical role. Stella Guillen is the other clearly named current executive in official materials, providing commercial coverage, while older financing and launch materials add governance signals around advisory-board leadership rather than a fully disclosed board structure. In particular, 2023 financing disclosures said Porsche SE and HV Capital would join the advisory board and that 7-Industries Holding would receive observer capacity, while first-flight coverage continued to cite Bulent Altan as chairman. That is enough to conclude that governance exists beyond the founders, but not enough to map current board composition, voting control, or investor rights in detail. For diligence
    purposes, Isar still looks founder-led and key-person dependent: Metzler is the public operator, Fleischmann anchors technical continuity, and the public record says much less about the bench immediately below them than it does about capital formation and launch milestones.'
