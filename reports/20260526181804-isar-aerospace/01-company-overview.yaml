company:
  name: Isar Aerospace
chapter:
  number: 1
  title: Company Overview
  summary: Isar Aerospace is a Munich-area launch-services company founded in 2018 by Daniel Metzler, Josef Fleischmann, and Markus Brandl. Public and official sources now anchor the company around the Spectrum orbital launch vehicle, a March 2025 first flight that cleared the pad but ended after about 30 seconds, and a June 2025 Eldridge convertible financing that pushed valuation above €1 billion and total capital above €500 million. The company has built a stronger institutional and commercial launch manifest, but public disclosure remains thin on board control, exact post-Eldridge valuation mechanics, and core commercial metrics.
sections:
- id: identity-product-and-footprint
  title: Identity, Product, and Operating Footprint
  body: 'Isar Aerospace was founded in 2018 to build a privately financed European launch-services company around small and medium satellite missions. Current official copy describes the business as a launch service provider headquartered near Munich, while older company releases and TUM-linked coverage place that headquarters more specifically in Ottobrunn near Munich; those phrasings are consistent enough to treat Ottobrunn-near-Munich as the canonical location. The core product is Spectrum, a two-stage orbital launch vehicle designed for small and medium satellites and constellations. Official and third-party technical descriptions converge on payload targets of up to 1,000 kilograms to low Earth orbit and 700 kilograms to sun-synchronous orbit, with Isar stressing in-house design, manufacturing, and testing as its main cost and schedule lever. The company’s public footprint is also no longer just a workshop-scale startup story: current materials say it has more than 400 employees from
    more than 50 nations across five international locations, and they pair that scale claim with a future serial-production target of up to 40 Spectrum vehicles per year once the new Munich-area facility and associated test infrastructure are fully online.'
