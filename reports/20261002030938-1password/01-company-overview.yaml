callouts:
  - calloutType: "insight"
    title: "Structural Moat from a 14-Year Self-Funded Bootstrap"
    body: "1Password's 14-year period of un-diluted profitable bootstrapping provided the company with an unusually durable governance foundation. Entering institutional fundraising at $50M+ ARR enabled the founders to maintain significant equity control, high gross retention (>90%), and positive cash generation while scaling into enterprise markets without structural recapitalization pressure."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO011"
  - calloutType: "risk"
    title: "Single-Point-of-Failure Asymmetry in Zero-Knowledge Vaults"
    body: "The core commercial proposition of 1Password rests on absolute cryptographic integrity. Unlike conventional SaaS platforms where minor infrastructure outages cause temporary inconvenience, any undetected vulnerability, master vault breach, or compromised zero-knowledge implementation would cause catastrophic enterprise churn and irreversible reputational destruction."
    claimRefs:
      - "CO013"
      - "CO015"
