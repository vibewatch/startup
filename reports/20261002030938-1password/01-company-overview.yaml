chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2005 in Toronto by Dave Teare, Roustem Karimov, Sara Teare, and Natalia Karimova under parent company AgileBits Inc., 1Password bootstrapped profitably for 14 years before raising $920M across three venture rounds led by Accel and ICONIQ Growth. Last valued at $6.8B in its January 2022 Series C, the company has transitioned from desktop consumer password management into enterprise extended access management (XAM), serving over 200,000 businesses globally with more than 1,400 distributed employees."
sections:
  - id: "corporate-identity-and-founding-history"
    title: "Corporate Identity, Heritage, and Governance Evolution"
    body: "1Password is the commercial brand operated by AgileBits Inc., a privately held technology company incorporated in Canada and headquartered at 4711 Yonge Street in Toronto, Ontario (CO001). The company was founded in 2005 by Dave Teare, Roustem Karimov, Sara Teare, and Natalia Karimova, who initially conceived the Mac utility '1Passwd' launched in May 2006 (CO002, CO003). Unlike conventional venture-backed software startups that absorb institutional dilution in early rounds, AgileBits bootstrapped operations with organic customer revenue and sustained profitability for 14 consecutive years until November 2019 (CO004, CO005). This extended period of self-funded ownership preserved high founder equity ownership and institutional independence before external capital was accepted (CO004). Material governance evolution occurred as long-standing chief executive officer Jeff Shiner transitioned to executive chair of the board of directors in July 2025, passing operational leadership to chief executive officer David Faugno, who joined initially as co-CEO in November 2024 to steer corporate scaling and public-market readiness (CO006, CO007). Institutional board seats are held by lead investors Arun Mathew of Accel and Will Griffith of ICONIQ Growth alongside the founding group (CO008)."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-scale-metrics"
    title: "Capitalization Structure, Secondary Liquidity, and Scale"
    body: "Between 2019 and 2022, 1Password completed three institutional funding rounds totaling $920 million: a $200 million Series A in November 2019 led by Accel, a $100 million Series B in July 2021 at a $2.0 billion post-money valuation, and a $620 million Series C in January 2022 led by ICONIQ Growth establishing its peak valuation of $6.8 billion (CO005, CO009). In October 2025, early founders and tenured employees executed a $100 million secondary share sale involving the Halo Fund and Flume Ventures, allowing early equity holders to monetize personal holdings while retaining substantial equity ownership without primary corporate dilution (CO010). Operating scale has expanded rapidly, with independent trackers reporting that annual recurring revenue surpassed $400 million in late 2025 following $331 million in 2024 and $250 million in 2023, though audited statutory financials remain closely held (CO011). Corporate enterprise adoption now encompasses over 200,000 commercial customers, including over 30% of the Fortune 100 and more than two-thirds of the Forbes AI 50 (CO012). The operational headcount exceeds 1,400 distributed personnel across five countries, maintaining zero-knowledge encryption architecture and enterprise compliance controls across macOS, Windows, Linux, iOS, Android, and web interfaces (CO013)."
    claimRefs:
      - "CO005"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO001"
      - "TO003"
    figureRefs: []
  - id: "product-transformation-and-risk-exposures"
    title: "Strategic Platform Pivot and Adverse Vulnerability Surfaces"
    body: "1Password has strategically shifted from consumer vault software into enterprise Extended Access Management (XAM), SaaS governance, and machine credential management (CO014). Through inorganic acquisitions including device-trust provider Kolide in 2024, SaaS management platform Trelica in late 2024, and cloud identity governance provider Apono in 2026, the company established Unified Access to secure human users, AI agents, and non-human machine identities (CO014). Product developments include the Credential Broker launched in June 2026, which inspects AI agents and runtime workloads before granting scoped secret credentials (CO014). However, this expanded perimeter introduces severe operational exposures (CO015). Because 1Password's commercial existence relies upon absolute trust in its zero-knowledge cryptographic safeguards, any systemic cryptographic compromise or credential vault exfiltration would generate existential enterprise churn and regulatory sanctions (CO015). Integrating four international engineering teams across Toronto, Boston, London, and Tel Aviv while absorbing $250M to $300M acquisition valuations creates material execution friction, compounded by the opacity of private share classes and unverified gross margins (CO014, CO015)."
    claimRefs:
      - "CO014"
      - "CO015"
    tableRefs: []
    figureRefs:
      - "FO001"
