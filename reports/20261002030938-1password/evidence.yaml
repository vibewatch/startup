evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP/IFRS income statements, gross margins, operating expenses, cash burn, and balance sheet runway
      figures.
    whyItMatters: >-
      As a privately held Canadian corporation, 1Password does not file public quarterly reports; profitability
      assertions and ARR metrics cannot be reconciled against independent auditor opinions.
    diligencePath: >-
      Review audited private financial statements, quality of earnings reports, or confidential information memorandum
      (CIM) disclosures during late-stage equity diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: cap-table
    missingEvidence: >-
      Exact founder equity percentages, option pool dilution, and precise liquidation preference seniority waterfall
      across Series A, B, and C preferred shares.
    whyItMatters: >-
      Secondary sales and venture rounds diluted original founder stakes, but exact economic split and liquidation
      preferences remain undisclosed to outside observers.
    diligencePath: >-
      Request the complete corporate capitalization table and certificate of incorporation during formal investment
      legal diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin percentage, net revenue retention (NRR) rate, customer acquisition cost (CAC), and segment
      contribution margin breakdown.
    whyItMatters: >-
      Without segmented financial disclosures, the true economic defensibility of the $400M ARR base and profitability
      profile cannot be independently verified.
    diligencePath: >-
      Request audited GAAP financial statements, cohort retention tables, and revenue breakdowns during confidential
      diligence review.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited gross retention, net dollar retention, and win/loss displacement metrics between 1Password and Bitwarden
      enterprise accounts.
    whyItMatters: >-
      Without audited retention rates, it is impossible to quantify how much competitive churn 1Password experiences due
      to its 33% business tier price premium.
    diligencePath: Request confidential SaaS cohort retention tables and CRM opportunity win/loss analysis during diligence.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited income statements, GAAP revenue breakdowns, gross margins, and net cash flow from operations for FY2023
      through FY2025.
    whyItMatters: >-
      Underwriting revenue growth and unit economics without audited income statements forces reliance on unconfirmed
      management claims.
    diligencePath: Request audited financial statements and quarterly board reporting packs under non-disclosure agreement.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: retention-and-unit-economics
    missingEvidence: >-
      Net revenue retention (NRR), gross retention, customer acquisition cost (CAC) payback periods, and cohort
      expansion tables.
    whyItMatters: >-
      Without retention cohorts, it is impossible to verify whether revenue expansion is driven by new logo acquisition
      or expansion within existing seats.
    diligencePath: Obtain SaaS metric cohort data and revenue waterfall analysis from management during formal due diligence.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Audited NRR, GRR definition and period, logo churn, renewal length, expansion revenue, and cohort retention
      curves.
    whyItMatters: >-
      A single undated secondary retention threshold cannot establish recurring-revenue durability or product-led
      expansion.
    diligencePath: >-
      Request monthly customer-level billings and seat activity by cohort, reconcile them to audited revenue, and
      recompute GRR and NRR.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Independent, named production references with contract scope, deployment dates, active seats, baseline metrics,
      and measured outcomes.
    whyItMatters: Company and partner name lists do not prove production breadth, realized value, or renewal durability.
    diligencePath: >-
      Conduct reference calls selected from billing records rather than marketing lists and reconcile testimony to
      product telemetry.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer revenue concentration, vertical and geography mix, channel-sourced bookings, and product attach
      rates.
    whyItMatters: >-
      Concentration and attach data determine whether the broad logo count translates into diversified, expandable
      recurring revenue.
    diligencePath: >-
      Obtain the customer revenue ledger and bookings data by account, product, vertical, geography, and originating
      channel.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: thesis-break-monitoring
    missingEvidence: >-
      Quantitative thresholds for critical enterprise churn, client-side cryptographic library defect rates, or SaaS
      integration API breach triggers.
    whyItMatters: >-
      Defining precise kill criteria and operational thesis-break triggers requires non-public telemetry regarding
      platform SLA violations and customer security incidents.
    diligencePath: >-
      Obtain SOC 2 Type II bridge letters, customer renewal cohort analysis, and penetration test executive summaries
      under NDA.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: transaction terms
    missingEvidence: >-
      Current primary or secondary share price, fully diluted cap table, debt and cash, liquidation preferences,
      participation rights, anti-dilution terms, and option-pool dilution.
    whyItMatters: >-
      Headline valuation does not determine common-equivalent proceeds or ownership, so target returns cannot be
      calculated without the security-level economics.
    diligencePath: >-
      Obtain the current capitalization table, charter, investor-rights agreements, debt schedule, option plan, and a
      security-by-security liquidation waterfall from company counsel.
    relatedQuestionRefs:
      - QV009
  - type: private-evidence-only
    severity: material
    topic: exit readiness
    missingEvidence: >-
      Audited ARR-to-revenue reconciliation, cohort retention, margin and cash-flow bridge, governance controls,
      IPO-readiness workplan, and credible exit timing.
    whyItMatters: >-
      The evidence pool supports operating scale but not a probability-weighted exit value, hold period, or realization
      path.
    diligencePath: >-
      Review audited financials, board materials, control-readiness assessments, banker materials, and management's exit
      plan; independently reconcile ARR, revenue, margins, and cash flow.
    relatedQuestionRefs:
      - QV010
