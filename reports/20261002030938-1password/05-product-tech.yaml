callouts:
  - calloutType: "strength"
    title: "Dual-Key Cryptographic Isolation"
    body: "1Password's security model fundamentally separates authentication from decryption by combining a client master password with a locally generated 128-bit Secret Key. Because the Secret Key never leaves the user's client devices, compromise of cloud database infrastructure yields only mathematically indecipherable encrypted blobs."
    claimRefs:
      - "CE005"
  - calloutType: "risk"
    title: "Platform Surface Expansion and Integration Fragility"
    body: "Expanding beyond core password vaulting into Extended Access Management (XAM)—encompassing device health telemetry, SaaS application discovery, and automated AI credential brokering—substantially broadens 1Password's architectural attack surface and introduces operational fragility tied to third-party browser sandbox updates and multi-cloud identity APIs."
    claimRefs:
      - "CE001"
      - "CE013"
      - "CE014"
