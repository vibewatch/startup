      - number: '2.2'
        title: Market Sizing Lenses and Constrained Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              Evaluating 1Password's addressable market requires separating broad identity governance projections from
              the constrained spend pools addressable by credential vaults and extended access software. The broadest
              addressable lens spans global enterprise cybersecurity and identity security spend, projected by industry
              benchmarks to reach hundreds of billions of dollars across human and non-human identity protection. Within
              this horizon, the serviceable addressable market (SAM) focuses on enterprise password management,
              developer secret orchestration, and SaaS governance platforms, an addressable annual spend pool estimated
              in the $12B to $18B range. The immediate serviceable obtainable market (SOM) is anchored by organizations
              with distributed workforces, multi-device ecosystems, and unmanaged cloud or developer environments that
              bypass traditional corporate single sign-on. Industry adoption indicators show enterprise credential
              security accelerating, with 1Password generating over $400 million in annual recurring revenue across
              180,000 business accounts. Nevertheless, market sizing estimates remain subject to significant variance
              due to pricing compression in mid-market segments, vendor consolidation by platform incumbents, and the
              unverified conversion rate of consumer users into enterprise license contracts.
            claimRefs:
              - CM004
              - CM006
