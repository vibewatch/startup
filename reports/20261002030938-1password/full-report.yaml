      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Moat from a 14-Year Self-Funded Bootstrap
            body: >-
              1Password's 14-year period of un-diluted profitable bootstrapping provided the company with an unusually
              durable governance foundation. Entering institutional fundraising at $50M+ ARR enabled the founders to
              maintain significant equity control, high gross retention (>90%), and positive cash generation while
              scaling into enterprise markets without structural recapitalization pressure.
            calloutType: insight
            claimRefs:
              - CO004
              - CO005
              - CO011
          - type: callout
            title: Single-Point-of-Failure Asymmetry in Zero-Knowledge Vaults
            body: >-
              The core commercial proposition of 1Password rests on absolute cryptographic integrity. Unlike
              conventional SaaS platforms where minor infrastructure outages cause temporary inconvenience, any
              undetected vulnerability, master vault breach, or compromised zero-knowledge implementation would cause
              catastrophic enterprise churn and irreversible reputational destruction.
            calloutType: risk
            claimRefs:
              - CO013
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The addressable enterprise security and identity market for 1Password centers on credential security,
              privileged secret orchestration, and extended access management (XAM). Historically operating as a
              consumer and small-team vault, 1Password has repositioned its commercial focus toward enterprise IT,
              security operations, and developer tooling. Within core corporate spend, included categories encompass
              enterprise password management (EPM), developer secret storage and orchestration, machine-to-machine
              credential brokering, device health attestation at sign-in, and SaaS discovery to mitigate unmanaged
              application sprawl. Excluded categories comprise core identity provider (IdP) directories such as Okta
              Workforce Identity Cloud and Microsoft Entra ID, single sign-on federation engines, and full-stack cloud
              infrastructure security posture management (CSPM). The expansion into SaaS Manager introduces visibility
              into unmanaged shadow applications, while the recent addition of AI Spend and Consumption Management
              addresses consumption-based token budgeting across foundation model providers. However, corporate spend
              for these capabilities remains split between security budgets, software asset management lines, and
              engineering operations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
