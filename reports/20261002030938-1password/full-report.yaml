      - number: '1.3'
        title: Strategic Platform Pivot and Adverse Vulnerability Surfaces
        blocks:
          - type: paragraph
            body: >-
              1Password has strategically shifted from consumer vault software into enterprise Extended Access
              Management (XAM), SaaS governance, and machine credential management (CO014). Through inorganic
              acquisitions including device-trust provider Kolide in 2024, SaaS management platform Trelica in late
              2024, and cloud identity governance provider Apono in 2026, the company established Unified Access to
              secure human users, AI agents, and non-human machine identities (CO014). Product developments include the
              Credential Broker launched in June 2026, which inspects AI agents and runtime workloads before granting
              scoped secret credentials (CO014). However, this expanded perimeter introduces severe operational
              exposures (CO015). Because 1Password's commercial existence relies upon absolute trust in its
              zero-knowledge cryptographic safeguards, any systemic cryptographic compromise or credential vault
              exfiltration would generate existential enterprise churn and regulatory sanctions (CO015). Integrating
              four international engineering teams across Toronto, Boston, London, and Tel Aviv while absorbing $250M to
              $300M acquisition valuations creates material execution friction, compounded by the opacity of private
              share classes and unverified gross margins (CO014, CO015).
            claimRefs:
              - CO014
              - CO015
