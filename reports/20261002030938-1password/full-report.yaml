              - CV011
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >
              Independent reports agree that the 2022 Series C raised $620 million at a $6.8 billion valuation, and
              multiple databases place cumulative primary funding near $920 million. CNBC reported that the Series C
              investors received about 9% of the company, but that single disclosure does not reveal the liquidation
              waterfall, participating rights, anti-dilution protection, debt, cash, or ownership available in a new
              transaction. Sacra further reports a $100 million founder and employee secondary in October 2025,
              including a $75 million purchase by Halo Fund; it does not provide a secondary share price or an updated
              company valuation.


              A mechanical comparison of the stale $6.8 billion mark with Sacra's estimated $400 million October 2025
              ARR produces a 17.0x valuation-to-estimated-ARR proxy. That is not a current transaction multiple and
              cannot be treated as an enterprise-value/revenue multiple. Multiples.vc lists public-company LTM
              EV/revenue references of 8.5x for Qualys and 4.9x for CommVault, plus a 32.0x private valuation/revenue
              reference for Island, but differences in business mix, growth, profitability, ARR versus revenue, and
              capital structure prevent direct pricing. Entry discipline should therefore require a current term sheet
              and denominator-consistent financial package rather than extrapolating from those reference points.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >
              The bull case requires independent confirmation that estimated ARR has continued to compound, gross
              retention remains above 90%, free cash flow is sustainably positive after acquisitions, and Unified Access
              converts product breadth into durable enterprise expansion. Under that evidence set, a valuation above the
              2022 mark could be considered, but the assigned evidence does not support a precise ceiling. The base case
              treats $6.8 billion as a stale reference rather than fair value: stronger scale is offset by missing
              audited margins, net retention, secondary pricing, and preference data.


              The bear case is a reset below the 2022 mark if reported ARR cannot be reconciled to audited revenue,
              retention weakens, free-cash-flow claims exclude material costs, or bundled and passwordless alternatives
              compress growth and pricing power. No scenario supports a probability-weighted return because the entry
              security, ownership percentage, dilution path, and exit proceeds waterfall are unknown. The valuation
              range is therefore deliberately relational—below, around, or above the last disclosed mark—until diligence
              supplies comparable denominators and transaction terms.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis breaks
        blocks:
          - type: paragraph
            body: >
              The October 2025 secondary indicates some private-liquidity capacity, while a large business-customer
              base, an estimated $400 million ARR run-rate, and a 1,400-plus workforce are consistent with late-stage
              operating scale. They do not establish IPO readiness. The assigned evidence contains no filed prospectus,
              audited public-company controls assessment, disclosed board-governance package, or current primary
              financing terms. Absence from this limited pool is not proof that those materials do not exist; it is a
              specific diligence gap.


              Before investment, obtain audited ARR-to-revenue reconciliation, gross and net retention by cohort, gross
              margin and free-cash-flow bridge, acquisition integration costs, cash and debt, the fully diluted cap
              table, every preference and participation right, and the 2025 secondary price. Thesis-break triggers are a
              material ARR restatement, gross retention falling below the reported 90%-plus level, sustained negative
              free cash flow after normalization, failure to convert broader access products into enterprise expansion,
              or a new round whose preferences make common-equivalent returns unattractive. Without those answers,
              neither a target hold period nor a credible exit return can be stated.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Research more rather than underwriting the 2022 headline valuation. A current security price, audited
              revenue and ARR bridge, and full preference waterfall are prerequisites to a target-return decision.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
          - type: callout
            title: Do not mix ARR and revenue multiples
            body: >-
              Sacra's $400 million figure is estimated ARR, while Multiples.vc's public-company references are LTM
              EV/revenue. The 17.0x cross-period proxy is diagnostic only and is not a directly comparable valuation
              multiple.
            calloutType: risk
            claimRefs:
              - CV004
              - CV014
              - CV015
