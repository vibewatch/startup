      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Purchasing authority for 1Password spans distinct enterprise personas with diverging evaluation criteria,
              procurement triggers, and budget owners. In mid-market and enterprise environments, the primary buyer is
              the Chief Information Security Officer (CISO) or Director of Information Security, who allocates budget
              under identity and endpoint protection lines to enforce credential hygiene, satisfy compliance
              requirements (such as SOC 2 and ISO 27001), and qualify for commercial cyber insurance policies. In
              technology and engineering-led organizations, VP of Engineering or DevSecOps leaders procure developer
              seats to eliminate hardcoded API keys and synchronize secrets across AWS and local developer environments.
              With the launch of 1Password SaaS Manager and AI Spend Management, Chief Information Officers and IT
              directors collaborate directly with Chief Financial Officers to track software license sprawl and monitor
              volatile consumption costs generated by autonomous AI agents and developer tools like Cursor, Claude, and
              OpenAI. Procurement pathways typically initiate via bottom-up developer or team-tier adoption before
              expanding into enterprise-wide master services agreements with custom discounting and directory
              federation.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
              - CM012
              - CM013
