  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Scaled recurring-revenue platform
        - Sacra estimates $400 million of October 2025 ARR and gross retention above 90%.
        - An audited ARR reconciliation and cohort retention below the reported level would weaken the thesis.
      - - Thesis
        - Enterprise breadth and customer reach
        - >-
          Official materials span human, AI-agent, machine, app, device, and access controls; the company claims more
          than 200,000 businesses.
        - Low attach or expansion rates for products beyond password management would weaken the platform case.
      - - Thesis
        - Potentially self-funding growth
        - Sacra reports positive free cash flow.
        - A normalized cash-flow bridge showing sustained burn would remove this support.
      - - Anti-thesis
        - Price discovery is stale
        - The last disclosed priced round was $6.8 billion in 2022; the 2025 secondary lacks a disclosed price.
        - A current arm's-length financing or secondary mark with full terms would improve price discovery.
      - - Anti-thesis
        - Competitive compression
        - Sacra identifies browser-bundled password managers and passwordless authentication as risks.
        - Documented enterprise expansion and pricing durability against those alternatives would reduce this concern.
    notes: >-
      Company-issued scale and platform claims are identified as such; Sacra's newer financial metrics are estimates
      rather than audited disclosures.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
      - CV016
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Operating assumptions
      - Valuation range
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - >-
          ARR growth persists, gross retention stays above 90%, free cash flow remains positive, and broader access
          products drive enterprise expansion.
        - Above $6.8B may be supportable, but no precise upper bound is evidenced.
        - Audited growth and retention plus a clean current term sheet.
        - Upside requires denominator-consistent metrics and transaction terms, not only company scale claims.
      - - Base
        - >-
          Scale improves, but audited margins, net retention, preference terms, and the secondary price remain
          unavailable.
        - Around the stale $6.8B mark is a reference, not a supported fair-value range.
        - Current primary pricing near the old mark with verified $400M-class ARR and durable cash generation.
        - Hold the recommendation at research-more until the missing package is delivered.
      - - Bear
        - >-
          Reported ARR or cash generation fails verification, competition compresses growth, or senior terms absorb
          common-equivalent value.
        - Below $6.8B; magnitude cannot be responsibly quantified from public evidence.
        - Revenue denominator reconciles below ARR expectations or retention falls below the reported 90%-plus level.
        - A restatement, renewed burn, or punitive preference stack breaks the thesis.
    notes: >-
      Ranges are deliberately relational to the 2022 post-money valuation because Sacra reports ARR while the comparable
      references use revenue or EV/revenue; these denominators are not interchangeable.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV012
