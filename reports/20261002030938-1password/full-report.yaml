              - CR007
              - CR013
              - CR015
              - CR016
      - number: '7.3'
        title: Partner Dependencies, Third-Party Supply Chain, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              As 1Password broadens its portfolio into Unified Access Management and machine identity governance,
              third-party integration surface areas multiply. The June 2026 supply chain incident at competitor
              LastPass—where compromised OAuth tokens from third-party vendor Klue allowed unauthorized extraction of
              Salesforce CRM data without breaching vault infrastructure [CR013]—demonstrates that enterprise SaaS
              integrations carry structural contagion risk. 1Password increasingly interfaces with enterprise CRM, cloud
              infrastructure, and AI agent workloads, amplifying the risk of third-party token exposure [CR014].
              Concurrently, commercial pricing adjustments have widened price disparity against low-cost competitors:
              1Password Business lists at $8.99 per user per month following a March 2026 pricing update, compared to
              LastPass Business at $7.00 and RoboForm Business at $3.33 per user per month [CR015]. Financially,
              1Password has surpassed $400M in annual recurring revenue while serving over 180,000 to 200,000 businesses
              [CR016], but pricing pressure from lower-cost alternatives and the burden of securing unmanaged AI SaaS
              integrations represent ongoing operational headwinds.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Supply Chain Contagion via Third-Party Integrations
            body: >-
              The 2026 Klue OAuth incident demonstrated that non-vault enterprise SaaS systems (CRMs, analytics,
              customer support) present attractive vectors for credential theft. While 1Password's master vaults remain
              zero-knowledge, customer support and commercial pipeline metadata hosted in third-party environments
              remain vulnerable to supply-chain compromise.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Secret Key Cryptographic Asymmetry
            body: >-
              1Password's Secret Key architecture provides substantial defense-in-depth against offline brute-force
              attacks on leaked ciphertext. By requiring 128 bits of client-side entropy in addition to user master
              passwords, 1Password largely neutralizes the cloud backup breach vector that severely impaired competitor
              LastPass.
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and investment case
        blocks:
          - type: paragraph
            body: >
              The recommendation is research-more, with medium confidence and a medium-high underwriting risk. The
              constructive case is that 1Password has grown into an enterprise access platform rather than remaining
              only a consumer password vault: its current site presents controls for people, AI agents, machines,
              applications, and devices, while Sacra estimates $400 million of ARR in October 2025, gross retention
              above 90%, and positive free cash flow. The company also claims more than 200,000 business customers and
              1,400-plus employees, which supports organizational scale but is not independent verification of revenue
              quality.


              The anti-thesis is price and evidence quality. The most recent disclosed priced round is still the 2022
              Series C at $6.8 billion, and the public sources disagree on whether the relevant 2022 revenue denominator
              was $150 million or $200 million. Sacra also identifies browser-bundled password managers and passwordless
              authentication as competitive risks. A positive company-quality assessment therefore does not justify an
              unconditional investment call: entry price, current audited ARR, retention cohort detail, margin quality,
              cap-table seniority, and liquidation preferences must be obtained before a target return can be
              underwritten.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
