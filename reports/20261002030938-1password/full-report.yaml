chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Heritage, and Governance Evolution
        blocks:
          - type: paragraph
            body: >-
              1Password is the commercial brand operated by AgileBits Inc., a privately held technology company
              incorporated in Canada and headquartered at 4711 Yonge Street in Toronto, Ontario (CO001). The company was
              founded in 2005 by Dave Teare, Roustem Karimov, Sara Teare, and Natalia Karimova, who initially conceived
              the Mac utility '1Passwd' launched in May 2006 (CO002, CO003). Unlike conventional venture-backed software
              startups that absorb institutional dilution in early rounds, AgileBits bootstrapped operations with
              organic customer revenue and sustained profitability for 14 consecutive years until November 2019 (CO004,
              CO005). This extended period of self-funded ownership preserved high founder equity ownership and
              institutional independence before external capital was accepted (CO004). Material governance evolution
              occurred as long-standing chief executive officer Jeff Shiner transitioned to executive chair of the board
              of directors in July 2025, passing operational leadership to chief executive officer David Faugno, who
              joined initially as co-CEO in November 2024 to steer corporate scaling and public-market readiness (CO006,
              CO007). Institutional board seats are held by lead investors Arun Mathew of Accel and Will Griffith of
              ICONIQ Growth alongside the founding group (CO008).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
