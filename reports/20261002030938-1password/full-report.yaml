      - number: '6.2'
        title: Customer proof is visible but uneven
        blocks:
          - type: paragraph
            body: >-
              The strongest named outcome in the assigned evidence is a testimonial on 1Password's own homepage from Red
              Bull Racing and Technology's Head of Software Engineering for Aerodynamics, who credits the product with
              adding discipline and clarity to access management. The company and Drata also name customers including
              Canva and Salesforce, but those pages do not disclose contract scope, deployment status, measured
              outcomes, or renewal history for those brands. Drata describes a concrete joint workflow in which Device
              Trust feeds device posture into continuous-compliance evidence collection. A separate analyst report says
              two unnamed enterprise customers value the mature vault, device posture, policy granularity, and
              self-remediation. This is useful qualitative validation, but anonymity and partner or company control
              prevent it from serving as independently auditable production proof.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
      - number: '6.3'
        title: Durability and expansion motion
        blocks:
          - type: paragraph
            body: >-
              Public retention evidence is thin. The independent analyst report states gross retention above 90%, but
              the fetched text supplies neither a measurement period nor a cohort definition, and no public source in
              the assigned pool provides net revenue retention, logo churn, renewal length, or expansion revenue.
              Company-issued job postings nevertheless show an explicit commercial operating model: a senior customer
              success manager is expected to own value realization, revenue retention, renewals, and expansion, while
              another posting identifies an enterprise customer-success director role. The partner program separately
              rewards early deal registration and net-new acquisition while encouraging recurring services revenue.
              These sources demonstrate organizational intent and process, not realized retention economics. They also
              show multiple expansion surfaces across Enterprise Password Manager, Device Trust, and SaaS Manager
              without disclosing attach rates.
            claimRefs:
              - CU006
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Friction, concentration, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is concentrated in one independent analyst report, which says customers still
              perceive Vault and Extended Access Management as parallel products, identifies SCIM Bridge as operational
              friction, and reports softer support responsiveness after acquisitions. Those observations temper the
              land-and-expand thesis because additional modules can increase operating burden even when the core vault
              is trusted. Public sources do not disclose top-customer concentration, vertical revenue mix,
              partner-sourced bookings, deployment breadth within named accounts, or whether the larger published
              customer threshold reflects paid and active accounts. The central underwriting task is therefore not to
              prove that customers exist, but to reconcile billing records, product telemetry, renewal cohorts, and
              reference calls so reported reach can be translated into durable revenue quality.
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public reach is not retention evidence
            body: >-
              The move from a February 2026 claim of more than 180,000 businesses to a live-page claim of more than
              200,000 suggests a higher reported threshold, but neither source defines active, paid, or production
              accounts. The change should not be converted into a customer growth rate without consistent measurement
              dates and definitions.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: Validate cohort economics before underwriting expansion
            body: >-
              Request customer-level billings, product attach, renewal, churn, and seat-activity data by cohort, then
              reconcile the records to named references and partner-sourced bookings. Public hiring and partner
              materials establish a commercial motion but cannot establish realized net retention or concentration.
            calloutType: recommendation
            claimRefs:
              - CU006
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              1Password's expansion into enterprise deployments across heavily regulated sectors—specifically financial
              services, healthcare, and critical infrastructure—elevates regulatory and compliance exposure beyond
              standard consumer data privacy norms [CR002]. In the financial services sector, enterprise clients are
              subject to rigorous frameworks including SOC 2 Type II, GLBA, and PCI DSS [CR003]. The company maintains
              SOC 2 Type II attestation available via its Trust Center [CR001], but its business customers operate in an
              environment where regulators and clients impose enterprise-level oversight while encountering widespread
              credential hygiene vulnerabilities; survey findings indicate that two-thirds of employees admit to poor
              password practices such as credential reuse across work accounts [CR002]. A 2026 industry survey showed
              that 25% of small business owners incurred compliance-related fines or citations ranging between $2,000
              and $10,000 for control failures [CR004]. While competitor LastPass absorbed a £1.2 million UK Information
              Commissioner's Office (ICO) fine in December 2025 alongside $27.5 million in North American class action
              settlements tied to historic breach compromises [CR005], 1Password has recorded zero major regulatory
              sanctions or vault compromise penalties through 2026 [CR006]. Nevertheless, expanding governance into
              unmanaged SaaS applications outside single sign-on (SSO) introduces compliance tracking burdens that could
              expose customers—and upstream vendors—to audit scrutiny if access controls fail.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
      - number: '7.2'
        title: Operational, Infrastructure, and Security Architecture Risks
        blocks:
          - type: paragraph
            body: >-
              Operational security integrity is the existential foundation of 1Password's business model. The company's
              architectural differentiator is its two-tier key derivation model combining PBKDF2-HMAC-SHA256 with a
              client-held 128-bit Secret Key, ensuring that even a full compromise of server-side ciphertext does not
              yield decryptable vault data without the client's local Secret Key [CR007]. Peer password management
              infrastructure experienced persistent operational threats throughout 2025 and 2026, including a malicious
              npm package masquerading as the Bitwarden CLI that lingered on public package registries for 90 minutes in
              April 2026 [CR008], and external credential-stuffing campaigns against Dashlane in May 2026 that resulted
              in unauthorized encrypted vault downloads for fewer than 20 individual accounts [CR009]. In both
              incidents, underlying client-side encryption prevented plaintext extraction [CR010]. For 1Password,
              managing a remote-first global workforce exceeding 1,400 employees distributed across 5 countries
              introduces human error and insider threat vectors [CR011]. With internal surveys highlighting that over a
              third of enterprise employees have retained access to former employer accounts post-departure [CR012],
              1Password's internal identity and deprovisioning lifecycle must maintain immaculate execution to prevent
              credential leakage into corporate systems.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
