      - number: '4.3'
        title: Capital Adequacy, Historical Traction, and Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              1Password's financing trajectory combines extended self-funded bootstrapping with late-stage mega-rounds
              totaling $920M in primary equity capital. The company closed a $200M Series A in late 2019, followed by a
              $100M Series B in July 2021 at a $2.0B valuation, and a $620M Series C in January 2022 at a $6.8B
              post-money valuation led by ICONIQ Growth, Accel, Tiger Global, and Lightspeed Venture Partners. While
              private trackers and secondary market platforms note that 1Password has discussed IPO readiness, no
              confidential S-1 registration or public filing has occurred. Furthermore, the $6.8B valuation established
              in early 2022 represented a steep 45.3x multiple on its recorded $150M revenue base, creating material
              exposure to valuation compression if enterprise growth moderates or software multiples de-rate. From an
              underwriting perspective, the financial verdict requires a research-more stance until audited income
              statements, gross margins, net revenue retention (NRR), and liquidation preferences are disclosed under
              formal diligence review.
            claimRefs:
