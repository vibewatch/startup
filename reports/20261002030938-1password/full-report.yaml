              - CE003
              - CE005
              - CE009
              - CE010
              - CE012
      - number: '5.2'
        title: Cryptographic Architecture, Systems Engineering, and Developer Tooling
        blocks:
          - type: paragraph
            body: >-
              The foundation of 1Password's trust model is its zero-knowledge cryptographic architecture, which combines
              a user's master password with a locally generated 128-bit Secret Key to encrypt data before it leaves the
              client device [CE005, CE009]. Encryption and decryption keys are derived entirely client-side using robust
              key-derivation functions, ensuring that encrypted vault payloads synchronized through 1Password servers
              remain mathematically unreadable to company operators, infrastructure providers, or unauthorized third
              parties [CE005, CE007]. This dual-key design prevents server-side credential compromise from translating
              into usable customer secrets even in the event of an infrastructure breach [CE005].


              Underlying the multi-platform client applications is a shared, high-performance systems engineering core
              built primarily in Rust and Go, paired with modern TypeScript and React user interfaces [CE006, CE007,
              CE008]. Adopting Rust for client engines across Linux, macOS, and Windows enabled memory safety, extensive
              cross-platform crate reuse, and compilation to WebAssembly (WASM), while the server-side infrastructure
              utilizes Go for high-throughput Secure Remote Password (SRP) authentication and API coordination [CE007,
              CE008]. Internal software delivery integrates OpenAI Codex across the engineering lifecycle, yielding a
              measured 20.9% gain in engineering productivity and reducing pull request cycle times by nearly 11% while
              maintaining zero-knowledge guarantees via AppSec guardrails and runtime secret references [CE009, CE010].
              Supporting developer workflows, 1Password provides dedicated technical documentation and developer portal
              SDKs for cross-domain identity management and automated secret injection [CE011, CE012].
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
