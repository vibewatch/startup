              - CO008
      - number: '1.2'
        title: Capitalization Structure, Secondary Liquidity, and Scale
        blocks:
          - type: paragraph
            body: >-
              Between 2019 and 2022, 1Password completed three institutional funding rounds totaling $920 million: a
              $200 million Series A in November 2019 led by Accel, a $100 million Series B in July 2021 at a $2.0
              billion post-money valuation, and a $620 million Series C in January 2022 led by ICONIQ Growth
              establishing its peak valuation of $6.8 billion (CO005, CO009). In October 2025, early founders and
              tenured employees executed a $100 million secondary share sale involving the Halo Fund and Flume Ventures,
              allowing early equity holders to monetize personal holdings while retaining substantial equity ownership
              without primary corporate dilution (CO010). Operating scale has expanded rapidly, with independent
              trackers reporting that annual recurring revenue surpassed $400 million in late 2025 following $331
              million in 2024 and $250 million in 2023, though audited statutory financials remain closely held (CO011).
              Corporate enterprise adoption now encompasses over 200,000 commercial customers, including over 30% of the
              Fortune 100 and more than two-thirds of the Forbes AI 50 (CO012). The operational headcount exceeds 1,400
              distributed personnel across five countries, maintaining zero-knowledge encryption architecture and
              enterprise compliance controls across macOS, Windows, Linux, iOS, Android, and web interfaces (CO013).
            claimRefs:
