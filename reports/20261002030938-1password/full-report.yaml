      - number: '2.4'
        title: Adoption Drivers, Structural Headwinds, and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Market adoption of extended access management is propelled by several macro tailwinds: the proliferation
              of non-federated SaaS applications operating outside corporate SSO, the explosion of non-human machine
              identities and API credentials, and the rapid enterprise integration of AI agents consuming tokens at
              unbudgeted rates. According to third-party contract data from Vendr, 1Password commands strong pricing
              power in small teams ($15–$25 per user annually) while enterprise volume discounting compresses per-seat
              realizations down to $10–$18 annually for large deployments. Counterbalancing these catalysts are
              structural constraints. Primary identity providers like Microsoft Entra ID and Okta continue embedding
              native authenticator and credential storage capabilities directly into standard enterprise suites,
              exerting downward pricing pressure. Additionally, enterprise buyers face procurement fatigue from
              overlapping security agents, high friction in migrating legacy shared vaults, and a lack of public
              unit-economics or gross-margin visibility from 1Password following its $6.8B Series C valuation in 2022.
              Because consumption-based AI spend tools currently provide alerting rather than automated budget cutoff
              enforcement, enterprise adoption in financial governance workflows remains exploratory.
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Identity Perimeter Expansion from SSO to Unmanaged Workflows
            body: >-
              1Password's market expansion hinges on the premise that traditional Single Sign-On (SSO) leaves
              substantial gaps in modern enterprise architectures. While enterprise IdPs secure major sanctioned
              applications, employees and developer teams regularly access thousands of shadow SaaS tools, API
              endpoints, and AI assistants using non-federated credentials. By establishing an Extended Access
              Management layer that verifies device health and governs credentials outside corporate SSO, 1Password
              captures identity security spend that does not compete directly with core identity provider
              infrastructure.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: callout
            title: Pricing Compression and Identity Platform Encroachment
            body: >-
              While enterprise credential management addresses a clear security vulnerability, pricing power is
              constrained as enterprise buyers consolidate vendors. Platform giants like Microsoft and Okta continuously
              introduce native authenticators and privileged access features within broader licensing packages.
              Commercial data from Vendr confirms that enterprise seat pricing for 1Password compresses from over $95
              list to between $10 and $18 annually for large commitments, highlighting the necessity of upselling
              high-margin modules like SaaS Manager and AI token governance to sustain expansion economics.
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Taxonomy and Alternative Models
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding 1Password spans commercial zero-knowledge password vaults,
              open-source and self-hosted platforms, legacy breached incumbents, emerging passwordless hardware
              architectures, and native operating-system or browser credential keepers. Direct commercial rivals such as
              Bitwarden, Dashlane, Keeper, and NordPass compete directly for individual, family, and business seats,
              offering zero-knowledge encrypted vaults, passkey synchronization, and cross-platform extensions.
              Open-source alternatives like Bitwarden, Vaultwarden, and Passbolt attract technically sophisticated users
              and privacy-focused teams seeking code transparency, local self-hosting, and elimination of annual SaaS
              seat licensing costs. Meanwhile, native status-quo substitutes—such as Apple Passwords integrated into iOS
              and macOS, alongside built-in managers in Google Chrome, Microsoft Edge, and Safari—provide free baseline
              credential autofill that satisfies casual users who resist standalone utility fees. Emerging
              hardware-tethered alternatives, including proximity-based authenticators like EveryKey, attempt to bypass
              typed master passwords altogether, though they remain niche compared to software vaults.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP008
      - number: '3.2'
        title: Competitor Profiles, Technical Architecture, and Capability Matrix
        blocks:
          - type: paragraph
            body: >-
              Architectural divergence defines differentiation between 1Password and its peers. 1Password implements a
              proprietary dual-key derivation design combining PBKDF2 with an unshared 128-bit client-side Secret Key
              (2SKD) alongside AES-256-GCM encryption, ensuring vault ciphertext stored on server infrastructure cannot
              be decrypted even if master passwords leak. Conversely, Bitwarden employs AES-256-CBC with Argon2id or
              PBKDF2-SHA256, providing verifiable open-source codebases (GPLv3/AGPLv3) and self-hosting options.
              LastPass historically relied on PBKDF2-SHA256 without a secondary client key; its catastrophic 2022 breach
              resulted in copied customer vault backups and severe reputational damage that triggered substantial
              customer migrations to 1Password. Specialized competitors like Keeper emphasize granular administrative
              controls and large encrypted file storage up to 100GB, while Dashlane bundles virtual private networks and
              dark web monitoring into premium tiers. However, 1Password is expanding its perimeter beyond credential
              vaults into Unified Access Management, integrating SaaS app discovery and AI agent credential brokering.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
