callouts:
  - calloutType: risk
    title: Widening Price Premium Against Capable Open-Source Disruption
    body: Bitwarden’s permanent free tier and $10/year Premium subscription undercut 1Password’s $35.88-$47.88/year individual pricing by up to 4x, while saving mid-market organizations up to $4,800 annually per 200 business seats. For budget-constrained IT buyers, Bitwarden’s open-source AGPLv3 transparency and comparable SOC 2 compliance make 1Password’s 33% business premium increasingly difficult to justify on core password vaulting alone.
    claimRefs:
      - CP011
      - CP012
      - CP013
      - CP014
  - calloutType: strength
    title: Architectural Moat and Post-Breach Flight to Trust
    body: 1Password’s 128-bit client Secret Key dual-derivation model (2SKD) and unblemished zero-breach track record serve as a primary competitive defense. Following LastPass’s 2022 vault backup exfiltration, enterprise buyers prioritized provable zero-knowledge architectures, enabling 1Password to capture displaced enterprise accounts despite charging premium per-seat rates.
    claimRefs:
      - CP006
      - CP007
      - CP015
