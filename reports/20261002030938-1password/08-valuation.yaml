company:
  name: "1Password"
chapter:
  number: 8
  title: "Valuation"
  summary: "1Password shows meaningful scale, with Sacra estimating $400 million of October 2025 ARR and the company now claiming more than 200,000 business customers, but the last disclosed priced round remains the $6.8 billion Series C from 2022. The appropriate stance is research-more: the public record does not disclose current primary pricing, audited operating metrics, preference terms, or a denominator-consistent comparable set sufficient for a defensible entry valuation."
sections:
  - id: "recommendation-and-investment-case"
    title: "Recommendation and investment case"
    body: |
      The recommendation is research-more, with medium confidence and a medium-high underwriting risk. The constructive case is that 1Password has grown into an enterprise access platform rather than remaining only a consumer password vault: its current site presents controls for people, AI agents, machines, applications, and devices, while Sacra estimates $400 million of ARR in October 2025, gross retention above 90%, and positive free cash flow. The company also claims more than 200,000 business customers and 1,400-plus employees, which supports organizational scale but is not independent verification of revenue quality.

      The anti-thesis is price and evidence quality. The most recent disclosed priced round is still the 2022 Series C at $6.8 billion, and the public sources disagree on whether the relevant 2022 revenue denominator was $150 million or $200 million. Sacra also identifies browser-bundled password managers and passwordless authentication as competitive risks. A positive company-quality assessment therefore does not justify an unconditional investment call: entry price, current audited ARR, retention cohort detail, margin quality, cap-table seniority, and liquidation preferences must be obtained before a target return can be underwritten.
    claimRefs: [CV001, CV005, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV016]
    tableRefs: [TV001, TV002]
  - id: "financing-and-entry-discipline"
    title: "Financing context and entry discipline"
    body: |
      Independent reports agree that the 2022 Series C raised $620 million at a $6.8 billion valuation, and multiple databases place cumulative primary funding near $920 million. CNBC reported that the Series C investors received about 9% of the company, but that single disclosure does not reveal the liquidation waterfall, participating rights, anti-dilution protection, debt, cash, or ownership available in a new transaction. Sacra further reports a $100 million founder and employee secondary in October 2025, including a $75 million purchase by Halo Fund; it does not provide a secondary share price or an updated company valuation.

      A mechanical comparison of the stale $6.8 billion mark with Sacra's estimated $400 million October 2025 ARR produces a 17.0x valuation-to-estimated-ARR proxy. That is not a current transaction multiple and cannot be treated as an enterprise-value/revenue multiple. Multiples.vc lists public-company LTM EV/revenue references of 8.5x for Qualys and 4.9x for CommVault, plus a 32.0x private valuation/revenue reference for Island, but differences in business mix, growth, profitability, ARR versus revenue, and capital structure prevent direct pricing. Entry discipline should therefore require a current term sheet and denominator-consistent financial package rather than extrapolating from those reference points.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: "scenarios-and-price-sensitivity"
    title: "Bull, base, and bear framing"
    body: |
      The bull case requires independent confirmation that estimated ARR has continued to compound, gross retention remains above 90%, free cash flow is sustainably positive after acquisitions, and Unified Access converts product breadth into durable enterprise expansion. Under that evidence set, a valuation above the 2022 mark could be considered, but the assigned evidence does not support a precise ceiling. The base case treats $6.8 billion as a stale reference rather than fair value: stronger scale is offset by missing audited margins, net retention, secondary pricing, and preference data.

      The bear case is a reset below the 2022 mark if reported ARR cannot be reconciled to audited revenue, retention weakens, free-cash-flow claims exclude material costs, or bundled and passwordless alternatives compress growth and pricing power. No scenario supports a probability-weighted return because the entry security, ownership percentage, dilution path, and exit proceeds waterfall are unknown. The valuation range is therefore deliberately relational—below, around, or above the last disclosed mark—until diligence supplies comparable denominators and transaction terms.
    claimRefs: [CV004, CV005, CV007, CV008, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, diligence asks, and thesis breaks"
    body: |
      The October 2025 secondary indicates some private-liquidity capacity, while a large business-customer base, an estimated $400 million ARR run-rate, and a 1,400-plus workforce are consistent with late-stage operating scale. They do not establish IPO readiness. The assigned evidence contains no filed prospectus, audited public-company controls assessment, disclosed board-governance package, or current primary financing terms. Absence from this limited pool is not proof that those materials do not exist; it is a specific diligence gap.

      Before investment, obtain audited ARR-to-revenue reconciliation, gross and net retention by cohort, gross margin and free-cash-flow bridge, acquisition integration costs, cash and debt, the fully diluted cap table, every preference and participation right, and the 2025 secondary price. Thesis-break triggers are a material ARR restatement, gross retention falling below the reported 90%-plus level, sustained negative free cash flow after normalization, failure to convert broader access products into enterprise expansion, or a new round whose preferences make common-equivalent returns unattractive. Without those answers, neither a target hold period nor a credible exit return can be stated.
    claimRefs: [CV003, CV004, CV005, CV007, CV009, CV010, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Dimension", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Operating scale is plausible, but current price and transaction terms are undisclosed.", "Do not approve an investment until financial and cap-table diligence is complete."]
      - ["Confidence", "Medium", "The 2022 round is well corroborated; newer ARR, retention, and cash-flow figures come primarily from one analyst source.", "Treat recent operating metrics as diligence hypotheses, not audited facts."]
      - ["Risk rating", "Medium-high", "Valuation opacity, denominator conflict, product competition, and private preference terms create material downside uncertainty.", "Require downside protection and a complete liquidation waterfall."]
      - ["Valuation stance", "Stretched or indeterminate at the last mark", "The $6.8 billion mark is from 2022; a 17.0x mark-to-estimated-ARR proxy is cross-period and not a current transaction multiple.", "Price against current audited metrics rather than the historical headline valuation."]
    notes: "Assessments use the 2022 financing, Sacra's estimated October 2025 ARR, and current company claims; no current primary share price or audited financial package is available."
    claimRefs: [CV001, CV004, CV005, CV007, CV012, CV013, CV015, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Scaled recurring-revenue platform", "Sacra estimates $400 million of October 2025 ARR and gross retention above 90%.", "An audited ARR reconciliation and cohort retention below the reported level would weaken the thesis."]
      - ["Thesis", "Enterprise breadth and customer reach", "Official materials span human, AI-agent, machine, app, device, and access controls; the company claims more than 200,000 businesses.", "Low attach or expansion rates for products beyond password management would weaken the platform case."]
      - ["Thesis", "Potentially self-funding growth", "Sacra reports positive free cash flow.", "A normalized cash-flow bridge showing sustained burn would remove this support."]
      - ["Anti-thesis", "Price discovery is stale", "The last disclosed priced round was $6.8 billion in 2022; the 2025 secondary lacks a disclosed price.", "A current arm's-length financing or secondary mark with full terms would improve price discovery."]
      - ["Anti-thesis", "Competitive compression", "Sacra identifies browser-bundled password managers and passwordless authentication as risks.", "Documented enterprise expansion and pricing durability against those alternatives would reduce this concern."]
    notes: "Company-issued scale and platform claims are identified as such; Sacra's newer financial metrics are estimates rather than audited disclosures."
    claimRefs: [CV003, CV004, CV005, CV007, CV008, CV011, CV016]
  - id: "TV003"
    title: "Bull, base, and bear scenarios"
    columns: ["Scenario", "Operating assumptions", "Valuation range", "Probability signal", "Downside or upside trigger"]
    rows:
      - ["Bull", "ARR growth persists, gross retention stays above 90%, free cash flow remains positive, and broader access products drive enterprise expansion.", "Above $6.8B may be supportable, but no precise upper bound is evidenced.", "Audited growth and retention plus a clean current term sheet.", "Upside requires denominator-consistent metrics and transaction terms, not only company scale claims."]
      - ["Base", "Scale improves, but audited margins, net retention, preference terms, and the secondary price remain unavailable.", "Around the stale $6.8B mark is a reference, not a supported fair-value range.", "Current primary pricing near the old mark with verified $400M-class ARR and durable cash generation.", "Hold the recommendation at research-more until the missing package is delivered."]
      - ["Bear", "Reported ARR or cash generation fails verification, competition compresses growth, or senior terms absorb common-equivalent value.", "Below $6.8B; magnitude cannot be responsibly quantified from public evidence.", "Revenue denominator reconciles below ARR expectations or retention falls below the reported 90%-plus level.", "A restatement, renewed burn, or punitive preference stack breaks the thesis."]
    notes: "Ranges are deliberately relational to the 2022 post-money valuation because Sacra reports ARR while the comparable references use revenue or EV/revenue; these denominators are not interchangeable."
    claimRefs: [CV001, CV004, CV005, CV007, CV012, CV013, CV014, CV015, CV016]
