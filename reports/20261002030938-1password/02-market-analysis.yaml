callouts:
  - calloutType: "insight"
    title: "The Identity Perimeter Expansion from SSO to Unmanaged Workflows"
    body: "1Password's market expansion hinges on the premise that traditional Single Sign-On (SSO) leaves substantial gaps in modern enterprise architectures. While enterprise IdPs secure major sanctioned applications, employees and developer teams regularly access thousands of shadow SaaS tools, API endpoints, and AI assistants using non-federated credentials. By establishing an Extended Access Management layer that verifies device health and governs credentials outside corporate SSO, 1Password captures identity security spend that does not compete directly with core identity provider infrastructure."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
  - calloutType: "risk"
    title: "Pricing Compression and Identity Platform Encroachment"
    body: "While enterprise credential management addresses a clear security vulnerability, pricing power is constrained as enterprise buyers consolidate vendors. Platform giants like Microsoft and Okta continuously introduce native authenticators and privileged access features within broader licensing packages. Commercial data from Vendr confirms that enterprise seat pricing for 1Password compresses from over $95 list to between $10 and $18 annually for large commitments, highlighting the necessity of upselling high-margin modules like SaaS Manager and AI token governance to sustain expansion economics."
    claimRefs:
      - "CM007"
      - "CM014"
      - "CM015"
