      - number: '3.4'
        title: 转换成本、护城河持久度与同质化风险
        blocks:
          - type: paragraph
            body: >-
              1Password 的转换成本主要来自组织工作流阻力与管理集成，而非技术层面的数据锁定。个人密码库数据可通过未加密 CSV、1PIF 或加密 1PUX 格式轻松导出，允许用户在数分钟内迁移至
              Bitwarden、Dashlane 或原生管理器。然而，在企业级环境中，1Password 凭借与身份提供商的深度集成建立了可观的黏性，包括跨域身份管理系统（SCIM）用户配置、跨 Okta、Microsoft
              Entra ID（Azure AD）及 Duo 的单点登录（SSO）密码库解锁，以及通过 Events API 进行的 SIEM 事件日志记录。此外，员工对 1Password
              精细自动填充引擎的熟悉度（在独立基准测试中展现出 94% 的自动填充成功率，而 Bitwarden 为 88%），减少了内部 IT
              服务台重置工单数量。尽管存在这些运营护城河，免费浏览器自动填充带来的同质化、开源软件采用以及企业预算缩紧，依然构成持续的竞争逆风。
            claimRefs:
              - CP015
              - CP016
