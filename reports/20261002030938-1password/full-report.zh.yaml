      - number: '6.2'
        title: 客户背书清晰可见但分布不均
        blocks:
          - type: paragraph
            body: >-
              在所指派证据中，最明确具名的成效是 1Password 官网主页上来自红牛车队与技术公司（Red Bull Racing and
              Technology）空气动力学软件工程负责人的评价，其肯定该产品为访问管理增添了规范性与清晰度。公司与 Drata 还列举了包括 Canva 和 Salesforce
              在内的客户，但相关页面并未披露这些品牌的合同范围、部署状态、量化成果或续约历史。Drata 描述了一个具体的联合工作流，其中 Device Trust
              将设备姿态输入持续合规证据收集系统。另一份独立分析师报告称，两家未具名企业客户看重其成熟的密码库、设备姿态、策略细粒度及自主修复能力。这些均为有价值的定性验证，但由于缺乏具名且受合作伙伴或公司口径控制，无法作为经独立审计的生产环境确证。
            claimRefs:
              - CU007
