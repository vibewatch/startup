      - number: '2.4'
        title: 采用驱动因素、结构性逆风与市场约束
        blocks:
          - type: paragraph
            body: >-
              扩展访问管理的市场普及受到若干宏观顺风的推动：企业单点登录（SSO）之外非联合 SaaS 应用的泛滥、非人类机器身份与 API 凭据的爆发式增长，以及企业快速接入消耗超预算 Token 的 AI 智能体。来自
              Vendr 的第三方合同数据显示，1Password 在小团队中拥有较强定价权（人均每年 $15–$25），而在大型部署中，企业级批量折扣将单席位实际收益压缩至人均每年
              $10–$18。抗衡这些催化因素的是结构性约束。Microsoft Entra ID 和 Okta
              等主流身份提供商不断将原生身份验证器与凭据存储功能直接内置于标准企业套件中，带来持续的定价下行压力。此外，企业买方面临重叠安全客户端带来的采购疲劳、迁移传统共享密码库的高昂阻力，以及 1Password 在
              2022 年获得 $6.8B C 轮估值后未公开单客经济学或毛利率数据。由于基于用量的 AI 支出工具目前仅提供告警而非自动预算熔断，其在财务治理工作流中的企业采用仍处于探索阶段。
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 补充图表
        blocks:
          - type: callout
            title: 身份安全边界从 SSO 延伸至非受管工作流
            body: >-
              1Password 业务扩张的前提假设在于，传统单点登录（SSO）在现代企业架构中留下了大量空白。尽管企业级 IdP 能保护经批准的主流应用，但员工与工程团队经常借助非联合凭据访问数以千计的影子 SaaS
              工具、API 接口和 AI 助手。通过建立一套验证设备健康度并管理企业 SSO 之外凭据的扩展访问管理层，1Password 捕获了不与核心身份提供商基础设施发生正面冲突的身份安全支出。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: callout
            title: 定价承压与身份平台巨头的蚕食
            body: >-
              尽管企业级凭据管理直击明确的安全薄弱环节，但随着企业买方整合供应商，其定价权正受到挤压。Microsoft 和 Okta 等平台巨头不断在更广泛的授权包内引入原生身份验证器与特权访问功能。来自 Vendr
              的商业数据证实，1Password 在大规模采购承诺下，企业席位年费从标价 $95 以上压缩至 $10 到 $18 之间，凸显出向上增销 SaaS Manager 与 AI Token
              治理等高毛利模块以维系扩张财务模型的必要性。
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局分类与替代模式
        blocks:
          - type: paragraph
            body: >-
              围绕 1Password 的竞争格局涵盖商用零知识密码库、开源及自建平台、曾遭遇数据泄露的传统存量厂商、新兴的无密码硬件架构，以及原生操作系统或浏览器凭据管理器。Bitwarden、Dashlane、Keeper
              和 NordPass 等直接商业竞品在个人、家庭及商业席位上展开正面竞争，均提供零知识加密库、通行密钥（passkey）同步及跨平台扩展。Bitwarden、Vaultwarden 和 Passbolt
              等开源替代方案则吸引了技术熟练的用户与注重隐私的团队，这些客群看重代码透明度、本地私有化部署以及免去年度 SaaS 席位授权成本。与此同时，原生现状替代品——例如整合至 iOS 与 macOS 的 Apple
              密码（Apple Passwords），以及 Google Chrome、Microsoft Edge 和 Safari
              的内置管理器——提供了免费的基础凭据自动填充，满足了抗拒为独立工具付费的普通用户需求。新兴的硬件绑定替代方案（包括如 EveryKey
              等基于近场接近的身份验证器）试图完全跳过键入主密码，不过相较于软件密码库，此类方案仍显小众。
