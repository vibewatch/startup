      - number: '1.2'
        title: 资本结构、二级流动性与业务规模
        blocks:
          - type: paragraph
            body: >-
              2019 年至 2022 年间，1Password 完成了三轮机构融资，总额达 $920 million：包括 2019 年 11 月由 Accel 领投的 $200 million A 轮融资、2021 年 7
              月按 $2.0 billion 投后估值完成的 $100 million B 轮融资，以及 2022 年 1 月由 ICONIQ Growth 领投的 $620 million C 轮融资，确立了其 $6.8
              billion 的估值峰值 (CO005, CO009)。2025 年 10 月，早期创始人与资深员工完成了涉及 Halo Fund 和 Flume Ventures 的 $100 million
              老股转让交易，使早期股权持有者得以变现个人持股，同时保留大量股权且未产生新增股权稀释 (CO010)。业务规模迅速扩张，第三方独立追踪机构报告显示，其年经常性收入在 2023 年达到 $250
              million、2024 年达到 $331 million 后，于 2025 年底突破 $400 million，不过经审计的法定财务数据仍未公开 (CO011)。企业端采用规模现已覆盖超过 200,000
              家商业客户，其中包括超过 30% 的财富 100 强（Fortune 100）企业以及逾三分之二的福布斯 AI 50 强（Forbes AI 50）企业 (CO012)。运营团队超过 1,400
              名分布式员工，分布于 5 个国家，在 macOS、Windows、Linux、iOS、Android 及 Web 界面上维护零知识加密架构与企业合规控制 (CO013)。
