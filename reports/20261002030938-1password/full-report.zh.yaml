      - number: '8.4'
        title: 退出就绪度、尽调清单与逻辑破局点
        blocks:
          - type: paragraph
            body: >
              2025 年 10 月的老股交易显示公司具备一定的私募流动性承载能力，庞大的企业客户群、预计 $400M 的 ARR 运行率以及 1,400 多名员工也符合后期运营体量，但这并不证明已具备 IPO
              就绪度。在现有证据中，未见已递交的招股说明书、经审计的上市公司内控评估、披露的董事会治理文件或当期新股融资条款。在这份有限资料库中的缺失，并不能证明这些文件不存在，但构成了明确的尽调缺口。


              投资前需获取：经审计的 ARR 与收入勾稽表、按队列划分的总留存率与净留存率、毛利率与自由现金流推导桥梁、并购整合成本、现金与负债余额、完全稀释后的股权结构表、所有清算优先权与参与分配权条款，以及 2025
              年老股交易价格。投资逻辑证伪的触发条件包括：ARR 发生重大重述、总留存率跌破报道的 90%+
              水平、常态化调整后自由现金流持续为负、泛访问产品未能转化为企业级扩张，或新一轮融资的优先权利削弱了普通股等价回报的吸引力。若未厘清上述问题，既无法设定目标持有期，也无法推导可信的退出回报。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
              - CV009
              - CV010
              - CV016
      - number: '8.5'
        title: 支撑图表
        blocks:
          - type: callout
            title: 价格敏感型结论
            body: 应当继续深入研究，而非直接把 2022 年的表面估值计入投资判断。当期证券价格、经审计收入与 ARR 的勾稽对齐，以及完整的优先清算分配瀑布，是做出目标回报决策的前提条件。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
              - CV013
              - CV015
          - type: callout
            title: 切勿混淆 ARR 与收入倍数
            body: Sacra 给出的 $400M 是预计 ARR，而 Multiples.vc 的上市公司参考指标则是 LTM EV / 收入。17.0x 的跨周期替代指标仅具参考诊断意义，并非可直接比对的估值倍数。
            calloutType: risk
            claimRefs:
              - CV004
              - CV014
              - CV015
