      - number: '7.3'
        title: 合作伙伴依赖、第三方供应链与估值重压
        blocks:
          - type: paragraph
            body: >-
              随着 1Password 将产品矩阵扩展至统一访问管理及机器身份治理，第三方集成暴露面成倍增加。2026 年 6 月竞品 LastPass 发生的供应链事件——第三方供应商 Klue 的 OAuth Token
              泄露导致 Salesforce CRM 数据被未授权提取，但未攻破密码库基础设施 [CR013]——表明企业 SaaS 集成具有结构性传染风险。1Password 与企业 CRM、云基础设施及 AI
              智能体工作负载的对接日益增多，放大了第三方 Token 暴露风险 [CR014]。与此同时，商业定价调整拉大了与低价竞品的价差：在 2026 年 3 月的定价更新后，1Password Business
              标价为人均每月 $8.99，而 LastPass Business 为 $7.00，RoboForm Business 为人均每月 $3.33 [CR015]。财务方面，1Password 年经常性收入已突破
              $400M，服务 180,000 至 200,000 家企业 [CR016]，但低价替代品的定价压力以及保护未受管 AI SaaS 集成的沉重负担，构成了持续的运营逆风。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 补充图表
        blocks:
          - type: callout
            title: 第三方集成引发的供应链传染风险
            body: >-
              2026 年 Klue OAuth 事件表明，非密码库企业 SaaS 系统（CRM、数据分析、客户支持）成为极具吸引力的凭据窃取跳板。尽管 1Password
              的主密码库依然保持零知识加密，但托管在第三方环境中的客户支持与销售管线元数据依然容易受到供应链攻击。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: 安全密钥的密码学不对称优势
            body: >-
              1Password 的安全密钥架构为抵御泄露密文的离线暴力破解提供了深度的纵深防御。通过在用户主密码之外额外引入 128 位的客户端熵值，1Password 大幅化解了严重重创竞品 LastPass
              的云备份泄露隐患。
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资建议与投资逻辑
        blocks:
          - type: paragraph
            body: >
              投资建议为继续研究，置信度中等，投资评估风险中偏高。正向逻辑在于 1Password 已发展为企业级访问平台，不再局限于个人密码保管库：官网展示了针对人员、AI 智能体、机器、应用和设备的管控能力；Sacra
              预计其 2025 年 10 月 ARR 达到 $400M，总留存率超过 90%，且自由现金流为正。公司还声称拥有超过 200,000 家企业客户和 1,400
              多名员工，这印证了组织体量，但不足以作为对收入质量的独立验证。


              反向逻辑聚焦于价格与证据质量。最近一次披露的有定价融资仍停留在 2022 年估值 $6.8B 的 C 轮，且公开信源对 2022 年对应的收入分母是 $150M 还是 $200M 存在分歧。Sacra
              同时指出浏览器内置密码管理器和无密码认证构成竞争风险。因此，对公司质地的正面评价并不足以支持无条件投资决策：在给出目标回报判断前，必须先获取入场价格、当前经审计的
              ARR、各队列留存明细、利润率质量、股权结构表受偿顺位以及清算优先权。
            claimRefs:
