  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管与法律合规敞口
        blocks:
          - type: paragraph
            body: >-
              1Password 向金融服务、医疗保健与关键基础设施等强监管行业的企业级部署扩张，将其监管与合规敞口推升至标准消费者数据隐私规范之上 [CR002]。在金融服务领域，企业客户受到涵盖 SOC 2 Type
              II、GLBA 和 PCI DSS 等严格框架的约束 [CR003]。公司通过其信任中心（Trust Center）维持着可查验的 SOC 2 Type II 认证
              [CR001]，但其企业客户在面临监管与下游客户施加的企业级审查的同时，普遍遭遇凭据安全习惯薄弱的问题；调查结果显示，三分之二的员工承认存在不良密码习惯，如在工作账户间复用凭据 [CR002]。一项 2026
              年行业调查显示，25% 的小型企业主因控制失效而遭受 $2,000 至 $10,000 不等的合规罚款或通报 [CR004]。尽管竞品 LastPass 因历史数据泄露事件在 2025 年 12
              月承受了英国信息专员办公室（ICO）£1.2 million 的罚款，并达成了 $27.5 million 的北美集体诉讼和解协议 [CR005]，但截至 2026 年，1Password
              尚未录得任何重大监管处罚或密码库失陷惩罚 [CR006]。即便如此，将治理范围扩大至单点登录（SSO）之外的未受管 SaaS 应用，带来了合规追踪负担；一旦访问控制失效，可能导致客户及上游供应商受到审计审查。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
      - number: '7.2'
        title: 运营、基础设施与安全架构风险
        blocks:
          - type: paragraph
            body: >-
              运营安全完整性是 1Password 商业模式赖以生存的基石。该公司的架构分化在于其两层密钥推导模型：将 PBKDF2-HMAC-SHA256 与客户端持有的 128 位安全密钥（Secret
              Key）相结合，确保即便服务器端密文完全泄露，若无客户端本地安全密钥，也无法获取可解密的密码库数据 [CR007]。同类密码管理基础设施在 2025 年和 2026 年期间持续面临运营威胁，包括 2026 年 4
              月伪装成 Bitwarden CLI 的恶意 npm 软件包在公共包注册表中停留了 90 分钟 [CR008]，以及 2026 年 5 月针对 Dashlane 的外部撞库攻击，导致不到 20
              个个人账户的加密密码库被未授权下载 [CR009]。在这两起事件中，底层客户端加密均成功阻止了明文被提取 [CR010]。就 1Password 而言，管理分布在 5 个国家、超过 1,400
              名员工的远程优先全球团队，带来了人为失误与内部威胁隐患 [CR011]。鉴于内部调查强调超过三分之一的企业员工在离职后仍保留对前雇主账户的访问权限 [CR012]，1Password
              的内部身份管理与权限回收生命周期必须保持无瑕执行，以防止凭据外泄进入公司系统。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
