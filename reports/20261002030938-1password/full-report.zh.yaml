            body: >-
              公开证据确立了若干客户群体，但未给出完整的收入细分。1Password 目前的企业安全页面显示有超过 200,000 家企业信赖该产品，而其 2026 年 2 月的合作伙伴计划通稿称拥有超过 180,000
              家企业与 100 万名开发者。同一通稿称企业客户贡献了超过 75% 的收入，这属于收入结构表述而非企业合同数量统计。一份独立分析师报告补充称，年经常性收入消费额超过 $100,000 的客户复合年增长率为
              70%，但未披露客户群组数量、起始周期或测算方法。这些门槛数据表明企业端正在普及并向大型客户演进；但无法据此推导出活跃席位数、客户质量，或公司披露的两项企业总数之间的精确增长率。
