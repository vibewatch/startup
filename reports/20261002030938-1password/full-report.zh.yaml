      - number: '6.3'
        title: 业务韧性与增销动能
        blocks:
          - type: paragraph
            body: >-
              有关客户留存的公开证据较为薄弱。独立分析师报告称毛留存率超过
              90%，但所提取的文本既未提供统计周期，也未提供客户群组定义，且指派材料池中没有公开信源提供净收入留存率、客户流失率、续约周期或增销收入。不过，公司发布的招聘信息展示了明确的商业运营模式：资深客户成功经理需负责价值兑现、收入留存、续约及增销，另一则招聘则设立了企业客户成功总监岗位。合作伙伴计划则单独对早期商机报备与纯新增获客给予激励，同时鼓励经常性服务收入。这些信息证明了组织意图与业务流程，而非实际实现的留存财务成果。它们还展示了横跨企业密码管理器（Enterprise
              Password Manager）、Device Trust 与 SaaS Manager 的多重增销场景，但未披露搭售率。
            claimRefs:
              - CU006
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU013
