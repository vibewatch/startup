      - number: '2.2'
        title: 市场规模测算视角与受限的可触达机会
        blocks:
          - type: paragraph
            body: >-
              评估 1Password
              的可触达市场，需要将宽泛的身份治理前景预测同凭据库及扩展访问软件所能获取的受限支出池区分开来。最宽泛的可触达视角涵盖全球企业网络安全与身份安全支出，据行业基准预计，覆盖人类与非人类身份保护的总支出将达数千亿美元。在此视野下，可服务可触达市场（SAM）聚焦于企业密码管理、开发者机密编排及
              SaaS 治理平台，预计对应年支出池在 $12B 至 $18B
              区间。当前可服务可获取市场（SOM）则依托于拥有分布式员工队伍、多设备生态系统，以及绕过传统企业单点登录的非受管云端或开发环境的各类机构。行业采用指标显示企业凭据安全正加速渗透，1Password 在
              180,000 家企业账户中创造了超过 $400 million
              的年经常性收入。即便如此，由于中端市场面临定价下行压力、平台级存量巨头推动供应商整合，加之消费者用户向企业级授权合同的转化率未经证实，市场规模估算仍存在显著偏差。
