  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 阵营
      - 论点
      - 证据
      - 改变观点的条件
    rows:
      - - 投资逻辑
        - 具备规模的经常性收入平台
        - Sacra 预估 2025 年 10 月 ARR 为 4 亿美元（$400M），总留存率高于 90%。
        - 经审计的 ARR 调节表以及低于报道水平的队列留存率将削弱该投资逻辑。
      - - 投资逻辑
        - 企业业务广度与客户触达能力
        - 官方材料覆盖人员、AI 智能体、机器、应用、设备与访问控制；公司自述服务超过 200,000 家企业。
        - 密码管理之外产品的低搭售率或低扩张率将削弱平台型业务逻辑。
      - - 投资逻辑
        - 具备自我造血能力的增长
        - Sacra 报道自由现金流为正。
        - 若标准化现金流调节表显示持续烧钱，将推翻这一支撑因素。
      - - 反向逻辑
        - 价格发现滞后
        - 上一次披露定价的轮次为 2022 年的 68 亿美元（$6.8B）；2025 年的老股交易缺少披露价格。
        - 附带完整条款的最新公平交易融资或老股交易标记将有助于改善价格发现。
      - - 反向逻辑
        - 竞争挤压
        - Sacra 将浏览器内置密码管理器与无密码认证视作风险。
        - 若能证明企业端扩张及相对这些替代方案的定价持久力，将减轻该担忧。
    notes: 公司发布的规模与平台主张均已明确标注；Sacra 的最新财务指标属于估算，而非经审计的披露信息。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
      - CV016
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 运营假设
      - 估值区间
      - 概率信号
      - 下行或上行触发条件
    rows:
      - - 乐观情景
        - ARR 持续增长，总留存率保持在 90% 以上，自由现金流保持为正，更广泛的访问控制产品推动企业端扩张。
        - 高于 $6.8B 或可得到支撑，但尚无明确上限的公开证据。
        - 经审计的增长与留存数据，外加一份条款清晰的当前投资条款清单。
        - 上行空间需要分母口径一致的指标与交易条款，而非仅凭公司规模自述。
      - - 基准情景
        - 规模有所扩大，但经审计的利润率、净留存率、优先股条款及老股交易价格仍无法获取。
        - 滞后的 $6.8B 估值标记仅作为参考，并非有支撑的公允价值区间。
        - 当前新股定价接近旧标记，并伴随经核实的 $400M 级 ARR 与持续的现金创造能力。
        - 在缺失的完整材料交付之前，维持继续研究的建议。
      - - 悲观情景
        - 报道的 ARR 或现金创造能力未通过验证，竞争挤压增长，或优先条款蚕食普通股对应价值。
        - 低于 $6.8B；从公开证据中目前还无法负责任地量化其幅度。
        - 收入分母核对低于 ARR 预期，或留存率跌破报道的 90%+ 水平。
        - 发生财务重述、重新陷入烧钱或出现惩罚性优先股堆叠，将打破该投资逻辑。
    notes: 估值区间刻意与 2022 年投后估值挂钩，因为 Sacra 报道的是 ARR，而可比参考指标采用收入或 EV / 收入；这些分母不可相互替代。
    claimRefs:
      - CV001
      - CV004
