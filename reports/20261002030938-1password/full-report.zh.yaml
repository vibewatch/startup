chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、发展历程与治理演进
        blocks:
          - type: paragraph
            body: >-
              1Password 是 AgileBits Inc. 旗下的商业品牌。AgileBits Inc. 是一家在加拿大注册成立的私营科技公司，总部位于安大略省多伦多市央街 4711 号 (CO001)。公司由
              Dave Teare、Roustem Karimov、Sara Teare 和 Natalia Karimova 于 2005 年创立，他们最初构想了 Mac 工具软件「1Passwd」并于 2006 年 5
              月推出 (CO002, CO003)。与在早期轮次中承受机构股权稀释的传统风投支持型软件初创企业不同，AgileBits 凭借内生客户收入维持自力更生，并在 2019 年 11 月前连续 14 年保持持续盈利
              (CO004, CO005)。这段长期的自筹资金所有权历程在引入外部资本前，保留了极高的创始人股权比例与机构独立性 (CO004)。治理结构发生重大演进：长期担任首席执行官的 Jeff Shiner 于 2025
              年 7 月转任董事会执行主席，将日常运营领导权交接给首席执行官 David Faugno；Faugno 最初于 2024 年 11 月以联席 CEO 身份加入，负责把控公司规模化扩张及上市准备工作 (CO006,
              CO007)。机构董事席位由领投机构 Accel 的 Arun Mathew 和 ICONIQ Growth 的 Will Griffith 与创始团队共同持有 (CO008)。
            claimRefs:
