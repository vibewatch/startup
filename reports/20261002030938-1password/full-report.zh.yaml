  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链将经营验证与估值不确定性转化为有条件的「进一步研判」建议。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 2025 年 10 月预计 ARR 达 $400M，且公司自述商业客户超 200,000 家。
        - id: quality
          label: 质量信号
          detail: Sacra 报告毛留存率超 90% 且自由现金流为正。
        - id: product
          label: 平台覆盖广度
          detail: 官方资料将价值主张延伸至人员、AI Agent、机器、应用程序与设备。
        - id: price
          label: 定价不确定性
          detail: $6.8B 定价轮估值可追溯至 2022 年；2025 年二级市场转让价格未予披露。
        - id: terms
          label: 条款不确定性
          detail: 优先股堆叠、稀释比例、债务、现金及退出分配顺序（Waterfall）均未公开。
        - id: decision
          label: 进一步研判
          detail: 仅在审计后指标、最新定价及安全级单体经济模型得到验证后方可推进。
      edges:
        - from: scale
          to: quality
        - from: quality
          to: product
        - from: product
          to: price
        - from: price
          to: terms
        - from: terms
          to: decision
    approximationNotes: 该流程属于定性分析，未设定情景概率，亦不暗示公司声明已通过独立验证。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
