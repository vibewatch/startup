        - label: 收入实现：经常性 SaaS ARR（商业份额 >60%）
        - label: 营业利润率产出：保管库营业成本对比高毛利扩张
    approximationNotes: 流向图展示了从账户开通到多产品收入生成的概念性运营与变现路径。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示从客户端展示层、加密引擎到认证协议及后端云同步器的架构堆栈图。
    approximationNotes: 技术栈各层级代表从技术访谈指南、工程 AMA 披露以及企业级产品文档中梳理出的架构切分。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
    data:
      layers:
        - label: 客户端应用与展示层
          description: 桌面端应用、移动客户端、浏览器插件及 Knox 设计系统
          detail: 基于 React、TypeScript 以及覆盖 macOS、Windows、Linux、iOS、Android 和 Web 的原生封装层构建
          modules:
            - 桌面端应用（macOS、Windows、Linux）
            - 浏览器插件（Chrome、Firefox、Edge、Safari）
            - 移动客户端（iOS、Android）
            - Knox 智能体前端系统
        - label: 客户端密码学与处理引擎
          description: 执行客户端密码学功能的内存安全 Rust 核心引擎
          detail: 采用 ring 密码学 crate 并编译为 WebAssembly，确保 Web 端与跨平台一致性
          modules:
            - 客户端零知识保管库
            - 主密码与 Secret Key 派生
            - AES-256-GCM 信封加密
            - Ring 密码学库
        - label: 扩展访问管理（XAM）服务
          description: 设备姿态验证、凭据代理与 SaaS 情报
          detail: 将 Kolide 设备信任与 Trelica SaaS 管理引擎整合为统一的企业控制平面
          modules:
            - Kolide 设备信任态势引擎
            - Trelica SaaS 与 AI Token 发现
            - AI Agent 凭据代理
            - Watchtower 失陷威胁情报
        - label: 开发者与 Agent 工具链
          description: CLI 插件、SDK 与自动化 AI 运行时凭据注入
          detail: 执行期动态解析密钥引用，无需暴露明文凭据
          modules:
            - 1Password CLI 与 Shell 插件
            - 开发者门户 SDK
            - AppSec Skill Harness
            - 服务账户与机器工作负载
        - label: 认证协议与身份联合
          description: 零知识认证与企业目录联合
          detail: 采用 Go 实现 SRP 协议，并与 Okta、Azure AD 及 Google Workspace 集成
          modules:
            - SRP 认证网关 (Go)
            - SCIM 桥接与配置
            - IdP 连接器（Okta、Azure AD）
            - Events API 与审计日志
        - label: 后端云同步基础设施
          description: 全球多租户云同步与元数据存储
          detail: 存储加密保险库有效负载，无需访问底层解密密钥
          modules:
            - 云端保险库同步引擎
            - 加密 Blob 对象存储
            - 多区域高可用存储
            - 自动化快照与备份流水线
  - id: FU001
    title: 具备证据支撑的客户旅程与扩张机制
    type: journey-map
    summary: 本映射序列明确区分有据可查的商业触点与未经验证的客户转化或留存。
    data:
      nodes:
        - label: 发现
          detail: 直接营销与合作伙伴引入密码、设备信任及 SaaS 治理用例。
          touchpoints:
            - Direct company surface
            - Partner program
        - label: 落地
          detail: 企业采购凭据或访问管理服务；公开渠道未披露典型起始合同金额。
          touchpoints:
            - Enterprise Password Manager
            - Business security
        - label: 投产运营
          detail: IT 与安全团队打通访问策略、设备态势及合规工作流。
          touchpoints:
            - Device Trust
            - Drata integration
        - label: 价值呈现
          detail: 客户成功团队须将产品采用度与可衡量的业务成果及管理层审查挂钩。
          touchpoints:
            - Success plans
            - Executive business reviews
        - label: 续约
          detail: 客户成功岗位明确承担续约风险指标，但公开渠道未见实际续约结果与合同期限数据。
          touchpoints:
            - Renewal management
            - Risk mitigation
        - label: 扩张
          detail: 公司寻求跨多款产品的追加销售以及合作伙伴主导的经常性服务扩张。
          touchpoints:
            - Device Trust
            - SaaS Manager
            - Partner services
    approximationNotes: 本概念旅程基于公开的产品、合作伙伴及招聘资料梳理；并非实测转化漏斗，亦不暗示任何转化率。
    claimRefs:
      - CU009
      - CU013
      - CU014
      - CU016
