      - number: '3.3'
        title: 定价、打包策略与性价比落差
        blocks:
          - type: paragraph
            body: >-
              定价是 1Password 与同质化替代品之间最尖锐的分水岭。1Password 不提供永久免费版本，仅提供 14 天试用期，之后个人账户年费为 $35.88 至 $47.88，核心企业版（Business
              tier）人均月费为 $7.99。形成鲜明对比的是，Bitwarden 提供支持不限设备与不限密码数量的永久免费方案，其高级版（Premium）年费仅为 $10，商业版部署人均月费仅为 $6。按 200
              个商业席位规模计算，选用 Bitwarden 相比 1Password Business 每年约节省 $4,776 至 $4,800 软件授权费用。虽然 1Password 的 Teams Starter
              Pack 提供了最多 10 名用户每月 $19.95 固定总费用的平价切入点，但规模一旦超过 10 个席位，其单席位价格即比 Bitwarden Business 高出 33% 的溢价。LastPass
              等竞品提供了略低的企业定价（人均每月 $7）以及单设备免费版本，但由于残留的数据泄露阴霾，难以获得企业级定价权。
