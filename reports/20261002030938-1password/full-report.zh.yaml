      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              独立报告一致显示，公司 2022 年 C 轮以 $6.8B 估值募集了 $620M，多家数据库也显示其累计新股融资接近 $920M。据 CNBC 报道，C 轮投资者获得了约 9%
              的公司股份，但这单项披露并未公开清算分配瀑布、参与权、反稀释保护、负债、现金或新交易中可获得的股权份额。Sacra 进一步报道称，2025 年 10 月曾进行一笔 $100M 的创始人与员工老股交易，其中包括
              Halo Fund 认购的 $75M；但该报道并未提供老股每股价格或更新后的公司估值。


              将陈旧的 $6.8B 估值标杆与 Sacra 预计的 2025 年 10 月 $400M ARR 机械对比，得出 17.0x 的估值与预计 ARR 替代指标。这并非当期交易倍数，不能视作企业价值 / 收入（EV
              / 收入）倍数。Multiples.vc 列出的上市公司参考数据中，Qualys 的 LTM EV / 收入为 8.5x，CommVault 为 4.9x，另有非上市公司 Island 的 32.0x 估值 /
              收入参考；但业务组合、增速、盈利水平、ARR 与收入的口径差异以及资本结构的不同，阻碍了直接定价。因此，入场纪律要求获取当期投资意向书（term
              sheet）及分母口径一致的财务资料包，而非由上述参考指标直接外推。
            claimRefs:
              - CV001
