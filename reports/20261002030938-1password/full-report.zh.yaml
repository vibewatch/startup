      - number: '2.3'
        title: 买方客群划分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              1Password
              采购决策权跨越多元企业决策主体，不同角色的评估标准、采购触发点与预算归属各有差异。在中端市场与大型企业环境中，核心买方为首席信息安全官（CISO）或信息安全总监，在身份与终端防护预算项下拨付资金，用于强化凭据安全规范、满足合规要求（如
              SOC 2 与 ISO 27001），并取得商业网络安全保险承保资格。在技术与工程主导型企业中，工程副总裁或 DevSecOps 负责人采购开发者授权席位，以杜绝硬编码 API 密钥并在 AWS
              与本地开发环境之间同步机密信息。随着 1Password SaaS Manager 与 AI Spend Management 推出，首席信息官与 IT
              总监直接同首席财务官协同，追踪软件授权泛滥情况，并监控由自主 AI 智能体以及 Cursor、Claude、OpenAI
              等开发工具产生的易波动用量成本。采购路径通常自下而上由开发者或团队级采用切入，随后扩展为涵盖定制折扣及目录联合认证的全公司主服务协议。
