      - number: '6.4'
        title: 落地阻力、集中度与尽调启示
        blocks:
          - type: paragraph
            body: >-
              反向证据主要集中在一份独立分析师报告中，该报告指出客户依然将密码库（Vault）与扩展访问管理视为平行产品，指出 SCIM Bridge
              带来运营阻力，并反映收购后技术支持响应有所放缓。这些观察为「低成本切入再增销」（land-and-expand）的逻辑泼了冷水，因为即便核心密码库备受信赖，附加模块也可能加重运营负担。公开信源未披露头部客户集中度、垂直行业收入构成、合作伙伴渠道订单量、具名客户内部部署深度，亦未说明公开披露的更高客户门槛是否对应付费且活跃的账户。因此，投资评估的核心任务并非证明客户是否存在，而是将账单记录、产品遥测、续约客户群组以及访谈背调相互印证，从而将公开声称的触达规模转化为经久耐用的收入质量。
            claimRefs:
              - CU001
              - CU011
              - CU012
              - CU014
