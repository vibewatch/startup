  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达范围与 IT 支出分类
        blocks:
          - type: paragraph
            body: >-
              1Password 面向的企业安全与身份可触达市场核心在于凭据安全、特权机密编排及扩展访问管理（XAM）。历史上作为面向消费者与小团队的密码库，1Password 已将其商业重心重新调整至企业
              IT、安全运营及开发者工具。在核心企业支出中，纳入范畴的类别包括企业密码管理（EPM）、开发者机密存储与编排、机器对机器凭据代理、登录时设备健康度证明，以及用于遏制未受管应用泛滥的 SaaS
              发现能力。排除在外的类别包括核心身份提供商（IdP）目录（例如 Okta Workforce Identity Cloud 和 Microsoft Entra
              ID）、单点登录联合认证引擎，以及全栈云基础设施安全姿态管理（CSPM）。向 SaaS Manager 的拓展带来了对未受管影子应用的可见性，而近期新增的 AI 支出与用量管理（AI Spend and
              Consumption Management）则针对各基础模型提供商解决了基于用量的 Token 预算编制问题。然而，针对这些功能的企业支出目前依然分散在安全预算、软件资产管理科目与工程运营之间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
