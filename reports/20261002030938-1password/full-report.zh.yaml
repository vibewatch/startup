            title: 公开触达规模并非客户留存证据
            body: >-
              从 2026 年 2 月声称的超 180,000 家企业，变动为现行页面的超 200,000
              家，表明披露门槛有所提高，但两个信源均未界定何为活跃、付费或生产环境账户。在缺乏一致统计时间与明确定义的情况下，不应将这一变动直接换算为客户增长率。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
          - type: callout
            title: 在确认增销预期前验证群组财务表现
            body: 需按客户群组调取客户级账单、产品搭售、续约、流失及席位活跃度数据，随后将这些记录与具名背调及合作伙伴渠道订单相互印证。公开招聘与渠道材料仅能证明存在商业推进动作，无法确立实际达成的净留存率或客户集中度。
