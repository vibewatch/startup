      - number: '1.3'
        title: 战略平台转型与潜在脆弱敞口
        blocks:
          - type: paragraph
            body: >-
              1Password 已战略性地从消费者密码库软件转向企业级扩展访问管理（XAM）、SaaS 治理及机器凭据管理 (CO014)。借助外部并购，包括 2024 年收购设备信任提供商 Kolide、2024 年底收购
              SaaS 管理平台 Trelica，以及 2026 年收购云身份治理提供商 Apono，公司建立了统一访问平台（Unified Access），以保护人类用户、AI 智能体及非人类机器身份
              (CO014)。产品演进包括 2026 年 6 月推出的凭据代理（Credential Broker），可在授予限定范围的机密凭据前审查 AI 智能体与运行时工作负载
              (CO014)。然而，防线扩大也带来了严峻的运营敞口 (CO015)。对零知识加密机制的绝对信任是 1Password 的立足之本，任何系统性密码学失陷或凭据库数据外泄都将引发致命的企业客户流失及监管处罚
              (CO015)。整合分布于多伦多、波士顿、伦敦和特拉维夫的四支跨国工程团队，消化 $250M 至 $300M 并购估值，带来了实质执行摩擦；加之私有股权类别不透明且毛利率未经证实，更令局面趋于复杂 (CO014,
              CO015)。
