      - number: '3.2'
        title: 竞品画像、技术架构与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              架构差异确立了 1Password 与同类产品的分化。1Password 采用独创的双重密钥推导设计，将 PBKDF2 与不共享的 128 位客户端安全密钥（Secret Key, 2SKD）以及
              AES-256-GCM 加密相结合，确保即使主密码泄露，存储在服务器基础设施上的密码库密文也无法被解密。相反，Bitwarden 采用带有 Argon2id 或 PBKDF2-SHA256 的
              AES-256-CBC，提供可验证的开源代码库（GPLv3/AGPLv3）及自托管选项。LastPass 历史上依赖于缺乏辅助客户端密钥的 PBKDF2-SHA256；其在 2022
              年发生的毁灭性安全泄露导致客户密码库备份被复制并遭受严重信誉损害，促成大量客户迁移至 1Password。Keeper 等专用竞品侧重细粒度管理控制以及高达 100GB 的大容量加密文件存储，而 Dashlane
              则将虚拟专用网络（VPN）与暗网监控捆绑至高级订阅档位。不过，1Password 正将防御边界由凭据库拓宽至统一访问管理，整合 SaaS 应用发现与 AI 智能体凭据代理。
