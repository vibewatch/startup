      - number: '8.3'
        title: 乐观、基准与悲观情景框架
        blocks:
          - type: paragraph
            body: >
              乐观情景要求获得独立证实：预计 ARR 持续复合增长、总留存率维持在 90% 以上、完成收购后自由现金流持续为正，且 Unified Access
              能将产品广度转化为稳固的企业级客群扩张。若该组证据成立，可考虑高于 2022 年水平的估值，但现有证据不支持划定明确上限。基准情景则将 $6.8B
              视作陈旧的参考标杆而非公允价值：规模体量的扩大，被经审计利润率、净留存率、老股交易定价及优先权条款的缺失所抵消。


              悲观情景对应估值回落至 2022 年标杆下方：一旦报道的 ARR
              无法与审计收入勾稽对齐、留存转弱、自由现金流自述口径剔除了重大实质成本，或捆绑竞品与无密码方案压缩了增长和定价权，估值便面临重置。由于入场证券类型、股权比例、稀释路径和退出分配瀑布均未明确，目前没有任何情景能支撑概率加权回报的推算。因此，在尽调补齐可比分母口径和具体交易条款之前，估值区间审慎采取相对定位——低于、接近或高于最近一次披露的估值标杆。
