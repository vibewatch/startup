companyProfile:
  summary: >-
    1Password, operated by AgileBits Inc., is a Toronto-based identity security and password management company that has
    evolved from a consumer vault utility into an enterprise extended access management platform spanning people,
    devices, applications, SaaS, and AI workloads. The business is late-stage private, has raised $920M across its
    primary venture rounds, claims more than 200,000 business customers and 1,400+ employees, and remains more
    transparent on product breadth than on audited private-company economics.
