callouts:
  - calloutType: "risk"
    title: "Valuation Multiple Overhang and Multiple Compression Risk"
    body: "At its $6.8B Series C round closed in January 2022, 1Password commanded an implied 45.3x trailing revenue multiple based on its reported $150M revenue run rate. In the current cybersecurity and enterprise software market, median public multiples trade significantly lower, creating substantial downside valuation exposure if revenue growth has decelerated or if public market listing multiples are applied."
    claimRefs:
      - "CI002"
      - "CI010"
      - "CI012"
  - calloutType: "recommendation"
    title: "Mandatory Confirmatory Diligence on Private Financial Metrics"
    body: "Because 1Password remains an unaudited private corporation that has not filed public registration statements, critical financial benchmarks—including gross margin, net revenue retention, cash burn, and the preferred share liquidation waterfall—are entirely opaque. Institutional investors must condition capital allocation on receipt of audited financial statements and capitalization table review."
    claimRefs:
      - "CI009"
      - "CI011"
      - "CI013"
