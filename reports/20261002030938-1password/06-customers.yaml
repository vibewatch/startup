company:
  name: "1Password"
chapter:
  number: 6
  title: "Customers"
  summary: "1Password's live business page claims more than 200,000 business customers, while a February 2026 release used a lower threshold of more than 180,000; the public material does not define paid, active, or production accounts. The evidence supports a broad business footprint and a deliberate retention-and-expansion motion, but named deployment depth, independently verified outcomes, retention periods, and customer concentration remain material diligence gaps."
sections:
  - id: "customer-mix-and-adoption"
    title: "Customer mix and adoption signals"
    body: "The public evidence establishes several constituencies but not a complete revenue segmentation. 1Password's current business-security page says more than 200,000 businesses trust the product, while its February 2026 partner-program release said more than 180,000 businesses and 1 million developers. The same release says businesses generate more than 75% of revenue, which is a revenue-mix statement rather than a count of enterprise contracts. An independent analyst report adds a 70% compound annual growth rate for customers spending more than $100,000 in annual recurring revenue, but does not disclose the cohort count, starting period, or methodology. These thresholds suggest business adoption and movement toward larger accounts; they do not establish active-seat counts, customer quality, or a precise growth rate between the two company-reported business totals."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU015"
    tableRefs:
      - "TU001"
      - "TU002"
  - id: "customer-proof-and-outcomes"
    title: "Customer proof is visible but uneven"
    body: "The strongest named outcome in the assigned evidence is a testimonial on 1Password's own homepage from Red Bull Racing and Technology's Head of Software Engineering for Aerodynamics, who credits the product with adding discipline and clarity to access management. The company and Drata also name customers including Canva and Salesforce, but those pages do not disclose contract scope, deployment status, measured outcomes, or renewal history for those brands. Drata describes a concrete joint workflow in which Device Trust feeds device posture into continuous-compliance evidence collection. A separate analyst report says two unnamed enterprise customers value the mature vault, device posture, policy granularity, and self-remediation. This is useful qualitative validation, but anonymity and partner or company control prevent it from serving as independently auditable production proof."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "durability-and-expansion"
    title: "Durability and expansion motion"
    body: "Public retention evidence is thin. The independent analyst report states gross retention above 90%, but the fetched text supplies neither a measurement period nor a cohort definition, and no public source in the assigned pool provides net revenue retention, logo churn, renewal length, or expansion revenue. Company-issued job postings nevertheless show an explicit commercial operating model: a senior customer success manager is expected to own value realization, revenue retention, renewals, and expansion, while another posting identifies an enterprise customer-success director role. The partner program separately rewards early deal registration and net-new acquisition while encouraging recurring services revenue. These sources demonstrate organizational intent and process, not realized retention economics. They also show multiple expansion surfaces across Enterprise Password Manager, Device Trust, and SaaS Manager without disclosing attach rates."
    claimRefs:
      - "CU006"
      - "CU013"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
  - id: "friction-concentration-and-diligence"
    title: "Friction, concentration, and diligence implications"
    body: "The adverse evidence is concentrated in one independent analyst report, which says customers still perceive Vault and Extended Access Management as parallel products, identifies SCIM Bridge as operational friction, and reports softer support responsiveness after acquisitions. Those observations temper the land-and-expand thesis because additional modules can increase operating burden even when the core vault is trusted. Public sources do not disclose top-customer concentration, vertical revenue mix, partner-sourced bookings, deployment breadth within named accounts, or whether the larger published customer threshold reflects paid and active accounts. The central underwriting task is therefore not to prove that customers exist, but to reconcile billing records, product telemetry, renewal cohorts, and reference calls so reported reach can be translated into durable revenue quality."
    claimRefs:
      - "CU001"
      - "CU011"
      - "CU012"
      - "CU014"
callouts:
  - calloutType: "risk"
    title: "Public reach is not retention evidence"
    body: "The move from a February 2026 claim of more than 180,000 businesses to a live-page claim of more than 200,000 suggests a higher reported threshold, but neither source defines active, paid, or production accounts. The change should not be converted into a customer growth rate without consistent measurement dates and definitions."
    claimRefs:
      - "CU001"
      - "CU002"
  - calloutType: "recommendation"
    title: "Validate cohort economics before underwriting expansion"
    body: "Request customer-level billings, product attach, renewal, churn, and seat-activity data by cohort, then reconcile the records to named references and partner-sourced bookings. Public hiring and partner materials establish a commercial motion but cannot establish realized net retention or concentration."
    claimRefs:
      - "CU006"
      - "CU013"
      - "CU014"
