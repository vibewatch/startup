  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "RELEX competes against broad enterprise planning suites, retail-specialist modules, and lower-cost modular alternatives. The sharpest tradeoff is not feature depth alone but whether buyers want a single end-to-end planning stack or a faster, cheaper, narrower deployment that can start with one workflow and expand later."
  },
  "sections": [
    {
      "id": "competitive-landscape",
      "title": "Competitive Landscape Overview",
      "body": "RELEX sits in a market with several distinct competitor classes. The direct field includes broad enterprise planning suites such as Blue Yonder, Kinaxis, o9, SAP IBP, and Manhattan. A second tier consists of retail-focused modules and mid-market planners such as LEAFIO AI, Netstock, Slimstock, and ToolsGroup. A third tier is the status quo: spreadsheets, ERP add-ons, and internal builds that survive when the buyer does not yet need a full suite. The public comparison pages consistently frame RELEX as strong on retail-specific breadth and weaker on speed, simplicity, and price transparency for smaller buyers. That is the right lens for diligence: RELEX is not usually beaten by one feature gap, but by a cheaper deployment path or a narrower product that solves the initial problem faster.",
      "claimRefs": [
        "CP001",
        "CP002",
        "CP003",
        "CP004"
      ],
      "tableRefs": [
        "TP001"
      ]
    },
    {
      "id": "capability-and-pricing",
      "title": "Capability and Pricing Comparisons",
      "body": "The main buyer questions are capability, integration depth, and total cost of ownership. Public alternative guides repeatedly say that RELEX is the deeper retail planning platform, especially for forecasting, replenishment, pricing, and workforce coordination, but that the broader suites can be more attractive when a company already runs their ERP or wants a stronger execution estate. Public pricing is sparse for nearly every vendor in the field, which is itself an answer: most of the market still sells on quote-based enterprise contracts. The consistent external signal is that implementation weight and price escalate quickly as buyers add modules, consultants, and user groups. That creates room for modular tools that can ship in months rather than quarters.",
      "claimRefs": [
        "CP005",
        "CP006",
        "CP007",
        "CP008",
        "CP009",
        "CP011"
      ],
      "tableRefs": [
        "TP002",
        "TP003"
      ]
    },
    {
      "id": "moat-and-switching-costs",
      "title": "Switching Costs, Moat Durability, and Adverse Evidence",
      "body": "RELEX’s moat is real but not absolute. The strongest protection comes from deep retail referenceability, integrated planning workflows, and the cost of re-plumbing master data and planner routines across merchandising, supply, pricing, and workforce teams. Yet the same public comparison pages that praise RELEX also highlight the pressure points: long implementations, enterprise pricing, and complexity for mid-size organizations. That means commoditization risk is highest at the basic forecasting and replenishment layer, while the moat is stronger where buyers need a unified platform across several planning functions. The adverse evidence therefore does not say the product is weak; it says the market is unforgiving and will reward narrower, faster, or cheaper solutions whenever the buyer can accept less breadth.",
      "claimRefs": [
        "CP010",
        "CP011",
        "CP012",
        "CP013",
        "CP014"
      ],
      "figureRefs": [
        "FP001"
      ]
    }
  ],
