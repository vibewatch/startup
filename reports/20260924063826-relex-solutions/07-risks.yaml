  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "RELEX has a credible product and customer base, but the public risk profile is still shaped by implementation complexity, pricing opacity, partner dependence, and missing disclosure on retention and cash generation. The biggest risks are not existential single events; they are execution drag, concentration blind spots, and the possibility that growth slows before the business becomes more transparent."
  },
  "sections": [
    {
      "id": "regulatory-and-legal",
      "title": "Regulatory and Legal Risk",
      "body": "The regulatory read is better than many software companies because RELEX has a public AI governance page that names ISO 27001, SOC 2 Type II, GDPR, EU AI Act alignment, human oversight, and no training of GenAI on customer data. That said, the same architecture depends on a set of third-party AI and cloud sub-processors, and the public surface does not show a full external audit trail beyond the trust page. We did not find a public enforcement action or litigation headline in the current source set, but absence of evidence is not evidence of absence. The right diligence posture is therefore not panic; it is to verify the controls, contracts, and audit coverage that sit behind the marketing language.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR006"
      ],
      "tableRefs": [
        "TR001"
      ]
    },
    {
      "id": "operational-risk",
      "title": "Operational, Reliability, and Delivery Risk",
      "body": "Operationally, the biggest risk is that enterprise planning software is hard to implement, hard to support, and hard to keep lightweight as the module footprint expands. Comparison pages repeatedly describe RELEX as powerful but complex, with long deployments and high TCO. Review pages also point to support and reliability friction, which matters because planning software is only valuable when the daily workflow actually sticks. Hiring pages and job ads show an engineering-heavy organization, which is good for product depth but also indicates labor intensity and scaling dependence. In short: this is a real software business, but it is not a low-friction self-serve product.",
      "claimRefs": [
        "CR003",
        "CR004",
        "CR005",
        "CR007"
      ],
      "tableRefs": [
        "TR002"
      ]
    },
    {
      "id": "dependency-and-capital",
      "title": "Partner, Dependency, and Financial Model Risk",
      "body": "The dependency stack is straightforward but meaningful. RELEX depends on customer data quality, cloud infrastructure, third-party AI services, implementation work, and a partner ecosystem that helps it reach customers and expand deployments. On the finance side, public profiles show late-stage private funding and a small debt financing round, but they do not show a current consolidated cash, burn, or runway view. That means the market can see growth, but not the exact amount of capital pressure behind it. The most important diligence question is whether RELEX can keep growing without leaning too heavily on services, partner motion, or fresh capital.",
      "claimRefs": [
        "CR006",
        "CR007",
        "CR008",
        "CR009",
        "CR010",
        "CR011",
        "CR012"
      ],
      "tableRefs": [
        "TR003"
      ],
      "figureRefs": [
        "FR001"
      ]
    }
  ],
