chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform scope
        blocks:
          - type: paragraph
            body: >-
              RELEX Solutions presents itself as a unified AI-native platform for retail and supply-chain planning. The
              company's public homepage says it helps retailers, manufacturers, and wholesalers improve demand
              forecasting, replenishment, merchandising, pricing, supply planning, and production planning. That
              positioning matters because RELEX is not selling a single point application; it is selling a broad
              operating layer that unifies decisions across the consumer-goods value chain. The same message appears in
              its 2026 growth release, which describes new contract wins, AI-assisted implementations, and platform
              expansion. The public record therefore supports a real, broad enterprise planning business, even if the
              underlying financial disclosure remains sparse.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
      - number: '1.2'
        title: Leadership, headquarters, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              RELEX remains visibly founder-led. Public profiles and partner pages keep Mikko Kärkkäinen, Johanna
              Småros, and Michael Falck in the story, while executive profiles also show Johan Haataja, Tuomo Pesonen,
              and Ville Hämäläinen in current operating roles. The company is still Helsinki-headquartered, but its
              footprint is now international: the careers page shows offices across Europe, North America, and
              Asia-Pacific, and independent profiles place the company in the low-thousands of employees. That
              combination of founder continuity and multi-region scale is important for diligence because it implies
              both institutional depth and key-person concentration. The company has clearly crossed the startup phase,
              but the founding group still anchors the narrative and, likely, parts of the operating culture.
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO012
              - CO013
