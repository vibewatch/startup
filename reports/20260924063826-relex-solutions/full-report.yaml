  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              RELEX competes in enterprise software for retail and supply-chain planning, not in generic ERP, passive
              analytics, or raw database tooling. The core spend bucket includes demand forecasting, replenishment,
              inventory optimization, pricing and promotions, space and assortment, and workforce planning. The buyer is
              usually a large retailer, manufacturer, wholesaler, or consumer-goods network that wants one planning
              layer across store, DC, and upstream production decisions. Adjacent categories such as execution systems,
              procurement suites, and point BI tools can support the workflow, but they do not replace the planning
              engine itself. The market is therefore best understood as a decisioning stack: planning, simulation, and
              operational execution handoff. RELEXs own homepage and 2026 growth release reinforce that framing by
              positioning the company as a unified planning platform rather than a single-module vendor.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: Sizing and Adoption Lens
        blocks:
          - type: paragraph
            body: >-
              There is no clean public TAM for RELEX specifically, so sizing has to be built from evidence-constrained
              lenses. The broad lens is the enterprise software spend associated with retail and supply-chain planning,
              which is clearly large enough to support multiple global vendors. The narrower lens is the customer base
              and implementation footprint: RELEX publicly claims 500+ customers and 600+ enterprise implementations,
              while independent competitor pages show Blue Yonder at 3,000+ customers, Netstock at 2,400+, and SAP IBP /
              o9 / Manhattan all operating as global enterprise suites. That indicates a market where buying decisions
              are concentrated in a relatively small number of enterprise logos, but each logo can carry a large
              multi-module contract. The adoption pattern is therefore not volume-driven consumer software; it is
              account-value-driven enterprise transformation with long implementation cycles and high switching
              friction.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs: []
      - number: '2.3'
        title: Adoption Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The biggest growth drivers are operational complexity and the economics of freshness, waste, and
              availability. RELEXs own content shows the company leaning into AI-native planning, agentic features, and
              fast value realization, while the pricing-optimization article frames the ROI story around sales lift,
              margin protection, and productivity gains. Buyers are also pushed by omnichannel operations, supply
              volatility, and the need to coordinate pricing, promotions, and inventory in one place. The main
              constraints are the same ones highlighted by independent alternatives pages: long implementation cycles,
              enterprise-oriented pricing, customization overhead, and limited flexibility for mid-size retailers. Those
              constraints create headroom for modular specialists such as LEAFIO AI and Netstock, and for status-quo
              alternatives like ERP modules or spreadsheets. Market adoption is therefore strong where complexity is
              high and weaker where speed, modularity, or cost matter more than breadth.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs: []
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM012
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the core selling point
            body: >-
              RELEX is strongest where the buyer wants one planning platform across demand, supply, pricing, and
              promotions rather than a single point solution.
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: Speed and cost still decide many deals
            body: >-
              The market still rewards vendors that can prove fast value and manageable TCO; that is the opening for
              modular specialists and the main constraint on RELEX-style broad suites.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              RELEX sits in a market with several distinct competitor classes. The direct field includes broad
              enterprise planning suites such as Blue Yonder, Kinaxis, o9, SAP IBP, and Manhattan. A second tier
              consists of retail-focused modules and mid-market planners such as LEAFIO AI, Netstock, Slimstock, and
              ToolsGroup. A third tier is the status quo: spreadsheets, ERP add-ons, and internal builds that survive
              when the buyer does not yet need a full suite. The public comparison pages consistently frame RELEX as
              strong on retail-specific breadth and weaker on speed, simplicity, and price transparency for smaller
              buyers. That is the right lens for diligence: RELEX is not usually beaten by one feature gap, but by a
              cheaper deployment path or a narrower product that solves the initial problem faster.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: Capability and Pricing Comparisons
        blocks:
          - type: paragraph
            body: >-
              The main buyer questions are capability, integration depth, and total cost of ownership. Public
              alternative guides repeatedly say that RELEX is the deeper retail planning platform, especially for
              forecasting, replenishment, pricing, and workforce coordination, but that the broader suites can be more
              attractive when a company already runs their ERP or wants a stronger execution estate. Public pricing is
              sparse for nearly every vendor in the field, which is itself an answer: most of the market still sells on
              quote-based enterprise contracts. The consistent external signal is that implementation weight and price
              escalate quickly as buyers add modules, consultants, and user groups. That creates room for modular tools
              that can ship in months rather than quarters.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP011
      - number: '3.3'
        title: Switching Costs, Moat Durability, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              RELEX’s moat is real but not absolute. The strongest protection comes from deep retail referenceability,
              integrated planning workflows, and the cost of re-plumbing master data and planner routines across
              merchandising, supply, pricing, and workforce teams. Yet the same public comparison pages that praise
              RELEX also highlight the pressure points: long implementations, enterprise pricing, and complexity for
              mid-size organizations. That means commoditization risk is highest at the basic forecasting and
              replenishment layer, while the moat is stronger where buyers need a unified platform across several
              planning functions. The adverse evidence therefore does not say the product is weak; it says the market is
              unforgiving and will reward narrower, faster, or cheaper solutions whenever the buyer can accept less
              breadth.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is RELEX’s best argument
            body: >-
              RELEX remains most compelling when the buyer wants one planning stack across demand, replenishment,
              pricing, promotions, and workforce rather than a point solution.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: Speed and price are the main attacks on the moat
            body: >-
              The market keeps rewarding vendors that can ship faster or enter at a lower TCO, so RELEX must defend its
              breadth premium with measurable ROI.
            calloutType: risk
            claimRefs:
              - CP004
              - CP008
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              RELEX monetizes through a subscription-led enterprise software model, usually sold alongside
              implementation, onboarding, and support work. The public pricing material is not a rate card; it is a
              business-case narrative showing that pricing optimization and planning software can generate measurable
              revenue lift, margin lift, and productivity gains. That makes sense for a platform whose value is tied to
              store-level forecasting, replenishment, pricing, and scenario planning rather than a simple seat-based
              SaaS product. Public growth materials show the business still expanding contract value and ARR, but they
              do not disclose a clean revenue mix, realized pricing, or recurring-vs-services split. For diligence, the
              important point is that RELEX is commercialized like a large enterprise platform with implementation drag
              and expansion upside, not like a low-touch SMB SaaS product.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI007
      - number: '4.2'
        title: GTM, Sales Efficiency, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              The go-to-market motion is enterprise-led and relationship heavy. Summit Partners describes customer
              introductions, North American expansion, and a transition to recurring SaaS as explicit value creation
              during its ownership period, which is consistent with a direct enterprise sales motion plus partner
              support. The 2026 growth release indicates that North America is a major growth engine and that
              AI-assisted implementations are helping the company convert demand faster. That is positive for
              efficiency, but it still does not answer the core finance question: how much cash the business consumes to
              keep growing. Public profiles show multiple funding rounds, a secondary mark, and a 2025 debt financing,
              yet no consolidated cash balance or runway is disclosed. The capital story therefore reads as funded, not
              self-evidently self-financing.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI011
      - number: '4.3'
        title: Margin Path, Cost Structure, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The main margin question is how much of RELEX’s value creation is software gross margin versus
              labor-intensive implementation and customer-success work. Nothing public currently quantifies gross
              margin, NRR, or burn, so the business must be judged on proxies: strong contract value growth, a large and
              experienced employee base, and a product that is deep enough to require substantial services.
              Private-market profiles disagree on totals and valuation marks, which is another sign that the exact
              economics are not publicly pinned down. Until management discloses consolidated revenue quality, margin
              profile, and cash use, investors should treat RELEX as a growth asset with good top-line momentum but
              incomplete underwriting visibility.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Growth is real
            body: >-
              The 2026 release shows strong contract-value growth, subscription revenue growth, and a long ARR growth
              streak, which is the right signal for a durable enterprise software asset.
            calloutType: strength
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: Opacity still dominates the underwriting problem
            body: >-
              Public evidence still stops short of consolidated margin, burn, and retention data, so the financial case
              is credible but not fully auditable.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              RELEX is not a narrow point tool. The public product surface spans demand forecasting, replenishment,
              inventory, pricing, merchandising, production planning, store operations, and workforce planning. In
              customer terms, that means the platform is meant to sit in the middle of the planning workflow: it ingests
              operational data, helps planners decide what to order, when to replenish, how to price, and how to
              coordinate across channels and sites. The 2026 growth release adds AI-assisted implementation, agentic
              features, fresh/store operations, and a more extensible RELEX Open layer. Taken together, the evidence
              shows a product that is already deployed and evolving, not an early-stage prototype.
            claimRefs:
              - CE001
              - CE007
              - CE010
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE012
      - number: '5.2'
        title: Architecture, Deployment, and Developer Signals
        blocks:
          - type: paragraph
            body: >-
              The architecture looks like a governed enterprise platform rather than a black-box model. The AI
              governance page explicitly describes human oversight, LLM-agnostic design, separate cloud services, data
              isolation, and security controls. The API documentation shows transaction-level endpoints for sales,
              forecasts, orders, workload forecasts, inventory, deliveries, and spoilage, which is consistent with a
              data-rich planning stack that integrates deeply into customer operations. Hiring pages and job listings
              reinforce that picture: RELEX is actively hiring cloud, Python, SQL, AI integration, Kubernetes, and
              observability talent, which is a credible developer signal for an engineering-heavy product organization.
              The exact internal stack is not public, but the external surface clearly implies a sophisticated
              integration and operating model.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
      - number: '5.3'
        title: Differentiation, Trust, and Gaps
        blocks:
          - type: paragraph
            body: >-
              RELEX’s differentiation is the combination of retail-specific planning depth, AI governance, and
              extensible workflow design. The platform claims ISO 27001 and SOC 2 Type II controls, GDPR compliance, and
              a monitored security operation with fast incident response. That matters because the buyer profile is an
              enterprise retailer or manufacturer that will not accept a planning platform without strong data handling
              and control assurances. The open question is not whether RELEX has trust controls; it does. The open
              question is how much of the platform’s maturity is truly productized versus services-assisted, and how
              much of the reliability, uptime, and SLA profile is publicly documented. Those are the diligence holes
              that remain after the surface read.
            claimRefs:
              - CE002
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The product is broad and operationally embedded
            body: >-
              RELEX appears to own a real planning layer, not just a dashboard, because the platform reaches into
              forecasting, replenishment, pricing, and store operations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE007
          - type: callout
            title: The missing pieces are reliability detail and external proof depth
            body: >-
              The public surface is strong on governance and breadth, but weaker on publicly documented SLAs, uptime
              history, and architecture specifics.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Use Cases
        blocks:
          - type: paragraph
            body: >-
              RELEX sells to large retailers, grocers, wholesalers, manufacturers, and consumer-goods operators. The
              public customer stories make the buyer profile clear: these are organizations with complex supply chains,
              many SKUs, many stores, and strong incentives to reduce waste, stockouts, and manual planning. The value
              proposition is different by segment. Grocery and convenience customers tend to care most about freshness,
              availability, and waste reduction. Manufacturers and wholesalers care more about coordination, forecast
              accuracy, and cross-tier planning. Specialty retail and consumer-goods users care about consistent
              replenishment, promotional planning, and better decision discipline. The company also shows a broad
              geographic footprint, which matters because it suggests the platform can survive more than one regional
              demand pattern.
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU012
      - number: '6.2'
        title: Adoption Trajectory and Breadth of Proof
        blocks:
          - type: paragraph
            body: >-
              The adoption signal is strong even without a fully audited retention table. RELEX says it signed nearly 50
              customers in the first half of 2026, that over 250 customers are now using AI inside their RELEX
              footprint, and that the business has reached a 76th consecutive quarter of ARR growth. Summit separately
              describes 500+ customers and 600+ enterprise implementations. Those are not the same metric, but together
              they show a platform with continued win flow and a large installed base. The external proof layer is also
              unusually broad: official customer quotes, case studies, customer-video libraries, and third-party review
              sites all point in the same direction. What is still missing is the denominator discipline behind
              retention, concentration, and usage depth.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU010
      - number: '6.3'
        title: Named Customer Proof, Retention, and Gaps
        blocks:
          - type: paragraph
            body: >-
              Named deployments are the best part of the customer case. RELEX can point to Qualtia, Lowe's, Rossmann,
              Family Dollar, ICA Sweden, One Stop, Atria, Booths, and many others with public quotes or case studies.
              The stories are consistent: manual processes are reduced, decision quality improves, and users report
              better visibility and easier adoption. That is good evidence of product-market fit. The gap is that public
              evidence does not show cohort retention, gross churn, or customer concentration. In other words, the
              company clearly has customers, but the durability of those customers and the revenue concentration behind
              them are still not fully transparent.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named proof is broad and believable
            body: >-
              RELEX has credible customer quotes across multiple retail and manufacturing segments, which is stronger
              than logo-only proof.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU010
          - type: callout
            title: Durability metrics are still missing
            body: >-
              The company does not publicly disclose NRR, churn, or top-customer concentration, so the customer base is
              proven but not fully underwritten.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory read is better than many software companies because RELEX has a public AI governance page
              that names ISO 27001, SOC 2 Type II, GDPR, EU AI Act alignment, human oversight, and no training of GenAI
              on customer data. That said, the same architecture depends on a set of third-party AI and cloud
              sub-processors, and the public surface does not show a full external audit trail beyond the trust page. We
              did not find a public enforcement action or litigation headline in the current source set, but absence of
              evidence is not evidence of absence. The right diligence posture is therefore not panic; it is to verify
              the controls, contracts, and audit coverage that sit behind the marketing language.
            claimRefs:
              - CR001
              - CR002
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
      - number: '7.2'
        title: Operational, Reliability, and Delivery Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the biggest risk is that enterprise planning software is hard to implement, hard to
              support, and hard to keep lightweight as the module footprint expands. Comparison pages repeatedly
              describe RELEX as powerful but complex, with long deployments and high TCO. Review pages also point to
              support and reliability friction, which matters because planning software is only valuable when the daily
              workflow actually sticks. Hiring pages and job ads show an engineering-heavy organization, which is good
              for product depth but also indicates labor intensity and scaling dependence. In short: this is a real
              software business, but it is not a low-friction self-serve product.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
      - number: '7.3'
        title: Partner, Dependency, and Financial Model Risk
        blocks:
          - type: paragraph
            body: >-
              The dependency stack is straightforward but meaningful. RELEX depends on customer data quality, cloud
              infrastructure, third-party AI services, implementation work, and a partner ecosystem that helps it reach
              customers and expand deployments. On the finance side, public profiles show late-stage private funding and
              a small debt financing round, but they do not show a current consolidated cash, burn, or runway view. That
              means the market can see growth, but not the exact amount of capital pressure behind it. The most
              important diligence question is whether RELEX can keep growing without leaning too heavily on services,
              partner motion, or fresh capital.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The most likely pain is execution drag
            body: >-
              The main risk is not that the product is fake or the market is too small; it is that implementation,
              support, and integration make growth slower and more expensive than the headline story implies.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR007
          - type: callout
            title: Controls are real, but still need proof
            body: >-
              RELEX has a credible compliance and governance posture; the diligence task is to verify the controls, not
              to assume them.
            calloutType: strength
            claimRefs:
              - CR001
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: RELEX appears to have durable retail depth, broad product breadth, and
              enough growth momentum to justify serious attention. The anti-thesis is just as clear: the market still
              does not have audited current financials, the implementation model is heavy, and comparison pages keep
              pointing to speed and TCO pressure from smaller or narrower alternatives. That combination makes RELEX
              feel like a high-quality business with a valuation problem, not a broken business with a product problem.
              The right valuation stance is therefore price-sensitive rather than quality-sensitive.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The latest public financing anchor remains the 2022 Blackstone-led round at a €5 billion valuation, while
              later funding and secondary-market information remain partially opaque. Third-party profiles still place
              RELEX in the roughly $5.7-5.8 billion range, but those are not fresh management marks. The company has
              also continued to show strong top-line and contract-value growth in 2026, which makes the current price
              discipline more about what is missing than what is visible. In other words, the company still deserves a
              premium relative to slower peers, but not a false precision that the public data does not support.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, Decision, and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Base case: RELEX continues to grow, keeps expanding AI usage inside the base, and gradually improves
              monetization, but the business remains hard to price exactly because public margin data are still missing.
              Bull case: the company keeps converting new-logo demand and module expansion into larger contracts, making
              the current multiple feel more justified. Bear case: implementation friction, TCO pressure, and valuation
              compression arrive before the company discloses a cleaner financial profile. Because the evidence is real
              but incomplete, the safest decision is to track rather than upgrade to a buy. Exit readiness also remains
              incomplete: public evidence is strong enough to support interest, but not yet strong enough to support a
              precise entry multiple with confidence.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, don't chase
            body: >-
              RELEX is good enough to keep on the shortlist, but the public evidence does not yet justify paying up
              without more financial transparency.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
          - type: callout
            title: The mark is probably still stretched
            body: >-
              If the company really is still trading near the mid-$5B range, the burden of proof stays on management to
              show margin leverage and retention quality.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV006
