              2022 financing. The 2026 operating story is still stronger than the capital story, with record H1 growth,
              new AI-native features, and continued customer wins. Taken together, the evidence points to a heavily
              backed growth-stage vendor with a long runway, but not to a fully transparent financial profile.
            claimRefs:
