        title: Funding trail and recent milestones
        blocks:
          - type: paragraph
            body: >-
              The funding trail is substantial and late-stage. RELEX disclosed a €20 million Summit Partners investment
              in 2015, a 2017 follow-on, a $200 million TCV round in 2019, and a €500 million Blackstone-led round in
              2022 at a €5 billion valuation. A 2024 Business Wire item says Blackstone and TCV increased their
