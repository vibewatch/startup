  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "RELEX has broad named-customer proof across grocery, retail, manufacturing, and wholesale use cases. Public evidence shows continued customer adoption and AI uptake, but retention, concentration, and cohort quality remain partially opaque, so the customer story is strong on breadth and weaker on hard durability metrics."
  },
  "sections": [
    {
      "id": "segment-distribution",
      "title": "Customer Segments and Use Cases",
      "body": "RELEX sells to large retailers, grocers, wholesalers, manufacturers, and consumer-goods operators. The public customer stories make the buyer profile clear: these are organizations with complex supply chains, many SKUs, many stores, and strong incentives to reduce waste, stockouts, and manual planning. The value proposition is different by segment. Grocery and convenience customers tend to care most about freshness, availability, and waste reduction. Manufacturers and wholesalers care more about coordination, forecast accuracy, and cross-tier planning. Specialty retail and consumer-goods users care about consistent replenishment, promotional planning, and better decision discipline. The company also shows a broad geographic footprint, which matters because it suggests the platform can survive more than one regional demand pattern.",
      "claimRefs": [
        "CU001",
        "CU005",
        "CU010",
        "CU012"
      ],
      "tableRefs": [
        "TU001"
      ]
    },
    {
      "id": "adoption-and-trajectory",
      "title": "Adoption Trajectory and Breadth of Proof",
      "body": "The adoption signal is strong even without a fully audited retention table. RELEX says it signed nearly 50 customers in the first half of 2026, that over 250 customers are now using AI inside their RELEX footprint, and that the business has reached a 76th consecutive quarter of ARR growth. Summit separately describes 500+ customers and 600+ enterprise implementations. Those are not the same metric, but together they show a platform with continued win flow and a large installed base. The external proof layer is also unusually broad: official customer quotes, case studies, customer-video libraries, and third-party review sites all point in the same direction. What is still missing is the denominator discipline behind retention, concentration, and usage depth.",
      "claimRefs": [
        "CU002",
        "CU003",
        "CU004",
        "CU011"
      ],
      "tableRefs": [
        "TU002"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "named-proof-and-gaps",
      "title": "Named Customer Proof, Retention, and Gaps",
      "body": "Named deployments are the best part of the customer case. RELEX can point to Qualtia, Lowe's, Rossmann, Family Dollar, ICA Sweden, One Stop, Atria, Booths, and many others with public quotes or case studies. The stories are consistent: manual processes are reduced, decision quality improves, and users report better visibility and easier adoption. That is good evidence of product-market fit. The gap is that public evidence does not show cohort retention, gross churn, or customer concentration. In other words, the company clearly has customers, but the durability of those customers and the revenue concentration behind them are still not fully transparent.",
      "claimRefs": [
        "CU006",
        "CU007",
        "CU008",
        "CU009"
      ],
      "tableRefs": [
        "TU003"
      ]
    }
  ],
