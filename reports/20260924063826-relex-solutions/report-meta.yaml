companyProfile:
  summary: >-
    RELEX Solutions is a Helsinki-founded enterprise software company that sells an AI-native retail and supply-chain
    planning platform. It serves large retailers, wholesalers, manufacturers, and consumer-goods operators with tools
    for forecasting, replenishment, pricing, promotions, workforce planning, and newer AI-assisted store/fresh
    operations. The company is late-stage private, founder-led, and clearly scaled, but public disclosure is still
    incomplete on margins, cash generation, retention, and a fresh valuation mark.
