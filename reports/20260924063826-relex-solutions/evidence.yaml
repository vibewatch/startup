evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Current audited ARR, revenue run rate, gross margin, and net retention for the global business.
    whyItMatters: >-
      The investment view and valuation framing depend on whether growth is converting into durable revenue quality and
      margin expansion.
    diligencePath: >-
      Request management accounts, investor updates, or a filing-backed disclosure that shows current revenue and margin
      metrics.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      A single authoritative TAM/SAM/SOM study for retail and supply-chain planning software that matches RELEXs exact
      product scope.
    whyItMatters: >-
      Without a clean market-study baseline, market size can only be approximated from customer counts, vendor lists,
      and buyer economics.
    diligencePath: >-
      Buy or commission a market report that explicitly defines retail planning, supply-chain planning, and
      pricing/promotions software as one or more separate segments.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-disclosure
    missingEvidence: A current, comparable public price sheet or contract benchmark for RELEX and its closest competitors.
    whyItMatters: >-
      Without direct price disclosures, vendor comparisons rely on quote-based signals and third-party estimates rather
      than market-clearing evidence.
    diligencePath: >-
      Request current proposals or reference pricing from RELEX, Blue Yonder, Kinaxis, o9, SAP IBP, and one modular
      alternative during diligence.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: public-financials
    missingEvidence: A current consolidated income statement, cash balance, and cash burn estimate for the global business.
    whyItMatters: Without consolidated financials, it is impossible to judge margin path or runway with high confidence.
    diligencePath: Request management financials or a lender/investor memo that states current revenue, gross margin, cash, and burn.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: A public SLA, uptime history, or external architecture validation for the production platform.
    whyItMatters: Reliability and uptime are core diligence dimensions for enterprise planning software.
    diligencePath: Request SOC reports, SLA language, uptime metrics, and a detailed architecture walk-through in diligence.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: A public NRR, GRR, cohort retention, or churn disclosure for the customer base.
    whyItMatters: Without retention data, breadth of adoption does not tell us how durable the base is.
    diligencePath: Request cohort retention and churn by segment from management or investor materials.
    relatedQuestionRefs:
      - QU004
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration and share of revenue from the largest accounts.
    whyItMatters: A concentrated customer base could materially change the risk profile even if gross customer count is high.
    diligencePath: Ask for the top-10 customer list and concentration by ARR or revenue.
    relatedQuestionRefs:
      - QU004
      - QU007
    relatedTableRefs:
      - TU001
      - TU003
  - type: missing-source
    severity: material
    topic: legal-discovery
    missingEvidence: A formal legal search confirming no active litigation, enforcement, or privacy claims.
    whyItMatters: The company has a good compliance posture, but diligence still needs explicit legal confirmation.
    diligencePath: Run a jurisdictional legal search and ask management for litigation disclosure.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: runway
    missingEvidence: Current cash balance and runway disclosure.
    whyItMatters: The capital structure cannot be fully underwritten without it.
    diligencePath: Ask for cash, burn, and runway in the latest investor materials or management presentation.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: current-mark
    missingEvidence: A fresh company-provided valuation mark or secondary transaction price since the 2022 round.
    whyItMatters: Without a fresh mark, valuation remains anchored to a 2022 reference point and third-party estimates.
    diligencePath: Request the most recent cap-table mark or secondary transaction reference from management or investors.
    relatedQuestionRefs:
      - QV002
      - QV006
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Public current revenue, margin, and retention disclosure.
    whyItMatters: The recommendation remains price-sensitive and cannot be fully underwritten without it.
    diligencePath: Request management KPI disclosure or a current investor deck with margin and retention metrics.
    relatedQuestionRefs:
      - QV007
      - QV008
    relatedTableRefs:
      - TV001
