  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "RELEX is a Helsinki-founded retail and supply-chain planning vendor with a broad AI-native platform, founder continuity, and a long late-stage funding trail. Public evidence supports substantial customer traction and recent growth, but core financial metrics remain opaque."
  },
  "sections": [
    {
      "id": "identity-platform",
      "title": "Identity and platform scope",
      "body": "RELEX Solutions presents itself as a unified AI-native platform for retail and supply-chain planning. The company's public homepage says it helps retailers, manufacturers, and wholesalers improve demand forecasting, replenishment, merchandising, pricing, supply planning, and production planning. That positioning matters because RELEX is not selling a single point application; it is selling a broad operating layer that unifies decisions across the consumer-goods value chain. The same message appears in its 2026 growth release, which describes new contract wins, AI-assisted implementations, and platform expansion. The public record therefore supports a real, broad enterprise planning business, even if the underlying financial disclosure remains sparse.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO004",
        "CO007"
      ],
      "tableRefs": [
        "TO001"
      ]
    },
    {
      "id": "leadership-scale",
      "title": "Leadership, headquarters, and operating footprint",
      "body": "RELEX remains visibly founder-led. Public profiles and partner pages keep Mikko Kärkkäinen, Johanna Småros, and Michael Falck in the story, while executive profiles also show Johan Haataja, Tuomo Pesonen, and Ville Hämäläinen in current operating roles. The company is still Helsinki-headquartered, but its footprint is now international: the careers page shows offices across Europe, North America, and Asia-Pacific, and independent profiles place the company in the low-thousands of employees. That combination of founder continuity and multi-region scale is important for diligence because it implies both institutional depth and key-person concentration. The company has clearly crossed the startup phase, but the founding group still anchors the narrative and, likely, parts of the operating culture.",
      "claimRefs": [
        "CO003",
        "CO009",
        "CO010",
        "CO012",
        "CO013"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "funding-milestones",
      "title": "Funding trail and recent milestones",
      "body": "The funding trail is substantial and late-stage. RELEX disclosed a €20 million Summit Partners investment in 2015, a 2017 follow-on, a $200 million TCV round in 2019, and a €500 million Blackstone-led round in 2022 at a €5 billion valuation. A 2024 Business Wire item says Blackstone and TCV increased their investment, indicating that the company remained strategically important to its backers after the headline 2022 financing. The 2026 operating story is still stronger than the capital story, with record H1 growth, new AI-native features, and continued customer wins. Taken together, the evidence points to a heavily backed growth-stage vendor with a long runway, but not to a fully transparent financial profile.",
      "claimRefs": [
        "CO005",
        "CO006",
        "CO008",
        "CO011",
        "CO014"
      ],
      "tableRefs": [
        "TO003"
      ],
      "figureRefs": [
        "FO001"
      ]
    }
  ],
