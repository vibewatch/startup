  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "RELEX delivers a retail and supply-chain planning platform that is broad, AI-heavy, and operationally integrated. The public evidence points to a mature enterprise product surface with a governed AI layer, active API and hiring signals, and meaningful trust controls, but still leaves some architectural and reliability details undisclosed."
  },
  "sections": [
    {
      "id": "product-scope",
      "title": "Product Scope and Customer Workflow",
      "body": "RELEX is not a narrow point tool. The public product surface spans demand forecasting, replenishment, inventory, pricing, merchandising, production planning, store operations, and workforce planning. In customer terms, that means the platform is meant to sit in the middle of the planning workflow: it ingests operational data, helps planners decide what to order, when to replenish, how to price, and how to coordinate across channels and sites. The 2026 growth release adds AI-assisted implementation, agentic features, fresh/store operations, and a more extensible RELEX Open layer. Taken together, the evidence shows a product that is already deployed and evolving, not an early-stage prototype.",
      "claimRefs": [
        "CE001",
        "CE007",
        "CE010",
        "CE012"
      ],
      "tableRefs": [
        "TE001"
      ]
    },
    {
      "id": "architecture-and-operations",
      "title": "Architecture, Deployment, and Developer Signals",
      "body": "The architecture looks like a governed enterprise platform rather than a black-box model. The AI governance page explicitly describes human oversight, LLM-agnostic design, separate cloud services, data isolation, and security controls. The API documentation shows transaction-level endpoints for sales, forecasts, orders, workload forecasts, inventory, deliveries, and spoilage, which is consistent with a data-rich planning stack that integrates deeply into customer operations. Hiring pages and job listings reinforce that picture: RELEX is actively hiring cloud, Python, SQL, AI integration, Kubernetes, and observability talent, which is a credible developer signal for an engineering-heavy product organization. The exact internal stack is not public, but the external surface clearly implies a sophisticated integration and operating model.",
      "claimRefs": [
        "CE002",
        "CE003",
        "CE004",
        "CE005",
        "CE006",
        "CE011"
      ],
      "tableRefs": [
        "TE002",
        "TE003"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "differentiation-and-control",
      "title": "Differentiation, Trust, and Gaps",
      "body": "RELEX’s differentiation is the combination of retail-specific planning depth, AI governance, and extensible workflow design. The platform claims ISO 27001 and SOC 2 Type II controls, GDPR compliance, and a monitored security operation with fast incident response. That matters because the buyer profile is an enterprise retailer or manufacturer that will not accept a planning platform without strong data handling and control assurances. The open question is not whether RELEX has trust controls; it does. The open question is how much of the platform’s maturity is truly productized versus services-assisted, and how much of the reliability, uptime, and SLA profile is publicly documented. Those are the diligence holes that remain after the surface read.",
      "claimRefs": [
        "CE002",
        "CE007",
        "CE008",
        "CE009"
      ],
      "tableRefs": []
    }
  ],
