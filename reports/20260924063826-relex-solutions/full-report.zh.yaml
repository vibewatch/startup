            body: >-
              RELEX Solutions 将自己定位为零售与供应链规划的一体化 AI
              原生平台。官网称，平台帮助零售商、制造商和批发商改进需求预测、补货、商品管理、定价、供应与生产计划。它卖的不是单一应用，而是串联消费品价值链各环节决策的运营平台。2026 年增长公告也提到新签合同、AI
              辅助实施和平台扩展。财务披露虽少，公开记录仍显示 RELEX 已是一家覆盖面广、实际运营的企业级规划软件公司。
