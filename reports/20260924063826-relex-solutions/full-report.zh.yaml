              - CP008
              - CP009
              - CP011
      - number: '3.3'
        title: 转换成本、护城河持久度与反向证据
        blocks:
          - type: paragraph
            body: >-
              RELEX
              有护城河，但并非牢不可破。零售客户案例、整合的规划流程，以及跨商品、供应、定价和劳动力团队重建主数据与工作习惯的成本，构成主要壁垒。与此同时，公开对比资料也指出其实施周期长、企业级定价高，对中型企业较复杂。因此，基础预测和补货最容易被同质化；若客户需要多个规划职能共用一个平台，RELEX
              的优势则更明显。反向证据并不表示产品差，而是说明竞争并不宽容：客户愿意牺牲部分功能广度时，更聚焦、更快或更便宜的方案就可能胜出。
