  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              RELEX 面对的竞争者大致分三类。第一类是 Blue Yonder、Kinaxis、o9、SAP IBP 和 Manhattan 等综合企业规划套件；第二类是 LEAFIO
              AI、Netstock、Slimstock 和 ToolsGroup 等零售模块厂商与中端规划工具；第三类是电子表格、ERP
              附加模块和内部自建系统——买方还不需要完整套件时，这些做法仍能满足需求。公开对比资料普遍认为，RELEX
              的零售功能覆盖更广，但对规模较小的买方而言，部署较慢、操作不够简单，价格也不够透明。尽调时要看的不只是功能差距：更便宜的实施路径，或能更快解决首要问题的窄产品，也可能赢单。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: 功能与定价横向对比
        blocks:
          - type: paragraph
            body: >-
              买方主要比较产品能力、集成深度和总体拥有成本（TCO）。公开竞品指南普遍认为，RELEX 的零售规划功能更深入，尤其在预测、补货、定价和劳动力协调上；但若企业已采用某家
              ERP，或需要更强的执行系统，综合套件可能更合适。几乎所有厂商都不公开标价，销售仍以企业级询价合同为主。外部资料还显示，增加模块、顾问和用户后，实施工作和成本会迅速上升。这给能在几个月而非几个季度内上线的模块化工具留下了机会。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
