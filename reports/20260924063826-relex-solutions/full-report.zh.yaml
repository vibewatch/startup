        - 原生 ERP 集成能力强，厂商存续稳健
        - 用户体验与部署速度常落后于垂直专精厂商
      - - Manhattan Associates
        - 执行与计划一体化套件
        - 大型上市软件厂商
        - 全渠道零售与批发
        - WMS/TMS 底盘扎实，计划覆盖面广
        - 系统体量可能超出实际业务需求
      - - LEAFIO AI
        - 模块化零售优化厂商
        - 非上市；成长期
        - 中型及成长型连锁零售商
        - 模块化上线更快，门店端执行更轻便
        - 应对极复杂的全球供应链网络能力偏弱
      - - Netstock
        - 库存计划垂直专精厂商
        - 非上市；专注中端市场
        - 中小企业与中端批发商
        - 对接 ERP、部署迅速的库存计划系统
        - 功能覆盖面窄于企业级套件
      - - Slimstock
        - 库存与供应计划垂直专精厂商
        - 非上市；垂直专精厂商
        - 批发与分销客户
        - 方案务实，契合中端市场预算
        - 创新深度不及 Tier-1 套件
      - - 维持现状 / 内部自研
        - 非厂商采购替代方案
        - 无外部融资
        - 业务复杂度较低或预算承受力偏弱的部门
        - 前期资金投入最低
        - 高度依赖人工、扩展性差且数据治理脆弱
    notes: 本表为代表性竞品图谱而非穷尽式普查。规模与融资情况基于厂商公开资料及比对页面估算，属方向性判断，应作为尽调速记参考而非经审计的市场份额。
