        title: 展示项
        blocks:
          - type: callout
            title: 标杆客户验证广泛且可信
            body: RELEX 拥有跨越多个零售与制造细分板块的可信客户评价，相比单纯罗列企业 Logo 具备更强的说服力。
            calloutType: strength
            claimRefs:
              - CU005
