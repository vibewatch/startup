  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与业务范畴
        blocks:
          - type: paragraph
            body: >-
              RELEX 面向的是零售与供应链规划软件市场，不是通用
              ERP、被动分析或底层数据库工具。相关预算主要用于需求预测、补货、库存优化、定价促销、空间与品类规划及劳动力规划。买方多为大型零售商、制造商、批发商或消费品网络，需要在门店、配送中心（DC）和上游生产之间统一规划。执行系统、采购套件和单点
              BI 可以支持流程，却不能取代规划引擎。这个市场更像一套决策系统：先规划和模拟，再把方案交给运营执行。RELEX 官网和 2026 年增长公告也将公司定位为一体化平台，而非单模块供应商。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: 规模测算与采用视角
        blocks:
          - type: paragraph
            body: >-
              目前没有专门针对 RELEX 的可靠公开 TAM，规模只能从有限证据切入估算。宽口径看，零售与供应链规划相关的企业软件支出足以容纳多家全球厂商；窄口径看，RELEX 自称有 500+ 家客户和 600+
              个企业级实施项目，竞品资料则显示 Blue Yonder 有 3,000+ 家客户、Netstock 有 2,400+ 家，SAP IBP、o9 和 Manhattan
              也都在全球企业市场运营。采购集中在数量有限的大型企业客户，但单个客户可能签下多模块大合同。这不是靠用户数量取胜的消费软件，而是以单客价值驱动、销售周期长且更换成本高的企业转型项目。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs: []
      - number: '2.3'
        title: 采用驱动因素与制约条件
        blocks:
          - type: paragraph
            body: >-
              运营越复杂，保鲜、减损和保障供货的经济价值越高，越能推动市场增长。RELEX 的公开内容主打 AI 原生规划、智能体功能和更快实现价值；定价优化文章则把 ROI
              归因于销售提升、毛利保护和效率改善。全渠道经营、供应波动，以及统一协调定价、促销和库存的需求也在推动买方采用。反过来，第三方竞品资料指出实施周期长、企业级价格高、定制工作量大，对中型零售商也不够灵活。这给
              LEAFIO AI、Netstock 等模块化厂商，以及 ERP 模块和电子表格留下空间。因此，RELEX 更适合复杂度高、重视功能广度的客户；若买方更看重速度、模块化或成本，采用意愿就弱一些。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs: []
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
              - CM012
              - CM012
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 产品覆盖广是核心卖点
            body: 当买方想用一套规划平台统筹需求、供应、定价和促销，而非采购单点工具时，RELEX 最有竞争力。
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: 上线速度和总成本仍左右许多交易
            body: 市场青睐能快速证明价值、且总拥有成本可控的供应商。这给模块化厂商创造了机会，也限制了 RELEX 这类综合套件。
            calloutType: risk
            claimRefs:
