              - CU006
              - CU010
      - number: '6.3'
        title: 标杆客户实证、留存表现与核心盲区
        blocks:
          - type: paragraph
            body: >-
              具名部署是客户论据中最有力的一环。RELEX 公布了 Qualtia、Lowe's、Rossmann、Family Dollar、ICA Sweden、One Stop、Atria 和 Booths
              等客户的评价或案例。案例反复提到人工流程减少、决策改善，用户也称可视性更好、采用更容易，为产品市场契合度提供了有力证据。但公开资料没有队列留存、客户流失或头部客户集中度数据。客户基础确实存在，客户留存情况和收入集中度却仍不透明。
