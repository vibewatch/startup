          - type: callout
            title: 数据不透明仍是投资研判的核心症结
            body: 公开证据依然未能覆盖合并利润率、现金消耗与客户留存数据，因此其财务论证虽具可信度，却尚无法接受严密审计。
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
  - number: 5
    title: 产品与技术架构
    sections:
      - number: '5.1'
        title: 产品边界与客户工作流
        blocks:
          - type: paragraph
            body: >-
              RELEX 并非单点工具。其公开产品覆盖需求预测、补货、库存、定价、商品管理、生产计划、门店运营和劳动力规划。平台接入运营数据，帮助规划人员决定订什么、何时补货、如何定价，并协调不同渠道和地点的运营。2026
              年增长公告还提到 AI 辅助实施、智能体功能、生鲜与门店运营，以及更易扩展的 RELEX Open 层。现有证据显示，这是一款已投入实际使用且持续演进的产品，不是早期原型。
            claimRefs:
              - CE001
              - CE007
              - CE010
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE012
      - number: '5.2'
        title: 系统架构、部署方式与研发信号
        blocks:
          - type: paragraph
            body: >-
              RELEX 的架构更像受治理的企业平台，而非黑盒模型。AI 治理页面列出人工监督、模型无关设计、独立云服务、数据隔离和安全控制。API
              文档则提供销售、预测、订单、工作量预测、库存、交付和损耗等交易接口，显示平台需要接入大量数据并深入客户运营。招聘信息也显示，公司在招募云、Python、SQL、AI 集成、Kubernetes
              和可观测性人才，符合工程密集型产品团队的特征。内部技术栈并未公开，但外部资料显示其集成和运营体系相当复杂。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
      - number: '5.3'
        title: 差异化优势、信任背书与潜在缺口
        blocks:
          - type: paragraph
            body: >-
              RELEX 的差异化来自零售规划深度、AI 治理和可扩展的工作流。公司称其控制体系包括 ISO 27001 和 SOC 2 Type II，符合
              GDPR，并以监控中的安全运营支持快速响应。这对大型零售商和制造商很重要：他们不会在数据处理和控制保障不足时采用核心规划平台。问题不在于 RELEX
              是否有信任控制，而在于平台成熟度有多少已产品化、多少仍靠服务交付，以及可靠性、运行时间和 SLA 有多少公开记录。这些仍是尽调缺口。
            claimRefs:
              - CE002
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 产品覆盖全面且深嵌运营流程
            body: RELEX 提供的不只是看板，而是覆盖预测、补货、定价和门店运营的规划层，已嵌入实际业务流程。
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE007
          - type: callout
            title: 缺失拼图在于可靠性细节与外部验证深度
            body: 公开资料充分展示了治理和功能广度，却很少披露 SLA、历史运行时间和架构细节。
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 客户细分与应用场景
        blocks:
          - type: paragraph
            body: >-
              RELEX 面向大型零售商、杂货商、批发商、制造商以及消费品运营商销售方案。公开的客户案例清晰刻画了买方画像：这些机构拥有复杂的供应链体系、繁杂的 SKU
              与海量门店，具备降低损耗、缺货率与人工规划强度的迫切诉求。不同细分赛道的价值主张各有侧重：杂货与便利店客户往往最关注生鲜保质、货架可用性与损耗降低；制造商与批发商更侧重跨层级协同、预测精准度与全链路规划；专业零售与消费品客户则看重持续补货、促销规划与更严密的决策纪律。公司在地域分布上也展现出广泛的全球足迹，表明该平台经得起多元化区域需求模式的检验。
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU012
      - number: '6.2'
        title: 采纳轨迹与验证广度
        blocks:
          - type: paragraph
            body: >-
              虽然没有经审计的留存数据，采用信号仍然强劲。RELEX 称，2026 年上半年新签近 50 家客户；超过 250 家客户已在 RELEX 环境中使用 AI；ARR 增长已连续 76 个季度。Summit
              另称公司有 500+ 家客户和 600+
              个企业实施项目。这些不是同一口径，但共同显示公司仍在赢得新客户，且已有较大部署基础。官方客户评价、案例、客户视频和第三方评论也提供了广泛佐证。缺少的仍是留存、客户集中度和使用深度的分母数据。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
