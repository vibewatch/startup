  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              RELEX
              以订阅为主销售企业软件，通常也会收取实施、客户导入和支持费用。公开定价资料不是价目表，而是说明规划与定价优化软件如何提升收入、保护毛利并提高效率的商业案例。平台价值来自门店级预测、补货、定价和情景规划，并非简单按席位收费的
              SaaS。公开增长材料显示合同价值和 ARR 仍在增长，但没有披露清晰的收入构成、实际价格，或经常性收入与服务收入的比例。对投资者而言，关键在于 RELEX
              的模式需要前期实施投入，也保留后续扩模块的空间；它不是低接触、轻实施的 SMB SaaS。
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI007
      - number: '4.2'
        title: GTM 策略、销售效率与资本充裕度
        blocks:
          - type: paragraph
            body: >-
              RELEX 的销售由企业客户关系驱动。Summit Partners 将客户引荐、拓展北美和转向经常性 SaaS 列为持有期间创造价值的方式，这与企业直销加伙伴支持的模式相符。2026
              年增长公告称，北美是重要增长引擎，AI 辅助实施也在帮助公司更快转化需求。这有利于销售效率，却没有回答核心问题：增长要消耗多少现金？公开资料显示公司经历多轮融资、二级交易和 2025
              年债务融资，但没有披露合并现金余额或现金跑道。因此，现有证据说明公司获得了融资支持，却不能证明它已能自我造血。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI011
      - number: '4.3'
        title: 利润率路径、成本结构与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              利润率的核心问题是：RELEX 创造的价值中，多少来自软件毛利，多少要靠人力密集的实施和客户成功团队。公开资料没有量化毛利率、NRR
              或现金消耗，因此只能参考合同价值增长、员工规模与经验，以及产品对专业服务的需求来判断。不同私募市场资料对融资总额和估值的记录也不一致，说明其实际经济状况尚未被公开数据厘清。在管理层披露合并收入质量、利润率和现金使用情况之前，投资者应把
              RELEX 看作增长势头良好、但财务情况仍难以评估的资产。
            claimRefs:
              - CI006
