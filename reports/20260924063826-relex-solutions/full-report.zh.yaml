      - CI002
      - CI003
      - CI004
      - CI007
  - id: FE001
    title: 产品技术架构图
    type: stack
    summary: 展示从数据接入、规划引擎和治理控制到客户工作流的分层架构。
    approximationNotes: 该架构依据公开产品介绍、信任页面、API 文档和招聘信息推断，并非来自 RELEX 的内部技术文档。
    data:
      layers:
        - label: 客户数据与系统集成层
          detail: 依托 API 接口与定制实施工作，将客户的 ERP、POS、WMS、数据仓库及交易明细数据接入平台
        - label: 规划计算引擎
          detail: 需求预测、自动补货、库存管控、定价促销、品类企划及劳动力工时排班优化
        - label: AI 治理层
          detail: 人工介入监督、LLM 适配架构、租户数据物理隔离、严禁使用客户数据训练模型以及安全合规策略管控
        - label: RELEX Open / 智能体 AI
          detail: 具备标准化产品级智能体与客户自主编排工作流能力的高扩展性平台架构
        - label: 安全与合规层
          detail: ISO 27001、SOC 2 Type II、GDPR、24/7 全天候 SOC 监控及严格权限访问控制
        - label: 客户工作流与操作门户
          detail: 供业务一线与运营团队日常操作的计划员 UI、门户界面、数据报表及 API 接口
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE007
