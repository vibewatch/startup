        - 定价如何随着功能模块组合与用户账号数量的变化而调整？
      - - ERP / 电子表格维持现状
        - 制约因素
        - 长期持续
        - 在业务复杂度较低的场景下延缓了数字化现代化进程
        - 促成客户下定决心更换系统的最常见触发信号有哪些？
