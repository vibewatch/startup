      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 覆盖广是 RELEX 最有力的卖点
            body: 当买方需要一套规划系统覆盖需求、补货、定价、促销和劳动力规划，而不是只解决单一问题时，RELEX 最有吸引力。
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
          - type: callout
            title: 上线速度与采购价格成为冲击护城河的主要武器
            body: 市场持续奖赏交付更快或能够以更低 TCO 切入的厂商，因此 RELEX 必须拿出可衡量的 ROI 来捍卫自身的广度溢价。
            calloutType: risk
            claimRefs:
              - CP004
