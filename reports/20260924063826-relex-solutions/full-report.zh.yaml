        - 债权与股权投资者
        - 现金跑道与融资后盾
        - 中
        - 融资压力或估值重置
        - 中
        - 增长与现金纪律
        - 中
    notes: 该登记表同时纳入技术与商业依赖，因为 RELEX 推进业务执行二者缺一不可。严重等级主要取决于快速剥离或替换该依赖项的难度。
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 评估项
      - 结论值
      - 为何重要
      - 决策含义
      - 置信度信号
    rows:
      - - 投资建议
        - 观察
        - 资产质量较高，但价格与利润率披露仍不完整
        - 等待财务透明度改善或更具吸引力的估值水平
        - 中
      - - 风险评级
        - 中
        - 相比攸关生死的产品风险，执行不力与不透明性更为关键
        - 保持仓位规模纪律与跟踪监测节奏
        - 中
      - - 估值立场
        - 偏高
        - 公开估值数据集中在 $5B 中段区间
        - 追高支付溢价前，需看到商业化加速变现的证据
        - 中
      - - 置信度
        - 中
        - 增长证据扎实，但商业经济性数据仍不完整
        - 保持列入观察名单、等待重新评估的立场
        - 中
      - - 决策含义
        - 尚未达到买入标准
        - 利润率、流失率与现金使用仍存投资评估缺口
        - 在投入资本前寻求更充分的信息披露
        - 中
    notes: 本表依据现有公开证据给出投资立场，不是精确的 DCF 估值。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV012
  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 核心论点
      - 改变判断的触发条件
    rows:
      - - 投资逻辑：深厚的零售行业底蕴与扎实的客户标杆验证
        - 标杆客户群削弱或客户采用速度放缓会降低置信度
      - - 投资逻辑：2026 年增长势头依然强劲
        - 合同价值或订阅收入增长骤降将迅速对判断造成实质影响
      - - 投资逻辑：现有客群内部的 AI 使用度持续扩大
        - 若 AI 采用流于表面或主要由营销驱动，估值溢价将被压缩
      - - 反向逻辑：定价与实施交付压力
        - 同行若能证实具备更快的部署速度或更低的 TCO，将削弱投资逻辑
      - - 反向逻辑：利润率与现金数据披露缺失
        - 管理层若披露利润率、现金及留存率数据，将显著提升投资评估的确定性
    notes: 该表刻意呈现非对称结构：投资逻辑拥有较多正向经营证据支撑，而反向逻辑则集中于披露缺失与估值纪律。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 合同价值持续增长，AI 渗透率提升，利润率经营杠杆更加清晰
        - 估值倍数维持甚至扩张，因增长与客户留存表现强劲
        - 系统集成复杂度与专业服务拖累保持在可控范围内
        - 中等
      - - 基准情景
        - 收入增长保持稳健，但信息披露仍然有限
        - 当前估值区间大致合理，但整体依然偏高
        - 不透明的利润率与留存率数据导致折现率居高不下
        - 最高
      - - 悲观情景
        - 实施交付阻力增大、面临价格压力，或增购动能放缓
        - 估值倍数承压回落，因增长不足以抵消不透明度带来的折价
        - 同类套件或模块化专项工具凭借速度与更优 TCO 赢得竞争
        - 较高
      - - 上行触发条件
        - 公开利润率或现金披露改善，亦或增长重新加速
        - 更清晰透明的财务轮廓能支撑更具吸引力的入场价格
        - 更充分的披露未必改变业务本身，但会重塑估值预期
        - 视条件而定
      - - 下行触发条件
        - 出现客户流失、获客签单放缓或 AI 转化乏力的证据
        - 在基本面实质恶化前，估值大概率已先行下调
        - 执行阻力在订单签约或客户留存数据中显现
        - 视条件而定
      - - 持续监测触发条件
        - 新一轮融资、老股交易定价，或重大产品与客户信息披露
        - 可能重置盯市估值区间
        - 任何新增披露均应以当前的估值纪律为基准进行对标
        - 持续跟踪
    notes: 公开数据不足以支撑精确的 DCF 估值，因此情景分析只保留关键假设。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 六个节点串起公司创立、融资和近期经营进展，为公司概况提供时间脉络。
    data:
      items:
        - date: '2005'
          label: 于赫尔辛基创立
          description: RELEX 由 Mikko Kärkkäinen、Johanna Småros 与 Michael Falck 联合创立。
        - date: 2015-09
          label: Summit Partners 支持业务扩张
          description: RELEX 披露获得来自 Summit Partners 的 €20 million 投资，用以支持全球业务扩张。
        - date: 2019-02
          label: TCV 成长轮融资
          description: TCV 向 RELEX 投资 $200 million，标志着其迈入重要的后期融资阶段。
        - date: 2022-02
          label: Blackstone 领投的 €500M 融资轮
          description: RELEX 宣布完成按 €5 billion 估值进行的 €500 million 融资轮。
        - date: 2024-12
          label: Blackstone 与 TCV 增资
          description: Business Wire 报道称，Blackstone 与 TCV 增加了对 RELEX 的投资。
        - date: 2026-07
          label: H1 2026 创纪录增长
          description: RELEX 报告了 2026 年上半年创纪录的增长业绩、全新 AI 原生能力以及持续的客户签单突破。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO007
      - CO011
  - id: FM001
    title: 市场采用流程图
    type: flow
    summary: 概括零售规划市场的典型路径：从运营痛点出发，评估并采购规划套件，再验证投资回报。
    data:
      nodes:
        - id: n1
          label: 运营痛点
          description: 缺货、损耗变质、人工规划以及割裂分散的决策
        - id: n2
          label: 买方评估备选方案
          description: 供应链、品类企划及财务负责人对比综合套件与单点工具
        - id: n3
          label: 入围短名单
          description: RELEX、Blue Yonder、SAP IBP、o9、Kinaxis、LEAFIO、Netstock、电子表格
        - id: n4
          label: 实施交付
          description: 系统集成、数据清洗、工作流重塑及用户培训
        - id: n5
          label: 系统上线与日常使用
          description: 计划员操作、情景模拟推演、补货节奏调控及变革管理
        - id: n6
          label: 验证投资回报
          description: 减少损耗浪费、降低缺货率、提升毛利率与人效
      edges:
        - from: n1
          to: n2
