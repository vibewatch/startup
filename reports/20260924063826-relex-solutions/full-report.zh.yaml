    approximationNotes: X 轴 = 规划覆盖广度（得分越高代表覆盖功能越多）。Y 轴 = 价值实现用时 / 实施交付速度（得分越高代表部署落地越快）。得分为基于公开比对评测页面推导出的序数估计值。
