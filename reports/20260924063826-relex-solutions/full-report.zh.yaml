          label: 生鲜商超
          description: 货品在架率、损耗变质控制与自动补货工作流
        - id: manufacturing
          label: 制造加工
          description: 需求预测、原辅料供应与排产协同
        - id: wholesale
          label: 批发配送
          description: 履约服务水平、总仓库存优化与多渠道协同规划
        - id: specialty
          label: 专业专卖零售
          description: 品类企划组配、动态定价与促销活动规划
        - id: adoption
          label: 系统采纳推进
          description: AI 功能使用、落地实施交付与计划员实操培训
        - id: expansion
          label: 增购飞轮
          description: 拓展更多功能模块、接入更多网点站点、覆盖更多终端用户与沉淀更丰富数据
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 运营与外部依赖风险在当前风险全貌中占据主导，法律合规与监管风险目前看似可控，但仍需以扎实证据为凭，不可盲目假定不存在。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 极其严重
          values:
            - —
            - 大规模数据泄露
            - 系统性监管事件
        - label: 重大影响
          values:
            - —
            - 现金 / 跑道意外告急
            - 重大合规或数据违规事件
        - label: 高严重度
          values:
            - 诉讼与执法制裁
            - 实施交付失败 / 技术支持摩擦
            - 合作伙伴 / 云厂商依赖冲击
        - label: 中严重度
          values:
            - IP / 开源软件合规模糊
            - 人才与人力瓶颈
            - 产品复杂度与客户采用阻力
        - label: 低严重度
          values:
            - —
            - 次要文档疏漏
            - 局部功能体验抱怨
        - label: 提示信息
          values:
            - 细微文档缺漏
            - 供应商轻微摩擦
            - —
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR007
      - CR008
      - CR009
  - id: FV001
    title: 投资建议推导逻辑图
    type: flow
    summary: 投资建议沿着业务强劲增长与客户标杆验证出发，经过估值不透明度与市场竞争压力的权衡，最终得出列入观察而非立即买入的结论。
    data:
      nodes:
        - id: n1
          label: 强劲增长
          description: 合同价值、订阅收入及 AI 采用率持续攀升
        - id: n2
          label: 客户验证充分
          description: 具备知名客户实名部署案例与广泛的成功案例覆盖
        - id: n3
          label: 信息不透明
          description: 合并口径利润率、现金跑道和客户留存均无公开披露
        - id: n4
          label: 竞争格局
          description: 市场上仍有部署更快、价格更低的替代方案
        - id: n5
          label: 估值纪律
          description: 当前公开估值水平集中在 $5B 中段区间
        - id: n6
          label: 观察
          description: 等待更充分的信息披露或更优的入场时点
      edges:
        - from: n1
          to: n2
          label: 支持
        - from: n2
          to: n3
          label: 但是
        - from: n3
          to: n4
          label: 并且
        - from: n4
          to: n5
          label: 因此
        - from: n5
          to: n6
          label: 结论
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
      - CV012
