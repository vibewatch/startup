  - id: FI001
    title: 商业模式与收入演进路径图
    type: flow
    summary: 客户从提出业务痛点开始，经销售、实施和后续增购形成企业订阅收入；初期交付需要较多专业服务，系统上线后软件收入的经营杠杆才逐步显现。
    data:
      nodes:
        - id: n1
          label: 零售规划痛点
          description: 缺货、损耗、人工规划以及割裂分散的决策
        - id: n2
          label: 大客户销售签单
          description: 直销签约 / 合作伙伴引荐 / 高管支持推动
        - id: n3
          label: 实施交付
          description: 数据集成、系统配置、人员培训与变革管理
        - id: n4
          label: 订阅收入
          description: 按期收取的平台与功能模块订阅费
        - id: n5
          label: 增购扩张
          description: 增购新模块、拓展更多网点站点、增加用户数以及 AI 辅助快速推广
        - id: n6
          label: 毛利改善
          description: 随着实施服务工作量比重下降，纯软件的高毛利率优势逐步释放
      edges:
        - from: n1
          to: n2
          label: 需求催生
        - from: n2
          to: n3
          label: 成交通关
        - from: n3
          to: n4
          label: 成功上线
        - from: n4
          to: n5
          label: 增购扩容
        - from: n5
          to: n6
          label: 杠杆释放
