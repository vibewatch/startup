      - - 实施周期冗长
        - 制约因素
        - 长期持续
        - 在高度注重上线速度时，更有利于模块化或轻量单点工具
        - 按不同细分行业划分，系统平均上线周期（Time-to-Live）中位数是多少？
      - - 企业级定价 / 高昂 TCO
        - 制约因素
