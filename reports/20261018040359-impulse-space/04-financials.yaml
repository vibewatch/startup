    severity: material
    topic: recognized-revenue
    missingEvidence: Recognized revenue by quarter or year, segmented by Mira, Helios, Caravan, and government programs, plus the revenue-recognition policy for multi-mission or milestone contracts.
    whyItMatters: Backlog and bookings do not show whether revenue is recurring, concentrated, delayed, or already delivered.
    diligencePath: Request a revenue bridge from bookings and backlog to recognized revenue, with top-customer concentration and delivery schedule.
