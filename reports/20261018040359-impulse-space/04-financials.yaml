- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue / ARR
    - null
    - low
    - Revenue quality cannot be underwritten without a delivered-sales base.
    - Provide recognized revenue by year/quarter and identify any recurring versus mission revenue.
  - - Contracted backlog
    - ~$200M across 30+ contracts
    - medium
    - Shows demand coverage, but bookings are not cash receipts or GAAP revenue.
    - Break backlog into firm, option, and contingent components with expected delivery timing.
  - - Mira service readiness
    - 3 flown missions; 12-month lead time
    - medium
    - Indicates near-term monetization path for the already-flown vehicle family.
    - Provide average mission value, gross margin, and repeat-customer rate for Mira work.
  - - Helios commercialization gate
    - First Helios-linked flights targeted for H1 2027; Caravan 1 closed, Caravan 2 waitlisted, Caravan 3 booked
    - medium
    - Most upside sits behind a first-flight milestone that affects revenue timing.
    - Provide qualification milestones, cash burn through first flight, and backlog conversion assumptions.
  - - Gross margin by vehicle family
    - null
    - low
    - Hardware-plus-services businesses can look attractive on backlog while still hiding weak mission economics.
    - Provide unit cost, launch pass-through, propulsion/test overhead, and contribution margin by product line.
  - - Cash burn / runway / debt
    - null
    - low
    - Capital adequacy cannot be judged from fundraising alone.
    - Provide cash on hand, monthly burn, debt/project-finance obligations, and runway under base and delayed-Helios cases.
  - - Latest valuation
    - $5.4B to ~$5.6B public markers for the September 2026 extension
    - medium
    - Sets financing context, but discrepancy shows that public market-intel sources are not primary financing documents.
    - Provide signed financing terms, share price, liquidation preferences, and post-money cap table.
  - - Use of proceeds
    - Hiring, manufacturing, and vehicle build-out
    - medium
    - Explains why capital needs remain high even after large fundraising rounds.
    - Provide plant/tooling capex plan, hiring plan, and milestones required before additional external financing.
  notes: Null means the metric is not publicly disclosed in the assigned pool, not zero; every null requires management diligence.
