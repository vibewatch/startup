  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, runway under base and delayed-Helios scenarios, plus any debt, project-finance, or covenant obligations.
    whyItMatters: Fundraising history is not a substitute for liquidity analysis, especially for a hardware company scaling manufacturing before major new vehicle flights.
    diligencePath: Request the latest board package or finance deck showing cash, burn, runway, debt, and downside-case financing triggers.
