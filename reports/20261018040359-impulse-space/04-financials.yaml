chapter:
  number: 4
  title: Financials
  summary: Impulse Space has credible demand signals across commercial rideshares and U.S. government programs, but the public record still describes backlog, bookings, and contract awards much more clearly than recognized revenue or margins. The 2026 funding step-up bought manufacturing time, yet absent cash, burn, and gross-margin disclosure means underwriting still hinges on Helios qualification and conversion of demand into repeatable flown missions.
sections:
- id: revenue-model-and-demand
  title: Revenue model and visible demand
  body: |-
    Impulse’s monetization story already looks broader than a single bespoke mission shop. Public materials describe four revenue buckets: dedicated Mira transfer and hosting work, dedicated Helios high-energy delivery, the Caravan GEO rideshare program, and U.S. national-security mission work. That mix matters because it gives the company multiple ways to monetize the same underlying mobility stack, but the public record still measures traction with backlog, bookings, lead times, and contract awards rather than recognized revenue.

    The strongest positive read is demand diversity. VentureAtlas says Mira is already bookable with a 12-month lead time and cites roughly $200 million of backlog across 30-plus contracts, while Payload says Caravan 2 and 3 were sold out for 2028. SatNews and VentureAtlas also show the government side is no longer speculative, with cumulative Space Force SBIR work reaching $90.8 million after the August 2026 extension. What remains missing is the bridge from those demand markers to booked-versus-delivered mission cadence, revenue recognition timing, and customer concentration.
  claimRefs:
  - CI001
  - CI004
  - CI005
  - CI011
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-and-unit-economics
  title: Cost structure and public unit-economics evidence
  body: |-
    The public margin story is logical but still mostly theoretical. Official and independent sources describe Helios as a schedule-compression product that can move payloads from LEO to GEO in less than a day, and one independent source describes payload deployment about eight hours after launch. That speed can justify premium pricing if customers value earlier service start, faster deployment, or responsive-space timelines. Mira’s flown heritage also supports service credibility in a way many orbital-logistics startups cannot yet claim.

    The counterweight is cost intensity. Independent analysis and company interviews describe a vertically integrated manufacturing and propulsion model with in-house testing, facilities expansion, and repeated vehicle qualification. That operating model can create product differentiation, but it also front-loads labor, tooling, test-stand, and quality-system expense before revenue maturity is visible in public filings. Because the assigned sources disclose neither realized pricing nor gross margin, every public unit-economics judgment remains a proxy rather than an underwriting-grade metric.
  claimRefs:
  - CI002
  - CI003
  - CI009
  - CI011
  - CI012
  tableRefs:
  - TI003
- id: capital-adequacy-and-verdict
  title: Capital adequacy, financing dependency, and verdict
  body: |-
    The 2026 capital raise materially improved financial flexibility: public sources show a $500 million Series D in June and a $308 million extension in September, taking disclosed funding above $1.3 billion. Management and independent coverage both tie that money to hiring, manufacturing, and vehicle build-out. That is directionally constructive because Helios, Caravan, and national-security programs all require hardware throughput rather than pure software scaling.

    Even so, the financing case is still incomplete. Public valuation markers differ between roughly $5.4 billion and $5.6 billion, which is acceptable noise for market intel but not enough to underwrite cap-table economics, liquidation preferences, or true round terms. More importantly, no public source in the assigned pool discloses cash on hand, monthly burn, runway, debt, project-finance obligations, or gross margin by vehicle family. Financially, that leaves one practical conclusion: the company has strong access to capital and visible demand, but underwriting still depends on Helios hitting its 2027 qualification window and on backlog converting into repeatable, margin-bearing missions rather than remaining a forward-looking booking story.
  claimRefs:
  - CI006
  - CI007
  - CI010
  - CI012
  - CI013
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value/status
  - Quality
  - Diligence ask
  rows:
  - - Mira dedicated missions
    - Last-mile delivery, hosted payload operations, and on-orbit maneuvering sold as dedicated Mira services.
    - Per mission / hosted payload
    - Three Mira missions flown; VentureAtlas says Mira is bookable with a 12-month lead time.
    - Best publicly evidenced current service line because it already has flight heritage.
    - Need signed contract values, repeat-customer mix, and delivered-mission revenue recognition.
  - - Helios dedicated transfer
    - Dedicated high-energy transfer from a medium-lift launch insertion to higher-energy destinations.
    - Per mission
    - SES, Astranis, and Infinite Orbits agreements are cited publicly; first Helios-linked flights are targeted for H1 2027.
    - Large upside, but still pre-flight and therefore pre-proof on revenue quality.
    - Need milestone-payment schedule, acceptance criteria, and first-flight revenue timing.
  - - Caravan GEO rideshare
    - Aggregated payload slots on Falcon 9 plus Helios missions for shared GEO access.
    - Per rideshare slot / payload port
    - Caravan 1 is closed; Caravan 2 is waitlisted; Caravan 3 is booked for 2028.
    - Strong demand signal, but public evidence stops at bookings rather than delivered economics.
    - Need slot pricing, payload mix, cancellation exposure, and launch insurance assumptions.
  - - National-security missions
    - Vehicle delivery and responsive-space mission work for U.S. Space Force programs.
    - Per contract / task order
    - Public sources cite a $28M August 2026 extension and $90.8M cumulative SBIR vehicle value.
    - Contract-backed demand can smooth commercialization risk, but contract value is not recognized revenue.
    - Need revenue-recognition schedule, margin by task order, and customer concentration by program.
  notes: Public sources reveal monetization categories and some contracted values, but not revenue-recognition policy or realized pricing.
