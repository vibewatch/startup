  title: Revenue model bridge
  type: flow
  summary: Public evidence shows how post-launch mobility demand turns into mission, rideshare, and contract revenue signals, but not into disclosed realized margins.
  data:
    nodes:
    - id: n1
      label: Customer mission needs post-launch mobility
      value: Commercial, civil, and government payloads need delivery, hosting, or repositioning after launch.
    - id: n2
      label: Medium-lift launch provides initial orbit
      value: Impulse is positioned after launch rather than as the launch provider.
    - id: n3
      label: Mira or Helios performs the transfer
      value: Mira serves hosting and maneuvering; Helios is the high-energy transfer stage.
    - id: n4
      label: Dedicated mission or Caravan rideshare is sold
      value: Customers buy a dedicated service or a shared GEO slot rather than raw propulsion hardware.
    - id: n5
      label: Target orbit or hosted mission is achieved rapidly
      value: Official and independent sources describe GEO access in under a day and some missions in roughly eight hours.
    - id: n6
      label: Revenue appears as mission fees, rideshare bookings, or contract awards
      value: Public disclosure shows backlog, bookings, and contract value more clearly than realized pricing or gross profit.
    edges:
    - from: n1
      to: n2
      label: payload launched
    - from: n2
      to: n3
      label: handoff to in-space mobility
    - from: n3
      to: n4
      label: service packaged
