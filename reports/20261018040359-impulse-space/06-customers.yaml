figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public proof shows a path from mission need to follow-on expansion, but the strongest expansion nodes remain forward booked rather than already repeated.
    data:
      items:
        - label: Orbit-access problem identified
          actor: Commercial operator, civil agency, or defense mission owner
          phase: Need discovery
          touchpoints:
            - Need faster, cheaper, or more maneuverable post-launch mobility
            - Segment mix spans commercial, civil, and defense demand
        - label: Program award or booking
          actor: NASA, SSC, SES, Infinite Orbits, hosted-payload users
          phase: Initial commitment
          touchpoints:
            - NASA awards studies
            - SSC extends TacRS work
            - SES and Caravan counterparties book future Helios capacity
        - label: Mission design and integration
          actor: Impulse mission team plus payload customer
          phase: Preflight execution
          touchpoints:
            - Dedicated Mira missions or Helios transfer planning
            - Payload hosting and integration for specific use cases
        - label: On-orbit service delivery
          actor: Mira or future Helios mission user
          phase: Delivery
          touchpoints:
            - Flown Mira customer missions provide actual deployment proof
            - Government demonstrations and GEO transfers still depend on mission execution
        - label: Follow-on booking and scope expansion
          actor: Repeat or adjacent buyers
          phase: Expansion
          touchpoints:
            - Additional SALO missions and booked Caravan manifests suggest expansion paths
            - Dedicated and rideshare offerings widen buyer fit across mission classes
        - label: Durability test still missing
          actor: Investor or diligence team
          phase: Retention validation
          touchpoints:
            - No public NRR, GRR, churn, or renewal-rate disclosure
            - No public revenue concentration split by customer or mission class
    claimRefs:
      - CU002
