        - Procurement-backed demand and credibility for mission assurance
        - No disclosure of recompete rates, margins, or concentration share
      - - Civil space
        - NASA / mission planners / government payer
        - OTV studies for hard-to-reach destinations
        - Two VADR study awards
        - Validates relevance to civil mission planning
        - Study award is not the same as recurring flight-service revenue
      - - Commercial GEO operators
        - SES, Infinite Orbits, other GEO-access buyers / satellite operators / commercial payer
        - Dedicated Helios missions and Caravan rideshare
        - Dedicated SES mission planned for 2027; Caravan manifest publicly booked
        - Potentially larger payload classes and repeatable mission cadence
        - Helios is still preflight and contract values are undisclosed
      - - Hosted payload / deployment users
        - HEO, an undisclosed LEO Express-1 customer, and smaller payload users / payload operators / mixed payers
        - Payload hosting, deployment, inspection, and maneuvering in LEO
        - Flown Mira customer missions plus named hosted-payload participation
        - Demonstrates actual operational usage beyond paper studies
        - Customer names, pricing, and repeat purchase rates are only partially public
    notes: Public segmentation is assembled from announced awards, mission bookings, and named mission participants; null-style gaps indicate missing public commercial denominators rather than absence of customers.
