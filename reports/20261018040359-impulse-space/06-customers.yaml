  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - NASA
        - Civil agency
        - Two orbital transfer vehicle service studies under VADR
        - Study / predeployment
        - Formal agency selection validates mission-planning relevance
        - Does not yet prove recurring operational service or revenue
      - - U.S. Space Force / SSC
        - Government / defense
        - VICTUS SALO 2 and 3 Mira vehicles for TacRS missions
        - Contracted operational demonstrations
        - Procurement-backed extension shows expansion inside defense work
        - Public evidence does not show mission completion or post-demo follow-on rates
      - - SES
        - Commercial satellite operator
        - Dedicated Helios transfer of a 4-ton-class payload to GEO
        - Booked future mission
        - Described as the first commercial contract for a dedicated Helios mission
        - Helios has not yet flown, so delivery proof is still pending
      - - Infinite Orbits / Caravan manifest
        - Commercial rideshare buyer
        - Multi-launch GEO rideshare beginning in 2027
        - Booked future service
        - Supports the claim that Caravan demand is commercially real
        - Payload count, value, and renewal behavior are undisclosed
    notes: This is a partial sample of named proof from assigned sources, not an exhaustive customer ledger; rows separate study awards, contracted demos, and future bookings so logos are not overstated as deployed production revenue.
