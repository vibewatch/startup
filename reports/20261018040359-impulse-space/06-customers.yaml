company:
  name: Impulse Space
chapter:
  number: 6
  title: Customers
  summary: Impulse Space has materially stronger public customer proof than most private space-infrastructure companies, but that proof is concentrated in contract awards, booked missions, and government studies rather than disclosed renewals or realized recurring revenue. Named counterparties span NASA, the U.S. Space Force, satellite operators, and hosted-payload users, while Helios execution still gates the biggest commercial expansion claims.
sections:
  - id: segment-mix-and-demand
    title: Segment mix and current demand proof
    body: Impulse’s public customer evidence spans three distinct motions. First, government and civil buyers validate the product through study awards and operationally framed missions, with NASA selecting the company for two orbital transfer vehicle studies and Space Systems Command extending tactically responsive space work. Second, commercial satellite operators appear in dedicated Helios and Caravan bookings, including SES and Infinite Orbits. Third, hosted-payload and deployment users show up on Mira missions through HEO, an undisclosed LEO Express-1 primary payload, and other smaller mission participants. The result is breadth across buyer types, but most public proof still describes bookings, studies, and announced contracts rather than disclosed long-term usage metrics.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001
  - id: named-proof-and-trajectory
    title: Named customer proof and adoption trajectory
    body: The strongest named customer proof is not just logo-level. NASA’s award and the Space Force extensions are procurement-backed signals that a real buyer evaluated Impulse’s mobility proposition, while SES and Infinite Orbits indicate that commercial GEO-access customers are willing to book future Helios capacity before first flight. Mira also has more than pure prelaunch marketing proof because public sources describe flown customer missions and hosted-payload work on LEO Express missions. Even so, the trajectory remains uneven by program. NASA is still at study stage, national-security work is mission specific, and Helios expansion depends on future execution rather than already completed commercial service.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU001
  - id: durability-and-concentration-gaps
    title: Durability, expansion, and concentration remain the weakest public proofs
    body: Public evidence supports a land-and-expand story, but it does not yet support a durability story. The backlog disclosure, booked Caravan manifests, and repeat government extensions imply demand, yet the assigned sources do not publish NRR, GRR, churn, renewal rates, contract length distributions, or any cohort view that would show whether early missions convert into recurring business. Concentration is also still opaque. The customer set appears diversified across government, civil, and commercial categories, but there is no public revenue-share split by customer, mission class, or channel. Helios timing makes that opacity more important because the largest commercial expansion opportunities are still forward booked rather than fully delivered.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
callouts:
  - calloutType: strength
    title: Public customer proof is broad for a private space startup
    body: Named proof spans NASA, the U.S. Space Force, SES, Infinite Orbits, Orbit Fab, Vast, HEO, and other payload or infrastructure counterparties rather than a single anchor logo.
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
  - calloutType: risk
    title: Durability is still inferred, not measured
    body: The public record shows awards, bookings, and backlog, but it does not disclose retention, renewals, or customer concentration by revenue, so durability still depends on diligence beyond public sources.
    claimRefs:
      - CU001
      - CU010
      - CU011
      - CU012
tables:
