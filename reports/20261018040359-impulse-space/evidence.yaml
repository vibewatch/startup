evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Recognized revenue, gross margin, bookings-to-revenue conversion, cash burn, and cash balance.
    whyItMatters: >-
      Later chapters cannot translate backlog, hiring, and valuation narratives into operating durability without core
      financial disclosure.
    diligencePath: Request the latest board deck, monthly management accounts, backlog conversion schedule, and cash runway analysis.
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Primary documentation for the September 2026 extension valuation and any liquidation preferences, ratchets, or
      share-price terms.
    whyItMatters: >-
      Public secondaries disagree on the extension valuation, and financing terms can change downside protection even if
      the headline valuation is accurate.
    diligencePath: Request the term sheet, financing summary, cap table, and board approvals for the extension.
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table
    missingEvidence: A complete executive roster, full board composition, committee structure, and functional reporting lines.
    whyItMatters: >-
      The assigned pool identifies several leaders, but not enough to fully assess governance depth or succession
      resilience.
    diligencePath: Request the current org chart, executive bios, board roster, and governance materials.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      A full cap table, ownership percentages, customer concentration, and backlog split across commercial, civil, and
      defense programs.
    whyItMatters: >-
      Publicly named investors and government stakeholders show signal, but not control rights, concentration risk, or
      revenue dependence.
    diligencePath: Request the cap table, investor-rights summary, top-customer list, and backlog waterfall by customer and program.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A third-party bottom-up estimate of annual orbital-mobility spend by segment, geography, and orbit class.
    whyItMatters: >-
      Without a disclosed denominator, valuation and market-share arguments risk leaning on financing momentum rather
      than actual service demand.
    diligencePath: >-
      Request brokered pipeline data, public-procurement totals, and customer mission budgets that separate launch from
      post-launch transfer spend.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-budget-ownership
    missingEvidence: Contract-level pricing, budget owners, and repeat-purchase behavior by commercial, civil, and defense segment.
    whyItMatters: >-
      Adoption timing depends on who actually controls budget authority and whether the service replaces another line
      item or creates a new one.
    diligencePath: >-
      Ask management for anonymized customer cohorts, average contract values, and examples of which budget line funded
      each mission type.
  - type: missing-source
    severity: minor
    topic: segment-conversion
    missingEvidence: >-
      Public conversion data showing how many announced studies, partnerships, or MOUs turn into revenue-bearing
      transfer missions.
    whyItMatters: Announced pipeline breadth is less useful if it does not convert into recurring orbital-mobility revenue.
    diligencePath: >-
      Track announced counterparties across later mission manifests, procurement awards, and launch calendars to
      distinguish pilots from recurring demand.
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public price sheets, contract economics, discounting, or seat-level pricing for Mira, Helios, Caravan, and the
      main substitute routes.
    whyItMatters: >-
      Without apples-to-apples pricing, the chapter can compare packaging and speed claims but not prove which route
      wins on fully loaded mission economics.
    diligencePath: >-
      Obtain customer contracts, procurement records, or management commentary with quoted pricing and mission scope for
      at least one dedicated and one rideshare sale.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss-and-renewal
    missingEvidence: Competitive win-loss data, renewal behavior, and customer concentration by mission class.
    whyItMatters: >-
      Traction headlines show bookings, but they do not reveal whether customers are renewing because Impulse is
      structurally better than substitutes or because the category still lacks enough supply.
    diligencePath: >-
      Request cohort bookings, repeat-customer counts, and examples where buyers chose Impulse over direct injection,
      electric transfer, or internal build.
  - type: missing-source
    severity: material
    topic: direct-peer-benchmarks
    missingEvidence: Comparable public data on funding, realized mission cadence, and flight history for named direct OTV peers.
    whyItMatters: >-
      The retained pool proves the field is crowded, but not which rival has the best cost, cadence, or reliability
      trajectory relative to Mira and Helios.
    diligencePath: >-
      Gather primary or independent profiles for the named tug products and build a like-for-like benchmark on missions
      flown, payload class, and announced backlog.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: >-
      Recognized revenue by quarter or year, segmented by Mira, Helios, Caravan, and government programs, plus the
      revenue-recognition policy for multi-mission or milestone contracts.
    whyItMatters: Backlog and bookings do not show whether revenue is recurring, concentrated, delayed, or already delivered.
    diligencePath: >-
      Request a revenue bridge from bookings and backlog to recognized revenue, with top-customer concentration and
      delivery schedule.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Cash on hand, monthly burn, runway under base and delayed-Helios scenarios, plus any debt, project-finance, or
      covenant obligations.
    whyItMatters: >-
      Fundraising history is not a substitute for liquidity analysis, especially for a hardware company scaling
      manufacturing before major new vehicle flights.
    diligencePath: >-
      Request the latest board package or finance deck showing cash, burn, runway, debt, and downside-case financing
      triggers.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, contribution margin, launch pass-through cost, and support overhead by Mira missions, Helios
      missions, Caravan slots, and government programs.
    whyItMatters: >-
      Without unit economics, it is impossible to distinguish attractive booked demand from low-margin custom work or
      capital-consuming launch brokerage.
    diligencePath: >-
      Request product-line P&Ls or mission economics by vehicle family, including assumptions for launch procurement and
      refurbishment/test cost.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: minor
    topic: valuation-terms
    missingEvidence: >-
      Primary financing documents that reconcile the public $5.4 billion versus ~$5.6 billion extension valuation
      markers and disclose share price and preference stack.
    whyItMatters: >-
      The discrepancy is not fatal for chapter analysis, but it prevents precise underwriting of dilution, preferred
      terms, and future financing headroom.
    diligencePath: Obtain the September 2026 financing documents or an audited cap-table summary from management.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Independent evidence for cyber, safety, quality, or mission-assurance frameworks beyond the SatNews mention of
      Type 1 cryptographic links.
    whyItMatters: >-
      Product diligence cannot distinguish tactical-link security from broader software assurance, fault management, or
      customer-facing reliability controls.
    diligencePath: >-
      Request customer security packages, fault-management documentation, third-party audits, and any mission-assurance
      or export-control review artifacts for Mira and Helios.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: >-
      Mission-success rates, burn success by vehicle version, anomaly counts, and recovery procedures across LEO Express
      flights and government missions.
    whyItMatters: >-
      A mobility business lives or dies on precise maneuver execution, so qualitative mission press alone is not enough
      to underwrite repeatability.
    diligencePath: >-
      Ask management for mission postmortems, vehicle-by-vehicle burn statistics, propellant-margin data, and root-cause
      / corrective-action summaries for disclosed anomalies.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: roadmap-readiness
    missingEvidence: >-
      Helios engine qualification status, Electra performance data, customer integration lead times, and commercial
      service-level commitments for Caravan.
    whyItMatters: >-
      The upside case depends on unflown hardware and a service model that is not yet proven through disclosed
      launch-to-delivery execution.
    diligencePath: >-
      Obtain Helios and Electra qualification plans, test results, launch manifests, customer contracts, and
      payload-integration readiness reviews.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: retention-and-concentration-gaps
    missingEvidence: >-
      Public or diligence-room metrics on NRR, GRR, churn, renewal rates, contract lengths, and customer concentration
      by revenue or backlog.
    whyItMatters: >-
      Without durability and concentration denominators, public customer proof overstates visibility into revenue
      quality and repeatability.
    diligencePath: >-
      Request cohort retention, renewal, and top-customer exposure by revenue and backlog for 2024-2026, split across
      government, civil, dedicated commercial, and Caravan programs.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: A quantified breakdown of revenue, backlog, and pipeline by top customers, mission class, and channel.
    whyItMatters: >-
      Government awards and a few named commercial bookings could still mask high concentration risk if one or two
      programs dominate economics.
    diligencePath: >-
