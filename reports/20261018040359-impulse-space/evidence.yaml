      Helios is a high-energy kick stage built to rapidly deliver payloads to MEO, GEO, and beyond. It can lift over 5
      tons from LEO to GEO in less than 24 hours. By pairing a standard medium-lift rocket with access to higher-energy
      orbits, Helios offers significant cost savings compared to traditional GEO launches.
