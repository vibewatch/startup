      - helios
    keyQuote: >-
      Helios remains the highest-stakes technical step in the company’s profile. Mira has flown, but Helios must prove
      high-energy delivery with larger payloads, higher propellant mass, a larger engine, and demanding mission
      timelines. Its success would give Impulse a more differentiated position in the market, because high-energy
      same-day delivery is more difficult to replicate than basic payload deployment in low Earth orbit. Its delay or
      underperformance would keep the company more dependent on Mira-based services and smaller mission classes.
    canonical: SO009
