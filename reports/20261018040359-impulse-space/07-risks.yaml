schemaVersion: report-v2
artifact: risks
slug: impulse-space
runDate: 2026-10-18
company:
  name: Impulse Space
chapter:
  number: 7
  title: Risks
  summary: >-
    Impulse Space's dominant risk is concentrated Helios execution: one unflown
    cryogenic transfer stage now gates 2027 commercial, defense, and GEO proof
    points after public timelines already moved out. Demand and government
    traction are real, but revenue conversion, customer concentration, and
    compliance readiness remain opaque enough that underwriting should stay
    milestone-led rather than valuation-led.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The highest-severity risk is Helios concentration, not generic startup
      uncertainty. Public sources still place Helios in development, and the
      same first-flight window now underpins Caravan 1, VICTUS SURGO, and other
      2027 proof points. That matters because public timelines have already
      moved outward from earlier 2026 framing, while disclosed funding and
      valuation have continued to rise. The result is a company with credible
      demand signals but a narrow path to proving that backlog, rideshare
      bookings, and defense awards can convert into repeatable in-space
      transport revenue at the pace implied by its latest financing.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007
      - CR008
      - CR009
      - CR013
    figureRefs:
      - FR001
  - id: regulatory-and-institutional-risk
    title: Regulatory and institutional risk
    body: >-
      The public evidence supports real institutional demand, but it does not
      close the compliance case. NASA selected Impulse for orbital-transfer
      studies and Space Force work has expanded materially, yet those proofs are
      not the same as published mission-approval packages, debris-mitigation
      sign-offs, export-control controls, or enterprise security attestations.
      The risk register should therefore treat regulatory and customer-safety
      readiness as live diligence work. That is especially important because the
      company's public positioning emphasizes rendezvous, proximity operations,
      and national-security use cases, all of which raise the cost of any
      approval or assurance failure.
    claimRefs:
      - CR005
      - CR006
      - CR012
      - CR013
    tableRefs:
      - TR001
  - id: operational-and-counterparty-execution
    title: Operational and counterparty execution
    body: >-
      Mira materially lowers technical skepticism because it has flown three
      missions, but the public operating record is not clean enough to treat
      execution as solved. Independent reporting notes that a LEO Express 3
      issue raised propellant consumption and prevented main-thruster burns,
      which is exactly the kind of precision-operations problem that matters for
      a mobility provider selling maneuvering reliability rather than launch
      only. At the same time, the transfer model adds interfaces, schedules, and
      failure points, while launch and customer proof remain concentrated in a
      relatively short list of programs, launch partners, and anchor customers.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR010
      - CR011
      - CR013
    tableRefs:
      - TR002
      - TR003
  - id: monitoring-and-kill-criteria
    title: Monitoring and kill criteria
    body: >-
      The cleanest thesis-break triggers are monitorable. If Helios slips beyond
      first-half 2027 again, the market should assume pressure on Caravan
      conversion, defense timelines, and customer confidence at the same time.
      If another flight anomaly shows weak sensor reliability or propellant
      margins, repeatability risk rises even if one mission still closes.
      Financially, public evidence is not yet strong enough to treat backlog as
      a proxy for recognized revenue, so management should be asked to prove
      conversion, burn absorption, and customer concentration before investors
      underwrite the current valuation as durable rather than aspirational.
    claimRefs:
      - CR002
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR013
