    title: Helios is the thesis bottleneck
    body: >-
      One unflown vehicle now sits in front of the company's most important
      2027 commercial, defense, and GEO proof points, so the risk is correlated
      rather than diversified.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR009
  - calloutType: assumption
    title: Do not treat backlog as recognized revenue
    body: >-
