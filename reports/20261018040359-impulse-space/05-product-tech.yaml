  - calloutType: "strength"
    title: "Mira has crossed the slideware threshold"
    body: "Three Mira missions, a public close-flyby campaign, NASA study selection, and repeat Space Force procurement give Impulse unusually strong public maturity evidence for a private orbital-mobility startup."
    claimRefs: ["CE007", "CE008", "CE009"]
  - calloutType: "risk"
    title: "The moat still depends on unflown hardware"
    body: "Helios is central to the fast-GEO thesis but remains preflight in the retained evidence; Electra is only an announced electric-propulsion offering, and even Mira’s flown program has disclosed a star-tracker issue that blocked main-thruster burns on one mission."
    claimRefs: ["CE004", "CE010", "CE013"]
  - calloutType: "insight"
    title: "Impulse is building a layered mobility stack, not a single vehicle"
    body: "The public architecture separates agile chemical maneuvering from high-energy kick-stage delivery, while the newly announced electric-propulsion offering remains insufficiently specified; the strategy is coherent but execution-heavy because the disclosed layers are internally coupled."
    claimRefs: ["CE003", "CE004", "CE011"]
