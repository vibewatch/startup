      - ["Responsive surveillance / SDA mission hosting", "Government payloads need maneuverable observation platforms instead of fixed orbits", "Mira hosts government optical or surveillance payloads for SALO and related missions", "Repeat Space Force procurement suggests operational utility beyond a one-off demo", "Government mission cadence is visible, but public service-level metrics are not"]
      - ["Rapid GEO / higher-energy delivery", "Electric transfer can take months and ties up customer assets", "Helios aims to move payloads from LEO to GEO and beyond in under a day", "Same-day or sub-day transfer is the core differentiation claim", "Helios has not yet flown, so the timing benefit is still preflight evidence"]
      - ["Close-proximity operations / inspection support", "Operators need a maneuverable platform for flybys, hosting, or future servicing-style tasks", "Mira has already supported rendezvous-proximity demonstrations and close flybys", "Three flights plus two proximity campaigns provide stronger maturity proof than a slideware-only startup", "Public sources do not quantify repeatability, anomaly rates, or customer renewal behavior"]
