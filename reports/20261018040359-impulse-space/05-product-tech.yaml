  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Saiph chemical propulsion on Mira", "Provides high-thrust maneuvering for hosting, deployment, and responsive mission changes", "Impulse must keep thruster performance, propellant management, and burn execution reliable across mission variants", "Flight anomalies or propellant overruns directly reduce delivered mission flexibility"]
      - ["Mira avionics, GNC, and pointing stack", "Enables autonomous guidance, rapid burns, and precise hosted-payload operations", "Depends on star trackers, reaction wheels, software tuning, and power-positive commissioning", "LEO Express 3 showed sensor-noise issues can block main-thruster burns even when the vehicle reaches orbit"]
      - ["Secure tactical mission layer", "Supports classified or government payload command and control", "Public signal is currently limited to SatNews reporting on NSA Type 1 cryptographic links", "Assigned sources do not prove broader cyber, safety, or compliance frameworks"]
      - ["Deneb-powered Helios stage", "Moves payloads from LEO to GEO, cislunar, and other high-energy destinations", "Requires engine qualification, launch-partner coordination, and customer payload integration at larger mission scale", "The biggest moat claim also carries the biggest schedule and technical dependency because Helios is still preflight"]
      - ["Mission operations and internal build footprint", "Redondo integration plus Colorado, Mojave, and software/test activity support scaling the mobility fleet", "Execution depends on in-house vertical integration across engines, structures, avionics, and operations", "Vertical integration can accelerate learning but concentrates manufacturing and staffing risk inside the company"]
    notes: "Rows intentionally mix current and planned architecture because the chapter’s underwriting question is not just what exists today, but which dependencies must work for Impulse’s next product step to clear."
    claimRefs: ["CE005", "CE006", "CE010", "CE011", "CE013"]
