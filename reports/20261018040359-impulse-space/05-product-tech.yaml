company:
  name: "Impulse Space"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Impulse Space delivers post-launch orbital mobility rather than launch itself: Mira is the flight-proven product, while Helios is the planned high-energy extension and Electra is only a newly announced electric-propulsion offering in the retained evidence. Public proof is stronger than for many mobility startups because Mira has flown three missions and won repeat U.S. Space Force work, but the chapter still turns on upgraded-Mira reliability and execution of Helios's planned 2027 commercial mission."
sections:
  - id: "product-scope"
    title: "What the product actually delivers"
    body: |-
      Impulse Space is not selling rockets; it is selling what happens after launch. Across official and independent descriptions, the product is an in-space mobility layer that hosts payloads, deploys them, changes orbits, and eventually pushes customers from LEO to GEO, cislunar, and other higher-energy destinations. The current commercial logic is straightforward: a launcher gets the payload into a starting orbit, then Impulse uses Mira for agile delivery and hosting or, later, Helios for fast high-energy transfer.

      That framing matters because it makes the workflow legible in customer terms. Civil and commercial users buy final-orbit delivery, payload hosting, inspection support, or responsive repositioning rather than a generic “spacecraft platform,” while defense buyers use the same mobility surface for space-domain-awareness and tactically responsive missions. The product map is therefore coherent, but it is still uneven in maturity: Mira is operational evidence, Helios is a planned scale-up, and the retained evidence identifies Electra only as a newly introduced electric-propulsion offering without specifications or flight proof.
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE012"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture"
    title: "Architecture and operating model"
    body: |-
      The architecture is propulsion-first and vertically integrated. A sector-focused profile describes Impulse as building engines, flight software, structures, and avionics in-house, with Mira using chemical Saiph thrusters for aggressive maneuvering and Helios using the Deneb methalox engine for high-energy transfer. SatNews adds that the upgraded Mira configuration for tactically responsive missions includes articulated solar arrays, reaction wheels for precise pointing, and NSA Type 1 cryptographic protection for classified command links.

      The most important design choice is role separation rather than a one-vehicle-does-everything story. Mira handles hosting, deployment, and agile retasking inside mission timelines where thrust and responsiveness matter. Helios is meant to absorb the heavy lift from LEO to GEO and beyond. Electra appears in the official update stream as an electric-propulsion announcement, but the retained sources do not establish its technical role, performance, or flight readiness. The disclosed Mira-and-Helios stack is specific enough to assess, but the high-energy expansion remains a preflight dependency rather than validated infrastructure.
    claimRefs: ["CE003", "CE005", "CE006", "CE011"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-and-deployment"
    title: "Deployment maturity, reliability, and roadmap"
    body: |-
      Mira is materially more mature than the rest of the stack. By September 2026, public reporting says Mira had flown three missions, and the company disclosed a July 2026 flyby in which LEO Express 2 approached LEO Express 3 to within roughly 200 meters. NASA selected Impulse to study how Mira and Helios could enable lower-cost access to hard-to-reach destinations, while the U.S. Space Force has repeatedly bought additional Mira vehicles for responsive and surveillance missions. That combination supports the view that Impulse has crossed from concept narrative into real customer workflows.

      Still, the evidence is not a clean “all systems go.” New Space Economy reports that LEO Express 3 encountered noisy star tracker measurements that increased reaction-control propellant consumption and prevented main-thruster burns, which is precisely the kind of integration issue that can matter in a mobility business. Meanwhile, the next growth step is gated by roadmap items rather than shipped capability: the official updates stream highlights Helios, Electra, Rigel, LEO Express 4, and Colorado build-out activity, while New Space Economy reports the first commercial Helios mission as planned for 2027.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE013", "CE014"]
  - id: "technical-risks"
    title: "Differentiation, controls, and diligence risks"
    body: |-
      The clearest differentiation is speed and maneuverability. Multiple sources frame Impulse’s pitch as an alternative to months-long electric orbit-raising, with Helios explicitly designed around same-day or sub-day delivery to GEO-class missions and Mira positioned as a high-thrust host for retasking, RPO, and responsive payload operations. Repeat government procurement strengthens that differentiation because it implies buyers see operational value in mobility rather than just presentation quality.

      The underwritten risk is that the moat still depends on hardware execution more than on software lock-in. Public sources in the assigned pool do not establish uptime, mission-success rates by vehicle version, formal third-party cyber certifications, payload-integration lead-time SLAs, or external developer tooling. The chapter therefore treats public trust-and-safety evidence as narrow rather than comprehensive: there is some signal around secure command links and mission controls, but not enough to grade reliability, quality systems, or customer-support readiness without direct diligence. The practitioner-style Factories in Space database provides a useful external product-history signal, but it is not a substitute for telemetry, audit artifacts, or a maintained developer surface.
    claimRefs: ["CE006", "CE008", "CE012"]
