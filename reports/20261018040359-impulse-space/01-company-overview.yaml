    - type: private-evidence-only
      severity: material
      topic: economics
      missingEvidence: Recognized revenue, gross margin, bookings-to-revenue conversion, cash burn, and cash balance.
      whyItMatters: Later chapters cannot translate backlog, hiring, and valuation narratives into operating durability without core financial disclosure.
      diligencePath: Request the latest board deck, monthly management accounts, backlog conversion schedule, and cash runway analysis.
    - type: conflicting-data
      severity: material
