      items:
        - date: 2021-09
          label: Founded by Tom Mueller
          detail: "Factories in Space describes Impulse Space as founded in September 2021, establishing the company's propulsion-led origin."
          tone: positive
          claimRefs: [CO001]
        - date: 2022-03-29
          label: Seed financing disclosed
          detail: "The company updates index lists a March 29, 2022 seed-round announcement, showing financing support shortly after founding."
          tone: positive
          claimRefs: [CO004]
        - date: 2023-01-04
          label: First orbital mission announced
          detail: "The public updates feed records the January 4, 2023 announcement of Impulse's first orbital mission."
          tone: positive
          claimRefs: [CO009]
        - date: 2024-02-21
          label: General John W. Raymond joins the board
          detail: "The newsroom index records Raymond's board appointment, the clearest public governance expansion in the assigned pool."
          tone: neutral
          claimRefs: [CO013]
        - date: 2024-10-01
          label: Series B financing announced
          detail: "The updates index records a $150M Series B announcement, showing capital intensity well before the late-stage 2026 raise."
          tone: positive
          claimRefs: [CO004]
        - date: 2025-08-07
          label: NASA selects Impulse for two OTV studies
          detail: "Official NASA-linked company materials connect Mira and Helios to civil-mission planning under VADR."
          tone: positive
          claimRefs: [CO014]
        - date: 2026-06-03
          label: Series D first close lifts total funding above $1B
          detail: "Impulse said it raised $500M in Series D financing and had flown three missions with hundreds of millions of dollars in customer contracts."
          tone: positive
          claimRefs: [CO004, CO009]
        - date: 2026-07-08
          label: NSSL Lane 1 prime status announced
          detail: "The updates feed says Impulse became the first upper-stage prime under NSSL Phase 3 Lane 1."
          tone: positive
          claimRefs: [CO015]
        - date: 2026-09-16
          label: Series D extension and first CFO
          detail: "Payload reports a $308M extension, taking the round to $808M, alongside the hire of the company's first CFO."
          tone: warning
          claimRefs: [CO006, CO012]
        - date: 2027
          label: Helios first flight target
          detail: "Official and independent sources still frame 2027 as the first-flight target, leaving execution on Helios as the next gating milestone."
          tone: risk
          claimRefs: [CO016]
    approximationNotes: null
    claimRefs: [CO001, CO004, CO006, CO009, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: strength
    title: Founder-market fit is a real asset, not just branding
    body: >-
      The assigned pool gives Impulse stronger-than-usual founder-market fit for a private space hardware company: Mueller's propulsion track record, three cited Mira missions, and public civil and defense program wins all reinforce that this is a real operating platform rather than a slide-deck concept.
    claimRefs: [CO001, CO009, CO014, CO015]
  - calloutType: risk
    title: Scale narratives are ahead of economics disclosure
    body: >-
      Public evidence supports financing scale, hiring, facilities, and backlog signals, but not the exact extension valuation, revenue realization, burn, customer concentration, or financing terms; Helios therefore sits between today's proof points and the numbers later chapters still need to underwrite.
    claimRefs: [CO006, CO007, CO008, CO010, CO016]
