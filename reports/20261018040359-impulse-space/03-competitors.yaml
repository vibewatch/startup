company:
  name: Impulse Space
chapter:
  number: 3
  title: Competitors
  summary: "Impulse competes less against a single orbital-logistics peer than against a stack of alternatives: direct-injection launch, slower electric transfer, internal bus or propulsion work, and a fragmented space-tug field. Mira's flight record and government or GEO-customer traction create real trust advantages, but the higher-upside moat still depends on Helios proving that faster high-energy delivery is repeatable and worth paying for."
sections:
  - id: landscape
    title: Landscape and buyer alternatives
    body: >-
      Public evidence suggests Impulse competes in a broader post-launch logistics stack than a normal startup peer set. New Space Economy frames the market as post-launch mobility rather than launch itself, while its risk section notes competition can arrive from launch providers, electric-propulsion routes, other orbital-transfer vendors, servicing firms, or customers who add propulsion themselves. Factories in Space reinforces that the field is already crowded with active, launched, cancelled, and still-developing space-tug products, so the buyer's outside option is not one named rival but a menu of route-specific substitutes.
    claimRefs: [CP001, CP010, CP011]
    tableRefs: [TP001]
  - id: product-positioning
    title: Product positioning versus direct and substitute routes
    body: >-
      Impulse's strongest public comparison point is that Mira is already flown while Helios is pitched as a faster route to higher-energy orbits. Official NASA material says Mira is already used for hosting and deployment and says Helios can move more than 5 tons from LEO to GEO in less than 24 hours, while New Space Economy and VentureAtlas explain why that matters: electric transfer can stretch into months and heavy-lift or direct-injection launch can be constrained by supply, price, and schedule. That combination makes Impulse's core sales pitch speed plus maneuverability, not only another seat to orbit.
    claimRefs: [CP002, CP003, CP006, CP007]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: distribution-and-packaging
    title: Distribution, packaging, and what buyers can actually compare
    body: >-
      Publicly visible demand signals are broader than a single demo mission. The Impulse updates index shows named agreements with SES, Astranis, and Infinite Orbits, VentureAtlas describes Caravan 1 as fully booked, and Payload reports Caravan 2 and 3 sold out for 2028 while Impulse adds electric propulsion alongside its chemical stack. That means the competitive package is mission-based—dedicated Mira service, dedicated Helios transfer, or shared Caravan rideshare—rather than a posted list price. The upside is broader buyer fit; the downside is that buyers still cannot benchmark realized pricing, discounting, or mission economics from public evidence.
    claimRefs: [CP004, CP005, CP014, CP015]
    tableRefs: [TP003]
  - id: durability-and-risk
    title: Durability, switching costs, and displacement risk
    body: >-
      Durability today rests more on trust and contracting than on an unassailable technical monopoly. VentureAtlas says Mira is bookable with a 12-month lead time and has already executed close-proximity campaigns, and recent Space Force awards show the government will buy Impulse specifically for the hosting-and-maneuvering layer. But New Space Economy still identifies Helios as the largest execution risk: if first-flight timing slips or performance disappoints, buyers can fall back to direct injection, slower electric transfer, or internally integrated mission designs. The moat is meaningful, but it remains concentrated in a preflight product.
    claimRefs: [CP008, CP009, CP012, CP013]
