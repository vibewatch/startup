figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Impulse's strongest current point is Mira's flown mobility and government traction; Helios is the higher-upside but less-proven wedge against direct-injection and electric-transfer substitutes.
    data:
      xAxis:
        label: Responsiveness / time-to-orbit advantage
        min: 1
        max: 5
        low: Slow or schedule-bound
        high: Fast or flexible
        description: Ordinal placement from retained source descriptions of transfer speed and mission flexibility.
        scale: ordinal
      yAxis:
        label: Operational proof / buyer trust today
        min: 1
        max: 5
        low: Concept or sparse proof
        high: Flown or contracted
        description: Ordinal placement from retained source descriptions of flights, bookings, and repeat government awards.
        scale: ordinal
      points:
        - label: Impulse Mira
          x: 4
          y: 5
          detail: Flown hosting, deployment, and close-proximity missions plus repeat government hosting awards.
          claimRefs: [CP002, CP008, CP013]
        - label: Impulse Helios
          x: 5
          y: 2
          detail: Strongest speed promise and broadest GEO upside, but still preflight.
          claimRefs: [CP003, CP004, CP012, CP015]
        - label: Direct OTV / tug field
          x: 3
          y: 2
          detail: Crowded set of active, launched, cancelled, and developmental products.
          claimRefs: [CP010, CP011, CP012]
        - label: Electric transfer
          x: 1
          y: 4
          detail: Efficient route with stronger category maturity, but slower transfer on the use cases retained here.
          claimRefs: [CP006, CP010]
        - label: Direct-injection launch
          x: 4
          y: 4
          detail: Fast if available, but constrained by launch supply, price, and schedule rather than hosted-mobility flexibility.
          claimRefs: [CP006, CP007, CP010]
        - label: Internal build
          x: 2
          y: 3
          detail: High control for bespoke programs, but slower and harder to generalize across buyers.
          claimRefs: [CP001, CP010, CP012]
    approximationNotes: Ordinal 1-5 scoring based on retained qualitative evidence; the source pool does not provide comparable numeric win-rate, cost, or NPV data across each rival route.
    claimRefs: [CP003, CP012, CP015]
callouts:
  - calloutType: strength
    title: Trust comes from contracts and flight heritage, not just the concept slide
    body: Named GEO customers, repeat Space Force work, and Mira's flown record mean buyers can underwrite more than an aspirational architecture. That matters because many substitutes can solve one leg of the job, but fewer combine hosting, maneuverability, and delivery planning inside one vendor relationship.
    claimRefs: [CP004, CP005, CP008, CP013]
  - calloutType: risk
    title: Helios is both the moat and the main single-point failure
    body: The strongest public differentiation is fast high-energy delivery, but the same product is still preflight. If Helios slips again or underdelivers, buyers can default back to direct injection, electric transfer, or internally integrated mission designs while public pricing remains opaque.
    claimRefs: [CP006, CP007, CP012, CP014]
