schemaVersion: "report-v2"
artifact: "valuation"
slug: "impulse-space"
runDate: "2026-10-18"
company:
  name: "Impulse Space"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Public evidence supports a later-stage, price-sensitive category leader rather than a clean
    underwrite: independent coverage placed Impulse Space's June 2026 Series D at about $4.26
    billion, a September 2026 extension added another $308 million, and the company still has
    unusually strong flight and contract proof for a private orbital-logistics startup. The call
    still belongs in research-more / track because public sources do not disclose recognized
    revenue, gross margin, customer concentration, or liquidation-preference terms, while Helios
    execution and Falcon 9 dependence keep downside open.
sections:
  - id: "current-price-context"
    title: "Current price context still outruns public underwriting support"
    body: >-
      The refreshed public financing record is directionally impressive but still incomplete for a
      commit decision. Impulse's own updates page now shows both the June 2026 $500 million Series
      D announcement and a September 2026 $308 million Series D extension, while multiple
      independent profiles and writeups place the June round at roughly a $4.26 billion valuation
      and total disclosed funding above $1 billion. That combination is enough to show that
      investors are paying for category leadership, not merely concept-stage optionality. It is
      not enough to show that a new investor today is buying into an adequately supported price,
      because the public record still lacks recognized revenue, gross margin, customer
      concentration, and preference-stack disclosure. The right reader-facing call is therefore
      research-more / track: the company may be strong, but the price and term visibility are not.
    claimRefs: ["CV001", "CV002", "CV003", "CV010", "CV011", "CV014"]
    tableRefs: ["TV001", "TV002"]
    figureRefs: ["FV001"]
  - id: "scenario-framing"
    title: "Bull and base cases depend on scaling proof into repeatable monetization"
    body: >-
      Impulse has stronger public proof than most hardware startups at a comparable stage. Mira has
      flown three missions, NASA selected the company for orbital transfer vehicle studies, the
      Space Force extended tactical-responsive work with a new $28 million award, and independent
      commentary points to hundreds of millions of dollars in contracts. Those signals support a
      premium to earlier-stage orbital-logistics peers and justify a milestone-based, not
      commodity-SaaS, valuation frame. The problem is conversion visibility: public evidence shows
      backlog and mission momentum, but it does not show what portion converts into recognized
      revenue, what margins the service model can sustain, or how much Helios must succeed for the
      current mark to work. That leaves a plausible bull case, but it also makes the base case
      highly sensitive to execution pace and contract monetization rather than narrative alone.
    claimRefs: ["CV002", "CV004", "CV005", "CV007", "CV008", "CV009", "CV013", "CV015"]
    tableRefs: ["TV003"]
  - id: "downside-gates"
    title: "Downside remains concentrated in Helios timing, launch dependence, and opaque terms"
    body: >-
      The main avoidable mistake would be confusing proof of demand with proof of investable entry
      terms. SpaceBandits' October 2026 profile is useful precisely because it highlights what the
      celebratory funding coverage does not: Helios has not flown, its first-flight timing has
      slipped across multiple reporting windows, and every Impulse vehicle so far has ridden a
      Falcon 9, making SpaceX both a partner and a structural dependency. The financing itself is
      also only partially transparent; independent coverage reports the valuation mark, while other
      coverage notes that the company did not publicly disclose that valuation in its own
      announcement. Until diligence closes the economics, concentration, and term gaps, the chapter
      should end with explicit gating questions and thesis-break triggers rather than a price-blind
      buy recommendation.
    claimRefs: ["CV006", "CV010", "CV011", "CV012", "CV014"]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns:
      - "Metric"
      - "Assessment"
      - "Public evidence basis"
      - "Decision implication"
    rows:
      - ["Recommendation", "research-more / track", "Public evidence supports a strong company-quality story, but not a fully underwritten entry price.", "Do not underwrite solely from public materials; keep working diligence and entry discipline."]
      - ["Confidence", "medium", "Flight, contract, and financing proof are unusually strong, while revenue, margin, and term visibility remain weak.", "Conviction can improve only after economics and terms are reviewed directly."]
      - ["Risk rating", "high", "Helios is still unflown, timing has moved, and launch dependence on Falcon 9 remains.", "Use milestone-based underwriting and explicit downside triggers."]
      - ["Valuation stance", "rich / insufficiently supported", "Secondary reporting supports a late-stage mark near $4.26B, but the company did not publicly disclose valuation or preference terms itself.", "Treat the latest round as a ceiling reference, not a clean fair-value anchor."]
    notes: "Reader-facing recommendation table built from retained public financing, milestone, and execution-risk evidence; no public source in this chapter discloses recognized revenue, gross margin, or preference terms."
    claimRefs: ["CV002", "CV006", "CV010", "CV011", "CV012", "CV014"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Argument"
      - "What would change the view"
    rows:
      - ["Three flown Mira missions plus NASA and Space Force work make Impulse one of the better-proven private orbital-mobility platforms.", "A sustained mission miss, contract rollback, or evidence that missions are not translating into repeatable service demand would weaken the thesis."]
      - ["More than $1B of disclosed capital and hundreds of millions of dollars in contracts support a premium to earlier-stage mobility peers.", "Public or diligence-only evidence showing low conversion of backlog into revenue would compress the premium quickly."]
      - ["The $4.26B reported valuation depends on secondary reporting rather than company disclosure, and public sources do not disclose liquidation preferences.", "A clean cap-table readout plus investor-rights clarity would reduce discount-rate uncertainty materially."]
      - ["Helios timing and Falcon 9 dependence keep the downside asymmetric even if Mira remains credible.", "A successful Helios path-to-service and reduced single-launch-provider dependence would move the anti-thesis down."]
    notes: "This table separates company-quality strengths from entry-price objections; it is not a valuation model and intentionally avoids unsupported precision."
    claimRefs: ["CV003", "CV004", "CV005", "CV006", "CV010", "CV012", "CV015"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Mira flight proof converts into repeat missions, Helios reaches commercial service without major slip, and government plus GEO transport demand compounds.", "Current round can look justified if contract proof converts into disclosed revenue growth before another financing reset is needed.", "Helios execution, manufacturing throughput, and dependence on a narrow set of launch and anchor customers.", "Needs successful Helios commercialization and new disclosed monetization proof."]
      - ["Base", "Mira continues to win business and defense work, but Helios ramps more slowly and public economics remain opaque.", "The company can still be strategically important, yet today's mark leaves limited margin for error without stronger financial disclosure.", "Valuation multiple compression, delayed revenue conversion, and opaque terms.", "Most consistent with the retained public evidence."]
      - ["Bear", "Helios slips again, Falcon 9 dependence persists, and contracts do not convert into visible revenue or margins fast enough.", "A later round could be flat or down in economic value once preferences and execution delays are considered.", "Execution miss, dependence risk, and financing terms that subordinate new money.", "Triggered by milestone misses or adverse diligence on revenue quality and cap-table terms."]
    notes: "Scenario table uses milestone-based logic because retained public evidence does not support a defensible revenue-multiple model."
    claimRefs: ["CV005", "CV006", "CV008", "CV009", "CV011", "CV012", "CV013", "CV014"]
