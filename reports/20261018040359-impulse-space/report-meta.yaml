  topStrengths:
    - Flight-proven Mira missions give the company stronger hardware proof than most private orbital-mobility peers.
    - Public customer evidence spans NASA, the U.S. Space Force, SES, and other commercial counterparties.
    - The company has substantial disclosed funding and visible operational scale.
  topRisks:
    - Helios remains preflight and is the main gating proof point for the largest commercial opportunity.
    - Public evidence does not disclose recognized revenue, gross margin, or burn.
    - Customer concentration and renewal behavior remain opaque.
    - Financing terms and preference-stack details are still not fully public.
  unresolvedGaps:
    - Exact recognized revenue, gross margin, and cash burn remain undisclosed.
    - Helios first commercial mission timing and acceptance criteria remain execution-sensitive.
    - Customer concentration and renewal behavior are not publicly quantified.
    - Liquidation preferences and share-price details for the extension are still not fully confirmed.
