  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A third-party bottom-up estimate of annual orbital-mobility spend by segment, geography, and orbit class.
      whyItMatters: Without a disclosed denominator, valuation and market-share arguments risk leaning on financing momentum rather than actual service demand.
      diligencePath: Request brokered pipeline data, public-procurement totals, and customer mission budgets that separate launch from post-launch transfer spend.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: customer-budget-ownership
      missingEvidence: Contract-level pricing, budget owners, and repeat-purchase behavior by commercial, civil, and defense segment.
      whyItMatters: Adoption timing depends on who actually controls budget authority and whether the service replaces another line item or creates a new one.
      diligencePath: Ask management for anonymized customer cohorts, average contract values, and examples of which budget line funded each mission type.
    - type: missing-source
      severity: minor
      topic: segment-conversion
      missingEvidence: Public conversion data showing how many announced studies, partnerships, or MOUs turn into revenue-bearing transfer missions.
      whyItMatters: Announced pipeline breadth is less useful if it does not convert into recurring orbital-mobility revenue.
      diligencePath: Track announced counterparties across later mission manifests, procurement awards, and launch calendars to distinguish pilots from recurring demand.
