      - - Mira 上的 Saiph 化学推进
        - 为托管、部署和响应式任务调整提供高推力机动能力
        - Impulse 必须确保不同任务变体中的推进器性能、推进剂管理和点火执行保持可靠
        - 飞行异常或推进剂超支会直接降低交付任务的灵活性
      - - Mira 航电、GNC 和指向系统
        - 支持自主制导、快速点火和精确的载荷托管操作
        - 依赖星敏感器、反作用轮、软件调校和正功率调试
        - LEO Express 3 表明，即使运载器进入轨道，传感器噪声问题仍可能阻止主推进器点火
      - - 安全战术任务层
        - 支持机密或政府载荷的指挥与控制
        - 目前公开信号仅限于 SatNews 关于 NSA Type 1 加密链路的报道
        - 指定来源无法证明更广泛的网络安全、安全或合规框架
      - - Deneb 驱动的 Helios 级段
        - 将载荷从 LEO 运至 GEO、地月空间及其他高能目的地
        - 需要发动机鉴定、发射合作方协调，以及更大任务规模下的客户载荷集成
        - 最大的护城河主张也伴随着最大的进度和技术依赖，因为 Helios 仍处于首飞前阶段
      - - 任务运营与内部制造布局
        - Redondo 集成，以及 Colorado、Mojave 和软件/测试活动，共同支持机动舰队扩张
        - 执行依赖发动机、结构、航电和运营的一体化内部能力
        - 垂直整合可以加快学习，但也把制造和人员风险集中在公司内部
    notes: 这些行有意混合当前和规划中的架构，因为本章的投资判断不只关注今天已有的东西，还关注 Impulse 下一步产品落地必须打通哪些依赖。
