  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品实际交付什么
        blocks:
          - type: paragraph
            body: >-
              Impulse Space 卖的不是火箭，而是发射之后发生的事情。在官方和独立描述中，产品是一层在轨机动能力：搭载和部署载荷、改变轨道，并最终将客户从 LEO 推送至
              GEO、月地空间及其他更高能量目的地。当前商业逻辑很直接：发射器先把载荷送入起始轨道，然后 Impulse 用 Mira 提供灵活交付和搭载，未来则用 Helios 进行快速高能转移。


              这样的表述让客户更容易理解工作流。民用和商业用户购买的是最终轨道交付、载荷搭载、检查支持或快速重新定位，而不是泛泛的“航天器平台”；国防买方则利用同一机动能力执行空间态势感知和战术快速响应任务。因此产品版图是连贯的，但成熟度并不均衡：Mira
              已有运营证据，Helios 是计划中的扩产，而现有证据只把 Electra 认定为新推出的电推进产品，尚无规格或飞行验证。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
