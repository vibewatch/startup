chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、类别与运营版图
        blocks:
          - type: paragraph
            body: >-
              Impulse Space 将自己定位为在轨机动公司，而不是发射服务商：本批公开材料始终将其描述为一家围绕发射后载荷转运建立的企业，服务包括搭载、部署、轨道重新定位和高能运输。这一区分很重要，因为后续章节可以把
              Impulse 视为一家同时拥有航天器和任务服务业务的发射后基础设施公司，而不是与发射服务商正面竞争的火箭制造商。公开来源还勾勒出稳定的身份主线：Tom Mueller 于 2021 年创办公司，运营总部位于
              Redondo Beach，公司如今称其版图除南加州外还覆盖 Boulder、Washington, D.C. 和 Mojave。各来源对产品组合的描述也基本一致：Mira
              是已完成飞行验证的机动平台，Helios 是仍待首飞的高能级踢级段，Caravan 则是围绕 Helios、帮助商业客户进入更高能量轨道的拼车产品。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO016
      - number: '1.2'
        title: 管理层深度正在改善，但公开治理细节仍然有限
        blocks:
          - type: paragraph
            body: >-
              管理层证据最能证明的是创始人与市场的匹配度。Mueller
              的推进系统背景是公司市场可信度的核心，因为整个业务假设都建立在运营高硬件含量、推进系统复杂、任务运营和系统集成要求高的飞行器之上。公开证据也显示，创始人之外的职能覆盖正在扩大：独立报道将 Eric Romo
              列为总裁兼 COO，Payload 报道 Adam Townsend 于 2026 年 9 月加入并担任首任 CFO。治理披露则更薄弱。公司公开更新信息确认至少有一项重要董事任命——前 Space Force
              负责人 General John W. Raymond 于 2024 年 2
              月加入董事会——但本批材料没有完整董事名单、委员会结构或投资者权利视角。这呈现出私营公司的常见格局：创始人信号强、管理层扩张可见，但创始人之外的治理权限和监督如何分配，公开证据仍然有限。
            claimRefs:
              - CO001
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO012
              - CO013
      - number: '1.3'
        title: 融资规模清晰，但经济数据和股权结构精度不足
        blocks:
          - type: paragraph
            body: >-
              对一家私营航天公司而言，融资证据异常具体。2026 年 6 月的首次交割由公司发布且得到广泛佐证：Impulse 表示完成 $500 million 的 Series D
              融资，公布了领投方和参与投资者，并称累计融资已超过 $1 billion。2026 年 9 月追加融资更多依赖二手报道，但 Payload 仍给出了明确更新：追加融资为 Series D 增加 $308
              million，使 Series D 总额达到 $808 million。2026 年的公开规模信号也明显增强。独立报道显示员工人数超过 500 人，公司同时称有超过 200
              个职位空缺、员工规模较上年翻倍，并拥有多处支持生产和测试的设施。真正不透明的是投资者最想与这些增长信号对账的内容：已确认收入、毛利率、现金消耗、客户集中度，以及追加融资对应的确切估值和优先权条款。就连追加融资估值，在本批材料中也尚未得到一手来源支持，且不同二手来源的说法并不一致。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO014
              - CO015
      - number: '1.4'
        title: 公开里程碑显示势头，但 Helios 仍是关键验证门槛
        blocks:
          - type: paragraph
            body: >-
              本批材料中的里程碑记录显示，公司已经明显走出概念阶段。时间线覆盖种子轮及后续融资、首次轨道任务公告和飞行、董事会扩张、NASA 研究工作、国家安全奖项，以及 2026
              年的一次重要后期融资。这很重要，因为后续章节可以直接复用这些带日期的锚点，而不必重新推导。尽管如此，近期风险仍然高度集中。NASA 的选择和国家安全奖项证明了机构需求，公司也称 Mira 已执行三次任务，但
              Helios 仍未首飞，是通往最大商业机会的桥梁。本批独立分析明确将 Helios
              扩产、任务可靠性、竞争反应和轨道监管义务列为主要执行风险。结果是，这家公司比大多数机动初创企业拥有更多验证，但其估值和战略叙事仍假设 Mira 的飞行积累能够顺利转化为可重复的 Helios 服务。
            claimRefs:
              - CO009
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 创始人与市场的匹配度是真实资产，不只是品牌包装
            body: >-
              本批材料为这家私营航天硬件公司提供了高于通常水平的创始人与市场匹配度：Mueller 的推进系统履历、三次有来源的 Mira
              任务，以及公开的民用和国防项目胜果，都说明这是一套真实运营的平台，而不是演示文稿里的概念。
            calloutType: strength
            claimRefs:
              - CO001
              - CO009
              - CO014
              - CO015
          - type: callout
            title: 规模叙事领先于经济数据披露
            body: 公开证据支持融资规模、招聘、设施和积压订单信号，但并不支持追加融资的确切估值、收入兑现、现金消耗、客户集中度或融资条款；因此，Helios 处在当前验证点与后续章节仍需评估的数字之间。
            calloutType: risk
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案逻辑
        blocks:
          - type: paragraph
            body: >-
              Impulse 卖的不是从发射到入轨的运力，而是发射之后的转运，包括搭载、部署、重新定位、交会，以及送往更高能量目的地。官方和第三方描述汇聚于同一边界：Mira 负责机动和搭载运营，Helios
              则计划将载荷送出低地球轨道，前往
              MEO、GEO、月地空间及其他目的地。这一边界很重要，因为真正的替代方案不只是其他太空物流初创公司，还包括等待数月完成电推进转移、购买更昂贵的重型发射方案，或者围绕发射服务商已能到达的轨道重新设计任务。因此，这个市场属于发射后物流和轨道机动，而不是泛化的“太空基础设施”或发射收入。
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模与需求信号
        blocks:
          - type: paragraph
            body: >-
              现有公开记录支持多个需求观察角度，但不足以给出单一、可辩护的 TAM。在民用领域，NASA 选择 Impulse
              参与轨道转移飞行器研究，专门探索以更低成本抵达难以到达的目的地，这说明公共采购方将发射后机动视为独立的采购问题。在国防领域，Impulse 已把这一类别转化为具体的有资金支持的工作，包括 $28 million
              的 VICTUS SALO 追加任务；管理层还将 Space Force 预算增长描述为国防成为更快机会的原因。商业方面，管理层认为当天或快速交付至 GEO
              可以同时节省直接任务成本和数月的延迟收入，而私募市场画像显示投资者正积极为这一类别投入资本。这些信号有意义，但仍是需求代理指标，而不是轨道机动支出的公开分母。
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM011
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
      - number: '2.3'
        title: 买方、预算、采用触发因素与约束
        blocks:
          - type: paragraph
            body: >-
              当前买方可分为四组：关注收入兑现时间和更轻航天器经济性的商业 GEO
              运营商；需要共享进入高能轨道机会的较小任务所有者；希望以更低成本完成多目的地转移的民用任务规划者；以及重视按运营时间表机动能力的美国国家安全买方。当 Impulse
              能够缩短转移时间、降低发射加转移成本，或提供单靠发射服务商无法实现的快速响应机动时，采用似乎会加快。主要约束同样明显。管理层表示，最初的
              LEO“太空拖船”论点“算不过账”，也就是说，低利润转移业务可能无法支撑风险投资级回报。传统 GEO
              市场也一直持平，因此类别扩张依赖更好的经济性，而不只是市场自然增长。公开证据因此支持一个真实市场，但其变现仍取决于细分市场选择、任务紧迫度和 Helios 执行。
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM008
              - CM012
              - CM013
              - CM016
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 市场存在，是因为发射不能解决最终轨道交付
            body: 最稳定的信号是，买方在发射后仍需要转运；NASA、Space Force 和 GEO 运营商都出现在公开证据中，因为单有发射机会并不能解决成本、时效或机动性要求。
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM016
          - type: callout
            title: 公开需求代理指标强于公开自下而上的市场规模
            body: Impulse 拥有可信的用例和合同证据，但公开来源仍未披露轨道机动总支出的清晰分母、细分市场转化率，或按买方群体划分的预算化经常性需求。
            calloutType: risk
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Impulse 参与的是比普通初创同行更宽的发射后物流链。New Space Economy
              将市场界定为发射后机动，而不是发射本身；其风险章节指出，竞争可能来自发射服务商、电推进路线、其他轨道转移供应商、在轨服务公司，或自行增加推进系统的客户。Factories in Space
              进一步表明，这一领域已经有大量活跃、已发射、已取消和仍在开发的太空拖船产品，因此买方的外部选择不是某一个点名对手，而是一组按路线区分的替代方案。
            claimRefs:
              - CP001
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP011
      - number: '3.2'
        title: 相对于直接路线和替代路线的产品定位
        blocks:
          - type: paragraph
            body: >-
              Impulse 最有力的公开比较点在于 Mira 已经飞行，而 Helios 被定位为更快抵达高能轨道的路线。NASA 官方材料称 Mira 已用于搭载和部署，并称 Helios 能在 24 小时内将超过 5
              tons 的载荷从 LEO 送至 GEO；New Space Economy 和 VentureAtlas 解释了这为何重要：电推进转移可能拖延数月，而重型发射或直接注入会受到供应、价格和排期约束。这一组合使
              Impulse 的核心销售主张成为速度加机动性，而不只是再提供一个入轨席位。
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP011
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP012
              - CP015
      - number: '3.3'
        title: 分销、产品组合与买方实际可比较的内容
        blocks:
          - type: paragraph
            body: >-
              公开可见的需求信号不止一次演示任务。Impulse 更新索引显示其与 SES、Astranis 和 Infinite Orbits 达成了具名协议，VentureAtlas 称 Caravan 1
              已全部预订，Payload 报道 Caravan 2 和 3 已售罄至 2028 年，同时 Impulse 在化学推进组合旁增加电推进。因此，竞争产品是按任务打包的——专属 Mira 服务、专属 Helios
              转移，或共享 Caravan 拼车——而不是公开标价单。好处是更能覆盖不同买方；代价是买方仍无法从公开证据基准比较实际价格、折扣或任务经济性。
            claimRefs:
              - CP004
              - CP005
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP014
              - CP015
      - number: '3.4'
        title: 持久性、转换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              如今的持久性更多建立在信任和合同上，而不是不可撼动的技术垄断。VentureAtlas 称 Mira 可提前 12 个月预订，且已经执行近距离任务；近期 Space Force
              奖项也显示，政府会专门为搭载和机动这一层向 Impulse 采购。但 New Space Economy 仍将 Helios
              视为最大的执行风险：如果首飞时间推迟或性能令人失望，买方可以退回直接注入、较慢的电推进转移，或内部集成的任务设计。护城河有意义，但仍集中在一款尚未首飞的产品上。
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 信任来自合同和飞行积累，而不只是概念演示
            body: >-
              具名 GEO 客户、反复的 Space Force 工作以及 Mira
              的飞行记录，意味着买方可以评估的不只是理想化架构。这很重要，因为许多替代方案只能解决任务的一段，但能在同一个供应商关系中同时提供搭载、机动和交付规划的更少。
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP013
          - type: callout
            title: Helios 既是护城河，也是主要单点故障
            body: 最强的公开差异化是快速高能交付，但同一产品仍未首飞。如果 Helios 再次延期或交付不足，买方可以回到直接注入、电推进转移或内部集成任务设计，而公开价格仍然不透明。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
