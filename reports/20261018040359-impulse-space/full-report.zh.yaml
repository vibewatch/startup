      - number: '7.4'
        title: 监控指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              最清晰的论点破坏触发因素是可监控的。如果 Helios 再次推迟到 2027 年上半年之后，市场应同时假定 Caravan
              转化、国防时间表和客户信心承压。如果另一次飞行异常显示传感器可靠性或推进剂余量不足，即使某一任务仍然完成，可重复性风险也会上升。就财务而言，公开证据还不足以把积压订单当作已确认收入的代理指标，因此在投资者将当前估值视为持久而非理想化之前，应要求管理层证明订单转化、现金消耗吸收和客户集中度。
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: Helios 是论点瓶颈
            body: 一款尚未飞行的飞行器如今挡在公司最重要的 2027 年商业、国防和 GEO 验证点之前，因此风险是相关联的，而不是分散的。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
          - type: callout
            title: 不要把积压订单当作已确认收入
            body: 公开来源支持需求和合同活动，但尚未披露足以仅凭订单转化来评估当前估值所需的收入、利润率、现金消耗或头部客户细节。
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格背景仍超过公开投资判断支持
        blocks:
          - type: paragraph
            body: >-
              更新后的公开融资记录在方向上令人印象深刻，但对于承诺投资的决定仍不完整。Impulse 自己的更新页面如今同时显示 2026 年 6 月的 $500 million Series D 公告和 2026 年 9
              月的 $308 million Series D 追加融资；多个独立画像和文章将 6 月轮次估值置于约 $4.26 billion，并称已披露融资总额超过 $1
              billion。这足以说明投资者押注的是品类领导地位，而不只是概念阶段的期权价值。但这不足以证明今天的新投资者是在一个得到充分支持的价格上买入，因为公开记录仍缺少已确认收入、毛利率、客户集中度和优先权层级披露。因此，面向读者的结论应是“继续研究
              / 跟踪”：公司可能很强，但价格和条款透明度还不够。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV014
