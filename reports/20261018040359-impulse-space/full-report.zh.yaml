  - id: FM001
    title: 市场需求信号评分卡
    type: kpi
    summary: 不同单位的公开信号显示真实需求和投资者兴趣，但仍不足以形成清晰的轨道机动 TAM。
    data:
      items:
        - label: GEO 转移时间差
          displayValue: 6-10 months vs ~8 hours
          note: Sourcery 将传统 GEO 转移时间与 Helios 的目标交付时间作了对比。
          claimRefs:
            - CM005
        - label: 可避免的硬任务成本
          displayValue: $5M-$10M
          note: 管理层将其描述为 Helios 级交付可以避免的燃料消耗。
          claimRefs:
            - CM005
        - label: 国防预算背景
          displayValue: $17B -> $71B
          note: Sourcery 将太空军预算申请的增长列为国防需求背景。
          claimRefs:
            - CM009
        - label: 已签约国防需求
          displayValue: $28M
          note: SatNews 报道了两辆 Mira 车辆的 VICTUS SALO 扩展合同金额。
          claimRefs:
            - CM008
        - label: 资本市场信号
          displayValue: $1.33B funded / $5.4B post-money
          note: Forge 展示的是投资者兴趣，而非客户支出分母。
          claimRefs:
            - CM011
        - label: 已宣布的业务进展
          displayValue: 3 missions + hundreds of millions in contracts
          note: 官方和第三方来源都指向商业、民用和国防领域的业务进展。
          claimRefs:
            - CM012
            - CM016
    approximationNotes: 不同单位使金字塔图在此处具有误导性，因此本图使用 KPI 式需求信号，而不是暗示可比的叠加市场层级。
    claimRefs:
      - CM004
      - CM005
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: Impulse 当前最强的优势是 Mira 已飞行的机动能力和政府业务进展；Helios 对直注入和电推进转移替代方案而言上行空间更大，但验证更少。
    data:
      xAxis:
        label: 响应性 / 入轨时间优势
        min: 1
        max: 5
        low: 慢或受时间表约束
        high: 快或灵活
        description: Ordinal placement from retained source descriptions of transfer speed and mission flexibility.
        scale: ordinal
      yAxis:
        label: 当前运营证明 / 买方信任
        min: 1
        max: 5
        low: 概念或证明稀少
        high: 已飞行或已签约
        description: Ordinal placement from retained source descriptions of flights, bookings, and repeat government awards.
        scale: ordinal
      points:
        - label: Impulse Mira
          x: 4
          'y': 5
          detail: 已执行载荷托管、部署和近距离任务，并多次赢得政府托管合同。
          claimRefs:
            - CP002
            - CP008
            - CP013
        - label: Impulse Helios
          x: 5
          'y': 2
          detail: 速度承诺最强、GEO 上行空间最大，但仍未首飞。
          claimRefs:
            - CP003
            - CP004
            - CP012
            - CP015
        - label: 直达 OTV / 拖船领域
          x: 3
          'y': 2
          detail: 活跃、已发射、已取消和在开发产品拥挤在同一领域。
          claimRefs:
            - CP010
            - CP011
            - CP012
        - label: 电推进转移
          x: 1
          'y': 4
          detail: 路径高效、品类成熟度更高，但在此处保留的用例中转移速度更慢。
          claimRefs:
            - CP006
            - CP010
        - label: 直注入发射
          x: 4
          'y': 4
          detail: 有条件时速度很快，但受发射供给、价格和时间表约束，不具备托管机动的灵活性。
          claimRefs:
            - CP006
            - CP007
            - CP010
        - label: 内部自建
          x: 2
          'y': 3
          detail: 定制项目的控制力高，但速度更慢，也更难推广给不同买方。
          claimRefs:
            - CP001
            - CP010
            - CP012
    approximationNotes: 1–5 的序数评分基于保留的定性证据；来源池没有提供各竞争路径可比的数字化胜率、成本或 NPV 数据。
    claimRefs:
      - CP003
      - CP012
      - CP015
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据展示了发射后机动需求如何转化为任务、拼车和合同收入信号，但尚未转化为已披露的实际利润率。
    data:
      nodes:
        - id: n1
          label: 客户任务需要发射后机动
          value: Commercial, civil, and government payloads need delivery, hosting, or repositioning after launch.
        - id: n2
          label: 中型运载火箭提供初始轨道
          value: Impulse is positioned after launch rather than as the launch provider.
        - id: n3
          label: Mira 或 Helios 执行转移
          value: Mira serves hosting and maneuvering; Helios is the high-energy transfer stage.
        - id: n4
          label: 销售专属任务或 Caravan 拼车
          value: Customers buy a dedicated service or a shared GEO slot rather than raw propulsion hardware.
        - id: n5
          label: 快速抵达目标轨道或完成托管任务
          value: >-
            Official and independent sources describe GEO access in under a day and some missions in roughly eight
            hours.
        - id: n6
          label: 收入体现为任务费、拼车预订或合同授予
          value: >-
            Public disclosure shows backlog, bookings, and contract value more clearly than realized pricing or gross
            profit.
      edges:
        - from: n1
          to: n2
          label: 载荷发射
        - from: n2
          to: n3
          label: 交接至太空机动服务
        - from: n3
          to: n4
          label: 服务打包
        - from: n4
          to: n5
          label: 任务执行
        - from: n5
          to: n6
          label: 经济事件记录
    approximationNotes: 该流程展示业务机制，而非经审计的财务瀑布；公开来源未披露每一步的实际价格、毛利或现金转化。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: Impulse Space 产品架构图
    type: stack
    summary: 公开架构将任务需求、飞行器、赋能子系统和执行基础设施分开，而不是把 Mira 与 Helios 当成一个可互换的平台。
    data:
      layers:
        - label: 任务界面
          detail: 产品旨在解决的客户发射后任务。
          items:
            - label: 托管载荷运营
              detail: 在轨载荷托管、部署和重新分配任务。
            - label: 响应式 SDA / RPO
              detail: 面向国防和检查任务的空间态势感知与近距离操作。
            - label: 快速高能量交付
              detail: GEO、地月空间和超越 LEO 的转移需求。
        - label: 飞行器
          detail: 按任务类别区分的机动产品。
          items:
            - label: Mira
              detail: 经飞行验证的高推力 OTV，用于托管、部署和机动。
            - label: Helios
              detail: 尚未首飞的踢级，用于快速 GEO 和超越 LEO 的交付。
            - label: Electra
              detail: 官方宣布的电推进产品，但保留证据未披露其规格和运行角色。
        - label: 推进系统积木
          detail: 机动架构的基础是推进方案，而非通用卫星平台。
          items:
            - label: Saiph thrusters
              detail: Mira 上的化学推进。
            - label: Deneb engine
              detail: Helios 使用的 67 kN 甲烷液氧发动机。
        - label: 制导与航电
          detail: 软件和指向系统让推进硬件具备实际运行价值。
          items:
            - label: 自主 GNC 与航电
              detail: 制导软件、反作用轮和升级后的飞行器航电。
        - label: 安全与任务控制
          detail: 公开的信任和安全指令信号有限，但并非没有。
          items:
            - label: 安全指令链路
              detail: SatNews 报道战术任务采用 NSA Type 1 加密。
        - label: 执行基础设施
          detail: 让硬件架构能够投入使用的内部运营。
          items:
            - label: Redondo 集成
              detail: 当前政府业务的组装和生产中心。
            - label: Mojave 测试
              detail: 支持推进系统和飞行器工作的测试环境。
            - label: 科罗拉多设施扩建
              detail: 公开公司历史报道显示，科罗拉多工厂占地规模正在扩大。
    approximationNotes: 这是根据指定公开来源综合出的定性架构，而非官方供应商框图。
    claimRefs:
      - CE003
      - CE006
      - CE011
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据展示了从任务需求到后续扩张的路径，但最强的扩张节点仍是未来预订，而非已经重复发生。
    data:
      items:
        - label: 识别轨道准入问题
          actor: 商业运营商、民用机构或国防任务负责人
          phase: 需求发现
          touchpoints:
            - 需要更快、更便宜或机动性更强的发射后服务
            - 客户结构覆盖商业、民用和国防需求
        - label: 项目授予或预订
          actor: NASA、SSC、SES、Infinite Orbits、托管载荷用户
          phase: 初始承诺
          touchpoints:
            - NASA 授予研究项目
            - SSC 扩展 TacRS 工作
            - SES 和 Caravan 交易对手预订未来 Helios 运力
        - label: 任务设计与集成
          actor: Impulse 任务团队及载荷客户
          phase: 首飞前执行
          touchpoints:
            - 专属 Mira 任务或 Helios 转移规划
            - 针对具体用例的载荷托管与集成
        - label: 在轨服务交付
          actor: Mira 或未来 Helios 任务用户
          phase: 交付
          touchpoints:
            - 已飞行的 Mira 客户任务提供真实部署证明
            - 政府演示和 GEO 转移仍取决于任务执行
        - label: 后续预订与范围扩张
          actor: 重复购买方或相邻买方
          phase: 扩张
          touchpoints:
            - 更多 SALO 任务和已预订的 Caravan 任务清单显示出扩张路径
            - 专属任务和拼车产品扩大了不同任务类别的买方适配度
        - label: 仍缺乏持久性测试
          actor: 投资者或尽调团队
          phase: 留存验证
          touchpoints:
            - 未公开披露 NRR、GRR、流失率或续约率
            - 未公开披露按客户或任务类别拆分的收入集中度
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU012
