      - number: '4.3'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              2026 年融资显著改善了财务灵活性：公开来源显示 6 月完成 $500 million 的 Series D，9 月追加 $308 million，使已披露融资超过 $1.3
              billion。管理层和独立报道都将这笔资金与招聘、制造和飞行器扩产联系起来。这一方向是积极的，因为 Helios、Caravan 和国家安全项目都需要硬件产能，而不是纯软件式扩张。


              即便如此，融资判断仍不完整。公开估值标记约在 $5.4 billion 至 $5.6 billion
              之间，这对市场信息而言属于可接受的噪声，但不足以评估股权结构经济性、清算优先权或真实轮次条款。更重要的是，本批公开来源没有披露现金余额、月度现金消耗、现金跑道、债务、项目融资义务，或按飞行器系列划分的毛利率。财务上只能得出一个实际结论：公司有较强融资渠道和可见需求，但投资判断仍取决于
              Helios 在 2027 年验证窗口内达标，以及积压订单能否转化为可重复、产生利润的任务，而不是停留在前瞻性的预订故事。
