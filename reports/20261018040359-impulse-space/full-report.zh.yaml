      - number: '5.3'
        title: 部署成熟度、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Mira 的成熟度明显高于组合中的其他产品。截至 2026 年 9 月，公开报道称 Mira 已执行三次任务，公司披露 2026 年 7 月曾进行一次近距离飞越，LEO Express 2 接近 LEO
              Express 3 至约 200 米以内。NASA 选择 Impulse 研究 Mira 和 Helios 如何以更低成本抵达难以到达的目的地，而美国 Space Force 也反复采购更多 Mira
              飞行器用于快速响应和监视任务。这一组合支持这样的判断：Impulse 已从概念叙事进入真实客户工作流。


              但证据还不能称为“全系统通过”。New Space Economy 报道，LEO Express 3
              遇到嘈杂的星敏感器测量，导致姿态控制推进剂消耗增加，并阻止主推力器点火；这正是机动业务中可能造成重大影响的集成问题。与此同时，下一步增长仍受路线图项目而非已交付能力控制：官方更新突出
              Helios、Electra、Rigel、LEO Express 4 和 Colorado 扩建活动，而 New Space Economy 报道首个商业 Helios 任务计划于 2027 年进行。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.4'
        title: 差异化、控制与尽调风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的差异化是速度和机动性。多个来源将 Impulse 的主张描述为数月级电推进升轨的替代方案：Helios 明确围绕当天或不到一天送达 GEO 级任务设计，Mira 则被定位为支持改派、RPO
              和快速响应载荷运营的高推力搭载平台。反复获得政府采购进一步强化了这一差异化，因为买方看重机动能力的运营价值，而不只是展示质量。


              投资判断中的风险在于，护城河仍更多依赖硬件执行，而不是软件锁定。本批公开来源没有证明正常运行时间、按飞行器版本划分的任务成功率、正式的第三方网络安全认证、载荷集成交付周期 SLA
              或外部开发者工具。因此，本章将公开的信任与安全证据视为狭窄而非全面：安全指令链路和任务控制有一些信号，但没有足够信息在没有直接尽调的情况下评估可靠性、质量体系或客户支持准备度。Factories in Space
              的从业者型数据库提供了有用的外部产品历史信号，但不能替代遥测、审计材料或持续维护的开发者界面。
            claimRefs:
              - CE006
              - CE008
              - CE012
