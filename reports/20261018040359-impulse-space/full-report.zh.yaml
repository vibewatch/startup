      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              这套架构以推进为先，并实行垂直整合。一份聚焦航天领域的画像称，Impulse 在内部制造发动机、飞行软件、结构件和航电；Mira 使用化学 Saiph 推力器进行激进机动，Helios 使用 Deneb
              甲烷液氧发动机完成高能转移。SatNews 补充称，为战术快速响应任务升级的 Mira 配置包括可转向太阳能阵列、用于精确指向的反作用飞轮，以及用于机密指令链路的 NSA Type 1 加密保护。


              最重要的设计选择是角色分工，而不是“一台飞行器包打天下”。在推力和响应速度重要的任务时间表内，Mira 负责搭载、部署和灵活改派。Helios 则计划承担从 LEO 到 GEO
              及更远距离的重型转移。官方更新信息中出现 Electra 的电推进公告，但保留的来源没有确定其技术角色、性能或飞行准备度。公开的 Mira 与 Helios
              组合已经具体到可以评估，但高能扩张仍是尚未首飞的依赖项，而不是经过验证的基础设施。
            claimRefs:
