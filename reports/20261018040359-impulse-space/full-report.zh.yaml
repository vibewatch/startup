  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与可见需求
        blocks:
          - type: paragraph
            body: >-
              Impulse 的变现故事已经不只是单一的定制任务商店。公开材料描述了四类收入：专属 Mira 转移和搭载工作、专属 Helios 高能交付、Caravan GEO
              拼车项目，以及美国国家安全任务。这种组合很重要，因为它让公司有多种方式变现同一套底层机动能力，但公开记录仍用积压订单、预订、交付周期和合同奖项，而不是已确认收入来衡量牵引力。


              最积极的解读是需求多元化。VentureAtlas 称 Mira 已可提前 12 个月预订，并引用约 $200 million、分布于 30-plus 份合同的积压订单；Payload 称 Caravan 2 和
              3 已售罄至 2028 年。SatNews 和 VentureAtlas 还显示政府侧不再只是设想：在 2026 年 8 月追加任务后，Space Force SBIR 工作累计达到 $90.8
              million。仍然缺失的是从这些需求标记到已预订与已交付任务节奏、收入确认时点和客户集中度之间的桥梁。
