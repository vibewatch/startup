      - number: '8.2'
        title: 看涨与基准情景取决于将验证转化为可重复变现
        blocks:
          - type: paragraph
            body: >-
              与同阶段多数硬件初创公司相比，Impulse 拥有更强的公开证明。Mira 已执行三次任务，NASA 选择公司参与轨道转移飞行器研究，Space Force 以新的 $28 million
              奖项扩大了战术快速响应工作，独立评论还指出合同金额达到数亿美元。这些信号支持相对早期轨道物流同行的溢价，并支持以里程碑为基础、而不是商品化 SaaS
              为基础的估值框架。问题在于转化透明度：公开证据显示积压订单和任务势头，但没有显示其中多少会转化为已确认收入、服务模式能维持什么利润率，或 Helios
              要成功到什么程度当前估值才成立。这留下了可信的乐观情景，但也让基准情景高度敏感于执行速度和合同变现，而不是叙事本身。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 下行风险集中在 Helios 时间表、发射依赖和不透明条款
        blocks:
          - type: paragraph
            body: >-
              最主要且可以避免的错误，是把需求证明混同为可投资入场条款证明。SpaceBandits 2026 年 10 月的画像之所以有用，正是因为它指出了庆祝融资的报道没有强调的内容：Helios
              尚未飞行，其首飞时间已经跨多个报道窗口推迟，而 Impulse 迄今每一款飞行器都搭乘 Falcon 9，使 SpaceX
              既是合作伙伴也是结构性依赖。融资本身也只有部分透明；独立报道给出了估值标记，而其他报道指出公司没有在自己的公告中公开该估值。在尽调填补经济性、集中度和条款缺口之前，本章应以明确的门槛问题和论点破坏触发因素收尾，而不是给出不考虑价格的买入建议。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: “公开结论：继续研究 / 跟踪”
            body: Impulse 看起来是一家强公司，但截至最新报道的估值，公开材料还不足以支持不考虑价格的投资判断。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV014
          - type: callout
            title: 基准情景假设
            body: 基准情景假设 Mira 的验证会继续累积并转化为合同胜果，而 Helios 商业服务的到来会慢于头条新闻中的乐观预期。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
          - type: callout
            title: 主要可避免错误
            body: 最大的可避免错误，是在理解收入质量、优先权条款以及论点有多大程度依赖 Helios 之前，就为报道中的轮次估值买单。
            calloutType: risk
            claimRefs:
              - CV006
