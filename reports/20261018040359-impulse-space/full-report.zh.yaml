figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开里程碑显示，公司从 2021 年成立到后期融资、政府验证和多次 Mira 飞行任务的推进异常迅速，但 2027 年 Helios 首飞仍是下一次价值跃升的闸门。
    data:
      items:
        - date: 2021-09
          label: Tom Mueller 创立公司
          detail: Factories in Space 称 Impulse Space 于 2021 年 9 月成立，确立了公司以推进系统为核心的起源。
          tone: positive
          claimRefs:
            - CO001
        - date: 2022-03-29T00:00:00.000Z
          label: 披露种子轮融资
          detail: 公司更新索引列出 2022 年 3 月 29 日的种子轮公告，显示成立后不久便获得融资支持。
          tone: positive
          claimRefs:
            - CO004
        - date: 2023-01-04T00:00:00.000Z
          label: 宣布首次轨道任务
          detail: 公开更新信息记录了 Impulse 于 2023 年 1 月 4 日宣布首次轨道任务。
          tone: positive
          claimRefs:
            - CO009
        - date: 2024-02-21T00:00:00.000Z
          label: General John W. Raymond 加入董事会
          detail: 新闻室索引记录了 Raymond 的董事任命，这是指定来源池中最明确的公开治理扩展。
          tone: neutral
          claimRefs:
            - CO013
        - date: 2024-10-01T00:00:00.000Z
          label: 宣布 Series B 融资
          detail: 更新索引记录了一笔 $150M 的 Series B 融资，显示公司在 2026 年后期融资前很早就已资本密集。
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-08-07T00:00:00.000Z
          label: NASA 选中 Impulse 开展两项 OTV 研究
          detail: NASA 官方关联的公司材料将 Mira 和 Helios 与 VADR 框架下的民用任务规划联系起来。
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-06-03T00:00:00.000Z
          label: Series D 首次交割使总融资超过 $1B
          detail: Impulse 称其通过 Series D 融资筹得 $500M，并已完成三次飞行任务，客户合同金额达数亿美元。
          tone: positive
          claimRefs:
            - CO004
            - CO009
        - date: 2026-07-08T00:00:00.000Z
          label: 宣布 NSSL Lane 1 主承包商地位
          detail: 更新信息称，Impulse 成为 NSSL 第 3 阶段 Lane 1 下首家上面级主承包商。
          tone: positive
          claimRefs:
            - CO015
        - date: 2026-09-16T00:00:00.000Z
          label: Series D 扩展轮及首任 CFO
          detail: Payload 报道了一笔 $308M 的扩展融资，使该轮总额达到 $808M，同时公司聘用了首任 CFO。
