  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 扎实的证明和融资支持这一故事，但缺失的经济性数据和执行依赖使建议仍停留在继续研究 / 跟踪。
    data:
      nodes:
        - id: proof
          label: 执行证明
          detail: 三次 Mira 任务，加上 NASA 和 Space Force 工作，降低了纯技术风险。
        - id: demand
          label: 需求信号
          detail: 独立报道指向商业和政府任务合计数亿美元的合同。
        - id: price
          label: 当前价格背景
          detail: 2026 年 6 月的报道将该轮融资估值置于约 $4.26B，总披露融资额超过 $1B。
        - id: gaps
          label: 缺失的经济性与条款
          detail: 公开来源仍未披露已确认收入、毛利率、集中度或清算优先权。
        - id: risk
          label: 执行下行风险
          detail: Helios 仍未飞行，对 Falcon 9 的依赖使时间表和平台风险集中。
        - id: call
          label: 建议
          detail: 在尽调完成或出现更好的入场点、弥合信息差之前，继续研究 / 跟踪。
      edges:
        - from: proof
          to: demand
          label: 支持
        - from: demand
          to: price
          label: 有助于支持
        - from: price
          to: gaps
          label: 仍受其约束
        - from: gaps
          to: risk
          label: 被其放大
        - from: risk
          to: call
          label: 导向
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
      - CV012
      - CV014
