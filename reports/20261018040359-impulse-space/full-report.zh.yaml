      - number: '4.2'
        title: 成本结构与公开单位经济证据
        blocks:
          - type: paragraph
            body: >-
              公开利润率逻辑成立，但仍主要停留在理论阶段。官方和独立来源将 Helios 描述为压缩排期的产品，可以在不到一天内把载荷从 LEO 送至
              GEO；一家独立来源称，载荷可在发射后约八小时部署。如果客户看重更早开始服务、更快部署或快速响应太空任务时间表，这种速度就能支撑溢价。Mira 的飞行积累也以许多轨道物流初创公司尚不具备的方式支撑服务可信度。


              反面是成本强度。独立分析和公司访谈描述了一种垂直整合的制造与推进模式，包含内部测试、设施扩建和反复的飞行器验证。这种运营模式可以形成产品差异化，但在公开申报中尚未看到收入成熟度之前，也会前置投入人工、工装、试车台和质量体系成本。由于本批来源既未披露实际价格，也未披露毛利率，所有公开的单位经济判断仍是代理指标，而非足以用于投资判断的指标。
