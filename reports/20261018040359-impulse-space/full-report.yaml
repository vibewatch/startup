chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, category, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Impulse Space positions itself as an in-space mobility company rather than a launch provider: the public
              materials in this pool consistently describe a business built around moving payloads after launch, whether
              through hosting, deployment, orbital repositioning, or higher-energy transport. That distinction matters
              because later chapters can treat Impulse as a post-launch infrastructure company with both spacecraft and
              mission-service exposure, not as a rocket manufacturer competing head-on with launch. Public sources also
              give a stable identity spine: Tom Mueller founded the company in 2021, Redondo Beach is the operating
              headquarters, and the company now describes a footprint spanning Boulder, Washington, D.C., and Mojave in
              addition to Southern California. The product stack likewise appears stable across sources: Mira is the
              flight-proven maneuvering platform, Helios is the still-preflight high-energy kick stage, and Caravan is
              the commercial rideshare wrapper around Helios access to higher-energy orbits.
            claimRefs:
