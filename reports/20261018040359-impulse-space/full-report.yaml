  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and visible demand
        blocks:
          - type: paragraph
            body: >-
              Impulse’s monetization story already looks broader than a single bespoke mission shop. Public materials
              describe four revenue buckets: dedicated Mira transfer and hosting work, dedicated Helios high-energy
              delivery, the Caravan GEO rideshare program, and U.S. national-security mission work. That mix matters
              because it gives the company multiple ways to monetize the same underlying mobility stack, but the public
              record still measures traction with backlog, bookings, lead times, and contract awards rather than
              recognized revenue.


              The strongest positive read is demand diversity. VentureAtlas says Mira is already bookable with a
              12-month lead time and cites roughly $200 million of backlog across 30-plus contracts, while Payload says
              Caravan 2 and 3 were sold out for 2028. SatNews and VentureAtlas also show the government side is no
              longer speculative, with cumulative Space Force SBIR work reaching $90.8 million after the August 2026
              extension. What remains missing is the bridge from those demand markers to booked-versus-delivered mission
              cadence, revenue recognition timing, and customer concentration.
            claimRefs:
