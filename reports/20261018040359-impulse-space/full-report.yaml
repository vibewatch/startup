      - number: '3.4'
        title: Durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Durability today rests more on trust and contracting than on an unassailable technical monopoly.
              VentureAtlas says Mira is bookable with a 12-month lead time and has already executed close-proximity
              campaigns, and recent Space Force awards show the government will buy Impulse specifically for the
              hosting-and-maneuvering layer. But New Space Economy still identifies Helios as the largest execution
              risk: if first-flight timing slips or performance disappoints, buyers can fall back to direct injection,
              slower electric transfer, or internally integrated mission designs. The moat is meaningful, but it remains
              concentrated in a preflight product.
