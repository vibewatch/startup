      - number: '2.3'
        title: Buyers, budgets, adoption triggers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The current buyer map clusters into four groups: commercial GEO operators that care about time-to-revenue
              and lighter spacecraft economics; smaller mission owners that need shared access to higher-energy orbits;
              civil mission planners that want lower-cost multi-destination transfers; and U.S. national-security buyers
              that value maneuverability on operational timelines. Adoption appears to accelerate when Impulse can
              shorten transfer time, reduce launch-plus-transfer cost, or provide responsive maneuvering that a launch
              provider alone cannot. The main constraints are just as visible. Management said the original LEO “space
              tug” thesis “didn’t really pencil,” implying that low-margin transfer work may not support venture-scale
              returns. The legacy GEO market has also been flat, so category expansion depends on better economics
              rather than organic market growth alone. Public evidence therefore supports a real market, but one whose
              monetization still depends on segment selection, mission urgency, and Helios execution.
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM012
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
