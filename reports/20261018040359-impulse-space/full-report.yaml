            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, expansion, and concentration remain the weakest public proofs
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a land-and-expand story, but it does not yet support a durability story. The
              backlog disclosure, booked Caravan manifests, and repeat government extensions imply demand, yet the
              assigned sources do not publish NRR, GRR, churn, renewal rates, contract length distributions, or any
              cohort view that would show whether early missions convert into recurring business. Concentration is also
              still opaque. The customer set appears diversified across government, civil, and commercial categories,
              but there is no public revenue-share split by customer, mission class, or channel. Helios timing makes
              that opacity more important because the largest commercial expansion opportunities are still forward
              booked rather than fully delivered.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public customer proof is broad for a private space startup
            body: >-
              Named proof spans NASA, the U.S. Space Force, SES, Infinite Orbits, Orbit Fab, Vast, HEO, and other
              payload or infrastructure counterparties rather than a single anchor logo.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Durability is still inferred, not measured
            body: >-
              The public record shows awards, bookings, and backlog, but it does not disclose retention, renewals, or
              customer concentration by revenue, so durability still depends on diligence beyond public sources.
            calloutType: risk
            claimRefs:
              - CU001
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is Helios concentration, not generic startup uncertainty. Public sources still
              place Helios in development, and the same first-flight window now underpins Caravan 1, VICTUS SURGO, and
              other 2027 proof points. That matters because public timelines have already moved outward from earlier
              2026 framing, while disclosed funding and valuation have continued to rise. The result is a company with
              credible demand signals but a narrow path to proving that backlog, rideshare bookings, and defense awards
              can convert into repeatable in-space transport revenue at the pace implied by its latest financing.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR013
      - number: '7.2'
        title: Regulatory and institutional risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports real institutional demand, but it does not close the compliance case. NASA
              selected Impulse for orbital-transfer studies and Space Force work has expanded materially, yet those
              proofs are not the same as published mission-approval packages, debris-mitigation sign-offs,
              export-control controls, or enterprise security attestations. The risk register should therefore treat
              regulatory and customer-safety readiness as live diligence work. That is especially important because the
              company's public positioning emphasizes rendezvous, proximity operations, and national-security use cases,
              all of which raise the cost of any approval or assurance failure.
            claimRefs:
              - CR005
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Operational and counterparty execution
        blocks:
          - type: paragraph
            body: >-
              Mira materially lowers technical skepticism because it has flown three missions, but the public operating
              record is not clean enough to treat execution as solved. Independent reporting notes that a LEO Express 3
              issue raised propellant consumption and prevented main-thruster burns, which is exactly the kind of
              precision-operations problem that matters for a mobility provider selling maneuvering reliability rather
              than launch only. At the same time, the transfer model adds interfaces, schedules, and failure points,
              while launch and customer proof remain concentrated in a relatively short list of programs, launch
              partners, and anchor customers.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR010
              - CR013
      - number: '7.4'
        title: Monitoring and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The cleanest thesis-break triggers are monitorable. If Helios slips beyond first-half 2027 again, the
              market should assume pressure on Caravan conversion, defense timelines, and customer confidence at the
              same time. If another flight anomaly shows weak sensor reliability or propellant margins, repeatability
              risk rises even if one mission still closes. Financially, public evidence is not yet strong enough to
              treat backlog as a proxy for recognized revenue, so management should be asked to prove conversion, burn
              absorption, and customer concentration before investors underwrite the current valuation as durable rather
              than aspirational.
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Helios is the thesis bottleneck
            body: >-
              One unflown vehicle now sits in front of the company's most important 2027 commercial, defense, and GEO
              proof points, so the risk is correlated rather than diversified.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
          - type: callout
            title: Do not treat backlog as recognized revenue
            body: >-
              Public sources support demand and contract activity, but they do not yet disclose the revenue, margin,
              burn, or top-customer detail needed to underwrite current valuation on conversion alone.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price context still outruns public underwriting support
        blocks:
          - type: paragraph
            body: >-
              The refreshed public financing record is directionally impressive but still incomplete for a commit
              decision. Impulse's own updates page now shows both the June 2026 $500 million Series D announcement and a
              September 2026 $308 million Series D extension, while multiple independent profiles and writeups place the
              June round at roughly a $4.26 billion valuation and total disclosed funding above $1 billion. That
              combination is enough to show that investors are paying for category leadership, not merely concept-stage
              optionality. It is not enough to show that a new investor today is buying into an adequately supported
              price, because the public record still lacks recognized revenue, gross margin, customer concentration, and
              preference-stack disclosure. The right reader-facing call is therefore research-more / track: the company
              may be strong, but the price and term visibility are not.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Bull and base cases depend on scaling proof into repeatable monetization
        blocks:
          - type: paragraph
            body: >-
              Impulse has stronger public proof than most hardware startups at a comparable stage. Mira has flown three
              missions, NASA selected the company for orbital transfer vehicle studies, the Space Force extended
              tactical-responsive work with a new $28 million award, and independent commentary points to hundreds of
              millions of dollars in contracts. Those signals support a premium to earlier-stage orbital-logistics peers
              and justify a milestone-based, not commodity-SaaS, valuation frame. The problem is conversion visibility:
              public evidence shows backlog and mission momentum, but it does not show what portion converts into
              recognized revenue, what margins the service model can sustain, or how much Helios must succeed for the
              current mark to work. That leaves a plausible bull case, but it also makes the base case highly sensitive
              to execution pace and contract monetization rather than narrative alone.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Downside remains concentrated in Helios timing, launch dependence, and opaque terms
        blocks:
          - type: paragraph
            body: >-
              The main avoidable mistake would be confusing proof of demand with proof of investable entry terms.
              SpaceBandits' October 2026 profile is useful precisely because it highlights what the celebratory funding
              coverage does not: Helios has not flown, its first-flight timing has slipped across multiple reporting
              windows, and every Impulse vehicle so far has ridden a Falcon 9, making SpaceX both a partner and a
              structural dependency. The financing itself is also only partially transparent; independent coverage
              reports the valuation mark, while other coverage notes that the company did not publicly disclose that
              valuation in its own announcement. Until diligence closes the economics, concentration, and term gaps, the
              chapter should end with explicit gating questions and thesis-break triggers rather than a price-blind buy
              recommendation.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Public call: research-more / track'
            body: >-
              Impulse looks like a strong company, but the public package does not yet justify price-insensitive
              underwriting at the latest reported valuation.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV014
          - type: callout
            title: Base-case assumption
            body: >-
              The base case assumes Mira proof keeps compounding into contract wins while Helios commercial service
              arrives more slowly than headline optimism implies.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV006
              - CV008
              - CV009
          - type: callout
            title: Main preventable error
            body: >-
              The biggest avoidable mistake is paying for the reported round mark without first understanding revenue
              quality, preference terms, and how much of the thesis depends on Helios.
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV014
