      - number: '1.3'
        title: Funding scale is clear; economics and cap-table precision are not
        blocks:
          - type: paragraph
            body: >-
              On financing, the evidence is unusually concrete for a private space company. The June 2026 first close is
              company-issued and broadly corroborated: Impulse said it raised $500 million in Series D financing, named
              the round leads and participating investors, and said total capital raised had moved above $1 billion. The
              September 2026 extension is more dependent on secondary reporting, but Payload still gives a concrete
              update: the extension added $308 million and took the Series D total to $808 million. Public scale signals
              also improved materially in 2026. Independent reporting placed headcount above 500 employees while the
              company simultaneously described more than 200 open roles, a doubled workforce over the prior year, and
              multiple facilities supporting production and testing. What remains opaque is exactly what an investor
              most wants to reconcile against those growth signals: recognized revenue, gross margin, cash burn,
              customer concentration, and the exact valuation and preference terms attached to the extension. Even the
              extension valuation is not yet primary-backed in this pool and appears inconsistently reported across
              secondary sources.
