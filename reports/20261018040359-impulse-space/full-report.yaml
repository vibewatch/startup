  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric
      - Assessment
      - Public evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more / track
        - Public evidence supports a strong company-quality story, but not a fully underwritten entry price.
        - Do not underwrite solely from public materials; keep working diligence and entry discipline.
      - - Confidence
        - medium
        - >-
          Flight, contract, and financing proof are unusually strong, while revenue, margin, and term visibility remain
          weak.
        - Conviction can improve only after economics and terms are reviewed directly.
      - - Risk rating
        - high
        - Helios is still unflown, timing has moved, and launch dependence on Falcon 9 remains.
        - Use milestone-based underwriting and explicit downside triggers.
      - - Valuation stance
        - rich / insufficiently supported
        - >-
          Secondary reporting supports a late-stage mark near $4.26B, but the company did not publicly disclose
          valuation or preference terms itself.
        - Treat the latest round as a ceiling reference, not a clean fair-value anchor.
    notes: >-
      Reader-facing recommendation table built from retained public financing, milestone, and execution-risk evidence;
      no public source in this chapter discloses recognized revenue, gross margin, or preference terms.
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          Three flown Mira missions plus NASA and Space Force work make Impulse one of the better-proven private
          orbital-mobility platforms.
        - >-
          A sustained mission miss, contract rollback, or evidence that missions are not translating into repeatable
          service demand would weaken the thesis.
      - - >-
          More than $1B of disclosed capital and hundreds of millions of dollars in contracts support a premium to
          earlier-stage mobility peers.
        - >-
          Public or diligence-only evidence showing low conversion of backlog into revenue would compress the premium
          quickly.
      - - >-
          The $4.26B reported valuation depends on secondary reporting rather than company disclosure, and public
          sources do not disclose liquidation preferences.
        - A clean cap-table readout plus investor-rights clarity would reduce discount-rate uncertainty materially.
      - - Helios timing and Falcon 9 dependence keep the downside asymmetric even if Mira remains credible.
        - >-
          A successful Helios path-to-service and reduced single-launch-provider dependence would move the anti-thesis
          down.
    notes: >-
      This table separates company-quality strengths from entry-price objections; it is not a valuation model and
      intentionally avoids unsupported precision.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV010
      - CV012
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Mira flight proof converts into repeat missions, Helios reaches commercial service without major slip, and
          government plus GEO transport demand compounds.
        - >-
          Current round can look justified if contract proof converts into disclosed revenue growth before another
          financing reset is needed.
        - Helios execution, manufacturing throughput, and dependence on a narrow set of launch and anchor customers.
        - Needs successful Helios commercialization and new disclosed monetization proof.
      - - Base
        - >-
          Mira continues to win business and defense work, but Helios ramps more slowly and public economics remain
          opaque.
        - >-
          The company can still be strategically important, yet today's mark leaves limited margin for error without
          stronger financial disclosure.
        - Valuation multiple compression, delayed revenue conversion, and opaque terms.
        - Most consistent with the retained public evidence.
      - - Bear
        - >-
          Helios slips again, Falcon 9 dependence persists, and contracts do not convert into visible revenue or margins
          fast enough.
        - A later round could be flat or down in economic value once preferences and execution delays are considered.
        - Execution miss, dependence risk, and financing terms that subordinate new money.
        - Triggered by milestone misses or adverse diligence on revenue quality and cap-table terms.
    notes: >-
      Scenario table uses milestone-based logic because retained public evidence does not support a defensible
      revenue-multiple model.
    claimRefs:
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
