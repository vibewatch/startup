      - number: '5.3'
        title: Deployment maturity, reliability, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Mira is materially more mature than the rest of the stack. By September 2026, public reporting says Mira
              had flown three missions, and the company disclosed a July 2026 flyby in which LEO Express 2 approached
              LEO Express 3 to within roughly 200 meters. NASA selected Impulse to study how Mira and Helios could
              enable lower-cost access to hard-to-reach destinations, while the U.S. Space Force has repeatedly bought
              additional Mira vehicles for responsive and surveillance missions. That combination supports the view that
              Impulse has crossed from concept narrative into real customer workflows.


              Still, the evidence is not a clean “all systems go.” New Space Economy reports that LEO Express 3
              encountered noisy star tracker measurements that increased reaction-control propellant consumption and
              prevented main-thruster burns, which is precisely the kind of integration issue that can matter in a
              mobility business. Meanwhile, the next growth step is gated by roadmap items rather than shipped
              capability: the official updates stream highlights Helios, Electra, Rigel, LEO Express 4, and Colorado
              build-out activity, while New Space Economy reports the first commercial Helios mission as planned for
              2027.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
      - number: '5.4'
        title: Differentiation, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation is speed and maneuverability. Multiple sources frame Impulse’s pitch as an
              alternative to months-long electric orbit-raising, with Helios explicitly designed around same-day or
              sub-day delivery to GEO-class missions and Mira positioned as a high-thrust host for retasking, RPO, and
              responsive payload operations. Repeat government procurement strengthens that differentiation because it
              implies buyers see operational value in mobility rather than just presentation quality.


              The underwritten risk is that the moat still depends on hardware execution more than on software lock-in.
              Public sources in the assigned pool do not establish uptime, mission-success rates by vehicle version,
              formal third-party cyber certifications, payload-integration lead-time SLAs, or external developer
              tooling. The chapter therefore treats public trust-and-safety evidence as narrow rather than
              comprehensive: there is some signal around secure command links and mission controls, but not enough to
              grade reliability, quality systems, or customer-support readiness without direct diligence. The
              practitioner-style Factories in Space database provides a useful external product-history signal, but it
              is not a substitute for telemetry, audit artifacts, or a maintained developer surface.
            claimRefs:
              - CE006
              - CE008
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mira has crossed the slideware threshold
            body: >-
              Three Mira missions, a public close-flyby campaign, NASA study selection, and repeat Space Force
              procurement give Impulse unusually strong public maturity evidence for a private orbital-mobility startup.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
          - type: callout
            title: The moat still depends on unflown hardware
            body: >-
              Helios is central to the fast-GEO thesis but remains preflight in the retained evidence; Electra is only
              an announced electric-propulsion offering, and even Mira’s flown program has disclosed a star-tracker
              issue that blocked main-thruster burns on one mission.
            calloutType: risk
            claimRefs:
              - CE004
              - CE010
              - CE013
          - type: callout
            title: Impulse is building a layered mobility stack, not a single vehicle
            body: >-
              The public architecture separates agile chemical maneuvering from high-energy kick-stage delivery, while
              the newly announced electric-propulsion offering remains insufficiently specified; the strategy is
              coherent but execution-heavy because the disclosed layers are internally coupled.
            calloutType: insight
            claimRefs:
              - CE003
              - CE004
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and current demand proof
        blocks:
          - type: paragraph
            body: >-
              Impulse’s public customer evidence spans three distinct motions. First, government and civil buyers
              validate the product through study awards and operationally framed missions, with NASA selecting the
              company for two orbital transfer vehicle studies and Space Systems Command extending tactically responsive
              space work. Second, commercial satellite operators appear in dedicated Helios and Caravan bookings,
              including SES and Infinite Orbits. Third, hosted-payload and deployment users show up on Mira missions
              through HEO, an undisclosed LEO Express-1 primary payload, and other smaller mission participants. The
              result is breadth across buyer types, but most public proof still describes bookings, studies, and
              announced contracts rather than disclosed long-term usage metrics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Named customer proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest named customer proof is not just logo-level. NASA’s award and the Space Force extensions are
              procurement-backed signals that a real buyer evaluated Impulse’s mobility proposition, while SES and
              Infinite Orbits indicate that commercial GEO-access customers are willing to book future Helios capacity
              before first flight. Mira also has more than pure prelaunch marketing proof because public sources
              describe flown customer missions and hosted-payload work on LEO Express missions. Even so, the trajectory
              remains uneven by program. NASA is still at study stage, national-security work is mission specific, and
              Helios expansion depends on future execution rather than already completed commercial service.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
