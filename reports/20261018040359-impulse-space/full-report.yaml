  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product actually delivers
        blocks:
          - type: paragraph
            body: >-
              Impulse Space is not selling rockets; it is selling what happens after launch. Across official and
              independent descriptions, the product is an in-space mobility layer that hosts payloads, deploys them,
              changes orbits, and eventually pushes customers from LEO to GEO, cislunar, and other higher-energy
              destinations. The current commercial logic is straightforward: a launcher gets the payload into a starting
              orbit, then Impulse uses Mira for agile delivery and hosting or, later, Helios for fast high-energy
              transfer.


              That framing matters because it makes the workflow legible in customer terms. Civil and commercial users
              buy final-orbit delivery, payload hosting, inspection support, or responsive repositioning rather than a
              generic “spacecraft platform,” while defense buyers use the same mobility surface for
              space-domain-awareness and tactically responsive missions. The product map is therefore coherent, but it
              is still uneven in maturity: Mira is operational evidence, Helios is a planned scale-up, and the retained
              evidence identifies Electra only as a newly introduced electric-propulsion offering without specifications
              or flight proof.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE012
