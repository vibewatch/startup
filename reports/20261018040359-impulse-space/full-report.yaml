      - number: '1.2'
        title: Leadership depth is improving, but public governance detail remains thin
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is strongest around founder-market fit. Mueller's propulsion background is central to
              the company's market credibility because the whole thesis depends on operating hardware-heavy vehicles
              with difficult propulsion, mission-operations, and systems-integration demands. Public evidence also shows
              some functional broadening beyond the founder: Eric Romo is cited as president and COO in independent
              reporting, and Payload reports the September 2026 hire of Adam Townsend as the first CFO. Governance
              disclosure is thinner. The public updates feed confirms at least one notable board addition—former Space
              Force leader General John W. Raymond joined in February 2024—but the assigned pool does not provide a full
              board roster, committee structure, or investor-rights view. That leaves a familiar private-company
              pattern: strong founder signal and visible executive expansion, but still limited public evidence on how
              governance authority and oversight are distributed beyond the founder.
