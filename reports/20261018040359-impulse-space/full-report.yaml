      - number: '1.4'
        title: Public milestones show momentum, but Helios is still the gating proof point
        blocks:
          - type: paragraph
            body: >-
              The milestone record in the assigned pool shows a company that has moved meaningfully beyond concept
              stage. The timeline covers seed and follow-on financing, first orbital mission announcements and flights,
              board expansion, NASA study work, national-security awards, and a major late-stage financing step in 2026.
              That matters because later chapters can reuse these events as dated anchors rather than re-deriving them.
              Still, the near-term risk picture remains concentrated. NASA selection and national-security awards
              demonstrate institutional demand, and the company says Mira has already flown three missions, but Helios
              remains preflight and is the bridge to the largest commercial opportunity. Independent analysis in the
              assigned pool explicitly identifies Helios scale-up, mission reliability, competitive responses, and
              orbital-regulatory obligations as the key execution risks. The result is a company with more proof than
              most mobility startups, but still one whose valuation and strategic narrative assume a successful
              transition from Mira heritage to repeatable Helios service.
