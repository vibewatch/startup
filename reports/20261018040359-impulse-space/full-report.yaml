      - number: '4.2'
        title: Cost structure and public unit-economics evidence
        blocks:
          - type: paragraph
            body: >-
              The public margin story is logical but still mostly theoretical. Official and independent sources describe
              Helios as a schedule-compression product that can move payloads from LEO to GEO in less than a day, and
              one independent source describes payload deployment about eight hours after launch. That speed can justify
              premium pricing if customers value earlier service start, faster deployment, or responsive-space
              timelines. Mira’s flown heritage also supports service credibility in a way many orbital-logistics
              startups cannot yet claim.


              The counterweight is cost intensity. Independent analysis and company interviews describe a vertically
              integrated manufacturing and propulsion model with in-house testing, facilities expansion, and repeated
              vehicle qualification. That operating model can create product differentiation, but it also front-loads
              labor, tooling, test-stand, and quality-system expense before revenue maturity is visible in public
              filings. Because the assigned sources disclose neither realized pricing nor gross margin, every public
              unit-economics judgment remains a proxy rather than an underwriting-grade metric.
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI011
              - CI012
