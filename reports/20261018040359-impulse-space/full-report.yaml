  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute logic
        blocks:
          - type: paragraph
            body: >-
              Impulse is not selling launch-to-orbit capacity; the company is selling movement after launch, including
              hosting, deployment, repositioning, rendezvous, and delivery into higher-energy destinations. Official and
              third-party descriptions converge on the same boundary: Mira covers maneuvering and hosted operations,
              while Helios is meant to move payloads beyond low Earth orbit toward MEO, GEO, cislunar, and other
              destinations. That boundary matters because the real substitutes are not just other space-logistics
              startups. They include waiting months for electric-propulsion transfers, buying a more expensive
              heavy-lift launch profile, or redesigning a mission around the orbit the launch provider can already
              reach. The market therefore sits in post-launch logistics and orbital mobility, not in generic “space
              infrastructure” or launch revenue.
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and demand signals
        blocks:
          - type: paragraph
            body: >-
              The available public record supports multiple demand lenses, but not a single defensible TAM. On the civil
              side, NASA selected Impulse for orbital transfer vehicle studies specifically to explore lower-cost access
              to hard-to-reach destinations, which is evidence that public buyers see post-launch mobility as a distinct
              procurement problem. On the defense side, Impulse has converted the category into specific funded work,
              including a $28 million VICTUS SALO extension, while management also framed Space Force budget growth as a
              reason defense became the faster opportunity. Commercially, management argues that same-day or rapid GEO
              delivery can save both direct mission cost and months of foregone revenue, while private-market profiles
              show investors are capitalizing the category aggressively. Those signals are meaningful, but they remain
              proxies for demand rather than a disclosed denominator for orbital-mobility spend.
            claimRefs:
              - CM002
              - CM005
              - CM008
              - CM009
              - CM011
              - CM014
