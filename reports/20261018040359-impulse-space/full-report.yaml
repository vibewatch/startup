      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture is propulsion-first and vertically integrated. A sector-focused profile describes Impulse
              as building engines, flight software, structures, and avionics in-house, with Mira using chemical Saiph
              thrusters for aggressive maneuvering and Helios using the Deneb methalox engine for high-energy transfer.
              SatNews adds that the upgraded Mira configuration for tactically responsive missions includes articulated
              solar arrays, reaction wheels for precise pointing, and NSA Type 1 cryptographic protection for classified
              command links.


              The most important design choice is role separation rather than a one-vehicle-does-everything story. Mira
              handles hosting, deployment, and agile retasking inside mission timelines where thrust and responsiveness
              matter. Helios is meant to absorb the heavy lift from LEO to GEO and beyond. Electra appears in the
              official update stream as an electric-propulsion announcement, but the retained sources do not establish
              its technical role, performance, or flight readiness. The disclosed Mira-and-Helios stack is specific
              enough to assess, but the high-energy expansion remains a preflight dependency rather than validated
              infrastructure.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
