      - number: '4.3'
        title: Capital adequacy, financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >-
              The 2026 capital raise materially improved financial flexibility: public sources show a $500 million
              Series D in June and a $308 million extension in September, taking disclosed funding above $1.3 billion.
              Management and independent coverage both tie that money to hiring, manufacturing, and vehicle build-out.
              That is directionally constructive because Helios, Caravan, and national-security programs all require
              hardware throughput rather than pure software scaling.


              Even so, the financing case is still incomplete. Public valuation markers differ between roughly $5.4
              billion and $5.6 billion, which is acceptable noise for market intel but not enough to underwrite
              cap-table economics, liquidation preferences, or true round terms. More importantly, no public source in
              the assigned pool discloses cash on hand, monthly burn, runway, debt, project-finance obligations, or
              gross margin by vehicle family. Financially, that leaves one practical conclusion: the company has strong
              access to capital and visible demand, but underwriting still depends on Helios hitting its 2027
              qualification window and on backlog converting into repeatable, margin-bearing missions rather than
              remaining a forward-looking booking story.
            claimRefs:
              - CI006
              - CI007
              - CI010
              - CI012
              - CI013
