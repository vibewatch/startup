  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how post-launch mobility demand turns into mission, rideshare, and contract revenue signals,
      but not into disclosed realized margins.
    data:
      nodes:
        - id: n1
          label: Customer mission needs post-launch mobility
          value: Commercial, civil, and government payloads need delivery, hosting, or repositioning after launch.
        - id: n2
          label: Medium-lift launch provides initial orbit
          value: Impulse is positioned after launch rather than as the launch provider.
        - id: n3
          label: Mira or Helios performs the transfer
          value: Mira serves hosting and maneuvering; Helios is the high-energy transfer stage.
        - id: n4
          label: Dedicated mission or Caravan rideshare is sold
          value: Customers buy a dedicated service or a shared GEO slot rather than raw propulsion hardware.
        - id: n5
          label: Target orbit or hosted mission is achieved rapidly
          value: >-
            Official and independent sources describe GEO access in under a day and some missions in roughly eight
            hours.
        - id: n6
          label: Revenue appears as mission fees, rideshare bookings, or contract awards
          value: >-
            Public disclosure shows backlog, bookings, and contract value more clearly than realized pricing or gross
            profit.
      edges:
        - from: n1
          to: n2
          label: payload launched
        - from: n2
          to: n3
          label: handoff to in-space mobility
        - from: n3
          to: n4
          label: service packaged
        - from: n4
          to: n5
          label: mission executed
        - from: n5
          to: n6
          label: economic event recorded
    approximationNotes: >-
      The flow shows business mechanics, not an audited financial waterfall; public sources do not disclose realized
      price, gross profit, or cash conversion at each step.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI010
  - id: FE001
    title: Impulse Space product architecture map
    type: stack
    summary: >-
      The public stack separates mission demand, vehicles, enabling subsystems, and execution infrastructure rather than
      presenting Mira and Helios as one interchangeable platform.
    data:
      layers:
        - label: Mission surfaces
          detail: Customer jobs the product is meant to solve after launch.
          items:
            - label: Hosted payload operations
              detail: Payload hosting, deployment, and retasking in orbit.
            - label: Responsive SDA / RPO
              detail: Space-domain-awareness and proximity operations for defense and inspection missions.
            - label: Fast high-energy delivery
              detail: GEO, cislunar, and beyond-LEO transfer demand.
        - label: Vehicles
          detail: Distinct mobility products by mission class.
          items:
            - label: Mira
              detail: Flight-proven high-thrust OTV for hosting, deployment, and maneuvering.
            - label: Helios
              detail: Preflight kick stage for fast GEO and beyond-LEO delivery.
            - label: Electra
              detail: >-
                Officially announced electric-propulsion offering whose specifications and operating role are not
                disclosed in retained evidence.
        - label: Propulsion building blocks
          detail: The mobility stack is anchored in propulsion choices rather than generic satellite buses.
          items:
            - label: Saiph thrusters
              detail: Chemical propulsion on Mira.
            - label: Deneb engine
              detail: 67 kN methalox engine for Helios.
        - label: Guidance and avionics
          detail: Software and pointing systems make the propulsion hardware operationally useful.
          items:
            - label: Autonomous GNC and avionics
              detail: Guidance software, reaction wheels, and upgraded vehicle avionics.
        - label: Security and mission controls
          detail: Public signal on trust and secure command is narrow but not zero.
          items:
            - label: Secure command links
              detail: SatNews reports NSA Type 1 cryptography for tactical missions.
        - label: Execution infrastructure
          detail: Internal operations that make the hardware stack usable.
          items:
            - label: Redondo integration
              detail: Assembly and production center for current government work.
            - label: Mojave testing
              detail: Test environment supporting propulsion and vehicle work.
            - label: Colorado facility expansion
              detail: Public company-history reporting identifies a growing Colorado factory footprint.
    approximationNotes: >-
      This is a qualitative architecture stack synthesized from assigned public sources rather than an official vendor
      block diagram.
    claimRefs:
      - CE003
      - CE006
      - CE011
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public proof shows a path from mission need to follow-on expansion, but the strongest expansion nodes remain
      forward booked rather than already repeated.
    data:
      items:
        - label: Orbit-access problem identified
          actor: Commercial operator, civil agency, or defense mission owner
          phase: Need discovery
          touchpoints:
            - Need faster, cheaper, or more maneuverable post-launch mobility
            - Segment mix spans commercial, civil, and defense demand
        - label: Program award or booking
          actor: NASA, SSC, SES, Infinite Orbits, hosted-payload users
          phase: Initial commitment
          touchpoints:
            - NASA awards studies
            - SSC extends TacRS work
            - SES and Caravan counterparties book future Helios capacity
        - label: Mission design and integration
          actor: Impulse mission team plus payload customer
          phase: Preflight execution
          touchpoints:
            - Dedicated Mira missions or Helios transfer planning
            - Payload hosting and integration for specific use cases
        - label: On-orbit service delivery
          actor: Mira or future Helios mission user
          phase: Delivery
          touchpoints:
            - Flown Mira customer missions provide actual deployment proof
            - Government demonstrations and GEO transfers still depend on mission execution
        - label: Follow-on booking and scope expansion
          actor: Repeat or adjacent buyers
          phase: Expansion
          touchpoints:
            - Additional SALO missions and booked Caravan manifests suggest expansion paths
            - Dedicated and rideshare offerings widen buyer fit across mission classes
        - label: Durability test still missing
          actor: Investor or diligence team
          phase: Retention validation
          touchpoints:
            - No public NRR, GRR, churn, or renewal-rate disclosure
            - No public revenue concentration split by customer or mission class
