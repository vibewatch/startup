      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >
              融资银团和制药企业关系为战略出售或最终进入公开市场提供了潜在路径，但已审阅证据无法证明公司已准备好退出，也
              无法确定时间窗口或目标回报。在设定入场价格前，投资者应取得经审计的收入和现金数据、合同层面的付款机制、续约和
              集中度指标、计算成本、完全摊薄的股权结构表，以及每一项清算优先权。技术尽调应把模型输出与独立审阅的湿实验室
              结果及合作伙伴项目进展连接起来。商业尽调应确认哪些关系是付费、经常性、已扩展的，哪些只是探索性合作。如果重复部署
              未能转化为已披露的经济条件、重要合作伙伴退出、独立验证结果明显不及公司口径，或新一轮融资要求在不高于最新估值的 价格下接受结构上更优先的条款，投资逻辑就会失效。
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
