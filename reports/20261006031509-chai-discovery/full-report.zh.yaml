chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与平台商业模式
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 是一家总部位于美国加州旧金山的早期私有生物技术与人工智能平台公司。公司由 Joshua Meier、Jack Dent、Matthew McPartlon 和 Jacques
              Boitreaud 于 2024 年创立，开发用于分子和治疗性生物结构的计算机辅助设计工具。公司的技术愿景源于探索将语言模型架构应用于蛋白质组学的研究合作，最初在 OpenAI 的旧金山办公室孵化，并获得
              OpenAI、Thrive Capital 和 Dimension 的种子支持。Chai
              采用商业软件与平台访问模式，而不是以资产为核心的药物管线：它向制药合作伙伴授权闭源基础模型并训练定制的专有模型，同时向研究社区发布早期结构预测权重。
