              - CM008
      - number: '2.3'
        title: 企业买方画像、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              大型制药组织采用 AI 分子设计平台时，采购决策由协作但彼此分隔的机制驱动，涉及科研负责人、计算化学部门和企业 IT
              高管。主要经济买方通常是全球研发负责人或生物制剂发现高级副总裁，他们掌握专门的外部合作和创新预算。不过，日常用户是计算生物学家、结构生物信息学家和药物化学家，他们会拿算法准确性、对接精度和构象稳定性预测结果去对照专有湿实验基准。为衔接科学评估与企业部署，Chai
              Discovery 采用分层采用路径。公司通过公共网页界面和开放访问权重免费分发蛋白质折叠基础模型 Chai-1，让学术研究人员和企业生物制药科学家无需采购流程即可将模型准确性与 AlphaFold
              等传统基准独立比较。技术可信度在实验台上建立后，商业转化进一步进入 Chai-2 和 Chai-3 等先进生成式平台的企业许可，并部署根据发起方专有内部检测数据训练的定制模型；Eli Lilly 和
              Bristol Myers Squibb 的多年合作即是例证。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 市场增长驱动、临床淘汰瓶颈与采用阻力
        blocks:
          - type: paragraph
            body: >-
              生物制药迫切希望把临床前发现周期从数年压缩到数月，同时解锁过去难以成药的大分子靶点，这推动了 AI 分子设计软件的发展。生成式多模态模型能够预测蛋白质、小分子、DNA 和 RNA
              之间的统一相互作用，使发现团队可以探索远超传统湿实验筛选范围的化学空间和构象空间。但商业采用仍面临严重的结构性约束。临床前命中率和计算机模拟亲和力评分并不能保证临床成功：进入临床试验的药物候选中，约八成半至九成最终失败，其中
              II 期和 III 期开发占据药物开发成本和时间阻力的绝大部分。因此，生物制药采购团队在承诺企业预算前，会要求大量湿实验验证和专有数据保护。此外，尽管企业平台安全和数据完整性已是基本要求，独立安全审计记录显示
              Chai Discovery 没有公开披露的数据泄露或入侵事件，从而维持了对高度保护的制药知识产权组合的企业信任。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 风险投资流入与软件收入的分歧
            body: >-
              评估 AI 药物发现市场规模时，一个关键分析难题是区分风险资本融资规模（2025 年投资 $3.8B 至 $11.4B）与实际商业软件许可和合作支出（2025 年市场总规模
              $2.35B）。高额私有估值由多年期合作头条金额推动，其中包含推测性的下游临床里程碑；而当前每位客户带来的软件 ARR 仍受到严格约束。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM008
          - type: callout
            title: 临床淘汰风险制约软件价值兑现
            body: >-
              Chai-3 等 AI 计算平台虽能显著加快临床前分子设计，却无法化解药物开发的主要风险：约 85% 至 90% 的治疗候选会在临床试验中失败。在 AI
              设计的分子持续展现更高的临床阶段转换率之前，生物制药买方只会把软件费视为运营提效投入，不会为未经验证的巨额估值溢价买单。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 解决方案格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场不只是 AI 抗体初创公司的名单。Chai 直接与模型平台供应商竞争，间接与将软件和自动化实验室结合的 AI
              公司竞争，实际还要面对使用开放模型和专有检测数据自行搭建的路径。传统高通量筛选仍是现状替代方案，因为每项计算方案都需要实验确认和后续开发。公开第三方描述将 Chai
              定位于处理蛋白质、抗体和分子设计问题的制药及生物科技团队。Chai
              自己的网站称其为计算机辅助设计工具，而一个独立索引将其商业产品描述为模型许可，不含内部治疗管线或湿实验业务。更窄的平台定位可以减少与药物开发商的渠道冲突，但也把实验室执行和工作流整合留给买方。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP014
              - CP015
      - number: '3.2'
        title: 能力、工作流与信任比较
        blocks:
          - type: paragraph
            body: >-
              Chai 的公开产品划分形成了两种不同的竞争位置。Chai-1 为拥有合适算力的团队提供自行运行的结构预测路径，而后续设计模型则被描述为需要申请才能使用的企业产品。这不等同于实验室集成的发现服务：AI
              Health Index 审阅的公开材料没有提到
              ELN、LIMS、注册表或数据湖连接器，同一来源还称面向买方的数据血缘、托管、留存和跨客户模型学习条款尚未公开。因此，买方应根据已验证的科学终点、实施负担、输出权利和模型版本治理来比较
