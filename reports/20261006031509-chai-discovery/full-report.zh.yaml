              Chai Discovery 的管理团队兼具前沿人工智能工程、深厚的计算生物学和商业执行经验。首席执行官 Joshua Meier 此前负责 Absci 的 AI 研究，在 Meta FAIR 共同创建基础性的
              ESM-1 蛋白语言模型，并曾在 OpenAI 和哈佛大学 Feng Zhang 实验室开展研究。联合创始人兼总裁 Jack Dent 曾负责 Stripe 的旗舰产品工程，带来企业产品经验。联合创始人
