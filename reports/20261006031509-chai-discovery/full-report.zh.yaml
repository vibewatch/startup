    rows:
      - - 正论点
        - 企业工作流相关性
        - 经审阅来源提到与 Lilly、Pfizer、Novartis 和 Bristol Myers Squibb 的关系。
        - 付费续约、扩容和已披露的经济性会强化这一论点。
      - - 正论点
        - 平台定位
        - Chai 将自身描述为分子计算机辅助设计套件，而非单一治疗资产。
        - 关于合作方生产力可重复、利润率可规模化的独立证据会强化这一判断。
      - - 反论点
        - 价格跑在披露前面
        - 公开估值升至 $3.8B，但收入、现金流、利润率和交易条款仍未披露。
        - 能支撑该价格的经审计经营数据会削弱这一反论点。
      - - 反论点
        - 竞争与执行暴露
        - 独立分析将 Isomorphic Labs、Xaira Therapeutics、Absci 和 Nabla Bio 列为相关竞争者。
        - 持续的技术优势和合作方留存会降低这一担忧。
    notes: 关系公告证明市场兴趣，但不能证明收入质量、临床成功、客户留存或独立的产品性能验证。
