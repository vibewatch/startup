      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 关键合作伙伴集中度与未披露的交易经济条件
            body: >-
              Chai Discovery 的 $1.3B 私募估值几乎完全建立在与 Eli Lilly 和 Bristol Myers Squibb 的合作协议之上。然而，
              两家公司都没有披露预付款、研发承诺或后续里程碑分层。如果合作伙伴的湿实验室评估显示，计算机模拟生成的结合体 无法达到可开发性或安全性门槛，Chai 没有可依赖的内部后备管线来创造临床价值。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
          - type: callout
            title: AI 生物制剂的可开发性与转化鸿沟
            body: >-
              在计算机模型中生成高亲和力结合体，只是抗体工程的第一步。候选分子还必须通过严格的稳定性、溶解性、低免疫原性 和制造收率筛选。由于 Chai 不拥有湿实验室 CMC 基础设施，它完全依赖合作伙伴来验证 Chai-2
              设计究竟是可行的药品， 还是计算产物。
            calloutType: insight
            claimRefs:
              - CR002
              - CR006
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与融资背景
        blocks:
          - type: paragraph
            body: >
              公开证据支持 2026 年 7 月完成 $400M 的 Series C 融资，估值达到 $3.8B，约为 2025 年 12 月所报道 $1.3B
              估值的三倍。公开证据并不支持一个精确的累计融资总额：FundedIQ 记录两轮合计 $530M，而 Tracxn 记录四轮合计
              $630M。这一差异很重要，因为融资额既不是收入，也不等于可用现金，还说明即使是基础的资本化历史，也需要管理层核对。
              更重要的是，已审阅的公开记录没有披露收入、现金流、利润率、合同价值或优先股堆叠。因此，结论应是继续研究而非买入： 商业信号足够可信，可以继续尽调，但最新私募价格无法用公开的经济数据进行投资判断。
            claimRefs:
