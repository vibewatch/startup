          - type: callout
            title: 定制微调才是企业护城河
            body: >-
              随着基础模型在行业内演进，公开模型架构可能迅速商品化；而 Chai 的部署模式在每家制药客户的专有数据上重新训练定制模型权重，构筑了切换壁垒。这些私有模型会深度嵌入合作伙伴的发现管线，使其切换到竞争 AI
              平台时面临很高的运营和技术摩擦。
            calloutType: insight
