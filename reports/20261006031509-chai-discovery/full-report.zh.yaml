            body: >-
              公司在四轮机构风险融资中保持激进的融资速度，2024 年 9 月至 2026 年 7 月累计股权融资约 $620M。公司先完成 $20.17M 至 $30M 的种子轮融资，随后于 2025 年 8 月完成由
