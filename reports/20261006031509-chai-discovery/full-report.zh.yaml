      - number: '7.2'
        title: 监管、知识产权与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 的商业模式以技术形态而非适应症为主导，将公司定位为面向合作伙伴的软件和分子设计引擎 [CR002]。因此，Chai 不运营临床阶段治疗资产，也不向 FDA
              等监管机构直接提交研究性新药（IND）申请 [CR002, CR008]。相反，当合作伙伴测试的候选分子向 IND 申报支持研究推进时，监管审查会通过合作项目间接承担 [CR002]。如果 AI
              设计的序列在哺乳动物细胞检测中出现脱靶毒性、不利的药代动力学性质或意外免疫原性，责任会表现为制药被许可方终止项目，而不是监管机构直接对 Chai 执法 [CR008]。


              知识产权构成结构性挑战。Chai 与 Eli Lilly 的合作包括创建使用 Lilly 专有筛选和靶点数据训练的定制模型 [CR002,
              CR008]。在生物制药合作中，制药发起方通常要求对针对其靶点设计的分子拥有排他性所有权或优先商业权 [CR008]。这种结构限制 Chai
              独立商业化所发现候选序列的能力，也引出尚未解决的问题：底层微调模型权重和学习到的生物学表征由谁保留所有权 [CR008]。尽管公开记录中没有针对 Chai Discovery 的诉讼、知识产权争议或监管制裁
              [CR002, CR005]，但公开专利披露的缺失，使 AI 生成分子主张的可执行性仍处于法律未知领域。
            claimRefs:
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR008
      - number: '7.3'
        title: 运营、质量与交易对手依赖
        blocks:
          - type: paragraph
            body: >-
              就运营而言，Chai Discovery 是一家轻资产计算平台，团队规模估计不足 50 人，由来自 OpenAI、Meta FAIR 和 Stripe 的研究人员共同创立 [CR001, CR002,
              CR006]。2025 年，公司任命 Pfizer 前首席科学官 Dr. Mikael Dolsten 加入董事会，进一步强化了治理结构 [CR001,
              CR002]。尽管治理团队阵容强大，公司仍高度依赖外部计算集群和 合作伙伴的湿实验室基础设施 [CR001, CR008]。Chai 没有披露临床试验结果，也没有维持大型内部湿实验室；其内部
              验证依靠计算基准测试和精选的体外筛选 [CR002]。


              这种运营模式带来了关键的交易对手暴露。Eli Lilly 协议涉及一款 Lilly 独家的定制模型，Bristol Myers Squibb 合作则把 Chai 的分子折叠和设计模型部署到 BMS
              的抗体发现组合中 [CR002, CR003, CR004]。由于 Lilly 和 BMS 都没有披露合同期限、终止条款或最低支出承诺，任一合作方都可能在没有公开预警的情况下重新分配资源，或转向
              Schrödinger、Insilico Medicine 等竞争性 AI 平台 [CR007, CR008]。此外，在没有披露经常性收入或 ARR 数字的情况下， Chai 的烧钱主要靠股权融资支撑
              [CR001, CR007]。如果商业采用停滞，或生物制药合作伙伴未能推动候选药物进入临床， Chai 再次进入私人资本市场时将面临严重的降价融资或资本重组风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
