  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery
              将其平台定位为生物分子的计算机辅助设计（CAD）工具，目标是用类似现代软件开发的工程框架，取代经验式反复试错的实验室筛选。传统生物制剂药物发现流程通常需要利用杂交瘤技术或合成展示文库进行 12 至 24
              个月的迭代实验室筛选，以分离针对治疗性抗原的可行抗体结合体。面对构象灵活的蛋白质、多次跨膜靶点（例如 G 蛋白偶联受体（GPCR））或免疫原性较差的表位时，生物制药研究团队经常遇到严重的技术瓶颈。Chai
              Discovery 将氨基酸序列和结构坐标视为可扩展基础模型的提示词，重新定义分子工程，让制药科学家在物理合成候选物之前先进行计算设计。


              在实际客户工作流中，合作方的生物制药科学家会先定义靶点约束、预期结合表位和生物物理参数。软件不再要求在湿实验室对数十亿个随机文库变体进行物理筛选，而是直接提出有针对性的完整免疫球蛋白序列和原子坐标。商业互动模式强调外部企业工具和基础设施配置：Chai
              向包括 Eli Lilly、Pfizer、Novartis 和 Bristol Myers Squibb
              在内的生物制药合作伙伴许可计算模型与协作平台，而不是推进内部以资产为核心的专有管线。这样，公司可以把资源集中于扩展算力基础设施和改进模型架构，同时由制药合作伙伴开展必要的后续检测、毒理研究和转化评估。
            claimRefs:
              - CE001
