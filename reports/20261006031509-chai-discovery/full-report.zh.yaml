  - id: TE002
    title: 治疗性抗体发现工作流与用例比较
    columns:
      - 用户任务
      - 传统湿实验工作流
      - Chai Discovery CAD 方法
      - 可量化的性能收益
      - 当前技术局限
    rows:
      - - 抗原靶点评估
        - 花费数月进行靶点画像和结晶可行性评估
        - 对靶点结合口袋和表位动态进行计算建模
        - 将早期靶点评估从数月压缩至数天
        - 预测准确性高度取决于序列数据库质量和结构训练深度
      - - 从头生成结合体
        - 筛选数百万个噬菌体 / 酵母展示变体或进行动物免疫（12–24 mos）
        - 通过生成式扩散建模从零产生目标抗体序列
        - 结合命中率约为 15–20%，而传统计算筛选低于 0.1%
        - 仍需合作伙伴实验室进行后续实体湿实验合成与结合验证
      - - 难成药靶点探索
        - 柔性膜蛋白、GPCR 和肽-MHC 靶点的成功率低
        - 针对多跨膜构象进行条件化结合体生成
        - 在 6 个 GPCR 和肽-MHC 靶点上展示结合命中，但测试设计数量很少
        - 关于活组织系统中功能性激动剂 / 拮抗剂调节的公开证据有限
      - - 可开发性优化
        - 命中识别后进行昂贵的候选物工程和化学清理
        - 生成时前置整合可制造性和生物物理属性
        - 28 个不同抗原中的测试 IgG 有 86% 的可开发性标记不超过 1 个
        - 无法完全预判体内药代动力学清除、组织渗透或免疫原性
    notes: 工作流比较将标准生物制药抗体发现实践与 Chai 的计算 CAD 套件进行对照。
