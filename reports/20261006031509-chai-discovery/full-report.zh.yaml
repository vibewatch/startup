  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 制药企业的重复部署转化为已披露的经常性收入和里程碑收入；独立结果验证技术表现。
        - $3.8B 估值的上行空间或许可以获得支撑，但基于当前公开输入无法合理给出数值区间。
        - 只有在经济性经审计、合作方持续扩容后，信号才转为正面。
        - 合作项目无法推进，或经济性仍无实质意义。
      - - 基准
        - 合作活动持续，但经济性、利润率和项目结果仍属私人信息。
        - 表面估值仍无法纳入投资判断；应跟踪，不应按该价格投资。
        - 当前公开证据最接近这一状态。
        - 新一轮融资在没有经营披露的情况下要求同等或更优条款。
      - - 悲观
        - 合作方需求转弱、竞争者缩小技术差距，或独立验证结果令人失望。
        - 大幅估值倍数压缩或下轮融资存在可能；没有优先权条款，股权底线无法判断。
        - 负面信号包括合作方退出合作或技术读数不利。
        - 主要合作方退出、验证结果不及预期，或新一轮定价低于最新估值。
    notes: 仅为定性情景。由于公开证据缺少收入、利润率、合同经济性、所有权和优先权条款，因此不估计概率权重或估值区间。
    claimRefs:
      - CV003
