      - number: '5.2'
        title: 架构、模型演进与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 的技术架构通过连续的模型迭代快速演进，目标是优化结构推理、预测准确性和生成吞吐量。公司的初始架构 Chai-1 作为用于分子结构预测的开源基础模型发布。Chai-1 包含 23
              个不同的子模块，这增加了架构复杂度，阻碍了迭代速度和规模化。认识到这些限制后，Chai 有意简化架构，移除专用启发式方法和复杂子模块，建立更精简、统一的基础模型结构，以便利用大规模生物数据集中的规模定律。


              借助
              Chai-2，公司从被动的分子结构预测推进到主动的从头治疗设计。技术栈采用生成式扩散模型而非变分自编码器（VAE），让模型可以反复去噪并优化三维蛋白质构象，同时发现渐进式生物物理优化捷径。训练数据从头构建，使用规模可能与文本模型
              token
              语料相当的序列数据库，并与蛋白质数据库（PDB）的结构坐标统一。该架构支持零样本分子生成，让计算生物学家无需预先筛选物理文库，就能指定结合几何形状和功能要求。在五个设计的抗体—抗原复合物上进行的冷冻电镜（cryo-EM）验证显示，困难结合区域达到亚埃级结构对齐，为高分辨率原子推理提供了物理证据。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
