  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 管理层风险画像与威胁格局
        blocks:
          - type: paragraph
            body: >-
              评估 Chai Discovery 这家 AI 生物制剂平台，需要拆解突破性计算主张与药物发现残酷现实之间的张力。公司通过种子轮、A 轮和 B 轮融资累计筹得超过 $230M，达到 $1.3B 估值
              [CR001, CR006]。然而，其全部商业定位都建立在两项已披露的生物制药合作上：2026 年 1 月宣布的与 Eli Lilly 的重要多靶点合作，以及 2026 年 8 月宣布的与 Bristol
              Myers Squibb 的多靶点抗体合作 [CR002, CR003, CR004]。两项协议均未披露预付费用、研究里程碑、商业特许权使用费或预算运行率 [CR003, CR007]。这种集中使 Chai
              Discovery 暴露于二元交易对手执行风险：如果试点设计周期无法产出经得起生物制药湿实验验证的可行先导物，商业基础就会瓦解。


              从技术角度看，Chai-2 在从头抗体生成中据报道约 20% 的命中率，相比传统计算方法通常约 0.1% 的效率，构成了非凡的自称跃升 [CR001, CR006]。但由于 Chai
              严格作为上游软件与建模平台运营，没有自己的临床管线，其输出在进入首次人体试验前，必须经受严格的可开发性、溶解性、免疫原性和生产制造筛选 [CR002, CR008]。BreachHistory 记录显示，截至
              2026 年 Chai Discovery 没有在案的网络安全漏洞或监管执法行动 [CR005]；然而，当模型与合作伙伴专有数据共同训练时，网络安全、模型盗窃和完整性风险仍至关重要
              [CR008]。此外，学术文献指出，密码软件安全领域的 AI 智能体能够发现系统性的库级误用，凸显了自动化 AI 系统在高风险环境中作出无依据假设的更广泛风险 [CR009]。
            claimRefs:
