      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 高账户集中度与不对称价值捕获
            body: >-
              Chai Discovery 的企业商业战略承受严重的客户集中度风险：所有已确认的商业部署都集中于四个制药账户（Lilly、Pfizer、Novartis 和
              BMS）。通过把合同设计为软件访问和模型许可协议，不参与下游里程碑或特许权使用费，Chai 将收入捕获限制在年度费用，无论客户分子最终是否实现数十亿美元的商业销售。
