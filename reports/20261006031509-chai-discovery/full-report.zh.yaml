      - number: '5.3'
        title: 部署、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 通过双重部署界面交付软件套件：为企业制药合作伙伴定制的私有云基础设施集成，以及 Chai Lab（lab.chaidiscovery.com）的托管云界面。与 Bristol
              Myers Squibb、Eli Lilly 和 Novartis 等全球合作伙伴的生物制药合作，将 Chai
              的分子折叠和从头设计模型嵌入企业药物发现组合，建立把湿实验结果反馈到模型训练循环的持续学习系统。Chai Lab 网页界面需要魔法链接认证和企业授权，在开放科学资产与生产级分子设计工具之间保持受控边界。


              尽管计算机模拟指标亮眼，且已被大型生物制药公司快速采用，平台仍面临重大的技术与转化风险。Chai 报告的结合命中率为 15% 至 20%，显著高于低于 0.1% 的传统计算基线；在 28
              个测试抗原上的可开发性通过率为 86%，但计算机模拟优化并不能保证临床疗效。在更广泛的生物技术行业中，尚无 AI 设计的生物制剂获得 FDA 最终药物批准。此外，在数百个计算节点上管理大规模 GPU
              集群，会带来散热、集群健康监测和长时间任务恢复等运营难题。企业合作模式几乎不容忍软件故障，因此要求严格的生产可靠性。              网络安全方面，独立漏洞监测机构确认截至 2026
              年没有记录在案的数据暴露，保护了制药机密 IP；然而，Chai-2 headline 基准指标仍缺乏独立的同行评审湿实验复现，这是一个公开的尽调缺口。
