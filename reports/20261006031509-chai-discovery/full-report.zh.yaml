      - number: '1.4'
        title: 商业药企部署、基准审视与经营尽调
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 把商业战略押在与头部制药公司签订多靶点发现合作上。商业部署于 2026 年 1 月启动，公司与 Eli Lilly 达成重要合作，利用 Lilly
              的专有生化数据集训练定制生物制剂设计模型；到 2026 年内，合作进一步扩展至与 Pfizer、Novartis、argenx 和 Bristol Myers Squibb
              的许可及合作协议。独立审计记录显示，截至 2026 年 10 月，Chai 没有安全漏洞、安全事件或监管执法行动。然而，重大尽调风险仍在：Chai 据报道 16% 至 20%
              的零样本抗体命中率依赖内部基准和预印本，而非同行评审的临床复现；并且没有任何 Chai 设计的分子进入正式 IND 申报支持研究或人体试验。
            claimRefs:
              - CO014
              - CO015
              - CO016
