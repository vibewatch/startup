  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 企业客户细分与平台经济性
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery
              主要面向寻求加速治疗性生物制剂发现的全球顶级制药公司和商业生物科技公司，销售其生物基础模型。公司是纯软件与平台供应商，提供闭源生成式抗体设计模型的访问权限，以及在客户专有数据上微调的定制模型变体。Chai
              没有采用把发现里程碑与下游净销售特许权使用费绑定的传统生物科技共同开发模式，而是有意通过平台访问和软件许可费变现。这种做法让企业合作伙伴保留所得药物候选物和定制模型权重的完整知识产权，但也把经济负担转移到经常性合同续约上，限制
              Chai 捕捉资产长期上行空间的能力。学术和早期计算研究人员构成次要采用群体，他们使用免费、开放权重的 Chai-1 结构预测模型，主要承担漏斗顶端验证作用，而不是直接的变现驱动因素。
