      - number: '6.2'
        title: 已点名客户、商业 traction 与部署深度
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月至 8 月，Chai Discovery 将已披露的制药客户名单从一家扩大到四家一级药企：Eli Lilly、Pfizer、Novartis 和 Bristol Myers
              Squibb。商业进展于 2026 年 1 月从 Eli Lilly 开始，合作重点是在多个生物制剂靶点上部署 Chai 平台，并构建使用 Lilly 专有生化数据集训练的定制 AI 模型。Pfizer 于
              2026 年 6 月跟进，获得 Chai-3 许可，并包含使用 Pfizer 内部发现数据进行再训练；2026 年 7 月，Novartis 与 Chai 的 $400M C 轮融资一同被披露为活跃客户。2026
              年 8 月，Bristol Myers Squibb 宣布多靶点合作，将 Chai 的分子折叠和从头设计模型整合进其发现工作流。尽管客户品牌顶级，这些客户合作仍全部处于临床前阶段；没有 Chai
              设计的治疗候选物进入正式 IND 申报支持研究或人体临床试验，交易金额——例如据报道 Lilly 每年支付的八位数中段访问费——仍只是未经第三方确认的估计。
