      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              投资逻辑是，Chai 正在把分子设计平台卖给大型制药企业的工作流，而不是只依赖自有临床管线。其网站将产品描述为一套分子计算机辅助设计工具，已审阅来源则提到它与 Eli Lilly、Pfizer、Novartis
              和 Bristol Myers Squibb 的关系。这些关系说明企业客户有兴趣，却不能证明经常性收入持久、利润率有吸引力，或临床转化能够成功。反向逻辑落在
              财务与执行：估值快速重估发生在客户经济条件公开之前，而已审阅分析点名的竞争对手同样资金充裕。漏洞目录没有发现公开的 Chai 事件，但这只是目录覆盖结果，不能据此证明不存在安全或保密风险。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
