            title: 软件许可与治疗性资产共同开发
            body: >-
              与追求里程碑和特许权使用费驱动药物管线的传统生物科技发现公司不同，Chai Discovery 将自己作为上游计算设计工具商业化。Chai
              收取企业许可费和算力访问费，从而获得近期软件收入，同时让资产负债表免受临床试验成败这种二元风险的冲击。但这种结构也把下游资产权益让给药企合作伙伴，将长期经济上行空间限制在合同续签上。
