      - number: '8.3'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >
              如果给出一个数字化的乐观 / 基准 / 悲观估值区间，会制造虚假的精确感，因为公开来源缺少建立收入倍数、现金流折现或按持股比例调整的回报模型所需的运营输入。相反，这些情景应以最新的 $3.8B
              估值被视为决策条件。乐观情景要求 重复制药客户使用带来已披露的经常性收入或里程碑收入、技术表现获得独立且可信的验证，并有证据表明平台能够在不侵蚀
              利润率的情况下支持更多项目。基准情景是合作伙伴活动持续，但经济条件仍不透明，这不足以支撑支付当前表面估值。
              悲观情景是估值倍数收缩、合作伙伴收缩投入，或技术结果不利；在缺少股权结构表和优先权数据的情况下，连下行情景的 股权底价也无法得知。
            claimRefs:
              - CV003
              - CV005
              - CV007
