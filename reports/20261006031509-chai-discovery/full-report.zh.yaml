            body: >-
              Chai Discovery 面临严重的客户集中度风险，目前商业企业收入基础依赖四个已披露的制药账户。尽管据报道公司正在与至少 15
              个其他潜在合作伙伴洽谈，合同条款、期限和净留存率指标仍严格保密。关键在于，Chai 的任何药企合作伙伴都不是排他性合作：Eli Lilly 同时与 Insilico Medicine、NVIDIA 和
              Schrödinger 开展平行发现合作，并推进自有 TuneLab 计划。此外，由于 Chai 收取软件费而非药物资产的股权或里程碑权益，其商业成功完全取决于客户续约和扩大模型席位。如果 Chai
