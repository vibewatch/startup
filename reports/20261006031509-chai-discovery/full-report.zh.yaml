  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、计入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery 的可服务市场横跨生物制药发现软件、计算生物学平台和企业 AI 共同开发合作。全球生物制药研发支出每年超过两千
              亿美元，但传统药物发现流程依然资本密集、进展缓慢：一个候选药物从早期靶点识别推进到监管审查，通常需要超过十年和远超十亿美元。在这个宽泛的行业研发盘子中，Chai Discovery
              瞄准的是用于靶点发现、从头生成分子、抗体优化和临床前先导候选筛选的专项预算。计入的可服务支出包括分子设计平台的年度软件许可费、企业算力协议，以及由生物制药发起方出资、针对其专有内部检测训练定制基础模型的共同开发里程碑安排。相反，市场不包括后期临床试验运营、患者招募、化学品生产和控制（CMC）、商业化生产设施及上市后药物警戒支出。现状替代方案包括成熟的基于物理学的分子动力学软件套件、传统高通量湿实验筛选库、提供人工体外抗体筛选的合同研究组织（CRO），以及构建专有临床管线而非纯企业软件套件的混合型
              AI 生物科技公司。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模口径、增长预测与规模差异
        blocks:
          - type: paragraph
            body: >-
              由于纳入边界不同，独立市场研究机构与风险投资交易追踪数据库对 AI 药物发现市场的规模估计存在显著分歧。药品行业媒体引用的传统市场研究分析师估计，全球 AI 药物发现市场 2025
              年约为二十三亿五千万美元，预计到 2033 年以两位数复合年增长率扩张至一百三十七亿美元。相比之下，风险投资交易追踪机构采用了不同口径：PitchBook 记录 2025 年全球 AI
              药物发现初创公司获得三十八亿美元风险投资；此前的滚动 12 个月估计则显示，135 笔风险投资交易合计三十二亿美元，并突出了 AI 原生生物科技公司相对于更广泛生物制药同业接近百分之百的估值溢价。媒体在 2026
              年年中引用 PitchBook 数据集的报道进一步称，投资者在 2025 年向全球 AI 药物发现公司投入一百一十四亿美元，超过上一年的两倍。三倍的差异说明，狭义的软件许可市场定义，与汇总风险资本流入、企业 AI
              基础设施承诺及多年期生物科技合作头条金额的宽泛定义之间存在张力。在从头抗体设计领域，Chai Discovery
              面向一个聚焦的初始可服务市场，该市场受到头部生物制药软件采购能力的约束；在计入推测性的生物科技合作里程碑前，年度企业平台承诺通常为五百万至三千万美元的经常性许可收入。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
