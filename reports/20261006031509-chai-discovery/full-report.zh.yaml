  - id: FE001
    title: Chai Discovery 分子设计平台架构
    type: stack
    summary: 分层展示 Chai 从基础训练数据和 GPU 计算到企业生物制药合作方工作流的技术栈。
    data:
      layers:
        - label: 物理真实值与生物数据层
          detail: 海量生物序列数据库、Protein Data Bank（PDB）结构档案，以及持续的湿实验反馈。
        - label: 基础模型与算法核心
          detail: 简化的生成式扩散模型执行零样本分子结构预测和从头抗体设计。
        - label: 开发性与生物物理过滤层
          detail: 通过计算机模拟生物物理评估，判断全长 IgG 的可制造性、聚集倾向和稳定性。
        - label: 企业工作流与集成层
          detail: Chai Lab 云套件（lab.chaidiscovery.com）及部署于 Eli Lilly、BMS、Novartis 和 Pfizer 的专用企业集成。
        - label: 自动化实验室合成与检测桥接
          detail: 合作方机器人湿实验合成、结合验证检测和高通量候选物筛选管线。
        - label: 下游临床前评估引擎
          detail: 冷冻电镜结构解析、交叉反应性分析和动物药代动力学评估。
    approximationNotes: 根据公司技术披露、创始人访谈和合作公告综合整理的概念性功能栈。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE009
      - CE010
  - id: FU001
    title: 企业客户旅程与平台扩张循环
    type: journey-map
    summary: 展示生物制药客户评估、部署、定制和续订 Chai Discovery AI 平台所经历阶段的结构化工作流。
    data:
      items:
        - label: 阶段 1：科学验证
          title: Pre-Evaluation & Scientific Validation
          description: 制药计算团队在公开和内部数据集上对开源 Chai-1 结构预测进行基准测试，验证生物物理建模保真度。
          touchpoints:
            - 开源 Chai-1 仓库访问
            - BioRxiv 预印本基准比较
            - 科学会议研讨会和工作坊
        - label: 阶段 2：企业签约
          title: Enterprise Platform Contracting
          description: 客户签署企业软件许可协议，获得闭源生成式设计模型（Chai-2/Chai-3）的安全多用户访问权限。
          touchpoints:
            - 高管支持与研发领导评审
            - 软件许可及知识产权清洁协议签署
            - 安全云端或本地环境搭建
        - label: 阶段 3：定制建模
          title: Proprietary Data Integration & Custom Modeling
          description: Chai 仅为该客户定制微调模型权重，使用其内部专有结合检测、化学筛选和结构数据。
          touchpoints:
            - 客户专有数据集导入
            - 定制神经架构微调
            - 集成到客户 LIMS 和 ELN 的工作流
        - label: 阶段 4：计算机模拟先导生成
          title: In Silico De Novo Antibody Generation
          description: 生物制剂发现团队指定难以处理的靶抗原和表位，在数周内生成全长从头抗体序列。
          touchpoints:
            - 靶表位与结构约束定义
            - 自动生成候选物并进行开发性评分
            - 选择少量候选物进行湿实验合成
        - label: 阶段 5：湿实验验证
          title: In Vitro Validation & Program Progression
          description: 客户在湿实验结合检测中合成并评估预测抗体，将实验命中率与传统筛选基线比较。
          touchpoints:
            - 高通量表面等离子体共振（SPR）/ 冷冻电镜
            - 开发性、溶解度和免疫原性过滤
            - 内部管线候选物选择
        - label: 阶段 6：续订与扩张
          title: Contract Renewal & Expansion Loop
          description: 随着累计数据提升定制模型准确性，客户在更多治疗部门扩增模型席位或续订年度平台访问。
          touchpoints:
            - 年度软件访问许可续订
            - 增加治疗靶点分配
            - 平台升级至下一代基础模型
