      - number: '6.2'
        title: Named Customer Proof, Commercial Traction, and Deployment Depth
        blocks:
          - type: paragraph
            body: >-
              Between January and August 2026, Chai Discovery expanded its disclosed pharmaceutical customer roster from
              a single partner to four tier-one drugmakers: Eli Lilly, Pfizer, Novartis, and Bristol Myers Squibb.
              Commercial traction began with Eli Lilly in January 2026, structured around deploying Chai's platform
              across multiple biologic targets and building a custom AI model trained on Lilly's proprietary biochemical
              datasets. Pfizer followed in June 2026 with a license for Chai-3 that includes retraining on Pfizer's
              internal discovery data, while Novartis was disclosed as an active customer in July 2026 alongside Chai's
              $400 million Series C financing. In August 2026, Bristol Myers Squibb announced a multi-target
              collaboration integrating Chai's molecular folding and de novo design models into its discovery workflows.
              Despite these premier logos, every customer engagement remains preclinical; no Chai-designed therapeutic
              candidate has entered formal IND-enabling studies or human clinical trials, and deal values—such as a
              reported mid-eight-figure annual access fee for Lilly—remain unconfirmed third-party estimates.
