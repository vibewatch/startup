              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Critical Partner Concentration and Undisclosed Deal Economics
            body: >-
              Chai Discovery's $1.3B private valuation is anchored almost entirely on its collaborative pacts with Eli
              Lilly and Bristol Myers Squibb. However, neither company has disclosed upfront cash payments, research
              commitments, or downstream milestone tiers. If partner wet-lab evaluations show that in silico binders
              fail to meet developability or safety thresholds, Chai has no fallback internal pipeline to generate
              clinical value.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
          - type: callout
            title: The Developability and Translation Chasm in AI Biologics
            body: >-
              Generating a high-affinity binder in a computer model is only the initial step of antibody engineering.
              Candidate molecules must clear rigorous stability, solubility, low immunogenicity, and manufacturing yield
              filters. Because Chai does not own wet-lab CMC infrastructure, it is entirely reliant on partners to
              validate whether Chai-2 designs represent viable pharmaceutical products or computational artifacts.
            calloutType: insight
            claimRefs:
              - CR002
              - CR006
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and Financing Context
        blocks:
          - type: paragraph
            body: >
              Public evidence supports a $400M Series C in July 2026 and a $3.8B valuation, roughly triple the $1.3B
              mark reported for December 2025. It does not support a single precise cumulative-funding total: FundedIQ
              records $530M across two rounds, while Tracxn records $630M across four. That discrepancy matters because
              funding raised is neither revenue nor cash available, and it signals that even basic capitalization
              history requires management reconciliation. More importantly, the reviewed public record does not expose
              revenue, cash flow, margins, contract values, or the preference stack. The decision is therefore
              research-more rather than buy: commercial signals are credible enough to continue diligence, but the
              latest private price cannot be underwritten from public economics.
            claimRefs:
