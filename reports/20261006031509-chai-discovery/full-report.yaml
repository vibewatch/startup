              - CP003
              - CP011
              - CP014
              - CP015
      - number: '3.2'
        title: Capability, workflow, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Chai's public product split creates two distinct competitive positions. Chai-1 offers a self-operated
              structure-prediction route for teams with suitable compute, whereas later design models are described as
              application-gated enterprise products. This is not equivalent to a laboratory-integrated discovery
              service: public materials reviewed by AI Health Index name no ELN, LIMS, registry, or data-lake connector,
              and the same source says buyer-facing lineage, hosting, retention, and cross-customer model-learning terms
              are not published. Buyers should therefore compare Chai on validated scientific endpoints, implementation
              burden, output rights, and model-version governance rather than on a generic feature count. The absence of
              a catalogued breach in one specialist database is only a database observation, not evidence that no
              incident occurred; procurement should rely on contractual controls and independent assurance instead.
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP007
              - CP014
