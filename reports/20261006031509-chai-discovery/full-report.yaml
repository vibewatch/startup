      - number: '4.2'
        title: Go-to-Market Motion, Service Delivery Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery executes an enterprise direct go-to-market motion tailored to the multi-layered procurement
              dynamics of major pharmaceutical sponsors. The adoption pathway begins upstream with scientific
              credibility generated by the open-access distribution of its initial Chai-1 structure prediction model,
              which allows enterprise computational biologists to benchmark algorithmic accuracy without procurement
              friction. Commercial expansion then targets corporate R&D leadership and biologics discovery vice
              presidents to license advanced closed-source generative platforms such as Chai-2 and Chai-3. The company's
              service delivery cost structure is dominated by intensive cloud compute expenditures required to train and
              run inference across generative diffusion models and massive biological token corpora, followed by
              specialized compensation for top-tier machine learning engineers and structural bioinformaticians
              recruited from frontier labs like OpenAI, Stripe, and Meta FAIR. Unlike traditional contract research
              organizations that bear extensive physical laboratory overhead, animal housing expenses, and manual
              wet-lab payroll, Chai operates an asset-light computational footprint where gross margins reflect
              pure-play software unit economics, partially offset by dedicated cloud infrastructure and custom partner
              fine-tuning allocations.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Commercial Traction Benchmarks Versus Private Underwriting Blindspots
        blocks:
          - type: paragraph
            body: >-
              Evaluating Chai Discovery's financial scale requires separating corroborated capitalization milestones
              from unverified private operational metrics. On public financing benchmarks, the company has completed
              four priced equity rounds since its 2024 founding, raising over $600M in cumulative capital and escalating
              from a $150M seed valuation to $1.3B at Series B in December 2025 and $3.8B at Series C in July 2026.
              Commercial adoption is anchored by active deployments across Eli Lilly, Pfizer, Novartis, and Bristol
              Myers Squibb, illustrating genuine enterprise willingness to pay for computational de novo antibody
              design. However, beyond public funding announcements, Chai releases zero audited financial statements.
              Fundamental operating metrics—including Annual Recurring Revenue (ARR), revenue run-rate, net revenue
              retention (NRR), customer acquisition cost (CAC), sales cycle duration, and compute gross margins—remain
              completely undisclosed. Secondary private company databases cite legacy baseline metrics such as an
              unverified $48M revenue data point alongside seed round filings, but current realized ARR cannot be
              substantiated without confidential financial disclosures.
            claimRefs:
              - CI011
