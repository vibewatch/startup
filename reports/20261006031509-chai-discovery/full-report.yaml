      - number: '5.2'
        title: Architecture, Model Evolution, and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery's technical architecture has evolved rapidly through successive model generations designed
              to optimize structural reasoning, predictive accuracy, and generative throughput. The company's initial
              architecture, Chai-1, was released as an open-source foundation model for molecular structure prediction.
              Chai-1 incorporated 23 distinct sub-modules, which introduced architectural complexity that impeded
              iteration speed and scaling dynamics. Recognizing these limitations, Chai executed a deliberate
              simplification pivot, stripping away specialized heuristics and complex sub-modules to establish a leaner,
              unified foundation model structure capable of exploiting scaling laws across massive biological datasets.


              With Chai-2, the company advanced from passive molecular structure prediction to active de novo
              therapeutic design. The technical stack leverages generative diffusion models rather than variational
              autoencoders (VAEs), allowing the model to iteratively denoise and refine 3D protein conformations while
              discovering incremental biophysical optimization shortcuts. Training data is compiled from scratch using
              sequence databases that potentially rival text-model token corpora in volume, unified with structural
              coordinates from the Protein Data Bank (PDB). This architecture enables zero-shot molecule generation,
              allowing computational biologists to specify binding geometry and functional requirements without
              pre-screening physical libraries. Cryo-electron microscopy (cryo-EM) validation across five designed
              antibody-antigen complexes demonstrated sub-angstrom structural alignment in difficult binding regions,
              providing physical evidence of high-resolution atomic reasoning.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE001
