      - number: '6.3'
        title: Retention, Account Concentration, and Non-Exclusive Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery faces severe customer concentration, with its commercial enterprise revenue base currently
              resting upon four disclosed pharmaceutical accounts. Although reporting indicates that the company is in
              discussions with fifteen or more additional prospective partners, contract terms, duration, and net
              revenue retention metrics remain strictly confidential. Crucially, none of Chai's pharma partners work
              with the startup on an exclusive basis: Eli Lilly operates parallel discovery pacts with Insilico
              Medicine, NVIDIA, and Schrödinger, alongside its proprietary TuneLab initiative. Furthermore, because Chai
              captures software fees rather than equity or milestone stakes in drug assets, its commercial success
              depends entirely on customer renewals and expanding model seats. If Chai's generative designs suffer from
              developability liabilities, off-target toxicity, or failure to translate beyond benchmark targets in
              customer wet labs, enterprise buyers face minimal friction in decommissioning access or shifting internal
              workloads to competing models such as Isomorphic Labs, Xaira Therapeutics, or EvolutionaryScale.
