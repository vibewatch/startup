        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery's executive team combines frontier artificial intelligence engineering with deep
              computational biology and commercial execution experience. Chief Executive Officer Joshua Meier previously
              led AI research at Absci, co-created the foundational ESM-1 protein language model at Meta FAIR, and
              conducted research at OpenAI and Harvard's Feng Zhang laboratory. Co-founder and President Jack Dent
