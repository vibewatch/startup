  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery characterizes its platform as a computer-aided design (CAD) suite for biological molecules,
              aiming to replace empirical trial-and-error laboratory screening with an engineering framework analogous
              to modern software development. Traditional biologic drug discovery workflows require 12 to 24 months of
              iterative laboratory screens using hybridoma technology or synthetic display libraries to isolate viable
              antibody binders against therapeutic antigens. Biopharma research teams frequently encounter severe
              technical bottlenecks when addressing conformationally flexible proteins, multi-pass transmembrane targets
              such as G-protein coupled receptors (GPCRs), or poorly immunogenic epitopes. Chai Discovery reframes
              molecular engineering by treating amino acid sequences and structural coordinates as prompts for scalable
              foundation models, enabling pharmaceutical scientists to design candidates computationally prior to
              physical synthesis.


              In practical customer workflow terms, partner biopharma scientists interface with Chai's system by
              defining target constraints, intended binding epitopes, and biophysical parameters upstream. Rather than
              requiring physical screening of billions of randomized library variants in wet labs, the software proposes
              targeted, full-length immunoglobulin sequences and atomic coordinates directly. The commercial interaction
              model emphasizes external enterprise tooling and infrastructure provisioning: Chai licenses its
              computational models and collaborative platform to biopharmaceutical partners—including Eli Lilly, Pfizer,
              Novartis, and Bristol Myers Squibb—rather than advancing an internal, asset-centric proprietary pipeline.
              This strategy allows the company to concentrate resources on scaling compute infrastructure and refining
              model architectures while pharmaceutical partners conduct the necessary downstream assays, toxicology
              studies, and translational evaluation.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
