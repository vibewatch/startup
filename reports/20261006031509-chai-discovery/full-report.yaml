  - id: TE002
    title: Therapeutic Antibody Discovery Workflow and Use-Case Comparison
    columns:
      - User Job
      - Traditional Wet-Lab Workflow
      - Chai Discovery CAD Approach
      - Measurable Performance Benefit
      - Current Technical Limitation
    rows:
      - - Antigen Target Evaluation
        - Months of target profiling and crystallization feasibility assessments
        - Computational modeling of target binding pockets and epitope dynamics
        - Compresses early target assessment from months into days
        - Predictive fidelity depends heavily on sequence database quality and structural training depth
      - - De Novo Binder Generation
        - Screening millions of phage/yeast display variants or animal immunizations (12–24 mos)
        - Generative diffusion modeling producing targeted antibody sequences from scratch
        - Achieves ~15–20% binding hit rate vs. <0.1% for legacy computational screening
        - Requires downstream physical wet-lab synthesis and binding validation by partner labs
      - - Intractable Target Pursuit
        - Low success rates on flexible membrane proteins, GPCRs, and peptide-MHC targets
        - Conditioned generation of binders against multi-pass membrane conformations
        - Demonstrated binding hits across 6 GPCRs and peptide-MHC targets with few designs tested
        - Limited published evidence on functional agonist/antagonist modulation in living tissue systems
      - - Developability Optimization
        - Costly downstream candidate engineering and chemical clean-up after hit identification
        - Upfront integration of manufacturability and biophysical properties during generation
        - 86% of test IgGs exhibited <=1 developability flag across 28 distinct antigens
        - Cannot fully anticipate in-vivo pharmacokinetic clearance, tissue penetration, or immunogenicity
    notes: >-
      Workflow comparison contrasts standard biopharma antibody discovery practices against Chai's computational CAD
      suite.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE009
