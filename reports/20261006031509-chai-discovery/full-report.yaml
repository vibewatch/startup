      - number: '7.2'
        title: Regulatory, Intellectual Property, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery's business model is modality-led rather than indication-led, positioning the company as a
              partner-facing software and molecular design engine [CR002]. Consequently, Chai does not operate
              clinical-stage therapeutic assets or file direct Investigational New Drug (IND) applications with
              regulatory agencies like the FDA [CR002, CR008]. Instead, regulatory scrutiny is borne indirectly through
              partner programs as partner-tested candidate molecules advance toward IND-enabling studies [CR002]. If an
              AI-designed sequence exhibits off-target toxicity, unfavorable pharmacokinetic properties, or unexpected
              immunogenicity in mammalian cell assays, the liability manifests as program termination by the
              pharmaceutical licensee rather than regulatory enforcement against Chai directly [CR008].


              Intellectual property presents a structural challenge. The collaboration with Eli Lilly includes creating
              a bespoke custom model trained on Lilly's proprietary screening and target data [CR002, CR008]. In
              biopharma partnerships, pharmaceutical sponsors typically demand exclusive ownership or first commercial
              rights over molecules designed for their targets [CR008]. This structure restricts Chai from
              commercializing discovered candidate sequences independently and raises unresolved questions regarding who
              retains ownership of the underlying fine-tuned model weights and learned biological representations
              [CR008]. Although no litigation, intellectual property disputes, or regulatory sanctions have been
              publicly filed against Chai Discovery [CR002, CR005], the lack of public patent disclosures leaves the
              enforceability of AI-generated molecular claims in uncharted legal territory.
            claimRefs:
              - CR002
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR008
      - number: '7.3'
        title: Operational, Quality, and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, Chai Discovery functions as an asset-light computational platform with an estimated team
              size under 50 employees, co-founded by researchers from OpenAI, Meta FAIR, and Stripe [CR001, CR002,
              CR006]. Governance was reinforced in 2025 by appointing Dr. Mikael Dolsten, former Chief Scientific
              Officer of Pfizer, to the board of directors [CR001, CR002]. Despite this blue-chip governance, the
              company remains highly dependent on external computing clusters and partner wet-lab infrastructure [CR001,
              CR008]. Chai does not report clinical trial results or maintain large in-house wet-lab facilities; its
              internal validation relies on computational benchmarks and selected in vitro screening [CR002].


              This operational posture creates critical counterparty exposure. The Eli Lilly agreement involves a
              Lilly-exclusive custom model, while the Bristol Myers Squibb partnership deploys Chai's molecular folding
              and design models across BMS's antibody discovery portfolio [CR002, CR003, CR004]. Because neither Lilly
              nor BMS has disclosed contract durations, termination clauses, or minimum spend commitments, either
              partner could reallocate resources or pivot to rival AI platforms like Schrödinger or Insilico Medicine
              without public warning [CR007, CR008]. Furthermore, without disclosed recurring revenue or ARR figures,
              Chai's cash burn is financed predominantly by equity funding [CR001, CR007]. If commercial adoption stalls
              or biopharma partners fail to advance candidates into the clinic, Chai will face severe down-round or
              recapitalization risk when returning to private capital markets.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
