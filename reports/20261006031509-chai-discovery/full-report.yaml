      - number: '3.3'
        title: Access, pricing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to negotiated distribution rather than self-serve adoption. Multiple third-party
              pages describe enterprise licensing, application-based access, and unpublished frontier-model pricing; AI
              Health Index also records announced agreements with Eli Lilly, Pfizer, Novartis, and argenx but says their
              financial terms are not public. Forbes separately reports the Lilly partnership, providing corroboration
              of commercial reach without revealing deal economics. StartupHub reports a July 2026 Series C and $470
              million of total funding, but that directory figure is not a filing and should be treated as a
              low-confidence scale signal, not cash available or revenue. Selective access and custom models may
              strengthen flagship relationships, yet they can disadvantage smaller buyers and make price, implementation
              time, support capacity, discounts, royalty terms, and total operating cost impossible to benchmark before
              a vendor process.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Positioning and moat durability
        blocks:
          - type: paragraph
            body: >-
              Chai's moat case rests on model quality, scientific credibility, privileged partner data, and the ability
              to turn successive engagements into a reusable platform. Public evidence does not resolve whether
              custom-model learnings can improve the common product or remain isolated under customer contracts. One
              independent operator analysis argues that exclusive data rights and customer-specific engineering can
              block cross-customer learning and create a services trap; its own seven-company sample is small, the
              contract terms are inferred, and the thesis is not an independent benchmark of Chai. The downside case is
              therefore commoditization through open structure models, displacement by wet-lab-integrated rivals, or
              margin dilution from bespoke deployments. The upside case is a neutral platform that benefits from broad
              pharma distribution without funding clinical programs. Contract-level data rights, engineering allocation,
              release cadence, and independently replicated buyer outcomes are the decisive diligence tests.
            claimRefs:
              - CP001
              - CP007
              - CP011
              - CP012
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
