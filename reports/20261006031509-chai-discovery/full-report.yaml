  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Commercial Monetization Model, and Contract Terms
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery commercializes its foundational biomolecular AI platform through enterprise software
              licensing and collaborative platform access agreements rather than operating an internal clinical asset
              pipeline. The company monetizes by deploying its computational molecular design models—specifically Chai-2
              and Chai-3—directly into enterprise biopharmaceutical workflows to accelerate target identification,
              molecular folding prediction, and de novo antibody generation. As documented across industry transaction
              intelligence, commercial traction has converted from early research exploration into active commercial
              deployments with four premier global pharmaceutical companies: Eli Lilly, Pfizer, Novartis, and Bristol
              Myers Squibb. Rather than depending on speculative downstream clinical royalties that take seven to twelve
              years to materialize, Chai structures its primary near-term monetization through annual platform access
              subscriptions, multi-target enterprise software licenses, and dedicated engineering fees for training
              proprietary custom model variants on partner datasets. Commercial terms remain private, with third-party
              industry trackers observing an unverified seed-stage revenue multiple baseline alongside qualitative deal
              disclosures, leaving realized revenue volume, contract durations, and pricing tiers as primary diligence
              gaps.
            claimRefs:
              - CI001
