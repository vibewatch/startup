      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Simplification as the Catalyst for Diffusion Scaling
            body: >-
              Chai Discovery's technical inflection point occurred when the team transitioned from Chai-1's complex
              23-submodule framework to a streamlined diffusion architecture in Chai-2. Eliminating bespoke heuristic
              sub-modules enabled the models to directly leverage scaling laws across massive sequence databases and PDB
              coordinates, unlocking ~15–20% binding hit rates and zero-shot de novo antibody design.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Translational Validation Gap Between In-Silico Hits and Clinical Efficacy
            body: >-
              While Chai reports sub-angstrom cryo-EM precision and an 86% developability pass rate, in-silico binding
              does not guarantee in-vivo therapeutic performance. No AI-designed biologic has achieved FDA regulatory
              approval to date, and Chai's molecules have not yet advanced into registered human clinical trials.
            calloutType: risk
            claimRefs:
              - CE009
