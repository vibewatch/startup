      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The thesis is that Chai is selling a molecular-design platform into large pharmaceutical workflows rather
              than relying only on a proprietary clinical pipeline. Its website describes a computer-aided design suite
              for molecules, and reviewed sources name relationships with Eli Lilly, Pfizer, Novartis, and Bristol Myers
              Squibb. Those relationships are evidence of enterprise interest, not proof of durable recurring revenue,
              attractive margins, or successful clinical translation. The anti-thesis is consequently financial and
              executional: a rapid valuation re-rating has preceded public disclosure of customer economics, while
              competitors named in the reviewed analysis are also well capitalized. A breach catalog showed no public
              Chai incident, but that absence is only catalog coverage and must not be treated as proof that security or
              confidentiality risk is absent.
            claimRefs:
              - CV008
              - CV009
