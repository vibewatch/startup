      - number: '8.3'
        title: Scenarios and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              A numeric bull/base/bear valuation range would create false precision because the public source set lacks
              the operating inputs needed for a revenue multiple, discounted cash-flow model, or ownership-adjusted
              return model. The scenarios should instead be treated as decision conditions around the latest $3.8B mark.
              The bull case requires disclosed recurring or milestone revenue from repeat pharma use, independently
              credible technical performance, and evidence that the platform can support more programs without margin
              erosion. The base case is continued partner activity with economics still opaque, which does not justify
              paying the headline mark. The bear case is multiple compression, partner retrenchment, or adverse
              technical results; without cap-table and preference data, even the downside equity floor is unknowable.
            claimRefs:
              - CV003
              - CV005
              - CV007
