              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >
              The financing syndicate and pharma relationships create potential strategic-sale or eventual public-market
              paths, but the reviewed evidence does not establish exit readiness, a timing window, or a target return.
              Before setting an entry price, investors should obtain audited revenue and cash data, contract-level
              payment mechanics, renewal and concentration metrics, compute costs, the fully diluted cap table, and
              every liquidation preference. Technical diligence should connect model outputs to independently reviewed
              wet-lab results and partner program progression. Commercial diligence should confirm which relationships
              are paid, recurring, expanded, or merely exploratory. The thesis breaks if repeat deployments fail to
              convert into disclosed economics, a major partner disengages, independent validation materially
              underperforms company claims, or a new round requires structurally senior terms at or below the latest
              mark.
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public Evidence Does Not Support a Precise Fair Value
            body: >-
              The $3.8B mark is a financing observation, not an independently derived valuation. Revenue, margins, cash
              flow, deal economics, ownership, and preferences are required before a return model can be relied upon.
            calloutType: risk
            claimRefs:
              - CV003
              - CV007
              - CV014
              - CV015
          - type: callout
            title: Gate Investment on Auditable Economics
            body: >-
              Maintain a research-more stance until management provides audited operating data, contract-level payment
              mechanics, partner concentration and retention, compute costs, and the fully diluted preference stack.
            calloutType: recommendation
            claimRefs:
