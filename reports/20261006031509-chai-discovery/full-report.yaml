      - number: '1.3'
        title: Financing History, Valuation Trajectory, and Scale Disclosures
        blocks:
          - type: paragraph
            body: >-
              The company has maintained an aggressive fundraising velocity across four institutional venture rounds,
              accumulating approximately $620 million in total equity financing between September 2024 and July 2026.
              Following an initial $20.17 million to $30 million seed round and a $70 million Series A led by Menlo
              Ventures at a $550 million valuation in August 2025, Chai achieved unicorn status in December 2025 through
              a $130 million Series B at a $1.3 billion valuation led by Oak HC/FT and General Catalyst. In July 2026,
              Chai closed a $400 million Series C financing round that valued the company at $3.8 billion post-money,
              co-led by Index Ventures with participation from Sapphire Ventures, Sequoia Capital, Kleiner Perkins, and
              Baillie Gifford. While capitalization is substantial, operating metrics including annual recurring
              revenue, burn rate, exact customer contract values, and verified headcount remain undisclosed private
              data.
