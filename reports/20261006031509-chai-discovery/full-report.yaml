  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Segmentation and Platform Economics
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery commercializes its biological foundation models primarily by targeting top-tier global
              pharmaceutical companies and commercial biotechs seeking to accelerate therapeutic biologics discovery.
              The company operates as a pure-play software and platform provider, offering access to its closed-source
              generative antibody design models alongside custom model variants fine-tuned on customer proprietary data.
              Rather than pursuing the traditional biotech co-development model that couples discovery milestones with
              downstream net-sales royalties, Chai intentionally monetizes through platform access and software
              licensing fees. This approach allows enterprise partners to retain full intellectual property ownership
              over resulting drug candidates and custom model weights, but it shifts the economic burden onto recurring
              contract renewals and limits Chai's ability to capture long-tail asset upside. Academic and early-stage
              computational researchers form a secondary adoption segment that utilizes the free, open-weights Chai-1
              structure prediction model, functioning primarily as a top-of-funnel validation mechanism rather than a
              direct monetization driver.
            claimRefs:
