      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: High Account Concentration and Asymmetric Value Capture
            body: >-
              Chai Discovery's enterprise commercial strategy is subject to acute customer concentration risk: all
              confirmed commercial deployments are concentrated across just four pharmaceutical accounts (Lilly, Pfizer,
              Novartis, and BMS). By structuring contracts as software access and model licensing agreements without
              downstream milestone or royalty participation, Chai limits its revenue capture to annual fees regardless
              of whether customer molecules reach multi-billion-dollar commercial sales.
