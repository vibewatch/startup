chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Platform Business Model
        blocks:
          - type: paragraph
            body: >-
              Chai Discovery is an early-stage private biotechnology and artificial intelligence platform company
              headquartered in San Francisco, California. The company was founded in 2024 by Joshua Meier, Jack Dent,
              Matthew McPartlon, and Jacques Boitreaud to develop a computer-aided design suite for molecular and
              therapeutic biological structures. The company's technical vision emerged from research collaborations
              exploring language model architectures applied to proteomics, initially incubated within OpenAI's San
              Francisco offices with seed backing from OpenAI, Thrive Capital, and Dimension. Chai operates a commercial
              software and platform access model rather than an asset-centric drug pipeline, licensing closed-source
              foundation models and training custom proprietary models for pharmaceutical partners while releasing early
              structure-prediction weights to the research community.
