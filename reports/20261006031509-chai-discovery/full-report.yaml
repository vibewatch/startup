              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated two-tier access
            body: >-
              Chai can seed technical adoption through a self-operated structure model while reserving frontier design
              capability for enterprise relationships.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
          - type: callout
            title: Contract structure may determine moat quality
            body: >-
              Public sources do not disclose whether partner-specific data and custom-model learning can compound across
              customers; data rights and bespoke engineering load require contract review.
            calloutType: risk
            claimRefs:
