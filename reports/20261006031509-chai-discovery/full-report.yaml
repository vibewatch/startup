            body: >-
              While public model architectures risk rapid commoditization as foundation models evolve across the
              industry, Chai's deployment model builds switching barriers by retraining custom model weights on each
              pharmaceutical customer's proprietary data. These private models become deeply embedded in partner
              discovery pipelines, creating high operational and technical friction against switching to rival AI
              platforms.
