  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Profile and Threat Landscape
        blocks:
          - type: paragraph
            body: >-
              Evaluating Chai Discovery as an AI-driven biologics platform requires dissecting the tension between
              breakthrough computational claims and the harsh realities of drug discovery. The company has raised over
              $230 million across Seed, Series A, and Series B rounds, achieving a $1.3 billion valuation [CR001,
              CR006]. However, its entire commercial posture centers on two disclosed biopharma collaborations: a
              landmark multi-target partnership with Eli Lilly announced in January 2026 and a multi-target antibody
              collaboration with Bristol Myers Squibb announced in August 2026 [CR002, CR003, CR004]. Neither agreement
              discloses upfront fees, research milestones, commercial royalties, or budget run-rates [CR003, CR007].
              This concentration exposes Chai Discovery to binary counterparty execution risk: if pilot design cycles
              fail to yield viable leads that survive biopharma wet-lab validation, the commercial foundation dissolves.


              From a technical perspective, Chai-2's reported ~20% hit rate in de novo antibody generation represents an
              extraordinary claimed leap over legacy computational methods that typically operated at 0.1% efficiency
              [CR001, CR006]. Yet because Chai operates strictly upstream as a software and modeling platform without
              its own clinical pipeline, its outputs must survive stringent external developability, solubility,
              immunogenicity, and manufacturing filters before reaching first-in-human trials [CR002, CR008]. While
              BreachHistory records zero catalogued cybersecurity breaches or regulatory enforcement actions for Chai
              Discovery through 2026 [CR005], cybersecurity, model theft, and integrity risks remain paramount when
              co-training models on proprietary partner data [CR008]. Furthermore, academic literature highlights how AI
              agents in cryptographic software security can uncover systemic library-level misuse, underscoring the
              broader risk of automated AI systems making ungrounded assumptions in high-stakes environments [CR009].
            claimRefs:
              - CR001
              - CR002
              - CR003
