chapter:
  number: 7
  title: "Risks"
  summary: "Chai Discovery faces acute customer and partner concentration with Eli Lilly and Bristol Myers Squibb, where undisclosed deal economics leave revenue and runway unverified. Substantial technical and wet-lab replication hurdles persist around Chai-2's claimed 20% hit rate, while clinical translation, safety, and developability filters remain entirely dependent on external biopharma partners."
sections:
  - id: "executive-risk-assessment"
    title: "Executive Risk Profile and Threat Landscape"
    body: "Evaluating Chai Discovery as an AI-driven biologics platform requires dissecting the tension between breakthrough computational claims and the harsh realities of drug discovery. The company has raised over $230 million across Seed, Series A, and Series B rounds, achieving a $1.3 billion valuation [CR001, CR006]. However, its entire commercial posture centers on two disclosed biopharma collaborations: a landmark multi-target partnership with Eli Lilly announced in January 2026 and a multi-target antibody collaboration with Bristol Myers Squibb announced in August 2026 [CR002, CR003, CR004]. Neither agreement discloses upfront fees, research milestones, commercial royalties, or budget run-rates [CR003, CR007]. This concentration exposes Chai Discovery to binary counterparty execution risk: if pilot design cycles fail to yield viable leads that survive biopharma wet-lab validation, the commercial foundation dissolves.\n\nFrom a technical perspective, Chai-2's reported ~20% hit rate in de novo antibody generation represents an extraordinary claimed leap over legacy computational methods that typically operated at 0.1% efficiency [CR001, CR006]. Yet because Chai operates strictly upstream as a software and modeling platform without its own clinical pipeline, its outputs must survive stringent external developability, solubility, immunogenicity, and manufacturing filters before reaching first-in-human trials [CR002, CR008]. While BreachHistory records zero catalogued cybersecurity breaches or regulatory enforcement actions for Chai Discovery through 2026 [CR005], cybersecurity, model theft, and integrity risks remain paramount when co-training models on proprietary partner data [CR008]. Furthermore, academic literature highlights how AI agents in cryptographic software security can uncover systemic library-level misuse, underscoring the broader risk of automated AI systems making ungrounded assumptions in high-stakes environments [CR009]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-exposure"
    title: "Regulatory, Intellectual Property, and Legal Exposure"
    body: "Chai Discovery's business model is modality-led rather than indication-led, positioning the company as a partner-facing software and molecular design engine [CR002]. Consequently, Chai does not operate clinical-stage therapeutic assets or file direct Investigational New Drug (IND) applications with regulatory agencies like the FDA [CR002, CR008]. Instead, regulatory scrutiny is borne indirectly through partner programs as partner-tested candidate molecules advance toward IND-enabling studies [CR002]. If an AI-designed sequence exhibits off-target toxicity, unfavorable pharmacokinetic properties, or unexpected immunogenicity in mammalian cell assays, the liability manifests as program termination by the pharmaceutical licensee rather than regulatory enforcement against Chai directly [CR008].\n\nIntellectual property presents a structural challenge. The collaboration with Eli Lilly includes creating a bespoke custom model trained on Lilly's proprietary screening and target data [CR002, CR008]. In biopharma partnerships, pharmaceutical sponsors typically demand exclusive ownership or first commercial rights over molecules designed for their targets [CR008]. This structure restricts Chai from commercializing discovered candidate sequences independently and raises unresolved questions regarding who retains ownership of the underlying fine-tuned model weights and learned biological representations [CR008]. Although no litigation, intellectual property disputes, or regulatory sanctions have been publicly filed against Chai Discovery [CR002, CR005], the lack of public patent disclosures leaves the enforceability of AI-generated molecular claims in uncharted legal territory."
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR008"
    tableRefs:
      - "TR002"
  - id: "operational-partner-dependencies"
    title: "Operational, Quality, and Counterparty Dependencies"
    body: "Operationally, Chai Discovery functions as an asset-light computational platform with an estimated team size under 50 employees, co-founded by researchers from OpenAI, Meta FAIR, and Stripe [CR001, CR002, CR006]. Governance was reinforced in 2025 by appointing Dr. Mikael Dolsten, former Chief Scientific Officer of Pfizer, to the board of directors [CR001, CR002]. Despite this blue-chip governance, the company remains highly dependent on external computing clusters and partner wet-lab infrastructure [CR001, CR008]. Chai does not report clinical trial results or maintain large in-house wet-lab facilities; its internal validation relies on computational benchmarks and selected in vitro screening [CR002].\n\nThis operational posture creates critical counterparty exposure. The Eli Lilly agreement involves a Lilly-exclusive custom model, while the Bristol Myers Squibb partnership deploys Chai's molecular folding and design models across BMS's antibody discovery portfolio [CR002, CR003, CR004]. Because neither Lilly nor BMS has disclosed contract durations, termination clauses, or minimum spend commitments, either partner could reallocate resources or pivot to rival AI platforms like Schrödinger or Insilico Medicine without public warning [CR007, CR008]. Furthermore, without disclosed recurring revenue or ARR figures, Chai's cash burn is financed predominantly by equity funding [CR001, CR007]. If commercial adoption stalls or biopharma partners fail to advance candidates into the clinic, Chai will face severe down-round or recapitalization risk when returning to private capital markets."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR003"
