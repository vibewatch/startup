callouts:
  - calloutType: "risk"
    title: "Critical Partner Concentration and Undisclosed Deal Economics"
    body: "Chai Discovery's $1.3B private valuation is anchored almost entirely on its collaborative pacts with Eli Lilly and Bristol Myers Squibb. However, neither company has disclosed upfront cash payments, research commitments, or downstream milestone tiers. If partner wet-lab evaluations show that in silico binders fail to meet developability or safety thresholds, Chai has no fallback internal pipeline to generate clinical value."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "The Developability and Translation Chasm in AI Biologics"
    body: "Generating a high-affinity binder in a computer model is only the initial step of antibody engineering. Candidate molecules must clear rigorous stability, solubility, low immunogenicity, and manufacturing yield filters. Because Chai does not own wet-lab CMC infrastructure, it is entirely reliant on partners to validate whether Chai-2 designs represent viable pharmaceutical products or computational artifacts."
    claimRefs:
      - "CR002"
      - "CR006"
      - "CR008"
