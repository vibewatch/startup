    keyQuote: >-
      Chai Discovery uses AI to help create new medicines, from designing antibodies to speeding up how drugs are
      developed. The startup was founded by former OpenAI staffer Josh Meier, former Stripe staffer Jack Dent, along
      with Matthew McPartlon and Jacques Boitreaud. The AI giant then became one of its early investors through a $30
      million seed round in 2024. The company has already landed a partnership with Eli Lilly to accelerate the
      discovery of new drugs before the clinical trial phase. In December, Chai raised $130 million at a $1.3 billion
      valuation.
    canonical: SM006
  - id: SI008
    publisher: Goose Substack
    title: Chai Discovery Raised $400M. Here's Where AI Actually Displaces Drug Discovery Labor and Where It Doesn't.
    url: https://goose673120.substack.com/p/chai-discovery-raised-400m-heres
    date: '2026-07-27'
    accessDate: '2026-10-06'
    accessStatus: ok
    stance: adverse
    sourceType: analyst-market-data
    reputationTier: medium
    independence: independent
    topics:
      - unit-economics
      - revenue-model
      - commercial-traction
    keyQuote: >-
      Chai’s near-term revenue is entirely software-native: pharma companies pay for platform access and per-project
      design runs on Chai-2 and Chai-3. The higher-value layer, milestone payments and royalties on drug candidates that
      advance through clinical trials using Chai-designed molecules, won’t materialize at scale for three to seven
      years. Chai’s revenue growth between now and 2030 depends almost entirely on expanding the pharma customer base
      beyond Lilly and Pfizer and converting the open-source Chai-1 user base into paid commercial relationships. The
      conversion rate from open-source research users to paying commercial customers has not been publicly disclosed.
