evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pharma-contract-economics
    missingEvidence: >-
      Disclosed baseline annual recurring revenue (ARR), seat license pricing tiers, and upfront software fee breakdowns
      for Eli Lilly, Pfizer, and Bristol Myers Squibb agreements.
    whyItMatters: >-
      Without disclosed contract economics, isolating pure software SAM/SOM from speculative milestone biobucks relies
      on industry peer proxies.
    diligencePath: Request confidential commercial customer schedule or audited revenue breakout during data room review.
  - type: conflicting-data
    severity: material
    topic: market-sizing-discrepancies
    missingEvidence: >-
      Reconciliation of sector-wide 2025 AI drug discovery venture funding figures between PitchBook reported $3.8B and
      $11.4B figures.
    whyItMatters: >-
      Broad discrepancies in published venture deal totals obscure true sector capital velocity and addressable software
      spend.
    diligencePath: >-
      Cross-reference PitchBook raw deal-level transaction logs against BioWorld and Rock Health sector classification
      taxonomies.
  - type: private-evidence-only
    severity: material
    topic: data-governance
    missingEvidence: >-
      Executed customer contracts covering output ownership, aggregate learning rights, data retention, model-training
      reuse, termination, portability, and exclusivity.
    whyItMatters: >-
      These terms determine whether partner data compounds into a platform advantage or creates customer-specific silos
      and switching costs.
    diligencePath: >-
      Review standard and flagship-customer agreements, data-processing addenda, model cards, and an architecture-level
      data-flow walkthrough.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent, peer-reviewed, like-for-like replication of Chai design outcomes against named competitors and
      internal discovery baselines.
    whyItMatters: >-
      Vendor studies and heterogeneous reviews cannot establish relative hit quality, cycle time, developability, or
      total cost on a common population.
    diligencePath: >-
      Commission a blinded bake-off on historical targets with a shared protocol, denominators, assay definitions,
      failure criteria, and full cost accounting.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      Exhaustive current census of molecular-design platforms, wet-lab-integrated AI companies, incumbent software
      vendors, and relevant internal-build programs.
    whyItMatters: >-
      A representative shortlist may omit emerging entrants or incumbent bundling that changes pricing pressure and
      distribution leverage.
    diligencePath: >-
      Run a procurement-led longlist and obtain current product, pricing, security, integration, reference-customer, and
      roadmap responses under a common RFP.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue-scale
    missingEvidence: >-
      Audited financial statements confirming Annual Recurring Revenue (ARR), contract values, and recognized software
      revenue across enterprise pharmaceutical partnerships.
    whyItMatters: >-
      Without verified ARR or contract terms, the revenue multiple backing Chai Discovery's $3.8B valuation cannot be
      independently underwritten.
    diligencePath: >-
      Request confidential data room access to view audited income statements and customer contract schedules under a
      non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-compute-costs
    missingEvidence: >-
      Detailed breakdown of cloud compute expenditures (GPU cluster hosting and inference infrastructure) relative to
      software licensing gross receipts.
    whyItMatters: >-
      Determines whether Chai Discovery demonstrates software-scale gross margins of 70% to 80% or faces heavy
      compute-delivery gross margin compression.
    diligencePath: >-
      Obtain management accounts detailing hosting and cloud compute cost of goods sold (COGS) relative to contract
      revenues.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: open-source-conversion-rate
    missingEvidence: >-
      Quantitative conversion metrics from free Chai-1 open research users to paid Chai-2 and Chai-3 enterprise platform
      customers.
    whyItMatters: >-
      Evaluates the efficiency of Chai's product-led growth flywheel and whether open scientific tooling drives
      repeatable commercial pipeline expansion.
    diligencePath: >-
      Request sales pipeline attribution data linking inbound enterprise procurement leads to prior Chai-1 research
      usage.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: clinical-reproducibility
    missingEvidence: >-
      Independent peer-reviewed publication of wet-lab replication data confirming Chai-2's 15–20% binding hit rate and
      developability profile across non-proprietary antigen targets.
    whyItMatters: >-
      Current hit rates and developability metrics derive exclusively from company-issued technical updates and press
      materials, leaving scientific reproducibility unverified by third-party laboratories.
    diligencePath: >-
      Review independent academic or partner benchmarking studies, or examine blinded wet-lab validation datasets in a
      technical diligence data room.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: partner-retention-and-contract-duration
    missingEvidence: >-
      Contract duration, annual contract values (ACV), billing milestones, and multi-year renewal commitments for Eli
      Lilly, Pfizer, Novartis, and Bristol Myers Squibb.
    whyItMatters: >-
      Without contract terms, investors cannot determine whether Chai's revenue stream is recurring enterprise SaaS or
      ephemeral one-off research evaluation access.
    diligencePath: >-
      Inspect customer master service agreements (MSAs) and statement of work (SOW) documents in the confidential data
      room.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: wet-lab-reproducibility-and-target-progression
    missingEvidence: >-
      Experimental wet-lab validation and developability data demonstrating whether de novo designed antibodies from
      partner programs successfully advance toward IND filing.
    whyItMatters: >-
      If in silico designed candidates encounter developability, solubility, or off-target binding liabilities in
      partner laboratories, contract renewal and expansion will be severely impaired.
    diligencePath: Review blinded customer assay reports and preclinical pipeline progression milestones.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: commercial-deal-economics
    missingEvidence: >-
      Upfront cash payments, milestone fee structures, and commercial royalty terms for the Eli Lilly and Bristol Myers
      Squibb partnerships.
    whyItMatters: >-
      Without disclosed contract terms, Chai's cash runway, customer concentration, and recurring revenue cannot be
      verified independently.
    diligencePath: Review master collaboration agreements and partnering data rooms under confidential disclosure agreement.
    relatedQuestionRefs:
      - QR003
      - QR005
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: wet-lab-reproducibility
    missingEvidence: >-
      Peer-reviewed wet-lab validation datasets replicating Chai-2's claimed 20% de novo antibody hit rate on
      challenging targets.
    whyItMatters: >-
      Platform valuation and partner adoption depend on whether in vitro binding rates hold across diverse
      partner-selected antigens.
    diligencePath: >-
      Audit blinded partner experimental screening logs and independent third-party cryo-EM structural verification
      data.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-enumeration
    missingEvidence: >-
      Comprehensive catalog of all global regulatory submissions, pre-IND meeting minutes, and patent prosecution
      filings across partner pipelines.
    whyItMatters: >-
      Confirms whether Chai-designed molecules are progressing through formal IND-enabling safety and toxicology
      testing.
    diligencePath: Monitor partner biopharma clinical pipeline disclosures and USPTO patent examination dockets.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: >-
      Fully diluted ownership, option pool, liquidation preferences, participation rights, anti-dilution terms, and debt
      or other senior claims.
    whyItMatters: Downside proceeds and investor returns cannot be modeled from round headline values alone.
    diligencePath: Reconcile the cap table, charter, financing documents, and waterfall model in the data room.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited revenue, gross margin, cash burn, cash balance, compute costs, and contract-level payment mechanics.
    whyItMatters: These inputs are necessary to test whether the $3.8B financing mark is supported by operating performance.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, customer contracts, invoices, and a revenue-quality
      schedule.
    relatedQuestionRefs:
      - QV002
      - QV004
      - QV007
  - type: missing-source
    severity: material
    topic: exit readiness
    missingEvidence: A disclosed exit plan, timing window, target return, and evidence of public-market or strategic-buyer readiness.
    whyItMatters: Without an exit path, the holding period and return profile cannot be estimated credibly.
    diligencePath: Request board materials, long-range financing plans, strategic-buyer discussions, and IPO-readiness workstreams.
    relatedQuestionRefs:
      - QV007
