  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: data-governance
      missingEvidence: >-
        Executed customer contracts covering output ownership, aggregate learning rights, data
        retention, model-training reuse, termination, portability, and exclusivity.
      whyItMatters: >-
        These terms determine whether partner data compounds into a platform advantage or creates
        customer-specific silos and switching costs.
      diligencePath: >-
        Review standard and flagship-customer agreements, data-processing addenda, model cards, and
        an architecture-level data-flow walkthrough.
      relatedQuestionRefs: [QP006, QP007]
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: >-
        Independent, peer-reviewed, like-for-like replication of Chai design outcomes against named
        competitors and internal discovery baselines.
      whyItMatters: >-
        Vendor studies and heterogeneous reviews cannot establish relative hit quality, cycle time,
        developability, or total cost on a common population.
      diligencePath: >-
        Commission a blinded bake-off on historical targets with a shared protocol, denominators,
        assay definitions, failure criteria, and full cost accounting.
      relatedQuestionRefs: [QP003, QP007, QP008]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-landscape
      missingEvidence: >-
        Exhaustive current census of molecular-design platforms, wet-lab-integrated AI companies,
        incumbent software vendors, and relevant internal-build programs.
      whyItMatters: >-
        A representative shortlist may omit emerging entrants or incumbent bundling that changes
        pricing pressure and distribution leverage.
      diligencePath: >-
        Run a procurement-led longlist and obtain current product, pricing, security, integration,
        reference-customer, and roadmap responses under a common RFP.
      relatedQuestionRefs: [QP001]
      relatedTableRefs: [TP001]
